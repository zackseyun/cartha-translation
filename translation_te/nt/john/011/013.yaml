id: JHN.11.13
reference: John 11:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: te
  text: యేసు లాజరు మరణం గురించే ముందే చెప్పాడు. కానీ, ఆయన నిద్రపోవడం గురించి మాట్లాడుతున్నాడని వారు అనుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నిద్ర యొక్క నిద్ర.” అంటే, మరణాన్ని సూచించే రూపకమైన నిద్ర కాకుండా నిజంగా నిద్రపోవడం.
    reason: మూలంలోని τῆς κοιμήσεως τοῦ ὕπνου అనే పునరుక్తి నిర్మాణాన్ని చూపించి, శిష్యుల అపార్థాన్ని స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: εἰρήκει
  choice: చెప్పాడు
  rationale: పూర్వభూతకాల రూపం శిష్యులు అలా అనుకోవడానికి ముందు యేసు చెప్పిన మాటను సూచిస్తుంది. తెలుగు సందర్భంలో ‘చెప్పాడు’ సహజంగా ఈ క్రమాన్ని తెలియజేస్తుంది.
- source_word: δὲ ... δὲ
  choice: అయితే
  rationale: మొదటి δέకు ప్రత్యేక పదం అవసరం లేకుండా వాక్యప్రవాహంలో ఉంచి, రెండవ δέ సూచించే వ్యత్యాసాన్ని ‘అయితే’తో స్పష్టంగా తెలిపాం.
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: లాజరు మరణం గురించి
  rationale: περί అంటే ‘గురించి’; αὐτοῦ సందర్భంలో లాజరును సూచిస్తుంది. తెలుగులో ‘అతని’ అని ఉంచితే యేసు మరణమనే అపార్థానికి అవకాశం ఉండడం వల్ల సందర్భానుసారంగా లాజరు పేరును స్పష్టం చేశాం.
- source_word: ἐκεῖνοι
  choice: వారు
  rationale: ఇది సందర్భంలో ఉన్న శిష్యులను సూచిస్తుంది; ఆధునిక తెలుగులో ‘వారు’ సహజమైన రూపం.
- source_word: ἔδοξαν
  choice: అనుకున్నారు
  rationale: శిష్యుల పొరపాటు అవగాహనను సహజంగా తెలియజేస్తుంది.
- source_word: περὶ τῆς κοιμήσεως τοῦ ὕπνου
  choice: నిద్రపోయి విశ్రాంతి తీసుకోవడం గురించి
  rationale: కోయిమేసిస్ మరియు హ్యుప్నోస్ కలయిక ఇక్కడ మరణానికి రూపకమైన నిద్రను కాక, నిజమైన శారీరక నిద్రను వారు అర్థం చేసుకున్నారని సూచిస్తుంది. మూలంలోని అసాధారణ పునరుక్తిని పాదసూచికలో నిలిపాం.
- source_word: λέγει
  choice: మాట్లాడుతున్నాడని
  rationale: రూపరీత్యా వర్తమానకాలమైనా ఇది కథన సందర్భంలో చారిత్రక వర్తమానం; ‘అనుకున్నారు’తో కలిపి తెలుగులో ఈ రూపం సహజంగా ఉంటుంది.
theological_decisions:
- issue: మరణాన్ని ‘నిద్ర’గా పేర్కొనడం మృతుల స్థితి గురించి ఏదైనా నిర్దిష్ట సిద్ధాంతాన్ని బోధిస్తుందా?
  choice: యేసు ఉద్దేశం లాజరు మరణమని, శిష్యులు దాన్ని శారీరక నిద్రగా అపార్థం చేసుకున్నారని మాత్రమే అనువదించాం.
  alternative: ఆత్మ నిద్ర లేదా మధ్యస్థితి గురించి ఒక నిర్దిష్ట సిద్ధాంతాన్ని సూచించే పదజాలం వాడడం.
  rationale: ఈ వచనం కథనంలోని రూపకం–అపార్థం వ్యత్యాసాన్ని వివరిస్తుంది; మృతుల స్థితి గురించి అదనపు సిద్ధాంత నిర్ణయాన్ని మూలపాఠం ఇక్కడ చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని పునరుక్తిని ప్రధాన వాక్యంలో కృత్రిమంగా ఉంచకుండా, దాని రూపాన్ని పాదసూచికలో సంరక్షించాం.
