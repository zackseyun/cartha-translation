    text: లేదా, “నీ సోదరుడు లేస్తాడు.” గ్రీకు క్రియను కేవలం “లేస్తాడు” అని కూడా అనువదించవచ్చు; “తిరిగి” అనే పదం ఇక్కడ మరణం నుండి లేవడమనే భావాన్ని స్పష్టం చేస్తుంది.
