lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకు మూలంలో కథన వర్తమాన కాలం ఉన్నా, ఆధునిక సహజ తెలుగు కథనంలో భూతకాల రూపం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: αὐτῇ
  choice: ఆమెతో
  rationale: ‘ఆమెకు చెప్పాడు’ అనే భావాన్ని తెలుగు మాటల ప్రవేశ నిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: Ἀναστήσεται
  choice: తిరిగి లేస్తాడు
  rationale: భవిష్యత్ మధ్యమ రూపం ఇక్కడ మృతులలోనుండి లేవడాన్ని సూచిస్తుంది; ‘లేపబడతాడు’ అని అనువదిస్తే మూలంలో ప్రత్యక్షంగా లేని కర్మణి భావం, దైవ కార్యసాధకత్వం ముందుకు వస్తాయి.
- source_word: ὁ ἀδελφός σου
  choice: నీ సోదరుడు
  rationale: స్వామ్యాన్ని సహజ తెలుగులో వ్యక్తపరుస్తూ, సందర్భంలోని మార్త సోదరుడైన లాజరును సూచిస్తుంది.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: వ్యక్తినామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో ఇచ్చాం; గ్రీకు నిర్దేశక ఉపపదాన్ని విడిగా అనువదించాల్సిన అవసరం లేదు.
theological_decisions:
- issue: పునరుత్థాన పదప్రయోగం
  choice: తిరిగి లేస్తాడు
  alternative: లేస్తాడు; లేపబడతాడు
  rationale: ఈ మాట సోదరుడు మరణం నుండి లేస్తాడనే హామీని తెలియజేస్తుంది; అది తక్షణ పునర్జీవమా లేక అంత్యదిన పునరుత్థానమా అనే ఉద్వేగాన్ని ఈ వాక్యం స్వయంగా పరిష్కరించదు. ‘లేపబడతాడు’ అనడం మూలంలోని రూపం కంటే దైవ కార్యసాధకత్వాన్ని మరింత ప్రత్యక్షం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. యేసు మార్తతో నేరుగా మాట్లాడుతున్న సందర్భానికి అనుగుణంగా ఏకవచన ‘నీ’ వాడబడింది. మూలంలోని కథన వర్తమానాన్ని తెలుగు సహజ కథన భూతకాలంగా మార్చాం.
