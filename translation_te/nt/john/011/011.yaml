source:
  edition: SBLGNT
  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: te
  text: ఈ మాటలు చెప్పిన తర్వాత ఆయన వారితో, “మన స్నేహితుడు లాజరు నిద్రపోయాడు[a]. అయితే అతన్ని మేల్కొల్పడానికి నేను వెళ్తున్నాను” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “నిద్రపోయాడు” అంటే “చనిపోయాడు” అని భావం. యేసు మరణాన్ని నిద్రగా రూపకంగా చెప్పాడు; తరువాతి వచనాల్లో శిష్యులు ఆయన మాటను మొదట అపార్థం చేసుకున్నారు.
    reason: రూపకార్థ వివరణ
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο
  choice: ఈ మాటలు చెప్పిన తర్వాత
  rationale: ముందటి సంభాషణను సూచించే బహువచన భావాన్ని, ఆ తర్వాతి కాలక్రమాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: λέγει αὐτοῖς
  choice: ఆయన వారితో ... అని అన్నాడు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు కథనశైలిలో భూతకాలంగా వ్యక్తం చేసింది.
- source_word: Λάζαρος ὁ φίλος ἡμῶν
  choice: మన స్నేహితుడు లాజరు
  rationale: సంబంధ భావాన్ని సహజంగా నిలుపుతూ పేరును ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరించింది.
- source_word: κεκοίμηται
  choice: నిద్రపోయాడు
  rationale: ఇక్కడ మరణాన్ని సూచించే రూపకాన్ని ముందుగానే విప్పకుండా, తరువాతి వచనాల్లోని అపార్థానికి అవసరమైన కథన ఉద్వేగాన్ని కాపాడుతుంది.
- source_word: ἀλλὰ πορεύομαι
  choice: అయితే ... నేను వెళ్తున్నాను
  rationale: లాజరు స్థితికి యేసు చేయబోయే కార్యానికి మధ్య ఉన్న వ్యత్యాసాన్ని, సమీప ఉద్దేశపూర్వక ప్రయాణ భావాన్ని తెలియజేస్తుంది.
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: అతన్ని మేల్కొల్పడానికి
  rationale: ἵνα యొక్క ఉద్దేశార్థాన్ని సహజమైన తెలుగు క్రియారూపంతో వ్యక్తం చేస్తూ నిద్ర రూపకాన్ని కొనసాగిస్తుంది.
theological_decisions:
- issue: κεκοίμηται అనే పదాన్ని నేరుగా ‘చనిపోయాడు’ అని అనువదించాలా, లేక నిద్ర రూపకాన్ని నిలుపాలా
  choice: ప్రధాన పాఠ్యంలో ‘నిద్రపోయాడు’ అని రూపకాన్ని నిలుపడం
  alternative: చనిపోయాడు
  rationale: యేసు ఉద్దేశపూర్వకంగా నిద్ర రూపకాన్ని ఉపయోగిస్తాడు; తరువాతి వచనాల్లో శిష్యులు దానిని అక్షరార్థంగా అపార్థం చేసుకుంటారు. అందువల్ల వివరణను ముందుగానే ప్రధాన పాఠ్యంలో చేర్చకుండా అసలు కథన ఉద్వేగాన్ని కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘నిద్రపోయాడు—మేల్కొల్పడానికి’ అనే పదజంట ద్వారా మూలంలోని రూపక సంబంధం స్పష్టంగా నిలుపబడింది.
