  text: ἦν δὲ ⸀ἡ Βηθανία ἐγγὺς τῶν Ἱεροσολύμων ὡς ἀπὸ σταδίων δεκαπέντε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/018.yaml
  text: Bethany was near Jerusalem[a], about fifteen stadia away.
translation:
  language: te
  text: బేతనియ యెరూషలేముకు దగ్గరగా, దాదాపు పదిహేను స్టేడియాల[a] దూరంలో ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దాదాపు మూడు కిలోమీటర్లు.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానకం మాత్రమే; బలమైన వ్యతిరేకతను గానీ కాలార్థకమైన ‘ఇప్పుడు’ను గానీ సూచించదు. తెలుగు వాక్యప్రవాహంలో ప్రత్యేక అనుసంధాన పదం లేకుండానే సహజంగా ఉంది.
- source_word: ἡ Βηθανία
  choice: బేతనియ గ్రామం
  rationale: స్థల నామాన్ని తెలుగు సంప్రదాయ రూపంలో లిప్యంతరీకరించాం; ఇది ఒక ఊరని ఆధునిక పాఠకునికి స్పష్టం చేయడానికి ‘గ్రామం’ చేర్చాం.
- source_word: ἐγγὺς τῶν Ἱεροσολύμων
  choice: యెరూషలేముకు దగ్గరగా
  rationale: ἐγγύς ఇక్కడ భౌగోళిక సమీపాన్ని సూచిస్తుంది; ‘దగ్గరగా’ సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ὡς
  choice: దాదాపు
  rationale: కొలతతో వచ్చిన ὡς సుమారు పరిమాణాన్ని సూచిస్తుంది; ‘దాదాపు’ ఆ అనిశ్చితిని నిలుపుతుంది.
- source_word: ἀπὸ σταδίων δεκαπέντε
  choice: పదిహేను స్టేడియాల దూరంలో
  rationale: మూల సంస్కృతికి చెందిన దూర ప్రమాణాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ἀπό సూచించే దూర భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ప్రాచీన కొలమానాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ఆధునిక సమాన విలువను పాదసూచికలో ఇచ్చాం.
