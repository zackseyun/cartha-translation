  verdict: revise
  source_fidelity: The rendering accurately conveys Bethany's proximity to Jerusalem and the approximate distance of fifteen stadia. However, «గ్రామం» (“village”) adds a classification not expressed in the Greek text or retained in the English audit trail; it is unnecessary here.
  naturalness: The sentence is clear and natural in modern standard Telugu. Removing the added noun makes it slightly more concise while preserving fluent narrative style.
  terminology: «బేతనియ», «యెరూషలేము», and «స్టేడియాలు» are suitable standard forms. The footnote's approximate metric equivalent appropriately supports, rather than replaces, the ancient measure.
  issues:
  - severity: low
    issue: Added «గ్రామం» after the place name
    rationale: ἡ Βηθανία is simply the place name “Bethany.” Although Bethany may be described historically as a village, that information is not stated in this verse and should not be added to an optimal-equivalence translation.
  revised_text: బేతనియ యెరూషలేముకు దగ్గరగా, దాదాపు పదిహేను స్టేడియాల[a] దూరంలో ఉంది.
