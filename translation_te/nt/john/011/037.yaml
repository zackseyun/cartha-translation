  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: te
  text: అయితే వారిలో కొందరు, “గుడ్డివాని కళ్ళు తెరిచిన ఈ మనిషి, ఇతడు చనిపోకుండా ఉండేలా కూడా చేయలేకపోయాడా?” అని అన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ మనిషి ఇతనిని చనిపోకుండా కాపాడలేకపోయాడా?”
    reason: ποιῆσαι ἵνα అనే కారణాత్మక నిర్మాణాన్ని ‘కాపాడడం’గా సహజంగా వ్యక్తం చేసే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: అయితే వారిలో కొందరు
  rationale: ἐξ αὐτῶνను సహజంగా ‘వారిలో’ అని, δέ సూచించే ముందు మాటతో వ్యత్యాసాన్ని ‘అయితే’ అని వ్యక్తం చేశాం.
- source_word: εἶπαν
  choice: అని అన్నారు
  rationale: కథనంలోని aoristను సాధారణ భూతకాలంగా అనువదించాం.
- source_word: Οὐκ ἐδύνατο
  choice: చేయలేకపోయాడా?
  rationale: ఇది గత సామర్థ్యాన్ని ప్రశ్నించే ప్రతికూల అలంకార ప్రశ్న; తెలుగులో సహజమైన రూపాన్ని వాడాం.
- source_word: οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: గుడ్డివాని కళ్లు తెరిచిన ఈయన
  rationale: మొదటి οὗτος యేసును సూటిగా సూచిస్తుంది; articular participleను సహజమైన విశేషణ వాక్యాంశంగా ఇచ్చాం.
- source_word: ποιῆσαι ἵνα
  choice: చనిపోకుండా కూడా చేయడం
  rationale: ποιέω + ἵναలోని కారణాత్మక భావాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా నిలిపాం.
- source_word: καὶ οὗτος
  choice: ఇతడు ... కూడా
  rationale: καί యొక్క అదనపు భావాన్ని ‘కూడా’తో, రెండవ οὗτος లాజరును సూచిస్తుందని ‘ఇతడు’తో స్పష్టంగా ఉంచాం.
- source_word: μὴ ἀποθάνῃ
  choice: చనిపోకుండా
  rationale: ἵναతో కూడిన ప్రతికూల ఫలిత/ఉద్దేశ భావాన్ని తెలుగు infinitival నిర్మాణంలో సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: మాట్లాడినవారి ప్రశ్న స్వరం
  choice: యేసు లాజరు మరణాన్ని నివారించగల సామర్థ్యం గురించి విమర్శ కలిసిన అలంకార ప్రశ్నగా అనువదించడం
  alternative: ఎటువంటి విమర్శాత్మక ఛాయ లేని సాధారణ ప్రశ్నగా అనువదించడం
  rationale: Οὐκ ἐδύνατο రూపం ఆయన అలా చేయగలిగేవాడనే అంచనాను సూచిస్తుంది; అయితే మూలంలో లేని బహిరంగ నిందను జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే కథన గంభీరతను నిలిపే శైలి. ‘ఈయన’ యేసును, ‘ఇతడు’ లాజరును వేరుచేస్తాయి. పాదసూచిక గుర్తు ప్రధాన వచనంలో చేర్చబడింది.
