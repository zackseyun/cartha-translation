id: JHN.11.42
reference: John 11:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: te
  text: నీవు ఎల్లప్పుడూ నన్ను వింటావని నాకు తెలుసు. కానీ, చుట్టూ నిలబడి ఉన్న జనసమూహం కారణంగా నేను ఇలా చెప్పాను—నీవే నన్ను పంపించావని వారు నమ్మేందుకు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పాఠ్యంలో “నీవు” అనే సర్వనామం స్పష్టంగా ఉండి, దానికి ఉద్ఘాటన ఉంది.
    reason: మూలభాషలోని emphatic σύ ను తెలియజేయడం.
lexical_decisions:
- source_word: ᾔδειν
  choice: నాకు తెలుసు
  rationale: οἶδα యొక్క భూతకాల రూపమైనప్పటికీ, గతంలోనే తెలిసి ఇప్పటికీ వర్తించే జ్ఞానాన్ని సహజ తెలుగు వర్తమాన ప్రయోగం స్పష్టంగా తెలియజేస్తుంది.
- source_word: πάντοτέ μου ἀκούεις
  choice: నీవు ఎల్లప్పుడూ నా ప్రార్థన వింటావు
  rationale: ప్రార్థనా సందర్భంలో ἀκούω + genitive కేవలం శబ్దం వినడాన్ని కాక స్వీకారపూర్వకంగా వినడాన్ని సూచిస్తుంది; ‘నా ప్రార్థన’ అనేది సందర్భం నుంచి వచ్చిన సహజమైన స్పష్టీకరణ.
- source_word: ἀλλὰ διὰ τὸν ὄχλον
  choice: అయినా, ... జనసమూహం కోసం
  rationale: ἀλλά వ్యతిరేక భావాన్ని, διά + accusative కారణం లేదా ప్రయోజనాన్ని తెలియజేస్తాయి. తరువాతి ఉద్దేశ్య వాక్యాన్ని బట్టి ‘కోసం’ ఇక్కడ సహజంగా సరిపోతుంది.
- source_word: τὸν περιεστῶτα
  choice: చుట్టూ నిలబడి ఉన్న
  rationale: పరిసరంగా నిలిచి ఉన్న జనాన్ని సూచించే perfect participle యొక్క స్థలార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: εἶπον
  choice: ఇలా చెప్పాను
  rationale: యేసు అప్పుడే బహిరంగంగా పలికిన మాటలను సూచిస్తున్నందున, ‘ఇలా’ సందర్భసిద్ధమైన కనిష్ఠ స్పష్టీకరణ.
- source_word: ἵνα πιστεύσωσιν
  choice: వారు నమ్మేలా
  rationale: ἵνα + subjunctive తెలిపే ఉద్దేశ్యాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: నీవే నన్ను పంపించావని
  rationale: ప్రత్యక్షంగా ఉన్న σύ యొక్క ఉద్ఘాటనను ‘నీవే’ నిలుపుతుంది; ἀπέστειλας యొక్క aorist భావాన్ని ‘పంపించావు’ సహజంగా అందిస్తుంది.
theological_decisions:
- issue: తండ్రి యేసు మాట వినడం
  choice: తండ్రి యేసు ప్రార్థనను ఎల్లప్పుడూ వింటాడని, యేసుకు అది ముందే తెలుసని పాఠ్యం చెబుతున్నట్లే అనువదించబడింది.
  alternative: దీనిని సాధారణంగా సమాధానం పొందే ప్రార్థన గురించిన నియమంగా విస్తరించడం.
  rationale: సందర్భం లాజరును లేపడానికి ముందు యేసు చేసిన ప్రార్థన. ప్రత్యేక తండ్రి–కుమార సంబంధాన్ని గానీ సాధారణ ప్రార్థనా సిద్ధాంతాన్ని గానీ పాఠ్యాన్ని మించి వివరించలేదు.
- issue: బహిరంగంగా పలికిన మాటల ఉద్దేశ్యం
  choice: చుట్టూ ఉన్నవారు తండ్రే యేసును పంపాడని నమ్మేందుకు యేసు బహిరంగంగా పలికాడని ఉద్దేశ్య వాక్యాన్ని నిలిపాం.
  alternative: ఈ ఉద్దేశ్యాన్ని కేవలం ఆ అద్భుతం నిజమని నిర్ధారించడానికే పరిమితం చేయడం.
  rationale: ἵνα వాక్యం నేరుగా ‘నీవే నన్ను పంపించావని’ నమ్మడంపై దృష్టి పెడుతుంది; దాని పరిధిని అనువాదంలో తగ్గించలేదు లేదా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే ప్రార్థనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. ప్రధాన పాఠ్యంలో రెండు పాదసూచిక గుర్తులూ చేర్చబడ్డాయి.
