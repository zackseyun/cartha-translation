id: JHN.11.22
reference: John 11:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ νῦν οἶδα ὅτι ὅσα ἂν αἰτήσῃ τὸν θεὸν δώσει σοι ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: te
  text: అయినా, ఇప్పటికీ[a] నీవు దేవుని వద్ద ఏది అడిగినా దేవుడు నీకు ఇస్తాడని నాకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు ఇప్పుడు.” గ్రీకు సంధిపదాన్ని సాధారణంగా “మరియు” అని అనువదించవచ్చు; అయితే లాజరు మరణం గురించి మార్త చెప్పిన మాట తర్వాత, ఇక్కడ అది విరుద్ధమైన మలుపును కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: అయితే ఇప్పటికీ
  rationale: καί ఇక్కడ ముందటి మాటకు భిన్నమైన మలుపును సూచించగలదు; νῦν కాలార్థాన్ని నిలుపుతూ, ‘అయితే ఇప్పటికీ’ మార్తకు ఇంకా ఉన్న నమ్మకాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἶδα
  choice: నాకు తెలుసు
  rationale: పూర్తయిన క్రియారూపంలో ఉన్నప్పటికీ దీనికి వర్తమానార్థం ఉంది; తెలుగులో ‘నాకు తెలుసు’ సహజమైన, నేరమైన అనువాదం.
- source_word: ὅσα ἂν
  choice: ఏమి … అయినా
  rationale: సాపేక్ష సర్వనామంతో ἄν కలయిక అనిర్దిష్టమైన, విస్తృత పరిధిని సూచిస్తుంది; తెలుగులో ‘ఏమి అడిగినా’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: αἰτήσῃ τὸν θεὸν
  choice: దేవుణ్ణి … అడిగినా
  rationale: గ్రీకులో θεόν αἰτέωకు ప్రత్యక్ష కర్మ. తెలుగులో ఒక వ్యక్తిని ఏదైనా అడగడం అనే నిర్మాణం సహజం; మూలంలో లేని భావాన్ని చేర్చదు.
- source_word: δώσει σοι ὁ θεός
  choice: దేవుడు నీకు ఇస్తాడు
  rationale: భవిష్యత్ క్రియను, స్పష్టమైన కర్తను నేరుగా నిలుపుతుంది; ‘అనుగ్రహిస్తాడు’ కంటే ‘ఇస్తాడు’ δίδωμιకి మరింత సమీపం.
theological_decisions:
- issue: యేసు దేవుణ్ణి అడగడం, దేవుడు ఆయనకు ఇవ్వడం అనే మార్త మాటను యేసు దైవత్వానికి వ్యతిరేకంగా లేదా దానిని తప్పించుకునేలా అతివ్యాఖ్యానించే అవకాశం.
  choice: మార్త పలికిన మాటను సిద్ధాంతపరమైన విస్తరణ లేకుండా యథాతథంగా నిలుపుతూ, ‘నీవు దేవుణ్ణి ఏమి అడిగినా దేవుడు నీకు ఇస్తాడు’ అని అనువదించడం.
  alternative: ‘దేవుడు’ను ‘తండ్రి’గా విస్తరించడం లేదా సంబంధంలోని భేదం కనిపించకుండా వాక్యాన్ని మార్చడం.
  rationale: ఇది కథనంలో మార్త పలికిన మాట. యోహాను రచనలోని సంబంధపరమైన, క్రీస్తుశాస్త్ర సంబంధమైన ఉద్రిక్తతను అనువాదం మృదువుచేయకూడదు; అలాగే మూలంలో లేని సిద్ధాంతార్థాన్ని చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘దేవుణ్ణి ఏమి అడిగినా’ సాధారణ పాఠకులకు స్పష్టమైన ప్రార్థనా సందర్భపు వాడుక; రెండు θεός పదాలనూ ‘దేవుడు’గానే ఉంచి మూలంలోని పునరుక్తిని నిలిపింది.
