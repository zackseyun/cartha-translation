  text: εἶπαν οὖν οἱ μαθηταὶ ⸀αὐτῷ· Κύριε, εἰ κεκοίμηται σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: te
  text: అప్పుడు శిష్యులు ఆయనతో, “ప్రభువా, అతడు నిద్రపోతున్నట్లయితే[a], కోలుకుంటాడు[b]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నిద్రపోయి ఉంటే.” యేసు లాజరు మరణాన్ని నిద్రగా రూపకంగా చెప్పాడు; శిష్యులు మాత్రం ఆయన సాధారణ నిద్ర గురించి చెప్పాడని అర్థం చేసుకున్నారు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు క్రియను “రక్షించబడతాడు” అని కూడా అనువదించవచ్చు. అయితే ఇక్కడ అది వ్యాధి నుంచి కోలుకోవడాన్ని, అంటే “బాగుపడతాడు” అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అందుకు
  rationale: యేసు ఇంతకుముందు చెప్పిన మాటనుబట్టి శిష్యులు చేసిన నిర్ధారణను, దానికి అనుసంధానంగా వచ్చిన వారి జవాబును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οἱ μαθηταί
  choice: శిష్యులు
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, సందర్భంలో ఎవరో స్పష్టంగా ఉన్నందున తెలుగులో అదనంగా ‘ఆ శిష్యులు’ అనడం అవసరం లేదు.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: మూలంలో యేసు పేరు కాక సర్వనామమే ఉంది. గౌరవార్థకమైన ‘ఆయనతో’ తెలుగులో సహజంగా ఉండి మూల రూపాన్ని నిలుపుతుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: నేరుగా సంబోధించే రూపాన్ని కాపాడుతూ, గౌరవార్థాన్ని మరియు యోహాను సువార్తలో ఉండగల క్రీస్తు సంబంధిత అంతరార్థాన్ని అతిశయింపకుండా నిలుపుతుంది.
- source_word: εἰ
  choice: ఉంటే
  rationale: శిష్యుల అవగాహనపై ఆధారపడిన సాధారణ షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κεκοίμηται
  choice: నిద్రపోయి ఉంటే
  rationale: పూర్తయిన చర్య ఫలితంగా కొనసాగుతున్న నిద్రావస్థను సూచిస్తుంది. ఇక్కడ శిష్యులు యేసు మాటను సాధారణ నిద్రగానే అర్థం చేసుకున్నందున ఆ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచుతుంది.
- source_word: σωθήσεται
  choice: కోలుకుంటాడు
  rationale: σῴζω అనే క్రియకు ‘రక్షించబడటం’ అనే విస్తృత అర్థం ఉన్నప్పటికీ, వ్యాధి సందర్భంలో ఆరోగ్యం తిరిగి పొందడాన్ని సూచిస్తుంది. ‘కోలుకుంటాడు’ శిష్యులు ఉద్దేశించిన భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: యేసును ఉద్దేశించి Κύριε అనే సంబోధన
  choice: ప్రభువా
  alternative: అయ్యా / గురువా
  rationale: ‘ప్రభువా’ గ్రీకు పదపు సాధారణ విలువను, గౌరవపూర్వక సంబోధనను, యోహాను సువార్తలోని సాధ్యమైన క్రీస్తు సంబంధిత ప్రతిధ్వనిని ఒకేసారి నిలుపుతుంది; అయితే ఈ ఒక్క వచనం చెప్పేదానికంటే ఎక్కువ సిద్ధాంతార్థాన్ని బలవంతంగా చేర్చదు.
- issue: κεκοίμηταιలోని నిద్ర–మరణ ద్వంద్వార్థం
  choice: ప్రధాన పాఠ్యంలో సాధారణ నిద్రను సూచించే ‘నిద్రపోయి ఉంటే’
  alternative: మరణాన్ని సూచించే ‘నిద్రించి ఉంటే’ లేదా ‘మరణించి ఉంటే’
  rationale: ముందటి వచనంలో యేసు లాజరు మరణాన్ని నిద్రగా చెప్పగా, శిష్యులు దానిని సాధారణ నిద్రగా అపార్థం చేసుకున్నారు. వారి అపార్థాన్ని ప్రధాన పాఠ్యం అలాగే చూపాలి; తరువాతి వచనాలే దాన్ని స్పష్టం చేస్తాయి.
- issue: σωθήσεταιలో రక్షణ–స్వస్థత అర్థసాధ్యత
  choice: ప్రధాన పాఠ్యంలో ‘కోలుకుంటాడు’
  alternative: ‘రక్షించబడతాడు’
  rationale: క్రియకు ‘రక్షించబడతాడు’ అనే పదార్థం సాధ్యమైనప్పటికీ, ఈ వ్యాధి సందర్భంలో శిష్యుల ఉద్దేశం ఆరోగ్యప్రాప్తి. స్పష్టమైన సందర్భార్థాన్ని పాఠ్యంలో ఉంచి, విస్తృత పదార్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. సంభాషణ సహజంగా ఉండేలా ‘ఆయనతో … అన్నారు’ నిర్మాణం వాడబడింది. ప్రధాన పాఠ్యంలో రెండు పాదసూచిక గుర్తులూ సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
