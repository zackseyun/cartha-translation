id: JHN.11.48
reference: John 11:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: te
  text: మనం ఇతన్ని ఇలాగే కొనసాగనిస్తే, అందరూ ఇతనిని నమ్ముతారు; అప్పుడు రోమన్లు వచ్చి మన స్థలాన్నీ మన జాతినీ తీసుకుపోతారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: ఇతన్ని ఇలాగే కొనసాగనిస్తే
  rationale: ἀφίημι ఇక్కడ అనుమతించడం అనే భావాన్ని ఇస్తుంది; οὕτωςతో కలిసి, జరుగుతున్న కార్యాన్ని అలాగే కొనసాగనివ్వడం అనే అర్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάντες
  choice: అందరూ
  rationale: సందర్భంలోని సమగ్ర, సాధారణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: ఇతనిపై విశ్వాసముంచుతారు
  rationale: యోహాను రచనల్లో πιστεύω εἰς + ద్వితీయా విభక్తి వ్యక్తిపై విశ్వాసం ఉంచడం అనే ప్రామాణిక భావాన్ని కలిగి ఉంది.
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: రోమన్లు వస్తారు
  rationale: భవిష్యత్ కాల క్రియను, స్పష్టమైన కర్తను నేరుగా ప్రతిబింబిస్తుంది; వాక్యప్రవాహం కోసం ‘అప్పుడు’ చేర్చబడింది.
- source_word: ἀροῦσιν
  choice: తీసివేస్తారు
  rationale: αἴρω యొక్క తీసివేయడం/తొలగించడం అనే మూలార్థాన్ని నిలుపుతుంది; ‘నాశనం చేస్తారు’ అనేది మూలపదం కంటే బలమైన వ్యాఖ్యానం.
- source_word: τόπον
  choice: స్థలం
  rationale: τόπος యొక్క విస్తృతమైన మూలార్థాన్ని నిలుపుతూ, అది దేవాలయాన్నా లేక వారి స్థానం/అధికార పరిధినేనా అన్న సందిగ్ధతను పరిష్కరించదు.
- source_word: ἔθνος
  choice: జాతి
  rationale: రాజకీయ-సామూహిక సందర్భానికి సరిపోతుంది; ‘ప్రజలు’ అనే భావసాధ్యతను పాదటిప్పణిలో ఉంచుతుంది.
- source_word: ἡμῶν ... καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: మన స్థలాన్ని, మన జాతిని—రెండింటినీ
  rationale: ἡμῶν రెండు కర్మలకూ వర్తిస్తుందని, పునరుక్త καί యొక్క జోడింపు బలాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ‘మన స్థలం’ (τόπον) దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘స్థలం’ అని విస్తృతంగానే ఉంచడం
  alternative: దేవాలయం; స్థానం లేదా అధికార ప్రతిష్ఠ
  rationale: సందర్భంలో దేవాలయం లేదా నాయకుల సంస్థాగత స్థానం ఉద్దేశించబడి ఉండవచ్చు; అయితే గ్రీకు పదం ఈ అవకాశాల్లో ఒక్కదానినే నిర్దిష్టంగా చెప్పదు. అందువల్ల అసలు సందిగ్ధతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘ఇతన్ని’ అనే రూపం సంభాషణలోని దూరభావాన్ని నిలుపుతుంది. మూలంలోని τόπος సందిగ్ధతను ప్రధాన పాఠ్యంలో ‘స్థలం’ ద్వారా కాపాడి, వివరణను పాదటిప్పణికి పరిమితం చేశాం.
