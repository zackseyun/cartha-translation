translation:
  language: te
  text: యేసు ఇంకా గ్రామంలోకి రాలేదు; మార్త ఆయనను కలిసిన చోట ఇంకా ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὔπω
  choice: ఇంకా ... రాలేదు
  rationale: ఇప్పటివరకు ఆ కార్యం జరగలేదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్ప కథన సంధిని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో విరామచిహ్నం, వాక్య నిర్మాణం ద్వారానే ఆ పని సహజంగా నెరవేరుతుంది.
- source_word: ἐληλύθει
  choice: రాలేదు
  rationale: గత కథన సమయానికి ముందే సంభవించని రాకను సందర్భానుసారంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κώμην
  choice: గ్రామంలోకి
  rationale: κώμη చిన్న నివాస ప్రాంతాన్ని సూచిస్తుంది; గమ్యస్థానంలోకి ప్రవేశించే భావాన్ని -లోకి స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀλλ’
  choice: ;
  rationale: ప్రవేశించకపోవడం, అదే చోట ఉండడం మధ్య వ్యత్యాసాన్ని తెలుగు సమాంతర వాక్య నిర్మాణం మరియు అర్ధవిరామం సహజంగా చూపిస్తాయి.
- source_word: ἔτι
  choice: ఇంకా
  rationale: అదే స్థలంలో కొనసాగి ఉండడాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: τόπῳ
  choice: చోటే
  rationale: సాధారణ స్థలార్థాన్ని ఇస్తూ, ఆయన అక్కడే కొనసాగి ఉన్నాడనే నొక్కును -ఏ అందిస్తుంది.
- source_word: ὅπου
  choice: '... చోట'
  rationale: సంబంధ స్థల ఉపవాక్యాన్ని సహజమైన తెలుగు నిర్మాణంలో తెలియజేస్తుంది.
- source_word: ὑπήντησεν
  choice: కలిసిన
  rationale: ఇక్కడ ముందుగా జరిగిన సమావేశ స్థలాన్ని గుర్తిస్తుంది; ‘ఎదురుగా వెళ్లి కలిసిన’ అనే సాధ్యమైన మరింత స్పష్టమైన భావాన్ని అవసరం లేకుండా ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: αὐτῷ
  choice: ఆయనను
  rationale: ὑπαντάωతో వచ్చిన దత్తి విభక్తిని తెలుగు క్రియ ‘కలుసు’కు తగిన కర్మ రూపంలో సహజంగా అందిస్తుంది.
- source_word: Μάρθα
  choice: మార్త
  rationale: Μάρθα పేరుకు సాధారణ తెలుగు లిప్యంతరీకరణ.
