  yaml_path: translation/nt/john/011/036.yaml
  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: te
  text: కాబట్టి యూదులు[a], “చూడండి, ఆయన అతనిని ఎంతగా ప్రేమించాడో!” అని చెప్పుకొంటూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయులు”; ఇక్కడ ఇది అక్కడ ఉన్న యూద సంతాపకులను లేదా చూసేవారిని ప్రాంతీయంగా నిర్దిష్టంగా సూచిస్తుందని భావిస్తే ఇలా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: అని అంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం దృశ్యంలో కొనసాగుతున్న లేదా పలువురు వ్యక్తులు పలికిన మాటను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కొనసాగింపు భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: οὖν
  choice: అప్పుడు
  rationale: మునుపటి వచనంలో యేసు కన్నీరు పెట్టుకోవడాన్ని అనుసరించే కథన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది; ఇక్కడ కఠినమైన తార్కిక ఫలితాన్ని సూచించే ‘కాబట్టి’ కంటే ‘అప్పుడు’ సందర్భోచితం.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: యోహాను సువార్తలోని సాధారణ గ్రీకు పదబంధాన్ని నేరుగా నిలుపుతుంది. ఈ సందర్భంలో అది అక్కడున్న యూదులైన సంతాపకులను లేదా చూసేవారిని సూచిస్తుంది; మొత్తం జాతిపై సాధారణీకరణ కాదు.
- source_word: Ἴδε
  choice: చూడండి
  rationale: శ్రద్ధను ఆకర్షించే ఆజ్ఞార్థక రూపం; ఉల్లేఖిత సంభాషణలో సహజంగా ఉంటుంది.
- source_word: πῶς
  choice: ఎంతగా
  rationale: ఈ సందర్భంలో యేసు ప్రేమ తీవ్రతపై ఆశ్చర్యాన్ని సహజంగా వ్యక్తం చేస్తుంది. గ్రీకులో విధానం లేదా పరిమాణం రెండింటి ఛాయ ఉండగలిగినా, కన్నీరు చూసి పలికిన మాటలో పరిమాణార్థం ముందుకు వస్తుంది.
- source_word: ἐφίλει
  choice: ప్రేమించాడో
  rationale: φιλέω ఇక్కడ వ్యక్తిగత అనురాగాన్ని సూచిస్తుంది. ‘ప్రేమించాడు’ సహజమైనదీ, తగిన బరువు కలిగినదీ; కేవలం ‘ఇష్టపడ్డాడు’ అనడం భావాన్ని బలహీనపరుస్తుంది.
- source_word: αὐτόν
  choice: అతన్ని
  rationale: లాజరును సూచించే పుంలింగ ఏకవచన కర్మప్రత్యయం.
theological_decisions:
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι అనువాదం
  choice: యూదులు
  alternative: యూదయులు; అక్కడున్న యూదులు
  rationale: మూలంలోని సాధారణ పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో పారదర్శకంగా ఉంచాం. అయితే తక్షణ సందర్భంలో ఇది అక్కడున్న యూద సంతాపకులు లేదా ప్రేక్షకులను సూచిస్తుంది, యూదులందరినీ కాదు. ప్రాంతీయంగా ‘యూదయులు’ అని అర్థం చేసుకునే అవకాశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన సంభాషణ శైలిని ఉపయోగించాం. ‘చూడండి’ బహువచన సమూహ సంభాషణకు సహజంగా ఉంది; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
