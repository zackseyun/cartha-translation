id: JHN.11.44
reference: John 11:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: te
  text: చనిపోయినవాడు బయటికి వచ్చాడు. అతని కాళ్లూ చేతులూ సమాధి వస్త్రపు పట్టీలతో కట్టబడి ఉన్నాయి; అతని ముఖం ఒక గుడ్డతో చుట్టబడి ఉంది. యేసు వారితో, “అతని కట్లు విప్పి, అతన్ని వెళ్లనివ్వండి” అని అంటాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: చనిపోయినవాడు
  rationale: పర్ఫెక్ట్ పార్టిసిపల్ సూచించే మరణించిన స్థితిని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: κειρίαις
  choice: సమాధి వస్త్రపు పట్టీలతో
  rationale: శవాన్ని చుట్టడానికి లేదా కట్టడానికి ఉపయోగించే వస్త్రపు పట్టీలను సందర్భానుసారంగా స్పష్టపరుస్తుంది; సాధారణ 'బట్టలు' కంటే మూలార్థానికి దగ్గరగా ఉంటుంది.
- source_word: ἡ ὄψις
  choice: ముఖం
  rationale: ఈ సందర్భంలో ముఖభాగాన్ని సూచించే సహజమైన తెలుగు పదం.
- source_word: σουδαρίῳ
  choice: ఒక గుడ్డతో
  rationale: ముఖం లేదా తల చుట్టూ కట్టే చిన్న వస్త్రాన్ని అతిగా నిర్దిష్టం చేయకుండా సూచిస్తుంది.
- source_word: Λύσατε
  choice: కట్లు విప్పి
  rationale: కట్టబడి ఉన్న పట్టీలను విప్పాలనే ఆజ్ఞను సందర్భానికి తగిన సహజ తెలుగులో అందిస్తుంది.
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: అతన్ని వెళ్లనివ్వండి
  rationale: అనుమతిని సూచించే ἄφετε మరియు వెళ్లడాన్ని సూచించే ὑπάγειν రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: λέγει
  choice: అంటాడు
  rationale: గ్రీకు వర్తమాన కాలాన్ని నిలుపుతూ కథనంలోని సజీవ వర్తమాన ప్రయోగాన్ని ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ἄφετε αὐτὸν ὑπάγειν లోని భావం
  choice: అతన్ని వెళ్లనివ్వండి
  alternative: అతన్ని స్వేచ్ఛగా వెళ్లనివ్వండి
  rationale: మూలంలో స్పష్టంగా లేని అదనపు 'స్వేచ్ఛగా' భావాన్ని చేర్చకుండా, విడిచిపెట్టి వెళ్లనివ్వాలనే సహజ ద్వంద్వార్థాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. గ్రీకు కథన వర్తమానమైన λέγει కోసం ‘అంటాడు’ ఉంచబడింది.
