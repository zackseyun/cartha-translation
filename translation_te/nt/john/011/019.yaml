source:
  edition: SBLGNT
  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: te
  text: యూదులలో చాలామంది మార్త, మరియల దగ్గరకు వారి సోదరుని విషయమై వారిని ఓదార్చడానికి వచ్చి ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయవాసులలో చాలామంది మార్త, మరియల దగ్గరకు వారి సోదరుని విషయమై వారిని ఓదార్చడానికి వచ్చి ఉన్నారు.” గ్రీకు పదం సాధారణంగా యూదులను సూచించవచ్చు; యోహానులోని కొన్ని సందర్భాల్లో ప్రత్యేకంగా యూదయవాసులను కూడా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: చాలామంది
  rationale: πολλοί అంటే ‘చాలామంది’; δέ స్వల్ప అనుసంధాన అవ్యయం. తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘అయితే/మరి’ అని చేర్చకుండానే భావం సహజంగా వస్తుంది.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: యూదులలో
  rationale: ἐκ + సమూహవాచకం భాగార్థాన్ని, అంటే ‘యూదులలోనుండి చాలామంది’ అనే భావాన్ని ఇస్తుంది. ఇక్కడ శోకంలో ఉన్న అక్కచెల్లెళ్లను పరామర్శించడానికి వచ్చిన యూదులను సూచించడం సహజం.
- source_word: ἐληλύθεισαν
  choice: వచ్చి ... ఓదార్చుతున్నారు
  rationale: ἔρχομαι యొక్క భూతపూర్వకాల రూపం కథనంలోని ఆ సమయానికి ముందే వారు వచ్చి ఉన్నారని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘వచ్చి’ అని, కొనసాగుతున్న పరామర్శ సందర్భాన్ని ‘ఓదార్చుతున్నారు’ అని వ్యక్తం చేశాం.
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: మార్త, మరియల దగ్గరికి
  rationale: πρός + ద్వితీయా విభక్తి వ్యక్తుల వద్దకు రావడాన్ని సూచిస్తుంది. పేర్లకు తెలుగులో స్థిరపడిన ‘మార్త’, ‘మరియ’ రూపాలు వాడాం.
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: వారిని ఓదార్చుతున్నారు
  rationale: ἵνα + విధ్యర్థక రూపం ఉద్దేశాన్ని సూచిస్తుంది; παραμυθέομαι శోకసందర్భంలో ఓదార్చడం లేదా పరామర్శించడం అనే అర్థం ఇస్తుంది. ‘ఓదార్చుతున్నారు’ సాధారణ పాఠకునికి సహజం.
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: వారి సోదరుని గురించి
  rationale: περί + షష్ఠీ ‘గురించి/సంబంధించి’ అని అర్థం. గ్రీకులో ‘ఆ సోదరుడు’ అని ఏకవచనం ఉన్నా, మార్త మరియ ఇద్దరికీ అతడు సోదరుడు కాబట్టి తెలుగులో ‘వారి సోదరుడు’ సహజంగా ఉంది.
theological_decisions:
- issue: యోహాను సందర్భంలో Ἰουδαίων అనువాదం
  choice: యూదులు
  alternative: యూదయవాసులు
  rationale: ఈ వచనం విరోధాత్మకంగా కాక, మార్త మరియలను ఓదార్చడానికి వచ్చినవారిని వర్ణిస్తుంది. అందువల్ల విస్తృత జాతి-మతార్థంలోని ‘యూదులు’ సందర్భానికి బాగా సరిపోతుంది. అయితే యోహాను రచనలో ఈ పదం కొన్నిచోట్ల ‘యూదయవాసులు’ అనే ప్రాంతీయ అర్థం ఇవ్వగల నిజమైన సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పరామర్శించడానికి’ కంటే శోకసందర్భంలోని క్రియార్థాన్ని నేరుగా తెలిపే ‘ఓదార్చుతున్నారు’ వాడాం; ప్రాంతీయ పదభేదాన్ని పాదటిప్పణిలో నిలిపాం.
