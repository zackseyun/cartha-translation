id: JHN.11.50
reference: John 11:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: te
  text: ప్రజల కోసం[a] ఒక మనిషి చనిపోవడం, జాతి అంతా నశించడంకన్నా మీకు మేలని మీరు పరిగణించరు కూడా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రజల తరఫున’ అని కూడా అనువదించవచ్చు; ఈ మాటకు ‘ప్రజలకు బదులుగా’ అనే భావం కూడా ఉండవచ్చు.
    reason: ὑπέρ అనే పదబంధంలోని ప్రయోజనం, ప్రతినిధిత్వం, స్థానాపన్నత అనే భావసంభావ్యతలను భద్రపరచడం.
lexical_decisions:
- source_word: οὐδὲ
  choice: కూడా ... లేదు
  rationale: ముందటి గద్దింపుతో ఈ మాటను అనుసంధానిస్తూ అదనపు ప్రతికూల భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: λογίζεσθε
  choice: ఆలోచించడం
  rationale: లెక్కించడం, తర్కించడం, పరిగణించడం అనే భావపరిధిలో ఈ రాజకీయ-మతపరమైన సంప్రదింపుల సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: συμφέρει ὑμῖν
  choice: మీకు మేలు
  rationale: ὑμῖν ప్రయోజనార్థక దత్తివును, συμφέρει సూచించే ఆచరణాత్మక ప్రయోజనాన్ని సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἷς ἄνθρωπος
  choice: ఒక మనిషి
  rationale: గ్రీకు మూలంలోని ఏకవచనాన్ని, పురుషలింగ రూపాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: ἀποθάνῃ
  choice: చనిపోవడం
  rationale: ἵνα ఉపవాక్యంలోని మరణ సంఘటనను తెలుగులో సహజమైన నామీకృత క్రియారూపంతో తెలియజేస్తుంది; అదనపు విధ్యర్థక భావాన్ని చేర్చదు.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: ప్రజల కోసం
  rationale: ὑπέρ‌లోని ప్రయోజనం, ప్రతినిధిత్వం, స్థానాపన్నత వంటి సాధ్యమైన భావాలను ఒకే అర్థానికి కుదించకుండా విస్తృతంగా ఉంచుతుంది.
- source_word: λαοῦ
  choice: ప్రజల
  rationale: ఈ సందర్భంలో యూదా ప్రజలను సామూహికంగా సూచించే సహజమైన తెలుగు పదం.
- source_word: ὅλον τὸ ἔθνος
  choice: జాతి అంతా
  rationale: రాజకీయ-జాతిపరమైన సమష్టిని సూచిస్తూ, అన్యజనులు అనే వేరొక అర్థాన్ని రానివ్వదు.
- source_word: ἀπόληται
  choice: నశించకపోవడం
  rationale: ἀπόλλυμι సూచించే సంపూర్ణ వినాశం లేదా పతనం అనే గంభీర భావాన్ని, దాని విధానాన్ని ప్రత్యేకంగా నిర్ధారించకుండా అందిస్తుంది.
theological_decisions:
- issue: యేసు మరణానికి సంబంధించి ὑπέρ భావం
  choice: ప్రధాన పాఠ్యంలో విస్తృతార్థకమైన ‘ప్రజల కోసం’
  alternative: ‘ప్రజల పక్షంగా’ లేదా ‘ప్రజల స్థానంలో’
  rationale: కయప రాజకీయ ప్రయోజనాన్ని ఉద్దేశించి మాట్లాడుతున్నప్పటికీ, తరువాతి వచనం అతని మాటలను అతనికి తెలియకుండానే పలికిన ప్రవచనంగా చూపిస్తుంది. అందువల్ల ప్రధాన పాఠ్యం తక్షణ రాజకీయ భావాన్నీ, లోతైన బలియర్పణ/స్థానాపన్న భావసంభావ్యతనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మేలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, సందర్భంలోని ఆచరణాత్మక ప్రయోజన భావాన్ని నిలుపుతుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
