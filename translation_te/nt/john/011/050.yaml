revisions:
- from: ప్రజల కోసం[a] ఒక మనిషి చనిపోవడం, జాతి అంతా నశించకపోవడం మీకు మేలని కూడా మీరు ఆలోచించడం లేదు.
  to: ప్రజల కోసం[a] ఒక మనిషి చనిపోవడం, జాతి అంతా నశించడంకన్నా మీకు మేలని మీరు పరిగణించరు కూడా.
  rationale: The revision uses a finite verb for λογίζεσθε, explicitly marks the comparative force of the final clause, and retains the deliberate breadth of ‘ప్రజల కోసం.’ The footnote is adjusted to idiomatic Telugu while preserving the source’s semantic ambiguity and the English audit trail.
