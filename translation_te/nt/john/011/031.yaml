  naturalness: The Telugu is clear and modern. “మరియ త్వరగా లేచి బయటికి వెళ్లడాన్ని చూసి” is a slightly more idiomatic and syntactically complete form than “వెళ్లడం చూసి.”
  terminology: “యూదులు,” “ఓదారుస్తున్న,” and “సమాధి” are appropriate. The note responsibly preserves the contextual alternative for Ἰουδαῖοι without forcing it into the main text.
