id: JHN.11.31
reference: John 11:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: te
  text: ఇంట్లో ఆమెతో ఉండి ఆమెను ఓదారుస్తున్న యూదులు[a], మరియ త్వరగా లేచి బయటికి వెళ్లడాన్ని చూసి, ఆమె అక్కడ ఏడవడానికి సమాధికి వెళ్తోందని భావించి ఆమె వెంట వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదయులు.’ యోహాను సువార్తలో Ἰουδαῖοι అనే పదం కొన్నిసార్లు మరింత పరిమితంగా యూదయ ప్రాంత ప్రజలను లేదా యూదయ నాయకులను సూచించవచ్చు. అయితే ఇక్కడ అది మరియతో కలిసి దుఃఖిస్తున్న వారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: యూదులు
  rationale: οὖν ఇక్కడ కథనంలోని పరిణామాన్ని కలుపుతుంది; తెలుగు వాక్యప్రవాహంలో ప్రత్యేక సంధానపదం లేకుండానే ఆ సంబంధం సహజంగా వ్యక్తమవుతుంది. Ἰουδαῖοι ఈ సందర్భంలో మరియతో కలిసి దుఃఖిస్తున్న యూదులను సూచిస్తుంది; భౌగోళికంగా ‘యూదయులు’ అనే సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν
  choice: ఇంట్లో ఆమెతో ఉండి ఆమెను ఓదారుస్తున్న
  rationale: గ్రీకు విశేషణాత్మక భాగం ఏ యూదుల గురించి చెబుతోందో స్పష్టం చేస్తుంది. παραμυθέομαι అంత్యక్రియల సందర్భంలో ఓదార్పునివ్వడాన్ని సూచిస్తుంది.
- source_word: ἰδόντες
  choice: చూసి
  rationale: మరియ లేచి వెళ్లిన దృశ్యాన్ని గమనించిన తరువాత వారు అనుసరించారనే సంఘటనల క్రమాన్ని సహజమైన తెలుగు అసమాపక క్రియ తెలియజేస్తుంది.
- source_word: ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: త్వరగా లేచి బయటికి వెళ్లడం
  rationale: ἀνέστη ఇక్కడ కూర్చున్న స్థితి నుంచి లేవడాన్ని సూచిస్తుంది, పునరుత్థానాన్ని కాదు. ἐξῆλθεν‌ను ‘బయటికి వెళ్లింది’ అనే సాధారణ అర్థంలో అందించాం.
- source_word: ἠκολούθησαν αὐτῇ
  choice: ఆమె వెంట వెళ్లారు
  rationale: ఇది భౌతికంగా అనుసరించడాన్ని సూచిస్తుంది; ఈ సందర్భంలో శిష్యత్వ భావాన్ని చేర్చదు.
- source_word: δόξαντες
  choice: భావించి
  rationale: వారు మరియ ఉద్దేశం గురించి చేసుకున్న ఊహను ఇది వ్యక్తం చేస్తుంది.
- source_word: ὑπάγει εἰς τὸ μνημεῖον
  choice: సమాధి దగ్గరికి వెళ్తోంది
  rationale: μνημεῖον యోహాను సమాధి సందర్భంలో శవాన్ని ఉంచే సమాధిని సూచిస్తుంది. తెలుగు వాడుకలో గమ్యాన్ని ‘సమాధి దగ్గరికి’ అని చెప్పడం సహజం.
- source_word: ἵνα κλαύσῃ ἐκεῖ
  choice: అక్కడ ఏడవడానికి
  rationale: ἵνα తో కూడిన ఉపవాక్యం మరియ అక్కడికి వెళ్లడానికి వారు ఊహించిన ఉద్దేశాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: యోహాను కథనంలో Ἰουδαῖοι అనే పదం యొక్క పరిధి
  choice: ఈ వచనంలో ‘యూదులు’ అని అనువదించి, మరియతో ఇంట్లో ఉండి ఆమెను ఓదారుస్తున్న శోకసహచరులను సూచించాం.
  alternative: యూదయులు
  rationale: యోహాను గ్రంథంలో Ἰουδαῖοι సందర్భానుసారం యూదయ ప్రాంత ప్రజలను లేదా యూదయ నాయకత్వాన్ని కూడా సూచించవచ్చు. ఇక్కడ మాత్రం వచనమే వారిని మరియతో ఉన్న ఓదార్పుదారులుగా గుర్తిస్తుంది; అందువల్ల విస్తృతమైన ‘యూదులు’ ప్రధాన పాఠ్యంలో ఉంచి, భౌగోళిక ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని సంఘటనల క్రమం, వారి ఊహ, మరియ వెళ్లిన ఉద్దేశం స్పష్టంగా నిలిపాం.
