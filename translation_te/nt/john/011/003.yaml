revisions:
- from: కాబట్టి ఆ సోదరీమణులు ఆయనకు కబురు పంపిస్తూ, “ప్రభూ, ఇదిగో, మీరు ప్రేమించేవాడు అనారోగ్యంతో ఉన్నాడు” అన్నారు.
  to: 'కాబట్టి ఆ సోదరీమణులు ఆయనకు ఇలా సందేశం పంపారు: “ప్రభూ, ఇదిగో, మీరు ప్రేమించేవాడు అనారోగ్యంతో ఉన్నాడు.”'
  rationale: The revision only improves the Telugu construction used to introduce the direct message. It retains the source’s narrative connection, honorific address, demonstrative emphasis, personal-love wording, and present-tense statement of illness.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:29:25Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents οὖν (‘కాబట్టి’), the sisters’ sending a message to Jesus, κύριε (‘ప్రభూ’), ἴδε (‘ఇదిగో’), ὃν φιλεῖς (‘మీరు ప్రేమించేవాడు’), and the present condition ἀσθενεῖ (‘అనారోగ్యంతో ఉన్నాడు’).
  naturalness: ‘కబురు పంపిస్తూ ... అన్నారు’ is awkward in Telugu because the continuative form ‘పంపిస్తూ’ does not naturally introduce the quoted content of the message. A finite verb followed by ‘ఇలా’ and a colon is clear and idiomatic.
  terminology: ‘ప్రభూ’ and the respectful second-person plural ‘మీరు’ are suitable modern-standard Telugu choices. ‘ప్రేమించేవాడు’ preserves the personal-affection sense without forcing a theological distinction into φιλεῖς.
  issues:
  - severity: medium
    issue: Awkward verbal linkage in ‘కబురు పంపిస్తూ ... అన్నారు’
    rationale: The Greek participle λέγουσαι specifies the content accompanying the sending. In Telugu, ‘పంపిస్తూ’ more naturally denotes an ongoing simultaneous action and leaves the following ‘అన్నారు’ stylistically clumsy. ‘ఇలా సందేశం పంపారు:’ directly and naturally introduces the message.
  revised_text: 'కాబట్టి ఆ సోదరీమణులు ఆయనకు ఇలా సందేశం పంపారు: “ప్రభూ, ఇదిగో, మీరు ప్రేమించేవాడు అనారోగ్యంతో ఉన్నాడు.”'
  revised_footnotes: []
  revision_rationale: The revision only improves the Telugu construction used to introduce the direct message. It retains the source’s narrative connection, honorific address, demonstrative emphasis, personal-love wording, and present-tense statement of illness.
