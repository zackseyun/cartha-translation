id: JHN.11.3
reference: John 11:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: te
  text: 'కాబట్టి ఆ సోదరీమణులు ఆయనకు ఇలా సందేశం పంపారు: “ప్రభూ, ఇదిగో, మీరు ప్రేమించేవాడు అనారోగ్యంతో ఉన్నాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτόν
  choice: ఆయనకు కబురు పంపిస్తూ
  rationale: సందేశాన్ని ఆయన వద్దకు పంపారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἴδε
  choice: ఇదిగో
  rationale: ఇక్కడ ఇది నిజంగా చూడమనే ఆజ్ఞకన్నా ప్రభువు దృష్టిని పరిస్థితిపై నిలిపే సంభాషణ సూచకం; ‘ఇదిగో’ ఆ పనిని సంక్షిప్తంగా, గంభీరంగా చేస్తుంది.
- source_word: ὃν φιλεῖς
  choice: మీరు ప్రేమించేవాడు
  rationale: φιλέωలోని వ్యక్తిగత ఆప్యాయతను సాధారణ తెలుగు ‘ప్రేమించు’ సహజంగా వ్యక్తం చేస్తుంది; గ్రీకులో లేని ప్రత్యేక స్నేహార్థాన్ని బలవంతంగా చేర్చలేదు.
- source_word: ἀσθενεῖ
  choice: అనారోగ్యంతో ఉన్నాడు
  rationale: వర్తమాన స్థితిని సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు; కేవలం బలహీనత అని అస్పష్టంగా చేయదు.
theological_decisions:
- issue: φιλέω మరియు ἀγαπάω మధ్య భావభేదం
  choice: ప్రేమించేవాడు
  alternative: అభిమానించేవాడు / ఆప్యాయత చూపేవాడు
  rationale: ఈ సందర్భంలో ప్రత్యేకమైన సిద్ధాంతపరమైన ప్రేమ రకాన్ని నిర్ధారించకుండా, వ్యక్తిగత ప్రేమను సహజంగా ఉంచుతుంది.
- issue: యేసును ఉద్దేశించే ఏకవచన సంబోధనలో గౌరవస్థాయి
  choice: మీరు
  alternative: నీవు
  rationale: గ్రీకు ఏకవచనం తెలుగులో గౌరవస్థాయిని నిర్ణయించదు; ఆధునిక ప్రామాణిక తెలుగులో ‘ప్రభూ’ అనే సంబోధనకు ‘మీరు’ సహజమైన గౌరవాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ అనువదించబడింది. మూలంలోని οὖνను ‘కాబట్టి’గా ఉంచి కథన సంబంధాన్ని కాపాడింది.
