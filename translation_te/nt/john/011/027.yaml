id: JHN.11.27
reference: John 11:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: te
  text: ఆమె ఆయనతో, “అవును, ప్రభువా; మీరు మెస్సీయ, దేవుని కుమారుడు, లోకంలోకి వస్తున్నవారు అని నేను నమ్మి ఉన్నాను” అంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: ఆమె ఆయనతో ... అంది
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథనశైలిలో భూతకాల రూపం సహజం; సందర్భం ద్వారా కర్త మార్త అని తెలుస్తుంది.
- source_word: Ναί
  choice: అవును
  rationale: సంభాషణలోని సూటియైన అంగీకారాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κύριε
  choice: ప్రభువా
  rationale: ఇది కేవలం మర్యాదపూర్వక సంబోధనకన్నా భక్తిపూర్వక గుర్తింపును సూచించే అవకాశం ఉన్నందున, ఒప్పుకోలు ఉన్న ఈ సందర్భంలో ‘ప్రభువా’ సరిపోతుంది.
- source_word: πεπίστευκα
  choice: నమ్మి ఉన్నాను
  rationale: పూర్ణకాల క్రియ గతంలో ఏర్పడి ప్రస్తుతం కొనసాగుతున్న స్థిరమైన విశ్వాసాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం ఆ ఫలితస్థితిని నిలుపుతుంది.
- source_word: ὅτι
  choice: అని
  rationale: ఇది కారణాన్ని కాకుండా మార్త విశ్వాసంలోని విషయాన్ని పరిచయం చేస్తుంది.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా వాడబడింది; ‘మెస్సీయ’ దాని యూదీయ అభిషిక్త-రాజు భావాన్ని నిలుపుతుంది.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: నిర్దిష్టమైన క్రీస్తుసంబంధ బిరుదును స్పష్టంగా, సంప్రదాయ theological బరువును తగ్గించకుండా తెలుపుతుంది.
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: లోకంలోకి రాబోయే
  rationale: నిరీక్షించబడిన వ్యక్తిని వర్ణించే విశేషణాత్మక కృదంత భావాన్ని సహజ తెలుగులో నిలుపుతుంది; ఇది ప్రవచనాత్మక/నిరీక్షణ భావాన్ని కూడా మోస్తుంది.
- source_word: κόσμον
  choice: లోకం
  rationale: యోహాను రచనలో మానవ అస్తిత్వ క్షేత్రాన్ని సూచించే κόσμοςకు ‘లోకం’ సహజమైన, స్థిరమైన సమానం.
theological_decisions:
- issue: ఒప్పుకోలు సందర్భంలో Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇది వ్యక్తినామంలా కాక అధికారిక బిరుదుగా ఉంది. ‘మెస్సీయ’ అభిషిక్తుడనే యూదీయ, రాజసంబంధ భావాన్ని స్పష్టంగా కాపాడుతుంది.
- issue: మార్త సంబోధనలో κύριε బలం
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: తరువాత వచ్చే మెస్సీయ మరియు దేవుని కుమారుడు అనే ఒప్పుకోలు దృష్ట్యా భక్తిపూర్వక, theological బలం గల సంబోధన అనుకూలం; అయినా మూలానికి మించిన ప్రత్యేక సిద్ధాంతాన్ని చేర్చదు.
- issue: πεπίστευκα యొక్క కాలాంశం
  choice: నమ్మి ఉన్నాను
  alternative: నమ్ముతున్నాను; నమ్మాను
  rationale: గ్రీకు పూర్ణకాలం గతంలో ఏర్పడిన విశ్వాసం ప్రస్తుతం స్థిరంగా కొనసాగుతున్నదనే ఫలితస్థితిని సూచిస్తుంది.
- issue: ὁ εἰς τὸν κόσμον ἐρχόμενος యొక్క కాల/వర్ణన భావం
  choice: లోకంలోకి రాబోయే
  alternative: లోకంలోకి వస్తున్న; లోకంలోకి వచ్చేవాడు
  rationale: వర్తమాన కృదంతం సందర్భానుసారం నిరీక్షించబడిన ‘రానున్నవాడు’ అనే బిరుదుసదృశ భావాన్ని కలిగి ఉంటుంది. తెలుగు ‘రాబోయే’ ఆ నిరీక్షణను సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ కాలభావాలు సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనా సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం. మూలంలోని బిరుదుల వరుసను తెలుగు సహజ క్రమంలో ఉంచి, ప్రధాన క్రియ ‘నమ్మి ఉన్నాను’కు అనుసంధానించబడింది.
