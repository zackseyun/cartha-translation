revisions:
- from: ఆ జనము కోసం మాత్రమే కాదు,[a] చెదరిపోయి ఉన్న దేవుని పిల్లలను కూడా ఒక్కటిగా సమకూర్చడానికి ఆయన చనిపోతాడని చెప్పాడు.
  to: ఆయన ఆ జనము కోసమే కాక, చెదరిపోయి ఉన్న దేవుని పిల్లలను కూడా ఒక్కటిగా సమకూర్చడానికి చనిపోతాడని చెప్పాడు.[a]
  rationale: The revision makes the Greek not-only/but-also structure clear in idiomatic modern Telugu while retaining the draft’s contextual continuation of the preceding statement about Jesus’ death. It does not specify the identity or scope of “God’s children” beyond the Greek text, and it preserves εἰς ἕν as “ఒక్కటిగా,” without adding “body” or another interpretive noun.
