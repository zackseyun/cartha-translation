review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the Jewish nation, God’s scattered children, and their being gathered into one. However, its contrast is less clear than the Greek: the second clause should explicitly correspond to “not only for the nation, but also so that ….”'
  naturalness: The Telugu is generally modern and understandable, but “ఆ జనము కోసం మాత్రమే కాదు, … పిల్లలను కూడా” can momentarily make “కూడా” modify the children rather than mark the contrasting purpose clause. Recasting with “కోసమే కాక” makes the contrast idiomatic and unambiguous.
  terminology: “జనము,” “దేవుని పిల్లలు,” “చెదరిపోయి ఉన్న,” and “ఒక్కటిగా” are suitable and preserve the source’s corporate, inclusive, and deliberately unspecific language. The supplied context of Jesus’ death is retained, as in the draft’s contextual continuation from the preceding verse.
  issues:
  - severity: low
    issue: The adversative/purpose contrast is not fully explicit.
    rationale: Greek καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καί contrasts death for the nation with the additional purpose of gathering God’s scattered children. “కోసమే కాక” clarifies this relationship more naturally than “కోసం మాత్రమే కాదు” in this sentence.
  revised_text: ఆయన ఆ జనము కోసమే కాక, చెదరిపోయి ఉన్న దేవుని పిల్లలను కూడా ఒక్కటిగా సమకూర్చడానికి చనిపోతాడని చెప్పాడు.[a]
  revised_footnotes:
