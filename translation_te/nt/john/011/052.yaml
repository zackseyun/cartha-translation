id: JHN.11.52
reference: John 11:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: te
  text: ఆయన ఆ జనము కోసమే కాక, చెదరిపోయి ఉన్న దేవుని పిల్లలను కూడా ఒక్కటిగా సమకూర్చడానికి చనిపోతాడని చెప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆ జనము’ అనేది ఈ సందర్భంలో యూదు జనాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: జనము
  rationale: సందర్భంలో ఇది యూదు జనాన్ని సూచించే ఏకవచన సమష్టి పదం. ‘జనము’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἵνα
  choice: సమకూర్చడానికి
  rationale: ఇది ఉద్దేశాన్ని తెలిపే ప్రయోజనార్థక నిర్మాణం; తెలుగులో క్రియార్థక రూపం సహజంగా ఉంటుంది.
- source_word: τέκνα τοῦ θεοῦ
  choice: దేవుని పిల్లలు
  rationale: τέκνα లింగభేదం లేని ‘పిల్లలు’ అనే అర్థం ఇస్తుంది; ‘కుమారులు’ అని పరిమితం చేయదు.
- source_word: διεσκορπισμένα
  choice: చెదరిపోయి ఉన్న
  rationale: పరిపూర్ణ కర్మణి కృదంతం సూచించే, చెదరిపోయిన స్థితిలో కొనసాగుతున్న భావాన్ని నిలుపుతుంది.
- source_word: συναγάγῃ
  choice: సమకూర్చడానికి
  rationale: చెదరిపోయిన వారిని ఒకచోటికి చేర్చే భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς ἕν
  choice: ఒక్కటిగా
  rationale: గ్రీకు వాక్యం ‘శరీరం’ వంటి నామవాచకాన్ని స్పష్టంగా చెప్పదు; ‘ఒక్కటిగా’ దాని సంక్షిప్తతను, విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: ఆ జనము కోసం మాత్రమే కాదు
  rationale: మునుపటి వచనంలోని యేసు మరణాన్ని కొనసాగిస్తూ ὑπέρ యొక్క ‘కోసం’ అనే ప్రతినిధి/హితార్థ భావాన్ని నిలుపుతుంది; ‘కూడా’ తరువాతి భాగంలో సహజంగా ఉంచబడింది.
theological_decisions:
- issue: ‘దేవుని పిల్లలు’ ఎవరు?
  choice: యూదు జనానికి మించిన, చెదరిపోయి ఉన్న దేవుని ప్రజలను సూచించే విస్తృత పదప్రయోగాన్ని అలాగే ఉంచడం
  alternative: చెదరిపోయిన యూదులు మాత్రమే; లేదా యూదులు, అన్యజనులలోని ఎన్నికైన విశ్వాసులు
  rationale: వచనం ‘ఆ జనము’తో మరింత విస్తృతమైన చెదరిపోయిన సమూహాన్ని వ్యత్యాసపరుస్తుంది; గ్రీకు మూలం నిర్దిష్టంగా చెప్పనిదాన్ని అనువాదం సిద్ధాంతపరంగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఇది మునుపటి వచనాన్ని కొనసాగించే అసంపూర్ణ వాక్యభాగం కావడంతో, తెలుగులో స్పష్టత కోసం సందర్భం నుంచి ‘ఆయన చనిపోతాడని చెప్పాడు’ అని పూరించబడింది; అయితే మూలంలోని ఉద్దేశార్థం, సమూహాల మధ్య వ్యత్యాసం, ‘ఒక్కటిగా’ అనే ఉద్దేశపూర్వక సంక్షిప్తత కాపాడబడ్డాయి.
