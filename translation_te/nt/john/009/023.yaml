  yaml_path: translation/nt/john/009/023.yaml
  text: For this reason his parents said[a], “He is of age; ask him.”
translation:
  language: te
  text: అందుకే అతని తల్లిదండ్రులు, “అతను తగిన వయసున్నవాడు; అతనినే అడగండి” అని చెప్పారు.[a]
  philosophy: optimal-equivalence
  footnotes:
