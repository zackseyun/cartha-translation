    text: లేదా, “అతను పెద్దవాడు; అతనినే ప్రశ్నించండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందుకే
  rationale: ఈ మాట 22వ వచనంలో చెప్పిన కారణాన్ని వెనక్కి సూచిస్తుంది. ‘అందుకే’ కారణ-ఫలిత సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: అతని తల్లిదండ్రులు
  rationale: బహువచన నామవాచకం ఆ మనిషి తల్లిని, తండ్రిని కలిపి సూచిస్తుంది; ‘తల్లిదండ్రులు’ సహజమైన, ఖచ్చితమైన తెలుగు పదం.
- source_word: εἶπαν
  choice: చెప్పారు
  rationale: ఇక్కడ సాధారణంగా మాట్లాడడాన్ని సూచించే క్రియ ఉంది. సందర్భంలో లేని ప్రత్యేక భావాన్ని చేర్చకుండా ‘చెప్పారు’ దానిని సహజంగా అందిస్తుంది.
- source_word: Ἡλικίαν ἔχει
  choice: అతను వయసుకు వచ్చినవాడు
  rationale: గ్రీకు నుడికారం అక్షరార్థంగా ‘వయసు కలిగివున్నాడు’ అని ఉన్నా, తన విషయమై తానే సమాధానం చెప్పగల వయసులో ఉన్నాడనే భావం సందర్భంలో ఉంది. ‘వయసుకు వచ్చినవాడు’ ఆ సామాజిక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: αὐτὸν
  choice: అతన్నే
  rationale: సర్వనామం ప్రశ్నించవలసిన వ్యక్తి అతడే అని నొక్కి చూపుతుంది; తెలుగు ‘-నే’ ఆ ఉద్ఘాటనను తెలియజేస్తుంది.
- source_word: ἐπερωτήσατε
  choice: అడగండి
  rationale: భూతకాల ఆజ్ఞార్థక రూపం విచారణను అతని వైపు మళ్లించమని చెబుతుంది. ‘అడగండి’ ఆధునిక తెలుగులో సహజమైన ఆజ్ఞారూపం.
