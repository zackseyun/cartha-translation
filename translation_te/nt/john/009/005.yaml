  text: ὅταν ἐν τῷ κόσμῳ ὦ, φῶς εἰμι τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/005.yaml
  text: While I am in the world, I am the light of the world.
translation:
  language: te
  text: నేను లోకంలో ఉన్నంతకాలం, లోకానికి వెలుగుగా ఉన్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν ἐν τῷ κόσμῳ ὦ
  choice: నేను లోకంలో ఉన్నంతకాలం
  rationale: ὅταν + subjunctive ఇక్కడ యేసు లోకంలో ఉండే కాలవ్యవధిని సూచిస్తుంది. తెలుగు వాక్యంలో ‘ఉన్నంతకాలం’ సహజంగా ఉండి, సందర్భంలోని తాత్కాలిక భావాన్ని కాపాడుతుంది.
- source_word: φῶς εἰμι τοῦ κόσμου
  choice: లోకానికి వెలుగుగా ఉన్నాను
  rationale: గ్రీకు షష్ఠీ విభక్తి τοῦ κόσμου ను తెలుగులో సహజమైన సంబంధార్థక ‘లోకానికి’తో వ్యక్తం చేశాం; రూపకమైన ‘వెలుగు’ను యథాతథంగా నిలిపాం.
theological_decisions:
- issue: ὅταν యొక్క కాలార్థం
  choice: ఉన్నంతకాలం
  alternative: ఎప్పుడైతే నేను లోకంలో ఉంటానో
  rationale: ‘ఎప్పుడైతే’ అనేది పదరూపానికి దగ్గరగా ఉన్నా, ఈ సందర్భంలో పునరావృత సందర్భాల భావాన్ని అనవసరంగా కలిగించవచ్చు. ‘ఉన్నంతకాలం’ సమీప వచనాల కాలపరమైన ఒత్తిడిని మరియు ఇంగ్లీషు consultation layer లోని ‘While’ భావాన్ని సహజంగా అందిస్తుంది.
- issue: ‘లోకానికి వెలుగు’ అనే క్రీస్తుసంబంధ ప్రకటన
  choice: రూపకాన్ని వివరణ లేకుండా నిలిపివేయడం
  alternative: లోకాన్ని వెలిగించేవాడిని
  rationale: మూలంలోని సంక్షిప్తమైన గుర్తింపు ప్రకటనను వ్యాఖ్యానించి విస్తరించకుండా, దాని దైవశాస్త్ర బలాన్ని మరియు రూపక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలోని సంక్షిప్తతను నిలిపి, సహజత్వం కోసం ‘వెలుగుగా ఉన్నాను’ అని ప్రయోగించాం.
