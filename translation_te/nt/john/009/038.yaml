source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη· Πιστεύω, κύριε· καὶ προσεκύνησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/038.yaml
  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
translation:
  language: te
  text: అతడు ఇలా అన్నాడు, “ప్రభువా[a], నేను నమ్ముతున్నాను.” ఆపై ఆయనను ఆరాధించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అయ్యా.” గ్రీకు κύριε గౌరవసూచక సంబోధనగా కూడా వాడబడుతుంది; అయితే ఇక్కడ విశ్వాస ప్రకటనతో, ఆరాధనతో సందర్భం పరాకాష్ఠకు చేరుతుంది కాబట్టి “ప్రభువా” అని అనువదించాం.
    reason: alternative_reading
  - marker: b
    text: లేదా “ఆయన ముందు సాగిలపడ్డాడు” / “ఆయనకు గౌరవవందనం చేశాడు.” గ్రీకు క్రియ సాగిలపడడాన్ని లేదా గౌరవవందనాన్ని సూచించగలదు; ఈ సందర్భాన్ని బట్టి ఇక్కడ “ఆరాధించాడు” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: అందుకు అతడు
  rationale: ὁ అనే ఆర్టికల్ ఇక్కడ సర్వనామంలా పనిచేసి స్వస్థత పొందిన వ్యక్తిని సూచిస్తుంది. δέను బలమైన వ్యతిరేకతగా కాకుండా, యేసు మాటకు అతని ప్రతిస్పందనను సహజంగా తెలియజేసే ‘అందుకు’ అని అనువదించాం.
- source_word: ἔφη
  choice: అని చెప్పి
  rationale: φημί యొక్క ఏకకాల భూతరూపం కథనంలో మాటను పరిచయం చేస్తుంది. తరువాతి చర్యతో సహజమైన తెలుగు వాక్యప్రవాహం కోసం ‘అని చెప్పి’ అని ఇచ్చాం.
- source_word: Πιστεύω
  choice: నేను నమ్ముతున్నాను
  rationale: యేసు తనను వెల్లడించిన దానికి ప్రత్యక్ష ప్రతిస్పందనగా ఉన్న వర్తమానకాల క్రియను అలాగే ఉంచుతూ, యోహాను సువార్తలోని ‘నమ్మడం’ అనే ప్రధాన భావపరంపరను కాపాడుతుంది.
- source_word: κύριε
  choice: ప్రభువా
  rationale: ఇది సంబోధనారూపం. గౌరవసూచకమైన ‘అయ్యా’ అనే అర్థం సాధ్యమైనప్పటికీ, విశ్వాస ప్రకటన మరియు ఆరాధనతో ముగిసే సందర్భంలో ‘ప్రభువా’ అనేది సందర్భానికి తగిన ఎంపిక.
- source_word: προσεκύνησεν
  choice: ఆరాధించాడు
  rationale: προσκυνέω సాగిలపడడం, గౌరవవందనం చేయడం లేదా ఆరాధించడం అనే భావాలను కలిగి ఉండవచ్చు. ఇక్కడ యేసుపై విశ్వాస ప్రకటన వెంటనే రావడం వల్ల ‘ఆరాధించాడు’ సందర్భార్థాన్ని బాగా అందిస్తుంది.
- source_word: αὐτῷ
  choice: ఆయనను
  rationale: προσκυνέωతో వచ్చిన దత్తివిభక్తి కర్మను సహజమైన తెలుగులో ‘ఆయనను’ అనే ప్రత్యక్ష కర్మగా వ్యక్తం చేశాం.
theological_decisions:
- issue: κύριεను కేవలం గౌరవసూచక సంబోధనగా అనువదించాలా, లేక క్రీస్తును ఉద్దేశించిన ‘ప్రభువా’గా అనువదించాలా
  choice: ప్రభువా
  alternative: అయ్యా; స్వామీ
  rationale: గ్రీకు పదానికి సాధారణ గౌరవసూచక అర్థం ఉండగలదు. అయితే యేసు తనను వెల్లడించిన తరువాత ఆ వ్యక్తి విశ్వాసాన్ని ప్రకటించి ఆయనను ఆరాధించే ఈ సందర్భం మరింత ఉన్నతమైన సంబోధనను సూచిస్తుంది. అయినా సాధ్యమైన తక్కువ బలమున్న అర్థాన్ని పాదసూచికలో నిలిపాం.
- issue: προσεκύνησενను ‘ఆరాధించాడు’గా ఇవ్వాలా, లేక శరీరభంగిమ లేదా గౌరవవందనాన్ని మాత్రమే సూచించేలా ఇవ్వాలా
  choice: ఆరాధించాడు
  alternative: ఆయన ముందు సాగిలపడ్డాడు; ఆయనకు వందనం చేశాడు
  rationale: ఈ చర్యకు కర్మ యేసు కావడం, అలాగే ఇది స్పష్టమైన విశ్వాస ప్రకటన తరువాత రావడం వల్ల ‘ఆరాధించాడు’ సందర్భంలో అత్యంత సహజం. అయితే గ్రీకు క్రియలోని నిజమైన పదార్థ వైవిధ్యాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవభరితంగా ఉండే నిర్మాణాన్ని ఉపయోగించాం. ‘అందుకు’ ప్రతిస్పందన సంబంధాన్ని తెలియజేస్తుంది; ‘అని చెప్పి’ రెండు వరుస చర్యలను సహజమైన తెలుగు కథనంగా కలుపుతుంది. దైవసంబంధ సందర్భానికి తగిన గౌరవార్థక ‘ఆయన’ వాడినా, మూలంలోని భావానికి అదనపు బిరుదు చేర్చలేదు.
