- from: కానీ ఇప్పుడు అతడు ఎలా చూస్తున్నాడో మాకు తెలియదు; అతని కళ్లు ఎవరు తెరిచారో కూడా మాకు తెలియదు. అతన్నే అడగండి; అతడు పెద్దవాడు. తన సంగతి తానే చెబుతాడు.[a]
  to: కానీ ఇప్పుడు అతడు ఎలా చూస్తున్నాడో మాకు తెలియదు; లేదా అతని కళ్లను ఎవరు తెరిచారో మాకు తెలియదు. అతనిని అడగండి; అతనికి వయసు వచ్చింది. తన గురించి తానే మాట్లాడతాడు.[a]
