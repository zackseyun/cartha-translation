source:
  edition: SBLGNT
  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: te
  text: కానీ ఇప్పుడు అతడు ఎలా చూస్తున్నాడో మాకు తెలియదు; లేదా అతని కళ్లను ఎవరు తెరిచారో మాకు తెలియదు. అతనిని అడగండి; అతనికి వయసు వచ్చింది. తన గురించి తానే మాట్లాడతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన తరఫున తానే మాట్లాడగలడు.” గ్రీకులోని భవిష్యత్ క్రియారూపం, అతడు స్వయంగా జవాబివ్వగలడని లేదా జవాబివ్వాల్సిన బాధ్యత అతనిదేనని ఆచరణాత్మకంగా నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: కానీ ఇప్పుడు అతడు ఎలా చూస్తున్నాడో
  rationale: πῶς అనే ‘ఎలా’ ప్రశ్నను, δέ లోని స్వల్ప వ్యతిరేక భావాన్ని, νῦν βλέπει లోని ‘ఇప్పుడు చూస్తున్నాడు’ అనే వర్తమాన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὐκ οἴδαμεν
  choice: మాకు తెలియదు
  rationale: తెలుగులో సహజమైన జ్ఞాననిరాకరణ. గ్రీకులో ఈ మాట రెండుసార్లు రావడం వల్ల అనువాదంలోనూ పునరుక్తిని ఉంచాం.
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: అతని కళ్లు ఎవరు తెరిచారో కూడా
  rationale: ‘కళ్లు తెరవడం’ అనే కథనంలోని రూపకల్పనను నిలుపుతూ, ἤ సూచించే రెండవ ప్రత్యామ్నాయ ప్రశ్నను తెలుగులో ‘కూడా’తో సహజంగా కలిపింది.
- source_word: αὐτὸν ἐρωτήσατε
  choice: అతన్నే అడగండి
  rationale: బహువచన ఆజ్ఞను సహజంగా అనువదించింది; ‘నే’ ద్వారా αὐτόν పట్ల సందర్భానుగుణమైన దృష్టిని తెలుపుతుంది.
- source_word: ἡλικίαν ἔχει
  choice: అతడు పెద్దవాడు
  rationale: ఇక్కడ శారీరక ఎత్తు కాకుండా, స్వతంత్రంగా సమాధానం చెప్పగల వయసు వచ్చిన వ్యక్తి అనే సందర్భార్థాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: తన సంగతి తానే చెబుతాడు
  rationale: αὐτός లోని ఉద్ఘాటనను ‘తానే’తో, περὶ ἑαυτοῦ లోని స్వవిషయ భావాన్ని ‘తన సంగతి’తో, భవిష్యత్ క్రియను ‘చెబుతాడు’తో నిలుపుతుంది.
theological_decisions:
- issue: ἡλικίαν ἔχει యొక్క సందర్భార్థం
  choice: స్వతంత్రంగా జవాబివ్వగల పెద్దవయసు వచ్చినవాడు
  alternative: సాధారణ పరిపక్వత; లేదా శారీరక ఎత్తు
  rationale: తల్లిదండ్రులు ప్రశ్నించేవారిని తమ కుమారుని దగ్గరకు మళ్లిస్తున్న విచారణ సందర్భం ఇది. కాబట్టి ఈ మాట స్వయంగా సాక్ష్యం చెప్పగల వయసును సూచిస్తుంది.
- issue: αὐτὸς περὶ ἑαυτοῦ λαλήσει యొక్క బలం
  choice: అతడు తన విషయమై తానే సమాధానం చెబుతాడనే వాక్యం
  alternative: అతడు తన గురించి సాధారణంగా మాట్లాడతాడనే అర్థం
  rationale: విచారణ సందర్భం కారణంగా ఇది తన తరఫున తానే చెప్పే సాక్ష్యాన్ని సూచిస్తుంది; అయితే గ్రీకు భవిష్యత్ రూపాన్ని ప్రధాన పాఠ్యంలో భవిష్యత్‌గానే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మూలంలోని పునరుక్తి మరియు విచారణ ధోరణి నిలుపబడ్డాయి. సంప్రదింపు ఆంగ్ల పాఠ్యంలో [a] గుర్తు ముందరి ఉపవాక్యానికి చేరినట్లు కనిపించినా, దాని గమనిక గ్రీకు λαλήσει అనే భవిష్యత్ క్రియకు సంబంధించినందున తెలుగు ప్రధాన పాఠ్యంలో సంబంధిత చివరి వాక్యానికే గుర్తు ఉంచబడింది.
