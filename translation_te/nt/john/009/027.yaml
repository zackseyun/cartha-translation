id: JHN.9.27
reference: John 9:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: te
  text: 'అతడు వారికి జవాబిచ్చాడు: “నేను మీకు ముందే చెప్పాను, మీరు వినలేదు.[a] మళ్లీ ఎందుకు వినాలనుకుంటున్నారు? మీరు కూడా ఆయన శిష్యులు కావాలని అనుకోవడం లేదు కదా?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు చెప్పినదాన్ని పట్టించుకోలేదు.” గ్రీకు క్రియకు ‘వినడం’ లేదా సందర్భానుసారంగా ‘చెప్పినదాన్ని శ్రద్ధగా స్వీకరించడం’ అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీరు కూడా ఆయన శిష్యులు కావాలని అనుకోవడం లేదుగా?” గ్రీకులోని μήతో వచ్చిన ప్రశ్న సాధారణంగా ప్రతికూల సమాధానాన్ని ఆశిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: కథన సందర్భంలోని సాధారణ ప్రతిస్పందన క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἤδη
  choice: ముందే
  rationale: ఇంతకుముందే చెప్పిన విషయాన్ని నొక్కిచెబుతుంది; తెలుగులో సహజంగా ఉంటుంది.
- source_word: οὐκ ἠκούσατε
  choice: వినిపించుకోలేదు
  rationale: కేవలం శబ్దం వినకపోవడం కాకుండా, చెప్పినదాన్ని శ్రద్ధగా స్వీకరించకపోవడం లేదా పట్టించుకోకపోవడం అనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: మళ్లీ ఎందుకు వినాలనుకుంటున్నారు?
  rationale: τί ఇక్కడ విసుగుతో కూడిన ‘ఎందుకు?’ అనే భావాన్ని ఇస్తుంది; పూర్వవాక్యంలోని విషయమే వినవలసిన అంశమని తెలుగులో సందర్భం స్పష్టం చేస్తుంది.
- source_word: μὴ καὶ ὑμεῖς
  choice: మీరు కూడా ... లేదు కదా?
  rationale: μή వల్ల ప్రతికూల సమాధానం ఆశించే ప్రశ్నార్థక ధోరణిని తెలుగు ‘లేదు కదా?’ నిర్మాణం సహజంగా నిలుపుతుంది.
- source_word: αὐτοῦ μαθηταὶ
  choice: ఆయన శిష్యులు
  rationale: గౌరవప్రదమైన సర్వనామంతో సహజ తెలుగు స్వామ్య సంబంధాన్ని, యోహాను సందర్భంలోని ‘శిష్యులు’ అనే భావాన్ని నిలుపుతుంది.
- source_word: γενέσθαι
  choice: కావడం
  rationale: ఒక స్థితిలోకి రావడం అనే γίνομαι యొక్క ప్రవేశార్థాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: చివరి ప్రశ్నలోని అలంకారిక, వ్యంగ్య ధోరణి
  choice: “మీరు కూడా ఆయన శిష్యులు కావాలనుకోవడం లేదు కదా?”
  alternative: “ఒకవేళ మీరు కూడా ఆయన శిష్యులు కావాలనుకుంటున్నారా?”
  rationale: μή సాధారణంగా ప్రతికూల సమాధానాన్ని ఆశించే ప్రత్యక్ష ప్రశ్నను సూచిస్తుంది. ‘లేదు కదా?’ ఆ అంచనాను స్పష్టంగా ఉంచుతుంది; అయితే సందర్భంలో ఆ మనిషి వ్యంగ్యంగా వారిని సవాలు చేస్తున్న ధోరణి కూడా నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో అనువదించబడింది. ప్రశ్నలలోని విసుగు, వ్యంగ్యం నిలుపబడ్డాయి; గ్రీకు ἀκούω యొక్క ‘వినడం/వినిపించుకోవడం’ అర్థవిస్తృతిని పాదటిప్పణిలో సూచించాం.
