- from: 'అతడు వారికి జవాబిచ్చాడు: “నేను మీకు ముందే చెప్పాను, కానీ మీరు వినిపించుకోలేదు.[a] మళ్లీ ఎందుకు వినాలనుకుంటున్నారు? మీరు కూడా ఆయన శిష్యులు కావాలనుకోవడం లేదు కదా?”[b]'
  to: 'అతడు వారికి జవాబిచ్చాడు: “నేను మీకు ముందే చెప్పాను, మీరు వినలేదు.[a] మళ్లీ ఎందుకు వినాలనుకుంటున్నారు? మీరు కూడా ఆయన శిష్యులు కావాలని అనుకోవడం లేదు కదా?”[b]'
