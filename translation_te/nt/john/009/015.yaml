translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు వాక్యంలోని పునరావృత ప్రశ్న, పరిసయ్యులు కూడా ప్రశ్నించిన భావం, చివరి వర్తమాన క్రియ యొక్క సజీవత నిలుపబడ్డాయి.
