id: JHN.9.15
reference: John 9:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: te
  text: కాబట్టి పరిసయ్యులు కూడా అతనికి చూపు ఎలా వచ్చిందో[a] మళ్లీ అడిగారు. అతడు వారితో, “ఆయన నా కళ్ల మీద బురద[b] పెట్టాడు; నేను కడిగుకున్నాను, చూస్తున్నాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు ఎలా చూడగలిగాడో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మట్టి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ప్రశ్నించడం పునరావృతమైందని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి సంఘటనతో ఈ ప్రశ్నకు ఉన్న కథన సంబంధాన్ని సూచిస్తుంది; ఇక్కడ ఇది కఠినమైన తార్కిక నిర్ధారణను తప్పనిసరిగా సూచించదు.
- source_word: ἠρώτων
  choice: అడిగారు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగింపు లేదా పునరావృత భావాన్ని సందర్భం మరియు ‘మళ్లీ’ కలిపి తెలుగులో సహజంగా తెలియజేస్తాయి.
- source_word: καὶ οἱ Φαρισαῖοι
  choice: పరిసయ్యులు కూడా
  rationale: καί ఇక్కడ పరిసయ్యులు సైతం ప్రశ్నించినవారిలో చేరారని సూచిస్తుంది.
- source_word: πῶς ἀνέβλεψεν
  choice: అతనికి చూపు ఎలా వచ్చిందో
  rationale: పుట్టుకతో అంధుడైన ఈ వ్యక్తి చూడగలగడం మొదలైన భావాన్ని సందర్భానుసారంగా తెలుపుతుంది; ‘తిరిగి చూశాడు’ అని అనడం సందర్భానికి అనవసరమైన పూర్వ చూపును సూచించవచ్చు.
- source_word: Πηλὸν
  choice: బురద
  rationale: πηλός బురద లేదా మట్టిముద్దను సూచించగలదు; ‘బురద’ సాధారణ ఆధునిక తెలుగులో సహజంగా అర్థమవుతుంది.
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: నా కళ్ల మీద బురద పెట్టాడు
  rationale: ἐπιτίθημι యొక్క ‘దేనిమీదనైనా ఉంచడం’ అనే భావాన్ని అతిశయించకుండా నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἐνιψάμην
  choice: నేను కడుక్కున్నాను
  rationale: మధ్యమ వాచక రూపంలోని తనకు తాను కడుక్కొనే భావాన్ని సహజమైన తెలుగు రూపం వ్యక్తం చేస్తుంది.
- source_word: βλέπω
  choice: ఇప్పుడు చూస్తున్నాను
  rationale: వర్తమాన కాలంలోని ప్రస్తుత ఫలితాన్ని స్పష్టంగా, సజీవంగా తెలియజేస్తుంది; ‘ఇప్పుడు’ సందర్భంలో అంతర్లీనంగా ఉన్న ప్రస్తుత స్థితిని తెలుగులో సహజం చేస్తుంది.
