  source_fidelity: 'వచనంలోని πάλιν (‘మళ్లీ’) ప్రశ్నించడాన్ని సూచించేలా, οἱ Φαρισαῖοι (‘పరిసయ్యులు’) కూడా ప్రశ్నించినట్టు, అలాగే ‘బురదను కళ్లపై ఉంచాడు—కడిగుకున్నాను—చూస్తున్నాను’ అనే వరుసను అనువాదం సరిగానే ప్రతిబింబిస్తుంది. అయితే పాదటిప్పణి aలో ‘అతడు మళ్లీ ఎలా చూశాడో’ అని చెప్పడం గ్రీకు వాక్యనిర్మాణానికి సరిపోదు: πάλιν అనేది ἠρώτων (‘అడిగారు’)తో సంబంధించి ఉంది, ἀνέβλεψενతో కాదు. ‘ఇప్పుడు’ అనేది ప్రస్తుత ఫలితాన్ని స్పష్టం చేస్తుంది గానీ మూలంలో ప్రత్యక్షంగా లేదు; దానిని తొలగించడం మరింత సమానార్థకంగా ఉంటుంది. ‘కడిగుకున్నాను’ సందర్భానుసారంగా కళ్లను కడుక్కోవడాన్ని సహజంగా సూచిస్తుంది.'
