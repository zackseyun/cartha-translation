id: JHN.9.22
reference: John 9:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: te
  text: అతని తల్లిదండ్రులు యూదులకు[a] భయపడుతుండటం వల్ల ఈ మాటలు చెప్పారు. ఎందుకంటే, ఎవరైనా ఆయనను మెస్సీయగా[b] ఒప్పుకుంటే, అతనిని సమాజమందిరం నుండి వెలివేయాలని యూదులు అప్పటికే ఒప్పందం చేసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో ‘యూదులు.’ ఈ సందర్భంలో ఇది యూదు ప్రజలందరినీ విచక్షణ లేకుండా సూచించకుండా, బహుశా సమాజమందిరం విషయంలో అధికారమున్న యూదు అధికారులను సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా ‘ఆయనను క్రీస్తుగా ఒప్పుకుంటే,’ లేదా ‘ఆయనే క్రీస్తు అని అంగీకరిస్తే.’
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπαν
  choice: ఇలా చెప్పారు
  rationale: ταῦτα అనే బహువచన సూచనను సందర్భానుసారంగా సహజమైన ఆధునిక తెలుగులో ‘ఇలా’ తెలియజేస్తుంది; εἶπανకు ‘చెప్పారు’ సరళమైన కథన సమానం.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: అతని తల్లిదండ్రులు
  rationale: γονεῖςకు సహజమైన తెలుగు సమానం ‘తల్లిదండ్రులు’; αὐτοῦను ‘అతని’గా స్పష్టంగా ఉంచింది.
- source_word: ὅτι ἐφοβοῦντο
  choice: భయపడినందువల్ల
  rationale: ὅτι ఇక్కడ కారణాన్ని పరిచయం చేస్తుంది; imperfect ἐφοβοῦντο తెలిపే కొనసాగుతున్న భయాన్ని తెలుగు కారణార్థక నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: యూదులకు / యూదులు
  rationale: గ్రీకు పదబంధంలోని విస్తృత పదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ఈ సందర్భంలో అధికారమున్న యూదు నాయకులను సూచించే సంభావ్యతను పాదసూచికలో వివరించింది.
- source_word: ἤδη γὰρ συνετέθειντο
  choice: ఎందుకంటే ... అప్పటికే ఒక నిర్ణయానికి వచ్చారు
  rationale: γὰρ ఇచ్చే వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’ చూపుతుంది; pluperfect భావం మరియు ముందే కుదిరిన ఉమ్మడి అంగీకారాన్ని ‘అప్పటికే ఒక నిర్ణయానికి వచ్చారు’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν
  choice: ఎవరైనా ఆయనను మెస్సీయగా ఒప్పుకుంటే
  rationale: ὁμολογέω యొక్క బహిరంగ అంగీకార భావాన్ని ‘ఒప్పుకుంటే’ తెలియజేస్తుంది; χριστόν ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయగా’ అనువదించింది.
- source_word: ἀποσυνάγωγος γένηται
  choice: వారిని సమాజమందిరం నుండి వెలివేయాలని
  rationale: సమాజమందిరపు సమూహం నుండి బహిష్కరించబడే భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో తెలియజేస్తుంది; ‘వారిని’ అనే గౌరవ/లింగనిరపేక్ష ఏకవచన ప్రయోగం షరతులోని ‘ఎవరైనా’తో సరిపోతుంది.
theological_decisions:
- issue: χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు / ఆ క్రీస్తు
  rationale: ఇక్కడ χριστός పేరు వలె కాక, యేసును వాగ్దానిత అభిషిక్తునిగా గుర్తించే బిరుదుగా పనిచేస్తుంది. అందువల్ల యూదు మెస్సీయ నిరీక్షణ నేపథ్యాన్ని ‘మెస్సీయ’ నిలుపుతుంది.
- issue: యోహానులో οἱ Ἰουδαῖοι యొక్క సూచన
  choice: యూదులు—సందర్భ వివరణతో
  alternative: యూదు అధికారులు / యూదయులు
  rationale: మూలంలోని విస్తృత పదాన్ని సంకుచితం చేయకుండా ప్రధాన పాఠ్యంలో నిలిపింది. అయితే సమాజమందిరం నుండి వెలివేసే అధికారమున్నవారే ఇక్కడ ఉద్దేశింపబడి ఉండవచ్చని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సమాజమందిరం’ అనే పదం synagogue యొక్క యూదు ఆరాధనా-సమాజ నేపథ్యాన్ని నిలుపుతుంది. కారణ సంబంధాన్ని రెండు వాక్యాలుగా ఇచ్చి సాధారణ పాఠకులకు స్పష్టత కల్పించింది.
