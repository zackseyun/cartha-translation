- from: 'యేసు వారితో ఇలా అన్నాడు: “మీరు గుడ్డివారై ఉంటే, మీకు పాపం ఉండేది కాదు. కాని ఇప్పుడు మీరు, ‘మేము చూస్తున్నాం’ అని అంటున్నారు; కాబట్టి మీ పాపం అలాగే నిలిచి ఉంది.[a]”'
  to: 'యేసు వారితో ఇలా అన్నాడు: “మీరు గుడ్డివారై ఉంటే, మీకు పాపం ఉండేది కాదు. కాని ఇప్పుడు మీరు, ‘మేము చూస్తున్నాం’ అని అంటున్నారు; మీ పాపం నిలిచి ఉంది.[a]”'
