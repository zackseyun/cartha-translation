source:
  edition: SBLGNT
  text: εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ τυφλοὶ ἦτε, οὐκ ἂν εἴχετε ἁμαρτίαν· νῦν δὲ λέγετε ὅτι Βλέπομεν· ⸀ἡ ἁμαρτία ὑμῶν μένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: te
  text: 'యేసు వారితో ఇలా అన్నాడు: “మీరు గుడ్డివారై ఉంటే, మీకు పాపం ఉండేది కాదు. కాని ఇప్పుడు మీరు, ‘మేము చూస్తున్నాం’ అని అంటున్నారు; మీ పాపం నిలిచి ఉంది.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ దోషం నిలిచి ఉంది.” గ్రీకులో ‘పాపం’ అని ఉంది; ఇక్కడ అది దోషబాధ్యత అనే భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: గుడ్డివారు
  rationale: మూలపదానికి నేరమైన అర్థం ‘గుడ్డివారు.’ సందర్భంలో ఆత్మసంబంధమైన గ్రహింపును సూచించే రూపకార్థం ఉన్నా, దానిని వివరణాత్మకంగా ప్రధాన వాక్యంలో చేర్చకుండా యోహాను వాడిన రూపకాన్ని నిలిపింది.
- source_word: οὐκ ἂν εἴχετε
  choice: మీకు ... ఉండేది కాదు
  rationale: ἄνతో కూడిన అసంపూర్ణ భూతకాల క్రియ అవాస్తవ షరతు ఫలితాన్ని తెలియజేస్తుంది; తెలుగులో ‘ఉండేది కాదు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἁμαρτίαν / ἡ ἁμαρτία ὑμῶν
  choice: పాపం / మీ పాపం
  rationale: ἁμαρτίαకు నేరమైన సమానార్థకం ‘పాపం.’ ఈ సందర్భంలో దోషభావం కూడా అంతర్లీనంగా ఉండవచ్చు; అయినా ప్రధాన పాఠంలో యోహాను పదప్రయోగాన్ని కాపాడింది.
- source_word: νῦν δὲ
  choice: కాని ఇప్పుడు
  rationale: ఊహాత్మక పరిస్థితికి ప్రస్తుతం ఉన్న వాస్తవానికి మధ్య వ్యత్యాసాన్ని స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: λέγετε ὅτι Βλέπομεν
  choice: మీరు, ‘మేము చూస్తున్నాం’ అని అంటున్నారు
  rationale: రెండవ పురుష బహువచనం నుంచి మొదటి పురుష బహువచన ప్రత్యక్ష ఉక్తికి మారే గ్రీకు వాక్య నిర్మాణాన్ని, దానిలోని వ్యంగ్య ప్రభావాన్ని నిలిపింది.
- source_word: μένει
  choice: అలాగే నిలిచి ఉంది
  rationale: μένει కొనసాగుతున్న స్థితిని సూచించే యోహాను రచనల్లో ప్రాముఖ్యమైన క్రియ. ‘నిలిచి ఉంది’ ఆ కొనసాగింపును సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘గుడ్డివారు’ అనేది ఆత్మసంబంధమైన అంధత్వమని, ‘పాపం’ అనేది దేవుని ఎదుట దోషమని ప్రధాన పాఠంలో స్పష్టీకరించాలా?
  choice: ‘గుడ్డివారు,’ ‘పాపం’ అనే మూలానికి దగ్గర పదాలనే ప్రధాన పాఠంలో ఉంచడం.
  alternative: ‘మీరు ఆత్మసంబంధంగా గుడ్డివారై ఉంటే, పాపదోషం మీకు ఉండేది కాదు’ లేదా ‘మీరు గుడ్డివారై ఉంటే, మీరు దోషులుగా ఉండేవారు కాదు.’
  rationale: సందర్భం ఆత్మసంబంధమైన గ్రహింపును సూచిస్తున్నా, యేసు మాటలు ఈ అధ్యాయమంతటా ఉన్న శారీరక అంధత్వపు రూపకాన్ని ఉద్దేశపూర్వకంగా కొనసాగిస్తాయి. వివరణను ప్రధాన పాఠంలో చేర్చడం రూపకంలోని విస్తృత భావాన్ని, ἁμαρτίαలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని కుదిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ప్రత్యక్ష ఉక్తి, రూపకం, అవాస్తవ షరతు, యోహాను రచనకు ప్రత్యేకమైన ‘నిలిచి ఉండడం’ భావం కాపాడబడ్డాయి. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో చేర్చబడింది.
