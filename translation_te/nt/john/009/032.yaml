source:
  edition: SBLGNT
  text: ἐκ τοῦ αἰῶνος οὐκ ἠκούσθη ὅτι ἠνέῳξέν τις ὀφθαλμοὺς τυφλοῦ γεγεννημένου·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: te
  text: పూర్వకాలం నుంచీ, పుట్టుకతో అంధుడైన ఒకరి కళ్లను ఎవరైనా తెరిచినట్లు ఎన్నడూ వినబడలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లోకం ఆరంభమైనప్పటి నుంచీ, … ఎన్నడూ వినబడలేదు.”
    reason: ἐκ τοῦ αἰῶνος అనే నుడికారానికి సాధ్యమైన సంప్రదాయ కాలార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: పూర్వకాలం నుంచీ
  rationale: ఈ నుడికారం జ్ఞాపకమున్న చరిత్ర అంతటినీ సూచిస్తుంది. ‘అనాదినుంచి’ అనే పదం కలిగించగల తాత్త్విక నిత్యత్వ భావాన్ని రుద్దకుండా చారిత్రక కాలవ్యాప్తిని నిలుపుతుంది.
- source_word: οὐκ ἠκούσθη
  choice: ఎన్నడూ వినబడలేదు
  rationale: నివేదించబడిన పూర్వ ఉదాహరణ ఏదీ లేదనే కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὅτι
  choice: …తెరిచినట్లు
  rationale: వినబడని విషయం ఏమిటో తెలిపే గ్రీకు ఉపవాక్యాన్ని తెలుగులో సహజమైన విషయార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ἠνέῳξέν
  choice: తెరిచిన
  rationale: కళ్లతో కలిసి వాడిన ἀνοίγω యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; ‘చూపు ఇచ్చిన’ అని అర్థవిస్తరణ చేయదు.
- source_word: τις
  choice: ఎవరైనా
  rationale: సార్వత్రిక నిషేధ సందర్భంలో అనిశ్చిత కర్తను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὀφθαλμοὺς
  choice: కళ్లను
  rationale: శరీరావయవాన్ని సూచించే సహజ తెలుగు రూపం; సందర్భంలో ఎవరి కళ్లనో తరువాతి పదబంధం స్పష్టం చేస్తుంది.
- source_word: τυφλοῦ γεγεννημένου
  choice: పుట్టుకతో గుడ్డివాడైన వ్యక్తి
  rationale: పుట్టినప్పటి నుంచే అంధుడైన వ్యక్తిని సూచించే గ్రీకు పరిపూర్ణ కృదంత భావాన్ని స్పష్టంగా అందిస్తుంది; ‘వ్యక్తి’ మూలంలో లేని లింగాన్ని అదనంగా బలపరచకుండా వాక్యాన్ని సహజం చేస్తుంది.
theological_decisions:
- issue: ἐκ τοῦ αἰῶνος యొక్క కాలవ్యాప్తి
  choice: పూర్వకాలం నుంచీ—మానవ జ్ఞాపక చరిత్రలో ఇంతకు ముందు వినబడలేదనే భావం
  alternative: లోకం పుట్టినప్పటి నుంచీ; అనాదినుంచి
  rationale: ఇక్కడ మాట్లాడేవాడు అద్భుతానికి మానవ అనుభవంలో పూర్వ ఉదాహరణ లేదని చెబుతున్నాడు; నిత్యత్వం గురించిన తాత్త్విక ప్రకటన చేయడం లేదు. ప్రధాన పాఠం చారిత్రక నుడికారాన్ని ఉంచి, సంప్రదాయ విస్తృత రూపాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘గుడ్డివాడు’ సందర్భంలోని శారీరక స్థితిని నేరుగా ప్రతిబింబిస్తుంది; ‘పుట్టుకతో’ జన్మనుంచి ఉన్న స్థితిని స్పష్టం చేస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో చేర్చబడింది.
