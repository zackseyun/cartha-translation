id: JHN.9.29
reference: John 9:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: te
  text: దేవుడు మోషేతో మాట్లాడాడని మాకు తెలుసు; కానీ ఈ మనిషి ఎక్కడి నుండి వచ్చాడో[a] మాకు తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ మనిషి ఎక్కడివాడో.’ యోహాను సువార్తలో యేసు మూలాన్ని గురించిన ప్రశ్నలు సాధారణ అర్థంతో పాటు లోతైన దైవిక ప్రాముఖ్యతను కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: మాకు
  rationale: స్పష్టంగా ఉన్న సర్వనామం వక్తల ధీమాను, తరువాతి ‘ఈయన’తో ఉన్న వ్యత్యాసాన్ని సూచిస్తుంది; తెలుగులో ‘మాకు తెలుసు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: οἴδαμεν
  choice: తెలుసు
  rationale: తెలిసినదనే నిశ్చయాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది; వచనంలోని రెండు సందర్భాల్లోనూ ఒకే విధంగా అనువదించబడింది.
- source_word: Μωϋσεῖ
  choice: మోషేతో
  rationale: λαλέω క్రియతో కూడిన చతుర్థీ విభక్తి సంభాషణకు ఉద్దేశిత వ్యక్తిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘మోషేతో మాట్లాడాడు’ సహజం.
- source_word: λελάληκεν
  choice: మాట్లాడాడు
  rationale: గ్రీకు పరిపూర్ణ కాలం దేవుడు మోషేతో మాట్లాడినది స్థిరమైన, అంగీకరించబడిన వాస్తవమని సూచిస్తుంది; తెలుగులో సహజమైన భూతకాల రూపం సందర్భంలో ఆ కొనసాగుతున్న ప్రాముఖ్యతను మోస్తుంది.
- source_word: τοῦτον δὲ
  choice: కానీ ఈయన విషయానికొస్తే
  rationale: δέ తెలిపే వ్యత్యాసాన్ని, τοῦτον యొక్క విషయమార్పు మరియు దూరం పెట్టే ధోరణిని సహజమైన గౌరవసూచక తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: πόθεν ἐστίν
  choice: ఎక్కడి నుండి వచ్చాడో
  rationale: మూలం లేదా ఉద్భవాన్ని సూచించే ప్రశ్నను సహజ తెలుగులో ఉంచుతూ, భౌగోళిక మూలం మరియు లోతైన మూలాధారం అనే రెండింటి సాధ్యతను తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: πόθεν ἐστίνలో యేసు మూలం యొక్క భావం
  choice: ‘ఎక్కడి నుండి వచ్చాడో’ అని విస్తృతంగా అనువదించడం
  alternative: ‘ఈయన ఎక్కడివాడో’ లేదా ‘ఈయన మూలం ఏమిటో’
  rationale: యోహాను సువార్తలో యేసు ఎక్కడి నుండి వచ్చాడనే ప్రశ్న సాధారణ భౌగోళిక అర్థంతో పాటు లోతైన దైవిక మూలాన్ని కూడా సూచించగలదు. అనువాదం ఈ కథన వ్యంగ్యాన్ని, వేదాంతపరమైన ఉద్విగ్నతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఈయన’ రూపం వ్యక్తిని సూచిస్తూ మూలంలోని దూరం పెట్టే వ్యత్యాసాన్ని పూర్తిగా అవమానకరంగా మార్చకుండా కాపాడుతుంది; వాక్యక్రమం తెలుగు పఠన సౌలభ్యానికి అనుగుణంగా ఉంది.
