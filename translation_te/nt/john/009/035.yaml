  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: te
  text: వారు అతనిని బయటకు వెళ్లగొట్టారని యేసు విన్నాడు. ఆయన అతనిని కనుగొన్నప్పుడు, “నీవు మనుష్య కుమారుని నమ్ముతున్నావా?” అని అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “మనుష్య కుమారుడు”కు బదులుగా “దేవుని కుమారుడు” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: అతన్ని బయటకు వెళ్లగొట్టారని
  rationale: ἐκβάλλωతో పాటు ἔξω వాడటం బహిష్కరణను బలంగా సూచిస్తుంది. ‘బయటకు వెళ్లగొట్టారు’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని సామాజిక వెలివేత భావాన్ని నిలుపుతుంది.
- source_word: εὑρὼν αὐτὸν
  choice: ఆయన అతన్ని కనుగొని
  rationale: అయోరిస్ట్ పార్టిసిపుల్ ఇక్కడ తదనంతర చర్యను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘కనుగొని’ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Σὺ πιστεύεις
  choice: నీవు ... విశ్వాసముంచుతున్నావా?
  rationale: πιστεύω ఇక్కడ వ్యక్తిపట్ల విశ్వాసం లేదా నమ్మకాన్ని సూచిస్తుంది. స్పష్టంగా ఉన్న Σὺ యొక్క స్వల్ప ఉద్ఘాటనను ‘నీవు’ నిలుపుతుంది.
- source_word: πιστεύεις εἰς
  choice: '...లో విశ్వాసముంచుతున్నావా'
  rationale: πιστεύωతో εἰς వ్యక్తివైపు దిశచూపే విశ్వాసాన్ని వ్యక్తం చేస్తుంది. ‘లో విశ్వాసముంచు’ తెలుగు బైబిలు వాడుకలో గుర్తించదగినదిగా, భావపరంగా తగినదిగా ఉంది.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: ఈ బిరుదు దానియేలు 7తోను యోహాను సువార్తలోని వాడుకతోను ఉన్న అంతర్గ్రంథ సంబంధాన్ని నిలుపుతుంది; ‘మనుష్య కుమారుడు’ తెలుగు పాఠకులకు స్థిరంగా పరిచయమైన రూపం.
theological_decisions:
- issue: ప్రశ్నలోని క్రీస్తుసంబంధ బిరుదు యొక్క పాఠభేదం
  choice: మనుష్య కుమారుడు
  alternative: దేవుని కుమారుడు
  rationale: SBLGNT ప్రధాన పాఠంలో ἀνθρώπου (‘మనుష్య’) ఉంది; అందువల్ల దానినే ప్రధాన వచనంలో అనుసరించాం. ప్రాముఖ్యమైన, చారిత్రక ప్రభావం కలిగిన ‘దేవుని కుమారుడు’ అనే పాఠభేదాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. బహిష్కరణ తీవ్రతను ‘బయటకు వెళ్లగొట్టారు’ ద్వారా, Σὺ ఉద్ఘాటనను ‘నీవు’ ద్వారా నిలిపాం. పాదటిప్పణి గుర్తు సంబంధిత ప్రశ్న ముగింపులో ఉంచబడింది.
