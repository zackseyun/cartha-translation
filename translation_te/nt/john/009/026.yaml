  text: εἶπον ⸂οὖν αὐτῷ⸃· Τί ἐποίησέν σοι; πῶς ἤνοιξέν σου τοὺς ὀφθαλμούς;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/026.yaml
  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: te
  text: 'అప్పుడు వారు అతనితో ఇలా అన్నారు: “అతడు నీకు ఏమి చేశాడు? నీ కళ్లను ఎలా తెరిచాడు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: అన్నారు
  rationale: λέγω యొక్క భూతకాల రూపం ఇక్కడ సమూహం పలికిన ప్రత్యక్ష మాటను పరిచయం చేస్తుంది; ప్రశ్నల సందర్భమైనా, మూల క్రియలోని సాధారణ ‘చెప్పు/అను’ భావాన్ని నిలుపుతుంది.
- source_word: οὖν
  choice: అందుకే
  rationale: మునుపటి మాటకు ప్రతిస్పందనగా వచ్చిన తార్కిక/సంభాషణ కొనసాగింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: αὐτῷ
  choice: అతనితో
  rationale: స్వస్థత పొందిన మనిషిని సూచించే పరోక్ష కర్మ; తెలుగులో మాట పలకడాన్ని సహజంగా ‘అతనితో ... అన్నారు’ అని వ్యక్తం చేస్తారు.
- source_word: Τί
  choice: ఏమి
  rationale: మొదటి ప్రశ్నను ప్రారంభించే ప్రశ్నార్థక సర్వనామానికి నేరమైన సమానార్థకం.
- source_word: ἐποίησέν σοι
  choice: నీకు ఏమి చేశాడు
  rationale: ποιέω దత్తివంతో ఇక్కడ ‘నీకు ఏమి చేశాడు’ అనే అర్థాన్ని ఇస్తుంది; మేలు చేశాడనే భావాన్ని అవసరానికి మించి చేర్చదు.
- source_word: πῶς
  choice: ఎలా
  rationale: విధానాన్ని లేదా సాధనాన్ని అడిగే ప్రశ్నార్థక క్రియావిశేషణానికి సహజమైన తెలుగు రూపం.
- source_word: ἤνοιξέν
  choice: తెరిచాడు
  rationale: ἀνοίγω యొక్క సకర్మక భావాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: σου τοὺς ὀφθαλμούς
  choice: నీ కళ్లను
  rationale: శరీర భాగానికి గ్రీకులో వాడిన స్వామ్య నిర్మాణాన్ని సహజమైన తెలుగు స్వామ్య రూపంలో వ్యక్తం చేస్తుంది.
