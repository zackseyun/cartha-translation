  naturalness: The wording is clear, idiomatic modern standard Telugu. Adding ‘ఇలా’ before the direct quotation makes the speech-introduction construction especially smooth, though it does not alter meaning.
  terminology: ‘కళ్లు’ is a natural modern equivalent for ὀφθαλμούς, and ‘తెరిచాడు’ correctly retains the active sense of ἤνοιξεν. No theological terminology or names occurs.
