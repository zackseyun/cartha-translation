  revised_text: కాబట్టి పొరుగువారూ, అతనిని ఇంతకుముందు బిచ్చగాడిగా చూసినవారూ, “కూర్చుని బిచ్చమెత్తుకునేవాడు ఇతడే కదా?” అని చెప్పుకుంటూ ఉన్నారు.
