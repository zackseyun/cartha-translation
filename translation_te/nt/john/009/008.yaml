  naturalness: The revised wording is natural modern standard Telugu. “అతనిని ఇంతకుముందు బిచ్చగాడిగా చూసినవారు” cleanly expresses those who had formerly seen him as a beggar.
  terminology: “పొరుగువారు,” “బిచ్చగాడు,” and “బిచ్చమెత్తుకునేవాడు” are clear, ordinary, and suitable for the narrative register. No theological terminology is at issue.
