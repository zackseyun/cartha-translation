id: JHN.9.8
reference: John 9:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ οὖν γείτονες καὶ οἱ θεωροῦντες αὐτὸν τὸ πρότερον ὅτι ⸀προσαίτης ἦν ἔλεγον· Οὐχ οὗτός ἐστιν ὁ καθήμενος καὶ προσαιτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: te
  text: కాబట్టి పొరుగువారూ, అతనిని ఇంతకుముందు బిచ్చగాడిగా చూసినవారూ, “కూర్చుని బిచ్చమెత్తుకునేవాడు ఇతడే కదా?” అని చెప్పుకుంటూ ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందు జరిగిన స్వస్థతకు ఈ స్పందనను అనుసంధానించే కథన సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: γείτονες
  choice: పొరుగువారు
  rationale: అతని సమీపంలో నివసించేవారిని సూచించే నేరమైన, సాధారణ తెలుగు పదం.
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: అతన్ని చూసినవారు
  rationale: τὸ πρότερον ఇచ్చే పూర్వకాల భావం తరువాతి ‘ఇంతకుముందు’తో వ్యక్తమవుతుంది; వీరు గతంలో అతన్ని చూసి గుర్తుపట్టినవారు.
- source_word: ὅτι προσαίτης ἦν
  choice: అతడు ఇంతకుముందు బిచ్చగాడిగా ఉండగా
  rationale: ὅτι యొక్క వివరణాత్మక/పరిస్థితిగత సంబంధాన్ని అనవసరమైన కారణార్థంగా నిర్ధారించకుండా, అతన్ని వారు గతంలో ఏ స్థితిలో చూశారో సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἔλεγον
  choice: అని అనుకుంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పలువురి మధ్య పునరావృతమవుతున్న మాటల భావాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Οὐχ οὗτός ἐστιν
  choice: ఇతడే కదా?
  rationale: అవుననే జవాబును ఆశించే గ్రీకు ప్రతికూల ప్రశ్నను సహజమైన తెలుగు ప్రశ్నారూపంలో నిలుపుతుంది.
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: కూర్చుని బిచ్చమెత్తుకునేవాడు
  rationale: అతన్ని గుర్తించే అలవాటైన పూర్వ కార్యకలాపాన్ని తెలుగు అలవాటు సూచక రూపం సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘బిచ్చమెత్తుకునేవాడు’ అతని మునుపటి అలవాటైన కార్యాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలంలోని ప్రశ్న ఆశించే సమ్మతిని ‘కదా?’ నిలుపుతుంది.
