- from: కాబట్టి పొరుగువారూ, అతడు ఇంతకుముందు బిచ్చగాడిగా ఉండగా అతన్ని చూసినవారూ, “కూర్చుని బిచ్చమెత్తుకునేవాడు ఇతడే కదా?” అని అనుకుంటూ ఉన్నారు.
  to: కాబట్టి పొరుగువారూ, అతనిని ఇంతకుముందు బిచ్చగాడిగా చూసినవారూ, “కూర్చుని బిచ్చమెత్తుకునేవాడు ఇతడే కదా?” అని చెప్పుకుంటూ ఉన్నారు.
