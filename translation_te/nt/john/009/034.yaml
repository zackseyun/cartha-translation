source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: te
  text: 'వారు అతనికి ఇలా జవాబిచ్చారు: “నువ్వు పాపాలలో పూర్తిగా పుట్టావు; నువ్వు మాకు బోధిస్తావా?” అని. వారు అతన్ని బయటకు వెళ్లగొట్టారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “బయటకు వెళ్లగొట్టారు” అనేది వారి సమక్షం నుండి పంపివేయడాన్ని సూచించవచ్చు; ఈ సందర్భంలో సమాజమందిరం నుండి వెలివేయడాన్ని కూడా సూచించే అవకాశం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: వారు అతనికి జవాబిస్తూ ... అన్నారు
  rationale: గ్రీకులోని జంట క్రియల భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా వినిపించే నిర్మాణాన్ని వాడింది.
- source_word: Ἐν ἁμαρτίαις
  choice: పాపాల్లోనే
  rationale: మూలంలోని బహువచనాన్ని నిలిపి, నిందిస్తున్నవారి అవమానకరమైన మాటల తీవ్రతను తెలియజేస్తుంది.
- source_word: ἐγεννήθης ὅλος
  choice: పూర్తిగా ... పుట్టావు
  rationale: ὅλος తెలిపే సంపూర్ణతను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ఆ ఆరోపణ వెనుక ఉన్న పాపం-బాధ సంబంధాన్ని వివరించి తీర్చదు.
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: నువ్వు మాకు బోధిస్తావా?
  rationale: స్పష్టంగా ఉన్న σὺ యొక్క నొక్కిచెప్పే భావాన్ని, ఆగ్రహంతో కూడిన అలంకారప్రశ్నగా తెలుగులో అందిస్తుంది.
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: అతన్ని బయటకు వెళ్లగొట్టారు
  rationale: బలవంతపు బహిష్కరణ భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో అందిస్తుంది; అది కేవలం వారి సమక్షం నుంచా లేక సమాజం నుంచా అన్నది ప్రధాన పాఠ్యంలో నిర్ణయించదు.
theological_decisions:
- issue: పుట్టుకతో వచ్చిన అంధత్వం నేపథ్యంలో ‘పాపాల్లోనే పుట్టావు’ అనే ఆరోపణ అర్థం
  choice: ఆ మనిషి పూర్తిగా పాపాలతో గుర్తించబడిన స్థితిలో పుట్టాడన్న వారి శత్రుత్వపూరిత ఆరోపణగా అనువదించడం
  alternative: ‘పాపంలో పుట్టావు’; ‘పుట్టుకతోనే మహాపాపివి’; ‘నీ తల్లిదండ్రుల పాపదోషంతో పుట్టావు’
  rationale: గ్రీకు వాక్యం అవమానాన్ని నమోదు చేస్తుంది గాని వారు అతని స్వపాపాన్ని, వారసత్వ పాపాన్ని, లేక అతని పరిస్థితితో ముడిపెట్టిన పాపాన్ని ఉద్దేశించారో స్పష్టపరచదు. అందువల్ల ఆ వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలిపింది.
- issue: ἐξέβαλον αὐτὸν ἔξω సూచించే బహిష్కరణ పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘బయటకు వెళ్లగొట్టారు’ అని ఉంచడం
  alternative: సమాజమందిరం నుండి బహిష్కరించారు
  rationale: సందర్భం సమాజమందిర సమాజం నుండి వెలివేతను సూచించవచ్చు; అయినా ఈ వాక్యం మాత్రమే దాన్ని నిర్దిష్టంగా చెప్పదు. కాబట్టి సాధ్యమైన విస్తృత భావాన్ని పాదటిప్పణిలో పేర్కొంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వచనానికి తగిన గౌరవప్రదమైన ధోరణితో రూపొందించబడింది. నిందలోని బహువచన ‘పాపాలు’ మరియు ప్రశ్నలోని అవహేళనాత్మక నొక్కును నిలిపింది.
