revisions:
- from: 'ఆయన శిష్యులు ఆయనను ఇలా అడిగారు: “రబ్బీ, ఎవరు పాపం చేశారు—ఇతడా, ఇతని తల్లిదండ్రులా—ఇతడు గుడ్డివాడిగా పుట్టేలా?”[a]'
  to: 'ఆయన శిష్యులు ఆయనను ఇలా అడిగారు: “రబ్బీ, ఎవరు పాపం చేశారు, ఇతడా లేక ఇతని తల్లిదండ్రులా, ఇతడు అంధుడిగా పుట్టేలా?”[a]'
  rationale: The revision explicitly marks the Greek ‘or,’ adopts neutral modern terminology for blindness, and clarifies the alternative-reading note. It retains the disciples’ assumed sin–blindness connection as a question and does not present it as narrator-endorsed teaching.
