id: JHN.9.2
reference: John 9:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: te
  text: 'ఆయన శిష్యులు ఆయనను ఇలా అడిగారు: “రబ్బీ, ఎవరు పాపం చేశారు, ఇతడా లేక ఇతని తల్లిదండ్రులా, ఇతడు అంధుడిగా పుట్టేలా?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతడు అంధుడిగా పుట్టిన ఫలితంగా?” గ్రీకు వాక్యభాగం శిష్యుల ప్రశ్నలో వారు ఊహించిన ఉద్దేశం లేదా ఫలిత సంబంధాన్ని వ్యక్తపరచవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: అడిగారు
  rationale: ἐρωτάω యొక్క భూతకాల క్రియారూపాన్ని సహజమైన ఆధునిక తెలుగులో సూటిగా వ్యక్తపరుస్తుంది.
- source_word: μαθηταὶ
  choice: శిష్యులు
  rationale: బోధకుని అనుసరించి నేర్చుకునే వారి సంబంధాన్ని సువార్తల సందర్భంలో స్థిరంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: λέγοντες
  choice: ఇలా
  rationale: గ్రీకు వర్తమాన కృదంతాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య ప్రవేశంగా మలుస్తుంది; ప్రత్యేకమైన అదనపు భావాన్ని చేర్చదు.
- source_word: Ῥαββί
  choice: రబ్బీ
  rationale: యూదుల చారిత్రక సంబోధనను నిలుపుతూ, ఆధునిక తెలుగు పాఠకులకు పరిచితమైన లిప్యంతరీకరణను ఉపయోగిస్తుంది.
- source_word: τίς ἥμαρτεν
  choice: ఎవరు పాపం చేశారు
  rationale: బాధ్యుడెవరో అడిగే ప్రశ్నను, ἁμαρτάνω యొక్క భూతకాల భావాన్ని సూటిగా వ్యక్తపరుస్తుంది.
- source_word: οὗτος
  choice: ఇతడు
  rationale: సందర్భంలో ఎదుట ఉన్న మనిషిని సూచించే గ్రీకు నిర్దేశక సర్వనామానికి సహజమైన తెలుగు సమానం.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: ఇతని తల్లిదండ్రులు
  rationale: γονεῖς అనే బహువచన పదాన్ని సంక్షిప్తంగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: ἵνα
  choice: పుట్టేలా
  rationale: శిష్యులు ఊహించిన ఉద్దేశం లేదా ఫలిత సంబంధాన్ని తెలుగులో నిలుపుతుంది; దానిని కథకుడు సమర్థించిన కారణ సంబంధంగా ప్రకటించదు.
- source_word: τυφλὸς γεννηθῇ
  choice: గుడ్డివాడిగా పుట్టేలా
  rationale: జన్మతః ఉన్న అంధత్వాన్ని, ἵνα ఆధీనంలోని aorist passive subjunctive భావంతో కలిపి సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: పాపానికి జన్మతః అంధత్వానికి మధ్య ἵνα సూచించే సంబంధం
  choice: “ఇతడు గుడ్డివాడిగా పుట్టేలా” అని అనువదించి, శిష్యులు ఊహించిన ఉద్దేశం/ఫలిత సంబంధాన్ని ప్రశ్న రూపంలోనే ఉంచడం
  alternative: “దాని ఫలితంగా ఇతడు గుడ్డివాడిగా పుట్టాడు”
  rationale: ఈ మాటలు శిష్యుల ప్రశ్న; వ్యక్తిగత లేదా తల్లిదండ్రుల పాపమే అంధత్వానికి నేరుగా కారణమని కథకుడు బోధిస్తున్నట్లు చూపకూడదు. గ్రీకు వాక్యంలోని అసౌకర్యకరమైన ధార్మిక ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. “రబ్బీ” అనే చారిత్రక సంబోధన నిలుపబడింది. ప్రశ్నలోని గ్రీకు పదక్రమాన్ని పూర్తిగా అనుకరించకుండా, “ఇతడా, ఇతని తల్లిదండ్రులా” అనే ప్రత్యామ్నాయాలను స్పష్టంగా చూపే తెలుగు పదక్రమం ఎంచుకోబడింది.
