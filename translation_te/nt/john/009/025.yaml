id: JHN.9.25
reference: John 9:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: te
  text: 'అందుకు ఆ మనిషి ఇలా జవాబిచ్చాడు: “ఆయన పాపో కాదో నాకు తెలియదు.[a] నాకు తెలిసినది ఒక్కటే: నేను గుడ్డివాడిగా ఉండేవాణ్ణి; ఇప్పుడు చూస్తున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన పాపి అయితే, నాకు తెలియదు.”
    reason: εἰ అనే పదానికి సాధ్యమైన షరతార్థ ప్రత్యామ్నాయాన్ని నమోదు చేయడం.
lexical_decisions:
- source_word: ἀπεκρίθη οὖν ἐκεῖνος
  choice: అందుకు ఆ మనిషి ఇలా జవాబిచ్చాడు
  rationale: ἀπεκρίθηను సహజమైన కథన శైలిలో ‘జవాబిచ్చాడు’గా, οὖνను ముందటి సంభాషణతో సంబంధం చూపే ‘అందుకు’గా, ἐκεῖνος యొక్క సూచనార్థాన్ని ‘ఆ మనిషి’గా నిలిపాం.
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: ఆయన పాపో కాదో
  rationale: తెలుసుకోవడాన్ని సూచించే క్రియతో వచ్చిన εἰ ఇక్కడ పరోక్ష ప్రశ్నను ప్రవేశపెడుతుంది. ఆధునిక తెలుగులో ‘పాపో కాదో’ సహజంగా ‘whether’ భావాన్ని తెలియజేస్తుంది; గ్రీకులో స్పష్టంగా లేని తీర్పును చేర్చదు.
- source_word: οὐκ οἶδα
  choice: నాకు తెలియదు
  rationale: వర్తమానార్థమున్న οἶδα రూపాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἓν οἶδα
  choice: నాకు తెలిసినది ఒక్కటే
  rationale: ముందటి ‘తెలియదు’తో ఉన్న బలమైన వ్యత్యాసాన్ని నిలుపుతూ ἓνపై ఉన్న ప్రాధాన్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τυφλὸς ὢν
  choice: నేను గుడ్డివాడిగా ఉండేవాణ్ణి
  rationale: ఈ భాగం అతని మునుపటి స్థితిని సూచిస్తుంది. ‘ఉండేవాణ్ణి’ ఆ గత స్థితిని ప్రస్తుత చూపుతో స్పష్టంగా వ్యత్యాసపరుస్తుంది.
- source_word: ἄρτι βλέπω
  choice: ఇప్పుడు చూస్తున్నాను
  rationale: ἄρτι యొక్క ప్రస్తుతకాల వ్యత్యాసాన్ని ‘ఇప్పుడు’ నిలుపుతుంది; βλέπωను సామర్థ్యాన్ని అదనంగా వ్యాఖ్యానించకుండా ‘చూస్తున్నాను’గా అనువదించాం.
theological_decisions:
- issue: యేసు పాపి అన్న ఆరోపణపై స్వస్థత పొందిన మనిషి పరిమిత జ్ఞానాన్ని ఎలా తెలియజేయాలి
  choice: ఆయన పాపో కాదో నాకు తెలియదు.
  alternative: ఆయన పాపి అయితే, నాకు తెలియదు.
  rationale: ఈ వాక్యం మాట్లాడుతున్న మనిషి తనకు తెలియదని చెప్పే సాక్ష్యం; ఇది కథకుడు యేసు గురించి ఇచ్చే తాత్త్విక తీర్పు కాదు. ‘పాపో కాదో’ అనే రూపం ఆ అనిశ్చితిని కాపాడి, షరతు భావాన్ని అనవసరంగా బలపరచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన-సంభాషణ శైలి. ‘ఆయన’ సందర్భంలోని వ్యక్తిని గౌరవప్రదంగా సూచిస్తుంది; ‘గుడ్డివాడు’ మూలంలోని ప్రత్యక్ష శారీరక స్థితిని స్పష్టంగా వ్యక్తం చేస్తుంది.
