id: JHN.9.6
reference: John 9:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ταῦτα εἰπὼν ἔπτυσεν χαμαὶ καὶ ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος, καὶ ⸀ἐπέχρισεν ⸀αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ⸀ὀφθαλμούς,
base_translation:
  language: en
  yaml_path: translation/nt/john/009/006.yaml
  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: te
  text: ఈ మాటలు చెప్పిన తర్వాత, ఆయన నేలపై ఉమ్మి వేసి, ఆ ఉమ్మితో బురద చేసి, ఆ బురదను అతని కళ్లపై పూశాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ బురదతో అతని కళ్లకు అభిషేకం చేశాడు.” ఇక్కడున్న గ్రీకు క్రియకు “పూయడం,” “రాయడం,” లేదా “అభిషేకించడం” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: ఈ మాటలు చెప్పిన తర్వాత
  rationale: భూతకాల అసమాపక క్రియ ప్రధాన చర్యలకు ముందు జరిగినదాన్ని సూచిస్తుంది. ఈ రూపం కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔπτυσεν χαμαί
  choice: ఆయన నేలపై ఉమ్మి వేసి
  rationale: χαμαί అంటే ‘నేలపై’ లేదా ‘నేలకు.’ ‘నేలపై ఉమ్మి వేసి’ అనేది ఆ భౌతిక చర్యను సాధారణ తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: ఆ ఉమ్మితో బురద చేసి
  rationale: πηλόςకు మట్టి, బురద అనే అర్థాలు ఉన్నాయి. ఉమ్మి, నేల కలిపి చేసిన తడి పదార్థాన్ని ఇక్కడ ‘బురద’ సహజంగా తెలియజేస్తుంది; ἐκ యొక్క సాధన/మూల భావాన్ని ‘తో’ వ్యక్తం చేస్తుంది.
- source_word: ἐπέχρισεν
  choice: పూశాడు
  rationale: ἐπιχρίω అంటే ఒక పదార్థాన్ని పూయడం, రాయడం లేదా అభిషేకించడం. బురదను కళ్లపై పెట్టే భౌతిక చర్యకు ‘పూశాడు’ సహజంగా సరిపోతుంది; ఆచార సంబంధమైన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ὀφθαλμούς
  choice: ఆ బురదను అతని కళ్లపై
  rationale: αὐτοῦ సందర్భంలో చూపులేని వ్యక్తిని సూచిస్తుంది. నిర్దిష్ట ఉపపదం ముందే చేసిన బురదను తిరిగి సూచిస్తున్నందున ‘ఆ బురదను’ అని అనువదించబడింది; ἐπίతో కూడిన దిశాత్మక భావాన్ని ‘కళ్లపై’ నిలుపుతుంది.
theological_decisions:
- issue: ἐπέχρισενలో ఉండగల అభిషేక భావం
  choice: ప్రధాన పాఠ్యంలో ‘పూశాడు’
  alternative: ‘ఆ బురదతో అతని కళ్లకు అభిషేకం చేశాడు’
  rationale: ఈ సందర్భంలో క్రియ బురదను కళ్లపై పెట్టే స్పష్టమైన భౌతిక చర్యను వర్ణిస్తుంది. ‘అభిషేకం చేశాడు’ అనేది సాధ్యమైన పదార్థార్థ ప్రత్యామ్నాయమైనా, తెలుగులో ఆచార లేదా మతపరమైన భావాన్ని బలంగా సూచించవచ్చు. కాబట్టి ప్రధాన పాఠ్యం తటస్థమైన క్రియను ఉపయోగిస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. యేసును సూచించే సర్వనామానికి గౌరవార్థకమైన ‘ఆయన,’ చూపులేని వ్యక్తికి సందర్భానుగుణమైన ‘అతని’ వాడబడ్డాయి.
