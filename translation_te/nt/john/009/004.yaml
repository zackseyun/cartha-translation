  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: te
  text: పగలుండగా నన్ను పంపినవాని కార్యాలను మనం చేయాలి[a]; ఎవ్వరూ పని చేయలేని రాత్రి వస్తోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతులలో, “నన్ను పంపినవాని కార్యాలను నేను చేయాలి” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς
  choice: మనం
  rationale: SBLGNTలో ఉన్న ప్రథమ పురుష బహువచనాన్ని సహజమైన సమావేషక రూపంలో వ్యక్తం చేస్తుంది; δεῖతో కలిసి ‘మనం చేయాలి’ అవుతుంది.
- source_word: δεῖ
  choice: చేయాలి
  rationale: అవసరత లేదా బాధ్యత భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: కార్యాలను ... చేయాలి
  rationale: మూలంలోని క్రియ-నామవాచక సంబంధాన్ని అసహజమైన పునరుక్తి లేకుండా నిలుపుతుంది.
- source_word: τοῦ πέμψαντός με
  choice: నన్ను పంపినవాని
  rationale: కర్తను ‘దేవుడు’ లేదా ‘తండ్రి’ అని పాఠ్యంలో అదనంగా నిర్దిష్టం చేయకుండా articular participle యొక్క వ్యక్తిగత సూచనను కాపాడుతుంది.
- source_word: ἕως ἡμέρα ἐστίν
  choice: పగలుగా ఉన్నంతవరకు
  rationale: రాబోయే రాత్రితో ఉన్న కాలసంబంధ వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔρχεται νὺξ
  choice: రాత్రి వస్తోంది
  rationale: వర్తమాన రూపంలోని సమీప భవిష్యత్ భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: οὐδεὶς δύναται ἐργάζεσθαι
  choice: ఎవ్వరూ పని చేయలేని
  rationale: సామర్థ్య నిరాకరణను లింగభేదం లేకుండా, సహజమైన తెలుగు సంబంధవాక్యంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: 'వచనారంభంలోని పాఠాంతరం: ἡμᾶς (‘మనం’) / ἐμέ (‘నేను’)'
  choice: మనం ... చేయాలి
  alternative: నేను ... చేయాలి
  rationale: ఇచ్చిన SBLGNT మూలపాఠంలో ἡμᾶς ఉంది కాబట్టి ప్రధాన పాఠ్యం బహువచనాన్ని అనుసరిస్తుంది. విస్తృతంగా సాక్ష్యమున్న ఏకవచన పాఠాంతరాన్ని పారదర్శకత కోసం పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘కార్యాలు’ యోహాను సువార్తలోని భావసంబంధాన్ని నిలుపుతుంది; రెండో ἐργάζεσθαιకు సహజమైన ‘పని చేయడం’ వాడబడింది.
