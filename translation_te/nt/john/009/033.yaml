  text: If this man were not from God[a], he could do nothing.
translation:
  language: te
  text: ఈయన దేవుని నుండి వచ్చినవాడు కాకపోతే[a], ఏమీ చేయలేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈయన దేవుని నుండి వచ్చినవాడు అయితే తప్ప.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ
  choice: కాకపోతే
  rationale: అసంభవార్థక షరతును సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘తప్ప’ అనే సంక్షిప్త ప్రత్యామ్నాయం కూడా సాధ్యమే.
- source_word: ἦν
  choice: వచ్చినవాడు
  rationale: παρὰ θεοῦతో కలిసి వ్యక్తి దేవుని దగ్గరనుండి వచ్చినవాడనే మూలం/ఆవిర్భావ భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; గ్రీకు క్రియను విడిగా ‘ఉంటే’ అని అనువదించడం తెలుగులో కృత్రిమంగా ఉంటుంది.
- source_word: οὗτος
  choice: ఈయన
  rationale: ఇప్పటికే చర్చలో ఉన్న యేసును గౌరవప్రదంగా, సహజంగా సూచిస్తుంది; ‘ఈ వ్యక్తి’ కంటే సరళంగా ఉంటుంది.
- source_word: παρὰ θεοῦ
  choice: దేవుని దగ్గర నుండి
  rationale: παρά + షష్ఠీ విభక్తి సూచించే మూలం లేదా ఉద్భవాన్ని నిలుపుతుంది. ‘దేవుడు పంపినవాడు’ అని అనడం మూలపాఠం కంటే ఎక్కువ వివరణను చేర్చుతుంది.
- source_word: οὐκ ἠδύνατο
  choice: చేయలేడు
  rationale: అసమర్థతను సంక్షిప్తంగా, సహజంగా తెలుపుతుంది; షరతు వాక్యపు తార్కిక ఫలితానికి తెలుగు వర్తమాన సామర్థ్యరూపం సరిగ్గా సరిపోతుంది.
- source_word: ποιεῖν
  choice: చేయ
  rationale: క్రియ యొక్క విస్తృతార్థాన్ని కాపాడుతుంది; ‘అద్భుతాలు చేయ’ అని విస్తరించడం సందర్భానుసారమైనా మూలంలో లేని పదాన్ని చేర్చుతుంది.
- source_word: οὐδέν
  choice: ఏమీ
  rationale: ప్రతికూల క్రియతో కలిసి సంపూర్ణ అసమర్థతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసు ‘దేవుని దగ్గర నుండి’ అనే మాట యొక్క భావం
  choice: మూలం/ఆవిర్భావాన్ని సూచించే ‘దేవుని దగ్గర నుండి వచ్చినవాడు’ అనే విస్తృత వ్యక్తీకరణను నిలుపుట
  alternative: దేవుడు పంపినవాడు; దేవుని అధికారంతో వచ్చినవాడు
  rationale: వాక్యం యేసు చేసే కార్యాలకు దేవునితో సంబంధాన్ని ప్రతిపాదిస్తుంది; అయితే గ్రీకు పదబంధం పంపబడటం, అధికారప్రదానం లేదా తాత్త్విక ఉనికి వంటి ఏ ఒక్క వివరణకూ దీనిని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘ఈయన’ సందర్భంలోని పురుష వ్యక్తిని సహజంగా సూచిస్తుంది. ప్రధాన వాక్యంలో షరతు నిర్మాణం ఉంచి, ‘తప్ప’ రూపాన్ని పాదసూచికలో ఇచ్చాం.
