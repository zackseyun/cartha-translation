id: JHN.9.7
reference: John 9:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: te
  text: ఆయన అతనితో, “వెళ్లి సిలోయం కోనేటిలో కడుక్కో” అని చెప్పాడు (సిలోయం అనే పేరుకు అనువాదం “పంపబడినవాడు” అని అర్థం.[a]) కాబట్టి అతడు వెళ్లి కడుక్కొని, చూస్తూ వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అంటే ‘పంపబడినవాడు.’”
    reason: ἑρμηνεύεται అనే వివరణాత్మక పదబంధాన్ని సంక్షిప్తంగా వ్యక్తం చేసే సహజమైన ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: Ὕπαγε
  choice: వెళ్లి
  rationale: కదలికను సూచించే సూటి ఆజ్ఞ. తరువాతి ‘కడుక్కో’తో సహజమైన తెలుగు ఆజ్ఞాక్రమంగా ఉంటుంది.
- source_word: νίψαι / ἐνίψατο
  choice: కడుక్కో / కడుక్కొని
  rationale: νίπτω సాధారణంగా శరీరంలోని ఒక భాగాన్ని కడుక్కోవడాన్ని సూచిస్తుంది; సందర్భంలో పూర్తి స్నానం అనే భావం చేర్చకుండా సహజంగా ఉంటుంది.
- source_word: εἰς τὴν κολυμβήθραν
  choice: కోనేటిలో
  rationale: κολυμβήθρα నీటిని నిల్వచేసే కొలను లేదా కోనేటిని సూచిస్తుంది. కడుక్కోవడం అనే క్రియతో ‘కోనేటిలో’ సహజమైన తెలుగు ప్రయోగం.
- source_word: Σιλωάμ
  choice: సిలోయం
  rationale: స్థలనామాన్ని ఆధునిక తెలుగులో సులభంగా పలికే విధంగా లిప్యంతరీకరించింది.
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: “సిలోయం” అనే పేరును అనువదిస్తే “పంపబడినవాడు” అని అర్థం
  rationale: ἑρμηνεύεται ఇచ్చే వివరణాత్మక భావాన్ని నిలుపుతూ, Ἀπεσταλμένος అనే పుంలింగ కర్మణి కృదంతాన్ని ‘పంపబడినవాడు’గా స్పష్టంగా అందిస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ఆజ్ఞకు ప్రతిస్పందనగా జరిగిన తదుపరి చర్యను సూచించే కథన సంబంధాన్ని నిలుపుతుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లి
  rationale: సాధారణ కథన కదలికను అనవసరమైన గంభీరత లేకుండా తెలుపుతుంది.
- source_word: ἦλθεν βλέπων
  choice: చూపు కలిగి తిరిగి వచ్చాడు
  rationale: వెళ్లిన చోటు నుండి అతడు తిరిగి వచ్చిన కథన సూచనను, ఇప్పుడు చూడగలుగుతున్న ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సిలోయం పేరుకు ఇచ్చిన వివరణను యోహాను రచనలోని ప్రతీకాత్మకతతో అతిగా విస్తరించకుండా అనువదించడం
  choice: మూలపాఠంలో ఉన్నట్లే ‘పంపబడినవాడు’ అనే వివరణను కుండలీకరణల్లో ప్రధాన పాఠంలో ఉంచడం
  alternative: తండ్రి పంపిన యేసుతో ఉన్న ప్రతీకాత్మక సంబంధాన్ని అనువాదంలోనే స్పష్టంగా చెప్పడం
  rationale: గ్రీకు పాఠం పేరు యొక్క అర్థాన్ని మాత్రమే ఇక్కడ వివరిస్తుంది. దాని సాధ్యమైన ధార్మిక ప్రతీకను అనువాదం స్వయంగా నిర్ధారించి చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి. ‘కోనేరు’ స్థల సందర్భానికి సరిపోయే పదం; ‘పంపబడినవాడు’ మూలంలోని కర్మణి రూపాన్ని నిలుపుతుంది.
