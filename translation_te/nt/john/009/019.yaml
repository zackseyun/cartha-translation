translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథన శైలి. ‘గుడ్డివాడు’ మూలంలోని τυφλός కు నేరుగా, సాధారణంగా అర్థమయ్యే సమానార్థకం. ఈ వచనంలో పాదటిప్పణి అవసరం లేదు.
