source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτοὺς λέγοντες· Οὗτός ἐστιν ὁ υἱὸς ὑμῶν, ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη; πῶς οὖν ⸂βλέπει ἄρτι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: te
  text: 'వారు అతని తల్లిదండ్రులను ఇలా అడిగారు: “పుట్టుకతోనే అంధుడిగా పుట్టాడని మీరు చెబుతున్న మీ కుమారుడు ఇతడేనా? అయితే ఇప్పుడు ఇతడు ఎలా చూస్తున్నాడు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν αὐτοὺς λέγοντες
  choice: వారు అతని తల్లిదండ్రులను ఇలా అడిగారు
  rationale: తెలుగులో సహజమైన ప్రత్యక్ష ప్రశ్న పరిచయ నిర్మాణం. αὐτούς యొక్క సూచనను సందర్భానుసారంగా ‘అతని తల్లిదండ్రులను’ అని స్పష్టం చేస్తుంది; λέγοντες ను విడిగా ‘అంటూ’ అని అనవసరంగా పునరుక్తి చేయకుండా ‘ఇలా’ ద్వారా ప్రతిబింబిస్తుంది.
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: మీ కుమారుడు ఇతడేనా?
  rationale: గ్రీకు రూపం ప్రకటనాత్మకంగా కనిపించినా సందర్భంలో ప్రశ్నగా పనిచేస్తుంది. ‘ఇతడేనా’ ప్రశ్నార్థక బలాన్ని, గుర్తింపు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη
  choice: పుట్టుకతోనే గుడ్డివాడని మీరు చెబుతున్న
  rationale: ‘మీరు’ ద్వారా ὑμεῖς యొక్క ఉద్ఘాటన నిలుస్తుంది. ‘చెబుతున్న’ తటస్థంగా ఉండి, ‘వాదిస్తున్న’ వంటి సందేహార్థాన్ని చేర్చదు. ‘పుట్టుకతోనే’ జన్మతః అంధత్వాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πῶς οὖν
  choice: అలాగైతే ... ఎలా
  rationale: οὖν సూచించే పూర్వ వాదననుంచి వచ్చే తార్కిక పర్యవసానాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: βλέπει ἄρτι
  choice: ఇప్పుడు ఇతడు ఎలా చూస్తున్నాడు
  rationale: ἄρτι లోని గత స్థితి—ప్రస్తుత స్థితి వ్యత్యాసాన్ని ‘ఇప్పుడు’ నిలుపుతుంది. βλέπει ను ‘చూడగలుగుతున్నాడు’ అని సామర్థ్యార్థానికి మార్చకుండా, వాస్తవ ప్రస్తుత చూపును ‘చూస్తున్నాడు’గా అందిస్తుంది.
