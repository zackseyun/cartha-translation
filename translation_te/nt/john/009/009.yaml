    text: 'మరింత అక్షరార్థంగా, “నేనే ఉన్నాను.” ఇక్కడ ఇది సాధారణ స్వీయ గుర్తింపు: వారు చర్చిస్తున్న వ్యక్తి తానేనని ఆ మనిషి చెబుతున్నాడు.'
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek imperfects as past, ongoing/repeated speech; keeps the crowd’s identity-versus-resemblance dispute clear; and replaces the unnatural accusative expression with the idiomatic contextual self-identification “నేనే.” The footnote presents the literal form and explains its ordinary narrative sense without theological overreading.
