id: JHN.9.9
reference: John 9:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον ὅτι Οὗτός ἐστιν· ἄλλοι ⸂ἔλεγον· Οὐχί, ἀλλὰ⸃ ὅμοιος αὐτῷ ἐστιν. ἐκεῖνος ἔλεγεν ὅτι Ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: te
  text: కొందరు, “ఇతడే” అంటూ ఉండేవారు. మరికొందరు, “కాదు, ఇతడు అతనిలా ఉన్నాడు” అంటూ ఉండేవారు. అతడు మాత్రం, “నేనే” అని పదేపదే చెబుతూ ఉండేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా, “నేనే ఉన్నాను.” ఇక్కడ ఇది సాధారణ స్వీయ గుర్తింపు: వారు చర్చిస్తున్న వ్యక్తి తానేనని ఆ మనిషి చెబుతున్నాడు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι … ἄλλοι
  choice: కొందరు … మరికొందరు
  rationale: జనసమూహంలోని రెండు భిన్న వర్గాలను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా చూపిస్తుంది.
- source_word: ἔλεγον
  choice: అంటున్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న సంభాషణను తెలుగు కథనంలో సహజంగా వర్తమాన దృశ్యరూపంతో వ్యక్తం చేస్తుంది.
- source_word: Οὗτός ἐστιν
  choice: ఇతడే
  rationale: సంక్షిప్తమైన ప్రత్యక్ష గుర్తింపును కాపాడుతూ, తెలుగు వాక్య సందర్భంలో సహజంగా ఉంటుంది.
- source_word: Οὐχί, ἀλλὰ
  choice: కాదు
  rationale: తరువాతి భిన్న అభిప్రాయంతో కలిపి చదివినప్పుడు గ్రీకు నిరాకరణ-వ్యతిరేకతను సహజంగా తెలియజేస్తుంది; ప్రత్యేకంగా ‘కాని’ చేర్చడం తెలుగులో అవసరం లేదు.
- source_word: ὅμοιος αὐτῷ ἐστιν
  choice: ఇతడు అతనిలా ఉన్నాడు
  rationale: వ్యక్తుల మధ్య పోలికను, గుర్తింపు కాదనే భేదాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: ἐκεῖνος ἔλεγεν
  choice: అయితే అతడు … పదేపదే చెబుతున్నాడు
  rationale: అతడే మాట్లాడుతున్నాడనే మార్పును ‘అయితే’ స్పష్టం చేస్తుంది; అసంపూర్ణ భూతకాలంలోని పునరుక్తి లేదా నిరంతర పట్టుదలను ‘పదేపదే’ తెలియజేస్తుంది.
- source_word: Ἐγώ εἰμι
  choice: నేనే అతణ్ణి
  rationale: ఈ సందర్భంలో చర్చిస్తున్న వ్యక్తి తానేనని స్వీయ గుర్తింపు చేసుకోవడమే భావం; ‘నేనే’ గ్రీకులోని స్పష్టమైన ἐγώ ఇచ్చే ఉద్ఘాటనను నిలుపుతుంది.
theological_decisions:
- issue: యోహాను సందర్భంలో Ἐγώ εἰμι అనువాదం
  choice: నేనే అతణ్ణి
  alternative: నేనే ఉన్నాను / నేనే
  rationale: ఇక్కడ మాట్లాడుతున్నది స్వస్థత పొందిన అంధుడు; జనులు చర్చిస్తున్న వ్యక్తి తానేనని అతడు గుర్తిస్తున్నాడు. అందువల్ల సందర్భం సాధారణ స్వీయ గుర్తింపును సూచిస్తుంది, క్రీస్తు సంబంధమైన సంపూర్ణ ప్రకటనను కాదు. అయినా మూలంలోని అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా భాషాపరమైన రూపాన్ని దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథనశైలి. సంభాషణలోని కొనసాగింపు మరియు ఆ మనిషి పదేపదే చెప్పడాన్ని వేరుచేసి చూపించాం.
