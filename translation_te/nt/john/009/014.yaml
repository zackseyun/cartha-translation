reference: John 9:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦν δὲ σάββατον ⸂ἐν ᾗ ἡμέρᾳ⸃ τὸν πηλὸν ἐποίησεν ὁ Ἰησοῦς καὶ ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/014.yaml
  text: It was a Sabbath on the day when Jesus made the mud and opened his eyes.
translation:
  language: te
  text: యేసు బురదను తయారుచేసి అతని కళ్లను తెరిచిన రోజు విశ్రాంతిదినం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σάββατον
  choice: విశ్రాంతిదినం
  rationale: యూదుల వారపు విశ్రాంతిదినాన్ని సూచించే సహజమైన, స్థిరపడిన తెలుగు పదం. గ్రీకులో నిర్దిష్ట ఉపపదం లేకున్నా, తెలుగులో అనిర్దిష్టతను ప్రత్యేకంగా సూచించాల్సిన అవసరం లేదు.
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: ఆ రోజు
  rationale: సంబంధవాచక కాల సూచనను తెలుగులో సహజంగా వ్యక్తం చేస్తూ, యేసు చేసిన కార్యాలు జరిగిన రోజునే సూచిస్తుంది.
- source_word: πηλόν
  choice: బురద
  rationale: ఈ సందర్భంలో నేలమట్టిని ఉమ్మితో కలిపి చేసిన తడి పదార్థానికి ‘బురద’ సాధారణ పాఠకునికి సహజంగా అర్థమవుతుంది; ‘మట్టి’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: ἐποίησεν
  choice: చేసి
  rationale: ποιέω యొక్క సాధారణ అర్థాన్ని తెలుగులో సరళంగా అందిస్తుంది; తరువాతి క్రియతో సహజంగా అనుసంధానిస్తుంది.
- source_word: ἀνέῳξεν
  choice: తెరిచిన
  rationale: ‘తెరవడం’ అనే మూలంలోని స్పష్టమైన శరీర సంబంధ రూపకాన్ని నిలుపుతుంది; ‘చూపు ఇచ్చిన’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: అతని కళ్లను
  rationale: గ్రీకు వాక్యంలోని వ్యక్తిగత సర్వనామం మరియు స్పష్టమైన శరీర భాగ సూచనను యథాతథ భావంతో ఉంచుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన మార్పును సూచిస్తుంది. తెలుగులో వాక్య క్రమమే ఆ మార్పును సహజంగా తెలియజేస్తుంది; ‘అయితే’ అంటే అవసరానికి మించిన వ్యతిరేక భావం రావచ్చు.
theological_decisions:
- issue: యేసు స్వస్థపరిచిన కార్యానికి విశ్రాంతిదినంతో ఉన్న సంబంధం
  choice: ఆ రోజు విశ్రాంతిదినమనే కథన వాస్తవాన్ని మాత్రమే తెలిపింది.
  alternative: విశ్రాంతిదిన ధర్మశాస్త్రం లేదా తరువాత వచ్చే వివాదం గురించి వివరణను వాక్యంలో చేర్చడం.
  rationale: మూల వాక్యం తరువాతి వివాదానికి నేపథ్యాన్ని ఏర్పరుస్తుంది గాని, ఇక్కడే ఆ వివాదాన్ని తీర్చదు. అందువల్ల దాని ధార్మిక ఉద్రిక్తతను వ్యాఖ్యానంతో పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆ రోజు’ను విధేయానికి ముందు ఉంచడం ద్వారా గ్రీకు కాల సంబంధాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలిపింది.
