id: JHN.9.10
reference: John 9:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· ⸀Πῶς ἠνεῴχθησάν σου οἱ ὀφθαλμοί;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/010.yaml
  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: te
  text: 'కాబట్టి వారు అతనితో ఇలా అన్నారు: “నీ కళ్లు ఎలా తెరవబడ్డాయి[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ కళ్లు ఎలా తెరుచుకున్నాయి?” అని కూడా చెప్పవచ్చు; అయితే గ్రీకు మూలంలో కర్మణి రూపం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: అడిగారు
  rationale: ఇది అసంపూర్ణ భూతకాల క్రియారూపం; కొనసాగుతున్న లేదా పునరావృతమైన మాటను సూచించగలదు. అయితే ప్రశ్న ఉన్న ఈ కథన సందర్భంలో సహజమైన ఆధునిక తెలుగులో ‘అడిగారు’ అని చెప్పడం సరళంగా ఉంటుంది; ‘చెబుతూ ఉన్నారు’ అనడం ప్రశ్నకు తక్కువ సహజంగా ఉంటుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సంఘటనతో ఈ ప్రశ్నకు ఉన్న తార్కిక లేదా కథన సంబంధాన్ని చూపిస్తుంది.
- source_word: αὐτῷ
  choice: అతనిని
  rationale: గ్రీకులో ఇది మాటకు పరోక్ష కర్మ అయినప్పటికీ, తెలుగులో ‘అడుగు’ క్రియతో వ్యక్తిని ద్వితీయా విభక్తిలో చూపించడం సహజం.
- source_word: Πῶς
  choice: ఎలా
  rationale: జరిగిన విధానాన్ని ప్రశ్నించే గ్రీకు క్రియావిశేషణానికి సహజమైన తెలుగు సమానం.
- source_word: ἠνεῴχθησάν
  choice: తెరవబడ్డాయి
  rationale: గ్రీకు ఏకకాల భూత, కర్మణి రూపాన్ని నిలుపుతుంది. ఎవరు తెరిచారో వాక్యం చెప్పకుండా ఉండే అసలు వాక్యంలోని ఉద్దేశిత అనిర్దిష్టతను ఇది కాపాడుతుంది.
- source_word: σου οἱ ὀφθαλμοί
  choice: నీ కళ్లు
  rationale: తెలుగు స్వామ్య నిర్మాణంలో సహజమైన పదక్రమం; గ్రీకు బహువచన భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: కళ్లను తెరిచిన కర్తను గుర్తించడం
  choice: కర్మణి ప్రయోగమైన ‘తెరవబడ్డాయి’ను ఉంచడం
  alternative: ‘నీ కళ్లు ఎలా తెరుచుకున్నాయి?’
  rationale: ఈ వాక్యం కర్తను స్పష్టంగా పేర్కొనదు. దేవుడు, యేసు లేదా మరెవరినైనా అనువాదంలోనే కర్తగా చేర్చకుండా గ్రీకు వాక్యంలోని అనిర్దిష్టతను నిలుపుకోవాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రశ్నా నిర్మాణాన్ని వాడుతూ, గ్రీకు కర్మణి ప్రయోగాన్ని ఉద్దేశపూర్వకంగా నిలిపాం. ‘తెరవబడ్డాయి’ కొద్దిగా అధికారికంగా వినిపించినా, మూలంలోని కర్త-అనిర్దిష్టతను స్పష్టంగా కాపాడుతుంది.
