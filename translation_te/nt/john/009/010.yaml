  naturalness: ‘కాబట్టి వారు అతనితో ఇలా అన్నారు:’ is clear, natural modern standard Telugu narrative prose. The simple past ‘అన్నారు’ is idiomatic in this context, while the quotation preserves the question naturally.
  terminology: ‘కళ్లు’ is appropriate modern standard Telugu. ‘తెరవబడ్డాయి’ appropriately maintains the source passive and does not introduce an agent. The footnote explicitly distinguishes the smoother intransitive Telugu alternative from the Greek passive.
