lexical_decisions:
- source_word: Καὶ
  choice: ఆయన దారిలో వెళ్తూ
  rationale: గ్రీకు సంధాయకమైన Καὶ కథనాన్ని ముందున్న సందర్భంతో కలుపుతుంది. తెలుగులో వాక్యారంభంలో ప్రత్యేకంగా ‘మరియు’ అనడం అసహజంగా ఉండేందున, కొనసాగుతున్న కథనప్రవాహాన్ని సహజ వాక్యనిర్మాణంతో వ్యక్తం చేశాం.
- source_word: παράγων
  choice: దారిలో వెళ్తూ
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలంలో కొనసాగుతున్న చర్యను సూచిస్తుంది. ‘దారిలో వెళ్తూ’ ఆ నేపథ్య భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: εἶδεν
  choice: చూశాడు
  rationale: ὁράω యొక్క భూతకాల క్రియారూపానికి నేరమైన సమానార్థకం. ‘గమనించాడు’ అనడం మూలంలో తప్పనిసరిగా లేని అదనపు భావాన్ని చేర్చవచ్చు.
- source_word: ἄνθρωπον
  choice: ఒక మనిషిని
  rationale: ఇక్కడ ἄνθρωπος కథనంలోని నిర్దిష్ట వ్యక్తిని సూచిస్తుంది; తరువాతి సందర్భం అతడు పురుషుడని స్పష్టం చేస్తుంది. ‘మనిషి’ సాధారణ పాఠకులకు సహజంగా, మూలానికి సన్నిహితంగా ఉంటుంది.
- source_word: τυφλὸν
  choice: చూపులేని
  rationale: ‘గుడ్డివాడు’ కంటే ‘చూపులేని’ ఆధునిక తెలుగులో గౌరవప్రదంగా, స్పష్టంగా ఉంటుంది; అదే సమయంలో శారీరక స్థితిని యథార్థంగా తెలియజేస్తుంది.
- source_word: ἐκ γενετῆς
  choice: పుట్టుకతోనే
  rationale: ఈ పదబంధం జన్మించినప్పటి నుంచే ఆ స్థితి ఉందని సూచిస్తుంది. ‘పుట్టుకతోనే’ తెలుగులో సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: ἄνθρωπον యొక్క లింగ సూచన
  choice: ఒక మనిషిని
  alternative: ఒక వ్యక్తిని
  rationale: ἄνθρωπος కొన్ని సందర్భాల్లో సాధారణంగా ‘వ్యక్తి’ అని అర్థమవుతుంది. అయితే ఇక్కడ కథనం ఒక నిర్దిష్ట పురుషుణ్ణి సూచిస్తున్నందున ‘మనిషి’ సందర్భానికి తగినది; అనవసరమైన సిద్ధాంతార్థాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని వాడాం. ‘చూపులేని’ అనే రూపం అర్థాన్ని తగ్గించకుండా వ్యక్తిని అవమానించని ప్రస్తుత వాడుకకు అనుగుణంగా ఉంది. గమనిక సూచిక [a] సంబంధిత పదబంధం వెంట కాకుండా వాక్యాంతంలో ఉంచబడింది; అయినప్పటికీ అది ‘దారిలో వెళ్తూ’ అనే పదబంధానికే చెందుతుంది.
