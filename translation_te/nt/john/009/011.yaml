id: JHN.9.11
reference: John 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ἐκεῖνος· ⸂Ὁ ἄνθρωπος ὁ⸃ λεγόμενος Ἰησοῦς πηλὸν ἐποίησεν καὶ ἐπέχρισέν μου τοὺς ὀφθαλμοὺς καὶ εἶπέν μοι ⸀ὅτι Ὕπαγε εἰς ⸀τὸν Σιλωὰμ καὶ νίψαι· ἀπελθὼν ⸀οὖν καὶ νιψάμενος ἀνέβλεψα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: te
  text: 'అతడు ఇలా జవాబిచ్చాడు: “యేసు అనే ఆ మనిషి బురద[a] చేసి, దాన్ని నా కళ్లకు పూశాడు[b]. తరువాత నాతో, ‘సిలోయముకు వెళ్లి కడుక్కో’ అన్నాడు. కాబట్టి నేను వెళ్లి కడుక్కున్నాను; నాకు చూపు వచ్చింది[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెత్తని మట్టి.” గ్రీకు పదం బురదను లేదా మెత్తని మట్టిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా కళ్లకు రాశాడు.” గ్రీకు క్రియకు పూయడం లేదా రాయడం అనే అర్థాలు ఉన్నాయి; కొన్ని అనువాదాలు దీన్ని మరింత శాబ్దికంగా “అభిషేకించాడు” అని ఇస్తాయి.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నేను చూడగలిగాను.” ఈ స్వస్థత సందర్భంలో గ్రీకు క్రియ చూపు పొందడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: అతడు ఇలా జవాబిచ్చాడు
  rationale: గ్రీకు కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగు వాక్యంగా అందిస్తుంది; ἐκεῖνος‌ను ‘అతడు’ ద్వారా స్పష్టంగా ఉంచుతుంది.
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: యేసు అనే ఆ మనిషి
  rationale: వక్త యేసును ఈ దశలో కేవలం ఒక మనిషిగా గుర్తిస్తున్న భావాన్ని కాపాడుతూ, తెలుగులో సహజంగా పేరును పరిచయం చేస్తుంది.
- source_word: πηλὸν ἐποίησεν
  choice: బురద చేసి
  rationale: πηλός మట్టి లేదా బురదను సూచించగలదు; మునుపటి సందర్భంలో లాలాజలంతో చేసిన పదార్థానికి ‘బురద’ సహజమైన ఎంపిక.
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: దాన్ని నా కళ్లకు పూశాడు
  rationale: ἐπιχρίω సూచించే పూయడం లేదా రాయడం అనే భౌతిక చర్యను స్పష్టంగా చెబుతుంది; మూలంలో లేని ఆచారపరమైన భావాన్ని చేర్చదు.
- source_word: εἶπέν μοι ὅτι
  choice: నాతో ... అన్నాడు
  rationale: ఆజ్ఞతో కూడిన ప్రత్యక్ష వాక్యాన్ని ఆధునిక తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: Ὕπαγε εἰς τὸν Σιλωὰμ
  choice: సిలోయముకు వెళ్లి
  rationale: స్థలపేరును మూలంలోని సంక్షిప్త రూపంలోనే ఉంచి, గమనాన్ని తెలిపే ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: νίψαι
  choice: కడుక్కో
  rationale: మధ్యమ రూపంలోని ఆజ్ఞను సందర్భానుసారంగా సహజమైన ఆత్మార్థక తెలుగు క్రియతో అందిస్తుంది.
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: కాబట్టి నేను వెళ్లి కడుక్కున్నాను
  rationale: οὖν తెలిపే ఫలిత సంబంధాన్ని ‘కాబట్టి’తో ఉంచి, వరుస చర్యలను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνέβλεψα
  choice: నాకు చూపు వచ్చింది
  rationale: స్వస్థత సందర్భంలో ἀναβλέπω అంటే చూడగలగడం లేదా చూపు పొందడం; పుట్టుకతో అంధుడైన వ్యక్తికి ‘తిరిగి’ అనే భావాన్ని అనవసరంగా చేర్చకుండా తెలుగులో సహజంగా చెబుతుంది.
theological_decisions:
- issue: వక్త యేసును ఎలా గుర్తిస్తున్నాడు
  choice: యేసు అనే ఆ మనిషి
  alternative: యేసు అనే వ్యక్తి
  rationale: కథలో ఈ దశలో స్వస్థత పొందినవాడు యేసును ‘మనిషి’గానే పేర్కొంటాడు. తరువాతి దశలో వచ్చే ఉన్నతమైన అవగాహనను ముందుగానే ఈ వాక్యంలోకి తీసుకురాకుండా కథనంలోని ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘యేసు అనే ఆ మనిషి’ మూలంలోని పరిమిత గుర్తింపును కాపాడుతుంది. ‘సిలోయము’ అనే సంప్రదాయ తెలుగు స్థలపేరు ఉపయోగించబడింది.
