id: JHN.9.40
reference: John 9:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: te
  text: 'ఆయనతో ఉన్న పరిసయ్యులలో కొందరు ఈ విషయాలు విని, ఆయనతో ఇలా అన్నారు: “మేము కూడా గుడ్డివాళ్లం కాదుగదా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσαν
  choice: విని
  rationale: ఇక్కడ ἀκούω యేసు పలికిన మాటలను వినడాన్ని సూచిస్తుంది; తెలుగు కథన ప్రవాహంలో ‘విని’ సహజంగా ఉంటుంది.
- source_word: ἐκ τῶν Φαρισαίων
  choice: పరిసయ్యులలో కొందరు
  rationale: ἐκ తో కూడిన షష్ఠీ విభక్తి మొత్తం పరిసయ్యులలో ఒక వర్గాన్ని సూచిస్తుంది; ‘పరిసయ్యులలో కొందరు’ ఆ భాగార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ταῦτα
  choice: ఈ మాటలు
  rationale: బహువచన సూచకపదం యేసు ఇంతకు ముందు పలికిన విషయాలను సూచిస్తుంది. తెలుగులో ఈ సందర్భంలో ‘ఈ మాటలు’ సహజమైనది; అది వినబడిన పలుకులను సూచిస్తుంది.
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: ఆయనతో ఉన్న
  rationale: ఈ విశేషణాత్మక కృదంత పదబంధం యేసుతో అక్కడ ఉన్న పరిసయ్యులను గుర్తిస్తుంది; ‘ఆయనతో ఉన్న’ దాని భావాన్ని సహజంగా అందిస్తుంది.
- source_word: εἶπον αὐτῷ
  choice: ఆయనతో ... అన్నారు
  rationale: λέγω ప్రత్యక్ష సంభాషణను ప్రవేశపెడుతుంది. ప్రశ్నార్థక భావం ఉద్ధరణలోనే స్పష్టంగా ఉన్నందున ‘అడిగారు’ అని మార్చకుండా ‘అన్నారు’ అని అనువదించబడింది.
- source_word: Μὴ
  choice: కాదుగదా?
  rationale: μή తో ప్రారంభమైన ప్రశ్న ప్రతికూల సమాధానాన్ని ఆశిస్తుంది. తెలుగులో ‘కాదుగదా?’ అనే నిర్మాణం ‘కాదు’ అనే సమాధానాన్ని ఆశించే వారి నమ్మకభరిత ప్రశ్నను సహజంగా తెలియజేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: ఇంతకు ముందు ప్రస్తావించిన గుడ్డివారితో ‘మేము’ అనే వారిని కలుపుతుంది; ‘కూడా’ దీనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡμεῖς
  choice: మేము
  rationale: గ్రీకులో స్పష్టంగా ఉన్న సర్వనామం ఉద్ఘాటనను కలిగి ఉంది; తెలుగులో ‘మేము’ దానిని నిలుపుతుంది.
- source_word: τυφλοί
  choice: గుడ్డివాళ్లం
  rationale: మూలపదం అలంకారికంగా వాడబడినప్పటికీ కేవలం ‘గుడ్డివారు’ అనే అర్థాన్నే నేరుగా చెబుతుంది. ‘ఆధ్యాత్మికంగా’ అనే వివరణను చేర్చకుండా యోహాను వర్ణనలోని ద్వంద్వార్థాన్ని నిలుపుతుంది.
- source_word: ἐσμεν
  choice: -ం
  rationale: వర్తమాన కాలంలోని ‘ఉన్నాము/అయి ఉన్నాము’ అనే సంధాన క్రియ తెలుగులో ‘గుడ్డివాళ్లం’ అనే సహజ నామవాచక విధేయ రూపంలో అంతర్భవిస్తుంది.
theological_decisions:
- issue: τυφλοί అనే పదంలోని అలంకారిక భావాన్ని స్పష్టంగా చేర్చాలా
  choice: ప్రధాన పాఠ్యంలో ‘గుడ్డివాళ్లం’ అని మాత్రమే ఉంచడం
  alternative: ‘ఆధ్యాత్మికంగా గుడ్డివాళ్లం’ అని అనువదించడం
  rationale: సందర్భం ఆధ్యాత్మిక అంధత్వాన్ని సూచించినప్పటికీ గ్రీకు పాఠ్యం విశేషణాన్ని ఎలాంటి వివరణ లేకుండా వాడుతుంది. సరళమైన ‘గుడ్డి’ భావాన్ని నిలుపడం యోహాను ఉద్దేశించిన వ్యంగ్యాన్ని, శారీరక-ఆధ్యాత్మిక అంధత్వాల మధ్య ఉద్రిక్తతను కాపాడుతుంది.
- issue: μή ప్రశ్నలోని ఆశించిన సమాధానాన్ని ఎలా వ్యక్తం చేయాలి
  choice: ‘కాదుగదా?’ అనే ప్రతికూల సమాధానాన్ని ఆశించే ప్రశ్నారూపం
  alternative: ‘మేము కూడా గుడ్డివాళ్లమా?’ అనే తటస్థ ప్రశ్న
  rationale: గ్రీకు μή సాధారణంగా ‘కాదు’ అనే సమాధానాన్ని ఆశించే ప్రశ్నను సూచిస్తుంది. తెలుగు రూపం ఆ వక్తల స్వీయనిశ్చయాన్ని తెలియజేస్తుంది, అయితే యేసు తదుపరి జవాబు కలిగించే ఉద్రిక్తతను ముందుగానే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘గుడ్డివాళ్లు’ సాధారణ పాఠకులకు స్పష్టమైన ప్రస్తుత వాడుక; సందర్భంలోని అలంకారిక భావాన్ని ప్రత్యేక వివరణతో పరిమితం చేయలేదు. పాఠ్య విమర్శా గుర్తులు ఈ వాక్యపు అనువాదార్థాన్ని ప్రభావితం చేయవు.
