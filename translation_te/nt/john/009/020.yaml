- from: అందుకు అతని తల్లిదండ్రులు, “ఇతడు మా కుమారుడని, పుట్టుకతోనే గుడ్డివాడని మాకు తెలుసు” అని జవాబిచ్చారు.[a]
  to: 'అందుకు అతని తల్లిదండ్రులు జవాబిస్తూ ఇలా అన్నారు: “ఇతడు మా కుమారుడని, ఇతడు అంధుడిగా జన్మించాడని మాకు తెలుసు.”[a]'
