  yaml_path: translation/nt/john/009/020.yaml
  text: So his parents answered and said[a], “We know that this is our son and that he was born blind.
translation:
  language: te
  text: 'అందుకు అతని తల్లిదండ్రులు జవాబిస్తూ ఇలా అన్నారు: “ఇతడు మా కుమారుడని, ఇతడు అంధుడిగా జన్మించాడని మాకు తెలుసు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు పుట్టుకతోనే అంధుడని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అందుకు
  rationale: మునుపటి ప్రశ్నకు తల్లిదండ్రులు ఇచ్చిన జవాబును కథనపరంగా అనుసంధానిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: γονεῖς
  choice: తల్లిదండ్రులు
  rationale: ఆ వ్యక్తి తండ్రి, తల్లిని సమష్టిగా సూచించే సహజమైన తెలుగు పదం.
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: అని జవాబిచ్చారు
  rationale: గ్రీకులోని జంట వాక్యప్రయోగం తెలుగులో పదేపదే అనువదిస్తే అసహజంగా ఉంటుంది; ఉద్ధరణతో కూడిన ‘అని జవాబిచ్చారు’ రెండు క్రియల సంభాషణార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: Οἴδαμεν
  choice: మాకు తెలుసు
  rationale: తల్లిదండ్రులు నిశ్చయంగా తెలిసిన విషయాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: ఇతడు మా కుమారుడు
  rationale: వ్యక్తిని చూపిస్తూ గుర్తించే భావాన్ని, బంధాన్ని స్పష్టంగా మరియు సహజంగా నిలుపుతుంది.
- source_word: τυφλὸς ἐγεννήθη
  choice: పుట్టుకతోనే గుడ్డివాడు
  rationale: అతని అంధత్వం జన్మనుండే ఉందనే గ్రీకు భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రధాన పాఠ్యంలో సహజమైన స్థితి-వ్యక్తీకరణను వాడి, గ్రీకు పదక్రమానికి మరింత నేరుగా సరిపడే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
