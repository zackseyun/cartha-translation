id: JHN.9.18
reference: John 9:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: te
  text: అందువల్ల, చూపు పొందిన వ్యక్తి తల్లిదండ్రులను పిలిపించే వరకు, యూదులు[a] అతని గురించి అతడు గుడ్డివాడిగా ఉండి చూపు పొందాడని నమ్మలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భాన్ని బట్టి ‘యూదా నాయకులు’ లేదా ‘యూదయ ప్రాంతవాసులు’ అని కూడా అర్థం కావచ్చు.
    reason: οἱ Ἰουδαῖοι అనే పదబంధం యోహాను సువార్తలో సందర్భానుసారం వేర్వేరు పరిధులతో వాడబడుతుంది; ప్రధాన పాఠం దాని విస్తృత రూపాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: నమ్మలేదు
  rationale: ὅτιతో వచ్చే విషయవాచక ఉపవాక్యంలోని వాదనను నిజమని అంగీకరించకపోవడాన్ని ఇక్కడ πιστεύω సూచిస్తుంది; అందువల్ల ‘నమ్మలేదు’ సహజమైన, కచ్చితమైన అనువాదం.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదబంధం నేరుగా ‘యూదులు’ అని ఉంది. యోహాను సువార్తలో సందర్భానుసారం ఇది యూదా నాయకులను, యూదయ ప్రాంతవాసులను, లేదా స్థానిక యూదుల సమూహాన్ని సూచించవచ్చు; ప్రధాన పాఠంలో దాని విస్తృత రూపాన్ని నిలిపి, సందర్భసాధ్యమైన అర్థాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: περὶ αὐτοῦ
  choice: అతని గురించి
  rationale: περί + షష్ఠీ విభక్తి ఇక్కడ ‘అతని గురించి/అతని విషయంగా’ అనే అర్థాన్ని ఇస్తుంది; ‘అతని గురించి’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἦν τυφλὸς
  choice: గుడ్డివాడై ఉండి
  rationale: గ్రీకులోని అసంపూర్ణ భూతకాలం అతని మునుపటి స్థితిని సూచిస్తుంది. ‘గుడ్డివాడై ఉండి’ ఆ స్థితి చూపు పొందడానికి ముందున్నదని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀνέβλεψεν
  choice: చూపు పొందాడు
  rationale: స్వస్థత సందర్భంలో ἀναβλέπω చూపును పొందడాన్ని సూచిస్తుంది. ‘తిరిగి చూపు పొందాడు’ అని అనువదిస్తే అతనికి అంతకుముందు చూపు ఉండేదనే అవసరం లేని భావం రావచ్చు.
- source_word: ἕως ὅτου
  choice: పిలిపించే వరకు
  rationale: ఈ సంయుక్త ప్రయోగం కాలపరిమితిని సూచిస్తుంది; తెలుగులో ‘వరకు’ దానికి సహజమైన సమానం.
- source_word: ἐφώνησαν
  choice: పిలిపించారు
  rationale: ఇక్కడ φωνέω విచారణ కోసం రప్పించడాన్ని సూచిస్తుంది. ‘పిలిపించారు’ సందర్భానికి సహజంగా సరిపోతుంది; ‘సమన్లు పంపారు’ వంటి న్యాయపరమైన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: γονεῖς
  choice: తల్లిదండ్రులు
  rationale: γονεῖςకు సాధారణమైన, కచ్చితమైన తెలుగు సమానం ‘తల్లిదండ్రులు’.
- source_word: τοῦ ἀναβλέψαντος
  choice: చూపు పొందినవాని
  rationale: ఆర్టికల్‌తో ఉన్న కృదంతం ఆ వ్యక్తిని చూపు పొందిన సంఘటన ద్వారా గుర్తిస్తుంది; ‘చూపు పొందినవాని’ ఆ రూపాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι పదబంధం సూచించే వర్గం
  choice: యూదులు
  alternative: యూదా నాయకులు; యూదయ ప్రాంతవాసులు
  rationale: మూల గ్రీకు పదబంధాన్ని ప్రధాన పాఠంలో విస్తృతంగానే ఉంచడం వల్ల అది సూచించే వర్గాన్ని అనువాదంలోనే సంకుచితం చేయడం నివారించబడుతుంది. అయితే ఈ సందర్భం విచారణ చేస్తున్న అధికార వర్గాన్ని సూచించే అవకాశం ఉన్నందున, ఆ సందర్భసాధ్యమైన అర్థాన్ని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి పాటించబడింది. గ్రీకు వాక్యంలోని ‘వరకు’ నిర్మాణం మరియు చూపు పొందిన వ్యక్తిని కృదంతంతో మళ్లీ గుర్తించే విధానం నిలుపబడ్డాయి.
