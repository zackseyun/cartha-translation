revisions:
- from: అందువల్ల యూదులు[a] చూపు పొందినవాని తల్లిదండ్రులను పిలిపించే వరకు, అతడు గుడ్డివాడై ఉండి చూపు పొందాడని అతని గురించి నమ్మలేదు.
  to: అందువల్ల, చూపు పొందిన వ్యక్తి తల్లిదండ్రులను పిలిపించే వరకు, యూదులు[a] అతని గురించి అతడు గుడ్డివాడిగా ఉండి చూపు పొందాడని నమ్మలేదు.
  rationale: The revision retains the source's ambiguity concerning οἱ Ἰουδαῖοι and keeps the temporal force of ἕως ὅτου. It makes the Telugu more idiomatic and syntactically transparent, while rendering the healed person’s earlier condition as a state rather than as an implied transition into blindness.
