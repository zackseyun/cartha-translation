translation:
  language: te
  text: ఒకప్పుడు అంధుడిగా ఉన్న మనిషిని వారు పరిసయ్యుల దగ్గరికి తీసుకువచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγουσιν
  choice: తీసుకువచ్చారు
  rationale: గ్రీకు వర్తమాన కాలం ఇక్కడ కథనంలోని చారిత్రక వర్తమానం. సహజమైన తెలుగు కథనశైలిలో భూతకాలంగా అనువదించడం సముచితం; సందర్భంలో అతనిని పరిసయ్యుల దగ్గరికి తీసుకురావడాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὐτὸν
  choice: ఆ మనిషిని
  rationale: మూలంలో ‘అతనిని’ అనే సర్వనామం ఉన్నా, వెంట వచ్చే substantival విశేషణ పదబంధంతో కలిపి తెలుగులో ‘ఆ మనిషిని’ అని చెప్పడం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: πρὸς τοὺς Φαρισαίους
  choice: పరిసయ్యుల దగ్గరికి
  rationale: πρός + accusative వ్యక్తుల వైపు కదలికను సూచిస్తుంది. ‘దగ్గరికి’ అనేది దిశను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ఎదుటికి’ అనడం సందర్భాన్ని కొంత ఎక్కువగా వ్యాఖ్యానిస్తుంది.
- source_word: Φαρισαίους
  choice: పరిసయ్యులు
  rationale: ఈ యూద మతవర్గానికి తెలుగులో స్థిరపడిన ప్రామాణిక రూపం.
- source_word: τόν ποτε τυφλόν
  choice: ఒకప్పుడు గుడ్డివాడిగా ఉన్న ఆ మనిషిని
  rationale: ఈ పదబంధం ‘ఒకప్పుడు గుడ్డివాడిగా ఉన్న వ్యక్తి’ అని substantivally పనిచేస్తుంది. అతని పూర్వస్థితికీ ప్రస్తుత స్వస్థతకీ ఉన్న వ్యత్యాసాన్ని తెలుగు సంబంధవాక్య నిర్మాణం స్పష్టంగా నిలుపుతుంది.
- source_word: ποτε
  choice: ఒకప్పుడు
  rationale: ఇక్కడ గతంలో ఉన్న స్థితిని సూచించే ‘formerly/once’ భావం. ‘ఒకప్పుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి కాలవ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: τυφλόν
  choice: గుడ్డివాడిగా
  rationale: అతని పూర్వ అంధత్వాన్ని తెలిపే విశేషణానికి సాధారణంగా అర్థమయ్యే ప్రత్యక్ష తెలుగు రూపం.
