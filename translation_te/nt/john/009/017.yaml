source:
  edition: SBLGNT
  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: te
  text: అప్పుడు వారు ఆ అంధుడితో మళ్లీ, “అతడు నీ కళ్లను తెరిచాడు కాబట్టి, అతని గురించి నువ్వేమంటావు?[a][b]” అని అడిగారు. అతడు, “ఆయన ఒక ప్రవక్త” అని చెప్పాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని గురించి నువ్వే ఏమంటావు?” గ్రీకులో ‘నువ్వు’ అనే పదం స్పష్టంగా ఉండి ఉద్ఘాటనను ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎందుకంటే అతడు నీ కళ్లను తెరిచాడు.” ఇక్కడ గ్రీకు పదం ప్రశ్నకు ఆధారమైన కారణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఆయన ప్రవక్త.” గ్రీకు పదబంధాన్ని బిరుదులాంటి భావంతో కూడా చదవవచ్చు; అయితే ఈ సందర్భం ‘ఒక ప్రవక్త’ అనే అర్థానికీ మద్దతిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: ముందటి సంభాషణకు కొనసాగింపును సూచిస్తుంది; కథనంలో సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: τῷ τυφλῷ
  choice: ఆ గుడ్డివానితో
  rationale: విశేషణం నామవాచకంగా వాడబడింది. ఈ వాక్యంలో అతణ్ణి గ్రీకు మూలం గుడ్డివానిగానే పేర్కొంటుంది; ‘మునుపు గుడ్డివాడైన వ్యక్తి’ అని విస్తరించడం మూలంలో లేని దృష్టికోణాన్ని చేర్చుతుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: కొనసాగుతున్న విచారణలో ప్రశ్నను తిరిగి అడిగారనే భావాన్ని కాపాడుతుంది.
- source_word: Τί σὺ λέγεις
  choice: నువ్వేమంటావు
  rationale: స్పష్టంగా ఉన్న σὺ ఇచ్చే వ్యక్తిగత ఉద్ఘాటనను ‘నువ్వు’ ద్వారా సహజంగా నిలుపుతుంది.
- source_word: περὶ αὐτοῦ
  choice: అతని గురించి
  rationale: περί + షష్ఠీ విభక్తి భావానికి సహజమైన తెలుగు రూపం.
- source_word: ὅτι
  choice: కదా
  rationale: ఇక్కడ ప్రశ్నకు ఆధారమైన కారణాన్ని సూచిస్తుంది. తెలుగు సంభాషణలో ‘కదా’ ఆ తెలిసిన వాస్తవాన్ని కారణభావంతో సహజంగా అనుసంధానిస్తుంది; ‘ఎందుకంటే’ అనే ప్రత్యామ్నాయం కూడా సాధ్యం.
- source_word: ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: అతడు నీ కళ్లను తెరిచాడు
  rationale: అయోరిస్టును కథన సందర్భంలో సాధారణ భూతకాలంతో, రూపకాన్ని యథాతథంగా అనువదిస్తుంది.
- source_word: Προφήτης ἐστίν
  choice: ఆయన ఒక ప్రవక్త
  rationale: ఆర్టికల్ లేని విధేయ నామవాచకం ఇక్కడ సాధారణంగా అనిర్దిష్ట/గుణసూచక భావం ఇస్తుంది. సందర్భంలో యేసును ఒక ప్రవక్తగా గుర్తించడం సహజం; నిర్దిష్ట బిరుదును బలవంతంగా చేర్చదు.
theological_decisions:
- issue: Προφήτης ను సాధారణ నామవాచకంగా అనువదించాలా, నిర్దిష్ట బిరుదుగా అనువదించాలా
  choice: ఒక ప్రవక్త
  alternative: ప్రవక్త
  rationale: ఈ సందర్భం స్వస్థత పొందిన వ్యక్తి యేసు గురించి క్రమంగా ఏర్పరచుకుంటున్న అవగాహనను చూపుతుంది. ‘ఒక ప్రవక్త’ అనడం నిర్దిష్ట మెస్సీయ బిరుదును ముందుగానే ఆపాదించకుండా కథనంలోని ఉద్వేగాన్ని కాపాడుతుంది; అయినా గ్రీకు రూపానికి బిరుదులాంటి పఠనం సాధ్యమని పాదసూచనలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన సంభాషణా నిర్మాణంతో, అయితే గౌరవప్రదమైన శైలిలో రూపొందించబడింది. యేసును సూచించే సమాధానంలో ‘ఆయన’ వాడి తెలుగు మర్యాదను పాటించగా, ప్రశ్నలోని αὐτός కు ‘అతడు/అతని’ వాడి వక్తల దూరభావాన్ని నిలిపింది.
