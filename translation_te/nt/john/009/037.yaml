id: JHN.9.37
reference: John 9:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτῷ ὁ Ἰησοῦς· Καὶ ἑώρακας αὐτὸν καὶ ὁ λαλῶν μετὰ σοῦ ἐκεῖνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: te
  text: యేసు అతనితో, “నువ్వు ఆయనను చూశావు; నీతో మాట్లాడుతున్నవాడే ఆయన” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: యేసు అతనితో ... అన్నాడు
  rationale: సంభాషణాత్మక తెలుగు వాక్య నిర్మాణంలో సంబోధితుణ్ణి ‘అతనితో’ అని చూపించి, εἶπενను సహజంగా ‘అన్నాడు’ అని అనువదించాం.
- source_word: Καὶ ἑώρακας αὐτὸν
  choice: నువ్వు ఆయనను చూశావు
  rationale: పరిపూర్ణ కాలరూపం గతంలో జరిగిన దర్శనానికి ప్రస్తుత సందర్భంలో కొనసాగుతున్న ప్రాధాన్యాన్ని ఇస్తుంది. తెలుగులో సహజమైన ‘చూశావు’ సందర్భం ద్వారా ఆ భావాన్ని మోస్తుంది; ప్రారంభ καί తెలుగు సంభాషణలో అవసరం లేని కృత్రిమ ‘మరియు’గా మార్చబడలేదు.
- source_word: ὁ λαλῶν μετὰ σοῦ
  choice: నీతో మాట్లాడుతున్నవాడు
  rationale: వర్తమాన కృదంతాన్ని సహజంగా ‘మాట్లాడుతున్నవాడు’గా, μετά + సంబంధ విభక్తి యొక్క పరస్పర సాన్నిధ్య భావాన్ని ‘నీతో’గా నిలిపాం.
- source_word: ἐκεῖνός ἐστιν
  choice: ఆయనే
  rationale: గ్రీకు గుర్తింపు సూత్రంలోని స్పష్టతను, ఉద్ఘాటనను తెలుగు ‘ఏ’ ప్రత్యయంతో సంక్షిప్తంగా నిలిపి, ముందు సందర్భంలోని బిరుదును ఈ వాక్యంలో అదనంగా చేర్చలేదు.
theological_decisions:
- issue: మునుపటి వచనంలో ప్రస్తావించిన వ్యక్తితో యేసు తనను తాను గుర్తించడం
  choice: ‘నీతో మాట్లాడుతున్నవాడే ఆయన’ అనే ప్రత్యక్ష గుర్తింపును నిలిపాం.
  alternative: ‘నీతో మాట్లాడుతున్నది నేనే’ లేదా సందర్భంలోని బిరుదును మళ్లీ స్పష్టంగా చేర్చడం.
  rationale: మూలపాఠం ‘నేనే’ అని నేరుగా చెప్పకుండా ἐκεῖνός ἐστιν అనే తృతీయ పురుష గుర్తింపు నిర్మాణాన్ని వాడుతుంది. అందువల్ల ప్రకటన బలాన్ని కాపాడుతూ, మూలంలో లేని వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. యేసు సంబోధనలో సందర్భోచిత ఏకవచన ‘నువ్వు/నీతో’ను వాడాం; సూచిత వ్యక్తికి గౌరవార్థక ‘ఆయన’ను ఉంచాం.
