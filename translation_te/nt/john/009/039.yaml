source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: te
  text: 'యేసు ఇలా అన్నాడు: “తీర్పు[a] కోసం నేను ఈ లోకంలోకి వచ్చాను—చూడనివారు చూడాలని, చూస్తున్నవారు గుడ్డివారిగా మారాలని.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక తీర్పు కోసం.” గ్రీకు εἰς κρίμα అనే పదబంధం కేవలం శిక్షావిధినే కాక, యేసు రాకవల్ల కలిగే న్యాయపరమైన ఫలితాన్ని కూడా నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: తీర్పు
  rationale: ఇక్కడ న్యాయపరమైన వివేచన లేదా తీర్పు వల్ల కలిగే ఫలితాన్ని సూచిస్తుంది. ‘శిక్షావిధి’ అని అనడం భావాన్ని అతిగా కుదిస్తుంది; ఎందుకంటే ఈ వాక్యంలో చూపు పొందడం, గుడ్డివారిగా కావడం అనే రెండు ఫలితాలూ ఉన్నాయి.
- source_word: κόσμον
  choice: లోకం
  rationale: యోహాను రచనల్లో κόσμοςకు సహజమైన, స్థిరమైన తెలుగు సమానార్థకం ‘లోకం’; ఇక్కడ మానవ లోకాన్ని సూచిస్తుంది.
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: చూడనివారు / చూస్తున్నవారు
  rationale: కృదంతాల సమాంతర నిర్మాణాన్ని నిలుపుతూ, భౌతిక చూపు మరియు ఆత్మీయ గ్రహింపు అనే రెండు అర్థాలకూ చోటు ఇస్తుంది.
- source_word: βλέπωσιν
  choice: చూడాలి
  rationale: ἵναతో వచ్చిన సంభావ్య క్రియ ఉద్దేశం లేదా ఫలితాన్ని తెలుపుతుంది. ‘చూపు పొందాలి’ కన్నా ‘చూడాలి’ అనేది భౌతిక, రూపకాలంకార అర్థాలను రెండింటినీ నిలుపుతుంది.
- source_word: τυφλοὶ
  choice: గుడ్డివారు
  rationale: predicate adjective యొక్క పదునైన విరుద్ధతను సహజ తెలుగులో నిలుపుతుంది; సందర్భంలో ఆత్మీయ అంధత్వ భావాన్ని కూడా తెరిచి ఉంచుతుంది.
- source_word: γένωνται
  choice: కావాలి
  rationale: γίνομαιలోని ‘అవడం/మారడం’ అనే ఫలితార్థాన్ని నిలుపుతుంది; కేవలం గుడ్డివారిగా వెల్లడవడం అనే అర్థానికి పరిమితం చేయదు.
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: నేను ఈ లోకంలోకి వచ్చాను
  rationale: εἰςతో కూడిన రావడం అనే భావాన్ని, యోహాను సువార్తలోని లోకంలోకి రావడం అనే భాషను సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యోహాను 3:17లోని ‘లోకానికి తీర్పు తీర్చడానికి కాదు’ అనే మాటతో ఈ వాక్యానికి ఉన్న సంబంధం
  choice: κρίμαను ‘తీర్పు’ అని అనువదించి ఉద్రిక్తతను అలాగే ఉంచడం
  alternative: విభజనను ముందుకు తెచ్చేందుకు ‘నిర్ణాయక విభజన’ అనడం, లేదా శిక్షను నొక్కిచెప్పేందుకు ‘శిక్షావిధి’ అనడం
  rationale: 'యేసు రాక న్యాయపరమైన వేర్పాటును కలిగిస్తుందని వాక్యం చెబుతుంది: చూడనివారు చూస్తారు; చూస్తున్నవారు గుడ్డివారవుతారు. ఇతర యోహానీయ వాక్యాలతో బలవంతంగా సమన్వయం చేయకుండా అసలు వాక్యంలోని theological tensionను నిలుపుతుంది.'
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘చూడనివారు/చూస్తున్నవారు’ అనే సమాంతరత ద్వారా మూలంలోని భౌతిక-ఆత్మీయ ద్వంద్వార్థం నిలుపబడింది. సహజ తెలుగు కోసం రెండవ ‘వచ్చాను’ను చివర పునరుక్తి చేశాం; అది మొదటి క్రియలోని ఉద్దేశాన్ని స్పష్టంగా మోస్తుంది.
