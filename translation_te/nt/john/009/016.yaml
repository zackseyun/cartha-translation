id: JHN.9.16
reference: John 9:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: te
  text: కాబట్టి పరిసయ్యుల్లో కొందరు, “ఈ మనిషి దేవుని నుండి వచ్చినవాడు కాదు, ఎందుకంటే ఇతడు సబ్బాతు దినాన్ని పాటించడు” అని చెబుతున్నారు. కానీ మరికొందరు, “పాపియైన మనిషి[a] ఇలాంటి సూచకాలను[b] ఎలా చేయగలడు?” అని చెబుతున్నారు. వారి మధ్య విభేదం ఏర్పడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాపి.” గ్రీకులో “పాపియైన” అనే విశేషణం “మనిషి” అనే పదాన్ని విశేషిస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: యోహాను యేసు చేసిన కార్యాలను తరచుగా “సూచకాలు” అని పిలుస్తాడు; ఈ పదం అవి యేసు గురించి వెల్లడించే అర్థాన్ని నొక్కిచెబుతుంది. లేదా, “అద్భుత సూచనలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον ... τινές
  choice: కొందరు ... అని అంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ ongoing/repeated speech‌ను సూచిస్తుంది; ‘అంటూ ఉన్నారు’ ఆ దృక్కోణాన్ని తెలుగులో నిలుపుతుంది.
- source_word: οὖν
  choice: అందువల్ల
  rationale: ముందటి సంఘటనతో ఉన్న అన్వయ/ఫలిత సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκ τῶν Φαρισαίων
  choice: పరిసయ్యుల్లో కొందరు
  rationale: పరిసయ్యుల సమూహంలోనుండి ఒక ఉపసమూహాన్ని సూచించే సహజ తెలుగు రూపం.
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: ఈ మనిషి
  rationale: నిర్దిష్ట పురుషుణ్ణి సూచించే మూలపాఠంలోని నిర్దేశక భావాన్ని అదనపు అవమానార్థం చేర్చకుండా నిలుపుతుంది.
- source_word: παρὰ θεοῦ
  choice: దేవుని నుండి వచ్చినవాడు
  rationale: దేవుడే మూలం అనే భావాన్ని తెలుగులో పూర్తిగా వ్యక్తం చేస్తుంది; మూలంలో స్పష్టంగా లేని ‘పంపబడినవాడు’ అనే భావాన్ని చేర్చదు.
- source_word: τηρεῖ
  choice: పాటించడు
  rationale: విశ్రాంతి దిన ఆచరణ సందర్భంలో ‘పాటించు’ సహజమైన, స్పష్టమైన సమానార్థకం.
- source_word: τὸ σάββατον
  choice: విశ్రాంతి దినం
  rationale: యూదుల సబ్బాతు దినాన్ని సాధారణ ఆధునిక తెలుగు పాఠకుడికి అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: ἄλλοι
  choice: మరికొందరు
  rationale: మొదటి గుంపుతో వ్యత్యాసంగా ఉన్న ఇతరులను సహజంగా సూచిస్తుంది.
- source_word: Πῶς δύναται
  choice: ఎలా చేయగలడు?
  rationale: సామర్థ్యం/సాధ్యతను ప్రశ్నించే గ్రీకు నిర్మాణానికి సహజ తెలుగు ప్రశ్నారూపం.
- source_word: ἁμαρτωλὸς
  choice: పాపియైన
  rationale: ‘మనిషి’ని విశేషించే గ్రీకు విశేషణ నిర్మాణాన్ని నేరుగా నిలుపుతుంది.
- source_word: τοιαῦτα σημεῖα
  choice: ఇలాంటి సూచక క్రియలు
  rationale: ఇవి కేవలం అద్భుతాలు కాక మరొక వాస్తవాన్ని వెల్లడించే ‘సూచనలు’ అనే యోహాను పదప్రయోగాన్ని, అవి కార్యాలు కూడా అనే విషయాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: σχίσμα
  choice: చీలిక
  rationale: గుంపులో ఏర్పడిన విభజనను బలంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో σημεῖα పదం
  choice: సూచక క్రియలు
  alternative: అద్భుతాలు / అద్భుత సూచనలు
  rationale: క్రియల ఆశ్చర్యకర స్వభావంతో పాటు అవి యేసు గురించి వెల్లడించే సూచనలనే యోహాను భావాన్ని నిలుపుతుంది; ‘అద్భుతాలు’ మాత్రమే అనడం ఆ భావాన్ని తగ్గిస్తుంది.
- issue: యేసు ‘దేవుని నుండి’ ఉండడం
  choice: దేవుని నుండి వచ్చినవాడు
  alternative: దేవుడు పంపినవాడు
  rationale: మూలపాఠం దైవిక మూలం లేదా అధికారాన్ని ప్రశ్నించే ఉద్రిక్తతను ఉంచుతుంది; ‘పంపినవాడు’ అని అనువదిస్తే ఇక్కడ స్పష్టంగా లేని మిషన్ భావం చేరుతుంది.
- issue: ἁμαρτωλὸς యొక్క వ్యాకరణ రూపం
  choice: పాపియైన మనిషి
  alternative: పాపి
  rationale: గ్రీకులో ఇది ‘మనిషి’ని విశేషించే విశేషణం. ప్రధాన పాఠం ఆ నిర్మాణాన్ని నిలుపుతుంది; సహజమైన సంక్షిప్త ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకుడికి అర్థమయ్యేలా, అయినా గౌరవప్రదమైన వచనశైలి. గ్రీకు అసంపూర్ణ భూతకాల దృక్కోణాన్ని ‘అంటూ ఉన్నారు’తో, గుంపులోని తీవ్ర విభేదాన్ని ‘చీలిక’తో నిలుపుకుంది.
