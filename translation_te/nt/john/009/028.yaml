id: JHN.9.28
reference: John 9:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: te
  text: వారు అతణ్ణి దూషించి, “నువ్వు ఆ వ్యక్తి[a] శిష్యుడివి; మేమైతే మోషే శిష్యులం” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన శిష్యుడివి.” గ్రీకులో “ఆ వ్యక్తి/ఆయన” అనే భావమిచ్చే పదం ఉంది; ఇక్కడ అది నిరాదరణతో దూరం పెట్టే ధ్వనిని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: దూషించి
  rationale: ఈ క్రియ మాటలతో తీవ్రంగా అవమానించడం, నిందించడం అనే భావాన్ని ఇస్తుంది. ‘దూషించి’ ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: αὐτὸν
  choice: అతణ్ణి
  rationale: స్వస్థత పొందిన మనిషిని సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: καὶ εἶπον
  choice: అన్నారు
  rationale: గ్రీకు వాక్యంలోని కథన సమన్వయాన్ని తెలుగులో ‘దూషించి ... అన్నారు’ అనే సహజ నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: Σὺ
  choice: నువ్వు
  rationale: గ్రీకులో సర్వనామం ముందుకు వచ్చి నొక్కి చెప్పబడింది. వాక్యారంభంలోని ‘నువ్వు’ ఆ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: μαθητὴς / μαθηταί
  choice: శిష్యుడు / శిష్యులం
  rationale: యోహాను సువార్తలో ఈ పదం కేవలం విద్యార్థిని కాక, ఒకరితో అనుబంధం కలిగి ఆయనను అనుసరించేవారిని సూచిస్తుంది. రెండు చోట్ల ఒకే మూలపదానికి అనుగుణమైన పదాన్ని వాడడం వాక్యంలోని వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ἐκείνου
  choice: ఆ వ్యక్తి
  rationale: ఈ సూచన సర్వనామం సందర్భంలో దూరం పెట్టే, నిరాదరణతో కూడిన ధ్వనిని కలిగి ఉండవచ్చు. ‘ఆ వ్యక్తి’ ఆ భావాన్ని అతిగా పెంచకుండా వ్యక్తం చేస్తుంది.
- source_word: ἡμεῖς δὲ
  choice: మేమైతే
  rationale: δέ చూపే వ్యత్యాసాన్నీ, ἡμεῖς‌లోని ఉద్ఘాటననూ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τοῦ Μωϋσέως
  choice: మోషే
  rationale: μαθηταίతో ఉన్న సంబంధార్థక షష్ఠీని తెలుగులో సహజంగా ‘మోషే శిష్యులం’ అని వ్యక్తం చేసింది.
theological_decisions:
- issue: యేసును సూచించే ἐκείνου పదంలోని ధ్వని
  choice: ‘ఆ వ్యక్తి’ అని అనువదించి, మాట్లాడేవారి నిరాదరణతో కూడిన దూరాన్ని నిలిపింది.
  alternative: ‘ఆయన’ లేదా ‘ఆయనకు’ అని మరింత తటస్థంగా అనువదించడం.
  rationale: దూషణ జరుగుతున్న వాదనాత్మక సందర్భం నిరాదరణ ధ్వనికి మద్దతిస్తుంది; అయితే గ్రీకు పదం తటస్థంగానూ అర్థమయ్యే అవకాశం ఉన్నందున ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
- issue: μαθητής పదాన్ని రెండు భాగాల్లో ఒకే విధంగా అనువదించడం
  choice: ‘శిష్యుడు/శిష్యులు’ అని వాడింది.
  alternative: ‘అనుచరుడు/అనుచరులు’ లేదా ‘విద్యార్థి/విద్యార్థులు’.
  rationale: ఇక్కడ ఈ పదం కేవలం నేర్చుకునే సంబంధం కంటే నిబద్ధతతో కూడిన అనుబంధాన్ని సూచిస్తుంది; ఒకే పదప్రయోగం యేసు శిష్యత్వం, మోషే శిష్యత్వం మధ్య ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. ‘నువ్వు’ అనే రూపం గ్రీకు Σὺ యొక్క ఉద్ఘాటనను, అలాగే విరోధపూరిత సంభాషణ సందర్భాన్ని సహజంగా ప్రతిబింబిస్తుంది.
