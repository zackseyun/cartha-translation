source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: te
  text: 'యేసు ఇలా జవాబిచ్చాడు: “ఇతడు పాపం చేయలేదు, ఇతని తల్లిదండ్రులూ పాపం చేయలేదు. కాని ఇది జరిగింది[a], దేవుని కార్యాలు ఇతనిలో[b] బయలుపడటానికి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకు వాక్యంలో ‘ఇది జరిగింది’ అనే మాటలు ప్రత్యక్షంగా లేవు; అక్షరార్థంగా, ‘కాని దేవుని కార్యాలు ఇతనిలో బయలుపడటానికి’ అని ఉంది. తెలుగులో వాక్యం సహజంగా, సంపూర్ణంగా ఉండేందుకు ఈ మాటలు సందర్భానుసారంగా చేర్చబడ్డాయి.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇతని ద్వారా’ అని కూడా అర్థం కావచ్చు. గ్రీకులో అక్షరార్థంగా ‘ఇతనిలో’ అని ఉంది; అది దేవుని కార్యాలు కనబడే పరిధిని గానీ, వాటిని ప్రదర్శించే సాధనాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς
  choice: యేసు ఇలా జవాబిచ్చాడు
  rationale: సంభాషణలో ἀποκρίνομαι యొక్క సహజమైన కథన భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Οὔτε ... οὔτε
  choice: ఇతడు ... చేయలేదు, ఇతని తల్లిదండ్రులూ ... చేయలేదు
  rationale: రెండు ప్రతిపాదనలనూ సమానంగా నిరాకరించే గ్రీకు సహసంబంధ నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: οὗτος
  choice: ఇతడు
  rationale: సందర్భంలోని చూపులేని వ్యక్తిని స్పష్టంగా సూచించే సహజమైన తెలుగు సర్వనామం.
- source_word: ἥμαρτεν
  choice: పాపం చేయలేదు
  rationale: ἁμαρτάνω యొక్క సరళమైన అర్థాన్ని, ఈ ప్రత్యేక సందర్భానికి పరిమితమైన నిరాకరణగా అనవసర విస్తరణ లేకుండా అందిస్తుంది.
- source_word: οἱ γονεῖς αὐτοῦ
  choice: ఇతని తల్లిదండ్రులు
  rationale: γονεῖς అనే బహువచన పదానికి ఖచ్చితమైన, సాధారణ తెలుగు సమానం.
- source_word: ἀλλ’ ἵνα
  choice: అయితే ... బయలుపడేలా ఇది జరిగింది
  rationale: ἵναతో వచ్చిన ఉద్దేశ భావాన్ని నిలుపుతూ, తెలుగులో అసంపూర్ణంగా వినిపించకుండా ‘ఇది జరిగింది’ అనే సందర్భసిద్ధ పదాలను సరఫరా చేస్తుంది; ఆ సరఫరాను పాదసూచికలో తెలియజేస్తుంది.
- source_word: φανερωθῇ
  choice: బయలుపడేలా
  rationale: దాగి ఉన్నది వెల్లడవడం లేదా స్పష్టంగా కనిపించడం అనే నిష్క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: దేవుని కార్యాలు
  rationale: యోహాను రచనలోని ‘కార్యాలు’ అనే భావపదాన్ని గంభీరంగా, పారదర్శకంగా నిలుపుతుంది.
- source_word: ἐν αὐτῷ
  choice: ఇతనిలో
  rationale: ἐν యొక్క ప్రత్యక్ష స్థానార్థాన్ని నిలుపుతుంది; ‘ఇతని ద్వారా’ అని సాధనార్థాన్ని మాత్రమే నిర్ణయించదు.
theological_decisions:
- issue: ఈ వ్యక్తి అంధత్వానికీ పాపానికీ ఉన్న సంబంధం గురించి యేసు చేసిన నిరాకరణ పరిధి
  choice: ఈ సందర్భంలో ఇతడు లేదా ఇతని తల్లిదండ్రులు చేసిన పాపమే కారణమనే రెండు ప్రతిపాదనలను మాత్రమే నిరాకరించేలా అనువదించడం
  alternative: ఏ బాధకూ వ్యక్తిగత లేదా తల్లిదండ్రుల పాపంతో ఎప్పుడూ సంబంధం ఉండదనే సార్వత్రిక సిద్ధాంతంగా విస్తరించడం
  rationale: వాక్యం శిష్యులు అడిగిన ప్రత్యేక ప్రశ్నకు జవాబిస్తుంది; పాఠ్యం చెప్పేదానికంటే విస్తృతమైన సిద్ధాంతాన్ని అనువాదంలో చేర్చకూడదు.
- issue: ἵνα ఉద్దేశాన్నా లేక కేవలం ఫలితాన్నా సూచిస్తుంది
  choice: ‘బయలుపడేలా’ అనే ఉద్దేశార్థక భాషను ఉపయోగించడం
  alternative: ‘దాని ఫలితంగా బయలుపడ్డాయి’ అని కేవలం ఫలితంగా అనువదించడం
  rationale: ἵνα + subjunctive యొక్క సూటి పఠనం ఉద్దేశాన్ని సూచిస్తుంది. దేవుడు అంధత్వాన్ని కలిగించాడని పాఠ్యానికి మించి ప్రకటించకుండా ఆ ఉద్విగ్నతను అలాగే ఉంచుతుంది.
- issue: ἐν αὐτῷలోని ἐνను స్థానార్థంగా లేదా సాధనార్థంగా గ్రహించడం
  choice: ‘ఇతనిలో’ అని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘ఇతని ద్వారా’ అని అనువదించడం
  rationale: ‘ఇతనిలో’ గ్రీకు పదబంధానికి అత్యంత ప్రత్యక్ష సమానం; సందర్భంలో సాధనార్థం సాధ్యమైనప్పటికీ దానినే తేల్చకుండా పాదసూచికలో సూచించడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన వాక్యనిర్మాణంతోపాటు గంభీరమైన బైబిలు శైలిని పాటించింది. ‘ఇతడు/ఇతని’ రూపాలు సందర్భంలోని వ్యక్తిని స్పష్టంగా ఉంచుతాయి. మూలంలోని అసంపూర్ణంగా వినిపించే ἀλλ’ ἵνα నిర్మాణాన్ని తెలుగులో సహజీకరించిన చోట పాదసూచికతో పారదర్శకత కల్పించబడింది.
