source:
  edition: SBLGNT
  text: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν· Καὶ τίς ἐστιν, κύριε, ἵνα πιστεύσω εἰς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/036.yaml
  text: He answered and said[a], “And who is he, Lord, that I may believe in him?”
translation:
  language: te
  text: అతడు జవాబిచ్చి, “మరి ప్రభువా[a], నేను ఆయనను నమ్మడానికి ఆయన ఎవరు?” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అయ్యా.” గ్రీకు κύριε అనేది “ప్రభువా” అనే అర్థంతో పాటు గౌరవపూర్వక సంబోధనగా కూడా వాడబడుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: అతడు జవాబుగా … అని అన్నాడు
  rationale: గ్రీకు వాక్యంలోని ‘జవాబిచ్చి అన్నాడు’ అనే కథన ద్వంద్వాన్ని ఆధునిక తెలుగులో సహజంగా, దాని జవాబు భావాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: Καὶ
  choice: మరి
  rationale: ప్రశ్నను ముందటి మాటతో అనుసంధానించే గ్రీకు సంధాయక భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τίς ἐστιν
  choice: ఆయన ఎవరు
  rationale: వ్యక్తిని గుర్తించమని అడిగే సూటి ప్రశ్నను గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: κύριε
  choice: ప్రభువా
  rationale: κύριεకు సాధారణమైన theological rendering ‘ప్రభువా’; అయితే ఈ సందర్భంలో గౌరవసూచక సంబోధన కూడా కావచ్చని పాదసూచికలో ఉంచబడింది.
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: నేను ఆయనను నమ్మడానికి
  rationale: ἵναతో కూడిన ఉద్దేశార్థాన్ని నిలుపుతూ, πιστεύω εἰς యొక్క ‘ఆయనను నమ్మడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: స్వస్థత పొందిన వ్యక్తి స్పష్టమైన విశ్వాస ప్రకటనకు ముందు κύριεను ఎలా అనువదించాలి
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: κύριε అనేది ‘ప్రభువా’ అని కూడా, గౌరవసూచకంగా ‘అయ్యా’ అని కూడా అర్థమవుతుంది. కథనంలో అతని అవగాహన స్థాయి ఇక్కడ పూర్తిగా నిర్ధారించబడనందున ప్రధాన పాఠంలో సాధారణ అనువాదాన్ని ఉంచి, నిజమైన సందిగ్ధతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సహజమైన వాక్యనిర్మాణం వాడబడింది. సంబోధనలోని గ్రీకు సందిగ్ధత పాదసూచికలో నిలుపబడింది.
