id: JHN.9.30
reference: John 9:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: te
  text: 'ఆ మనిషి వారికి ఇలా జవాబిచ్చాడు: “ఇందులో ఆశ్చర్యకరమైన విషయం ఇదే: ఆయన ఎక్కడి నుంచి వచ్చాడో మీకు తెలియదు; అయినా ఆయన నా కళ్లు తెరిచాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: ఆ మనిషి వారికి ఇలా జవాబిచ్చాడు
  rationale: గ్రీకు సంభాషణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది. ‘జవాబిచ్చాడు’ ἀπεκρίθη భావాన్ని నిలుపుతుంది; εἶπεν యొక్క మాటల ప్రవేశక పాత్రను ‘ఇలా’ సహజంగా సూచిస్తుంది.
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: ఇందులో ఆశ్చర్యకరమైన విషయం ఇదే
  rationale: τούτῳ యొక్క సూచనాత్మక బలాన్ని ‘ఇందులో’, ప్రధానంగా చూపే నిర్మాణాన్ని ‘ఇదే’ నిలుపుతాయి. θαυμαστόν ఇక్కడ విస్మయం కలిగించే విషయాన్ని సూచిస్తుంది; ‘ఆశ్చర్యకరమైన’ సహజంగా ఉండి వ్యంగ్య స్వరాన్నీ అనుమతిస్తుంది.
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: మీకు తెలియదు
  rationale: οἴδατε యొక్క జ్ఞానార్థాన్ని నేరుగా అందిస్తుంది. గ్రీకులోని స్పష్టమైన ὑμεῖς ఇచ్చే ఉద్ఘాటనను తెలుగులో ‘మీకు’ ద్వారా నిలుపుతుంది.
- source_word: πόθεν ἐστίν
  choice: ఆయన ఎక్కడి నుంచి వచ్చాడో
  rationale: యేసు మూలం లేదా ఆయన ఎక్కడి నుంచి వచ్చాడనే ప్రశ్నను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; మూలభాషలోని ఉద్దేశిత విస్తృతిని సంకుచితం చేయదు.
- source_word: καὶ
  choice: అయినా
  rationale: రూపపరంగా ‘మరియు’ అయినప్పటికీ, ఇక్కడ వారి అజ్ఞాన వాదనకు మరియు జరిగిన స్వస్థతకు మధ్య ఉన్న విరుద్ధతను సందర్భం స్పష్టంగా చూపుతుంది. ‘అయినా’ ఆ సంభాషణాత్మక బలాన్ని సహజంగా అందిస్తుంది.
- source_word: ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: ఆయన నా కళ్లు తెరిచాడు
  rationale: శారీరక స్వస్థతను నేరుగా, సహజంగా తెలుపుతుంది; యోహాను సువార్తలోని ఆధ్యాత్మిక చూపు ప్రతిధ్వనిని అనువాదంలో బలవంతంగా వివరణ చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘నా కళ్లు తెరిచాడు’ అనే మాటలోని యోహానీయ రూపక ప్రతిధ్వని
  choice: శారీరక స్వస్థతను తెలిపే అక్షరార్థ వ్యక్తీకరణను అలాగే ఉంచడం
  alternative: ఆధ్యాత్మిక జ్ఞానోదయాన్ని ముందుకు తెచ్చేలా విస్తరించి అనువదించడం
  rationale: తక్షణ సందర్భంలో ఇది పుట్టుకతో గుడ్డివాడైన మనిషికి కలిగిన శారీరక స్వస్థత. ఆధ్యాత్మిక చూపు అనే విస్తృత అంశం సందర్భం ద్వారా వినిపించాలి గాని అనువాదంలో చేర్చి ఉద్రిక్తతను పరిష్కరించకూడదు.
- issue: πόθεν ἐστίν లోని మూలం/వచ్చిన స్థలం మధ్య భావ విస్తృతి
  choice: ఆయన ఎక్కడి నుంచి వచ్చాడో
  alternative: ఆయన మూలం ఏమిటో
  rationale: సహజ తెలుగు ప్రయోగం వ్యక్తి వచ్చిన స్థలం మరియు విస్తృతమైన మూలం అనే రెండింటికీ అవకాశమిస్తుంది; యోహాను సువార్తలో యేసు మూలం గురించిన అంతర్లీన ప్రశ్నను అతిగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన సంభాషణ శైలి. ‘ఆయన’ సందర్భానుగుణ గౌరవ సూచకం. ఈ ముసాయిదాలో పాదటిప్పణులు అవసరం లేదని నిర్ణయించబడింది; అందువల్ల ప్రధాన పాఠ్యంలో గుర్తులు లేవు.
