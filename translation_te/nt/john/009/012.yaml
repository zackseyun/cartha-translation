id: JHN.9.12
reference: John 9:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂καὶ εἶπαν⸃ αὐτῷ· Ποῦ ἐστιν ἐκεῖνος; λέγει· Οὐκ οἶδα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/012.yaml
  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
translation:
  language: te
  text: వారు అతనితో, “ఆ వ్యక్తి ఎక్కడ ఉన్నాడు?” అని అడిగారు. అతడు, “నాకు తెలియదు” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπαν αὐτῷ
  choice: అప్పుడు వారు అతనితో ... అని అడిగారు
  rationale: καί కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ‘అప్పుడు’ సహజంగా ఉంది. εἶπαν మూలంగా ‘చెప్పారు’ అయినా, ప్రత్యక్ష వాక్యం ప్రశ్న కావడంతో ‘అడిగారు’ ఆధునిక తెలుగులో సహజమైన సమానార్థక ప్రయోగం.
- source_word: Ποῦ ἐστιν ἐκεῖνος
  choice: ఆయన ఎక్కడ ఉన్నాడు?
  rationale: ποῦ ἐστιν స్థలాన్ని ప్రశ్నిస్తుంది. ἐκεῖνος పుంలింగ ఏకవచన సూచన సర్వనామం; సందర్భంలో యేసును సూచిస్తుంది. ‘ఆయన’ గౌరవప్రదమైన, సహజమైన తెలుగు; ‘ఆ వ్యక్తి’ అనడం గ్రీకు సూచన బలాన్ని మరింత స్పష్టంగా చూపినా ఇక్కడ కృత్రిమంగా వినిపించవచ్చు.
- source_word: λέγει
  choice: అతడు ... అన్నాడు
  rationale: గ్రీకులో ఇది కథన వర్తమాన కాలం. తెలుగు కథన శైలిలో సహజత్వం కోసం భూతకాలమైన ‘అన్నాడు’ వాడబడింది; వక్త స్వస్థత పొందిన మనిషి అని సందర్భం స్పష్టం చేస్తుంది.
- source_word: Οὐκ οἶδα
  choice: నాకు తెలియదు
  rationale: తెలుగులో జ్ఞానం లేకపోవడాన్ని సహజంగా, నేరుగా వ్యక్తం చేసే రూపం; గ్రీకు వాక్యంలోని సరళతను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. గ్రీకు కథన వర్తమానాన్ని తెలుగు సహజ కథన భూతకాలంగా మార్చాం. ἐκεῖνος యొక్క సూచనాత్మక భావం తెలుగులో కఠినంగా అనిపించకుండా ‘ఆయన’గా ఇచ్చాం.
