    rationale: While intelligible, ‘దేవునికి మహిమ ఇవ్వు’ is more direct, natural Telugu for the literal imperative Δὸς δόξαν τῷ θεῷ.
  - severity: low
    issue: The footnote quotation reads ‘దేవునికే మహిమ చెల్లించు.’
    rationale: ‘కే’ can introduce an exclusivizing emphasis (‘to God alone’) not explicit in τῷ θεῷ. The quotation should match the main text’s non-exclusive literal wording.
