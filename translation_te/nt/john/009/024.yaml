id: JHN.9.24
reference: John 9:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐφώνησαν οὖν ⸂τὸν ἄνθρωπον ἐκ δευτέρου⸃ ὃς ἦν τυφλὸς καὶ εἶπαν αὐτῷ· Δὸς δόξαν τῷ θεῷ· ἡμεῖς οἴδαμεν ὅτι ⸂οὗτος ὁ ἄνθρωπος⸃ ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: te
  text: 'కాబట్టి వారు పూర్వం గుడ్డివాడిగా ఉన్న ఆ మనిషిని రెండోసారి పిలిచి, అతనితో ఇలా అన్నారు: “దేవునికి మహిమ ఇవ్వు.[a] ఈ మనిషి పాపి అని మాకు తెలుసు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ఇది గంభీరమైన ప్రమాణసదృశ నుడికారం కావచ్చు: “దేవునికి మహిమ ఇవ్వు,” అంటే “దేవుని ఎదుట నిజం చెప్పు” లేదా “దేవుని ఎదుట బహిరంగంగా ఒప్పుకో.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: పిలిచారు
  rationale: ఇక్కడ φωνέω స్వస్థత పొందిన మనిషిని మళ్లీ తమ ఎదుటకు పిలవడాన్ని సూచిస్తుంది. ‘పిలిచారు’ సహజమైన తెలుగు; ‘రప్పించారు’ అనేది మూలంలో స్పష్టంగా లేని అధికారిక బలవంతాన్ని కొంత ఎక్కువగా సూచించవచ్చు.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సంభాషణ ఫలితంగా జరిగిన తదుపరి చర్యను οὖν అనుసంధానిస్తుంది. ‘కాబట్టి’ దాని నిర్ధారణాత్మక అనుసంధానాన్ని నిలుపుతుంది.
- source_word: τὸν ἄνθρωπον
  choice: ఆ మనిషిని
  rationale: ఇది సందర్భంలో ఇప్పటికే తెలిసిన నిర్దిష్ట పురుషుణ్ణి సూచిస్తుంది; తెలుగులో ‘ఆ మనిషిని’ సహజంగా ఆ నిర్దిష్టతను తెలియజేస్తుంది.
- source_word: ἐκ δευτέρου
  choice: రెండోసారి
  rationale: ఈ గ్రీకు నుడికారం ‘రెండవసారి’ అని అర్థం. ‘రెండోసారి’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: ὃς ἦν τυφλός
  choice: పూర్వం గుడ్డివాడిగా ఉన్న
  rationale: గ్రీకులో ‘గుడ్డివాడిగా ఉండేవాడు’ అనే భావం ఉన్నా, ఇప్పుడు అతడు స్వస్థత పొందిన సందర్భాన్ని తెలుగులో స్పష్టంగా, సహజంగా చూపేందుకు ‘పూర్వం ... ఉన్న’ అని అనువదించబడింది; అతడు ఇంకా గుడ్డివాడేననే అపార్థాన్ని ఇది నివారిస్తుంది.
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: దేవునికి మహిమ చెల్లించు
  rationale: పదశః భావాన్ని సహజమైన తెలుగు ఆజ్ఞారూపంలో నిలుపుతుంది. ఈ మాట సత్యం చెప్పమనే గంభీర ప్రమాణపూర్వక ఆదేశంగా కూడా పనిచేయవచ్చు; ఆ నుడికారార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἡμεῖς οἴδαμεν
  choice: మాకు తెలుసు
  rationale: స్పష్టంగా ఉన్న ἡμεῖς వక్తల నిశ్చయాన్ని నొక్కి చెబుతుంది. ‘మాకు తెలుసు’ తెలుగు వాక్యనిర్మాణంలో సహజంగా ఆ వాదనను నిలుపుతుంది.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: ఈ మనిషి
  rationale: సూచక సర్వనామం మరియు నామవాచకాన్ని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది. అవమానార్థకమైన ‘ఈ వెధవ’ వంటి పదాలను మూలం సమర్థించదు.
- source_word: ἁμαρτωλός
  choice: పాపి
  rationale: ఇక్కడ ఇది విధేయపదంగా వ్యక్తిని వర్గీకరిస్తోంది. ‘పాపి’ ఆరోపణను సంక్షిప్తంగా, నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: Δὸς δόξαν τῷ θεῷ అనే మాట యొక్క నుడికారార్థం
  choice: ప్రధాన పాఠ్యంలో ‘దేవునికి మహిమ చెల్లించు’ అనే పదశః భావాన్ని నిలుపడం
  alternative: ‘దేవుని ఎదుట నిజం చెప్పు’ లేదా ‘దేవుని ఎదుట బహిరంగంగా ఒప్పుకో’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: ఈ మాట నిజం చెప్పమనే గంభీర ఆదేశంగా పనిచేసి ఉండవచ్చు; అయినా గ్రీకు పదాలు స్వయంగా దేవునికి మహిమ ఇవ్వమని చెబుతున్నాయి. వ్యాఖ్యానాన్ని పాఠ్యంలోనే ఖరారు చేయకుండా, పదశః భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి నుడికారార్థాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని ఆరోపణాత్మక స్వరాన్ని అదనపు అవమానార్థక పదాలు చేర్చకుండా నిలిపాం; సందిగ్ధమైన నుడికారాన్ని ప్రధాన పాఠ్యం మరియు పాదటిప్పణి ద్వారా సంరక్షించాం.
