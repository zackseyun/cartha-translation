id: JHN.9.31
reference: John 9:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: te
  text: దేవుడు పాపుల మాట వినడని మనకు తెలుసు. అయితే ఎవరైనా దేవుని పట్ల భయభక్తులు గలవాడై[a] ఆయన చిత్తాన్ని చేస్తే, దేవుడు అతని మాట వింటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుణ్ణి ఆరాధించేవాడై.”
    reason: θεοσεβής అనే పదానికి ‘దేవుని పట్ల భయభక్తులు గలవాడు’తో పాటు ‘దేవుణ్ణి ఆరాధించేవాడు’ అనే సాధ్యమైన పదార్థాన్ని సూచించడానికి.
lexical_decisions:
- source_word: οἴδαμεν
  choice: మనకు తెలుసు
  rationale: οἶδα పరిపూర్ణ రూపంలో ఉన్నప్పటికీ కొయినే గ్రీకులో వర్తమానార్థాన్ని ఇస్తుంది; ‘మనకు తెలుసు’ సహజమైన ఆధునిక తెలుగు.
- source_word: ἁμαρτωλῶν
  choice: పాపుల
  rationale: ఈ షష్ఠీ బహువచనం దేవుడు ఎవరి మాట వినడని చెప్పబడుతున్నదో సూచిస్తుంది; ‘పాపులు’ దాని నైతిక, మతపరమైన బలాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἀκούει
  choice: మాట వినడు / మాట వింటాడు
  rationale: ఇక్కడ ἀκούω కేవలం శబ్దం వినడాన్ని కాక, ఒక వ్యక్తి మాటను అనుకూలంగా ఆలకించడాన్ని సూచిస్తుంది. ‘మాట వినడం’ ఆ భావాన్ని సహజంగా తెలియజేస్తూ ‘జవాబివ్వడం’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: θεοσεβὴς
  choice: దేవుని పట్ల భయభక్తులు గలవాడు
  rationale: ఈ విశేషణం దేవుని పట్ల భక్తిపూర్వక గౌరవం గల వ్యక్తిని సూచిస్తుంది. ‘భయభక్తులు గలవాడు’ ఆ విస్తృత భావాన్ని నిలుపుతుంది; కేవలం ఆరాధనా క్రియకే పరిమితం చేయదు.
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: ఆయన చిత్తాన్ని చేస్తే
  rationale: ποιεῖν τὸ θέλημα అనే గ్రీకు నుడికారానికి దగ్గరగా ఉండి, తెలుగులో సుపరిచితమైన మరియు స్పష్టమైన రూపం.
- source_word: τούτου ἀκούει
  choice: దేవుడు అతని మాట వింటాడు
  rationale: τούτου ముందున్న దేవుని పట్ల భయభక్తులు గల వ్యక్తినే బలంగా సూచిస్తుంది. తెలుగులో కర్తను మళ్లీ ‘దేవుడు’ అని చెప్పడం సూచనను స్పష్టం చేస్తుంది; ‘మాట వింటాడు’ మొదటి ἀκούειతో భావసామ్యాన్ని నిలుపుతుంది.
- source_word: ἀλλ’ ἐάν τις
  choice: అయితే ఎవరైనా
  rationale: వ్యతిరేక భావంతో కూడిన షరతును సహజంగా పరిచయం చేస్తూ, గ్రీకులోని అనిర్దిష్ట ఏకవచన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘దేవుడు పాపుల మాట వినడు’ అనే ప్రకటన పరిధి
  choice: వక్త చెప్పిన ప్రకటనను దాని బలంతోనే అనువదించడం
  alternative: ‘దేవుడు పాపుల ప్రార్థనలకు జవాబివ్వడు’ లేదా ‘దేవుడు పాపులను అంగీకరించడు’
  rationale: గ్రీకు పాఠం దేవుడు పాపుల మాట ‘వినడు’ అని మాత్రమే చెబుతూ, ఆయనకు భయభక్తులు గలవాని మాట వినడంతో దానిని వ్యత్యాసపరుస్తుంది. ‘ప్రార్థన’ లేదా సమగ్ర సిద్ధాంతపరమైన వివరణను చేర్చకుండా మూలంలోని ఉద్రిక్తతను నిలిపాం.
- issue: θεοσεβής పదార్థం
  choice: దేవుని పట్ల భయభక్తులు గలవాడు
  alternative: దేవుణ్ణి ఆరాధించేవాడు
  rationale: మూలపదం దేవుని పట్ల భక్తిపూర్వక గౌరవాన్ని సూచించే విశేషణం. ప్రధాన పాఠంలోని ఎంపిక ఆ విస్తృత భావాన్ని ఇస్తుంది; సాధ్యమైన ‘ఆరాధించేవాడు’ అనే అర్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని వాడాం. ‘మాట వినడం’ అనే సహజ తెలుగు ప్రయోగం అనుకూలంగా ఆలకించడం అనే సందర్భార్థాన్ని నిలుపుతుంది; మూలంలో లేని ‘ప్రార్థన’ లేదా ‘జవాబు’ వంటి భావాలను చేర్చలేదు.
