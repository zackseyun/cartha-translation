  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: te
  text: ఈ సంగతుల తరువాత యేసు గలిలయలో సంచరిస్తూ ఉన్నాడు. యూదులు[a] ఆయనను చంపడానికి ప్రయత్నిస్తూ ఉండటం వల్ల, యూదయలో సంచరించాలని ఆయన కోరలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యూదయవాసులు’; సందర్భానుసారం ‘యూదు నాయకులు.’ యోహాను సువార్తలో ‘యూదులు’ అనే పదం చాలాసార్లు యూదు ప్రజలందరినీ కాకుండా, కథన సందర్భంలో యూదయకు చెందిన యూదు అధికారులు లేదా యేసును వ్యతిరేకించిన వర్గాన్ని మరింత ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: ఆ తరువాత
  rationale: బహువచన సూచన గత సంఘటనలతో కథన సంబంధాన్ని చూపుతుంది; తెలుగులో సహజమైన కాలసూచక ప్రయోగం.
- source_word: περιεπάτει / περιπατεῖν
  choice: సంచరిస్తూ ఉన్నాడు / సంచరించడం
  rationale: ఇక్కడ క్రియ ఒక ప్రాంతంలో తిరుగుతూ కార్యకలాపాలు కొనసాగించడాన్ని సూచిస్తుంది. రెండు చోట్లా ఒకే తెలుగు మూలక్రియను వాడి గ్రీకు పునరుక్తిని నిలిపాం.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: గలిలయలో
  rationale: అర్థాన్ని విస్తరించకుండా సాధారణ స్థానార్థక అనువాదం.
- source_word: οὐ γὰρ ἤθελεν
  choice: ఆయనకు ఇష్టం లేదు
  rationale: అసమర్థతను కాక, సంకల్పం లేదా అభీష్టాన్ని సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: యూదయలో సంచరించకపోవడానికి గల కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: ἐζήτουν
  choice: ప్రయత్నిస్తూ ఉన్నారు
  rationale: తదనంతర ఉద్దేశార్థక క్రియతో కలిసి కొనసాగుతున్న శత్రుభావ ప్రయత్నాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: మూలంలోని సాధారణ సమూహపదాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ఈ సందర్భంలోని పరిమిత కథన సూచనను పాదసూచికలో వివరిస్తుంది.
- source_word: ἀποκτεῖναι
  choice: చంపడానికి
  rationale: ఉద్దేశాన్ని నేరుగా, స్పష్టంగా తెలిపే సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι అనే పదబంధం ఎవరిని సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘యూదులు’ అని ఉంచి, సందర్భార్థాన్ని పాదసూచికలో స్పష్టం చేయడం
  alternative: ‘యూదయవారు’ లేదా ‘యూదు నాయకులు’
  rationale: మూలపదంలోని విస్తృత రూపాన్ని చెరపకుండా ఉంచుతుంది; అదే సమయంలో ఇది యూదు ప్రజలందరినీ విచక్షణ లేకుండా సూచిస్తుందనే తప్పుదోహదాన్ని నివారిస్తుంది. సందర్భంలో ముఖ్యంగా యూదయకు చెందిన వ్యతిరేక వర్గం లేదా అధికారులను సూచించే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. περιπατέω పునరుక్తిని ‘సంచరించు’తో నిలిపి, గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్యను ‘సంచరిస్తూ ఉన్నాడు,’ ‘ప్రయత్నిస్తూ ఉన్నారు’ రూపాలతో వ్యక్తం చేశాం.
