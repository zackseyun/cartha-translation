revisions:
- from: ఆ తరువాత యేసు గలిలయలో సంచరిస్తూ ఉన్నాడు. యూదయలో సంచరించడం ఆయనకు ఇష్టం లేదు; ఎందుకంటే యూదులు[a] ఆయనను చంపడానికి ప్రయత్నిస్తూ ఉన్నారు.
  to: ఈ సంగతుల తరువాత యేసు గలిలయలో సంచరిస్తూ ఉన్నాడు. యూదులు[a] ఆయనను చంపడానికి ప్రయత్నిస్తూ ఉండటం వల్ల, యూదయలో సంచరించాలని ఆయన కోరలేదు.
