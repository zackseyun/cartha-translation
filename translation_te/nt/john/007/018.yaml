id: JHN.7.18
reference: John 7:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: te
  text: తనంతట తాను[a] మాట్లాడేవాడు తన సొంత మహిమను వెదకుతాడు. అయితే తనను పంపినవాని మహిమను వెదికేవాడు—అతడే సత్యవంతుడు[b]; అతనిలో అధర్మం[c] లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన నుంచే” లేదా “తన సొంత అధికారంతో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “నిజమైనవాడు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “అన్యాయం” లేదా “తప్పు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: తనంతట తాను
  rationale: ఈ పదబంధం అక్షరార్థంగా ‘తన నుంచే’ అని ఉన్నా, పంపినవాని తరఫున మాట్లాడటానికి వ్యతిరేకంగా స్వయంగా మాట్లాడటాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; అధికార మూలాన్ని మాత్రమే అని అతిగా నిర్ధారించదు.
- source_word: λαλῶν
  choice: మాట్లాడేవాడు
  rationale: వర్తమాన కృదంతాన్ని సాధారణ స్వభావాన్ని తెలిపే సహజ తెలుగు రూపంలో అందిస్తుంది.
- source_word: δόξαν
  choice: మహిమను
  rationale: యోహాను రచనలోని దైవిక గౌరవం, ప్రతిష్ఠ అనే విస్తృత భావాన్నీ, స్థిరమైన బైబిలు పదప్రయోగాన్నీ కాపాడుతుంది.
- source_word: τὴν ἰδίαν
  choice: తన సొంత
  rationale: తనకు చెందినదనే భావాన్ని స్పష్టంగా చూపి, పంపినవాని మహిమతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ζητεῖ
  choice: వెదకుతాడు
  rationale: రెండు ఉపవాక్యాల్లోనూ పునరావృతమైన క్రియను ఒకే విధంగా ఉంచి, లక్ష్యంగా ఆశించడం అనే భావాన్ని కాపాడుతుంది.
- source_word: τοῦ πέμψαντος αὐτὸν
  choice: తనను పంపినవాని
  rationale: పంపిన వ్యక్తి క్రియాశీల పాత్రను సంక్షిప్తంగా, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: οὗτος
  choice: అతడే
  rationale: సాధారణ ‘అతడు’ కంటే గ్రీకు నిర్దేశక సర్వనామంలోని ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: ἀληθής
  choice: సత్యవంతుడు
  rationale: సందర్భంలో వక్త యొక్క విశ్వసనీయత, యథార్థత, నైతిక నిష్కపటతలను సూచించే సహజ తెలుగు పదం; ‘నిజమైనవాడు’ కూడా సాధ్యమని పాదసూచికలో ఉంచబడింది.
- source_word: ἀδικία
  choice: అధర్మం
  rationale: కేవలం సామాజిక అన్యాయానికే పరిమితం కాకుండా, నైతిక తప్పు మరియు నీతివిరుద్ధత అనే పదంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: అతనిలో … లేదు
  rationale: గ్రీకు అస్తిత్వ నిర్మాణాన్నీ, వ్యక్తి అంతర్గత నైతిక స్వభావాన్ని తెలిపే భావాన్నీ సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ‘తనంతట తాను’ మాట్లాడటానికి, పంపినవాని మహిమను వెదకటానికి మధ్య వ్యత్యాసం
  choice: స్వయంగా ఉద్భవించిన, స్వమహిమను కోరే మాటకు మరియు పంపినవాని మహిమను లక్ష్యంగా పెట్టుకున్న మాటకు మధ్య వ్యత్యాసంగా అనువదించబడింది.
  alternative: ‘తన సొంత అధికారంతో’ అని అధికార మూలాన్ని స్పష్టంగా నిర్ధారించడం.
  rationale: తక్షణ సందర్భం బోధ యొక్క మూలం మరియు లక్ష్యం రెండింటినీ ప్రస్తావిస్తుంది. గ్రీకు పదబంధంలోని భావ విస్తృతిని ఒక సాంకేతిక సిద్ధాంత ప్రకటనగా కుదించకుండా అనువాదం నిలుపుతుంది.
- issue: ἀληθής యొక్క భావం
  choice: సత్యవంతుడు
  alternative: నిజమైనవాడు
  rationale: ఇక్కడ పంపినవాని మహిమను కోరే వ్యక్తి విశ్వసనీయత మరియు నిష్కపటత ప్రధానంగా కనిపిస్తాయి; అయినా యోహాను రచనలోని ‘నిజమైన’ అనే విస్తృత ప్రతిధ్వనిని పాదసూచికలో కాపాడాం.
- issue: ἀδικία యొక్క నైతిక పరిధి
  choice: అధర్మం
  alternative: అన్యాయం లేదా తప్పు
  rationale: వ్యక్తిలో నైతిక వక్రత లేదనే విస్తృత వాదనను ‘అధర్మం’ నిలుపుతుంది; దానిని కేవలం సామాజిక లేదా న్యాయపరమైన అన్యాయానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘అతడే’ ద్వారా οὗτος యొక్క ఉద్ఘాటన నిలుపబడింది. మూలంలోని రెండు ‘వెదకుట’ క్రియల సమాంతరతను అలాగే ఉంచాం; విరామచిహ్నాలు రెండో వ్యక్తిపై ఉన్న ఉద్ఘాటనను స్పష్టం చేస్తాయి.
