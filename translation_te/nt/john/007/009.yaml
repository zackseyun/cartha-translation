  text: ταῦτα ⸀δὲ εἰπὼν ⸀αὐτὸς ἔμεινεν ἐν τῇ Γαλιλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/009.yaml
  text: After saying these things, he himself remained in Galilee.
translation:
  language: te
  text: ఈ మాటలు చెప్పిన తరువాత, ఆయన తానే గలిలయలో ఉండిపోయాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ఈ మాటలు
  rationale: నపుంసక బహువచన నిర్దేశక సర్వనామం ముందుగా చెప్పిన విషయాలను సూచిస్తుంది; సందర్భంలో సహజమైన తెలుగుగా ‘ఈ మాటలు’ అని అనువదించాం.
- source_word: δὲ … εἰπὼν
  choice: చెప్పిన తరువాత
  rationale: δέ స్వల్ప కొనసాగింపును సూచిస్తుండగా, భూతకాల అసమాపక క్రియ εἰπών ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను తెలియజేస్తుంది; తెలుగులో కాలక్రమాన్ని సహజంగా వ్యక్తం చేయడానికి ఈ నిర్మాణాన్ని ఎంచుకున్నాం.
- source_word: αὐτὸς
  choice: ఆయన తానే
  rationale: గ్రీకులో స్పష్టంగా ఉంచిన సర్వనామం సందర్భంలో యేసు చేసిన పనిని ఆయన సహోదరుల చర్యతో భేదిస్తూ స్వల్ప ఉద్ఘాటన ఇస్తుంది; ‘తానే’ ఆ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἔμεινεν
  choice: ఉండిపోయాడు
  rationale: μένω ఇక్కడ ఒక ప్రదేశంలోనే కొనసాగి ఉండడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఉండిపోయాడు’ కథన సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: గలిలయలో
  rationale: ఇది సరళమైన స్థానవాచక పదబంధం; భౌగోళిక నామాన్ని సహజమైన తెలుగు విభక్తితో అందించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని αὐτός ఉద్ఘాటనను ‘తానే’ ద్వారా నిలిపి, అనవసర వ్యాఖ్యానాన్ని చేర్చలేదు.
