  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ; ἐραύνησον καὶ ἴδε ὅτι ⸂ἐκ τῆς Γαλιλαίας προφήτης⸃ οὐκ ⸀ἐγείρεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: te
  text: 'వారు అతనికి ఇలా జవాబిచ్చారు: “నువ్వు కూడా గలిలయవాడివా?[a] పరిశోధించి చూడు—గలిలయ నుండి ఏ ప్రవక్తా ఉద్భవించడు.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నువ్వు కూడా గలిలయవాడివి కావు కదా?” గ్రీకు ప్రశ్న ప్రతికూల సమాధానాన్ని ఆశించే విధంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “గలిలయ నుండి ఏ ప్రవక్తా లేపబడడు.” దేవుడే ప్రవక్తలను లేపుతాడనే సాధ్యమైన భావాన్ని ఈ అనువాదం నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν
  choice: వారు అతనికి ఇలా జవాబిచ్చారు
  rationale: గ్రీకులోని జత క్రియలు యోహాను వాడే సాధారణ కథన సూత్రం. తెలుగులో సహజంగా ఉండేందుకు ‘ఇలా జవాబిచ్చారు’ అని ఇచ్చి, ప్రత్యుత్తర భావాన్ని స్పష్టంగా నిలిపాం.
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: నువ్వు కూడా గలిలయ నుంచే వచ్చావా?
  rationale: μή వల్ల ప్రతికూల సమాధానాన్ని ఆశించే ఎగతాళి ధోరణి ఉంది. ‘కూడా’, ‘నుంచే’ అనే పదాలు ఆ వ్యంగ్య ఒత్తిడిని సహజ తెలుగులో సూచిస్తాయి; పూర్తి ప్రతికూల ప్రశ్నారూపాన్ని పాదటీపులో ఇచ్చాం.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: గలిలయ నుండి / గలిలయ నుంచే
  rationale: ప్రదేశ మూలాన్ని సూచించే ἐκకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἐραύνησον
  choice: పరిశోధించి
  rationale: ఆజ్ఞాపూర్వకంగా జాగ్రత్తగా విచారించమనే భావాన్ని ‘పరిశోధించు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἴδε
  choice: చూడు
  rationale: ‘పరిశోధించి చూడు’ అనే క్రమం గ్రీకు ఆజ్ఞల నేరుతనాన్ని, తెలుగులోని సహజ ప్రయోగాన్ని నిలుపుతుంది.
- source_word: προφήτης
  choice: ఏ ప్రవక్తా
  rationale: నిర్దేశక పదం లేని προφήτηςను ఒక ప్రత్యేక అంత్యకాల ప్రవక్తగా కాక, ప్రవక్తలలో ఎవరైనా అనే సాధారణ వాదనగా చూపుతుంది.
- source_word: οὐκ ἐγείρεται
  choice: ఉద్భవించడు
  rationale: ప్రవక్త ప్రత్యక్షమవడం లేదా వెలువడడం అనే భావాన్ని, ‘దేవుడు లేపడం’ అనే సాధ్యమైన కర్మణి సూక్ష్మార్థాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ణయించకుండా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: μήతో ఉన్న ప్రశ్నలో ప్రతికూల సమాధాన నిరీక్షణ
  choice: నువ్వు కూడా గలిలయ నుంచే వచ్చావా?
  alternative: నువ్వు కూడా గలిలయవాడివి కావు కదా?
  rationale: మాట్లాడేవారి తృణీకార ధోరణిని సహజ ప్రశ్నతో తెలిపి, గ్రీకు వ్యాకరణంలోని బలమైన ప్రతికూల నిరీక్షణను పాదటీపులో భద్రపరిచాం.
- issue: ἐγείρεταιలో కర్తరి/కర్మణి సూక్ష్మార్థం
  choice: ఉద్భవించడు
  alternative: లేపబడడు
  rationale: ఈ సందర్భంలో క్రియ ఒక ప్రవక్త వెలువడడాన్ని సూచించవచ్చు; అదే రూపం దేవుడు ప్రవక్తను లేపుతాడనే దైవ కర్మణి భావాన్నీ అనుమతించవచ్చు. ప్రధాన పాఠ్యం మొదటి భావాన్ని సహజంగా ఇస్తూ, రెండవదాన్ని పాదటీపులో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వాదనలోని కఠినమైన, తృణీకార స్వరాన్ని నిలిపేలా ‘నువ్వు’ వాడబడింది. భాష గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉంది. ప్రతి పాదటీపు సూచిక ప్రధాన పాఠ్యంలో సంబంధిత వాక్య భాగం వెంట ఉంచబడింది.
