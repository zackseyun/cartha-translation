review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rhetorical question, the imperative sequence, the indefinite ‘prophet,’ and the claim that no prophet arises from Galilee. However, ‘నువ్వు కూడా గలిలయ నుంచే వచ్చావా?’ shifts the Greek expression of regional origin/identity (‘are you from Galilee?’) toward the narrower idea of having come from Galilee. ‘గలిలయవాడివా?’ more directly represents the source while retaining natural Telugu.
  naturalness: The wording is generally modern and clear. ‘గలిలయవాడివా?’ is idiomatic in this hostile exchange. ‘పరిశోధించి చూడు’ is natural, though ‘వెదకి చూడు’ may be more conversational; the existing wording is fully acceptable for the register.
  terminology: ‘ప్రవక్త’ is correct and standard. ‘ఉద్భవించడు’ naturally conveys emergence/arising; the footnote appropriately records the possible passive/divine-agency nuance. The regional name ‘గలిలయ’ is standard.
  issues:
  - severity: medium
    issue: The main question renders ἐκ τῆς Γαλιλαίας εἶ as ‘గలిలయ నుంచే వచ్చావా?’
