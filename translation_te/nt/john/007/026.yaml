  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: te
  text: ఇదిగో, ఆయన బహిరంగంగా మాట్లాడుతున్నాడు; వారు ఆయనకు ఏమీ అనడం లేదు. ఈయనే మెస్సీయ[a] అని పాలకులు నిజంగానే తెలుసుకున్నారేమో?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδε
  choice: ఇదిగో
  rationale: మాట్లాడేవారు ఇతరుల దృష్టిని జరుగుతున్న దానిపైకి మళ్లించే ఉద్బోధక పదంగా సహజమైన తెలుగు రూపం.
- source_word: παρρησίᾳ
  choice: బహిరంగంగా
  rationale: ఈ సందర్భంలో ధైర్యం కంటే అందరి ఎదుట నిర్బంధం లేకుండా మాట్లాడుతున్న భావం ప్రధానమైనది.
- source_word: λαλεῖ
  choice: మాట్లాడుతున్నాడు
  rationale: జరుగుతున్న దృశ్యాన్ని సూచించే వర్తమాన క్రియాభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: వారు ఆయనతో ఏమీ అనడం లేదు
  rationale: αὐτῷలోని ‘ఆయనతో/ఆయనకు’ భావాన్ని నిలుపుతూ, ‘ఆయనకు వ్యతిరేకంగా’ అనే సందర్భార్థాన్ని పాఠ్యంలో అదనంగా చేర్చదు.
- source_word: μήποτε
  choice: తెలుసుకున్నారేమో?
  rationale: ఆశ్చర్యంతో కూడిన సందేహపూర్వక ఊహను తెలుగు ప్రశ్నార్థక రూపంలో సహజంగా వ్యక్తం చేస్తుంది; ఖచ్చిత నిరాకరణగా మార్చదు.
- source_word: ἀληθῶς
  choice: నిజంగానే
  rationale: ఊహకు ఆశ్చర్యం మరియు బలాన్ని జోడించే గ్రీకు క్రియావిశేషణ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἔγνωσαν
  choice: తెలుసుకున్నారు
  rationale: పాలకులు ఒక నిర్ణయానికి లేదా గుర్తింపుకు వచ్చారా అనే అఒరిస్ట్ భావాన్ని సందర్భానుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ ἄρχοντες
  choice: పాలకులు
  rationale: సందర్భంలోని అధికార నాయకులను సూచిస్తూ మూలపదపు పరిపాలనా భావానికి దగ్గరగా ఉంటుంది.
- source_word: ὅτι οὗτός ἐστιν ὁ χριστός
  choice: ఈయనే మెస్సీయ అని
  rationale: χριστός ఇక్కడ వ్యక్తినామంలా కాక యూదుల నిరీక్షణలోని అభిషిక్తుని బిరుదుగా వాడబడింది; ‘ఈయనే’ గుర్తింపు బలాన్ని సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: ὁ χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో χριστός మెస్సీయ బిరుదుగా పనిచేస్తోంది. ‘మెస్సీయ’ యూదుల మెస్సీయ నిరీక్షణను స్పష్టంగా ఉంచుతుంది; దానిని వ్యక్తినామంలా మార్చదు.
- issue: μήποτε ప్రశ్నలోని సందేహం
  choice: నిజంగానే తెలుసుకున్నారేమో?
  alternative: నిజంగా తెలుసుకున్నారా? / తెలుసుకోలేదు కదా?
  rationale: మూలంలోని ప్రశ్న ఆశ్చర్యంతో కూడిన సాధ్యతను లేవనెత్తుతుంది. అది పాలకులు తెలుసుకున్నారని నిర్ధారించదు, తెలుసుకోలేదని కూడా ముందుగానే తీర్మానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘ఇదిగో’ కొద్దిగా గ్రంథోచితమైనప్పటికీ ἴδε యొక్క దృష్టి ఆకర్షించే బలాన్ని సంక్షిప్తంగా నిలుపుతుంది. మూలంలోని సందేహం మరియు వ్యంగ్యసంభావ్యతను ‘-ఆరేమో?’ రూపం ద్వారా పరిష్కరించకుండా ఉంచాం.
