id: JHN.7.3
reference: John 7:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: te
  text: 'కాబట్టి ఆయన సహోదరులు ఆయనతో ఇలా అన్నారు: “ఇక్కడి నుంచి బయలుదేరి యూదయకు వెళ్లు, నువ్వు చేస్తున్న కార్యాలను నీ శిష్యులు కూడా చూసేలా[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చూస్తారు,” లేదా “గమనిస్తారు.” గ్రీకు క్రియ చూడటం, శ్రద్ధగా వీక్షించడం అనే భావాలను ఇవ్వగలదు; ఉద్దేశాన్ని తెలిపే ఈ వాక్యంలో ఉన్న భవిష్యత్ క్రియారూపాన్ని తెలుగులో కొద్దిగా భిన్న రీతుల్లో అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భంతో ఉన్న తార్కిక లేదా కథన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀδελφοὶ αὐτοῦ
  choice: ఆయన సహోదరులు
  rationale: గ్రీకు పదబంధం పుంలింగ బహువచనంలో ఉంది; ఈ సందర్భంలో యేసు కుటుంబంలోని పురుష సహోదరులను సూచిస్తుంది. ‘సహోదరులు’ మూలంలోని కుటుంబ సంబంధాన్ని విస్తరించకుండా నిలుపుతుంది.
- source_word: Μετάβηθι ἐντεῦθεν
  choice: ఇక్కడి నుంచి బయలుదేరు
  rationale: ప్రస్తుత స్థలాన్ని విడిచి వెళ్లమనే ప్రత్యక్ష ఆజ్ఞను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: యూదయకు వెళ్లు
  rationale: గమ్యస్థానానికి వెళ్లమనే సాధారణ ఆజ్ఞార్థక భావాన్ని సూటిగా నిలుపుతుంది.
- source_word: Ἰουδαίαν
  choice: యూదయ
  rationale: Ἰουδαία అనే ప్రాంతానికి ప్రామాణిక తెలుగు భౌగోళిక నామరూపం.
- source_word: ἵνα καὶ
  choice: కూడా చూసేలా
  rationale: ἵνα తెలిపే ఉద్దేశ భావాన్నీ, καὶ తెలిపే ‘కూడా’ భావాన్నీ సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: οἱ μαθηταί σου
  choice: నీ శిష్యులు
  rationale: యోహాను సువార్తలోని గురు–శిష్య సంబంధాన్ని ‘శిష్యులు’ ఖచ్చితంగా ప్రతిబింబిస్తుంది.
- source_word: θεωρήσουσιν
  choice: చూసేలా
  rationale: రూపరీత్యా భవిష్యత్ సూచనార్థక క్రియ అయినప్పటికీ, ἵνα ఉద్దేశ వాక్యంలో చూడటం లేదా వీక్షించటం అనే ఉద్దేశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచాం.
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: నువ్వు చేస్తున్న కార్యాలను
  rationale: σοῦ యొక్క స్వామ్య భావాన్ని సంబంధ వాక్యంలో సహజంగా వ్యక్తం చేస్తూ, యోహానులో ἔργα పదానికి ఉన్న అంశపరమైన ప్రాధాన్యాన్ని ‘కార్యాలు’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: ‘ఆయన సహోదరులు’ ఎవరిని సూచిస్తుంది?
  choice: కథనంలో మాట్లాడుతున్న యేసు కుటుంబంలోని పురుష సహోదరులు
  alternative: విస్తృత అర్థంలో బంధువులు లేదా సన్నిహిత కుటుంబీకులు
  rationale: యోహాను 7:3–5 యొక్క సమీప సందర్భం వారిని యేసు సహోదరులుగా సూటిగా పేర్కొంటుంది. వారి ఖచ్చిత జీవసంబంధంపై పాఠ్యం చెప్పినదానికంటే ఎక్కువ సిద్ధాంతపరమైన నిర్ణయాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన కథన శైలిని వాడాం. సంభాషణలో సహజమైన ఏకవచన ‘నువ్వు’ రూపాన్ని ఉంచి, ‘కార్యాలు,’ ‘శిష్యులు’ వంటి యోహాను సువార్తలో అంశపరంగా ముఖ్యమైన పదాలను నిలిపాం.
