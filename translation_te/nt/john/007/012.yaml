id: JHN.7.12
reference: John 7:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γογγυσμὸς ⸂περὶ αὐτοῦ ἦν πολὺς⸃ ἐν τοῖς ὄχλοις· οἱ μὲν ἔλεγον ὅτι Ἀγαθός ἐστιν, ἄλλοι ⸀δὲ ἔλεγον· Οὔ, ἀλλὰ πλανᾷ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: te
  text: జనసమూహాల్లో ఆయన గురించి చాలా గుసగుసలు వినిపించాయి.[a] కొందరు, “ఆయన మంచివాడు” అన్నారు. మరికొందరు, “కాదు, ఆయన జనాన్ని తప్పుదారి పట్టిస్తున్నాడు” అన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయన గురించి చాలా గొణుగుడు” లేదా “మెల్లని మాటలు.”
    reason: lexical_alternative
  - marker: b
    text: “తప్పుదారి పట్టిస్తున్నాడు” అనే మాటను “మోసం చేస్తున్నాడు” లేదా “దారి తప్పిస్తున్నాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: గుసగుసలు
  rationale: ఈ పదం బహిరంగ చర్చకన్నా మెల్లగా, లోలోపల జరిగే మాటలను సూచిస్తుంది. సందర్భంలోని విభిన్న అభిప్రాయాలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఫిర్యాదు అనే భావానికే పరిమితం చేయదు.
- source_word: περὶ αὐτοῦ
  choice: ఆయన గురించి
  rationale: మూలంలోని సాధారణ సంబంధార్థాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో నేరుగా అందిస్తుంది.
- source_word: πολύς
  choice: చాలా
  rationale: గుసగుసలు విస్తారంగా ఉన్నాయని తెలిపే పరిమాణార్థాన్ని సరళంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τοῖς ὄχλοις
  choice: జనసమూహాల్లో
  rationale: ὄχλοις అనే బహువచనాన్ని నిలుపుతూ, పండుగకు చేరిన వివిధ గుంపుల మధ్య మాటలు వ్యాపించాయని సూచిస్తుంది.
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: కొందరు ... మరికొందరు ...
  rationale: జనసమూహాల్లోని రెండు విరుద్ధ వర్గాలను సహజమైన తెలుగు నిర్మాణంలో స్పష్టంగా చూపిస్తుంది.
- source_word: Ἀγαθός ἐστιν
  choice: ఆయన మంచివాడు
  rationale: వ్యక్తి స్వభావం గురించి చెప్పేటప్పుడు తెలుగు నుడికారంలో ‘మంచివాడు’ సహజం. ఇది మూలంలోని ‘మంచి’ అనే అర్థాన్ని వ్యక్తం చేస్తుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- source_word: Οὔ, ἀλλὰ
  choice: కాదు,
  rationale: ప్రత్యక్ష నిరాకరణతో పాటు దానికి విరుద్ధమైన అభిప్రాయానికి మార్పును తెలుగు సందర్భంలో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πλανᾷ
  choice: తప్పుదారి పట్టిస్తున్నాడు
  rationale: πλανάωలోని దారి తప్పించడం లేదా మోసగించడం అనే అర్థవ్యాప్తిని ఉద్దేశపూర్వక మోసమని తప్పనిసరిగా నిర్ణయించకుండా అందిస్తుంది.
- source_word: τὸν ὄχλον
  choice: జనాన్ని
  rationale: ఇక్కడి ఏకవచన సమూహార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసు గురించి జనసమూహాల పరస్పర విరుద్ధ అంచనాలు
  choice: సానుకూలమైన ‘ఆయన మంచివాడు’ అనే మాటను, ప్రతికూలమైన ‘జనాన్ని తప్పుదారి పట్టిస్తున్నాడు’ అనే మాటను రెండింటినీ తటస్థ ప్రత్యక్ష వాక్యాలుగా ఉంచడం
  alternative: వాటిలో ఒక అభిప్రాయాన్ని కథకుడి తీర్పుగా లేదా సిద్ధాంతపరమైన నిర్ధారణగా స్పష్టీకరించడం
  rationale: మూలవాక్యం ప్రజల్లోని విభేదాన్ని నివేదిస్తుంది; ఈ రెండు మాటల్లో దేనినీ ఇక్కడ కథకుడు స్వయంగా సమర్థించడం లేదు. అందువల్ల మూలంలోని ఉద్వేగం, అస్పష్టత అలాగే నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని వాడాం. ‘ఆయన’ ద్వారా యేసును గౌరవంగా సూచించాం. ప్రతి పాదటిప్పణి గుర్తును ప్రధాన పాఠ్యంలో ఉంచాం.
