id: JHN.7.37
reference: John 7:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: te
  text: 'పండుగలోని ఆ గొప్ప చివరి రోజున యేసు నిలబడి బిగ్గరగా ఇలా అన్నాడు: “ఎవరైనా దాహంతో ఉంటే, నా వద్దకు రావాలి, తాగాలి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ
  choice: పండుగ చివరి రోజున
  rationale: ἐν దత్తివుతో కాలాన్ని సూచిస్తుంది; δέ స్వల్ప అనుసంధాన పదం. తెలుగు కథనంలో ప్రత్యేక అనుసంధాన పదాన్ని చేర్చకుండానే సహజంగా భావం వ్యక్తమవుతుంది.
- source_word: τῇ μεγάλῃ τῆς ἑορτῆς
  choice: ఆ గొప్ప రోజున
  rationale: μέγας ఆ రోజును విశేషంగా గుర్తిస్తుంది. ‘గొప్ప రోజు’ అనే రూపం దాని ప్రాధాన్యాన్ని తగ్గించకుండా నిలుపుతుంది.
- source_word: εἱστήκει
  choice: నిలబడి
  rationale: ఈ రూపం యేసు నిలుచున్న భంగిమను సూచిస్తుంది; తదుపరి ప్రధాన క్రియతో కలిపి ‘నిలబడి ... అన్నాడు’ అనడం సహజమైన తెలుగు కథనశైలి.
- source_word: ἔκραξεν λέγων
  choice: బిగ్గరగా ఇలా అన్నాడు
  rationale: κράζω బహిరంగంగా గట్టిగా పలకడాన్ని సూచిస్తుంది. ‘బిగ్గరగా’ దాని శబ్దబలాన్ని నిలుపుతుంది; λέγωνను ‘ఇలా’తో సహజంగా వ్యక్తం చేశాం.
- source_word: Ἐάν τις διψᾷ
  choice: ఎవరైనా దాహంతో ఉంటే
  rationale: τις అనిర్దిష్టమైన, సాధారణ ఏకవచన వ్యక్తిని సూచిస్తుంది; διψᾷలోని దాహపు రూపకాన్ని వివరించి పరిష్కరించకుండా యథాతథంగా ఉంచుతుంది.
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: అతడు నా దగ్గరికి వచ్చి తాగాలి
  rationale: రెండు వర్తమాన ఆజ్ఞార్థక క్రియల ఆహ్వానాత్మక-ఆజ్ఞాత్మక బలాన్ని ‘వచ్చి తాగాలి’ సహజ తెలుగులో నిలుపుతుంది. ‘అతడు’ గ్రీకు సాధారణ ఏకవచన నిర్మాణాన్ని ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: దాహం మరియు తాగడం అనే రూపకాల భావం
  choice: ‘దాహంతో ఉంటే’, ‘తాగాలి’ అని రూపకాలను నేరుగా నిలుపడం
  alternative: విశ్వసించడం, జీవాన్ని పొందడం లేదా ఆత్మను స్వీకరించడం అని వివరణాత్మకంగా అనువదించడం
  rationale: ఈ వాక్యం స్వయంగా రూపకాలతో ఆహ్వానిస్తుంది; వాటి అర్థాన్ని ప్రధాన పాఠ్యంలో నిర్దిష్ట సిద్ధాంత వివరణగా మార్చడం యోహాను సందర్భంలోని ఉద్దేశపూర్వక విస్తృతిని తగ్గిస్తుంది.
- issue: τις తరువాత సాధారణ ఏకవచన సూచన
  choice: అతడు
  alternative: ఆ వ్యక్తి / వారు
  rationale: గ్రీకు నిర్మాణం వ్యాకరణపరంగా ఏకవచనమూ సాధారణ ప్రయోగమూ. తెలుగులో ‘అతడు’ ఆ ఏకవచన నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది; ఇది ఆహ్వానాన్ని పురుషులకు మాత్రమే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. మూలంలోని బహిరంగ పిలుపు తీవ్రతను ‘బిగ్గరగా’తో, రూపకాల తెరవుదనాన్ని ‘దాహం/తాగడం’తో నిలిపాం.
