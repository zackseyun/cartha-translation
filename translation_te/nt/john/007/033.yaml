id: JHN.7.33
reference: John 7:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: te
  text: 'కాబట్టి యేసు ఇలా అన్నాడు: “నేను ఇంకా కొద్దికాలం మీతో ఉంటాను; నన్ను పంపినవాని[a] వద్దకు వెళ్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యోహాను సువార్త విస్తృత సందర్భంలో “నన్ను పంపినవాడు” అంటే తండ్రి.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: అందుచేత
  rationale: ముందటి సంభాషణకు ఈ మాటలను తార్కికంగానూ కథనపరంగానూ అనుసంధానిస్తుంది.
- source_word: Ἔτι χρόνον μικρόν
  choice: ఇంక కొంతకాలం
  rationale: ἔτι లోని ‘ఇంకా’ అనే భావాన్నీ, χρόνον μικρόν లోని స్వల్ప వ్యవధినీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: మీతో ఉంటాను
  rationale: గ్రీకు వర్తమాన రూపం సమీప భవిష్యత్తు వరకూ కొనసాగనున్న సన్నిధిని సూచిస్తోంది; తెలుగులో సందర్భానుగుణంగా ‘ఉంటాను’ సహజంగా ఉంది.
- source_word: καὶ ὑπάγω
  choice: ఆ తరువాత ... వెళ్తాను
  rationale: καί మూలంగా ‘మరియు’ అయినప్పటికీ, ముందున్న స్వల్పకాల సూచన కారణంగా తెలుగులో కాలక్రమ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ὑπάγω యొక్క సాధారణ ‘వెళ్లు’ భావాన్ని నిలుపుతుంది.
- source_word: πρὸς τὸν πέμψαντά με
  choice: నన్ను పంపినవాని దగ్గరికి
  rationale: కర్తృవాచక విశేషణ రూపాన్ని వ్యక్తిగా అనువదిస్తూ, మూలపాఠం ప్రత్యక్షంగా చెప్పని ‘తండ్రి’ అనే గుర్తింపును ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: ‘నన్ను పంపినవాడు’ ఎవరు అనే గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘నన్ను పంపినవాని’ అనే పరోక్ష వ్యక్తీకరణను నిలుపడం
  alternative: ‘నన్ను పంపిన తండ్రి దగ్గరికి’
  rationale: యోహాను సువార్త విస్తృత సందర్భంలో ఆయన తండ్రి అయినప్పటికీ, ఈ వాక్యంలోని గ్రీకు పాఠ్యం ఆ పేరును ప్రత్యక్షంగా పేర్కొనదు. కాబట్టి మూలంలోని వ్యక్తీకరణను నిలిపి, సందర్భ సమాచారాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని పరోక్ష దైవసంబంధ సూచనను అలాగే ఉంచింది.
