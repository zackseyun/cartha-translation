    issue: “ఆ తరువాత” adds an explicit temporal transition.
    rationale: The Greek reads καὶ ὑπάγω, ‘and I am going,’ without an explicit equivalent of ‘then/after that.’ The preceding phrase supplies an implied sequence, but the added connector should not be made explicit in the translation.
