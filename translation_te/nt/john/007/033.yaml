  naturalness: The revised wording uses idiomatic modern standard Telugu. “కొద్దికాలం” clearly reflects χρόνον μικρόν, and “వద్దకు” is natural for going to a person.
  terminology: “నన్ను పంపినవాని” appropriately preserves the Greek’s indirect substantive participle and does not insert “the Father” into the main text. The contextual identification remains suitable as a footnote.
  issues:
