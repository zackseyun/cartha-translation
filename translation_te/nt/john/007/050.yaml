id: JHN.7.50
reference: John 7:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει Νικόδημος πρὸς αὐτούς, ὁ ⸀ἐλθὼν πρὸς αὐτὸν ⸀πρότερον, εἷς ὢν ἐξ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
translation:
  language: te
  text: 'వారిలో ఒకడైన నికోదేము—ఇంతకుముందు ఆయన దగ్గరకు వచ్చినవాడు—వారితో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథన శైలిలో భూతకాల రూపం సహజంగా ఉండి అదే కథన కార్యాన్ని నిలుపుతుంది.
- source_word: Νικόδημος
  choice: నికోదేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: πρὸς αὐτούς
  choice: వారితో
  rationale: మాట్లాడే క్రియతో πρός మరియు ద్వితీయా విభక్తి సంబోధితులను సూచిస్తుంది; తెలుగులో ‘వారితో అన్నాడు’ సహజమైన ప్రయోగం.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: ఇంతకుముందు ఆయన దగ్గరకు వచ్చినవాడు
  rationale: ఆర్టికల్‌తో కూడిన కృదంత పదబంధం నికోదేమును గుర్తించే సమానాధికరణ వివరణ. πρότερον కాలపూర్వత్వాన్ని సూచిస్తుంది; αὐτόνను పేరుతో విప్పకుండా గౌరవ ఏకవచన సర్వనామంతో నిలిపాం.
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: వారిలో ఒకడైన
  rationale: ఈ కృదంత పదబంధం నికోదేము ఆ గుంపులో ఒకడని నేపథ్య గుర్తింపును ఇస్తుంది; కారణార్థాన్ని చేర్చకుండా దాని వివరణాత్మక శక్తిని నిలుపుతుంది.
theological_decisions:
- issue: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον లోని αὐτόν ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన వచనంలో ‘ఆయన’గా ఉంచి, సందర్భానుసారం యేసును సూచించేలా అనువదించాం.
  alternative: ‘యేసు దగ్గరకు’ అని పేరును స్పష్టంగా చేర్చడం.
  rationale: యోహాను 3:1–2 సందర్భం ఈ సర్వనామం యేసును సూచిస్తుందని తెలియజేస్తుంది. అయితే మూల వచనంలోని సర్వనామ రూపాన్ని పేరుతో భర్తీ చేయకుండా దాని పాఠ్య స్వరూపాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. గ్రీకు సమానాధికరణ నిర్మాణాన్ని తెలుగులో సులభంగా గ్రహించేందుకు డాష్‌ల మధ్య ఉంచాం; ‘వారిలో ఒకడైన’ను ముందుకు తేవడం ద్వారా భారమైన మధ్యప్రయోగాన్ని నివారించాం. తదుపరి వచనంలోని ప్రత్యక్ష ప్రశ్నకు పరిచయంగా చివర ద్విబిందువు వాడాం.
