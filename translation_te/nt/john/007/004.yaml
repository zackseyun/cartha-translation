revisions:
- from: ఎందుకంటే, బహిరంగంగా కనిపించాలని కోరుకునే ఎవరూ ఏదీ రహస్యంగా చేయరు. నీవు ఇవి చేస్తుంటే, లోకానికి నిన్ను నీవు కనబరచుకో.
  to: ఎందుకంటే, బహిరంగంగా కనిపించాలని కోరుకునే ఎవరూ ఏదీ రహస్యంగా చేయరు. నీవు ఇవి చేస్తే, లోకానికి నిన్ను నీవు వెల్లడించు.
  rationale: The revision retains every substantive element of the source and the draft while making the imperative idiomatic and removing an unnecessary progressive nuance from the conditional. ‘బహిరంగంగా కనిపించాలని’ and ‘లోకానికి’ are retained because they preserve the source’s public-visibility contrast and Johannine wording.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:38:40Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the explanatory γάρ, the general negation ('no one ... anything'), secrecy versus public visibility, the condition, and κόσμος as 'లోకం.' The progressive 'చేస్తుంటే' is possible but is more specific than the simple present ποιεῖς; a simple conditional is closer.
  naturalness: The opening sentence is natural modern Telugu. The final expression 'నిన్ను నీవు కనబరచుకో' is awkward because the reflexive object and -ుకో construction are unnecessarily redundant in this imperative. 'నిన్ను నీవు వెల్లడించు' is clearer and idiomatic while retaining the direct imperative.
  terminology: '''బహిరంగంగా కనిపించాలని'' suitably renders the contextual sense of ἐν παρρησίᾳ εἶναι: public visibility rather than bold speech. ''లోకానికి'' appropriately retains Johannine κόσμος. No footnote is required in Telugu for this rendering.'
  issues:
  - severity: medium
    issue: Awkward rendering of φανέρωσον σεαυτόν
    rationale: ‘నిన్ను నీవు కనబరచుకో’ is structurally and stylistically cumbersome in modern standard Telugu. A direct transitive imperative better represents the Greek aorist imperative, ‘show/reveal yourself.’
  - severity: low
    issue: Progressive conditional ‘చేస్తుంటే’
    rationale: The Greek present ποιεῖς does not require progressive aspect. ‘చేస్తే’ preserves the unmarked present conditional and is more concise.
  revised_text: ఎందుకంటే, బహిరంగంగా కనిపించాలని కోరుకునే ఎవరూ ఏదీ రహస్యంగా చేయరు. నీవు ఇవి చేస్తే, లోకానికి నిన్ను నీవు వెల్లడించు.
  revised_footnotes: []
  revision_rationale: The revision retains every substantive element of the source and the draft while making the imperative idiomatic and removing an unnecessary progressive nuance from the conditional. ‘బహిరంగంగా కనిపించాలని’ and ‘లోకానికి’ are retained because they preserve the source’s public-visibility contrast and Johannine wording.
