id: JHN.7.4
reference: John 7:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: te
  text: ఎందుకంటే, బహిరంగంగా కనిపించాలని కోరుకునే ఎవరూ ఏదీ రహస్యంగా చేయరు. నీవు ఇవి చేస్తే, లోకానికి నిన్ను నీవు వెల్లడించు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: ఎందుకంటే ... ఎవరూ
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’ సహజంగా తెలియజేస్తుంది; οὐδεὶς సాధారణ నిరాకరణగా ‘ఎవరూ’ అని అనువదించబడింది.
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: ఏదీ రహస్యంగా చేయరు
  rationale: τι అనే అనిర్దిష్ట కర్మను నిరాకరణ వాక్యంలో ‘ఏదీ’గా, ἐν κρυπτῷను సహజమైన ‘రహస్యంగా’గా అందిస్తుంది.
- source_word: ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι
  choice: బహిరంగంగా కనిపించాలని కోరుకునే
  rationale: ఇక్కడ παρρησία మాటలో ధైర్యం కంటే బహిరంగత లేదా ప్రజల దృష్టిలో ఉండడాన్ని సూచిస్తుంది. αὐτός ఇచ్చే కర్తృ ఉద్ఘాటన తెలుగులో వాక్య నిర్మాణం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: εἰ ταῦτα ποιεῖς
  choice: నీవు ఇవి చేస్తుంటే
  rationale: సందర్భంలో జరుగుతున్న కార్యాలను ఉద్దేశించిన షరతును ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘చేస్తే’ కూడా సాధ్యమే.
- source_word: φανέρωσον σεαυτὸν
  choice: నిన్ను నీవు కనబరచుకో
  rationale: φανερόω యొక్క ప్రత్యక్ష, నిర్ణాయక ఆజ్ఞను మరియు σεαυτόν యొక్క ఆత్మనిర్దేశాన్ని నిలుపుతుంది.
- source_word: τῷ κόσμῳ
  choice: లోకానికి
  rationale: తక్షణ సందర్భంలో ప్రజల ముందని భావం ఉన్నప్పటికీ, యోహాను రచనలో κόσμοςకు ఉన్న పదబంధ, సాహిత్య ప్రతిధ్వనిని ‘లోకం’ కాపాడుతుంది.
theological_decisions:
- issue: యోహాను సందర్భంలో κόσμος అర్థం
  choice: లోకానికి
  alternative: ప్రజల ముందుకు / ప్రజలకు
  rationale: సందర్భం బహిరంగ దర్శనాన్ని సూచించినా, ‘లోకం’ అనే అనువాదం యోహాను వాడుకలోని విస్తృత సాహిత్య, ధార్మిక ప్రతిధ్వనిని ముందుగానే పరిమితం చేయకుండా కాపాడుతుంది.
- issue: ἐν παρρησίᾳ εἶναι యొక్క భావం
  choice: బహిరంగంగా కనిపించడం
  alternative: బహిరంగంగా తెలియబడడం / బహిరంగంగా ఉండడం
  rationale: ఈ సందర్భంలో ప్రధాన వ్యత్యాసం రహస్య కార్యాలకు, ప్రజల దృష్టిలో ఉండడానికి మధ్య ఉంది. అనువాదం ఆ దృశ్యమానతను స్పష్టపరుస్తూ, ప్రజాదరణ లేదా ఖ్యాతి అనే అదనపు భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. మొదటి వాక్యంలోని సాధారణ సూత్రానికి తెలుగులో సహజమైన బహువచన గౌరవ/సాధారణ క్రియారూపం ‘చేయరు’ వాడబడింది. మూలంలో ప్రత్యేక పాఠాంతర లేదా తప్పనిసరి వివరణాత్మక పాదసూచిక అవసరం కనిపించనందున పాదసూచికలు చేర్చలేదు.
