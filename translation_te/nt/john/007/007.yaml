revisions:
- from: లోకం మిమ్మల్ని ద్వేషించలేదు[a]; కానీ నన్ను ద్వేషిస్తుంది. ఎందుకంటే దాని క్రియలు చెడ్డవని నేను దాని గురించి సాక్ష్యమిస్తున్నాను[b].
  to: లోకం మిమ్మల్ని ద్వేషించలేకపోతుంది[a]; కానీ అది నన్ను ద్వేషిస్తుంది. ఎందుకంటే దాని పనులు దుష్టమైనవని నేను దాని గురించి సాక్ష్యం ఇస్తున్నాను[b].
  rationale: The main correction restores the Greek present expression of inability. The remaining revisions improve modern Telugu idiom while retaining the repeated 'hate,' the impersonal reference to the world, and the moral sense of its works. Footnote a supplies a literal alternative for the ability expression; footnote b retains the alternate testimony wording.
