id: JHN.7.7
reference: John 7:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: te
  text: లోకం మిమ్మల్ని ద్వేషించలేకపోతుంది[a]; కానీ అది నన్ను ద్వేషిస్తుంది. ఎందుకంటే దాని పనులు దుష్టమైనవని నేను దాని గురించి సాక్ష్యం ఇస్తున్నాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లోకం మిమ్మల్ని ద్వేషించలేదు కాదు; ద్వేషించలేదు” కాదు; “లోకం మిమ్మల్ని ద్వేషించలేదు” కాదు; అక్షరార్థంగా, “లోకం మిమ్మల్ని ద్వేషించడానికి సమర్థం కాదు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నేను దాని గురించి సాక్ష్యమిస్తున్నాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δύναται
  choice: ద్వేషించలేదు
  rationale: తెలుగులో సామర్థ్యలేమిని సహజంగా వ్యక్తపరుస్తూ, ‘ద్వేషించగలదు కాదు’ అనే కృత్రిమ నిర్మాణాన్ని నివారిస్తుంది.
- source_word: ὁ κόσμος
  choice: లోకం
  rationale: యోహాను రచనలోని బహుళార్థకతను నిలుపుతుంది; దేవునికి విరోధంగా ఉన్న మానవ వ్యవస్థ అని ప్రధాన పాఠ్యంలో విస్తరించి చెప్పదు.
- source_word: μισεῖν / μισεῖ
  choice: ద్వేషించలేదు / ద్వేషిస్తుంది
  rationale: ఒకే గ్రీకు క్రియ పునరావృతిని, అలాగే ‘మీరు—నేను’ అనే తీవ్రమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: μαρτυρῶ
  choice: సాక్ష్యమిస్తున్నాను
  rationale: μαρτυρέω లోని సాక్ష్యమిచ్చే భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: περὶ αὐτοῦ
  choice: దాని గురించి
  rationale: సూచిత పదం ‘లోకం’; దానిని వ్యక్తిగా అతిగా నిర్దిష్టం చేయకుండా సహజ తెలుగు సర్వనామంతో చూపుతుంది.
- source_word: τὰ ἔργα αὐτοῦ
  choice: దాని క్రియలు
  rationale: ἔργα యొక్క నైతిక, యోహానీయ ప్రతిధ్వనిని నిలుపుతూ ‘అది చేసేవి’ అనే వివరణాత్మక రూపాన్ని నివారిస్తుంది.
- source_word: πονηρά
  choice: చెడ్డవి
  rationale: కేవలం నాసిరకం అనే భావం కాకుండా నైతిక దుష్టత్వాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యోహాను సందర్భంలో ‘లోకం’ అనే పదం యొక్క సూచన మరియు ధార్మిక బలం
  choice: వ్యాఖ్యాత్మక విస్తరణ లేకుండా ‘లోకం’ అని ఉంచడం
  alternative: దేవునికి విరోధంగా ఉన్న మానవ వ్యవస్థ / తిరుగుబాటు చేసిన మానవాళి
  rationale: κόσμος అనే పదానికి యోహాను రచనలో పొరలుగల అర్థం ఉంది. యేసు దాని చెడ్డ క్రియలను బయటపెడుతున్నందున అది ఆయనను ద్వేషిస్తుందని వాక్యం చెబుతుంది; ప్రధాన పాఠ్యం ఆ ఉద్రిక్తతను సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం. ‘లోకం’ మరియు ‘క్రియలు’ ద్వారా యోహాను పదప్రయోగంలోని ధార్మిక ప్రతిధ్వనిని నిలుపుకుంది.
