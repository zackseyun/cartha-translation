source:
  edition: SBLGNT
  text: ⸂Ἐκ τοῦ ὄχλου οὖν⸃ ἀκούσαντες ⸂τῶν λόγων τούτων⸃ ⸀ἔλεγον· Οὗτός ἐστιν ἀληθῶς ὁ προφήτης·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: te
  text: కాబట్టి, జనసమూహంలోని కొందరు ఈ మాటలు విని, “ఈయనే నిజంగా ఆ ప్రవక్త[a]” అని చెప్పసాగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆ ప్రవక్త’ అనేది మోషే వంటి ప్రవక్తగా వస్తాడని ఎదురు చూసిన వ్యక్తిని సూచించే అవకాశం ఉంది (ద్వితీయోపదేశకాండము 18:15 చూడండి); అయితే కొందరు దీనిని అటువంటి నిర్దిష్ట నిరీక్షణతో కాక, మరింత సాధారణ అర్థంలో తీసుకుంటారు.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: జనసమూహంలో కొందరు
  rationale: మాట్లాడింది జనసమూహమంతా కాదని, అందులోని కొందరని గ్రీకు పదబంధంలోని విభాగార్థం సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భం నుంచి ఉద్భవించిన ప్రతిస్పందనను సూచించే అనుసంధాన భావాన్ని నిలుపుతుంది.
- source_word: ἀκούσαντες τῶν λόγων τούτων
  choice: ఈ మాటలు విని
  rationale: ఏకకాలిక లేదా పూర్వకాలిక క్రియాభావాన్ని సహజమైన తెలుగు కృదంత నిర్మాణంతో తెలియజేస్తూ, యేసు పలికిన సమీప పూర్వపు మాటలను సూచిస్తుంది.
- source_word: ἔλεγον
  choice: అని అంటున్నారు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న లేదా పలువురు పునరావృతంగా పలికిన భావాన్ని తెలుగు వర్తమాన-నిరంతర కథన రూపం సహజంగా ప్రతిబింబిస్తుంది.
- source_word: Οὗτός ἐστιν
  choice: ఈయనే
  rationale: యేసువైపు స్పష్టంగా చూపే నిర్దేశక భావాన్నీ, గుర్తింపుపై ఉన్న ఉద్ఘాటననూ సహజంగా అందిస్తుంది.
- source_word: ἀληθῶς
  choice: నిజంగా
  rationale: ఆ వాదన నిజమనే దృఢతను ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ προφήτης
  choice: ఆ ప్రవక్త
  rationale: నిర్దిష్టంగా ఎదురుచూసిన ప్రవక్తను సూచించే గ్రీకు నిర్దేశక ఉపపద భావాన్ని తెలుగులో ‘ఆ’ ద్వారా నిలుపుతూ, అది సాధారణ ప్రవక్త అనే భావంతో కలిసిపోకుండా చేస్తుంది.
theological_decisions:
- issue: ‘ఆ ప్రవక్త’ సూచించే వ్యక్తి ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘ఆ ప్రవక్త’ అని బిరుదుసదృశంగా అనువదించి, మెస్సీయతో నేరుగా సమానం చేయలేదు.
  alternative: దీనిని సాధారణంగా ‘ఒక ప్రవక్త’గా తీసుకోవడం, లేదా ‘మెస్సీయ’ అని స్పష్టంగా గుర్తించడం.
  rationale: యోహాను సందర్భంలో ఇది ద్వితీయోపదేశకాండము 18:15లో మోషే వంటి ప్రవక్త కోసం ఉన్న నిరీక్షణను సూచించే అవకాశం ఉంది. అయితే ఈ వచనం ఆ బిరుదును స్వయంగా నిర్వచించదు; అందువల్ల మూలపాఠ్యంలోని వేదాంతపరమైన ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన వాక్యశైలితో రూపొందించబడింది. ‘ఈయనే’ ద్వారా ప్రత్యక్ష గుర్తింపు ఉద్ఘాటించబడింది; ‘ఆ ప్రవక్త’ ద్వారా నిర్దిష్ట నిరీక్షణతో కూడిన, కానీ పూర్తిగా నిర్వచించని బిరుదుభావం నిలుపబడింది.
