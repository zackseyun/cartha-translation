id: JHN.7.38
reference: John 7:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: te
  text: నన్ను విశ్వసించేవాని అంతరంగం నుండి[a][b], లేఖనం చెప్పినట్లుగా, జీవజల నదులు ప్రవహిస్తాయి.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతనిలోనుండి’ అని కూడా అనువదించవచ్చు. ఇక్కడ ‘అతని’ అనేది విశ్వసించే వ్యక్తిని కాక మెస్సీయను సూచిస్తుందని కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: గ్రీకు పదానికి అక్షరార్థం ‘కడుపు’ లేదా ‘గర్భం’; ఇక్కడ అది వ్యక్తి అంతరంగాన్ని రూపకంగా సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: నన్ను విశ్వసించేవాని
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న వర్తమాన కృదంతం విశ్వసించే వ్యక్తిని లక్షణాత్మకంగా సూచిస్తుంది. తెలుగు సంబంధరూపం ఏకవచన భావాన్నీ, విశ్వాసం వైపు వ్యక్తిగత నమ్మకాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: లేఖనం చెప్పినట్లుగా
  rationale: ఇది లేఖనాధారాన్ని పరిచయం చేస్తుంది. ఏకవచన ἡ γραφήను ‘లేఖనం’గా, aorist εἶπενను సహజమైన భూతకాల రూపమైన ‘చెప్పినట్లుగా’గా అనువదించాం.
- source_word: ποταμοὶ
  choice: నదులు
  rationale: చిన్న ప్రవాహాలకన్నా నదులను సూచించే పదం; సమృద్ధి చిత్రణను నిలుపుతుంది.
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: వాని అంతరంగం నుండి
  rationale: κοιλία అక్షరార్థంగా ‘కడుపు’ లేదా ‘గర్భం’ అయినప్పటికీ, ఇక్కడ వ్యక్తి అంతరంగ కేంద్రాన్ని రూపకంగా సూచిస్తుంది. ‘అంతరంగం’ ఆధునిక తెలుగులో శరీరావయవ భావాన్ని అనవసరంగా ముందుకు తేవకుండా రూపకాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ῥεύσουσιν
  choice: ప్రవహిస్తాయి
  rationale: భవిష్యత్ క్రియారూపంలోని సాధారణ ప్రవాహ భావాన్ని అదనపు తీవ్రత చేర్చకుండా తెలుపుతుంది.
- source_word: ὕδατος ζῶντος
  choice: జీవజల
  rationale: యోహాను సువార్తలోని స్థిరమైన రూపకాన్నీ, జీవమిచ్చే నీరు మరియు ప్రవహించే నీరు అనే భావసామర్థ్యాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: αὐτοῦ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: విశ్వసించే వ్యక్తిని సూచించేలా ‘వాని అంతరంగం నుండి’
  alternative: మెస్సీయ/యేసును సూచిస్తూ, జీవజల నదులు ఆయన నుండి ప్రవహిస్తాయని గ్రహించడం
  rationale: వ్యాకరణపరంగా సమీప పూర్వపదం ‘విశ్వసించేవాడు’; తరువాతి 7:39లో విశ్వాసులు ఆత్మను పొందడం కూడా ఈ పఠనానికి అనుగుణం. అయినప్పటికీ మెస్సీయను సూచించే పఠనానికి ఉన్న సంప్రదాయ ఆధారాన్ని పాదసూచికలో నిలిపాం.
- issue: κοιλία యొక్క రూపకార్థం
  choice: అంతరంగం
  alternative: కడుపు; గర్భం; అతనిలోనుండి
  rationale: అక్షరార్థ శరీరపదాన్ని ప్రధాన పాఠ్యంలో వాడితే ఆధునిక పాఠకునికి తప్పుదారి పట్టించే అవకాశం ఉంది. ‘అంతరంగం’ వ్యక్తి లోపలి కేంద్రం అనే సందర్భార్థాన్ని అందిస్తుంది; అక్షరార్థాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు సులభమైన శైలి. ‘లేఖనం’ బైబిలు సందర్భంలోని అధికారిక Scripture భావాన్ని నిలుపుతుంది. వాక్యారంభం ముందు వచనం నుండి కొనసాగుతున్న ప్రత్యక్ష ప్రసంగమని సూచిస్తూ ముగింపు ఉద్ధరణ గుర్తు ఉంచబడింది.
