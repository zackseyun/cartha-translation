source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ἀδελφοὶ αὐτοῦ ἐπίστευον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/005.yaml
  text: For not even his brothers believed in him[a].
translation:
  language: te
  text: ఎందుకంటే ఆయన సోదరులు కూడా ఆయనను విశ్వసించలేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎందుకంటే ఆయన సోదరులు కూడా ఆయనను విశ్వసిస్తూ ఉండలేదు.’ గ్రీకులోని అసంపూర్ణ భూతకాల క్రియను సాధారణ గత చర్యగా (‘విశ్వసించలేదు’) లేదా గతంలో కొనసాగిన స్థితిగా (‘విశ్వసిస్తూ ఉండలేదు’) అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: కూడా ... లేదు
  rationale: ఈ సందర్భంలో οὐδὲ ఆశ్చర్యకరమైన లేదా ఊహించని వర్గాన్ని—ఆయన సోదరులను—బలంగా చేర్చి ‘వారు కూడా కాదు’ అనే భావాన్ని ఇస్తుంది; తెలుగులో ‘కూడా ... లేదు’ సహజంగా ఆ ఉద్ఘాటనను తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను γὰρ అందిస్తుంది; ‘ఎందుకంటే’ ఆ అనుసంధానాన్ని ఆధునిక తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ఆయన సోదరులు
  rationale: ἀδελφοί పుంలింగ బహువచనం; కథన సందర్భంలో యేసు పురుష సోదరులు లేదా పురుష బంధువులను సూచిస్తుంది. నిర్దిష్ట బంధుత్వ పరిధిని అనవసరంగా తీర్మానించకుండా ‘సోదరులు’ మూలంలోని అర్థవ్యాప్తిని కాపాడుతుంది.
- source_word: ἐπίστευον
  choice: విశ్వసించలేదు
  rationale: అసంపూర్ణ భూతకాల క్రియ గతంలో కొనసాగిన లేదా స్థితిగతమైన అవిశ్వాసాన్ని సూచించగలదు; అయితే తెలుగులో సాధారణ భూతకాల రూపం సహజంగా ఉండి సందర్భంలో ఆ స్థితిని సముచితంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς αὐτόν
  choice: ఆయనను
  rationale: πιστεύω εἰς నిర్మాణం వ్యక్తి పట్ల దిశాన్వితమైన విశ్వాసం లేదా నమ్మకాన్ని సూచిస్తుంది. తెలుగులో ‘ఆయనను విశ్వసించడం’ సహజమైన ప్రయోగం; మూలంలోని సంబంధాత్మక భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: యోహాను రచనలో πιστεύω εἰς αὐτόν భావం
  choice: యేసుపై వ్యక్తిగత విశ్వాసం లేదా నమ్మకం ఉంచడం
  alternative: ఆయన మాటను నిజమని మాత్రమే నమ్మడం; ఆయనను నమ్ముకోవడం
  rationale: యోహాను πιστεύω εἰς అనే నిర్మాణాన్ని సాధారణంగా యేసువైపు దిశాన్వితమైన విశ్వాసానికి వాడుతాడు. ఈ వచనం ఆయన సోదరులకు అలాంటి విశ్వాసం లేదని చెబుతుంది; దాని కారణాలు లేదా తరువాతి సిద్ధాంతపరమైన నిర్ధారణలను అనువాదం జోడించదు.
- issue: ἀδελφοί యొక్క ఖచ్చిత బంధుత్వం
  choice: సోదరులు
  alternative: అన్నదమ్ములు; బంధువులు
  rationale: గ్రీకు పదం పురుష సహోదరులను లేదా విస్తృత బంధుత్వ సందర్భంలో పురుష బంధువులను సూచించగలదు. ‘సోదరులు’ సహజంగా ఉండటంతో పాటు ఖచ్చిత జీవసంబంధాన్ని అనువాదంలో బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే వాక్య నిర్మాణం. ‘ఆయన’ ద్వారా యేసును గౌరవసూచక ఏకవచనంతో సూచించాం. వివరణాత్మక γὰρ ను ‘ఎందుకంటే’గా స్పష్టంగా నిలిపాం; అసంపూర్ణ భూతకాలంలోని భావ ఛాయను పాదటిప్పణిలో నమోదు చేశాం.
