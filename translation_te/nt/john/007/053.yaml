  text: And[a] each went to his own home.
translation:
  language: te
  text: ప్రతి ఒక్కరూ తమ తమ ఇంటికి వెళ్లారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంతో వ్యభిచారంలో పట్టుబడిన స్త్రీ కథ (యోహాను 7:53–8:11) ప్రారంభమవుతుంది. మూడవ శతాబ్దపు పపైరస్ ప్రతులు, నాలుగవ శతాబ్దపు సీనాయిటికస్ మరియు వాటికానస్ ప్రతులు సహా అతి ప్రాచీన గ్రీకు ప్రతుల్లోనూ, ప్రాచీన కాప్టిక్ మరియు సిరియక్ అనువాదాల్లోనూ ఈ భాగమంతా లేదు. ఇది ఐదవ శతాబ్దపు కోడెక్స్ బేజేలో, లాటిన్ పాఠ సంప్రదాయంలో, తరువాతి బైజాంటైన్ అధికసంఖ్యాక ప్రతుల సంప్రదాయంలో ఉంది. కొన్ని ప్రతుల్లో ఈ కథ యోహాను 21:25 తరువాత లేదా లూకా 21:38 తరువాత వంటి వేరువేరు స్థానాల్లో కనిపిస్తుంది. ఈ స్థానభేదాలు ఈ కథ పాఠప్రసార చరిత్ర సంక్లిష్టమైనదని సూచిస్తాయి; ఇది మొదట స్వతంత్ర మౌఖిక సంప్రదాయంగా ప్రసారమై తరువాత పాఠ సంప్రదాయంలో చేర్చబడిందని కొందరు భావిస్తారు. సుమారు 1,500 సంవత్సరాల క్రైస్తవ పఠన సంప్రదాయంలో దీనికి ఉన్న దైవశాస్త్రపరమైన, పరిచర్యాపరమైన ఆదరణ కారణంగా దీనిని ఇక్కడ నిలిపాము.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπορεύθη
  choice: వెళ్లారు
  rationale: ఈ క్రియ ఒక స్థలానికి వెళ్లడాన్ని సూచిస్తుంది; చెదరిపోయి ఇంటికి తిరిగి వెళ్లే సందర్భంలో ‘వెళ్లారు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: ἕκαστος
  choice: ప్రతి ఒక్కరూ
  rationale: సమూహంలోని ఒక్కొక్కరిని విడివిడిగా నొక్కిచెప్పే ఏకవచన గ్రీకు పదాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: తమ తమ ఇంటికి
  rationale: అక్షరార్థంగా ‘అతని ఇంటికి’; అయితే ప్రతి వ్యక్తి తన సొంత ఇంటికి వెళ్లాడనే పంపిణీయ భావాన్ని ‘తమ తమ ఇంటికి’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Καί
  choice: అప్పుడు
  rationale: కథనాన్ని ముందుకు తీసుకెళ్లే సంధాన పదం. తెలుగులో వాక్యారంభంలో ‘అప్పుడు’ సందర్భానుగుణంగా సహజంగా ఉంటుంది; దీనికి జతచేసిన పాఠాంతర గమనికను [a] సూచిస్తుంది.
theological_decisions:
- issue: యోహాను 7:53–8:11 పాఠాంతర స్థితి
  choice: వచనాన్ని ప్రధాన పాఠంలో ఉంచి, విస్తృత పాఠాంతర గమనికను జోడించడం
  alternative: అతి ప్రాచీన ప్రతుల ఆధారంగా వచనాన్ని ప్రధాన పాఠం నుంచి తొలగించడం లేదా కుండలీకరణలో ఉంచడం
  rationale: ఇచ్చిన బైజాంటైన్ మూలపాఠంలో ఈ వచనం ఉంది; అదే సమయంలో ఈ భాగానికి ఉన్న ముఖ్యమైన ప్రతుల ఆధార సమస్యను పాఠకుడి నుంచి దాచకుండా గమనికలో స్పష్టంగా తెలియజేయాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘తమ తమ ఇంటికి’ అనే పంపిణీయ ప్రయోగం గ్రీకు వాక్యంలోని వ్యక్తిగతంగా చెదరిపోవడాన్ని సహజంగా తెలియజేస్తుంది.
