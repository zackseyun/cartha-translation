review_pass:
  verdict: revise
  source_fidelity: ‘అప్పుడు’ adds a temporal nuance not expressed by Greek Καί, which is simply connective here. ‘ప్రతి ఒక్కరూ తమ తమ ఇంటికి వెళ్లారు’ accurately conveys ἕκαστος εἰς τὸν οἶκον αὐτοῦ, including the distributive sense.
  naturalness: The revised sentence is concise, idiomatic modern standard Telugu. Omitting an explicit equivalent for initial Καί is natural Telugu narrative style and avoids the unsupported temporal ‘అప్పుడు.’
  terminology: Names and manuscript terms are retained in familiar Telugu transliteration. The textual note is revised to distinguish manuscript facts from the more debated inference about the episode’s earlier transmission history.
  issues:
  - severity: medium
    issue: ‘అప్పుడు’ for Καί
    rationale: ‘అప్పుడు’ means ‘then/at that time’; the Greek conjunction Καί means ‘and’ and does not itself mark a temporal sequence. Telugu may leave this connective unexpressed naturally.
  - severity: medium
    issue: Footnote presents an inference about an ‘originally independent oral tradition’ as settled fact
    rationale: The shifting location of the pericope is important textual evidence, but the precise account of its pre-manuscript origin is disputed. The note should preserve that uncertainty rather than assert one reconstruction.
  revised_text: ప్రతి ఒక్కరూ తమ తమ ఇంటికి వెళ్లారు.[a]
