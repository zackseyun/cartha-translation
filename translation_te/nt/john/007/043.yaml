  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: te
  text: కాబట్టి ఆయన కారణంగా జనసమూహంలో చీలిక ఏర్పడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: చీలిక
  rationale: ఈ పదం ప్రజల మధ్య ఏర్పడిన విభజనను సూచిస్తుంది. ‘చీలిక’ సామాజికంగా రెండు అభిప్రాయాలుగా విడిపోవడాన్ని సహజంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి చర్చ ఫలితంగా జరిగినదాన్ని ఈ సంధానపదం సూచిస్తుంది. ‘కాబట్టి’ ఆ ఫలిత సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐγένετο
  choice: ఏర్పడింది
  rationale: σχίσμα అనే స్థితి ఉనికిలోకి వచ్చిందనే భావాన్ని తెలుగులో ‘ఏర్పడింది’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ ὄχλῳ
  choice: జనసమూహంలో
  rationale: ὄχλος అక్కడ గుమికూడిన ప్రజల సమూహాన్ని సూచిస్తుంది; ‘జనసమూహంలో’ మూలంలోని పరిధిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: δι’ αὐτόν
  choice: ఆయన కారణంగా
  rationale: అక్యూసేటివ్‌తో διά కారణాన్ని సూచిస్తుంది. ‘ఆయన కారణంగా’ ఆ కారణార్థాన్ని నేరుగా తెలియజేస్తూ సర్వనామాన్ని అలాగే ఉంచుతుంది.
theological_decisions:
- issue: αὐτόν అనే సర్వనామం ఎవరిని సూచిస్తుంది
  choice: ‘ఆయన’—సందర్భంలో యేసును సూచించే సర్వనామాన్ని అలాగే ఉంచడం
  alternative: ‘యేసు కారణంగా’ అని పేరును స్పష్టం చేయడం
  rationale: సందర్భం సర్వనామం యేసును సూచిస్తుందని స్పష్టం చేస్తుంది. మూలంలో ఉన్న సర్వనామాన్ని నిలుపుకోవడం సహజంగా ఉండటమే కాక అనవసరమైన వివరణను వచనంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. చిన్న వచనంలోని కారణ-ఫలిత సంబంధాన్ని స్పష్టంగా ఉంచుతూ మూలంలోని సంక్షిప్తతను కాపాడింది.
