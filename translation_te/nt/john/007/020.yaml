  yaml_path: translation/nt/john/007/020.yaml
  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: te
  text: జనసమూహం జవాబిచ్చింది, “నీకు దయ్యం ఉంది. నిన్ను చంపడానికి ఎవరు ప్రయత్నిస్తున్నారు?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చింది
  rationale: సంభాషణలో ప్రతిస్పందనను తెలిపే సాధారణ కథన క్రియ; జనసమూహం అనే ఏకవచన సమూహనామంతో సహజంగా సరిపోతుంది.
- source_word: ὄχλος
  choice: జనసమూహం
  rationale: ప్రజల గుంపును సూచించే ὄχλοςకు ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: Δαιμόνιον ἔχεις
  choice: నీకు దయ్యం పట్టింది
  rationale: తెలుగులో ఈ ఆరోపణను సహజంగా వ్యక్తపరచే నుడికారం. గ్రీకు వాక్యంలోని అక్షరార్థమైన ‘నీకు దయ్యం ఉంది’ను పాదటిప్పణిలో ఉంచి రూపకల్పనను స్పష్టం చేశాం.
- source_word: τίς
  choice: ఎవరు
  rationale: గ్రీకులోని స్పష్టమైన ప్రశ్నార్థక సర్వనామాన్ని అలాగే నిలుపుతుంది; నేరుగా నిరాకరణగా మార్చదు.
- source_word: ζητεῖ
  choice: చూడుతున్నారు
  rationale: ‘చేయాలని చూడటం’ అనే తెలుగు నిర్మాణం, ζητεῖ + infinitive తెలిపే ప్రయత్నం లేదా ఉద్దేశాన్ని ఈ సందర్భంలో సహజంగా అందిస్తుంది.
- source_word: ἀποκτεῖναι
  choice: చంపాలని
  rationale: చంపడం అనే ప్రత్యక్ష భావాన్ని ఇస్తుంది; ‘హత్య చేయడం’ వంటి అదనపు న్యాయ-నైతిక ఛాయను చేర్చదు.
theological_decisions:
- issue: యేసుపై చేసిన ఆరోపణలో δαιμόνιον ἔχεις అనువాదం
  choice: ప్రధాన పాఠ్యంలో ‘నీకు దయ్యం పట్టింది’ అని సహజ తెలుగు నుడికారంతో అనువదించడం
  alternative: ‘నీకు దయ్యం ఉంది’
  rationale: ఇది జనసమూహం చేసిన ప్రతికూల ఆరోపణ మాత్రమే; వచనం దానిని సమర్థించడం లేదు. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు వాడుకను తీసుకుని, గ్రీకు పదబంధపు అక్షర రూపాన్ని పాదటిప్పణిలో నిలిపి మూలంలోని భావతీవ్రతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అదే సమయంలో గంభీరమైన కథన శైలిని పాటించాం. ప్రశ్నలోని వాదనాత్మక స్వరాన్ని నిలిపాం.
