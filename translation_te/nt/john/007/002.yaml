    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప కథన సంధాయకం. తెలుగులో వాక్యప్రవాహమే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘అప్పుడు’ అని పెడితే మూలంలో లేని కాలార్థం చేరవచ్చు.
- source_word: ἐγγὺς
  choice: సమీపించింది
  rationale: పండుగ జరిగే కాలం దగ్గరపడిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἑορτὴ
  choice: పండుగ
  rationale: మతపరమైన ఉత్సవాన్ని సూచించే సాధారణమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: τῶν Ἰουδαίων
  choice: యూదుల
  rationale: ఈ పండుగ యూదుల పండుగ అని గుర్తించే సంబంధార్థక జనిటివ్‌ను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σκηνοπηγία
  choice: పర్ణశాలల పండుగ
  rationale: తాత్కాలిక నివాసాల నిర్మాణంతో ముడిపడిన పండుగను సూచించే సుపరిచిత తెలుగు పేరు; మరింత ప్రత్యక్షమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: τῶν Ἰουδαίων అనే పండుగ-గుర్తింపును ఎలా అనువదించాలి
  choice: యూదుల పండుగ
  alternative: యూదీయ పండుగ
  rationale: ఇక్కడ ఇది వివాదాత్మక లేదా ప్రతికూల వ్యాఖ్య కాదు; పండుగ ఏ ప్రజలకు చెందినదో గుర్తిస్తుంది. ‘యూదుల’ అనేది మూలంలోని సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: σκηνοπηγία పండుగ పేరును ఎలా ఇవ్వాలి
  choice: పర్ణశాలల పండుగ
  alternative: గుడారాల పండుగ
  rationale: ప్రధాన పాఠ్యంలో సుపరిచితమైన సంప్రదాయ పేరును ఉంచి, మూలపదానికి మరింత ప్రత్యక్షమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘యూదుల పండుగైన’ అనే నిర్మాణం ἑορτὴ τῶν Ἰουδαίων మరియు దానికి వివరణగా వచ్చే σκηνοπηγία మధ్య ఉన్న అన్వయాన్ని స్పష్టంగా నిలుపుతుంది.
