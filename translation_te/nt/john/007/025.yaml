translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సమ్మతిని ఆశించే ప్రశ్నను ‘కదా?’తో, అసంపూర్ణ భూతకాలాన్ని ‘చెప్పుకుంటూ ఉన్నారు’తో ప్రతిబింబించాం. పాఠ్యంలో పాదసూచిక అవసరం లేదు; ఆంగ్ల పాఠంలోని [a] ప్రత్యామ్నాయం తెలుగులో ప్రధాన అనువాదమైన ‘నివాసుల్లో కొందరు’లోనే నేరుగా వ్యక్తమైంది.
