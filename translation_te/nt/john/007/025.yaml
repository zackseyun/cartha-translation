id: JHN.7.25
reference: John 7:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔλεγον οὖν τινες ἐκ τῶν Ἱεροσολυμιτῶν· Οὐχ οὗτός ἐστιν ὃν ζητοῦσιν ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: te
  text: అప్పుడు యెరూషలేము నివాసుల్లో కొందరు, “చంపడానికి వారు వెదుకుతున్న వ్యక్తి ఈయనే కదా?” అని చెప్పుకుంటూ ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: చెప్పుకుంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం ఆ సందర్భంలో కొనసాగుతున్న లేదా పలువురి మధ్య పునరావృతమవుతున్న మాటలను సూచిస్తుంది.
- source_word: οὖν
  choice: అప్పుడు
  rationale: ముందరి సంఘటనతో కథన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది; ఇక్కడ కఠినమైన తార్కిక ఫలితార్థం కంటే కథన కొనసాగింపే ప్రధానంగా ఉంది.
- source_word: τινες ἐκ τῶν Ἱεροσολυμιτῶν
  choice: యెరూషలేము నివాసుల్లో కొందరు
  rationale: ἐκ యొక్క ‘వారిలోనుండి/వారిలో’ భావాన్ని, Ἱεροσολυμιτῶν యొక్క ‘యెరూషలేము నివాసులు’ అర్థాన్ని సహజంగా మరియు స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Οὐχ οὗτός ἐστιν
  choice: ఈయననే కదా?
  rationale: Οὐχ తో మొదలయ్యే ప్రశ్న సమ్మతిని ఆశిస్తుంది; ‘కదా?’ ఆ వాక్చాతుర్య బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది. గౌరవసూచక ‘ఈయన’ సందర్భానికి తగిన సాధారణ తెలుగు సూచన.
- source_word: ζητοῦσιν
  choice: వెదుకుతున్నారు
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న ప్రయత్నం లేదా ఉద్దేశాన్ని నిలుపుతుంది; ‘ప్రయత్నిస్తున్నారు’ అని మార్చి మూలంలోని వెదకడం అనే పదబింబాన్ని తొలగించలేదు.
- source_word: ἀποκτεῖναι
  choice: చంపాలని
  rationale: ‘చంపడం’ అనే సూటి అర్థాన్ని ఇస్తుంది; న్యాయపరమైన భావాన్ని అనవసరంగా చేర్చే ‘మరణశిక్ష విధించడం’ వంటి పదప్రయోగాన్ని నివారిస్తుంది.
