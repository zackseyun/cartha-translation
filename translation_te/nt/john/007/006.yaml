id: JHN.7.6
reference: John 7:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: te
  text: 'అందుకు యేసు వారితో ఇలా అన్నాడు: “నా సమయం[a] ఇంకా రాలేదు; కానీ మీ సమయం మాత్రం ఎప్పుడూ సిద్ధంగానే ఉంటుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకు నియమించబడిన సమయం ఇంకా రాలేదు.” ఇక్కడి గ్రీకు పదం సాధారణ కాలాన్ని మాత్రమే కాక, తగిన లేదా నియమిత సమయాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అందుకు
  rationale: మునుపటి మాటలకు యేసు ఇచ్చిన ప్రతిస్పందనను, అలాగే వాక్యంలోని తార్కిక కొనసాగింపును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: యేసు ... అన్నాడు
  rationale: గ్రీకులో ఇది చారిత్రక వర్తమాన కాలంలో ఉన్నప్పటికీ, తెలుగు కథన శైలిలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: αὐτοῖς
  choice: వారితో
  rationale: దత్తివాచక పరోక్ష కర్మను సందర్భానికి తగిన సహజ తెలుగు రూపంలో వ్యక్తపరుస్తుంది.
- source_word: καιρός
  choice: సమయం
  rationale: ఇక్కడ సాధారణ కాలాన్ని మాత్రమే కాక తగిన లేదా నియమిత సమయాన్ని సూచించగల పదం. ప్రధాన పాఠ్యంలో ‘సమయం’ మూలంలోని విస్తృతార్థాన్ని నిలుపుతుంది; మరింత స్పష్టమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: నా సమయం
  rationale: యేసు సమయానికీ వారి సమయానికీ మధ్య ఉన్న స్పష్టమైన వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
- source_word: οὔπω πάρεστιν
  choice: ఇంకా రాలేదు
  rationale: ‘ఇంకా ఇక్కడ లేదు/హాజరు కాలేదు’ అనే భావాన్ని కాలం గురించి సహజమైన తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
- source_word: δὲ
  choice: కానీ ... మాత్రం
  rationale: యేసు సమయానికీ ఆయన సహోదరుల సమయానికీ మధ్యనున్న వ్యత్యాసాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ὁ καιρὸς ὁ ὑμέτερος
  choice: మీ సమయం
  rationale: మొదటి పదబంధానికి సమాంతరంగా ఉండి మూలంలోని వ్యత్యాస నిర్మాణాన్ని కాపాడుతుంది.
- source_word: πάντοτέ
  choice: ఎప్పుడూ
  rationale: ‘అన్ని సమయాల్లో’ అనే అర్థాన్ని సాధారణ ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: ἕτοιμος
  choice: సిద్ధంగానే ఉంటుంది
  rationale: ‘సిద్ధంగా/అందుబాటులో’ అనే మూల భావాన్ని కాపాడుతూ, సమయాన్ని వ్యక్తీకరించిన గ్రీకు రూపకాన్ని తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: యోహాను సువార్త సందర్భంలో యేసు చెప్పిన ‘సమయం’ అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘నా సమయం’ అని అనువదించబడింది.
  alternative: ‘నాకు నియమించబడిన సమయం’ లేదా ‘నా ఘడియ’
  rationale: ఈ సందర్భంలో యేసు కార్యనిర్వహణకు తగిన లేదా నియమిత సమయమనే దైవశాస్త్రీయ అంతరార్థం ఉండవచ్చు. అయితే మూలంలో ὥρα (‘ఘడియ’) కాక καιρός ఉంది. అందువల్ల విస్తృత యోహాను దైవశాస్త్రాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, మూలంలోని భావ ఉద్రిక్తతను మరియు అర్థ విస్తృతిని నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. వాక్యం సామాన్య పాఠకులకు సులభంగా ఉండేలా చేసినప్పటికీ, ‘మీ సమయం ... సిద్ధంగా’ అనే మూలంలోని రూపకాన్ని మరియు రెండు సమయాల మధ్య సమాంతర వ్యత్యాసాన్ని కాపాడింది.
