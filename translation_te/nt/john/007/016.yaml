base_translation:
  language: en
  yaml_path: translation/nt/john/007/016.yaml
  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
translation:
  language: te
  text: 'అందుకు యేసు వారికి ఇలా జవాబిచ్చాడు: “నా బోధ నాది కాదు; నన్ను పంపినవానిది.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను పంపినవానికి చెందినది.” గ్రీకు షష్ఠీ రూపం బోధ యొక్క మూలాన్నీ లేదా స్వామ్యాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: అందుకు యేసు వారికి ఇలా జవాబిచ్చాడు
  rationale: οὖν యొక్క సందర్భానుసంధాన భావాన్ని ‘అందుకు’ తెలియజేస్తుంది. ἀπεκρίθη ... καὶ εἶπεν అనే గ్రీకు వాక్యప్రయోగాన్ని సహజమైన ఆధునిక తెలుగు సంభాషణా సూత్రంగా ‘ఇలా జవాబిచ్చాడు’ అని అందించింది.
- source_word: Ἡ ἐμὴ διδαχὴ
  choice: నా బోధ
  rationale: διδαχήకు ‘బోధ’ సహజమైన, గౌరవప్రదమైన తెలుగు పదం; ἐμὴలోని స్వామ్య ప్రాధాన్యాన్ని ‘నా’ నిలుపుతుంది.
- source_word: οὐκ ἔστιν ἐμὴ
  choice: నాది కాదు
  rationale: గ్రీకులోని సంక్షిప్త స్వామ్య/మూల సంబంధ నిరాకరణను సహజంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: నన్ను పంపినవానిది
  rationale: πέμπωను సాధారణ అర్థమైన ‘పంపు’గా అనువదించి, గ్రీకు షష్ఠీ విభక్తిలోని స్వామ్యం లేదా మూలం అనే భావసాధ్యతను ‘-వానిది’ ద్వారా సంక్షిప్తంగా నిలిపింది.
theological_decisions:
- issue: యేసు బోధకు, ఆయనను పంపినవానికి మధ్య సంబంధం
  choice: “నా బోధ నాది కాదు; నన్ను పంపినవానిది”
  alternative: “నా బోధ నా నుండి వచ్చినది కాదు; నన్ను పంపినవాని నుండి వచ్చినది”
  rationale: మూలపాఠం బోధ స్వతంత్రంగా యేసు నుంచే ఉద్భవించిందని నిరాకరిస్తూ, పంపినవానితో దాని సంబంధాన్ని తెలియజేస్తుంది. అనువాదం వ్యక్తుల భేదాన్నీ, బోధ యొక్క మూలం/స్వామ్యం గురించిన గ్రీకు ఉద్రిక్తతనూ నిలుపుతుంది; అదనపు క్రైస్తవ సిద్ధాంత వివరణను వచనంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఉపదేశం’ కంటే సందర్భంలో సంక్షిప్తంగా వినిపించే ‘బోధ’ను ఎంచుకున్నాం. ప్రధాన వాక్యంలో గ్రీకు వ్యతిరేక సమాంతరాన్ని ‘నాది కాదు; ...వానిది’గా నిలిపాం.
