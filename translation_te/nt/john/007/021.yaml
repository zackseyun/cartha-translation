  terminology: ‘కార్యం’ is a suitable, dignified rendering of ἔργον and preserves its recurring Johannine resonance better than an exclusively colloquial equivalent. The lexical note responsibly gives ‘పని’ as an alternative. The cross-reference note is appropriately qualified with ‘బహుశా’ and does not make the allusion certain.
