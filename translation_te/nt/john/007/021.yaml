id: JHN.7.21
reference: John 7:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: te
  text: 'యేసు వారికి జవాబిచ్చి ఇలా అన్నాడు: “నేను ఒక కార్యం[a][b] చేశాను; మీరందరూ ఆశ్చర్యపడుతున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పని.” గ్రీకు పదం కార్యం, పని లేదా క్రియ అనే భావాలను కలిగి ఉండవచ్చు; “కార్యం” అనే అనువాదం యేసు చేసిన వాటి గురించి యోహాను ఈ పదాన్ని పునరావృతంగా ఉపయోగించడాన్ని ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇది బహుశా యోహాను 5:1–18లో, విశ్రాంతిదినాన నడవలేని వ్యక్తిని యేసు స్వస్థపరచిన సంఘటనను సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: జవాబిచ్చి ఇలా అన్నాడు
  rationale: మూలంలోని రెండు క్రియలతో కూడిన కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; వాటిని ఒక్క ‘జవాబిచ్చాడు’గా కుదించదు.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: పరోక్ష కర్మను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἓν ἔργον
  choice: ఒక కార్యం
  rationale: Ἓν అనే సంఖ్యకు ఉన్న నొక్కిచెప్పే భావాన్ని నిలుపుతూ, యోహాను సువార్తలో యేసు చేసే కార్యాలకు ἔργον పదం కలిగిన పునరావృత ప్రాధాన్యాన్ని ‘కార్యం’ ప్రతిబింబిస్తుంది.
- source_word: ἐποίησα
  choice: చేశాను
  rationale: సాధారణ భూతకాల క్రియను అదనపు ఔపచారికత లేకుండా సహజంగా అనువదిస్తుంది.
- source_word: πάντες
  choice: మీరందరూ
  rationale: సంబోధించబడుతున్న సమూహమంతటినీ సూచించే భావాన్ని, తెలుగులోని బహువచనాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: θαυμάζετε
  choice: ఆశ్చర్యపడుతున్నారు
  rationale: గ్రీకు వర్తమాన కాలాన్ని నిలుపుతూ, సానుకూల ప్రశంసగా మాత్రమే అర్థాన్ని పరిమితం చేయకుండా ఆశ్చర్యం లేదా విస్మయాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో ἔργον పదానికి ఉన్న ప్రాధాన్యం
  choice: కార్యం
  alternative: పని; క్రియ
  rationale: ఈ మాట విశ్రాంతిదినాన యేసు చేసిన స్వస్థత కార్యాన్ని సూచించే అవకాశం ఉంది; అంతేకాక యోహాను సువార్తలో యేసు కార్యాలకు ఈ పదం పునరావృతంగా వస్తుంది. ‘కార్యం’ ఆ అనుసంధానాన్ని నిలుపుతుంది, కాని సూచించబడిన సంఘటనను ప్రధాన పాఠ్యంలోనే ఖచ్చితంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, వాక్య గౌరవాన్ని నిలుపుకునేదిగానూ ఉంది. మూలంలోని ‘జవాబిచ్చి ... అన్నాడు’ నిర్మాణం మరియు ‘ఒక’ అనే నొక్కిచెప్పే సంఖ్య నిలుపబడ్డాయి. గ్రీకులో లేని కారణార్థక సంధానాన్ని చేర్చకుండా అర్థసందిగ్ధత కాపాడబడింది.
