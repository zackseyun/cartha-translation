  edition: SBLGNT
  text: ἀπεκρίθησαν οἱ ὑπηρέται· Οὐδέποτε ⸂ἐλάλησεν οὕτως⸃ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/046.yaml
  text: The officers answered[a], “Never has a man spoken like this.”
translation:
  language: te
  text: ఆ అధికారులు[a], “ఏ మనిషీ ఎన్నడూ ఇలా మాట్లాడలేదు” అని జవాబిచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ పరిచారకులు.” ఇక్కడ ఈ పదం యేసును పట్టుకోవడానికి పంపబడిన అధికార సేవకులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: జవాబిచ్చారు
  rationale: ἀποκρίνομαι యొక్క భూతకాల రూపం సంభాషణ సందర్భంలో ‘జవాబిచ్చారు’ అనే సహజమైన అర్థాన్ని ఇస్తుంది.
- source_word: οἱ ὑπηρέται
  choice: ఆ అధికారులు
  rationale: యేసును పట్టుకోవడానికి ప్రధాన యాజకులు, పరిసయ్యులు పంపిన అధికార సేవకులను సూచిస్తుంది (యోహాను 7:32, 45). ‘ఆ అధికారులు’ వారి విధిని స్పష్టంగా తెలియజేస్తుంది; ‘దేవాలయ కాపలాదారులు’ అనేది సందర్భానుసారమైనదైనా మూలపదం కంటే ఎక్కువ నిర్దిష్టం.
- source_word: Οὐδέποτε
  choice: ఎన్నడూ
  rationale: కాలమంతటినీ వర్తించే సంపూర్ణ నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐλάλησεν
  choice: మాట్లాడలేదు
  rationale: గ్రీకు ఏరిస్టు క్రియను ‘ఎన్నడూ’ అనే కాలవ్యాప్త నిరాకరణతో తెలుగులో సహజంగా కలిపి అనువదించింది.
- source_word: οὕτως
  choice: ఇలా
  rationale: మాట్లాడిన విధానాన్ని సూచించే οὕτως భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἄνθρωπος
  choice: మనిషి
  rationale: మూలంలోని ఏకవచన ἄνθρωπος ను నిలుపుతూ, తెలుగులో మానవ వ్యక్తిని సాధారణంగా సూచించే సహజ పదం. నిరాకరణ సందర్భంలో ‘ఏ మనిషీ’ ప్రతినిధిక భావాన్ని స్పష్టంగా ఇస్తుంది.
theological_decisions:
- issue: ἄνθρωπος యొక్క ప్రతినిధిక ఏకవచన భావం
  choice: ఏ మనిషీ
  alternative: ఎవరూ
  rationale: గ్రీకులోని ఏకవచన నామవాచక రూపాన్ని ‘మనిషి’గా నిలుపుతూ, వాక్యంలోని నిరాకరణ భావానికి అనుగుణంగా ‘ఏ మనిషీ’ అని ఇచ్చాం. ‘ఎవరూ’ సహజమైన ప్రత్యామ్నాయం అయినా మూలంలోని నామవాచక రూపాన్ని కనిపించనివ్వదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని బలమైన ‘ఎన్నడూ’ అనే ప్రకటనను, ‘మనిషి’ అనే ఏకవచన ప్రతినిధిక రూపాన్ని నిలిపాం.
