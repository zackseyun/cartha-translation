source:
  edition: SBLGNT
  text: οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: te
  text: అయినా, యూదుల భయంతో ఎవరూ ఆయన గురించి బహిరంగంగా మాట్లాడేవారు కాదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ సందర్భంలో మరింత నిర్దిష్టంగా, “యూదు నాయకులు” లేదా “యూదయ అధికార వర్గం.” యోహాను సువార్తలో “యూదులు” అనే పదం కొన్నిసార్లు యూదు ప్రజలను సాధారణంగా, మరికొన్ని చోట్ల యేసును వ్యతిరేకించిన యెరూషలేము కేంద్రిత అధికారులను సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδεὶς
  choice: ఎవరూ
  rationale: ప్రతికూల క్రియతో కలిసి సమూహంలోని ఒక్కరూ మినహాయింపు కాదనే సమగ్ర భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μέντοι
  choice: అయినా
  rationale: ముందటి వచనాల్లో ప్రజల మధ్య జరిగిన చర్చకు, బహిరంగంగా మాట్లాడకపోవడానికి మధ్య ఉన్న స్వల్ప వ్యతిరేకతను సూచిస్తుంది.
- source_word: παρρησίᾳ
  choice: బహిరంగంగా
  rationale: ఇక్కడ దాచుకోకుండా, అందరి ఎదుట మాట్లాడే భావమే ప్రధానమైనది; ‘ధైర్యంగా’ కంటే ఈ సందర్భానికి ఇది సరిగ్గా సరిపోతుంది.
- source_word: ἐλάλει
  choice: మాట్లాడడం లేదు
  rationale: గ్రీకు అసంపూర్ణ భూతకాలం పండుగ సందర్భంలో కొనసాగుతున్న పరిస్థితిని సూచిస్తుంది; తెలుగు సంభాషణలో సహజంగా ఉండే కొనసాగింపు నిర్మాణం ఆ భావాన్ని అందిస్తుంది.
- source_word: περὶ αὐτοῦ
  choice: ఆయన గురించి
  rationale: περί + షష్ఠీ విభక్తికి సహజమైన తెలుగు రూపం; యేసును సూచిస్తూ గౌరవప్రదమైన సర్వనామాన్ని ఉపయోగిస్తుంది.
- source_word: διὰ τὸν φόβον
  choice: భయపడి
  rationale: కారణాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; భయం వల్ల వారు బహిరంగంగా మాట్లాడలేదనే భావాన్ని నిలుపుతుంది.
- source_word: τῶν Ἰουδαίων
  choice: యూదులకు
  rationale: మూలంలోని విస్తృత పదాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ఈ సందర్భంలో అది ప్రత్యేకంగా యూదా మతాధికారులను లేదా నాయకులను సూచించే అవకాశం ఉందని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: యోహాను వర్ణనలో τῶν Ἰουδαίων అనే పదబంధం ఎవరిని సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘యూదులు’ అనే నేర అనువాదాన్ని ఉంచి, సందర్భానుసారమైన మరింత నిర్దిష్ట భావాన్ని పాదసూచికలో తెలియజేయడం
  alternative: ‘యూదా నాయకులు’ లేదా ‘యూదయ అధికార వర్గం’ అని ప్రధాన పాఠ్యంలో అనువదించడం
  rationale: గ్రీకు పదంలోని నిజమైన పరిధిని ముందుగానే సంకుచితం చేయకుండా కాపాడుతుంది. అదే సమయంలో, ఈ సందర్భంలో యేసును వ్యతిరేకించిన యెరూషలేము కేంద్రిత అధికార వర్గమే ఉద్దేశించబడి ఉండవచ్చని స్పష్టం చేసి, యూదులందరినీ ఒకేలా నిందించే కాలవిరుద్ధమైన అపార్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం. ‘బహిరంగంగా’ ప్రజల ఎదుట దాచుకోకుండా మాట్లాడే భావాన్ని ఇస్తుంది. ప్రధాన పాఠ్యం మూలంలోని పదపరిధిని కాపాడగా, సున్నితమైన చారిత్రక సందర్భాన్ని పాదసూచిక వివరిస్తుంది.
