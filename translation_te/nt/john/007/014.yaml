id: JHN.7.14
reference: John 7:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἤδη δὲ τῆς ἑορτῆς μεσούσης ⸀ἀνέβη Ἰησοῦς εἰς τὸ ἱερὸν καὶ ἐδίδασκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/014.yaml
  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: te
  text: పండుగ అప్పటికే సగం గడిచేసరికి[a], యేసు దేవాలయ ప్రాంగణంలోకి[b] వెళ్లి బోధిస్తూ ఉన్నాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పండుగ మధ్యలో ఉండగా.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి గ్రీకు పదం ἱερόν; ఇది లోపలి పరిశుద్ధ మందిరాన్ని మాత్రమే కాక దేవాలయ సముదాయం లేదా ఆవరణలను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: గ్రీకు అసంపూర్ణ భూతకాల రూపం బోధన కొనసాగుతూ ఉందనే భావాన్ని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη
  choice: అప్పటికే
  rationale: పండుగలో ఒక దశ అప్పటికే చేరుకుందని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది బలమైన వ్యతిరేకతను కాక స్వల్ప కథన మార్పును సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో ప్రత్యేక అనుసంధాన పదం లేకుండానే ఆ పని నెరవేరుతుంది.
- source_word: τῆς ἑορτῆς μεσούσης
  choice: పండుగ సగం గడిచేసరికి
  rationale: ఈ genitive absolute కాలసంబంధ పరిస్థితిని తెలియజేస్తుంది; పండుగ మధ్యదశకు చేరిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνέβη
  choice: వెళ్లి
  rationale: మూలపదంలో పైకి వెళ్లే దిశాభావం ఉన్నప్పటికీ, తెలుగులో ‘పైకి వెళ్లి’ అనడం ఇక్కడ అనవసరంగా భౌతిక ఎత్తును ముందుకు తెస్తుంది; సందర్భంలో దేవాలయానికి వెళ్లడాన్ని సహజంగా తెలిపే రూపం ఎంచుకోబడింది.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: εἰς τὸ ἱερὸν
  choice: దేవాలయ ప్రాంగణంలోకి
  rationale: ἱερόν లోపలి పరిశుద్ధ మందిరాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయం లేదా ఆవరణలను సూచిస్తుంది; ‘ప్రాంగణం’ దృశ్యాన్ని మరింత కచ్చితంగా తెలియజేస్తుంది.
- source_word: ἐδίδασκεν
  choice: బోధిస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న క్రియను సూచిస్తుంది; ‘బోధించడం మొదలుపెట్టాడు’ అనే మూలంలో స్పష్టంగా లేని ఆరంభ భావాన్ని చేర్చకుండా ఉంటుంది.
theological_decisions:
- issue: ἱερόν సూచించే స్థలం
  choice: దేవాలయ ప్రాంగణం—దేవాలయ సముదాయం లేదా ఆవరణలు
  alternative: దేవాలయం—లోపలి పరిశుద్ధ మందిరమని పాఠకుడు అర్థం చేసుకునే అవకాశం ఉంది
  rationale: ἱερόν మరియు ναός మధ్య ఉన్న స్థలార్థ భేదాన్ని కాపాడి, యేసు ప్రజలకు బోధించిన దృశ్యాన్ని సరిగ్గా చూపుతుంది; ఇది సిద్ధాంతపరమైన విస్తరణ కాదు.
- issue: ἐδίδασκεν యొక్క క్రియాభావం
  choice: కొనసాగుతున్న బోధనగా ‘బోధిస్తూ ఉన్నాడు’
  alternative: ‘బోధించడం మొదలుపెట్టాడు’
  rationale: గ్రీకు imperfect కొనసాగుతున్న చర్యను సహజంగా అనుమతిస్తుంది; స్పష్టమైన inceptive భావాన్ని బలవంతంగా చేర్చకుండా అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘అప్పటికే’ ద్వారా ἤδη భావం నిలుపబడింది; ‘ప్రాంగణం’ ద్వారా స్థలార్థం స్పష్టీకరించబడింది; కొనసాగుతున్న క్రియకు ‘బోధిస్తూ ఉన్నాడు’ వాడబడింది.
