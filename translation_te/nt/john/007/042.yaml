id: JHN.7.42
reference: John 7:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: te
  text: “మెస్సీయ దావీదు సంతానం నుండి, దావీదు ఉన్న గ్రామమైన బేత్లెహేము నుండి వస్తాడని లేఖనం చెప్పలేదా?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.” గ్రీకు బిరుదు ὁ χριστός.
    reason: alternative_reading
lexical_decisions:
- source_word: ἡ γραφή
  choice: లేఖనం
  rationale: యోహాను వాడుకలో ఇది అధికారముగల పవిత్ర లేఖనాన్ని సూచిస్తుంది; ఏకవచన రూపాన్ని నిలుపుతుంది.
- source_word: εἶπεν
  choice: చెప్పలేదా
  rationale: గ్రీకు ఏరిస్టును తెలుగు అలంకారిక ప్రశ్నలో సహజంగా వ్యక్తం చేస్తూ, లేఖనపు సాక్ష్యం కొనసాగుతున్న ప్రాముఖ్యతను సందర్భమే తెలియజేస్తుంది.
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: దావీదు సంతానం నుండి
  rationale: σπέρμα ఇక్కడ అక్షరార్థ విత్తనం కాక వంశపారంపర్యాన్ని సూచిస్తుంది; ‘సంతానం’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἀπὸ Βηθλέεμ
  choice: బేత్లెహేము నుండి
  rationale: ἀπό మూలస్థానాన్ని సూచిస్తుంది; ‘నుండి’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῆς κώμης
  choice: గ్రామమైన
  rationale: κώμη చిన్న నివాసస్థలాన్ని, అంటే గ్రామాన్ని సూచిస్తుంది.
- source_word: ὅπου ἦν Δαυίδ
  choice: దావీదు నివసించిన
  rationale: అక్షరార్థంగా ‘దావీదు ఉన్న’ అయినప్పటికీ, స్థలసంబంధ సందర్భంలో ‘నివసించిన’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది; అతని స్వస్థల భావాన్ని అతిగా విస్తరించదు.
- source_word: ἔρχεται
  choice: వస్తాడని
  rationale: వర్తమాన కాలంలోని సాధారణ/అపేక్షిత ప్రకటనను తెలుగు పరోక్ష వాక్యంలో సహజంగా అందిస్తుంది.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός పేరు వలె కాక, చర్చలో ఉన్న యూదుల అభిషిక్త రాజు-విమోచకుని బిరుదుగా పనిచేస్తుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో పదం పేరు వంటి ప్రయోగం కాక మెస్సీయ సంబంధమైన బిరుదు; అందువల్ల ‘మెస్సీయ’ భావాన్ని నేరుగా తెలియజేస్తుంది. ప్రత్యామ్నాయ సంప్రదాయ రూపాన్ని పాదటిప్పణిలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం. మూలంలోని వాక్యక్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో స్పష్టత కోసం ‘దావీదు నివసించిన గ్రామమైన బేత్లెహేము’ అని అమర్చబడింది.
