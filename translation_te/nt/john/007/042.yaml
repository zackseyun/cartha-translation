- from: “మెస్సీయ దావీదు సంతానం నుండి, దావీదు నివసించిన గ్రామమైన బేత్లెహేము నుండి వస్తాడని లేఖనం చెప్పలేదా?”[a]
  to: “మెస్సీయ దావీదు సంతానం నుండి, దావీదు ఉన్న గ్రామమైన బేత్లెహేము నుండి వస్తాడని లేఖనం చెప్పలేదా?”[a]
  rationale: The sole textual revision removes the interpretive ‘నివసించిన’ and renders the source’s unspecific ἦν as ‘ఉన్న.’ The footnote is retained, with only a minor stylistic normalization from ‘లేదా’ to ‘లేదా’.
