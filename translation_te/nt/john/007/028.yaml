id: JHN.7.28
reference: John 7:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: te
  text: 'కాబట్టి యేసు దేవాలయంలో[a] బోధిస్తూ బిగ్గరగా ఇలా అన్నాడు: “మీకు నేను తెలుసు, నేను ఎక్కడి నుంచి వచ్చానో మీకు తెలుసు. అయినా నేను నా అంతట నేనే రాలేదు.[c] నన్ను పంపినవాడు నిజమైనవాడు[d]; ఆయన మీకు తెలియదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “దేవాలయం” అంటే అంతరాలయం మాత్రమే కాక దేవాలయ ప్రాంగణాలతో కూడిన సముదాయం.
    reason: lexical_clarification
  - marker: c
    text: “నా అంతట నేనే” అనే మాటకు “నా సొంత చొరవతో” లేదా “నా ఇష్టానుసారంగా” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: “నిజమైనవాడు” అనే పదానికి ఇక్కడ “యథార్థమైనవాడు” లేదా “నమ్మదగినవాడు” అనే భావఛాయలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: బిగ్గరగా ఇలా అన్నాడు
  rationale: దేవాలయంలో అందరికీ వినిపించేలా చేసిన బలమైన బహిరంగ ప్రకటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; బాధతో కేక వేయడం అనే అనవసర భావాన్ని కలిగించదు.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయంలో
  rationale: ἱερόν ఇక్కడ అంతరాలయాన్ని మాత్రమే కాక దేవాలయ సముదాయాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన సాధారణ పదాన్ని ఉంచి, విస్తృత అర్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: διδάσκων ... καὶ λέγων
  choice: బోధిస్తూ ... ఇలా అన్నాడు
  rationale: యేసు బోధిస్తున్న సందర్భంలోనే ఈ మాటలను బిగ్గరగా పలికాడనే క్రియల సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: Κἀμὲ οἴδατε καὶ οἴδατε
  choice: మీకు నేను తెలుసు; ... కూడా తెలుసు
  rationale: καίలోని జోడింపు భావాన్ని ‘కూడా’తో వ్యక్తం చేస్తూ, ‘తెలుసు’ అనే పునరుక్తిని నిలుపుతుంది. గ్రీకు వాక్యంలోని ప్రకటన రూపాన్ని ప్రశ్నగా మార్చదు.
- source_word: πόθεν εἰμί
  choice: నేను ఎక్కడి నుంచి వచ్చానో
  rationale: యేసు మూలాన్ని సూచించే మాటను భౌగోళిక మూలానికి మాత్రమే గానీ, పరలోక మూలానికి మాత్రమే గానీ పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: నా అంతట నేనే
  rationale: యేసు తన సొంత చొరవతో లేదా స్వతంత్రంగా రాలేదనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని స్వీయసంబంధ భావాన్ని కూడా నిలుపుతుంది.
- source_word: οὐκ ἐλήλυθα
  choice: రాలేదు
  rationale: తెలుగులో సందర్భానుసారంగా పూర్తయిన రాకను మరియు దాని ప్రస్తుత ఫలితాన్ని సహజంగా తెలిపే రూపం.
- source_word: ἀληθινὸς
  choice: నిజమైనవాడు
  rationale: యోహాను రచనలో కనిపించే ‘నిజమైన, యథార్థమైన’ భావవిస్తృతిని నిలుపుతుంది. ‘సత్యవంతుడు’ అని పెడితే మాట నిలబెట్టుకునే గుణానికే అర్థం కుదించబడే అవకాశం ఉంది.
- source_word: ὁ πέμψας με
  choice: నన్ను పంపినవాడు
  rationale: పంపిన వ్యక్తి యొక్క కార్యసాధక పాత్రను స్పష్టంగా ఉంచుతుంది; మూలంలో ఈ చోట లేని ‘తండ్రి’ అనే పేరును చేర్చదు.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: ఆయన మీకు తెలియదు
  rationale: వ్యక్తిగతంగా ఎరుగకపోవడాన్ని నేరుగా తెలియజేస్తుంది; గ్రీకులోని ఆరోపణాత్మక బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: “మీకు నేను తెలుసు; నేను ఎక్కడి నుంచి వచ్చానో కూడా తెలుసు” అనే మాటను సూటి ప్రకటనగా ఉంచాలా, వ్యంగ్య ప్రశ్నగా మార్చాలా
  choice: ప్రధాన పాఠంలో సూటి ప్రకటనగా ఉంచడం
  alternative: “మీకు నేను తెలుసా? నేను ఎక్కడి నుంచి వచ్చానో తెలుసా?” అని ప్రశ్నారూపంలో అనువదించడం
  rationale: గ్రీకు వ్యాకరణ రూపం ప్రకటనాత్మకం. సందర్భంలో సవాలు లేదా వ్యంగ్యం వినిపించవచ్చుగానీ, దానిని ప్రధాన పాఠంలో నిర్ణయించి చేర్చకుండా ఉన్న ఉద్రిక్తతను నిలిపాం.
- issue: “నేను ఎక్కడి నుంచి వచ్చాను” అనే మాటలో యేసు మూలం
  choice: మానవులకు కనిపించే మూలాన్ని, దేవుని దగ్గరనుంచి వచ్చిన లోతైన మూలాన్ని రెండింటినీ అనుమతించే విస్తృత పదప్రయోగం
  alternative: దీనిని కేవలం భౌగోళిక మూలంగా లేదా స్పష్టంగా పరలోక మూలంగా పేర్కొనడం
  rationale: యోహాను సువార్తలో యేసు మూలానికి బహుస్థాయి భావం ఉంది. ఈ ఉపవాక్యం స్వయంగా చెప్పనిదాన్ని అనువాదం చేర్చదు.
- issue: “నన్ను పంపినవాడు” ఎవరు అనే గుర్తింపు
  choice: మూలంలో ఉన్నట్లే సంబంధవాచక వర్ణనగా ఉంచడం
  alternative: “నన్ను పంపిన తండ్రి” అని స్పష్టీకరించడం
  rationale: యోహాను సందర్భంలో సూచన దేవునివైపు ఉన్నప్పటికీ, ఈ వాక్యంలో ‘తండ్రి’ అనే పదం లేదు. కాబట్టి అనువాదం ఆ పేరును చేర్చదు.
- issue: ἀληθινός యొక్క భావం
  choice: “నిజమైనవాడు” అని అనువదించడం
  alternative: “సత్యవంతుడు” లేదా “నమ్మదగినవాడు”
  rationale: ఈ పదం నిజత్వం, యథార్థత, విశ్వసనీయత వంటి అనుస్వరాలను కలిగి ఉండవచ్చు. ‘నిజమైనవాడు’ దాని విస్తృతిని ఎక్కువగా నిలుపుతుంది; పాదటిప్పణి ప్రత్యామ్నాయ అనుస్వరాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, బహిరంగ బోధనకు తగిన శైలిని వాడాం. “బిగ్గరగా ఇలా అన్నాడు” సాధారణ పాఠకులకు సహజంగా ఉండి ἔκραξεν బలాన్ని నిలుపుతుంది. యేసు మాటల్లోని ప్రకటనాత్మక రూపం, ఆయన మూలం గురించిన ద్వంద్వార్థం, పంపినవాని గుర్తింపు—వీటిని వివరణతో ముందుగానే తేల్చకుండా సంరక్షించాం.
