revisions:
- from: 'కాబట్టి యేసు దేవాలయంలో[a] బోధిస్తూ బిగ్గరగా ఇలా అన్నాడు: “మీకు నేను తెలుసు; నేను ఎక్కడి నుంచి వచ్చానో కూడా తెలుసు.[b] అయినా నేను నా అంతట నేనే రాలేదు.[c] నన్ను పంపినవాడు నిజమైనవాడు[d]; ఆయన మీకు తెలియదు.”'
  to: 'కాబట్టి యేసు దేవాలయంలో[a] బోధిస్తూ బిగ్గరగా ఇలా అన్నాడు: “మీకు నేను తెలుసు, నేను ఎక్కడి నుంచి వచ్చానో మీకు తెలుసు. అయినా నేను నా అంతట నేనే రాలేదు.[c] నన్ను పంపినవాడు నిజమైనవాడు[d]; ఆయన మీకు తెలియదు.”'
  rationale: The sole textual revision makes both occurrences of οἴδατε explicit in Telugu and removes an unnecessary ‘కూడా.’ All existing footnotes are retained unchanged, including footnote b, which has no anchor in the supplied main text; it remains available for the relevant declarative-versus-ironic reading but should be anchored to the first quoted sentence in final typesetting if the publication system requires every note to have an in-text marker.
