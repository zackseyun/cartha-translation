id: JHN.7.29
reference: John 7:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ οἶδα αὐτόν, ὅτι παρ’ αὐτοῦ εἰμι κἀκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: te
  text: నేనైతే ఆయనను ఎరుగుతాను, ఎందుకంటే[a] నేను ఆయన నుండి వచ్చినవాడిని[b]; ఆయనే నన్ను పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నేను ఆయన నుండి వచ్చినవాడినని.” గ్రీకు సంధిపదం కారణాన్ని (“ఎందుకంటే”) లేదా తెలిసిన విషయాన్ని (“అని”) పరిచయం చేయగలదు; ఇక్కడి సందర్భం కారణార్థానికే ఎక్కువ అనుకూలంగా ఉంది.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “నేను ఆయన సన్నిధి నుండి వచ్చాను” లేదా “నా మూలం ఆయనే.” గ్రీకు పదబంధం మూలాన్ని లేదా ఉద్భవాన్ని సూచించగలదు; తెలుగు ప్రధాన పాఠంలోని మాటలు ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తాయి.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: నేనైతే
  rationale: గ్రీకులో స్పష్టంగా ఉన్న కర్త సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘-అయితే’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἶδα αὐτόν
  choice: ఆయనను ఎరుగుతాను
  rationale: οἶδα సూచించే ప్రస్తుత జ్ఞానస్థితిని నిలుపుతూ, వ్యక్తిని లోతుగా తెలుసుకోవడాన్ని గౌరవప్రదమైన ఆధునిక సాహిత్య తెలుగులో తెలియజేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: సందర్భంలో యేసు ఆయనను ఎరుగడానికి కారణాన్ని పరిచయం చేసే భావమే ప్రధానంగా కనిపిస్తుంది; అయినా ‘అని’ అనే విషయార్థక సాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: παρ’ αὐτοῦ εἰμι
  choice: నేను ఆయననుండి వచ్చినవాణ్ణి
  rationale: παρά + షష్ఠీ విభక్తి తెలిపే మూలం లేదా ఉద్భవాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ‘వచ్చినవాణ్ణి’ అనే నామవాచక నిర్మాణం కేవలం గత ప్రయాణాన్ని కాక వ్యక్తి మూలసంబంధాన్ని కూడా మోయగలదు.
- source_word: κἀκεῖνός
  choice: ఆయనే
  rationale: καί + ἐκεῖνος లోని కొనసాగింపును, సూచనాత్మక ఉద్ఘాటనను తెలుగులో సహజంగా సంక్షిప్తంగా అందిస్తుంది.
- source_word: με ἀπέστειλεν
  choice: నన్ను పంపాడు
  rationale: కర్మను స్పష్టంగా ఉంచి, ἀπέστειλεν అనే భూతకాల పంపింపు క్రియను సాధారణ తెలుగులో నేరుగా అనువదిస్తుంది.
theological_decisions:
- issue: παρ’ αὐτοῦ εἰμι లో యేసుకు తండ్రితో ఉన్న సంబంధం
  choice: నేను ఆయననుండి వచ్చినవాణ్ణి
  alternative: నేను ఆయన సన్నిధినుండి వచ్చాను; నా మూలం ఆయనే
  rationale: ఈ రూపం మూలం, ఉద్భవం, సంబంధం అనే భావాలకు స్థలం ఇస్తుంది; దానిని కేవలం స్థలాంతరంగా గానీ, కేవలం నియోగంగా గానీ పరిమితం చేయదు.
- issue: ὅτι యొక్క కారణార్థం లేదా విషయార్థం
  choice: ఎందుకంటే
  alternative: అని
  rationale: తక్షణ సందర్భంలో కారణార్థం బలంగా ఉన్నా, గ్రీకు సంధికి ఉన్న నిజమైన విషయార్థక సాధ్యతను పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘ఎరుగుతాను’ సాధారణ సంభాషణకన్నా కొద్దిగా సాహిత్యరూపమైనా, సందర్భంలోని వ్యక్తిగత జ్ఞానభావాన్ని స్పష్టంగా మోస్తుంది. ‘వచ్చినవాణ్ణి’ మూలపాఠంలోని εἰμι కి అక్షరానువాదం కాకపోయినా, తెలుగులో సహజత్వాన్ని కాపాడుతూ మూలం/సంబంధం అనే ఉద్రిక్తతను నిలుపుతుంది.
