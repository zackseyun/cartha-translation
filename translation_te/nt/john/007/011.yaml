id: JHN.7.11
reference: John 7:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: te
  text: అప్పుడు యూదులు[a] పండుగలో ఆయనను వెదుకుతూ ఉండేవారు; “ఆ వ్యక్తి ఎక్కడ ఉన్నాడు?” అని అడుగుతూ ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదయవాసులు”; యోహాను కథన సందర్భంలో ఇది మరింత నిర్దిష్టంగా యూదయ ప్రాంతంలోని యూదుల నాయకులను సూచించే అవకాశం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: అందుచేత
  rationale: ముందటి సందర్భం నుంచి వచ్చే కథన కొనసాగింపును, స్వల్ప పర్యవసాన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Ἰουδαῖοι
  choice: యూదులు
  rationale: మూలపదానికి సాధారణమైన విస్తృత అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచుతుంది; ఈ సందర్భంలో యూదయవారు లేదా యూదుల అధికారులు అనే సంకుచిత సూచన సాధ్యమైనా, వాక్యం స్వయంగా దానిని స్పష్టంగా నిర్దేశించదు.
- source_word: ἐζήτουν
  choice: వెదుకుతూ
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ ἑορτῇ
  choice: పండుగలో
  rationale: సందర్భంలో ముందే ప్రస్తావించిన పండుగ జరుగుతున్న సమయంలో, అక్కడ వారు వెదుకుతున్నారనే భావాన్ని సంక్షిప్తంగా ఇస్తుంది.
- source_word: ἔλεγον
  choice: అడుగుతూ ఉన్నారు
  rationale: అక్షరార్థంగా ‘చెబుతూ ఉన్నారు’ అయినా, వెంట వచ్చే ‘ఎక్కడ?’ అనే ప్రశ్న కారణంగా తెలుగులో ‘అడుగుతూ ఉన్నారు’ సహజంగా ఉంటుంది; అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్నీ నిలుపుతుంది.
- source_word: ἐκεῖνος
  choice: ఆ వ్యక్తి
  rationale: సాధారణ సర్వనామమైన ‘ఆయన’ కంటే సూచనాత్మక దూరాన్ని నిలుపుతూ, ‘ఆ ఒక్కడు’ వంటి అసహజ లేదా అతిగా తృణీకారంగా వినిపించే రూపాన్ని నివారిస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో Ἰουδαῖοι పదం సూచించే వర్గం
  choice: ప్రధాన పాఠ్యంలో ‘యూదులు’
  alternative: ‘యూదయవారు’ లేదా సందర్భానుసారంగా ‘యూదుల అధికారులు’
  rationale: ఈ వాక్యం ఒక సంకుచిత వర్గాన్ని ప్రత్యక్షంగా పేర్కొనదు. అందువల్ల విస్తృతమైన మూలార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, యోహాను కథన సందర్భంలో సాధ్యమైన సంకుచిత అర్థాన్ని పాదసూచికలో తెలియజేయడం అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదంగా ఉంది. రెండు అసంపూర్ణ భూతకాల క్రియల కొనసాగింపు భావాన్ని ‘వెదుకుతూ’ మరియు ‘అడుగుతూ ఉన్నారు’ ద్వారా నిలిపింది.
