id: JHN.7.34
reference: John 7:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: te
  text: “మీరు నన్ను వెదకుతారు, మరియు నన్ను కనుగొనరు. నేను ఉన్న చోటికి మీరు రాలేరు.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητήσετέ
  choice: వెదకుతారు
  rationale: భవిష్యత్‌కాల క్రియను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ఈ సందర్భంలో యేసును కనుగొనడానికి ప్రయత్నించడాన్ని సూచిస్తుంది.
- source_word: με
  choice: నన్ను
  rationale: యేసును సూచించే ప్రత్యక్ష కర్మ సర్వనామం.
- source_word: οὐχ εὑρήσετε
  choice: కనుగొనరు
  rationale: గ్రీకులోని నిరాకరణతో కూడిన భవిష్యత్‌కాల భావాన్ని అదనపు ఉద్ఘాటన లేకుండా స్పష్టంగా అందిస్తుంది.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: నేను ఉన్న చోటికి
  rationale: ὅπου యొక్క స్థలార్థాన్ని సహజంగా తెలుపుతుంది; స్పష్టంగా ఉన్న ἐγώ వల్ల కలిగే వ్యత్యాసాన్ని ‘నేను’ నిలుపుతుంది.
- source_word: ὑμεῖς οὐ δύνασθε ἐλθεῖν
  choice: మీరు రాలేరు
  rationale: అనుమతి లేకపోవడం కాక, రావడానికి అసమర్థతను తెలుపుతుంది; తెలుగులో ఇది సహజమైన, సంక్షిప్తమైన ప్రయోగం.
theological_decisions:
- issue: ‘నేను ఉన్న చోటికి మీరు రాలేరు’ అనే మాటలోని అసమర్థత స్వభావం
  choice: కారణాన్ని నిర్దిష్టం చేయకుండా అసమర్థతగా అనువదించడం
  alternative: దీనిని నిషేధంగా ‘మీరు రాకూడదు’ అని అనువదించడం
  rationale: δύνασθε సామర్థ్యాన్ని సూచిస్తుంది, అనుమతిని కాదు. ఆ అసమర్థత నైతికమా, ఆధ్యాత్మికమా, తీర్పుకు సంబంధించినదా, తాత్కాలికమా అనేది ఈ వాక్యం స్వయంగా వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘రాలేరు’ అనేది నిషేధం కంటే అసమర్థతను సహజంగా వ్యక్తం చేస్తుంది.
