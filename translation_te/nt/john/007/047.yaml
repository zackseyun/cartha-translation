  source_fidelity: The draft preserves the Pharisees as the speakers, the addressees (‘them’), the inferential οὖν, ‘also,’ and the perfect passive sense of πεπλάνησθε. However, ‘వారితో ... అన్నారు’ is less precise for ἀπεκρίθησαν, which specifically marks a response.
  naturalness: The question is understandable modern Telugu. Using ‘వారికి ఇలా జవాబిచ్చారు’ is more idiomatic and accurately signals the dialogue response. ‘తప్పుదారి పట్టించబడ్డారా’ is somewhat formal but is clear and appropriately retains the passive ‘misled’ sense.
  terminology: ‘పరిసయ్యులు’ is the established and suitable Telugu designation. ‘తప్పుదారి పట్టించబడ్డారా’ faithfully represents being led into error; the footnote’s ‘మోసపోయారా’ is a valid concise lexical alternative.
  issues:
