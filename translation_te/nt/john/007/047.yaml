  text: ἀπεκρίθησαν οὖν αὐτοῖς οἱ Φαρισαῖοι· Μὴ καὶ ὑμεῖς πεπλάνησθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/047.yaml
  text: So the Pharisees answered them[a], “Have you also been led astray?”
translation:
  language: te
  text: 'అందుకు పరిసయ్యులు వారికి ఇలా జవాబిచ్చారు: “మీరు కూడా తప్పుదారి పట్టించబడ్డారా?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు కూడా మోసపోయారా?” ఈ క్రియ తప్పుదారి పట్టించబడడం లేదా మోసపోవడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν αὐτοῖς
  choice: అందుకు ... వారితో ... అన్నారు
  rationale: οὖν సూచించే సంభాషణాత్మక పరిణామాన్ని ‘అందుకు’ సహజంగా తెలియజేస్తుంది; ἀπεκρίθησαν మరియు αὐτοῖς కలిపి తెలుగులో ‘వారితో ... అన్నారు’ అని సహజంగా వ్యక్తమవుతాయి.
- source_word: οἱ Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: యూద మతవర్గానికి ఆధునిక ప్రామాణిక తెలుగు బైబిల్ వాడుకలో సుపరిచితమైన రూపం.
- source_word: Μὴ καὶ ὑμεῖς
  choice: మీరు కూడా ... ఆరా?
  rationale: καί లోని ‘కూడా’ భావాన్ని నిలుపుతూ, μή వల్ల ‘కాదు’ అనే జవాబును ఆశించే వ్యంగ్య rhetorical ప్రశ్నను తెలుగులో ప్రశ్న స్వరంతో సహజంగా ఉంచుతుంది.
- source_word: πεπλάνησθε
  choice: తప్పుదారి పట్టించబడ్డారా
  rationale: πλανάω యొక్క perfect passive భావాన్ని, తప్పులోనికి నడిపించబడిన స్థితిగా వ్యక్తం చేస్తుంది; కేవలం స్వయంగా దారితప్పడం అనే భావానికి పరిమితం చేయదు.
theological_decisions:
- issue: μήతో ప్రారంభమైన ప్రశ్న యొక్క rhetorical బలం
  choice: ‘మీరు కూడా ... ఆరా?’ అనే ప్రశ్నగా ఉంచడం
  alternative: ‘మీరు కూడా మోసపోలేదు కదా?’
  rationale: మాట్లాడేవారు ‘లేదు’ అనే సమాధానాన్ని ఆశిస్తున్న భావం సందర్భం మరియు ప్రశ్న స్వరం ద్వారా తెలుస్తుంది. ‘కదా’ చేరిస్తే అర్థం మరింత స్పష్టమైనా, మూలంలోని భావాన్ని అతిగా విప్పి చెప్పే ప్రమాదం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలి. పరిసయ్యుల ప్రశ్నలోని తృణీకారపూరిత rhetorical స్వరాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
