id: JHN.7.19
reference: John 7:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: te
  text: మోషే మీకు ధర్మశాస్త్రాన్ని ఇవ్వలేదా? అయినా, మీలో ఎవ్వరూ ధర్మశాస్త్రాన్ని పాటించరు.[a] నన్ను చంపాలని ఎందుకు చూస్తున్నారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ధర్మశాస్త్రాన్ని చేయరు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ ... δέδωκεν
  choice: ఇవ్వలేదా?
  rationale: οὐతో మొదలైన ప్రశ్న అవుననే సమాధానాన్ని ఆశిస్తుంది. గ్రీకు పరిపూర్ణ కాలరూపం గతంలో ఇచ్చి ఇప్పటికీ వర్తించే స్థితిని సూచించగలిగినా, మోషే అనే చారిత్రక కర్తతో తెలుగులో ‘ఇవ్వలేదా?’ సహజంగా ఉండి ప్రశ్నలోని వాక్చాతుర్య బలాన్ని నిలుపుతుంది.
- source_word: Μωϋσῆς
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: τὸν νόμον
  choice: ధర్మశాస్త్రాన్ని
  rationale: ఇక్కడ మోషే ద్వారా ఇశ్రాయేలుకు ఇవ్వబడిన తోరా/ధర్మశాస్త్రమే ఉద్దేశ్యం. ‘ధర్మశాస్త్రం’ ఆధునిక తెలుగు బైబిలు సందర్భంలో స్పష్టమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: καὶ
  choice: అయినా
  rationale: సాధారణంగా ‘మరియు’ అని అర్థమయ్యే καί ఇక్కడ మోషే ధర్మశాస్త్రం ఇచ్చినదానికీ వారు దాన్ని పాటించకపోవడానికీ మధ్య వ్యతిరేకతను సూచిస్తుంది; ‘అయినా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: మీలో ఎవ్వరూ
  rationale: సమూహంలోని ఒక్కరు కూడా మినహాయింపు కాదనే సంపూర్ణ నిరాకరణను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ποιεῖ τὸν νόμον
  choice: ధర్మశాస్త్రాన్ని పాటించడం లేదు
  rationale: అక్షరార్థంగా ‘ధర్మశాస్త్రాన్ని చేయడం’ అయినా, ఈ సందర్భంలో దాని ఆజ్ఞల ప్రకారం నడుచుకోవడం అనే భావం. ‘పాటించడం’ సహజమైన తెలుగు; అక్షరార్థ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: τί
  choice: ఎందుకు
  rationale: ζητεῖτε మరియు ఉద్దేశార్థక క్రియతో కలిసిన τί ఇక్కడ కారణాన్ని ప్రశ్నిస్తుంది; ‘ఎందుకు’ సరళమైన సమానార్థకం.
- source_word: ζητεῖτε ἀποκτεῖναι
  choice: చంపాలని ... చూస్తున్నారు
  rationale: వర్తమాన కాలంలోని ζητεῖτε కొనసాగుతున్న ప్రయత్నం లేదా ఉద్దేశాన్ని సూచిస్తుంది. ‘చంపాలని చూస్తున్నారు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ ప్రయత్న భావాన్ని నిలుపుతుంది.
- source_word: ἀποκτεῖναι
  choice: చంపాలని
  rationale: ‘చంపడం’ లేదా ‘మరణశిక్ష విధించడం’ అనే అవకాశాల్లో, సందర్భంలోని నేరుగా చేసిన ఆరోపణకు ‘చంపడం’ సరళమైన సమానార్థకం.
theological_decisions:
- issue: ‘ధర్మశాస్త్రం’ దేనిని సూచిస్తుంది?
  choice: మోషే ద్వారా ఇవ్వబడిన ధర్మశాస్త్రం/తోరా
  alternative: సాధారణ నైతిక నియమం
  rationale: యేసు మోషేను స్పష్టంగా పేర్కొన్నందున νόμος ఇక్కడ సాధారణ నైతిక నియమం కాక మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది. మూలపాఠానికి మించిన వివరణను ప్రధాన వాక్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. వాక్చాతుర్య ప్రశ్నల బలం, మోషే ఇచ్చిన ధర్మశాస్త్రానికీ దాన్ని పాటించకపోవడానికీ మధ్య వ్యతిరేకత, అలాగే కొనసాగుతున్న హత్యాయత్న భావం నిలుపబడ్డాయి.
