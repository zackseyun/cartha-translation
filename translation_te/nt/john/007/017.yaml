id: JHN.7.17
reference: John 7:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: te
  text: ఎవరైనా ఆయన చిత్తాన్ని చేయాలని కోరుకుంటే, ఈ బోధ దేవుని నుండిదో, లేక నేను నా అంతట నేనే మాట్లాడుతున్నానో తెలుసుకుంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నా నుండి.’ ‘నా అంతట నేనే’ లేదా ‘నా సొంత అధికారంతో’ అని కూడా అర్థం కావచ్చు.
    reason: ἀπ’ ἐμαυτοῦ అనే గ్రీకు పదబంధం అక్షరార్థంగా వక్త నుండే ఉద్భవాన్ని సూచిస్తుంది; ప్రధాన పాఠ్యంలో సహజమైన తెలుగు ప్రయోగాన్ని వాడుతూ, మూలరూపం మరియు సాధ్యమైన భావవ్యాప్తిని పాదసూచికలో భద్రపరుస్తుంది.
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: ఎవరైనా ... కోరుకుంటే
  rationale: ἐάν + విధ్యర్థక క్రియ సాధారణ షరతును సూచిస్తుంది; θέλωలోని కోరిక లేదా సంసిద్ధత భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘కోరుకుంటే’ తెలియజేస్తుంది.
- source_word: τὸ θέλημα αὐτοῦ ποιεῖν
  choice: ఆయన చిత్తాన్ని చేయాలని
  rationale: మూలంలో ఉన్న సర్వనామాన్ని అలాగే ఉంచుతూ, θέλημα ποιεῖν అనే ప్రయోగాన్ని తెలుగులో సహజంగా ‘చిత్తాన్ని చేయడం’ అని అనువదించాం. సందర్భంలో ‘ఆయన’ దేవుణ్ణి సూచిస్తుంది.
- source_word: γνώσεται
  choice: తెలుసుకుంటారు
  rationale: భవిష్యత్తులో కలిగే అవగాహనను సూచిస్తుంది. ‘ఎవరైనా’ అనే సాధారణ కర్తతో లింగనిరపేక్షంగా, సహజ తెలుగులో గౌరవ బహువచన రూపాన్ని వాడాం.
- source_word: περὶ τῆς διδαχῆς
  choice: ఈ బోధ ... అని
  rationale: περί + షష్ఠీ విభక్తి బోధను గురించిన విచారణను సూచిస్తుంది. ముందున్న సందర్భంలో చర్చలో ఉన్న యేసు బోధను తెలుగులో స్పష్టంగా సూచించేందుకు ‘ఈ బోధ’ వాడాం.
- source_word: πότερον ... ἢ
  choice: '...ఓ, లేక ...ఓ'
  rationale: రెండు ప్రత్యామ్నాయాలను తెలుగులో సహజంగా, స్పష్టంగా నిలబెట్టే ప్రశ్నార్థక ప్రత్యామ్నాయ నిర్మాణం.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: దేవుని నుండిదో
  rationale: ἐκ మూలాన్ని లేదా ఆవిర్భావాన్ని సూచిస్తుంది. ‘దేవుని నుండిది’ అనేది అదనపు క్రియను చేర్చకుండా మూలభావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἀπ’ ἐμαυτοῦ λαλῶ
  choice: నేను నా సొంతగా మాట్లాడుతున్నానో
  rationale: ἀπ’ ἐμαυτοῦ మాటల మూలం వక్తలోనే ఉందనే భావాన్ని సూచిస్తుంది. ‘నా సొంతగా’ తెలుగులో సహజంగా ఉండి, స్వతంత్రంగా మాట్లాడటమనే భావాన్ని తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: τὸ θέλημα αὐτοῦలో αὐτοῦ ఎవరిని సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘ఆయన చిత్తం’ అని సర్వనామాన్ని నిలిపాం; సందర్భానుసారం అది దేవుణ్ణి సూచిస్తుంది.
  alternative: స్పష్టత కోసం ‘దేవుని చిత్తం’ అని అనువదించవచ్చు.
  rationale: తరువాతి వాక్యభాగం బోధ దేవుని నుండి వచ్చిందా అనే విషయాన్ని ప్రస్తావిస్తుంది కాబట్టి సూచిత వ్యక్తి స్పష్టమే. అయినప్పటికీ మూలంలోని సర్వనామాన్ని విస్తరించకుండా ఉంచడం వచన రూపాన్ని కాపాడుతుంది.
- issue: ἀπ’ ἐμαυτοῦ యొక్క భావబలం
  choice: ప్రధాన పాఠ్యంలో ‘నా సొంతగా’ అని అనువదించాం.
  alternative: ‘నా నుండి’ లేదా ‘నా సొంత అధికారంతో’ అని అనువదించవచ్చు.
  rationale: గ్రీకు పదబంధం నేరుగా మూలం లేదా ఆవిర్భావాన్ని వ్యక్తం చేస్తుంది; స్వతంత్ర అధికారం అనే అంతర్భావం ఉండవచ్చు గాని, ప్రధాన పాఠ్యంలో దానిని అతిగా నిర్దిష్టం చేయలేదు. అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘ఎవరైనా ... తెలుసుకుంటారు’ అనే నిర్మాణం సాధారణ వ్యక్తిని లింగనిరపేక్షంగా సూచిస్తుంది. మూలంలోని రెండు ప్రత్యామ్నాయాల మధ్య ఉన్న ఉద్వేగాన్ని ‘...ఓ, లేక ...ఓ’ నిర్మాణంతో నిలిపాం.
