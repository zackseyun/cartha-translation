- from: “‘మీరు నన్ను వెదకుతారు, కానీ కనుగొనరు; నేను ఎక్కడ ఉన్నానో[b] అక్కడికి మీరు రాలేరు’ అని ఆయన చెప్పిన ఈ మాట[a] ఏమిటి?”
  to: “‘మీరు నన్ను వెదకుతారు, కానీ కనుగొనరు; మరియు నేను ఎక్కడ ఉన్నానో[b] అక్కడికి మీరు రాలేరు’ అని ఆయన చెప్పిన ఈ మాట[a] ఏమిటి?”
  rationale: The revision supplies Telugu ‘మరియు’ for the second καί, maintaining the unity and coordination of Jesus’ quoted saying. It retains the source’s present-tense ‘where I am’ and the natural expression of inability, ‘రాలేరు.’ Footnote b is refined to describe semantic/theological tension more accurately and neutrally.
