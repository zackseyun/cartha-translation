    issue: The second Greek conjunction καί is omitted from the Telugu quotation.
    rationale: 'The Greek saying is a single quotation: ‘You will seek me and not find me, and where I am, you cannot come.’ The draft marks the transition with a semicolon but does not translate the second ‘and.’ Adding ‘మరియు’ preserves the source structure without changing the meaning.'
  - severity: low
