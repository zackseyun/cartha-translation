id: JHN.7.36
reference: John 7:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς ἐστιν ⸂ὁ λόγος οὗτος⸃ ὃν εἶπε· Ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: te
  text: “‘మీరు నన్ను వెదకుతారు, కానీ కనుగొనరు; మరియు నేను ఎక్కడ ఉన్నానో[b] అక్కడికి మీరు రాలేరు’ అని ఆయన చెప్పిన ఈ మాట[a] ఏమిటి?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ పలుకు’ లేదా ‘ఈ ప్రకటన.’ గ్రీకు λόγος సందర్భానుసారం ‘మాట,’ ‘పలుకు,’ ‘సందేశం,’ లేదా ‘ప్రకటన’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని అనువాదాలు దీనిని ‘నేను ఎక్కడికి వెళ్తున్నానో’ అని ఇస్తాయి. అయితే ఇక్కడి గ్రీకు పాఠం ‘నేను ఎక్కడ ఉన్నానో’ అని చెబుతుంది; యోహాను వాడిన ఉద్దేశపూర్వకమైన భావసంక్లిష్టతను ఈ అనువాదం అలాగే ఉంచుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: మాట
  rationale: ఈ సందర్భంలో λόγος అనేది యేసు పలికిన వాక్యంలోని విషయాన్ని సూచిస్తుంది. ‘మాట’ ఆధునిక తెలుగులో సహజంగా ఉండి, ‘చెప్పిన ఈ మాట’ అనే ప్రయోగంలో ఒక ఉక్తి లేదా ప్రకటన అనే భావాన్ని ఇస్తుంది.
- source_word: τίς ἐστιν ὁ λόγος οὗτος
  choice: ఈ మాట ఏమిటి?
  rationale: మూలంలోని ప్రశ్నారూపాన్ని అలాగే ఉంచుతుంది. ‘దీని అర్థం ఏమిటి?’ అని వివరణాత్మకంగా మార్చకుండా, వారు యేసు పలికిన మాటను ప్రశ్నిస్తున్న తీరును కాపాడుతుంది.
- source_word: Ζητήσετέ με
  choice: మీరు నన్ను వెదకుతారు
  rationale: ζητέω లోని వెదకడం/అన్వేషించడం అనే భావాన్ని ‘వెదకుతారు’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: οὐχ εὑρήσετε
  choice: కనుగొనరు
  rationale: సాధారణ భవిష్యత్ నిషేధాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది. ‘నన్ను’ అనే కర్మ ముందటి ఉపవాక్యం నుంచి తెలుగులో సహజంగా అర్థమవుతుంది.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: నేను ఎక్కడ ఉన్నానో
  rationale: మూలంలోని వర్తమానకాల εἰμί (‘ఉన్నాను’)ను యథాతథంగా కాపాడుతుంది; ‘నేను ఎక్కడికి వెళ్తున్నానో’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: అక్కడికి మీరు రాలేరు
  rationale: δύνασθε సూచించే అసమర్థతను ‘రాలేరు’ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘అక్కడికి’ అనేది ὅπουతో ఉన్న స్థాన సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: εἶπε
  choice: ఆయన చెప్పిన
  rationale: λέγω యొక్క భూతకాల భావాన్ని తెలుగులో సహజమైన సంబంధవాచక నిర్మాణంతో అందిస్తుంది.
theological_decisions:
- issue: యేసు మాటలోని వర్తమానకాల ప్రయోగం (‘నేను ఎక్కడ ఉన్నానో’)
  choice: ‘నేను ఎక్కడ ఉన్నానో’ అనే వర్తమానకాల రూపాన్ని నిలుపుకోవడం
  alternative: ‘నేను ఎక్కడికి వెళ్తున్నానో’
  rationale: గ్రీకు పాఠంలో వర్తమానకాల εἰμί ఉంది. యోహాను రచనలో దీనికి యేసు మూలం, గుర్తింపు, తండ్రితో సంబంధం వంటి భావాలతో కూడిన ఉద్దేశపూర్వక ఉద్వేగం ఉండవచ్చు. దానిని కేవలం భవిష్యత్ గమ్యస్థానంగా తేల్చకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. మొత్తం ఉక్తిని ఒకే అంతర్గత ఉల్లేఖనంగా ఉంచి, గ్రీకులో καίతో కలిసిన రెండు ఉపవాక్యాల ఏకత్వాన్ని కాపాడాం. ‘రాలేరు’ సాధారణ పాఠకునికి సహజంగా ఉండి అసమర్థత భావాన్ని వ్యక్తం చేస్తుంది.
