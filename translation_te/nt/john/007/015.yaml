id: JHN.7.15
reference: John 7:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: te
  text: 'కాబట్టి యూదులు[a] ఆశ్చర్యపడుతూ ఇలా అన్నారు: “చదువుకోకుండానే ఇతనికి పాండిత్యం ఎలా ఉంది?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “యూదులు” అనేది యూదు ప్రజలందరినీ కాదు; యెరూషలేములో యేసుతో మాట్లాడుతున్న లేదా ఆయనను వ్యతిరేకిస్తున్న యూదులను—బహుశా యూదయ అధికారులతో సహా—సందర్భానుసారంగా సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, “ఇతనికి అక్షరజ్ఞానం ఎలా ఉంది?” గ్రీకులో అక్షరాలా, “అక్షరాలు తెలుసు.” ఇక్కడ ఈ నుడికారం విద్య లేదా పాండిత్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: ఆశ్చర్యపోతూ
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న ఆశ్చర్యాన్ని సహజమైన తెలుగు రూపంలో వ్యక్తపరుస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భం నుంచి వచ్చే తార్కికమైన లేదా కథన సంబంధాన్ని నిలుపుతుంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదబంధానికి నేరమైన సమానార్థక రూపాన్ని ప్రధాన వాక్యంలో ఉంచి, ఈ సందర్భంలోని పరిమిత సూచనను పాదసూచికలో వివరిస్తుంది.
- source_word: λέγοντες
  choice: అని అన్నారు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే గ్రీకు కృదంతాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో అందిస్తుంది.
- source_word: Πῶς
  choice: ఎలా
  rationale: సాధనం లేదా పరిస్థితి గురించి అడిగే ప్రత్యక్ష ప్రశ్నార్థక భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: οὗτος
  choice: ఇతనికి
  rationale: ‘ఈ వ్యక్తి’ అనే కొంత దూరం ఉంచే సూచనను అవమానకరంగా కాకుండా సహజంగా తెలుపుతుంది.
- source_word: γράμματα
  choice: పాండిత్యం
  rationale: ఇక్కడ కేవలం వర్ణమాల జ్ఞానం కాకుండా విద్యాభ్యాసం ద్వారా వచ్చే లేఖనపాండిత్యం లేదా శాస్త్రజ్ఞానాన్ని సూచించే గ్రీకు నుడికారానికి సహజమైన తెలుగు రూపం.
- source_word: οἶδεν
  choice: ఉంది
  rationale: οἶδα యొక్క స్థితిని తెలిపే భావాన్ని ‘పాండిత్యం ఉంది’ అనే సహజమైన తెలుగు ప్రయోగంలో నిలుపుతుంది.
- source_word: μὴ μεμαθηκώς
  choice: చదువుకోకుండానే
  rationale: ఆమోదిత గురువు వద్ద పద్ధతిగా విద్య నేర్చుకోలేదనే భావాన్ని, ఏ ప్రత్యేక విద్యాసంస్థను ఊహించకుండా అందిస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι అనే పదబంధపు సూచన
  choice: యూదులు
  alternative: యూదా ప్రాంతవాసులు; యూదుల నాయకులు
  rationale: మూలంలోని సాధారణ పదబంధాన్ని వ్యాఖ్యానాత్మకంగా సంకుచితం చేయకుండా ప్రధాన వాక్యంలో ఉంచాం. అయితే ఇది యూదు ప్రజలందరినీ సూచిస్తుందనే అపార్థం రాకుండా సందర్భోచిత వివరణను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు నుడికారాన్ని పదక్షరంగా ప్రధాన వాక్యంలో పెట్టడం వల్ల కలిగే ‘కేవలం చదవడం తెలుసా?’ అనే అపార్థాన్ని నివారించేందుకు ‘పాండిత్యం’ ఎంచుకొని, పదక్షర రూపాన్ని పాదసూచికలో నిలిపాం.
