lexical_decisions:
- source_word: ἀλλὰ
  choice: కానీ
  rationale: ముందటి సందర్భంలోని అధికారుల వాదనకు విరుద్ధంగా ఈ జనసమూహంపై వారు చేసే నిందను సహజంగా అనుసంధానిస్తుంది.
- source_word: ὁ ὄχλος οὗτος
  choice: ఈ జనసమూహం
  rationale: ὄχλος యొక్క సమూహార్థాన్ని నిలుపుతూ, గ్రీకులో తప్పనిసరిగా లేని ‘అల్లరిమూక’ వంటి అదనపు ప్రతికూల భావాన్ని నివారిస్తుంది.
- source_word: ὁ μὴ γινώσκων
  choice: తెలియని
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న వర్తమాన కృదంతం జనసమూహాన్ని వర్ణిస్తుంది; తెలుగులో ఈ విశేషణ రూపం సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: τὸν νόμον
  choice: ధర్మశాస్త్రం
  rationale: ఈ సందర్భంలో యూదుల తోరా/ధర్మశాస్త్రాన్ని సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు వాడుకలో ‘ధర్మశాస్త్రం’ స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: ἐπάρατοί
  choice: శాపగ్రస్తులు
  rationale: ‘శాపానికి లోనైనవారు’ అనే బలమైన నిందాత్మక భావాన్ని సహజమైన తెలుగు విధేయ పదంతో వ్యక్తం చేస్తుంది.
- source_word: εἰσιν
  choice: శాపగ్రస్తులు
  rationale: గ్రీకు బహువచనాన్ని, జనసమూహంలోని వ్యక్తులను ఉద్దేశించిన తెలుగు బహువచన విధేయ రూపంతో ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: వక్తల కఠిన తీర్పును కథకుని theological assertionగా చూపాలా
  choice: పరిసయ్యుల ప్రత్యక్ష నిందగానే, దానిని మృదువు చేయకుండా లేదా సమర్థించకుండా అనువదించడం
  alternative: ‘వారి మాట ప్రకారం ఈ జనసమూహం శాపగ్రస్తులు’ అని కథకుని దూరాన్ని అదనంగా చూపడం
  rationale: మూలపాఠం యేసు ప్రత్యర్థుల ప్రత్యక్ష సంభాషణలోని మాటలను ఇస్తుంది. మూలంలో లేని దూరీకరణను చేర్చకుండా వారి కఠిన తీర్పును యథాతథంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘జనసమూహం’ తటస్థంగా ఉంది; ‘శాపగ్రస్తులు’ వక్తల తీవ్ర నిందను నిలుపుతుంది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
