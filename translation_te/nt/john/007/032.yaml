id: JHN.7.32
reference: John 7:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἤκουσαν οἱ Φαρισαῖοι τοῦ ὄχλου γογγύζοντος περὶ αὐτοῦ ταῦτα, καὶ ἀπέστειλαν ⸂οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ὑπηρέτας⸃ ἵνα πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: te
  text: జనం ఆయన గురించి ఈ మాటలు గొణుక్కుంటున్నారని[a] పరిసయ్యులు విన్నారు. ప్రధాన యాజకులు మరియు పరిసయ్యులు ఆయనను పట్టుకోవడానికి[c] అధికారిక సేవకులను[b] పంపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గుసగుసలాడుకుంటున్నారని’ లేదా ‘మెల్లగా మాట్లాడుకుంటున్నారని’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం తక్కువ స్వరంలో, అసంతృప్తితో మాట్లాడుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘కాపలాదారులు’ లేదా ‘ఆలయ కాపలాదారులు’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం యూదుల మతాధికారులు పంపిన అధికారిక సేవకులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘అరెస్టు చేయడానికి’ అని కూడా అనువదించవచ్చు. గ్రీకు పదానికి మరింత అక్షరార్థంగా ‘పట్టుకోవడానికి’ అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: విన్నారు
  rationale: ఇక్కడ ἀκούω అనే క్రియ సమాచారం చెవినపడటాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘విన్నారు’ సహజంగా, ఖచ్చితంగా ఉంటుంది.
- source_word: τοῦ ὄχλου
  choice: జనం
  rationale: ὄχλος ఇక్కడ కూడివున్న ప్రజల సమూహాన్ని సూచిస్తుంది. ‘జనం’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: γογγύζοντος
  choice: గుసగుసలాడుకుంటున్నారని
  rationale: ఈ పదం నెమ్మదిగా, బహిరంగంగా కాకుండా మాట్లాడుకోవడాన్ని సూచిస్తుంది; సందర్భంలో ఉన్న అసంతృప్తి ఛాయను పాదసూచికలో నిలిపాం.
- source_word: περὶ αὐτοῦ ταῦτα
  choice: ఆయన గురించి ఈ మాటలు
  rationale: περί + genitive యొక్క ‘గురించి’ భావాన్నీ, ταῦτα అనే బహువచన సూచననూ నిలుపుతుంది.
- source_word: ἀπέστειλαν
  choice: పంపారు
  rationale: ἀποστέλλω యొక్క సందర్భానుకూలమైన సాధారణ అర్థం; తెలుగులో సహజంగా ఉంటుంది.
- source_word: οἱ ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఇది అనేకమంది ప్రధాన యాజక పదవిదారులను కాక, ప్రధాన యాజక వర్గ నాయకత్వాన్ని సూచిస్తుంది; ‘ప్రధాన యాజకులు’ చారిత్రకంగా తగిన అనువాదం.
- source_word: ὑπηρέτας
  choice: అధికార పరిచారకులను
  rationale: ఇక్కడ వీరు యూదా మతాధికారుల ఆదేశాల కింద పనిచేసే అధికారిక పరిచారకులు. ‘అధికార పరిచారకులు’ వారి అధికారిక పాత్రను చూపుతూ, ‘ఆలయ పోలీసులు’ అనే అతినిర్దిష్టతను నివారిస్తుంది.
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: ఆయనను పట్టుకోవడానికి
  rationale: ἵνα ఉద్దేశాన్ని, πιάζω పట్టుకోవడం/అదుపులోకి తీసుకోవడం అనే భావాన్ని వ్యక్తం చేస్తుంది; ‘అరెస్టు చేయడానికి’ కంటే గ్రీకు పదానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: ὑπηρέτας అనే వారి సంస్థాగత గుర్తింపు
  choice: యూదా మతాధికారుల కింద పనిచేసే అధికార పరిచారకులు
  alternative: సేవకులు; ఆలయ కాపలాదారులు; ఆలయ పోలీసులు
  rationale: యేసును పట్టుకోవడానికి అధికారికంగా పంపబడిన వారని సందర్భం తెలియజేస్తుంది. అయితే గ్రీకు పదం వారి ఖచ్చితమైన సంస్థాగత హోదాను చెప్పదు; అందువల్ల ప్రధాన పాఠ్యంలో మితమైన పదాన్ని ఎంచుకుని ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘జనం’, ‘గుసగుసలాడుకోవడం’, ‘పట్టుకోవడం’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతాయి; ‘ప్రధాన యాజకులు’, ‘అధికార పరిచారకులు’ చారిత్రక సందర్భానికి తగిన అధికారిక శైలిని నిలుపుతాయి.
