  verdict: approve
  source_fidelity: The translation accurately represents the ongoing sense of ἐζήτουν ('ప్రయత్నిస్తూ ఉన్నారు'), the purpose infinitive πιάσαι ('పట్టుకోవడానికి'), the negative action idiom ('ఎవ్వరూ ఆయన మీద చెయ్యి వేయలేదు'), and the causal clause concerning the hour not yet having come. 'ఆయన గడియ' appropriately preserves the Johannine expression ἡ ὥρα αὐτοῦ without narrowing its reference.
  naturalness: The Telugu is clear, modern, and suitably respectful. 'పట్టుకోవడానికి ప్రయత్నిస్తూ ఉన్నారు' is somewhat fuller than the Greek but naturally conveys the imperfect, continuing attempt. The contrast introduced by 'అయినా' reads smoothly in Telugu.
  terminology: 'Key terms are handled consistently and appropriately: ''పట్టుకోవడం'' retains the nontechnical lexical range of πιάσαι, while footnote a gives the contextual alternative ''అరెస్టు చేయడం.'' ''ఆయన గడియ'' retains the important Johannine terminology. Both footnotes are accurately anchored and their explanations do not impose a restrictive doctrinal interpretation.'
