id: JHN.7.30
reference: John 7:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: te
  text: కాబట్టి వారు ఆయనను పట్టుకోవడానికి ప్రయత్నిస్తూ ఉన్నారు[a]. అయినా ఎవ్వరూ ఆయన మీద చెయ్యి వేయలేదు; ఎందుకంటే ఆయన గడియ ఇంకా రాలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను అరెస్టు చేయడానికి ప్రయత్నిస్తూ ఉన్నారు.’ గ్రీకు క్రియకు ‘పట్టుకోవడం’ అనే అర్థం ఉంది; ఈ సందర్భంలో అది అరెస్టు చేయడాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆయన గడియ’ అనేది యోహాను సువార్తలో యేసు కార్యంలో దేవుడు నిర్ణయించిన సమయాన్ని—ప్రత్యేకంగా ఆయన బాధ, మరణం, పునరుత్థానం, మహిమపరచబడటాన్ని—సూచించే పునరావృత వ్యక్తీకరణ.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: ప్రయత్నిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృతమైన ప్రయత్నాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందరి వచనంలోని మాటల నుంచి వచ్చే కథనాత్మక, తార్కిక పర్యవసానాన్ని నిలుపుతుంది.
- source_word: πιάσαι
  choice: పట్టుకోవడానికి
  rationale: మూల క్రియలోని ‘పట్టుకోవడం/చిక్కించుకోవడం’ అనే ప్రాథమిక భావాన్ని నిలుపుతుంది; సందర్భంలో అరెస్టు ఉద్దేశం ఉండవచ్చు గాని ప్రధాన పాఠంలో దానిని మరీ నిర్దిష్టం చేయదు.
- source_word: οὐδεὶς
  choice: ఎవ్వరూ
  rationale: నిషేధ వాక్యంలో సహజమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: ఆయన మీద చెయ్యి వేయలేదు
  rationale: ఒకరిని అదుపులోకి తీసుకోవడానికి తాకడం లేదా పట్టుకోవడం అనే గ్రీకు నుడికారాన్ని, ఏకవచన ‘చెయ్యి’ను నిలుపుతూ తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఎవ్వరూ చర్య తీసుకోకపోవడానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: οὔπω
  choice: ఇంకా ... లేదు
  rationale: కాలసంబంధమైన ‘ఇంకా కాదు’ అనే భావాన్ని సహజమైన తెలుగు నిర్మాణంలో తెలియజేస్తుంది.
- source_word: ἐληλύθει
  choice: రాలేదు
  rationale: ఆ కథన క్షణానికి నిర్ణీత సమయం ఇంకా చేరలేదనే పూర్వపూర్ణ భావం తెలుగులో సందర్భం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: ἡ ὥρα αὐτοῦ
  choice: ఆయన గడియ
  rationale: యోహాను సువార్తలో పునరావృతమయ్యే ‘గడియ’ అనే భారవంతమైన కథన-దైవశాస్త్ర పదాన్ని ‘సమయం’గా చదును చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: యోహాను సందర్భంలో ‘ఆయన గడియ’ అర్థం
  choice: ప్రధాన పాఠంలో ‘ఆయన గడియ’ అనే అక్షరార్థ వ్యక్తీకరణను నిలుపడం
  alternative: ‘ఆయన సమయం’ లేదా ‘ఆయన మరణానికి నిర్ణయించబడిన సమయం’
  rationale: యోహానులో ఈ మాట యేసు బాధ, మరణం, పునరుత్థానం, మహిమపరచబడటం వైపు సూచించినా, ఈ వచనం దానిని ఒక్క సంఘటనకే పరిమితం చేయదు. అందువల్ల దాని దైవశాస్త్ర లోతు, ఉద్దేశపూర్వక విస్తృతి నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ‘ఆయన’ రూపాన్ని ఉపయోగించాం. ‘పట్టుకోవడానికి ప్రయత్నిస్తూ ఉన్నారు’ కొనసాగుతున్న ప్రయత్నాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘ఆయన గడియ’ యోహాను సువార్తలోని ముఖ్య పదబంధాన్ని నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
