id: JHN.7.22
reference: John 7:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν— οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων— καὶ ἐν σαββάτῳ περιτέμνετε ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: te
  text: ఈ కారణంగా మోషే మీకు సున్నతిని ఇచ్చాడు—అది మోషే నుండి వచ్చినది కాదు[a], పితరుల నుండి వచ్చినది—మరియు మీరు విశ్రాంతిదినాన ఒక పురుషునికి సున్నతి చేస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది మోషే నుండి వచ్చినందువల్ల కాదు, పితరుల నుండి వచ్చినందువల్ల.” ఈ మధ్యవాక్యం సున్నతి మోషేతో ప్రారంభం కాలేదని, పితరుల కాలం నుండే ఉందని వివరిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ఈ కారణంగా
  rationale: యేసు ఇస్తున్న వివరణకు కారణసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Μωϋσῆς
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: δέδωκεν
  choice: ఇచ్చాడు
  rationale: గ్రీకు సంపూర్ణకాలం సూచించే కొనసాగుతున్న ప్రాముఖ్యత సందర్భంలో స్పష్టంగా ఉన్నందున, సహజమైన తెలుగు భూతకాల రూపం వాడబడింది.
- source_word: τὴν περιτομήν
  choice: సున్నతిని
  rationale: నిబంధనకు సంబంధించిన ఆచారాన్ని సూచించే స్థిరమైన, సాధారణ తెలుగు పదం.
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: అది మోషే నుండి వచ్చినది కాదు, పితరుల నుండి వచ్చినది
  rationale: ἐκ యొక్క మూలం లేదా ఆరంభం అనే భావాన్ని కాపాడుతూ, వివరణాత్మక మధ్యవాక్యాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἐν σαββάτῳ
  choice: విశ్రాంతిదినాన
  rationale: సాధారణ ఆచరణలోని సబ్బాతును సూచించే కాలార్థక ప్రయోగాన్ని తెలుగు బైబిలు పరిభాషలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: περιτέμνετε
  choice: మీరు ... సున్నతి చేస్తారు
  rationale: రెండవ పురుష బహువచన వర్తమాన రూపాన్ని, వారి సాధారణ ఆచరణను సూచించే విధంగా నేరుగా అనువదిస్తుంది.
- source_word: ἄνθρωπον
  choice: ఒక పురుషునికి
  rationale: సున్నతి సందర్భంలో ఉద్దేశించబడిన మగ వ్యక్తిని అస్పష్టత లేకుండా సూచిస్తుంది.
theological_decisions:
- issue: “పితరులు” అనే పదం ఎవరిని సూచిస్తుంది
  choice: మోషేకు ముందున్న మూలపితరులు
  alternative: ఇశ్రాయేలు పూర్వీకులందరినీ విస్తృతంగా సూచించడం
  rationale: సున్నతి మోషేతో ప్రారంభం కాలేదని వాక్యం చెబుతుంది; అనువాదం దీనిని వివరించి విస్తరించకుండా, “పితరులు” అనే మూలపద భావాన్ని నిలుపుతుంది.
- issue: మధ్యవాక్యంలోని οὐχ ὅτι సంబంధం
  choice: సున్నతి మోషే నుండి ఉద్భవించలేదనే మూలవివరణ
  alternative: “మోషే నుండి వచ్చినందువల్ల కాదు” అనే కారణార్థ పఠనం
  rationale: గ్రీకు నిర్మాణం రెండు విధాలుగా వ్యక్తీకరించదగినందున ప్రధాన పాఠ్యంలో మూలం అనే భావాన్ని సహజంగా ఇచ్చి, ప్రత్యామ్నాయ కారణార్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. “సున్నతి,” “విశ్రాంతిదినం,” “పితరులు” వంటి స్థిరమైన బైబిలు పరిభాషను నిలుపుతూ వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం.
