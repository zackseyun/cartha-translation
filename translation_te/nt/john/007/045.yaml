source:
  edition: SBLGNT
  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: te
  text: దాంతో కావలివారు ప్రధాన యాజకులూ పరిసయ్యులూ ఉన్న చోటుకు వచ్చారు. అప్పుడు ఆ ప్రధాన యాజకులూ పరిసయ్యులూ కావలివారిని, “మీరు అతన్ని ఎందుకు తీసుకురాలేదు[b]?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, “అతన్ని ఎందుకు నడిపించుకొని రాలేదు?” ఈ గ్రీకు క్రియకు ‘నడిపించు’ లేదా ‘తీసుకురా’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ యేసును పట్టుకొని తీసుకురావడం సందర్భానికి సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: దాంతో
  rationale: ముందటి సంఘటన ఫలితంగా కథనం కొనసాగుతున్నదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὑπηρέται
  choice: కావలివారు
  rationale: ఇక్కడ యేసును పట్టుకోవడానికి పంపబడిన అధికార సేవకులను సూచిస్తుంది. సాధారణ ‘సేవకులు’ కంటే వారి విధిని స్పష్టంగా తెలియజేస్తూ, ‘దేవాలయ కాపలాదారులు’ అనే కొంత వివరణాత్మక అనువాదాన్ని నివారిస్తుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: యాజక నాయకుల సమూహానికి తెలుగులో ప్రామాణికమైన, సులభంగా అర్థమయ్యే పదబంధం.
- source_word: Φαρισαίους
  choice: పరిసయ్యులు
  rationale: ఈ యూదు మతవర్గానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: ἐκεῖνοι
  choice: వారే
  rationale: గ్రీకులోని సూచనాత్మక సర్వనామం ప్రధాన యాజకులు, పరిసయ్యులనే ప్రత్యేకంగా తిరిగి సూచిస్తుంది; ‘వారే’ దాని ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: Διὰ τί
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే సహజమైన తెలుగు రూపం.
- source_word: ἠγάγετε
  choice: తీసుకురాలేదు
  rationale: ἄγω అనే క్రియకు ‘నడిపించు’ లేదా ‘తీసుకురా’ అనే భావాలు ఉండవచ్చు; యేసును పట్టుకొని తమ దగ్గరకు తీసుకురావాలనే సందర్భంలో ‘తీసుకురా’ సహజంగా సరిపోతుంది.
- source_word: αὐτόν
  choice: అతన్ని
  rationale: ఇది యేసును సూచించే ప్రత్యక్ష కర్మ; ఆధునిక తెలుగులో సహజమైన రూపం.
