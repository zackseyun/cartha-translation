- from: దాంతో కావలివారు ప్రధాన యాజకుల దగ్గరికీ పరిసయ్యుల దగ్గరికీ వచ్చారు. వారే[a] కావలివారిని, “మీరు అతన్ని ఎందుకు తీసుకురాలేదు[b]?” అని అడిగారు.
  to: దాంతో కావలివారు ప్రధాన యాజకులూ పరిసయ్యులూ ఉన్న చోటుకు వచ్చారు. అప్పుడు ఆ ప్రధాన యాజకులూ పరిసయ్యులూ కావలివారిని, “మీరు అతన్ని ఎందుకు తీసుకురాలేదు[b]?” అని అడిగారు.
  rationale: The revision replaces the potentially over-intensified pronoun ‘వారే’ with an explicit demonstrative repetition of the chief priests and Pharisees. This preserves the referential force of ἐκεῖνοι, makes the questioners unambiguous, and improves Telugu flow. The demonstrative footnote is no longer needed because the explicit Telugu wording directly represents it; the verb alternative footnote remains anchored to the translated verb.
