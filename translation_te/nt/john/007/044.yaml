source:
  edition: SBLGNT
  text: τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλ’ οὐδεὶς ⸀ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
translation:
  language: te
  text: అయితే వారిలో కొందరు ఆయనను పట్టుకోవాలని అనుకున్నారు; అయినా ఎవరూ ఆయనపై చేతులు వేయలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ
  choice: అయితే ... కొందరు
  rationale: τινὲς అనిర్దిష్టమైన ఉపసమూహాన్ని సూచిస్తుంది; δὲ ముందున్న భిన్న స్పందనలకు వ్యతిరేకతను చూపుతుంది. ఆధునిక తెలుగులో ఈ కలయిక సహజంగా ఉంది.
- source_word: ἤθελον
  choice: అనుకున్నారు
  rationale: గతకాలంలో కొనసాగిన ఉద్దేశాన్ని సూచించే imperfect రూపం. సందర్భంలో కార్యరూపం దాల్చని సంకల్పాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξ αὐτῶν
  choice: వారిలో
  rationale: పెద్ద సమూహంలోనుండి కొందరిని సూచించే విభాజక భావాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: πιάσαι
  choice: పట్టుకోవాలని
  rationale: πιάζω యొక్క ప్రాథమికమైన పట్టుకోవడం/అదుపులోకి తీసుకోవడం అనే భావాన్ని నిలుపుతుంది; సందర్భంలోని అరెస్టు భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἀλλ’ οὐδεὶς
  choice: అయినా ఎవరూ
  rationale: ఉద్దేశానికి, జరిగిన ఫలితానికి మధ్య ఉన్న బలమైన వ్యతిరేకతను సహజమైన తెలుగులో చూపుతుంది.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: ఆయన మీద చెయ్యి వేయలేదు
  rationale: శత్రుత్వంతో ఒకరిని పట్టుకోవడం అనే గ్రీకు నుడికారాన్ని అర్థమయ్యే తెలుగు నుడికారంతో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువదించబడింది. మూలంలోని పట్టుకోవడం/అరెస్టు చేయడం అనే భావవిస్తృతిని ప్రధాన పాఠంలో ‘పట్టుకోవడం’తో ఉంచి, అనవసరంగా నిర్దిష్టం చేయలేదు.
