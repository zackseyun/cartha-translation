review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the contrast: some from the group desired to seize Jesus, but nobody acted against him. However, the Greek expression has plural ‘hands’ (τὰς χεῖρας); Telugu can retain this naturally as ‘చేతులు వేయలేదు.’'
  naturalness: The wording is modern, clear, and appropriately respectful. ‘పట్టుకోవాలని అనుకున్నారు’ naturally conveys their intended action without unnecessarily specifying formal arrest.
  terminology: ‘పట్టుకోవడం’ suitably preserves the semantic range of πιάσαι (‘seize,’ potentially ‘arrest’ in context). ‘ఆయన’ is appropriate respectful reference. Changing singular ‘చెయ్యి’ to plural ‘చేతులు’ better reflects both the source wording and the established Telugu expression.
  issues:
  - severity: low
    issue: The final idiom uses singular ‘చెయ్యి’ rather than plural ‘చేతులు.’
    rationale: The source explicitly says ‘laid hands’ (τὰς χεῖρας). Although singular can be idiomatic in Telugu, plural ‘చేతులు వేయలేదు’ is equally natural and more closely preserves the Greek expression’s form and force.
  revised_text: అయితే వారిలో కొందరు ఆయనను పట్టుకోవాలని అనుకున్నారు; అయినా ఎవరూ ఆయనపై చేతులు వేయలేదు.
  revised_footnotes: []
