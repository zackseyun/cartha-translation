id: JHN.7.8
reference: John 7:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμεῖς ἀνάβητε εἰς τὴν ⸀ἑορτήν· ἐγὼ ⸀οὐκ ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι ὁ ⸂ἐμὸς καιρὸς⸃ οὔπω πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: te
  text: 'మీరు పండుగకు వెళ్లండి. నేను ఈ పండుగకు వెళ్లడం లేదు[a]. ఎందుకంటే నా సమయం ఇంకా నెరవేరలేదు[b].


    [a] కొన్ని ప్రతుల్లో, “నేను ఈ పండుగకు ఇంకా వెళ్లడం లేదు” అని ఉంది.

    [b] లేదా, “నాకు నియమించబడిన సమయం ఇంకా నెరవేరలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “నేను ఈ పండుగకు ఇంకా వెళ్లడం లేదు” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా, “నాకు నియమించబడిన సమయం ఇంకా నెరవేరలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε
  choice: వెళ్లండి
  rationale: యెరూషలేముకు వెళ్లడంలో ఉన్న ‘పైకి వెళ్లడం’ అనే దిశాభావం సందర్భంలో అంతర్లీనంగా ఉంది; తెలుగులో ‘పండుగకు పైకి వెళ్లండి’ అనడం అసహజంగా ఉండటంతో సహజమైన ‘వెళ్లండి’ ఎంచుకున్నాం.
- source_word: ἑορτήν
  choice: పండుగ
  rationale: మతపరమైన ఉత్సవాన్ని సూచించే సహజమైన, సాధారణ తెలుగు పదం.
- source_word: οὐκ ἀναβαίνω
  choice: నేను ... వెళ్లడం లేదు
  rationale: సమీప భవిష్యత్తుకు సంబంధించిన గ్రీకు వర్తమాన రూపాన్ని సహజమైన తెలుగు ప్రయోగంతో అందిస్తుంది. మూలపాఠంలోని οὐκ ప్రకారం ప్రధాన పాఠంలో ‘ఇంకా’ చేర్చలేదు.
- source_word: ταύτην
  choice: ఈ
  rationale: చర్చలో ఉన్న నిర్దిష్ట పండుగను నేరుగా సూచిస్తుంది.
- source_word: καιρός
  choice: సమయం
  rationale: దైవనియామక భావానికి అవకాశం ఉంచుతూ, మూలంలోని విస్తృత అర్థాన్ని అతిగా వ్యాఖ్యానించకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πεπλήρωται
  choice: నెరవేరలేదు
  rationale: పూర్తి కావడం లేదా నెరవేర్పుకు చేరడం అనే perfect passive భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: పండుగకు వెళ్లడం గురించి యేసు చేసిన ప్రకటనలోని పాఠాంతరం
  choice: SBLGNT లోని οὐκ (‘లేదు’) పాఠాన్ని ప్రధాన వాక్యంలో అనుసరించడం
  alternative: 'οὔπω (‘ఇంకా లేదు’): ‘నేను ఈ పండుగకు ఇంకా వెళ్లడం లేదు’'
  rationale: ఇచ్చిన మూలపాఠంలో οὐκ ఉంది. యేసు తరువాత పండుగకు వెళ్లడాన్ని అర్థం చేసుకోవడంపై ఈ పాఠాంతరం ప్రభావం చూపుతుంది కాబట్టి, ఉద్రిక్తతను తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: καιρός లో నియమిత సమయ భావం
  choice: ప్రధాన పాఠంలో ‘నా సమయం’
  alternative: ‘నాకు నియమించబడిన సమయం’
  rationale: ‘సమయం’ మూలపదంలోని సహజ విస్తృతిని కాపాడుతుంది; దైవనియామక భావాన్ని సాధ్యమైన ప్రత్యామ్నాయంగా పాదటిప్పణిలో చూపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన సహజ శైలిని ఉపయోగించాం. ‘పైకి వెళ్లండి’ అనే పదానువాదం తెలుగులో అసహజంగా ఉండటంతో సందర్భోచితంగా ‘వెళ్లండి’ వాడాం; పాఠాంతరం వల్ల కలిగే వ్యాఖ్యాన ఉద్రిక్తతను పాదటిప్పణిలో స్పష్టంగా కాపాడాం.
