id: JHN.7.41
reference: John 7:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: te
  text: మరికొందరు, “ఈయనే మెస్సీయ” అని అంటున్నారు. అయితే ఇంకొందరు, “మెస్సీయ గలిలయ నుండి రాడు కదా?” అని అంటున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: మరికొందరు
  rationale: జనసమూహంలోని మరో వర్గాన్ని సూచించే బహువచన విశేషణం; తరువాతి విరుద్ధ వర్గంతో సహజమైన పోలికను నిలుపుతుంది.
- source_word: ἔλεγον
  choice: అని అంటున్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే వినిపిస్తున్న మాటలను సూచిస్తుంది; తెలుగు కథనశైలిలో వర్తమాన రూపం ఆ సజీవతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Οὗτός ἐστιν
  choice: ఈయనే
  rationale: వ్యక్తిని గుర్తిస్తూ బలంగా సూచించే సహజమైన గౌరవప్రద తెలుగు రూపం.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός పేరు వలె కాక, ఎదురుచూస్తున్న అభిషిక్తుని బిరుదుగా వాడబడింది; ‘మెస్సీయ’ ఆ యూదు నిరీక్షణ నేపథ్యాన్ని నిలుపుతుంది.
- source_word: οἱ δὲ
  choice: అయితే ఇంకొందరు
  rationale: δέ సూచించే వ్యత్యాసాన్ని, వేరొక వర్గాన్ని తెలిపే బహువచన ఆర్టికల్‌ను స్పష్టంగా మరియు సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Μὴ γὰρ
  choice: … వస్తాడా?
  rationale: μή ప్రతికూల సమాధానాన్ని ఆశించే ప్రశ్నను సూచిస్తుంది; సందర్భంలోని అభ్యంతర/అవిశ్వాస ధోరణిని తెలుగు ప్రశ్నారూపమే సహజంగా మోస్తుంది, γάρ బలాన్ని విడిగా కృత్రిమంగా అనువదించలేదు.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: గలిలయ నుండి
  rationale: ἐκ ఇక్కడ మూలస్థానం లేదా Herkunftను సూచిస్తుంది; ‘నుండి’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: ἔρχεται
  choice: వస్తాడా
  rationale: మెస్సీయ ఎక్కడి నుండి వస్తాడనే సాధారణ నిరీక్షణను తెలిపే వర్తమాన రూపం; ప్రశ్నార్థక తెలుగులో సహజంగా మార్చబడింది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వచనంలో జనసమూహం ఎదురుచూస్తున్న అభిషిక్తుడు ఎవరో చర్చిస్తోంది. అందువల్ల పేరులా వినిపించే రూపం కంటే యూదు మెస్సీయ నిరీక్షణను వెల్లడించే ‘మెస్సీయ’ను ఎంచుకున్నాం.
- issue: μή γάρ ప్రశ్నలోని ప్రతికూల నిరీక్షణ
  choice: మెస్సీయ గలిలయ నుండి వస్తాడా?
  alternative: మెస్సీయ గలిలయ నుండి రాడు కదా?
  rationale: గ్రీకు ప్రశ్న ప్రతికూల సమాధానాన్ని ఆశిస్తుంది. ప్రధాన పాఠంలోని సరళ ప్రశ్న అభ్యంతర స్వరాన్ని సందర్భం ద్వారా నిలుపుతూ సహజంగా ఉంటుంది; ‘రాడు కదా?’ ఆ భావాన్ని మరింత స్పష్టంగా చేసినా మూలంలోని రూపాన్ని కొద్దిగా విస్తరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, కథనానికి తగిన గౌరవప్రదమైన సంభాషణా శైలిలో రూపొందించబడింది. మూలంలో లేని వివరణను చేర్చలేదు; అలంకారిక ప్రశ్నలోని ప్రతికూల నిరీక్షణను సందర్భానికి వదిలి సహజమైన ప్రశ్నగా ఉంచింది.
