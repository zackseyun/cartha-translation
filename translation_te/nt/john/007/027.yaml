id: JHN.7.27
reference: John 7:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: te
  text: అయితే ఇతడు ఎక్కడివాడో మనకు తెలుసు; కానీ మెస్సీయ వచ్చినప్పుడు ఆయన ఎక్కడివాడో ఎవరికీ తెలియదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందున్న చర్చతో వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: τοῦτον
  choice: ఇతడు
  rationale: యేసును ఉద్దేశించిన సూటి, కొంత సూచనాత్మకమైన పురుషవాచక సర్వనామం.
- source_word: οἴδαμεν
  choice: మనకు తెలుసు
  rationale: మాట్లాడుతున్నవారికి ఇప్పటికే ఉన్న జ్ఞానాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πόθεν ἐστίν
  choice: ఎక్కడివాడో
  rationale: వ్యక్తి మూలం లేదా వచ్చిన ప్రాంతాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; రెండు ఉపవాక్యాల్లోనూ పునరుక్తిని నిలుపుతుంది.
- source_word: ὁ δὲ χριστός
  choice: కానీ మెస్సీయ
  rationale: δέ వ్యత్యాసాన్ని కొనసాగిస్తుంది; χριστός ఇక్కడ ఎదురుచూస్తున్న అభిషిక్తుని బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
- source_word: ὅταν ἔρχηται
  choice: వచ్చినప్పుడు
  rationale: భవిష్యత్తులో ఆయన రాకను ఆశించే అనిశ్చిత కాలసూచనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐδεὶς γινώσκει
  choice: ఎవరికీ తెలియదు
  rationale: సార్వత్రిక నిరాకరణను సహజమైన తెలుగు ప్రయోగంలో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ పదం పేరులా కాక, యూదులు ఎదురుచూస్తున్న అభిషిక్తుని బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ ఆ సందర్భాన్ని నిలుపుతుంది.
- issue: మెస్సీయ మూలం గురించి జనసమూహపు వాదన స్వభావం
  choice: వారి మాటను వివరణ జోడించకుండా నేరుగా నివేదించడం
  alternative: ‘మెస్సీయ ఎక్కడి నుంచి వస్తాడో ఎవరికీ తెలియదు’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: ఇది కథకుని సిద్ధాంత ప్రకటన కాక, జనసమూహం చెప్పిన అభిప్రాయం. దాని నిజానిజాలను అనువాదం తేల్చకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, వాక్య గౌరవాన్ని నిలుపుకునేలా రూపకల్పన చేయబడింది. ‘ఎక్కడివాడో’ అనే పునరావృతం గ్రీకు మూలంలోని πόθεν ἐστίν భావసామ్యాన్ని కాపాడుతుంది.
