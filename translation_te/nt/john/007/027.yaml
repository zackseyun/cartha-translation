  source_fidelity: 'The draft accurately represents the two contrasting clauses: the speakers claim to know this man''s origin, whereas they claim that no one knows the Messiah''s origin when he comes. The repeated Telugu expression “ఎక్కడివాడో” appropriately retains the repeated πόθεν ἐστίν. “మెస్సీయ” correctly renders χριστός here as the anticipated messianic title.'
