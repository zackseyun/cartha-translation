  text: μὴ κρίνετε κατ’ ὄψιν, ἀλλὰ τὴν δικαίαν κρίσιν ⸀κρίνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: te
  text: పైకి కనిపించేదాన్ని బట్టి[a] తీర్పు తీర్చకండి; కానీ న్యాయమైన తీర్పు తీర్చండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “బాహ్య రూపాన్ని బట్టి తీర్పు తీర్చకండి; కానీ నీతియుక్తమైన తీర్పు తీర్చండి.”'
    reason: κατ’ ὄψινకు ‘బాహ్య రూపం’ అనే సమీప ప్రత్యామ్నాయాన్ని, δικαίαν κρίσινకు ‘నీతియుక్తమైన తీర్పు’ అనే ప్రత్యామ్నాయాన్ని నమోదు చేయడం.
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: తీర్పు తీర్చకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థక రూపం ఇక్కడ నిషేధాన్ని సహజంగా వ్యక్తం చేస్తుంది. క్రియ యొక్క కాలాంశాన్ని అతిగా వ్యాఖ్యానించి ‘తీర్పు తీర్చడం మానండి’ అని కాకుండా, సంక్షిప్తమైన నిషేధాజ్ఞగా అనువదించబడింది.
- source_word: κατ’ ὄψιν
  choice: బాహ్య రూపాన్ని బట్టి
  rationale: ὄψις ఇక్కడ కంటికి కనిపించే రూపం లేదా పైపై కనిపించేదాన్ని సూచిస్తుంది. ‘బాహ్య రూపాన్ని బట్టి’ అనే మాట సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి, తీర్పుకు ఆధారాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀλλὰ
  choice: ;
  rationale: గ్రీకులోని బలమైన వ్యత్యాసాన్ని తెలుగులో రెండు విరుద్ధ ఆజ్ఞలను అర్ధవిరామంతో ఎదురెదురుగా ఉంచడం సహజంగా వ్యక్తం చేస్తుంది; ‘కాని’ అని కూడా అనువదించవచ్చు.
- source_word: τὴν δικαίαν κρίσιν
  choice: న్యాయమైన తీర్పు
  rationale: δικαίαν యొక్క నైతికమైన సరి/న్యాయ గుణాన్ని, κρίσιν యొక్క తీర్పు భావాన్ని నిలుపుతుంది. తెలుగులో ‘న్యాయమైన తీర్పు తీర్చండి’ అనే నిర్మాణం గ్రీకు పదబంధానికి దగ్గరగా ఉండి అర్థవంతంగా ఉంది.
- source_word: κρίνετε
  choice: తీర్పు తీర్చండి
  rationale: మొదటి ఉపవాక్యంలో వాడిన అదే గ్రీకు క్రియను తెలుగులోనూ పునరావృతం చేసి మూలంలోని వాక్య సమాంతరతను నిలిపింది.
theological_decisions:
- issue: δικαίανను నైతిక-న్యాయ సందర్భంలో అనువదించడం
  choice: న్యాయమైన
  alternative: నీతియుక్తమైన
  rationale: ‘న్యాయమైన’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి సరైన, పక్షపాతరహిత తీర్పు భావాన్ని అందిస్తుంది. ‘నీతియుక్తమైన’ మూలంలోని నైతిక ఛాయను మరింత స్పష్టంగా చూపగలిగినా, సాధారణ పాఠకునికి కొంత గ్రాంథికంగా వినిపిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవబహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. భాష సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండేలా ఉంచబడింది; మూలంలోని ‘తీర్పు’ పదపునరుక్తి సంరక్షించబడింది.
