  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: te
  text: అయితే ఆయన సోదరులు పండుగకు వెళ్లిన తర్వాత, ఆయన కూడా వెళ్లాడు—బహిరంగంగా కాదు, రహస్యంగా ఉన్నట్టుగా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రహస్యంగా.’ గ్రీకు ప్రయోగం అక్షరార్థంగా ‘రహస్యంగా ఉన్నట్టుగా’ అని ఉంటుంది; ఇది వాక్యాన్ని కొద్దిగా మృదువుగా చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: అయితే ... తర్వాత
  rationale: ὡς ఇక్కడ కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది; δέ స్వల్పమైన కథన మలుపు లేదా వ్యత్యాసాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో రెండింటినీ ఈ నిర్మాణం తెలియజేస్తుంది.
- source_word: ἀνέβησαν ... ἀνέβη
  choice: వెళ్లిన తర్వాత ... వెళ్లాడు
  rationale: ἀναβαίνω అక్షరార్థంగా ‘పైకి వెళ్లడం’; యెరూషలేముకు యాత్రను కూడా సూచిస్తుంది. అయితే తెలుగులో ఈ సందర్భంలో ‘పైకి వెళ్లారు’ కంటే ‘వెళ్లారు’ సహజంగా ఉంది; ‘తర్వాత’ చర్యల క్రమాన్ని స్పష్టం చేస్తుంది.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ఆయన సోదరులు
  rationale: సమీప సందర్భంలో ἀδελφοί యేసు పురుష సహోదరులను సూచిస్తుంది; ‘సోదరులు’ గౌరవప్రదంగా, లింగపరంగా ఖచ్చితంగా ఉంది.
- source_word: εἰς τὴν ἑορτήν
  choice: పండుగకు
  rationale: ἑορτή సందర్భంలో పర్ణశాలల పండుగను సూచిస్తుంది. ‘పండుగ’ సాధారణ పాఠకులకు సహజమైన, ఖచ్చితమైన పదం.
- source_word: τότε καὶ αὐτὸς
  choice: ఆయన కూడా
  rationale: καὶ αὐτός లోని చేరిక భావాన్ని ‘కూడా’ నిలుపుతుంది; τότε సూచించే తరువాతి సమయాన్ని ముందున్న ‘తర్వాత’ ఇప్పటికే వ్యక్తం చేస్తుంది.
- source_word: οὐ φανερῶς
  choice: బహిరంగంగా కాదు
  rationale: φανερῶς అంటే బహిరంగంగా లేదా ప్రజలకు కనిపించే విధంగా; ఈ అనువాదం తరువాతి వ్యత్యాసంతో సహజంగా జతపడుతుంది.
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: రహస్యంగా వెళ్లినట్టుగా
  rationale: ὡς ను తొలగించకుండా ‘వెళ్లినట్టుగా’ అని అనువదించడం ద్వారా గ్రీకు వాక్యంలోని స్వల్ప అర్హతను, అస్పష్టతను నిలుపుతుంది; కేవలం ‘రహస్యంగా’ అని తేల్చివేయదు.
theological_decisions:
- issue: పండుగకు వెళ్లనని ముందుగా చెప్పిన మాటతో యేసు ఇక్కడ వెళ్లిన చర్యకు ఉన్న సంబంధం
  choice: ఆయన సోదరులు వెళ్లిన తర్వాత ఆయన కూడా, అయితే బహిరంగంగా కాకుండా, వెళ్లాడని నేరుగా అనువదించడం
  alternative: ఆయన మనసు మార్చుకున్నాడని సూచించడం లేదా 7:8తో ఉన్న ఉద్రిక్తతను వివరణాత్మకంగా సమన్వయపరచడం
  rationale: గ్రీకు పాఠ్యం కారణాన్ని వివరించదు. అందువల్ల కథనంలోని కాలవ్యత్యాసాన్ని, వెళ్లిన విధానంలోని వ్యత్యాసాన్ని మాత్రమే తెలియజేసి, theological tension ను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆయన’ ద్వారా యేసును గౌరవంగా సూచించాం. ప్రధాన పాఠ్యంలో గ్రీకు ὡς కలిగించే స్వల్ప అర్హతను నిలిపి, మరింత సరళమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
