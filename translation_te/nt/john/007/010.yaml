  source_fidelity: The temporal sequence, the additive force of ‘also,’ and the contrast ‘not openly’ are conveyed. However, ‘రహస్యంగా వెళ్లినట్టుగా’ can suggest that he merely appeared to have gone secretly, rather than qualifying the manner of his going. A small restructuring more clearly represents ἀλλὰ ὡς ἐν κρυπτῷ while retaining its qualification.
  naturalness: The draft is generally modern and natural. Recasting the final contrast avoids an awkward, potentially misleading attachment of ‘వెళ్లినట్టుగా.’
  terminology: ‘సోదరులు,’ ‘పండుగ,’ and ‘బహిరంగంగా’ are appropriate in modern standard Telugu and suit the narrative’s respectful register. ‘ఆయన’ is consistently appropriate for Jesus.
