  source_fidelity: 'మొత్తంగా మూలార్థం బాగా ప్రతిఫలించింది: ‘ఆత్మ,’ ‘తనను విశ్వసించినవారు,’ ‘పొందబోయే,’ మరియు ‘మహిమపరచబడలేదు’ అన్న ఎంపికలు గ్రీకు పాఠ్యానికి నమ్మకంగా ఉన్నాయి. అయితే οὔπω (‘ఇంకా కాదు’)లో లేని నిర్దిష్ట కాలసూచన ‘అప్పటికి’ని ప్రధాన పాఠ్యంలో రెండుసార్లు చేర్చడం అవసరం లేని వివరణాత్మక అదనం.'
