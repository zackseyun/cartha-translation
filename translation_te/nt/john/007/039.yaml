  terminology: ‘ఆత్మ’ను ఉంచడం సరైనది; మూలంలో లేని ‘పరిశుద్ధ’ను చేర్చలేదు. ‘మహిమపరచబడలేదు’ యోహాను సువార్తలోని స్థిరమైన కీలక పదానికి తగిన అనువాదం. పాదసూచికలో ‘ఇవ్వబడలేదు’ అనేది ప్రత్యామ్నాయ భావవివరణగా మాత్రమే స్పష్టంగా ఇవ్వబడింది.
