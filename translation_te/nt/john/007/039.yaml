id: JHN.7.39
reference: John 7:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: te
  text: ఆయన తనను విశ్వసించినవారు పొందబోయే ఆత్మను గురించి ఇలా చెప్పాడు. ఎందుకంటే యేసు ఇంకా మహిమపరచబడలేదు కాబట్టి, ఆత్మ ఇంకా లేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావాన్ని మరింత స్పష్టంగా చెబితే, “ఆత్మ ఇంకా ఇవ్వబడలేదు.” గ్రీకు మూలంలో అక్షరార్థంగా, “ఆత్మ ఇంకా లేదు” అని ఉంది; ఇది యేసు ఇంకా మహిమపరచబడకపోవడంతో అనుసంధానించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεύματος / πνεῦμα
  choice: ఆత్మ
  rationale: సందర్భంలో ఇది విశ్వాసులు పొందబోయే దేవుని ఆత్మను సూచిస్తుంది. మూలంలో ἅγιον లేకపోవడంతో ‘పరిశుద్ధాత్మ’ అని విస్తరించకుండా ‘ఆత్మ’ అని ఉంచాం.
- source_word: οὗ
  choice: ఆత్మను ... పొందబోయే
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజమైన ముందస్తు విశేషణ నిర్మాణంగా మార్చాం; దాని పూర్వపదమైన ‘ఆత్మ’తో సంబంధం స్పష్టంగా ఉంది.
- source_word: ἔμελλον λαμβάνειν
  choice: పొందబోయే
  rationale: μέλλωతో కూడిన క్రియారూపంలోని భవిష్యదభిముఖ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: తనను విశ్వసించినవారు
  rationale: యోహాను రచనలోని πιστεύω εἰς నిర్మాణాన్ని సహజంగా వ్యక్తపరుస్తుంది; అసమాపక భూతక్రియను అనవసర కాలవిస్తరణ లేకుండా చూపుతుంది.
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: అప్పటికి ఆత్మ ఇంకా లేడు
  rationale: ‘ఇవ్వబడలేదు’ అనే మూలంలో లేని పదాన్ని చేర్చకుండా గ్రీకు వాక్యంలోని సంక్షిప్తతను, వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతుంది. తెలుగులో ‘ఆత్మ’ను వ్యక్తిగత దైవసూచనగా తీసుకొని ‘లేడు’ వాడాం.
- source_word: ἐδοξάσθη
  choice: మహిమపరచబడలేదు
  rationale: యోహాను సువార్తలో యేసు మరణం, పునరుత్థానం, ఉన్నతీకరణతో ముడిపడిన δοξάζω పదబంధాన్ని స్థిరంగా నిలుపుతుంది.
theological_decisions:
- issue: οὔπω γὰρ ἦν πνεῦμα అనే మాటను ఆత్మ అప్పటివరకు అసలు ఉనికిలో లేడన్న భావం కలగకుండా ఎలా అనువదించాలి?
  choice: ప్రధాన పాఠ్యంలో ‘అప్పటికి ఆత్మ ఇంకా లేడు’ అనే మూలంలోని ఉద్వేగాన్ని నిలిపి, భావవివరణను పాదసూచికలో ఇవ్వడం.
  alternative: అప్పటికి ఆత్మ ఇంకా ఇవ్వబడలేదు.
  rationale: గ్రీకు పాఠ్యంలో ‘ఇవ్వబడలేదు’ లేదా ‘ప్రత్యక్షంగా లేడు’ అని లేదు. యేసు మహిమపరచబడకపోవడంతో ఈ మాటను అనుసంధానించిన మూలపాఠ్యపు సంక్షిప్తతను అనువాదం మౌనంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే మూలంలోని వేదాంతపరమైన ఉద్వేగాన్ని ఉద్దేశపూర్వకంగా నిలిపాం. ‘ఆత్మ’కు గౌరవసూచక బహువచనం ప్రయోగించకుండా, తెలుగు బైబిలు శైలికి అనుగుణమైన ఏకవచన దైవసూచన వాడాం.
