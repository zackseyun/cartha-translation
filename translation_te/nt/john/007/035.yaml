id: JHN.7.35
reference: John 7:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: te
  text: అప్పుడు యూదులు[a] ఒకరితో ఒకరు, “మనం ఇతణ్ణి కనుగొనలేనంతగా ఇతడు ఎక్కడికి వెళ్లబోతున్నాడు? గ్రీకుల మధ్య చెదరిపోయి ఉన్న యూదుల దగ్గరికి[b] వెళ్లి గ్రీకులకు బోధించబోవడం లేదుకదా?” అని చెప్పుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదయ ప్రాంతస్థులు.” గ్రీకు పదం సాధారణంగా యూదులను, కొన్ని సందర్భాల్లో యూదయ ప్రాంతానికి చెందినవారిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఇది గ్రీకుల మధ్య వివిధ ప్రాంతాల్లో చెదరిపోయి ఉన్న యూదులను సూచిస్తుంది; చెదరిపోయిన గ్రీకులను కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదానికి ఇక్కడ సహజమైన సామూహిక అర్థం ‘యూదులు.’ మూలంలో లేని ‘యూదా ప్రాంతస్థులు’ లేదా ‘యూదు నాయకులు’ అనే పరిమితిని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: πρὸς ἑαυτούς
  choice: ఒకరితో ఒకరు ... చెప్పుకున్నారు
  rationale: సందర్భంలో ఇది పరస్పర సంభాషణను సూచిస్తుంది; ఈ తెలుగు రూపం సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: Ποῦ οὗτος
  choice: ఇతడు ఎక్కడికి
  rationale: οὗτοςలో ఉన్న కొంత దూరం పెట్టే లేదా తృణీకార ధోరణిని ‘ఇతడు’ సహజంగా నిలుపుతుంది.
- source_word: μέλλει πορεύεσθαι
  choice: వెళ్లబోతున్నాడు
  rationale: μέλλω + infinitive లోని భావి ఉద్దేశం లేదా సమీప భావిని అదనపు ఉద్దేశార్థం చేర్చకుండా తెలుపుతుంది.
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: మనకు కనిపించకుండా
  rationale: పదశః ‘మేము అతణ్ణి కనుగొనలేనట్లు’ అన్న ఫలిత భావాన్ని ప్రస్తుత సందర్భంలో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సామర్థ్యలేమిని నిర్దిష్టంగా జోడించదు.
- source_word: μὴ
  choice: '...బోతున్నాడా?'
  rationale: μή ప్రతికూల సమాధానం ఆశించే ప్రశ్నను పరిచయం చేస్తుంది. తెలుగులో ప్రశ్న స్వరూపం ఆ సందేహభరిత ఊహను సహజంగా మోస్తుంది; ‘కాదా?’ అని పెడితే ఆశించిన సమాధాన దిశ తారుమారయ్యే అవకాశం ఉంది.
- source_word: διασπορὰν τῶν Ἑλλήνων
  choice: గ్రీకుల మధ్య చెదరిపోయి నివసిస్తున్న యూదుల దగ్గరికి
  rationale: διασπορά ఇక్కడ గ్రీకు జనాభా మధ్య చెదరిపోయి నివసిస్తున్న యూదులను సూచిస్తుంది, గ్రీకుల చెదరిపోవడాన్ని కాదు. స్పష్టత కోసం ‘యూదులు’ అనేది వివరణాత్మకంగా చేర్చబడింది.
- source_word: τοὺς Ἕλληνας
  choice: గ్రీకులకు
  rationale: మూలంలోని సాధారణ జాతి-సాంస్కృతిక పదాన్ని నిలుపుతుంది; దానిని విస్తృతమైన ‘అన్యజనులు’గా మార్చదు.
theological_decisions:
- issue: యోహాను వృత్తాంతంలో Ἰουδαῖοι అర్థం
  choice: యూదులు
  alternative: యూదా ప్రాంతస్థులు
  rationale: ఈ వాక్యం ప్రాంతీయ అర్థాన్ని తప్పనిసరి చేయదు. అలాగే ‘నాయకులు’ అని మూలంలో లేని పరిమితిని చేర్చకూడదు. సాధ్యమైన ప్రాంతీయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా అస్పష్టతను కాపాడాం.
- issue: διασπορὰν τῶν Ἑλλήνων నిర్మాణం
  choice: గ్రీకుల మధ్య చెదరిపోయి నివసిస్తున్న యూదులు
  alternative: గ్రీకుల చెదరిపోవడం
  rationale: యూదు వాడుకలో διασπορά అన్యజనుల మధ్య చెదరిపోయిన యూదు సముదాయాన్ని సూచిస్తుంది. τῶν Ἑλλήνωνను ఆ సముదాయం నివసించే ప్రజల/పరిసరాల సూచనగా గ్రహించడం సందర్భానికి సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘ఇతడు’ ద్వారా వక్తల దూరీకరణ ధోరణి నిలుపబడింది. ‘చెదరిపోయి నివసిస్తున్న యూదులు’ అనే వివరణ సాంకేతికమైన ‘డయాస్పోరా’ పదాన్ని నివారిస్తూ చారిత్రక భావాన్ని స్పష్టం చేస్తుంది.
