  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: te
  text: అధికారుల్లో గానీ పరిసయ్యుల్లో గానీ ఎవరైనా ఆయనపై విశ్వాసం ఉంచారా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో μή తో ప్రారంభమయ్యే ఈ ప్రశ్నకు ‘లేదు’ అనే సమాధానం ఆశించబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις
  choice: ఎవరైనా ... విశ్వసించారా?
  rationale: μή తో రూపొందిన ఈ ప్రశ్నకు ‘లేదు’ అనే సమాధానం ఆశించబడుతుంది. అయినా మూలంలోని ప్రశ్నారూపాన్ని నిలుపుతూ, దాని సూచనను ప్రధాన వాక్యంలో స్పష్ట నిరాకరణగా మార్చలేదు.
- source_word: ἐκ τῶν ἀρχόντων
  choice: అధికారుల్లో గానీ
  rationale: ఇక్కడ ἄρχοντες యూదులలో గుర్తింపు పొందిన పాలక అధికారులను సూచిస్తుంది. ‘అధికారులు’ ఆధునిక తెలుగులో సహజంగా ఉండి, వారి అధికారిక హోదాను తెలియజేస్తుంది.
- source_word: ἐπίστευσεν
  choice: విశ్వసించారా
  rationale: సరళ భూతార్థాన్ని తెలుగులో సహజమైన గౌరవ/బహువచన ప్రశ్నారూపంతో వ్యక్తం చేస్తుంది; యోహాను రచనలోని πιστεύω పదప్రయోగానికి తగిన స్థిరత్వాన్ని కాపాడుతుంది.
- source_word: εἰς αὐτόν
  choice: ఆయనను
  rationale: πιστεύω εἰς అనే నిర్మాణానికి ‘ఆయనను విశ్వసించడం’ సహజమైన ఆధునిక తెలుగు ప్రయోగం. గ్రీకు విభక్తి నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా సంబంధార్థాన్ని కాపాడుతుంది.
- source_word: ἢ
  choice: గానీ ... గానీ
  rationale: రెండు వర్గాలను ప్రత్యామ్నాయంగా కలిపే ἢ భావాన్ని తెలుగు ప్రశ్నలో సహజమైన జంట సముచ్చయంతో వ్యక్తం చేస్తుంది.
- source_word: ἐκ τῶν Φαρισαίων
  choice: పరిసయ్యుల్లో గానీ
  rationale: మొదటి వర్గానికి సమాంతరంగా, ఆ సమూహంలోని సభ్యులను సూచిస్తుంది. ‘పరిసయ్యులు’ ఆ మతవర్గానికి ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: నిరాకరణను ఆశించే అలంకారిక ప్రశ్న బలం
  choice: ‘లేదు’ అనే సమాధానాన్ని ఆశించే ప్రశ్నగానే అనువదించడం
  alternative: ‘అధికారుల్లో గానీ పరిసయ్యుల్లో గానీ ఎవరూ ఆయనను విశ్వసించలేదు కదా’ అని నిరాకరణను మరింత స్పష్టంచేయడం
  rationale: μή τις వక్తలు ‘లేదు’ అనే సమాధానాన్ని ఆశిస్తున్నారని సూచిస్తుంది; అయితే మూలపాఠం దానిని ప్రకటనగా కాక ప్రశ్నగా ఉంచుతుంది. ప్రశ్నారూపాన్ని నిలపడం వారి తృణీకార ధోరణిని చూపుతూ, మూలం చెప్పినదానికంటే ఎక్కువగా తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘గానీ ... గానీ’ నిర్మాణం రెండు వర్గాల సమాంతరతను స్పష్టంగా ఉంచుతుంది; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
