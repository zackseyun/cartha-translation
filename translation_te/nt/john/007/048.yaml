  to: అధికారుల్లో గానీ పరిసయ్యుల్లో గానీ ఎవరైనా ఆయనపై విశ్వాసం ఉంచారా?[a]
  rationale: The revision changes only the rendering of πιστεύω εἰς αὐτόν so that the Telugu explicitly conveys faith in him rather than merely believing him. The rhetorical question, its expected negative answer, and the parallel reference to rulers and Pharisees remain intact.
