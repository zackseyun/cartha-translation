id: JHN.7.31
reference: John 7:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: te
  text: అయితే జనసమూహంలోని చాలామంది ఆయనను విశ్వసించారు. వారు, “మెస్సీయ[a] వచ్చినప్పుడు ఈయన చేసినవాటికంటే ఎక్కువ సూచక క్రియలు చేయడు కదా?” అంటూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.” గ్రీకు పదమైన Χριστός ఇక్కడ యూదుల మెస్సీయ నిరీక్షణకు సంబంధించిన బిరుదుగా వాడబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: అయితే జనసమూహంలో చాలామంది
  rationale: ἐκ τοῦ ὄχλουలోని విభాగార్థాన్ని సహజమైన తెలుగులో ‘జనసమూహంలో చాలామంది’గా వ్యక్తం చేసింది; δέ సూచించే స్వల్ప వ్యత్యాసాన్ని ‘అయితే’ నిలుపుతుంది.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: ఆయనను విశ్వసించారు
  rationale: εἰς‌తో కూడిన πιστεύω ఒక వ్యక్తివైపు మళ్లిన విశ్వాసాన్ని సూచిస్తుంది. ‘ఆయనను విశ్వసించారు’ సహజంగానూ మూలానికి సమీపంగానూ ఉంది.
- source_word: ἔλεγον
  choice: అంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం సూచించే కొనసాగుతున్న లేదా పునరావృతమైన మాటలను ఈ రూపం నిలుపుతుంది.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ χριστός వ్యక్తినామంలా కాక, యూదుల నిరీక్షణలోని బిరుదుగా వాడబడింది; అందువల్ల ‘మెస్సీయ’ సందర్భానికి తగినది.
- source_word: ὅταν ἔλθῃ
  choice: వచ్చినప్పుడు
  rationale: భవిష్యత్తులో జరిగే రాకను షరతుగా కాక సహజమైన కాలసూచనగా తెలియజేస్తుంది.
- source_word: πλείονα σημεῖα
  choice: ఎక్కువ సూచక క్రియలు
  rationale: πλείονα పరిమాణపు పోలికను సూచిస్తుంది కాబట్టి ‘గొప్ప’ అనే గుణాత్మక భావానికి బదులు ‘ఎక్కువ’ వాడింది. యోహాను రచనలో σημεῖα యొక్క సూచనాత్మక ప్రాధాన్యాన్ని ‘సూచక క్రియలు’ నిలుపుతుంది.
- source_word: οὗτος ἐποίησεν
  choice: ఈయన చేసినవాటికంటే
  rationale: οὗτος యేసును జనసమూహం ప్రస్తావించే తీరును ‘ఈయన’ సహజంగా తెలియజేస్తుంది; చేసిన సూచక క్రియలు పోలికలో అంతర్భూతంగా ఉన్నందున ‘చేసినవాటికంటే’ సంక్షిప్తంగా ఉంది.
theological_decisions:
- issue: χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ‘వచ్చినప్పుడు’ అనే మాటతో ఇది నిరీక్షించబడుతున్న యూదుల మెస్సీయ బిరుదుగా స్పష్టంగా ఉంది. ప్రత్యామ్నాయ సంప్రదాయ రూపాన్ని పాదసూచికలో ఉంచింది.
- issue: μήతో కూడిన అలంకార ప్రశ్న యొక్క బలం
  choice: చేయడు కదా?
  alternative: చేస్తాడా?
  rationale: μή ప్రతికూల సమాధానాన్ని ఆశించే ప్రశ్నను సూచిస్తుంది. ‘చేయడు కదా?’ ఆ అంచనాను నిలుపుతూ, జనసమూహం యేసు సూచక క్రియలను మెస్సీయకు తగినవిగా భావిస్తున్న ఉద్వేగాన్ని అతిగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సూచక క్రియలు’ యోహాను సువార్తలోని ప్రత్యేక పదప్రయోగాన్ని కాపాడుతుంది; ‘చేయడు కదా?’ మూలంలోని అలంకార ప్రశ్నను సహజంగా వ్యక్తం చేస్తుంది.
