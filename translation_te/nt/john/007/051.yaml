- from: “ముందుగా అతని నుంచే విని, అతడు ఏమి చేస్తున్నాడో తెలుసుకోకుండా మన ధర్మశాస్త్రం ఒక మనిషికి తీర్పు తీరుస్తుందా?[a]”
  to: “ముందుగా అతని నుండి విని, అతడు ఏమి చేస్తున్నాడో తెలుసుకోకుండా మన ధర్మశాస్త్రం ఒక మనిషి విషయంలో తీర్పు ఇవ్వదు కదా?”[a]
  rationale: 'The revision makes the μή question explicitly expect a negative response, improves the legal idiom for κρίνει with its generic singular object, and retains the source order and conditions: first hearing from the person and then knowing what he is doing. The existing lexical-alternative footnote is retained, with wording adjusted to match the revised sentence.'
