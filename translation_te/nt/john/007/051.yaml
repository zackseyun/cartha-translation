id: JHN.7.51
reference: John 7:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: te
  text: “ముందుగా అతని నుండి విని, అతడు ఏమి చేస్తున్నాడో తెలుసుకోకుండా మన ధర్మశాస్త్రం ఒక మనిషి విషయంలో తీర్పు ఇవ్వదు కదా?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక వ్యక్తి విషయంలో.” గ్రీకులో సాధారణంగా ఏ వ్యక్తినైనా సూచించే ఏకవచన రూపం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: తీర్పు తీరుస్తుందా?
  rationale: వాక్యారంభంలోని μή ప్రతికూల సమాధానాన్ని ఆశించే అలంకార ప్రశ్నను సూచిస్తుంది. తెలుగులో సందర్భం ద్వారా ‘తీర్పు తీరుస్తుందా?’ అనే ప్రశ్న సహజంగా ‘తీర్చదు’ అనే సమాధానాన్ని ఆశిస్తుంది.
- source_word: ὁ νόμος ἡμῶν
  choice: మన ధర్మశాస్త్రం
  rationale: ఇది నికోదేము ప్రస్తావిస్తున్న యూదుల న్యాయ ప్రమాణాన్ని సూచిస్తుంది. ‘ధర్మశాస్త్రం’ బైబిలు సందర్భంలో νόμοςకు సహజమైన, గౌరవప్రదమైన తెలుగు పదం; ‘మన’ సమాజ సంబంధాన్ని నిలుపుతుంది.
- source_word: κρίνει
  choice: తీర్పు తీరుస్తుంది
  rationale: κρίνω ఇక్కడ న్యాయపరంగా విచారించి నిర్ణయం చేయడాన్ని సూచిస్తుంది. ‘ఖండిస్తుంది’ అని అనువదిస్తే మూలంలో అవసరం లేని దోషనిర్ణయ భావం బలపడుతుంది.
- source_word: τὸν ἄνθρωπον
  choice: ఒక మనిషికి
  rationale: ἄνθρωπον ఏ వ్యక్తినైనా సూచించే ప్రతినిధి ఏకవచనం. తెలుగు ‘ఒక మనిషి’ మూలంలోని ఏకవచన రూపాన్ని నిలుపుతూ సాధారణ వ్యక్తిని సూచిస్తుంది.
- source_word: ἐὰν μὴ
  choice: తెలుసుకోకుండా
  rationale: ἐὰν μή అవసరమైన ప్రతికూల షరతును ఇస్తుంది. తెలుగులో ‘విని... తెలుసుకోకుండా’ అనే నిర్మాణం సహజంగా ‘unless’ భావాన్ని తెలియజేస్తుంది.
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: ముందుగా అతని నుంచే విని
  rationale: παρ’ αὐτοῦ ఆ వ్యక్తి నుంచి నేరుగా వినడాన్ని సూచిస్తుంది; πρῶτον ప్రక్రియలో అది ముందుగా జరగాలని చెబుతుంది. ‘నుంచే’ ప్రత్యక్ష మూలాన్ని స్పష్టం చేస్తుంది.
- source_word: γνῷ
  choice: తెలుసుకుని
  rationale: γινώσκω ఇక్కడ కేసుకు సంబంధించిన వాస్తవాలను తెలుసుకోవడం అనే భావంలో ఉంది. ‘తెలుసుకుని’ ప్రస్తుత తెలుగు న్యాయ సందర్భంలో సహజంగా ఉంటుంది.
- source_word: τί ποιεῖ
  choice: అతడు ఏమి చేస్తున్నాడో
  rationale: వర్తమాన కాలంలోని ποιεῖను ‘ఏమి చేస్తున్నాడో’ అని అనువదించడం కొనసాగుతున్న లేదా ప్రస్తుత కార్య భావాన్ని నిలుపుతుంది.
