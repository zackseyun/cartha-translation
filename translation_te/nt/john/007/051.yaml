translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయపరమైన సందర్భాన్ని గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం. మూలంలోని అలంకార ప్రశ్నను ప్రశ్నారూపంలోనే నిలిపాం; ‘ఖండించు’ వంటి అధిక బలమైన పదాన్ని నివారించాం.
