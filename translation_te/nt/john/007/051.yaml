review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the legal setting, the prerequisite of hearing directly from the person, and learning what he is doing. However, its bare yes/no question does not adequately mark μή, which expects a negative answer. Also, “ఒక మనిషికి తీర్పు తీరుస్తుంది” is less idiomatic than expressing judgment ‘in a person’s case.’
  naturalness: “తీర్పు తీరుస్తుందా?” is understandable, but the construction with “ఒక మనిషికి” is awkward in modern standard Telugu. “ఒక మనిషి విషయంలో తీర్పు ఇవ్వదు కదా?” is natural legal Telugu and retains the generic singular.
  terminology: “మన ధర్మశాస్త్రం” appropriately renders ὁ νόμος ἡμῶν in this Jewish legal context. “తీర్పు ఇవ్వు” preserves κρίνει without importing the stronger meaning ‘condemn.’
  issues:
  - severity: medium
    issue: The negative-answer rhetorical force of Μὴ is not explicit.
    rationale: A simple Telugu question can invite either answer, whereas sentence-initial μή expects a negative reply. Adding “ఇవ్వదు కదా?” preserves that force.
  - severity: low
    issue: The phrase “ఒక మనిషికి తీర్పు తీరుస్తుంది” is not the most idiomatic legal Telugu.
    rationale: Using “ఒక మనిషి విషయంలో తీర్పు ఇవ్వు” naturally expresses judging a person/case while retaining the generic singular sense.
  revised_text: “ముందుగా అతని నుండి విని, అతడు ఏమి చేస్తున్నాడో తెలుసుకోకుండా మన ధర్మశాస్త్రం ఒక మనిషి విషయంలో తీర్పు ఇవ్వదు కదా?”[a]
