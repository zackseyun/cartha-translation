id: JHN.7.23
reference: John 7:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ περιτομὴν ⸀λαμβάνει ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: te
  text: మోషే ధర్మశాస్త్రం ఉల్లంఘించబడకూడదని[b] విశ్రాంతి దినాన ఒక మనిషి సున్నతి పొందితే[a], విశ్రాంతి దినాన నేను ఒక మనిషిని సంపూర్ణంగా స్వస్థపరిచినందుకు[c] నా మీద కోపపడుతున్నారా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సున్నతి చేయబడితే.’ గ్రీకు నుడికారం అక్షరార్థంగా ‘సున్నతి పొందితే’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పక్కన పెట్టబడకూడదని’ లేదా ‘రద్దు చేయబడకూడదని.’
    reason: lexical_alternative
  - marker: c
    text: ‘ఒక మనిషిని సంపూర్ణంగా స్వస్థపరిచాను’ అనే మాట, శరీరంలోని ఒక భాగానికి సున్నతి చేయడానికీ మొత్తం మనిషిని స్వస్థపరచడానికీ మధ్య యేసు చూపిన వ్యత్యాసాన్ని నొక్కిచెబుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  choice: సున్నతి పొందితే
  rationale: గ్రీకు నుడికారంలోని ‘సున్నతి పొందడం’ అనే రూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది; భావపరంగా ‘సున్నతి చేయబడితే’ అని కూడా చెప్పవచ్చు.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: సున్నతి సందర్భం వల్ల ఇక్కడ పురుషుడే ఉద్దేశించబడ్డాడు. అయినా తెలుగులో ‘ఒక మనిషి’ సహజంగా ఉండి మూలపదానికి దగ్గరగా ఉంటుంది.
- source_word: ἐν σαββάτῳ
  choice: విశ్రాంతి దినాన
  rationale: కాలార్థక దత్తి విభక్తిని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, యూదుల సబ్బాతును సూచిస్తుంది.
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: మోషే ధర్మశాస్త్రం ఉల్లంఘించబడకూడదని
  rationale: న్యాయసంబంధ సందర్భంలో λύω అనే పదానికి ‘ఉల్లంఘించడం’ స్పష్టమైన అర్థం; ‘రద్దు చేయడం’ లేదా ‘పక్కన పెట్టడం’ అనే సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: χολᾶτε
  choice: నా మీద కోపపడుతున్నారా
  rationale: కోపం లేదా ఆగ్రహాన్ని సూచించే క్రియను అతిశయింపకుండా సహజంగా అనువదిస్తుంది.
- source_word: ὅλον ἄνθρωπον
  choice: ఒక మనిషిని సంపూర్ణంగా
  rationale: శరీరంలోని ఒక భాగానికి సున్నతి చేయడానికీ, మొత్తం మనిషిని బాగుచేయడానికీ మధ్య ఉన్న వాక్చాతుర్యపూర్వక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ὑγιῆ ἐποίησα
  choice: స్వస్థపరిచినందుకు
  rationale: ‘ఆరోగ్యవంతునిగా చేశాను’ అనే మూల భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘సంపూర్ణంగా’తో కలిసి మొత్తం మనిషి స్వస్థతను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: విశ్రాంతి దినాన సున్నతికీ స్వస్థపరచడానికీ యేసు చేసిన పోలిక
  choice: మోషే ధర్మశాస్త్రం ఉల్లంఘించబడకుండా విశ్రాంతి దినాన సున్నతి చేయడాన్ని వారు అంగీకరిస్తే, ఒక మనిషిని సంపూర్ణంగా స్వస్థపరచడం మరింత సముచితమని యేసు ప్రశ్నిస్తున్నాడు.
  alternative: ఇది ఆచార ధర్మానికీ కరుణాపూర్వక కార్యానికీ మధ్య సాధారణ వ్యత్యాసం మాత్రమే అని అర్థం చేసుకోవడం.
  rationale: వాక్యంలోని తర్కం, శరీరంలోని ఒక భాగానికి చేసే సున్నతి నుండి మొత్తం మనిషిని స్వస్థపరచడం వైపు ‘మరింతగా’ అనే అంతర్లీన పోలికతో సాగుతుంది. అనువాదం ఆ తర్కాన్ని నిలుపుతుంది; ధర్మశాస్త్రానికి వ్యతిరేకమైన తరువాతి సిద్ధాంతపరమైన భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ‘విశ్రాంతి దినం,’ ‘ధర్మశాస్త్రం,’ ‘స్వస్థపరచడం’ వంటి విస్తృతంగా అర్థమయ్యే బైబిలు పదజాలం నిలుపబడింది; వాక్యంలోని న్యాయపరమైన మరియు వాక్చాతుర్యపూర్వక ఉద్రిక్తతను సరళీకరించలేదు.
