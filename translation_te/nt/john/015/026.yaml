id: JHN.15.26
reference: John 15:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: te
  text: “తండ్రి నుండి నేను మీ దగ్గరకు పంపబోయే సహాయకుడు[a] వచ్చినప్పుడు—అంటే, తండ్రి నుండి వెలువడే సత్యపు ఆత్మ—ఆయన నా గురించి సాక్ష్యమిస్తాడు.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహాయకుడు’ అని అనువదించిన గ్రీకు పదాన్ని ‘న్యాయవాది,’ ‘సలహాదారు,’ ‘ఆదరణకర్త’ అని కూడా అనువదించవచ్చు; లేదా ‘పారాక్లేతు’ అని లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నా గురించి సాక్ష్యం చెబుతాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: వచ్చినప్పుడు
  rationale: భవిష్యత్తులో ఎదురుచూస్తున్న సంఘటనను సూచించే కాలవాచక ఉపవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ παράκλητος
  choice: సహాయకుడు
  rationale: పక్కన ఉండి సహాయం చేసే, ప్రాతినిధ్యం వహించే వ్యక్తి అనే విస్తృత భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది; పదంలోని న్యాయవాది, ఆదరణకర్త వంటి ఇతర ఛాయలను పాదటిప్పణి ఉంచుతుంది.
- source_word: ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός
  choice: తండ్రి దగ్గర నుండి నేను మీ దగ్గరకు పంపబోయే
  rationale: ἐγώ యొక్క స్పష్టమైన కర్తృత్వాన్ని నిలుపుతూ, παρά + షష్ఠీ యొక్క మూలం/సన్నిధి భావాన్ని ‘దగ్గర నుండి’ అని వ్యక్తం చేస్తుంది.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: సత్య ఆత్మ
  rationale: యోహాను శైలిలోని షష్ఠీ నిర్మాణాన్ని సంక్షిప్తంగా, తెలుగు బైబిలు పదజాలానికి అనుగుణంగా నిలుపుతుంది.
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: తండ్రి దగ్గర నుండి బయలుదేరి వచ్చే
  rationale: ἐκπορεύεται యొక్క ‘వెలుపలికి రావడం/బయలుదేరి రావడం’ అనే నిర్దిష్ట భావాన్ని కేవలం ‘వస్తాడు’గా సపాటుచేయకుండా తెలుగులో సహజంగా తెలియజేస్తుంది; తరువాతి త్రిత్వ సిద్ధాంత పదప్రయోగాన్ని అనవసరంగా ప్రధాన వాక్యంలోకి దిగుమతి చేయదు.
- source_word: ἐκεῖνος
  choice: ఆయన
  rationale: పుంలింగ సూచక సర్వనామం ద్వారా ఆత్మను వ్యక్తిగతంగా చూపించే మూలపాఠ ధోరణిని గౌరవపూర్వక తెలుగు సర్వనామంతో నిలుపుతుంది.
- source_word: μαρτυρήσει περὶ ἐμοῦ
  choice: నా గురించి సాక్ష్యమిస్తాడు
  rationale: న్యాయస్థాన/సాక్షి భావాన్ని కాపాడుతూ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: త్రిత్వ సందర్భంలో παράκλητος అనువాదం
  choice: సహాయకుడు
  alternative: ఉత్తరవాది; ఆదరణకర్త; సలహాదారు; పారాక్లేతు
  rationale: ఒక్క తెలుగు పదం మూలపదంలోని అన్ని భావఛాయలను పట్టదు. ‘సహాయకుడు’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతూ వ్యక్తిగత పాత్రను నిలుపుతుంది; ఇతర న్యాయపరమైన, ఆదరణపరమైన భావాలను పాదటిప్పణి గుర్తిస్తుంది.
- issue: పరిశుద్ధ ఆత్మకు వ్యక్తిగత సూచన
  choice: ఆయన ... సాక్ష్యమిస్తాడు
  alternative: అది ... సాక్ష్యమిస్తుంది
  rationale: πνεῦμα వ్యాకరణపరంగా నపుంసకలింగమైనా, ἐκεῖνος పుంలింగంలో ఉండి ఆత్మ/సహాయకుణ్ణి వ్యక్తిగతంగా చూపుతుంది. తెలుగు అనువాదం ఈ వ్యక్తిగత ప్రదర్శనను నిలుపుతుంది.
- issue: ἐκπορεύεται అనువాదం
  choice: బయలుదేరి వచ్చే
  alternative: వెలువడే; బయలుదేరే; వచ్చేది; ప్రసరించే
  rationale: మూల క్రియ యొక్క చలన/మూల భావాన్ని నిలుపుతూ, తరువాతి త్రిత్వ వివాదంలో ఏర్పడిన సాంకేతిక అర్థాన్ని వాక్యంలోనే నిర్ణయాత్మకంగా రుద్దదు. ‘తండ్రి దగ్గర నుండి’ అనే మూలపాఠ పరిమితిని యథాతథంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. దీర్ఘ వాక్య నిర్మాణాన్ని డాష్‌తో స్పష్టపరచి, మూలంలోని appositional సంబంధాన్ని నిలిపాం. ‘దగ్గర నుండి’ παρά యొక్క సన్నిధి/మూల భావాన్ని, ‘బయలుదేరి వచ్చే’ ἐκπορεύεται యొక్క ప్రత్యేకతను కాపాడుతాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
