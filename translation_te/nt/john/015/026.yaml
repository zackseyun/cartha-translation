revisions:
- from: “తండ్రి దగ్గర నుండి నేను మీ దగ్గరకు పంపబోయే సహాయకుడు[a] వచ్చినప్పుడు—అంటే, తండ్రి దగ్గర నుండి బయలుదేరి వచ్చే సత్య ఆత్మ—ఆయన నా గురించి సాక్ష్యమిస్తాడు.[b]”
  to: “తండ్రి నుండి నేను మీ దగ్గరకు పంపబోయే సహాయకుడు[a] వచ్చినప్పుడు—అంటే, తండ్రి నుండి వెలువడే సత్యపు ఆత్మ—ఆయన నా గురించి సాక్ష్యమిస్తాడు.[b]”
  rationale: సవరణ ἐκπορεύεταιకు ‘వెలువడే’ అని నేరమైన, సహజమైన సమానార్థకాన్ని ఉపయోగించి, అది ἔλθῃతో భిన్నమైన క్రియ అని స్పష్టం చేస్తుంది. ‘తండ్రి నుండి’ రెండు చోట్లా మూలంలోని ఒకే పదబంధాన్ని స్థిరంగా ప్రతిబింబిస్తుంది. మిగతా వాక్యనిర్మాణం, వ్యక్తిగత సర్వనామం, మరియు సాక్ష్య-భావం నిలుపబడ్డాయి.
