source:
  edition: SBLGNT
  text: εἰ τὰ ἔργα μὴ ἐποίησα ἐν αὐτοῖς ἃ οὐδεὶς ἄλλος ⸀ἐποίησεν, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ καὶ ἑωράκασιν καὶ μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: te
  text: నేను వారి మధ్య మరెవరూ చేయని కార్యాలు చేసి ఉండకపోతే, వారికి పాపం ఉండేది కాదు[a]. కాని ఇప్పుడు వారు నన్నూ నా తండ్రినీ చూశారు, ద్వేషించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా: ‘వారికి పాపదోషం ఉండేది కాదు.’ గ్రీకు మూలంలో అక్షరార్థంగా ‘వారికి పాపం ఉండేది కాదు’ అని ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: కార్యాలు
  rationale: యోహాను సువార్తలో యేసు చేసిన వెల్లడిచేసే క్రియలను సూచించే ‘కార్యాలు’ అనే విస్తృత పదాన్ని నిలుపుతుంది; ‘అద్భుతాలు’ అని పరిమితం చేయదు.
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: వారి మధ్య ... చేసి ఉండకపోతే
  rationale: ἐν αὐτοῖςను సామాజిక/స్థానార్థకంగా ‘వారి మధ్య’ అని అనువదించాం. అవాస్తవ గత షరతును సహజమైన తెలుగు ‘చేసి ఉండకపోతే’తో వ్యక్తం చేశాం.
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: మరెవరూ చేయని
  rationale: యేసు కార్యాల అసమానతను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: వారికి పాపం ఉండేది కాదు
  rationale: గ్రీకు ‘పాపాన్ని కలిగి ఉండడం’ అనే యోహాను శైలిని వ్యాఖ్యానాత్మకంగా ‘దోషులు కారు’గా మార్చకుండా తెలుగులో సాధ్యమైనంత నేరుగా నిలుపుతుంది.
- source_word: νῦν δὲ
  choice: కాని ఇప్పుడు
  rationale: ఊహాత్మక పరిస్థితికి ప్రస్తుత వాస్తవానికి మధ్యనున్న వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: చూశారు, ద్వేషించారు
  rationale: రెండు క్రియలనూ సమానంగా ఉంచుతుంది. గ్రీకు పరిపూర్ణకాలాల ప్రస్తుత ప్రభావం సందర్భంలో స్పష్టంగా ఉండగా, తెలుగులో అసహజమైన సంయుక్త రూపాలను నివారిస్తుంది.
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: నన్నూ నా తండ్రినీ
  rationale: పునరుక్త καί ఇచ్చే ‘నన్ను కూడా, నా తండ్రిని కూడా’ అనే జతచేసే ఉద్ఘాటనను సహజమైన తెలుగు ద్వితీయావిభక్తి రూపాలతో నిలుపుతుంది.
theological_decisions:
- issue: ‘వారికి పాపం ఉండేది కాదు’ అనే మాట దోషబాధ్యతను ఎలా సూచిస్తుంది
  choice: మూలంలోని ‘పాపం కలిగి ఉండడం’ అనే భావవ్యక్తీకరణను నిలుపడం
  alternative: వారు పాపదోషులు అయ్యేవారు కాదు
  rationale: యేసు చేసిన ప్రత్యేక వెల్లడికర కార్యాలను చూసిన తరువాత వారి బాధ్యత పెరిగిందనే భావం సందర్భంలో ఉంది. అయినా మూలపాఠం దానిని ‘దోషబాధ్యత’ అనే ఒకే వివరణకు పరిమితం చేయకుండా ‘పాపం ఉండడం’ అని చెబుతుంది; ఆ వేదాంత ఉద్వేగాన్ని అనువాదం నిలుపుతుంది.
- issue: ‘చూశారు, ద్వేషించారు’ అనే రెండు క్రియల కర్మలు
  choice: రెండు క్రియలకూ ‘నన్నూ నా తండ్రినీ’ వర్తించేలా పదక్రమాన్ని ఉంచడం
  alternative: నన్నూ నా తండ్రినీ చూసి ద్వేషించారు
  rationale: ‘చూసి ద్వేషించారు’ అనడం చూడడాన్ని ద్వేషానికి కేవలం ముందస్తు చర్యగా మార్చవచ్చు. గ్రీకులో రెండు క్రియలూ సమాంతరంగా ఉద్ఘాటించబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరతను నిలుపుతూ అనువదించబడింది. ‘కార్యాలు,’ ‘వారి మధ్య,’ ‘వారికి పాపం ఉండేది కాదు’ వంటి రూపాలు యోహాను శైలినీ మూలంలోని ఉద్దేశపూర్వక భావవిస్తృతినీ కాపాడుతాయి.
