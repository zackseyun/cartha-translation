  yaml_path: translation/nt/john/015/003.yaml
  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: te
  text: ఇప్పటికే మీరు నేను మీకు చెప్పిన మాటనుబట్టి శుద్ధులుగా ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను మీకు చెప్పిన మాట ద్వారా.’
    reason: διά τὸν λόγον అనే పదబంధాన్ని కారణార్థంగా ‘మాటనుబట్టి’ లేదా సాధనార్థంగా ‘మాట ద్వారా’ అని అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: ἤδη
  choice: ఇప్పటికే
  rationale: ప్రస్తుతం అమలులో ఉన్న స్థితిని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: ὑμεῖς
  choice: మీరు
  rationale: గ్రీకులో సర్వనామం స్పష్టంగా ఉండి ఉద్ఘాటనను ఇస్తుంది; తెలుగులో ‘మీరు’ను ప్రత్యక్షంగా ఉంచడం ఆ ఉద్ఘాటనను తగినంతగా నిలుపుతుంది.
- source_word: καθαροί
  choice: శుద్ధులై
  rationale: ‘పవిత్రులు’ వంటి మరింత సిద్ధాంతపరమైన పదాన్ని నివారిస్తూ, శుభ్రపరచడం/కత్తిరించడం అనే సమీప ద్రాక్షావల్లి సందర్భంతో ఉన్న పదబంధ సంబంధాన్ని నిలుపుతుంది.
- source_word: διὰ τὸν λόγον
  choice: మాటనుబట్టి
  rationale: διά + accusative ఇక్కడ కారణాన్ని సూచించగలదు. ‘మాటనుబట్టి’ కారణార్థాన్ని సహజ తెలుగులో తెలియజేస్తూ, సాధనార్థమైన ‘మాట ద్వారా’ అనే అవకాశాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: λόγον
  choice: మాట
  rationale: యోహాను రచనలోని ‘మాట’ అనే పదప్రయోగాన్ని నిలుపుతుంది; ‘సందేశం’ లేదా ‘బోధ’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: ὃν λελάληκα
  choice: నేను మీతో చెప్పిన
  rationale: పూర్తికాల క్రియలోని గత ఉచ్చారణ మరియు కొనసాగుతున్న ఫలితాన్ని తెలుగు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; ‘మాట’తో ‘చెప్పిన’ అనేది సాధారణ ఆధునిక ప్రయోగం.
- source_word: ὑμῖν
  choice: మీతో
  rationale: తెలుగులో ‘మీతో చెప్పిన మాట’ సహజమైన నిర్మాణం; ఇది బహువచన శ్రోతలను స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: శిష్యుల శుద్ధత స్వభావం
  choice: ప్రస్తుత శుద్ధస్థితిగా అనువదించి, దానిని నిర్దిష్టమైన సిద్ధాంతపరమైన వర్గంగా నిర్వచించలేదు.
  alternative: దీనిని ప్రత్యేకంగా సంస్కార సంబంధమైన శుద్ధీకరణగా లేదా న్యాయస్థానపరమైన నీతిమంతులుగా తీర్పు పొందడంగా అనువదించడం.
  rationale: సమీప సందర్భంలో ద్రాక్షావల్లి, కత్తిరింపు/శుభ్రపరచడం అనే రూపకం ఉంది; యేసు తాను పలికిన మాటతో వారి శుద్ధతను అనుసంధానిస్తున్నాడు. మూలపాఠంలోని రూపకాన్ని, వేదాంతపరమైన విశాలతను అనువాదం కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘శుద్ధులై ఉన్నారు’ మూలంలోని καθαροί ἐστε అనే ప్రస్తుత స్థితిని నిలుపుతుంది; ‘మాట’ యోహాను పదప్రయోగాన్ని కాపాడుతుంది.
