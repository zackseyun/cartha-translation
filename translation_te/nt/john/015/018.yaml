source:
  edition: SBLGNT
  text: Εἰ ὁ κόσμος ὑμᾶς μισεῖ, γινώσκετε ὅτι ἐμὲ πρῶτον ⸀ὑμῶν μεμίσηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: te
  text: “లోకం మిమ్మల్ని ద్వేషిస్తే, అది మీకంటే ముందుగా నన్ను ద్వేషించిందని తెలుసుకోండి.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది మొదట నన్నే ద్వేషించింది—మిమ్మల్ని ద్వేషించకముందే.” గ్రీకు వాక్యంలో ‘మొదట’ అనే పదం ‘మీరు’ అనే పదంతో కలిసి కాలపరమైన పూర్వత్వాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: లోకం
  rationale: యోహాను రచనల్లో ఈ పదం దేవునికి వ్యతిరేకంగా నిలిచే మానవ లోకాన్ని సూచించగలదు. అయితే అర్థాన్ని అతిగా నిర్దిష్టం చేయకుండా, సహజమైన విస్తృతిని నిలుపుకోవడానికి ‘లోకం’ ఎంచుకున్నాం.
- source_word: μισεῖ
  choice: ద్వేషిస్తే
  rationale: వర్తమాన కాలంలోని సాధారణ లేదా కొనసాగుతున్న భావాన్ని షరతు వాక్యంలో సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γινώσκετε
  choice: తెలుసుకోండి
  rationale: ఈ రూపం వ్యాకరణపరంగా సూచనార్థకంగానూ ఆజ్ఞార్థకంగానూ ఉండగలిగినా, సందర్భంలో ఉపదేశాత్మక ఆజ్ఞగా తీసుకోవడం సహజం.
- source_word: πρῶτον ... ὑμῶν
  choice: మీకంటే ముందుగా
  rationale: πρῶτον అనే పదం ὑμῶνతో కలిసి కాలపరమైన పూర్వత్వాన్ని తెలుపుతుంది; ‘మీకంటే ముందుగా’ దాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: μεμίσηκεν
  choice: ద్వేషించింది
  rationale: గ్రీకు పరిపూర్ణ కాలం గతంలో జరిగిన ద్వేషాన్ని ప్రస్తుత సందర్భానికి సంబంధించినదిగా చూపుతుంది. తెలుగులో సహజత్వం కోసం భూతకాల రూపాన్ని వాడగా, సందర్భమే దాని కొనసాగుతున్న ప్రాసంగికతను తెలియజేస్తుంది.
- source_word: ἐμὲ
  choice: నన్ను
  rationale: గ్రీకులోని ఉద్ఘాటిత సర్వనామానికి అనుగుణంగా యేసే ముందుగా ద్వేషానికి గురయ్యాడనే పోలికను నిలుపుతుంది.
theological_decisions:
- issue: యోహాను సువార్తలో κόσμος భావం
  choice: ప్రధాన పాఠ్యంలో ‘లోకం’ అని ఉంచడం
  alternative: దేవునికి తిరుగుబాటు చేసే మానవ సమాజం / లోక వ్యవస్థ
  rationale: ఈ సందర్భంలో దేవునికి వ్యతిరేకమైన భావ ఛాయ ఉన్నప్పటికీ, వివరణాత్మక వాక్యాన్ని అనువాదంలో చేర్చి భావాన్ని ముందుగానే పరిమితం చేయకుండా మూలంలోని విస్తృతిని, ఉద్రిక్తతను నిలిపాం.
- issue: γινώσκετε యొక్క విధి
  choice: ఆజ్ఞార్థకంగా ‘తెలుసుకోండి’
  alternative: సూచనార్థకంగా ‘మీకు తెలుసు’
  rationale: షరతు వాక్యం తరువాత శిష్యులను ఉద్దేశించిన ఉపదేశంగా చదవడం ప్రసంగ ప్రవాహానికి సరిపోతుంది; అయినా గ్రీకు రూపంలోని వ్యాకరణ సందిగ్ధతను గమనించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘లోకం’ వంటి సుపరిచిత బైబిలు పదాన్ని నిలిపినా, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా ఉంచాం. అడుగుసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
