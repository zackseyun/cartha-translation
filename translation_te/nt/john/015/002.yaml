id: JHN.15.2
reference: John 15:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπὸν αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα ⸂καρπὸν πλείονα⸃ φέρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: te
  text: నాలో ఉన్న, ఫలించని ప్రతి కొమ్మను ఆయన తీసివేస్తాడు[a]; ఫలించే ప్రతి కొమ్మ మరింత ఫలించడానికి ఆయన దానిని కత్తిరిస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తీసుకుపోతాడు’; αἴρει అనే గ్రీకు పదాన్ని కొందరు ఇక్కడ ‘పైకి ఎత్తుతాడు’ అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ ‘కత్తిరిస్తాడు’ అని అనువదించిన గ్రీకు క్రియకు ‘శుభ్రపరుస్తాడు’ అనే అర్థమూ ఉంది. ఈ పదప్రయోగం ద్రాక్షతోట రూపకానికి సరిపోతుంది; తరువాతి వచనంలోని ‘శుభ్రులు’ అనే పదంతోనూ సంబంధం కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: ప్రతి కొమ్మను / ప్రతి కొమ్మ
  rationale: ఏకవచన నామవాచకంతో వచ్చిన πᾶν విభజనాత్మక భావాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘ప్రతి కొమ్మ’ సహజంగా అదే భావాన్ని తెలియజేస్తుంది.
- source_word: ἐν ἐμοὶ
  choice: నాలో ఉండి
  rationale: ‘నాలో’ అనే యోహాను సువార్తకు ప్రత్యేకమైన సంబంధ భాషను నిలుపుతూ, తెలుగు వాక్యంలో సంబంధవాచక భావం స్పష్టంగా ఉండేందుకు ‘ఉండి’ చేర్చబడింది; ఇది ‘నాలో నిలిచియుండి’ అనే విస్తృత వ్యాఖ్యానాన్ని ముందుగానే చొప్పించదు.
- source_word: μὴ φέρον καρπὸν
  choice: ఫలించని
  rationale: ఫలం ఉత్పత్తి చేయకపోవడాన్ని సహజమైన, సంక్షిప్తమైన తెలుగు వ్యవసాయ రూపకంతో వ్యక్తం చేస్తుంది.
- source_word: αἴρει
  choice: తీసివేస్తాడు
  rationale: αἴρωకు ‘తీసివేయు’ మరియు కొన్ని సందర్భాల్లో ‘పైకి ఎత్తు’ అనే అర్థాలు ఉన్నాయి. ద్రాక్షతోట రూపకంలో ఫలించని కొమ్మపై చేసే చర్యకు ‘తీసివేస్తాడు’ సరిపోతుంది; ప్రత్యామ్నాయ భావం పాదసూచికలో ఉంచబడింది.
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: ఫలించే ప్రతి కొమ్మ
  rationale: గ్రీకులో ముందు వచ్చిన κλῆμαను ఆర్టికల్-పార్టిసిపిల్ నిర్మాణం తిరిగి సూచిస్తుంది; తెలుగులో స్పష్టత కోసం ‘కొమ్మ’ను మళ్లీ పేర్కొనడం సహజం.
- source_word: καθαίρει
  choice: కత్తిరించి శుభ్రం చేస్తాడు
  rationale: ఈ క్రియ ద్రాక్షకొమ్మను కత్తిరించి సంరక్షించడాన్నీ, శుభ్రపరచడాన్నీ సూచించగలదు. సంయుక్త వ్యక్తీకరణ ద్రాక్షతోట చర్యను స్పష్టం చేస్తూనే తదుపరి వచనంలోని ‘శుభ్రులు’ అనే పదసంబంధాన్ని నిలుపుతుంది.
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: మరింతగా ఫలించడానికి
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని ‘-డానికి’ సహజంగా వ్యక్తం చేస్తుంది; πλείονα యొక్క తులనాత్మక భావాన్ని ‘మరింతగా’ నిలుపుతుంది.
theological_decisions:
- issue: మొదటి భాగంలో αἴρει అర్థం
  choice: ఆయన తీసివేస్తాడు
  alternative: ఆయన పైకి ఎత్తుతాడు
  rationale: సమీప సందర్భంలో ఫలించని కొమ్మలపై చేసే చర్య, ఫలించే కొమ్మలను కత్తిరించే చర్యతో వ్యత్యాసంగా ఉంది. ‘తీసివేస్తాడు’ ఆ వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది; అయితే ‘పైకి ఎత్తుతాడు’ అనే సాధ్యమైన పదార్థాన్ని పాదసూచికలో ఇచ్చి, దాని ఆధారంగా ఏ సిద్ధాంత నిర్ణయాన్నీ ప్రధాన పాఠంలో రుద్దలేదు.
- issue: καθαίρειలో కత్తిరింపు మరియు శుభ్రపరచడం మధ్య పదప్రయోగం
  choice: కత్తిరించి శుభ్రం చేస్తాడు
  alternative: కత్తిరిస్తాడు; శుభ్రం చేస్తాడు
  rationale: ద్రాక్షతోట రూపకంలో కొమ్మను కత్తిరించడం ప్రధాన సందర్భార్థం; అదే సమయంలో ఈ గ్రీకు క్రియలోని ‘శుభ్రపరచు’ భావం 3వ వచనంలోని καθαροίతో పదసంబంధాన్ని ఏర్పరుస్తుంది. తెలుగు సంయుక్త రూపం ఈ రెండు కోణాలనూ అనవసర సిద్ధాంత విస్తరణ లేకుండా వినిపిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వచనశైలి. ద్రాక్షతోట రూపకం మరియు యోహాను సువార్తలోని ‘నాలో’ అనే సంబంధ భాష నిలుపబడ్డాయి.
