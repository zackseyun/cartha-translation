  edition: SBLGNT
  text: ταῦτα ἐντέλλομαι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/017.yaml
  text: These things I command you[b][a], so that you may love one another.
translation:
  language: te
  text: మీరు ఒకరినొకరు ప్రేమించేలా నేను ఈ సంగతులను మీకు ఆజ్ఞాపిస్తున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “నేను మీకు ఆజ్ఞాపించేది ఇదే: ఒకరినొకరు ప్రేమించండి.” గ్రీకు వాక్యనిర్మాణం ఉద్దేశాన్ని గానీ, ఆజ్ఞలోని విషయాన్ని గానీ సూచించవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ఈ సంగతులను
  rationale: నపుంసక బహువచన సూచన సర్వనామాన్ని ప్రతిబింబిస్తుంది; ముందున్న ఉపదేశాలను సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: ἐντέλλομαι
  choice: ఆజ్ఞాపిస్తున్నాను
  rationale: వర్తమానకాల క్రియ యొక్క తక్షణ ప్రసంగ సందర్భాన్నీ, ఆజ్ఞ యొక్క స్పష్టమైన బలాన్నీ నిలుపుతుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: ద్వితీయ పురుష బహువచన దత్తివిభక్తిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα
  choice: అనే ఉద్దేశంతో
  rationale: ప్రయోజనార్థాన్ని స్పష్టంగా తెలుపుతుంది; అయితే ఈ ఉపవాక్యం ఆజ్ఞలోని విషయాన్ని కూడా సూచించవచ్చనే అవకాశాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: ἀγαπᾶτε
  choice: ప్రేమించాలనే
  rationale: ἵνα తరువాత ఉన్న వర్తమాన కర్తరి సంభావనార్థక రూపాన్ని తెలుగు ప్రయోజన నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది; కొనసాగింపు భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἀλλήλους
  choice: ఒకరినొకరు
  rationale: సమూహంలోని పరస్పర చర్యను తెలిపే సహజమైన ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: ఆజ్ఞకూ ἵνα ఉపవాక్యానికీ మధ్య సంబంధం
  choice: యేసు ఈ సంగతులను ఆజ్ఞాపించడంలోని ఉద్దేశం శిష్యులు ఒకరినొకరు ప్రేమించడమేనని ప్రధాన పాఠం చూపిస్తుంది.
  alternative: '“నేను మీకు ఆజ్ఞాపించేది ఇదే: ఒకరినొకరు ప్రేమించండి” అని, ἵνα ఉపవాక్యాన్ని ఆజ్ఞలోని విషయంగా అర్థం చేసుకోవచ్చు.'
  rationale: ἵνα సాధారణంగా ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది; అయితే యోహాను శైలిలో అది వివరణాత్మకంగా, ఆజ్ఞలోని విషయానికి దగ్గరగా కూడా ఉండవచ్చు. ప్రధాన పాఠంలో ప్రయోజనార్థాన్ని ఉంచి, నిజమైన వాక్యనిర్మాణ సందిగ్ధతను పాదటిప్పణిలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. మూలంలోని బహువచన ‘ఈ సంగతులు’ను, వర్తమాన ఆజ్ఞార్థ బలాన్ని, ἵνα ఉపవాక్యంలోని అర్థసందిగ్ధతను కాపాడింది.
