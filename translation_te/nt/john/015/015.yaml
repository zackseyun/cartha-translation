id: JHN.15.15
reference: John 15:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: te
  text: ఇకపై నేను మిమ్మల్ని బానిసలు[a] అని పిలవను. ఎందుకంటే బానిస తన యజమాని[b] ఏమి చేస్తున్నాడో తెలుసుకోడు. అయితే నేను మిమ్మల్ని స్నేహితులు అని పిలిచాను; ఎందుకంటే నా తండ్రి నుండి నేను విన్నదంతా మీకు తెలియజేశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం doulos అంటే సందర్భాన్ని బట్టి ‘బానిస,’ ‘దాసుడు,’ లేదా ‘సేవకుడు’ అని అర్థం కావచ్చు. ఇక్కడ స్నేహితులతో ఉన్న వ్యత్యాసం అధీనస్థితిని ప్రధానంగా చూపుతున్నందున ‘బానిసలు’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: మూలంలో ‘ప్రభువు’ అనే అర్థం కూడా గల గ్రీకు పదం ఉంది. ఇక్కడ అది దైవిక బిరుదుగా కాక బానిసకు అధిపతిని సూచిస్తున్నందున ‘యజమాని’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: ఇకపై ... పిలవను
  rationale: మునుపటి స్థితి ఇక కొనసాగదనే కాలార్థక నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λέγω ὑμᾶς
  choice: మిమ్మల్ని ... అని పిలవను
  rationale: ఇక్కడ λέγω కేవలం ‘చెప్పు’ అనే అర్థంలో కాక, ఒకరిని ఒక పేరుతో లేదా హోదాతో పిలవడం అనే అర్థంలో ఉంది.
- source_word: δούλους / δοῦλος
  choice: బానిసలు / బానిస
  rationale: స్నేహితులతో ఉన్న వ్యత్యాసంలో అధీనస్థితి, స్వతంత్రతలేమి ప్రధానంగా ఉన్నాయి; అందువల్ల ‘సేవకులు’ కంటే ‘బానిసలు’ మూలపదపు సామాజిక బలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οἶδεν τί ποιεῖ
  choice: ఏమి చేస్తున్నాడో తెలుసుకోడు
  rationale: οἶδα జ్ఞానాన్ని సూచిస్తుంది; వర్తమానకాలంలోని ποιεῖను కొనసాగుతున్న చర్యగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτοῦ ὁ κύριος
  choice: తన యజమాని
  rationale: ఇక్కడ κύριος దైవిక బిరుదు కాదు; బానిసపై అధికారమున్న వ్యక్తిని సూచిస్తుంది. ‘యజమాని’ ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἴρηκα
  choice: పిలిచాను
  rationale: గతంలో చేసిన నామకరణం ప్రస్తుత సంబంధానికి వర్తిస్తూనే ఉందనే భావం సందర్భం ద్వారా నిలుస్తుంది; తెలుగులో అసహజమైన పరిపూర్ణకాల రూపాన్ని బలవంతంగా వాడకుండా సహజమైన భూతకాల రూపం ఎంచుకోబడింది.
- source_word: φίλους
  choice: స్నేహితులు
  rationale: బానిసలతో వ్యత్యాసాన్ని, వారికి విషయాలు తెలియజేయడంలో కనిపించే సన్నిహిత సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πάντα ἃ
  choice: విన్నదంతా
  rationale: నపుంసక బహువచన సమగ్ర భావాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἤκουσα παρὰ τοῦ πατρός μου
  choice: నా తండ్రి నుండి నేను విన్న
  rationale: ἀκούω యొక్క ప్రాథమిక ‘విను’ అర్థాన్ని, παρά సూచించే మూలాన్ని రెండింటినీ కాపాడుతుంది.
- source_word: ἐγνώρισα ὑμῖν
  choice: మీకు తెలియజేశాను
  rationale: γνωρίζωలోని వెల్లడించడం లేదా తెలిసేలా చేయడం అనే causative భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: శిష్యుల హోదా వ్యత్యాసంలో δοῦλος అనువాదం
  choice: బానిసలు
  alternative: సేవకులు / దాసులు
  rationale: ఈ వాక్యంలో అధీనంలో ఉండి యజమాని కార్యాలు తెలియని స్థితిని, స్నేహితులుగా విషయాలు తెలిసిన స్థితితో పోల్చారు. ‘బానిసలు’ ఈ సామాజిక అసమానతను మృదువుపరచకుండా నిలుపుతుంది.
- issue: గృహసంబంధ ఉపమానంలో κύριος అనువాదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: ఇది దేవునికి లేదా మెస్సీయకు సంబంధించిన బిరుదుగా కాక, బానిసకు అధిపతిగా ఉన్న వ్యక్తిని సూచిస్తుంది; కాబట్టి ‘యజమాని’ అనవసరమైన దైవిక బిరుదు భావాన్ని రానివ్వదు.
- issue: εἴρηκα మరియు ἐγνώρισα క్రియల ఫలితాత్మక భావం
  choice: పిలిచాను ... తెలియజేశాను
  alternative: పిలిచి ఉన్నాను ... తెలియజేసి ఉన్నాను
  rationale: గ్రీకు రూపాల్లో గత కార్యానికి ప్రస్తుత ప్రాసంగికత ఉంది. తెలుగులో ‘ఉన్నాను’ కలిపిన రూపాలు ఇక్కడ భారంగా, అసహజంగా వినిపిస్తాయి; సందర్భం కొనసాగుతున్న ఫలితాన్ని స్పష్టంగా చూపుతున్నందున సహజమైన భూతకాల రూపాలు వాడబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. ‘బానిస’ మూలంలోని కఠినమైన సామాజిక హోదాను దాచదు; ‘యజమాని’ గృహసంబంధ ఉపమానాన్ని స్పష్టంగా ఉంచుతుంది. వాక్యాల మధ్య కారణసంబంధాన్ని ‘ఎందుకంటే’తో, వ్యత్యాసాన్ని ‘అయితే’తో సహజంగా చూపించబడింది.
