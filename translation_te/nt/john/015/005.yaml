id: JHN.15.5
reference: John 15:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: te
  text: నేనే ద్రాక్షతీగను; మీరు కొమ్మలు. ఎవడు నాలో నిలిచి ఉంటాడో, ఎవనిలో నేను నిలిచి ఉంటానో, అతడు సమృద్ధిగా ఫలిస్తాడు; ఎందుకంటే నన్ను విడిచి మీరు ఏమీ చేయలేరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄμπελος
  choice: ద్రాక్షతీగ
  rationale: ద్రాక్షచెట్టును సూచించే రూపకాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: κλήματα
  choice: కొమ్మలు
  rationale: ద్రాక్షతీగకు చెందిన శాఖలను సూచించే సాధారణ, సహజ తెలుగు పదం.
- source_word: ὁ μένων
  choice: నిలిచి ఉండేవాడు
  rationale: μένωలోని కొనసాగింపు, స్థిరమైన సంబంధం అనే భావాలను ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: నాలో ... అతనిలో
  rationale: పరస్పర అంతర్నివాసాన్ని సూచించే ἐν యొక్క బలమైన రూపక భాషను బలహీనపరచకుండా నిలుపుతుంది.
- source_word: φέρει καρπὸν πολύν
  choice: ఎక్కువ ఫలాన్ని ఫలిస్తాడు
  rationale: ద్రాక్షతీగ రూపకాన్ని కొనసాగిస్తూ, పరిమాణార్థక πολύνను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: χωρὶς ἐμοῦ
  choice: నాకు వేరుగా
  rationale: కేవలం సహాయం లేకపోవడం కాక, యేసు నుండి వేరుపడిన స్థితిని సూచిస్తుంది.
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: మీరు ఏమీ చేయలేరు
  rationale: నిషేధం కాక అసమర్థతను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యోహాను రచనలోని పరస్పర అంతర్నివాస భాష
  choice: నాలో నిలిచి ఉండేవాడు, అతనిలో నేను నిలిచి ఉంటే
  alternative: నాతో ఉండేవాడు, అతనితో నేను ఉంటే
  rationale: ἐνను ‘లో’గా ఉంచడం యేసు మరియు శిష్యుని మధ్య పరస్పర సంబంధ ఐక్యతలోని గాఢతను, ఉద్వేగాన్ని కాపాడుతుంది.
- issue: αὐτῷ అనే పుంలింగ ఏకవచన రూపం
  choice: అతనిలో
  alternative: ఆ వ్యక్తిలో
  rationale: మూలంలోని వ్యాకరణ పుంలింగ ఏకవచనాన్ని నిలుపుతూ, ఇది ప్రతినిధి ప్రయోగంగా ఏ శిష్యునికైనా వర్తిస్తుందనే విషయాన్ని సందర్భానికి వదిలిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ద్రాక్షతీగ రూపకం, పరస్పర ‘లో’ భాష, అసమర్థత ప్రకటన నేరుగా నిలుపబడ్డాయి.
