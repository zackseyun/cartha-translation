review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the emphatic inclusion of the disciples, their witness, the causal clause, and their continuing association with Jesus from the beginning. “ఆరంభం నుంచీ” appropriately leaves the referent of “beginning” unspecified, as does the Greek.
  naturalness: “సాక్ష్యమిస్తున్నారు” is understandable but less natural in modern standard Telugu than the spaced verbal expression “సాక్ష్యం ఇస్తున్నారు.” Reordering “మీరు” before the temporal phrase also yields a smoother sentence without changing emphasis or meaning.
  terminology: “సాక్ష్యం ఇస్తున్నారు” accurately represents μαρτυρεῖτε in its witness/testimony sense. The alternative “సాక్ష్యమిస్తున్నారు” is retained in the footnote as a compact lexical alternative. No theological or historical specification should be added to “ఆరంభం నుంచీ.”
