id: JHN.15.27
reference: John 15:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς δὲ μαρτυρεῖτε, ὅτι ἀπ’ ἀρχῆς μετ’ ἐμοῦ ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/027.yaml
  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: te
  text: మీరు కూడా సాక్ష్యం ఇస్తున్నారు[a], ఎందుకంటే మీరు ఆరంభం నుంచీ నాతో ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సాక్ష్యమిస్తున్నారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: మీరు కూడా
  rationale: మునుపటి వచనంలోని ఆత్మ సాక్ష్యంతో శిష్యుల సాక్ష్యాన్ని కలుపుతూ, స్పష్టంగా ఉన్న ὑμεῖς యొక్క ఉద్ఘాటనను మరియు δέ యొక్క స్వల్ప కొనసాగింపు/వ్యత్యాస భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μαρτυρεῖτε
  choice: సాక్ష్యమిస్తున్నారు
  rationale: వర్తమాన కాల, కర్తరి ప్రయోగ, బహువచన రూపాన్ని నిలుపుతూ న్యాయసంబంధమైన ‘సాక్ష్యమివ్వడం’ భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: శిష్యులు సాక్ష్యమివ్వడానికి కారణాన్ని పరిచయం చేసే భావమే సందర్భంలో అత్యంత సహజం.
- source_word: ἀπ’ ἀρχῆς
  choice: ఆరంభం నుంచీ
  rationale: కాలారంభ బిందువు నుంచి కొనసాగింపును సహజంగా వ్యక్తం చేస్తుంది; అది ఏ ఆరంభమో ప్రధాన పాఠ్యంలో నిర్దిష్టీకరించదు.
- source_word: μετ’ ἐμοῦ
  choice: నాతో
  rationale: సహవాసం లేదా సాంగత్యాన్ని సరళంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἐστε
  choice: ఉన్నారు
  rationale: గ్రీకు వర్తమాన కాలాన్ని నేరుగా నిలుపుతుంది; ‘ఆరంభం నుంచీ’ అనే కాలపదబంధం తెలుగులో గతం నుంచి వర్తమానం వరకు కొనసాగుతున్న స్థితిని సహజంగానే సూచిస్తుంది.
theological_decisions:
- issue: ‘ఆరంభం నుంచీ’ అనే మాట పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘ఆరంభం నుంచీ’ అని మాత్రమే ఉంచి దాని పరిధిని నిర్దిష్టీకరించలేదు.
  alternative: యేసు బహిరంగ పరిచర్య ఆరంభం నుంచీ అని స్పష్టంగా చేర్చడం; లేదా సంపూర్ణమైన ఆదిని సూచించేదిగా చదవడం.
  rationale: తక్షణ సందర్భం శిష్యులు యేసుతో కలసి ఉన్న చారిత్రక అనుభవం వల్ల సాక్షులుగా ఉండడాన్ని సూచించినా, మూలపాఠ్యం ‘పరిచర్య’ వంటి వివరణాత్మక పదాన్ని చేర్చదు. అందువల్ల అసలు వాక్యంలోని విస్తృతతను, సాధ్యమైన ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధనను వాడాం. వాక్యం సంక్షిప్తంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది; గ్రీకు వర్తమాన కాలం మరియు కొనసాగుతున్న స్థితి రెండూ తెలుగులో సహజంగా వినిపించేలా రూపొందించాం.
