source:
  edition: SBLGNT
  text: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ πρόφασιν οὐκ ἔχουσιν περὶ τῆς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: te
  text: నేను వారి దగ్గరకు వచ్చి వారితో మాట్లాడి ఉండకపోతే, వారికి పాపం ఉండేది కాదు[a]. కానీ ఇప్పుడు వారి పాపం విషయంలో వారికి ఏ సాకూ లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు పాపం విషయంలో దోషులు అయ్యేవారు కాదు,” లేదా “వారికి పాపదోషం ఉండేది కాదు.” గ్రీకులో అక్షరార్థంగా, “వారికి పాపం ఉండేది కాదు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారి పాపం గురించి వారికి ఏ సమర్థనా లేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: నేను వచ్చి వారితో మాట్లాడకపోయి ఉంటే
  rationale: గతంలో వాస్తవానికి విరుద్ధమైన షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; καί కలిపిన ‘వచ్చి... మాట్లాడడం’ అనే రెండు చర్యలనూ నిలుపుతుంది.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: వారికి పాపం ఉండేది కాదు
  rationale: ‘పాపం కలిగి ఉండడం’ అనే యోహాను వాడుకను సాధ్యమైనంత నేరుగా నిలుపుతూ, ‘దోషులు అయ్యేవారు కాదు’ అని వ్యాఖ్యానాత్మకంగా పరిమితం చేయదు.
- source_word: νῦν δὲ
  choice: కానీ ఇప్పుడు
  rationale: ఊహాత్మక గత పరిస్థితికి ప్రస్తుత వాస్తవానికి మధ్య ఉన్న స్పష్టమైన వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: చెప్పుకోవడానికి వారికి ఏ సాకూ లేదు
  rationale: πρόφασις ఇక్కడ ‘సాకు/సమర్థనకు ఆధారం’ అనే భావం ఇస్తుంది; ఈ తెలుగు రూపం ప్రస్తుత స్థితిని స్పష్టంగా, సహజంగా చెబుతుంది.
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: వారి పాపం విషయంలో
  rationale: περί + షష్ఠీ విభక్తిలోని ‘గురించి/విషయంలో’ భావాన్ని నిలుపుతుంది; దానిని కేవలం కారణార్థకమైన ‘పాపానికి’గా మార్చదు.
theological_decisions:
- issue: ἁμαρτίαν οὐκ εἴχοσαν అనేది సంపూర్ణ పాపరాహిత్యాన్నా, లేక యేసు వెల్లడిని తిరస్కరించిన విషయంలో బాధ్యత లేకపోవడాన్నా సూచిస్తుంది?
  choice: వారికి పాపం ఉండేది కాదు
  alternative: ఈ పాపానికి వారు దోషులు అయ్యేవారు కాదు
  rationale: సందర్భం యేసు వచ్చి మాట్లాడిన తరువాత ఆయనను తిరస్కరించిన బాధ్యతను సూచించినప్పటికీ, గ్రీకు వాక్యం నేరుగా ‘పాపం ఉండేది కాదు’ అంటుంది. కాబట్టి ప్రధాన పాఠ్యంలో ఆ వేదాంత ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరంగా ఉంది. ‘పాపం ఉండేది కాదు’ అనే అసాధారణమైనప్పటికీ ముఖ్యమైన యోహాను పదప్రయోగాన్ని ఉద్దేశపూర్వకంగా నిలిపింది.
