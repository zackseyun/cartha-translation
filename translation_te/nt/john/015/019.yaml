id: JHN.15.19
reference: John 15:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: te
  text: మీరు లోకం నుండి వచ్చినవారై ఉంటే[a], లోకం తనవారినే ప్రేమించేది. కానీ మీరు లోకం నుండి వచ్చినవారు కాదు; నేను మిమ్మల్ని లోకం నుండి ఎన్నుకున్నాను కాబట్టి, లోకం మిమ్మల్ని ద్వేషిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘లోకానికి చెందినవారై ఉంటే’ అని కూడా అనువదించవచ్చు. గ్రీకు ἐκ τοῦ κόσμου అనే పదబంధం మూలాన్ని లేదా అనుబంధాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: లోకం నుండి వచ్చినవారు
  rationale: ἐκ యొక్క ‘నుండి’ అనే మూలార్థాన్ని కనిపించేలా ఉంచుతూ, వ్యక్తుల మూలం లేదా వారి అనుబంధం అనే రెండు భావాలకు చోటిస్తుంది. తెలుగులో వాక్యం సహజంగా ఉండేందుకు ‘వచ్చినవారు’ చేర్చబడింది.
- source_word: κόσμος
  choice: లోకం
  rationale: యోహాను రచనలో ఈ పదానికి ఉన్న విస్తృత నైతిక-ఆధ్యాత్మిక భావాన్ని నిలుపుతుంది; ‘దేవునికి విరోధమైన లోక వ్యవస్థ’ వంటి వివరణను మూలపాఠ్యంలోకి చేర్చదు.
- source_word: ἂν ... ἐφίλει
  choice: ప్రేమించేది
  rationale: వాస్తవానికి విరుద్ధమైన షరతు ఫలితాన్ని సహజమైన తెలుగు షరతు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: τὸ ἴδιον
  choice: తనవారిని
  rationale: తనకు చెందినవారు అనే సందర్భార్థాన్ని సహజంగా తెలుపుతుంది; మూలంలోని సంక్షిప్త నామవాచక ప్రయోగాన్ని అనవసరంగా విస్తరించదు.
- source_word: φιλέω
  choice: ప్రేమించేది
  rationale: μισέωతో ఉన్న స్పష్టమైన వ్యతిరేకతను నిలుపుతూ, సాధారణ పాఠకులకు సహజమైన పదాన్ని వాడుతుంది.
- source_word: ὅτι δὲ
  choice: అయితే ... కాదు
  rationale: షరతుతో ఉన్న వ్యత్యాసాన్ని తెలుగులో సహజంగా చూపుతుంది; తరువాతి వాక్యాలు కారణాన్ని స్పష్టం చేస్తాయి.
- source_word: ἐξελεξάμην
  choice: ఎన్నుకున్నాను
  rationale: యేసు చేసిన ఎంపికను నేరుగా తెలుపుతుంది; మధ్యమ వాచ్యాన్ని ‘నా కోసం’ అని అతిగా విశదీకరించదు.
- source_word: ἐκ τοῦ κόσμου
  choice: లోకంలో నుండి
  rationale: ἐξελεξάμηνతో కలిసి ఉన్నప్పుడు లోకం మధ్యనుండి ఎంపిక చేసిన భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τοῦτο
  choice: అందుకే
  rationale: ముందు చెప్పిన కారణం వల్ల కలిగిన ఫలితాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: μισεῖ
  choice: ద్వేషిస్తుంది
  rationale: వర్తమానకాలంలోని నిరంతర వాస్తవాన్ని, ప్రేమకు విరుద్ధమైన బలమైన భావాన్ని యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: యోహాను సందర్భంలో ‘లోకం’ అనే పదం అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘లోకం’ అని మాత్రమే ఉంచడం
  alternative: ‘దేవునికి విరోధమైన మానవ వ్యవస్థ’ అని వివరణాత్మకంగా అనువదించడం
  rationale: ఇక్కడ లోకం యేసుకు విరోధంగా ఉన్న నైతిక-ఆధ్యాత్మిక పరిధిని సూచించినప్పటికీ, ఒకే వివరణతో దాని భావపరిధిని కుదించకుండా యోహాను వాడిన వర్గాన్ని నిలుపుతుంది.
- issue: ἐξελεξάμηνలోని ఎంపిక భావానికి సిద్ధాంతపరమైన విస్తరణ
  choice: ‘నేను మిమ్మల్ని ... ఎన్నుకున్నాను’ అని నేరుగా అనువదించడం
  alternative: ముందస్తు నిర్ణయం గురించి ఏదైనా ప్రత్యేక సంప్రదాయ సిద్ధాంతాన్ని సూచించేలా విస్తరించడం
  rationale: ఈ వచనం యేసు శిష్యులను ఎన్నుకున్నాడని స్పష్టంగా చెబుతుంది; అయితే తరువాత ఏర్పడిన సిద్ధాంతపరమైన వివాదాలను ఈ వచనం స్వయంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ‘లోకం’ పద పునరావృతాన్ని, ప్రేమ–ద్వేషం వ్యతిరేకతను నిలుపుతూ, సిద్ధాంతపరమైన అదనపు వివరణలను నివారించింది.
