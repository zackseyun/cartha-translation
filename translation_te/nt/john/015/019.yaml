  naturalness: “లోకం నుండి వచ్చినవారు” అనేది ఆధునిక తెలుగులో అర్థవంతంగా ఉన్నప్పటికీ, ఈ సందర్భంలో అది భౌతిక మూలస్థానాన్ని కొంత ఎక్కువగా సూచించవచ్చు. “లోకానికి చెందినవారు” చాలా సహజం; అయితే ἐκ యొక్క మూలం/చెందుదల విస్తృతిని ప్రధాన పాఠ్యంలో నిలుపుటకు ప్రస్తుత పదబంధాన్ని ఉంచవచ్చు. సవరించిన వాక్యనిర్మాణం కారణాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
