translation:
  language: te
  text: మీరు నా స్నేహితులు, నేను మీకు ఆజ్ఞాపించే వాటిని మీరు చేస్తే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపానుగుణంగా: “మీరు నా స్నేహితులు, నేను మీకు ఆజ్ఞాపించే వాటిని మీరు చేస్తే.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: మీరు
  rationale: బహువచన ద్వితీయ పురుష సర్వనామం గ్రీకులో ఉద్ఘాటనతో ముందుంది. తెలుగులో కర్తను స్పష్టంగా ఉంచడం ద్వారా ఆ ఉద్ఘాటనను సహజంగా కొంత నిలుపుతుంది.
- source_word: φίλοι μού
  choice: నా స్నేహితులు
  rationale: φίλοι సంబంధపూర్వక సాన్నిహిత్యాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘స్నేహితులు’ సహజమైన, స్పష్టమైన సమానార్థకం.
- source_word: ἐστε
  choice: మీరు ... స్నేహితులు
  rationale: వర్తమాన స్థితిని తెలిపే ‘ఉన్నారు/అవుతారు’ అనే వేరే క్రియను బలవంతంగా చేర్చకుండా, తెలుగు నామవాచక విధేయ వాక్య నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: ἐὰν
  choice: చేస్తే
  rationale: ఉపవాక్యంలోని షరతును తెలుగు షరతార్థక క్రియారూపం ‘-తే’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: ποιῆτε
  choice: మీరు చేస్తే
  rationale: ποιέω ఇక్కడ ఆజ్ఞలను ఆచరించడం లేదా అమలు చేయడాన్ని సూచిస్తుంది. ‘చేస్తే’ సరళమైన సమానార్థకం; ‘చేస్తూ ఉంటే’ అని అనువదించడం వర్తమాన కాలపు నిరంతరత్వాన్ని అతిగా నిర్దిష్టం చేస్తుంది.
- source_word: ἃ
  choice: వాటిని
  rationale: నపుంసక బహువచన సంబంధ సర్వనామం యేసు ఆజ్ఞాపించే విషయాలను సూచిస్తుంది. ‘ఆజ్ఞాపించేవాటిని’ అనే నిర్మాణం మూలంలోని బహువచన భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἐγὼ
  choice: నేను
  rationale: గ్రీకులో స్పష్టంగా ఉన్న కర్త సర్వనామానికి ఉద్ఘాటన ఉంది. తెలుగులో ‘నేను’ను వ్యక్తంగా ఉంచడం దానిని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἐντέλλομαι
  choice: ఆజ్ఞాపించు
  rationale: ఈ క్రియ అధికారపూర్వకమైన ఆదేశాన్ని తెలియజేస్తుంది. ‘ఆజ్ఞాపించు’ దాని బలాన్ని ‘బోధించు’ లేదా ‘సూచించు’ కంటే మెరుగ్గా కాపాడుతుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: బహువచన దత్తివాచక పరోక్ష కర్మను తెలుగులో ‘మీకు’ సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: విధేయతకు స్నేహంతో ఉన్న షరతుబద్ధ సంబంధం
  choice: ‘చేస్తే’ అనే స్పష్టమైన షరతుగా అనువదించడం
  alternative: ‘చేసినప్పుడు’ అనే కాలార్థక నిర్మాణం
  rationale: ἐὰν మరియు సంభావనార్థక క్రియారూపం సాధారణంగా షరతును వ్యక్తపరుస్తాయి. ఈ అనువాదం స్నేహం మరియు విధేయత మధ్య వాక్యంలో ఉన్న సంబంధాన్ని నిలుపుతుంది; అయితే సంపాదన, రక్షణ లేదా పట్టుదల గురించిన విస్తృత సిద్ధాంతాన్ని ఇందులో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే గౌరవప్రదంగా ఉంది. షరతును స్పష్టంగా ఉంచి, మూలంలోని ‘ఆజ్ఞాపించే వాటిని’ అనే బహువచన భావాన్ని ప్రధాన పాఠ్యంలో నిలిపింది.
