id: JHN.15.21
reference: John 15:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: te
  text: కానీ నా పేరు కారణంగా వారు మీకు ఇవన్నీ చేస్తారు[a]. ఎందుకంటే వారికి నన్ను పంపినవారు తెలియరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీకు విరోధంగా చేస్తారు.’ గ్రీకు పదబంధం శిష్యులపైకి ఉద్దేశించబడిన శత్రుత్వపూరిత చర్యలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: కానీ
  rationale: ముందున్న మాటతో బలమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ταῦτα πάντα
  choice: ఇవన్నీ
  rationale: సూచనార్థక భావాన్ని, సంపూర్ణతను సంక్షిప్తంగా మరియు సహజంగా నిలుపుతుంది.
- source_word: ποιήσουσιν
  choice: చేస్తారు
  rationale: భవిష్యత్ క్రియారూపాన్ని నేరుగా ప్రతిబింబిస్తూ, క్రియ యొక్క విస్తృత అర్థాన్ని పరిమితం చేయదు.
- source_word: εἰς ὑμᾶς
  choice: మీకు
  rationale: శిష్యులవైపు మళ్లిన చర్యను విస్తృతంగా సూచిస్తుంది; సందర్భంలోని వైరభావాన్ని పాఠ్యంలో అతిగా నిర్దిష్టం చేయదు.
- source_word: διὰ τὸ ὄνομά μου
  choice: నా పేరు కారణంగా
  rationale: διά + ద్వితీయా విభక్తి తెలిపే కారణాన్ని స్పష్టంగా వ్యక్తం చేస్తూ, ‘పేరు’లోని వ్యక్తిత్వం మరియు అధికార ప్రతినిధిత్వాన్ని నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: హింసాత్మక చర్యలకు వివరణాత్మక కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: οὐκ οἴδασιν
  choice: ఎరుగరు
  rationale: సమాచారపరమైన తెలుసుకోవడమే కాక సంబంధపూర్వక పరిచయాన్ని కూడా సూచించగల యోహాను శైలిలోని భావాన్ని గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: τὸν πέμψαντά με
  choice: నన్ను పంపినవాణ్ణి
  rationale: నామవాచకంగా పనిచేసే కృదంతాన్ని సహజంగా అనువదిస్తూ, మూలంలో లేని ‘తండ్రి’ అనే బిరుదును చేర్చదు.
theological_decisions:
- issue: ‘నన్ను పంపినవాడు’ అనే వ్యక్తి ఎవరు
  choice: నన్ను పంపినవాణ్ణి
  alternative: నన్ను పంపిన తండ్రిని
  rationale: యోహాను సందర్భంలో తండ్రి సూచించబడుతున్నప్పటికీ, గ్రీకు పాఠ్యంలో ‘తండ్రి’ అనే నామం లేదు. అందువల్ల సూచనను స్పష్టం చేసి విస్తరించకుండా మూలరూపాన్ని నిలుపుతుంది.
- issue: ‘నా పేరు’ యొక్క భావం
  choice: నా పేరు కారణంగా
  alternative: నా నిమిత్తం
  rationale: ‘నా నిమిత్తం’ భావాన్ని సులభతరం చేసినా, మూలంలోని ὄνομα అనే ముఖ్యమైన పదాన్నీ దాని ప్రతినిధిత్వ సంబంధమైన భావాన్నీ నిలుపుకోవడానికి ‘పేరు’ను ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఎరుగరు’ సాధారణ ‘తెలియదు’ కంటే కొద్దిగా ఉన్నతమైనదైనా, సంబంధపూర్వక జ్ఞాన భావాన్ని సంక్షిప్తంగా మోస్తుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
