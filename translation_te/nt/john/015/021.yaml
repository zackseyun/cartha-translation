revisions:
- from: కానీ నా పేరు కారణంగా వారు ఇవన్నీ మీకు చేస్తారు[a]. ఎందుకంటే నన్ను పంపినవాణ్ణి వారు ఎరుగరు.
  to: కానీ నా పేరు కారణంగా వారు మీకు ఇవన్నీ చేస్తారు[a]. ఎందుకంటే వారికి నన్ను పంపినవారు తెలియరు.
  rationale: The revision modernizes the archaic ‘ఎరుగరు’ while preserving the source’s relational ‘know’ and its implicit reference to the one who sent Jesus. The main text continues to render εἰς ὑμᾶς broadly as ‘మీకు’; the footnote retains ‘against you’ as a viable hostile contextual nuance. No theological title or interpretation has been added.
