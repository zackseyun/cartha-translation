source:
  edition: SBLGNT
  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: te
  text: తండ్రి నన్ను ప్రేమించినట్లే, నేను కూడా మిమ్మల్ని ప్రేమించాను; నా ప్రేమలో నిలిచి ఉండండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులోని రెండు క్రియలూ ఏఓరిస్టు రూపంలో ఉన్నాయి; వాటిని ఇక్కడిలా సరళ భూతకాలంతో అనువదించవచ్చు. సందర్భంలో ఈ ప్రేమకు కొనసాగుతున్న ప్రాముఖ్యత ఉంది, కానీ క్రియారూపాలు స్వతహాగా కొనసాగుతున్న చర్యను సూచించవు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: ప్రేమించినట్లే
  rationale: తండ్రి యేసును ప్రేమించడానికి, యేసు శిష్యులను ప్రేమించడానికి మధ్య ఉన్న పోలికను ‘అలాగే/అట్లే’ అనే భావంతో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἠγάπησέν
  choice: ప్రేమించిన
  rationale: గ్రీకు ఏఓరిస్టును సహజమైన తెలుగు భూతకాల రూపంతో అందిస్తుంది; సందర్భంలో ఆ ప్రేమ యొక్క కొనసాగుతున్న ప్రాముఖ్యతకు అడ్డుకాదు.
- source_word: ὁ πατήρ
  choice: తండ్రి
  rationale: యోహాను సందర్భంలో దేవుణ్ణి యేసు తండ్రిగా సూచించే గౌరవప్రదమైన, సహజమైన పదం.
- source_word: κἀγὼ
  choice: నేను కూడా
  rationale: καί యొక్క అనుసంధాన భావాన్నీ ἐγώ యొక్క ఉద్ఘాటననూ, ముందున్న పోలికకు అనుగుణతనూ నిలుపుతుంది.
- source_word: ὑμᾶς
  choice: మిమ్మల్ని
  rationale: ద్వితీయ పురుష బహువచన కర్మను ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἠγάπησα
  choice: ప్రేమించాను
  rationale: ఏఓరిస్టు రూపాన్ని సరళ భూతకాలంతో అనువదించి, మొదటి క్రియతో కాలసంబంధ సమాంతరతను నిలుపుతుంది.
- source_word: μείνατε
  choice: నిలిచి ఉండండి
  rationale: μένω అనే యోహానీయ భావంలోని కొనసాగడం, విడిచిపెట్టకుండా ఉండడం అనే అర్థాలను సహజంగా అందిస్తుంది; ‘నివసించండి’ కంటే ఈ సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: నా ప్రేమలో
  rationale: అధికారసూచక ἐμῇని సహజంగా వ్యక్తం చేస్తూ, ἀγάπηకి సాధారణమైన ‘ప్రేమ’ పదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἀγάπη యొక్క అనువాదం
  choice: ప్రేమ
  alternative: దాతృత్వం
  rationale: ఇక్కడ సంబంధాత్మకమైన ప్రేమ ఉద్దేశించబడింది; ‘ప్రేమ’ ఆధునిక తెలుగులో సహజం, విస్తృతం, మరియు మతసంఘ ప్రత్యేక భావాన్ని చేర్చదు.
- issue: ἠγάπησέν / ἠγάπησα ఏఓరిస్టు క్రియల కాల-దృక్కోణం
  choice: 'సరళ భూతకాలం: ‘ప్రేమించినట్లే / ప్రేమించాను’'
  alternative: 'కొనసాగుతున్న ఫలితాన్ని స్పష్టీకరించే రూపం: ‘ప్రేమిస్తూ వచ్చాడు / ప్రేమిస్తూ వచ్చాను’'
  rationale: గ్రీకు ఏఓరిస్టు ప్రేమ కార్యాలను సమగ్రంగా చూపుతుంది; తెలుగు సరళ భూతకాలం దీనిని నేరుగా నిలుపుతుంది. సందర్భం వాటి కొనసాగుతున్న ప్రాముఖ్యతను తెలియజేస్తుంది; దానిని క్రియారూపంలో తప్పనిసరిగా చేర్చి అర్థాన్ని అధికంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బహువచన సంబోధన. ‘నిలిచి ఉండండి’ అనే రూపం సాధారణ పాఠకులకు స్పష్టంగా ఉండి యోహాను సువార్తలోని μένω భావాన్ని నిలుపుతుంది.
