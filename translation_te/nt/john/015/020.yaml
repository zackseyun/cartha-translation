id: JHN.15.20
reference: John 15:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: te
  text: 'నేను మీకు చెప్పిన మాటను జ్ఞాపకం ఉంచుకోండి: ‘బానిస[a] తన యజమానికంటే గొప్పవాడు కాదు.’ వారు నన్ను హింసించినట్లయితే, మిమ్మల్ని కూడా హింసిస్తారు; వారు నా మాటను పాటించినట్లయితే[b], మీ మాటను కూడా పాటిస్తారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సేవకుడు.’ గ్రీకు పదం δοῦλος సందర్భాన్ని బట్టి ‘బానిస’ లేదా ‘సేవకుడు’ అని అర్థమివ్వగలదు. ఇక్కడ యజమానితో హోదాపరమైన వ్యత్యాసం నొక్కిచెప్పబడుతున్నందున ‘బానిస’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా మాటకు లోబడినట్లయితే.’ ఇక్కడ ‘నా మాటను పాటించడం’ అనేది యేసు సందేశాన్ని స్వీకరించడాన్నీ దానికి విధేయంగా జీవించడాన్నీ కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: జ్ఞాపకం ఉంచుకోండి
  rationale: వర్తమానకాల ఆజ్ఞారూపంలోని నిరంతర జ్ఞాపకార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν
  choice: నేను మీకు చెప్పిన మాటను
  rationale: ఇక్కడ λόγος యేసు ఇంతకుముందు చెప్పిన నిర్దిష్ట వాక్యాన్ని సూచిస్తుంది; ‘మాట’ దాని ఏకవచన రూపాన్నీ యోహాను వాడుకలోని అనుసంధానాన్నీ నిలుపుతుంది.
- source_word: δοῦλος
  choice: బానిస
  rationale: κύριος‌తో ఉన్న హోదాపరమైన వ్యత్యాసంలో అధీనస్థితి ప్రధానంగా ఉన్నందున ‘బానిస’ మూలపద బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μείζων
  choice: గొప్పవాడు
  rationale: హోదా లేదా ప్రాముఖ్యతలో అధికత అనే విస్తృత పోలికను అనవసరంగా సంకుచితం చేయకుండా నిలుపుతుంది.
- source_word: κυρίου
  choice: యజమాని
  rationale: ఇక్కడ κύριος దైవిక బిరుదుగా కాక బానిసపై అధికారం గల వ్యక్తిని సూచిస్తుంది; అందువల్ల ‘యజమాని’ సందర్భోచితం.
- source_word: ἐδίωξαν / διώξουσιν
  choice: హింసించినట్లయితే / హింసిస్తారు
  rationale: యేసు మరియు శిష్యుల పట్ల శత్రుత్వం ఉన్న ఈ సందర్భంలో διώκω తటస్థంగా వెంటపడటాన్ని కాక హింసించటాన్ని సూచిస్తుంది.
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: పాటించినట్లయితే / పాటిస్తారు
  rationale: ‘మాటను పాటించడం’ అనే సహజ తెలుగు ప్రయోగం సందేశాన్ని స్వీకరించి దానికి విధేయంగా నడుచుకోవడం అనే τηρέω భావాన్ని ఇస్తుంది.
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: నా మాటను ... మీ మాటను
  rationale: యేసు మాటకూ శిష్యులు ప్రకటించే మాటకూ మధ్య ఉన్న మూలంలోని సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: δοῦλος అనే సామాజిక హోదా పదం
  choice: బానిస
  alternative: సేవకుడు
  rationale: ఈ సామెతలో బానిస–యజమాని హోదా అసమానతే వాదనకు ఆధారం. ‘సేవకుడు’ సాధ్యమైన అర్థమే అయినా, అది అధీనస్థితి తీవ్రతను తగ్గించవచ్చు; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: τηρέω మరియు ‘మాట’కు ప్రతిస్పందన
  choice: మాటను పాటించడం
  alternative: మాటకు లోబడడం; మాటను స్వీకరించి అనుసరించడం
  rationale: యోహాను రచనలో ఈ పదం యేసు సందేశాన్ని స్వీకరించడం మరియు దానికి విధేయంగా జీవించడం రెండింటినీ కలిగి ఉండవచ్చు. ప్రధాన అనువాదం సహజంగా ఉండేలా చేసి, ఈ భావవిస్తృతిని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ఆజ్ఞ, సామెత, రెండు సమాంతర షరతు వాక్యాలు నిలుపబడ్డాయి. ‘బానిస’ మూలంలోని సామాజిక అధీనతను స్పష్టంగా ఉంచగా, ‘పాటించడం’ తెలుగు వాడుకలో సహజతను మరియు యోహాను భావవిస్తృతిని సమతుల్యం చేస్తుంది.
