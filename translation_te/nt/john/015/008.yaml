id: JHN.15.8
reference: John 15:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐδοξάσθη ὁ πατήρ μου ἵνα καρπὸν πολὺν φέρητε καὶ ⸀γένησθε ἐμοὶ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: te
  text: మీరు సమృద్ధిగా ఫలించి నా శిష్యులవడంలో నా తండ్రి మహిమపరచబడతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ఇందులోనే
  rationale: ముందున్న ద్రాక్షావల్లి రూపకంతో సంబంధాన్ని ఉంచుతూ, వెంట వచ్చే ఫలించడం మరియు శిష్యులవడం ఈ మహిమకు సంబంధించిన విధానమని సహజంగా తెలియజేస్తుంది.
- source_word: ἐδοξάσθη
  choice: మహిమపరచబడతాడు
  rationale: గ్రీకు ఏఓరిస్ట్ పాసివ్‌ను తెలుగు సందర్భంలో సహజమైన వర్తమాన/ఫలిత భావంతో అందిస్తూ, తండ్రి మహిమ పొందుతాడనే పాసివ్ భావాన్ని కాపాడుతుంది.
- source_word: καρπὸν πολὺν φέρητε
  choice: మీరు విస్తారంగా ఫలిస్తే
  rationale: ద్రాక్షావల్లి రూపకాన్ని నిలుపుతూ, 'చాలా ఫలం ఫలించడం' కంటే ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: γένησθε ἐμοὶ μαθηταί
  choice: నా శిష్యులవుతారు
  rationale: γένησθε లోని 'అవడం/కావడం' భావాన్ని కాపాడుతుంది; ఇప్పటికే శిష్యులని నిరూపించుకోవడం అనే వ్యాఖ్యానాన్ని మూలపాఠ్యంలోకి చేర్చదు.
theological_decisions:
- issue: ἵνα ద్వారా ఫలించడం, శిష్యులవడం తండ్రి మహిమతో ఎలా సంబంధించాయి
  choice: మొదటి వాక్యంలో షరతు-ఫలిత నిర్మాణం, తరువాత 'ఇందులోనే' అని మహిమను పేర్కొనడం
  alternative: '‘ఇందువల్ల నా తండ్రి మహిమపరచబడతాడు: మీరు విస్తారంగా ఫలించి నా శిష్యులవాలి’'
  rationale: ἵνα ఉద్దేశం, ఫలితం, వివరణ అనే భావాల మధ్య కొంత విస్తృతిని కలిగి ఉంది. ఎంచుకున్న రూపం తండ్రి మహిమ ఫలించడం మరియు శిష్యులవడంతో ముడిపడి ఉందని స్పష్టం చేస్తూ, అతిగా సిద్ధాంతీకరించదు.
- issue: γένησθε యొక్క పాఠాంతరం మరియు శిష్యత్వ భావం
  choice: ‘నా శిష్యులవుతారు’
  alternative: ‘నా శిష్యులని నిరూపించుకుంటారు’
  rationale: SBLGNTలోని γένησθε ను నేరుగా అనుసరిస్తుంది. ‘నిరూపించుకుంటారు’ అనేది కొన్ని పాఠాంతరాలు లేదా వ్యాఖ్యానాల ప్రభావాన్ని చేర్చగలదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకుడికి అర్థమయ్యే శైలి. వాక్యక్రమాన్ని సహజ తెలుగు కోసం మార్చినా, మూలంలోని ప్రధాన సంబంధాలు మరియు ‘శిష్యులవడం’ అనే ఉద్రిక్తతను నిలిపింది.
