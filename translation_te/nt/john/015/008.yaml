revisions:
- from: మీరు విస్తారంగా ఫలిస్తే, నా శిష్యులవుతారు. ఇందులోనే నా తండ్రి మహిమపరచబడతాడు.
  to: మీరు సమృద్ధిగా ఫలించి నా శిష్యులవడంలో నా తండ్రి మహిమపరచబడతాడు.
  rationale: The revision removes the unsupported ‘if ... then’ construction and expresses the Greek relationship by locating the Father’s glorification in the disciples’ bearing much fruit and becoming Jesus’ disciples. It preserves the SBLGNT reading γένησθε (‘become’) rather than replacing it with ‘prove yourselves to be.’ No footnote is needed because the supplied source text has no indicated textual uncertainty or required explanatory anchor.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:30:42Z'
review_pass:
  verdict: revise
  source_fidelity: The draft changes the Greek ἵνα clause into a conditional-result statement ('if you bear fruit, you will become'), whereas the source presents the Father’s glorification in connection with/for the purpose that the disciples bear much fruit and become Jesus’ disciples. The proposed revision retains both coordinated actions without introducing an unsupported conditional relationship.
  naturalness: ‘విస్తారంగా ఫలిస్తే’ is understandable but less idiomatic for καρπὸν πολὺν φέρητε and requires a conditional construction not present in the Greek. ‘సమృద్ధిగా ఫలించి’ is natural modern Telugu in the vine-and-fruit context. The revised sentence order is clear and idiomatic.
  terminology: ‘నా తండ్రి,’ ‘మహిమపరచబడతాడు,’ and ‘నా శిష్యులవడం’ appropriately retain the personal, passive, and becoming senses of the Greek. ‘సమృద్ధిగా ఫలించడం’ preserves the fruit-bearing metaphor without importing a specific doctrinal interpretation.
  issues:
  - severity: high
    issue: Conditional-result relation introduced
    rationale: The wording ‘మీరు విస్తారంగా ఫలిస్తే, నా శిష్యులవుతారు’ makes fruit-bearing a condition whose result is becoming disciples. Greek ἵνα coordinates ‘bear much fruit’ and ‘become my disciples’ as the content associated with the Father’s glorification; it does not state this conditional sequence.
  - severity: medium
    issue: Source clause order and linkage obscured
    rationale: Placing ‘ఇందులోనే నా తండ్రి మహిమపరచబడతాడు’ after the conditional sentence makes ‘ఇందులోనే’ refer backward imprecisely and weakens the direct connection of both following actions with the Father’s glorification.
  revised_text: మీరు సమృద్ధిగా ఫలించి నా శిష్యులవడంలో నా తండ్రి మహిమపరచబడతాడు.
  revised_footnotes: []
  revision_rationale: The revision removes the unsupported ‘if ... then’ construction and expresses the Greek relationship by locating the Father’s glorification in the disciples’ bearing much fruit and becoming Jesus’ disciples. It preserves the SBLGNT reading γένησθε (‘become’) rather than replacing it with ‘prove yourselves to be.’ No footnote is needed because the supplied source text has no indicated textual uncertainty or required explanatory anchor.
