  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: te
  text: 'అయితే, వారి ధర్మశాస్త్రంలో రాయబడి ఉన్న వాక్యం నెరవేరేలా ఇది జరిగింది: “వారు నన్ను కారణం లేకుండా ద్వేషించారు.”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “అయితే, వారి ధర్మశాస్త్రంలో రాయబడి ఉన్న వాక్యం నెరవేరేలా.” గ్రీకులో ప్రధాన వాక్యం అధ్యాహారంగా ఉంది; సందర్భాన్ని బట్టి “ఇది జరిగింది” అని పూరించబడింది.'
    reason: lexical_alternative
  - marker: b
    text: “వారి ధర్మశాస్త్రం” అనే మాట ఇక్కడ విస్తృత అర్థంలో యూదుల లేఖనాలను సూచిస్తుంది; ఈ ఉల్లేఖనం కీర్తనల నుండి వచ్చింది (కీర్తనలు 35:19; 69:4 చూడండి).
    reason: cross_reference
  - marker: c
    text: లేదా “ఏ కారణమూ లేకుండా”; “నిష్కారణంగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: అయితే
  rationale: ముందటి వాక్యంతో ఉన్న వ్యతిరేక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἵνα πληρωθῇ
  choice: నెరవేరేలా
  rationale: ἵνα తో కూడిన కర్మణి సంభావనార్థక క్రియలోని ఉద్దేశం/ఫలితం భావాన్ని, అతిగా నిర్ణయాత్మకంగా చేయకుండా వ్యక్తపరుస్తుంది.
- source_word: ὁ λόγος
  choice: వాక్యం
  rationale: ఇక్కడ λόγος యోహాను 1లోని తాత్త్విక ‘వాక్కు’ భావం కాక, లేఖనంలోని నిర్దిష్ట ఉక్తిని సూచిస్తుంది.
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: వారి ధర్మశాస్త్రంలో రాయబడి ఉన్న
  rationale: γεγραμμένος లోని ‘రాయబడి నిలిచి ఉన్న’ పరిపూర్ణ కర్మణి భావాన్ని కాపాడుతూ, αὐτῶν ను స్పష్టంగా నిలుపుతుంది.
- source_word: νόμῳ
  choice: ధర్మశాస్త్రం
  rationale: ఉల్లేఖనం కీర్తనల నుండి వచ్చినప్పటికీ, గ్రీకు νόμος పదాన్ని నిలుపుతూ అది విస్తృతంగా యూదుల లేఖనాలను సూచించగలదనే ఉద్వేగాన్ని భద్రపరుస్తుంది.
- source_word: ὅτι
  choice: ':'
  rationale: లేఖన వాక్యంలోని విషయాన్ని పరిచయం చేసే ὅτι భావాన్ని తెలుగులో ద్విబిందువు సహజంగా సూచిస్తుంది.
- source_word: Ἐμίσησάν με
  choice: వారు నన్ను ... ద్వేషించారు
  rationale: గ్రీకు ఏకకాల భూతకాల క్రియను సహజమైన సాధారణ భూతకాలంగా అనువదిస్తుంది.
- source_word: δωρεάν
  choice: కారణం లేకుండా
  rationale: ప్రతిఫలం లేకుండా అనే సాధారణ అర్థం కాక, ఈ సందర్భంలో ‘ఏ కారణమూ లేకుండా/నిష్కారణంగా’ అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: కీర్తన నుండి వచ్చిన ఉల్లేఖనాన్ని ‘వారి ధర్మశాస్త్రం’ అని పిలవడం
  choice: νόμος ను ‘ధర్మశాస్త్రం’గానే అనువదించి, అది ఇక్కడ విస్తృత యూద లేఖనాలను సూచిస్తుందని పాదసూచికలో వివరించడం.
  alternative: ప్రధాన పాఠ్యంలోనే ‘వారి లేఖనాలు’ అని అనువదించడం.
  rationale: మూలంలోని పదాన్ని మార్చకుండా ఉంచుతుంది; అదే సమయంలో ఉల్లేఖనం కీర్తనలలోనిదనే ఉద్వేగాన్ని పరిష్కరించకుండా వివరిస్తుంది.
- issue: ἀλλ’ తరువాత గ్రీకులో ప్రధాన వాక్యం అధ్యాహారంగా ఉండడం
  choice: సహజమైన తెలుగు కోసం ‘ఇది జరిగింది’ అని పూరించడం.
  alternative: ‘అయితే, ... వాక్యం నెరవేరేలా’ అని అధ్యాహార నిర్మాణాన్ని అలాగే ఉంచడం.
  rationale: ముందటి సందర్భం సూచించే ఘటనను స్పష్టపరుస్తుంది; కొత్త సిద్ధాంతపరమైన విషయం జోడించదు.
- issue: ἵνα πληρωθῇ లో ఉద్దేశం మరియు ఫలితం మధ్య భావ ఉద్వేగం
  choice: ‘నెరవేరేలా’ అని అనువదించడం.
  alternative: ‘నెరవేరడానికి’ లేదా ‘నెరవేరింది కాబట్టి’ అని అనువదించడం.
  rationale: గ్రీకు నిర్మాణంలోని ఉద్దేశం/ఫలితం భావసాధ్యతను పూర్తిగా ఒక వైపుకు పరిమితం చేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘ధర్మశాస్త్రం’ అనే స్థిర బైబిలు పదాన్ని నిలిపి, దాని విస్తృత సందర్భార్థాన్ని పాదసూచికలో వివరించాం. ఉల్లేఖనానికి తెలుగు ద్విగుణ ఉద్ధరణ చిహ్నాలు వాడాం.
