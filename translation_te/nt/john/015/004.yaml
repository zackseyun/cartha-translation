id: JHN.15.4
reference: John 15:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: te
  text: నాలో నిలిచి ఉండండి[a], నేనూ మీలో. ద్రాక్షతీగలో నిలిచి ఉంటే తప్ప కొమ్మ తనంతట తానే ఫలించలేనట్లే, నాలో నిలిచి ఉంటే తప్ప మీరూ ఫలించలేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాలో నివసిస్తూ ఉండండి.” μένω అనే గ్రీకు క్రియ కొనసాగుతూ ఉండడం, స్థిరంగా నిలవడం, సంబంధంలో నివసించడం అనే భావాలను వ్యక్తం చేయగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: నిలిచి ఉండండి / నిలిచి ఉంటే
  rationale: μένω అనే కీలక క్రియలోని కొనసాగింపు, స్థిరత్వం, సంబంధంలో ఉండటం అనే భావాలను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; పదపునరావృతాన్ని కూడా సాధ్యమైనంతవరకు కాపాడుతుంది.
- source_word: ἐν ἐμοί
  choice: నాలో
  rationale: ἐν లోని అంతర్గత సంబంధం లేదా ఐక్యత భావాన్ని ‘నాతో’ అని కేవలం సహవాసంగా మార్చకుండా కాపాడుతుంది.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: నేనూ మీలో
  rationale: గ్రీకులో క్రియ స్పష్టంగా లేకపోవడంతో తెలుగులోనూ సంక్షిప్తమైన అసంపూర్ణ వాక్య నిర్మాణాన్ని ఉంచి, ‘నేను మీలో నిలిచి ఉంటాను’ అనే వివరణను అదనంగా చేర్చలేదు.
- source_word: τὸ κλῆμα
  choice: కొమ్మ
  rationale: ద్రాక్షతీగ రూపకంలో κλῆμα అంటే తీగనుంచి పెరిగే కొమ్మ లేదా రెమ్మ; సాధారణ పాఠకునికి ‘కొమ్మ’ స్పష్టంగా ఉంటుంది.
- source_word: οὐ δύναται καρπὸν φέρειν
  choice: ఫలించలేను / ఫలించలేరు
  rationale: సామర్థ్యలేమిని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, καρπὸν φέρειν అనే వ్యవసాయ రూపకాన్ని ‘ఫలించడం’గా నిలుపుతుంది.
- source_word: ἀφ’ ἑαυτοῦ
  choice: తనంతట తానే
  rationale: స్వతంత్రంగా లేదా తనలోనుంచే చేయలేకపోవడం అనే భావాన్ని సహజమైన తెలుగు నుడికారంలో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ ἀμπέλῳ
  choice: ద్రాక్షతీగలో
  rationale: ‘అంటుకొని’ వంటి వివరణాత్మక పదాన్ని చేర్చకుండా ἐν ను ‘లో’గా, ἄμπελος ను సందర్భానుసారంగా ‘ద్రాక్షతీగ’గా అందిస్తుంది.
theological_decisions:
- issue: శిష్యత్వం మరియు ఐక్యత సందర్భంలో μένω అనువాదం
  choice: నిలిచి ఉండు
  alternative: నివసించు / ఉండిపో
  rationale: ‘నిలిచి ఉండు’ కొనసాగుతున్న సంబంధం, స్థిరత్వం, విశ్వాసపూర్వక కొనసాగింపు అనే భావాలను కలిగిస్తుంది; కేవలం స్థల నివాసం లేదా తాత్కాలికంగా ఉండిపోవడం అనే భావానికి పరిమితం కాదు.
- issue: κἀγὼ ἐν ὑμῖν లోని క్రియారహిత పరస్పర వాక్యభాగం
  choice: నేనూ మీలో
  alternative: నేనూ మీలో నిలిచి ఉంటాను
  rationale: మూలంలో స్పష్టమైన క్రియ లేదు. సంక్షిప్త నిర్మాణాన్ని నిలపడం ద్వారా ఇది ఆజ్ఞకు ప్రతిఫలమైన వాగ్దానమా, పరస్పర నివాసానికి పిలుపా అనే వ్యాకరణాత్మక ఉద్వేగాన్ని అనవసరంగా పరిష్కరించదు.
- issue: చివరి ఉపవాక్యంలో గ్రీకులో సూచితమైన ఫలించే సామర్థ్యం
  choice: మీరూ ఫలించలేరు
  alternative: మీరూ అలాగే
  rationale: οὐ δύναται καρπὸν φέρειν అనే ముందరి భావం οὕτως οὐδὲ ὑμεῖς లో కొనసాగుతుంది. తెలుగులో పూర్తి అర్థం రావడానికి ‘ఫలించలేరు’ను పూరించడం అవసరం; కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వక బహువచన సంబోధనను ఉపయోగించాం. వాక్యం సాధారణ పాఠకునికి సహజంగా ఉండేలా నిర్మించబడింది; అదే సమయంలో ‘నాలో/మీలో’, ‘నిలిచి ఉండడం’, ద్రాక్షతీగ–కొమ్మ రూపకం, గ్రీకు క్రియారహిత పరస్పర వాక్యభాగం కాపాడబడ్డాయి.
