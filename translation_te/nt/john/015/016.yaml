id: JHN.15.16
reference: John 15:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: te
  text: మీరు నన్ను ఎన్నుకోలేదు[a]; కానీ నేనే మిమ్మల్ని ఎన్నుకొని, మీరు వెళ్లి ఫలించడానికి, మీ ఫలం నిలిచి ఉండడానికి మిమ్మల్ని నియమించాను; మీరు నా పేరున తండ్రిని[b] ఏది అడిగినా, ఆయన మీకు దానిని ఇచ్చునట్లు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎంచుకోలేదు’ అని కూడా అనువదించవచ్చు. ఈ క్రియకు ‘ఎన్నిక చేసుకోవడం’ అనే అనువాదం సాధ్యమే అయినా, ఇక్కడ సాంకేతిక ధార్మిక పదార్థాన్ని ముందుగానే నిర్ధారించకుండా ‘ఎన్నుకోవడం’ వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పాఠ్యంలో ‘తండ్రిని’ అని ఉంది; ‘నా తండ్రిని’ అని లేదు.
    reason: textual_clarification
  - marker: c
    text: అక్షరార్థానికి దగ్గరగా, ‘ఆయన మీకు దానిని ఇచ్చేలా’ అని అనువదించవచ్చు. చివరి వాక్యభాగం ఉద్దేశాన్ని లేదా ఫలితాన్ని సూచించే ἵναతో మొదలవుతుంది.
    reason: syntactical_ambiguity
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: ఎన్నుకోలేదు / ఎన్నుకున్నాను
  rationale: ἐκλέγομαι యొక్క సాధారణ అర్థమైన ‘ఎన్నుకోవడం’ను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘ఎన్నిక చేసుకోవడం’ వంటి సాంకేతిక ధార్మిక పదజాలాన్ని ప్రధాన పాఠ్యంలోకి తీసుకురాదు.
- source_word: ἔθηκα
  choice: నియమించాను
  rationale: τίθημι అక్షరార్థంగా ‘ఉంచడం’ అయినా, ఇక్కడ వెళ్లి ఫలించాలనే ఉద్దేశంతో శిష్యులకు బాధ్యత అప్పగించడాన్ని సూచిస్తుంది. ‘నియమించాను’ ఆ ఉద్దేశపూర్వక అప్పగింతను తెలియజేస్తుంది; ఒక సంఘ పదవికి అభిషేకించారనే అర్థానికి పరిమితం చేయదు.
- source_word: ἵνα
  choice: -డానికి / అప్పుడు
  rationale: మొదటి రెండు ప్రయోగాల్లో ఉద్దేశాన్ని తెలుగు క్రియార్థక నిర్మాణంతో వ్యక్తం చేశాం. చివరి ἵναను ‘అప్పుడు’గా అనుసంధానించడం ఉద్దేశం లేదా ఫలితం రెండింటికీ వీలున్న సంబంధాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ὑπάγητε
  choice: వెళ్లి
  rationale: ὑπάγωలోని విస్తృతమైన ‘వెళ్లడం’ అనే భావాన్ని కాపాడుతుంది; మిషన్ అనే భావాన్ని స్పష్టీకరిస్తూ మూలంలో లేని పదాన్ని చేర్చదు.
- source_word: καρπὸν φέρητε
  choice: ఫలించడానికి
  rationale: ‘ఫలం ఫలించడం’ అనే అసహజ పునరుక్తిని తప్పిస్తూ, యోహాను సందర్భంలోని ఫల రూపకాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: μένῃ
  choice: నిలిచి ఉండడానికి
  rationale: μένω సూచించే కొనసాగడం లేదా నిలకడగా ఉండడం అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὅ τι ἂν αἰτήσητε
  choice: ఏది అడిగినా
  rationale: ἄνతో కూడిన అనిర్దిష్ట విస్తృతిని ‘ఏది ... అయినా’ నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది; ప్రార్థనా సందర్భంలో αἰτέωకు ‘అడగడం’ సరిపోతుంది.
- source_word: ἐν τῷ ὀνόματί μου
  choice: నా పేరున
  rationale: యేసు పేరుతో చేసే అభ్యర్థనలోని సంబంధాత్మక, అధికార సంబంధమైన భావాలను ముందుగానే ఒకే వివరణకు పరిమితం చేయకుండా సంప్రదాయబద్ధమైన, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δῷ
  choice: అనుగ్రహిస్తాడు
  rationale: ఇవ్వడాన్ని గౌరవప్రదమైన ప్రార్థనా సందర్భానికి తగిన తెలుగులో వ్యక్తం చేస్తుంది. చివరి ἵνα ఆధీన క్రియారూపం యొక్క ఉద్దేశ/ఫలిత సంబంధాన్ని వాక్య అనుసంధానం మోస్తుంది; తెలుగు ప్రధాన క్రియకు అసహజమైన సంభావ్య రూపం పెట్టలేదు.
- source_word: τὸν πατέρα
  choice: తండ్రిని
  rationale: గ్రీకు పాఠ్యంలో ఉన్న ‘తండ్రి’నే అనువదిస్తుంది; మూలంలో లేని ‘నా తండ్రి’ని చేర్చదు.
theological_decisions:
- issue: ἐξελεξάμηνను సిద్ధాంతపరమైన ‘ఎన్నిక’గా అతివ్యాఖ్యానించే అవకాశం
  choice: తక్షణ శిష్యత్వం, నియామకం సందర్భంలో ‘నేనే మిమ్మల్ని ఎన్నుకున్నాను’ అనే సాధారణ భావం
  alternative: సాంకేతిక ధార్మిక పదంగా ‘ఎన్నిక చేసుకున్నాను’ అని అనువదించడం
  rationale: వాక్యం యేసు చొరవను స్పష్టంగా చెబుతుంది; అయితే తరువాతి వ్యవస్థీకృత సిద్ధాంత పదజాలాన్ని గ్రీకు క్రియపై బలవంతంగా మోపదు.
- issue: ἔθηκα ὑμᾶς యొక్క భావం
  choice: వెళ్లి ఫలించాలనే ఉద్దేశంతో నియమించడం లేదా బాధ్యత అప్పగించడం
  alternative: అక్షరార్థంగా ‘మిమ్మల్ని ఉంచాను’ లేదా ప్రత్యేక సంఘ పదవికి అభిషేకించాను
  rationale: సందర్భం వెళ్లడం, ఫలించడం, ప్రార్థించడం అనే ఉద్దేశాన్ని చూపుతుంది. ‘నియమించాను’ దాన్ని తెలియజేస్తుంది కాని ఒక నిర్దిష్ట సంఘ కార్యాలయానికి పరిమితం చేయదు.
- issue: చివరి ἵνα వాక్యభాగం యొక్క బలం
  choice: నియామకం, ఫలించడం, ప్రార్థనకు లభించే సమాధానం మధ్య ఉద్దేశం/ఫలిత సంబంధాన్ని ‘అప్పుడు’తో నిలుపడం
  alternative: సంబంధం లేని షరతులేని స్వతంత్ర వాగ్దానంగా ‘ఆయన తప్పక ఇస్తాడు’ అని బలపరచడం
  rationale: గ్రీకు ἵνα ఈ భాగాన్ని ముందున్న వాక్యంతో వ్యాకరణపరంగా కడుతుంది. తెలుగు వాక్యం వాగ్దానాన్ని బలహీనపరచకుండా ఆ అనుసంధానాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధన వాడబడింది. వాక్య ప్రవాహం సహజంగా ఉండేందుకు గ్రీకు ఉద్దేశ వాక్యాలను తెలుగు క్రియార్థక రూపాలతో మలిచాం. ‘ఫలం’ అనే యోహానీయ రూపకాన్ని, ‘నా పేరున’ అనే ధార్మికంగా ఘనమైన పదబంధాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలిపాం.
