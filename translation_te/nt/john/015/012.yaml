base_translation:
  language: en
  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: te
  text: “నేను మిమ్మల్ని ప్రేమించినట్లే, మీరు ఒకరినొకరు ప్రేమించాలి”—ఇదే నా ఆజ్ఞ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “ఇదే నా ఆజ్ఞ: నేను మిమ్మల్ని ప్రేమించినట్టు మీరు ఒకరినొకరు ప్రేమించాలి.”'
    reason: వాక్య నిర్మాణం మరియు καθὼς కు సహజమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ
  choice: ఇదే నా ఆజ్ఞ
  rationale: గ్రీకు వాక్యంలోని నిర్దేశక, స్వామ్య బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ఆజ్ఞ’ ἐντολή యొక్క అధికారపూర్వక భావాన్ని నిలుపుతుంది.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: మీరు ఒకరినొకరు ప్రేమించాలి
  rationale: ఇక్కడ ἵνα ఆజ్ఞ యొక్క విషయాన్ని పరిచయం చేస్తుంది. ‘ప్రేమించాలి’ తెలుగులో ఆజ్ఞాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది; ‘ఒకరినొకరు’ పరస్పరతను కాపాడుతుంది.
- source_word: καθὼς ἠγάπησα ὑμᾶς
  choice: నేను మిమ్మల్ని ప్రేమించినట్లే
  rationale: καθὼς సూచించే పోలికను ‘అట్లే’ స్పష్టంగా నిలుపుతుంది. గ్రీకు ఏరిస్టును తెలుగు సందర్భానికి సహజమైన భూతకాల రూపంతో అనువదించి, యేసు ప్రేమను వారి ప్రేమకు నమూనాగా చూపిస్తుంది.
theological_decisions:
- issue: ἀγαπάω పదానికి అనువాదం
  choice: ప్రేమించు
  alternative: ఆదరించు
  rationale: ‘ప్రేమించు’ మూలపదానికి నేరమైన, సహజమైన తెలుగు సమానం; ఈ భాగంలో ఉన్న పదసంబంధ కొనసాగింపును కాపాడుతుంది, ప్రత్యేక మతపరమైన భావాన్ని అదనంగా చేర్చదు.
- issue: యేసు ప్రేమతో పోలిక యొక్క బలం
  choice: నేను మిమ్మల్ని ప్రేమించినట్లే
  alternative: నేను మిమ్మల్ని ప్రేమించినట్టు
  rationale: ‘ప్రేమించినట్లే’ అనే రూపం καθὼς లోని నమూనా-పోలికను స్పష్టంగా వ్యక్తం చేస్తుంది; అయితే ప్రేమ యొక్క పరిమాణమా, విధానమా అనే విషయాన్ని అనవసరంగా నిర్ణయించదు.
- issue: ἐντολή యొక్క అధికారపూర్వక భావం
  choice: ఆజ్ఞ
  alternative: ఆజ్ఞాపన
  rationale: ‘ఆజ్ఞ’ ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా ఉండి యేసు మాటలోని అధికారాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలి. ఉద్ధరణలో ఆజ్ఞ యొక్క విషయాన్ని ముందుంచి, చివర ‘ఇదే నా ఆజ్ఞ’ ద్వారా గ్రీకు నిర్దేశక బలాన్ని సహజంగా నిలిపింది.
