id: JHN.15.11
reference: John 15:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἡ χαρὰ ἡ ἐμὴ ἐν ὑμῖν ⸀ᾖ καὶ ἡ χαρὰ ὑμῶν πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: te
  text: “నా ఆనందం మీలో[a] ఉండేలా, మీ ఆనందం పరిపూర్ణమయ్యేలా[b] ఈ సంగతులు నేను మీకు చెప్పాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ మధ్య.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ ఆనందం నిండిపోవడానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ఈ సంగతులు
  rationale: బహువచన సూచనను నిలుపుతూ, ముందుగా చెప్పిన విషయాలను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: λελάληκα ὑμῖν
  choice: మీతో చెప్పాను
  rationale: గ్రీకు పరిపూర్ణ కాలంలోని గత పలుకుబడి మరియు దాని ప్రస్తుత ప్రాసంగికతను తెలుగు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; ὑμῖν యొక్క బహువచనం ‘మీతో’లో స్పష్టంగా ఉంటుంది.
- source_word: ἵνα
  choice: ఉండేలా … పరిపూర్ణమయ్యేలా
  rationale: యేసు ఈ సంగతులు చెప్పిన ఉద్దేశాన్ని తెలుగులో సహజమైన ప్రయోజనార్థక నిర్మాణంతో తెలియజేస్తుంది.
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: నా ఆనందం
  rationale: యేసుకు చెందిన ఆనందం అనే మూలపాఠంలోని సరళమైన భావాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: ἐν యొక్క ప్రధాన అంతర్గత భావాన్ని కాపాడుతుంది; ‘మీ మధ్య’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: ἡ χαρὰ ὑμῶν
  choice: మీ ఆనందం
  rationale: ‘నా ఆనందం’తో ఉన్న సమాంతరతను, స్వామ్య వ్యత్యాసాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: πληρωθῇ
  choice: పరిపూర్ణమయ్యేలా
  rationale: ఆనందం సంపూర్ణ స్థితికి చేరడం అనే భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; నిండుదల రూపకాన్ని పాదసూచికలో సూచించింది.
theological_decisions:
- issue: ‘నా ఆనందం’ యొక్క స్వభావం
  choice: ‘నా ఆనందం’ అని మాత్రమే అనువదించడం
  alternative: ‘నేను ఇచ్చే ఆనందం’ లేదా ‘నా వల్ల కలిగే ఆనందం’
  rationale: మూలపాఠం ఆనందం యేసు స్వంత ఆనందమా, ఆయన ఇచ్చే ఆనందమా అనే భావసంపదను కుదించదు; వ్యాఖ్యానాత్మక విస్తరణను నివారించడం ద్వారా ఆ ఉద్వేగాన్ని నిలిపింది.
- issue: ἐν ὑμῖν యొక్క స్థలార్థం
  choice: మీలో
  alternative: మీ మధ్య
  rationale: శిష్యుల ఆనందం పరిపూర్ణం కావడంతో ఉన్న సమాంతరత అంతర్గత భావానికి అనుకూలమైనా, సమూహమధ్య భావం కూడా భాషాపరంగా సాధ్యమే; అందుకే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. తెలుగు వాక్యప్రవాహం సహజంగా ఉండేందుకు ప్రధాన క్రియను చివర ఉంచింది; మూలంలోని రెండు ఉద్దేశ్య భాగాల సమాంతరతను కాపాడింది.
