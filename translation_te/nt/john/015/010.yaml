revisions:
- from: మీరు నా ఆజ్ఞలను పాటిస్తే, నా ప్రేమలో నిలిచి ఉంటారు. అలాగే నేను నా తండ్రి ఆజ్ఞలను పాటించి, ఆయన ప్రేమలో నిలిచి ఉన్నాను.
  to: మీరు నా ఆజ్ఞలను పాటిస్తే, నా ప్రేమలో నిలిచి ఉంటారు; నేను నా తండ్రి ఆజ్ఞలను పాటించి, ఆయన ప్రేమలో నిలిచి ఉన్నట్లే.
  rationale: The revision replaces the weaker connective అలాగే with an explicit comparative construction, preserving the source’s καθὼς and maintaining the parallel between keeping commandments and remaining in love. The conditional force and theological openness remain unchanged.
