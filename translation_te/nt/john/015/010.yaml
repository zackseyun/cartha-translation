review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the condition, the commandments, love, and the repeated remaining motif. However, అలాగే (‘likewise/also’) weakens καθὼς, which introduces an explicit ‘just as’ comparison. The second clause should be syntactically linked to the first as the model for it.
  naturalness: The wording is generally natural modern standard Telugu. Recasting the comparison with ‘…ఉన్నట్లే’ makes the relation between Jesus’ keeping/remaining and that of the disciples clearer and more idiomatic.
  terminology: ఆజ్ఞలు, పాటించు, ప్రేమ, and నిలిచి ఉండు are appropriate, consistent renderings. ఆయన appropriately and respectfully refers to the Father. No footnotes are needed.
  issues:
  - severity: medium
    issue: ‘అలాగే’ does not fully express καθὼς.
    rationale: καθὼς marks a direct comparative correspondence (‘just as’), not merely an additional or consecutive statement. ‘…ఉన్నట్లే’ preserves this explicit comparison in Telugu.
  revised_text: మీరు నా ఆజ్ఞలను పాటిస్తే, నా ప్రేమలో నిలిచి ఉంటారు; నేను నా తండ్రి ఆజ్ఞలను పాటించి, ఆయన ప్రేమలో నిలిచి ఉన్నట్లే.
  revised_footnotes: []
  revision_rationale: The revision replaces the weaker connective అలాగే with an explicit comparative construction, preserving the source’s καθὼς and maintaining the parallel between keeping commandments and remaining in love. The conditional force and theological openness remain unchanged.
