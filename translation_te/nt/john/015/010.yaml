id: JHN.15.10
reference: John 15:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: te
  text: మీరు నా ఆజ్ఞలను పాటిస్తే, నా ప్రేమలో నిలిచి ఉంటారు; నేను నా తండ్రి ఆజ్ఞలను పాటించి, ఆయన ప్రేమలో నిలిచి ఉన్నట్లే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: పాటిస్తే
  rationale: ఉపవాక్యంలోని షరతును సహజమైన తెలుగు ‘-తే’ రూపం స్పష్టంగా తెలియజేస్తుంది; పునరావృత్తి భావాన్ని అదనంగా చేర్చదు.
- source_word: ἐντολάς
  choice: ఆజ్ఞలను
  rationale: అధికారపూర్వకమైన ఆదేశాల భావాన్ని ‘ఆజ్ఞలు’ సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: τηρήσητε / τετήρηκα
  choice: పాటిస్తే / పాటించి
  rationale: τηρέωకు ఇక్కడ ఆజ్ఞలను నమ్మకంగా ఆచరించడం అనే భావం ఉంది. రెండు చోట్ల ‘పాటించు’ వాడటం మూలంలోని పదసంబంధాన్ని నిలుపుతుంది; రెండవ క్రియకు అనుసంధాన భూతక్రియ రూపం తెలుగులో సహజంగా ఉంది.
- source_word: μενεῖτε / μένω
  choice: నిలిచి ఉంటారు / నిలిచి ఉన్నాను
  rationale: యోహాను రచనలో ముఖ్యమైన μένω పదంలోని కొనసాగింపు, సంబంధ పరిధిలో ఉండడం అనే భావాలను ‘నిలిచి ఉండు’ స్పష్టంగా కాపాడుతుంది.
- source_word: ἐν τῇ ἀγάπῃ μου / αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: నా ప్రేమలో / ఆయన ప్రేమలో
  rationale: ‘ప్రేమలో’ అనే రూపం సంబంధపూర్వక పరిధి అనే యోహానీయ చిత్రణను వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: καθὼς
  choice: అలాగే
  rationale: శిష్యుల విధేయత-నిలకడకు యేసు స్వీయ మాదిరికి మధ్య ఉన్న పోలికను ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: τοῦ πατρός μου
  choice: నా తండ్రి
  rationale: సంబంధాన్ని స్పష్టంగా ఉంచుతూ, తెలుగు వాక్యనిర్మాణంలో సహజమైన స్వామ్య రూపాన్ని ఉపయోగిస్తుంది.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: సమీప పూర్వపదమైన ‘నా తండ్రి’ని సూచిస్తుంది; గౌరవప్రదమైన సర్వనామం సందర్భానికి తగినది.
theological_decisions:
- issue: విధేయతకు, యేసు ప్రేమలో నిలిచి ఉండటానికి మధ్య సంబంధం
  choice: నిజమైన షరతుగా నేరుగా అనువదించడం
  alternative: విధేయత ప్రేమను సంపాదిస్తుందని గానీ, అది ఎలాంటి షరతూ కాక కేవలం సాక్ష్యం మాత్రమేనని గానీ వివరణను చేర్చడం
  rationale: గ్రీకు వాక్యం షరతును, యేసు మాదిరితో పోలికను తెలియజేస్తుంది; అయితే పుణ్యార్జన, రక్షణ కోల్పోవడం, నిలకడ వంటి విస్తృత సిద్ధాంత వివాదాలను పరిష్కరించదు. అందువల్ల ఆ ఉద్వేగాన్ని అనువాదం అలాగే ఉంచుతుంది.
- issue: ἀγάπη యొక్క అనువాదం
  choice: ప్రేమ
  alternative: దాతృత్వం
  rationale: ‘ప్రేమ’ ఆధునిక తెలుగులో సహజమైనది; ఈ వచనంలోని రెండు సమాంతర ప్రయోగాల పదసంబంధాన్ని కూడా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, అయితే గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని షరతు, సమాంతర నిర్మాణం, μένω పునరుక్తి వీలైనంతవరకు నిలుపబడ్డాయి. ఫుట్‌నోట్లు అవసరం లేదు.
