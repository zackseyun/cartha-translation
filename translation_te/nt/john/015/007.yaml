id: JHN.15.7
reference: John 15:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: te
  text: మీరు నాలో నిలిచి, నా మాటలు మీలో నిలిచి ఉంటే, మీకు ఏది కావాలంటే అది అడగండి; అది మీకు నెరవేరుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: నిలిచి ఉంటే / నిలిచి ఉంటే
  rationale: యోహాను రచనల్లో ముఖ్యమైన μένω అనే క్రియ నిరంతర సంబంధాన్ని, కొనసాగడాన్ని సూచిస్తుంది. రెండు చోట్లా ఒకే పదబంధాన్ని వాడడం మూలంలోని పునరుక్తిని నిలుపుతుంది.
- source_word: ἐν ἐμοὶ
  choice: నాలో
  rationale: ἐν అనే విభక్తి సూచించే ‘లో’ భావాన్ని నేరుగా నిలిపి, యేసుతో ఉన్న ఐక్యత/సంబంధ భాషను బలహీనపరచకుండా అనువదించబడింది.
- source_word: τὰ ῥήματά μου
  choice: నా మాటలు
  rationale: ῥήματα పలికిన మాటలను లేదా వాక్కులను సూచిస్తుంది; ‘నా మాటలు’ అనేది సహజమైన, నేరమైన తెలుగు రూపం.
- source_word: ὃ ἐὰν θέλητε
  choice: మీకు ఏది కావాలంటే అది
  rationale: ఈ నిర్మాణం కోరుకునే దేనినైనా సూచించే అనిర్దిష్ట, విస్తృత భావాన్ని వ్యక్తం చేస్తుంది; అదనపు షరతులు చేర్చకుండా దాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: αἰτήσασθε
  choice: అడగండి
  rationale: ఆజ్ఞార్థక రూపం విన్నపం చేయమని చెబుతుంది. ప్రార్థన లేదా విన్నప సందర్భంలో ‘అడగండి’ సరళమైన, సహజమైన ఎంపిక.
- source_word: γενήσεται ὑμῖν
  choice: అది మీకు జరుగుతుంది
  rationale: γίνομαι ఇక్కడ సంభవించడం లేదా నెరవేరడం అనే భావాన్ని ఇస్తుంది. కర్తను మూలం స్పష్టంగా చెప్పనందున ‘చేయబడుతుంది’ అని దైవకర్మను మరీ స్పష్టీకరించకుండా ‘జరుగుతుంది’ అని అనువదించబడింది.
theological_decisions:
- issue: ప్రార్థనకు సంబంధించిన షరతు మరియు వాగ్దాన నిర్మాణం
  choice: అడగడానికి సంబంధించిన వాగ్దానాన్ని, శిష్యులు యేసులో నిలిచి ఉండడం మరియు ఆయన మాటలు వారిలో నిలిచి ఉండడం అనే స్పష్టమైన షరతు కింద ఉంచడం.
  alternative: ఈ వాగ్దానాన్ని షరతులేనిదిగా వినిపించే స్వేచ్ఛానువాదం.
  rationale: గ్రీకు వాక్యనిర్మాణంలో ἐὰν అనే షరతు సూచక పదం వాగ్దానానికి స్పష్టమైన పరిధిని ఏర్పరుస్తుంది. అనువాదం ఆ షరతును తొలగించదు లేదా దానిలో లేని అదనపు పరిమితులను చేర్చదు.
- issue: γενήσεται లో చర్యను చేసేవారి గుర్తింపు
  choice: కర్తను పేర్కొనకుండా ‘అది మీకు జరుగుతుంది’ అని ఉంచడం.
  alternative: ‘దేవుడు దాన్ని మీ కోసం చేస్తాడు’ లేదా ‘అది మీకు చేయబడుతుంది.’
  rationale: మూలంలోని క్రియ భవిష్యత్ మధ్యమ రూపంలో ఉంది; చర్యను చేసేవారిని స్పష్టంగా పేర్కొనదు. సందర్భం దేవుని కార్యాన్ని సూచించవచ్చుగానీ, అనువాదం మూలంలోని వ్యాకరణాత్మక అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే గౌరవప్రదంగా ఉంచబడింది. ‘నిలిచి ఉండడం’ అనే రూపం యోహాను రచనల్లోని కొనసాగుతున్న సంబంధ భావాన్నీ, మూలంలోని రెండు μένω రూపాల పునరుక్తినీ కాపాడుతుంది.
