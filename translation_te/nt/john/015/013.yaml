revisions:
- from: 'ఇంతకంటే గొప్ప ప్రేమ ఎవరికీ లేదు: తన స్నేహితుల కోసం తన ప్రాణాన్ని అర్పించడం.[a][b]'
  to: ఎవరైనా తన స్నేహితుల కోసం తన ప్రాణాన్ని అర్పించడం కంటే గొప్ప ప్రేమ ఎవరికీ లేదు.[a][b]
  rationale: 'The revision explicitly represents the indefinite generic subject τις with ‘ఎవరైనా’ while retaining the source’s open, non-gender-specific sense. Recasting the comparison as ‘...అర్పించడం కంటే గొప్ప ప్రేమ’ is idiomatic Telugu and preserves the Greek meaning: no love exceeds the love shown when someone gives up their life for their friends. The two lexical notes retain relevant ambiguity without imposing a theological interpretation.'
  reviewer_model: gpt-5.6-terra
