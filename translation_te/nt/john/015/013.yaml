id: JHN.15.13
reference: John 15:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: te
  text: ఎవరైనా తన స్నేహితుల కోసం తన ప్రాణాన్ని అర్పించడం కంటే గొప్ప ప్రేమ ఎవరికీ లేదు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రాణం’ అని అనువదించిన గ్రీకు పదం ψυχή; దీనికి ‘జీవితం,’ ‘ఆత్మ,’ లేదా ‘తనను తాను’ అనే అర్థాలు కూడా ఉండవచ్చు. ఇక్కడ మరణంలో తన జీవితాన్ని ఇచ్చివేయడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘కోసం’ అని అనువదించిన గ్రీకు పదం ὑπέρ; దీనిని ‘పక్షాన’ లేదా ‘వారి మేలు కోసం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: ఇంతకంటే గొప్ప ప్రేమ
  rationale: ταύτης అనేది పోలికను తెలిపే షష్ఠీ విభక్తి; తరువాతి వాక్యభాగంలో వివరించబడే ప్రేమను సూచిస్తూ ‘ఇంతకంటే’ సహజమైన తెలుగులో భావాన్ని నిలుపుతుంది.
- source_word: οὐδεὶς ἔχει
  choice: ఎవరికీ లేదు
  rationale: గ్రీకు స్వామ్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో అస్తిత్వార్థకంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα τις
  choice: అర్పించడం
  rationale: ఇక్కడ ἵνα ప్రధానంగా ఉద్దేశాన్ని కాకుండా ‘ఇది’ అనే ప్రేమ ఏమిటో వివరిస్తుంది. తెలుగు క్రియానామ నిర్మాణం ఆ వివరణాత్మక సంబంధాన్ని సహజంగా తెలియజేస్తుంది; τις యొక్క సాధారణ, అనిర్దిష్ట భావం వాక్యంలో అంతర్లీనంగా ఉంటుంది.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: తన ప్రాణాన్ని
  rationale: ఈ సందర్భంలో ψυχή అంటే మరణంలో ఇచ్చే జీవితం; ‘ప్రాణం’ తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తుంది, కేవలం దేహరహిత ‘ఆత్మ’ అనే అర్థాన్ని రుద్దదు.
- source_word: θῇ
  choice: అర్పించడం
  rationale: ψυχήతో కూడిన τίθημι స్వచ్ఛందంగా ప్రాణం ఇవ్వడాన్ని సూచిస్తుంది. ‘ప్రాణాన్ని అర్పించడం’ తెలుగులో స్థిరమైన, గౌరవప్రదమైన ప్రయోగం.
- source_word: ὑπὲρ
  choice: కోసం
  rationale: లబ్ధిదాయకమైన లేదా పరుల పక్షాన జరిగే చర్యను సహజంగా తెలియజేస్తుంది; ‘స్థానంలో’ అనే ప్రత్యామ్నాయార్థాన్ని అనవసరంగా ఖరారు చేయదు.
- source_word: τῶν φίλων αὐτοῦ
  choice: తన స్నేహితుల
  rationale: φίλοι యొక్క సాధారణ అర్థమైన ‘స్నేహితులు’ను, కర్తతో సంబంధాన్ని తెలిపే ప్రతిబింబ సర్వనామంతో నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: స్వీయత్యాగ సందర్భంలో ψυχή యొక్క భావం
  choice: ‘ప్రాణం’గా అనువదించబడింది.
  alternative: ‘ఆత్మ’ లేదా ‘జీవితం’
  rationale: ఇక్కడ దృష్టి ఇతరుల కోసం మరణాన్ని స్వీకరించే స్పష్టమైన స్వీయత్యాగంపై ఉంది; ‘ప్రాణం’ ఆ సందర్భార్థాన్ని నిలుపుతూ శరీరం–ఆత్మ విభజనను పాఠ్యంలోకి చేర్చదు.
- issue: త్యాగప్రేమకు సంబంధించి ὑπέρ యొక్క బలం
  choice: ‘కోసం’గా అనువదించబడింది.
  alternative: ‘పక్షంగా’ లేదా ‘స్థానంలో’
  rationale: ఈ విభక్తిపూర్వకం పరుల మేలు కోసం లేదా వారి పక్షాన అనే భావాన్ని కలిగి ఉండవచ్చు. ‘కోసం’ ఆ విస్తృతిని కాపాడి, ఈ వాక్యం మాత్రమే తప్పనిసరిగా నిర్దేశించని ప్రత్యామ్నాయ బలి భావాన్ని ఖరారు చేయదు.
- issue: ἵνα యొక్క వాక్యసంబంధ బలం
  choice: ముందున్న ‘ఇంత’ ప్రేమను నిర్వచించే క్రియానామ నిర్మాణంగా ఇచ్చబడింది.
  alternative: ‘ఎవరైనా ... అర్పించాలి అని’ లేదా ఉద్దేశార్థక ‘అర్పించడానికి’
  rationale: ఇక్కడ ἵνα ప్రేమ యొక్క ఉద్దేశాన్ని కాక, ఆ అత్యున్నత ప్రేమలోని కార్యాన్ని వివరిస్తుంది. తెలుగు క్రియానామం ఈ సంబంధాన్ని స్పష్టంగా, సహజంగా చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు అనిర్దిష్ట ఏకవచన కర్తను లింగనిర్దేశం లేకుండా తెలుగు క్రియానామ నిర్మాణంలో సహజంగా వ్యక్తం చేసింది. ‘ప్రాణాన్ని అర్పించడం’ స్వచ్ఛంద స్వీయత్యాగాన్ని స్పష్టంగా తెలియజేస్తుంది.
