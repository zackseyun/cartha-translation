review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the comparative claim, ψυχή as life given in death, and ὑπέρ as benefactive ‘for.’ However, the infinitive phrase ‘తన స్నేహితుల కోసం తన ప్రాణాన్ని అర్పించడం’ leaves its implied generic subject unstated, whereas τις explicitly supplies one.
  naturalness: ‘ప్రాణాన్ని అర్పించడం’ is natural, dignified modern Telugu for the Johannine idiom. Making the generic subject explicit produces a smoother and less syntactically dangling sentence.
  terminology: ‘ప్రేమ,’ ‘ప్రాణం,’ and ‘స్నేహితులు’ are appropriate. The notes are revised to use the Greek forms ψυχή and ὑπέρ and more idiomatic Telugu alternatives.
  issues:
  - severity: low
    issue: The generic subject of ‘అర్పించడం’ is only implicit.
    rationale: Greek τις (‘someone/anyone’) is explicit. Telugu can naturally retain this with ‘ఎవరైనా,’ avoiding an unattached reflexive ‘తన.’
  - severity: low
    issue: The lexical footnotes use less idiomatic wording in places.
    rationale: ‘పక్షంగా’ is not the most natural Telugu equivalent here; ‘పక్షాన’ and ‘వారి మేలు కోసం’ better express the alternatives. The ψυχή note can more clearly identify the contextual sense as giving up one’s life in death.
  revised_text: ఎవరైనా తన స్నేహితుల కోసం తన ప్రాణాన్ని అర్పించడం కంటే గొప్ప ప్రేమ ఎవరికీ లేదు.[a][b]
