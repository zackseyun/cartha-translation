  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: te
  text: ఎవరైనా నాలో నిలిచి ఉండకపోతే[a], అతడు ద్రాక్షతీగ కొమ్మలా బయటికి పారవేయబడి ఎండిపోతాడు. అలాంటి కొమ్మలను పోగుచేసి మంటలో వేస్తారు[b]; అవి కాలిపోతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాలో కొనసాగకపోతే.’ గ్రీకు క్రియకు ‘నిలిచి ఉండడం,’ ‘కొనసాగడం’ అనే భావాలున్నాయి; ఇది యోహాను రచనల్లో ముఖ్యమైన పదం.
    reason: lexical_alternative
  - marker: b
    text: ఈ రూపకం బయటికి పారవేయబడడం, కాలిపోవడం గురించి హెచ్చరిస్తుంది. అయితే ఇది నిజమైన శిష్యత్వాన్ని కోల్పోవడాన్ని సూచిస్తుందా, లేక పైకి మాత్రమే ఉన్న అనుబంధం బయటపడడాన్ని సూచిస్తుందా అనేది ఈ వచనం స్వయంగా నిర్దిష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: నిలిచి ఉండకపోతే
  rationale: μένω అనే యోహాను రచనల్లో కీలకమైన క్రియలో కొనసాగడం, సంబంధంలో స్థిరంగా ఉండడం అనే భావం ఉంది. ‘నిలిచి ఉండు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ కొనసాగింపు భావాన్ని కాపాడుతుంది.
- source_word: ἐν ἐμοί
  choice: నాలో
  rationale: యేసుతో గల సంబంధం, ఆయనలో కొనసాగడం అనే వేదాంతపరమైన బలాన్ని వివరణాత్మకంగా మార్చకుండా మూలంలోని రూపాన్నే నిలుపుతుంది.
- source_word: ἐβλήθη ἔξω
  choice: బయటికి పారవేయబడి
  rationale: మూలంలోని కర్మణి రూపాన్నీ, తిరస్కరణను సూచించే స్పష్టమైన దృశ్యాన్నీ కాపాడుతుంది.
- source_word: ὡς τὸ κλῆμα
  choice: ద్రాక్షతీగ కొమ్మలా
  rationale: సందర్భంలోని ద్రాక్షతీగ రూపకాన్ని స్పష్టంగా ఉంచుతూ κλῆμα సూచించే తీగ కొమ్మను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐξηράνθη
  choice: ఎండిపోతాడు
  rationale: కొమ్మ తేమ కోల్పోయి ఎండిపోవడం అనే మూల దృశ్యాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: συνάγουσιν
  choice: పోగుచేసి
  rationale: గ్రీకులో కర్తను పేర్కొనని మూడవ పురుష బహువచనాన్ని తెలుగులో సహజమైన కర్తరహిత ప్రయోగంతో ప్రతిబింబిస్తుంది.
- source_word: αὐτὰ
  choice: అలాంటి కొమ్మలను
  rationale: నపుంసక బహువచన సర్వనామం ఇలాంటి కొమ్మలను సూచిస్తుంది. తెలుగులో సూచన స్పష్టంగా ఉండేందుకు నామవాచకాన్ని పునరుక్తి చేశాం.
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: మంటలో వేస్తారు
  rationale: అనిర్దిష్ట కర్తను అలాగే ఉంచి చర్యను సరళమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καίεται
  choice: అవి కాలిపోతాయి
  rationale: గ్రీకు క్రియ వ్యాకరణపరంగా ఏకవచనమైనప్పటికీ, వెంటనే ముందు ఉన్న బహువచన కొమ్మలే భావపరమైన సూచ్యం. సహజ తెలుగులో సమూహంలోని కొమ్మల ఫలితాన్ని బహువచనంగా వ్యక్తం చేశాం.
- source_word: τις
  choice: ఎవరైనా
  rationale: షరతుతో కూడిన సాధారణ హెచ్చరికలో అనిర్దిష్ట వ్యక్తిని సహజంగా, సమగ్రంగా సూచిస్తుంది.
theological_decisions:
- issue: ఈ హెచ్చరిక నిజమైన శిష్యత్వాన్ని కోల్పోవడాన్నా లేక పైకి మాత్రమే ఉన్న అనుబంధం బయటపడడాన్నా సూచిస్తుందా?
  choice: సిద్ధాంతపరమైన వివరణను చేర్చకుండా రూపక హెచ్చరికను నేరుగా అనువదించడం
  alternative: ఇది నిజ విశ్వాసి పడిపోవడమేనని లేదా ఎన్నడూ నిజంగా అనుసంధానమవని నామమాత్ర శిష్యుడేనని స్పష్టీకరించడం
  rationale: వచనం తొలగింపు, ఎండిపోవడం, దహనం అనే తీవ్రమైన హెచ్చరికను ఇస్తుంది; అయితే ఆ వ్యక్తి పూర్వ ఆధ్యాత్మిక స్థితి గురించి తరువాతి సిద్ధాంత వివాదాలను స్వయంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ద్రాక్షతీగ రూపకాన్ని స్పష్టంగా ఉంచి, అనిర్దిష్ట గ్రీకు కర్తలను తెలుగులో సహజమైన కర్తరహిత నిర్మాణంతో అందించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
