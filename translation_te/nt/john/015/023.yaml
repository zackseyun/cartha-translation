  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: te
  text: నన్ను ద్వేషించేవాడు నా తండ్రిని కూడా ద్వేషిస్తాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἐμὲ μισῶν
  choice: నన్ను ద్వేషించేవాడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న వర్తమాన కృదంతం వ్యక్తిని సూచిస్తూ, ఆ చర్య అతని లక్షణమని తెలియజేస్తుంది. ‘ద్వేషించేవాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి గ్రీకు వాక్యంలోని సాధారణ ఏకవచన భావాన్ని నిలుపుతుంది.
- source_word: ἐμὲ
  choice: నన్ను
  rationale: ఇది ప్రత్యక్ష కర్మగా ఉన్న మొదటి పురుష ఏకవచన సర్వనామం. తెలుగులో ‘నన్ను’ దాని సహజ సమానార్థకం.
- source_word: μισῶν / μισεῖ
  choice: ద్వేషించేవాడు / ద్వేషిస్తాడు
  rationale: μισέω అంటే ‘ద్వేషించు.’ గ్రీకులోని వర్తమాన కాలపు సాధారణ సత్య భావాన్ని తెలుగు సాధారణ వర్తమానం సహజంగా వ్యక్తపరుస్తుంది; రెండు చోట్లా ‘ద్వేషించు’నే వాడటం మూలంలోని పదపునరావృతిని కాపాడుతుంది.
- source_word: καὶ
  choice: కూడా
  rationale: ఇక్కడ καί రెండవ కర్మను మొదటిదానికి కలిపి, యేసును ద్వేషించేవాడు తండ్రిని కూడా ద్వేషిస్తాడనే భావాన్ని ఇస్తుంది. ‘కూడా’ ఈ అనుసంధానాన్ని సహజ తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: τὸν πατέρα μου
  choice: నా తండ్రిని
  rationale: πατέρα తో μου కలిసిన రూపానికి సహజ తెలుగు ‘నా తండ్రి.’ తెలుగులో పెద్ద అక్షరాల భేదం లేనందున దేవుణ్ణి సూచించే సంబంధపదమనే భావం సందర్భం ద్వారా తెలుస్తుంది.
theological_decisions:
- issue: ‘తండ్రి’ దేవుణ్ణి సూచించే క్రీస్తుశాస్త్ర సంబంధపదంగా ఉండటం
  choice: నా తండ్రిని
  alternative: నా తండ్రియైన దేవుణ్ణి
  rationale: మూలంలో ‘దేవుడు’ అనే పదం లేదు. ‘నా తండ్రి’ అనే యోహాను సువార్తలోని సంబంధపదాన్ని యథాతథంగా ఉంచడం ద్వారా క్రీస్తుశాస్త్ర ప్రాముఖ్యత నిలుస్తుంది; అదే సమయంలో మూలంలో లేని వివరణను ప్రధాన పాఠ్యంలో చేర్చడం నివారించబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గంభీరంగా, సాధారణ పాఠకులకు సులభంగా రూపొందించబడింది. మూలంలోని సమాంతర నిర్మాణం మరియు ‘ద్వేషించు’ పదపునరావృతి కాపాడబడ్డాయి.
