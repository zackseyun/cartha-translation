id: JHN.15.1
reference: John 15:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ἡ ἄμπελος ἡ ἀληθινή, καὶ ὁ πατήρ μου ὁ γεωργός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/001.yaml
  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: te
  text: “నేనే నిజమైన ద్రాక్షావల్లిని; నా తండ్రి ద్రాక్షతోటను సాగుచేసేవాడు[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తోటమాలి.’ గ్రీకు పదం γεωργός సాధారణంగా భూమిని సాగుచేసే వ్యక్తిని సూచిస్తుంది; ద్రాక్షావల్లి సందర్భంలో ‘ద్రాక్షతోటను సాగుచేసేవాడు’ అనే అర్థం సందర్భానికి మరింత నిర్దిష్టంగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: నేనే
  rationale: గ్రీకు వాక్యంలోని స్పష్టమైన ప్రథమ పురుష సర్వనామం ఇచ్చే ఉద్ఘాటనను సహజమైన తెలుగులో ‘నేనే’ తెలియజేస్తుంది; ‘ఉన్నాను’ అని విడిగా చేర్చడం తెలుగు నుడికారానికి అసహజంగా ఉంటుంది.
- source_word: ἄμπελος
  choice: ద్రాక్షావల్లి
  rationale: ఈ రూపకంలోని మొక్కను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా సూచించే సహజ పదం.
- source_word: ἀληθινή
  choice: నిజమైన
  rationale: ‘నిజమైన’ అనే పదం సత్యమైనది, అసలైనది అనే అర్థసాధ్యతలను నిలుపుతూ యోహాను రచనలోని భావగాంభీర్యాన్ని అతిగా వివరించదు.
- source_word: πατήρ μου
  choice: నా తండ్రి
  rationale: యేసుకు దేవునితో ఉన్న వ్యక్తిగత సంబంధాన్ని గ్రీకు పదబంధానికి నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γεωργός
  choice: తోటమాలి
  rationale: γεωργός భూమిని సాగుచేసే వ్యక్తిని సూచిస్తుంది. ద్రాక్షావల్లి సందర్భంలో ‘తోటమాలి’ సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది; మరింత సందర్భనిర్దిష్టమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: యేసు పలికిన రూపకాత్మక ‘నేనే’ ప్రకటన
  choice: ‘నేనే నిజమైన ద్రాక్షావల్లిని’ అని రూపకాన్ని నేరుగా నిలుపడం
  alternative: ‘నేనే అసలైన ద్రాక్షావల్లిని’
  rationale: మూలంలోని రూపకాన్ని వ్యాఖ్యానంతో విస్తరించకుండా నిలుపుతుంది. ‘నిజమైన’ అనేది ἀληθινήలోని సత్యం, యథార్థత అనే భావాల మధ్య ఉన్న విస్తృతిని కాపాడుతుంది.
- issue: తండ్రిని సూచించే γεωργός పదం
  choice: ప్రధాన పాఠ్యంలో ‘తోటమాలి’; పాదసూచికలో ‘ద్రాక్షావల్లిని సాగుచేసేవాడు’
  alternative: ద్రాక్షావల్లి సాగుదారుడు
  rationale: ఈ ఎంపిక చదవడానికి సహజంగా ఉండడంతో పాటు సాగు చేసే వ్యక్తి అనే మూలార్థాన్ని పాదసూచిక ద్వారా కాపాడుతుంది; దీనిలో అదనపు సిద్ధాంతార్థం చేర్చబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నేనే’ మూలంలోని ఉద్ఘాటనను నిలుపుతుంది; రూపకాన్ని వివరణాత్మకంగా విస్తరించలేదు.
