- from: “నేనే నిజమైన ద్రాక్షావల్లిని; నా తండ్రి తోటమాలి[a].”
  to: “నేనే నిజమైన ద్రాక్షావల్లిని; నా తండ్రి ద్రాక్షతోటను సాగుచేసేవాడు[a].”
  rationale: The revision retains the emphatic identification and the Johannine ‘true vine’ metaphor while rendering γεωργός with a contextually precise, natural Telugu expression. The footnote preserves ‘తోటమాలి’ as a broader alternative and explains the underlying Greek sense.
