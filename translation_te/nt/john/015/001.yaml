    issue: ‘తోటమాలి’ is semantically too broad for γεωργός in this immediate vine/vineyard metaphor.
    rationale: γεωργός denotes one who works or cultivates land. Though ‘తోటమాలి’ can be understandable, it does not naturally specify vineyard cultivation and may weaken the coherent vine imagery.
