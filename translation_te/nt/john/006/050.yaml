id: JHN.6.50
reference: John 6:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: te
  text: పరలోకం నుండి దిగివస్తున్న రొట్టె ఇదే; ఎవరైనా దానిని తిని చనిపోకుండా ఉండేలా ఇది ఉంది.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోకం నుండి దిగివచ్చే రొట్టె ఇదే.”
    reason: వర్తమాన కృదంతమైన καταβαίνωνను తెలుగులో లక్షణాత్మక లేదా కొనసాగుతున్న చర్యగా అనువదించవచ్చు.
  - marker: b
    text: “చనిపోకుండా” అనే మాటను మూలవచనంలాగే విస్తృతంగా ఉంచాం; సందర్భంలో దీన్ని అంతిమ మరణం, ఆత్మసంబంధమైన మరణం, లేదా రాబోయే నాశనం నుంచి విముక్తిగా వివిధ రీతుల్లో అర్థం చేసుకుంటారు.
    reason: మూలవచనం మరణ స్వభావాన్ని స్పష్టంగా నిర్దేశించనందున వ్యాఖ్యాన భేదాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: οὗτός
  choice: ఇదే
  rationale: సూచక సర్వనామం యేసు గుర్తిస్తున్న రొట్టెను నేరుగా సూచిస్తుంది; ‘ఇదే’ గ్రీకు వాక్యంలోని నిర్దిష్టతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἄρτος
  choice: రొట్టె
  rationale: మూలపదానికి సాధారణ అర్థం ‘రొట్టె.’ యోహాను 6లో దీనికి అక్షరార్థ, రూపకాలంకార బలాలు రెండూ ఉన్నందున ‘ఆహారం’ అని విస్తరించకుండా మూల రూపకాన్ని ఉంచాం.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: పరలోకం నుంచి దిగివచ్చే
  rationale: వర్తమాన కృదంత రూపంలోని కొనసాగుతున్న లేదా లక్షణాత్మక భావాన్ని సహజమైన తెలుగు విశేషణ క్రియారూపంతో వ్యక్తం చేశాం.
- source_word: οὐρανός
  choice: పరలోకం
  rationale: ఈ సందర్భంలో భౌతిక ఆకాశం కాక దేవుని పరలోక సంబంధమైన ఆవాసాన్ని సూచిస్తుంది.
- source_word: ἵνα
  choice: ఉండేలా
  rationale: ప్రయోజన లేదా ఫలిత భావాన్ని తెలుగు వాక్య నిర్మాణంలో సహజంగా తెలియజేస్తుంది.
- source_word: τις
  choice: ఎవరైనా
  rationale: అనిర్దిష్టమైన, సాధారణ వర్తింపును చూపే సర్వనామ భావాన్ని నిలుపుతుంది.
- source_word: ἐξ αὐτοῦ
  choice: దానిలో నుంచి
  rationale: ἐκ/ἐξ యొక్క భాగస్వామ్య భావాన్ని, అంటే ఆ రొట్టెలో నుంచి తినడాన్ని, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: φάγῃ
  choice: తిని
  rationale: ἵνα ఆధీనంలోని సంభావనార్థక క్రియను తెలుగు ప్రయోజన నిర్మాణంలో ‘తిని ... ఉండేలా’ అని సహజంగా అందించాం.
- source_word: μὴ ἀποθάνῃ
  choice: చనిపోకుండా
  rationale: ἀποθνῄσκω యొక్క సాధారణ అర్థమైన ‘చనిపోవు’నే ఉంచి, ‘నశించు’ వంటి బలమైన వ్యాఖ్యానాత్మక పదాన్ని చేర్చలేదు.
theological_decisions:
- issue: ‘చనిపోకుండా’ అనే మాటలో మరణ స్వభావం
  choice: శారీరకమా, ఆత్మసంబంధమైనదా, అంతిమ మరణమా అని నిర్దేశించకుండా సాధారణ వ్యక్తీకరణను ఉంచడం
  alternative: ‘ఆత్మీయంగా చనిపోకుండా’ లేదా ‘నిత్యంగా నశించకుండా’ అని స్పష్టీకరించడం
  rationale: జీవాహార ప్రసంగ సందర్భం లోతైన జీవనార్థాన్ని సూచించినా, ఈ వచనం మరణ స్వభావాన్ని స్వయంగా పరిమితం చేయదు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక విస్తృతతను, వేదాంతపరమైన ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘రొట్టె,’ ‘పరలోకం,’ ‘చనిపోకుండా’ వంటి సాధారణ పదాలతో మూల రూపకాన్ని, ఉద్దేశాన్ని, వేదాంతపరమైన విస్తృతతను నిలిపాం.
