revisions:
- from: ఎవరైనా దానిలో నుంచి తిని చనిపోకుండా[b] ఉండేలా, పరలోకం నుంచి దిగివచ్చే[a] రొట్టె ఇదే.
  to: పరలోకం నుండి దిగివస్తున్న రొట్టె ఇదే; ఎవరైనా దానిని తిని చనిపోకుండా ఉండేలా ఇది ఉంది.[b][a]
  rationale: The revision places the identifying statement first, as in the Greek, and uses 'దిగివస్తున్న' to represent the present participle καταβαίνων. It preserves the generic 'ఎవరైనా,' the purpose/result force of ἵνα, and the intentionally broad 'చనిపోకుండా.' The footnote markers are retained in the supplied audit-trail order ([b][a]).
  reviewer_model: gpt-5.6-terra
