  yaml_path: translation/nt/john/006/048.yaml
  text: I am the bread of life.
translation:
  language: te
  text: నేనే జీవపు రొట్టెను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: నేనే …ను
  rationale: గ్రీకులో వ్యక్తమైన ప్రథమ పురుష సర్వనామం ἐγώ, εἰμι అనే సంధాన క్రియతో కలిసి బలమైన స్వీయ-గుర్తింపును తెలియజేస్తుంది. తెలుగులో ‘నేనే’ ఆ స్పష్టతను, సహజమైన ఉద్ఘాటనను కాపాడుతుంది; వర్తమాన ఏకవచన ఉత్తమ పురుష క్రియార్థం ‘…ను’ రూపంలో వ్యక్తమవుతుంది.
- source_word: ὁ ἄρτος
  choice: ఆహారం
  rationale: ἄρτος ప్రాథమికంగా రొట్టెను సూచించినా, ఈ రూపకాల సందర్భంలో జీవాన్ని పోషించే ఆహార భావం ఉంది. ఆధునిక సాధారణ తెలుగులో ‘జీవాహారం’ సహజంగా, సంక్షిప్తంగా ఉండి రూపకాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: τῆς ζωῆς
  choice: జీవ-
  rationale: జనిటివ్ సంబంధాన్ని తెలుగు సమాసంగా ‘జీవాహారం’లో నిలిపాం. ఇది ‘జీవాన్ని ఇచ్చే’ అని విప్పి చెప్పకుండా గ్రీకు పదబంధంలోని సంక్షిప్తతను, భావసాంద్రతను కాపాడుతుంది.
theological_decisions:
- issue: యోహాను సువార్తలోని ‘నేను …ను’ స్వీయ-గుర్తింపు వాక్యపు బలం
  choice: నేనే జీవాహారాన్ని.
  alternative: నేను జీవాహారాన్ని.
  rationale: ఇక్కడ ἐγώ εἰμι నిరపేక్ష ప్రయోగం కాదు; ‘జీవాహారం’ అనే విధేయంతో కూడిన గుర్తింపు వాక్యం. ‘నేనే’ యేసు చేసిన బలమైన స్వీయ-గుర్తింపును కాపాడుతుంది, కానీ అదనపు క్రీస్తుతత్వ వివరణను చేర్చదు.
- issue: ‘జీవాహారం’లో జనిటివ్ భావం
  choice: సమాస రూపంలో భావాన్ని తెరిచి ఉంచడం
  alternative: జీవాన్ని ఇచ్చే ఆహారం
  rationale: τῆς ζωῆς ‘జీవానికి చెందిన’, ‘జీవాన్ని అందించే’, లేదా ‘జీవంతో సంబంధమున్న’ భావసంభావ్యతను కలిగి ఉంటుంది. ‘జీవాహారం’ ఆ సంబంధాన్ని అనవసరంగా ఒక్క వివరణకే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన వాక్యం. ‘నేనే’ సహజమైన ఉద్ఘాటనను ఇస్తుంది. ‘జీవాహారం’ సాధారణ పాఠకునికి అర్థమయ్యే సమాసం; అయితే రొట్టె అనే ప్రత్యక్ష చిత్రాన్ని తగ్గిస్తుంది.
