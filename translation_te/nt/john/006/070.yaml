language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: te
  text: 'యేసు వారికి జవాబిచ్చాడు: “నేనే మీ పన్నెండుగురినీ ఎన్నుకోలేదా? అయినా మీలో ఒకడు అపవాది[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అపవాది” అని అనువదించిన గ్రీకు పదం అబద్ధంగా నిందించేవాడిని సూచించవచ్చు; అనేక సందర్భాల్లో అది సాతానుకు పేరుగా కూడా వాడబడుతుంది. ఇక్కడ ఈ మాట ఆ వ్యక్తిని సాతానుగా నేరుగా గుర్తించడం కంటే అతని స్వభావాన్ని గుణాత్మకంగా వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: యోహాను సంభాషణా సందర్భంలో ప్రతిస్పందనను తెలిపే సహజమైన ఆధునిక తెలుగు పదప్రయోగం.
- source_word: Οὐκ ἐγὼ ... ἐξελεξάμην;
  choice: నేనే ఎన్నుకోలేదా?
  rationale: οὐκ తో ఉన్న ఈ ప్రశ్న అవుననే సమాధానాన్ని ఆశిస్తుంది; “నేనే” అని చెప్పడం ἐγώ యొక్క ఉద్ఘాటనను, ప్రశ్నారూపం దాని వాక్చాతుర్య బలాన్ని నిలుపుతుంది.
- source_word: ὑμᾶς τοὺς δώδεκα
  choice: పన్నెండుమందినైన మిమ్మల్ని
  rationale: τοὺς δώδεκα గుర్తింపు పొందిన పన్నెండుమంది శిష్యుల సమూహాన్ని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో సమూహ గుర్తింపును స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καὶ
  choice: అయినా
  rationale: పదశః “మరియు” అయినప్పటికీ, ఇక్కడ తాను పన్నెండుమందిని ఎన్నుకున్న సంగతి మరియు వారిలో ఒకడు అపవాది అనే సంగతి మధ్య ఉన్న వ్యత్యాసాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: ἐξ ὑμῶν
  choice: మీలో
  rationale: భాగార్థక భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: διάβολός
  choice: అపవాది
  rationale: ఈ గ్రీకు పదానికి అబద్ధంగా నిందించేవాడు అనే భావం ఉంది; అనేక సందర్భాల్లో అది అపవాదియైన సాతానును కూడా సూచిస్తుంది. ఇక్కడ నిర్దేశక ఉపపదం లేకపోవడం వల్ల నేరుగా సాతానుతో సమానం చేయకుండా, వ్యక్తి స్వభావాన్ని తీవ్రంగా వర్ణించే “అపవాది” అనువైనది.
theological_decisions:
- issue: διάβολός అనేది సాతానుతో నేరుగా గుర్తింపా, లేక గుణాత్మక వర్ణనా?
  choice: అపవాది
  alternative: దయ్యం; సాతాను
  rationale: నిర్దేశక ఉపపదం లేని విధేయ నామవాచకం ఇక్కడ గుణాత్మక బలాన్ని కలిగి ఉంది. “అపవాది” మూలపదంలోని నిందారోపణ భావాన్ని, దాని దుష్ట ఆధ్యాత్మిక ప్రతిధ్వనిని నిలుపుతూ, ఆ వ్యక్తి సాతానే అని వాక్యం చెప్పినట్లు చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. “పన్నెండుమందినైన మిమ్మల్ని” అనే నిర్మాణం గుర్తింపు పొందిన సమూహాన్ని సూచిస్తుంది; “అపవాది” మూలంలోని ఉద్దేశపూర్వక భావసందిగ్ధతను నిలుపుతుంది.
