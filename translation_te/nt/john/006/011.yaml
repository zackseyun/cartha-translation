source:
  edition: SBLGNT
  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: te
  text: కాబట్టి యేసు ఆ రొట్టెలను తీసుకొని, కృతజ్ఞతలు తెలిపిన తర్వాత, భోజనానికి కూర్చున్నవారికి[a] వాటిని పంచిపెట్టాడు. అలాగే చేపలను కూడా వారు కోరినంత పంచిపెట్టాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘భోజనానికి ఆనుకొని పడుకున్నవారికి.’ ఆ కాలంలో భోజనం చేసేటప్పుడు ఆనుకొని పడుకోవడం సాధారణ పద్ధతి.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘చిన్న చేపలను.’ ఇక్కడి గ్రీకు పదం రొట్టెతో తినే చేపలను, బహుశా చిన్న చేపలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: ఇక్కడ οὖν కథనంలోని తదుపరి చర్యను సూచిస్తుంది. ‘అప్పుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని అనుసంధానాన్ని నిలుపుతుంది.
- source_word: τοὺς ἄρτους
  choice: ఆ రొట్టెలను
  rationale: ἄρτος అనే పదం సాధారణంగా రొట్టెను సూచించినా, ఇక్కడ బహువచనం ముందుగా ప్రస్తావించిన విడివిడి రొట్టెలను సూచిస్తుంది. నిర్దిష్ట సూచనను ‘ఆ’ తెలియజేస్తుంది.
- source_word: εὐχαριστήσας
  choice: కృతజ్ఞతలు చెల్లించిన తర్వాత
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది. గ్రీకు పాఠ్యంలో కృతజ్ఞత ఎవరికి చెల్లించాడో స్పష్టంగా చెప్పనందున దాన్ని అనువాదంలో చేర్చలేదు.
- source_word: διέδωκεν
  choice: పంచిపెట్టాడు
  rationale: διαδίδωμι సమూహంలోని వారికి పంపిణీ చేయడాన్ని సూచిస్తుంది. ‘పంచిపెట్టాడు’ సాధారణ పాఠకులకు సహజంగా ఉండి ఆ పంపిణీ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: τοῖς ἀνακειμένοις
  choice: భోజనానికి కూర్చున్నవారికి
  rationale: ἀνάκειμαι అక్షరార్థంగా భోజనానికి ఆనుకొని పడుకునే అప్పటి ఆచారాన్ని సూచిస్తుంది. తెలుగులో ‘భోజనానికి కూర్చున్నవారు’ సహజమైన ప్రధాన పాఠ్య రూపం; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὁμοίως καὶ
  choice: అలాగే ... కూడా
  rationale: ఈ రెండు పదాల సమ్మేళనం రొట్టెలకు చేసినదే చేపల విషయంలోనూ చేశాడనే సమాంతర భావాన్ని నొక్కి చెబుతుంది.
- source_word: ἐκ τῶν ὀψαρίων
  choice: చేపల్లోనుంచి
  rationale: ὀψάριον రొట్టెతో తినే చేపను, కొన్ని సందర్భాల్లో చిన్న చేపను సూచించవచ్చు. ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం చేయకుండా ‘చేపలు’ అని అనువదించాం.
- source_word: ὅσον ἤθελον
  choice: వారు కోరినంత
  rationale: జనం తమకు కావలసిన పరిమాణమంత పొందారని ఈ పదబంధం తెలియజేస్తుంది. ‘కోరినంత’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: εὐχαριστήσας అనే పదానికి ప్రభుభోజన సంబంధమైన ప్రతిధ్వని ఉండే అవకాశం
  choice: ‘కృతజ్ఞతలు చెల్లించిన’ అని మాత్రమే అనువదించడం
  alternative: ‘ఆశీర్వదించి’ అని అనువదించడం లేదా ప్రభుభోజన భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా చేర్చడం
  rationale: ఈ క్రియ ప్రత్యక్షంగా కృతజ్ఞతలు చెల్లించడాన్ని సూచిస్తుంది. యోహాను కథనంలో ప్రభుభోజన సంబంధమైన ప్రతిధ్వని ఉండవచ్చుగానీ, అనువాదం ఆ వ్యాఖ్యానాన్ని పదాల్లోకి దిగుమతి చేయకుండా పాఠ్యంలోని భావసంభావ్యతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ప్రాచీన భోజన భంగిమను ప్రధాన పాఠ్యంలో అసహజంగా వినిపించకుండా చెప్పి, దాని అక్షరార్థాన్ని పాదసూచికలో సంరక్షించాం.
