  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: te
  text: 'యేసు వారితో ఇలా అన్నాడు: “జీవాన్ని ఇచ్చే రొట్టె నేనే. నా దగ్గరికి వచ్చేవాడు ఎన్నటికీ ఆకలిగొనడు; నన్ను నమ్మేవాడు ఎన్నడూ దాహంగొనడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూల గ్రీకులో బలమైన నిరాకరణతో పాటు ‘ఎప్పుడైనా’ అనే పదం ఉంది; భావం: ‘ఎట్టి పరిస్థితిలోనూ ఎప్పటికీ దాహంగొనడు.’'
    reason: οὐ μή ... πώποτε అనే సంయోగంలోని ఉద్ఘాటనను తెలియజేయడం.
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: యేసు వారితో ... అని అన్నాడు
  rationale: తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో వక్తను ముందుంచి, ‘అని అన్నాడు’ను చివర ఉంచడం సహజం; αὐτοῖςను ‘వారితో’గా స్పష్టంగా నిలుపుతుంది.
- source_word: Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς
  choice: జీవాహారాన్ని నేనే
  rationale: Ἐγώ అనే స్పష్ట సర్వనామంలోని ఉద్ఘాటనను ‘నేనే’ నిలుపుతుంది. ‘జీవాహారం’ τῆς ζωῆς అనే సంబంధాన్ని సంక్షిప్తంగా, సహజంగా ఉంచి రూపకాన్ని కాపాడుతుంది.
- source_word: ὁ ἐρχόμενος πρὸς ἐμὲ
  choice: నా దగ్గరికి వచ్చేవాడు
  rationale: వర్తమాన కృదంతంలోని సాధారణ, కొనసాగు భావాన్ని తెలుగు అలవాటైన ‘వచ్చేవాడు’ నిర్మాణం తెలియజేస్తుంది; πρὸς యొక్క దిశను ‘దగ్గరికి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ μὴ πεινάσῃ
  choice: ఎన్నటికీ ఆకలిగొనడు
  rationale: οὐ μή యొక్క బలమైన నిరాకరణను ‘ఎన్నటికీ ... గొనడు’ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὁ πιστεύων εἰς ἐμὲ
  choice: నన్ను నమ్మేవాడు
  rationale: యోహాను వాడుకలోని విశ్వాసపూర్వక ఆధారపడే భావాన్ని ‘నమ్ము’ సహజంగా వ్యక్తం చేస్తుంది; εἰς ἐμέను తెలుగులో అసహజంగా అక్షరానువదించకుండా సకర్మక నిర్మాణంతో అందిస్తుంది.
- source_word: οὐ μὴ διψήσει πώποτε
  choice: ఎన్నడూ దాహంగొనడు
  rationale: οὐ μήతో పాటు πώποτε ఇచ్చే సంపూర్ణ, బలమైన నిరాకరణను ‘ఎన్నడూ’ తెలియజేస్తుంది. మూలంలో లేని ‘మళ్లీ’ అనే భావాన్ని చేర్చలేదు.
theological_decisions:
- issue: Ἐγώ εἰμι అనే యేసు స్వీయ గుర్తింపు యొక్క బలం
  choice: జీవాహారాన్ని నేనే
  alternative: నేనే జీవాహారాన్ని
  rationale: ‘నేనే’ ద్వారా ఉద్ఘాటనను నిలిపి, యోహాను సువార్తలోని స్వీయ గుర్తింపు ప్రతిధ్వనిని అదనపు సిద్ధాంత వివరణ లేకుండా పాఠకునికి వదిలింది.
- issue: πιστεύων εἰς ἐμέ యొక్క అనువాదం
  choice: నన్ను నమ్మేవాడు
  alternative: నాపై విశ్వాసముంచేవాడు
  rationale: ‘నమ్మేవాడు’ సాధారణ పాఠకునికి సహజంగా ఉండి విశ్వాసం, ఆధారపడటం రెండింటికీ చోటిస్తుంది; మరింత మతపరమైన పదజాలాన్ని ప్రధాన పాఠ్యంలో రుద్దదు.
- issue: πώποτε కాలబలం
  choice: ఎన్నడూ దాహంగొనడు
  alternative: ఎట్టి పరిస్థితిలోనూ ఎప్పటికీ దాహంగొనడు
  rationale: πώποτε అంటే ‘ఎప్పుడైనా/ఎన్నడైనా’; అది స్వతహాగా ‘మళ్లీ’ అని కాదు. అందుచేత శాశ్వత నిరాకరణను నిలిపి, పునరావృత్తి భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘ఆకలిగొను/దాహంగొను’ జంట రూపక సమాంతరతను నిలుపుతుంది. ప్రధాన పాఠ్యంలో [a] గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
