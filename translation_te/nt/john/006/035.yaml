review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the speakers, the generic present participles, movement to Jesus, belief in him, and the emphatic negations. However, “జీవాహారం” means ‘life-food/nourishment’ and does not preserve the concrete metaphor ἄρτος (‘bread’). Rendering the metaphor explicitly as ‘రొట్టె’ is a safe and needed correction. The draft rightly avoids adding ‘again’ for πώποτε.
  naturalness: The conditional-style parallel clauses are clear and natural in modern standard Telugu. “యేసు వారితో ఇలా అన్నాడు:” provides a smoother narrative introduction, and “జీవాన్ని ఇచ్చే రొట్టె నేనే” is idiomatic while retaining the bread metaphor.
  terminology: “నన్ను నమ్మేవాడు” is a natural, source-appropriate rendering of πιστεύων εἰς ἐμέ. “ఎన్నటికీ/ఎన్నడూ” adequately represents the force of οὐ μή, with the footnote appropriately noting the added force of πώποτε. “జీవాన్ని ఇచ్చే రొట్టె” makes explicit the life-related sense of τῆς ζωῆς without importing doctrinal explanation.
  issues:
  - severity: medium
    issue: “జీవాహారాన్ని నేనే” omits the specific ‘bread’ metaphor and uses an accusative-form predicate.
    rationale: ἄρτος specifically denotes bread. ‘జీవాహారం’ broadens this to food/nourishment, while the accusative ending in “జీవాహారాన్ని” is not the natural predicate form here. An explicit ‘రొట్టె’ preserves both the source image and a well-formed Telugu sentence.
  revised_text: 'యేసు వారితో ఇలా అన్నాడు: “జీవాన్ని ఇచ్చే రొట్టె నేనే. నా దగ్గరికి వచ్చేవాడు ఎన్నటికీ ఆకలిగొనడు; నన్ను నమ్మేవాడు ఎన్నడూ దాహంగొనడు[a].”'
