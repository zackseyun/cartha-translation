revisions:
- from: అందువల్ల, వారు వచ్చి తనను పట్టుకొని[a] రాజుగా చేయబోతున్నారని యేసు తెలుసుకొని, ఆయన ఒక్కడే మళ్లీ కొండకు వెళ్లిపోయాడు.
  to: అందువల్ల, వారు వచ్చి ఆయనను బలవంతంగా పట్టుకొని రాజుగా చేయబోతున్నారని యేసు తెలుసుకొని, ఆయన ఒక్కడే మళ్లీ కొండకు వెళ్లిపోయాడు.
  rationale: The revision makes the coercive sense of ἁρπάζειν explicit with బలవంతంగా పట్టుకొని and clarifies the pronoun reference. The remaining wording preserves the Greek narrative connection, impending action, purpose, withdrawal, repetition, destination, and emphatic solitude. Since the forceful nuance is now represented in the text, the former lexical-alternative footnote is redundant.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:37:48Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus' awareness, the crowd's intended kingship-making, his withdrawal, the repeated movement, and his being alone. However, the main-text verb పట్టుకొని ('holding/taking') does not by itself adequately convey the coercive force of ἁρπάζειν; that force should be present in the text rather than left only to a note.
  naturalness: The revised wording is fluent modern standard Telugu. Replacing the potentially reflexive-ambiguous తనను with ఆయనను makes the crowd's intended object immediately clear, while ఆయన ఒక్కడే naturally preserves the emphasis of αὐτὸς μόνος.
  terminology: రాజుగా చేయబోతున్నారని faithfully expresses the intended making of Jesus king without adding doctrinal interpretation. బలవంతంగా పట్టుకొని appropriately reflects the forceful sense of ἁρπάζειν. No footnote is needed once that force is explicit in the main text.
  issues:
  - severity: medium
    issue: పట్టుకొని is too neutral for ἁρπάζειν in the main text.
    rationale: ἁρπάζειν denotes seizing or taking forcibly. The existing footnote identifies this nuance, but optimal-equivalence translation should represent it in the verse itself.
  - severity: low
    issue: తనను may momentarily be read reflexively in Telugu.
    rationale: Although context identifies Jesus as the referent, ఆయనను is clearer in this indirect clause and avoids avoidable ambiguity.
  revised_text: అందువల్ల, వారు వచ్చి ఆయనను బలవంతంగా పట్టుకొని రాజుగా చేయబోతున్నారని యేసు తెలుసుకొని, ఆయన ఒక్కడే మళ్లీ కొండకు వెళ్లిపోయాడు.
  revised_footnotes: []
  revision_rationale: The revision makes the coercive sense of ἁρπάζειν explicit with బలవంతంగా పట్టుకొని and clarifies the pronoun reference. The remaining wording preserves the Greek narrative connection, impending action, purpose, withdrawal, repetition, destination, and emphatic solitude. Since the forceful nuance is now represented in the text, the former lexical-alternative footnote is redundant.
