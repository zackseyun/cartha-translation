id: JHN.6.15
reference: John 6:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ⸀ποιήσωσιν βασιλέα ἀνεχώρησεν ⸀πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: te
  text: అందువల్ల, వారు వచ్చి ఆయనను బలవంతంగా పట్టుకొని రాజుగా చేయబోతున్నారని యేసు తెలుసుకొని, ఆయన ఒక్కడే మళ్లీ కొండకు వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: అందువల్ల
  rationale: ముందటి సంఘటనకు దీనివల్ల ఏర్పడిన ప్రతిస్పందనను సూచించే కథన సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γνοὺς
  choice: తెలుసుకొని
  rationale: యేసు చేసిన చర్యకు కారణమైన అవగాహనను తెలిపే భూతకాల కృదంత భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: μέλλουσιν ἔρχεσθαι
  choice: వచ్చి … చేయబోతున్నారని
  rationale: త్వరలో జరగనున్న ఉద్దేశపూర్వక చర్యను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἁρπάζειν
  choice: పట్టుకొని
  rationale: ఒకరిని వారి ఇష్టానికి విరుద్ధంగా అదుపులోకి తీసుకోవడం అనే బలవంతపు భావాన్ని సందర్భంలో మోస్తుంది; ఆ భావాన్ని పాదసూచిక స్పష్టపరుస్తుంది.
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: రాజుగా చేయబోతున్నారని
  rationale: వారు రావడం, పట్టుకోవడం వెనుకనున్న ఉద్దేశాన్ని సహజమైన పరోక్ష వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ἀνεχώρησεν
  choice: వెళ్లిపోయాడు
  rationale: ఆ పరిస్థితి నుంచి తప్పుకొని కొండవైపు వెళ్లిన భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: చర్య పునరావృతమైనదని నేరుగా సూచిస్తుంది.
- source_word: εἰς τὸ ὄρος
  choice: కొండకు
  rationale: ముందు ప్రస్తావించిన ఎత్తైన ప్రదేశాన్ని అతిగా నిర్దిష్టీకరించకుండా మూలంలోని ఏకవచనాన్ని కాపాడుతుంది.
- source_word: αὐτὸς μόνος
  choice: ఆయన ఒక్కడే
  rationale: యేసు ఇతరులెవరూ లేకుండా వెళ్లాడనే మూలంలోని ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: యేసును రాజుగా చేయాలనే జనసమూహం ఉద్దేశించిన చర్య స్వభావం
  choice: వారు ఆయనను పట్టుకొని రాజుగా చేయాలని చూశారని అనువదించడం
  alternative: వారు వచ్చి ఆయనను రాజుగా చేయాలని చూశారని మాత్రమే అనువదించడం
  rationale: ἁρπάζειν బలవంతంగా పట్టుకోవడం లేదా స్వాధీనం చేసుకోవడం అనే భావాన్ని కలిగి ఉంది; అందువల్ల జనసమూహం చర్యలోని బలవంతపు రాజకీయ ఉద్దేశాన్ని మృదువుగా చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరతను కాపాడే కథన శైలి. ‘ఆయన ఒక్కడే’ ద్వారా αὐτὸς μόνος లోని ఉద్ఘాటన నిలుపబడింది.
