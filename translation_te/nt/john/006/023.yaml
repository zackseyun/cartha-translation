  text: ⸀ἀλλὰ ἦλθεν ⸀πλοιάρια ἐκ Τιβεριάδος ἐγγὺς τοῦ τόπου ὅπου ἔφαγον τὸν ἄρτον εὐχαριστήσαντος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: te
  text: అయితే తిబెరియ నుండి కొన్ని చిన్న పడవలు, ప్రభువు కృతజ్ఞతలు తెలిపిన తర్వాత వారు రొట్టె తిన్న స్థలానికి దగ్గరగా వచ్చాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందటి వాక్యంలోని పరిస్థితికి వ్యత్యాసాన్ని సూచిస్తూ, ఆధునిక తెలుగులో సహజమైన కథన సంధిగా ఉంది.
- source_word: ἦλθεν
  choice: వచ్చాయి
  rationale: ἔρχομαι యొక్క భూతకాల కథనార్థాన్ని సూటిగా తెలుపుతుంది; బహువచనమైన పడవలకు అనుగుణంగా తెలుగు క్రియను వాడాం.
- source_word: πλοιάρια
  choice: చిన్న పడవలు
  rationale: దీనిలోని diminutive భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది; అందువల్ల ఆ భావాన్ని పాదసూచికకు మాత్రమే పరిమితం చేయలేదు.
- source_word: ἐκ Τιβεριάδος
  choice: తిబెరియ నుండి
  rationale: ప్రయాణపు ఆరంభస్థానాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: ἐγγὺς τοῦ τόπου
  choice: స్థలానికి దగ్గరగా
  rationale: సమీపాన్ని స్పష్టంగా, సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅπου ἔφαγον τὸν ἄρτον
  choice: వారు రొట్టె తిన్న స్థలం
  rationale: గ్రీకు aorist ను అనవసరమైన కాలవ్యాఖ్యానం లేకుండా సహజమైన తెలుగు భూతకాలంతో అందిస్తుంది; నిర్దిష్టమైన రొట్టెను సందర్భం స్పష్టం చేస్తుంది.
- source_word: εὐχαριστήσαντος τοῦ κυρίου
  choice: ప్రభువు కృతజ్ఞతలు చెల్లించిన తరువాత
  rationale: పాల్గొనే క్రియ సూచించే ముందస్తు చర్యను స్పష్టంగా నిలుపుతూ, κύριος యొక్క గౌరవార్థాన్ని ‘ప్రభువు’గా కాపాడుతుంది.
theological_decisions:
- issue: κύριος యొక్క అనువాదం
  choice: ప్రభువు
  alternative: యజమాని / గురువు
  rationale: ఇక్కడ ఇది యేసును సూచించే గౌరవపూర్వక బిరుదు. ‘ప్రభువు’ అనే పదం యోహాను సువార్తలోని క్రీస్తుసంబంధ ప్రతిధ్వనిని కాపాడుతుంది; దానిని మరింతగా వ్యాఖ్యానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. పొడవైన గ్రీకు వాక్య నిర్మాణాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి సంబంధాన్ని స్పష్టంగా ఉంచాం.
