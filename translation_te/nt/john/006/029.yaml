source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα ⸀πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: te
  text: 'యేసు జవాబిచ్చి వారితో ఇలా అన్నాడు: “దేవుని కార్యం ఇదే[a]: ఆయన పంపినవానిపై మీరు విశ్వాసం ఉంచడం[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుడు కోరే కార్యం” లేదా “దేవుడు చేసే కార్యం.” “దేవుని కార్యం” అనే గ్రీకు పదబంధాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు; ఇక్కడి పదప్రయోగం ఆ అర్థసందిగ్ధతను నిలుపుతుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా “ఆయన పంపినవానిపై మీరు నమ్మకం ఉంచడం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: యేసు వారికి జవాబిస్తూ ఇలా అన్నాడు
  rationale: గ్రీకులోని ‘జవాబిచ్చాడు, అన్నాడు’ అనే రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: Τοῦτό ἐστιν
  choice: ఇదే
  rationale: సూచక సర్వనామం మరియు సంధాన క్రియలోని ఉద్ఘాటనను తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: దేవుని కార్యం
  rationale: గ్రీకు సంబంధవిభక్తి దేవుడు కోరే కార్యమా, దేవుడు చేసే కార్యమా అనే అర్థసందిగ్ధతను ప్రధాన పాఠంలో సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: ἵνα πιστεύητε
  choice: మీరు విశ్వసించడం
  rationale: ἵνα ఉపవాక్యాన్ని ముందు చెప్పిన ‘కార్యం’ యొక్క విషయవివరణగా సహజమైన తెలుగు నామీకృత నిర్మాణంలో అందిస్తుంది; వర్తమాన సంభావనార్థక క్రియను సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς ὃν
  choice: పంపినవానిని
  rationale: πιστεύω εἰς యొక్క వ్యక్తిగత లక్ష్యాన్ని తెలుగులో ‘విశ్వసించడం’తో వచ్చే సహజ కర్మరూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἀπέστειλεν ἐκεῖνος
  choice: ఆయన పంపిన
  rationale: ἐκεῖνος దేవుణ్ణి సూచిస్తుంది; గౌరవప్రదమైన ‘ఆయన’ సహజంగా ఆ సూచనను నిలుపుతుంది, గ్రీకు భూతకాల పంపడాన్ని ‘పంపిన’గా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: τοῦ θεοῦ అనే సంబంధవిభక్తి యొక్క అర్థం
  choice: ప్రధాన పాఠంలో ‘దేవుని కార్యం’ అని అర్థసందిగ్ధతను నిలుపడం
  alternative: ‘దేవుడు కోరే కార్యం’ లేదా ‘దేవుడు చేసే కార్యం’
  rationale: గ్రీకు పదబంధం దేవుడు కోరే కార్యాన్నీ లేదా దేవుడు చేసే కార్యాన్నీ సూచించగలదు. సందర్భం రెండింటి వైపూ వినిపించే అవకాశాన్ని ఇస్తున్నందున అనువాదంలో ఒకదానిని సిద్ధాంతపరంగా నిర్ణయించలేదు.
- issue: πιστεύητε εἰς యొక్క అనువాదం
  choice: ‘పంపినవానిని మీరు విశ్వసించడం’
  alternative: ‘పంపినవానిపై మీరు నమ్మకం ఉంచడం’
  rationale: యోహాను రచనలో πιστεύω εἰς సాధారణంగా వ్యక్తిపై విశ్వాసాన్ని సూచిస్తుంది. ‘విశ్వసించడం’ మూలపదానికి సమీపంగా ఉండగా, ‘నమ్మకం ఉంచడం’ దాని విశ్వాసపూర్వక ఆధారపడే భావాన్ని స్పష్టం చేసే సాధ్యమైన ప్రత్యామ్నాయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘కార్యం’ బైబిలు సందర్భానికి తగిన గంభీరతను ఉంచుతూనే సాధారణ పాఠకులకు అర్థమయ్యే పదం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
