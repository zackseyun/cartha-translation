  terminology: ‘ప్రజలు’ for ἀνθρώπους and ‘పురుషులు’ for ἄνδρες appropriately retain the Greek lexical contrast. ‘కూర్చోబెట్టండి/కూర్చున్నారు’ is a natural contextual rendering of the meal-reclining verbs; the footnote adequately records the alternative.
