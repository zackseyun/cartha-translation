source:
  edition: SBLGNT
  text: ⸀εἶπεν ὁ Ἰησοῦς· Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ⸀ὡς πεντακισχίλιοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: te
  text: యేసు, “ప్రజలను[a] కూర్చోబెట్టండి[b]” అన్నాడు. ఆ స్థలంలో చాలా గడ్డి ఉండేది. కాబట్టి దాదాపు ఐదువేల మంది పురుషులు కూర్చున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో మొదట ‘ప్రజలు’ (ἀνθρώπους) అనే సాధారణ పదం ఉంది; తర్వాత ‘పురుషులు’ (ἄνδρες) అనే ప్రత్యేక పదం ఉంది. అందువల్ల దాదాపు ఐదువేల అనే లెక్క పురుషులకే సంబంధించినదిగా సూచించబడుతోంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘భోజనానికి వాలి కూర్చోబెట్టండి.’ గ్రీకు క్రియ భోజనం చేయడానికి వాలి లేదా ఆనుకొని కూర్చోవడాన్ని సూచించగలదు; ఇక్కడ సహజమైన తెలుగుకోసం ‘కూర్చోబెట్టండి’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε
  choice: కూర్చోబెట్టండి
  rationale: ποιέωతో కూడిన ἀναπεσεῖν ఇక్కడ కారణార్థక ఆజ్ఞను ఇస్తుంది. తెలుగులో ‘కూర్చోబెట్టండి’ ఆ భావాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: τοὺς ἀνθρώπους
  choice: ప్రజలను
  rationale: ἄνθρωπος ఇక్కడ జనసమూహాన్ని సాధారణంగా సూచిస్తుంది; తర్వాత వచ్చే పురుషులకు మాత్రమే ప్రత్యేకమైన ἄνδρεςతో ఉన్న తేడాను ‘ప్రజలు’ నిలుపుతుంది.
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: కూర్చోబెట్టండి / కూర్చున్నారు
  rationale: ἀναπίπτω భోజనానికి ఆనుకొని కూర్చోవడాన్ని లేదా వాలడాన్ని సూచించగలదు. ఈ బహిరంగ సందర్భంలో ఆధునిక తెలుగులో ‘కూర్చోవడం’ సహజంగా ఉండి చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: χόρτος πολὺς
  choice: చాలా గడ్డి
  rationale: χόρτος ఇక్కడ గడ్డిని, πολὺς దాని సమృద్ధిని సూచిస్తాయి. ‘చాలా గడ్డి’ మూలానికి దగ్గరగా ఉండే సహజమైన తెలుగు ప్రయోగం.
- source_word: ἐν τῷ τόπῳ
  choice: ఆ స్థలంలో
  rationale: నిర్దిష్ట స్థలాన్ని సూచించే మూలంలోని స్థానార్థక పదబంధాన్ని స్పష్టమైన తెలుగులో అందిస్తుంది.
- source_word: οἱ ἄνδρες
  choice: పురుషులు
  rationale: ἀνήρ ఇక్కడ పురుషులను ప్రత్యేకంగా సూచిస్తుంది. ముందు ఉన్న సాధారణ ἀνθρώπουςతో తేడాను ఈ అనువాదం నిలుపుతుంది.
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: వారి సంఖ్య దాదాపు ఐదువేలు
  rationale: ὡς తెలిపే సుమారు అంచనానూ, τὸν ἀριθμόν తెలిపే సంఖ్యాభావాన్నీ సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: అద్భుత భోజన సందర్భంలో లెక్కించబడినవారి లింగసూచన
  choice: ἀνθρώπουςను ‘ప్రజలు’గా, ἄνδρεςను ‘పురుషులు’గా వేరు చేయడం
  alternative: రెండు పదాలనూ ‘ప్రజలు’ లేదా ‘మనుషులు’ అని సాధారణంగా అనువదించడం
  rationale: గ్రీకు పాఠం మొదట జనసమూహానికి సాధారణ పదాన్ని, తర్వాత లెక్కకు సంబంధించి పురుషులను సూచించే ప్రత్యేక పదాన్ని ఉపయోగిస్తుంది. ఆ పదభేదాన్ని నిలపడం మూలంలోని భావతీవ్రతను పరిష్కరించకుండా యథాతథంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. ‘ప్రజలు/పురుషులు’ అనే మూలపాఠంలోని పదభేదం ఉద్దేశపూర్వకంగా నిలుపబడింది; భోజన భంగిమకు సంబంధించిన సాంస్కృతిక భావం పాదసూచికలో ఇవ్వబడింది.
