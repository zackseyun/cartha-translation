id: JHN.6.65
reference: John 6:65
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: te
  text: 'ఆయన ఇలా చెబుతూ ఉన్నాడు: “ఈ కారణంగానే నేను మీతో చెప్పాను: తండ్రి నుండి అతనికి[b] ఇవ్వబడితే[a] తప్ప, ఎవరూ నా దగ్గరికి రాలేరు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అనుగ్రహించబడితే.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ఇక్కడ పుంలింగ ఏకవచనమైన “అతనికి” అనే రూపం ఉంది; అది సాధారణంగా ఏ వ్యక్తినైనా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం ప్రసంగం కొనసాగుతున్న భావాన్ని సూచిస్తుంది; తెలుగులో ఈ రూపం ఆ కొనసాగింపు కోణాన్ని నిలుపుతుంది.
- source_word: Διὰ τοῦτο
  choice: ఈ కారణంగానే
  rationale: ముందు చెప్పిన విషయాన్ని వెనక్కి సూచిస్తూ ఇప్పుడు ఇచ్చే వివరణతో అనుసంధానిస్తుంది.
- source_word: εἴρηκα ὑμῖν
  choice: నేను మీతో చెప్పాను
  rationale: ఇప్పటికీ వర్తించేలా ముందే చెప్పిన మాటను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐδεὶς δύναται ἐλθεῖν πρός με
  choice: ఎవరూ నా దగ్గరికి రాలేరు
  rationale: ఇది అనుమతి లేకపోవడం కంటే సామర్థ్యం లేకపోవడాన్ని తెలుపుతుంది; యోహాను సందర్భంలోని సంబంధాత్మక భావాన్ని విస్తరించి వ్యాఖ్యానించకుండా ఉంచుతుంది.
- source_word: ἐὰν μὴ ᾖ δεδομένον
  choice: అది ఇవ్వబడితే తప్ప
  rationale: δίδωμι అనే మూలపదంలోని ‘ఇవ్వడం’ భావాన్నీ, కర్తను ప్రత్యక్షంగా పేర్కొనని నిష్క్రియ నిర్మాణాన్నీ నిలుపుతుంది.
- source_word: αὐτῷ
  choice: అతనికి
  rationale: గ్రీకు పాఠంలోని వ్యాకరణపరమైన పుంలింగ ఏకవచన రూపాన్ని నిలుపుతుంది; దాని సాధారణ మానవ సూచనను పాదసూచిక వివరిస్తుంది.
- source_word: ἐκ τοῦ πατρός
  choice: తండ్రి నుండి
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవ భావాన్ని ‘తండ్రిచేత’ అనే కర్తృత్వార్థంగా మార్చకుండా కాపాడుతుంది.
theological_decisions:
- issue: యేసు దగ్గరికి రావడంలో దైవిక అనుగ్రహం మరియు మానవ సామర్థ్యం
  choice: తండ్రి నుండి ఇవ్వబడటం యేసు దగ్గరికి రావడానికి అవసరమైన షరతని నేరుగా అనువదించడం
  alternative: ఆ ఇవ్వడం తప్పకుండా ఫలించే పిలుపని లేదా అందరికీ ముందుగా ఇచ్చే సామర్థ్యమని ప్రత్యేకంగా వివరించడం
  rationale: గ్రీకు వాక్యం దైవికంగా ఇవ్వబడటం అవసరమని స్పష్టంగా చెబుతుంది; అయితే ఆ ఇవ్వడం స్వభావం లేదా విస్తృతి గురించి తరువాతి సిద్ధాంత వివాదాలను ఈ వాక్యం తానే పరిష్కరించదు.
- issue: αὐτῷ లోని సాధారణార్థక పుంలింగ ఏకవచనం
  choice: ప్రధాన పాఠంలో ‘అతనికి’ అని ఉంచి, దాని సాధారణార్థాన్ని పాదసూచికలో తెలపడం
  alternative: ‘ఆ వ్యక్తికి’ లేదా బహువచన రూపంతో అనువదించడం
  rationale: మూలంలోని వ్యాకరణ రూపాన్ని కాపాడుతూ, అది పురుషులకు మాత్రమే పరిమితమైన సూచన కాదని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘తండ్రి నుండి’ మూలాన్ని సూచించే భావాన్ని, ‘రాలేరు’ అసమర్థతను, ‘చెబుతూ ఉన్నాడు’ అసంపూర్ణ భూతకాల కొనసాగింపును కాపాడుతున్నాయి.
