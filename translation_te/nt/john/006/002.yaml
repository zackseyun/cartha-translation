id: JHN.6.2
reference: John 6:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἠκολούθει δὲ⸃ αὐτῷ ὄχλος πολύς, ὅτι ⸀ἐθεώρουν τὰ σημεῖα ἃ ἐποίει ἐπὶ τῶν ἀσθενούντων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: te
  text: ఒక పెద్ద జనసమూహం ఆయనను అనుసరిస్తూ ఉండేది. ఎందుకంటే, రోగుల విషయంలో ఆయన చేస్తున్న సూచక కార్యాలను[a] వారు చూస్తూ ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అద్భుతాలు’, ‘అద్భుత సూచనలు’. యోహాను వాడిన పదం ఈ కార్యాలు యేసు గురించి వెల్లడించే విషయాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: అనుసరిస్తూ ఉండేది
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న గత చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానకం మాత్రమే; తెలుగు వాక్యప్రవాహంలో దాన్ని విడిగా చేర్చకపోవడం సహజం, విరోధార్థాన్ని కూడా అనవసరంగా కలిగించదు.
- source_word: ὄχλος πολύς
  choice: ఒక పెద్ద జనసమూహం
  rationale: జనుల సంఖ్య అధికంగా ఉందనే πολύς భావాన్ని స్పష్టంగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐθεώρουν
  choice: చూస్తూ ఉండేవారు
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న లేదా పదేపదే జరిగిన పరిశీలన భావాన్ని నిలుపుతుంది.
- source_word: σημεῖα
  choice: సూచక క్రియలను
  rationale: యోహాను రచనలో ఈ కార్యాలు యేసు గురించి ఏదో వెల్లడించే ‘సూచనలు’ అనే భావాన్ని నిలుపుతూ, తెలుగులో అవి కార్యాలని స్పష్టం చేస్తుంది.
- source_word: ἐποίει
  choice: చేస్తున్న
  rationale: యేసు కొనసాగిస్తూ చేసిన కార్యాలనే అసంపూర్ణ భూతకాల భావాన్ని సందర్భానుకూలంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: రోగుల విషయంలో
  rationale: రోగులపై లేదా వారికి సంబంధించి జరిగిన క్రియల సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, కృత్రిమమైన ‘రోగుల మీద’ అనే రూపాన్ని నివారిస్తుంది.
- source_word: ἀσθενούντων
  choice: రోగుల
  rationale: ఈ సందర్భంలో ἀσθενέω శారీరక అనారోగ్యాన్ని సూచిస్తుంది; ‘రోగులు’ సంక్షిప్తంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: యోహాను రచనలో σημεῖα అనే పదప్రయోగం
  choice: సూచక క్రియలు
  alternative: అద్భుతాలు; అద్భుత సూచనలు
  rationale: కేవలం అసాధారణ శక్తికార్యాలనే కాక, యేసు గురించి వెల్లడించే వాటి సంకేతార్థాన్ని కూడా ‘సూచక క్రియలు’ నిలుపుతుంది; అదనపు సిద్ధాంత వివరణను మూలపాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలి. గ్రీకు అసంపూర్ణ భూతకాల క్రియల కొనసాగింపు భావాన్ని తెలుగు క్రియారూపాలతో నిలిపింది.
