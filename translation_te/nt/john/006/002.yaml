  source_fidelity: 'The draft preserves the major elements of the Greek: a large crowd, ongoing following and observing (imperfects), the Johannine term σημεῖα, and the relation of the signs to the sick. The causal connection is retained. “రోగుల విషయంలో” is an acceptable idiomatic way to express the signs performed in relation to sick people without overstating the precise force of ἐπί.'
  naturalness: The wording is generally clear, but “సూచక క్రియలు” is somewhat technical and less idiomatic in this narrative context. “సూచక కార్యాలు” is more natural modern standard Telugu while retaining the intentional ‘sign’ terminology.
  terminology: “సూచక కార్యాలు” preserves the lexical and theological force of σημεῖα without reducing it to “miracles.” The footnote appropriately supplies the alternatives and explains the revelatory nuance. “రోగులు” naturally reflects the physical-illness sense of ἀσθενούντων in context.
