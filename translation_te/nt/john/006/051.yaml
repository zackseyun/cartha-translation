- from: పరలోకం నుంచి దిగివచ్చిన సజీవమైన రొట్టెను నేనే. ఎవరైనా ఈ రొట్టెను తింటే[a], అతడు శాశ్వతంగా జీవిస్తాడు[b]. లోకానికి జీవం కలగడానికి నేను ఇవ్వబోయే రొట్టె నా మాంసమే[c].
  to: పరలోకం నుంచి దిగివచ్చిన సజీవమైన రొట్టెను నేనే. ఎవరైనా ఈ రొట్టెను తింటే[a], వారు శాశ్వతంగా జీవిస్తారు[b]. నేను ఇవ్వబోయే రొట్టె లోక జీవం కోసం ఇచ్చే నా మాంసమే[c].
