  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: te
  text: పరలోకం నుంచి దిగివచ్చిన సజీవమైన రొట్టెను నేనే. ఎవరైనా ఈ రొట్టెను తింటే[a], వారు శాశ్వతంగా జీవిస్తారు[b]. నేను ఇవ్వబోయే రొట్టె లోక జీవం కోసం ఇచ్చే నా మాంసమే[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘ఈ రొట్టె నుండి తింటే.’
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘యుగంలోకి జీవిస్తారు’; ఈ గ్రీకు నానుడి అంతంలేకుండా లేదా శాశ్వతంగా జీవించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో ‘మాంసం’; ‘శరీరం’ కాదు. ఇక్కడి పదప్రయోగం ఉద్దేశపూర్వకంగా కాంక్రీటుగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  choice: సజీవమైన రొట్టె
  rationale: ζῶν అనే విశేషణార్థక కృదంతాన్ని నేరుగా ‘సజీవమైన’ అని అనువదించడం ద్వారా ‘జీవాహారం’ వంటి సమీప సందర్భపు పదబంధాన్ని ఇక్కడికి దిగుమతి చేయకుండా మూలంలోని ‘living bread’ భావాన్ని నిలుపుతుంది.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: పరలోకం నుంచి దిగివచ్చిన
  rationale: καταβάς పూర్తయిన దిగివచ్చుటను సూచిస్తుంది. ఆధునిక తెలుగులో సహజమైన సంబంధవాచక రూపం మూలంలోని పరలోక అవతరణ ప్రకటనను స్పష్టంగా నిలుపుతుంది.
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: ఎవరైనా ఈ రొట్టెను తింటే
  rationale: ἐάν మరియు aorist subjunctive సాధారణ షరతును సూచిస్తాయి; τις ను లింగపరంగా పరిమితం చేయకుండా ‘ఎవరైనా’గా ఇచ్చాం. ἐκ ను అక్షరార్థంగా ప్రధాన వాక్యంలో పెట్టడం తెలుగులో అసహజంగా ఉండటంతో సహజమైన కర్మరూపాన్ని వాడి, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: అతడు శాశ్వతంగా జీవిస్తాడు
  rationale: యోహాను రచనలో εἰς τὸν αἰῶνα నిరంతరమైన, అంతంలేని కాలాన్ని సూచించే నానుడి. ‘శాశ్వతంగా జీవిస్తాడు’ ఆధునిక తెలుగులో దాని భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: నేను ఇవ్వబోయే రొట్టె
  rationale: δώσω లోని భవిష్యత్ స్వీయ-అర్పణ భావాన్ని ‘ఇవ్వబోయే’ స్పష్టంగా నిలుపుతుంది. δέ ఇక్కడ బలమైన వ్యతిరేకతకన్నా ఆలోచనను ముందుకు తీసుకెళ్తుంది; తెలుగులో ప్రత్యేక సంధాన పదం లేకుండానే ఆ సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: ἡ σάρξ μού ἐστιν
  choice: నా మాంసమే
  rationale: σάρξ కు కాంక్రీటు పదమైన ‘మాంసం’ వాడాం. ‘శరీరం’ అని అనువదిస్తే మూలంలోని ఉద్దేశపూర్వకమైన గాఢత తగ్గి వ్యాఖ్యానాత్మకంగా మారుతుంది. ‘-ఏ’ యేసు చెప్పిన predicate identification ను సహజంగా బలపరుస్తుంది.
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: లోకానికి జీవం కలగడానికి
  rationale: ὑπέρ లోని ప్రయోజనార్థక/పక్షార్థక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. κόσμος ను ‘లోకం’గానే ఉంచి దాని పరిధిని ‘మానవాళి’ వంటి వ్యాఖ్యానాత్మక పదంతో ముందే పరిమితం చేయలేదు.
theological_decisions:
- issue: యేసు తనను గురించి ఉపయోగించిన σάρξ పదం
  choice: ప్రధాన పాఠ్యంలో ‘మాంసం’
  alternative: ‘శరీరం’
  rationale: ఈ సందర్భంలో σάρξ కాంక్రీటుగా, ఉద్దేశపూర్వకంగా గాఢమైన పదం. ‘శరీరం’ అని మార్చడం దాని శబ్దబలాన్ని మృదువుచేసి, సంస్కార సంబంధమైన లేదా ఇతర వ్యాఖ్యానాన్ని అనువాదంలోనే నిర్ణయించవచ్చు.
- issue: ‘లోకం’ అనే పదపు పరిధి
  choice: κόσμος ను ‘లోకం’గా విస్తృతంగానే నిలుపడం
  alternative: ‘మానవాళి’ లేదా ఏదైనా సంకుచిత వర్గం
  rationale: వచనం చెప్పే విస్తృత పరిధిని అనువాదం తగ్గించకూడదు. ‘లోకం’ యోహాను రచనలోని ప్రతిధ్వనిని, అలాగే పాఠ్యంలో ఉన్న ధార్మిక ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ‘పరలోకం నుంచి దిగివచ్చిన’ అన్న మాటలోని క్రీస్తు సంబంధమైన బలం
  choice: నిజమైన అవతరణను సూచించే సూటి అనువాదం
  alternative: కేవలం దేవుని నియామకానికి రూపకంగా భావించే అనువాదం
  rationale: మూలంలోని καταβάς ను సూటిగా అనువదించడం యోహాను సందర్భంలోని అవతరణ ప్రకటనను పలుచన చేయకుండా ఉంచుతుంది; అంతకుమించిన సిద్ధాంత వివరణను మాత్రం జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘రొట్టె,’ ‘మాంసం,’ ‘లోకం’ వంటి మూలపదాలకు దగ్గరైన స్పష్టమైన పదాలను నిలిపి, పాతకాలపు ‘పరలోకమునుండి,’ ‘జీవించును’ వంటి రూపాలను నివారించాం. నిర్దిష్ట ఏకవచన నిర్మాణాన్ని ‘ఎవరైనా ... అతడు’గా ఉంచినా, దాని భావం పురుషులకు మాత్రమే పరిమితం కాదు.
