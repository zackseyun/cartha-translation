  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: te
  text: వారు సముద్రం అవతల ఆయనను కనుగొని, ఆయనతో, “రబ్బీ, మీరు ఇక్కడికి ఎప్పుడు వచ్చారు?[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత రూపసన్నిహితంగా, “మీరు ఎప్పుడు ఇక్కడికి వచ్చియున్నారు?” అని అనువదించవచ్చు. గ్రీకులో పరిపూర్ణకాల క్రియ ఉంది; సందర్భంలో దాని సహజ భావం, “మీరు ఇక్కడికి ఎప్పుడు వచ్చారు?” అనేదే.
