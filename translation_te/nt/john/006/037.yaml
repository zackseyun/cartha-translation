  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: te
  text: తండ్రి నాకు ఇచ్చేదంతా[a] నా దగ్గరికి వస్తుంది. నా దగ్గరికి వచ్చే వ్యక్తిని నేను ఎంతమాత్రమూ బయటకు తోసివేయను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూల గ్రీకులో ఇది నపుంసక ఏకవచన సమష్టి ప్రయోగం. మరొక విధంగా: ‘తండ్రి నాకు ఇస్తున్నదంతా.’'
    reason: lexical_alternative
  - marker: b
    text: 'మరొక విధంగా: ‘నేను ఎన్నటికీ బయటకు తోసివేయను’ లేదా ‘నేను ఏ మాత్రమూ బయటకు తోసివేయను.’ మూల గ్రీకులో బలమైన నిరాకరణ ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: ఇచ్చేదంతా
  rationale: నపుంసక ఏకవచన సమష్టి ప్రయోగాన్ని వ్యక్తులుగా ముందే వ్యాఖ్యానించకుండా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δίδωσίν μοι ὁ πατήρ
  choice: తండ్రి నాకు ఇచ్చేదంతా
  rationale: వర్తమాన కాలంలోని ‘ఇస్తాడు/ఇచ్చేది’ భావాన్ని తెలుగు సంబంధార్థక నిర్మాణంలో సహజంగా వ్యక్తం చేస్తూ, గ్రీకులో లేని ‘నా’ అనే స్వామ్యపదాన్ని ‘తండ్రి’కి జోడించదు.
- source_word: πρὸς ἐμὲ ἥξει
  choice: నా దగ్గరికి వస్తుంది
  rationale: ἥκω యొక్క ‘వచ్చు/చేరుకొను’ భావాన్ని యోహాను సందర్భానికి తగిన సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τὸν ἐρχόμενον πρός με
  choice: నా దగ్గరికి వచ్చేవాణ్ణి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న వర్తమాన కృదంతాన్ని వ్యక్తిని సూచించే సహజ తెలుగు రూపంలో నిలుపుతుంది.
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: నేను ఎంతమాత్రమూ బయటకు తోసివేయను
  rationale: οὐ μή అనే బలమైన నిరాకరణను ‘ఎంతమాత్రమూ ... చేయను’ ద్వారా వ్యక్తం చేసి, ἐκβάλω ἔξωలోని బయటకు పంపివేయడం అనే చిత్రాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: πᾶν ὃ అనే నపుంసక ఏకవచన సమష్టి ప్రయోగం—దైవికంగా ఇవ్వబడటం, మానవుడు రావడం మధ్య సంబంధం
  choice: ‘తండ్రి నాకు ఇచ్చేదంతా’ అని సమష్టి రూపంలో అనువదించబడింది.
  alternative: ‘తండ్రి నాకు ఇచ్చే ప్రతి ఒక్కరూ’
  rationale: వ్యక్తిగత అర్థం సందర్భంలో సాధ్యమైనా, గ్రీకు వ్యాకరణంలోని నపుంసక సమష్టి రూపాన్ని నిలిపి, సమూహం-వ్యక్తి సంబంధంపై ఉన్న వేదాంత చర్చను అనువాదంలోనే తీర్మానించదు.
- issue: οὐ μὴ ἐκβάλω ἔξωలో యేసు ఇచ్చే హామీ యొక్క బలం
  choice: ‘నేను ఎంతమాత్రమూ బయటకు తోసివేయను’ అనే బలమైన నిరాకరణ
  alternative: ‘నేను ఎన్నటికీ బయటకు తోసివేయను’
  rationale: యేసు తన దగ్గరికి వచ్చేవాణ్ణి తిరస్కరించడనే ప్రసక్తే లేదని గ్రీకు బలంగా చెబుతుంది. అయితే ఈ వాక్యాన్ని పట్టుదల లేదా భ్రష్టత్వం గురించిన తరువాతి సిద్ధాంత సూత్రంగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ‘నా దగ్గరికి’ ఉపయోగించబడింది. వాక్యానికి గౌరవభరితమైన సరళతను ఉంచుతూ, సమష్టి నపుంసక రూపం మరియు బలమైన నిరాకరణ రెండింటినీ స్పష్టంగా కాపాడింది.
