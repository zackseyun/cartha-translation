- from: తండ్రి నాకు ఇచ్చేదంతా[a] నా దగ్గరికి వస్తుంది. నా దగ్గరికి వచ్చేవాణ్ణి నేను ఎంతమాత్రమూ బయటకు తోసివేయను[b].
  to: తండ్రి నాకు ఇచ్చేదంతా[a] నా దగ్గరికి వస్తుంది. నా దగ్గరికి వచ్చే వ్యక్తిని నేను ఎంతమాత్రమూ బయటకు తోసివేయను[b].
