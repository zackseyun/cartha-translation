translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘ఆయన’ ద్వారా యేసుకు సందర్భానుగుణ గౌరవప్రయోగం చేయబడింది; మూలంలోని సమాచార క్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా అమర్చబడింది.
