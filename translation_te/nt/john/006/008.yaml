base_translation:
  language: en
  yaml_path: translation/nt/john/006/008.yaml
  text: One of his disciples, Andrew, Simon Peter’s brother, said to him,
translation:
  language: te
  text: 'ఆయన శిష్యులలో ఒకడైన, సీమోను పేతురు సోదరుడైన అంద్రెయ ఆయనతో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథన శైలిలో భూతకాలమైన ‘అన్నాడు’ సహజంగా ఉండి సంఘటన భావాన్ని సరిగ్గా తెలియజేస్తుంది.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: మాట ఎవరిని ఉద్దేశించి పలికిందో తెలిపే దత్తివ విభక్తి సర్వనామం; సందర్భంలో ఇది యేసును సూచిస్తుంది.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ఆయన శిష్యులలో ఒకడైన
  rationale: εἷς ἐκ అనే భాగసూచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: μαθητῶν
  choice: శిష్యులు
  rationale: సువార్తల సందర్భంలో μαθηταί సూచించే బోధనాత్మక, అనుబంధ సంబంధాన్ని ‘శిష్యులు’ సహజంగా నిలుపుతుంది.
- source_word: Ἀνδρέας
  choice: అంద్రెయ
  rationale: గ్రీకు వ్యక్తినామాన్ని దాని మూల ఉచ్చారణకు దగ్గరగా తెలుగులో లిప్యంతరీకరించింది.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: సీమోను పేతురు సోదరుడు
  rationale: అంద్రెయను సీమోను పేతురు సోదరునిగా గుర్తించే అన్వయార్థక పదబంధాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: Σίμωνος Πέτρου
  choice: సీమోను పేతురు
  rationale: జతగా ఉన్న రెండు పేర్లను ఒకే వ్యక్తికి సంబంధించిన సుపరిచిత సంయుక్త గుర్తింపుగా నిలుపుతుంది.
