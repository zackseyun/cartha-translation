  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: te
  text: అయితే మనుష్యకుమారుడు తాను ఇంతకు ముందు ఉన్న చోటికి ఎక్కిపోవడాన్ని మీరు చూస్తే?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయితే మనుష్యకుమారుడు తాను ఇంతకు ముందు ఉన్న చోటికి ఎక్కిపోతుండగా మీరు చూస్తే?” గ్రీకులో ఇది షరతుతో కూడిన అలంకారప్రశ్న; ప్రశ్నలోని ఫలితం స్పష్టంగా చెప్పబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: అయితే ... చూస్తే ఏమనుకుంటారు?
  rationale: οὖν యొక్క అన్వయార్థాన్ని ‘అయితే’ తెలియజేస్తుంది; ἐὰν తో ఏర్పడిన షరతుతో కూడిన అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగులో ‘చూస్తే ఏమనుకుంటారు?’ అని వ్యక్తం చేశాం.
- source_word: θεωρῆτε
  choice: మీరు చూస్తే
  rationale: ఈ క్రియ శ్రద్ధగా చూడడం లేదా ప్రత్యక్షంగా గమనించడం అనే భావాన్ని కలిగించగలదు. ఇక్కడ ‘చూస్తే’ షరతు మరియు భావి సంభావ్యతను సహజంగా నిలుపుతుంది.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: సువార్తల్లో యేసు ఉపయోగించిన స్థిరమైన స్వీయనామాన్ని, దానియేలు గ్రంథానికి సంబంధించిన ప్రతిధ్వనితో సహా, వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: ἀναβαίνοντα
  choice: ఎక్కిపోవడం
  rationale: పైకి వెళ్లే కదలికను స్పష్టంగా, సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది; సందర్భంలోని పరలోక సంబంధ సూచనను ప్రత్యేకంగా చేర్చకుండా అనుమతిస్తుంది.
- source_word: ὅπου ἦν τὸ πρότερον
  choice: తాను ఇంతకు ముందు ఉన్న చోటికి
  rationale: మునుపటి స్థలం లేదా స్థితిని సూచించే గ్రీకు పదబంధాన్ని నిలుపుతూ, ఆ చోటు పరలోకమని లేదా తండ్రి దగ్గరని పాఠ్యంలో లేని వివరాలతో స్పష్టీకరించదు.
theological_decisions:
- issue: యేసు ఎక్కిపోవడాన్ని ఆయన పూర్వాస్తిత్వం మరియు పరలోక మూలం గురించిన స్పష్టమైన వ్యాఖ్యగా విస్తరించాలా?
  choice: ‘తాను ఇంతకు ముందు ఉన్న చోటికి’ అని మాత్రమే అనువదించడం
  alternative: ‘తాను ఇంతకు ముందు ఉన్న పరలోకానికి’ లేదా ‘తాను ఇంతకు ముందు ఉన్న తండ్రి దగ్గరికి’
  rationale: గ్రీకు వాక్యం పూర్వాస్తిత్వం మరియు ఆరోహణను బలంగా సూచించినా, పరలోకాన్ని గానీ తండ్రిని గానీ ఈ వచనంలో నేరుగా పేర్కొనదు. కాబట్టి దాని క్రీస్తు సంబంధమైన ఉద్వేగాన్ని నిలుపుతూ వ్యాఖ్యానాత్మక పదాలను చేర్చలేదు.
- issue: అసంపూర్ణంగా వినిపించే గ్రీకు అలంకారప్రశ్నను తెలుగులో ఎలా ప్రతిబింబించాలి?
  choice: ‘చూస్తే ఏమనుకుంటారు?’ అని ప్రధాన పాఠ్యంలో సహజమైన ప్రశ్నగా ఇవ్వడం, మరింత రూపానుసారమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో చూపడం
  alternative: ‘అయితే ... ఎక్కిపోవడం మీరు చూస్తే?’
  rationale: మూలంలో ఫలితవాక్యం వ్యక్తంగా లేకపోవడం వల్ల అలంకారప్రశ్నకు ఉద్దేశపూర్వక ఉద్వేగం ఉంది. ప్రధాన పాఠ్యం సహజమైన తెలుగులో ఆ ప్రశ్నార్థక ప్రభావాన్ని అందిస్తుండగా, పాదటిప్పణి మూల నిర్మాణంలోని సంక్షిప్తతను పారదర్శకంగా చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ఆరోహణం’ వంటి అధిక మతపరమైన పదానికి బదులు ‘ఎక్కిపోవడం’ ఎంచుకున్నాం; ‘మనుష్య కుమారుడు’ అనే స్థిర బిరుదును మాత్రం నిలిపాం.
