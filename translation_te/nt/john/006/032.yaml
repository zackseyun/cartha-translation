review_pass:
  verdict: revise
  source_fidelity: The draft preserves the doubled ἀμήν, the contrastive force of οὐ Μωϋσῆς, the past/present contrast between δέδωκεν and δίδωσιν, and the unexpanded rendering of ἀληθινός. A small revision improves the Telugu connective and makes the present giving more idiomatic without altering the source sense.
  naturalness: “అందుకు యేసు” is less natural in modern standard Telugu than “కాబట్టి యేసు.” The predicate-fronted clause “ఇస్తున్నది నా తండ్రి” is understandable, but “నా తండ్రే ... ఇస్తున్నాడు” is smoother while retaining the agency contrast.
  terminology: “పరలోకం,” “మోషే,” “తండ్రి,” and “నిజమైన రొట్టె” are suitable. The existing second footnote goes beyond a lexical alternative by specifying an “ultimate” bread and should be limited to the semantic range of ἀληθινός.
  issues:
  - severity: low
    issue: Opening connective is somewhat awkward.
    rationale: οὖν has inferential/continuative force. “కాబట్టి” expresses this naturally in contemporary standard Telugu; “అందుకు యేసు” is stylistically less fluent.
  - severity: low
    issue: Footnote b interpretively overstates the lexical note.
    rationale: “అంతిమ రొట్టె” and the explicit comparison to manna explain a possible Johannine implication, but they are not required by ἀληθινός itself. A lexical footnote should retain “real/genuine” alternatives without narrowing the interpretation.
  revised_text: 'కాబట్టి యేసు వారితో ఇలా అన్నాడు: “నిజంగా, నిజంగా మీతో చెబుతున్నాను: పరలోకం నుండి వచ్చిన రొట్టెను మీకు ఇచ్చింది మోషే కాదు[a]; పరలోకం నుండి వచ్చే నిజమైన రొట్టెను[b] మీకు ఇస్తున్నది నా తండ్రే.”'
