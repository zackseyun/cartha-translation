source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: te
  text: 'కాబట్టి యేసు వారితో ఇలా అన్నాడు: “నిజంగా, నిజంగా మీతో చెబుతున్నాను: పరలోకం నుండి వచ్చిన రొట్టెను మీకు ఇచ్చింది మోషే కాదు[a]; పరలోకం నుండి వచ్చే నిజమైన రొట్టెను[b] మీకు ఇస్తున్నది నా తండ్రే.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోకం నుండి వచ్చిన రొట్టెను మీకు ఇచ్చినవాడు మోషే కాదు.” గ్రీకులో నిరాకరణ ‘మోషే’కు ముందు ఉంది; అందువల్ల ఇచ్చినవాడు ఎవరు అనే వ్యత్యాసానికి ప్రత్యేక ప్రాధాన్యం వస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నిజమైన రొట్టె”ను “అసలైన రొట్టె” లేదా “యథార్థమైన రొట్టె” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అందుకు
  rationale: ముందటి సంభాషణకు ప్రతిస్పందనగా యేసు మాటలను అనుసంధానిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండి, గ్రీకు సంధానార్థాన్ని నిలుపుతుంది.
- source_word: Ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: యోహాను సువార్తలోని గంభీరమైన ద్విగుణ ప్రకటన సూత్రాన్ని పునరుక్తితోనే నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: మీతో చెబుతున్నాను
  rationale: గ్రీకు ప్రయోగానికి దగ్గరగా ఉండి, తెలుగులో గంభీరమైన ప్రత్యక్ష ప్రకటనగా సహజంగా వినిపిస్తుంది.
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: మీకు ఇచ్చింది మోషే కాదు
  rationale: గ్రీకులో నిరాకరణ మోషేకు ముందు ఉండడం వల్ల దాత ఎవరు అనే వ్యత్యాసం ప్రధానంగా కనిపిస్తుంది; ఈ తెలుగు నిర్మాణం అదే ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి వచ్చిన రొట్టె
  rationale: ἄρτος యొక్క స్పష్టమైన రొట్టె రూపకాన్ని కాపాడుతూ, ἐκ τοῦ οὐρανοῦ అనే మూలార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: మీకు ఇస్తున్నది నా తండ్రి
  rationale: వర్తమానకాల δίδωσιν‌ను స్పష్టంగా నిలుపుతుంది; గతంలో మోషేతో ముడిపడిన ఇవ్వడానికీ, తండ్రి ఇప్పుడు ఇస్తున్న దానికీ ఉన్న వ్యత్యాసాన్ని చూపుతుంది.
- source_word: τὸν ἀληθινόν
  choice: నిజమైన
  rationale: ἀληθινός‌లోని నిజమైన, అసలైన, పరిపూర్ణ వాస్తవం అనే విస్తృత భావసాధ్యతను వ్యాఖ్యానాత్మకంగా కుదించకుండా నిలుపుతుంది.
theological_decisions:
- issue: మోషే ఇచ్చాడనే భావనకు మరియు తండ్రి ఇస్తున్నాడనే భావనకు మధ్య కాల–కర్త వ్యత్యాసం
  choice: “ఇచ్చింది మోషే కాదు … ఇస్తున్నది నా తండ్రి” అని అనువదించడం
  alternative: “మోషే ఇవ్వలేదు … నా తండ్రి ఇస్తాడు”
  rationale: గ్రీకు పరిపూర్ణకాల రూపమైన δέδωκεν మరియు వర్తమానకాల రూపమైన δίδωσιν మధ్య వ్యత్యాసాన్ని తెలుగులో సాధ్యమైనంత స్పష్టంగా ఉంచుతుంది; అదే సమయంలో ప్రధానంగా కర్తల మధ్య ఉన్న వ్యత్యాసాన్ని కూడా నిలుపుతుంది.
- issue: “నిజమైన రొట్టె” యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో “నిజమైన రొట్టె” అని ఉంచడం
  alternative: “అసలైన రొట్టె” లేదా “పరిపూర్ణమైన రొట్టె”
  rationale: యోహాను రచనలో ἀληθινός ముందున్న సూచనకు మించిన అసలు లేదా అంతిమ వాస్తవాన్ని సూచించగలదు. “నిజమైన” అనే పదం ఆ భావ ఉద్రిక్తతను తెరిచి ఉంచి, ఒకే వ్యాఖ్యానానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. “రొట్టె” అనే ప్రత్యక్ష రూపకాన్ని రెండుసార్లూ నిలిపి, “నిజంగా, నిజంగా” అనే ద్విగుణ సూత్రాన్ని కుదించలేదు. కర్తపై ఉన్న ఉద్ఘాటనను తెలుగు వాక్యక్రమం ద్వారా వ్యక్తం చేసింది.
