  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: te
  text: అయితే ఆయన అతన్ని పరీక్షించడానికి[a] ఇలా అన్నాడు; ఎందుకంటే తాను ఏమి చేయబోతున్నాడో ఆయనకే తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతన్ని పరిశీలించడానికి’; ఈ క్రియకు ‘శోధించడానికి’ అనే అర్థం కూడా ఉండవచ్చు, కాని ఇక్కడ పరీక్షించడం అనే భావమే సందర్భానికి సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ἔλεγεν
  choice: అయితే ఆయన ... ఇలా అడిగాడు
  rationale: τοῦτο ముందున్న యేసు ప్రశ్నను సూచిస్తుంది. తెలుగు కథనశైలిలో ‘ఇలా అడిగాడు’ అని చెప్పడం సందర్భానుసారంగా సహజం; δέ లోని స్వల్ప వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది.
- source_word: πειράζων αὐτόν
  choice: అతన్ని పరీక్షించడానికి
  rationale: ఇక్కడ πειράζω పాపానికి ప్రలోభపెట్టడం కాదు, ఫిలిప్పును పరీక్షించడం అనే అర్థంలో ఉంది. ఉద్దేశాన్ని తెలిపే కృదంత భావాన్ని ‘పరీక్షించడానికి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτὸς γὰρ ᾔδει
  choice: ఎందుకంటే ... ఆయనకే తెలుసు
  rationale: γάρ వివరణాత్మక కారణాన్ని సూచిస్తుంది. αὐτός లోని నొక్కిచెప్పే భావాన్ని ‘ఆయనకే’ నిలుపుతుంది; οἶδα యొక్క స్థితివాచక గతభావాన్ని సహజమైన తెలుగు ప్రయోగంలో ‘తెలుసు’గా అందిస్తుంది.
- source_word: τί ἔμελλεν ποιεῖν
  choice: తాను ఏమి చేయబోతున్నాడో
  rationale: μέλλω + infinitive సమీప భవిష్యత్తు లేదా ఉద్దేశిత చర్యను సూచిస్తుంది. ‘చేయబోతున్నాడో’ ఆ ముందుచూపు భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ఫిలిప్పు పట్ల యేసు చేసిన πειράζων చర్య అర్థం
  choice: పరీక్షించడానికి
  alternative: శోధించడానికి / ప్రలోభపెట్టడానికి
  rationale: సందర్భంలో యేసు ఫిలిప్పును చెడుకు ప్రేరేపించడం లేదు; అతని అవగాహన లేదా ప్రతిస్పందనను పరీక్షిస్తున్నాడు. అందువల్ల ‘పరీక్షించడానికి’ మూలపాఠ భావానికి సరిపోతుంది.
- issue: యేసుకు తన తదుపరి చర్య గురించి ఉన్న జ్ఞానంపై నొక్కి చెప్పడం
  choice: ఆయనకే తెలుసు
  alternative: ఆయనకు తెలుసు
  rationale: మూలంలోని స్పష్టమైన αὐτός సర్వనామం నొక్కిచెప్పే భావాన్ని కలిగి ఉంది. ‘ఆయనకే’ దానిని నిలుపుతుంది; అయితే పాఠానికి మించిన సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ముందున్నది ప్రశ్న కాబట్టి సాధారణ ‘చెప్పాడు’కు బదులు సందర్భస్పష్టత కోసం ‘అడిగాడు’ వాడబడింది. ‘ఆయనకే’ ద్వారా మూలంలోని emphatic αὐτός నిలుపబడింది.
