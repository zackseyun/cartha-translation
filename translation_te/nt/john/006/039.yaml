id: JHN.6.39
reference: John 6:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: te
  text: 'నన్ను పంపినవాని చిత్తం ఇదే: ఆయన నాకు ఇచ్చినదంతటిలో నేను దేనినీ కోల్పోకుండా[a], దానిని చివరి రోజున లేపాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, వ్యక్తులను మరింత ప్రత్యక్షంగా సూచిస్తూ: “ఆయన నాకు ఇచ్చిన వారిలో ఎవరినీ నేను కోల్పోకుండా, వారిని చివరి రోజున లేపాలి.” గ్రీకు పాఠంలో అక్షరార్థంగా “ఆయన నాకు ఇచ్చినదంతా … దానిని” అనే సమష్టి ఏకవచన ప్రయోగం ఉంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: చిత్తం
  rationale: దేవుని సంకల్పం లేదా ఉద్దేశాన్ని సూచించడానికి సహజమైన, గౌరవప్రదమైన తెలుగు పదం; కేవలం కోరికగా గానీ, తప్పనిసరి నిర్ణయంగా గానీ భావాన్ని పరిమితం చేయదు.
- source_word: τοῦ πέμψαντός με
  choice: నన్ను పంపినవాని
  rationale: కర్తృవాచక కృదంతంలోని సంబంధపూర్వక, క్రియాత్మక భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἵνα
  choice: —లాలి
  rationale: ఇక్కడ తండ్రి చిత్తంలోని విషయాన్ని, దానిలోని ఉద్దేశ భావంతో సహా, తెలుగు క్రియారూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: ఆయన నాకు ఇచ్చినదంతా
  rationale: గ్రీకులోని నపుంసక ఏకవచన సమష్టి నిర్మాణాన్ని వ్యక్తులుగా ముందే వివరణ చేయకుండా నిలుపుతుంది.
- source_word: δέδωκέν
  choice: ఇచ్చిన
  rationale: తెలుగులో సందర్భానుసారంగా పూర్తయి ఫలితం కొనసాగుతున్న క్రియను సహజంగా తెలియజేస్తుంది; ‘అప్పగించిన’ అని అదనపు భావం చేర్చదు.
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: దానిలో నేను దేనినీ పోగొట్టుకోకుండా
  rationale: ἀπόλλυμι ఇక్కడ ‘నాశనం చేయడం’ కంటే ‘పోగొట్టుకోవడం’ అనే భావంలో ఉంది; ἐξ αὐτοῦ సూచించే సమష్టిలోనుండి ఏదీ పోకూడదనే అర్థాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: ἀναστήσω αὐτὸ
  choice: దానిని లేపాలి
  rationale: అంత్యకాల పునరుత్థాన భావాన్ని ‘లేపాలి’ సహజంగా వ్యక్తం చేస్తుంది; αὐτό అనే నపుంసక ఏకవచనాన్ని ‘దానిని’గా నిలుపుతుంది.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: చివరి రోజున
  rationale: యోహాను సువార్తలోని అంత్యకాల సూచనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సమష్టి కర్మను వ్యక్తులుగా (‘ఎవరినీ’) అనువదించాలా, లేక గ్రీకు నపుంసక ఏకవచన రూపాన్ని నిలుపాలా?
  choice: ఆయన నాకు ఇచ్చినదంతటిలో ... దేనినీ ... దానిని
  alternative: ఆయన నాకు ఇచ్చిన వారిలో ఎవరినీ ... వారిని
  rationale: πᾶν, ὃ, αὐτό అన్నీ నపుంసక ఏకవచన రూపాలు. ప్రధాన పాఠంలో ఆ సమష్టి ఏకవచన నిర్మాణాన్ని నిలిపి, సందర్భంలో అది మనుషులను సూచించే అవకాశాన్ని పాదటిప్పణిలో తెలియజేయడం మూలపాఠంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన వాక్యనిర్మాణం. ‘చిత్తం,’ ‘లేపాలి’ వంటి బైబిలు సందర్భానికి సుపరిచితమైన పదాలను ఉపయోగిస్తూ, అతిగా ప్రాచీనమైన శైలిని నివారించింది.
