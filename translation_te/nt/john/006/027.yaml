revisions:
- from: నశించిపోయే ఆహారం కోసం శ్రమించకండి. నిత్యజీవానికి దారితీస్తూ నిలిచి ఉండే ఆహారం కోసం శ్రమించండి[a]. ఆ ఆహారాన్ని మనుష్యకుమారుడు మీకు ఇస్తాడు. ఎందుకంటే తండ్రియైన దేవుడు ఆయనపైనే తన ముద్ర వేశాడు[b].
  to: నశించిపోయే ఆహారం కోసం శ్రమించకండి. నిత్యజీవం కోసం నిలిచి ఉండే ఆహారం కోసం శ్రమించండి[a]. ఆ ఆహారాన్ని మనుష్యకుమారుడు మీకు ఇస్తాడు. ఎందుకంటే తండ్రియైన దేవుడు మనుష్యకుమారునిపై తన ముద్ర వేశాడు[b].
  rationale: అనువాదాన్ని మూల గ్రీకు వ్యతిరేక నిర్మాణం, εἰς యొక్క గమ్య/ఫలిత సంబంధం, మరియు σφραγίζω రూపకానికి మరింత దగ్గరగా చేశాం. ‘దారితీస్తూ’ మరియు ‘-నే’ ద్వారా చేరిన అదనపు భావాలను తొలగించాం. పాదసూచిక aలో కాలపరిమితిని సూచించగల ‘వరకు’ స్థానంలో గమ్యసంబంధ ప్రత్యామ్నాయాన్ని ఇచ్చాం.
