id: JHN.6.27
reference: John 6:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: te
  text: నశించిపోయే ఆహారం కోసం శ్రమించకండి. నిత్యజీవం కోసం నిలిచి ఉండే ఆహారం కోసం శ్రమించండి[a]. ఆ ఆహారాన్ని మనుష్యకుమారుడు మీకు ఇస్తాడు. ఎందుకంటే తండ్రియైన దేవుడు మనుష్యకుమారునిపై తన ముద్ర వేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిత్యజీవానికి నిలిచి ఉండే ఆహారం.’
    reason: εἰς ζωὴν αἰώνιον గమ్యం లేదా ఫలితంతో ఉన్న సంబంధాన్ని సూచిస్తుంది; ఇది పదక్రమానికి దగ్గరగా ఉండే ప్రత్యామ్నాయ అనువాదం.
  - marker: b
    text: మూలభాషలో ‘ముద్ర వేశాడు’; ఈ రూపకం ఆమోదించడం, అధికారమివ్వడం లేదా ప్రామాణికమని నిర్ధారించడం అనే భావాలను తెలియజేయగలదు.
    reason: ముద్ర రూపకంలోని అర్థవిస్తృతిని పాఠకునికి వివరిస్తుంది.
lexical_decisions:
- source_word: ἐργάζεσθε
  choice: శ్రమించండి
  rationale: రెండవ పురుష బహువచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘కోసం’తో కలిపి ‘దానికోసం పనిచేయండి/ప్రయత్నించండి’ అనే భావాన్ని ఇస్తుంది.
- source_word: βρῶσιν
  choice: ఆహారం
  rationale: ఈ సందర్భంలో తినే క్రియను కాక, తినబడే పదార్థాన్ని సూచిస్తుంది.
- source_word: ἀπολλυμένην
  choice: నశించిపోయే
  rationale: చెడిపోవడం మాత్రమే కాకుండా అంతరించిపోవడం, నిలవకపోవడం అనే విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: μένουσαν εἰς ζωὴν αἰώνιον
  choice: నిత్యజీవానికి దారితీస్తూ నిలిచి ఉండే
  rationale: μένωలోని నిలిచి ఉండే భావాన్నీ, εἰςలోని గమ్యం/ఫలితం భావాన్నీ సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: ఈ స్వీయబిరుదు యొక్క స్థిరమైన బైబిలు రూపాన్ని, దాని ధార్మిక ప్రతిధ్వనులను కాపాడుతుంది.
- source_word: ἐσφράγισεν
  choice: తన ముద్ర వేశాడు
  rationale: దేవుని ఆమోదం, అధికార నియామకం లేదా ప్రామాణీకరణను సూచించే ముద్ర రూపకాన్ని అనువాదంలో నిలుపుతుంది.
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: తండ్రియైన దేవుడు
  rationale: ‘తండ్రి’ని ‘దేవుడు’గా గుర్తించే గ్రీకు సమానాధికార నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: μένουσαν εἰς ζωὴν αἰώνιονలో εἰς సంబంధం
  choice: నిత్యజీవానికి దారితీస్తూ నిలిచి ఉండే
  alternative: నిత్యజీవం వరకు నిలిచి ఉండే
  rationale: εἰς గమ్యం లేదా ఫలితాన్ని సూచించగలదు. ప్రధాన పాఠం ఆ భావాన్ని స్పష్టంగా తెలుపుతుంది; కాలవ్యవధి భావాన్ని మాత్రమే బలపరచకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: ἐσφράγισεν రూపకం
  choice: తన ముద్ర వేశాడు
  alternative: ఆయనను ప్రామాణికుడిగా నిర్ధారించాడు
  rationale: మూలంలోని రూపకాన్ని అలాగే ఉంచడం ద్వారా దేవుని ఆమోదం/అధికార నియామకం అనే భావాన్ని ఒక్క వివరణకే పరిమితం చేయదు.
- issue: τοῦτον యొక్క సూచన మరియు బలం
  choice: ఆయనపైనే
  alternative: ఆయనపై
  rationale: సూచక సర్వనామం మనుష్యకుమారుని సూచిస్తుంది; ‘-నే’ దాని నిర్దిష్టమైన, కొంత ఉద్ఘాటనగల స్వభావాన్ని సహజంగా ప్రతిబింబిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవసూచక బహువచన ఆజ్ఞారూపాన్ని వాడాం. వాక్యం సులభంగా చదవడానికి గ్రీకు వాక్యాన్ని చిన్న వాక్యాలుగా విభజించాం; అయినా నిషేధం–వ్యతిరేక ఆజ్ఞ, సంబంధవాక్యం, కారణవాక్యం మధ్య తార్కిక సంబంధం కాపాడబడింది. ‘మనుష్యకుమారుడు,’ ‘నిత్యజీవం,’ ‘ముద్ర’ వంటి ముఖ్య బైబిలు పదచిత్రాలను నిలిపాం.
