    rationale: εἰς ζωὴν αἰώνιον ప్రధానంగా గమ్యం లేదా ఫలితాన్ని సూచిస్తుంది. ‘నిత్యజీవం వరకు’ కాలపరిమితి భావాన్ని కలిగించవచ్చు; అందువల్ల దాన్ని గమ్యసంబంధ ప్రత్యామ్నాయంతో మార్చాలి.
  revised_text: నశించిపోయే ఆహారం కోసం శ్రమించకండి. నిత్యజీవం కోసం నిలిచి ఉండే ఆహారం కోసం శ్రమించండి[a]. ఆ ఆహారాన్ని మనుష్యకుమారుడు మీకు ఇస్తాడు. ఎందుకంటే తండ్రియైన దేవుడు మనుష్యకుమారునిపై తన ముద్ర వేశాడు[b].
