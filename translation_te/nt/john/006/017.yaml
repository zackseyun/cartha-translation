review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the sequence of boarding the boat, travelling across the sea toward Capernaum, the onset of darkness, and Jesus' not yet having come to them. However, «కపెర్నహూము వైపు» can weaken εἰς ('to Capernaum') to a merely general direction, and «వెళ్తున్నారు» alongside the surrounding past-time narration is less precise for the Greek imperfect.
  naturalness: «పడవ ఎక్కి» and «అప్పటికే చీకటి పడింది» are natural modern standard Telugu. «వెళ్తూ ఉన్నారు» provides a more idiomatic past-continuing narrative sense and agrees smoothly with the following past-reference clauses.
  terminology: «సముద్రం», «పడవ», «కపెర్నహూము», and «యేసు» are appropriate. «వారి దగ్గరికి రాలేదు» accurately renders πρὸς αὐτούς without interpretive expansion.
  issues:
  - severity: low
    issue: The destination is rendered as «కపెర్నహూము వైపు».
    rationale: εἰς Καφαρναούμ identifies Capernaum as the destination, not simply the direction of travel. «కపెర్నహూముకు» retains the destination while the imperfect is conveyed by «వెళ్తూ ఉన్నారు».
  - severity: low
    issue: «వెళ్తున్నారు» may read as present-time narration amid completed past events.
    rationale: The imperfect ἤρχοντο denotes ongoing movement in the past narrative. «వెళ్తూ ఉన్నారు» is clearer and more natural in this context.
  revised_text: వారు ఒక పడవ ఎక్కి, సముద్రం దాటి కపెర్నహూముకు వెళ్తూ ఉన్నారు.[a] అప్పటికే చీకటి పడింది,[b] యేసు ఇంకా వారి దగ్గరికి రాలేదు.
