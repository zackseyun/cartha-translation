source:
  edition: SBLGNT
  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: te
  text: వారు ఒక పడవ ఎక్కి, సముద్రం దాటి కపెర్నహూముకు వెళ్తూ ఉన్నారు.[a] అప్పటికే చీకటి పడింది,[b] యేసు ఇంకా వారి దగ్గరికి రాలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సముద్రం అవతలి వైపున ఉన్న కపెర్నహూముకు వెళ్తూ ఉన్నారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అప్పటికే చీకటైంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: ఒక పడవ ఎక్కి
  rationale: ఆఒరిస్టు కృదంతం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది. ‘పడవ ఎక్కి’ సహజమైన తెలుగులో ఆ క్రమాన్ని నిలుపుతుంది; πλοῖον పరిమాణాన్ని పెద్దదిగా సూచించదు కాబట్టి ‘పడవ’ అని అనువదించబడింది.
- source_word: ἤρχοντο
  choice: వెళ్తున్నారు
  rationale: ఇంపర్ఫెక్టు రూపం కొనసాగుతున్న ప్రయాణాన్ని తెలియజేస్తుంది. ‘వెళ్తున్నారు’ వారు అప్పటికి ప్రయాణంలో ఉన్నారనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πέραν τῆς θαλάσσης
  choice: సముద్రం దాటి
  rationale: πέραν + షష్ఠీ విభక్తి సముద్రాన్ని దాటి అవతలి వైపుకు కదలడాన్ని సూచిస్తుంది. యోహాను వాడిన θάλασσα పదాన్ని అనుసరించి ‘సముద్రం’ నిలుపబడింది.
- source_word: εἰς Καφαρναούμ
  choice: కపెర్నహూము వైపు
  rationale: εἰς గమ్యదిశను సూచిస్తుంది. ప్రయాణం ఇంకా కొనసాగుతున్నందున ‘వైపు’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది; స్థలనామం తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో లిప్యంతరీకరించబడింది.
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: అప్పటికే చీకటి పడింది
  rationale: ప్లూపర్ఫెక్టు రూపం ముందే సంభవించి కొనసాగుతున్న స్థితిని సూచిస్తుంది. ‘అప్పటికే చీకటి పడింది’ మార్పునూ దాని ఫలిత స్థితినీ సహజమైన తెలుగులో అందిస్తుంది.
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  choice: ఇంకా వారి దగ్గరికి రాలేదు
  rationale: οὔπωతో కూడిన ప్లూపర్ఫెక్టు, ఆ సమయానికి యేసు వారి వద్దకు చేరుకోలేదని సూచిస్తుంది. ‘వారి దగ్గరికి’ πρὸς αὐτούςను నేరుగా, అతివ్యాఖ్యానం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: వ్యక్తినామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: కథన కాలక్రమం మరియు క్రియాంశం
  choice: పడవ ఎక్కడం ముందుగా జరిగి, కపెర్నహూము వైపు ప్రయాణం కొనసాగుతుండగా అప్పటికే చీకటి పడిందనీ, యేసు ఇంకా వారి వద్దకు రాలేదనీ చూపేలా అనువదించబడింది.
  alternative: ἤρχοντοను పూర్తయిన సాధారణ భూతక్రియగా ‘వెళ్లారు’ అనడం; ἐγεγόνειను కేవలం స్థితిగా ‘చీకటిగా ఉంది’ అనడం.
  rationale: గ్రీకు క్రియారూపాల కాలక్రమాన్నీ కొనసాగుతున్న చర్యనూ నిలపడం తరువాతి వచనాలకు దారితీసే కథన ఉత్కంఠను కాపాడుతుంది; పాఠ్యంలో లేని సిద్ధాంతార్థం ఏదీ చేర్చబడలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని కొనసాగుతున్న ప్రయాణం, ముందే ఏర్పడిన చీకటి, యేసు ఇంకా చేరకపోవడం అనే కాల సంబంధాలు స్పష్టంగా నిలుపబడ్డాయి.
