revisions:
- from: వారు ఒక పడవ ఎక్కి, సముద్రం దాటి కపెర్నహూము వైపు వెళ్తున్నారు.[a] అప్పటికే చీకటి పడింది,[b] యేసు ఇంకా వారి దగ్గరికి రాలేదు.
  to: వారు ఒక పడవ ఎక్కి, సముద్రం దాటి కపెర్నహూముకు వెళ్తూ ఉన్నారు.[a] అప్పటికే చీకటి పడింది,[b] యేసు ఇంకా వారి దగ్గరికి రాలేదు.
