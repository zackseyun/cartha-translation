  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: te
  text: '“మన పితరులు అరణ్యంలో మన్నాను తిన్నారు[a][b], లేఖనంలో రాయబడి ఉన్నట్లుగా: ‘ఆయన వారికి తినడానికి పరలోకం నుండి రొట్టె ఇచ్చాడు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన పూర్వీకులు.” గ్రీకులో అక్షరార్థంగా “మన పితరులు” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “అరణ్యంలో” అనే మాటను “ఎడారిలో” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: మన పితరులు
  rationale: πατέρες అనే గ్రీకు పదంలోని ‘తండ్రులు/పితరులు’ అనే పురుషలింగ రూపాన్ని, ఇశ్రాయేలు పూర్వతరాల భావాన్ని నిలుపుతుంది. ఆధునిక తెలుగు బైబిలు సందర్భంలో ‘పితరులు’ సహజంగా అర్థమవుతుంది; ‘పూర్వీకులు’ సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: τὸ μάννα
  choice: మన్నాను
  rationale: అరణ్య ప్రయాణంలో దేవుడు అనుగ్రహించిన ప్రత్యేక ఆహారానికి స్థిరపడిన బైబిలు పదరూపం.
- source_word: ἔφαγον
  choice: తిన్నారు
  rationale: ἐσθίω యొక్క ఏఓరిస్ట్ సూచనార్థక రూపానికి సహజమైన, నేరమైన తెలుగు భూతకాల అనువాదం.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: నిర్గమకాండ నేపథ్యంలోని ἔρημοςకు ‘అరణ్యం’ సహజమైన, అంతర్గ్రంథ ప్రతిధ్వనిని నిలిపే ఎంపిక; ‘ఎడారిలో’ కూడా సాధ్యం.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: అని రాయబడి ఉన్నట్లే
  rationale: లేఖన ఉదాహరణను పరిచయం చేసే సూత్రాన్ని, γεγραμμένον యొక్క ఇప్పటికీ రాసి ఉన్న సాక్ష్య భావాన్ని తెలుగులో నిలుపుతుంది.
- source_word: Ἄρτον
  choice: ఆహారం
  rationale: ἄρτος సాధారణంగా ‘రొట్టె’ అయినా, ఇక్కడ మన్నా అనే దేవుని ఆహార ఏర్పాటును సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘ఆహారం’ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది; ‘రొట్టె’ మరింత రూపపరమైన ప్రత్యామ్నాయం.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: దైవిక మూలాన్ని సూచించే బైబిలు నుడికారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: వారు తినడానికి ... ఆయన వారికి ఇచ్చాడు
  rationale: δίδωμι + దత్తివు + క్రియానామక నిర్మాణాన్ని తెలుగులో సహజమైన ఉద్దేశార్థక నిర్మాణంతో దగ్గరగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: మన్నా గురించిన ఉద్ధరణలో తరువాతి యోహాను క్రీస్తుశాస్త్ర భావాన్ని ముందుగానే చొప్పించకుండా ఉండటం
  choice: జనసమూహం చేసిన చారిత్రక-లేఖన వాదనగానే అనువదించి, దేవుడు పరలోకం నుండి ఆహారం ఇచ్చాడనే మాటను విస్తరించకుండా ఉంచడం
  alternative: యేసే నిజమైన జీవాహారమని ముందుగానే సూచించే ప్రత్యేక పెద్ద అక్షరాలు లేదా వివరణాత్మక పదాలు జోడించడం
  rationale: ఈ సందర్భంలో వారు అరణ్యంలోని మన్నా గురించి లేఖనాన్ని ఉటంకిస్తున్నారు. తరువాతి సంభాషణలో బయలుపడే క్రీస్తుశాస్త్ర భావాన్ని ఈ వాక్యంలో ముందుగానే ప్రవేశపెట్టకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. లేఖన ఉద్ధరణను తెలుగు ఉద్ధరణ చిహ్నాలతో వేరు చేశాం. మూలంలోని పితరులు/పూర్వీకులు మరియు అరణ్యం/ఎడారి ప్రత్యామ్నాయాలను పాదటిప్పణుల్లో నిలిపాం.
