id: JHN.6.38
reference: John 6:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: te
  text: ఎందుకంటే నేను పరలోకం నుండి దిగివచ్చాను; నా సొంత చిత్తాన్ని చేయడానికి కాదు, నన్ను పంపినవాని చిత్తాన్ని చేయడానికే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: καταβέβηκα
  choice: దిగివచ్చాను
  rationale: పూర్తయిన కార్యానికి ప్రస్తుత ప్రాసంగికత ఉన్న గ్రీకు పరిపూర్ణ కాల భావాన్ని తెలుగు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: స్థానసంబంధమైన మూలాన్ని నేరుగా తెలియజేస్తూ యోహాను సువార్తలోని పరలోక మూల భావాన్ని నిలుపుతుంది.
- source_word: οὐχ ἵνα ποιῶ
  choice: చేయడానికి కాదు
  rationale: గ్రీకులోని ప్రతికూల ఉద్దేశార్థక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: నా సొంత చిత్తాన్ని
  rationale: ἐμὸν లోని ఉద్ఘాటనను ‘సొంత’ ద్వారా చూపించి, తరువాతి చిత్తంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἀλλὰ
  choice: కాదు … చేయడానికే
  rationale: తెలుగులో సహజమైన ‘కాదు—దానికే’ నిర్మాణం ద్వారా బలమైన వ్యతిరేకతను వ్యక్తం చేస్తుంది.
- source_word: τὸ θέλημα τοῦ πέμψαντός με
  choice: నన్ను పంపినవాని చిత్తాన్ని
  rationale: కర్తను గ్రీకు వచనం పేర్కొన్న పరిమితిలోనే ఉంచి, సంబంధార్థాన్ని సంక్షిప్తంగా మరియు గౌరవప్రదంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు పరలోకం నుండి దిగివచ్చాడనే ప్రకటన
  choice: ‘పరలోకం నుండి దిగివచ్చాను’ అని నేరుగా అనువదించడం
  alternative: కేవలం దేవునిచే నియమించబడి వచ్చాననే రూపకార్థంగా మార్చడం
  rationale: మూలవాక్యం పరలోక మూలాన్ని స్థానసంబంధ భాషలో ప్రకటిస్తుంది; దానిని కేవలం దైవిక నియామకంగా బలహీనపరచకుండా అదే భావాన్ని నిలుపుతుంది.
- issue: యేసు చిత్తం మరియు ఆయనను పంపినవాని చిత్తం మధ్య వ్యత్యాసం
  choice: రెండుచోట్లా ‘చిత్తం’ వాడి వ్యత్యాసాన్ని యథాతథంగా ఉంచడం
  alternative: ‘నాకు కావలసింది / ఆయనకు కావలసింది’ అని సడలించి అనువదించడం
  rationale: θέλημα పద పునరావృతిని, వాక్య సమాంతరతను, మిషన్ మరియు విధేయతకు సంబంధించిన నిజమైన ఉద్రిక్తతను వివరణతో తొలగించకుండా కాపాడుతుంది.
- issue: ‘నన్ను పంపినవాడు’ ఎవరో వాక్యంలో పేర్కొనడం
  choice: మూలంలోని ‘నన్ను పంపినవాని’ అనే వ్యక్తీకరణనే ఉంచడం
  alternative: ‘తండ్రి చిత్తం’ అని స్పష్టీకరించడం
  rationale: సందర్భంలో తండ్రి ఉద్దేశింపబడినప్పటికీ, ఈ వాక్యంలో లేని నామాన్ని అనువాదంలో చేర్చకుండా మూల రూపాన్ని గౌరవిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యక్రమం, అయితే ‘చిత్తం’ అనే గౌరవప్రదమైన బైబిలు-సంబంధ పదాన్ని మరియు మూలంలోని సమాంతర వ్యత్యాసాన్ని నిలుపుకుంది. పాదటిప్పణులు అవసరం లేదు.
