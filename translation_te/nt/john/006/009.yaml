translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా వచనానికి తగిన గౌరవప్రదమైన శైలి. గ్రీకు సంబంధవాక్యాన్ని సహజ తెలుగు కోసం రెండు వాక్యాలుగా విభజించాం. మూలంలో స్పష్టంగా లేని చేపల పరిమాణాన్ని చేర్చలేదు.
