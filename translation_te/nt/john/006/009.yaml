  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔστιν ⸀παιδάριον ὧδε ⸀ὃς ἔχει πέντε ἄρτους κριθίνους καὶ δύο ὀψάρια· ἀλλὰ ταῦτα τί ἐστιν εἰς τοσούτους;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: te
  text: “ఇక్కడ ఒక బాలుడు ఉన్నాడు. అతని దగ్గర ఐదు యవ రొట్టెలు, రెండు చేపలు ఉన్నాయి. కానీ ఇవి ఇంతమందికి ఎంత?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδάριον
  choice: బాలుడు
  rationale: ఈ పదం చిన్నవయస్కుడైన మగపిల్లవాణ్ణి సూచిస్తుంది. ‘బాలుడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది; వయస్సును అనవసరంగా మరింత నిర్దిష్టం చేయదు.
- source_word: ὧδε
  choice: ఇక్కడ
  rationale: స్థలాన్ని సూచించే ఈ క్రియావిశేషణానికి ‘ఇక్కడ’ నేరమైన, సహజమైన అనువాదం.
- source_word: ὃς ἔχει
  choice: అతని దగ్గర … ఉన్నాయి
  rationale: ఆ బాలుని వద్ద ఆహారం ఉందనే స్వాధీన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. గ్రీకు సంబంధవాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించడం పఠన సౌలభ్యాన్ని పెంచుతుంది.
- source_word: ἄρτους κριθίνους
  choice: యవ రొట్టెలు
  rationale: ἄρτους రొట్టెలను, κριθίνους అవి యవలతో చేసినవని సూచిస్తుంది. ‘యవ రొట్టెలు’ సంక్షిప్తమైన, మూలార్థానికి నమ్మకమైన పదబంధం.
- source_word: ὀψάρια
  choice: చేపలు
  rationale: ఈ సందర్భంలో రొట్టెతో తినే చేపలను సూచిస్తుంది. ‘చేపలు’ స్పష్టంగా ఉంది; అవి చిన్నవని మూలపదం తప్పనిసరిగా నిర్ధారించనందున ‘చిన్న చేపలు’ అని చేర్చలేదు.
- source_word: ἀλλὰ
  choice: కానీ
  rationale: అందుబాటులో ఉన్న ఆహారానికీ జనసమూహం పరిమాణానికీ మధ్య వ్యత్యాసాన్ని నేరుగా చూపిస్తుంది.
- source_word: ταῦτα τί ἐστιν εἰς τοσούτους
  choice: ఇంతమందికి ఇవి ఏమాత్రం సరిపోతాయి?
  rationale: గ్రీకు ప్రశ్న పదశః ‘ఇంతమందికి ఇవి ఏమిటి?’ అయినా, సందర్భంలో ఆహారం చాలదనే అంచనాను వ్యక్తం చేస్తుంది. ‘ఏమాత్రం సరిపోతాయి?’ తెలుగు భాషలో ఆ అలంకారిక ప్రశ్న బలాన్ని సహజంగా అందిస్తుంది.
