id: JHN.6.14
reference: John 6:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ οὖν ἄνθρωποι ἰδόντες ⸂ὃ ἐποίησεν σημεῖον⸃ ⸀ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: te
  text: కాబట్టి, ఆ ప్రజలు ఆయన చేసిన సూచకకార్యాన్ని[a] చూసి, “నిజంగా, లోకంలోకి వస్తున్న ఆ ప్రవక్త[b] ఈయనే” అని చెబుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన చేసిన అద్భుతాన్ని.” యోహాను సాధారణంగా యేసు కార్యాల అద్భుత స్వభావాన్ని మాత్రమే కాక, అవి వెల్లడించే అర్థాన్ని నొక్కిచెప్పడానికి “సూచకకార్యం” (σημεῖον) అనే పదాన్ని ఉపయోగిస్తాడు.
    reason: lexical_alternative
  - marker: b
    text: “ఆ ప్రవక్త” అనేది మోషే వంటి ప్రవక్త వస్తాడనే నిరీక్షణను సూచించే అవకాశం ఉంది (ద్వితీయోపదేశకాండము 18:15–18).
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: కాబట్టి ఆ ప్రజలు
  rationale: ἄνθρωποι ఇక్కడ పురుషులను మాత్రమే కాక సమూహంలోని ప్రజలను సూచిస్తుంది; οὖν కథనంలోని పర్యవసానాన్ని ‘కాబట్టి’ ద్వారా తెలియజేస్తుంది.
- source_word: ἰδόντες
  choice: చూసి
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందున్న చర్యను సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: ὃ ἐποίησεν σημεῖον
  choice: ఆయన చేసిన సూచకకార్యాన్ని
  rationale: σημεῖον కేవలం అద్భుతాన్ని కాక, యేసు కార్యం వెల్లడించే అర్థాన్ని కూడా సూచిస్తుంది; ‘సూచకకార్యం’ ఆ యోహాను ప్రత్యేక భావాన్ని నిలుపుతుంది.
- source_word: ἔλεγον
  choice: చెప్పుకుంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా సమూహంలో వ్యాపించిన మాటను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కాలాంశాన్ని నిలుపుతుంది.
- source_word: ἀληθῶς
  choice: నిజంగా
  rationale: గుర్తింపు నిజమైనదని నొక్కిచెప్పే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ὁ προφήτης
  choice: ఆ ప్రవక్త
  rationale: నిర్దిష్ట ఉపపదం ఎదురు చూస్తున్న ప్రత్యేక ప్రవక్తను సూచిస్తుంది; తెలుగు లిపిలో పెద్ద అక్షర భేదం లేనందున ‘ఆ’ నిర్దిష్టతను తెలియజేస్తుంది.
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: లోకంలోకి రాబోతున్న
  rationale: ఆర్టిక్యులర్ వర్తమాన కృదంతంలోని ఎదురు చూపు భావాన్ని సహజంగా నిలుపుతూ, కాలార్థాన్ని అతిగా నిర్ధారించదు.
theological_decisions:
- issue: ‘ఆ ప్రవక్త’ ఎవరు?
  choice: మూలపాఠంలో ఉన్నట్లే ‘ఆ ప్రవక్త’ అని అనువదించి, ప్రధాన వాక్యంలో ఆయనను మరింత స్పష్టంగా గుర్తించలేదు.
  alternative: ‘మోషే వంటి ప్రవక్త’ లేదా ‘ఒక ప్రవక్త’
  rationale: ఈ మాట ద్వితీయోపదేశకాండము 18:15–18లోని నిరీక్షణను సూచించే అవకాశం ఉన్నప్పటికీ, గ్రీకు పాఠం కేవలం నిర్దిష్టమైన ‘ప్రవక్త’ అని మాత్రమే చెబుతుంది. అందువల్ల వ్యాఖ్యానాన్ని వాక్యంలో చేర్చకుండా భావ ఉద్రిక్తతను నిలిపాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘సూచకకార్యం’ యోహాను వాడుకలోని ప్రకటనాత్మక భావాన్ని కాపాడుతుంది; ‘చెప్పుకుంటూ ఉన్నారు’ అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్ని సహజంగా ప్రతిబింబిస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
