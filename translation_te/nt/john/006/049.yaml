  text: οἱ πατέρες ὑμῶν ἔφαγον ⸂ἐν τῇ ἐρήμῳ τὸ μάννα⸃ καὶ ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/049.yaml
  text: Your fathers ate the manna in the wilderness[a], and they died.
translation:
  language: te
  text: మీ పితరులు అరణ్యంలో మన్నాను తిన్నారు; వారు చనిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ పూర్వీకులు.” గ్రీకులో అక్షరార్థంగా “మీ పితరులు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: మీ పితరులు
  rationale: πατέρες అనే పదానికి ‘పితరులు’ నేరమైన సమానార్థకం. ఇక్కడ అది అరణ్యకాలంలోని ఇశ్రాయేలు పూర్వీకులను సూచిస్తుంది; తెలుగు బైబిలు సందర్భంలో ఈ సామూహిక పూర్వీకుల భావం సహజంగా వినిపిస్తుంది.
- source_word: ἔφαγον
  choice: తిన్నారు
  rationale: ἐσθίω క్రియ యొక్క ఏఒరిస్టు రూపం; గతంలో జరిగిన తినడాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: నిర్గమకాండ నేపథ్యంలోని ἔρημοςకు ‘అరణ్యం’ సుపరిచితమైన, సహజమైన తెలుగు పదం; ‘ఎడారి’ కంటే విస్తృతమైన బైబిలు అనుసంధానాన్ని నిలుపుతుంది.
- source_word: τὸ μάννα
  choice: మన్నాను
  rationale: గ్రీకు నిర్దేశక ఉపపదం తెలిసిన నిర్గమకాల ఆహారాన్ని సూచిస్తుంది. తెలుగులో ‘మన్నాను’ అనే కర్మరూపం ఆ నిర్దిష్ట సూచనను సందర్భం ద్వారా సహజంగా తెలియజేస్తుంది.
- source_word: καὶ ἀπέθανον
  choice: అయినా వారు చనిపోయారు
  rationale: 'καί ఇక్కడ ముందటి వాక్యంతో ఫలితాత్మక వ్యత్యాసాన్ని కలుపుతుంది: మన్నా తిన్నప్పటికీ వారు మరణించారు. ‘అయినా’ సందర్భంలోని వ్యత్యాసాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది; ‘వారు’ అనే కర్త స్పష్టతనిస్తుంది.'
theological_decisions:
- issue: ఇశ్రాయేలు అరణ్యకాల తరానికి సూచన
  choice: మీ పితరులు
  alternative: మీ పూర్వీకులు
  rationale: ‘పితరులు’ గ్రీకు పదరూపాన్నీ, యేసు శ్రోతలతో వారి ఇశ్రాయేలీయ పూర్వీకుల మధ్య ఉన్న వాక్చాతుర్య సంబంధాన్నీ కాపాడుతుంది. ‘పూర్వీకులు’ భావపరంగా సాధ్యమైనందున పాదసూచికలో ఇవ్వబడింది.
- issue: మన్నా తిన్నప్పటికీ మరణించిన వ్యత్యాసం
  choice: అయినా వారు చనిపోయారు
  alternative: మరియు వారు చనిపోయారు
  rationale: καί సాధారణంగా ‘మరియు’ అయినా, యోహాను 6లో నశించే మన్నాకు జీవమిచ్చే పరలోక ఆహారానికి మధ్య ఉన్న వ్యత్యాసం ఇక్కడ సూటిగా పనిచేస్తుంది. ‘అయినా’ ఆ సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; మరణాన్ని ఆధ్యాత్మికీకరించకుండా నిజమైన మరణంగానే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘పితరులు,’ ‘అరణ్యం,’ ‘మన్నా’ వంటి బైబిలు సందర్భానికి సుపరిచితమైన పదాలను నిలిపి, వాక్య నిర్మాణాన్ని సహజంగా ఉంచింది.
