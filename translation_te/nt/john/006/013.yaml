source:
  edition: SBLGNT
  text: συνήγαγον οὖν, καὶ ἐγέμισαν δώδεκα κοφίνους κλασμάτων ἐκ τῶν πέντε ἄρτων τῶν κριθίνων ἃ ⸀ἐπερίσσευσαν τοῖς βεβρωκόσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/013.yaml
  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
translation:
  language: te
  text: కాబట్టి వారు వాటిని ఏరుకొని, తిన్నవారు తిన్న తరువాత మిగిలిన అయిదు యవ రొట్టెల ముక్కలతో[a] పన్నెండు బుట్టలను నింపారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ముక్కలు’కు బదులుగా ‘తునకలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా, ‘తిన్నవారికి సమృద్ధిగా మిగిలినవి.’ భావం: వారు తిన్న తరువాత మిగిలిపోయిన రొట్టె ముక్కలు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγον οὖν
  choice: అందుచేత వారు వాటిని పోగుచేసి
  rationale: οὖν ముందటి ఆజ్ఞకు అనుగుణంగా జరిగిన పరిణామాన్ని సూచిస్తుంది; ‘అందుచేత’ దాని అనుమానాతీత నిర్ధారణ/పరిణామ భావాన్ని నిలుపుతుంది. సందర్భం వల్ల అర్థమయ్యే ముక్కలను ‘వాటిని’ అని తెలుగులో సహజంగా వ్యక్తం చేశాం.
- source_word: ἐγέμισαν δώδεκα κοφίνους
  choice: పన్నెండు గంపలు నింపారు
  rationale: క్రియను, సంఖ్యను స్పష్టంగా నిలుపుతూ κοφίνουςకు సాధారణంగా అర్థమయ్యే ‘గంపలు’ వాడాం; మూలపదం నిర్దిష్ట పరిమాణాన్ని చెప్పదు.
- source_word: κλασμάτων
  choice: ముక్కలతో
  rationale: విరిచిన రొట్టెల నుంచి మిగిలిన భాగాలను సూచించే సహజమైన ఆధునిక తెలుగు పదం; ‘తునకలు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: ఆ అయిదు యవ రొట్టెల ముక్కలతో
  rationale: ἐκ ద్వారా ముక్కలు ఆ అయిదు యవ రొట్టెల నుంచే వచ్చినవని తెలిపే సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేశాం. κριθίνωνను ‘యవ’గా, ἄρτωνను ‘రొట్టెలు’గా అనువదించాం.
- source_word: ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν
  choice: తిన్నవారికి మిగిలిన
  rationale: గ్రీకులోని దాతివ్ సంబంధాన్ని ‘తిన్నవారికి’గా ఉంచి, ἐπερίσσευσανలోని మిగులు/అధికంగా ఉండటం అనే భావాన్ని ‘మిగిలిన’గా సహజంగా తెలిపాం; ‘తిన్నవారు వదిలిన’ అని కారణాన్ని అతిగా నిర్దిష్టం చేయలేదు.
theological_decisions:
- issue: మిగిలిన ముక్కలకు తిన్నవారితో ఉన్న సంబంధం
  choice: తిన్నవారికి మిగిలిన
  alternative: తిన్నవారు తిన్న తరువాత మిగిలిన
  rationale: τοῖς βεβρωκόσιν వ్యాకరణపరంగా ‘తిన్నవారికి’ అని ఉంది. కాలసంబంధ అర్థం సందర్భంలో సాధ్యమైనప్పటికీ, ప్రధాన పాఠ్యంలో దాతివ్ నిర్మాణాన్ని నిలిపి మూలంలోని స్వల్ప అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద కథనశైలి. ‘యవ రొట్టెలు’ మూలంలోని ధాన్యవిశేషాన్ని ఖచ్చితంగా నిలుపుతుంది; ‘గంపలు’ సహజమైన సాధారణ పదం.
