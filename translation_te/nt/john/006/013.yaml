- from: అందుచేత వారు వాటిని పోగుచేసి, తిన్నవారికి మిగిలిన ఆ అయిదు యవ రొట్టెల ముక్కలతో[a] పన్నెండు గంపలు నింపారు.[b]
  to: కాబట్టి వారు వాటిని ఏరుకొని, తిన్నవారు తిన్న తరువాత మిగిలిన అయిదు యవ రొట్టెల ముక్కలతో[a] పన్నెండు బుట్టలను నింపారు.[b]
  rationale: The revision improves modern Telugu idiom and removes an unintended implication that the fragments were left for the eaters. It preserves the source meaning that the twelve baskets were filled with fragments from the five barley loaves remaining after the meal. The note preserves the literal Greek-oriented wording and explains the contextual sense.
