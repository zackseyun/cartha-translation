id: JHN.6.36
reference: John 6:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ με καὶ οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: te
  text: కానీ మీరు నన్ను చూసి కూడా[a] నమ్మడం లేదని నేను మీతో చెప్పాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపానుసారంగా: “మీరు నన్ను నిజంగానే చూశారు, అయినా నమ్మడం లేదని.”'
    reason: మొదటి καίకు సాధ్యమైన ఉద్ఘాటనాత్మక అర్థాన్ని, రెండు ఉపవాక్యాల సమన్వయాన్ని మరింత స్పష్టంగా చూపే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἀλλ’
  choice: కానీ
  rationale: ముందటి మాటతో ఉన్న వ్యత్యాసాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: εἶπον ὑμῖν
  choice: నేను మీతో చెప్పాను
  rationale: గతంలో శ్రోతలకు చెప్పిన మాటను సూచిస్తుంది; తెలుగులో ఇది సహజమైన ప్రత్యక్ష సంబోధన.
- source_word: ὅτι
  choice: అని
  rationale: యేసు చెప్పిన మాటలోని విషయాన్ని పరిచయం చేసే తెలుగు పూరకరూపం.
- source_word: καὶ ἑωράκατέ με
  choice: మీరు నన్ను చూసి కూడా
  rationale: మొదటి καί యొక్క ఉద్ఘాటనాత్మక లేదా సందర్భానుసారంగా concessive బలాన్ని సహజ తెలుగులో చూపుతుంది; వారు చూసినప్పటికీ నమ్మకపోవడంలోని ఆశ్చర్యకరమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: καὶ οὐ πιστεύετε
  choice: నమ్మడం లేదు
  rationale: రెండవ καί సూచించే సమన్వయం/వ్యత్యాసం తెలుగులో ‘చూసి కూడా’ నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది; వర్తమానకాలంలోని కొనసాగుతున్న అవిశ్వాసాన్ని ‘నమ్మడం లేదు’ తెలియజేస్తుంది.
theological_decisions:
- issue: καὶ ἑωράκατέ με లోని మొదటి καί యొక్క భావం
  choice: ‘చూసి కూడా’ అని వ్యత్యాసభావంతో అనువదించడం
  alternative: ‘నిజంగానే చూశారు, అయినా’ లేదా ‘కూడా చూశారు, మరియు’
  rationale: ఇక్కడ καίను కేవలం ‘మరియు/కూడా’గా యాంత్రికంగా అనువదించడం కంటే, చూసినప్పటికీ నమ్మని పరిస్థితిలోని వాక్యప్రయోగ బలాన్ని ‘చూసి కూడా’ సహజంగా తెలియజేస్తుంది. అయితే మూలంలోని ‘నిజంగా/కూడా’ భావసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- issue: πιστεύετε అనువాదం
  choice: నమ్మడం లేదు
  alternative: విశ్వసించడం లేదు; నమ్మకం ఉంచడం లేదు
  rationale: యోహాను రచనలో πιστεύωకు ‘నమ్ము’ నేరమైన, సాధారణంగా అర్థమయ్యే క్రియారూపం; ఇది కేవలం మేధోసమ్మతం లేదా ప్రత్యేక మతపరమైన నిర్వచనాన్ని బలవంతంగా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘చూసి కూడా’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి గ్రీకు వాక్యంలోని వ్యత్యాసాన్ని సంక్షిప్తంగా అందిస్తుంది; పాదటిప్పణి మరింత రూపానుసారమైన ప్రత్యామ్నాయాన్ని సంరక్షిస్తుంది.
