source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: te
  text: స్వర్గం నుండి దిగివచ్చిన రొట్టె ఇదే—పితరులు[a] తిని చనిపోయిన దానిలా కాదు; ఈ రొట్టెను తినేవాడు శాశ్వతంగా జీవిస్తాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పూర్వీకులు.’ గ్రీకులో అక్షరార్థంగా ‘తండ్రులు’; ఇది అరణ్యంలో మన్నా తిన్న ఇశ్రాయేలు పూర్వపితరులను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘యుగంలోనికి జీవిస్తాడు’; ఇది అంతం లేని, నిరంతర జీవితాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: ఆహారం ఇదే
  rationale: గ్రీకు నిర్దేశక-కర్తృవాచక నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో వ్యక్తం చేస్తుంది. ఈ సందర్భంలో ἄρτος కేవలం ఒక రొట్టెను కాక జీవాన్నిచ్చే ఆహారాన్ని సూచిస్తున్నందున ‘ఆహారం’ సహజంగా, విస్తృతంగా సరిపోతుంది.
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: పరలోకం నుండి దిగివచ్చిన
  rationale: ἐξ యొక్క ‘నుండి’ భావాన్ని, καταβάς యొక్క పూర్తయిన దిగివచ్చే చర్యను విశేషణ ఉపవాక్య రూపంలో నిలుపుతుంది.
- source_word: οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: పితరులు తిని చనిపోయినట్లుగా కాదు
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తమైన పోలికను అనవసర వివరణ లేకుండా తెలుగులో నిలుపుతుంది; రెండు ఏఒరిస్ట్ క్రియలను సహజమైన భూతకాల భావంతో అందిస్తుంది.
- source_word: οἱ πατέρες
  choice: పితరులు
  rationale: గ్రీకులోని పుంలింగ బహువచనాన్ని, ఇశ్రాయేలు పూర్వపితరుల సూచనను నిలుపుతుంది; మరింత సాధారణమైన ‘పూర్వీకులు’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ὁ τρώγων τοῦτον τὸν ἄρτον
  choice: ఈ ఆహారం తినేవాడు
  rationale: వర్తమాన కృదంతంలోని సాధారణ/కొనసాగే భావాన్ని సహజమైన తెలుగు సంబంధార్థక రూపంతో వ్యక్తం చేస్తుంది. ‘తినేవాడు’ అనే తటస్థ పదం వివాదాస్పదమైన సంస్కారపరమైన లేదా కేవలం రూపకాలంకారమైన అర్థాన్ని ముందుగానే నిర్ణయించదు.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: శాశ్వతంగా జీవిస్తాడు
  rationale: యోహాను రచనలోని ఈ కాలవ్యాప్తి నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో భద్రపరుస్తుంది.
theological_decisions:
- issue: అరణ్యంలోని ఆహారంతో సంబంధించి οἱ πατέρες ఎవరిని సూచిస్తుంది
  choice: పితరులు
  alternative: పూర్వీకులు
  rationale: మూలంలోని పుంలింగ బహువచనాన్ని, ఇశ్రాయేలు పూర్వపితరుల ప్రతిధ్వనిని నిలుపుతూ, విస్తృత సమూహార్థక ప్రత్యామ్నాయాన్ని పాదసూచికలో సూచిస్తుంది.
- issue: జీవాహార ప్రసంగంలో τρώγων యొక్క భావం
  choice: తినేవాడు
  alternative: దీనిని ఆహారంగా స్వీకరించేవాడు / ఇందులో పాలుపంచుకునేవాడు
  rationale: ‘తినడం’ అనే మూల క్రియను నేరుగా ఉంచి, ప్రభుభోజన సంబంధమైన అర్థమా లేక విశ్వాసాన్ని సూచించే రూపకమా అనే వేదాంత వివాదాన్ని అనువాదంలో పరిష్కరించకుండా ఉంచుతుంది.
- issue: ζήσει εἰς τὸν αἰῶνα సూచించే జీవితం
  choice: శాశ్వతంగా జీవిస్తాడు
  alternative: యుగంలోనికి జీవిస్తాడు
  rationale: ఇది సహజమైన తెలుగు నుడికారం; అయినా గ్రీకు పదబంధంలోని అక్షరార్థ కాలచిత్రాన్ని పాదసూచికలో తెలుపడం ద్వారా దాని భావవ్యాప్తిని దాచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘భక్షించు’ వంటి పాత లేదా అధిక ఆచారభాషకు బదులుగా ‘తిను,’ ‘మరణించు’కు బదులుగా సహజమైన ‘చనిపోవు’ వాడబడ్డాయి. మూలంలోని సంక్షిప్త పోలికను డాష్ మరియు సెమికోలన్‌తో స్పష్టంగా విభజించాం.
