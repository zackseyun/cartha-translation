- from: పరలోకం నుండి దిగివచ్చిన ఆహారం ఇదే—పితరులు[a] తిని చనిపోయినట్లుగా కాదు; ఈ ఆహారం తినేవాడు శాశ్వతంగా జీవిస్తాడు.[b]
  to: స్వర్గం నుండి దిగివచ్చిన రొట్టె ఇదే—పితరులు[a] తిని చనిపోయిన దానిలా కాదు; ఈ రొట్టెను తినేవాడు శాశ్వతంగా జీవిస్తాడు.[b]
