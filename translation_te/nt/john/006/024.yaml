id: JHN.6.24
reference: John 6:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: te
  text: అప్పుడు యేసు అక్కడ లేడనీ, ఆయన శిష్యులు కూడా లేరనీ జనసమూహం చూసినప్పుడు, వారే పడవల్లోకి[a] ఎక్కి యేసును వెదుకుతూ కపెర్నహూముకు వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చిన్న పడవల్లోకి’; గ్రీకులో ‘పడవలు’ అనే పదానికి అల్పార్థక రూపం వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: అప్పుడు ... చూసినప్పుడు
  rationale: ὅτε యొక్క కాలసంబంధాన్ని ‘చూసినప్పుడు’తో, οὖν యొక్క కథన కొనసాగింపును ‘అప్పుడు’తో సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ὁ ὄχλος
  choice: జనసమూహం
  rationale: ఒకచోట గుమికూడిన ప్రజల సమూహాన్ని సూచించే ὄχλοςకు స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపం.
- source_word: εἶδεν
  choice: చూసినప్పుడు
  rationale: మూలంలోని ప్రత్యక్షమైన ‘చూచుట’ భావాన్ని నిలుపుతుంది; ‘గ్రహించినప్పుడు’ అని అనువదిస్తే లేనిది అయిన జ్ఞానాత్మక భావాన్ని అధికంగా చేర్చినట్లవుతుంది.
- source_word: οὐκ ἔστιν ἐκεῖ
  choice: అక్కడ లేడనీ
  rationale: గ్రీకులో కథన సందర్భంలో ఉన్న వర్తమాన రూపాన్ని తెలుగు గతకాల కథనానికి సహజంగా సరిపడే విధంగా అందిస్తుంది.
- source_word: οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు కూడా లేరనీ
  rationale: οὐδέలోని అదనపు ప్రతికూల సమన్వయాన్ని తెలుగులో సహజంగా ‘కూడా లేరనీ’తో వ్యక్తపరుస్తుంది.
- source_word: ἐνέβησαν
  choice: ఎక్కి
  rationale: పడవలో ప్రవేశించి ప్రయాణించడాన్ని సూచించే సందర్భంలో ‘ఎక్కి’ సహజమైన తెలుగు ప్రయోగం.
- source_word: αὐτοὶ
  choice: వారే
  rationale: ప్రత్యేకంగా ఆ జనసమూహమే పడవలు ఎక్కిందనే మూలంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: τὰ πλοιάρια
  choice: పడవల్లోకి
  rationale: ప్రధాన పాఠ్యంలో సహజమైన సాధారణ పదాన్ని వాడి, గ్రీకు అల్పార్థక రూపంలో ఉండవచ్చే ‘చిన్న పడవలు’ భావాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
- source_word: ἦλθον εἰς Καφαρναούμ
  choice: కపెర్నహూముకు వచ్చారు
  rationale: ἔρχομαι యొక్క ‘వచ్చుట’ అనే సాధారణ అర్థాన్ని కథన తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: యేసును వెదుకుతూ
  rationale: ఇక్కడ ζητέω అంటే ఆయనను కనుగొనడానికి వెదకడం; ‘అన్వేషిస్తూ’ కంటే ‘వెదుకుతూ’ సాధారణ పాఠకులకు సహజంగా ఉండి, అవసరంలేని ఆధ్యాత్మిక భావాన్ని చేర్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. మూలంలోని జనసమూహంపై ఉద్ఘాటనను ‘వారే’తో నిలిపి, వాక్య ప్రవాహం సహజంగా ఉండేలా నిర్మించబడింది.
