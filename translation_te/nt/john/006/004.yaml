  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: te
  text: యూదుల[a] పండుగైన పస్కా సమీపంలో ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదయవాసుల పండుగ.’ గ్రీకు పదం సందర్భాన్ని బట్టి సాధారణంగా యూదులను గానీ, ప్రత్యేకంగా యూదయవాసులను గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది. తెలుగులో ఇక్కడ ‘అప్పుడు’ లేదా ‘ఇప్పుడు’ అని చేరిస్తే మూలంలో లేని కాలసూచన బలపడుతుంది; వాక్యక్రమమే అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐγγὺς
  choice: సమీపించింది
  rationale: ἦνతో కలిసి పండుగ కాలపరంగా దగ్గరపడిందని సూచిస్తుంది. ‘సమీపించింది’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: πάσχα
  choice: పస్కా
  rationale: యూదుల పస్కా పండుగకు తెలుగులో స్థిరపడిన బైబిలు పదం.
- source_word: ἑορτὴ
  choice: పండుగ
  rationale: ఉత్సవపూర్వకమైన మతపండుగను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: τῶν Ἰουδαίων
  choice: యూదుల
  rationale: ఈ సందర్భంలో పస్కా యూద ప్రజల మతపండుగను సూచిస్తుంది. అయినప్పటికీ గ్రీకు పదానికి సందర్భానుసారంగా ‘యూదయవాసులు’ అనే ప్రాంతీయ అర్థం కూడా ఉండగలదని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: యోహాను రచనలో Ἰουδαίων పదానికి అర్థం
  choice: యూదుల
  alternative: యూదయవాసుల
  rationale: ఇక్కడ ప్రస్తావన యూద ప్రజలందరితో సంబంధమున్న పస్కా పండుగ గురించి కాబట్టి ‘యూదుల’ అనేది సందర్భానికి మరింత సహజమైన అర్థం. అయితే పదంలోని సాధ్యమైన ప్రాంతీయ అర్థాన్ని పూర్తిగా తొలగించకుండా పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని apposition‌ను తెలుగులో సహజంగా వినిపించే ‘యూదుల పండుగ అయిన పస్కా’ నిర్మాణంతో వ్యక్తం చేశాం; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచాం.
