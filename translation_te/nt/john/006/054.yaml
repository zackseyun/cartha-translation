id: JHN.6.54
reference: John 6:54
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: te
  text: నా మాంసాన్ని తిని[a], నా రక్తాన్ని తాగేవాడికి నిత్యజీవం ఉంది; నేను అతన్ని చివరి రోజున లేపుతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భుజించి’; మరింత స్పష్టంగా, ‘నమిలి తిని.’ గ్రీకు క్రియ τρώγω సాధారణంగా ‘తినడం’ అనే పదం కంటే మరింత నిర్దిష్టమైన భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: తాగేవాడికి అనే సమాంతర నిర్మాణంతో ‘నా మాంసాన్ని తిని’
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతం ఈ క్రియను లక్షణంగా కలిగిన ఏకవచన వ్యక్తిని సూచిస్తుంది. తెలుగులో రెండు సమన్విత క్రియలను ‘తిని ... తాగేవాడికి’ అని చెప్పడం సహజంగా ఉండి, ఆ వ్యక్తిగత ఏకవచన భావాన్ని నిలుపుతుంది.
- source_word: τρώγων
  choice: తిని
  rationale: τρώγω సాధారణంగా తినడం కంటే మరింత స్పష్టంగా నమిలి తినడం లేదా భుజించడం అనే భావాన్ని కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యంలో సహజమైన ‘తిని’ వాడి, దాని మరింత సజీవమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: μου τὴν σάρκα
  choice: నా మాంసాన్ని
  rationale: ఇక్కడ σάρξ స్పష్టమైన, దేహసంబంధమైన ‘మాంసం’ భావంలో ఉంది. ‘శరీరం’ అని మృదువుగా లేదా వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలంలోని కఠినమైన రూపకల్పనను నిలుపుతుంది.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: నా రక్తాన్ని తాగేవాడికి
  rationale: రెండవ వర్తమాన కృదంతాన్ని సహజమైన తెలుగు ఏకవచన వ్యక్తి నిర్మాణంతో అనువదించాం. ‘రక్తం’ అనే ప్రత్యక్ష పదాన్ని మార్చలేదు.
- source_word: ἔχει
  choice: ఉంది
  rationale: గ్రీకు వర్తమాన సూచక క్రియను అనుసరించి నిత్యజీవం ఇప్పుడు అతనికి ఉందనే భావాన్ని సూటిగా తెలుపుతుంది.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవం
  rationale: యోహాను సందర్భంలో కాలవ్యాప్తి మరియు రాబోయే యుగానికి చెందిన జీవన గుణం రెండింటినీ సూచించే ప్రామాణికమైన, సహజమైన తెలుగు పదబంధం.
- source_word: κἀγὼ
  choice: నేను
  rationale: καὶ ἐγώలోని వ్యక్తిగత కర్తను స్పష్టంగా నిలుపుతుంది; తెలుగు వాక్యంలోని ప్రత్యక్ష సర్వనామం తగిన ఉద్ఘాటన ఇస్తుంది.
- source_word: ἀναστήσω
  choice: లేపుతాను
  rationale: పునరుత్థాన సందర్భంలో ‘లేపుతాను’ సహజంగా ఉండి, క్రియ యొక్క భవిష్యత్తు భావాన్ని కాపాడుతుంది.
- source_word: αὐτὸν
  choice: అతన్ని
  rationale: గ్రీకు పురుష ఏకవచన సర్వనామాన్ని, ముందు ఉన్న ఏకవచన వ్యక్తి సూచనతో అనుసంధానిస్తూ యథాతథంగా నిలుపుతుంది.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: చివరి రోజున
  rationale: యోహానులోని అంత్యకాల సంబంధిత స్థిరమైన వ్యక్తీకరణకు సహజమైన ఆధునిక తెలుగు రూపం.
theological_decisions:
- issue: తినడం, తాగడం అనే భాషను సంస్కార సంబంధంగా లేదా విశ్వాసానికి రూపకంగా ప్రధాన పాఠ్యంలో వివరించాలా
  choice: ‘మాంసాన్ని తిని, రక్తాన్ని తాగేవాడు’ అనే ప్రత్యక్ష భాషను నిలుపడం
  alternative: దీనిని ప్రభుభోజనానికి స్పష్టమైన సూచనగా లేదా ‘విశ్వసించేవాడు’ అనే రూపకార్థంగా ప్రధాన పాఠ్యంలో వివరించడం
  rationale: గ్రీకు పాఠ్యం మాంసం, రక్తం, తినడం, తాగడం అనే స్పష్టమైన పదాలనే వాడుతుంది. ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ ముందుగానే నిర్ణయించకుండా మూలంలోని theological tensionను అనువాదం నిలుపుతుంది.
- issue: αὐτόν యొక్క లింగం మరియు సంఖ్య
  choice: అతన్ని
  alternative: ఆ వ్యక్తిని లేదా వారిని
  rationale: మూలంలోని సర్వనామం పురుష ఏకవచనంలో ఉండి, ఏకవచన కృదంత కర్తను తిరిగి సూచిస్తుంది; అందువల్ల దాని వ్యాకరణ రూపాన్ని నిలుపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే వాక్యనిర్మాణం వాడాం. ‘మాంసం,’ ‘రక్తం’ అనే ప్రత్యక్ష పదాలను మృదువుగా మార్చలేదు. ఏకవచన వ్యక్తి సూచనను ‘తాగేవాడికి ... అతన్ని’ ద్వారా కొనసాగించాం.
