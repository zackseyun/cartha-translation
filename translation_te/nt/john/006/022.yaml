translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వచనం. గ్రీకు వాక్యంలోని దీర్ఘమైన గ్రహింపు నిర్మాణాన్ని ‘లేదనీ ... ఎక్కలేదనీ ... వెళ్లిపోయారనీ గమనించారు’ అనే సమాంతర నిర్మాణంతో నిలిపింది. ‘సముద్రం’ యోహాను సువార్తలోని భౌగోళిక పదప్రయోగాన్ని అనుసరిస్తుంది.
