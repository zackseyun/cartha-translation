  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: te
  text: మరుసటి రోజు, సముద్రానికి అవతలి వైపున ఉండిపోయిన జనసమూహం, అక్కడ ఒకటి తప్ప మరే చిన్న పడవ లేదనీ,[a] యేసు తన శిష్యులతో కలిసి పడవలోకి ఎక్కలేదనీ,[b] ఆయన శిష్యులే వెళ్లిపోయారనీ గమనించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చిన్న పడవ’కు బదులుగా ‘పడవ’ అని కూడా అనువదించవచ్చు; ఇక్కడి గ్రీకు పదం πλοιάριον, చిన్నదనాన్ని సూచించే రూపం.
    reason: lexical_alternative
  - marker: b
    text: ఈ వచనంలో కొన్ని ప్రాచీన ప్రతులు, పాఠసంచికలు ‘చిన్న పడవ’ (πλοιάριον), ‘పడవ’ (πλοῖον) అనే పదాల విషయంలో భిన్నంగా ఉన్నాయి; ఇక్కడి అనువాదం ముద్రిత గ్రీకు పాఠంలో ప్రతి ఉపవాక్యంలో ఉన్న పదాన్నే అనుసరిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: మరుసటి రోజు
  rationale: తరువాతి రోజు జరిగిన సంగతులను పరిచయం చేసే సహజమైన ఆధునిక తెలుగు కాలప్రయోగం.
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: ఉండిపోయిన జనసమూహం
  rationale: పరిపూర్ణ కృదంతంలోని, ముందునుంచి అక్కడే ఉండి కొనసాగిన స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: πέραν τῆς θαλάσσης
  choice: సముద్రానికి అవతలి వైపున
  rationale: పέραν + షష్ఠీ విభక్తి సూచించే అవతలి తీరంలోని స్థానాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: εἶδον
  choice: గమనించారు
  rationale: తరువాతి రెండు ὅτι ఉపవాక్యాలలోని విషయాలను జనులు గుర్తించిన భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; మూలంలోని దృష్టి/గ్రహింపు భావాన్ని నిలుపుతుంది.
- source_word: πλοιάριον
  choice: చిన్న పడవ
  rationale: దీనిలోని diminutive రూపభేదాన్ని ‘చిన్న’ అనే విశేషణంతో ప్రతిబింబిస్తుంది.
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: అక్కడ ఒక చిన్న పడవ తప్ప మరేదీ లేదని
  rationale: ఒక్క పడవ మాత్రమే అక్కడ ఉందనే ప్రత్యేకతను సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: οὐ συνεισῆλθεν ... εἰς τὸ πλοῖον
  choice: కలిసి ఆ పడవలో ఎక్కలేదని
  rationale: సహప్రవేశం అనే συνεισῆλθεν భావాన్ని, పడవ సందర్భానికి తగిన ‘కలిసి ... ఎక్కు’ అనే ప్రస్తుత తెలుగు ప్రయోగంతో అందిస్తుంది.
- source_word: μόνοι
  choice: మాత్రమే
  rationale: శిష్యులు యేసు లేకుండా తామే వెళ్లారనే మినహాయింపు భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἀπῆλθον
  choice: వెళ్లిపోయారు
  rationale: అక్కడి నుంచి బయలుదేరి వెళ్లిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
