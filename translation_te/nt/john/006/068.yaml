id: JHN.6.68
reference: John 6:68
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
translation:
  language: te
  text: 'సీమోను పేతురు ఆయనకు జవాబిచ్చాడు: “ప్రభువా,[a] మేము ఎవరి దగ్గరకు వెళ్తాము? నిత్యజీవపు మాటలు నీ దగ్గర ఉన్నాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యజమానీ.” గ్రీకు సంబోధన గౌరవపూర్వకంగా కూడా వాడవచ్చు; ఇక్కడ యోహాను సువార్త సందర్భానికి “ప్రభువా” సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: ఆయనకు ఇలా జవాబిచ్చాడు
  rationale: సంభాషణలో ప్రతిస్పందనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; αὐτῷ యేసును సూచిస్తున్నందున గౌరవార్థకంగా ‘ఆయనకు’ వాడబడింది.
- source_word: Σίμων Πέτρος
  choice: సీమోను పేతురు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితమైన పేర్ల రూపాలు.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριος అనే సంబోధనలోని గౌరవార్థాన్ని, యోహాను సందర్భంలోని క్రీస్తు సంబంధిత ప్రతిధ్వనిని కాపాడే సాధారణ తెలుగు రూపం.
- source_word: πρὸς τίνα ἀπελευσόμεθα
  choice: మేము ఎవరి దగ్గరికి వెళ్తాం?
  rationale: πρός వ్యక్తివైపు వెళ్లడాన్ని సూచిస్తుంది; ‘ఎవరి దగ్గరికి’ అనేది వ్యక్తిగత సంబంధ బలాన్ని సహజ తెలుగులో నిలుపుతుంది. భవిష్యత్ రూపం సందర్భంలో అలంకారిక ప్రశ్నగా వ్యక్తమైంది.
- source_word: ῥήματα ζωῆς αἰωνίου
  choice: నిత్యజీవపు మాటలు
  rationale: ῥήματα యొక్క పలికిన మాటలు/వాక్యాలు అనే భావాన్ని ‘మాటలు’ సహజంగా అందిస్తుంది; ζωὴ αἰώνιος అనే యోహాను రచనల ముఖ్య పదబంధాన్ని ‘నిత్యజీవం’గా నిలుపుతుంది.
- source_word: ἔχεις
  choice: నీ దగ్గరే ఉన్నాయి
  rationale: సాధారణ స్వాధీన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, ప్రశ్నలోని వ్యత్యాసాన్ని బట్టి ‘ఏ’ నొక్కును ఇస్తుంది; ఇది ఇతరుల దగ్గర అవి లేవని కఠిన తాత్త్విక ప్రకటనగా కాక సందర్భానుగుణ ఉద్ఘాటనగా ఉంది.
theological_decisions:
- issue: యేసును ఉద్దేశించిన Κύριε సంబోధన బలం
  choice: ప్రభువా
  alternative: బోధకుడా / యజమానీ
  rationale: ‘ప్రభువా’ గౌరవ సంబోధనను, సాధ్యమైన క్రీస్తు సంబంధిత బరువును రెండింటినీ నిలుపుతుంది; పాఠ్యం అనుమతించే భావాన్ని తగ్గించదు లేదా మరీ నిర్దిష్టంగా పరిష్కరించదు.
- issue: ζωῆς αἰωνίου అనే షష్ఠీ విభక్తి సంబంధం
  choice: నిత్యజీవపు మాటలు
  alternative: నిత్యజీవాన్ని ఇచ్చే మాటలు
  rationale: గ్రీకు పదబంధం ‘మాటలు’ మరియు ‘నిత్యజీవం’ మధ్య సంబంధాన్ని సంక్షిప్తంగా ఉంచుతుంది. ‘ఇచ్చే’ అని చేరిస్తే మూలంలో స్పష్టంగా లేని కారణార్థాన్ని నిర్ణయించినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. ‘ఎవరి దగ్గరికి వెళ్తాం?’ సాధారణ పాఠకులకు సులభంగా ఉండి మూలంలోని వ్యక్తిగత దిశను కాపాడుతుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోలుతుంది.
