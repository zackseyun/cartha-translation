  to: 'సీమోను పేతురు ఆయనకు జవాబిచ్చాడు: “ప్రభువా,[a] మేము ఎవరి దగ్గరకు వెళ్తాము? నిత్యజీవపు మాటలు నీ దగ్గర ఉన్నాయి.”'
