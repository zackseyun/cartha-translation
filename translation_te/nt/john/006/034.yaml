  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτόν· Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: te
  text: 'అందుకు వారు ఆయనతో ఇలా అన్నారు: “ప్రభువా,[a] ఈ రొట్టెను ఎప్పుడూ మాకు ఇవ్వండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయ్యా.” గ్రీకు బిరుదు గౌరవపూర్వక సంబోధనగానూ ‘ప్రభువా’ అనే అర్థంలోనూ వాడవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: అన్నారు
  rationale: λέγω యొక్క భూతకాల కథనరూపాన్ని సంభాషణలో సహజమైన ‘అన్నారు’గా అనువదించాం.
- source_word: οὖν
  choice: అందుకు
  rationale: ముందటి మాటకు ప్రతిస్పందనగా ఈ అభ్యర్థన వచ్చిన సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πρὸς αὐτόν
  choice: ఆయనతో
  rationale: మాట్లాడే క్రియతో వచ్చిన πρός + ద్వితీయా విభక్తి సంబోధించబడిన వ్యక్తిని సూచిస్తుంది; తెలుగులో ‘ఆయనతో’ సహజం.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: ఈ సంబోధన గౌరవార్థక పిలుపుగానూ ‘ప్రభువు’ అనే లోతైన అర్థంతోనూ వినిపించగల గ్రీకు పదంలోని విస్తృతిని నిలుపుతుంది.
- source_word: πάντοτε
  choice: ఎప్పుడూ
  rationale: నిరంతరంగా లేదా అన్ని వేళలా ఇవ్వాలనే అభ్యర్థనను సాధారణ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δὸς
  choice: ఇవ్వండి
  rationale: δίδωμι యొక్క ఆజ్ఞార్థక అభ్యర్థనను మర్యాదపూర్వక తెలుగు సంబోధనకు తగిన విధంగా అందిస్తుంది.
- source_word: ἡμῖν
  choice: మాకు
  rationale: δίδωμι క్రియకు పరోక్ష కర్మను సహజమైన తెలుగు దత్తార్థక రూపంలో చూపుతుంది.
- source_word: τὸν ἄρτον τοῦτον
  choice: ఈ రొట్టెను
  rationale: ἄρτοςను ‘రొట్టె’గా, τοῦτον యొక్క సమీప సూచనను ‘ఈ’గా ఉంచి ముందటి చర్చతో ఉన్న సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యేసును నేరుగా సంబోధించినప్పుడు Κύριε అనువాదం
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: మాట్లాడినవారి అవగాహన పూర్తిగా క్రీస్తు సంబంధమైనదేనా అనేది సందర్భంలో స్పష్టంగా లేకపోయినా, ‘ప్రభువా’ గ్రీకు బిరుదులోని గౌరవార్థకతను మరియు సాధ్యమైన లోతైన ప్రాధాన్యాన్ని రెండింటినీ నిలుపుతుంది; ప్రత్యామ్నాయ గౌరవార్థక భావాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. ‘ఇవ్వండి’ బహువచనం కంటే మర్యాదార్థక ఏకవచనంగా పనిచేస్తుంది. పాదసూచిక గుర్తు సంబంధిత సంబోధన వెంట ఉంచబడింది.
