id: JHN.6.42
reference: John 6:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: te
  text: 'వారు ఇలా అంటూనే ఉన్నారు: “ఇతడు యోసేపు కుమారుడైన యేసు కాదా? ఇతని తండ్రి, తల్లి మనకు తెలుసు కదా? మరి ఇప్పుడు, ‘నేను పరలోకం నుండి దిగివచ్చాను’ అని ఇతడు ఎలా అంటున్నాడు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: వారు ఇలా అంటున్నారు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే జరుగుతున్న మాటలను సూచిస్తుంది. తెలుగు కథనంలో సహజంగా ఉండే వర్తమాన రూపం ఆ కొనసాగుతున్న గొణుగుడు సందర్భాన్ని నిలుపుతుంది.
- source_word: Οὐχ οὗτός ἐστιν
  choice: ఇతడు ... కాదా?
  rationale: అంగీకారాన్ని ఆశించే ప్రతికూల ప్రశ్న యొక్క వాక్చాతుర్య బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: యోసేపు కుమారుడైన
  rationale: యేసు తమకు తెలిసిన మానవ కుటుంబానికి చెందినవాడనే జనసమూహపు ఉద్దేశాన్ని స్పష్టంగా ఉంచే ప్రత్యక్ష అనువాదం.
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: ఇతని తండ్రి, తల్లి మనకు తెలుసు కదా?
  rationale: సంబంధ వాక్యంలోని భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ఆయన తల్లిదండ్రులు తమకు తెలుసనే వారి నొక్కిచెప్పడాన్ని కాపాడుతుంది.
- source_word: πῶς νῦν λέγει
  choice: మరి ఇప్పుడు ... ఎలా అంటున్నాడు?
  rationale: πῶς యొక్క ప్రాథమిక అర్థమైన ‘ఎలా’ను నిలుపుతూ, ‘అనగలడు’ వంటి అదనపు సామర్థ్య భావాన్ని చేర్చదు; νῦνను ‘ఇప్పుడు’గా స్పష్టంగా ఉంచుతుంది.
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: మూలం లేదా ఆరంభస్థానాన్ని సూచించే ἐκ + షష్ఠీ విభక్తికి సహజమైన తెలుగు సమానం.
- source_word: καταβέβηκα
  choice: దిగివచ్చాను
  rationale: పూర్తయిన దిగివచ్చే చర్యను, దాని ప్రస్తుత ప్రాసంగికతతో సహా, సహజంగా వ్యక్తం చేస్తుంది. తెలుగు క్రియారూపంలో గ్రీకు పరిపూర్ణ కాలపు భావం సందర్భానుసారంగా నిలుస్తుంది.
theological_decisions:
- issue: యేసు పరలోక మూలం గురించి జనసమూహం వ్యక్తం చేసిన అభ్యంతరం
  choice: ‘నేను పరలోకం నుండి దిగివచ్చాను’ అనే ప్రత్యక్ష వాదనను యథాతథంగా ఉంచడం
  alternative: ‘నేను పరలోకం నుండి వచ్చాను’ లేదా రూపకాలంకారంగా వివరణ ఇవ్వడం
  rationale: మూలపాఠం యేసు చేసిన పరలోక మూలపు వాదనపట్ల వారి ఆశ్చర్యం లేదా అభ్యంతరాన్ని నేరుగా ఉంచుతుంది. దానిని రూపకంగా మృదువుపరచకుండా, అలాగే అదనపు సిద్ధాంత వివరణను చేర్చకుండా పాఠంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలి. సంభాషణలో ‘ఇతడు’, ‘కాదా?’, ‘మరి ఇప్పుడు’ అనే రూపాలు జనసమూహపు సందేహభరిత అభ్యంతరాన్ని సహజంగా తెలియజేస్తాయి. ఎటువంటి పాదటిప్పణి అవసరం లేదు.
