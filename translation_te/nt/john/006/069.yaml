  text: καὶ ἡμεῖς πεπιστεύκαμεν καὶ ἐγνώκαμεν ὅτι σὺ εἶ ὁ ⸀ἅγιος τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
translation:
  language: te
  text: 'మేము నమ్మి, తెలుసుకొని ఉన్నాము: నీవు దేవుని పరిశుద్ధుడవని[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “నీవు క్రీస్తువు, సజీవుడైన దేవుని కుమారుడవు” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా, “దేవుని నుండి వచ్చిన పరిశుద్ధుడు.” గ్రీకు షష్ఠీ విభక్తి సంబంధాన్నిగానీ మూలాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: మేము
  rationale: గ్రీకులో స్పష్టంగా ఉన్న సర్వనామం ఉద్ఘాటనను ఇస్తుంది. తెలుగులో ‘మేము’ను విడిగా ఉంచడం ద్వారా ఆ ఉద్ఘాటన సహజంగా నిలుస్తుంది.
- source_word: πεπιστεύκαμεν
  choice: నమ్మాము
  rationale: ఈ పూర్ణకాల క్రియ గతంలో ఏర్పడి ఇప్పటికీ నిలిచిన విశ్వాసాన్ని సూచిస్తుంది. తెలుగులో సందర్భంతో కూడిన ‘నమ్మాము’ ఆ స్థిరమైన ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐγνώκαμεν
  choice: తెలుసుకున్నాము
  rationale: ఈ పూర్ణకాల రూపం జ్ఞానానికి వచ్చి, ఇప్పుడు దానిని కలిగి ఉండడాన్ని సూచిస్తుంది. ‘తెలుసుకున్నాము’ జ్ఞానం పొందిన భావాన్నీ దాని ప్రస్తుత ఫలితాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: ఇది నమ్మకం, జ్ఞానం దేనికి సంబంధించినవో తెలిపే విషయవాచక ఉపవాక్యాన్ని పరిచయం చేస్తుంది.
- source_word: ὁ ἅγιος
  choice: పరిశుద్ధుడు
  rationale: ఇక్కడ ఇది యేసుకు వర్తించే బిరుదు; దేవునిచేత ప్రత్యేకంగా వేరుచేయబడిన ఏకైక వ్యక్తి అనే భావాన్ని ‘పరిశుద్ధుడు’ గౌరవప్రదంగా, సహజంగా అందిస్తుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: సంబంధం, చెందినవాడు అనే భావం, లేదా మూలం—ఈ విభక్తి సూచించగల విస్తృత భావాన్ని ‘దేవుని’ కాపాడుతుంది; దానిని కేవలం ‘దేవుని నుండి వచ్చిన’ అని పరిమితం చేయదు.
theological_decisions:
- issue: యోహాను 6:69లోని క్రీస్తు సంబంధమైన బిరుదు
  choice: దేవుని పరిశుద్ధుడు
  alternative: దేవుని నుండి వచ్చిన పరిశుద్ధుడు; సజీవుడైన దేవుని కుమారుడవైన క్రీస్తు
  rationale: SBLGNT పాఠంలో ὁ ἅγιος τοῦ θεοῦ ఉంది. కాబట్టి దీనిని ఇతర సువార్తలతో సమన్వయపరచకుండా నేరుగా బిరుదుగానే అనువదించాం. ‘దేవుని’ అనే రూపం గ్రీకు షష్ఠీ విభక్తిలోని సంబంధాన్ని ఉద్దేశపూర్వకంగా విస్తృతంగానే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు వాక్యంలోని ఉద్ఘాటిత ‘మేము’ను నిలిపి, రెండు పూర్ణకాల క్రియలను సహజమైన తెలుగు భూతకాల రూపాలతో అందించాం. శీర్షికలోని షష్ఠీ విభక్తి భావాన్ని ప్రధాన పాఠంలో విస్తృతంగా ఉంచి, మూలార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
