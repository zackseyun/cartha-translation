  rationale: The revision places “మేము” first to reflect the explicit Greek pronoun’s emphasis and uses “నమ్మి, తెలుసుకొని ఉన్నాము” to convey the present-result force of both perfect verbs in idiomatic Telugu. “దేవుని పరిశుద్ధుడు” is retained as the direct, non-harmonized rendering of the SBLGNT reading. The footnote variant is corrected to standard Telugu usage and rendered as a direct utterance, while the lexical-alternative note continues to preserve the genitive ambiguity.
