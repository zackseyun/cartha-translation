source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: te
  text: 'యేసు వారికి జవాబిచ్చాడు: “నిజంగా, నిజంగా మీతో చెబుతున్నాను: మీరు నన్ను వెదుకుతున్నది సూచకాలను చూశారు కాబట్టి కాదు, రొట్టెలు తిని నిండిపోయారు కాబట్టే.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పాఠంలో మరింత అక్షరార్థంగా, ‘రొట్టెల నుండి తిని నిండిపోయారు’ అని ఉంది. ‘రొట్టెలు’ బహువచనంలో ఉంది; చివరి క్రియకు ‘నిండిపోయారు’ లేదా ‘తృప్తి చెందారు’ అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: యేసు వారికి ఇలా జవాబిచ్చాడు
  rationale: గ్రీకులోని ‘జవాబిచ్చి చెప్పాడు’ అనే ద్వంద్వ సంభాషణారంభాన్ని సహజమైన ఆధునిక తెలుగులో ఒకే ప్రయోగంగా తెలిపింది; ‘ఇలా’ తరువాతి ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: నిజంగా, నిజంగా మీతో చెబుతున్నాను
  rationale: యోహాను సువార్తకు ప్రత్యేకమైన రెట్టింపు ἀμήν యొక్క గంభీరతను, పునరుక్తిని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే తెలుగు వాడింది.
- source_word: ζητεῖτέ με
  choice: నన్ను వెదుకుతున్నారు
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న అన్వేషణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι
  choice: సూచక క్రియలను చూశారు కాబట్టి ... లేదు; ... కాబట్టే
  rationale: οὐχ ὅτι ... ἀλλ’ ὅτι తెలిపే కారణాల మధ్య వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: σημεῖα
  choice: సూచక క్రియలు
  rationale: కేవలం అద్భుతాలు అని కాక, యేసు కార్యాలు తమకు మించిన వాస్తవాన్ని సూచిస్తాయనే యోహానీయ భావాన్ని నిలుపుతుంది.
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: రొట్టెలు తిని
  rationale: ἄρτων యొక్క బహువచనాన్ని నిలుపుతుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ἐκ యొక్క భాగార్థాన్ని విడిగా ‘నుండి’ అని పలకడం అసహజం కాబట్టి సందర్భానుసారంగా సంక్షిప్తం చేసింది.
- source_word: ἐχορτάσθητε
  choice: కడుపు నిండింది
  rationale: తిని పూర్తిగా నిండిన శారీరక స్థితిని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; కేవలం మానసిక ‘తృప్తి’గా అర్థమయ్యే అవకాశాన్ని తగ్గిస్తుంది.
theological_decisions:
- issue: σημεῖα యొక్క యోహానీయ భావం
  choice: సూచక క్రియలు
  alternative: అద్భుతాలు; అద్భుత సూచనలు
  rationale: ‘అద్భుతాలు’ కార్యాల ఆశ్చర్యకర స్వభావాన్ని మాత్రమే ముందుకు తేవచ్చు. ‘సూచక క్రియలు’ అవి యేసు గురించి తెలియజేసే సంకేతాలనే భావాన్ని వివరణాత్మక పదం జోడించకుండా కాపాడుతుంది.
- issue: వారు సూచక క్రియలను చూసినప్పటికీ ‘చూశారు కాబట్టి కాదు’ అనే ఉద్వేగం
  choice: మూలంలోని కారణవ్యతిరేకతను యథాతథంగా నిలిపింది
  alternative: వారు సూచక క్రియల అర్థాన్ని గ్రహించలేదు కాబట్టి అని స్పష్టీకరించడం
  rationale: εἴδετε అంటే ఇక్కడ ‘చూశారు’; ‘ఆధ్యాత్మికంగా గ్రహించారు’ అని అనువదిస్తే మూలంలో అంతర్లీనంగా ఉన్న ఉద్వేగాన్ని ముందుగానే పరిష్కరించినట్టవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘నిజంగా, నిజంగా’ అనే పునరుక్తి మూలంలోని యోహానీయ సూత్రవాక్యాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
