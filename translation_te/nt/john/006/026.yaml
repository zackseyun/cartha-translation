review_pass:
  verdict: revise
  source_fidelity: The draft preserves the major contrast of motives, the doubled solemn affirmation, the present sense of seeking, and the plural ‘loaves.’ However, ‘కడుపు నిండింది’ shifts the second-person plural passive into an impersonal singular expression, and the footnote’s ‘రొట్టెలలో నుండి’ is not a natural or accurate Telugu way to convey the partitive force of ἐκ τῶν ἄρτων.
  naturalness: The revised wording uses an idiomatic Telugu construction for ‘you are seeking me ... not because ... but because,’ avoids the awkward juxtaposition of ‘వెదకడం లేదు’ and ‘వెదుకుతున్నారు,’ and renders the result of eating naturally as ‘నిండిపోయారు.’ ‘సూచకాలను’ is clearer and more natural than ‘సూచక క్రియలను’ while retaining John’s sign terminology.
  terminology: ‘నిజంగా, నిజంగా’ suitably retains the repeated Ἀμήν. ‘సూచకాలను’ preserves the Johannine theological vocabulary without reducing σημεῖα to mere miracles. ‘నిండిపోయారు’ accurately represents ἐχορτάσθητε as being fed to fullness; the footnote supplies ‘తృప్తి చెందారు’ as a legitimate alternative.
  issues:
  - severity: medium
    issue: The main text reads ‘కడుపు నిండింది.’
    rationale: This is an impersonal singular expression (‘the stomach was filled’) rather than a rendering of the source’s second-person plural passive, ἐχορτάσθητε (‘you were filled/satisfied’).
  - severity: medium
    issue: The footnote says ‘రొట్టెలలో నుండి తిని.’
    rationale: This suggests eating from inside the loaves and is not idiomatic Telugu for the Greek partitive phrase ἐκ τῶν ἄρτων. A note should explain the literal ‘రొట్టెల నుండి’ wording rather than present an unnatural alternative.
  - severity: low
    issue: ‘సూచక క్రియలను’ is overly technical and less natural in modern Telugu.
    rationale: The Greek noun σημεῖα is adequately and more idiomatically represented by ‘సూచకాలను’; the surrounding context makes clear that these are Jesus’ deeds.
  revised_text: 'యేసు వారికి జవాబిచ్చాడు: “నిజంగా, నిజంగా మీతో చెబుతున్నాను: మీరు నన్ను వెదుకుతున్నది సూచకాలను చూశారు కాబట్టి కాదు, రొట్టెలు తిని నిండిపోయారు కాబట్టే.[a]”'
