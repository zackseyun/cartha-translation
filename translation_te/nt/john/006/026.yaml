- from: 'యేసు వారికి ఇలా జవాబిచ్చాడు: “నిజంగా, నిజంగా మీతో చెబుతున్నాను: మీరు సూచక క్రియలను చూశారు కాబట్టి నన్ను వెదకడం లేదు; రొట్టెలు తిని కడుపు నిండింది కాబట్టే నన్ను వెదుకుతున్నారు.[a]”'
  to: 'యేసు వారికి జవాబిచ్చాడు: “నిజంగా, నిజంగా మీతో చెబుతున్నాను: మీరు నన్ను వెదుకుతున్నది సూచకాలను చూశారు కాబట్టి కాదు, రొట్టెలు తిని నిండిపోయారు కాబట్టే.[a]”'
  rationale: The revision corrects the person and number mismatch in the final clause, expresses the motive contrast idiomatically, and replaces an unnatural technical expression for ‘signs’ with a clear modern Telugu equivalent. The footnote is recast to explain, rather than awkwardly reproduce, the Greek partitive expression. No theological interpretation has been added.
