source:
  edition: SBLGNT
  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: te
  text: అప్పటి నుండి ఆయన శిష్యుల్లో చాలామంది వెనక్కి వెళ్లిపోయి, ఇకపై ఆయనతో కలిసి నడవలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దీనివల్ల ఆయన శిష్యుల్లో చాలామంది వెనక్కి వెళ్లిపోయారు”; గ్రీకు ప్రారంభ పదబంధాన్ని కారణార్థకంగా కూడా అర్థం చేసుకోవచ్చు. అయితే ఈ సందర్భంలో “అప్పటి నుండి” అనేది నిర్ణాయక మలుపు భావాన్ని మెరుగ్గా ప్రతిబింబిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: అప్పటి నుండి
  rationale: సందర్భంలో ఇది యేసు చెప్పిన కఠినమైన మాటల తర్వాత ఏర్పడిన నిర్ణాయక మలుపును సూచించే కాలార్థక ప్రయోగంగా సహజంగా అర్థమవుతుంది. కారణార్థక భావం సాధ్యమే కనుక దాన్ని పాదసూచికలో ఉంచాం.
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ఆయన శిష్యుల్లో చాలామంది
  rationale: ἐκ అనే విభాగార్థక ప్రయోగం, వెళ్లిపోయినవారు ఆయన శిష్యులనే పెద్ద సమూహంలో కొందరని తెలియజేస్తుంది. ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: వెనక్కి వెళ్లిపోయి
  rationale: క్రియతో కూడిన εἰς τὰ ὀπίσω కేవలం అక్కడి నుంచి వెళ్లడాన్ని కాక వెనుదిరగడం లేదా వెనక్కి తగ్గడాన్ని సూచిస్తుంది.
- source_word: οὐκέτι
  choice: ఇకపై ... లేదు
  rationale: ఆ సమయం నుంచి కొనసాగిన క్రియ ఆగిపోయిందనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: ఆయనతో కలిసి నడవలేదు
  rationale: యేసుతో కొనసాగిన సహవాసం, అనుసరణ అనే భావాన్ని కలిగించే ‘నడవడం’ రూపకాన్ని నిలుపుతుంది; దాన్ని కేవలం ‘అనుసరించడం’గా వివరణాత్మకంగా మార్చదు.
theological_decisions:
- issue: μαθηταί అనే పదం ఇక్కడ పన్నెండు మందినే లేదా నిజమైన విశ్వాసులనే సూచిస్తుందా
  choice: శిష్యులు
  alternative: అనుచరులు
  rationale: మూలపాఠం ఆయన శిష్యుల్లో చాలామంది వెనక్కి వెళ్లారని మాత్రమే చెబుతుంది; వారిని పన్నెండు మందితో సమానంగా చూడదు, అలాగే వారి విశ్వాస స్వభావంపై సిద్ధాంతపరమైన తీర్పు ఇవ్వదు. ‘శిష్యులు’ కథనంలోని వర్గాన్ని యథాతథంగా నిలుపుతుంది.
translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. వాక్యానికి గౌరవప్రదమైన సరళతను ఉంచుతూ, ‘ఆయనతో కలిసి నడవడం’ అనే మూల రూపకాన్ని మరియు ప్రారంభ పదబంధంలోని నిజమైన అర్థసందిగ్ధతను నిలిపాం.
