  yaml_path: translation/nt/john/006/059.yaml
  text: He said these things while teaching in the synagogue in Capernaum.
translation:
  language: te
  text: ఆయన కపెర్నహూములోని సమాజమందిరంలో బోధిస్తూ ఈ సంగతులు చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ఈ సంగతులు
  rationale: నపుంసక బహువచన సూచనపదం ముందున్న ఉపదేశంలోని మాటలు లేదా విషయాల సముదాయాన్ని సూచిస్తుంది; తెలుగు సహజత్వంతో పాటు బహువచన భావాన్ని నిలుపుతుంది.
- source_word: εἶπεν
  choice: ఆయన … చెప్పాడు
  rationale: λέγω యొక్క భూతకాల క్రియారూపానికి నేరమైన అనువాదం. గ్రీకులో కర్త అంతర్లీనంగా ఉండగా, తెలుగులో సందర్భానుసారంగా యేసును సూచించే ‘ఆయన’ అవసరం.
- source_word: ἐν συναγωγῇ
  choice: సమాజమందిరంలో
  rationale: గ్రీకులో ఉపపదం లేకపోయినా, కపెర్నహూములోని సందర్భపరంగా తెలిసిన యూదుల ఆరాధనా-బోధనా స్థలాన్ని సూచిస్తుంది. ‘సమాజమందిరం’ ఆధునిక తెలుగు బైబిలు వాడుకలో అర్థమయ్యే పదం.
- source_word: διδάσκων
  choice: బోధిస్తూ
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలికంగా కొనసాగుతున్న చర్యను తెలియజేస్తుంది; ‘బోధిస్తూ’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν Καφαρναούμ
  choice: కపెర్నహూములోని
  rationale: స్థలనామాన్ని తెలుగు లిపిలో ధ్వన్యనుకరణ చేసి, సమాజమందిరంతో సహజంగా అనుసంధానించే స్థానవాచక రూపాన్ని ఉపయోగించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. గ్రీకు వాక్యంలోని సమాచారం, కృదంత సంబంధం మరియు ‘ఈ సంగతులు’ అనే బహువచన సూచన నిలుపబడ్డాయి.
