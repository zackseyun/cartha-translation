id: JHN.6.21
reference: John 6:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: te
  text: కాబట్టి వారు ఆయనను పడవలోకి తీసుకోవడానికి సుముఖంగా ఉన్నారు; వెంటనే ఆ పడవ వారు వెళ్తున్న ఒడ్డున ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤθελον
  choice: ఇష్టపడ్డారు
  rationale: θέλω యొక్క అపూర్ణ భూతకాల రూపం ఇక్కడ, భయం తొలగిన తరువాత యేసును పడవలోకి తీసుకోవడానికి వారు సిద్ధంగా లేదా సుముఖంగా ఉన్నారని సూచిస్తుంది. సహజమైన తెలుగులో ‘ఇష్టపడ్డారు’ ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: οὖν
  choice: అందువల్ల
  rationale: ముందటి సందర్భం నుంచి వచ్చే పరిణామ సంబంధాన్ని οὖν సూచిస్తుంది; ‘అందువల్ల’ ఆ సంబంధాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: ఆయనను పడవలోకి తీసుకోవడానికి
  rationale: యేసును పడవలోకి చేర్చుకోవడమనే స్పష్టమైన భౌతిక సందర్భాన్ని ఈ పదబంధం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πλοῖον
  choice: పడవ
  rationale: గలిలయ సరస్సు సందర్భంలో πλοῖονకు ‘పడవ’ సహజమైన సమానార్థకం; ‘ఓడ’ పరిమాణాన్ని అతిశయింపజేయవచ్చు.
- source_word: εὐθέως
  choice: వెంటనే
  rationale: εὐθέως తెలిపే తక్షణత్వాన్ని, అలాగే కథనంలోని ఆకస్మికతను ‘వెంటనే’ నిలుపుతుంది.
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: ఆ పడవ ... ఒడ్డుకు చేరింది
  rationale: γίνομαιతో కూడిన స్థాన సూచనను తెలుగులో ‘చేరింది’ అని చెప్పడం సహజం. ‘భూమి మీద ఉంది’ అనే అక్షరానువాదం పడవ నేలపైకి వచ్చేసిందనే అపార్థాన్ని కలిగించవచ్చు.
- source_word: γῆς
  choice: ఒడ్డుకు
  rationale: ఈ జలయాన సందర్భంలో γῆ వారు చేరవలసిన భూభాగం లేదా తీరం. తెలుగులో ‘ఒడ్డు’ గమ్యస్థానాన్ని సహజంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: εἰς ἣν ὑπῆγον
  choice: వారు వెళ్తున్న
  rationale: ὑπάγω యొక్క అపూర్ణ భూతకాల రూపం కొనసాగుతున్న ప్రయాణాన్ని సూచిస్తుంది; ‘వారు వెళ్తున్న’ ఆ కాలాంశాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పడవ గమ్యానికి చేరడంలోని తక్షణత్వాన్ని అద్భుతంగా వివరించాలా లేదా సాధారణ ప్రయాణంగా మృదువుచేయాలా
  choice: ‘వెంటనే’ అనే స్పష్టమైన తక్షణత్వాన్ని ఎలాంటి వివరణాత్మక చేర్పు లేకుండా నిలుపడం.
  alternative: ‘కొద్దిసేపటికి పడవ ఒడ్డుకు చేరింది’ లేదా సంఘటనను బహిరంగంగా ‘అద్భుతం’ అని పేర్కొనడం.
  rationale: గ్రీకు వాక్యం సంఘటనను క్లుప్తంగా, స్పష్టమైన తక్షణత్వంతో చెబుతుంది; అయితే దాని స్వభావాన్ని వివరించదు. అనువాదం ఈ కథన ఉద్వేగాన్ని మృదువుచేయకూడదు, అలాగే మూలంలో లేని సిద్ధాంత వివరణను చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దాని తక్షణత్వం మరియు భావసూక్ష్మతను కాపాడింది.
