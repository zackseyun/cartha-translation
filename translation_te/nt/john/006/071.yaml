  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: te
  text: ఆయన సీమోను ఇస్కరియోతు కుమారుడైన యూదా గురించి మాట్లాడుతున్నాడు; ఎందుకంటే పన్నెండుమందిలో ఒకడైన ఇతడే ఆయనకు ద్రోహం చేయబోతున్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: ‘ఆయనను అప్పగించబోతున్నాడు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: ఆయన ... యూదా గురించి చెప్పాడు
  rationale: ఈ సందర్భంలో అసంపూర్ణ భూతకాల క్రియ కథకుని వివరణను సూచిస్తుంది. తెలుగులో సహజంగా ‘గురించి చెప్పాడు’ అని అనువదించడం గ్రీకు నిర్మాణ భావాన్ని స్పష్టంగా అందిస్తుంది; δὲకి ప్రత్యేక విరోధార్థక పదం చేర్చలేదు.
- source_word: Σίμωνος Ἰσκαριώτου
  choice: సీమోను ఇస్కరియోతు కుమారుడైన
  rationale: రెండు షష్ఠీ విభక్తి రూపాలు యూదాను తండ్రి సంబంధంతో గుర్తిస్తున్నట్లు సహజంగా అర్థమవుతాయి; ‘ఇస్కరియోతు’ సీమోనును విశేషిస్తుంది.
- source_word: οὗτος
  choice: ఇతడే
  rationale: సూచనాత్మకమైన, స్వల్ప ఉద్ఘాటనగల οὗτος భావాన్ని ‘ఇతడే’ సహజంగా నిలుపుతుంది.
- source_word: ἔμελλεν
  choice: చేయబోతున్నాడు
  rationale: μέλλω తెలిపే సమీప భవిష్యత్తు లేదా ముందున్న కార్య భావాన్ని నిలుపుతుంది; విధినిర్ణయం లేదా ఉద్దేశాన్ని అదనంగా చేర్చదు.
- source_word: παραδιδόναι αὐτόν
  choice: ఆయనకు ద్రోహం చేయబోతున్నాడు
  rationale: యోహాను సువార్తలో యూదా చర్యకు సంబంధించిన కథన సందర్భంలో ‘ద్రోహం చేయడం’ సంబంధపరమైన భావాన్ని స్పష్టంగా అందిస్తుంది; మరింత పదశః ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: పన్నెండుమందిలో ఒకడైన
  rationale: ద్రోహం చేయబోయే వ్యక్తి పన్నెండుమంది శిష్యుల వర్గానికే చెందినవాడనే ఆశ్చర్యకరమైన గుర్తింపును సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: యూదా చర్యకు παραδιδόναι అనువాదం
  choice: ద్రోహం చేయబోతున్నాడు
  alternative: ఆయనను అప్పగించబోతున్నాడు
  rationale: παραδίδωμι ప్రాథమికంగా ‘అప్పగించు’ అని అర్థమవగలిగినా, ఈ కథన సందర్భంలో యూదా చేసిన పని ద్రోహంగా చిత్రితమవుతుంది. ప్రధాన పాఠంలో సందర్భార్థాన్ని, పాదటిప్పణిలో పదశః భావాన్ని ఉంచడం ద్వారా రెండింటినీ సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే కథన శైలి. యేసును సూచించేందుకు ‘ఆయన’, యూదాను సూచించేందుకు ‘ఇతడే’ వాడి సర్వనామ సంబంధాన్ని స్పష్టం చేశాం.
