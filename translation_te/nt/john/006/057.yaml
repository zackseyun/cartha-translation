id: JHN.6.57
reference: John 6:57
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: te
  text: జీవముగల తండ్రి నన్ను పంపినట్లుగా, నేను తండ్రివల్ల[b] జీవిస్తున్నాను; అలాగే నన్ను తినేవాడు[a] కూడా నావల్ల జీవిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నన్ను నమిలి తినేవాడు.’ గ్రీకు క్రియ స్పష్టమైన, శరీర సంబంధమైన క్రియాపదం; అక్షరార్థంగా తినడాన్ని, ముఖ్యంగా నమలడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తండ్రి ద్వారా’ మరియు ‘నా ద్వారా.’ గ్రీకు ఉపసర్గం కారణార్థంలో గానీ సాధనార్థంలో గానీ అర్థమవవచ్చు. ప్రధాన పాఠం తండ్రి–కుమారుడు, కుమారుడు–విశ్వాసి మధ్య ఉన్న సమాంతరతను నిలుపుతూ కారణార్థాన్ని ఉపయోగించింది.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: పంపినట్లుగా … అలాగే
  rationale: ఈ పదం పోలికను ప్రవేశపెడుతుంది. తెలుగులో ‘…నట్లుగా … అలాగే’ అనే జత మొత్తం వాక్యాన్ని సహజంగా అనుసంధానిస్తుంది.
- source_word: ὁ ζῶν πατὴρ
  choice: సజీవుడైన తండ్రి
  rationale: ζῶν అనే వర్తమాన కృదంతం తండ్రిని విశేషిస్తుంది. ఈ అనువాదం ‘జీవాన్ని ఇచ్చే తండ్రి’ అని అర్థాన్ని విస్తరించకుండా, జీవముగల తండ్రి అనే మూల భావాన్ని నిలుపుతుంది.
- source_word: ἀπέστειλέν
  choice: పంపిన
  rationale: అయోరిస్టు క్రియను సరళమైన గత కార్యంగా వ్యక్తం చేస్తుంది; ‘నియమించిన’ వంటి మరింత నిర్దిష్ట భావాన్ని చేర్చదు.
- source_word: ζῶ
  choice: జీవిస్తున్నాను
  rationale: వర్తమాన కాలంలో కొనసాగుతున్న జీవ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διὰ τὸν πατέρα
  choice: తండ్రివల్ల
  rationale: διά + ద్వితీయా విభక్తి ఇక్కడ కారణం లేదా ఆధారాన్ని సూచించగలదు. ‘తండ్రివల్ల’ కారణార్థాన్ని ముందుకు తెస్తూ, తరువాతి ‘నావల్ల’తో సమాంతరతను కాపాడుతుంది.
- source_word: ὁ τρώγων με
  choice: నన్ను తినేవాడు
  rationale: τρώγω యొక్క స్పష్టమైన, శరీర సంబంధమైన ‘తినడం/నమలడం’ భావాన్ని మృదువుచేయకుండా ఉంచుతుంది; అదే సమయంలో దాని ఆచారసంబంధమైన లేదా రూపకాలంకారమైన అర్థాన్ని అనువాదంలో ముందే నిర్ణయించదు.
- source_word: κἀκεῖνος
  choice: కూడా
  rationale: ‘ఆ వ్యక్తి కూడా’ అనే ఉద్ఘాటనను తెలుగులో సహజంగా తెలియజేస్తుంది; ‘అలాగే’ పోలికను మరింత స్పష్టం చేస్తుంది.
- source_word: ζήσει
  choice: జీవిస్తాడు
  rationale: భవిష్యత్ భావాన్ని నిలుపుతూ, ముందు ఉన్న ‘జీవిస్తున్నాను’తో జీవం అనే ప్రధాన పదసంబంధాన్ని కాపాడుతుంది.
- source_word: δι’ ἐμέ
  choice: నావల్ల
  rationale: ముందటి ‘తండ్రివల్ల’తో ఒకే నిర్మాణాన్ని ఉపయోగించి తండ్రి–కుమారుడు, కుమారుడు–తినేవాడు అనే సమాంతరతను స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: διὰ τὸν πατέρα లో యేసు జీవానికి తండ్రితో ఉన్న సంబంధం
  choice: ‘నేను తండ్రివల్ల జీవిస్తున్నాను’ అని కారణం/ఆధార భావంతో అనువదించబడింది.
  alternative: ‘నేను తండ్రి ద్వారా జీవిస్తున్నాను’
  rationale: మూలంలోని διά + ద్వితీయా విభక్తి కారణార్థాన్ని సహజంగా అనుమతిస్తుంది. ఈ రూపం కుమారుని సంపూర్ణ దైవత్వం గురించి అదనపు తీర్మానం చేయకుండా, వాక్యంలో ఉన్న సంబంధాన్ని మరియు సమాంతరతను మాత్రమే నిలుపుతుంది.
- issue: ὁ τρώγων με యొక్క ప్రభుభోజన సంబంధమైన లేదా విస్తృత రూపకాలంకారమైన భావం
  choice: ‘నన్ను తినేవాడు’ అనే స్పష్టమైన భాషను నిలుపుతూ వివరణను తెరిచి ఉంచడం
  alternative: ‘నాలో పాలుపొందేవాడు’ లేదా ‘నన్ను విశ్వాసంతో స్వీకరించేవాడు’
  rationale: ఇలాంటి వివరణాత్మక ప్రత్యామ్నాయాలు మూలంలోని దృశ్యమైన తినే క్రియను బలహీనపరచి, ఒక నిర్దిష్ట సిద్ధాంతార్థాన్ని ముందే నిర్ణయించవచ్చు. ప్రధాన పాఠం ఇరువిధ వ్యాఖ్యానాలకు చోటు ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘తినేవాడు’ అనే నేరమైన పదాన్ని ఉద్దేశపూర్వకంగా నిలిపి, సిద్ధాంతపరమైన వివరణను ప్రధాన పాఠంలో చేర్చలేదు. [b] గుర్తు మొదటి ‘వల్ల’ వద్ద ఉంచినా, దాని గమనిక వాక్యంలోని ‘తండ్రివల్ల’ మరియు ‘నావల్ల’ అనే రెండు సమాంతర పదబంధాలకూ వర్తిస్తుంది.
