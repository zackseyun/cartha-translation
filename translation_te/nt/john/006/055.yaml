source:
  edition: SBLGNT
  text: ἡ γὰρ σάρξ μου ⸀ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ⸁ἀληθής ἐστι πόσις.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: te
  text: ఎందుకంటే నా మాంసం నిజమైన ఆహారం[a], మరియు నా రక్తం నిజమైన పానీయం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాస్తవమైన ఆహారం” మరియు “వాస్తవమైన పానీయం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: σάρξ
  choice: మాంసం
  rationale: యేసు తన మాంసం, రక్తం అని సమాంతరంగా చెప్పినందున, వ్యాఖ్యానాత్మకమైన ‘శరీరం’ కన్నా మూలానికి దగ్గరైన పదాన్ని ఎంచుకున్నాం.
- source_word: ἀληθής
  choice: నిజమైన
  rationale: యోహాను రచనలోని ప్రత్యక్షమైన భావబలాన్ని కాపాడుతుంది; ‘వాస్తవమైన’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: βρῶσις
  choice: ఆహారం
  rationale: ఈ విధేయ నిర్మాణంలో, πόσιςతో ఉన్న సమాంతరత దృష్ట్యా, తినే క్రియకన్నా తినబడేదనే అర్థం సరిపోతుంది.
- source_word: αἷμα
  choice: రక్తం
  rationale: మూలంలోని పదాన్ని, మాంసం–రక్తం సమాంతరతను యథాతథంగా నిలుపుతుంది.
- source_word: πόσις
  choice: పానీయం
  rationale: ఇక్కడ తాగే క్రియకన్నా తాగబడేదనే అర్థం సరిపోతుంది; ‘ఆహారం’కు సహజమైన సమాంతర పదం.
theological_decisions:
- issue: యూకరిస్టు సంబంధమైన సందర్భంలో ἀληθήςను ‘నిజమైన’గా లేదా ‘వాస్తవమైన’గా అనువదించాలా
  choice: నిజమైన
  alternative: వాస్తవమైన
  rationale: ‘నిజమైన’ అనేది గ్రీకు విశేషణపు ప్రత్యక్ష భావాన్ని, యోహాను రచనలోని ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది; ఈ వచనంపై ఉన్న సిద్ధాంత వివాదాన్ని అనువాదంలోనే తీర్మానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘మాంసం,’ ‘రక్తం’ అనే స్పష్టమైన మూలపదాలను మృదువుగా మార్చలేదు; పునరుక్తి లేకుండానే గ్రీకు సమాంతరతను తెలుగులో నిలిపాం.
