id: JHN.6.45
reference: John 6:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: te
  text: 'ప్రవక్తల గ్రంథాల్లో ఇలా రాయబడి ఉంది: “వారందరూ దేవునిచేత బోధించబడతారు.”[a] తండ్రి నుండి విని నేర్చుకున్న ప్రతి ఒక్కరూ నా దగ్గరకు వస్తారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారందరూ దేవుని బోధన పొందినవారుగా ఉంటారు.”
    reason: ‘దేవునిచేత బోధించబడతారు’ అనే నిష్క్రియార్థానికి ప్రత్యామ్నాయంగా, διδακτοὶ θεοῦ యొక్క ‘దేవుని బోధన పొందినవారు / God-taught’ అనే విశేషణాత్మక భావాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: ఇలా రాయబడి ఉంది
  rationale: గ్రీకు పరిభాషాత్మక పరిపూర్ణ కాల రూపం లిఖిత వాక్యం ఇప్పటికీ ప్రామాణికంగా నిలిచి ఉందనే భావాన్ని ఇస్తుంది; ఈ తెలుగు రూపం సహజంగా ఆ స్థితిని తెలియజేస్తుంది.
- source_word: ἐν τοῖς προφήταις
  choice: ప్రవక్తల గ్రంథాల్లో
  rationale: ఇది ప్రవక్తలనే వ్యక్తులుగా మాత్రమే కాక, ప్రవక్తల లేఖనాల సమాహారాన్ని సూచించే ఉల్లేఖన సూత్రం; తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు ‘గ్రంథాల్లో’ అని వ్యక్తం చేయబడింది.
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: వారందరూ దేవునిచేత బోధించబడినవారై ఉంటారు
  rationale: διδακτοί అనే విశేషణ భావాన్ని, భవిష్యత్ కాలాన్ని, θεοῦ దేవుడే బోధకు కర్త లేదా మూలం అనే భావాన్ని కాపాడుతుంది.
- source_word: πᾶς ὁ
  choice: ప్రతి ఒక్కరూ
  rationale: ఏకవచన సార్వత్రిక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀκούσας παρὰ τοῦ πατρὸς
  choice: తండ్రి దగ్గర విని
  rationale: παρά + షష్ఠీ విభక్తి తండ్రిని వినికిడికి మూలంగా సూచిస్తుంది; ‘దగ్గర’ అనే రూపం తెలుగులో వ్యక్తిగత మూల సంబంధాన్ని సహజంగా కాపాడుతుంది.
- source_word: καὶ μαθὼν
  choice: నేర్చుకున్న
  rationale: వినడంతో సమన్వయంగా, ప్రధాన క్రియకు ముందుగా జరిగిన అభ్యాసాన్ని తెలియజేస్తుంది.
- source_word: ἔρχεται πρὸς ἐμέ
  choice: నా దగ్గరకు వస్తారు
  rationale: వర్తమాన కాలంలోని వ్యక్తిగత సమీపగమనాన్ని సహజమైన తెలుగులో కాపాడుతుంది; ‘ప్రతి ఒక్కరూ’తో గౌరవ/సామాన్య బహువచన క్రియా సరిపోతుంది.
theological_decisions:
- issue: దైవ బోధకు, యేసు దగ్గరకు రావడానికి మధ్య సంబంధం
  choice: తండ్రి దగ్గర విని నేర్చుకున్న ప్రతి ఒక్కరూ యేసు దగ్గరకు వస్తారని వాక్యం చెప్పే క్రమాన్నే ఉంచడం
  alternative: దీనిని పూర్తిగా నిర్ణయవాదంగా లేదా ప్రధానంగా మానవ సహకారాన్ని నొక్కిచెప్పే విధంగా వివరించడం
  rationale: గ్రీకు వాక్యం ఈ చర్యల సంబంధాన్ని ప్రకటిస్తుంది గాని వాటి తాత్త్విక ప్రక్రియను వివరించదు; అందువల్ల నిజమైన ధార్మిక ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడబడింది.
- issue: ‘తండ్రి’కి యేసుతో ఉన్న సంబంధం
  choice: ‘తండ్రి’ మరియు ‘నా దగ్గరకు’ అనే ప్రత్యక్ష సంబంధాన్ని యథాతథంగా ఉంచడం
  alternative: వాక్యంలో లేని అదనపు క్రీస్తుతత్వ వివరణను చేర్చడం
  rationale: తండ్రి దగ్గర నేర్చుకోవడం యేసు దగ్గరకు నడిపిస్తుందనే యోహాను సువార్తలోని బలాన్ని, పాఠ్యాన్ని మించి విస్తరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖన ఉల్లేఖనానికి తగిన గంభీరతతో. ‘ప్రవక్తల గ్రంథాల్లో’ అనేది గుర్తింపు పొందిన ప్రవక్తల లేఖన సమాహారాన్ని స్పష్టం చేస్తుంది. మూలంలోని భావం ప్రధాన పాఠ్యంలోనే స్పష్టంగా ఉన్నందున పాదసూచిక అవసరం లేదు.
