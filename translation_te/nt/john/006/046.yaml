id: JHN.6.46
reference: John 6:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐχ ὅτι τὸν πατέρα ⸂ἑώρακέν τις⸃ εἰ μὴ ὁ ὢν παρὰ τοῦ θεοῦ, οὗτος ἑώρακεν τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: te
  text: ఎవరైనా తండ్రిని చూశారని కాదు; దేవుని నుండి వచ్చినవాడు[a] తప్ప మరెవరూ తండ్రిని చూడలేదు. ఆయనే తండ్రిని చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని సన్నిధి నుండి వచ్చినవాడు’ లేదా ‘దేవునితో ఉన్నవాడు.’ గ్రీకు పదబంధం మూలాన్ని సూచించడంతో పాటు వ్యక్తిగత సమీపం అనే భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: ఎవరైనా ... చూశారని కాదు
  rationale: ముందటి మాటను కారణంగా చెప్పకుండా, దానిపై అపార్థం రాకుండా వివరణాత్మక పరిమితిని సూచిస్తుంది.
- source_word: τὸν πατέρα
  choice: తండ్రిని
  rationale: యోహాను రచనలో దేవునికి వాడే ప్రామాణిక సంబంధపదం; తెలుగులో సందర్భమే దైవసూచనను స్పష్టం చేస్తుంది.
- source_word: ἑώρακέν τις
  choice: ఎవరైనా ... చూశారని
  rationale: నిషేధ సందర్భంలో τις భావాన్ని ‘ఎవరైనా’ సహజంగా వ్యక్తం చేస్తుంది; క్రియ యొక్క పరిపూర్ణ కాలం పూర్తయిన దర్శనాన్ని ప్రస్తుత ప్రాముఖ్యతతో సూచిస్తుంది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: ఇక్కడ షరతును కాక మినహాయింపును సూచిస్తుంది.
- source_word: ὁ ὢν
  choice: వచ్చినవాడు
  rationale: పదశః ‘ఉన్నవాడు’ అయినా, παρά + షష్ఠీ విభక్తితో కలిపి మూలం/సన్నిధి నుండి రావడం అనే సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: παρὰ τοῦ θεοῦ
  choice: దేవుని దగ్గరనుండి
  rationale: παρά యొక్క మూలం అనే భావంతో పాటు వ్యక్తిగత సమీపం లేదా సన్నిధి అనే సూక్ష్మభావాన్ని కూడా తెలుగు ‘దగ్గరనుండి’ నిలుపుతుంది.
- source_word: οὗτος
  choice: ఆయనే
  rationale: ముందు పేర్కొన్న వ్యక్తినే బలంగా తిరిగి సూచించే గ్రీకు సర్వనామ ఉద్ఘాటనను వ్యక్తం చేస్తుంది.
- source_word: ἑώρακεν
  choice: చూశాడు
  rationale: తెలుగులో సహజమైన భూతకాల రూపం; సందర్భంలో దర్శనం పూర్తయినదన్న భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: παρὰ τοῦ θεοῦలో కుమారునికి దేవునితో ఉన్న సంబంధం
  choice: దేవుని దగ్గరనుండి వచ్చినవాడు
  alternative: దేవుని సన్నిధిలో ఉన్నవాడు / దేవునితో ఉన్నవాడు
  rationale: ప్రధాన పాఠం దైవ మూలాన్ని, వ్యక్తిగత సమీపాన్ని రెండింటినీ సూచిస్తుంది; అయితే ఆ సంబంధం గురించి వాక్యంలో ఉన్నదానికంటే అధికమైన తాత్త్విక వివరణను చేర్చదు. ప్రత్యామ్నాయ స్థానిక/సంబంధ భావాన్ని పాదటిప్పణి కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘ఆయనే’ ద్వారా οὗτος యొక్క ఉద్ఘాటనను నిలిపి, పాదటిప్పణి సూచిక [a]ను ప్రధాన పాఠంలో చేర్చాం.
