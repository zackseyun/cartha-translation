source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Φίλιππος· Διακοσίων δηναρίων ἄρτοι οὐκ ἀρκοῦσιν αὐτοῖς ἵνα ⸀ἕκαστος βραχύ ⸀τι λάβῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: te
  text: ఫిలిప్పు ఆయనకు జవాబిచ్చాడు, “ప్రతి ఒక్కరికీ కొంచెమైనా దొరికేలా రెండువందల దేనారాల విలువైన రొట్టెలు కూడా వీరికి చాలవు.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఒక దేనారం సాధారణంగా ఒక కూలి ఒక రోజు వేతనానికి సమానమైన రోమా వెండి నాణెం.
    reason: ‘దేనారం’ అనే చారిత్రక నాణెం విలువను ఆధునిక పాఠకులు అర్థం చేసుకోవడానికి సంక్షిప్త వివరణ ఇస్తుంది.
lexical_decisions:
- source_word: Διακοσίων δηναρίων
  choice: రెండువందల దేనారాల
  rationale: దేనారం అనే ప్రాచీన నాణెాన్ని మూలపాఠానికి దగ్గరగా లిప్యంతరీకరించి, మొత్తం విలువను సహజమైన తెలుగు సంబంధరూపంలో తెలిపింది.
- source_word: ἄρτοι
  choice: రొట్టెలు
  rationale: సందర్భంలో ఆహారంగా పంచే bread‌ను సాధారణ ఆధునిక తెలుగులో సహజంగా తెలిపే పదం.
- source_word: βραχύ τι
  choice: కొంచెమైనా
  rationale: ప్రతి వ్యక్తికి లభించే అతి స్వల్ప పరిమాణాన్ని, ఫిలిప్పు మాటలోని కొరత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα ... λάβῃ
  choice: దొరకాలంటే
  rationale: ఇక్కడ ἵνα వాక్యభాగం తగినంత రొట్టె ఉండటానికి అవసరమైన కనిష్ఠ ఫలితాన్ని సూచిస్తోంది; తెలుగు సందర్భంలో షరతు-ఫలిత భావంతో సహజంగా అందించింది.
theological_decisions:
- issue: ἵνα యొక్క ఉద్దేశ్య/ఫలిత సంబంధం
  choice: ప్రతి ఒక్కరికీ కొంచెమైనా దొరకాలంటే
  alternative: ప్రతి ఒక్కరూ కొంచెం తీసుకునేలా
  rationale: మూలంలోని సంబంధాన్ని అతిగా నిర్ధారించకుండా, రెండువందల దేనారాల రొట్టెలు కూడా కనిష్ఠ అవసరానికి చాలవనే ఫిలిప్పు అంచనాను స్పష్టంగా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవసూచకంగా “ఆయనకు” వాడి, సంభాషణను సరళంగా, గంభీరంగా ఉంచింది. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా సహజ తెలుగు వాక్యక్రమాన్ని ఉపయోగించింది.
