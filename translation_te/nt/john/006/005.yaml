id: JHN.6.5
reference: John 6:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: te
  text: అప్పుడు యేసు కళ్లను పైకెత్తి, పెద్ద జనసమూహం తనవైపు రావడం చూసి, ఫిలిప్పును, “వీరు తినడానికి మనం రొట్టెలు ఎక్కడ కొనాలి?” అని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπάρας ... τοὺς ὀφθαλμοὺς
  choice: కళ్లు పైకెత్తి
  rationale: కళ్లను పైకెత్తడం అనే గ్రీకు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὖν
  choice: అప్పుడు
  rationale: సందర్భంలో ఇది కథన పురోగతిని సూచిస్తుంది; తెలుగులో ‘అప్పుడు’ సహజంగా ఆ అనుసంధానాన్ని తెలియజేస్తుంది.
- source_word: θεασάμενος
  choice: చూసి
  rationale: యేసు జనసమూహం రావడాన్ని గమనించి చూసిన భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: πολὺς ὄχλος
  choice: పెద్ద జనసమూహం
  rationale: సమూహ పరిమాణాన్ని స్పష్టంగా తెలియజేస్తూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἔρχεται πρὸς αὐτόν
  choice: తనవైపు రావడం
  rationale: πρός యొక్క దిశార్థాన్ని ‘తనవైపు’ స్పష్టంగా నిలుపుతుంది; సందర్భానుసారంగా జరుగుతున్న చర్యగా వ్యక్తపరుస్తుంది.
- source_word: λέγει πρὸς Φίλιππον
  choice: ఫిలిప్పుతో ... అని అడిగాడు
  rationale: ప్రశхона రూపంలోని ప్రత్యక్ష వాక్యానికి తెలుగులో ‘అడిగాడు’ సహజం; చారిత్రక వర్తమానాన్ని కథన భూతకాలంలో అందిస్తుంది.
- source_word: Πόθεν ἀγοράσωμεν
  choice: మనం ... ఎక్కడ కొనాలి?
  rationale: Πόθεν అక్షరార్థంగా ‘ఎక్కడి నుంచి’ అయినా, కొనుగోలు స్థలం లేదా వనరు గురించి అడిగే ప్రశ్నకు ‘ఎక్కడ కొనాలి?’ సహజమైన తెలుగు సమానార్థకం.
- source_word: ἄρτους
  choice: రొట్టెలు
  rationale: బహువచన రూపాన్ని నిలుపుతూ, ఈ సందర్భంలోని వ్యక్తిగత రొట్టెల భావానికి సరిపోతుంది; ‘ఆహారం’ అని విస్తరించదు.
- source_word: ἵνα φάγωσιν οὗτοι
  choice: వీరు తినడానికి
  rationale: ἵνα యొక్క ప్రయోజన భావాన్ని సహజమైన తెలుగు ఉద్దేశార్థక నిర్మాణంతో అందిస్తుంది; οὗτοι యొక్క సమీప సూచనను ‘వీరు’ నిలుపుతుంది.
theological_decisions:
- issue: కథనంలోని చారిత్రక వర్తమానం మరియు కృదంతాల అనువాదం
  choice: కృదంత క్రమాన్ని ‘పైకెత్తి ... చూసి’గా ఉంచి, λέγειను ‘అడిగాడు’ అనే భూతకాలంగా అనువదించడం
  alternative: ‘యేసు కళ్లు పైకెత్తి ... చూసి ఫిలిప్పుతో అంటున్నాడు’ అనే మరింత రూపసామ్య అనువాదం
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు. గ్రీకు చర్యల క్రమాన్ని నిలుపుతూ, సహజ తెలుగు కథన శైలికి భూతకాలం అనుకూలంగా ఉంటుంది.
- issue: ప్రశ్నలో ఉద్దేశం లేదా అసాధ్యతను జోడించకపోవడం
  choice: ‘మనం రొట్టెలు ఎక్కడ కొనాలి?’
  alternative: ‘ఇంతమందికి రొట్టెలు మనం ఎక్కడి నుంచి తేగలం?’
  rationale: మూల వాక్యం కొనడం గురించి మాత్రమే అడుగుతుంది. సందర్భం సూచించే కష్టాన్ని లేదా అసాధ్యతను వచనంలో అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. మూలంలోని చర్యల క్రమం, దిశార్థం, ప్రశ్న యొక్క తెరచిన స్వభావం నిలుపబడ్డాయి.
