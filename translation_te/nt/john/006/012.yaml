id: JHN.6.12
reference: John 6:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: te
  text: వారు కడుపునిండా తిన్నప్పుడు[a], ఆయన తన శిష్యులతో, “మిగిలిపోయిన ముక్కలను[c] ఏదీ పోకుండా ఉండేలా పోగుచేయండి,” అని అన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారు తృప్తి చెందినప్పుడు,” లేదా “వారు తృప్తిగా తిన్నప్పుడు.”
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు మూలంలో ఇక్కడ చారిత్రక వర్తమాన కాలం ఉంది: “అంటున్నాడు.” తెలుగులో సహజమైన కథనం కోసం “అన్నాడు” అని అనువదించబడింది.'
    reason: lexical_alternative
  - marker: c
    text: లేదా “మిగిలిన ముక్కలను”; κλάσματα అనే గ్రీకు పదం విరిగిన ముక్కలను లేదా తునకలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐνεπλήσθησαν
  choice: వారు కడుపునిండా తిన్నప్పుడు
  rationale: భోజన సందర్భంలో ἐνεπλήσθησαν సూచించే ‘నిండడం/తృప్తి చెందడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; δέను విడిగా బలపరచకుండా కథన ప్రవాహంలో కలిపింది.
- source_word: λέγει
  choice: అని అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన కథన భూతకాలంతో అందించింది; మూలంలోని వర్తమాన రూపాన్ని పాదసూచికలో స్పష్టం చేసింది.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: తన శిష్యులతో
  rationale: μαθηταίకు సువార్తల సందర్భంలో ప్రమాణికమైన, నిర్దిష్టమైన తెలుగు పదం ‘శిష్యులు’; αὐτοῦ సంబంధాన్ని ‘తన’తో తెలిపింది.
- source_word: Συναγάγετε
  choice: పోగుచేయండి
  rationale: చెల్లాచెదురుగా ఉన్న ఆహారపు ముక్కలను ఒకచోట చేర్చాలనే ప్రత్యక్ష ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: మిగిలిపోయిన ముక్కలను
  rationale: περισσεύωలోని మిగులు భావాన్నీ, κλάσματαలోని ముక్కల భావాన్నీ స్పష్టంగా ఉంచుతుంది; సందర్భం వల్ల ఇవి రొట్టె ముక్కలని అర్థమవుతుంది కాబట్టి ‘విరిగిన’ అనే పదాన్ని అనవసరంగా జోడించలేదు.
- source_word: ἵνα μή τι ἀπόληται
  choice: ఏదీ పోకుండా చూడండి
  rationale: ప్రయోజనాన్ని సహజమైన తెలుగులో తెలిపి, ἀπόληται యొక్క ప్రాథమిక ‘పోవడం/నష్టపడడం’ భావాన్ని నిలుపుతుంది; ‘వృథా కాకుండా’ అనే సందర్భోచిత భావవ్యాఖ్యను ప్రధాన పాఠ్యంలో బలవంతంగా పెట్టలేదు.
theological_decisions:
- issue: సూచకకార్య సందర్భంలో ἀπόληταιకు రక్షణసంబంధమైన విస్తృతార్థం ఆపాదించే అవకాశం
  choice: తక్షణ సందర్భానికి తగినట్లు ‘ఏదీ పోకుండా’ అని అనువదించడం
  alternative: ‘ఏదీ వృథా కాకుండా’ లేదా ‘ఏదీ నశించకుండా’
  rationale: ఇక్కడ ప్రత్యక్ష సూచన మిగిలిన ఆహారపు ముక్కలకే. అయినా ‘వృథా’ అనే పూర్తిగా ప్రయోగాత్మక వ్యాఖ్యానానికి పరిమితం చేయకుండా, యోహాను రచనలో ఈ క్రియకు ఉండగల ప్రతిధ్వనిని ‘పోకుండా’ అనే విస్తృత పదంతో పాఠకునికి తెరిచి ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో రూపొందించబడింది. గ్రీకు చారిత్రక వర్తమానం ప్రధాన పాఠ్యంలో సహజ తెలుగు భూతకాలంగా మార్చి పాదసూచికలో సంరక్షించబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
