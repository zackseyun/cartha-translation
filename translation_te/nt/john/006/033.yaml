  text: ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: te
  text: ఎందుకంటే దేవుని రొట్టె అంటే పరలోకం నుండి దిగివచ్చే, లోకానికి జీవాన్ని ఇచ్చే వాడే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోకం నుండి దిగివచ్చి లోకానికి జీవాన్ని ఇచ్చేదే.” గ్రీకు వాక్యనిర్మాణాన్ని అవ్యక్తంగా కూడా గ్రహించవచ్చు; అయితే పుంలింగ కృదంతాలు వ్యక్తిగత సూచనకే ఎక్కువగా అనుకూలిస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρτος
  choice: రొట్టె
  rationale: ఈ ప్రసంగంలోని స్పష్టమైన ఆహార రూపకాన్ని నిలుపుతూ, సాధారణ ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే పదం.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: మూలంలోని సంబంధార్థక షష్ఠీ విభక్తిని సంక్షిప్తంగా నిలుపుతుంది; అది దేవునికి చెందినదా లేక దేవుని నుండి లభించేదా అన్న భావాన్ని సందర్భమే విప్పడానికి వీలు కల్పిస్తుంది.
- source_word: ὁ καταβαίνων
  choice: దిగివచ్చేవాడే
  rationale: పుంలింగ ఏకవచన సార్థక వర్తమాన కృదంతంలోని వ్యక్తిగత సూచనను నిలుపుతుంది; నిరంతర లేదా లక్షణాత్మక కార్యభావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: మూలం లేదా ఆరంభస్థానాన్ని సూచించే ἐκ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ζωὴν
  choice: జీవాన్ని
  rationale: యోహాను రచనలోని కీలకమైన పదాన్ని విస్తరించకుండా దాని సరళమైన, బరువైన రూపంలో ఉంచుతుంది.
- source_word: διδοὺς
  choice: ఇచ్చే
  rationale: καταβαίνωνతో సమన్వయంగా ఉన్న వర్తమాన కృదంతాన్ని లక్షణాత్మక కార్యంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῷ κόσμῳ
  choice: లోకానికి
  rationale: κόσμος యొక్క విస్తృత యోహానీయ భావాన్ని నిలుపుతూ, దానిని ‘మానవాళి’ లేదా ‘అందరు మనుషులు’ అని సంకుచితం చేయదు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యానికి ఇది ఇచ్చే వివరణాత్మక ఆధార సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: ‘దేవుని రొట్టె ... ὁ καταβαίνων ... καὶ ζωὴν διδοὺς’లో వ్యక్తిగత సూచనా, అవ్యక్త సూచనా
  choice: ‘పరలోకం నుండి దిగివచ్చి లోకానికి జీవాన్ని ఇచ్చేవాడే’ అనే వ్యక్తిగత భాషను ఉపయోగించడం.
  alternative: ‘పరలోకం నుండి దిగివచ్చి లోకానికి జీవాన్ని ఇచ్చేదే.’
  rationale: ἄρτος భావపరంగా వస్తువును సూచించినప్పటికీ, గ్రీకులోని పుంలింగ ఏకవచన కృదంతాలు వ్యక్తిని సహజంగా సూచిస్తాయి. ఇది యేసు తనను తాను రొట్టెగా గుర్తించబోయే సందర్భాన్ని ముందుగానే సూచిస్తుంది; అయితే అనువాదం వ్యాకరణం, సందర్భం దాటిన సిద్ధాంత వివరణను జోడించదు.
- issue: κόσμος యొక్క పరిధి
  choice: ‘లోకం’ అనే విస్తృత పదాన్ని నిలుపడం.
  alternative: ‘మానవాళి’ లేదా ‘అందరు మనుషులు.’
  rationale: జీవాన్ని ఇచ్చే కార్యపు విస్తృతిని మూలవాక్యం తెలిపిన విధంగానే ఉంచి, దాని పరిధి లేదా అన్వయంపై తరువాతి సిద్ధాంత చర్చలను ఇక్కడే తీర్చివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. ‘రొట్టె,’ ‘జీవం,’ ‘లోకం’ వంటి యోహానీయ కీలక పదాలు స్థిరంగా నిలుపబడ్డాయి.
