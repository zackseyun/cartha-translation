id: JHN.6.20
reference: John 6:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐτοῖς· Ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/020.yaml
  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: te
  text: అయితే ఆయన వారితో, “నేనే[a]; భయపడకండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “నేను ఉన్నాను.” యోహాను సువార్తలో ఈ మాట సాధారణ స్వీయ-గుర్తింపుగా పనిచేయవచ్చు; అలాగే విస్తృతమైన ధార్మిక భావాలను కూడా ప్రతిధ్వనింపజేయవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ
  choice: అయితే ఆయన
  rationale: δέ ఇక్కడ కథనంలో స్వల్ప మలుపు లేదా వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ దానిని సహజంగా తెలియజేస్తుంది. ὁ సర్వనామ విధిలో యేసును సూచిస్తున్నందున ‘ఆయన’ అని అనువదించబడింది.
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, ఆధునిక తెలుగు కథనశైలిలో భూతకాల రూపమైన ‘అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: αὐτοῖς
  choice: వారితో
  rationale: దత్తివ బహువచన సర్వనామాన్ని సందర్భానుసారంగా ‘వారితో’ అని అనువదించడం సహజం; అది ఎవరిని సూచిస్తుందో పూర్వసందర్భం తెలియజేస్తుంది.
- source_word: Ἐγώ εἰμι
  choice: నేనే
  rationale: తక్షణ సందర్భంలో యేసు భయపడుతున్న శిష్యులకు తనను తాను గుర్తుచేస్తున్నాడు. ‘నేనే’ సహజమైన తెలుగు స్వీయ-గుర్తింపు; అదే సమయంలో గ్రీకు పదబంధంలోని ‘నేను ఉన్నాను’ అనే మరింత అక్షరార్థ అవకాశాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: μὴ φοβεῖσθε
  choice: భయపడకండి
  rationale: μήతో కూడిన ఆజ్ఞార్థక రూపం నిషేధాన్ని వ్యక్తం చేస్తుంది. ‘భయపడకండి’ ఆధునిక తెలుగులో సహజమైన, గౌరవ బహువచన రూపం.
theological_decisions:
- issue: Ἐγώ εἰμι సాధారణ స్వీయ-గుర్తింపుగా అనువదించాలా, లేక ‘నేను ఉన్నాను’ అనే అక్షరార్థంతో యోహాను సువార్తలోని సాధ్యమైన ధార్మిక ప్రతిధ్వనిని ప్రధాన పాఠ్యంలో చూపాలా
  choice: 'ప్రధాన పాఠ్యం: ‘నేనే’'
  alternative: ‘నేను ఉన్నాను’ లేదా ‘నేను ఆయననే’
  rationale: ఈ సందర్భంలో యేసు శిష్యులకు తనను గుర్తుచేసి ధైర్యం చెబుతున్నాడు; అందువల్ల ‘నేనే’ తక్షణ కథనార్థాన్ని సహజంగా అందిస్తుంది. అయినా Ἐγώ εἰμι పదబంధానికి యోహాను సువార్తలో విస్తృత ధార్మిక ప్రతిధ్వని ఉండవచ్చు కాబట్టి, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి ఆ ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. సంభాషణలో బహువచన శ్రోతలకు తగిన ‘భయపడకండి’ రూపాన్ని ఉపయోగించాం; Ἐγώ εἰμι యొక్క సందర్భార్థం ప్రధాన పాఠ్యంలోను, సాధ్యమైన లోతైన ప్రతిధ్వని పాదసూచికలోను నిలుపబడింది.
