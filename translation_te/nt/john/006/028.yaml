  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: te
  text: 'అప్పుడు వారు ఆయనతో ఇలా అన్నారు: “దేవుని కార్యాలు చేయడానికి మేము ఏమి చేయాలి?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: అన్నారు
  rationale: λέγω యొక్క భూతకాల కథనరూపాన్ని సాధారణ సంభాషణ క్రియగా అనువదిస్తుంది. ప్రశ్నార్థక ప్రత్యక్ష వాక్యం ఉన్నందున తెలుగులో ‘అన్నారు’ సహజంగా ఉంటుంది; ‘అడిగారు’ అని పెడితే మూలంలోని సాధారణ ‘చెప్పారు’ అనే క్రియను మరింత నిర్దిష్టం చేసినట్లవుతుంది.
- source_word: οὖν
  choice: అప్పుడు
  rationale: మునుపటి సంభాషణతో కథన కొనసాగింపును సహజంగా సూచిస్తుంది; ‘కాబట్టి’ అనేది తార్కిక నిర్ధారణ భావాన్ని అవసరానికి మించి బలపరచవచ్చు.
- source_word: πρὸς αὐτόν
  choice: ఆయనతో
  rationale: మాట్లాడే క్రియతో కూడిన πρός + ద్వితీయా విభక్తి సంబోధించబడిన వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆయనతో ... అన్నారు’ సహజమైన నిర్మాణం.
- source_word: Τί ποιῶμεν
  choice: మేము ఏమి చేయాలి?
  rationale: వర్తమాన సంభావనార్థక క్రియతో ఉన్న ఈ ఆలోచనాత్మక ప్రశ్న చేయవలసిన పనిని అడుగుతుంది. ‘ఏమి చేయాలి?’ అవసరతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα
  choice: చేయడానికి
  rationale: తెలుగు క్రియార్థక నిర్మాణం గ్రీకులోని ఉద్దేశ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐργαζώμεθα τὰ ἔργα
  choice: కార్యాలు చేయడానికి
  rationale: ἐργάζομαι–ἔργα మధ్యనున్న పదబంధ సంబంధాన్ని తెలుగులో పూర్తిగా పునరావృతం చేయడం అసహజం. ‘కార్యాలు చేయడం’ పని/కార్యం అనే భావసంబంధాన్ని నిలిపి, సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: సంబంధార్థక రూపాన్ని వ్యాఖ్యానించకుండా ఉంచుతుంది; అది దేవునికి చెందిన కార్యాలా, దేవుడు కోరే కార్యాలా, లేక దేవుని నుండి వచ్చే కార్యాలా అన్న అంశాన్ని ప్రధాన పాఠం తేల్చదు.
theological_decisions:
- issue: τὰ ἔργα τοῦ θεοῦ లోని సంబంధార్థక విభక్తి భావం
  choice: ప్రధాన పాఠంలో ‘దేవుని కార్యాలు’ అని అర్థాన్ని తెరిచి ఉంచడం
  alternative: ‘దేవుడు కోరే కార్యాలు’ లేదా ‘దేవుడు చేసే కార్యాలు’
  rationale: గ్రీకు సంబంధార్థక నిర్మాణం అనేక భావాలకు అవకాశం ఇస్తుంది; తరువాతి వచనం ఈ భాషను ఉద్దేశపూర్వకంగా మలుస్తుంది. అందువల్ల ప్రధాన పాఠంలో ఒక్క వ్యాఖ్యానాన్ని నిర్ణయించడం సముచితం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన సంభాషణ శైలి వాడబడింది. ‘దేవుని కార్యాలు’ అనే రూపం మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
