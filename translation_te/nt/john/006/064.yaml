id: JHN.6.64
reference: John 6:64
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: te
  text: అయితే మీలో కొందరు నమ్మడం లేదు. ఎందుకంటే నమ్మనివారు ఎవరో, తనను అప్పగించబోయేవాడు ఎవరో యేసుకు మొదటి నుంచే తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తనకు ద్రోహం చేయబోయేవాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందటి మాటతో ఉన్న వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἐξ ὑμῶν τινες
  choice: మీలో కొందరు
  rationale: సంబోధించబడుతున్న సమూహంలోనే కొందరని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: οἳ οὐ πιστεύουσιν
  choice: నమ్మడం లేదు
  rationale: వర్తమానకాలంలో కొనసాగుతున్న అవిశ్వాసాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ᾔδει
  choice: తెలుసు
  rationale: οἶδα యొక్క గతస్థితి భావాన్ని సందర్భానుసారంగా ‘మొదటి నుంచే’తో కలిపి తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; యేసుకు అప్పటికే తెలిసి ఉందనే భావం నిలుస్తుంది.
- source_word: ἐξ ἀρχῆς
  choice: మొదటి నుంచే
  rationale: ‘ఆరంభం’ ఏమిటో అదనంగా నిర్ణయించకుండా మూలంలోని కాలసూచనను కాపాడుతుంది.
- source_word: οἱ μὴ πιστεύοντες
  choice: నమ్మనివారు
  rationale: నమ్మకపోవడం ద్వారా గుర్తించబడే వర్గాన్ని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: παραδώσων αὐτόν
  choice: తనను అప్పగించబోయేవాడు
  rationale: భవిష్యత్ కృదంతపు భావాన్ని నిలుపుతూ παραδίδωμι యొక్క ప్రాథమిక ‘అప్పగించు’ అర్థాన్ని కాపాడుతుంది; సందర్భంలోని ద్రోహభావాన్ని పాదసూచిక తెలియజేస్తుంది.
theological_decisions:
- issue: యోహాను సందర్భంలో πιστεύω అనువాదం
  choice: నమ్ము
  alternative: విశ్వసించు / నమ్మకముంచు
  rationale: ‘నమ్ము’ సాధారణ ఆధునిక తెలుగులో జ్ఞానాత్మక మరియు సంబంధాత్మక భావాలు రెండింటినీ మోయగలదు; పదార్థాన్ని అనవసరంగా సంకుచితం చేయదు.
- issue: యూదా చర్యకు సంబంధించిన παραδίδωμι అనువాదం
  choice: అప్పగించు
  alternative: ద్రోహం చేయు
  rationale: మూలపదంలోని నిజమైన పదార్థాన్ని ప్రధాన వాక్యంలో నిలుపుతుంది. సందర్భంలో ఇది ద్రోహపూర్వక అప్పగింత అయినప్పటికీ, ‘ద్రోహం చేయు’ అని మాత్రమే అనువదిస్తే ‘అప్పగించడం’ అనే చర్య మరుగునపడుతుంది; సందర్భార్థాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, కానీ మూలంలోని ‘మొదటి నుంచే’ అనే అస్పష్ట కాలసూచనను అలాగే ఉంచాం. ప్రధాన పాఠ్యంలో ప్రతి పాదసూచిక గుర్తు చేర్చబడింది.
