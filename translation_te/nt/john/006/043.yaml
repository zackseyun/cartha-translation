base_translation:
  language: en
  yaml_path: translation/nt/john/006/043.yaml
  text: Jesus answered and said to them[b][a], “Do not grumble among yourselves.”
translation:
  language: te
  text: 'యేసు వారికి జవాబిచ్చి ఇలా అన్నాడు: “మీరు ఒకరితో ఒకరు సణుగుకోవద్దు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ మధ్య సణుగుకోవద్దు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: జవాబిచ్చాడు
  rationale: గ్రీకు భాషలోని ‘జవాబిచ్చి చెప్పాడు’ అనే కథన సూత్రాన్ని తెలుగులో సహజంగా ఒకే క్రియతో వ్యక్తం చేశాం; సందర్భానికి ప్రతిస్పందనగా పలికాడనే భావం నిలుస్తుంది.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: Μὴ γογγύζετε
  choice: సణుగుకోవద్దు
  rationale: వర్తమాన ఆజ్ఞార్థక రూపం కొనసాగుతున్న చర్యను ఆపమని లేదా సాధారణంగా దానిని నిషేధించవచ్చు. ‘సణుగుకోవద్దు’ అసంతృప్తితో గొణుగుతూ మాట్లాడే γογγύζω భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘ఇక సణగడం ఆపండి’ అని అనువదించి కొనసాగుతున్న చర్య అనే భావానికే పరిమితం చేయలేదు.
- source_word: μετ’ ἀλλήλων
  choice: మీ మధ్య మీరు
  rationale: గుంపులోని వారు పరస్పరం చేసుకుంటున్న చర్యను ఈ సహజ తెలుగు ప్రయోగం స్పష్టంగా తెలియజేస్తుంది.
