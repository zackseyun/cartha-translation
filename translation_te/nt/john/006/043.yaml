translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘సణుగు’ అనే పదం అసంతృప్తితో గొణిగే భావాన్ని కలిగి ఉండి, సందర్భంలోని బైబిలు ప్రతిధ్వనిని సాధ్యమైనంతగా నిలుపుతుంది.
