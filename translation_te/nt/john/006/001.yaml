id: JHN.6.1
reference: John 6:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
translation:
  language: te
  text: ఈ సంగతుల తరువాత, యేసు గలిలయ సముద్రానికి అవతలి ఒడ్డుకు వెళ్లాడు; దానినే తిబెరియ సముద్రమని కూడా పిలుస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గలిలయ సముద్రం’నే ‘తిబెరియ సముద్రం’ అని కూడా పిలిచేవారు. ఇక్కడ రెండు పేర్లూ ఒకే జలాశయాన్ని సూచిస్తున్నాయి.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ఈ సంగతుల తరువాత
  rationale: గ్రీకు బహువచన సూచనను నిలుపుతూ, యోహాను ఉపయోగించే కథన సంధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లాడు
  rationale: సందర్భంలో అవతలి ఒడ్డుకు ప్రయాణించడమే ప్రధాన భావం. తెలుగులో ‘వెళ్లిపోయాడు’ అనవసరంగా విడిచిపోవడం అనే ఛాయను కలిగించవచ్చు.
- source_word: πέραν
  choice: అవతలి ఒడ్డుకు
  rationale: జలాశయాన్ని దాటి ఎదుటి వైపుకు వెళ్లడాన్ని తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῆς θαλάσσης
  choice: సముద్రానికి
  rationale: ఇది భౌగోళికంగా సరస్సైనా, θάλασσα అనే మూలపదాన్నీ స్థిరంగా వాడుకలో ఉన్న ‘గలిలయ సముద్రం’ పేరునీ కాపాడుతుంది.
- source_word: τῆς Γαλιλαίας
  choice: గలిలయ
  rationale: ప్రాంతనామంతో జలాశయాన్ని గుర్తించే గ్రీకు సంబంధార్థక నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: τῆς Τιβεριάδος
  choice: దానినే తిబెరియా సముద్రమని కూడా పిలుస్తారు
  rationale: ఒకే జలాశయానికి జోడించిన రెండవ గుర్తింపు పేరని స్పష్టంచేస్తూ, గ్రీకు ద్వంద్వ సంబంధార్థక నిర్మాణాన్ని తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గౌరవప్రదమైన వచనశైలి పాటించబడింది. గ్రీకు వాక్యంలోని భావసంబంధాన్ని సహజంగా చూపడానికి చివరి ద్వంద్వ నామకరణం వివరణాత్మకంగా అనువదించబడింది.
