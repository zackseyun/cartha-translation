id: JHN.6.19
reference: John 6:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: te
  text: కాబట్టి వారు దాదాపు ఇరవై ఐదు లేదా ముప్పై స్టేడియాలు[a] తెడ్లు వేసి వెళ్లిన తర్వాత, యేసు సముద్రం మీద నడుస్తూ పడవ దగ్గరకు రావడం చూశారు[b]. అప్పుడు వారు భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: స్టేడియం అనేది ప్రాచీన దూరపు కొలమానం. ఇరవై ఐదు లేదా ముప్పై స్టేడియాలు అంటే సుమారు ఐదు నుండి ఆరు కిలోమీటర్లు.
    reason: cultural_note
  - marker: b
    text: ‘నీటి మీద నడుస్తూ’ అని కూడా అనువదించవచ్చు. గ్రీకులో అక్షరార్థంగా ‘సముద్రం మీద నడుస్తూ’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐληλακότες
  choice: తెడ్లు వేసుకుంటూ వెళ్లిన తర్వాత
  rationale: ἐλαύνω అనే పదం ఇక్కడ నావ ప్రయాణ సందర్భంలో పడవను తెడ్లతో నడపడాన్ని సూచిస్తుంది. సంపూర్ణ కృదంతం ప్రధాన క్రియకు ముందే జరిగిన చర్యను తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాక్యంలోని పరిస్థితితో సంబంధాన్ని, కథన పురోగతిని నిలుపుతుంది.
- source_word: ὡς
  choice: దాదాపు
  rationale: దూరపు కొలత సుమారుగా చెప్పబడిందని స్పష్టంగా తెలియజేస్తుంది.
- source_word: σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: ఇరవై ఐదు లేదా ముప్పై స్టేడియాలు
  rationale: మూలంలోని ప్రాచీన కొలమానాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ఆధునిక సమాన దూరాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: θεωροῦσιν
  choice: చూశారు
  rationale: ఈ కథన సందర్భంలో సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణ; ప్రత్యక్షంగా గమనించడాన్ని తగినంతగా తెలియజేస్తుంది.
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: సముద్రం మీద నడుస్తూ
  rationale: θάλασσα అనే మూలపదాన్ని ‘సముద్రం’గా, ἐπίని దాని మీద నడవడంగా నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: పడవకు దగ్గరగా రావడం
  rationale: γίνομαι మరియు ἐγγύς కలయిక స్థిరంగా దగ్గర ఉండడంకన్నా దగ్గరకు చేరే కదలికను సూచిస్తుంది.
- source_word: πλοίου
  choice: పడవ
  rationale: గలిలయ సముద్రపు ఈ సందర్భంలో ‘ఓడ’కన్నా ‘పడవ’ సహజంగాను సందర్భోచితంగాను ఉంటుంది.
- source_word: ἐφοβήθησαν
  choice: వారు భయపడ్డారు
  rationale: వారు చూసిన దానికి కలిగిన భయ ప్రతిస్పందనను సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అద్భుత వర్ణనలోని ప్రత్యక్ష భావాన్ని తగ్గించకుండా అనువదించడం
  choice: సముద్రం మీద నడుస్తూ
  alternative: నీటి మీద నడుస్తూ; సముద్రం ఒడ్డున నడుస్తూ
  rationale: గ్రీకు పాఠ్యంలో θάλασσα ‘సముద్రం’ అని ఉంది; సందర్భం ప్రకారం ἐπί ఆయన సముద్రం మీద నడుస్తున్నట్లు సూచిస్తుంది. ‘ఒడ్డున’ అనడం సందర్భానికీ మూలార్థానికీ సరిపోదు; ‘నీటి మీద’ భావపరంగా సరైనదైనా మూలంలోని ‘సముద్రం’ను మార్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ప్రాచీన కొలమానాన్ని పాఠ్యంలో ఉంచి దాని ఆధునిక సమానాన్ని పాదసూచికలో వివరించాం; మూలంలోని ‘సముద్రం’ అనే పదాన్ని నిలిపాం.
