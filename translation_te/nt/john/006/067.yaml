revisions:
- from: అప్పుడు యేసు పన్నెండుగురితో, “మీరు కూడా వెళ్లిపోవాలని అనుకోవడం లేదు కదా?” అని అడిగాడు.[a]
  to: కాబట్టి యేసు పన్నెండుగురితో, “మీరు కూడా వెళ్లిపోవడం మీకు ఇష్టం లేదు కదా?” అన్నాడు.[a]
  rationale: The revision more closely reflects the connective force of οὖν, the volitional sense of θέλετε, and the wording εἶπεν, while preserving the negative-question nuance marked by μή and the established designation ‘the Twelve.’
  reviewer_model: gpt-5.6-terra
