id: JHN.6.67
reference: John 6:67
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς τοῖς δώδεκα· Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: te
  text: కాబట్టి యేసు పన్నెండుగురితో, “మీరు కూడా వెళ్లిపోవడం మీకు ఇష్టం లేదు కదా?” అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు కూడా వెళ్లిపోవాలని అనుకుంటున్నారా?” గ్రీకులో ఈ ప్రశ్న μή అనే పదంతో మొదలవుతుంది; అది సాధారణంగా ‘లేదు’ అనే జవాబును ఆశిస్తుంది.
    reason: ప్రశ్నలోని గ్రీకు μή భావాన్ని మరియు మరింత తటస్థమైన అనువాద ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: ముందటి సందర్భంలో అనేకమంది శిష్యులు వెళ్లిపోయిన దానికి కొనసాగింపుగా యేసు పలికిన మాటను సహజమైన తెలుగు కథనశైలిలో సూచిస్తుంది.
- source_word: τοῖς δώδεκα
  choice: పన్నెండుగురితో
  rationale: యేసు అంతరంగ శిష్యబృందానికి స్థిరమైన హోదాగా ఉన్న ‘పన్నెండుగురు’ అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: Μὴ καὶ ὑμεῖς
  choice: మీరు కూడా ... లేదు కదా?
  rationale: μήతో మొదలయ్యే ప్రశ్న సాధారణంగా ‘లేదు’ అనే జవాబును ఆశిస్తుంది; καί మరియు ఉద్ఘాటిత ὑμεῖςను ‘మీరు కూడా’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: θέλετε
  choice: అనుకోవడం
  rationale: ఈ సందర్భంలో కోరిక లేదా మనసును తెలియజేస్తుంది; ఆధునిక తెలుగులో ప్రశ్నకు సహజంగా సరిపోతుంది.
- source_word: ὑπάγειν
  choice: వెళ్లిపోవాలని
  rationale: యేసు దగ్గరనుంచి దూరమవుతున్న ముందటి శిష్యుల చర్యను సూచిస్తూ, క్రియలోని వెళ్లిపోవడం అనే భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: μήతో ప్రవేశపెట్టబడిన యేసు ప్రశ్న యొక్క భావబలం
  choice: ‘లేదు’ అనే జవాబును ఆశిస్తున్నట్లు సూచించే ‘లేదు కదా?’ రూపం
  alternative: ‘మీరు కూడా వెళ్లిపోవాలని అనుకుంటున్నారా?’ అనే తటస్థ ప్రశ్న
  rationale: గ్రీకు μή సాధారణంగా ప్రతికూల జవాబును ఆశించే ప్రశ్నను సూచిస్తుంది. అయితే అది ఖచ్చిత ప్రకటన కాదు కాబట్టి ప్రశ్నారూపాన్నే నిలిపి, భావంలోని ఉద్రిక్తతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి. ‘పన్నెండుగురు’ను గుర్తింపు పొందిన శిష్యబృంద హోదాగా వాడాం.
