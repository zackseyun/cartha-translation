review_pass:
  verdict: revise
  source_fidelity: The negative question and its expected negative response are conveyed well. However, οὖν is better represented here by «కాబట్టి» than the merely temporal «అప్పుడు», and θέλετε is more directly rendered by «ఇష్టం»/«కోరుకోవడం» than by «అనుకోవడం», which can mean ‘think.’ The Greek says Jesus ‘said’ this question; «అన్నాడు» retains that wording naturally.
  naturalness: The revised wording is modern, idiomatic Telugu and retains the direct, gently challenging force of the question.
  terminology: «పన్నెండుగురు» appropriately preserves the recognized designation τοῖς δώδεκα. «వెళ్లిపోవడం» fits ὑπάγειν in the immediate context without adding a doctrinal interpretation.
  issues:
  - severity: medium
    issue: «అప్పుడు» for οὖν
    rationale: «అప్పుడు» primarily marks temporal sequence (‘then’), while οὖν here marks the inference/continuation arising from many disciples leaving. «కాబట్టి» more clearly preserves this connection.
  - severity: medium
    issue: «అనుకోవడం లేదు» for θέλετε
    rationale: «అనుకోవడం» can suggest thinking or considering rather than wanting. «ఇష్టం లేదు» naturally and directly conveys the volitional sense of θέλετε in this negative question.
  - severity: low
    issue: «అడిగాడు» for εἶπεν
    rationale: The question itself makes «అడిగాడు» understandable, but εἶπεν is ‘said.’ «అన్నాడు» preserves the source verb while remaining natural Telugu.
  revised_text: కాబట్టి యేసు పన్నెండుగురితో, “మీరు కూడా వెళ్లిపోవడం మీకు ఇష్టం లేదు కదా?” అన్నాడు.[a]
