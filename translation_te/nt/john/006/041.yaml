id: JHN.6.41
reference: John 6:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: te
  text: అప్పుడు యూదులు[a] ఆయనను గురించి సణుగుతూ ఉన్నారు; ఎందుకంటే ఆయన, “పరలోకం నుండి దిగివచ్చిన రొట్టె నేనే” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదయ నివాసులు”; కొన్ని సందర్భాల్లో “యూదు నాయకులు.” యోహాను సువార్తలో “యూదులు” అనే పదం యూదు ప్రజలందరినీ కాకుండా, యేసును వ్యతిరేకించిన ఒక నిర్దిష్ట గుంపును సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: సణుగుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగుతున్న ఫిర్యాదును సూచిస్తుంది. ‘సణుగుతూ ఉన్నారు’ అనేది గోగ్గుజోలోని లోలోపల అసంతృప్తిగా మాట్లాడే భావాన్ని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి మాటకు ప్రతిస్పందనగా ఏర్పడిన కథనపరమైన, కారణ-ఫలిత సంబంధాన్ని చూపిస్తుంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదబంధానికి నేరమైన సమానార్థకం. ఈ వచనం స్వయంగా వారిని నాయకులుగా గానీ యూదయ ప్రాంతస్థులుగా గానీ పరిమితం చేయదు; సందర్భంలో ఇది యూదులందరినీ కాక యేసును వ్యతిరేకించిన ఒక నిర్దిష్ట గుంపును సూచించవచ్చని పాదటిప్పణి వివరిస్తుంది.
- source_word: περὶ αὐτοῦ
  choice: ఆయనను గురించి
  rationale: περί + షష్ఠీ విభక్తి యొక్క సాధారణ అర్థమైన ‘గురించి’ను నిలుపుతుంది; ‘ఆయనకు వ్యతిరేకంగా’ అని అనువదిస్తే ఉపసర్గలో లేని భావాన్ని అధికంగా చేర్చినట్లవుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: వారి సణుగుడుకు కారణాన్ని పరిచయం చేస్తుంది; కేవలం ఉటంకించిన విషయాన్ని సూచించడంకన్నా ఇక్కడ కారణార్థం సందర్భానికి సరిపోతుంది.
- source_word: εἶπεν
  choice: చెప్పాడు
  rationale: గ్రీకు ఏఒరిస్ట్ సూచించే గత సంఘటనను సహజ తెలుగు సాధారణ భూతకాలంతో అందిస్తుంది.
- source_word: Ἐγώ εἰμι
  choice: నేనే
  rationale: గ్రీకులో స్పష్టంగా ఉన్న ἐγώ ఇచ్చే కర్తృప్రాధాన్యాన్ని తెలుగు ‘నేనే’ సహజంగా నిలుపుతుంది; ఇది వాక్యంలో ఆహారంతో స్వీయ గుర్తింపును వ్యక్తం చేస్తుంది.
- source_word: ὁ ἄρτος
  choice: ఆహారం
  rationale: ἄρτοςకు ప్రాథమికంగా ‘రొట్టె’ అనే అర్థం ఉన్నా, తెలుగు పాఠకులకు యేసు తనను ఒక ప్రత్యేకమైన జీవనపోషక ఆహారంగా చెప్పుకుంటున్న రూపకాన్ని సహజంగా అందించేందుకు ‘ఆహారం’ ఎంచుకోబడింది.
- source_word: ὁ καταβὰς
  choice: దిగివచ్చిన
  rationale: ఆహారాన్ని విశేషించే ఏఒరిస్ట్ కృదంతాన్ని సంక్షిప్తమైన తెలుగు విశేషణ కృదంతంగా అందిస్తుంది; పూర్తైన దిగివచ్చే చర్యను నిలుపుతుంది.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: మూలం లేదా ఆరంభస్థానాన్ని సూచించే ἐκను ‘నుండి’తో, ఈ ధార్మిక సందర్భంలోని οὐρανόςను సహజమైన ‘పరలోకం’తో అందిస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι పదబంధపు సూచన
  choice: ప్రధాన పాఠ్యంలో ‘యూదులు’
  alternative: ‘యూదయవారు’ లేదా ‘యూదు నాయకులు’
  rationale: ఈ వచనం సూచించే గుంపును మూలపాఠ్యం కంటే ఎక్కువగా సంకుచితం చేయకుండా నేరమైన రూపాన్ని నిలిపాం. అయితే దీనిని యూదు ప్రజలందరిపై సాధారణ నిందగా చదవకూడదని పాదటిప్పణి స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవసూచక ఏకవచనం (‘ఆయన’) ఉపయోగించబడింది. వాక్య నిర్మాణం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా రెండు వాక్యాలుగా అమర్చబడింది; మూలంలోని కొనసాగుతున్న సణుగుడు, కారణ సంబంధం, ‘నేనే’ అనే ఉద్ఘాటన నిలుపబడ్డాయి.
