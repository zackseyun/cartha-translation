review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys universal inability, coming to Jesus, the Father's necessary action, and Jesus' promise of resurrection on the last day. However, “తనవైపు ఆకర్షిస్తే” explicitly directs the drawing toward the Father (“toward himself”), whereas the Greek verb has no expressed directional object; in the immediate construction, coming is “to me.” This added directional specification should be removed.
  naturalness: The Telugu is generally clear and modern. “ఎవరూ నా దగ్గరికి రాలేరు” and “చివరి రోజున లేపుతాను” are natural. Removing “తనవైపు” also makes the conditional smoother and avoids an unnecessary interpretive clarification.
  terminology: “తండ్రి,” “ఆకర్షించు,” and “లేపుతాను” appropriately preserve the passage's register and key terms. “ఆకర్షిస్తే” is a suitable main-text rendering of ἑλκύσῃ, with stronger alternatives retained in a footnote. The representative masculine singular is preserved with “అతణ్ణి,” and its general application is properly explained.
  issues:
  - severity: medium
    issue: The phrase “తనవైపు ఆకర్షిస్తే” adds a direction toward the Father.
    rationale: ἑλκύσῃ αὐτόν means “draws him” and does not state “toward himself.” Since the result clause says people come “to me,” adding “toward himself” can blur or alter the stated relation and exceeds the Greek wording.
  - severity: low
    issue: Footnote anchors are placed together after the final sentence rather than at their respective words.
    rationale: Footnote a concerns “ఆకర్షిస్తే,” and footnote b concerns “అతణ్ణి.” Anchoring each note at the relevant expression improves clarity and accurately identifies what is being qualified.
  revised_text: నన్ను పంపిన తండ్రి అతణ్ణి[b] ఆకర్షిస్తేనే[a] తప్ప, ఎవరూ నా దగ్గరికి రాలేరు. నేను అతణ్ణి చివరి రోజున లేపుతాను.
