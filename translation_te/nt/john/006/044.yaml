id: JHN.6.44
reference: John 6:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: te
  text: నన్ను పంపిన తండ్రి అతణ్ణి[b] ఆకర్షిస్తేనే[a] తప్ప, ఎవరూ నా దగ్గరికి రాలేరు. నేను అతణ్ణి చివరి రోజున లేపుతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతణ్ణి లాగితే,” “అతణ్ణి ఈడ్చితే.” గ్రీకు క్రియకు బలంగా లాగడం లేదా ఈడ్చడం అనే భావం కూడా ఉండవచ్చు. తండ్రి ఒక వ్యక్తిని కుమారుని దగ్గరకు ఎలా తీసుకొస్తాడనే విషయంపై ప్రత్యేక వేదాంత వివరణను నిర్బంధంగా రుద్దకుండా ఉండేందుకు ప్రధాన పాఠ్యంలో “ఆకర్షిస్తే” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “అతణ్ణి” అని పుంలింగ ఏకవచనంలో ఉంది; ఇక్కడ అది ప్రతినిధ్య భావంతో వాడబడింది. ఈ మాట పురుషులకు మాత్రమే కాక, సాధారణంగా ప్రతి వ్యక్తికీ వర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δύναται ἐλθεῖν πρός με
  choice: ఎవరూ నా దగ్గరికి రాలేరు
  rationale: సార్వత్రిక నిరాకరణను, సామర్థ్యలేమిని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; యోహాను సువార్తలోని ‘నా దగ్గరికి రావడం’ అనే రూపకాన్ని నిలుపుతుంది.
- source_word: ἐὰν μὴ
  choice: …తేనే తప్ప
  rationale: గ్రీకు షరతును తెలుగులో సహజంగా ‘unless’ భావంతో తెలియజేస్తుంది.
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: నన్ను పంపిన తండ్రి
  rationale: కర్తృవాచక క్రియావిశేషణాన్ని సహజమైన సంబంధవాచక నిర్మాణంగా అనువదించి, ‘తండ్రి’ అనే యేసు వాడిన వ్యక్తిగత సంబోధనను నిలుపుతుంది.
- source_word: ἑλκύσῃ
  choice: తనవైపు ఆకర్షిస్తే
  rationale: ఎవరినైనా ఒక దిశగా రప్పించే క్రియాశక్తిని తెలియజేస్తూ, బలవంతంగా ఈడ్చడం అనే భావాన్నిగానీ కేవలం మృదువైన ఆహ్వానం అనే భావాన్నిగానీ ప్రధాన పాఠ్యంలో నిర్బంధంగా రుద్దదు.
- source_word: αὐτόν
  choice: అతణ్ణి
  rationale: గ్రీకులోని పుంలింగ ఏకవచన సర్వనామాన్ని ప్రతినిధ్య ప్రయోగంగా నిలుపుతుంది; ఇది పురుషులకు మాత్రమే పరిమితం కాదని పాదసూచిక వివరిస్తుంది.
- source_word: κἀγὼ ἀναστήσω αὐτόν
  choice: నేను అతణ్ణి … లేపుతాను
  rationale: καί + ἐγώ లోని స్పష్టమైన ‘నేను’ను నిలుపుతూ, పునరుత్థాన సందర్భంలో ἀναστήσω యొక్క ‘లేపడం’ అనే రూపాన్ని కాపాడుతుంది.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: చివరి రోజున
  rationale: అంత్యకాల సూచనను సహజమైన ఆధునిక తెలుగులో యథాతథంగా అందిస్తుంది.
theological_decisions:
- issue: రక్షణసంబంధంగా వివాదాస్పదమైన సందర్భంలో ἑλκύσῃ అర్థం
  choice: తనవైపు ఆకర్షిస్తే
  alternative: అతణ్ణి లాగితే / ఈడ్చితే
  rationale: ఈ క్రియకు బలమైన లాగడం లేదా ఈడ్చడం అనే భావం ఉండవచ్చు. అయితే ఇక్కడ ‘ఆకర్షించడం’ కదలిక కలిగించే భావాన్ని నిలుపుతూ, తండ్రి ఒక వ్యక్తిని కుమారుని దగ్గరకు ఎలా తీసుకొస్తాడనే వివాదాస్పద సిద్ధాంత ప్రశ్నను అనువాదమే తీర్చివేయకుండా ఉంచుతుంది.
- issue: αὐτόν అనే పుంలింగ సర్వనామం యొక్క సాధారణ ప్రతినిధ్య ప్రయోగం
  choice: అతణ్ణి
  alternative: ఆ వ్యక్తిని
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది సాధారణంగా మనుషులందరికీ వర్తిస్తుందని పాదసూచికలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘ఆకర్షిస్తే’కు ‘తనవైపు’ చేర్చి గ్రీకు క్రియలోని దిశాత్మక కదలికను తెలుగులో స్పష్టం చేశాం. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
