id: JHN.6.30
reference: John 6:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: te
  text: అందుకు వారు ఆయనతో, “అయితే మేము చూసి, నిన్ను నమ్మేలా[a] నువ్వు ఏ సూచక కార్యం చేస్తున్నావు? ఏ కార్యం చేస్తున్నావు?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీలో విశ్వసించేలా,” లేదా “నీపై నమ్మకం ఉంచేలా.” గ్రీకు మూలంలో అక్షరార్థంగా “నిన్ను నమ్మేలా” అని ఉంది; ఇక్కడ దత్తివిభక్తి సర్వనామం వాడబడింది, యోహాను రచనలో ఎక్కువగా కనిపించే “ఆయనలో విశ్వసించడం” అనే నిర్మాణం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: అందుకు వారు ఆయనతో ... అని అడిగారు
  rationale: οὖν ముందున్న సంభాషణతో ఉన్న నిర్ధారణాత్మక/క్రమ సంబంధాన్ని ‘అందుకు’ సహజంగా తెలియజేస్తుంది. ప్రత్యక్ష ప్రశ్నకు తెలుగు వాక్యనిర్మాణంలో ‘అని అడిగారు’ సహజం.
- source_word: Τί οὖν
  choice: అయితే ... ఏ
  rationale: రెండవ οὖνను ‘అయితే’గా ఉంచడం జనసమూహం విసిరిన సవాలు యొక్క తార్కిక ఒత్తిడిని నిలుపుతుంది.
- source_word: ποιεῖς σὺ σημεῖον
  choice: నువ్వు ఏ సూచక కార్యం చేస్తున్నావు
  rationale: వర్తమానకాల క్రియను ‘చేస్తున్నావు’గా, యోహాను రచనలో ప్రత్యేక భావభారం గల σημεῖονను కేవలం అద్భుతం అని వ్యాఖ్యానించకుండా ‘సూచక కార్యం’గా అందిస్తుంది; σὺలోని స్పష్టమైన కర్తకు ‘నువ్వు’ నిలిపింది.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: మేము చూసి, నిన్ను నమ్మేలా
  rationale: ἵνα ఉద్దేశం/ఫలితాన్ని ‘-ేలా’ తెలియజేస్తుంది. σοι దత్తివిభక్తితో ఉన్న πιστεύωను ‘నిన్ను నమ్ము’గా అనువదించడం, εἰςతో సాధారణంగా వచ్చే ‘ఆయనలో విశ్వసించు’ అనే యోహానీయ నిర్మాణాన్ని ఇందులోకి దిగుమతి చేయదు.
- source_word: τί ἐργάζῃ
  choice: ఏ కార్యం చేస్తున్నావు
  rationale: ἐργάζομαιలోని పని/కార్యం భావాన్ని ‘కార్యం’ నిలుపుతుంది; ముందు ప్రశ్నతో ఉన్న ఉద్దేశపూర్వక పునరుక్తి, సమాంతరత కూడా కాపాడబడతాయి.
theological_decisions:
- issue: πιστεύω + దత్తివిభక్తి σοι యొక్క భావం
  choice: నిన్ను నమ్మేలా
  alternative: నీలో విశ్వసించేలా / నీపై నమ్మకం ఉంచేలా
  rationale: మూలంలో εἰς + ద్వితీయావిభక్తి కాకుండా దత్తివిభక్తి సర్వనామం ఉంది. అందువల్ల యేసు మాట లేదా వాదనను నమ్మడం అనే ప్రత్యక్ష భావాన్ని ప్రధాన పాఠం నిలుపుతుంది; వ్యక్తిపై విశ్వాసం/నమ్మకం అనే సాధ్యమైన విస్తృత భావాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. జనసమూహం యేసును నేరుగా సంబోధిస్తున్నందున ‘నువ్వు/నిన్ను’ వాడబడింది; ఇది అవమానార్థకం కాకుండా సహజ ఏకవచన ప్రత్యక్ష సంబోధన. పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
