- from: నా శరీరాన్ని తిని[a], నా రక్తాన్ని తాగే వ్యక్తి నాలో నిలిచి ఉంటాడు[b]; నేను అతనిలో నిలిచి ఉంటాను.
  to: నా మాంసాన్ని తినే, నా రక్తాన్ని తాగే వాడు నాలో నిలిచి ఉంటాడు[b]; నేను అతనిలో నిలిచి ఉంటాను.
  rationale: The revision restores the parallel present-participial force with ‘తినే ... తాగే వాడు,’ renders σάρξ concretely as ‘మాంసం,’ and corrects the traditional-rendering footnote. Footnote a is retained and its alternative wording is aligned with the ongoing force of the Greek. No interpretive explanation of the eating/drinking imagery has been added.
