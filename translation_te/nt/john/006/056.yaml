    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: తినే వ్యక్తి
  rationale: నిర్దిష్ట ఉపపదంతో కూడిన వర్తమాన అసమాపక క్రియ వ్యక్తిని సూచిస్తూ, అతని లక్షణమైన కొనసాగుతున్న చర్యను తెలియజేస్తుంది. తెలుగు సహజత్వం కోసం సమాంతర క్రియలతో కలిపి ‘తిని ... తాగే వ్యక్తి’గా అమర్చబడింది.
- source_word: τρώγων
  choice: తిని
  rationale: τρώγω సాధారణంగా ‘తిను’ కంటే కొంత సజీవమైన, నమిలి తినే భావాన్ని కలిగించగలదు. ప్రధాన వాక్యంలో సహజమైన ‘తిను’ను ఉంచి, ఆ సజీవ భావాన్ని పాదసూచికలో భద్రపరిచాం.
- source_word: μου τὴν σάρκα
  choice: నా శరీరాన్ని
  rationale: ఇక్కడ σάρξ యేసు యొక్క దేహమాంసాన్ని స్పష్టంగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘నా శరీరం’ సహజంగా, గౌరవప్రదంగా ఉండి, ‘పాప స్వభావం’ వంటి వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: నా రక్తాన్ని తాగే
  rationale: సమన్వయ వర్తమాన అసమాపక క్రియను నేరుగా అనువదించి, గ్రీకు వాక్యంలోని బలమైన బలియర్పణ సంబంధ చిత్రాన్ని అలాగే ఉంచుతుంది.
- source_word: ἐν ἐμοὶ μένει
  choice: నాలో నిలిచి ఉంటాడు
  rationale: యోహాను రచనల్లో ముఖ్యమైన μένω క్రియలోని కొనసాగింపు, సంబంధ స్థిరత్వం రెండింటినీ ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κἀγὼ ἐν αὐτῷ
  choice: నేను అతనిలో నిలిచి ఉంటాను
  rationale: గ్రీకులో రెండో భాగంలో క్రియ అధ్యాహారంగా ఉంది. తెలుగులో అస్పష్టత రాకుండా ముందు భాగంలోని ‘నిలిచి ఉండు’ క్రియను సహజంగా పునరుద్ధరించాం.
- source_word: αὐτῷ
  choice: అతనిలో
  rationale: పుంలింగ ఏకవచన సర్వనామాన్ని మూలరూపానికి అనుగుణంగా ఉంచి, ముందున్న వ్యక్తినే సూచించేలా చేశాం.
theological_decisions:
- issue: శరీరాన్ని తినడం, రక్తాన్ని తాగడం—సంస్కార సంబంధమైనదా లేక రూపకాలంకారమైనదా
  choice: గ్రీకులోని స్పష్టమైన శరీర–రక్త భాషను వ్యాఖ్యాన విస్తరణ లేకుండా నిలిపివేయడం
  alternative: దీనిని ప్రభుభోజనంగా స్పష్టీకరించడం లేదా ‘విశ్వసించడం’ అని రూపకార్థంగా మార్చడం
  rationale: ఈ వాక్యానికి క్రైస్తవ సంప్రదాయాల్లో భిన్న వ్యాఖ్యానాలు ఉన్నాయి. మూలపాఠం ఆ వివాదాన్ని ఇక్కడ పరిష్కరించదు; కాబట్టి అనువాదం ఏ సంప్రదాయాన్నీ వాక్యంలోకి చేర్చదు.
- issue: యోహాను రచనల్లో పరస్పర అంతర్నివాస భాష
  choice: ‘నాలో నిలిచి ఉంటాడు; నేను అతనిలో నిలిచి ఉంటాను’
  alternative: ‘నాతో ఏకమై ఉంటాడు’ లేదా ‘నాలో నివసిస్తాడు’
  rationale: ‘నిలిచి ఉండు’ μένω క్రియలోని సంబంధ స్థిరత్వాన్ని కాపాడుతుంది; దానిని ఒక నిర్దిష్ట మర్మాత్మక లేదా సిద్ధాంతపరమైన సూత్రంగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ఏకవచనం, వర్తమాన చర్య, శరీర–రక్తాల స్పష్టమైన చిత్రం, పరస్పర అంతర్నివాస భావం కాపాడబడ్డాయి.
