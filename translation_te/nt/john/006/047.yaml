translation:
  language: te
  text: '“నేను మీతో నిజంగా, నిజంగా చెబుతున్నాను: నమ్మేవాడు నిత్యజీవం కలిగి ఉన్నాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: యోహాను సువార్తలో గంభీరమైన, నిశ్చయపూర్వక ప్రకటనను పరిచయం చేసే ద్విరుక్తిని సహజమైన ఆధునిక తెలుగులోనూ పునరుక్తితో నిలుపుతుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో ... చెబుతున్నాను
  rationale: వర్తమానకాల క్రియను, బహువచన దత్తివ సర్వనామాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ὁ πιστεύων
  choice: నమ్మేవాడు
  rationale: ఆర్టికల్‌తో కూడిన వర్తమాన కృదంతం విశ్వసించే వ్యక్తిని సూచిస్తుంది; ‘నమ్మేవాడు’ దీనిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πιστεύων
  choice: నమ్మే
  rationale: πιστεύωకు యోహాను రచనల్లో సాధారణమైన అర్థాన్ని అదనపు సిద్ధాంతార్థం చేర్చకుండా అందిస్తుంది.
- source_word: ἔχει
  choice: కలిగి ఉన్నాడు
  rationale: నిత్యజీవం ఇప్పుడే ఉన్నదనే గ్రీకు వర్తమానకాల ప్రకటనను యథాతథంగా నిలుపుతుంది.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవం
  rationale: యోహాను సందర్భంలో కాలవ్యాప్తి మరియు జీవపు స్వభావం రెండింటినీ సూచించే స్థిరమైన, సహజమైన తెలుగు పదబంధం.
theological_decisions:
- issue: నిత్యజీవం వర్తమానంలో కలిగి ఉండడం
  choice: నిత్యజీవం కలిగి ఉన్నాడు
  alternative: నిత్యజీవం పొందుతాడు
  rationale: ἔχει వర్తమానకాలంలో ఉంది. దానిని భవిష్యత్తుగా మార్చడం మూలపాఠంలోని వర్తమాన స్వాధీనతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని గంభీర ద్విరుక్తి మరియు వర్తమానకాల భావం నిలుపబడ్డాయి.
