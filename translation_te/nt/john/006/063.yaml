id: JHN.6.63
reference: John 6:63
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: te
  text: జీవింపజేసేది ఆత్మే[a]; శరీరం ఏమాత్రం ప్రయోజనం కలిగించదు[b]. నేను మీతో పలికిన మాటలు ఆత్మగాను జీవంగాను ఉన్నాయి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆత్మ జీవింపజేస్తుంది.’ ఇక్కడ ‘ఆత్మ’ అనే పదం పరిశుద్ధాత్మను లేదా సాధారణంగా ఆత్మను సూచించవచ్చు; సందర్భం పరిశుద్ధాత్మను సూచించే అర్థానికి మొగ్గుచూపుతుంది.
    reason: alternative_reading
  - marker: b
    text: ‘శరీరం’ అనేది కేవలం భౌతిక దేహాన్నే కాక, కేవలం మానవమైనదాన్ని విస్తృతంగా సూచించవచ్చు. ఇక్కడ దాన్ని ‘పాప స్వభావం’ అని అనువదించడం గ్రీకు మూలం చెప్పేదానికంటే ఎక్కువ వ్యాఖ్యానాత్మకం అవుతుంది.
    reason: lexical_alternative
  - marker: c
    text: దీనిని ‘పరిశుద్ధాత్మ మరియు జీవం’ అనిగానీ, ‘ఆత్మసంబంధమైనవి, జీవాన్ని ఇచ్చేవి’ అనిగానీ అర్థం చేసుకోవచ్చు. గ్రీకు వాక్య నిర్మాణం సంక్షిప్తంగా, గుణాత్మకంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: మొదటి వాక్యభాగంలో యోహాను సువార్త సందర్భం పరిశుద్ధాత్మను సూచించే అవకాశాన్ని బలపరుస్తుంది. తెలుగు లిపిలో పెద్ద అక్షరాల భేదం లేకపోవడం వల్ల ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: ζῳοποιοῦν
  choice: జీవింపజేసేది
  rationale: ‘జీవం ఇవ్వడం’ లేదా ‘బతికించడం’ అనే వర్తమాన క్రియాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: σὰρξ
  choice: శరీరం
  rationale: గ్రీకు పదంలోని ఉద్దేశపూర్వక విస్తృతతను పూర్తిగా ‘పాప స్వభావం’గానో ‘మానవ ప్రయత్నం’గానో నిర్ధారించకుండా, ఆత్మతో ఉన్న వ్యత్యాసాన్ని ప్రత్యక్షంగా ఉంచుతుంది.
- source_word: ὠφελεῖ οὐδέν
  choice: ఏమాత్రం ప్రయోజనం కలిగించదు
  rationale: సంపూర్ణ నిరాకరణను స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ῥήματα
  choice: మాటలు
  rationale: పలికిన ఉక్తులను సూచించే సహజమైన, ప్రత్యక్ష తెలుగు పదం.
- source_word: λελάληκα
  choice: నేను మీతో పలికిన
  rationale: పరిపూర్ణ కాలంలోని గతంలో పలికినా కొనసాగుతున్న ప్రాసంగికతను తెలుగు సందర్భంలో సహజంగా అందిస్తుంది.
- source_word: πνεῦμά ἐστιν
  choice: ఆత్మ
  rationale: వ్యాఖ్యానాత్మకంగా ‘ఆత్మసంబంధమైనవి’ లేదా ‘ఆత్మను ఇచ్చేవి’ అని విస్తరించకుండా, గ్రీకు వాక్యంలోని సంక్షిప్తమైన గుణాత్మక రూపాన్ని కాపాడుతుంది.
- source_word: ζωή
  choice: జీవం
  rationale: యోహాను రచనల్లోని లోతైన భావాన్ని కలిగిన సాధారణ పదానికి ప్రత్యక్షమైన తెలుగు సమానం.
theological_decisions:
- issue: మొదటి వాక్యభాగంలోని πνεῦμα పదం ఎవరిని లేదా దేనిని సూచిస్తుంది
  choice: సందర్భానుసారం పరిశుద్ధాత్మను సూచించే ‘ఆత్మ’
  alternative: సాధారణ ఆత్మిక సూత్రం లేదా మానవ ఆత్మ
  rationale: యోహాను సువార్తలో జీవింపజేసే కార్యం ఆత్మతో బలంగా ముడిపడి ఉంది; అయినా తెలుగు అనువాదం సాధ్యమైన మరో అర్థాన్ని మూసివేయకుండా పాదసూచికలో ఉంచుతుంది.
- issue: ఆత్మతో వ్యత్యాసంగా σὰρξ యొక్క భావం
  choice: విస్తృతతను నిలిపే ‘శరీరం’
  alternative: పాప స్వభావం, కేవలం మానవ శక్తి, లేదా భౌతిక దేహం
  rationale: ఒక నిర్దిష్ట మానవశాస్త్ర లేదా పాపశాస్త్ర వ్యాఖ్యానాన్ని వాక్యంలోకి చేర్చకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: చివరి వాక్యభాగంలోని πνεῦμά ἐστιν యొక్క విధేయ బలం
  choice: ‘మాటలు ఆత్మ, జీవం’ అనే సంక్షిప్త గుణాత్మక రూపం
  alternative: మాటలు పరిశుద్ధాత్మయే; లేదా ఆత్మసంబంధమైనవి, జీవాన్ని ఇచ్చేవి
  rationale: నిర్దేశక పదం లేని గ్రీకు విధేయం గుణాత్మక భావాన్ని అనుమతిస్తుంది. అనువాదం దానిని బలవంతంగా వ్యక్తి-సమీకరణగానో కార్యవివరణగానో మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలి. ‘జీవింపజేసేది’, ‘ఏమాత్రం ప్రయోజనం కలిగించదు’ అనే రూపాలు సాధారణ పాఠకులకు స్పష్టంగా ఉంటాయి. చివరి వాక్యంలో మూలంలోని సంక్షిప్తతను ఉద్దేశపూర్వకంగా నిలిపాం.
