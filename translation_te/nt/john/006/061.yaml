source:
  edition: SBLGNT
  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: te
  text: 'అయితే, తన శిష్యులు దీని గురించి సణుగుకుంటున్నారని యేసు తనలో తానే తెలిసికొని వారితో ఇలా అన్నాడు: “ఇది మీకు అభ్యంతరంగా ఉందా?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇది మిమ్మల్ని తొట్రుపడేలా చేస్తుందా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: తెలుసుకొని
  rationale: సమకాలిక భాగధాతు భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో చూపిస్తుంది.
- source_word: ἐν ἑαυτῷ
  choice: తనలో తాను
  rationale: యేసు ఈ విషయాన్ని బయటి సమాచారం ద్వారా కాక తన అంతరంగంలోనే ఎరిగాడనే భావాన్ని నిలుపుతుంది.
- source_word: γογγύζουσιν
  choice: సణుగుకుంటున్నారని
  rationale: అసంతృప్తితో లోలోపల లేదా మెల్లగా గొణగడాన్ని సూచించే గ్రీకు క్రియకు సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: περὶ τούτου
  choice: దీని గురించి
  rationale: ముందటి మాటను సూచించే సంక్షిప్తమైన గ్రీకు పదబంధాన్ని వివరణ జోడించకుండా అందిస్తుంది.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: తన శిష్యులు
  rationale: ఇది పన్నెండుగురికే పరిమితం కాక విస్తృత శిష్యవర్గాన్ని సూచించగల సాధారణ రూపం.
- source_word: Τοῦτο
  choice: ఇది
  rationale: మూలంలోని సంక్షిప్త సూచనను ‘బోధ’ వంటి నామవాచకం చేర్చకుండా నిలుపుతుంది.
- source_word: σκανδαλίζει
  choice: అభ్యంతరం కలిగిస్తుందా
  rationale: ఈ సందర్భంలో కలిగే ఆక్షేపణ లేదా మనస్తాపాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; తొట్రుపడేలా చేయడం అనే బలమైన రూపకార్థాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: యేసు మాటను తిరస్కరించే అవకాశమున్న సందర్భంలో σκανδαλίζει అనువాదం
  choice: ఇది మీకు అభ్యంతరం కలిగిస్తుందా?
  alternative: ఇది మీరు తొట్రుపడేలా చేస్తుందా?
  rationale: గ్రీకు పదం అభ్యంతరం లేదా మనస్తాపం కలిగించడాన్నీ, విశ్వాసంలో తొట్రుపడి వెనుదిరగడాన్నీ సూచించగలదు. ప్రధాన పాఠం సహజమైన తెలుగు భావాన్ని ఇస్తుండగా, పాదసూచిక దాని రూపకపరమైన, వేదాంతపరంగా బలమైన ప్రత్యామ్నాయాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘సణుగుకుంటున్నారు’ అనేది అసంతృప్తితో మెల్లగా గొణగడాన్ని సూచిస్తుంది; ‘అభ్యంతరం’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, ప్రత్యామ్నాయ రూపకార్థం పాదసూచికలో ఇవ్వబడింది.
