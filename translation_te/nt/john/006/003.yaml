source:
  edition: SBLGNT
  text: ἀνῆλθεν δὲ εἰς τὸ ⸀ὄρος Ἰησοῦς, καὶ ἐκεῖ ἐκάθητο μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/003.yaml
  text: Then Jesus went up on the mountain, and there he sat with his disciples.
translation:
  language: te
  text: అప్పుడు యేసు కొండపైకి వెళ్లి, అక్కడ తన శిష్యులతో కూర్చున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: పైకి వెళ్లి
  rationale: ἀνέρχομαι యొక్క భూతకాల రూపం ఇక్కడ సాధారణ భౌగోళిక కదలికను, అంటే పైకి వెళ్లడాన్ని సూచిస్తుంది. ‘ఆరోహించాడు’ కంటే ‘పైకి వెళ్లి’ సహజమైన ఆధునిక తెలుగు.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథన పురోగతిని సూచిస్తుంది; ‘అప్పుడు’ ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τὸ ὄρος
  choice: కొండపైకి
  rationale: ἀνῆλθεν‌తో కలిసి ఈ పదబంధం కొండ మీదికి వెళ్లడాన్ని సూచిస్తుంది. నిర్దిష్ట స్థలసూచనను తెలుగులో సహజంగా తెలియజేయడానికి ‘కొండపైకి’ ఎంచుకున్నాం.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: వ్యక్తినామానికి ప్రామాణిక తెలుగు రూపం.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే సహజమైన, నేరమైన తెలుగు సమానార్థకం.
- source_word: ἐκάθητο
  choice: కూర్చున్నాడు
  rationale: κάθημαι యొక్క imperfect రూపం కూర్చోవడం లేదా కూర్చొని ఉండడం రెండింటినీ సూచించగలదు. ఈ కథన సందర్భంలో ‘కూర్చున్నాడు’ సహజంగా ఉండి మూల భావాన్ని కాపాడుతుంది.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: తన శిష్యులతో
  rationale: μετά + genitive సహవాసాన్ని సూచిస్తుంది. μαθητής‌కు సువార్తల సందర్భంలో గురువును అనుసరించే సంబంధాన్ని కాపాడే ప్రామాణిక పదం ‘శిష్యుడు’; αὐτοῦ‌ను సహజ తెలుగు ప్రతిబింబక సర్వనామమైన ‘తన’తో తెలిపాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పదాలను ఉపయోగిస్తూ మూలంలోని వాక్యక్రమం మరియు స్థల కదలికను సహజంగా ప్రతిబింబించాం.
