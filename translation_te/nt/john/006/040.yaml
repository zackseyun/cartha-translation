review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the Father's will, the Son, believing in him, eternal life, Jesus' emphatic personal agency, and the last day. However, the main text renders the first present participle θεωρῶν as the perfective/sequential ‘చూసి’ (‘having seen’), while πιστεύων remains present/generic (‘విశ్వసించే’). The Greek coordinates two present participles describing the same generic person; Telugu should keep the parallel generic sense.
  naturalness: The proposed revision is natural modern standard Telugu. Placing ‘నా తండ్రి చిత్తం ఇదే:’ before the content clause makes the sentence clearer, while retaining the explanatory force of γάρ with ‘ఎందుకంటే.’
  terminology: ‘తండ్రి,’ ‘కుమారుడు,’ ‘చిత్తం,’ ‘నిత్యజీవం,’ and ‘చివరి రోజు’ are appropriate and consistent theological terms. ‘నేనే’ properly represents the explicit emphatic ἐγώ without interpretive expansion.
  issues:
  - severity: medium
    issue: Aspectual mismatch in ‘కుమారుణ్ణి చూసి ... విశ్వసించే’
    rationale: θεωρῶν and πιστεύων are coordinated present participles. ‘చూసి’ can imply a completed act preceding belief, whereas ‘చూసే’ retains the generic, contemporaneous characterization conveyed by the Greek.
  - severity: low
    issue: The sentence structure obscures ‘this is the will of my Father’
    rationale: The initial ‘ఎందుకంటే’ followed immediately by the long content clause is understandable, but ‘నా తండ్రి చిత్తం ఇదే:’ more directly reflects τοῦτο ... ἐστιν τὸ θέλημα τοῦ πατρός μου and improves readability.
  revised_text: 'ఎందుకంటే, నా తండ్రి చిత్తం ఇదే: కుమారుణ్ణి చూసే[a], ఆయనను విశ్వసించే ప్రతి ఒక్కరూ నిత్యజీవం కలిగి ఉండాలి; చివరి రోజున నేనే[b] వారిని లేపుతాను.'
