id: JHN.6.40
reference: John 6:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: te
  text: 'ఎందుకంటే, నా తండ్రి చిత్తం ఇదే: కుమారుణ్ణి చూసే[a], ఆయనను విశ్వసించే ప్రతి ఒక్కరూ నిత్యజీవం కలిగి ఉండాలి; చివరి రోజున నేనే[b] వారిని లేపుతాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కుమారుణ్ణి శ్రద్ధగా చూసే.’ ఇక్కడి గ్రీకు క్రియ కేవలం కంటితో చూడడమే కాక, గమనిస్తూ చూడడం అనే భావాన్ని కూడా ఇవ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకులో ‘నేను’ అనే సర్వనామం స్పష్టంగా ఉండి ఉద్ఘాటనను ఇస్తుంది: ‘నేనే వారిని లేపుతాను.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: ఎందుకంటే ... ఇదే
  rationale: γάρ ముందున్న మాటకు వివరణను కలుపుతుంది. తెలుగులో సహజమైన వివరణాత్మక సంబంధాన్ని చూపడానికి ‘ఎందుకంటే’ వాడి, τοῦτο ἐστιν భావాన్ని ‘ఇదే/అన్నదే’ నిర్మాణంలో ప్రతిబింబించాం.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: నా తండ్రి చిత్తం
  rationale: θέλημα దేవుని సంకల్పం లేదా ఇష్టాన్ని సూచిస్తుంది; ‘చిత్తం’ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, వేదాంతపరమైన అదనపు వ్యాఖ్యానం లేకుండా ఆ భావాన్ని అందిస్తుంది.
- source_word: πᾶς ὁ θεωρῶν τὸν υἱὸν
  choice: కుమారుణ్ణి చూసే ప్రతి ఒక్కరూ
  rationale: ఆర్టికల్‌తో ఉన్న వర్తమాన కృదంతం సాధారణంగా ఈ లక్షణం గల ప్రతి వ్యక్తిని సూచిస్తుంది. θεωρέω సాధారణ చూపుకంటే శ్రద్ధగా చూడడం అనే ఛాయను కూడా కలిగి ఉండవచ్చు; ప్రధాన పాఠ్యంలో సహజమైన ‘చూసి’ని ఉంచి ప్రత్యామ్నాయ ఛాయను పాదసూచికలో తెలిపాం.
- source_word: καὶ πιστεύων εἰς αὐτὸν
  choice: ఆయనను విశ్వసించే
  rationale: πιστεύω εἰς వ్యక్తి వైపు మళ్లిన విశ్వాసం లేదా నమ్మకాన్ని వ్యక్తం చేస్తుంది. ‘ఆయనను విశ్వసించే’ అనేది తెలుగులో సహజంగా ఉండి వ్యక్తిగత విశ్వాస దిశను నిలుపుతుంది.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: నిత్యజీవం కలిగి ఉండాలి
  rationale: ἔχω యొక్క ‘కలిగి ఉండు’ భావాన్ని, ἵναతో వచ్చిన సంభావ్య/ఉద్దేశ్య నిర్మాణాన్ని ‘కలిగి ఉండాలన్నదే’గా నిలిపాం; దాన్ని సాదా వర్తమాన సూచనగా మార్చలేదు.
- source_word: καὶ ἀναστήσω αὐτὸν ἐγὼ
  choice: నేనే వారిని లేపుతాను
  rationale: ἐγώ స్పష్టమైన ఉద్ఘాటనను ‘నేనే’ నిలుపుతుంది. గ్రీకులో ఏకవచన సర్వనామం ప్రతి ఒక్కరిని విడివిడిగా సూచిస్తుంది; తెలుగులో ముందున్న ‘ప్రతి ఒక్కరూ’తో సహజ అన్వయానికి గౌరవ బహువచన రూపమైన ‘వారిని’ వాడాం.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: చివరి రోజున
  rationale: కాలాన్ని సూచించే దత్తివిభక్తి పదబంధానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
theological_decisions:
- issue: πᾶς ὁ θεωρῶν ... καὶ πιστεύων లో పరిధి మరియు షరతు
  choice: కుమారుణ్ణి చూసి ఆయనను విశ్వసించే ప్రతి ఒక్కరూ నిత్యజీవం కలిగి ఉండాలన్నదే
  alternative: కుమారుణ్ణి చూసి ఆయనను విశ్వసించే ప్రతి ఒక్కరికీ నిత్యజీవం ఉంది
  rationale: ἵνα + subjunctive నిర్మాణాన్ని తండ్రి చిత్తం యొక్క విషయంగా ఉంచి, దాన్ని నేరుగా సూచనార్థక వాక్యంగా మార్చలేదు. ఎన్నిక, మానవ స్వేచ్ఛ వంటి వ్యవస్థాత్మక సిద్ధాంతాలను పాఠ్యంలోకి చేర్చకుండా ‘చూడడం–విశ్వసించడం’ అనే వచనంలోని ఉద్వేగాన్ని అలాగే నిలిపాం.
- issue: καὶ ἀναστήσω αὐτὸν ἐγὼ లో ἐγώ ఉద్ఘాటన
  choice: నేనే వారిని లేపుతాను
  alternative: నేను వారిని లేపుతాను
  rationale: గ్రీకులో అనవసరమైనప్పటికీ ప్రత్యేకంగా చేర్చిన ἐγώ యేసు స్వయంగా చేసే కార్యాన్ని ఉద్ఘాటిస్తుంది. ‘నేనే’ ఆ ఉద్ఘాటనను అదనపు సిద్ధాంతార్థం చేర్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే ‘చిత్తం,’ ‘నిత్యజీవం,’ ‘చివరి రోజు’ వంటి యోహాను సువార్తలోని గంభీర ధార్మిక పదజాలాన్ని నిలిపాం. గ్రీకు ఏకవచన సాధారణ సర్వనామానికి తెలుగులో గౌరవప్రదమైన, సహజమైన ‘వారిని’ వాడాం.
