id: JHN.6.60
reference: John 6:60
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: te
  text: కాబట్టి ఆయన శిష్యుల్లో చాలామంది అది విని, “ఈ మాట కఠినంగా ఉంది[a]; దీన్ని ఎవరు వినగలరు[b]?” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ బోధ కఠినంగా ఉంది”; λόγος అనే పదానికి సందర్భాన్ని బట్టి “మాట,” “సందేశం,” లేదా “బోధ” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దీన్ని ఎవరు ఆలకించగలరు?” ఇక్కడి గ్రీకు క్రియ సందర్భాన్ని బట్టి వినడం, శ్రద్ధగా ఆలకించడం, లేదా విని స్వీకరించడం అనే భావాలను కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ … ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ఆయన శిష్యుల్లో చాలామంది
  rationale: మాట్లాడినవారు ఆయన శిష్యులనే పెద్ద సమూహంలోనివారని ἐκ నిర్మాణం సూచిస్తుంది; ఈ తెలుగు రూపం దాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి ప్రసంగం నుంచి వచ్చిన ప్రతిస్పందనను, తార్కిక అనుసంధానాన్ని నిలుపుతుంది.
- source_word: ἀκούσαντες
  choice: అది విని
  rationale: భూతకాల కృదంతానికి సందర్భానుగుణమైన కాలార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘అది’ యేసు చెప్పిన బోధను సూచిస్తుంది.
- source_word: Σκληρός
  choice: కఠినంగా
  rationale: ఈ పదం కేవలం అర్థం చేసుకోవడం కష్టమనే భావానికే పరిమితం కాకుండా, స్వీకరించడం కష్టమైనది లేదా భరించలేనంత తీవ్రమైనది అనే భావాలనూ కలిగి ఉండగలదు.
- source_word: ὁ λόγος οὗτος
  choice: ఈ మాట
  rationale: λόγος ఇక్కడ ఇప్పుడే వినిన పలుకును లేదా బోధను సూచిస్తుంది; ‘మాట’ సంక్షిప్తంగా ఉండి మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: τίς δύναται αὐτοῦ ἀκούειν
  choice: దీన్ని ఎవరు వినగలరు?
  rationale: ప్రశ్నలోని సామర్థ్య భావాన్ని కాపాడుతుంది. ‘విను’ అనేది శబ్దాన్ని వినడం, శ్రద్ధగా ఆలకించడం, మాటను స్వీకరించడం అనే సందర్భోచిత భావాలకు తెరచి ఉంటుంది.
theological_decisions:
- issue: శిష్యులు యేసు ప్రసంగంపై చేసిన అభ్యంతరం యొక్క స్వభావం
  choice: ఆ మాట కఠినంగా ఉందని చెప్పడం
  alternative: ఆ మాట కేవలం అర్థం చేసుకోవడం కష్టమని లేదా తప్పనిసరిగా అభ్యంతరకరమని స్పష్టీకరించడం
  rationale: σκληρός అనే పదం కష్టం, తీవ్రత, స్వీకరించలేనితనం వంటి భావాలను కలిగి ఉండగలదు. ‘కఠినంగా’ అనే పదం అభ్యంతరం బౌద్ధికమా, నైతికమా, లేక మనస్తాపకరమా అన్నదాన్ని అనవసరంగా నిర్ణయించదు.
- issue: ἀκούειν లోని స్పందన భావం
  choice: వినగలరు
  alternative: అంగీకరించగలరు లేదా పాటించగలరు
  rationale: సందర్భంలో స్వీకరణ భావం ఉండవచ్చు; అయినా దాన్ని స్పష్టంగా ‘అంగీకరించడం’గా మార్చితే మూలంలోని వినడం–ఆలకించడం–స్వీకరించడం మధ్య ఉన్న అర్థ విస్తృతి కుదించబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘కఠినంగా’ మరియు ‘వినగలరు’ అనే పదాలు మూలంలోని ఉద్దేశపూర్వక అర్థ విస్తృతిని నిలుపుతున్నాయి.
