  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: te
  text: కాబట్టి యూదులు[a] తమలో తాము వాదించుకుంటూ, “ఇతడు తన మాంసాన్ని[b] తినడానికి మనకు ఎలా ఇవ్వగలడు?” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యూదయా ప్రాంత ప్రజలు’; సందర్భాన్ని బట్టి ‘యూదు నాయకులు.’ గ్రీకులో నేరుగా ‘యూదులు’ అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘శరీరాన్ని.’ గ్రీకు పదం σάρξ అంటే ‘మాంసం’; ఈ భాగంలోని స్పష్టమైన పదప్రయోగాన్ని, ఉద్రిక్తతను నిలుపడానికి దానినే ఇక్కడ వాడాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: వాదించుకుంటూ
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న పరస్పర వివాదాన్ని సూచిస్తుంది. భౌతిక పోరాటమని అతిశయింపకుండా, మాటల ఘర్షణను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి మాటల ఫలితంగా కథనం ముందుకు సాగుతున్న సంబంధాన్ని చూపిస్తుంది.
- source_word: πρὸς ἀλλήλους
  choice: తమలో తాము
  rationale: ఆ గుంపులోని వారు ఒకరితో ఒకరు వాదించుకున్నారనే పరస్పర భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదబంధాన్ని నేరుగా అనువదిస్తుంది; ఈ వచనం సూచించే వర్గాన్ని ప్రధాన పాఠ్యంలో మరింత సంకుచితం చేయదు.
- source_word: λέγοντες
  choice: అన్నారు
  rationale: వారి వివాదంలోని మాటలను పరిచయం చేసే కృదంతాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో సమాపక క్రియగా వ్యక్తపరుస్తుంది.
- source_word: Πῶς δύναται
  choice: ఎలా ఇవ్వగలడు?
  rationale: సామర్థ్యం లేదా సాధ్యతను ప్రశ్నించే గ్రీకు నిర్మాణాన్ని సహజంగా అందిస్తుంది.
- source_word: οὗτος
  choice: ఇతడు
  rationale: సందర్భంలోని దూరీకరణ లేదా తృణీకార ఛాయను మితంగా నిలుపుతుంది.
- source_word: ἡμῖν
  choice: మనకు
  rationale: ‘ఇవ్వు’ అనే క్రియకు పరోక్ష కర్మను స్పష్టంగా తెలియజేస్తుంది.
- source_word: δοῦναι
  choice: ఇవ్వగలడు
  rationale: δίδωμι యొక్క సాధారణ అర్థమైన ‘ఇవ్వడం’ను నిలుపుతుంది.
- source_word: τὴν σάρκα αὐτοῦ
  choice: తన మాంసాన్ని
  rationale: σάρξ యొక్క స్పష్టమైన, శారీరక పదప్రయోగాన్ని నిలిపి, ఈ సందర్భంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను వివరణతో తొలగించదు.
- source_word: φαγεῖν
  choice: తినడానికి
  rationale: ‘ఇవ్వడం’తో అనుసంధానమైన ఉద్దేశం/పూరక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దైవభోజన సంబంధమైన లేదా అక్షరార్థ ఉద్రిక్తత ఉన్న సందర్భంలో σάρξ అనువాదం
  choice: మాంసం
  alternative: శరీరం
  rationale: విన్నవారు యేసు మాటలను స్పష్టమైన శారీరక భావంలో గ్రహించి స్పందిస్తున్నారు. ‘మాంసం’ గ్రీకు పదంలోని concrete wordingను, వాక్యంలోని దైవశాస్త్రీయ ఉద్రిక్తతను నిలుపుతుంది; నిర్దిష్ట సంస్కార వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చదు.
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι సూచించే వర్గం
  choice: యూదులు
  alternative: యూదయులు; యూదు నాయకులు
  rationale: గ్రీకు పాఠ్యం వర్గాన్ని ఇక్కడ పదపరంగా సంకుచితం చేయదు. అందువల్ల ప్రధాన పాఠ్యం నేర అనువాదాన్ని ఉంచి, సందర్భానుసార ప్రత్యామ్నాయాలను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇతడు’ సందర్భంలోని దూరీకరణను నిలుపుతుంది; ‘మాంసం’ మూలపాఠ్యపు concrete forceను కాపాడుతుంది. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదం వెంట ఉంచబడింది.
