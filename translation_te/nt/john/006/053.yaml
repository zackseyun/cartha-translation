id: JHN.6.53
reference: John 6:53
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: te
  text: 'అందుకు యేసు వారితో ఇలా అన్నాడు: “నిజంగా, నిజంగా మీతో చెబుతున్నాను: మీరు మనుష్యకుమారుని మాంసాన్ని తిని, ఆయన రక్తాన్ని తాగకపోతే, మీలో జీవం ఉండదు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “జీవం” అని మాత్రమే ఉంది; “నిత్యజీవం” అని లేదు. అయితే యోహాను సువార్తలోని విస్తృత సందర్భం ఈ జీవాన్ని నిత్యజీవంతో తరచుగా అనుసంధానిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అందుకు
  rationale: ముందటి సంభాషణకు ప్రతిస్పందనగా, దాని ఫలితంగా యేసు పలికిన మాటలను సహజమైన తెలుగులో అనుసంధానిస్తుంది.
- source_word: Ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: యోహాను సువార్తలోని ద్విగుణిత గంభీర ఉద్ఘాటనను పునరుక్తితోనే నిలుపుతుంది.
- source_word: ἐὰν μὴ
  choice: తాగకపోతే
  rationale: రెండు సమన్విత క్రియలపై వర్తించే ప్రతికూల షరతును తెలుగులో సహజంగా వాక్యాంత క్రియతో వ్యక్తం చేస్తుంది.
- source_word: φάγητε
  choice: తిని
  rationale: ‘తినడం’ అనే సూటి, స్పష్టమైన అర్థాన్ని నిలుపుతూ తరువాతి సమన్విత క్రియతో సహజంగా కలుపుతుంది.
- source_word: σάρκα
  choice: మాంసం
  rationale: σάρξ యొక్క స్పష్టమైన, ఉద్దేశపూర్వకంగా తీవ్రంగా వినిపించే భావాన్ని ‘శరీరం’ అని మృదువుపరచకుండా నిలుపుతుంది.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుని
  rationale: యేసు తనను సూచించడానికి వాడే స్థిరమైన బిరుదును, దాని దానియేలు సంబంధిత మరియు మెస్సీయ భావసూచనలతో సహా, మూలానికి దగ్గరగా ఉంచుతుంది.
- source_word: πίητε
  choice: తాగకపోతే
  rationale: πίνω యొక్క సూటి అర్థాన్ని నిలుపుతుంది; తెలుగులో ప్రతికూల షరతు ఈ చివరి సమన్విత క్రియపై వ్యక్తమై ‘తినడం’ మరియు ‘తాగడం’ రెండింటికీ వర్తిస్తుంది.
- source_word: αἷμα
  choice: రక్తం
  rationale: మూలంలోని గాఢమైన దృశ్యభాషను, దాని ధార్మిక బరువును వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: ζωὴν
  choice: జీవం
  rationale: మూలంలో αἰώνιον లేకపోవడంతో ‘నిత్యజీవం’ అని విస్తరించకుండా సాధారణ ‘జీవం’ అనే పదాన్నే ఉంచుతుంది.
- source_word: ἐν ἑαυτοῖς
  choice: మీలో
  rationale: ‘మీ అంతట మీలో’ వంటి అవసరానికి మించిన వ్యాఖ్యానాన్ని చేర్చకుండా, మూలంలోని అంతర్గత స్థానార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మాంసం తినడం, రక్తం తాగడం అనే భాషను సంస్కారపరంగా లేదా రూపకాలంకారంగా ముందే నిర్ణయించాలా?
  choice: ‘మాంసం తిని, ఆయన రక్తం తాగడం’ అనే సూటి భాషను నిలుపడం
  alternative: ‘పాలుపొందడం,’ ‘స్వీకరించడం,’ లేదా స్పష్టంగా ప్రభుభోజన సంబంధమైన పదజాలంతో వ్యాఖ్యానించడం
  rationale: మూలవాక్యం ఉద్దేశపూర్వకంగా స్పష్టమైన, సవాలు చేసే భాషను వాడుతుంది. అది సంస్కారపరమా, రూపకాలంకారమా, లేక రెండింటినీ కలిగిందా అనే ధార్మిక ఉద్రిక్తతను అనువాదం ముందే పరిష్కరించకూడదు.
- issue: ζωή ను సందర్భం ఆధారంగా ‘నిత్యజీవం’గా విస్తరించాలా?
  choice: ప్రధాన పాఠ్యంలో ‘జీవం’ అని ఉంచడం
  alternative: ‘నిత్యజీవం’
  rationale: యోహాను సువార్త విస్తృత సందర్భంలో నిత్యజీవ భావం ఉన్నప్పటికీ, ఈ వచనంలో αἰώνιον లేదు; కాబట్టి మూలంలో లేని విశేషణాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా, సామాన్య పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. మూలంలోని ‘మాంసం’ మరియు ‘రక్తం’ అనే తీవ్ర పదచిత్రాన్ని మృదువుపరచలేదు. సమర్పించిన ఆంగ్ల సంప్రదింపు పాఠ్యంలో [a] పాదసూచిక స్థానం మరియు దాని విషయం పరస్పరం సరిపోలకపోవడంతో, మూలాధారానికి నిజంగా సంబంధించిన ‘జీవం’ వివరణను మాత్రమే [a]గా వాక్యాంతంలో ఉంచాం.
