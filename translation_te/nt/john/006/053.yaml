review_pass:
  verdict: revise
  source_fidelity: The draft preserves the emphatic double ἀμήν, the conditional force, the concrete terms “flesh” and “blood,” and ζωή as “life” rather than importing “eternal life.” The conditional wording correctly conveys that both eating and drinking are required. A small revision makes the established title “Son of Man” less ambiguous in Telugu and marks the direct objects more clearly.
  naturalness: The wording is modern, solemn, and readily understandable. “మనుష్య కుమారుడు” written as two words can be read as an ordinary descriptive phrase (“a human’s son”) rather than Jesus’ fixed self-designation. The conventional compound “మనుష్యకుమారుడు” is clearer and more natural in biblical Telugu. Adding accusative marking to “మాంసం” and “రక్తం” also improves clarity without making the wording less idiomatic.
  terminology: “మాంసం,” “రక్తం,” and “జీవం” appropriately retain the source’s concrete and unexpanded wording. “మనుష్యకుమారుని” is preferred for the recognized title τοῦ υἱοῦ τοῦ ἀνθρώπου. The footnote is accurately anchored to “జీవం” and does not impose a sacramental or other interpretive reading.
  issues:
  - severity: low
    issue: The title is written as “మనుష్య కుమారుని.”
    rationale: As separate words, it may be understood as a generic phrase rather than the established title “Son of Man.” The compound “మనుష్యకుమారుని” preserves the title’s recognizable biblical and Danielic resonance without adding interpretation.
  - severity: low
    issue: The direct objects “మాంసం” and “రక్తం” are unmarked.
    rationale: Zero object marking can be acceptable in Telugu, but “మాంసాన్ని” and “రక్తాన్ని” make the syntactic relation explicit in this deliberately vivid saying.
  revised_text: 'అందుకు యేసు వారితో ఇలా అన్నాడు: “నిజంగా, నిజంగా మీతో చెబుతున్నాను: మీరు మనుష్యకుమారుని మాంసాన్ని తిని, ఆయన రక్తాన్ని తాగకపోతే, మీలో జీవం ఉండదు.[a]”'
