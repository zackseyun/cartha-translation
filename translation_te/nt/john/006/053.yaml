- from: 'అందుకు యేసు వారితో ఇలా అన్నాడు: “నిజంగా, నిజంగా మీతో చెబుతున్నాను: మీరు మనుష్య కుమారుని మాంసం తిని, ఆయన రక్తం తాగకపోతే, మీలో జీవం ఉండదు.[a]”'
  to: 'అందుకు యేసు వారితో ఇలా అన్నాడు: “నిజంగా, నిజంగా మీతో చెబుతున్నాను: మీరు మనుష్యకుమారుని మాంసాన్ని తిని, ఆయన రక్తాన్ని తాగకపోతే, మీలో జీవం ఉండదు.[a]”'
