translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘అల్లకల్లోలం’ సముద్రపు కలతను సజీవంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో నిలిపాం.
