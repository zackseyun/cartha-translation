lexical_decisions:
- source_word: Ὡς δὲ
  choice: అయినప్పుడు
  rationale: ὡς ఇక్కడ కాలసంబంధమైన ఉపవాక్యాన్ని పరిచయం చేస్తుంది; δέ స్వల్ప కథన మార్పును సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ప్రత్యేక సంధానపదం చేర్చకుండా ‘అయినప్పుడు’ ద్వారా కాలసంబంధాన్ని సహజంగా తెలిపాం.
- source_word: ὀψία ἐγένετο
  choice: సాయంకాలమైనప్పుడు
  rationale: ఇది సాయంకాలం రావడాన్ని తెలిపే గ్రీకు నుడికారం. ‘సాయంకాలమైనప్పుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి మూల భావాన్ని నిలుపుతుంది.
- source_word: κατέβησαν
  choice: దిగివెళ్లారు
  rationale: καταβαίνω కిందికి కదలడాన్ని సూచిస్తుంది. కథన దృష్టికోణానికి అనుగుణంగా ‘దిగివెళ్లారు’ అనేది దిశను, కదలికను రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు
  rationale: గ్రీకు నామవాచక-స్వామ్య నిర్మాణానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: సముద్రం దగ్గరికి
  rationale: చలనక్రియతో కూడిన ἐπί + ద్వితీయా విభక్తి నీటి ప్రాంతం దగ్గరికి లేదా వైపుకు కదలడాన్ని సూచిస్తుంది. θάλασσα అనే మూలపదాన్ని ‘సముద్రం’గా నిలుపుతూ గమ్యాన్ని ‘దగ్గరికి’తో స్పష్టంచేశాం.
