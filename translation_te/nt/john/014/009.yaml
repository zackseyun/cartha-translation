id: JHN.14.9
reference: John 14:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: te
  text: 'యేసు అతనితో ఇలా అన్నాడు: “నేను ఇంతకాలంగా[a] మీతో ఉన్నాను; అయినా నీవు నన్ను తెలుసుకోలేదా, ఫిలిప్పూ? నన్ను చూసినవాడు తండ్రిని చూశాడు. ‘తండ్రిని మాకు చూపించు’ అని నీవు ఎలా అంటున్నావు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇంత సుదీర్ఘకాలంగా.”
    reason: Τοσούτῳ χρόνῳ అనే పదబంధంలోని కాలవ్యవధి బలాన్ని మరింత స్పష్టంగా తెలిపే పదప్రయోగ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: ఇంతకాలంగా
  rationale: τοσοῦτος + χρόνος అనే దత్తివిభక్తి ప్రయోగం కాలవ్యవధిని సూచిస్తుంది. ‘ఇంతకాలంగా’ సహజమైన ఆధునిక తెలుగు ప్రయోగం; దీర్ఘకాలంగా కలిసివున్నప్పటికీ ఫిలిప్పు గ్రహించలేదనే మందలింపు ధ్వనిని నిలుపుతుంది.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: మీతో ఉన్నాను
  rationale: గ్రీకులో వర్తమాన కాలం ఉన్నప్పటికీ, ముందు వచ్చిన ‘ఇంతకాలంగా’ అనే పదం గతంలో మొదలై మాటల సమయంవరకు కొనసాగుతున్న యేసు సన్నిధిని తెలుగులో స్పష్టంగా తెలియజేస్తుంది. బహువచన ὑμῶνను ‘మీతో’గా ఉంచాం.
- source_word: οὐκ ἔγνωκάς με
  choice: అయినా నీవు నన్ను తెలుసుకోలేదా
  rationale: γινώσκω యొక్క సంపూర్ణ కాలరూపం, లభించిన అవకాశమంతటికీ యేసును నిజంగా తెలుసుకోని స్థితిని సూచిస్తుంది. ‘అయినా’ καί యొక్క సందర్భానుగుణ విరోధ భావాన్ని, ప్రశ్నలోని మందలింపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Φίλιππε
  choice: ఫిలిప్పూ
  rationale: సంబోధన విభక్తిని ఆధునిక తెలుగు పిలుపు రూపమైన ‘ఫిలిప్పూ’తో వ్యక్తం చేశాం.
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: నన్ను చూసినవాడు
  rationale: నిర్దేశకంతో కూడిన సంపూర్ణ కృదంతాన్ని వ్యక్తిని సూచించే సహజ తెలుగు రూపంగా అనువదించాం; ‘చూసిన’ అనే రూపం జరిగిన దర్శనానికి ప్రస్తుతం నిలిచే ప్రాముఖ్యతను సందర్భంలో మోస్తుంది.
- source_word: ἑώρακεν τὸν πατέρα
  choice: తండ్రిని చూశాడు
  rationale: గ్రీకులో ఉన్న ‘తండ్రి’ అనే నేరమైన యోహాను శైలిని అలాగే ఉంచి, ‘నా తండ్రి’ లేదా వివరణాత్మక విస్తరణను చేర్చలేదు.
- source_word: πῶς σὺ λέγεις
  choice: నీవు ఎలా అంటున్నావు
  rationale: πῶς ఇక్కడ ఆశ్చర్యం, అభ్యంతరం కలిగిన అలంకారిక ప్రశ్న. ‘ఎలా అంటున్నావు’ దాని బలాన్ని సహజ తెలుగులో నిలుపుతుంది; స్పష్టంగా ఉన్న σὺను ‘నీవు’గా వ్యక్తం చేశాం.
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: తండ్రిని మాకు చూపించు
  rationale: δείκνυμι ఆజ్ఞారూపానికి ‘చూపించు’ నేరమైన, సహజ సమానార్థకం. ముందటి వచనంలోని ఫిలిప్పు అభ్యర్థనను యేసు యథాతథంగా ఉటంకిస్తున్న నిర్మాణాన్ని నిలిపాం.
theological_decisions:
- issue: యేసును చూడటానికి, తండ్రిని చూడటానికి మధ్య సంబంధం
  choice: ‘నన్ను చూసినవాడు తండ్రిని చూశాడు’ అని నేరుగా అనువదించాం.
  alternative: ‘నన్ను చూసినవాడు తండ్రి ఎలాంటివాడో చూశాడు’ అని బలహీనమైన ప్రాతినిధ్య భావంతో చెప్పడం; లేదా తరువాతి సిద్ధాంత పదజాలాన్ని జోడించి అస్తిత్వ సంబంధాన్ని విస్తరించడం.
  rationale: మూలవాక్యం చేసే బలమైన క్రీస్తుసంబంధ ప్రకటనను తగ్గించకూడదు; అదే సమయంలో గ్రీకు వాక్యంలో లేని సిద్ధాంత వివరణను చేర్చకూడదు. నేరమైన రూపం మూలంలోని బలాన్నీ, దాని theological tensionనూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. సంభాషణ ప్రత్యక్షత కోసం ‘ఫిలిప్పూ’, ‘చూపించు’ వంటి సహజ సంబోధన, ఆజ్ఞారూపాలను ఉంచాం. [a] సూచికను అది వివరిస్తున్న ‘ఇంతకాలంగా’ పదబంధం వెంట ఉంచాం.
