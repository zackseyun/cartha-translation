id: JHN.14.5
reference: John 14:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: te
  text: 'తోమా ఆయనతో ఇలా అన్నాడు: “ప్రభువా, మీరు ఎక్కడికి వెళ్తున్నారో మాకు తెలియదు.[b] దారిని మేము ఎలా తెలుసుకోగలం?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దారిని తెలుసుకోవడం మాకు ఎలా సాధ్యం?”
    reason: సామర్థ్యాన్ని తెలిపే δυνάμεθαకు మరింత స్పష్టమైన అనువాద ప్రత్యామ్నాయం.
  - marker: b
    text: ఈ వచనంలో ‘తెలుసు’ అనే గ్రీకు క్రియ రెండుసార్లు వాడబడింది—మొదట ‘మాకు తెలియదు’ అనే మాటలో, తరువాత ‘దారిని … తెలుసుకోగలం’ అనే మాటలో.
    reason: మూలంలోని ఒకే గ్రీకు క్రియకు చెందిన రెండు భిన్న రూపాల పునరుక్తిని పాఠకుడు గుర్తించేందుకు.
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: తోమా ఆయనతో … అన్నాడు
  rationale: గ్రీకు కథనంలోని చారిత్రక వర్తమాన కాలాన్ని సహజమైన తెలుగు కథనశైలిలో భూతకాలంగా అనువదించాం. αὐτῷ భావాన్ని ‘ఆయనతో’ అని స్పష్టంగా ఉంచాం.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: గౌరవపూర్వక సంబోధనతోపాటు యోహాను సువార్తలో ఉండగల లోతైన భావాన్ని కూడా నిలుపుతుంది; కేవలం మర్యాదపూర్వకమైన ‘అయ్యా’గా పరిమితం చేయదు.
- source_word: οὐκ οἴδαμεν
  choice: మాకు తెలియదు
  rationale: ఇక్కడ οἶδα జ్ఞానాన్ని సూచిస్తుంది. ‘మాకు తెలియదు’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ποῦ ὑπάγεις
  choice: మీరు ఎక్కడికి వెళ్తున్నారో
  rationale: ὑπάγωకు వెళ్లిపోవడం అనే ఛాయ ఉండవచ్చు; అయితే ఇక్కడ గమ్యస్థానం తెలియదనే తోమా మాటను మాత్రమే తెలిపి, యేసు తండ్రి దగ్గరకు తిరిగి వెళ్లడం అనే భావాన్ని ముందుగానే వివరణగా చేర్చలేదు.
- source_word: πῶς δυνάμεθα
  choice: ఎలా … తెలుసుకోగలం?
  rationale: πῶς ప్రశ్నార్థక భావాన్ని, δύναμαι సామర్థ్యాన్ని సహజమైన ఆధునిక తెలుగు ప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: τὴν ὁδὸν
  choice: దారిని
  rationale: ὁδόςకు సందర్భానుకూలమైన సాధారణ తెలుగు సమానార్థకం. తరువాతి వచనంలోని అంశ సంబంధాన్ని నిలుపుతూ, ఇక్కడ అదనపు వివరణను చేర్చదు.
- source_word: εἰδέναι
  choice: తెలుసుకోగలం
  rationale: δυνάμεθαకు అనుబంధమైన అనంతక్రియ భావాన్ని తెలుగులో సామర్థ్య రూపంతో తెలిపాం. ‘తెలియదు/తెలుసుకోగలం’ అనే పదబంధాలు గ్రీకులోని οἴδαμεν/εἰδέναι పునరుక్తిని సాధ్యమైనంతవరకు ప్రతిబింబిస్తాయి.
theological_decisions:
- issue: యోహాను సువార్తలో ὑπάγειςకు ఉండగల వేదాంతపరమైన భావఛాయ
  choice: ‘మీరు ఎక్కడికి వెళ్తున్నారో’ అని తటస్థంగా అనువదించడం
  alternative: ‘మీరు ఎక్కడికి వెళ్లిపోతున్నారో’ లేదా ‘మీరు ఎక్కడికి బయలుదేరుతున్నారో’
  rationale: యేసు గమ్యానికి యోహాను సువార్తలో వేదాంత ప్రాముఖ్యత ఉన్నప్పటికీ, తోమా మాటలు ఆ గమ్యం తనకు తెలియదనే ఉద్విగ్నతను మాత్రమే వ్యక్తం చేస్తున్నాయి. తటస్థ అనువాదం ఆ ఉద్విగ్నతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణశైలిని ఉపయోగించాం. యేసును ఉద్దేశించిన మాటల్లో ‘మీరు’ అనే గౌరవ బహువచనం వాడాం. మూలంలోని ప్రశ్న, అజ్ఞానం, సామర్థ్యానికి సంబంధించిన భావాలను సరళంగా ఉంచాం.
