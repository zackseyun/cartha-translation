id: JHN.14.24
reference: John 14:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: te
  text: నన్ను ప్రేమించనివాడు నా మాటలను పాటించడు. మీరు వింటున్న మాట[a] నాది కాదు; అది నన్ను పంపిన తండ్రిది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సందేశం.”
    reason: λόγος ఇక్కడ ఒకే పదాన్ని కాక, సమగ్ర బోధ లేదా సందేశాన్ని సూచించవచ్చు.
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: నన్ను ప్రేమించనివాడు
  rationale: నిర్దిష్ట వ్యక్తిని కాక, యేసును ప్రేమించని లక్షణం గల ఎవరినైనా సూచించే substantival participle భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοὺς λόγους μου
  choice: నా మాటలను
  rationale: బహువచనాన్ని నిలుపుతూ, యేసు పలికిన బోధలను సూచించే సహజమైన తెలుగు పదబంధం.
- source_word: τηρεῖ
  choice: పాటించడు
  rationale: ఈ సందర్భంలో τηρέω అనేది కేవలం కాపాడడం కాక, చెప్పినదాన్ని విధేయతతో ఆచరించడం అనే భావాన్ని కలిగిస్తుంది; ‘పాటించు’ ఈ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ὁ λόγος ὃν ἀκούετε
  choice: మీరు వింటున్న మాట
  rationale: ఏకవచన λόγος‌ను నిలుపుతూ, వారు వింటున్న సమగ్ర బోధ లేదా సందేశాన్ని సూచిస్తుంది.
- source_word: οὐκ ἔστιν ἐμὸς
  choice: నాది కాదు
  rationale: ἐμός అనే స్వామ్యరూపాన్ని నేరుగా, సంక్షిప్తంగా అందిస్తుంది; మూలం లేదా స్వామ్యం అనే భావాన్ని ముందుగానే ఒకదానికే పరిమితం చేయదు.
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: అది నన్ను పంపిన తండ్రిది
  rationale: గ్రీకు షష్ఠీ విభక్తిలోని స్వామ్య/మూల భావాన్ని సహజమైన తెలుగులో చూపుతూ, ‘నన్ను పంపిన’ అనే విశేషణ భాగం ‘తండ్రి’ని స్పష్టంగా వివరిస్తుంది.
theological_decisions:
- issue: యేసు బోధకు మరియు తండ్రికి మధ్య సంబంధం
  choice: ‘నాది కాదు; అది నన్ను పంపిన తండ్రిది’
  alternative: ‘నన్ను పంపిన తండ్రి నుండి వచ్చింది’
  rationale: ఎంచుకున్న రూపం కుమారుడు మరియు తండ్రి మధ్య భేదాన్ని, అలాగే పలికిన మాట యొక్క ఏకత్వాన్ని నిలుపుతుంది. గ్రీకు వాక్యంలో ఉన్న స్వామ్యం/మూలం మధ్య భావ విస్తృతిని ఒకే వివరణకు కుదించదు; యేసు తన బోధను నిరాకరిస్తున్నాడనే భావాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గౌరవప్రదమైన శైలిలో రూపొందించబడింది. ‘మాటలను’ అనే బహువచనం మరియు ‘మాట’ అనే ఏకవచనం మధ్య మూలపాఠంలోని వ్యత్యాసం ఉద్దేశపూర్వకంగా నిలుపబడింది.
