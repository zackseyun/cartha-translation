revisions:
- from: శాంతిని మీకు విడిచిపెడుతున్నాను; నా శాంతిని మీకు ఇస్తున్నాను. లోకం ఇచ్చినట్లు నేను మీకు ఇవ్వను. మీ హృదయం కలవరపడనివ్వకండి; భయంతో ధైర్యం కోల్పోనివ్వకండి.[a]
  to: శాంతిని మీకు వదిలివెళ్తున్నాను; నా శాంతిని మీకు ఇస్తున్నాను. లోకం ఇచ్చినట్లుగా నేను మీకు ఇవ్వను. మీ హృదయం కలవరపడనివ్వకండి; ధైర్యం కోల్పోనివ్వకండి.[a]
  rationale: The revision makes the farewell nuance of ἀφίημι more natural in Telugu and refines the final imperative so that it directly reflects δειλιάω while maintaining the Greek's shared singular subject, ‘మీ హృదయం.’ No theological interpretation has been added or narrowed, and the footnote remains anchored to the final prohibition.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:30:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the repeated gift of peace, the contrast with the world's manner of giving, and the two prohibitions. A small adjustment better represents ἀφίημι as leaving peace with the disciples while departing, rather than merely setting it aside. The final prohibition should retain the heart as the shared subject without introducing an unnecessary causal expansion ('భయంతో').
  naturalness: The proposed revision uses natural modern standard Telugu. ‘వదిలివెళ్తున్నాను’ clearly fits the departure context, and repeating the negative imperative with the shared subject is clear and idiomatic.
  terminology: ‘శాంతి,’ ‘లోకం,’ and ‘హృదయం’ appropriately preserve the breadth and Johannine resonance of the Greek. ‘ధైర్యం కోల్పోవడం’ is a non-pejorative, contextually apt rendering of δειλιάω; the footnote supplies legitimate lexical alternatives.
  issues:
  - severity: low
    issue: ‘విడిచిపెడుతున్నాను’ can sound like simply abandoning or relinquishing something.
    rationale: In this farewell context, ἀφίημι means leaving peace with the disciples. ‘వదిలివెళ్తున్నాను’ makes that sense more explicit without adding interpretation.
  - severity: low
    issue: ‘భయంతో ధైర్యం కోల్పోనివ్వకండి’ adds a causal phrasing and may leave the shared subject less explicit.
    rationale: δειλιάτω itself denotes becoming fearful or losing courage. ‘ధైర్యం కోల్పోనివ్వకండి’ preserves the lexical sense cleanly, with ‘మీ హృదయం’ governing both clauses.
  revised_text: శాంతిని మీకు వదిలివెళ్తున్నాను; నా శాంతిని మీకు ఇస్తున్నాను. లోకం ఇచ్చినట్లుగా నేను మీకు ఇవ్వను. మీ హృదయం కలవరపడనివ్వకండి; ధైర్యం కోల్పోనివ్వకండి.[a]
