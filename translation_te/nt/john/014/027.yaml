id: JHN.14.27
reference: John 14:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: te
  text: శాంతిని మీకు వదిలివెళ్తున్నాను; నా శాంతిని మీకు ఇస్తున్నాను. లోకం ఇచ్చినట్లుగా నేను మీకు ఇవ్వను. మీ హృదయం కలవరపడనివ్వకండి; ధైర్యం కోల్పోనివ్వకండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భయపడనివ్వకండి,’ లేదా ‘పిరికిపడనివ్వకండి.’ గ్రీకు క్రియ భయపడడం లేదా ధైర్యం కోల్పోవడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: శాంతిని
  rationale: ‘శాంతి’ అనే సాధారణ పదం కలహం లేకపోవడం కంటే విస్తృతమైన యోహాను భావాన్ని పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: ἀφίημι
  choice: విడిచిపెడుతున్నాను
  rationale: ఇక్కడ యేసు తన శాంతిని శిష్యుల వద్ద ఉంచి వెళ్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘వీలునామాగా ఇస్తున్నాను’ అనేది అతిగా వ్యాఖ్యానాత్మకం.
- source_word: τὴν ἐμὴν
  choice: నా శాంతిని
  rationale: గ్రీకులోని ఉద్ఘాటిత స్వామ్య భావాన్ని సహజంగా నిలుపుతూ, యేసు ఇచ్చే శాంతిని లోకం ఇచ్చేదానితో వేరు చేస్తుంది.
- source_word: δίδωμι
  choice: ఇస్తున్నాను / ఇవ్వను
  rationale: మూలంలోని పునరావృత క్రియను, యేసు ఇచ్చే విధానానికీ లోకం ఇచ్చే విధానానికీ ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν
  choice: లోకం ఇచ్చినట్లు నేను మీకు ఇవ్వను
  rationale: గ్రీకు వాక్యంలోని పోలికను, ఉద్ఘాటిత ‘నేను’ అనే వ్యత్యాసాన్ని సహజమైన తెలుగు పదక్రమంలో కాపాడుతుంది.
- source_word: κόσμος
  choice: లోకం
  rationale: యోహాను రచనలోని విస్తృత ప్రతిధ్వనిని వ్యాఖ్యానాత్మకంగా ‘మానవ వ్యవస్థ’ అని కుదించకుండా నిలుపుతుంది.
- source_word: μὴ ταρασσέσθω
  choice: కలవరపడనివ్వకండి
  rationale: నిషేధార్థక ఆజ్ఞను సహజంగా వ్యక్తం చేస్తూ యోహాను 14:1తో పదబంధ సంబంధాన్ని నిలుపగలదు.
- source_word: ὑμῶν ἡ καρδία
  choice: మీ హృదయం
  rationale: బహువచన స్వామ్యంతో కూడిన గ్రీకు సమష్టి ఏకవచనాన్ని అలాగే నిలుపుతుంది.
- source_word: μηδὲ δειλιάτω
  choice: భయంతో ధైర్యం కోల్పోనివ్వకండి
  rationale: కేవలం భయపడటమే కాక పిరికితనం లేదా ధైర్యం సడలిపోవడం అనే δειλιάω భావాన్ని, నిందాత్మకంగా వినిపించే ‘పిరికిగా’ అనే పదం లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు ఇచ్చే శాంతి స్వభావం
  choice: ప్రధాన పాఠ్యంలో కేవలం ‘శాంతి’ మరియు ‘నా శాంతి’ అని ఉంచడం
  alternative: దీనిని అంతరంగ ప్రశాంతతగా, దేవునితో సమాధానంగా, లేదా నిబంధనాత్మక/అంత్యకాల సంపూర్ణ క్షేమంగా విస్తరించడం
  rationale: ఈ వచనం శాంతి భావాన్ని ఒకే అర్థానికి పరిమితం చేయదు; విస్తృత పదాన్ని నిలపడం దాని వేదాంతపరమైన సమృద్ధిని, ఉద్వేగాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మీ హృదయం’ అనే సమష్టి ఏకవచనం మూలరూపాన్ని నిలుపుతుంది; చివరి రెండు ఆజ్ఞలు సాధారణ పాఠకుడికి స్పష్టంగా ఉండేలా సమాంతరంగా రూపొందించబడ్డాయి.
