id: JHN.14.7
reference: John 14:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: te
  text: మీరు నన్ను తెలిసి ఉంటే, నా తండ్రి కూడా మీకు తెలిసి ఉండేవారు. ఇప్పటినుంచి ఆయన మీకు తెలుసు, మీరు ఆయనను చూశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώκειτέ / γινώσκετε
  choice: ఎరిగి ఉంటే / ఎరుగుతున్నారు
  rationale: వ్యక్తిని కేవలం సమాచారపరంగా తెలుసుకోవడం కాక, వ్యక్తిగతంగా గుర్తించి తెలుసుకోవడం అనే భావాన్ని ‘ఎరుగు’ సహజంగా తెలియజేస్తుంది; రెండు గ్రీకు క్రియారూపాల కాలభేదాన్ని కూడా నిలుపుతుంది.
- source_word: ᾔδειτε
  choice: ఎరిగి ఉండేవారు
  rationale: ప్రతిఫల వాక్యంలోని గత అవాస్తవ షరతును సహజమైన ఆధునిక తెలుగు రూపంలో వ్యక్తపరుస్తుంది.
- source_word: ἑωράκατε
  choice: చూశారు
  rationale: గ్రీకు సంపూర్ణకాల రూపంలోని ఇప్పటికీ ప్రాముఖ్యమున్న అనుభవాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἀπ’ ἄρτι
  choice: ఇప్పటినుంచి
  rationale: కాలసూచక పదబంధానికి నేరమైన, సాధారణ తెలుగు సమానం.
theological_decisions:
- issue: యేసును ఎరుగుటకు తండ్రిని ఎరుగుటతో ఉన్న సంబంధం
  choice: ‘నా తండ్రిని కూడా ఎరిగి ఉండేవారు’ అని సంబంధాన్ని యథాతథంగా ఉంచడం
  alternative: ‘నా ద్వారా తండ్రిని తెలుసుకునేవారు’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: మూలంలో ‘ద్వారా’ లేదు; క్రీస్తు-తండ్రి సంబంధంలోని బలాన్ని గానీ ఉద్వేగాన్ని గానీ అదనపు వివరణతో పరిష్కరించలేదు.
- issue: ‘ఇప్పటినుంచి’ తరువాతి γινώσκετε సూచనార్థకమా లేక ఆజ్ఞార్థకమా
  choice: సూచనార్థకంగా ‘మీరు ఆయనను ఎరుగుతున్నారు’
  alternative: ఆజ్ఞార్థకంగా ‘ఆయనను తెలుసుకోండి’
  rationale: సందర్భం మరియు వెంట వచ్చే ‘చూశారు’ అనే సూచనార్థక క్రియతో కలిపి చదివినప్పుడు ప్రకటనగా తీసుకోవడం సముచితం; అయినా గ్రీకు రూపం స్వతహాగా రెండు విధాలుగా అర్థమయ్యే అవకాశం కలిగి ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘తెలుసు’ కంటే వ్యక్తిగత పరిచయాన్ని సూచించే ‘ఎరుగు’ను ఎంచుకున్నాం; వాక్య నిర్మాణాన్ని సహజంగా ఉంచేందుకు చివరి రెండు ఖండాలను అర్ధవిరామంతో కలిపాం.
