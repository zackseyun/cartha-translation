translation:
  language: te
  text: మీరు నా పేరున నన్ను[a] ఏదైనా అడిగితే, నేను దానిని చేస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతులలో, ‘మీరు నా పేరున ఏదైనా అడిగితే, నేను దానిని చేస్తాను’ అని ఉంది; వాటిలో ‘నన్ను’ అనే పదం లేదు.
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: అడిగితే
  rationale: ἐάν షరతును సూచిస్తుంది. తెలుగులో క్రియకు జతచేసిన ‘-తే’ రూపం సహజంగా ‘if’ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: τι
  choice: ఏదైనా
  rationale: షరతు వాక్యంలో అనిర్దిష్టమైన, విస్తృత పరిధిగల అభ్యర్థనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: αἰτήσητέ
  choice: మీరు ... అడిగితే
  rationale: ఇది ἐάν చేత నియంత్రించబడిన ద్వితీయ పురుష బహువచన aorist subjunctive. తెలుగు షరతు క్రియారూపం దాని సందర్భార్థాన్ని సహజంగా అందిస్తుంది; ‘అడుగు’ అనేది అభ్యర్థన భావాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: με
  choice: నన్ను
  rationale: SBLGNT పాఠంలో ప్రత్యక్ష కర్మ సర్వనామం ఉంది; కాబట్టి దాన్ని స్పష్టంగా అనువదించి, అభ్యర్థన యేసుకే చేయబడుతున్న పాఠాన్ని నిలుపుతున్నాం.
- source_word: ἐν τῷ ὀνόματί μου
  choice: నా పేరులో
  rationale: యోహాను రచనల్లోని ఈ స్థిరమైన వ్యక్తీకరణను అక్షరార్థానికి సమీపంగా, తెలుగు క్రైస్తవ వాడుకలో సహజంగా ఉంచుతుంది; ‘నా అధికారంతో’ వంటి వివరణాత్మక విస్తరణను ప్రధాన పాఠంలో చేర్చదు.
- source_word: ἐγὼ
  choice: నేను
  rationale: గ్రీకులోని స్పష్టమైన కర్త సర్వనామాన్ని తెలుగులో ఉంచడం ద్వారా దాని స్వల్ప ఉద్ఘాటనను అతిశయింపకుండా ప్రతిబింబిస్తుంది.
- source_word: ποιήσω
  choice: దాన్ని చేస్తాను
  rationale: భవిష్యత్ క్రియను ‘చేస్తాను’గా అందించి, ముందు చెప్పిన ‘ఏదైనా’ అనే అభ్యర్థనను సూచించేందుకు సహజమైన తెలుగు కర్మసర్వనామం ‘దాన్ని’ను ఉపయోగిస్తున్నాం.
theological_decisions:
- issue: με (‘నన్ను’) ఉనికి మరియు అభ్యర్థన నేరుగా యేసుకు చేయబడుతున్న భావం
  choice: ప్రధాన పాఠంలో ‘నన్ను ... అడిగితే’ అని అనువదించడం
  alternative: ‘మీరు నా పేరులో ఏదైనా అడిగితే, నేను దాన్ని చేస్తాను’—‘నన్ను’ లేని పాఠం
  rationale: అందించిన SBLGNT గ్రీకు పాఠంలో με ఉంది. అందువల్ల ప్రధాన పాఠం దాన్ని అనువదిస్తుంది; దాన్ని లేని ప్రతుల పాఠాన్ని పాదటిప్పణిలో పారదర్శకంగా తెలియజేస్తుంది. ఇలా చేయడం క్రీస్తు సంబంధమైన పాఠ్య ఉద్రిక్తతను తొలగించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. గ్రీకు పదక్రమాన్ని బలవంతంగా అనుసరించకుండా, ‘నా పేరులో నన్ను ఏదైనా అడిగితే’ అనే నిర్మాణంతో మూలంలోని అర్థసంబంధాలను స్పష్టంగా నిలిపాం. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠంలో సంబంధిత పాఠ్యభేదం వద్ద ఉంచబడింది.
