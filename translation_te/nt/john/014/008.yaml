id: JHN.14.8
reference: John 14:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Φίλιππος· Κύριε, δεῖξον ἡμῖν τὸν πατέρα, καὶ ἀρκεῖ ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: te
  text: 'ఫిలిప్పు ఆయనతో ఇలా అన్నాడు: “ప్రభువా[a], తండ్రిని మాకు చూపించండి; అది మాకు చాలు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయ్యా, తండ్రిని మాకు చూపించండి; అది మాకు చాలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, ఆధునిక తెలుగు కథనంలో సంభాషణను సహజంగా పరిచయం చేయడానికి భూతకాల రూపం వాడబడింది.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో తెలిపే దత్తి విభక్తిని సహజమైన తెలుగులో ‘ఆయనతో’గా ఇచ్చాం.
- source_word: Φίλιππος
  choice: ఫిలిప్పు
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపంలో ఇచ్చాం.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριος సంబోధన రూపం. ఈ యోహాను సందర్భంలో యేసుపట్ల గౌరవాన్నీ, క్రీస్తు సంబంధమైన భావగాంభీర్యాన్నీ నిలుపుతుంది.
- source_word: δεῖξον
  choice: చూపించండి
  rationale: దείκνυμι ఆజ్ఞార్థక రూపం; ఏదో ఒకరిని కనిపించేలా లేదా తెలిసేలా చేయమనే ప్రత్యక్ష విన్నపాన్ని సహజ తెలుగు మర్యాదార్థక రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἡμῖν
  choice: మాకు
  rationale: ‘తండ్రిని మాకు చూపించండి’ అనే తెలుగు నిర్మాణంలో దత్తి బహువచనానికి సహజ సమానం.
- source_word: τὸν πατέρα
  choice: తండ్రిని
  rationale: యోహాను సందర్భంలో ఇది ప్రత్యేకంగా యేసు తండ్రియైన దేవుణ్ణి సూచిస్తుంది; తెలుగు వాక్యంలో సహజమైన కర్మ రూపం వాడబడింది.
- source_word: καὶ
  choice: ;
  rationale: గ్రీకు καὶ విన్నపాన్ని దాని ఫలితంతో కలుపుతుంది. తెలుగులో అర్ధవిరామం అదే సమీప సంబంధాన్ని సహజంగా చూపిస్తుంది; అదనపు కారణార్థాన్ని చేర్చదు.
- source_word: ἀρκεῖ
  choice: చాలు
  rationale: ‘సరిపోవడం’ అనే అర్థాన్ని ఆధునిక, సహజ, సంక్షిప్త తెలుగులో తెలియజేస్తుంది.
- source_word: ἡμῖν
  choice: మాకు
  rationale: ἀρκεῖతో వచ్చిన దత్తి రూపం ఎవరికది సరిపోతుందో తెలుపుతుంది; ‘మాకు చాలు’ సహజ తెలుగు.
theological_decisions:
- issue: యేసును ఉద్దేశించిన κύριος సంబోధన
  choice: ప్రభువా
  alternative: అయ్యా / గురువా
  rationale: ‘ప్రభువా’ గౌరవాన్ని మరియు యోహాను సువార్తలోని క్రీస్తు సంబంధమైన భావబరువును నిలుపుతుంది. ‘అయ్యా’ సాధ్యమైన మర్యాదార్థం అయినా ఈ సందర్భంలో బలహీనంగా ఉంటుంది; ‘గురువా’ మూలపదానికి అదనపు నిర్దిష్టతను చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. యేసును ఉద్దేశించి తెలుగు వాడుకకు అనుగుణంగా మర్యాదార్థక బహువచన క్రియారూపం ఉపయోగించబడింది.
