  text: If you love me[a], you will keep my commandments.
translation:
  language: te
  text: మీరు నన్ను ప్రేమిస్తే, నా ఆజ్ఞలను పాటిస్తారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా ఆజ్ఞలకు లోబడతారు.’ మూలంలోని క్రియకు పాటించడం, గైకొనడం, కాపాడడం లేదా లోబడడం అనే భావాలు రావచ్చు; ‘పాటిస్తారు’ దాని విస్తృత భావాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: ప్రేమిస్తే
  rationale: ἐάν షరతును సూచిస్తుంది. తెలుగులో క్రియకు ‘-తే’ ప్రత్యయం జోడించడం ద్వారా ‘అయితే’ అనే అదనపు పదం లేకుండానే సహజంగా షరతు వ్యక్తమవుతుంది.
- source_word: ἀγαπᾶτέ
  choice: మీరు … ప్రేమిస్తే
  rationale: వర్తమాన కర్తరి సంభావనార్థక బహువచన రూపం. తెలుగులో సందర్భానుగుణంగా ‘ప్రేమిస్తే’ అని అనువదించడం సహజం; ‘ప్రేమిస్తూ ఉంటే’ అనడం మూలంలో తప్పనిసరిగా లేని కొనసాగింపు భావాన్ని అధికంగా చూపిస్తుంది.
- source_word: με
  choice: నన్ను
  rationale: యేసును సూచించే ఏకవచన ప్రత్యక్ష కర్మ సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: τὰς ἐντολὰς τὰς ἐμὰς
  choice: నా ఆజ్ఞలను
  rationale: ἐντολάς‌కు ‘ఆజ్ఞలు’ గంభీరతను, యోహాను రచనలోని గుర్తించదగిన వాడుకను నిలుపుతుంది. ఆర్టికల్‌తో కూడిన ἐμὰς‌ను తెలుగులో సహజంగా ‘నా’ అని వ్యక్తం చేశాం.
- source_word: τηρήσετε
  choice: పాటిస్తారు
  rationale: ఇది భవిష్యత్ కర్తరి సూచనార్థక బహువచన రూపం. ‘పాటిస్తారు’ అనేది తెలుగులో ఆజ్ఞలను గైకొనడం/ఆచరించడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; దీనిని ఆజ్ఞార్థకంగా ‘పాటించండి’ అని మార్చలేదు.
theological_decisions:
- issue: τηρήσετεను ఆజ్ఞగా అనువదించాలా, భవిష్యత్ ప్రకటనగా అనువదించాలా
  choice: భవిష్యత్ ప్రకటనగా ‘పాటిస్తారు’
  alternative: ఆజ్ఞార్థకంగా ‘నా ఆజ్ఞలను పాటించండి’
  rationale: గ్రీకు రూపం భవిష్యత్ సూచనార్థకం, ఆజ్ఞార్థకం కాదు. అందువల్ల యేసుపట్ల ప్రేమ ఆయన ఆజ్ఞలను పాటించడంలో వ్యక్తమవుతుందనే సంబంధాన్ని నేరుగా ఆజ్ఞగా మార్చకుండా, మూలంలోని వ్యాకరణ రూపాన్ని మరియు theological tensionను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. బహువచన ‘మీరు’ మూలంలోని రెండవ పురుష బహువచనాన్ని నిలుపుతుంది. ‘ఆజ్ఞలు’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి వాక్య గంభీరతను కాపాడుతుంది.
