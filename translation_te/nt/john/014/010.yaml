id: JHN.14.10
reference: John 14:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: te
  text: నేను తండ్రిలో ఉన్నాననీ, తండ్రి నాలో ఉన్నాడనీ నీవు నమ్మడం లేదా? నేను మీతో చెప్పే మాటలను నా అంతట నేనే[a] మాట్లాడడం లేదు. నాలో నిలిచి ఉన్న[b] తండ్రే తన కార్యాలు చేస్తున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా స్వంత చొరవతో’ లేదా ‘నా స్వంత అధికారంతో.’
    reason: ἀπ’ ἐμαυτοῦ అనే పదబంధం మూలం, స్వీయ చొరవ లేదా స్వంత అధికారాన్ని సూచించగలదు.
  - marker: b
    text: లేదా, ‘నాలో నివసిస్తున్న.’
    reason: μένων అనే పదానికి కొనసాగుతూ ఉండడం లేదా నివసించడం అనే భావాలు ఉన్నాయి.
lexical_decisions:
- source_word: πιστεύεις
  choice: నమ్మడం
  rationale: యోహాను సువార్తలో పదేపదే వచ్చే πιστεύω క్రియతో ఉన్న భావసంబంధాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండే పదాన్ని ఎంచుకున్నాం.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: తండ్రిలో ... నాలో
  rationale: పరస్పర అంతర్నివాసాన్ని సూచించే గ్రీకు ἐν పదాన్ని నేరుగా నిలిపి, ‘తండ్రితో ఏకమై’ వంటి వివరణాత్మక భావాన్ని పాఠ్యంలో చేర్చలేదు.
- source_word: ῥήματα
  choice: మాటలు
  rationale: ఇక్కడ పలికిన విషయాలను సూచించే సహజమైన, నేరమైన తెలుగు పదం.
- source_word: λέγω
  choice: చెప్పే
  rationale: మాటల విషయాన్ని తెలియజేసే క్రియగా సహజంగా ఉంది; తరువాతి λαλῶకు ‘మాట్లాడడం’ అని ఇచ్చి గ్రీకులోని స్వల్ప పదభేదాన్ని కూడా నిలిపాం.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: నా అంతట నేనే
  rationale: మాటల మూలం, స్వీయ చొరవ లేదా స్వంత అధికారం అనే భావాలకు చోటిస్తూ తెలుగులో సహజంగా వినిపించే రూపం.
- source_word: λαλῶ
  choice: మాట్లాడడం లేదు
  rationale: λέγωకు ఇచ్చిన ‘చెప్పే’ అనే రూపంతో స్వల్ప భేదాన్ని కాపాడుతూ సహజమైన తెలుగు వాక్యాన్ని రూపొందిస్తుంది.
- source_word: μένων
  choice: నిలిచి ఉన్న
  rationale: μένωలోని కొనసాగింపు భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘నివసిస్తున్న’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ποιεῖ
  choice: చేస్తున్నాడు
  rationale: వర్తమాన క్రియ భావాన్ని, ‘కార్యాలు’ అనే కర్మతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ ἔργα αὐτοῦ
  choice: తన కార్యాలు
  rationale: αὐτοῦలోని స్వామ్యార్థాన్ని స్పష్టంగా చూపిస్తూ, యోహాను రచనల్లో ἔργαకు ఉన్న ప్రాధాన్యమైన పదజాలాన్ని ‘కార్యాలు’గా నిలుపుతుంది.
theological_decisions:
- issue: తండ్రి, కుమారుని పరస్పర అంతర్నివాసం
  choice: ‘నేను తండ్రిలో ఉన్నాననీ, తండ్రి నాలో ఉన్నాడనీ’ అనే సంబంధ భాషను నేరుగా నిలిపాం.
  alternative: ‘నేనూ తండ్రి ఒక్కటే’ లేదా ‘తండ్రితో ఐక్యంలో ఉన్నాను’
  rationale: ఈ వాక్యంలోని ఖచ్చితమైన రూపాన్ని మరొక యోహానీయ వాక్యంతో సమానీకరించకుండా, దాని క్రీస్తు సంబంధమైన బలాన్నీ నిజమైన అస్పష్టతనూ కాపాడుతుంది.
- issue: యేసు మాటల్లోను కార్యాల్లోను తండ్రి క్రియాశీలత
  choice: ‘నా అంతట నేనే మాట్లాడడం లేదు’ మరియు ‘తండ్రే తన కార్యాలు చేస్తున్నాడు’ అని వ్యక్తుల మధ్య భేదాన్నీ వారి ఏకీకృత కార్యాన్నీ నిలిపాం.
  alternative: ‘నా స్వంత అధికారంతో మాట్లాడడం లేదు’ లేదా ‘తండ్రి నా ద్వారా కార్యాలు చేస్తున్నాడు’
  rationale: గ్రీకు పాఠ్యంలో లేని ‘అధికారం’ లేదా ‘నా ద్వారా’ అనే వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా, కుమారుని మాటలకు తండ్రితో ఉన్న మూలసంబంధాన్ని, తండ్రి క్రియాశీలతను యథాతథంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. యేసు ఒక వ్యక్తిని ఉద్దేశిస్తున్నందున ‘నీవు’ ఏకవచనం, శిష్యుల సమూహానికి చెప్పే మాటలకు ‘మీతో’ బహువచనం వాడాం. ‘తండ్రే’లోని ఉద్ఘాటన గ్రీకు ὁ δὲ πατήρ నిర్మాణంలోని వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
