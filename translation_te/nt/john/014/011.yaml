    reason: lexical_alternative
  revision_rationale: The revision clarifies the Greek elliptical conditional with ‘అలా నమ్మకపోతే’ while preserving the final imperative’s objectless form. It also uses a more idiomatic expression for belief grounded in the works, retaining the intensive force of αὐτά with ‘ఆ కార్యాలనే.’
