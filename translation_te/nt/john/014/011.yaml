revisions:
- from: నేను తండ్రిలో ఉన్నాననీ, తండ్రి నాలో ఉన్నాడనీ నన్ను నమ్మండి. లేకపోతే[a], ఆ కార్యాలనుబట్టే నమ్మండి.
  to: నేను తండ్రిలో ఉన్నాననీ, తండ్రి నాలో ఉన్నాడనీ నన్ను నమ్మండి. అలా నమ్మకపోతే[a], ఆ కార్యాలనే ఆధారంగా నమ్మండి.
  rationale: The revision clarifies the Greek elliptical conditional with ‘అలా నమ్మకపోతే’ while preserving the final imperative’s objectless form. It also uses a more idiomatic expression for belief grounded in the works, retaining the intensive force of αὐτά with ‘ఆ కార్యాలనే.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:30:25Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents πιστεύετέ μοι, the ὅτι content clause, and the reciprocal ἐν-language. It also appropriately leaves the final πιστεύετε without an added explicit object. However, ‘లేకపోతే’ can mean simply ‘otherwise’ and does not fully express the elliptical conditional contrast ‘but if not’—that is, if they do not believe Jesus’ statement. ‘అలా నమ్మకపోతే’ supplies only the antecedent implicit in the Greek and makes the connection clear without imposing a new object on the final imperative.
  naturalness: The wording is modern, clear, and appropriately reverent. ‘ఆ కార్యాలనుబట్టే’ is understandable, but ‘ఆ కార్యాల కారణంగా’ is more natural in current standard Telugu while retaining διά’s evidential/basis sense and αὐτά’s emphasis through ‘ఆ కార్యాలనే.’
  terminology: ‘తండ్రి,’ ‘కార్యాలు,’ and ‘నమ్మండి’ are suitable standard biblical Telugu terms. The literal relational expressions ‘తండ్రిలో’ and ‘నాలో’ correctly preserve Johannine mutual indwelling without doctrinal paraphrase.
  issues:
  - severity: medium
    issue: The conditional connector ‘లేకపోతే’ is less specific than εἰ δὲ μή.
    rationale: In context εἰ δὲ μή means ‘but if [you do] not’ accept the preceding appeal. ‘అలా నమ్మకపోతే’ naturally retains this elliptical reference and the contrast.
  - severity: low
    issue: ‘ఆ కార్యాలనుబట్టే’ is somewhat compressed and can sound less idiomatic in modern standard Telugu.
    rationale: ‘ఆ కార్యాలనే ఆధారంగా నమ్మండి’ gives the works their emphasized evidential role, reflects διά plus αὐτά, and does not supply an object for the final πιστεύετε.
  revised_text: నేను తండ్రిలో ఉన్నాననీ, తండ్రి నాలో ఉన్నాడనీ నన్ను నమ్మండి. అలా నమ్మకపోతే[a], ఆ కార్యాలనే ఆధారంగా నమ్మండి.
  revised_footnotes:
