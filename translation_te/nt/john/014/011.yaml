id: JHN.14.11
reference: John 14:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: te
  text: నేను తండ్రిలో ఉన్నాననీ, తండ్రి నాలో ఉన్నాడనీ నన్ను నమ్మండి. అలా నమ్మకపోతే[a], ఆ కార్యాలనే ఆధారంగా నమ్మండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: చివరి ‘నమ్మండి’ అనే క్రియకు గ్రీకు మూలంలో స్పష్టమైన కర్మ లేదు; ఆ కార్యాలే నమ్మడానికి తగిన ఆధారమని భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: నన్ను నమ్మండి
  rationale: πιστεύωతో కూడిన μοι దత్తి విభక్తి ఇక్కడ ‘నన్ను నమ్మండి’ అనే వ్యక్తిగత విజ్ఞప్తిని సహజంగా తెలియజేస్తుంది; ‘నేను చెప్పేది నమ్మండి’ అనడం మూలంలో లేని వివరణను చేర్చుతుంది.
- source_word: ὅτι
  choice: …ఉన్నాననీ …ఉన్నాడనీ
  rationale: ఇది నమ్మవలసిన విషయాన్ని పరిచయం చేసే content clause. తెలుగులో ‘అని’ నిర్మాణాన్ని సమాంతరంగా ‘ఉన్నాననీ…ఉన్నాడనీ’గా ఇవ్వడం సహజం.
- source_word: ἐν τῷ πατρὶ … ἐν ἐμοί
  choice: తండ్రిలో … నాలో
  rationale: యోహాను రచనలోని పరస్పర అంతర్నివాస భాషను యథాతథంగా నిలుపుతుంది; ‘తండ్రితో ఏకమై’ వంటి వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
- source_word: εἰ δὲ μή
  choice: లేకపోతే
  rationale: మొదటి విజ్ఞప్తిని అంగీకరించని సందర్భంలో ప్రత్యామ్నాయ ఆధారాన్ని సూచించే సంక్షిప్త షరతును సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: ఆ కార్యాలనుబట్టే
  rationale: διά కారణం లేదా ఆధారాన్ని సూచిస్తుంది; αὐτά కార్యాలపైనే దృష్టి పెడుతుంది. ‘నుబట్టే’ ఈ ఆధారార్థాన్నీ ఉద్ఘాటననూ సంక్షిప్తంగా అందిస్తుంది.
- source_word: πιστεύετε
  choice: నమ్మండి
  rationale: వర్తమాన ఆజ్ఞార్థకాన్ని తెలుగులో సాధారణ ఆజ్ఞగా సహజంగా ఇస్తుంది; మూలంలో స్పష్టంగా లేని కర్మను చేర్చదు.
theological_decisions:
- issue: కుమారుడు, తండ్రి పరస్పరం ఒకరిలో ఒకరు ఉండడం
  choice: ‘నేను తండ్రిలో ఉన్నాను, తండ్రి నాలో ఉన్నాడు’ అనే సంబంధాత్మక భాషను నిలుపడం
  alternative: ‘నేనూ తండ్రియూ ఒక్కటే’ లేదా ‘నేను తండ్రితో ఏకమై ఉన్నాను’
  rationale: ఈ వాక్యం పరస్పర అంతర్నివాసాన్ని వ్యక్తం చేస్తుంది. దాని బలాన్ని తగ్గించకుండా, అదే సమయంలో యోహాను వాడిన మాటలను సిద్ధాంతపరమైన వ్యాఖ్యానంతో భర్తీ చేయకుండా మూల రూపకాన్ని నిలుపుతుంది.
- issue: కార్యాలు నమ్మకానికి ఆధారంగా ఉండడం
  choice: చివరి ‘నమ్మండి’కి కర్మను చేర్చకుండా, కార్యాలనే ఆధారంగా చూపడం
  alternative: ‘ఆ కార్యాలనుబట్టి నన్ను నమ్మండి’ లేదా ‘నాలో విశ్వాసముంచండి’
  rationale: చివరి πιστεύετεకు గ్రీకులో స్పష్టమైన కర్మ లేదు. అందువల్ల దాన్ని నిరపేక్షంగా ఉంచడం మూలంలోని సంక్షిప్తతను, కొంత అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘తండ్రి,’ ‘కార్యాలు,’ ‘నమ్మండి’ అనే పరిచిత బైబిలు పదజాలాన్ని ఉంచి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకుడికి స్పష్టంగా తీర్చిదిద్దాం.
