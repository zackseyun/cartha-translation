source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: te
  text: 'యేసు అతనికి జవాబిచ్చి ఇలా అన్నాడు: “ఎవరైనా నన్ను ప్రేమిస్తే, వారు నా మాటను[a] పాటిస్తారు. నా తండ్రి వారిని ప్రేమిస్తాడు. మేము వారి దగ్గరికి వచ్చి, వారితో నివాసం చేసుకుంటాం.[b]”


    [a] “నా బోధను” లేదా “నేను చెప్పేదాన్ని” అని కూడా అనువదించవచ్చు.


    [b] “వారి వద్ద నివాసం చేసుకుంటాం” లేదా “వారితో ఒక నివాసస్థలం ఏర్పరచుకుంటాం” అని కూడా అనువదించవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా బోధను” లేదా “నేను చెప్పేదాన్ని” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “వారి వద్ద నివాసం చేసుకుంటాం” లేదా “వారితో ఒక నివాసస్థలం ఏర్పరచుకుంటాం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: జవాబిస్తూ ఇలా అన్నాడు
  rationale: గ్రీకులోని ‘జవాబిచ్చాడు, అన్నాడు’ అనే రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: Ἐάν τις
  choice: ఎవరైనా … అయితే
  rationale: ఒక వ్యక్తిని ఉద్దేశించే, అందరికీ వర్తించే షరతును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀγαπᾷ με
  choice: నన్ను ప్రేమిస్తే
  rationale: ἀγαπάω యొక్క ప్రత్యక్షమైన సంబంధార్థాన్ని సరళంగా నిలుపుతుంది.
- source_word: τὸν λόγον μου
  choice: నా మాటను
  rationale: λόγος ఇక్కడ యేసు చెప్పిన సందేశం లేదా బోధను సూచిస్తుంది; ‘మాట’ యోహాను రచనలోని విస్తృత భావసూచనను కాపాడుతుంది.
- source_word: τηρήσει
  choice: పాటిస్తారు
  rationale: τηρέωలో ఉన్న జాగ్రత్తగా కాపాడటం, ఆచరించడం, విధేయత చూపడం అనే భావాలను సందర్భానుగుణంగా సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ πατήρ μου ἀγαπήσει αὐτόν
  choice: నా తండ్రి వారిని ప్రేమిస్తాడు
  rationale: ‘నా తండ్రి’ అనే యోహాను సువార్తకు ప్రత్యేకమైన సంబోధనను, భవిష్యత్ ప్రేమ చర్యను నిలుపుతుంది.
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: మేము వారి దగ్గరికి వచ్చి
  rationale: యేసు మరియు తండ్రి కలిసి ఆ వ్యక్తి వైపు రావడాన్ని సూచించే మొదటి పురుష బహువచనాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: వారితో మా నివాసాన్ని ఏర్పరచుకుంటాం
  rationale: μονή అనే నామవాచకంలోని నివాసం లేదా నిలయ భావాన్నీ, ποιέωతో ఏర్పడిన ‘నివాసం చేసుకోవడం’ అనే ప్రయోగాన్నీ సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: “మేము వస్తాం … నివాసాన్ని ఏర్పరచుకుంటాం” అనే దైవిక బహువచన కర్త
  choice: యేసు మరియు తండ్రి కలిసి రావడం, కలిసి నివాసం ఏర్పరచుకోవడం అని బహువచనంలోనే అనువదించడం
  alternative: శైలీ సౌలభ్యం కోసం ఏకవచనంగా లేదా అస్పష్ట కర్తతో చెప్పడం
  rationale: ἐλευσόμεθα, ποιησόμεθα అనే మొదటి పురుష బహువచన క్రియలు యేసును, తండ్రిని వేర్వేరు వ్యక్తులుగా సూచిస్తూనే వారి ఉమ్మడి చర్యను స్పష్టంగా చూపుతాయి; అదనపు సిద్ధాంత వివరణ లేకుండా ఆ ఉద్వేగాన్ని నిలిపాం.
- issue: τις మరియు αὐτόν అనే సాధారణ ఏకవచన వ్యక్తి సూచన
  choice: ‘ఎవరైనా’తో పాటు సహజ తెలుగు సాధారణ/గౌరవ బహువచనమైన ‘వారు/వారిని/వారి’ వాడటం
  alternative: ‘అతడు/అతణ్ణి/అతని’ అనే వ్యాకరణపరమైన పుంలింగ ఏకవచనం వాడటం
  rationale: గ్రీకు నిర్మాణం ఒక ప్రతినిధి వ్యక్తిని సూచించినా అది పురుషులకు మాత్రమే పరిమితం కాదు. ‘ఎవరైనా … వారు’ ఆధునిక తెలుగులో సహజంగా అదే సాధారణ పరిధిని తెలియజేస్తుంది; కొత్త బహువ్యక్తి భావాన్ని ఉద్దేశపూర్వకంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘గైకొనును’, ‘నిలయము చేసికొందుము’ వంటి పాత రూపాలను నివారించాం. గ్రీకు మూలంలోని సాధారణ ఏకవచన పరిధిని తెలుగులో సహజమైన ‘ఎవరైనా … వారు’ నిర్మాణంతో తెలిపాం. ఆంగ్ల సంప్రదింపుపాఠంలో పాదసూచిక గుర్తులు భావానికి సరిపోని స్థానాల్లో ఉన్నందున, [a]ను ‘నా మాటను’ వద్ద, [b]ను ‘మా నివాసాన్ని’ వద్ద ఉంచాం.
