id: JHN.14.17
reference: John 14:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: te
  text: సత్యపు ఆత్మను[a] లోకం స్వీకరించలదు; ఎందుకంటే అది ఆయనను చూడదు, ఆయనను తెలుసుకోదు. అయితే మీరు ఆయనను తెలుసు; ఎందుకంటే ఆయన మీతో ఉంటున్నాడు, మీలో ఉంటాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆత్మ’కు గ్రీకులో వ్యాకరణపరంగా నపుంసకలింగ రూపాలు వాడబడ్డాయి. అయినా సందర్భంలో ఆత్మను వ్యక్తిగా సూచిస్తున్నందున ఇక్కడ ‘ఆయనను’ అని అనువదించబడింది. వ్యాకరణ రూపాన్ని అనుసరించి ‘దానిని … అది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీ మధ్య ఉంటాడు.’ ‘మీలో’ అనే గ్రీకు పదబంధం బహువచనాన్ని సూచిస్తున్నందున సామూహిక అర్థం కూడా సాధ్యమే; అయితే ముందున్న ‘మీతో’తో ఉన్న వ్యత్యాసాన్ని ‘మీలో’ మరింత నేరుగా నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: సత్యపు ఆత్మను
  rationale: మూలంలోని షష్ఠీ విభక్తి సంబంధాన్ని సహజమైన తెలుగులో నిలిపింది. ముందరి వాక్యంతో ఉన్న కర్మసంబంధాన్ని ‘ఆత్మను’ అనే రూపం కాపాడుతుంది.
- source_word: ὃ
  choice: ఆయనను
  rationale: πνεῦμα వ్యాకరణపరంగా నపుంసకలింగమైనా, సందర్భంలోని వ్యక్తిగత సూచనను తెలుగులో గౌరవసూచక వ్యక్తివాచక సర్వనామంతో సహజంగా వ్యక్తం చేసింది.
- source_word: ὁ κόσμος
  choice: లోకం
  rationale: యోహాను రచనల్లోని పదప్రయోగ విస్తృతిని అనవసరంగా ‘మానవజాతి’ లేదా ‘లోకవ్యవస్థ’గా పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: οὐ δύναται λαβεῖν
  choice: స్వీకరించలేకపోతుంది
  rationale: λαβεῖν లోని ‘స్వీకరించు’ భావాన్నీ, δύναται లోని సామర్థ్యలేమినీ వర్తమాన కాలంలో నిలిపింది.
- source_word: θεωρεῖ
  choice: చూడదు
  rationale: ఇంద్రియగ్రహణం, గుర్తింపు రెండింటికీ అవకాశం ఉన్న మూలపదాన్ని అతివ్యాఖ్యానం చేయకుండా సాధారణ ఆధునిక పదంతో ఇచ్చింది.
- source_word: γινώσκει / γινώσκετε
  choice: ఎరుగదు / ఎరుగుతారు
  rationale: లోకానికి లేని జ్ఞానానికీ శిష్యులకు ఉన్న జ్ఞానానికీ మధ్య మూలంలోని పదసామ్యాన్ని కాపాడుతూ, గంభీరమైన కాని అర్థమయ్యే తెలుగు వాడింది.
- source_word: παρ’ ὑμῖν μένει
  choice: మీతోనే నిలిచి ఉన్నాడు
  rationale: παρά లోని ‘మీతో’ భావాన్ని, μένει లోని కొనసాగి ఉండే భావాన్ని రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: ἐν ὑμῖν ἔσται
  choice: మీలో ఉంటాడు
  rationale: ἐν యొక్క ప్రాథమిక ‘లోపల’ భావాన్నీ, ἔσται యొక్క భవిష్యత్ కాలాన్నీ కాపాడుతుంది; బహువచన సందర్భంలో ‘మీ మధ్య’ అనే అవకాశం పాదసూచికలో ఉంచబడింది.
theological_decisions:
- issue: వ్యాకరణపరంగా నపుంసకలింగమైన πνεῦμαకు వ్యక్తిగత సూచన
  choice: ‘ఆయనను/ఆయన’ అనే గౌరవసూచక వ్యక్తివాచక రూపాలు
  alternative: ‘దానిని/అది’ అనే వ్యాకరణ నపుంసక రూపాలు
  rationale: గ్రీకు పదలింగాన్ని దాచకుండా పాదసూచికలో తెలియజేస్తూనే, సందర్భంలో ఆత్మ వ్యక్తిగత కార్యసాధకునిగా సూచించబడుతున్న విషయాన్ని సహజ తెలుగులో వ్యక్తం చేసింది.
- issue: παρ’ ὑμῖν మరియు ἐν ὑμῖν మధ్య సంబంధం
  choice: ‘మీతోనే’ మరియు ‘మీలో’ అనే భిన్న సంబంధాలను నిలిపివేయడం
  alternative: రెండింటినీ ‘మీతో’గా చేయడం, లేదా రెండవదాన్ని ‘మీ మధ్య’గా అనువదించడం
  rationale: మూలంలోని రెండు భిన్న విభక్తిపూర్వక నిర్మాణాలను ఒకే సాధారణ సన్నిధి భావంగా కలపకుండా, వాటి మధ్యనున్న భావ ఉద్రిక్తతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడింది. ‘ఎరుగుతారు’ కొద్దిగా గంభీరమైనదైనా సాధారణ పాఠకులకు అర్థమయ్యే రూపం; γινώσκω పదపునరుక్తిని నిలిపేందుకు అదే మూలంతో ‘ఎరుగదు/ఎరుగుతారు’ వాడబడింది. వచనం ముందరి వాక్యానికి కొనసాగింపుగా ఉన్నందున ‘ఆత్మను’ అనే కర్మరూపం ఉంచబడింది.
