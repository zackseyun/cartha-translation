id: JHN.14.13
reference: John 14:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: te
  text: మీరు నా నామంలో ఏది అడిగినా, దానిని నేను చేస్తాను. తద్వారా కుమారునిలో[a] తండ్రి మహిమపరచబడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుమారుని ద్వారా.” గ్రీకులో “కుమారునిలో” అని ఉంది; తండ్రి మహిమపరచబడే పరిధిని లేదా సాధనాన్ని ఇది సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: ఏది అడిగినా
  rationale: సాపేక్ష-అనిర్దిష్ట నిర్మాణం విస్తృతమైన, నిర్దిష్టం కాని పరిధిని సూచిస్తుంది. ‘ఏది ... అయినా’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: αἰτήσητε
  choice: మీరు ... అడిగినా
  rationale: ఇది రెండవ పురుష బహువచన క్రియ. ప్రార్థన సందర్భంలో ‘అడుగు’ సహజమైనదీ, మూలపదానికి సమీపమైనదీ.
- source_word: ἐν τῷ ὀνόματί μου
  choice: నా నామంలో
  rationale: యేసుతో సంబంధం, ఆయన ప్రాతినిధ్యం, అధికారానికి లోబడడం వంటి భావాలను ఒక్క వివరణకే పరిమితం చేయకుండా యోహాను రచనలోని బహుస్థాయి వ్యక్తీకరణను నిలుపుతుంది.
- source_word: τοῦτο
  choice: దానిని
  rationale: గ్రీకులో స్పష్టంగా ఉన్న సూచన సర్వనామాన్ని నిలుపుతూ, ముందున్న ‘ఏది’కి తెలుగులో సహజంగా అనుసంధానిస్తుంది.
- source_word: ποιήσω
  choice: నేను చేస్తాను
  rationale: ποιέω యొక్క విస్తృతమైన, సూటియైన అర్థాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἵνα
  choice: తద్వారా
  rationale: తర్వాతి వాక్యం ఉద్దేశాన్ని తెలియజేస్తుందని స్పష్టం చేస్తుంది; రెండు వాక్యాల మధ్య కారణోద్దేశ సంబంధాన్ని సహజంగా కలుపుతుంది.
- source_word: δοξασθῇ
  choice: మహిమపరచబడతాడు
  rationale: దైవిక మహిమకు సంబంధించిన బైబిలు పదజాలాన్ని, అలాగే గ్రీకు కర్మణి ప్రయోగాన్ని నిలుపుతుంది.
- source_word: ὁ πατὴρ
  choice: తండ్రి
  rationale: గ్రీకులో ‘నా తండ్రి’ అని కాక ‘తండ్రి’ అని మాత్రమే ఉంది. యోహాను రచనలోని ప్రత్యేక దైవ సంబోధనను అలాగే ఉంచుతుంది.
- source_word: ἐν τῷ υἱῷ
  choice: కుమారునిలో
  rationale: ἐν అనే విభక్త్యర్థాన్ని ‘ద్వారా’ అని ముందుగానే నిర్ణయించకుండా, మహిమపరచడం జరిగే పరిధి లేదా సాధనం అనే రెండు అవకాశాలనూ నిలుపుతుంది.
theological_decisions:
- issue: ‘నా నామంలో’ అని అడగడం యొక్క భావం
  choice: వివరణాత్మక విస్తరణ లేకుండా ‘నా నామంలో’ అని ఉంచడం
  alternative: ‘నా అధికారంతో’; ‘నాతో ఐక్యమై’; ‘నా స్వభావానికి, చిత్తానికి అనుగుణంగా’
  rationale: ఈ మాటకు యోహాను సందర్భంలో అనేక పరస్పర సంబంధిత భావాలున్నాయి. వాటిలో ఒక్కదానినే ప్రధాన పాఠ్యంలో స్థిరపరచకుండా మూలంలోని లోతును నిలుపుతుంది.
- issue: ἐν τῷ υἱῷ యొక్క భావం
  choice: ‘కుమారునిలో’
  alternative: ‘కుమారుని ద్వారా’
  rationale: ఇక్కడ ἐν పరిధిని లేదా సాధనాన్ని సూచించవచ్చు. గ్రీకు ఒకే సంకుచిత అర్థాన్ని తప్పనిసరి చేయనందున ప్రధాన పాఠ్యం మరింత ప్రత్యక్షమైన రూపాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన శైలిని ఉపయోగించాం. మూలంలోని ‘నా నామంలో,’ ‘కుమారునిలో’ అనే దైవశాస్త్రీయంగా బహుస్థాయి పదబంధాలను వివరణాత్మకంగా సంకుచితం చేయలేదు. పాదసూచిక గుర్తు సంబంధిత ‘కుమారునిలో’ పదబంధం వెంట ఉంచబడింది.
