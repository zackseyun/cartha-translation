  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: te
  text: “నేను మిమ్మల్ని అనాథలుగా విడిచిపెట్టను; నేను మీ దగ్గరికి వస్తున్నాను.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నేను మీ దగ్గరికి వస్తున్నాను” అనేది పునరుత్థానం తరువాత యేసు రావడాన్ని, పరిశుద్ధాత్మ ద్వారా ఆయన రావడాన్ని, లేదా భవిష్యత్తులో ఆయన తిరిగి రావడాన్ని సూచించవచ్చు; గ్రీకు మాటలు వీటిలో ఒక్కదానినే నిర్బంధంగా సూచించవు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφήσω
  choice: విడిచిపెట్టను
  rationale: ఇక్కడ ἀφίημι భవిష్యత్ క్రియారూపం ‘వెనుక విడిచిపెట్టడం’ అనే భావాన్ని ఇస్తుంది. ‘విడిచిపెట్టను’ అనేది సందర్భానికి సహజంగా ఉండి, అనాథలుగా మిగిల్చే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὀρφανούς
  choice: అనాథలుగా
  rationale: ఈ పదం తల్లిదండ్రుల సంరక్షణ కోల్పోయిన పిల్లల ప్రత్యక్ష కుటుంబ రూపకాన్ని నిలుపుతుంది; కేవలం భావోద్వేగ పరిత్యాగంగా అర్థాన్ని కుదించదు.
- source_word: ἔρχομαι
  choice: వస్తున్నాను
  rationale: గ్రీకు వర్తమాన రూపంలోని సాన్నిహిత్యాన్ని, సజీవతను నిలుపుతూ సమీప భవిష్యత్ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πρὸς ὑμᾶς
  choice: మీ దగ్గరికి
  rationale: వ్యక్తుల వైపు కదలికను సూచించే πρός భావాన్ని ఆధునిక సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: Οὐκ
  choice: విడిచిపెట్టను లోని ‘ను’ నిరాకరణ
  rationale: గ్రీకు సాధారణ నిరాకరణను తెలుగు భవిష్యత్ నిరాకరణ క్రియారూపంలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘నేను మీ దగ్గరికి వస్తున్నాను’ అన్న మాట సూచించే రాక మరియు దాని సమయం
  choice: యేసు ఏ విధంగా లేదా ఎప్పుడు వస్తాడో ప్రధాన పాఠ్యంలో నిర్దిష్టం చేయకుండా ఉంచడం
  alternative: పునరుత్థానం తరువాత ప్రత్యక్షమవడం; పరిశుద్ధాత్మ ద్వారా రావడం; భవిష్యత్తులో తిరిగి రావడం
  rationale: సందర్భం పరిశుద్ధాత్మ వాగ్దానాన్ని ప్రస్తావించినప్పటికీ, ఈ మాటలు యేసు స్వయంగా శిష్యుల దగ్గరకు రావడానికీ సహజంగా వర్తిస్తాయి. గ్రీకు వాక్యం ఒక్క సూచననే బలవంతం చేయదు కాబట్టి దాని ఉద్దేశపూర్వక విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘అనాథలుగా’ అనే ప్రత్యక్ష కుటుంబ రూపకం నిలుపబడింది; ‘వస్తున్నాను’ అనే వర్తమాన రూపం మూలంలోని సాన్నిహిత్యాన్ని కాపాడుతుంది.
