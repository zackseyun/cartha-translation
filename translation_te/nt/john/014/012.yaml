id: JHN.14.12
reference: John 14:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: te
  text: 'నిజంగా, నిజంగా మీతో చెబుతున్నాను: నన్ను విశ్వసించేవాడు[b] నేను చేసే కార్యాలను తానూ చేస్తాడు; వీటికంటే గొప్ప కార్యాలు కూడా చేస్తాడు[a]. ఎందుకంటే నేను తండ్రి దగ్గరికి వెళ్తున్నాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వీటికంటే గొప్పవి కూడా చేస్తాడు.” గ్రీకులో ముందు భాగంలోని “కార్యాలు” అనే పదాన్ని ఇక్కడ భావానుసారంగా పూరించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “విశ్వసించేవాడు … తానూ” అనే నిర్మాణం గ్రీకులో వ్యాకరణపరంగా పుంలింగ ప్రతినిధి ఏకవచనంలో ఉంది; అది పురుషులను మాత్రమే కాక, విశ్వసించే ఎవరినైనా సాధారణంగా సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: గంభీరమైన ఉద్ఘాటనను కలిగించే ద్విరుక్తిని నిలుపుతూ, ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా అనువదించబడింది.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: నన్ను విశ్వసించేవాడు
  rationale: వర్తమాన క్రియావిశేషణ రూపాన్ని ఎవరైనా ఒక విశ్వాసిని సూచించే ప్రతినిధి ఏకవచనంగా ఉంచుతుంది; యోహాను సువార్తలోని πιστεύω εἰς భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ ἔργα
  choice: కార్యాలను
  rationale: యేసు చేసిన క్రియలు, సూచకకార్యాలతో ఉన్న యోహానీయ పదసంబంధాన్ని నిలుపుతుంది.
- source_word: ἃ ἐγὼ ποιῶ
  choice: నేను చేసే
  rationale: గ్రీకు వర్తమాన కాలాన్ని సహజమైన తెలుగు సాధారణ వర్తమాన రూపంలో అందిస్తుంది.
- source_word: κἀκεῖνος ποιήσει
  choice: తానూ చేస్తాడు
  rationale: κἀκεῖνος లోని ‘ఆ వ్యక్తి కూడా’ అనే ఉద్ఘాటనను ‘తానూ’ సహజంగా వ్యక్తం చేస్తుంది; ποιήσει యొక్క భవిష్యత్ భావాన్ని ‘చేస్తాడు’ నిలుపుతుంది.
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: వీటికంటే గొప్ప కార్యాలు కూడా చేస్తాడు
  rationale: ముందున్న ‘కార్యాలు’ అనే నామవాచకాన్ని భావానుసారంగా పూరించి, μείζονα యొక్క పోలికను వ్యాఖ్యానాత్మకంగా పరిమితం చేయకుండా స్పష్టమైన తెలుగులో అందిస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: యేసు తండ్రి దగ్గరికి వెళ్లడం ముందటి వాక్యానికి కారణంగా ఇవ్వబడుతున్నదనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: నేను తండ్రి దగ్గరికి వెళ్తున్నాను
  rationale: సందర్భంలోని సమీప భవిష్యత్ భావంతో కూడిన గ్రీకు వర్తమాన రూపాన్ని సహజమైన తెలుగులో అందించి, ‘తండ్రి’ అనే నిర్దిష్ట సంబోధనను నిలుపుతుంది.
theological_decisions:
- issue: ‘వీటికంటే గొప్ప కార్యాలు’ అనే మాట యొక్క ఖచ్చిత భావం
  choice: విశ్వసించేవాడు యేసు చేసిన కార్యాలకంటే గొప్ప కార్యాలు చేస్తాడనే విస్తృతమైన వాక్యాన్ని అలాగే ఉంచి, దానికి కారణంగా యేసు తండ్రి దగ్గరికి వెళ్లడాన్ని మాత్రమే పేర్కొనడం.
  alternative: విస్తృతి, విమోచన చరిత్రలో ప్రాముఖ్యత, శక్తి, లేదా పరిశుద్ధాత్మ ద్వారా సంఘ సేవ—వీటిలో ఏదో ఒక నిర్దిష్ట అర్థానికి పరిమితం చేయడం.
  rationale: గ్రీకు వాక్యం ‘గొప్ప’ అనే పోలిక ఏ కోణంలోనో వివరించదు. కాబట్టి అనువాదం ఆ వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని గంభీర ద్విరుక్తి, ప్రతినిధి ఏకవచనం, ‘కార్యాలు’ అనే యోహానీయ పదజాలం, కారణార్థక సంబంధం నిలుపబడ్డాయి. అర్థాన్ని అనవసరంగా సిద్ధాంతీకరించకుండా ‘గొప్ప కార్యాలు’ అనే విస్తృతతను కాపాడింది.
