id: JHN.14.28
reference: John 14:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: te
  text: “నేను వెళ్లిపోతున్నాను, మీ దగ్గరికి వస్తున్నాను” అని నేను మీతో చెప్పినది మీరు విన్నారు. మీరు నన్ను ప్రేమించి ఉంటే, నేను తండ్రి దగ్గరికి వెళ్తున్నందుకు సంతోషించి ఉండేవారు[a]. ఎందుకంటే తండ్రి నాకంటే గొప్పవాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సంతోషించేవారు.” గ్రీకు నిర్మాణాన్ని మరింత సాధారణంగా ఇలా కూడా అనువదించవచ్చు; అయితే సందర్భంలోని వాస్తవానికి విరుద్ధమైన షరతుకు “సంతోషించి ఉండేవారు” బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: “తండ్రి నాకంటే గొప్పవాడు” అనే మాట మూలంలో ఉన్నట్లే అనువదించబడింది; “పాత్రలో” లేదా “స్థానంలో” వంటి వ్యాఖ్యానాత్మక పరిమితి చేర్చబడలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: మీరు విన్నారు
  rationale: గ్రీకు భూతకాల క్రియ పూర్తయిన వినికిడిని సూచిస్తుంది; ఆధునిక తెలుగులో సాధారణ భూతకాల రూపం సహజంగా ఉంది.
- source_word: Ὑπάγω
  choice: నేను వెళ్లిపోతున్నాను
  rationale: శిష్యుల దగ్గరనుంచి వెళ్లే భావాన్ని, సమీప భవిష్యత్తును సూచించే గ్రీకు వర్తమాన రూపపు సజీవతను నిలుపుతుంది.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: మీ దగ్గరికి వస్తున్నాను
  rationale: భవిష్యదర్థంలో ఉన్న గ్రీకు వర్తమాన రూపాన్ని అదనపు వివరణ లేకుండా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰ ἠγαπᾶτέ με
  choice: మీరు నన్ను ప్రేమించి ఉంటే
  rationale: నెరవేరని షరతును తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది; గ్రీకు అసంపూర్ణ భూతకాల రూపపు షరతు భావాన్ని కాపాడుతుంది.
- source_word: ἐχάρητε ἄν
  choice: సంతోషించి ఉండేవారు
  rationale: ἄνతో కూడిన భూతకాల రూపం సూచించే వాస్తవానికి విరుద్ధమైన ఫలితాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: నేను తండ్రి దగ్గరికి వెళ్తున్నందుకు
  rationale: గమనం మరియు గమ్యస్థానం రెండింటినీ స్పష్టంగా ఉంచుతుంది; ‘తండ్రి’ని బిరుదుగా నిలుపుతుంది.
- source_word: πατέρα / πατὴρ
  choice: తండ్రి
  rationale: తెలుగులో నిర్దిష్ట ఉపపదం లేకపోయినా, సందర్భం మరియు బిరుదు స్వరూపం గ్రీకు ὁ πατήρ భావాన్ని తెలియజేస్తాయి; మూలంలో లేని ‘నా’ అనే స్వామ్యపదాన్ని చేర్చలేదు.
- source_word: μείζων μού
  choice: నాకంటే గొప్పవాడు
  rationale: తులనను నేరుగా అనువదిస్తుంది; ‘పాత్రలో’ లేదా ‘స్థానంలో’ వంటి వ్యాఖ్యానాత్మక పరిమితులను చేర్చదు.
theological_decisions:
- issue: ‘తండ్రి నాకంటే గొప్పవాడు’ అనే మాటకు సంబంధించిన క్రీస్తుశాస్త్ర వ్యాఖ్యానం
  choice: ప్రధాన పాఠ్యంలో తులనను ఎలాంటి వివరణాత్మక పరిమితి లేకుండా నేరుగా ఉంచడం
  alternative: ‘పాత్రలో నాకంటే గొప్పవాడు,’ ‘స్థానంలో నాకంటే గొప్పవాడు,’ లేదా ‘నా మానవావస్థకు సంబంధించి గొప్పవాడు’ అని విస్తరించడం
  rationale: గ్రీకు పాఠ్యం తులనను సరళంగా చెబుతుంది. దాని వేదాంతపరమైన ఉద్రిక్తతను అనువాదం ముందుగానే పరిష్కరించకుండా, మూలంలోని మాటనే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘మీ దగ్గరికి’ అనే రూపం సహజమైన మాటతీరును ఇస్తుండగా, వాక్య నిర్మాణం గ్రంథోచిత గంభీరతను నిలుపుతుంది. మూలంలోని పునరుక్తి, షరతు స్వభావం, తండ్రితో చేసిన నిర్బంధించని తులన కాపాడబడ్డాయి.
