id: JHN.14.30
reference: John 14:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: te
  text: ఇకపై నేను మీతో ఎక్కువగా మాట్లాడను. ఎందుకంటే లోకపు అధిపతి వస్తున్నాడు; నాలో అతనికి ఏమీ లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నాపై అతనికి ఏ హక్కూ లేదు’ లేదా ‘నాపై అతనికి ఏ పట్టూ లేదు’ అని కూడా అర్థం కావచ్చు. గ్రీకులో అక్షరార్థంగా, ‘నాలో అతనికి ఏమీ లేదు.’
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν
  choice: ఇకపై నేను మీతో ఎక్కువగా మాట్లాడను
  rationale: οὐκέτι యొక్క ఇకమీదట కొనసాగని కాలభావాన్ని ‘ఇకపై’ తెలియజేస్తుంది; πολλὰ ఇక్కడ క్రియావిశేషణ భావంలో ఉండడంతో ‘ఎక్కువగా’ సహజంగా ఉంది; μεθ’ ὑμῶνలోని సహవాస/సంభాషణ భావాన్ని ‘మీతో’ నిలుపుతుంది.
- source_word: ἔρχεται
  choice: వస్తున్నాడు
  rationale: సమీప భవిష్యత్తులో జరగబోయే రాకను సూచించే వర్తమాన రూపాన్ని సహజమైన తెలుగు ప్రగతిశీల రూపం తెలియజేస్తుంది.
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: లోకపు అధిపతి
  rationale: ἄρχωνకు ఆధునిక తెలుగులో స్పష్టమైన అధికార భావాన్ని ‘అధిపతి’ ఇస్తుంది. మూలంలో ‘ఈ’ అనే సూచనపదం లేనందున దాన్ని చేర్చలేదు.
- source_word: καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  choice: నాలో అతనికి ఏమీ లేదు
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తమైన, అర్థపరంగా విస్తృతమైన నుడికారాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతుంది; ‘నాపై హక్కు లేదు’ లేదా ‘నాపై పట్టు లేదు’ అని ఒకే భావానికి పరిమితం చేయదు.
theological_decisions:
- issue: ‘లోకపు అధిపతి’ ఎవరనే గుర్తింపు
  choice: మూలంలోని బిరుదునే ‘లోకపు అధిపతి’గా ఉంచడం
  alternative: ప్రధాన పాఠ్యంలో ‘సాతాను’ అని స్పష్టీకరించడం
  rationale: యోహాను సందర్భంలో ఇది సాతానును సూచిస్తుందని అర్థమైనా, గ్రీకు పాఠ్యం పేరును కాక బిరుదును వాడుతుంది. అందువల్ల మూలంలోని సూచనాత్మకతను నిలిపాం.
- issue: ‘నాలో అతనికి ఏమీ లేదు’ అనే మాట భావం
  choice: విస్తృతార్థాన్ని నిలిపే సన్నిహిత అనువాదం
  alternative: ‘నాపై అతనికి ఏ హక్కూ లేదు,’ ‘నాపై అతనికి ఏ పట్టూ లేదు,’ లేదా ‘నాపై అతనికి ఏ అధికారమూ లేదు’
  rationale: ఈ గ్రీకు నుడికారం హక్కు, పట్టు, ఆధారం లేదా తనకు చెందినది ఏదీ లేకపోవడం వంటి పరస్పర సంబంధిత భావాలను సూచించవచ్చు. ప్రధాన పాఠ్యంలో ఒక్క అర్థాన్ని మాత్రమే నిర్ణయించకుండా అసలు వాక్యంలోని ఉద్దేశపూర్వక సంక్షిప్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘లోకపు అధిపతి’ అనే రూపం సంప్రదాయ ధార్మిక సందర్భానికి తగిన గంభీరతతో పాటు సాధారణ పాఠకులకు స్పష్టతను ఇస్తుంది. గ్రీకులో లేని ‘ఈ’ పదాన్ని చేర్చలేదు. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
