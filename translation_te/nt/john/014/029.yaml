source:
  edition: SBLGNT
  text: καὶ νῦν εἴρηκα ὑμῖν πρὶν γενέσθαι, ἵνα ὅταν γένηται πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/029.yaml
  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: te
  text: ఇది జరగకముందే[a] ఇప్పుడు నేను మీకు చెప్పాను, అది జరిగినప్పుడు[b] మీరు నమ్మేలా[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇది నెరవేరకముందే.’
    reason: πρὶν γενέσθαιకు సందర్భానుగుణమైన ప్రత్యామ్నాయ అనువాదం.
  - marker: b
    text: లేదా, ‘అది నెరవేరినప్పుడు.’
    reason: ὅταν γένηταιకు సందర్భానుగుణమైన ప్రత్యామ్నాయ అనువాదం.
  - marker: c
    text: ‘నమ్మేలా’ అనే క్రియకు ‘విశ్వసించేలా’ లేదా ‘నమ్మకముంచేలా’ అనే భావం కూడా ఉండవచ్చు; యోహాను రచనల్లో ఇక్కడ విస్తృతమైన ‘నమ్ము’ భావాన్నే ఉంచాం.
    reason: πιστεύσητε యొక్క విస్తృత అర్థపరిధిని సూచిస్తుంది.
lexical_decisions:
- source_word: καὶ νῦν
  choice: ఇప్పుడు
  rationale: νῦν యొక్క కాలార్థాన్ని సహజంగా తెలుపుతుంది. καί ఇక్కడ ముందున్న మాటతో అనుసంధానాన్ని చూపుతుంది; తెలుగులో వాక్యప్రవాహం ద్వారా ఆ అనుసంధానం సహజంగా వ్యక్తమవుతుంది.
- source_word: εἴρηκα ὑμῖν
  choice: మీతో చెప్పాను
  rationale: పూర్ణకాల క్రియ గతంలో చెప్పిన మాట ఇప్పటికీ ప్రాముఖ్యంగా ఉందనే భావాన్ని కలిగి ఉంది. ఆధునిక తెలుగులో ‘మీతో చెప్పాను’ సహజంగా ఉండి, ὑμῖν అనే పరోక్ష కర్మను కూడా స్పష్టంగా తెలియజేస్తుంది.
- source_word: πρὶν γενέσθαι
  choice: ఇది జరగకముందే
  rationale: πρίν తో కూడిన γενέσθαι ‘జరగకముందు’ అనే అర్థం ఇస్తుంది. సందర్భంలో సూచితమైన సంఘటనను తెలుగులో ‘ఇది’ అని వ్యక్తం చేశాం; ‘ముందే’ ముందస్తుగా చెప్పడాన్ని నొక్కి చెబుతుంది.
- source_word: ἵνα
  choice: నమ్మేలా
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని సహజమైన తెలుగు ప్రయోజన నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ὅταν γένηται
  choice: అది జరిగినప్పుడు
  rationale: ὅταν తో సంభావ్య భవిష్య సంఘటన సూచించబడుతుంది. ముందటి γενέσθαιతో ఉన్న పదపునరుక్తిని ‘జరుగు’ ద్వారానే నిలుపుతుంది.
- source_word: πιστεύσητε
  choice: మీరు నమ్మేలా
  rationale: యోహాను రచనలో πιστεύωకు సాధారణమైన ‘నమ్ము’ అనే విస్తృత భావాన్ని నిలుపుతుంది; ఇది మొదటిసారి విశ్వసించడమా లేక విశ్వాసం బలపడడమా అని అనవసరంగా నిర్ణయించదు.
theological_decisions:
- issue: సందర్భంలో πιστεύσητε యొక్క భావబలం
  choice: మీరు నమ్మేలా
  alternative: మీరు నమ్మకంలో స్థిరపడేలా; మీరు విశ్వసించేలా
  rationale: ఈ క్రియ నమ్మకం మొదలవడాన్నీ లేదా బలపడడాన్నీ స్వతహాగా ప్రత్యేకంగా నిర్దేశించదు. అందువల్ల వేదాంతపరంగా భావాన్ని సంకుచితం చేయకుండా విస్తృతమైన ‘నమ్ము’ను ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. మూలంలోని ‘జరగడం’ అనే క్రియ పునరుక్తిని నిలుపుతూ, గ్రీకు వాక్యంలోని ఉద్దేశ సంబంధాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా వ్యక్తం చేశాం.
