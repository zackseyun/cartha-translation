revisions:
- from: 'యూదా (ఇస్కరియోతు కాదు) ఆయనతో ఇలా అన్నాడు: “ప్రభువా, నీవు నిన్ను మాకు వెల్లడిచేయబోతున్నావు[a] గాని లోకానికి కాదు—అలా జరగడానికి ఏమి జరిగింది?”'
  to: 'యూదా (ఇస్కరియోతు కాదు) ఆయనతో ఇలా అన్నాడు: “ప్రభువా, లోకానికి కాక మాకు నిన్ను వెల్లడించబోతున్నావు[a]—ఇలా ఏమి జరిగింది?”'
  rationale: 'The revision preserves the source’s open-ended causal question while making its Telugu syntax clearer: Judas asks what has brought about the situation in which Jesus will disclose himself to the disciples but not to the world. The footnote alternative has been made idiomatic without narrowing the semantic range of ἐμφανίζειν.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:30:45Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains all principal source elements, including Judas’s distinction from Iscariot, the address ‘Lord,’ the prospective force of μέλλεις, and Johannine ‘world.’ However, placing ‘అలా జరగడానికి’ before ‘ఏమి జరిగింది?’ makes the causal relationship less direct than τί γέγονεν ὅτι. A recast question more clearly asks what has brought about this situation.
  naturalness: The revised wording follows natural modern Telugu question order and avoids the somewhat awkward ‘అలా జరగడానికి ఏమి జరిగింది?’
  terminology: ‘యూదా,’ ‘ఇస్కరియోతు,’ ‘ప్రభువా,’ ‘వెల్లడించు,’ and ‘లోకం’ are appropriate modern-standard Telugu terms. ‘వెల్లడించు’ suitably conveys ἐμφανίζειν without prematurely restricting it to physical appearance or mere instruction.
  issues:
  - severity: medium
    issue: The question’s causal structure is awkwardly ordered.
    rationale: ‘అలా జరగడానికి ఏమి జరిగింది?’ can sound as though an event is needed in order for the revelation to occur. Greek τί γέγονεν ὅτι asks what has happened such that Jesus will disclose himself to the disciples and not the world.
  - severity: low
    issue: Footnote alternative ‘కనబరచుకోబోతున్నావు’ is not idiomatic Telugu.
    rationale: For ‘manifest yourself,’ ‘మాకు ప్రత్యక్షమవబోతున్నావు’ is more natural while retaining a legitimate lexical alternative.
  revised_text: 'యూదా (ఇస్కరియోతు కాదు) ఆయనతో ఇలా అన్నాడు: “ప్రభువా, లోకానికి కాక మాకు నిన్ను వెల్లడించబోతున్నావు[a]—ఇలా ఏమి జరిగింది?”'
  revised_footnotes:
