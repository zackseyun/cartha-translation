id: JHN.14.22
reference: John 14:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: te
  text: 'యూదా (ఇస్కరియోతు కాదు) ఆయనతో ఇలా అన్నాడు: “ప్రభువా, లోకానికి కాక మాకు నిన్ను వెల్లడించబోతున్నావు[a]—ఇలా ఏమి జరిగింది?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మాకు ప్రత్యక్షమవబోతున్నావు” లేదా “మాకు నిన్ను తెలియజేయబోతున్నావు.”
    reason: ἐμφανίζειν అనే గ్రీకు క్రియ తనను తాను ప్రత్యక్షపరచుకోవడం, లేదా తెలిసేలా చేయడం అనే భావాలను కలిగి ఉండగలదు.
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని ఆధునిక తెలుగు కథనశైలికి సహజమైన భూతకాలంలో అనువదించాం.
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: యూదా (ఇస్కరియోతు కాదు)
  rationale: మాట్లాడుతున్న యూదాను ఇస్కరియోతు యూదా నుండి వేరు చేసే మూలపాఠంలోని వివరణను సంక్షిప్తంగా, స్పష్టంగా నిలిపాం.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును గౌరవంతో సంబోధించే κύριε అనే బిరుదు యొక్క సాధారణమైన, గంభీరమైన తెలుగు రూపం.
- source_word: τί γέγονεν
  choice: అలా జరగడానికి ఏమి జరిగింది?
  rationale: γίνομαι పరిపూర్ణకాలం గతంలో సంభవించిన దాని ఫలితంగా ఏర్పడిన ప్రస్తుత పరిస్థితిని సూచిస్తుంది; ప్రశ్నను తెలుగులో సహజంగా ఉంచుతూనే ‘ఏమి జరిగింది’ అనే భావాన్ని నిలిపాం.
- source_word: μέλλεις
  choice: వెల్లడిచేయబోతున్నావు
  rationale: ముందుకు ఉద్దేశించిన లేదా జరగనున్న కార్యాన్ని తెలియజేసే μέλλω భావాన్ని అతిగా తక్షణత్వం కలపకుండా వ్యక్తం చేస్తుంది.
- source_word: ἐμφανίζειν σεαυτόν
  choice: నిన్ను మాకు వెల్లడిచేయబోతున్నావు
  rationale: తనను తాను కనిపించేలా చేయడం లేదా తెలిసేలా చేయడం అనే భావపరిధిని ‘వెల్లడిచేయడం’ సహజంగా వ్యక్తం చేస్తుంది; σεαυτόν యొక్క ఆత్మనిర్దేశక భావం ‘నిన్ను’లో నిలుస్తుంది.
- source_word: κόσμῳ
  choice: లోకానికి
  rationale: యోహాను రచనలో κόσμος కలిగిన విస్తృతమైన, కొన్నిసార్లు దేవునికి దూరమైన మానవ వ్యవస్థను సూచించే భావాన్ని వ్యాఖ్యానించి కుదించకుండా ‘లోకం’గా నిలిపాం.
theological_decisions:
- issue: యోహాను రచనలో κόσμος అనే పదం యొక్క భావం
  choice: లోకానికి
  alternative: సర్వ మానవాళికి; అవిశ్వాసంతో ఉన్న లోక వ్యవస్థకు
  rationale: ఈ వచనం κόσμος యొక్క భావాన్ని ఒక్క నిర్దిష్ట వ్యాఖ్యానానికి పరిమితం చేయదు. ‘లోకం’ అనే పదం యోహాను వాడుకలోని ఉద్దేశపూర్వక భావవిస్తృతిని, శిష్యులు–లోకం మధ్య ఉన్న ఉద్రిక్తతను నిలుపుతుంది.
- issue: ἐμφανίζειν ద్వారా సూచించబడే ప్రత్యక్షత స్వరూపం
  choice: వెల్లడిచేయడం
  alternative: కనబరచుకోవడం; తెలియజేయడం
  rationale: ఈ క్రియ కనిపించేలా చేయడం, తెలిసేలా చేయడం అనే రెండు భావఛాయలను కలిగి ఉండగలదు. ప్రధాన పాఠంలో ‘వెల్లడిచేయడం’ ద్వారా రెండింటినీ పూర్తిగా విడదీయకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని ప్రశ్నాత్మక ఉద్రిక్తతను నిలుపుతూ తెలుగు వాక్యక్రమానికి అనుగుణంగా ప్రశ్నను చివర ఉంచాం.
