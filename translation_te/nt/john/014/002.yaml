source:
  edition: SBLGNT
  text: ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν· εἰ δὲ μή, εἶπον ἂν ὑμῖν ⸀ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: te
  text: నా తండ్రి ఇంటిలో అనేక నివాసస్థలాలు ఉన్నాయి.[a] అలా కాకపోతే, మీ కోసం స్థలం సిద్ధం చేయడానికి నేను వెళ్తున్నానని మీతో చెప్పి ఉండేవాడినా నేను?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనేక గదులు.” గ్రీకు పదం ఉండే లేదా నివసించే స్థలాలను సూచించగలదు. “నివాసస్థలాలు” అనే పదం విస్తృతమైనది; ఈ అధ్యాయంలోని నిలిచి ఉండుట లేదా నివసించుట అనే భావంతో ఉన్న సంబంధాన్ని కూడా కాపాడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అలా కాకపోతే, మీతో చెప్పి ఉండేవాడిని; ఎందుకంటే మీ కోసం స్థలం సిద్ధం చేయడానికి నేను వెళ్తున్నాను.” గ్రీకు వాక్యాన్ని అలంకారప్రశ్నగా కాక ప్రకటనగా కూడా విభజించి అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίᾳ
  choice: ఇంటిలో
  rationale: ఇక్కడ οἰκία సహజంగా ఇల్లు లేదా నివాసాన్ని సూచిస్తుంది. ‘నా తండ్రి ఇల్లు’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతుంది; ‘కుటుంబం’ అని అర్థాన్ని విస్తరించదు.
- source_word: πατρός μου
  choice: నా తండ్రి
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజమైన ‘నా తండ్రి ఇంటిలో’గా అందించాం. ‘తండ్రి’ దేవుణ్ణి సూచిస్తున్నది సందర్భం వల్ల స్పష్టం.
- source_word: μοναὶ πολλαί
  choice: అనేక నివాసస్థలాలు
  rationale: μονή ఉండే లేదా నివసించే స్థలాన్ని సూచిస్తుంది. ‘గదులు’ కంటే ఇది విస్తృతమైనది; ఈ అధ్యాయంలోని ‘నిలిచి ఉండడం’ భావంతో ఉన్న పదసంబంధాన్ని కొంతవరకు కాపాడుతుంది.
- source_word: εἰ δὲ μή
  choice: అలా కాకపోతే
  rationale: ముందటి వాక్యంలోని పరిస్థితిని సహజమైన తెలుగులో తిరస్కార షరతుగా వ్యక్తం చేస్తుంది.
- source_word: εἶπον ἂν ὑμῖν
  choice: మీతో చెప్పి ఉండేవాడినా?
  rationale: ἄνతో కూడిన భూతకాల క్రియ యొక్క షరతుగల భావాన్ని, ఎంపిక చేసిన అలంకారప్రశ్న పఠనానికి అనుగుణంగా తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: వక్త చెప్పిన మాటల విషయాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది. అయితే దీనిని కారణార్థకంగా గ్రహించే ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: πορεύομαι
  choice: నేను వెళ్తున్నాను
  rationale: వర్తమాన క్రియలోని సమీప భవిష్యత్తు లేదా కొనసాగుతున్న ప్రయాణ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἑτοιμάσαι
  choice: సిద్ధం చేయడానికి
  rationale: అనంతక్రియలోని ఉద్దేశార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τόπον
  choice: స్థలం
  rationale: τόπος యొక్క విస్తృత అర్థాన్ని కాపాడుతుంది; ‘గది’ అని అనవసరంగా సంకుచితం చేయదు.
- source_word: ὑμῖν
  choice: మీ కోసం
  rationale: దత్తివిభక్తిలోని ప్రయోజనార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘మీ అందరి కోసం’ అని మూలంలో లేని ఉద్ఘాటనను చేర్చదు.
theological_decisions:
- issue: అంత్యకాల నివాస రూపకంలో μονή అనువాదం
  choice: అనేక నివాసస్థలాలు
  alternative: అనేక గదులు; అనేక భవనాలు
  rationale: ‘భవనాలు’ ఆధునిక పాఠకునికి మూలపదం కంటే వైభవమైన భావాన్ని కలిగించవచ్చు; ‘గదులు’ నిర్మాణంలోని విభాగాలనే నిర్దిష్టంగా సూచిస్తుంది. ‘నివాసస్థలాలు’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- issue: రెండవ వాక్యభాగపు విరామచిహ్నం మరియు వాక్యబలం
  choice: అలంకారప్రశ్నగా అనువదించడం
  alternative: ‘అలా కాకపోతే, మీతో చెప్పి ఉండేవాడిని; ఎందుకంటే మీ కోసం స్థలం సిద్ధం చేయడానికి వెళ్తున్నాను’ అనే ప్రకటనగా అనువదించడం
  rationale: మూల గ్రీకు ప్రతులలోని పదక్రమం ఒకటికంటే ఎక్కువ విభజనకు వీలు ఇస్తుంది; అసలు రచనలో ఆధునిక విరామచిహ్నాలు లేవు. ప్రశ్నార్థక పఠనం సందర్భప్రవాహానికి సరిపోతుంది, కానీ ప్రకటన పఠనం కూడా సాధ్యమేనని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘నివాసస్థలాలు’ కొద్దిగా సాహిత్యోచితమైనదైనా మూలంలోని విస్తృత అర్థానికి సరిపోతుంది. యేసు శిష్యులతో మాట్లాడుతున్న సందర్భానికి అనుగుణంగా బహువచన ‘మీ’ వాడబడింది.
