  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: te
  text: నేనూ తండ్రిని అడుగుతాను; ఆయన మీకు మరొక సహాయకుణ్ణి[a] ఇస్తాడు—ఆయన ఎప్పటికీ మీతో ఉండేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ పక్షాన వాదించేవాణ్ణి,” “ఆదరణకర్తను.” గ్రీకు παράκλητος అనే పదంలో సహాయకుడు, ఒకరి పక్షాన వాదించేవాడు, ఆదరణ ఇచ్చేవాడు అనే భావాలు ఉన్నాయి.
