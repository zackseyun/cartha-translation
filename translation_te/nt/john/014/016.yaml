lexical_decisions:
- source_word: κἀγὼ
  choice: నేను
  rationale: καί + ἐγώ వాక్యప్రవాహంలోని అనుసంధానాన్ని, స్వల్ప ఉద్ఘాటనను సూచిస్తుంది. తెలుగులో ముందు సందర్భంతో ఈ అనుసంధానం సహజంగా వ్యక్తమవుతుంది; ‘నేను కూడా’ అని అనడం అవసరానికి మించిన భావాన్ని కలిగించవచ్చు.
- source_word: ἐρωτήσω
  choice: అడుగుతాను
  rationale: భవిష్యత్ కాలంలోని ἐρωτάωకు ఇది సహజమైన, నేరమైన తెలుగు సమానం; ‘ప్రార్థిస్తాను’ అని అనువదిస్తే మూలంలో తప్పనిసరిగా లేని ఆధ్యాత్మిక పారిభాషిక భావం చేరవచ్చు.
- source_word: τὸν πατέρα
  choice: తండ్రిని
  rationale: గ్రీకులో స్వామ్య సర్వనామం లేదు. అందువల్ల ‘నా తండ్రిని’ అని చేర్చకుండా యోహాను వాడుకలోని ‘తండ్రి’ అనే సంబోధనను నిలిపింది.
- source_word: ἄλλον
  choice: మరొక
  rationale: ఇప్పటికే ఉన్న మరొకరితో భేదాన్ని ἄλλος సూచిస్తుంది. ‘అదే విధమైన మరొక’ వంటి వివరణను చేర్చకుండా మూలంలోని సాధారణ భావాన్ని నిలిపింది.
- source_word: παράκλητον
  choice: సహాయకుణ్ణి
  rationale: παράκλητοςలో సహాయం, ఆదరణ, ప్రాతినిధ్యం, ఒకరి పక్షాన నిలవడం వంటి భావాలు ఉన్నాయి. ఆధునిక సాధారణ తెలుగులో వ్యక్తిని స్పష్టంగా సూచిస్తూ విస్తృత భావాన్ని మోయగల పదంగా ‘సహాయకుడు’ ఎంచుకోబడింది; ఇతర ముఖ్య భావాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: δώσει ὑμῖν
  choice: ఆయన మీకు … ఇస్తాడు
  rationale: భవిష్యత్ క్రియను, పరోక్ష కర్మను సహజమైన తెలుగు వాక్యక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: ἵνα ᾖ
  choice: ఉండేలా
  rationale: ἵναతో వచ్చిన వర్తమాన సంభావనార్థక క్రియలోని ఉద్దేశం లేదా ఫలిత భావాన్ని ‘ఉండేలా’ సహజంగా నిలుపుతుంది.
- source_word: μεθ’ ὑμῶν
  choice: మీతో
  rationale: μετά + షష్ఠీ విభక్తి యొక్క ప్రత్యక్ష సహవాస భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰς τὸν αἰῶνα
  choice: ఎప్పటికీ
  rationale: యోహాను సందర్భంలో ఈ నుడికారం నిరంతరమైన శాశ్వతత్వాన్ని సూచిస్తుంది. ‘యుగం వరకు’ అనే అతి అక్షరార్థ అనువాదం కంటే ‘ఎప్పటికీ’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: త్రిత్వ సంబంధ సందర్భంలో παράκλητος అనువాదం
  choice: సహాయకుడు
  alternative: మీ పక్షాన నిలిచేవాడు; ఆదరణకర్త
  rationale: ఒకే తెలుగు పదం παράκλητος యొక్క న్యాయపరమైన, సంబంధపరమైన, ఆదరణపరమైన భావాలన్నిటినీ పూర్తిగా అందించదు. ‘సహాయకుడు’ వ్యక్తిత్వాన్ని నిలిపి సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంటుంది; అయితే పరిశుద్ధాత్మ కార్యాన్ని కేవలం సాధారణ సహాయానికి పరిమితం చేయకుండా ఇతర సాధ్య భావాలను పాదసూచికలో ఉంచింది. ‘మరొక’ అనే పదంలోని యేసుతో సంబంధాన్ని ప్రధాన పాఠ్యంలో అదనంగా నిర్వచించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఆయన’ అనే రూపం వ్యక్తిత్వాన్ని స్పష్టంగా ఉంచుతుంది. మూలంలోని ఉద్దేశార్థక నిర్మాణాన్ని ‘ఉండేలా’తో, శాశ్వత భావాన్ని ‘ఎప్పటికీ’తో తెలిపింది.
