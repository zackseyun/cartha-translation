  terminology: ‘లోకం,’ ‘చూడదు/చూస్తారు,’ and ‘జీవిస్తున్నాను/జీవిస్తారు’ are appropriate standard Telugu equivalents and preserve the intended theological breadth. The footnotes appropriately retain, rather than settle, the possible senses.
