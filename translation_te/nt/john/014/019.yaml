  source_fidelity: The draft correctly preserves the temporal frame, the contrast between ‘the world’ and the disciples, the causal force of ὅτι, and the future force of ζήσετε. However, ‘అప్పుడు’ (‘then’) is an unnecessary explicit temporal connector not present in the Greek, and ‘కొంతకాలమే’ is less precise than ‘కొద్దికాలమే’ for μικρόν (‘a little while’).
