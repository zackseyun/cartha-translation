id: JHN.14.19
reference: John 14:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: te
  text: ఇంకా కొద్దికాలమే ఉంది; లోకం ఇక నన్ను చూడదు, కానీ మీరు నన్ను చూస్తారు.[a] నేను జీవిస్తున్నాను కాబట్టి, మీరు కూడా జీవిస్తారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చూడడం’ అని అనువదించిన గ్రీకు క్రియ కేవలం ఒక చూపు చూడడం కంటే నిశితంగా చూడడం లేదా గమనించడం అనే భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘మీరు కూడా జీవిస్తారు’ అనేది యేసు పునరుత్థాన జీవంలో శిష్యులకు భాగం ఉండడాన్ని, ఆయనతో ఐక్యతలో ఆత్మీయ జీవాన్ని, లేదా రెండింటినీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: ఇంకా కొంతకాలమే
  rationale: మిగిలి ఉన్న స్వల్ప కాలాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం; సమీపంలో సంభవించబోయే మార్పును తెలియజేస్తుంది.
- source_word: ὁ κόσμος
  choice: లోకం
  rationale: యోహాను రచనల్లో స్థిరమైన, విస్తృతార్థం గల పదాన్ని నిలుపుతుంది; దేవునికి లేదా యేసుకు దూరంగా ఉన్న మానవాళి అనే భావాన్ని ప్రధాన వాక్యంలో అతిగా వివరించదు.
- source_word: οὐκέτι θεωρεῖ
  choice: ఇక చూడదు
  rationale: οὐκέτι సూచించే నిలిచిపోవడాన్ని ‘ఇక’ స్పష్టంగా తెలియజేస్తుంది. సమీప భవిష్యత్ కాలసందర్భం కారణంగా తెలుగులో భవిష్యత్ రూపం సహజం.
- source_word: ὑμεῖς δὲ θεωρεῖτέ με
  choice: కానీ మీరు నన్ను చూస్తారు
  rationale: δὲ లోకానికీ శిష్యులకీ మధ్య వ్యత్యాసాన్ని సూచిస్తుంది. θεωρέωలో నిశితంగా లేదా కొనసాగిస్తూ చూడడం అనే ఛాయ ఉండగలిగినా, ‘చూస్తారు’ సహజంగా ఉండి ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
- source_word: ὅτι
  choice: కాబట్టి
  rationale: యేసు జీవించడం శిష్యులు జీవించడానికి ఆధారమనే కారణ సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐγὼ ζῶ
  choice: నేను జీవిస్తున్నాను
  rationale: గ్రీకు వర్తమాన కాలాన్ని నిలుపుతూ, యేసు జీవించి ఉండడంలోని భావబరువును వివరణాత్మకంగా కుదించకుండా ఉంచుతుంది.
- source_word: καὶ ὑμεῖς ζήσετε
  choice: మీరు కూడా జీవిస్తారు
  rationale: భవిష్యత్ కాలాన్ని స్పష్టంగా చూపించి, καίలోని ‘కూడా’ భావంతో వారి జీవాన్ని యేసు జీవంతో అనుసంధానిస్తుంది.
theological_decisions:
- issue: శిష్యులు యేసును ‘చూడడం’ యొక్క భావం
  choice: ‘చూస్తారు’ అని విస్తృతంగా అనువదించడం
  alternative: పునరుత్థానం తరువాత భౌతికంగా చూడడం; విశ్వాసం ద్వారా ఆత్మీయంగా గ్రహించడం; లేదా రెండింటినీ కలిపిన భావం
  rationale: θεωρέω ఏ విధమైన దర్శనాన్ని ఉద్దేశిస్తుందో వాక్యం నిర్దిష్టంగా పరిమితం చేయదు. అందువల్ల పునరుత్థాన ప్రత్యక్షతలకో ఆత్మీయ గ్రహింపుకో మాత్రమే అర్థాన్ని కట్టిపెట్టకుండా భావ ఉద్రిక్తతను నిలిపాం.
- issue: ‘మీరు కూడా జీవిస్తారు’ యొక్క పరిధి
  choice: జీవాన్ని ఏ ఒక్క కోణానికీ పరిమితం చేయకుండా విస్తృతంగా అనువదించడం
  alternative: పునరుత్థాన జీవం; క్రీస్తుతో ఐక్యతలో ఆత్మీయ జీవం; లేదా ఈ రెండూ
  rationale: ζήσετε భవిష్యత్ జీవాన్ని సూచించినప్పటికీ, యోహాను సందర్భంలో అది ప్రస్తుత ఆత్మీయ భాగస్వామ్యాన్నీ భవిష్యత్ పునరుత్థానాన్నీ ప్రతిధ్వనించవచ్చు. ప్రధాన పాఠం ఈ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘లోకం,’ ‘జీవిస్తున్నారు/జీవిస్తారు’ వంటి పరిచిత పదాలను వాడి యోహాను వాక్యంలోని సంక్షిప్తతను, పునరుక్తిని, ఉద్దేశపూర్వక theological ambiguityని కాపాడాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోతాయి.
