id: JHN.14.6
reference: John 14:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: te
  text: 'యేసు అతనితో ఇలా చెప్పాడు[a]: “నేనే మార్గం, సత్యం, జీవం. నా ద్వారా తప్ప ఎవరూ తండ్రి దగ్గరికి రారు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘యేసు అతనితో ఇలా చెబుతున్నాడు.’ గ్రీకు ఇక్కడ చారిత్రక వర్తమాన కాలాన్ని వాడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా ద్వారా కాకపోతే ఎవరూ తండ్రి దగ్గరికి రారు.’
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: చెప్పాడు
  rationale: గ్రీకులో ఇది చారిత్రక వర్తమాన కాలంలో (‘చెబుతున్నాడు’) ఉన్నప్పటికీ, తెలుగు కథన శైలిలో గత సంఘటనకు ‘చెప్పాడు’ సహజంగా ఉంటుంది.
- source_word: αὐτῷ
  choice: అతనితో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: Ἐγώ εἰμι
  choice: నేనే
  rationale: గ్రీకులో వ్యక్తంగా ఉన్న Ἐγώ ఇచ్చే ఉద్ఘాటనను తెలుగు ‘నేనే’ స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: ἡ ὁδός
  choice: మార్గం
  rationale: భౌతిక దారినీ, తండ్రి దగ్గరకు చేరే రూపకాలంకార భావాన్నీ మోయగల సాధారణ తెలుగు పదం.
- source_word: ἡ ἀλήθεια
  choice: సత్యం
  rationale: ἀλήθεια యొక్క ప్రాథమిక అర్థాన్ని, యోహాను రచనలోని విస్తృత భావాన్ని అనవసరంగా కుదించకుండా నిలుపుతుంది.
- source_word: ἡ ζωή
  choice: జీవం
  rationale: ζωή సూచించే జీవాన్ని, యోహాను సువార్తలో దానికి ఉన్న సమృద్ధమైన దైవశాస్త్రీయ పరిధిని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా తెలియజేస్తుంది.
- source_word: οὐδεὶς
  choice: ఎవరూ
  rationale: తెలుగులో నిరాకరణ క్రియతో కలిసి ‘no one’ అనే సమగ్ర ప్రతినిషేధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔρχεται
  choice: రారు
  rationale: ఇక్కడి వర్తమాన కాలం సాధారణంగా వర్తించే సత్యాన్ని సూచిస్తుంది; గౌరవార్థక ఏకవచనంగా అపార్థం కాకుండా ‘ఎవరూ ... రారు’ అనే తెలుగు నిర్మాణం సహజమైనది.
- source_word: πρὸς τὸν πατέρα
  choice: తండ్రి దగ్గరికి
  rationale: πρός సూచించే వ్యక్తివైపు చేరడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలో ‘తండ్రి’ దేవునికి వ్యక్తిగత సంబోధనాత్మక బిరుదు.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: ఈ సందర్భంలో εἰ μὴ మినహాయింపును సూచిస్తుంది; ‘తప్ప’ దాని ప్రత్యేకతను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: δι’ ἐμοῦ
  choice: నా ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధనం లేదా మధ్యవర్తిత్వ భావాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: యేసు ద్వారా మాత్రమే తండ్రి దగ్గరకు చేరడం
  choice: ‘నా ద్వారా తప్ప ఎవరూ తండ్రి దగ్గరికి రారు’ అని ప్రత్యక్షమైన ప్రత్యేక హక్కు ప్రకటనను యథాతథంగా నిలిపాం.
  alternative: ‘నా ద్వారా కాకపోతే ఎవరూ తండ్రి దగ్గరికి రారు.’
  rationale: గ్రీకు వాక్యం యేసు ద్వారా తప్ప తండ్రి దగ్గరకు ఎవరూ రారని స్పష్టంగా చెబుతుంది. దాన్ని మృదుపరచకుండా, వచనం చెప్పేదానికంటే ఎక్కువగా విస్తరించకుండా అనువదించాం.
- issue: మార్గం–సత్యం–జీవం అనే మూడు విధేయ నామాల నిర్మాణం
  choice: ‘నేనే మార్గం, సత్యం, జీవం’
  alternative: ‘నేనే మార్గం, నేనే సత్యం, నేనే జీవం.’
  rationale: గ్రీకులో ప్రతి నామానికి నిర్దిష్ట ఉపపదం పునరావృతమై మూడు విధేయాలను ప్రత్యేకంగా నిలుపుతుంది. తెలుగులో ప్రతి పదం ముందు ‘నేనే’ పునరావృతం చేయడం మూలంలో లేని అదనపు పునరుక్తిని కలిగించవచ్చు; అందువల్ల సహజమైన త్రిపద నిర్మాణాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలిని అనుసరించాం. ‘నేనే’ ద్వారా మూలంలోని వ్యక్తిగత ఉద్ఘాటనను నిలిపి, ‘మార్గం, సత్యం, జీవం’ అనే ప్రసిద్ధ త్రిపదిని సహజ తెలుగు వాక్యనిర్మాణంలో ఉంచాం.
