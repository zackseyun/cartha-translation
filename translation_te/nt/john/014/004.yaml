  text: And you know the way where I am going[a].
translation:
  language: te
  text: నేను ఎక్కడికి వెళ్తున్నానో, అక్కడికి వెళ్లే మార్గం మీకు తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “నేను ఎక్కడికి వెళ్తున్నానో మీకు తెలుసు; మార్గం కూడా మీకు తెలుసు” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: అంతేకాక / సందర్భానుసారంగా తెలుగులో ప్రత్యేక పదం లేకుండా
  rationale: ముందటి వాక్యంతో సాధారణ అనుసంధానాన్ని సూచిస్తుంది. తెలుగులో వచనం సహజంగా ఉండేందుకు ఈ అనుసంధానం వాక్యప్రవాహంలోనే వ్యక్తమవుతుంది.
- source_word: ὅπου
  choice: ఎక్కడికి
  rationale: గమ్యాన్ని సూచించే సందర్భంలో తెలుగు ‘ఎక్కడికి’ సహజమైన సమానం; యేసు వెళ్లే స్థలాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἐγὼ
  choice: నేను
  rationale: క్రియకు స్పష్టమైన కర్తగా మూలంలోని సర్వనామాన్ని నిలుపుతుంది.
- source_word: ὑπάγω
  choice: వెళ్తున్నానో
  rationale: వర్తమానకాలంలోని ప్రయాణ/వీడిపోవు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘బయలుదేరుతున్నాను’ అని సందర్భార్థాన్ని అతిగా నిర్ణయించదు.
- source_word: οἴδατε
  choice: మీకు తెలుసు
  rationale: οἶδα యొక్క వర్తమానార్థాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: τὴν ὁδόν
  choice: వెళ్లే మార్గం
  rationale: ὁδός లోని ‘మార్గం’ భావాన్ని నిలుపుతూ, గమ్యంతో దాని సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; తరువాతి వచనంలోని అర్థాన్ని ముందుగానే పూర్తిగా రుద్దదు.
theological_decisions:
- issue: ‘నేను ఎక్కడికి వెళ్తున్నానో’ అనే ఉపవాక్యానికి ‘మార్గం’తో ఉన్న వాక్యనిర్మాణ సంబంధం
  choice: నేను ఎక్కడికి వెళ్తున్నానో, అక్కడికి వెళ్లే మార్గం మీకు తెలుసు.
  alternative: నేను ఎక్కడికి వెళ్తున్నానో మీకు తెలుసు; మార్గం కూడా మీకు తెలుసు.
  rationale: SBLGNT పాఠంలో శిష్యులు యేసు వెళ్లే గమ్యానికి సంబంధించిన మార్గాన్ని తెలుసుననే నిర్మాణం ఉంది. ప్రత్యామ్నాయ రూపం వేరొక ప్రతుల పాఠాన్ని ప్రతిబింబిస్తుంది; అందువల్ల దానిని ప్రధాన పాఠంలో స్వీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. మూలపాఠంలోని గమ్యం–మార్గం సంబంధాన్ని స్పష్టంగా ఉంచుతూ, వేరే ప్రతుల పాఠాన్ని పాదసూచికలో ఇచ్చాం.
