id: JHN.14.31
reference: John 14:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: te
  text: కాని, నేను తండ్రిని ప్రేమిస్తున్నానని లోకం తెలుసుకునేలా, తండ్రి నాకు ఆజ్ఞాపించినట్లే నేను చేస్తున్నాను.[a] లేవండి, ఇక్కడి నుంచి వెళ్దాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తండ్రి నాకు ఆజ్ఞాపించిన విధంగానే నేను చేస్తున్నాను.”
    reason: καθὼς...οὕτως నిర్మాణంలోని ‘ఎలాగైతే...అలాగే’ సరిపోలికను సహజమైన ప్రత్యామ్నాయ తెలుగులో చూపిస్తుంది.
lexical_decisions:
- source_word: ἀλλ’
  choice: కాని
  rationale: ముందటి మాటతో ఉన్న వ్యతిరేక సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἵνα γνῷ
  choice: తెలుసుకునేలా
  rationale: ἵνα తో కూడిన సంభావనార్థక క్రియ ఇక్కడ ఉద్దేశాన్ని సూచిస్తుంది; ఈ రూపం ఆ ఉద్దేశ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ κόσμος
  choice: లోకం
  rationale: యోహాను రచనలోని విస్తృతమైన మానవ సమాజార్థాన్ని, అలాగే అతని ప్రత్యేక పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: ἀγαπῶ τὸν πατέρα
  choice: నేను తండ్రిని ప్రేమిస్తున్నానని
  rationale: వర్తమాన కాలంలోని ప్రేమను స్పష్టంగా తెలియజేస్తూ, గ్రీకులో లేని ‘నా’ అనే స్వామ్యపదాన్ని చేర్చదు.
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: తండ్రి నాకు ఆజ్ఞాపించినట్టే చేస్తున్నాను
  rationale: καθώς...οὕτως లోని సరిపోలికను సహజమైన తెలుగులో నిలుపుతూ, ἐντέλλομαι యొక్క బలమైన ‘ఆజ్ఞాపించు’ భావాన్ని కాపాడుతుంది.
- source_word: Ἐγείρεσθε
  choice: లేవండి
  rationale: శిష్యులందరినీ ఉద్దేశించిన బహువచన ఆజ్ఞను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἄγωμεν ἐντεῦθεν
  choice: ఇక్కడి నుంచి వెళ్దాం
  rationale: ప్రథమ పురుష బహువచన ప్రేరణార్థక భావాన్ని, ప్రస్తుత స్థలం నుంచి బయలుదేరడాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో πατήρ అనే సంబంధపూర్వక బిరుదు
  choice: తండ్రి
  alternative: నా తండ్రి
  rationale: గ్రీకు పాఠంలో స్వామ్య సర్వనామం లేదు. కాబట్టి దానిని చేర్చకుండా తండ్రి–కుమారుని సంబంధాన్ని మూలపాఠం చెప్పిన విధంగానే ఉంచుతుంది.
- issue: కుమారునికి తండ్రి ఇచ్చిన ఆదేశాన్ని తెలిపే ἐντέλλομαι పదబలం
  choice: ఆజ్ఞాపించిన
  alternative: సూచించిన
  rationale: మూల క్రియలోని ఆజ్ఞ లేదా బాధ్యత అప్పగింపు భావాన్ని సిద్ధాంతపరమైన కారణాలతో మృదువుపరచకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే గౌరవప్రదమైన శైలిలో అనువదించబడింది. ‘లోకం,’ ‘తండ్రి,’ ‘ఆజ్ఞాపించిన’ వంటి యోహాను సంబంధిత ప్రధాన పదాలు నిలుపబడ్డాయి.
