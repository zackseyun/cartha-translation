source:
  edition: SBLGNT
  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: te
  text: నేను వెళ్లి మీకోసం ఒక స్థలాన్ని సిద్ధం చేస్తే, మళ్లీ వస్తాను[a][b]; మిమ్మల్ని నా దగ్గరకు తీసుకుంటాను, నేను ఎక్కడ ఉన్నానో అక్కడ మీరు కూడా ఉండేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మళ్లీ వస్తున్నాను.’ గ్రీకులో ఇక్కడ వర్తమాన రూపంలోని క్రియ ఉంది; అది భవిష్యత్ భావంతో వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘మళ్లీ వస్తాను’ అనేది ప్రత్యేకంగా యేసు అంతిమ రాకను సూచిస్తుందా, ఆయన పునరుత్థానానంతర దర్శనాలను సూచిస్తుందా, పవిత్రాత్మ రాకను సూచిస్తుందా, లేక వీటిలో ఒకటికంటే ఎక్కువ నెరవేర్పులను కలిగిన వాగ్దానమా అనే విషయంలో వ్యాఖ్యానాలు భిన్నంగా ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: నేను వెళ్లి … చేస్తే
  rationale: ἐάνతో కూడిన భూతకాల దృష్టిగల సంభావనార్థక క్రియ భవిష్యత్ షరతును తెలియజేస్తుంది. ‘వెళ్లి … చేస్తే’ ఆధునిక తెలుగులో సహజంగా ఉండి, యేసు వెళ్లడాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: మీ కోసం ఒక స్థలం సిద్ధం చేస్తే
  rationale: ἑτοιμάζωకు ‘సిద్ధం చేయడం,’ τόποςకు ‘స్థలం’ అనే సాధారణ అర్థాలనే ఉంచి, ఆ స్థలం స్వరూపాన్ని అనువాదంలో విస్తరించలేదు.
- source_word: πάλιν ἔρχομαι
  choice: మళ్లీ వస్తున్నాను
  rationale: ἔρχομαι వర్తమాన రూపంలో ఉన్నప్పటికీ సందర్భంలో భవిష్యత్ భావాన్ని ఇస్తుంది. ‘వస్తున్నాను’ ఆ రూపంలోని సజీవత్వాన్ని నిలుపుతుంది; తెలుగులో కూడా ఇది ఉద్దేశించిన రాకను సూచించగలదు.
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: మిమ్మల్ని నా దగ్గరికి తీసుకుంటాను
  rationale: παραλαμβάνω ఇక్కడ వారిని తన సన్నిధిలోకి తీసుకోవడాన్ని సూచిస్తుంది. ‘నా దగ్గరికి తీసుకుంటాను’ πρὸς ἐμαυτόνలోని వ్యక్తిగత, సంబంధపూర్వక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἵνα
  choice: ఉండేలా
  rationale: ἵνα ఉద్దేశాన్ని పరిచయం చేస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘ఉండేలా’ ఆ ప్రయోజన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: నేను ఎక్కడ ఉన్నానో
  rationale: εἰμί యొక్క వర్తమాన భావాన్ని ‘ఉన్నానో’గా నిలిపాం. ప్రత్యేక ἐγώలోని ఉద్ఘాటన తెలుగులో ‘నేను’ అనే స్పష్ట కర్తతో తగినంతగా వ్యక్తమవుతుంది.
- source_word: καὶ ὑμεῖς ἦτε
  choice: అక్కడ మీరు కూడా ఉండేలా
  rationale: ἦτε సంభావనార్థక రూపం ἵνα ఉద్దేశ వాక్యంలో ఉంది; ‘ఉండేలా’ దానిని సాధారణ భవిష్యత్ ప్రకటనగా మార్చకుండా ఉద్దేశ భావాన్ని కాపాడుతుంది. ‘కూడా’ καίను ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: πάλιν ἔρχομαιలో యేసు వాగ్దానం చేసిన రాక స్వరూపం
  choice: ఖచ్చితమైన విధానమో సమయమో నిర్దేశించకుండా, భవిష్యత్ దిశగల వాగ్దానంగా ‘మళ్లీ వస్తున్నాను’ అని అనువదించాం.
  alternative: ‘మళ్లీ వస్తాను’; లేదా దీనిని పునరుత్థానానంతర దర్శనాలకు, ఆత్మ రాకకు, అంతిమ రాకకు ప్రత్యేకంగా పరిమితం చేయడం.
  rationale: వచనం యేసు మళ్లీ రావడం, శిష్యులను తన దగ్గరికి తీసుకోవడం స్పష్టంగా చెబుతుంది; అయితే ఆ రాక ఏ సంఘటనను మాత్రమే సూచిస్తుందో మూలపాఠ్యం ఇక్కడ తేల్చదు. అందువల్ల అనువాదం ఆ వ్యాఖ్యాన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘మళ్లీ వస్తున్నాను’ సాధారణ ‘మళ్లీ వస్తాను’ కంటే కొద్దిగా గుర్తించదగిన ప్రయోగమైనప్పటికీ, గ్రీకు వర్తమాన రూపాన్ని మరియు దాని భవిష్యత్ సూచనను ఉద్దేశపూర్వకంగా నిలుపుతుంది; పాదటిప్పణి సహజ ప్రత్యామ్నాయాన్ని వివరిస్తుంది.
