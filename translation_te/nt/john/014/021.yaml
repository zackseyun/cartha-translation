review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the identifying relation between having/keeping Jesus’ commandments and loving him, preserves the repeated love terminology, and correctly represents the Father’s and Jesus’ future love. Two Telugu forms need adjustment: ‘ప్రేమించేవాణ్ణి’ is colloquial/contracted rather than standard representative-singular wording, and ‘ప్రేమించి’ can imply sequence or manner where the Greek coordinates two future actions.'
  naturalness: The overall register is modern and clear. ‘నన్ను ప్రేమించేవాడిని’ is more natural standard Telugu than ‘నన్ను ప్రేమించేవాణ్ణి.’ Rendering both final verbs as finite futures improves clarity and avoids an unintended sequential nuance. ‘వెల్లడిస్తాను’ is the standard concise form for personal self-disclosure.
  terminology: ‘ఆజ్ఞలు,’ ‘పాటించు,’ and ‘ప్రేమ’ are appropriate and preserve Johannine wording. ‘వెల్లడిస్తాను’ retains the broad sense of ἐμφανίσω without limiting it to visible appearance. The representative masculine singular is retained and appropriately clarified in a footnote.
  issues:
  - severity: medium
    issue: ‘నన్ను ప్రేమించేవాణ్ణి’ is a contracted/colloquial form.
    rationale: For modern standard Telugu and for a formal Scripture register, ‘నన్ను ప్రేమించేవాడిని’ is preferable. It also clearly reflects the Greek masculine singular participial expression.
  - severity: medium
    issue: ‘నేనూ అతన్ని ప్రేమించి’ uses a participial construction for Greek coordinate future verbs.
    rationale: The Greek has two coordinated future indicatives, ἀγαπήσω and ἐμφανίσω. ‘ప్రేమించి’ may suggest ‘after loving’ or ‘by loving.’ Two finite future verbs preserve the coordination without adding that nuance.
  - severity: low
    issue: ‘వెల్లడిచేస్తాను’ is less idiomatic than ‘వెల్లడిస్తాను.’
    rationale: ‘వెల్లడిస్తాను’ is standard modern Telugu and naturally expresses personal disclosure while preserving the semantic breadth of ἐμφανίσω.
  revised_text: నా ఆజ్ఞలను కలిగి ఉండి వాటిని పాటించేవాడే నన్ను ప్రేమించేవాడు.[a] నన్ను ప్రేమించేవాడిని నా తండ్రి ప్రేమిస్తాడు; నేనూ అతనిని ప్రేమిస్తాను, అతనికి నన్ను నేను వెల్లడిస్తాను.[b]
