id: JHN.14.21
reference: John 14:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: te
  text: నా ఆజ్ఞలను కలిగి ఉండి వాటిని పాటించేవాడే నన్ను ప్రేమించేవాడు.[a] నన్ను ప్రేమించేవాడిని నా తండ్రి ప్రేమిస్తాడు; నేనూ అతనిని ప్రేమిస్తాను, అతనికి నన్ను నేను వెల్లడిస్తాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘వాడు’ అనే ఏకవచన పుంలింగ రూపం ప్రాతినిధ్యార్థంలో వాడబడింది; యేసు ఆజ్ఞలను కలిగి ఉండి వాటిని పాటించే ఏ వ్యక్తికైనా ఈ మాట వర్తిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతనికి నన్ను నేను కనబరచుకొంటాను.’ గ్రీకు క్రియకు తనను తెలియజేసుకోవడం లేదా కనిపించేలా చేసుకోవడం అనే అర్థాలు ఉండవచ్చు; ఇక్కడ వ్యక్తిగత స్వీయ-వెల్లడి భావం ప్రధానంగా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἔχων τὰς ἐντολάς μου
  choice: నా ఆజ్ఞలను కలిగి ఉండి
  rationale: ὁ ἔχων అనే వర్తమాన కృదంత నిర్మాణంలోని ‘కలిగి ఉండడం’ అనే భావాన్ని నిలుపుతూ, దాన్ని ఆజ్ఞలను పాటించడంతో అనుసంధానిస్తుంది; ‘స్వీకరించి’ లేదా ‘తెలుసుకొని’ అని అనువదిస్తే మూలంలో లేని భావం చేరవచ్చు.
- source_word: τηρῶν αὐτὰς
  choice: వాటిని పాటించేవాడు
  rationale: యోహాను రచనల్లో τηρέω అనేది ఆజ్ఞలను కాపాడడం, ఆచరించడం, నమ్మకంగా అనుసరించడం అనే భావాలను కలిగి ఉంటుంది. ఆధునిక తెలుగులో ‘పాటించడం’ ఈ సందర్భంలో సహజంగా ఉండి విధేయ ఆచరణను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: వాడే నన్ను ప్రేమించేవాడు
  rationale: ἐκεῖνος ఇచ్చే ఉద్ఘాటనను తెలుగు ‘వాడే’లోని ఏకారంతో నిలిపి, ఆజ్ఞలను పాటించే వ్యక్తినే యేసును ప్రేమించే వ్యక్తిగా గుర్తించే వాక్య నిర్మాణాన్ని కాపాడింది.
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: ప్రేమించేవాడు / ప్రేమిస్తాడు / ప్రేమించి
  rationale: ἀγαπάω పదకుటుంబం ఉద్దేశపూర్వకంగా పునరావృతమవుతుంది. తెలుగులో ప్రతిచోటా ‘ప్రేమ’నే వాడటం ఆ పదసంబంధాన్ని, దాని వేదాంత ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου
  choice: నా తండ్రి ప్రేమిస్తాడు
  rationale: గ్రీకు భావం తండ్రి నుండి ఆ వ్యక్తికి వచ్చే ప్రేమ. తెలుగులో కర్మణి రూపమైన ‘ప్రేమించబడతాడు’ కంటే కర్తరి నిర్మాణం సహజంగా ఉండి అదే అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: κἀγὼ
  choice: నేనూ
  rationale: 'καὶ ἐγώలోని జోడింపు భావాన్ని ‘నేనూ’ సహజంగా వ్యక్తపరుస్తుంది: తండ్రి ప్రేమతోపాటు యేసు ప్రేమ కూడా చెప్పబడుతోంది.'
- source_word: ἐμφανίσω αὐτῷ ἐμαυτόν
  choice: అతనికి నన్ను నేను వెల్లడిచేస్తాను
  rationale: ἐμφανίζω కనిపించేలా చేయడం నుండి వ్యక్తిగతంగా తెలియజేసుకోవడం వరకు అర్థవ్యాప్తి కలిగి ఉంది. ఈ సందర్భంలో ‘వెల్లడిచేస్తాను’ యేసు తనను తానే వ్యక్తిగతంగా తెలియజేసే భావాన్ని నిలుపుతూ కేవలం భౌతిక ప్రత్యక్షతకు పరిమితం చేయదు.
theological_decisions:
- issue: ప్రేమకు, ఆజ్ఞలను పాటించడానికి మధ్య సంబంధం
  choice: ఆజ్ఞలను కలిగి ఉండి పాటించే వ్యక్తినే యేసును ప్రేమించే వ్యక్తిగా గుర్తించింది.
  alternative: ఆజ్ఞాపాలన ప్రేమను నిరూపిస్తుంది; లేదా ఆజ్ఞాపాలన వల్ల దేవుని ప్రేమ సంపాదించబడుతుంది.
  rationale: గ్రీకు వాక్యం గుర్తింపు సంబంధాన్ని చెబుతుంది; కారణం, ప్రతిఫలం లేదా యోగ్యతను స్పష్టంగా ప్రకటించదు. అందువల్ల మూలంలోని సన్నిహిత సంబంధాన్ని ఉంచి, అదనపు సిద్ధాంతపరమైన వివరణను చేర్చలేదు.
- issue: తండ్రి ప్రేమ యొక్క వాక్య నిర్మాణం
  choice: ‘నా తండ్రి ప్రేమిస్తాడు’ అనే సహజ తెలుగు కర్తరి రూపం వాడింది.
  alternative: ‘నా తండ్రిచేత ప్రేమించబడతాడు’ అనే గ్రీకు కర్మణి నిర్మాణానికి దగ్గరైన రూపం.
  rationale: కర్తరి రూపం తెలుగులో సహజంగా ఉన్నప్పటికీ, ప్రేమకు మూలం తండ్రేనన్న గ్రీకు భావాన్ని మార్చదు. ఈ వాక్యాన్ని ఆ ప్రేమ సంపాదించబడుతుందని అర్థం వచ్చేలా విస్తరించలేదు.
- issue: యేసు తనను వెల్లడించుకునే స్వభావం
  choice: ‘నన్ను నేను వెల్లడిచేస్తాను’ అని అనువదించింది.
  alternative: ‘నన్ను నేను అతనికి కనబరచుకుంటాను’ లేదా ‘ప్రత్యక్షపరచుకుంటాను.’
  rationale: యోహాను 14 సందర్భం వ్యక్తిగత స్వీయ-వెల్లడిని సూచించగలదు; అది తప్పనిసరిగా కంటికి కనిపించే ప్రత్యక్షత మాత్రమే కాదు. విస్తృతమైన మూలార్థాన్ని కాపాడేందుకు ‘వెల్లడిచేస్తాను’ ఎంచుకుంది.
- issue: ప్రాతినిధ్య ఏకవచన పుంలింగం
  choice: ప్రధాన పాఠ్యంలో ‘వాడు/అతను’ రూపాలను ఉంచి, అవి సాధారణ ప్రాతినిధ్యార్థంలో ఉన్నాయని పాదసూచికలో తెలిపింది.
  alternative: ‘ఆ వ్యక్తి’ వంటి లింగనిరపేక్ష రూపం లేదా బహువచన రూపం.
  rationale: గ్రీకులో పుంలింగ ఏకవచన రూపాలు ప్రాతినిధ్య బలంతో ఉన్నాయి. తెలుగు పాఠ్యంలో ఆ వ్యాకరణ ఆకృతిని నిలిపి, అది పురుషులకు మాత్రమే పరిమితం కాదని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన శైలిని అనుసరించింది. ‘ఆజ్ఞలు,’ ‘పాటించడం,’ ‘వెల్లడిచేయడం’ వంటి సాధారణంగా అర్థమయ్యే పదాలను వాడింది. మూలంలోని ఏకవచన ప్రాతినిధ్య నిర్మాణం, ప్రేమ అనే పదపు పునరావృతం, ప్రేమ-విధేయతల మధ్య ఉన్న వేదాంత ఉద్వేగం నిలుపబడ్డాయి.
