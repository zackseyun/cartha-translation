revisions:
- from: నా ఆజ్ఞలను కలిగి ఉండి వాటిని పాటించేవాడే నన్ను ప్రేమించేవాడు.[a] నన్ను ప్రేమించేవాణ్ణి నా తండ్రి ప్రేమిస్తాడు; నేనూ అతన్ని ప్రేమించి, అతనికి నన్ను నేను వెల్లడిచేస్తాను.[b]
  to: నా ఆజ్ఞలను కలిగి ఉండి వాటిని పాటించేవాడే నన్ను ప్రేమించేవాడు.[a] నన్ను ప్రేమించేవాడిని నా తండ్రి ప్రేమిస్తాడు; నేనూ అతనిని ప్రేమిస్తాను, అతనికి నన్ను నేను వెల్లడిస్తాను.[b]
