  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: te
  text: 'ఆ రోజున మీరు తెలుసుకుంటారు: నేను నా తండ్రిలో ఉన్నానని, మీరు నాలో[a] ఉన్నారని, నేను మీలో ఉన్నానని.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘లో’ అనే పదం మూడుసార్లు పునరావృతమైంది. ఇది యోహాను సువార్తలోని పరస్పర అంతర్నివాస భావాన్ని నిలుపుతుంది; ‘ఐక్యంగా’ అని కూడా భావాన్ని వివరించవచ్చు, కానీ అది మరింత వ్యాఖ్యానాత్మకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ఆ రోజున
  rationale: ఇది కాలాన్ని సూచించే పదబంధం. నిర్దిష్టమైన భవిష్యత్ సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γνώσεσθε ὑμεῖς
  choice: మీరు తెలుసుకుంటారు
  rationale: భవిష్యత్తులో కలిగే జ్ఞానం లేదా గ్రహింపును సహజంగా వ్యక్తం చేస్తుంది. స్పష్టంగా ఉన్న ὑμεῖς వల్ల కలిగే ఉద్ఘాటనను తెలుగు కర్త ‘మీరు’ నిలుపుతుంది.
- source_word: ὅτι
  choice: అనీ … అనీ … అనీ
  rationale: తెలుగులో ‘తెలుసుకుంటారు’ అనే క్రియకు విషయవాచక ఉపవాక్యాలను సహజంగా అనుసంధానిస్తుంది; ఇక్కడ కారణార్థం కాదు.
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: నేను నా తండ్రిలో ఉన్నాను
  rationale: యోహాను రచనలోని ‘లో’ అనే అంతర్నివాస భాషను వివరణాత్మకంగా మార్చకుండా నేరుగా నిలుపుతుంది.
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: మీరు నాలో ఉన్నారు
  rationale: గ్రీకులో వ్యక్తంగా లేని అనుసంధాన క్రియను తెలుగులో సహజంగా పూరిస్తూ, పునరావృతమైన ‘లో’ రూపాన్ని కాపాడుతుంది.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: నేను మీలో ఉన్నాను
  rationale: κἀγώ లోని ‘మరియు నేను’ భావాన్ని వాక్య సమన్వయం ద్వారా అందిస్తూ, పరస్పర అంతర్నివాస రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἐν పదంతో వ్యక్తమయ్యే యోహాను సువార్తలోని పరస్పర అంతర్నివాస భాష
  choice: ‘నా తండ్రిలో’, ‘నాలో’, ‘మీలో’ అని ‘లో’ రూపాన్ని మూడుసార్లూ నిలుపడం
  alternative: ‘నా తండ్రితో ఏకమై’, ‘నాతో ఐక్యమై’, ‘మీతో ఐక్యమై’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: మూలపాఠంలోని రూపకం సంబంధం, ఐక్యత, అంతర్నివాసం వంటి పరస్పర సంబంధిత భావాలకు అవకాశం ఇస్తుంది. ‘లో’ అని అనువదించడం ఆ ధార్మిక ఉద్వేగాన్ని ఒకే వ్యాఖ్యానానికి పరిమితం చేయదు.
- issue: యేసు మరియు తండ్రి మధ్య సంబంధం
  choice: ‘నేను నా తండ్రిలో ఉన్నాను’ అని నేరుగా అనువదించడం
  alternative: ‘నేను నా తండ్రితో సారాంశంలో ఒక్కటిగా ఉన్నాను’ లేదా ‘నేను నా తండ్రితో ఉన్నాను’
  rationale: ఈ అనువాదం వాక్యపు ఉన్నత క్రీస్తుశాస్త్ర భావాన్ని పలుచన చేయదు; అలాగే మూలంలో నేరుగా లేని తరువాతి సిద్ధాంత పదజాలాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని మూడు సమాంతర ἐν పదబంధాలను ‘లో’ రూపంతో ఉద్దేశపూర్వకంగా నిలిపాం.
