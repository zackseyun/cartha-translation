source:
  edition: SBLGNT
  text: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: te
  text: మీ హృదయం కలవరపడనీయకండి. దేవునిపై విశ్వాసం ఉంచండి; నాపై కూడా విశ్వాసం ఉంచండి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు దేవునిపై విశ్వాసం ఉంచుతున్నారు; నాపై కూడా విశ్వాసం ఉంచండి.” πιστεύετε అనే గ్రీకు రూపం సూచనార్థకంగా (“మీరు విశ్వాసం ఉంచుతున్నారు”) లేదా ఆజ్ఞార్థకంగా (“విశ్వాసం ఉంచండి”) ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “దేవునిపై నమ్మకం ఉంచండి; నాపై కూడా నమ్మకం ఉంచండి.” ఈ క్రియ విశ్వసించడంతో పాటు నమ్మకం ఉంచడం, ఆధారపడడం అనే భావాన్నీ కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: కలవరపడనివ్వకండి
  rationale: μήతో కూడిన వర్తమాన కర్మణి తృతీయ పురుష ఆజ్ఞార్థక రూపాన్ని సహజమైన తెలుగు నిషేధాజ్ఞగా వ్యక్తపరుస్తుంది. ‘కలవరపడడం’ ఇక్కడి ταράσσω పదంలోని మనస్సు అశాంతికి గురికావడం అనే విస్తృత భావాన్ని అతిగా కుదించదు.
- source_word: ὑμῶν ἡ καρδία
  choice: మీ హృదయం
  rationale: బహువచన సంబోధనతో కూడిన ఏకవచన ‘హృదయం’ అనే గ్రీకు సామూహిక ప్రయోగాన్ని అలాగే నిలుపుతుంది; శిష్యుల సమూహ అంతరంగాన్ని సూచిస్తుంది.
- source_word: πιστεύετε
  choice: విశ్వాసముంచండి
  rationale: πιστεύωలోని నమ్మడం, ఆధారపడడం అనే సంబంధాత్మక భావాన్ని εἰςతో కలిసి తెలుగులో సహజంగా అందిస్తుంది. రూపంలోని సూచనార్థక–ఆజ్ఞార్థక సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
- source_word: εἰς τὸν θεόν
  choice: దేవునిపై
  rationale: πιστεύωతో వచ్చిన εἰς సూచించే దేవునివైపు మళ్లిన విశ్వాసం లేదా నమ్మకాన్ని సహజమైన తెలుగులో ‘పై’ ద్వారా వ్యక్తపరుస్తుంది.
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: నాపై కూడా విశ్వాసముంచండి
  rationale: καί యొక్క సంకలన భావాన్ని ‘కూడా’తో, దేవునిపై మరియు యేసుపై విశ్వాసం అనే సమాంతర నిర్మాణాన్ని క్రియ పునరుక్తితో కాపాడుతుంది.
theological_decisions:
- issue: πιστεύετε అనే రెండు రూపాలకు సూచనార్థకమా, ఆజ్ఞార్థకమా అనే సందిగ్ధత
  choice: 'రెండింటినీ ఆజ్ఞార్థకంగా: ‘దేవునిపై విశ్వాసముంచండి; నాపై కూడా విశ్వాసముంచండి.’'
  alternative: ‘మీరు దేవునిపై విశ్వాసముంచుతున్నారు; నాపై కూడా విశ్వాసముంచండి.’
  rationale: రెండవ పురుష బహువచన వర్తమాన సూచనార్థక, ఆజ్ఞార్థక రూపాలు ఒకే విధంగా ఉండటంతో నిజమైన వ్యాకరణ సందిగ్ధత ఉంది. ముందున్న నిషేధాజ్ఞ మరియు ఆదరణాత్మక సందర్భం రెండు ఆజ్ఞార్థక క్రియలకు అనుకూలం; అయినా సూచనార్థక అవకాశాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. గ్రీకులోని సామూహిక ఏకవచన ‘హృదయం’ను నిలిపి, ‘కలవరపడనివ్వకండి’ ద్వారా తృతీయ పురుష ఆజ్ఞార్థక నిర్మాణాన్ని సహజంగా అందించాం. రెండు పాదటిప్పణి సూచికలూ సంబంధిత వాక్యాంతంలో ఉంచబడ్డాయి.
