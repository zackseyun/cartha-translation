id: JHN.14.26
reference: John 14:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: te
  text: అయితే సహాయకుడు[a]—తండ్రి నా పేరున పంపబోయే పరిశుద్ధాత్మ—ఆయనే మీకు అన్నిటినీ బోధించి, నేను మీకు చెప్పినవన్నీ మీకు గుర్తుచేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సహాయకుడు” అని అనువదించిన గ్రీకు పదం పారాక్లేతోస్. దీనికి “పక్షవాది,” “సలహాదారు,” లేదా “ఆదరణకర్త” అనే భావాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: సహాయకుడు
  rationale: ఈ పదంలో సహాయం, పక్షాన నిలబడడం, సలహా ఇవ్వడం, ఆదరించడం వంటి భావాలు ఉన్నాయి. ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యే విస్తృత పదంగా “సహాయకుడు”ను ప్రధాన పాఠంలో ఉంచి, ఇతర ముఖ్య భావాలను పాదసూచికలో ఇచ్చాం.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: పరిశుద్ధాత్మ
  rationale: తెలుగులో స్థిరపడిన, గౌరవప్రదమైన సమకాలీన పదం; మూలంలోని బిరుదును సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ὃ πέμψει ὁ πατὴρ
  choice: తండ్రి ... పంపబోయే
  rationale: భవిష్యత్ కార్యాన్ని సహజమైన తెలుగు సంబంధవాచక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ ὀνόματί μου
  choice: నా పేరున
  rationale: మూలంలోని నామం, ప్రాతినిధ్యం, అధికారానికి సంబంధించిన భావవ్యాప్తిని ఒకే అర్థానికి పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: ἐκεῖνος
  choice: ఆయనే
  rationale: మూలంలోని బలప్రయోగంతో కూడిన సూచనను, పరిశుద్ధాత్మ వ్యక్తిగత కార్యసాధకుడని తెలిపే విధంగా గౌరవప్రదమైన తెలుగు వ్యక్తివాచక రూపంతో నిలుపుతుంది.
- source_word: διδάξει ὑμᾶς πάντα
  choice: మీకు అన్నిటినీ బోధించి
  rationale: “బోధించడం” మూల క్రియకు నేరమైన, సహజమైన సమానార్థకం; “అన్నిటినీ” వాగ్దానంలోని విస్తృతిని నిలుపుతుంది.
- source_word: ὑπομνήσει ὑμᾶς
  choice: మీకు గుర్తుచేస్తాడు
  rationale: ఎవరినైనా జ్ఞాపకం చేసుకునేలా చేయడం అనే కారణార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πάντα ἃ εἶπον ὑμῖν
  choice: నేను మీతో చెప్పినవన్నీ
  rationale: సంబంధవాచక నిర్మాణాన్ని, యేసు పలికిన మాటల ప్రత్యక్షతను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: పరిశుద్ధాత్మను వ్యక్తిగత భాషతో సూచించడం
  choice: “ఆయనే” అనే వ్యక్తివాచక, గౌరవప్రద రూపం
  alternative: వ్యక్తిత్వాన్ని స్పష్టంగా చూపని “అదే” వంటి నపుంసక సూచన
  rationale: మూలంలో πνεῦμα వ్యాకరణపరంగా నపుంసకమైనప్పటికీ, παράκλητος పుంలింగంలో ఉంది; దానిని తిరిగి సూచించే ἐκεῖνος కూడా బలప్రయోగంతో కూడిన పుంలింగ రూపం. బోధించడం, గుర్తుచేయడం వంటి వ్యక్తిగత కార్యాలు కూడా ఈ ఎంపికకు మద్దతిస్తాయి.
- issue: παράκλητος అనే బిరుదు అనువాదం
  choice: సహాయకుడు
  alternative: పక్షవాది, సలహాదారు, ఆదరణకర్త
  rationale: ఒకే తెలుగు పదం మూలపదంలోని న్యాయపరమైన, ప్రాతినిధ్య, సహాయక, ఆదరణ భావాలన్నిటినీ పూర్తిగా అందించదు. ప్రధాన పాఠంలో విస్తృతంగా అర్థమయ్యే పదాన్ని వాడి, నిజమైన భావవ్యాప్తిని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద శైలి. డ్యాష్‌లతో ఉన్న అనుబంధ నిర్మాణం “సహాయకుడు” మరియు “పరిశుద్ధాత్మ” ఒకే వ్యక్తిని సూచిస్తున్నాయని స్పష్టం చేస్తూనే మూల వాక్య నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
