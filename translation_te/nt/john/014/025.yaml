  yaml_path: translation/nt/john/014/025.yaml
  text: I have spoken these things to you while staying with you[a].
translation:
  language: te
  text: నేను మీతో ఉండగా[a] ఈ సంగతులు మీకు చెప్పాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేను మీతో ఉంటున్నప్పుడు.” మూలభాషలో యోహాను రచనల్లో తరచుగా వచ్చే “ఉండు/నిలిచి ఉండు” అనే క్రియకు చెందిన కృదంతం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ఈ సంగతులు
  rationale: నపుంసక బహువచన సూచకపదాన్ని, ముందుగా చెప్పిన బోధలను సూచించే సహజమైన తెలుగు బహువచనంగా ఉంచింది.
- source_word: λελάληκα
  choice: చెప్పాను
  rationale: తెలుగులో సహజంగా యేసు పలికిన మాటలను తెలియజేస్తుంది; గ్రీకు పూర్ణకాల క్రియ సూచించే గతంలో పలికిన మాటల ప్రస్తుత ప్రాసంగికత సందర్భం ద్వారా నిలుస్తుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: శిష్యులను ఉద్దేశించిన బహువచన దత్తివును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: παρ’ ὑμῖν
  choice: మీతో
  rationale: παρά దత్తివుతో ఇక్కడ వ్యక్తమయ్యే సమీపం, సన్నిధి అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μένων
  choice: ఉండగా
  rationale: μένω అనే వర్తమాన కృదంతం తెలిపే కొనసాగుతున్న సన్నిధిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తూ యోహాను రచనలోని ‘ఉండు/నిలిచి ఉండు’ పదబంధ సంబంధాన్ని కూడా కాపాడుతుంది.
theological_decisions:
- issue: యోహాను రచనలో పునరావృతమయ్యే μένω పదానికి సంబంధించిన భావసంబంధం
  choice: మీతో ఉండగా
  alternative: మీతో ఉన్నప్పుడు; మీ దగ్గర నిలిచి ఉండగా
  rationale: ‘ఉండగా’ అనేది ఈ సందర్భంలో సహజమైన తెలుగు; యేసు శిష్యులతో కొనసాగుతున్న సన్నిధిని చూపుతుంది. అదే సమయంలో మూలంలోని μένω భావాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘మీతో ... మీకు’ అనే స్వల్ప పునరుక్తి మూలంలోని రెండు వేర్వేరు సంబంధాలను—సన్నిధి మరియు సంబోధన—స్పష్టంగా ఉంచుతుంది.
