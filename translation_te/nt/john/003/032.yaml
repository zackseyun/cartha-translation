revisions:
- from: ఆయన చూసినదానినీ విన్నదానినీ గురించే సాక్ష్యమిస్తున్నాడు; అయినా ఆయన సాక్ష్యాన్ని ఎవరూ స్వీకరించడం లేదు.[a]
  to: ఆయన తాను చూసినదానికీ విన్నదానికీ సాక్ష్యమిస్తున్నాడు; ఆయన సాక్ష్యాన్ని ఎవరూ స్వీకరించరు.[a]
  rationale: The revision removes the unsupported adversative ‘అయినా’ and the potentially restrictive ‘గురించే.’ It preserves the source’s present-tense, stark universal formulation and its unresolved tension with the following verse.
  reviewer_model: gpt-5.6-terra
