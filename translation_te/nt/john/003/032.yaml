source:
  edition: SBLGNT
  text: ⸀ὃ ἑώρακεν καὶ ἤκουσεν τοῦτο μαρτυρεῖ, καὶ τὴν μαρτυρίαν αὐτοῦ οὐδεὶς λαμβάνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/032.yaml
  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: te
  text: ఆయన తాను చూసినదానికీ విన్నదానికీ సాక్ష్యమిస్తున్నాడు; ఆయన సాక్ష్యాన్ని ఎవరూ స్వీకరించరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఎవరూ ఆయన సాక్ష్యాన్ని స్వీకరించరు” అనేది తీవ్రమైన సాధారణీకరణ; తదుపరి వచనం ఆయన సాక్ష్యాన్ని స్వీకరించిన వ్యక్తి గురించి చెబుతుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ὃ
  choice: దానినీ
  rationale: నపుంసక ఏకవచన సంబంధసర్వనామం చూసిన, విన్న విషయాన్ని సూచిస్తుంది; తెలుగులో సమన్వయ వాక్యనిర్మాణంలో ‘చూసినదానినీ విన్నదానినీ’ సహజంగా ఉంటుంది.
- source_word: ἑώρακεν
  choice: చూసిన
  rationale: గ్రీకు పర్ఫెక్ట్ పూర్తయిన దర్శనానికి కొనసాగుతున్న ప్రాసంగికతను సూచిస్తుంది; తెలుగు సంబంధకృదంతం సందర్భంలో ఆ భావాన్ని సహజంగా మోస్తుంది.
- source_word: ἤκουσεν
  choice: విన్న
  rationale: అయోరిస్ట్‌ను సూటిగా సూచిస్తూ, ‘చూసినదానినీ విన్నదానినీ’ అనే సహజ సమన్వయాన్ని నిలుపుతుంది.
- source_word: τοῦτο
  choice: గురించే
  rationale: ముందు పేర్కొన్న విషయాన్నే తిరిగి బలంగా సూచించే resumptive demonstrative భావాన్ని ‘గురించే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μαρτυρεῖ
  choice: సాక్ష్యమిస్తున్నాడు
  rationale: యోహాను రచనలోని న్యాయస్థాన-సాక్ష్య భావాన్ని, వర్తమాన కాలపు కొనసాగుతున్న చర్యను కాపాడుతుంది.
- source_word: μαρτυρίαν
  choice: సాక్ష్యాన్ని
  rationale: μαρτυρεῖతో పదబంధ సంబంధాన్ని నిలిపి, సాక్ష్యం/వాంగ్మూలం అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: οὐδεὶς
  choice: ఎవరూ
  rationale: గ్రీకులోని సార్వత్రిక నిషేధాన్ని తగ్గించకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λαμβάνει
  choice: స్వీకరించడం లేదు
  rationale: సాక్ష్యాన్ని పొందడం మాత్రమే కాక దాన్ని అంగీకరించడం అనే యోహానీయ సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది; వర్తమాన కాలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘ఎవరూ ఆయన సాక్ష్యాన్ని స్వీకరించడం లేదు’ అనే సార్వత్రిక నిషేధపు పరిధి
  choice: వాక్యంలోని తీవ్రమైన ‘ఎవరూ’ అనే సాధారణీకరణను యథాతథంగా నిలుపడం
  alternative: ‘చాలా కొద్దిమంది మాత్రమే స్వీకరిస్తున్నారు’ అని మృదువుగా చెప్పడం, లేదా దాన్ని గణితపరంగా సంపూర్ణ నిరపవాద ప్రకటనగా వివరించడం
  rationale: గ్రీకు వాక్యం నిషేధాన్ని ఉద్దేశపూర్వకంగా తీవ్రంగా చెబుతుంది. తదుపరి వచనం సాక్ష్యాన్ని స్వీకరించిన వ్యక్తిని ప్రస్తావించడం వల్ల ఏర్పడే యోహానీయ ఉద్వేగాన్ని అనువాదం పరిష్కరించకుండా కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ‘ఆయన’ ప్రయోగం. మూలంలోని పునరుక్త సూచనను పదేపదే అసహజంగా అనుకరించకుండా ‘గురించే’తో వ్యక్తం చేశాం. ‘అయినా’ గ్రీకు καί ఇక్కడ కలిగించే విరుద్ధ ఫలిత సంబంధాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
