  text: The Father loves the Son and has given all things into his hand[a].
translation:
  language: te
  text: తండ్రి కుమారుణ్ణి ప్రేమిస్తాడు; సమస్తాన్నీ కుమారుని చేతికి అప్పగించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుమారుని చేతిలో ఉంచాడు.” గ్రీకు పదబంధం అక్షరార్థంగా “అతని చేతిలో” అని ఉంటుంది; ఇది అధికారం లేదా ఆధీనాన్ని అప్పగించడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πατὴρ
  choice: తండ్రి
  rationale: యోహాను సందర్భంలో దేవునికి, కుమారునితో ఆయనకున్న సంబంధాన్ని సూచించే వ్యక్తిగత బిరుదుగా సహజంగా అనువదించబడింది.
- source_word: ἀγαπᾷ
  choice: ప్రేమిస్తున్నాడు
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న వాస్తవాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τὸν υἱόν
  choice: కుమారుణ్ణి
  rationale: సందర్భంలో యేసును తండ్రితో ఆయనకున్న పుత్రసంబంధంలో సూచించే బిరుదును నిలుపుతుంది.
- source_word: πάντα
  choice: సమస్తాన్నీ
  rationale: నపుంసక బహువచనం తెలిపే సమగ్ర వ్యాప్తిని సంక్షిప్తంగా, స్పష్టంగా కాపాడుతుంది.
- source_word: δέδωκεν
  choice: అప్పగించాడు
  rationale: పూర్తయి ఫలితం కొనసాగుతున్న కార్యాన్ని, అలాగే అధికారమూ ఆధీనమూ కుమారునికి ఒప్పగించబడిన భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: ఆయన చేతికి
  rationale: అక్షరార్థంగా ‘ఆయన చేతిలో’ అయిన గ్రీకు ప్రయోగం అధికారాన్ని లేదా ఆధీనాన్ని అప్పగించడాన్ని సూచిస్తుంది; తెలుగులో ‘చేతికి అప్పగించాడు’ ఆ నుడికార భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: తండ్రి–కుమారుల సంబంధం
  choice: ‘తండ్రి’, ‘కుమారుడు’ అనే వ్యక్తిగత సంబంధ బిరుదులను అలాగే ఉంచడం
  alternative: సాధారణ కుటుంబ సంబంధ పదాలుగా లేదా వివరణాత్మక పరామర్శగా మార్చడం
  rationale: వచనం తెలిపే ప్రత్యేకమైన తండ్రి–కుమారుల సంబంధాన్ని సిద్ధాంతపరమైన విస్తరణ లేకుండా నిలుపుతుంది.
- issue: కుమారునికి అప్పగించబడిన దాని వ్యాప్తి మరియు కొనసాగుతున్న ఫలితం
  choice: ‘సమస్తాన్నీ ... అప్పగించాడు’
  alternative: ‘అన్నీ ఇచ్చాడు’
  rationale: πάντα యొక్క సమగ్రతను, δέδωκεν సూచించే పూర్తయిన కార్యపు నిలిచియున్న ఫలితాన్ని కాపాడుతూ, సందర్భంలోని అధికార అప్పగింత భావాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రేమిస్తున్నాడు’ కొనసాగుతున్న వర్తమాన భావాన్ని, ‘చేతికి అప్పగించాడు’ గ్రీకు నుడికారంలోని అధికార/ఆధీన భావాన్ని స్పష్టంగా తెలియజేస్తాయి.
