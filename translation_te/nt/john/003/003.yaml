id: JHN.3.3
reference: John 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: te
  text: 'యేసు అతనికి జవాబుగా ఇలా చెప్పాడు: “నిజంగా, నిజంగా నేను నీతో చెబుతున్నాను: ఎవరైనా పైనుండి పుట్టకపోతే,[a] దేవుని రాజ్యాన్ని చూడలేరు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మళ్లీ” (లేదా “కొత్తగా”). గ్రీకు పదానికి “పైనుండి,” “మళ్లీ” అనే రెండు అర్థాలూ ఉండవచ్చు; తరువాతి వచనంలోని సంభాషణ ఈ ద్వంద్వార్థంపై ఆధారపడుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: ఇలా జవాబిచ్చాడు
  rationale: గ్రీకులోని ‘జవాబిచ్చి చెప్పాడు’ అనే రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది; ప్రతిస్పందన స్వభావాన్ని నిలుపుతుంది.
- source_word: Ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: రెట్టించిన గంభీర నిశ్చయోక్తిని సాధారణ పాఠకులకు స్పష్టంగా ఉండే తెలుగులో అలాగే నిలుపుతుంది.
- source_word: ἐὰν μή τις
  choice: ఎవరైనా … పుట్టకపోతే
  rationale: లింగాన్ని నిర్దిష్టం చేయని సాధారణ షరతును సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γεννηθῇ
  choice: పుట్టకపోతే
  rationale: γεννάω కర్మణి రూపానికి సందర్భానుకూలమైన ప్రత్యక్ష తెలుగు సమానం; ‘మళ్లీ’ అనే భావాన్ని క్రియలోనే చేర్చి ἄνωθεν అర్థాన్ని ముందే నిర్ణయించదు.
- source_word: ἄνωθεν
  choice: పైనుండి
  rationale: యోహాను సువార్తలోని పైలోక మూలం/కిందలోక వ్యత్యాసానికి అనుగుణమైన ప్రధాన అర్థాన్ని ఇస్తుంది; ‘మళ్లీ’ అనే నిజమైన ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: οὐ δύναται ἰδεῖν
  choice: చూడలేరు
  rationale: అసమర్థతను తెలుగులో సహజంగా వ్యక్తం చేస్తూ ἰδεῖν యొక్క ‘చూడటం’ అనే ప్రత్యక్ష భావాన్ని, దానిలో ఉండగల గ్రహింపు లేదా అనుభవం అనే విస్తృత సూచనను కుదించకుండా నిలుపుతుంది.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యాన్ని
  rationale: రాజ్యం మరియు పరిపాలన రెండింటి భావసాధ్యతను నిలిపే స్థిరమైన, గౌరవప్రదమైన తెలుగు రూపం.
theological_decisions:
- issue: ἄνωθεν అనే పదం యొక్క అర్థం
  choice: పైనుండి
  alternative: మళ్లీ / కొత్తగా
  rationale: ఈ గ్రీకు క్రియావిశేషణానికి ‘పైనుండి’ మరియు ‘మళ్లీ’ అనే రెండూ అర్థాలు సాధ్యమే. యోహాను రచనలోని పరలోక మూలం అనే అంశం ప్రధాన పాఠంలో ‘పైనుండి’కి మద్దతిస్తుంది; అయితే తరువాతి వచనంలో నికోదేము స్పందన ‘మళ్లీ’ అనే అర్థంపైన ఆధారపడుతుంది. అందువల్ల ద్వంద్వార్థాన్ని తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే యేసు గంభీర నిశ్చయోక్తి మరియు మూలంలోని అర్థసందిగ్ధత నిలిచేలా అనువదించబడింది. గౌరవ ఏకవచనాన్ని బలవంతంగా చేర్చకుండా గ్రీకులోని రెండవ పురుష ఏకవచనానికి ‘నీతో’ వాడబడింది; సాధారణ వ్యక్తిని సూచించే వాక్యంలో లింగనిరపేక్ష బహువచన క్రియ ‘చూడలేరు’ ఉపయోగించబడింది.
