id: JHN.3.5
reference: John 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: te
  text: 'యేసు జవాబిచ్చాడు: “నేను నీతో నిజంగా, నిజంగా చెబుతున్నాను: ఎవరైనా నీరు మరియు ఆత్మ[a][b] ద్వారా జన్మించకపోతే, దేవుని రాజ్యంలో ప్రవేశించలేరు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆత్మ’ అనే పదం ఇక్కడ పరిశుద్ధాత్మను సూచించడం ఎక్కువ సంభావ్యంగా కనిపిస్తుంది; అయితే దీనిని సాధారణ ఆత్మ లేదా ఆధ్యాత్మిక సూత్రంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘నీరు మరియు ఆత్మ ద్వారా’ అనే మాటను శుద్ధీకరణ మరియు నవీకరణకు ప్రతీకగా, శారీరక జననం మరియు ఆధ్యాత్మిక జననానికి సూచనగా, లేదా బాప్తిస్మానికి సూచనగా వివిధ రీతుల్లో అర్థం చేసుకున్నారు. ప్రధాన పాఠ్యం ఈ వ్యాఖ్యానాల్లో దేనినీ నిర్ణయించకుండా గ్రీకు పదప్రయోగాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς
  choice: యేసు ఇలా జవాబిచ్చాడు
  rationale: సంభాషణలోని ప్రతిస్పందన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: రెండుసార్లు పలికిన గంభీరమైన ధృవీకరణను అర్థవంతంగా, నేరుగా తెలియజేస్తుంది.
- source_word: λέγω σοι
  choice: నేను నీతో ... చెబుతున్నాను
  rationale: రెండవ పురుష ఏకవచనమైన σοι భావాన్ని, యేసు నికొదేముతో నేరుగా మాట్లాడుతున్న సందర్భాన్ని నిలుపుతుంది.
- source_word: ἐὰν μή τις
  choice: ఎవరైనా ... కాకపోతే
  rationale: τις లోని అనిర్దిష్ట, సార్వత్రిక భావాన్ని లింగనిరపేక్షమైన సహజ తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: γεννηθῇ
  choice: జన్మించకపోతే
  rationale: కర్మణి భావంలోని ‘జన్మించడం’ అనే అర్థాన్ని నిలుపుతుంది; ఈ వచనంలో లేని ‘మళ్లీ’ లేదా ‘పైనుండి’ అనే భావాన్ని చేర్చదు.
- source_word: ἐξ ὕδατος καὶ πνεύματος
  choice: నీటివల్లా ఆత్మవల్లా
  rationale: ἐκ సూచించే మూలం లేదా సాధన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, నీరు-ఆత్మ సంబంధానికి ప్రత్యేక వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో రుద్దదు.
- source_word: οὐ δύναται εἰσελθεῖν
  choice: ప్రవేశించలేరు
  rationale: అసమర్థతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; అనిర్దిష్ట వ్యక్తిని సూచించేందుకు గౌరవ/సామాన్య బహువచన క్రియారూపం వాడబడింది.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: βασιλεία యొక్క రాజ్యం/పాలన భావాలను అనవసరంగా కుదించకుండా నిలుపుకునే స్థిరమైన, సులభంగా అర్థమయ్యే పదబంధం.
theological_decisions:
- issue: πνεύματος అనే పదం పరిశుద్ధాత్మను సూచిస్తుందా, సాధారణ ‘ఆత్మ’ను సూచిస్తుందా
  choice: ప్రధాన పాఠ్యంలో ‘ఆత్మ’
  alternative: మానవ ఆత్మ లేదా సాధారణ ఆధ్యాత్మిక సూత్రం
  rationale: యోహాను సందర్భంలో పరిశుద్ధాత్మ సూచన ఎక్కువ సంభావ్యమైనది. అయితే గ్రీకులో పెద్ద/చిన్న అక్షరాల భేదం లేకపోవడం, నామవాచకానికి నిర్దిష్ట ఉపపదం లేకపోవడం వల్ల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతున్నాం.
- issue: ‘నీరు మరియు ఆత్మ’ అనే పదబంధం యొక్క నిర్దిష్ట వివరణ
  choice: ప్రధాన పాఠ్యంలో గ్రీకు పదచిత్రాన్ని వ్యాఖ్యానించకుండా నిలుపుట
  alternative: శుద్ధీకరణ-నవీకరణ; శారీరక జననం-ఆధ్యాత్మిక జననం; బాప్తిస్మం
  rationale: ఈ పదబంధానికి ఉన్న ప్రధాన వ్యాఖ్యానాలను పాఠ్యంలో ఏ ఒక్క మతశాఖాపరమైన నిర్ణయంగా స్థిరపరచకుండా, వాక్యంలోని నిజమైన వ్యాఖ్యాన విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సంభాషణ శైలి. ‘నిజంగా, నిజంగా’ అనే పునరుక్తి మూలంలోని గంభీర ఉద్ఘాటనను నిలుపుతుంది. అనిర్దిష్ట వ్యక్తికి తెలుగు సహజ వాడుక ప్రకారం ‘ఎవరైనా ... ప్రవేశించలేరు’ అని గౌరవ/సామాన్య బహువచనం ఉపయోగించబడింది.
