id: JHN.3.22
reference: John 3:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: te
  text: ఈ సంగతుల తరువాత, యేసు తన శిష్యులతో కలిసి యూదయ ప్రాంతానికి వెళ్లాడు. అక్కడ ఆయన వారితో కొంతకాలం గడుపుతూ, బాప్తిస్మమిస్తూ ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యోహాను 4:2 ప్రకారం, యేసు స్వయంగా బాప్తిస్మం ఇవ్వలేదు; ఆయన శిష్యులే బాప్తిస్మం ఇచ్చారు.
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ఈ సంగతుల తరువాత
  rationale: బహువచన సూచనను, యోహాను కథనంలోని కాలక్రమ మార్పును సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἦλθεν
  choice: వెళ్లాడు
  rationale: గమ్యస్థానం వైపు కదలికను తెలుగు కథన శైలిలో సహజంగా వ్యక్తం చేస్తుంది; గ్రీకు క్రియకు సందర్భానుసారంగా ‘వచ్చాడు’ లేదా ‘వెళ్లాడు’ అనే భావం ఉండవచ్చు.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: తన శిష్యులతో కలిసి
  rationale: యేసుతో శిష్యులు కలిసి ప్రయాణించారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: యూదయ ప్రాంతానికి
  rationale: γῆ యొక్క ‘దేశం/భూభాగం/ప్రాంతం’ భావాన్ని ఇక్కడ సహజంగా అందిస్తుంది; యెరూషలేము నుండి యూదయ పరిసర ప్రాంతానికి వెళ్లడాన్ని సూచిస్తుంది.
- source_word: διέτριβεν
  choice: కొంతకాలం ఉండి
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగిన నివాసం లేదా కాలం గడపడం అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: μετ’ αὐτῶν
  choice: వారితో
  rationale: సందర్భంలో ‘వారు’ యేసు శిష్యులనే సహజంగా సూచిస్తుంది.
- source_word: ἐβάπτιζεν
  choice: బాప్తిస్మమిస్తూ ఉన్నాడు
  rationale: గుర్తింపబడిన మతక్రియను పద్ధతి విషయంలో ఏ ప్రత్యేక సంప్రదాయాన్నీ రుద్దకుండా తెలియజేస్తూ, అసంపూర్ణ భూతకాలంలోని కొనసాగిన చర్యను నిలుపుతుంది.
theological_decisions:
- issue: యోహాను 4:2 వెలుగులో బాప్తిస్మమిచ్చినవారి కర్త
  choice: ఈ వాక్యంలోని వ్యాకరణ నిర్మాణం ప్రకారం యేసునే కర్తగా ఉంచి, 4:2లోని వివరణను పాదసూచికలో పేర్కొనడం
  alternative: ప్రధాన పాఠ్యంలోనే శిష్యులు బాప్తిస్మమిచ్చారని మార్చడం లేదా కర్తను అస్పష్టంగా చేయడం
  rationale: ఏకవచన క్రియ సహజంగా యేసును వ్యాకరణ కర్తగా సూచిస్తుంది. యోహాను 4:2 ప్రకారం యేసు స్వయంగా కాక ఆయన శిష్యులే బాప్తిస్మమిచ్చారు; అయితే ఆ తరువాతి వివరణ ఆధారంగా 3:22 పదబంధాన్ని మార్చకుండా మూలపాఠంలోని ఉద్వేగాన్ని నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘యూదయ ప్రాంతం’ సాధారణ పాఠకులకు ‘యూదయ దేశం/భూభాగం’ కంటే సహజంగా ఉంటుంది. మూలంలోని రెండు కొనసాగిన క్రియల భావాన్ని తెలుగులో ‘కొంతకాలం ఉండి బాప్తిస్మమిస్తూ ఉన్నాడు’ అని సంక్షిప్తంగా వ్యక్తం చేశాం.
