- from: నికోదేము ఆయనకు జవాబిస్తూ, “ఇవి ఎలా జరుగగలవు?” అని అడిగాడు.[a]
  to: నికోదేము ఆయనకు జవాబిచ్చి, “ఇవి ఎలా జరుగగలవు?” అని అన్నాడు.[a]
  rationale: 'The revision changes only the dialogue formula: it uses a completed response verb for ἀπεκρίθη and retains a neutral speech verb for εἶπεν. The question and its ambiguity remain unchanged.'
