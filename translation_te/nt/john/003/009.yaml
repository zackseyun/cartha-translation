  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη Νικόδημος καὶ εἶπεν αὐτῷ· Πῶς δύναται ταῦτα γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/009.yaml
  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: te
  text: నికోదేము ఆయనకు జవాబిచ్చి, “ఇవి ఎలా జరుగగలవు?” అని అన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇవి ఎలా ఉండగలవు?”
    reason: γενέσθαι అనే పదానికి సందర్భంలో సాధ్యమైన మరింత స్థితివాచక అనువాదాన్ని నమోదు చేయడానికి.
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబిస్తూ
  rationale: సంభాషణలో ἀποκρίνομαι సాధారణంగా జవాబివ్వడాన్ని సూచిస్తుంది. తరువాతి εἶπεν‌తో కలిపి సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణం కోసం ‘జవాబిస్తూ ... అడిగాడు’ అని ఇచ్చాం.
- source_word: Νικόδημος
  choice: నికోదేము
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపంలో లిప్యంతరీకరించాం.
- source_word: εἶπεν αὐτῷ
  choice: ఆయనకు ... అని అడిగాడు
  rationale: αὐτῷలోని సర్వనామాన్ని ‘ఆయనకు’గా నిలిపి, మూలంలో లేని ‘యేసు’ అనే పేరును చేర్చలేదు. ప్రశ్నార్థక ప్రత్యక్ష వాక్యానికి తెలుగులో సహజంగా ‘అని అడిగాడు’ అని ఇచ్చాం.
- source_word: Πῶς
  choice: ఎలా
  rationale: రీతి లేదా సాధ్యతను ప్రశ్నించే సాధారణ తెలుగు ప్రశ్నార్థక క్రియావిశేషణం.
- source_word: δύναται
  choice: జరుగగలవు
  rationale: δύναμαι తెలిపే సామర్థ్యం లేదా సాధ్యతను ‘గలవు’ ద్వారా సంక్షిప్తంగా, సహజంగా వ్యక్తం చేశాం.
- source_word: ταῦτα
  choice: ఇవి
  rationale: నపుంసక బహువచన సూచనను తెలుగులో సహజమైన బహువచన సర్వనామంతో నిలిపాం; ఇది యేసు ఇంతకుముందు చెప్పిన విషయాలను సూచిస్తుంది.
- source_word: γενέσθαι
  choice: జరుగు
  rationale: γίνομαι యొక్క సంభవించడం లేదా ఉనికిలోకి రావడం అనే ఘటనాత్మక భావాన్ని సందర్భానుగుణంగా ‘జరుగు’ తెలియజేస్తుంది.
theological_decisions:
- issue: కొత్త జన్మకు సంబంధించిన విషయాల సాధ్యతపై నికోదేము వేసిన ప్రశ్న
  choice: ఇవి ఎలా జరుగగలవు?
  alternative: ఇవి ఎలా ఉండగలవు? / ఇవి ఎలా సంభవించగలవు?
  rationale: γίνομαι ఇక్కడ సంభవించడం లేదా ఉనికిలోకి రావడం అనే భావాన్ని అనుమతిస్తుంది. ‘జరుగగలవు’ సహజమైన తెలుగులో ఆ సాధ్యతను తెలియజేస్తుంది; నికోదేము ప్రశ్నలోని రహస్యాన్ని సిద్ధాంతపరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన ‘ఆయనకు’ రూపంతో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సంభాషణ శైలిని ఉపయోగించాం. మూలంలోని ‘జవాబిచ్చి చెప్పాడు’ అనే పునరుక్తిని యాంత్రికంగా ఉంచకుండా, దాని రెండు సంభాషణాత్మక అంశాలను సహజమైన తెలుగు నిర్మాణంలో ప్రతిబింబించాం.
