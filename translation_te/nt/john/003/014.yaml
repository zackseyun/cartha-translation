id: JHN.3.14
reference: John 3:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ καθὼς Μωϋσῆς ὕψωσεν τὸν ὄφιν ἐν τῇ ἐρήμῳ, οὕτως ὑψωθῆναι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου,
base_translation:
  language: en
  yaml_path: translation/nt/john/003/014.yaml
  text: And just as Moses lifted up the serpent in the wilderness[a], so the Son of Man must be lifted up[b],
translation:
  language: te
  text: మోషే అరణ్యంలో సర్పాన్ని పైకెత్తినట్లే[a], మనుష్యకుమారుడు కూడా పైకెత్తబడాలి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మోషే అరణ్యంలో సర్పాన్ని పైకెత్తిన సంఘటన కోసం సంఖ్యాకాండము 21:8–9 చూడండి.
    reason: cross_reference
  - marker: b
    text: లేదా ‘ఉన్నతపరచబడాలి.’ గ్రీకు క్రియ భౌతికంగా పైకెత్తబడటాన్నీ ఉన్నతపరచబడటాన్నీ సూచించగలదు; ఇక్కడ యోహాను బహుశా రెండు భావాలనూ ఉద్దేశిస్తున్నాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς … οὕτως
  choice: …పైకెత్తినట్లే … కూడా
  rationale: మోషే చేసిన కార్యానికీ మనుష్యకుమారునికి జరగవలసిన దానికీ ఉన్న స్పష్టమైన పోలికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὕψωσεν
  choice: పైకెత్తిన
  rationale: సంఖ్యాకాండము 21లో సర్పాన్ని ఒక ఎత్తైన స్థితిలో ఉంచిన భౌతిక చర్యను స్పష్టంగా వ్యక్తపరుస్తుంది; తరువాతి సమాన క్రియతో పదసంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: ὄφιν
  choice: సర్పాన్ని
  rationale: ఆధునిక పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన బైబిలు వాడుక; సంఖ్యాకాండములోని సూచనకు తగినది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: ఇశ్రాయేలీయుల అరణ్య ప్రయాణ నేపథ్యాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ὑψωθῆναι
  choice: పైకెత్తబడాలి
  rationale: క్రియ యొక్క భౌతిక భావాన్ని నిలుపుతూ, యోహాను రచనలో ఉండే ఉన్నతపరచబడటం అనే అదనపు భావానికి కూడా అవకాశం ఉంచుతుంది.
- source_word: δεῖ
  choice: బడాలి
  rationale: కేవలం భవిష్యత్ సంఘటనను కాక, అది తప్పక జరగవలసిన అవసరాన్ని వ్యక్తపరుస్తుంది.
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు ఉపయోగించిన స్థిరమైన బిరుదును, దాని దానియేలు గ్రంథ మరియు యోహాను సువార్త సంబంధిత ప్రతిధ్వనులతో సహా నిలుపుతుంది.
theological_decisions:
- issue: ὑψόω అనే క్రియలోని యోహాను సువార్తకు ప్రత్యేకమైన ద్వంద్వార్థం
  choice: రెండు సందర్భాల్లోనూ ‘పైకెత్తు’ అనే ఒకే మూలక్రియను వాడటం
  alternative: రెండవ సందర్భాన్ని ‘ఉన్నతపరచబడాలి’ అని అనువదించడం
  rationale: ఈ పోలిక సర్పాన్ని భౌతికంగా పైకెత్తడానికీ మనుష్యకుమారుడు పైకెత్తబడడానికీ సంబంధం కలుపుతుంది; అదే సమయంలో రెండవ సందర్భంలో ఉన్నతపరచబడటం అనే భావాన్నీ సూచించగలదు. ప్రధాన పాఠ్యం ఈ ఉద్దేశపూర్వక భావ ఉద్రిక్తతను ఒకే అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘మనుష్యకుమారుడు’ స్థిరమైన బైబిలు బిరుదుగా నిలుపబడింది. ప్రధాన పాఠ్యంలో [a], [b] గుర్తులు రెండూ ఉన్నాయి; వాటి విషయాలు అవి సూచించే పదబంధాలకు అనుగుణంగా అమర్చబడ్డాయి.
