source:
  edition: SBLGNT
  text: τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: te
  text: శరీరం నుంచి పుట్టినది శరీరమే[a]; ఆత్మ నుంచి పుట్టినది ఆత్మయే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘శరీరం’ సహజ మానవ జననాన్ని లేదా మానవ స్వభావాన్ని సూచిస్తుంది. కొన్ని సందర్భాల్లో ఈ గ్రీకు పదం పతిత లేదా పాపసంబంధమైన మానవ స్వభావాన్ని సూచించగలదు; అయితే ఇక్కడ ప్రధాన వ్యత్యాసం ఆత్మ నుంచి కలిగే జననంతో ఉంది.
    reason: lexical_alternative
  - marker: b
    text: మొదటి ‘ఆత్మ’ పరిశుద్ధాత్మను సూచిస్తుంది. చివరి మాటను ‘ఆధ్యాత్మికమైనది’ అని కూడా భావానువాదం చేయవచ్చు; అయితే గ్రీకు మూలంలో అది నామవాచకంగా ‘ఆత్మ/స్పిరిట్’ అని ఉంది. అందువల్ల ‘శరీరం’తో గుణాత్మక వ్యత్యాసం నిలుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: పుట్టినది
  rationale: నపుంసక ఏకవచన ఆర్టికల్‌తో కూడిన పర్ఫెక్ట్ పాసివ్ పార్టిసిపల్ ఇక్కడ ఒక నిర్దిష్ట వ్యక్తిని కాక, సాధారణ వర్గాన్ని సూచిస్తుంది. ‘పుట్టినది’ ఆ సాధారణ, సూత్రప్రాయ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐκ
  choice: నుంచి
  rationale: జననానికి మూలం లేదా ఉద్భవస్థానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: σάρξ / σαρκὸς
  choice: శరీరం
  rationale: ఈ సందర్భంలో σάρξ ప్రధానంగా సహజ మానవ జనన రంగాన్ని ఆత్మనుంచి కలిగే జననంతో వ్యత్యాసపరుస్తుంది. ‘పాప స్వభావం’ అని అనువదిస్తే మూలపాఠం చెప్పేదానికంటే సంకుచితమైన నైతిక వ్యాఖ్యానాన్ని చేర్చినట్లవుతుంది.
- source_word: πνεύματος / πνεῦμά
  choice: ఆత్మ / ఆత్మ
  rationale: మొదటి పదం సందర్భంలో పరిశుద్ధాత్మను మూలంగా సూచిస్తుంది; రెండవది ఆ జననం వల్ల కలిగే స్వభావాన్ని గుణాత్మకంగా సూచిస్తుంది. రెండింటికీ ‘ఆత్మ’ అనే నామవాచకాన్ని ఉంచడం గ్రీకు పదప్రయోగాన్నీ, ఉద్దేశపూర్వక వ్యత్యాసాన్నీ కాపాడుతుంది.
- source_word: ἐστιν
  choice: మే
  rationale: తెలుగులో ‘శరీరమే’, ‘ఆత్మే’ అనే రూపాలు గ్రీకులోని సాధారణ వర్తమాన అనుసంధాన క్రియను సంక్షిప్తంగా, సూత్రప్రాయంగా వ్యక్తం చేస్తాయి.
theological_decisions:
- issue: మొదటి వాక్యభాగంలో σάρξ అర్థం
  choice: సహజ మానవ జననాన్ని సూచించే ‘శరీరం’
  alternative: పాప స్వభావం
  rationale: σάρξ కొన్ని సందర్భాల్లో నైతికంగా పతిత మానవ స్వభావాన్ని సూచించగలిగినా, ఇక్కడ ప్రధాన వ్యత్యాసం సహజ జననానికి మరియు ఆత్మనుంచి కలిగే జననానికి మధ్య ఉంది. అందువల్ల నైతిక భావాన్ని బలవంతంగా నిర్ణయించకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: రెండవ వాక్యభాగంలోని πνεῦμα సూచన
  choice: ‘ఆత్మే’ అనే గుణాత్మక నామవాచక ప్రయోగం
  alternative: ఆధ్యాత్మికమైనది
  rationale: గ్రీకులో విధేయ నామవాచకానికి ఆర్టికల్ లేదు; అది ఆత్మనుంచి పుట్టిన దాని గుణం లేదా స్వభావాన్ని సూచించగలదు. ‘ఆధ్యాత్మికమైనది’ భావానువాదంగా సాధ్యమే కానీ, ‘ఆత్మే’ మూలంలోని నామవాచక రూపాన్నీ ‘శరీరం—ఆత్మ’ సమాంతరతనూ మరింత నేరుగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన సూత్రవాక్య శైలి వాడబడింది. ‘నుంచి’ సాధారణ పాఠకులకు సహజంగా ఉండగా, ‘శరీరమే/ఆత్మే’ రూపాలు మూలంలోని సమాంతర నిర్మాణం మరియు బలాన్ని నిలుపుతాయి.
