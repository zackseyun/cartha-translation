  source_fidelity: The draft accurately represents the contrast (δέ), the characteristic person who practices truth, movement toward the light, the purpose clause, the passive disclosure of the works, and the open sense of ἐν θεῷ. Its content-clause rendering of ὅτι is defensible, while the footnote appropriately retains the possible causal reading.
  naturalness: The final wording, “వెల్లడయ్యేలా అలా వస్తాడు,” is repetitive and syntactically awkward in modern standard Telugu. Recasting the purpose clause directly produces a natural sentence without altering the source meaning.
  terminology: “సత్యాన్ని ఆచరించేవాడు,” “కార్యాలు,” and “దేవునిలో” are suitable, theologically non-sectarian choices. “వెలుగువద్దకు” is a natural rendering of πρὸς τὸ φῶς and does not overstate movement into the light.
  issues:
  - severity: medium
    issue: Awkward and redundant final purpose construction
    rationale: “అతని కార్యాలు దేవునిలో చేయబడినవని వెల్లడయ్యేలా అలా వస్తాడు” repeats the coming action through “అలా వస్తాడు” and leaves the purpose relationship less natural than it should be. The Greek has one purpose clause, ἵνα φανερωθῇ, which Telugu can express directly as “వెల్లడికావడానికి.”
