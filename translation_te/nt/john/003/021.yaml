id: JHN.3.21
reference: John 3:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: te
  text: కాని సత్యాన్ని ఆచరించేవాడు[a] వెలుగువద్దకు వస్తాడు, తన కార్యాలు దేవునిలో చేయబడినవని[b][c] వెల్లడికావడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా ‘సత్యాన్ని చేసేవాడు.’ దీనిని ‘సత్యమైనదాన్ని చేసేవాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన కార్యాలు వెల్లడికావడానికి అతడు వెలుగువద్దకు వస్తాడు, ఎందుకంటే అవి దేవునిలో చేయబడ్డాయి.’ ‘ὅτι’ అనే పదం వెల్లడయ్యే విషయాన్ని గానీ, అవి వెల్లడయ్యే కారణాన్ని గానీ పరిచయం చేయవచ్చు.
    reason: alternative_reading
  - marker: c
    text: ‘దేవునిలో’ అనే మాటను సందర్భానుసారం ‘దేవునిచేత’ లేదా ‘దేవుని ద్వారా’ అని కూడా అర్థం చేసుకోవచ్చు; అయితే గ్రీకు పదప్రయోగం మరింత తెరచి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: కాని సత్యాన్ని ఆచరించేవాడు
  rationale: δέ ముందున్న వాక్యంతో మృదువైన వ్యత్యాసాన్ని చూపుతుంది. ποιῶν అనే వర్తమాన కృదంతం అలవాటుగా లేదా స్వభావపూర్వకంగా చేసే వ్యక్తిని సూచిస్తుంది. ‘సత్యాన్ని ఆచరించడం’ అనే తెలుగు ప్రయోగం గ్రీకు ‘సత్యాన్ని చేయడం’ అనే భావాన్ని సహజంగా వ్యక్తం చేస్తూ, సత్యం క్రియల్లో కనిపించాలనే యోహాను భావాన్ని నిలుపుతుంది.
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: వెలుగు దగ్గరికి వస్తాడు
  rationale: πρός చలనానికి గమ్యం లేదా సమీపాన్ని సూచిస్తుంది. ‘దగ్గరికి’ అనేది ‘వెలుగులోనికి’ అని అర్థాన్ని విస్తరించకుండా, వెలుగును సమీపించే రూపకాన్ని నిలుపుతుంది.
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: అతని కార్యాలు ... వెల్లడయ్యేలా
  rationale: ἵνα ఉద్దేశాన్ని సూచిస్తుంది; φανερωθῇ కర్మణి రూపాన్ని ‘వెల్లడయ్యేలా’ నిలుపుతుంది. ἔργαకు ‘కార్యాలు’ అని ఇవ్వడం దాని విస్తృత అర్థాన్ని అనవసరంగా నైతికంగా సంకుచితం చేయదు.
- source_word: ὅτι
  choice: …చేయబడినవని
  rationale: ఇక్కడ ὅτι వెల్లడయ్యే విషయాన్ని పరిచయం చేస్తుందనే పఠనాన్ని ప్రధాన పాఠంలో తీసుకున్నాం. అయితే కారణార్థకమైన ‘ఎందుకంటే’ అనే పఠనం కూడా సాధ్యమే కాబట్టి పాదసూచికలో ఉంచాం.
- source_word: ἐν θεῷ
  choice: దేవునిలో
  rationale: ἐν అనే పూర్వప్రత్యయాన్ని సాధ్యమైనంత తెరచిన రీతిలో నిలిపి, దైవ కార్యసాధకత్వం, పరిధి, సంబంధం అనే భావాల్లో ఏ ఒక్కదానికీ పరిమితం చేయలేదు.
- source_word: ἐστιν εἰργασμένα
  choice: చేయబడినవి
  rationale: పరిపూర్ణ కర్మణి భావాన్ని సహజమైన తెలుగు కర్మణి నిర్మాణంతో వ్యక్తం చేస్తుంది; కార్యాలు పూర్తై ప్రస్తుత ఫలితస్థితిలో ఉన్నాయనే భావాన్ని సందర్భం మోస్తుంది.
theological_decisions:
- issue: ποιῶν τὴν ἀλήθειαν అనే ప్రయోగం
  choice: సత్యాన్ని ఆచరించేవాడు
  alternative: సత్యాన్ని చేసేవాడు; సత్యమైనదాన్ని చేసేవాడు
  rationale: పదక్షరానువాదమైన ‘సత్యాన్ని చేసేవాడు’ ఆధునిక తెలుగులో అసహజంగా ఉంటుంది. ‘ఆచరించేవాడు’ సత్యం కేవలం నమ్మబడేది కాక జీవనంలో కార్యరూపం దాల్చేదని తెలిపి, మూలంలోని నైతిక-ప్రకటనాత్మక బలాన్ని కాపాడుతుంది.
- issue: ὅτι యొక్క సంబంధం
  choice: వెల్లడయ్యే విషయాన్ని పరిచయం చేసేదిగా
  alternative: కార్యాలు వెల్లడయ్యే కారణాన్ని పరిచయం చేసేదిగా—‘ఎందుకంటే అవి దేవునిలో చేయబడ్డాయి’
  rationale: రెండు వాక్యనిర్మాణాలు సాధ్యమే. ప్రధాన పాఠంలో విషయార్థక పఠనం ప్రవాహానికి అనుకూలంగా ఉంది; కారణార్థక పఠనాన్ని పాదసూచికలో ఉంచి మూలంలోని సందిగ్ధతను కాపాడాం.
- issue: ἐν θεῷ యొక్క భావం
  choice: దేవునిలో
  alternative: దేవునిచేత; దేవుని ద్వారా; దేవునితో ఐక్యతలో
  rationale: గ్రీకు పదబంధం దైవ కార్యసాధకత్వం, దైవ పరిధి, దేవునితో సంబంధం వంటి భావాలకు తెరచి ఉంది. ‘దేవునిలో’ అని ఉంచడం ఏ ఒక్క సిద్ధాంతపరమైన వివరణనూ బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘సత్యాన్ని ఆచరించడం,’ ‘వెలుగు దగ్గరికి రావడం,’ ‘దేవునిలో’ అనే యోహాను రూపకాలు, భావసాంద్రత నిలుపబడ్డాయి. చివరి ఉద్దేశవాక్యంలో తెలుగు సహజత్వం కోసం ‘అలా వస్తాడు’ అని స్పష్టీకరించబడింది.
