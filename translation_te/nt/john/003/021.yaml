revisions:
- from: కాని సత్యాన్ని ఆచరించేవాడు[a] వెలుగు దగ్గరికి వస్తాడు; అతని కార్యాలు దేవునిలో చేయబడినవని[b][c] వెల్లడయ్యేలా అలా వస్తాడు.
  to: కాని సత్యాన్ని ఆచరించేవాడు[a] వెలుగువద్దకు వస్తాడు, తన కార్యాలు దేవునిలో చేయబడినవని[b][c] వెల్లడికావడానికి.
  rationale: 'The revision removes the redundant “అలా వస్తాడు” and makes the ἵνα purpose clause idiomatic: the person comes to the light in order that it may be disclosed that his works have been done in God. It preserves the main-text content reading of ὅτι, the passive/resultative sense of εἰργασμένα, and the deliberately open rendering “దేవునిలో.” Footnote anchors remain valid and their alternatives continue to reflect the Greek ambiguity.'
