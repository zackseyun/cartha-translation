id: JHN.3.15
reference: John 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα πᾶς ὁ πιστεύων ⸂ἐν αὐτῷ⸃ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/015.yaml
  text: so that everyone who believes in him may have eternal life[a][b].
translation:
  language: te
  text: ఆయనలో విశ్వసించే ప్రతి ఒక్కరూ నిత్యజీవం కలిగి ఉండేలా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: పొందేలా
  rationale: ముందటి వాక్యంతో ఉన్న ఉద్దేశం లేదా ఫలిత సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πᾶς ὁ πιστεύων
  choice: విశ్వసించే ప్రతి ఒక్కరూ
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతం యొక్క సాధారణ, సమగ్ర పరిధిని స్పష్టంగా నిలుపుతుంది.
- source_word: πιστεύων
  choice: విశ్వసించే
  rationale: యోహాను రచనలో πιστεύωకు పారదర్శకమైన, స్థిరమైన తెలుగు సమానార్థకం; మూలంలోని వర్తమాన రూపాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: మూలపాఠంలో εἰς కాకుండా ἐν ఉన్నందున, ‘ఆయనలో’ అని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἔχῃ
  choice: పొందేలా
  rationale: ἵναతో వచ్చిన వర్తమాన సంభావనార్థక క్రియను తెలుగులో ఉద్దేశార్థక నిర్మాణంగా సహజంగా అందిస్తుంది; ‘కలిగి ఉండేలా’ కంటే జీవం అనుగ్రహింపబడే భావసందర్భంలో సులభంగా అర్థమవుతుంది.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవం
  rationale: యోహాను సందర్భంలో స్థిరపడిన, సహజమైన పదబంధం; అంతంలేని జీవాన్నీ రాబోయే యుగానికి సంబంధించిన జీవగుణాన్నీ సూచించగలదు.
theological_decisions:
- issue: ἐν αὐτῷతో ఉన్న యోహాను విశ్వాస ప్రయోగం
  choice: ఆయనలో
  alternative: ఆయనను / ఆయనయందు
  rationale: గ్రీకు పాఠం ἐν αὐτῷ అని ఉంది; ఎక్కువగా కనిపించే εἰς αὐτόν నిర్మాణాన్ని ఇక్కడికి దిగుమతి చేయకుండా మూలంలోని ఉపసర్గను నిలుపుతుంది.
- issue: πᾶς ὁ πιστεύων యొక్క పరిధి
  choice: విశ్వసించే ప్రతి ఒక్కరూ
  alternative: విశ్వసించేవారు ఎవరైనా
  rationale: ఈ పదబంధం సాధారణమైన, సమగ్ర పరిధిని కలిగి ఉంది. ‘ప్రతి ఒక్కరూ’ ఆ పరిధిని స్పష్టంగా తెలియజేస్తుంది.
- issue: ζωὴν αἰώνιον భావవ్యాప్తి
  choice: నిత్యజీవం
  alternative: శాశ్వత జీవం / యుగసంబంధమైన జీవం
  rationale: ప్రధాన పాఠంలో సహజమైన సంప్రదాయ పదాన్ని ఉంచుతూ, దాని భావాన్ని కేవలం కాలవ్యవధికి మాత్రమే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఇది ముందటి వాక్యంపై ఆధారపడే ఉద్దేశార్థక ఉపవాక్యం కావడంతో మూలంలోని వాక్యఖండ స్వభావం నిలుపబడింది. ‘ఆయనలో’ అనే రూపం ἐν αὐτῷను స్పష్టంగా కాపాడుతుంది.
