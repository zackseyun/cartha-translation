  text: οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν ⸀ὁ Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/024.yaml
  text: For John had not yet been thrown into prison[a].
translation:
  language: te
  text: ఎందుకంటే, అప్పటికి యోహాను ఇంకా చెరసాలలోకి వేయబడలేదు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, బాప్తిస్మమిచ్చే యోహాను.
    reason: cross_reference
lexical_decisions:
- source_word: οὔπω
  choice: అప్పటికి ఇంకా ... లేదు
  rationale: కథనంలోని ఆ సమయానికి ఆ చర్య ఇంకా జరగలేదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: చుట్టుపక్కల కథనానికి వివరణాత్మక నేపథ్యాన్ని అందించే γάρ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἦν βεβλημένος
  choice: వేయబడలేదు
  rationale: ఇది గతంలోని సూచిత సమయానికి ముందే పూర్తయ్యే చర్యను సూచించే పరిభాషాత్మక భూతపూర్వ నిష్క్రియ నిర్మాణం. ‘అప్పటికి ఇంకా’తో కలిపి తెలుగులో ఆ కాలభావం సహజంగా వ్యక్తమవుతుంది.
- source_word: εἰς τὴν φυλακήν
  choice: చెరసాలలో
  rationale: ఇక్కడ φυλακή నిర్బంధ స్థలమైన చెరసాలను సూచిస్తుంది. గ్రీకు εἰς దిశాభావం తెలుగులో ‘చెరసాలలో వేయడం’ అనే సహజ ప్రయోగంలో అంతర్భవిస్తుంది.
- source_word: ὁ Ἰωάννης
  choice: యోహాను
  rationale: గ్రీకు మూలంలో ఉన్న సాధారణ పేరునే ఉంచి, ప్రధాన వాక్యంలో ‘బాప్తిస్మమిచ్చే యోహాను’ అని అదనపు గుర్తింపును చేర్చలేదు.
theological_decisions:
- issue: Ἰωάννης అనే వ్యక్తి గుర్తింపు
  choice: యోహాను
  alternative: బాప్తిస్మమిచ్చే యోహాను
  rationale: సందర్భం ఇతడు బాప్తిస్మమిచ్చే యోహాను అని తెలియజేస్తున్నా, ఈ వచనంలోని గ్రీకు పాఠం కేవలం ‘యోహాను’ అని మాత్రమే చెబుతుంది. అందువల్ల మూలానికి మించిన వివరణను ప్రధాన వాక్యంలో చేర్చకుండా, గుర్తింపును పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘ఎందుకంటే’ వివరణాత్మక సంబంధాన్ని, ‘అప్పటికి ఇంకా’ కాలసంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తాయి.
