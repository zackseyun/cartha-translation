source:
  edition: SBLGNT
  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: te
  text: పై నుండి వచ్చేవాడు సమస్తానికంటే ఉన్నతుడు.[a] భూమికి చెందినవాడు భూమికే చెందినవాడు; భూమి నుంచే మాట్లాడతాడు.[b] పరలోకం నుండి వచ్చేవాడు సమస్తానికంటే ఉన్నతుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోకం నుండి.” ఇక్కడ “పై నుండి” అనే గ్రీకు పదం పైలోక మూలాన్ని సూచిస్తుంది; తరువాత వచ్చే “పరలోకం నుండి” అనే మాట దాని భావాన్ని స్పష్టపరుస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “భూమిని గూర్చి మాట్లాడతాడు.” గ్రీకులో “భూమి నుండి/భూమికి చెందిన” అనే భావం మళ్లీ మళ్లీ వస్తుంది; అది మూలాన్ని, పరిధిని, లేదా మాటల విషయాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: పైనుండి
  rationale: ఇక్కడ ఈ పదం పునరావృతిని కాక, పైలోకం నుండి వచ్చిన మూలాన్ని సూచిస్తుంది. ఇది ‘భూమి నుండి’ అనే వ్యత్యాసాన్ని నిలుపుతూ, తరువాతి ‘పరలోకం నుండి’ అనే మాటకు దారితీస్తుంది.
- source_word: ἐρχόμενος
  choice: వచ్చేవాడు
  rationale: వ్యక్తిని సూచించే వర్తమాన కృదంతాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; వర్ణనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: ἐπάνω πάντων
  choice: అందరికంటే ఉన్నతుడు
  rationale: సందర్భంలో ఇది కేవలం స్థలపరంగా పైన ఉండటాన్ని కాక ఆధిక్యతను సూచిస్తుంది. πάντων పురుషులు లేదా సమస్తం అనే విస్తృతార్థం కలిగి ఉండగలదనే అంశాన్ని పాదసూచికలో నిలుపుతున్నాం.
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: భూమి నుండి వచ్చినవాడు
  rationale: భూసంబంధమైన మూలాన్ని స్పష్టంగా తెలియజేసి, పరలోక మూలంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: భూమికి చెందినవాడు
  rationale: గ్రీకు వాక్యంలోని పునరుక్తిని తెలుగులో అర్థవంతంగా నిలుపుతూ, అతని మూలం మరియు స్వభావ పరిధిని సూచిస్తుంది.
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: భూమి నుండే మాట్లాడతాడు
  rationale: ἐκ అనే మూలం/పరిధి సూచనను నిలుపుతుంది; మాటల విషయమే భూమి అని అనవసరంగా ఖరారు చేయదు.
- source_word: οὐρανός
  choice: పరలోకం
  rationale: ఇక్కడ భౌతిక ఆకాశం కంటే దైవికమైన పైలోక మూలం ఉద్దేశించబడింది; ‘పరలోకం’ ఆ వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘పైనుండి’ మరియు ‘పరలోకం నుండి’ మధ్య సంబంధం
  choice: మొదటి పదబంధాన్ని ‘పైనుండి,’ తరువాతిదాన్ని ‘పరలోకం నుండి’గా వేర్వేరుగా అనువదించడం
  alternative: రెండింటినీ ‘పరలోకం నుండి’గా అనువదించడం
  rationale: మూలంలోని సంబంధితమైనా వేర్వేరు పదప్రయోగాలను నిలుపుతుంది. రెండవ పదబంధం మొదటిదాని భావాన్ని స్పష్టపరచనిస్తుంది; యేసు పరలోక మూలం మరియు ఆధిక్యతను అతివ్యాఖ్యానం లేకుండా వ్యక్తం చేస్తుంది.
- issue: భూమిని గురించిన మూడుసార్ల పునరుక్తి
  choice: ‘భూమి నుండి ... భూమికి ... భూమి నుండే’ అనే పునరుక్తిని నిలుపడం
  alternative: ‘భూసంబంధమైనవాడు భూసంబంధమైన రీతిలో మాట్లాడతాడు’ అని కుదించడం
  rationale: ఈ పునరుక్తి భూలోక మూలానికి, పరలోక మూలానికి మధ్య వ్యత్యాసాన్ని బలపరుస్తుంది. దాన్ని పూర్తిగా మెరుగుపరచి తొలగించడం మూలంలోని వాక్చాతుర్యాన్ని బలహీనపరుస్తుంది.
- issue: πάντων యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘అందరికంటే’ అని ఇవ్వడం, ‘సమస్తానికంటే’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో చూపడం
  alternative: ప్రధాన పాఠ్యంలో ‘సమస్తానికంటే’ అని ఇవ్వడం
  rationale: గ్రీకు బహువచన రూపం వ్యక్తులను లేదా సమస్తాన్ని సూచించగలదు. సందర్భంలోని వ్యక్తుల పోలికకు ‘అందరికంటే’ సహజమైనది; విస్తృతమైన సృష్టి-సార్వభౌమత్వ భావాన్ని ప్రత్యామ్నాయంగా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన కాని అతిగా గ్రాంథికం కాని శైలి. మూలంలోని భూమి/పరలోకం వ్యత్యాసం మరియు పునరుక్తి సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
