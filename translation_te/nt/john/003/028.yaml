id: JHN.3.28
reference: John 3:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: te
  text: “నేను మెస్సీయను[a] కాను; ఆయనకు ముందుగా పంపబడినవాణ్ణి[b]” అని నేను చెప్పానని మీరే నాకు సాక్ష్యమిస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తును.”
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఆయనకు ముందు పంపబడ్డాను” లేదా “ఆయనకు ముందు పంపబడి ఉన్నాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: మీరే
  rationale: రెండు సర్వనామాల వల్ల కలిగే ఉద్ఘాటనను ఆధునిక తెలుగులో సహజంగా ‘మీరే’ తెలియజేస్తుంది.
- source_word: μοι μαρτυρεῖτε
  choice: నాకు సాక్ష్యమిస్తున్నారు
  rationale: యోహాను రచనలోని సాక్ష్య సంబంధమైన భావాన్ని నిలుపుతూ, యోహాను చెప్పిన మాట నిజమని శ్రోతలే ధృవీకరిస్తున్నారని సహజంగా తెలియజేస్తుంది.
- source_word: εἶπον
  choice: నేను చెప్పాను
  rationale: ఏకకాలిక భూతకాల క్రియ యోహాను ఇంతకు ముందు స్పష్టంగా చెప్పిన మాటను సూచిస్తుంది.
- source_word: ὁ χριστός
  choice: మెస్సీయను
  rationale: ఇక్కడ ఇది వ్యక్తిపేరులా కాక, ఎదురుచూస్తున్న అభిషిక్తుని బిరుదుగా వాడబడింది; ‘మెస్సీయ’ ఆ బిరుదును స్పష్టంగా నిలుపుతుంది.
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: పంపబడినవాణ్ణి
  rationale: ముందుగా పంపబడిన కార్యం జరిగిపోయినదనీ, దానివల్ల ఏర్పడిన యోహాను నియామక స్థితి ఇంకా వర్తిస్తోందనీ ఈ రూపం సహజంగా సూచిస్తుంది.
- source_word: ἔμπροσθεν ἐκείνου
  choice: ఆయనకు ముందుగా
  rationale: యోహాను ఆయనకన్నా ముందే పంపబడిన సిద్ధపరిచే దూత అనే సంబంధాన్ని తెలియజేస్తుంది; గౌరవంలో పైస్థానం అనే భావాన్ని చేర్చదు.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో బాప్తిస్మమిచ్చే యోహాను తానే ఎదురుచూస్తున్న అభిషిక్తుడు కాదని నిరాకరిస్తున్నాడు. అందువల్ల బిరుదు భావాన్ని ‘మెస్సీయ’ స్పష్టంగా తెలియజేస్తుంది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ఉంచాం.
- issue: Ἀπεσταλμένος εἰμὶ లోని నియామక భావం
  choice: ఆయనకు ముందుగా పంపబడినవాణ్ణి
  alternative: ఆయనకు ముందు పంపబడ్డాను / ఆయనకు ముందు పంపబడి ఉన్నాను
  rationale: గ్రీకు నిర్మాణం గతంలో జరిగిన పంపడాన్ని, దాని ఫలితంగా కొనసాగుతున్న నియామక స్థితిని కలిపి చూపుతుంది. ప్రధాన పాఠం ఆ రెండు కోణాలను సాధ్యమైనంత సహజంగా నిలుపుతుంది; యోహాను పాత్ర గురించి మూలంలో లేని అదనపు సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘మీరే’ అనే రూపం మూలంలోని ఉద్ఘాటనను మితంగా నిలుపుతుంది. ఉల్లేఖనాన్ని ముందుంచడం ద్వారా తెలుగు వాక్యక్రమం సహజంగా ఉంటుంది. ‘ఆయన’ గౌరవప్రద సూచన అయినప్పటికీ మూలంలోని ἐκείνου కంటే అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
