translation:
  language: te
  text: ఆయన పెరగాలి[a]; నేను తగ్గాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అక్షరార్థంగా: ‘ఆయన పెరగాలి; నేను తక్కువ కావాలి.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνον
  choice: ఆయన
  rationale: సందర్భంలో ఈ సూచన సర్వనామం యేసును సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో గౌరవార్థకమైన ‘ఆయన’ సహజంగా ఉండి, గ్రీకు పదంలోని సూచన భావాన్ని అతిగా నొక్కిచెప్పదు.
- source_word: δεῖ
  choice: హెచ్చాలి … తగ్గాలి
  rationale: ‘-ఆలి’ రూపం అవసరతను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది. ఆ అవసరత దైవ నిర్ణయమా లేక కేవలం పరిస్థితుల వల్ల కలిగినదా అనేది అదనంగా నిర్ధారించదు.
- source_word: αὐξάνειν
  choice: హెచ్చాలి
  rationale: ‘హెచ్చు’ అనేది పెరగడం, ప్రాధాన్యం అధికమవడం అనే విస్తృత భావాన్ని నిలుపుతుంది; సంఖ్యాపరమైన పెరుగుదలకే పరిమితం చేయదు.
- source_word: ἐμὲ
  choice: నేనేమో
  rationale: అనంతక్రియకు భావకర్త అయిన ἐμὲ తెలుగులో ‘నేను’గా వస్తుంది. ‘ఏమో’ ప్రత్యయం రెండు భాగాల మధ్య ఉన్న వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ … δὲ
  choice: ; … ఏమో
  rationale: గ్రీకు వాక్యంలోని సమతుల్యమైన వ్యత్యాసాన్ని తెలుగులో అర్ధవిరామం మరియు ‘నేనేమో’ ద్వారా సహజంగా నిలిపాం; ‘కానీ’ చేర్చడం అవసరం లేదు.
- source_word: ἐλαττοῦσθαι
  choice: తగ్గాలి
  rationale: ఈ రూపం ‘తక్కువ కావడం’ లేదా ‘క్షీణించడం’ అనే భావాన్ని ఇస్తుంది. ‘హెచ్చాలి—తగ్గాలి’ అనే జత మూలంలోని సంక్షిప్త సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: δεῖ తెలియజేసే అవసరత స్వభావం
  choice: ‘-ఆలి’ రూపంతో అవసరతను స్పష్టంగా ఉంచడం
  alternative: దీనిని కేవలం ఆచరణాత్మక అవసరంగా లేదా స్పష్టమైన దైవ ఆజ్ఞగా విపులీకరించడం
  rationale: యేసు ప్రాధాన్యం పెరిగి, యోహాను ప్రాధాన్యం తగ్గడం అవసరమని వాక్యం చెబుతుంది; అయితే ఆ అవసరత స్వభావాన్ని వివరించదు. అందువల్ల అనువాదం దాని వేదాంతపరమైన బరువును నిలుపుతూ, అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన, సామెతవంటి సమాంతర నిర్మాణం వాడబడింది. ‘హెచ్చాలి’ సాధారణ పాఠకులకు అర్థమయ్యే సాహిత్యోచిత పదం; సందర్భంలో ప్రాధాన్యం పెరగడాన్ని సూచించినా, మూలంలో లేని వివరణను ప్రధాన పాఠ్యంలో చేర్చదు.
