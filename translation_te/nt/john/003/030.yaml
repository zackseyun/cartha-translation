  naturalness: ‘ఆయన పెరగాలి; నేను తగ్గాలి’ is concise, natural modern standard Telugu, and preserves the proverbial parallelism. It avoids the somewhat marked and potentially unclear ‘హెచ్చాలి.’
  terminology: ‘ఆయన’ appropriately refers respectfully to Jesus in context without imposing theological interpretation. ‘పెరగాలి’ and ‘తగ్గాలి’ form a natural parallel and retain the unqualified necessity of δεῖ. The footnote gives a closer lexical alternative without claiming that it is the only sense.
