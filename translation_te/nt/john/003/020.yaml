id: JHN.3.20
reference: John 3:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: te
  text: ఎందుకంటే, చెడు పనులు చేస్తూ ఉండే ప్రతి వ్యక్తి వెలుగును ద్వేషిస్తాడు; తన పనులు బయటపడకూడదని[a] వెలుగు దగ్గరకు రాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఖండించబడకూడదని” లేదా “దోషిగా నిరూపించబడకూడదని.” గ్రీకు క్రియ చెడును బయటపెట్టడం, తప్పును చూపడం, లేదా దోషాన్ని నిరూపించడం అనే భావాలను కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు వాక్యం పురుష ఏకవచన రూపాన్ని ఉపయోగించినా, చెడు పనులు చేసే ఏ వ్యక్తినైనా సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: ఎందుకంటే ... ప్రతి వ్యక్తి
  rationale: γάρ ముందటి వాక్యానికి వివరణను కలుపుతుంది; ఆర్టికల్‌తో కూడిన πᾶς మరియు కృదంతం ఒక లక్షణంతో గుర్తించబడే ప్రతి వ్యక్తిని సాధారణంగా సూచిస్తాయి.
- source_word: φαῦλα
  choice: చెడు పనులు
  rationale: యోహాను రచనలో వెలుగుకు విరుద్ధంగా ఉన్న నైతిక చెడును సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేందుకు πράσσωνతో కలిపి అనువదించబడింది.
- source_word: πράσσων
  choice: చేస్తూ ఉండే
  rationale: వర్తమాన కృదంతం అలవాటైన లేదా కొనసాగుతున్న ప్రవర్తనను సూచించగలదు; ఈ భావాన్ని తెలుగు రూపం నిలుపుతుంది.
- source_word: μισεῖ
  choice: ద్వేషిస్తాడు
  rationale: μισέωలోని బలమైన వ్యతిరేకతను నేరుగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ φῶς
  choice: వెలుగు
  rationale: యోహాను సువార్తలో ప్రకటన, సత్యం, దేవుని స్వీయబయలుపరచడం వంటి భావాలను మోసే రూపకాన్ని వ్యాఖ్యానించి మార్చకుండా నిలుపుతుంది.
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: వెలుగు దగ్గరకు రాడు
  rationale: వెలుగు వైపు రావడం అనే యోహాను చిత్రణను సహజమైన తెలుగు పదబంధంతో కాపాడుతుంది.
- source_word: ἵνα μὴ
  choice: '...కూడదని'
  rationale: ప్రతికూల ఉద్దేశం లేదా తప్పించుకోవాలనే ఉద్దేశాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐλεγχθῇ
  choice: బయటపడకూడదని
  rationale: వెలుగు పనుల నిజ స్వరూపాన్ని బహిర్గతం చేసే సందర్భానికి సరిపోతుంది; అదే సమయంలో గ్రీకు క్రియలో మందలించడం లేదా దోషాన్ని నిరూపించడం అనే భావాలు కూడా ఉండవచ్చని పాదసూచిక తెలియజేస్తుంది.
- source_word: τὰ ἔργα αὐτοῦ
  choice: తన పనులు
  rationale: ఏకవచన సాధారణ వ్యక్తితో ఉన్న αὐτοῦను తెలుగు ప్రతిబింబాత్మక స్వామ్యరూపమైన ‘తన’ సహజంగా సూచిస్తుంది; ἔργαకు ‘పనులు’ విస్తృతమైన నైతిక క్రియల భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: సాధారణ వ్యక్తిని సూచించే ఏకవచన పురుషరూపం
  choice: ప్రతి వ్యక్తి ... తన పనులు
  alternative: ప్రతి పురుషుడు ... అతని పనులు
  rationale: గ్రీకులో వ్యాకరణపరంగా పురుష ఏకవచనం ఉన్నా, భావం చెడు చేసే ఎవరినైనా సాధారణంగా సూచిస్తుంది. ‘ప్రతి వ్యక్తి’ అర్థవ్యాప్తిని నిలుపుతుంది; ‘తన’ తెలుగు వాక్యంలో ఏకవచన సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- issue: వెలుగు సంబంధంలో ἐλεγχθῇ యొక్క భావం
  choice: బయటపడకూడదని
  alternative: ఖండించబడకూడదని / దోషిగా నిరూపించబడకూడదని
  rationale: ఈ సందర్భంలో వెలుగు పనులను బహిర్గతం చేసే చిత్రణ ప్రధానంగా ఉంది. అయితే క్రియలో నైతిక ఖండన లేదా దోషనిరూపణ భావం ఉండగలదనే ఉద్రిక్తతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘వెలుగు’ అనే యోహాను రూపకం మరియు వాక్యంలోని నైతిక తీవ్రత యథాతథంగా నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
