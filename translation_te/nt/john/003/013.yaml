    issue: Gender-specific wording for οὐδείς
    rationale: The main text uses 'ఎవడూ,' which is masculine in ordinary Telugu, whereas the Greek οὐδείς is inclusive ('no one'). Replace it with 'ఎవరూ' to retain the unrestricted scope naturally.
  - severity: low
    issue: Footnote anchors are placed after the title rather than beside the words they explain
    rationale: Footnote a concerns 'descended from heaven' and footnote b concerns 'Son of Man.' Moving each marker to its respective phrase makes the anchoring clear without affecting meaning.
