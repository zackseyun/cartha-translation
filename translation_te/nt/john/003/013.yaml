id: JHN.3.13
reference: John 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: te
  text: పరలోకంలోకి ఎక్కినవారు ఎవరూ లేరు; పరలోకం నుండి దిగివచ్చినవాడు[a]—మనుష్యకుమారుడు[b] మాత్రమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోకం నుండి కిందికి వచ్చినవాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘మనుష్యకుమారుడు’ అనేది యేసు తనను తాను సూచించుకోవడానికి ప్రత్యేకంగా ఉపయోగించిన బిరుదు; ఇది దానియేలు 7:13–14ను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: ఎవడూ లేడు
  rationale: సార్వత్రిక నిరాకరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; లింగపరంగా పరిధిని సంకుచితం చేయాలనే ఉద్దేశం లేదు.
- source_word: ἀναβέβηκεν
  choice: ఎక్కినవాడు
  rationale: గ్రీకు పరిపూర్ణకాల క్రియ సూచించే పూర్తయిన చర్యను తెలుగు సందర్భంలో సహజంగా తెలియజేస్తూ, దిగివచ్చినవాడు అనే వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: εἰς τὸν οὐρανὸν
  choice: పరలోకంలోకి
  rationale: εἰς సూచించే లోపలికి దిశను స్పష్టంగా నిలుపుతుంది.
- source_word: εἰ μὴ
  choice: మాత్రమే
  rationale: ముందున్న నిరాకరణకు ఏకైక మినహాయింపును సహజమైన తెలుగు నిర్మాణంలో తెలియజేస్తుంది.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: పరలోకం నుండి దిగివచ్చినవాడు
  rationale: నామవాచకంగా పనిచేసే కృదంత పదబంధాన్ని నిలుపుతూ, ἀναβέβηκενతో ఉన్న ఎక్కడం–దిగడం వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: సువార్తల్లో యేసు తన గురించి ఉపయోగించే స్థిరమైన బిరుదును, దానియేలు 7తో ఉన్న అంతర్‌పాఠ్య ప్రతిధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: ‘మనుష్య కుమారుడు’ అనే పదబంధపు క్రీస్తుసంబంధ భావం
  choice: గుర్తింపబడిన బిరుదుగా ‘మనుష్య కుమారుడు’ అని అనువదించడం
  alternative: ‘మానవుడు’ లేదా ‘మానవ కుమారుడు’ అని భావానువాదం చేయడం
  rationale: పదబంధంలోని సాధారణ మానవ సూచనకూ అపోకలిప్టిక్ బిరుదుకూ మధ్య ఉన్న ఉద్వేగాన్ని పరిష్కరించకుండా, యోహాను సందర్భాన్నీ దానియేలు 7 ప్రతిధ్వనినీ నిలుపుతుంది.
- issue: ఎక్కడం–దిగడం భాషలోని కాల మరియు క్రియారూప భావం
  choice: ‘ఎక్కినవాడు’ మరియు ‘దిగివచ్చినవాడు’ అని సూటిగా ఉంచడం
  alternative: పరలోక మూలం లేదా ప్రత్యేక అధికారాన్ని వివరణాత్మకంగా విస్తరించడం
  rationale: గ్రీకు వాక్యం చేసే బలమైన వాదనను నిలుపుతూ, దాని పరిధికి మించిన సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘పరలోకం’ అనే పదాన్ని ascent/descent వ్యత్యాసంలో స్థిరంగా వాడాం; ‘అంటే’ ద్వారా చివరి appositional titleను సహజంగా అనుసంధానించాం. SBLGNT ప్రధాన పాఠంలో లేని ‘పరలోకంలో ఉన్న’ అనే దీర్ఘ పాఠభేదాన్ని ప్రధాన వచనంలో చేర్చలేదు.
