  verdict: revise
  source_fidelity: The draft correctly preserves the exclusion ('except'), the ascent/descent contrast, and the appositional identification of the descending one as the Son of Man. The SBLGNT text does not contain the later longer reading 'who is in heaven,' and it is rightly absent. However, 'ఎవడూ' is grammatically masculine and can unnecessarily narrow οὐδείς ('no one'); an inclusive form is preferable.
  naturalness: The sentence is generally clear and appropriately dignified, but 'ఎవరూ లేరు' is more natural modern standard Telugu than 'ఎవడూ లేడు.' Using an em dash for the appositional title also reflects the Greek apposition without making 'అంటే' sound explanatory.
  terminology: '''పరలోకం'' is a suitable consistent rendering of οὐρανός in this context. ''మనుష్యకుమారుడు'' preserves the established Gospel title and its Danielic resonance. The alternate in footnote a is acceptable, though ''దిగివచ్చినవాడు'' is the more formally parallel main-text choice.'
  issues:
