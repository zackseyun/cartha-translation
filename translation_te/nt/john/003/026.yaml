id: JHN.3.26
reference: John 3:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: te
  text: వారు యోహాను దగ్గరకు వచ్చి అతనితో, “రబ్బీ, యొర్దాను అవతల నీతో ఉన్నవాడు, ఎవరి గురించి నీవు సాక్ష్యమిచ్చావో[a]—ఇదిగో, ఇతడు బాప్తిస్మం ఇస్తున్నాడు[b]; అందరూ అతని దగ్గరకు వెళ్తున్నారు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరికి నీవు సాక్ష్యమిచ్చావో.” గ్రీకులోని దత్తివిభక్తి నిర్మాణం ఈ రెండు భావాలకు అవకాశం ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో οὗτος మరింత స్పష్టంగా “ఈయనే” లేదా “ఇతడే” అని ఉంది; మాట్లాడుతున్నవారి నొక్కును లేదా అసంతృప్తిని ఇది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: యోహాను దగ్గరకు వచ్చి
  rationale: ἔρχομαι సందర్భానుసారం ‘రావడం/వెళ్లడం’ అని అర్థమవుతుంది; యోహానును సమీపించడాన్ని సహజమైన తెలుగు కథన శైలిలో ‘దగ్గరకు వచ్చి’ అని ఇచ్చాం.
- source_word: Ῥαββί
  choice: రబ్బీ
  rationale: యూదుల నేపథ్యాన్ని, యోహాను సువార్తలోని సంబోధనను నిలుపుతూ బిరుదును లిప్యంతరీకరించాం; ‘బోధకుడా’ అనేది సాధ్యమైన అర్థవివరణ.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: యొర్దాను అవతల
  rationale: భౌగోళిక వ్యక్తీకరణను ఆధునిక తెలుగులో సహజంగా, మూలానికి దగ్గరగా అందిస్తుంది.
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: ఎవరి గురించి నీవు సాక్ష్యమిచ్చావో
  rationale: μαρτυρέω యొక్క యోహానీయ ‘సాక్ష్యం’ పదబంధాన్ని నిలిపి, తెలుగులో సహజంగా విషయార్థకంగా అనువదించాం; గ్రీకు దత్తివిభక్తి వల్ల ‘ఎవరికి నీవు సాక్ష్యమిచ్చావో’ అనే రూపమూ సాధ్యమే.
- source_word: ἴδε
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని ఆకర్షించే ἴδε యొక్క బలాన్ని, గంభీరమైనప్పటికీ ప్రస్తుత వాడుకలో ఉన్న తెలుగు పదంతో తెలిపాం.
- source_word: οὗτος βαπτίζει
  choice: అతడు బాప్తిస్మమిస్తున్నాడు
  rationale: కొనసాగుతున్న కార్యాన్ని ప్రగతిశీల క్రియారూపంతో తెలిపాం. ప్రధాన వాక్యంలో సహజమైన ‘అతడు’ వాడి, οὗτος లోని సూచనాత్మక నొక్కును పాదసూచికలో వెల్లడించాం.
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: అందరూ అతని దగ్గరకు వెళ్తున్నారు
  rationale: πάντες ఇక్కడ ఫిర్యాదులోని అలంకారాత్మక సాధారణీకరణ; ‘అందరూ’ దాని బలాన్ని సహజంగా ఇస్తుంది. మాట్లాడువారి దృష్టికోణానికి ‘వెళ్తున్నారు’ సరిపోతుంది.
theological_decisions:
- issue: యోహాను సువార్తలోని μαρτυρέω సాక్ష్య భాష
  choice: సాక్ష్యమిచ్చావో
  alternative: తెలియజేశావో / వాంగ్మూలమిచ్చావో
  rationale: ‘సాక్ష్యం’ అనే పదం యోహాను సువార్తలో పునరావృతమయ్యే న్యాయస్థానసదృశమైన, ధార్మిక ప్రాముఖ్యతగల భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాలు ఆ అనుసంధానాన్ని బలహీనపరుస్తాయి.
- issue: ᾧ అనే దత్తివిభక్తి సంబంధ సర్వనామం యొక్క సంబంధం
  choice: ఎవరి గురించి నీవు సాక్ష్యమిచ్చావో
  alternative: ఎవరికి నీవు సాక్ష్యమిచ్చావో
  rationale: తెలుగులో ‘ఎవరి గురించి’ సందర్భార్థాన్ని స్పష్టంగా, సహజంగా ఇస్తుంది. అయితే మూలంలోని దత్తివిభక్తి వ్యాకరణపరంగా స్వీకర్తను సూచించే పఠనానికీ అవకాశం ఇస్తుంది; అందువల్ల దాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘రబ్బీ,’ ‘బాప్తిస్మం,’ ‘సాక్ష్యం’ వంటి యోహాను సువార్తకు కీలకమైన పదాలను స్థిరంగా ఉంచాం; మూలంలోని సాధ్యమైన నొక్కు, వ్యాకరణ సందిగ్ధతలను పాదసూచికల్లో సంరక్షించాం.
