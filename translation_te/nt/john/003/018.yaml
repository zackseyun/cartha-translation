id: JHN.3.18
reference: John 3:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: te
  text: ఆయనను విశ్వసించేవాడు దోషిగా తీర్పు పొందడు[a]. అయితే విశ్వసించనివాడు ఇప్పటికే దోషిగా తీర్పు పొందాడు; ఎందుకంటే అతడు దేవుని ఏకైక కుమారుని[b] నామంలో విశ్వాసముంచలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తీర్పు పొందడు’; ఇదే గ్రీకు క్రియ రెండో వాక్యంలోనూ ఉంది. సందర్భానుసారం దీనికి ‘తీర్పు చేయడం’ లేదా ‘దోషిగా తీర్పు ఇవ్వడం’ అనే భావాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా ‘అద్వితీయ కుమారుడు’; సంప్రదాయ అనువాదం: ‘ఏకైక జనిత కుమారుడు.’'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: ఆయనను విశ్వసించేవాడు
  rationale: వర్తమానకాల కృదంతంతో కూడిన ఈ సాధారణ వ్యక్తి సూచనను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; εἰς తో ఉన్న విశ్వాసం వ్యక్తివైపు మళ్లిన నమ్మకాన్ని సూచిస్తుంది.
- source_word: οὐ κρίνεται
  choice: తీర్పుకు గురికాడు
  rationale: κρίνω యొక్క న్యాయనిర్ణయ భావాన్ని నిలుపుతూ, సందర్భంలో ఉన్న దోషనిర్ణయ ఛాయను పూర్తిగా ప్రధాన పాఠంలోనే ఖరారు చేయకుండా ఉంచుతుంది.
- source_word: ὁ δὲ μὴ πιστεύων
  choice: అయితే విశ్వసించనివాడు
  rationale: δέ సూచించే వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది; కృదంత రూపాన్ని సహజమైన వ్యక్తి సూచనగా అనువదించింది.
- source_word: ἤδη κέκριται
  choice: ఇప్పటికే తీర్పుకు గురయ్యాడు
  rationale: పరిపూర్ణ కాలం సూచించే—గతంలో ఏర్పడి ఇప్పుడు కొనసాగుతున్న—స్థితిని ‘ఇప్పటికే ... గురయ్యాడు’ వ్యక్తపరుస్తుంది.
- source_word: ὅτι μὴ πεπίστευκεν
  choice: ఎందుకంటే అతడు ... విశ్వాసముంచలేదు
  rationale: ὅτι కారణాన్ని పరిచయం చేస్తుంది; పరిపూర్ణ కాలంలోని కొనసాగుతున్న అవిశ్వాస స్థితిని తెలుగు సహజ ప్రయోగంలో తెలియజేస్తుంది.
- source_word: εἰς τὸ ὄνομα
  choice: నామంలో
  rationale: యోహాను రచనల్లోని స్థిరమైన ప్రయోగాన్ని అలాగే ఉంచి, పేరు సూచించే వ్యక్తిత్వం మరియు అధికారాన్ని వివరణతో ప్రధాన పాఠంలో విస్తరించలేదు.
- source_word: τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ
  choice: దేవుని ఏకైక కుమారుని
  rationale: μονογενής ఇక్కడ కుమారుని అసమానమైన, ఏకైక స్థానాన్ని సూచిస్తుంది; జీవశాస్త్రీయ జనన భావాన్ని అనవసరంగా రుద్దదు.
theological_decisions:
- issue: κρίνω పదాన్ని తీర్పు లేదా దోషనిర్ణయం అనే భావాల్లో అనువదించడం
  choice: రెండు చోట్లా ‘తీర్పుకు గురికాడు/గురయ్యాడు’
  alternative: ‘దోషిగా తీర్పు పొందడు/పొందాడు’
  rationale: యోహాను 3:17–19 సందర్భంలో ప్రతికూల తీర్పు భావం ఉన్నప్పటికీ, గ్రీకు క్రియలోని విస్తృత ‘తీర్పు’ భావాన్ని ప్రధాన పాఠం నిలుపుతుంది; దోషనిర్ణయ భావాన్ని పాదసూచిక తెలియజేస్తుంది.
- issue: μονογενής పదం యొక్క భావం
  choice: ఏకైక
  alternative: అద్వితీయ; సంప్రదాయంగా ‘ఏకైక జనితుడు’
  rationale: మూలపదం ప్రధానంగా కుమారుని ప్రత్యేకమైన, సాటిలేని సంబంధాన్ని సూచిస్తుంది. తరువాతి సిద్ధాంతపరమైన పదప్రయోగాన్ని ప్రధాన పాఠంలోకి రుద్దకుండా, సంప్రదాయ రూపాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే గౌరవప్రదంగా ఉంది. ‘నామంలో’ అనే బైబిలు సంబంధిత పదబంధాన్ని మూలంలోని భావసాంద్రత కోసం నిలిపింది. ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ప్రధాన పాఠంలో ఉంచబడింది.
