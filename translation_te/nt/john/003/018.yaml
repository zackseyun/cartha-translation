- from: ఆయనను విశ్వసించేవాడు తీర్పుకు గురికాడు[a]. అయితే విశ్వసించనివాడు ఇప్పటికే తీర్పుకు గురయ్యాడు; ఎందుకంటే అతడు దేవుని ఏకైక కుమారుని[b] నామంలో విశ్వాసముంచలేదు.
  to: ఆయనను విశ్వసించేవాడు దోషిగా తీర్పు పొందడు[a]. అయితే విశ్వసించనివాడు ఇప్పటికే దోషిగా తీర్పు పొందాడు; ఎందుకంటే అతడు దేవుని ఏకైక కుమారుని[b] నామంలో విశ్వాసముంచలేదు.
  rationale: The revision makes the adverse judicial force of κρίνεται/κέκριται explicit in both clauses, as required by the immediate Greek context, while the footnote preserves the lexically broader rendering ‘తీర్పు పొందడు.’ The perfect κέκριται remains represented by ‘ఇప్పటికే ... పొందాడు,’ indicating a verdict already rendered. No doctrinal conclusion beyond the verse’s own judicial language is introduced.
