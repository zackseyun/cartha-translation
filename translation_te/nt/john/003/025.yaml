source:
  edition: SBLGNT
  text: Ἐγένετο οὖν ζήτησις ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου περὶ καθαρισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: te
  text: అప్పుడు యోహాను శిష్యులకు ఒక యూదునితో శుద్ధీకరణ[a] గురించి వివాదం తలెత్తింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శుద్ధి గురించి,” లేదా “ఆచారపరమైన శుద్ధీకరణ గురించి.” గ్రీకు పదం సాధారణంగా శుభ్రపరచడం లేదా శుద్ధి చేయడాన్ని సూచించవచ్చు; ఈ సందర్భంలో దానికి ఆచారపరమైన భావఛాయ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: తలెత్తింది
  rationale: ఒక సంఘటన, ముఖ్యంగా వివాదం, ఉద్భవించిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὖν
  choice: అప్పుడు
  rationale: ఇక్కడ బలమైన తార్కిక నిర్ధారణకన్నా కథన పురోగతిని సూచించే సంధాన పదంగా తీసుకున్నాం.
- source_word: ζήτησις
  choice: వివాదం
  rationale: ఈ పదానికి చర్చ లేదా వాదన అనే పరిధి ఉన్నా, సందర్భంలోని భేదాభిప్రాయాన్ని ‘వివాదం’ స్పష్టంగా, అతిశయోక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου
  choice: యోహాను శిష్యులకూ ఒక యూదునికీ
  rationale: గ్రీకు నిర్మాణంలో యోహాను శిష్యులు ఒక పక్షంగా, ఏకవచనంలోని ఒక యూదుడు మరొక పక్షంగా ఉన్నారు; తెలుగు పరస్పర సంబంధ నిర్మాణం దీనిని సహజంగా అందిస్తుంది.
- source_word: περὶ καθαρισμοῦ
  choice: శుద్ధీకరణ గురించి
  rationale: καθαρισμόςలోని సాధారణ శుభ్రపరచడం మరియు ఆచారపరమైన శుద్ధి అనే భావపరిధిని ‘శుద్ధీకరణ’ నిలుపుతుంది; ప్రధాన పాఠంలో ‘ఆచారపరమైన’ అని అదనంగా నిర్దిష్టం చేయలేదు.
theological_decisions:
- issue: καθαρισμόςను స్పష్టంగా ఆచారపరమైన పదంగా అనువదించాలా
  choice: శుద్ధీకరణ
  alternative: శుద్ధి; ఆచారపరమైన శుద్ధీకరణ
  rationale: యోహాను సువార్త సందర్భం ఆచారపరమైన శుద్ధిని సూచించే అవకాశమున్నా, ఈ వాక్యం వివాదపు ఖచ్చిత పరిధిని నిర్వచించదు. అందువల్ల ప్రధాన పాఠం విస్తృత భావాన్ని నిలుపుతుంది; ఆచారపరమైన ఛాయను పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ఏకవచనంలోని Ἰουδαίουను ‘ఒక యూదుడు’గా నిలిపి, వివాదపు విషయాన్ని అవసరానికి మించి నిర్దిష్టం చేయలేదు.
