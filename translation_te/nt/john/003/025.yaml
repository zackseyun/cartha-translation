    issue: The construction 'యోహాను శిష్యులకూ ఒక యూదునికీ ... వివాదం తలెత్తింది' weakly marks the relationship between the two parties.
    rationale: ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου presents John's disciples and one Jew as interlocutors in the dispute. Telugu 'శిష్యులకు ... యూదునితో' naturally and unambiguously conveys that relationship.
  revised_text: అప్పుడు యోహాను శిష్యులకు ఒక యూదునితో శుద్ధీకరణ[a] గురించి వివాదం తలెత్తింది.
