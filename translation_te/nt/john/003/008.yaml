  source_fidelity: The draft accurately distinguishes πνεῦμα as ‘గాలి’ in the image and ‘ఆత్మ’ in the application, retains the volitional ‘where it wishes,’ the audible φωνή, the unknown origin and destination, and the universal force of πᾶς ὁ γεγεννημένος. ‘ఆత్మ మూలంగా’ is understandable but less idiomatic than a direct source expression. The comparative οὕτως ἐστίν is best expressed as applying to each person’s case rather than simply saying they ‘are likewise.’
