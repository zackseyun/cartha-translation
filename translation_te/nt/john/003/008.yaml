id: JHN.3.8
reference: John 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: te
  text: గాలి[a] తనకు ఇష్టమైన చోట వీస్తుంది. దాని శబ్దం[b] నీకు వినిపిస్తుంది; అయితే అది ఎక్కడి నుండి వస్తుందో, ఎక్కడికి వెళ్తుందో నీకు తెలియదు. ఆత్మ నుండి జన్మించిన ప్రతి ఒక్కరి విషయంలోనూ అలాగే ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదమైన πνεῦμαకు ‘గాలి’ లేదా ‘ఆత్మ’ అనే రెండు అర్థాలు ఉండవచ్చు. ఈ వచనంలోని రెండు భాగాల్లోనూ యేసు అదే పదాన్ని ఉపయోగించి పదప్రయోగం చేశారు; తెలుగులో దాన్ని పూర్తిగా ఒకే పదంతో చూపడం సాధ్యం కాదు.
    reason: lexical_alternative
  - marker: b
    text: ‘శబ్దం’కు బదులుగా ‘స్వరం’ అని కూడా అనువదించవచ్చు. గ్రీకు పదానికి ఈ రెండు అర్థాలు ఉండవచ్చు; ఇక్కడ అది గాలి వల్ల వినిపించేదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (మొదటి ప్రయోగం)
  choice: గాలి
  rationale: πνεῖ (‘వీస్తుంది’) అనే క్రియతోను, దాని శబ్దం వినబడటంతోను కలిసి ఉన్నందున ఇక్కడ వాతావరణ సంబంధమైన ‘గాలి’ భావం ప్రధానంగా ఉంది. చివరి πνεῦμα వద్ద ‘ఆత్మ’ అనే అర్థంతో ఏర్పడే పదప్రయోగాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: ὅπου θέλει
  choice: తనకు ఇష్టమైన చోట
  rationale: θέλει లోని సంకల్ప భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, గాలిని వ్యక్తీకరించిన గ్రీకు వాక్యబలాన్ని నిలుపుతుంది.
- source_word: πνεῖ
  choice: వీస్తుంది
  rationale: మొదటి πνεῦμα ను ‘గాలి’గా గ్రహించినప్పుడు ఇది సహజమైన తెలుగు క్రియ.
- source_word: φωνήν
  choice: శబ్దం
  rationale: φωνή కి ‘స్వరం’ లేదా ‘శబ్దం’ అనే భావాలు ఉండవచ్చు; ఇక్కడ గాలి వినిపించే ప్రభావాన్ని సూచిస్తున్నందున ‘శబ్దం’ సహజం.
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: అది ఎక్కడి నుండి వస్తుందో, ఎక్కడికి వెళ్తుందో నీకు తెలియదు
  rationale: πόθεν/ποῦ అనే జతను, ἔρχεται/ὑπάγει అనే కదలికలను స్పష్టంగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: οὕτως ἐστὶν
  choice: అలాగే ఉంటారు
  rationale: ముందున్న గాలి దృష్టాంతాన్ని ఆత్మ మూలంగా జన్మించినవారికి అన్వయించే పోలికను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: πᾶς ὁ γεγεννημένος
  choice: జన్మించిన ప్రతి ఒక్కరూ
  rationale: సార్వత్రికమైన వ్యక్తివాచక భావాన్ని లింగపరంగా పరిమితం చేయకుండా తెలియజేస్తుంది; పరిపూర్ణ కృదంతం సూచించే జననం వల్ల ఏర్పడిన ప్రస్తుత స్థితిని సందర్భం మోస్తుంది.
- source_word: ἐκ τοῦ πνεύματος (చివరి ప్రయోగం)
  choice: ఆత్మ మూలంగా
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవాన్ని స్పష్టంగా తెలియజేస్తుంది; యోహాను 3లోని నూతన జన్మ సందర్భంలో πνεῦμα దేవుని ఆత్మను సూచిస్తుంది.
theological_decisions:
- issue: ఒకే వచనంలో πνεῦμα పదానికి ఉన్న ద్వంద్వార్థం
  choice: మొదటి ప్రయోగాన్ని ‘గాలి’గా, చివరి ప్రయోగాన్ని ‘ఆత్మ’గా అనువదించడం
  alternative: రెండింటినీ ‘ఆత్మ’గా లేదా రెండింటినీ ‘గాలి’గా అనువదించడం; లేక మొదటిదాన్ని ‘ఆత్మ’గా ఉంచి ‘లేదా గాలి’ అని పాదసూచిక ఇవ్వడం
  rationale: గ్రీకులో πνεῦμα అనే ఒకే పదం ‘గాలి/ఆత్మ’ అనే అర్థవిస్తృతితో ఉద్దేశపూర్వక పదప్రయోగాన్ని సృష్టిస్తుంది. మొదటి భాగంలో ‘వీస్తుంది,’ వినిపించే శబ్దం అనే సూచనలు ‘గాలి’ని బలపరుస్తాయి; చివరి భాగం ఆత్మ మూలంగా కలిగే జన్మను సూచిస్తుంది. తెలుగులో ఒకే పదంతో రెండు అర్థాలనూ సహజంగా నిలపలేము కాబట్టి ప్రధాన పాఠంలో భేదం చేసి, పాదసూచికలో పదప్రయోగాన్ని భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘ఆత్మ నుండి’ కంటే మూలం/ఉద్భవాన్ని సహజంగా తెలిపే ‘ఆత్మ మూలంగా’ ఎంచుకున్నాం. ఏకవచన గ్రీకు సాధారణీకరణను తెలుగులో సహజమైన ‘ప్రతి ఒక్కరూ ... ఉంటారు’ రూపంలో ఇచ్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
