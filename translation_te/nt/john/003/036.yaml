revisions:
- from: కుమారునిపై విశ్వాసముంచేవాడు నిత్యజీవం కలిగివున్నాడు. అయితే కుమారునికి అవిధేయుడయ్యేవాడు[a] జీవాన్ని చూడడు; దేవుని ఉగ్రత అతనిమీద నిలిచివుంటుంది.
  to: కుమారునిపై విశ్వాసముంచేవాడు నిత్యజీవం కలిగివున్నాడు. అయితే కుమారునికి అవిధేయుడైనవాడు[a] జీవాన్ని చూడడు; దేవుని కోపం అతనిమీద నిలిచి ఉంటుంది.
