id: JHN.3.36
reference: John 3:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: te
  text: కుమారునిపై విశ్వాసముంచేవాడు నిత్యజీవం కలిగివున్నాడు. అయితే కుమారునికి అవిధేయుడైనవాడు[a] జీవాన్ని చూడడు; దేవుని కోపం అతనిమీద నిలిచి ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుమారుణ్ణి విశ్వసించడానికి నిరాకరించేవాడు.” గ్రీకు క్రియకు అవిధేయత చూపడం అనే భావంతో పాటు విశ్వసించడానికి నిరాకరించడం అనే భావం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱὸν
  choice: కుమారునిపై విశ్వాసముంచేవాడు
  rationale: వర్తమాన కృదంతం సాధారణ వ్యక్తిని సూచిస్తుంది; εἰς కుమారుని వైపు మళ్లిన వ్యక్తిగత నమ్మకాన్ని తెలియజేస్తుంది. ‘విశ్వాసముంచు’ ఆధునిక తెలుగు బైబిలు శైలిలో సహజంగా ఉండి సంబంధాత్మక భావాన్ని కాపాడుతుంది.
- source_word: τὸν υἱόν / τῷ υἱῷ
  choice: కుమారుడు / కుమారునికి
  rationale: మూలంలో స్పష్టమైన స్వామ్యపదం లేకుండా క్రీస్తు సంబంధమైన బిరుదు మాత్రమే ఉంది; అందువల్ల ‘దేవుని కుమారుడు’ అని పదాలు చేర్చలేదు.
- source_word: ἔχει
  choice: కలిగివున్నాడు
  rationale: వర్తమాన సూచక క్రియ నిత్యజీవం ఇప్పుడు కలిగివున్న స్థితిని సూచిస్తుంది; కేవలం భవిష్యత్తు నిరీక్షణగా మార్చలేదు.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవం
  rationale: యోహాను రచనల సందర్భంలో కాలవ్యాప్తితో పాటు రాబోయే యుగానికి సంబంధించిన జీవగుణాన్ని తెలిపే స్థిరమైన, సహజమైన తెలుగు పదబంధం.
- source_word: ὁ δὲ ἀπειθῶν
  choice: అయితే ... అవిధేయుడయ్యేవాడు
  rationale: ἀπειθέω అవిధేయతతో పాటు నమ్మడానికి నిరాకరించే భావాన్నీ కలిగి ఉంటుంది. ప్రధాన పాఠంలో విస్తృతమైన ‘అవిధేయుడు’ భావాన్ని ఉంచి, విశ్వసించకపోవడం అనే ప్రత్యామ్నాయ సూక్ష్మార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: οὐκ ὄψεται ζωήν
  choice: జీవాన్ని చూడడు
  rationale: గ్రీకు రూపక వ్యక్తీకరణను నిలుపుతూ భవిష్యత్ భావాన్ని తెలుగులో సహజంగా తెలిపింది; దానిని ‘జీవం కలిగివుండడు’గా సమతలీకరించలేదు.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: దేవుని ఉగ్రత
  rationale: దైవిక తీర్పును తెలిపే ὀργή యొక్క బలాన్ని మృదువుపరచకుండా, ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన పదాన్ని ఎంచుకున్నాం.
- source_word: μένει ἐπ’ αὐτόν
  choice: అతనిమీద నిలిచివుంటుంది
  rationale: μένει తెలిపే కొనసాగుతున్న వర్తమాన స్థితిని ‘నిలిచివుంటుంది’ కాపాడుతుంది; ἐπί యొక్క ‘మీద’ భావమూ నిలిచింది. పుంలింగ ఏకవచనం ఇక్కడ సాధారణ వ్యక్తిని సూచిస్తుంది.
theological_decisions:
- issue: πιστεύωνకు వ్యతిరేకంగా ἀπειθῶν యొక్క భావం
  choice: ప్రధాన పాఠంలో ‘అవిధేయుడయ్యేవాడు’; పాదటిప్పణిలో ‘విశ్వసించడానికి నిరాకరించేవాడు’
  alternative: ‘విశ్వసించనివాడు’
  rationale: సందర్భం విశ్వాసం–అవిశ్వాసం మధ్య వ్యత్యాసాన్ని సూచించినా, ἀπειθέωలోని అవిధేయత భావాన్ని కేవలం మానసిక అవిశ్వాసంగా కుదించకూడదు. పాదటిప్పణి రెండవ సాధ్యార్థాన్ని కాపాడుతుంది.
- issue: నిత్యజీవం మరియు దేవుని ఉగ్రత యొక్క కాలబలం
  choice: నిత్యజీవం ప్రస్తుతం కలిగివుండడం, దేవుని ఉగ్రత ప్రస్తుతం కొనసాగడం రెండింటినీ నిలిపాం
  alternative: రెండింటినీ కేవలం భవిష్యత్ స్థితులుగా అనువదించడం
  rationale: ἔχει మరియు μένει రెండూ వర్తమాన సూచక రూపాలు; అదే సమయంలో οὐκ ὄψεται భవిష్యత్తును సూచిస్తుంది. ఈ వర్తమాన–భవిష్యత్ ఉద్వేగాన్ని సమన్వయం పేరుతో తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలిని వాడాం. మూలంలోని సాధారణ ఏకవచన వ్యక్తీకరణను ‘వాడు/అతని’ రూపాల్లో నిలిపాం; ఇది పురుషులకు మాత్రమే పరిమితం కాదు. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిగ్గా జతచేయబడింది.
