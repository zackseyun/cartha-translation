id: JHN.3.19
reference: John 3:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: te
  text: 'తీర్పు ఇదే: వెలుగు లోకంలోకి వచ్చింది; మనుష్యులు వెలుగుకంటే చీకటినే ఎక్కువగా ప్రేమించారు, ఎందుకంటే వారి క్రియలు దుష్టమైనవి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: తీర్పు
  rationale: ఇక్కడ తీర్పు అనే విస్తృత భావాన్ని నిలుపుతుంది; దానిని ముందుగానే ‘శిక్షావిధి’గా కుదించదు.
- source_word: τὸ φῶς
  choice: వెలుగు
  rationale: యోహాను రచనలోని స్థిరమైన రూపకాన్ని వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: ἐλήλυθεν
  choice: వచ్చింది
  rationale: గ్రీకు పరిపూర్ణ కాలం సూచించే, వచ్చి ఇప్పుడు ఉనికిలో ఉన్న ఫలితాన్ని తెలుగు సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: κόσμον
  choice: లోకం
  rationale: యోహాను వాడుకలో సృష్టి మరియు మానవ లోకం రెండింటినీ సూచించగల భావవిస్తృతిని కాపాడుతుంది.
- source_word: ἠγάπησαν
  choice: ప్రేమించారు
  rationale: మానవులు చీకటిపట్ల చూపిన నైతిక అనురక్తిని బలంగా నిలుపుతుంది; కేవలం ‘ఎంచుకున్నారు’ అని బలహీనపరచదు.
- source_word: οἱ ἄνθρωποι
  choice: మనుష్యులు
  rationale: ఇక్కడ పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచించే గ్రీకు పదానికి సహజమైన, సమగ్ర తెలుగు రూపం.
- source_word: μᾶλλον ... ἢ
  choice: కంటే ... ఎక్కువగా
  rationale: తులనాత్మక ప్రాధాన్యాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ σκότος
  choice: చీకటి
  rationale: వెలుగుకు వ్యతిరేకమైన యోహానీయ రూపకాన్ని నిలుపుతుంది.
- source_word: πονηρὰ
  choice: చెడ్డవి
  rationale: క్రియల నైతిక దుష్టత్వాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὰ ἔργα
  choice: క్రియలు
  rationale: చేసిన పనులు లేదా కార్యాలు అనే అర్థాన్ని సంక్షిప్తంగా ఇస్తూ, యోహాను రచనలోని పదసంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘వెలుగు’ యొక్క సూచిత వ్యక్తి
  choice: ప్రధాన పాఠ్యంలో ‘వెలుగు’ అనే రూపకాన్నే ఉంచడం
  alternative: ‘యేసు’ లేదా ‘క్రీస్తు’ అని స్పష్టీకరించడం
  rationale: సందర్భం వెలుగును కుమారుని ప్రత్యక్షతతో అనుసంధానించినప్పటికీ, గ్రీకు పాఠ్యం రూపకాన్నే వాడుతుంది; దానిని నిలుపడం యోహాను రచనలోని ఉద్దేశపూర్వక సాంద్రతను కాపాడుతుంది.
- issue: κρίσις యొక్క భావ పరిధి
  choice: ‘తీర్పు’
  alternative: ‘శిక్షావిధి’
  rationale: ఈ వాక్యం తీర్పు యొక్క స్వభావం లేదా ఆధారాన్ని వివరిస్తుంది; ఫలితాన్ని మాత్రమే సూచించే పదంతో భావాన్ని సంకుచితం చేయకూడదు.
- issue: οἱ ἄνθρωποι యొక్క సమగ్ర సూచన
  choice: ‘మనుష్యులు’
  alternative: ‘పురుషులు’
  rationale: ఈ సందర్భంలో పదం మగవారిని మాత్రమే కాక మానవజాతిని సాధారణంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని వెలుగు–చీకటి రూపక విరోధాన్ని, తీర్పు అనే విస్తృత భావాన్ని నిలిపింది.
