id: JHN.3.29
reference: John 3:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: te
  text: వధువును పొందినవాడే వరుడు. అయితే నిలబడి అతనిని వింటున్న వరుని స్నేహితుడు, వరుని స్వరం వల్ల ఎంతో ఆనందిస్తాడు[a]. కాబట్టి నా ఈ ఆనందం సంపూర్ణమైంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సంతోషంతో సంతోషిస్తాడు”; ఈ గ్రీకు ప్రయోగం గొప్ప సంతోషాన్ని బలంగా తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నెరవేరింది”; గ్రీకు పదం సంపూర్ణతకు లేదా నిండుదలకు చేరడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: వధువు ఎవరిదగ్గర ఉంటుందో
  rationale: వధువుతో వరునికి ఉన్న సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, గ్రీకు వర్తమాన కృదంతంలోని సాధారణ ఏకవచన భావాన్ని నిలుపుతుంది.
- source_word: νυμφίος
  choice: వరుడు
  rationale: వివాహ రూపకాన్ని స్పష్టంగా, సహజంగా నిలిపే ప్రామాణిక తెలుగు పదం.
- source_word: φίλος τοῦ νυμφίου
  choice: వరుని స్నేహితుడు
  rationale: గ్రీకు పదబంధాన్ని నేరుగా ప్రతిబింబిస్తుంది; ‘తోడుపెళ్లికొడుకు’ వంటి నిర్దిష్ట సాంస్కృతిక పాత్రను మూలపాఠ్యంలో లేనంతగా చేర్చదు.
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: నిలబడి వరుని మాట వింటున్న
  rationale: ἑστηκὼς సూచించే అక్కడ నిలిచి ఉన్న స్థితిని, ἀκούων αὐτοῦ సూచించే అతని మాట వినడాన్ని సహజమైన తెలుగు వాక్యరచనలో అందిస్తుంది.
- source_word: χαρᾷ χαίρει
  choice: ఎంతో సంతోషిస్తాడు
  rationale: సజాతీయ నామవాచకం-క్రియ కలయికలోని బలమైన ఉద్ఘాటనను కృత్రిమమైన ‘సంతోషంతో సంతోషిస్తాడు’ అన్న రూపం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: వరుని స్వరం విని
  rationale: వరుని స్వరమే సంతోషానికి కారణమని సహజమైన తెలుగులో తెలియజేస్తుంది; διά యొక్క కారణార్థాన్ని నిలుపుతుంది.
- source_word: αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ
  choice: కాబట్టి నాకున్న ఈ సంతోషం
  rationale: οὖν లోని నిర్ధారణ భావాన్నీ, αὕτη మరియు ἡ ἐμὴ లోని సూచనాత్మక వ్యక్తిగత ఉద్ఘాటననూ నిలుపుతుంది.
- source_word: πεπλήρωται
  choice: ఇప్పుడు సంపూర్ణమైంది
  rationale: పరిపూర్ణ కర్మణి రూపంలోని పూర్తై ప్రస్తుతం కొనసాగుతున్న ఫలితస్థితిని సహజంగా వ్యక్తం చేస్తుంది; ‘ఇప్పుడు’ సందర్భంలో చేరిన పరిపూర్ణ స్థితిని తెలుపుతుంది.
theological_decisions:
- issue: వివాహ రూపకం మరియు బాప్తిస్మమిచ్చే యోహాను తనను తాను ఉంచుకున్న స్థానం
  choice: యేసును వరునిగా, యోహానును వరుని స్నేహితునిగా సూచించే రూపకాన్ని మాత్రమే నిలిపి, వధువు ఎవరనే దాన్ని వాక్యంలో వివరించలేదు.
  alternative: వధువును సంఘం లేదా దేవుని ప్రజలు అని అనువాదంలోనే స్పష్టంగా గుర్తించడం; వరుని స్నేహితుణ్ణి నిర్దిష్టంగా ‘తోడుపెళ్లికొడుకు’ అని పిలవడం.
  rationale: ఈ వాక్యం వధువు గుర్తింపును ప్రత్యక్షంగా వివరించదు; కాబట్టి తదనంతర సంఘశాస్త్ర నిర్ధారణలను ప్రధాన పాఠ్యంలో చేర్చకుండా అసలు రూపకంలోని వ్యాఖ్యాన విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వివాహ రూపకాన్ని స్పష్టంగా ఉంచుతూ సాంస్కృతిక లేదా సంఘశాస్త్ర వివరణలను ప్రధాన పాఠ్యంలో చేర్చలేదు.
