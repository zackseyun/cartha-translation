  text: μὴ θαυμάσῃς ὅτι εἶπόν σοι Δεῖ ὑμᾶς γεννηθῆναι ἄνωθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: te
  text: '“నేను నీకు చెప్పిన ఈ మాటకు ఆశ్చర్యపడకు: ‘మీరు పైనుండి పుట్టాలి.’[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మళ్లీ పుట్టాలి,” “కొత్తగా పుట్టాలి.” గ్రీకు పదం ἄνωθενకు “పైనుండి” లేదా “మళ్లీ/కొత్తగా” అనే అర్థాలు ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “నేను నీకు చెప్పిన” అనే చోట “నీకు” ఏకవచనం; “మీరు పుట్టాలి” అనే చోట “మీరు” బహువచనం.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: ఆశ్చర్యపడకు
  rationale: μήతో కూడిన aorist subjunctive నిషేధాన్ని వ్యక్తం చేస్తుంది. ‘ఆశ్చర్యపడకు’ ఆధునిక తెలుగులో సహజంగా ఉండి θαυμάζω భావాన్ని నిలుపుతుంది.
- source_word: ὅτι
  choice: చెప్పినందుకు
  rationale: ఇక్కడ ὅτι యేసు చెప్పిన విషయాన్ని నికొదేము ఆశ్చర్యపడటంతో అనుసంధానిస్తుంది. తెలుగులో ‘చెప్పినందుకు’ అనే నిర్మాణం ‘నేను చెప్పిన ఈ మాటను బట్టి ఆశ్చర్యపడకు’ అనే భావాన్ని సహజంగా అందిస్తుంది; కారణార్థక భావాన్ని అతిగా విస్తరించదు.
- source_word: εἶπόν σοι
  choice: నేను నీతో చెప్పిన
  rationale: σοι ఏకవచనం. ‘నీతో చెప్పిన’ ప్రత్యక్ష సంభాషణను సహజ తెలుగులో తెలియజేస్తూ ఏకవచనాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Δεῖ
  choice: పుట్టాలి
  rationale: δεῖ తెలిపే అవసరతను తెలుగు విధ్యర్థక ప్రత్యయం ‘-ఆలి’ సంక్షిప్తంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: ὑμᾶς
  choice: మీరు
  rationale: ὑμᾶς బహువచనం. ‘మీరు’ గౌరవార్థక ఏకవచనంగానూ వినిపించవచ్చు కాబట్టి, గ్రీకు బహువచన వ్యత్యాసాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
- source_word: γεννηθῆναι
  choice: పుట్టాలి
  rationale: γεννάω యొక్క passive infinitive ఇక్కడ ‘పుట్టడం’ అనే భావాన్ని ఇస్తుంది. ‘జన్మించాలి’ కంటే ‘పుట్టాలి’ సాధారణ పాఠకులకు సహజంగా ఉంది.
- source_word: ἄνωθεν
  choice: పైనుండి
  rationale: ἄνωθεν కు ‘పైనుండి’ లేదా ‘మళ్లీ/కొత్తగా’ అనే అర్థాలు ఉండవచ్చు. యోహాను రచనలో పరలోక మూలాన్ని సూచించే ‘పైనుండి’ ప్రధాన పాఠ్యంలో ఉంచి, నిజమైన ద్వంద్వార్థాన్ని పాదటిప్పణిలో కాపాడాం.
theological_decisions:
- issue: కొత్త పుట్టుక వాక్యంలో ἄνωθεν అర్థం
  choice: పైనుండి
  alternative: మళ్లీ; కొత్తగా
  rationale: యోహాను 3లో ఈ పదానికి ఉద్దేశపూర్వకమైన బహుళార్థం ఉండవచ్చు. యోహాను వాడుకలో దేవుని నుండి లేదా పై లోకం నుండి వచ్చే మూలాన్ని సూచించే భావానికి ప్రాధాన్యం ఉన్నందున ‘పైనుండి’ని ప్రధాన పాఠ్యంలో ఉంచాం; నికొదేము గ్రహించిన ‘మళ్లీ’ అనే భావాన్ని తొలగించకుండా పాదటిప్పణిలో ఇచ్చాం.
- issue: σοι మరియు ὑμᾶς మధ్య వచన వ్యత్యాసం
  choice: ‘నీతో’ ఏకవచనం; ‘మీరు’ బహువచనం
  alternative: రెండింటినీ సందర్భానుసార గౌరవార్థక రూపాలుగా చదవడం
  rationale: యేసు మొదట నికొదేమును ఏకవచనంలో ఉద్దేశించి, తరువాత అవసరతను బహువచన సమూహానికి వర్తింపజేస్తాడు. ఈ వ్యత్యాసాన్ని పాఠ్యంలో సాధ్యమైనంతవరకు, పాదటిప్పణిలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఆశ్చర్యపడకు,’ ‘పుట్టాలి’ వంటి సాధారణ పదాలను వాడి, గ్రీకు ఏకవచన–బహువచన వ్యత్యాసం మరియు ἄνωθεν ద్వంద్వార్థం పాదటిప్పణుల్లో సంరక్షించబడ్డాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
