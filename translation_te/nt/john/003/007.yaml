revisions:
- from: '“నేను నీతో చెప్పినందుకు ఆశ్చర్యపడకు: ‘మీరు పైనుండి పుట్టాలి.’[a][b]”'
  to: '“నేను నీకు చెప్పిన ఈ మాటకు ఆశ్చర్యపడకు: ‘మీరు పైనుండి పుట్టాలి.’[a][b]”'
  rationale: The revision corrects the syntactic force of ὅτι by referring to “this word that I told you” and placing the quoted content in apposition. It also uses “నీకు” to make the singular addressee unambiguous. The plural addressed group and the genuine semantic range of ἄνωθεν remain preserved through the text and footnotes.
