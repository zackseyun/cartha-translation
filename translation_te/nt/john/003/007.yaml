review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the prohibition, the singular σοι / plural ὑμᾶς shift, the necessity expressed by δεῖ, and the ambiguity of ἄνωθεν. However, “చెప్పినందుకు” explicitly makes ὅτι causal (“because I said”), whereas here ὅτι introduces the content of what Jesus said. The revised wording expresses that content without adding a causal relation.
  naturalness: The revision uses natural modern standard Telugu. “నేను నీకు చెప్పిన ఈ మాటకు ఆశ్చర్యపడకు” is clear, preserves direct address, and lets the following quotation specify the content.
  terminology: “పైనుండి పుట్టాలి” appropriately renders the selected primary sense of ἄνωθεν, while the footnote preserves “మళ్లీ/కొత్తగా.” “పుట్టాలి” is idiomatic and adequately conveys the passive infinitive with δεῖ in Telugu.
  issues:
  - severity: medium
    issue: ὅτι is rendered with a causal construction
    rationale: 'The draft’s “నేను నీతో చెప్పినందుకు ఆశ్చర్యపడకు” means “Do not be surprised because I told you.” In the Greek, ὅτι introduces the statement’s content: “Do not be amazed that I told you [that] ….” The translation should avoid presenting the saying itself as the cause.'
  - severity: low
    issue: “నీతో” is less direct than “నీకు” for σοι
    rationale: While “నీతో చెప్పిన” can be understood as “told you,” “నీకు చెప్పిన” is the more direct and unambiguous modern Telugu equivalent for the Greek singular indirect object.
