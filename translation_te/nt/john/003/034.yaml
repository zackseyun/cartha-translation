id: JHN.3.34
reference: John 3:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: te
  text: ఎందుకంటే దేవుడు పంపినవాడు దేవుని మాటలను పలుకుతాడు; ఎందుకంటే దేవుడు ఆత్మను కొలత లేకుండా ఇస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే అతడు ఆత్మను కొలత లేకుండా ఇస్తాడు”; ఇక్కడ “అతడు” దేవుడు పంపినవాడిని సూచించవచ్చు.
    reason: δίδωσιν అనే గ్రీకు క్రియకు కర్త వ్యక్తంగా పేర్కొనబడలేదు. ప్రధాన పాఠ్యంలో సందర్భానుసారం దేవుడిని కర్తగా తీసుకున్నప్పటికీ, పంపబడినవాడిని కర్తగా తీసుకునే ప్రత్యామ్నాయాన్ని నిలుపుతున్నాం.
lexical_decisions:
- source_word: ὃν
  choice: దేవుడు పంపినవాడు
  rationale: సంబంధవాచక సర్వనామంలోని వ్యక్తిని సూచించే భావాన్ని తెలుగులో సహజమైన నామవాచక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ἀπέστειλεν
  choice: పంపిన
  rationale: యోహాను సువార్తలోని పంపడం అనే ప్రధాన పదప్రయోగాన్ని నేరుగా నిలుపుతుంది; భూతకాల క్రియను తెలుగు సంబంధక క్రియారూపంలో సహజంగా అందిస్తుంది.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: దేవుని మాటలు
  rationale: ῥήματα యొక్క బహువచనాన్ని, దేవునికి చెందిన పలుకులు అనే సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: λαλεῖ
  choice: పలుకుతాడు
  rationale: మాట్లాడడం అనే కొనసాగుతున్న క్రియను గౌరవప్రదమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὐ ... ἐκ μέτρου
  choice: కొలతతో ... ఇవ్వడు
  rationale: గ్రీకు వాక్యంలోని నిషేధాన్ని మరియు ‘కొలత ప్రకారం’ అనే రూపకాన్ని సాధ్యమైనంత నేరుగా నిలుపుతుంది; భావం పరిమితంగా ఇవ్వడు అన్నది.
- source_word: δίδωσιν
  choice: ఇవ్వడు
  rationale: వర్తమానకాల సాధారణ ప్రకటనను నేరుగా అందిస్తుంది; οὐ తో కలిసి నిషేధార్థం పొందుతుంది.
- source_word: τὸ πνεῦμα
  choice: ఆత్మను
  rationale: యోహాను సందర్భంలో దేవుని ఆత్మను సూచిస్తుంది. తెలుగులో సందర్భం వల్ల సూచన స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: δίδωσιν (‘ఇస్తాడు’) అనే క్రియకు కర్త ఎవరు?
  choice: 'ప్రధాన పాఠ్యంలో దేవుడే అంతర్భూత కర్తగా స్పష్టం చేయబడింది: ‘దేవుడు ఆత్మను కొలతతో ఇవ్వడు.’'
  alternative: 'దేవుడు పంపినవాడే అంతర్భూత కర్త: ‘అతడు ఆత్మను కొలతతో ఇవ్వడు.’'
  rationale: ముందటి ఉపవాక్యంలో స్పష్టంగా ప్రస్తావించబడిన దేవుడు, అలాగే పంపబడినవాడు దేవుని మాటలు పలకడానికి ఇచ్చే కారణం—ఇవి దేవుడే ఆత్మను ఇచ్చేవాడని సూచిస్తాయి. అయినా గ్రీకులో δίδωσιν కు కర్త వ్యక్తంగా లేదు; కాబట్టి పంపబడినవాడిని కర్తగా తీసుకునే అవకాశాన్ని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కొలతతో ఇవ్వడు’ అనే పదబంధం మూలంలోని రూపకాన్ని నిలుపుతూ ‘పరిమితంగా ఇవ్వడు’ అనే భావాన్ని తెలియజేస్తుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
