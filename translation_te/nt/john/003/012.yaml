revisions:
- from: నేను భూసంబంధమైన విషయాలు మీతో చెప్పినా మీరు నమ్మడం లేదు; అలాంటప్పుడు పరలోకసంబంధమైన విషయాలు మీతో చెబితే ఎలా నమ్ముతారు?
  to: నేను మీకు భూసంబంధమైన విషయాలు చెప్పినప్పుడు కూడా మీరు నమ్మకపోతే, పరలోకసంబంధమైన విషయాలు మీకు చెబితే ఎలా నమ్ముతారు?
  rationale: The revision preserves the aorist reference to Jesus' prior speaking, the present failure to believe, the future-oriented condition «ἐὰν εἴπω», and the future «πιστεύσετε». It retains the deliberately broad earthly/heavenly contrast while making the Greek conditional logic explicit in idiomatic Telugu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:36:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the broad contrast between τὰ ἐπίγεια and τὰ ἐπουράνια and correctly keeps the future rhetorical question. However, «చెప్పినా» is primarily concessive ('although I told'), whereas εἰ introduces the stated conditional premise. Recasting the first clause with «చెప్పినప్పుడు కూడా ... నమ్మకపోతే» more clearly represents the Greek conditional-rhetorical construction without narrowing either category.
  naturalness: The proposed revision is natural modern standard Telugu. It avoids the slightly loose logical connector «అలాంటప్పుడు» and expresses the two linked conditions directly and smoothly.
  terminology: «భూసంబంధమైన విషయాలు» and «పరలోకసంబంధమైన విషయాలు» are appropriate, parallel renderings that retain the source's intentional breadth. No doctrinal interpretation is introduced. Footnotes are not necessary in Telugu because these terms are idiomatic and the translation does not require an explanatory lexical alternative.
  issues:
  - severity: low
    issue: The first conditional clause is rendered concessively.
    rationale: «నేను ... చెప్పినా మీరు నమ్మడం లేదు» naturally means 'Although I told you ..., you do not believe,' while εἰ ... καὶ οὐ πιστεύετε presents the premise as a conditional statement. The meaning is close, but a conditional Telugu construction better reflects the source.
  revised_text: నేను మీకు భూసంబంధమైన విషయాలు చెప్పినప్పుడు కూడా మీరు నమ్మకపోతే, పరలోకసంబంధమైన విషయాలు మీకు చెబితే ఎలా నమ్ముతారు?
  revised_footnotes: []
  revision_rationale: The revision preserves the aorist reference to Jesus' prior speaking, the present failure to believe, the future-oriented condition «ἐὰν εἴπω», and the future «πιστεύσετε». It retains the deliberately broad earthly/heavenly contrast while making the Greek conditional logic explicit in idiomatic Telugu.
