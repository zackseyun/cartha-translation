id: JHN.3.12
reference: John 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: te
  text: నేను మీకు భూసంబంధమైన విషయాలు చెప్పినప్పుడు కూడా మీరు నమ్మకపోతే, పరలోకసంబంధమైన విషయాలు మీకు చెబితే ఎలా నమ్ముతారు?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: భూసంబంధమైన విషయాలు
  rationale: నపుంసక బహువచన విశేషణం నామవాచకంగా వాడబడింది. ఈ ఎంపిక దాని విస్తృత అర్థాన్ని, τὰ ἐπουράνιαతో ఉన్న ప్రత్యక్ష వ్యత్యాసాన్ని కాపాడుతుంది; అది భూమిపై జరిగే విషయాలా లేక భౌమిక ఉపమానాలా అనేది నిర్ణయించదు.
- source_word: εἶπον
  choice: నేను ... చెప్పినా
  rationale: λέγω యొక్క భూతకాల రూపం యేసు ఇంతకుముందు చెప్పిన మాటలను సూచిస్తుంది. గ్రీకులోని షరతును సహజమైన తెలుగు వాక్యనిర్మాణంలో చూపడానికి ‘చెప్పినా’ వాడబడింది.
- source_word: οὐ πιστεύετε
  choice: మీరు నమ్మడం లేదు
  rationale: οὐతో కూడిన వర్తమాన సూచనార్థక రూపం వారి ప్రస్తుత స్పందనను తెలియజేస్తుంది. ‘నమ్మడం లేదు’ తెలుగు వాడుకలో సహజంగా ఉండి, πιστεύω యొక్క ప్రాథమిక భావాన్ని నిలుపుతుంది.
- source_word: πῶς ... πιστεύσετε
  choice: ఎలా నమ్ముతారు?
  rationale: πῶςతో కూడిన భవిష్యత్ రూపంలోని అలంకారప్రశ్నను నేరుగా నిలుపుతుంది; ‘ఎలా నమ్మగలరు?’ అని సామర్థ్య భావాన్ని అదనంగా చేర్చదు.
- source_word: ἐὰν εἴπω
  choice: చెబితే
  rationale: ἐὰνతో కూడిన aorist subjunctive భవిష్యత్ షరతును సూచిస్తుంది. ‘చెబితే’ దానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: τὰ ἐπουράνια
  choice: పరలోకసంబంధమైన విషయాలు
  rationale: నామవాచకంగా పనిచేసే నపుంసక బహువచన విశేషణాన్ని విస్తృతంగానే ఉంచుతూ, భూసంబంధమైన విషయాలతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది; ‘పరలోకంలో ఉన్న విషయాలు’ అనే అర్థం మాత్రమే అని పరిమితం చేయదు.
theological_decisions:
- issue: ‘భూసంబంధమైన విషయాలు,’ ‘పరలోకసంబంధమైన విషయాలు’ మధ్య వ్యత్యాసం
  choice: రెండు వర్గాలను విస్తృత పదాలతో నేరుగా అనువదించడం
  alternative: ‘భూసంబంధమైన విషయాలు’ను భౌమిక ఉపమానాలుగా లేదా భూమిపై జరిగే సత్యాలుగా, ‘పరలోకసంబంధమైన విషయాలు’ను లోతైన దైవిక మర్మాలుగా ప్రత్యేకంగా నిర్వచించడం
  rationale: మూలవాక్యం వెల్లడింపబడే రెండు వర్గాల మధ్య వ్యత్యాసాన్ని చూపుతుంది గాని వాటి పరిధిని ఇక్కడ ఖచ్చితంగా నిర్వచించదు. విస్తృత పదప్రయోగం ఆ ఉద్దేశపూర్వక అనిశ్చితిని, వేదాంతపరమైన ఉద్విగ్నతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అలాంటప్పుడు’ మొదటి షరతు ఆధారంగా వచ్చే అలంకారప్రశ్న యొక్క తార్కిక బలాన్ని సహజంగా వ్యక్తం చేస్తుంది. అర్థాన్ని ఒక నిర్దిష్ట వ్యాఖ్యానానికి పరిమితం చేసే పదాలు నివారించబడ్డాయి.
