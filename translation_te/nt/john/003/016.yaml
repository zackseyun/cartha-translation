id: JHN.3.16
reference: John 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: te
  text: 'ఎందుకంటే దేవుడు లోకాన్ని ఈ విధంగా[a] ప్రేమించాడు: తన ఏకైక కుమారుణ్ణి[b] ఇచ్చాడు, తద్వారా ఆయనను విశ్వసించే ప్రతి ఒక్కరూ నశించకుండా నిత్యజీవం పొందాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సంప్రదాయంగా, “దేవుడు లోకాన్ని ఎంతోగా ప్రేమించాడు.” గ్రీకులో ఈ పదం దేవుని ప్రేమ పరిమాణాన్ని కాక, ఆయన ప్రేమను చూపిన విధానాన్ని నొక్కిచెప్పేదిగా కూడా అర్థమవుతుంది: “దేవుడు లోకాన్ని ఈ విధంగా ప్రేమించాడు.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన అద్వితీయ కుమారుణ్ణి”; సంప్రదాయంగా, “తన ఏకజనిత కుమారుణ్ణి.” గ్రీకు పదం కుమారుని ప్రత్యేకమైన, సాటిలేని సంబంధాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὕτως
  choice: ఈ విధంగా
  rationale: యోహాను వాడుకలో ఇది ప్రధానంగా ప్రేమ పరిమాణాన్ని కాక, దేవుడు ప్రేమను వెల్లడించిన విధానాన్ని సూచిస్తుంది; తరువాతి కుమారుని ఇవ్వడం ఆ విధానాన్ని వివరిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భానికి ఈ వాక్యం ఇచ్చే వివరణాత్మక ఆధారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἠγάπησεν
  choice: ప్రేమించాడు
  rationale: అయోరిస్ట్ క్రియను సరళ భూతకాలంగా అనువదిస్తూ ‘ప్రేమ’ అనే ప్రామాణిక భావాన్ని నిలుపుతుంది.
- source_word: τὸν κόσμον
  choice: లోకాన్ని
  rationale: κόσμος యొక్క విస్తృతమైన యోహానీయ పరిధిని నిలుపుతుంది; దాన్ని కేవలం ‘మానవాళి’గా సంకుచితం చేయదు.
- source_word: ὥστε ... ἔδωκεν
  choice: ఆయన ... ఇచ్చాడు
  rationale: ‘ఈ విధంగా’ అన్న దానికి తరువాతి వాక్యభాగం దేవుని ప్రేమ యొక్క వ్యక్తీకరణను తెలియజేస్తుంది; తెలుగులో ద్విబిందువు దీనిని స్పష్టంగా కలుపుతుంది.
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: తన అద్వితీయ కుమారుణ్ణి
  rationale: μονογενής ఇక్కడ కుమారుని సాటిలేని, ఏకైక సంబంధాన్ని సూచిస్తుంది. ‘అద్వితీయ’ ఆధునిక తెలుగులో ప్రత్యేకతను తెలియజేస్తూ శారీరక జనన భావాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: ἵνα
  choice: '... పొందాలని అలా చేశాడు'
  rationale: గ్రీకు ఉద్దేశ్య/ఫలిత నిర్మాణాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πᾶς ὁ πιστεύων εἰς αὐτὸν
  choice: ఆయనలో విశ్వాసముంచే ప్రతి ఒక్కరూ
  rationale: సార్వత్రికమైన, సాధారణ వర్తమాన భావాన్ని నిలుపుతూ πιστεύω εἰς అనే నిర్మాణాన్ని సహజంగా అందిస్తుంది.
- source_word: μὴ ἀπόληται
  choice: నశించకుండా
  rationale: ἀπόλλυμι యొక్క గంభీరతను నిలుపుతుంది; నాశన విధానాన్ని పాఠ్యంలో అవసరానికి మించి నిర్వచించదు.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: నిత్యజీవం పొందాలని
  rationale: ‘జీవం కలిగి ఉండడం’ అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ αἰώνιος యొక్క సంప్రదాయ, స్పష్టమైన అర్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Οὕτως యొక్క భావం
  choice: ప్రేమించిన విధానం—‘ఈ విధంగా’
  alternative: ప్రేమ పరిమాణం—‘ఎంతోగా’
  rationale: ὥστε తరువాత కుమారుని ఇవ్వడం దేవుని ప్రేమ ఎలా వ్యక్తమైందో వివరిస్తుంది. ప్రత్యామ్నాయ పరిమాణ భావాన్ని పాదసూచికలో నిలుపుతున్నాం.
- issue: μονογενής యొక్క అనువాదం
  choice: అద్వితీయ కుమారుడు
  alternative: ఏకైక కుమారుడు; ఏకజనిత కుమారుడు
  rationale: మూలపదం కుమారుని ప్రత్యేకమైన, సాటిలేని సంబంధాన్ని ప్రధానంగా సూచిస్తుంది. చారిత్రకంగా ప్రాముఖ్యమైన ‘ఏకజనిత’ రూపాన్ని పాదసూచికలో ఇస్తూ, ఏ క్రైస్తవ సంప్రదాయానికీ ప్రత్యేకమైన వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో రుద్దడం లేదు.
- issue: πᾶς ὁ πιστεύων యొక్క పరిధి
  choice: విశ్వాసముంచే ప్రతి ఒక్కరూ
  alternative: విశ్వసించేవారెవరైనా
  rationale: పదబంధంలోని సమగ్ర, సాధారణ ఆహ్వానాన్ని నిలుపుతుంది; ఎన్నిక, ప్రాయశ్చిత్త పరిధి, లేదా మానవ ప్రతిస్పందనపై తరువాతి మతశాస్త్ర వివాదాలను పరిష్కరించదు.
- issue: ἵνα తో ఉద్దేశ్యం/ఫలితం
  choice: నశించకుండా నిత్యజీవం పొందాలని
  alternative: నశించరు, నిత్యజీవం పొందుతారు
  rationale: సంభావనగా బలహీనపరచకుండా, అలాగే నిర్బంధ యాంత్రిక ఫలితంగా మార్చకుండా గ్రీకు సబ్జంక్టివ్ ఉన్న ఉద్దేశ్య నిర్మాణాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘విశ్వాసముంచే’, ‘నిత్యజీవం’, ‘నశించకుండా’ వంటి విస్తృతంగా పరిచయమైన బైబిలు పదజాలాన్ని ఉంచి, వాక్య నిర్మాణాన్ని సహజమైన తెలుగుకు అనుగుణంగా రెండు వాక్యాలుగా తీర్చిదిద్దాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
