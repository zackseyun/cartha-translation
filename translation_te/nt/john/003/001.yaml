  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἦν δὲ ἄνθρωπος ἐκ τῶν Φαρισαίων, Νικόδημος ὄνομα αὐτῷ, ἄρχων τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/001.yaml
  text: There was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
translation:
  language: te
  text: పరిసయ్యులలో నికోదేము అనే ఒక వ్యక్తి ఉండేవాడు; అతడు యూదుల అధికారి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయవారి అధికారి.” గ్రీకు పదం సాధారణంగా యూదులను, కొన్ని సందర్భాల్లో ప్రత్యేకంగా యూదయవారిని లేదా యూద అధికారులను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: ఉండేవాడు
  rationale: ἦν ఉనికిని పరిచయం చేస్తుంది; δέ ఇక్కడ స్వల్ప కథన అనుసంధానకం. తెలుగులో ప్రత్యేకంగా ‘అయితే’ అని చేరిస్తే అవసరానికి మించిన వ్యతిరేక భావం రావచ్చు కాబట్టి, సహజమైన వాక్యప్రవాహంలో దాని అనుసంధాన బలం అంతర్లీనంగా ఉంచబడింది.
- source_word: ἄνθρωπος
  choice: వ్యక్తి ఒకడు
  rationale: ఇది నిర్దిష్టమైన పురుషుణ్ణి సూచిస్తుంది. ‘వ్యక్తి ఒకడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాత వచ్చే పేరుతో అతణ్ణి పరిచయం చేస్తుంది.
- source_word: ἐκ τῶν Φαρισαίων
  choice: పరిసయ్యులలో
  rationale: ἐκ సమూహంలోనివాడనే అనుబంధాన్ని సూచిస్తుంది. ‘పరిసయ్యులలో’ నికోదేము ఆ వర్గానికి చెందినవాడని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: నికోదేము అనే
  rationale: గ్రీకు నామపరిచయ ప్రయోగాన్ని పదేపదే కాకుండా సహజమైన తెలుగు నామపరిచయ రూపంలో అందిస్తుంది.
- source_word: ἄρχων
  choice: అధికారి
  rationale: ἄρχων అధికారస్థానంలో ఉన్న వ్యక్తిని సూచిస్తుంది. ‘అధికారి’ అతని నాయకత్వ లేదా పాలనా హోదాను తెలియజేస్తూ, అతడు ఏ నిర్దిష్ట మండలికి చెందినవాడో వచనంలో లేని వివరాన్ని చేర్చదు.
- source_word: τῶν Ἰουδαίων
  choice: యూదులలో
  rationale: ఈ సందర్భంలో యూద సమాజ నాయకత్వ వర్గంలో అతని అధికారస్థానాన్ని సూచించే సహజమైన తెలుగు రూపం. మూలపదానికి ఉండగల ‘యూదయవారు’ లేదా ‘యూద మతాధికారులు’ అనే మరింత పరిమిత భావాలను పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: యోహాను సువార్తలో Ἰουδαίων పదం యొక్క పరిధి
  choice: యూదులలో ఒక అధికారి
  alternative: యూదయవారిలో ఒక అధికారి; లేదా యూద మతాధికారులలో ఒకడు
  rationale: Ἰουδαῖοι జాతి లేదా మత సమాజాన్ని, ప్రాంతీయంగా యూదయవారిని, కొన్ని సందర్భాల్లో యూద అధికార వర్గాన్ని సూచించగలదు. నికోదేము పరిసయ్యుడిగా మరియు అధికారిగా పరిచయమవుతున్నందున ప్రధాన పాఠ్యంలో విస్తృతమైన ‘యూదులలో’ ఉంచి, మరింత సంకుచితమైన భావాలను పాదసూచికలో తెలియజేయడం మూలంలోని భావపరిధిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మూలంలో లేని నిర్దిష్ట మండలి పేరు లేదా మతపరమైన వివరణను చేర్చలేదు.
