source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰωάννης καὶ εἶπεν· Οὐ δύναται ἄνθρωπος λαμβάνειν ⸂οὐδὲ ἓν⸃ ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: te
  text: 'యోహాను జవాబిచ్చి ఇలా అన్నాడు: “పరలోకం నుండి తనకు ఇవ్వబడితే తప్ప, ఒక మనిషి[a] ఒక్కటి కూడా పొందలేడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘మనిషి’ అనే పదం సాధారణ ప్రతినిధి అర్థంలో ఉంది; ఇది పురుషునికే పరిమితం కాకుండా ‘ఒక వ్యక్తి’ అని కూడా అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: యోహాను జవాబిచ్చి ఇలా అన్నాడు
  rationale: ‘జవాబిచ్చి ... అన్నాడు’ అనే సహజమైన తెలుగు వాక్యనిర్మాణం ద్వారా మూలంలోని ‘జవాబిచ్చాడు మరియు అన్నాడు’ అనే కథన సూత్రాన్ని సంక్షిప్తం చేయకుండా నిలుపుతుంది.
- source_word: Οὐ δύναται
  choice: పొందలేడు
  rationale: తెలుగులో క్రియకు జోడించిన ‘లేడు’ అసమర్థతను సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: ఏ మానవ వ్యక్తికైనా వర్తించే ఏకవచన సాధారణార్థాన్ని నిలుపుతుంది; ఇది కేవలం పురుషునికే పరిమితం కాదు.
- source_word: λαμβάνειν
  choice: పొంద
  rationale: తానే స్వాధీనం చేసుకోవడం కంటే, ఇవ్వబడిన దాన్ని స్వీకరించడం లేదా పొందడం అనే సందర్భార్థానికి సరిపోతుంది.
- source_word: οὐδὲ ἓν
  choice: ఒక్కటి కూడా
  rationale: గ్రీకు పదబంధంలోని బలమైన కనిష్ఠ నిషేధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: తనకు ఇవ్వబడితే తప్ప
  rationale: మినహాయింపు షరతును, ఇవ్వబడే వ్యక్తిని, దైవిక ప్రసాదం అనే నిష్క్రియ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: దైవిక మూలాన్ని సూచించే యోహాను వాడుకను వ్యాఖ్యానించి ‘దేవుని నుండి’ అని మార్చకుండా, మూలంలోని రూపక వ్యక్తీకరణను నిలుపుతుంది.
theological_decisions:
- issue: పరలోకం నుండి ఇవ్వబడటమనే ప్రకటన యొక్క పరిధి
  choice: ఏదైనా పొందడం పరలోకం నుండి ఇవ్వబడటంపై ఆధారపడుతుందనే విస్తృత వాక్యాన్ని అలాగే ఉంచడం
  alternative: దీనిని కేవలం పరిచర్యా పాత్రలు లేదా ఆధ్యాత్మిక అధికారానికే పరిమితం చేయడం; లేదా సమస్త మానవ చర్యలపై సంపూర్ణ నిర్ణయవాద ప్రకటనగా విస్తరించడం
  rationale: తక్షణ సందర్భం యోహాను పరిచర్యను, యేసు పెరుగుతున్న ప్రాముఖ్యతను గురించినదైనా, వాక్య నిర్మాణం సాధారణ సూత్రంలా విస్తృతంగా ఉంది. అనువాదం ఏ ప్రత్యేక సిద్ధాంత వ్యవస్థనూ చేర్చకుండా ఆ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని కథన ద్వంద్వక్రియను ‘జవాబిచ్చి ఇలా అన్నాడు’గా, ‘ఒక్కటి కూడా’ అనే నొక్కిచెప్పే భావాన్ని స్పష్టంగా నిలిపింది.
