id: JHN.3.17
reference: John 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: te
  text: ఎందుకంటే దేవుడు కుమారుణ్ణి లోకంలోకి లోకాన్ని తీర్పు తీర్చడానికి పంపలేదు[a]; కానీ లోకం ఆయన ద్వారా రక్షణ పొందాలని కుమారుణ్ణి పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లోకాన్ని దోషిగా తీర్పు తీర్చడానికి.’ గ్రీకు క్రియకు ప్రాథమికంగా ‘తీర్పు తీర్చు’ అనే విస్తృత అర్థం ఉంది; ఈ సందర్భంలో దాన్ని మరింత సన్నగా ‘దోషిగా తీర్పు తీర్చు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ఎందుకంటే ... పంపలేదు
  rationale: γάρ ముందున్న వాక్యానికి వివరణాత్మక సంబంధాన్ని చూపుతుంది; ‘ఎందుకంటే’ ఆ సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది. οὐ క్రియను నిషేధిస్తుంది.
- source_word: ἀπέστειλεν
  choice: పంపాడు / పంపలేదు
  rationale: ἀποστέλλω యొక్క సాధారణ అర్థం ‘పంపు’; ప్రత్యేకమైన నియామక భావాన్ని అనవసరంగా చేర్చకుండా యోహాను వాడుకను నిలుపుతుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న θεός ఇక్కడ సహజంగా ‘దేవుడు’ అని అనువదించబడుతుంది.
- source_word: τὸν υἱὸν
  choice: కుమారుణ్ణి
  rationale: మూలంలో స్పష్టమైన స్వామ్యసూచక పదం లేదు; కాబట్టి ‘తన కుమారుణ్ణి’ అని చేర్చకుండా, ‘కుమారుడు’ అనే బిరుదు భావాన్ని నిలుపుతుంది.
- source_word: εἰς τὸν κόσμον
  choice: లోకంలోకి
  rationale: εἰς ఇక్కడ లోకం అనే పరిధిలోనికి రావడాన్ని సూచిస్తుంది; ‘లోకంలోకి’ దానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: లోకానికి తీర్పు తీర్చడానికి
  rationale: κρίνω యొక్క ప్రాథమిక, విస్తృత భావం ‘తీర్పు తీర్చు’; దాన్ని కేవలం ‘శిక్ష విధించు’ అనే సన్నని అర్థానికి పరిమితం చేయదు. ఉద్దేశాన్ని తెలిపే ἵνα సహజమైన తెలుగు ప్రయోజనార్థక నిర్మాణంతో వ్యక్తమైంది.
- source_word: ἀλλ’ ἵνα
  choice: '... రక్షణ పొందాలనే'
  rationale: ἀλλά రెండు ఉద్దేశాల మధ్య బలమైన వ్యత్యాసాన్ని సూచిస్తుంది. తెలుగులో రెండవ ‘పంపాడు’తో కూడిన నిర్మాణం ఆ వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σωθῇ
  choice: రక్షణ పొందాలని
  rationale: σῴζω యొక్క కర్మణి రూపాన్ని ‘రక్షణ పొందు’ సహజంగా తెలియజేస్తూ, రక్షించబడటం/విమోచించబడటం అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ὁ κόσμος
  choice: లోకం
  rationale: κόσμος పదాన్ని వాక్యమంతటా ఒకే విధంగా ‘లోకం’ అని అనువదించడం మూలంలోని పునరుక్తిని, యోహాను రచనలోని విస్తృత భావసాధ్యతను నిలుపుతుంది.
- source_word: δι’ αὐτοῦ
  choice: ఆయన ద్వారా
  rationale: షష్ఠీ విభక్తితో διά సాధనం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది; ‘ఆయన ద్వారా’ దాన్ని అతివ్యాఖ్యానం లేకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: σωθῇతో వ్యత్యాసంలో κρίνῃ అర్థం
  choice: తీర్పు తీర్చు
  alternative: దోషిగా తీర్పు తీర్చు / శిక్ష విధించు
  rationale: సందర్భంలో κρίνωను ‘దోషిగా తీర్పు తీర్చు’ అని గ్రహించే అవకాశం ఉన్నా, గ్రీకు క్రియకు ‘తీర్పు తీర్చు’ అనే విస్తృత ప్రాథమిక అర్థం ఉంది. ప్రధాన పాఠంలో ఆ విస్తృతిని, ధార్మిక ఉద్వేగాన్ని నిలిపి, సన్నని సందర్భార్థాన్ని పాదటిప్పణిలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కుమారుణ్ణి’ అని మూలంలోని స్వామ్యసూచకత లేని రూపాన్ని నిలిపాం. వాక్యాంతంలో ‘పంపాడు’ను పునరుక్తి చేయడం ద్వారా తెలుగులో ఉద్దేశాల వ్యత్యాసం స్పష్టంగా, సహజంగా వినిపిస్తుంది.
