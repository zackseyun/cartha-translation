  source_fidelity: 'ప్రధాన పాఠ్యం గ్రీకు నిర్మాణాన్నీ భావాన్నీ సరిగ్గా అందిస్తుంది: ఆయన సాక్ష్యాన్ని స్వీకరించిన వ్యక్తి, దేవుడు సత్యవంతుడని ధృవీకరిస్తాడు. అయితే పాదసూచికలోని ‘తన ముద్ర’కు గ్రీకు పాఠ్యంలో సమానమైన స్వత్వసూచక పదం లేదు; అది అనవసరంగా అదనపు భావాన్ని కలుపుతుంది.'
