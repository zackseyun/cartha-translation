source:
  edition: SBLGNT
  text: ὁ λαβὼν αὐτοῦ τὴν μαρτυρίαν ἐσφράγισεν ὅτι ὁ θεὸς ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/033.yaml
  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: te
  text: ఆయన సాక్ష్యాన్ని స్వీకరించినవాడు దేవుడు సత్యవంతుడని ధృవీకరించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “దేవుడు సత్యవంతుడని ముద్ర వేశాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: స్వీకరించినవాడు
  rationale: నామవాచకంగా పనిచేసే భూతకాల అసమాపక క్రియారూపం సాధారణంగా అటువంటి వ్యక్తిని సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో ఇది సహజంగా ఉండి, స్వీకరణను పూర్తయిన చర్యగా చూపుతుంది.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: సందర్భంలో ఈ సర్వనామం పరలోకం నుండి వచ్చినవాని, అంటే కుమారుని, సూచిస్తుంది. గౌరవప్రదమైన ఆధునిక తెలుగులో ‘ఆయన’ సహజం.
- source_word: τὴν μαρτυρίαν
  choice: సాక్ష్యాన్ని
  rationale: యోహాను రచనలోని సాక్షి/సాక్ష్య భావాన్ని నిలుపుతూ, స్వీకరించబడే వాంగ్మూలం అనే అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐσφράγισεν
  choice: ధృవీకరించాడు
  rationale: మూలార్థం ‘ముద్ర వేశాడు’; ఇక్కడ రూపకాలంకారంగా ఏదో నిజమని అధికారికంగా అంగీకరించడం లేదా నిర్ధారించడం. ‘ధృవీకరించాడు’ ఈ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὅτι
  choice: అని
  rationale: ఇది కారణాన్ని కాకుండా ధృవీకరించిన విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘అని’ తగిన అనుసంధానం.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: నిర్దిష్ట కర్తను నేరుగా, విస్తరణ లేకుండా అనువదిస్తుంది.
- source_word: ἀληθής
  choice: సత్యవంతుడు
  rationale: ఈ సందర్భంలో దేవుడు నిజం పలికేవాడు, నమ్మదగినవాడు అనే వ్యక్తిగత గుణాన్ని సూచిస్తుంది. ‘సత్యవంతుడు’ తెలుగు వాడుకలో ఆ భావాన్ని ‘సత్యం’ కంటే సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ముద్ర వేయడం అనే రూపకపు భావం
  choice: ప్రధాన పాఠ్యంలో ‘ధృవీకరించాడు’
  alternative: ‘ముద్ర వేశాడు’
  rationale: సాక్ష్యాన్ని స్వీకరించడం దేవుని సత్యవంతత్వాన్ని అంగీకరించి నిర్ధారించడంగా ఈ వాక్యం చెబుతుంది. ఆధునిక పాఠకునికి రూపకపు ఉద్దేశాన్ని స్పష్టంగా అందించేందుకు భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, మూలంలోని ముద్ర రూపకాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: ἀληθής యొక్క భావ పరిధి
  choice: ‘దేవుడు సత్యవంతుడు’
  alternative: ‘దేవుడు సత్యం’ లేదా ‘దేవుడు నిజమైనవాడు’
  rationale: ఇక్కడ దేవుని వాక్కు/సాక్ష్యం నమ్మదగినదని అంగీకరించడం ప్రధాన భావం. ‘సత్యవంతుడు’ ఆయన నిజాయితీ, విశ్వసనీయతను తెలియజేస్తూ, దేవుని స్వరూపం గురించి మరింత విస్తృతమైన వాదనను అనవసరంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘ఆయన’ సందర్భంలోని కుమారునికి గౌరవ సూచకంగా వాడబడింది. ప్రధాన పాఠ్యంలో సహజమైన రూపకార్థం ఇవ్వబడగా, గ్రీకు ముద్ర రూపకం [a] పాదసూచికలో నిలుపబడింది.
