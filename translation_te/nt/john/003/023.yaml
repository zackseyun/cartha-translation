source:
  edition: SBLGNT
  text: ἦν δὲ καὶ ⸀ὁ Ἰωάννης βαπτίζων ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ, ὅτι ὕδατα πολλὰ ἦν ἐκεῖ, καὶ παρεγίνοντο καὶ ἐβαπτίζοντο·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: te
  text: యోహాను కూడా సలీముకు సమీపంలోని ఐనోనులో బాప్తిస్మమిస్తూ ఉండేవాడు[b], ఎందుకంటే అక్కడ విస్తారంగా నీరు ఉండేది[a]; ప్రజలు వస్తూ బాప్తిస్మం పొందుతూ ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘అక్కడ అనేక జలాలు ఉండేవి’; లేదా, ‘అక్కడ చాలా నీరు ఉండేది.’
    reason: lexical_alternative
  - marker: b
    text: ‘బాప్తిస్మమిస్తూ’ అని అనువదించిన గ్రీకు క్రియను ‘ముంచుతూ’ అని కూడా అనువదించవచ్చు. ఇక్కడ స్థిరపడిన ‘బాప్తిస్మం’ అనే పదాన్ని ఉంచాం; ఈ పదం మాత్రమే ఆచరణ విధానాన్ని నిర్ణయించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ ὁ Ἰωάννης βαπτίζων
  choice: యోహాను కూడా ... బాప్తిస్మమిస్తూ ఉండేవాడు
  rationale: δέను సందర్భంలోని మృదువైన అనుసంధానంగా సహజంగా వదిలి, καί యొక్క ‘కూడా’ భావాన్ని స్పష్టంగా ఉంచాం. ἦν + వర్తమాన కృదంతం గతంలో కొనసాగుతున్న కార్యాన్ని సూచిస్తున్నందున ‘బాప్తిస్మమిస్తూ ఉండేవాడు’ అని అనువదించాం.
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: సలీము సమీపంలోని ఐనోనులో
  rationale: స్థల నామాలను తెలుగు లిపిలో లిప్యంతరీకరించి, ἐγγύς సూచించే సమీప భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేశాం.
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: ఎందుకంటే అక్కడ నీరు సమృద్ధిగా ఉండేది
  rationale: ὅτι ఇక్కడ కారణాన్ని సూచిస్తుంది. బహువచనంలోని ὕδατα πολλὰను అక్షరార్థంగా ‘అనేక జలాలు’ అనడం ఆధునిక తెలుగులో అసహజంగా ఉండటంతో, దాని భావాన్ని ‘నీరు సమృద్ధిగా’ అని ఇచ్చి అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: παρεγίνοντο καὶ ἐβαπτίζοντο
  choice: ప్రజలు వస్తూ బాప్తిస్మం పొందుతూ ఉండేవారు
  rationale: రెండు అసంపూర్ణ భూతకాల క్రియలలోని కొనసాగుతున్న లేదా పునరావృత చర్యను ‘వస్తూ ... పొందుతూ ఉండేవారు’ ద్వారా నిలిపాం. తెలుగులో కర్త అవసరమైనందున సందర్భానుసారంగా ‘ప్రజలు’ చేర్చాం; కర్మణి భావాన్ని ‘పొందుతూ’తో కాపాడాం.
theological_decisions:
- issue: βαπτίζω పదానికి అనువాదం
  choice: బాప్తిస్మమిస్తూ / బాప్తిస్మం పొందుతూ
  alternative: ముంచుతూ / ముంచబడుతూ
  rationale: కొత్త నిబంధన సందర్భంలో ఇది స్థిరపడిన మతపరమైన పదం. ‘బాప్తిస్మం’ అనే పదం మూలపదంతో పదసంబంధాన్ని కాపాడుతూ, ఆచరణ విధానంపై ఏ ప్రత్యేక సంప్రదాయ నిర్ణయాన్నీ ప్రధాన పాఠ్యంలో బలవంతంగా రుద్దదు; సాధ్యమైన ‘ముంచడం’ భావాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన వచనశైలిని వాడాం. ‘ఐనోను,’ ‘సలీము’ అనే రూపాలు స్థల నామాల లిప్యంతరీకరణలు. కొనసాగుతున్న గత చర్యను సహజంగా తెలియజేయడానికి ‘ఉండేవాడు/ఉండేవారు’ నిర్మాణాన్ని ఉపయోగించాం.
