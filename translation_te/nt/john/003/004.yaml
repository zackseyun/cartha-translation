id: JHN.3.4
reference: John 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: te
  text: నికోదేము ఆయనతో, “ఒక మనిషి[a] ముసలివాడైనప్పుడు ఎలా పుట్టగలడు? అతడు రెండోసారి తన తల్లి గర్భంలోకి ప్రవేశించి పుట్టగలడా? కాదు కదా?” అన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరైనా వృద్ధుడైనప్పుడు.” గ్రీకులో ‘మనిషి’ అనే ఏకవచన పురుషరూపం సాధారణ అర్థంలో వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు: “రెండోసారి.” నికోదేము యేసు మాటలను అక్షరార్థంలో గ్రహిస్తున్నాడు.'
    reason: cross_reference
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: ఆయనతో … అన్నాడు
  rationale: గ్రీకులో వర్తమాన కాలరూపం ఉన్నా, యోహాను కథనంలో ఇది చారిత్రక వర్తమానం. సహజమైన తెలుగు కథనశైలికి అనుగుణంగా భూతకాలంలో అనువదించాం.
- source_word: Νικόδημος
  choice: నికోదేము
  rationale: తెలుగులో సులభంగా పలికే, ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: Πῶς δύναται
  choice: ఎలా … పుట్టగలడు?
  rationale: సాధ్యతను ప్రశ్నించే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగు ప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: ఇక్కడ ఏ మానవుడినైనా సూచించే ఏకవచన సాధారణ ప్రయోగం. మూలంలోని ఏకవచన రూపాన్ని నిలిపాం.
- source_word: γεννηθῆναι
  choice: పుట్టగలడు / పుట్టగలడా
  rationale: ఈ సందర్భంలో γεννάω యొక్క కర్మణి రూపం జన్మించడాన్ని సూచిస్తుంది. ముందరి వచనంలోని ἄνωθεν భావాన్ని దీనిలో కలపకుండా ‘పుట్టు’ అని అనువదించాం.
- source_word: γέρων ὤν
  choice: ముసలివాడైనప్పుడు
  rationale: ‘వృద్ధుడై ఉండగా’ అనే పరిస్థితిని సహజమైన తెలుగు కాలార్థక ఉపవాక్యంగా తెలిపాం.
- source_word: μὴ δύναται
  choice: పుట్టగలడా?
  rationale: μή ప్రతికూల సమాధానాన్ని ఆశించే ప్రశ్నను సూచిస్తుంది. సందర్భంలోని అసంభవ భావం తెలుగులో ప్రశ్న ద్వారానే సహజంగా వ్యక్తమవుతుంది.
- source_word: κοιλίαν
  choice: గర్భం
  rationale: ‘తల్లి’తో కలిసి వచ్చినందున κοιλία ఇక్కడ ఉదరం సాధారణ అర్థంలో కాక గర్భాన్ని సూచిస్తుంది.
- source_word: δεύτερον
  choice: రెండోసారి
  rationale: మూలంలోని ‘రెండవసారి’ అనే స్పష్టమైన అర్థాన్ని నిలిపి, నికోదేము మాటలను అక్షరార్థంగా గ్రహించిన తీరును చూపిస్తుంది.
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: ప్రవేశించి పుట్టగలడా
  rationale: ప్రవేశించడం, పుట్టడం అనే రెండు క్రియలనూ స్పష్టంగా ఉంచి ప్రశ్నలోని తర్కక్రమాన్ని నిలిపాం.
theological_decisions:
- issue: ἄνθρωπος అనే సాధారణ ఏకవచన పురుషరూపం
  choice: ఒక మనిషి
  alternative: ఎవరైనా / ఒక వ్యక్తి
  rationale: గ్రీకు పదం ఈ సందర్భంలో మగవారికే పరిమితం కాక సాధారణ మానవ ప్రతినిధిగా ఉంది. అయినా మూలంలోని ఏకవచన వ్యక్తీకరణను ‘ఒక మనిషి’గా నిలిపాం.
- issue: యోహాను 3:3లోని ἄνωθεν భావాన్ని ఈ వచనంలోని γεννηθῆναιలో చేర్చాలా?
  choice: పుట్టగలడు … రెండోసారి … పుట్టగలడా
  alternative: మళ్లీ పుట్టగలడు
  rationale: ఈ వచనంలో δεύτερον స్పష్టంగా ‘రెండోసారి’ అని ఉంది. కాబట్టి నికోదేము యేసు మాటలను అక్షరార్థంగా గ్రహించిన కథన ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని వాడాం. ‘ముసలివాడు’ మూలంలోని γέρωνకు నేరమైన, సహజమైన సమానం; ‘గర్భం’ సందర్భానుసారంగా ఖచ్చితమైన పదం.
