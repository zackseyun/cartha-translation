  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: te
  text: '“నిజంగా, నిజంగా[a] నీతో చెబుతున్నాను: మాకు తెలిసినదాని గురించి మేము మాట్లాడుతున్నాం, మేము చూసినదాని గురించి సాక్ష్యమిస్తున్నాం, మరియు మీరు మా సాక్ష్యాన్ని స్వీకరించడం లేదు.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమేన్, ఆమేన్, నీతో చెబుతున్నాను.”
    reason: lexical_alternative
  - marker: c
    text: ‘స్వీకరించడం లేదు’ అనే మాటను ‘అంగీకరించడం లేదు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: రెట్టింపుతో వచ్చిన గంభీరమైన నిశ్చయ ప్రకటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; మూలంలోని ‘ఆమేన్’ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: λέγω σοι
  choice: నీతో చెబుతున్నాను
  rationale: రెండవ పురుష ఏకవచన సంబోధనను స్పష్టంగా నిలుపుతూ సహజమైన తెలుగు ప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: మాకు తెలిసినదానినే మేము మాట్లాడుతున్నాం
  rationale: తెలిసిన విషయమే మాటల విషయమని తెలిపే సంబంధవాచక నిర్మాణాన్ని, అలాగే మొదటి పురుష బహువచనాన్ని నిలుపుతుంది.
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: మేము చూసినదాని గురించే సాక్ష్యమిస్తున్నాం
  rationale: ἑωράκαμεν యొక్క గత దర్శనానికి కొనసాగుతున్న ప్రాముఖ్యతను సందర్భం ద్వారా వ్యక్తపరుస్తూ, μαρτυροῦμεν లోని సాక్ష్యభావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: మా సాక్ష్యాన్ని
  rationale: క్రియ ‘సాక్ష్యమిస్తున్నాం’తో ఉన్న పదసంబంధాన్ని కాపాడి, మొదటి పురుష బహువచనాన్ని అనువాదంలో ఉంచుతుంది.
- source_word: οὐ λαμβάνετε
  choice: మీరు స్వీకరించడం లేదు
  rationale: λαμβάνω యొక్క ‘పొందడం/స్వీకరించడం’ భావాన్ని, యోహాను రచనలో దానికి ఉన్న పదసంబంధాన్ని నిలుపుతుంది; బహువచన ‘మీరు’ను కూడా స్పష్టం చేస్తుంది.
- source_word: καὶ ... καὶ
  choice: …; … .
  rationale: వాక్యభాగాలను తెలుగులో సహజంగా అనుసంధానిస్తూ, చివరి καίకు మూలంలో లేని స్పష్టమైన విరోధార్థక పదాన్ని జోడించకుండా ఉంటుంది.
theological_decisions:
- issue: ‘మేము … మా’ అనే మొదటి పురుష బహువచనాల సూచన
  choice: ‘మేము’, ‘మా’ అని యథాతథంగా నిలుపబడింది.
  alternative: యేసు మరియు ఆయన శిష్యులు; అలంకారిక బహువచనం; లేదా విస్తృతమైన పరలోక/దైవిక సాక్ష్యం అని నిర్దిష్టీకరించడం.
  rationale: గ్రీకు పాఠం బహువచనాన్ని స్పష్టంగా వాడినా, అందులో ఎవరెవరు ఉన్నారో నిర్ణయించదు. అందువల్ల అనువాదం ఆ వ్యాఖ్యానపరమైన, theological ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: ఏకవచన ‘నీతో’ మరియు బహువచన ‘మీరు’ మధ్య మార్పు
  choice: రెండు వచనరూపాలనూ స్పష్టంగా నిలుపబడింది.
  alternative: తెలుగులో రెండింటినీ గౌరవార్థక ‘మీరు’గా చేసి సంఖ్యాభేదాన్ని అస్పష్టం చేయడం.
  rationale: λέγω σοι ఏకవచనం; λαμβάνετε బహువచనం. ఈ మార్పు మూలపాఠంలో నిజమైనది కాబట్టి అనువాదంలో కనిపించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘నీతో’ ద్వారా గ్రీకు ఏకవచనాన్ని, ‘మీరు’ ద్వారా తరువాతి బహువచనాన్ని ఉద్దేశపూర్వకంగా వేరు చేసింది. మొదటి పురుష బహువచనాల సూచనను వ్యాఖ్యానాత్మకంగా సంకుచితం చేయలేదు.
