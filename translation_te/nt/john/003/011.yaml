- from: '“నిజంగా, నిజంగా[a] నీతో చెబుతున్నాను: మాకు తెలిసినదానినే మేము మాట్లాడుతున్నాం; మేము చూసినదాని గురించే సాక్ష్యమిస్తున్నాం.[b] మా సాక్ష్యాన్ని మీరు స్వీకరించడం లేదు.[c]”'
  to: '“నిజంగా, నిజంగా[a] నీతో చెబుతున్నాను: మాకు తెలిసినదాని గురించి మేము మాట్లాడుతున్నాం, మేము చూసినదాని గురించి సాక్ష్యమిస్తున్నాం, మరియు మీరు మా సాక్ష్యాన్ని స్వీకరించడం లేదు.[c]”'
