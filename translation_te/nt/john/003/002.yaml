id: JHN.3.2
reference: John 3:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: te
  text: ఈయన రాత్రివేళ[a] యేసు దగ్గరకు వచ్చి ఆయనతో, “రబ్బీ, మీరు దేవుని దగ్గరనుండి బోధకునిగా వచ్చారని మాకు తెలుసు. ఎందుకంటే దేవుడు అతనితో ఉంటే తప్ప, మీరు చేస్తున్న ఈ సూచక క్రియలను[b] ఎవరూ చేయలేరు” అని అన్నాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రాత్రి” అని కూడా అనువదించవచ్చు. యోహాను సువార్తలో రాత్రి లేదా చీకటి కొన్నిసార్లు ప్రతీకాత్మక భావాన్ని కూడా కలిగి ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఈ అద్భుత సూచనలను.” గ్రీకు పదం σημεῖα; యోహాను సువార్తలో ఈ కార్యాలు తమకు మించిన వాస్తవాన్ని సూచిస్తాయని తెలియజేయడానికి “సూచక క్రియలు” అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు వాక్యంలో చివరి భాగం అక్షరార్థంగా, “దేవుడు అతనితో ఉంటే తప్ప” అని మూడవ పురుషంలో ఉంది.
    reason: source_form
lexical_decisions:
- source_word: οὗτος
  choice: ఈయన
  rationale: ముందటి వచనంలో పరిచయమైన నికోదేమును సూచించే సర్వనామ బలాన్ని సహజమైన గౌరవప్రద తెలుగు రూపంలో నిలుపుతుంది.
- source_word: νυκτός
  choice: రాత్రివేళ
  rationale: కాలాన్ని సూచించే జనిటివ్‌కు సహజమైన తెలుగు రూపం; యోహాను సువార్తలో రాత్రి/చీకటికి ఉండగల ప్రతీకాత్మక ప్రతిధ్వనిని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: Ῥαββί
  choice: రబ్బీ
  rationale: గ్రీకు పాఠంలో నిలుపబడిన యూదుల సంబోధనను లిప్యంతరీకరిస్తూ చారిత్రక నేపథ్యాన్ని కాపాడుతుంది.
- source_word: οἴδαμεν
  choice: మాకు తెలుసు
  rationale: ప్రథమ పురుష బహువచనాన్ని ఏకవచనంగా మార్చకుండా యథాతథంగా నిలుపుతుంది.
- source_word: ἀπὸ θεοῦ ἐλήλυθας
  choice: మీరు దేవుని దగ్గర నుంచి వచ్చిన
  rationale: పరిపూర్ణ కాలంలోని వచ్చుటను, దేవుని నుంచే మూలమనే భావాన్ని నిలుపుతుంది; పాఠంలో లేని ‘పంపబడిన’ అనే బలమైన భావాన్ని చేర్చదు.
- source_word: διδάσκαλος
  choice: బోధకులు
  rationale: యేసును గౌరవంగా సంబోధించే ఆధునిక తెలుగు వాక్యనిర్మాణంలో బోధించే వ్యక్తి/పాత్రను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ταῦτα τὰ σημεῖα
  choice: ఈ సూచక క్రియలను
  rationale: σημεῖα కేవలం అద్భుతాలు కాక, తమకు మించిన వాస్తవాన్ని సూచించే కార్యాలు అనే యోహానీయ భావాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: మీరు చేస్తున్న ... చేయలేరు
  rationale: మూలంలోని ποιέω క్రియ పునరుక్తిని సాధ్యమైనంత సహజంగా నిలుపుతుంది.
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: దేవుడు తోడుగా ఉంటే తప్ప
  rationale: మూలంలోని సాధారణ మూడవ పురుష నిర్మాణాన్ని తెలుగులో సహజంగా ఉంచుతుంది; దానిని నేరుగా ‘మీకు తోడుగా’ అని మార్చదు.
theological_decisions:
- issue: యోహాను సువార్తలో σημεῖα అనువాదం
  choice: సూచక క్రియలు
  alternative: అద్భుతాలు
  rationale: ఈ కార్యాల అద్భుత స్వభావాన్ని నిరాకరించకుండా, అవి యేసు గుర్తింపు మరియు కార్యాన్ని సూచిస్తాయనే భావాన్ని కాపాడుతుంది.
- issue: ద్వితీయ పురుష సంబోధన నుంచి మూడవ పురుష సాధారణ వాక్యానికి మార్పు
  choice: దేవుడు తోడుగా ఉంటే తప్ప ఎవరూ... చేయలేరు
  alternative: దేవుడు మీకు తోడుగా ఉంటే తప్ప మీరు... చేయలేరు
  rationale: గ్రీకు పాఠంలోని αὐτοῦ మూడవ పురుష రూపాన్ని తెలుగులో సహజమైన సాధారణ నియమవాక్యంగా నిలుపుతుంది.
- issue: ἀπὸ θεοῦ ἐλήλυθας అధికారికంగా పంపబడటాన్ని సూచిస్తుందా
  choice: దేవుని దగ్గర నుంచి వచ్చిన
  alternative: దేవునిచేత పంపబడిన
  rationale: ఈ వచనం స్పష్టంగా దేవుని నుంచి రావడాన్ని చెబుతుంది; ‘పంపబడిన’ అనే వేరే క్రియాభావాన్ని అనవసరంగా దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని ఉపయోగించాం. ‘మీరు/బోధకులు’ అనే గౌరవ బహువచనం తెలుగు సంబోధనకు అనుగుణం. [c] సూచికను సంబంధిత వాక్యాంతంలో ఉంచి మూలంలోని మూడవ పురుష నిర్మాణాన్ని వివరించాం.
