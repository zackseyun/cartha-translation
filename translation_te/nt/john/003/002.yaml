review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the plural ‘we know,’ ‘from God,’ the designation ‘Rabbi,’ and the Greek shift to a third-person expression in the final conditional clause. However, ‘దేవుడు తోడుగా ఉంటే తప్ప’ leaves the person with whom God is present unstated in the translation itself. The Greek explicitly says ‘unless God is with him’ (μετ’ αὐτοῦ), so the third-person referent should be expressed.
  naturalness: The revised wording is natural modern standard Telugu and preserves respectful address to Jesus. ‘బోధకునిగా వచ్చారని’ is smoother and more precise than the adjectival-honorific construction ‘వచ్చిన బోధకులని.’
  terminology: ‘రబ్బీ’ appropriately preserves the Jewish title. ‘సూచక క్రియలు’ is a defensible rendering of σημεῖα in Johannine usage, retaining their signifying function without reducing them merely to miracles.
  issues:
  - severity: medium
    issue: The final condition omits ‘with him.’
    rationale: ‘దేవుడు తోడుగా ఉంటే తప్ప’ does not state the third-person complement conveyed by Greek μετ’ αὐτοῦ. Adding ‘అతనితో’ preserves the source wording and makes the clause complete in Telugu.
  - severity: low
    issue: The phrase for Jesus’ status as teacher is somewhat awkward.
    rationale: ‘మీరు దేవుని దగ్గర నుంచి వచ్చిన బోధకులని’ can be understood, but ‘మీరు దేవుని దగ్గరనుండి బోధకునిగా వచ్చారని’ more naturally represents ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος while retaining the respectful second-person form.
  revised_text: ఈయన రాత్రివేళ[a] యేసు దగ్గరకు వచ్చి ఆయనతో, “రబ్బీ, మీరు దేవుని దగ్గరనుండి బోధకునిగా వచ్చారని మాకు తెలుసు. ఎందుకంటే దేవుడు అతనితో ఉంటే తప్ప, మీరు చేస్తున్న ఈ సూచక క్రియలను[b] ఎవరూ చేయలేరు” అని అన్నాడు.[c]
