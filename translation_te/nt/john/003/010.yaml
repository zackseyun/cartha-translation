    text: లేదా, “నీవు ఇశ్రాయేలులో ఒక బోధకుడవై ఉండి, ఈ సంగతులు నీకు తెలియవా?” గ్రీకులో “బోధకుడు” అనే పదానికి నిర్దిష్ట ఉపపదం ఉంది; అది ఈ సంబోధనకు పదునైన ప్రశ్నార్థక బలాన్ని ఇస్తున్నట్లు కనిపిస్తుంది.
