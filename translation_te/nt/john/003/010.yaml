id: JHN.3.10
reference: John 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ διδάσκαλος τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: te
  text: యేసు అతనికి జవాబిచ్చి, “నీవు ఇశ్రాయేలు బోధకుడవై ఉండి, ఈ సంగతులు నీకు తెలియవా?[a]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు ఇశ్రాయేలులో ఒక బోధకుడవై ఉండి, ఈ సంగతులు నీకు తెలియవా?” గ్రీకులో “బోధకుడు” అనే పదానికి నిర్దిష్ట ఉపపదం ఉంది; అది ఈ సంబోధనకు పదునైన ప్రశ్నార్థక బలాన్ని ఇస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτῷ
  choice: అతనికి జవాబిస్తూ ... అన్నాడు
  rationale: గ్రీకు సంభాషణా సూత్రంలోని ‘జవాబిచ్చి అతనితో అన్నాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; రెండు క్రియల కార్యాన్ని పూర్తిగా వదలదు.
- source_word: Σὺ
  choice: నీవు
  rationale: గ్రీకులో వ్యక్తంగా ఉన్న సర్వనామం నికొదేముపై గల ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ὁ διδάσκαλος
  choice: ఆ బోధకుడు
  rationale: నిర్దిష్ట ఉపపదం ఇచ్చే నిర్దిష్టతను, అలాగే సంబోధనలోని పదునైన అలంకారిక బలాన్ని తెలుగులో ‘ఆ’ ద్వారా నిలుపుతుంది.
- source_word: τοῦ Ἰσραὴλ
  choice: ఇశ్రాయేలుకు
  rationale: ఇశ్రాయేలు ప్రజలతో బోధకునికి ఉన్న ప్రతినిధిత్వ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ταῦτα
  choice: ఈ సంగతులు
  rationale: ముందటి సందర్భంలో యేసు బోధించిన విషయాలను విస్తృతంగా సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: γινώσκεις
  choice: తెలుసుకోలేవా
  rationale: మూల క్రియలోని ‘తెలుసుకొను’ భావాన్ని నిలుపుతూ, సందర్భంలో ఉన్న గ్రహింపు లోపాన్ని తెలుగు ప్రశ్నలో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ὁ διδάσκαλος τοῦ Ἰσραὴλ అనే సంబోధన బలం
  choice: ‘ఇశ్రాయేలుకు ఆ బోధకుడు’ అని నిర్దిష్ట బలంతో అనువదించడం
  alternative: ‘ఇశ్రాయేలులో ఒక బోధకుడు’
  rationale: గ్రీకులోని నిర్దిష్ట ఉపపదాన్ని నిలిపి, నికొదేము గుర్తింపు పొందిన బోధకుడనే సూచననూ యేసు ప్రశ్నలోని పదునునూ కాపాడుతుంది; అతడు ఏకైక బోధకుడని అదనపు సిద్ధాంతార్థం విధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సంభాషణా శైలి. మూలంలోని నిర్దిష్టత, ఉద్ఘాటన, ప్రశ్నలోని మందలింపు నిలుపబడ్డాయి.
