  source_fidelity: 'ముసాయిదా మూలగ్రీకు భావాన్ని ప్రధానంగా సరిగ్గా తెలియజేస్తుంది: οὖν యొక్క సంబంధం, యేసుకు ముందుగా ఉన్న అవగాహన, ఆయనపైకి రాబోయే సమస్తం, బయటికి వెళ్లడం, మరియు ప్రశ్న అన్నీ ఉన్నాయి. అయితే λέγει αὐτοῖς యొక్క సాధారణ ‘వారితో అన్నాడు’ను ‘వారిని ... అడిగాడు’గా మార్చడం ప్రశ్న సందర్భంలో సహజమైనప్పటికీ, మూలంలోని మాటలాడుట అనే క్రియను కొద్దిగా సంకుచితం చేస్తుంది. అలాగే Τίναకు ‘ఎవరిని’ మరింత ప్రత్యక్ష సమానార్థకం.'
