id: JHN.18.4
reference: John 18:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: te
  text: కాబట్టి యేసు, తనపైకి రాబోతున్నవన్నీ[a] తెలిసి, బయటికి వెళ్లి వారితో, “మీరు ఎవరిని వెదుకుతున్నారు?” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “తనకు సంభవించబోతున్నదంతా” అని కూడా అనువదించవచ్చు.
    reason: ‘తనపైకి రాబోతున్నవన్నీ’ అనే మూలపాఠ రూపకానికి సహజమైన తెలుగు ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ఇది కథనంలోని కొనసాగింపుతో పాటు ముందున్న సంఘటనల నుంచి వచ్చే తార్కిక సంబంధాన్ని కూడా సూచిస్తుంది. ‘అప్పుడు’ కంటే ‘కాబట్టి’ ఆ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: εἰδὼς
  choice: తెలిసి
  rationale: యేసుకు జరగబోయేవాటి గురించి అప్పటికే సంపూర్ణ అవగాహన ఉందనే స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది; ఆయన అప్పుడే తెలుసుకున్నాడనే భావాన్ని కలిగించదు.
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: తన మీదికి రాబోతున్నవన్నీ
  rationale: πάντα యొక్క సమగ్రతను, ἐρχόμενα యొక్క సమీప భవిష్యత్తు భావాన్ని, ἐπ’ αὐτόν లోని ‘మీదికి’ అనే రూపకాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది; రాబోయే శత్రుత్వ సంఘటనలను మూలపాఠం కంటే ఎక్కువగా వివరించదు.
- source_word: ἐξῆλθεν
  choice: బయటికి వెళ్లి
  rationale: ἐξέρχομαι యొక్క సాధారణ అర్థాన్ని కాపాడుతుంది; ‘ముందుకు వచ్చి’ వంటి అదనపు నాటకీయ లేదా స్థలసంబంధ భావాన్ని చేర్చదు.
- source_word: λέγει
  choice: అడిగాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథనంలో భూతకాలం సహజం. ప్రత్యక్ష వాక్యం ప్రశ్న కావడంతో ‘అడిగాడు’ సంభాషణ క్రియను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Τίνα ζητεῖτε
  choice: మీరు ఎవరి కోసం వెదుకుతున్నారు?
  rationale: Τίνα యొక్క కర్మార్థాన్ని ‘ఎవరి కోసం’ ద్వారా స్పష్టంగా చూపిస్తూ, ζητεῖτε యొక్క వర్తమాన మరియు ఉద్దేశపూర్వక అన్వేషణ భావాన్ని ‘వెదుకుతున్నారు’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: కథనంలో యేసుకు ఉన్న ముందస్తు అవగాహన
  choice: తన మీదికి రాబోతున్నవన్నీ యేసుకు తెలుసని నేరుగా చెప్పడం
  alternative: యేసు సర్వజ్ఞత్వాన్ని మరింత స్పష్టమైన సిద్ధాంతపరమైన పదాలతో విస్తరించి చెప్పడం
  rationale: ఈ వచనం యేసు తనకు జరగబోయే సంఘటనలను ముందే ఎరిగి ఉన్నాడని స్పష్టంగా చూపిస్తుంది. అయితే మూలపాఠం చెప్పినదానిని మించి వ్యవస్థీకృత సిద్ధాంత భాషను అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘వెదుకుతున్నారు’ అనే పదం సంభాషణలో సహజత్వాన్ని ఉంచుతూనే ζητέω యొక్క గంభీరతను కాపాడుతుంది.
