source:
  edition: SBLGNT
  text: ᾔδει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν τὸν τόπον, ὅτι πολλάκις ⸀συνήχθη Ἰησοῦς ἐκεῖ μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: te
  text: ఆయనను ద్రోహం చేస్తున్న యూదాకు[a] కూడా ఆ స్థలం తెలుసు; ఎందుకంటే యేసు తన శిష్యులతో కలిసి అక్కడ తరచూ కూడేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను అప్పగిస్తున్న యూదాకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: తెలుసు
  rationale: οἶδα ఇక్కడ ఆ స్థలంతో యూదాకు ఉన్న పరిచయాన్ని, దాని గురించిన అవగాహనను సూచిస్తుంది. సందర్భంలో సహజమైన తెలుగు రూపం ‘తెలుసు’.
- source_word: δὲ καὶ
  choice: కూడా
  rationale: δέ స్వల్ప కథన పురోగతిని సూచిస్తుండగా καί యూదాను అదనంగా చేర్చుతుంది. తెలుగులో ప్రత్యేక కాలసూచక పదాన్ని చేర్చకుండా ‘కూడా’తో ప్రధాన అనుబంధ భావాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: ఆయనను అప్పగించబోతున్న
  rationale: παραδίδωμι యొక్క ప్రాథమిక ‘అప్పగించు’ భావాన్ని నిలిపి, కథన సందర్భంలోని సమీప చర్యను తెలుగులో సహజంగా తెలిపింది; ‘ద్రోహం చేస్తున్న’ అనే సందర్భార్థం సాధ్యమైనప్పటికీ దానిని ప్రధాన పాఠంలో తప్పనిసరిగా నిర్దేశించలేదు.
- source_word: τὸν τόπον
  choice: ఆ స్థలం
  rationale: ముందటి వచనంలో ప్రస్తావించిన నిర్దిష్ట ప్రదేశాన్ని సూచించేందుకే ‘ఆ స్థలం’ సహజంగా ఉంటుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: యూదాకు ఆ స్థలం ఎందుకు తెలుసో తెలిపే కారణార్థక సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πολλάκις
  choice: తరచూ
  rationale: పునరావృతంగా జరిగిన చర్యను తెలిపే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: συνήχθη
  choice: సమావేశమయ్యేవాడు
  rationale: సందర్భంలో ఈ రూపం అకర్మకంగా ‘కలుసుకోవడం/కూడడం’ అనే భావంలో ఉంది. పునరావృత గత చర్యను ‘సమావేశమయ్యేవాడు’ సహజంగా తెలియజేస్తుంది.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: తన శిష్యులతో కలిసి
  rationale: μετά యొక్క సహవాస భావాన్ని, μαθηταί యొక్క గురు-శిష్య సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: యూదాకు సంబంధించి παραδιδοὺς అనువాదం
  choice: అప్పగించబోతున్న
  alternative: ద్రోహం చేస్తున్న
  rationale: యోహాను శ్రమవృత్తాంతంలో ఈ క్రియకు ద్రోహార్థం స్పష్టంగా ఉన్నప్పటికీ, ‘అప్పగించు’ అనే పదం మూల క్రియ యొక్క కార్యార్థాన్ని నిలుపుతూ సందర్భం ద్వారా దాని నైతిక తీవ్రతను గ్రహించనిస్తుంది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: συνήχθη యొక్క భావం
  choice: యేసు తన శిష్యులతో కలిసి అక్కడ తరచూ సమావేశమయ్యేవాడు
  alternative: యేసు తన శిష్యులతో కలిసి అక్కడ తరచూ కూడేవాడు
  rationale: గ్రీకు నిష్క్రియారూపం ఇక్కడ అకర్మక భావంతో ఉండవచ్చు. తెలుగు అలవాటుగత గతకాల రూపం పునరావృత సమావేశాన్ని సహజంగా తెలియజేస్తుంది; ఎవరో యేసును అక్కడ సమకూర్చారని సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. యేసును సూచించేందుకు ‘ఆయన’, యూదాను సూచించేందుకు ‘యూదాకు’ వాడి సర్వనామ సందిగ్ధతను తగ్గించాం; మూలంలోని కారణ సంబంధం, పునరావృత సమావేశ భావం నిలిపాం.
