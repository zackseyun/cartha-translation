id: JHN.18.23
reference: John 18:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Εἰ κακῶς ἐλάλησα, μαρτύρησον περὶ τοῦ κακοῦ· εἰ δὲ καλῶς, τί με δέρεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: te
  text: 'యేసు అతనికి జవాబిచ్చాడు: “నేను తప్పుగా మాట్లాడి ఉంటే, ఆ తప్పు గురించి సాక్ష్యం చెప్పు; కానీ సరిగ్గా మాట్లాడి ఉంటే, నన్నెందుకు కొడుతున్నావు?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నన్నెందుకు దెబ్బ కొడుతున్నావు?” గ్రీకు క్రియ కొట్టడం అనే విస్తృత భావాన్ని, కొన్ని సందర్భాల్లో పదేపదే కొట్టడం లేదా కొరడాతో కొట్టడం అనే భావాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ἰησοῦς
  choice: యేసు అతనికి జవాబిచ్చాడు
  rationale: గ్రీకు వాక్యంలోని సమాధాన క్రియను, పరోక్ష కర్మను సహజమైన ఆధునిక తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: Εἰ κακῶς ἐλάλησα
  choice: నేను తప్పుగా మాట్లాడి ఉంటే
  rationale: κακῶς అనే క్రియావిశేషణానికి ‘తప్పుగా’ న్యాయపరమైన సందర్భంలో సరిపోతుంది; షరతును సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μαρτύρησον περὶ τοῦ κακοῦ
  choice: ఆ తప్పు గురించి సాక్ష్యం చెప్పు
  rationale: μαρτύρησον లోని సాక్ష్యమిచ్చే న్యాయపరమైన భావాన్ని కాపాడుతూ, τοῦ κακοῦ ను అతిగా నిర్దిష్టం చేయకుండా ‘ఆ తప్పు’గా అందిస్తుంది.
- source_word: εἰ δὲ καλῶς
  choice: కానీ సరిగ్గా మాట్లాడి ఉంటే
  rationale: మొదటి భాగంలోని ‘తప్పుగా’ అనే పదానికి స్పష్టమైన వ్యతిరేకతను చూపుతుంది; తెలుగులో అవసరమైన క్రియను సందర్భానుసారంగా పునరుద్ధరిస్తుంది.
- source_word: τί με δέρεις;
  choice: నన్నెందుకు కొడుతున్నావు?
  rationale: τί ను ఈ ప్రయోగంలో ‘ఎందుకు’గా, δέρεις ను కొట్టడం అనే విస్తృత అర్థంతో సహజమైన వర్తమాన తెలుగు ప్రశ్నగా అనువదిస్తుంది.
theological_decisions:
- issue: అన్యాయమైన హింసకు యేసు ఇచ్చిన ప్రతిస్పందన స్వభావం
  choice: సాక్ష్యాన్ని కోరుతూ అన్యాయమైన దెబ్బను ప్రశ్నించే న్యాయపరమైన-నైతిక సవాలుగా అనువదించబడింది.
  alternative: అన్యాయాన్ని మరింత ఘాటుగా వ్యాఖ్యానించే భావానువాదం, లేదా న్యాయపరమైన ధోరణిని తగ్గించే మృదువైన అనువాదం.
  rationale: గ్రీకు వాక్యంలోని షరతులతో కూడిన తర్కాన్ని, సాక్ష్యానికి సంబంధించిన భాషను మాత్రమే నిలిపి, అదనపు సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘సాక్ష్యం చెప్పు’ న్యాయపరమైన ధ్వనిని నిలుపుతుంది; ‘తప్పుగా/సరిగ్గా’ మూలంలోని κακῶς/καλῶς వ్యతిరేకతను స్పష్టంగా ప్రతిబింబిస్తాయి. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత పాదటిప్పణితో సరిపోతుంది.
