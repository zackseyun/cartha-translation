source:
  edition: SBLGNT
  text: ἐκραύγασαν οὖν ⸀πάλιν λέγοντες· Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν. ἦν δὲ ὁ Βαραββᾶς λῃστής.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: te
  text: అందుకు వారు మళ్లీ కేకలు వేస్తూ, “ఇతడు వద్దు, బరబ్బానే కావాలి!” అన్నారు. బరబ్బా ఒక దోపిడీదారుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బందిపోటు”; ఈ గ్రీకు పదం సందర్భానుసారంగా దోపిడీదారుణ్ణి, బందిపోటును, లేదా హింసాత్మక తిరుగుబాటుదారుణ్ణి సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: కేకలు వేస్తూ ... అన్నారు
  rationale: ఈ క్రియ బిగ్గరగా కేక వేయడాన్ని సూచిస్తుంది. λέγοντεςతో కలిసి ఉన్న గ్రీకు నిర్మాణాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ఈ రూపం వాడబడింది.
- source_word: οὖν
  choice: అందుకు
  rationale: ముందటి సంభాషణకు ప్రజలు ఇచ్చిన ప్రతిస్పందనను అనుసంధానించే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: పునరావృతిని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: λέγοντες
  choice: '... అన్నారు'
  rationale: గ్రీకులోని ‘చెబుతూ’ అనే భాగాన్ని తెలుగులో ప్రత్యక్ష ఉల్లేఖనంతో సహజమైన వాక్య నిర్మాణంగా నిలుపుతుంది.
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: ఇతడు వద్దు, బరబ్బానే కావాలి
  rationale: τοῦτονలోని నిర్దేశక భావాన్ని ‘ఇతడు’ నిలుపుతుంది; గ్రీకులో సంక్షిప్తంగా ఉన్న వ్యతిరేక ఎంపికను తెలుగులో సహజంగా ‘వద్దు ... కావాలి’ అని వ్యక్తం చేస్తుంది. ‘బరబ్బానే’ వ్యతిరేక బలాన్ని కాపాడుతుంది.
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: బరబ్బా
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన పేరురూపం.
- source_word: ἦν δὲ
  choice: '... ఒక ...'
  rationale: δέ ఇక్కడ బరబ్బా గురించి నేపథ్య వివరణను పరిచయం చేస్తుంది. తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే కొత్త వాక్యం ఈ వివరణాత్మక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: λῃστής
  choice: దోపిడీదారుడు
  rationale: సాధారణ దొంగతనంకన్నా దోచుకోవడం లేదా బందిపోటుతనాన్ని సూచించే గ్రీకు పదబలాన్ని ఇది స్పష్టంగా అందిస్తుంది; సందర్భానుసారంగా ఉండగల తిరుగుబాటు సంబంధిత భావాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: బరబ్బాను వర్ణించే λῃστής పదంలోని భావ విస్తృతి
  choice: దోపిడీదారుడు
  alternative: బందిపోటు; హింసాత్మక తిరుగుబాటుదారుడు
  rationale: ఈ వచనంలో పదం ప్రధానంగా దోచుకునే వ్యక్తిని లేదా బందిపోటును సూచిస్తుంది. మొదటి శతాబ్దపు కొన్ని సందర్భాల్లో అది హింసాత్మక తిరుగుబాటుతో సంబంధమున్న వ్యక్తిని కూడా సూచించవచ్చు; అయితే ఈ వచనం మాత్రమే ఆ అర్థాన్ని తప్పనిసరి చేయదు. అందువల్ల ప్రధాన పాఠంలో విస్తృతంగా సరిపోయే పదాన్ని ఉంచి, ఇతర సాధ్యమైన భావాలను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ప్రజల గట్టిపట్టును ‘బరబ్బానే’ అనే రూపం వ్యక్తం చేస్తుంది; λῃστήςలోని చారిత్రక-రాజకీయ అస్పష్టతను ప్రధాన పాఠంలో అతిగా నిర్ణయించకుండా పాదటిప్పణిలో నిలిపాం.
