source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ τῷ Ἰησοῦ Σίμων Πέτρος ⸀καὶ ἄλλος μαθητής. ὁ δὲ μαθητὴς ἐκεῖνος ἦν γνωστὸς τῷ ἀρχιερεῖ καὶ συνεισῆλθεν τῷ Ἰησοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/john/018/015.yaml
  text: Simon Peter was following Jesus[a], and so was another disciple. That disciple was known to the high priest, and he went in with Jesus into the courtyard of the high priest,
translation:
  language: te
  text: సీమోను పేతురు యేసును వెంబడిస్తూ ఉన్నాడు[a]; మరొక శిష్యుడూ ఆయనను వెంబడిస్తూ ఉన్నాడు. ఆ శిష్యుడు ప్రధాన యాజకునికి తెలిసినవాడు. అతడు యేసుతో కలిసి ప్రధాన యాజకుని ఆవరణలోకి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మూల వాక్య నిర్మాణానికి మరింత దగ్గరగా: ‘సీమోను పేతురు యేసును వెంబడిస్తూ ఉన్నాడు; మరొక శిష్యుడూ.’ రెండవ శిష్యుడు చేసిన అదే చర్యను గ్రీకు పాఠం ప్రత్యక్షంగా మళ్లీ చెప్పకుండా అధ్యాహారంగా ఉంచుతుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκολούθει
  choice: వెంబడిస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కథనంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కొనసాగింపు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్ప కథన అనుసంధానకంగా పనిచేస్తుంది. తెలుగులో వాక్యక్రమమే ఆ అనుసంధానాన్ని సహజంగా అందిస్తుంది; ‘అయితే’ అని పెడితే మూలంలో లేని బలమైన వ్యతిరేక భావం కలగవచ్చు.
- source_word: καὶ ἄλλος μαθητής
  choice: మరొక శిష్యుడు కూడా ఆయనను వెంబడిస్తున్నాడు
  rationale: రెండవ శిష్యుని విషయంలో క్రియ గ్రీకులో అధ్యాహారంగా ఉంది. సహజమైన తెలుగుకోసం పంచుకున్న చర్యను స్పష్టంగా వ్యక్తం చేశాం.
- source_word: μαθητής
  choice: శిష్యుడు
  rationale: యోహాను సువార్తలో యేసును అనుసరించే నేర్చుకునే వ్యక్తికి ప్రామాణికమైన, సందర్భోచితమైన పదం.
- source_word: ἐκεῖνος
  choice: ఆ
  rationale: ఇంతకుముందు ప్రస్తావించిన ‘మరొక శిష్యుడు’ వైపు తిరిగి సూచించే నిర్దేశక బలాన్ని నిలుపుతుంది.
- source_word: γνωστὸς
  choice: తెలిసినవాడు
  rationale: ప్రధాన యాజకునికి ఆ శిష్యుడు తెలిసినవాడనే మూల భావాన్ని నేరుగా ఇస్తుంది; సాన్నిహిత్యం ఎంతటిదో అనవసరంగా నిర్ధారించదు.
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: ప్రధాన యాజకుడు / ప్రధాన యాజకుని
  rationale: ఈ సందర్భంలోని ఏకవచన ἀρχιερεύς‌కు సాధారణమైన తెలుగు సమానార్థకం; రెండు సందర్భాల్లోనూ ఏకవచనం నిలిపాం.
- source_word: συνεισῆλθεν
  choice: యేసుతో కలిసి ... లోకి వెళ్లాడు
  rationale: σύν కలిగిన సమాస క్రియ యేసుతోపాటు లోపలికి ప్రవేశించిన భావాన్ని తెలియజేస్తుంది.
- source_word: αὐλήν
  choice: ఆవరణం
  rationale: ఇక్కడ భవనానికి చెందిన చుట్టుముట్టబడిన ప్రాంగణాన్ని సూచిస్తుంది. ‘ఆవరణం’ ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండి, ‘రాజభవన ప్రాంగణం’ వంటి అధిక వివరణను జోడించదు.
