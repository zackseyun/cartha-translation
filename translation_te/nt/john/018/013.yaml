source:
  edition: SBLGNT
  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: te
  text: వారు యేసును మొదట అన్నా దగ్గరికి తీసుకువెళ్లారు; ఎందుకంటే అన్నా ఆ సంవత్సరం ప్రధాన యాజకుడైన కయఫాకు మామ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: తీసుకువెళ్లారు
  rationale: ἄγω ఇక్కడ నిర్బంధంలో ఒక చోటు నుంచి మరొక చోటుకు నడిపించి తీసుకువెళ్లడాన్ని సూచిస్తుంది. తెలుగు సహజ వాడుకలో ‘తీసుకువెళ్లారు’ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; గ్రీకులో సందర్భానుసారంగా అర్థమయ్యే కర్మను ‘యేసును’ అని వ్యక్తం చేశాం.
- source_word: πρὸς Ἅνναν
  choice: అన్న దగ్గరికి
  rationale: πρός + ద్వితీయా విభక్తి ఒక వ్యక్తి వైపు గమనాన్ని సూచిస్తుంది. ‘అన్న దగ్గరికి’ ఆధునిక తెలుగులో సహజంగా ఉంది; ఇది ‘అన్న ఎదుటికి’ అనే న్యాయవిచారణ భావాన్ని అనవసరంగా చేర్చదు.
- source_word: πρῶτον
  choice: మొదట
  rationale: క్రియావిశేషణంగా ఉన్న πρῶτον సంఘటనల క్రమాన్ని సూచిస్తుంది.
- source_word: πενθερὸς
  choice: మామ
  rationale: πενθερός ప్రత్యేకంగా భార్య తండ్రిని, అంటే మామను సూచిస్తుంది. కయపతో సంబంధం స్పష్టంగా ఉండే వాక్యనిర్మాణంలో ‘మామ’ సహజమైన తెలుగు పదం.
- source_word: ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: యూదుల ἀρχιερεύς పదవికి తెలుగులో స్థిరపడిన, అర్థవంతమైన సమానార్థకం ‘ప్రధాన యాజకుడు’.
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: ఆ సంవత్సరం
  rationale: కాలసూచక షష్ఠీ పదబంధాన్ని సహజ తెలుగులో ‘ఆ సంవత్సరం ప్రధాన యాజకుడిగా ఉన్న’ అని ఇచ్చాం.
- source_word: Ἅνναν
  choice: అన్న
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: Καϊάφα
  choice: కయప
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: ‘ఆ సంవత్సరం ప్రధాన యాజకుడిగా ఉన్నవాడు’ అనే సంబంధవాక్యం ఎవరిని సూచిస్తుంది?
  choice: కయపను సూచించేలా వాక్యాన్ని నిర్మించడం
  alternative: దాన్ని అన్నను సూచించేదిగా అపార్థం చేసుకునే వాక్యనిర్మాణం
  rationale: గ్రీకులో ὃς అత్యంత సహజంగా దానికి సమీప పూర్వపదమైన Καϊάφαను సూచిస్తుంది. తెలుగులో ‘ఆ సంవత్సరం ప్రధాన యాజకుడిగా ఉన్న కయపకు’ అని అమర్చి మూలంలోని సూచనను స్పష్టంగా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో అనువదించబడింది. అవసరం లేని వివరణాత్మక పదాలు లేదా సిద్ధాంతపరమైన ప్రత్యేకతలు చేర్చలేదు.
