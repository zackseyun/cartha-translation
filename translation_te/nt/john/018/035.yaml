id: JHN.18.35
reference: John 18:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: te
  text: 'పిలాతు జవాబిచ్చాడు: “నేను యూదుణ్ణా ఏమిటి?[a] నీ సొంత జనమూ ముఖ్య యాజకులూ నిన్ను నాకు అప్పగించారు. నీవేం చేశావు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను యూదయుడనా?” గ్రీకు పదం సందర్భాన్ని బట్టి జాతి లేదా మత గుర్తింపైన “యూదుడు”నూ, ప్రాంతీయ గుర్తింపైన “యూదయుడు”నూ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: సంభాషణలో ప్రతిస్పందనను తెలిపే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: Μήτι
  choice: నేను ... ఏమిటి?
  rationale: ప్రతికూల సమాధానాన్ని ఆశించే గ్రీకు ప్రశ్నార్థక బలాన్ని తెలుగులో సహజమైన విస్మయార్థక-ప్రశ్న రూపంతో వ్యక్తపరుస్తుంది.
- source_word: Ἰουδαῖός
  choice: యూదుడు
  rationale: ఇక్కడ పిలాతు తనను యేసు జాతీయ-మత సమూహం నుండి వేరుచేసుకుంటున్నాడు; అందువల్ల విస్తృతంగా అర్థమయ్యే ‘యూదుడు’ సందర్భానికి తగినది.
- source_word: τὸ ἔθνος τὸ σὸν
  choice: నీ సొంత జనం
  rationale: ἔθνος యొక్క సామూహిక ప్రజల భావాన్నీ, τὸ σὸν లోని స్వకీయ ఉద్ఘాటననూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀρχιερεῖς
  choice: ముఖ్య యాజకులు
  rationale: యెరూషలేములోని ప్రముఖ యాజక నాయకవర్గాన్ని సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదబంధం.
- source_word: παρέδωκάν σε ἐμοί
  choice: నిన్ను నాకు అప్పగించారు
  rationale: న్యాయాధికారికి ఒకరిని అధికారికంగా అప్పగించిన భావాన్ని ఇస్తుంది; ఈ సందర్భంలో ‘ద్రోహం చేశారు’ అనే అదనపు నైతిక భావాన్ని చేర్చదు.
- source_word: τί ἐποίησας
  choice: నువ్వేం చేశావు?
  rationale: పూర్తయిన చర్యను గురించి నేరుగా అడిగే సహజమైన తెలుగు ప్రశ్న; ప్రస్తుత విచారణతో దాని సంబంధం సందర్భం ద్వారా స్పష్టమవుతుంది.
theological_decisions:
- issue: యోహాను సువార్తలో Ἰουδαῖος పదం అనువాదం
  choice: యూదుడు
  alternative: యూదయవాడు
  rationale: పిలాతు ప్రశ్నకు వెంటనే ‘నీ సొంత జనం’ అనే మాట రావడం వల్ల ఇక్కడ కేవలం ప్రాంతీయ గుర్తింపుకంటే జాతీయ-మత గుర్తింపు ప్రధానంగా కనిపిస్తుంది. అయినా గ్రీకు పదానికి ప్రాంతీయ అర్థం కూడా సాధ్యమని పాదసూచికలో తెలియజేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి ఉపయోగించబడింది. పిలాతు మాటల్లోని దూరీకరణ భావం ‘నీ సొంత జనం’ ద్వారా, ప్రతికూల సమాధానాన్ని ఆశించే ప్రశ్న ‘నేను యూదుణ్ణా ఏమిటి?’ ద్వారా నిలుపబడింది.
