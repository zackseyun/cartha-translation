  text: ἦν δὲ Καϊάφας ὁ συμβουλεύσας τοῖς Ἰουδαίοις ὅτι συμφέρει ἕνα ἄνθρωπον ⸀ἀποθανεῖν ὑπὲρ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: te
  text: ప్రజల కోసం[b] ఒక మనిషి చనిపోవడం మేలు అని యూదులకు[a] సలహా ఇచ్చినవాడు కయప.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదు నాయకులకు” లేదా “యూదయవాసులకు”; సందర్భంలో యోహాను ఉపయోగించిన “యూదులు” అనే పదాన్ని ఎలా అర్థం చేసుకుంటామనే దానిపై ఇది ఆధారపడి ఉంటుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా “ప్రజల తరఫున”; సందర్భంలో ఈ మాటకు ప్రాతినిధ్య లేదా బలి సంబంధమైన అంతర్భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: ఈ ... వాడు
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో అనవసరమైన కాలసూచక పదాన్ని చేర్చకుండా, గుర్తింపును సహజమైన వాక్య నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: Καϊάφας
  choice: కయప
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు బైబిలు లిప్యంతరీకరణకు అనుగుణంగా ఇచ్చాం.
- source_word: ὁ συμβουλεύσας
  choice: సలహా ఇచ్చినవాడు
  rationale: నామవాచక బలమున్న భూతకాల కృదంతం కయపను అతడు ఇంతకుముందు చేసిన కార్యం ద్వారా గుర్తిస్తోంది.
- source_word: τοῖς Ἰουδαίοις
  choice: యూదులకు
  rationale: మూలంలో ఉన్న సాధారణ పదాన్ని ప్రధాన పాఠ్యంలో కుదించకుండా ఉంచాం; యోహాను సందర్భంలో సాధ్యమైన పరిమిత అర్థాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: ὅτι συμφέρει
  choice: మేలు అని
  rationale: సంబంధిత చర్య ప్రయోజనకరమని లేదా అనుకూలమని సూచించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἕνα ἄνθρωπον
  choice: ఒక మనిషి
  rationale: సంఖ్యా ఏకత్వాన్నీ, యేసును సూచించే పురుష ఏకవచన రూపాన్నీ నిలుపుతుంది.
- source_word: ἀποθανεῖν
  choice: చనిపోవడం
  rationale: అనవసర విస్తరణ లేకుండా మరణించడాన్ని తెలిపే infinitive భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: ప్రజల కోసం
  rationale: ప్రయోజనం లేదా ప్రాతినిధ్యం అనే అర్థాలను సహజంగా అనుమతిస్తూ, సందర్భంలోని బలియాగ లేదా ప్రతినిధిత్వ ప్రతిధ్వనులను అతిగా స్పష్టం చేయదు.
- source_word: λαοῦ
  choice: ప్రజల
  rationale: ఈ వచనంలో ἔθνος కాక λαός ఉన్నందున ‘జాతి’కి బదులు ‘ప్రజలు’ అనే అర్థాన్ని నిలిపాం.
theological_decisions:
- issue: ὑπὲρ τοῦ λαοῦలో ప్రాయశ్చిత్తం లేదా ప్రతినిధి మరణం అనే సంభావ్య భావం
  choice: ప్రజల కోసం
  alternative: ప్రజల తరఫున; ప్రజల స్థానంలో
  rationale: ὑπέρ ప్రయోజనార్థక లేదా ప్రాతినిధ్య భావాన్ని కలిగి ఉండవచ్చు; యోహాను కథనంలో బలియాగ/ప్రత్యామ్నాయ మరణ ప్రతిధ్వని కూడా ఉండవచ్చు. ప్రధాన పాఠ్యం దానిని ఒకే సిద్ధాంతార్థానికి పరిమితం చేయదు.
- issue: యోహాను సువార్తలో τοῖς Ἰουδαίοις ఎవరిని సూచిస్తుంది
  choice: యూదులకు
  alternative: యూదు నాయకులకు; యూదయవాసులకు
  rationale: గ్రీకు పాఠ్యం ఈ పదాన్ని మరింత పరిమితం చేయలేదు. సందర్భానుసారంగా నాయకులు లేదా యూదయవాసులు అనే అర్థాలు ప్రతిపాదించబడవచ్చు కాబట్టి ప్రధాన పాఠ్యంలో మూలంలోని విస్తృత పదాన్నే ఉంచి, ప్రత్యామ్నాయాలను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండేలా వాక్యాన్ని నిర్మించాం. మూలంలోని గుర్తింపు నిర్మాణాన్ని తెలుగులో సహజంగా వినిపించేందుకు విధేయ భాగాన్ని ముందుంచాం. ప్రధాన పాఠ్యంలో ఉన్న ప్రతి పాదటిప్పణి సూచిక సంబంధిత పదబంధం వెంట ఇవ్వబడింది.
