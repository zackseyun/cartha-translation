review_pass:
  verdict: revise
  source_fidelity: The draft conveys the narrative movement, early-morning setting, refusal to enter, ritual concern, and the deliberately open expression ‘eat the Passover.’ However, ‘అధిపతి కార్యాలయం’ can suggest merely an office and does not adequately convey πραιτώριον as the Roman governor’s official headquarters/residence and judicial setting.
  naturalness: The Telugu is generally natural and appropriately formal. Reordering the final sentence slightly makes the purpose relationship more direct while preserving the Greek emphasis that those who brought Jesus did not themselves enter.
  terminology: ‘కయప,’ ‘యేసు,’ ‘పస్కా,’ and ‘ఆచారపరంగా అపవిత్రులు’ are suitable. ‘రోమా పాలకుని ప్రధాన కార్యాలయం’ more accurately and clearly represents πραιτώριον than the generic ‘అధిపతి కార్యాలయం.’
  issues:
  - severity: medium
    issue: The rendering of πραιτώριον is too narrow.
    rationale: ‘అధిపతి కార్యాలయం’ normally denotes an office; πραιτώριον here denotes the Roman governor’s official headquarters, with residential and judicial associations. The revised wording retains readable Telugu while reflecting that official setting.
  - severity: low
    issue: The main text does not identify the official connected with the headquarters.
    rationale: The source-context meaning is specifically the Roman governor’s headquarters. Adding ‘రోమా పాలకుని’ prevents an overly generic reading without adding interpretive detail.
