id: JHN.18.28
reference: John 18:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: te
  text: అప్పుడు వారు యేసును కయప దగ్గర నుండి రోమా పాలకుని ప్రధాన కార్యాలయానికి[a] తీసుకువెళ్లారు. అది తెల్లవారుజాము. తాము ఆచారపరంగా అపవిత్రులు కాకుండా[b], పస్కాను భుజించగలిగేలా[c] ఉండడానికి వారు ఆ కార్యాలయంలోకి ప్రవేశించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రైటోరియం’; ఇది రోమా పాలకుని అధికారిక నివాసం మరియు న్యాయపరిపాలనా కేంద్రం.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆచారపరంగా అపవిత్రులు’ కావడం అంటే మతాచార నియమాల ప్రకారం అశుద్ధులుగా పరిగణించబడడం.
    reason: cultural_note
  - marker: c
    text: ‘పస్కాను భుజించడం’ అనేది ప్రత్యేకంగా పస్కా భోజనాన్ని లేదా మరింత విస్తృతంగా పస్కా పండుగకాలంలోని భోజనాలు, ఆచరణలను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: తీసుకువెళ్లారు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు కథనశైలికి సహజమైన భూతకాలంలో ఇచ్చాం; నిర్బంధంలో ఉన్న యేసును ఒక చోటు నుండి మరొక చోటుకు నడిపించిన భావాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: అప్పుడు
  rationale: ఇది కథన కొనసాగింపును సూచిస్తుంది. సందర్భంలో ‘అప్పుడు’ సహజంగా ఉండి, అనవసరమైన తార్కిక నిర్ధారణ భావాన్ని మోపదు.
- source_word: πραιτώριον
  choice: అధిపతి కార్యాలయం
  rationale: రోమా అధిపతి అధికార నివాసం, న్యాయపరిపాలనా కేంద్రం అనే సందర్భార్థాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా అనువదించాం; ‘ప్రైటోరియం’ అనే రూపాన్ని పాదసూచనలో ఉంచాం.
- source_word: πρωΐ
  choice: తెల్లవారుజాము
  rationale: రోజు ప్రారంభంలోని చాలా తొలివేళను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; ఖచ్చితంగా సూర్యోదయ క్షణమే అని నిర్ధారించదు.
- source_word: αὐτοὶ
  choice: తాము
  rationale: మూలంలోని ఉద్ఘాటనను, యేసును లోపలికి తీసుకువెళ్లిన వారే తాము మాత్రం ప్రవేశించకపోవడంలోని వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: εἰσῆλθον
  choice: ప్రవేశించలేదు
  rationale: కార్యాలయం లోపలికి వెళ్లకపోవడాన్ని స్పష్టంగా, గౌరవప్రదమైన కథనశైలిలో వ్యక్తం చేస్తుంది.
- source_word: μιανθῶσιν
  choice: ఆచారపరంగా అపవిత్రులు కాకుండా
  rationale: ఇక్కడ ఉద్దేశించినది సాధారణ మురికి లేదా నైతిక కలుషితం కాదు, మతాచార సంబంధమైన అపవిత్రత. ప్రధాన పాఠ్యంలో ఈ భావాన్ని స్పష్టం చేశాం.
- source_word: φάγωσιν τὸ πάσχα
  choice: పస్కాను భుజించగలిగేలా
  rationale: ‘పస్కాను భుజించడం’ అనే మూలభాషా వ్యక్తీకరణను నిలిపి, అది ప్రత్యేక పస్కా భోజనాన్నా లేక పండుగకాల భోజనాలు లేదా ఆచరణలను విస్తృతంగా సూచిస్తుందా అనే సందిగ్ధతను పరిష్కరించకుండా ఉంచాం.
- source_word: Καϊάφα
  choice: కయప
  rationale: ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా వ్యక్తినామాన్ని లిప్యంతరీకరించాం.
- source_word: Ἰησοῦν
  choice: యేసు
  rationale: తెలుగులో స్థిరపడిన ప్రామాణిక నామరూపాన్ని ఉపయోగించాం.
theological_decisions:
- issue: యోహాను సువార్తలోని సంఘటనల కాలక్రమానికి సంబంధించి ‘పస్కాను భుజించడం’ అనే మాట యొక్క పరిధి
  choice: ‘పస్కాను భుజించగలిగేలా’ అనే మూలానికి సమీపమైన, పరిధిని నిర్దిష్టం చేయని రూపాన్ని ఉంచడం
  alternative: ‘పస్కా భోజనం భుజించగలిగేలా’ లేదా ‘పస్కా పండుగ భోజనాలు చేయగలిగేలా’ అని నిర్దిష్టీకరించడం
  rationale: ఈ పదబంధం ప్రత్యేక పస్కా భోజనాన్ని మాత్రమే సూచిస్తుందా, లేక పస్కా పండుగకాలంలోని భోజనాలు లేదా ఆచరణలను విస్తృతంగా సూచిస్తుందా అనేది చర్చనీయాంశం. ప్రధాన పాఠ్యం ఆ కాలక్రమ సంబంధమైన ఉద్రిక్తతను పరిష్కరించకుండా మూలంలోని విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘భుజించు’ అనే సాంప్రదాయికమైనా ఇప్పటికీ సులభంగా అర్థమయ్యే పదాన్ని పస్కా సందర్భ గాంభీర్యానికి అనుగుణంగా ఉంచాం. ప్రతి పాదసూచన సూచిక ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంది.
