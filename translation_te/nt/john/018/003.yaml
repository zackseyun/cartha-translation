revisions:
- from: కాబట్టి యూదా సైనిక దళాన్ని[a], అలాగే ప్రధాన యాజకుల దగ్గరనుండి, పరిసయ్యుల దగ్గరనుండి అధికార సేవకులను[b] వెంటబెట్టుకొని, దీపాలు, కాగడాలు, ఆయుధాలతో అక్కడికి వస్తాడు.
  to: కాబట్టి యూదా సైనిక దళాన్నీ[a], ప్రధాన యాజకుల నుండీ పరిసయ్యుల నుండీ వచ్చిన కావలివారినీ[b] వెంటబెట్టుకొని, లాంతర్లు, కాగడాలు, ఆయుధాలతో అక్కడికి వస్తాడు.
  rationale: 'The revision preserves the Greek participial sequence and historical present while making the two components of the arresting party clear: a military detachment and official guards/attendants from the chief priests and Pharisees. It avoids implying either that the whole cohort was present or that the guards’ exact institutional designation is certain.'
