source:
  edition: SBLGNT
  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: te
  text: కాబట్టి యూదా సైనిక దళాన్నీ[a], ప్రధాన యాజకుల నుండీ పరిసయ్యుల నుండీ వచ్చిన కావలివారినీ[b] వెంటబెట్టుకొని, లాంతర్లు, కాగడాలు, ఆయుధాలతో అక్కడికి వస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సైనిక దళం’కు గ్రీకులో ఉన్న పదాన్ని ‘కోహోర్టు’ లేదా ‘సైనికుల బృందం’ అని కూడా అనువదించవచ్చు. ఇది ఒక సైనిక విభాగాన్ని సూచించవచ్చు; ఆ విభాగమంతా అక్కడ ఉన్నదని తప్పనిసరిగా అర్థం కాదు.
    reason: lexical_alternative
  - marker: b
    text: ‘కావలివారు’కు గ్రీకులో ఉన్న పదాన్ని ‘అధికారిక సహాయకులు’ లేదా ‘ఆలయ రక్షక భటులు’ అని కూడా అనువదించవచ్చు. వీరు ప్రధాన యాజకులు, పరిసయ్యుల కోసం అధికారిక విధులు నిర్వహించే పరిచారకులు లేదా కాపలాదారులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భంతో ఉన్న కథన సంబంధాన్ని, స్వల్ప నిర్ధారణ భావాన్ని నిలుపుతుంది.
- source_word: λαβὼν
  choice: వెంటబెట్టుకొని
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను సహజమైన తెలుగు అసమాపక క్రియతో తెలియజేస్తుంది; ఇక్కడ వ్యక్తులను ‘తీసుకొని’ రావడమనే భావం.
- source_word: σπεῖραν
  choice: సైనిక దళాన్ని
  rationale: సైనిక విభాగాన్ని సూచిస్తుంది; మొత్తం రోమా కోహోర్టు తప్పనిసరిగా వచ్చిందని చెప్పకుండా మూలపదపు సైనిక భావాన్ని నిలుపుతుంది.
- source_word: ὑπηρέτας
  choice: అధికార సేవకులను
  rationale: యూదా అధికారుల ఆధీనంలో అధికారిక విధులు నిర్వహించే పరిచారకులు లేదా కావలివారిని సూచించే విస్తృత పదబంధం.
- source_word: ἀρχιερέων
  choice: ప్రధాన యాజకుల
  rationale: యాజక నాయకత్వ వర్గాన్ని సూచించే ప్రామాణిక ఆధునిక తెలుగు రూపం.
- source_word: Φαρισαίων
  choice: పరిసయ్యుల
  rationale: ఆ వర్గనామానికి స్థిరపడిన తెలుగు రూపం.
- source_word: ἔρχεται
  choice: వస్తాడు
  rationale: యోహాను ఉపయోగించిన కథన వర్తమాన కాలపు సజీవతను నిలుపుతుంది.
- source_word: ἐκεῖ
  choice: అక్కడికి
  rationale: ముందు ప్రస్తావించిన స్థలాన్ని సహజంగా సూచిస్తుంది.
- source_word: φανῶν
  choice: దీపాలు
  rationale: మోసుకెళ్లగల వెలుగు సాధనాలను సూచిస్తూ, తరువాతి ‘కాగడాలు’తో తేడాను నిలుపుతుంది.
- source_word: λαμπάδων
  choice: కాగడాలు
  rationale: బహిరంగంగా మంటతో వెలిగే చేతి వెలుగులను స్పష్టంగా సూచిస్తుంది.
- source_word: ὅπλων
  choice: ఆయుధాలు
  rationale: సాయుధ బలానికి ఉపయోగించే సాధనాలనే సాధారణ మూలభావాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసును పట్టుకోవడానికి వచ్చిన బృందపు స్వరూపం, కూర్పు
  choice: σπεῖραను ‘సైనిక దళం’గా, ὑπηρέταιను ‘అధికార సేవకులు’గా అనువదించి రెండు వేరు వర్గాలు ఉన్నట్లు చూపడం.
  alternative: ‘సైనికుల బృందం, కావలివారు’ అని మరింత సాధారణంగా అనువదించడం; లేదా σπεῖραను ‘కోహోర్టు’గా లిప్యంతరీకరించడం.
  rationale: మూలవాక్యం సైనిక దళంతోపాటు ప్రధాన యాజకులు, పరిసయ్యుల అధికార సేవకులనూ వేరుగా పేర్కొంటుంది. అయితే పూర్తి రోమా కోహోర్టు సంఖ్య అంతా అక్కడ ఉందని వాక్యం నిర్బంధంగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘వస్తాడు’ అనే కథన వర్తమానాన్ని ఉద్దేశపూర్వకంగా నిలిపాం. ‘దీపాలు, కాగడాలు’ అని రెండు వేరు వెలుగు సాధనాలను పేర్కొని గ్రీకు పదజంటలోని తేడాను కాపాడాం.
