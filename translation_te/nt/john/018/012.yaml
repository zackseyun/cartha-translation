id: JHN.18.12
reference: John 18:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἡ οὖν σπεῖρα καὶ ὁ χιλίαρχος καὶ οἱ ὑπηρέται τῶν Ἰουδαίων συνέλαβον τὸν Ἰησοῦν καὶ ἔδησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: te
  text: కాబట్టి సైనిక దళం, దాని అధిపతి, యూదుల[a] అధికారులు యేసును పట్టుకొని కట్టివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భానుసారం, “యూద నాయకుల అధికారులు” లేదా “యూదయుల అధికారులు.” యోహాను సువార్తలో “యూదులు” అనే పదం తరచుగా యూద ప్రజలందరినీ కాక, ఒక నిర్దిష్ట వర్గాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: ముందటి సంఘటనకు కొనసాగింపును సూచించే సహజమైన తెలుగు కథన సంధానం; గ్రీకులోని నిర్ధారణ ఛాయను అతిగా చూపదు.
- source_word: σπεῖρα
  choice: సైనిక దళం
  rationale: నిర్దిష్ట సైనిక విభాగాన్ని సూచిస్తుంది; 'కోహోర్టు' కంటే సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది, అలాగే మూలంలో ప్రత్యక్షంగా లేని 'రోమా' అనే విశేషణాన్ని చేర్చదు.
- source_word: χιλίαρχος
  choice: దాని అధిపతి
  rationale: ఆ సైనిక దళానికి నాయకత్వం వహించే అధికారిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సాంకేతిక హోదాను అతిగా నిర్దిష్టం చేయదు.
- source_word: ὑπηρέται
  choice: అధికారులు
  rationale: ఈ సందర్భంలో గృహసేవకులు కాక, పట్టుకునే పనిలో ఉన్న అధికారిక పరిచారకులు లేదా సిబ్బందిని సూచిస్తుంది; 'దేవాలయ కాపలాదారులు' అని మూలాన్ని మించి నిర్దిష్టం చేయదు.
- source_word: τῶν Ἰουδαίων
  choice: యూదుల
  rationale: గ్రీకు షష్ఠీ విభక్తి పదబంధాన్ని పారదర్శకంగా నిలుపుతుంది; యోహాను సువార్తలో సందర్భానుసారం మరింత పరిమిత వర్గాన్ని సూచించే అవకాశాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: συνέλαβον
  choice: పట్టుకొని
  rationale: బలంగా అదుపులోకి తీసుకోవడం అనే భావాన్ని సహజంగా ఇస్తుంది; న్యాయపరమైన విధానాన్ని సూచించే 'అరెస్టు చేసి' కంటే మూలానికి సమీపంగా ఉంటుంది.
- source_word: ἔδησαν
  choice: బంధించారు
  rationale: కట్టివేయడం అనే మూలక్రియను గౌరవప్రదమైన కథన శైలిలో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో τῶν Ἰουδαίων అనే పదబంధం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘యూదుల’ అని మూలానికి దగ్గరగా అనువదించడం.
  alternative: ‘యూదా నాయకుల’ లేదా సందర్భానుసారం ‘యూదయుల’ అని అనువదించడం.
  rationale: ఈ వచనం స్వయంగా నాయకులు అని నిర్దిష్టంగా చెప్పదు. అందువల్ల విస్తృత యూద ప్రజలందరిపై నింద మోపకుండా, యోహాను వాడుకలోని సందర్భసంబంధ పరిమితిని పాదసూచికలో చూపుతూ మూలంలోని నిజమైన అర్థసందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. సైనిక పదజాలాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచి, మూలంలో లేని చారిత్రక వివరాలను చేర్చలేదు.
