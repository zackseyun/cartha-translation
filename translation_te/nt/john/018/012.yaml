revisions:
- from: అప్పుడు సైనిక దళం, దాని అధిపతి, యూదుల[a] అధికారులు యేసును పట్టుకొని బంధించారు.
  to: కాబట్టి సైనిక దళం, దాని అధిపతి, యూదుల[a] అధికారులు యేసును పట్టుకొని కట్టివేశారు.
  rationale: The revision retains the source’s ambiguity concerning τῶν Ἰουδαίων and does not identify the detachment as Roman or the officers as temple police. It improves the rendering of the connective οὖν, explicitly represents the binding action of ἔδησαν, and corrects the footnote alternative so that it is natural Telugu and refers accurately to the full construction.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:31:23Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the military detachment, its commander, the attendants/officers associated with the Jews, and the two actions of seizing and binding Jesus. However, “అప్పుడు” weakens οὖν’s connective/inferential force, and “బంధించారు” can be understood more broadly as imprisoning rather than specifically tying/binding.
  naturalness: The wording is generally clear and modern. “పట్టుకొని కట్టివేశారు” is more idiomatic and explicitly conveys the physical binding in the Greek. “కాబట్టి” suitably carries the narrative connection without excessive formality.
  terminology: “సైనిక దళం,” “అధిపతి,” and “అధికారులు” are appropriate non-over-specified renderings. The footnote’s “యూదా నాయకుల” is not suitable here, since it can mean leaders of Judah; “యూద నాయకుల అధికారులు” correctly expresses the proposed contextual alternative in this clause.
  issues:
  - severity: low
    issue: οὖν is rendered as “అప్పుడు.”
    rationale: While possible in narration, it does not preserve the connective force as well as “కాబట్టి” in this immediate consequence of the preceding scene.
  - severity: medium
    issue: “బంధించారు” is potentially broader than ἔδησαν.
    rationale: The Greek specifically says that they bound/tied him. “కట్టివేశారు” makes that physical action unambiguous.
  - severity: medium
    issue: The footnote’s alternative “యూదా నాయకుల” is semantically and grammatically imprecise.
    rationale: It may be read as ‘leaders of Judah’ rather than the contextual sense ‘officers of the Jewish leaders.’ The alternative should correspond to the full phrase in the verse.
  revised_text: కాబట్టి సైనిక దళం, దాని అధిపతి, యూదుల[a] అధికారులు యేసును పట్టుకొని కట్టివేశారు.
  revised_footnotes:
  - marker: a
    text: లేదా, సందర్భానుసారం, “యూద నాయకుల అధికారులు” లేదా “యూదయుల అధికారులు.” యోహాను సువార్తలో “యూదులు” అనే పదం తరచుగా యూద ప్రజలందరినీ కాక, ఒక నిర్దిష్ట వర్గాన్ని సూచిస్తుంది.
    reason: alternative_reading
  revision_rationale: The revision retains the source’s ambiguity concerning τῶν Ἰουδαίων and does not identify the detachment as Roman or the officers as temple police. It improves the rendering of the connective οὖν, explicitly represents the binding action of ἔδησαν, and corrects the footnote alternative so that it is natural Telugu and refers accurately to the full construction.
