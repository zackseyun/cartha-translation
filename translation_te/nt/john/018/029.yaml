id: JHN.18.29
reference: John 18:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Πιλᾶτος ⸀ἔξω πρὸς αὐτοὺς καὶ ⸀φησίν· Τίνα κατηγορίαν φέρετε ⸀κατὰ τοῦ ἀνθρώπου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: te
  text: కాబట్టి పిలాతు బయటికి వారి దగ్గరికి వెళ్లి, “ఈ మనిషి మీద మీరు ఏ నేరారోపణ మోపుతున్నారు?” అని అడిగాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν … ἔξω
  choice: బయటికి … వెళ్లి
  rationale: ἐξέρχομαιలోని బయటకు కదలికను ἔξω మరింత స్పష్టం చేస్తుంది. తెలుగు సహజ శైలిలో రెండింటి భావాన్ని కలిపి ‘బయటికి వెళ్లి’ అని అనువదించాం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భం వల్ల పిలాతు బయటికి రావాల్సి వచ్చిన కారణసంబంధాన్ని నిలుపుతుంది; ‘అప్పుడు’ కూడా సాధ్యమే, కాని ఇక్కడ అనుమితి భావం స్పష్టంగా ఉంది.
- source_word: πρὸς αὐτούς
  choice: వారి దగ్గరికి
  rationale: πρός + accusative వ్యక్తుల వైపు వెళ్లి వారిని కలుసుకోవడాన్ని సూచిస్తుంది. ‘వారి దగ్గరికి’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: φησίν
  choice: అని అడిగాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా తెలుగు కథనంలో భూతకాలం సహజం. పలికినది ప్రశ్న కాబట్టి ‘అడిగాడు’ సందర్భోచితం.
- source_word: Τίνα κατηγορίαν
  choice: ఏ నేరారోపణ
  rationale: κατηγορία న్యాయపరమైన ఆరోపణను సూచిస్తుంది. ‘నేరారోపణ’ దాని న్యాయసంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: φέρετε
  choice: మోపుతున్నారు
  rationale: న్యాయసందర్భంలో φέρω ఆరోపణను తీసుకురావడం లేదా సమర్పించడం అనే భావం కలిగి ఉంది. తెలుగులో ‘ఆరోపణ మోపడం’ సహజమైన న్యాయప్రయోగం.
- source_word: κατὰ τοῦ ἀνθρώπου τούτου
  choice: ఈ మనిషి మీద
  rationale: κατά + genitive ఇక్కడ ‘వ్యతిరేకంగా/మీద’ అనే న్యాయార్థాన్ని ఇస్తుంది; ἄνθρωπος ఈ సందర్భంలో ఒక పురుషుణ్ణి సూచిస్తున్నందున ‘ఈ మనిషి’ అని ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయపరమైన భాషను ఉపయోగించాం. గ్రీకు వాక్య నిర్మాణాన్ని యాంత్రికంగా అనుకరించకుండా దాని స్థల, కథన, న్యాయ భావాలను నిలిపాం.
