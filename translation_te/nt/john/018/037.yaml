id: JHN.18.37
reference: John 18:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: te
  text: అప్పుడు పిలాతు ఆయనతో, “అయితే నీవు రాజువా?” అన్నాడు. యేసు, “నేను రాజునని నీవు అంటున్నావు.[a] ఇందుకోసమే నేను పుట్టాను; ఇందుకోసమే లోకంలోకి వచ్చాను—సత్యానికి సాక్ష్యమివ్వడానికి. సత్యానికి చెందిన ప్రతి ఒక్కరూ నా స్వరం వింటారు” అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “నీవు అంటున్నావు: నేను రాజును,” లేదా “నేను రాజునని నీవు సరిగానే అంటున్నావు.” గ్రీకు వాక్యం సంక్షిప్తంగా ఉంది; అది కొంత పరిమితితో కూడిన అంగీకారంగా వినిపించవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκοῦν
  choice: అయితే
  rationale: ముందటి సంభాషణనుంచి పిలాతు తీసుకున్న నిర్ధారణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: βασιλεὺς
  choice: రాజు
  rationale: రోమా విచారణ సందర్భంలోని రాజకీయ భావాన్ని, అలాగే మెస్సీయ సంబంధిత అంతర్భావాన్ని వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: నేను రాజునని నీవు అంటున్నావు
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తతను, అది పరిమిత అంగీకారంగా వినిపించే అవకాశాన్ని నిలుపుతూ, స్పష్టమైన అంగీకారంగా గానీ నిరాకరణగా గానీ మార్చదు.
- source_word: γεγέννημαι
  choice: నేను పుట్టాను
  rationale: తెలుగులో సహజంగా ఉండే రూపం; యేసు జననాన్ని సూచిస్తుంది, ఈ సందర్భం కోరని ‘కనబడ్డాను’ వంటి సిద్ధాంతార్థ పదాన్ని చేర్చదు.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: లోకంలోకి వచ్చాను
  rationale: యోహాను రచనలోని కార్యనియోగం, మూలం అనే అంతర్భావాలకు చోటిస్తూ κόσμοςను ‘లోకం’గా నిలుపుతుంది.
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: సత్యానికి సాక్ష్యమివ్వడానికి
  rationale: ἵνα సూచించే ఉద్దేశాన్ని సహజంగా వ్యక్తం చేస్తూ, యోహాను రచనలోని న్యాయసాక్ష్య భాషను కాపాడుతుంది.
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: సత్యానికి చెందిన ప్రతి ఒక్కరూ
  rationale: ἐκ సూచించే మూలం లేదా సంబంధ భావాన్ని తెలుగులో అర్థమయ్యే రీతిలో వ్యక్తం చేస్తుంది; కేవలం నిజం మాట్లాడేవారిగా అర్థాన్ని కుదించదు.
- source_word: ἀκούει μου τῆς φωνῆς
  choice: నా స్వరం వింటారు
  rationale: ‘స్వరం’ అనే యోహాను సంబంధిత ప్రతిధ్వనిని నిలుపుతూ, వినడం మరియు స్పందించి ఆలకించడం రెండింటికీ తెలుగులో చోటిస్తుంది.
theological_decisions:
- issue: పిలాతుకు యేసు ఇచ్చిన జవాబులోని భావఛాయ (Σὺ λέγεις ὅτι βασιλεύς εἰμι)
  choice: ‘నేను రాజునని నీవు అంటున్నావు’ అనే పారదర్శకమైన, పరిమిత అంగీకారానికి వీలిచ్చే అనువాదం
  alternative: ‘నీవు చెప్పింది నిజమే—నేను రాజును’ అనే బలమైన అంగీకారం; లేదా ‘అది నీ మాట’ అనే దూరం పాటించే జవాబు
  rationale: గ్రీకు వాక్యం ఈ భావఛాయల్లో ఒకదాన్ని పూర్తిగా నిర్బంధించదు. కాబట్టి ప్రధాన పాఠం అంగీకారం లేదా నిరాకరణను అతిగా నిర్ణయించకుండా అసలు వాక్యంలోని ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ‘పుట్టాను’ మరియు ‘లోకంలోకి వచ్చాను’ అనే యేసు కార్యనియోగ భాష
  choice: రెండు వాక్యభాగాలను వేరువేరుగా నిలుపడం
  alternative: రెండింటినీ కలిపి ఒకే కార్యనియోగ ప్రకటనగా వ్యాఖ్యానించడం
  rationale: యోహాను పాఠం యేసు పుట్టడాన్ని, లోకంలోకి రావడాన్ని వేరుగా చెబుతుంది. అవతార సంబంధిత అంతర్భావానికి చోటిస్తూ, పాఠానికి మించిన సిద్ధాంత వివరణను చేర్చకుండా రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. సంభాషణలో ‘నీవు’ రూపాన్ని వాడి బైబిలు వచనానికి తగిన గంభీరతను ఉంచాం; అనవసరమైన అతి గౌరవార్థక రూపాలు లేదా పాత పదప్రయోగాలు వాడలేదు.
