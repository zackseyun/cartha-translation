id: JHN.18.34
reference: John 18:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· ⸂Ἀπὸ σεαυτοῦ⸃ σὺ τοῦτο λέγεις ἢ ἄλλοι ⸂εἶπόν σοι⸃ περὶ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: te
  text: 'యేసు ఇలా జవాబిచ్చాడు: “నువ్వు నీంతట నీవే ఈ మాట అంటున్నావా? లేక ఇతరులు నా గురించి నీకు చెప్పారా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ఇలా జవాబిచ్చాడు
  rationale: సంభాషణలో ప్రశ్నకు ప్రతిస్పందనను తెలిపే సాధారణ కథన క్రియ; ‘ఇలా’ ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: Ἀπὸ σεαυτοῦ
  choice: నీంతట నీవే
  rationale: ἀπόతో కూడిన ఆత్మవాచక సర్వనామం మాటకు మూలం పిలాతేనా అని ప్రశ్నిస్తుంది. ఆధునిక తెలుగులో ‘నీంతట నీవే’ ఆ మూలభావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: σὺ
  choice: నీవే
  rationale: గ్రీకులోని స్పష్టమైన కర్త సర్వనామానికి ఉన్న ఉద్ఘాటనను ‘నీవే’ నిలుపుతుంది.
- source_word: τοῦτο λέγεις
  choice: ఈ మాట అంటున్నావా
  rationale: ముందటి ప్రశ్నను సూచించే τοῦτοను తెలుగులో సహజంగా ‘ఈ మాట’ అని, వర్తమాన λέγειςను ‘అంటున్నావా’ అని ఇచ్చాం.
- source_word: ἢ ἄλλοι εἶπόν σοι
  choice: లేక ఇతరులు నీకు చెప్పారా
  rationale: రెండవ ప్రత్యామ్నాయాన్ని ‘లేక’ స్పష్టంగా చూపుతుంది; అఒరిస్ట్ క్రియను సందర్భానుకూలమైన పూర్తయిన చర్యగా ‘చెప్పారా’ అని అనువదించాం.
- source_word: περὶ ἐμοῦ
  choice: నా గురించి
  rationale: περί + షష్ఠీ విభక్తి ఇక్కడ ‘గురించి’ అనే అర్థాన్నిస్తుంది.
theological_decisions:
- issue: పిలాతు మాటకు మూలం గురించి యేసు వేసిన ప్రశ్న
  choice: పిలాతు స్వయంగా ఈ మాట అంటున్నాడా, లేక ఇతరుల నుంచి విన్నాడా అనే రెండు అవకాశాలను మాత్రమే వ్యక్తపరచడం
  alternative: ‘నీ సొంత చొరవతో అడుగుతున్నావా?’ అని ఉద్దేశం లేదా ప్రేరణను మరింత వివరణాత్మకంగా చెప్పడం
  rationale: గ్రీకు వాక్యం ప్రధానంగా ఆ మాట ఎక్కడి నుంచి వచ్చిందనే విషయాన్ని ప్రశ్నిస్తుంది. పిలాతు ఉద్దేశాన్ని లేదా విస్తృతమైన ధార్మిక అర్థాన్ని అనువాదంలో చేర్చకుండా అసలు ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. ‘నువ్వు/నీకు’ రూపాలు ఏకవచన ప్రత్యక్ష సంభాషణకు అనుగుణంగా ఉన్నాయి; ‘నీంతట నీవే’ గ్రీకు మూలార్థాన్నీ ఉద్ఘాటననూ కాపాడుతుంది.
