  text: ὡς οὖν εἶπεν ⸀αὐτοῖς· Ἐγώ εἰμι, ἀπῆλθον εἰς τὰ ὀπίσω καὶ ἔπεσαν χαμαί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: te
  text: కాబట్టి ఆయన వారితో, “నేనే[a]” అని చెప్పగానే, వారు వెనక్కి వెళ్లి నేలమీద పడిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “నేను ఉన్నాను.” ఈ గ్రీకు వ్యక్తీకరణ యోహాను సువార్తలోని ప్రత్యేకమైన “నేను ఉన్నాను” వాక్యాలను కూడా ప్రతిధ్వనింపజేయవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς οὖν
  choice: కాబట్టి … చెప్పగానే
  rationale: οὖν లోని కథనానుసంధాన భావాన్ని ‘కాబట్టి’తో, ὡς లోని కాలసంబంధ భావాన్ని ‘చెప్పగానే’తో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἶπεν αὐτοῖς
  choice: ఆయన వారితో … అని చెప్పగానే
  rationale: λέγω మరియు పరోక్ష కర్మ αὐτοῖς ను నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: Ἐγώ εἰμι
  choice: నేనే ఆయనను
  rationale: వారు వెదుకుతున్న వ్యక్తి తానేనని యేసు గుర్తింపుచేసుకునే తక్షణ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘నేనే’ అనే బలప్రయోగం Ἐγώ యొక్క ఉద్ఘాటనను నిలుపుతుంది. మరింత అక్షరార్థమైన రూపాన్ని పాదసూచికలో ఉంచి యోహాను సువార్తలోని సంభావ్య ప్రతిధ్వనిని కాపాడాం.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: వెనక్కి వెళ్లి
  rationale: వెనుక దిశగా కదలడాన్ని మూలపాఠానికి దగ్గరగా, సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἔπεσαν χαμαί
  choice: నేలమీద పడిపోయారు
  rationale: χαμαί సూచించే నేలపై పడటాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోహాను సందర్భంలో Ἐγώ εἰμι యొక్క స్వీయగుర్తింపు మరియు సంభావ్య దైవశాస్త్రీయ ప్రతిధ్వని
  choice: ప్రధాన పాఠంలో ‘నేనే ఆయనను’
  alternative: ‘నేను ఉన్నాను’
  rationale: తక్షణ సంభాషణ సందర్భం స్వీయగుర్తింపును సూచిస్తుంది; అయితే Ἐγώ εἰμι అనే అక్షరార్థ రూపానికి యోహాను సువార్తలో ప్రత్యేక ప్రతిధ్వని ఉండవచ్చు. అందువల్ల ఆ ఉద్రిక్తతను తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గంభీరమైన కథనశైలిని నిలిపింది. పాదసూచిక సూచికను సంబంధిత ఉక్తి వెంట ఉంచింది.
