  yaml_path: translation/nt/john/018/027.yaml
  text: Then Peter denied it again[a], and immediately a rooster crowed.
translation:
  language: te
  text: అప్పుడు పేతురు మళ్లీ నిరాకరించాడు[a]; వెంటనే కోడిపుంజు కూసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అప్పుడు పేతురు మళ్లీ దానిని నిరాకరించాడు.” గ్రీకు పాఠంలో కర్మను స్పష్టంగా చెప్పలేదు; ముందున్న ప్రశ్న సందర్భం దానిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: మళ్లీ
  rationale: పేతురు చేసిన నిరాకరణ పునరావృతమైందని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὖν
  choice: అప్పుడు
  rationale: మునుపటి ప్రశ్నకు ఈ నిరాకరణను అనుసంధానిస్తూ కథన క్రమాన్ని సహజంగా చూపిస్తుంది; బలమైన కారణార్థాన్ని రుద్దదు.
- source_word: ἠρνήσατο
  choice: దాన్ని నిరాకరించాడు
  rationale: గ్రీకులో కర్మ స్పష్టంగా లేకపోయినా, ముందున్న ప్రశ్న సందర్భం దాన్ని అందిస్తుంది. తెలుగులో సహజత కోసం ‘దాన్ని’ చేర్చబడింది; ఈ అంతర్నిహిత కర్మను పాదసూచికలో స్పష్టం చేశాం.
- source_word: Πέτρος
  choice: పేతురు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: καὶ
  choice: వెంటనే అనే తదుపరి వాక్యంతో అనుసంధానం
  rationale: గ్రీకు సంధి రెండు సంఘటనలను కలుపుతుంది. తెలుగులో చిన్న వాక్య విభజనతోనూ వాటి తక్షణ అనుసంధానం నిలిచింది.
- source_word: εὐθέως
  choice: వెంటనే
  rationale: నిరాకరణ తర్వాత కోడి కూయడం తక్షణమే జరిగిందనే కాలబలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀλέκτωρ
  choice: కోడి
  rationale: ఇక్కడ కూసే మగ కోడిని సూచిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘కోడి కూసింది’ సహజమైన ప్రయోగం.
- source_word: ἐφώνησεν
  choice: కూసింది
  rationale: కోడి ధ్వనిని తెలిపే సందర్భోచితమైన తెలుగు క్రియ.
