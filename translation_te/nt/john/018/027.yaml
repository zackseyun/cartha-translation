revisions:
- from: అప్పుడు పేతురు మళ్లీ దాన్ని నిరాకరించాడు[a]. వెంటనే కోడి కూసింది.
  to: అప్పుడు పేతురు మళ్లీ నిరాకరించాడు[a]; వెంటనే కోడిపుంజు కూసింది.
  rationale: The revision retains the Greek's unexpressed object in the main text and places the contextually supplied-object rendering in the footnote. It also renders ἀλέκτωρ specifically as “కోడిపుంజు.” The semicolon naturally joins the denial and the immediately following event while retaining the force of καὶ and εὐθέως.
