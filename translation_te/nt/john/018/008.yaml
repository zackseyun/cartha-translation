id: JHN.18.8
reference: John 18:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: te
  text: 'యేసు జవాబిచ్చాడు: “నేనేనని మీతో చెప్పాను.[a] కాబట్టి మీరు నన్నే వెదుకుతున్నట్లయితే, వీరిని వెళ్లనివ్వండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఉన్నాను.” గ్రీకులో ‘అతడే’ వంటి విధేయపదం లేదు; గుర్తింపు సందర్భంలో ప్రధాన పాఠంలోని ‘నేనే’ సహజమైన అర్థాన్ని తెలియజేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: సంభాషణలో ἀποκρίνομαιకు సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపం.
- source_word: Εἶπον ὑμῖν
  choice: మీతో చెప్పాను
  rationale: ముందు పలికిన మాటను వారికి గుర్తుచేస్తున్న భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐγώ εἰμι
  choice: నేనే
  rationale: ఈ గుర్తింపు సందర్భంలో ‘నేనే’ సహజంగా ‘మీరు వెదుకుతున్న వ్యక్తిని నేనే’ అనే భావాన్ని ఇస్తుంది; గ్రీకులో విధేయపదం లేకపోవడం, ‘నేను ఉన్నాను’ అనే సాధ్యమైన ప్రతిధ్వని పాదసూచికలో నిలుపబడింది.
- source_word: ζητεῖτε
  choice: వెదుకుతున్నది
  rationale: ప్రస్తుత సందర్భంలో కొనసాగుతున్న అన్వేషణను తెలిపే సహజమైన తెలుగు ప్రయోగం; వాక్య నిర్మాణంలో నన్నే అనే కర్మకు అనుగుణంగా నపుంసక ఏకవచన క్రియారూపం వాడబడింది.
- source_word: ἄφετε
  choice: వెళ్లనివ్వండి
  rationale: అనుమతించండి అనే భావాన్ని, నిర్బంధం నుంచి అధికారికంగా విడుదల చేయడం అనే అదనపు అర్థం చేర్చకుండా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: τούτους
  choice: వీరిని
  rationale: యేసుతో ఉన్నవారిని సూచించే గౌరవప్రదమైన, సహజమైన సర్వనామం.
- source_word: ὑπάγειν
  choice: వెళ్ల
  rationale: అక్కడి నుంచి వెళ్లడానికి అనుమతించాలనే మూల భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: యోహాను సందర్భంలో ἐγώ εἰμι అనువాదం
  choice: నేనే
  alternative: నేను ఉన్నాను
  rationale: తక్షణ సందర్భంలో ఇది యేసు తనను వెదుకుతున్న వ్యక్తిగా గుర్తించుకోవడం. అయితే యోహాను సువార్తలోని సంపూర్ణ ἐγώ εἰμι ప్రయోగానికి ఉండగల దైవశాస్త్రీయ ప్రతిధ్వనిని తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. ‘నేనే’ ద్వారా తక్షణ గుర్తింపు భావం స్పష్టమవుతుంది; పాదసూచిక ద్వారా మూలంలోని సంక్షిప్తత, సాధ్యమైన దైవశాస్త్రీయ ఉద్వేగం నిలుపబడింది.
