source:
  edition: SBLGNT
  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: te
  text: అప్పుడు ఆయన మళ్లీ వారిని అడిగాడు, “మీరు ఎవరిని వెదుకుతున్నారు?” వారు, “నజరేయుడైన యేసును[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నజరేతుకు చెందిన యేసును.” గ్రీకులో, “నజరేయుడైన యేసును.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: మళ్లీ
  rationale: మునుపటి ప్రశ్నను తిరిగి అడిగినట్లు తెలిపే సహజమైన, సంక్షిప్తమైన తెలుగు పదం.
- source_word: οὖν
  choice: అప్పుడు
  rationale: ఇక్కడ ఇది కఠినమైన తార్కిక నిర్ధారణకన్నా ముందటి సంఘటనను అనుసరించే కథన ప్రవాహాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఆ సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐπηρώτησεν αὐτούς
  choice: వారిని … అడిగాడు
  rationale: ప్రత్యక్షంగా ప్రశ్నించడాన్ని, అలాగే బహువచన కర్మను స్పష్టంగా తెలిపే సహజ తెలుగు నిర్మాణం.
- source_word: Τίνα ζητεῖτε
  choice: మీరు ఎవరిని వెదుకుతున్నారు?
  rationale: Τίνα అనే కర్మరూపాన్ని ‘ఎవరిని’తో స్పష్టంగా నిలుపుతూ, ζητεῖτε యొక్క వర్తమాన చర్యను ‘వెదుకుతున్నారు’గా అనువదించింది.
- source_word: οἱ δὲ εἶπαν
  choice: వారు … అన్నారు
  rationale: δέ ఇక్కడ ప్రధానంగా సంభాషణలో తదుపరి మాటను పరిచయం చేస్తుంది; తెలుగులో ప్రత్యేక సంధాయకం లేకుండానే కథన ప్రవాహం సహజంగా ఉంటుంది.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: నజరేయుడైన యేసు
  rationale: వ్యక్తినామాన్ని సాధారణ తెలుగు రూపంలో ఇచ్చి, Ναζωραῖος‌ను ఊరితో సంబంధం గల గుర్తింపు విశేషణంగా నిలిపింది.
theological_decisions:
- issue: Ναζωραῖος అనే యేసు గుర్తింపు పదం
  choice: నజరేయుడైన యేసు
  alternative: నజరేతుకు చెందిన యేసు
  rationale: ఇది ఇక్కడ సిద్ధాంతపరమైన బిరుదుగా కాక చారిత్రక/భౌగోళిక గుర్తింపుగా పనిచేస్తుంది. ‘నజరేయుడైన’ గ్రీకు పదరూపానికి దగ్గరగా ఉండగా, ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచడం ద్వారా అనవసరమైన వ్యాఖ్యానాన్ని నివారించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సంభాషణా శైలిని, గౌరవప్రదమైన కథన స్వరాన్ని ఉపయోగించింది. మూలంలోని పునరుక్తి, ప్రశ్న–జవాబు నిర్మాణం, నజరేయుడు అనే గుర్తింపును నిలిపింది.
