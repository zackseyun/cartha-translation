source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ εἰπόντος εἷς ⸂παρεστηκὼς τῶν ὑπηρετῶν⸃ ἔδωκεν ῥάπισμα τῷ Ἰησοῦ εἰπών· Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: te
  text: ఆయన ఈ మాటలు చెప్పినప్పుడు, అక్కడ నిలబడి ఉన్న అధికారిక పరిచారకులలో ఒకడు[a] చేతితో యేసును ఒక దెబ్బ కొట్టి[b], “ప్రధాన యాజకునికి ఇలాగే జవాబు చెబుతావా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అధికారిక పరిచారకులు” అని అనువదించిన గ్రీకు పదానికి “పరిచారకులు,” “సేవకులు,” లేదా “అధికారులు” అనే అర్థాలు కూడా ఉండవచ్చు; ఈ సందర్భంలో అది ప్రధాన యాజక వర్గానికి చెందిన అధికారిక సిబ్బందిని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడి గ్రీకు ప్రయోగం చేతితో ఇచ్చిన దెబ్బను సూచిస్తుంది; అది చెంపదెబ్బ లేదా అలాంటి మరొక దెబ్బ కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ఈ మాటలు
  rationale: బహువచన సూచనను నిలుపుతూ, యేసు అంతకుముందు పలికిన మాటలను సహజంగా సూచిస్తుంది.
- source_word: αὐτοῦ εἰπόντος
  choice: ఆయన ... చెప్పినప్పుడు
  rationale: కర్తరి భూతకాల కృదంతంతో ఉన్న genitive absolute‌ను సహజమైన కాలవాచక ఉపవాక్యంగా అనువదించింది.
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: దగ్గర నిలబడి ఉన్న అధికార సిబ్బందిలో ఒకడు
  rationale: παρεστηκώς‌లోని అక్కడ నిలిచి ఉండటం అనే భావాన్ని, ὑπηρέται అనే అధికారిక పరిచారకులు లేదా సేవకుల సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔδωκεν ῥάπισμα
  choice: కొట్టి
  rationale: చేతితో ఇచ్చే దెబ్బ లేదా చెంపదెబ్బ అనే భావాన్ని కలిగిన గ్రీకు ప్రయోగాన్ని, దెబ్బ యొక్క ఖచ్చిత రూపాన్ని అనవసరంగా నిర్ణయించకుండా తెలిపింది.
- source_word: Οὕτως ἀποκρίνῃ
  choice: ఇలాగే జవాబు చెబుతావా?
  rationale: οὕτως సూచించే విధానాన్ని మరియు ప్రశ్నలోని మందలింపు స్వరాన్ని సహజంగా నిలుపుతుంది.
- source_word: τῷ ἀρχιερεῖ
  choice: ప్రధాన యాజకునికి
  rationale: ఈ సందర్భంలో ἀρχιερεύς‌కు ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదబంధం.
theological_decisions:
- issue: ὑπηρετῶν అనే పదంతో సూచించబడినవారి గుర్తింపు
  choice: అధికార సిబ్బంది
  alternative: పరిచారకులు లేదా సేవకులు
  rationale: యోహాను సువార్తలోని విచారణ సందర్భంలో ఈ పదం ప్రధాన యాజక వర్గానికి చెందిన అధికారిక సిబ్బందిని సూచించే అవకాశం ఎక్కువ. అయినప్పటికీ పదంలోని విస్తృత భావపరిధిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. సంభాషణలోని మందలింపు స్వరాన్ని కాపాడుతూ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం.
