- from: ఆయన ఈ మాటలు చెప్పినప్పుడు, దగ్గర నిలబడి ఉన్న అధికార సిబ్బందిలో ఒకడు[a] యేసును కొట్టి[b], “ప్రధాన యాజకునికి ఇలాగే జవాబు చెబుతావా?” అన్నాడు.
