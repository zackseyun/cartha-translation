id: JHN.18.16
reference: John 18:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: te
  text: అయితే పేతురు బయట ద్వారం దగ్గర నిలబడి ఉన్నాడు. కాబట్టి ప్రధాన యాజకునికి తెలిసినవాడైన[a] ఆ మరో శిష్యుడు బయటికి వెళ్లి, ద్వారపాలకురాలితో[b] మాట్లాడి, పేతురును లోపలికి తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రధాన యాజకునికి పరిచయస్థుడైన.’ ఆ సంబంధం ఎంత సన్నిహితమైనదో గ్రీకు పాఠం నిర్దిష్టంగా చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ప్రవేశద్వారం కాపలాదారైన స్త్రీతో.’ ఈ గ్రీకు పదం ప్రవేశద్వారం వద్ద నియమించబడిన వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: నిలబడి ఉన్నాడు
  rationale: ఈ క్రియారూపం పేతురు అక్కడ కొనసాగుతూ ఉన్న స్థితిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నిలబడి ఉన్నాడు’ ఆ కొనసాగుతున్న స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: బయట ద్వారం దగ్గర
  rationale: πρός మరియు ἔξω తెలిపే ప్రవేశద్వారం సమీపంలోని బాహ్య స్థానాన్ని రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: ఆ మరో శిష్యుడు
  rationale: యోహాను సువార్త కథనంలో μαθητήςకు ‘శిష్యుడు’ స్థిరమైన, సంబంధాత్మక భావాన్ని నిలిపే అనువాదం; ‘ఆ’ అనేది ముందే ప్రస్తావించబడిన వ్యక్తిని సహజంగా సూచిస్తుంది.
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: ప్రధాన యాజకునికి తెలిసినవాడైన
  rationale: γνωστός సూచించే పరిచయపు స్థాయి ఎంతన్నది గ్రీకు పాఠం నిర్దిష్టం చేయదు; ఈ రూపం ఆ అనిశ్చితిని నిలుపుతుంది.
- source_word: ἀρχιερεύς
  choice: ప్రధాన యాజకుడు
  rationale: యూదుల అత్యున్నత యాజక పదవికి ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: θυρωρῷ
  choice: ద్వారపాలకురాలు
  rationale: పదం ప్రవేశద్వారం వద్ద కాపలా ఉండే వ్యక్తిని సూచిస్తుంది; గ్రీకులోని స్త్రీలింగ రూపాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἶπεν τῇ θυρωρῷ
  choice: ద్వారపాలకురాలితో మాట్లాడి
  rationale: ప్రత్యక్షంగా పలికిన మాటలు ఇవ్వబడలేదు కాబట్టి ‘మాట్లాడి’ అనేది సహజంగా చర్యను తెలియజేస్తుంది.
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: పేతురును లోపలికి తీసుకొచ్చాడు
  rationale: εἰσάγωలోని లోపలికి తీసుకురావడం అనే దిశాత్మక భావాన్ని సహజ తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని, గౌరవప్రదమైన ధోరణిని పాటించాం. సంబంధపు సన్నిహితత్వాన్ని అతిగా నిర్దిష్టం చేయకుండా, గ్రీకులో స్పష్టంగా ఉన్న ద్వారపాలకురాలి స్త్రీలింగాన్ని నిలిపాం.
