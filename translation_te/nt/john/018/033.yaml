id: JHN.18.33
reference: John 18:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰσῆλθεν οὖν ⸂πάλιν εἰς τὸ πραιτώριον⸃ ὁ Πιλᾶτος καὶ ἐφώνησεν τὸν Ἰησοῦν καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: te
  text: కాబట్టి పిలాతు తిరిగి గవర్నరు ప్రధాన కార్యాలయంలోకి[a] వెళ్లి, యేసును పిలిచి ఆయనతో, “నీవు యూదుల[b] రాజువా?” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రైటోరియంలోకి”; ఇది రోమా గవర్నరు అధికారిక నివాసం లేదా ప్రధాన కార్యాలయం.
    reason: lexical_alternative
  - marker: b
    text: “యూదుల” అనే గ్రీకు పదాన్ని “యూదయవాసుల” అని కూడా అనువదించవచ్చు. అది సాధారణంగా యూదులను గానీ, కొన్ని సందర్భాల్లో యూదయ ప్రాంత ప్రజలను గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν … πάλιν
  choice: తిరిగి … వెళ్లి
  rationale: కదలికతో కూడిన πάλιν పునఃప్రవేశాన్ని సూచిస్తుంది; సహజమైన ఆధునిక తెలుగులో ‘తిరిగి … వెళ్లి’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: οὖν
  choice: అప్పుడు
  rationale: ఇక్కడ οὖν కథన పురోగతిని సూచిస్తుంది; ‘అప్పుడు’ సహజంగా ముందరి సంఘటనతో అనుసంధానిస్తుంది.
- source_word: πραιτώριον
  choice: అధిపతి కార్యస్థలం
  rationale: రోమా అధిపతి అధికారిక నివాసం లేదా ప్రధాన కార్యస్థలాన్ని సూచించే పదం. ‘ప్రైటోరియం’ కంటే ఇది సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది; ప్రత్యామ్నాయ సాంకేతిక పదాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἐφώνησεν
  choice: పిలిపించి
  rationale: ఈ సందర్భంలో φωνέω ఒకరిని తన దగ్గరకు పిలవడం అనే భావం ఇస్తుంది. ‘పిలిపించి’ అధికారిక సందర్భానికి సరిపోతూ, అతిశయంగా బలమైన ‘ఆజ్ఞాపించి రప్పించి’ అనే భావాన్ని నివారిస్తుంది.
- source_word: εἶπεν αὐτῷ
  choice: ఆయనతో … అని అన్నాడు
  rationale: గ్రీకు పాఠంలోని సాధారణ ‘చెప్పాడు/అన్నాడు’ అనే క్రియను నిలుపుతుంది; ఉల్లేఖనంలోని ప్రశ్నార్థక రూపమే ప్రశ్న భావాన్ని తెలియజేస్తుంది.
- source_word: Σὺ εἶ
  choice: నీవు … వా?
  rationale: తెలుగు ప్రశ్న నిర్మాణం సహజంగా ఉండేలా చేస్తూ, ప్రత్యక్షంగా ‘నీవు’ అని ఉంచడం ద్వారా గ్రీకులోని స్పష్టమైన σύ సర్వనామానికి ఉన్న దృష్టిని నిలుపుతుంది.
- source_word: ὁ βασιλεὺς
  choice: రాజు
  rationale: నిర్దిష్ట రాజపదవిని సూచిస్తుంది. తెలుగులో ఆంగ్లంలా శీర్షికలకు పెద్ద అక్షర భేదం లేదు.
- source_word: τῶν Ἰουδαίων
  choice: యూదుల
  rationale: విచారణలోని రోమా రాజకీయ ఆరోపణ సందర్భంలో స్థిరంగా వినిపించే ‘యూదుల రాజు’ సరిపోతుంది; ‘యూదయవాసుల’ అనే భౌగోళిక అర్థసంభావ్యతను పాదటిప్పణిలో నిలుపుతున్నాం.
theological_decisions:
- issue: రాజబిరుదులో Ἰουδαίων అనువాదం
  choice: యూదుల
  alternative: యూదయవాసుల
  rationale: పిలాతు ఎదుట ఉంచబడిన రాజకీయ ఆరోపణ సందర్భంలో ‘యూదుల రాజు’ చారిత్రకంగా, సందర్భానుగుణంగా సరిపోతుంది. అయినా Ἰουδαῖοι కొన్ని సందర్భాల్లో యూదయ ప్రాంత ప్రజలను సూచించగలదు కాబట్టి ఆ అర్థాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన కథన శైలి. సాంకేతిక రోమా పదాన్ని ప్రధాన పాఠంలో వివరణాత్మకంగా అనువదించి, సంప్రదాయ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
