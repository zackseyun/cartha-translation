  verdict: revise
  source_fidelity: మూల గ్రీకు వాక్యంలోని οὖν, πάλιν, εἰσῆλθεν, πραιτώριον, ἐφώνησεν, అలాగే ‘యూదుల రాజు’ అనే ప్రశ్నార్థక నిర్మాణం అన్నీ సవరించిన పాఠంలో నిలిచాయి. ‘పిలిపించి’ తెలుగులో సాధారణంగా మరొకరి చేత పిలువజేయడం అనే కారణార్థాన్ని ఇవ్వగలదు; ἐφώνησενకు సరిపోయే ప్రత్యక్ష క్రియ ‘పిలిచి’గా సవరించబడింది.
