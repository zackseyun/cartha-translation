revisions:
- from: పిలాతు ఆయనతో, “సత్యం అంటే ఏమిటి?” అన్నాడు. ఇలా అన్న తర్వాత, అతడు మళ్లీ బయటికి యూదుల[a] దగ్గరకు వెళ్లి వారితో, “ఇతనిపై ఏ నేరారోపణా నాకు కనిపించడం లేదు” అన్నాడు.
  to: పిలాతు ఆయనతో, “సత్యం అంటే ఏమిటి?” అన్నాడు. ఇలా అన్న తర్వాత, అతడు మళ్లీ బయటికి యూదుల[a] వద్దకు వెళ్లి వారితో, “ఆయనపై ఎలాంటి అభియోగమూ నాకు కనిపించడం లేదు” అన్నాడు.
  rationale: 'The revision clarifies the judicial force of αἰτία with “అభియోగం,” while avoiding the possible implication that no accusation was voiced. It also makes two limited stylistic improvements: formal “వద్దకు” and consistent honorific reference to Jesus. The main-text rendering “యూదులు” and its contextual footnote are retained to preserve the Greek term and its ambiguity.'
