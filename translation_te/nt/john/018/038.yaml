source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: te
  text: పిలాతు ఆయనతో, “సత్యం అంటే ఏమిటి?” అన్నాడు. ఇలా అన్న తర్వాత, అతడు మళ్లీ బయటికి యూదుల[a] వద్దకు వెళ్లి వారితో, “ఆయనపై ఎలాంటి అభియోగమూ నాకు కనిపించడం లేదు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదుల నాయకుల వద్దకు.” యోహాను సువార్తలో “యూదులు” అనే పదం కొన్నిసార్లు సందర్భానుసారంగా యూదయ అధికారులను లేదా అక్కడ యేసును వ్యతిరేకిస్తున్న ప్రతినిధి వర్గాన్ని మరింత ప్రత్యేకంగా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: పిలాతు ఆయనతో … అన్నాడు
  rationale: గ్రీకులోని λέγει చారిత్రక వర్తమాన కాలం. తెలుగు కథన శైలిలో సహజంగా భూతకాలమైన ‘అన్నాడు’ అని అనువదించబడింది. యేసును సూచించే సర్వనామానికి గౌరవార్థక రూపం వాడబడింది.
- source_word: Τί ἐστιν ἀλήθεια;
  choice: సత్యం అంటే ఏమిటి?
  rationale: ἀλήθειαకు నిర్దేశక ఉపపదం లేదు. ‘సత్యం అంటే ఏమిటి?’ అనే రూపం గ్రీకులోని సాధారణమైన లేదా తాత్త్వికమైన ప్రశ్నను సహజ తెలుగులో నిలుపుతుంది.
- source_word: Καὶ τοῦτο εἰπὼν
  choice: ఇలా అన్న తర్వాత
  rationale: ఎయోరిస్ట్ కృదంతం εἰπών సూచించే ముందుగా జరిగిన చర్యను స్పష్టమైన, సహజమైన కాలవాచక ఉపవాక్యంగా ఇచ్చింది.
- source_word: πάλιν ἐξῆλθεν
  choice: మళ్లీ బయటికి … వెళ్లి
  rationale: πάλιν చర్య పునరావృతమైందని, ἐξῆλθεν లోపలి స్థలం నుంచి బయటికి వెళ్లడాన్ని సూచిస్తాయి; రెండూ తెలుగులో స్పష్టంగా నిలుపబడ్డాయి.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: యూదుల[a] దగ్గరకు
  rationale: ప్రధాన పాఠ్యంలో Ἰουδαίους అనే జాతి/సమూహ పదానికి నేరుగా సరిపడే ‘యూదులు’ నిలుపబడింది. ఈ సందర్భంలో అది యూదుల నాయకులను లేదా యేసును వ్యతిరేకిస్తున్న ప్రతినిధి వర్గాన్ని సూచించవచ్చనే భావాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
- source_word: καὶ λέγει αὐτοῖς
  choice: వారితో … అన్నాడు
  rationale: చారిత్రక వర్తమానమైన λέγειను సహజ తెలుగు కథన భూతకాలంలో ఇచ్చి, αὐτοῖςను ‘వారితో’గా వ్యక్తం చేసింది.
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: ఇతనిపై ఏ నేరారోపణా నాకు కనిపించడం లేదు
  rationale: న్యాయవిచారణ సందర్భంలో αἰτία ఆరోపణ లేదా నేరాభియోగాన్ని సూచిస్తుంది. ‘నేరారోపణ’ ఆ న్యాయపరమైన భావాన్ని నిలుపుతుంది; ἐν αὐτῷను తెలుగులో సహజంగా ‘ఇతనిపై’ అని ఇచ్చింది.
theological_decisions:
- issue: యోహాను సువార్తలోని శ్రమవృత్తాంతంలో Ἰουδαίοις ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘యూదులు’; సందర్భానుసారమైన పరిమిత భావాన్ని పాదటిప్పణిలో ఇవ్వడం
  alternative: ‘యూదుల నాయకులు’ లేదా ‘యూదయవాసులు’
  rationale: మూలపదానికి పారదర్శకత కోసం ‘యూదులు’ ప్రధాన పాఠ్యంలో నిలుపబడింది. అయితే ఈ సందర్భంలో ఈ పదం యూదు ప్రజలందరినీ కాకుండా అక్కడ ఉన్న అధికారులను లేదా యేసును వ్యతిరేకించిన ప్రతినిధి వర్గాన్ని సూచించే అవకాశం ఉంది. ఆ అనిశ్చితిని పాదటిప్పణి ద్వారా నిలుపుతూ, అనవసరంగా మొత్తం జాతికి వర్తింపజేయడాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘సత్యం అంటే ఏమిటి?’ సాధారణ పాఠకునికి సులభంగా అర్థమవుతూనే మూలంలోని తాత్త్విక విస్తృతిని నిలుపుతుంది. ‘నేరారోపణ’ న్యాయవిచారణ సందర్భాన్ని స్పష్టం చేస్తుంది.
