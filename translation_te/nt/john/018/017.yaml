id: JHN.18.17
reference: John 18:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει οὖν ⸂τῷ Πέτρῳ ἡ παιδίσκη ἡ θυρωρός⸃· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν εἶ τοῦ ἀνθρώπου τούτου; λέγει ἐκεῖνος· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: te
  text: అప్పుడు తలుపు కాపలా కాస్తున్న పనిపిల్ల పేతురుతో[a], “నువ్వు కూడా ఈ మనిషి శిష్యుల్లో ఒకడివి కావు కదా?” అని అడిగింది. అతడు, “నేను కాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ద్వారపాలకురాలైన బానిస బాలిక.”
    reason: παιδίσκη సేవకురాలు లేదా బానిస బాలిక అనే అర్థం కలిగి ఉండవచ్చు; θυρωρόςను ‘ద్వారపాలకురాలు’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి పరిణామాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; సందర్భంలో ఇది కఠినమైన తార్కిక ‘కాబట్టి’ కంటే కథన అనుసంధానం.
- source_word: παιδίσκη
  choice: పనిపిల్ల
  rationale: యువ స్త్రీ సేవకురాలిని సూచించే పదం. సందర్భంలో ఆమె వయస్సు, సేవాపాత్ర ముందుంటాయి; బానిస స్థితిని ప్రధాన పాఠ్యంలో నిర్బంధంగా నిర్ణయించదు.
- source_word: θυρωρός
  choice: తలుపు కాపలా కాస్తున్న
  rationale: ప్రవేశద్వారాన్ని చూసుకునే ఆమె పనిని సహజమైన వివరణాత్మక పదబంధంతో తెలియజేస్తుంది.
- source_word: Μὴ καὶ σὺ
  choice: నువ్వు కూడా ... కావు కదా?
  rationale: μήతో మొదలైన ప్రశ్న ప్రతికూల సమాధానాన్ని ఊహిస్తుందనే భావాన్ని తెలుగు ప్రశ్నాంతమైన ‘కావు కదా?’ సహజంగా నిలుపుతుంది.
- source_word: ἐκ τῶν μαθητῶν
  choice: శిష్యుల్లో ఒకడివి
  rationale: ఒక సమూహంలో సభ్యత్వాన్ని తెలిపే ἐκ యొక్క విభాగార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: ఈ మనిషి
  rationale: ἄνθρωποςను బిరుదుగా కాక సాధారణ ‘మనిషి’గా అనువదిస్తూ, τούτουలోని కొంత దూరంగా మాట్లాడే ధోరణిని నిలుపుతుంది.
- source_word: ἐκεῖνος
  choice: అతడు
  rationale: సందర్భంలో పేతురును తిరిగి సూచిస్తుంది; తెలుగు కథనంలో సహజమైన సర్వనామం.
- source_word: Οὐκ εἰμί
  choice: నేను కాను
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తమైన, ప్రత్యక్ష నిరాకరణను అదనపు వివరణ లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: μήతో ప్రవేశపెట్టిన ప్రతికూల ప్రశ్న బలం
  choice: “నువ్వు కూడా ... కావు కదా?” అని, ప్రతికూల సమాధానాన్ని ఊహించే ప్రశ్నగా అనువదించడం
  alternative: “నువ్వు కూడా ... వాడివా?” అనే తటస్థ ప్రశ్నగా అనువదించడం
  rationale: ఇది సిద్ధాంత నిర్ణయం కంటే వ్యాకరణ-సంభాషణ నిర్ణయం. ‘కావు కదా?’ గ్రీకులో ప్రశ్నకర్త ఆశించే ప్రతికూల జవాబును అతిశయోక్తి లేకుండా తెలియజేస్తుంది.
- issue: παιδίσκη సూచించే సామాజిక స్థితి
  choice: ప్రధాన పాఠ్యంలో “పనిపిల్ల”
  alternative: “బానిస బాలిక” లేదా “దాసి”
  rationale: ఈ పదం సేవకురాలు లేదా బానిస బాలికను సూచించగలదు. ఇక్కడ ఆమె ద్వారపాలక పాత్ర ప్రధానమైనందున ‘పనిపిల్ల’ను ఎంచుకొని, సాధ్యమైన బానిస స్థితిని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన కథన శైలి. ప్రశ్నలోని ప్రతికూల నిరీక్షణను ‘కావు కదా?’తోను, పేతురు జవాబులోని సంక్షిప్తతను ‘నేను కాను’తోను నిలిపాం.
