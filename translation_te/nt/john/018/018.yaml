translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ‘బానిసలు’ మరియు ‘అధికార సేవకులు’ మధ్య మూలపాఠంలోని సామాజిక, సంస్థాగత భేదం నిలుపబడింది. మూలంలో లేని ‘అక్కడ’ను చేర్చలేదు.
