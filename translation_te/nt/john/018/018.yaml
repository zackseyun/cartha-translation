id: JHN.18.18
reference: John 18:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἱστήκεισαν δὲ οἱ δοῦλοι καὶ οἱ ὑπηρέται ἀνθρακιὰν πεποιηκότες, ὅτι ψῦχος ἦν, καὶ ἐθερμαίνοντο· ἦν δὲ ⸂καὶ ὁ Πέτρος μετ’ αὐτῶν⸃ ἑστὼς καὶ θερμαινόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: te
  text: బానిసలూ అధికార సేవకులూ చలిగా ఉన్నందున బొగ్గుల మంట వేసుకొని, నిలబడి చలి కాచుకుంటున్నారు. పేతురు కూడా వారితో నిలబడి చలి కాచుకుంటున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλοι
  choice: బానిసలు
  rationale: ఈ పదం సేవకులను కూడా సూచించగలిగినా, ఈ సందర్భంలో ప్రధాన యాజకుని ఇంటికి చెందిన బంధిత గృహసిబ్బంది సామాజిక స్థితిని ‘బానిసలు’ స్పష్టంగా నిలుపుతుంది.
- source_word: ὑπηρέται
  choice: అధికార సేవకులు
  rationale: యోహాను వాడుకలో ఇది అధికార వ్యవస్థకు చెందిన, అమలు బాధ్యతలున్న పరిచారకులను సూచిస్తుంది. ‘అధికార సేవకులు’ వారి సంస్థాగత పాత్రను చూపుతూ, ‘కాపలాదారులు’ అనే మరింత నిర్దిష్ట అర్థాన్ని రుద్దదు.
- source_word: ἀνθρακιὰν
  choice: బొగ్గుల మంట
  rationale: ఇది ప్రత్యేకంగా charcoal fireను సూచిస్తుంది; సహజమైన తెలుగులో ‘బొగ్గుల మంట’ ఆ స్పష్టమైన కథన వివరాన్ని నిలుపుతుంది.
- source_word: πεποιηκότες
  choice: వేసుకొని
  rationale: మంటను ముందే చేసి, దాని కొనసాగుతున్న ఫలితంగా వారు దాని దగ్గర నిలబడ్డారనే సంపూర్ణ క్రియాభావాన్ని సహజమైన తెలుగు సంయుక్త క్రియ తెలియజేస్తుంది.
- source_word: ὅτι ψῦχος ἦν
  choice: చలిగా ఉన్నందున
  rationale: మంట వేయడానికి, చలి కాచుకోవడానికి గల కారణాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐθερμαίνοντο
  choice: చలి కాచుకుంటున్నారు
  rationale: తెలుగులో మంట దగ్గర తమను తాము వెచ్చబరచుకోవడాన్ని సహజంగా తెలిపే ప్రయోగం; అసంపూర్ణ కాలంలోని కొనసాగుతున్న చర్యను కూడా నిలుపుతుంది.
- source_word: ἦν δὲ καὶ ὁ Πέτρος μετ’ αὐτῶν
  choice: పేతురు కూడా వారితో
  rationale: καί లోని కూడిక భావాన్ని ‘కూడా’తో, μετ’ αὐτῶν లోని సహవాసాన్ని ‘వారితో’తో ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: ἑστὼς
  choice: నిలబడి
  rationale: పేతురు ఉన్న భంగిమను సహజమైన తెలుగు క్రియారూపంతో తెలియజేస్తుంది.
- source_word: θερμαινόμενος
  choice: చలి కాచుకుంటున్నాడు
  rationale: పేతురు కొనసాగిస్తూ చేస్తున్న చర్యను, ముందటి బహువచన క్రియకు సమాంతరంగా వ్యక్తం చేస్తుంది.
- source_word: δέ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానకారి మాత్రమే. తెలుగులో వాక్యక్రమమే ఆ అనుసంధానాన్ని సహజంగా అందిస్తుంది; ‘అప్పుడు’ లేదా బలమైన ‘కాని’ని చేర్చడం మూలంలో లేని భావాన్ని కలిగించవచ్చు.
