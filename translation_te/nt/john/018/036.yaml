id: JHN.18.36
reference: John 18:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: te
  text: 'యేసు ఇలా జవాబిచ్చాడు: “నా రాజ్యం ఈ లోకం నుండి వచ్చినది కాదు. నా రాజ్యం ఈ లోకం నుండి వచ్చినదైతే, నేను యూదులకు[a] అప్పగించబడకుండా ఉండేలా నా సేవకులు పోరాడుతూ ఉండేవారు. కాని వాస్తవానికి నా రాజ్యం ఇక్కడి నుండి వచ్చినది కాదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదయులకు”; ఇక్కడ మరింత ప్రత్యేకంగా యూదయ అధికారులను సూచిస్తూ ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεία
  choice: రాజ్యం
  rationale: ఇక్కడ రాజు పరిపాలననూ దాని పరిధినీ సూచించగల స్థిరమైన, సహజమైన తెలుగు పదం; వాక్యంలో పునరుక్తికి కూడా అనుకూలంగా ఉంది.
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: ఈ లోకం నుండి వచ్చినది
  rationale: ἐκ సూచించే మూలం లేదా ఆవిర్భావ భావాన్ని స్పష్టంగా నిలుపుతుంది; రాజ్యం లోకంలో లేదని కాక, దాని మూలం ఈ లోకం కాదని తెలియజేస్తుంది.
- source_word: κόσμος
  choice: లోకం
  rationale: యోహాను రచనలో దేవునికి విరోధంగా ఉన్న ప్రస్తుత మానవ వ్యవస్థ అనే ఛాయ ఉండగలిగినా, దానిని అతివివరణ చేయకుండా నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: ὑπηρέται
  choice: సేవకులు
  rationale: అధికారానికి లోబడి సేవచేసేవారిని సూచిస్తుంది; ‘అధికారులు’ లేదా ‘భటులు’ అని ప్రత్యేక సంస్థాగత అర్థాన్ని అనవసరంగా చేర్చదు.
- source_word: ἠγωνίζοντο ἄν
  choice: పోరాడుతూ ఉండేవారు
  rationale: అవాస్తవ షరతులోని imperfect క్రియ సూచించే కొనసాగుతున్న ఊహాత్మక చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα μὴ παραδοθῶ
  choice: నేను ... అప్పగించబడకుండా ఉండేలా
  rationale: ప్రయోజనార్థక భావాన్ని, అలాగే παραδίδωμι లోని నిర్బంధ లేదా న్యాయపరమైన అప్పగింత భావాన్ని నిలుపుతుంది.
- source_word: τοῖς Ἰουδαίοις
  choice: యూదులకు
  rationale: గ్రీకు పదానికి నేరమైన విస్తృత అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ఈ సందర్భంలో యూదయవారిని లేదా యూదయ అధికారులను ప్రత్యేకంగా సూచించే అవకాశం పాదటిప్పణిలో తెలియజేయబడింది.
- source_word: νῦν δὲ
  choice: కాని వాస్తవానికి
  rationale: ముందున్న అవాస్తవ ఊహకు విరుద్ధంగా ప్రస్తుతం ఉన్న నిజస్థితిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐντεῦθεν
  choice: ఇక్కడి నుండి
  rationale: ‘ఇక్కడి నుండి’ అనే స్థలసూచక, మూలసూచక భావాన్ని నిలుపుతూ, ముందున్న ‘ఈ లోకం నుండి’ అనే పదబంధాన్ని యథాతథంగా పునరావృతం చేయదు.
theological_decisions:
- issue: యేసు రాజ్యానికి లోకంతో ఉన్న సంబంధం
  choice: ‘ఈ లోకం నుండి వచ్చినది కాదు’ అని మూలం/ఆవిర్భావాన్ని సూచించేలా అనువదించడం
  alternative: ‘ఈ లోకానికి చెందినది కాదు’ లేదా ‘ఈ లోకంలో భాగం కాదు’
  rationale: ఈ వాక్యం రాజ్యం లోకంలో ఉనికిలో లేదని చెప్పడం కంటే, దాని మూలం మరియు స్వభావం లోకవ్యవస్థ నుండి రావని ప్రధానంగా చెబుతుంది; అందువల్ల లోక వాస్తవికత నుండి పూర్తిగా వేరుపడటం అనే భావాన్ని అనువాదం ద్వారా రుద్దలేదు.
- issue: యోహాను సువార్తలో Ἰουδαῖοι పదానికి సూచన
  choice: ప్రధాన పాఠ్యంలో ‘యూదులు’; పాదటిప్పణిలో సందర్భానుసారమైన సంకుచిత అర్థం
  alternative: ‘యూదయవారు’ లేదా ‘యూదయ అధికారులు’
  rationale: మూలపదంలోని విస్తృత జాతి/మత సూచనను నిలుపుతూనే, ఈ కథన సందర్భంలో అది యూదయవారిని, మరింత ప్రత్యేకంగా యూదయ అధికారులను సూచించే అవకాశాన్ని పాఠకునికి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ἐκ అనే మూలసూచక భావాన్ని సహజ తెలుగులో స్పష్టంచేయడానికి ‘నుండి వచ్చినది’ వాడబడింది; ఊహాత్మక నిరంతర చర్యకు ‘పోరాడుతూ ఉండేవారు’ ఉపయోగించబడింది.
