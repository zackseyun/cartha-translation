id: JHN.18.11
reference: John 18:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: te
  text: 'అప్పుడు యేసు పేతురుతో ఇలా అన్నాడు: “కత్తిని దాని ఒరలో పెట్టు[a]. తండ్రి నాకు ఇచ్చిన పాత్రను నేను దానిని తాగకూడదా[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఒర’ అంటే కత్తిని పెట్టే తొడుగు; దీనిని ‘కత్తి తొడుగు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: '‘పాత్ర’ అనేది దేవుడు నియమించిన శ్రమ లేదా గమ్యాన్ని సూచించే బైబిలు రూపకం. గెత్సేమనేలో యేసు చేసిన ప్రార్థనతో పోల్చండి: మత్తయి 26:39; మార్కు 14:36; లూకా 22:42.'
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: అందుకు
  rationale: కథనంలోని ముందరి చర్యకు యేసు స్పందిస్తున్నాడనే అనుసంధానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Βάλε
  choice: పెట్టు
  rationale: ఈ సందర్భంలో βάλλω అనే ఆజ్ఞ కత్తిని తిరిగి ఒరలో ఉంచడాన్ని సూచిస్తుంది; ‘పెట్టు’ సహజమైన, స్పష్టమైన తెలుగు.
- source_word: μάχαιραν
  choice: కత్తి
  rationale: μάχαιρα ఒక పదునైన ఆయుధాన్ని సూచిస్తుంది. దాని పరిమాణాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా సాధారణంగా అర్థమయ్యే ‘కత్తి’ని వాడింది.
- source_word: θήκην
  choice: ఒర
  rationale: కత్తిని ఉంచే sheath/scabbard అనే నిర్దిష్ట అర్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ποτήριον
  choice: పాత్ర
  rationale: దేవుడు నియమించిన శ్రమ లేదా గతిని సూచించే మూలపాఠంలోని రూపకాన్ని వివరణగా మార్చకుండా నిలుపుతుంది.
- source_word: δέδωκέν
  choice: ఇచ్చిన
  rationale: తెలుగు సంబంధవాచక నిర్మాణంలో పూర్తయి ప్రస్తుతం వర్తించే క్రియను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ πατήρ
  choice: తండ్రి
  rationale: మూలంలో స్వామ్యసూచక సర్వనామం లేకపోవడంతో ‘నా తండ్రి’ అని చేర్చకుండా యోహాను వాడుకను నిలుపుతుంది.
- source_word: οὐ μὴ πίω αὐτό;
  choice: నేను తాగకుండా ఉంటానా?
  rationale: సందర్భంలో ‘తప్పకుండా తాగుతాను’ అనే సమాధానాన్ని ఆశించే బలమైన అలంకారప్రశ్నను సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ‘పాత్ర’ అనే రూపకం యొక్క అర్థం
  choice: ప్రధాన పాఠంలో ‘పాత్ర’ అనే రూపకాన్నే నిలిపి, దేవుడు నియమించిన శ్రమ లేదా గతిని పాదసూచికలో సంక్షిప్తంగా సూచించడం.
  alternative: ‘శ్రమ’, ‘మరణం’, ‘సిలువ’, లేదా ‘దైవిక ఉగ్రత’ అని ప్రధాన పాఠంలో స్పష్టీకరించడం.
  rationale: సందర్భం నియమించబడిన శ్రమను సూచించినా, ఈ వాక్యం ఆ పాత్రను మరింత సంకుచితమైన సిద్ధాంత పదంతో నిర్వచించదు. రూపకాన్ని నిలపడం మూలపాఠంలోని భావగాంభీర్యాన్నీ ఉద్రిక్తతనూ కాపాడుతుంది.
- issue: తండ్రి ఇచ్చిన పాత్రకు యేసు చూపే విధేయత
  choice: తండ్రి ఇచ్చిన పాత్రను తాగేందుకు యేసు సిద్ధంగా ఉన్నాడనే భావాన్ని అలంకారప్రశ్నగా నేరుగా అనువదించడం.
  alternative: ‘తండ్రి నాకు అప్పగించిన కార్యాన్ని నేను నెరవేర్చకూడదా?’ అని వివరణాత్మకంగా మార్చడం.
  rationale: మూలపాఠం కుమారుని స్వచ్ఛంద విధేయతను రూపకం మరియు అలంకారప్రశ్న ద్వారా వ్యక్తం చేస్తుంది; అదనపు సిద్ధాంత వివరణ లేకుండా అదే రూపాన్ని నిలపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘పాత్ర’ అనే బైబిలు రూపకాన్ని అలాగే ఉంచి, సాధారణ పాఠకునికి అవసరమైన వివరణను పాదసూచికలో ఇచ్చింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠంలో సంబంధిత పదబంధం దగ్గర ఉంచబడింది.
