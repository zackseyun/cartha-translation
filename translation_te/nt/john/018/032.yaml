id: JHN.18.32
reference: John 18:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: te
  text: యేసు తాను ఎలాంటి విధమైన మరణంతో మరణించబోతున్నాడో సూచిస్తూ చెప్పిన మాట[a] నెరవేరేలా ఇది జరిగింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యేసు చెప్పిన వాక్యం.’
    reason: lexical_alternative
  - marker: b
    text: అంటే, యేసు తాను మరణించబోయే విధానాన్ని ముందే సూచించాడు; ఇది బహుశా సిలువ మరణాన్ని సూచిస్తుంది. యోహాను 12:32–33 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: నెరవేరేలా
  rationale: ఈ సందర్భంలో ఉద్దేశం/ఫలితం రెండింటికీ చోటిచ్చే సహజమైన తెలుగు ప్రయోగం.
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: యేసు ... చెప్పిన మాట
  rationale: ఇక్కడ λόγος అనేది యోహాను 1:1లోని బిరుదు కాదు; యేసు పలికిన వాక్యాన్ని సూచిస్తుంది. తెలుగు పునరుక్తిని తగ్గించేందుకు సంబంధవాక్యంతో కలిపి అనువదించాం.
- source_word: πληρωθῇ
  choice: నెరవేరేలా
  rationale: యోహాను సువార్తలోని నెరవేర్పు భావాన్ని నిలుపుతుంది; కేవలం ‘నిజమయ్యేలా’ అని సడలించలేదు.
- source_word: ὃν εἶπεν
  choice: చెప్పిన
  rationale: కథన సమయానికి ముందే యేసు పలికిన మాటను సహజమైన తెలుగు భూతకాల విశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: σημαίνων
  choice: సూచిస్తూ
  rationale: గ్రీకు వర్తమాన కృదంతం ప్రధాన క్రియను వివరిస్తుంది; దాని సందర్భాత్మక భావాన్ని తెలుగు కృదంతంతో నిలిపాం.
- source_word: ποίῳ θανάτῳ
  choice: ఎలాంటి మరణం
  rationale: మరణం జరుగుతుందనే వాస్తవం మాత్రమే కాక, దాని రకం లేదా విధానాన్ని ποίῳ ప్రశ్నిస్తుంది.
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: మరణం పొందబోతున్నాడో
  rationale: సమీప/భవిష్య భావాన్ని సహజంగా తెలుపుతుంది; ‘నియమించబడ్డాడు’ వంటి అధిక నిర్ణయవాద భావాన్ని చేర్చదు.
theological_decisions:
- issue: యేసు ముందుగా చెప్పిన మాటకు సంబంధించిన నెరవేర్పు భాష
  choice: ‘చెప్పిన మాట నెరవేరేలా’ అని స్పష్టంగా నిలిపాం.
  alternative: ‘యేసు చెప్పింది నిజమయ్యేలా’
  rationale: πληρωθῇలోని యోహానీయ నెరవేర్పు భావానికి theological బరువు ఉంది; దాన్ని సాధారణ నిజమవడం అనే భావానికి పరిమితం చేయలేదు.
- issue: μέλλωలోని భవిష్య భావం
  choice: ‘పొందబోతున్నాడో’
  alternative: ‘పొందాలని నిర్ణయించబడ్డాడో’ లేదా ‘పొందనున్నాడో’
  rationale: వాక్యం మరణ విధానాన్ని ముందుగా సూచించడాన్ని చెబుతుంది; ఈ క్రియ ఒక్కటే బలమైన పూర్వనిర్ణయ భావాన్ని తప్పనిసరి చేయదు.
- issue: ‘ఎలాంటి మరణం’ యొక్క సూచన
  choice: ప్రధాన పాఠ్యంలో శిలువ మరణం అని వివరణాత్మకంగా చేర్చలేదు.
  alternative: ‘శిలువపై ఎలాంటి మరణం’
  rationale: గ్రీకు వాక్యం మరణ విధానాన్ని సూచించినప్పటికీ ఇక్కడ దానిని నేరుగా పేరుపెట్టదు; యోహాను 12:32–33తో సంబంధాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడాం. గ్రీకు వాక్యంలోని సమాచార క్రమాన్ని తెలుగులో స్పష్టత కోసం పునర్వ్యవస్థీకరించాం. ప్రధాన పాఠ్యంలోని ప్రతి పాదటిప్పణి గుర్తు సంబంధిత చోట ఉంచబడింది.
