revisions:
- from: 'ఆయన చెప్పిన మాట నెరవేరేలా అలా జరిగింది: “నీవు నాకు ఇచ్చినవారిలో ఒక్కరినీ నేను పోగొట్టుకోలేదు[a].”'
  to: 'ఇది ఆయన చెప్పిన మాట నెరవేరేందుకు జరిగింది: “నీవు నాకు ఇచ్చినవారిలో ఒక్కరినీ నేను కోల్పోలేదు[a].”'
  rationale: The revision removes the vague added wording, expresses the fulfillment construction idiomatically in standalone modern Telugu, and uses a more direct verb for Jesus’ not losing any of those given to him. The source’s ambiguity and emphasis are retained, and the existing footnote anchor remains correctly placed.
  reviewer_model: gpt-5.6-terra
