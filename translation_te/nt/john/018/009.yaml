id: JHN.18.9
reference: John 18:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: te
  text: 'ఇది ఆయన చెప్పిన మాట నెరవేరేందుకు జరిగింది: “నీవు నాకు ఇచ్చినవారిలో ఒక్కరినీ నేను కోల్పోలేదు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిలో ఎవరినీ” లేదా “వారిలో ఒక్కరినీ కూడా.”
    reason: ἐξ αὐτῶν οὐδένα అనే పదబంధంలోని విభాగార్థం మరియు నొక్కిచెప్పే భావానికి సహజమైన ప్రత్యామ్నాయాలు.
lexical_decisions:
- source_word: ἵνα
  choice: నెరవేరేలా
  rationale: ఉద్దేశం లేదా ఫలితాన్ని సూచించే ἵνα భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πληρωθῇ
  choice: నెరవేరేలా
  rationale: యేసు ఇంతకుముందు పలికిన మాట సంఘటనలో సాకారమవడాన్ని సూచిస్తుంది; యోహాను వాడే నెరవేర్పు భావాన్ని కాపాడుతుంది.
- source_word: ὁ λόγος ὃν εἶπεν
  choice: ఆయన చెప్పిన మాట
  rationale: ఇక్కడ λόγος బిరుదుగా ఉన్న ‘వాక్యము’ కాదు; యేసు పలికిన నిర్దిష్ట మాట. అందువల్ల సాధారణ పాఠకులకు సహజంగా ఉండే ‘చెప్పిన మాట’ను ఎంచుకున్నాం.
- source_word: Οὓς δέδωκάς μοι
  choice: నీవు నాకు ఇచ్చినవారిలో
  rationale: δέδωκάςలోని ఇచ్చిన కార్యం మరియు దాని కొనసాగుతున్న ఫలితాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తూ, తరువాతి విభాగార్థకమైన ἐξ αὐτῶνకు తెలుగులో సహజంగా ముందే స్థానం కల్పిస్తుంది.
- source_word: ἀπώλεσα
  choice: పోగొట్టుకోలేదు
  rationale: ఈ సందర్భంలో శిష్యులను తన సంరక్షణలో కోల్పోకపోవడం భావం ప్రధానమైనది. ‘నాశనం చేయలేదు’ అనే క్రియాశీల ధ్వంసార్థాన్ని అనవసరంగా రానివ్వదు.
- source_word: ἐξ αὐτῶν οὐδένα
  choice: వారిలో ఒక్కరినీ
  rationale: ‘వారిలోనుండి ఒక్కరినీ కూడా కాదు’ అనే బలమైన విభాగార్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నెరవేర్పు భాష స్వభావం
  choice: యేసు ఇంతకుముందు చెప్పిన మాట నెరవేరిందనే భావంగా అనువదించడం
  alternative: ‘నిజమయ్యేలా’ అని మరింత వదులుగా అనువదించడం
  rationale: ఇక్కడ లేఖన ప్రవచన సూత్రాన్ని పాఠ్యంలో లేనంతగా చేర్చకుండా, యేసు మాటకు ఉన్న దైవిక ఉద్దేశం మరియు కథన నెరవేర్పు బరువును నిలుపుతుంది.
- issue: శిష్యుల విషయంలో ἀπώλεσα అర్థం
  choice: ‘పోగొట్టుకోలేదు’ అని అనువదించడం
  alternative: ‘నాశనం చేయలేదు’ లేదా ‘నశించనివ్వలేదు’
  rationale: అరెస్టు సమయంలో యేసు తన శిష్యులను కాపాడుతున్న తక్షణ సందర్భానికీ, యోహాను 17:12లోని భాషకూ ఇది సరిపోతుంది; ఒక నిర్దిష్ట సిద్ధాంత వ్యవస్థను పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘వాక్యము’ అనే సాంకేతిక లేదా బిరుదు భావం రాకుండా ‘మాట’ వాడబడింది. వాక్యంలోని కారణ/ఫలిత సంబంధం తెలుగులో పూర్తిగా వినిపించేందుకు ‘అలా జరిగింది’ చేర్చబడింది; ఇది సందర్భంలో అంతర్భూతమైన భావాన్ని మాత్రమే స్పష్టం చేస్తుంది.
