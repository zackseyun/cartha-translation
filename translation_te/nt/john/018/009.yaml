    text: లేదా, “వారిలో ఎవరినీ” లేదా “వారిలో ఒక్కరినీ కూడా.”
    reason: ἐξ αὐτῶν οὐδένα అనే పదబంధంలోని విభాగార్థం మరియు నొక్కిచెప్పే భావానికి సహజమైన ప్రత్యామ్నాయాలు.
  revision_rationale: The revision removes the vague added wording, expresses the fulfillment construction idiomatically in standalone modern Telugu, and uses a more direct verb for Jesus’ not losing any of those given to him. The source’s ambiguity and emphasis are retained, and the existing footnote anchor remains correctly placed.
