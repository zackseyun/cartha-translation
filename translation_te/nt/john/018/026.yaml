  source_fidelity: ‘ప్రధాన యాజకుని దాసుల్లో ఒకడు’ δοῦλοι τοῦ ἀρχιερέως‌ను, అలాగే ‘దాసులు’ అనే ఎంపిక ఆ పదం సూచించే బంధిత సామాజిక స్థితిని సరిగ్గా ప్రతిబింబిస్తుంది. ప్రశ్నలోని వ్యతిరేక రూపం సానుకూల జవాబును ఆశించే భావాన్ని నిలుపుతోంది. అయితే ప్రస్తుత మధ్య వివరణలో ‘పేతురు చెవి నరికివేసిన వ్యక్తి’ అనే పదక్రమం, పేతురు చెవినే నరికివేశాడనే తాత్కాలిక/వ్యాకరణపరమైన అస్పష్టతను కలిగించవచ్చు. మూలంలోని ‘ఆ వ్యక్తి చెవిని పేతురు నరికివేశాడు’ అనే సంబంధాన్ని స్పష్టంగా చేయాలి.
