id: JHN.18.26
reference: John 18:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: te
  text: 'ప్రధాన యాజకుని దాసుల్లో ఒకడు, ఒక వ్యక్తి చెవిని పేతురు నరికివేశాడో అతనికి బంధువు, ఇలా అన్నాడు: “నువ్వు ఆయనతో కలిసి తోటలో ఉండగా నేను నిన్ను చూడలేదా?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δούλων
  choice: దాసుల్లో
  rationale: ఈ సందర్భంలో ప్రధాన యాజకుని ఇంటికి చెందిన బంధిత సేవకులను సూచిస్తుంది. ‘సేవకులు’ కంటే ‘దాసులు’ వారి సామాజిక స్థితిని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀρχιερέως
  choice: ప్రధాన యాజకుని
  rationale: యోహాను సువార్తలోని శ్రమానుభవ కథన సందర్భంలో ప్రధాన యాజక పదవికి సహజమైన ప్రామాణిక తెలుగు రూపం.
- source_word: συγγενὴς ὢν
  choice: బంధువు
  rationale: మాట్లాడిన వ్యక్తికి గాయపడిన వ్యక్తితో ఉన్న కుటుంబ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; విభక్తి నిర్మాణం ద్వారా గ్రీకు వర్తమాన కృదంత భావం నిలుస్తుంది.
- source_word: οὗ
  choice: వ్యక్తికి
  rationale: గ్రీకు సంబంధ సర్వనామం చెవి ఎవరిదో సూచిస్తుంది. తెలుగులో ‘పేతురు చెవి నరికివేసిన వ్యక్తి’ అనే నిర్మాణం ఆ సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπέκοψεν
  choice: నరికివేసిన
  rationale: చెవిని పూర్తిగా కోసివేసిన చర్యను స్పష్టంగా తెలుపుతుంది; తెలుగు సంబంధ కృదంతం ముందుగా జరిగిన చర్యను సందర్భానుసారంగా సహజంగా తెలియజేస్తుంది.
- source_word: ὠτίον
  choice: చెవి
  rationale: సహజమైన ప్రత్యక్ష అనువాదం; గ్రీకు పదంలోని రూపపరమైన అల్పార్థ ఛాయను తెలుగులో ప్రత్యేకంగా చూపడం ఈ సందర్భంలో అవసరం లేదు.
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: నేను నిన్ను చూడలేదా?
  rationale: οὐκ తో అడిగిన ప్రశ్న సమ్మతికర జవాబును ఆశిస్తుంది. ‘నేను’ను ఉంచడం ἐγώ యొక్క ఉద్ఘాటనను కూడా నిలుపుతుంది.
- source_word: ἐν τῷ κήπῳ
  choice: తోటలో
  rationale: κήπος కు ఈ అరెస్టు కథన సందర్భంలో సహజమైన తెలుగు సమానం.
- source_word: μετ’ αὐτοῦ
  choice: ఆయనతో
  rationale: αὐτοῦ సందర్భంలో యేసును సూచిస్తుంది. యేసును ఉద్దేశించిన గౌరవప్రదమైన తెలుగు సర్వనామం సహజంగా ఉంటుంది.
theological_decisions:
- issue: గృహ సంబంధ సందర్భంలో δοῦλος అనువాదం
  choice: దాసులు
  alternative: సేవకులు
  rationale: ఇది సాధారణంగా పని చేసే పరిచారకులను మాత్రమే కాక, ప్రధాన యాజకుని గృహానికి చెందిన బంధిత స్థితిలోని వ్యక్తులను సూచిస్తుంది. అందువల్ల మూలపదంలోని సామాజిక వాస్తవాన్ని మెత్తబరచకుండా ‘దాసులు’ అని అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని బంధుత్వ వివరణను డాష్‌ల మధ్య ఉంచి సహజమైన కథన ప్రవాహాన్ని కాపాడాం; ప్రశ్నలోని ‘నేను’ ఉద్ఘాటనను నిలిపాం.
