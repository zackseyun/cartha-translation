  to: 'ప్రధాన యాజకుని దాసుల్లో ఒకడు, ఒక వ్యక్తి చెవిని పేతురు నరికివేశాడో అతనికి బంధువు, ఇలా అన్నాడు: “నువ్వు ఆయనతో కలిసి తోటలో ఉండగా నేను నిన్ను చూడలేదా?”'
