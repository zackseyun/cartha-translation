  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ταῦτα ⸀εἰπὼν Ἰησοῦς ἐξῆλθεν σὺν τοῖς μαθηταῖς αὐτοῦ πέραν τοῦ χειμάρρου ⸀τοῦ Κεδρὼν ὅπου ἦν κῆπος, εἰς ὃν εἰσῆλθεν αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/001.yaml
  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: te
  text: ఈ మాటలు చెప్పిన తర్వాత, యేసు తన శిష్యులతో కలిసి కిద్రోను వాగును దాటి వెళ్లాడు.[a] అక్కడ ఒక తోట ఉండేది; ఆయనా ఆయన శిష్యులూ దానిలోకి ప్రవేశించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కిద్రోను లోయను దాటి’ లేదా ‘కిద్రోను వాగు అవతలికి’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం సాధారణంగా వర్షాకాలంలో నీరు ప్రవహించే వాగును లేదా అటువంటి ప్రవాహం ఉండే లోయను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: ఈ మాటలు చెప్పిన తర్వాత
  rationale: Aorist participleను సహజమైన కాలసూచక ఉపవాక్యంగా అనువదించి, ముందుగా చెప్పిన మాటల తర్వాత జరిగిన క్రమాన్ని నిలుపుతుంది.
- source_word: ἐξῆλθεν
  choice: వెళ్లాడు
  rationale: సందర్భంలో యేసు అక్కడి నుంచి బయలుదేరి అవతలికి వెళ్లిన చలనాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘బయటికి వెళ్లాడు’ అనడం తెలుగులో అనవసరంగా గట్టిగా ఉంటుంది.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: తన శిష్యులతో కలిసి
  rationale: σύν సూచించే సహవాసాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: కిద్రోను వాగు అవతలికి
  rationale: πέραν గమ్యమైన అవతలి వైపును సూచిస్తుంది. χείμαρρος సాధారణంగా కాలానుగుణంగా నీరు ప్రవహించే వాగు లేదా లోయను సూచిస్తుంది; ‘వాగు’ తెలుగులో సంక్షిప్తంగా, సులభంగా అర్థమవుతుంది.
- source_word: ὅπου ἦν κῆπος
  choice: అక్కడ ఒక తోట ఉండేది
  rationale: κῆπος‌ను సాధారణ అర్థమైన ‘తోట’గా తీసుకొని, గ్రీకు అస్తిత్వ వాక్యాన్ని సహజ తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: εἰς ὃν εἰσῆλθεν
  choice: దానిలోకి ప్రవేశించారు
  rationale: εἰς‌లోని లోపలికి వెళ్లే దిశను ‘లోకి’ నిలుపుతుంది; తెలుగు శైలికి అనుగుణంగా సంబంధవాచక నిర్మాణాన్ని కొత్త వాక్యంగా మార్చింది.
- source_word: αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: ఆయనా ఆయన శిష్యులూ
  rationale: యేసును మరియు శిష్యులను సంయుక్త కర్తలుగా స్పష్టంగా ఉంచి, αὐτός‌కు అవసరానికి మించిన ‘ఆయనే స్వయంగా’ అనే నొక్కి చెప్పే భావాన్ని జోడించదు.
