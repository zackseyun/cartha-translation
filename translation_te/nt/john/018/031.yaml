  to: అప్పుడు పిలాతు వారితో[a], “మీరే ఇతనిని తీసుకొని, మీ ధర్మశాస్త్రం ప్రకారం ఇతనికి తీర్పు తీర్చండి” అన్నాడు. యూదులు అతనితో, “ఎవరినీ చంపడానికి మాకు అనుమతి లేదు” అన్నారు.
