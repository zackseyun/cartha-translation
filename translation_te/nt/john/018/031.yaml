id: JHN.18.31
reference: John 18:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: te
  text: అప్పుడు పిలాతు వారితో[a], “మీరే ఇతనిని తీసుకొని, మీ ధర్మశాస్త్రం ప్రకారం ఇతనికి తీర్పు తీర్చండి” అన్నాడు. యూదులు అతనితో, “ఎవరినీ చంపడానికి మాకు అనుమతి లేదు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘యూదులు’ (οἱ Ἰουδαῖοι) అని ఉంది. ఈ సందర్భంలో అది యూదు ప్రజలందరినీ కాక, పిలాతుతో మాట్లాడుతున్న యూదు అధికారులు లేదా నిందారోపకులను సూచిస్తుంది.
    reason: సందర్భపరమైన ప్రత్యామ్నాయ అవగాహనను తెలియజేసి, మొత్తం యూదు ప్రజలను ఉద్దేశించినట్లు అపార్థం కాకుండా చేయడం.
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: సందర్భంలోని కథన కొనసాగింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఇక్కడ తప్పనిసరిగా కఠినమైన తార్కిక నిర్ధారణను సూచించదు.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: మీరే ఇతన్ని తీసుకెళ్లి
  rationale: వ్యక్తమైన ὑμεῖς వల్ల ఉన్న ఉద్ఘాటనను ‘మీరే’ నిలుపుతుంది. ఈ సందర్భంలో పిలాతు తన వద్దనుంచి వారే అతన్ని తీసుకోవాలని చెప్పడం వల్ల ‘తీసుకెళ్లి’ సహజంగా ఉంది.
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: మీ ధర్మశాస్త్రం ప్రకారం
  rationale: κατά ఇక్కడ ప్రమాణానికి అనుగుణంగా అనే భావాన్ని ఇస్తుంది. νόμος యూదుల మత-న్యాయ వ్యవస్థను సూచిస్తున్నందున ‘ధర్మశాస్త్రం’ సముచితమైన బైబిలు తెలుగు పదం.
- source_word: κρίνατε αὐτόν
  choice: ఇతనికి తీర్పు తీర్చండి
  rationale: న్యాయసంబంధ సందర్భాన్ని స్పష్టంగా తెలిపినా, రోమా పద్ధతిలోని ప్రత్యేక విచారణగా అర్థాన్ని కుదించదు.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదబంధాన్ని నేరుగా నిలుపుతుంది. అయితే ఇక్కడ అది యూదులందరినీ కాక పిలాతుతో మాట్లాడుతున్న యూదు అధికారులు లేదా నిందారోపకులను సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
- source_word: Ἡμῖν οὐκ ἔξεστιν
  choice: మాకు అధికారం లేదు
  rationale: ఈ రోమా న్యాయసంబంధ సందర్భంలో ἔξεστιν అనుమతి లేదా చట్టబద్ధ అధికారాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ‘అధికారం లేదు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἀποκτεῖναι οὐδένα
  choice: ఎవరినీ మరణశిక్షకు గురిచేయడానికి
  rationale: న్యాయపరమైన సంభాషణలో ἀποκτεῖναιని సాధారణ హత్యగా కాక అధికారికంగా ప్రాణదండన విధించి అమలు చేయడంగా సందర్భం సూచిస్తుంది; అయినా ‘ఉరితీయడం’ వంటి నిర్దిష్ట విధానాన్ని చేర్చదు.
theological_decisions:
- issue: యోహానులో οἱ Ἰουδαῖοι అనే పదబంధం ఎవరిని సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘యూదులు’ అని ఉంచి, సందర్భపరమైన పరిధిని పాదటిప్పణిలో వివరించడం
  alternative: యూదు అధికారులు; యూదయులు
  rationale: మూలంలోని పదప్రయోగాన్ని, దాని సందర్భపరమైన సంక్లిష్టతను నిలుపుతుంది. వెంటనే ఉన్న కథనం పిలాతు ఎదుట మాట్లాడుతున్న నిర్దిష్ట బృందాన్ని సూచిస్తుంది; యూదు ప్రజలందరిపై సాధారణీకరించే అపార్థాన్ని పాదటిప్పణి నివారిస్తుంది.
- issue: మరణదండన విషయంలో ἔξεστιν యొక్క భావం
  choice: ‘మాకు అధికారం లేదు’
  alternative: ‘మాకు అనుమతి లేదు’; ‘మాకు ధర్మసమ్మతం కాదు’
  rationale: వాక్యం ఆ అధికారలేమి రోమా చట్టం వల్లనా, మరొక నియమం వల్లనా అని స్వయంగా వివరించదు. కాబట్టి కారణాన్ని చేర్చకుండా చట్టబద్ధ అనుమతి/అధికార భావాన్ని మాత్రమే తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయసంబంధ శైలి. ‘మీరే’ ద్వారా గ్రీకు ఉద్ఘాటన నిలుపబడింది; ‘ధర్మశాస్త్రం’ యూదుల νόμοςకు బైబిలు సందర్భంలో సుపరిచితమైన పదం. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
