  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἦν δὲ Σίμων Πέτρος ἑστὼς καὶ θερμαινόμενος. εἶπον οὖν αὐτῷ· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν αὐτοῦ εἶ; ⸀ἠρνήσατο ἐκεῖνος καὶ εἶπεν· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: te
  text: సీమోను పేతురు నిలబడి చలి కాచుకుంటూ ఉన్నాడు. కాబట్టి వారు అతనితో[a], “నువ్వు కూడా ఆయన శిష్యుల్లో ఒకడివి కావు కదా?” అన్నారు. అతడు దానిని నిరాకరించి, “నేను కాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నువ్వు కూడా ఆయన శిష్యుల్లో ఒకడివి కాదుగా?” μήతో అడిగిన గ్రీకు ప్రశ్న ప్రతికూల సమాధానాన్ని ఆశిస్తుంది.
    reason: ప్రశ్నలో అంతర్లీనంగా ఉన్న ప్రతికూల సమాధాన నిరీక్షణకు ప్రత్యామ్నాయ వ్యక్తీకరణ.
lexical_decisions:
- source_word: Ἦν δὲ
  choice: సీమోను పేతురు ... కాచుకుంటున్నాడు
  rationale: δέ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేక సంధాయకాన్ని చేర్చకుండానే వాక్యప్రవాహం సహజంగా ఉంటుంది. ἦν తో కూడిన కృదంత నిర్మాణాన్ని కొనసాగుతున్న చర్యగా అనువదించాం.
- source_word: ἑστὼς
  choice: నిలబడి
  rationale: ἵστημι యొక్క పరిపూర్ణ కృదంతం పేతురు కొనసాగిస్తూ ఉన్న భంగిమను సూచిస్తుంది; ‘నిలబడి’ దాని సహజ తెలుగు రూపం.
- source_word: θερμαινόμενος
  choice: చలి కాచుకుంటున్నాడు
  rationale: తనను తాను వెచ్చబరచుకుంటున్న చర్యను ఆధునిక సహజ తెలుగులో ‘చలి కాచుకోవడం’ తెలియజేస్తుంది. ఈ వచనంలో అగ్ని స్పష్టంగా లేకపోవడంతో దాన్ని చేర్చలేదు.
- source_word: εἶπον οὖν αὐτῷ
  choice: కాబట్టి వారు అతనితో ... అన్నారు
  rationale: οὖν తెలిపే కథన పర్యవసాన సంబంధాన్ని ‘కాబట్టి’ నిలుపుతుంది; బహువచన క్రియను ‘వారు’ స్పష్టపరుస్తుంది.
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: నువ్వు కూడా ... కావు కదా?
  rationale: μή ప్రతికూల సమాధానాన్ని ఆశించే ప్రశ్నను సూచిస్తుంది; ‘కావు కదా?’ తెలుగులో అదే నిరీక్షణను సహజంగా వ్యక్తం చేస్తుంది. καὶ σὺ ను ‘నువ్వు కూడా’గా ఉంచాం.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ఆయన శిష్యుల్లో ఒకడివి
  rationale: ἐκ + షష్ఠీ విభక్తి ఒక సమూహంలో సభ్యత్వాన్ని సూచిస్తుంది; ‘శిష్యుల్లో ఒకడు’ దానికి సహజ సమానార్థకం.
- source_word: ἠρνήσατο
  choice: దాన్ని నిరాకరిస్తూ
  rationale: నిరాకరణ ప్రశ్నలోని ఆరోపణకు సంబంధించినదని ‘దాన్ని’ స్పష్టపరుస్తుంది; యేసునే నిరాకరించాడని ఈ పదబంధంలో విస్తరించి చెప్పలేదు.
- source_word: ἐκεῖνος
  choice: అతడు
  rationale: స్వల్ప ఉద్ఘాటన కలిగిన సర్వనామాన్ని తెలుగులో సహజమైన ‘అతడు’తో అందించాం.
- source_word: Οὐκ εἰμί
  choice: నేను కాను
  rationale: మూలంలోని సంక్షిప్త, ప్రత్యక్ష నిరాకరణను అదనపు ‘లేదు’ లేక వివరణ లేకుండా నిలిపాం.
theological_decisions:
- issue: పేతురు చేసిన నిరాకరణ స్వభావం
  choice: యేసు శిష్యుల్లో తాను ఒకడిని కాదని అడిగిన ప్రశ్నను పేతురు నేరుగా నిరాకరించినట్లుగా అనువదించడం
  alternative: ‘నేను వారిలో ఒకడిని కాను’ అని విస్తరించడం లేదా యేసునే నిరాకరించాడని స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం సంక్షిప్తంగా, ప్రశ్నలోని మాటలను అధ్యాహారంగా ఉంచుతుంది. విస్తృతమైన సిద్ధాంతార్థాన్ని చేర్చకుండా కథనంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘చలి కాచుకోవడం’ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే నుడికారం; ‘ఆయన’ యేసును సూచించేటప్పుడు గౌరవప్రయోగంగా ఉంది. ప్రశ్నలోని μή భావాన్ని ప్రధాన పాఠ్యంలో ‘కావు కదా?’తో, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
