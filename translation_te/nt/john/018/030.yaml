  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Εἰ μὴ ἦν οὗτος ⸂κακὸν ποιῶν⸃, οὐκ ἄν σοι παρεδώκαμεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: te
  text: 'వారు ఆయనకు జవాబిచ్చి ఇలా అన్నారు: “ఇతడు చెడు చేసేవాడు కాకపోతే, ఇతణ్ణి నీకు అప్పగించేవాళ్లం కాదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: వారు ఆయనకు జవాబిస్తూ ... అన్నారు
  rationale: రెండు గ్రీకు క్రియలతో కూడిన కథన సూత్రాన్ని తెలుగులో సహజంగా ఉంచుతూ, జవాబిచ్చి మాట్లాడారనే పూర్తి భావాన్ని నిలుపుతుంది.
- source_word: Εἰ μὴ ἦν
  choice: కాకపోతే
  rationale: గత వాస్తవానికి విరుద్ధమైన షరతును, దాని ఫలిత వాక్యంతో కలిపి సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὗτος
  choice: ఇతడు
  rationale: యేసును సూచించే సమీప సూచక సర్వనామం; మూలంలోని దూరం పెట్టే ధోరణిని అనవసరమైన అవమానభావం జోడించకుండా నిలుపుతుంది.
- source_word: κακὸν ποιῶν
  choice: చెడు చేసేవాడు
  rationale: ποιῶν యొక్క క్రియాత్మక భావాన్నీ κακόν యొక్క నైతిక తీవ్రతనూ నిలుపుతుంది; నిర్దిష్టమైన న్యాయపరమైన నేరారోపణను దిగుమతి చేయదు.
- source_word: οὐκ ἄν σοι παρεδώκαμεν αὐτόν
  choice: ఇతణ్ణి నీకు అప్పగించేవాళ్లం కాదు
  rationale: వాస్తవానికి విరుద్ధమైన ఫలితాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, న్యాయాధికారికి అప్పగించడమనే παραδίδωμι భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: యేసుపై నిందారోపణ యొక్క స్వరూపం
  choice: చెడు చేసేవాడు
  alternative: నేరస్థుడు; దుష్టుడు
  rationale: κακὸν ποιῶν ఒక నిర్దిష్ట న్యాయపరమైన బిరుదు కంటే విస్తృతమైన, క్రియాత్మక ఆరోపణ. అందువల్ల ఆరోపకులు చేసిన అస్పష్టమైన సాధారణ నిందను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. పిలాతును ఉద్దేశించిన ఏకవచన σοι కోసం సందర్భానుగుణంగా ‘నీకు’ వాడబడింది. మూలంలో లేని వివరణను జోడించలేదు.
