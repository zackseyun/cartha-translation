  text: ἀπεκρίθησαν αὐτῷ· Ἰησοῦν τὸν Ναζωραῖον. λέγει ⸀αὐτοῖς· Ἐγώ εἰμι. εἱστήκει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: te
  text: వారు ఆయనకు, “నజరేయుడైన యేసు” అని జవాబిచ్చారు. ఆయన వారితో, “నేనే” అన్నాడు.[a] ఆయనను అప్పగిస్తున్న యూదా కూడా వారితో నిలబడి ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో: “నేను ఉన్నాను.” ఈ సందర్భంలో దీని అర్థం “మీరు వెదుకుతున్న వ్యక్తిని నేనే.”'
    reason: Ἐγώ εἰμι యొక్క అక్షరార్థ రూపాన్ని, సందర్భంలో దాని సహజ భావాన్ని తెలియజేస్తూ మూలంలోని సాధ్యమైన ద్వంద్వ ప్రతిధ్వనిని సంరక్షించడానికి.
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: నజరేయుడైన యేసు
  rationale: వ్యక్తిని గుర్తించే సహజమైన ఆధునిక తెలుగు రూపం; Ναζωραῖον అనే ప్రాంతసంబంధ విశేషణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Ἐγώ εἰμι
  choice: నేనే
  rationale: సందర్భంలో ‘మీరు వెదుకుతున్న వ్యక్తిని నేనే’ అనే భావాన్ని సహజంగా వ్యక్తపరుస్తూనే, గ్రీకు పదబంధంలోని సంక్షిప్తతను మరియు యోహాను రచనలో ఉండగల విస్తృత ప్రతిధ్వనిని పూర్తిగా వివరణాత్మకంగా మార్చదు.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: ఆయనను అప్పగిస్తున్న
  rationale: వర్తమాన కృదంత భావాన్ని నిలుపుతూ, యూదా చేస్తున్న ద్రోహపూర్వక అప్పగింతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἱστήκει ... μετ’ αὐτῶν
  choice: వారితో నిలబడి ఉన్నాడు
  rationale: స్థితిని సూచించే గ్రీకు పరిపూర్ణ రూపం మరియు ‘వారి పక్షాన/వారితో’ ఉన్న దృశ్యాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: Ἐγώ εἰμι యొక్క అనువాదం
  choice: నేనే
  alternative: నేనే ఆయనను / నేను ఉన్నాను
  rationale: ‘నేనే ఆయనను’ అనేది సందర్భార్థాన్ని మరింత బహిర్గతం చేసినా మూలంలో లేని కర్మపదాన్ని చేర్చుతుంది; ‘నేను ఉన్నాను’ తెలుగు సంభాషణలో అసహజంగా ఉండి ఇక్కడి గుర్తింపు జవాబును మసకబారుస్తుంది. ‘నేనే’ సందర్భార్థాన్నీ సాధ్యమైన యోహానీయ ధార్మిక ప్రతిధ్వనినీ తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం. మూలంలోని సంక్షిప్త సంభాషణను, యూదా వారితో నిలబడిన దృశ్యాన్ని నిలుపుకుంది.
