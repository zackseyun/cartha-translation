id: JHN.18.21
reference: John 18:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί με ⸂ἐρωτᾷς; ἐρώτησον⸃ τοὺς ἀκηκοότας τί ἐλάλησα αὐτοῖς· ἴδε οὗτοι οἴδασιν ἃ εἶπον ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: te
  text: “నన్నెందుకు ప్రశ్నిస్తున్నావు? నేను వారికి ఏమి చెప్పానో విన్నవారిని ప్రశ్నించు. ఇదిగో[a], నేను చెప్పినది వీరికి తెలుసు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చూడు.” గ్రీకు పదం శ్రద్ధను ఆకర్షించే ఉద్బోధన.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: నన్నెందుకు ప్రశ్నిస్తున్నావు?
  rationale: τί ప్రశ్నకు కారణాన్ని అడుగుతుంది; వర్తమానకాల ἐρωτᾷς కొనసాగుతున్న అధికారిక విచారణను సూచిస్తుంది. సందర్భంలోని న్యాయవిచారణ ధోరణిని ‘ప్రశ్నిస్తున్నావు’ సహజంగా నిలుపుతుంది.
- source_word: ἐρώτησον
  choice: ప్రశ్నించు
  rationale: ఏకవచన ఆజ్ఞారూపాన్ని నేరుగా అందిస్తుంది; ముందున్న క్రియతో ఉద్దేశపూర్వక సమాంతరతను కూడా కాపాడుతుంది.
- source_word: τοὺς ἀκηκοότας
  choice: విన్నవారిని
  rationale: పరిపూర్ణ క్రియావిశేషణ రూపం గతంలో విని, ఇప్పుడు సాక్ష్యమివ్వగల స్థితిలో ఉన్నవారిని సూచిస్తుంది. తెలుగు సందర్భంలో ‘విన్నవారు’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τί ἐλάλησα αὐτοῖς
  choice: నేను వారికి ఏమి చెప్పానో
  rationale: λαλέω ఇక్కడ పలికిన విషయాన్ని సూచిస్తుంది; ‘ఏమి చెప్పానో’ ఆధునిక తెలుగులో సహజమైన విషయవాచక నిర్మాణం.
- source_word: ἴδε
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే ఆజ్ఞార్థక ఉద్బోధనను ‘ఇదిగో’ స్పష్టంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: οὗτοι οἴδασιν
  choice: వీరికి తెలుసు
  rationale: οὗτοι లోని సమీప సూచనాత్మక బలాన్ని ‘వీరు’ నిలుపుతుంది; తెలుగు వాడుకలో జ్ఞానాన్ని ‘వీరికి తెలుసు’ అని సహజంగా వ్యక్తపరుస్తారు.
- source_word: ἃ εἶπον ἐγώ
  choice: నేను చెప్పినది
  rationale: ἃ పలికిన విషయాన్ని సూచిస్తుంది. స్పష్టంగా ఉన్న ἐγώ లోని ప్రథమపురుష ప్రాధాన్యాన్ని ‘నేను’ నిలుపుతుంది.
theological_decisions:
- issue: ప్రధాన యాజకుని ఎదుట యేసు సమాధానంలోని న్యాయవిచారణ ధోరణి
  choice: ἐρωτάω వచ్చిన రెండు చోట్లా ‘ప్రశ్నించు’ అనే పదాన్ని వాడటం
  alternative: రెండు చోట్లా తటస్థమైన ‘అడుగు’ అని అనువదించడం
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు; అధికారిక విచారణ సందర్భాన్ని ప్రతిబింబించే సందర్భోచిత ఎంపిక. ‘ప్రశ్నించు’ గ్రీకు క్రియలో సాధ్యమైన విచారణాత్మక బలాన్ని అతిశయింపకుండా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ. ‘నీవు’ అనే సర్వనామాన్ని ప్రత్యేకంగా చేర్చకుండా క్రియారూపంలోనే ఏకవచన సంబోధనను ఉంచాం. గ్రీకులోని ‘వీరు’ అనే సూచనాత్మక బలాన్ని నిలుపుతూ, తెలుగు సహజ వాక్యనిర్మాణం కోసం ‘వీరికి తెలుసు’ అని ఇచ్చాం.
