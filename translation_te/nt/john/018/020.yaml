id: JHN.18.20
reference: John 18:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: te
  text: 'యేసు అతనికి ఇలా జవాబిచ్చాడు: “నేను లోకానికి బహిరంగంగా మాట్లాడాను. యూదులందరూ[b] కూడివచ్చే సమాజమందిరంలోను, దేవాలయ ప్రాంగణంలోను[a] నేను ఎప్పుడూ బోధించాను. రహస్యంగా నేనేమీ మాట్లాడలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవాలయంలోను.’ గ్రీకు ἱερόν అనే పదం అంతర్గర్భాలయాన్ని మాత్రమే కాక, దేవాలయ ప్రాంగణాలు సహా మొత్తం సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘యూద ప్రజలందరూ’; కొన్ని సందర్భాల్లో ‘యూదయులందరూ.’ గ్రీకు Ἰουδαῖοι అనే పదం సందర్భానుసారం భిన్నంగా అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: బహిరంగంగా
  rationale: ఇక్కడ ἐν κρυπτῷ (‘రహస్యంగా’) అనే మాటతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది; ధైర్యం అనే భావాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: λελάληκα
  choice: మాట్లాడాను
  rationale: గతంలో పలికిన మాటలకు ప్రస్తుత విచారణలోనూ ప్రాసంగికత ఉందనే సంపూర్ణ కాల భావం సందర్భం ద్వారా నిలుస్తుంది; తెలుగులో సహజమైన రూపాన్ని ఎంచుకున్నాం.
- source_word: τῷ κόσμῳ
  choice: లోకంతో
  rationale: యోహాను రచనలో κόσμος కలిగిన విస్తృత భావాన్ని నిలుపుతూ, బహిరంగ ప్రజాక్షేత్రాన్ని సూచిస్తుంది.
- source_word: πάντοτε
  choice: ఎప్పుడూ
  rationale: నిరంతరంగా లేదా అలవాటుగా బహిరంగంగా బోధించాడనే కాల భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐδίδαξα
  choice: బోధించాను
  rationale: గ్రీకు భూతకాల క్రియను తెలుగులో సహజమైన సాధారణ భూతకాల రూపంతో అందిస్తుంది.
- source_word: ἐν συναγωγῇ
  choice: సమాజమందిరంలోనూ
  rationale: ఏకవచనం ఇక్కడ సాధారణ సంస్థాగత స్థలాన్ని సూచించగలదు; మూలంలోని ఏకవచనాన్ని నిలిపాం.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయ ప్రాంగణంలోనూ
  rationale: ἱερόν అంతర్గర్భాలయాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది; ‘ప్రాంగణం’ ఆ విస్తృత అర్థాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: యూదులందరూ
  rationale: ఈ సందర్భంలో సమాజమందిరం, దేవాలయం వద్ద కూడే విస్తృత యూద సమాజం ఉద్దేశించబడినట్లు కనిపిస్తుంది; పదానికి ఉండే ‘యూదయులు’ అనే ప్రాంతీయ సాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: συνέρχονται
  choice: సమావేశమయ్యే
  rationale: సమూహంగా ఒకచోటికి రావడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐν κρυπτῷ
  choice: రహస్యంగా
  rationale: παρρησίᾳ (‘బహిరంగంగా’)తో ఉన్న ప్రత్యక్ష వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ἐλάλησα οὐδέν
  choice: నేనేమీ మాట్లాడలేదు
  rationale: బలమైన నిరాకరణను సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: ἀπεκρίθη αὐτῷ
  choice: యేసు అతనికి ఇలా జవాబిచ్చాడు
  rationale: కథనశైలికి తగిన, స్పష్టమైన ఆధునిక తెలుగు ప్రయోగం.
theological_decisions:
- issue: యోహాను సువార్తలో Ἰουδαῖοι పదం సూచించే వర్గం
  choice: ప్రధాన పాఠ్యంలో ‘యూదులందరూ’ అని అనువదించాం; ఇక్కడ అది బహిరంగ ఆరాధనకు కూడే యూద సమాజాన్ని విస్తృతంగా సూచిస్తుంది.
  alternative: ‘యూద ప్రజలందరూ’ లేదా సందర్భానుసారం ‘యూదయులందరూ’
  rationale: Ἰουδαῖοι పదం యోహాను సువార్తలో సందర్భాన్ని బట్టి యూద ప్రజలను, యూదయ ప్రాంతవాసులను లేదా కొన్నిసార్లు అధికారులను సూచించవచ్చు. ఈ వాక్యంలో సమాజమందిరం, దేవాలయం ప్రస్తావన విస్తృత సామూహిక అర్థానికి మద్దతిస్తుంది; అయినా ప్రాంతీయ అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- issue: రహస్య బోధన గురించి యేసు చేసిన ప్రకటన
  choice: ‘రహస్యంగా నేనేమీ మాట్లాడలేదు’ అనే నిర్దిష్టమైన నిరాకరణను యథాతథంగా నిలిపాం.
  alternative: ‘నా బోధనలో ఏదీ రహస్యంగా ఉంచలేదు’ అనే వివరణాత్మక అనువాదం
  rationale: ఈ మాటను ఇతర వ్యక్తిగత సంభాషణలతో సమన్వయపరచడానికి అనువాదంలో అదనపు వివరణ చేర్చలేదు; సందర్భంలోని బహిరంగ బోధన–రహస్య బోధన మధ్య ఉద్వేగాన్ని మూలపాఠ్యంలానే ఉంచాం.
translation_notes:
  register: సాధారణ ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా గంభీరమైన, సహజమైన కథనశైలిని వాడాం. ‘సమాజమందిరం,’ ‘దేవాలయ ప్రాంగణం’ వంటి పదాలు చారిత్రక స్థలభేదాన్ని స్పష్టంగా ఉంచుతాయి. మూలంలో ‘దేవాలయం’ పదానికి సంబంధించిన పాదసూచికను సంబంధిత పదం వెంట [a]గా, Ἰουδαῖοι పదానికి సంబంధించిన పాదసూచికను ‘యూదులందరూ’ వెంట [b]గా ఉంచాం.
