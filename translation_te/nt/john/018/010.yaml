revisions:
- from: అప్పుడు సీమోను పేతురు తన దగ్గర ఉన్న కత్తిని దూసి, ప్రధాన యాజకుని దాసుణ్ణి[a] కొట్టి, అతని కుడి చెవిని నరికివేశాడు. ఆ దాసుని పేరు మల్కు.
  to: అప్పుడు సీమోను పేతురు తన దగ్గర ఉన్న కత్తిని బయటికి తీసి, ప్రధాన యాజకుని దాసుణ్ణి[a] కొట్టి, అతని కుడి చెవిని నరికివేశాడు. ఆ దాసుని పేరు మల్కు.
  rationale: The sole textual revision corrects the action of εἵλκυσεν from sword-thrusting to drawing the sword out. The translation otherwise faithfully retains the sequence of actions, the possessive relation expressed by the genitive, the specified right ear, and the identifying clause about Malchus. The footnote spelling of the Greek transliteration is also normalized to “దూలోస్.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:31:19Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Simon Peter, the high priest’s δοῦλος, the right ear, and Malchus. However, “కత్తిని దూసి” ordinarily means thrusting/charging with the sword, not drawing it from its sheath; εἵλκυσεν requires an explicit rendering of drawing out.
  naturalness: The narrative is otherwise clear and modern. Replacing “దూసి” with “బయటికి తీసి” gives the required sense in natural standard Telugu.
  terminology: “దాసుడు” suitably renders δοῦλος in the main text, while the footnote preserves “సేవకుడు” as a viable contextual alternative. “ప్రధాన యాజకుడు,” “సీమోను పేతురు,” and “మల్కు” are appropriate forms.
  issues:
  - severity: medium
    issue: “కత్తిని దూసి” does not mean ‘drew it.’
    rationale: In modern Telugu, దూయు/dūsi in this construction conveys thrusting or rushing with a weapon. The Greek εἵλκυσεν αὐτήν describes drawing the sword, prior to striking.
  revised_text: అప్పుడు సీమోను పేతురు తన దగ్గర ఉన్న కత్తిని బయటికి తీసి, ప్రధాన యాజకుని దాసుణ్ణి[a] కొట్టి, అతని కుడి చెవిని నరికివేశాడు. ఆ దాసుని పేరు మల్కు.
  revised_footnotes:
  - marker: a
    text: లేదా, “ప్రధాన యాజకుని సేవకుణ్ణి.” గ్రీకు పదమైన δοῦλος (దూలోస్) సందర్భాన్ని బట్టి “దాసుడు” లేదా “సేవకుడు” అని అర్థం కావచ్చు.
    reason: alternative_reading
  revision_rationale: The sole textual revision corrects the action of εἵλκυσεν from sword-thrusting to drawing the sword out. The translation otherwise faithfully retains the sequence of actions, the possessive relation expressed by the genitive, the specified right ear, and the identifying clause about Malchus. The footnote spelling of the Greek transliteration is also normalized to “దూలోస్.”
