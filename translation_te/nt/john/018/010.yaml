id: JHN.18.10
reference: John 18:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: te
  text: అప్పుడు సీమోను పేతురు తన దగ్గర ఉన్న కత్తిని బయటికి తీసి, ప్రధాన యాజకుని దాసుణ్ణి[a] కొట్టి, అతని కుడి చెవిని నరికివేశాడు. ఆ దాసుని పేరు మల్కు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రధాన యాజకుని సేవకుణ్ణి.” గ్రీకు పదమైన δοῦλος (దూలోస్) సందర్భాన్ని బట్టి “దాసుడు” లేదా “సేవకుడు” అని అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: ముందున్న సంఘటనకు కొనసాగింపుగా కథన పురోగతిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; దీనిని బలమైన తార్కిక నిర్ధారణగా మార్చదు.
- source_word: ἔχων μάχαιραν
  choice: తన దగ్గర ఉన్న కత్తిని
  rationale: ἔχων అనే భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది. μάχαιρα చిన్న కత్తి లేదా ఖడ్గాన్ని సూచించగలిగినా, ‘కత్తి’ విస్తృతమైన, సాధారణ పదం.
- source_word: εἵλκυσεν αὐτὴν
  choice: దూసి
  rationale: ఆయుధాన్ని బయటికి తీయడాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; గ్రీకులో లేని అదనపు వివరాన్ని చేర్చదు.
- source_word: ἔπαισεν
  choice: కొట్టి
  rationale: దెబ్బకొట్టిన చర్యను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: ప్రధాన యాజకుని దాసుణ్ణి
  rationale: సంబంధాన్ని సహజమైన తెలుగు షష్ఠీ నిర్మాణంలో చూపిస్తుంది. δοῦλοςలోని బంధిత సేవా స్థితిని ‘దాసుడు’ స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: ἀπέκοψεν
  choice: నరికివేశాడు
  rationale: కత్తితో శరీర భాగాన్ని పూర్తిగా వేరుచేసిన చర్యను సహజమైన తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: ὠτάριον τὸ δεξιόν
  choice: కుడి చెవిని
  rationale: దిమిన్యూటివ్ రూపమైన ὠτάριον ఇక్కడ సాధారణంగా ‘చెవి’ అనే అర్థంలో ఉంది; ‘చెవితమ్మె’ వంటి మరీ నిర్దిష్టమైన అర్థాన్ని రుద్దదు.
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: ఆ దాసుని పేరు మల్కు
  rationale: కొత్త గుర్తింపు సమాచారాన్ని సహజమైన తెలుగు కథన శైలిలో అందిస్తుంది; Μάλχοςను ప్రాచుర్యంలో ఉన్న తెలుగు రూపం ‘మల్కు’గా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: δοῦλος పదానికి అనువాదం
  choice: దాసుడు
  alternative: సేవకుడు
  rationale: ప్రధాన యాజకునితో ఉన్న అధీన సంబంధం బంధిత స్థితిని సూచించగలదు కాబట్టి ప్రధాన పాఠంలో ‘దాసుడు’ ఉంచబడింది. అయితే సందర్భానుసారం δοῦλοςకు ‘సేవకుడు’ అనే అర్థం కూడా సాధ్యమేనని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, దాని భావసంబంధాలు మరియు అస్పష్టతలు కాపాడబడ్డాయి.
