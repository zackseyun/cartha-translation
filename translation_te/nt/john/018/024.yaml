source:
  edition: SBLGNT
  text: ἀπέστειλεν ⸀οὖν αὐτὸν ὁ Ἅννας δεδεμένον πρὸς Καϊάφαν τὸν ἀρχιερέα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: te
  text: కాబట్టి అన్నా కట్టివేయబడి ఉన్న ఆయనను ప్రధాన యాజకుడైన కయప దగ్గరికి పంపాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సందర్భాన్ని బట్టి, ముందటి చర్యలను వివరించే మధ్యంతర వ్యాఖ్యగా: “అన్నా అప్పటికే కట్టివేయబడి ఉన్న ఆయనను ప్రధాన యాజకుడైన కయప దగ్గరికి పంపి ఉన్నాడు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: పంపాడు
  rationale: ἀποστέλλω యొక్క ఏకకాల భూత క్రియారూపాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో సూటిగా వ్యక్తపరుస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న సందర్భంతో కథనపరమైన లేదా తార్కిక అనుసంధానాన్ని నిలుపుతుంది; ఇక్కడ οὖν యొక్క సంబంధబోధక శక్తిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δεδεμένον
  choice: బంధించబడిన స్థితిలో
  rationale: δέω యొక్క పరిపూర్ణ కర్మణి కృదంతం ఆయన పంపబడినప్పుడు బంధిత స్థితిలో ఉన్నాడని సూచిస్తుంది. ‘కట్టివేసి’ కంటే ఇది స్థితిని స్పష్టంగా ఉంచుతుంది.
- source_word: πρὸς
  choice: దగ్గరికి
  rationale: వ్యక్తివైపు కదలికను సూచించే πρός భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Καϊάφαν
  choice: కయప
  rationale: Καϊάφας అనే వ్యక్తిపేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: τὸν ἀρχιερέα
  choice: ప్రధాన యాజకుడైన
  rationale: యూదుల ప్రధాన యాజక పదవిని సూచించే ἀρχιερεύς భావాన్ని ఖచ్చితంగా తెలియజేస్తూ, కయపను విశేషిస్తుంది.
- source_word: ὁ Ἅννας
  choice: అన్నా
  rationale: Ἅννας అనే వ్యక్తిపేరుకు తెలుగులో సాధారణంగా వాడే లిప్యంతరీకరణ.
theological_decisions:
- issue: చుట్టుపక్కల సందర్భానికి సంబంధించి కథన క్రమం
  choice: అన్నా ఆయనను బంధిత స్థితిలో కయప దగ్గరికి పంపాడనే సాధారణ భూతకాల కథనంగా ప్రధాన పాఠ్యంలో అనువదించడం.
  alternative: ముందే జరిగిన పంపింపును వివరిస్తున్న మధ్యంతర వ్యాఖ్యగా, ‘అన్నా ఆయనను ... పంపివేశాడు’ అని గ్రహించడం.
  rationale: గ్రీకు ఏకకాల భూత సూచక క్రియారూపం సహజంగా కథనంలోని ఒక సంఘటనను తెలియజేస్తుంది. అయితే 18:24కు ముందున్న విచారణ క్రమంతో దీని సంబంధం విషయంలో నిజమైన సందిగ్ధత ఉంది; దాన్ని ప్రధాన పాఠ్యంలో సమన్వయపరచకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘ఆయనను’ యేసును సూచించే గౌరవప్రద సర్వనామం; మూలంలోని కాలక్రమ సందిగ్ధతను పాదసూచికలో నిలిపాం.
