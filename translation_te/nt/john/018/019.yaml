  rationale: చారిత్రక వివరాన్ని సమన్వయపరచేందుకు వ్యక్తి పేరును ప్రధాన పాఠ్యంలో చేర్చకుండా, సువార్తకర్త ఉపయోగించిన గ్రీకు పదవినామాన్ని నేరుగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే న్యాయసంబంధమైన సందర్భపు గంభీరతను నిలుపుకునే మర్యాదపూర్వక శైలి.
