    text: లేదా, “అడిగాడు.” గ్రీకు క్రియను “అడిగాడు” లేదా “ప్రశ్నించాడు” అని అనువదించవచ్చు; అధికారిక విచారణ సందర్భాన్ని ప్రతిబింబించడానికి “ప్రశ్నించాడు” అని ఎంచుకున్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: మునుపటి సంఘటనల నుంచి కథనాన్ని కొనసాగించే అనుసంధాన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ఇక్కడ కఠినమైన తార్కిక ఫలితాన్ని సూచించే ‘కాబట్టి’ అవసరం లేదు.
- source_word: ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: యూదుల ప్రధాన యాజక పదవికి ప్రామాణికమైన తెలుగు పదబంధం. సందర్భంలోని వ్యక్తి పేరును చేర్చకుండా గ్రీకు మూలంలోని ఏకవచన నిర్దిష్ట పదవినామాన్నే అనువదిస్తుంది.
- source_word: ἠρώτησεν
  choice: ప్రశ్నించాడు
  rationale: క్రియలోని ‘అడిగాడు/ప్రశ్నించాడు’ అనే భావపరిధిలో, అధికారిక విచారణ సందర్భాన్ని ప్రతిబింబిస్తూ ‘విచారించాడు’ కంటే తక్కువ తీవ్రతతో ఉంది.
- source_word: περὶ
  choice: గురించి
  rationale: రెండుసార్లు వచ్చిన ఈ విభక్తి ప్రయోగం ప్రశ్నల విషయాన్ని సూచిస్తుంది; ‘గురించి’ సహజమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: μαθητῶν
  choice: శిష్యులు
  rationale: బోధకుడు–శిష్యుడు సంబంధాన్ని ఖచ్చితంగా నిలుపుతూ సువార్తల సందర్భంలో స్థిరపడిన పదం.
- source_word: διδαχῆς
  choice: బోధ
  rationale: సాంకేతికంగా లేదా తరువాతి సిద్ధాంత వ్యవస్థలను సూచించేలా వినిపించగల ‘సిద్ధాంతం’ కంటే సహజంగా, విస్తృతంగా మూలార్థాన్ని అందిస్తుంది.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: రెండు సందర్భాల్లోనూ యేసును సూచించే గౌరవప్రదమైన ఆధునిక తెలుగు సర్వనామం; ‘ఆయన శిష్యులు’, ‘ఆయన బోధ’ అని స్పష్టతనిస్తుంది.
theological_decisions:
- issue: సందర్భంలో అన్న ఉన్నప్పటికీ ἀρχιερεύς అనే పదవినామాన్ని ఎలా అనువదించాలి
