  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: te
  text: కాబట్టి ప్రధాన యాజకుడు యేసును ఆయన శిష్యుల గురించి, ఆయన బోధ గురించి ప్రశ్నించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
