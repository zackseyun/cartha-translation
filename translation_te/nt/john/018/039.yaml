id: JHN.18.39
reference: John 18:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: te
  text: అయితే, పస్కా పండుగ సమయంలో మీ కోసం ఒకరిని విడుదల చేసే ఆచారం మీకు ఉంది. కాబట్టి నేను యూదుల రాజును మీ కోసం విడుదల చేయాలని మీరు కోరుకుంటున్నారా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయవాసుల రాజును.” గ్రీకు పదం సందర్భానుసారంగా “యూదులు” లేదా “యూదయవాసులు” అనే అర్థం ఇవ్వగలదు; ఇక్కడ అది బాధావృత్తాంతంలో వాడే స్థిరమైన బిరుదులో కనిపిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: ఆచారం
  rationale: వ్యక్తిగత అలవాటును కాకుండా, స్థిరపడిన సామాజిక పద్ధతిని ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: మీ కోసం ఒకరిని విడుదల చేసే
  rationale: ἕνα యొక్క వ్యక్తిని సూచించే భావాన్ని ‘ఒకరిని’ సహజంగా వ్యక్తపరుస్తుంది; ἀπολύσωకు న్యాయపరమైన ఖైదీ విడుదల సందర్భంలో ‘విడుదల చేసే’ సరిపోతుంది.
- source_word: ἀπολύω
  choice: విడుదల చేయు
  rationale: అధికారి ఒక ఖైదీని స్వేచ్ఛగా పంపించే న్యాయపరమైన సందర్భానికి స్పష్టమైన, సహజమైన పదం; రెండు సందర్భాల్లోనూ ఒకే విధంగా ఉంచబడింది.
- source_word: ἐν τῷ πάσχα
  choice: పస్కా పండుగ సమయంలో
  rationale: పండుగ సందర్భంలో అమలయ్యే ఆచారాన్ని సూచించే కాలార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: βούλεσθε οὖν
  choice: కాబట్టి ... కోరుకుంటున్నారా?
  rationale: οὖν యొక్క నిర్గమన సంబంధాన్ని ‘కాబట్టి’ తెలియజేస్తుంది; βούλεσθεను గౌరవప్రదమైన ఆధునిక తెలుగులో ‘కోరుకుంటున్నారా’గా అందిస్తుంది.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: యూదుల రాజు
  rationale: యోహాను శ్రమవృత్తాంతంలో స్థిరమైన రాజసంబంధ ఆరోపణ/బిరుదుగా ఉన్న పదబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: τῶν Ἰουδαίων అనే పదాన్ని రాజబిరుదులో ఎలా అనువదించాలి
  choice: యూదుల రాజు
  alternative: యూదయవాసుల రాజు
  rationale: శ్రమవృత్తాంతంలో ఇది యేసుకు ఆపాదించిన గుర్తింపుపొందిన రాజసంబంధ లేదా మెస్సీయ సంబంధ ఆరోపణ/బిరుదుగా పనిచేస్తుంది. ‘యూదుల’ అనేది ఆ స్థిరమైన చారిత్రక-కథన భావాన్ని నిలుపుతుంది; గ్రీకు పదానికి సందర్భానుసారంగా ప్రాంతీయ అర్థం కూడా ఉండగలదని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే న్యాయపరమైన సందర్భానికి తగిన గౌరవప్రదమైన శైలి. ప్రధాన పాఠంలోని ప్రత్యామ్నాయార్థ సూచిక సంబంధిత వివాదాస్పద పదబంధం వెంట ఉంచబడింది.
