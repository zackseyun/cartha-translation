id: JHN.13.9
reference: John 13:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Σίμων Πέτρος· Κύριε, μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: te
  text: సీమోను పేతురు ఆయనతో, “ప్రభువా,[a] నా పాదాలనే కాదు, నా చేతులను, నా తలను కూడా కడగండి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “యజమానీ.” గ్రీకు: క్యూరియోస్ (Kyrios).'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకు కథన వర్తమాన కాలాన్ని ఆధునిక తెలుగు కథన శైలికి సహజమైన భూతకాలంతో అనువదించాం; సంఘటనార్థం మారదు.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: మూలంలోని పరోక్ష సర్వనామాన్ని అలాగే ఉంచి, సందర్భంలోని యేసును పేరుతో స్పష్టీకరించలేదు.
- source_word: Σίμων Πέτρος
  choice: సీమోను పేతురు
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన పేర్ల రూపాలను ఉపయోగించాం.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: గౌరవపూర్వక ప్రత్యక్ష సంబోధనను, యోహాను సువార్తలోని భావసాంద్రతను నిలుపుతుంది.
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: మాత్రమే కాదు ... కూడా
  rationale: ఒకదానికే పరిమితం కాక అదనంగా మరికొన్నింటిని చేర్చే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοὺς πόδας μου ... τὰς χεῖρας ... τὴν κεφαλήν
  choice: నా పాదాలు ... నా చేతులు, నా తల
  rationale: గ్రీకులో మొదటి అవయవంతో ఉన్న స్వామ్య భావం మిగతా సమన్విత అవయవాలకూ వర్తిస్తుంది; తెలుగులో స్పష్టత కోసం ‘నా’ను పునరుక్తి చేశాం.
- source_word: ellipsis of washing verb
  choice: కడగండి
  rationale: గ్రీకులో క్రియ పూర్వసందర్భం (13:8) నుంచి అధ్యాహారమవుతుంది. తెలుగు వాక్యం సంపూర్ణంగా, సహజంగా ఉండేందుకు అదే భావాన్ని స్పష్టంగా చేర్చాం.
theological_decisions:
- issue: యేసును సంబోధించే κύριος పదం
  choice: ప్రభువా
  alternative: బోధకుడా / యజమానీ
  rationale: κύριοςకు సందర్భానుసారంగా గౌరవసూచక అర్థాలు ఉండగలవు; ‘ప్రభువా’ సాధారణ నూతన నిబంధన ప్రయోగాన్నీ, యోహాను రచనలోని భావసాంద్రతనూ కాపాడుతుంది. ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవభరితమైన సంభాషణా శైలిలో రూపొందించాం. ‘కడగండి’ అనే మర్యాదార్థక రూపం పేతురు యేసును సంబోధించే తీరుకు సరిపోతుంది.
