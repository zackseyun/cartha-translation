review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Simon Peter, the indirect addressee ('to him'), the respectful address Κύριε, and the contrastive extension from feet to hands and head. Making the washing verb explicit is justified by its ellipsis from the immediate context (13:8) and is necessary for a complete Telugu sentence.
  naturalness: The present wording is understandable, but the body-part nouns function as the objects of 'కడగండి' and are more idiomatic and grammatically clear in accusative form. 'నా పాదాలనే కాదు, నా చేతులను, నా తలను కూడా కడగండి' naturally carries the Greek 'not ... only, but also' scope.
  terminology: '''ప్రభువా'' is an appropriate rendering of Κύριε and preserves the title''s respectful and potentially weighty Johannine sense without over-interpreting it. The lexical-alternative footnote remains suitable; the Greek transliteration is standardized as ''క్యూరియోస్.'''
  issues:
  - severity: low
    issue: Object marking for the body parts is unclear/colloquial in the current wording.
    rationale: 'Because ''కడగండి'' is explicitly supplied, formal modern Telugu naturally marks its objects: ''పాదాలనే,'' ''చేతులను,'' and ''తలను.'' This also makes the contrastive construction more fluent.'
  revised_text: సీమోను పేతురు ఆయనతో, “ప్రభువా,[a] నా పాదాలనే కాదు, నా చేతులను, నా తలను కూడా కడగండి” అన్నాడు.
