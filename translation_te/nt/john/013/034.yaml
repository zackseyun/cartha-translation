  terminology: ‘ఆజ్ఞ,’ ‘కొత్త,’ and ‘ప్రేమ’ are accurate, natural, and suitably formal for this context. ‘ఒకరినొకరు’ appropriately retains the reciprocal repetition of ἀλλήλους.
