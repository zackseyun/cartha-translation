id: JHN.13.34
reference: John 13:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: te
  text: 'నేను మీకు ఒక కొత్త ఆజ్ఞ ఇస్తున్నాను: మీరు ఒకరినొకరు ప్రేమించాలి. నేను మిమ్మల్ని ప్రేమించినట్లే, మీరు కూడా ఒకరినొకరు ప్రేమించాలి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రెండవ వాక్యభాగాన్ని, “మీరు కూడా ఒకరినొకరు ప్రేమించేలా” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολὴν
  choice: ఆజ్ఞ
  rationale: యోహాను వాడుకలోని అధికారపూర్వక నైతిక ఆదేశ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καινὴν
  choice: కొత్త
  rationale: కొత్తదనం ఏ విధమైనదో వివరించి పరిమితం చేయకుండా మూలంలోని సాధారణ భావాన్ని నిలుపుతుంది.
- source_word: δίδωμι ὑμῖν
  choice: నేను మీకు ... ఇస్తున్నాను
  rationale: వర్తమాన కాలాన్ని, ఆజ్ఞను నేరుగా అనుగ్రహిస్తున్న గంభీర భావాన్ని సహజమైన తెలుగు క్రియారూపంలో ఉంచుతుంది.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: “మీరు ఒకరినొకరు ప్రేమించాలి” అని
  rationale: మొదటి ἵνα వాక్యభాగాన్ని ఆజ్ఞ యొక్క విషయంగా స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: καθὼς ἠγάπησα ὑμᾶς
  choice: నేను మిమ్మల్ని ప్రేమించినట్లే
  rationale: యేసు ప్రేమను పోలికకు లేదా ప్రమాణానికి ఆధారంగా ఉంచుతూ, καθὼς మరియు గతకాల క్రియ భావాలను కాపాడుతుంది.
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: మీరు కూడా ఒకరినొకరు ప్రేమించాలి
  rationale: καὶ ὑμεῖς లోని ‘మీరు కూడా’ అనే ఉద్ఘాటనను, వాక్యంలోని ఆదేశాత్మక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ‘కొత్త ఆజ్ఞ’లోని కొత్తదనం స్వభావం
  choice: ‘కొత్త ఆజ్ఞ’ అని మాత్రమే అనువదించి, అది ఏ అర్థంలో కొత్తదో ప్రధాన పాఠ్యంలో వివరించలేదు.
  alternative: కాలపరంగా కొత్తది; గుణపరంగా కొత్తది; యేసు ప్రేమలో కొత్తగా సాకారమైనది
  rationale: ఈ వచనం ఆజ్ఞను ‘కొత్తది’ అని చెబుతుంది గాని కొత్తదనం యొక్క ఖచ్చిత స్వభావాన్ని నిర్వచించదు; అందువల్ల theological tension ను పరిష్కరించకుండా నిలుపుతుంది.
- issue: రెండవ ἵνα వాక్యభాగపు సంబంధం
  choice: ఆదేశాత్మక భావంతో ‘మీరు కూడా ... ప్రేమించాలి’ అని ప్రధాన పాఠ్యంలో ఇచ్చింది.
  alternative: ‘మీరు కూడా ఒకరినొకరు ప్రేమించేలా’ అనే ఉద్దేశం/ఫలిత భావం
  rationale: గ్రీకు నిర్మాణం ఆజ్ఞను పునరుద్ఘాటించగలదు లేదా ఉద్దేశం/ఫలితాన్ని సూచించగలదు; ప్రధాన పాఠ్యం సందర్భంలోని ఆదేశ బలాన్ని చూపగా, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడింది. ‘ఒకరినొకరు’ మరియు ‘ప్రేమించాలి’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, మూలపాఠ్యంలోని పదపునరావృతం మరియు నైతిక బలాన్ని కాపాడింది.
