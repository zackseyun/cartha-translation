  text: The disciples were looking at one another, at a loss about whom he was speaking.
translation:
  language: te
  text: శిష్యులు ఒకరి వైపు ఒకరు చూస్తూ, ఆయన ఎవరి గురించి మాట్లాడుతున్నారో తెలియక అయోమయంలో ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శిష్యులు ఒకరి వైపు ఒకరు చూస్తూనే, ఆయన ఎవరి గురించి మాట్లాడుతున్నారో తెలియక తికమకలో ఉన్నారు.”
    reason: ἔβλεπον యొక్క కొనసాగుతున్న లేదా పునరావృత చర్య భావాన్నీ, ἀπορούμενοι యొక్క ప్రత్యామ్నాయ వ్యక్తీకరణనూ చూపిస్తుంది.
lexical_decisions:
- source_word: ἔβλεπον
  choice: చూస్తూ
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న దృశ్యాన్ని సూచిస్తుంది; ‘చూస్తూ’ అనే రూపం ఆ కొనసాగింపును సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: εἰς ἀλλήλους
  choice: ఒకరి వైపు ఒకరు
  rationale: శిష్యులు పరస్పరం చూసుకున్నారనే భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులు
  rationale: నిర్దిష్ట ఉపపదం సందర్భంలో ఇప్పటికే తెలిసిన శిష్యుల సమూహాన్ని సూచిస్తుంది; మూలంలో లేని ‘ఆయన శిష్యులు’ అనే పదాన్ని చేర్చలేదు.
- source_word: ἀπορούμενοι
  choice: తెలియక అయోమయంలో పడ్డారు
  rationale: ఎవరిని ఉద్దేశించారో గ్రహించలేని సందిగ్ధతను సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: περὶ τίνος
  choice: ఎవరి గురించి
  rationale: περίతో వచ్చిన ప్రశ్నార్థక సర్వనామం ఏ వ్యక్తి గురించి అనే ప్రశ్నను సూచిస్తుంది.
- source_word: λέγει
  choice: మాట్లాడుతున్నారో
  rationale: చారిత్రక వర్తమానాన్ని తెలుగు పరోక్ష ప్రశ్నలో సహజంగా కొనసాగుతున్న మాటగా ఇచ్చింది; ‘ఉద్దేశించారో’ అని అర్థాన్ని విస్తరించలేదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. యేసును సూచించే క్రియకు గౌరవార్థక బహువచనం వాడబడింది. మూలపాఠంలోని కొనసాగుతున్న చూపు మరియు శిష్యుల సందిగ్ధత రెండూ నిలుపబడ్డాయి.
