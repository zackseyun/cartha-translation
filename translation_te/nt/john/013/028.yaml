  terminology: ‘ఈ మాట,’ ‘ఎవరికీ ... తెలియలేదు,’ and ‘ఎందుకు అన్నాడో’ are appropriate, natural renderings. ‘భోజన బల్ల దగ్గర ఆనుకొని ఉన్నవారు’ better reflects the source than ‘కూర్చున్నవారు.’
