translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. యేసును సూచించే ‘ఆయన’, యూదాను సూచించే ‘అతను’ ద్వారా మూలంలోని αὐτῷ సంబంధాన్ని సందర్భానుసారంగా స్పష్టంగా ఉంచాం. [a] గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
