  yaml_path: translation/nt/john/013/028.yaml
  text: But none of those reclining at the table knew why he said this to him[a].
translation:
  language: te
  text: అయితే, భోజన బల్ల దగ్గర ఆనుకొని ఉన్నవారిలో[a] ఎవరికీ ఆయన అతనితో ఈ మాట ఎందుకు అన్నాడో తెలియలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా, ‘ఆనుకొని ఉన్నవారిలో’; ఆ కాలంలో భోజనం చేసేటప్పుడు బల్ల దగ్గర ఆనుకొని పడుకోవడం ఆచారం.
    reason: historical-cultural clarification
lexical_decisions:
- source_word: τοῦτο
  choice: ఈ మాట
  rationale: ముందటి వాక్యంలో యేసు పలికిన మాటను సూచించే సర్వనామం. తెలుగులో సందర్భానుసారంగా ‘ఈ మాట’ సహజంగా ఉండి సూచనార్థాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి సంఘటనకు స్వల్ప వ్యత్యాసాన్ని లేదా కథన మలుపును సూచిస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ సహజం.
- source_word: οὐδεὶς
  choice: ఎవరికీ ... తెలియలేదు
  rationale: పూర్తి నిరాకరణను తెలుగులో సహజమైన ప్రతికూల వాక్యనిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ἔγνω
  choice: తెలియలేదు
  rationale: ఇక్కడ γινώσκω వారు ఆ మాట ఉద్దేశాన్ని గ్రహించలేదనే భావాన్ని ఇస్తుంది. ‘తెలియలేదు’ మూలంలోని విస్తృత అర్థాన్ని ఉంచుతుంది; ‘అర్థం కాలేదు’ కూడా సాధ్యమే గాని కొంత వివరణాత్మకం.
- source_word: τῶν ἀνακειμένων
  choice: భోజనానికి కూర్చున్నవారిలో
  rationale: ప్రాచీన భోజనాచారం ప్రకారం పదానికి అక్షరార్థం ‘ఆనుకొని ఉన్నవారు’; ఆధునిక తెలుగు పాఠకులకు భోజన సందర్భాన్ని సహజంగా తెలియజేయడానికి ఈ రూపం ఎంచుకున్నాం.
- source_word: πρὸς τί
  choice: ఎందుకు
  rationale: ఉద్దేశం లేదా ప్రయోజనాన్ని అడిగే ఈ గ్రీకు ప్రయోగానికి ఆధునిక తెలుగులో సహజమైన సమానం ‘ఎందుకు’.
- source_word: εἶπεν αὐτῷ
  choice: ఆయన అతనితో ... అన్నాడో
  rationale: కర్త, పరోక్ష కర్మల మధ్య మూలంలోని భేదాన్ని నిలుపుతూ తెలుగు వాక్యనిర్మాణానికి సహజంగా అనువదించబడింది.
