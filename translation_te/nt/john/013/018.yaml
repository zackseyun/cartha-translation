id: JHN.13.18
reference: John 13:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: te
  text: '“నేను మీ అందరి గురించి చెప్పడం లేదు. నేను ఎవరిని ఎన్నుకున్నానో నాకు తెలుసు. కానీ లేఖనం నెరవేరునట్లు: ‘నా రొట్టె తినేవాడు నాకు వ్యతిరేకంగా తన మడమను ఎత్తాడు.’[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కీర్తన 41:9కు ఉల్లేఖనం లేదా సూచన. “తన మడమను ఎత్తాడు” అనేది విరోధాన్ని, ద్రోహాన్ని సూచించే రూపకం.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: నేను మీ అందరి గురించి చెప్పడం లేదు
  rationale: περὶ యొక్క ‘గురించి’ అనే భావాన్ని, నిరాకరణ పరిధిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οἶδα
  choice: నాకు తెలుసు
  rationale: రూపంలో perfect అయినప్పటికీ, కొయినే గ్రీకులో దీనికి వర్తమానార్థం ఉంది.
- source_word: τίνας ἐξελεξάμην
  choice: నేను ఎవరిని ఏర్పరచుకున్నానో
  rationale: వ్యక్తులను ఉద్దేశించిన τίναςను, ἐκλέγομαιలోని ఎంపిక భావాన్ని కాపాడుతుంది; ఎంపిక ఏ తాత్త్విక వర్గానికి చెందుతుందో అదనంగా నిర్ణయించదు.
- source_word: ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ
  choice: అయితే, … అనే లేఖనం నెరవేరాలి
  rationale: ἵναతో కూడిన నెరవేర్పు భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, కారణనిర్ణయాన్ని అదనంగా చేర్చదు.
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: నా రొట్టె తినేవాడు
  rationale: μουను ἄρτονతో అనుసంధానించి ‘నా రొట్టె’గా తీసుకుంటుంది; substantival participleను సహజంగా ‘తినేవాడు’ అని అందిస్తుంది.
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: నాకు విరోధంగా తన మడమ ఎత్తాడు
  rationale: కీర్తనలోని మడమ రూపకాన్ని చెరపకుండా, ἐπ’ ἐμέలోని విరోధ భావాన్ని స్పష్టంగా తెలుపుతుంది.
theological_decisions:
- issue: యేసు చేసిన ఎంపికకు ద్రోహితో ఉన్న సంబంధం
  choice: ‘నేను ఎవరిని ఏర్పరచుకున్నానో’ అని నేరుగా అనువదించి, ఆ ఎంపిక రక్షణ ఎన్నికా లేక అపొస్తలత్వ నియామకమా అని నిర్ణయించలేదు.
  alternative: యూదాను తప్పిస్తూ రక్షణ ఎన్నికగా లేదా కేవలం అపొస్తల నియామకంగా వివరణాత్మకంగా అనువదించడం.
  rationale: వాక్యం ఎంపికను ప్రస్తావిస్తుంది గాని దాని తాత్త్విక వర్గాన్ని నిర్వచించదు; అందువల్ల మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: ἀλλ’ ἵνα మరియు లేఖన నెరవేర్పు
  choice: ‘అయితే … లేఖనం నెరవేరాలి’ అని అనువదించడం.
  alternative: ద్రోహం లేఖనం వల్ల తప్పనిసరిగా సంభవించిందని నిర్ణయాత్మక కారణాన్ని విస్తరించి చెప్పడం.
  rationale: మూలంలోని లేఖన నెరవేర్పు భావాన్ని ఉంచి, పాఠ్యంలో లేని అదనపు నిర్ణయవాద వివరణను నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. కీర్తన ఉల్లేఖనంలోని ‘మడమ ఎత్తాడు’ అనే రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది.
