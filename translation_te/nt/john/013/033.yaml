id: JHN.13.33
reference: John 13:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: te
  text: చిన్నపిల్లలారా, నేను ఇంకా కొద్దికాలమే మీతో ఉంటాను. మీరు నన్ను వెదకుతారు. ‘నేను వెళ్లే చోటికి మీరు రాలేరు[b]’ అని యూదులకు[a] చెప్పినట్లే, ఇప్పుడు మీకూ చెబుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భాన్ని బట్టి, ‘యూదయ అధికారులకు’ అని కూడా అర్థం కావచ్చు; యోహాను సువార్తలో ‘యూదులు’ అనే పదం కొన్నిసార్లు ప్రత్యేకంగా యూదయ అధికారులను సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: ‘మీరు రావడం సాధ్యం కాదు’ అని కూడా అనువదించవచ్చు. మూలపాఠం రాగల సామర్థ్యం లేదా అవకాశం లేకపోవడాన్ని నేరుగా వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: చిన్నపిల్లలారా
  rationale: సంబోధన రూపంలోని ఈ పదం కుటుంబ అనురాగాన్నీ, చిన్నతనాన్ని సూచించే రూపాన్నీ కలిపి వ్యక్తం చేస్తుంది. ఆధునిక తెలుగులో ‘చిన్నపిల్లలారా’ ఈ రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: ἔτι μικρόν
  choice: ఇంకా కొద్దికాలమే
  rationale: మిగిలి ఉన్న స్వల్ప సమయాన్ని సూచించే గ్రీకు ప్రయోగం. ‘ఇంకా కొద్దికాలమే’ కాలపరిమితినీ వాక్యంలోని గంభీరతనూ సహజంగా తెలియజేస్తుంది.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: మీతో ఉంటాను
  rationale: ప్రస్తుత సన్నిధిని సూచిస్తుంది. తెలుగులో స్వల్పకాల సూచనతో కలిసినప్పుడు ‘ఉంటాను’ సహజంగా ఉంటుంది.
- source_word: ζητήσετέ με
  choice: మీరు నన్ను వెదకుతారు
  rationale: ζητέω పదంలోని వెదకడం లేదా అన్వేషించడం అనే భావాన్ని ‘వెదకుతారు’ నిలుపుతుంది; కేవలం చూడటానికి ప్రయత్నించడం అనే తేలికైన భావానికి పరిమితం చేయదు.
- source_word: καθὼς εἶπον τοῖς Ἰουδαίοις
  choice: యూదులకు చెప్పినట్లే
  rationale: Ἰουδαίοις‌ను సందర్భం బలవంతం చేయనప్పుడు ‘యూదులు’ అనే విస్తృత మూలార్థంతో ఉంచి, καθώς యొక్క పోలికను ‘చెప్పినట్లే’ ద్వారా వ్యక్తం చేసింది.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: నేను వెళ్లే చోటికి
  rationale: ὑπάγω ఇక్కడ వెళ్లిపోవడాన్ని సూచిస్తుంది. తెలుగులో ‘వెళ్లే చోటికి’ సహజంగా ఉండి గమ్యార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: మీరు రాలేరు
  rationale: రాగల సామర్థ్యం లేదా అవకాశం లేకపోవడాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; దానికి కారణమేమిటో అనువాదం అదనంగా నిర్ణయించదు.
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: ఇప్పుడు మీకూ చెబుతున్నాను
  rationale: ముందు యూదులకు చెప్పిన మాటను ఇప్పుడు శిష్యులకు కూడా వర్తింపజేస్తున్న సమాంతర సంబంధాన్ని ‘మీకూ’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో Ἰουδαίοις పదానికి ఉన్న సూచన పరిధి
  choice: యూదులకు
  alternative: యూదా నాయకులకు
  rationale: మూలపదం నేరుగా ‘యూదులు’ అని అర్థమిస్తుంది. యోహానులో కొన్ని సందర్భాల్లో అది ప్రత్యేకంగా యూదా అధికారులను సూచించవచ్చు; అయితే ఈ వచనం మాత్రమే దాని పరిధిని నాయకులకు పరిమితం చేయదు. కాబట్టి ప్రధాన పాఠంలో విస్తృత రూపాన్ని ఉంచి, సందర్భానుసార ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: శిష్యులు యేసు వెళ్లే చోటికి రాలేరనే మాటలోని అసమర్థత స్వభావం
  choice: కారణాన్ని వివరించకుండా ‘మీరు రాలేరు’
  alternative: మీరు రావడం సాధ్యం కాదు
  rationale: οὐ δύνασθε సామర్థ్యం లేదా సాధ్యత లేకపోవడాన్ని చెబుతుంది; అది శాశ్వత నిషేధమా, తాత్కాలిక అసాధ్యతా అనే విషయాన్ని ఈ వాక్యం ఒంటరిగా పరిష్కరించదు. అందువల్ల ఆ ఉద్రిక్తతను వివరణతో తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గౌరవగంభీరమైన శైలి వాడబడింది. ‘చిన్నపిల్లలారా’లోని అనురాగం నిలుపబడింది; వాక్య సంబంధం స్పష్టంగా ఉండేందుకు తెలుగులో సహజమైన పదక్రమం పాటించబడింది.
