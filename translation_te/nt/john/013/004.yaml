id: JHN.13.4
reference: John 13:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγείρεται ἐκ τοῦ δείπνου καὶ τίθησιν τὰ ἱμάτια καὶ λαβὼν λέντιον διέζωσεν ἑαυτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: te
  text: ఆయన భోజనం దగ్గర నుంచి లేచి, తన పైవస్త్రాలను పక్కన పెట్టి, ఒక తువాలు తీసుకొని దానిని తన నడుముకు చుట్టుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγείρεται ἐκ τοῦ δείπνου
  choice: భోజనం దగ్గర నుంచి లేచి
  rationale: ἐγείρεται అనే చారిత్రక వర్తమానాన్ని తెలుగు కథనశైలికి సహజంగా క్రియాక్రమంలో చూపిస్తూ, ἐκ τοῦ δείπνουను భోజనం జరుగుతున్న స్థలం లేదా సందర్భం నుంచి లేవడంగా అనువదిస్తుంది.
- source_word: τίθησιν τὰ ἱμάτια
  choice: తన పైవస్త్రాలను పక్కన పెట్టి
  rationale: ఈ సందర్భంలో τίθησιν అంటే కేవలం ఉంచడం కాక తొలగించి పక్కన పెట్టడం. ἱμάτιαను ‘పైవస్త్రాలు’గా ఇవ్వడం ఆయన పూర్తిగా బట్టలు విప్పాడనే అనవసర భావాన్ని నివారిస్తుంది.
- source_word: λαβὼν λέντιον
  choice: ఒక తువాలు తీసుకొని
  rationale: λέντιον సేవలో ఉపయోగించే నారబట్ట లేదా తువాలును సూచిస్తుంది; ఆధునిక తెలుగులో ‘తువాలు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: διέζωσεν ἑαυτόν
  choice: దానిని తన నడుముకు చుట్టుకున్నాడు
  rationale: διαζώννυμι తన చుట్టూ, సాధారణంగా నడుముకు, కట్టుకోవడాన్ని సూచిస్తుంది. ముందున్న తువాలును ‘దానిని’ అని స్పష్టపరచడం తెలుగులో సహజం.
theological_decisions: []
translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన, సహజమైన క్రియాక్రమం పాటించబడింది. గ్రీకు చారిత్రక వర్తమానం తెలుగులో అసహజత రాకుండా భూతకాల కథనరూపంలో వ్యక్తమైంది.
