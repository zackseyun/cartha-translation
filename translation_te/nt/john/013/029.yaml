translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. గ్రీకు వాక్యంలోని రెండు ప్రత్యామ్నాయ ఊహలను ‘అనో ... అనో’ నిర్మాణంతో నిలిపి ఉంచాం.
