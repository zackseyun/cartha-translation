id: JHN.13.29
reference: John 13:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: te
  text: యూదా దగ్గర డబ్బు పెట్టె[a] ఉండేది కాబట్టి, కొందరు యేసు అతనికి పండుగకు[b] మనకు అవసరమైనవి కొనమని లేదా పేదలకు ఏమైనా ఇవ్వమని చెబుతున్నాడని అనుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “డబ్బు సంచి.” గ్రీకు పదం సమూహపు డబ్బును ఉంచే పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “పండుగ” అనేది ఈ సందర్భంలోని పస్కా పండుగను సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: అక్కడున్నవారిలో కొందరు
  rationale: ఇది అక్కడ ఉన్న శిష్యులలో కొందరిని సూచించే అనిర్దిష్ట బహువచనం; సందర్భాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: ἐδόκουν
  choice: అనుకున్నారు
  rationale: వారు పరిస్థితిని బట్టి చేసిన ఊహను సహజమైన తెలుగు కథన శైలిలో తెలియజేస్తుంది.
- source_word: ἐπεὶ
  choice: కాబట్టి
  rationale: యూదా డబ్బు పెట్టెను కలిగి ఉండడమే వారి ఊహకు కారణమని తెలియజేస్తుంది.
- source_word: γλωσσόκομον
  choice: డబ్బు పెట్టె
  rationale: సమూహపు నిధులను ఉంచే పాత్రను సూచించే గ్రీకు పదానికి పారదర్శకమైన, ప్రత్యేక రూపాన్ని అనవసరంగా నిర్దేశించని అనువాదం.
- source_word: εἶχεν
  choice: దగ్గర ... ఉండేది
  rationale: మూలంలోని సాధారణ ‘కలిగి ఉండడం/తన దగ్గర ఉంచుకోవడం’ భావాన్ని కాపాడుతూ, నిధుల సంరక్షణ బాధ్యతను పాఠంలో అదనంగా చేర్చదు.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: యేసు అతనితో ... చెబుతున్నాడని
  rationale: చారిత్రక వర్తమానాన్ని తెలుగు కథనంలో సహజంగా పరోక్ష వాక్య నిర్మాణంతో అందిస్తుంది.
- source_word: Ἀγόρασον
  choice: కొనుక్కో
  rationale: ఏకవచన ఆజ్ఞను సూటిగా, ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὧν χρείαν ἔχομεν
  choice: మనకు అవసరమైనవి
  rationale: సాపేక్ష వాక్య నిర్మాణానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: εἰς τὴν ἑορτήν
  choice: పండుగకు
  rationale: మతపరమైన పండుగను సూచిస్తుంది; ఈ వచనంలో పేరును నేరుగా చేర్చకుండా పస్కా సందర్భాన్ని నిలుపుతుంది.
- source_word: τοῖς πτωχοῖς
  choice: పేదలకు
  rationale: పేద ప్రజలను సూచించే విశేషణపు నామవాచక ప్రయోగానికి సహజమైన తెలుగు రూపం.
- source_word: ἵνα τι δῷ
  choice: ఏమైనా ఇవ్వమని
  rationale: శిష్యులు ఊహించిన ఉద్దేశిత కార్యాన్ని పరోక్ష వాక్యంలో సహజంగా తెలియజేస్తుంది.
