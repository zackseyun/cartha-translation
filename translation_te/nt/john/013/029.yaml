  terminology: “డబ్బు పెట్టె” is a suitable rendering of γλωσσόκομον, with “డబ్బు సంచి” appropriately retained as a lexical alternative. “పండుగ” preserves the wording of the verse without inserting ‘Passover’ into the text; the footnote supplies the context.
