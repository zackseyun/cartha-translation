  - severity: low
    issue: “యేసు అతనితో ... చెబుతున్నాడని” is less natural Telugu for reporting a command to a person.
    rationale: Using “అతనికి ... కొనమని లేదా ... ఇవ్వమని చెబుతున్నాడని” naturally represents λέγει αὐτῷ and retains both alternatives in the disciples’ inference.
