id: JHN.13.20
reference: John 13:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: te
  text: '“నిజంగా, నిజంగా, నేను మీతో చెబుతున్నాను: నేను పంపే ఎవరినైనా స్వీకరించేవాడు నన్ను స్వీకరిస్తాడు; నన్ను స్వీకరించేవాడు నన్ను పంపినవానిని[a] స్వీకరిస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నన్ను పంపినవాడు” అనేది ఈ సందర్భంలో తండ్రిని సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: యోహాను సువార్తలోని గంభీరమైన, రెండుసార్లు పలికే ధృవీకరణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: λέγω ὑμῖν
  choice: మీతో చెబుతున్నాను
  rationale: ప్రత్యక్ష సంభాషణ సూత్రాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ λαμβάνων ἄν τινα πέμψω
  choice: నేను పంపే ఎవరినైనా స్వీకరించేవాడు
  rationale: ἄν, τινα, subjunctive πέμψω కలిగించే అనిర్దిష్ట విస్తృతిని—యేసు పంపే ఏ వ్యక్తినైనా—నిలుపుతుంది.
- source_word: λαμβάνει
  choice: స్వీకరిస్తాడు
  rationale: వ్యక్తిని స్వీకరించడం లేదా అంగీకరించడం అనే విస్తృత భావాన్ని ఇస్తూ, వాక్యమంతటా ఉన్న పదపునరుక్తిని కాపాడుతుంది.
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: నన్ను స్వీకరించేవాడు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతకన్నా అనుసంధానాన్ని సూచిస్తుంది; తెలుగు సమాంతర నిర్మాణంలో ప్రత్యేక సంధాయకం లేకుండానే సంబంధం స్పష్టంగా ఉంటుంది.
- source_word: τὸν πέμψαντά με
  choice: నన్ను పంపినవానిని
  rationale: మూలంలోని సంబంధాత్మక వర్ణనను కాపాడి, వాక్యంలో ప్రత్యక్షంగా లేని ‘తండ్రి’ అనే బిరుదును ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: ‘నన్ను పంపినవాడు’ ఎవరు అనే గుర్తింపు
  choice: నన్ను పంపినవానిని
  alternative: నన్ను పంపిన తండ్రిని
  rationale: యోహాను సందర్భంలో ఇది తండ్రిని సూచిస్తుంది; అయితే ఈ వాక్యం స్వయంగా ‘తండ్రి’ అని కాక సంబంధాత్మకంగా చెబుతుంది. అందువల్ల ప్రధాన పాఠ్యం మూల రూపాన్ని నిలుపుతుంది; పాదసూచిక సందర్భార్థాన్ని తెలుపుతుంది.
- issue: పుంలింగ ఏకవచన కృదంతాల సాధారణ ప్రయోగం
  choice: ఎవరినైనా స్వీకరించేవాడు / స్వీకరించేవాడు
  alternative: ఆ పురుషుణ్ణి స్వీకరించేవాడు
  rationale: మూలంలోని వ్యాకరణ పుంలింగం పురుషులకు మాత్రమే పరిమితం కాదు; ఇది సాధారణంగా ఎవరికైనా వర్తించే ప్రతినిధి ప్రయోగం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. λαμβάνει పదపునరుక్తిని ‘స్వీకరిస్తాడు’గా క్రమంగా నిలిపాం. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోలుతుంది.
