id: JHN.13.12
reference: John 13:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἔνιψεν τοὺς πόδας αὐτῶν ⸀καὶ ἔλαβεν τὰ ἱμάτια αὐτοῦ ⸂καὶ ἀνέπεσεν⸃, πάλιν εἶπεν αὐτοῖς· Γινώσκετε τί πεποίηκα ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: te
  text: 'ఆయన వారి పాదాలు కడిగి, తన వస్త్రాలు తీసుకొని, మళ్లీ భోజనానికి వాలిన తరువాత[a], వారితో ఇలా అన్నాడు: “నేను మీకు చేసినది ఏమిటో మీకు అర్థమవుతోందా?”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మళ్లీ కూర్చున్నాడు.” గ్రీకు క్రియ భోజన బల్లవద్ద వాలడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “మీకు చేసినది” అనే మాటకు “మీ కోసం చేసినది” లేదా “మీ పట్ల చేసినది” అనే భావాలు ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: తరువాత
  rationale: ὅτε సూచించే కాలసంబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ‘...తరువాత’గా తెలిపాం; οὖν యొక్క కథన కొనసాగింపు సందర్భం ద్వారా వ్యక్తమవుతుంది.
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: వారి పాదాలు కడిగి
  rationale: క్రియ పూర్తయిన తరువాతి చర్యలను తెలిపే తెలుగు అసమాపక క్రియారూపం మూలంలోని కాలక్రమాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: తన వస్త్రాలు తీసుకొని
  rationale: ἔλαβεν యొక్క ప్రత్యక్ష అర్థమైన ‘తీసుకున్నాడు’ను నిలిపాం; ‘ధరించి’ అని అనువదిస్తే సందర్భం ఆధారంగా అర్థాన్ని స్పష్టీకరించినా మూల క్రియకన్నా ఎక్కువ వ్యాఖ్యానం అవుతుంది. ἱμάτιαను సాధారణంగా ‘వస్త్రాలు’గా ఉంచాం.
- source_word: καὶ ἀνέπεσεν
  choice: మళ్లీ భోజనానికి వాలిన
  rationale: భోజన సందర్భంలో ἀναπίπτω బల్లవద్ద వాలి భోజనం చేసే ప్రాచీన భంగిమను సూచిస్తుంది; ‘కూర్చున్న’ కంటే ‘భోజనానికి వాలిన’ చారిత్రక చిత్రాన్ని మెరుగ్గా కాపాడుతుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: పునరావృత్తిని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: εἶπεν αὐτοῖς
  choice: వారితో ఇలా అన్నాడు
  rationale: తెలుగులో సంభాషణను ప్రవేశపెట్టే సహజమైన, తటస్థ రూపం.
- source_word: Γινώσκετε
  choice: మీకు అర్థమవుతోందా
  rationale: ఇక్కడ ప్రశ్న కేవలం జరిగిన కార్యాన్ని గుర్తించడంపై కాక దాని భావాన్ని గ్రహించడంపై ఉంది; అందువల్ల ‘తెలుసా’ కంటే ‘అర్థమవుతోందా’ సందర్భోచితం.
- source_word: τί πεποίηκα ὑμῖν
  choice: నేను మీకు చేసినది ఏమిటో
  rationale: πεποίηκα చేసిన కార్యం యొక్క కొనసాగుతున్న ప్రాముఖ్యతను సందర్భం మోస్తుంది. తెలుగు ‘మీకు చేశాను’లో ὑμῖν యొక్క ప్రయోజనార్థకమైన ‘మీ కోసం’ భావమూ, సాధారణ ‘మీ పట్ల/మీకు’ భావమూ సహజంగా తెరిచి ఉంటాయి.
theological_decisions:
- issue: పాదాలు కడిగిన తరువాత యేసు తీసుకున్న భోజన భంగిమ
  choice: మళ్లీ భోజనానికి వాలిన
  alternative: మళ్లీ కూర్చున్న
  rationale: మూల క్రియ ప్రాచీన కాలంలో బల్లవద్ద వాలి భోజనం చేయడాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో ఆ చారిత్రక చిత్రాన్ని ఉంచి, సాధారణ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: ὑμῖν యొక్క భావం
  choice: మీకు
  alternative: మీ కోసం
  rationale: గ్రీకు దత్తివిభక్తి ఇక్కడ ‘మీకు/మీ పట్ల’ లేదా ప్రయోజనార్థకంగా ‘మీ కోసం’ అనే భావాన్ని ఇవ్వగలదు. తెలుగు ‘మీకు’ ఈ నిజమైన సందిగ్ధతను సహజంగా కాపాడుతుంది; సేవాభావాన్ని ‘మీ కోసం’ అని మాత్రమే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ప్రాచీన భోజన భంగిమను ప్రధాన పాఠ్యంలో సంక్షిప్తంగా స్పష్టం చేసి, ὑμῖνలోని అర్థ విస్తృతిని పాదటిప్పణిలో నిలిపాం.
