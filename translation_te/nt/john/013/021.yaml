revisions:
- from: 'ఇవి చెప్పిన తరువాత యేసు ఆత్మలో కలత చెంది, సాక్ష్యమిస్తూ ఇలా అన్నాడు: “నిజంగా, నిజంగా నేను మీతో చెబుతున్నాను: మీలో ఒకడు నాకు ద్రోహం చేస్తాడు[a].”'
  to: 'ఇవి చెప్పిన తరువాత యేసు ఆత్మలో కలత చెంది, సాక్ష్యమిచ్చి ఇలా అన్నాడు: “నిజంగా, నిజంగా నేను మీతో చెబుతున్నాను: మీలో ఒకడు నాకు ద్రోహం చేస్తాడు[a].”'
  rationale: Only the rendering of ἐμαρτύρησεν καὶ εἶπεν is adjusted, so that the Telugu reflects the Greek’s coordinated completed actions rather than an ongoing participial action. All other wording and the properly anchored lexical footnote are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:30:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the temporal participle, Jesus’ disturbance ‘in spirit,’ the doubled ἀμήν, the partitive ‘one of you,’ and the contextual sense ‘betray.’ The footnote appropriately preserves the more literal sense of παραδώσει. However, ‘సాక్ష్యమిస్తూ ఇలా అన్నాడు’ presents the witnessing as simultaneous/ongoing, whereas ἐμαρτύρησεν καὶ εἶπεν consists of two coordinated aorist actions: he testified and spoke.'
  naturalness: The Telugu is modern, clear, and suitably solemn. Recasting the coordinated verbs as ‘సాక్ష్యమిచ్చి ఇలా అన్నాడు’ is more idiomatic in this sentence and better reflects their completed sequential presentation.
  terminology: ‘ఆత్మలో కలత చెందాడు,’ ‘నిజంగా, నిజంగా,’ and ‘ద్రోహం చేస్తాడు’ are appropriate modern-standard Telugu renderings. The footnote’s ‘నన్ను అప్పగిస్తాడు’ correctly records the lexical alternative without displacing the contextual meaning in the text.
  issues:
  - severity: low
    issue: Aspectual relation of ἐμαρτύρησεν καὶ εἶπεν
    rationale: '‘సాక్ష్యమిస్తూ’ is an imperfective participial form and can imply that Jesus spoke while testifying. The Greek uses coordinated aorists, best rendered as completed, coordinated actions: ‘సాక్ష్యమిచ్చి ఇలా అన్నాడు’ (or equivalent).'
  revised_text: 'ఇవి చెప్పిన తరువాత యేసు ఆత్మలో కలత చెంది, సాక్ష్యమిచ్చి ఇలా అన్నాడు: “నిజంగా, నిజంగా నేను మీతో చెబుతున్నాను: మీలో ఒకడు నాకు ద్రోహం చేస్తాడు[a].”'
  revised_footnotes:
