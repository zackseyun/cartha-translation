id: JHN.13.21
reference: John 13:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: te
  text: 'ఇవి చెప్పిన తరువాత యేసు ఆత్మలో కలత చెంది, సాక్ష్యమిచ్చి ఇలా అన్నాడు: “నిజంగా, నిజంగా నేను మీతో చెబుతున్నాను: మీలో ఒకడు నాకు ద్రోహం చేస్తాడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నన్ను అప్పగిస్తాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: ఇవి చెప్పిన తరువాత
  rationale: Aorist participleను సహజమైన కాలసూచక ఉపవాక్యంగా అనువదించి, ముందుగా చెప్పిన మాటల తరువాత జరిగిన క్రమాన్ని నిలుపుతుంది.
- source_word: ἐταράχθη τῷ πνεύματι
  choice: ఆత్మలో కలత చెంది
  rationale: τῷ πνεύματι సూచించే అంతరంగ పరిధిని నిలుపుతూ, గ్రీకులో స్పష్టంగా లేని అదనపు తీవ్రతను చేర్చదు.
- source_word: ἐμαρτύρησεν καὶ εἶπεν
  choice: సాక్ష్యమిస్తూ ఇలా అన్నాడు
  rationale: యోహాను రచనలో μαρτυρέωకు ఉన్న గంభీరమైన సాక్ష్యప్రకటన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: యోహాను సువార్తలోని గంభీరమైన ద్విరుక్తిని అనువాదంలోనూ అలాగే ఉంచుతుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: యేసు నేరుగా శిష్యులను ఉద్దేశించి చెప్పే గంభీరమైన ప్రకటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἷς ἐξ ὑμῶν
  choice: మీలో ఒకడు
  rationale: భాగసూచక గ్రీకు ప్రయోగానికి సహజమైన తెలుగు సమానార్థకం; ఆ వ్యక్తి శిష్యులలోనే ఒకడనే దిగ్భ్రాంతికర భావాన్ని నిలుపుతుంది.
- source_word: παραδώσει με
  choice: నాకు ద్రోహం చేస్తాడు
  rationale: ఈ సందర్భంలో παραδίδωμι యూదా చేసిన విశ్వాసఘాతక చర్యను సూచిస్తుంది. సాధారణ పాఠకునికి సందర్భార్థాన్ని స్పష్టంగా తెలియజేయడానికి ‘ద్రోహం చేస్తాడు’ ఎంచుకోబడింది; ‘నన్ను అప్పగిస్తాడు’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయం పాదటిప్పణిలో నిలుపబడింది.
theological_decisions:
- issue: యేసు అంతరంగ కలతను వ్యక్తం చేయడం
  choice: ఆత్మలో కలత చెంది
  alternative: తన ఆత్మలో కలత చెంది; ఆత్మలో తీవ్రంగా కలత చెంది
  rationale: యేసు అనుభవించిన నిజమైన అంతరంగ కలతను తగ్గించకుండా తెలియజేస్తుంది; అదే సమయంలో మూలంలో లేని తీవ్రతను లేదా తరువాతి సిద్ధాంత వివరణను చేర్చదు.
- issue: ద్రోహ సూచనలో παραδίδωμι అనువాదం
  choice: నాకు ద్రోహం చేస్తాడు
  alternative: నన్ను అప్పగిస్తాడు
  rationale: తక్షణ సందర్భంలోని విశ్వాసఘాతక భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా అందిస్తుంది. అయితే ‘అప్పగించడం’ అనే మూలపద విస్తృతార్థం శ్రమవృత్తాంతంలో ప్రాముఖ్యమైనందున పాదటిప్పణిలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘నిజంగా, నిజంగా’ అనే ద్విరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది. పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
