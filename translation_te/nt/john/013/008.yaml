id: JHN.13.8
reference: John 13:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: te
  text: పేతురు ఆయనతో ఇలా అన్నాడు, “మీరు ఎన్నటికీ నా పాదాలను కడగరు.” యేసు అతనికి జవాబిచ్చాడు, “నేను నిన్ను కడగకపోతే, నాతో నీకు ఏ భాగమూ ఉండదు.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాతో నీకు భాగస్వామ్యం ఉండదు.”
    reason: μέρος అనే పదం ‘భాగం’తో పాటు సంబంధంలో లేదా కార్యంలో పాలుపంచుకోవడం అనే భావాన్నీ ఇవ్వగలదు.
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς … εἰς τὸν αἰῶνα
  choice: ఎన్నటికీ … కడగనే కూడదు
  rationale: οὐ μή అనే బలమైన నిరాకరణను, εἰς τὸν αἰῶνα దానిని మరింత తీవ్రం చేసే భావాన్ని కలిపి, పేతురు గట్టి నిరాకరణ సహజమైన ఆధునిక తెలుగులో వ్యక్తమయ్యేలా అనువదించబడింది.
- source_word: μου τοὺς πόδας
  choice: నా పాదాలు
  rationale: గ్రీకులోని స్పష్టమైన స్వామ్యసంబంధాన్ని, బహువచన కర్మను నేరుగా నిలుపుతుంది.
- source_word: Ἐὰν μὴ νίψω σε
  choice: నేను నిన్ను కడగకపోతే
  rationale: షరతు నిర్మాణాన్నీ, ‘నిన్ను’ అనే విస్తృత కర్మనూ యథాతథంగా ఉంచుతుంది; ఇక్కడ ‘నీ పాదాలు’ అని పరిమితం చేయలేదు.
- source_word: οὐκ ἔχεις μέρος μετ’ ἐμοῦ
  choice: నాతో నీకు ఏ భాగమూ ఉండదు
  rationale: μέρος అనే పదంలోని భాగం, వాటా, పాలుపంచుకోవడం వంటి విస్తృత భావాన్ని అతిగా సిద్ధాంతీకరించకుండా నిలుపుతూ, μετάకు సరైన ‘నాతో’ అనే సహవాసార్థాన్ని కాపాడుతుంది.
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: యేసు అతనికి … అని జవాబిచ్చాడు
  rationale: సహజమైన తెలుగు కథన క్రమంలో గ్రీకు ప్రతిస్పందన క్రియను స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: యేసుతో μέρος కలిగి ఉండడం అనే మాట యొక్క భావం
  choice: ‘నాతో నీకు ఏ భాగమూ ఉండదు’ అని విస్తృతమైన భాగస్వామ్య/సంబంధ భావాన్ని నిలిపివేయడం
  alternative: దీనిని ప్రత్యేకంగా సంస్కార శుద్ధి, వినయపూర్వక సేవ, లేదా రక్షణలో భాగస్వామ్యం అని నిర్వచించడం
  rationale: యేసు కడగడం అవసరమని వాక్యం స్పష్టంగా చెబుతుంది; అయితే ఆ అవసరానికి సంబంధించిన ఖచ్చితమైన సిద్ధాంత విధానాన్ని ఈ గ్రీకు వాక్యం నిర్వచించదు. అందువల్ల అనువాదం ఆ ఉద్దేశపూర్వక విస్తృతతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవసూచకంగా పేతురు యేసును ‘మీరు’ అని సంబోధిస్తాడు. యేసు పేతురును ‘నీవు’ రూపంలో సంబోధించడం మూలంలోని ఏకవచన ప్రత్యక్షతను సహజంగా నిలుపుతుంది. ‘కడగనే కూడదు’ పేతురు పలికిన గట్టి నిరాకరణను తెలియజేస్తుంది.
