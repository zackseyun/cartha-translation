- from: పేతురు ఆయనతో, “మీరు ఎన్నటికీ నా పాదాలు కడగనే కూడదు” అన్నాడు. యేసు అతనికి, “నేను నిన్ను కడగకపోతే, నాతో నీకు ఏ భాగమూ ఉండదు[a]” అని జవాబిచ్చాడు.
