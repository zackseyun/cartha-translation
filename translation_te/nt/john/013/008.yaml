  revision_rationale: 'Peter''s refusal is revised from a prohibition-like expression to an emphatic future denial, matching the force of οὐ μή with εἰς τὸν αἰῶνα. The remainder retains the source''s scope: Jesus says ‘wash you,’ not merely ‘wash your feet,’ and μέρος is left broad rather than doctrinally narrowed.'
