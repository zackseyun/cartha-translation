review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Peter's emphatic future refusal (οὐ μὴ ... εἰς τὸν αἰῶνα), the explicit object ‘my feet,’ Jesus' conditional ‘if I do not wash you,’ and the deliberately broad μέρος μετ’ ἐμοῦ. However, ‘కడగనే కూడదు’ is a prohibition-like construction (‘must not wash’) rather than the source's emphatic declaration/refusal about what Jesus will do.
  naturalness: The wording is generally modern and clear. Recasting Peter's words as ‘మీరు ఎన్నటికీ ... కడగరు’ gives a natural Telugu emphatic future denial without changing its force.
  terminology: ‘భాగం’ appropriately preserves the broad, non-doctrinal sense of μέρος. The footnote supplies the relational-participation nuance as a legitimate alternative without defining a theological mechanism.
  issues:
  - severity: medium
    issue: ‘కడగనే కూడదు’ does not naturally express the Greek emphatic future denial.
    rationale: The construction reads as a prohibition or necessity not to wash. Οὐ μὴ νίψῃς ... εἰς τὸν αἰῶνα is Peter's forceful refusal that Jesus will never wash his feet; ‘మీరు ఎన్నటికీ ... కడగరు’ conveys this directly.
  revised_text: పేతురు ఆయనతో ఇలా అన్నాడు, “మీరు ఎన్నటికీ నా పాదాలను కడగరు.” యేసు అతనికి జవాబిచ్చాడు, “నేను నిన్ను కడగకపోతే, నాతో నీకు ఏ భాగమూ ఉండదు.[a]”
