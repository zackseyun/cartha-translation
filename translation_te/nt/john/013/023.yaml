  text: ⸀ἦν ἀνακείμενος εἷς ⸀ἐκ τῶν μαθητῶν αὐτοῦ ἐν τῷ κόλπῳ τοῦ Ἰησοῦ, ὃν ἠγάπα ὁ Ἰησοῦς·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: te
  text: యేసు ప్రేమించిన ఆయన శిష్యుల్లో ఒకడు భోజన సమయంలో యేసు పక్కనే ఆనుకొని ఉన్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “యేసు వక్షస్థలంలో.” ప్రాచీన కాలంలో భోజనానికి ఆనుకొని ఉండే పద్ధతిలో, ఒకరు మరొకరి పక్కనే ఉన్న స్థానాన్ని ఈ మాట వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακείμενος
  choice: భోజనానికి … ఆనుకొని కూర్చున్నాడు
  rationale: ఈ పదం ప్రాచీన కాలంలో భోజనం చేసేటప్పుడు ఆనుకొని కూర్చునే భంగిమను సూచిస్తుంది. కేవలం ‘కూర్చున్నాడు’ అనకుండా భోజన సందర్భాన్నీ, శరీర భంగిమనూ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: ఆయన శిష్యుల్లో ఒకడు
  rationale: గ్రీకు భాషలోని భాగసూచక ప్రయోగాన్ని సహజంగా, నేరుగా వ్యక్తం చేస్తుంది; ‘ఆయన’ యేసును సూచిస్తుంది.
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: యేసు పక్కనే
  rationale: భోజనానికి ఆనుకొని కూర్చున్నవారిలో ఈ శిష్యుడు యేసుకు అత్యంత సమీప స్థానంలో ఉన్నాడనే సందర్భార్థాన్ని ఆధునిక పాఠకులకు అపార్థం కాకుండా తెలియజేస్తుంది. పదశః రూపాన్ని పాదసూచికలో భద్రపరిచాం.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: యేసు ప్రేమించిన
  rationale: ἀγαπάω అనే క్రియకు సహజమైన, ప్రాథమిక సమానార్థమైన ‘ప్రేమించు’ను వాడి సంబంధ వాక్యాన్ని సంక్షిప్తంగా నిలిపింది.
theological_decisions:
- issue: యేసుకు ప్రియమైన శిష్యుని భోజనస్థానాన్ని ఎలా వ్యక్తం చేయాలి
  choice: ప్రధాన పాఠ్యంలో ‘యేసు పక్కనే’ అని సందర్భానుసారంగా అనువదించడం
  alternative: ‘యేసు రొమ్మున’ లేదా ‘యేసు వక్షస్థలంలో’ అని పదశః అనువదించడం
  rationale: ఈ మాట ప్రధానంగా భోజన సమయంలో పక్కపక్కనే ఆనుకొని కూర్చునే ఏర్పాటును వర్ణిస్తుంది; మర్మమైన ఐక్యతను స్పష్టంగా బోధించే వ్యాఖ్యగా మార్చకూడదు. అయితే యోహాను రచనలో ఈ పదబంధానికి ఉండగల ప్రతిధ్వనిని చెరపకుండా పదశః రూపాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ప్రాచీన భోజన భంగిమను తెలియజేయడానికి ‘ఆనుకొని కూర్చున్నాడు’ అని, అపార్థానికి దారితీయగల పదశః చిత్రాన్ని ప్రధాన పాఠ్యంలో కాక పాదసూచికలో ఉంచాం.
