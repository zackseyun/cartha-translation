id: JHN.13.31
reference: John 13:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: te
  text: 'అతడు బయటకు వెళ్లిన తరువాత, యేసు ఇలా అన్నాడు: “ఇప్పుడు మనుష్యకుమారుడు మహిమపరచబడ్డాడు; దేవుడు ఆయనలో[a] మహిమపరచబడ్డాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన ద్వారా.” గ్రీకు పదబంధాన్ని దేవుడు ఆయనలో మహిమపరచబడ్డాడని గానీ, ఆయన ద్వారా మహిమపరచబడ్డాడని గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: వెళ్లిన తరువాత
  rationale: ὅτε యొక్క కాలసంబంధ భావాన్ని సహజమైన తెలుగు కథనశైలిలో వ్యక్తం చేస్తుంది; οὖν సూచించే కథన పురోగతి సందర్భంలో అంతర్లీనంగా నిలుస్తుంది.
- source_word: ἐξῆλθεν
  choice: బయటకు వెళ్లిన
  rationale: ἐξέρχομαι లోని బయటకు వెళ్లడం అనే స్థలసంబంధ భావాన్ని నిలుపుతుంది; ముందరి సందర్భంలో యూదా వెళ్లిపోవడాన్ని సూచిస్తుంది.
- source_word: λέγει
  choice: ఇలా అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, ఆధునిక తెలుగు కథనంలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: Νῦν
  choice: ఇప్పుడు
  rationale: యూదా వెళ్లిన తరువాత ప్రారంభమైన నిర్ణాయక ఘడియను సూచించే కాలసంబంధ, సంభాషణాత్మక బలాన్ని నిలుపుతుంది.
- source_word: ἐδοξάσθη
  choice: మహిమపరచబడ్డాడు
  rationale: అయోరిస్ట్ పాసివ్ రూపాన్ని ప్రత్యక్షంగా నిలుపుతూ, మహిమకు పాత్రుడు తనను తాను మహిమపరచుకున్నాడని చెప్పకుండా కర్తృత్వాన్ని తెరిచి ఉంచుతుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు వాడిన స్థిరమైన బిరుదును, దానియేలు 7తో ఉన్న అంతర్వచన సంబంధాన్ని నిలుపుతుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: θεός కు సహజమైన, ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: ἐν యొక్క ప్రత్యక్ష సంబంధ/స్థాన భావాన్ని నిలుపుతుంది; సాధనార్థకమైన ‘ఆయన ద్వారా’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: యేసు మహిమపరచబడినట్లు చెప్పడం యొక్క పరిధి
  choice: మహిమపరచబడడం ఇప్పటికే నిర్ణాయకంగా సంభవించినట్లు వాక్యాన్ని అనువదించడం; అది సిలువ, పునరుత్థానం, ఆరోహణలలో ఏ ఒక్కదానికే పరిమితమని పేర్కొనకపోవడం.
  alternative: దీనిని సిలువ మరణానికే లేదా పునరుత్థానం/ఉన్నతీకరణకే పరిమితం చేయడం.
  rationale: యోహాను సువార్తలో యేసు మహిమ ఆయన మరణం, పునరుత్థానం, తండ్రి వద్దకు తిరిగి వెళ్లడం అనే సమగ్ర గమనంతో ముడిపడి ఉంది; మూలవాక్యం ఉంచిన విస్తృతతను అనువాదం కాపాడుతుంది.
- issue: ἐν αὐτῷ యొక్క భావం
  choice: ఆయనలో
  alternative: ఆయన ద్వారా
  rationale: ఈ పదబంధానికి సంబంధార్థక భావమూ సాధనార్థక భావమూ సాధ్యమే. ప్రధాన పాఠం ప్రత్యక్షమైన అర్థాన్ని ఉంచి, మరొక సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘మనుష్యకుమారుడు,’ ‘మహిమపరచబడ్డాడు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని స్పష్టత మరియు అంతర్వచన ప్రతిధ్వని కోసం నిలిపింది.
