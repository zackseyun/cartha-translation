  source_fidelity: 'ప్రధాన అనువాదం గ్రీకు వాక్యనిర్మాణం మరియు భావాన్ని నమ్మకంగా ప్రతిబింబిస్తుంది: యూదా బయటకు వెళ్లిన అనంతరం యేసు పలికిన మాట, ‘ఇప్పుడు,’ రెండు దైవిక పాసివ్‌లు, అలాగే ἐν αὐτῷ యొక్క ‘ఆయనలో’ భావం అన్నీ భద్రంగా ఉన్నాయి. ὖν యొక్క కథన-పురోగతి భావం తెలుగులో సందర్భానుసారంగా అంతర్లీనంగా ఉండవచ్చు. అయితే పాదటిప్పణిలో ‘కుమారునిలో’ అని చెప్పడం ప్రధాన పాఠంలోని ‘మనుష్యకుమారుడు/ఆయన’ సూచనను అనవసరంగా ‘కుమారుడు’గా మార్చుతుంది.'
  naturalness: ‘అతడు బయటకు వెళ్లిన తరువాత, యేసు ఇలా అన్నాడు’ మరియు ‘మహిమపరచబడ్డాడు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బైబిలు కథనశైలికి సరిపోతాయి. ‘ఆయనలో మహిమపరచబడ్డాడు’ కూడా స్పష్టంగా ఉంది.
  terminology: ‘మనుష్యకుమారుడు,’ ‘దేవుడు,’ ‘మహిమపరచబడ్డాడు’ అనే పదజాలం స్థిరమైన బైబిలు ప్రయోగాలకు, గ్రీకు పదాలకు తగినవి. పాదటిప్పణి ప్రత్యామ్నాయాన్ని అదే సర్వనామ సూచనతో చెప్పాలి; ‘కుమారుడు’ అనడం మూలంలోని నిర్దిష్ట బిరుదును తగ్గిస్తుంది.
