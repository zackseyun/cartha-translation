id: JHN.13.16
reference: John 13:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ οὐδὲ ἀπόστολος μείζων τοῦ πέμψαντος αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: te
  text: '“నేను మీతో నిజంగా, నిజంగా చెబుతున్నాను: దాసుడు[a] తన యజమానికంటే[b] గొప్పవాడు కాడు; పంపబడినవాడు[c] తనను పంపినవానికంటే గొప్పవాడు కాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బానిస’; గ్రీకు పదం యజమాని అధికారానికి లోబడిన వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ప్రభువు’; ఇక్కడ దాసుడు–యజమాని పోలిక కారణంగా సామాజిక అర్థంలో అనువదించబడింది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘అపొస్తలుడు’ లేదా ‘దూత’; గ్రీకు పదం పంపబడిన ప్రతినిధిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: యోహాను రచనలోని గంభీరమైన, బలమైన ధృవీకరణ సూత్రాన్ని పునరుక్తితో సహా సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో ... చెబుతున్నాను
  rationale: వర్తమానకాలపు ప్రత్యక్ష ప్రసంగ సూత్రాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δοῦλος
  choice: దాసుడు
  rationale: యజమాని అధికారానికి లోబడిన వ్యక్తి అనే బలమైన సామాజిక సంబంధాన్ని ‘సేవకుడు’ కంటే స్పష్టంగా చూపుతుంది; అదే సమయంలో తెలుగు బైబిల్ సందర్భంలో సులభంగా అర్థమవుతుంది.
- source_word: μείζων
  choice: గొప్పవాడు
  rationale: హోదా లేదా స్థాయిలో ఆధిక్యాన్ని సూచించే గ్రీకు తులనాత్మక పదానికి విస్తృతతను నిలిపే సహజ సమానార్థకం.
- source_word: κύριος
  choice: యజమాని
  rationale: ఇక్కడ దాసుడు–యజమాని అనే సామాజిక పోలిక ప్రధానమైనందున బిరుదార్థకమైన ‘ప్రభువు’ కంటే సందర్భానికి సరిపోతుంది.
- source_word: ἀπόστολος
  choice: పంపబడినవాడు
  rationale: ఈ సందర్భంలో పదం యొక్క సాధారణ అర్థమైన అధికారంతో పంపబడిన ప్రతినిధిని స్పష్టం చేస్తూ, వెంటనే వచ్చే ‘పంపినవాడు’తో ఉన్న పదసంబంధాన్ని నిలుపుతుంది.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: తనను పంపినవాడు
  rationale: కర్తృవాచక ఆర్టికల్-పార్టిసిపిల్ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేసి, పంపినవాడు–పంపబడినవాడు సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: κύριος పదాన్ని బిరుదుగా కాక సామాజిక సంబంధ పదంగా అనువదించడం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: తక్షణ సందర్భంలో దాసుడు–యజమాని మరియు పంపబడినవాడు–పంపినవాడు అనే సమాంతర పోలిక ఉంది. కాబట్టి ‘యజమాని’ సామాజిక సంబంధాన్ని కాపాడుతుంది; నేరుగా క్రీస్తు బిరుదును అనవసరంగా దిగుమతి చేయదు.
- issue: ἀπόστολος పదంలోని హోదా మరియు సాధారణ ప్రతినిధి అర్థం
  choice: పంపబడినవాడు
  alternative: అపొస్తలుడు
  rationale: ‘అపొస్తలుడు’ అనే స్థిరమైన సంఘపరమైన హోదాను మాత్రమే ముందుకు తేవకుండా, మూలపదంలోని ‘పంపబడిన ప్రతినిధి’ భావాన్ని మరియు పంపినవానితో ఉన్న వ్యత్యాసాన్ని ఈ సందర్భంలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని రెండు సమాంతర సంబంధాలను, ‘నిజంగా, నిజంగా’ అనే పునరుక్తిని నిలిపింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన వచనంలో ఉన్నాయి.
