  source_fidelity: The Telugu accurately conveys Peter's address, question, present-time qualifier (ἄρτι), and pledge. ‘ప్రాణం’ correctly represents ψυχή in the life-for-life idiom, and ‘నీ కోసం’ preserves the broad, non-overdefined force of ὑπὲρ σοῦ.
  naturalness: The wording is natural modern standard Telugu and the direct-speech register is appropriately respectful. ‘అనుసరించు’ is slightly formal but is idiomatic in this context and beneficially retains both following and discipleship resonance.
  terminology: ‘ప్రభువా,’ ‘అనుసరించు,’ and ‘ప్రాణం’ are sound choices. ‘నా ప్రాణాన్ని ఇస్తాను’ naturally communicates the idiomatic sense of laying down one’s life without importing a metaphysical sense of ‘soul.’
