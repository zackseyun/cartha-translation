id: JHN.13.37
reference: John 13:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: te
  text: పేతురు ఆయనతో, “ప్రభువా, నేను ఇప్పుడు నిన్ను ఎందుకు అనుసరించలేను? నీ కోసం నా ప్రాణాన్ని ఇస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథన శైలిలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును నేరుగా సంబోధించే గౌరవాన్ని, అలాగే ఈ పదానికి ఉండగల దైవశాస్త్ర సంబంధమైన బరువును అతిగా నిర్ధారించకుండా నిలుపుతుంది.
- source_word: διὰ τί οὐ δύναμαί
  choice: ఎందుకు ... అనుసరించలేను?
  rationale: ప్రశ్నార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, పేతురు తన అసమర్థతకు కారణాన్ని అడుగుతున్న నిర్మాణాన్ని నిలుపుతుంది.
- source_word: σοι ἀκολουθῆσαι
  choice: నిన్ను ... అనుసరించలేను
  rationale: ἀκολουθέωలోని వెంట వెళ్లడం మరియు శిష్యునిగా అనుసరించడం అనే రెండు భావాలను ‘అనుసరించు’ నిలుపుతుంది.
- source_word: ἄρτι
  choice: ఇప్పుడు
  rationale: తక్షణ వర్తమాన కాలాన్ని సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὴν ψυχήν μου
  choice: నా ప్రాణాన్ని
  rationale: ఈ సందర్భంలో ψυχή వ్యక్తి జీవాన్ని సూచిస్తుంది; ‘ఆత్మ’ అని అనువదిస్తే గ్రీకు ఉద్దేశించని అధిభౌతిక భావం కలగవచ్చు.
- source_word: ὑπὲρ σοῦ
  choice: నీ కోసం
  rationale: మరొకరి నిమిత్తం లేదా ప్రయోజనం కోసం అనే భావాన్ని సహజంగా తెలియజేస్తూ, ప్రతినిధిత్వపు ఖచ్చిత స్వభావాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: θήσω
  choice: ఇస్తాను
  rationale: ψυχήతో కలిసి ఇది ప్రాణాన్ని మరణానికి అప్పగించడం అనే నుడికారాన్ని ఏర్పరుస్తుంది; ‘ప్రాణాన్ని ఇస్తాను’ ఆధునిక తెలుగులో సహజమైన సమానార్థక నుడికారం.
theological_decisions:
- issue: ψυχή అనే పదానికి పేతురు మాటలోని భావం
  choice: ‘ప్రాణం’ అని అనువదించబడింది
  alternative: ‘ఆత్మ’
  rationale: తక్షణ సందర్భం యేసు కోసం చనిపోవడానికి పేతురు సిద్ధంగా ఉన్నానని చెప్పడాన్ని సూచిస్తుంది. ‘ఆత్మ’ అనడం ఇక్కడ ఉద్దేశించని అధిభౌతిక అర్థాన్ని ముందుకు తెస్తుంది.
- issue: ἀκολουθέω పదంలోని భావపరమైన పొరలు
  choice: ‘అనుసరించు’ అని అనువదించబడింది
  alternative: ‘వెంట రా’ లేదా ‘తోడు వెళ్లు’
  rationale: యేసు వెళ్లే చోటుకు వెళ్లడం అనే స్థల సంబంధ భావంతో పాటు, శిష్యునిగా ఆయనను అనుసరించడం అనే భావాన్ని కూడా ఈ ఎంపిక నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ శైలి వాడబడింది. ‘అనుసరించు’ కొద్దిగా అధికారికమైనప్పటికీ యోహాను సందర్భంలోని స్థల సంబంధ మరియు శిష్యత్వ భావాలను రెండింటినీ నిలుపుతుంది.
