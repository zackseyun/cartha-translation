source:
  edition: SBLGNT
  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: te
  text: దేవుడు ఆయనలో మహిమపరచబడినట్లయితే[a], దేవుడు కూడా ఆయనను తనలో[b] మహిమపరుస్తాడు; వెంటనే ఆయనను మహిమపరుస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుడు ఆయనలో మహిమపరచబడినందున.’ గ్రీకులో షరతార్థక అవ్యయం εἰ ఉంది; అయితే సందర్భంలో ఈ షరతు నిజమని భావించి చెప్పినదై ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘తనలో’ అనే మాటను ‘తనతో’ లేదా ‘తన ద్వారా’ అనే భావంలో కూడా అర్థం చేసుకోవచ్చు; గ్రీకు వ్యక్తీకరణ సంక్షిప్తమైనది, భావసాంద్రత కలది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: ఉంటే
  rationale: గ్రీకు షరతార్థక అవ్యయం εἰను నేరుగా షరతుగా ఉంచుతుంది; సందర్భంలో అది నిజమని భావించిన షరతు కావచ్చనే అవకాశాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: ἐδοξάσθη
  choice: మహిమపరచబడి
  rationale: δοξάζω యొక్క ఏకకాల భూతక్రియ నిష్క్రియ రూపాన్ని నిలుపుతూ, యోహాను వాడే ‘మహిమ’ పదబంధ సంబంధాన్ని కాపాడుతుంది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: ἐν + చతుర్థీ విభక్తి యొక్క ప్రాథమిక భావాన్ని, అలాగే యోహాను రచనలోని సాంద్రమైన పరస్పర సంబంధ భాషను అనవసరంగా వివరణాత్మకం చేయకుండా నిలుపుతుంది.
- source_word: δοξάσει
  choice: మహిమపరుస్తాడు
  rationale: భవిష్యత్ కర్తరి రూపాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, ముందున్న δοξάζωతో పదసంబంధ ఏకరూపతను కాపాడుతుంది.
- source_word: ἐν αὑτῷ
  choice: తనలోనే
  rationale: ప్రతిబింబ సర్వనామం దేవునినే తిరిగి సూచిస్తుందని స్పష్టం చేస్తూ, గ్రీకు వాక్యంలోని సంక్షిప్తమైన దైవశాస్త్రీయ భావాన్ని నిలుపుతుంది.
- source_word: εὐθύς
  choice: వెంటనే
  rationale: εὐθύςలోని తక్షణత్వాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు ఇప్పటికే సంభవించిన వాస్తవాన్ని సూచిస్తున్న సందర్భంలో εἰ యొక్క షరతార్థక బలం
  choice: ప్రధాన పాఠ్యంలో ‘దేవుడు ఆయనలో మహిమపరచబడి ఉంటే’ అని ఉంచడం
  alternative: ‘దేవుడు ఆయనలో మహిమపరచబడ్డాడు కాబట్టి’
  rationale: సందర్భం షరతు నిజమని బలంగా సూచించినప్పటికీ, గ్రీకులో స్పష్టంగా εἰ ఉంది. ‘ఉంటే’ అనేది మూలంలోని రూపాన్ని, దైవశాస్త్రీయ ఉద్వేగాన్ని నిలుపుతుంది; సందర్భానుసార ప్రత్యామ్నాయాన్ని పాదసూచిక అందిస్తుంది.
- issue: ἐν αὑτῷలో దేవుని ద్వారా/దేవునితో/దేవునిలో మహిమపరచడం అనే భావసాంద్రత
  choice: ‘తనలోనే’
  alternative: ‘తనతోనే’ లేదా ‘తానే’
  rationale: ‘తనలోనే’ గ్రీకు ἐν మరియు ప్రతిబింబ సర్వనామాన్ని అత్యంత సమీపంగా ప్రతిబింబిస్తుంది; కారణం లేదా సహవాసం అనే ఒక్క అర్థాన్ని బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో. ‘మహిమపరచు’ అనే పదాన్ని పద్యమంతటా ఏకరీతిగా వాడి గ్రీకు δοξάζω పునరావృతిని నిలిపాం. పురుష సర్వనామాలలో గౌరవార్థక ‘ఆయన’ను వాడాం.
