source:
  edition: SBLGNT
  text: καὶ δείπνου ⸀γινομένου, τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ⸂ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος ⸀Ἰσκαριώτου⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
translation:
  language: te
  text: భోజనం జరుగుతుండగా[a], అపవాది అప్పటికే సీమోను కుమారుడైన యూదా ఇస్కరియోతు హృదయంలో ఆయనను అప్పగించాలనే ఉద్దేశాన్ని పుట్టించాడు[b][c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భోజనం సాగుతుండగా.” గ్రీకు పదబంధం భోజనం అప్పటికే ముగిసిందని చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “అప్పటికే అతని హృదయంలో ఉంచాడు.” లేదా, “అప్పటికే అతన్ని ప్రేరేపించాడు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ద్రోహం చేయాలని.” ఈ సందర్భంలో ‘అప్పగించడం’ ద్రోహపూర్వకమైన చర్యను సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: δείπνου γινομένου
  choice: భోజనం జరుగుతుండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ భోజనం జరుగుతున్న సమయంలోని సమకాలిక పరిస్థితిని సూచిస్తుంది; భోజనం ముగిసిందనే అర్థం రాకుండా సహజంగా అనువదించబడింది.
- source_word: διάβολος
  choice: అపవాది
  rationale: యోహాను కథనంలో ఇది వ్యక్తిగత దుష్టునికి స్థిరమైన బిరుదు; ఆధునిక తెలుగు బైబిలు వాడుకలో ‘అపవాది’ ఆ సూచనను స్పష్టంగా అందిస్తుంది.
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: అప్పటికే అతని హృదయంలో ఉద్దేశం పుట్టించాడు
  rationale: గ్రీకు నుడికారం ఒక ఉద్దేశాన్ని హృదయంలో ఉంచడాన్ని సూచిస్తుంది. తెలుగు సహజత్వం కోసం భావాన్ని వ్యక్తం చేస్తూనే ‘హృదయం’ అనే రూపకాన్ని నిలిపింది; ἤδη మరియు పర్ఫెక్ట్ పార్టిసిపుల్ ముందే జరిగిన ప్రభావాన్ని తెలియజేస్తాయి.
- source_word: καρδίαν
  choice: హృదయంలో
  rationale: గ్రీకు మానవశాస్త్రీయ రూపకాన్ని నిలుపుతుంది; ఇక్కడ హృదయం భావోద్వేగమే కాక సంకల్పం, ఉద్దేశం అనే భావాలనూ కలిగి ఉంది.
- source_word: ἵνα παραδοῖ
  choice: అప్పగించాలని
  rationale: παραδίδωμι ప్రాథమికంగా ‘అప్పగించు’ అని అర్థం; యూదా సందర్భంలో ద్రోహభావం అంతర్లీనంగా ఉన్నా, మూలపద విస్తృతిని ప్రధాన పాఠంలో నిలిపింది.
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: సీమోను కుమారుడైన యూదా ఇస్కరియోతు
  rationale: పాఠంలోని సంబంధాన్ని యూదా ఇస్కరియోతు సీమోను కుమారుడని అసందిగ్ధంగా తెలుపుతుంది; ‘ఇస్కరియోతు’ యూదాను విశేషిస్తుందని స్పష్టపరుస్తుంది.
theological_decisions:
- issue: యూదా ద్రోహంలో అపవాది ప్రభావం మరియు యూదా బాధ్యత
  choice: అపవాది యూదా హృదయంలో ఉద్దేశం పుట్టించాడని, అయితే యేసును అప్పగించబోయే వ్యక్తి యూదానేనని పాఠం తెలిపేలా అనువదించబడింది.
  alternative: అపవాది యూదాను పూర్తిగా నియంత్రించి అతని ద్వారా నిర్ణయించాడని అనువదించడం.
  rationale: గ్రీకు పాఠం అపవాది ప్రభావాన్ని పేర్కొంటూనే παραδοῖ క్రియకు యూదానే కార్యనిర్వాహకుడిగా ఉంచుతుంది; నిర్ణయవాదం లేదా ఏకైక కారణత్వాన్ని అనువాదం జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. వాక్యం తరువాతి వచనంలో కొనసాగే నిర్మాణాన్ని సూచించేందుకు చివర కామా ఉంచబడింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠంలో సంబంధిత పదబంధం వెంట ఇవ్వబడింది.
