review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the meal as ongoing, the devil's prior influence, Judas as the one who would hand Jesus over, and the verse's continuation by a final comma. However, the Telugu word order temporarily attaches the purpose clause to Judas before introducing the devil, and the pronoun in “అతని హృదయంలో” is needlessly delayed and less clear.
  naturalness: 'The present clause is intelligible but syntactically heavy: “యూదా ... అప్పగించాలని అపవాది ... అతని హృదయంలో” interrupts the natural Telugu order of agent, recipient, purpose/intention, and verb. Reordering produces clear, modern narrative Telugu.'
  terminology: “అపవాది,” “హృదయం,” and “అప్పగించు” are suitable. “అప్పగించాలనే ఉద్దేశాన్ని” explicitly supplies the idiomatic Telugu object corresponding to what the devil put into Judas’s heart, without adding theological interpretation. “సీమోను కుమారుడైన యూదా ఇస్కరియోతు” appropriately disambiguates the name relation in Telugu.
  issues:
  - severity: medium
    issue: Awkward constituent order obscures the governing relationship of the devil, Judas, and the purpose clause.
    rationale: In the draft, “సీమోను కుమారుడైన యూదా ఇస్కరియోతు ఆయనను అప్పగించాలని” precedes “అపవాది,” making the syntax briefly difficult to parse. The Greek identifies Judas as the one whose heart received the intention, while the devil is the agent who implanted it.
  - severity: low
    issue: Footnote b’s literal wording leaves the implied object unexpressed in Telugu.
    rationale: Greek can leave the content implicit with βάλλω εἰς τὴν καρδίαν, but Telugu is clearer with “ఆ ఉద్దేశాన్ని,” while retaining the heart metaphor and distinguishing the literal/idiomatic alternative.
  revised_text: భోజనం జరుగుతుండగా[a], అపవాది అప్పటికే సీమోను కుమారుడైన యూదా ఇస్కరియోతు హృదయంలో ఆయనను అప్పగించాలనే ఉద్దేశాన్ని పుట్టించాడు[b][c],
