revisions:
- from: భోజనం జరుగుతుండగా[a], సీమోను కుమారుడైన యూదా ఇస్కరియోతు ఆయనను అప్పగించాలని[c] అపవాది అప్పటికే అతని హృదయంలో ఉద్దేశం పుట్టించాడు[b],
  to: భోజనం జరుగుతుండగా[a], అపవాది అప్పటికే సీమోను కుమారుడైన యూదా ఇస్కరియోతు హృదయంలో ఆయనను అప్పగించాలనే ఉద్దేశాన్ని పుట్టించాడు[b][c],
  rationale: The revision places the devil first as the agent and Judas immediately as the person whose heart received the intention. It retains the Greek metaphor of the heart, the prior-completed sense of ἤδη βεβληκότος, and the less interpretive main-text rendering “అప్పగించు.” The supplied Telugu noun “ఉద్దేశాన్ని” makes the idiom grammatical and clear without resolving questions about Judas’s agency or the precise force of παραδίδωμι beyond the contextual footnote.
