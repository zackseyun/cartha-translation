id: JHN.13.6
reference: John 13:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον. ⸀λέγει ⸀αὐτῷ· Κύριε, σύ μου νίπτεις τοὺς πόδας;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: te
  text: 'అప్పుడు ఆయన సీమోను పేతురు దగ్గరికి వస్తాడు. పేతురు ఆయనతో ఇలా అంటాడు: “ప్రభువా[a], మీరే నా పాదాలు కడుగుతున్నారా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అయ్యా.” గ్రీకు పదం గౌరవపూర్వక సంబోధనగా కూడా ఉపయోగించబడవచ్చు; ఇక్కడ “ప్రభువా”ను ప్రధాన అనువాదంగా ఉంచాం.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: వస్తాడు
  rationale: యోహాను కథనంలోని చారిత్రక వర్తమాన కాలపు సజీవతను నిలుపుతూ, సీమోను పేతురు వైపు యేసు రావడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: అప్పుడు
  rationale: ఇక్కడ కథనం ముందుకు సాగే సంబంధాన్ని సహజంగా సూచిస్తుంది; ‘కాబట్టి’ అనే బలమైన తార్కిక భావాన్ని అనవసరంగా మోపదు.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: సీమోను పేతురు దగ్గరికి
  rationale: πρός తో కూడిన కర్మవిభక్తి ఒక వ్యక్తివైపు కదలికను సూచిస్తుంది; ఇది ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: λέγει αὐτῷ
  choice: పేతురు ఆయనతో … అంటాడు
  rationale: గ్రీకులోని రెండవ చారిత్రక వర్తమానాన్ని ‘అంటాడు’గా నిలిపాం. తెలుగు వాక్యంలో ఎవరు ఎవరితో మాట్లాడుతున్నారో స్పష్టంగా ఉండేందుకు సందర్భం సూచించే కర్త ‘పేతురు’ను పేర్కొన్నాం.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: గౌరవపూర్వక సంబోధనను, అలాగే యోహాను సువార్తలో ఉండగల క్రీస్తుసంబంధమైన ప్రతిధ్వనిని నిలుపుతుంది; సందర్భంలో ‘అయ్యా’ అనే అర్థం కూడా సాధ్యమని పాదసూచిక తెలియజేస్తుంది.
- source_word: σύ
  choice: మీరు
  rationale: గ్రీకులో ప్రత్యక్ష సర్వనామం ఉద్ఘాటనతో ఉంది. గౌరవార్థక ‘మీరు’ మరియు ప్రశ్న నిర్మాణం పేతురు ఆశ్చర్యాన్ని సహజంగా తెలియజేస్తాయి.
- source_word: μου
  choice: నా
  rationale: పాదాలు పేతురివని తెలుగులో సహజమైన స్వామ్యరూపంతో తెలియజేస్తుంది.
- source_word: νίπτεις
  choice: కడుగుతున్నారా
  rationale: νίπτω శరీరంలోని ఒక భాగాన్ని కడగడాన్ని సూచిస్తుంది. జరుగుతున్న చర్యపై పేతురు ఆశ్చర్యంతో అడిగిన ప్రశ్నకు తెలుగు వర్తమాన ప్రగతిశీల రూపం సరిపోతుంది.
- source_word: τοὺς πόδας
  choice: పాదాలు
  rationale: గౌరవభరితమైన ఆధునిక తెలుగు సందర్భంలో ‘పాదాలు’ సహజంగా ఉంటుంది; ‘నా’తో కలిపి గ్రీకు స్వామ్యసంబంధాన్ని తెలుపుతుంది.
theological_decisions:
- issue: యేసును సంబోధించే Κύριε పదం
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ‘ప్రభువా’ గౌరవ సంబోధనతో పాటు యోహాను సువార్తలోని క్రీస్తుసంబంధమైన భావసాధ్యతను కాపాడుతుంది. అయితే ఈ గ్రీకు పదం సాధారణ గౌరవ సంబోధనగా కూడా వాడవచ్చు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన కథనశైలిని వాడాం. గ్రీకు చారిత్రక వర్తమాన కాలాన్ని ‘వస్తాడు’, ‘అంటాడు’ రూపాల్లో నిలిపాం; పాత్రల సూచనలో తెలుగు పాఠకుడికి అయోమయం రాకుండా ‘పేతురు’ను స్పష్టంగా పేర్కొన్నాం.
