revisions:
- from: అప్పుడు ఆయన సీమోను పేతురు దగ్గరికి వస్తాడు. పేతురు ఆయనతో, “ప్రభువా[a], మీరు నా పాదాలు కడుగుతున్నారా?” అంటాడు.
  to: 'అప్పుడు ఆయన సీమోను పేతురు దగ్గరికి వస్తాడు. పేతురు ఆయనతో ఇలా అంటాడు: “ప్రభువా[a], మీరే నా పాదాలు కడుగుతున్నారా?”'
  rationale: The revision preserves the draft’s faithful historical-present narration and its appropriate rendering of Κύριε. It adds “మీరే” to represent the source’s emphatic σύ and makes the speech introduction slightly more idiomatic with “ఇలా అంటాడు.”
  reviewer_model: gpt-5.6-terra
