id: JHN.13.7
reference: John 13:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: te
  text: 'యేసు అతనికి జవాబిచ్చి ఇలా అన్నాడు: “నేను చేస్తున్నది ఏమిటో ఇప్పుడు నీకు తెలియదు[a]; అయితే వీటి తరువాత నీవు గ్రహిస్తావు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ఇక్కడ ‘తెలుసు’ అనే భావమిచ్చే οἶδα అనే క్రియ ఉంది; తరువాతి వాక్యభాగంలో ‘తెలుసుకోవడం/గ్రహించడం’ అనే భావమిచ్చే వేరొక క్రియ ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “వీటి తరువాత” అనేది ఈ ఘట్టంలో తరువాత జరిగేదాన్ని సూచించవచ్చు; లేదా యేసు చేసిన కార్యాన్ని స్పష్టంచేసే మరింత తరువాతి సంఘటనలను విస్తృతంగా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: జవాబిచ్చి ఇలా అన్నాడు
  rationale: మూలంలోని ‘జవాబిచ్చాడు’ మరియు ‘అన్నాడు’ అనే రెండు కథన క్రియలనూ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Ὃ ἐγὼ ποιῶ
  choice: నేను చేస్తున్నది ఏమిటో
  rationale: సందర్భంలో కొనసాగుతున్న పాదాలు కడిగే చర్యను వర్తమాన ప్రగతిశీల భావంతో తెలియజేస్తుంది.
- source_word: οὐκ οἶδας ἄρτι
  choice: ఇప్పుడు నీకు తెలియదు
  rationale: οἶδα యొక్క సాధారణ ‘తెలుసు/తెలియదు’ భావాన్ని నిలిపి, తరువాతి γινώσκωతో ఉన్న పదభేదాన్ని తెలుగులో చూపుతుంది.
- source_word: γνώσῃ
  choice: నీవు గ్రహిస్తావు
  rationale: భవిష్యత్తులో ఆ చర్య అర్థాన్ని తెలుసుకొని అవగాహన పొందే భావాన్ని వ్యక్తం చేస్తుంది; οἶδας‌కు వాడిన ‘తెలియదు’తో పదభేదాన్ని కాపాడుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ప్రస్తుత తెలియకపోవడం మరియు తరువాత కలిగే అవగాహన మధ్య వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
- source_word: μετὰ ταῦτα
  choice: వీటి తరువాత
  rationale: ‘ఈ సంగతుల తరువాత’ అనే మూలంలోని బహువచన సూచనను సంక్షిప్తంగా నిలుపుతూ, దాని కాలపరమైన పరిధిని నిర్దిష్టంగా నిర్ణయించదు.
theological_decisions:
- issue: భవిష్యత్తులో కలిగే అవగాహన యొక్క కాలపరమైన పరిధి
  choice: ‘వీటి తరువాత’ అని సాధారణంగా ఉంచడం
  alternative: పాదాలు కడిగిన తరువాత, సిలువ-పునరుత్థానం తరువాత, లేదా ఆత్మ ద్వారా తరువాత అని నిర్దిష్టీకరించడం
  rationale: μετὰ ταῦτα ఏ ఒక్క కాలపరమైన వివరణను బలవంతం చేయదు. అందువల్ల ఈ ఘట్టంలో తరువాత జరిగేదానికైనా, మరింత తరువాతి సంఘటనలకైనా వర్తించే మూలంలోని ఉద్దేశపూర్వక విస్తృతిని అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సహజంగా అర్థమయ్యే శైలి. యేసు పేతురుతో నేరుగా మాట్లాడుతున్న సందర్భానికి అనుగుణంగా ఏకవచన ‘నీకు/నీవు’ వాడబడింది. మూలంలోని రెండు జ్ఞానక్రియల భేదాన్ని ‘తెలియదు/గ్రహిస్తావు’గా నిలిపాం.
