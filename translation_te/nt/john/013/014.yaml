id: JHN.13.14
reference: John 13:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: te
  text: కాబట్టి, ప్రభువును[a] బోధకుడనూ అయిన నేనే మీ పాదాలను కడిగినట్లయితే, మీరు కూడా ఒకరి పాదాలను ఒకరు కడగాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యజమాని.’ గ్రీకు κύριος ఇక్కడ బిరుదుగా ఉంది; సాధారణ బిరుదు ప్రయోగానికి అనుగుణంగా దీనిని ‘ప్రభువు’ అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ οὖν
  choice: కాబట్టి ... అయినట్లయితే
  rationale: εἰ లోని షరతును, οὖν లోని నిర్ధారణాత్మక తార్కిక సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐγὼ
  choice: నేనే
  rationale: గ్రీకులో స్పష్టంగా ఉన్న సర్వనామపు ఉద్ఘాటనను, శిష్యులు కూడా అలాగే చేయాలనే వ్యత్యాసాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἔνιψα
  choice: కడిగిన
  rationale: ఇప్పుడే పూర్తయిన పాదాలు కడిగే కార్యాన్ని సందర్భానుగుణంగా తెలుపుతుంది.
- source_word: ὑμῶν τοὺς πόδας
  choice: మీ పాదాలు
  rationale: గ్రీకు సంబంధవాచక నిర్మాణానికి సహజమైన తెలుగు స్వామ్య ప్రయోగం.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: యేసు తనకు వర్తింపజేసుకున్న బిరుదుగా κύριος ను సాధారణంగా, గౌరవప్రదంగా అనువదిస్తుంది.
- source_word: ὁ διδάσκαλος
  choice: బోధకుడు
  rationale: యేసును సూచించే బిరుదును లిప్యంతరీకరణ లేకుండా స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: καὶ ὑμεῖς
  choice: మీరు కూడా
  rationale: καί తో పాటు ఉద్ఘాటిత ὑμεῖς ను నిలిపి, యేసు చేసినదానికి ప్రతిస్పందనగా శిష్యుల బాధ్యతను చూపుతుంది.
- source_word: ὀφείλετε
  choice: కడగాలి
  rationale: నైతిక బాధ్యతను సహజమైన తెలుగు విధ్యర్థక రూపంలో తెలియజేస్తుంది; ఆజ్ఞ యొక్క బలాన్ని తగ్గించదు.
- source_word: ἀλλήλων ... τοὺς πόδας
  choice: ఒకరి పాదాలు ఒకరు
  rationale: పరస్పర చర్యను తెలుగులో సహజంగా, సందిగ్ధత లేకుండా వ్యక్తం చేస్తుంది.
- source_word: νίπτειν
  choice: కడగాలి
  rationale: శరీరంలోని ఒక భాగాన్ని కడగడాన్ని సూచించే నిర్దిష్ట కార్యాన్ని నిలుపుతుంది; దానిని సాధారణ సేవగా పారాఫ్రేజ్ చేయదు.
theological_decisions:
- issue: κύριος ను క్రీస్తును సూచించే బిరుదుగా అనువదించడం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఇక్కడ ఇది యేసు ఉన్నత స్థానానికీ ఆయన చేసిన వినయపూర్వక కార్యానికీ మధ్య వ్యత్యాసాన్ని చూపే బిరుదు; ‘ప్రభువు’ ఆ బిరుదు భావాన్ని నిలుపుతుంది.
- issue: పాదాలు కడగడం అనే బాధ్యత స్వభావం
  choice: ‘ఒకరి పాదాలు ఒకరు కడగాలి’ అనే నిర్దిష్ట కార్యాన్ని యథాతథంగా ఉంచడం
  alternative: ‘ఒకరికి ఒకరు వినయంగా సేవ చేయాలి’ అని సాధారణీకరించడం
  rationale: గ్రీకు పాఠం పాదాలు కడగడాన్నే స్పష్టంగా పేర్కొంటుంది. దాని విస్తృత ఆదర్శార్థాన్ని ఈ వచనం స్థానంలో పెట్టడం మూలపాఠాన్ని మించిన వ్యాఖ్యానం అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ అనువదించబడింది. ‘ప్రభువు’, ‘బోధకుడు’ అనే బిరుదులు సమాంతరంగా ఉంచబడ్డాయి; ‘నేనే’ గ్రీకు ఉద్ఘాటనను సహజంగా ప్రతిబింబిస్తుంది.
