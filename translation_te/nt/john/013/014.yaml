- from: కాబట్టి ప్రభువును, బోధకుడను అయిన నేనే మీ పాదాలు కడిగినట్లయితే, మీరు కూడా ఒకరి పాదాలు ఒకరు కడగాలి.
  to: కాబట్టి, ప్రభువును[a] బోధకుడనూ అయిన నేనే మీ పాదాలను కడిగినట్లయితే, మీరు కూడా ఒకరి పాదాలను ఒకరు కడగాలి.
