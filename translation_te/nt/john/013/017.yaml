review_pass:
  verdict: revise
  source_fidelity: The draft preserves the referents, plural forms, and practical force of the verse, but it merges the first conditional (εἰ, ‘if you know’) into a participial construction (‘తెలుసుకుని’). This makes knowing sound like a completed preliminary action rather than retaining the source’s explicit conditional ‘if you know ... if you do.’
  naturalness: 'The wording is generally natural modern Telugu. A paired conditional construction is both clear and idiomatic here: ‘మీకు ఈ సంగతులు తెలిసి ఉంటే, మీరు వాటిని చేస్తే ధన్యులు.’'
  terminology: ‘ధన్యులు’ is an appropriate established Telugu rendering of μακάριοι and suitably retains its biblical register. ‘ఈ సంగతులు’ and ‘వాటిని’ correctly preserve the plural antecedent. The footnote should avoid making divine favor explicit, since it is not stated directly by μακάριοι in this verse.
  issues:
  - severity: medium
    issue: The first conditional εἰ is not represented as a conditional clause.
    rationale: ‘మీరు ఈ సంగతులు తెలుసుకుని’ means ‘having known these things,’ whereas εἰ ταῦτα οἴδατε explicitly says ‘if you know these things.’ The source has two conditions, and Telugu can retain both without awkwardness.
  revised_text: మీకు ఈ సంగతులు తెలిసి ఉంటే, మీరు వాటిని చేస్తే ధన్యులు[a].
