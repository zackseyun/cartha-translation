- from: మీరు ఈ సంగతులు తెలుసుకుని, వాటిని చేస్తే ధన్యులు[a].
  to: మీకు ఈ సంగతులు తెలిసి ఉంటే, మీరు వాటిని చేస్తే ధన్యులు[a].
  rationale: The revision restores the explicit first conditional while retaining the second conditional and the concise, natural Telugu expression of the result. The footnote continues to offer valid lexical alternatives but states the semantic range without adding an explicit theological claim not directly expressed in the Greek.
