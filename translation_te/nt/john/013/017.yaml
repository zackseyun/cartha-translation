id: JHN.13.17
reference: John 13:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ ταῦτα οἴδατε, μακάριοί ἐστε ἐὰν ποιῆτε αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/017.yaml
  text: If you know these things[a], you are blessed if you do them.
translation:
  language: te
  text: మీకు ఈ సంగతులు తెలిసి ఉంటే, మీరు వాటిని చేస్తే ధన్యులు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సంతోషవంతులు’ లేదా ‘భాగ్యవంతులు’; గ్రీకు పదం కేవలం భావోద్వేగ సంతోషాన్ని మాత్రమే కాక, అనుకూలమైన లేదా వర్ధిల్లే స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: తెలుసుకుని
  rationale: గ్రీకు వాక్యంలో ఇది షరతును పరిచయం చేస్తుంది. తెలుగులో రెండు ‘అయితే’ రూపాలు అసహజంగా పునరావృతం కాకుండా, మొదటి షరతును ‘తెలుసుకుని’ అనే సహజ నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: ταῦτα
  choice: ఈ సంగతులు
  rationale: యేసు ఇంతకుముందు చేసినదానినీ బోధించినదానినీ సూచించే నపుంసక బహువచన భావాన్ని నిలుపుతుంది.
- source_word: οἴδατε
  choice: తెలుసుకుని
  rationale: క్రియ యొక్క ప్రాథమిక అర్థం తెలుసుకోవడం లేదా ఎరిగి ఉండడం; ‘అర్థం చేసుకోవడం’ అని మరింత నిర్దిష్టంగా చేయలేదు.
- source_word: μακάριοί
  choice: ధన్యులు
  rationale: కేవలం మనోభావమైన సంతోషాన్ని కాక, అనుకూలమైన లేదా వర్ధిల్లే స్థితిని సూచించే బైబిలు సంబంధిత బరువును ‘ధన్యులు’ నిలుపుతుంది.
- source_word: ἐστε
  choice: ధన్యులు
  rationale: తెలుగులో నామవాచక విధేయంతో వర్తమాన కాలపు ‘ఉన్నారు’ సాధారణంగా అంతర్లీనంగా ఉంటుంది; అందువల్ల సహజంగా విడిగా అనువదించలేదు.
- source_word: ἐὰν
  choice: చేస్తే
  rationale: ποιῆτεతో కలిసి contingent conditionను సూచిస్తుంది; తెలుగు షరతు ప్రత్యయం ‘-తే’ దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ποιῆτε
  choice: చేస్తే
  rationale: యేసు బోధను ఆచరణలో పెట్టడాన్ని సంక్షిప్తంగా, వ్యాఖ్యానాన్ని పెంచకుండా తెలియజేస్తుంది.
- source_word: αὐτά
  choice: వాటిని
  rationale: ముందున్న ‘ఈ సంగతులు’ అనే బహువచన పూర్వపదాన్ని స్పష్టంగా తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: శిష్యత్వ సందర్భంలో μακάριοι అనువాదం
  choice: ధన్యులు
  alternative: సంతోషవంతులు / అదృష్టవంతులు
  rationale: తెలుసుకోవడమే కాక చేయువారి అనుకూలమైన, వర్ధిల్లే స్థితిని ఈ పదం సూచిస్తుంది. ‘ధన్యులు’ దాని బైబిలు-దైవశాస్త్ర సంబంధిత బరువును నిలుపుతూ, కేవలం భావోద్వేగ సంతోషానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన షరతు నిర్మాణాన్ని వాడాం. ‘ఈ సంగతులు’ ద్వారా మూలంలోని బహువచనాన్ని, ‘ధన్యులు’ ద్వారా గంభీరమైన బైబిలు శైలిని నిలిపాం.
