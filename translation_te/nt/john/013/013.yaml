source:
  edition: SBLGNT
  text: ὑμεῖς φωνεῖτέ με Ὁ διδάσκαλος καὶ Ὁ κύριος, καὶ καλῶς λέγετε, εἰμὶ γάρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: te
  text: మీరు నన్ను ‘బోధకుడు’ అని, ‘ప్రభువు’[a] అని పిలుస్తున్నారు. మీరు సరిగ్గానే అంటున్నారు; ఎందుకంటే నేను అలాగే ఉన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యజమాని.’ గ్రీకు κύριος (క్యూరియోస్) అధికారం ఉన్న వ్యక్తిని లేదా ప్రభువును సూచించగలదు; ఇక్కడ ప్రధాన పాఠంలో ‘ప్రభువు’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνεῖτέ
  choice: పిలుస్తున్నారు
  rationale: ఒకరిని ఒక బిరుదుతో పిలవడం అనే ఈ నిర్మాణానికి ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: Ὁ διδάσκαλος
  choice: బోధకుడు
  rationale: యేసును ఉద్దేశించిన బిరుదుగా διδάσκαλος అర్థాన్ని స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: Ὁ κύριος
  choice: ప్రభువు
  rationale: κύριοςలోని అధికార, ప్రభుత్వ భావాలను మరియు నూతన నిబంధనలో యేసుకు వాడే బిరుదు ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: καλῶς λέγετε
  choice: మీరు సరిగ్గానే అంటున్నారు
  rationale: వారు పలికిన బిరుదులు సరైనవని యేసు ధృవీకరించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰμὶ γάρ
  choice: ఎందుకంటే నేను అలాగే ఉన్నాను
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్త స్వీయ-ధృవీకరణను నిలుపుతూ, తెలుగులో అవసరమైన సూచనార్థాన్ని ‘అలాగే’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసుకు κύριος అనే బిరుదు
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ సందర్భంలో యేసు శిష్యులు తనకు ఉపయోగించే κύριος బిరుదును ధృవీకరిస్తున్నాడు. ‘ప్రభువు’ దాని అధికార భావాన్ని, క్రీస్తుసంబంధమైన బిరుదు బరువును నిలుపుతుంది; ‘యజమాని’ సందర్భానుసారం సాధ్యమైనా అర్థాన్ని సామాజిక సంబంధానికే పరిమితం చేసే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకులో బిరుదుల ముందు ఉన్న నిర్దిష్ట ఉపపదాన్ని తెలుగులో ప్రత్యేకంగా ప్రతిబింబించకుండా, ఉద్ధరణ చిహ్నాలతో బిరుదులుగా స్పష్టం చేశాం.
