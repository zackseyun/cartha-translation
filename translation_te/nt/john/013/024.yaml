  edition: SBLGNT
  text: νεύει οὖν τούτῳ Σίμων Πέτρος ⸂πυθέσθαι τίς ἂν εἴη⸃ περὶ οὗ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/024.yaml
  text: So Simon Peter motioned to this one to ask who it might be about whom he was speaking[a].
translation:
  language: te
  text: కాబట్టి సీమోను పేతురు, ఆయన ప్రస్తావిస్తున్న వ్యక్తి ఎవరో అడగమని అతనికి సైగ చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “అందువల్ల సీమోను పేతురు, ఆయన ఎవరి గురించి చెబుతున్నాడో ఆ వ్యక్తి ఎవరు అయి ఉండవచ్చో విచారించమని అతనికి సైగ చేస్తున్నాడు.”'
    reason: గ్రీకు కథనంలోని చారిత్రక వర్తమాన కాలాన్ని, అలాగే τίς ἂν εἴηలోని అనిశ్చిత/సంభావ్య భావాన్ని మరియు πυθέσθαι యొక్క ‘విచారించడం’ అనే భావాన్ని చూపించే పదశః ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: νεύει
  choice: సైగ చేశాడు
  rationale: ఈ క్రియ మాటలతో కాకుండా సంకేతం చేయడాన్ని సూచిస్తుంది. ‘సైగ చేశాడు’ అనేది సంకేతం ఏ రూపంలో చేశాడో అనవసరంగా నిర్దిష్టపరచకుండా సహజమైన తెలుగులో భావాన్ని అందిస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వచనంలోని పరిస్థితి నుంచి పేతురు చేసిన చర్యకు ఉన్న పర్యవసాన సంబంధాన్ని ఇది తెలియజేస్తుంది.
- source_word: τούτῳ
  choice: అతనికి
  rationale: ఈ సూచన సర్వనామం ముందటి వచనంలో పేర్కొన్న శిష్యుణ్ణి సూచిస్తుంది. తెలుగులో ‘అతనికి’ అనడం సందర్భానుసారంగా సహజంగా ఉంటుంది.
- source_word: πυθέσθαι
  choice: అడగమని
  rationale: 'పేతురు చేసిన సైగలోని ఉద్దేశాన్ని తెలిపే క్రియారూపం ఇది: ఆ శిష్యుడు యేసును అడగాలి.'
- source_word: τίς ἂν εἴη
  choice: ఎవరి...ఓ
  rationale: ἄνతో కూడిన optative పరోక్ష ప్రశ్నలో అనిర్దిష్టత లేదా సంభావ్యతను కలిగిస్తుంది. తెలుగు పరోక్ష ప్రశ్నలోని ‘ఎవరి...ఓ’ నిర్మాణం దానిని సహజంగా నిలుపుతుంది.
- source_word: περὶ οὗ λέγει
  choice: ఆయన ఎవరి గురించి చెబుతున్నాడో
  rationale: περί యొక్క ‘గురించి’ భావాన్ని స్పష్టంగా ఉంచుతూ, గ్రీకు వర్తమాన కాలంలోని చారిత్రక-వర్తమాన ప్రయోగాన్ని సహజ తెలుగు కథనంలో కొనసాగుతున్న మాటగా అందిస్తుంది.
theological_decisions:
- issue: λέγει అనే క్రియలో అంతర్లీనంగా ఉన్న కర్త
  choice: ఆయన
  alternative: యేసు
  rationale: సందర్భంలో మాట్లాడుతున్నది యేసే అయినప్పటికీ, మూలంలో పేరు మళ్లీ చెప్పబడలేదు. ‘ఆయన’ అనడం సందర్భాన్ని స్పష్టంగా ఉంచుతూ మూలంలోని అంతర్లీన కర్తను అతిగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘తల ఊపాడు’ వంటి మరీ నిర్దిష్టమైన శారీరక సంకేతాన్ని చేర్చకుండా ‘సైగ చేశాడు’ అని ఉంచబడింది.
