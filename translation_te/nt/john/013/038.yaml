id: JHN.13.38
reference: John 13:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: te
  text: 'యేసు జవాబిచ్చాడు: “నా కోసం నీ ప్రాణం[a] పెడతావా? నిజంగా, నిజంగా నీతో చెబుతున్నాను: నువ్వు నన్ను మూడుసార్లు నిరాకరించే వరకు కోడి కూయదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘ప్రాణం’ అని అనువదించిన గ్రీకు పదానికి ‘జీవితం’ లేదా ‘ఆత్మ’ అనే అర్థాలు రావచ్చు. ఇక్కడ భావం: ఒకరి కోసం తన జీవితాన్ని విడిచిపెట్టడం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: జవాబిచ్చాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథనశైలిలో భూతకాల రూపం సహజంగా యేసు ప్రతిస్పందనను పరిచయం చేస్తుంది.
- source_word: ψυχήν
  choice: ప్రాణం
  rationale: τίθημι τὴν ψυχήν అనే ప్రయోగంలో తన జీవాన్ని విడిచిపెట్టడం అనే భావం ఉంది. ‘ప్రాణం పెట్టడం’ ఆధునిక తెలుగులో ప్రాణత్యాగానికి సిద్ధపడడాన్ని సహజంగా తెలియజేస్తుంది; మూలపదంలోని ‘జీవం/ఆత్మ’ అర్థవ్యాప్తిని పాదసూచిక సూచిస్తుంది.
- source_word: ὑπὲρ ἐμοῦ
  choice: నా కోసం
  rationale: ఇక్కడ ὑπέρ ప్రయోజనం లేదా మరొకరి పక్షంగా చేయడాన్ని సూచిస్తుంది; ‘నా కోసం’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: θήσεις
  choice: పెడతావా
  rationale: ‘ప్రాణం పెట్టడం’ అనే తెలుగు నుడికారం మూలంలోని ‘ప్రాణాన్ని ఉంచడం/అర్పించడం’ అనే యోహాను శైలీప్రయోగాన్ని సహజంగా అందిస్తుంది.
- source_word: ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: యోహాను సువార్తలో యేసు ఉపయోగించే గంభీరమైన ద్విరుక్తిని తగ్గించకుండా, ఆధునిక పాఠకులకు అర్థమయ్యేలా అనువదిస్తుంది.
- source_word: οὐ μὴ
  choice: ఎంతమాత్రమూ కూయదు
  rationale: οὐ μή లోని బలమైన నిరాకరణను తెలుగు నిషేధ ఉద్ఘాటనతో వ్యక్తం చేస్తుంది.
- source_word: ἀλέκτωρ φωνήσῃ
  choice: కోడి … కూయదు
  rationale: కోడి చేసే శబ్దానికి తెలుగులో సహజమైన క్రియ ‘కూయడం’.
- source_word: ἕως οὗ
  choice: వరకు
  rationale: నిషేధిత చర్య కొనసాగి, సూచించిన ఘటన జరిగిన తరువాతే ముగుస్తుందనే కాలసంబంధాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ἀρνήσῃ με
  choice: నన్ను … నిరాకరించేవరకు
  rationale: ἀρνέομαι లోని తిరస్కరించడం, సంబంధాన్ని ఒప్పుకోకపోవడం అనే భావాన్ని నేరుగా ఉంచుతుంది; ‘ఎరుగనని చెప్పడం’ అని విపులీకరించి భావాన్ని పరిమితం చేయలేదు.
- source_word: τρίς
  choice: మూడుసార్లు
  rationale: సంఖ్యను ఆధునిక తెలుగులో సరళంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: శిష్యత్వం, ప్రాణత్యాగం సందర్భంలో ψυχή అనువాదం
  choice: ప్రాణం
  alternative: ఆత్మ; జీవితం
  rationale: సందర్భం పేతురు యేసు కోసం చనిపోవడానికి సిద్ధమని చెప్పడాన్ని సూచిస్తుంది. ‘ప్రాణం’ concrete జీవత్యాగ భావాన్ని ఇస్తూనే, గ్రీకు పదాన్ని కేవలం శరీరరహిత ఆత్మ అనే సిద్ధాంతార్థానికి పరిమితం చేయదు.
- issue: పేతురు చేయబోయే ἀρνέομαι క్రియ స్వభావం
  choice: నిరాకరించడం
  alternative: ఎరుగనని చెప్పడం; తృణీకరించడం
  rationale: ‘నిరాకరించడం’ మూలపదంలోని విస్తృత భావాన్ని నిలుపుతుంది; తరువాతి కథనం దాని నిర్దిష్ట రూపాన్ని వివరించడానికి అవకాశం ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుకుంటూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం. ‘నిజంగా, నిజంగా’ అనే ద్విరుక్తి మూలంలోని ప్రత్యేక ఉద్ఘాటనను ఉద్దేశపూర్వకంగా నిలుపుతుంది.
