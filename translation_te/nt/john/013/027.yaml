id: JHN.13.27
reference: John 13:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ μετὰ τὸ ψωμίον τότε εἰσῆλθεν εἰς ἐκεῖνον ὁ Σατανᾶς. λέγει οὖν αὐτῷ ⸀ὁ Ἰησοῦς· Ὃ ποιεῖς ποίησον τάχιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: te
  text: ఆ రొట్టె ముక్కను అతడు తీసుకున్న తర్వాత[a], సాతాను అతనిలో ప్రవేశించాడు. కాబట్టి యేసు అతనితో, “నువ్వు చేస్తున్నది ఇంకా త్వరగా[b] చెయ్యి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ ముద్దను తీసుకున్న తర్వాత.’ గ్రీకు పదం చిన్న ఆహారపు ముక్కను సూచిస్తుంది; ఇక్కడ అది భోజన సమయంలో ఇచ్చిన, బహుశా ముంచిన రొట్టె ముక్క.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘త్వరగా.’ గ్రీకులోని పదం తులనాత్మక రూపంలో ఉంది—అక్షరార్థంగా ‘ఇంకా త్వరగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: రొట్టె ముక్క
  rationale: ఈ పదం కొద్దిపాటి ఆహారాన్ని, ఈ సందర్భంలో భోజనంలో ఇచ్చిన చిన్న రొట్టె ముక్కను సూచిస్తుంది. ‘రొట్టె ముక్క’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: μετὰ τὸ ψωμίον
  choice: ఆ రొట్టె ముక్కను అతడు తీసుకున్న తర్వాత
  rationale: గ్రీకు వాక్యం అక్షరార్థంగా ‘ఆ ముక్క తర్వాత’ అని సంక్షిప్తంగా ఉన్నా, ముందరి సందర్భంలో యూదా దానిని తీసుకున్నాడని స్పష్టంగా ఉంది. తెలుగులో భావం సహజంగా ఉండేందుకు ‘అతడు తీసుకున్న’ అని సందర్భానుగుణంగా వ్యక్తపరచబడింది.
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: అతనిలో ప్రవేశించాడు
  rationale: εἰσέρχομαι + εἰς నిర్మాణంలోని ప్రత్యక్ష ప్రవేశ భావాన్ని తగ్గించకుండా తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ὁ Σατανᾶς
  choice: సాతాను
  rationale: కొత్త నిబంధన తెలుగు వాడుకలో స్థిరపడిన వ్యక్తినామం/బిరుదు; వ్యుత్పత్తిని ముందుకు తెచ్చే ‘విరోధి’ కంటే ఇది సముచితం.
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: కాబట్టి యేసు అతనితో … అన్నాడు
  rationale: οὖν యొక్క తార్కిక అనుసంధానాన్ని ‘కాబట్టి’ నిలుపుతుంది. గ్రీకులోని చారిత్రక వర్తమానాన్ని సహజ తెలుగు కథనశైలిలో భూతకాలంగా ఇచ్చాం.
- source_word: Ὃ ποιεῖς
  choice: నువ్వు చేస్తున్నది
  rationale: వర్తమానకాల రూపంలోని కొనసాగుతున్న లేదా తక్షణ చర్య భావాన్ని కాపాడుతుంది; ‘చేయబోతున్నది’ అనడం మూలంలో లేని సమీప భవిష్యత్ వ్యాఖ్యానాన్ని చేర్చుతుంది.
- source_word: ποίησον
  choice: చెయ్యి
  rationale: ఆజ్ఞలోని సూటితనాన్ని, సంక్షిప్తతను సహజమైన తెలుగు క్రియతో నిలుపుతుంది.
- source_word: τάχιον
  choice: ఇంకా త్వరగా
  rationale: τάχιον తులనాత్మక రూపం. ‘ఇంకా త్వరగా’ ఆ తులనాత్మక ఛాయను తెలుగులో స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: యూదాపై సాతాను చేసిన చర్య స్వభావం
  choice: ‘సాతాను అతనిలో ప్రవేశించాడు’ అనే ప్రత్యక్ష పదప్రయోగాన్ని నిలుపడం
  alternative: ‘సాతాను అతనిని పూర్తిగా అదుపులోకి తీసుకున్నాడు’ లేదా ‘యూదా సాతానుకు లొంగిపోయాడు’
  rationale: మూలపాఠం వ్యక్తిగతమైన సాతాను ప్రవేశాన్ని నేరుగా చెబుతుంది. దానిని కేవలం రూపకంగా తగ్గించకూడదు; అదే సమయంలో ఈ వాక్యం చెప్పేదానికంటే విస్తృతమైన ఆవహింపు సిద్ధాంతాన్ని కూడా చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలిని వాడాం. యేసు–యూదా మధ్య ప్రత్యక్ష సంభాషణలో సహజమైన ఏకవచన ‘నువ్వు’ రూపాన్ని ఉంచాం; వాక్యంలోని తీవ్రతను మృదువుచేయలేదు.
