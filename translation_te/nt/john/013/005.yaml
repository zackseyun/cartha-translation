translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలో βάλλει వర్తమాన కాలంలో, ἤρξατο భూతకాలంలో ఉన్న ఆకస్మిక కాలమార్పును తెలుగు సహజ కథన ప్రవాహం కోసం వరుస క్రియలుగా వ్యక్తపరిచాం; చర్య ఆరంభ భావాన్ని మాత్రం నిలిపాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
