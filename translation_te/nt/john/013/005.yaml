source:
  edition: SBLGNT
  text: εἶτα βάλλει ὕδωρ εἰς τὸν νιπτῆρα, καὶ ἤρξατο νίπτειν τοὺς πόδας τῶν μαθητῶν καὶ ἐκμάσσειν τῷ λεντίῳ ᾧ ἦν διεζωσμένος.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
translation:
  language: te
  text: తర్వాత ఆయన కడిగే పాత్రలో[a] నీళ్లు పోసి, శిష్యుల పాదాలను కడగడం, తన నడుముకు కట్టుకున్న తువ్వాలుతో వాటిని తుడవడం మొదలుపెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కడిగే గిన్నె.’ గ్రీకు పదం కడగడానికి ఉపయోగించే పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: తర్వాత
  rationale: కథనంలోని వరుస చర్యను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: βάλλει ὕδωρ
  choice: నీళ్లు పోసి
  rationale: βάλλει ప్రాథమికంగా ‘వేయు/ఉంచు’ అనే విస్తృత అర్థం కలిగినప్పటికీ, పాత్రలో నీటిని ఉంచే సందర్భంలో ‘పోయు’ సహజమైన సమానార్థకం.
- source_word: νιπτῆρα
  choice: కడుగుకునే పళ్లెం
  rationale: కడగడానికి ఉపయోగించే పాత్ర అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; ప్రత్యామ్నాయంగా ‘పాత్ర’ అని చెప్పవచ్చు.
- source_word: ἤρξατο νίπτειν
  choice: కడగడం మొదలుపెట్టాడు
  rationale: ἄρχομαι మరియు క్రియార్థక రూపం సూచించే చర్య ఆరంభాన్ని నేరుగా నిలుపుతుంది.
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: శిష్యుల పాదాలు
  rationale: గ్రీకు సంబంధాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంలో వ్యక్తపరుస్తుంది; గౌరవప్రదమైన కథన శైలికి ‘పాదాలు’ సరిపోతుంది.
- source_word: ἐκμάσσειν
  choice: వాటిని తుడవడం
  rationale: రుద్ది తుడవడం లేదా ఆరబెట్టడం అనే భావంలో, ముందున్న పాదాలను ‘వాటిని’ అని సహజంగా సూచిస్తుంది.
- source_word: τῷ λεντίῳ
  choice: తువ్వాలుతో
  rationale: తుడవడానికి ఉపయోగించే వస్త్రాన్ని సందర్భానుకూలమైన సాధారణ తెలుగు పదంతో వ్యక్తపరుస్తుంది.
- source_word: ᾧ ἦν διεζωσμένος
  choice: తన నడుముకు కట్టుకున్న
  rationale: గ్రీకు περιφραστική నిర్మాణం వస్త్రాన్ని చుట్టూ బిగించుకున్న స్థితిని సూచిస్తుంది; తెలుగు సందర్భంలో ‘నడుముకు కట్టుకున్న’ స్పష్టంగా, సహజంగా ఉంటుంది.
