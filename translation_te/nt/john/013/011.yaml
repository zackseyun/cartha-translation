id: JHN.13.11
reference: John 13:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ᾔδει γὰρ τὸν παραδιδόντα αὐτόν· διὰ τοῦτο εἶπεν ⸀ὅτι Οὐχὶ πάντες καθαροί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/011.yaml
  text: For he knew the one who was betraying him; for this reason he said[a], “Not all of you are clean.”
translation:
  language: te
  text: ఎందుకంటే, తనను అప్పగిస్తున్నవాడు[a] ఎవరో ఆయనకు తెలుసు. అందుకే, “మీలో అందరూ శుద్ధులు కారు” అని ఆయన చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “తనను అప్పగిస్తున్నవాడు.” ఈ సందర్భంలో ఇది యూదా చేసిన ద్రోహపూరిత అప్పగింతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: ఆయనకు తెలుసు
  rationale: οἶδα రూపం భూతకాల ఆకృతిలో ఉన్నప్పటికీ ఇక్కడ యేసుకు అప్పటికే ఉన్న జ్ఞానాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా వర్తమాన స్థితిగా వ్యక్తమవుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని వివరిస్తున్న సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: τὸν παραδιδόντα αὐτόν
  choice: తనను అప్పగిస్తున్నవాడు ఎవరో
  rationale: వర్తమాన కృదంత భావాన్ని నిలుపుతూ, παραδίδωμι యొక్క ప్రాథమిక ‘అప్పగించు’ భావాన్ని కాపాడుతుంది; సందర్భంలో ఇది యూదా చేసిన ద్రోహపూరిత అప్పగింతను సూచిస్తుంది.
- source_word: διὰ τοῦτο
  choice: అందుకే
  rationale: యేసుకు తెలిసిన విషయానికి, ఆయన చేసిన ప్రకటనకు మధ్యనున్న కారణ-ఫల సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εἶπεν ὅτι
  choice: అని ఆయన చెప్పాడు
  rationale: ὅτι పరిచయం చేసే ప్రత్యక్ష వాక్యాన్ని తెలుగు ఉద్ధరణ నిర్మాణంలో ‘అని’ ద్వారా సహజంగా సూచిస్తుంది.
- source_word: Οὐχὶ πάντες καθαροί ἐστε
  choice: మీలో అందరూ శుద్ధులు కారు
  rationale: రెండవ పురుష బహువచన సంబోధనను ‘మీలో’ స్పష్టం చేస్తుంది; ‘అందరూ ... కారు’ గ్రీకు వాక్యంలోని ‘అందరూ కాదు’ పరిధిని కాపాడుతుంది. ‘శుద్ధులు’ కడుగబడటం మరియు అంతరంగ స్థితి అనే రెండర్థాల ప్రతిధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: παραδιδόντα అనే పదానికి యూదాతో సంబంధమైన భావం
  choice: అప్పగిస్తున్నవాడు
  alternative: ద్రోహం చేస్తున్నవాడు
  rationale: ‘అప్పగించు’ మూలపదానికి దగ్గరగా ఉండి, యోహాను శ్రమకథలోని ద్రోహ సందర్భాన్ని పాఠకుడు గ్రహించేందుకు పాదటిప్పణి సహాయపడుతుంది; ప్రధాన పాఠంలో భావాన్ని ముందుగానే పూర్తిగా నిర్ణయించదు.
- issue: పాదాలు కడిగే సందర్భంలో καθαροί భావం
  choice: శుద్ధులు
  alternative: శుభ్రంగా ఉన్నవారు
  rationale: భౌతిక కడుగుదలతో పాటు నైతిక/ఆధ్యాత్మిక స్థితిని సూచించే ఉద్దేశపూర్వక ద్వంద్వార్థాన్ని ‘శుద్ధులు’ కాపాడుతుంది; కేవలం బాహ్య పరిశుభ్రతకో, కేవలం నైతిక పవిత్రతకో పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే వచనానికి తగిన గౌరవప్రదమైన శైలి. ప్రధాన పాఠంలో మూలంలోని కారణ సంబంధం, కృదంత భావం, ‘శుద్ధులు’ అనే ఉద్దేశపూర్వక భావవిస్తృతి నిలుపబడ్డాయి.
