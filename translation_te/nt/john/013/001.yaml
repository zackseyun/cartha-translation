revisions:
- from: పస్కా పండుగకు ముందు, ఈ లోకం నుండి తండ్రి వద్దకు వెళ్లే తన గడియ వచ్చిందని యేసుకు తెలుసు. లోకంలో ఉన్న తనవారిని ప్రేమించిన ఆయన, వారిని అంతం వరకు[a] ప్రేమించాడు.
  to: పస్కా పండుగకు ముందు, ఈ లోకం నుండి తండ్రియొద్దకు వెళ్లవలసిన తన గడియ వచ్చిందని యేసు తెలిసి, లోకంలో ఉన్న తనవారిని ప్రేమించిన ఆయన వారిని అంతం వరకు[a] ప్రేమించాడు.
  rationale: The revision retains all lexical and theological choices of the draft while restoring the participial flow of the Greek. “వెళ్లవలసిన తన గడియ” expresses the purpose/complement relation of ἵνα μεταβῇ without specifying a doctrinal interpretation of Jesus' departure. “అంతం వరకు” remains in the text, and the footnote retains the alternative qualitative sense.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:30:06Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the Passover setting, Jesus' awareness, his departure from the world to the Father, his love for his own in the world, and the deliberately open-ended force of εἰς τέλος. However, the finite present form “తెలుసు” and the sentence break weaken the Greek participial construction (εἰδώς) and its connection to the climactic main verb, “loved.”
  naturalness: The wording is generally clear and modern, but recasting the verse as one Telugu sentence with “తెలిసి” is more natural for the source syntax and avoids the slightly abrupt transition created by the full stop after “తెలుసు.”
  terminology: “పస్కా పండుగ,” “తండ్రి,” “తనవారు,” and “అంతం వరకు” are appropriate. “తండ్రియొద్దకు” more directly expresses πρὸς τὸν πατέρα while retaining the Johannine title. The footnote properly preserves the qualitative sense of εἰς τέλος without displacing the temporal sense in the main text.
  issues:
  - severity: medium
    issue: The translation uses “యేసుకు తెలుసు” as an independent present-tense sentence.
    rationale: εἰδώς is a participle modifying the main action ἠγάπησεν. Rendering it as “తెలిసి” maintains Jesus' knowing awareness and its syntactic relation to the declaration that he loved them.
  - severity: low
    issue: The main Greek sentence is divided into two Telugu sentences.
    rationale: This is not inherently inaccurate, but here it obscures the progression from Jesus' awareness of his hour to the final statement of his love. A single sentence better preserves the source's literary structure.
  revised_text: పస్కా పండుగకు ముందు, ఈ లోకం నుండి తండ్రియొద్దకు వెళ్లవలసిన తన గడియ వచ్చిందని యేసు తెలిసి, లోకంలో ఉన్న తనవారిని ప్రేమించిన ఆయన వారిని అంతం వరకు[a] ప్రేమించాడు.
  revised_footnotes:
