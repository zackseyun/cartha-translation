id: JHN.13.1
reference: John 13:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: te
  text: పస్కా పండుగకు ముందు, ఈ లోకం నుండి తండ్రియొద్దకు వెళ్లవలసిన తన గడియ వచ్చిందని యేసు తెలిసి, లోకంలో ఉన్న తనవారిని ప్రేమించిన ఆయన వారిని అంతం వరకు[a] ప్రేమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పూర్తిగా,’ ‘సంపూర్ణంగా.’ గ్రీకు పదబంధం చివరి వరకు నిలిచే ప్రేమను, ప్రేమ యొక్క సంపూర్ణతను—రెండింటినీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: పస్కా పండుగకు ముందు
  rationale: πρό కాలపరమైన ముందుదనాన్ని సూచిస్తుంది; δέ స్వల్ప అనుసంధాన పదం. తెలుగులో అనవసరమైన వ్యతిరేక భావాన్ని చేర్చకుండా సహజంగా అనువదించబడింది.
- source_word: εἰδὼς
  choice: తెలుసు
  rationale: ఈ సందర్భంలో యేసుకు అప్పటికే ఉన్న స్పష్టమైన అవగాహనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: తన గడియ వచ్చింది
  rationale: యోహాను రచనలోని ప్రత్యేకమైన ‘గడియ’ రూపకాన్ని, దాని నిర్ణీత సమయం అనే భావంతో సహా, నిలుపుతుంది.
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: ఈ లోకం నుండి తండ్రి వద్దకు వెళ్లే
  rationale: μεταβῇ సూచించే మార్పు లేదా ప్రయాణాన్ని సహజంగా తెలియజేస్తూ, మరణం మరియు మహిమపరచబడటం అనే భావాలలో ఏ ఒక్కదానికీ పరిమితం చేయదు.
- source_word: ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: లోకంలో ఉన్న తనవారిని ప్రేమించిన ఆయన
  rationale: ‘తనవారు’ అనే విస్తృత సంబంధపూర్వక పదాన్ని నిలుపుతూ, దానిని కేవలం శిష్యులకే పరిమితం చేయదు; కృదంత నిర్మాణ భావాన్నీ కాపాడుతుంది.
- source_word: εἰς τέλος
  choice: అంతం వరకు
  rationale: కాలపరమైన ‘చివరి వరకు’ అనే భావాన్ని నేరుగా నిలుపుతుంది; ‘పూర్తిగా’ లేదా ‘సంపూర్ణంగా’ అనే గుణాత్మక భావసాధ్యతను పాదసూచికలో ఉంచుతుంది.
- source_word: ἠγάπησεν αὐτούς
  choice: వారిని ప్రేమించాడు
  rationale: ἀγαπάω యొక్క సరళమైన ప్రేమార్థాన్ని, కథనంలోని భూతకాల క్రియగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
theological_decisions:
- issue: εἰς τέλος అనే పదబంధంలో కాలపరమైన ముగింపు మరియు ప్రేమ యొక్క సంపూర్ణత మధ్య ఉన్న భావసాంద్రత
  choice: ప్రధాన పాఠ్యంలో ‘అంతం వరకు’
  alternative: ‘పూర్తిగా’ లేదా ‘సంపూర్ణంగా’
  rationale: ఈ గ్రీకు పదబంధం చివరి క్షణం వరకు కొనసాగిన ప్రేమనూ, సంపూర్ణ స్థాయిలో చూపిన ప్రేమనూ సూచించగలదు. ప్రధాన పాఠ్యం కాలపరమైన రూపాన్ని నిలుపుతుండగా, పాదసూచిక రెండవ భావాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘గడియ,’ ‘తనవారు,’ ‘అంతం వరకు’ వంటి యోహాను రచనలో ప్రాధాన్యమున్న భావరూపాలు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
