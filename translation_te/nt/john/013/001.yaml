    text: లేదా, ‘పూర్తిగా,’ ‘సంపూర్ణంగా.’ గ్రీకు పదబంధం చివరి వరకు నిలిచే ప్రేమను, ప్రేమ యొక్క సంపూర్ణతను—రెండింటినీ సూచించవచ్చు.
    reason: lexical_alternative
  revision_rationale: The revision retains all lexical and theological choices of the draft while restoring the participial flow of the Greek. “వెళ్లవలసిన తన గడియ” expresses the purpose/complement relation of ἵνα μεταβῇ without specifying a doctrinal interpretation of Jesus' departure. “అంతం వరకు” remains in the text, and the footnote retains the alternative qualitative sense.
