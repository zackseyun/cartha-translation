  text: ⸀ἀναπεσὼν ἐκεῖνος οὕτως ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ λέγει αὐτῷ· Κύριε, τίς ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: te
  text: అప్పుడు అతడు యేసు ఛాతీకి అలా వెనక్కి వాలి[a], “ప్రభువా, అతనెవరు?” అని ఆయనను అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు ఛాతీపై ఆనుకొని పడుకుని.” గ్రీకు పదం ఆ కాలంలో భోజనం చేసేటప్పుడు ఆనుకొని పడుకునే భంగిమను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπεσὼν
  choice: ఆనుకొని
  rationale: భోజనానికి ఆనుకొని పడుకునే నాటి భంగిమలో యేసువైపు వెనక్కి వాలి ఆయన రొమ్ముకు ఆనిన కదలికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκεῖνος
  choice: అతడు
  rationale: ముందరి సందర్భంలో పేర్కొన్న శిష్యుణ్ణి సూచించే సర్వనామంగా మూలంలోని నిర్దేశక భావాన్ని అతిగా విపులీకరించకుండా ఉంచుతుంది.
- source_word: οὕτως
  choice: అలా
  rationale: ముందరి వచనంలో వివరించిన భోజన భంగిమతో ఈ చర్యకు ఉన్న సంబంధాన్ని సహజంగా చూపిస్తుంది.
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: యేసు రొమ్ముకు
  rationale: στῆθος సూచించే ఛాతీ/రొమ్ము భాగాన్ని, దానివైపు ఆనిన భంగిమను సంక్షిప్తంగా మరియు సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λέγει αὐτῷ
  choice: ఆయనను అడిగాడు
  rationale: అక్షరార్థంగా ‘ఆయనతో అంటున్నాడు’ అయినా, ప్రశ్నను ఉద్దేశించి చెప్పినందున తెలుగులో ‘అడిగాడు’ సహజం; కథనంలోని చారిత్రక వర్తమానాన్ని సాధారణ భూతకాలంగా ఇచ్చింది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును నేరుగా సంబోధించే గౌరవార్థకతనూ, యోహాను సువార్తలోని విస్తృత క్రీస్తుతాత్త్విక ప్రతిధ్వనినీ తెరిచి ఉంచుతుంది.
- source_word: τίς ἐστιν;
  choice: అతడు ఎవరు?
  rationale: యేసు సూచించిన వ్యక్తి ఎవరో అడిగే ప్రశ్నను తెలుగులో స్పష్టంగా తెలియజేస్తుంది; గ్రీకులో అంతర్లీనంగా ఉన్న వ్యక్తి సూచనను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసును నేరుగా సంబోధించేటప్పుడు κύριος అనువాదం
  choice: ప్రభువా
  alternative: అయ్యా / బోధకుడా
  rationale: ఇది గౌరవపూర్వక సంబోధనగా ఉండగలిగినా, ‘ప్రభువా’ అనే రూపం యోహాను వాడుకలోని క్రీస్తుతాత్త్విక విస్తృతిని తగ్గించకుండా, ఒక్క అర్థానికే పరిమితం చేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. భోజన భంగిమ ఆధునిక పాఠకులకు వెంటనే స్పష్టంగా ఉండకపోవడంతో పాదటిప్పణి ఇచ్చాం; ప్రధాన వాక్యాన్ని భారంగా చేయలేదు.
