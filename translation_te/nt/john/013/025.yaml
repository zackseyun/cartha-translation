  naturalness: «యేసు రొమ్ముకు ఆనుకొని» కంటే ఆధునిక ప్రామాణిక తెలుగులో «యేసు ఛాతీకి ... వెనక్కి వాలి» మరింత సహజంగా, స్పష్టంగా ఉంటుంది. పాదటిప్పణి గుర్తు ప్రస్తుతం «అతడు»కు జతచేయబడినా, టిప్పణి సర్వనామానికి కాక భోజన భంగిమకు సంబంధించినది; దానిని «వాలి» తర్వాత ఉంచాలి.
