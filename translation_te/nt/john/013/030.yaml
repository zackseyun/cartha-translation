  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: te
  text: కాబట్టి, ఆ రొట్టె ముక్కను[a] తీసుకున్న తరువాత, అతడు[b] వెంటనే బయటికి వెళ్లాడు. అది రాత్రి సమయం.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆ ముద్దను’ లేదా ‘ఆ ముక్కను’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం భోజనంలో ఇచ్చిన చిన్న రొట్టె ముక్కను లేదా ఆహారపు ముద్దను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మూలంలో ‘ఆ వ్యక్తి’ అనే భావమిచ్చే సూచన సర్వనామం ఉంది; సాధారణ ‘అతడు’ కంటే అది కొంత ఉద్ఘాటనతో యూదాపై దృష్టి నిలుపుతుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘రాత్రి’ అనేది నిజమైన సమయసూచన. అదే సమయంలో, యోహాను సువార్తలో కనిపించే వెలుగు–చీకటి అంశాన్ని కూడా ఇది ప్రతిధ్వనింపజేయవచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν
  choice: తీసుకున్న తరువాత
  rationale: ఆరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందు జరిగిన కార్యాన్ని సూచిస్తోంది; ఆధునిక తెలుగులో కాలక్రమాన్ని సహజంగా, స్పష్టంగా తెలియజేయడానికి ఈ రూపం సరిపోతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సంఘటనకు అనుసంధానంగా కథనం ముందుకు సాగుతున్న భావాన్ని నిలుపుతుంది.
- source_word: τὸ ψωμίον
  choice: ఆ రొట్టె ముక్కను
  rationale: ψωμίον భోజనంలో ఇచ్చిన చిన్న రొట్టె ముక్కను లేదా ఆహారపు ముద్దను సూచించవచ్చు; సందర్భంలో స్పష్టంగా ఉండేలా ‘రొట్టె ముక్క’ అని అనువదించబడింది.
- source_word: ἐκεῖνος
  choice: అతడు
  rationale: తెలుగులో ‘అతడు’ గౌరవప్రద కథనశైలికి సరిపోతూ, సమీపేతర సూచనను కలిగి ఉంది. గ్రీకులోని అదనపు ఉద్ఘాటనను పాదటిప్పణిలో తెలియజేశారు; ప్రధాన వాక్యంలో అసహజమైన ‘ఆ వ్యక్తి’ని నివారించారు.
- source_word: ἐξῆλθεν
  choice: బయటికి వెళ్లాడు
  rationale: ἐξέρχομαι లోని స్థలసంబంధమైన ‘బయటికి వెళ్లడం’ అనే భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: εὐθύς
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా జరిగిన కార్యాన్ని సహజమైన ఆధునిక తెలుగులో ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: ἦν δὲ νύξ
  choice: అప్పుడు రాత్రి
  rationale: సరళమైన తెలుగు కథనశైలిలో కాలసూచనను నిలుపుతూ, ‘రాత్రి’కి ఉండవచ్చే సంకేతార్థాన్ని ప్రధాన పాఠ్యంలో వివరించి పరిమితం చేయదు.
theological_decisions:
- issue: యోహాను సువార్త సందర్భంలో ‘రాత్రి’కి ఉండవచ్చే సంకేతార్థం
  choice: కాలసూచనగా ‘అప్పుడు రాత్రి’ అని సరళంగా అనువదించడం
  alternative: ప్రధాన పాఠ్యంలోనే దాన్ని ఆధ్యాత్మిక చీకటికి సంకేతంగా వివరించడం
  rationale: గ్రీకు వాక్యం నేరుగా రాత్రి సమయాన్ని పేర్కొంటుంది. యోహాను సువార్తలో వెలుగు–చీకటి అంశం కారణంగా దీనికి సంకేతార్థం కూడా ఉండవచ్చు; అయితే ఆ భావాన్ని ప్రధాన పాఠ్యంలో చేరిస్తే మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తత, వ్యాఖ్యాన స్వేచ్ఛ తగ్గిపోతాయి.
- issue: యూదాను సూచించే ἐκεῖνος పదంలోని ఉద్ఘాటన
  choice: ప్రధాన పాఠ్యంలో సహజమైన ‘అతడు’ వాడి, గ్రీకు ఉద్ఘాటనను పాదటిప్పణిలో నమోదు చేయడం
  alternative: ‘ఆ వ్యక్తి’ లేదా ‘అతడే’ అని అనువదించడం
  rationale: ‘ఆ వ్యక్తి’ తెలుగులో అనవసరంగా కఠినంగా ఉంటుంది; ‘అతడే’ మూలంలో తప్పనిసరిగా లేని ప్రత్యేకత లేదా వ్యతిరేకతను బలంగా సూచించవచ్చు. ‘అతడు’ సహజంగా ఉండగా, పాదటిప్పణి మూలంలోని గుర్తింపును, ఉద్ఘాటనను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథనశైలి. చిన్న గ్రీకు వాక్యాల సాహిత్య బలాన్ని నిలుపుటకు చివరి వాక్యాన్ని ఉద్దేశపూర్వకంగా సంక్షిప్తంగా ఉంచాం.
