id: JHN.13.3
reference: John 13:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: te
  text: తండ్రి సమస్తాన్నీ యేసు చేతుల్లోకి అప్పగించాడనీ, తాను దేవుని నుండి వచ్చాడనీ[a], దేవుని దగ్గరకు వెళ్తున్నాడనీ[b] యేసుకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దేవుని నుండి బయలుదేరి వచ్చాడనీ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “దేవుని దగ్గరకు తిరిగి వెళ్తున్నాడనీ” అని కూడా అర్థం చేసుకోవచ్చు; గ్రీకు పాఠంలో “తిరిగి” అనే పదం లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: యేసుకు తెలుసు
  rationale: ఈ కృదంతం తరువాతి చర్యకు నేపథ్యంగా యేసుకు ఉన్న జ్ఞానాన్ని సూచిస్తుంది. తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం దీనిని ప్రధాన క్రియగా చివర ఉంచాం.
- source_word: πάντα
  choice: సమస్తాన్నీ
  rationale: నపుంసక బహువచనం సూచించే సమగ్ర పరిధిని సంక్షిప్తంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας
  choice: తండ్రి సమస్తాన్నీ తన చేతుల్లో పెట్టాడనీ
  rationale: తండ్రి అప్పగించిన అధికారాన్ని సూచించే ‘చేతుల్లో’ అనే స్పష్టమైన రూపకాన్ని నిలుపుతూ, తెలుగులో సహజంగా అనిపించే ‘పెట్టాడు’ అనే క్రియను వాడాం.
- source_word: ἀπὸ θεοῦ ἐξῆλθεν
  choice: దేవుని దగ్గర నుండి వచ్చాడనీ
  rationale: యేసు మూలం మరియు పంపబడడాన్ని సూచించే యోహాను శైలిని నిలుపుతుంది; ‘దేవుని నుండి’ అనే మూలపాఠంలోని పదాన్ని ‘తండ్రి నుండి’గా మార్చలేదు.
- source_word: πρὸς τὸν θεὸν ὑπάγει
  choice: దేవుని దగ్గరకు వెళ్తున్నాడనీ
  rationale: ప్రస్తుతకాల గమన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, మూలపాఠంలో ప్రత్యక్షంగా లేని ‘తిరిగి’ అనే భావాన్ని ప్రధాన పాఠంలో చేర్చలేదు.
theological_decisions:
- issue: ἀπὸ θεοῦ ἐξῆλθεν లోని క్రీస్తు మూలాన్ని తెలిపే భాష
  choice: తాను దేవుని దగ్గర నుండి వచ్చాడనీ
  alternative: తాను దేవుని నుండి బయలుదేరి వచ్చాడనీ
  rationale: యేసు దేవుని నుండి వచ్చాడనే బలమైన ప్రకటనను నిలుపుతూ, ఈ వచనంలో స్పష్టంగా లేని తరువాతి సిద్ధాంతపరమైన వివరణలను చేర్చలేదు.
- issue: πρὸς τὸν θεὸν ὑπάγει లోని గమ్యార్థం
  choice: దేవుని దగ్గరకు వెళ్తున్నాడనీ
  alternative: దేవుని దగ్గరకు తిరిగి వెళ్తున్నాడనీ
  rationale: సందర్భం తిరిగి వెళ్లడాన్ని సూచించవచ్చు; అయితే ఈ గ్రీకు పదబంధంలో ‘తిరిగి’ అనే పదం లేదు. అందువల్ల ప్రధాన పాఠం ఆ భావాన్ని స్పష్టీకరించకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. గ్రీకు వాక్యం తరువాతి వచనంలో కొనసాగే నిర్మాణమైనప్పటికీ, ఈ ఒక్క వచనాన్ని తెలుగులో అర్థవంతంగా చదవగలిగేలా ‘యేసుకు తెలుసు’ అని ముగించాం; తదుపరి వచనంతో కలిపి చదివినప్పుడు ఈ జ్ఞానం తరువాతి చర్యకు నేపథ్యంగా ఉంటుంది.
