id: JHN.13.26
reference: John 13:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: te
  text: 'యేసు జవాబిచ్చాడు: “నేను రొట్టె ముక్కను ముంచి ఎవరికైతే ఇస్తానో, అతడే.” అప్పుడు ఆయన రొట్టె ముక్కను ముంచిన తర్వాత, ఇస్కరియోతు సీమోను కుమారుడైన యూదాకు[a] దానిని ఇచ్చాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సీమోను కుమారుడైన ఇస్కరియోతు యూదాకు.” గ్రీకు పదబంధాన్ని ఈ రెండు విధాలుగానూ అన్వయించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: ఇలా జవాబిచ్చాడు
  rationale: గ్రీకులో ఇది చారిత్రక వర్తమాన కాలం. ఆధునిక తెలుగు కథనంలో సహజంగా వినిపించేందుకు భూతకాలాన్ని వాడుతూ, జవాబు చెప్పే భావాన్ని స్పష్టంగా నిలిపింది.
- source_word: Ἐκεῖνός ἐστιν
  choice: అతడే
  rationale: ఇది ఒక వ్యక్తిని నిర్దిష్టంగా గుర్తిస్తుంది. తెలుగు సందర్భంలో ‘అతడే’ సంక్షిప్తంగా, సహజంగా ఆ గుర్తింపు బలాన్ని తెలియజేస్తుంది.
- source_word: ᾧ
  choice: ఎవరికైతే
  rationale: దత్తి విభక్తిలోని సంబంధ సర్వనామాన్ని ‘ఎవరికైతే’గా అనువదించడం, రొట్టె ముక్కను అందుకునే వ్యక్తిని స్పష్టంగా సూచిస్తుంది.
- source_word: βάψω
  choice: ముంచి
  rationale: ఇక్కడ ఆహారాన్ని ద్రవంలో ముంచడం ఉద్దేశం; కర్మకాండ సంబంధమైన కడగడం లేదా బాప్తిస్మం కాదు. భవిష్య భావం ‘ఇస్తానో’తో కూడిన వాక్య నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: τὸ ψωμίον
  choice: రొట్టె ముక్కను
  rationale: ψωμίον చిన్న రొట్టె ముక్కను లేదా ఆహారపు ముద్దను సూచిస్తుంది. ‘రొట్టె ముక్క’ సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: καὶ δώσω αὐτῷ
  choice: ఎవరికైతే ఇస్తానో
  rationale: గ్రీకు వాక్యంలో ఇవ్వడం అనే చర్యతో దత్తి సంబంధం కలిసివుంది. తెలుగు సంబంధ వాక్య నిర్మాణం వస్తువును అనవసరంగా పునరుక్తి చేయకుండా ఆ భావాన్ని అందిస్తుంది.
- source_word: βάψας οὖν
  choice: ఆ తర్వాత ఆయన … ముంచి
  rationale: అయోరిస్ట్ పార్టిసిపిల్ ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది. ‘ఆ తర్వాత … ముంచి’ చర్యల క్రమాన్ని సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: δίδωσιν
  choice: ఇచ్చాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగు కథన శైలికి సహజమైన భూతకాలంతో అందించింది.
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: ఇస్కరియోతు సీమోను కుమారుడైన యూదాకు
  rationale: గ్రీకు పదక్రమం మరియు విభక్తి సంబంధాన్ని అనుసరించి, ప్రధాన పాఠంలో ‘ఇస్కరియోతు’ను సీమోనుతో అనుసంధానించింది; మరో సాధ్యమైన అన్వయాన్ని పాదసూచికలో నిలిపింది.
theological_decisions:
- issue: చివరి పదబంధంలో ‘ఇస్కరియోతు’ ఎవరికీ సంబంధించినది?
  choice: ప్రధాన పాఠంలో ‘ఇస్కరియోతు సీమోను కుమారుడైన యూదా’
  alternative: ‘సీమోను కుమారుడైన ఇస్కరియోతు యూదా’
  rationale: Σίμωνος Ἰσκαριώτου అనే వరుసను అత్యంత ప్రత్యక్షంగా తీసుకుంటే ‘ఇస్కరియోతు సీమోను’ అని అర్థమవుతుంది. అయితే సంప్రదాయ గుర్తింపును అనుసరించి ‘ఇస్కరియోతు’ను యూదాతో కలపడం కూడా గ్రీకు నిర్మాణానికి సాధ్యమైన అన్వయం. ఈ అస్పష్టతను పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన భూతకాలంతో అందించింది; వ్యక్తి గుర్తింపులోని నిజమైన వ్యాకరణ అస్పష్టతను పాదసూచికలో నిలిపింది.
