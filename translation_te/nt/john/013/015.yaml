id: JHN.13.15
reference: John 13:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑπόδειγμα γὰρ ἔδωκα ὑμῖν ἵνα καθὼς ἐγὼ ἐποίησα ὑμῖν καὶ ὑμεῖς ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: te
  text: ఎందుకంటే, నేను మీకు చేసినట్లే మీరు కూడా చేయాలని మీకు ఒక మాదిరిని[a] ఇచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నమూనాను,’ ‘ఆదర్శాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: ఒక మాదిరి
  rationale: అనుకరించడానికి ఉంచిన ఉదాహరణ లేదా నమూనా అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘మాదిరి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు లేదా చర్యకు ఈ వాక్యం వివరణ ఇస్తున్న సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἔδωκα
  choice: ఇచ్చాను
  rationale: గ్రీకు ఏఓరిస్ట్‌లోని గత చర్యను తెలుగు సహజ భూతకాలంతో నేరుగా వ్యక్తం చేస్తుంది; సందర్భమే దాని ప్రస్తుత ప్రాముఖ్యతను తెలియజేస్తుంది.
- source_word: ἵνα
  choice: చేయాలని
  rationale: తెలుగులో సహజమైన ఉద్దేశార్థక నిర్మాణం; యేసు మాదిరి ఇచ్చిన ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: καθὼς
  choice: చేసినట్లే
  rationale: యేసు చేసినదానికీ శిష్యులు చేయవలసినదానికీ ఉన్న అనురూపతను ‘అట్లే’ భావంతో స్పష్టంగా చూపుతుంది.
- source_word: ἐποίησα ὑμῖν
  choice: నేను మీకు చేసిన
  rationale: ὑμῖν అనే దత్తివును ‘మీకు’గా నేరుగా నిలుపుతూ, పాదాలు కడిగిన సందర్భంలో తెలుగులో సహజంగా అర్థమయ్యేలా చేస్తుంది; ‘మీ కోసం’ అని ప్రయోజనార్థాన్ని అతిగా నిర్ధారించదు.
- source_word: καὶ ὑμεῖς
  choice: మీరు కూడా
  rationale: శిష్యులు సైతం యేసు చేసినదానికి అనుగుణంగా చేయాలనే సమాంతర, ఉద్ఘాటిత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ποιῆτε
  choice: చేయాలని
  rationale: ἵναతో వచ్చిన సబ్జంక్టివ్‌ను ఉద్దేశం/ఆశించిన చర్యగా తెలుగులో వ్యక్తం చేస్తుంది; దానిని వేరే ప్రత్యక్ష ఆజ్ఞగా మార్చదు.
theological_decisions:
- issue: శిష్యులు యేసు చర్యను అనుకరించాలనే వాక్యబలం
  choice: యేసు చేసిన చర్యను శిష్యులు అనుసరించవలసిన మాదిరిగా చూపించడం
  alternative: ఇది అన్ని సందర్భాల్లో తప్పనిసరి పాదప్రక్షాళన ఆచారమని లేదా కేవలం ప్రతీక మాత్రమేనని నిర్దిష్టీకరించడం
  rationale: వచనం అనుకరణను స్పష్టంగా కోరుతుంది; అయితే ఆ అనుకరణను ఒక విశిష్ట సంఘాచారంగా పరిమితం చేయాలా, విస్తృత సేవా సూత్రంగా చూడాలా అన్నది ఈ వచనం ఒక్కటే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘మీకు చేసిన’ ద్వారా గ్రీకు దత్తివులోని స్వల్ప అస్పష్టతను నిలిపి, ‘మీ కోసం’ అనే ప్రయోజనార్థ వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చలేదు.
