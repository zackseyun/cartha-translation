source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: te
  text: సీమోను పేతురు ఆయనతో, “ప్రభువా, మీరు ఎక్కడికి వెళ్తున్నారు?” అన్నాడు. యేసు, “నేను వెళ్తున్న చోటికి ఇప్పుడు నువ్వు నన్ను అనుసరించలేవు[a]. కానీ తరువాత అనుసరిస్తావు[b]” అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఇప్పుడు నన్ను అనుసరించడానికి నీకు సామర్థ్యం లేదు.” గ్రీకులో సామర్థ్యాన్ని తెలిపే క్రియ స్పష్టంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “తరువాత అనుసరిస్తావు” అనే మాట పేతురు తరువాత యేసును బాధలో లేదా మరణంలో అనుసరించడాన్ని సూచించవచ్చు; అయితే అది ఏ విధంగా జరుగుతుందో ఈ మాటలే నిర్దిష్టంగా చెప్పవు.
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, ఆధునిక తెలుగు కథనంలో సహజమైన భూతకాల సంభాషణారంభాన్ని వాడాం; మాటల సజీవతను ప్రత్యక్ష ఉద్ధరణ నిలుపుతుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: గౌరవపూర్వక ప్రత్యక్ష సంబోధనను, అలాగే ఈ బిరుదులోని వేదాంతపరమైన ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ποῦ ὑπάγεις
  choice: మీరు ఎక్కడికి వెళ్తున్నారు?
  rationale: ὑπάγω యొక్క సాధారణ ‘వెళ్లు’ భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది; గమ్యాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: సంభాషణా కథనంలో ἀποκρίνομαιకు సహజమైన తెలుగు సమానార్థకం.
- source_word: Ὅπου ὑπάγω
  choice: నేను వెళ్తున్న చోటికి
  rationale: పేతురు ప్రశ్నలోని ‘వెళ్తున్నారు’ అనే క్రియతో ఉన్న పదబంధ సంబంధాన్ని నిలుపుతుంది.
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: ఇప్పుడు నువ్వు నన్ను అనుసరించలేవు
  rationale: δύναμαι తెలిపే సామర్థ్య భావాన్ని ‘లేవు’ అనే క్రియారూపంతో స్పష్టంగా ఉంచి, μοιతో కూడిన ἀκολουθέωను ‘నన్ను అనుసరించు’గా సహజంగా అనువదిస్తుంది.
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: కానీ తరువాత అనుసరిస్తావు
  rationale: భవిష్యత్ కాలాన్ని నిలుపుతూ, δέలోని వ్యతిరేకతను ‘కానీ’తోను ὕστερονను ‘తరువాత’తోను వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పేతురు తరువాత యేసును అనుసరించడం దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో దాని విధానాన్ని నిర్దిష్టం చేయకుండా ‘తరువాత అనుసరిస్తావు’ అని ఉంచాం.
  alternative: ఇది పేతురు తరువాత పొందే పునరుద్ధరణను, శిష్యత్వాన్ని, బాధను లేదా మరణాన్ని ప్రత్యేకంగా సూచిస్తుందని అనువదించడం.
  rationale: గ్రీకు వాక్యం పేతురు తరువాత అనుసరిస్తాడని మాత్రమే చెబుతుంది. అతని హతసాక్షి మరణమో, పునరుద్ధరించబడిన శిష్యత్వమో, మరేదైనా భావమో పాఠ్యమే స్పష్టంగా నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన సంభాషణా శైలిని వాడాం. పేతురు యేసును ‘మీరు’ అని గౌరవంగా సంబోధిస్తాడు; యేసు పేతురుతో ‘నువ్వు’ అని మాట్లాడటం తెలుగు సందర్భంలో సహజమైన గురు–శిష్య సంబంధాన్ని ప్రతిబింబిస్తుంది. ‘అనుసరించు’ శారీరకంగా వెంట వెళ్లడం మరియు శిష్యునిగా వెంబడించడం అనే రెండు సాధ్య భావాలనూ తెరిచి ఉంచుతుంది.
