id: JHN.13.10
reference: John 13:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: te
  text: యేసు అతనితో, “స్నానం చేసినవాడు[a] తన పాదాలు కడుక్కోవడం తప్ప మరేమీ అవసరం లేదు; అతడు పూర్తిగా శుభ్రంగా ఉన్నాడు. మీరూ శుభ్రంగా ఉన్నారు, అయితే మీలో అందరూ కాదు” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో కడగడానికి రెండు వేర్వేరు క్రియలు ఉన్నాయి: λούω అంటే సాధారణంగా శరీరమంతా ‘స్నానం చేయడం’; νίπτω అంటే పాదాల వంటి శరీరభాగాన్ని ‘కడగడం.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λελουμένος
  choice: స్నానం చేసినవాడు
  rationale: λούω అనే క్రియ సాధారణంగా శరీరమంతా కడుక్కోవడాన్ని సూచిస్తుంది. పరిపూర్ణకాల కృదంతం పూర్తయిన స్నానం వల్ల ఏర్పడిన స్థితిని తెలియజేస్తుంది; ‘స్నానం చేసినవాడు’ ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὐκ ἔχει χρείαν
  choice: మరేమీ అవసరం లేదు
  rationale: ἔχει χρείαν అనే గ్రీకు నుడికారానికి ఇది సహజమైన తెలుగు రూపం. తరువాత వచ్చే ఏకైక మినహాయింపుతో వాక్యం స్పష్టంగా కలిసేందుకు ‘మరేమీ’ చేర్చబడింది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: ముందటి నిరాకరణకు ఏకైక మినహాయింపును ఇది సూచిస్తుంది.
- source_word: τοὺς πόδας νίψασθαι
  choice: తన పాదాలు కడుక్కోవడం
  rationale: νίπτω శరీరంలోని ఒక భాగాన్ని కడగడాన్ని సూచించగలదు. ఏకవచన కర్తతో సంబంధాన్ని సహజంగా తెలియజేయడానికి ‘తన’ వాడబడింది.
- source_word: καθαρὸς ὅλος
  choice: పూర్తిగా శుభ్రంగా
  rationale: ὅλος సంపూర్ణతను నొక్కిచెబుతుంది. ‘శుభ్రంగా’ అనే పదం శరీర శుద్ధి చిత్రణను నిలుపుతూ అంతర్లీన ఆధ్యాత్మిక భావానికి కూడా అవకాశం ఇస్తుంది.
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: మీరూ శుభ్రంగా ఉన్నారు
  rationale: బహువచన సంబోధనను, అలాగే καθαρός పదపు పునరుక్తిని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: అయితే మీలో అందరూ కాదు
  rationale: శిష్యుల సమూహంలో ఒక మినహాయింపు ఉందనే భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: యేసు అతనితో … అని అన్నాడు
  rationale: గ్రీకులో ఇది కథన వర్తమానకాలంలో ఉన్నప్పటికీ, తెలుగు కథన శైలిలో భూతకాల రూపం సహజంగా ఉంటుంది.
theological_decisions:
- issue: అక్షరార్థ కడుగుదల చిత్రణ మరియు సూచిత ఆధ్యాత్మిక శుద్ధి
  choice: ‘స్నానం చేసినవాడు,’ ‘పాదాలు కడుక్కోవడం,’ ‘శుభ్రంగా’ అనే పదాలతో రెండు స్థాయుల భావాన్ని వ్యాఖ్యానించకుండా నిలుపడం
  alternative: ‘ఆధ్యాత్మికంగా శుద్ధులు’ అని వివరణాత్మకంగా విస్తరించడం లేదా λούω, νίπτω రెండింటినీ ఒకే తెలుగు క్రియతో సమతలీకరించడం
  rationale: సందర్భంలో అక్షరార్థం, సంకేతార్థం రెండూ కలిసి పనిచేస్తాయి. అనువాదం ఏ ప్రత్యేక సిద్ధాంత వివరణనూ రుద్దకుండా గ్రీకు క్రియల భేదాన్ని మరియు ‘శుభ్రం’ అనే పదంలోని ఉద్వేగాన్ని నిలుపుతుంది.
- issue: పురుషలింగ ఏకవచన కృదంతం
  choice: సామాన్య సూత్రవాక్యానికి సహజమైన ‘స్నానం చేసినవాడు’
  alternative: లింగాన్ని పూర్తిగా తొలగించే బహువచన నిర్మాణం
  rationale: గ్రీకు రూపం పురుషలింగ ఏకవచనమైనా ఇక్కడ సాధారణ వ్యక్తిని సూచిస్తుంది. తెలుగు రూపం ఏకవచనాన్ని నిలుపుతూ సహజమైన సామాన్య ప్రయోగంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో రూపొందించబడింది. గ్రీకు వాక్యంలోని స్నానం–పాదాలు కడగడం భేదం స్పష్టంగా ఉంచబడింది; ‘శుభ్రంగా’ అనే పదం అక్షరార్థం మరియు సూచిత ఆధ్యాత్మిక భావం రెండింటినీ తెరిచి ఉంచుతుంది.
