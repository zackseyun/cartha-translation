source:
  edition: SBLGNT
  text: ἐν τούτῳ γνώσονται πάντες ὅτι ἐμοὶ μαθηταί ἐστε, ἐὰν ἀγάπην ἔχητε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: te
  text: మీరు ఒకరిపట్ల ఒకరు ప్రేమ కలిగి ఉంటే, దానివల్ల మీరు నా శిష్యులని అందరూ తెలుసుకుంటారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: దానివల్ల
  rationale: ఈ పదబంధం ముందున్న పరస్పర ప్రేమను శిష్యత్వాన్ని గుర్తించే ఆధారంగా లేదా సాధనంగా సూచిస్తోంది. ‘దానివల్ల’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: γνώσονται
  choice: తెలుసుకుంటారు
  rationale: భవిష్యత్ కాలంలోని ఈ క్రియ ఒక విషయాన్ని తెలుసుకోవడం లేదా గుర్తించడం అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘తెలుసుకుంటారు’ ఆ విస్తృతిని కాపాడుతుంది.
- source_word: πάντες
  choice: అందరూ
  rationale: ఇక్కడ పదం లింగభేదం లేకుండా సమస్త ప్రజలను సాధారణంగా సూచిస్తుంది; ‘అందరూ’ సహజమైన, సమగ్ర తెలుగు ప్రయోగం.
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: మీరు నా శిష్యులని
  rationale: దత్తి విభక్తిలోని ἐμοὶ ఇక్కడ అనుబంధం లేదా స్వామ్య భావాన్ని తెలుపుతుంది. ‘నా శిష్యులు’ సూటిగా, సహజంగా ఉంది.
- source_word: ἐὰν
  choice: ఉంటే
  rationale: సంభావ్యార్థక క్రియతో కూడిన షరతును నిలుపుతూ, తెలుగులో సహజమైన షరతు నిర్మాణాన్ని ఇస్తుంది.
- source_word: ἀγάπην ἔχητε ἐν ἀλλήλοις
  choice: మీరు ఒకరిపట్ల ఒకరు ప్రేమ కలిగి ఉంటే
  rationale: మూలంలోని ‘ఒకరి మధ్య ఒకరు ప్రేమ కలిగి ఉండడం’ అనే పరస్పర సంబంధ భావాన్ని ‘ఒకరిపట్ల ఒకరు’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది; ‘ప్రేమ కలిగి ఉండడం’ ἔχω నిర్మాణాన్ని కూడా కాపాడుతుంది.
theological_decisions:
- issue: ἐὰν ద్వారా సూచించిన షరతు స్వభావం
  choice: మీరు ఒకరిపట్ల ఒకరు ప్రేమ కలిగి ఉంటే
  alternative: మీరు ఒకరిపట్ల ఒకరు ప్రేమ చూపినప్పుడు
  rationale: మూలంలోని షరతు రూపాన్ని ‘ఉంటే’ నిలుపుతుంది. ఇది శిష్యత్వాన్ని సంపాదించే సాధనమని కాకుండా, దాన్ని ఇతరులు గుర్తించే లక్షణం లేదా ఆధారం అని వాక్య నిర్మాణం తెలియజేస్తుంది.
- issue: πάντες యొక్క సమగ్ర పరిధి
  choice: అందరూ
  alternative: మనుషులందరూ
  rationale: గ్రీకు పుంలింగ బహువచనం ఇక్కడ పురుషులకు మాత్రమే పరిమితం కాదు. ‘అందరూ’ దాని సాధారణ విశ్వవ్యాప్త పరిధిని అనవసర వివరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని షరతు, పరస్పర ప్రేమ, ప్రేమను శిష్యత్వానికి గుర్తింపుగా చూపే సంబంధం స్పష్టంగా నిలుపబడ్డాయి.
