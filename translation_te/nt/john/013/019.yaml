source:
  edition: SBLGNT
  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: te
  text: ఇప్పటి నుంచే, అది జరగకముందే మీకు చెబుతున్నాను; అది జరిగినప్పుడు, ‘నేనే ఆయనని’ మీరు నమ్మేలా ఇలా చెబుతున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, ‘నేనే ఉన్నాను’ అని. ఈ గ్రీకు వ్యక్తీకరణ యెషయాలోను, యోహాను సువార్తలోని ఇతర చోట్లను కనిపించే దైవిక స్వీయ-గుర్తింపు భాషను కూడా ప్రతిధ్వనింపజేయవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: ఇకనుంచి
  rationale: ప్రస్తుత క్షణం నుంచి ముందుకు అనే కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: మీకు చెబుతున్నాను
  rationale: వర్తమానకాల క్రియను, ప్రత్యక్ష సంబోధనను సహజంగా ప్రతిబింబిస్తుంది.
- source_word: πρὸ τοῦ γενέσθαι
  choice: అది జరగకముందే
  rationale: πρόతో కూడిన infinitive సూచించే పూర్వకాల సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది; సంఘటన ఏమిటో మూలంలో నిర్దిష్టంగా చెప్పకపోవడాన్ని అలాగే ఉంచుతుంది.
- source_word: ἵνα
  choice: నమ్మడానికి
  rationale: సందర్భంలోని ఉద్దేశార్థాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: πιστεύσητε
  choice: మీరు నమ్మడానికి
  rationale: πιστεύω యొక్క సాధారణ విశ్వాసార్థాన్ని కాపాడుతుంది; ‘నమ్మడం మొదలుపెట్టడానికి’ వంటి భావాన్ని అనవసరంగా చేర్చదు.
- source_word: ὅταν γένηται
  choice: అది జరిగినప్పుడు
  rationale: భవిష్యత్తులో సంఘటన నెరవేరే సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὅτι ἐγώ εἰμι
  choice: ‘నేనే ఆయనను’ అని
  rationale: తెలుగులో అర్థమయ్యే స్వీయ-గుర్తింపు వ్యక్తీకరణను ఇస్తూనే, గ్రీకులో స్పష్టమైన విధేయపదం లేదనే విషయాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
theological_decisions:
- issue: యోహాను సందర్భంలో దైవిక స్వీయ-గుర్తింపును ప్రతిధ్వనింపజేయగల ἐγώ εἰμι అనే నిరపేక్ష వ్యక్తీకరణ అనువాదం
  choice: ‘నేనే ఆయనను’ అని
  alternative: ‘నేను ఉన్నాను’ అని
  rationale: ‘నేనే ఆయనను’ అనేది తెలుగులో గ్రాహ్యమైన స్వీయ-గుర్తింపును తెలియజేస్తుంది. అయితే గ్రీకులో విధేయపదం లేకపోవడం, యెషయాలోని దైవిక స్వీయ-గుర్తింపు భాషతో ఉండగల ప్రతిధ్వని ముఖ్యమైనవి కాబట్టి, మరింత అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఇచ్చి theological tensionను పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం; ఉద్దేశ సంబంధాన్ని ‘ఇలా చెబుతున్నాను’ అనే పునరుక్తితో స్పష్టంగా నిలిపాం.
