translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలి వాడబడింది. ‘పిల్లలారా’ అనే సంబోధనలోని ఆప్యాయతను నిలిపి, μή τι సూచించే ప్రతికూల జవాబు అంచనాను తెలుగు ప్రశ్నారూపంలో వ్యక్తం చేశాం.
