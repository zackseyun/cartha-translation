id: JHN.21.5
reference: John 21:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ⸀ὁ Ἰησοῦς· Παιδία, μή τι προσφάγιον ἔχετε; ἀπεκρίθησαν αὐτῷ· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/005.yaml
  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: te
  text: అప్పుడు యేసు వారితో, “పిల్లలారా, మీ దగ్గర తినడానికి చేపలేమీ లేవు కదా?[a]” అని అడిగాడు. వారు ఆయనకు, “లేవు” అని జవాబిచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తినడానికి ఏమైనా.” గ్రీకు పదం సాధారణంగా రొట్టెతో తినే ఆహారాన్ని సూచిస్తుంది; చేపలు పట్టే ఈ సందర్భంలో అది చేపలను సూచించే అవకాశం ఎక్కువగా ఉంది.
    reason: ప్రసంగానుసారంగా “చేపలు” అనే అనువాదాన్ని ఉంచుతూ, προσφάγιον యొక్క విస్తృతమైన అర్థసాధ్యతను తెలియజేస్తుంది.
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి పరిణామాన్ని సహజంగా సూచిస్తుంది; ఈ సందర్భంలో కారణార్థకమైన ‘కాబట్టి’ కంటే ‘అప్పుడు’ సరిపోతుంది.
- source_word: Παιδία
  choice: పిల్లలారా
  rationale: పదానికి నేరమైన సమానార్థం; ఇక్కడ వయస్సును ఖచ్చితంగా నిర్దేశించకుండా ఆప్యాయమైన సంబోధనను నిలుపుతుంది.
- source_word: μή τι
  choice: ఏమీ లేవు, అవునా?
  rationale: μήతో ఉన్న ప్రశ్న ప్రతికూల జవాబును ఆశిస్తుంది. తెలుగు సంభాషణలో ‘అవునా?’ అనే రూపం ఆ అంచనాను సహజంగా తెలియజేస్తుంది.
- source_word: προσφάγιον
  choice: తినడానికి చేపలు
  rationale: ఈ పదం ప్రధానంగా రొట్టెతో తినే ఆహారాన్ని సూచిస్తుంది; చేపలు పట్టే సందర్భంలో చేపలే ఉద్దేశించబడ్డాయని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἔχετε
  choice: మీ దగ్గర ... లేవు
  rationale: కలిగి ఉండడాన్ని తెలిపే గ్రీకు క్రియను సహజమైన తెలుగు అస్తిత్వ-స్వామ్య నిర్మాణంతో అనువదించింది.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: వారు ఆయనకు ... జవాబిచ్చారు
  rationale: గ్రీకు కథన ప్రతిస్పందన సూత్రాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: Οὔ
  choice: లేవు
  rationale: ప్రశ్నలోని బహువచన వస్తువుకు అనుగుణంగా సంక్షిప్త ప్రతికూల జవాబు.
