  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς Σίμων Πέτρος· Ὑπάγω ἁλιεύειν· λέγουσιν αὐτῷ· Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί. ἐξῆλθον καὶ ἐνέβησαν εἰς τὸ ⸀πλοῖον, καὶ ἐν ἐκείνῃ τῇ νυκτὶ ἐπίασαν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: te
  text: సీమోను పేతురు వారితో, “నేను చేపలు పట్టడానికి వెళ్తున్నాను” అన్నాడు.[a] వారు అతనితో, “మేము కూడా నీతో వస్తాం” అన్నారు. వారు బయలుదేరి పడవ ఎక్కారు, ఆ రాత్రి వారు ఏమీ పట్టలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో ఇక్కడ కథన వర్తమాన కాలం ఉంది: ‘సీమోను పేతురు వారితో అంటాడు … వారు అతనితో అంటారు.’ కథనంలో సాధారణంగా కనిపించే ఈ ప్రయోగాన్ని తెలుగులో సహజమైన భూతకాలంతో అనువదించాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει … λέγουσιν
  choice: అన్నాడు … అన్నారు
  rationale: గ్రీకులో కథన వర్తమాన కాలం ఉన్నప్పటికీ, ఆధునిక తెలుగు కథన శైలిలో భూతకాల రూపాలు సహజంగా ఉంటాయి; సంభాషణ క్రమాన్ని అవి స్పష్టంగా నిలుపుతాయి.
- source_word: Ὑπάγω ἁλιεύειν
  choice: నేను చేపలు పట్టడానికి వెళ్తున్నాను
  rationale: Ὑπάγω లోని వెళ్లే భావాన్నీ, ἁλιεύειν లోని ఉద్దేశాన్నీ సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: మేము కూడా నీతో వస్తాం
  rationale: καὶ ἡμεῖς లోని ‘మేము కూడా’ అనే ఉద్ఘాటనను, σύν లోని సహవాస భావాన్ని కాపాడుతూ, తెలుగు ప్రత్యక్ష సంభాషణలో సహజంగా ఉంది.
- source_word: ἐξῆλθον
  choice: బయలుదేరి
  rationale: వారు ఉన్న చోటు నుంచి వెళ్లిన కథన కదలికను సహజంగా తెలియజేస్తుంది; తరువాతి ‘పడవ ఎక్కారు’తో సునిశితంగా కలుస్తుంది.
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: పడవ ఎక్కారు
  rationale: చేపల వేట సందర్భంలో πλοῖονకు ‘పడవ’ సరైనది; మొత్తం పదబంధానికి ‘పడవ ఎక్కారు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: ἐν ἐκείνῃ τῇ νυκτί
  choice: ఆ రాత్రి
  rationale: కాలాన్ని సూచించే గ్రీకు పదబంధానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానం.
- source_word: ἐπίασαν οὐδέν
  choice: వారికి ఏమీ చిక్కలేదు
  rationale: చేపల వేట సందర్భంలో πιάζω యొక్క ‘పట్టుకోవడం/చిక్కడం’ భావాన్ని తెలుగులో సహజంగా అందిస్తూ, οὐδέν సూచించే సంపూర్ణ వైఫల్యాన్ని నిలుపుతుంది.
