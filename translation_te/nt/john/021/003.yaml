  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. సంభాషణ సహజత్వం కోసం ‘వస్తాం’ వాడబడింది; మూలంలోని కథన వర్తమాన కాలం పాదసూచికలో భద్రపరచబడింది.
