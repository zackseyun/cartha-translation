  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. జాబితా పొడవుగా ఉన్నప్పటికీ చివరలో ‘వీరంతా’ను చేర్చి వాక్య సంబంధాన్ని స్పష్టంగా ఉంచింది.
