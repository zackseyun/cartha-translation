source:
  edition: SBLGNT
  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: te
  text: సీమోను పేతురు, “దిదుము”[a] అని పిలువబడే తోమా, గలిలయలోని కానాకు చెందిన నతనయేలు, జెబెదయి కుమారులు, ఆయన శిష్యుల్లో మరో ఇద్దరు—వీరంతా కలిసి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దిదుము” అనే గ్రీకు పదానికి “కవలవాడు” అని అర్థం.
    reason: Δίδυμος అనే గ్రీకు విశేషణం లిప్యంతరీకరించబడింది; దాని అర్థాన్ని పాఠకునికి తెలియజేయడానికి.
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: కలిసి ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ ἦσαν గతంలో కొనసాగిన స్థితిని సూచిస్తుంది; ὁμοῦ ఒకేచోట కలిసి ఉండడాన్ని సూచిస్తుంది. తెలుగులో ఈ రెండింటినీ సహజంగా కలిపి చెప్పే రూపం ఇది.
- source_word: Σίμων Πέτρος
  choice: సీమోను పేతురు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాలను అనుసరించింది.
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: “దిదుమ” అని పిలువబడే తోమా[a]
  rationale: λεγόμενος అనే పదంలోని ‘అని పిలువబడే’ భావాన్ని నిలిపి, Δίδυμοςను పేరుగా లిప్యంతరీకరించింది; దాని గ్రీకు అర్థాన్ని పాదటిప్పణిలో తెలిపింది.
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: గలిలయలోని కానాకు చెందిన నతనయేలు
  rationale: ἀπό సూచించే స్వస్థల సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో ‘చెందిన’ అని వ్యక్తపరుస్తూ, కానా గలిలయలో ఉందనే భౌగోళిక సంబంధాన్ని స్పష్టం చేసింది.
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: జెబెదయి కుమారులు
  rationale: ఈ సంక్షిప్త గ్రీకు సంబంధవాచక ప్రయోగం సందర్భంలో జెబెదయి కుమారులనే సూచిస్తుంది; తెలుగులో ‘కుమారులు’ను స్పష్టంగా చేర్చడం అవసరం.
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: ఆయన శిష్యుల్లో మరో ఇద్దరు
  rationale: ἐκ యొక్క సమూహంలోనుండి అనే భాగార్థాన్ని ‘శిష్యుల్లో’ నిలుపుతుంది; ἄλλοι ... δύοను సహజంగా ‘మరో ఇద్దరు’గా ఇచ్చింది.
- source_word: καί ... καί
  choice: కామాలతో కూడిన జాబితా
  rationale: పునరావృత καίతో సమన్వయపరచిన జాబితాను తెలుగులో సహజంగా కామాలతో ఇచ్చి, చివరలో ‘వీరంతా’తో సమూహాన్ని తిరిగి సూచించింది.
