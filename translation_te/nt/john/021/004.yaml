source:
  edition: SBLGNT
  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: te
  text: అప్పటికే తెల్లవారగా, యేసు ఒడ్డున నిలబడ్డాడు; అయితే, ఆయన యేసు అని శిష్యులకు తెలియలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శిష్యులు ఆయనను యేసుగా గుర్తుపట్టలేదు.” గ్రీకులో మరింత అక్షరార్థంగా, “ఆయన యేసు అని శిష్యులకు తెలియలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  choice: తెల్లవారేసరికి
  rationale: జనిటివ్ అబ్సల్యూట్ తెలిపే కాలసందర్భాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. πρωΐα సూచించే తెల్లవారుజామును, ἤδη γενομένης సూచించే అప్పటికే సంభవించిన స్థితిని ‘తెల్లవారేసరికి’ సంక్షిప్తంగా అందిస్తుంది; δέ యొక్క స్వల్ప కథన అనుసంధానాన్ని తెలుగులో ప్రత్యేక పదం లేకుండానే వాక్యప్రవాహం తెలియజేస్తుంది.
- source_word: ἔστη
  choice: నిలబడ్డాడు
  rationale: ἵστημι యొక్క అయోరిస్ట్ రూపాన్ని సరళమైన గతకాల సంఘటనగా అనువదిస్తుంది.
- source_word: εἰς τὸν αἰγιαλόν
  choice: ఒడ్డున
  rationale: నిలబడడం అనే క్రియతో εἰς స్థానార్థకంగా వాడబడింది; αἰγιαλός ఇక్కడ నీటి ఒడ్డు లేదా తీరాన్ని సూచిస్తుంది. సందర్భానికి ‘ఒడ్డున’ సహజంగా సరిపోతుంది.
- source_word: οὐ μέντοι
  choice: అయినా
  rationale: యేసు అక్కడ నిలబడి ఉన్నప్పటికీ శిష్యులకు ఆయనెవరో తెలియకపోవడంలోని వ్యతిరేక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ᾔδεισαν
  choice: తెలియలేదు
  rationale: οἶδα యొక్క ప్రాథమిక అర్థమైన ‘తెలుసుకోవడం/తెలియడం’ను నిలుపుతుంది. సందర్భంలో ‘గుర్తుపట్టలేదు’ అనే భావం సాధ్యమైనా, దానిని ప్రధాన పాఠ్యంలో మరీ నిర్దిష్టం చేయలేదు.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులకు
  rationale: తెలిసిన శిష్యుల సమూహాన్ని నిర్దిష్టంగా సూచిస్తుంది; గ్రీకులో లేని ‘ఆయన శిష్యులు’ అనే స్వామ్యపదాన్ని జోడించదు.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: ఆయన యేసు అని
  rationale: గ్రీకు గుర్తింపు వాక్యాన్ని సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది. ‘ఆయన’ అనేది ఒడ్డున నిలబడిన వ్యక్తిని సూచిస్తుంది.
theological_decisions:
- issue: పునరుత్థానానంతరం యేసును గుర్తించడం
  choice: శిష్యులకు ఆయన యేసు అని తెలియలేదని అనువదించడం
  alternative: శిష్యులు ఆయనను యేసుగా గుర్తుపట్టలేదని అనువదించడం
  rationale: వారు ఎందుకు గుర్తించలేదో వచనం వివరించదు. కాబట్టి యేసు రూపం గురించిగానీ, శిష్యుల గ్రహణశక్తి గురించిగానీ సిద్ధాంతపరమైన కారణాన్ని చేర్చకుండా కథనంలోని మౌనాన్ని, ఉద్విగ్నతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘తెల్లవారేసరికి’ కాలసందర్భాన్ని సహజంగా తెలియజేస్తుంది; ‘తెలియలేదు’ మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది.
