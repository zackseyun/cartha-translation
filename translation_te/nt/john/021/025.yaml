revisions:
- from: యేసు చేసిన ఇతర కార్యాలు ఇంకా ఎన్నో ఉన్నాయి. వాటిలో ప్రతిదానినీ ఒక్కొక్కటిగా రాస్తే, అలా రాయబడే గ్రంథాలకు ఈ లోకం కూడా చోటు కల్పించలేదని నేను అనుకుంటున్నాను.[a]
  to: యేసు చేసిన ఇతర కార్యాలు ఇంకా ఎన్నో ఉన్నాయి. వాటిని ఒక్కొక్కటిగా రాస్తే, అలా రాయబడే గ్రంథాలకు ఈ లోకమే చోటు సరిపోదని నేను అనుకుంటున్నాను.[a]
  rationale: The revision retains the source’s ambiguity and rhetorical hyperbole while correcting the Telugu tense/aspect of the hypothetical outcome. It also renders the intensive ‘the world itself’ more explicitly as ‘ఈ లోకమే.’
