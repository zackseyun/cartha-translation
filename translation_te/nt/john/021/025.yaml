id: JHN.21.25
reference: John 21:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: te
  text: యేసు చేసిన ఇతర కార్యాలు ఇంకా ఎన్నో ఉన్నాయి. వాటిని ఒక్కొక్కటిగా రాస్తే, అలా రాయబడే గ్రంథాలకు ఈ లోకమే చోటు సరిపోదని నేను అనుకుంటున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అలా రాయబడే గ్రంథాలను ఈ లోకమే ఇముడ్చుకోదని.” గ్రీకు క్రియకు “చోటు ఉండడం” లేదా “ఇముడ్చుకోవడం” అనే భావాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ ἄλλα πολλὰ
  choice: ఇతర కార్యాలు ఇంకా ఎన్నో ఉన్నాయి
  rationale: δὲ ను సందర్భానికి సహజమైన కొనసాగింపులో ఉంచి, καὶ ἄλλα πολλὰ లోని అదనపు కార్యాల భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: యేసు చేసిన ... కార్యాలు
  rationale: ποιέω ఇక్కడ యేసు చేసిన పనులు లేదా కార్యాలను సూచిస్తుంది; నపుంసక బహువచనమైన ‘విషయాలు’ కంటే ‘కార్యాలు’ సందర్భంలో సహజంగా ఉంటుంది.
- source_word: ἐὰν γράφηται καθ’ ἕν
  choice: వాటిలో ప్రతిదానినీ ఒక్కొక్కటిగా రాస్తే
  rationale: ఊహాత్మక షరతును, అలాగే καθ’ ἕν లోని ఒక్కొక్కటిగా అనే విభజనాత్మక భావాన్ని నిలుపుతుంది; గ్రీకు కర్మణి ప్రయోగాన్ని తెలుగులో సహజమైన అనిర్దిష్ట కర్తృవాచక రూపంలో అందిస్తుంది.
- source_word: οὐδ’ αὐτὸν ... τὸν κόσμον
  choice: ఈ లోకం కూడా
  rationale: οὐδέ లోని ‘కూడా కాదు’ అనే ఉద్ఘాటనను ప్రతికూల క్రియతో కలిపి సహజమైన తెలుగులో చూపుతుంది; αὐτόν యొక్క బలాన్ని ‘ఈ లోకం కూడా’ మోస్తుంది.
- source_word: οἶμαι
  choice: నేను అనుకుంటున్నాను
  rationale: రచయిత వ్యక్తిగతమైన అలంకారాత్మక అంచనాను నేరుగా నిలుపుతుంది.
- source_word: χωρήσειν
  choice: చోటు కల్పించలేదని
  rationale: χωρέω లోని స్థలముండడం లేదా ఇమిడ్చుకోవడం అనే చిత్రాన్ని ‘చోటు కల్పించు’ సహజంగా కాపాడుతుంది.
- source_word: τὰ γραφόμενα βιβλία
  choice: అలా రాయబడే గ్రంథాలకు
  rationale: ఊహాత్మక షరతు ఫలితంగా రాయబడే పుస్తకాలను సూచిస్తుంది; ‘అలా’ పూర్వ షరతుతో సంబంధాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: గ్రంథాలకు లోకం సరిపోదనే అలంకారాత్మక అతిశయోక్తి
  choice: ‘ఈ లోకం కూడా చోటు కల్పించలేదని’ అనే స్థలసంబంధ చిత్రాన్ని నిలిపాం
  alternative: ‘ఎన్నో పుస్తకాలు అవుతాయి’ అని సాధారణీకరించడం
  rationale: మూలంలోని బలమైన ముగింపు చిత్రాన్ని తగ్గించకుండా ఉంచుతుంది; దానిని అక్షరార్థ వాదంగానో కేవలం ‘లెక్కలేనన్ని’ అనే సారాంశంగానో ముందే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సులభంగా అర్థమయ్యే, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘పుస్తకాలు’కు బదులుగా సువార్త ముగింపు సందర్భానికి తగిన ‘గ్రంథాలు’ వాడబడింది. మూలంలోని వ్యక్తిగత ‘నేను అనుకుంటున్నాను’ మరియు అతిశయోక్తి రెండూ నిలుపబడ్డాయి.
