id: JHN.21.6
reference: John 21:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Βάλετε εἰς τὰ δεξιὰ μέρη τοῦ πλοίου τὸ δίκτυον, καὶ εὑρήσετε. ἔβαλον οὖν, καὶ οὐκέτι αὐτὸ ἑλκύσαι ⸀ἴσχυον ἀπὸ τοῦ πλήθους τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: te
  text: అయితే ఆయన వారితో, “పడవకు కుడివైపున వల వేయండి; మీకు దొరుకుతాయి[a]” అన్నాడు. కాబట్టి వారు వల వేశారు. చేపలు విపరీతంగా పడడంతో వారు దాన్ని ఇక లాగలేకపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు దొరుకుతుంది.” గ్రీకులో ‘చేపలు’ అనే కర్మ స్పష్టంగా లేదు; చేపలు పట్టే సందర్భం నుంచే అది అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: వల వేయండి
  rationale: చేపలు పట్టే సందర్భంలో βάλλω అనే ఆజ్ఞకు సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: పడవకు కుడివైపున
  rationale: పదశః ‘పడవ యొక్క కుడి ప్రాంతాలు’; తెలుగులో దిశను సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸ δίκτυον
  choice: వల
  rationale: చేపలు పట్టే వలను సూచించే ఏకవచన నామవాచకానికి నేరమైన సమానార్థకం.
- source_word: εὑρήσετε
  choice: మీకు దొరుకుతాయి
  rationale: గ్రీకులో కర్మ చెప్పబడలేదు; చేపల సందర్భం వల్ల తెలుగులో బహువచన క్రియ సహజంగా చేపలను సూచిస్తుంది, కాని వాటిని ప్రధాన వాక్యంలో స్పష్టంగా చేర్చదు.
- source_word: ἑλκύσαι
  choice: దాన్ని ... లాగలేకపోయారు
  rationale: చేపలతో నిండిన వలను తమవైపు లాగే చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκέτι ... ἴσχυον
  choice: ఇక ... లేకపోయారు
  rationale: οὐκέτι యొక్క ‘ఇక కాదు’ భావాన్నీ, ἰσχύω యొక్క సామర్థ్య/బల భావాన్నీ కలిపి సహజంగా అందిస్తుంది.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: చేపలు విపరీతంగా పడడంతో
  rationale: చేపల అధిక సంఖ్య కారణంగా వలను లాగలేకపోయారనే కారణార్థాన్ని సహజమైన తెలుగు మత్స్యకార సందర్భంలో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘చేపలు విపరీతంగా పడడంతో’ అనే సహజ ప్రయోగం πλήθος సూచించే అత్యధిక సంఖ్యను వ్యక్తం చేస్తుంది.
