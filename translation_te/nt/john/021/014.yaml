source:
  edition: SBLGNT
  text: τοῦτο ἤδη τρίτον ἐφανερώθη ⸀ὁ Ἰησοῦς τοῖς ⸀μαθηταῖς ἐγερθεὶς ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/014.yaml
  text: This was now the third time Jesus was revealed to the disciples after he had been raised from the dead[a].
translation:
  language: te
  text: యేసు మృతులలోనుండి లేపబడిన తర్వాత శిష్యులకు ప్రత్యక్షమైనది ఇది అప్పటికి మూడవసారి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు మృతులలోనుండి లేపబడిన తర్వాత శిష్యులకు వెల్లడైనది ఇది అప్పటికి మూడవసారి.”
    reason: ἐφανερώθη అనే నిష్క్రియ క్రియకు ‘వెల్లడైనది’ అనేది మరింత సన్నిహితమైన పదప్రయోగం; సందర్భంలో ‘ప్రత్యక్షమైనది’ సహజమైన అనువాదం.
lexical_decisions:
- source_word: τοῦτο ἤδη τρίτον
  choice: ఇది అప్పటికి మూడవసారి
  rationale: ఇప్పుడే వివరించిన ప్రత్యక్షతను τοῦτο సూచిస్తుంది; ἤδη కథనంలో ఈ దశకు చేరిన లెక్కను సూచిస్తుంది; τρίτον‌ను సహజమైన తెలుగులో ‘మూడవసారి’గా వ్యక్తం చేశాం.
- source_word: ἐφανερώθη
  choice: ప్రత్యక్షపరచబడడం
  rationale: φανερόω యొక్క నిష్క్రియ రూపాన్ని, యోహాను రచనలోని ‘వెల్లడి/ప్రత్యక్షత’ భావాన్ని కాపాడుతుంది. సహజమైన ‘ప్రత్యక్షమయ్యాడు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: వ్యక్తినామాన్ని ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం.
- source_word: τοῖς μαθηταῖς
  choice: శిష్యులకు
  rationale: గ్రీకులో ‘తన’ అనే స్వామ్యసూచకం లేదు; అందువల్ల దానిని చేర్చకుండా నిర్దిష్ట సందర్భంలోని శిష్యులను సూచించాం.
- source_word: ἐγερθεὶς
  choice: లేపబడిన తర్వాత
  rationale: అయోరిస్ట్ నిష్క్రియ కృదంతంలోని నిష్క్రియ స్వరాన్ని, ప్రధాన క్రియకంటే ముందుగా జరిగిన చర్యను రెండింటినీ స్పష్టంగా కాపాడుతుంది.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: పునరుత్థానాన్ని తెలిపే గ్రీకు పదబంధాన్ని సహజమైన, గౌరవప్రదమైన తెలుగు బైబిల్ భాషలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐγερθεὶς ἐκ νεκρῶν లోని పునరుత్థాన భాష
  choice: మృతులలోనుండి లేపబడిన తర్వాత
  alternative: మృతులలోనుండి లేచిన తర్వాత
  rationale: గ్రీకు కృదంతం నిష్క్రియ రూపంలో ఉంది. కాబట్టి దాన్ని అకర్మక క్రియగా మార్చకుండా మూలంలోని స్వరాన్ని కాపాడాం; దీనివల్ల పునరుత్థానార్థం మారదు.
- issue: ἐφανερώθη లోని నిష్క్రియ రూపం మరియు ప్రత్యక్షత భావం
  choice: ప్రత్యక్షపరచబడడం
  alternative: ప్రత్యక్షమవడం
  rationale: మూలంలోని వ్యాకరణ నిష్క్రియతను ప్రధాన పాఠ్యంలో నిలిపి, సందర్భానుకూలమైన మరింత సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం; ఎవరు ప్రత్యక్షపరిచారో పాఠ్యం చెప్పనందున దానిని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ప్రధాన పాఠ్యంలో గ్రీకు నిష్క్రియ రూపాలను సాధ్యమైనంతవరకు నిలిపాం; ‘తన శిష్యులు’ వంటి మూలంలో లేని స్పష్టీకరణను చేర్చలేదు.
