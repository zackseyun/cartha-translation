source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: te
  text: ఈ సంగతుల తర్వాత యేసు తిబెరియ సముద్రం వద్ద శిష్యులకు మళ్లీ తనను తాను వెల్లడిచేసుకున్నాడు.[a] ఆయన తనను తాను ఈ విధంగా వెల్లడిచేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కనిపించాడు.” గ్రీకు క్రియ తనను కనిపించేలా చేయడం లేదా తెలియజేయడం అనే భావాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ఇవి జరిగిన తర్వాత
  rationale: బహువచన నిర్దేశక భావాన్ని నిలుపుతూ, యోహాను కథనంలోని కాలసంబంధ మార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: తనను తాను ప్రత్యక్షపరచుకున్నాడు
  rationale: కేవలం కనిపించడమే కాక తనను తాను కనిపించేలా లేదా తెలియజేసేలా చేసుకున్నాడనే φανερόω క్రియలోని స్వీయ-ప్రకటన భావాన్ని, అలాగే ἑαυτόν యొక్క ఆత్మవాచక బలాన్ని నిలుపుతుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ఇంతకుముందు జరిగిన పునరుత్థాన ప్రత్యక్షతల తర్వాత మరొకసారి జరిగినదనే సాధారణ క్రియావిశేషణ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: τοῖς μαθηταῖς
  choice: శిష్యులకు
  rationale: గ్రీకులో లేని ‘తన’ అనే స్వామ్యపదాన్ని చేర్చకుండా మూలానికి దగ్గరగా ఉంటుంది.
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: తిబెరియ సముద్రం దగ్గర
  rationale: ἐπί + షష్ఠీ విభక్తి ఇక్కడ సూచించే స్థల భావాన్ని సహజమైన తెలుగులో ‘దగ్గర’ అని అందిస్తుంది; యోహాను వాడిన భౌగోళిక పేరును నిలుపుతుంది.
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: ఆయన ఈ విధంగా ప్రత్యక్షపరచుకున్నాడు
  rationale: మొదటి వాక్యంలోని క్రియను పునరావృతం చేసి మూలంలోని సాహిత్య అనుసంధానాన్ని నిలుపుతుంది; οὕτως తరువాతి కథనం ఏ విధంగా జరిగిందో పరిచయం చేస్తుంది.
theological_decisions:
- issue: పునరుత్థానానంతర ప్రత్యక్షతను తెలిపే పదబంధం
  choice: తనను తాను ప్రత్యక్షపరచుకున్నాడు
  alternative: కనిపించాడు; తనను తాను తెలియజేసుకున్నాడు
  rationale: ఈ పదబంధం నిజమైన ప్రత్యక్షతను నిరాకరించకుండా, యేసు స్వయంగా తనను వెల్లడిచేసుకున్నాడనే గ్రీకు క్రియలోని భావాన్ని కాపాడుతుంది. ‘కనిపించాడు’ మాత్రమే వాడితే స్వీయ-ప్రకటన భావం బలహీనపడవచ్చు; ‘తెలియజేసుకున్నాడు’ మాత్రమే వాడితే దృశ్య ప్రత్యక్షత భావం తగ్గవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే శైలిని ఉపయోగించాం. ‘ప్రత్యక్షపరచుకున్నాడు’ అనే పదం సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండటంతో పాటు మూలంలోని స్వీయ-ప్రకటన భావాన్ని నిలుపుతుంది; పునరుక్తిని ఉద్దేశపూర్వకంగా కాపాడాం.
