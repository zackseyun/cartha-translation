translation:
  language: te
  text: 'యేసు వారితో ఇలా అన్నాడు: “మీరు ఇప్పుడే పట్టిన చేపల్లో కొన్ని తీసుకురండి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “మీరు ఇప్పుడు పట్టిన చేపల నుండి తీసుకురండి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: అని అన్నాడు
  rationale: గ్రీకులో ఇది కథనాన్ని సజీవంగా చెప్పే చారిత్రక వర్తమాన కాలం; సహజమైన తెలుగు కథనశైలిలో భూతకాలంగా అనువదించబడింది.
- source_word: Ἐνέγκατε
  choice: తీసుకురండి
  rationale: ఇది బహువచన ప్రత్యక్ష ఆజ్ఞ; చేపలను యేసు ఉన్న చోటికి తీసుకురావాలనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: చేపల్లో కొన్ని
  rationale: ἀπό ఇక్కడ మొత్తం చేపల పట్టులో కొంత భాగాన్ని సూచిస్తుంది; తెలుగులో ‘చేపల్లో కొన్ని’ సహజమైన భాగార్థక ప్రయోగం.
- source_word: ὀψαρίων
  choice: చేపలు
  rationale: సందర్భం అప్పుడే పట్టిన చేపల గురించి కావడంతో, పరిమాణం లేదా వండిన స్థితిని అనవసరంగా నిర్దేశించకుండా సాధారణ పదం వాడబడింది.
- source_word: ὧν ἐπιάσατε νῦν
  choice: మీరు ఇప్పుడే పట్టిన
  rationale: సంబంధ వాక్యం ఏ చేపలో స్పష్టం చేస్తుంది; νῦν సమీప గతంలో జరిగిన పట్టును సూచిస్తున్నందున ‘ఇప్పుడే’ సహజంగా ఆ తక్షణత్వాన్ని తెలియజేస్తుంది.
