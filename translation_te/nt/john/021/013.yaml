  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: te
  text: యేసు వచ్చి రొట్టెను తీసుకుని వారికి ఇస్తాడు[a]; చేపనూ అలాగే ఇస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు వచ్చి రొట్టెను తీసుకుని వారికి ఇచ్చాడు.” గ్రీకులో కథన సంఘటనలను వర్తమాన కాల క్రియలతో చెప్పే చారిత్రక వర్తమానం వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “చేపను కూడా అలాగే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: వచ్చి
  rationale: గ్రీకు వాక్యంలో ఇది కథనాన్ని సజీవంగా చూపించే చారిత్రక వర్తమాన కాల క్రియ. తెలుగులో వరుస చర్యలను సహజంగా కలపడానికి ‘వచ్చి’ అని ఇచ్చి, ప్రధాన క్రియలో వర్తమాన కథన శైలిని నిలిపాము.
- source_word: λαμβάνει
  choice: తీసుకుని
  rationale: ఆహారాన్ని శిష్యులకు ఇవ్వడానికి ముందు యేసు దాన్ని తీసుకున్నాడనే సాధారణ చర్యను ఇది స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸν ἄρτον
  choice: రొట్టెను
  rationale: నిర్దిష్టంగా అక్కడ ఉన్న రొట్టెను సూచించే గ్రీకు నిర్దేశక పదాన్ని సందర్భానుసారంగా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: δίδωσιν αὐτοῖς
  choice: వారికి ఇస్తాడు
  rationale: ముందు పేర్కొన్న రొట్టెను వారికి ఇచ్చే చర్యను సరళంగా, వ్యాఖ్యానాన్ని జోడించకుండా తెలియజేస్తుంది.
- source_word: τὸ ὀψάριον
  choice: చేపను
  rationale: యోహాను సందర్భంలో ఆహారంగా ఉన్న చేపను సూచిస్తుంది; ‘వండిన చేప’ వంటి మూలంలో తప్పనిసరిగా లేని వివరణను జోడించలేదు.
- source_word: ὁμοίως
  choice: కూడా అలాగే ఇస్తాడు
  rationale: రొట్టెతో చేసినదానినే చేపతోనూ చేశాడనే సమాంతర భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; మూలంలోని సంక్షిప్తతకు ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: పునరుత్థాన ప్రత్యక్షత కథనంలో చారిత్రక వర్తమాన కాల క్రియలు
  choice: ‘ఇస్తాడు’ అనే వర్తమాన కథన రూపాన్ని నిలిపి, ముందరి వరుస చర్యలను సహజ తెలుగు క్రియాసముచ్చయాలతో అనుసంధానించడం
  alternative: ‘యేసు వచ్చి, రొట్టెను తీసుకుని వారికి ఇచ్చాడు’ అని పూర్తిగా భూతకాలంలో అనువదించడం
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు. గ్రీకు కథనంలోని సజీవ వర్తమాన శైలిని సాధ్యమైనంతవరకు నిలుపుతూ, ఆధునిక తెలుగులో అసహజమైన వరుస స్వతంత్ర వర్తమాన క్రియలను నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘వడ్డిస్తాడు’ అనే వ్యాఖ్యానాత్మక పదాన్ని నివారించి, మూలంలోని ‘ఇస్తాడు’ భావాన్ని నిలిపాము. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
