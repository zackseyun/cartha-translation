  - severity: low
    issue: Footnote b's literal gloss is imprecise.
    rationale: εἰς τὴν γῆν means ‘to/onto the land/ground,’ not merely ‘toward land.’ The contextual rendering ‘ఒడ్డుకు’ remains suitable.
