source:
  edition: SBLGNT
  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: te
  text: కాబట్టి సీమోను పేతురు పడవ ఎక్కి[a], నూట యాభై మూడు పెద్ద చేపలతో నిండివున్న వలను ఒడ్డుకు[b] లాగాడు. అంత ఎక్కువ చేపలు ఉన్నప్పటికీ వల చినిగిపోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పైకి వెళ్లి.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘పైకి వెళ్లాడు’ అని అర్థం; ఈ సందర్భంలో సీమోను పేతురు వలను లాగడానికి పడవ ఎక్కాడని భావం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘భూమికి’ లేదా ‘నేలకు’; ఈ సందర్భంలో ‘ఒడ్డుకు’ అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: పడవ ఎక్కి
  rationale: ఈ క్రియకు అక్షరార్థంగా ‘పైకి వెళ్లాడు’ అనే భావం ఉంది; అయితే ఈ సందర్భంలో పేతురు పడవ ఎక్కి వలను లాగినట్లు సూచిస్తుంది. ‘పడవ ఎక్కి’ అనేది సహజమైన సందర్భోచిత అనువాదం.
- source_word: οὖν
  choice: అప్పుడు
  rationale: ముందటి ఆజ్ఞకు అనుసరించిన చర్యను తెలిపే కథన అనుసంధానంగా ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఉంటుంది.
- source_word: εἵλκυσεν
  choice: లాగాడు
  rationale: వలను తనవైపు తీసుకొచ్చిన చర్యను నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὸ δίκτυον
  choice: వలను
  rationale: చేపలు పట్టే వలకు ప్రామాణికమైన ప్రత్యక్ష అనువాదం.
- source_word: εἰς τὴν γῆν
  choice: ఒడ్డుకు
  rationale: అక్షరార్థం ‘నేలవైపు/భూమివైపు’; సరస్సులో చేపలు పట్టే ఈ సందర్భంలో ‘ఒడ్డుకు’ ఉద్దేశించిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μεστὸν ἰχθύων μεγάλων
  choice: పెద్ద చేపలతో నిండివున్న
  rationale: వలలోని చేపల పరిమాణాన్ని, వల నిండిన స్థితిని స్పష్టంగా నిలుపుతుంది.
- source_word: ἑκατὸν πεντήκοντα τριῶν
  choice: నూట యాభై మూడు
  rationale: మూలంలోని నిర్దిష్ట సంఖ్యను ఆధునిక ప్రామాణిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: τοσούτων ὄντων
  choice: చేపలు అంత ఎక్కువగా ఉన్నప్పటికీ
  rationale: అన్ని చేపలు ఉన్నా వల చినగకపోవడంలోని ఆశ్చర్యాన్ని తెలిపే concessive భావాన్ని నిలుపుతుంది.
- source_word: οὐκ ἐσχίσθη
  choice: చినిగిపోలేదు
  rationale: వల ఒత్తిడికి చినగకుండా ఉండిందనే భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
