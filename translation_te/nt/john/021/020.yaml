review_pass:
  verdict: revise
  source_fidelity: The draft preserves the sequence and the deliberately unstated object of ἀκολουθοῦντα. However, its main-clause construction is not idiomatic Telugu, and “అప్పగించబోయేవాడు” shifts the present participle ὁ παραδιδούς toward a future action. The revision keeps the object of ‘following’ implicit, represents the meal posture accurately, and renders the betrayal sense in context.
  naturalness: “యేసు ప్రేమించిన శిష్యుడు వెనుక వస్తుండడం చూశాడు” is structurally awkward because the noun phrase is treated as though it were both the object of చూశాడు and the subject of వస్తుండడం. An embedded clause (“వెనుకనే వస్తున్నాడని చూశాడు”) is natural modern Telugu. The identifying relative description is also made into a fluent Telugu clause.
  terminology: “శిష్యుడు,” “ప్రభువా,” and “యేసు ప్రేమించిన” are appropriate. “ఛాతీపై” is a natural, non-ambiguous modern rendering of στῆθος in this meal-reclining context. “ద్రోహంగా అప్పగించేవాడు” preserves the contextual betrayal force of παραδιδούς without importing a named doctrinal interpretation.
  issues:
  - severity: medium
    issue: Awkward syntactic construction in the first clause
    rationale: “శిష్యుడు వెనుక వస్తుండడం చూశాడు” is not smooth standard Telugu. The revision uses an embedded finite clause while retaining the Greek’s unspecified object of ἀκολουθοῦντα.
  - severity: medium
    issue: Aspect and contextual force of ὁ παραδιδούς
    rationale: “అప్పగించబోయేవాడు” is prospective (‘about to hand over’), whereas the Greek uses a present substantival participle. “ద్రోహంగా అప్పగించేవాడు” naturally expresses the ongoing/intended betraying sense in this context.
  - severity: low
    issue: Meal-posture wording and footnote anchor
    rationale: “ఛాతీపై” more directly corresponds to ἐπὶ τὸ στῆθος and avoids the less precise “రొమ్ముకు.” The footnote is anchored directly to the posture expression.
  revised_text: పేతురు వెనక్కి తిరిగి, యేసు ప్రేమించిన శిష్యుడు వెనుకనే వస్తున్నాడని చూశాడు.[a] భోజన సమయంలో యేసు ఛాతీపై[b] వాలుకొని, “ప్రభువా, నిన్ను ద్రోహంగా అప్పగించేవాడు ఎవరు?” అని అడిగినవాడు కూడా ఇతడే.
