source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: te
  text: పేతురు వెనక్కి తిరిగి, యేసు ప్రేమించిన శిష్యుడు వెనుకనే వస్తున్నాడని చూశాడు.[a] భోజన సమయంలో యేసు ఛాతీపై[b] వాలుకొని, “ప్రభువా, నిన్ను ద్రోహంగా అప్పగించేవాడు ఎవరు?” అని అడిగినవాడు కూడా ఇతడే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి వెంట వస్తున్నాడని” లేదా “ఆయన వెంట వస్తున్నాడని.” గ్రీకు క్రియారూపం అతడు ఎవరిని అనుసరిస్తున్నాడో స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఆయన ఛాతీపై వాలినవాడు.” ఇది భోజనం చేసేటప్పుడు వాలుకొని ఉండే అప్పటి భంగిమను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: వెనక్కి తిరిగి
  rationale: కథనంలోని చర్యల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: βλέπει
  choice: చూశాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథన శైలికి సహజంగా భూతకాలంలో అనువదించబడింది.
- source_word: τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς
  choice: యేసు ప్రేమించిన శిష్యుడు
  rationale: యోహాను సువార్తలోని స్థిరమైన వర్ణనను సరళంగా, ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: ἀκολουθοῦντα
  choice: వెనుక వస్తుండడం
  rationale: ఎవరిని అనుసరిస్తున్నాడో గ్రీకు స్పష్టంగా చెప్పనందున, తెలుగులోనూ కర్మను చేర్చకుండా కదలికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ
  choice: భోజన సమయంలో యేసు రొమ్ముకు ఆనుకున్నవాడు
  rationale: ఆ కాలంలో భోజనానికి వాలుకొని కూర్చునే భంగిమలో యేసువైపు వెనక్కి వాలి ఆయన రొమ్ముకు ఆనుకున్న చర్యను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును నేరుగా సంబోధించే గౌరవార్థక పదంగా, యోహాను సువార్తలోని భావగాంభీర్యాన్ని నిలుపుతుంది.
- source_word: ὁ παραδιδούς σε
  choice: నిన్ను అప్పగించబోయేవాడు
  rationale: శ్రమల కథన సందర్భంలో παραδίδωμι సూచించే ద్రోహపూర్వక అప్పగింతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; చర్య అప్పటికి జరగబోతున్నదనే కథన దృష్టిని కూడా నిలుపుతుంది.
theological_decisions:
- issue: βλέπει అనే చారిత్రక వర్తమాన కాలం
  choice: చూశాడు అనే భూతకాల రూపం
  alternative: చూస్తున్నాడు / చూస్తాడు
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు; తెలుగు కథన ప్రవాహంలో భూతకాలం సహజంగా ఉంటుంది, అర్థంలో మార్పు రాదు.
- issue: ἀκολουθοῦντα లో స్పష్టంగా లేని కర్మ
  choice: వెనుక వస్తుండడం—ఎవరిని అనుసరిస్తున్నాడో వాక్యంలో చేర్చలేదు
  alternative: వారి వెంట వస్తుండడం / ఆయన వెంట వస్తుండడం
  rationale: సందర్భం యేసును లేదా యేసు-పేతురులను సూచించవచ్చు; గ్రీకు కర్మను స్పష్టంగా పేర్కొననందున ఆ నిజమైన అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపాం.
- issue: παραδιδούς యొక్క సందర్భార్థం
  choice: అప్పగించబోయేవాడు
  alternative: ద్రోహం చేయబోయేవాడు
  rationale: శ్రమల సందర్భం ద్రోహాన్ని స్పష్టంగా సూచించినా, మూలపదంలోని ‘అప్పగించడం’ అనే చిత్రాన్ని నిలుపుతూ సిద్ధాంతపరమైన అదనపు వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘రొమ్ము’ శరీర భాగాన్ని సహజంగా సూచిస్తుంది; భోజన భంగిమపై అపార్థం రాకుండా పాదటిప్పణి ఇచ్చాం.
