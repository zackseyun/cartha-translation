  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: te
  text: ఈ విషయాల గురించి సాక్ష్యమిస్తున్నవాడూ, వీటిని రాసినవాడూ ఈ శిష్యుడే[a]. అతని సాక్ష్యం సత్యమైనదని మాకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఈ విషయాల గురించి సాక్ష్యమిచ్చేవాడూ … అతని సాక్ష్యం సత్యమైనది’ అని కూడా అనువదించవచ్చు. గ్రీకులో ఈ వచనమంతటా ఒకే మూలానికి చెందిన ‘సాక్ష్యమివ్వడం/సాక్ష్యం’ పదాలు వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ μαθητὴς
  choice: ఈ శిష్యుడే
  rationale: ముందు ప్రస్తావించిన శిష్యుణ్ణి గుర్తిస్తూ చెప్పే నిర్దేశక వాక్య నిర్మాణాన్ని సహజమైన తెలుగులో బలప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: ὁ μαρτυρῶν
  choice: సాక్ష్యమిస్తున్నవాడు
  rationale: వర్తమాన అసమాపక క్రియలోని కొనసాగుతున్న లేదా లక్షణాత్మక భావాన్ని నిలుపుతుంది; μαρτυρίαతో ఉన్న మూలపద సంబంధాన్ని కూడా తెలుగులో ‘సాక్ష్యం’ ద్వారా కాపాడుతుంది.
- source_word: περὶ τούτων
  choice: ఈ విషయాల గురించి
  rationale: సువార్తలో వివరించిన విషయాలవైపు సూచించే బహువచన నిర్దేశక భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ὁ γράψας ταῦτα
  choice: వీటిని రాసినవాడు
  rationale: పూర్తయిన రచనా చర్యను సూచించే భూతకాల అసమాపక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οἴδαμεν
  choice: మనకు తెలుసు
  rationale: మూలంలోని ప్రథమ పురుష బహువచనాన్ని నిలుపుతూ, మాట్లాడుతున్నవారు ఎవరో అనువాదంలో నిర్ధారించదు.
- source_word: ἀληθὴς
  choice: సత్యమైనది
  rationale: సాక్ష్యం నిజమనే వాక్యార్థాన్ని నేరుగా అందిస్తుంది; ‘నమ్మదగినది’ అని మార్చి భావాన్ని పరిమితం చేయదు.
- source_word: αὐτοῦ ἡ μαρτυρία
  choice: అతని సాక్ష్యం
  rationale: స్వామ్య సంబంధాన్ని సహజంగా తెలుపుతూ, μαρτυρῶνతో ఉన్న సాక్ష్య పదకుటుంబ సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘మనకు తెలుసు’లోని ప్రథమ పురుష బహువచన స్వరం
  choice: ‘మనకు తెలుసు’ అని నేరుగా అనువదించి, మాట్లాడుతున్నవారిని పేర్కొనకుండా ఉంచడం
  alternative: సువార్తికుడే సంపాదకీయంగా మాట్లాడుతున్నాడని లేదా ప్రియ శిష్యుని సాక్ష్యాన్ని ఒక సమూహం ధృవీకరిస్తోందని స్పష్టీకరించడం
  rationale: గ్రీకు పాఠం ప్రథమ పురుష బహువచనాన్ని వాడుతుంది గాని దాని సూచిత వ్యక్తులను గుర్తించదు. రచయిత లేదా సమూహం గురించిన ప్రశ్నను అనువాదం స్వయంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సాక్ష్యమిస్తున్నవాడు/సాక్ష్యం’ అనే పదజోడు గ్రీకు మూలంలోని cognate witness language‌ను వీలైనంత స్పష్టంగా నిలుపుతుంది. [a] గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
