  to: ఈ విషయాల గురించి సాక్ష్యమిస్తున్నవాడూ, వీటిని రాసినవాడూ ఈ శిష్యుడే[a]. అతని సాక్ష్యం సత్యమైనదని మాకు తెలుసు.
  rationale: The revision changes only the pronoun construction in the final clause, from ‘మనకు’ to ‘మాకు,’ to represent οἴδαμεν more faithfully without resolving the identity of the speakers or including the reader. The footnote is clarified to provide an actual lexical alternative and to retain the witness/testimony word-family observation.
