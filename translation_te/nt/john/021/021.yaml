  text: τοῦτον ⸀οὖν ἰδὼν ὁ Πέτρος λέγει τῷ Ἰησοῦ· Κύριε, οὗτος δὲ τί;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/021.yaml
  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: te
  text: కాబట్టి పేతురు అతణ్ణి చూసి యేసుతో, “ప్రభువా, మరి ఇతని సంగతి ఏమిటి?” అంటాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον ... ἰδών
  choice: అతణ్ణి చూసి
  rationale: ముందటి వచనంలో పేర్కొన్న శిష్యుణ్ణి పేతురు చూసినట్లు సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: λέγει
  choice: అని అడిగాడు
  rationale: గ్రీకు వర్తమానకాల కథనరూపాన్ని తెలుగులో సహజమైన భూతకాల కథనంగా ఇచ్చాం; పలికిన మాట ప్రశ్న కావడంతో ‘అడిగాడు’ సందర్భానుకూలం.
- source_word: οὗτος δὲ τί;
  choice: మరి ఇతని సంగతి ఏమిటి?
  rationale: అక్షరార్థంగా సంక్షిప్తమైన, అసంపూర్ణ స్వభావమున్న ప్రశ్నను దాని భావబలాన్ని కాపాడుతూ సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: పేతురు ప్రశ్నలో సూచితమైన భావం
  choice: ‘ఇతని సంగతి ఏమిటి?’ అని తెరిచి ఉంచడం
  alternative: ‘ఇతనికి ఏమి జరుగుతుంది?’ లేదా ‘ఇతడు ఏమి చేయాలి?’
  rationale: మూలంలోని సంక్షిప్త ప్రశ్న స్పష్టంగా ఒకే భావాన్ని నిర్ణయించదు; కాబట్టి దాని నిజమైన అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే సంభాషణ శైలి. ‘ప్రభువా’ అనే సంబోధనను నిలిపాం.
