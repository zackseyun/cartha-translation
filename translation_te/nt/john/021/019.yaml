id: JHN.21.19
reference: John 21:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: te
  text: పేతురు ఎలాంటి మరణం ద్వారా దేవుణ్ణి మహిమపరుస్తాడో[a] సూచిస్తూ యేసు ఈ మాట చెప్పాడు. ఇలా చెప్పి, ఆయన పేతురుతో, “నన్ను అనుసరించు” అని అంటాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏ విధమైన మరణం ద్వారా.”
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు మూలంలో ఇక్కడ చారిత్రక వర్తమాన కాలం వాడబడింది: “ఆయన పేతురుతో … అని అంటాడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: సూచిస్తూ
  rationale: ఈ మాట ద్వారా పేతురు మరణించే విధానాన్ని యేసు పరోక్షంగా తెలియజేశాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ποίῳ θανάτῳ
  choice: ఎలాంటి మరణం ద్వారా
  rationale: ποίῳ లోని గుణాత్మక భావాన్ని, అలాగే మరణం దేవుణ్ణి మహిమపరచే సాధనంగా చెప్పబడిన దత్తివు నిర్మాణాన్ని నిలుపుతుంది.
- source_word: δοξάσει τὸν θεόν
  choice: దేవుణ్ణి మహిమపరుస్తాడో
  rationale: భవిష్యత్ భావాన్ని తెలుగు పరోక్ష వాక్య నిర్మాణంలో సహజంగా నిలుపుతూ, ‘దేవుణ్ణి మహిమపరచడం’ అనే వేదాంతపరమైన భావాన్ని వివరణతో విస్తరించకుండా ఉంచుతుంది.
- source_word: καὶ τοῦτο εἰπὼν
  choice: ఇలా చెప్పి
  rationale: అయోరిస్ట్ పార్టిసిపిల్ సూచించే ముందుగా జరిగిన చర్యను సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: λέγει αὐτῷ
  choice: ఆయన పేతురుతో … అని అంటాడు
  rationale: గ్రీకు చారిత్రక వర్తమాన కాలంలోని కథన సజీవతను ‘అంటాడు’ ద్వారా నిలుపుతుంది; సందర్భంలో సర్వనామాల సూచిత వ్యక్తులు అయోమయం కాకుండా యేసు, పేతురు పేర్లను స్పష్టం చేసింది.
- source_word: Ἀκολούθει μοι
  choice: నన్ను వెంబడించు
  rationale: తక్షణ పిలుపునూ కొనసాగుతున్న శిష్యత్వ భావాన్నీ మోయగల సహజమైన ఆజ్ఞారూపం.
theological_decisions:
- issue: పేతురు మరణం ద్వారా దేవుణ్ణి మహిమపరచడం
  choice: ‘దేవుణ్ణి మహిమపరుస్తాడో’ అని వ్యాఖ్యాన విస్తరణ లేకుండా ఉంచడం
  alternative: పేతురు హతసాక్షిగా నమ్మకంగా నిలిచి దేవుణ్ణి మహిమపరుస్తాడని స్పష్టంగా వివరించడం
  rationale: మరణం దేవుణ్ణి మహిమపరుస్తుందని వాక్యం చెబుతుంది గాని, అది ఎలా జరుగుతుందో ప్రత్యేకంగా వివరించదు. అందువల్ల మూలంలోని వేదాంతపరమైన బరువునూ ఉద్వేగాన్నీ యథాతథంగా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవభరితమైన వచనశైలిని పాటించింది. మూలంలోని రెండు పురుష ఏకవచన సర్వనామాలు తెలుగులో అయోమయం కలిగించకుండా సందర్భానుసారంగా ‘యేసు’, ‘పేతురు’ అని స్పష్టం చేశాం. చారిత్రక వర్తమానాన్ని ‘అంటాడు’గా నిలిపాం.
