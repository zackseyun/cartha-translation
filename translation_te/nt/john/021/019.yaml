revisions:
- from: పేతురు ఎలాంటి మరణం ద్వారా దేవుణ్ణి మహిమపరుస్తాడో[a] సూచిస్తూ యేసు ఈ మాట చెప్పాడు. ఇలా చెప్పి, ఆయన పేతురుతో, “నన్ను వెంబడించు” అని అంటాడు.[b]
  to: పేతురు ఎలాంటి మరణం ద్వారా దేవుణ్ణి మహిమపరుస్తాడో[a] సూచిస్తూ యేసు ఈ మాట చెప్పాడు. ఇలా చెప్పి, ఆయన పేతురుతో, “నన్ను అనుసరించు” అని అంటాడు.[b]
  rationale: Only the imperative has been revised. ‘అనుసరించు’ is a clearer modern-standard Telugu equivalent for ἀκολουθέω in this context, preserving both the direct command and its discipleship sense. The historical present, the qualitative force of ‘ఎలాంటి మరణం,’ and the unexpanded expression ‘దేవుణ్ణి మహిమపరుస్తాడో’ are retained.
  reviewer_model: gpt-5.6-terra
