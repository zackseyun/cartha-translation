review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys that Jesus’ statement indicated the kind of death by which Peter would glorify God, and it appropriately retains the Greek historical present in the second sentence. Supplying ‘యేసు’ and ‘పేతురు’ is a contextually clear explicitation and does not alter the sense.
  naturalness: The syntax is clear modern standard Telugu. However, ‘నన్ను వెంబడించు’ can readily suggest chasing or pursuing someone in contemporary Telugu. In this discipleship context, ‘నన్ను అనుసరించు’ is the more natural and established rendering of Ἀκολούθει μοι.
  terminology: ‘దేవుణ్ణి మహిమపరుస్తాడో’ faithfully preserves the theological wording without interpretive expansion. ‘అనుసరించు’ better represents the call to discipleship than ‘వెంబడించు’ in this context.
  issues:
  - severity: medium
    issue: ‘నన్ను వెంబడించు’ is potentially misleading in modern Telugu.
    rationale: While it can mean ‘follow,’ its common contemporary associations include pursuing or chasing. ‘నన్ను అనుసరించు’ communicates Jesus’ imperative to follow him as a disciple more clearly, without adding doctrinal interpretation.
  revised_text: పేతురు ఎలాంటి మరణం ద్వారా దేవుణ్ణి మహిమపరుస్తాడో[a] సూచిస్తూ యేసు ఈ మాట చెప్పాడు. ఇలా చెప్పి, ఆయన పేతురుతో, “నన్ను అనుసరించు” అని అంటాడు.[b]
