  to: యేసు వారితో, “రండి, అల్పాహారం చేయండి[a]” అన్నాడు. అయితే ఆయననే ప్రభువని తెలిసి, శిష్యులలో ఎవ్వరూ ఆయనను, “నీవెవరు?” అని అడగడానికి[b] సాహసించలేదు.
