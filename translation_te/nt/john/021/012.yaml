    rationale: ἐξετάσαι can mean question closely or examine, but the following direct question makes “to ask” the appropriate main-text equivalent. “తెలుసుకోవడానికి” can imply seeking to find out or establish an answer, a nuance not explicitly stated by the Greek.
  - severity: low
    issue: “ఉదయపు భోజనం చేయండి” is somewhat less natural than a standard Telugu term for breakfast.
    rationale: ἀριστήσατε specifically refers to the morning meal; “అల్పాహారం చేయండి” preserves this specificity in more natural contemporary Telugu.
