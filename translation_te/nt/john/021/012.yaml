source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: te
  text: యేసు వారితో, “రండి, అల్పాహారం చేయండి[a]” అన్నాడు. అయితే ఆయననే ప్రభువని తెలిసి, శిష్యులలో ఎవ్వరూ ఆయనను, “నీవెవరు?” అని అడగడానికి[b] సాహసించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఉదయపు భోజనం చేయండి.” గ్రీకు క్రియ ప్రత్యేకంగా ఉదయపు భోజనం చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ అనువదించిన క్రియకు “ప్రశ్నించడం” లేదా “నిశితంగా విచారించడం” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: రండి
  rationale: ఆహ్వానంతో కూడిన ఆజ్ఞార్థక పిలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀριστήσατε
  choice: ఉదయపు భోజనం చేయండి
  rationale: ఈ క్రియ ప్రత్యేకంగా ఉదయపు భోజనం చేయడాన్ని సూచిస్తుంది; కేవలం ‘తినండి’ కంటే కాలసూచనను నిలుపుతుంది.
- source_word: οὐδεὶς δὲ
  choice: అయితే ... ఎవ్వరూ
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసాన్ని లేదా కథన మలుపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐτόλμα
  choice: సాహసించలేదు
  rationale: ప్రశ్నించడానికి ధైర్యం చేయలేదనే τολμάω భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐξετάσαι
  choice: అడిగి తెలుసుకోవడానికి
  rationale: సాధారణంగా అడగడం కంటే విచారించి నిర్ధారించుకునే బలమైన ఛాయను కొంతవరకు నిలుపుతూ, ప్రత్యక్ష ప్రశ్న సందర్భానికి సరిపోతుంది.
- source_word: Σὺ τίς εἶ;
  choice: నీవెవరు?
  rationale: Σὺలోని వ్యక్తి ఉద్ఘాటనను ‘నీవు’ ద్వారా నిలుపుతూ ప్రత్యక్ష గుర్తింపు ప్రశ్నగా సహజంగా ఉంది.
- source_word: εἰδότες ὅτι
  choice: '... అని తెలిసి'
  rationale: గ్రీకు వర్తమాన కృదంత నిర్మాణాన్ని కృదంత రూపంలో ఉంచి, అది కారణార్థకమా లేక నేపథ్య పరిస్థితినే తెలుపుతుందా అనే స్వల్ప అస్పష్టతను అనవసరంగా పరిష్కరించదు.
- source_word: ὁ κύριός
  choice: ప్రభువు
  rationale: యేసును సూచించే κύριος యొక్క క్రీస్తుసంబంధమైన బరువును కాపాడే సాధారణ తెలుగు బైబిలు పదం.
theological_decisions:
- issue: యేసును సూచించే κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: పునరుత్థానానంతర దర్శన సందర్భంలో ‘ప్రభువు’ కథన గుర్తింపుతో పాటు క్రీస్తుసంబంధమైన గంభీరతను నిలుపుతుంది; ‘యజమాని’ భావాన్ని అనవసరంగా పరిమితం చేస్తుంది.
- issue: εἰδότες యొక్క సంబంధం
  choice: అని తెలిసి
  alternative: ఎందుకంటే ఆయన ప్రభువని వారికి తెలుసు
  rationale: కారణ సంబంధం సందర్భంలో సాధ్యమైనప్పటికీ, గ్రీకు కృదంతం దాన్ని స్పష్టంగా కారణవాక్యంగా గుర్తించదు; అందువల్ల అసలు నిర్మాణంలోని స్వల్ప అర్థవిస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే వాక్య గంభీరతను కాపాడేలా రూపొందించబడింది. ‘తెలిసి’ అనే కృదంతం మూలంలోని నిర్మాణాత్మక అస్పష్టతను నిలుపుతుంది; అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
