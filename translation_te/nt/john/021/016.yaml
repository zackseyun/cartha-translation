id: JHN.21.16
reference: John 21:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ πάλιν δεύτερον· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Ποίμαινε τὰ πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: te
  text: 'ఆయన మళ్లీ రెండోసారి అతనితో ఇలా అడిగాడు: “సీమోనూ, యోహాను కుమారుడా, నువ్వు నన్ను ప్రేమిస్తున్నావా?”[a] అతడు ఆయనతో, “అవును ప్రభువా, నేను నిన్ను ప్రేమిస్తున్నానని నీకు తెలుసు” అన్నాడు. ఆయన అతనితో, “నా గొర్రెలను మేపు” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఈ సంభాషణలో ‘ప్రేమించు’ అనే భావానికి గ్రీకులో రెండు వేర్వేరు క్రియలు ఉన్నాయి: యేసు ἀγαπάω అనే క్రియను, పేతురు φιλέω అనే క్రియను వాడారు. కొందరు వీటి మధ్య భావభేదం ఉందని భావిస్తారు; మరికొందరు దీనిని శైలీ వైవిధ్యంగా చూస్తారు. ఆ భేదాన్ని అతిగా నిర్ధారించకుండా ప్రధాన పాఠంలో రెండింటినీ ‘ప్రేమించు’ అని అనువదించాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: మళ్లీ రెండోసారి
  rationale: రెండు గ్రీకు పదాలూ పునరావృతాన్ని స్పష్టంగా సూచిస్తున్నాయి; తెలుగులో కొంత పునరుక్తిగా వినిపించినా మూలంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: Σίμων Ἰωάννου
  choice: యోహాను కుమారుడా సీమోనూ
  rationale: Ἰωάννου అనే షష్ఠీ విభక్తి ఇక్కడ తండ్రి పేరును సూచిస్తుంది; ‘యోనా కుమారుడు’ అనే వేరొక సంప్రదాయ పాఠాన్ని దిగుమతి చేయదు.
- source_word: ἀγαπᾷς / φιλῶ
  choice: ప్రేమిస్తున్నావా / ప్రేమిస్తున్నానని
  rationale: యోహాను రచనలో ఈ రెండు క్రియల అర్థపరిధులు గణనీయంగా కలుస్తాయి. ప్రధాన పాఠంలో రెండింటినీ సహజమైన ‘ప్రేమించు’తో అనువదించి, పదభేదాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: Ναί, κύριε
  choice: అవును ప్రభువా
  rationale: సరళమైన సమ్మతిని, యేసును గౌరవపూర్వకంగా సంబోధించడాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: σὺ οἶδας
  choice: నీకు తెలుసు
  rationale: స్పష్టంగా ఉన్న σὺ స్వల్ప ఉద్ఘాటనను కలిగిస్తుంది; తెలుగు సర్వనామ రూపంలోని ‘నీకు’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ποίμαινε τὰ πρόβατά μου
  choice: నా గొర్రెలను కాయి
  rationale: ποιμαίνω గొర్రెల కాపరి చేసే పోషణ, మార్గదర్శనం, సంరక్షణ అన్నింటినీ సూచిస్తుంది. ‘కాయి’ తెలుగులో కాపరి రూపకాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ἀγαπάω, φιλέω క్రియలను వేర్వేరు తెలుగు పదాలతో చూపాలా?
  choice: ప్రధాన పాఠంలో రెండింటికీ ‘ప్రేమించు’ వాడి, మూలంలోని పదభేదాన్ని పాదటిప్పణిలో పేర్కొనడం.
  alternative: ἀγαπάωకు ‘ప్రేమించు’, φιλέωకు ‘మమకారం కలిగి ఉండు’ లేదా ‘ఇష్టపడు’ వంటి వేర్వేరు పదాలు వాడడం.
  rationale: మూలంలో నిజమైన పదభేదం ఉంది; అయితే ఈ సందర్భంలో అది తప్పనిసరిగా ప్రేమ స్థాయుల మధ్య నిర్దిష్టమైన తేడాను సూచిస్తుందో లేదో స్పష్టం కాదు. వేర్వేరు ప్రధాన పదాలు వాడితే అనిశ్చితమైన మానసిక లేదా వేదాంత భేదాన్ని అనువాదమే నిర్ణయించినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన శైలి. సంభాషణలో సహజమైన ‘నువ్వు/నీకు’ రూపాలు వాడబడ్డాయి; ποιμαίνωలోని కాపరి రూపకాన్ని ‘కాయి’ నిలుపుతుంది. మూలంలో ఉన్న πάλιν δεύτερον పునరుక్తిని ఉద్దేశపూర్వకంగా ‘మళ్లీ రెండోసారి’గా కాపాడాం.
