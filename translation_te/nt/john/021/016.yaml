review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the second questioning (πάλιν δεύτερον), the patronymic “Simon, son of John,” both love verbs without imposing a sharp semantic distinction, Peter’s affirmation, and Jesus’ pastoral command. The lexical-variation footnote appropriately preserves the ἀγαπάω/φιλέω difference without overinterpreting it.
  naturalness: 'The dialogue is clear and modern. Two small refinements improve idiomatic Telugu: punctuating the paired vocatives makes the address immediately clear, and “మేపు” is the ordinary, readily understood pastoral imperative for ποιμαίνω with sheep. It retains the shepherding image in this context better than the comparatively less specific “కాయి.”'
  terminology: “ప్రభువా,” “ప్రేమించు,” and “గొర్రెలు” are appropriate. The footnote’s treatment of ἀγαπάω and φιλέω is balanced and does not introduce an unwarranted theological distinction.
  issues:
  - severity: low
    issue: The vocative address lacks punctuation.
    rationale: “యోహాను కుమారుడా సీమోనూ” is understandable, but “సీమోనూ, యోహాను కుమారుడా” clearly marks both elements as direct address and follows the Greek order more closely.
  - severity: medium
    issue: “నా గొర్రెలను కాయి” is less precise and less idiomatic here than the customary pastoral imperative.
    rationale: ποιμαίνω denotes shepherding a flock. With “గొర్రెలు,” “మేపు” is natural modern Telugu and directly conveys the pastoral action, whereas “కాయి” foregrounds guarding and can sound less specific.
  revised_text: 'ఆయన మళ్లీ రెండోసారి అతనితో ఇలా అడిగాడు: “సీమోనూ, యోహాను కుమారుడా, నువ్వు నన్ను ప్రేమిస్తున్నావా?”[a] అతడు ఆయనతో, “అవును ప్రభువా, నేను నిన్ను ప్రేమిస్తున్నానని నీకు తెలుసు” అన్నాడు. ఆయన అతనితో, “నా గొర్రెలను మేపు” అన్నాడు.'
