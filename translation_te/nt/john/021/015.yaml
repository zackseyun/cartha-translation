source:
  edition: SBLGNT
  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: te
  text: వారు ఉదయం భోజనం చేసిన తర్వాత యేసు సీమోను పేతురుతో, “యోహాను కుమారుడైన సీమోనూ, వీటికంటే నన్ను ఎక్కువగా ప్రేమిస్తున్నావా[a]?” అని అడిగాడు. అతడు ఆయనతో, “అవును, ప్రభువా, నేను నిన్ను ప్రేమిస్తున్నానని నీకు తెలుసు” అని చెప్పాడు. యేసు అతనితో, “నా గొర్రెపిల్లలకు ఆహారం పెట్టు” అన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఇక్కడ గ్రీకులో రెండు వేర్వేరు క్రియలు ఉన్నాయి: యేసు ἀγαπάω (‘ప్రేమించు’) అనే క్రియతో అడిగాడు; పేతురు φιλέω (‘ప్రేమించు, మమకారం కలిగి ఉండు’) అనే క్రియతో జవాబిచ్చాడు. కొందరు వ్యాఖ్యాతలు వీటి మధ్య భావభేదం ఉందని భావిస్తారు; మరికొందరు దీన్ని శైలీ వైవిధ్యంగా చూస్తారు. సందర్భం స్పష్టంగా చెప్పని భేదాన్ని అతిగా చూపకుండా ప్రధాన పాఠంలో రెండింటినీ ‘ప్రేమించు’ అని అనువదించాం.'
    reason: lexical_alternative
  - marker: b
    text: ‘వీటికంటే ఎక్కువగా’ అనే గ్రీకు మాటకు, ‘ఈ మనుషులు నన్ను ప్రేమించేదానికంటే ఎక్కువగా’ అనే అర్థం గానీ, ‘ఈ విషయాలు లేదా వస్తువులకంటే నన్ను ఎక్కువగా ప్రేమిస్తున్నావా’ అనే అర్థం గానీ ఉండవచ్చు. గ్రీకు వాక్యంలో పోలిక పూర్తిగా వ్యక్తం కాలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρίστησαν
  choice: ఉదయ భోజనం చేసిన తరువాత
  rationale: ἀριστάω ఉదయపు భోజనం చేయడాన్ని సూచిస్తుంది. ఈ రూపం కాలసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: Σίμων Ἰωάννου
  choice: యోహాను కుమారుడైన సీమోనూ
  rationale: Ἰωάννου ఇక్కడ తండ్రి పేరును తెలిపే షష్ఠీ విభక్తి రూపం. మూలపాఠంలోని ‘యోహాను’నే అనుసరిస్తూ, మత్తయి 16:17లోని సంప్రదాయ ‘యోనా’ రూపాన్ని ఇక్కడికి తీసుకురాలేదు.
- source_word: ἀγαπᾷς / φιλῶ
  choice: ప్రేమిస్తున్నావా / ప్రేమిస్తున్నాను
  rationale: రెండు గ్రీకు క్రియల మధ్య ఉద్దేశపూర్వక స్థాయి భేదం ఉందో, శైలీ వైవిధ్యమేనో వివాదాస్పదం. ప్రధాన పాఠంలో రెండింటికీ సహజమైన ‘ప్రేమించు’ వాడి, పదభేదాన్ని పాదసూచికలో తెలిపాం.
- source_word: πλέον τούτων
  choice: ఇవన్నిటికంటే ఎక్కువగా
  rationale: గ్రీకులో పోలికకు సంబంధించిన అంశం పూర్తిగా వ్యక్తం కాలేదు. తెలుగు వ్యాకరణంలో వ్యక్తులు/వస్తువులు అనే భేదాన్ని పూర్తిగా అస్పష్టంగా ఉంచడం కష్టం; ‘ఇవన్నిటికంటే’ సందర్భంలోని సమీప సమూహం లేదా విషయాల వైపు విస్తృతంగా చూపుతూ, మిగిలిన అర్థసాధ్యతలను పాదసూచికలో ఉంచుతుంది.
- source_word: κύριε
  choice: ప్రభువా
  rationale: యోహాను సువార్త సందర్భంలో ఇది కేవలం మర్యాదపూర్వక సంబోధనకన్నా యేసుపట్ల పేతురు చూపే గౌరవాన్ని బలంగా వ్యక్తం చేస్తుంది.
- source_word: Βόσκε
  choice: మేత పెట్టు
  rationale: βόσκω ప్రత్యేకంగా ఆహారం పెట్టడం లేదా మేత మేయించడాన్ని సూచిస్తుంది. తరువాత వచ్చే విస్తృతమైన కాపరి క్రియతో దీనిని కలిపివేయకుండా, ఆహారం అందించే భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τὰ ἀρνία μου
  choice: నా గొర్రెపిల్లలకు
  rationale: ἀρνία చిన్న లేదా యౌవన గొర్రెలను సూచిస్తుంది; ‘గొర్రెపిల్లలు’ కాపరి రూపకాన్ని సహజంగా నిలుపుతుంది. ‘నా’ యేసు అధికారం, యాజమాన్యం మరియు సంరక్షణను నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀγαπάω, φιλέω మధ్య భేదాన్ని ప్రధాన పాఠంలో ఎంతవరకు చూపాలి
  choice: రెండింటినీ ‘ప్రేమించు’గా అనువదించి, గ్రీకు పదభేదాన్ని పాదసూచికలో నమోదు చేయడం
  alternative: ἀγαπάωను ‘ప్రేమించు’గా, φιλέωను ‘మమకారం కలిగి ఉండు’ లేదా ‘అభిమానం కలిగి ఉండు’గా వేరు చేయడం
  rationale: యోహాను ఈ రెండు క్రియలను ప్రేమలో ఉన్నత-నిమ్న స్థాయిలుగా ఉద్దేశించాడని పాఠం నిస్సందేహంగా చెప్పదు. భేదాన్ని ప్రధాన పాఠంలో బలవంతంగా పెట్టడం ఒక నిర్దిష్టమైన ధార్మిక మనోవ్యాఖ్యానాన్ని దిగుమతి చేయవచ్చు.
- issue: πλέον τούτωνలో పోలిక దేనితోనో నిర్ణయించడం
  choice: ప్రధాన పాఠంలో సాధ్యమైనంత విస్తృతమైన సూచనను ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలియజేయడం
  alternative: ‘ఈ మనుషులు నన్ను ప్రేమించేదానికంటే’ లేదా ‘ఈ వస్తువులను ప్రేమించేదానికంటే’ అని ఒకే అర్థాన్ని ఎంచుకోవడం
  rationale: గ్రీకు వాక్యం పోలికను సంక్షిప్తంగా, అస్పష్టంగా ఉంచుతుంది. ఒక అర్థాన్ని మాత్రమే ఎంచుకుంటే మూలపాఠం అనుమతించే ఇతర అర్థం మూసుకుపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలిని వాడాం. గ్రీకు చారిత్రక వర్తమానకాలమైన λέγειని సహజ తెలుగు కథనానికి అనుగుణంగా భూతకాలంలో ఇచ్చాం. సంభాషణలోని ప్రత్యక్షతను, కాపరి రూపకాన్ని నిలుపుకున్నాం.
