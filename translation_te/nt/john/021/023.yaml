id: JHN.21.23
reference: John 21:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: te
  text: కాబట్టి, ఆ శిష్యుడు మరణించడని ఈ మాట[a] సహోదరుల మధ్య[b] వ్యాపించింది. అయితే యేసు అతనితో, “అతడు మరణించడు” అని చెప్పలేదు; కానీ, “నేను వచ్చేవరకు అతడు ఉండాలని నేను కోరుకుంటే, అది నీకెందుకు?” అని అన్నాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఈ వార్త’ లేదా ‘ఈ వాక్యం’ అని కూడా అనువదించవచ్చు. గ్రీకు λόγος అనే పదానికి ‘మాట,’ ‘వాక్యం,’ ‘వార్త,’ లేదా ‘సందేశం’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘సహోదరులు’ అంటే శిష్యుల సమాజం. గ్రీకు మూలంలో పుంలింగ బహువచనమైన ἀδελφοί వాడబడింది.
    reason: cultural_note
  - marker: c
    text: యేసు ఈ శిష్యుడు మరణించడని వాగ్దానం చేయలేదు. ఆయన చెప్పింది, ‘నేను వచ్చేవరకు అతడు ఉండాలని నేను కోరుకుంటే’ అనే షరతుతో కూడిన మాట.
    reason: clarification
lexical_decisions:
- source_word: ἐξῆλθεν ... εἰς
  choice: మధ్య వ్యాపించింది
  rationale: ఒక మాట ఒక సమూహంలో ప్రచారంలోకి వెళ్లడాన్ని సూచించే గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὗτος ὁ λόγος
  choice: ఈ మాట
  rationale: λόγος ఇక్కడ ప్రచారంలోకి వచ్చిన వాక్యం లేదా వాదనను సూచిస్తుంది. ‘ఈ మాట’ మూలపద విస్తృతిని నిలుపుతూ, అది నిజమని ముందే నిర్ధారించదు.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: సహోదరుల మధ్య
  rationale: ఈ సందర్భంలో సందేశం శిష్యుల సమాజంలో వ్యాపించిందనే భావాన్ని ‘మధ్య’ సహజంగా తెలియజేస్తుంది; ἀδελφοί యొక్క పుంలింగ బహువచన రూపాన్ని ‘సహోదరులు’గా నిలిపింది.
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: ఆ శిష్యుడు
  rationale: ἐκεῖνος సూచించే నిర్దిష్టతను ‘ఆ’ నిలుపుతుంది.
- source_word: οὐκ ἀποθνῄσκει
  choice: మరణించడు
  rationale: ప్రచారంలో ఉన్న వాదనను తెలుగులో సహజంగా తెలిపే భవిష్యదర్థక నిషేధ రూపం; తరువాతి రచయిత సవరణలోనూ అదే పదబంధం నిలిపింది.
- source_word: οὐκ εἶπεν δὲ
  choice: అయితే ... చెప్పలేదు
  rationale: δέ ఇక్కడ ముందటి అపార్థాన్ని సరిచేసే వ్యతిరేక సంబంధాన్ని సూచిస్తుంది.
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: అతడు ఉండాలని నేను కోరుకుంటే
  rationale: θέλωలోని సంకల్పం లేదా కోరికను ‘కోరుకుంటే’ స్పష్టంగా తెలియజేస్తుంది; μένεινను అతిగా వ్యాఖ్యానించకుండా ‘ఉండడం’గా అనువదించింది.
- source_word: ἕως ἔρχομαι
  choice: నేను వచ్చేవరకు
  rationale: గ్రీకు వర్తమాన రూపంలోని భవిష్యదర్థాన్ని తెలుగులో సహజంగా ఇస్తూ, ‘తిరిగి’ అనే మూలంలో లేని వివరణను చేర్చదు.
- source_word: τί πρὸς σέ
  choice: అది నీకెందుకు?
  rationale: ఇతర శిష్యుని గతి గురించి పేతురు చూపుతున్న ఆసక్తిని పక్కనపెట్టే గ్రీకు నుడికారానికి సహజమైన, నేరమైన తెలుగు రూపం.
theological_decisions:
- issue: ప్రియ శిష్యుని మరణం గురించి వ్యాపించిన వాదన స్వభావం
  choice: యేసు అతడు మరణించడని వాగ్దానం చేశాడని కాకుండా, శిష్యుల మధ్య వ్యాపించిన ‘మాట’గా అనువదించడం
  alternative: ‘ఈ వార్త’ లేదా ‘ఈ వదంతి’ అని అనువదించడం
  rationale: వచనమే ఆ వాదనను వెంటనే సరిచేస్తుంది. ‘ఈ మాట’ λόγος యొక్క అర్థవిస్తృతిని కాపాడి, దానిని నిజమైన వాగ్దానమని గానీ ఉద్దేశపూర్వకమైన వదంతి అని గానీ ముందుగానే తీర్మానించదు.
- issue: Ἐὰν అనే షరతు మరియు యేసు రాక మధ్య సంబంధం
  choice: ‘నేను ... కోరుకుంటే’ అనే నిజమైన షరతుగానే ఉంచడం
  alternative: ఆ శిష్యుడు యేసు రాకవరకు తప్పక జీవిస్తాడనే వాగ్దానంగా విప్పి చెప్పడం
  rationale: మూలపాఠం ఊహాత్మక షరతును మాత్రమే ఉంచుతుంది; దానిని నిశ్చిత ప్రవచనంగా మార్చడం రచయిత చేస్తున్న స్పష్టమైన సవరణకు విరుద్ధం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘మరణించడు’ సాధారణ ‘చనిపోడు’ కంటే కొద్దిగా గంభీరంగా ఉంది; ‘అది నీకెందుకు?’ మూలంలోని నేరత్వాన్ని నిలుపుతుంది. వాక్య విభజన తెలుగులో స్పష్టత కోసం చేసినది; గ్రీకు వ్యతిరేక నిర్మాణం ‘అయితే ... చెప్పలేదు. కాని ... అన్నాడు’ ద్వారా నిలిచింది.
