  text: οἱ δὲ ἄλλοι μαθηταὶ τῷ πλοιαρίῳ ἦλθον, οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων, σύροντες τὸ δίκτυον τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: te
  text: కానీ మిగతా శిష్యులు చిన్న పడవలో వచ్చారు, ఎందుకంటే వారు ఒడ్డుకు చాలా దూరంగా లేరు, దాదాపు రెండువందల మూరల[a] దూరంలో ఉన్నారు; వారు చేపలున్న వలను ఈడ్చుకుంటూ వచ్చారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రెండువందల మూరలు సుమారు 90 మీటర్లు.
    reason: cultural_note
  - marker: b
    text: 'మరింత అక్షరార్థంగా: ‘చేపల వలను.’ గ్రీకు పదబంధం చేపలు ఉన్న వలను సూచిస్తున్నట్లు అర్థం చేసుకోవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: అయితే మిగతా శిష్యులు
  rationale: δέ ముందరి వచనంలో పేతురు చేసిన చర్యకు స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τῷ πλοιαρίῳ
  choice: చిన్న పడవలో
  rationale: πλοιάριον లోని అల్పార్థక భావాన్ని ‘చిన్న పడవ’ నిలుపుతుంది.
- source_word: ἦλθον
  choice: వచ్చారు
  rationale: కథన సందర్భంలో ἔρχομαι యొక్క భూతకాల చర్యను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: వారు ఒడ్డుకు ఎంతో దూరంలో లేరు
  rationale: γάρ తెలిపే కారణసంబంధం సందర్భంలో స్పష్టంగా ఉంటుంది; నీటికి వ్యతిరేకంగా γῆ ఇక్కడ ఒడ్డును సూచిస్తుంది.
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: దాదాపు రెండువందల మూరల దూరంలోనే
  rationale: ὡς లోని సుమారు అనే భావాన్ని ‘దాదాపు’ తెలియజేస్తుంది; πῆχυς అనే ప్రాచీన కొలతను ‘మూర’గా నిలిపి, ఆధునిక అంచనాను పాదసూచికలో ఇస్తుంది.
- source_word: σύροντες
  choice: ఈడ్చుకుంటూ వచ్చారు
  rationale: వారు పడవలో వస్తున్నప్పుడే వలను లాగుతున్న సమకాలిక చర్యను తెలుగు కథనంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: చేపలున్న వలను
  rationale: గ్రీకు షష్ఠీ విభక్తి వలలో చేపలు ఉన్నాయనే విషయార్థాన్ని సూచించవచ్చు; ‘నిండిన’ అని మూలంలో లేని తీవ్రతను చేర్చకుండా సహజంగా అనువదిస్తుంది.
