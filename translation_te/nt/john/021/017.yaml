- from: ఆయన మూడోసారి అతనితో, “యోహాను కుమారుడైన సీమోనూ, నువ్వు నన్ను ప్రేమిస్తున్నావా?” అని అడిగాడు.[a] “నువ్వు నన్ను ప్రేమిస్తున్నావా?” అని ఆయన మూడోసారి అడిగినందుకు పేతురు దుఃఖపడి, “ప్రభువా, నీకు అన్నీ తెలుసు; నేను నిన్ను ప్రేమిస్తున్నానని నీకు తెలుసు” అని ఆయనతో అన్నాడు.[b] యేసు అతనితో, “నా గొర్రెలను మేపు” అన్నాడు.
