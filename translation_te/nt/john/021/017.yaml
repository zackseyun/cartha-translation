id: JHN.21.17
reference: John 21:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: te
  text: ఆయన మూడోసారి అతనితో, “యోహాను కుమారుడైన సీమోనూ, నువ్వు నన్ను ప్రేమిస్తున్నావా?” అని అడిగాడు.[a] ఆయన మూడోసారి, “నువ్వు నన్ను ప్రేమిస్తున్నావా?” అని అడిగాడని పేతురు దుఃఖించాడు. అప్పుడు అతను ఆయనతో, “ప్రభువా, అన్నీ నీకే తెలుసు; నేను నిన్ను ప్రేమిస్తున్నానని నీకు తెలుసు” అన్నాడు.[b] యేసు అతనితో, “నా గొర్రెలను మేపు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ గ్రీకులో φιλέω (‘ప్రేమించు, అనురాగం కలిగి ఉండు’) అనే క్రియ ఉంది; ఈ సంభాషణలో ముందటి రెండు ప్రశ్నల్లో యేసు ἀγαπάω అనే క్రియను ఉపయోగించాడు. కొందరు ఈ పదభేదానికి ప్రత్యేక ప్రాముఖ్యత ఇస్తారు; మరికొందరు ఈ సందర్భంలో ఈ రెండు క్రియల భావాలు ఒకదానితో ఒకటి కలుస్తాయని భావిస్తారు. గ్రీకు పాఠం స్పష్టంగా నిర్దేశించేదానికంటే గట్టి భేదాన్ని రుద్దకుండా, అనువాదంలో ‘ప్రేమించు’ అనే పదమే వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: పేతురు సమాధానంలో ‘తెలుసు’ అనే భావానికి గ్రీకులో οἶδα, γινώσκω అనే రెండు క్రియలు ఉన్నాయి. తెలుగులో ఇక్కడ రెండింటినీ సహజంగా ‘తెలుసు’ అని అనువదించవచ్చు. పునరుక్తిలో ఏదైనా సూక్ష్మభేదం ఉండవచ్చు, కానీ దాన్ని వేరే తెలుగు పదాలతో చూపడం భావాన్ని అతిగా నిర్ధారించే ప్రమాదం కలిగిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: మూడోసారి
  rationale: తెలుగులో సహజమైన కాలసూచక ప్రయోగం; ప్రశ్న మూడుసార్లు పునరావృతమైన అంశాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Σίμων Ἰωάννου
  choice: యోహాను కుమారుడైన సీమోనూ
  rationale: Ἰωάννου అనే షష్ఠీ విభక్తిని తండ్రి పేరును సూచించే సంబంధంగా అనువదించింది; ఈ పాఠంలోని ‘యోహాను’ను ‘యోనా’గా మార్చలేదు.
- source_word: φιλεῖς / φιλῶ
  choice: ప్రేమిస్తున్నావా / ప్రేమిస్తున్నాను
  rationale: φιλέω ప్రేమ లేదా అనురాగాన్ని సూచిస్తుంది. ముందటి ప్రశ్నల్లోని ἀγαπάωతో ఉన్న పదభేదాన్ని అతిగా సిద్ధాంతీకరించకుండా, తెలుగులో గంభీరంగా మరియు సహజంగా ‘ప్రేమించు’ అని ఇచ్చింది.
- source_word: ἐλυπήθη
  choice: దుఃఖపడి
  rationale: పేతురుకు కలిగిన లోతైన బాధను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: పునరుత్థానుడైన యేసును పేతురు సంబోధిస్తున్న సందర్భంలో κύριεకు తగిన గౌరవభరితమైన రూపం.
- source_word: πάντα σὺ οἶδας
  choice: నీకు అన్నీ తెలుసు
  rationale: πάντα యొక్క విస్తృతిని తగ్గించకుండా, తెలుగు వాక్యనిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἶδας ... γινώσκεις
  choice: తెలుసు ... తెలుసు
  rationale: గ్రీకులో రెండు వేర్వేరు జ్ఞానక్రియలు ఉన్నా, ఈ సందర్భంలో వాటి సూక్ష్మభేదాన్ని తెలుగులో బలవంతంగా నిర్ధారించకుండా పునరుక్తిని నిలిపింది.
- source_word: Βόσκε
  choice: మేపు
  rationale: βόσκω యొక్క ఆహారం పెట్టడం/మేత మేపడం అనే నిర్దిష్ట భావాన్ని, కాపరి రూపకానికి సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πρόβατά
  choice: గొర్రెలను
  rationale: πρόβατα అంటే గొర్రెలు; 15వ వచనంలోని ἀρνία (‘గొర్రెపిల్లలు’)తో గల పదభేదాన్ని కాపాడుతుంది.
theological_decisions:
- issue: φιλέω మరియు ἀγαπάω మధ్య గట్టి భావభేదాన్ని అనువాదంలో చూపాలా?
  choice: ప్రధాన పాఠంలో రెండింటి సందర్భానుగుణ భావాన్ని ‘ప్రేమించు’ అనే పదంతో ఇవ్వడం
  alternative: φιλέωను ‘అభిమానం ఉండు’ లేదా ‘ఆప్యాయత కలిగి ఉండు’ అని వేరుగా అనువదించడం
  rationale: కొయినే గ్రీకులో ఈ రెండు క్రియల మధ్య భేదం ప్రతిసందర్భంలో స్థిరంగా ఉండదు. అందువల్ల వివాదాస్పదమైన వేదాంత నిర్ణయాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చకుండా, పదభేదాన్ని పాదటిప్పణిలో తెలియజేసింది.
- issue: ‘నీకు అన్నీ తెలుసు’ అనే పేతురు మాట యొక్క పరిధి
  choice: వాక్యాన్ని దాని సంపూర్ణ బలంతో ‘నీకు అన్నీ తెలుసు’ అని అనువదించడం
  alternative: ‘ఈ విషయం అంతా నీకు తెలుసు’ అని సందర్భానికే పరిమితం చేయడం లేదా సర్వజ్ఞత్వంపై వివరణను పాఠంలో చేర్చడం
  rationale: గ్రీకు పాఠం πάντα అని విస్తృతంగా చెబుతుంది. దాన్ని తగ్గించకూడదు; అదే సమయంలో అనువాదంలో అదనపు సిద్ధాంత వివరణను చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవభరితమైన కథనశైలిని ఉపయోగించింది. యేసుకు సందర్భానుగుణంగా ‘ఆయన’, పేతురుకు ‘అతను/నువ్వు’ వాడి, ప్రత్యక్ష సంభాషణలో సహజత్వాన్ని నిలిపింది. ‘మేపు’ అనే రూపం కాపరి రూపకాన్ని సంక్షిప్తంగా, స్పష్టంగా కాపాడుతుంది.
