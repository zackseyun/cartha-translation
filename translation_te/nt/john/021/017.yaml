review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the SBLGNT: the third question, Simon''s patronymic, Peter''s grief at the third asking, the two assertions of Jesus'' knowledge, and the command to feed—not merely tend—the sheep are all retained. A minor adjustment makes the causal wording more explicit and preserves the Greek''s repeated second-person emphasis more naturally in Telugu.'
  naturalness: The register is modern, reverent, and idiomatic. The revised phrasing avoids the slightly compressed causal participial construction and uses a more natural Telugu formulation for the repeated "you know."
  terminology: 'Key terms are appropriate: “ప్రభువా” for Κύριε, “ప్రేమించు” for φιλέω without imposing a disputed lexical distinction, and “మేపు” for Βόσκε. “గొర్రెలను” correctly distinguishes πρόβατα from the lambs of verse 15.'
  issues:
  - severity: low
    issue: The causal clause “మూడోసారి అడిగినందుకు పేతురు దుఃఖపడి” is slightly compressed.
    rationale: Although understandable, “ఆయన మూడోసారి ... అడిగాడని పేతురు దుఃఖించాడు” more directly reflects ὅτι and reads more smoothly in contemporary standard Telugu.
  - severity: low
    issue: The repeated emphasis in Peter's “you know” statements can be represented more clearly.
    rationale: The Greek explicitly repeats σὺ. Telugu need not reproduce it mechanically, but “ప్రభువా, అన్నీ నీకే తెలుసు; నేను నిన్ను ప్రేమిస్తున్నానని నీకు తెలుసు” retains the force naturally without adding interpretation.
  revised_text: ఆయన మూడోసారి అతనితో, “యోహాను కుమారుడైన సీమోనూ, నువ్వు నన్ను ప్రేమిస్తున్నావా?” అని అడిగాడు.[a] ఆయన మూడోసారి, “నువ్వు నన్ను ప్రేమిస్తున్నావా?” అని అడిగాడని పేతురు దుఃఖించాడు. అప్పుడు అతను ఆయనతో, “ప్రభువా, అన్నీ నీకే తెలుసు; నేను నిన్ను ప్రేమిస్తున్నానని నీకు తెలుసు” అన్నాడు.[b] యేసు అతనితో, “నా గొర్రెలను మేపు” అన్నాడు.
