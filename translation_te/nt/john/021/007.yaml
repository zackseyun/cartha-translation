id: JHN.21.7
reference: John 21:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: te
  text: కాబట్టి యేసు ప్రేమించిన ఆ శిష్యుడు పేతురుతో, “ఆయనే ప్రభువు” అన్నాడు. ఆయన ప్రభువని సీమోను పేతురు వినగానే, పైవస్త్రాన్ని నడుముకు కట్టుకున్నాడు—ఎందుకంటే అతడు తక్కువ బట్టలతో ఉన్నాడు[a]—సముద్రంలోకి దూకాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు నగ్నంగా ఉన్నాడు.” గ్రీకు పదం పూర్తిగా నగ్నంగా ఉండడం లేదా తగినంత బట్టలు వేసుకోకపోవడం అనే రెండు అర్థాల్లో వాడవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: కాబట్టి ... అన్నాడు
  rationale: οὖν కథలో ముందున్న సంఘటననుంచి వచ్చిన గుర్తింపును, తదుపరి మాటను కలుపుతుంది; ‘కాబట్టి’ దాని అన్వయ బలాన్ని నిలుపుతుంది.
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: యేసు ప్రేమించిన ఆ శిష్యుడు
  rationale: ἐκεῖνος లోని నిర్దేశార్థాన్ని ‘ఆ’తో నిలిపి, యోహాను సువార్తలోని ప్రత్యేక వర్ణనను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: Ὁ κύριός ἐστιν
  choice: ఆయన ప్రభువు
  rationale: κύριος ను దాని సాధారణమైనదీ క్రీస్తు సంబంధమైనదీ అయిన భావబరువుతో ‘ప్రభువు’గా అనువదించాం; వ్యక్తిని గుర్తించే తెలుగు వాక్యంలో ‘ఆయన’ సహజం.
- source_word: ἀκούσας
  choice: వినగానే
  rationale: అయోరిస్టు కృదంతం సూచించే కాలక్రమాన్నీ తక్షణ ప్రతిస్పందననూ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὸν ἐπενδύτην διεζώσατο
  choice: పైవస్త్రాన్ని నడుముకు కట్టుకున్నాడు
  rationale: ἐπενδύτης బయటి/పై వస్త్రాన్ని సూచిస్తుంది; διαζώννυμι వస్త్రాన్ని చుట్టుకొని బిగించడాన్ని సూచిస్తుంది. ‘నడుముకు కట్టుకున్నాడు’ కార్యాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἦν γὰρ γυμνός
  choice: ఎందుకంటే అతడు బట్టలు సరిగా వేసుకొని లేడు
  rationale: γυμνός పూర్తిగా నగ్నంగా ఉండడాన్నీ, తగినంతగా వస్త్రధారణ చేయకపోవడాన్నీ సూచించగలదు. పని చేస్తున్న సందర్భంలో ప్రధాన పాఠ్యం రెండవ భావాన్ని సహజంగా ఇస్తూ, బలమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: సముద్రంలోకి దూకాడు
  rationale: పదశః ‘తనను తాను సముద్రంలోకి విసిరుకున్నాడు’; తెలుగులో ‘దూకాడు’ అదే ఉద్దేశపూర్వక, వేగవంతమైన చర్యను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసును గుర్తించినప్పుడు κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని / గురువు
  rationale: పునరుత్థానానంతర గుర్తింపు సందర్భంలో ‘ప్రభువు’ సాధారణ బిరుదునూ క్రీస్తు సంబంధమైన భావబరువునూ వివరణ జోడించకుండా నిలుపుతుంది.
- issue: పేతురు స్థితిని తెలిపే γυμνός భావం
  choice: బట్టలు సరిగా వేసుకొని లేడు
  alternative: నగ్నంగా ఉన్నాడు
  rationale: గ్రీకు పదం రెండు భావాలకు వీలు ఇస్తుంది. పైవస్త్రం అందుబాటులో ఉండటం, పడవలో పని చేస్తున్న సందర్భం దృష్ట్యా ప్రధాన పాఠ్యంలో తక్కువ నిర్దిష్టమైన సందర్భోచిత భావాన్ని ఎంచుకొని, నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. ‘పైవస్త్రం’, ‘ప్రభువు’ వంటి పదాలు మూలంలోని భావాన్ని అతిగా విశదీకరించకుండా నిలుపుతాయి. γυμνός లోని నిజమైన సందిగ్ధతను ప్రధాన పాఠ్యం మరియు పాదసూచిక కలిసి సంరక్షిస్తాయి.
