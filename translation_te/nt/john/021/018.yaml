id: JHN.21.18
reference: John 21:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: te
  text: '“నేను నీతో నిజంగా, నిజంగా చెబుతున్నాను: నీవు చిన్నవాడిగా ఉన్నప్పుడు, నీ నడుముకు నీవే వస్త్రం కట్టుకొని[a] నీకు ఇష్టమైన చోట తిరిగేవాడివి. అయితే నీవు వృద్ధుడవైనప్పుడు, నీ చేతులు చాపుతావు[b]; మరొకడు నీ నడుముకు వస్త్రం కట్టి, నీవు వెళ్లడానికి ఇష్టపడని చోటికి నిన్ను తీసుకెళ్తాడు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీకు నీవే నడుము కట్టుకొని.” గ్రీకు క్రియ అక్షరార్థంగా దుస్తులను నడుముకు కట్టుకోవడాన్ని సూచిస్తుంది; ఇక్కడ పేతురు గత స్వాతంత్ర్యానికీ తరువాతి పరాధీనతకీ మధ్య వ్యత్యాసం కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నీ చేతులు చాపుతావు” అనే మాట పేతురు సిలువ వేయబడి మరణించడాన్ని సూచిస్తుందని సాధారణంగా అర్థం చేసుకుంటారు. తరువాతి వచనం, పేతురు ఎలాంటి మరణంతో దేవుణ్ణి మహిమపరుస్తాడో సూచిస్తూ యేసు ఇలా చెప్పాడని వివరిస్తుంది.
    reason: cross_reference
  - marker: c
    text: లేదా “నిన్ను మోసుకెళ్తాడు,” “నిన్ను నడిపిస్తాడు.” గ్రీకు పదం ఒకరిని అతడు ఇష్టపడని గమ్యానికి తీసుకుపోవడం లేదా మోసుకుపోవడం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: రెండుసార్లు వచ్చిన గంభీరమైన ధృవీకరణను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: λέγω σοι
  choice: నేను నీతో ... చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, యోహాను శైలిలోని గంభీరతను కాపాడుతుంది.
- source_word: ὅτε ἦς νεώτερος
  choice: నీవు యౌవనంలో ఉన్నప్పుడు
  rationale: పేతురు గతంలోని చిన్న వయస్సును, తరువాత ప్రస్తావించిన వృద్ధాప్యంతో సహజంగా వ్యత్యాసపరుస్తుంది.
- source_word: ἐζώννυες σεαυτόν
  choice: నీకు నీవే నడుము కట్టుకొని
  rationale: ζώννυμι అనే క్రియలోని దుస్తులను నడుముకు బిగించుకునే మూలచిత్రాన్ని, స్వతంత్రంగా చేసుకునే భావాన్ని నిలుపుతుంది.
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: నీకు ఇష్టమైన చోట తిరిగేవాడివి
  rationale: ఇక్కడి సాధారణ సంచార భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ఇది నైతిక నడవడిని సూచించే రూపకంగా అనువదించదు.
- source_word: ὅταν δὲ γηράσῃς
  choice: అయితే నీవు ముసలివాడవైనప్పుడు
  rationale: భవిష్యత్తులో సంభవించే వృద్ధాప్యాన్ని, δέ సూచించే వ్యత్యాసంతో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: నీ చేతులు చాపుతావు
  rationale: మూలంలోని చిత్రాన్ని వివరణాత్మకంగా మార్చకుండా యథాతథంగా ఉంచుతుంది.
- source_word: ἄλλος σε ζώσει
  choice: మరొకడు నీకు నడుము కట్టి
  rationale: ముందటి ζώννυμι క్రియతో పదచిత్ర సంబంధాన్ని నిలిపి, పేతురు స్వాతంత్ర్యానికి తరువాతి పరాధీనతను వ్యత్యాసపరుస్తుంది.
- source_word: οἴσει
  choice: నిన్ను తీసుకెళ్తాడు
  rationale: φέρω యొక్క ‘మోసుకుపోవడం/తీసుకుపోవడం’ పరిధిని సందర్భానుకూలమైన సహజ తెలుగులో ఇస్తూ, బలవంతం ఎంత మేర ఉందో ప్రధాన పాఠ్యంలో నిర్దిష్టం చేయదు.
- source_word: ὅπου οὐ θέλεις
  choice: నీవు వెళ్లడానికి ఇష్టపడని చోటికి
  rationale: గ్రీకులో అంతర్భావంగా ఉన్న గమ్యార్థాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఈ మాటలను ప్రధాన పాఠ్యంలోనే సిలువ మరణానికి స్పష్టమైన సూచనగా వివరించాలా?
  choice: ప్రధాన పాఠ్యంలో ‘నీ చేతులు చాపుతావు’ అనే మూలచిత్రాన్ని నిలుపడం
  alternative: దీనిని నేరుగా సిలువ వేయబడటంగా వ్యాఖ్యానించి అనువదించడం
  rationale: తరువాతి వచనమే యేసు మాటలు పేతురు ఎలాంటి మరణంతో దేవుణ్ణి మహిమపరుస్తాడో సూచించాయని వివరిస్తుంది. అందువల్ల కథనంలోని క్రమాన్ని, ఉద్దేశపూర్వకమైన సూచనాత్మకతను ఈ వచనంలో నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రత్యక్ష సంభాషణగా రూపొందించబడింది. “నడుము కట్టుకొని” అనే పదబంధం మూలంలోని దుస్తులు బిగించుకునే చిత్రాన్ని నిలుపుతుంది; అర్థస్పష్టత కోసం పాదసూచిక ఇచ్చబడింది. వాక్యంలోని స్వాతంత్ర్యం–పరాధీనత వ్యత్యాసం, మరణాన్ని సూచించే అంతర్లీన ఉద్వేగం వ్యాఖ్యానంతో ముందుగానే పరిష్కరించబడలేదు.
