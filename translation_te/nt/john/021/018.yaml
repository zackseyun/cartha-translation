revisions:
- from: '“నేను నీతో నిజంగా, నిజంగా చెబుతున్నాను: నీవు యౌవనంలో ఉన్నప్పుడు నీకు నీవే నడుము కట్టుకొని[a], నీకు ఇష్టమైన చోట తిరిగేవాడివి. అయితే నీవు ముసలివాడవైనప్పుడు నీ చేతులు చాపుతావు[b]; మరొకడు నీకు నడుము కట్టి, నీవు వెళ్లడానికి ఇష్టపడని చోటికి నిన్ను తీసుకెళ్తాడు[c].”'
  to: '“నేను నీతో నిజంగా, నిజంగా చెబుతున్నాను: నీవు చిన్నవాడిగా ఉన్నప్పుడు, నీ నడుముకు నీవే వస్త్రం కట్టుకొని[a] నీకు ఇష్టమైన చోట తిరిగేవాడివి. అయితే నీవు వృద్ధుడవైనప్పుడు, నీ చేతులు చాపుతావు[b]; మరొకడు నీ నడుముకు వస్త్రం కట్టి, నీవు వెళ్లడానికి ఇష్టపడని చోటికి నిన్ను తీసుకెళ్తాడు[c].”'
  rationale: సవరణలు అర్థాన్ని మార్చవు. అవి ζώννυμι అనే పదం రెండుసార్లు కనిపించడం ద్వారా ఏర్పడే స్వయంకర్తృత్వం–ఇతరుల ఆధీనత వ్యత్యాసాన్ని తెలుగులో వ్యాకరణపరంగా స్పష్టంగా, సహజంగా చేశాయి. ‘చేతులు చాపడం’ను సిలువ మరణంగా ప్రధాన పాఠ్యంలో వివరించకుండా, మూలంలోని సూచనాత్మకతను నిలిపాయి. అన్ని పాదసూచిక గుర్తులు పాఠ్యంలో ఒక్కోసారి సరైన స్థానంలో ఉన్నాయి.
