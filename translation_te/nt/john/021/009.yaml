id: JHN.21.9
reference: John 21:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: te
  text: కాబట్టి వారు నేలమీదికి దిగగానే[a], అక్కడ ఉన్న బొగ్గుల మంటను[b], దానిమీద ఉంచబడి ఉన్న చేపను, రొట్టెను చూశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు ఒడ్డుకు చేరగానే.’ గ్రీకులో మరింత అక్షరార్థంగా, ‘వారు నేలమీదికి దిగగానే’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘బొగ్గుల మంట’కు అనువదించిన గ్రీకు పదమే యోహాను 18:18లో కూడా ఉంది. ఇది ఈ దృశ్యానికీ పేతురు ఇంతకుముందు యేసును ఎరుగనని చెప్పిన సందర్భానికీ పదసంబంధాన్ని ఏర్పరుస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: కాబట్టి ... రాగానే
  rationale: ὡς యొక్క కాలసంబంధ భావాన్ని ‘రాగానే’తో, οὖν యొక్క కథన అనుసంధానాన్ని ‘కాబట్టి’తో సహజమైన తెలుగులో తెలిపింది.
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: వారు దిగి నేల మీదికి రాగానే
  rationale: పడవనుంచి దిగి నేల మీదికి రావడాన్ని మూలంలోని కదలికకు దగ్గరగా వ్యక్తం చేస్తుంది; ‘ఒడ్డుకు చేరగానే’ అనే సహజ ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చింది.
- source_word: βλέπουσιν
  choice: చూశారు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని సహజ తెలుగు కథనశైలికి అనుగుణంగా భూతకాలంలో అందించింది.
- source_word: ἀνθρακιὰν
  choice: నిప్పుల బొగ్గుల మంటను
  rationale: ఇది సాధారణ కట్టెల మంట కాకుండా మండుతున్న బొగ్గుల మంట అని స్పష్టం చేస్తూ, యోహాను 18:18లోని అదే పదంతో ఉన్న శాబ్దిక సంబంధాన్ని నిలుపుతుంది.
- source_word: κειμένην
  choice: అక్కడ
  rationale: మంట అక్కడ సిద్ధంగా/ఉంచబడి ఉన్న స్థితిని సహజంగా తెలియజేస్తుంది; తెలుగులో మంటను ‘పరచి ఉంది’ అని అక్షరార్థంగా చెప్పడం అసహజం.
- source_word: ὀψάριον
  choice: చేపను
  rationale: యోహాను వాడుకలో ఆహారమైన చేపను సూచిస్తుంది. ఏకవచన రూపాన్ని నిలిపి, సందర్భం చెప్పనిదాన్ని అదనంగా చేర్చలేదు.
- source_word: ἐπικείμενον
  choice: దానిమీద ఉంచిన
  rationale: చేప బొగ్గుల మంట మీద ఉన్న సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἄρτον
  choice: రొట్టెను
  rationale: ἄρτοςకు సాధారణ, సంఖ్య లేదా ఆకారాన్ని అతిగా నిర్దిష్టం చేయని తెలుగు సమానార్థకం.
theological_decisions:
- issue: కథనంలోని చారిత్రక వర్తమాన కాలం
  choice: βλέπουσινను ‘చూశారు’ అనే భూతకాలంలో అనువదించడం
  alternative: ‘చూస్తారు’ అని గ్రీకు వర్తమాన రూపాన్ని నిలుపడం
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు; సహజమైన ఆధునిక తెలుగు కథనంలో సంఘటనల క్రమాన్ని భూతకాలం స్పష్టంగా అందిస్తుంది.
- issue: ἀνθρακιὰν పదం ద్వారా పేతురు నిరాకరణ దృశ్యంతో శాబ్దిక సంబంధం
  choice: ‘నిప్పుల బొగ్గుల మంట’ అని ప్రత్యేకంగా అనువదించడం
  alternative: సాధారణంగా ‘మంట’ అని అనువదించడం
  rationale: యోహాను 18:18లోనూ ఇదే అరుదైన గ్రీకు పదం వాడబడింది. వ్యాఖ్యానార్థాన్ని ప్రధాన వచనంలో చేర్చకుండా, మూలంలోని పదసంబంధాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. మూలంలోని వరుస—బొగ్గుల మంట, దానిమీద చేప, రొట్టె—నిలుపబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
