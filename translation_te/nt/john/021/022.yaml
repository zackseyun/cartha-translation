id: JHN.21.22
reference: John 21:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: te
  text: 'యేసు అతనితో ఇలా అన్నాడు: “నేను వచ్చేవరకు[b] అతడు నిలిచి ఉండాలని నేను కోరుకుంటే[a], అది నీకెందుకు? నీవు నన్ను అనుసరించు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు నిలిచి ఉండాలని నేను సంకల్పిస్తే.” గ్రీకు క్రియ కోరికను లేదా సంకల్పాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: “నేను వచ్చేవరకు” అనే మాట దేనిని సూచిస్తుందో ఇక్కడ ఉద్దేశపూర్వకంగా నిర్దిష్టం చేయలేదు; అది చరిత్రలో జరిగే ఒక సంఘటనలో ఆయన రావడాన్నా, లేక ఆయన అంతిమ రాకనూ సూచిస్తుందా అనే విషయంలో వ్యాఖ్యానాలు భిన్నంగా ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: యేసు అతనితో ఇలా అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథన శైలిలో భూతకాల ప్రయోగం సహజంగా ఉంటుంది.
- source_word: Ἐὰν
  choice: కోరితే
  rationale: షరతును సహజమైన తెలుగు ‘-తే’ రూపంలో వ్యక్తపరుస్తుంది; గ్రీకు వాక్యంలోని ఊహాత్మక భావాన్ని నిలుపుతుంది.
- source_word: θέλω
  choice: నేను కోరితే
  rationale: θέλω కోరికను లేదా సంకల్పాన్ని సూచించగలదు. ‘కోరితే’ ఆధునిక తెలుగులో సహజంగా ఉండి, సంకల్పార్థాన్ని పూర్తిగా తొలగించదు.
- source_word: μένειν
  choice: నిలిచి ఉండాలని
  rationale: μένω యొక్క ‘ఉండిపోవడం/నిలిచి ఉండడం’ అనే విస్తృత భావాన్ని కాపాడుతుంది; ‘బతికి ఉండడం’ అని సందర్భాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἕως ἔρχομαι
  choice: నేను వచ్చేవరకు
  rationale: రాక స్వభావాన్ని లేదా సందర్భాన్ని నిర్దిష్టం చేయకుండా గ్రీకు కాలవాచక ఉపవాక్యాన్ని నేరుగా అందిస్తుంది.
- source_word: τί πρὸς σέ;
  choice: అది నీకెందుకు?
  rationale: ఇతర శిష్యుని గతి గురించి పేతురు చూపుతున్న ఆసక్తిని పక్కన పెట్టే ప్రశ్నను సహజమైన, సూటి తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: σύ
  choice: నీవు
  rationale: గ్రీకులోని స్పష్టమైన కర్తృసర్వనామపు ఉద్ఘాటనను కాపాడి, ‘అతడు’తో వ్యత్యాసాన్ని చూపుతుంది.
- source_word: μοι ἀκολούθει
  choice: నన్ను అనుసరించు
  rationale: వర్తమాన ఆజ్ఞార్థకంలోని కొనసాగింపు ఛాయను సందర్భం తెలియజేస్తుంది; ఈ రూపం సహజమైన తెలుగు ఆజ్ఞ.
theological_decisions:
- issue: ἕως ἔρχομαιలో యేసు ‘రావడం’ దేనిని సూచిస్తుంది?
  choice: ‘నేను వచ్చేవరకు’ అని నిర్దిష్ట వివరణ లేకుండా అనువదించడం
  alternative: పునరుత్థానానంతర ప్రత్యక్షత, యెరూషలేముపై తీర్పు, లేదా అంతిమ రాక అని స్పష్టీకరించడం
  rationale: ఈ వచనం రాక యొక్క స్వరూపాన్ని నిర్ధారించదు; అందువల్ల చారిత్రక లేదా అంత్యకాల సంబంధమైన ఏ వ్యాఖ్యానాన్నీ అనువాదంలో బలవంతంగా చేర్చలేదు.
- issue: θέλωలో కోరిక మరియు సంకల్పం మధ్య భావ ఛాయ
  choice: ‘కోరితే’
  alternative: ‘సంకల్పిస్తే’
  rationale: గ్రీకు క్రియ రెండింటినీ సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన ‘కోరితే’ వాడి, మరో సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అది నీకెందుకు?’ అనే ప్రశ్న మూలంలోని సూటితనాన్ని నిలుపుతుంది. పాఠ్యంలో ప్రతి పాదటిప్పణి సూచిక [a], [b] చేర్చబడింది.
