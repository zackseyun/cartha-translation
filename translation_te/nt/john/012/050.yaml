source:
  edition: SBLGNT
  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: te
  text: ఆయన ఆజ్ఞ నిత్యజీవమని నాకు తెలుసు. కాబట్టి నేను చెప్పే విషయాలను తండ్రి నాకు చెప్పిన ప్రకారమే చెబుతున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντολή
  choice: ఆజ్ఞ
  rationale: అధికారపూర్వకమైన ఆదేశం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ζωὴ αἰώνιος
  choice: నిత్యజీవం
  rationale: యోహాను రచనల్లో స్థిరంగా కనిపించే భావగర్భిత పదబంధానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: ἃ
  choice: చెప్పేవాటిని
  rationale: నపుంసక బహువచన సంబంధ సర్వనామాన్ని తెలుగు వాక్యనిర్మాణానికి సహజంగా మారుస్తూ, యేసు పలికే విషయాలనే సూచిస్తుంది.
- source_word: λαλῶ
  choice: చెబుతున్నాను
  rationale: గ్రీకులోని రెండు ప్రయోగాల పునరుక్తిని తెలుగులోనూ ఒకే క్రియతో నిలుపుతుంది.
- source_word: καθὼς
  choice: ప్రకారమే
  rationale: తండ్రి చెప్పిన దానికీ యేసు పలికే దానికీ ఉన్న ఖచ్చితమైన అనురూపతను తెలియజేస్తుంది.
- source_word: εἴρηκέν μοι
  choice: నాకు చెప్పిన
  rationale: పూర్ణకాల క్రియ సూచించే, గతంలో పలికిన మాటకు కొనసాగుతున్న ప్రాముఖ్యతను సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ πατήρ
  choice: తండ్రి
  rationale: గ్రీకు పాఠంలోని సంబంధపూర్వక బిరుదును ‘నా’ అనే పదాన్ని చేర్చకుండా నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందరి వాక్యం నుంచి వచ్చే తార్కిక నిర్ధారణను స్పష్టంగా చూపుతుంది.
- source_word: οἶδα
  choice: నాకు తెలుసు
  rationale: నిశ్చయపూర్వకమైన జ్ఞానాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ఆయన ఆజ్ఞ నిత్యజీవం’ అనే సమీకరణ భావం
  choice: మూలంలోని ప్రత్యక్ష సమీకరణను ‘ఆయన ఆజ్ఞ నిత్యజీవం’గా నిలుపడం
  alternative: ఆయన ఆజ్ఞ నిత్యజీవానికి నడిపిస్తుంది; ఆయన ఆజ్ఞ నిత్యజీవానికి సంబంధించినది
  rationale: గ్రీకులో ‘అది నిత్యజీవం’ అనే ప్రత్యక్ష సమీకరణ ఉంది. దాని ఖచ్చిత సంబంధాన్ని ఫలితం లేదా విషయంగా ముందుగానే నిర్ణయించకుండా, అసలు వాక్యంలోని దైవశాస్త్ర సంబంధ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ‘చెప్పడం’ అనే క్రియ పునరుక్తిని నిలిపి, ‘తండ్రి’ అనే బిరుదుకు మూలంలో లేని ‘నా’ను చేర్చలేదు.
