id: JHN.12.39
reference: John 12:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὐκ ἠδύναντο πιστεύειν ὅτι πάλιν εἶπεν Ἠσαΐας·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/039.yaml
  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: te
  text: 'ఈ కారణంగా వారు నమ్మలేకపోయారు; ఎందుకంటే యెషయా మళ్లీ ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ఈ కారణంగా
  rationale: διά + accusative ఇక్కడ ముందున్న సందర్భంతో స్పష్టమైన కారణసంబంధాన్ని తెలియజేస్తుంది; ‘ఈ కారణంగా’ దానిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὐκ ἠδύναντο
  choice: నమ్మలేకపోయారు
  rationale: δύναμαι యొక్క అపూర్ణ భూతకాల రూపం అసమర్థతను సూచిస్తుంది. తెలుగు సమాస క్రియ ఈ భావాన్ని సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది; దానిని కేవలం ఇష్టలేమిగా మార్చదు.
- source_word: πιστεύειν
  choice: నమ్మ
  rationale: యోహాను రచనలో πιστεύωకు సందర్భానుకూలమైన సాధారణ తెలుగు పదం ‘నమ్ము’; ఇక్కడ క్రియాసమాసంలో ‘నమ్మలేకపోయారు’గా వచ్చింది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఇక్కడ ὅτι తరువాత వచ్చే యెషయా ఉల్లేఖనాన్ని వారి నమ్మలేకపోవడానికి కారణంగా పరిచయం చేస్తుంది; ‘ఎందుకంటే’ ఆ కారణార్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ముందటి యెషయా ఉల్లేఖనానికి అదనంగా మరొక ఉల్లేఖనం వస్తున్నదని సూచిస్తుంది.
- source_word: εἶπεν
  choice: ఇలా అన్నాడు
  rationale: ఉల్లేఖనాన్ని పరిచయం చేసే λέγωకు ‘అన్నాడు’ సహజమైన తెలుగు; తరువాతి ప్రత్యక్ష వాక్యాన్ని సూచించడానికి ‘ఇలా’ చేర్చడం తెలుగు శైలికి అనుకూలం.
- source_word: Ἠσαΐας
  choice: యెషయా
  rationale: ప్రవక్త పేరుకు తెలుగులో విస్తృతంగా స్థిరపడిన రూపాన్ని ఉపయోగించాం.
theological_decisions:
- issue: నమ్మడానికి చెప్పబడిన అసమర్థత స్వభావం
  choice: ‘నమ్మలేకపోయారు’ అని అసమర్థతను నేరుగా నిలుపడం
  alternative: ‘నమ్మడానికి ఇష్టపడలేదు’ లేదా ‘నమ్మలేదు’ అని కేవలం నిరాకరణ/ఇష్టలేమిగా మృదుపరచడం
  rationale: గ్రీకు పాఠం అసమర్థతను చెబుతుంది; అయితే ఆ అసమర్థత ఎలా పనిచేస్తుందో నిర్దిష్ట సిద్ధాంత వర్గాల ద్వారా ఈ వచనంలోనే వివరించదు. కాబట్టి దైవిక కఠినపరచడం మరియు మానవ బాధ్యత మధ్యనున్న ఉద్వేగాన్ని అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
- issue: ὅτι యొక్క సంబంధం
  choice: కారణార్థకంగా ‘ఎందుకంటే’
  alternative: ఉల్లేఖన విషయాన్ని మాత్రమే పరిచయం చేసే ‘అని’
  rationale: ఈ సందర్భంలో ὅτι వారి నమ్మలేకపోవడానికి తరువాతి యెషయా వాక్యాన్ని కారణంగా చూపుతున్నట్లు సహజంగా చదవబడుతుంది; అయినా దాని వివరణను అదనపు పదాలతో విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘ఈ కారణంగా’ ముందరి సందర్భంతో సంబంధాన్ని స్పష్టం చేస్తుంది; ‘నమ్మలేకపోయారు’ గ్రీకు అసమర్థత భావాన్ని సంక్షిప్తంగా నిలుపుతుంది. తదుపరి వచనంలోని ఉల్లేఖనానికి దారి చూపేందుకు చివర ద్విబిందువు వాడబడింది.
