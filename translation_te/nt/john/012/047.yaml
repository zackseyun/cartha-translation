id: JHN.12.47
reference: John 12:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: te
  text: ఎవరైనా నా మాటలు విని వాటిని పాటించకపోతే, నేను అతనికి[a] తీర్పు తీర్చను[b]. ఎందుకంటే లోకానికి తీర్పు తీర్చడానికి నేను రాలేదు, కానీ లోకాన్ని రక్షించడానికి వచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘అతనికి’ అనే ఏకవచన పురుషలింగ పదం సాధారణ భావంలో వాడబడింది; యేసు మాటలు విని వాటిని పాటించని ఎవరైనా దీనిలో చేరుతారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నేను అతన్ని దోషిగా తీర్చను.’ గ్రీకు క్రియకు ‘తీర్పు తీర్చు’ అనే అర్థం ఉంది; సందర్భంలో అది ప్రతికూలమైన తీర్పు లేదా దోషనిర్ణయం అనే భావాన్ని కూడా ఇవ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τίς
  choice: ఎవరైనా … అయితే
  rationale: అనిర్దిష్ట షరతును, ఎవరికైనా వర్తించే సాధారణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀκούσῃ
  choice: విని
  rationale: మూలంలోని సాధారణ ‘విను’ భావాన్ని నిలుపుతుంది; శ్రద్ధగా ఆలకించడం అనే అదనపు భావాన్ని చేర్చదు.
- source_word: τῶν ῥημάτων
  choice: నా మాటలు
  rationale: యేసు పలికిన మాటలను సహజంగా, గౌరవప్రదంగా సూచిస్తుంది.
- source_word: φυλάξῃ
  choice: వాటిని పాటించకపోతే
  rationale: φυλάσσω ఇక్కడ మాటలను విధేయతతో గైకొనడం/ఆచరించడం అనే భావాన్ని కలిగి ఉంది. ‘పాటించు’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం భద్రపరచడం అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: οὐ κρίνω αὐτόν
  choice: నేను అతనికి తీర్పు తీర్చను
  rationale: κρίνωను ‘తీర్పు తీర్చు’గా ఉంచడం వల్ల ఇదే వాక్యంలో ఉన్న పునరుక్తి, అలాగే యోహాను సువార్తలోని తీర్పుకు సంబంధించిన భావ ఉద్రిక్తత నిలుస్తాయి. ‘దోషిగా తీర్చు’ అనేది సందర్భానుగుణమైన ప్రత్యామ్నాయం గనుక పాదసూచికలో ఇచ్చాం.
- source_word: ἦλθον
  choice: నేను రాలేదు … వచ్చాను
  rationale: యేసు రాకను, ఆయన కార్యలక్ష్యాన్ని సంక్షిప్తంగా తెలిపే గ్రీకు భూతకాలాన్ని తెలుగులో సహజమైన భూతకాలంతో అందిస్తుంది; రెండవ ఉద్దేశ్య వాక్యంలో సహజ తెలుగు కోసం ‘వచ్చాను’ను స్పష్టంగా పూరించింది.
- source_word: ἵνα κρίνω
  choice: తీర్పు తీర్చడానికి
  rationale: ἵνα తెలిపే ఉద్దేశ్య భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κόσμον
  choice: లోకం
  rationale: యోహాను వాడుకలో మానవ లోకాన్ని విస్తృతంగా సూచించే ప్రామాణిక బైబిలు పదం; మూలం అనుమతించని సంకుచిత అర్థాన్ని చేర్చదు.
- source_word: σώσω
  choice: రక్షించడానికి
  rationale: σῴζω యొక్క రక్షణాత్మక, దైవశాస్త్రీయ భావాన్ని స్థిరంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘నేను అతనికి తీర్పు తీర్చను’ అనే మాటకు యోహాను సువార్తలోని ఇతర తీర్పు వాక్యాలతో ఉన్న సంబంధం
  choice: κρίνωను రెండు చోట్లా ‘తీర్పు తీర్చు’గా అనువదించి, కాలపరమైన లేదా కార్యపరమైన వివరణను పాఠ్యంలో చేర్చలేదు.
  alternative: ‘దోషిగా తీర్చను’ లేదా ‘ఇప్పుడు తీర్పు తీర్చను’ అని స్పష్టీకరించడం.
  rationale: ఈ వాక్యం యేసు రాక యొక్క ప్రధాన ఉద్దేశ్యం తీర్పు కాక రక్షణ అని చెబుతుంది. ‘తీర్పు తీర్చు’ అనే అనువాదం మూల పద పునరుక్తిని, ఇతర యోహాను వాక్యాలతో ఉన్న నిజమైన దైవశాస్త్రీయ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: τιςను అనుసరించే ఏకవచన పురుషలింగ αὐτόν యొక్క సాధారణ వర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘అతనికి’ అని ఉంచి, అది ఎవరినైనా సూచించే సాధారణ ప్రయోగమని పాదసూచికలో తెలిపాం.
  alternative: ‘ఆ వ్యక్తికి’ అని లింగనిరపేక్షంగా అనువదించడం.
  rationale: గ్రీకు రూపంలోని ఏకవచన పురుషలింగాన్ని కాపాడుతూ, వాక్యం పురుషులకు మాత్రమే పరిమితం కాదని పాఠకునికి స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘పాటించు,’ ‘తీర్పు తీర్చు,’ ‘రక్షించు’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఎంచుకుని, మూలంలోని షరతు, ఉద్దేశ్య వ్యత్యాసం, పద పునరుక్తి నిలుపబడ్డాయి.
