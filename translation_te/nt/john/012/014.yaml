  edition: SBLGNT
  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: te
  text: 'అప్పుడు యేసు ఒక చిన్న గాడిదను[a] కనుగొని దానిమీద కూర్చున్నాడు; వ్రాయబడి ఉన్న ప్రకారమే:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గాడిద పిల్ల.” గ్రీకు ὀνάριον గాడిదను సూచిస్తుంది; తరచుగా చిన్న వయస్సుగల గాడిదను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν
  choice: కనుగొని
  rationale: భూతకాల క్రియావిశేషణ రూపం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది; తెలుగులో ‘కనుగొని’ ఆ క్రమాన్ని సహజంగా నిలుపుతుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ ఇది బలమైన వ్యతిరేకతను కాకుండా కథనాన్ని ముందుకు నడిపించే సున్నితమైన అనుసంధానాన్ని సూచిస్తుంది.
- source_word: ὀνάριον
  choice: ఒక చిన్న గాడిదను
  rationale: ఇది గాడిదను సూచించే అల్పార్థక రూపం; చిన్నదైన లేదా సాధారణంగా చిన్న వయస్సుగల గాడిద భావాన్ని ‘చిన్న గాడిద’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: దానిమీద కూర్చున్నాడు
  rationale: గ్రీకు పదబంధంలోని సూటి అర్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘ఎక్కాడు’ అని అనువదిస్తే భావవ్యాఖ్యానం కొద్దిగా పెరుగుతుంది.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: ఇలా వ్రాయబడి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే సూత్రప్రాయ పదబంధానికి ఇది సహజమైన తెలుగు రూపం; వెంట వచ్చే వాక్యం యేసు చర్యకు అనుగుణంగా ఉందనే సంబంధాన్ని సందర్భం తెలియజేస్తుంది.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: గ్రీకు కథనశైలిలో వ్యక్తిపేరుతో వచ్చే నిర్దేశక పదాన్ని తెలుగులో విడిగా అనువదించనవసరం లేదు.
theological_decisions:
- issue: యేసు చర్యకు లేఖన ఉల్లేఖనంతో ఉన్న సంబంధం
  choice: యేసు గాడిదను కనుగొని దానిమీద కూర్చున్న చర్యను తెలిపి, ఆ తరువాత లేఖన ఉల్లేఖనాన్ని పరిచయం చేయడం
  alternative: యేసు ప్రవచనాన్ని ఉద్దేశపూర్వకంగా నెరవేర్చడానికి ఇలా చేశాడని అనువాదంలోనే స్పష్టంగా చేర్చడం
  rationale: ఈ వచనం చర్యకు లేఖనంతో ఉన్న అనురూపతను చూపుతుంది; అయితే యేసు ఉద్దేశాన్ని ఇక్కడ ప్రత్యక్షంగా వివరించదు. అందువల్ల మూలంలోని నియంత్రిత వ్యాఖ్యానాన్నే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథనశైలి. మూలపాఠంలోని క్రియాక్రమం మరియు లేఖన ఉల్లేఖన పరిచయం సహజంగా నిలుపబడ్డాయి.
