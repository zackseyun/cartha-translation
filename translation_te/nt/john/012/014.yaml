    rationale: καθώς ἐστιν γεγραμμένον means “just/as it is written,” linking the narrated action with the wording of the forthcoming citation. “వ్రాయబడి ఉన్న ప్రకారమే” retains this relation without implying Jesus' motive.
  - severity: low
    issue: The draft lacks the lexical footnote anchor supplied in the English audit trail for ὀνάριον.
    rationale: 'Adding the anchor and note preserves the stated lexical ambiguity: the term denotes a donkey and often, but not invariably, a young one.'
