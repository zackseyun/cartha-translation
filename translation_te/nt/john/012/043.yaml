source:
  edition: SBLGNT
  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: te
  text: ఎందుకంటే వారు దేవుని మహిమకంటే మనుషుల మహిమనే ఎక్కువగా ప్రేమించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని మెప్పుకంటే మనుషుల మెప్పును.’
    reason: δόξα ఇక్కడ ‘మెప్పు’ లేదా ‘ప్రశంస’ అనే భావాన్ని కూడా సూచించవచ్చు; అయితే ప్రధాన పాఠంలోని ‘మహిమ’ మూలంలోని పునరుక్తి, విస్తృత భావాన్ని కాపాడుతుంది.
lexical_decisions:
- source_word: ἠγάπησαν
  choice: ప్రేమించారు
  rationale: ἀγαπάω అనే బలమైన సంకల్పపూర్వక అనురాగాన్ని నేరుగా వ్యక్తపరుస్తుంది; μᾶλλον ἤπερ వల్ల ప్రాధాన్యత భావం సందర్భంలో స్పష్టమవుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని తెలిపే γάρ యొక్క వివరణాత్మక-కారణ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది.
- source_word: δόξαν
  choice: మహిమ
  rationale: రెండుసార్లు వచ్చిన δόξαకు ఒకే పదాన్ని వాడి మూలంలోని సమాంతరతను, యోహాను రచనలోని విస్తృత భావసంబంధాన్ని కాపాడుతుంది; ‘మెప్పు’, ‘ప్రశంస’, ‘గౌరవం’ కంటే ఇది అర్థాన్ని తక్కువగా కుదిస్తుంది.
- source_word: τῶν ἀνθρώπων
  choice: మనుషుల
  rationale: ἄνθρωποι ఇక్కడ స్త్రీపురుషులందరినీ సూచిస్తుంది. ‘మనుషుల’ అనే రూపం లింగసమగ్రంగా ఉండి, గ్రీకు షష్ఠీ విభక్తి నిర్మాణాన్ని కూడా నిలుపుతుంది.
- source_word: μᾶλλον ἤπερ
  choice: కంటే … ఎక్కువగా
  rationale: రెండు విషయాల మధ్య ప్రాధాన్యతను సూచించే గ్రీకు తులనాత్మక నిర్మాణాన్ని సహజమైన తెలుగు క్రమంలో తెలియజేస్తుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: ‘మనుషుల మహిమ’తో సమాంతరమైన షష్ఠీ విభక్తి నిర్మాణాన్ని నిలుపుతూ, మహిమ దేవునికి చెందినదా లేక దేవుని నుండి వచ్చేదా అనే మూలంలోని స్వల్ప సందిగ్ధతను పరిష్కరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: మానవులు/దేవుడు అనే వ్యత్యాసంలో δόξα అర్థం
  choice: మహిమ
  alternative: మెప్పు / ప్రశంస / గౌరవం
  rationale: ‘మహిమ’ మూలపదపు విస్తృత అర్థాన్ని, పునరుక్తిని, యోహాను సువార్తలోని తాత్త్విక ప్రతిధ్వనిని కాపాడుతుంది. ‘మెప్పు’ సందర్భోచితమైనదే అయినా అర్థాన్ని మరింత నిర్దిష్టంగా కుదిస్తుంది.
- issue: δόξαతో షష్ఠీ విభక్తి సంబంధం
  choice: మనుషుల మహిమ / దేవుని మహిమ
  alternative: మనుషుల నుండి వచ్చే మహిమ / దేవుని నుండి వచ్చే మహిమ
  rationale: సంబంధం స్వామ్యమా, మూలమా అనే గ్రీకు నిర్మాణంలోని భావవిస్తృతిని తెలుగు షష్ఠీ రూపం నిలుపుతుంది; ‘నుండి వచ్చే’ అని చేర్చడం ఒకే వ్యాఖ్యానాన్ని స్థిరపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘మనుషులు’ లింగసమగ్ర పదం. మూలంలోని δόξα పునరుక్తి మరియు షష్ఠీ విభక్తి సందిగ్ధత ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
