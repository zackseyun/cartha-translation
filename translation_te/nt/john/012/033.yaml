  source_fidelity: 'ముసాయిదా మూలార్థాన్ని మొత్తంగా సరిగానే ఇస్తోంది: యేసు మాటలు ఆయన పొందబోయే మరణపు రకాన్ని/విధానాన్ని సూచించాయని తెలియజేస్తుంది. అయితే ‘ఇలా’ కంటే ‘ఈ మాట’ τοῦτοకు మరింత స్పష్టమైన సూచన; ‘చెప్పాడు’ స్థానంలో ‘చెబుతున్నాడు’ అనడం ἔλεγεν యొక్క అసంపూర్ణ భూతకాల దృక్కోణాన్ని సహజంగా కాపాడుతుంది.'
