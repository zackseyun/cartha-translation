translation:
  language: te
  text: తాను ఎలాంటి మరణం పొందబోతున్నాడో సూచిస్తూ ఆయన ఈ మాట చెబుతున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఏ విధమైన మరణం ద్వారా.’ గ్రీకు ప్రయోగం మరణ విధానాన్ని నొక్కిచెప్పగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ఇలా
  rationale: నపుంసక ఏకవచన సూచనార్థక పదం యేసు ఇంతకుముందు చెప్పిన మాటను సూచిస్తుంది; తెలుగులో ‘ఇలా చెప్పాడు’ సహజంగా ఆ సూచనను అందిస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప అనుసంధానాన్ని లేదా కథన మార్పును సూచిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘అయితే’ అని చేరిస్తే అవసరానికి మించిన వ్యతిరేక భావం కలగవచ్చు.
- source_word: ἔλεγεν
  choice: చెప్పాడు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల రూపానికి సందర్భంలో వివరణాత్మక కథన ప్రయోగం ఉంది. తెలుగు సహజ శైలిలో ‘చెప్పాడు’ సరిపోతుంది; ‘చెబుతూ ఉండేవాడు’ అనడం అనవసరమైన కొనసాగింపు భావాన్ని పెంచుతుంది.
- source_word: σημαίνων
  choice: సూచిస్తూ
  rationale: ఈ వర్తమాన కృదంతం ఆయన మాట ఏ విషయాన్ని సంకేతపరుస్తోందో తెలుపుతుంది; ‘సూచిస్తూ’ యోహాను వాడుకలోని పరోక్షంగా తెలియజేయడం అనే భావాన్ని నిలుపుతుంది.
- source_word: ποίῳ θανάτῳ
  choice: ఎలాంటి మరణం
  rationale: ఈ దత్తివిభక్తి ప్రయోగం కేవలం మరణ వాస్తవాన్ని కాక దాని విధానాన్ని లేదా రకాన్ని సూచిస్తుంది. ‘ఎలాంటి మరణం’ సహజమైనది, మూలంలోని కొంత విస్తృతతను కాపాడుతుంది.
- source_word: ἤμελλεν
  choice: పొందబోతున్నాడో
  rationale: μέλλω సమీప లేదా నిరీక్షిత భవిష్యత్తును సూచిస్తుంది. ‘బోతున్నాడు’ ఆ భావాన్ని బలవంతమైన విధినిర్ణయంగా మార్చకుండా తెలుపుతుంది.
- source_word: ἀποθνῄσκειν
  choice: మరణం పొంద
  rationale: ‘చనిపోవడం’ కంటే ‘మరణం పొందడం’ గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు; పోίῳ θανάτῳతో సహజంగా జతకడుతుంది.
theological_decisions:
- issue: ఈ వచనంలో సిలువ మరణాన్ని స్పష్టంగా పేర్కొనాలా
  choice: ‘ఎలాంటి మరణం పొందబోతున్నాడో’ అనే పరోక్ష వాక్యాన్ని నిలుపుట
  alternative: ‘సిలువపై ఎలా మరణించబోతున్నాడో’ లేదా ‘ఎలా మరణశిక్ష పొందబోతున్నాడో’
  rationale: సందర్భం సిలువ మరణాన్ని సూచించినా, ఈ వచనం దానిని పేరుపెట్టి చెప్పదు. మూలంలోని పరోక్షతను నిలుపుతూ సందర్భం చేసే వివరణను ప్రధాన పాఠ్యంలో ముందుగానే చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన తెలుగు. ప్రధాన పాఠ్యంలో [a] గుర్తు చేర్చబడింది; సిలువను ప్రత్యక్షంగా చేర్చకుండా మూలంలోని పరోక్షత కాపాడబడింది.
