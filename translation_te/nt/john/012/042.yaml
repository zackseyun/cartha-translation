id: JHN.12.42
reference: John 12:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅμως μέντοι καὶ ἐκ τῶν ἀρχόντων πολλοὶ ἐπίστευσαν εἰς αὐτόν, ἀλλὰ διὰ τοὺς Φαρισαίους οὐχ ὡμολόγουν ἵνα μὴ ἀποσυνάγωγοι γένωνται,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
translation:
  language: te
  text: అయినప్పటికీ, అధికారులలో కూడా అనేకులు ఆయనను విశ్వసించారు. కానీ పరిసయ్యుల కారణంగా, సమాజమందిరం నుండి వెలివేయబడకూడదనే ఉద్దేశంతో[a] వారు ఆయనను బహిరంగంగా ఒప్పుకోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సమాజమందిరం నుండి బయటకు పంపబడకూడదనే ఉద్దేశంతో,” “సమాజమందిరం నుండి బహిష్కరించబడకూడదనే ఉద్దేశంతో.” గ్రీకు పదం సమాజమందిర సముదాయం నుండి వెలివేయబడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  choice: అయినప్పటికీ
  rationale: ఈ జంట అవ్యయాల్లోని బలమైన రాయితీ-వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: అధికారులలో కూడా అనేకులు
  rationale: ἐκ సమూహంలో సభ్యత్వాన్ని సూచిస్తుంది; ἄρχοντες ఇక్కడ పాలకులకన్నా నాయకత్వ స్థానాల్లో ఉన్న అధికారులను సూచిస్తుంది.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: ఆయనను విశ్వసించారు
  rationale: యోహాను రచనలో ఈ నిర్మాణం యేసు వైపు మళ్లిన వ్యక్తిగత విశ్వాసాన్ని సూచిస్తుంది; తెలుగులో ఇది సహజమైన, తటస్థమైన రూపం.
- source_word: διὰ τοὺς Φαρισαίους
  choice: పరిసయ్యుల కారణంగా
  rationale: διά + ద్వితీయా విభక్తి కారణాన్ని సూచిస్తుంది. భయం సందర్భంలో అంతర్లీనంగా ఉన్నా గ్రీకు పదబంధంలో ప్రత్యక్షంగా లేదు.
- source_word: οὐχ ὡμολόγουν
  choice: వారు బహిరంగంగా ఒప్పుకోలేదు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా అలవాటైన నిరాకరణను సూచిస్తుంది. గ్రీకులో కర్మ ప్రత్యక్షంగా లేకపోవడంతో తెలుగులోనూ దానిని నిర్దిష్టంగా చేర్చలేదు; సందర్భం వారు తమ విశ్వాసాన్ని బహిరంగంగా అంగీకరించలేదని తెలియజేస్తుంది.
- source_word: ἵνα μὴ
  choice: వెలివేయబడకూడదని
  rationale: అవాంఛిత పరిణామాన్ని తప్పించుకోవాలనే ఉద్దేశాన్ని సహజమైన తెలుగు ప్రయోజనార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ἀποσυνάγωγοι γένωνται
  choice: సమాజమందిరం నుండి వెలివేయబడకూడదని
  rationale: ఈ పదం సమాజమందిర ఆరాధనతో పాటు దాని సామాజిక-మత సముదాయం నుండి తొలగింపును సూచిస్తుంది; ప్రధాన పాఠ్యంలో సరళమైన రూపాన్ని, పాదసూచికలో విస్తృత భావాన్ని ఇచ్చాం.
theological_decisions:
- issue: యోహాను ధర్మశాస్త్ర దృష్టిలో అధికారుల విశ్వాస స్వభావం
  choice: ἐπίστευσανను ఎటువంటి తగ్గింపు లేదా బలపరచడం లేకుండా ‘విశ్వసించారు’ అని అనువదించడం
  alternative: ‘పైపైకి నమ్మారు’ లేదా ‘రక్షణ కలిగించే నిజమైన విశ్వాసానికి వచ్చారు’ అని స్పష్టీకరించడం
  rationale: వారు ఆయనను విశ్వసించారని వాక్యం చెబుతూనే, బహిరంగంగా ఒప్పుకోలేదని కూడా చెబుతుంది. వారి విశ్వాసం యొక్క అంతిమ ఆధ్యాత్మిక స్థితిని నిర్ణయించకుండా ఈ ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘సమాజమందిరం’ అనే స్థిర బైబిలు పదాన్ని ఉంచి, దాని సముదాయార్థాన్ని పాదసూచికలో వివరించాం. గ్రీకులో లేని కర్మను ‘ఒప్పుకోలేదు’ వద్ద నిర్బంధంగా చేర్చలేదు.
