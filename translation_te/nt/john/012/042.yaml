    text: లేదా “సమాజమందిరం నుండి బయటకు పంపబడకూడదనే ఉద్దేశంతో,” “సమాజమందిరం నుండి బహిష్కరించబడకూడదనే ఉద్దేశంతో.” గ్రీకు పదం సమాజమందిర సముదాయం నుండి వెలివేయబడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
