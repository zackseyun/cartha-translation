  text: τοσαῦτα δὲ αὐτοῦ σημεῖα πεποιηκότος ἔμπροσθεν αὐτῶν οὐκ ἐπίστευον εἰς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/037.yaml
  text: Although he had done so many signs before them[a], they did not believe in him[b],
translation:
  language: te
  text: ఆయన వారి ఎదుట ఎన్నో సూచక కార్యాలు చేసినప్పటికీ, వారు ఆయనను విశ్వసించలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విశ్వసించలేదు’ అని అనువదించిన గ్రీకు క్రియ imperfect కాలంలో ఉంది; అది కొనసాగుతున్న లేదా పునరావృతమవుతున్న అవిశ్వాసాన్ని సూచించవచ్చు.
    reason: గ్రీకు క్రియారూపంలోని కొనసాగుతున్న లేదా పునరావృత aspect భావాన్ని సహజమైన తెలుగు ప్రధాన పాఠ్యంతో పాటు తెలియజేయడం.
lexical_decisions:
- source_word: τοσαῦτα
  choice: ఇన్ని
  rationale: ఇక్కడ ఈ పదం సూచక క్రియల అధిక సంఖ్యను నొక్కిచెబుతుంది; ‘ఇన్ని’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: δὲ
  choice: చేసినప్పటికీ
  rationale: δέ సూచించే వ్యతిరేక భావాన్ని తెలుగులో విడిగా ‘అయితే’ అని చేర్చకుండా, concessive నిర్మాణమైన ‘చేసినప్పటికీ’లో సహజంగా వ్యక్తం చేశాం.
- source_word: σημεῖα
  choice: సూచక క్రియలు
  rationale: యోహాను సువార్తలో ఈ పదం కార్యం యొక్క అద్భుత స్వభావంతోపాటు అది సూచించే వెల్లడిని కూడా తెలియజేస్తుంది; ‘అద్భుతాలు’ కంటే ‘సూచక క్రియలు’ ఆ భావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: πεποιηκότος
  choice: చేసినప్పటికీ
  rationale: పూర్తయిన ముందరి కార్యాలకు ప్రస్తుత సందర్భంలో కొనసాగుతున్న ప్రాముఖ్యత ఉందని perfect participle సూచిస్తుంది; సందర్భం కోరే concessive భావాన్ని కూడా ఈ రూపం అందిస్తుంది.
- source_word: ἔμπροσθεν αὐτῶν
  choice: వారి ఎదుట
  rationale: ఆ కార్యాలు వారికి కనిపించేలా, వారి సమక్షంలో జరిగాయని సంక్షిప్తంగా మరియు సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ ἐπίστευον
  choice: విశ్వసించలేదు
  rationale: తెలుగులో సహజమైన భూతకాల రూపం; గ్రీకు imperfect సూచించగల కొనసాగుతున్న లేదా పునరావృత అవిశ్వాస భావాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: εἰς αὐτόν
  choice: ఆయనను విశ్వసించలేదు
  rationale: πιστεύω + εἰς అనే యోహానీయ నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తిపట్ల విశ్వాసాన్ని సూచించే ‘ఆయనను విశ్వసించడం’గా అనువదించాం.
theological_decisions:
- issue: గ్రీకు imperfect క్రియలోని అవిశ్వాస భావం
  choice: వారు ఆయనను విశ్వసించలేదు
  alternative: వారు ఆయనను విశ్వసిస్తూ ఉండలేదు
  rationale: ప్రధాన పాఠ్యంలో సహజమైన ఆధునిక తెలుగు వాడుతూ, ఆ అవిశ్వాసం కొనసాగుతూ లేదా పునరావృతమవుతూ ఉండవచ్చనే గ్రీకు కాలరూపపు భావాన్ని పాదటిప్పణిలో తెలిపాం; ఉద్దేశపూర్వక నిరాకరణ అనే మరింత బలమైన భావాన్ని పాఠ్యంలోకి దిగుమతి చేయలేదు.
- issue: δέ మరియు genitive absolute కలిగించే వ్యతిరేకత
  choice: చేసినప్పటికీ
  alternative: అయితే, ఆయన ... చేసినా
  rationale: అనేక బహిరంగ సూచక క్రియలు జరిగినా అవిశ్వాసం కొనసాగిందనే ఉద్రిక్తతను ఒక సహజమైన concessive నిర్మాణంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘సూచక క్రియలు’ అనే పదబంధం యోహాను సువార్తలో σημεῖα పదానికి ఉన్న వెల్లడిపరమైన ప్రాముఖ్యతను నిలుపుతుంది. ‘వారి ఎదుట’ మూలంలోని బహిరంగ ప్రత్యక్షతను అతిశయోక్తి లేకుండా తెలియజేస్తుంది.
