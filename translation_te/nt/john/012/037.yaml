revisions:
- from: ఆయన వారి ఎదుట ఇన్ని సూచక క్రియలు చేసినప్పటికీ,[a] వారు ఆయనను విశ్వసించలేదు.[b]
  to: ఆయన వారి ఎదుట ఎన్నో సూచక కార్యాలు చేసినప్పటికీ, వారు ఆయనను విశ్వసించలేదు.[a]
  rationale: The revision replaces a less idiomatic quantitative expression and a technical calque with natural modern Telugu while preserving the source’s emphasis on many publicly performed Johannine signs. The incomplete δέ footnote is removed; the concessive ‘చేసినప్పటికీ’ already expresses the contrast naturally. The imperfect-related note is retained and re-anchored to the verb it explains.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:30:01Z'
review_pass:
  verdict: revise
  source_fidelity: The concessive rendering accurately conveys the genitive absolute (πεποιηκότος) in context, and ‘వారి ఎదుట’ faithfully represents ἔμπροσθεν αὐτῶν. The main clause correctly expresses their unbelief toward Jesus. However, ‘ఇన్ని’ is less idiomatic here than the emphatic quantitative ‘ఎన్నో’ for τοσαῦτα, and ‘సూచక క్రియలు’ is an overly technical calque for σημεῖα.
  naturalness: ‘ఎన్నో సూచక కార్యాలు’ is clearer and more natural in modern standard Telugu than ‘ఇన్ని సూచక క్రియలు,’ while retaining John’s meaningful ‘signs’ terminology. The sentence remains concise and suitably dignified.
  terminology: ‘సూచక కార్యాలు’ preserves the Johannine theological value of σημεῖα better than simply ‘అద్భుతాలు,’ without the unnatural technical sound of ‘సూచక క్రియలు.’ ‘ఆయనను విశ్వసించలేదు’ is acceptable modern Telugu for πιστεύω εἰς αὐτόν.
  issues:
  - severity: low
    issue: ‘ఇన్ని’ for τοσαῦτα
    rationale: In this context τοσαῦτα emphasizes the strikingly large number of signs. ‘ఎన్నో’ is the natural Telugu expression for ‘so many.’
  - severity: medium
    issue: ‘సూచక క్రియలు’ is awkward terminology
    rationale: This phrase is a close formal calque and does not read naturally in modern standard Telugu. ‘సూచక కార్యాలు’ communicates deeds that function as signs and preserves the Johannine nuance.
  - severity: low
    issue: Footnote a offers an incomplete alternative sentence
    rationale: The quoted alternative ends with the concessive subordinate clause and does not supply the main clause. Since the concessive construction already adequately carries the contextual contrast, this footnote is unnecessary.
  revised_text: ఆయన వారి ఎదుట ఎన్నో సూచక కార్యాలు చేసినప్పటికీ, వారు ఆయనను విశ్వసించలేదు.[a]
  revised_footnotes:
