    text: ‘విశ్వసించలేదు’ అని అనువదించిన గ్రీకు క్రియ imperfect కాలంలో ఉంది; అది కొనసాగుతున్న లేదా పునరావృతమవుతున్న అవిశ్వాసాన్ని సూచించవచ్చు.
    reason: గ్రీకు క్రియారూపంలోని కొనసాగుతున్న లేదా పునరావృత aspect భావాన్ని సహజమైన తెలుగు ప్రధాన పాఠ్యంతో పాటు తెలియజేయడం.
