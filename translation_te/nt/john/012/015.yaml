id: JHN.12.15
reference: John 12:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, θυγάτηρ Σιών· ἰδοὺ ὁ βασιλεύς σου ἔρχεται, καθήμενος ἐπὶ πῶλον ὄνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: te
  text: “సీయోను కుమార్తె[a], భయపడకు. ఇదిగో, నీ రాజు గాడిదపిల్లపై కూర్చొని వస్తున్నాడు.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సీయోను కుమార్తె’ అనేది సీయోను/యెరూషలేమును కుమార్తెగా వ్యక్తీకరించే ప్రవచనాత్మక సంబోధన.
    reason: cultural_note
  - marker: b
    text: ఈ మాటలు జెకర్యా 9:9ను ప్రతిధ్వనింపజేస్తూ, యేసును సీయోనుకు వాగ్దానం చేయబడిన రాజుగా చూపిస్తున్నాయి.
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: భయపడకు
  rationale: μήతో కూడిన φοβέομαι ఆజ్ఞారూపం భయాన్ని నిషేధిస్తుంది. ‘భయపడకు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం; మూలంలోని ప్రత్యక్ష ఆజ్ఞను నిలుపుతుంది.
- source_word: θυγάτηρ Σιών
  choice: సీయోను కుమారీ
  rationale: κλητική భావంలోని θυγάτηρ మరియు Σιώνను ప్రవచనాత్మక వ్యక్తీకరణగా ఉంచుతుంది. ‘కుమారీ’ సంబోధనను స్పష్టంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే సూచక అవ్యయానికి ‘ఇదిగో’ సహజమైన, గంభీరమైన తెలుగు సమానార్థకం.
- source_word: ὁ βασιλεύς σου
  choice: నీ రాజు
  rationale: నిర్దిష్ట నామవాచకం మరియు స్వామ్య సర్వనామాన్ని నేరుగా ప్రతిబింబిస్తుంది. తెలుగులో ప్రత్యేక పెద్ద అక్షర భేదం లేనందున సందర్భమే మెస్సీయ రాజత్వాన్ని సూచిస్తుంది.
- source_word: ἔρχεται
  choice: వస్తున్నాడు
  rationale: వర్తమాన కాలంలోని సజీవమైన, కొనసాగుతున్న రాక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: καθήμενος
  choice: కూర్చొని
  rationale: ఆయన ఎలా వస్తున్నాడో తెలిపే వర్తమాన కృదంత భావాన్ని కాపాడుతుంది; ‘స్వారీ చేస్తూ’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని భావం చేరుతుంది.
- source_word: ἐπὶ πῶλον ὄνου
  choice: గాడిద పిల్లపై
  rationale: πῶλος అనే చిన్న జంతువు/పిల్ల భావాన్నీ, ὄνος ద్వారా అది గాడిద పిల్ల అన్న నిర్దిష్టతనూ సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: జెకర్యా 9:9తో ఉన్న మెస్సీయ సంబంధమైన ప్రతిధ్వని
  choice: ‘సీయోను కుమారీ’ మరియు ‘నీ రాజు’ అనే ప్రవచనాత్మక పదప్రయోగాలను ప్రధాన పాఠ్యంలో అలాగే ఉంచడం
  alternative: సీయోనును యెరూషలేముగా వివరించడం లేదా యేసే వాగ్దానం చేయబడిన రాజు అని ప్రధాన పాఠ్యంలో విస్తరించడం
  rationale: మూలపాఠ్యం ప్రవచన భాష ద్వారా రాజసంబంధమైన నెరవేర్పును సూచిస్తుంది; అనువాదం ఆ సూచనను నిలుపుతూ వివరణను పాఠ్యంలోకి చేర్చకూడదు.
- issue: βασιλεύς యొక్క మెస్సీయ బిరుదు భావం
  choice: ‘రాజు’ అని సరళంగా అనువదించడం
  alternative: ‘మహారాజు’ లేదా వివరణాత్మకంగా ‘మెస్సీయ రాజు’ అని అనువదించడం
  rationale: ‘రాజు’ మూల పదానికి నేర సమానార్థకం. అదనపు గౌరవబిరుదు లేదా మెస్సీయ గుర్తింపును పదంలోనే చేర్చడం మూలాన్ని విస్తరించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ప్రవచన శైలి వాడబడింది. ‘సీయోను కుమారీ’ అనే సంబోధన మూలంలోని వ్యక్తీకరణను నిలుపుతుంది; ‘గాడిద పిల్లపై కూర్చొని’ అనేది మూల నిర్మాణానికి దగ్గరగా ఉండి సహజంగా చదవబడుతుంది.
