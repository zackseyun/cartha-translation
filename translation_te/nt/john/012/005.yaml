id: JHN.12.5
reference: John 12:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὰ τί τοῦτο τὸ μύρον οὐκ ἐπράθη τριακοσίων δηναρίων καὶ ἐδόθη πτωχοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: te
  text: “ఈ పరిమళ తైలాన్ని మూడు వందల దేనారాలకు అమ్మి, ఆ డబ్బును పేదలకు ఎందుకు ఇవ్వలేదు?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఒక దేనారం సాధారణంగా ఒక కూలీకి ఒక రోజు వేతనం. పని చేయని రోజులను మినహాయిస్తే, మూడు వందల దేనారాలు దాదాపు ఒక సంవత్సరపు సంపాదనకు సమానం.
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే సహజమైన, సంక్షిప్త ఆధునిక తెలుగు ప్రయోగం.
- source_word: τοῦτο τὸ μύρον
  choice: ఈ పరిమళ తైలాన్ని
  rationale: μύρον ఖరీదైన సుగంధ లేపనాన్ని లేదా తైలాన్ని సూచిస్తుంది; సందర్భంలోని అభిషేకానికి సరిపోయేలా ‘పరిమళ తైలం’ సహజంగా ఉంది.
- source_word: οὐκ ἐπράθη
  choice: ఎందుకు అమ్మలేదు?
  rationale: గ్రీకులోని నిషేధార్థక ప్రశ్న మరియు అఓరిస్ట్ కర్మణి రూపం తెలుగులో సహజంగా వినిపించే క్రియాశీల నిర్మాణంలో వ్యక్తమవుతుంది; వస్తువే కర్మగా కొనసాగుతుంది.
- source_word: τριακοσίων δηναρίων
  choice: మూడు వందల దేనారాలకు
  rationale: ధరను తెలిపే షష్ఠీ విభక్తి భావాన్ని ‘-కు’తో వ్యక్తం చేసి, చారిత్రక నాణెం పేరును అనువదించకుండా నిలిపాం.
- source_word: καὶ ἐδόθη πτωχοῖς
  choice: ఆ డబ్బును పేదలకు ... ఇవ్వలేదు
  rationale: అమ్మకం తరువాత ఇవ్వబడేది వచ్చిన ధనమేనని తెలుగులో స్పష్టంగా, సహజంగా చెప్పేందుకు ‘ఆ డబ్బును’ చేర్చాం; πτωχοῖς ను ‘పేదలకు’గా నేరుగా అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. చారిత్రక ధన ప్రమాణాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని విలువను పాదసూచికలో వివరించాం.
