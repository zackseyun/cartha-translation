source:
  edition: SBLGNT
  text: ταῦτα εἶπεν Ἠσαΐας ⸀ὅτι εἶδεν τὴν δόξαν αὐτοῦ, καὶ ἐλάλησεν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: te
  text: యెషయా ఆయన మహిమను చూసి, ఆయన గురించి మాట్లాడినందున ఈ మాటలు చెప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యెషయా ప్రభువు మహిమను చూసి, ఆయన గురించి మాట్లాడినందున ఈ మాటలు చెప్పాడు.” యోహాను సందర్భంలో ఈ సర్వనామాలు యేసును సూచించే అవకాశం ఎక్కువగా ఉంది; అయితే యెషయా ప్రవచనంలోని విస్తృత నేపథ్యం ప్రభువు మహిమ దర్శనం (యెషయా 6:1).
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ఈ మాటలు
  rationale: ముందు ఉల్లేఖించిన ప్రవచన వాక్యాలను సూచించే నపుంసక బహువచనం; తెలుగులో సహజంగా ‘ఈ మాటలు’.
- source_word: εἶπεν
  choice: చెప్పాడు
  rationale: λέγω భూతకాల రూపానికి సరళమైన సమానార్థకం; తరువాతి ἐλάλησεν నుండి స్వల్ప భేదాన్ని నిలుపుతుంది.
- source_word: Ἠσαΐας
  choice: యెషయా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ప్రవక్త పేరు.
- source_word: ὅτι
  choice: కాబట్టి
  rationale: ఇక్కడ యెషయా ఈ మాటలు చెప్పడానికి కారణాన్ని సూచిస్తుంది; తెలుగు వాక్యక్రమంలో కారణ వాక్యం తరువాత ‘కాబట్టి’ సహజంగా ఉంటుంది.
- source_word: εἶδεν
  choice: చూశాడు
  rationale: ὁράω యొక్క భూతకాల రూపాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: τὴν δόξαν αὐτοῦ
  choice: ఆయన మహిమను
  rationale: δόξα యొక్క యోహాను సంబంధిత బరువైన భావాన్ని ‘మహిమ’ నిలుపుతుంది; గౌరవ ఏకవచన సర్వనామం సహజమైన తెలుగు శైలికి సరిపోతుంది.
- source_word: ἐλάλησεν
  choice: మాట్లాడాడు
  rationale: λαλέωను ‘మాట్లాడాడు’గా ఇచ్చి, ముందున్న εἶπεν (‘చెప్పాడు’)తో ఉన్న స్వల్ప పదభేదాన్ని నిలుపుతుంది.
- source_word: περὶ αὐτοῦ
  choice: ఆయన గురించి
  rationale: περί + షష్ఠీ విభక్తి యొక్క ‘గురించి/సంబంధించి’ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: αὐτοῦ / αὐτοῦ అనే సర్వనామాల నిర్దేశిత వ్యక్తి
  choice: ప్రధాన పాఠంలో రెండింటినీ ‘ఆయన’గా ఉంచి, యోహాను సందర్భంలో యేసును సూచించే పఠనాన్ని అనుసరించడం
  alternative: వాటిని సాధారణంగా దేవుడు/ప్రభువును సూచించేవిగా గ్రహించడం
  rationale: యోహాను 12:37–41 యొక్క తక్షణ సందర్భం ఈ ప్రవచనాలను యేసుపట్ల అవిశ్వాసానికి అన్వయిస్తుంది; అందువల్ల యేసు సహజ నిర్దేశిత వ్యక్తి. అయితే యెషయా 6 నేపథ్యం ప్రభువు మహిమ దర్శనం కావడంతో, ఆ విస్తృత నేపథ్యాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని రెండు వేర్వేరు మాటల క్రియలను ‘చెప్పాడు’ మరియు ‘మాట్లాడాడు’గా వేరు చేశాం. సర్వనామాల భావనను ప్రధాన పాఠంలో అతిగా వివరిచకుండా, నిజమైన వ్యాఖ్యాన ఉద్రిక్తతను పాదటిప్పణిలో ఉంచాం.
