id: JHN.12.24
reference: John 12:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ ὁ κόκκος τοῦ σίτου πεσὼν εἰς τὴν γῆν ἀποθάνῃ, αὐτὸς μόνος μένει· ἐὰν δὲ ἀποθάνῃ, πολὺν καρπὸν φέρει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: te
  text: '“నేను మీతో నిజంగా, నిజంగా చెబుతున్నాను: గోధుమ గింజ నేలలో పడి చనిపోకపోతే, అది ఒక్కటిగానే మిగిలిపోతుంది[a]; కానీ అది చనిపోతే[b], ఎక్కువ ఫలాన్ని ఇస్తుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక “అది ఒంటరిగా మిగిలిపోతుంది.”
    reason: lexical_alternative
  - marker: b
    text: ఈ రూపకం ఫలించడానికి నేలలో చనిపోవలసిన గింజను సూచిస్తుంది. ఈ సందర్భంలో యేసు ఈ నమూనాను తన మరణానికీ, తనను అనుసరించేవారికీ అన్వయిస్తున్నాడు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: యోహాను సువార్తలోని గంభీరమైన ఉద్ఘాటనను, అలాగే గ్రీకులోని పునరుక్తిని ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో ... చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, యేసు పలికే సూత్రబద్ధమైన మాటను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐὰν μὴ
  choice: చనిపోకపోతే
  rationale: గ్రీకు షరతును తెలుగులో సహజమైన నిషేధ షరతు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ὁ κόκκος τοῦ σίτου
  choice: గోధుమ గింజ
  rationale: వ్యవసాయ దృశ్యానికి సరిపోయే, సాధారణ పాఠకులకు స్పష్టమైన పదబంధం.
- source_word: πεσὼν εἰς τὴν γῆν
  choice: నేలలో పడి
  rationale: నేలలో పడటం ముందుగా, చనిపోవటం తరువాత అనే క్రియాక్రమాన్ని నిలుపుతుంది; వ్యవసాయ సందర్భంలో γῆకి ‘నేల’ సహజం.
- source_word: ἀποθάνῃ
  choice: చనిపోతే / చనిపోకపోతే
  rationale: షరతు వాక్యాలలోని గ్రీకు aorist subjunctive భావాన్ని తెలుగులో సహజమైన షరతు రూపంతో అందిస్తుంది.
- source_word: αὐτὸς μόνος μένει
  choice: అది ఒక్కటిగానే మిగిలిపోతుంది
  rationale: గింజ ఒంటరిగా, ఫలించకుండా ఉండిపోతుందనే భావాన్ని తెలియజేస్తుంది; αὐτός యొక్క ఉద్ఘాటనను ‘అది’తో, μόνος భావాన్ని ‘ఒక్కటిగానే’తో నిలుపుతుంది.
- source_word: ἐὰν δὲ ἀποθάνῃ
  choice: కానీ అది చనిపోతే
  rationale: δέ సూచించే వ్యతిరేకతను ‘కానీ’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: πολὺν καρπὸν φέρει
  choice: ఎక్కువ ఫలాన్ని ఇస్తుంది
  rationale: ‘ఫలం’ అనే మూల రూపకాన్ని నిలుపుతూ, φέρει καρπόν భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: వ్యవసాయ రూపకంలోని పరోక్ష క్రీస్తుసంబంధమైన మరియు శిష్యత్వ సంబంధమైన అర్థం
  choice: ప్రధాన పాఠ్యంలో వ్యవసాయ రూపకాన్ని యథాతథంగా ఉంచి, దాని వేదాంత అన్వయాన్ని స్పష్టంగా చేర్చలేదు.
  alternative: ఈ మాట యేసు మరణాన్ని, దాని ద్వారా కలిగే విస్తారమైన ఫలాన్ని సూచిస్తుందని ప్రధాన పాఠ్యంలోనే వివరణాత్మకంగా చేర్చడం.
  rationale: సందర్భం ఈ రూపకాన్ని యేసు మరణానికి, తదుపరి వచనాల్లో ఆయనను అనుసరించేవారికి అన్వయిస్తుంది. అయితే ఈ వచనం స్వయంగా రూపకాన్ని మాత్రమే చెబుతుంది. కాబట్టి అంతర్లీన వేదాంత సంబంధాన్ని పాఠ్యంలో విప్పి చెప్పకుండా, సందర్భం కలిగించే ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచబడింది. యోహాను శైలిలోని ‘నిజంగా, నిజంగా’ అనే పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది. ప్రధాన పాఠ్యంలో ప్రతి పాదసూచిక గుర్తు దానికి సంబంధించిన పదబంధం వద్ద ఉంచబడింది.
