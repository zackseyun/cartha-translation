id: JHN.12.27
reference: John 12:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: te
  text: ఇప్పుడు నా మనసు కలత చెందుతోంది. నేను ఏమని చెప్పాలి?[a] తండ్రీ, ఈ ఘడియ నుండి నన్ను రక్షించు. అయితే, ఇందుకోసమే నేను ఈ ఘడియకు వచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఏమని చెప్పాలి? ‘తండ్రీ, ఈ ఘడియ నుండి నన్ను రక్షించు’ అనాలా?” గ్రీకు వాక్యాన్ని ప్రత్యక్ష విన్నపంగా కాక, అలంకారిక ప్రశ్నగా కూడా చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: ఇప్పుడు
  rationale: యేసు ప్రస్తుతం అనుభవిస్తున్న కలవరపు తక్షణత్వాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἡ ψυχή μου
  choice: నా ప్రాణం
  rationale: ఇక్కడ ψυχή యేసు అంతరంగ వ్యక్తిత్వాన్ని సూచిస్తుంది. ‘ప్రాణం’ మూలపదపు గంభీరతను నిలుపుతూ సాధారణ తెలుగు పాఠకులకు సహజంగా ఉంటుంది.
- source_word: τετάρακται
  choice: కలవరపడుతోంది
  rationale: పర్ఫెక్ట్ రూపం గతంలో కలిగిన కలవరంవల్ల కొనసాగుతున్న ప్రస్తుత స్థితిని సూచిస్తుంది; ఈ తెలుగు రూపం ఆ ప్రస్తుత అంతరంగ వ్యాకులతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τί εἴπω
  choice: నేను ఏమని చెప్పాలి?
  rationale: విచారణాత్మక సబ్జంక్టివ్‌లోని అంతరంగ ఆలోచనను స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πάτερ
  choice: తండ్రీ
  rationale: దేవునికి చేసే ప్రత్యక్ష సంబోధనను గౌరవప్రదమైన, సహజ తెలుగు రూపంలో ఇస్తుంది.
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: ఈ ఘడియ నుండి నన్ను రక్షించు
  rationale: ἐκ సూచించే విమోచన భావాన్ని ‘నుండి’ నిలుపుతుంది; ‘రక్షించు’ σῴζω యొక్క విస్తృత అర్థాన్ని కాపాడుతుంది.
- source_word: ὥρα
  choice: ఘడియ
  rationale: యోహాను సువార్తలో యేసు బాధ, మరణం, మహిమకు నియమితమైన నిర్ణాయక సమయాన్ని సూచించే ప్రత్యేక భావాన్ని ‘ఘడియ’ నిలుపుతుంది.
- source_word: ἀλλὰ διὰ τοῦτο
  choice: అయితే, ఇందుకోసమే
  rationale: ἀλλά లోని వ్యత్యాసాన్ని, διὰ τοῦτο లోని కారణం లేదా ఉద్దేశ భావాన్ని సహజంగా కలిపి వ్యక్తం చేస్తుంది.
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: నేను ఈ ఘడియకు వచ్చాను
  rationale: εἰς ను ఉద్దేశార్థకంగా మార్చకుండా ‘కు’ అని సమీపంగా అనువదిస్తూ, నియమిత సమయానికి చేరుకున్న భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘తండ్రీ, ఈ ఘడియ నుండి నన్ను రక్షించు’ అనే మాటను ప్రత్యక్ష ప్రార్థనగా చదవాలా, లేక ముందున్న ప్రశ్నలో భాగమైన తిరస్కృత సంభావ్యతగా చదవాలా?
  choice: ప్రత్యక్ష విన్నపంగా ప్రధాన పాఠ్యంలో ఉంచడం.
  alternative: ‘నేను ఏమని చెప్పాలి? “తండ్రీ, ఈ ఘడియ నుండి నన్ను రక్షించు” అనాలా?’ అని అలంకారిక ప్రశ్నగా చదవడం.
  rationale: ప్రాచీన ప్రతుల విరామచిహ్నాలు మూలరచనలో భాగం కావు కాబట్టి రెండు పఠనాలూ సాధ్యమే. SBLGNT విరామచిహ్నీకరణ ప్రకారం ప్రత్యక్ష విన్నపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, యేసు కలవరానికీ తన నియమిత కార్యాన్ని స్వీకరించడానికీ మధ్యనున్న ఉద్వేగాన్ని కాపాడాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. యోహాను సువార్తలోని ὥρα పదానికి ఉన్న ప్రత్యేక భావాన్ని నిలుపడానికి ‘సమయం’కు బదులు ‘ఘడియ’ వాడబడింది. ప్రధాన పాఠ్యంలో ఉన్న ఉద్ధరణ చిహ్నాలు ప్రార్థనను ప్రత్యక్ష పలుకుగా స్పష్టం చేస్తాయి; పాదసూచిక వ్యాకరణపరమైన ప్రత్యామ్నాయాన్ని భద్రపరుస్తుంది.
