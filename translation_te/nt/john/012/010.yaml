  terminology: “ప్రధాన యాజకులు,” “లాజరు,” and “చంపాలని” are appropriate. The wording does not import judicial-process implications or extra moral characterization. The footnote’s alternative properly presents “పథకం వేశారు” as a possible rendering of ἐβουλεύσαντο.
