  text: So the chief priests decided to kill Lazarus also,[a]
translation:
  language: te
  text: కానీ ప్రధాన యాజకులు లాజరును కూడా చంపాలని నిర్ణయించుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లాజరును కూడా చంపడానికి పథకం వేశారు.’
    reason: ἐβουλεύσαντο అనే క్రియను నిర్ణయానికి రావడం లేదా పథకం వేయడం అనే సమీప భావాలతో అనువదించవచ్చు.
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: నిర్ణయించుకున్నారు
  rationale: ఈ సందర్భంలో సంప్రదించి ఒక నిశ్చిత కార్యాచరణకు రావడం అనే భావం ఉంది. ఆధునిక తెలుగులో ‘నిర్ణయించుకున్నారు’ సహజంగా ఉండి, ఉద్దేశపూర్వక తీర్మానాన్ని తెలియజేస్తుంది.
- source_word: δὲ
  choice: అందుచేత
  rationale: మునుపటి వచనంలోని పరిణామానికి అనుసంధానంగా కథనం ముందుకు సాగుతున్నందున, ఇక్కడి అనుసంధాన భావాన్ని ‘అందుచేత’ సహజంగా వ్యక్తపరుస్తుంది; గ్రీకు పదం స్వతహాగా బలమైన వ్యతిరేకతను తప్పనిసరి చేయదు.
- source_word: οἱ ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: సువార్తల సందర్భంలో ఇది ఒక్క ప్రధాన యాజకుణ్ణి కాక, ప్రధాన యాజక వర్గ నాయకత్వాన్ని సూచిస్తుంది.
- source_word: ἵνα
  choice: చంపాలని
  rationale: నిర్ణయం యొక్క ఉద్దేశం లేదా విషయాన్ని తెలిపే ἵνα వాక్యాన్ని తెలుగులో ‘-ాలని’ నిర్మాణం సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: లాజరు మరొక లక్ష్యంగా చేర్చబడ్డాడనే సంకలన భావాన్ని ‘కూడా’ స్పష్టంగా తెలియజేస్తుంది; అవసరం లేని అదనపు ఉద్ఘాటనను చేర్చదు.
- source_word: τὸν Λάζαρον
  choice: లాజరును
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో ఇచ్చి, వాక్యంలో కర్మగా ఉన్నందున ద్వితీయావిభక్తిని జోడించాం.
- source_word: ἀποκτείνωσιν
  choice: చంపాలని
  rationale: ‘చంపు’ మూలంలోని ప్రత్యక్ష అర్థాన్ని సహజంగా అందిస్తుంది. ‘మరణశిక్ష విధించు’ అనే న్యాయపరమైన భావాన్నిగానీ, ‘హత్య చేయు’ అనే అదనపు నైతిక విశ్లేషణనుగానీ చేర్చదు.
theological_decisions:
- issue: లాజరుపట్ల ప్రధాన యాజకుల ఉద్దేశాన్ని కథనం ఎలా చిత్రిస్తుంది
  choice: లాజరును చంపాలనే ఉద్దేశపూర్వక నిర్ణయంగా నేరుగా అనువదించడం
  alternative: ‘కుట్ర పన్నారు’ వంటి మరింత బలమైన ముందస్తు పన్నాగ భాషను ఉపయోగించడం
  rationale: గ్రీకు వాక్యం ఆలోచించి తీసుకున్న తీవ్రమైన నిర్ణయాన్ని చెబుతుంది; అయితే కుట్రకు ప్రత్యేకమైన పదాన్ని ఉపయోగించదు. కాబట్టి వారి ఉద్దేశం యొక్క తీవ్రతను నిలుపుతూ అదనపు వ్యాఖ్యాన ఛాయను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ప్రధాన యాజకులు’ అనే పరిచిత బైబిలు పదబంధాన్ని నిలిపి, మిగతా వాక్యాన్ని సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా రూపొందించాం.
