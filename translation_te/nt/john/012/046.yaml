review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the principal elements: Jesus has come into the world as light, and the purpose concerns every person believing in him not remaining in darkness. However, the repeated construction ‘నిలిచిపోకుండా ఉండేందుకే వచ్చాను’ is unnecessarily periphrastic, and ‘-కే’ can add an exclusive/emphatic nuance not required by ἵνα.'
  naturalness: ‘నన్ను నమ్మే ప్రతి ఒక్కరూ చీకటిలో నిలిచిపోకుండునట్లు నేను వెలుగుగా లోకంలోకి వచ్చాను’ is a clear, idiomatic formal-modern Telugu rendering. It directly expresses the Greek purpose clause without the awkward repetition of ‘వచ్చాను/ఉండేందుకు.’
  terminology: ‘వెలుగు,’ ‘లోకం,’ ‘నమ్మే,’ and ‘చీకటి’ appropriately preserve Johannine vocabulary and metaphor. ‘వెలుగుగా’ suitably represents the qualitative anarthrous predicate φῶς. The footnote is retained, with wording made more accessible while preserving the lexical alternative.
  issues:
  - severity: medium
    issue: Purpose clause is overextended and slightly emphatic
    rationale: ‘...నిలిచిపోకుండా ఉండేందుకే వచ్చాను’ duplicates the coming/purpose idea and the particle ‘కే’ may imply ‘precisely/only for this purpose.’ The Greek ἵνα simply introduces the purpose that believers may not remain in darkness.
  revised_text: నన్ను నమ్మే ప్రతి ఒక్కరూ చీకటిలో నిలిచిపోకుండునట్లు నేను వెలుగుగా[a] లోకంలోకి వచ్చాను.
