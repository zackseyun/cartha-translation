  to: నన్ను నమ్మే ప్రతి ఒక్కరూ చీకటిలో నిలిచిపోకుండునట్లు నేను వెలుగుగా[a] లోకంలోకి వచ్చాను.
  rationale: The revision preserves the Greek word order only where natural, while making the ἵνα purpose explicit through ‘నిలిచిపోకుండునట్లు.’ It removes avoidable repetition and does not add theological interpretation or exclusivity. The alternative rendering for φῶς remains available in a footnote.
