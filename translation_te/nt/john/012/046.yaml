id: JHN.12.46
reference: John 12:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: te
  text: నన్ను నమ్మే ప్రతి ఒక్కరూ చీకటిలో నిలిచిపోకుండునట్లు నేను వెలుగుగా[a] లోకంలోకి వచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక వెలుగుగా.’ గ్రీకులో ‘వెలుగు’ అనే పదానికి నిర్దిష్ట ఉపపదం లేదు; దీనిని ‘వెలుగుగా’ లేదా మరింత అక్షరార్థంగా ‘ఒక వెలుగుగా’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: వెలుగుగా
  rationale: వ్యాసపదం లేని φῶς ఇక్కడ యేసు యొక్క స్వరూపాన్ని, కార్యాన్ని గుణాత్మకంగా తెలియజేస్తుంది. ‘వెలుగుగా’ అనే రూపం యోహాను సువార్తలోని ప్రధాన రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: εἰς τὸν κόσμον
  choice: లోకంలోకి
  rationale: εἰς + ద్వితీయా విభక్తి ఒక పరిధిలోకి ప్రవేశాన్ని సూచిస్తుంది; ‘లోకంలోకి’ రావడం అనే భావాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: ἐλήλυθα
  choice: వచ్చాను
  rationale: గ్రీకు పరిపూర్ణ కాలం గతంలో జరిగిన రాకకు వర్తమాన ప్రాసంగికత ఉందని సూచిస్తుంది. తెలుగులో ‘వచ్చాను’ సందర్భానుసారంగా సహజంగా ఈ పూర్తయిన రాకను వ్యక్తం చేస్తుంది.
- source_word: ἵνα
  choice: ఉండేందుకే
  rationale: యేసు లోకంలోకి రావడంలోని ఉద్దేశాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘కే’ ఉద్దేశ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: πᾶς ὁ πιστεύων
  choice: నమ్మే ప్రతి ఒక్కరూ
  rationale: నమ్మేవారి సమస్త వర్గాన్ని సూచించే గ్రీకు నిర్మాణాన్ని సహజంగా, సమగ్ర పరిధితో వ్యక్తం చేస్తుంది.
- source_word: πιστεύων εἰς ἐμέ
  choice: నన్ను నమ్మే
  rationale: యోహాను రచనల్లో వ్యక్తిగా యేసుపై ఉంచే విశ్వాసాన్ని సూచించే πιστεύω εἰς నిర్మాణానికి ఇది సాధారణమైన, అర్థవంతమైన తెలుగు రూపం.
- source_word: ἐν τῇ σκοτίᾳ
  choice: చీకటిలో
  rationale: యోహాను సువార్తలో నైతిక, ఆధ్యాత్మిక పరిధిగా ఉపయోగించిన చీకటి రూపకాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: μὴ μείνῃ
  choice: నిలిచిపోకుండా
  rationale: ఇప్పటికే ఉన్న స్థితిలో కొనసాగకుండా ఉండడం అనే μένω భావాన్ని ‘నిలిచిపోకుండా’ స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలోని వెలుగు రూపకంలో క్రీస్తు స్వీయ గుర్తింపు
  choice: యేసు ‘వెలుగుగా’ లోకంలోకి వచ్చాడని రూపకాన్ని యథాతథంగా నిలిపాం.
  alternative: ‘లోకానికి వెలుగు తీసుకురావడానికి వచ్చాను’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: మూలపాఠం యేసును కేవలం వెలుగు తెచ్చేవానిగా కాక వెలుగుగా చూపుతుంది. అందువల్ల రూపకాన్ని సిద్ధాంతపరమైన విస్తరణ లేకుండా కాపాడాం.
- issue: πᾶς ὁ πιστεύων యొక్క పరిధి
  choice: ‘నమ్మే ప్రతి ఒక్కరూ’ అని అనువదించాం.
  alternative: ‘ఎవరైతే నన్ను నమ్ముతారో వారు’ అని అనువదించడం.
  rationale: మూలపాఠం విశ్వసించేవారి సమగ్ర వర్గాన్ని పేర్కొంటుంది; విశ్వాసం ఎలా కలుగుతుందనే విస్తృత సిద్ధాంత వివాదాన్ని ఈ వాక్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ఉద్దేశ వాక్యాన్ని సహజంగా ఉంచేందుకు ప్రధాన క్రియను చివర పునరుక్తి చేశాం; ఇది గ్రీకు ἵνα సంబంధాన్ని స్పష్టం చేస్తుంది.
