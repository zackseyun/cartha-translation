id: JHN.12.29
reference: John 12:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: te
  text: కాబట్టి, అక్కడ నిలబడి ఉన్న, దానిని విన్న జనసమూహం, “ఉరుము వచ్చింది” అని చెబుతూ ఉంది; మరికొందరు[a], “ఒక దేవదూత ఆయనతో మాట్లాడాడు” అని చెబుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సహజంగా: “ఉరిమింది” లేదా “ఉరుము వినిపించింది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి వచనంలోని పరలోక స్వరానికి జనసమూహం చూపిన ప్రతిస్పందనను కథనపరంగా అనుసంధానిస్తుంది.
- source_word: ὄχλος
  choice: జనసమూహం
  rationale: గుమికూడిన ప్రజలను సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: ὁ ἑστὼς
  choice: అక్కడ నిలబడి ఉండి
  rationale: ἵστημι పరిపూర్ణ కృదంతం సూచించే కొనసాగుతున్న స్థితిని, సందర్భంలోని స్థల సూచనతో కలిపి వ్యక్తపరుస్తుంది.
- source_word: ἀκούσας
  choice: దానిని విన్న
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన వినడాన్ని తెలుపుతుంది; ‘దానిని’ అనేది మునుపటి వచనంలోని స్వరం లేదా ధ్వనిని సందర్భానుసారంగా సూచిస్తుంది.
- source_word: ἔλεγεν
  choice: అని అంటూ ఉంది
  rationale: అపరిపూర్ణ కాలం సూచించే కొనసాగుతున్న లేదా పలువురు చెబుతున్న చర్యను నిలుపుతుంది.
- source_word: βροντὴν γεγονέναι
  choice: ఉరుము పుట్టింది
  rationale: ‘ఉరుము సంభవించింది’ అనే గ్రీకు నిర్మాణానికి దగ్గరగా ఉండి, తెలుగులో అర్థమయ్యే రూపం.
- source_word: ἄλλοι
  choice: మరికొందరు
  rationale: జనసమూహంలోని రెండవ వర్గాన్ని సహజంగా వేరు చేస్తుంది.
- source_word: Ἄγγελος
  choice: ఒక దేవదూత
  rationale: పరలోక స్వరాన్ని గురించి జనులు చేసిన వ్యాఖ్య కనుక ఇక్కడ మానవ దూతకన్నా పరలోక జీవి భావమే సందర్భోచితం.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: λαλέωతో ఉన్న దత్తి విభక్తిని తెలుగులో సహజంగా ‘ఆయనతో మాట్లాడాడు’ అని వ్యక్తపరుస్తుంది; సూచితుడు యేసు.
- source_word: λελάληκεν
  choice: మాట్లాడాడు
  rationale: తెలుగులో సహజమైన భూతకాల రూపం; గ్రీకు పరిపూర్ణ కాలంలోని పూర్తయిన మాటల చర్యను సందర్భంలో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పరలోక వక్త స్వభావం
  choice: ఒక దేవదూత ఆయనతో మాట్లాడాడు
  alternative: ఒక దూత ఆయనతో మాట్లాడాడు
  rationale: మునుపటి వచనంలోని పరలోక స్వరానికి జనసమూహం ఇచ్చిన వివరణ ఇది. ἄγγελος అనే పదానికి సందర్భంలో పరలోక జీవి భావం సంభావ్యమైనందున ‘దేవదూత’ ఎంచుకోబడింది; వక్త నిజంగా దేవదూతేనని కథకుడు నిర్ధారిస్తున్నట్టు అదనంగా చెప్పలేదు.
- issue: జనసమూహం విన్నదాని స్వభావం
  choice: దానిని విన్న
  alternative: ఆ స్వరాన్ని విన్న
  rationale: గ్రీకులో కర్మ స్పష్టంగా లేదు. ‘దానిని’ అని ఉంచడం వల్ల వారు స్పష్టమైన స్వరాన్ని విన్నారా లేక కేవలం ధ్వనిని విన్నారా అనే కథనంలోని ఉద్రిక్తతను ముందుగానే పరిష్కరించకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ప్రధాన పాఠంలో గ్రీకు నిర్మాణానికి దగ్గరగా ‘ఉరుము పుట్టింది’ ఉంచి, మరింత సహజమైన తెలుగు ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం. అయితే ‘కాబట్టి’ lexical decisionకు అనుగుణంగా ప్రధాన పాఠం ప్రారంభంలో ఉండాలి.
