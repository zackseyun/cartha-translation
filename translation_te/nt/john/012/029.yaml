  to: కాబట్టి, అక్కడ నిలబడి ఉన్న, దానిని విన్న జనసమూహం, “ఉరుము వచ్చింది” అని చెబుతూ ఉంది; మరికొందరు[a], “ఒక దేవదూత ఆయనతో మాట్లాడాడు” అని చెబుతూ ఉన్నారు.
  rationale: ప్రధాన పాఠంలో οὖν యొక్క అనుసంధానాన్ని ‘కాబట్టి’గా చేర్చాం. నిలబడి ఉన్న స్థితిని ‘నిలబడి ఉన్న’గా స్పష్టం చేశాం; ఉరుము సంభవించిందనే భావాన్ని సహజమైన ‘ఉరుము వచ్చింది’గా వ్యక్తపరిచాం. రెండు గ్రీకు అపరిపూర్ణకాల క్రియల కొనసాగింపు భావాన్ని ‘చెబుతూ ఉంది/ఉన్నారు’ ద్వారా నిలిపాం. పాదటిప్పణి ప్రత్యామ్నాయాలు మూలంలోని వ్యాఖ్యాన భేదాన్ని మార్పు లేకుండా కాపాడుతున్నాయి.
