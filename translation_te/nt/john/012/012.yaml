id: JHN.12.12
reference: John 12:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ⸀ὁ ὄχλος πολὺς ὁ ἐλθὼν εἰς τὴν ἑορτήν, ἀκούσαντες ὅτι ἔρχεται ⸁ὁ Ἰησοῦς εἰς Ἱεροσόλυμα,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/012.yaml
  text: The next day[a], the large crowd that had come to the feast, when they heard that Jesus was coming to Jerusalem[b],
translation:
  language: te
  text: మరుసటి రోజు, పండుగకు వచ్చిన పెద్ద జనసమూహం యేసు యెరూషలేముకు వస్తున్నాడని[a] విన్నప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో చారిత్రక వర్తమాన కాలం ఉంది: “యేసు యెరూషలేముకు వస్తున్నాడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: మరుసటి రోజు
  rationale: కాలసూచక దత్తివిభక్తి ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపి, కథన క్రమాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ ὄχλος πολὺς
  choice: పెద్ద జనసమూహం
  rationale: ὄχλος అనే సమూహ భావాన్నీ, πολὺς సూచించే దాని పెద్ద పరిమాణాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: పండుగకు వచ్చిన
  rationale: నామవాచకాన్ని విశేషించే గ్రీకు కృదంతాన్ని తెలుగులో సహజమైన సంబంధార్థక కృదంత నిర్మాణంతో అందిస్తుంది; ఈ రాక కథనంలోని వినికిడికి ముందే జరిగినదని సందర్భం తెలియజేస్తుంది.
- source_word: ἀκούσαντες
  choice: విన్నప్పుడు
  rationale: ఏకవచన సమూహ నామం నుంచి అందులోని ప్రజలను సూచించే బహువచన కృదంతానికి ఉన్న భావమార్పును తెలుగులో సహజంగా వ్యక్తం చేస్తూ, దాని కాలసంబంధ భావాన్ని నిలుపుతుంది.
- source_word: ὅτι ἔρχεται ὁ Ἰησοῦς
  choice: యేసు … వస్తున్నాడని
  rationale: ἔρχεται అనే వర్తమాన రూపంలోని కొనసాగుతున్న రాక భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది; పరోక్ష వాక్యంలోనూ మూలంలోని చారిత్రక వర్తమాన సజీవత కొంత ప్రతిఫలిస్తుంది.
- source_word: εἰς Ἱεροσόλυμα
  choice: యెరూషలేముకు
  rationale: నగరం వైపు గమనాన్ని సూచించే εἰς భావానికి సహజమైన తెలుగు గమ్యవాచక రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ఈ వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున ముగింపులో కామా ఉంచబడింది. ἑορτήకు సాధారణంగా అర్థమయ్యే ‘పండుగ’ను వాడాం; ప్రత్యేక ప్రత్యామ్నాయ పాదటిప్పణి అవసరం లేదు.
