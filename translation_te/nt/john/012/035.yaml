id: JHN.12.35
reference: John 12:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: te
  text: 'అప్పుడు యేసు వారితో ఇలా అన్నాడు: “వెలుగు ఇంకా కొద్దికాలం మీ మధ్య ఉంది.[a] మీకు వెలుగు ఉన్నంతకాలం నడవండి, చీకటి మిమ్మల్ని పట్టుకోకుండా ఉండేందుకు. చీకటిలో నడిచేవాడు తాను ఎక్కడికి వెళ్తున్నాడో తెలుసుకోడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీలో” లేదా “మీతో.” గ్రీకు పదబంధాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు. అయితే యేసు ఆ సమయంలో ప్రజల మధ్య బహిరంగంగా ఉన్నాడనే తక్షణ సందర్భానికి “మీ మధ్య” బాగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: ముందటి సంభాషణకు ఈ మాటను సహజంగా అనుసంధానిస్తుంది; గ్రీకు పదానికి లేని బలమైన తార్కిక ఫలితార్థాన్ని మోపదు.
- source_word: Ἔτι μικρὸν χρόνον
  choice: ఇంకా కొంతకాలం
  rationale: ἔτι లోని ‘ఇంకా’ భావాన్నీ, μικρὸν χρόνον లోని స్వల్ప కాలవ్యవధినీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ φῶς
  choice: వెలుగు
  rationale: యోహాను రచనలోని రూపక, క్రీస్తుసంబంధమైన భావభారాన్ని వివరణగా మార్చకుండా మూలంలోని ప్రతీకను యథాతథంగా నిలుపుతుంది.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్యనే
  rationale: ఈ సందర్భంలో ప్రజల మధ్య యేసు ప్రస్తుత బహిరంగ ఉనికిని సహజంగా సూచిస్తుంది. గ్రీకు పదబంధంలోని ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: περιπατεῖτε
  choice: నడవండి
  rationale: గ్రీకు నడక రూపకాన్ని నిలుపుతూ, జీవన ప్రవర్తనను కూడా సూచించగల సహజమైన బైబిలీయ ప్రయోగం.
- source_word: ὡς ... ἔχετε
  choice: మీకు ... ఉన్నప్పుడే
  rationale: ఇక్కడ ὡς కు కాలార్థం తగినది; వెలుగు అందుబాటులో ఉన్న పరిమిత సమయపు అత్యవసరతను తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα μὴ
  choice: అప్పుడు ... కమ్మివేయదు
  rationale: 'మూలంలోని నిరోధక ఉద్దేశాన్ని సహజ తెలుగు వాక్యసంబంధంతో తెలియజేస్తుంది: వెలుగు ఉన్నప్పుడు నడవడం వల్ల చీకటి కమ్మకుండా ఉంటుంది.'
- source_word: σκοτία
  choice: చీకటి
  rationale: యోహానులోని వెలుగు–చీకటి వ్యత్యాసాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: καταλάβῃ
  choice: కమ్మివేయదు
  rationale: చీకటి వచ్చి ఒకరిని పట్టుకోవడం లేదా ఆవరించడం అనే సందర్భోచిత చిత్రాన్ని సహజ తెలుగులో అందిస్తుంది; ‘జయించు’ అనే వ్యాఖ్యానాత్మక భావాన్ని మోపదు.
- source_word: ὁ περιπατῶν
  choice: నడిచేవాడు
  rationale: సామాన్య వర్తమానార్థంగల substantival participle ను సంక్షిప్తమైన సహజ తెలుగు ఏకవచన రూపంలో నిలుపుతుంది.
- source_word: ἐν τῇ σκοτίᾳ
  choice: చీకటిలో
  rationale: వెలుగుకు వ్యతిరేకమైన స్థితి లేదా పరిధిలో నడవడం అనే మూల చిత్రాన్ని నిలుపుతుంది.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: తాను ఎక్కడికి వెళ్తున్నాడో తెలుసుకోడు
  rationale: దిశ తెలియని స్థితిని వర్తమాన కాలంలో సహజంగా వ్యక్తం చేస్తూ గ్రీకు వాక్యార్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ‘వెలుగు’కు సంబంధించి ἐν ὑμῖν యొక్క అర్థం
  choice: మీ మధ్యనే
  alternative: మీలోనే; మీతోనే
  rationale: తక్షణ కథన సందర్భంలో యేసు లోకంలోని వెలుగుగా ప్రజల మధ్య పరిమితకాలం ఉండడాన్ని సూచిస్తున్నాడు. ‘మీ మధ్యనే’ అనేది అంతరంగ నివాస సిద్ధాంతాన్ని అనవసరంగా చొప్పించకుండా ఆ బహిరంగ, సంబంధాత్మక ఉనికిని తెలియజేస్తుంది. అయితే ἐν పదానికి అంతరంగ లేదా సహవాస భావాలు కూడా సాధ్యమైనందున వాటిని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. వెలుగు–చీకటి, నడక అనే మూల రూపకాలను పరిరక్షించాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
