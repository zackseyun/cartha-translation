    rationale: 'ἐστιν ప్రస్తుతకాలంలో ఉంది: వెలుగు ఇంకా కొద్దికాలం వారి మధ్య ప్రస్తుతం ఉంది. “ఉంది” అనేది మూలకాలాన్ని, సందర్భాన్ని మరింత కచ్చితంగా ప్రతిబింబిస్తుంది.'
  - severity: medium
    issue: “అప్పుడు చీకటి మిమ్మల్ని కమ్మివేయదు” ఉద్దేశార్థాన్ని భవిష్యత్ ఫలితంగా మారుస్తుంది; “కమ్మివేయు” కూడా καταλάβῃ యొక్క పట్టుకోవడం/ఒడిసిపట్టడం భావాన్ని కొంత మృదువుగా చేస్తుంది.
