revisions:
- from: 'అప్పుడు యేసు వారితో ఇలా అన్నాడు: “వెలుగు ఇంకా కొంతకాలం మీ మధ్యనే ఉంటుంది.[a] మీకు వెలుగు ఉన్నప్పుడే నడవండి; అప్పుడు చీకటి మిమ్మల్ని కమ్మివేయదు. చీకటిలో నడిచేవాడు తాను ఎక్కడికి వెళ్తున్నాడో తెలుసుకోడు.”'
  to: 'అప్పుడు యేసు వారితో ఇలా అన్నాడు: “వెలుగు ఇంకా కొద్దికాలం మీ మధ్య ఉంది.[a] మీకు వెలుగు ఉన్నంతకాలం నడవండి, చీకటి మిమ్మల్ని పట్టుకోకుండా ఉండేందుకు. చీకటిలో నడిచేవాడు తాను ఎక్కడికి వెళ్తున్నాడో తెలుసుకోడు.”'
  rationale: ప్రస్తుతకాల క్రియను ప్రస్తుతకాలంగానే అనువదించాం; అలాగే చీకటి ‘పట్టుకోకుండా’ ఉండేందుకు నడవాలనే ఉద్దేశార్థాన్ని పునరుద్ధరించాం. ἐν ὑμῖν యొక్క సందర్భానుగుణ ప్రధాన అర్థాన్ని “మీ మధ్య”గా ఉంచి, ఇతర వ్యాకరణపరంగా సాధ్యమైన అర్థాలను పాదసూచికలో ఉంచాం.
