source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: te
  text: '“ఆయన వారి కళ్లను గుడ్డివారిగా చేశాడు,

    వారి హృదయాన్ని కఠినపరిచాడు;

    వారు తమ కళ్లతో చూడకుండా,

    హృదయంతో గ్రహించకుండా,

    తిరగకుండా[a][b],

    నేను వారిని స్వస్థపరచకుండా ఉండేలా[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరివర్తన చెందకుండా.’
    reason: lexical_alternative
  - marker: b
    text: ఈ మాటలు యెషయా 6:10ను ప్రతిధ్వనింపజేస్తాయి.
    reason: cross_reference
  - marker: c
    text: 'గ్రీకు క్రియ రూపపరంగా భవిష్యత్ కాలంలో ఉంది: ‘నేను వారిని స్వస్థపరుస్తాను’ లేదా సందర్భానుసారం ‘నేను వారిని స్వస్థపరచుదును.’ అయితే ముందున్న ప్రతికూల ఉద్దేశం/ఫలిత నిర్మాణంలో, వారు తిరిగి స్వస్థత పొందకుండా ఉండే భావాన్ని ఇది పూర్తి చేస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: గుడ్డివిగా చేశాడు
  rationale: పరిపూర్ణ కాలరూపం గతంలో జరిగిన చర్య వల్ల ఏర్పడిన ప్రస్తుత స్థితిని సూచిస్తుంది. తెలుగు సందర్భంలో ‘గుడ్డివిగా చేశాడు’ ఆ చర్యనూ దాని ఫలిత స్థితినీ సహజంగా తెలియజేస్తుంది.
- source_word: ἐπώρωσεν
  choice: కఠినపరిచాడు
  rationale: ఈ క్రియ హృదయాన్ని స్పందనలేనిదిగా లేదా మొద్దుబారినదిగా చేయడాన్ని సూచిస్తుంది. ‘కఠినపరిచాడు’ సహజమైన బైబిలు తెలుగు పదప్రయోగంగా ఉండి, దైవిక తీర్పు భావాన్ని మృదువుచేయదు.
- source_word: καρδίαν / καρδίᾳ
  choice: హృదయం / హృదయంతో
  rationale: ఇక్కడ హృదయం అవగాహనతో సహా అంతరంగ వ్యక్తిని సూచిస్తుంది. ‘గ్రహించు’ అనే క్రియ జ్ఞానసంబంధ భావాన్ని స్పష్టం చేస్తుండగా, ‘హృదయం’ మూలంలోని బైబిలు మానవ దృక్పథాన్ని నిలుపుతుంది.
- source_word: ἵνα μὴ
  choice: అందువల్ల … కూడదు
  rationale: ఈ నిర్మాణంలో ఉద్దేశం మరియు ఫలితం మధ్య ఉన్న ఉద్రిక్తతను పూర్తిగా ఒక వైపుకు తేల్చకుండా ‘అందువల్ల’తో అనుసంధానించి, నిషేధార్థక ‘కూడదు’ రూపాన్ని వాడాం.
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: తమ కళ్లతో చూడకూడదు
  rationale: కళ్లతో చూడడం అనే స్పష్టమైన దృశ్యరూపాన్నీ, హృదయంతో గ్రహించడంతో ఉన్న సమాంతర నిర్మాణాన్నీ కాపాడుతుంది.
- source_word: νοήσωσιν
  choice: గ్రహించకూడదు
  rationale: νοέω ఇక్కడ మానసికంగా అర్థం చేసుకోవడం లేదా గ్రహించడాన్ని సూచిస్తుంది. ‘గ్రహించు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది.
- source_word: στραφῶσιν
  choice: తిరగకూడదు
  rationale: ‘తిరుగు’ మూలపదంలోని విశాలమైన ప్రవక్తీయ భావాన్ని నిలుపుతుంది; ‘మతం మార్చుకొను’ లేదా ‘పరివర్తన చెందు’ వంటి మరింత సిద్ధాంతభరిత పదాలను ప్రధాన పాఠ్యంలో నివారిస్తుంది.
- source_word: ἰάσομαι
  choice: నేను వారిని స్వస్థపరచకూడదు
  rationale: గ్రీకులో ఇది భవిష్యత్ సూచక రూపమే అయినా, ముందున్న ἵνα μή ఉద్దేశం/ఫలితం నిర్మాణంలో భాగంగా ఉల్లేఖించబడింది. తెలుగులో నిషేధాత్మక ఉద్దేశ/ఫలిత సంబంధాన్ని కొనసాగిస్తూ, కర్త అయిన ‘నేను’నూ స్వస్థపరిచే చర్యనూ స్పష్టంగా ఉంచుతుంది.
- source_word: αὐτῶν τὴν καρδίαν
  choice: వారి హృదయాన్ని
  rationale: గ్రీకులోని ఏకవచన ‘హృదయం’ను సమూహార్థకంగా అలాగే ఉంచి, యెషయా ఉల్లేఖనంలోని రూపాన్ని కాపాడుతుంది.
theological_decisions:
