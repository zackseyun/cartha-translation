  choice: ‘ఆయన … చేశాడు; … కఠినపరిచాడు’ అని స్పష్టమైన ఏకవచన కర్తను నిలుపడం
  alternative: కర్తను తొలగించి కర్మణి లేదా వ్యక్తిరహిత రూపంలో అనువదించడం
  rationale: గ్రీకు పాఠ్యం ఈ చర్యలను ఒక స్పష్టమైన ఏకవచన కర్తకు ఆపాదిస్తుంది. కఠినమైన న్యాయతీర్పు భావాన్ని అనువాదం మృదువుచేయకూడదు.
- issue: στραφῶσιν లోని తిరుగుదల/మార్పు భావం
  choice: ప్రధాన పాఠ్యంలో ‘తిరగకూడదు’
  alternative: ‘పరివర్తన చెందకూడదు’ లేదా ‘మారుమనస్సు పొందకూడదు’
  rationale: గ్రీకు క్రియ విస్తృతమైన ‘తిరుగు’ భావాన్ని కలిగి ఉంది. సిద్ధాంతపరంగా మరింత నిర్దిష్టమైన పదాన్ని రుద్దకుండా మూలంలోని అనిశ్చితిని నిలుపుతుంది.
- issue: ἰάσομαι యొక్క భవిష్యత్ రూపం మరియు ఉద్దేశం/ఫలితం నిర్మాణం
  choice: ప్రధాన పాఠ్యంలో ‘నేను వారిని స్వస్థపరచకూడదు’
  alternative: ‘నేను వారిని స్వస్థపరుస్తాను’
  rationale: రూపపరంగా గ్రీకు క్రియ భవిష్యత్ సూచకమైనదే; అయితే వాక్యంలోని ἵνα μή నిర్మాణం కారణంగా అది జరగకుండా ఉండే ఫలితాన్ని ఉద్దేశిస్తుంది. ప్రధాన అనువాదం ఆ వాక్య సంబంధాన్ని తెలుగులో సహజంగా చూపుతుంది; రూపపరమైన ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రవక్తీయ శైలి వాడబడింది. మూలంలోని కవితాత్మక సమాంతర నిర్మాణం కోసం పంక్తి విభజన ఉంచబడింది. ‘హృదయం’ ఏకవచనాన్ని సమూహార్థకంగా నిలిపాం; దైవిక కర్తృత్వాన్ని మృదువుచేయలేదు.
