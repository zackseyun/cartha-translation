id: JHN.12.19
reference: John 12:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: te
  text: అందుచేత పరిసయ్యులు ఒకరితో ఒకరు, “మీరు ఏమీ సాధించలేకపోతున్నారని చూస్తున్నారు కదా! చూడండి, లోకం అతని వెంట వెళ్లిపోయింది[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అందరూ అతని వెంట వెళ్లిపోయారు.” గ్రీకులో “లోకం” అని ఉంది; ఇది బహుశా అలంకారిక అతిశయోక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అందుచేత
  rationale: ముందటి సంఘటన ఫలితంగా పరిసయ్యులు ఇలా స్పందించారని సూచించే అనుసంధానాన్ని సహజంగా నిలుపుతుంది.
- source_word: πρὸς ἑαυτούς
  choice: ఒకరితో ఒకరు
  rationale: ఇక్కడ సమూహంలోని పరిసయ్యులు పరస్పరం మాట్లాడుకున్నారనే అన్యోన్య భావం ఉంది.
- source_word: Θεωρεῖτε
  choice: చూస్తున్నారు కదా
  rationale: ఇది బహువచన వర్తమాన సూచనార్థక రూపం; విసుగుతో ఒకరినొకరు ఉద్దేశించి చెబుతున్న వాక్యబలాన్ని ‘కదా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: మీరు ఏమీ సాధించలేకపోతున్నారు
  rationale: యేసును అడ్డుకునే తమ ప్రయత్నాలు ఫలించడం లేదనే సందర్భోచిత భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἴδε
  choice: చూడండి
  rationale: శ్రద్ధను ఆకర్షించే ఆకస్మిక ఉద్ఘాటనను ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: κόσμος
  choice: లోకం
  rationale: గ్రీకు పదరూపాన్ని, యోహాను రచనలో దాని ప్రతిధ్వనిని నిలుపుతూ, ఇక్కడి అతిశయోక్తిని ప్రధాన పాఠ్యంలో సంకుచితం చేయదు.
- source_word: ὀπίσω αὐτοῦ
  choice: అతని వెంట
  rationale: ఎవరినైనా అనుసరించడాన్ని సూచించే గ్రీకు నుడికారాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లిపోయింది
  rationale: పరిసయ్యుల దృష్టిలో ఇప్పటికే సంభవించి ఇప్పుడు స్పష్టంగా కనిపిస్తున్న ఫలితాన్ని తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: κόσμος అనే పదం సూచించే పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘లోకం’ అని ఉంచి, దాన్ని పరిసయ్యుల అతిశయోక్తిగా పాదసూచికలో వివరించడం
  alternative: ‘అందరూ అతని వెంట వెళ్లిపోయారు’ లేదా ‘జనమంతా అతని వెంట వెళ్లిపోయింది’
  rationale: విసుగుతో మాట్లాడుతున్న పరిసయ్యుల అలంకారిక అతిశయోక్తిని అలాగే నిలుపుతుంది; ప్రతి మనిషీ యేసును అనుసరించాడనే సిద్ధాంతార్థాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘చూస్తున్నారు కదా!’ మరియు ‘చూడండి’ ద్వారా పరిసయ్యుల విసుగు, ఆకస్మిక ఉద్ఘాటన నిలుపబడ్డాయి.
