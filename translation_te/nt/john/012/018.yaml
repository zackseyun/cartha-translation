  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: te
  text: ఈ కారణంగానే జనసమూహం కూడా ఆయనను కలవడానికి వెళ్లింది[a]; ఎందుకంటే ఆయన ఈ సూచక కార్యాన్ని చేశాడని వారు విన్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జనసమూహం ఆయనను కలుసుకుంది” లేదా “ఆయనను కలవడానికి బయలుదేరింది.” గ్రీకు క్రియలో ఒకరిని కలవడానికి వారి వైపు వెళ్లే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “సూచక కార్యం” అనేది యోహాను సువార్తలో యేసు వ్యక్తిత్వాన్ని, కార్యనియోగాన్ని సూచించే అద్భుత కార్యానికి వాడే పదం; మరో అనువాదం, “అద్భుతం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ఈ కారణంగానే
  rationale: ముందటి సందర్భంతో ఉన్న స్పష్టమైన కారణ సంబంధాన్ని సహజమైన తెలుగులో చూపుతుంది; ‘-నే’ కారణాన్ని ఉద్ఘాటిస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: గ్రీకు సంధానపదంలోని అదనపు భావాన్ని అతిగా బలపరచకుండా నిలుపుతుంది.
- source_word: ὑπήντησεν αὐτῷ
  choice: ఆయనను ఎదుర్కొనడానికి వెళ్లింది
  rationale: ఎవరినైనా కలుసుకోవడానికి వారి వైపు వెళ్లడం అనే క్రియలోని దిశాభావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ ὄχλος
  choice: జనసమూహం
  rationale: సమూహంగా కూడిన ప్రజలను సూచించే సహజమైన ఆధునిక తెలుగు పదం; ఏకవచన సమూహవాచకానికి అనుగుణంగా క్రియను ఏకవచనంలో ఉంచింది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: జనసమూహం చేసిన చర్యకు కారణాన్ని పరిచయం చేస్తున్న causal అర్థాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: ἤκουσαν
  choice: విన్నారు
  rationale: గ్రీకు aorist‌కు సహజమైన భూతకాల రూపం; కాలక్రమం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: ఆయన ఈ సూచకకార్యాన్ని చేశాడని
  rationale: పూర్తయిన కార్యాన్ని తెలిపే perfect infinitive భావాన్ని సహజమైన తెలుగు పరోక్ష వాక్యంతో అందిస్తుంది; demonstrative మరియు noun కలయికను ‘ఈ సూచకకార్యం’గా ఉంచుతుంది.
- source_word: τὸ σημεῖον
  choice: సూచకకార్యం
  rationale: యోహాను వాడుకలో అద్భుత కార్యం యేసు వ్యక్తిత్వం, కార్యనియోగం వైపు సూచించే భావాన్ని ‘అద్భుతం’ కంటే స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: యోహాను సువార్తలో σημεῖον అనువాదం
  choice: సూచకకార్యం
  alternative: అద్భుతం
  rationale: ఈ పదం కార్యంలోని ఆశ్చర్యకర స్వభావాన్ని మాత్రమే కాక, అది యేసు ఎవరో వెల్లడించే సూచనగా పనిచేస్తుందనే యోహాను ప్రత్యేక భావాన్ని కూడా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఎదుర్కొనడానికి’ ఇక్కడ ప్రతిఘటించడం కాదు, ఎదురుగా వెళ్లి కలుసుకోవడం అనే అర్థంలో ఉంది; ఆ సాధ్యమైన అపార్థాన్ని పాదటిప్పణి వివరిస్తుంది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
