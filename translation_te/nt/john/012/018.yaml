  to: ఈ కారణంగానే జనసమూహం కూడా ఆయనను కలవడానికి వెళ్లింది[a]; ఎందుకంటే ఆయన ఈ సూచక కార్యాన్ని చేశాడని వారు విన్నారు[b].
