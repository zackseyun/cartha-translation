id: JHN.12.25
reference: John 12:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: te
  text: తన ప్రాణాన్ని[a] ప్రేమించేవాడు దాన్ని పోగొట్టుకుంటాడు; ఈ లోకంలో తన ప్రాణాన్ని ద్వేషించేవాడు[b] దాన్ని నిత్యజీవం కొరకు కాపాడుకుంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రాణం’ అని అనువదించిన గ్రీకు పదం ψυχή; సందర్భాన్ని బట్టి దీనికి ‘జీవితం’, ‘తన ఉనికి’, లేదా ‘ఆత్మ’ అనే అర్థాలు కూడా రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘తన ప్రాణాన్ని ద్వేషించడం’ అనేది ఈ లోకంలోని తన ప్రాణంపై మమకారాన్ని విడిచిపెట్టడాన్ని తెలిపే ఉద్దేశపూర్వక విరోధాభాసం; ఇది తనను తాను అసహ్యించుకోవాలని చెప్పడం కాదు. ఇలాంటి మాటతీరుకు లూకా 14:26 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: ప్రేమించేవాడు
  rationale: కర్తగా వాడిన వర్తమాన కృదంతం సాధారణంగా అలాంటి స్వభావం కలిగిన వ్యక్తిని సూచిస్తుంది; ‘ప్రేమించేవాడు’ సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ψυχή
  choice: ప్రాణం
  rationale: ఈ సందర్భంలో ψυχή ప్రధానంగా ఒక వ్యక్తి ప్రస్తుత జీవాన్ని లేదా తన ఉనికిని సూచిస్తుంది. కోల్పోవడం–కాపాడుకోవడం అనే వ్యతిరేక సమాంతరానికి ‘ప్రాణం’ సహజంగా సరిపోతుంది; ‘ఆత్మ’ అనే అర్థాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా మోపదు.
- source_word: ἀπολλύει
  choice: పోగొట్టుకుంటాడు
  rationale: తన ప్రాణాన్ని పట్టుకొని ఉండాలనే వైఖరి చివరకు దానిని కోల్పోవడానికి దారితీస్తుందనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘నాశనం చేస్తాడు’ అనేది అవసరానికి మించిన సకర్మక తీవ్రతను కలిగిస్తుంది.
- source_word: ὁ μισῶν
  choice: ద్వేషించేవాడు
  rationale: μισέω యొక్క ఉద్దేశపూర్వకమైన కఠిన, విరోధాభాస పదబలాన్ని తగ్గించకుండా నిలుపుతుంది. దాని సందర్భార్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: ఈ లోకంలో
  rationale: ప్రస్తుత లోకవ్యవస్థలోని జీవితం పట్ల మమకారాన్ని నిత్యజీవంతో వ్యతిరేకంగా చూపించే యోహాను సందర్భానికి ఇది సహజమైన అనువాదం.
- source_word: φυλάξει
  choice: కాపాడుకుంటాడు
  rationale: భవిష్యత్ క్రియను, అలాగే ‘పోగొట్టుకుంటాడు’ అనే క్రియతో ఉన్న వ్యతిరేకతను స్పష్టంగా నిలుపుతుంది.
- source_word: εἰς ζωὴν αἰώνιον
  choice: నిత్యజీవం కొరకు
  rationale: εἰς సూచించే గమ్యం లేదా ఫలిత దిశను సంక్షిప్తంగా తెలియజేస్తుంది; మూలంలోని సంబంధాన్ని అతిగా వివరించదు.
- source_word: αὐτοῦ / αὐτήν
  choice: తన / దాన్ని
  rationale: ఒకే వ్యక్తిని సూచించే గ్రీకు ఏకవచన నిర్మాణాన్ని తెలుగులో సహజంగా కొనసాగిస్తుంది.
theological_decisions:
- issue: ‘తన ప్రాణాన్ని ద్వేషించడం’ అనే మాట అర్థం
  choice: ‘ద్వేషించేవాడు’ అనే కఠిన పదాన్ని ప్రధాన పాఠ్యంలో అలాగే ఉంచి, ప్రస్తుత లోకంలోని ప్రాణంపై మమకారాన్ని విడిచిపెట్టడమనే విరోధాభాసంగా పాదసూచికలో వివరించడం.
  alternative: ‘తన ప్రాణాన్ని తక్కువగా ప్రేమించేవాడు’ లేదా ‘తన ప్రాణాన్ని లెక్కచేయనివాడు’ అని మృదువుగా అనువదించడం.
  rationale: మూలంలో μισέω అనే బలమైన క్రియ ఉంది. ‘ఈ లోకంలో’ అనే పరిమితి దాని సందర్భాన్ని నిర్దేశిస్తుంది. ప్రధాన పాఠ్యంలోనే భావాన్ని మృదువుగా మార్చితే యేసు మాటలోని ఉద్దేశపూర్వక ఉద్రిక్తత పోతుంది.
- issue: ψυχή యొక్క అర్థం
  choice: రెండు చోట్లా ‘ప్రాణం’ అని అనువదించడం.
  alternative: ‘ఆత్మ’, ‘జీవితం’, లేదా ‘తన ఉనికి’.
  rationale: ఇక్కడ కోల్పోయే లేదా కాపాడుకునే వ్యక్తిగత జీవమే ముందున్న భావం. ‘ఆత్మ’ అని మాత్రమే అనువదించడం మూలం తప్పనిసరిగా బోధించని శరీర–ఆత్మ విభజనను సూచించే ప్రమాదం ఉంది; విస్తృత అర్థపరిధిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉండే ఏకవచన సామాన్య నిర్మాణం వాడబడింది. ‘ప్రాణం’, ‘పోగొట్టుకుంటాడు’, ‘కాపాడుకుంటాడు’ అనే పదాలు సామాన్య పాఠకులకు సులభంగా అర్థమవుతూనే మూలంలోని సమాంతరతను నిలుపుతాయి.
