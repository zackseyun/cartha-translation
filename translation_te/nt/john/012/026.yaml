  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: te
  text: ఎవరైనా నాకు సేవ చేస్తే[a], అతడు నన్ను అనుసరించాలి. నేను ఎక్కడ ఉన్నానో, అక్కడ నా సేవకుడు కూడా ఉంటాడు. ఎవరైనా నాకు సేవ చేస్తే, తండ్రి అతణ్ణి గౌరవిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో సాధారణార్థక పుంలింగ ఏకవచన నిర్మాణం ఉంది: ‘ఎవరైనా నాకు సేవ చేస్తే ... తండ్రి అతణ్ణి గౌరవిస్తాడు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονῇ
  choice: సేవ చేస్తే
  rationale: యేసుకు సేవ చేయడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సంఘపరమైన అధికార పదవిని సూచించదు.
- source_word: ἀκολουθείτω
  choice: అతడు నన్ను అనుసరించాలి
  rationale: వర్తమాన ఆజ్ఞార్థక రూపంలోని శిష్యత్వపు ఆజ్ఞను సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది; కొనసాగింపు భావాన్ని అతిగా విస్తరించదు.
- source_word: διάκονος
  choice: నా సేవకుడు
  rationale: ఇక్కడ సాధారణంగా యేసుకు సేవచేసే వ్యక్తిని సూచిస్తుంది; ‘పరిచారకుడు’ లేదా సంఘపదవిని సూచించే పదం కంటే సందర్భానికి స్పష్టమైనది.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: నేను ఎక్కడ ఉంటానో
  rationale: ἐγώలోని ఉద్ఘాటనను తెలుగు సర్వనామం సహజంగా మోస్తుంది; కృత్రిమమైన ‘నేనే’ను చేర్చదు.
- source_word: ἐκεῖ καὶ
  choice: అక్కడ ... కూడా
  rationale: స్థలార్థకమైన ἐκεῖను, చేర్పును తెలిపే καίను రెండింటినీ నిలుపుతుంది.
- source_word: τιμήσει
  choice: గౌరవిస్తాడు
  rationale: τιμάω తెలిపే గౌరవం ఇవ్వడం అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేసి భవిష్య వాగ్దానాన్ని నిలుపుతుంది.
- source_word: ὁ πατήρ
  choice: తండ్రి
  rationale: గ్రీకులో ఉన్నట్లే ‘తండ్రి’ అని ఉంచి, మూలంలో లేని ‘నా’ అనే స్వామ్యపదాన్ని చేర్చదు.
- source_word: τις
  choice: ఎవరైనా
  rationale: లింగపరంగా అందరినీ చేర్చే గ్రీకు అనిశ్చిత సర్వనామ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: αὐτὸν
  choice: అతణ్ణి
  rationale: గ్రీకు పుంలింగ ఏకవచన సర్వనామ రూపాన్ని, ముందున్న సాధారణార్థక ‘ఎవరైనా’తో దాని అనుసంధానాన్ని నిలుపుతుంది.
theological_decisions:
- issue: షరతు వాక్యంలోని సాధారణార్థక పుంలింగ సూచన
  choice: τιςను ‘ఎవరైనా’గా అనువదించి, తరువాతి పుంలింగ ఏకవచన సూచనలను ‘అతడు/అతణ్ణి’గా ఉంచడం.
  alternative: అంతటా లింగనిరపేక్ష బహువచన లేదా ‘ఆ వ్యక్తి’ వంటి రూపాలను వాడడం.
  rationale: గ్రీకు అనిశ్చిత సర్వనామం అందరినీ సూచించినప్పటికీ దానితో పుంలింగ ఏకవచన అన్వయం ఉంది. తెలుగు పాఠం ఈ రెండింటినీ పాదటిప్పణితో పారదర్శకంగా నిలుపుతుంది.
- issue: సేవకు లభించే గౌరవ స్వరూపం
  choice: ‘తండ్రి అతణ్ణి గౌరవిస్తాడు’ అని వివరణ లేకుండా వాగ్దానాన్ని నేరుగా ఉంచడం.
  alternative: దీనిని పరలోక ప్రతిఫలం లేదా అంత్యకాల మహిమగా ప్రధాన పాఠంలో నిర్దిష్టీకరించడం.
  rationale: ఈ వచనం గౌరవం యొక్క ఖచ్చిత రూపాన్ని చెప్పదు; కాబట్టి గ్రీకు వాక్యంలోని ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘సేవకుడు’ అనే పదం సంఘపదవిని కాక యేసుకు సేవచేసేవాణ్ణి సూచిస్తుంది. ఆజ్ఞార్థక భావానికి సహజమైన ‘అనుసరించాలి’ వాడబడింది.
