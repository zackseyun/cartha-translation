review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two conditional statements, service to Jesus, the imperative to follow him, the servant’s presence where Jesus is, and the Father’s future honoring. However, “నేను ఎక్కడ ఉంటానో” is naturally prospective in Telugu (“where I will be”), while ὅπου εἰμὶ ἐγώ is present (“where I am”). “నేను ఎక్కడ ఉన్నానో” preserves the Greek tense without foreclosing the verse’s broader contextual implications.
  naturalness: The wording is clear, modern standard Telugu, and suitably reverent without becoming archaic. “సేవ చేస్తే,” “నన్ను అనుసరించాలి,” and “గౌరవిస్తాడు” are natural. The revision to “ఉన్నానో” is equally idiomatic and more precise.
  terminology: “సేవ చేయడం/సేవకుడు” appropriately renders διακονέω/διάκονος without implying the ecclesial office of deacon. “తండ్రి” correctly reflects ὁ πατήρ without adding “నా.” The generic “ఎవరైనా” and the masculine-singular references “అతడు/అతణ్ణి” transparently retain the source’s form; the footnote is appropriate.
  issues:
  - severity: medium
    issue: The relative verb “ఉంటానో” is prospective.
    rationale: Greek ὅπου εἰμὶ ἐγώ uses the present εἰμί, “where I am.” In Telugu, “నేను ఎక్కడ ఉంటానో” normally means “where I will be,” introducing a future nuance not expressed by the Greek. “నేను ఎక్కడ ఉన్నానో” retains the present reference.
