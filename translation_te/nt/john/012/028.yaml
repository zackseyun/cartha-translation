id: JHN.12.28
reference: John 12:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: te
  text: '“తండ్రీ, నీ నామాన్ని మహిమపరచు.” అప్పుడు పరలోకం నుండి ఒక స్వరం వచ్చింది: “నేను దాన్ని మహిమపరిచాను; మళ్లీ మహిమపరుస్తాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάτερ
  choice: తండ్రీ
  rationale: దేవుణ్ణి నేరుగా సంబోధించే ఏకవచన రూపం. గ్రీకులో లేని ‘నా’ అనే స్వామ్యార్థాన్ని చేర్చలేదు.
- source_word: δόξασόν
  choice: మహిమపరచు
  rationale: δοξάζω అనే క్రియలోని యోహాను సువార్తకు ముఖ్యమైన ‘మహిమను వెల్లడించడం’ అనే భావాన్ని నిలుపుతుంది; ‘గౌరవించు’ కంటే ఇది మూలపదానికి, సందర్భానికి దగ్గరగా ఉంది.
- source_word: σου τὸ ὄνομα
  choice: నీ నామాన్ని
  rationale: దేవుని పేరు మాత్రమే కాక ఆయన వెల్లడైన స్వభావం, ఘనత అనే బైబిలీయ భావభారాన్ని ‘నామం’ నిలుపుతుంది.
- source_word: ἦλθεν οὖν
  choice: అప్పుడు ... వచ్చింది
  rationale: οὖν ఇక్కడ కథనంలోని తదుపరి పరిణామాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఉంది.
- source_word: φωνὴ ἐκ τοῦ οὐρανοῦ
  choice: పరలోకం నుండి ఒక స్వరం
  rationale: తరువాత ప్రత్యక్ష వాక్యం ఉన్నందున φωνή అంటే ‘స్వరం’; ἐκ τοῦ οὐρανοῦ దాని దైవిక మూలాన్ని సూచిస్తున్నందున ‘పరలోకం నుండి’ అని అనువదించాం.
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: నేను దాన్ని మహిమపరిచాను; మళ్లీ మహిమపరుస్తాను
  rationale: ἐδόξασα అనే ఏరిస్ట్ రూపాన్ని సహజమైన తెలుగు భూతకాలంతో, δοξάσω అనే భవిష్యత్ రూపాన్ని భవిష్యత్ కాలంతో అందించాం. πάλιν రెండవ క్రియతో కలిసి ‘మళ్లీ’ అనే భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: దైవిక జవాబులో వ్యక్తంగా లేని కర్మకు సూచన
  choice: ‘దాన్ని’ అని చేర్చి, ముందున్న ‘నీ నామాన్ని’ సూచించడం
  alternative: కర్మను వ్యక్తం చేయకుండా ‘నేను మహిమపరిచాను; మళ్లీ మహిమపరుస్తాను’ అని ఉంచడం
  rationale: గ్రీకులో కర్మ సందర్భం వల్ల అర్థమవుతుంది. తెలుగులో ‘దాన్ని’ చేర్చడం వల్ల తండ్రి తన నామాన్నే మహిమపరచడం గురించి చెబుతున్నాడనే వాక్యసంబంధం సహజంగా, స్పష్టంగా ఉంటుంది.
- issue: యోహాను సువార్తలో δοξάζω పదానికి ఉన్న దైవశాస్త్రీయ భావభారం
  choice: మహిమపరచు
  alternative: గౌరవించు
  rationale: ‘మహిమపరచు’ అనే పదం తండ్రి, కుమారునికి సంబంధించిన యోహాను సువార్తలోని మహిమ భావజాలాన్ని కాపాడుతుంది; ‘గౌరవించు’ ఆ భావాన్ని బలహీనపరచవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. దేవునికి ప్రత్యక్ష సంబోధనలో ‘తండ్రీ’ వాడబడింది. మూలంలోని కాలభేదం, ‘నామం/మహిమ’ పదజాలం నిలుపబడ్డాయి. తెలుగు భూతకాల రూపమే గ్రీకు ఏరిస్ట్‌ను సహజంగా వ్యక్తం చేస్తున్నందున ఆంగ్లంలోని simple past/present perfect ప్రత్యామ్నాయానికి ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
