id: JHN.12.49
reference: John 12:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: te
  text: ఎందుకంటే, నేను నా అంతట నేనే మాట్లాడలేదు[a]; అయితే నన్ను పంపిన తండ్రి స్వయంగా నేను ఏమి చెప్పాలో, ఏమి మాట్లాడాలో[b] నాకు ఆజ్ఞ ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా సొంతంగా’ లేదా ‘నా సొంత అధికారంతో.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ఇక్కడ ‘చెప్పడం,’ ‘మాట్లాడడం’ అనే అర్థాలుగల రెండు వేర్వేరు క్రియలు ఉన్నాయి; అనువాదంలో ఆ భేదాన్ని నిలిపాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: నా అంతట నేనే
  rationale: ఈ గ్రీకు నుడికారం యేసు స్వతంత్రంగా లేదా తన సొంత అధికారంతో మాట్లాడలేదనే భావాన్ని తెలియజేస్తుంది. ‘నా అంతట నేనే’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని భావపరమైన విస్తృతిని కాపాడుతుంది.
- source_word: οὐκ ἐλάλησα
  choice: మాట్లాడలేదు
  rationale: గ్రీకు ఏఓరిస్ట్ రూపాన్ని సహజమైన తెలుగు భూతకాలంతో అనువదించాం. సందర్భంలో ఇది అప్పటివరకు యేసు చేసిన బోధనను సమగ్రంగా సూచిస్తుంది.
- source_word: ὁ πέμψας με πατὴρ
  choice: నన్ను పంపిన తండ్రి
  rationale: క్రియాత్మక విశేషణ రూపాన్ని తెలుగులో సహజమైన సంబంధవాచక నిర్మాణంగా ఇచ్చాం. ‘తండ్రి’ ఇక్కడ దేవుణ్ణి సూచించే సందర్భోచిత బిరుదు.
- source_word: αὐτός
  choice: తండ్రే
  rationale: గ్రీకులోని ఉద్ఘాటనను తెలుగు ‘ఏ’ ప్రత్యయంతో సహజంగా నిలిపాం.
- source_word: ἐντολήν
  choice: ఆజ్ఞ
  rationale: ఇది అధికారపూర్వకమైన నిర్దేశాన్ని సూచిస్తుంది. ‘ఉపదేశం’ కంటే ‘ఆజ్ఞ’ మూలపద బలాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: δέδωκεν
  choice: ఇచ్చాడు
  rationale: గ్రీకు పర్ఫెక్ట్ గతంలో ఇచ్చిన ఆజ్ఞకు కొనసాగుతున్న ప్రాముఖ్యత ఉందని సూచిస్తుంది. తెలుగులో ‘ఆజ్ఞ ఇచ్చాడు’ సహజంగా ఉండగా, సందర్భమే దాని కొనసాగుతున్న వర్తనను తెలియజేస్తుంది.
- source_word: τί εἴπω
  choice: నేను ఏమి చెప్పాలో
  rationale: ఆజ్ఞలో నిర్దేశించిన విషయాన్ని తెలిపే పరోక్ష ప్రశ్నను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ τί λαλήσω
  choice: ఏమి మాట్లాడాలో
  rationale: మూలంలో λέγω, λαλέω అనే రెండు వేర్వేరు క్రియలు ఉన్నాయి. ‘చెప్పు’, ‘మాట్లాడు’ అనే వేర్వేరు తెలుగు క్రియలతో ఆ పదభేదాన్ని సాధ్యమైనంతవరకు నిలిపాం.
theological_decisions:
- issue: కుమారుని మాటలకు తండ్రి ఇచ్చిన ఆజ్ఞతో ఉన్న సంబంధం
  choice: యేసు తనంతట తానే మాట్లాడకుండా, తనను పంపిన తండ్రి ఇచ్చిన ఆజ్ఞ ప్రకారం మాట్లాడుతున్నాడనే వాక్యార్థాన్ని నిలిపాం.
  alternative: యేసు తండ్రితో కేవలం ఏకీభవిస్తున్నాడని లేదా సాధారణ మానవ ప్రవక్తగా మాత్రమే మాట్లాడుతున్నాడని స్పష్టీకరించి అనువదించడం.
  rationale: ‘నా అంతట నేనే మాట్లాడలేదు’, ‘తండ్రే ... ఆజ్ఞ ఇచ్చాడు’ అనే మూలపాఠపు మాటలు ఆయన పంపబడిన కార్యంలో ఉన్న సంబంధాన్ని స్పష్టంగా చెబుతాయి. అయితే ఈ వచనం స్వయంగా చెప్పనిదాన్ని జోడించి స్వభావపరమైన హీనతగానీ, స్వతంత్ర చర్యగానీ నిర్ణయించలేదు.
- issue: πατήρ పద ప్రయోగం
  choice: తండ్రి
  alternative: జనకుడు
  rationale: యోహాను సందర్భంలో ఇది దేవుణ్ణి సూచించే సంబంధపూర్వక బిరుదు. ‘తండ్రి’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైనది, గౌరవప్రదమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువదించాం. ‘తండ్రే’ ఉద్ఘాటనను నిలుపుతుంది; ‘చెప్పాలో, మాట్లాడాలో’ అనే స్వల్ప పునరుక్తి మూలంలోని రెండు క్రియల భేదాన్ని ఉద్దేశపూర్వకంగా కాపాడుతుంది.
