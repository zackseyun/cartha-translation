id: JHN.12.2
reference: John 12:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐποίησαν οὖν αὐτῷ δεῖπνον ἐκεῖ, καὶ ἡ Μάρθα διηκόνει, ὁ δὲ Λάζαρος εἷς ἦν ⸀ἐκ τῶν ἀνακειμένων σὺν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: te
  text: కాబట్టి అక్కడ వారు ఆయన కోసం భోజనం సిద్ధం చేశారు. మార్త వడ్డిస్తూ ఉండింది; లాజరు మాత్రం ఆయనతో కలిసి భోజనానికి ఆనుకొని పడుకున్నవారిలో[a] ఒకడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆయనతో కలిసి ఆనుకొని పడుకున్నవారిలో.” ఆ కాలంలో భోజనం చేసేటప్పుడు ఆనుకొని పడుకోవడం ఆనవాయితీ.
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: సిద్ధం చేశారు
  rationale: ποιέω అనే క్రియ δεῖπνονతో కలిసి ఇక్కడ భోజనం ఏర్పాటు చేయడం లేదా సిద్ధం చేయడం అనే అర్థాన్ని ఇస్తుంది. కర్తలు ఎవరో వచనం చెప్పనందున తెలుగులోనూ ‘వారు’గానే ఉంచాం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భం నుంచి వచ్చే కథన సంబంధాన్ని, స్వల్పమైన ఫలిత భావాన్ని నిలుపుతుంది.
- source_word: αὐτῷ
  choice: ఆయన కోసం
  rationale: ఈ దత్తివిభక్తి విందు యేసు నిమిత్తం సిద్ధం చేయబడిందని సూచిస్తుంది.
- source_word: δεῖπνον
  choice: విందు
  rationale: ప్రధాన భోజనాన్ని సూచిస్తుంది. ‘విందు’ సందర్భానికి సహజంగా సరిపోతుంది; అయితే అతిశయమైన మహా విందు భావాన్ని ఉద్దేశించదు.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: ముందటి వచనంలో పేర్కొన్న బేతనియను సూచించే స్థలవాచక క్రియావిశేషణం.
- source_word: διηκόνει
  choice: వడ్డిస్తూ ఉంది
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న సేవను చూపుతుంది. భోజన సందర్భంలో ‘వడ్డించడం’ సహజమైన తెలుగు; మతపరమైన ప్రత్యేకార్థాన్ని చేర్చదు.
- source_word: δὲ
  choice: మాత్రం
  rationale: మార్త వడ్డిస్తుండటానికి, లాజరు భోజనంలో కూర్చుండటానికి మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἷς ἦν ἐκ
  choice: వారిలో ఒకడు
  rationale: లాజరు ఆ సమూహంలోని ఒక సభ్యుడని తెలిపే గ్రీకు నుడికారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀνακειμένων
  choice: భోజనానికి కూర్చున్నవారిలో
  rationale: మూలపదం భోజన సమయంలో ఆనుకుని పడుకొని తినే అప్పటి ఆచారాన్ని సూచిస్తుంది. ప్రధాన వాక్యంలో సహజమైన ఆధునిక తెలుగు కోసం ‘కూర్చున్న’ అని ఇచ్చి, నిర్దిష్ట భంగిమను పాదటిప్పణిలో వివరించాం.
- source_word: σὺν αὐτῷ
  choice: ఆయనతో పాటు
  rationale: యేసుతో సహవాసంగా అదే భోజనంలో ఉన్నారని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. యేసును సూచించే సర్వనామానికి గౌరవార్థక రూపం వాడాం. మూలంలోని కర్త అస్పష్టతను ‘వారు’ ద్వారా అలాగే నిలిపాం; సాంస్కృతిక భోజన భంగిమను ప్రధాన వాక్యంలో భారంగా చేయకుండా పాదటిప్పణిలో స్పష్టం చేశాం.
