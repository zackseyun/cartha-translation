- from: కాబట్టి అక్కడ వారు ఆయన కోసం విందు సిద్ధం చేశారు. మార్త వడ్డిస్తూ ఉంది; లాజరు మాత్రం ఆయనతో పాటు భోజనానికి కూర్చున్నవారిలో[a] ఒకడు.
  to: కాబట్టి అక్కడ వారు ఆయన కోసం భోజనం సిద్ధం చేశారు. మార్త వడ్డిస్తూ ఉండింది; లాజరు మాత్రం ఆయనతో కలిసి భోజనానికి ఆనుకొని పడుకున్నవారిలో[a] ఒకడు.
  rationale: The revision retains the Greek’s narrative connection, unspecified plural subject, meal prepared for Jesus, Martha’s ongoing service, and Lazarus’s status as one among those dining with him. It restores the explicit reclining posture of ἀνακειμένων and retains a concise cultural note to prevent misunderstanding.
