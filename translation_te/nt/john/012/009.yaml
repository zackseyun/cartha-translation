id: JHN.12.9
reference: John 12:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: te
  text: కాబట్టి, ఆయన అక్కడ ఉన్నాడని యూదులలోని[a] పెద్ద జనసమూహం తెలుసుకుంది. వారు యేసు కారణంగా మాత్రమే కాకుండా, ఆయన మృతులలో నుండి లేపిన లాజరును కూడా చూడడానికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయవారిలోని.” గ్రీకు పదం సాధారణంగా యూదు ప్రజలను సూచించవచ్చు; యోహాను సువార్తలోని కొన్ని సందర్భాల్లో అది ప్రత్యేకంగా యూదయ ప్రాంతానికి చెందినవారిని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔγνω
  choice: తెలుసుకుంది
  rationale: ఇక్కడ aorist రూపం ముందే తెలిసి ఉండడాన్ని కాక, ఒక సమాచారాన్ని తెలుసుకోవడాన్ని సూచిస్తుంది. సమూహం ఏకవచన సమష్టి నామం కావడంతో ‘తెలుసుకుంది’ సహజంగా సరిపోతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భం నుంచి వచ్చే కథన పర్యవసానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὄχλος πολὺς
  choice: పెద్ద జనసమూహం
  rationale: ఒక గణనీయమైన సమూహం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: యూదులలోని
  rationale: ἐκ అనే పదంలోని ‘వారిలో నుండి/వారిలోని’ భావాన్ని నిలుపుతూ, ఈ జనసమూహం యూదులలో ఒక భాగమని సూచిస్తుంది. Ἰουδαῖοι పదంలోని సందర్భాధారిత అస్పష్టతను పాదసూచికలో ఉంచాం.
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: ఆయన అక్కడ ఉన్నాడని
  rationale: గ్రీకులో వర్తమాన కాలం ఉన్నప్పటికీ, గతకాల కథనంలోని ‘తెలుసుకుంది’కు అనుగుణంగా తెలుగు పరోక్ష వాక్యంలో ‘ఉన్నాడని’ సహజం. సందర్భం ప్రకారం సూచిత కర్త యేసు.
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: యేసు కారణంగా మాత్రమే కాకుండా
  rationale: διά + accusative ఇక్కడ కారణం లేదా ప్రేరణను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἀλλ’ ἵνα καὶ ... ἴδωσιν
  choice: కాకుండా ... కూడా చూడడానికి
  rationale: వ్యతిరేక సమన్వయంతో పాటు ἵνα తెలిపే ఉద్దేశాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: ఆయన మృతులలో నుండి లేపిన
  rationale: లాజరును తిరిగి జీవింపజేసిన కార్యాన్ని సూచిస్తూ, ἐκ νεκρῶν అనే మూలపాఠ రూపకాన్ని ‘మృతులలో నుండి’గా నిలుపుతుంది.
theological_decisions:
- issue: యోహాను సువార్తలో Ἰουδαίων పదం యొక్క అర్థపరిధి
  choice: యూదులలోని
  alternative: యూదయవారిలోని
  rationale: ఈ పదం యూదు ప్రజలను సాధారణంగా సూచించవచ్చు; కొన్ని యోహాను సందర్భాల్లో యూదయ ప్రాంతానికి చెందినవారిని మరింత ప్రత్యేకంగా సూచించవచ్చు. ఇక్కడ పండుగకు సంబంధించిన ప్రజాసందర్భం విస్తృతమైన ‘యూదులు’ అనే అర్థానికి అనుకూలమైనా, భౌగోళిక ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలోని కారణం, ఉద్దేశం, సమష్టి జనసమూహ భావాలను సహజంగా నిలిపాం; Ἰουδαῖοι పదంలోని నిజమైన సందర్భాధారిత అస్పష్టతను పాదసూచికలో సంరక్షించాం.
