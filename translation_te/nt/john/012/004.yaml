base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: te
  text: 'అయితే ఆయన శిష్యుల్లో ఒకడైన యూదా ఇస్కరియోతు—ఆయనను అప్పగించబోయేవాడు—ఇలా అన్నాడు: [a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భానుసారం, “ఆయనకు ద్రోహం చేయబోయేవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథన శైలిలో భూతకాల రూపం సహజంగా ఉండి అదే కథన కార్యాన్ని తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మరియ చేసిన కార్యానికి, వెంటనే వచ్చే యూదా అభ్యంతరానికి మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: యూదా ఇస్కరియోతు
  rationale: ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణమైన పేరురూపం.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: ఆయన శిష్యుల్లో ఒకడైన
  rationale: μαθητήςలోని గురు-శిష్య సంబంధాన్ని ‘శిష్యుడు’ స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ μέλλων
  choice: బోయేవాడు
  rationale: త్వరలో జరగనున్న చర్యను సూచించే μέλλω భావాన్ని తెలుగు క్రియారూపంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παραδιδόναι
  choice: అప్పగించబోయేవాడు
  rationale: παραδίδωμι యొక్క ప్రాథమిక ‘అప్పగించు’ భావాన్ని నిలుపుతూ, యూదా చర్యలోని ద్రోహార్థాన్ని సందర్భమే వెల్లడించనిస్తుంది.
theological_decisions:
- issue: యూదా యేసుపట్ల చేయబోయే చర్యకు παραδιδόναι అనువాదం
  choice: అప్పగించబోయేవాడు
  alternative: ద్రోహం చేయబోయేవాడు
  rationale: ‘ద్రోహం చేయు’ సందర్భార్థాన్ని స్పష్టపరుస్తుంది; అయితే ‘అప్పగించు’ మూల క్రియ యొక్క విస్తృత అర్థాన్ని, తరువాతి అధికారులకు అప్పగింపు భావాన్ని, ఇతర సందర్భాలతో పదసంబంధాన్ని కాపాడుతుంది. నైతిక స్వభావాన్ని పాఠకుడు సందర్భం ద్వారా గ్రహించగలడు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే కథన శైలి. గ్రీకు వాక్యం తదుపరి వచనంలోని ప్రత్యక్ష మాటకు దారితీసేందున చివర ద్విబిందువు వాడబడింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
