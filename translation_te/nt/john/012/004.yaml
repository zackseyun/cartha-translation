  source_fidelity: 'మూల గ్రీకు భావానికి ప్రధాన పాఠ్యం విశ్వసనీయంగా ఉంది: δέకు ‘అయితే,’ εἷς τῶν μαθητῶν αὐτοῦకు ‘ఆయన శిష్యుల్లో ఒకడైన,’ మరియు μέλλων παραδιδόναιకు ‘ఆయనను అప్పగించబోయేవాడు’ సరిపోతాయి. అయితే ఇచ్చిన పాదసూచిక ప్రధాన పాఠ్యంలోని ‘అప్పగించు’కు నిజమైన ప్రత్యామ్నాయం కాక, సందర్భానుగుణమైన ‘ద్రోహం చేయు’ వ్యాఖ్యానార్థం; ఆంగ్ల ఆడిట్ ట్రెయిల్‌లో ప్రధాన పాఠ్యం ‘betray,’ పాదసూచికలో మరింత అక్షరార్థమైన ‘hand over’ ఉంది. తెలుగు పాఠ్యంలో ప్రధానంగా అక్షరార్థాన్ని ఉంచాలంటే పాదసూచికను ఆ అక్షరార్థం/సందర్భార్థ సంబంధాన్ని స్పష్టంగా తెలియజేసేలా మార్చాలి.'
