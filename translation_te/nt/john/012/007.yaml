source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἄφες αὐτήν, ⸀ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου ⸀τηρήσῃ αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: te
  text: 'అందుచేత యేసు ఇలా అన్నాడు: “ఆమెను వదిలివేయి; నా ఖనన దినం కోసం ఆమె దానిని ఉంచుకొననివ్వు.[a][b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెను వదిలివేయి; నా ఖనన దినం కోసం ఆమె దానిని ఉంచింది.” ఈ ఉపవాక్యం ఆమె ఇప్పటికే చేసిన కార్యాన్ని వివరిస్తున్నదని కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఆమెను వదిలివేయి; నా ఖనన దినం వరకు ఆమె దానిని ఉంచుకొననివ్వు.” గ్రీకు నిర్మాణాన్ని మరింత స్పష్టమైన కాలపరమైన భావంతో కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అందుచేత
  rationale: కథనంలోని తార్కిక కొనసాగింపును సూచిస్తుంది; సందర్భంలో యేసు పలికిన మాట ముందున్న అభ్యంతరానికి ప్రతిస్పందన అని తెలియజేస్తుంది.
- source_word: Ἄφες αὐτήν
  choice: ఆమెను వదిలేయి
  rationale: ఏకవచన ఆజ్ఞారూపాన్ని నిలుపుతూ, ఆమెను అడ్డుకోవడం లేదా ఇబ్బంది పెట్టడం మానమనే సందర్భోచిత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἵνα
  choice: …ఉంచుకొనేలా
  rationale: ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని తెలిపే గ్రీకు ఉపవాక్య సంబంధాన్ని నిలుపుతుంది.
- source_word: εἰς τὴν ἡμέραν
  choice: దినం కోసం
  rationale: దృష్టిలో ఉన్న రాబోయే సందర్భాన్ని సూచిస్తుంది; ప్రధాన పాఠంలో ‘వరకు’ అని అనువదించి కాలపరమైన అర్థానికే పరిమితం చేయదు.
- source_word: ἐνταφιασμοῦ
  choice: సమాధి
  rationale: ఇక్కడ యేసు దేహాన్ని సమాధి చేయడాన్ని సూచించే స్పష్టమైన, సాధారణ తెలుగు పదం.
- source_word: τηρήσῃ
  choice: ఉంచుకొనేలా చేయి
  rationale: τηρέω యొక్క దాచిపెట్టడం లేదా ఒక సందర్భం కోసం ఉంచడం అనే భావాన్ని ἵνα ఉపవాక్యంతో సహజంగా కలుపుతుంది; క్రియను పూర్తయిన చర్యగా మార్చకుండా గ్రీకు సంభావనార్థక రూపాన్ని ప్రతిబింబిస్తుంది.
- source_word: αὐτό
  choice: దానిని
  rationale: ముందు ప్రస్తావించిన సుగంధతైలాన్ని సూచించే సర్వనామాన్ని మూలపాఠంలాగే వివరణాత్మక నామవాచకం చేర్చకుండా ఉంచుతుంది.
theological_decisions:
- issue: యేసు సమాధికి, స్త్రీ చేసిన అభిషేకానికి మధ్య ఉన్న సంబంధం
  choice: యేసు రాబోయే సమాధి దినం కోసం దానిని ఆమె ఉంచుకొనేలా చేయమని చెప్పినట్లుగా అనువదించడం
  alternative: ‘నా సమాధి దినం కోసం ఆమె దానిని ఉంచింది’ లేదా ‘నా సమాధి దినం వరకు ఆమె దానిని ఉంచుకొనేలా చేయి’
  rationale: గ్రీకు వాక్యనిర్మాణం క్లిష్టమైనది; అది ఉద్దేశాన్ని ముందుకు చూస్తున్నట్లుగానూ, ఆమె ఇప్పటికే చేసిన కార్యాన్ని వివరిస్తున్నట్లుగానూ గ్రహించబడింది. ప్రధాన పాఠం ἄφες…ἵνα…τηρήσῃ నిర్మాణాన్ని నేరుగా అనుసరిస్తుంది; నిజమైన సందిగ్ధతను పాదసూచికల్లో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. Ἄφες అనే ఏకవచన ఆజ్ఞను ‘వదిలేయి’గా నిలిపాం. ప్రధాన వాక్యంలోని క్లిష్టతను అతిగా సవరించకుండా, ప్రత్యామ్నాయ అవగాహనలను పాదసూచికల్లో ఇచ్చాం.
