id: JHN.12.45
reference: John 12:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ θεωρῶν ἐμὲ θεωρεῖ τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/045.yaml
  text: And the one who sees me sees the one who sent me[a].
translation:
  language: te
  text: నన్ను చూసేవాడు నన్ను పంపినవానినీ చూస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శ్రద్ధగా గమనించేవాడు’; గ్రీకు క్రియ కేవలం కంటితో చూడడమే కాక, శ్రద్ధతో గమనించి గ్రహించడం అనే భావాన్ని కూడా ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρῶν / θεωρεῖ
  choice: చూసేవాడు / చూస్తున్నాడు
  rationale: θεωρέω అనే క్రియ చూడడం మాత్రమే కాక శ్రద్ధగా గమనించడం, గ్రహించడం అనే భావాన్ని కూడా కలిగి ఉండవచ్చు. సహజమైన ఆధునిక తెలుగులో క్రియాపునరుక్తిని నిలుపుతూ ఈ రూపాలు ఎంచుకున్నాం.
- source_word: ἐμὲ / με
  choice: నన్ను
  rationale: రెండు చోట్ల ఉన్న ప్రథమ పురుష ఏకవచన కర్మరూపాన్ని నేరుగా అనువదించాం.
- source_word: ὁ θεωρῶν
  choice: చూసేవాడు
  rationale: ఆర్టికల్‌తో కూడిన వర్తమాన కృదంతం సాధారణంగా ఆ పని చేసే వ్యక్తిని సూచిస్తుంది. ‘చూసేవాడు’ ఈ ఏకవచన సాధారణీకరణను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν πέμψαντά
  choice: పంపినవాణ్ణి
  rationale: ఆర్టికల్‌తో కూడిన భూత కృదంతం యేసును పంపిన వ్యక్తిని సూచిస్తుంది. మూలంలో లేని ‘తండ్రి’ అనే బిరుదును చేర్చకుండా సంబంధాత్మక వర్ణనను నిలిపాం.
- source_word: καὶ
  choice: (ప్రత్యేకంగా అనువదించలేదు)
  rationale: καί ముందున్న వాక్యంతో అనుసంధానిస్తుంది. ఒంటరి వచనంగా తెలుగులో ‘మరియు’తో ప్రారంభించడం అసహజంగా ఉండటంతో, వాక్యసంబంధంలో అంతర్లీనంగా ఉంచాం.
theological_decisions:
- issue: యేసును చూడడం మరియు ఆయనను పంపినవాణ్ణి చూడడం మధ్య సంబంధం
  choice: ‘నన్ను చూసేవాడు నన్ను పంపినవాణ్ణి చూస్తున్నాడు’ అని నేరుగా ఉంచాం.
  alternative: యేసు ద్వారా పంపినవాని గురించి తెలుసుకుంటాడని బలహీనపరచడం, లేదా ఇద్దరూ ఒకే వ్యక్తి అని మూలవాక్యాన్ని మించి వివరించడం.
  rationale: మూలం ప్రత్యక్షమైన ప్రకటనాత్మక సమాంతరాన్ని చెబుతుంది. దాని బలాన్ని తగ్గించకుండానే, స్వరూపసంబంధాన్ని వివరించే అదనపు సిద్ధాంతభాషను చేర్చకుండా వేదాంత ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘పంపినవాణ్ణి’ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉండి, మూలంలోని వ్యక్తిసూచక కృదంతాన్ని నిలుపుతుంది.
