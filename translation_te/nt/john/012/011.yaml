  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: te
  text: ఎందుకంటే లాజరు కారణంగా యూదులలో చాలామంది వెళ్లిపోతూ యేసును విశ్వసించేవారు.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదయ ప్రజలలో చాలామంది.” యోహాను సువార్తలో “యూదులు” అనే పదం సందర్భాన్ని బట్టి యూదయ ప్రజలను లేదా యూదు అధికారులను సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “వెళ్లిపోతూ” అని అనువదించిన గ్రీకు పదానికి “దూరమవుతూ” లేదా “వెళ్లుతూ” అనే అర్థాలు కూడా సాధ్యం. వారు ఎవరినుంచి లేదా ఎక్కడినుంచి వెళ్లిపోతున్నారో ఈ వచనంలో స్పష్టంగా చెప్పబడలేదు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “యేసుమీద నమ్మకం ఉంచేవారు” లేదా “యేసును నమ్మేవారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: మునుపటి వచనంలో ప్రధాన యాజకులు లాజరును చంపాలని నిర్ణయించుకోవడానికి గల కారణాన్ని పరిచయం చేస్తుంది.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: యూదుల్లో అనేకమంది
  rationale: మొత్తం సమూహంలోని ఒక భాగాన్ని సూచించే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఇది యూదులందరినీ సూచించదు.
- source_word: δι’ αὐτὸν
  choice: అతని కారణంగా
  rationale: διά + ద్వితీయా విభక్తి ఇక్కడ కారణార్థకం; సందర్భంలో ‘అతడు’ లాజరును సూచిస్తుంది.
- source_word: ὑπῆγον
  choice: వారిని విడిచి వెళ్లి
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృతమవుతున్న చర్యను సూచిస్తుంది. తెలుగులో కర్త మారకుండా వచ్చే సమన్విత క్రియల ప్రవాహంలో ఈ రూపం సహజంగా ఉంది; ‘వారిని’ అనేది సందర్భంలోని వ్యతిరేక నాయకులను సూచించే స్వల్ప సందర్భస్పష్టీకరణ.
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: యేసును విశ్వసిస్తూ ఉన్నారు
  rationale: యేసు వైపు దిశగల వ్యక్తిగత విశ్వాసాన్ని, అలాగే గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: Ἰουδαίων అనే పదానికి యోహాను సువార్తలోని పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘యూదుల్లో’
  alternative: ‘యూదయవారిలో’ లేదా సందర్భానుసారం ‘యూదు నాయకుల వర్గంలో ఉన్నవారిలో’
  rationale: ఇక్కడ ‘అనేకమంది’ అనే భాగసూచక నిర్మాణం యూదులందరిపై సమగ్ర నిందను మోపదు. భౌగోళిక భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ణయించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- issue: πιστεύω εἰς యొక్క భావం
  choice: ‘యేసును విశ్వసిస్తూ ఉన్నారు’
  alternative: ‘యేసుమీద నమ్మకం ఉంచుతున్నారు’
  rationale: వచనం యేసు వైపు దిశగల విశ్వాసాన్ని చెబుతుంది; ‘శిష్యులయ్యారు’ లేదా ‘రక్షింపబడ్డారు’ వంటి అదనపు సిద్ధాంతార్థాలను చేర్చదు.
- issue: ὑπῆγον యొక్క సందర్భార్థం
  choice: ‘వారిని విడిచి వెళ్లి’
  alternative: ‘వెళ్లిపోతూ’
  rationale: వ్యతిరేక నాయకుల వైఖరి లేదా ప్రభావం నుంచి ప్రజలు దూరమవుతున్నారని సమీప సందర్భం సూచిస్తుంది; అయినప్పటికీ అధికారిక మతత్యాగం అనే బలమైన భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘యూదుల్లో అనేకమంది’ అనే ప్రయోగం భాగసూచక భావాన్ని స్పష్టంగా ఉంచుతుంది. ‘విశ్వసిస్తూ ఉన్నారు’ గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్యను ప్రతిబింబిస్తుంది.
