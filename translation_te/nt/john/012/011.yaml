revisions:
- from: ఎందుకంటే అతని కారణంగా యూదుల్లో అనేకమంది వారిని విడిచి వెళ్లి, యేసును విశ్వసిస్తూ ఉన్నారు.[a][b][c]
  to: ఎందుకంటే లాజరు కారణంగా యూదులలో చాలామంది వెళ్లిపోతూ యేసును విశ్వసించేవారు.[a][b][c]
  rationale: The revision removes the unsupported object “వారిని,” explicitly names Lazarus to avoid ambiguity in Telugu, and uses “వెళ్లిపోతూ … విశ్వసించేవారు” to reflect the two imperfect verbs without making the departure completed or specifying a departure from the authorities. The revised notes retain legitimate lexical and contextual alternatives while clearly distinguishing them from what the Greek explicitly says.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:29:50Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Lazarus as the referent of δι’ αὐτόν and preserves the partitive sense of πολλοὶ τῶν Ἰουδαίων. However, “వారిని విడిచి” supplies an object absent from ὑπῆγον and turns the source’s intentionally unspecified departure into a departure from identified opponents. The two Greek imperfects are better represented without the completed action implied by “వెళ్లి.”
  naturalness: “యూదులలో చాలామంది” is more idiomatic modern Telugu than “యూదుల్లో అనేకమంది.” “వెళ్లిపోతూ యేసును విశ్వసించేవారు” is a natural compact rendering of the paired imperfect actions in this narrative context.
  terminology: “యేసును విశ్వసించేవారు” accurately renders ἐπίστευον εἰς τὸν Ἰησοῦν without importing conclusions such as discipleship or salvation. The footnote retains “యూదయ ప్రజలు” as a possible contextual rendering of Ἰουδαῖοι, without asserting that the term must refer to authorities.
  issues:
  - severity: high
    issue: The main text adds “వారిని” (‘them’) to ὑπῆγον.
    rationale: ὑπῆγον is intransitive here; neither its grammar nor the immediate wording identifies people whom the many were leaving. The proposed leaders/opponents are a contextual possibility, not stated by the verse, and must not be inserted into the text.
  - severity: medium
    issue: “విడిచి వెళ్లి” presents the first action as completed before the believing.
    rationale: Both ὑπῆγον and ἐπίστευον are imperfects. A participial progressive construction better preserves their ongoing/concurrent portrayal.
  - severity: low
    issue: The lexical footnote asserts a contextual identification that exceeds the source wording.
    rationale: The note may explain that the destination or point of departure is not specified, but should not identify an unstated object as though it were supplied by the Greek.
  revised_text: ఎందుకంటే లాజరు కారణంగా యూదులలో చాలామంది వెళ్లిపోతూ యేసును విశ్వసించేవారు.[a][b][c]
