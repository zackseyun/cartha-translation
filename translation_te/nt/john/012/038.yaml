id: JHN.12.38
reference: John 12:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: te
  text: 'ప్రవక్త యెషయా చెప్పిన వాక్యం నెరవేరునట్లు జరిగింది: “ప్రభువా, మా సందేశాన్ని[a] నమ్మినవాడెవడు? ప్రభువు బాహువు ఎవరికి బయలుపరచబడింది?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేము విన్నది” లేదా “మా నివేదిక.”
    reason: ἀκοή అనే గ్రీకు పదం వినబడిన విషయం, నివేదిక, లేదా సందేశం అనే భావాలను ఇవ్వగలదు.
lexical_decisions:
- source_word: ἵνα
  choice: నెరవేరేలా జరిగింది
  rationale: ముందటి అవిశ్వాస సంఘటనతో ఈ వాక్యాన్ని అనుసంధానిస్తూ, గ్రీకు పదంలో ఉన్న ఉద్దేశం/ఫలితం అనే రెండు సాధ్యమైన భావాలను పూర్తిగా ఒకదానికే పరిమితం చేయదు.
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: ప్రవక్త యెషయా చెప్పిన ఈ మాట
  rationale: తెలుగులో సహజమైన ఉల్లేఖన-నెరవేర్పు నిర్మాణాన్ని ఇస్తూనే λόγος అనే పదాన్ని ‘మాట’గా ప్రతిబింబిస్తుంది.
- source_word: πληρωθῇ
  choice: నెరవేరేలా జరిగింది
  rationale: నెరవేర్పు భావాన్ని నిలుపుతూ, ἵνα తరువాతి భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριος సంబోధనా రూపాన్ని గౌరవప్రదమైన, ప్రామాణిక తెలుగు రూపంలో అందిస్తుంది.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: మా సందేశాన్ని
  rationale: ἀκοή ఇక్కడ వినబడిన లేదా ప్రకటించబడిన విషయం అనే అర్థాన్ని ఇవ్వగలదు. ‘మా సందేశం’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ఇతర సాధ్యార్థాలను అధస్సూచనలో ఉంచాం.
- source_word: ὁ βραχίων κυρίου
  choice: ప్రభువు బాహువు
  rationale: దేవుని శక్తిమంతమైన కార్యాన్ని సూచించే మూలభాషలోని రూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: ἀπεκαλύφθη
  choice: బయలుపరచబడింది
  rationale: గ్రీకు కర్మణి రూపాన్ని స్పష్టంగా నిలుపుతూ ప్రకటన/వెల్లడి భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: నెరవేర్పు భాషలో దైవిక ఉద్దేశం లేదా ఫలితం
  choice: ‘నెరవేరేలా జరిగింది’ అని అనువదించడం
  alternative: ‘నెరవేరింది’ లేదా ‘నెరవేరడానికి’
  rationale: యోహాను వాడిన ἵνα నిర్మాణంలో ఉద్దేశం, ఫలితం, లేదా రెండింటి ఛాయ ఉండవచ్చు. అనువాదం ఆ వేదాంతపరమైన ఉద్రిక్తతను అనవసరంగా ఒకే విధంగా పరిష్కరించదు.
- issue: యెషయా ఉల్లేఖనంలోని ἀκοή అర్థం
  choice: ప్రధాన పాఠంలో ‘మా సందేశం’
  alternative: ‘మేము విన్నది’ లేదా ‘మా నివేదిక’
  rationale: ఈ పదం వినడాన్ని గానీ, వినబడిన/ప్రకటించబడిన విషయాన్ని గానీ సూచించవచ్చు. సందర్భంలో ప్రకటిత విషయమనే భావం సహజమైనది; నిజమైన ఇతర సాధ్యార్థాలు అధస్సూచనలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘ప్రభువు బాహువు’ అనే లేఖన రూపకాన్ని నిలిపి ఉంచాం. అధస్సూచన గుర్తును అది వివరిస్తున్న ‘మా సందేశాన్ని’ అన్న పదబంధానికే జోడించాం.
