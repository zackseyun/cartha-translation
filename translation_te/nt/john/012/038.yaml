- from: 'ప్రవక్త యెషయా చెప్పిన ఈ మాట నెరవేరేలా జరిగింది: “ప్రభువా, మా సందేశాన్ని[a] నమ్మినవాడెవడు? ప్రభువు బాహువు ఎవరికి బయలుపరచబడింది?”'
  to: 'ప్రవక్త యెషయా చెప్పిన వాక్యం నెరవేరునట్లు జరిగింది: “ప్రభువా, మా సందేశాన్ని[a] నమ్మినవాడెవడు? ప్రభువు బాహువు ఎవరికి బయలుపరచబడింది?”'
  rationale: The revision removes the unsupported demonstrative, uses “వాక్యం” for the prophetic λόγος, and retains the fulfillment connection in idiomatic modern standard Telugu. It preserves the passive wording and biblical metaphor, while retaining a footnote directly anchored to “మా సందేశాన్ని” for the lexical ambiguity of ἀκοή.
