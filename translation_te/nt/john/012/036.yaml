revisions:
- from: మీకు వెలుగు ఉన్నంతకాలం, వెలుగుపై విశ్వాసముంచండి. అప్పుడు మీరు వెలుగు కుమారులు[a] అవుతారు.” యేసు ఈ మాటలు చెప్పి, అక్కడి నుంచి వెళ్లిపోయి వారికి కనిపించకుండా దాగుకున్నాడు.[b]
  to: మీరు వెలుగు కుమారులు కావడానికి, మీకు వెలుగు ఉన్నంతకాలం వెలుగుపై విశ్వాసముంచండి. యేసు ఈ మాటలు చెప్పి, వెళ్లిపోయి వారి నుండి దాగుకున్నాడు.
  rationale: 'The revision restores the ἵνα purpose relation with “కావడానికి,” removes the unsupported “అక్కడి నుంచి,” and uses a direct, natural rendering of the final participial-main-verb sequence. Footnote anchors remain attached to “వెలుగు కుమారులు[a]” and the final hiding action “[b]” when typeset in the passage: “మీరు వెలుగు కుమారులు[a] కావడానికి, మీకు వెలుగు ఉన్నంతకాలం వెలుగుపై విశ్వాసముంచండి. యేసు ఈ మాటలు చెప్పి, వెళ్లిపోయి వారి నుండి దాగుకున్నాడు.[b]”'
