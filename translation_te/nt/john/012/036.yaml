id: JHN.12.36
reference: John 12:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ὡς τὸ φῶς ἔχετε, πιστεύετε εἰς τὸ φῶς, ἵνα υἱοὶ φωτὸς γένησθε. Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: te
  text: మీరు వెలుగు కుమారులు కావడానికి, మీకు వెలుగు ఉన్నంతకాలం వెలుగుపై విశ్వాసముంచండి. యేసు ఈ మాటలు చెప్పి, వెళ్లిపోయి వారి నుండి దాగుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: మీకు వెలుగు ఉన్నంతకాలం
  rationale: ὡς తో కూడిన వర్తమానకాల క్రియ ఇక్కడ కాలార్థాన్ని—‘ఉన్నంతకాలం/ఉన్నప్పుడు’—తెలియజేస్తుంది. ఈ అనువాదం అవకాశపు పరిమితిని, సందర్భంలోని అత్యవసరతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὸ φῶς
  choice: వెలుగు
  rationale: యోహాను సువార్తలోని స్థిరమైన ‘వెలుగు’ ప్రతీకను అలాగే ఉంచి, దాని సాధారణ మరియు క్రీస్తును సూచించే భావస్థరాలను వివరించి పరిమితం చేయలేదు.
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: వెలుగుపై విశ్వాసముంచండి
  rationale: πιστεύω εἰς అనే యోహానీయ ప్రయోగంలోని వ్యక్తిగత నమ్మకం, ఆధారపడడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἵνα υἱοὶ φωτὸς γένησθε
  choice: అప్పుడు మీరు వెలుగు కుమారులు అవుతారు
  rationale: ἵνα యొక్క ఉద్దేశం/ఫలితం భావాన్ని ‘అప్పుడు’ ద్వారా సందర్భానుగుణంగా తెలిపి, γένησθε లోని ‘కావడం’ భావాన్ని ‘అవుతారు’గా నిలిపింది. υἱοί అనే పుంలింగ రూపాన్ని ‘కుమారులు’గా అనువదించింది.
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: యేసు ఈ మాటలు చెప్పి
  rationale: తెలుగులో సహజమైన కథన ప్రవాహం కోసం ఉపవాక్యంగా మార్చినా, ‘ఈ మాటలు పలికాడు’ అనే మూలార్థాన్ని పూర్తిగా నిలుపుతుంది.
- source_word: ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν
  choice: అక్కడి నుంచి వెళ్లిపోయి వారికి కనిపించకుండా దాగుకున్నాడు
  rationale: అయోరిస్ట్ పార్టిసిపిల్ తరువాత ప్రధాన క్రియ వచ్చే క్రమాన్ని సహజమైన తెలుగు సంయుక్త క్రియలతో తెలిపింది. ἐκρύβη యొక్క సందర్భానుగుణ మధ్యమార్థాన్ని ‘దాగుకున్నాడు’గా అందించింది; ἀπ’ αὐτῶν ను ‘వారికి కనిపించకుండా’గా స్పష్టం చేసింది.
theological_decisions:
- issue: υἱοὶ φωτός అనే లింగసూచక కుటుంబ రూపకం
  choice: వెలుగు కుమారులు
  alternative: వెలుగు పిల్లలు
  rationale: మూలంలోని υἱοί అనే పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపింది. అయితే ఇది వెలుగు లక్షణం గల ప్రజలందరినీ సూచించే నుడికారమని పాదటిప్పణిలో తెలియజేసింది.
- issue: πιστεύω εἰς అనే యోహానీయ విశ్వాస ప్రయోగం
  choice: వెలుగుపై విశ్వాసముంచండి
  alternative: వెలుగును నమ్మండి
  rationale: ‘వెలుగు’లోని వ్యక్తిగత/క్రీస్తుసంబంధ ప్రతిధ్వనిని అతిగా వివరించకుండా, నమ్మకం మరియు ఆధారపడడం అనే బలమైన భావాన్ని నిలుపుతుంది.
- issue: ἐκρύβη యొక్క కర్తృత్వ భావం
  choice: దాగుకున్నాడు
  alternative: దాచబడ్డాడు
  rationale: రూపపరంగా ఇది నిష్క్రియ కావచ్చుగాని, ఈ సందర్భంలో యేసు స్వయంగా వారికి కనిపించకుండా వెళ్లిన చర్యను సూచించే మధ్యమార్థం సహజం. ప్రత్యామ్నాయ నిష్క్రియ అనువాదం మరొకరు ఆయనను దాచారనే అనవసర భావాన్ని కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘వెలుగు,’ ‘విశ్వాసం,’ ‘కుమారులు’ వంటి యోహానీయ మరియు రూపకాల పదాలను నిలుపుతూ, చివరి కథన భాగాన్ని సహజమైన తెలుగు క్రియాక్రమంలో అందించింది.
