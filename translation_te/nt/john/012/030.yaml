id: JHN.12.30
reference: John 12:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: te
  text: 'యేసు జవాబిచ్చి ఇలా అన్నాడు: “ఈ స్వరం నా కోసం కాదు, మీ కోసమే వినిపించింది.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఈ స్వరం నా కారణంగా కాదు, మీ కారణంగానే సంభవించింది.” గ్రీకు ఉపసర్గను కారణాన్ని సూచించేదిగాను అర్థం చేసుకోవచ్చు; అయితే ఈ సందర్భంలో “కోసం” లేదా “ప్రయోజనం కోసం” అనే భావమే ఎక్కువగా సరిపోతుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν
  choice: యేసు జవాబిస్తూ ఇలా అన్నాడు
  rationale: యోహాను వాడిన జవాబు–మాట్లాడుట అనే రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘జవాబిచ్చి అన్నాడు’ కంటే ఇది ప్రవాహవంతంగా ఉంటుంది.
- source_word: ἡ φωνὴ αὕτη
  choice: ఈ స్వరం
  rationale: ముందు వినిపించిన పరలోక ఉచ్చారణను సూచిస్తున్నందున ‘శబ్దం’ కంటే ‘స్వరం’ సందర్భానికి తగినది.
- source_word: γέγονεν
  choice: వినిపించింది
  rationale: γίνομαι పరిపూర్ణ రూపం ఇక్కడ స్వరం సంభవించి వినబడిన ఘటనను సూచిస్తుంది. తెలుగులో స్వరంతో సహజంగా కలిసే ‘వినిపించింది’ ఆ ఘటనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: δι’ ἐμὲ
  choice: నా కోసం
  rationale: διά + accusative యొక్క ప్రధాన సందర్భార్థమైన ఉద్దేశం లేదా ప్రయోజనాన్ని సహజంగా వ్యక్తం చేస్తుంది; కారణార్థక అవకాశాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: δι’ ὑμᾶς
  choice: మీ కోసమే
  rationale: మొదటి పదబంధానికి సమాంతరంగా శ్రోతల ప్రయోజనాన్ని తెలియజేస్తుంది; ‘ఏ’ విరుద్ధతకు తగిన ఉద్ఘాటన ఇస్తుంది.
- source_word: Οὐ ... ἀλλὰ
  choice: కాదు ... కోసమే
  rationale: గ్రీకు వాక్యంలోని స్పష్టమైన వ్యతిరేక సమాంతరతను తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: పరలోక స్వరం వినిపించిన ఉద్దేశం
  choice: ఆ స్వరం యేసు ప్రయోజనం కోసం కాక, అక్కడున్న శ్రోతల ప్రయోజనం కోసం వినిపించింది.
  alternative: ఆ స్వరం యేసు కారణంగా వినిపించింది గాని, జనసమూహం కోసం ఉద్దేశించబడింది.
  rationale: రెండు చోట్ల ఉన్న διά + accusative పదబంధాలను సందర్భంలో ప్రయోజనార్థకంగా తీసుకోవడం సమాంతరతను కాపాడుతుంది. కారణార్థక అవకాశాన్ని పూర్తిగా తొలగించకుండా పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అదే సమయంలో గౌరవప్రదంగా ఉంచబడింది. మూలంలోని వ్యతిరేక సమాంతరతను కాపాడి, διά యొక్క నిజమైన అర్థసంభావ్యతను పాదటిప్పణిలో నిలిపింది.
