id: JHN.12.20
reference: John 12:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸂Ἕλληνές τινες⸃ ἐκ τῶν ἀναβαινόντων ἵνα προσκυνήσωσιν ἐν τῇ ἑορτῇ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: te
  text: పండుగలో ఆరాధించడానికి పైకి వెళ్తున్నవారిలో కొందరు గ్రీకులు[a] ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొంతమంది గ్రీకులు”; వీరు పండుగలో ఆరాధించడానికి వచ్చిన యూదేతరులు అయి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: ఉన్నారు
  rationale: ἦσαν ఇక్కడ ఉనికిని తెలియజేస్తుంది; δέ స్వల్ప అనుసంధాన సూచకం. తెలుగు వాక్యప్రవాహంలో ప్రత్యేక పదం చేర్చకుండానే సహజంగా వ్యక్తమవుతుంది.
- source_word: Ἕλληνές τινες
  choice: కొందరు గ్రీకులు
  rationale: Ἕλληνες అనే పదానికి సహజమైన జాతి/సాంస్కృతిక అర్థం ‘గ్రీకులు’; τινες అనిర్దిష్టమైన ‘కొందరు’ అని సూచిస్తుంది.
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: పైకి వెళ్తున్నవారిలో
  rationale: ἐκ వీరు ఆ యాత్రికుల సమూహంలో భాగమని సూచిస్తుంది. ἀναβαίνω యెరూషలేముకు తీర్థయాత్రగా ‘పైకి వెళ్లడం’ అనే భావాన్ని నిలుపుతుంది.
- source_word: ἵνα προσκυνήσωσιν
  choice: ఆరాధించడానికి
  rationale: ἵνα తో కూడిన సంభావనార్థక క్రియ ఉద్దేశాన్ని తెలుపుతుంది; సందర్భంలో προσκυνέω మతపరమైన ఆరాధనను సూచిస్తుంది.
- source_word: ἐν τῇ ἑορτῇ
  choice: పండుగలో
  rationale: ἑορτή ఇక్కడ యూదుల పండుగ సందర్భాన్ని సూచిస్తుంది; ‘పండుగలో’ సమయం/సందర్భం రెండింటినీ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Ἕλληνες ఎవరు?
  choice: ‘గ్రీకులు’ అనే జాతి/సాంస్కృతిక పదాన్ని నిలుపుట
  alternative: ‘యూదేతరులు’
  rationale: మూలపాఠం వారిని Ἕλληνες అని మాత్రమే పిలుస్తుంది. వారు గ్రీకు భాష మాట్లాడే యూదులా, యూదుమతంలో చేరినవారా, దేవుని భయపడే యూదేతరులా అనే విషయాన్ని స్పష్టం చేయదు; అనువాదం ఆ అనిశ్చితిని పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. యెరూషలేముకు యాత్రను సూచించే ‘పైకి వెళ్తున్న’ అనే మూలభాషా రూపకాన్ని నిలుపుతూ, గ్రీకుల ఖచ్చితమైన మతపరమైన గుర్తింపును నిర్ణయించకుండా ఉంచింది.
