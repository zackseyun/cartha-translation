id: JHN.12.8
reference: John 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: te
  text: ఎందుకంటే పేదవారు మీతో ఎల్లప్పుడూ ఉంటారు[a]; కానీ నేను మీతో ఎల్లప్పుడూ ఉండను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “పేద ప్రజలు.” గ్రీకు విశేషణం నామవాచకంగా వాడబడి ఉంది: “పేదవారు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχούς
  choice: పేదవారు
  rationale: విశేషణం నామవాచకంగా వాడబడి పేద వ్యక్తుల సమూహాన్ని సూచిస్తోంది. ‘పేదవారు’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే సంధానార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πάντοτε
  choice: ఎప్పుడూ
  rationale: రెండు ఉపవాక్యాల్లోనూ నిరంతర లభ్యత లేదా సన్నిధిని సూచిస్తుంది; ఒకే పదాన్ని వాడటం మూలంలోని సమాంతరతను నిలుపుతుంది.
- source_word: ἔχετε
  choice: మీతో ఉంటారు / మీతో ఉండను
  rationale: ఇక్కడ సొంతం చేసుకోవడం కాక, తోడుగా ఉండటం లేదా సన్నిధిలో ఉండటం భావం. తెలుగు సహజ వాక్యనిర్మాణంలో ‘ఉండు’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: μεθ’ ἑαυτῶν
  choice: మీతో
  rationale: సహవాసం లేదా సన్నిధిని సూచించే సహజమైన తెలుగు రూపం.
- source_word: ἐμέ
  choice: నేను
  rationale: గ్రీకులో కర్మరూపం ఉన్నా, తెలుగులో ‘నేను మీతో ఉండను’ అనే సహజ నిర్మాణం ద్వారా యేసునే విరుద్ధ అంశంగా స్పష్టంగా ఉంచుతుంది.
- source_word: δέ
  choice: కానీ
  rationale: పేదవారి నిరంతర సన్నిధికి, యేసు తాత్కాలిక శారీరక సన్నిధికి మధ్య ఉన్న వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: οὐ πάντοτε
  choice: ఎప్పుడూ ... ఉండను
  rationale: మూలంలోని నిరాకరణను సహజ తెలుగులో వ్యక్తం చేస్తూ, మొదటి ఉపవాక్యంలోని ‘ఎప్పుడూ’తో సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: పేదల పట్ల శ్రద్ధను యేసు తక్కువ చేస్తున్నాడనే సంభావ్య అపార్థం
  choice: పేదవారి నిరంతర సన్నిధి మరియు యేసు పరిమితకాల సన్నిధి మధ్య వ్యత్యాసాన్ని నేరుగా అనువదించడం
  alternative: పేదవారు తక్కువ ప్రాముఖ్యమున్నవారని సూచించే వ్యాఖ్యానాత్మక అనువాదం, లేదా వ్యత్యాసాన్ని మసకబార్చే సడలించిన అనువాదం
  rationale: గ్రీకు పాఠ్యం సన్నిధి మరియు సమయానికి సంబంధించిన వాస్తవ వ్యత్యాసాన్ని చెబుతుంది; పేదల సంరక్షణ ప్రాముఖ్యాన్ని తగ్గించదు. కాబట్టి వచనంలోని ఉద్రిక్తతను వ్యాఖ్యానంతో పరిష్కరించకుండా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే నిర్మాణం. ‘కలిగి ఉంటారు’ అనే యాజమాన్య భావం కలిగించగల అక్షరానువాదానికి బదులుగా, సందర్భంలోని సన్నిధి భావాన్ని ‘మీతో ఉంటారు’గా వ్యక్తం చేశాం.
