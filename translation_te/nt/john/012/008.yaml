revisions:
- from: ఎందుకంటే పేదవారు ఎప్పుడూ మీతో ఉంటారు[a]; కానీ నేను ఎప్పుడూ మీతో ఉండను.
  to: ఎందుకంటే పేదవారు మీతో ఎల్లప్పుడూ ఉంటారు[a]; కానీ నేను మీతో ఎల్లప్పుడూ ఉండను.
  rationale: 'The revision preserves the Greek parallelism of πάντοτε in both clauses while making the scope of οὐ πάντοτε clear in idiomatic Telugu: Jesus is not with them continually, not that he is never with them. The corrected footnote accurately reflects the substantival use of πτωχούς without altering the verse’s syntax or meaning.'
