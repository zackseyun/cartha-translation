review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the explanatory γάρ, the contrast marked by δέ, the continuing presence of the poor, and the sense of presence expressed by ἔχετε μεθ’ ἑαυτῶν. However, the negative clause “నేను ఎప్పుడూ మీతో ఉండను” ordinarily means “I am never with you,” whereas οὐ πάντοτε means “not always”; this must be corrected.
  naturalness: “పేదవారు … మీతో ఉంటారు” is natural, respectful modern standard Telugu. Using “ఎల్లప్పుడూ” in the two parallel clauses better expresses πάντοτε and, in the second clause, avoids the common Telugu scope reading of “ఎప్పుడూ … ఉండను” as an absolute negation.
  terminology: '“పేదవారు” appropriately renders the substantival adjective τοὺς πτωχούς. The existing footnote is not a valid lexical alternative: it changes the referent to an accusative object (“పేదలను”) and introduces “కలిగి ఉంటారు,” which is not the intended Telugu rendering of the verse.'
  issues:
  - severity: high
    issue: The phrase “నేను ఎప్పుడూ మీతో ఉండను” can mean “I am never with you.”
    rationale: The Greek οὐ πάντοτε ἔχετε means “you do not always have me,” contrasting Jesus’ temporary presence with the continual presence of the poor. It does not deny that he is presently with them.
  - severity: medium
    issue: The footnote’s quoted “పేదలను ఎప్పుడూ మీతో కలిగి ఉంటారు” is not an accurate lexical alternative.
    rationale: The note should explain that the Greek adjective is used substantivally and offer “పేద ప్రజలు” as an alternative. Its current wording shifts the phrase into an awkward and misleading object construction.
  revised_text: ఎందుకంటే పేదవారు మీతో ఎల్లప్పుడూ ఉంటారు[a]; కానీ నేను మీతో ఎల్లప్పుడూ ఉండను.
  revised_footnotes:
  - marker: a
    text: 'లేదా, “పేద ప్రజలు.” గ్రీకు విశేషణం నామవాచకంగా వాడబడి ఉంది: “పేదవారు.”'
    reason: lexical_alternative
  revision_rationale: 'The revision preserves the Greek parallelism of πάντοτε in both clauses while making the scope of οὐ πάντοτε clear in idiomatic Telugu: Jesus is not with them continually, not that he is never with them. The corrected footnote accurately reflects the substantival use of πτωχούς without altering the verse’s syntax or meaning.'
