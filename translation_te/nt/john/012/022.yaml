  yaml_path: translation/nt/john/012/022.yaml
  text: Philip comes and tells Andrew[a]; Andrew and Philip come and tell Jesus.
translation:
  language: te
  text: ఫిలిప్పు అంద్రెయ దగ్గరకు వచ్చి అంద్రెయకు చెబుతాడు; అంద్రెయ, ఫిలిప్పు యేసు దగ్గరకు వచ్చి యేసుకు చెబుతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ఈ వాక్యంలోని క్రియలు చారిత్రక వర్తమాన కాలంలో ఉన్నాయి (‘వస్తాడు … చెబుతాడు … వస్తారు … చెబుతారు’). ఇది కథనానికి సజీవతను ఇచ్చే సాధారణ శైలి; అనేక అనువాదాలు దీన్ని భూతకాలంలో ఇస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: దగ్గరికి వచ్చి
  rationale: సందర్భంలోని వ్యక్తివైపు కదలికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు చారిత్రక వర్తమానపు సజీవతను ప్రధాన క్రియలో నిలిపింది.
- source_word: λέγει
  choice: చెబుతాడు
  rationale: ఒక వ్యక్తికి సమాచారాన్ని తెలియజేయడాన్ని సహజంగా వ్యక్తపరుస్తుంది; గ్రీకు వర్తమాన కాలాన్ని నిలుపుతుంది.
- source_word: τῷ Ἀνδρέᾳ
  choice: అంద్రెయ దగ్గరికి ... అతనికి
  rationale: దత్తి విభక్తిలోని సంబోధిత వ్యక్తిని తెలుగు వాక్యనిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది; పేరును అనువదించకుండా లిప్యంతరీకరించింది.
- source_word: ἔρχεται Ἀνδρέας καὶ Φίλιππος
  choice: అంద్రెయ, ఫిలిప్పు ... దగ్గరికి వచ్చి
  rationale: సంయుక్త కర్తను నిలిపి, తరువాతి బహువచన ప్రధాన క్రియతో సహజ తెలుగు అనుసంధానం చేసింది.
- source_word: λέγουσιν
  choice: చెబుతారు
  rationale: బహువచన రూపాన్నీ చారిత్రక వర్తమానాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: τῷ Ἰησοῦ
  choice: యేసు దగ్గరికి ... ఆయనకు
  rationale: కదలిక లక్ష్యాన్నీ సమాచార గ్రహీతనూ తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది; గౌరవప్రదమైన సర్వనామాన్ని వాడింది.
- source_word: καί
  choice: మరియు భావాన్ని విరామచిహ్నం/సంయుక్త నిర్మాణంతో
  rationale: గ్రీకు సరళ సమన్వయ ప్రవాహాన్ని నిలుపుతూ, పదేపదే ‘మరియు’ అనడం వల్ల కలిగే అసహజతను నివారించింది.
- source_word: ὁ Φίλιππος
  choice: ఫిలిప్పు
  rationale: వ్యక్తిపేరును తెలుగు సంప్రదాయ రూపంలో లిప్యంతరీకరించింది; గ్రీకు నిర్దేశక ఉపపదానికి ప్రత్యేక తెలుగు రూపం అవసరం లేదు.
