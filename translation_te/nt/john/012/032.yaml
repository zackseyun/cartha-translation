source:
  edition: SBLGNT
  text: κἀγὼ ⸀ἐὰν ὑψωθῶ ἐκ τῆς γῆς, πάντας ἑλκύσω πρὸς ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: te
  text: “నేను భూమి నుండి పైకి ఎత్తబడినప్పుడు[a][b], అందరినీ[c] నా దగ్గరకు ఆకర్షిస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను భూమి నుండి పైకి ఎత్తబడితే.” గ్రీకు వాక్యంలో షరతును సూచించే రూపం ఉంది; అయితే సందర్భంలో ఇది యేసు త్వరలో పొందబోయే మరణాన్ని నిశ్చయమైన సంఘటనగా సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: “పైకి ఎత్తబడటం” అనే మాటకు “మహిమపరచబడటం” అనే భావం కూడా ఉంది. ఇలా సిలువవేయబడటాన్నీ మహిమపరచబడటాన్నీ యోహాను ఒకే మాటలో సూచిస్తున్నాడు.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో అక్షరార్థంగా “అందరినీ.” ఇది మనుషులను సూచిస్తుంది; అయితే రక్షణ పరిధి గురించి తరువాత ఏర్పడిన సిద్ధాంత వివాదాలను ఈ మాట స్వయంగా ఎలా పరిష్కరిస్తుందో అనువాదం నిర్దిష్టం చేయదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: నేను
  rationale: καί + ἐγώ కలయిక వాక్యాన్ని ముందున్న సందర్భంతో అనుసంధానిస్తూ ‘నేను’ అనే కర్తకు స్వల్ప బలాన్ని ఇస్తుంది. తెలుగులో ప్రత్యేక సర్వనామమైన ‘నేను’ ఆ బలాన్ని సహజంగా తెలియజేస్తుంది; అదనంగా ‘మరియు’ చేర్చడం ఈ స్వతంత్ర వచనంలో కృత్రిమంగా వినిపిస్తుంది.
- source_word: ἐὰν
  choice: ఎత్తబడినప్పుడు
  rationale: ἐάν + subjunctive రూపం షరతును సూచించగలిగినా, యోహాను కథన సందర్భంలో యేసు తన సమీపిస్తున్న మరణాన్ని నిశ్చయంగా చెబుతున్నాడు. అందువల్ల ‘ఎప్పుడు’ భావం సహజం; మూలంలోని షరతు రూపాన్ని [a] పాదటిప్పణి తెలియజేస్తుంది.
- source_word: ὑψωθῶ
  choice: పైకి ఎత్తబడినప్పుడు
  rationale: ὑψόω ఇక్కడ సిలువపై భౌతికంగా ఎత్తబడటాన్నీ, మహిమపరచబడటం అనే భావాన్నీ కలిపి సూచిస్తుంది. ‘పైకి ఎత్తబడినప్పుడు’ ఈ ద్వంద్వార్థాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: ἐκ τῆς γῆς
  choice: భూమి నుండి
  rationale: γῆ ఇక్కడ ‘దేశం’ కంటే భూమి/నేల అనే అర్థంలో ఉంది. ‘భూమి నుండి’ సిలువపై ఎత్తబడటానికి అనుగుణంగా ఉండి, తరువాతి వచనంలోని వివరణతో సరిపోతుంది.
- source_word: πάντας
  choice: అందరినీ
  rationale: పుంలింగ బహువచన కర్మరూపం సందర్భంలో మనుషులను సూచిస్తుంది. తెలుగు ‘అందరినీ’ వ్యక్తులనే సహజంగా సూచిస్తూ మూలంలోని విస్తృత పరిధిని నిలుపుతుంది.
- source_word: ἑλκύσω
  choice: ఆకర్షిస్తాను
  rationale: ἕλκω లాగడం లేదా తనవైపు చేర్చుకోవడం అనే భావాన్ని కలిగి ఉంది. ‘ఆకర్షిస్తాను’ తెలుగులో సహజంగా ఉండి, ఆ ఆకర్షణ ఎలా పనిచేస్తుందో అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: πρὸς ἐμαυτόν
  choice: నా దగ్గరకు
  rationale: πρός గమ్యాన్ని, ἐμαυτόν యేసునే లక్ష్యంగా బలంగా సూచిస్తుంది. ‘నా దగ్గరకు’ అనే ప్రయోగం ఆధునిక తెలుగులో సహజంగా ఉండి ఆ వ్యక్తిగత గమ్యాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: πάντας యొక్క పరిధి మరియు రక్షణ సంబంధమైన భావం
  choice: అందరినీ
  alternative: అన్ని రకాల ప్రజలను / ప్రతి ఒక్కరినీ మినహాయింపు లేకుండా
  rationale: మూలంలోని రూపం వ్యక్తులను సూచిస్తూ యేసు ఆకర్షణకు విశాలమైన పరిధిని ప్రకటిస్తుంది. అయితే అది ప్రతి వ్యక్తిని మినహాయింపు లేకుండా సూచిస్తుందా, లేక భేదం లేకుండా అన్ని వర్గాల వారిని సూచిస్తుందా అనే తరువాతి సిద్ధాంత వివాదాన్ని ఈ వచనం స్వయంగా పరిష్కరించదు. అనువాదం ఆ విస్తృతతను అలాగే ఉంచుతుంది.
- issue: ὑψωθῶలోని యోహాను సువార్తకు ప్రత్యేకమైన ద్వంద్వార్థం
  choice: పైకి ఎత్తబడినప్పుడు
  alternative: మహిమపరచబడినప్పుడు
  rationale: ఈ మాట సిలువపై ఎత్తబడటాన్నీ, దానితో ముడిపడిన మహిమపరచబడటాన్నీ కలిపి ఉంచుతుంది. కేవలం ‘మహిమపరచబడినప్పుడు’ అని అనువదిస్తే భౌతిక సిలువార్థం మరుగునపడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో రూపొందించబడింది. ‘పైకి ఎత్తబడటం’ అనే ప్రధాన రూపకాన్ని నిలుపుతూ, షరతు రూపం మరియు మహిమపరచబడటం అనే అంతర్భావాన్ని పాదటిప్పణుల్లో సంరక్షించాం.
