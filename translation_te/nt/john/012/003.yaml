id: JHN.12.3
reference: John 12:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: te
  text: అప్పుడు మరియ ఒక లిత్రా[a] స్వచ్ఛమైన[b], ఎంతో ఖరీదైన నార్దు పరిమళ తైలాన్ని తీసుకొని, యేసు పాదాలకు పూసి, తన జుట్టుతో ఆయన పాదాలను తుడిచింది. ఆ పరిమళ తైలం సువాసనతో ఇల్లంతా నిండిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లిత్రా అనేది రోమా బరువు ప్రమాణం; అది సుమారు 327 గ్రాములు, అంటే దాదాపు మూడో వంతు కిలో.
    reason: cultural_note
  - marker: b
    text: “స్వచ్ఛమైన” అని అనువదించిన గ్రీకు పదం అర్థం వివాదాస్పదం; “అసలైన నార్దు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: ముందటి సందర్భం నుంచి కథనం కొనసాగుతున్నట్లు సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; బలమైన తార్కిక నిర్ధారణను అనవసరంగా రుద్దదు.
- source_word: λίτραν
  choice: దాదాపు మూడో వంతు కిలో
  rationale: రోమా లిత్రా సుమారు 327 గ్రాములు; సాధారణ తెలుగు పాఠకునికి అర్థమయ్యే ఆధునిక పరిమాణాన్ని ప్రధాన వాక్యంలో ఇచ్చి, ప్రాచీన ప్రమాణాన్ని పాదసూచికలో నిలిపాం.
- source_word: μύρου νάρδου
  choice: నార్దు పరిమళ తైలం
  rationale: μύρον అనేది పరిమళభరితమైన తైలం లేదా లేపనం; νάρδος దాని సుగంధ ద్రవ్యం. 'పరిమళ తైలం' ఈ సందర్భంలోని పూయడాన్నీ సువాసననూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πιστικῆς
  choice: స్వచ్ఛమైన
  rationale: ఈ విశేషణం అర్థం వివాదాస్పదం. సందర్భానికి సరిపోయే సాధారణ అర్థాన్ని వాక్యంలో ఉంచి, 'అసలైన' అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: πολυτίμου
  choice: ఎంతో ఖరీదైన
  rationale: దాని అధిక ఆర్థిక విలువను స్పష్టమైన, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἤλειψεν
  choice: పూసి
  rationale: ἀλείφω ఇక్కడ పరిమళ తైలాన్ని శరీరానికి పూయడాన్ని సూచిస్తుంది. తెలుగు 'అభిషేకించింది' కలిగించగల అదనపు ఆచార లేదా రాజాభిషేక భావాన్ని రుద్దకుండా భౌతిక చర్యను ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: ἐξέμαξεν ταῖς θριξὶν αὐτῆς
  choice: తన జుట్టుతో ... తుడిచింది
  rationale: క్రియనూ సాధనార్థక దత్తివునూ నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου
  choice: ఆ పరిమళ తైలం సువాసనతో ఇల్లంతా నిండిపోయింది
  rationale: గ్రీకు కర్మణి నిర్మాణంలోని ఫలితాన్ని సహజమైన తెలుగులో నిలుపుతూ, సువాసన ఇంటిని పూర్తిగా వ్యాపించిన భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: ἤλειψεν అనే పూయడం/అభిషేకించడం పదంలోని సాధ్యమైన ప్రతీకాత్మక భావం
  choice: '''పూసి'' అని అనువదించడం'
  alternative: '''అభిషేకించి'' అని అనువదించడం'
  rationale: మూలపదం పరిమళ తైలాన్ని పూయడాన్ని స్పష్టంగా చెబుతుంది; సందర్భంలో ప్రతీకాత్మక ప్రతిధ్వని ఉండవచ్చును గాని, 'అభిషేకం' అనే పదం తెలుగులో ఆచారపరమైన లేదా రాజత్వసంబంధమైన అర్థాన్ని మరింత బలంగా రుద్దవచ్చు. అందువల్ల చర్యను నేరుగా తెలిపి, వచనం అనుమతించే ప్రతీకాత్మకతను పాఠకునికి తెరిచి ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. 'నార్దు' అనే మూల సుగంధ ద్రవ్యపు పేరును నిలిపి, μύρον ను 'పరిమళ తైలం'గా సహజీకరించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
