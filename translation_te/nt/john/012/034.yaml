id: JHN.12.34
reference: John 12:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀οὖν αὐτῷ ὁ ὄχλος· Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου ὅτι ὁ χριστὸς μένει εἰς τὸν αἰῶνα, καὶ πῶς ⸂λέγεις σὺ⸃ ⸀ὅτι δεῖ ὑψωθῆναι τὸν υἱὸν τοῦ ἀνθρώπου; τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: te
  text: 'అందుకు జనసమూహం ఆయనకు ఇలా జవాబిచ్చింది: “మెస్సీయ[a] ఎప్పటికీ నిలిచి ఉంటాడని ధర్మశాస్త్రం నుంచి మేము విన్నాము. అలాంటప్పుడు, ‘మనుష్యకుమారుడు పైకి ఎత్తబడాలి[b]’ అని నువ్వు ఎలా చెబుతున్నావు? ఈ మనుష్యకుమారుడు ఎవరు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో “క్రీస్తు”; ఇక్కడ అది బిరుదుగా ఉన్నందున “మెస్సీయ” అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఉన్నతపరచబడాలి.” యోహాను సువార్తలో “పైకి ఎత్తబడటం” అనేది శారీరకంగా పైకి ఎత్తబడటాన్నీ, ఉన్నతపరచబడటాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: అందుకు జనసమూహం ఆయనకు ఇలా జవాబిచ్చింది
  rationale: οὖν యొక్క సందర్భసంబంధాన్ని ‘అందుకు’ సహజంగా తెలియజేస్తుంది; ὄχλοςకు ‘జనసమూహం’, ἀπεκρίθηకు ‘జవాబిచ్చింది’ నేరుగా సరిపోతాయి.
- source_word: Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου
  choice: ధర్మశాస్త్రం నుంచి మేము విన్నాము
  rationale: ἐκ యొక్క ‘నుంచి’ భావాన్ని నిలుపుతూ, νόμοςను యూదుల లిఖిత ధర్మశాస్త్ర సంప్రదాయాన్ని సూచించే ‘ధర్మశాస్త్రం’గా అనువదించింది.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ పదం వ్యక్తిగత పేరులా కాక, ఎదురుచూస్తున్న అభిషిక్తుని బిరుదుగా పనిచేస్తోంది; ‘మెస్సీయ’ యూదుల నిరీక్షణ నేపథ్యాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: ఎప్పటికీ నిలిచి ఉంటాడు
  rationale: μένειలోని కొనసాగింపు భావాన్నీ, εἰς τὸν αἰῶναలోని శాశ్వతకాల భావాన్నీ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ πῶς λέγεις σὺ
  choice: అలాంటప్పుడు ... అని నువ్వు ఎలా చెబుతున్నావు?
  rationale: πῶς ఇక్కడ కేవలం సమాచారం అడగడం కాక, ముందు చెప్పిన నమ్మకంతో ఈ మాట ఎలా సరిపోతుందనే అభ్యంతరాన్ని వ్యక్తం చేస్తుంది; σὺలోని స్పష్టమైన ద్వితీయ పురుష ప్రాధాన్యాన్ని ‘నువ్వు’ నిలుపుతుంది.
- source_word: δεῖ ὑψωθῆναι
  choice: పైకి ఎత్తబడాలి
  rationale: δεῖలోని అవసరతను ‘పడాలి’ తెలియజేస్తుంది. ὑψωθῆναι యోహానులో శారీరకంగా పైకి ఎత్తబడటాన్నీ మహిమపరచబడటాన్నీ సూచించగలదు; ‘పైకి ఎత్తబడాలి’ ప్రధాన దృశ్యార్థాన్ని నిలిపి, ద్వంద్వార్థాన్ని పూర్తిగా మూసివేయదు.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు వాడే బిరుదుకు తెలుగులో స్థిరపడిన, దానియేలు గ్రంథ నేపథ్యాన్ని నిలుపగల రూపం.
- source_word: τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου
  choice: ఈ మనుష్యకుమారుడు ఎవరు?
  rationale: οὗτοςలోని సూచనాత్మక బలాన్ని ‘ఈ’ నిలుపుతుంది; ప్రశ్నను సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ὁ χριστός ఇక్కడ యూదులు ఎదురుచూసిన అభిషిక్తుని బిరుదుగా స్పష్టంగా వాడబడింది. అందువల్ల ‘మెస్సీయ’ సందర్భంలోని యూదు నిరీక్షణను కాపాడుతుంది; ‘క్రీస్తు’ను పేరులా గ్రహించే అవకాశాన్ని తగ్గిస్తుంది.
- issue: ὑψωθῆναι యొక్క యోహాను సంబంధిత ద్వంద్వార్థం
  choice: పైకి ఎత్తబడాలి
  alternative: మహిమపరచబడాలి
  rationale: ఈ క్రియ సిలువపై శారీరకంగా పైకి ఎత్తబడటానికీ, ఉన్నతపరచబడటం లేదా మహిమపరచబడటానికీ సంకేతం కావచ్చు. ప్రధాన పాఠంలో ‘పైకి ఎత్తబడాలి’ అని ఉంచి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలిపి ఆ ఉద్దేశపూర్వక ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. జనసమూహం మాటలోని అభ్యంతర స్వరాన్ని ‘అలాంటప్పుడు ... ఎలా’ అనే నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది. మూలంలో రెండవ ప్రశ్నకు ప్రత్యక్ష ఉద్ధరణ చిహ్నాలు లేకపోయినా, వారు యేసు పలికిన మాటను ప్రస్తావిస్తున్నారని తెలుగులో స్పష్టత కోసం అంతర్గత ఉద్ధరణ చిహ్నాలు వాడాం.
