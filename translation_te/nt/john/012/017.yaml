source:
  edition: SBLGNT
  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: te
  text: కాబట్టి, యేసు లాజరును సమాధిలోనుండి పిలిచి, మృతులలోనుండి అతనిని లేపినప్పుడు ఆయనతో ఉన్న జనసమూహం సాక్ష్యమిస్తూనే ఉంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సాక్ష్యమిస్తూ ఉండేది’; గ్రీకు క్రియ సాక్ష్యం చెప్పడం లేదా సాక్షిగా ప్రకటించడం అనే భావాన్ని ఇవ్వగలదు. ఇది యోహాను సువార్తలో పునరావృతమయ్యే అంశం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: సాక్ష్యమిస్తూ ఉంది
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృతమవుతున్న సాక్ష్యక్రియను సూచిస్తుంది. యోహాను రచనలో పునరావృతమయ్యే సాక్ష్య భావాన్ని కూడా ఈ పదప్రయోగం నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందరి సందర్భంతో ఉన్న కథనాత్మక, తార్కిక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ὁ ὄχλος
  choice: జనసమూహం
  rationale: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: ὁ ὢν μετ’ αὐτοῦ
  choice: ఆయనతో ఉన్న
  rationale: గత సంఘటన సమయంలో యేసుతో ఉన్న నిర్దిష్ట జనసమూహాన్ని సహజమైన తెలుగులో గుర్తిస్తుంది.
- source_word: ἐφώνησεν
  choice: పిలిచి
  rationale: లాజరును యేసు పిలిచిన చర్యను అదనపు తీవ్రతను చేర్చకుండా నేరుగా తెలియజేస్తుంది.
- source_word: ἐκ τοῦ μνημείου
  choice: సమాధిలోనుండి
  rationale: ἐκ సూచించే వెలుపలికి కదలికను, μνημεῖον యొక్క సమాధి అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἤγειρεν
  choice: లేపినప్పుడు
  rationale: మృతుని లేపే సందర్భంలో ἐγείρω యొక్క పునరుత్థాన భావాన్ని పరిరక్షిస్తుంది.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: గ్రీకు బహువచన నిర్మాణాన్ని, ‘మృతుల మధ్యనుండి’ అనే భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: లాజరును మృతులలోనుండి లేపిన ప్రకటన
  choice: మృతులలోనుండి అతణ్ణి లేపినప్పుడు
  alternative: చనిపోయినవారి మధ్యనుండి అతణ్ణి తిరిగి బ్రతికించినప్పుడు
  rationale: మూలంలోని ἤγειρεν మరియు ἐκ νεκρῶν పదబంధాలను నేరుగా నిలుపుతూ అద్భుత ప్రకటనను మృదువుచేయదు; అలాగే మూలంలో లేని వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిలో అనువదించబడింది. ‘సాక్ష్యమిస్తూ ఉంది’ అనే రూపం గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్ని నిలుపుతుంది.
