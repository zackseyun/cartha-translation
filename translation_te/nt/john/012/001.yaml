id: JHN.12.1
reference: John 12:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: te
  text: కాబట్టి పస్కా పండుగకు ఆరు రోజుల ముందు యేసు బేతనియకు వచ్చాడు. యేసు మృతులలోనుండి లేపిన లాజరు అక్కడ ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మృతుల మధ్యనుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి సందర్భంతో ఉన్న కథన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ఇది కఠినమైన తార్కిక నిర్ధారణను తప్పనిసరిగా సూచించదు.
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: పస్కా పండుగకు ఆరు రోజుల ముందు
  rationale: గ్రీకు కాలసూచక పదబంధాన్ని తెలుగులో సహజమైన క్రమంలో వ్యక్తం చేస్తుంది; πάσχα ఇక్కడ తెలిసిన యూదుల పండుగను సూచిస్తుంది.
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: బేతనియకు వచ్చాడు
  rationale: ἔρχομαι యొక్క సాధారణ కథనార్థాన్ని, గమ్యాన్ని సూచించే εἰςను సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ὅπου ἦν Λάζαρος
  choice: లాజరు అక్కడ ఉన్నాడు
  rationale: గ్రీకులోని సాధారణ స్థానార్థక వాక్యాన్ని నిలుపుతుంది; ‘నివసించాడు’ లేదా ‘బస చేస్తున్నాడు’ వంటి మూలంలో లేని నిర్దిష్టతను చేర్చదు.
- source_word: ἤγειρεν
  choice: లేపిన
  rationale: లాజరు మరణం నుండి తిరిగి లేపబడిన సందర్భంలో ἐγείρωకు తగిన అర్థం; తెలుగు సంబంధవాచక నిర్మాణంలో ముందుగా జరిగిన క్రియ స్పష్టంగా ఉంటుంది.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: ἐκ మరియు బహువచన νεκρῶν యొక్క ‘మృతుల మధ్యనుండి’ అనే భావాన్ని సంక్షిప్తంగా, మూలానికి సమీపంగా నిలుపుతుంది.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: సంబంధవాచక ఉపవాక్యం చివర మూలం యేసు పేరును మళ్లీ స్పష్టంగా పేర్కొంటుంది; అందువల్ల సర్వనామంతో మార్చకుండా పేరునే ఉంచాం.
theological_decisions:
- issue: లాజరును లేపినవాడిగా యేసును స్పష్టంగా గుర్తించడం
  choice: యేసు మృతులలోనుండి లేపిన లాజరు
  alternative: ఆయన మృతులలోనుండి లేపిన లాజరు
  rationale: గ్రీకు పాఠం ఉపవాక్యం చివర Ἰησοῦς అనే పేరును మళ్లీ వాడుతుంది. ఆ స్పష్టతను, దాని సంభావ్య ఉద్ఘాటనను నిలుపుతూ ‘ఆయన’గా మార్చలేదు.
- issue: ἐκ νεκρῶνలోని బహువచన భావం
  choice: మృతులలోనుండి
  alternative: మరణం నుండి
  rationale: ‘మరణం నుండి’ సహజమైన ప్రత్యామ్నాయమైనా, అది మూలంలోని ‘మృతుల మధ్యనుండి’ అనే వ్యక్తి-బహువచన రూపాన్ని భావనాత్మక ఏకవచనంగా మార్చుతుంది. అందువల్ల మూలంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘పస్కా’కు సాధారణ పాఠకునికి సందర్భం స్పష్టమయ్యేలా ‘పండుగ’ను జోడించాం. ప్రధాన వాక్యాన్ని రెండు వాక్యాలుగా విభజించడం ద్వారా తెలుగు పఠనసౌలభ్యాన్ని మెరుగుపరుస్తూనే గ్రీకు సంబంధాన్ని నిలుపుకున్నాం.
