revisions:
- from: అప్పుడు వీరు గలిలయలోని బేత్సయిదాకు చెందిన ఫిలిప్పు దగ్గరకు వచ్చి, “అయ్యా[a], మేము యేసును చూడాలనుకుంటున్నాం” అని అతన్ని అడుగుతూ ఉన్నారు.
  to: అప్పుడు వీరు గలిలయలోని బేత్సయిదాకు చెందిన ఫిలిప్పు దగ్గరకు వచ్చి, అతనితో, “అయ్యా[a], మేము యేసును చూడాలనుకుంటున్నాం” అని అడుగుతూ ఉన్నారు.
