id: JHN.12.21
reference: John 12:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: te
  text: అప్పుడు వీరు గలిలయలోని బేత్సయిదాకు చెందిన ఫిలిప్పు దగ్గరకు వచ్చి, అతనితో, “అయ్యా[a], మేము యేసును చూడాలనుకుంటున్నాం” అని అడుగుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువా.” గ్రీకు κύριε అనే సంబోధన ‘ప్రభువా’ అని కూడా అర్థమవుతుంది; ఒక వ్యక్తిని గౌరవంగా సంబోధించడానికి కూడా వాడవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι
  choice: వీరు
  rationale: మునుపటి వచనంలో ప్రస్తావించిన గ్రీకువారిని సూచించే బహువచన సర్వనామం; సాధారణ ‘వారు’ కంటే గ్రీకు నిర్దేశక బలాన్ని నిలుపుతుంది.
- source_word: οὖν
  choice: అప్పుడు
  rationale: ఇక్కడ కథన పురోగతిని సూచిస్తుంది; ఆధునిక తెలుగు కథనంలో సహజంగా ఉంటుంది.
- source_word: προσῆλθον
  choice: దగ్గరకు వచ్చి
  rationale: ఒక వ్యక్తిని సమీపించడమనే అర్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Φιλίππῳ
  choice: ఫిలిప్పు
  rationale: Φίλιππος అనే వ్యక్తి పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: గలిలయలోని బేత్సయిదాకు చెందిన
  rationale: ఫిలిప్పును అతని స్వస్థలంతో గుర్తించే గ్రీకు పదబంధాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో అందిస్తుంది.
- source_word: ἠρώτων
  choice: అడుగుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పదేపదే చేసిన అభ్యర్థన భావాన్ని నిలుపుతుంది.
- source_word: λέγοντες
  choice: అని
  rationale: ప్రత్యక్ష సంభాషణలో గ్రీకు వర్తమాన కృదంతాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: Κύριε
  choice: అయ్యా
  rationale: ఇది ఫిలిప్పును ఉద్దేశించిన గౌరవపూర్వక సంబోధన కావడంతో ‘అయ్యా’ సందర్భానికి సహజమైనది; ‘ప్రభువా’ అనే పదార్థసంభవాన్ని పాదసూచికలో ఉంచాం.
- source_word: θέλομεν
  choice: చూడాలనుకుంటున్నాం
  rationale: θέλω తెలిపే కోరికను ఆధునిక, నేరుగా అర్థమయ్యే తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸν Ἰησοῦν
  choice: యేసును
  rationale: వ్యక్తి పేరును ప్రత్యక్ష కర్మగా తెలుగులో సహజంగా విభక్తీకరించింది.
- source_word: ἰδεῖν
  choice: చూడ
  rationale: ὁράω యొక్క ప్రాథమిక అర్థమైన ‘చూడడం’ను నిలుపుతుంది; ‘కలుసుకోవడం’ వంటి సందర్భానుగత విస్తరణను మూలపాఠ్యంలోకి చేర్చదు.
theological_decisions:
- issue: ఫిలిప్పును ఉద్దేశించిన κύριε సంబోధన
  choice: అయ్యా
  alternative: ప్రభువా
  rationale: κύριε అనే పదం ‘ప్రభువా’ అని కూడా అర్థమవుతుంది; అయితే ఇక్కడ అది ఫిలిప్పుకు చెప్పబడిన గౌరవపూర్వక సంబోధన. ప్రధాన పాఠ్యంలో సందర్భోచితమైన ‘అయ్యా’ను వాడి, పదంలోని ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో నిలిపాం; దీనిని క్రీస్తు సంబంధమైన బిరుదుగా తప్పుగా అర్థం చేసుకునే అవకాశాన్ని నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథన గౌరవాన్ని నిలుపుతూ రూపొందించబడింది. గ్రీకు అసంపూర్ణ భూతకాల భావాన్ని ‘అడుగుతూ ఉన్నారు’ ద్వారా నిలిపింది.
