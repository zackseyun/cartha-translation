source:
  edition: SBLGNT
  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: te
  text: 'నన్ను తిరస్కరించి నా మాటలను స్వీకరించనివానికి తీర్పు తీర్చేది ఉంది: నేను పలికిన వాక్యమే చివరి రోజున అతనికి తీర్పు తీరుస్తుంది.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా మాటలను అంగీకరించనివానికి.’ గ్రీకు క్రియకు స్వీకరించడం, ఆహ్వానించడం లేదా అంగీకరించడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నేను పలికిన సందేశమే.’ గ్రీకు λόγος (లోగోస్) సందర్భాన్ని బట్టి ‘వాక్యం’ లేదా ‘సందేశం’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: తిరస్కరించి
  rationale: ఇక్కడ క్రియ యేసును కేవలం పట్టించుకోకపోవడం కాకుండా ఆయనను నిరాకరించడం లేదా తిరస్కరించడం అనే బలమైన భావాన్ని ఇస్తుంది.
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: నా మాటలను స్వీకరించనివాణ్ణి
  rationale: λαμβάνωకు స్వీకరించడం, అంగీకరించడం అనే భావాలు ఉన్నాయి; ‘స్వీకరించు’ యోహాను శైలిలోని సంబంధాత్మక భావాన్ని నిలుపుతుంది.
- source_word: ῥήματά
  choice: మాటలను
  rationale: బహువచన ῥήματα యేసు పలికిన మాటలను సూచిస్తుంది; ఆధునిక తెలుగులో ‘మాటలు’ సహజంగా ఉంటుంది.
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: వాణ్ణి తీర్పుతీర్చేది ఒకటి ఉంది
  rationale: గ్రీకు నిర్మాణంలోని ‘తీర్పుతీర్చేది అతనికి ఉంది’ అనే కొంత అసంపూర్ణమైన భావాన్ని నిలిపి, తరువాత వచ్చే ‘వాక్యమే’ దాని గుర్తింపని స్పష్టం చేస్తుంది. తెలుగులో వాక్యానికి సూచనగా నపుంసక రూపం సహజం.
- source_word: ὁ λόγος
  choice: వాక్యమే
  rationale: λόγοςకు ‘వాక్యం’ లేదా ‘సందేశం’ అనే అర్థాలు సాధ్యం. ఏకవచనంలోని బరువును, కొంత వ్యక్తీకరించిన తీర్పరి భావాన్ని ‘వాక్యమే’ నిలుపుతుంది.
- source_word: ὃν ἐλάλησα
  choice: నేను పలికిన
  rationale: ἐλάλησα యొక్క గతకాల క్రియను నేరుగా, గౌరవప్రదమైన ఆధునిక తెలుగులో ‘పలికిన’గా ఇచ్చాం.
- source_word: ἐκεῖνος
  choice: వాక్యమే
  rationale: ఎత్తిచూపే ἐκεῖνος ముందున్న λόγοςనే బలంగా తిరిగి సూచిస్తుంది; తెలుగులో ‘-ఏ’ నిపాతం ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: κρινεῖ
  choice: తీర్పుతీరుస్తుంది
  rationale: κρίνωను ‘ఖండిస్తుంది’ అని పరిమితం చేయకుండా, విస్తృతమైన న్యాయనిర్ణయ భావంతో అనువదించాం.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: చివరి రోజున
  rationale: యోహాను గ్రంథంలోని అంత్యకాల పదబంధాన్ని అదనపు సిద్ధాంత వివరాలు చేర్చకుండా సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ఈ వచనంలో తీర్పుతీర్చే సాధనం లేదా కర్త స్వభావం
  choice: యేసు పలికిన వాక్యమే చివరి తీర్పును తీర్చేదిగా వచనం చెప్పే విధానాన్ని నిలిపాం.
  alternative: ‘వాక్యం’ కేవలం ప్రమాణం మాత్రమేనని చెప్పడం, లేదా యేసే ప్రత్యేకంగా తీర్పరి అని ఈ వాక్యంలో స్పష్టీకరించడం.
  rationale: మొదట తిరస్కరించేవానికి తీర్పుతీర్చేది ఉందని చెప్పి, తరువాత దానిని యేసు పలికిన వాక్యంగా వాక్యనిర్మాణం గుర్తిస్తుంది. ఇతర యోహాను వచనాలతో సమన్వయం చేయడానికి ఈ ఉద్రిక్తతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘తీర్పుతీర్చేది ఒకటి ఉంది’ అనే నిర్మాణం మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కొంత నిలుపుతుంది; తరువాతి భాగం దానిని ‘వాక్యమే’ అని గుర్తిస్తుంది.
