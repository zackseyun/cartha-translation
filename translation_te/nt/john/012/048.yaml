revisions:
- from: 'నన్ను తిరస్కరించి, నా మాటలను స్వీకరించనివాణ్ణి తీర్పుతీర్చేది ఒకటి ఉంది: నేను పలికిన వాక్యమే చివరి రోజున అతనికి తీర్పుతీరుస్తుంది.[a][b]'
  to: 'నన్ను తిరస్కరించి నా మాటలను స్వీకరించనివానికి తీర్పు తీర్చేది ఉంది: నేను పలికిన వాక్యమే చివరి రోజున అతనికి తీర్పు తీరుస్తుంది.[a][b]'
  rationale: 'The revision repairs the Telugu syntax, removes the added indefinite ‘ఒకటి,’ and retains the source’s progression: a person who rejects Jesus and does not receive his words has a judging reality, namely the word Jesus spoke. ‘తీర్పు తీర్చేది’ permits the subsequent identification with the neuter noun ‘వాక్యం’ while preserving the text’s personifying force without resolving its theological tension.'
