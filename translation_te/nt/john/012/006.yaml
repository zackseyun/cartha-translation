  verdict: revise
  source_fidelity: 'మూల గ్రీకు వాక్యంలోని ప్రధాన భావం దాదాపు సరిగానే ఉంది: పేదల పట్ల శ్రద్ధ కాదని, యూదా దొంగతనం చేసే స్వభావమే అసలు కారణమని చెబుతుంది. అయితే “డబ్బు పెట్టె అతని దగ్గర ఉండేది” అనేది ἔχων సూచించే అతని ఆధీనము/బాధ్యత భావాన్ని కొంత బలహీనపరుస్తుంది. అలాగే τὰ βαλλόμενα బహువచనాన్ని “వేయబడిన వాటిని”గా వ్యక్తం చేయడం మరింత ఖచ్చితం.'
