id: JHN.12.6
reference: John 12:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: te
  text: అతడు ఈ మాట చెప్పింది పేదలపట్ల అతనికి శ్రద్ధ ఉండడం వల్ల కాదు; కాని అతడు దొంగ కాబట్టి, డబ్బు పెట్టె[a] అతని అధీనంలో ఉండగా, అందులో వేయబడిన వాటిని అతడు తీసుకుంటూ ఉండేవాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “డబ్బు సంచి.” గ్రీకు పదం డబ్బు ఉంచే పెట్టెను లేదా సంచిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “తీసుకుపోతూ ఉండేవాడు,” “దొంగిలిస్తూ ఉండేవాడు.” ఈ గ్రీకు క్రియకు సాధారణంగా “మోయడం” లేదా “తీసుకుపోవడం” అనే అర్థాలు ఉండవచ్చు; అయితే “అతడు దొంగ” అనే సందర్భం ఇక్కడ అక్రమంగా తీసుకోవడాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: అతడు ఈ మాట అన్నది
  rationale: δέను సందర్భానుసారమైన తేలికపాటి అనుసంధానంగా పరిగణించి, తెలుగులో అనవసరమైన కాలసూచక పదాన్ని చేర్చలేదు; τοῦτοను ‘ఈ మాట’గా స్పష్టంగా వ్యక్తం చేశాం.
- source_word: οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: పేదలపట్ల అతనికి శ్రద్ధ ఉండడం వల్ల కాదు
  rationale: οὐχ ὅτι నిరాకరించబడిన కారణాన్ని సూచిస్తుంది; μέλειతో περί + షష్ఠీ విభక్తి వ్యక్తులపట్ల ఉన్న శ్రద్ధను తెలియజేస్తుంది.
- source_word: ἀλλ’ ὅτι κλέπτης ἦν
  choice: అతడు దొంగ కావడం వల్లే
  rationale: ముందు నిరాకరించిన కారణానికి బదులుగా అసలు కారణాన్ని ἀλλ’ ὅτι తెలియజేస్తుంది. κλέπτηςకు సహజమైన, ఖచ్చితమైన తెలుగు పదం ‘దొంగ’.
- source_word: τὸ γλωσσόκομον ἔχων
  choice: డబ్బు పెట్టె అతని దగ్గర ఉండేది
  rationale: γλωσσόκομον డబ్బు ఉంచే పెట్టె లేదా సంచిని సూచించగలదు. ప్రధాన పాఠ్యంలో పారదర్శకమైన ‘డబ్బు పెట్టె’ను వాడి, ἔχων సూచించే స్వాధీనం లేదా నిర్వహణ భావాన్ని ‘అతని దగ్గర ఉండేది’గా సహజంగా తెలిపాం.
- source_word: τὰ βαλλόμενα
  choice: అందులో వేసినదాన్ని
  rationale: నిష్క్రియార్థక వర్తమాన కృదంతం పెట్టెలో వేయబడే డబ్బు లేదా వస్తువులను సూచిస్తుంది; తెలుగులో గమ్యస్థానాన్ని ‘అందులో’ అని స్పష్టం చేయడం సహజం.
- source_word: ἐβάσταζεν
  choice: తీసుకుంటూ ఉండేవాడు
  rationale: βαστάζω సాధారణంగా ‘మోయు’ లేదా ‘తీసుకుపోవు’ అని అర్థమవుతుంది. ఇక్కడ ‘దొంగ’ అనే సమీప సందర్భం అక్రమంగా తీసుకోవడాన్ని సూచిస్తుంది. అసంపూర్ణ భూతకాలంలోని అలవాటుగా కొనసాగే భావాన్ని ‘తీసుకుంటూ ఉండేవాడు’ నిలుపుతుంది.
theological_decisions:
- issue: ἐβάσταζεν యూదా దొంగతనాన్ని ఎంత స్పష్టంగా సూచిస్తుంది?
  choice: ‘అందులో వేసినదాన్ని అతడు తీసుకుంటూ ఉండేవాడు’
  alternative: ‘అందులో వేసినదాన్ని అతడు మోసేవాడు’ లేదా ‘అందులో వేసినదాన్ని అతడు దొంగిలిస్తూ ఉండేవాడు’
  rationale: ‘అతడు దొంగ’ అనే తక్షణ సందర్భం కేవలం పెట్టెను మోయడం కాక, అందులోనిదాన్ని తన కోసం తీసుకోవడాన్ని బలంగా సూచిస్తుంది. అయినా క్రియలోనే ‘దొంగిలించు’ అనే మరింత నిర్దిష్ట భావాన్ని బలవంతంగా చేర్చకుండా, సందర్భం కలిగించే ఉద్రిక్తతను ‘తీసుకుంటూ ఉండేవాడు’ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన వచన శైలిని వాడాం. గ్రీకు వాక్యంలోని కారణ-వ్యతిరేక నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపి, దీర్ఘ వాక్యాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా అమర్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
