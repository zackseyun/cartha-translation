  terminology: “పేదలు,” “దొంగ,” “డబ్బు పెట్టె” సరైన, సులభగ్రాహ్య పదాలు. γλωσσόκομονకు ప్రత్యామ్నాయమైన “డబ్బు సంచి” పాదసూచికలో సరిగ్గా ఇవ్వబడింది. ἐβάσταζενకు ప్రధాన పాఠ్యంలో “తీసుకుంటూ ఉండేవాడు” అనేది సందర్భానుగుణమైన మితమైన అనువాదం; పాదసూచికలో “దొంగిలిస్తూ ఉండేవాడు” ప్రత్యామ్నాయంగా ఉంచడం సముచితం.
