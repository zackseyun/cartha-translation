  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: te
  text: 'వారు ఖర్జూరపు మట్టలను తీసుకొని ఆయనను ఎదుర్కొనడానికి బయలుదేరారు. వారు ఇలా కేకలు వేస్తూనే ఉన్నారు: “హోసన్నా![a] ప్రభువు పేరట వచ్చేవాడు ధన్యుడు![b] ఇశ్రాయేలు రాజు కూడా!”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “హోసన్నా” అనేది హీబ్రూ మూలం గల నినాదం. దాని ప్రాథమిక భావం “ఇప్పుడే రక్షించు” లేదా “దయచేసి రక్షించు”; ఆ కాలానికి అది స్తుతి నినాదంగానూ వాడుకలో ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ మాటలు కీర్తన 118:26ను ప్రతిధ్వనిస్తున్నాయి.
    reason: cross_reference
  - marker: c
    text: లేదా, “మరియు ఇశ్రాయేలు రాజు!”
    reason: alternative_reading
lexical_decisions:
- source_word: βαΐα τῶν φοινίκων
  choice: ఖర్జూరపు మట్టలు
  rationale: βάϊον అంటే ఇక్కడ కొమ్మ లేదా మట్ట; φοῖνιξ చెట్టు రకాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఖర్జూరపు మట్టలు’ సహజంగా ఉండి రెండింటి భావాన్నీ అందిస్తుంది.
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: ఆయనను ఎదుర్కొనడానికి బయలుదేరారు
  rationale: ఈ పదబంధం ఎవరో వస్తుండగా వారిని కలుసుకోవడానికి బయటికి వెళ్లడాన్ని సూచిస్తుంది. ‘స్వాగతించడానికి’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని ఉద్దేశాన్ని చేర్చినట్లవుతుంది.
- source_word: ἐκραύγαζον
  choice: కేకలు వేస్తూనే ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే జరిగిన కేకలను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కాలాంశాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ὡσαννά
  choice: హోసన్నా
  rationale: హీబ్రూ మూలం గల ఈ ఆరాధనా నినాదాన్ని లిప్యంతరీకరించడం ద్వారా దాని స్తుతి నినాద స్వభావాన్ని నిలుపుతూ, అసలు విన్నప భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: వచ్చేవాడు ధన్యుడు
  rationale: కీర్తన 118:26 ప్రతిధ్వనిని, substantival participle భావాన్ని సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἐν ὀνόματι κυρίου
  choice: ప్రభువు పేరట
  rationale: ఇది ప్రభువు పేరు, అధికారంతో రావడాన్ని సూచించే స్థిరమైన బైబిలు ప్రయోగం. ‘పేరట’ మూలంలోని ἐν ὀνόματι నిర్మాణాన్ని సహజ తెలుగులో కాపాడుతుంది.
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: ఇశ్రాయేలు రాజు కూడా
  rationale: καί ను ‘కూడా’గా అనువదించడం ముందున్న ఆశీర్వాద వాక్యానికి రాజ బిరుదును ఉద్ఘాటనతో జోడిస్తుంది; అయితే ‘మరియు’ అనే సమన్వయ అర్థం కూడా సాధ్యమేనని పాదసూచిక తెలియజేస్తుంది.
theological_decisions:
- issue: కీర్తన ఉల్లేఖనంలోని κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: గ్రీకు పాఠంలో κυρίου ఉంది. ఇది కీర్తన 118:26ను ప్రతిధ్వనించినప్పటికీ, గ్రీకు పదాన్ని నేరుగా ప్రతిబింబించేందుకు ప్రధాన పాఠంలో ‘ప్రభువు’ ఉంచబడింది; వెనుకనున్న హీబ్రూ దైవనామాన్ని ప్రధాన పాఠంలోకి ప్రత్యక్షంగా దిగుమతి చేయలేదు.
- issue: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ యొక్క సంబంధం
  choice: ఇశ్రాయేలు రాజు కూడా
  alternative: మరియు ఇశ్రాయేలు రాజు
  rationale: καί ఇక్కడ ముందున్న ‘వచ్చేవాడు’ అనే వ్యక్తికి ‘ఇశ్రాయేలు రాజు’ అనే బిరుదును ఉద్ఘాటనతో జోడించవచ్చు; సాధారణ సమన్వయార్థం కూడా వ్యాకరణపరంగా సాధ్యమైనందున దాన్ని పాదసూచికలో నిలిపాం.
- issue: జనసమూహ నినాదంలోని రాజసంబంధమైన భావం
  choice: ఇశ్రాయేలు రాజు
  alternative: ఇశ్రాయేలు యొక్క రాజు
  rationale: మూలపాఠంలోని స్పష్టమైన రాజ బిరుదును తగ్గించకుండా, అదనపు మెస్సీయ సంబంధ వివరణను చేర్చకుండా సహజ తెలుగులో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే ఆరాధనా నినాదానికి తగిన గౌరవభరిత శైలి. కొనసాగుతున్న చర్యను ‘వేస్తూనే ఉన్నారు’తో, కీర్తనాత్మక వాక్యాన్ని సంక్షిప్త రూపంతో నిలిపాం.
