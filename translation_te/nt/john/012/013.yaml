  source_fidelity: 'మూల గ్రీకు వాక్యంలోని ప్రధాన అంశాలన్నీ నమ్మకంగా ప్రతిఫలించాయి: ఖర్జూరపు మట్టలు, ఆయనను కలుసుకోవడానికి బయటకు వెళ్లడం, అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న కేకలు, ‘హోసన్నా,’ కీర్తనాత్మక ఆశీర్వాదం, మరియు ‘ఇశ్రాయేలు రాజు’ అనే బిరుదు. ‘కూడా’ ద్వారా καί యొక్క ఉద్ఘాటనాత్మక/అప్పోజిషనల్ పఠనం సహజంగా సాధ్యమవుతుంది; పాదసూచికలో సమన్వయార్థ ప్రత్యామ్నాయం కూడా ఉంది.'
