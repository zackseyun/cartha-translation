source:
  edition: SBLGNT
  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: te
  text: ఆయన శిష్యులు మొదట ఈ విషయాలను గ్రహించలేదు[a]. అయితే యేసు మహిమపరచబడినప్పుడు[b], ఈ విషయాలు ఆయన గురించి రాయబడి ఉన్నాయని[c], అలాగే ఆయనకు ఈ విషయాలు చేశారని శిష్యులు జ్ఞాపకం చేసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మొదట ఈ విషయాలు వారికి తెలియలేదు.’
    reason: lexical_alternative
  - marker: b
    text: యోహాను సువార్తలో ‘మహిమపరచబడడం’ సాధారణంగా యేసు మరణం, పునరుత్థానం, ఉన్నతీకరణ ద్వారా పొందిన మహిమను సూచిస్తుంది.
    reason: cross_reference
  - marker: c
    text: లేదా, ‘ఆయన విషయమై రాయబడి ఉన్నాయని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: గ్రహించలేదు
  rationale: సందర్భంలో శిష్యులకు వాస్తవాలు తెలియకపోవడం కంటే వాటి అర్థాన్ని గుర్తించలేకపోవడమే ప్రధాన భావం; ‘గ్రహించలేదు’ సహజంగా దీనిని తెలియజేస్తుంది.
- source_word: αὐτοῦ οἱ μαθηταί
  choice: ఆయన శిష్యులు
  rationale: సంబంధాన్ని తెలిపే గ్రీకు సర్వనామాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంతో అనువదించింది.
- source_word: τὸ πρῶτον
  choice: మొదట
  rationale: కాలసూచకమైన ఈ ప్రయోగానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానం.
- source_word: ἐδοξάσθη
  choice: మహిమపరచబడినప్పుడు
  rationale: యోహాను రచనలోని బలమైన దైవశాస్త్రీయ భావాన్ని నిలుపుతూ గ్రీకు కర్మణి రూపాన్ని ప్రతిబింబిస్తుంది.
- source_word: ἐμνήσθησαν
  choice: వారికి జ్ఞాపకం వచ్చింది
  rationale: గ్రీకు రూపంలోని భావాన్ని సహజమైన ఆధునిక తెలుగు ప్రయోగంతో అందిస్తుంది.
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: ఆయనను గురించి రాయబడి ఉన్నాయని
  rationale: ἐπί + చతుర్థీ ఇక్కడ స్థలార్థం కాక ‘గురించి’ అనే భావాన్ని ఇస్తుంది; ముందే లిఖించబడిన లేఖనాలను సూచిస్తుంది.
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: వారు ఈ విషయాలను ఆయనకు చేశారని
  rationale: అనిర్దిష్ట బహువచన కర్తను అలాగే ఉంచి, αὐτῷ యొక్క సహజ దత్తివు భావాన్ని ‘ఆయనకు’గా నిలుపుతుంది.
- source_word: ταῦτα
  choice: ఈ విషయాలు / ఈ విషయాలను
  rationale: నపుంసక బహువచన సూచనను, వచనంలోని పునరుక్తిని నిలుపుతుంది.
theological_decisions:
- issue: యేసు ‘మహిమపరచబడడం’ అనే యోహానీయ భావం
  choice: మహిమపరచబడినప్పుడు
  alternative: ఘనపరచబడినప్పుడు; ఉన్నతస్థానానికి ఎత్తబడినప్పుడు
  rationale: యేసు మరణం, పునరుత్థానం, ఉన్నతీకరణతో సంబంధమున్న పొరలుగల భావాన్ని ఒకే సంఘటనకు పరిమితం చేయకుండా నిలుపుతుంది.
- issue: ταῦτα ἐποίησαν αὐτῷ లోని కర్త ఎవరు
  choice: ‘వారు’ అనే అనిర్దిష్ట కర్తను నిలుపడం
  alternative: జనులు ఈ విషయాలను ఆయనకు చేశారని
  rationale: గ్రీకు మూలంలో కర్త స్పష్టంగా పేర్కొనబడలేదు; సందర్భం దానిని సూచించినా అనువాదం దానిని నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మహిమపరచబడినప్పుడు’ అనే పదబంధం యోహాను సువార్తలోని దైవశాస్త్రీయ ఉద్వేగాన్ని నిలుపుతుంది; ‘వారు’ అనే కర్తను మూలంలాగే అనిర్దిష్టంగా ఉంచింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా చేర్చబడ్డాయి.
