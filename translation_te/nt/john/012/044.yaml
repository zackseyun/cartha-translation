id: JHN.12.44
reference: John 12:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: te
  text: 'అయితే యేసు బిగ్గరగా పలికాడు: “నన్ను నమ్మేవాడు నన్ను నమ్మడం కాదు[a], నన్ను పంపినవానిని నమ్ముతాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యేసు విశ్వాసానికి తగిన లక్ష్యం కాదని ఇది నిరాకరించడం లేదు. ఆయనను నమ్మడం, ఆయనను పంపిన తండ్రిని నమ్మడం నుండి విడదీయలేనిదని ఈ మాట తెలియజేస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: సందర్భంలోని స్వల్ప మార్పును, కొంత వ్యత్యాసాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: ἔκραξεν καὶ εἶπεν
  choice: బిగ్గరగా ఇలా అన్నాడు
  rationale: κράζω సూచించే బహిరంగమైన, గట్టిగా పలికిన మాటను సహజంగా వ్యక్తపరుస్తూ, καὶ εἶπεν‌ను కూడా సమగ్రంగా అందిస్తుంది.
- source_word: Ὁ πιστεύων
  choice: నమ్మేవాడు
  rationale: ఆర్టికల్‌తో ఉన్న వర్తమాన కృదంతపు సాధారణ, వ్యక్తివాచక భావాన్ని సంక్షిప్తమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πιστεύων / πιστεύει
  choice: నమ్మేవాడు / నమ్మడం / నమ్ముతున్నాడు
  rationale: యోహాను రచనలో πιστεύω εἰς‌కు సాధారణమైన వ్యక్తిగత విశ్వాస దిశను ‘నమ్ము’ సహజంగా తెలియజేస్తుంది; మూలంలోని పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: εἰς ἐμέ
  choice: నన్ను
  rationale: ‘నమ్ము’ అనే తెలుగు క్రియతో వ్యక్తిని ఉద్దేశించినప్పుడు ద్వితీయావిభక్తి సహజమైన సమానార్థక నిర్మాణం; అక్షరార్థంగా ‘నాలో’ అనడం ఇక్కడ అసహజం.
- source_word: ἀλλὰ εἰς τὸν πέμψαντά με
  choice: నన్ను పంపినవానినే
  rationale: ἀλλά యొక్క బలమైన వ్యత్యాసాన్ని ‘-నే’ ద్వారా తెలియజేస్తూ, మూలంలో ఉన్న కృదంత నిర్మాణాన్నీ, పంపినవాని పరోక్ష సూచననూ నిలుపుతుంది; ప్రధాన పాఠ్యంలో ‘తండ్రి’ అని ముందుగానే స్పష్టం చేయదు.
theological_decisions:
- issue: ‘నన్ను నమ్మడం కాదు; నన్ను పంపినవానినే నమ్ముతున్నాడు’ అనే వాక్యం యేసు విశ్వాసానికి తగిన లక్ష్యం కాదని అపార్థం కావచ్చు.
  choice: మూలంలోని నిరాకరణ-వ్యత్యాస ఉద్వేగాన్ని యథాతథంగా నిలిపి, దాని ఉద్దేశాన్ని పాదటిప్పణిలో వివరించడం.
  alternative: ‘నన్ను మాత్రమే నమ్మడం కాదు’ అని అనువదించడం లేదా ప్రధాన పాఠ్యంలో ‘తండ్రిని’ అని చేర్చడం.
  rationale: గ్రీకులో ‘మాత్రమే’ అనే పదం లేదు; దాన్ని చేరిస్తే మూలంలోని ఉద్దేశపూర్వకమైన ధార్మిక ఉద్వేగం పరిష్కరించబడుతుంది. యేసును నమ్మడం ఆయనను పంపినవానిని నమ్మడం నుండి వేరుకాదనే భావాన్ని పాదటిప్పణి వివరిస్తుంది, కానీ ప్రధాన పాఠ్యాన్ని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘బిగ్గరగా ఇలా అన్నాడు’ ప్రజల సమక్షంలో గట్టిగా పలికిన భావాన్ని అందిస్తుంది. ‘నమ్మేవాడు’ సాధారణ వ్యక్తిని సూచించే నిర్మాణం. మూలంలో లేని ‘మాత్రమే’ లేదా ‘తండ్రి’ ప్రధాన పాఠ్యంలో చేర్చబడలేదు.
