revisions:
- from: 'అయితే యేసు బిగ్గరగా ఇలా అన్నాడు: “నన్ను నమ్మేవాడు నన్ను నమ్మడం కాదు[a]; నన్ను పంపినవానినే నమ్ముతున్నాడు.”'
  to: 'అయితే యేసు బిగ్గరగా పలికాడు: “నన్ను నమ్మేవాడు నన్ను నమ్మడం కాదు[a], నన్ను పంపినవానిని నమ్ముతాడు.”'
  rationale: The revision removes the non-source-based exclusive force of -నే and restores a more direct generic present parallel in the second clause. It retains the Greek rhetorical tension, the repeated ‘నమ్ము,’ and the sender’s indirect identification. The footnote remains anchored at the rhetorical denial and explains it without inserting interpretation into the main text.
  reviewer_model: gpt-5.6-terra
