id: JHN.12.23
reference: John 12:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: te
  text: 'అయితే యేసు వారికి జవాబిస్తూ చెప్పాడు: “మనుష్య కుమారుడు[b] మహిమపరచబడటానికి గడియ[a] వచ్చింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సమయం.” గ్రీకులో “గడియ” అని ఉంది; యోహాను సువార్తలో ఈ పదం యేసు బాధ మరియు మహిమకు నిర్ణయించబడిన ఘడియను పదేపదే సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మానవుని కుమారుడు.” గ్రీకు బిరుదైన “మనుష్య కుమారుడు” దానియేలు 7ను ప్రతిధ్వనింపజేస్తుంది; దాని వేదాంతపరమైన, అంతర్గ్రంథ బలాన్ని నిలుపడానికి ఇక్కడ అదే రూపం ఉంచబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται αὐτοῖς λέγων
  choice: వారికి జవాబిస్తూ ఇలా అన్నాడు
  rationale: గ్రీకు వర్తమానకాల కథన రూపాన్ని తెలుగులో సహజమైన భూతకాల కథనంగా అందిస్తూ, λέγων ప్రత్యక్ష మాటను పరిచయం చేసే పనిని కూడా స్పష్టంగా నిలుపుతుంది.
- source_word: Ἐλήλυθεν
  choice: వచ్చింది
  rationale: గ్రీకు సంపూర్ణకాలం సూచించే—వచ్చి ఇప్పుడు సమీపించిన స్థితిలో ఉన్న—భావాన్ని తెలుగు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὥρα
  choice: గడియ
  rationale: యోహాను సువార్తలో యేసు బాధ, మరణం, మహిమకు నిర్ణయించబడిన సమయాన్ని సూచించే పునరావృత పదబంధాన్ని ‘సమయం’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: δοξασθῇ
  choice: మహిమపరచబడే
  rationale: గ్రీకు కర్మణి రూపాన్ని కాపాడి, యోహానులో యేసు మరణం, పునరుత్థానం, ఉన్నతపరచబడడం కలిసిన సమృద్ధమైన భావాన్ని అనవసరంగా కుదించదు.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: దానియేలు 7తో ఉన్న అంతర్గ్రంథ సంబంధాన్ని, యేసు ఉపయోగించిన క్రీస్తుసంబంధ బిరుదు యొక్క బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే బిరుదు అనువాదం
  choice: మనుష్య కుమారుడు
  alternative: మానవుడు
  rationale: ఇది మానవత్వాన్ని మాత్రమే తెలిపే సాధారణ పదం కాదు; దానియేలు 7 ప్రతిధ్వనితో కూడిన క్రీస్తుసంబంధ బిరుదు. సంప్రదాయ రూపం ఆ అంతర్గ్రంథ, అంత్యకాల సంబంధ బలాన్ని నిలుపుతుంది.
- issue: Ἐλήλυθεν ἡ ὥρα యొక్క కాలరూపం మరియు యోహాను సంబంధ భావం
  choice: గడియ వచ్చింది
  alternative: సమయం వచ్చింది; గడియ సమీపించింది
  rationale: ‘గడియ’ యోహానులోని నిర్ణీత ఘడియ అనే ప్రధాన భావాన్ని నిలుపుతుంది; ‘వచ్చింది’ నిర్ణాయక సమయం ఇప్పటికే చేరిందనే సంపూర్ణకాల ఫలితస్థితిని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘మహిమపరచబడే’ అనే కర్మణి రూపం మూలంలోని ఉద్దేశపూర్వక వేదాంత ఉద్వేగాన్ని నిలుపుతుంది. పాదసూచిక గుర్తులు అవి వివరిస్తున్న ‘గడియ’ మరియు ‘మనుష్య కుమారుడు’ పదాలకే జోడించబడ్డాయి.
