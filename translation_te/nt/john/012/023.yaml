revisions:
- from: 'అయితే యేసు వారికి జవాబిస్తూ ఇలా అన్నాడు: “మనుష్య కుమారుడు[b] మహిమపరచబడే గడియ[a] వచ్చింది.”'
  to: 'అయితే యేసు వారికి జవాబిస్తూ చెప్పాడు: “మనుష్య కుమారుడు[b] మహిమపరచబడటానికి గడియ[a] వచ్చింది.”'
  rationale: The revision preserves every key Greek feature while making the purpose/content relation of ἵνα δοξασθῇ explicit in idiomatic Telugu. It also refines the alternative-title footnote so that it does not reduce the title to the generic “human.” Footnote anchors remain attached to the terms they explain.
  reviewer_model: gpt-5.6-terra
