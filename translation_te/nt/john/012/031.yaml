id: JHN.12.31
reference: John 12:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νῦν κρίσις ἐστὶν τοῦ κόσμου τούτου, νῦν ὁ ἄρχων τοῦ κόσμου τούτου ἐκβληθήσεται ἔξω·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: te
  text: ఇప్పుడు ఈ లోకానికి తీర్పు జరుగుతోంది; ఇప్పుడు ఈ లోకపు అధిపతి[a] బయటకు వెళ్లగొట్టబడతాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ లోకపు పాలకుడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘ఈ లోకపు అధిపతి’ అనే మాట సాధారణంగా సాతానును సూచిస్తుందని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: రెండు చోట్లా ఉన్న కాలసూచక బలాన్ని, గ్రీకు వాక్యంలోని సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: κρίσις
  choice: తీర్పు
  rationale: కేవలం పరిశీలన కాకుండా, ఈ లోకంపై సంభవిస్తున్న నిర్ణాయక న్యాయతీర్పును సూచిస్తుంది.
- source_word: κόσμου τούτου
  choice: ఈ లోకం
  rationale: τούτου అనే నిర్దేశక పదాన్ని, యోహాను రచనలో కనిపించే ప్రస్తుత లోకవ్యవస్థకు సంబంధించిన భావాన్ని కాపాడుతుంది.
- source_word: ἄρχων
  choice: అధిపతి
  rationale: అధికారం చెలాయించే వ్యక్తి అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘రాజు’ అని అనువదిస్తే మూలంలో లేని రాజరిక భావం బలపడవచ్చు.
- source_word: ἐκβληθήσεται ἔξω
  choice: బయటకు వెళ్లగొట్టబడతాడు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని, ἔξω వల్ల బలపడిన వెలివేత భావాన్ని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: ‘ఈ లోకపు అధిపతి’ ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘ఈ లోకపు అధిపతి’ అనే బిరుదునే ఉంచడం
  alternative: సాతాను లేదా అపవాది అని స్పష్టంగా పేర్కొనడం
  rationale: యోహాను సందర్భంలో ఈ మాట సాధారణంగా సాతానును సూచిస్తుందని అర్థం చేసుకున్నప్పటికీ, గ్రీకు పాఠ్యం పేరు కాకుండా బిరుదును వాడుతుంది. అందువల్ల ప్రధాన పాఠ్యం ఆ అంతర్లీనతను కాపాడుతుంది.
- issue: κρίσις యొక్క కాలసంబంధ భావం
  choice: ‘తీర్పు జరుగుతోంది’
  alternative: ‘తీర్పు వచ్చింది’ లేదా ‘తీర్పు సమయం’
  rationale: νῦν ... ἐστίν నిర్మాణం తీర్పు యొక్క ప్రస్తుత, నిర్ణాయక సంభవాన్ని తెలియజేస్తుంది; తెలుగులో సహజంగా ఉండేందుకు క్రియాత్మకంగా అందించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘ఇప్పుడు’ అనే పదాన్ని రెండుసార్లు ఉంచి మూలంలోని ఉద్ఘాటనను కాపాడాం. ప్రతి పాదటిప్పణి సూచికను సంబంధిత ప్రధాన పాఠ్య భాగం వద్ద ఉంచాం.
