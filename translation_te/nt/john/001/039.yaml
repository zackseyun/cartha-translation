id: JHN.1.39
reference: John 1:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: te
  text: ఆయన వారితో, “రండి, మీరే చూస్తారు” అన్నాడు. కాబట్టి వారు వెళ్లి, ఆయన ఎక్కడ ఉంటున్నాడో చూశారు. ఆ రోజు వారు ఆయన దగ్గరే బస చేశారు. అది దాదాపు పదో గంట.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సూర్యోదయం నుంచి లెక్కిస్తే ఇది సాయంత్రం సుమారు నాలుగు గంటలు; కొందరు రోమన్ కాలగణన ప్రకారం దీన్ని ఉదయం సుమారు పది గంటలుగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔρχεσθε
  choice: రండి
  rationale: వర్తమానకాల బహువచన ఆజ్ఞార్థక రూపం ఇక్కడ ఆహ్వానంగా పనిచేస్తుంది. ‘రండి’ సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష ఆహ్వానం.
- source_word: ὄψεσθε
  choice: చూస్తారు
  rationale: భవిష్యత్‌కాల బహువచన రూపాన్ని నిలుపుతూ, యేసు ఇచ్చిన ఆహ్వానానికి అనుసరించే ఫలితాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἦλθαν οὖν
  choice: కాబట్టి వారు వెళ్లి
  rationale: οὖν సూచించే సహజ పర్యవసానాన్ని ‘కాబట్టి’ తెలియజేస్తుంది. కథనంలో శిష్యుల కదలికను సహజ తెలుగులో ‘వెళ్లి’గా చెప్పడం సముచితం.
- source_word: εἶδαν
  choice: చూశారు
  rationale: సాధారణ కథన క్రియగా అనువదించడంతో పాటు, ముందున్న ὄψεσθεతో గల పదప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ποῦ μένει
  choice: ఆయన ఎక్కడ ఉంటున్నాడో
  rationale: ఈ సందర్భంలో μένω ఆయన తాత్కాలికంగా బస చేస్తున్న స్థలాన్ని సూచిస్తుంది; ‘ఉంటున్నాడో’ ప్రస్తుత కొనసాగింపు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: παρ’ αὐτῷ
  choice: ఆయనతోనే
  rationale: παρά దత్తివుతో ఇక్కడ సాన్నిహిత్యం, సహవాసం సూచిస్తుంది. ‘తోనే’ వారు ఆయన సన్నిధిలో ఉండిపోయారనే భావాన్ని సహజంగా ఇస్తుంది.
- source_word: ἔμειναν
  choice: ఉన్నారు
  rationale: తెలుగులో సహజమైన కథన రూపం; ముందున్న ‘ఉంటున్నాడో’తో μένω పదానికి సంబంధించిన అనుసంధానాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: τὴν ἡμέραν ἐκείνην
  choice: ఆ రోజు
  rationale: మూలంలోని కాలవ్యవధిని అదనపు వ్యాఖ్యానం లేకుండా నేరుగా తెలియజేస్తుంది.
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: అప్పుడు దాదాపు పదో గంట అయింది
  rationale: ὡςను ‘దాదాపు’గా, δεκάτηను ‘పదో గంట’గా ఉంచి, వివాదాస్పదమైన కాలగణన పద్ధతిని ప్రధాన పాఠ్యంలో నిర్ణయించదు.
- source_word: λέγει αὐτοῖς
  choice: ఆయన వారితో … అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని సహజ తెలుగు కథనశైలికి అనుగుణంగా భూతకాలంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘పదో గంట’ను లెక్కించే విధానం
  choice: ప్రధాన పాఠ్యంలో మూలంలోని ‘పదో గంట’ అనే సమయ వ్యక్తీకరణను నిలుపడం
  alternative: సూర్యోదయం నుంచి లెక్కించి సాయంత్రం సుమారు 4 గంటలు అని, లేదా రోమా కాలగణన ప్రకారం ఉదయం సుమారు 10 గంటలు అని ప్రధాన పాఠ్యంలో పేర్కొనడం
  rationale: మూలపాఠ్యం ఏ కాలగణన పద్ధతిని ఉద్దేశించిందో స్పష్టంగా చెప్పదు. అందువల్ల ప్రధాన పాఠ్యం సందిగ్ధతను నిలుపుతుంది; ముఖ్యమైన రెండు అవగాహనలను పాదసూచిక అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘రండి, చూస్తారు’ అనే రూపం తెలుగులో కొద్దిగా సంక్షిప్తంగా వినిపించినా, మూలంలోని ఆహ్వానం–భవిష్యత్ ఫలితం నిర్మాణాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
