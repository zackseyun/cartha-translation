  to: ఆయన వారితో, “రండి, మీరే చూస్తారు” అన్నాడు. కాబట్టి వారు వెళ్లి, ఆయన ఎక్కడ ఉంటున్నాడో చూశారు. ఆ రోజు వారు ఆయన దగ్గరే బస చేశారు. అది దాదాపు పదో గంట.[a]
  rationale: సవరణలు మూలంలోని ఆహ్వానం–భవిష్యత్ ఫలిత క్రమాన్ని, బస/ఉండటం అనే సందర్భాన్ని, మరియు వివాదాస్పదంగా ఉన్న సమయవ్యక్తీకరణను కాపాడుతూనే ఆధునిక ప్రామాణిక తెలుగులో వాక్యప్రవాహాన్ని మెరుగుపరుస్తాయి. ప్రధాన పాఠ్యం ఏ కాలగణన విధానాన్నీ ఎంచుకోకుండా ‘పదో గంట’నే ఉంచుతుంది; పాదసూచిక రెండు సాధారణ అవగాహనలను మాత్రమే తెలియజేస్తుంది.
