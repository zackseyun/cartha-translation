source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: te
  text: వారు అతనిని అడిగారు, “అయితే ఏమిటి? నీవు ఏలీయావా?” అతడు, “కాను” అన్నాడు.[b] “నీవు ఆ ప్రవక్తవా?” అని వారు అడిగారు.[a] అతడు, “కాదు” అని జవాబిచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ నిరీక్షిత ప్రవక్తవా?” ఇది మోషేలాంటి ప్రవక్త వస్తాడనే నిరీక్షణను సూచిస్తూ ఉండవచ్చు (ద్వితీయోపదేశకాండము 18:15, 18).
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో ఇక్కడ “అంటున్నాడు” అనే వర్తమాన కాల రూపం ఉంది; గత సంఘటనను సజీవంగా చెప్పే కథన శైలి ఇది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: అడిగారు
  rationale: ప్రశ్నించడం అనే సాధారణ కథనార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలో లేని తీవ్రతను చేర్చదు.
- source_word: Τί οὖν;
  choice: అయితే ఏమిటి?
  rationale: మునుపటి నిరాకరణల నుంచి వచ్చే సంక్షిప్తమైన తదుపరి ప్రశ్నను, దాని ఆకస్మికతను నిలుపుతుంది.
- source_word: σὺ Ἠλίας εἶ
  choice: నువ్వు ఏలీయావా?
  rationale: σὺ లోని ప్రత్యక్ష ఉద్ఘాటనను తెలుగు ప్రశ్నలో సహజంగా వ్యక్తం చేస్తూ, Ἠλίας పేరుకు ప్రామాణిక తెలుగు రూపమైన ‘ఏలీయా’ను వాడుతుంది.
- source_word: Οὐκ εἰμί
  choice: కాను
  rationale: మూలంలోని సంక్షిప్తమైన నిషేధాత్మక సమాధానాన్ని అదనపు పదాలు లేకుండా సహజంగా నిలుపుతుంది.
- source_word: Ὁ προφήτης
  choice: ఆ ప్రవక్త
  rationale: నిర్దిష్టంగా ఎదురుచూసిన వ్యక్తిని సూచించే గ్రీకు నిర్దేశకాన్ని నిలుపుతుంది; అతని గుర్తింపును ప్రధాన పాఠ్యంలో వివరించి తేల్చదు.
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో ఇది కథనాన్ని సజీవంగా చేసే చారిత్రక వర్తమాన కాలం; తెలుగు కథన సహజత్వం కోసం భూతకాలంగా అనువదించి, మూల రూపాన్ని పాదసూచికలో తెలిపాం.
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: ప్రశ్నకు ప్రత్యక్షంగా స్పందించడాన్ని తెలిపే సహజమైన తెలుగు కథన రూపం.
- source_word: Οὔ
  choice: కాదు
  rationale: స్వతంత్ర నిషేధాత్మక సమాధానానికి సహజమైన, సంక్షిప్తమైన తెలుగు సమానం.
theological_decisions:
- issue: ‘ఆ ప్రవక్త’ గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘ఆ ప్రవక్త’ అని మాత్రమే అనువదించడం
  alternative: ద్వితీయోపదేశకాండము 18లోని మోషేలాంటి ప్రవక్త అని ప్రధాన పాఠ్యంలో వివరించడం; లేదా సాధారణంగా ‘ఒక ప్రవక్త’ అని అనువదించడం
  rationale: గ్రీకు నిర్దేశకం ఒక నిర్దిష్టంగా ఎదురుచూసిన వ్యక్తిని సూచిస్తుంది. భావ్యమైన మోషే-సదృశ ప్రవక్త సూచనను పాదసూచికలో తెలియజేస్తూ, ప్రధాన పాఠ్యంలోని చారిత్రక-దైవశాస్త్ర సంబంధమైన ఉద్వేగాన్ని కాపాడాం.
- issue: ఏలీయా గురించి యోహాను చేసిన నిరాకరణ
  choice: ‘కాను’ అని సూటిగా అనువదించడం
  alternative: ‘నేను అక్షరార్థంగా ఏలీయాను కాను’ అని విస్తరించడం లేదా ఇతర సువార్త భాగాలతో సమన్వయపరచడం
  rationale: ఈ వచనంలో ఉన్న ప్రత్యక్ష నిరాకరణను ఇతర భాగాల ఆధారంగా మార్చకుండా లేదా వివరణతో పరిమితం చేయకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘కాను’ మరియు ‘కాదు’ మధ్య ఉన్న మూలపాఠ్య సంక్షిప్త సమాధాన భేదాన్ని సాధ్యమైనంత సహజంగా నిలిపాం. సంభాషణ ప్రవాహం కోసం చివరి ప్రశ్నకు ‘అని అడిగినప్పుడు’ చేర్చబడింది; ఇది గ్రీకు సందర్భంలో అంతర్భూతమైన ప్రశ్న-సమాధాన సంబంధాన్ని మాత్రమే స్పష్టం చేస్తుంది.
