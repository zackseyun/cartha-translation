id: JHN.1.50
reference: John 1:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: te
  text: 'యేసు అతనికి జవాబుగా ఇలా అన్నాడు: “నేను నిన్ను అంజూరపు చెట్టు కింద చూశానని నీతో చెప్పినందుకు నీవు నమ్ముతున్నావా?[a] వీటికంటే గొప్పవాటిని నీవు చూస్తావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నిన్ను అంజూరపు చెట్టు కింద చూశానని నీతో చెప్పాను కాబట్టే నీవు నమ్ముతున్నావా?”
    reason: మొదటి ὅτιతో మొదలయ్యే ప్రశ్నను తెలుగులో కారణంపై మరింత నేరుగా దృష్టి పెట్టే విధంగా కూడా నిర్మించవచ్చు.
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: జవాబుగా ఇలా అన్నాడు
  rationale: గ్రీకు సంభాషణా సూత్రంలోని రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగులో అనవసర పునరుక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: Ὅτι
  choice: చెప్పినందుకు
  rationale: మొదటి ὅτι యేసు ప్రశ్నలో కారణాన్ని సూచిస్తుంది; తెలుగులో ఈ రూపం ప్రశ్నార్థక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ὅτι εἶδόν σε
  choice: నిన్ను … చూశానని
  rationale: రెండవ ὅτι యేసు చెప్పిన మాటలోని విషయాన్ని పరిచయం చేస్తుంది; ‘అని’ దాని విషయార్థక విధిని స్పష్టంగా చూపుతుంది.
- source_word: ὑποκάτω τῆς συκῆς
  choice: అంజూరపు చెట్టు కింద
  rationale: నిర్దిష్టమైన దృశ్యాన్ని కాపాడే, సాధారణ ఆధునిక తెలుగు పదబంధం.
- source_word: πιστεύεις
  choice: నీవు నమ్ముతున్నావా?
  rationale: వర్తమానకాల ప్రశ్నను సహజంగా వ్యక్తం చేస్తూ, యోహాను సువార్తలోని నమ్మకం అనే ప్రధాన భావాన్ని నిలుపుతుంది.
- source_word: μείζω τούτων
  choice: వీటికంటే గొప్పవాటిని
  rationale: నపుంసక బహువచన తులనాత్మక రూపాన్ని బహువచనంగానే కాపాడుతుంది.
- source_word: ὄψῃ
  choice: నీవు చూస్తావు
  rationale: భవిష్యత్తు సూచనను సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πιστεύεις యొక్క ప్రశ్నార్థక బలం
  choice: ‘నీవు నమ్ముతున్నావా?’ అనే ప్రశ్న
  alternative: ‘నీవు నమ్ముతున్నావు’ అనే వాక్యం లేదా స్వల్ప మందలింపును మరింత బలంగా సూచించే ప్రశ్న
  rationale: పాఠంలోని ప్రశ్నార్థక నిర్మాణాన్ని నిలుపుతూ, నతనయేలు విశ్వాసాన్ని యేసు మందలిస్తున్నాడని పాఠం కంటే ఎక్కువగా నిర్ధారించదు.
- issue: మొదటి ὅτι యొక్క కారణార్థక అనుసంధానం
  choice: ‘చెప్పినందుకు’
  alternative: ‘నేను చెప్పాను కాబట్టే …?’
  rationale: కారణ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; ‘కాబట్టే’లో ఉండగల అదనపు నొక్కిచెప్పే భావాన్ని ప్రధాన పాఠంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. ‘అంజూరపు చెట్టు’ సాధారణ బైబిలు వాడుకతో పాటు మూలంలోని συγκεκριతను నిలుపుతుంది; ‘నీవు’ ఏకవచన సంబోధనను స్పష్టంగా ఉంచుతుంది.
