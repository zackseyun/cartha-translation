    reason: సర్వనామం ఎవరిని సూచిస్తుందో స్పష్టీకరించడం
  revision_rationale: The revision removes an unwarranted lexical specification (“మాట”) and renders παρὰ Ἰωάννου directly as “యోహాను నుండి.” It preserves the temporal sequence, the partitive sense “one of the two,” and the source-text pronoun, while the footnote supplies only the contextual antecedent.
