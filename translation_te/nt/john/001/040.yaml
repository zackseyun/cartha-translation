review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Andrew as Simon Peter’s literal brother and one of two persons who heard and then followed. However, “యోహాను మాట విని” narrows the Greek παρὰ Ἰωάννου (‘from John’) to John’s specific words. “యోహాను నుండి విని” is both natural and closer to the source.
  naturalness: The relative-clause structure and final predication are natural modern Telugu. Replacing “యోహాను మాట విని” with “యోహాను నుండి విని” improves idiomatic precision without making the phrasing stiff.
  terminology: “సీమోను పేతురు,” “సోదరుడు,” “అంద్రెయ,” and “అనుసరించిన” are suitable. The respectful pronoun “ఆయనను” is appropriate in this register. The footnote correctly identifies Jesus as the contextual referent without inserting the name into the main text.
  issues:
  - severity: medium
    issue: “యోహాను మాట విని” is more specific than the Greek.
    rationale: παρὰ Ἰωάννου states that the hearing was from John, but does not explicitly supply “మాట” (‘word/message’). “యోహాను నుండి విని” retains the source expression and remains idiomatic Telugu.
  revised_text: సీమోను పేతురు సోదరుడైన అంద్రెయ, యోహాను నుండి విని ఆయనను[a] అనుసరించిన ఆ ఇద్దరిలో ఒకడు.
