  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: te
  text: సీమోను పేతురు సోదరుడైన అంద్రెయ, యోహాను నుండి విని ఆయనను[a] అనుసరించిన ఆ ఇద్దరిలో ఒకడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “ఆయనను” అనేది సందర్భంలో యేసును సూచిస్తుంది.
    reason: సర్వనామం ఎవరిని సూచిస్తుందో స్పష్టీకరించడం
lexical_decisions:
- source_word: ἦν
  choice: ఒకడు
  rationale: గ్రీకు వాక్యంలోని గుర్తింపు నిర్మాణాన్ని తెలుగులో సహజంగా వాక్యాంతంలోని ‘ఒకడు’ ద్వారా వ్యక్తం చేశాం; విడిగా ‘ఉన్నాడు’ అనడం అవసరం లేదు.
- source_word: Ἀνδρέας
  choice: అంద్రెయ
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు లిప్యంతరీకరణ ప్రకారం ఇచ్చాం.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: సీమోను పేతురు సోదరుడైన
  rationale: సహజమైన తెలుగు సంబంధవాచక నిర్మాణంతో అక్షరార్థమైన కుటుంబ సంబంధాన్ని నిలిపాం.
- source_word: εἷς ἐκ τῶν δύο
  choice: ఆ ఇద్దరిలో ఒకడు
  rationale: భాగసూచక గ్రీకు ప్రయోగానికి సహజమైన, కచ్చితమైన తెలుగు సమానం.
- source_word: τῶν ἀκουσάντων
  choice: విని
  rationale: వినడం ముందుగా, అనుసరించడం తరువాత జరిగిన వరుసను తెలుగు అసమాపక క్రియ సహజంగా తెలియజేస్తుంది.
- source_word: παρὰ Ἰωάννου
  choice: యోహాను మాట
  rationale: παρά + షష్ఠీ విభక్తి ఇక్కడ వినబడిన మాటకు యోహాను మూలమని సూచిస్తుంది. ‘యోహాను నుండి విని’ కంటే ‘యోహాను మాట విని’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది; సందర్భానికి మించిన బిరుదును చేర్చలేదు.
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: ఆయనను అనుసరించిన
  rationale: ἀκολουθέωను నేరుగా ‘అనుసరించు’గా అనువదించాం. αὐτῷలోని పురుష ఏకవచన సర్వనామాన్ని ‘ఆయనను’గా ఉంచి, దాని సూచిత వ్యక్తిని ప్రధాన వాక్యంలో పేరుతో భర్తీ చేయలేదు.
theological_decisions:
- issue: αὐτῷ సూచించే వ్యక్తి
  choice: ప్రధాన పాఠంలో ‘ఆయనను’ అని ఉంచడం; సందర్భంలో అది యేసును సూచిస్తుంది
  alternative: ‘యేసును అనుసరించిన’ అని స్పష్టీకరించడం; లేదా యోహానును సూచిస్తుందని చదవడం
  rationale: గ్రీకు పాఠం సర్వనామాన్నే వాడుతుంది. యోహాను 1:35–39 కథన సందర్భం ఆ ఇద్దరు యేసును అనుసరించారని స్పష్టం చేస్తుంది. అందువల్ల మూలంలోని సర్వనామ రూపాన్ని పాఠంలో నిలిపి, సూచనను పాదసూచికలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని పాటించాం. గ్రీకు వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, తెలుగులో సహజమైన సంబంధవాచక నిర్మాణం మరియు వాక్యాంత గుర్తింపు రూపాన్ని వాడాం.
