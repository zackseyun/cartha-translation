- from: సీమోను పేతురు సోదరుడైన అంద్రెయ, యోహాను మాట విని ఆయనను[a] అనుసరించిన ఆ ఇద్దరిలో ఒకడు.
  to: సీమోను పేతురు సోదరుడైన అంద్రెయ, యోహాను నుండి విని ఆయనను[a] అనుసరించిన ఆ ఇద్దరిలో ఒకడు.
  rationale: The revision removes an unwarranted lexical specification (“మాట”) and renders παρὰ Ἰωάννου directly as “యోహాను నుండి.” It preserves the temporal sequence, the partitive sense “one of the two,” and the source-text pronoun, while the footnote supplies only the contextual antecedent.
