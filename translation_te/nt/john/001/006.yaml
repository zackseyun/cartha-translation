- from: దేవుని నుండి పంపబడిన ఒక మనిషి వచ్చాడు; అతని పేరు యోహాను.[a]
  to: దేవుని నుండి పంపబడిన ఒక మనిషి ఉన్నాడు; అతని పేరు యోహాను.[a]
  rationale: The revision replaces a potentially over-specific arrival verb with an existential introduction reflecting Ἐγένετο in context. It retains the passive divine commissioning and the source sense of παρὰ θεοῦ. The footnote now offers a genuine compact Telugu alternative corresponding to ‘named John,’ without adding theological or historical interpretation.
