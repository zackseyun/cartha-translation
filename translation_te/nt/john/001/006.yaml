  yaml_path: translation/nt/john/001/006.yaml
  text: There was a man sent from God[a], whose name was John.
translation:
  language: te
  text: దేవుని నుండి పంపబడిన ఒక మనిషి ఉన్నాడు; అతని పేరు యోహాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత సంక్షిప్తంగా, “దేవుని నుండి పంపబడిన యోహాను అనే ఒక మనిషి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: వచ్చాడు
  rationale: ఇక్కడ γίνομαι కథనంలో ఒక కొత్త వ్యక్తిని పరిచయం చేస్తుంది. ‘వచ్చాడు’ సహజమైన ఆధునిక తెలుగు; అతడు సృష్టించబడ్డాడని గానీ కేవలం కనిపించాడని గానీ అదనపు భావాన్ని చేర్చదు.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: ఇది యోహాను అనే ఒక పురుష వ్యక్తిని సూచిస్తుంది; ‘ఒక మనిషి’ సహజంగా, నిర్దిష్ట సూచనకు తగినట్లుగా ఉంది.
- source_word: ἀπεσταλμένος
  choice: పంపబడిన
  rationale: పరిపూర్ణ కర్మణి కృదంతం యోహాను పంపబడినవాడని తెలియజేస్తుంది. ‘పంపబడిన’ కర్మణి భావాన్ని, అతని నియామకాన్ని నేరుగా నిలుపుతుంది.
- source_word: παρὰ θεοῦ
  choice: దేవుని నుండి
  rationale: జనిటివ్‌తో παρά ఇక్కడ మూలాన్ని లేదా పంపినవారి వైపు నుంచి వచ్చిన నియామకాన్ని సూచిస్తుంది. ‘దేవుని నుండి’ ఆ మూలభావాన్ని కాపాడుతుంది; ‘దేవునిచేత’ అయితే కార్యనిర్వాహకత్వాన్ని ఎక్కువగా నొక్కిచెబుతుంది.
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: అతని పేరు యోహాను
  rationale: గ్రీకు నుడికారం అక్షరార్థంగా ‘అతనికి పేరు—యోహాను’ అనే గుర్తింపు భావాన్ని ఇస్తుంది. ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: Ἰωάννης
  choice: యోహాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ప్రామాణిక నామరూపం.
theological_decisions:
- issue: యోహాను పంపబడిన కార్యం యొక్క స్వభావం
  choice: యోహాను దేవుని నుండి పంపబడినవాడిగా చూపబడుతున్నాడు.
  alternative: యోహాను దేవునిచేత పంపబడ్డాడు.
  rationale: ἀπεσταλμένος παρὰ θεοῦ అనే పదబంధం దైవిక మూలం మరియు నియామకాన్ని సూచిస్తుంది. ‘దేవుని నుండి’ అనే అనువాదం ఆ మూలాన్ని నిలుపుతూ, ఈ వాక్యం నేరుగా చెప్పని ప్రవక్త పదవి గురించిన తరువాతి సిద్ధాంతాలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని రెండు భాగాలను అర్ధవిరామంతో కలిపి, వ్యక్తి పరిచయం మరియు పేరును స్పష్టంగా ఉంచాం.
