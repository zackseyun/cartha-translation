- from: 'యోహాను ఆయన గురించి సాక్ష్యమిస్తున్నాడు; బిగ్గరగా ప్రకటిస్తూ ఇలా అన్నాడు: “నేను ఎవరి గురించి, ‘నా తర్వాత వస్తున్నవాడు నాకంటే ముందున్నవాడయ్యాడు[a], ఎందుకంటే ఆయన నాకంటే ముందే ఉన్నాడు[b]’ అని చెప్పానో, ఆయనే ఈయన.”'
