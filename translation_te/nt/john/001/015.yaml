source:
  edition: SBLGNT
  text: (Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)
base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: te
  text: 'యోహాను ఆయన గురించి సాక్ష్యమిస్తున్నాడు; బిగ్గరగా ఇలా ప్రకటించాడు: “ఈయనే నేను, ‘నా తర్వాత వస్తున్నవాడు నాకంటే ముందున్నవాడయ్యాడు[a], ఎందుకంటే ఆయన నాకంటే ముందే ఉన్నాడు[b]’ అని చెప్పినవాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకంటే ప్రాధాన్యం పొందాడు,” “నన్ను మించిపోయాడు.” గ్రీకు పదబంధం కాలక్రమంతో పాటు స్థానం లేదా ప్రాధాన్యాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయన నాకంటే ముందే ఉనికిలో ఉన్నాడు.” ప్రధాన పాఠంలోని “ముందే ఉన్నాడు” గ్రీకు మాటకు మరింత సమీపంగా ఉండి, సందర్భంలో పూర్వ-ఉనికి భావానికి కూడా చోటిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: సాక్ష్యమిస్తున్నాడు
  rationale: వర్తమాన కాలంలోని సజీవమైన, కొనసాగుతున్న సాక్ష్యార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: περὶ αὐτοῦ
  choice: ఆయన గురించి
  rationale: περί + షష్ఠీ విభక్తి భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κέκραγεν
  choice: బిగ్గరగా ప్రకటిస్తూ ఇలా అన్నాడు
  rationale: కేక వేయడం లేదా బిగ్గరగా పిలవడం అనే భావాన్ని సందర్భానుకూలంగా తెలుపుతుంది; గ్రీకు పరిపూర్ణ కాలంలోని గత ప్రకటనకు ప్రస్తుతం నిలిచే సాక్ష్యబలాన్ని తెలుగు వాక్య నిర్మాణంలో సాధ్యమైనంతగా సూచిస్తుంది.
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: నేను ఎవరి గురించి ... అని చెప్పానో, ఆయనే ఈయన
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజంగా పునర్వ్యవస్థీకరించి, గుర్తింపును బలంగా నిలుపుతుంది.
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: నా తర్వాత వస్తున్నవాడు
  rationale: కాలక్రమం లేదా సేవలో తరువాత రావడం రెండింటికీ వీలున్న అస్పష్టతను కాపాడుతుంది.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: నాకంటే ముందున్నవాడయ్యాడు
  rationale: γέγονεν యొక్క ‘అయ్యాడు’ భావాన్నీ, ἔμπροσθεν యొక్క ముందు/ప్రాధాన్య భావాన్నీ అతిగా వ్యాఖ్యానించకుండా ఉంచుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: πρῶτός μου ἦν
  choice: ఆయన నాకంటే ముందే ఉన్నాడు
  rationale: కాలపూర్వత్వం లేదా ప్రాధాన్యం అనే భావాన్ని సహజ తెలుగులో నిలుపుతూ, ‘ముందే ఉనికిలో ఉన్నాడు’ అని వివరణాత్మకంగా విస్తరించదు.
theological_decisions:
- issue: చివరి ఉపవాక్యం క్రీస్తు పూర్వ-ఉనికిని ఎంత స్పష్టంగా చెప్పాలి
  choice: “ఆయన నాకంటే ముందే ఉన్నాడు” అని అనువదించడం
  alternative: “ఆయన నాకంటే ముందే ఉనికిలో ఉన్నాడు”
  rationale: సందర్భం పూర్వ-ఉనికిని బలంగా సూచించినా, మూలంలోని సంక్షిప్తమైన ‘ఉన్నాడు’ అనే రూపాన్ని విస్తరించకుండా theological tensionను కాపాడుతుంది.
- issue: ἔμπροσθέν μου γέγονεν లో కాలపూర్వత్వమా లేక స్థాయి/ప్రాధాన్యమా
  choice: “నాకంటే ముందున్నవాడయ్యాడు” అనే సమీప రూపం
  alternative: “నాకంటే ప్రాధాన్యుడు అయ్యాడు” లేదా “నన్ను మించిపోయాడు”
  rationale: గ్రీకు పదబంధం క్రమం, స్థానం, ప్రాధాన్యం వంటి అనుబంధ భావాలకు వీలు ఇస్తుంది; ప్రధాన పాఠంలో ఒక భావాన్ని మాత్రమే ఖరారు చేయకుండా అడుగుటిప్పణిలో ప్రత్యామ్నాయాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, బైబిలు సాక్ష్యప్రకటనకు తగిన గౌరవప్రదమైన శైలిలోనూ రూపొందించబడింది. “ఆయన/ఈయన” రూపాలు యేసును సూచించడంలో తెలుగు గౌరవప్రయోగాన్ని పాటిస్తాయి.
