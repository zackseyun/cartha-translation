source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: te
  text: 'యోహాను వారికి ఇలా జవాబిచ్చాడు: “నేను నీళ్లలో బాప్తిస్మం ఇస్తాను. మీ మధ్య[a] మీకు తెలియని ఒకరు నిలిచి ఉన్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ నడుమ.”
    reason: μέσος ὑμῶν అనే గ్రీకు పదబంధానికి మరింత అక్షరార్థమైన తెలుగు ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: యోహాను వారికి ఇలా జవాబిచ్చాడు
  rationale: తెలుగులో సహజమైన సంభాషణా ప్రవేశంగా అనువదిస్తూ, ‘జవాబిచ్చాడు’ ద్వారా ἀπεκρίθη అర్థాన్ని, ‘ఇలా’ ద్వారా λέγων పరిచయం చేసే ప్రత్యక్ష వాక్యాన్ని వ్యక్తం చేసింది.
- source_word: βαπτίζω
  choice: బాప్తిస్మం ఇస్తున్నాను
  rationale: క్రైస్తవ సందర్భంలో విస్తృతంగా అర్థమయ్యే స్థిరమైన తెలుగు పదబంధం; ‘ముంచుతున్నాను’ అని అనువదించి మూలపదం సూచించని విధానపరమైన ప్రత్యేకతను రుద్దదు.
- source_word: ἐν ὕδατι
  choice: నీళ్లలో
  rationale: ἐν అనే విభక్తి సంబంధాన్ని నేరుగా నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా వినిపిస్తుంది. ‘నీళ్లతో’ కూడా సాధ్యమే కాని అది సాధనార్థాన్ని ముందుకు తెస్తుంది.
- source_word: μέσος ὑμῶν
  choice: మీ మధ్య
  rationale: సమూహం నడుమ ఉన్న ఉనికిని సరళమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἕστηκεν
  choice: నిలిచి ఉన్నారు
  rationale: పూర్తభూత రూపంలోని ప్రస్తుత స్థితి భావాన్ని ‘నిలిచి ఉన్నారు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: మీకు తెలియని ఒకరు
  rationale: οἶδα యొక్క విస్తృతమైన ‘తెలుసు’ భావాన్ని కాపాడుతుంది; ‘మీరు గుర్తించని’ అని అనువదిస్తే కేవలం గుర్తుపట్టలేకపోవడమనే సన్నని భావం వస్తుంది.
theological_decisions:
- issue: మధ్య నిలిచి ఉన్న పేరులేని వ్యక్తి గుర్తింపు
  choice: ‘ఒకరు’ అని మాత్రమే పేర్కొనడం
  alternative: ‘మెస్సీయ’ లేదా ‘యేసు’ అని స్పష్టంగా పేర్కొనడం
  rationale: తదుపరి సందర్భం ఆయనను గుర్తించినప్పటికీ, ఈ వచనం ఉద్దేశపూర్వకంగా పేరు చెప్పదు. అందువల్ల మూలంలోని కథన ఉత్కంఠను నిలిపింది.
- issue: పేరులేని వ్యక్తికి తెలుగు గౌరవ వచనం
  choice: ‘ఒకరు నిలిచి ఉన్నారు’
  alternative: ‘ఒకడు నిలిచి ఉన్నాడు’
  rationale: తెలుగులో వ్యక్తిని సూచించడానికి సహజమైన గౌరవ రూపాన్ని వాడింది; ఇది ఆయన గుర్తింపును అదనంగా వెల్లడించదు లేదా ప్రత్యేక సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘బాప్తిస్మం’ అనే సుపరిచిత పదాన్ని ఉంచి, బాప్తిస్మ విధానంపై మూలంలో లేని నిర్దిష్టతను చేర్చలేదు.
