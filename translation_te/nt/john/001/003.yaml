id: JHN.1.3
reference: John 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν
base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: te
  text: సమస్తమూ ఆయన ద్వారా ఉనికిలోకి వచ్చింది. ఆయన లేకుండా ఉనికిలోకి వచ్చిన ఏదీ ఉనికిలోకి రాలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ఈ చివరి భాగాన్ని 4వ వచనంతో కలిపి: “ఉనికిలోకి వచ్చినది ఆయనలో జీవమై ఉండింది.”'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: సమస్తమూ
  rationale: నపుంసక బహువచనానికి ఉన్న సమగ్ర భావాన్ని, సృష్టించబడిన సమస్తాన్ని సూచించే విస్తృతిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δι’ αὐτοῦ
  choice: ఆయన ద్వారానే
  rationale: διά + షష్ఠీ విభక్తి మాధ్యమం లేదా కార్యసాధక పాత్రను సూచిస్తుంది. ‘ద్వారా’ ఆ భావాన్ని నిలుపుతుంది; ‘నే’ సమస్తం ఆయన ద్వారానే ఉనికిలోకి వచ్చిందనే వాక్యబలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐγένετο
  choice: ఉనికిలోకి వచ్చింది / ఉనికిలోకి రాలేదు
  rationale: ఇక్కడ γίνομαι కేవలం తయారు చేయబడటాన్ని కాక ఉనికిని పొందటాన్ని సూచిస్తుంది. అందువల్ల ‘సృష్టించబడింది’ కంటే ‘ఉనికిలోకి వచ్చింది’ మూలభావాన్ని నేరుగా నిలుపుతుంది.
- source_word: χωρὶς αὐτοῦ
  choice: ఆయన లేకుండా
  rationale: χωρίς సూచించే వేరుపాటు లేదా ఆయనకు స్వతంత్రంగా సంభవించలేదనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: οὐδὲ ἕν
  choice: ఒక్కటి కూడా
  rationale: οὐδέ + ἕν లోని సంపూర్ణ, బలమైన నిరాకరణను సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ὃ γέγονεν
  choice: ఉనికిలోకి వచ్చినది
  rationale: ఈ ముసాయిదాలో సంబంధవాచక భాగాన్ని 3వ వచనంతో కలిపి చదివాం. పరిపూర్ణ కాలంలోని, ఉనికిలోకి వచ్చి ఇప్పుడు ఉనికిలో ఉన్నదనే భావాన్ని తెలుగు సందర్భంలో సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: చివరి భాగమైన ὃ γέγονεν ఏ వచనంతో కలుస్తుంది?
  choice: 'దాన్ని 3వ వచనంతో కలిపి: ‘ఆయన లేకుండా ఉనికిలోకి వచ్చినది ఒక్కటి కూడా ఉనికిలోకి రాలేదు.’'
  alternative: 'దాన్ని 4వ వచనారంభంతో కలిపి: ‘ఉనికిలోకి వచ్చినది ఆయనలో జీవమై ఉండింది.’'
  rationale: ప్రాచీన గ్రీకు ప్రతుల్లో నేటి విధమైన విరామచిహ్నాలు లేకపోవడం వల్ల రెండు విభజనలకూ అవకాశం ఉంది. ప్రధాన పాఠంలో SBLGNT ఇచ్చిన విభజనను అనుసరించాం; నిజమైన పాఠ్యార్థ సందిగ్ధతను తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ఉనికిలోకి వచ్చింది’ అనే పదబంధం ప్రస్తావన భాగంలోని ఉన్నత భావాన్ని నిలుపుతూ γίνομαι యొక్క అస్తిత్వార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
