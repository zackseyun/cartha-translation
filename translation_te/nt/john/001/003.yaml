  source_fidelity: మొదటి వాక్యం πάντα, δι’ αὐτοῦ, ἐγένετο భావాలను నమ్మకంగా తెలియజేస్తుంది. అయితే రెండవ వాక్యంలోని “ఉనికిలోకి వచ్చినది ఒక్కటి కూడా ఉనికిలోకి రాలేదు” అనే పదక్రమం సంబంధవాచకమైన ὃ γέγονεν ను తెలుగు వాక్యంలో అస్పష్టంగా చేస్తుంది; మూలంలోని ‘not even one thing ... that has come into being’ అనే పరిమితి స్పష్టంగా రావాలి. ‘ఆయన లేకుండా’ అనేది χωρὶς αὐτοῦకు సరైనది. ప్రత్యామ్నాయ విభజనను పాదసూచికలో ఉంచడం అవసరం మరియు సరైనది.
