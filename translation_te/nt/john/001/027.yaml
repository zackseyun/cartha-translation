  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: te
  text: నా తర్వాత వచ్చేవాడు—ఆయన చెప్పు పట్టీని విప్పడానికి కూడా నేను అర్హుడను కాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: నా తర్వాత వస్తున్నవాడు
  rationale: నిర్దిష్ట వ్యక్తిని సూచించే substantival present participle భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది. ‘నా తర్వాత’ అనేది ఇక్కడ స్థలపరమైన వెనుకకంటే కాలక్రమం లేదా పరిచర్యా క్రమాన్ని సూచిస్తుంది.
- source_word: οὗ
  choice: ఆయన ... పట్టీ
  rationale: గ్రీకు షష్ఠీ సంబంధ సర్వనామంలోని స్వామ్య సంబంధాన్ని తెలుగులో ‘ఆయన చెప్పు పట్టీ’ అనే సహజ నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: οὐκ εἰμὶ ἄξιος
  choice: నేను తగినవాణ్ణి కాను
  rationale: ἄξιος లోని యోగ్యత లేదా అర్హత భావాన్ని, యోహాను వ్యక్తం చేసిన వినయాన్ని అతిగా వ్యాఖ్యానించకుండా తెలియజేస్తుంది.
- source_word: ἵνα λύσω
  choice: విప్పడానికి
  rationale: యోగ్యతను తెలిపే పదబంధం తర్వాత వచ్చిన ἵνα + subjunctive నిర్మాణాన్ని తెలుగులో సహజమైన క్రియార్థక రూపంతో అందించింది.
- source_word: ἱμάντα
  choice: పట్టీ
  rationale: చెప్పును బిగించే తోలు లేదా ఇతర పదార్థపు strap భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: τοῦ ὑποδήματος
  choice: చెప్పు
  rationale: పాదరక్షను సూచించే పదం; చారిత్రక సందర్భంలో sandal భావాన్ని తెలుగులో సాధారణంగా, సహజంగా ‘చెప్పు’ తెలియజేస్తుంది.
theological_decisions:
- issue: ‘నా తర్వాత’ అనే మాటకు రాబోయే వ్యక్తితో ఉన్న సంబంధం
  choice: కాలక్రమం లేదా పరిచర్యా క్రమాన్ని సూచించే ‘నా తర్వాత వస్తున్నవాడు’
  alternative: నా వెనుక వస్తున్నవాడు
  rationale: యోహాను సందర్భంలో తన తర్వాత పరిచర్యలో ప్రత్యక్షమయ్యే వ్యక్తిని సూచిస్తున్నాడు. సమీప వచనాల్లోని ఆయన శ్రేష్ఠత భావాన్ని ఈ మాటలోకి అదనంగా చొప్పించకుండా, అసలు వాక్యంలోని ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే గౌరవప్రదంగా ఉంచబడింది. ‘కూడా’ గ్రీకులోని భావాన్ని సహజ తెలుగులో బలపరుస్తుంది; కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
