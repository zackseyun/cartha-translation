source:
  edition: SBLGNT
  text: Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: te
  text: ఆయన లోకంలో ఉన్నాడు. లోకం ఆయన ద్వారా ఉనికిలోకి వచ్చింది[a]. లోకం ఆయనను తెలుసుకోలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లోకం ఆయన ద్వారా చేయబడింది.’ గ్రీకు క్రియకు ‘ఉనికిలోకి వచ్చింది’ లేదా ‘ఏర్పడింది’ అనే అర్థం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘తెలుసుకోలేదు’ అనే మాటకు ఇక్కడ ‘గుర్తించలేదు’ లేదా ‘అంగీకరించలేదు’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: లోకం
  rationale: ఈ పదం వచనంలో మూడుసార్లు వస్తుంది. ‘లోకం’ అనే ఒకే పదాన్ని నిలకడగా వాడడం ద్వారా సృష్టి, నివాసిత ప్రపంచం, మానవ సమాజం అనే యోహాను రచనలోని అంతర్లీన భావ ఛాయలు ఏ ఒక్కదానికీ పరిమితం కాకుండా నిలుస్తాయి.
- source_word: ἦν
  choice: ఉన్నాడు
  rationale: εἰμί యొక్క అపూర్ణ భూతకాల రూపం ఇక్కడ కొనసాగుతున్న ఉనికిని లేదా సన్నిధిని సూచిస్తుంది. వ్యక్తిగత పురుష సూచనను తెలుగులో సహజంగా తెలియజేయడానికి ‘ఉన్నాడు’ సరిపోతుంది.
- source_word: δι’ αὐτοῦ
  choice: ఆయన ద్వారానే
  rationale: διά + షష్ఠీ విభక్తి మధ్యవర్తిత్వాన్ని లేదా సాధనత్వాన్ని తెలియజేస్తుంది. ‘ఆయన ద్వారా’ అనే మూల భావాన్ని ‘ద్వారానే’ స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; ‘ఏ’ సందర్భంలోని ఉద్ఘాటనను తెలుగులో సహజంగా బలపరుస్తుంది, అయితే గ్రీకులో ప్రత్యేక ఉద్ఘాటక కణం లేనందున ఇది స్వల్ప శైలీ విస్తరణ.
- source_word: ἐγένετο
  choice: ఉనికిలోకి వచ్చింది
  rationale: γίνομαι ఇక్కడ లోకం ఉనికిలోకి రావడాన్ని సూచిస్తుంది. ఈ అనువాదం ముందున్న ἦν (‘ఉన్నాడు’)తో గ్రీకు మూలంలో కనిపించే ‘ఉండడం—ఉనికిలోకి రావడం’ భేదాన్ని కాపాడుతుంది.
- source_word: ἔγνω
  choice: ఎరుగలేదు
  rationale: γινώσκω యొక్క ప్రాథమిక భావమైన ‘ఎరుగుట/తెలుసుకొనుట’ను ఇది కాపాడుతుంది. సందర్భంలో గుర్తించడం లేదా అంగీకరించడం అనే భావాలు కూడా ఉండవచ్చు; వాటిలో ఒక్కదానికే మూలపాఠాన్ని పరిమితం చేయకుండా ‘ఎరుగలేదు’ అని అనువదించబడింది.
- source_word: αὐτόν / αὐτοῦ
  choice: ఆయనను / ఆయన
  rationale: సర్వనామాలు ముందు సందర్భంలోని వాక్యమైన లోగోసును సూచిస్తాయి. గ్రీకులోని వ్యక్తిగత పురుష సూచనను తెలుగులో ‘ఆయన’ ద్వారా గౌరవప్రదంగా, సహజంగా నిలుపుతాము.
- source_word: καί
  choice: వాక్య విభజన; ‘అయినా’
  rationale: మొదటి καίను తెలుగులో సహజమైన వాక్య క్రమం కోసం ప్రత్యేక సంధిపదం లేకుండా వాక్య విభజనతో చూపించాం. చివరి καί సందర్భంలో విరుద్ధ ఫలితాన్ని కలుపుతుంది కాబట్టి ‘అయినా’ అని సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: వ్యక్తంగా చెప్పని కర్త ఎవరనే ప్రశ్న
  choice: ముందటి సందర్భంలోని వాక్యమైన లోగోసును సూచిస్తూ ‘ఆయన’ అని వ్యక్తిగత పురుష రూపంలో అనువదించడం
  alternative: ‘వాక్యం’ అనే నామవాచకాన్ని విడిగా మాత్రమే పరిగణించి నపుంసక సూచన వాడడం
  rationale: ఈ వచనంలో కర్త నామవాచకం మళ్లీ రాకపోయినా, యోహాను 1:1–9 సందర్భం వ్యక్తిగతమైన లోగోసునే కొనసాగిస్తుంది. ‘ఆయన’ అనే రూపం సందర్భంలోని వ్యక్తిగత సూచనను కాపాడుతుంది; తరువాతి సిద్ధాంత పదజాలాన్ని మాత్రం చేర్చదు.
- issue: లోగోసుతో సంబంధంలో సృష్టి భాష
  choice: ‘లోకం ఆయన ద్వారానే ఉనికిలోకి వచ్చింది’ అని అనువదించి లోకం ఉనికిలోకి వచ్చినదనీ, ఆయన అప్పటికే ఉన్నాడనీ సూచించే క్రియాభేదాన్ని నిలుపడం
  alternative: ‘లోకం ఆయన ద్వారా చేయబడింది’
  rationale: ἦν మరియు ἐγένετο మధ్య యోహాను ఉంచిన భేదం వచనంలోని భావ ఉద్రిక్తతకు ముఖ్యమైనది. ‘ఉన్నాడు’—‘ఉనికిలోకి వచ్చింది’ అనే జత మూలపాఠంలోని భేదాన్ని అదనపు సిద్ధాంత వివరణ లేకుండా ప్రతిబింబిస్తుంది.
- issue: లోకం ఆయనను ‘ఎరుగకపోవడం’ యొక్క పరిధి
  choice: ‘ఎరుగలేదు’ అని విస్తృత భావాన్ని నిలుపడం
  alternative: ‘గుర్తించలేదు’ లేదా ‘అంగీకరించలేదు’ అని ఒక నిర్దిష్ట భావాన్ని ప్రధాన పాఠంలో పెట్టడం
  rationale: సందర్భంలో గుర్తింపు, సంబంధపూర్వక జ్ఞానం, అంగీకారం అన్న భావాలు ప్రతిధ్వనించవచ్చు. ‘ఎరుగలేదు’ వాటిలో ఒక్కదానిని మాత్రమే నిర్ణయించకుండా గ్రీకు పదంలోని ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘ఎరుగలేదు’ కొద్దిగా సాహిత్య గంభీరత కలిగినప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదం; గ్రీకు పదంలోని ‘తెలుసుకోవడం/గుర్తించడం/అంగీకరించడం’ అనే భావ విస్తృతిని ఇది బాగా నిలుపుతుంది. మూడు సందర్భాల్లోనూ κόσμοςకు ‘లోకం’ అనే పదమే వాడబడింది.
