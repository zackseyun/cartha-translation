- from: ఆయన లోకంలో ఉన్నాడు. లోకం ఆయన ద్వారానే ఉనికిలోకి వచ్చింది[a]. అయినా లోకం ఆయనను ఎరుగలేదు[b].
  to: ఆయన లోకంలో ఉన్నాడు. లోకం ఆయన ద్వారా ఉనికిలోకి వచ్చింది[a]. లోకం ఆయనను తెలుసుకోలేదు[b].
  rationale: The revision removes the exclusivizing suffix from ‘ద్వారానే’ and the adversative ‘అయినా,’ preserving the Greek’s unmarked connectives. It also updates the final verb to natural modern Telugu without narrowing γινώσκω’s range. The creation/existence contrast and the repeated ‘లోకం’ are retained.
