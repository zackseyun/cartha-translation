id: JHN.1.45
reference: John 1:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: te
  text: 'ఫిలిప్పు నతనయేలును కనుగొని అతనితో ఇలా అన్నాడు: “ధర్మశాస్త్రంలో మోషే, ప్రవక్తలు కూడా ఎవరి గురించి రాశారో ఆయనను మేము కనుగొన్నాం—నజరేతు నుండి వచ్చిన యోసేపు కుమారుడైన యేసును.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: కనుగొని
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథన ప్రవాహంలో తరువాతి మాటక్రియతో కలిపి ‘కనుగొని ... అన్నాడు’ అనడం సహజం.
- source_word: λέγει
  choice: అన్నాడు
  rationale: చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు కథన భూతకాలంగా అందిస్తుంది.
- source_word: Ὃν ... ἔγραψεν
  choice: ఎవరి గురించి రాశారో ఆయనను
  rationale: సంబంధవాచక సర్వనామం వ్యక్తిని సూచిస్తుండగా, γράφω యొక్క భావాన్ని తెలుగులో సహజంగా పూర్తి చేయడానికి ‘గురించి’ వాడబడింది.
- source_word: ἐν τῷ νόμῳ
  choice: ధర్మశాస్త్రంలో
  rationale: మోషేతో అనుబంధమైన లేఖన సముదాయాన్ని సూచించే స్థిరమైన, సాధారణ తెలుగు బైబిలు పదప్రయోగం.
- source_word: οἱ προφῆται
  choice: ప్రవక్తలు
  rationale: ప్రవక్తలను, సందర్భానుసారం వారి లేఖన సాక్ష్యాన్ని సూచించే నేరమైన అనువాదం.
- source_word: εὑρήκαμεν
  choice: మేము కనుగొన్నాం
  rationale: గ్రీకు పరిపూర్ణ కాలంలోని, ఇప్పటికీ ప్రాముఖ్యమున్న కనుగొనుట అనే ఫలిత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: యోసేపు కుమారుడైన
  rationale: ఫిలిప్పు పలికిన సాధారణ సామాజిక గుర్తింపును మార్పు చేయకుండా అందిస్తుంది.
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: నజరేతు నుండి వచ్చిన
  rationale: ἀπό లోని మూలస్థానం లేదా అనుబంధ భావాన్ని ‘నుండి వచ్చిన’ అని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: Ναθαναήλ
  choice: నతనయేలు
  rationale: ఆధునిక ప్రామాణిక తెలుగు బైబిలు నామరూపానికి అనుగుణమైన లిప్యంతరీకరణ.
- source_word: Ἰησοῦν
  choice: యేసు
  rationale: తెలుగులో స్థిరపడిన నామరూపం.
- source_word: Μωϋσῆς
  choice: మోషే
  rationale: తెలుగులో స్థిరపడిన నామరూపం.
theological_decisions:
- issue: ‘యోసేపు కుమారుడు’ అనే గుర్తింపు మరియు క్రీస్తుశాస్త్రం
  choice: ఫిలిప్పు చెప్పినట్లే ‘యోసేపు కుమారుడైన యేసు’ అని నిలుపబడింది.
  alternative: ‘యోసేపు కుమారుడని భావించబడిన యేసు’ లేదా న్యాయపరమైన/సామాజిక కుమారత్వమని వివరణ చేర్చడం.
  rationale: ఈ వాక్యం ఫిలిప్పు చేసిన ప్రారంభ గుర్తింపును నివేదిస్తుంది. తరువాతి సిద్ధాంత అవగాహనను మూలపాఠ్యంలోకి చేర్చి అతని మాటలను మార్చకూడదు.
- issue: మోషే మరియు ప్రవక్తల లేఖన సాక్ష్యపు పరిధి
  choice: ‘ధర్మశాస్త్రంలో మోషే, అలాగే ప్రవక్తలు ఎవరి గురించి రాశారో’ అని ఇద్దరి సాక్ష్యాన్ని వ్యక్తిపై కేంద్రీకరించి అనువదించబడింది.
  alternative: ‘ధర్మశాస్త్రంలో మోషే ఎవరి గురించి రాశాడో, ప్రవక్తలు కూడా ఎవరి గురించి రాశారో’ అని మరింత విస్తరించడం.
  rationale: గ్రీకు వాక్య నిర్మాణంలోని రెండు లేఖన సాక్ష్యాలను నిలుపుతూ, ఫిలిప్పు చెప్పిన దానికంటే ప్రత్యేకమైన మెస్సీయ వ్యాఖ్యానాన్ని అదనంగా రుద్దదు.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన భూతకాల క్రమంగా మార్చి, ‘నజరేతు నుండి వచ్చిన’ అనే మూలార్థాన్ని స్పష్టంగా నిలిపింది.
