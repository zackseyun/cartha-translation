revisions:
- from: ఫిలిప్పు నతనయేలును కనుగొని అతనితో, “ధర్మశాస్త్రంలో మోషే, అలాగే ప్రవక్తలు ఎవరి గురించి రాశారో ఆయనను మేము కనుగొన్నాం—నజరేతు నుండి వచ్చిన యోసేపు కుమారుడైన యేసును” అన్నాడు.
  to: 'ఫిలిప్పు నతనయేలును కనుగొని అతనితో ఇలా అన్నాడు: “ధర్మశాస్త్రంలో మోషే, ప్రవక్తలు కూడా ఎవరి గురించి రాశారో ఆయనను మేము కనుగొన్నాం—నజరేతు నుండి వచ్చిన యోసేపు కుమారుడైన యేసును.”'
  rationale: 'A light stylistic revision improves idiomatic Telugu while retaining the source’s syntax and meaning: Philip finds Nathanael and speaks; Moses in the Law and the prophets wrote concerning the person found; that person is identified as Jesus, son of Joseph, from Nazareth. The honorific pronoun is retained as normal respectful Telugu reference to Jesus and does not alter the reported social identification.'
