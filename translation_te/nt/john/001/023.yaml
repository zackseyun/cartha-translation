  to: 'అతడు ఇలా చెప్పాడు[a]: “నేను అరణ్యంలో బిగ్గరగా పిలిచే వ్యక్తి స్వరాన్ని: ‘ప్రభువు మార్గాన్ని తిన్నగా చేయండి,’ అని యెషయా ప్రవక్త చెప్పినట్లుగా.”'
