id: JHN.1.23
reference: John 1:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: te
  text: 'అతడు ఇలా చెప్పాడు[a]: “నేను అరణ్యంలో బిగ్గరగా పిలిచే వ్యక్తి స్వరాన్ని: ‘ప్రభువు మార్గాన్ని తిన్నగా చేయండి,’ అని యెషయా ప్రవక్త చెప్పినట్లుగా.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకు పదబంధంలో “అరణ్యంలో” అనేది “బిగ్గరగా పిలిచే వ్యక్తి”కి కాక “స్వరం”కి కూడా అనుసంధానమవవచ్చు: “నేను అరణ్యంలో ఉన్న స్వరాన్ని, బిగ్గరగా పిలిచే వ్యక్తి స్వరాన్ని.” అయితే ప్రధాన పాఠంలోని అనుసంధానమే ఇక్కడ మరింత సహజమైనది.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: అతడు ఇలా అన్నాడు
  rationale: సంభాషణ సందర్భంలో సహజమైన కథన పరిచయం; తరువాతి ప్రత్యక్ష వాక్యాన్ని స్పష్టంగా ప్రవేశపెడుతుంది.
- source_word: Ἐγὼ
  choice: నేను
  rationale: గ్రీకులోని స్పష్టమైన సర్వనామం స్వీయ గుర్తింపును నొక్కిచెబుతుంది; తెలుగులో ‘నేను’ ఉంచడం ఆ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: φωνὴ
  choice: స్వరం
  rationale: యోహాను తనను వ్యక్తిగా కాక, సందేశాన్ని ప్రకటించే ‘స్వరం’గా రూపకాలంకారంతో గుర్తించుకుంటున్న భావాన్ని నిలుపుతుంది.
- source_word: βοῶντος
  choice: బిగ్గరగా పిలిచే ఒకని
  rationale: క్రియలోని గట్టిగా ప్రకటించే భావాన్ని ‘బిగ్గరగా పిలిచే’ సహజంగా వ్యక్తపరుస్తుంది; షష్ఠీ సంబంధాన్ని ‘ఒకని’ నిలుపుతుంది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: ἔρημος యొక్క జనావాసం లేని ప్రాంతం అనే భావాన్నీ, ప్రవచనాత్మక ప్రతిధ్వనినీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: Εὐθύνατε
  choice: తిన్నగా చేయండి
  rationale: ఆజ్ఞారూపంలోని ప్రత్యక్ష చర్యను, మార్గాన్ని సూటిగా చేయాలనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὴν ὁδὸν
  choice: మార్గాన్ని
  rationale: భౌతిక దారి మరియు రూపకాలంకార భావం రెండింటినీ మోయగల గౌరవప్రదమైన సాధారణ పదం.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος యొక్క బిరుదాత్మక, దైవసంబంధ బరువును యెషయా ఉల్లేఖనంలో నిలుపుతుంది.
- source_word: καθὼς
  choice: చెప్పినట్లుగా
  rationale: యోహాను స్వీయ గుర్తింపుకూ యెషయా ప్రవచన వాక్యానికీ ఉన్న అనురూపతను సహజంగా సూచిస్తుంది.
- source_word: εἶπεν
  choice: చెప్పిన
  rationale: ఉల్లేఖన సూత్రానికి సరళమైన, సహజమైన తెలుగు రూపం.
- source_word: Ἠσαΐας ὁ προφήτης
  choice: యెషయా ప్రవక్త
  rationale: గ్రీకు నిర్మాణాన్ని సంక్షిప్తంగా అనుసరిస్తూ ఆధునిక తెలుగులో సహజంగా వినిపిస్తుంది.
theological_decisions:
- issue: యెషయా ఉల్లేఖనంలోని κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఇది యెషయా ప్రవచన ఉల్లేఖనం కాబట్టి సాధారణ ‘యజమాని’ కంటే దైవ బిరుదైన ‘ప్రభువు’ మూలంలోని నిబంధనాత్మక, ధార్మిక ప్రతిధ్వనిని నిలుపుతుంది; అయితే వచనం తానే వెల్లడించేదానికంటే గుర్తింపును మరింతగా వివరించదు.
- issue: ἐν τῇ ἐρήμῳ పదబంధం దేనితో అనుసంధానమవుతుంది
  choice: అరణ్యంలో బిగ్గరగా పిలిచే ఒకని స్వరం
  alternative: అరణ్యంలో ఉన్న స్వరం—బిగ్గరగా పిలిచే ఒకని స్వరం
  rationale: ప్రధాన పఠనంలో ‘అరణ్యంలో’ అనేది బిగ్గరగా పిలిచే వ్యక్తితో అనుసంధానించడం గ్రీకు వాక్యానికి అత్యంత సహజమైన నిర్మాణం. అయినా పదబంధ అనుసంధానంలో ఉన్న నిజమైన వ్యాకరణ సాధ్యతను పాదటిప్పణిలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. యెషయా ఉల్లేఖనంలోని ప్రవచనాత్మక గంభీరతను నిలుపుతూ, అతిగా ప్రాచీనమైన పదజాలాన్ని నివారించాం. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠంలో చేర్చబడింది.
