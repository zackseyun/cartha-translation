id: JHN.1.4
reference: John 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/004.yaml
  text: In him was life[a], and the life was the light of men.
translation:
  language: te
  text: ఆయనలో జీవం ఉండేది; ఆ జీవమే మనుష్యుల వెలుగు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: ἐνతో కూడిన దత్తివిభక్తి సహజంగా ‘లో’ అని అనువదించబడుతుంది. αὐτῷ ముందున్న λόγοςను సూచిస్తుంది; యోహాను సందర్భంలో వాక్కు వ్యక్తిగతంగా చిత్రించబడినందున గౌరవప్రదమైన వ్యక్తివాచక రూపం ‘ఆయనలో’ ఎంచుకోబడింది.
- source_word: ζωὴ
  choice: జీవం
  rationale: ζωή యొక్క సరళమైన అర్థం ‘జీవం.’ ఇక్కడ దానిని ‘నిత్యజీవం’ అని విస్తరించకుండా, యోహాను సందర్భమే దాని లోతైన భావాన్ని తెలియజేయనివ్వడం సముచితం.
- source_word: ἦν
  choice: ఉండేది
  rationale: εἰμί యొక్క అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న గత స్థితిని సూచిస్తుంది. తెలుగులో ‘ఉండేది’ ఆ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἡ ζωὴ
  choice: ఆ జీవమే
  rationale: నిర్దేశక పదం ముందు ప్రస్తావించిన జీవాన్ని తిరిగి సూచిస్తుంది. ‘ఆ జీవమే’ అనేది ఆ పునఃసూచనతో పాటు వాక్యంలోని గుర్తింపు-ప్రాధాన్యాన్ని సహజంగా నిలుపుతుంది.
- source_word: τὸ φῶς
  choice: వెలుగు
  rationale: φῶςకు సహజమైన తెలుగు సమానం ‘వెలుగు.’ యోహాను రచనలోని ప్రధాన ప్రతీకాత్మక భావాన్ని ఇది కాపాడుతుంది.
- source_word: τῶν ἀνθρώπων
  choice: మనుష్యుల
  rationale: ἄνθρωποι ఇక్కడ స్త్రీపురుషులందరినీ కలుపుకొనే సాధారణ మానవ సూచన. తెలుగు ‘మనుష్యులు’ ఆ సమగ్ర భావాన్ని, అలాగే గ్రీకు సంబంధ విభక్తిని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: αὐτῷ యొక్క సూచ్యార్థం మరియు వ్యక్తిగత భావం
  choice: వాక్కును సూచించే వ్యక్తివాచక రూపంగా ‘ఆయనలో’
  alternative: ‘దానిలో,’ λόγοςను వ్యక్తిరహితమైన భావంగా తీసుకుంటే
  rationale: తక్షణ సందర్భంలో వాక్కు దేవునితో సంబంధంలో ఉండి, తరువాత శరీరధారిగా చిత్రించబడుతుంది. ‘ఆయనలో’ అనే రూపం ఈ సందర్భసిద్ధ వ్యక్తిగత భావాన్ని నిలుపుతుంది; అయితే ఈ వచనంలో లేని అదనపు సిద్ధాంతపరమైన పదజాలాన్ని చేర్చదు.
- issue: ἀνθρώπων యొక్క సమగ్ర మానవ సూచన
  choice: ‘మనుష్యుల,’ అంటే మానవులందరి
  alternative: ‘మానవాళి యొక్క’ లేదా ‘ప్రజల’
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనమైనా, ఇక్కడ భావపరంగా సమస్త మానవులను సూచిస్తుంది. ‘మనుష్యుల’ అనేది ఆధునిక తెలుగులో సహజంగా సమగ్రార్థాన్ని ఇస్తూ, మూలంలోని సంబంధ విభక్తిని కూడా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన శైలి. ‘ఆయన’ గౌరవప్రద వ్యక్తివాచక సూచనగా, ‘జీవం’ మరియు ‘వెలుగు’ సరళమైనప్పటికీ యోహానీయ భావగాంభీర్యాన్ని మోయగల పదాలుగా ఉపయోగించబడ్డాయి.
