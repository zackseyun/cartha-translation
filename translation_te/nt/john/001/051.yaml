id: JHN.1.51
reference: John 1:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: te
  text: 'ఆయన అతనితో ఇలా అన్నాడు: “నిజంగా, నిజంగా నేను మీతో చెబుతున్నాను:[a] ఆకాశం తెరిచి ఉండడాన్నీ, దేవుని దూతలు మనుష్యకుమారునిపై ఎక్కుతూ దిగుతూ ఉండడాన్నీ మీరు చూస్తారు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అతనితో” అనేది ఏకవచనం; అయితే “మీతో,” “మీరు చూస్తారు” అనే రూపాలు గ్రీకులో బహువచనం.
    reason: lexical_alternative
  - marker: b
    text: ఈ దృశ్యం ఆదికాండం 28:12లోని యాకోబు కలను ప్రతిధ్వనిస్తుంది; ఇక్కడ దేవదూతల ఎక్కడం, దిగడం మనుష్యకుమారునితో సంబంధించి చిత్రించబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: రెండుసార్లు వచ్చిన గంభీరమైన ధృవీకరణ సూత్రాన్ని అనువదిస్తూ, ఆధునిక తెలుగు పాఠకులకు దాని అర్థం స్పష్టంగా ఉండేలా చేసింది.
- source_word: ὑμῖν / ὄψεσθε
  choice: మీతో / మీరు చూస్తారు
  rationale: రెండు రూపాలూ గ్రీకులో బహువచనం. తెలుగు ప్రధాన పాఠంలోనే బహువచనాన్ని స్పష్టంగా నిలిపింది; కథనంలోని ఏకవచన సంబోధన నుంచి వచ్చిన మార్పును పాదసూచిక వివరిస్తుంది.
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: ఆకాశం తెరవబడి ఉండడాన్ని
  rationale: పరిపూర్ణ కృదంతం సూచించే, తెరవబడిన స్థితి కొనసాగుతున్న భావాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: ἀγγέλους τοῦ θεοῦ
  choice: దేవుని దూతలు
  rationale: దేవునికి చెందిన అతీంద్రియ దూతలనే ఈ దర్శన సందర్భం సూచిస్తుంది; తెలుగు బైబిలు వాడుకలో సహజమైన పదబంధం.
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: ఎక్కుతూ దిగుతూ
  rationale: ఆదికాండం 28:12ను ప్రతిధ్వనించే దిశాత్మక జంటను సంక్షిప్తంగా, సహజంగా కాపాడింది.
- source_word: ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుని మీద
  rationale: ἐπί యొక్క స్థానిక/దిశాత్మక దృశ్యాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలిపింది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు స్వీయనామంగా ఉన్న స్థిరమైన లేఖనపరమైన బిరుదును, దాని అపోకలిప్టిక్ మరియు అంతర్గ్రంథ ప్రతిధ్వనులతో సహా కాపాడింది.
theological_decisions:
- issue: కథనంలో αὐτῷ అనే ఏకవచనం నుంచి ప్రత్యక్ష ప్రసంగంలో ὑμῖν, ὄψεσθε అనే బహువచనాలకు మార్పు
  choice: ప్రధాన పాఠంలో “మీతో,” “మీరు” అనే బహువచన రూపాలను వాడి, మార్పును పాదసూచికలో స్పష్టం చేయడం
  alternative: సందర్భంలోని నతనయేలుకు మాత్రమే అన్నట్టుగా ఏకవచన “నీతో,” “నీవు” వాడడం
  rationale: గ్రీకు వాక్యం నతనయేలుతో ప్రారంభమైన సంభాషణను విస్తృత శ్రోతలవైపు ఉద్దేశపూర్వకంగా విస్తరిస్తుంది; తెలుగు సంఖ్యాభేదాన్ని దాచాల్సిన అవసరం లేదు.
- issue: దేవదూతలు ఎక్కుతూ దిగుతున్న దృశ్యం ఆదికాండం 28:12లోని యాకోబు కలను ప్రతిధ్వనించడం
  choice: ప్రధాన పాఠంలో దృశ్యాన్ని మాత్రమే నిలిపి, అంతర్గ్రంథ సంబంధాన్ని పాదసూచికలో తెలియజేయడం
  alternative: మనుష్యకుమారుడే నిచ్చెన లేదా దేవుని ప్రత్యక్షతకు కేంద్రం అని ప్రధాన పాఠంలో వివరణ చేర్చడం
  rationale: మూలపాఠంలోని దృశ్యం మరియు దాని ధార్మిక ఉద్వేగం నిలవాలి; నిర్దిష్ట వ్యాఖ్యానాన్ని అనువాదంలోకి దిగుమతి చేయకూడదు.
- issue: ἐπί పదం మనుష్యకుమారునితో దేవదూతల కదలికకు ఉన్న సంబంధం
  choice: “మనుష్యకుమారుని మీద” అని సూటిగా అనువదించడం
  alternative: “మనుష్యకుమారుని ద్వారా” లేదా “మనుష్యకుమారుని చుట్టూ” అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: మూలంలోని స్థలాత్మక దృశ్యాన్ని కాపాడుతూ, ఆయనను మధ్యవర్తిగా లేదా నిచ్చెనగా స్పష్టీకరించే అదనపు సిద్ధాంతార్థాన్ని ప్రధాన పాఠంలో చేర్చకుండా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడింది. యోహాను సువార్తకు ప్రత్యేకమైన ద్విగుణ ధృవీకరణను “నిజంగా, నిజంగా”గా నిలిపింది. “మనుష్యకుమారుడు” అనే స్థిరమైన లేఖన బిరుదును కొనసాగించింది.
