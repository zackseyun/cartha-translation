revisions:
- from: 'ఆయన అతనితో ఇలా అన్నాడు: “నిజంగా, నిజంగా మీతో చెబుతున్నాను:[a] ఆకాశం తెరవబడి ఉండడాన్నీ, దేవుని దూతలు మనుష్యకుమారుని మీద ఎక్కుతూ దిగుతూ ఉండడాన్నీ మీరు చూస్తారు.[b]”'
  to: 'ఆయన అతనితో ఇలా అన్నాడు: “నిజంగా, నిజంగా నేను మీతో చెబుతున్నాను:[a] ఆకాశం తెరిచి ఉండడాన్నీ, దేవుని దూతలు మనుష్యకుమారునిపై ఎక్కుతూ దిగుతూ ఉండడాన్నీ మీరు చూస్తారు.[b]”'
  rationale: The revision makes the Telugu more idiomatic, preserves the plural address explicitly, and retains the source text’s evocative yet syntactically difficult spatial imagery without importing an interpretive explanation. The cross-reference footnote remains informative but avoids making a stronger theological claim than the verse itself states.
