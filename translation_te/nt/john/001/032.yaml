id: JHN.1.32
reference: John 1:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
translation:
  language: te
  text: 'యోహాను సాక్ష్యమిచ్చి ఇలా అన్నాడు: “పావురంలా[a] పరలోకం నుండి[b] దిగివస్తున్న ఆత్మను నేను చూశాను; ఆత్మ ఆయనపై నిలిచింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పావురం వలె.” గ్రీకు పదబంధం పోలికను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆకాశం నుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: సాక్ష్యమిస్తూ
  rationale: μαρτυρέωలోని సాక్షి/సాక్ష్య భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; తరువాతి λέγωνతో కలిపి తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా అందించబడింది.
- source_word: λέγων
  choice: ఇలా అన్నాడు
  rationale: యోహాను ఇచ్చిన సాక్ష్యంలోని మాటలను పరిచయం చేస్తూ గ్రీకు వర్తమాన కృదంతం చేసే పనిని సహజంగా తెలియజేస్తుంది.
- source_word: Τεθέαμαι
  choice: నేను చూశాను
  rationale: θεάομαι పరిపూర్ణ కాలరూపం ప్రత్యక్షంగా చూసిన అనుభవాన్ని, దాని ప్రస్తుత ప్రాముఖ్యతను సూచిస్తుంది; ‘నేను చూశాను’ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: τὸ πνεῦμα
  choice: ఆత్మ
  rationale: సమీప సందర్భం పరిశుద్ధాత్మను సూచిస్తుంది. తెలుగులో ‘ఆత్మ’ అనే పదమే తగిన దైవిక సూచనను మోస్తుంది.
- source_word: καταβαῖνον
  choice: దిగివస్తుండడం
  rationale: ఆత్మ క్రిందికి వస్తున్న దృశ్యాన్ని కృదంత సంబంధంతో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὡς περιστερὰν
  choice: పావురంలా
  rationale: ὡς ఇక్కడ పోలికను సూచిస్తుంది. ఆత్మ అక్షరార్థంగా పావురమే అని నిర్ధారించకుండా దిగివచ్చిన తీరును చిత్రిస్తుంది.
- source_word: ἐξ οὐρανοῦ
  choice: ఆకాశం నుండి
  rationale: ἐξ సూచించే మూలం నుండి బయటికి/క్రిందికి వచ్చే భావాన్ని సహజ తెలుగులో ఇస్తుంది; οὐρανόςకు సందర్భానుసారంగా ‘పరలోకం’ అనే అర్థమూ సాధ్యమే.
- source_word: ἔμεινεν
  choice: నిలిచి ఉంది
  rationale: యోహాను సువార్తలో ముఖ్యమైన μένω యొక్క కొనసాగి ఉండే భావాన్ని తెలుగులో నిలుపుతూ, దిగివచ్చిన తర్వాత ఆత్మ ఆయనపై ఉండడాన్ని తెలియజేస్తుంది.
- source_word: ἐπ’ αὐτόν
  choice: ఆయనపై
  rationale: ἐπί సూచించే వ్యక్తిపై ఉండే సంబంధాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలుపుతుంది.
theological_decisions:
- issue: τὸ πνεῦμα యొక్క గుర్తింపు
  choice: ‘ఆత్మ’ అనేది పరిశుద్ధాత్మను సూచిస్తుంది
  alternative: సాధారణమైన ‘ఒక ఆత్మ’గా అర్థం చేసుకోవడం
  rationale: యోహాను 1:32–33లోని బాప్తిస్మ సందర్భం మరియు పరిశుద్ధాత్మతో బాప్తిస్మమిచ్చే వ్యక్తి గురించిన సూచన దైవిక ఆత్మనే ఉద్దేశిస్తున్నాయని చూపుతాయి; మూలంలో లేని అదనపు పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: ὡς περιστερὰν యొక్క భావం
  choice: పోలిక—‘పావురంలా’
  alternative: ‘పావురంగా’ అని, రూపాంతరం లేదా అక్షరార్థ గుర్తింపును సూచించడం
  rationale: ὡς సహజంగా పోలికను తెలియజేస్తుంది. ఈ అనువాదం ప్రత్యక్ష రూపం లేదా విధానం గురించి మూలపాఠం చెప్పనిదాన్ని నిర్ణయించదు.
- issue: ἔμεινεν యొక్క కొనసాగింపు భావం
  choice: ‘నిలిచి ఉంది’
  alternative: ‘నిలిచింది’ లేదా ‘ఉండిపోయింది’
  rationale: ఈ సందర్భంలో ఆత్మ కేవలం క్షణికంగా తాకడం కాక ఆయనపై కొనసాగి ఉండడాన్ని సూచిస్తుంది; అదే సమయంలో ఎంతకాలమో పాఠ్యం చెప్పనందున దాన్ని నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘సాక్ష్యమిస్తూ ఇలా అన్నాడు’ అనే నిర్మాణం గ్రీకు ἐμαρτύρησεν … λέγων సంబంధాన్ని తెలుగు పాఠకులకు స్పష్టంగా అందిస్తుంది. అస్పష్టమైన సర్వనామాన్ని నివారించడానికి చివరి భాగంలో ‘ఆ ఆత్మ’ను పునరుక్తి చేశాం. గమనిక గుర్తులను అవి వివరిస్తున్న పదబంధాల దగ్గరే ఉంచాం.
