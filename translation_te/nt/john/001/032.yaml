    text: లేదా “పావురం వలె.” గ్రీకు పదబంధం పోలికను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆకాశం నుండి.”
    reason: lexical_alternative
  revision_rationale: The revision makes ‘heaven’ explicit as పరలోకం in the main text, retains the possible ‘sky’ sense in the footnote, and renders the aorist ἔμεινεν with నిలిచింది. It preserves the source’s comparison without implying that the Spirit literally became a dove, and it retains all footnote anchors adjacent to the relevant expressions.
