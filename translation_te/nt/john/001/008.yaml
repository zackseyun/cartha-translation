translation:
  language: te
  text: అతడు ఆ వెలుగు కాదు; ఆ వెలుగు గురించి సాక్ష్యమివ్వడానికి వచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: ‘అతడు ఆ వెలుగు కాదు; కాని ఆ వెలుగు గురించి సాక్ష్యమివ్వడానికి.’ రెండో భాగంలో ప్రధాన క్రియ గ్రీకులో అధ్యాహారంగా ఉంది; దానిని సందర్భం నుండి పూరించాలి.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν
  choice: కాదు
  rationale: గ్రీకు అపూర్ణ భూతకాల రూపం యోహాను ఎవరో నిరాకరిస్తుంది. తెలుగులో గుర్తింపు లేదా స్వరూపాన్ని నిరాకరించే సందర్భంలో ‘కాదు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἐκεῖνος
  choice: అతడు
  rationale: రూపంలో ఇది సూచనాత్మక సర్వనామమైనా, ఇక్కడ ముందుగా ప్రస్తావించిన యోహానును బలంగా సూచించే వ్యక్తిగత సర్వనామంగా పనిచేస్తుంది.
- source_word: τὸ φῶς
  choice: ఆ వెలుగు
  rationale: నిర్దిష్ట ఉపపదం ఈ ప్రస్తావన సాధారణ వెలుగును కాక, పీఠికలో ఇప్పటికే పరిచయమైన నిర్దిష్ట వెలుగును సూచిస్తుందని తెలియజేస్తుంది. ‘ఆ’ ఆ నిర్దిష్టతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀλλ’ ἵνα
  choice: కాని … ఇవ్వడానికే వచ్చాడు
  rationale: ἀλλά తరువాత ప్రధాన క్రియ గ్రీకులో సందర్భం వల్ల అధ్యాహారంగా ఉంది. మునుపటి వచనం తెలిపిన యోహాను రాకను ఆధారంగా తీసుకొని, తెలుగులో వాక్యాన్ని సంపూర్ణంగా చేయడానికి ‘వచ్చాడు’ను సరఫరా చేశాం; ‘-డానికే’ అతని ఉద్దేశాన్నీ వ్యత్యాసాన్నీ చూపుతుంది.
- source_word: μαρτυρήσῃ
  choice: సాక్ష్యమివ్వడానికి
  rationale: μαρτυρέωలోని సాక్ష్యాత్మక భావాన్ని కాపాడుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వినిపించే ప్రయోగం.
- source_word: περὶ τοῦ φωτός
  choice: ఆ వెలుగు గురించి
  rationale: γενitiveతో περί ఇక్కడ ‘గురించి’ అనే భావం ఇస్తుంది; ఇది ‘సంబంధించి’ కంటే సాధారణ పాఠకులకు సహజమైనది.
theological_decisions:
- issue: యోహాను మరియు వెలుగు మధ్య గుర్తింపు, పాత్ర భేదం
  choice: యోహాను తానే వెలుగు కాదని నిరాకరించి, ఆ వెలుగు గురించి సాక్ష్యమివ్వడమే అతని ఉద్దేశమని తెలిపాం.
  alternative: 'మరింత అక్షరార్థంగా: ‘అతడు ఆ వెలుగు కాదు; కాని ఆ వెలుగు గురించి సాక్ష్యమివ్వడానికి.’'
  rationale: మూలంలోని సాక్షి–వెలుగు భేదాన్ని అలాగే ఉంచాం. ‘వచ్చాడు’ అనేది సందర్భం ద్వారా అధ్యాహరించబడిన క్రియను తెలుగులో స్పష్టం చేస్తుంది; అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన బైబిలు శైలి. ‘సాక్ష్యమివ్వడం’ యోహాను సువార్తలోని సాక్ష్య భావాన్ని నిలుపుతుంది.
