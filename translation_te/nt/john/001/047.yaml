  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶδεν ⸀ὁ Ἰησοῦς τὸν Ναθαναὴλ ἐρχόμενον πρὸς αὐτὸν καὶ λέγει περὶ αὐτοῦ· Ἴδε ἀληθῶς Ἰσραηλίτης ἐν ᾧ δόλος οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: te
  text: 'యేసు నతనయేలు తనవైపు వస్తుండగా చూసి, అతని గురించి ఇలా అన్నాడు: “ఇదిగో, నిజంగా ఒక ఇశ్రాయేలీయుడు; ఇతనిలో ఏ మోసమూ లేదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని వ్యక్తిపై నిలిపే గ్రీకు ఆజ్ఞార్థక ఉద్ఘాటనను సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: నిజమైన ఇశ్రాయేలీయుడు
  rationale: ἀληθῶς ఇక్కడ వ్యక్తి నిజాయితీని ఉద్ఘాటిస్తూ Ἰσραηλίτης‌ను విశేషిస్తుంది; ఈ భావాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: δόλος
  choice: మోసం
  rationale: కపటం, వంచన, కుటిల ఉద్దేశం అనే భావ పరిధిని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: λέγει περὶ αὐτοῦ
  choice: అతని గురించి ఇలా అన్నాడు
  rationale: వర్తమానకాల కథన క్రియను సహజ తెలుగు కథనశైలిలో భూతకాలంగా అందిస్తూ, περὶ αὐτοῦ యొక్క ‘అతని గురించి’ అనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘నిజమైన ఇశ్రాయేలీయుడు’ అనే వాక్యభాగం యొక్క భావం
  choice: నిజమైన ఇశ్రాయేలీయుడు
  alternative: నిజంగా ఒక ఇశ్రాయేలీయుడు
  rationale: గ్రీకు పదబంధం రెండు విధాలుగా అర్థమయ్యే అవకాశం ఉన్నా, వెంట వచ్చే ‘ఇతనిలో ఏ మోసమూ లేదు’ అనే వివరణ వ్యక్తి స్వభావంలోని యథార్థతను సూచిస్తుంది. అయినా అదనపు సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే వాక్య గౌరవం మరియు మూలంలోని ఉద్ఘాటన నిలిచేలా అనువదించబడింది.
