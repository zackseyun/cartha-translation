revisions:
- from: 'యేసు నతనయేలు తనవైపు రావడం చూసి, అతని గురించి ఇలా అన్నాడు: “ఇదిగో, ఇతడు నిజమైన ఇశ్రాయేలీయుడు; ఇతనిలో ఏ మోసమూ లేదు.”'
  to: 'యేసు నతనయేలు తనవైపు వస్తుండగా చూసి, అతని గురించి ఇలా అన్నాడు: “ఇదిగో, నిజంగా ఒక ఇశ్రాయేలీయుడు; ఇతనిలో ఏ మోసమూ లేదు.”'
  rationale: The revision changes only the rendering of ἀληθῶς from adjectival “నిజమైన” to adverbial “నిజంగా,” preserving the Greek syntax and ambiguity. It also makes the approach clause more idiomatic in modern standard Telugu without changing meaning.
  reviewer_model: gpt-5.6-terra
