  text: And they had been sent from the Pharisees[a].
translation:
  language: te
  text: కాగా, వారు పరిసయ్యుల నుండి పంపబడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని పరిసయ్యులు పంపారు.” గ్రీకులో ‘నుండి’ అనే పదం వారు పరిసయ్యులతో ఉన్న మూలం లేదా సంబంధాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: తెలుగులో ప్రత్యేకంగా అనువదించలేదు
  rationale: ఈ వాక్యం మునుపటి సంభాషణకు అనుసంధానమైనప్పటికీ, తెలుగులో ‘మరియు’ అని ప్రారంభించడం అసహజంగా ఉంటుంది; వాక్యక్రమమే కథన అనుసంధానాన్ని స్పష్టం చేస్తుంది.
- source_word: ἀπεσταλμένοι ἦσαν
  choice: పంపబడినవారు
  rationale: పూర్తయిన పంపడంవల్ల ఏర్పడిన వారి ప్రస్తుత స్థితిని ఈ రూపం సహజమైన తెలుగులో తెలియజేస్తుంది; వారిని ‘దూతలు’ అనే నామవాచకంతో పేర్కొని మూలంలోని క్రియాభావాన్ని అతిగా వ్యాఖ్యానించదు.
- source_word: ἐκ
  choice: లోనుండి
  rationale: ἐκ సూచించే మూలం లేదా ఆవిర్భావాన్ని నిలుపుతుంది; ‘చేత’ అని అనువదించి పరిసయ్యులను స్పష్టమైన కర్తలుగా నిర్ధారించదు.
- source_word: τῶν Φαρισαίων
  choice: పరిసయ్యుల
  rationale: Φαρισαῖοι అనే సమూహనామానికి ఆధునిక ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: ఈ ప్రతినిధులకు పరిసయ్యులతో ఉన్న సంబంధం
  choice: వారు పరిసయ్యులలోనుండి పంపబడినవారు—ఇది వారి మూలం లేదా వారు వచ్చిన వర్గాన్ని ప్రధానంగా సూచిస్తుంది.
  alternative: వారు పరిసయ్యులచేత పంపబడ్డారు—ఇది పరిసయ్యులే పంపిన కర్తలని బలంగా సూచిస్తుంది.
  rationale: ἐκ + షష్ఠీ విభక్తి ప్రత్యక్ష కర్తృత్వం కంటే మూలాన్ని సహజంగా సూచిస్తుంది. ప్రధాన పాఠం ఈ అస్పష్టతను కాపాడుతుంది; సందర్భం పరిసయ్యుల ప్రేరణ లేదా అధికారాన్ని సూచించే అవకాశాన్ని మాత్రం నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. ‘లోనుండి’ మూలభాషలోని మూలం/కర్తృత్వం మధ్య ఉన్న భావ ఉద్రిక్తతను నిలుపుతుంది.
