id: JHN.1.9
reference: John 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: te
  text: ప్రతి మనిషికీ వెలుగునిచ్చే నిజమైన వెలుగు[a] లోకంలోకి వస్తూ ఉండింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “లోకంలోకి వచ్చే ప్రతి మనిషికీ వెలుగునిచ్చే నిజమైన వెలుగు ఉండింది.” గ్రీకు భాషలో ‘వచ్చే’ అనే పదాన్ని ‘నిజమైన వెలుగు’తో కాకుండా ‘ప్రతి మనిషి’తో కూడా అనుసంధానించవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: వెలుగు
  rationale: సాధారణ నామవాచకమైన ‘వెలుగు’ను వాడటం ద్వారా యోహాను సందర్భంలోని క్రీస్తుసంబంధ సూచనను నిలుపుతూ, మూలంలో లేని ప్రత్యేక నామవాచక రూపాన్ని రుద్దకుండా ఉంచాం.
- source_word: ἀληθινόν
  choice: నిజమైన
  rationale: ఇది కేవలం వాస్తవానికి విరుద్ధం కానిదనే భావమే కాక, అసలైనది, సంపూర్ణమైనది అనే యోహాను రచనలకు సహజమైన భావాన్ని కూడా అందిస్తుంది.
- source_word: φωτίζει
  choice: వెలుగునిచ్చే
  rationale: క్రియ యొక్క వెలుగు ప్రసాదించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; సందర్భానుసారమైన రూపకార్థాన్ని కూడా తెరిచి ఉంచుతుంది.
- source_word: πάντα ἄνθρωπον
  choice: ప్రతి మనిషికీ
  rationale: ఏ ఒక్క వర్గానికీ పరిమితం కాకుండా ప్రతి మానవ వ్యక్తిని సూచించే ఏకవచన సామాన్యార్థాన్ని సహజమైన, సమగ్ర ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: లోకంలోకి వస్తూ ఉంది
  rationale: ప్రధాన పాఠంలో ఈ కృదంతాన్ని ‘నిజమైన వెలుగు’తో భావపరంగా అనుసంధానించి, దాని లోకాగమనాన్ని వ్యక్తపరుస్తుంది.
- source_word: κόσμον
  choice: లోకం
  rationale: κόσμοςకు యోహాను రచనల్లో సాధారణంగా సరిపోయే విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: ἦν
  choice: ఉంది
  rationale: గతకాల అసంపూర్ణ క్రియ ἦνను కృదంతంతో కలిపి తెలుగులో సహజమైన కొనసాగుతున్న క్రియారూపమైన ‘వస్తూ ఉంది’గా ఇచ్చాం; సందర్భం కథన గతకాలాన్ని అందిస్తుంది.
theological_decisions:
- issue: ἐρχόμενον (‘వస్తున్న/వచ్చే’) అనే కృదంతం దేనితో అనుసంధానమవుతుంది?
  choice: 'భావపరంగా ‘నిజమైన వెలుగు’తో అనుసంధానం: ‘నిజమైన వెలుగు ... లోకంలోకి వస్తూ ఉంది.’'
  alternative: '‘ప్రతి మనిషి’తో వ్యాకరణపరంగా అనుసంధానం: ‘లోకంలోకి వచ్చే ప్రతి మనిషికీ వెలుగునిచ్చే నిజమైన వెలుగు ఉంది.’'
  rationale: గ్రీకులో ఈ కృదంతం పుంలింగ ఏకవచన ద్వితీయావిభక్తిలో ఉండటంతో ἄνθρωπον (‘మనిషి’)ను విశేషించగలదు. అయితే యోహాను రచనలో ‘లోకంలోకి రావడం’ వెలుగు/క్రీస్తు ఆగమనానికి సంబంధించిన ముఖ్యమైన వ్యక్తీకరణ; పీఠిక సందర్భమూ అదే దిశను బలపరుస్తుంది. అందువల్ల ప్రధాన పాఠంలో ఆ పఠనాన్ని తీసుకుని, నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘వెలుగు’ అనే సాధారణ పదాన్నే ఉంచి యోహాను పీఠికలోని రూపక, క్రీస్తుసంబంధ భావాలను పాఠకుడు సందర్భం ద్వారా గ్రహించేలా చేశాం. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిగా అనుసంధానించబడింది.
