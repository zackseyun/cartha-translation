revisions:
- from: ప్రతి మనిషికీ వెలుగునిచ్చే నిజమైన వెలుగు[a] లోకంలోకి వస్తూ ఉంది.
  to: ప్రతి మనిషికీ వెలుగునిచ్చే నిజమైన వెలుగు[a] లోకంలోకి వస్తూ ఉండింది.
  rationale: Greek ἦν is an imperfect, so both the main reading and the footnoted alternative have been adjusted from present to past forms. The main text continues to adopt the contextually preferred reading that the true Light was coming into the world, while the footnote preserves the grammatically possible attachment of ‘coming’ to ‘every person.’
