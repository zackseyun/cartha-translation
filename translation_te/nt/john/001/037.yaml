    reason: οἱ δύο μαθηταὶ αὐτοῦలోని αὐτοῦ యొక్క సూచనను స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: ἤκουσαν
  choice: విని
  rationale: ఆరిస్ట్ క్రియ ఇక్కడ చెప్పబడిన మాటను విన్న సంఘటనను సూచిస్తుంది; దీర్ఘకాలం శ్రద్ధగా ఆలకించారనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: ఆ ఇద్దరు శిష్యులు
  rationale: ముందటి వచనంలో బాప్తిస్మమిచ్చే యోహానుతో ఉన్న నిర్దిష్టమైన ఇద్దరు శిష్యులను ‘ఆ ఇద్దరు’ సహజంగా సూచిస్తుంది. αὐτοῦను ప్రధాన పాఠ్యంలో విడిగా అనువదించకపోవడం వల్ల తెలుగులో ‘ఆయన ఇద్దరు శిష్యులు’ ఎవరి శిష్యులో తప్పుగా అర్థమయ్యే అవకాశాన్ని తగ్గిస్తుంది; దాని స్పష్టమైన భావాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: λαλοῦντος
  choice: ఆయన చెప్పిన మాట
  rationale: జనిటివ్ వర్తమాన కృదంతం వారు విన్నది యోహాను పలుకుతున్న మాటేనని సూచిస్తుంది. సహజమైన తెలుగులో ‘ఆయన చెప్పిన మాట విని’ సమకాలీన సందర్భాన్ని తగినంతగా వ్యక్తం చేస్తుంది.
- source_word: ἠκολούθησαν
  choice: అనుసరించారు
  rationale: ఈ క్రియ యేసు వెనుక భౌతికంగా వెళ్లడాన్నీ, ఆయన అనుచరులుగా మారే కథనాత్మక ప్రతిధ్వనినీ కలిగి ఉండగలదు; ‘అనుసరించారు’ రెండు స్థాయిలనూ కాపాడుతుంది.
- source_word: τῷ Ἰησοῦ
  choice: యేసును
  rationale: ἀκολουθέωతో దత్తి విభక్తి అనుసరించబడిన వ్యక్తిని సూచిస్తుంది. తెలుగులో సహజమైన కర్మరూపం ‘యేసును అనుసరించారు’.
theological_decisions:
- issue: οἱ δύο μαθηταὶ αὐτοῦలో αὐτοῦ (‘ఆయన’) ఎవరిని సూచిస్తుంది?
  choice: బాప్తిస్మమిచ్చే యోహానును సూచిస్తున్నదిగా గ్రహించి, ప్రధాన పాఠ్యంలో ‘ఆ ఇద్దరు శిష్యులు’ అని అనువదించడం
  alternative: ‘ఆయన ఇద్దరు శిష్యులు’ అని మరింత పదానుసారంగా ఉంచడం
  rationale: యోహాను 1:35–36లో బాప్తిస్మమిచ్చే యోహాను తన ఇద్దరు శిష్యులతో నిలబడి యేసును గురించి మాట్లాడుతున్నాడు. కాబట్టి ఇక్కడ αὐτοῦ యోహానును సూచిస్తుంది. అయితే ‘ఆయన ఇద్దరు శిష్యులు’ అనే తెలుగు రూపం సమీపంలో ప్రస్తావించబడిన యేసును సూచిస్తున్నట్లు అపార్థం కలిగించవచ్చు; అందువల్ల సందర్భస్పష్టతను ప్రధాన పాఠ్యంలో ఉంచి, స్వామ్యసూచక భావాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘అనుసరించారు’ అనే పదం భౌతికంగా వెంబడి వెళ్లడం మరియు శిష్యత్వపు సూచన—రెండింటినీ అతిగా వివరణ చేయకుండా నిలుపుతుంది. ప్రధాన పాఠ్యంలోని [a] గుర్తు పాదసూచికతో సరిపోలుతుంది.
