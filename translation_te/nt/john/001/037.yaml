translation:
  language: te
  text: బాప్తిస్మమిచ్చే యోహాను యొక్క ఆ ఇద్దరు శిష్యులు[a] ఆయన మాట్లాడుతుండగా విని, యేసును అనుసరించారు.
  philosophy: optimal-equivalence
  footnotes:
