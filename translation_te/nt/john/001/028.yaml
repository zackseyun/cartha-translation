lexical_decisions:
- source_word: ταῦτα
  choice: ఇవి
  rationale: ముందటి సంభాషణలోని విషయాలు లేదా సంఘటనలను సూచించే గ్రీకు బహువచనాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐν Βηθανίᾳ
  choice: బేతనియలో
  rationale: స్థలనామంతో వచ్చిన ἐν యొక్క సాధారణ స్థానార్థాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐγένετο
  choice: జరిగాయి
  rationale: ఇక్కడ γίνομαι సంఘటనలు చోటుచేసుకోవడాన్ని సూచిస్తుంది; బహువచనమైన ‘ఇవి’తో ‘జరిగాయి’ సహజంగా సరిపోతుంది.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: యొర్దాను అవతల ఉన్న
  rationale: కథన దృక్కోణం నుండి నదికి ఆవలి వైపున ఉన్న ప్రదేశాన్ని πέραν స్పష్టంగా సూచిస్తుంది.
- source_word: ὅπου
  choice: అక్కడ
  rationale: ముందు పేర్కొన్న ప్రదేశాన్ని తిరిగి సూచిస్తూ, తెలుగు కథన ప్రవాహంలో సహజంగా స్థాన ఉపవాక్యాన్ని ప్రారంభిస్తుంది.
- source_word: ἦν ... βαπτίζων
  choice: బాప్తిస్మం ఇస్తూ ఉన్నాడు
  rationale: ἦνతో కూడిన వర్తమాన కృదంతం కొనసాగుతూ ఉన్న గత కార్యాన్ని తెలియజేస్తుంది; ఈ రూపం ఆ కొనసాగింపు భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Βηθανίᾳ (‘బేతనియ’) మరియు కొన్ని ప్రతుల్లోని Βηθαβαρᾷ (‘బేతబార’) మధ్య పాఠభేదం
  choice: బేతనియ
  alternative: బేతబార
  rationale: అందించిన SBLGNT మూలపాఠంలో Βηθανίᾳ ఉంది. అందువల్ల ప్రధాన పాఠంలో ‘బేతనియ’ను ఉంచి, చారిత్రకంగా ప్రసిద్ధమైన ప్రత్యామ్నాయ పాఠాన్ని పాదసూచికలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘బాప్తిస్మం ఇస్తూ ఉన్నాడు’ అనే రూపం కార్యం కొనసాగుతూ ఉన్న భావాన్ని నిలుపుతుంది; స్థల పాఠభేదం [a] ద్వారా స్పష్టంగా సూచించబడింది.
