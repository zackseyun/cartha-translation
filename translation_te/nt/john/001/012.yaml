  source_fidelity: 'The draft preserves all major Greek elements: the contrast (δὲ), receiving him, the granted ἐξουσία, becoming God''s children, and the present characterization of those believing. The appositional relationship is appropriately retained without forcing the two expressions into a single idea.'
