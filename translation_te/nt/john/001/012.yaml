id: JHN.1.12
reference: John 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: te
  text: అయితే ఆయనను స్వీకరించిన వారందరికీ—అంటే ఆయన నామంపై విశ్వాసముంచేవారికి—దేవుని పిల్లలుగా అయ్యే హక్కును[a] ఆయన ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అధికారాన్ని’ లేదా ‘శక్తిని’. గ్రీకు పదం అనుగ్రహించబడిన అధికారం, హక్కు లేదా సామర్థ్యాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: వారందరికీ
  rationale: ‘ఎవరెవరైతే’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో సమూహార్థంతో తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలోని తిరస్కారానికి భిన్నంగా ఇక్కడ స్వీకరించినవారి గురించి చెప్పే వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: ἔλαβον αὐτόν
  choice: ఆయనను స్వీకరించిన
  rationale: ఇక్కడ λαμβάνω భౌతికంగా పట్టుకోవడం కాక, వాక్యమైన ఆయనను ఆహ్వానించి అంగీకరించడాన్ని సూచిస్తుంది; ‘స్వీకరించిన’ మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ἔδωκεν
  choice: ఇచ్చాడు
  rationale: δίδωμι క్రియకు సూటిగా, సహజంగా సరిపోయే రూపం.
- source_word: ἐξουσίαν
  choice: హక్కును
  rationale: ఇక్కడ ముడి శక్తికన్నా దేవుడు అనుగ్రహించిన అర్హత లేదా అధికారాన్ని సూచిస్తుంది; ‘హక్కు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది, ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: τέκνα θεοῦ
  choice: దేవుని పిల్లలుగా
  rationale: τέκνα లింగపరంగా సమగ్రంగా పిల్లలను సూచిస్తుంది; ‘కుమారులు’ అని పురుషులకు మాత్రమే పరిమితం చేయదు.
- source_word: γενέσθαι
  choice: అయ్యే
  rationale: కొత్త స్థితిలోకి రావడం అనే γίνομαι భావాన్ని ‘ఉండే’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: τοῖς πιστεύουσιν
  choice: విశ్వాసముంచేవారికి
  rationale: నమ్మడం వారి లక్షణంగా ఉందని తెలిపే వర్తమాన అసమాపక క్రియార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: ఆయన నామంలో
  rationale: విశ్వాసం ఆయన వెల్లడైన వ్యక్తిత్వం, గుర్తింపువైపు మళ్లిందనే భావాన్ని తెలియజేస్తూ ὄνομα పదాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: ‘ఆయనను స్వీకరించడం’ మరియు ‘ఆయన నామంలో విశ్వాసముంచడం’ మధ్య సంబంధం
  choice: రెండు వ్యక్తీకరణలనూ ఉంచి, రెండవదాన్ని మొదటిదాన్ని మరింత స్పష్టంగా గుర్తించే వివరణగా చూపించడం
  alternative: రెండింటినీ పూర్తిగా సమానార్థకాలుగా తీసుకొని ఒక భావాన్ని మాత్రమే అనువదించడం
  rationale: గ్రీకు పాఠం రెండు వ్యక్తీకరణలనూ ఉంచుతుంది. మధ్యలోని ‘అంటే’ మరియు గీతలు రెండవ పదబంధం స్వీకరించినవారు ఎవరనే విషయాన్ని వివరిస్తున్నట్లు చూపుతాయి, అయితే రెండు భావాలను ఒక్కటిగా కుదించవు.
- issue: దైవిక సంతానాన్ని సూచించే పదం
  choice: దేవుని పిల్లలు
  alternative: దేవుని కుమారులు
  rationale: మూలంలో పురుషులను ప్రత్యేకంగా సూచించే υἱοί కాక, విస్తృతమైన τέκνα ఉంది; అందువల్ల లింగపరంగా మూలానికి ఖచ్చితమైన ‘పిల్లలు’ ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఆయన నామంలో విశ్వాసముంచేవారికి’ అనే రూపం యోహాను వాడే నామం-విశ్వాసం సంబంధాన్ని నిలుపుతుంది. పాదసూచిక సూచికను సంబంధిత ‘హక్కును’ పదానికే జత చేశాం.
