  terminology: “స్వీకరించిన,” “హక్కు,” and “దేవుని పిల్లలు” are appropriate. “హక్కు” accurately conveys the contextual sense of ἐξουσία; the footnote responsibly retains authority and capability as lexical alternatives. “పిల్లలు” correctly reflects the gender-inclusive τέκνα.
