revisions:
- from: అయితే ఆయనను స్వీకరించిన వారందరికీ—అంటే ఆయన నామంలో విశ్వాసముంచేవారికి—దేవుని పిల్లలుగా అయ్యే హక్కును[a] ఆయన ఇచ్చాడు.
  to: అయితే ఆయనను స్వీకరించిన వారందరికీ—అంటే ఆయన నామంపై విశ్వాసముంచేవారికి—దేవుని పిల్లలుగా అయ్యే హక్కును[a] ఆయన ఇచ్చాడు.
  rationale: Faith is expressed as being directed toward his name by changing “నామంలో” to “నామంపై.” This is a minor idiomatic correction that more clearly represents πιστεύω εἰς while preserving the source text’s wording, syntax, and theological restraint. The footnote anchor remains attached to “హక్కును,” the rendering of ἐξουσίαν.
