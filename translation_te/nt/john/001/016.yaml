  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: te
  text: ఎందుకంటే ఆయన సంపూర్ణత నుండి మనమందరం కృపకు బదులుగా కృపను పొందాము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కృపపై కృప,” లేదా “ఒక కృప తర్వాత మరొక కృప.” గ్రీకు పదబంధం ఒక వరం తర్వాత మరొకటి వచ్చే వరుస కృపను సూచించవచ్చు; అయితే ἀντί అనే పదానికి మరింత అక్షరార్థంగా “బదులుగా” అని అర్థం.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రకటనకు వివరణాత్మక కారణాన్ని పరిచయం చేసే సంధానపదంగా సహజమైన తెలుగులో causal/explanatory భావాన్ని నిలుపుతుంది.
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: ఆయన సంపూర్ణత నుండి
  rationale: πλήρωμα లోని నిండుదనం, సమగ్రత భావాన్ని మరియు పొందినది ఆయనకు చెందిన సంపూర్ణత నుండే వచ్చిందనే సంబంధాన్ని కాపాడుతుంది.
- source_word: ἡμεῖς πάντες
  choice: మనమందరం
  rationale: స్పష్టంగా ఉన్న ἡμεῖς మరియు πάντες కలిగించే సమూహాత్మక ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐλάβομεν
  choice: పొందాము
  rationale: గ్రీకు aorist క్రియను తెలుగులో సహజమైన భూతకాల రూపంతో అందిస్తూ స్వీకరించామనే భావాన్ని నిలుపుతుంది.
- source_word: καὶ
  choice: —
  rationale: తెలుగులో తరువాతి పదబంధం పొందినదేమిటో వివరిస్తున్నట్లు సహజంగా కలపడానికి విరామచిహ్నం ఉపయోగించబడింది; గ్రీకు καὶ యొక్క అనుసంధాన పాత్రను సందర్భానుగుణంగా ప్రతిబింబిస్తుంది.
- source_word: χάριν ἀντὶ χάριτος
  choice: కృపకు బదులుగా కృపను
  rationale: ἀντί యొక్క ప్రాథమికమైన ‘బదులుగా/స్థానంలో’ భావాన్ని నిలుపుతూ, ప్రత్యామ్నాయం మరియు వరుసగా లభించే కృప అనే రెండు సాధ్య భావాల మధ్య ఉన్న ఉద్దేశపూర్వక ఉద్రిక్తతను పరిష్కరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: χάριν ἀντὶ χάριτος యొక్క అర్థం
  choice: కృపకు బదులుగా కృపను
  alternative: కృప మీద కృపను; ఒక కృప తరువాత మరొక కృపను
  rationale: ఈ గ్రీకు పదబంధం వివాదాస్పదంగా ఉంది. ప్రధాన పాఠం ἀντί యొక్క సాధారణ ‘బదులుగా’ భావాన్ని కాపాడుతుంది; పాదసూచిక వరుసగా లేదా సమృద్ధిగా లభించే కృప అనే సాధ్యమైన భావాలను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘సంపూర్ణత,’ ‘కృప’ వంటి స్థిరమైన బైబిలు పదాలను సాధారణ పాఠకులకు గ్రాహ్యంగా ఉంచి, మూలంలోని సంక్షిప్తతను మరియు అర్థసందిగ్ధతను కాపాడింది.
