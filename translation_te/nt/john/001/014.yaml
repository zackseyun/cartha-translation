id: JHN.1.14
reference: John 1:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: te
  text: వాక్యం శరీరమై మన మధ్య నివసించాడు[a]. మేము ఆయన మహిమను చూశాం—అది తండ్రి నుండి వచ్చిన ఏకైక కుమారునికి తగిన మహిమ[b]. ఆయన కృపతోను సత్యంతోను నిండి ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన మధ్య గుడారం వేసుకొని నివసించాడు.” ఇక్కడి క్రియ గుడారం లేదా నివాస గుడారం భావాన్ని ప్రతిధ్వనింపజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “ఏకైక కుమారుడు” అనే మాటను “అద్వితీయ కుమారుడు” అని, లేదా సంప్రదాయంగా “ఏకజనిత కుమారుడు” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: వాక్యం
  rationale: యోహాను సువార్త ఆరంభంలో వ్యక్తిగా వాడబడిన ఈ సమృద్ధమైన బిరుదును నిలుపుతుంది. ‘సందేశం’ వంటి పదాలు దాని అర్థంలోని ఒక భాగాన్నే తెలియజేస్తాయి.
- source_word: σὰρξ ἐγένετο
  choice: శరీరమై
  rationale: నిజమైన శారీరక మానవ ఉనికిలోకి వచ్చిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, ‘మానవత్వం’ వంటి సారాంశ పదంతో మూలంలోని σάρξ బలాన్ని తగ్గించదు.
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: మన మధ్య నివసించింది
  rationale: ఆధునిక పాఠకులకు స్పష్టమైన ప్రధాన పాఠం. క్రియలోని గుడారం/ప్రత్యక్ష గుడారం ప్రతిధ్వనిని పాదసూచికలో నిలిపింది.
- source_word: ἐθεασάμεθα
  choice: మేము … చూశాం
  rationale: ప్రత్యక్షంగా దర్శించిన సాక్ష్యభావాన్ని సరళమైన, సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δόξαν
  choice: మహిమ
  rationale: యోహాను రచనలోని దైవిక ప్రకాశం, ఘనత, ప్రత్యక్షత అనే విస్తృత బైబిలు భావాలను మోసే స్థిరమైన తెలుగు పదం.
- source_word: ὡς μονογενοῦς παρὰ πατρός
  choice: తండ్రి నుండి వచ్చిన ఏకైక కుమారునికి తగిన
  rationale: ὡς లోని పోలిక/లక్షణ భావాన్ని ‘కేవలం పోలి ఉన్నది’ అన్న అపార్థం రాకుండా తెలియజేస్తుంది. μονογενής యొక్క ప్రధానమైన అద్వితీయత భావాన్ని ‘ఏకైక’ నిలుపుతుంది; సందర్భం సూచించే కుమార సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: ఆయన కృపతోను సత్యంతోను నిండి ఉన్నాడు
  rationale: గ్రీకు వాక్యంలో λόγος/μονογενής‌ను వర్ణించే పుంలింగ ఏకవచన πλήρης‌ను వ్యక్తిగత సర్వనామంతో స్పష్టంగా అనుసంధానించి, కృప మరియు సత్యం అనే జతను యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: μονογενοῦς యొక్క క్రీస్తు సంబంధమైన అనువాదం
  choice: ఏకైక కుమారుడు
  alternative: అద్వితీయ కుమారుడు; ఏకజనిత కుమారుడు
  rationale: సందర్భంలోని తండ్రి–కుమార సంబంధాన్ని సహజంగా వెల్లడిస్తూ, పదంలోని ప్రధాన అద్వితీయత భావాన్ని ముందుంచుతుంది. చారిత్రకంగా ముఖ్యమైన ‘ఏకజనిత’ రూపాన్ని పాదసూచికలో ఉంచి, గ్రీకు పదం తప్పనిసరిగా జనన విధానాన్ని నిర్వచిస్తుందని ప్రధాన పాఠంలో తేల్చదు.
- issue: ἐσκήνωσεν లోని ప్రత్యక్ష గుడారం ప్రతిధ్వని
  choice: మన మధ్య నివసించింది
  alternative: మన మధ్య గుడారం వేసుకొని నివసించింది
  rationale: ప్రధాన పాఠాన్ని సహజంగా, సులభంగా ఉంచుతూ, దేవుని గుడార నివాసాన్ని సూచించే సంభావ్య ప్రతిధ్వనిని పాదసూచికలో సంరక్షిస్తుంది.
- issue: πλήρης ఎవరిని వర్ణిస్తుంది
  choice: ‘ఆయన’ ద్వారా వాక్యం/ఏకైక కుమారునితో అనుసంధానం
  alternative: ‘మహిమ’ను వర్ణిస్తున్నట్లుగా అనువదించడం
  rationale: గ్రీకులో πλήρης పుంలింగ ఏకవచనంలో ఉండటం వల్ల స్త్రీలింగ δόξαను కాకుండా λόγος లేదా సందర్భంలోని μονογενής‌ను వర్ణిస్తుంది. తెలుగు వాక్య నిర్మాణం ఈ వ్యాకరణ సంబంధాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవభరితమైన శైలి వాడబడింది. ‘వాక్యం,’ ‘మహిమ,’ ‘కృప,’ ‘సత్యం’ వంటి స్థిరమైన బైబిలు పదాలను నిలిపి, ‘చూశాం,’ ‘నివసించింది’ వంటి సహజ ఆధునిక క్రియారూపాలు ఎంచుకోబడ్డాయి. గ్రీకు మూలంలోని దీర్ఘ వాక్యాన్ని పఠనసౌలభ్యం కోసం మూడు వాక్యాలుగా విభజించినా, భావ సంబంధం నిలుపబడింది.
