revisions:
- from: వాక్యం శరీరమై, మన మధ్య నివసించింది[a]. మేము ఆయన మహిమను చూశాం—అది తండ్రి నుండి వచ్చిన ఏకైక కుమారునికి తగిన మహిమ[b]. ఆయన కృపతోను సత్యంతోను నిండి ఉన్నాడు.
  to: వాక్యం శరీరమై మన మధ్య నివసించాడు[a]. మేము ఆయన మహిమను చూశాం—అది తండ్రి నుండి వచ్చిన ఏకైక కుమారునికి తగిన మహిమ[b]. ఆయన కృపతోను సత్యంతోను నిండి ఉన్నాడు.
