id: JHN.1.25
reference: John 1:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: te
  text: 'వారు అతన్ని అడిగి ఇలా అన్నారు: “అయితే నీవు మెస్సీయవు[a] గానీ, ఏలీయావు గానీ, ఆ ప్రవక్తవు[b] గానీ కాకపోతే, ఎందుకు బాప్తిస్మం ఇస్తున్నావు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్రీస్తు.” గ్రీకు Χριστός (క్రిస్టోస్) ఇక్కడ ఒక బిరుదు; యూదుల మెస్సీయ నిరీక్షణను స్పష్టంగా చూపడానికి ప్రధాన పాఠంలో “మెస్సీయ” అని అనువదించబడింది.
    reason: ప్రత్యామ్నాయ అనువాదం
  - marker: b
    text: “ఆ ప్రవక్త” అనే మాట మోషే వంటివాడైన ప్రవక్త కోసం ఉన్న నిరీక్షణను సూచిస్తుండవచ్చు (ద్వితీయోపదేశకాండము 18:15 చూడండి).
    reason: నేపథ్య వివరణ మరియు పరస్పర సూచన
lexical_decisions:
- source_word: ἠρώτησαν ... καὶ εἶπαν αὐτῷ
  choice: అడిగి ఇలా అన్నారు
  rationale: మూలంలోని ‘అడిగారు’, ‘అన్నారు’ అనే రెండు క్రియలనూ నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన కథన ప్రవాహాన్ని ఇస్తుంది.
- source_word: Τί οὖν βαπτίζεις
  choice: అయితే ... ఎందుకు బాప్తిస్మం ఇస్తున్నావు?
  rationale: τί ఇక్కడ కారణాన్ని ప్రశ్నిస్తుంది; వర్తమానకాల క్రియ యోహాను కొనసాగిస్తూ చేస్తున్న కార్యాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా షరతును ముందుంచారు.
- source_word: ὁ χριστός
  choice: మెస్సీయవు
  rationale: ఇక్కడ Χριστός వ్యక్తిపేరుగా కాక, యూదుల నిరీక్షణలోని అభిషిక్తుని బిరుదుగా ఉంది; అందువల్ల ‘మెస్సీయ’ అని అనువదించారు.
- source_word: Ἠλίας
  choice: ఏలీయావు
  rationale: బైబిలు పేరుకు తెలుగులో స్థిరపడిన రూపమైన ‘ఏలీయా’ను విధేయ రూపంలో వాడారు.
- source_word: ὁ προφήτης
  choice: ఆ ప్రవక్తవు
  rationale: గ్రీకు నిర్దిష్ట ఉపపదం ఒక ప్రత్యేకంగా నిరీక్షించబడిన ప్రవక్తను సూచిస్తున్నందున ‘ఆ ప్రవక్త’ అని ఇచ్చారు.
- source_word: οὐδὲ ... οὐδὲ
  choice: గానీ ... గానీ ... కాకపోతే
  rationale: వరుసగా నిరాకరించబడిన మూడు గుర్తింపులను తెలుగులో సహజంగా, స్పష్టంగా సమన్వయపరుస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: సందర్భం యూదుల మెస్సీయ నిరీక్షణకు సంబంధించిన గుర్తింపు ప్రశ్న; ‘మెస్సీయ’ అనే రూపం ఆ బిరుదు స్వభావాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: ὁ προφήτης ఒక నిర్దిష్ట నిరీక్షిత వ్యక్తిని సూచిస్తుందా?
  choice: ఆ ప్రవక్త
  alternative: ప్రవక్త
  rationale: నిర్దిష్ట ఉపపదం వల్ల ఇది సాధారణంగా ఏ ప్రవక్తనైనా కాక, గుర్తించబడిన నిరీక్షిత వ్యక్తిని సూచిస్తుంది; అయితే అతని గుర్తింపును ప్రధాన వాక్యంలో మరింత నిర్ధారించకుండా పాదసూచికలో సాధ్యమైన నేపథ్యాన్ని మాత్రమే తెలిపారు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ప్రశ్న తీవ్రతను పెంచకుండా ఉంచారు. ‘బాప్తిస్మం ఇస్తున్నావు’ అనే విస్తృతంగా గుర్తించదగిన సంఘపరమైన పదబంధాన్ని వాడినా, ఏ ప్రత్యేక సంప్రదాయపు విధానార్థాన్నీ చేర్చలేదు.
