id: JHN.1.43
reference: John 1:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: te
  text: మరుసటి రోజు ఆయన గలిలయకు బయలుదేరాలని కోరుకున్నాడు. యేసు ఫిలిప్పును కనుగొని అతనితో, “నన్ను అనుసరించు”[a] అన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నన్ను అనుసరించు” అనే ఆజ్ఞ యేసుతో భౌతికంగా వెళ్లడాన్నీ, ఆయన శిష్యుడిగా మారి కొనసాగడాన్నీ సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: “కనుగొని,” “అన్నాడు” అని అనువదించిన క్రియలు గ్రీకులో సజీవ కథనం కోసం వర్తమాన కాలంలో ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: మరుసటి రోజు
  rationale: కథనంలోని కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἠθέλησεν
  choice: కోరుకున్నాడు
  rationale: θέλωలోని కోరిక లేదా సంకల్ప భావాన్ని నిలుపుతుంది; ‘నిర్ణయించుకున్నాడు’ అని ఉద్దేశపూర్వక నిర్ణయాన్ని అతిగా బలపరచదు.
- source_word: ἐξελθεῖν εἰς τὴν Γαλιλαίαν
  choice: గలిలయకు బయలుదేరాలని
  rationale: గ్రీకులోని బయటికి వెళ్లడం మరియు గమ్యస్థానం వైపు కదలడం అనే భావాలను సహజమైన తెలుగు ప్రయోగంలో కలిపి వ్యక్తం చేస్తుంది.
- source_word: εὑρίσκει
  choice: కనుగొని
  rationale: యేసు ఫిలిప్పును కలుసుకోవడం లేదా వెదికి కనుగొనడం అనే మూలార్థాన్ని నిలుపుతుంది; తెలుగు కథన ప్రవాహం కోసం చారిత్రక వర్తమానాన్ని అనుక్రమ క్రియారూపంలో తెలిపింది.
- source_word: λέγει αὐτῷ
  choice: అతనితో … అన్నాడు
  rationale: తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణం; గ్రీకు చారిత్రక వర్తమానాన్ని సహజ గతకాల కథనంగా అందిస్తుంది.
- source_word: Ἀκολούθει μοι
  choice: నన్ను అనుసరించు
  rationale: శారీరకంగా వెంట రావడం మరియు శిష్యుడిగా అనుసరించడం అనే రెండు భావసాధ్యతలనూ నిలుపుతుంది.
- source_word: Φίλιππον
  choice: ఫిలిప్పును
  rationale: వ్యక్తి పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణను, విభక్తితో సహా, ఉపయోగిస్తుంది.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: మూలంలో స్పష్టంగా ఉన్న కర్తను నిలుపుతుంది.
theological_decisions:
- issue: ఫిలిప్పుకు యేసు ఇచ్చిన ఆజ్ఞలోని భావవ్యాప్తి
  choice: “నన్ను అనుసరించు”
  alternative: “నాతో రా”
  rationale: మూలపదం తక్షణంగా యేసు వెంట వెళ్లడాన్నీ, విస్తృతంగా ఆయన శిష్యుడిగా జీవించడాన్నీ సూచించగలదు. ‘అనుసరించు’ ఈ రెండింటినీ పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగులో అసహజంగా కాకుండా గతకాల కథనంగా మార్చి, దాని వివరాన్ని పాదసూచికలో ఇచ్చాం.
