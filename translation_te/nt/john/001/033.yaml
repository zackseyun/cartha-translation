source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: te
  text: '‘నాకు కూడా ఆయన ఎవరో తెలియదు[a]. అయితే నీళ్లలో బాప్తిస్మం ఇవ్వడానికి నన్ను పంపినవాడు నాతో ఇలా చెప్పాడు: ‘ఎవరి మీద ఆత్మ దిగివచ్చి, ఆయన మీద నిలిచి ఉంటుందని నీవు చూస్తావో, పవిత్రాత్మలో బాప్తిస్మం ఇచ్చేవాడు ఆయనే.’’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఆయనను గుర్తించలేదు.” సందర్భాన్ని బట్టి గ్రీకు క్రియకు పరిచయం లేకపోవడం లేదా గుర్తించకపోవడం అనే భావం రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ οὐκ ᾔδειν αὐτόν
  choice: నేను ఆయనను ఎరుగలేదు
  rationale: καί యొక్క కొనసాగింపు భావాన్ని తెలుగు వాక్యప్రవాహంలో సహజంగా వ్యక్తం చేస్తూ, οὐκ ᾔδειν లోని తెలియకపోవడం లేదా గుర్తించకపోవడం అనే సందర్భసాధ్యమైన భావాన్ని ‘ఎరుగలేదు’ నేరుగా ఉంచుతుంది.
- source_word: ὁ πέμψας με βαπτίζειν ἐν ὕδατι
  choice: నీళ్లలో బాప్తిస్మం ఇవ్వడానికి నన్ను పంపినవాడు
  rationale: ఉద్దేశార్థక infinitive ను ‘ఇవ్వడానికి’గా, ἐν ను స్థానార్థక ‘లో’గా అనువదించి, చివరి ἐν πνεύματι ἁγίῳ తో ఉన్న సమాంతరతను కాపాడుతుంది.
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: ఎవరి మీద ... నీవు చూస్తావో
  rationale: గుర్తింపు సూచనను తెలిపే అనిర్దిష్ట relative construction ను సహజమైన తెలుగు ‘ఎవరి మీద ... చూస్తావో’ రూపంలో నిలుపుతుంది.
- source_word: τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν
  choice: ఆత్మ దిగివచ్చి నిలిచి ఉండడం
  rationale: καταβαίνω యొక్క దిగివచ్చే కదలికను, యోహాను రచనలో ముఖ్యమైన μένω యొక్క కొనసాగి ఉండే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ
  choice: పవిత్రాత్మలో బాప్తిస్మం ఇచ్చేవాడు ఆయనే
  rationale: οὗτός ἐστιν లోని స్పష్టమైన గుర్తింపును ‘ఆయనే’తో బలంగా ఉంచి, ἐν ను ‘లో’గా అనువదించడం ద్వారా నీళ్లలో/పవిత్రాత్మలో అనే మూలభాష సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: πνεῦμα / πνεύματι ἁγίῳ యొక్క సూచన
  choice: ఆత్మ ... పవిత్రాత్మ
  alternative: ఆత్మ ... పరిశుద్ధాత్మ
  rationale: చివరి పదబంధం దిగివచ్చే ఆత్మను దేవుని పవిత్రాత్మగా గుర్తిస్తుంది. ‘పవిత్రాత్మ’ ఆధునిక, సహజ తెలుగు; పాఠ్యంలో లేని అదనపు సిద్ధాంత వివరణను చేర్చదు.
- issue: బాప్తిస్మపు రెండు పదబంధాల్లో ἐν అనువాదం
  choice: నీళ్లలో ... పవిత్రాత్మలో
  alternative: నీళ్లతో ... పవిత్రాత్మతో
  rationale: రెండు చోట్లా ‘లో’ వాడటం గ్రీకు ἐν యొక్క పునరావృతాన్ని, యోహాను బాప్తిస్మానికి మరియు యేసు ఇచ్చే బాప్తిస్మానికి మధ్య ఉన్న ఉద్దేశపూర్వక సమాంతరతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘బాప్తిస్మం’ అనే విస్తృత క్రైస్తవ పదాన్ని ఉంచి, ‘ఎరుగలేదు’తో స్వల్పమైన గంభీరతను నిలిపాం. మూలంలోని నీళ్లలో/పవిత్రాత్మలో సమాంతరతను కాపాడాం.
