id: JHN.1.49
reference: John 1:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: te
  text: 'నతనయేలు ఆయనకు ఇలా జవాబిచ్చాడు: “రబ్బీ, నీవే దేవుని కుమారుడవు; నీవే ఇశ్రాయేలు రాజువు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: సంభాషణలో ἀποκρίνομαι అనే క్రియకు సహజమైన, అర్థానికి నేరుగా సరిపోయే ఆధునిక తెలుగు రూపం.
- source_word: Ῥαββί
  choice: రబ్బీ
  rationale: మొదటి శతాబ్దపు యూదా సందర్భాన్ని, ప్రత్యక్ష సంబోధనలోని గౌరవ బిరుదును నిలుపుకోవడానికి లిప్యంతరీకరించబడింది; ‘బోధకుడా’ అని అనువదిస్తే ప్రత్యేక సాంస్కృతిక రూపం తగ్గిపోతుంది.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: నిర్దిష్టమైన క్రీస్తుసంబంధ బిరుదు భావాన్ని తెలుగులో సహజంగా, ఎలాంటి విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: βασιλεὺς
  choice: రాజు
  rationale: మూలపదానికి నేరుగా సరిపోయే తెలుగు పదం; ఇక్కడ ‘ఇశ్రాయేలు’తో కూడిన విధేయ నామవాచకంగా ఇది నిర్దిష్టమైన రాజబిరుదును సూచిస్తుంది.
- source_word: τοῦ Ἰσραήλ
  choice: ఇశ్రాయేలు
  rationale: ‘ఇశ్రాయేలు రాజు’ అనే బిరుదు రూపాన్ని కాపాడుతుంది; ‘ఇశ్రాయేలును పాలించే’ అనేది వివరణాత్మక విస్తరణ అవుతుంది.
- source_word: σὺ εἶ … σὺ … εἶ
  choice: నీవే … నీవే
  rationale: గ్రీకులో రెండుసార్లు వచ్చిన స్పష్టమైన σὺ కలిగించే ఉద్ఘాటనను, సమాంతర ఒప్పుకోలు రూపాన్ని తెలుగులో ‘నీవే’ పునరుక్తితో నిలుపుతుంది.
- source_word: Ναθαναήλ
  choice: నతనయేలు
  rationale: తెలుగు బైబిలు వాడుకలో గుర్తించదగిన వ్యక్తినామ లిప్యంతరీకరణ.
theological_decisions:
- issue: ‘దేవుని కుమారుడు’ అనే నతనయేలు ఒప్పుకోలులోని క్రీస్తుసంబంధ బలం
  choice: ‘నీవే దేవుని కుమారుడవు’ అని బిరుదును తగ్గించకుండా, విస్తరించకుండా ఉంచడం.
  alternative: ‘నీవు దేవుని కుమారుల్లో ఒకడవు’ లేదా బిరుదు బలాన్ని తగ్గించే అనిర్దిష్ట రూపం.
  rationale: యోహాను సువార్త సందర్భంలో ఈ మాటకు ముఖ్యమైన మెస్సీయ మరియు క్రీస్తుసంబంధ బలం ఉంది. తరువాతి సిద్ధాంత పదజాలాన్ని చేర్చకుండా మూలంలోని నిర్దిష్ట ఒప్పుకోలును నిలుపుతుంది.
- issue: ‘ఇశ్రాయేలు రాజు’ అనే రాజసంబంధ-మెస్సీయ భావం
  choice: ‘నీవే ఇశ్రాయేలు రాజువు’ అనే స్పష్టమైన రాజబిరుదును ఉంచడం.
  alternative: ‘నీవు ఇశ్రాయేలును పాలించేవాడవు’ లేదా ఇతర వివరణాత్మక రూపం.
  rationale: ఈ పదబంధం ఇశ్రాయేలు ఎదురుచూసిన రాజసంబంధ మెస్సీయను సూచిస్తుంది. మూలంలోని బిరుదు రూపాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన వాక్య నిర్మాణం వాడబడింది. గ్రీకు మూలంలోని రెండు సమాంతర ప్రకటనల ఉద్ఘాటన కోసం ‘నీవే’ రెండుసార్లు నిలుపబడింది. ‘రబ్బీ’ అనే యూదా గౌరవ బిరుదు సాంస్కృతిక సందర్భాన్ని కాపాడేందుకు అనువదించకుండా లిప్యంతరీకరించబడింది.
