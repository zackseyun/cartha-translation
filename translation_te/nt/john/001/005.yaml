  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: te
  text: ఆ వెలుగు చీకటిలో ప్రకాశిస్తున్నది; చీకటి దానిని జయించలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చీకటి దానిని గ్రహించలేదు,” లేదా “పట్టుకోలేదు.” గ్రీకు క్రియకు జయించడం అనే అర్థమూ, పట్టుకోవడం లేదా గ్రహించడం అనే అర్థమూ ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: ఆ వెలుగు
  rationale: గ్రీకులోని నిర్దిష్ట ఉపపదాన్ని, యోహాను ప్రస్తావనలో ఇప్పటికే పరిచయమైన అంశసూచనను తెలుగులో సహజంగా చూపడానికి ‘ఆ వెలుగు’ అని అనువదించాం.
- source_word: σκοτίᾳ / σκοτία
  choice: చీకటి
  rationale: తెలుగులో భావవాచక పదమైన ‘చీకటి’కి ప్రత్యేక నిర్దేశకాన్ని రెండుసార్లు జోడించడం అసహజం; అయినా వెలుగు–చీకటి అనే అంశాత్మక, వ్యక్తీకృత వ్యతిరేకత స్పష్టంగా నిలుస్తుంది.
- source_word: φαίνει
  choice: ప్రకాశిస్తున్నది
  rationale: వర్తమాన సూచనార్థక క్రియలోని కొనసాగుతున్న చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατέλαβεν
  choice: జయించలేదు
  rationale: ఈ క్రియకు పట్టుకోవడం, గ్రహించడం, వశపరచుకోవడం అనే అర్థాలు సాధ్యమైనా, వెలుగు–చీకటి ఘర్షణ చిత్రంలో ‘జయించలేదు’ ప్రధాన పాఠానికి అనుకూలం. గ్రహించలేదు అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: αὐτό
  choice: దానిని
  rationale: ఈ నపుంసక ఏకవచన సర్వనామం వ్యాకరణపరంగా ‘వెలుగు’ను సూచిస్తుంది; అందువల్ల వ్యక్తిని సూచించే రూపాన్ని బలవంతంగా చేర్చకుండా ‘దానిని’ వాడాం.
theological_decisions:
- issue: వెలుగు–చీకటి వ్యతిరేకతలో κατέλαβεν అర్థం
  choice: జయించలేదు
  alternative: దానిని గ్రహించలేదు లేదా పట్టుకోలేదు
  rationale: గ్రీకు క్రియలో శత్రుత్వపూర్వకంగా వశపరచుకోవడం/జయించడం అనే భావమూ, మానసికంగా గ్రహించడం అనే భావమూ ఉన్నాయి. సందర్భంలోని వెలుగు–చీకటి చిత్రం ప్రధాన పాఠంలో ‘జయించలేదు’కు మద్దతిస్తుంది; యోహాను వాక్యంలోని బహుస్థాయి భావాన్ని కాపాడేందుకు మరో అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే యోహాను ప్రస్తావనకు తగిన గంభీరతతో రూపొందించబడింది. పాదటిప్పణి సూచిక ప్రధాన పాఠంలో ఉంది.
