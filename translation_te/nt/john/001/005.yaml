  naturalness: «ఆ వెలుగు చీకటిలో ప్రకాశిస్తున్నది; చీకటి దానిని జయించలేదు» ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా ఉంది. «ప్రకాశిస్తున్నది» వర్తమాన క్రియ యొక్క కొనసాగుతున్న/సజీవ భావాన్ని తగినట్లుగా వ్యక్తం చేస్తుంది. విరామచిహ్న వినియోగం కూడా స్పష్టమైన వ్యతిరేకతను ఇస్తుంది.
