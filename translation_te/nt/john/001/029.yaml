id: JHN.1.29
reference: John 1:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: te
  text: 'మరుసటి రోజు యేసు తనవైపు వస్తుండడాన్ని అతడు చూసి ఇలా అన్నాడు: “ఇదిగో, లోకపు పాపాన్ని తీసివేసే దేవుని గొర్రెపిల్ల!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: మరుసటి రోజు
  rationale: తర్వాతి దినాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: βλέπει
  choice: చూసి
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు కథన శైలికి సహజంగా మార్చింది; తదుపరి λέγειతో క్రియాక్రమాన్ని నిలిపింది.
- source_word: Ἴδε
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని బలంగా ఆకర్షించే ఆజ్ఞార్థక ఉద్ఘాటనను గౌరవప్రదమైన, సుపరిచితమైన తెలుగులో అందిస్తుంది.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: దేవుని గొర్రెపిల్ల
  rationale: రూపకాన్ని వివరణతో భర్తీ చేయకుండా నేరుగా నిలుపుతుంది; τοῦ θεοῦలోని సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ αἴρων
  choice: తొలగించే
  rationale: αἴρω ఇక్కడ పాపాన్ని తీసివేయడం లేదా తొలగించడం అనే భావాన్ని ఇస్తుంది; క్రియావిశేషణ సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: లోక పాపాన్ని
  rationale: ఏకవచన ἁμαρτίανను అలాగే నిలిపి, మొత్తం లోకానికి సంబంధించిన పాపాన్ని సమష్టి భావంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘దేవుని గొర్రెపిల్ల’ అనే రూపకానికి బలిపశువు లేదా పస్కా వివరణను జోడించాలా
  choice: రూపకాన్ని వివరణ లేకుండా నిలుపడం
  alternative: ‘లోక పాపాన్ని మోసే బలిగొర్రె’ వంటి వివరణాత్మక అనువాదం
  rationale: మూలపాఠం సూచనల పరిధి విస్తృతంగా ఉండవచ్చు; ఒకే నేపథ్యానికి దానిని పరిమితం చేయకూడదు.
- issue: αἴρωνను ‘మోసే’గా లేదా ‘తొలగించే’గా అనువదించడం
  choice: తొలగించే
  alternative: మోసే
  rationale: ఈ సందర్భంలో పాపాన్ని తొలగించే ఫలిత భావం ప్రధానంగా వినిపిస్తుంది; అయినా క్రియకు ‘ఎత్తడం/మోయడం’ అనే సాధ్యమైన భావం ఉందనే ఉద్రిక్తతను వ్యాఖ్యానంతో పరిష్కరించకుండా పాఠ్యాన్ని సంక్షిప్తంగా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన క్రమం, గౌరవప్రదమైన ప్రత్యక్ష వాక్యం ఉపయోగించబడ్డాయి. సంఘపరమైన ప్రత్యేక పదజాలం లేదా మూలంలో లేని సిద్ధాంత వివరణలు జోడించలేదు.
