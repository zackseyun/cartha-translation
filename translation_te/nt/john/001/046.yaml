  rationale: The revision replaces an unnatural literalism with idiomatic modern Telugu while preserving the Greek question’s source/origin sense and rhetorical skepticism. A footnote preserves the closer lexical alternative for εἶναι, matching the English audit trail without treating the more literal but awkward Telugu phrasing as the main text.
