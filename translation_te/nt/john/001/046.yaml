id: JHN.1.46
reference: John 1:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: te
  text: నతనయేలు అతనితో, “నజరేతు నుండి ఏదైనా మంచిది రాగలదా?[a]” అన్నాడు. ఫిలిప్పు అతనితో, “వచ్చి చూడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “నజరేతు నుండి ఏదైనా మంచిది ఉండగలదా?”
    reason: εἶναι అక్షరార్థంగా ‘ఉండడం’ అని ఉన్నప్పటికీ, ἐκతో కలిసి మూలం లేదా ఉద్భవాన్ని సూచిస్తున్నందున ప్రధాన పాఠంలో సహజమైన తెలుగు ప్రయోగమైన ‘రాగలదా?’ వాడబడింది.
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ Ναθαναήλ
  choice: నతనయేలు అతనితో ... అన్నాడు
  rationale: గ్రీకు వాక్యంలోని సరళ కథన ప్రవాహాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది. καίను ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా వాక్యసంధిలో సహజంగా వ్యక్తం చేశాం.
- source_word: Ἐκ Ναζαρὲτ
  choice: నజరేతు నుండి
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవ స్థానాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: ఏదైనా మంచి ఉండగలదా?
  rationale: εἶναι యొక్క ప్రాథమిక అర్థమైన ‘ఉండు/అగు’ను నిలుపుతూ, δύναται యొక్క సాధ్యత భావాన్ని సహజమైన తెలుగు ప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: ఫిలిప్పు అతనితో ... అన్నాడు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని సహజ తెలుగు కథన శైలిలో భూతకాలంగా ఇచ్చాం.
- source_word: Ἔρχου καὶ ἴδε
  choice: వచ్చి చూడు
  rationale: రెండు ఆజ్ఞలను సహజమైన తెలుగు సంయుక్త క్రియారూపంలో అందిస్తూ, చూడటం మరియు స్వయంగా గ్రహించడం అనే యోహాను సువార్తలోని భావప్రతిధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: నజరేతు గురించి నతనయేలు ప్రశ్నించిన స్వరం
  choice: అనుమానం వ్యక్తమయ్యే అలంకారిక ప్రశ్నగా మాత్రమే అనువదించడం
  alternative: వ్యంగ్యం లేదా తృణీకారం స్పష్టంగా జోడించడం
  rationale: గ్రీకు వాక్యం సందేహాన్ని సూచిస్తుంది గాని, వ్యంగ్యాన్ని లేదా తీవ్రమైన అవహేళనను ప్రత్యక్షంగా గుర్తించదు; అందువల్ల అదనపు భావాన్ని చేర్చలేదు.
- issue: εἶναι మరియు ἐκ కలయిక
  choice: ‘నజరేతు నుండి ఏదైనా మంచి ఉండగలదా?’
  alternative: ‘నజరేతు నుండి ఏదైనా మంచి రాగలదా?’
  rationale: ‘రాగలదా’ సహజమైన భావానువాదం అయినప్పటికీ, మూలంలోని εἶναι ‘ఉండడం/అగడం’ అనే నిజమైన అస్పష్టతను ప్రధాన పాఠంలో నిలిపాం; మరింత సహజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. వ్యక్తి పేర్లు ‘నతనయేలు,’ ‘ఫిలిప్పు,’ స్థలనామం ‘నజరేతు’గా తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించబడ్డాయి.
