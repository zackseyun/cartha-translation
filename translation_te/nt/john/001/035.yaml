source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον πάλιν εἱστήκει ⸀ὁ Ἰωάννης καὶ ἐκ τῶν μαθητῶν αὐτοῦ δύο,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/035.yaml
  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: te
  text: మరుసటి రోజు యోహాను మళ్లీ నిలబడి ఉన్నాడు; అతని శిష్యుల్లో ఇద్దరు అతనితో ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలపాఠంలో అక్షరార్థంగా, “మరుసటి రోజు యోహాను మళ్లీ నిలబడి ఉన్నాడు; అతని శిష్యుల్లో ఇద్దరు” అని ఉంది; రెండో భాగంలోని క్రియ సందర్భం నుండి గ్రహించబడుతుంది.
    reason: మూల గ్రీకు వాక్యంలో రెండో భాగానికి క్రియ స్పష్టంగా లేకపోవడం వల్ల, ప్రధాన పాఠ్యంలో పూరించిన భావాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: మరుసటి రోజు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ἐπαύριον ఇక్కడ ‘తరువాతి రోజు’ అనే కాలసూచక నుడికారంగా ఉంది. ఆధునిక తెలుగులో ‘మరుసటి రోజు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: మునుపటి దృశ్యంతో కథన సంబంధాన్ని, చర్య లేదా స్థితి పునరావృతిని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: εἱστήκει
  choice: నిలబడి ఉన్నాడు
  rationale: ἵστημι యొక్క ఈ రూపం గతంలో కొనసాగుతున్న స్థితిని సూచిస్తుంది. ‘నిలబడి ఉన్నాడు’ ఆ స్థితివాచక, కొనసాగుతున్న భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; మూలంలో లేని స్థలసూచకమైన ‘అక్కడ’ను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: ὁ Ἰωάννης
  choice: యోహాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం. సందర్భంలో బాప్తిస్మమిచ్చే యోహానే అయినా, గ్రీకు పాఠ్యం కేవలం ‘యోహాను’ అని మాత్రమే ఉన్నందున ప్రధాన పాఠ్యంలో విస్తరించలేదు.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: అతని శిష్యుల్లో ఇద్దరు అతనితో ఉన్నారు
  rationale: ἐκ కలిగిన నిర్మాణం సమూహంలోనుండి ఇద్దరిని సూచిస్తుంది. గ్రీకులో ఈ భాగానికి క్రియ స్పష్టంగా పునరుక్తం కాలేదు; తెలుగులో వాక్యం సహజంగా పూర్తయ్యేందుకు సందర్భం సూచించే ‘అతనితో ఉన్నారు’ను చేర్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని సరళ సమన్వయాన్ని అర్ధవిరామంతో నిలిపి, మూలంలో లేని ‘అక్కడ’ను చేర్చకుండా, అవసరమైన రెండో విధేయాన్ని మాత్రమే సందర్భానుసారంగా పూరించాం.
