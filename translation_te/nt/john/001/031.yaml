id: JHN.1.31
reference: John 1:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ἵνα φανερωθῇ τῷ Ἰσραὴλ διὰ τοῦτο ἦλθον ἐγὼ ⸀ἐν ὕδατι βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/031.yaml
  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
translation:
  language: te
  text: నేను కూడా ఆయనను ఎరుగలేదు[a]; అయితే ఆయన ఇశ్రాయేలుకు బయలుపరచబడాలని, ఇందుకే నేను నీటిలో బాప్తిస్మం ఇస్తూ వచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను గుర్తుపట్టలేదు.” గ్రీకు పదం పరిచయం లేకపోవడాన్నైనా, గుర్తుపట్టకపోవడాన్నైనా సూచించగలదు; ప్రధాన పాఠం విస్తృతమైన భావాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: నేను కూడా
  rationale: καί + ἐγώ లోని అనుసంధానాన్ని, స్వల్ప ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὐκ ᾔδειν αὐτόν
  choice: ఆయనను ఎరుగలేదు
  rationale: గతంలో ఉన్న తెలియకపోవడం అనే విస్తృత భావాన్ని ఉంచుతుంది; కేవలం గుర్తుపట్టకపోవడం అని పరిమితం చేయదు.
- source_word: ἀλλ’
  choice: అయితే
  rationale: మునుపటి తెలియకపోవడానికి, బాప్తిస్మ పరిచర్య ఉద్దేశానికి మధ్య వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἵνα φανερωθῇ τῷ Ἰσραὴλ
  choice: ఆయన ఇశ్రాయేలుకు బయలుపరచబడాలని
  rationale: ἵνα యొక్క ఉద్దేశార్థాన్నీ, φανερωθῇ యొక్క కర్మణి రూపాన్నీ నిలుపుతుంది.
- source_word: διὰ τοῦτο
  choice: ఇందుకే
  rationale: ముందు చెప్పిన ఉద్దేశాన్ని కారణంగా చూపే సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: ἦλθον ἐγὼ
  choice: నేను ... వచ్చాను
  rationale: సాధారణ భూతార్థాన్ని ఇస్తూ, స్పష్టంగా ఉన్న ἐγώ ఉద్ఘాటనను వ్యక్తపరుస్తుంది.
- source_word: ἐν ὕδατι βαπτίζων
  choice: నీటిలో బాప్తిస్మమిస్తూ
  rationale: ἐν ὕδατι యొక్క ‘నీటిలో’ భావాన్నీ, ప్రధాన క్రియతో సమకాలికమైన వర్తమాన కృదంత చర్యనూ కాపాడుతుంది; బాప్తిస్మ విధానాన్ని పాఠానికి మించి నిర్దిష్టం చేయదు.
theological_decisions:
- issue: యోహాను యేసును ఎరుగలేదన్న మాట యొక్క పరిధి
  choice: ఆయనను ఎరుగలేదు
  alternative: ఆయనను గుర్తుపట్టలేదు; ఆయన మెస్సీయ అని నాకు తెలియదు
  rationale: గ్రీకు వాక్యం వ్యక్తిగత పరిచయం లేకపోవడానికైనా, గుర్తింపు లేకపోవడానికైనా చోటిస్తుంది. మెస్సీయ సంబంధమైన వివరణను మూలపాఠం స్పష్టంగా జోడించనందున విస్తృతమైన మాటనే ప్రధాన పాఠంలో ఉంచాం.
- issue: φανερωθῇ లోని కర్మణి భావం
  choice: బయలుపరచబడాలని
  alternative: తెలియజేయబడాలని; ప్రత్యక్షం కావాలని
  rationale: కర్మణి రూపాన్ని నిలుపుతూ, క్రియకు కర్త ఎవరో అనవసరంగా చేర్చకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఎరుగలేదు’ అనే కొద్దిగా గంభీరమైన కాని సుపరిచితమైన పదం మూలంలోని అర్థవిస్తృతిని కాపాడుతుంది; ‘బాప్తిస్మమిస్తూ’ స్థిరమైన బైబిలు పరిభాషగా వాడబడింది.
