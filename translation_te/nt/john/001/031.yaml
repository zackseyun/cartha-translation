  to: నేను కూడా ఆయనను ఎరుగలేదు[a]; అయితే ఆయన ఇశ్రాయేలుకు బయలుపరచబడాలని, ఇందుకే నేను నీటిలో బాప్తిస్మం ఇస్తూ వచ్చాను.
