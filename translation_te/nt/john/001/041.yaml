id: JHN.1.41
reference: John 1:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: te
  text: 'అతడు మొదట తన సొంత సోదరుడైన సీమోనును కనుగొని, అతనితో, “మేము మెస్సీయను కనుగొన్నాం” అని చెప్పాడు. (‘మెస్సీయ’ అంటే ‘అభిషిక్తుడు’.)[a]


    [a] సాంప్రదాయ అనువాదం: “‘మెస్సీయ’—అనువదిస్తే ‘క్రీస్తు’.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'సాంప్రదాయ అనువాదం: “‘మెస్సీయ’—అనువదిస్తే ‘క్రీస్తు’.”'
    reason: χριστόςను సాంప్రదాయంగా ‘క్రీస్తు’ అని లిప్యంతరీకరించే ప్రత్యామ్నాయాన్ని నమోదు చేయడం.
lexical_decisions:
- source_word: εὑρίσκει
  choice: కనుగొని
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథనంలో సహజంగా గత సంఘటనను సూచించే క్రియారూపాన్ని వాడాం.
- source_word: οὗτος
  choice: అతడు
  rationale: సందర్భంలో ఇది అంద్రెయను సూచిస్తుంది; తెలుగులో సహజమైన సర్వనామాన్ని వాడాం.
- source_word: πρῶτον
  choice: మొదట
  rationale: అంద్రెయ చేసిన చర్యల క్రమాన్ని తెలిపే భావాన్ని నిలుపుతుంది.
- source_word: ἀδελφὸν τὸν ἴδιον
  choice: తన సొంత సోదరుడైన
  rationale: ἴδιον ఇచ్చే ప్రత్యేక ఉద్ఘాటనను ‘సొంత’ నిలుపుతుంది; సీమోను పురుషుడు కాబట్టి ‘సోదరుడు’ సందర్భోచితం.
- source_word: Σίμωνα
  choice: సీమోను
  rationale: తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా వ్యక్తిపేరును లిప్యంతరీకరించాం.
- source_word: λέγει αὐτῷ
  choice: అతనితో … అని చెప్పాడు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు గతకాల కథనంగా అందించాం.
- source_word: Εὑρήκαμεν
  choice: మేము … కనుగొన్నాం
  rationale: గ్రీకు పరిపూర్ణ కాలం సూచించే, ప్రస్తుతం ప్రాముఖ్యత కలిగిన కనుగొనడాన్ని సహజ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Μεσσίαν
  choice: మెస్సీయ
  rationale: సెమిటిక్ బిరుదును లిప్యంతరీకరించి యూదుల మెస్సీయ నిరీక్షణ నేపథ్యాన్ని నిలుపుతుంది.
- source_word: μεθερμηνευόμενον
  choice: అంటే
  rationale: వేరొక భాషలోని బిరుదుకు అర్థం వివరిస్తున్న కుండలీకరణ వాక్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: χριστός
  choice: అభిషిక్తుడు
  rationale: Μεσσίαςకు గ్రీకు సమానార్థకమైన χριστός యొక్క అర్థాన్ని తెలుగులో స్పష్టంగా చెప్పి, మూలంలోని వివరణాత్మక ప్రయోజనాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Μεσσίας మరియు χριστός అనే మెస్సీయ బిరుదుల సంబంధం
  choice: ప్రధాన వాక్యంలో ‘మెస్సీయ’, వివరణలో ‘అభిషిక్తుడు’
  alternative: ‘మెస్సీయ … అనువదిస్తే క్రీస్తు’
  rationale: మూలంలో సెమిటిక్ బిరుదుకు గ్రీకు సమానార్థక పదం ఇవ్వబడింది. తెలుగులో రెండింటినీ ఒకే రూపంగా ఇస్తే వివరణ ఎందుకు ఉందో మరుగవుతుంది; ‘అభిషిక్తుడు’ అర్థాన్ని వెల్లడిస్తుంది. సాంప్రదాయ రూపాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలి; గౌరవప్రదంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంది. గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు గతకాల కథనంగా మార్చినా, బిరుదుల మధ్య ఉన్న వివరణాత్మక సంబంధాన్ని నిలిపాం.
