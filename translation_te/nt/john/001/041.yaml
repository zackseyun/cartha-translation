  source_fidelity: గ్రీకు మూలంలోని కథనక్రమం, అంద్రెయను సూచించే సర్వనామం, తన సొంత సోదరుడనే ఉద్ఘాటన, సీమోను పేరు, అలాగే ‘మెస్సీయ’కు χριστός ద్వారా ఇచ్చిన వివరణాత్మక సంబంధం అన్నీ సరిగా ప్రతిఫలించాయి. చారిత్రక వర్తమానాలను సహజ తెలుగు గతకాల కథనంగా మార్చడం అర్థనష్టాన్ని కలిగించదు. ‘అభిషిక్తుడు’ χριστός యొక్క అర్థాన్ని స్పష్టపరుస్తుంది.
  naturalness: ‘అతడు మొదట తన సొంత సోదరుడైన సీమోనును కనుగొని, అతనితో ... అని చెప్పాడు’ అనేది ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, సహజమైన కథనశైలి. కుండలీకరణలోని వివరణ కూడా పాఠకునికి సహజంగా అర్థమవుతుంది.
