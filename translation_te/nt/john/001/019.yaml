review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the principal participants, Jerusalem origin, priests and Levites, John's testimony, and the direct question. However, “అతన్ని అడిగించినప్పుడు” is causative (“when [they] had him questioned”) and does not directly render the purpose clause ἵνα ἐρωτήσωσιν αὐτόν (“to ask him”).
  naturalness: The overall register is modern and clear. Recasting the sentence so that the priests and Levites themselves ask John removes the awkward causative construction and makes the narrative relation explicit in idiomatic Telugu.
  terminology: “సాక్ష్యం,” “యాజకులు,” “లేవీయులు,” and “యూదులు” are appropriate. The footnote’s alternative “యూదయులు” is not a clear modern Telugu equivalent for “Judeans”; “యూదయవాసులు” is clearer. The note appropriately avoids treating all Jewish people as the intended referent.
  issues:
  - severity: medium
    issue: “అతన్ని అడిగించినప్పుడు” renders the questioning as causative.
    rationale: The Greek says that the Jews sent priests and Levites with the purpose that they might ask John. Telugu “అడిగించు” normally means to cause someone to ask, or have someone questioned, and blurs the agents and purpose relation.
  - severity: low
    issue: Footnote alternative “యూదయులు” is potentially unclear.
    rationale: For the geographic-social sense “Judeans,” modern Telugu “యూదయవాసులు” more clearly identifies people of Judea and does not merely repeat or confuse the ethnic designation “యూదులు.”
  revised_text: యూదులు[a] యెరూషలేము నుండి యోహాను దగ్గరకు యాజకులను, లేవీయులను పంపి, వారు అతన్ని, “నీవెవరు?” అని అడిగినప్పుడు, యోహాను ఇచ్చిన సాక్ష్యం ఇదే.
  revised_footnotes:
