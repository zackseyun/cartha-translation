id: JHN.1.19
reference: John 1:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: te
  text: యూదులు[a] యెరూషలేము నుండి యోహాను దగ్గరకు యాజకులను, లేవీయులను పంపి, వారు అతన్ని, “నీవెవరు?” అని అడిగినప్పుడు, యోహాను ఇచ్చిన సాక్ష్యం ఇదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదుల నాయకులు,” లేదా “యూదయవాసులు.” యోహాను సువార్తలో “యూదులు” అనే పదం తరచుగా యూద ప్రజలందరినీ కాక, ప్రత్యేకంగా యూదయ మతాధికారులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: సాక్ష్యం
  rationale: ఈ సందర్భంలో యోహాను ఇచ్చిన ధృవీకరణాత్మక వాంగ్మూలాన్ని సూచిస్తుంది; యోహాను సువార్తలోని న్యాయస్థాన/సాక్ష్య భావాన్ని కూడా నిలుపుతుంది.
- source_word: τοῦ Ἰωάννου
  choice: యోహాను ఇచ్చిన
  rationale: ఇది కర్తృసంబంధ షష్ఠీగా, యోహాను గురించి ఇచ్చిన సాక్ష్యం కాక యోహానే ఇచ్చిన సాక్ష్యంగా గ్రహించబడింది.
- source_word: ὅτε
  choice: అప్పుడు / ఇచ్చినప్పుడు
  rationale: సాక్ష్యం ఇవ్వబడిన సందర్భాన్ని పరిచయం చేసే కాలార్థక సంబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ἀπέστειλαν
  choice: పంపి
  rationale: కథన సందర్భంలో సాధారణమైన, స్పష్టమైన సమానార్థకం.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: మూలంలోని విస్తృత పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ఈ సందర్భంలో అది ముఖ్యంగా యూదయ మతాధికారులను సూచించే అవకాశాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: ἐξ Ἱεροσολύμων
  choice: యెరూషలేము నుండి
  rationale: ప్రదేశ మూలాన్ని తెలిపే సహజ తెలుగు రూపం.
- source_word: ἱερεῖς καὶ Λευίτας
  choice: యాజకులను, లేవీయులను
  rationale: ఆలయ సంబంధమైన రెండు ప్రత్యేక వర్గాలను స్పష్టంగా వేరు చేసి అనువదిస్తుంది.
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: అతన్ని అడిగించడానికి / అతన్ని అడిగించినప్పుడు
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని కాపాడుతూ, పంపినవారే ప్రతినిధుల ద్వారా ప్రశ్న వేయించిన భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: Σὺ τίς εἶ;
  choice: నీవెవరు?
  rationale: Σὺ లోని స్వల్ప ఉద్ఘాటనను సహజంగా నిలిపే సంక్షిప్త తెలుగు ప్రశ్న.
theological_decisions:
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι అనే పదబంధపు పరిధి
  choice: ప్రధాన పాఠ్యంలో “యూదులు” అని ఉంచి, సందర్భానుసారమైన పరిమిత అర్థాన్ని పాదసూచికలో వివరించడం
  alternative: “యూదుల నాయకులు” లేదా “యూదయులు”
  rationale: మూల పదబంధాన్ని ముందుగానే సంకుచితం చేయకుండా కాపాడుతుంది; అదే సమయంలో యెరూషలేము నుండి యాజకులు, లేవీయులు పంపబడటం ఇక్కడ సాధారణ యూద ప్రజలందరినీ కాక మతాధికార వర్గాన్ని ముఖ్యంగా సూచించవచ్చని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. గ్రీకు వాక్య ప్రవాహాన్ని తెలుగులో సహజంగా చేయడానికి కాలవాక్యాన్ని ముందుకు తెచ్చాం; “సాక్ష్యం” ద్వారా యోహాను సువార్తలోని సాక్ష్య సంబంధిత భావాన్ని నిలిపాం.
