revisions:
- from: యూదులు[a] యెరూషలేము నుండి యాజకులను, లేవీయులను యోహాను దగ్గరికి పంపి, “నీవెవరు?” అని అతన్ని అడిగించినప్పుడు, అతడు ఇచ్చిన సాక్ష్యం ఇదే.
  to: యూదులు[a] యెరూషలేము నుండి యోహాను దగ్గరకు యాజకులను, లేవీయులను పంపి, వారు అతన్ని, “నీవెవరు?” అని అడిగినప్పుడు, యోహాను ఇచ్చిన సాక్ష్యం ఇదే.
  rationale: The revision replaces the causative wording with an explicit, natural Telugu rendering in which the dispatched priests and Levites ask John. This preserves the Greek purpose and narrative sense. The footnote retains the source-faithful main-text term while clarifying the contextual referent and uses a clearer Telugu alternative for “Judeans.”
