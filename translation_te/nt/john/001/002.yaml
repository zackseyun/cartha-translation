translation:
  language: te
  text: ఆయన ఆదిలో దేవునితో ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈయన ఆదిలో దేవునితో ఉన్నాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: ఆయన
  rationale: ఇది వ్యాకరణపరంగా ‘ఈయన/ఈ వ్యక్తి’ అనే సూచనార్థక సర్వనామమైనా, సందర్భంలో 1వ వచనంలోని ‘వాక్కు’ను తిరిగి సూచిస్తుంది. ఆధునిక తెలుగులో వ్యక్తిగత సూచనను సహజంగా తెలియజేయడానికి ‘ఆయన’ సరైనది; ‘ఈయన’ కూడా సాధ్యమే కాబట్టి పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἦν
  choice: ఉన్నాడు
  rationale: εἰμί యొక్క అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగుతున్న స్థితిని సూచిస్తుంది. వ్యక్తిగత సూచనతో తెలుగులో ‘ఉన్నాడు’ సహజంగా ఉండి, కేవలం ‘ఉనికిలో ఉన్నాడు’ అని అతివివరణ చేయదు.
- source_word: ἐν ἀρχῇ
  choice: ఆదిలో
  rationale: ఈ రూపం ఆదికాండము 1:1 ప్రతిధ్వనిని నిలుపుతూ, యోహాను 1:1–2లోని పదబంధానికి సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగు సమానార్థకాన్ని ఇస్తుంది.
- source_word: πρὸς
  choice: తో
  rationale: ఇక్కడ πρός వ్యక్తిగత సాన్నిహిత్యంతో కూడిన సంబంధం మరియు భేదాన్ని సూచిస్తుంది. ‘దేవునితో’ సహజమైన తెలుగు; ‘దేవుని వైపు’ అని అనడం ఈ సందర్భంలో అవసరానికి మించి దిశార్థాన్ని ముందుకు తెస్తుంది.
- source_word: τὸν θεόν
  choice: 'దేవుడు (విభక్తి రూపం: దేవునితో)'
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, తెలుగులో దానిని ప్రత్యేక పదంతో వ్యక్తం చేయాల్సిన అవసరం లేదు. ‘దేవునితో’ నిర్దిష్ట సూచ్యాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యోహాను 1:1లోని ‘వాక్కు’తో οὗτος యొక్క సంబంధం
  choice: ‘ఆయన’ అని వ్యక్తిగతంగా అనువదించి, ఇది ‘వాక్కు’ను తిరిగి సూచిస్తుందని చూపడం
  alternative: ‘ఈయన’
  rationale: ఈ వచనం 1వ వచనంలోని వాక్కు యొక్క గుర్తింపును, దేవునితో ఆయన సంబంధాన్ని పునరుద్ఘాటిస్తుంది. ‘ఆయన’ మూలపాఠానికి మించిన సిద్ధాంతపరమైన పదాలను చేర్చకుండా వ్యక్తిగత సూచనను సహజంగా నిలుపుతుంది.
- issue: πρὸς τὸν θεόν యొక్క భావబలం
  choice: ‘దేవునితో’ అని సంబంధం మరియు భేదాన్ని వ్యక్తం చేయడం
  alternative: ‘దేవుని వైపు’; ‘దేవుని సన్నిధిలో’
  rationale: ఈ పదబంధం వాక్కు మరియు దేవుని మధ్య వ్యక్తిగత సంబంధాన్నీ భేదాన్నీ సూచిస్తుంది. ‘దేవునితో’ అనే అనువాదం ఈ వేదాంతపరమైన ఉద్వేగాన్ని కాపాడుతూ, తాత్త్విక వర్గీకరణలను మూలపాఠంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఆదిలో’ అనే రూపం ఆదికాండము ప్రతిధ్వనిని నిలుపుతుంది. ప్రధాన పాఠంలో ‘ఆయన’ పఠనసౌలభ్యాన్ని ఇస్తుండగా, మూలంలోని సూచనార్థక οὗτος‌కు దగ్గరైన ‘ఈయన’ను పాదటిప్పణిలో భద్రపరిచాం.
