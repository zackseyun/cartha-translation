source:
  edition: SBLGNT
  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: te
  text: ఆదిలో[b] వాక్యం ఉంది; వాక్యం దేవునితో ఉంది; వాక్యం దేవుడు.[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: లేదా, “వాక్యం దైవస్వభావం గలది,” లేదా “దేవుడు ఎలాంటి స్వభావం గలవాడో, వాక్యం కూడా అలాంటి స్వభావం గలది.” చివరి ఉపవాక్యంలో గ్రీకు పదనిర్మాణం “దేవుడు” అనే పదాన్ని గుణాత్మకంగా ఉంచుతుంది; అది వాక్యపు సంపూర్ణ దేవత్వాన్ని ప్రకటిస్తూ, ముందటి ఉపవాక్యంలో చెప్పబడిన దేవుని నుండి వాక్యాన్ని వ్యక్తిగా వేరు చేస్తుంది.
    reason: alternative_reading
  - marker: b
    text: “ఆదిలో” అనే మాట ఆదికాండము 1:1ను ప్రతిధ్వనింపజేసి, సృష్టి ఆరంభంతో వాక్యానికి ఉన్న సంబంధాన్ని చూపిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: ఆదిలో
  rationale: ఆదికాండము 1:1ను ప్రతిధ్వనింపజేసే సంక్షిప్తమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: ἦν
  choice: ఉన్నాడు / దేవుడై ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాలంలోని నిరంతర ఉనికిని సహజ తెలుగులో తెలియజేస్తుంది; వ్యక్తిగా సూచించబడుతున్న వాక్యానికి పుంలింగ క్రియను వాడటం యోహాను సందర్భానికి అనుగుణం.
- source_word: ὁ λόγος
  choice: వాక్యం
  rationale: మాట, ప్రకటన అనే భావాలను నిలుపుతూ, యోహాను రచనలో వ్యక్తిగత క్రీస్తు సంబంధిత బిరుదుగా పనిచేసే λόγοςకు స్థిరమైన తెలుగు సమానార్థకం.
- source_word: πρὸς τὸν θεόν
  choice: దేవునితో
  rationale: πρός సూచించే సంబంధం, సాన్నిహిత్యం, వ్యక్తిగత భేదాన్ని సహజ తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: θεὸς ἦν ὁ λόγος
  choice: ఆ వాక్యం దేవుడై ఉన్నాడు
  rationale: ముందటి ఉపవాక్యంలోని దేవుని నుండి వాక్యాన్ని వ్యక్తిగా వేరు చేస్తూనే, అనిర్దిష్ట విశేషణాత్మక θεός తెలియజేసే దేవత్వ స్వభావాన్ని బలంగా నిలుపుతుంది; 'ఒక దేవుడు' అనే భావాన్ని నివారిస్తుంది.
theological_decisions:
- issue: చివరి ఉపవాక్యంలో article లేని predicate θεόςను అనువదించడం
  choice: ఆ వాక్యం దేవుడై ఉన్నాడు
  alternative: ఆ వాక్యం దైవస్వభావం గలవాడు; దేవుడు ఎలాంటి స్వభావం గలవాడో, వాక్యం కూడా అలాంటి స్వభావం గలవాడు
  rationale: గ్రీకు పదక్రమం θεόςను గుణాత్మకంగా ముందుకు తెస్తుంది. ఈ రూపం వాక్యపు సంపూర్ణ దేవత్వాన్ని ప్రకటిస్తూ, ముందటి ఉపవాక్యంలో చెప్పిన దేవునితో వాక్యానికి ఉన్న వ్యక్తిగత భేదాన్ని చెరపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూడు ఉపవాక్యాల పునరుక్తి, లయను నిలిపాం. రెండు పాదసూచిక గుర్తులూ సంబంధిత వాక్యాంతంలో ఉంచబడ్డాయి.
