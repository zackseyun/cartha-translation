source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: te
  text: నతనయేలు ఆయనతో, “మీకు నేను ఎలా తెలుసు?[a]” అని అడిగాడు. యేసు అతనికి జవాబిస్తూ ఇలా అన్నాడు, “ఫిలిప్పు నిన్ను పిలవకముందే, నువ్వు అంజూరపు చెట్టు కింద ఉన్నప్పుడు నేను నిన్ను చూశాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “మీకు నేను ఎక్కడి నుంచి తెలుసు?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν με γινώσκεις;
  choice: నేను మీకు ఎలా తెలుసు?
  rationale: Πόθεν అక్షరార్థంగా ‘ఎక్కడి నుంచి?’ అయినా, γινώσκειςతో కలిసి ఇక్కడ యేసుకు తన గురించి ఎలా తెలుసన్న ఆధారాన్ని ప్రశ్నిస్తుంది. ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- source_word: γινώσκεις
  choice: తెలుసు
  rationale: వ్యక్తిగత పరిచయం లేదా జ్ఞానాన్ని సూచించే ఈ క్రియకు సందర్భానుగుణమైన సహజ తెలుగు పదం.
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: జవాబిస్తూ ... అన్నాడు
  rationale: గ్రీకు భాషలోని రెండు క్రియల జవాబు-మాట్లాడే భావాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది; ‘జవాబిచ్చి చెప్పాడు’ అనే కృతక పునరుక్తిని నివారిస్తుంది.
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: ఫిలిప్పు నిన్ను పిలవకముందే
  rationale: Πρὸ τοῦతో కూడిన infinitive సూచించే పూర్వకాల సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; ‘ఏ’ ముందస్తు కాలాన్ని నొక్కి చెబుతుంది.
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: నువ్వు అంజూరపు చెట్టు కింద ఉన్నప్పుడు
  rationale: Participial phrase ఇచ్చే సందర్భ-కాల భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἶδόν σε
  choice: నేను నిన్ను చూశాను
  rationale: Aorist indicativeను సరళ భూతకాలంగా అనువదిస్తుంది. చూసిన సమయం ఫిలిప్పు పిలుపుకు ముందని ముందున్న ఉపవాక్యమే స్పష్టం చేస్తుంది.
- source_word: συκῆν
  choice: అంజూరపు చెట్టు
  rationale: తెలుగులో fig treeకు ప్రామాణికమైన, సాధారణంగా అర్థమయ్యే పేరు.
theological_decisions:
- issue: నతనయేలు గురించి యేసుకు ఉన్న జ్ఞానం స్వభావం
  choice: యేసు ముందే చూసినట్లు చెప్పిన మాటను నేరుగా అనువదించడం; అది అద్భుత జ్ఞానమా, ప్రవచనాత్మక జ్ఞానమా, సాధారణ పరిశీలనా అని వివరించకపోవడం.
  alternative: అనువాదంలోనే అద్భుతమైన పూర్వజ్ఞానాన్ని సూచించడం లేదా దానిని సాధారణంగా ముందే చూసిన ఘటనగా పరిమితం చేయడం.
  rationale: ఈ వచనం యేసు ఎలా చూశాడో లేదా తెలుసుకున్నాడో వివరించదు. కాబట్టి మూలంలోని ఉద్దేశపూర్వక అనిశ్చితిని, దైవశాస్త్రపరమైన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన సంభాషణా శైలి. నతనయేలు యేసును ఉద్దేశించినప్పుడు ‘మీకు’ అనే గౌరవ రూపం, యేసు నతనయేలుతో మాట్లాడినప్పుడు సందర్భానుగుణ ఏకవచన ‘నిన్ను/నువ్వు’ వాడబడ్డాయి.
