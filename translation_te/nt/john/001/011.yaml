id: JHN.1.11
reference: John 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς τὰ ἴδια ἦλθεν, καὶ οἱ ἴδιοι αὐτὸν οὐ παρέλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: te
  text: ఆయన తనకు చెందిన వాటి వద్దకు వచ్చాడు[a]; అయితే ఆయన సొంతవారు ఆయనను స్వీకరించలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనదైన చోటుకు.” మొదటి గ్రీకు పదబంధం నపుంసక బహువచనంలో ఉంది; తరువాతి “ఆయన సొంతవారు” అనే పదబంధం పుంలింగ బహువచనంలో ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఆయనను అంగీకరించలేదు” లేదా “ఆయనకు స్వాగతం పలకలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: తనకు చెందినవాటి దగ్గరకు
  rationale: గ్రీకులో ఇది నపుంసక బహువచనం; కాబట్టి నేరుగా వ్యక్తులను కాకుండా ఆయనకు చెందిన స్థలం, పరిధి, ఇల్లు లేదా ఆస్తులను సూచించే విస్తృత భావాన్ని ఈ అనువాదం నిలుపుతుంది.
- source_word: ἦλθεν
  choice: వచ్చాడు
  rationale: ἔρχομαι క్రియ యొక్క భూతకాల రూపానికి సహజమైన, సూటియైన తెలుగు అనువాదం.
- source_word: οἱ ἴδιοι
  choice: ఆయన సొంతవారు
  rationale: గ్రీకులో ఇది పుంలింగ బహువచనం కాబట్టి వ్యక్తులను సూచిస్తుంది. ముందున్న నపుంసక బహువచన పదబంధంతో ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని ఇది తెలుగులో సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: సందర్భంలో వాక్యము/వెలుగు అని పేర్కొనబడిన వ్యక్తినే ఈ సర్వనామం సూచిస్తుంది.
- source_word: παρέλαβον
  choice: స్వీకరించలేదు
  rationale: ఇక్కడ παραλαμβάνω ఒక వ్యక్తిని స్వీకరించడం, అంగీకరించడం లేదా ఆహ్వానించడం అనే విస్తృత భావాన్ని కలిగి ఉంది; ‘స్వీకరించలేదు’ ఆ భావపరిధిని అతిగా సంకుచితం చేయదు.
theological_decisions:
- issue: ἴδιος పదం రెండుసార్లు వాడబడినప్పుడు దాని సూచన మరియు భావభేదం
  choice: మొదటి పదబంధం ఆయనకు చెందిన వాటిని లేదా పరిధిని సూచిస్తుంది; రెండవది ఆయన సొంతవారిని సూచిస్తుంది.
  alternative: రెండు పదబంధాలూ ఆయన సొంత ప్రజలనే సూచిస్తాయి; లేదా మొదటి పదబంధం ప్రత్యేకంగా ఆయన సొంత ఇల్లు/ఇంటివారిని సూచిస్తుంది.
  rationale: గ్రీకు పాఠం నపుంసక బహువచనం τὰ ἴδια నుండి పుంలింగ బహువచనం οἱ ἴδιοι వైపు మారుతుంది. అందువల్ల స్థలం/పరిధి/సొత్తు మరియు వ్యక్తుల మధ్య ఉన్న భేదాన్ని అనువాదం కాపాడుతుంది; మొదటి పదబంధాన్ని ఒకే నిర్దిష్ట అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘తనకు చెందినవాటి దగ్గరకు’ కొంత అసాధారణంగా వినిపించినా, మూలంలోని నపుంసక బహువచన విస్తృతిని మరియు తరువాతి వ్యక్తివాచక పదబంధంతో ఉన్న వ్యత్యాసాన్ని కాపాడటానికి ఉద్దేశపూర్వకంగా ఎంచుకోబడింది.
