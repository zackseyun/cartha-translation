lexical_decisions:
- source_word: κἀγώ
  choice: నేను
  rationale: καί + ἐγώలోని ప్రథమ పురుష ఉద్ఘాటనను తెలుగు కర్త స్పష్టంగా వ్యక్తపరుస్తుంది; ముందున్న సందర్భంతో అనుసంధానం తెలుగులో వాక్యప్రవాహం ద్వారా సహజంగా తెలుస్తుంది.
- source_word: ἑώρακα
  choice: చూశాను
  rationale: గ్రీకు పరిపూర్ణ కాలం సూచించే ప్రత్యక్ష అనుభవాన్ని సహజమైన ఆధునిక తెలుగులో భూతకాల రూపంతో తెలిపింది; దాని కొనసాగుతున్న సాక్ష్యబలం తరువాతి క్రియతో స్పష్టమవుతుంది.
- source_word: μεμαρτύρηκα
  choice: సాక్ష్యమిచ్చాను
  rationale: యోహాను చేసిన సాక్ష్య ప్రకటనను గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆధునిక తెలుగు పదబంధంతో వ్యక్తపరుస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: ఇది కారణాన్ని కాదు, సాక్ష్యంలోని విషయాన్ని పరిచయం చేస్తుంది; అందువల్ల తెలుగు ఉద్ధరణపూరకమైన ‘అని’ సహజమైన అనువాదం.
- source_word: οὗτός
  choice: ఈయనే
  rationale: యేసును నేరుగా సూచించే నిర్దేశక సర్వనామ భావాన్ని, అలాగే గ్రీకులోని గుర్తింపు ఉద్ఘాటనను సహజమైన గౌరవప్రద తెలుగులో నిలుపుతుంది.
- source_word: ὁ ἐκλεκτός
  choice: ఎన్నుకున్నవాడు
  rationale: ఆర్టికల్‌తో నామవాచకంగా వాడిన విశేషణాన్ని సాధారణ పాఠకులకు పారదర్శకమైన వ్యక్తి-సూచక రూపంలో అందిస్తుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుడు
  rationale: తెలుగులో ‘దేవుడు ఎన్నుకున్నవాడు’ అనే క్రియాత్మక నిర్మాణం, దేవునితో సంబంధం మరియు ఎంపికకు దేవుడే కర్త అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యోహాను 1:34లోని క్రీస్తు సంబంధ బిరుదు
  choice: దేవుడు ఎన్నుకున్నవాడు
  alternative: దేవుని కుమారుడు
  rationale: ఇచ్చిన SBLGNT పాఠం ὁ ἐκλεκτὸς τοῦ θεοῦను నేరుగా అనువదించి, సుపరిచితమైన ప్రత్యామ్నాయ పాఠంతో ప్రధాన వచనాన్ని కలపలేదు. ముఖ్యమైన ‘దేవుని కుమారుడు’ పాఠభేదాన్ని పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైనదిగా, అయితే వచనానికి తగిన గౌరవభరిత శైలిలో రూపొందించబడింది. రెండు గ్రీకు పరిపూర్ణ క్రియలను అసహజమైన కాలనిర్మాణంతో కాకుండా సహజ తెలుగు భూతకాలంలో అందించి, అర్ధవిరామంతో వాటి సన్నిహిత సంబంధాన్ని చూపింది.
