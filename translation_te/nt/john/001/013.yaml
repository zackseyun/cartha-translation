revisions:
- from: వారు రక్తాల మూలంగా[a] గానీ, శరీర సంకల్పం మూలంగా గానీ, పురుషుని సంకల్పం మూలంగా గానీ కాక, దేవుని మూలంగా జన్మించారు.
  to: వారు రక్తాల నుండి[a] గానీ, శరీర సంకల్పం నుండి గానీ, పురుషుని సంకల్పం నుండి గానీ కాక, దేవుని నుండి జన్మించారు.
  rationale: The revision replaces ‘మూలంగా’ with ‘నుండి’ to render the repeated ἐκ as origin/source rather than possible means or cause. It retains the Greek’s unusual plural ‘రక్తాలు’ in the text, with an idiomatic explanatory alternative in the footnote, and preserves the verse’s human-origin/divine-origin contrast without adding theological interpretation.
