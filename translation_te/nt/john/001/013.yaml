id: JHN.1.13
reference: John 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: te
  text: వారు రక్తాల నుండి[a] గానీ, శరీర సంకల్పం నుండి గానీ, పురుషుని సంకల్పం నుండి గానీ కాక, దేవుని నుండి జన్మించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత భావసహజంగా, ‘రక్తసంబంధాల నుండి’ లేదా ‘సహజ వంశం నుండి.’ గ్రీకు పాఠ్యంలో అక్షరార్థంగా ‘రక్తాలు’ అనే అసాధారణ బహువచనం ఉంది; అది సహజ వంశాన్ని లేదా మానవ తల్లిదండ్రుల ద్వారా కలిగే జన్మను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: వారు
  rationale: ఇది ముందటి వచనంలో చెప్పబడిన వారిని తిరిగి సూచించే సంబంధ సర్వనామం. తెలుగు వాక్యనిర్మాణంలో సహజమైన అనుసంధానం కోసం ‘వారు’ అని అనువదించబడింది.
- source_word: ἐξ αἱμάτων
  choice: రక్తాల మూలంగా
  rationale: గ్రీకులో ‘రక్తాలు’ అనే అసాధారణ బహువచనం ఉంది; అది సహజ వంశం లేదా మానవ తల్లిదండ్రుల ద్వారా కలిగే జన్మను సూచిస్తుంది. ఆ అసాధారణ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, భావాన్ని పాదటిప్పణిలో వివరించాం.
- source_word: θελήματος
  choice: సంకల్పం
  rationale: మనుష్యుని చిత్తం, ఉద్దేశం లేదా కోరిక అనే భావపరిధిని ఇక్కడ ‘సంకల్పం’ గౌరవప్రదంగా తెలియజేస్తుంది; పునరుక్త నిర్మాణాన్ని కూడా నిలుపుతుంది.
- source_word: σαρκὸς
  choice: శరీరం
  rationale: ఇక్కడ ఇది సహజ మానవ జననానికి సంబంధించిన శారీరక ప్రేరణను సూచిస్తుంది. ‘శరీరం’ అనే పదం పాప స్వభావం వంటి వ్యాఖ్యానాన్ని అనవసరంగా చేర్చకుండా మూలరూపానికి సమీపంగా ఉంటుంది.
- source_word: ἀνδρὸς
  choice: పురుషుడు
  rationale: ఈ సందర్భంలో ఈ పదం ప్రత్యేకంగా వయోజన మగవాని లేదా జననంలో పురుషుని పాత్రను సూచించగలదు. అందువల్ల లింగభేదాన్ని చెరపకుండా ‘పురుషుడు’ అని అనువదించాం.
- source_word: ἐκ θεοῦ
  choice: దేవుని మూలంగా
  rationale: ముందున్న మూడు మానవ మూలాలను దేవునితో వ్యతిరేకంగా ఉంచే ἐκ అనే మూలార్థాన్ని తెలుగులో ఒకే నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ἐγεννήθησαν
  choice: జన్మించారు
  rationale: γεννάω క్రియ యొక్క భూతకాల కర్మణి భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘కనబడ్డారు’ లేదా ‘కనబరచబడ్డారు’ కంటే ఇది స్పష్టంగా, సులభంగా ఉంటుంది.
theological_decisions:
- issue: మానవ మూలానికి, దైవిక మూలానికి మధ్య వ్యత్యాసం
  choice: ఈ జన్మ సహజ వంశం, శారీరక ప్రేరణ లేదా పురుషుని సంకల్పం మూలంగా కాక దేవుని మూలంగా కలిగిందని పాఠ్యం చెబుతున్నట్లుగా అనువదించాం.
  alternative: దీనిని కేవలం జాతి వంశాన్ని నిరాకరించడంగా, లేదా తరువాతి సంప్రదాయాల్లోని నిర్దిష్ట సాక్రమెంటల్ లేదా తాత్త్విక భావంగా చదవవచ్చు.
  rationale: మూడు మానవ మూలాలను నిరాకరించి దేవుని మూలాన్ని ప్రతిపాదించే నిర్మాణాన్ని యథాతథంగా ఉంచాం; పునర్జన్మ గురించి ఏ ప్రత్యేక మతశాఖ సిద్ధాంతాన్నీ పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని మూడు సమాంతర పదబంధాలను ‘మూలంగా గానీ’ అనే పునరుక్తితో నిలిపాం. ‘రక్తాలు’ అనే ఉద్దేశపూర్వక అసాధారణతను పాదటిప్పణి సహాయంతో సంరక్షించాం.
