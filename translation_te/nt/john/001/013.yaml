    issue: ‘మూలంగా’ is used for ἐκ throughout the draft.
    rationale: Although understandable, it can suggest instrumentality or causation rather than the source/origin expressed by ἐκ. Replacing it with ‘నుండి’ strengthens source fidelity and makes the contrast with ‘దేవుని నుండి’ more direct.
