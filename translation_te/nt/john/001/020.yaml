id: JHN.1.20
reference: John 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: te
  text: అతడు ఒప్పుకున్నాడు, నిరాకరించలేదు; “నేను మెస్సీయను కాను” అని మళ్లీ ఒప్పుకున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను క్రీస్తును కాను.” గ్రీకు బిరుదు Χριστός (క్రిస్టోస్). ఇక్కడ అది మెస్సీయ సంబంధమైన బిరుదుగా వాడబడింది; అందుకే ప్రధాన పాఠ్యంలో “మెస్సీయ” అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: ఒప్పుకున్నాడు
  rationale: ఇక్కడ ὁμολογέω బహిరంగంగా, స్పష్టంగా అంగీకరించి ప్రకటించడాన్ని సూచిస్తుంది. గ్రీకులోని పునరుక్తిని తెలుగులోనూ ‘ఒప్పుకున్నాడు’ అనే పదాన్ని రెండుసార్లు వాడి నిలిపాం; రెండో సందర్భంలో ‘స్పష్టంగా’ చేర్చి దాని బహిరంగ, దృఢ స్వరాన్ని సహజంగా తెలిపాం.
- source_word: οὐκ ἠρνήσατο
  choice: నిరాకరించలేదు
  rationale: యోహాను రచనలో ἀρνέομαι యొక్క నేరుగా వచ్చే భావం ‘నిరాకరించు’. ‘ఒప్పుకున్నాడు; నిరాకరించలేదు’ అనే క్రమం మూలంలోని ఉద్ఘాటనను కాపాడుతుంది.
- source_word: καὶ ... καὶ ... καὶ
  choice: '...; ...లేదు. ... అని ...'
  rationale: వరుస καί పదాలు ఇచ్చే గంభీరమైన ఉద్ఘాటనను తెలుగులో యాంత్రికంగా ప్రతిచోటా ‘మరియు’ అని కాకుండా, చిన్న వాక్యాల క్రమం మరియు పునరుక్తి ద్వారా సహజంగా వ్యక్తం చేశాం.
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: నేను ... కాను
  rationale: స్పష్టంగా ఉన్న Ἐγώ కర్తను ‘నేను’గా ఉంచడం వల్ల ప్రత్యక్షమైన, ఉద్ఘాటిత నిరాకరణ నిలుస్తుంది; ‘నేనే ... కాదు’ అనడం తెలుగులో సందర్భానికి మించిన వ్యత్యాసార్థాన్ని కలిగించవచ్చు.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός వ్యక్తిపేరులా కాక, ఎదురుచూస్తున్న అభిషిక్తుని బిరుదుగా వాడబడింది. అందువల్ల యూదుల మెస్సీయ నిరీక్షణను స్పష్టపరిచే ‘మెస్సీయ’ను ఎంచుకున్నాం.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో బాప్తిస్మమిచ్చే యోహాను తానే ఎదురుచూస్తున్న అభిషిక్తుడు కాదని నిరాకరిస్తున్నాడు. కాబట్టి పేరులా వినిపించే ‘క్రీస్తు’ కంటే బిరుదు స్వభావాన్ని చూపే ‘మెస్సీయ’ ప్రధాన పాఠ్యంలో సరిపోతుంది; ప్రత్యామ్నాయ సాంప్రదాయ రూపాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని మూడుసార్ల καίను పదేపదే ‘మరియు’గా మార్చకుండా, వాక్య విభజన మరియు ‘ఒప్పుకున్నాడు’ పునరుక్తి ద్వారా దాని వాక్చాతుర్య ఉద్ఘాటనను నిలిపాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
