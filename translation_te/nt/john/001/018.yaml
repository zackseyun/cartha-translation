  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: te
  text: దేవుణ్ణి ఎవ్వరూ ఎన్నడూ చూడలేదు. తండ్రి వక్షస్థలంలో ఉన్న ఏకైక దేవుడు[a] ఆయనను తెలియజేశాడు.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘ఏకైక దేవుడు’కు బదులుగా ‘ఏకైక కుమారుడు’ (లేదా ‘ఏకైకంగా జనించిన కుమారుడు’) అని ఉంది.
    reason: textual_variant
  - marker: b
    text: ‘తండ్రి చెంత ఉన్న’ అని కూడా అనువదించవచ్చు. గ్రీకులో అక్షరార్థంగా ‘తండ్రి వక్షస్థలంలో ఉన్న’ అని ఉంది; ఇది అత్యంత సన్నిహితత్వాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘ఆయనను వివరించాడు’ లేదా ‘ఆయనను బయలుపరిచాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν οὐδεὶς ἑώρακεν πώποτε
  choice: దేవుణ్ణి ఎవ్వరూ ఎన్నడూ చూడలేదు
  rationale: నిరాకరణ యొక్క సార్వత్రికతను, πώποτε ఇచ్చే ‘ఎన్నడూ’ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: μονογενὴς θεὸς
  choice: ఏకైక దేవుడు
  rationale: SBLGNTలోని θεός పాఠాన్ని అనుసరిస్తూ, μονογενήςను సాధారణ పదార్థమైన ఏకైకుడు/సాటిలేనివాడు అనే భావంలో అనువదిస్తుంది; ‘కనిన’ అనే వ్యుత్పత్తి భావాన్ని అనవసరంగా చేర్చదు.
- source_word: ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς
  choice: తండ్రి రొమ్మున ఉన్న
  rationale: κόλποςలోని రొమ్ము/వక్షస్థలం రూపకాన్ని నిలుపుతూ, తండ్రితో అత్యంత సన్నిహిత సంబంధాన్ని సూచిస్తుంది.
- source_word: ἐκεῖνος ἐξηγήσατο
  choice: ఆయనను తెలియజేశాడు
  rationale: ἐξηγέομαιలోని వివరించడం, బయలుపరచడం, తెలియజేయడం అనే పరిధిలో సందర్భానుకూలమైన సహజ తెలుగు; కర్తపై ఉన్న గ్రీకు ఉద్ఘాటనను ‘దేవుడే’ ద్వారా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: μονογενὴς θεὸς మరియు ὁ μονογενὴς υἱός మధ్య పాఠాంతరం
  choice: ప్రధాన పాఠంలో SBLGNT ప్రకారం ‘ఏకైక దేవుడు’
  alternative: ‘ఏకైక కుమారుడు’ లేదా ‘ఏకైకంగా జనించిన కుమారుడు’
  rationale: ఇచ్చిన మూలపాఠాన్ని ప్రధాన వాక్యంలో అనుసరించి, ముఖ్యమైన క్రీస్తుసంబంధ పాఠాంతరాన్ని పాదసూచికలో పారదర్శకంగా ఉంచుతుంది.
- issue: μονογενής పదార్థం
  choice: ఏకైక
  alternative: ఏకైకంగా జనించిన
  rationale: యోహాను సందర్భంలో ప్రత్యేకత/సాటిలేనితనాన్ని ప్రధానంగా వ్యక్తం చేస్తుంది; ‘జనించిన’ అనే భావాన్ని పదంలోనే నిర్ణయాత్మకంగా చేర్చకుండా నిజమైన వ్యాఖ్యాన ఉద్రిక్తతను కాపాడుతుంది.
- issue: κόλπος రూపకం
  choice: తండ్రి రొమ్మున
  alternative: తండ్రి చెంత
  rationale: సన్నిహితత్వాన్ని తెలియజేసే మూల రూపకాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; మరింత భావానువాదమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని రూపకం మరియు ప్రధాన పాఠాంతర ఉద్రిక్తత రెండూ నిలుపబడ్డాయి. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
