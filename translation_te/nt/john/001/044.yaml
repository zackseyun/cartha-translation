translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘వాడు’ ఇక్కడ అవమానార్థకం కాదు; వ్యక్తి స్వస్థలాన్ని తెలిపే సహజ నామవాచక ప్రయోగం. ప్రధాన వాక్యంలో గ్రీకు పునరుక్త నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం రెండు ఉపవాక్యాలుగా సహజీకరించాం.
