translation:
  language: te
  text: ఫిలిప్పు బేత్సయిదా[a] నుండి వచ్చినవాడు; బేత్సయిదా అంద్రెయ, పేతురుల ఊరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బేత్సయిదా నుండి వచ్చినవాడు; బేత్సయిదా అంద్రెయ, పేతురుల పట్టణం.”
    reason: పునరుక్తమైన మూలసూచక ప్రయోగాన్ని మరియు πόλις‌కు “పట్టణం” అనే పదానుసార ప్రత్యామ్నాయాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: ἦν
  choice: వాడు
  rationale: ఇక్కడ εἰμί యొక్క భూతకాల రూపం ఫిలిప్పు ఏ ఊరివాడో తెలియజేస్తుంది. తెలుగులో ‘బేత్సయిదా వాడు’ అనే ప్రయోగం సహజంగా ఈ గతస్థితిని వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది; ఈ వాక్యంలో తెలుగులో దాన్ని విడిగా ‘అయితే’ లేదా ‘ఇక’ అని చేరిస్తే మూలంలో లేని వ్యత్యాసం లేదా బలమైన మార్పు వినిపించవచ్చు. సందర్భ క్రమమే అనుసంధానాన్ని తెలియజేస్తుంది.
- source_word: Φίλιππος
  choice: ఫిలిప్పు
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: ἀπὸ Βηθσαϊδά
  choice: బేత్సయిదా వాడు
  rationale: ἀπό మూలం లేదా స్వస్థలాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఒక వ్యక్తి స్వస్థలాన్ని చెప్పడానికి ‘[స్థలం] వాడు’ సహజమైన, సంక్షిప్తమైన రూపం.
- source_word: ἐκ τῆς πόλεως
  choice: ఊరు
  rationale: πόλις పట్టణం లేదా ఊరును సూచించగలదు. ఇక్కడ ముందే చెప్పిన బేత్సయిదాను అంద్రెయ, పేతురుల స్వస్థలంగా గుర్తించడం ప్రధాన భావం; ‘ఊరు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: అంద్రెయ, పేతురు ఊరు
  rationale: సంబంధార్థక రూపాలు ఆ పట్టణం వారిద్దరి స్వస్థలమని సూచిస్తున్నాయి. తెలుగు వాక్య నిర్మాణంలో ఈ సంబంధాన్ని సహజంగా వ్యక్తం చేశాం.
