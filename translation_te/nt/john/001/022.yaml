  naturalness: The revised wording is natural modern standard Telugu and retains the sequence of two direct questions followed by their stated purpose.
  terminology: “జవాబు ఇవ్వడానికి” accurately conveys “to give an answer”; no specialized theological terminology occurs in this verse.
