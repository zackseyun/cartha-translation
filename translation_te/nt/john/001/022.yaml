id: JHN.1.22
reference: John 1:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: te
  text: కాబట్టి వారు అతనితో, “నీవు ఎవరు? మమ్మల్ని పంపినవారికి మేము జవాబు ఇవ్వడానికి, నీ గురించి నీవు ఏమి చెబుతున్నావు?” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: మునుపటి సంభాషణకు కొనసాగింపును సూచిస్తుంది; ఈ సందర్భంలో సహజమైన తెలుగు అనుసంధానం.
- source_word: Τίς εἶ;
  choice: నీవెవరివో చెప్పు
  rationale: గ్రీకులోని ప్రత్యక్ష గుర్తింపు ప్రశ్నను, తరువాతి ఉద్దేశ్య వాక్యంతో సహజంగా కలిసే ఆధునిక తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἵνα ἀπόκρισιν δῶμεν
  choice: మేము జవాబు చెప్పేలా
  rationale: ἵνα యొక్క ఉద్దేశ్య భావాన్ని, ‘జవాబు ఇవ్వడం/చెప్పడం’ అనే సహజ తెలుగు ప్రయోగంతో నిలుపుతుంది.
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: మమ్మల్ని పంపినవారికి
  rationale: కర్తార్థక విశేషణ రూపాన్ని స్పష్టమైన సంబంధ వాక్యంగా అనువదిస్తుంది.
- source_word: τί λέγεις περὶ σεαυτοῦ;
  choice: నీ గురించి నీవు ఏమి చెబుతున్నావు?
  rationale: περί యొక్క ‘గురించి’ భావాన్ని, σεαυτοῦ యొక్క ఆత్మవాచక బలాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సూటిగా అర్థమయ్యే సంభాషణ శైలి. అయితే ప్రధాన పాఠ్యంలో ‘నిన్ను పంపినవారికి’ అన్నది లిఖితపరమైన పొరపాటు; మూలార్థానికి సరైన రూపం ‘మమ్మల్ని పంపినవారికి’.
