    rationale: τοῖς πέμψασιν ἡμᾶς means “to those who sent us,” not “those who sent you.”
  - severity: medium
    issue: The direct identity question is changed into “నీవెవరివో చెప్పు.”
    rationale: Τίς εἶ; is an independent, terse question, “Who are you?” The draft adds an imperative/request and obscures the Greek clause structure.
