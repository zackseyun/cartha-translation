id: JHN.1.17
reference: John 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: te
  text: ఎందుకంటే ధర్మశాస్త్రం మోషే ద్వారా ఇవ్వబడింది; కృప మరియు సత్యం యేసు మెస్సీయ[a] ద్వారా వచ్చాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సంప్రదాయంగా: “యేసు క్రీస్తు.”'
    reason: Χριστόςకు సుపరిచితమైన సంప్రదాయ లిప్యంతరీకరణను ప్రత్యామ్నాయంగా నమోదు చేయడం.
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి వివరణాత్మక కారణాన్ని పరిచయం చేసే సంధానార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ νόμος
  choice: ధర్మశాస్త్రం
  rationale: మోషేకు సంబంధించిన నిబంధనా బోధనల సమాహారాన్ని సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: διὰ Μωϋσέως
  choice: మోషే ద్వారా
  rationale: διά + సంబంధ విభక్తి తెలిపే మధ్యవర్తిత్వాన్ని నిలుపుతూ, యేసు మెస్సీయ ద్వారా అనే సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: ἐδόθη
  choice: ఇవ్వబడింది
  rationale: దైవిక కర్తను వాక్యంలో అదనంగా చేర్చకుండా గ్రీకు కర్మణి రూపాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἡ χάρις
  choice: కృప
  rationale: యోహాను సందర్భంలోని దేవుని అనుగ్రహభరితమైన దయ అనే సమృద్ధమైన భావాన్ని మోసే, తెలుగు క్రైస్తవ వాడుకలో సుపరిచితమైన పదం.
- source_word: ἡ ἀλήθεια
  choice: సత్యం
  rationale: యోహాను 1:14తో ఉన్న ప్రతిధ్వనిని, నిజం మరియు వెల్లడైన వాస్తవం అనే భావాలను సహజంగా నిలుపుతుంది.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ ద్వారా
  rationale: మధ్యవర్తిత్వాన్ని తెలిపే διάను ‘ద్వారా’గా ఉంచి, Χριστόςను ఇక్కడ బిరుదుగా అర్థానువాదం చేస్తుంది.
- source_word: ἐγένετο
  choice: వచ్చాయి
  rationale: ధర్మశాస్త్రం ‘ఇవ్వబడింది’ అన్న దానితో ఉన్న ఉద్దేశపూర్వక భేదాన్ని కాపాడుతూ, కృప మరియు సత్యం చారిత్రకంగా ప్రత్యక్షమైన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦలో Χριστοῦ అనువాదం
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: Χριστός ఇక్కడ మెస్సీయ బిరుదును సూచిస్తుంది; అందువల్ల దాని అర్థాన్ని స్పష్టంగా తెలియజేసే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో ఉంచి, సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ధర్మశాస్త్రం మరియు కృప–సత్యం మధ్య సంబంధం
  choice: సమాంతర మధ్యవర్తిత్వ వాక్యనిర్మాణం; వ్యతిరేకతను అదనంగా తీవ్రం చేయలేదు
  alternative: ‘కాని’ లేదా ధర్మశాస్త్రానికి ప్రతికూల విలువను చేర్చడం
  rationale: గ్రీకు పాఠ్యంలో రెండు ఉపవాక్యాలు సమాంతరంగా ఉన్నాయి; స్పష్టమైన ప్రతికూల సంధాయకం లేదు. కాబట్టి వేదాంతపరమైన వ్యతిరేకతను అనువాదంలో జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గాంభీర్యాన్ని నిలుపుతూ ‘ధర్మశాస్త్రం,’ ‘కృప,’ ‘సత్యం’ వంటి స్థిరమైన బైబిలు పదాలను ఉపయోగించాం. రెండు గ్రీకు ఉపవాక్యాల సమాంతరతను ‘ద్వారా’ అనే పునరుక్తితో కాపాడాం.
