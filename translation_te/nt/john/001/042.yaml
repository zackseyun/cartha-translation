id: JHN.1.42
reference: John 1:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: te
  text: అతడు సీమోనును యేసు వద్దకు తీసుకొచ్చాడు. యేసు అతనిని తదేకంగా చూసి, “నీవు యోహాను[a] కుమారుడైన సీమోను. నీవు కేఫా అని పిలువబడతావు” అన్నాడు. (కేఫా అనే పేరును పేతురు[b] అని అనువదిస్తారు.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘యోహాను’కు బదులుగా ‘యోనా’ అని ఉంది; SBLGNT పాఠంలో ‘యోహాను’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: ‘కేఫా’ అనేది ‘పేతురు’కు సమానమైన సెమిటిక్ పేరు; ఈ రెండు పేర్లకూ ‘బండ’ లేదా ‘రాయి’ అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: అతడు సీమోనును యేసు దగ్గరకు తీసుకొచ్చాడు
  rationale: ἄγω యొక్క సందర్భార్థం ఒక వ్యక్తిని మరొకరి దగ్గరకు తీసుకురావడం. తెలుగు వాక్యంలో సర్వనామ సందిగ్ధత తగ్గేందుకు ముందరి సందర్భంలోని వ్యక్తిని ‘సీమోను’ అని స్పష్టం చేశాం.
- source_word: ἐμβλέψας αὐτῷ
  choice: అతనివైపు తదేకంగా చూసి
  rationale: ἐμβλέπω సాధారణంగా చూడడంకన్నా శ్రద్ధగా, నిలకడగా చూడడాన్ని సూచిస్తుంది; ‘తదేకంగా చూసి’ ఆ తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Σὺ εἶ Σίμων ὁ υἱὸς Ἰωάννου
  choice: నీవు యోహాను కుమారుడైన సీమోనువు
  rationale: మూలంలోని ప్రత్యక్ష సంబోధనను, వ్యక్తి పేరు మరియు తండ్రి పేరుతో కూడిన గుర్తింపును నిలుపుతుంది. SBLGNT పాఠంలోని Ἰωάννουను ‘యోహాను’గా అనుసరించాం.
- source_word: σὺ κληθήσῃ Κηφᾶς
  choice: నీవు కేఫా అని పిలువబడతావు
  rationale: భవిష్యత్ కర్మణి రూపమైన κληθήσῃను నేరుగా ప్రతిబింబిస్తూ, కొత్త పేరుతో పిలవబడే భావాన్ని నిలుపుతుంది.
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: కేఫా అనే పేరును పేతురు అని అనువదిస్తారు
  rationale: మూలంలోని వివరణాత్మక కుండలీకరణను నిలుపుతూ, సెమిటిక్ పేరుకు గ్రీకు సమానరూపమైన Πέτροςను తెలుగులో ప్రాచుర్యమైన వ్యక్తినామం ‘పేతురు’గా లిప్యంతరీకరించాం.
theological_decisions:
- issue: కేఫా/పేతురు పేర్ల వివరణ
  choice: ప్రధాన పాఠంలో రెండింటినీ వ్యక్తినామాలుగా ‘కేఫా’, ‘పేతురు’ అని ఉంచడం
  alternative: రెండింటి అర్థాన్ని ‘బండ’ లేదా ‘రాయి’ అని ప్రధాన పాఠంలో అనువదించడం
  rationale: వాక్యం పేరు పెట్టే కార్యాన్ని ప్రధానంగా చూపుతుంది; గ్రీకు పాఠం సెమిటిక్ పేరుకు గ్రీకు పేరును వివరణగా ఇస్తుంది. కాబట్టి పేర్లను లిప్యంతరీకరించి, వాటి పదార్థాన్ని పాదసూచికలో తెలియజేయడం ద్వారా తరువాతి వేదాంత నిర్ధారణలను ప్రధాన పాఠంలోకి తీసుకురాకుండా మూలంలోని పదప్రయోగాన్ని సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘తదేకంగా’ మూలంలోని దృష్టి తీవ్రతను తెలియజేస్తుంది; ‘పిలువబడతావు’ భవిష్యత్ కర్మణి భావాన్ని నిలుపుతుంది. పాదసూచిక గుర్తులు సంబంధిత పదాలైన ‘యోహాను’ మరియు ‘పేతురు’ వెంట ఉంచబడ్డాయి.
