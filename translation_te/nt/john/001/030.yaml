id: JHN.1.30
reference: John 1:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ⸀ὑπὲρ οὗ ἐγὼ εἶπον· Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: te
  text: “‘నా తర్వాత ఒక మనిషి వస్తున్నాడు. ఆయన నాకంటే ముందువాడయ్యాడు[a], ఎందుకంటే ఆయన నాకంటే ముందే ఉన్నాడు[b]’ అని నేను ఎవరి గురించి చెప్పానో, ఆయన ఈయనే.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకంటే ప్రాముఖ్యమైనవాడయ్యాడు.” గ్రీకు పదబంధం కేవలం కాలక్రమాన్ని మాత్రమే కాక, ప్రాధాన్యాన్ని లేదా ఉన్నత స్థానాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయన నాకంటే ముందే ఉనికిలో ఉన్నాడు.” ఈ మాటలు యేసు పూర్వ ఉనికిని సూచించే అవకాశం బలంగా ఉంది; అయితే గ్రీకు మూలం సంక్షిప్తంగా “ఆయన నాకంటే ముందే ఉన్నాడు” అని చెబుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: ఆయనే ఈయన
  rationale: సూచక సర్వనామంతో కూడిన గుర్తింపును నొక్కిచెబుతుంది; యోహాను తన ఎదుట ఉన్న వ్యక్తిని స్పష్టంగా గుర్తిస్తున్న భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὑπὲρ οὗ ἐγὼ εἶπον
  choice: నేను ఎవరి గురించి చెప్పానో
  rationale: εἶπον తర్వాత ὑπὲρ οὗ ఇక్కడ ‘ఎవరి గురించి’ అనే సూచనార్థంలో ఉంది; తెలుగు సంబంధవాచక నిర్మాణం గ్రీకు వాక్య సంబంధాన్ని సహజంగా అందిస్తుంది.
- source_word: Ὀπίσω μου ἔρχεται
  choice: నా తర్వాత ... వస్తున్నాడు
  rationale: ఇక్కడ ὀπίσω కాలక్రమాన్ని సూచిస్తుంది; ‘నా వెనుక’ అనే స్థలార్థపు అపార్థాన్ని నివారిస్తూ, యోహాను తర్వాత ప్రత్యక్షమవుతున్న భావాన్ని తెలియజేస్తుంది.
- source_word: ἀνὴρ
  choice: ఒక మనిషి
  rationale: పురుషుణ్ణి సూచించే ఏకవచన నామవాచకాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అనువదిస్తుంది.
- source_word: ἔμπροσθέν μου γέγονεν
  choice: నాకంటే ముందువాడయ్యాడు
  rationale: γέγονεν యొక్క సంపూర్ణ క్రియాభావాన్నీ, ἔμπροσθεν‌లోని ముందుండటం లేదా ప్రాధాన్యం అనే అర్థ విస్తృతినీ సంక్షిప్తంగా నిలుపుతుంది; ‘ఉన్నతుడు’ అని మాత్రమే చెప్పి భావాన్ని ఒక వైపుకు పరిమితం చేయదు.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని తెలిపే సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πρῶτός μου ἦν
  choice: ఆయన నాకంటే ముందే ఉన్నాడు
  rationale: కాలపూర్వత్వం మరియు ప్రాధాన్యం మధ్య ఉన్న సంక్షిప్త భావ ఉద్వేగాన్ని నిలుపుతుంది; ‘ఉనికిలో ఉన్నాడు’ అని ప్రధాన పాఠంలో విస్తరించి వ్యాఖ్యానించదు.
theological_decisions:
- issue: చివరి ఉపవాక్యం క్రీస్తు పూర్వ ఉనికిని ఎంత స్పష్టంగా చెప్పాలి
  choice: ఆయన నాకంటే ముందే ఉన్నాడు
  alternative: ఆయన నాకంటే ముందే ఉనికిలో ఉన్నాడు
  rationale: యోహాను సువార్త సందర్భంలో ఇది యేసు పూర్వ ఉనికిని బలంగా సూచించినప్పటికీ, గ్రీకు వాక్యం సంక్షిప్తంగా ఉంది. ప్రధాన పాఠం కాలపూర్వత్వం మరియు ఉన్నతత్వం మధ్య ఉన్న భావ ఉద్వేగాన్ని కాపాడుతుంది; మరింత స్పష్టమైన పూర్వ ఉనికి పఠనాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ἔμπροσθέν μου γέγονεν‌ను కాలక్రమమా లేక హోదా ప్రాధాన్యమా అని నిర్ణయించడం
  choice: నాకంటే ముందువాడయ్యాడు
  alternative: నాకంటే ప్రాముఖ్యమైనవాడయ్యాడు
  rationale: మూల పదబంధం ముందుండటం, ప్రాధాన్యం లేదా ఉన్నత స్థానం అనే భావాలను మోయగలదు. ప్రధాన అనువాదం ఈ అస్పష్టతను సాధ్యమైనంతవరకు నిలుపుతుంది; హోదా ప్రాధాన్యాన్ని ప్రత్యామ్నాయంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గంభీరమైన సాక్ష్య ప్రకటన శైలిని ఉపయోగించాం. మూలంలోని పునరుక్త ‘ముందు’ భావాన్ని తొలగించకుండా ఉంచాం, ఎందుకంటే మొదటి పదబంధం ప్రాధాన్యాన్ని కూడా, చివరి పదబంధం కాలపూర్వత్వాన్ని కూడా సూచించే ఉద్దేశపూర్వక భావ ఉద్వేగాన్ని కలిగి ఉంది.
