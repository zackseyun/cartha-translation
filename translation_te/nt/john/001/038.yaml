revisions:
- from: అప్పుడు యేసు వెనక్కి తిరిగి, వారు తనను వెంబడిస్తూ ఉండడం చూసి, “మీరు దేనిని వెదుకుతున్నారు?” అని వారిని అడిగాడు. వారు ఆయనతో, “రబ్బీ” (అనువదిస్తే, “బోధకుడా” అని అర్థం)[a], “మీరు ఎక్కడ బస చేస్తున్నారు?”[b] అన్నారు.
  to: 'అప్పుడు యేసు తిరిగి, వారు తనను అనుసరిస్తుండటం చూసి వారితో ఇలా అన్నాడు: “మీరు ఏమి వెదుకుతున్నారు?” వారు ఆయనతో, “రబ్బీ” (అనువదిస్తే, “బోధకుడు”), “మీరు ఎక్కడ బస చేస్తున్నారు?” అన్నారు.'
