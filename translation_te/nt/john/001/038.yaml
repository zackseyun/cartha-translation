id: JHN.1.38
reference: John 1:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: te
  text: 'అప్పుడు యేసు తిరిగి, వారు తనను అనుసరిస్తుండటం చూసి వారితో ఇలా అన్నాడు: “మీరు ఏమి వెదుకుతున్నారు?” వారు ఆయనతో, “రబ్బీ” (అనువదిస్తే, “బోధకుడు”), “మీరు ఎక్కడ బస చేస్తున్నారు?” అన్నారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: వెనక్కి తిరిగి
  rationale: యేసు తన వెనుక వస్తున్నవారి వైపు తిరిగిన సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కదలికను అనవసరంగా విస్తరించదు.
- source_word: θεασάμενος
  choice: చూసి
  rationale: దృష్టితో గమనించడాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀκολουθοῦντας
  choice: తనను వెంబడిస్తూ ఉండడం
  rationale: కొనసాగుతున్న భౌతిక అనుసరణను తెలుపుతూ, యోహాను సందర్భంలో కలగగల శిష్యత్వపు అంతరార్థాన్ని నిరోధించదు.
- source_word: Τί ζητεῖτε;
  choice: మీరు దేనిని వెదుకుతున్నారు?
  rationale: ζητέωలోని సాధారణ వెదకడం మరియు లోతైన అన్వేషణ అనే సంభావ్య ద్వంద్వార్థాన్ని నిలుపుతుంది.
- source_word: Ῥαββί
  choice: రబ్బీ
  rationale: మూలంలోని యూదా సంబోధనను లిప్యంతరీకరించి ఉంచుతుంది; వాక్యమే వెంటనే దాని అర్థాన్ని వివరిస్తుంది.
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: అనువదిస్తే, “బోధకుడా” అని అర్థం
  rationale: రబ్బీ అనే సంబోధనకు మూలపాఠం ఇచ్చే వివరణను సహజమైన తెలుగులోనూ, సంబోధనా రూపంతోనూ అందిస్తుంది.
- source_word: ποῦ μένεις;
  choice: మీరు ఎక్కడ బస చేస్తున్నారు?
  rationale: తక్షణ సందర్భంలో μένω వసతి లేదా తాత్కాలిక నివాసాన్ని సూచిస్తుంది; ‘బస చేస్తున్నారు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
theological_decisions:
- issue: యోహానులో తరువాత వేదాంతపరమైన ప్రాధాన్యం పొందే μένω క్రియను ఈ తొలి సందర్భంలో అనువదించడం
  choice: మీరు ఎక్కడ బస చేస్తున్నారు?
  alternative: మీరు ఎక్కడ నిలిచి ఉంటున్నారు? / ఎక్కడ నివసిస్తున్నారు?
  rationale: ఇక్కడ శిష్యులు యేసు ఎక్కడ ఉంటున్నాడని ఆచరణాత్మకంగా అడుగుతున్నారు. తరువాతి ‘నిలిచి ఉండడం’ భావాన్ని ముందుగానే బలవంతంగా మోపకుండా, మూలక్రియ సంబంధాన్ని పాదసూచికలో సూచించాం.
- issue: ζητέωలో ఉండగల యోహాను శైలికి చెందిన ద్వంద్వార్థం
  choice: మీరు దేనిని వెదుకుతున్నారు?
  alternative: మీరు దేని కోసం చూస్తున్నారు?
  rationale: ‘వెదుకుతున్నారు’ అనే రూపం సాధారణ అన్వేషణతో పాటు లోతైన ఆధ్యాత్మిక అన్వేషణ సంభావ్యతను కూడా తెరిచి ఉంచుతుంది; ఏ అర్థాన్నీ ఖచ్చితంగా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవార్థక సంబోధనను ఉపయోగించి, కథనాన్ని సహజంగా ఉంచాం. ‘వెదుకుతున్నారు’ ద్వారా మూలంలోని సంభావ్య అంతరార్థాన్ని నిలిపి, ‘బస చేస్తున్నారు’ ద్వారా తక్షణ సందర్భాన్ని స్పష్టంగా తెలిపాం.
