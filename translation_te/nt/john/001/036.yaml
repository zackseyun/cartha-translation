  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: te
  text: నడుస్తున్న యేసువైపు తదేకంగా చూస్తూ, “చూడండి, దేవుని గొర్రెపిల్ల!” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: తదేకంగా చూస్తూ
  rationale: సాధారణంగా చూడడం కంటే శ్రద్ధగా, నిశితంగా చూడడం అనే క్రియలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: περιπατοῦντι
  choice: నడుస్తున్న
  rationale: యేసు ఆ సమయంలో నడుస్తున్నాడనే వర్తమాన కృదంత భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: λέγει
  choice: అని అన్నాడు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు కథనశైలికి సహజమైన భూతకాలంలో వ్యక్తపరుస్తుంది.
- source_word: Ἴδε
  choice: చూడండి
  rationale: ఎవరినో దృష్టితో గమనించమని పిలిచే ఆజ్ఞార్థక ఉద్ఘాటనను సాధారణ, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: దేవుని గొర్రెపిల్ల
  rationale: యోహాను సువార్తలోని ప్రధాన బిరుదును పదసంబంధం మరియు రూపకాన్ని కాపాడుతూ అనువదిస్తుంది.
theological_decisions:
- issue: τοῦ θεοῦ అనే షష్ఠీ విభక్తి సంబంధం
  choice: దేవుని గొర్రెపిల్ల
  alternative: దేవుడు అనుగ్రహించిన గొర్రెపిల్ల
  rationale: మూలంలోని సంక్షిప్తమైన, భావసంపన్నమైన సంబంధాన్ని వివరించి పరిమితం చేయకుండా అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి. మూలంలోని దృష్టి కేంద్రీకరణను ‘తదేకంగా’ ద్వారా నిలిపి, ఉద్ఘాటనను సహజమైన ‘చూడండి’తో వ్యక్తపరచింది.
