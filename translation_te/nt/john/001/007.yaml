  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: te
  text: ఇతడు సాక్షిగా వచ్చాడు—ఆ వెలుగు గురించి సాక్ష్యమివ్వడానికి, అందరూ అతని ద్వారా విశ్వసించేందుకు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అతని ద్వారా” అనేది సందర్భంలో సాక్షియైన యోహాను ద్వారా—అంటే అతని సాక్ష్యం ద్వారా—అనే భావాన్ని ఎక్కువగా సూచిస్తుంది. కొందరు దీన్ని ఆ వెలుగు ద్వారా అని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: ఇతడు
  rationale: ఈ సూచన సర్వనామం మునుపటి వచనంలో పరిచయమైన యోహానును స్పష్టంగా తిరిగి సూచిస్తుంది; ‘ఇతడు’ దాని సూచనాత్మక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἦλθεν εἰς μαρτυρίαν
  choice: సాక్షిగా వచ్చాడు
  rationale: ఈ సందర్భంలో యోహాను వచ్చిన ఉద్దేశాన్నీ, అతని సాక్షి పాత్రనూ సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα μαρτυρήσῃ περὶ τοῦ φωτός
  choice: ఆ వెలుగు గురించి సాక్ష్యమివ్వడానికి
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని ‘డానికి’ రూపంతోనూ, μαρτυρέω యొక్క సాక్ష్యార్థాన్ని ‘సాక్ష్యమివ్వడం’తోనూ నిలుపుతుంది. నిర్దిష్ట ఉపపదాన్ని ‘ఆ’తో వ్యక్తం చేసింది.
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: అందరూ విశ్వసించేలా చేయడానికి
  rationale: రెండవ ఉద్దేశ వాక్యాన్ని స్పష్టంగా ఉంచుతూ, πάντες యొక్క విస్తృత అర్థాన్ని ‘అందరూ’తో, πιστεύωను ‘విశ్వసించు’తో అందిస్తుంది.
- source_word: δι’ αὐτοῦ
  choice: అతని ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధనత్వాన్ని ‘ద్వారా’ సహజంగా వ్యక్తం చేస్తుంది; సర్వనామం ఎవరిని సూచిస్తుందో ప్రధాన పాఠంలో బలవంతంగా నిర్ధారించదు.
theological_decisions:
- issue: δι’ αὐτοῦలోని ‘అతని’ ఎవరిని సూచిస్తుంది?
  choice: ప్రధానంగా సాక్షియైన యోహానును సూచించేలా పాఠాన్ని ఉంచడం
  alternative: ‘అతని’ ఆ వెలుగును, అంటే మెస్సీయను, సూచిస్తుంది
  rationale: వాక్యానికి కర్త యోహానే; తరువాతి వచనం కూడా యోహానును వెలుగు నుండి వేరు చేస్తుంది. అయినా గ్రీకు సర్వనామ రూపం మాత్రమే ఈ సూచనను పూర్తిగా నిర్ణయించదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే సాక్ష్యానికి సంబంధించిన గంభీరమైన భావాన్ని నిలుపుతూ రూపొందించబడింది. రెండు ἵνα ఉద్దేశ వాక్యాలను సమాంతర ‘డానికి’ నిర్మాణాలతో కాపాడాం.
