id: JHN.8.57
reference: John 8:57
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: te
  text: కాబట్టి యూదులు[a] ఆయనతో, “నీకు ఇంకా యాభై ఏళ్లు కూడా లేవు; నువ్వు అబ్రాహామును చూశావా?” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయవారు”; సందర్భాన్ని బట్టి, “యూదు నాయకులు” అని కూడా అర్థం కావచ్చు.
    reason: οἱ Ἰουδαῖοι అనే పదబంధం యోహాను సువార్తలో సందర్భాన్ని బట్టి విస్తృత యూదు సమూహాన్ని, యూదయవారిని, లేదా యూదు అధికారులను సూచించగలదు.
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదబంధానికి నేరమైన, సాధారణ తెలుగు రూపం. ఈ సందర్భంలో నాయకులను మాత్రమే సూచిస్తుందని మూలపాఠం స్పష్టంగా పరిమితం చేయదు; సందర్భానుసారమైన ఇతర అవకాశాలను పాదటిప్పణిలో ఉంచాం.
- source_word: οὖν
  choice: అప్పుడు
  rationale: ముందటి మాటకు ప్రతిస్పందనగా కథనం కొనసాగుతున్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘కాబట్టి’ కూడా సాధ్యమే గాని ఇక్కడ సంభాషణాత్మక క్రమానికి ‘అప్పుడు’ సులభంగా సరిపోతుంది.
- source_word: Πεντήκοντα ἔτη οὔπω ἔχεις
  choice: నీకు ఇంకా యాభై ఏళ్లు కూడా లేవు
  rationale: వయస్సును సంవత్సరాలు ‘కలిగి ఉండడం’గా చెప్పే గ్రీకు నుడికారాన్ని సహజమైన తెలుగు వయస్సు ప్రయోగంతో అందిస్తుంది. ‘కూడా’ వారి ఆశ్చర్యం, అపనమ్మకాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἑώρακας
  choice: చూశావా
  rationale: ὁράω యొక్క పరిపూర్ణకాల రూపం. తెలుగులో ఈ సందర్భంలో సాధారణ భూతకాల ప్రశ్న సహజంగా ఉండి, గతంలో చూసిన అనుభవం ఉందా అనే భావాన్ని తెలియజేస్తుంది.
- source_word: καὶ
  choice: ;
  rationale: గ్రీకులోని కలుపు పదం ఇక్కడ రెండు వాక్యభాగాల మధ్య ఆశ్చర్యభరితమైన విరుద్ధతను కలుపుతుంది. తెలుగులో అక్షరార్థంగా ‘మరి/మరియు’ చేర్చడం కంటే అర్ధవిరామంతో అనుసంధానం సహజంగా ఉంది.
- source_word: Ἀβραὰμ
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions:
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι పదబంధం
  choice: యూదులు
  alternative: యూదయవారు; యూదు నాయకులు
  rationale: మూలపాఠం ఇక్కడ విస్తృతమైన సమూహపదాన్నే వాడుతుంది; నాయకులకు మాత్రమే పరిమితం చేయడం వ్యాఖ్యానాత్మకం అవుతుంది. అయితే యోహానులో సందర్భాన్ని బట్టి భౌగోళిక లేదా నాయకత్వ సూచన ఉండగలదనే అస్పష్టతను పాదటిప్పణి కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ప్రత్యక్ష సంభాషణలో వారి ఆశ్చర్యం, అపనమ్మకం స్పష్టంగా వినిపించేలా సాధారణ వయస్సు నుడికారాన్ని ఉపయోగించాం; మూలంలోని సందర్భసున్నిత సమూహపదాన్ని పాదటిప్పణితో పారదర్శకంగా ఉంచాం.
