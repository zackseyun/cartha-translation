- from: అప్పుడు యేసు[a] నిటారుగా లేచి, ఆ స్త్రీ తప్ప మరెవరూ కనిపించకపోవడంతో ఆమెతో, “అమ్మా, నిన్ను నిందించినవారు ఎక్కడ ఉన్నారు? ఎవరూ నీకు శిక్ష విధించలేదా?” అని అడిగాడు.
  to: అప్పుడు యేసు[a] నిటారుగా లేచి, ఆ స్త్రీ తప్ప మరెవరినీ చూడక ఆమెతో, “అమ్మా, నీ మీద నేరారోపణ చేసిన ఆ మనుష్యులు ఎక్కడ ఉన్నారు? ఎవరూ నిన్ను దోషిగా తీర్పు చెప్పలేదా?” అని అడిగాడు.
  rationale: The revision explicitly identifies Jesus as the one who sees no one but the woman, renders the accusers with appropriate legal nuance, and replaces the added idea of imposing punishment with the source's sense of condemnation/guilty judgment. The disputed-passage footnote and its anchor are retained unchanged.
