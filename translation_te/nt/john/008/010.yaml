    reason: textual_critical
  revision_rationale: The revision explicitly identifies Jesus as the one who sees no one but the woman, renders the accusers with appropriate legal nuance, and replaces the added idea of imposing punishment with the source's sense of condemnation/guilty judgment. The disputed-passage footnote and its anchor are retained unchanged.
