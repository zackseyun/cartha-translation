translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంభాషణ సహజంగా, గౌరవప్రదంగా ఉంది. మూలంలోని రెండు ప్రశ్నలు అలాగే ఉంచబడ్డాయి. పాఠ్య విమర్శకు సంబంధించిన [a] గుర్తు ప్రధాన వాక్యంలో ‘యేసు’ తర్వాత ఉంచబడింది.
