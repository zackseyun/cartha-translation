source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἀνακύψας δὲ ὁ Ἰησοῦς, καὶ μηδένα θεασάμενος πλὴν τῆς γυναικός, εἶπεν αὐτῇ, Ἡ γυνή, ποῦ εἰσιν ἐκεῖνοι οἱ κατήγοροί σου; Οὐδείς σε κατέκρινεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: te
  text: అప్పుడు యేసు[a] నిటారుగా లేచి, ఆ స్త్రీ తప్ప మరెవరినీ చూడక ఆమెతో, “అమ్మా, నీ మీద నేరారోపణ చేసిన ఆ మనుష్యులు ఎక్కడ ఉన్నారు? ఎవరూ నిన్ను దోషిగా తీర్పు చెప్పలేదా?” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం వ్యభిచారంలో పట్టుబడిన స్త్రీ కథలో భాగం (యోహాను 7:53–8:11). ఈ కథ అత్యంత ప్రాచీన గ్రీకు ప్రతుల్లో లేదు. యోహాను 7:53లోని గమనిక చూడండి.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: నిటారుగా లేచి
  rationale: ముందు వంగి నేలపై రాస్తున్న యేసు తన శరీరాన్ని తిరిగి పైకెత్తిన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం నిలబడటం లేదా పైకి చూడటం అని అతిగా నిర్దిష్టం చేయదు.
- source_word: θεασάμενος
  choice: కనిపించకపోవడంతో
  rationale: μηδένα...πλὴν τῆς γυναικός అనే నిర్మాణంతో కలిసి, ఆ స్త్రీ తప్ప మరెవరినీ యేసు చూడలేదనే దృశ్య గ్రహణాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κατήγοροί
  choice: నిందించినవారు
  rationale: ఈ న్యాయసంబంధ సందర్భంలో ఆమెపై అభియోగం మోపినవారిని సూచిస్తుంది; సాధారణ పాఠకులకు అర్థమయ్యే భాషను నిలుపుతుంది.
- source_word: κατέκρινεν
  choice: శిక్ష విధించలేదా
  rationale: న్యాయ లేదా అర్ధన్యాయ సందర్భంలో దోషిగా తీర్పు చెప్పి శిక్ష విధించడాన్ని సూచించే బలాన్ని సహజ తెలుగులో అందిస్తుంది; సాధారణ ‘తీర్పు చెప్పడం’ కంటే సందర్భానికి స్పష్టంగా ఉంటుంది.
- source_word: Ἡ γυνή
  choice: అమ్మా
  rationale: గ్రీకు సంబోధనలోని గౌరవపూర్వకమైన, అవమానరహిత స్వరాన్ని ఆధునిక సహజ తెలుగులో వ్యక్తం చేస్తుంది; బంధుత్వార్థాన్ని ఉద్దేశించదు.
