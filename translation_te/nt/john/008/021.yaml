id: JHN.8.21
reference: John 8:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: te
  text: 'కాబట్టి ఆయన మళ్లీ వారితో ఇలా అన్నాడు: “నేను వెళ్లిపోతున్నాను, మీరు నన్ను వెదకుతారు[a], మీ పాపంలోనే[b] చనిపోతారు. నేను వెళ్లే చోటికి మీరు రాలేరు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు నాకోసం వెదుకుతారు.” మూలపదం ఒకరిని వెదకడాన్ని సూచిస్తుంది; యోహాను సువార్తలో దీనికి లోతైన ఆధ్యాత్మిక భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “మీ పాపంలో” అని ఏకవచనం ఉంది. ఇది విడివిడిగా చేసిన పాపకార్యాలకన్నా కొనసాగుతున్న పాపస్థితిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మీకు రావడం సాధ్యం కాదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సంభాషణతో ఉన్న తార్కిక, కథన సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: మాటను తిరిగి చెప్పడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ὑπάγω
  choice: వెళ్లిపోతున్నాను
  rationale: కేవలం వెళ్లడమే కాక, వారిని విడిచి వెళ్లే భావాన్ని కూడా నిలుపుతుంది; యోహాను సువార్తలోని విస్తృత భావాన్ని ప్రధాన పాఠ్యంలో అతిగా వివరించదు.
- source_word: ζητήσετέ με
  choice: మీరు నన్ను వెదకుతారు
  rationale: ζητέω లోని వెదకడం లేదా అన్వేషించడం అనే భావాన్ని, అలాగే యోహానులో ఉండగల లోతైన ఆధ్యాత్మిక ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: మీ పాపంలోనే
  rationale: గ్రీకు మూలంలోని ఏకవచనమైన ‘పాపం’ను కాపాడి, వ్యక్తిగత క్రియల జాబితా కంటే కొనసాగుతున్న స్థితిని సూచించే అవకాశాన్ని తెరిచి ఉంచుతుంది. ‘లోనే’ ἐν భావాన్నీ వాక్యంలోని తీవ్రతనూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀποθανεῖσθε
  choice: చనిపోతారు
  rationale: భవిష్యత్తులో సంభవించే మరణాన్ని సాధారణ పాఠకులకు సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: నేను వెళ్లే చోటికి
  rationale: తెలుగు గమ్యనిర్మాణానికి అనుగుణంగా ‘చోటికి’ అని ఇచ్చి, యేసు వెళ్లే గమ్యాన్ని వ్యాఖ్యానించకుండా ఉంచుతుంది.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: మీరు రాలేరు
  rationale: అసమర్థత లేదా అసాధ్యత అనే δύνασθε భావాన్ని సహజమైన, బలమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ἁμαρτίᾳ అనే ఏకవచనాన్ని బహువచనంగా మార్చాలా
  choice: ప్రధాన పాఠ్యంలో ‘మీ పాపంలోనే’ అని ఏకవచనాన్ని నిలిపాం.
  alternative: ‘మీ పాపాల్లోనే’ లేదా ‘మీ పాపాల వల్ల’
  rationale: మూలపాఠ్యంలో నామవాచకం ఏకవచనంలో ఉంది. ఇది అనేక తప్పు క్రియలకన్నా పాపస్థితి, అవిశ్వాసం లేదా దేవునికి దూరమైన స్థితిని సూచించవచ్చు; అయితే ఆ అర్థాన్ని ప్రధాన పాఠ్యంలో నిర్బంధంగా నిర్ణయించలేదు.
- issue: ὑπάγω లో యేసు వెళ్లిపోవడంలోని ధార్మిక భావం
  choice: ‘నేను వెళ్లిపోతున్నాను’ అని అనువదించాం.
  alternative: ‘నేను వెళ్తున్నాను’ లేదా ‘నేను తండ్రి దగ్గరకు వెళ్తున్నాను’
  rationale: యోహానులో ఈ పదం యేసు మరణం, పునరుత్థానం, తండ్రి దగ్గరకు తిరిగి వెళ్లడాన్ని ప్రతిధ్వనింపజేయవచ్చు. ‘వెళ్లిపోతున్నాను’ విడిపోవడాన్ని నిలుపుతుంది; గమ్యాన్ని స్పష్టంగా చేర్చి మూలానికి మించిన వ్యాఖ్యానం చేయదు.
- issue: οὐ δύνασθε ἐλθεῖν ను సామర్థ్యలేమిగా లేదా సాధారణ నిషేధంగా చూపాలా
  choice: ‘మీరు రాలేరు’ అని ఇచ్చాం.
  alternative: ‘మీకు రావడం సాధ్యం కాదు’
  rationale: తెలుగులో ‘రాలేరు’ సామర్థ్యలేమి లేదా అసాధ్యత రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది; దానికి కారణం ఏమిటో వచనం చెప్పనందున దానిని వివరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథనశైలిని వాడాం. మూలంలోని ఏకవచనం, పునరుక్తి, అసమర్థత భావాలను నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉంచాం.
