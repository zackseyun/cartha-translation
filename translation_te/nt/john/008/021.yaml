  source_fidelity: The draft accurately conveys the repeated statement, Jesus’ departure, the future seeking, the singular ‘sin,’ and the inability to come. However, ‘అయినా’ (‘yet/however’) introduces an adversative relation not expressed by Greek καί (‘and’), so it should be removed.
  naturalness: The Telugu is modern, clear, and appropriately dignified. Coordinating the clauses with commas is natural and closely reflects the source’s sequence.
  terminology: ‘వెళ్లిపోతున్నాను,’ ‘వెదకుతారు,’ ‘పాపంలోనే,’ and ‘రాలేరు’ are suitable modern-standard Telugu equivalents. The singular ‘పాపం’ is correctly retained without imposing a theological explanation in the text.
