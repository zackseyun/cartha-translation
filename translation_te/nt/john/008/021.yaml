revisions:
- from: 'కాబట్టి ఆయన మళ్లీ వారితో ఇలా అన్నాడు: “నేను వెళ్లిపోతున్నాను. మీరు నన్ను వెదకుతారు[a]; అయినా మీ పాపంలోనే చనిపోతారు[b]. నేను వెళ్లే చోటికి మీరు రాలేరు[c].”'
