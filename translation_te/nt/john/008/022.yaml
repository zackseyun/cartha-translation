revisions:
- from: అందుచేత యూదులు[a], “తాను, ‘నేను వెళ్లే చోటికి మీరు రాలేరు’ అని చెబుతున్నాడు కదా; తనను తాను చంపుకుంటాడా ఏమిటి?” అని అనుకుంటూ ఉన్నారు.
  to: అందువల్ల యూదులు[a], “తాను, ‘నేను వెళ్లే చోటికి మీరు రాలేరు’ అని చెబుతున్నాడు కాబట్టి, తనను తాను చంపుకుంటాడా ఏమిటి?” అని చెప్పుకుంటూ ఉన్నారు.
