id: JHN.8.22
reference: John 8:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: te
  text: అందువల్ల యూదులు[a], “తాను, ‘నేను వెళ్లే చోటికి మీరు రాలేరు’ అని చెబుతున్నాడు కాబట్టి, తనను తాను చంపుకుంటాడా ఏమిటి?” అని చెప్పుకుంటూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, యోహాను సువార్త సందర్భాన్ని బట్టి, “యూదయ ప్రజలు” లేదా “యూదు నాయకులు.” ఇక్కడ ఈ పదం ఎంత విస్తృతమైన వర్గాన్ని సూచిస్తుందో సందర్భానుసారంగా గ్రహించాలి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: అని అనుకుంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పలువురి మధ్య సాగుతున్న మాటను సూచిస్తుంది. ఇక్కడ వారి ఊహాత్మక చర్చను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: అందుచేత
  rationale: ముందటి వాక్యానికి ప్రతిస్పందనగా వచ్చిన ఊహను, తార్కిక అనుసంధానాన్ని నిలుపుతుంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు[a]
  rationale: గ్రీకు పదబంధపు ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠ్యంలో నిలిపి, యోహాను సందర్భంలో సాధ్యమైన సంకుచిత సూచనలను పాదటిప్పణిలో ఉంచింది.
- source_word: Μήτι
  choice: చంపుకుంటాడా ఏమిటి?
  rationale: ప్రతికూల సమాధానాన్ని ఆశించే సందేహభరిత ప్రశ్నను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఇది నిజమైన నిర్ధారణ కాదని సూచిస్తుంది.
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: తనను తాను చంపుకుంటాడా
  rationale: క్రియలోని ప్రత్యక్ష ఆత్మవాచక అర్థాన్ని స్పష్టంగా, ప్రస్తుత వాడుకలో అందిస్తుంది.
- source_word: ὅτι
  choice: చెబుతున్నాడు కదా
  rationale: వారి ఊహకు యేసు పలికిన మాటే కారణమని తెలుగులో సహజమైన కారణాత్మక-ఉద్ధరణ నిర్మాణంతో చూపుతుంది.
- source_word: λέγει
  choice: చెబుతున్నాడు
  rationale: గ్రీకు వర్తమాన కాలపు సజీవతను నిలుపుతుంది.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: నేను వెళ్లే చోటికి
  rationale: ὑπάγω యొక్క ‘వెళ్లు/వెళ్లిపోవు’ భావాన్ని అనవసరంగా విస్తరించకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: మీరు రాలేరు
  rationale: సామర్థ్యలేమిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι ఎవరిని సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘యూదులు’ అని ఉంచడం
  alternative: ‘యూదయవారు’ లేదా ‘యూదు నాయకులు’
  rationale: పదబంధపు ప్రత్యక్ష అర్థాన్ని నిలుపుతూ, ఈ వచనం స్వయంగా సూచనను నాయకులకు మాత్రమే పరిమితం చేయనందున ఆ పరిమితిని ప్రధాన పాఠ్యంలో చేర్చలేదు. సందర్భానుసారమైన ఇతర అవకాశాలను పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ప్రశ్నలోని సందేహం మరియు వ్యంగ్య ఊహను అతిశయింపకుండా నిలిపింది; పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
