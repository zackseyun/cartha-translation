id: JHN.8.43
reference: John 8:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: te
  text: నేను మాట్లాడే తీరు మీకు ఎందుకు అర్థం కావడం లేదు? ఎందుకంటే నా మాటను వినే సామర్థ్యం మీకు లేదు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా మాటతీరు’ లేదా ‘నా భాష.’ ఇక్కడి గ్రీకు పదం యేసు మాట్లాడే విధానాన్ని సూచిస్తుంది; తరువాతి భాగంలోని ‘నా మాట’కు వేరైన పదం వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మీరు నా మాటను వినలేరు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: నేను మాట్లాడే తీరు
  rationale: ఈ పదం ఇక్కడ మాటల విషయవస్తువు కంటే మాట్లాడే విధానాన్ని సూచిస్తుంది; తరువాత వచ్చే λόγον (‘నా మాట’)తో ఉన్న భేదాన్ని ఇది నిలుపుతుంది.
- source_word: γινώσκετε
  choice: అర్థం కావడం
  rationale: ఈ సందర్భంలో ఇది పరిచయం లేదా గుర్తింపు కంటే యేసు మాట్లాడే తీరును గ్రహించడాన్ని సూచిస్తుంది.
- source_word: ἀκούειν
  choice: వినే
  rationale: మూలపదానికి ప్రాథమిక అర్థమైన ‘వినడం’ను నిలుపుతూ, అంగీకరించడం లేదా విధేయత చూపడం అనే భావాలను అనువాదంలో నేరుగా చేర్చలేదు.
- source_word: λόγον
  choice: మాటను
  rationale: ఇది యేసు పలికిన మాట లేదా సందేశాన్ని సూచిస్తుంది. ‘మాట’ సహజమైన తెలుగులో ఉండటంతో పాటు λαλιὰν‌తోని భేదాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: οὐ δύνασθε
  choice: సామర్థ్యం మీకు లేదు
  rationale: ఇది కేవలం ఇష్టపడకపోవడాన్ని కాక అసమర్థతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రశ్నకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: నేను / నా
  rationale: మొదటి పదబంధాన్ని తెలుగులో సహజంగా ‘నేను మాట్లాడే తీరు’గా, రెండవదాన్ని ‘నా మాట’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: ‘నా మాటను వినే సామర్థ్యం మీకు లేదు’ అనే అసమర్థత స్వభావం
  choice: అసమర్థతను నేరుగా పేర్కొని, దాని సిద్ధాంతపరమైన కారణాన్ని నిర్దేశించకుండా ఉంచడం.
  alternative: దీనిని నైతిక అనిష్టతగా, న్యాయతీర్పువల్ల కలిగిన కఠినత్వంగా, లేదా ఆత్మీయ అసమర్థతగా ప్రత్యేకంగా వ్యాఖ్యానించడం.
  rationale: ఈ వచనం అసమర్థతను చెబుతుంది గాని దాని పూర్తి కారణాన్ని ఇక్కడే వివరించదు; అందువల్ల మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్న-సమాధాన నిర్మాణం వాడబడింది. ‘నేను మాట్లాడే తీరు’ మరియు ‘నా మాట’ మధ్య మూలంలోని పదభేదాన్ని నిలుపుతూ, అసమర్థతకు సంబంధించిన వేదాంతపరమైన కారణాన్ని అనువాదం నిర్ణయించదు.
