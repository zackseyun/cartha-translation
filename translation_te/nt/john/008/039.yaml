review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the response, the claim that Abraham is their father, and the conditional contrast between claimed descent and Abraham-like conduct. The imperfect ἐποιεῖτε can plausibly be represented with a contrary-to-fact nuance. However, the Telugu ‘చేస్తూ ఉండేవారు’ adds a marked ongoing sense that is not necessary here, and the wording can more directly retain the Greek object, ‘the works/deeds of Abraham.’
  naturalness: The register is modern and understandable. ‘వారు ఆయనకు జవాబుగా’ is slightly stiff; ‘వారు ఆయనకు జవాబిచ్చి’ is smoother narrative Telugu. A more direct final clause is also more idiomatic.
  terminology: ‘అబ్రాహాము పిల్లలు’ appropriately renders τέκνα without importing a doctrinal distinction. ‘అబ్రాహాము చేసిన పనులు’ is understandable, but ‘అబ్రాహాము చేసిన పనులనే’ more clearly expresses the intended ethical deeds while retaining the definite reference. No theological interpretation beyond the verse is introduced.
  issues:
  - severity: low
    issue: The final verb is rendered with a strongly progressive form.
    rationale: The Greek imperfect can support an ongoing nuance, but in this conditional sentence Telugu ‘చేసేవారు’ conveys the counterfactual result naturally without unnecessarily foregrounding continuous action.
  - severity: low
    issue: The opening response formula is mildly awkward Telugu.
    rationale: ‘వారు ఆయనకు జవాబిచ్చి’ is a more natural way to express the response-and-speech sequence while preserving its narrative force.
