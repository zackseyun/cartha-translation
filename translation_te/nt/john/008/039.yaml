  text: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν. λέγει αὐτοῖς ὁ Ἰησοῦς· Εἰ τέκνα τοῦ Ἀβραάμ ⸀ἐστε, τὰ ἔργα τοῦ Ἀβραὰμ ⸀ἐποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: te
  text: వారు ఆయనకు జవాబిచ్చి, “అబ్రాహామే మా తండ్రి” అన్నారు. యేసు వారితో, “మీరు అబ్రాహాము పిల్లలైతే, అబ్రాహాము చేసిన పనులనే చేసేవారు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు అబ్రాహాము పిల్లలై ఉంటే, అబ్రాహాము చేసిన పనులు చేసేవారు.” గ్రీకులోని అసంపూర్ణ భూతకాల క్రియ ఈ షరతు వాక్యంలో వాస్తవానికి విరుద్ధమైన భావాన్ని సూచిస్తున్నదిగా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: వారు ఆయనకు జవాబుగా … అన్నారు
  rationale: మూలంలోని ‘జవాబిచ్చారు, చెప్పారు’ అనే రెండు క్రియల భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘జవాబుగా … అన్నారు’ అని వ్యక్తపరుస్తుంది; అనవసరమైన పునరుక్తిని నివారిస్తూ ప్రతిస్పందన మరియు పలుకుబడి రెండింటినీ నిలుపుతుంది.
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: అబ్రాహామే మా తండ్రి
  rationale: వారి వంశసంబంధ దావాను సహజంగా తెలియజేస్తూ, ‘అబ్రాహామే’ ద్వారా వాక్యంలోని ప్రధాన ఉద్ఘాటనను నిలుపుతుంది.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: యేసు వారితో … అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగు కథన శైలిలో సహజమైన భూతకాలంతో అందిస్తుంది; మాట్లాడిన వ్యక్తి మరియు శ్రోతలను స్పష్టంగా ఉంచుతుంది.
- source_word: τέκνα τοῦ Ἀβραάμ
  choice: అబ్రాహాము పిల్లలు
  rationale: τέκνα లింగభేదం లేని సంతాన/కుటుంబ సంబంధ పదం. ‘పిల్లలు’ ఆ సంబంధాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: అబ్రాహాము చేసిన పనులు
  rationale: ἔργα యొక్క క్రియాత్మక, నైతిక భావాన్ని నిలుపుతూ ‘అబ్రాహాము పనులు’ కంటే తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἐποιεῖτε
  choice: చేస్తూ ఉండేవారు
  rationale: అసంపూర్ణ భూతకాల క్రియ యొక్క కొనసాగుతున్న క్రియాభావాన్ని, ఈ షరతు వాక్యంలో సూచితమైన వాస్తవవిరుద్ధ భావాన్ని తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: అబ్రాహాముకు పిల్లలుగా ఉండడమంటే ఏమిటి?
  choice: వారి వంశసంబంధ దావాను యథాతథంగా ఉంచి, దానిని అబ్రాహాము చేసిన పనులతో యేసు పోల్చిన ఉద్రిక్తతను నిలుపడం
  alternative: వారు శారీరకంగా అబ్రాహాము సంతానం కాదని చెప్పడం, లేదా ఇక్కడ కేవలం ఆత్మీయ సంతానమే ఉద్దేశమని స్పష్టీకరించడం
  rationale: ఈ వచనం వారి దావాకు, వారి క్రియలకు మధ్య వ్యత్యాసాన్ని చూపుతుంది; శారీరక లేదా ఆత్మీయ సంతానం గురించిన విస్తృత సిద్ధాంతాన్ని ఈ వచనంలోకి చేర్చదు.
- issue: షరతు వాక్యంలోని వాస్తవవిరుద్ధ భావం
  choice: ‘పిల్లలైతే … చేస్తూ ఉండేవారు’ అని అనువదించడం
  alternative: ‘పిల్లలైతే … చేస్తారు’ అని సాధారణ వాస్తవ షరతుగా అనువదించడం
  rationale: ἐποιεῖτε అనే అసంపూర్ణ భూతకాల రూపం వారి ప్రస్తుత ప్రవర్తన ఆ దావాకు విరుద్ధమని సూచించగలదు. అయితే నిర్మాణంలోని వ్యాఖ్యాన భేదాన్ని పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అబ్రాహామే’ ఉద్ఘాటనను, ‘చేస్తూ ఉండేవారు’ కొనసాగుతున్న క్రియాభావాన్ని నిలుపుతాయి.
