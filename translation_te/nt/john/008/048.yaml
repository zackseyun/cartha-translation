id: JHN.8.48
reference: John 8:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: te
  text: యూదులు ఆయనకు జవాబిస్తూ, “నువ్వు సమరయుడివనీ, నీలో దయ్యం ఉందనీ మేము చెప్పేది సరైనదే కదా?” అన్నారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యూదులు” అనే పదం యోహాను సువార్తలో కొన్ని సందర్భాల్లో యేసును వ్యతిరేకించిన ఒక ప్రత్యేక యూదుల వర్గాన్ని సూచిస్తుంది; మినహాయింపులేకుండా యూదులందరినీ సూచించదు. సందర్భాన్ని బట్టి “యూదా ప్రాంతవాసులు” లేదా “యూదా నాయకులు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “నీలో దయ్యం ఉంది”; కొందరు దీనిని మరింత వ్యాఖ్యానాత్మకంగా “నీకు దయ్యం పట్టింది” అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν … καὶ εἶπαν αὐτῷ
  choice: ఆయనకు జవాబిస్తూ … అన్నారు
  rationale: గ్రీకులోని ‘జవాబిచ్చారు, ఆయనతో అన్నారు’ అనే రెండు మాటల కథన భావాన్ని సహజమైన ఆధునిక తెలుగులో పునరుక్తి భారంలేకుండా నిలుపుతుంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: మూలపదానికి నేరమైన సమానార్థకం. ఈ సందర్భంలో ‘యూదా ప్రాంతవాసులు’ లేదా ‘యూదా నాయకులు’ అని పరిధిని అనువాదంలోనే కుదించడం లేదు; సందర్భ సంబంధిత సూక్ష్మతను పాదటీపులో వివరిస్తుంది.
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: మేము చెప్పేది సరైనదే కదా?
  rationale: అవుననే జవాబును ఆశించే గ్రీకు అలంకార ప్రశ్నను సహజమైన తెలుగు రూపంలో నిలుపుతుంది; ἡμεῖς ఇచ్చే ఉద్ఘాటన ‘మేము’ ద్వారా వ్యక్తమవుతుంది.
- source_word: Σαμαρίτης
  choice: సమరయుడు
  rationale: జాతి-మత సమూహ సూచనను నేరుగా తెలియజేసే, తెలుగులో స్థిరపడిన పదం; ఇక్కడ అది అవమానార్థక ఆరోపణగా వాడబడింది.
- source_word: δαιμόνιον ἔχεις
  choice: నీలో దయ్యం ఉంది
  rationale: ‘దయ్యాన్ని కలిగివున్నావు’ అనే మూలంలోని నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘దయ్యం పట్టింది’ అనే మరింత వ్యాఖ్యానాత్మక రూపాన్ని ప్రధాన పాఠ్యంలో పెట్టదు.
theological_decisions:
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι అనే పదబంధం సూచించే వర్గం
  choice: యూదులు
  alternative: యూదా ప్రాంతవాసులు; యూదా నాయకులు
  rationale: గ్రీకు పాఠం నాయకులని ప్రత్యేకంగా చెప్పనందున ప్రధాన పాఠ్యం నేరమైన పదాన్ని నిలుపుతుంది. అయితే ఇది యూదులందరినీ మినహాయింపులేకుండా సూచిస్తుందని అపార్థం కాకుండా సందర్భ సూక్ష్మతను పాదటీపులో ఇస్తుంది.
- issue: δαιμόνιον ἔχεις యొక్క భావ తీవ్రత
  choice: నీలో దయ్యం ఉంది
  alternative: నీకు దయ్యం పట్టింది
  rationale: మూలంలోని ‘దయ్యం కలిగివుండడం’ అనే వ్యక్తీకరణను పారదర్శకంగా నిలుపుతూ, ‘పట్టింది’ ద్వారా దయ్యగ్రస్త స్థితిని మరింత నిర్దిష్టంగా వ్యాఖ్యానించకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష సంభాషణలో ఆరోపణ యొక్క పదును నిలుపుతూ, అనవసరంగా ప్రాచీనమైన లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించింది. అన్ని పాదటీపు సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
