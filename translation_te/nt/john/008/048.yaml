  source_fidelity: 'The Telugu faithfully represents the Greek rhetorical question, including its expected affirmative force: “మేము చెప్పేది సరైనదే కదా?” correctly conveys Οὐ καλῶς λέγομεν ἡμεῖς. “సమరయుడు” directly renders Σαμαρίτης, and “నీలో దయ్యం ఉంది” is a natural, close rendering of δαιμόνιον ἔχεις without importing the more interpretive idea of possession. “యూదులు” preserves οἱ Ἰουδαῖοι without narrowing the referent in the main text.'
