revisions:
- from: అయితే వారు[a] ఆ మాట విని, తమ మనస్సాక్షిచేత తప్పు తెలిసినవారై, పెద్దవారితో మొదలుకొని చివరివారి వరకు[b] ఒక్కొక్కరుగా బయటికి వెళ్లిపోయారు. యేసు ఒక్కడే మిగిలిపోయాడు; ఆ స్త్రీ మధ్యలో నిలబడి ఉంది.
  to: అయితే వారు[a] విని, తమ మనస్సాక్షిచేత తమ తప్పు గ్రహించి, వయసులో పెద్దవారితో మొదలుకొని చివరివారి వరకు[b] ఒక్కొక్కరుగా బయటికి వెళ్లిపోయారు. యేసు ఒక్కడే మిగిలిపోయాడు; ఆ స్త్రీ మధ్యలో నిలబడి ఉంది.
  rationale: The revision removes an unstated object, clarifies that the first departing people were older in age rather than office-holding elders, and smooths the conscience-conviction expression into natural modern Telugu. It preserves the source text's ambiguity concerning “the last,” the English audit trail's alternative, and both required footnote anchors.
