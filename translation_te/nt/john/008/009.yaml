id: JHN.8.9
reference: John 8:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: robinson-pierpont-2005-byzantine
  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: te
  text: అయితే వారు[a] విని, తమ మనస్సాక్షిచేత తమ తప్పు గ్రహించి, వయసులో పెద్దవారితో మొదలుకొని చివరివారి వరకు[b] ఒక్కొక్కరుగా బయటికి వెళ్లిపోయారు. యేసు ఒక్కడే మిగిలిపోయాడు; ఆ స్త్రీ మధ్యలో నిలబడి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది వ్యభిచారంలో పట్టుబడిన స్త్రీ గురించిన వృత్తాంతం (యోహాను 7:53–8:11) కొనసాగింపు. యోహాను 7:53లోని గమనిక చూడండి.
    reason: textual_critical
  - marker: b
    text: లేదా, ‘ఆఖరివారి దాకా’.
    reason: translation_alternative
lexical_decisions:
- source_word: συνείδησις
  choice: మనస్సాక్షి
  rationale: మంచి చెడులను గుర్తించి అంతరంగంలో సాక్ష్యమిచ్చే నైతిక సామర్థ్యాన్ని సూచించే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: ἐλέγχω
  choice: తప్పు తెలిసినవారై
  rationale: ἐλεγχόμενοι అనే కర్మణి వర్తమాన రూపం ఇక్కడ మనస్సాక్షి వారిలో కలిగించిన అపరాధ నిర్ధారణను సూచిస్తుంది. ‘ఖండించబడి’ కంటే ఈ సందర్భంలో ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: πρεσβύτερος
  choice: పెద్దవారు
  rationale: ఇక్కడ అధికారిక ‘పెద్దలు’ అనే పదవికన్నా వయస్సులో పెద్దవారనే భావం తరువాతి క్రమంతో సరిపోతుంది.
- source_word: εἷς καθ' εἷς
  choice: ఒక్కొక్కరుగా
  rationale: వ్యక్తులు ఒకరి తరువాత ఒకరు వెళ్లిపోయారనే గ్రీకు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν μέσῳ ἑστῶσα
  choice: మధ్యలో నిలబడి ఉంది
  rationale: గ్రీకు పరిపూర్ణ కృదంతం సూచించే నిలిచి ఉన్న స్థితిని సూటిగా నిలుపుతుంది.
theological_decisions:
- issue: ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι లోని అంతరంగ అపరాధ నిర్ధారణ
  choice: తమ మనస్సాక్షిచేత తప్పు తెలిసినవారై
  alternative: తమ మనస్సాక్షిచేత దోషులుగా నిర్ధారించబడి
  rationale: న్యాయపరమైన లేదా సిద్ధాంతపరమైన అదనపు భావాన్ని బలవంతంగా చేర్చకుండా, వారి అంతరంగ నైతిక గ్రహింపును వ్యక్తం చేస్తుంది.
- issue: πρεσβυτέρων యొక్క గుర్తింపు
  choice: పెద్దవారు
  alternative: సంఘపెద్దలు
  rationale: సందర్భం వయస్సు లేదా సీనియారిటీ క్రమాన్ని సూచించవచ్చు; అధికారిక మతపదవిగా నిర్ణయించడం అవసరం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మనస్సాక్షి’ వంటి సుపరిచిత పదాన్ని ఉంచి, ‘ἐλέγχω’ను అతిగా న్యాయపరంగా కాకుండా సందర్భానుసారంగా అనువదించాం. ప్రధాన పాఠ్యంలో [a], [b] గుర్తులు రెండూ చేర్చబడ్డాయి.
