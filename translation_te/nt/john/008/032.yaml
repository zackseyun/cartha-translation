  text: καὶ γνώσεσθε τὴν ἀλήθειαν, καὶ ἡ ἀλήθεια ἐλευθερώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/032.yaml
  text: and you will know the truth[b][a], and the truth will set you free.
translation:
  language: te
  text: మీరు సత్యాన్ని తెలుసుకొంటారు[a], మరియు సత్యం మిమ్మల్ని విడుదల చేస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు క్రమంగా సత్యాన్ని తెలుసుకొంటారు.’
    reason: lexical_alternative
  - marker: b
    text: ఈ వచనం స్వేచ్ఛ దేనినుంచి లభిస్తుందో స్పష్టంగా చెప్పదు; చుట్టుపక్కల సందర్భం దానిని పాపం నుండి స్వేచ్ఛతో అనుసంధానిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσεσθε
  choice: తెలుసుకుంటారు
  rationale: γινώσκω క్రియ యొక్క భవిష్యత్ రూపాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది. సందర్భానుసారం క్రమంగా తెలుసుకోవడం అనే భావం సాధ్యమైనా, దానిని ప్రధాన పాఠ్యంలో తప్పనిసరి చేయదు.
- source_word: ἀλήθειαν / ἀλήθεια
  choice: సత్యాన్ని / సత్యం
  rationale: మూలంలో రెండుసార్లు ఉన్న పదపునరుక్తిని నిలుపుతూ, నిర్దిష్టమైన ‘సత్యం’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐλευθερώσει
  choice: స్వతంత్రులుగా చేస్తుంది
  rationale: ఎవరినుంచి లేదా దేనినుంచి స్వేచ్ఛ కలుగుతుందో ప్రధాన పాఠ్యంలో చేర్చకుండా, క్రియలోని స్వేచ్ఛ కలిగించే భావాన్ని నిలుపుతుంది.
- source_word: ὑμᾶς
  choice: మిమ్మల్ని
  rationale: ద్వితీయ పురుష బహువచన కర్మను సహజంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: καὶ ... καὶ
  choice: వాక్య సమన్వయాన్ని విరామచిహ్నంతో వ్యక్తం చేయడం
  rationale: తెలుగులో అనవసరమైన ‘మరియు’ పునరుక్తిని నివారిస్తూ, రెండు సమన్విత వాక్యభాగాల క్రమాన్ని సెమికోలన్ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: ‘సత్యం మిమ్మల్ని స్వతంత్రులుగా చేస్తుంది’ అనే మాటలో స్వేచ్ఛ యొక్క స్వభావం
  choice: ప్రధాన పాఠ్యంలో స్వేచ్ఛను రాజకీయ, మానసిక లేదా ప్రత్యేకంగా ఆధ్యాత్మిక స్వేచ్ఛగా నిర్వచించకుండా ఉంచడం
  alternative: ‘సత్యం మిమ్మల్ని పాపం నుండి విడిపిస్తుంది’ అని స్పష్టీకరించడం
  rationale: తరువాతి వచనాలు పాపం నుండి స్వేచ్ఛ అనే భావాన్ని అభివృద్ధి చేసినా, ఈ వచనం స్వయంగా దేనినుంచి స్వేచ్ఛ అని చెప్పదు. అందువల్ల సందర్భమే దానిని వివరించేలా మూలంలోని సంక్షిప్తతను, విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘విముక్తి’ వంటి మరింత సాంకేతికంగా లేదా రాజకీయంగా వినిపించగల పదానికి బదులుగా ‘స్వతంత్రులుగా చేస్తుంది’ వాడి, మూలంలోని నిర్దిష్టం కాని స్వేచ్ఛ భావాన్ని నిలిపాం.
