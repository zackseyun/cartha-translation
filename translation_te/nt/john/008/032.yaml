revisions:
- from: మీరు సత్యాన్ని తెలుసుకుంటారు[a]; సత్యం మిమ్మల్ని స్వతంత్రులుగా చేస్తుంది[b].
  to: మీరు సత్యాన్ని తెలుసుకొంటారు[a], మరియు సత్యం మిమ్మల్ని విడుదల చేస్తుంది[b].
  rationale: The revision preserves the Greek’s two coordinated future clauses, the rhetorical repetition of ‘సత్యం,’ and the plural addressee. ‘విడుదల చేస్తుంది’ better conveys ἐλευθερόω than a term for personal independence, without adding ‘from sin’ to the verse. Footnote a has been recast in idiomatic Telugu, and footnote b retains the contextual clarification without treating it as part of the verse’s explicit wording.
