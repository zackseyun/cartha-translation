source:
  edition: SBLGNT
  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: te
  text: మీ గురించి చెప్పడానికి, తీర్పు తీర్చడానికి నాకు చాలా విషయాలు ఉన్నాయి.[a] అయితే నన్ను పంపినవాడు సత్యవంతుడు; నేను ఆయన నుండి విన్నవి, అవే లోకానికి చెబుతున్నాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మిమ్మల్ని గురించి.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పాఠంలో, ‘నేను ఆయన నుండి విన్నవి, అవే లోకానికి చెబుతున్నాను’ అని ముందటి విషయాలను మళ్లీ సూచించే పదం ఉంది; ‘అవే’ ఆ బలాన్ని ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: చాలా ఉన్నాయి
  rationale: నపుంసక బహువచన విశేషణం నామవాచకార్థంలో వాడబడింది; తరువాతి రెండు క్రియలతో కలిపి తెలుగులో సహజంగా బహువిధ విషయాలను సూచిస్తుంది.
- source_word: περὶ ὑμῶν
  choice: మీ గురించి
  rationale: περί + షష్ఠీ విభక్తి ఇక్కడ అంశం లేదా సంబంధాన్ని సూచిస్తుంది; ‘మీ గురించి’ ఆధునిక తెలుగులో సహజమైన, విస్తృతార్థాన్ని నిలుపుకునే రూపం.
- source_word: λαλεῖν
  choice: చెప్పవలసినవి
  rationale: మొదటి అనంతక్రియను κρίνεινతో సమాంతరంగా సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: κρίνειν
  choice: తీర్పు తీర్చవలసినవి
  rationale: κρίνω యొక్క విస్తృత న్యాయార్థాన్ని నిలుపుతుంది; ‘ఖండించు’ లేదా ‘శిక్ష విధించు’ అనే సంకుచిత భావాన్ని చేర్చదు.
- source_word: ὁ πέμψας με
  choice: నన్ను పంపినవాడు
  rationale: నామవాచకంగా పనిచేసే కర్తరి భూతకృదంతాన్ని సహజంగా అనువదిస్తూ, మూలంలో లేని ‘తండ్రి’ అనే పదాన్ని చేర్చదు.
- source_word: ἀληθής
  choice: సత్యవంతుడు
  rationale: వ్యక్తిని సూచించే సందర్భంలో ఆయన సత్యస్వరూపుడు, నమ్మదగినవాడు అనే భావపరిధిని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: నేను ఆయన దగ్గర విన్నవాటినే
  rationale: విన్న విషయాలనే సూచించే సంబంధవాచక బహువచన భావాన్ని నిలుపుతుంది; ‘దగ్గర’ మూలం లేదా వ్యక్తిగత సంబంధాన్ని సహజంగా సూచిస్తుంది.
- source_word: ταῦτα
  choice: విన్నవాటినే
  rationale: గ్రీకులోని పునరుద్ధరణాత్మక సూచనను తెలుగు ‘-నే’ నిశ్చయార్థకం ద్వారా సహజంగా, బలంగా ప్రతిబింబిస్తుంది.
- source_word: λαλῶ
  choice: చెబుతున్నాను
  rationale: వర్తమానకాలంలోని కొనసాగుతున్న బహిరంగ ప్రకటన భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: εἰς τὸν κόσμον
  choice: లోకానికి
  rationale: మాటల గమ్యాన్ని లేదా శ్రోతలను సూచించే εἰς భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ‘నన్ను పంపినవాడు’ అనే మాటకు సూచిత వ్యక్తి
  choice: మూలంలోని పరోక్ష సూచననే ఉంచడం
  alternative: ‘నన్ను పంపిన తండ్రి’ అని స్పష్టీకరించడం
  rationale: యోహాను సందర్భంలో తండ్రి సూచితుడైనా, ఈ వాక్యంలో గ్రీకు పాఠం ఆయనను పేరుతో పేర్కొనదు.
- issue: κρίνειν యొక్క భావబలం
  choice: ‘తీర్పు తీర్చడం’ అనే విస్తృత న్యాయార్థం
  alternative: ‘ఖండించడం’ లేదా ‘శిక్ష విధించడం’
  rationale: ఈ క్రియ తప్పనిసరిగా దోషిగా ఖండించడాన్నే సూచించదు; మూలంలోని భావవిస్తృతిని కాపాడాలి.
- issue: ἀληθής యొక్క భావం
  choice: ‘సత్యవంతుడు’
  alternative: ‘నమ్మదగినవాడు’
  rationale: సత్యత మరియు విశ్వసనీయత రెండింటి ప్రతిధ్వనిని పూర్తిగా ఒకే దిశలో పరిమితం చేయకుండా, యోహాను రచనలోని సత్య సంబంధిత ధార్మిక బరువును నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘తీర్పు తీర్చడం’ న్యాయసంబంధ గంభీరతను నిలుపుతుంది. రెండవ వాక్యంలో గ్రీకు సంబంధవాచక–సూచక పునరుక్తిని తెలుగులో సహజమైన ‘-నే’ ద్వారా ప్రతిబింబించాం.
