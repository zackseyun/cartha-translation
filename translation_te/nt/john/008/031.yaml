id: JHN.8.31
reference: John 8:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: te
  text: 'కాబట్టి యేసు ఆయనను నమ్మిన[a] యూదులతో ఇలా అన్నాడు: “మీరు నా మాటలో నిలిచి ఉంటే, మీరు నిజంగా నా శిష్యులే.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనలో విశ్వాసముంచిన.” గ్రీకులో అక్షరార్థంగా, “ఆయనను నమ్మిన” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: ఇలా అంటూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న మాటల చర్యను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న సందర్భంతో కొనసాగింపు లేదా పర్యవసాన సంబంధాన్ని తెలియజేస్తుంది; తార్కిక బలాన్ని అతిగా పెంచదు.
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: తనను నమ్మిన యూదులతో
  rationale: πεπιστευκότας క్రియలోని ముందుగా ఏర్పడి కొనసాగుతున్న నమ్మకాన్ని తెలుగు సందర్భం తెలియజేస్తుంది. αὐτῷ దత్తివును ‘తనను నమ్మిన’ అని నేరుగా అనువదించడం ద్వారా εἰς లేని చోట ‘తనలో విశ్వాసముంచిన’ అనే విస్తరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: Ἐὰν
  choice: ఉంటే
  rationale: ఉపపాదక భావంతో ఉన్న షరతును సహజమైన తెలుగు షరతు నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: ὑμεῖς
  choice: మీరు
  rationale: మూలంలో స్పష్టంగా ఉన్న సర్వనామాన్ని ఉంచి దాని స్వల్ప ఉద్ఘాటనను కాపాడుతుంది.
- source_word: μείνητε
  choice: నిలిచి ఉంటే
  rationale: యోహాను రచనలోని కొనసాగడం, స్థిరంగా ఉండడం అనే భావాలను రెండింటినీ సహజంగా మోస్తుంది.
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: నా మాటలో
  rationale: λόγος ఇక్కడ యేసు సందేశం లేదా బోధను సూచించినా, ‘మాట’ మూలపదపు రూపకాన్ని మరియు యోహాను శైలిని కాపాడుతూ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: ἀληθῶς
  choice: నిజంగా
  rationale: శిష్యత్వపు యథార్థతను స్పష్టంగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μαθηταί μού ἐστε
  choice: నా శిష్యులై ఉంటారు
  rationale: షరతు నెరవేరినప్పుడు వారి నిజమైన స్థితిని తెలిపే విధంగా తెలుగు వాక్య నిర్మాణానికి సరిపోతుంది; ‘శిష్యులు’ సువార్తల సందర్భానికి స్థిరమైన పదం.
theological_decisions:
- issue: πιστεύω క్రియను దత్తివులోని αὐτῷతో అనువదించడం
  choice: తనను నమ్మిన
  alternative: తనలో విశ్వాసముంచిన
  rationale: గ్రీకులో εἰς వంటి విభక్త్యుపసర్గం లేకుండా దత్తివు ఉంది. అందువల్ల ప్రధాన పాఠ్యం నేరమైన ‘తనను నమ్మిన’ అనే రూపాన్ని ఉంచుతుంది; యోహాను సందర్భంలో సాధ్యమైన మరింత స్పష్టమైన విశ్వాసార్థాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన శైలి. ‘వాక్యం’ కంటే ‘మాట’ను ఎంచుకోవడం ద్వారా అతిగా మతపరమైన పదజాలాన్ని నివారిస్తూ యోహాను భావాన్ని నిలిపాం.
