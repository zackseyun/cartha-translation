id: JHN.8.46
reference: John 8:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: te
  text: మీలో ఎవరు నన్ను పాపం విషయంలో దోషిగా నిరూపించగలరు?[a] నేను సత్యం చెబుతున్నట్లయితే, మీరు నన్ను ఎందుకు నమ్మరు?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీలో ఎవరు పాపం గురించి నన్ను తప్పుపట్టగలరు?’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీరు నాపై ఎందుకు విశ్వాసం ఉంచరు?’ గ్రీకు పదం ఒక వ్యక్తి చెప్పేది నమ్మడం, ఆ వ్యక్తిపై విశ్వాసం ఉంచడం అనే రెండు భావాలనూ కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: మీలో ఎవరు
  rationale: ఈ ప్రశ్నార్థక ప్రయోగం ‘మీలో ఎవరు?’ అనే ప్రత్యక్ష సవాలును సూచిస్తుంది; ఇది సహజమైన ఆధునిక తెలుగు.
- source_word: ἐλέγχει
  choice: దోషిగా నిరూపించగలరు
  rationale: ἐλέγχω ఇక్కడ తప్పును బయటపెట్టడం లేదా నేరారోపణను రుజువు చేయడం అనే న్యాయసంబంధ ఛాయను కలిగి ఉంది. తెలుగు ప్రశ్నలో సామర్థ్యార్థక రూపం ఆ సవాలును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: περὶ ἁμαρτίας
  choice: పాపం విషయంలో
  rationale: περί + షష్ఠీ విభక్తి సంబంధం లేదా విషయాన్ని సూచిస్తుంది. ఈ పదబంధం దానిని విస్తృతంగానే ఉంచి, ఒక నిర్దిష్ట పాపానికి పరిమితం చేయదు.
- source_word: εἰ ἀλήθειαν λέγω
  choice: నేను సత్యం చెబుతున్నట్లయితే
  rationale: εἰ యొక్క షరతు రూపాన్ని నిలుపుతూ, సందర్భంలో ఉన్న వాక్చాతుర్య బలాన్ని వివరణగా మార్చకుండా కాపాడుతుంది.
- source_word: διὰ τί
  choice: ఎందుకు
  rationale: కారణాన్ని అడిగే ఈ సాధారణ ప్రశ్నార్థక ప్రయోగానికి సహజమైన తెలుగు సమానం.
- source_word: πιστεύετέ μοι
  choice: నన్ను నమ్మరు
  rationale: πιστεύω + చతుర్థీ విభక్తి ఒక వ్యక్తి మాటను నమ్మడం, అలాగే అతనిపై విశ్వాసం ఉంచడం అనే రెండు ఛాయలనూ కలిగి ఉండగలదు; ‘నన్ను నమ్మరు’ ఈ ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: యేసు పాపరాహిత్యం, సత్యవంతత్వం గురించి ప్రశ్నల వాక్చాతుర్య బలం
  choice: ప్రశ్నలను నేరుగా అనువదించి, అంతర్లీన దావాను వివరణాత్మకంగా విస్తరించకుండా ఉంచడం.
  alternative: ‘నేను ఏ పాపం చేశానని మీలో ఎవరైనా నిరూపించగలరా?’ అని భావాన్ని మరింత స్పష్టంగా విస్తరించడం.
  rationale: గ్రీకు పాఠం యేసు తనపై పాపారోపణను నిరూపించమని నేరుగా సవాలు చేసి, తన సత్యవచనాన్ని వారు నమ్మకపోవడంతో అనుసంధానిస్తుంది. అనువాదం ఈ బలాన్ని కాపాడుతుంది కానీ గ్రీకులో లేని వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రత్యక్ష ప్రశ్నల శైలి. ‘దోషిగా నిరూపించగలరు’ న్యాయసంబంధ ఛాయను సహజంగా అందిస్తుంది; ‘పాపం విషయంలో’ మూలంలోని విస్తృత సంబంధార్థాన్ని నిలుపుతుంది.
