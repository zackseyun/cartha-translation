source:
  edition: SBLGNT
  text: ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/036.yaml
  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: te
  text: కాబట్టి, కుమారుడు మిమ్మల్ని విముక్తులను చేస్తే, మీరు నిజంగానే స్వేచ్ఛగలవారు అవుతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిజమైన స్వేచ్ఛగలవారు’ లేదా ‘స్వేచ్ఛగలవారే’ అని కూడా అనువదించవచ్చు. గ్రీకు క్రియావిశేషణం ఈ స్వేచ్ఛ యథార్థమైనదని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: కాబట్టి ... చేస్తే
  rationale: ἐὰν షరతును, οὖν ముందటి వాదననుంచి వచ్చే నిర్ధారణను సూచిస్తాయి. తెలుగు వాక్యనిర్మాణంలో ‘కాబట్టి ... చేస్తే’ రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: ὁ υἱὸς
  choice: కుమారుడు
  rationale: యోహాను సందర్భంలో నిర్దిష్టమైన క్రీస్తు సంబంధ బిరుదుగా యేసును సూచిస్తుంది; ‘కుమారుడు’ ఆ బిరుదును గౌరవప్రదంగా నిలుపుతుంది.
- source_word: ὑμᾶς
  choice: మిమ్మల్ని
  rationale: గ్రీకులో ఇది ద్వితీయ పురుష బహువచనం; తెలుగు ‘మిమ్మల్ని’ ఆ బహుత్వాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐλευθερώσῃ
  choice: స్వతంత్రులుగా చేస్తే
  rationale: షరతుతో కూడిన విముక్తి చర్యను సహజ తెలుగులో తెలియజేస్తుంది; తరువాతి ἐλεύθεροι పదంతో ఉన్న పదసంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: ὄντως
  choice: నిజంగా
  rationale: స్వేచ్ఛ వాస్తవమైనదని, యథార్థమైనదని నొక్కిచెప్పే క్రియావిశేషణ బలాన్ని సరళంగా వ్యక్తం చేస్తుంది.
- source_word: ἐλεύθεροι
  choice: స్వతంత్రులు
  rationale: ఇది చర్యకన్నా ఫలిత స్థితిని తెలిపే విశేషణం. ‘స్వతంత్రులు’ వ్యక్తుల స్థితిని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔσεσθε
  choice: అై ఉంటారు
  rationale: భవిష్య స్థితిని సూచించే ἔσεσθε భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘కుమారుడు’ ఎవరిని సూచిస్తున్నాడు
  choice: యేసును ప్రత్యేకంగా సూచించే క్రీస్తు సంబంధ బిరుదు
  alternative: సాధారణ అర్థంలోని ఒక కుమారుడు
  rationale: యోహాను సందర్భంలో ‘కుమారుడు’ యేసు అధికారాన్ని, ఇంటిలో ఆయన శాశ్వత స్థానాన్ని సూచించే నిర్దిష్ట బిరుదు. అనువాదం దీనిని సాధారణ వ్యక్తిగా మార్చదు.
- issue: ఇక్కడ చెప్పబడిన స్వాతంత్ర్య స్వభావం
  choice: యథార్థమైన, సంపూర్ణ భావంలోని స్వాతంత్ర్యం; వాక్యంలో దాని పరిధిని మరింత సంకుచితం చేయలేదు
  alternative: కేవలం ఆధ్యాత్మిక స్వాతంత్ర్యం లేదా కేవలం సామాజిక స్వాతంత్ర్యం
  rationale: తక్షణ సందర్భం పాపానికి దాసత్వాన్ని ప్రస్తావించినా, ఈ వాక్యం ఫలితాన్ని విస్తృతంగా ప్రకటిస్తుంది. ‘నిజంగా స్వతంత్రులు’ అనే రూపం ఆ బలాన్ని నిలుపుతూ పాఠ్యంలో లేని పరిమితిని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలి. ‘విడుదల’ కంటే ‘స్వతంత్రులు’ అనే పదాన్ని ఎంచుకోవడం ద్వారా గ్రీకులోని ἐλευθερόω/ἐλεύθερος పదసంబంధం సాధ్యమైనంతవరకు నిలుపబడింది.
