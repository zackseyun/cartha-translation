  terminology: ‘పాపాల్లోనే,’ ‘నమ్మకపోతే,’ and ‘చనిపోతారు’ are clear, standard, and appropriately non-interpretive. The footnote rightly preserves the literal alternative and avoids doctrinally resolving the expression.
