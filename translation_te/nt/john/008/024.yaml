  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: te
  text: అందుకే, మీరు మీ పాపాల్లోనే చనిపోతారని మీకు చెప్పాను. ఎందుకంటే, ‘నేనే’[a] అని మీరు నమ్మకపోతే, మీ పాపాల్లోనే చనిపోతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో దీన్ని మరింత పదశఃగా ‘నేను ఉన్నాను’ అని అనువదించవచ్చు. ‘నేను ఉన్నాను’ అనే మాటలో స్పష్టమైన విధేయపదం గ్రీకులో లేదు; ఈ మాటకు యోహాను సువార్తలో మరింత లోతైన ప్రతిధ్వని ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: అందుకే ... మీతో చెప్పాను
  rationale: οὖν ముందున్న సందర్భం నుంచి వచ్చే నిర్ధారణను సూచిస్తుంది; ‘అందుకే’ ఆ అనుసంధానాన్ని సహజమైన తెలుగులో చూపుతుంది. ὑμῖν దాత్యర్థాన్ని ‘మీతో’ ద్వారా వ్యక్తం చేశాం.
- source_word: ἀποθανεῖσθε
  choice: చనిపోతారు / చనిపోతారని
  rationale: భవిష్యత్ కాలంలోని ἀποθνῄσκωకు నేరమైన, సాధారణ తెలుగు రూపం; ‘నశిస్తారు’ అనే అదనపు వ్యాఖ్యానార్థాన్ని చేర్చలేదు.
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: మీ పాపాల్లోనే
  rationale: ἁμαρτίαις అనే బహువచనాన్ని ‘పాపాలు’గా నిలిపి, ἐν సూచించే స్థితి లేదా పరిధిని ‘లో’తో తెలిపాం. ‘నే’ ఆ స్థితిలోనే చనిపోవడాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: ἐὰν γὰρ μὴ
  choice: ఎందుకంటే ... నమ్మకపోతే
  rationale: γάρ ముందటి ప్రకటనకు కారణాన్ని ఇస్తుంది; ἐὰν μή ప్రతికూల షరతును సూచిస్తుంది. తెలుగు వాక్య నిర్మాణానికి తగినట్లు ఈ రెండింటినీ విడదీసి సహజంగా వ్యక్తం చేశాం.
- source_word: πιστεύσητε
  choice: మీరు నమ్మకపోతే
  rationale: యోహాను రచనలో πιστεύωకు సాధారణమైన ‘నమ్ము’ అనే అర్థాన్ని వాడాం; విశ్వాసం లేదా ఆధారపడడం అనే భావాన్ని అనవసరంగా విస్తరించలేదు.
- source_word: ὅτι ἐγώ εἰμι
  choice: ‘నేనే’ అని
  rationale: గ్రీకులో ἐγώ εἰμι తరువాత స్పష్టమైన విధేయపదం లేదు. తెలుగు ‘నేనే’ స్వీయ గుర్తింపును సహజంగా తెలిపినా, ‘ఆయన’ వంటి విధేయపదాన్ని చేర్చదు; అందువల్ల మూలంలోని సంక్షిప్తతను, సంభావ్య గాఢ ప్రతిధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: స్పష్టమైన విధేయపదం లేని ἐγώ εἰμι పదబంధం
  choice: ‘నేనే’ అని
  alternative: ‘నేను ఉన్నాను’ అని; లేదా ‘నేనే ఆయనను’ అని
  rationale: ‘నేనే ఆయనను’ అనడం గుర్తింపును స్పష్టం చేసినా, మూలంలో లేని ‘ఆయనను’ చేర్చుతుంది. ‘నేను ఉన్నాను’ మరింత పదశః రూపమైనా తెలుగులో ప్రధానంగా ఉనికిని మాత్రమే సూచించేలా వినిపించవచ్చు. ప్రధాన పాఠంలోని ‘నేనే’ సహజమైన స్వీయ గుర్తింపును ఇస్తూనే విధేయపదాన్ని పూరించకుండా, యోహాను సువార్తలో ఉండగల లోతైన ప్రతిధ్వనిని తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. పునరుక్తిని మూలపాఠానికి అనుగుణంగా నిలిపాం. ఉటంకించిన ‘నేనే’ ద్వారా మూలంలోని అసంపూర్ణంగా కనిపించే స్వీయ గుర్తింపును సహజంగా ఉంచాం.
