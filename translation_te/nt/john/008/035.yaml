id: JHN.8.35
reference: John 8:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: te
  text: దాసుడు ఇంట్లో ఎప్పటికీ ఉండడు[a]; కుమారుడు ఎప్పటికీ ఉంటాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సేవకుడు’; గ్రీకు పదం బంధిత దాసునినీ సేవకునినీ సూచించగలదు. ఇక్కడ కుమారునితో ఉన్న స్థాయి వ్యత్యాసం వల్ల ‘దాసుడు’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: ‘కుమారుడు’ అనే మాట సామెతలాంటి ఈ వాక్యంలో కుటుంబంలోని కుమారుని సూచిస్తుంది; చుట్టూ ఉన్న సందర్భంలో అది యేసును కూడా పరోక్షంగా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: దాసుడు
  rationale: కుటుంబంలో కుమారునితో భిన్నమైన, శాశ్వత హక్కులేని బంధిత స్థితిని తెలుపుతుంది. ఆధునిక తెలుగులో ‘దాసుడు’ ఈ భావాన్ని సహజంగా మోస్తుంది; ‘సేవకుడు’ సేవ చేసే పాత్రను మాత్రమే సూచించే అవకాశం ఉంది.
- source_word: μένει
  choice: ఉంటాడు / ఉండడు
  rationale: రెండు చోట్లా ఒకే తెలుగు క్రియామూలాన్ని వాడి గ్రీకు పునరుక్తిని నిలిపాం; ఇక్కడ ఇది ఇంటివారిలో కొనసాగి ఉండే స్థితిని సూచిస్తుంది.
- source_word: οἰκία
  choice: ఇంటివారిలో
  rationale: కేవలం భవనంలో నివసించడం కాక, కుటుంబ గృహవ్యవస్థలో సభ్యత్వం మరియు స్థానం ప్రధానంగా ఉన్నందున ఈ రూపం ఎంచుకున్నాం.
- source_word: εἰς τὸν αἰῶνα
  choice: శాశ్వతంగా
  rationale: నిలకడైన కొనసాగింపును ఆధునిక, సహజ తెలుగులో తెలియజేస్తుంది; రెండు ఉపవాక్యాల్లోనూ ఒకే విధంగా ఉంచాం.
- source_word: υἱός
  choice: కుమారుడు
  rationale: గ్రీకులోని పుంలింగ ఏకవచనాన్ని, అలాగే దాసునితో ఉన్న కుటుంబ-స్థాయి వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ స్వల్పమైన సంభాషణా పురోగతి లేదా వ్యత్యాసాన్ని సూచిస్తుంది. తెలుగులో వాక్య నిర్మాణమే వ్యత్యాసాన్ని స్పష్టంగా చూపుతున్నందున అదనపు ‘అయితే’ అవసరం లేదు.
theological_decisions:
- issue: ‘కుమారుడు’ అనే పదంలో యేసును సూచించే క్రీస్తుసంబంధ ప్రతిధ్వని
  choice: ప్రధాన పాఠ్యంలో సాధారణమైనప్పటికీ సందర్భంలో సూచనాత్మకమైన ‘కుమారుడు’ అనే రూపాన్నే ఉంచాం.
  alternative: ‘కుమారుడు’ను ఈ వచనంలోనే స్పష్టమైన క్రీస్తు బిరుదుగా వివరించడం
  rationale: ఈ మాట కుటుంబస్థితిని తెలిపే సామెతలాగా పనిచేస్తూనే, తరువాతి వచనంలో యేసు చేసే అన్వయానికి దారితీస్తుంది. ప్రధాన పాఠ్యం ఈ ద్వంద్వసంభావ్యతను ముందుగానే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఇంటివారిలో’ ద్వారా భౌతిక ఇల్లు కంటే కుటుంబానికి చెందిన స్థానం ప్రధానంగా వ్యక్తమవుతుంది. మూలంలోని సమాంతర నిర్మాణం, ‘ఉండు’ క్రియ పునరుక్తి నిలిపాం.
