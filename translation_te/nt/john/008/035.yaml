revisions:
- from: దాసుడు ఇంటివారిలో శాశ్వతంగా ఉండడు[a]; కుమారుడు శాశ్వతంగా ఉంటాడు.[b]
  to: దాసుడు ఇంట్లో ఎప్పటికీ ఉండడు[a]; కుమారుడు ఎప్పటికీ ఉంటాడు.[b]
  rationale: Revised only the household locative and the idiomatic expression for enduring permanence. The translation continues to preserve the Greek's generic-but-pointed “the son,” the repeated verb, and the balanced contrast without forcing a christological reading.
  reviewer_model: gpt-5.6-terra
