id: JHN.8.42
reference: John 8:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: te
  text: 'యేసు వారితో ఇలా అన్నాడు: “దేవుడు మీ తండ్రి అయి ఉంటే, మీరు నన్ను ప్రేమించి ఉండేవారు. ఎందుకంటే నేను దేవుని నుండి బయలుదేరి వచ్చాను, ఇక్కడ ఉన్నాను.[a] ఎందుకంటే నేను నా అంతట నేనే రాలేదు;[b] ఆయనే నన్ను పంపించాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “నేను దేవుని నుండి వెలువడ్డాను, వచ్చి ఉన్నాను.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నేను నా నుంచే రాలేదు.” గ్రీకు మాటలు మూలాన్ని లేదా స్వతంత్ర చొరవను నొక్కి చెప్పగలవు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ... ἦν ... ἠγαπᾶτε ἂν
  choice: దేవుడు మీ తండ్రి అయి ఉంటే, మీరు నన్ను ప్రేమించి ఉండేవారు
  rationale: ఈ గ్రీకు నిర్మాణం వాస్తవానికి విరుద్ధమైన షరతును సూచిస్తుంది. తెలుగులో ‘అయి ఉంటే ... ప్రేమించి ఉండేవారు’ అనే నిర్మాణం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον
  choice: నేను దేవుని దగ్గరనుంచి బయలుదేరి వచ్చాను
  rationale: ἐκ మూలాన్ని, ἐξῆλθον బయలుదేరి రావడాన్ని సూచిస్తాయి. ఈ అనువాదం సాధారణంగా అర్థమయ్యే భాషలో మూలం మరియు గమన భావాలు రెండింటినీ నిలుపుతుంది.
- source_word: καὶ ἥκω
  choice: ఇప్పుడు ఇక్కడ ఉన్నాను
  rationale: ἥκω రావడం వల్ల ఏర్పడిన ప్రస్తుత హాజరును సూచించగలదు; ‘ఇప్పుడు ఇక్కడ ఉన్నాను’ ఆ ప్రస్తుత ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: నేను నా అంతట నేనే రాలేదు
  rationale: ἀπ’ ἐμαυτοῦ అనే మాట మూలాన్ని లేదా స్వతంత్ర చొరవను సూచించవచ్చు. ‘నా అంతట నేనే’ స్వయంగా నిర్ణయించుకొని రావడం కాదనే భావాన్ని సహజంగా తెలియజేస్తూ అస్పష్టతను కొంతవరకు నిలుపుతుంది.
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: ఆయనే నన్ను పంపించాడు
  rationale: ἐκεῖνος ఇక్కడ దేవుణ్ణి నొక్కి చెబుతుంది. ‘ఆయనే’ ఆ ఉద్ఘాటనను, ‘పంపించాడు’ మిషన్ భావాన్ని నిలుపుతాయి.
theological_decisions:
- issue: యేసు దేవుని దగ్గరనుంచి రావడాన్ని తరువాతి సాంకేతిక సిద్ధాంత పదజాలం లేకుండా అనువదించడం
  choice: నేను దేవుని దగ్గరనుంచి బయలుదేరి వచ్చాను, ఇప్పుడు ఇక్కడ ఉన్నాను
  alternative: నేను దేవుని నుంచి ఉద్భవించి వచ్చాను
  rationale: మూలపాఠం యేసు యొక్క దేవుని సంబంధమైన మూలాన్నీ పంపబడిన కార్యాన్నీ బలంగా ప్రకటిస్తుంది. అయితే ‘ఉద్భవించడం’ వంటి తరువాత సాంకేతిక అర్థం పొందగల పదాన్ని ప్రధాన పాఠంలో రుద్దకుండా, గ్రీకు సాధారణ గమన క్రియల భావాన్ని నిలిపాం.
- issue: ἀπ’ ἐμαυτοῦ లో మూలం మరియు స్వతంత్ర చొరవ మధ్య భావవ్యాప్తి
  choice: నా అంతట నేనే రాలేదు
  alternative: నా నుంచే నేను రాలేదు
  rationale: ప్రసంగ సందర్భంలో యేసు తన స్వతంత్ర చొరవతో రాలేదని, దేవుడు పంపాడని చెప్పడం ప్రధానంగా కనిపిస్తుంది; అయినా గ్రీకు పదబంధంలోని మూల భావాన్ని పూర్తిగా తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘తండ్రి’ అనే సంబంధపదాన్ని సహజ తెలుగు విధానంలో వాడాం; దేవుణ్ణి సూచించే సర్వనామంలో ‘ఆయనే’ ద్వారా గ్రీకు ఉద్ఘాటనను నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
