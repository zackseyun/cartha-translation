id: JHN.8.58
reference: John 8:58
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν ⸀αὐτοῖς Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, πρὶν Ἀβραὰμ γενέσθαι ἐγὼ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: te
  text: 'యేసు వారితో ఇలా అన్నాడు: “నిజంగా, నిజంగా మీతో చెబుతున్నాను: అబ్రాహాము ఉనికిలోకి రాకముందే[a], నేను ఉన్నాను[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అబ్రాహాము పుట్టకముందే.” గ్రీకు క్రియకు “ఉనికిలోకి రావడం” లేదా “కలగడం” అనే మరింత విస్తృత భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నేను అప్పటినుంచి ఉన్నాను.” గ్రీకు మూలంలో అక్షరార్థంగా “నేను ఉన్నాను” అని వర్తమానకాలంలో ఉంది; అందువల్ల దానిలో ఉండగల దైవశాస్త్రీయ ప్రతిధ్వని ప్రధాన పాఠంలో నిలుపబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: యేసు వారితో ఇలా అన్నాడు
  rationale: గ్రీకు కథన పరిచయాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: Ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: రెండుసార్లు వచ్చిన గంభీరమైన ధృవీకరణ సూత్రాన్ని అలాగే ఉంచుతూ, సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యేలా వ్యక్తపరుస్తుంది.
- source_word: λέγω ὑμῖν
  choice: మీతో చెబుతున్నాను
  rationale: యోహాను సువార్తలోని గంభీర ప్రత్యక్ష సంబోధనను దగ్గరగా ప్రతిబింబిస్తుంది.
- source_word: πρὶν
  choice: రాకముందే
  rationale: అనంతర క్రియతో కలిసి ముందరి కాలాన్ని స్పష్టంగా సూచిస్తుంది; ‘ఏ’ ఉద్ఘాటన వాక్యంలోని కాల వ్యత్యాసానికి సహజంగా బలం ఇస్తుంది.
- source_word: γενέσθαι
  choice: ఉనికిలోకి రాక
  rationale: γίνομαι అనే క్రియను కేవలం శారీరక జననానికి పరిమితం చేయకుండా, ‘కలగడం/ఉనికిలోకి రావడం’ అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ἐγὼ εἰμί
  choice: నేను ఉన్నాను
  rationale: గ్రీకులోని వర్తమానకాల రూపాన్ని నేరుగా నిలుపుతూ, సందర్భంలోని అసాధారణమైన సంపూర్ణ స్వీయ ప్రకటనను మరియు దాని సాధ్యమైన దైవశాస్త్రీయ ప్రతిధ్వనిని మసకబారనివ్వదు.
- source_word: Ἀβραὰμ
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions:
- issue: క్రీస్తుశాస్త్ర ప్రాధాన్యం గల సందర్భంలో ἐγὼ εἰμί అనువాదం
  choice: నేను ఉన్నాను
  alternative: నేను అప్పటినుంచి ఉన్నాను; నేను ఉనికిలో ఉన్నాను
  rationale: మూలంలోని వర్తమానకాలాన్ని, అసాధారణమైన స్వతంత్ర ప్రకటనను ప్రధాన పాఠంలో నిలుపుతుంది. ఇది కేవలం పూర్వ ఉనికినే సూచిస్తుందని ముందుగానే తేల్చకుండా, దైవ స్వీయ గుర్తింపుతో ఉండగల ప్రతిధ్వనిని పాఠకుడికి తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణం. పాత తెలుగు క్రియారూపాలను నివారించి, మూలంలోని పునరుక్తి, కాల వ్యత్యాసం, దైవశాస్త్రీయ ఉద్వేగాన్ని నిలిపింది.
