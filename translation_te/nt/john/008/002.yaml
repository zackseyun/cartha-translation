  yaml_path: translation/nt/john/008/002.yaml
  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
translation:
  language: te
  text: తెల్లవారుజామున ఆయన మళ్లీ దేవాలయానికి వచ్చాడు. ప్రజలందరూ ఆయన దగ్గరికి వస్తూ ఉన్నారు. ఆయన కూర్చొని వారికి బోధించడం మొదలుపెట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం వ్యభిచారంలో పట్టుబడిన స్త్రీ కథకు (యోహాను 7:53–8:11) కొనసాగింపు. ఆ కథ తొలి గ్రీకు ప్రతుల్లో లేదు. యోహాను 7:53లోని గమనిక చూడండి.
    reason: textual_critical
lexical_decisions:
- source_word: Ὄρθρου
  choice: తెల్లవారుజామున
  rationale: సూర్యోదయానికి కాస్త ముందు లేదా సూర్యోదయ సమయంలోని వేళను సూచించే కాలార్థక ప్రయోగం; ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: παρεγένετο
  choice: వచ్చాడు
  rationale: ఒక ప్రదేశానికి చేరుకోవడాన్ని సూచిస్తుంది; ‘దేవాలయానికి’ అనే గమ్యంతో ఈ సాధారణ రూపం సహజంగా సరిపోతుంది.
- source_word: ἱερόν
  choice: దేవాలయం
  rationale: లోపలి పరిశుద్ధ స్థలాన్ని మాత్రమే కాకుండా, ప్రజలు కూడి బోధ వినగలిగే మొత్తం దేవాలయ ప్రాంగణాన్ని సూచిస్తుంది; సందర్భంలో ‘దేవాలయం’ ఆ విస్తృత భావాన్ని మోస్తుంది.
- source_word: ἤρχετο
  choice: వస్తూ ఉన్నారు
  rationale: సమూహంగా ప్రజలు ఆయన దగ్గరికి వస్తున్న కొనసాగుతున్న చర్యను అసంపూర్ణ భూతకాల రూపానికి అనుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: καθίσας
  choice: కూర్చొని
  rationale: బోధించే చర్యకు ముందు ఆయన కూర్చున్నాడని సూచించే పూర్వకాలిక క్రియను సహజమైన తెలుగు అనుసంధాన రూపంలో అందిస్తుంది.
- source_word: ἐδίδασκεν
  choice: బోధించడం మొదలుపెట్టాడు
  rationale: అసంపూర్ణ భూతకాలానికి ఇక్కడ సాధ్యమైన ఆరంభార్థాన్ని వ్యక్తం చేస్తుంది; ఆయన కూర్చున్న తరువాత బోధన ప్రారంభించిన సంఘటన క్రమానికి సహజంగా సరిపోతుంది.
