translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రజా బోధన జరిగిన విస్తృత దేవాలయ ప్రాంగణ భావం సందర్భానుసారంగా నిలుపబడింది.
