  yaml_path: translation/nt/john/008/011.yaml
  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: te
  text: ఆమె[a], “ఎవరూ లేరు, ప్రభువా” అని చెప్పింది. అప్పుడు యేసు, “నేనూ నిన్ను దోషిగా తీర్పు తీర్చను. వెళ్లు; ఇకపై పాపం చేయకు” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వ్యభిచారం చేస్తూ పట్టుబడిన స్త్రీ కథలోని చివరి వచనం ఇది (యోహాను 7:53–8:11). యోహాను 7:53లోని గమనిక చూడండి.
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: ప్రభువా
  rationale: సంబోధన రూపంలోని κύριε మర్యాదపూర్వకంగా ‘అయ్యా’ అని కూడా అర్థమవగలదు; అయితే ఈ సందర్భంలో యేసు అధికారాన్ని గుర్తించే సంప్రదాయబద్ధమైన భావాన్ని నిలుపుతూ ‘ప్రభువా’ అని అనువదించాం.
- source_word: κατακρίνω
  choice: దోషిగా తీర్పు తీర్చను
  rationale: ఈ పదానికి న్యాయపరంగా ఒకరిని దోషిగా నిర్ధారించి ఖండించే భావం ఉంది. ‘దోషిగా తీర్పు తీర్చను’ అనే రూపం ఆ న్యాయపరమైన సందర్భాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: μηκέτι
  choice: ఇకపై … చేయకు
  rationale: ఇప్పటి నుండి ఆ క్రియను మానేయాలనే కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἁμάρτανε
  choice: పాపం చేయకు
  rationale: ప్రస్తుతకాల నిషేధ ఆజ్ఞతో కలిసి, పాపం చేయడాన్ని ఇక కొనసాగించవద్దనే అర్థాన్ని సూటిగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: κύριε అనే సంబోధనలోని భావ పరిధి
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: గ్రీకు పదం మర్యాదపూర్వక సంబోధనగానూ అధికారాన్ని గుర్తించే సంబోధనగానూ ఉండగలదు. పాఠ్యంలో ఉన్న సంభావ్య గౌరవార్థాన్ని తగ్గించకుండా ‘ప్రభువా’ను ఎంచుకున్నాం; దీనికి మించిన క్రీస్తుశాస్త్ర నిర్ధారణను వచనంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. న్యాయపరమైన κατακρίνω భావాన్ని ‘శిక్ష విధించను’ అని సంకుచితం చేయకుండా ‘దోషిగా తీర్పు తీర్చను’గా ఉంచాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో [a]గా చేర్చబడింది.
