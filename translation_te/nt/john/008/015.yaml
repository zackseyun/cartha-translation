lexical_decisions:
- source_word: ὑμεῖς
  choice: మీరు
  rationale: స్పష్టంగా ఉన్న ద్వితీయ పురుష బహువచన సర్వనామాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; తరువాతి ‘నేను’తో ఉన్న వ్యత్యాసం వాక్య నిర్మాణంలో స్పష్టంగా ఉంటుంది.
- source_word: κατὰ τὴν σάρκα
  choice: శరీరానుసారంగా
  rationale: σάρξ అనే మూలపదాన్ని ‘శరీరం’గా నిలుపుతూ, కేవలం మానవ ప్రమాణాల ప్రకారం లేదా పైకి కనిపించేదాన్ని బట్టి తీర్పు చెప్పడం అనే భావసాధ్యతను పరిష్కరించకుండా కాపాడుతుంది.
- source_word: κρίνετε
  choice: తీర్పుతీరుస్తారు
  rationale: వర్తమానకాల ద్వితీయ పురుష బహువచన క్రియను నేరుగా, గౌరవప్రదమైన సాధారణ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐγὼ
  choice: నేను
  rationale: గ్రీకులో స్పష్టంగా ఉన్న ప్రథమ పురుష సర్వనామాన్ని నిలుపి, ‘మీరు’తో వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: οὐ κρίνω οὐδένα
  choice: నేను ఎవరికీ తీర్పుతీర్చను
  rationale: నిరాకరణ బలాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో సంక్షిప్తంగా కాపాడుతుంది.
theological_decisions:
- issue: κατὰ τὴν σάρκα లో σάρξ యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘శరీరానుసారంగా’ అని ఉంచడం
  alternative: ‘మానవ ప్రమాణాల ప్రకారం’ లేదా ‘పైకి కనిపించేదాన్ని బట్టి’
  rationale: ఈ సందర్భంలో మాట కేవలం మానవీయమైన, లోకసంబంధమైన లేదా బాహ్య ప్రమాణాల ప్రకారం తీర్పు చెప్పడాన్ని సూచించవచ్చు. అయినా, ఒకే వ్యాఖ్యానాన్ని పాఠ్యంలో స్థిరపరచకుండా యోహాను వాడిన పదబంధంలోని ఉద్దేశపూర్వక భావవిస్తృతిని నిలుపుతుంది.
