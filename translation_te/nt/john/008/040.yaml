language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: te
  text: కానీ ఇప్పుడు, దేవుని నుండి విన్న సత్యాన్ని మీకు చెప్పిన మనిషినైన నన్ను చంపాలని మీరు ప్రయత్నిస్తున్నారు. అబ్రాహాము ఇలా చేయలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: కానీ ఇప్పుడు
  rationale: δέ యొక్క వ్యతిరేక భావాన్ని, νῦν యొక్క కాలసూచక వ్యత్యాసాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: నన్ను చంపాలని మీరు చూస్తున్నారు
  rationale: ζητέω + క్రియార్థక రూపం ఉద్దేశపూర్వకంగా ఏదైనా చేయడానికి చూడటం లేదా ప్రయత్నించడం అనే భావాన్ని ఇస్తుంది; వర్తమానంలో కొనసాగుతున్న ప్రయత్నాన్ని ఈ తెలుగు రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀποκτεῖναι
  choice: చంపాలని
  rationale: అసలు క్రియలో లేని న్యాయపరమైన లేదా నైతిక అదనపు భావాన్ని చేర్చకుండా నేరుగా అర్థాన్ని అందిస్తుంది.
- source_word: ἄνθρωπον
  choice: మనిషినైన
  rationale: యేసు తనను తాను ఒక మనిషిగా పేర్కొంటున్న స్పష్టమైన మానవత్వ భావాన్ని నిలుపుతూ, తెలుగు వాక్య నిర్మాణంలో సహజంగా సరిపోతుంది.
- source_word: τὴν ἀλήθειαν
  choice: సత్యాన్ని
  rationale: నిర్దిష్టంగా ఆయన తెలిపిన సత్యవిషయాన్ని సూచిస్తుంది; యోహాను రచనలోని ‘సత్యం’ ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: ὑμῖν λελάληκα
  choice: మీకు చెప్పిన
  rationale: పూర్తయినప్పటికీ ప్రస్తుత సందర్భానికి వర్తించే మాటను సహజమైన తెలుగు సంబంధవాచక నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: దేవుని దగ్గర విన్న
  rationale: παρά + షష్ఠీ విభక్తి సూచించే మూలాన్ని ‘దేవుని దగ్గర’ అనే సహజ తెలుగు ప్రయోగంతో తెలియజేస్తుంది; ‘తండ్రి’ అనే పాఠ్యంలో లేని ప్రత్యేక బిరుదును చేర్చదు.
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: అబ్రాహాము ఇలా చేయలేదు
  rationale: τοῦτο సూచించే ముందటి ప్రవర్తనను సహజ తెలుగులో తిరిగి సూచిస్తూ, అబ్రాహాము ప్రవర్తనతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἄνθρωπον అనే పదంలో యేసు తనను వివరించుకోవడం
  choice: మనిషినైన
  alternative: మానవుడినైన
  rationale: అసలు పదం యేసు నిజమైన మానవత్వాన్ని స్పష్టంగా చెబుతుంది. ‘మనిషి’ సాధారణ పాఠకులకు సహజంగా ఉండి, ఆయన దైవత్వాన్ని నిరాకరించకుండా పాఠ్యంలో చెప్పిన మానవత్వాన్ని మాత్రమే నిబద్ధంగా అందిస్తుంది.
- issue: παρὰ τοῦ θεοῦ లో యేసు సందేశపు మూలం
  choice: దేవుని దగ్గర
  alternative: తండ్రి దగ్గర
  rationale: గ్రీకు పాఠ్యంలో ‘దేవుడు’ అని ఉంది, ‘తండ్రి’ అని లేదు. అందువల్ల మరింత నిర్దిష్టమైన వేదాంత బిరుదును అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘చంపాలని మీరు చూస్తున్నారు’ ఉద్దేశపూర్వకంగా కొనసాగుతున్న ప్రయత్నాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘దేవుని దగ్గర’ సందేశపు మూలాన్ని తెలుగులో సులభంగా తెలియజేస్తుంది.
