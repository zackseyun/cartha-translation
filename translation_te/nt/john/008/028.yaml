id: JHN.8.28
reference: John 8:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: te
  text: 'కాబట్టి యేసు ఇలా అన్నాడు: “మీరు మనుష్యకుమారుణ్ణి పైకి ఎత్తినప్పుడు[a], నేనే అని[b], నా అంతట నేనేమీ చేయనని, తండ్రి నాకు బోధించిన ప్రకారమే ఈ సంగతులు మాట్లాడుతున్నానని అప్పుడు మీరు తెలుసుకుంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పైకి ఎత్తడం” అనేది శారీరకంగా పైకి ఎత్తబడడాన్నీ, యోహాను వాడుకలో మహిమపరచబడడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “నేనే.” గ్రీకులో విధేయపదం లేకుండా కేవలం “నేను ఉన్నాను” (ἐγώ εἰμι) అని ఉంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సంభాషణ నుంచి వచ్చే కొనసాగింపు లేదా నిర్ధారణను సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: Ὅταν
  choice: ఎత్తినప్పుడు
  rationale: ఉపసంభావ్య రూపంతో చెప్పబడిన నిర్దిష్టమైన భవిష్యత్ సంఘటనను ‘అప్పుడు/ఎప్పుడు’ భావంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑψώσητε
  choice: పైకి ఎత్తినప్పుడు
  rationale: శారీరకంగా పైకి ఎత్తడాన్నీ, యోహాను వాడుకలో మహిమపరచబడడాన్నీ సూచించగల ద్వంద్వార్థాన్ని కాపాడుతుంది.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుణ్ణి
  rationale: సువార్తల్లోని స్వీయ సంబోధనను, దాని పాత నిబంధన ప్రతిధ్వనులను కాపాడే స్థిరమైన తెలుగు రూపం.
- source_word: γνώσεσθε
  choice: మీరు తెలుసుకుంటారు
  rationale: భవిష్యత్తులో కలిగే గ్రహింపు లేదా గుర్తింపును సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐγώ εἰμι
  choice: నేనే ఆయననని
  rationale: గ్రీకులో విధేయపదం లేకపోయినా, తెలుగులో వాక్యం సహజంగా ఉండేందుకు సందర్భానుగుణమైన ‘ఆయన’ను జోడించింది; మూలంలోని సంక్షిప్త, గంభీర రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: నా అంతట నేనే
  rationale: తన నుంచే పుట్టిన చర్య లేదా స్వతంత్ర చొరవ అనే భావాన్ని సహజమైన తెలుగు నుడికారంతో తెలియజేస్తుంది.
- source_word: ποιῶ οὐδέν
  choice: ఏమీ చేయను
  rationale: యేసు తండ్రిపై ఆధారపడడాన్ని తెలిపే సాధారణ వర్తమాన ప్రకటనగా మూల భావాన్ని కాపాడుతుంది.
- source_word: καθὼς ἐδίδαξέν με ὁ πατήρ
  choice: తండ్రి నాకు బోధించిన ప్రకారమే
  rationale: καθώς లోని సరిగ్గా అనుగుణంగా అనే తులనాత్మక బలాన్ని ‘ప్రకారమే’ నిలుపుతుంది.
- source_word: ταῦτα λαλῶ
  choice: ఈ సంగతులు చెబుతున్నాను
  rationale: ταῦτα అనే సూచనను స్పష్టంగా ఉంచుతూ, ఆధునిక తెలుగులో సహజమైన మాటను ఉపయోగిస్తుంది.
theological_decisions:
- issue: విధేయపదం లేని ἐγώ εἰμι అనువాదం
  choice: నేనే ఆయనను
  alternative: నేనే
  rationale: ప్రధాన పాఠంలో సహజమైన తెలుగు కోసం సందర్భానుగుణ విధేయపదాన్ని వాడినా, యోహాను వాక్యంలోని ఉద్దేశపూర్వక అస్పష్టతను, దైవీయ స్వీయ ప్రకటనతో ఉండగల ప్రతిధ్వనిని పాదసూచికలో కాపాడింది.
- issue: యోహాను సందర్భంలో ὑψώσητε అర్థం
  choice: పైకి ఎత్తడం
  alternative: సిలువ వేయడం; మహిమపరచడం
  rationale: ఈ క్రియ సిలువపై భౌతికంగా ఎత్తబడడాన్నీ, మహిమపరచబడడాన్నీ కలిపి సూచించగలదు; ఒకే అర్థానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడింది. మూలంలోని వాక్య నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో అసహజమైన పదానువాదాన్ని నివారించింది. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల దగ్గరే ఉంచింది.
