id: JHN.8.44
reference: John 8:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: te
  text: మీరు మీ తండ్రియైన అపవాది నుండి వచ్చినవారు; మీ తండ్రి కోరికలను చేయాలని మీరు కోరుకుంటున్నారు. అతడు ఆది నుంచే హంతకుడు, సత్యంలో నిలిచి ఉండలేదు[a], ఎందుకంటే అతనిలో సత్యం లేదు. అతడు అబద్ధం పలికినప్పుడల్లా, తన సొంత స్వభావం నుండే పలుకుతాడు[b], ఎందుకంటే అతడు అబద్ధికుడు, అబద్ధానికి తండ్రి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సత్యంలో నిలబడడు.’ గ్రీకు రూపం అతడు ఒకప్పుడు సత్యంలో ఉండి తరువాత దానిని విడిచాడని తప్పనిసరిగా చెప్పదు.
    reason: theological_ambiguity
  - marker: b
    text: అక్షరార్థంగా, ‘తన సొంత వాటినుండి పలుకుతాడు’; అంటే, తనకు సహజంగా చెందిన స్వభావం లేదా లక్షణం నుండే పలుకుతాడు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘దాని తండ్రి.’ ఇక్కడ ‘దాని’ అనేది సహజంగా ‘అబద్ధం’ను సూచిస్తుంది; భావానువాదంగా ‘అబద్ధాల తండ్రి’ అని కూడా చెప్పవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: మీరు మీ తండ్రియైన అపవాది సంబంధులు
  rationale: ἐκ మూలం లేదా చెందినతనాన్ని సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘సంబంధులు’ అని ఇచ్చి, అపవాదే వారి తండ్రి అనే కఠిన భావాన్ని నిలిపాం.
- source_word: ἐπιθυμίας ... θέλετε ποιεῖν
  choice: కోరికలను నెరవేర్చాలని కోరుకుంటున్నారు
  rationale: ἐπιθυμία ఇక్కడ కేవలం లైంగిక ‘దురాశ’ కాదు; విస్తృతమైన కోరిక. θέλετε ποιεῖν ఉద్దేశపూర్వక సంకల్పాన్ని తెలియజేస్తుంది.
- source_word: ἀνθρωποκτόνος
  choice: నరహంతకుడు
  rationale: మనుష్యులను చంపేవాడనే నైతిక భావాన్ని గౌరవప్రదమైన, సుపరిచితమైన తెలుగు పదం వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: సత్యంలో నిలిచి ఉండలేదు
  rationale: ‘నిలుచుట’ అనే గ్రీకు రూపకాన్ని కాపాడుతుంది; అతడు మునుపు సత్యంలో ఉండి తరువాత పడిపోయాడని స్పష్టంగా తేల్చదు.
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: అతడు అబద్ధం పలికినప్పుడల్లా
  rationale: తెలుగులో సహజంగా ఉండే విధంగా అనువదించాం; గ్రీకులోని ఏకవచన నిర్దిష్ట రూపం ‘అబద్ధాన్ని పలికినప్పుడల్లా’ అని అక్షరార్థంగా చెప్పవచ్చు.
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: తనలోనుండే పలుకుతాడు
  rationale: ‘తనకు చెందిన వాటినుండి’ అనే గ్రీకు నుడికారాన్ని, అబద్ధం అతని స్వభావం/సొంత లక్షణం నుండి వస్తుందనే అర్థంతో సహజ తెలుగులో అందిస్తుంది.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: అబద్ధానికి తండ్రి
  rationale: αὐτοῦను సమీప పూర్వపదమైన τὸ ψεῦδοςకు అన్వయించి, అపవాది అబద్ధానికి మూలమని తెలిపాం; తెలుగు పాఠకునికి సర్వనామ సందిగ్ధత రాకుండా నామవాచకాన్ని పునరుక్తి చేశాం.
theological_decisions:
- issue: ὁ πατὴρ αὐτοῦ అనే మాటలో αὐτοῦ దేనిని సూచిస్తుంది?
  choice: ‘అబద్ధానికి తండ్రి’—అపవాది అబద్ధానికి మూలం.
  alternative: ‘దాని తండ్రి’; లేదా అక్షరార్థంగా ‘అతని తండ్రి’ అని గ్రహించడం.
  rationale: సమీపంలో ఉన్న τὸ ψεῦδος సహజమైన పూర్వపదం. ‘అతని తండ్రి’ అని తీసుకోవడం సందర్భంలో అసహజమైన, ఊహాత్మకమైన భావాన్ని కలిగిస్తుంది. అయితే గ్రీకు సర్వనామ రూపంలోని సంక్షిప్తతను పాదటిప్పణిలో తెలియజేశాం.
- issue: అపవాది ఒకప్పుడు సత్యంలో నిలిచివున్నాడని వాక్యం సూచిస్తుందా?
  choice: ‘సత్యంలో నిలిచి ఉండలేదు’ అని, ముందటి స్థితిని నిర్ధారించకుండా అనువదించడం.
  alternative: ‘సత్యంలో కొనసాగలేదు’ లేదా ‘సత్యంలో నిలిచి ఉండకుండా తొలగిపోయాడు.’
  rationale: οὐκ ἔστηκεν సత్యంలో అతని నిలకడను నిరాకరిస్తుంది; ‘కొనసాగలేదు’ అని అనువదిస్తే ముందుగా సత్యంలో ఉన్నాడనే వివాదాస్పద భావం మరింత బలంగా వస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కాని స్పష్టమైన వాక్యనిర్మాణం. ‘అపవాది,’ ‘సత్యం,’ ‘నరహంతకుడు’ వంటి పరిచిత బైబిలు పదాలను ఉంచి, అసహజమైన అక్షరానువాదాన్ని పాదటిప్పణుల్లో వివరించాం.
