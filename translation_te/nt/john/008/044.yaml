revisions:
- from: మీరు మీ తండ్రియైన అపవాది సంబంధులు; మీ తండ్రి కోరికలను నెరవేర్చాలని కోరుకుంటున్నారు. అతడు ఆది నుంచే నరహంతకుడు. అతడు సత్యంలో నిలిచి ఉండలేదు[a], ఎందుకంటే అతనిలో సత్యం లేదు. అతడు అబద్ధం పలికినప్పుడల్లా తనలోనుండే పలుకుతాడు[b], ఎందుకంటే అతడు అబద్ధికుడు, అబద్ధానికి తండ్రి[c].
  to: మీరు మీ తండ్రియైన అపవాది నుండి వచ్చినవారు; మీ తండ్రి కోరికలను చేయాలని మీరు కోరుకుంటున్నారు. అతడు ఆది నుంచే హంతకుడు, సత్యంలో నిలిచి ఉండలేదు[a], ఎందుకంటే అతనిలో సత్యం లేదు. అతడు అబద్ధం పలికినప్పుడల్లా, తన సొంత స్వభావం నుండే పలుకుతాడు[b], ఎందుకంటే అతడు అబద్ధికుడు, అబద్ధానికి తండ్రి[c].
  rationale: మొదటి వాక్యంలో ἐκ యొక్క మూలం/చెందినతన భావాన్ని స్పష్టపరచడానికి “అపవాది నుండి వచ్చినవారు” అని సవరించాం. ἐκ τῶν ἰδίων కు ‘తనలోనుండి’ అనే స్థలార్థం రాకుండా, సందర్భంలోని స్వభావ/లక్షణ భావాన్ని ప్రధాన వచనంలో వ్యక్తం చేసి అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచాం. ఇతర చోట్ల మూలంలోని వాక్యప్రవాహం, కాలసూచన, మరియు చివరి సర్వనామంలోని సందిగ్ధతను కాపాడాం.
