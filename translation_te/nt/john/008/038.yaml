id: JHN.8.38
reference: John 8:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: te
  text: నేను తండ్రి సమక్షంలో చూసిన వాటిని చెబుతున్నాను; కాబట్టి మీరు మీ తండ్రి నుండి విన్న వాటిని చేయండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “నేను తండ్రి సమక్షంలో చూసిన వాటిని చెబుతున్నాను; కాబట్టి మీరు తండ్రి నుండి విన్న వాటిని చేయండి.” రెండవ చోట గ్రీకు పాఠ్యంలో “మీ” అనే పదం లేదు; అయితే సందర్భం వేరొక తండ్రిని సూచిస్తుంది (44వ వచనం చూడండి).'
    reason: మూలంలోని రెండవ ‘తండ్రి’కి స్వామ్యసర్వనామం లేకపోవడం, అలాగే οὖν యొక్క ‘కాబట్టి’ భావాన్ని నమోదు చేయడం.
lexical_decisions:
- source_word: ἃ
  choice: చూసినవాటినే / విన్నవాటినే
  rationale: నపుంసక బహువచన సంబంధసర్వనామాన్ని తెలుగులో సహజమైన ‘వాటిని’ నిర్మాణంతో తెలిపి, ‘నే’ ద్వారా రెండు భాగాల సమాంతరతను స్పష్టం చేశాం.
- source_word: ἑώρακα
  choice: చూసిన
  rationale: పూర్ణకాల క్రియ గతంలో జరిగిన దర్శనానికి ప్రస్తుత ప్రాసంగికత ఉందని సూచిస్తుంది; తెలుగు సంబంధకృదంతం సందర్భంలో దీనిని సహజంగా మోస్తుంది.
- source_word: παρὰ τῷ πατρὶ
  choice: తండ్రి సన్నిధిలో
  rationale: దత్తివిభక్తితో వచ్చిన παρά ఇక్కడ మూలాన్ని కాక సమీపం లేదా సన్నిధిని సూచిస్తుంది; ‘సన్నిధిలో’ ఆ భావాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: λαλῶ
  choice: చెబుతున్నాను
  rationale: ప్రత్యక్ష కర్మతో కూడిన ‘మాట్లాడుతున్నాను’ కంటే ‘చెబుతున్నాను’ ఆధునిక తెలుగులో సహజంగా ఉండి, చెప్పబడే విషయాన్ని సూచిస్తుంది.
- source_word: οὖν
  choice: అలాగే
  rationale: రెండు తండ్రులతో సంబంధం నుంచి పుట్టే సమాంతరతను, స్వల్ప నిర్గమన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; కఠిన తార్కిక ‘కాబట్టి’ని రుద్దదు.
- source_word: ἠκούσατε
  choice: విన్న
  rationale: అయోరిస్టు క్రియను సహజ తెలుగు భూత సంబంధకృదంతంగా ఇచ్చి, వారు విన్నది వారి ప్రస్తుత ప్రవర్తనలో వ్యక్తమవుతోందనే సందర్భార్థాన్ని నిలిపాం.
- source_word: παρὰ τοῦ πατρὸς
  choice: మీ తండ్రి దగ్గర
  rationale: షష్ఠీవిభక్తితో παρά మూలాన్ని సూచిస్తుంది. గ్రీకులో స్వామ్యసర్వనామం లేకపోయినా, సందర్భంలోని వ్యత్యాసాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘మీ’ని స్పష్టం చేశాం; ‘దగ్గర’ వ్యక్తి నుంచి వినడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ποιεῖτε
  choice: చేస్తున్నారు
  rationale: వర్తమానకాలం వారి కొనసాగుతున్న లేదా లక్షణాత్మక ప్రవర్తనను సూచిస్తుంది; తెలుగు వర్తమాన రూపం దాన్ని నిలుపుతుంది.
- source_word: πατήρ / πατρὸς
  choice: తండ్రి / మీ తండ్రి
  rationale: మొదటిది యేసుకు దేవునితో ఉన్న సంబంధాన్ని సూచిస్తుంది; రెండవది సందర్భపరంగా ప్రత్యర్థుల తండ్రిని సూచించినా అతని గుర్తింపును ఈ వచనంలోనే ముందుగా నిర్ధారించదు.
theological_decisions:
- issue: రెండవ ‘తండ్రి’ని ప్రధాన పాఠ్యంలో అపవాదిగా స్పష్టంగా గుర్తించాలా?
  choice: ‘మీ తండ్రి’ అని మాత్రమే ఉంచడం
  alternative: ‘ఆ తండ్రి’; ‘అపవాది’; ‘మీ తండ్రియైన అపవాది’
  rationale: 44వ వచనం ఆ తండ్రిని స్పష్టంగా గుర్తిస్తుంది; 38వ వచనంలోని ఉద్దేశపూర్వక అస్పష్టతను, కథనాత్మక పురోగతిని కాపాడేందుకు ఇక్కడ ‘మీ తండ్రి’ మాత్రమే ఉంచాం.
- issue: మొదటి παρά పదబంధాన్ని మూలంగా లేదా సన్నిధిగా అర్థం చేయాలా?
  choice: ‘తండ్రి సన్నిధిలో’ అనే సన్నిధి భావం
  alternative: ‘తండ్రి నుండి’
  rationale: παρά + దత్తివిభక్తి సాధారణంగా ‘దగ్గర, సన్నిధిలో’ అనే భావాన్ని ఇస్తుంది; ఇది యేసు తండ్రితో ఉన్న ప్రత్యేక సంబంధాన్ని రెండవ భాగంలోని παρά + షష్ఠీవిభక్తి మూలభావంతో వ్యత్యాసపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. ‘సన్నిధిలో’ కొద్దిగా ఉన్నత శైలిలో ఉన్నా παρά + దత్తివిభక్తి యొక్క సన్నిధి భావాన్ని ఖచ్చితంగా తెలియజేస్తుంది. ప్రధాన పాఠ్యంలో [a] గుర్తు సంబంధిత వాక్యాంతంలో ఉంచబడింది.
