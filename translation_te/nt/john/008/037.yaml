id: JHN.8.37
reference: John 8:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: te
  text: మీరు అబ్రాహాము సంతానమని[a] నాకు తెలుసు. కానీ మీరు నన్ను చంపాలని చూస్తున్నారు; ఎందుకంటే నా మాటకు మీలో చోటు లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా ‘అబ్రాహాము విత్తనం’; లేదా ‘అబ్రాహాము వంశస్థులు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నా మాట మీలో చోటు పొందడం లేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: అబ్రాహాము సంతానం
  rationale: σπέρμα ఇక్కడ ఏకవచన సమూహార్థక పదంగా శారీరక వంశసంబంధాన్ని సూచిస్తుంది. ‘సంతానం’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ సమూహార్థాన్ని నిలుపుతుంది.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: మీరు నన్ను చంపాలని చూస్తున్నారు
  rationale: ζητέω + క్రియార్థక రూపం ప్రయత్నించడం, కోరడం, చేయాలని చూడడం అనే పరిధిని కలిగి ఉంది. ఈ అనువాదం వర్తమాన ప్రయత్నాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ వారి అంతరంగ ఉద్దేశాన్ని అతిగా నిర్వచించదు.
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: నా మాట
  rationale: λόγος కు మాట, సందేశం అనే అర్థాలు సాధ్యమైనా, ‘నా మాట’ మూలపదానికి నేరుగా దగ్గరగా ఉండి యోహాను రచనలోని పదసంబంధాన్ని కాపాడుతుంది.
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: నా మాటకు మీలో చోటు లేదు
  rationale: χωρέω లో చోటు కలగడం, స్వీకరించబడడం, ముందుకు సాగడం వంటి భావవ్యాప్తి ఉంది. ‘చోటు లేదు’ అనే రూపకం వారి అంతరంగ నిరాకరణను సూచిస్తూ అర్థాన్ని ఒకే వివరణకు పరిమితం చేయదు.
- source_word: ἀλλὰ
  choice: అయినా
  rationale: అబ్రాహాము వంశసంబంధాన్ని అంగీకరించడానికీ యేసును చంపాలనే వారి ప్రయత్నానికీ మధ్యనున్న బలమైన వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
- source_word: οἶδα ὅτι
  choice: నాకు తెలుసు
  rationale: గ్రీకు పరిజ్ఞాన ప్రకటనను తెలుగులో సహజమైన వాక్యనిర్మాణంతో నేరుగా అందిస్తుంది.
theological_decisions:
- issue: అబ్రాహాముతో శారీరక వంశసంబంధం మరియు అబ్రాహాముకు తగిన ప్రవర్తన మధ్య సంబంధం
  choice: σπέρμα Ἀβραάμ ను వంశపరమైన అర్థంలో ‘అబ్రాహాము సంతానం’ అని అనువదించడం
  alternative: ‘అబ్రాహాము పిల్లలు’ అని అనువదించి ఆత్మీయ పుత్రత్వ భావాన్ని ముందుగానే సూచించడం
  rationale: ఈ వచనంలో యేసు వారి శారీరక వంశాన్ని అంగీకరిస్తూనే వారి హత్యాయత్నాన్ని దానికి విరుద్ధంగా ఉంచుతున్నాడు. తరువాతి వచనాల్లో విస్తరించే ఆత్మీయ-నైతిక వ్యత్యాసాన్ని ఇక్కడే పరిష్కరించకుండా ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘సంతానం’ సమూహార్థాన్ని, ‘నా మాటకు మీలో చోటు లేదు’ మూలంలోని రూపకాన్నీ నిలుపుతున్నాయి.
