  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: te
  text: కాని నేను నా మహిమను వెదకడం లేదు; దానిని వెదికేవాడూ తీర్పు తీర్చేవాడూ ఉన్నాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “వెదికేవాడూ తీర్పు తీర్చేవాడూ ఉన్నాడు.” ‘వెదికేవాడు’ అనే క్రియకు కర్మగా ముందటి వాక్యభాగంలోని ‘నా మహిమను’ అంతర్భావంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: పేరు చెప్పని ఈ వాడిని సందర్భాన్ని బట్టి సాధారణంగా తండ్రిగా అర్థం చేసుకుంటారు; అయితే ఇక్కడ గ్రీకు పాఠ్యం దానిని స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: కాని నేను
  rationale: ἐγώ అనే స్పష్టమైన సర్వనామంలోని ఉద్ఘాటనను నిలుపుతూ, δέ సూచించే వ్యతిరేక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐ ζητῶ
  choice: వెదకడం లేదు
  rationale: వర్తమానకాల నిరాకరణను సహజంగా వ్యక్తం చేస్తూ, తరువాతి ζητῶν‌తో ఉన్న పదసంబంధాన్ని ‘వెదకు’ ద్వారానే నిలుపుతుంది.
- source_word: τὴν δόξαν μου
  choice: నా మహిమను
  rationale: δόξα ఇక్కడ వ్యక్తికి చెందవలసిన మహిమ లేదా ఘనతను సూచిస్తుంది. మూలంలో ఉన్న స్వామ్యార్థాన్ని మించకుండా ‘నా మహిమను’ అని అనువదించబడింది.
- source_word: ἔστιν ὁ ζητῶν
  choice: దానిని వెదికే వాడు ఉన్నాడు
  rationale: ఆర్టికల్‌తో ఉన్న కృదంతాన్ని వ్యక్తిని సూచించే నిర్మాణంగా అందిస్తుంది. ముందటి వాక్యభాగంలోని ‘నా మహిమను’ అనేది ζητῶν‌కు అంతర్భావిత కర్మ కాబట్టి సహజమైన తెలుగుకోసం ‘దానిని’ చేర్చబడింది.
- source_word: καὶ κρίνων
  choice: తీర్పు తీర్చే
  rationale: ζητῶν‌తో సమన్వయంగా ఉన్న వర్తమాన కృదంతాన్ని నిలుపుతూ, κρίνω యొక్క న్యాయనిర్ణయ భావాన్ని ‘తీర్పు తీర్చు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: మహిమను వెదికి తీర్పు తీర్చే పేరుపెట్టని వ్యక్తి ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘వాడు’ అని మాత్రమే ఉంచి, ఆయనను తండ్రి అని స్పష్టంగా గుర్తించలేదు.
  alternative: ‘తండ్రి దానిని వెదికి తీర్పు తీరుస్తాడు.’
  rationale: సందర్భం ఆ వ్యక్తి తండ్రి అని సూచించినప్పటికీ, గ్రీకు వాక్యం ఆయనను పేరుతో పేర్కొనదు. అందువల్ల మూలంలోని సంయమనాన్నీ అంతర్భావాన్నీ అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘వెదకు’ అనే పదాన్ని రెండుసార్లు ఉంచి మూలంలోని ζητέω పదసంబంధం కాపాడబడింది. మూలంలో లేని ‘తండ్రి’ అనే గుర్తింపును ప్రధాన పాఠ్యంలో చేర్చలేదు.
