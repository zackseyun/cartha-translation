id: JHN.8.51
reference: John 8:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: te
  text: '“నేను మీతో నిజంగా, నిజంగా చెబుతున్నాను: ఎవరైనా నా మాటను పాటిస్తే, అతడు ఎన్నటికీ మరణాన్ని చూడడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: యేసు మాటకు ఉన్న గంభీరమైన ధృవీకరణను, మూలంలోని పునరుక్తిని నిలుపుతూ ఆధునిక తెలుగు పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: τὸν ἐμὸν λόγον
  choice: నా మాటను
  rationale: λόγος ఇక్కడ యేసు బోధ లేదా ప్రకటనను ఏకవచన సమగ్ర భావంలో సూచిస్తుంది; ‘నా మాటను’ మూల నిర్మాణాన్ని సహజంగా నిలుపుతుంది.
- source_word: τηρήσῃ
  choice: పాటిస్తే
  rationale: ‘కాపాడడం/గైకొనడం’ అనే భావ పరిధిలో, బోధకు విధేయంగా ఉండడాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలిపే ఎంపిక.
- source_word: θάνατον ... θεωρήσῃ
  choice: మరణాన్ని చూడడు
  rationale: మూలంలోని దృశ్యరూపకాన్ని నేరుగా నిలుపుతుంది; దానిని వివరణాత్మకంగా ‘అనుభవించడు’ అని మార్చదు.
- source_word: οὐ μὴ ... εἰς τὸν αἰῶνα
  choice: ఎన్నటికీ ... చూడడు
  rationale: οὐ μή యొక్క బలమైన నిరాకరణను, εἰς τὸν αἰῶνα యొక్క కాలవ్యాప్తిని సహజమైన తెలుగు నిషేధ నిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: విశ్వాసి మరణాన్ని ‘చూడడు’ అనే వాక్యంలోని మరణ స్వరూపం
  choice: ‘మరణాన్ని చూడడు’ అనే మూల రూపకాన్నే నిలుపడం
  alternative: ‘ఆత్మీయ మరణాన్ని అనుభవించడు’ లేదా ‘నిత్య మరణాన్ని చూడడు’ అని స్పష్టీకరించడం
  rationale: వాక్యం ‘మరణం’కు ప్రత్యేక విశేషణం జోడించదు. సందర్భం దాని లోతైన భావాన్ని సూచించినా, అనువాదంలో ఆ అస్పష్టత మరియు theological tension‌ను ముందుగానే పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని పునరుక్తి, షరతు నిర్మాణం, బలమైన నిరాకరణ, ‘మరణాన్ని చూడడం’ అనే రూపకం అన్నీ నిలుపబడ్డాయి.
