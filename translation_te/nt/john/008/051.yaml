  terminology: ‘నా మాటను పాటిస్తే’ is a sound rendering of τὸν ἐμὸν λόγον τηρήσῃ in context. ‘మరణాన్ని చూడడు’ preserves the Greek metaphor and does not impose an interpretation of the nature of death.
