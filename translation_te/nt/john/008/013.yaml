id: JHN.8.13
reference: John 8:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: te
  text: అందుచేత పరిసయ్యులు ఆయనతో, “నీ గురించి నీవే సాక్ష్యమిస్తున్నావు; నీ సాక్ష్యం సత్యమైనది కాదు[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ సాక్ష్యం చెల్లుబాటు కాదు.” గ్రీకులో అక్షరార్థంగా “సత్యమైనది కాదు” అని ఉంది; ఈ సందర్భంలో అది న్యాయపరమైన చెల్లుబాటు భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అందుచేత
  rationale: ముందటి మాటలకు ప్రతిస్పందనగా వచ్చిన తార్కిక కొనసాగింపును సహజంగా సూచిస్తుంది.
- source_word: εἶπον ... αὐτῷ οἱ Φαρισαῖοι
  choice: పరిసయ్యులు ఆయనతో ... అన్నారు
  rationale: గ్రీకు వాక్యంలోని కర్తను, పరోక్ష కర్మను సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: Σὺ περὶ σεαυτοῦ
  choice: నీ గురించి నీవే
  rationale: ప్రత్యేకంగా ఉంచిన Σὺ లోని ఉద్ఘాటనను ‘నీవే’ ద్వారా వ్యక్తం చేస్తూ, περὶ σεαυτοῦ ను ‘నీ గురించి’గా నేరుగా అనువదిస్తుంది.
- source_word: μαρτυρεῖς
  choice: సాక్ష్యమిస్తున్నావు
  rationale: వర్తమాన క్రియను సహజమైన తెలుగు రూపంలో చూపుతూ, న్యాయపరమైన సాక్ష్య భావాన్ని కాపాడుతుంది.
- source_word: ἡ μαρτυρία σου
  choice: నీ సాక్ష్యం
  rationale: μαρτυρεῖς తో పదసంబంధాన్ని నిలుపుతూ, చెప్పబడిన సాక్ష్యాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: οὐκ ἔστιν ἀληθής
  choice: సత్యమైనది కాదు
  rationale: ἀληθής యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతూ, సందర్భంలో ఉండగల ‘చెల్లుబాటు కాదు’ అనే న్యాయపరమైన ఛాయను ప్రధాన పాఠంలో సంకుచితం చేయదు.
theological_decisions:
- issue: తన గురించి తానే ఇచ్చే సాక్ష్యంపై పరిసయ్యుల అభ్యంతరం
  choice: నీ సాక్ష్యం సత్యమైనది కాదు
  alternative: నీ సాక్ష్యం చెల్లుబాటు కాదు
  rationale: ఈ సందర్భంలో న్యాయపరమైన భావఛాయ ఉన్నప్పటికీ, ἀληθής కేవలం న్యాయపరమైన చెల్లుబాటుకే పరిమితం కాదు. ‘సత్యమైనది కాదు’ అనేది సత్యత మరియు చెల్లుబాటు అనే రెండు భావాల మధ్య ఉన్న ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సాక్ష్యం’ అనే పదం యోహాను సువార్తలోని సాక్ష్య సంబంధ పదజాలాన్ని మరియు ఈ వాదనలోని న్యాయపరమైన భావఛాయను నిలుపుతుంది.
