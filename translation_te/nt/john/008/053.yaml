id: JHN.8.53
reference: John 8:53
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: te
  text: “చనిపోయిన మన పితరుడైన అబ్రాహాము కంటే నువ్వు గొప్పవాడివి కావు కదా?[a] ప్రవక్తలు కూడా చనిపోయారు. నిన్ను నువ్వు ఎవరిగా చెప్పుకుంటున్నావు?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “నువ్వు మన పితరుడైన అబ్రాహాము కంటే గొప్పవాడివి కావు గదా...?” గ్రీకు ప్రశ్న ‘కాదు’ అనే సమాధానాన్ని ఆశించే విధంగా ఉంది.'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నిన్ను నువ్వు ఎవరిగా చేసుకుంటున్నావు?” మూలంలోని వ్యక్తీకరణ, ఒక వ్యక్తి తనను తాను ఎవరిగా చూపించుకుంటున్నాడో లేదా ఎవరిగా చెప్పుకుంటున్నాడో ప్రశ్నిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ σὺ
  choice: నువ్వు ... కావు కదా?
  rationale: μήతో ప్రారంభమైన ప్రశ్న ప్రతికూల సమాధానాన్ని ఆశిస్తుంది. ‘కావు కదా?’ అనే సహజ తెలుగు రూపం వక్తల సవాలు మరియు అవిశ్వాసాన్ని నిలుపుతుంది.
- source_word: μείζων
  choice: గొప్పవాడివి
  rationale: సందర్భంలో హోదా, ప్రాముఖ్యత, శ్రేష్ఠత అన్న భావాలకు తెరచి ఉండే విస్తృతమైన తులనాత్మక పదం.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: మన పితరుడైన అబ్రాహాము కంటే
  rationale: తులనాత్మక జనిటివ్‌ను ‘కంటే’తో సహజంగా వ్యక్తం చేసి, అబ్రాహాముతో వారి వంశపారంపర్య అనుబంధాన్ని ‘మన పితరుడు’ నిలుపుతుంది.
- source_word: ὅστις ἀπέθανεν
  choice: చనిపోయిన
  rationale: అబ్రాహాము మరణించిన చారిత్రక వాస్తవాన్ని నేరుగా తెలుపుతుంది; తెలుగులో సంబంధవాచక నిర్మాణంతో ముందుంచడం సహజంగా ఉంటుంది.
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: ప్రవక్తలు కూడా చనిపోయారు
  rationale: καί సూచించే సమాంతర అదనాన్ని ‘కూడా’ స్పష్టంగా నిలుపుతుంది.
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: నిన్ను నువ్వు ఎవరిగా చేసుకుంటున్నావు?
  rationale: మూలంలోని ‘నిన్ను నువ్వు ఎవరిగా చేస్తున్నావు?’ అనే రూపకాన్ని సాధ్యమైనంతగా నిలుపుతూ, తనకు తానే ఒక హోదా ఆపాదించుకుంటున్నాడనే ఆరోపణాత్మక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: అబ్రాహాము, ప్రవక్తలతో పోల్చి యేసు హోదాను సవాలు చేయడం
  choice: ప్రతికూల సమాధానాన్ని ఆశించే విరోధపూరిత ప్రశ్నగా అనువదించడం
  alternative: ‘నువ్వు మన పితరుడైన అబ్రాహాము కంటే గొప్పవాడివా?’ అనే తటస్థ ప్రశ్న
  rationale: గ్రీకు μή ప్రశ్నకు ‘కాదు’ అనే సమాధానాన్ని వక్తలు ఆశిస్తున్నారని సూచిస్తుంది. యేసు ఎవరో అనే ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా, వారి సవాలును యథాతథంగా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రత్యక్ష ఘర్షణకు తగిన ‘నువ్వు’ సంబోధనతో అనువదించబడింది. ‘పితరుడు’ బైబిలు సందర్భానికి తగిన గౌరవభరితమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే పదం. ప్రధాన వాక్యంలో రెండు పాదటిప్పణి సూచికలూ చేర్చబడ్డాయి.
