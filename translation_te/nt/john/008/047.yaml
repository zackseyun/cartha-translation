id: JHN.8.47
reference: John 8:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: te
  text: దేవుని నుండి వచ్చినవాడు[a] దేవుని మాటలు వింటాడు. అందుకే మీరు వినరు; ఎందుకంటే[b] మీరు దేవుని నుండి వచ్చినవారు కారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేవుని నుండి వచ్చినవాడు’ అనే గ్రీకు వ్యక్తీకరణ మూలం లేదా ఉద్భవాన్ని నొక్కి చెబుతుంది; ‘దేవునికి చెందినవాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఎందుకంటే’ అని అనువదించిన గ్రీకు సంధిపదాన్ని ‘అని’ అని కూడా గ్రహించవచ్చు. అయితే ఈ సందర్భంలో కారణార్థమే మరింత సహజంగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ὢν
  choice: వచ్చినవాడు
  rationale: వ్యక్తిని సూచించే నామవాచకార్థక వర్తమాన కృదంతాన్ని ఏకవచన ప్రతినిధి భావంతో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; దీనికి వెంటనే ఉన్న ἐκ τοῦ θεοῦతో కలిపి ‘దేవుని నుండి వచ్చినవాడు’ అని అనువదించబడింది.
- source_word: ἐκ τοῦ θεοῦ
  choice: దేవుని నుండి
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవ భావాన్ని నిలుపుతుంది; కేవలం స్వామ్యాన్ని లేదా ఒక నిర్దిష్ట సిద్ధాంత వర్గాన్ని చేర్చదు.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: దేవుని మాటలు
  rationale: ῥήματα యొక్క బహువచన, నిర్దిష్ట భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀκούει / ἀκούετε
  choice: వింటాడు / వినరు
  rationale: రెండు చోట్ల ఉన్న ఒకే గ్రీకు క్రియ పునరుక్తిని నిలుపుతుంది. సందర్భంలో స్వీకరించడం లేదా లక్ష్యపెట్టడం అంతర్భావంగా ఉండవచ్చుగానీ, ‘లోబడటం’ అని స్పష్టీకరించదు.
- source_word: διὰ τοῦτο
  choice: అందుకే
  rationale: కారణం లేదా ఫలితాన్ని సూచించే అన్వయాన్ని సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: 'ఇక్కడ సంధిని కారణార్థకంగా గ్రహిస్తుంది: వారు దేవుని నుండి వచ్చినవారు కారు కాబట్టి వినరు.'
- source_word: ἐκ τοῦ θεοῦ οὐκ ἐστέ
  choice: మీరు దేవుని నుండి వచ్చినవారు కారు
  rationale: మొదటి వాక్యంలోని మూలం/ఉద్భవ భాషను పునరావృతం చేసి యోహాను ఉద్దేశించిన వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘దేవుని నుండి’ ఉండటం అనే యోహానీయ భావం
  choice: మూలం లేదా ఉద్భవాన్ని సూచించే ‘దేవుని నుండి వచ్చిన’ అనే భాషను నిలుపడం
  alternative: దేవునికి చెందిన; రక్షణార్థంలో దేవుని ద్వారా జన్మించిన
  rationale: వాక్యం దేవుని నుండి ఉన్నవారిని యేసు మాట వినని ప్రత్యర్థులతో వ్యత్యాసపరుస్తుంది. దీన్ని ఎన్నిక, పునర్జన్మ లేదా నిబంధన సభ్యత్వం వంటి ఒకే సిద్ధాంత వర్గంగా పరిమితం చేయకుండా మూలపాఠంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: ἀκούω క్రియ యొక్క బలం
  choice: వినడం
  alternative: లక్ష్యపెట్టడం; లోబడడం
  rationale: సందర్భంలో నిజంగా వినడం అనేది స్వీకార స్పందనను సూచించవచ్చు. అయినా ప్రధాన పాఠంలో గ్రీకు క్రియ యొక్క ప్రాథమిక అర్థాన్ని ఉంచి, దాని అంతర్భావాన్ని సిద్ధాంతపరంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘వింటాడు/వినరు’ అనే పునరుక్తి ఉద్దేశపూర్వకంగా కాపాడబడింది; ‘దేవుని నుండి వచ్చిన’ అనే పదబంధం భౌతిక ప్రయాణాన్ని కాక మూలం లేదా ఉద్భవాన్ని సూచిస్తుంది.
