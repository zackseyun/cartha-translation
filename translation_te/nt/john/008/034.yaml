source:
  edition: SBLGNT
  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: te
  text: 'యేసు వారికి జవాబిచ్చాడు: “నిజంగా, నిజంగా మీతో చెబుతున్నాను: పాపం చేస్తూ ఉండే ప్రతి ఒక్కరూ పాపానికి బానిస.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పాపానికి సేవకుడు’ అని కూడా అనువదించవచ్చు. గ్రీకు పదమైన δοῦλοςకు ‘సేవకుడు’ లేదా ‘బానిస’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ పాపం కింద బంధించబడిన స్థితి ప్రధానంగా ఉన్నందున ‘బానిస’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: యేసు వారికి ఇలా జవాబిచ్చాడు
  rationale: సంభాషణలోని ప్రతిస్పందన భావాన్ని సహజమైన ఆధునిక తెలుగు కథన శైలిలో నిలుపుతుంది.
- source_word: Ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: యోహాను సువార్తకు ప్రత్యేకమైన ద్విరుక్త గంభీర సూత్రాన్ని, దాని పునరుక్తితో సహా, సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: λέγω ὑμῖν
  choice: మీతో చెబుతున్నాను
  rationale: వర్తమాన కాలపు ప్రకటనను గంభీరమైనప్పటికీ సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: పాపం చేస్తూ ఉండే ప్రతి ఒక్కరూ
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న లేదా లక్షణాత్మకమైన క్రియను తెలియజేస్తుంది; ఒక్క విడి చర్యగా అతిగా పరిమితం చేయదు.
- source_word: δοῦλος ἐστιν τῆς ἁμαρτίας
  choice: పాపానికి బానిస
  rationale: δοῦλος లోని అధీనత, బంధనం అనే బలమైన రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది; షష్ఠీ సంబంధాన్ని ‘పాపానికి’ అని వ్యక్తపరచడం తెలుగు వాడుకకు అనుకూలం.
theological_decisions:
- issue: పాపం చేయడం గురించిన వాక్య స్వభావం
  choice: ‘పాపం చేస్తూ ఉండే’ అని కొనసాగుతున్న లేదా లక్షణాత్మకమైన ప్రవర్తనగా అనువదించడం
  alternative: ‘పాపం చేసే ప్రతి ఒక్కరూ’ లేదా ‘పాపం చేసిన ప్రతి ఒక్కరూ’
  rationale: ποιῶν అనే వర్తమాన కృదంతం సందర్భంలో కొనసాగుతున్న ఆచరణను సహజంగా సూచిస్తుంది. ఇది ఒక్కసారి జరిగిన చర్య అని నిర్బంధించకుండా, మూలంలోని నైతిక ఉద్రిక్తతను నిలుపుతుంది.
- issue: δοῦλος రూపకంలోని బలం
  choice: ‘బానిస’
  alternative: ‘సేవకుడు’
  rationale: ఈ సందర్భంలో యేసు చెప్పే అంశం పాపం కింద ఉన్న బంధనం మరియు అధీనత. ‘బానిస’ ఆ రూపక బలాన్ని ‘సేవకుడు’ కంటే స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన వాక్య నిర్మాణం. ‘నిజంగా, నిజంగా’ అనే పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపాం. ‘చేస్తూ ఉండే’ కొనసాగుతున్న భావాన్ని స్పష్టం చేస్తుంది; ‘బానిస’ రూపకంలోని బంధన తీవ్రతను కాపాడుతుంది.
