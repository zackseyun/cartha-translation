source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: te
  text: 'యేసు ఇలా జవాబిచ్చాడు: “నన్ను నేనే మహిమపరచుకుంటే, నా మహిమ ఏమీ కాదు. నన్ను మహిమపరచేవాడు నా తండ్రే; ఆయనే మా దేవుడని మీరు చెప్పే దేవుడు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “మా దేవుడు”కు బదులుగా “మీ దేవుడు” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: సంభాషణలో ἀποκρίνομαιకు సహజమైన ఆధునిక తెలుగు రూపం; కథన గాంభీర్యాన్ని కూడా నిలుపుతుంది.
- source_word: δοξάσω / δόξα / δοξάζων
  choice: మహిమపరచుకుంటే / మహిమ / మహిమపరచేవాడు
  rationale: యోహాను సువార్తలోని ‘మహిమ’ భావధారను నిలుపుతూ ఒకే పదకుటుంబంతో గ్రీకు పదపునరుక్తిని ప్రతిబింబిస్తుంది.
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: నా మహిమ ఏమీ కాదు
  rationale: οὐδέν ἐστινను దగ్గరగా అనుసరించే, సహజమైన తెలుగు వాక్యరూపం; ‘విలువ లేదు’ అని అర్థాన్ని మరీ నిర్దిష్టం చేయదు.
- source_word: ὁ πατήρ μου ὁ δοξάζων με
  choice: నన్ను మహిమపరచేవాడు నా తండ్రే
  rationale: కర్తను గుర్తించే గ్రీకు నిర్మాణంలోని ఉద్ఘాటనను సహజమైన తెలుగు ‘తండ్రే’ ద్వారా తెలియజేస్తుంది; వర్తమాన కృదంతపు వర్ణనాత్మక భావాన్ని ‘మహిమపరచేవాడు’ నిలుపుతుంది.
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: ఆయనే ‘మా దేవుడు’ అని మీరు చెప్పుకునే దేవుడు
  rationale: సంబంధవాచక నిర్మాణాన్ని తెలుగులో స్పష్టంగా, సహజంగా అందిస్తుంది. λέγετεకు ‘చెప్పుకునే’ అనేది సందర్భంలోని వారి స్వీయ ప్రకటన భావాన్ని వ్యక్తం చేస్తుంది; ప్రధాన పాఠంలోని ἡμῶνను ‘మా’గా ఉంచుతుంది.
- source_word: θεὸς
  choice: దేవుడు
  rationale: ఇక్కడ ఇశ్రాయేలు దేవుడే ఉద్దేశించబడ్డాడు; తెలుగు సాధారణ దైవనామ రూపం అనుకూలం.
theological_decisions:
- issue: θεὸς ἡμῶν/ὑμῶν ἐστινలో సర్వనామ పాఠభేదం
  choice: మా దేవుడు
  alternative: మీ దేవుడు
  rationale: ఇచ్చిన SBLGNT మూలపాఠం ἡμῶν (‘మా/మన’)ను అనుసరించాం. వివాద సందర్భంలో అర్థప్రాధాన్యం కలిగిన ὑμῶν (‘మీ’) పాఠభేదాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన బైబిలు వచన శైలిలో రూపొందించబడింది. ‘మహిమ’ పదపునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది. పాదటిప్పణి గుర్తు పాఠభేదానికి సంబంధించిన వాక్యభాగం వద్ద ఉంచబడింది.
