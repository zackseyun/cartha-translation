id: JHN.8.14
reference: John 8:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: te
  text: 'యేసు వారికి జవాబిచ్చి ఇలా అన్నాడు: “నేను నా గురించి నేనే సాక్ష్యమిచ్చినా[a], నా సాక్ష్యం సత్యమే. ఎందుకంటే నేను ఎక్కడి నుండి వచ్చానో, ఎక్కడికి వెళ్తున్నానో నాకు తెలుసు. కానీ నేను ఎక్కడి నుండి వస్తున్నానో లేదా ఎక్కడికి వెళ్తున్నానో[b] మీకు తెలియదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా గురించి నేనే సాక్ష్యం చెప్పినా.”
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రతుల్లో “లేదా ఎక్కడికి వెళ్తున్నానో” అనే బదులు “మరియు ఎక్కడికి వెళ్తున్నానో” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: జవాబిస్తూ ఇలా అన్నాడు
  rationale: రెండు గ్రీకు క్రియల భావాన్నీ నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన కథన ప్రయోగాన్ని ఇస్తుంది.
- source_word: Κἂν
  choice: '...ఇచ్చినా'
  rationale: వాదన నిమిత్తం ఒక పరిస్థితిని అంగీకరించే concessive భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μαρτυρῶ
  choice: సాక్ష్యమిచ్చినా
  rationale: యోహాను సువార్తలోని సాక్షి/న్యాయపరమైన భావాన్ని నిలుపుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: περὶ ἐμαυτοῦ
  choice: నా గురించి నేనే
  rationale: περί + genitive యొక్క నేర భావాన్ని నిలుపుతుంది; గ్రీకులోని ἐγώ, ἐμαυτοῦ వల్ల కలిగే స్వీయ ఉద్ఘాటనను తెలుగులో సహజంగా చూపుతుంది.
- source_word: ἀληθής ... ἡ μαρτυρία μου
  choice: నా సాక్ష్యం సత్యమే
  rationale: ἀληθής యొక్క సత్య భావాన్ని న్యాయపరమైన ‘చెల్లుబాటు’ అనే సంకుచిత అర్థానికి పరిమితం చేయదు.
- source_word: ὅτι οἶδα
  choice: ఎందుకంటే ... నాకు తెలుసు
  rationale: ὅτι యొక్క కారణార్థాన్ని, οἶδα యొక్క జ్ఞాన ప్రకటనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: πόθεν ἦλθον
  choice: ఎక్కడి నుండి వచ్చానో
  rationale: అవరిస్ట్ ἦλθον సూచించే గత రాక/మూలాన్ని తెలుగులో సహజంగా చూపుతుంది.
- source_word: ποῦ ὑπάγω
  choice: ఎక్కడికి వెళ్తున్నానో
  rationale: దిశగల ప్రస్తుత గమనాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: కానీ ... మీకు తెలియదు
  rationale: గ్రీకులోని వ్యత్యాసాన్నీ, స్పష్టంగా ఉన్న ‘మీరు’ అనే ఉద్ఘాటననూ నిలుపుతుంది.
- source_word: πόθεν ἔρχομαι
  choice: ఎక్కడి నుండి వస్తున్నానో
  rationale: ముందటి ἦλθον (‘వచ్చాను’)తో ఉన్న కాలరూప భేదాన్ని సాధ్యమైనంత వరకు ‘వస్తున్నాను’గా నిలుపుతుంది.
theological_decisions:
- issue: యేసు తన గురించి తానే ఇచ్చే సాక్ష్యం యొక్క స్వభావం
  choice: ఆయన సాక్ష్యం ‘సత్యమే’ అని, దానికి కారణం తన మూలం మరియు గమ్యం తనకు తెలుసనేదిగా అనువదించబడింది.
  alternative: దీనిని కేవలం న్యాయపరంగా ‘చెల్లుబాటు గలది’ అని లేదా స్పష్టంగా ‘పరలోక మూలం’ అని విస్తరించి అనువదించడం.
  rationale: వచనం చెప్పిన కారణ సంబంధాన్ని యథాతథంగా ఉంచి, దాని విస్తృత క్రీస్తుశాస్త్రార్థం సందర్భం నుండే వెలువడేలా చేస్తుంది; తరువాతి సిద్ధాంత పదజాలాన్ని వచనంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సాక్ష్యం’ అనే పదం యోహాను రచనలోని ముఖ్య పదబంధ సంబంధాన్ని నిలుపుతుంది. ప్రధాన పాఠంలో SBLGNT పఠనం ἢ (‘లేదా’) ఉంచబడింది; ప్రత్యామ్నాయ καὶ (‘మరియు’) పాదటిప్పణిలో ఇవ్వబడింది.
