  to: 'యేసు వారికి జవాబిచ్చి ఇలా అన్నాడు: “నేను నా గురించి నేనే సాక్ష్యమిచ్చినా[a], నా సాక్ష్యం సత్యమే. ఎందుకంటే నేను ఎక్కడి నుండి వచ్చానో, ఎక్కడికి వెళ్తున్నానో నాకు తెలుసు. కానీ నేను ఎక్కడి నుండి వస్తున్నానో లేదా ఎక్కడికి వెళ్తున్నానో[b] మీకు తెలియదు.”'
