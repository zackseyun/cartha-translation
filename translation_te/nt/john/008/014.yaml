  terminology: ‘సాక్ష్యం’ యోహానుకు ముఖ్యమైన μαρτυρία పదకుటుంబాన్ని సముచితంగా నిలుపుతుంది. ‘సత్యమే’ ἀληθής యొక్క అర్థాన్ని ‘చెల్లుబాటు’ అనే న్యాయపరమైన సంకుచిత అర్థానికి పరిమితం చేయదు. పేర్లు లేదా దైవశాస్త్ర పదజాలంలో మార్పు అవసరం లేదు.
  issues:
