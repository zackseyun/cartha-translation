revisions:
- from: నా గురించి సాక్ష్యమిచ్చేవాడిని నేనే[a]; నన్ను పంపిన తండ్రి కూడా నా గురించి సాక్ష్యమిస్తున్నాడు.
  to: నేనే నా గురించి సాక్ష్యమిచ్చేవాడిని[a]; నన్ను పంపిన తండ్రి నా గురించి సాక్ష్యమిస్తాడు.
  rationale: 'The revision preserves the source syntax and meaning: Jesus identifies himself as the one testifying concerning himself, and the Father who sent him as testifying concerning him. It makes the repeated witness terminology consistent, removes an unnecessary additive nuance, and uses natural modern-standard Telugu. The footnote remains anchored to the first occurrence and supplies a consistent alternative for both repeated verbs.'
