  revision_rationale: 'The revision preserves the source syntax and meaning: Jesus identifies himself as the one testifying concerning himself, and the Father who sent him as testifying concerning him. It makes the repeated witness terminology consistent, removes an unnecessary additive nuance, and uses natural modern-standard Telugu. The footnote remains anchored to the first occurrence and supplies a consistent alternative for both repeated verbs.'
