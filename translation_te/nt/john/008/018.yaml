id: JHN.8.18
reference: John 8:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: te
  text: నేనే నా గురించి సాక్ష్యమిచ్చేవాడిని[a]; నన్ను పంపిన తండ్రి నా గురించి సాక్ష్యమిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా గురించి సాక్ష్యం చెప్పేవాడిని నేనే; … నా గురించి సాక్ష్యం చెబుతాడు.’
    reason: ‘సాక్ష్యమిచ్చు’కు సహజమైన తెలుగు ప్రత్యామ్నాయాన్ని చూపిస్తూ, గ్రీకు μαρτυρέω యొక్క సాక్ష్యార్థాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ μαρτυρῶν
  choice: సాక్ష్యమిచ్చేవాడిని నేనే
  rationale: ఆర్టికల్‌తో ఉన్న వర్తమాన కృదంతం వ్యక్తిని సూచిస్తూ ‘సాక్ష్యమిచ్చేవాడు’ అనే భావాన్నిస్తుంది. ‘నేనే’ గ్రీకు ἐγώ యొక్క స్పష్టమైన ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: περὶ ἐμαυτοῦ
  choice: నా గురించి
  rationale: περί + షష్ఠీ విభక్తి ఇక్కడ ‘గురించి/సంబంధించి’ అనే అర్థం ఇస్తుంది. ‘నా గురించి’ సహజంగా ఉండి, ‘నా పక్షంగా’ అనే అదనపు న్యాయార్థాన్ని రుద్దదు.
- source_word: μαρτυρεῖ
  choice: సాక్ష్యమిస్తున్నాడు
  rationale: వర్తమాన కాలంలోని సాక్ష్యక్రియను తెలుపుతూ, యోహాను వాడే న్యాయస్థానసదృశ సాక్ష్య భాషను కాపాడుతుంది.
- source_word: περὶ ἐμοῦ
  choice: నా గురించి
  rationale: మొదటి భాగంలోని περί నిర్మాణంతో పదసంబంధాన్ని నిలుపుతూ సహజమైన ఆధునిక తెలుగు రూపాన్ని ఇస్తుంది.
- source_word: ὁ πέμψας με πατήρ
  choice: నన్ను పంపిన తండ్రి
  rationale: ఆర్టికల్‌తో ఉన్న భూతకాల కృదంతం πατήρ‌ను విశేషిస్తుంది; అందువల్ల ‘నన్ను పంపిన తండ్రి’ మూల నిర్మాణాన్ని స్పష్టంగా, సహజంగా ప్రతిబింబిస్తుంది. గ్రీకులో లేని ‘నా’ లేదా ‘దేవుడైన’ అనే పదాలను చేర్చలేదు.
theological_decisions:
- issue: ‘తండ్రి’ అనే సంబోధన యొక్క నిర్దిష్టత
  choice: నన్ను పంపిన తండ్రి
  alternative: నన్ను పంపిన నా తండ్రి; నన్ను పంపిన తండ్రియైన దేవుడు
  rationale: గ్రీకు పాఠం ‘తండ్రి’ అని మాత్రమే చెబుతుంది. యేసును పంపినవాడనే సంబంధాన్ని నిలుపుతూ, పాఠంలో లేని స్వామ్యపదం లేదా సిద్ధాంత వివరణను చేర్చలేదు.
- issue: సాక్ష్య భాషలోని న్యాయపరమైన ధ్వని
  choice: రెండు సందర్భాల్లోనూ ‘సాక్ష్యమిచ్చు’ అనే ఒకే మూలపదాన్ని ఉపయోగించడం
  alternative: తెలియజేయు; నా పక్షంగా చెప్పు
  rationale: μαρτυρέω పునరావృతిని, దాని సాక్ష్య/న్యాయపరమైన బలాన్ని నిలుపుతుంది; ‘నా పక్షంగా’ అనడం περί యొక్క భావాన్ని అవసరానికి మించి వ్యాఖ్యానిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘సాక్ష్యమిచ్చు’ అనే పదం యోహాను సువార్తలోని సాక్ష్య ధోరణిని నిలుపుతుంది; ‘కూడా’ καί యొక్క అనుసంధాన బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
