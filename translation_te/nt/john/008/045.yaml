  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ὅτι τὴν ἀλήθειαν λέγω, οὐ πιστεύετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/045.yaml
  text: But because I tell the truth[a], you do not believe me.
translation:
  language: te
  text: కానీ నేను సత్యం చెబుతున్నాను కాబట్టి మీరు నన్ను నమ్మరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత రూపానుసారంగా, “కానీ నేను సత్యం చెబుతున్నానని మీరు నన్ను నమ్మరు.” గ్రీకు సంధానపదాన్ని “అని” అని కూడా అనువదించవచ్చు; అయితే ఇక్కడ సందర్భానికి కారణార్థకమైన “కాబట్టి” అనే భావం బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: నేను
  rationale: గ్రీకులో కర్త సర్వనామం స్పష్టంగా, నొక్కి చెప్పబడింది; ముందున్న సందర్భంతో యేసుకు ఉన్న వ్యత్యాసాన్ని నిలుపుకోవడానికి తెలుగులోనూ ఉంచాం.
- source_word: δὲ
  choice: కానీ
  rationale: ముందున్న మాటలతో వ్యత్యాసాన్ని సూచిస్తున్నందున సహజమైన ప్రతికూల సంధానంగా ‘కానీ’ ఎంచుకున్నాం.
- source_word: ὅτι
  choice: చెబుతున్నందువల్లనే
  rationale: ఇక్కడ ὅτι కారణార్థకంగా ఉంది. ‘అందువల్లనే’ అనేది వారు యేసును నమ్మకపోవడానికి ఆయన సత్యం చెప్పడమే కారణమనే వాక్యంలోని పదునైన వ్యత్యాసాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: τὴν ἀλήθειαν
  choice: సత్యం
  rationale: ἀλήθεια కు సందర్భానుకూలమైన, గౌరవప్రదమైన సాధారణ తెలుగు పదం. తెలుగులో ఈ భావానికి నిర్దిష్ట ఉపపదాన్ని విడిగా చూపాల్సిన అవసరం లేదు.
- source_word: λέγω
  choice: చెబుతున్న
  rationale: వర్తమానకాల భావాన్ని నిలుపుతూ, ‘సత్యం చెప్పడం’ అనే సహజమైన తెలుగు పదబంధాన్ని వాడాం.
- source_word: οὐ πιστεύετέ μοι
  choice: మీరు నన్ను నమ్మడం లేదు
  rationale: πιστεύω దత్తివిభక్తి వ్యక్తితో వచ్చినప్పుడు ‘ఒకరిని నమ్మడం’ అనే భావం వస్తుంది. ఇది వ్యక్తిగత కర్మను నిలుపుతుంది; కేవలం ‘నా మాటను నమ్మడం లేదు’గా విస్తరించదు.
theological_decisions:
- issue: యేసు సత్యం చెప్పడానికి, శ్రోతలు ఆయనను నమ్మకపోవడానికి మధ్య ὅτι చూపే సంబంధం
  choice: 'కారణార్థకం: ‘సత్యం చెబుతున్నందువల్లనే’'
  alternative: 'వివరణార్థకం/మరింత రూపానుసారం: ‘నేను సత్యం చెబుతున్నానని’'
  rationale: తక్షణ సందర్భంలో అబద్ధం చెప్పే అపవాదికి, సత్యం చెప్పే యేసుకు మధ్య వ్యత్యాసం ఉంది. అందువల్ల ὅτι ని కారణార్థకంగా తీసుకోవడం వాక్యంలోని వ్యంగ్యభరితమైన పదునును నిలుపుతుంది. ఇది సిద్ధాంతాన్ని చొప్పించే నిర్ణయం కాదు; వాక్యనిర్మాణం, సంభాషణ సందర్భం ఆధారంగా తీసుకున్న నిర్ణయం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. ‘అందువల్లనే’ వాక్యంలోని కారణ సంబంధాన్నీ, వ్యత్యాసపు పదునునీ స్పష్టంగా ఉంచుతుంది; ‘నన్ను నమ్మడం లేదు’ గ్రీకు దత్తివిభక్తిలోని వ్యక్తిగత లక్ష్యాన్ని కాపాడుతుంది.
