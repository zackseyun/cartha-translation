  source_fidelity: The draft correctly represents the explicit contrastive subject (ἐγώ δέ), the causal reading of ὅτι, ‘the truth,’ and πιστεύω with a personal dative as ‘believe me.’ However, -నే in ‘చెబుతున్నందువల్లనే’ can suggest an exclusive or heightened ‘because precisely/only because,’ which is stronger than the Greek wording requires.
  naturalness: The sentence is understandable and modern, but ‘నేను సత్యం చెబుతున్నాను కాబట్టి మీరు నన్ను నమ్మరు’ is more direct and idiomatic for a general present assertion in this discourse.
  terminology: ‘సత్యం’ and ‘నన్ను నమ్మరు’ are accurate, natural, and appropriate to the register. No theological terminology issue is present.
  issues:
