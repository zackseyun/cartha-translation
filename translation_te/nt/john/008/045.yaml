    issue: The emphatic suffix -నే in the causal phrase is stronger than necessary.
    rationale: The Greek has an explicit ‘I’ and a contrastive δέ, but no exclusive particle modifying the causal clause. Removing -నే better preserves the source’s degree of emphasis while retaining its irony through the causal construction.
  - severity: low
    issue: ‘నమ్మడం లేదు’ is less direct here than a simple present negative.
    rationale: ‘నమ్మరు’ naturally conveys the ongoing/general rejection expressed by οὐ πιστεύετέ in this direct address.
