source:
  edition: SBLGNT
  text: καὶ ἐὰν κρίνω δὲ ἐγώ, ἡ κρίσις ἡ ἐμὴ ⸀ἀληθινή ἐστιν, ὅτι μόνος οὐκ εἰμί, ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: te
  text: అయితే, నేను తీర్పు తీర్చినా[a], నా తీర్పు సత్యమైనదే. ఎందుకంటే నేను ఒంటరిగా లేను; నేనూ నన్ను పంపిన తండ్రియూ ఉన్నాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేను తీర్పు తీర్చితే,” లేదా “నేను తీర్పు తీర్చినట్లయితే.” గ్రీకు షరతు నిర్మాణాన్ని మరింత అక్షరార్థంగా అనువదించవచ్చు; అయితే ఇక్కడ “తీర్పు తీర్చినా” అనే రాయితీ భావం సందర్భానికి తగినదిగా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: నేను తీర్పు తీర్చినా
  rationale: ἐὰν + వర్తమాన విధ్యర్థక క్రియ షరతుతో కూడిన అవకాశాన్ని తెలియజేస్తుంది; సందర్భంలో రాయితీ భావం ఉండటం వల్ల ‘తీర్పు తీర్చినా’ సహజంగా దాన్ని వ్యక్తం చేస్తుంది. ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాం.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వాక్యంతో ఉన్న వ్యత్యాసాన్ని, తదుపరి భావవికాసాన్ని ఆధునిక తెలుగు సహజ శైలిలో సూచిస్తుంది.
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: నా తీర్పు
  rationale: స్వామ్యాన్ని సహజంగా వ్యక్తం చేస్తూ, κρίσις లోని న్యాయపరమైన భావాన్ని నిలుపుతుంది.
- source_word: ἀληθινή
  choice: సత్యమైనదే
  rationale: ‘సత్యమైనది’ అనేది నిజత్వం, చెల్లుబాటు అనే రెండు భావాలకు చోటిచ్చి, యోహాను రచనలోని సత్య సంబంధిత ప్రతిధ్వనిని కాపాడుతుంది; ‘-ఏ’ వాక్యంలోని దృఢ నిర్ధారణను సహజంగా తెలియజేస్తుంది.
- source_word: μόνος οὐκ εἰμί
  choice: నేను ఒంటరిగా లేను
  rationale: యేసు స్వతంత్రంగా లేదా ఏకాకిగా తీర్పు తీర్చడం లేదనే సంబంధపరమైన అంశాన్ని స్పష్టంగా, సహజంగా తెలుపుతుంది.
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: నేనూ, నన్ను పంపిన తండ్రి ఉన్నాం
  rationale: గ్రీకు వాక్యంలో భావింపబడిన సంయుక్త ఉనికిని తెలుగులో పూర్తి వాక్యంగా సహజంగా వ్యక్తం చేస్తుంది; ‘నన్ను పంపిన’ అనే సంబంధార్థక నిర్మాణం పంపిన తండ్రిని గుర్తిస్తుంది.
theological_decisions:
- issue: యేసు తీర్పుకు తండ్రి సాక్ష్యంతో ఉన్న సంబంధం
  choice: యేసు ఒంటరిగా లేడని, తనను పంపిన తండ్రి తనతో ఉన్నాడని చెప్పడం ద్వారా ఆయన తీర్పు సత్యమైనదని వచనం తెలియజేస్తుంది.
  alternative: దీనిని విస్తృతమైన దైవశాస్త్రార్థం లేకుండా, ఇద్దరు సాక్షులకు సంబంధించిన న్యాయపరమైన వాదనగా మాత్రమే చదవవచ్చు.
  rationale: మూల వాక్యం యేసు తీర్పు సత్యత్వాన్ని ఆయన ఒంటరిగా లేకపోవడంలోను, పంపిన తండ్రి ఉనికిలోను నేరుగా ఆధారపరుస్తుంది. అనువాదం తరువాతి సిద్ధాంత సూత్రీకరణలను చేర్చకుండా ఈ సంబంధాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘తీర్పు తీర్చు’ అనే సాధారణ బైబిలు-న్యాయపరమైన ప్రయోగం κρίσις/κρίνω పదసంబంధాన్ని నిలుపుతుంది. ప్రధాన పాఠ్యంలో [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
