id: JHN.8.52
reference: John 8:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: te
  text: 'యూదులు ఆయనతో ఇలా అన్నారు: “నీకు దయ్యం పట్టిందని ఇప్పుడు మాకు తెలిసింది.[a] అబ్రాహాము చనిపోయాడు; ప్రవక్తలు కూడా చనిపోయారు. అయినా నువ్వు, ‘ఎవరైనా నా మాటను పాటిస్తే, అతడు ఎన్నటికీ మరణాన్ని రుచి చూడనే చూడడు’[b] అంటున్నావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “నీకు దయ్యం ఉంది.”
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకులో ఇది బలమైన నిరాకరణ: “అతడు ఎన్నడూ, ఎట్టి పరిస్థితిలోనూ మరణాన్ని రుచి చూడడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: మూలపాఠంలోని సాధారణ జాతి/సమూహ సూచనను నేరుగా నిలుపుతుంది; ‘యూదా నాయకులు’ అని అనువదించడం సందర్భాధారిత వ్యాఖ్యానం అవుతుంది.
- source_word: Νῦν ἐγνώκαμεν
  choice: ఇప్పుడు మాకు తెలిసింది
  rationale: గతంలో కలిగిన గ్రహింపు వల్ల ఏర్పడిన ప్రస్తుత నిశ్చయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δαιμόνιον ἔχεις
  choice: నీకు దయ్యం పట్టింది
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘నీకు దయ్యం ఉంది’; అయితే తెలుగులో అదే భావానికి సహజమైన వాడుక ‘దయ్యం పట్టింది’. అక్షరార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: అబ్రాహాము చనిపోయాడు; ప్రవక్తలు కూడా చనిపోయారు
  rationale: అబ్రాహాముతో పాటు ప్రవక్తల మరణాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; రెండవ క్రియను తెలుగులో పునరుక్తి చేయడం వాక్యాన్ని సులభంగా అర్థమయ్యేలా చేస్తుంది.
- source_word: καὶ σὺ λέγεις
  choice: అయినా నువ్వు ... అంటున్నావు
  rationale: సందర్భంలోని వ్యతిరేక భావాన్ని ‘అయినా’ సహజంగా వెల్లడిస్తుంది.
- source_word: τὸν λόγον μου τηρήσῃ
  choice: నా మాటను పాటిస్తే
  rationale: λόγος‌ను ‘మాట’గా నిలుపుతూ, τηρέωలోని కాపాడటం/ఆచరించడం అనే సందర్భార్థాన్ని ‘పాటించు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα
  choice: ఎన్నటికీ మరణాన్ని రుచి చూడనే చూడడు
  rationale: ‘మరణాన్ని రుచి చూడు’ అనే మూల రూపకాన్ని నిలుపుతుంది; ‘ఎన్నటికీ’ εἰς τὸν αἰῶνα భావాన్ని, ‘చూడనే చూడడు’ οὐ μή అనే బలమైన నిరాకరణను తెలుగులో సహజంగా వ్యక్తం చేస్తాయి.
theological_decisions:
- issue: మరణాన్ని రుచి చూడటం అనే వాగ్దానపు అర్థం
  choice: ‘మరణాన్ని రుచి చూడడు’ అనే రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: దీనిని శారీరక మరణం, ఆత్మీయ మరణం, లేదా అంతిమ/నిత్య మరణం అని ప్రత్యేకంగా వివరించడం
  rationale: సందర్భంలో ప్రత్యర్థులు దీనిని శారీరక మరణంతో అనుసంధానిస్తారు; యోహాను రచనలో ఈ మాటకు మరింత లోతైన భావం ఉండవచ్చు. అనువాదం ఆ ఉద్దేశపూర్వక ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని, సంభాషణలో సందర్భానికి తగిన ఏకవచన సంబోధనను ఉపయోగించాం. ‘దయ్యం పట్టింది’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది; మూలంలోని అక్షరార్థాన్ని పాదసూచికలో నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
