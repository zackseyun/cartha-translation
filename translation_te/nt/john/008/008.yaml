  text: ఆయన మళ్లీ[a] కిందికి వంగి నేల మీద రాస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వ్యభిచారం చేస్తూ పట్టుబడిన స్త్రీ కథనం (యోహాను 7:53–8:11) ఇక్కడ కొనసాగుతుంది. యోహాను 7:53లోని గమనిక చూడండి.
