id: JHN.8.12
reference: John 8:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: te
  text: 'అప్పుడు యేసు మళ్లీ వారితో ఇలా అన్నాడు: “నేనే లోకానికి వెలుగును. నన్ను అనుసరించేవాడు చీకటిలో ఎంతమాత్రమూ నడవడు[a]; అతడు జీవపు వెలుగును కలిగి ఉంటాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చీకటిలో ఎన్నటికీ నడవడు.” గ్రీకు మూలంలో బలమైన నిరాకరణ (οὐ μή) ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “జీవపు వెలుగు” అనే మాటను “జీవాన్ని ఇచ్చే వెలుగు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: కాబట్టి... మళ్లీ
  rationale: οὖν సందర్భంలోని కొనసాగింపును సూచిస్తుండగా, Πάλιν మాటల పునరావృతాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా రెండింటినీ నిలిపాం.
- source_word: ἐλάλησεν ὁ Ἰησοῦς λέγων
  choice: యేసు... ఇలా అన్నాడు
  rationale: గ్రీకు భాషలోని ‘మాట్లాడుతూ చెప్పాడు’ అనే నిర్మాణాన్ని తెలుగులో అసహజంగా పునరుక్తి చేయకుండా, ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου
  choice: నేనే లోకానికి వెలుగును
  rationale: ἐγώ అనే వ్యక్త సర్వనామంలోని ఉద్ఘాటనను ‘నేనే’ తెలియజేస్తుంది. κόσμος ఇక్కడ మానవ లోకాన్ని సూచిస్తుంది; ‘లోకానికి వెలుగు’ తెలుగులో సహజంగా ఉండి సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: నన్ను వెంబడించేవాడు
  rationale: వర్తమాన కృదంతం సూచించే నిరంతర శిష్యానుసరణను, ఏకవచన ప్రతినిధి భావాన్ని నిలుపుతుంది.
- source_word: οὐ μὴ περιπατήσῃ
  choice: ఎంతమాత్రమూ నడవడు
  rationale: οὐ μή అనే బలమైన నిరాకరణను సాధారణ ఆధునిక తెలుగులో దృఢంగా వ్యక్తం చేస్తుంది; ‘నడవడం’ అనే యోహాను రూపకాన్ని నిలుపుతుంది.
- source_word: ἐν τῇ σκοτίᾳ
  choice: చీకటిలో
  rationale: తెలుగులో సహజమైన రూపం; గ్రీకు నిర్దిష్ట పదం సూచించే చీకటి పరిధి భావం సందర్భం ద్వారా నిలుస్తుంది.
- source_word: ἕξει
  choice: ఉంటుంది
  rationale: ἔχω యొక్క భవిష్యత్ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘కలిగి ఉంటాడు’ కంటే సరళంగా ఉంది.
- source_word: τὸ φῶς τῆς ζωῆς
  choice: జీవపు వెలుగు
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని వ్యాఖ్యానాత్మకంగా కుదించకుండా నిలిపి, అది జీవానికి చెందిన వెలుగా లేక జీవాన్ని ఇచ్చే వెలుగా అనే భావ విస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: Ἐγώ εἰμι లో యేసు స్వీయ గుర్తింపు బలం
  choice: విధేయ పదంతో కూడిన వాక్యంగా ‘నేనే లోకానికి వెలుగును’ అని అనువదించడం
  alternative: దైవ నామానికి సూచనను స్పష్టంగా చేర్చడం
  rationale: ఈ వాక్యంలో Ἐγώ εἰμι కి ‘లోకపు వెలుగు’ అనే విధేయ నామవాచకం ఉంది. ‘నేనే’ ఉద్ఘాటనను నిలుపుతుంది గాని, మూలంలో స్పష్టంగా లేని దైవనామ వ్యాఖ్యానాన్ని చేర్చదు.
- issue: ‘జీవపు వెలుగు’లో షష్ఠీ సంబంధం
  choice: ‘జీవపు వెలుగు’ అనే సంక్షిప్త రూపాన్ని నిలుపడం
  alternative: ‘జీవాన్ని ఇచ్చే వెలుగు’
  rationale: τῆς ζωῆς మూలం, లక్షణం లేదా ఫలితం వంటి ఒకటి కంటే ఎక్కువ సంబంధాలను సూచించవచ్చు. వ్యాఖ్యానాత్మక ప్రత్యామ్నాయం వాటిలో ఒక్కదానికే భావాన్ని పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. యోహాను సువార్తలోని వెలుగు–చీకటి రూపకాన్ని, ‘జీవపు వెలుగు’లోని ఉద్దేశపూర్వక భావ విస్తృతిని నిలిపింది.
