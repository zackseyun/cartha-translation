id: JHN.8.33
reference: John 8:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: te
  text: 'వారు ఆయనకు ఇలా జవాబిచ్చారు: “మేము అబ్రాహాము సంతానం[a]. మేము ఎన్నడూ ఎవరికీ బానిసలుగా ఉండలేదు[b]. అలాంటప్పుడు, ‘మీరు స్వతంత్రులు అవుతారు’[c] అని నీవు ఎలా అంటున్నావు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అబ్రాహాము సంతతి.” గ్రీకులో శారీరక వంశాన్ని సూచించే ఏకవచన సమూహార్థక పదం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఎవరికీ సేవ చేయలేదు.” గ్రీకు క్రియకు ‘సేవ చేయడం’ అనే అర్థం కూడా ఉండవచ్చు; అయితే ఇక్కడ స్వేచ్ఛ–బానిసత్వ సందర్భం వల్ల బానిసత్వ భావమే బలంగా ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “మీరు స్వతంత్రులుగా ఉంటారు.” గ్రీకు పదబంధం మరింత అక్షరార్థంగా “మీరు స్వతంత్రులు అవుతారు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: వారు ఆయనకు ఇలా జవాబిచ్చారు
  rationale: గ్రీకు వాక్యంలోని ప్రత్యక్ష ప్రతిస్పందన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Σπέρμα Ἀβραάμ
  choice: అబ్రాహాము సంతానం
  rationale: σπέρμα ఇక్కడ శారీరక వంశాన్ని సూచించే ఏకవచన సమూహార్థక పదం. ‘సంతానం’ ఆ సమూహార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: మేము ఎన్నడూ ఎవరికీ బానిసలుగా ఉండలేదు
  rationale: సంపూర్ణ కాలపు కొనసాగిన స్థితిని, πώποτε యొక్క సంపూర్ణ నిరాకరణను, స్వేచ్ఛ–బానిసత్వ సందర్భాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: πῶς σὺ λέγεις
  choice: నీవు ఎలా అంటున్నావు
  rationale: σὺ వల్ల కలిగే వ్యక్తిగత ఉద్ఘాటనను ‘నీవు’ నిలుపుతుంది; ప్రశ్నలోని ఆశ్చర్యం లేదా అభ్యంతరం తెలుగులో సహజంగా వినిపిస్తుంది.
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: మీరు స్వతంత్రులు అవుతారు
  rationale: γίνομαι సూచించే స్థితి మార్పును ‘అవుతారు’ నిలుపుతుంది; ἐλεύθεροι కి ‘స్వతంత్రులు’ ఈ సందర్భంలో సహజమైన సమానం.
theological_decisions:
- issue: స్వేచ్ఛకు విరుద్ధంగా δουλεύω పదాన్ని అనువదించడం
  choice: బానిసలుగా ఉండలేదు
  alternative: సేవ చేయలేదు
  rationale: తదుపరి సందర్భంలో బానిసత్వం–స్వేచ్ఛ ప్రధాన విరుద్ధాంశం. అందువల్ల సాధారణ సేవ కంటే బంధిత స్థితిని తెలిపే అనువాదం సందర్భానికి సరిపోతుంది.
- issue: Σπέρμα Ἀβραάμ అనే వంశపరమైన దావా
  choice: అబ్రాహాము సంతానం
  alternative: అబ్రాహాము సంతతి
  rationale: ఇది ఇక్కడ శారీరక వంశసంబంధ దావాను తెలియజేస్తుంది; ఇతర గ్రంథభాగాల ప్రత్యేక ధార్మిక భావాలను ఇందులోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. యేసును ఉద్దేశించిన ఏకవచన σὺ ను ‘నీవు’గా, సమూహాన్ని ఉద్దేశించిన బహువచనాన్ని ‘మీరు’గా వేరు చేశాం. మూలంలోని స్వేచ్ఛ–బానిసత్వ ఉద్రిక్తతను తగ్గించకుండా నిలిపాం.
