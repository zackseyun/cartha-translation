review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the hostile testing, Jesus’ bending down, writing with his finger on the ground, and his deliberate non-engagement. However, “ఆధారం దొరకాలని” (“so that evidence/basis might be found”) adds the idea of obtaining evidentiary grounds, whereas κατηγορίαν ἔχωσιν means that they might have an accusation/charge against him.
  naturalness: The Telugu is modern and generally fluent. Recasting the purpose clause directly as an accusation they could bring makes the sentence more precise while retaining natural Telugu.
  terminology: “పరీక్షించడానికి” appropriately reflects πειράζοντες in this adversarial context without implying temptation. “ఆరోపణ మోపడానికి” accurately conveys the legal force of κατηγορία. “పట్టించుకోకుండా” remains a natural contextual rendering of μὴ προσποιούμενος, without specifying what Jesus wrote or adding an object to his writing.
  issues:
  - severity: medium
    issue: “ఆయనపై నేరారోపణ చేయడానికి ఆధారం దొరకాలని” renders κατηγορία as a basis/evidence that might be found.
    rationale: The Greek says that they might have an accusation against Jesus, not that they might find supporting evidence. A direct reference to bringing an accusation better preserves the source meaning.
  revised_text: వారు ఆయనను పరీక్షించడానికి ఇలా చెప్పారు, తద్వారా ఆయనపై ఆరోపణ మోపడానికి వారికి అవకాశం ఉండాలని. అయితే యేసు కిందికి వంగి, వారిని పట్టించుకోకుండా తన వేలితో నేల మీద రాశాడు.
  revised_footnotes:
