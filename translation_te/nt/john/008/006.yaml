id: JHN.8.6
reference: John 8:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: te
  text: వారు ఆయనను పరీక్షించడానికి ఇలా చెప్పారు, తద్వారా ఆయనపై ఆరోపణ మోపడానికి వారికి అవకాశం ఉండాలని. అయితే యేసు కిందికి వంగి, వారిని పట్టించుకోకుండా తన వేలితో నేల మీద రాశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πειράζοντες
  choice: పరీక్షిస్తూ
  rationale: ఇక్కడ వారు యేసును పాపానికి ప్రలోభపెట్టడం కాదు, ఆయనను చిక్కులో పెట్టే ఉద్దేశంతో పరీక్షిస్తున్నారు. అందువల్ల ‘పరీక్షిస్తూ’ సందర్భానికి తగినది.
- source_word: κατηγορίαν
  choice: నేరారోపణ చేయడానికి ఆధారం
  rationale: ఈ పదం యేసుకు వ్యతిరేకంగా మోపగల ఆరోపణను సూచిస్తుంది. సహజమైన తెలుగులో ఉద్దేశ్య వాక్యంతో కలిపి ‘నేరారోపణ చేయడానికి ఆధారం’ అని అనువదించడం న్యాయసంబంధ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: κάτω κύψας
  choice: కిందికి వంగి
  rationale: శరీరాన్ని కిందికి వంచిన చర్యను సరళంగా, మూలంలోని కృదంత నిర్మాణానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: ἔγραφεν εἰς τὴν γῆν
  choice: నేల మీద రాశాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న చర్యను సూచించగలిగినా, తెలుగులో ఈ సందర్భంలో ‘రాశాడు’ సహజంగా ఉంటుంది; ఆయన ఏమి రాశాడో మూలం చెప్పనందున దానిని నిర్దిష్టం చేయలేదు.
- source_word: μὴ προσποιούμενος
  choice: వారిని పట్టించుకోకుండా
  rationale: గమనించనట్లు లేదా విననట్లు వ్యవహరించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. మూలంలో యేసు నేలపై ఏమి రాశాడో చెప్పలేదు కాబట్టి ఆ సందిగ్ధతను అలాగే ఉంచాం.
