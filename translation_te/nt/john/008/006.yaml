- from: ఆయనను పరీక్షిస్తూ, ఆయనపై నేరారోపణ చేయడానికి ఆధారం దొరకాలని వారు[a] ఇలా అన్నారు. అయితే యేసు కిందికి వంగి, వారిని పట్టించుకోకుండా తన వేలితో నేల మీద రాశాడు.
  to: వారు ఆయనను పరీక్షించడానికి ఇలా చెప్పారు, తద్వారా ఆయనపై ఆరోపణ మోపడానికి వారికి అవకాశం ఉండాలని. అయితే యేసు కిందికి వంగి, వారిని పట్టించుకోకుండా తన వేలితో నేల మీద రాశాడు.
