  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: te
  text: అందుచేత వారు ఆయనతో, “నువ్వు ఎవరు?” అని అడిగారు. యేసు వారితో, “నేను మొదటి నుంచీ మీతో చెబుతూ వస్తున్నవాడినే,”[a] అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ గ్రీకు పదబంధాన్ని మరో విధంగా, “నేను మీతో అసలు ఎందుకు మాట్లాడుతున్నాను?” అని కూడా అనువదించవచ్చు.
    reason: τὴν ἀρχὴν మరియు ὅ τι కలయిక వ్యాకరణపరంగా క్లిష్టమైనది; SBLGNTలోని ప్రశ్నార్థక విరామచిహ్నం ఈ ప్రత్యామ్నాయ పఠనానికి వీలు కల్పిస్తుంది.
lexical_decisions:
- source_word: ἔλεγον
  choice: అడిగారు
  rationale: అసంపూర్ణ భూతకాల రూపం మాటల చర్యను సూచిస్తుంది; ప్రత్యక్ష ప్రశ్న ఉన్నందున ఆధునిక తెలుగులో ‘అడిగారు’ సహజంగా ఉంటుంది.
- source_word: Σὺ τίς εἶ;
  choice: నువ్వు ఎవరు?
  rationale: సర్వనామానికి ఉన్న ఉద్ఘాటనను ‘నువ్వు’తో స్పష్టంగా ఉంచి, ప్రశ్నను సహజమైన ఆధునిక తెలుగులో ఇచ్చాం.
- source_word: Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν
  choice: మొదటి నుంచీ నేను మీతో చెబుతూ ఉన్నదే
  rationale: τὴν ἀρχήν‌ను కాలార్థంలో ‘మొదటి నుంచీ’గా, ὅ τι‌ను ‘ఉన్నది’గా, καί ఇచ్చే ఉద్ఘాటనను ‘దే’తో వ్యక్తం చేశాం; గ్రీకు వాక్యంలోని సంక్షిప్త జవాబు స్వరూపాన్ని నిలిపాం.
theological_decisions:
- issue: యేసు జవాబులోని వ్యాకరణ, విరామచిహ్న సంబంధిత అస్పష్టత
  choice: ప్రధాన పాఠంలో ‘మొదటి నుంచీ నేను మీతో చెబుతూ ఉన్నదే’
  alternative: ‘నేను మీతో అసలు ఎందుకు మాట్లాడుతున్నాను?’ లేదా ‘నేను మొదటి నుంచీ మీతో చెప్పినవాడినే’
  rationale: గ్రీకు పదబంధానికి అనేక పురాతన, ఆధునిక వ్యాఖ్యానాలు సాధ్యమైనప్పటికీ, సందర్భానికి మరియు సంప్రదాయ కాలార్థ పఠనానికి ప్రధాన అనువాదం సరిపోతుంది. ప్రత్యామ్నాయ ప్రశ్నార్థక పఠనాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా నిజమైన అస్పష్టతను దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంభాషణ సహజంగా, గౌరవప్రదమైన గ్రంథశైలిలో ఉంది. ప్రశ్నలోని ప్రత్యక్షతను నిలుపుతూ ‘నువ్వు’ వాడాం; యేసు జవాబులో మూలంలోని సంక్షిప్తత, అస్పష్టతను సాధ్యమైనంతవరకు కాపాడాం.
