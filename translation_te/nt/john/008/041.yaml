    issue: “మీ తండ్రి చేసే పనులనే” does not directly represent “the works of your father.”
    rationale: It can be read as works that the father himself performs, rather than the father’s works/deeds, and -నే introduces an exclusivity not expressed by the Greek.
  - severity: medium
    issue: “లైంగిక అవినీతి” is a misleading lexical choice for πορνεία in Telugu.
    rationale: అవినీతి ordinarily refers to corruption, especially public or institutional corruption. “లైంగిక అనైతికత” is the clearer modern Telugu equivalent for the broad category denoted by πορνεία.
