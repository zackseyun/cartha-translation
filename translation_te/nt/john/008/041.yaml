review_pass:
  verdict: revise
  source_fidelity: The draft’s first clause, “మీ తండ్రి చేసే పనులనే,” can mean “the works that your father does” and adds an exclusive emphasis through -నే. The Greek says simply “you are doing the works of your father.” The revised wording renders the possessive relationship directly. For ἐκ πορνείας, “లైంగిక అవినీతి” is not the most suitable Telugu term, since అవినీతి commonly denotes corruption; “లైంగిక అనైతికత” better conveys the Greek’s broad sexual-misconduct term while retaining the idiomatic birth expression and its ambiguity.
  naturalness: The revision is fluent modern standard Telugu. “మీరు మీ తండ్రి పనులను చేస్తున్నారు” is direct and idiomatic. “లైంగిక అనైతికత వల్ల జన్మించినవాళ్లం కాదు” is clearer and more natural than the draft’s “లైంగిక అవినీతి వల్ల పుట్టినవాళ్లం కాదు.”
  terminology: “తండ్రి” and “దేవుడు” appropriately preserve the source’s relational and theological language without interpretive expansion. The footnote retains “అక్రమ సంతానం కాదు” as an alternative rather than making that implication the main text. The footnote marker is placed on the phrase to which it pertains.
  issues:
