source:
  edition: SBLGNT
  text: ὑμεῖς ποιεῖτε τὰ ἔργα τοῦ πατρὸς ὑμῶν. ⸀εἶπαν αὐτῷ· Ἡμεῖς ἐκ πορνείας ⸂οὐ γεγεννήμεθα⸃· ἕνα πατέρα ἔχομεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: te
  text: “మీరు మీ తండ్రి పనులను చేస్తున్నారు.” వారు ఆయనతో, “మేము లైంగిక అనైతికత వల్ల జన్మించినవాళ్లం కాదు[a]. మాకు ఒకే తండ్రి ఉన్నాడు—దేవుడు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేము అక్రమ సంతానం కాదు.” గ్రీకు వాక్యం అక్షరార్థంగా, “మేము లైంగిక అనైతికత వల్ల జన్మించినవాళ్లం కాదు” అని చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖτε
  choice: చేస్తున్నారు
  rationale: వర్తమాన కాల క్రియ కొనసాగుతున్న చర్యను సూచిస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: τὰ ἔργα
  choice: పనులను
  rationale: ἔργα అనే పదానికి ‘పనులు/కార్యాలు’ అనే సాధారణ అర్థం ఉంది; ‘చేయు’ అనే క్రియతో సహజమైన అనుసంధానాన్ని నిలుపుతుంది.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: మీ తండ్రి
  rationale: ఇక్కడ πατήρ సంబంధాన్ని, మూలాన్ని సూచించే రూపకాలంకార ప్రయోగం; ‘తండ్రి’ మూలపాఠంలోని కుటుంబ సంబంధ భాషను, వేదాంతపరమైన ఉద్రిక్తతను కాపాడుతుంది.
- source_word: ἐκ πορνείας
  choice: లైంగిక అవినీతి వల్ల
  rationale: πορνεία విస్తృతంగా లైంగిక అనైతికతను సూచిస్తుంది. γεννάωతో కూడిన ఈ ప్రయోగంలో అక్రమ సంబంధం వల్ల కలిగిన జననాన్ని సూచించవచ్చు; ప్రధాన పాఠం గ్రీకు పదబంధానికి సమీపంగా ఉంచబడింది.
- source_word: οὐ γεγεννήμεθα
  choice: పుట్టినవాళ్లం కాదు
  rationale: పరిపూర్ణ కర్మణి రూపాన్ని తెలుగులో జననాన్ని సూచించే సహజమైన నామవాచక క్రియారూపంతో అందించింది.
- source_word: ἕνα πατέρα ἔχομεν
  choice: మాకు ఒకే తండ్రి ఉన్నాడు
  rationale: ἕνα ప్రత్యేకతను నొక్కిచెబుతుంది; ‘ఒకే’ ఆ బలాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸν θεόν
  choice: దేవుడు
  rationale: ఇది ‘ఒకే తండ్రి’ ఎవరో సమానాధికారంగా గుర్తిస్తుంది; దీర్ఘరేఖ ఆ వివరణాత్మక సంబంధాన్ని సహజంగా చూపుతుంది.
theological_decisions:
- issue: ‘ἐκ πορνείας’ను అక్రమ సంతానమనే అర్థంతో నేరుగా స్పష్టీకరించాలా?
  choice: ప్రధాన పాఠంలో ‘లైంగిక అవినీతి వల్ల పుట్టినవాళ్లం కాదు’ అని మూలపాఠపు రూపాన్ని నిలుపడం
  alternative: ‘మేము అక్రమ సంతానం కాదు’
  rationale: ఈ గ్రీకు ప్రయోగం అక్రమ జననాన్ని తిరస్కరించే భావాన్ని సూచించే అవకాశం ఉన్నప్పటికీ, మూలపాఠం దానిని πορνεία వల్ల పుట్టడం అనే రూపంలో చెబుతుంది. ప్రధాన పాఠంలో ఆ అస్పష్టతను, వాదనాత్మక ఉద్రిక్తతను కాపాడి, సహజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన సంభాషణా శైలిని వాడాం. ‘తండ్రి’ అనే పదాన్ని రూపకాలంకార, వేదాంత సంబంధ ఉద్రిక్తతతో సహా నిలిపాం; ‘అక్రమ సంతానం’ అనే వ్యాఖ్యాత్మక అర్థాన్ని ప్రధాన పాఠంలోకి చేర్చకుండా పాదసూచికలో ఉంచాం.
