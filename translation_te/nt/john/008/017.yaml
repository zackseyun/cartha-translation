  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: te
  text: 'మీ ధర్మశాస్త్రంలో కూడా ఇలా రాసి ఉంది: “ఇద్దరు మనుషుల సాక్ష్యం సత్యమైనది”[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇద్దరు వ్యక్తుల సాక్ష్యం సత్యమైనది.” గ్రీకులో ‘మనుషులు’ అనే పదం ఉంది; ఇక్కడ అది మానవ సాక్షులను సూచించే సంప్రదాయ న్యాయప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμῳ
  choice: ధర్మశాస్త్రంలో
  rationale: ఇక్కడ యేసు ప్రస్తావిస్తున్నది యూదుల లిఖిత ధార్మిక-న్యాయ ప్రమాణం. ఆధునిక తెలుగు బైబిలు వాడుకలో ‘ధర్మశాస్త్రం’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὑμετέρῳ
  choice: మీ
  rationale: రెండవ పురుష possessive ను నేరుగా నిలుపుతూ, ‘మీ సొంత’ అని అదనపు తీవ్రత చేర్చకుండా యేసు మాటలోని వాగ్వాద దూరాన్ని కాపాడుతుంది.
- source_word: γέγραπται
  choice: రాసి ఉంది
  rationale: గ్రీకు perfect passive సూత్రప్రయోగంలోని గతంలో రాయబడి ఇప్పటికీ అమలులో ఉన్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δύο ἀνθρώπων
  choice: ఇద్దరు మనుషుల
  rationale: ἄνθρωπος ఇక్కడ న్యాయసంబంధ సాక్షులను సూచించే సాధారణ మానవపదం. ‘మనుషులు’ మూలంలోని మానవ సూచనను కాపాడుతూ తెలుగులో సహజంగా ఉంది; ‘పురుషులు’ అనే మరింత లింగ-నిర్దిష్ట రూపాన్ని పాదటిప్పణిలో ఇస్తున్నాం.
- source_word: μαρτυρία
  choice: సాక్ష్యం
  rationale: న్యాయసంబంధ సందర్భంలో μαρτυρίαకు ‘సాక్ష్యం’ సహజమైన, ఖచ్చితమైన తెలుగు సమానం.
- source_word: ἀληθής
  choice: సత్యమైనది
  rationale: మూలపదం యొక్క ప్రత్యక్ష అర్థమైన ‘true’ ను నిలుపుతుంది; న్యాయపరంగా చెల్లుబాటు అయ్యేదనే అంతర్భావాన్ని ‘చెల్లుబాటు’ అని స్పష్టీకరించి పరిమితం చేయదు.
- source_word: καὶ ... δὲ
  choice: అంతేకాదు ... కూడా
  rationale: సంబంధాన్ని, స్వల్ప ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘మీ ధర్మశాస్త్రం’ అనే మాటలోని వాగ్వాద భావం
  choice: ‘మీ’ అనే ప్రత్యక్ష సంబోధనను నిలుపడం
  alternative: ‘ధర్మశాస్త్రంలో’ అని మాత్రమే అనడం; ‘మీ సొంత ధర్మశాస్త్రంలో’ అనడం
  rationale: గ్రీకులో రెండవ పురుష possessive స్పష్టంగా ఉంది. ‘మీ’ దాన్ని నిలుపుతుంది; అయితే యేసు ధర్మశాస్త్రాన్ని తిరస్కరిస్తున్నాడనే భావాన్ని చేర్చదు, ‘సొంత’ అని మూలంలో లేని తీవ్రతనూ పెంచదు.
- issue: న్యాయసూత్రంలో ἀνθρώπων అనువాదం
  choice: ప్రధాన పాఠ్యంలో ‘మనుషుల’
  alternative: ‘పురుషుల’; ‘వ్యక్తుల’
  rationale: గ్రీకు ἄνθρωπος వ్యాకరణపరంగా పుంలింగ రూపంలో ఉన్నప్పటికీ సాధారణంగా ‘మానవుడు/వ్యక్తి’ అనే అర్థం కలిగి ఉంటుంది. తెలుగు ‘మనుషులు’ ఆ సహజ విస్తృతిని కాపాడుతుంది; మరింత లింగ-నిర్దిష్ట పఠనాన్ని పాదటిప్పణిలో సూచించడం మూలంలోని పరిధిని మూసివేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘రాసి ఉంది’ సహజ ఆధునిక ప్రయోగం; ‘సాక్ష్యం’, ‘ధర్మశాస్త్రం’ సందర్భానికి తగిన స్థిర పదాలు.
