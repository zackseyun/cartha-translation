id: JHN.8.23
reference: John 8:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν αὐτοῖς· Ὑμεῖς ἐκ τῶν κάτω ἐστέ, ἐγὼ ἐκ τῶν ἄνω εἰμί· ὑμεῖς ἐκ ⸂τούτου τοῦ κόσμου⸃ ἐστέ, ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా చెప్పాడు: “మీరు కిందనుండి వచ్చినవారు; నేను పైనుండి వచ్చినవాడిని. మీరు ఈ లోకం నుండి వచ్చినవారు; నేను ఈ లోకం నుండి వచ్చినవాడిని కాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న మాటను సహజమైన తెలుగులో నిలుపుతుంది; సందర్భానుసారం సాధారణ ‘చెప్పాడు’ కూడా సాధ్యమే.
- source_word: Ὑμεῖς / ἐγὼ
  choice: మీరు / నేను
  rationale: గ్రీకులో స్పష్టంగా ఉన్న సర్వనామాల నొక్కిచెప్పే వ్యత్యాసాన్ని తెలుగులో నిలుపుతుంది.
- source_word: ἐκ τῶν κάτω / ἐκ τῶν ἄνω
  choice: కిందనుండి వచ్చినవారు / పైనుండి వచ్చినవాణ్ణి
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవాన్ని, అలాగే కింద–పైన అనే యోహాను సువార్తలోని నిలువు వ్యత్యాసాన్ని, అతిగా వ్యాఖ్యానించకుండా వ్యక్తం చేస్తుంది.
- source_word: κόσμος
  choice: లోకం
  rationale: భౌతిక భూమిని మాత్రమే కాక దేవునికి దూరమైన మానవ వ్యవస్థను కూడా సూచించగల గ్రీకు పదపు విస్తృతిని నిలుపుతుంది.
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: ఈ లోకానికి చెందిన
  rationale: తెలుగులో సహజంగా ఉండేందుకు ‘చెందిన’ అని ఇచ్చినా, మూలంలోని ἐκ తెలియజేసే ఉద్భవం/సంబంధ పరిధి భావాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
theological_decisions:
- issue: ‘కిందనుండి/పైనుండి’ మరియు ‘ఈ లోకం’ అనే వ్యత్యాసపు అర్థం
  choice: మూలం మరియు పరిధిని సూచించే రూపకాలనే నిలిపి, వాటిని పూర్తి నైతిక లేదా సిద్ధాంతపరమైన వివరణగా విస్తరించలేదు.
  alternative: ‘భూసంబంధులు/పరలోకసంబంధిని’ లేదా ‘దేవునికి విరోధమైన లోకవ్యవస్థకు చెందినవారు’ అని స్పష్టీకరించడం.
  rationale: గ్రీకు వాక్యం యేసుకు ఆయన శ్రోతలకు మధ్య ఉన్న తీవ్రమైన యోహానీయ వ్యత్యాసాన్ని చూపుతుంది; అయితే ఆ రూపకాన్ని మూలపాఠం చెప్పినదానికంటే సంకుచితమైన సిద్ధాంత ప్రకటనగా మార్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మొదటి జతలో కింద–పైన మూలభావాన్ని స్పష్టంగా ఉంచి, రెండవ జతలో సహజమైన తెలుగు కోసం ‘చెందిన’ వాడబడింది. పాదసూచికలు అవసరం లేనందున ప్రధాన పాఠ్యంలో సూచికలు లేవు.
