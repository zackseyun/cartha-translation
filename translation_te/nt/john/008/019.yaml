source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: te
  text: 'కాబట్టి వారు ఆయనను, “నీ తండ్రి ఎక్కడ ఉన్నాడు?” అని అడిగారు. యేసు జవాబిచ్చాడు: “మీకు నేనుగానీ నా తండ్రిగానీ తెలియదు. మీరు నన్ను తెలిసి ఉంటే[a], నా తండ్రిని కూడా తెలిసి ఉండేవారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, గతకాల వాస్తవవిరుద్ధ భావాన్ని మరింత స్పష్టంగా చూపుతూ: “మీరు నన్ను తెలిసి ఉండి ఉంటే, నా తండ్రిని కూడా తెలిసి ఉండేవారు.” గ్రీకు షరతు నిర్మాణాన్ని ఈ విధంగానూ అనువదించవచ్చు.'
    reason: షరతు వాక్యంలోని కాలభావానికి సాధ్యమైన మరింత స్పష్టమైన ప్రత్యామ్నాయాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: ἔλεγον
  choice: అడుగుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృతమైన మాటను సూచిస్తుంది. సందర్భంలో వారి మాట ప్రశ్న కావడంతో ‘అడుగుతూ ఉన్నారు’ సహజమైన తెలుగులో ఆ కాలభావాన్ని నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి మాటల నుంచి ఈ ప్రశ్న ఉద్భవిస్తున్న సంబంధాన్ని స్పష్టంగా చూపుతుంది; తెలుగు వాక్యప్రవాహంలో సహజంగా ఉంటుంది.
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: నీ తండ్రి ఎక్కడ ఉన్నాడు?
  rationale: ప్రశ్నలోని నేరుగా ఉన్న భావాన్ని నిలుపుతుంది. తెలుగులో పెద్ద అక్షరాల భేదం లేనందున దైవిక సూచనను అక్షరరూపం ద్వారా ప్రత్యేకంగా గుర్తించడం సాధ్యం కాదు; సందర్భమే దానిని తెలియజేస్తుంది.
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: కథనంలో ప్రత్యుత్తరాన్ని తెలిపే సహజమైన ప్రామాణిక తెలుగు రూపం.
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: మీరు నన్ను ఎరుగరు; నా తండ్రినీ ఎరుగరు
  rationale: οὔτε…οὔτε అనే సమాంతర నిరాకరణను రెండు సమతుల్య భాగాలుగా నిలుపుతుంది. ‘ఎరుగరు’ అనేది వ్యక్తిని తెలుసుకోవడం, గుర్తించడం, సంబంధపూర్వకంగా తెలిసి ఉండడం వంటి విస్తృత భావాన్ని సంకుచితం చేయదు.
- source_word: οἶδατε / ᾔδειτε
  choice: ఎరుగరు / ఎరిగి ఉంటే / ఎరిగి ఉండేవారు
  rationale: ఒకే గ్రీకు క్రియకు తెలుగు మూలపదసంబంధాన్ని కొనసాగిస్తూ, వర్తమాన నిరాకరణను మరియు ఊహాత్మక షరతును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: మీరు నన్ను ఎరిగి ఉంటే, నా తండ్రిని కూడా ఎరిగి ఉండేవారు
  rationale: గ్రీకులోని వర్తమానానికి విరుద్ధమైన ఊహాత్మక షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. ‘కూడా’ καί యొక్క జోడింపు భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘తండ్రి’ దేవుణ్ణి సూచిస్తున్నదని ఎలా తెలియజేయాలి
  choice: ‘తండ్రి’ అనే బంధసూచక పదాన్నే ఉంచి, సందర్భం ద్వారా దైవిక సూచనను తెలియనివ్వడం
  alternative: ‘తండ్రియైన దేవుడు’ అని విస్తరించడం
  rationale: గ్రీకు పాఠం ‘తండ్రి’ అనే పదమే వాడుతుంది. తెలుగులో capitalization లేకపోవడంతో అదనంగా ‘దేవుడు’ చేర్చడం మూలపాఠానికి మించిన వివరణ అవుతుంది; యోహాను సందర్భం ఉద్దేశించిన వ్యంగ్యాన్ని, అపార్థాన్ని నిలుపుతుంది.
- issue: యేసును మరియు తండ్రిని ‘తెలుసుకోవడం’ అనే భావం
  choice: ‘ఎరుగు’ అనే విస్తృతార్థక క్రియను ఉపయోగించడం
  alternative: ‘గుర్తించు’ లేదా ‘అర్థం చేసుకో’
  rationale: ఈ భావాన్ని కేవలం గుర్తింపుగానో మేధోపరమైన అవగాహనగానో పరిమితం చేయకుండా, యోహాను రచనలోని సంబంధపూర్వక మరియు జ్ఞానపూర్వక ఉద్వేగాన్ని నిలుపుతుంది.
- issue: షరతు వాక్యంలోని వాస్తవవిరుద్ధ భావం
  choice: ‘ఎరిగి ఉంటే … ఎరిగి ఉండేవారు’ అనే ఊహాత్మక నిర్మాణం
  alternative: ‘ఎరిగి ఉండి ఉంటే … ఎరిగి ఉండేవారు’ అని మరింత స్పష్టమైన గత వాస్తవవిరుద్ధ రూపం
  rationale: గ్రీకు imperfect రూపాలు తప్పనిసరిగా గతకాల సంఘటనను మాత్రమే సూచించకుండా వర్తమాన వాస్తవానికి విరుద్ధమైన పరిస్థితిని తెలియజేయగలవు. ప్రధాన పాఠం ఆ కాలసంబంధ అనిశ్చితిని అనవసరంగా గతానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని ఉపయోగించాం. ‘ఎరుగు’ కొద్దిగా గంభీరమైనదైనా సాధారణ పాఠకులకు అర్థమయ్యే, వ్యక్తిని తెలుసుకోవడం అనే విస్తృత భావాన్ని మోయగల పదం. ‘అడుగుతూ ఉన్నారు’ అసంపూర్ణ భూతకాల కొనసాగింపు భావాన్ని చూపుతుంది. తెలుగు లిపిలో పెద్ద/చిన్న అక్షరాల భేదం లేనందున ‘తండ్రి’కి దైవిక సూచన సందర్భం ద్వారానే తెలుస్తుంది.
