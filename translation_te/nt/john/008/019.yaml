  to: 'కాబట్టి వారు ఆయనను, “నీ తండ్రి ఎక్కడ ఉన్నాడు?” అని అడిగారు. యేసు జవాబిచ్చాడు: “మీకు నేనుగానీ నా తండ్రిగానీ తెలియదు. మీరు నన్ను తెలిసి ఉంటే[a], నా తండ్రిని కూడా తెలిసి ఉండేవారు.”'
