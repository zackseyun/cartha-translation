revisions:
- from: ఆయన దేవాలయంలో[a] బోధిస్తూ, కానుకల ఖజానా ప్రాంతంలో ఈ మాటలు పలికాడు. అయినా ఎవరూ ఆయనను పట్టుకోలేదు; ఎందుకంటే ఆయన ఘడియ ఇంకా రాలేదు.[b]
  to: ఆయన దేవాలయంలో[a] బోధిస్తూ, కానుకల ఖజానాలో ఈ మాటలు పలికాడు; ఎవరూ ఆయనను పట్టుకోలేదు, ఎందుకంటే ఆయన ఘడియ ఇంకా రాలేదు.[b]
  rationale: The revision removes the unsupported concessive ‘అయినా’ and uses direct coordination that reflects καί. It also streamlines the rendering of γαζοφυλάκιον without narrowing it to a single receptacle or asserting more spatial detail than the Greek requires. Both footnote anchors remain present and correctly placed.
