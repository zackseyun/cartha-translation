id: JHN.8.20
reference: John 8:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ταῦτα τὰ ῥήματα ⸀ἐλάλησεν ἐν τῷ γαζοφυλακίῳ διδάσκων ἐν τῷ ἱερῷ· καὶ οὐδεὶς ἐπίασεν αὐτόν, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: te
  text: ఆయన దేవాలయంలో[a] బోధిస్తూ, కానుకల ఖజానాలో ఈ మాటలు పలికాడు; ఎవరూ ఆయనను పట్టుకోలేదు, ఎందుకంటే ఆయన ఘడియ ఇంకా రాలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవాలయ ప్రాంగణాల్లో’; ఇక్కడి గ్రీకు పదం అంతర్గర్భాలయాన్ని మాత్రమే కాక దేవాలయ సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: యోహాను సువార్తలో ‘ఆయన ఘడియ’ అనేది యేసు బాధపడి, మరణించి, మహిమ పొందేలా నిర్ణయించబడిన సమయాన్ని సూచిస్తుంది. లేదా ‘ఆయనకు నియమించబడిన ఘడియ’.
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα ἐλάλησεν
  choice: ఈ మాటలు పలికాడు
  rationale: ῥήματα పలికిన మాటలను సూచిస్తుంది; ἐλάλησεν‌తో కలిపి ‘ఈ మాటలు పలికాడు’ సహజంగా ఉండి, ముందున్న ప్రసంగాన్ని సూచిస్తుంది.
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: కానుకల ఖజానా ప్రాంతంలో
  rationale: γαζοφυλάκιον ఒకే పెట్టెను మాత్రమే కాక దేవాలయ కానుకల ఖజానా ఉన్న ప్రాంతాన్ని సూచించవచ్చు. ‘ప్రాంతంలో’ అనే పదం స్థలార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: διδάσκων
  choice: బోధిస్తూ
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలికమైన చర్యను తెలియజేస్తుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయంలో
  rationale: ἱερόν అంతర్గర్భాలయాన్ని మాత్రమే కాక మొత్తం దేవాలయ ప్రాంగణ సముదాయాన్ని సూచిస్తుంది; ప్రధాన పాఠ్యంలో సహజమైన ‘దేవాలయంలో’ ఉంచి విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: οὐδεὶς ἐπίασεν αὐτόν
  choice: ఎవరూ ఆయనను పట్టుకోలేదు
  rationale: πιάζω పట్టుకోవడం లేదా అదుపులోకి తీసుకోవడం అనే ప్రతికూల భౌతిక భావాన్ని కలిగి ఉంది. ‘పట్టుకోలేదు’ న్యాయపరమైన ‘అరెస్టు’ భావాన్ని అనవసరంగా జోడించదు.
- source_word: ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ
  choice: ఎందుకంటే ఆయన ఘడియ ఇంకా రాలేదు
  rationale: ὅτι కారణాన్ని తెలియజేస్తుంది; οὔπω ἐληλύθει గతంలోని ఆ సమయానికి ఇంకా రాని స్థితిని సూచిస్తుంది. ‘ఆయన ఘడియ’ యోహాను సువార్తలోని ఉద్దేశపూర్వక రూపక, వేదాంతపరమైన ప్రతిధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: యోహాను సువార్తలో ‘ఆయన ఘడియ’ అనే ప్రయోగం
  choice: ప్రధాన పాఠ్యంలో ‘ఆయన ఘడియ’ అని యథాతథ రూపకాన్ని నిలుపడం
  alternative: ‘ఆయనకు నియమించబడిన సమయం’ లేదా ‘ఆయన సమయం’
  rationale: ఈ పదబంధం కేవలం కాలసూచన కాక, యేసు బాధ, మరణం, మహిమ పొందడం సంభవించే నియమిత సమయాన్ని సూచించే యోహానీయ ఇతివృత్తం. దానిని వివరణాత్మకంగా మార్చకుండా మూలంలోని వేదాంతపరమైన ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘కానుకల ఖజానా ప్రాంతం’ సాధారణ పాఠకునికి స్థలాన్ని స్పష్టం చేస్తుంది; ‘ఘడియ’ యోహానీయ ప్రతీకాత్మకతను కాపాడుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
