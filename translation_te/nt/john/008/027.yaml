id: JHN.8.27
reference: John 8:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἔγνωσαν ὅτι τὸν πατέρα αὐτοῖς ἔλεγεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/027.yaml
  text: They did not understand that he was speaking to them about the Father[a].
translation:
  language: te
  text: తాను తండ్రి గురించి వారితో మాట్లాడుతున్నాడని వారు గ్రహించలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాను తండ్రి గురించి వారితో మాట్లాడుతున్నాడని వారికి తెలియలేదు.”
    reason: γινώσκω అనే పదానికి ‘తెలుసుకొను/తెలియుట’ అనే మరింత ప్రత్యక్ష పదార్థం కూడా సాధ్యమే.
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: వారు గ్రహించలేదు
  rationale: γινώσκω సాధారణంగా ‘తెలుసుకొను’ అని అర్థమిచ్చినా, ఇక్కడ యేసు ఎవరి గురించి చెబుతున్నాడో వారు అర్థం చేసుకోలేకపోవడాన్ని సూచిస్తుంది. ‘గ్రహించలేదు’ అనే పదం ఈ సందర్భంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: వారు గ్రహించని విషయాన్ని తెలిపే ఉపవాక్యాన్ని సహజమైన తెలుగులో ‘అని’ పరిచయం చేస్తుంది.
- source_word: τὸν πατέρα
  choice: తండ్రి
  rationale: యోహాను సువార్త సందర్భంలో ఇది యేసు దేవుణ్ణి ఉద్దేశించి వాడే ‘తండ్రి’ అనే సంబోధన. తెలుగు లిపిలో పెద్ద అక్షర భేదం లేనందున అదనపు గుర్తింపు అవసరం లేదు.
- source_word: αὐτοῖς
  choice: తమతో
  rationale: λέγωతో వచ్చిన దత్తివిభక్తిని ఈ వాక్య నిర్మాణంలో సహజంగా ‘తమతో’ అని అనువదించవచ్చు; ఇది ఆయన వారిని ఉద్దేశించి మాట్లాడుతున్నాడనే భావాన్ని ఇస్తుంది.
- source_word: ἔλεγεν
  choice: మాట్లాడుతున్నాడని
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న క్రియను సూచిస్తుంది; ‘మాట్లాడుతున్నాడు’ అనే రూపం ఆ క్రియాంశాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘తండ్రి’ అనే పదానికి సూచిత వ్యక్తి
  choice: యేసు దేవుడైన తండ్రి గురించి మాట్లాడుతున్నాడు.
  alternative: మానవ తండ్రి గురించి మాట్లాడుతున్నాడు.
  rationale: సమీప యోహాను సందర్భంలో ‘తండ్రి’ అనేది దేవుణ్ణి సూచించే యేసు వాడుక. అనువాదం తరువాతి సిద్ధాంత వివరాలను చేర్చకుండా ఈ సందర్భార్థాన్ని నిలుపుతుంది.
- issue: సందర్భంలో γινώσκω అనువాదం
  choice: ‘తెలుసుకోలేదు’ కంటే ‘గ్రహించలేదు’
  alternative: తెలుసుకోలేదు; గుర్తించలేదు
  rationale: ఇక్కడ శ్రోతలకు సమాచారం లేకపోవడం కంటే, యేసు మాటల సూచనను వారు అర్థం చేసుకోకపోవడమే ప్రధాన భావం. ‘గ్రహించలేదు’ మూలపదపు జ్ఞానాత్మక భావాన్ని, సందర్భంలోని అర్థాన్ని రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘తమతో’ అనే ప్రతిబింబ సర్వనామం ప్రధాన వాక్యంలోని ‘వారు’ను సహజంగా తిరిగి సూచిస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
