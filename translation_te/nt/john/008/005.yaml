translation:
  language: te
  text: '[a] మన ధర్మశాస్త్రంలో ఇలాంటి స్త్రీలను రాళ్లతో కొట్టి చంపాలని మోషే ఆజ్ఞాపించాడు. మరి నీవేమంటావు?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వ్యభిచారంలో పట్టుబడిన స్త్రీ కథనం (యోహాను 7:53–8:11) కొనసాగింపు. యోహాను 7:53లోని గమనిక చూడండి.
    reason: textual_critical
lexical_decisions:
- source_word: τῷ νόμῳ ἡμῶν
  choice: మన ధర్మశాస్త్రంలో
  rationale: ‘మన ధర్మశాస్త్రంలో’ అనేది మోషే ధర్మశాస్త్రాన్ని సహజమైన ఆధునిక తెలుగు వాడుకలో సూచిస్తుంది; ‘మన’ అనే భావాన్ని నిలుపుతుంది.
- source_word: τὰς τοιαύτας
  choice: ఇలాంటి స్త్రీలను
  rationale: స్త్రీలింగ బహువచనాన్ని స్పష్టంగా నిలుపుతూ, సందర్భంలో వ్యభిచారంలో పట్టుబడిన ఈమెవంటి స్త్రీలను సూచిస్తుంది.
- source_word: λιθοβολεῖσθαι
  choice: రాళ్లతో కొట్టాలని
  rationale: రాళ్లతో కొట్టి విధించే శిక్షను సహజంగా వ్యక్తపరుస్తుంది; మూలంలో విడిగా లేని ‘చంపాలి’ అనే పదాన్ని చేర్చదు.
- source_word: ἐνετείλατο
  choice: ఆజ్ఞాపించాడు
  rationale: మోషే ఇచ్చిన అధికారపూర్వక ఆదేశాన్ని గౌరవప్రదమైన, సాధారణ తెలుగు పదంతో తెలియజేస్తుంది.
- source_word: σὺ οὖν τί λέγεις;
  choice: మరి నీవేమంటావు?
  rationale: οὖν యొక్క సందర్భానుసారమైన అన్వయాన్ని ‘మరి’ సహజంగా తెలియజేస్తుంది; σὺ పై ఉన్న స్పష్టమైన వ్యక్తి ప్రాధాన్యాన్ని ‘నీవు’ నిలుపుతుంది.
