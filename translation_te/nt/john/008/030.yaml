translation:
  language: te
  text: ఆయన ఈ మాటలు చెబుతూ ఉండగా[a], చాలామంది ఆయనను విశ్వసించారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన ఈ మాటలు మాట్లాడుతుండగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘చాలామంది ఆయనపై విశ్వాసముంచారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ఈ మాటలు
  rationale: నపుంసక బహువచన సర్వనామం యేసు ఇంతకుముందు చెప్పిన విషయాలను సూచిస్తుంది. ‘ఈ మాటలు’ అనేది బహువచనాన్ని, ముందున్న ప్రసంగంతో సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: αὐτοῦ λαλοῦντος
  choice: ఆయన ... చెబుతూ ఉండగా
  rationale: వర్తమాన కృదంతంతో కూడిన genitive absolute, నమ్మడం ఆయన మాట్లాడుతున్న సమయంలోనే జరిగిందని తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘చెబుతూ ఉండగా’ సహజంగా సమకాలీన చర్యను వ్యక్తం చేస్తుంది.
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: విశేషణం నామవాచకంగా వాడబడింది. ‘చాలామంది’ తెలుగులో వ్యక్తులను సూచించే సహజమైన సమానార్థకం.
- source_word: ἐπίστευσαν
  choice: విశ్వసించారు
  rationale: aorist క్రియ నమ్మిన సంఘటనను సమగ్రంగా పేర్కొంటుంది. ‘విశ్వసించారు’ మూలంలోని విశ్వాస భావాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: εἰς αὐτόν
  choice: ఆయనను
  rationale: తెలుగులో ‘విశ్వసించు’ క్రియతో వ్యక్తి సాధారణంగా ద్వితీయా విభక్తిలో వస్తాడు. అందువల్ల ‘ఆయనను విశ్వసించారు’ అనేది వ్యక్తిగతంగా ఆయనపై ఉంచిన నమ్మకాన్ని సహజంగా వ్యక్తం చేస్తుంది; గ్రీకు εἰς ను యాంత్రికంగా ‘ఆయనలోకి’ అని అనువదించడం అసహజం.
theological_decisions:
- issue: యోహాను రచనలో πιστεύω εἰς αὐτόν భావం
  choice: ఆయనను విశ్వసించారు
  alternative: ఆయనపై విశ్వాసముంచారు
  rationale: πιστεύω + εἰς కేవలం ఆయన చెప్పిన మాట నిజమని ఒప్పుకోవడంకన్నా, వ్యక్తిగా ఆయనవైపు మళ్లిన నమ్మకాన్ని సూచిస్తుంది. ‘ఆయనను విశ్వసించారు’ తెలుగులో ఆ సంబంధాత్మక భావాన్ని సహజంగా ఉంచుతుంది; విశ్వాసం ఎంత లోతైనదో ముందుగానే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. సమకాలీన చర్యను ‘చెబుతూ ఉండగా’ ద్వారా, వ్యక్తివైపు దిశాన్వితమైన విశ్వాసాన్ని ‘ఆయనను విశ్వసించారు’ ద్వారా తెలిపాం.
