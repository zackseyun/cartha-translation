  yaml_path: translation/nt/john/008/003.yaml
  text: Then[a] the scribes and the Pharisees brought to him a woman caught in adultery, and having set her in the midst,
translation:
  language: te
  text: అప్పుడు[a] శాస్త్రులు, పరిసయ్యులు వ్యభిచారంలో పట్టుబడిన ఒక స్త్రీని ఆయన దగ్గరికి తీసుకొచ్చి, ఆమెను మధ్యలో నిలబెట్టి,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వ్యభిచారంలో పట్టుబడిన స్త్రీ గురించిన కథనం (యోహాను 7:53–8:11) ఇక్కడ కొనసాగుతుంది. యోహాను 7:53లోని గమనిక చూడండి.
    reason: textual_critical
lexical_decisions:
- source_word: Ἄγουσιν (ἄγω)
  choice: తీసుకొచ్చి
  rationale: గ్రీకులోని చారిత్రక వర్తమాన కాలాన్ని తెలుగు కథన ప్రవాహానికి సహజంగా ఉండే భూతకాల అనుసంధాన క్రియగా అనువదించాం.
- source_word: ἐν μοιχείᾳ κατειλημμένην (καταλαμβάνω)
  choice: వ్యభిచారం చేస్తూ పట్టుబడిన
  rationale: పరిపూర్ణ కర్మణి కృదంతం ఆమె వ్యభిచార క్రియలో పట్టుబడిందని సూచిస్తుంది; ఈ భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: στήσαντες (ἵστημι)
  choice: నిలబెట్టి
  rationale: వారు ఆమెను ఉద్దేశపూర్వకంగా ఒక స్థానంలో నిలిపిన చర్యను ఈ అసమాపక క్రియ సహజంగా తెలియజేస్తుంది.
- source_word: ἐν μέσῳ (μέσος)
  choice: అందరి మధ్య
  rationale: సమావేశమైన వారి నడుమ ఆమెను నిలబెట్టారనే సందర్భార్థాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: యూదుల ధర్మశాస్త్ర పరిజ్ఞానులు, బోధకులు అనే చారిత్రక పాత్రకు తెలుగు బైబిలు వాడుకలో గుర్తించదగిన పదం.
