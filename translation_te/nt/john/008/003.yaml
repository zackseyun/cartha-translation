translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని వాక్య కొనసాగింపును చివరి కామాతో నిలిపి ఉంచాం; పాదసూచిక గుర్తును ప్రధాన పాఠ్యంలో చేర్చాం.
