base_translation:
  language: en
  yaml_path: translation/nt/john/008/007.yaml
  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: te
  text: అయితే వారు ఆయనను ప్రశ్నిస్తూనే ఉండగా, ఆయన నిటారుగా లేచి వారితో, “మీలో పాపం లేనివాడు మొదట ఆమెపై రాయి విసరాలి” అని చెప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం వ్యభిచారంలో పట్టుబడిన స్త్రీ కథలో భాగం (యోహాను 7:53–8:11). ఈ భాగం అతి ప్రాచీనమైన గ్రీకు ప్రతులలో లేదు. యోహాను 7:53లోని గమనిక చూడండి.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: అడుగుతూనే ఉండగా
  rationale: అసంపూర్ణ భూతకాల క్రియతో కూడిన వర్తమాన కృదంతం, వారు ప్రశ్నించడం నిరంతరంగా కొనసాగించారని సూచిస్తుంది.
- source_word: ἀνακύψας
  choice: నిటారుగా లేచి
  rationale: ముందు వంగి నేలపై రాస్తున్న స్థితి నుంచి యేసు శరీరాన్ని పైకి లేపి నిటారుగా నిలిచిన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀναμάρτητος
  choice: పాపం లేనివాడు
  rationale: ఈ అరుదైన గ్రీకు విశేషణంలోని నైతిక భావాన్ని సహజంగా అందిస్తుంది; సందర్భంలో ఏ నిర్దిష్ట పాపానికే పరిమితం చేయకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω
  choice: మొదట ఆమె మీద రాయి వేయాలి
  rationale: గ్రీకు తృతీయ పురుష ఆజ్ఞార్థక భావాన్ని తెలుగులో సహజమైన ఆదేశ రూపంతో అందిస్తూ, ‘మొదట’ అనే పదంలోని ప్రాధాన్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘పాపం లేనివాడు’ అనే మాట యొక్క పరిధి
  choice: ఏ పాపమూ లేనివాడు అనే విస్తృత పదబంధాన్ని ఉంచడం
  alternative: ఈ విషయంలో దోషం లేనివాడు
  rationale: ἀναμάρτητος స్వయంగా పాపరహితత్వాన్ని సూచిస్తుంది; దానిని ఈ ప్రత్యేక ఆరోపణకు మాత్రమే పరిమితం చేయడం మూలంలో లేని వ్యాఖ్యానాన్ని చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. ప్రత్యక్ష వాక్యంలోని గంభీరతను కాపాడుతూ, సాధారణ పాఠకులకు సహజంగా వినిపించే పదబంధాలు ఎంచుకోబడ్డాయి.
