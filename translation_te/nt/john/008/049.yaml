  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: te
  text: 'యేసు జవాబిచ్చాడు: “నాకు దయ్యం లేదు.[a] నేను నా తండ్రిని గౌరవిస్తున్నాను, మీరైతే నన్ను అగౌరవపరుస్తున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావాన్ని మరింత వివరణాత్మకంగా చెబితే, “నాకు దయ్యం పట్టలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: ఇలా జవాబిచ్చాడు
  rationale: యోహాను సంభాషణలోని సాధారణ కథన ప్రతిస్పందనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δαιμόνιον οὐκ ἔχω
  choice: నాలో దయ్యం లేదు
  rationale: గ్రీకు భాషలోని ‘దయ్యాన్ని కలిగి ఉండడం’ అనే నుడికారాన్ని తెలుగులో సహజంగా, అయినా ప్రత్యక్ష భావానికి దగ్గరగా అందిస్తుంది; ఆవహించబడటం అనే వివరణాత్మక భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: τιμῶ
  choice: ఘనపరుస్తున్నాను
  rationale: τιμάω యొక్క గౌరవించడం, విలువనివ్వడం అనే భావాన్ని తెలియజేస్తూ, తరువాతి ἀτιμάζωతో ఉన్న వ్యతిరేకతను నిలుపుతుంది.
- source_word: τὸν πατέρα μου
  choice: నా తండ్రిని
  rationale: యేసు దేవుణ్ణి తన తండ్రిగా సూచించే యోహాను సందర్భాన్ని నేరుగా నిలుపుతుంది; తెలుగులో ప్రత్యేక నామసూచక పెద్ద అక్షరాల భేదం లేదు.
- source_word: ἀτιμάζετέ με
  choice: మీరు నన్ను అవమానపరుస్తున్నారు
  rationale: ἀτιμάζωలోని ఘనతను నిరాకరించడం, అగౌరవపరచడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేసి τιμάωతో వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: Ἐγὼ ... ὑμεῖς
  choice: నేను ... అయితే మీరు
  rationale: గ్రీకులో స్పష్టంగా ఉంచిన సర్వనామాల వల్ల వచ్చే ‘నేను—మీరు’ వ్యత్యాసాన్ని ‘అయితే’తో సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ‘నా తండ్రి’ ఎవరిని సూచిస్తుంది
  choice: యోహాను సందర్భానుసారం దేవుణ్ణి సూచించే యేసు మాటగా ‘నా తండ్రి’ అని ఉంచడం
  alternative: సాధారణ మానవ తండ్రిని సూచించే మాటగా గ్రహించడం
  rationale: సమీప సందర్భంలో యేసు ‘తండ్రి’ అని దేవుణ్ణే సూచిస్తున్నాడు; అనువాదం అదనపు వివరణను చేర్చకుండా ఆ సంబంధపదాన్ని నిలుపుతుంది.
- issue: ‘దయ్యం ఉంది’ అనే నుడికారం
  choice: ప్రధాన పాఠ్యంలో ‘నాలో దయ్యం లేదు’ అనే ప్రత్యక్ష రూపాన్ని నిలుపడం
  alternative: ‘దయ్యం నన్ను ఆవహించలేదు’ అని వివరణాత్మకంగా అనువదించడం
  rationale: మూలంలోని ἔχω (‘కలిగి ఉండడం’) నిర్మాణానికి దగ్గరగా ఉండి, దయ్యపు ఆవహింపు లేదా ప్రభావం అనే సాధ్యమైన నుడికారార్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి. ‘ఘనపరుస్తున్నాను—అవమానపరుస్తున్నారు’ అనే పదజంట మూలంలోని గౌరవం–అగౌరవం వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత వాక్యం వెంట ఉంచబడింది.
