review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the response, the denial of having a demon, the honoring of the Father, and the contrast with the audience's dishonoring of Jesus. However, «ఘనపరుస్తున్నాను» can lean toward ‘glorify/exalt’ rather than the more direct τιμάω ‘honor,’ and «అయితే» is not required by the Greek conjunction structure; the explicit contrast is already adequately expressed by «మీరైతే».
  naturalness: «యేసు జవాబిచ్చాడు» is natural modern standard Telugu. «నాలో దయ్యం లేదు» is understandable, but «నాకు దయ్యం లేదు» better preserves the Telugu idiom corresponding to Greek ‘have a demon’ without making the demon locative ‘in me.’ «గౌరవిస్తున్నాను—అగౌరవపరుస్తున్నారు» is a clear, natural matched pair.
  terminology: Use «గౌరవిస్తున్నాను» for τιμῶ and «అగౌరవపరుస్తున్నారు» for ἀτιμάζετε to preserve the source's honor–dishonor contrast. «నా తండ్రి» properly retains the Johannine divine reference without doctrinal expansion. The footnote may retain the interpretive possession/affliction alternative, but «దయ్యం నన్ను ఆవహించలేదు» is narrower than the Greek idiom; «నాకు దయ్యం పట్టలేదు» is a more idiomatic alternative while still marked interpretive.
  issues:
  - severity: medium
    issue: «ఘనపరుస్తున్నాను» for τιμῶ
    rationale: It is possible Telugu, but it may suggest ‘glorify’ more strongly. «గౌరవిస్తున్నాను» directly represents τιμάω and creates a transparent contrast with ἀτιμάζω.
  - severity: low
    issue: «నాలో దయ్యం లేదు» for δαιμόνιον οὐκ ἔχω
    rationale: The wording is understandable, but it makes the demon's location explicit. «నాకు దయ్యం లేదు» more closely keeps the possession idiom and is idiomatic Telugu.
  - severity: low
    issue: Footnote wording «దయ్యం నన్ను ఆవహించలేదు»
    rationale: ‘Possessed’ is an acceptable interpretive alternative, but ‘ఆవహించలేదు’ can focus on a particular event of entering. «నాకు దయ్యం పట్టలేదు» more naturally expresses the resulting idiomatic sense.
  revised_text: 'యేసు జవాబిచ్చాడు: “నాకు దయ్యం లేదు.[a] నేను నా తండ్రిని గౌరవిస్తున్నాను, మీరైతే నన్ను అగౌరవపరుస్తున్నారు.”'
