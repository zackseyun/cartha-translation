- from: 'యేసు ఇలా జవాబిచ్చాడు: “నాలో దయ్యం లేదు.[a] నేను నా తండ్రిని ఘనపరుస్తున్నాను; అయితే మీరు నన్ను అవమానపరుస్తున్నారు.”'
  to: 'యేసు జవాబిచ్చాడు: “నాకు దయ్యం లేదు.[a] నేను నా తండ్రిని గౌరవిస్తున్నాను, మీరైతే నన్ను అగౌరవపరుస్తున్నారు.”'
