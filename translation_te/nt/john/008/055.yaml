- from: అయినా మీరు ఆయనను తెలుసుకోలేదు[a]; నాకు మాత్రం ఆయన తెలుసు. ఆయన నాకు తెలియదని నేను చెబితే[b], మీలాగే అబద్ధికుణ్ణి అవుతాను. కానీ నాకు ఆయన తెలుసు; ఆయన వాక్యాన్ని పాటిస్తున్నాను[c].
