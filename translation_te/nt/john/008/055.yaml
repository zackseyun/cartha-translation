source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: te
  text: అయినా మీరు ఆయనను తెలుసుకోలేదు[a]; నాకు మాత్రం ఆయన తెలుసు. ఆయన నాకు తెలియదని నేను చెబితే[b], మీలాంటి అబద్ధికుడిని అవుతాను. కానీ నాకు ఆయన తెలుసు; ఆయన వాక్యాన్ని పాటిస్తాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీకు ఆయన తెలియదు.’ గ్రీకు క్రియ పరిపూర్ణ కాలరూపంలో ఉంది; గతంలో తెలుసుకోకపోవడం వల్ల కొనసాగుతున్న అజ్ఞాన స్థితిని ఇది సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఒకవేళ నేను ... అంటే.’ ఇది ఊహాత్మక షరతు; తెలుగు సందర్భంలో ‘చెబితే’ అదే భావాన్ని సహజంగా ఇస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘పాటిస్తాను’ అనే మాటను ‘గైకొంటాను,’ ‘ఆచరిస్తాను,’ లేదా ‘కాపాడుతాను’ అని కూడా అనువదించవచ్చు. యోహాను రచనల్లో ఈ క్రియ దేవుని వాక్యాన్ని నమ్మకంగా అనుసరించి నిలుపుకోవడం అనే విస్తృత భావాన్ని కలిగి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: తెలుసుకోలేదు
  rationale: గ్రీకు పరిపూర్ణ కాలరూపం గతంలో నిజంగా తెలుసుకోకపోవడం వల్ల కొనసాగుతున్న స్థితిని సూచించగలదు. ‘తెలుసుకోలేదు’ ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οἶδα
  choice: నాకు ... తెలుసు
  rationale: οἶδα రూపరీత్యా పరిపూర్ణమైనా వర్తమాన స్థితిని తెలిపే ‘తెలుసు’ అనే అర్థంలో వాడబడింది. తెలుగులో వ్యక్తిని తెలుసుననే భావానికి ‘నాకు ఆయన తెలుసు’ సహజమైన నిర్మాణం.
- source_word: κἂν εἴπω
  choice: నేను చెబితే
  rationale: ఈ షరతు నిర్మాణం ఊహాత్మక ప్రకటనను పరిచయం చేస్తుంది. ‘చెబితే’ దాని షరతు భావాన్ని సహజంగా తెలుపుతూ, దాన్ని తప్పనిసరిగా అసంభవ గతవిరుద్ధ షరతుగా మార్చదు.
- source_word: ἔσομαι
  choice: అవుతాను
  rationale: గ్రీకులో ఇది భవిష్యత్ రూపం. తెలుగు షరతు వాక్యంలో ‘అవుతాను’ ఊహాత్మక ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὅμοιος ὑμῖν
  choice: మీలాగే
  rationale: ప్రత్యర్థులతో చేసిన నేరుగా, పదునైన పోలికను సంక్షిప్తంగా నిలుపుతుంది; ‘మీరు’ ఇక్కడ బహువచనం.
- source_word: ψεύστης
  choice: అబద్ధికుణ్ణి
  rationale: ఈ నామవాచకం కేవలం పొరబడిన వ్యక్తిని కాక అబద్ధం చెప్పేవాణ్ణి సూచిస్తుంది.
- source_word: τὸν λόγον αὐτοῦ
  choice: ఆయన వాక్యాన్ని
  rationale: ‘వాక్యం’ అనేది పలికిన మాటనూ వెల్లడించిన సందేశాన్నీ సూచించగల λόγος పద విస్తృతిని నిలుపుతుంది.
- source_word: τηρῶ
  choice: పాటిస్తున్నాను
  rationale: ఈ సందర్భంలో τηρέω దేవుని వాక్యాన్ని నమ్మకంగా ఆచరించడం/గైకొనడం అనే భావం కలిగి ఉంది. ‘పాటిస్తున్నాను’ ఆధునిక తెలుగులో సహజంగా ఉండి నిరంతర వర్తమాన భావాన్ని తెలుపుతుంది.
- source_word: καὶ ... δὲ ... ἀλλὰ
  choice: అయినా ... మాత్రం ... కానీ
  rationale: ఈ అనుసంధాన పదాలు యేసుకు ఆయన ప్రత్యర్థులకు మధ్యనున్న వ్యత్యాసాన్ని, అలాగే ఊహాత్మక అబద్ధానికి వాస్తవ ప్రకటనకు మధ్యనున్న బలమైన విరుద్ధతను తెలుగులో స్పష్టంగా చూపిస్తాయి.
theological_decisions:
- issue: యేసు దేవుణ్ణి నిజంగా తెలుసునని చెప్పడం మరియు తన ప్రత్యర్థులకు ఆ జ్ఞానం లేదని చెప్పడం
  choice: నిజమైన జ్ఞానం విషయంలోని పదునైన వ్యత్యాసాన్ని, దేవుని వాక్యాన్ని పాటిస్తున్నాననే యేసు ప్రకటనను నేరుగా నిలుపడం
  alternative: దైవ కుమారత్వాన్ని వివరిస్తూ వాక్యాన్ని విస్తరించడం లేదా ‘తెలుసు’ అనే మాటను కేవలం పరిచయంగా బలహీనపరచడం
  rationale: మూల వాక్యం యేసు జ్ఞానానికీ ఆయన ప్రత్యర్థుల అజ్ఞానానికీ మధ్య స్పష్టమైన వ్యత్యాసాన్ని ఉంచుతుంది. అదనపు సిద్ధాంత వివరణను చేర్చకుండా, ఆ ఉద్వేగాన్ని యథాతథంగా ఉంచాలి.
- issue: κἂν εἴπω అనే షరతు వాక్యపు స్వభావం
  choice: ‘చెబితే’ అని ఊహాత్మక షరతుగా అనువదించడం
  alternative: ‘చెప్పి ఉంటే’ లేదా ‘చెప్పేవాడినైతే’ అని స్పష్టంగా గతవిరుద్ధ షరతుగా చేయడం
  rationale: గ్రీకు నిర్మాణం ఊహాత్మక పరిస్థితిని సూచిస్తుంది; దాన్ని తప్పనిసరిగా గతవిరుద్ధంగా నిర్ణయించడం మూలంలోని విస్తృతిని అనవసరంగా కుదిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘నాకు ఆయన తెలుసు’ వ్యక్తిని తెలుసుననే భావానికి సాధారణ తెలుగు నిర్మాణం. ‘అబద్ధికుణ్ణి’ మూలంలోని నేరమైన ఆరోపణను నిలుపుతుంది; ‘మీలాగే’ బహువచన సంబోధనను స్పష్టం చేస్తుంది.
