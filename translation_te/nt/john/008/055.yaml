  source_fidelity: 'The draft accurately represents the Greek contrasts: the opponents have not known God (ἐγνώκατε), Jesus knows him (οἶδα), the conditional assertion leads to being a liar like them, and Jesus keeps God''s word. The conditional ‘చెబితే’ appropriately preserves the Greek hypothetical without over-specifying a contrary-to-fact past condition. ‘పాటిస్తాను’ adequately conveys τηρῶ in current, habitual force.'
