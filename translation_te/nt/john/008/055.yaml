  terminology: ‘ఆయన వాక్యం’ preserves the Johannine resonance of λόγος without narrowing it to merely a command. ‘పాటిస్తాను’ is a suitable modern rendering of τηρέω here; the footnote appropriately notes ‘గైకొంటాను,’ ‘ఆచరిస్తాను,’ and ‘కాపాడుతాను’ as alternatives.
