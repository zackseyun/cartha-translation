  yaml_path: translation/nt/john/008/004.yaml
  text: They[a] said to him, "Teacher, this woman has been caught in the very act of committing adultery."
translation:
  language: te
  text: వారు[a] ఆయనతో, “బోధకుడా, ఈ స్త్రీ వ్యభిచారం చేస్తుండగానే పట్టుబడింది” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వ్యభిచారంలో పట్టుబడిన స్త్రీ గురించిన వృత్తాంతం (యోహాను 7:53–8:11) ఇక్కడ కొనసాగుతుంది. యోహాను 7:53లోని గమనిక చూడండి.
    reason: textual_critical
lexical_decisions:
- source_word: λέγουσιν
  choice: అన్నారు
  rationale: గ్రీకులోని చారిత్రక వర్తమాన కాలాన్ని సహజమైన తెలుగు కథనశైలికి అనుగుణంగా భూతకాలంలో అనువదించాం.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: సంబోధన రూపాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో నిలిపాం.
- source_word: κατείληπται
  choice: పట్టుబడింది
  rationale: పూర్తయిన చర్యకు ప్రస్తుత సందర్భంలో కొనసాగుతున్న ప్రాముఖ్యతను సూచించే పరిపూర్ణ కర్మణి రూపాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπαυτοφώρῳ
  choice: చేస్తుండగానే
  rationale: నేరం జరుగుతున్న సమయంలోనే ప్రత్యక్షంగా పట్టుకోవడం అనే గ్రీకు నుడికార భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μοιχευομένη
  choice: వ్యభిచారం చేస్తూ
  rationale: ఆమె పట్టుబడినప్పుడు కొనసాగుతున్న చర్యను సూచించే వర్తమాన కృదంత భావాన్ని ప్రధాన వాక్యంలో ‘వ్యభిచారం చేస్తుండగానే’ అని సమగ్రంగా వ్యక్తం చేశాం.
