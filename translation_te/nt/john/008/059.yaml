id: JHN.8.59
reference: John 8:59
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: te
  text: అందుచేత వారు ఆయన మీదికి విసరడానికి రాళ్లు ఎత్తుకున్నారు. అయితే యేసు దాక్కొని దేవాలయం[a] నుండి బయటికి వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘దేవాలయం’ అని అనువదించిన గ్రీకు పదం ἱερόν; అది లోపలి పరిశుద్ధ మందిరాన్ని మాత్రమే కాకుండా దేవాలయ ప్రాంగణాలు, ఆవరణలతో కూడిన మొత్తం సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: ఎత్తుకున్నారు
  rationale: ఇక్కడ αἴρω అనేది రాళ్లను విసరడానికి చేతిలోకి తీసుకోవడాన్ని సూచిస్తుంది. ‘ఎత్తుకున్నారు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: οὖν
  choice: అందుచేత
  rationale: ముందటి మాటకు ప్రతిస్పందనగా వచ్చిన ఫలితాన్ని లేదా తార్కిక సంబంధాన్ని చూపిస్తుంది.
- source_word: λίθους
  choice: రాళ్లు
  rationale: రాళ్లతో కొట్టే ఉద్దేశంతో తీసుకున్న వస్తువులను తెలుగులో సహజంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: ఆయన మీదికి విసరడానికి
  rationale: ἵνα తో వచ్చిన క్రియ ఉద్దేశాన్ని తెలియజేస్తుంది; ఈ తెలుగు ప్రయోగం ఆ ఉద్దేశాన్నీ, ఆయనను లక్ష్యంగా చేసుకున్న శత్రుత్వ చర్యనూ స్పష్టంగా ఉంచుతుంది.
- source_word: ἐκρύβη
  choice: దాక్కొని
  rationale: రూపపరంగా నిష్క్రియాత్మకమైనప్పటికీ సందర్భంలో మధ్యమార్థంతో, యేసు తనను తాను కనబడకుండా చేసుకున్నాడనే సహజ భావాన్ని ఇస్తుంది; మరొకరు ఆయనను దాచారని సూచించదు.
- source_word: ἐξῆλθεν
  choice: బయటికి వెళ్లిపోయాడు
  rationale: ἐκ అనే తరువాతి పదబంధంతో కలిసి స్థలం నుండి బయటకు వెళ్లడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: దేవాలయం నుండి
  rationale: ప్రధాన పాఠ్యంలో చదవడానికి సులభమైన సాధారణ పదాన్ని ఉంచి, ἱερόν సూచించే విస్తృత దేవాలయ ప్రాంగణ భావాన్ని పాదటిప్పణిలో వివరించాం.
theological_decisions:
- issue: యేసు అక్కడి నుండి తప్పించుకున్న విధానం
  choice: యేసు దాక్కొని బయటికి వెళ్లాడని మాత్రమే అనువదించడం
  alternative: యేసు అద్భుతరీతిగా వారి మధ్యనుండి వెళ్లాడని లేదా అదృశ్యమయ్యాడని చేర్చడం
  rationale: ఇచ్చిన SBLGNT పాఠ్యం యేసు దాక్కొని దేవాలయం నుండి బయటికి వెళ్లాడని మాత్రమే చెబుతుంది. ఆయన అదృశ్యమయ్యాడని గానీ, అద్భుతరీతిగా వారి మధ్యనుండి వెళ్లాడని గానీ పేర్కొనదు; కాబట్టి ఆ వివరాలను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవభరితమైన శైలిని ఉపయోగించాం. ‘ఆయన’ అనే గౌరవసూచక సర్వనామాన్ని నిలబెట్టాం; మూలపాఠ్యంలో లేని అద్భుత వివరాలను చేర్చలేదు.
