id: JHN.8.29
reference: John 8:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: te
  text: నన్ను పంపినవాడు నాతో ఉన్నాడు. ఆయన నన్ను ఒంటరిగా విడిచిపెట్టలేదు, ఎందుకంటే నేను ఎల్లప్పుడూ ఆయనకు ఇష్టమైన వాటిని చేస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: నన్ను పంపినవాడు
  rationale: నామవాచకంగా పనిచేసే భూతకాల కృదంతాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, సందర్భంలో తండ్రిని సూచించే సంబంధపూర్వక రూపాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: నాతో ఉన్నాడు
  rationale: μετά + షష్ఠీ విభక్తి సహవాసం లేదా తోడును సూచిస్తుంది; ఈ తెలుగు రూపం నిరంతర సాన్నిధ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: ఆయన నన్ను ఒంటరిగా విడిచిపెట్టలేదు
  rationale: ἀφῆκεν భూతకాల రూపం కావడంతో సరళ భూతకాలాన్ని వాడాం; μόνον ఇక్కడ ‘నన్ను’ గురించి విధేయార్థకంగా ఉండి ‘ఒంటరిగా’ అనే భావాన్ని ఇస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఇక్కడ ὅτι ముందున్న ప్రకటనకు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: ఆయనకు ఇష్టమైనవాటినే
  rationale: నపుంసక బహువచన నామీకృత విశేషణ పదబంధంలోని ‘ఆయనకు ఇష్టమైన వాటిని’ అనే భావాన్ని సహజంగా నిలుపుతుంది; ‘నే’ మూలంలోని భావకేంద్రాన్ని తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: ποιῶ πάντοτε
  choice: నేను ఎల్లప్పుడూ … చేస్తాను
  rationale: వర్తమాన కాలం అలవాటుగా, నిరంతరం జరిగే కార్యాన్ని సూచిస్తుంది; πάντοτε యొక్క సంపూర్ణ కాలవ్యాప్తిని ‘ఎల్లప్పుడూ’ తెలియజేస్తుంది.
theological_decisions:
- issue: ‘నన్ను పంపినవాడు’ అనే మాట ఎవరిని సూచిస్తుంది
  choice: మూలంలోని సంబంధపూర్వక వ్యక్తీకరణనే ఉంచి ‘నన్ను పంపినవాడు’ అని అనువదించాం.
  alternative: ‘నన్ను పంపిన తండ్రి’ అని సూచ్యార్థాన్ని పాఠ్యంలోనే స్పష్టపరచడం.
  rationale: యోహాను సందర్భంలో ఇది తండ్రిని సూచించినా, గ్రీకు పాఠ్యం ఇక్కడ ‘తండ్రి’ అనే నామాన్ని చేర్చదు. మూల శైలిని కాపాడటానికి దాన్ని సరఫరా చేయలేదు.
- issue: ἀφῆκεν యొక్క కాలరూపం మరియు కొనసాగుతున్న సాన్నిధ్యం
  choice: గ్రీకు ఏఓరిస్టుకు అనుగుణంగా ‘విడిచిపెట్టలేదు’ అనే సరళ భూతకాల రూపాన్ని వాడాం.
  alternative: కొనసాగుతున్న ఫలితాన్ని ముందుకు తెచ్చే విధంగా ‘విడిచిపెట్టకుండా ఉన్నాడు’ అని అనువదించడం.
  rationale: మొదటి వాక్యంలోని ‘నాతో ఉన్నాడు’ కొనసాగుతున్న సాన్నిధ్యాన్ని ఇప్పటికే స్పష్టం చేస్తుంది; రెండవ వాక్యంలో భూతకాల రూపం మూలంలోని కాలరూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- issue: ὅτι ద్వారా తెలిపే కారణ సంబంధం
  choice: ‘ఎందుకంటే’ అని స్పష్టమైన కారణార్థంతో అనువదించాం.
  alternative: వివరణాత్మకంగా ‘ఏలయనగా’ లేదా కొంత అస్పష్టంగా ‘అని’ వాడడం.
  rationale: ఈ సందర్భంలో వాక్య నిర్మాణం కారణార్థాన్ని బలంగా సమర్థిస్తుంది; ఆధునిక సాధారణ తెలుగులో ‘ఎందుకంటే’ సహజంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘ఏలయనగా’ వంటి పాత ప్రయోగాలను నివారించాం. ఈ వచనంలో అవసరమైన పాఠాంతర లేదా నిజమైన అర్థసందిగ్ధత లేకపోవడంతో పాదటిప్పణులు ఇవ్వలేదు.
