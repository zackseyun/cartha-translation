  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: te
  text: మీ తండ్రి అబ్రాహాము నా దినాన్ని చూడడానికి ఉప్పొంగి సంతోషించాడు[a][b]; అతడు దాన్ని చూసి ఆనందించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా దినాన్ని చూడాలని ఉప్పొంగి సంతోషించాడు,’ లేదా ‘నా దినాన్ని చూడగలిగేలా ఉప్పొంగి సంతోషించాడు.’ గ్రీకు ἵνα ఉపవాక్యాన్ని పరస్పరం దగ్గరైన ఒకటి కంటే ఎక్కువ విధాలుగా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నా దినం’ అనేది విస్తృతంగా యేసుకు సంబంధించిన మెస్సీయ దినాన్ని లేదా ఆయన ద్వారా కలిగే నెరవేర్పును సూచించవచ్చు; అయితే ఇక్కడ ఉద్దేశించిన నిర్దిష్ట సంఘటనను గానీ సమయాన్ని గానీ ఈ వచనం చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పితృపురుషుని పేరు.
- source_word: ὁ πατὴρ ὑμῶν
  choice: మీ తండ్రి
  rationale: గ్రీకు సంబంధార్థాన్ని సహజమైన తెలుగు స్వామ్య నిర్మాణంలో నిలుపుతుంది.
- source_word: ἠγαλλιάσατο
  choice: ఉప్పొంగి సంతోషించాడు
  rationale: బలమైన ఆనందోత్సాహాన్ని సూచించే ἀγαλλιάω భావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἵνα ἴδῃ
  choice: చూడాలనే ఆశతో
  rationale: ఈ సందర్భంలోని ముందుచూపుతో కూడిన ఆకాంక్షను సహజంగా తెలియజేస్తుంది; ఉద్దేశం లేదా పూరకార్థంగా గ్రహించే అవకాశాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: నా దినాన్ని
  rationale: పదబంధంలోని వేదాంతపరమైన విస్తృతిని కుదించకుండా అక్షరార్థానికి దగ్గరగా ఉంచుతుంది.
- source_word: καὶ εἶδεν
  choice: అతడు దాన్ని చూసి
  rationale: గ్రీకులో అంతర్గతంగా ఉన్న కర్మను తెలుగులో ‘దాన్ని’ అని స్పష్టపరుస్తూ, ముందున్న ‘నా దినం’తో అనుసంధానిస్తుంది.
- source_word: καὶ ἐχάρη
  choice: ఆనందించాడు
  rationale: χαίρω యొక్క ఆనంద భావాన్ని సహజంగా తెలుపుతూ, ముందున్న బలమైన ἀγαλλιάωతో స్వల్ప భేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘నా దినం’ అనే మాట యొక్క సూచన
  choice: ‘నా దినం’ అని నిర్వచించకుండా నిలుపడం
  alternative: యేసు భూలోక పరిచర్య, మెస్సీయ కాలం, మరణం-పునరుత్థానం లేదా అంత్య ప్రత్యక్షత అని నిర్దిష్టీకరించడం
  rationale: ఈ వచనం ఏ ప్రత్యేక సంఘటనను లేదా సమయాన్ని స్పష్టంగా పేర్కొనదు; అందువల్ల దాని వేదాంతపరమైన విస్తృతి, ఉద్వేగం అలాగే నిలుపబడ్డాయి.
- issue: ἵνα ἴδῃ యొక్క భావబలం
  choice: ముందుచూపుతో కూడిన ఆకాంక్షగా ‘చూడాలనే ఆశతో’
  alternative: ‘చూడడానికి’ లేదా ‘చూసేలా’
  rationale: ἵνα ఉపవాక్యం ఉద్దేశం లేదా పూరకార్థం వంటి దగ్గరి భావాలను మోయగలదు. ప్రధాన పాఠ్యం సహజమైన తెలుగు రూపాన్ని ఎంచుకుంటూ, ప్రత్యామ్నాయాలను పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. ‘ఉప్పొంగి సంతోషించాడు’ బలమైన మొదటి ఆనంద క్రియను, ‘ఆనందించాడు’ రెండవ క్రియను భేదిస్తుంది. పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో [a], [b]గా ఉన్నాయి.
