id: JHN.5.21
reference: John 5:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: te
  text: ఎందుకంటే, తండ్రి మృతులను లేపి వారికి జీవం అనుగ్రహిస్తాడో,[a] అలాగే కుమారుడు కూడా తాను కోరినవారికి జీవం అనుగ్రహిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘జీవం అనుగ్రహించు’ అనే రెండు ప్రయోగాలను ‘సజీవులుగా చేయు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ఎందుకంటే, ... చేసినట్లే
  rationale: γάρ యొక్క వివరణాత్మక భావాన్ని ‘ఎందుకంటే’తో, ὥσπερ యొక్క పోలికను ‘చేసినట్లే’తో సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: ὁ πατὴρ
  choice: తండ్రి
  rationale: యోహాను సందర్భంలో దేవుని తండ్రిగా సూచించే బిరుదును సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐγείρει τοὺς νεκρούς
  choice: మృతులను లేపి
  rationale: పునరుత్థాన సందర్భంలోని ἐγείρει భావాన్ని స్పష్టంగా తెలుపుతూ, τοὺς νεκρούς అనే సమూహార్థక ప్రయోగాన్ని ‘మృతులు’గా నిలుపుతుంది.
- source_word: ζῳοποιεῖ
  choice: జీవం అనుగ్రహించినట్లే / జీవం అనుగ్రహిస్తాడు
  rationale: రెండు ప్రయోగాల్లోనూ జీవాన్ని ప్రసాదించడం లేదా సజీవులుగా చేయడం అనే భావాన్ని ఒకే పదబంధంతో సమాంతరంగా నిలుపుతుంది.
- source_word: οὕτως καὶ
  choice: కుమారుడు కూడా
  rationale: తండ్రి కార్యానికి అనుగుణంగా కుమారుని కార్యాన్ని కలిపే ‘అలాగే/కూడా’ భావాన్ని తెలుగు పోలిక నిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὁ υἱὸς
  choice: కుమారుడు
  rationale: తండ్రి–కుమారుడు సమాంతరాన్ని, సందర్భంలోని క్రీస్తు సంబంధిత బిరుదును నిలుపుతుంది.
- source_word: οὓς θέλει
  choice: తాను కోరినవారికి
  rationale: సంబంధవాచక బహువచనమైన οὓς మరియు θέλει యొక్క సంకల్పార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ‘తాను’ కర్త కుమారుడేనని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: జీవం అనుగ్రహించడంలో తండ్రి–కుమారుడు సమాంతరం
  choice: తండ్రి మృతులను లేపి జీవం అనుగ్రహించినట్లే కుమారుడు కూడా జీవం అనుగ్రహిస్తాడని సమాన నిర్మాణంతో అనువదించడం
  alternative: కుమారుని కార్యాన్ని బలహీనంగా లేదా కేవలం ప్రతినిధి కార్యంగా వినిపించే స్వేచ్ఛానువాదం
  rationale: గ్రీకు వాక్యం οὕτως καὶ ద్వారా తండ్రి మరియు కుమారుని జీవదాయక కార్యాల మధ్య ఉద్దేశపూర్వక సమాంతరాన్ని ఉంచుతుంది; అదనపు సిద్ధాంత వివరణ లేకుండా దానిని నిలుపాలి.
- issue: θέλει లో కుమారుని సంకల్పం
  choice: తాను కోరినవారికి
  alternative: తాను ఇష్టపడినవారికి; తాను సంకల్పించినవారికి
  rationale: ‘కోరిన’ అనేది నిజమైన సంకల్ప భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలుపుతుంది; ‘ఇష్టపడిన’ ఎంపికను వ్యక్తిగత అభిరుచిగా వినిపించవచ్చు, ‘సంకల్పించిన’ మూలపదం కంటే అధిక సిద్ధాంతభారం కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో. తండ్రి–కుమారుడు సమాంతరాన్ని, జీవం ప్రసాదించే కార్యాన్ని, కుమారుని సంకల్పార్థాన్ని మూలానికి సమీపంగా నిలిపింది.
