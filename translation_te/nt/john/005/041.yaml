lexical_decisions:
- source_word: δόξαν
  choice: మహిమను
  rationale: δόξα ఇక్కడ మనుషులు ఇచ్చే ఘనత, ప్రశంస లేదా గౌరవాన్ని సూచిస్తుంది. ‘మహిమ’ యోహాను సువార్త అంతటా కనిపించే పదసంబంధాన్ని నిలుపుతూ, సందర్భంలోని మానవ ప్రశంస భావాన్నీ మోయగలదు.
- source_word: παρὰ ἀνθρώπων
  choice: మనుషుల నుండి
  rationale: παρά + షష్ఠీ విభక్తి మూలాన్ని (‘నుండి’) సూచిస్తుంది. ἀνθρώπων సాధారణంగా మానవులను సూచించగల బహువచన రూపం; ‘మనుషుల నుండి’ ఆధునిక తెలుగులో సహజంగా, మూలార్థానికి దగ్గరగా ఉంది.
- source_word: οὐ λαμβάνω
  choice: స్వీకరించను
  rationale: λαμβάνω అంటే ‘పొందడం’ లేదా ‘స్వీకరించడం.’ ఈ సందర్భంలో మానవులు ఇచ్చే మహిమను అంగీకరించడం లేదా దానిపై ఆధారపడడం అనే భావానికి ‘స్వీకరించను’ సహజంగా సరిపోతుంది; వర్తమాన కాలాన్ని సాధారణ వర్తమానంగా ఉంచింది.
theological_decisions:
- issue: మానవుల ప్రశంస గురించి యేసు చేసిన ప్రకటన స్వభావం
  choice: యేసు తన కార్యానికి లేదా తన గుర్తింపుకు ఆధారంగా మానవుల మహిమను స్వీకరించడంలేదనే ప్రకటనగా అనువదించడం
  alternative: ఏ భావంలోనైనా, ఏ మనిషి నుండైనా యేసు ఎన్నడూ గౌరవం పొందడంలేదనే సంపూర్ణ ప్రకటనగా అర్థం చేసుకోవడం
  rationale: సందర్భంలో యేసు మానవుల ప్రశంసను తన అధికారానికి ధృవీకరణగా తీసుకోవడంలేదని చెబుతున్నాడు. అయితే మూలపాఠంలో లేని ‘కోరను’ లేదా ‘ఆధారపడను’ వంటి వివరణాత్మక పదాలను ప్రధాన పాఠంలో చేర్చకుండా, గ్రీకు వాక్యంలోని సంక్షిప్తతను మరియు భావ ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గంభీరమైన వాక్య నిర్మాణం. మూలంలోని పదక్రమానికి సాధ్యమైనంత దగ్గరగా ఉంటూనే సహజ తెలుగు ప్రయోగాన్ని పాటించింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
