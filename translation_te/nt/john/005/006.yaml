id: JHN.5.6
reference: John 5:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: te
  text: 'యేసు ఈ మనిషి అక్కడ పడివుండడాన్ని చూసి, అతడు అప్పటికే ఈ స్థితిలో చాలాకాలంగా ఉన్నాడని[a] తెలుసుకొని, అతనితో, “నీవు బాగుపడాలనుకుంటున్నావా?” అన్నాడు.


    [a] లేదా, “అతడు అప్పటికే చాలాకాలంగా అక్కడ ఉన్నాడని.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు అప్పటికే చాలాకాలంగా అక్కడ ఉన్నాడని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: అతడు
  rationale: సందర్భంలో కొలను దగ్గర పడివున్న నిర్దిష్ట వ్యక్తినే సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘ఈ మనిషి’ కంటే ‘అతడు’ సహజంగా ఉంది.
- source_word: ἰδὼν
  choice: చూసి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను తెలుగు అసమాపక క్రియ సహజంగా తెలియజేస్తుంది.
- source_word: κατακείμενον
  choice: అక్కడ పడివుండడం
  rationale: ఆ వ్యక్తి పడుకొని ఉన్న భంగిమను, కథనంలోని ప్రదేశ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γνοὺς
  choice: తెలుసుకొని
  rationale: యేసుకు ఆ విషయం తెలిసిందని మాత్రమే తెలుపుతుంది; అది ఎలా తెలిసిందో అనువాదం నిర్ణయించదు.
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: అప్పటికే చాలాకాలంగా అలా ఉన్నాడని
  rationale: గ్రీకులో వ్యవధి స్పష్టంగా ఉన్నా, అతడు చాలాకాలంగా ఎక్కడ ఉన్నాడో లేదా ఏ స్థితిలో ఉన్నాడో ప్రత్యక్షంగా చెప్పలేదు. ‘అలా ఉన్నాడు’ అనేది దీర్ఘకాల స్థితిని సహజంగా సూచిస్తూ కొంత అస్పష్టతను నిలుపుతుంది.
- source_word: λέγει αὐτῷ
  choice: అతనితో … అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు కథన శైలిలో భూతకాలంగా ఇచ్చింది.
- source_word: Θέλεις
  choice: అనుకుంటున్నావా
  rationale: కోరిక లేదా సంకల్పాన్ని ఆధునిక సాధారణ తెలుగులో నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὑγιὴς γενέσθαι
  choice: బాగుపడాలని
  rationale: అనారోగ్య లేదా అశక్త స్థితి నుంచి ఆరోగ్య స్థితికి రావడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: γνοὺςలో యేసు జ్ఞాన స్వభావం
  choice: యేసుకు విషయం తెలుసని మాత్రమే అనువదించడం
  alternative: అది ఆయనకు అతీంద్రియంగా తెలిసిందని లేదా సాధారణ మార్గంలో తెలిసిందని పేర్కొనడం
  rationale: మూల వాక్యం యేసుకు ఎలా తెలిసిందో వివరించదు. కాబట్టి అనువాదం ఏ విధానాన్నీ సిద్ధాంతపరంగా నిర్ణయించదు.
- issue: πολὺν ἤδη χρόνον ἔχει సూచించే వ్యవధి
  choice: ‘చాలాకాలంగా అలా ఉన్నాడు’ అని ప్రధాన పాఠంలో ఉంచడం
  alternative: కొలను దగ్గర చాలాకాలంగా ఉన్నాడని లేదా ఆ అనారోగ్య స్థితిలో చాలాకాలంగా ఉన్నాడని స్పష్టీకరించడం
  rationale: గ్రీకు పదబంధంలో వ్యవధి ఉంది గాని దానికి సంబంధించిన స్థలం లేదా స్థితి ప్రత్యక్షంగా లేదు. ప్రధాన పాఠం ఆ అస్పష్టతను వీలైనంతగా నిలుపుతుంది; స్థలార్థాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘నీవు’ ప్రత్యక్ష సంభాషణకు తగిన మర్యాదపూర్వక ఏకవచనం; ‘బాగుపడడం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండే ఆరోగ్యపునరుద్ధరణ పదప్రయోగం.
