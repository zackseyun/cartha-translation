revisions:
- from: 'యేసు అతడు అక్కడ పడివుండడం చూసి, అతడు అప్పటికే చాలాకాలంగా అలా ఉన్నాడని[a] తెలుసుకొని, అతనితో, “నీవు బాగుపడాలనుకుంటున్నావా?” అన్నాడు.


