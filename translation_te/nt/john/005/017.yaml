  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: te
  text: 'అయితే ఆయన వారికి ఇలా జవాబిచ్చాడు: “నా తండ్రి ఇప్పటివరకు పని చేస్తూనే ఉన్నాడు; నేనూ పని చేస్తూనే ఉన్నాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి ఆరోపణకు యేసు ఇచ్చిన జవాబులోని స్వల్ప వ్యత్యాసాన్ని, సందర్భ పురోగతిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: ఆయన వారికి ఇలా జవాబిచ్చాడు
  rationale: డేటివ్ పరోక్ష కర్మతో ఉన్న క్రియను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: Ὁ πατήρ μου
  choice: నా తండ్రి
  rationale: యేసు దేవుణ్ణి వ్యక్తిగతంగా తండ్రిగా పేర్కొనే భావాన్ని నేరుగా నిలుపుతుంది; తెలుగులో ప్రత్యేక పెద్ద అక్షరాల భేదం లేదు.
- source_word: ἕως ἄρτι
  choice: ఇప్పటివరకు
  rationale: ప్రస్తుత క్షణం వరకు కొనసాగుతున్న భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐργάζεται
  choice: పని చేస్తూనే ఉన్నాడు
  rationale: వర్తమానకాల క్రియలో సందర్భానుసారంగా కనిపించే నిరంతర కార్యభావాన్ని తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: κἀγὼ
  choice: నేనూ
  rationale: తండ్రి కార్యంతో యేసు తన కార్యాన్ని కలిపి చెప్పే అదనపు ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: ἐργάζομαι
  choice: పని చేస్తూనే ఉన్నాను
  rationale: తండ్రి కార్యంతో ఉద్దేశపూర్వకంగా సమాంతరంగా ఉన్న యేసు నిరంతర కార్యాన్ని అదే నిర్మాణంతో అందిస్తుంది.
theological_decisions:
- issue: విశ్రాంతిదినాన తండ్రి చేసే పనికీ యేసు చేసే పనికీ ఉన్న సంబంధం
  choice: “నా తండ్రి ఇప్పటివరకు పని చేస్తూనే ఉన్నాడు; నేనూ పని చేస్తూనే ఉన్నాను” అని సమాంతరతను యథాతథంగా ఉంచడం.
  alternative: “నా తండ్రి ఇప్పటివరకు పని చేస్తాడు; నేనూ పని చేస్తాను.”
  rationale: గ్రీకు వాక్యం తండ్రి కార్యానికీ యేసు కార్యానికీ మధ్య ఉద్దేశపూర్వక సమాంతరతను ఉంచుతుంది. విశ్రాంతిదినం, దైవాధికారం లేదా సమానత్వం గురించి వచనం నేరుగా చెప్పనిదాన్ని అనువాదంలో చేర్చకుండా ఈ వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయినా గౌరవప్రదంగా ఉంది. ‘చేస్తూనే ఉన్నాడు/ఉన్నాను’ అనే సమాంతర నిర్మాణం కొనసాగుతున్న కార్యాన్ని మరియు మూలంలోని ఉద్దేశపూర్వక సమాంతరతను నిలుపుతుంది.
