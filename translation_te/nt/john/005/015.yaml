source:
  edition: SBLGNT
  text: ἀπῆλθεν ὁ ἄνθρωπος καὶ ⸀ἀνήγγειλεν τοῖς Ἰουδαίοις ὅτι Ἰησοῦς ἐστιν ὁ ποιήσας αὐτὸν ὑγιῆ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: te
  text: ఆ మనిషి వెళ్లి, తనను స్వస్థపరచినవాడు యేసు అని యూదులకు[a] తెలియజేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదుల నాయకులకు’; లేదా, ‘యూదయ ప్రజలకు.’ సందర్భంలో యోహాను ‘యూదులు’ అనే పదాన్ని ఎలా ఉపయోగించాడో బట్టి అర్థం మారవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: వెళ్లి
  rationale: సంఘటన జరిగిన స్థలం నుంచి అతడు వెళ్లినట్లు సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ ἄνθρωπος
  choice: ఆ మనిషి
  rationale: సందర్భంలో ఇంతకుముందు స్వస్థత పొందిన నిర్దిష్ట పురుషుణ్ణి సూచిస్తుంది; తెలుగు కథనంలో ‘ఆ మనిషి’ సహజంగా పూర్వోక్త వ్యక్తిని గుర్తిస్తుంది.
- source_word: ἀνήγγειλεν
  choice: తెలియజేశాడు
  rationale: ἀναγγέλλωలోని సమాచారం అందించడం లేదా నివేదించడం అనే భావాన్ని, బహిరంగ ప్రకటన అనే అధిక భావం జోడించకుండా వ్యక్తపరుస్తుంది.
- source_word: τοῖς Ἰουδαίοις
  choice: యూదులకు
  rationale: గ్రీకు పదరూపాన్ని ప్రధాన పాఠ్యంలో విస్తృతంగానే ఉంచి, యోహాను సందర్భంలో సాధ్యమైన మరింత నిర్దిష్ట అర్థాలను పాదసూచికలో ఇస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: తెలుగులో పరోక్ష వాక్యంలోని విషయాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: Ἰησοῦς ἐστιν
  choice: యేసే
  rationale: గ్రీకు వర్తమాన ‘అతడు యేసు’ అనే గుర్తింపును తెలుగు పరోక్ష వాక్యంలో సహజమైన ఉద్ఘాటనతో వ్యక్తపరుస్తుంది; కాలాన్ని అనవసరంగా గతకాలానికి మార్చదు.
- source_word: ὁ ποιήσας αὐτὸν ὑγιῆ
  choice: తనను బాగుచేసినవాడు
  rationale: ποιέωతో కూడిన ὑγιῆ యొక్క ‘అతణ్ణి ఆరోగ్యవంతునిగా చేసిన’ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; ‘స్వస్థపరచినవాడు’ కంటే మూలంలోని నిర్మాణానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: యోహాను సువార్తలో ‘యూదులు’ అనే పదానికి ఉద్దేశిత వర్గం
  choice: ప్రధాన పాఠ్యంలో ‘యూదులకు’ అని ఉంచి, సందర్భానుసార ప్రత్యామ్నాయాలను పాదసూచికలో ఇవ్వడం
  alternative: ‘యూదుల నాయకులకు’ లేదా ‘యూదయవారికి’
  rationale: Ἰουδαίοις అనే మూలపదం స్వయంగా విస్తృతంగా ఉంది. ఈ సందర్భంలో అది అధికార నాయకులను లేదా యూదయ ప్రాంతవాసులను సూచించవచ్చన్న భావాన్ని ప్రధాన పాఠ్యంలో ఖచ్చితంగా నిర్ణయించకుండా, అసలైన సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, కథనానికి తగిన గౌరవప్రదమైన శైలిలోనూ ఉంది. ‘యేసే’ అనే రూపం గుర్తింపుపై గ్రీకు వాక్యంలోని కేంద్రీకరణను సంక్షిప్తంగా నిలుపుతుంది.
