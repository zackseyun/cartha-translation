id: JHN.5.32
reference: John 5:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: te
  text: నా గురించి సాక్ష్యమిచ్చే మరొకడు ఉన్నాడు; అతడు నా గురించి ఇచ్చే సాక్ష్యం నిజమైనదని నాకు తెలుసు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλος
  choice: మరొకడు
  rationale: ఇది యేసు సొంత సాక్ష్యానికి భిన్నంగా మరో వ్యక్తిని సూచిస్తుంది; ఆ వ్యక్తి ఎవరో వచనంలోనే నిర్దిష్టంగా చెప్పకుండా ఉంచుతుంది.
- source_word: ὁ μαρτυρῶν
  choice: సాక్ష్యమిస్తున్నవాడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న వర్తమాన కృదంతం ‘సాక్ష్యమిస్తున్న వ్యక్తి’ అనే భావాన్ని ఇస్తుంది; కొనసాగుతున్న క్రియాభావాన్ని కూడా నిలుపుతుంది.
- source_word: περὶ ἐμοῦ
  choice: నా గురించి
  rationale: περί + షష్ఠీ విభక్తి ఇక్కడ విషయాన్ని లేదా సూచనను తెలియజేస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన ప్రయోగం.
- source_word: οἶδα
  choice: నాకు తెలుసు
  rationale: తెలుసుకోవడం అనే సాధారణ, ప్రత్యక్ష అర్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀληθής
  choice: సత్యం
  rationale: సాక్ష్యం నిజమైనదని, విశ్వసనీయమైనదని సూచిస్తుంది; ‘సత్యం’ మూలంలోని విస్తృత భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: ἡ μαρτυρία
  choice: సాక్ష్యం
  rationale: న్యాయసంబంధ నేపథ్యానికి సరిపోయే స్థిరమైన తెలుగు పదం; సంబంధిత క్రియతో ఉన్న మూలపద పునరుక్తిని కొంతవరకు కాపాడుతుంది.
- source_word: ἣν μαρτυρεῖ
  choice: అతడు ఇచ్చే సాక్ష్యం
  rationale: గ్రీకులోని ‘అతడు సాక్ష్యమిచ్చే సాక్ష్యం’ అనే పునరుక్తిని తెలుగులో అసహజంగా చేయకుండా, సంబంధ వాక్య భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: ‘మరొకడు’ (ἄλλος) ఎవరు?
  choice: ఎవరని నిర్ధారించకుండా ‘మరొకడు’ అని అనువదించడం
  alternative: బాప్తిస్మమిచ్చే యోహాను, తండ్రి, లేదా న్యాయార్థంలో మరో సాక్షి అని స్పష్టీకరించడం
  rationale: ఈ వచనం మాత్రమే ఆ వ్యక్తిని పేరుతో గుర్తించదు. సందర్భం వ్యాఖ్యానానికి దోహదపడినా, అనువాదం మూలంలోని ఉద్దేశపూర్వక అనిర్దిష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సాక్ష్యం’ అనే న్యాయసంబంధ పదాన్ని నిలుపుతూ, గ్రీకు మూలంలోని నామవాచక–క్రియా పునరుక్తిని తెలుగులో చదవదగిన రీతిలో కొంత సున్నితంగా మార్చాం.
