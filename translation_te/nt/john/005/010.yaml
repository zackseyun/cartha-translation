- from: కాబట్టి యూదులు[a] స్వస్థత పొందిన ఆ మనిషితో, “ఇది విశ్రాంతి దినం; నీ పరుపు[c] మోసుకెళ్లడం[b] నీకు ధర్మశాస్త్రరీత్యా అనుమతించబడదు” అని చెబుతూ ఉన్నారు.
