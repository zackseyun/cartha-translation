id: JHN.5.10
reference: John 5:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: te
  text: అప్పుడు యూదులు[a] స్వస్థత పొందిన ఆ మనిషితో, “ఇవాళ శబ్బాతు రోజు; నీ పరుపు[c] మోసుకెళ్లడానికి[b] నీకు అనుమతి లేదు” అని చెప్పసాగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, యోహాను ఇక్కడ ఈ పదాన్ని ఎలా ఉపయోగిస్తున్నాడన్నదాన్ని బట్టి, “యూదుల నాయకులు” లేదా “యూదయ ప్రాంతస్థులు” అని అర్థం కావచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “నీ పరుపును ఎత్తుకోవడానికి” లేదా “తీసుకోవడానికి.”
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ “పరుపు”గా అనువదించిన పదం తేలికగా తీసుకెళ్లగల నిద్ర పరుపును లేదా పక్కను సూచిస్తుంది; తప్పనిసరిగా పూర్తి మంచాన్ని కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: చెబుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న లేదా పునరావృతమైన మాటను సూచించవచ్చు; ఈ రూపం ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సంఘటనకు అనుసంధానంగా వచ్చే కథనాత్మక పరిణామాన్ని సూచిస్తుంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదబంధానికి నేరమైన సమానం. యోహాను వాడుకలో కొన్ని సందర్భాల్లో ఇది యూదా నాయకులను లేదా యూదయవారిని సూచించవచ్చుగానీ, ఈ వచనం స్వయంగా అర్థాన్ని అంతగా పరిమితం చేయదు.
- source_word: τῷ τεθεραπευμένῳ
  choice: స్వస్థత పొందిన ఆ మనిషితో
  rationale: పూర్తయిన స్వస్థతతో కొనసాగుతున్న ఫలితాన్ని పరిపూర్ణ కర్మణి కృదంతం సూచిస్తుంది; సందర్భంలో వ్యక్తి పురుషుడని స్పష్టమైనందున ‘మనిషి’ సహజంగా ఉంది.
- source_word: Σάββατόν ἐστιν
  choice: ఇది విశ్రాంతి దినం
  rationale: శబ్బాతు దినాన్ని ఆధునిక తెలుగులో అర్థమయ్యేలా, దాని విశ్రాంతి స్వభావాన్ని తెలిపే స్థిరమైన పదబంధంతో అనువదిస్తుంది.
- source_word: οὐκ ἔξεστίν σοι
  choice: నీకు ధర్మశాస్త్రరీత్యా అనుమతించబడదు
  rationale: ἔξεστιν అనుమతి లేదా ధర్మబద్ధతను సూచిస్తుంది; విశ్రాంతి దిన ఆచరణపై ఉన్న ధార్మిక-న్యాయపరమైన అభ్యంతరాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: ἆραι
  choice: మోసుకెళ్లడం
  rationale: పదానికి ‘ఎత్తడం’ లేదా ‘తీసుకోవడం’ అనే అర్థాలు కూడా ఉన్నా, ఇక్కడ అభ్యంతరం పరుపును తీసుకొని రవాణా చేయడంపై కేంద్రీకృతమై ఉంది.
- source_word: κράβαττον
  choice: పరుపు
  rationale: తేలికగా తీసుకెళ్లగల నిద్ర పరుపు లేదా పక్కను సూచిస్తుంది; పూర్తి మంచం అనే అపార్థాన్ని నివారిస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι పదబంధపు సూచన
  choice: యూదులు
  alternative: యూదా నాయకులు; యూదయవారు
  rationale: తక్షణ సందర్భం నాయకులనే గానీ యూదయవారినే గానీ స్పష్టంగా నిర్దేశించదు. అందువల్ల మూలంలోని విస్తృత పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సాధ్యమైన సందర్భార్థాలను పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు స్పష్టమైన శైలి. మూలంలోని అసంపూర్ణ క్రియాభావం, ధర్మబద్ధ అనుమతి భావం, ‘యూదులు’ అనే పదంలోని సందర్భసంబంధ అనిశ్చితి నిలుపబడ్డాయి. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
