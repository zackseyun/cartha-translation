  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: te
  text: ఈ కారణంగా యూదులు యేసును హింసించేవారు[a], ఎందుకంటే ఆయన ఈ పనులు విశ్రాంతిదినాన చేస్తుండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయవాసులు”; సందర్భానుసారంగా, “యూదు నాయకులు.” యోహాను సువార్తలో ఈ పదం తరచుగా యేసును వ్యతిరేకించిన ఒక నిర్దిష్ట వర్గాన్ని సూచిస్తుంది; భేదం లేకుండా యూదులందరినీ కాదు.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: ఈ కారణంగా
  rationale: ముందు జరిగిన సంఘటనను తదుపరి విరోధానికి కారణంగా చూపే పదబంధం; తెలుగులో సహజమైన కారణార్థాన్ని నిలుపుతుంది.
- source_word: ἐδίωκον
  choice: హింసిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృతమైన విరోధాన్ని సూచిస్తుంది. ‘హింసిస్తూ ఉన్నారు’ కేవలం వెంబడించడం కంటే శత్రుత్వపూర్వక వేధింపును తెలియజేస్తుంది; 18వ వచనంలోని చంపాలనే ఉద్దేశాన్ని ముందుగానే చేర్చదు.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదబంధానికి నేరమైన జాతి-మత సమూహ సూచన. ప్రధాన పాఠ్యంలో ‘నాయకులు’ అని సంకుచితం చేయకుండా, సందర్భ పరిమితిని పాదసూచికలో వివరిస్తుంది.
- source_word: ταῦτα
  choice: ఈ పనులు
  rationale: ఇప్పుడే వర్ణించిన కార్యాలను సూచించే బహువచన సర్వనామ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐποίει
  choice: చేస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న కార్యభావాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν σαββάτῳ
  choice: విశ్రాంతిదినాన
  rationale: యూదుల సబ్బాతు దినాన్ని సూచించే స్థిరమైన, అర్థవంతమైన తెలుగు పదప్రయోగం.
theological_decisions:
- issue: యోహాను సువార్తలో οἱ Ἰουδαῖοι అనే పదబంధం ఎవరిని సూచిస్తుంది?
  choice: యూదులు
  alternative: యూదయవారు; సందర్భానుసారంగా యూదు నాయకులు
  rationale: మూలంలోని సాధారణ పదాన్ని ప్రధాన పాఠ్యంలో నేరుగా ఉంచి, అది ప్రతి యూదునినీ భేదం లేకుండా సూచిస్తుందని అపార్థం కాకుండా సందర్భ సంబంధిత పరిమితిని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు అసంపూర్ణ భూతకాల క్రియల కొనసాగింపు భావాన్ని ‘హింసిస్తూ ఉన్నారు,’ ‘చేస్తూ ఉన్నాడు’ ద్వారా నిలిపాం. ప్రధాన పాఠ్యంలోని ‘యూదులు’ అనే నేర అనువాదానికి అవసరమైన సందర్భ స్పష్టతను పాదసూచిక అందిస్తుంది.
