id: JHN.5.22
reference: John 5:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: te
  text: ఎందుకంటే తండ్రి ఎవరికీ తీర్పు తీర్చడు; కానీ తీర్పు తీర్చే కార్యమంతటినీ కుమారునికి ఇచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందున్న వాక్యానికి వివరణను జోడిస్తోంది. οὐδέలోని ప్రతికూల భావం తరువాతి «ఎవరికీ ... తీర్చడు»లో సహజంగా వ్యక్తమవుతుంది.
- source_word: ὁ πατὴρ
  choice: తండ్రి
  rationale: యోహాను సందర్భంలో ఇది దేవునికి, కుమారునితో ఆయనకున్న సంబంధాన్ని సూచించే బిరుదు.
- source_word: κρίνει
  choice: తీర్పు తీర్చడు
  rationale: వర్తమానకాల క్రియ సాధారణ సత్యాన్ని తెలియజేస్తుంది. ఈ పదబంధం ఖండించడం అనే అర్థానికే పరిమితం కాకుండా న్యాయనిర్ణయ భావాన్ని ఉంచుతుంది.
- source_word: οὐδένα
  choice: ఎవరికీ
  rationale: సమగ్ర నిరాకరణను సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: ἀλλὰ
  choice: అయితే
  rationale: తండ్రి తీర్పు తీర్చకపోవడానికీ, తీర్పును కుమారునికి ఇవ్వడానికీ మధ్యనున్న బలమైన వ్యత్యాసాన్ని సహజంగా చూపుతుంది.
- source_word: τὴν κρίσιν πᾶσαν
  choice: తీర్పు తీర్చే బాధ్యతనంతటినీ
  rationale: κρίσιςలోని తీర్పు తీర్చే కార్యాన్ని, πᾶσανలోని సంపూర్ణతను సహజ తెలుగులో వ్యక్తం చేస్తుంది; కేవలం ఒక తీర్పు లేదా శిక్ష అనే సంకుచిత భావాన్ని నివారిస్తుంది.
- source_word: δέδωκεν
  choice: ఇచ్చాడు
  rationale: గ్రీకు పరిపూర్ణకాలం పూర్తయి కొనసాగుతున్న ఫలితమున్న కార్యాన్ని సూచిస్తుంది. తెలుగులో సందర్భసహజమైన భూతకాల రూపం ఈ పూర్తయిన బదలాయింపును స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῷ υἱῷ
  choice: కుమారునికి
  rationale: గ్రీకులో స్వామ్యసర్వనామం లేదు; «కుమారుడు» అనే యోహానీయ బిరుదును యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: తండ్రి తీర్పు తీర్చడానికీ కుమారుడు తీర్పు తీర్చడానికీ మధ్య సంబంధం
  choice: తండ్రి ఎవరికీ తీర్పు తీర్చడు; తీర్పు తీర్చే బాధ్యతనంతటినీ కుమారునికి ఇచ్చాడు అని నేరుగా అనువదించడం.
  alternative: «కుమారునికి వేరుగా తండ్రి ఎవరికీ తీర్పు తీర్చడు» అని సమన్వయపరచడం, లేదా దీన్ని అంతిమ తీర్పుకే పరిమితం చేయడం.
  rationale: గ్రీకు పాఠంలో లేని పరిమితులను చేర్చకుండా, వాక్యంలోని ఉద్దేశపూర్వక ధార్మిక ఉద్వేగాన్ని నిలుపుతుంది.
- issue: «కుమారుడు» అనే క్రీస్తుసంబంధ బిరుదు
  choice: «కుమారునికి» అని బిరుదును నిలుపడం.
  alternative: «తన కుమారునికి» అని స్వామ్యసూచక పదాన్ని చేర్చడం.
  rationale: మూలపాఠంలో స్వామ్యసర్వనామం లేదు. «కుమారుడు» అనే బిరుదు తండ్రి-కుమారుల సంబంధానికి యోహాను ఇచ్చే ప్రాధాన్యాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదంగా రూపొందించబడింది. «న్యాయం తీర్చడం» కంటే విస్తృతంగా వినిపించే «తీర్పు తీర్చడం»ను ఎంచుకున్నాం. వివరణాత్మక పాదసూచికలు అవసరం లేదు.
