revisions:
- from: ఎందుకంటే తండ్రి ఎవరికీ తీర్పు తీర్చడు; అయితే తీర్పు తీర్చే బాధ్యతనంతటినీ కుమారునికి ఇచ్చాడు.
  to: ఎందుకంటే తండ్రి ఎవరికీ తీర్పు తీర్చడు; కానీ తీర్పు తీర్చే కార్యమంతటినీ కుమారునికి ఇచ్చాడు.
