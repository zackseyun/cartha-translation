id: JHN.5.9
reference: John 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: te
  text: వెంటనే ఆ మనిషి స్వస్థుడయ్యాడు. అతడు తన చాపను[a] ఎత్తుకొని నడవసాగాడు.[b] ఆ రోజు సబ్బాతు దినం.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన పరుపును.’ గ్రీకు κράβαττον పెద్ద మంచాన్ని తప్పనిసరిగా సూచించదు; అది సాధారణంగా మోసుకెళ్లగల చాప, పరుపు లేదా పడుకునే మెత్తను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నడుస్తూ ఉన్నాడు.’ గ్రీకు అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న చర్యను నొక్కిచెప్పవచ్చు; ఈ సందర్భంలో స్వస్థత పొందిన తరువాత అతడు నడవడం మొదలుపెట్టాడని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ఆ రోజు సబ్బాతు.’ గ్రీకు వాక్యం అక్షరార్థంగా ‘ఆ రోజున సబ్బాతు ఉండెను’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: వెంటనే
  rationale: స్వస్థత తక్షణమే కలిగిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐγένετο ὑγιὴς
  choice: స్వస్థుడయ్యాడు
  rationale: అక్షరార్థంగా ‘ఆరోగ్యవంతుడయ్యాడు/బాగయ్యాడు’ అనే స్థితి మార్పును తెలుపుతుంది; గ్రీకులో స్పష్టంగా లేని కర్మణి ప్రయోగాన్ని చేర్చకుండా ఉంచుతుంది.
- source_word: ὁ ἄνθρωπος
  choice: ఆ మనిషి
  rationale: కథనంలో ఇప్పటికే ప్రస్తావించిన నిర్దిష్ట పురుషుణ్ణి సహజంగా సూచిస్తుంది.
- source_word: ἦρε
  choice: ఎత్తుకొని
  rationale: చాపను పైకెత్తి తనతో తీసుకెళ్లడాన్ని తెలుపుతుంది; తరువాతి నడకతో వాక్యాన్ని సహజంగా కలుపుతుంది.
- source_word: κράβαττον
  choice: చాప
  rationale: ఇది పెద్ద మంచం కంటే మోసుకెళ్లగల సాధారణ పరుపు లేదా పడుకునే చాపను సూచిస్తుంది; ‘చాప’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: περιεπάτει
  choice: నడవసాగాడు
  rationale: అసంపూర్ణ భూతకాల క్రియకు ఇక్కడ సాధ్యమైన ఆరంభార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కొనసాగుతున్న చర్య అనే అర్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: Ἦν δὲ
  choice: ఆ రోజు ... దినం
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకత కంటే తదుపరి వివాదానికి నేపథ్యమిచ్చే కథన మార్పు; తెలుగులో ప్రత్యేక అనుసంధాన పదం లేకుండానే ఈ మార్పు సహజంగా తెలుస్తుంది.
- source_word: σάββατον
  choice: సబ్బాతు దినం
  rationale: యూదుల ప్రత్యేక విశ్రాంతి దినాన్ని సాధారణ ‘విశ్రాంతి రోజు’గా కలిపివేయకుండా స్పష్టంగా గుర్తిస్తుంది.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ఆ రోజు
  rationale: ‘ఆ దినంలో’ అనే అక్షరానువాదం కంటే సహజమైన ఆధునిక తెలుగు కాలప్రయోగం.
theological_decisions:
- issue: కథన సందర్భంలో σάββατον అనువాదం
  choice: సబ్బాతు దినం
  alternative: ఆ సబ్బాతు దినం; విశ్రాంతి దినం
  rationale: గ్రీకులో నామవాచకానికి నిర్దిష్ట ఉపపదం లేదు; అందువల్ల తెలుగు అనువాదం ఆ రోజును సబ్బాతుగా గుర్తిస్తుంది గాని అవసరం లేని నిర్దిష్టతను చేర్చదు. ‘సబ్బాతు’ అనే పదం యూదుల పవిత్ర దినసూచనను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘స్వస్థుడయ్యాడు,’ ‘సబ్బాతు దినం’ వంటి పదాలు మూలార్థాన్ని కాపాడుతూ క్రైస్తవ పాఠకులకు కూడా సుపరిచితంగా ఉంటాయి.
