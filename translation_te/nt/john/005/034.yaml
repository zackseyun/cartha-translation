language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: te
  text: అయితే నేను మనిషి నుండి సాక్ష్యాన్ని స్వీకరించను; కానీ మీరు రక్షించబడాలని ఈ సంగతులు చెబుతున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: మనిషి నుండి
  rationale: παρά + షష్ఠీ విభక్తి మూలాన్ని సూచిస్తుంది. ఏ ఒక్క నిర్దిష్ట వ్యక్తిని కాక మానవ మూలాన్ని సూచించే ఏకవచన రూపాన్ని ‘మనిషి నుండి’ నిలుపుతుంది.
- source_word: μαρτυρίαν
  choice: సాక్ష్యాన్ని
  rationale: ఇది సాక్షి అనే వ్యక్తికన్నా అతడు ఇచ్చే సాక్ష్యాన్ని సూచిస్తుంది; పరిసర వాక్యాలలోని న్యాయపరమైన భావఛాయను కూడా నిలుపుతుంది.
- source_word: λαμβάνω
  choice: స్వీకరించను
  rationale: వర్తమాన కాలాన్ని సహజమైన తెలుగులో చూపుతుంది. ఇక్కడ సాక్ష్యంపై ఆధారపడటం లేదా దానిని అంగీకరించడం అనే భావానికీ తగినది.
- source_word: ταῦτα
  choice: ఈ సంగతులు
  rationale: నపుంసక బహువచన నిర్దేశకాన్ని తెలుగులో సహజంగా, దాని బహువచన భావాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: λέγω
  choice: చెబుతున్నాను
  rationale: ప్రస్తుత సందర్భంలో యేసు పలుకుతున్న మాటలను సహజ తెలుగు వర్తమాన రూపంలో తెలియజేస్తుంది.
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: మీరు రక్షించబడాలని
  rationale: ἵνα యొక్క ఉద్దేశార్థాన్ని, σωθῆτε లోని కర్మణి భావాన్ని నిలుపుతుంది; రక్షణను ఒక నిర్దిష్ట సిద్ధాంత నమూనాకు పరిమితం చేయదు.
- source_word: δὲ ... ἀλλὰ
  choice: అయితే ... కానీ
  rationale: మానవ సాక్ష్యాన్ని స్వీకరించనని చెప్పడం మరియు ఈ మాటలు చెప్పడంలోని రక్షణాత్మక ఉద్దేశం మధ్య ఉన్న వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: ‘మీరు రక్షించబడాలని’ అనే మాట యొక్క సందర్భార్థం
  choice: రక్షణకు సంబంధించిన విస్తృత అర్థాన్ని అలాగే ఉంచడం
  alternative: మీరు విడిపించబడాలని; మీరు రక్షణ పొందాలని
  rationale: σωθῆτε రక్షణ అనే గంభీరమైన భావాన్ని కలిగి ఉంది. అయితే అది ఎలా సంభవిస్తుందో ఏ ప్రత్యేక సిద్ధాంత పద్ధతిలోనూ వాక్యం వివరించదు; కాబట్టి కర్మణి రూపంతో కూడిన విస్తృత పదప్రయోగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ఏకవచన ‘మనిషి’, బహువచన ‘ఈ సంగతులు’, కర్మణి ‘రక్షించబడాలని’ అనే అంశాలు నిలుపబడ్డాయి.
