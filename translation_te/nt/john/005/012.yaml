  text: ἠρώτησαν ⸀οὖν αὐτόν· Τίς ἐστιν ὁ ἄνθρωπος ὁ εἰπών σοι· ⸀Ἆρον καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: te
  text: అందుచేత వారు అతనిని అడిగారు, “నీతో, ‘ఎత్తుకొని నడువు’ అని చెప్పిన మనిషి ఎవరు?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు వాక్యంలో “ఎత్తుకొని నడువు” అని ఉంది. ఏమి ఎత్తుకోవాలో ఇక్కడ ప్రత్యక్షంగా చెప్పలేదు; మునుపటి సందర్భంలో అది అతడు పడుకొని ఉన్న పరుపును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: అడిగారు
  rationale: ἐρωτάω యొక్క భూతకాల కథన రూపాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది; సందర్భంలో లేని శత్రుత్వ తీవ్రతను అదనంగా చేర్చదు.
- source_word: οὖν
  choice: అందుచేత
  rationale: మునుపటి వచనంలోని మాటలకు ప్రతిస్పందనగా వచ్చిన తార్కిక కొనసాగింపును స్పష్టంగా నిలుపుతుంది.
- source_word: αὐτόν
  choice: అతణ్ణి
  rationale: స్వస్థత పొందిన పురుషుణ్ణి సూచించే ఏకవచన పుంలింగ కర్మరూపం.
- source_word: Τίς ἐστιν ὁ ἄνθρωπος
  choice: ఆ మనిషి ఎవరు?
  rationale: ఒక నిర్దిష్ట పురుషుని గురించి వేసిన ప్రత్యక్ష ప్రశ్నను సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: ὁ εἰπών σοι
  choice: నీతో చెప్పిన
  rationale: గ్రీకు విశేషణాత్మక కృదంతాన్ని, దాని దత్తివ విభక్తి సంబంధంతో సహా, సంక్షిప్తంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἆρον
  choice: ఎత్తుకొని
  rationale: αἴρω ఆజ్ఞారూపానికి నేరమైన అర్థం. గ్రీకులో కర్మ ఈ వాక్యంలో వ్యక్తంగా లేదు కాబట్టి ప్రధాన పాఠ్యంలో ‘దాన్ని’ అని చేర్చకుండా, మునుపటి సందర్భం ద్వారా అర్థమయ్యేలా ఉంచబడింది.
- source_word: καὶ περιπάτει
  choice: నడువు
  rationale: వర్తమాన ఆజ్ఞారూపాన్ని సహజమైన తెలుగు ఆజ్ఞగా ఇస్తుంది; క్రియాంశాన్ని ‘నడుస్తూనే ఉండు’ అని అతిగా నిర్ధారించదు.
