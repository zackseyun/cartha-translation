  edition: SBLGNT
  text: καὶ οὐ θέλετε ἐλθεῖν πρός με ἵνα ζωὴν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: te
  text: అయినా, జీవం పొందేందుకు మీరు నా దగ్గరకు రావడానికి ఇష్టపడటం లేదు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరియు మీరు జీవం పొందేందుకు నా దగ్గరకు రావాలని కోరుకోవడం లేదు.” గ్రీకు సంధిపదాన్ని సాధారణంగా “మరియు” అని, θέλετεను “కోరుకుంటున్నారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: యోహాను సువార్తలో “జీవం” అనే పదం తరచుగా దేవుని నుండి వచ్చే జీవాన్ని, అంటే నిత్యజీవాన్ని, సూచిస్తుంది; అయితే ఇక్కడ “నిత్య” అనే పదం లేదు.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: అయినా
  rationale: καί సాధారణంగా ‘మరియు’ అని అర్థమైనా, ముందున్న మందలింపుతో ఉన్న వ్యత్యాసాన్ని ఈ సందర్భంలో ‘అయినా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ θέλετε
  choice: ఇష్టపడడం లేదు
  rationale: θέλωలోని కోరుకోవడం లేదా సంకల్పించడం అనే భావాన్ని ఇది నిలుపుతుంది; ‘నిరాకరిస్తున్నారు’ అనే మరింత బలమైన వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: ἐλθεῖν πρός με
  choice: నా దగ్గరకు రావడానికి
  rationale: πρός + కర్మవిభక్తితో ἐλθεῖν అంటే సహజంగా ‘నా దగ్గరకు రావడం.’ విశ్వాసానికి సంబంధించిన యోహాను భావసూచనను నేరుగా ‘నన్ను నమ్మడం’గా వ్యాఖ్యానించకుండా, మూలంలోని రూపకాన్ని కాపాడుతుంది.
- source_word: ἵνα
  choice: పొందడానికి
  rationale: తెలుగులో ప్రయోజనార్థాన్ని సహజంగా తెలియజేసే క్రియారూపం; ‘దానివల్ల’ అనే ఫలితార్థం కంటే ఇక్కడి ఉద్దేశ్యాన్ని ముందుకు తెస్తుంది.
- source_word: ζωὴν
  choice: జీవం
  rationale: ζωήకు నేరుగా ‘జీవం’ అని అనువాదం. యోహానులో ఇది దేవుని నుండి వచ్చే నిత్యజీవాన్ని సూచించగలిగినా, ఇక్కడ αἰώνιος లేదు.
- source_word: ἔχητε
  choice: పొందడానికి
  rationale: ἵναతో వచ్చిన వర్తమాన సంభావనార్థక క్రియను తెలుగులో సహజమైన ప్రయోజనార్థక నిర్మాణంగా వ్యక్తం చేస్తుంది; జీవాన్ని సొంతంగా కలిగి ఉండడాన్ని సందర్భానుసారంగా ‘పొందడం’గా అందిస్తుంది.
theological_decisions:
- issue: ζωὴνను ‘జీవం’గా లేదా ‘నిత్యజీవం’గా అనువదించాలా
  choice: జీవం
  alternative: నిత్యజీవం
  rationale: యోహాను సువార్తలో ζωή తరచుగా రక్షణ సంబంధమైన, దేవుని నుండి వచ్చే జీవాన్ని సూచిస్తుంది. అయితే ఈ వాక్యంలో ‘నిత్య’ అనే పదం స్పష్టంగా లేదు కాబట్టి దానిని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: ‘నా దగ్గరకు రావడం’ను ప్రధాన పాఠ్యంలో విశ్వసించడంగా వివరించాలా
  choice: నా దగ్గరకు రావడం
  alternative: నన్ను నమ్మడం / విశ్వాసంతో నా దగ్గరకు రావడం
  rationale: యోహానులో యేసు దగ్గరకు రావడం విశ్వాసంతో సన్నిహితంగా ముడిపడి ఉన్నా, మూలపాఠ్యం ‘రావడం’ అనే స్పష్టమైన క్రియనే వాడుతుంది. ఆ రూపకాన్ని వ్యాఖ్యానంగా మార్చకుండా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అయినా’ సందర్భంలోని వ్యత్యాసాన్ని చూపుతుంది; ‘ఇష్టపడడం లేదు’ సంకల్ప సంబంధ భావాన్ని నిలుపుతూ అతిగా బలపరచదు. ‘జీవం’ యోహాను పదప్రయోగపు వేదాంత విస్తృతిని కాపాడుతుంది.
