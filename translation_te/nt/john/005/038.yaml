id: JHN.5.38
reference: John 5:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: te
  text: మీలో నిలిచి ఉండే ఆయన వాక్యం మీకు లేదు[a]; ఎందుకంటే ఆయన పంపినవానిని మీరు నమ్మరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన వాక్యం మీలో నివసిస్తూ ఉండదు.’
    reason: μέ νω పదంలోని కొనసాగుతున్న ఉనికి భావానికి ‘నివసిస్తూ ఉండడం’ కూడా సాధ్యమైన తెలుగు ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: λόγον
  choice: వాక్యం
  rationale: ఇక్కడ ఇది దేవుని పలికిన లేదా వెల్లడించిన వాక్యాన్ని సూచిస్తుంది. ‘వాక్యం’ యోహాను రచనలోని పదప్రయోగాన్ని, దాని సాధ్యమైన విస్తృత ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ἔχετε ... μένοντα
  choice: నిలిచి ఉండడం లేదు
  rationale: గ్రీకులో ‘కలిగి ఉండడం’ అనే క్రియతో ‘నిలిచి ఉండే’ అనే వర్తమాన కృదంతం కలిసి, వాక్యం వారిలో నిరంతరం ఉండే స్థితి లేదని చెబుతున్నాయి. తెలుగులో ‘మీలో నిలిచి ఉండడం లేదు’ సహజంగా ఆ కొనసాగింపు భావాన్ని అందిస్తుంది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: అంతర్గత ఉనికిని సూచించే గ్రీకు పదబంధానికి సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: వారి అంతరంగంలో దేవుని వాక్యం నిలిచి ఉండకపోవడానికి కారణాన్ని పరిచయం చేసే కారణార్థక ప్రయోగం.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: ఆయన పంపినవాణ్ణి
  rationale: సందర్భంలో పంపినవాడు తండ్రి, పంపబడినవాడు యేసు. ఈ రూపం వ్యక్తిగత సూచనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τούτῳ ... οὐ πιστεύετε
  choice: పంపినవాణ్ణి మీరు నమ్మడం లేదు
  rationale: ముందుకు తెచ్చిన గ్రీకు సర్వనామం యేసును ఉద్ఘాటిస్తుంది. తెలుగులో సంబంధవాచక రూపంలో అదే వ్యక్తిని స్పష్టంగా చూపుతూ ‘నమ్మడం లేదు’ అని వర్తమాన భావాన్ని కాపాడింది.
theological_decisions:
- issue: దేవుని వాక్యం వారిలో నిలిచి ఉండకపోవడం మరియు పంపబడినవాణ్ణి నమ్మకపోవడం మధ్య సంబంధం
  choice: యేసును నమ్మకపోవడమే తండ్రి వాక్యం వారిలో నిలిచి లేదనే వాక్యానికి కారణంగా ఇవ్వబడింది.
  alternative: ఇది ప్రత్యేకంగా లేఖనాన్ని అంతరంగంలో నిలుపుకోకపోవడం లేదా దానికి లోబడకపోవడం గురించి మాత్రమే అని చదవవచ్చు.
  rationale: అనువాదం గ్రీకు వాక్యంలోని కారణ సంబంధాన్ని నిలుపుతుంది; పునర్జన్మ, అంతర్నివాసం లేదా విశ్వాసంలో నిలకడ గురించి ఏ ప్రత్యేక సిద్ధాంతాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘వాక్యం’, ‘నిలిచి ఉండడం’ యోహాను సాహిత్యంలోని పదసంబంధాన్ని, కొనసాగింపు భావాన్ని కాపాడుతాయి.
