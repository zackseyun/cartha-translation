revisions:
- from: ఆయన వాక్యం మీలో నిలిచి ఉండడం లేదు[a]; ఎందుకంటే ఆయన పంపినవాణ్ణి మీరు నమ్మడం లేదు.
  to: మీలో నిలిచి ఉండే ఆయన వాక్యం మీకు లేదు[a]; ఎందుకంటే ఆయన పంపినవానిని మీరు నమ్మరు.
  rationale: The revision restores the explicit ‘you do not have’ sense of ἔχετε by using ‘మీకు లేదు,’ while ‘మీలో నిలిచి ఉండే’ renders the participle μένοντα as a continuing quality of the word. The causal relation introduced by ὅτι and the direct-object sense of πιστεύετε with the dative τούτῳ are preserved. No theological conclusion beyond the verse’s own causal statement is added.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T01:37:19Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the Father as the referent of αὐτοῦ/ἐκεῖνος and Jesus as the one sent. However, the first clause is phrased as a bare statement that the word is not abiding, whereas ἔχετε explicitly says that the hearers do not have the word abiding in them. The revision retains both the possession and continuing-presence senses.
  naturalness: The revised wording is idiomatic modern standard Telugu and maintains a suitably serious Johannine register. ‘పంపినవానిని’ is a more standard written form than the colloquial contraction ‘పంపినవాణ్ణి.’
  terminology: ‘వాక్యం’ appropriately renders λόγος and preserves Johannine diction. ‘నిలిచి ఉండే’ conveys the durative force of μένοντα without forcing a doctrinal interpretation. The alternative ‘నివసించే’ is retained in the footnote as a legitimate lexical alternative.
  issues:
  - severity: medium
    issue: The explicit force of ἔχετε (‘you have’) is underrepresented in ‘ఆయన వాక్యం మీలో నిలిచి ఉండడం లేదు.’
    rationale: The Greek construction says that they do not have his word as something remaining in them. Recasting the clause with ‘మీకు లేదు’ preserves this possession/retention element while retaining the modifying participle’s continuing sense.
  - severity: low
    issue: ‘పంపినవాణ్ణి’ is conversationally contracted.
    rationale: ‘పంపినవానిని’ is more natural in modern standard written Telugu for the verse’s formal register, with no change in meaning.
  revised_text: మీలో నిలిచి ఉండే ఆయన వాక్యం మీకు లేదు[a]; ఎందుకంటే ఆయన పంపినవానిని మీరు నమ్మరు.
  revised_footnotes:
  - marker: a
    text: లేదా, ‘ఆయన వాక్యం మీలో నివసిస్తూ ఉండదు.’
    reason: μέ νω పదంలోని కొనసాగుతున్న ఉనికి భావానికి ‘నివసిస్తూ ఉండడం’ కూడా సాధ్యమైన తెలుగు ప్రత్యామ్నాయం.
  revision_rationale: The revision restores the explicit ‘you do not have’ sense of ἔχετε by using ‘మీకు లేదు,’ while ‘మీలో నిలిచి ఉండే’ renders the participle μένοντα as a continuing quality of the word. The causal relation introduced by ὅτι and the direct-object sense of πιστεύετε with the dative τούτῳ are preserved. No theological conclusion beyond the verse’s own causal statement is added.
