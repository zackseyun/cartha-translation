id: JHN.5.29
reference: John 5:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: te
  text: మరియు వారు బయటికి వస్తారు—మేలు చేసినవారు జీవపు పునరుత్థానానికి, కానీ చెడు చేసినవారు తీర్పు పునరుత్థానానికి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శిక్షావిధి పునరుత్థానానికి.’ గ్రీకులో ‘తీర్పు’ అని ఉంది; దానికి విస్తృతమైన అర్థం ఉంది. ‘శిక్షావిధి’ అనేది కొన్ని అనువాదాల్లో కనిపించే, అర్థాన్ని మరింత సంకుచితం చేసే వ్యాఖ్యానాత్మక అనువాదం.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: బయటికి వస్తారు
  rationale: మునుపటి వచనంలో చెప్పిన సమాధుల నుంచి మృతులు వెలుపలికి రావడాన్ని సందర్భానుసారంగా సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: మేలు చేసినవారు
  rationale: నామవాచకార్థంలో ఉన్న τὰ ἀγαθὰను సహజంగా వ్యక్తపరుస్తూ, ποιήσαντες సూచించే వారి క్రియలను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἀνάστασιν ζωῆς
  choice: జీవపు పునరుత్థానానికి
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని, తరువాతి సమాంతర పదబంధంతో ఉన్న నిర్మాణాన్ని కాపాడుతుంది; ‘జీవానికి పునరుత్థానం’ కంటే ఇది తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: τὰ φαῦλα πράξαντες
  choice: చెడు చేసినవారు
  rationale: φαῦλα యొక్క నైతిక ప్రతికూల భావాన్ని స్పష్టంగా తెలియజేస్తుంది. ποιέω–πράσσω మధ్య సూక్ష్మ భేదాన్ని తెలుగులో బలవంతంగా చూపితే అసహజత లేదా పాఠ్యంలో లేని అలవాటు భావం చేరవచ్చు కాబట్టి రెండింటికీ ‘చేయు’ వాడబడింది.
- source_word: ἀνάστασιν κρίσεως
  choice: తీర్పు పునరుత్థానానికి
  rationale: κρίσις యొక్క విస్తృత ప్రాథమిక అర్థమైన ‘తీర్పు’ను నిలుపుతూ, దానిని ముందుగానే ‘శిక్షావిధి’గా కుదించదు.
- source_word: δὲ
  choice: — … ,
  rationale: రెండు వర్గాల మధ్య వ్యతిరేకత తెలుగులో సమాంతర వాక్య నిర్మాణం మరియు విరామచిహ్నాల ద్వారా స్పష్టంగా ఉంది; అదనంగా ‘అయితే’ చేర్చకుండా గ్రీకు సంక్షిప్తతను కాపాడుతుంది.
theological_decisions:
- issue: κρίσεωςను విస్తృతంగా ‘తీర్పు’గా అనువదించాలా, మరింత సంకుచితంగా ‘శిక్షావిధి’గా అనువదించాలా
  choice: తీర్పు
  alternative: శిక్షావిధి
  rationale: κρίσις స్వయంగా తీర్పు అనే విస్తృత భావాన్ని కలిగి ఉంది. సందర్భం గంభీరమైన ప్రతికూల ఫలితాన్ని సూచించినప్పటికీ, అనువాదమే దానిని మరింత సంకుచితమైన సిద్ధాంతార్థానికి పరిమితం చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘పునరుత్థానం’ అనే స్థిర బైబిలు పదాన్ని ఉంచి, మిగతా వాక్యాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం. ప్రధాన పాఠ్యంలో [a] గుర్తు సంబంధిత పదబంధం తరువాత ఉంచబడింది.
