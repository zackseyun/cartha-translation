  source_fidelity: The draft accurately conveys emergence, the two classes, and the two corresponding resurrections. However, initial “అప్పుడు” means “then,” whereas καί is simply connective (“and”), and the explicit contrast of δέ is better represented by “కాని.”
  naturalness: The revision remains idiomatic, modern standard Telugu. “వారు బయటికి వస్తారు” fits the tomb-emergence context; the balanced clauses are clear and suitably solemn.
  terminology: “పునరుత్థానం” is an appropriate established biblical term. “తీర్పు” correctly retains the broad sense of κρίσις without narrowing it to condemnation. The footnote is attached directly to the judgment-resurrection expression it explains.
  issues:
  - severity: medium
    issue: “అప్పుడు” over-specifies καί.
    rationale: καί is connective here and does not itself mean “then.” “మరియు” preserves the source relation without adding temporal sequencing.
  - severity: low
    issue: The δέ contrast is only implicit in the draft.
    rationale: The parallel construction suggests contrast, but “కాని” naturally and explicitly represents δέ’s adversative force.
  - severity: low
    issue: Footnote marker is sentence-final rather than attached to the expression discussed.
    rationale: The note concerns ἀνάστασιν κρίσεως / “తీర్పు పునరుత్థానం”; placing [a] immediately after that phrase provides a clear anchor.
