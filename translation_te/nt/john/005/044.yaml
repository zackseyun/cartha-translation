id: JHN.5.44
reference: John 5:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: te
  text: మీరు ఒకరి నుండి ఒకరు మహిమను పొందుతూ, ఏకైక దేవుని నుండి వచ్చే మహిమను వెదకకుండా, ఎలా విశ్వసించగలరు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘మహిమ’ అనే రెండు ప్రయోగాలకూ ‘గౌరవం’ అని కూడా అనువదించవచ్చు (గ్రీకు: δόξα).'
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε ... πιστεῦσαι
  choice: ఎలా విశ్వసించగలరు?
  rationale: సామర్థ్యాన్ని ప్రశ్నించే గ్రీకు అలంకారప్రశ్నను సహజమైన ఆధునిక తెలుగు రూపంలో వ్యక్తం చేస్తుంది. δύνασθε యొక్క భావం ‘గలరు’లో నిలుస్తుంది.
- source_word: ὑμεῖς
  choice: మీరు
  rationale: గ్రీకులో స్పష్టంగా ఉన్న సర్వనామాన్ని తెలుగులోనూ ఉంచింది; అనవసరంగా ‘మీరే’ అని బలపరచలేదు.
- source_word: δόξαν ... τὴν δόξαν
  choice: మహిమను ... మహిమను
  rationale: రెండు చోట్లా ఒకే పదాన్ని వాడి, మనుషుల నుండి వచ్చే δόξαకు దేవుని నుండి వచ్చే δόξాకు మధ్య ఉన్న ఉద్దేశపూర్వక సమాంతరతను కాపాడింది. సందర్భానుసారంగా ‘గౌరవం’ కూడా సాధ్యమే.
- source_word: παρ’ ἀλλήλων
  choice: ఒకరి నుండి ఒకరు
  rationale: పరస్పరంగా మనుషుల నుండి పొందడాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: λαμβάνοντες
  choice: పొందుతూ
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న ప్రవర్తన భావాన్ని కాపాడే నేరమైన తెలుగు రూపం.
- source_word: καὶ ... οὐ ζητεῖτε
  choice: వెదకకపోతే
  rationale: గ్రీకు వాక్యంలోని ప్రతికూల పరిస్థితి మరియు అలంకారప్రశ్న మధ్య తార్కిక సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని భావాన్ని మార్చకుండా వాక్యప్రవాహాన్ని మెరుగుపరుస్తుంది.
- source_word: τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ
  choice: ఏకైక దేవుని నుండి వచ్చే మహిమను
  rationale: పునరుక్త నిర్దేశక నిర్మాణాన్ని సహజమైన తెలుగు సంబంధ వాక్యাংশంగా అందించి, దేవుడే ఆ మహిమకు మూలమనే భావాన్ని నిలుపుతుంది.
- source_word: μόνου θεοῦ
  choice: ఏకైక దేవుడు
  rationale: μόνος సూచించే ప్రత్యేకతను సంక్షిప్తంగా కాపాడుతుంది; మూలంలో లేని అదనపు సిద్ధాంత వివరణను చేర్చదు.
theological_decisions:
- issue: యోహాను సందర్భంలో πιστεῦσαι అనువాదం
  choice: విశ్వసించగలరు
  alternative: నమ్మగలరు
  rationale: ‘విశ్వసించు’ πιστεύω యొక్క విశ్వాసం/నమ్మకం పరిధిని విస్తృతంగా ఉంచుతుంది; దానిని మరింత నిర్దిష్టమైన సిద్ధాంతార్థానికి పరిమితం చేయదు.
- issue: రెండు δόξα ప్రయోగాల ఏకరీతి అనువాదం
  choice: రెండు చోట్లా ‘మహిమ’
  alternative: రెండు చోట్లా ‘గౌరవం’
  rationale: మానవ మూలం మరియు దైవిక మూలం మధ్య గ్రీకులోని పదపునరుక్తి, ఉద్వేగభరిత వ్యత్యాసం నిలుస్తాయి. అయితే ఈ సందర్భంలో ‘గౌరవం’ అనే భావం కూడా నిజమైన పదార్థ ప్రత్యామ్నాయం.
- issue: τοῦ μόνου θεοῦ అనువాదం
  choice: ఏకైక దేవుడు
  alternative: ఒక్కడే అయిన దేవుడు
  rationale: దేవుని ఏకైకత్వాన్ని నేరుగా తెలియజేస్తూ, పాఠం చెప్పనిదాన్ని క్రీస్తుశాస్త్రపరంగా గానీ ఇతర సిద్ధాంతపరంగా గానీ జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన అలంకారప్రశ్నగా రూపొందించబడింది. ‘ఎలా ... గలరు?’ అనే నిర్మాణం πῶς δύνασθε యొక్క సామర్థ్య ప్రశ్నను నిలుపుతుంది. షరతు రూపమైన ‘వెదకకపోతే’ తెలుగు ప్రవాహానికి అనుకూలమైన optimal-equivalence ఎంపిక.
