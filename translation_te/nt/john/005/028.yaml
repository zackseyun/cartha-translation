  verdict: revise
  source_fidelity: The draft correctly renders the prohibition, the burial-place image, and the possessive 'his voice.' However, 'ఆయన స్వరం వినే ఒక గడియ' can grammatically attach 'వినే' to 'గడియ' in a way that is less explicit than the Greek future verb; the revision makes clear that those in the tombs are the ones who will hear.
  naturalness: The revised wording is natural, modern standard Telugu while retaining the slightly elevated Johannine term 'గడియ.' Adding 'ఎందుకంటే' explicitly conveys the causal force of ὅτι, which the semicolon alone leaves implicit.
  terminology: '''సమాధులు'' suitably represents μνημεῖα in this burial context. The footnote preserves the viable lexical alternative ''గోరీలు'' without expanding the resurrection implication into interpretation.'
  issues:
  - severity: medium
    issue: The future action is not fully explicit in the draft.
    rationale: The Greek has πάντες ... ἀκούσουσιν ('all ... will hear'). Recasting the clause with 'వింటారు' clearly identifies the people in the tombs as the hearers and retains the future assertion.
  - severity: low
    issue: The causal ὅτι is represented only by punctuation.
    rationale: A semicolon can suggest a connection, but 'ఎందుకంటే' directly and naturally renders the stated reason.
