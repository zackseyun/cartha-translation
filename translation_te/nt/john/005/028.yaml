id: JHN.5.28
reference: John 5:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ⸀ἀκούσουσιν τῆς φωνῆς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/john/005/028.yaml
  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
translation:
  language: te
  text: దీనికి ఆశ్చర్యపడకండి, ఎందుకంటే సమాధుల్లో[a] ఉన్నవారందరూ ఆయన స్వరం వినే ఒక గడియ వస్తోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గోరీలు.” గ్రీకు μνημεῖα సాధారణంగా మృతులను పాతిపెట్టే స్థలాలను సూచించవచ్చు; ఇక్కడ సాక్షాత్కారమైన చిత్రణను నిలుపడానికి “సమాధులు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: ఆశ్చర్యపడకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థక రూపం నిషేధాన్ని తెలియజేస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి θαυμάζω భావబలాన్ని నిలుపుతుంది.
- source_word: τοῦτο
  choice: దీనికి
  rationale: ముందు చెప్పిన విషయాన్ని సూచించే సర్వనామం; తెలుగు వాక్యనిర్మాణంలో ‘ఆశ్చర్యపడు’తో ‘దీనికి’ సహజం.
- source_word: ὅτι
  choice: ;
  rationale: ఇక్కడ ὅτι తరువాతి వాక్యం ఆశ్చర్యపడవద్దనే ఆజ్ఞకు కారణం చెబుతుంది. తెలుగులో అర్ధవిరామంతో ఆ కారణసంబంధం సహజంగా వ్యక్తమవుతుంది; ‘ఎందుకంటే’ను చేర్చకుండానే మూలార్థం స్పష్టంగా ఉంటుంది.
- source_word: ἔρχεται ὥρα
  choice: ఒక గడియ రాబోతున్నది
  rationale: నిర్దేశక ఉపపదం లేని ὥραను ‘ఒక గడియ’గా ఉంచడం యోహాను రచనలోని ప్రత్యేక పదచిత్రాన్ని, దైవశాస్త్రీయ ప్రతిధ్వనిని కాపాడుతుంది. ‘రాబోతున్నది’ సమీపిస్తున్న భవిష్యత్తు భావాన్ని సహజంగా ఇస్తుంది.
- source_word: ἐν ᾗ
  choice: — ఆ గడియలో అనే భావం వాక్యక్రమంలో అంతర్నిహితం
  rationale: తెలుగులో ‘ఒక గడియ రాబోతున్నది’కి ముందుగా ఆ గడియలో జరిగే విషయాన్ని ఉంచడం సహజం; సంబంధవాచక నిర్మాణపు భావం కోల్పోదు.
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: సమాధుల్లో ఉన్నవారందరూ
  rationale: πάντες οἱ నిర్మాణం ‘ఉన్నవారందరూ’గా సహజంగా వస్తుంది. μνημεῖα ఇక్కడ మృతులను ఉంచే సమాధి స్థలాలను సూచిస్తుంది; ‘సమాధులు’ స్పష్టమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: ἀκούσουσιν
  choice: వింటారు
  rationale: భవిష్యత్ క్రియారూపాన్ని తెలుగులో సాధారణ భవిష్యత్ భావంతో సహజంగా అనువదిస్తుంది.
- source_word: τῆς φωνῆς αὐτοῦ
  choice: ఆయన స్వరం
  rationale: φωνή వ్యక్తి పలికే స్వరాన్ని సూచిస్తుంది. గౌరవప్రదమైన ‘ఆయన’ సందర్భానికి తగినది; అదనపు వివరణ అవసరం లేదు.
theological_decisions:
- issue: సమాధుల్లో ఉన్నవారు ఆయన స్వరం వినడంలో సూచితమైన పునరుత్థాన భావం
  choice: ‘సమాధుల్లో ఉన్నవారందరూ’ అనే మూలంలోని సాక్షాత్కార చిత్రాన్ని మాత్రమే నిలుపడం
  alternative: ‘చనిపోయిన వారందరూ’ అని భావాన్ని విప్పి చెప్పడం
  rationale: వచనం పునరుత్థానాన్ని సూచించినప్పటికీ, అనువాదం దానిని సిద్ధాంత వివరణగా విస్తరించకూడదు. సమాధుల చిత్రణ మూలపాఠంలోని భావోద్వేగ, దైవశాస్త్రీయ ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. ‘గడియ’ సాధారణ ‘సమయం’కంటే కొద్దిగా ఉన్నత శైలిలో ఉన్నా యోహాను సువార్తలో ὥρα పదానికి ఉన్న సాహిత్య, దైవశాస్త్రీయ ప్రాధాన్యాన్ని నిలుపుతుంది. వాక్యం సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా క్రమబద్ధీకరించబడింది.
