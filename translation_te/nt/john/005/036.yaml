id: JHN.5.36
reference: John 5:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: te
  text: అయితే యోహాను సాక్ష్యం కంటే గొప్పదైన సాక్ష్యం నాకు ఉంది[a]. ఎందుకంటే, నేను పూర్తిచేయడానికి తండ్రి నాకు ఇచ్చిన కార్యాలు—నేను చేస్తున్న ఆ కార్యాలే—తండ్రి నన్ను పంపాడని నా గురించి సాక్ష్యమిస్తున్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోహాను సాక్ష్యవచనం కంటే గొప్ప సాక్ష్యవచనం.”
    reason: μαρτυρίαను “సాక్ష్యం”గా లేదా “సాక్ష్యవచనం”గా అనువదించవచ్చు; రెండూ యోహాను సువార్తలోని ఆధారపూర్వక సాక్ష్య భావాన్ని తెలియజేస్తాయి.
lexical_decisions:
- source_word: μαρτυρίαν
  choice: సాక్ష్యం
  rationale: న్యాయపరమైన, ఆధారపూర్వకమైన భావాన్ని నిలుపుతూ యోహాను సువార్తలోని సాక్ష్యపు ప్రధాన ఇతివృత్తాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: μείζω
  choice: గొప్ప
  rationale: యోహాను సాక్ష్యంతో పోల్చినప్పుడు అధిక ప్రాముఖ్యత లేదా బలాన్ని సూచించే తులనాత్మక భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: τοῦ Ἰωάννου
  choice: యోహాను సాక్ష్యం కంటే
  rationale: గ్రీకులో ఉన్న సంక్షిప్త తులనను తెలుగులో అర్థవంతంగా చేయడానికి సూచితమైన ‘సాక్ష్యం’ను స్పష్టంగా పేర్కొంటుంది.
- source_word: ἔργα
  choice: కార్యాలు
  rationale: కేవలం అద్భుతాలకు పరిమితం చేయకుండా, తండ్రి ఇచ్చిన యేసు కార్యాచరణ అంతటినీ సూచించగల యోహానీయ భావగాంభీర్యాన్ని నిలుపుతుంది.
- source_word: δέδωκέν μοι
  choice: నాకు ఇచ్చిన
  rationale: పూర్తయిన ఇవ్వడం వల్ల కొనసాగుతున్న బాధ్యతను సూచించే perfect రూప భావాన్ని సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα τελειώσω αὐτά
  choice: నేను పూర్తిచేయడానికి
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని, అప్పగించబడిన కార్యాలను పరిపూర్ణ ముగింపుకు తీసుకురావాలనే భావంతో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: αὐτὰ τὰ ἔργα ἃ ποιῶ
  choice: నేను చేస్తున్న ఈ కార్యాలే
  rationale: αὐτάలోని ఉద్ఘాటనను ‘కార్యాలే’ ద్వారా, వర్తమాన క్రియలోని కొనసాగుతున్న కార్యాచరణను ‘చేస్తున్న’ ద్వారా నిలుపుతుంది.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: నా గురించి సాక్ష్యమిస్తున్నాయి
  rationale: యేసును గురించి ఆధారం ఇచ్చే న్యాయసంబంధ సాక్ష్య భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἀπέσταλκεν
  choice: పంపాడని
  rationale: తెలుగు పరోక్ష వాక్య నిర్మాణంలో సహజంగా ఉండి, తండ్రి పంపిన కార్యం ఈ సాక్ష్యానికి విషయమని స్పష్టపరుస్తుంది.
theological_decisions:
- issue: యేసును ధ్రువీకరించే సాక్ష్యం స్వభావం
  choice: తండ్రి ఇచ్చిన కార్యాలన్నీ యేసు పంపబడినవాడని సాక్ష్యమిస్తాయి.
  alternative: ‘కార్యాలు’ అన్నది కేవలం అద్భుతాలను మాత్రమే సూచిస్తుంది.
  rationale: మూలంలోని ἔργα విస్తృత పదం; దానిని ‘అద్భుతాలు’గా కుదించకుండా యేసుకు తండ్రి ఇచ్చిన దైవిక కార్యాచరణ అనే విస్తృతతను నిలుపుతుంది.
- issue: ὁ πατήρ అనే సంబోధన
  choice: తండ్రి
  alternative: దేవుడు; నా తండ్రి
  rationale: గ్రీకులో ఉన్న నిర్దిష్ట బిరుదును నిలుపుతూ, లేని స్వామ్యసూచకాన్ని లేదా వివరణాత్మక నామాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘సాక్ష్యం/సాక్ష్యమిస్తున్నాయి’ అనే పునరుక్తి మూలంలోని μαρτυρία/μαρτυρεῖ పదబంధ సంబంధాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
