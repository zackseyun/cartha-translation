id: JHN.5.2
reference: John 5:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: te
  text: యెరూషలేములో గొర్రెల ద్వారం[a] దగ్గర ఒక కొలను ఉంది. దానిని హీబ్రూ భాషలో[b] బేతెస్దా[c] అని పిలుస్తారు. దానికి ఐదు స్తంభమండపాలు ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు వాక్యంలో ‘ద్వారం’ అనే నామవాచకం స్పష్టంగా లేదు; ఇది గొర్రెల ద్వారం ఉన్న ప్రాంతాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది (నెహెమ్యా 3:1; 12:39 చూడండి).
    reason: cross_reference
  - marker: b
    text: లేదా ‘అరమేయ భాషలో.’ యోహాను వాడిన ‘హీబ్రూ’ అనే మాట కొన్నిసార్లు సాంప్రదాయ హీబ్రూకే పరిమితం కాకుండా యూదయలో వాడుకలో ఉన్న స్థానిక సెమిటిక్ భాషను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘బేతెస్దా’కు బదులుగా ‘బేత్జతా’ లేదా ‘బేత్సయిదా’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: ఉంది
  rationale: వర్తమాన కాలంలోని ἔστινను ‘ఉంది’గా నిలుపుతూ, స్వల్ప అనుసంధానార్థకమైన δέను తెలుగులో అనవసరంగా బలపరచలేదు.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: యెరూషలేములో
  rationale: రూపపరంగా బహువచనమైన గ్రీకు స్థలనామాన్ని తెలుగులో సహజమైన ఏక స్థలనామంగా ఇచ్చాం.
- source_word: ἐπὶ τῇ προβατικῇ
  choice: గొర్రెల ద్వారం దగ్గర
  rationale: ఈ పదబంధం అసంపూర్ణంగా ఉంది; యెరూషలేము భౌగోళిక సందర్భం మరియు నెహెమ్యా 3:1; 12:39 ప్రకారం అర్థంలో ఉన్న ‘ద్వారం’ను స్పష్టత కోసం చేర్చాం. ఈ వ్యాఖ్యానపూర్వక పూరణను పాదసూచికలో తెలిపాం.
- source_word: κολυμβήθρα
  choice: ఒక కొలను
  rationale: నీటిని నిల్వచేసే లేదా స్నానానికి ఉపయోగించే pool అనే సాధారణ భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἡ ἐπιλεγομένη
  choice: అని పిలుస్తారు
  rationale: కొలనుకు వాడుకలో ఉన్న పేరును సూచించే గ్రీకు కృదంత భావాన్ని సహజమైన తెలుగు వాక్యంగా ఇచ్చాం.
- source_word: Ἑβραϊστὶ
  choice: హీబ్రూ భాషలో
  rationale: మూలపాఠంలోని పదాన్ని నేరుగా నిలిపాం; యోహాను వాడుకలో ఇది స్థానిక అరమేయ భాషను కూడా సూచించవచ్చనే అనిశ్చితిని పాదసూచికలో ఉంచాం.
- source_word: Βηθεσδά
  choice: బేతెస్దా
  rationale: అందించిన SBLGNT పాఠరూపాన్ని తెలుగు లిపిలో లిప్యంతరీకరించాం; ఇతర ప్రతుల పాఠభేదాలను పాదసూచికలో ఇచ్చాం.
- source_word: πέντε στοὰς ἔχουσα
  choice: దానికి ఐదు స్తంభమండపాలు ఉన్నాయి
  rationale: στοά అనేది కప్పు మరియు స్తంభాలతో కూడిన మండపం లేదా నడవను సూచిస్తుంది. ‘స్తంభమండపాలు’ ఆ నిర్మాణ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; గ్రీకు కృదంతాన్ని సహజమైన తెలుగు వాక్యంగా మార్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. పొడవైన గ్రీకు వాక్యాన్ని స్పష్టత కోసం మూడు సహజ తెలుగు వాక్యాలుగా విభజించాం. పాఠభేదం, భాషాపరమైన అనిశ్చితి, ‘ద్వారం’ అనే పూరణ—మూడింటినీ ప్రధాన పాఠంలో తేల్చివేయకుండా పాదసూచికల్లో భద్రపరిచాం.
