id: JHN.5.14
reference: John 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: te
  text: 'ఈ సంగతుల తరువాత యేసు అతణ్ణి దేవాలయంలో కనుగొని, అతనితో ఇలా అన్నాడు: “ఇదిగో, నీవు స్వస్థుడవయ్యావు.[a] నీకు ఇంతకంటే ఘోరమైనది ఏదైనా జరగకుండా ఇక పాపం చేయకు.”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులోని పరిపూర్ణ క్రియారూపం, అతడు స్వస్థత పొందిన మార్పును మరియు దాని ఫలితంగా ఇప్పుడు స్వస్థంగా ఉన్న స్థితిని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ హెచ్చరిక అతని మునుపటి వ్యాధి ఒక నిర్దిష్ట పాపం వల్ల వచ్చిందని స్పష్టంగా చెప్పదు. అలాగే “ఇంతకంటే ఘోరమైనది” ఈ లోకంలో కలిగే బాధనా, అంతిమ తీర్పా, లేక రెండింటినీ సూచిస్తుందా అనేదీ స్పష్టం చేయదు.
    reason: alternative_reading
  - marker: c
    text: కొన్ని గ్రీకు ప్రతులలో “నీకు ఏదైనా” అనే పదాలు లేవు; అవి ఉన్న పాఠ్యం ప్రకారం అనువదించబడింది.
    reason: textual_variant
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: ఆ తరువాత
  rationale: బహువచన సూచనతో కూడిన యోహాను కథన క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అక్షరార్థమైన ‘ఈ సంగతుల తరువాత’ కంటే ఇది సులభంగా చదవబడుతుంది.
- source_word: εὑρίσκει
  choice: కనుగొని
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథన శైలిలో గత సంఘటనల క్రమానికి అనుగుణంగా సంయోజక క్రియారూపం సహజంగా ఉంటుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయంలో
  rationale: ἱερόν అంతర్గత పరిశుద్ధ స్థలానికే పరిమితం కాకుండా దేవాలయ ప్రాంగణ సముదాయాన్ని సూచిస్తుంది; ‘దేవాలయంలో’ సంక్షిప్తంగా, సహజంగా ఆ విస్తృత భావాన్ని ఉంచుతుంది.
- source_word: Ἴδε
  choice: ఇదిగో
  rationale: శ్రద్ధ ఆకర్షించే బలాన్ని గౌరవప్రదమైన, ఇప్పటికీ అర్థమయ్యే తెలుగు రూపంలో నిలుపుతుంది.
- source_word: ὑγιὴς γέγονας
  choice: నీవు స్వస్థుడవయ్యావు
  rationale: పూర్తయిన మార్పు మరియు దాని ప్రస్తుత ఫలితస్థితి రెండింటినీ γέγονας సూచిస్తుంది; ‘స్వస్థంగా ఉన్నావు’ కంటే ఈ మార్పును స్పష్టంగా ఉంచుతుంది.
- source_word: μηκέτι ἁμάρτανε
  choice: ఇక పాపం చేయకు
  rationale: ఇప్పటి నుంచి పాపాన్ని మానుకోవాలనే ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది; గ్రీకు వర్తమాన ఆజ్ఞారూపం తప్పనిసరిగా నిరంతర చర్యనే నిర్ధారించదు కాబట్టి ‘పాపం చేస్తూనే ఉండకు’ అని అతివ్యాఖ్య చేయలేదు.
- source_word: ἵνα μὴ
  choice: లేకపోతే ... జరగవచ్చు
  rationale: హెచ్చరికలోని ప్రతికూల ఉద్దేశం లేదా పరిణామ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: χεῖρόν σοί τι γένηται
  choice: నీకు ఇంతకంటే ఘోరమైనది ఏదైనా జరగవచ్చు
  rationale: χεῖρόν యొక్క తులనాత్మక భావం, τι యొక్క అనిర్దిష్టత, σοί యొక్క సంబంధాన్ని స్పష్టంగా ఉంచి, ‘ఘోరమైనది’ ఏదో నిర్ణయించకుండా వదిలేస్తుంది.
theological_decisions:
- issue: యేసు హెచ్చరికలో పాపం మరియు బాధ మధ్య సంబంధం
  choice: భవిష్యత్తు పాపం విషయంలో యేసు చేసిన హెచ్చరికను నేరుగా అనువదించాం; అయితే గత వ్యాధి ఒక నిర్దిష్ట పాపానికి ప్రత్యక్ష శిక్ష అని చెప్పలేదు.
  alternative: గత వ్యాధి ఒక నిర్దిష్ట పాపానికి తప్పనిసరిగా ప్రత్యక్ష శిక్ష అని, లేదా ‘ఘోరమైనది’ కేవలం ఈ లోక బాధనో కేవలం అంతిమ తీర్పునో సూచిస్తుందని స్పష్టీకరించడం.
  rationale: గ్రీకు పాఠ్యం పాపం చేయవద్దని హెచ్చరించి, మరింత ఘోరమైనది సంభవించే అవకాశాన్ని చెబుతుంది; కానీ గత స్థితికి కారణాన్ని గానీ, రాబోయే పరిణామ స్వరూపాన్ని గానీ ఖచ్చితంగా నిర్వచించదు. అందువల్ల ఆ వేదాంత ఉద్రిక్తతను పాఠ్యంలోనే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని శ్రద్ధాకర్షక బలాన్ని నిలుపుతుంది; ‘స్వస్థుడవయ్యావు’ పూర్తయిన మార్పు మరియు ప్రస్తుత ఫలితాన్ని తెలియజేస్తుంది. పాఠ్యంలో లేని కారణ సంబంధం లేదా తీర్పు స్వరూపం చేర్చబడలేదు.
