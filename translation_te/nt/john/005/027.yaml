  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: te
  text: తీర్పు తీర్చే అధికారాన్ని ఆయనకు ఇచ్చాడు; ఎందుకంటే ఆయన మనుష్యకుమారుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన ఒక మనుష్య కుమారుడు కాబట్టి,” అంటే ఆయన మానవ స్వభావంలో భాగస్వామి కాబట్టి. ప్రధాన పాఠ్యం యోహాను సువార్తలో ఈ మాట బిరుదుగా వాడబడే అవకాశాన్ని అనుసరిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: ఇక్కడ తండ్రి కుమారునికి ఇచ్చిన న్యాయపరమైన అధికార పరిధిని సూచిస్తుంది; కేవలం శక్తి అనే భావం కాదు.
- source_word: ἔδωκεν
  choice: ఇచ్చాడు
  rationale: δίδωμι క్రియ యొక్క సరళమైన భూతకాల భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτῷ
  choice: అతనికి
  rationale: సందర్భంలో కుమారుణ్ణి సూచించే దత్తివ సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: κρίσιν ποιεῖν
  choice: తీర్పు తీర్చడానికి
  rationale: అక్షరార్థంగా ‘తీర్పు చేయడం’ అనే ఈ న్యాయపరమైన గ్రీకు ప్రయోగాన్ని సహజమైన తెలుగులో తీర్పును అమలు చేసే భావంతో వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఇక్కడ అధికారమిచ్చిన కారణాన్ని పరిచయం చేసే కారణార్థక ప్రయోగం.
- source_word: υἱὸς ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం లేకపోయినా, యోహాను సందర్భంలో ఇది యేసుకు స్థిరమైన బిరుదుగా పనిచేస్తూ దానియేలు 7 నేపథ్యాన్ని ప్రతిధ్వనిస్తుంది.
- source_word: ἐστίν
  choice: అతను … కుమారుడు
  rationale: సాధారణ వర్తమానకాల అస్తిత్వ క్రియ; తెలుగులో నామవాచక విధేయంతో సహజంగా అంతర్లీనమవుతుంది.
theological_decisions:
- issue: υἱὸς ἀνθρώπου అనే మాటను క్రీస్తు బిరుదుగా అనువదించాలా, సాధారణ మానవత్వ సూచనగా అనువదించాలా
  choice: ప్రధాన పాఠ్యంలో ‘మనుష్య కుమారుడు’ అనే బిరుదుగా ఉంచడం
  alternative: ‘ఒక మనుష్య కుమారుడు’ లేదా ‘మానవుడు’ అని అనువదించడం
  rationale: యోహాను సువార్తలో ఇది యేసు యొక్క గుర్తింపబడిన స్వీయబిరుదు; న్యాయాధికార సందర్భంలో దానియేలు 7తో ఉన్న సంబంధాన్ని కూడా నిలుపుతుంది. అయితే గ్రీకులో ఉపపదం లేకపోవడం వల్ల సాధారణ మానవత్వ భావం సాధ్యమనే అస్పష్టతను పాదటిప్పణిలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘తీర్పు తీర్చడం’ న్యాయపరమైన భావాన్ని సహజంగా నిలుపుతుంది; గ్రీకు పాఠ్యంలోని శీర్షిక/సాధారణ మానవత్వ అస్పష్టతను పాదటిప్పణిలో ఉంచాం.
