id: JHN.5.35
reference: John 5:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: te
  text: ఆయన మండుతూ వెలుగిచ్చే దీపంగా ఉన్నాడు; మీరైతే కొంతకాలం ఆయన వెలుగులో ఆనందించడానికి ఇష్టపడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కొద్దిసేపు.’ ఈ మాట పరిమితమైన కాలాన్ని సూచిస్తుంది; తప్పనిసరిగా అక్షరార్థమైన ఒక గంటను కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: ఆయన
  rationale: సందర్భంలో బాప్తిస్మమిచ్చే యోహానును సూచించే బలమైన సర్వనామం; ఆధునిక తెలుగులో గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: λύχνος
  choice: దీపం
  rationale: ఇది అమూర్తమైన ‘వెలుగు’ను కాక వెలుగునిచ్చే దీపాన్ని సూచిస్తుంది; యోహాను దీపమని, తానే పరమ వెలుగు కాదని ఉన్న భేదాన్ని కాపాడుతుంది.
- source_word: καιόμενος καὶ φαίνων
  choice: మండుతూ వెలుగిచ్చే
  rationale: రెండు వర్తమాన కృదంతాల కొనసాగుతున్న క్రియను సహజమైన తెలుగులో వ్యక్తపరుస్తూ, మండడం మరియు వెలుగును ప్రసరించడం అనే రెండు భావాలనూ నిలుపుతుంది.
- source_word: ἠθελήσατε
  choice: ఇష్టపడ్డారు
  rationale: వారి సంకల్పపూర్వకమైన మొగ్గును తెలియజేస్తుంది; దానిని దీర్ఘకాలిక నిర్ణయంగా అతిశయింపదు.
- source_word: ἀγαλλιαθῆναι
  choice: ఆనందించడానికి
  rationale: తీవ్రమైన సంతోషాన్ని ఆధునిక సాధారణ తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: πρὸς ὥραν
  choice: కొంతకాలం
  rationale: అక్షరార్థంగా ఒక గంట అని కాక, పరిమితమైన కాలాన్ని సూచించే గ్రీకు నుడికారాన్ని అందిస్తుంది.
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: ఆయన వెలుగులో
  rationale: యోహాను ఇచ్చిన సాక్ష్యపు వెలుగులో ఆనందించడం అనే రూపకాన్ని, గ్రీకు విభక్తి సంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: యోహాను మరియు యేసుకు సంబంధించిన వెలుగు రూపకాల మధ్య భేదం
  choice: యోహానును ‘దీపం’గా అనువదించాం, ‘వెలుగు’గా కాదు.
  alternative: ఆయనే వెలుగు
  rationale: మూలంలో λύχνος (‘దీపం’) ఉంది, φῶς (‘వెలుగు’) కాదు. అందువల్ల యోహాను వెలుగుకు సాక్ష్యమిచ్చే పరాధీనమైన వెలుగు వాహకుడిగా ఉన్న భేదం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ‘ఆయన/మీరు’ రూపాలు. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా, దీపం–వెలుగు రూపక భేదాన్ని స్పష్టంగా నిలిపింది.
