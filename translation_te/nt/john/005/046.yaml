  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐπιστεύετε Μωϋσεῖ, ἐπιστεύετε ἂν ἐμοί, περὶ γὰρ ἐμοῦ ἐκεῖνος ἔγραψεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: te
  text: ఎందుకంటే మీరు మోషేను నమ్మి ఉంటే, నన్ను నమ్మేవారు; ఎందుకంటే ఆయనే నా గురించి రాశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ఎందుకంటే, ... ఉంటే
  rationale: γάρ ముందున్న వాదనకు కారణాన్ని కలుపుతుంది; εἰ షరతును సూచిస్తుంది. ఆధునిక తెలుగులో ఈ కలయిక సహజంగా కారణ–షరతు సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: మీరు మోషేను నమ్మి ఉంటే
  rationale: πιστεύωతో వచ్చిన దత్తివిభక్తి ఇక్కడ మోషే చెప్పినదాన్ని నిజమని నమ్మడాన్ని సూచిస్తుంది. అసంపూర్ణ భూతకాల రూపం, తరువాతి ἄνతో కలిసి, వాస్తవానికి విరుద్ధమైన షరతును తెలియజేస్తుంది.
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: నన్నూ నమ్మేవారు
  rationale: అసంపూర్ణ భూతకాలం + ἄν వాస్తవానికి విరుద్ధమైన షరతు ఫలితాన్ని సూచిస్తుంది. ἐμοί దత్తివిభక్తి కావడంతో ‘నన్ను నమ్మేవారు’ అని అనువదించాం; గ్రీకులో లేని εἰς భావాన్ని చేర్చి ‘నాయందు విశ్వాసముంచేవారు’ అని చేయలేదు. ‘నూ’ రెండు ఉపవాక్యాల సంబంధాన్ని సహజంగా చూపుతుంది.
- source_word: περὶ γὰρ ἐμοῦ
  choice: ఎందుకంటే ... నా గురించి
  rationale: περί + షష్ఠీవిభక్తి ‘గురించి’ అనే అర్థాన్ని ఇస్తుంది; γάρ కారణాన్ని తెలుపుతుంది.
- source_word: ἐκεῖνος
  choice: ఆయన
  rationale: బలప్రయోగంతో ఉన్న సూచనాత్మక సర్వనామం మోషేను తిరిగి సూచిస్తుంది. తెలుగులో గౌరవసూచక ‘ఆయన’ సహజమైనది; సందర్భమే సూచనను స్పష్టం చేస్తుంది.
- source_word: ἔγραψεν
  choice: రాశాడు
  rationale: అనిర్దిష్ట భూతకాల సూచక రూపాన్ని సహజమైన తెలుగు సాధారణ భూతకాలంతో అందించాం.
theological_decisions:
- issue: యేసు గురించి మోషే ఇచ్చిన సాక్ష్యం స్వభావం
  choice: ఆయన నా గురించి రాశాడు
  alternative: ఆయన నన్ను గూర్చి రాశాడు
  rationale: మోషే రచనలు యేసు గురించి సాక్ష్యమిస్తున్నాయని వాక్యం చెబుతుంది; అయితే ఏ ప్రత్యేక భాగాన్ని ఉద్దేశించిందో లేదా ఆ సాక్ష్యపు పరిధి ఏమిటో అనువాదంలో అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని రెండు ἐπιστεύετε రూపాలకు ఒకే ‘నమ్ము’ క్రియను ఉంచి పదసంబంధాన్ని కాపాడాం. వాస్తవానికి విరుద్ధమైన షరతును ‘నమ్మి ఉంటే ... నమ్మేవారు’ నిర్మాణంతో వ్యక్తం చేశాం.
