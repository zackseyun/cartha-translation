id: JHN.5.1
reference: John 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: te
  text: ఈ సంగతుల తర్వాత యూదుల[a] పండుగ[b] ఒకటి వచ్చింది. అప్పుడు యేసు యెరూషలేముకు ఎక్కి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యోహాను రచనలో ఈ పదం కొన్ని సందర్భాల్లో ‘యూదయుల’ అని కూడా అర్థం కావచ్చు; ఇక్కడ యూద ప్రజల పండుగను సూచిస్తోంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఉత్సవం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: ఈ సంగతుల తర్వాత
  rationale: ταῦτα అనే బహువచన సూచనను నిలుపుతూ, యోహాను వాడిన కథన సంధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἦν
  choice: వచ్చింది
  rationale: పండుగ సందర్భం ఏర్పడిందనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; గ్రీకు అసంపూర్ణ భూతకాల రూపాన్ని కృత్రిమంగా అనుకరించదు.
- source_word: ἑορτὴ
  choice: పండుగ
  rationale: మతపరమైన ఉత్సవ సందర్భాన్ని సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా తెలియజేసే ప్రామాణిక తెలుగు పదం.
- source_word: τῶν Ἰουδαίων
  choice: యూదుల
  rationale: ఇక్కడ పండుగను ఆచరించే ప్రజలను సూచిస్తుంది; ప్రాంతీయమైన ‘యూదయులు’ కంటే ఈ సందర్భంలో ‘యూదులు’ సరిపోతుంది.
- source_word: ἀνέβη
  choice: ఎక్కి వెళ్లాడు
  rationale: యెరూషలేముకు ప్రయాణాన్ని ‘పైకి వెళ్లడం’గా చెప్పే గ్రీకు ప్రయోగంలోని దిశాభావాన్ని నిలుపుతుంది.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేము
  rationale: స్థలనామానికి తెలుగులో స్థిరపడిన రూపం.
theological_decisions:
- issue: యోహాను రచనలో Ἰουδαίων పదం సూచించే వర్గం
  choice: యూదుల
  alternative: యూదయుల
  rationale: ఈ వాక్యంలో పదం ఒక మతపరమైన పండుగతో సంబంధించి ఉంది; అందువల్ల ప్రాంత నివాసులకన్నా యూద ప్రజలను సూచించడం సందర్భానికి తగినది. అయితే యోహానులోని ఇతర సందర్భాల్లో ప్రాంతీయ అర్థం సాధ్యమని పాదటిప్పణి గుర్తిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘ఎక్కి వెళ్లాడు’ అనే రూపం యెరూషలేముకు పైకి వెళ్లే ప్రయాణ భావాన్ని నిలుపుతుంది.
