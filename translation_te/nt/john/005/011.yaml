id: JHN.5.11
reference: John 5:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: te
  text: 'అయితే అతడు వారికి ఇలా జవాబిచ్చాడు: “నన్ను బాగుచేసినవాడే నాతో, ‘నీ చాప ఎత్తుకొని నడువు’ అని చెప్పాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబిచ్చాడు
  rationale: యోహాను సంభాషణా కథనంలో సహజమైన, నేరుగా అర్థమయ్యే ప్రతిస్పందన క్రియ.
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: నన్ను బాగుచేసినవాడు
  rationale: ఆరోగ్యవంతునిగా చేసిన వ్యక్తిని సూచించే గ్రీకు విశేషణార్థక కృదంతాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὑγιῆ
  choice: బాగు
  rationale: ఈ స్వస్థత సందర్భంలో శారీరకంగా కోలుకున్న భావాన్ని సాధారణ తెలుగులో స్పష్టంగా ఇస్తుంది; పాఠ్యంలో లేని విస్తృత ఆధ్యాత్మిక భావాన్ని చేర్చదు.
- source_word: ἐκεῖνός
  choice: వాడే
  rationale: గ్రీకులోని ఉద్ఘాటనను తెలుగు ‘ఏ’ ప్రత్యయంతో సహజంగా నిలుపుతుంది.
- source_word: Ἆρον
  choice: ఎత్తుకొని
  rationale: పరుపును పైకెత్తి వెంట తీసుకెళ్లాలనే స్పష్టమైన కార్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: κράβαττόν
  choice: పరుపు
  rationale: సాధారణంగా నేలపై వేసుకొని పడుకునే చాప లేదా తేలికపాటి పడకను సూచిస్తుంది; ఆధునిక పెద్ద మంచం అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: περιπάτει
  choice: నడువు
  rationale: స్వస్థత ఆజ్ఞలో సరళమైన తెలుగు ఆజ్ఞారూపం; వర్తమాన ఆజ్ఞ యొక్క సంభావ్య కొనసాగింపు భావాన్ని సందర్భానికి మించి బలపరచదు.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి అభ్యంతరానికి ప్రతిస్పందనగా ఉన్న స్వల్ప వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: స్వస్థత వర్ణనలో సంభావ్య విస్తృత భావం
  choice: నన్ను బాగుచేసినవాడు
  alternative: నన్ను సంపూర్ణునిగా చేసినవాడు
  rationale: సందర్భం శారీరక స్వస్థతను నివేదిస్తుంది. ‘సంపూర్ణునిగా’ అనడం గ్రీకు తప్పనిసరిగా సూచించని విస్తృత ఆధ్యాత్మిక భావాన్ని కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ἐκεῖνός యొక్క ఉద్ఘాటనను ‘వాడే’ ద్వారా నిలిపాం. ఈ వచనానికి ఇచ్చిన ఆంగ్ల పాదసూచికలు ప్రధాన పాఠ్యంలోని గుర్తులతో సరిపోలకపోవడంతో, మూల గ్రీకు ఆధారంగా అవసరం లేని పాదసూచికలను చేర్చలేదు.
