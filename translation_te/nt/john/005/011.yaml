- from: 'అయితే అతడు వారికి ఇలా జవాబిచ్చాడు: “నన్ను బాగుచేసినవాడే నాతో, ‘నీ పరుపు ఎత్తుకొని నడువు’ అని చెప్పాడు.”'
  to: 'అయితే అతడు వారికి ఇలా జవాబిచ్చాడు: “నన్ను బాగుచేసినవాడే నాతో, ‘నీ చాప ఎత్తుకొని నడువు’ అని చెప్పాడు.”'
