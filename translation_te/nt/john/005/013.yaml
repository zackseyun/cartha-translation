  yaml_path: translation/nt/john/005/013.yaml
  text: But the man who had been healed did not know who he was[a], for Jesus had withdrawn, since there was a crowd in the place.
translation:
  language: te
  text: అయితే స్వస్థత పొందిన ఆ మనిషికి ఆయన ఎవరో తెలియదు. ఎందుకంటే ఆ స్థలంలో జనసమూహం ఉండగా యేసు అక్కడి నుంచి తప్పుకుని వెళ్లిపోయాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అక్కడి నుంచి జారుకున్నాడు,’ ‘నిశ్శబ్దంగా తప్పుకున్నాడు.’ గ్రీకు క్రియ యేసు జనసమూహంలో గుర్తింపుకు చిక్కకుండా అక్కడి నుంచి వెళ్లిపోయాడనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰαθεὶς
  choice: స్వస్థత పొందిన ఆ మనిషి
  rationale: ఆర్టికల్‌తో వచ్చిన ఏకవచన పుంలింగ కర్మణి భూతకాల అసమాపక క్రియను వ్యక్తిని సూచించే విధంగా అనువదించాం. ‘స్వస్థత పొందిన’ అనేది కర్మణి భావాన్నీ, ప్రధాన క్రియకు ముందే జరిగిన స్వస్థతనూ సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ ᾔδει
  choice: తెలియదు
  rationale: ఈ సందర్భంలో οἶδα క్రియకు సాధారణమైన, సహజమైన తెలుగు సమానం.
- source_word: τίς ἐστιν
  choice: ఆయన ఎవరో
  rationale: ఇది యేసు అనే వ్యక్తిని సూచిస్తోంది. పరోక్ష ప్రశ్నను తెలుగులో సహజంగా వ్యక్తపరుస్తూ, గ్రీకులోని వ్యక్తిగత సూచనను నిలుపుతుంది.
- source_word: ἐξένευσεν
  choice: ఎవరికీ కనిపించకుండా తప్పుకున్నాడు
  rationale: ἐκνεύω ఇక్కడ ఇతరుల దృష్టికి చిక్కకుండా అక్కడి నుంచి తప్పుకోవడం అనే భావాన్ని సూచిస్తుంది. ఈ ఎంపిక కేవలం ‘వెళ్లిపోయాడు’ అనే సాధారణ అర్థం కంటే ఆ నిశ్శబ్దమైన నిష్క్రమణ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ὄχλου ὄντος
  choice: జనసమూహం ఉండడంతో
  rationale: ఈ షష్ఠీ నిరపేక్ష నిర్మాణం కారణాన్ని లేదా తోడు పరిస్థితిని సూచించవచ్చు. వాక్యంలోని γάρ వివరణాత్మక సంబంధానికి అనుగుణంగా కారణార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరిచాం.
- source_word: ἐν τῷ τόπῳ
  choice: అక్కడ
  rationale: స్థలాన్ని సూచించే ఈ పదబంధానికి ‘అక్కడ’ సహజమైన తెలుగు రూపం; ‘ఆ స్థలంలో’ కంటే సాధారణ పాఠకులకు మరింత సరళంగా ఉంటుంది.
