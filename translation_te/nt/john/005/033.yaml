  text: You have sent to John[a], and he has testified to the truth.
translation:
  language: te
  text: మీరు యోహాను దగ్గరికి మనుషులను పంపారు; అతడు సత్యానికి సాక్ష్యమిచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సత్యం గురించి సాక్ష్యమిచ్చాడు.”
    reason: దత్తివిభక్తి సంబంధాన్ని తెలుగులో వ్యక్తపరచగల మరో సహజ రూపం.
lexical_decisions:
- source_word: ὑμεῖς
  choice: మీరు
  rationale: క్రియలోనే రెండవ పురుష బహువచనం ఉన్నప్పటికీ, ప్రత్యేకంగా వచ్చిన సర్వనామాన్ని ‘మీరు’ అని ఉంచడం ద్వారా మూలంలోని స్వల్ప ఉద్ఘాటన సహజంగా నిలుస్తుంది.
- source_word: ἀπεστάλκατε
  choice: మనుషులను పంపారు
  rationale: ఇది పూర్తయిన గత చర్యను సూచించే పరిపూర్ణ కాలరూపం. గ్రీకులో కర్మ సందర్భం వల్ల అధ్యాహారంగా ఉంది; తెలుగులో వాక్యం సహజంగా, స్పష్టంగా ఉండేందుకు సాధారణమైన ‘మనుషులను’ చేర్చబడింది. ఇది వారు పంపిన వారి హోదాను నిర్దిష్టం చేయదు.
- source_word: πρὸς Ἰωάννην
  choice: యోహాను దగ్గరికి
  rationale: వ్యక్తిని ఉద్దేశించి పంపడాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది. సందర్భంలోని వ్యక్తి బాప్తిస్మమిచ్చే యోహానే అయినా, మూలంలో ఉన్నట్లే ఇక్కడ ‘యోహాను’ అని మాత్రమే ఉంచబడింది.
- source_word: μεμαρτύρηκε
  choice: సాక్ష్యమిచ్చాడు
  rationale: న్యాయస్థాన లేదా సాక్షి భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది. గ్రీకు పరిపూర్ణ కాలంలోని కొనసాగుతున్న ప్రాసంగికతను సందర్భం తెలియజేస్తుంది; ‘సాక్ష్యమిచ్చి ఉన్నాడు’ వంటి రూపం అసహజంగా ఉంటుంది.
- source_word: τῇ ἀληθείᾳ
  choice: సత్యానికి
  rationale: μαρτυρέωతో వచ్చిన దత్తివిభక్తిని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది; నిర్దిష్ట భావాన్ని మరియు యోహాను రచనలో ‘సత్యం’కు ఉండగల భావగాంభీర్యాన్ని కాపాడుతుంది.
theological_decisions:
- issue: యోహాను రచనలో ‘సత్యం’ అనే పదం
  choice: సత్యానికి
  alternative: సత్యం గురించి
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం ఉన్నందున దీనిని కేవలం సాధారణ నిజాయితీగా పరిమితం చేయకుండా ‘సత్యం’గానే ఉంచాం. అదే సమయంలో దీనికి మరింత నిర్దిష్టమైన సిద్ధాంతార్థాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన శైలి. ‘మనుషులను’ అనేది గ్రీకులో అధ్యాహారంగా ఉన్న కర్మను తెలుగులో సహజంగా చేయడానికి చేర్చిన సందర్భసిద్ధ పదం; ‘దూతలను’ లేదా మతపరమైన హోదాను సూచించే పదాన్ని వాడలేదు.
