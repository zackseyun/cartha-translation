source:
  edition: SBLGNT
  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: te
  text: నేను నా తండ్రి పేరున వచ్చాను[a], కాని మీరు నన్ను స్వీకరించడం లేదు. మరొకడు తన సొంత పేరున వస్తే[b], అతణ్ణి మీరు స్వీకరిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా తండ్రి అధికారంతో.’ గ్రీకులో ‘పేరున’ అనే ప్రయోగం పేరును మాత్రమే కాక, ప్రాతినిధ్యాన్ని లేదా అధికారాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తన సొంత అధికారంతో.’ ఈ ప్రయోగం యేసు ‘నా తండ్రి పేరున’ రావడంతో గట్టి వ్యత్యాసాన్ని చూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: వచ్చాను
  rationale: గ్రీకు పరిపూర్ణ కాలం గతంలో రావడం వల్ల ఏర్పడిన ప్రస్తుత స్థితిని సూచిస్తుంది. తెలుగులో ‘వచ్చాను’ సహజంగా ఉండి, సందర్భంలో ఆ కొనసాగుతున్న ఫలితాన్ని వ్యక్తపరుస్తుంది.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: నా తండ్రి పేరున
  rationale: ‘పేరున’ అనే ప్రయోగం పేరు, ప్రాతినిధ్యం, అధికారం అనే భావవ్యాప్తిని నిలుపుతుంది; ‘అధికారంతో’ అని ప్రధాన పాఠంలో స్పష్టీకరించి భావాన్ని కుదించదు.
- source_word: οὐ λαμβάνετέ με
  choice: మీరు నన్ను స్వీకరించడం లేదు
  rationale: ఇక్కడ λαμβάνω భౌతికంగా తీసుకోవడం కాక, యేసును అంగీకరించడం లేదా ఆదరించడం అనే భావంలో ఉంది. ‘స్వీకరించడం’ ఈ రెండు ఛాయలనూ సహజంగా మోస్తుంది.
- source_word: ἄλλος
  choice: మరొకడు
  rationale: యేసుతో ఉన్న వ్యత్యాసాన్ని నిలుపుతూ, ఆ వ్యక్తి ఎవరనే అదనపు వ్యాఖ్యానాన్ని చేర్చని సరళమైన అనువాదం.
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: తన సొంత పేరున
  rationale: ‘నా తండ్రి పేరున’ అనే మొదటి ప్రయోగంతో ఉద్దేశపూర్వక సమాంతరతను, స్వయంగా తనకు తానే ఆధారమవుతున్న భావాన్ని నిలుపుతుంది.
- source_word: ἐκεῖνον λήμψεσθε
  choice: అతణ్ణి మీరు స్వీకరిస్తారు
  rationale: భవిష్యత్ క్రియను సహజంగా అనువదిస్తూ, ముందటి ‘స్వీకరించడం లేదు’తో ఉన్న వాక్చాతుర్యపూర్వక వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: πατρός μου
  choice: నా తండ్రి
  rationale: యోహాను సందర్భంలో ఇది దేవుణ్ణి సూచిస్తుంది. తెలుగులో ప్రత్యేక ఆంగ్ల capitalization భేదం లేనందున, అదనపు పదాలు చేర్చకుండా సందర్భమే ఆ దైవిక సూచనను తెలియజేయనివ్వబడింది.
theological_decisions:
- issue: ‘నా తండ్రి’ అనేది తండ్రియైన దేవుణ్ణి సూచిస్తుందని ప్రధాన పాఠంలో స్పష్టంగా చేర్చాలా
  choice: ‘నా తండ్రి’ అని మూలానికి సమీపంగా ఉంచడం
  alternative: ‘తండ్రియైన దేవుని’ అని విస్తరించడం
  rationale: యోహాను సందర్భంలో సూచన స్పష్టంగా ఉంది; ‘దేవుడు’ అని చేర్చడం మూలపాఠంలో లేని వివరణను ప్రధాన పాఠంలోకి తెస్తుంది.
- issue: ‘పేరున’ అనే ప్రయోగాలను ప్రధాన పాఠంలో అధికార భాషగా వ్యాఖ్యానించాలా
  choice: రెండు చోట్లా ‘పేరున’ అనే సమాంతర ప్రయోగాన్ని నిలుపడం
  alternative: ‘నా తండ్రి అధికారంతో’ / ‘తన సొంత అధికారంతో’
  rationale: గ్రీకు ప్రయోగంలో అధికారం, ప్రాతినిధ్యం రెండూ సూచింపబడవచ్చు. ‘పేరున’ అని ఉంచడం భావవ్యాప్తిని, రెండు భాగాల మధ్య గట్టి వ్యత్యాసాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. ‘పేరున’ అనే సహజమైన ధార్మిక-సామాన్య ప్రయోగం మూలంలోని సమాంతరతను నిలుపుతుంది. ‘స్వీకరించడం లేదు / స్వీకరిస్తారు’ అనే పునరుక్తి గ్రీకు వాక్యంలోని అలంకార వ్యత్యాసాన్ని ప్రతిబింబిస్తుంది.
