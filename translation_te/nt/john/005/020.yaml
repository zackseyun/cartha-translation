id: JHN.5.20
reference: John 5:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: te
  text: ఎందుకంటే తండ్రి కుమారుణ్ణి ప్రేమిస్తున్నాడు; తాను చేస్తున్నవన్నీ ఆయనకు చూపిస్తున్నాడు. వీటికంటే గొప్ప కార్యాలను కూడా ఆయనకు చూపిస్తాడు, మీరు ఆశ్చర్యపడేలా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అప్పుడు మీరు ఆశ్చర్యపడతారు.” గ్రీకులోని నిర్మాణం ఉద్దేశాన్ని సూచించవచ్చు; ఈ సందర్భంలో యేసు మాటలు వింటున్నవారికి కలిగే ఆశ్చర్యం అనే ఫలితాన్ని కూడా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: ప్రేమిస్తున్నాడు
  rationale: యోహాను వాడుకలో φιλέω వ్యక్తిగత అనురాగాన్ని సూచించగలిగినా ἀγαπάωతో అర్థపరంగా కలిసివస్తుంది. ప్రేమ తీవ్రతను తగ్గించే కృత్రిమ భేదం చేయకుండా సహజంగా ‘ప్రేమిస్తున్నాడు’ అని అనువదించాం.
- source_word: δείκνυσιν / δείξει
  choice: చూపిస్తున్నాడు / చూపిస్తాడు
  rationale: ఒకే గ్రీకు క్రియకు వర్తమాన, భవిష్యత్ రూపాల మధ్య ఉన్న పదబంధ సంబంధాన్ని నిలుపుతూ ప్రత్యక్షమైన తెలుగు సమానార్థకాన్ని వాడాం.
- source_word: πάντα
  choice: చేస్తున్నవన్నీ
  rationale: πάντα యొక్క సమగ్ర భావాన్ని, తరువాతి సంబంధవాచక వాక్యంతో కలిపి సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἃ αὐτὸς ποιεῖ
  choice: తాను చేస్తున్నవన్నీ
  rationale: αὐτός ఇచ్చే కర్తృ ఉద్ఘాటనను ‘తాను’ ద్వారా, ποιεῖ యొక్క కొనసాగుతున్న క్రియాభావాన్ని ‘చేస్తున్న’ ద్వారా నిలిపాం. సందర్భంలో ‘తాను’ తండ్రినే సూచిస్తుంది.
- source_word: μείζονα τούτων ... ἔργα
  choice: వీటికంటే గొప్ప కార్యాలను
  rationale: ἔργα కు యోహాను సువార్తలో ఉన్న ప్రాముఖ్యతను నిలుపుతూ ‘కార్యాలు’ అని, తులనాత్మక నిర్మాణాన్ని సహజంగా ‘వీటికంటే గొప్ప’ అని ఇచ్చాం.
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: మీరు ఆశ్చర్యపడేలా
  rationale: ἵνα + subjunctive లోని ఉద్దేశం/ఫలితం మధ్యనున్న భావ విస్తృతిని పూర్తిగా ఒక వైపుకు మళ్లించకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది; బహువచన ‘మీరు’ను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: φιλέω ద్వారా వ్యక్తమయ్యే తండ్రి ప్రేమ స్వభావం
  choice: కేవలం ‘ప్రేమిస్తున్నాడు’ అని అనువదించడం
  alternative: ‘మమకారం కలిగి ఉన్నాడు’ లేదా ప్రేమను తక్కువ స్థాయిగా వినిపించే పదబంధం
  rationale: యోహానులో φιλέω, ἀγαπάω పదాలు అర్థపరంగా కలిసివస్తాయి. మూలపాఠం కోరని ప్రేమ-స్థాయి భేదాన్ని ప్రవేశపెట్టకుండా తండ్రి-కుమారుల సన్నిహిత సంబంధాన్ని నిలుపుతుంది.
- issue: ἵνα ὑμεῖς θαυμάζητε యొక్క ఉద్దేశం/ఫలిత భావం
  choice: ‘మీరు ఆశ్చర్యపడేలా’
  alternative: ‘మీరు తప్పక ఆశ్చర్యపడతారు గనుక’ లేదా కేవలం ‘మీరు ఆశ్చర్యపడేందుకు’
  rationale: ἵνα తో వచ్చిన subjunctive ఉద్దేశాన్ని వ్యక్తం చేయగలదు; సందర్భంలో కలిగే ఫలితమైన ఆశ్చర్యాన్నీ సూచించవచ్చు. ప్రధాన అనువాదం ఈ రెండింటి మధ్యనున్న మూలభాషా సౌలభ్యాన్ని కాపాడుతుంది; ప్రత్యామ్నాయ ఫలిత భావాన్ని పాదటీపులో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘తండ్రి’, ‘కుమారుడు’, ‘కార్యాలు’ వంటి యోహాను సువార్తలో ప్రాధాన్యమున్న పదాలను నిలిపాం. ప్రధాన వాక్యంలో ఉద్దేశం/ఫలితం మధ్యనున్న గ్రీకు అస్పష్టతను సహజంగా ఉంచి, ప్రత్యామ్నాయ భావాన్ని పాదటీపులో ఇచ్చాం.
