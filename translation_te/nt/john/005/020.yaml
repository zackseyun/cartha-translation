review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the Father’s love for the Son, the comprehensive and ongoing disclosure of what the Father himself does, the future disclosure of greater works, and the address to the plural audience. The purpose/result nuance of ἵνα ὑμεῖς θαυμάζητε is retained. A small syntactic revision places the purpose/result clause after the future verb, matching the Greek connection more transparently.
  naturalness: The Telugu is modern and clear. Keeping the final clause directly after “చూపిస్తాడు” produces a smoother sentence and makes its syntactic relation immediately clear. The footnote’s “కాబట్టి” can sound causally stronger than the Greek; a predictive-result alternative is more suitable.
  terminology: ‘తండ్రి,’ ‘కుమారుడు,’ ‘ప్రేమిస్తాడు,’ and ‘కార్యాలు’ are appropriate, natural Johannine terminology. ‘చూపిస్తాడు’ consistently represents the δείκνυσιν/δείξει wordplay without adding interpretive force.
  issues:
  - severity: low
    issue: The main clause is split before the purpose/result clause.
    rationale: Although the meaning remains correct, placing “మీరు ఆశ్చర్యపడేలా” after “చూపిస్తాడు” follows the Greek syntax and improves Telugu flow.
  - severity: low
    issue: The footnote alternative begins with “కాబట్టి.”
    rationale: “కాబట్టి” may imply a causal inference. The alternative concerns a possible result/predictive sense of ἵνα with the subjunctive, better expressed as “అప్పుడు మీరు ఆశ్చర్యపడతారు.”
  revised_text: ఎందుకంటే తండ్రి కుమారుణ్ణి ప్రేమిస్తున్నాడు; తాను చేస్తున్నవన్నీ ఆయనకు చూపిస్తున్నాడు. వీటికంటే గొప్ప కార్యాలను కూడా ఆయనకు చూపిస్తాడు, మీరు ఆశ్చర్యపడేలా.[a]
