source:
  edition: SBLGNT
  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: te
  text: మీరు లేఖనాలను పరిశోధిస్తున్నారు, ఎందుకంటే వాటిలో మీకు నిత్యజీవం ఉందని మీరు అనుకుంటున్నారు.[a] అవే నా గురించి సాక్ష్యమిచ్చేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, Ἐραυνᾶτε అనే గ్రీకు రూపాన్ని సూచనార్థకంగా కాక ఆజ్ఞార్థకంగా తీసుకుంటే, “లేఖనాలను పరిశోధించండి.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: మీరు ... పరిశోధిస్తున్నారు
  rationale: ఈ రూపం సూచనార్థకంగానూ ఆజ్ఞార్థకంగానూ ఉండగలదు. సందర్భంలో వారి ప్రస్తుత ఆచరణను వర్ణించే సూచనార్థక భావం సహజంగా సరిపోతుంది; ఆజ్ఞార్థక భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: τὰς γραφάς
  choice: లేఖనాలను
  rationale: యోహాను సందర్భంలో ఇది ఇశ్రాయేలు పవిత్ర లేఖనాలను సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు వాడుకలో ‘లేఖనాలు’ సహజమైన, గౌరవప్రదమైన పదం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: వారు లేఖనాలను పరిశోధించడానికి కారణాన్ని తెలిపే కారణార్థక అన్వయాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: δοκεῖτε
  choice: మీరు అనుకుంటున్నారు
  rationale: వారి నమ్మకం లేదా ఊహను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, వాక్యంలోని స్వల్ప విమర్శాత్మక ధోరణిని అతిశయింపజేయదు.
- source_word: ἐν αὐταῖς
  choice: వాటిలో
  rationale: లేఖనాలలోనే నిత్యజీవం ఉందనే వారి భావాన్ని గ్రీకు ἐν యొక్క స్థానార్థంతో నేరుగా నిలుపుతుంది.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవం
  rationale: యోహాను రచనల్లోని స్థిరమైన భావప్రయోగానికి తెలుగు క్రైస్తవ వాడుకలో స్పష్టమైన, సుపరిచితమైన సమానార్థకం.
- source_word: ἐκεῖναί
  choice: అవే
  rationale: స్త్రీలింగ బహువచన సూచన సర్వనామం ముందున్న లేఖనాలను తిరిగి సూచిస్తుంది; ‘అవే’ గ్రీకులోని ఉద్ఘాటనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αἱ μαρτυροῦσαι
  choice: సాక్ష్యమిచ్చేవి
  rationale: యోహాను రచనలో ముఖ్యమైన న్యాయసాక్ష్య భావాన్ని నిలుపుతూ, లేఖనాలకు అన్వయించే సహజమైన తెలుగు రూపం.
- source_word: περὶ ἐμοῦ
  choice: నా గురించి
  rationale: περί + షష్ఠీ విభక్తి యొక్క ‘నా గూర్చి/నా గురించి’ అనే భావాన్ని ఆధునిక సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: Ἐραυνᾶτε యొక్క క్రియాభావం
  choice: 'సూచనార్థకం: ‘మీరు లేఖనాలను పరిశోధిస్తున్నారు’'
  alternative: 'ఆజ్ఞార్థకం: ‘లేఖనాలను పరిశోధించండి’'
  rationale: గ్రీకు రూపం రెండు విధాలుగా అర్థమవుతుంది. తరువాతి కారణార్థక వాక్యభాగం వారి ప్రస్తుత లేఖన పరిశోధనను వివరించడం, అలాగే తరువాతి వచనాల్లో యేసు వారి వైఫల్యాన్ని ఎత్తిచూపడం వల్ల సూచనార్థకం సందర్భానికి మెరుగ్గా సరిపోతుంది. అయినప్పటికీ నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘పరిశోధిస్తున్నారు’ లేఖనాలను శ్రద్ధగా పరిశీలించే భావాన్ని ఇస్తుంది. గ్రీకు వాక్యంలోని ఉద్ఘాటనను ‘అవే’ ద్వారా నిలిపాం.
