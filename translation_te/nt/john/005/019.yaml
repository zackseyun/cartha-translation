id: JHN.5.19
reference: John 5:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: te
  text: 'కాబట్టి యేసు వారికి ఇలా జవాబిచ్చాడు: “నిజంగా, నిజంగా మీతో చెబుతున్నాను: కుమారుడు తనంతట తాను ఏమీ చేయలేడు; తండ్రి చేయడాన్ని చూడకపోతే తప్ప చేయలేడు. ఎందుకంటే ఆయన ఏమి చేసినా, వాటినే కుమారుడు కూడా అదే విధంగా చేస్తాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: కాబట్టి యేసు వారికి ఇలా జవాబిచ్చాడు
  rationale: οὖν యొక్క సందర్భానుసారమైన అనుసంధానాన్ని ‘కాబట్టి’ తెలియజేస్తుంది. ἀπεκρίνατο καὶ ἔλεγεν అనే గ్రీకు వాక్యనిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో ‘ఇలా జవాబిచ్చాడు’గా అందించాం; అసంపూర్ణ భూతకాల రూపాన్ని కృత్రిమంగా పొడిగించలేదు.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: నిజంగా, నిజంగా మీతో చెబుతున్నాను
  rationale: రెట్టించిన Ἀμὴν యొక్క గంభీరమైన ఉద్ఘాటనను నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే తెలుగు వాడాం.
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδέν
  choice: కుమారుడు తనంతట తాను ఏమీ చేయలేడు
  rationale: οὐ δύναται లోని సామర్థ్యార్థాన్ని ‘చేయలేడు’ స్పష్టంగా వ్యక్తం చేస్తుంది; ἀφ’ ἑαυτοῦ లోని స్వతంత్ర మూలం లేదా చర్య భావాన్ని ‘తనంతట తాను’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: తండ్రి ఏదైనా చేయడం చూస్తేనే చేస్తాడు
  rationale: ἐὰν μή యొక్క మినహాయింపు/పరిమితి భావాన్ని ‘చూస్తేనే’ తెలియజేస్తుంది. τι లోని అనిర్దిష్టతను ‘ఏదైనా’గా నిలిపాం; తెలుగులో అవసరమైన ప్రధాన క్రియను ‘చేస్తాడు’గా సహజంగా పూరించాం.
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: ఎందుకంటే ఆయన ఏమేమి చేస్తాడో
  rationale: సంబంధవాచక రూపం మరియు ἄν కలిగించే సాధారణ, విస్తృత భావాన్ని ‘ఏది చేసినా’ అనే భావానికి సమీపంగా ‘ఏమేమి చేస్తాడో’ అందిస్తుంది. ἐκεῖνος సూచించే తండ్రిని గౌరవప్రదమైన ‘ఆయన’తో సూచించాం.
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: వాటినే కుమారుడు కూడా అదే విధంగా చేస్తాడు
  rationale: ταῦτα యొక్క ప్రతిస్పందనాత్మక బలాన్ని ‘వాటినే’, καί ని ‘కూడా’, ὁμοίως ని ‘అదే విధంగా’ ద్వారా నిలిపాం.
theological_decisions:
- issue: కుమారుని అసమర్థత/ఆధారిత చర్యను ఎలా వ్యక్తం చేయాలి
  choice: కుమారుడు తనంతట తాను ఏమీ చేయలేడు
  alternative: కుమారుడు స్వయంగా ఏమీ చేయడు
  rationale: మూలంలోని οὐ δύναται సామర్థ్య భాషను నేరుగా నిలుపుతూ, దాన్ని కేవలం ఇష్టం లేదా చొరవ లేకపోవడంగా మార్చలేదు. అదే సమయంలో వాక్యం తండ్రి కార్యంతో కుమారుని విడదీయలేని అనుసరణను తెలిపేలా సందర్భాన్ని యథాతథంగా ఉంచాం; అంతస్తు సంబంధమైన తీర్మానాన్ని అనువాదంలో చేర్చలేదు.
- issue: ὁ υἱός మరియు ὁ πατήρ యొక్క బిరుదాత్మక వాడుక
  choice: కుమారుడు / తండ్రి
  alternative: కొడుకు / తండ్రి
  rationale: యోహాను సందర్భంలో ఇవి యేసు మరియు దేవుని ప్రత్యేక సంబంధాన్ని సూచించే బిరుదులు. తెలుగు లిపిలో పెద్ద అక్షర భేదం లేకపోవడంతో, గౌరవప్రదమైన మరియు స్థిరమైన పదప్రయోగమే ఆ బిరుదాత్మక భావాన్ని మోస్తుంది.
- issue: తండ్రి చేసే కార్యాలన్నిటినీ కుమారుడు అదే విధంగా చేయడం
  choice: ఆయన ఏమేమి చేస్తాడో, వాటినే కుమారుడు కూడా అదే విధంగా చేస్తాడు
  alternative: తండ్రి చేసేదాన్ని కుమారుడు అనుకరిస్తాడు
  rationale: ‘అనుకరిస్తాడు’ అనేది మూలంలో లేని కేవలం బాహ్య నమూనా-అనుసరణ భావాన్ని కలిగించవచ్చు. మూలంలోని సంపూర్ణ కార్యసామ్యాన్ని ఎలాంటి అదనపు సిద్ధాంత వివరణ లేకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడాం. ‘నిజంగా, నిజంగా’ అనే రెట్టింపును యోహాను సువార్తలోని గంభీర ఉద్ఘాటన కోసం ఉద్దేశపూర్వకంగా నిలిపాం. మూలంలోని భావ ఉద్రిక్తతను ప్రధాన వాక్యంలోనే ఉంచి, పాదసూచికలో పరిమిత సందర్భ వివరణ మాత్రమే ఇచ్చాం.
