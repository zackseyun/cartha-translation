id: JHN.5.25
reference: John 5:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: te
  text: '“నిజంగా, నిజంగా[a] నేను మీతో చెబుతున్నాను: ఒక గడియ[b] వస్తోంది, అది ఇప్పుడే ఉంది కూడా; ఆ గడియలో మృతులు[c] దేవుని కుమారుని స్వరాన్ని వింటారు, విన్నవారు[d] జీవిస్తారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత మూలరూపానుసారంగా, “ఆమేన్, ఆమేన్” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘గడియ’ని విస్తృతార్థంలో ‘సమయం’ అని కూడా అర్థం చేసుకోవచ్చు; అయితే గ్రీకులో ప్రత్యేకంగా ‘గడియ’ అనే పదమే ఉంది.
    reason: lexical_alternative
  - marker: c
    text: ‘మృతులు’ అనే మాటకు ఇక్కడ వర్తమాన ఆత్మీయ భావం ఉండవచ్చు—‘ఇప్పుడే ఉంది’ అనే మాట దాన్ని సూచిస్తుంది—అదే సమయంలో చుట్టుపక్కల సందర్భం శారీరక పునరుత్థానాన్ని కూడా ముందుగా సూచిస్తుంది.
    reason: cross_reference
  - marker: d
    text: లేదా, “వినేవారు జీవిస్తారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: గంభీరమైన నొక్కిచెప్పే పునరుక్తిని నిలుపుతూ, ఆధునిక తెలుగు పాఠకులకు వెంటనే అర్థమయ్యే సహజమైన రూపాన్ని వాడింది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, యోహాను వాక్యశైలిలోని గంభీరతను నిలుపుతుంది.
- source_word: ἔρχεται ὥρα
  choice: ఒక గడియ రాబోతోంది
  rationale: నిర్దేశకపదం లేని ὥραను ‘ఒక గడియ’గా అనువదించి, యోహాను సువార్తలో దానికి ఉన్న ప్రాముఖ్యాన్ని ‘సమయం’ అని సాధారణీకరించకుండా కాపాడింది.
- source_word: καὶ νῦν ἐστιν
  choice: అది ఇప్పుడే ఉంది
  rationale: రాబోయే గడియ ఇప్పటికే ఉందనే వర్తమాన–భవిష్యత్ ఉద్విగ్నతను వ్యాఖ్యానించి తొలగించకుండా నిలుపుతుంది.
- source_word: οἱ νεκροὶ
  choice: మృతులు
  rationale: శారీరక మరణం లేదా ఆత్మీయ మరణం అనే ఏ ఒక్క భావానికీ పరిమితం చేయకుండా మూలంలోని విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: స్వరం వింటారు
  rationale: వ్యక్తికి చెందిన φωνήను సహజంగా ‘స్వరం’గా, ἀκούωను స్పందనను అదనంగా సూచించని ‘వింటారు’గా అందిస్తుంది.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: దేవుని కుమారుని
  rationale: మూలంలోని సంపూర్ణ క్రీస్తు సంబంధ బిరుదును నేరుగా, సాంప్రదాయబద్ధంగా నిలుపుతుంది.
- source_word: οἱ ἀκούσαντες
  choice: వినేవారు
  rationale: భవిష్యత్ ఫలితాన్ని తెలిపే సందర్భంలో సహజమైన తెలుగు రూపం; అఓరిస్ట్ కృదంతంలోని ‘విన్నవారు’ అనే సాధ్యమైన కాలసూచనను పాదసూచికలో ఉంచింది.
- source_word: ζήσουσιν
  choice: జీవిస్తారు
  rationale: ζάω యొక్క సాధారణ అర్థాన్ని నిలుపుతూ, ‘తిరిగి బ్రతుకుతారు’ అని అనువదించి శారీరక పునరుత్థాన భావాన్ని మాత్రమే ముందుకు తేవదు.
theological_decisions:
- issue: ‘మృతులు’ అనే పదం సూచించే వారు
  choice: ‘మృతులు’ అని మాత్రమే ఉంచి, వర్తమాన ఆత్మీయ జీవప్రాప్తి మరియు భవిష్యత్ శారీరక పునరుత్థానం మధ్య ఉన్న భావ ఉద్విగ్నతను నిలిపింది.
  alternative: ‘ఆత్మీయంగా చనిపోయినవారు’ లేదా ‘శారీరకంగా చనిపోయినవారు’ అని స్పష్టీకరించడం.
  rationale: ‘ఇప్పుడే ఉంది’ అనే మాట వర్తమాన పార్శ్వాన్ని సూచిస్తుండగా, యోహాను 5 పరిసర సందర్భం శారీరక పునరుత్థానాన్ని కూడా సూచిస్తుంది; అనువాదం ఈ రెండింటిలో ఒక్కదానికే భావాన్ని పరిమితం చేయకూడదు.
- issue: ‘దేవుని కుమారుడు’ అనే క్రీస్తు సంబంధ బిరుదు
  choice: ‘దేవుని కుమారుడు’ అనే బిరుదును ప్రధాన పాఠ్యంలో యథార్థంగా నిలిపింది.
  alternative: వ్యాఖ్యాత్మకమైన అదనపు క్రీస్తు సంబంధ పదాలను చేర్చడం.
  rationale: ఇది గ్రీకు మూలాన్ని నేరుగా ప్రతిబింబిస్తుంది; పాఠ్యంలో లేని మతశాఖాపరమైన వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘నిజంగా, నిజంగా’ అనే పునరుక్తి యోహాను శైలిని నిలుపుతుంది. ‘అది ఇప్పుడే ఉంది’ కొద్దిగా సంక్షిప్తమైన గంభీర రూపంగా ఉంచి, మూలంలోని సాకారమైన వర్తమానం–రాబోయే భవిష్యత్తు ఉద్విగ్నతను కాపాడింది.
