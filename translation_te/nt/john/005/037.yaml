translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ఆయనే’ ద్వారా మూలంలోని ఉద్ఘాటనను సహజంగా నిలిపాం; ‘రూపం’ ద్వారా మూలపదంలోని ఉద్దేశపూర్వక అర్థవిస్తృతిని కాపాడాం. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర కామాను ఉంచాం.
