language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν πρὸς τὸν πατέρα· ἔστιν ὁ κατηγορῶν ὑμῶν Μωϋσῆς, εἰς ὃν ὑμεῖς ἠλπίκατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: te
  text: “తండ్రి ఎదుట నేనే మీపై అభియోగం మోపుతానని అనుకోకండి.[a] మీపై అభియోగం మోపేవాడు ఒకడు ఉన్నాడు—ఎవరిలో మీరు ఆశ ఉంచారో ఆ మోషేయే.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తండ్రి ఎదుట నేనే మీపై ఆరోపణ చేస్తానని అనుకోకండి.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, వారు ఆశ ఉంచిన మోషేనే, ధర్మశాస్త్రంతో సంబంధించి, వారిపై అభియోగం మోపేవాడిగా నిలుస్తాడు.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: అనుకోకండి
  rationale: నిషేధార్థక వర్తమాన ఆజ్ఞను సహజమైన, నేరుగా హెచ్చరించే ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατηγορήσω
  choice: నేరం మోపుతాను
  rationale: న్యాయస్థాన సంబంధమైన ‘ఆరోపించడం/అభియోగం మోపడం’ అనే భావాన్ని కాపాడుతుంది; ‘దోషిగా తీర్పు తీరుస్తాను’ అని అతిగా అనువదించదు.
- source_word: πρὸς τὸν πατέρα
  choice: తండ్రి ఎదుట
  rationale: ఆరోపణ సందర్భంలో πρός సూచించే తండ్రి సన్నిధిని సహజమైన న్యాయపరమైన తెలుగులో తెలియజేస్తుంది; యోహాను సువార్తలోని ‘తండ్రి’ అనే బిరుదును నిలుపుతుంది.
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: మీ మీద నేరం మోపేవాడు ఒకడు ఉన్నాడు
  rationale: మరొక ఆరోపకుణ్ణి పరిచయం చేసే గ్రీకు నిర్మాణాన్నీ, వర్తమాన కృదంతంలోని కొనసాగుతున్న భావాన్నీ సహజంగా అందిస్తుంది.
- source_word: Μωϋσῆς
  choice: మోషే
  rationale: తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే వ్యక్తినామ రూపం.
- source_word: εἰς ὃν
  choice: అతని మీదే
  rationale: ఆశను ఒక వ్యక్తిపై ఉంచడాన్ని నేరుగా వ్యక్తం చేస్తుంది; ‘మోషే ధర్మశాస్త్రం మీద’ లేదా ‘అతని రచనల మీద’ అనే వ్యాఖ్యానాన్ని మూలపాఠ్యంలోకి చేర్చదు. ‘ఏ’ నొక్కు వ్యంగ్యభరితమైన వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἠλπίκατε
  choice: మీరు ఆశ పెట్టుకున్నారు
  rationale: పరిపూర్ణ కాలంలోని గత చర్యతో కొనసాగుతున్న స్థితిని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు పలికిన మాటలోని న్యాయపరమైన ఆరోపణ భావం
  choice: ‘నేరం మోపుతాను’ అని అనువదించడం
  alternative: ‘మిమ్మల్ని దోషులుగా తీర్పు తీరుస్తాను’
  rationale: κατηγορέω ఆరోపణ చేయడాన్ని సూచిస్తుంది, తుది దోషనిర్ణయాన్ని కాదు. అందువల్ల మూలపాఠ్యంలోని న్యాయపరమైన రూపకాన్ని కాపాడుతూ మరింత బలమైన సిద్ధాంతార్థాన్ని చేర్చలేదు.
- issue: మోషే మీద ఉంచిన ఆశకు సంబంధించిన సూచన
  choice: ‘అతని మీదే మీరు ఆశ పెట్టుకున్నారు’ అని వ్యక్తిని నేరుగా పేర్కొనడం
  alternative: ‘మోషే ధర్మశాస్త్రం మీద’ లేదా ‘మోషే రచనల మీద’
  rationale: విస్తృత సందర్భంలో మోషే రచనలు ఉద్దేశంలో ఉన్నప్పటికీ, గ్రీకు పాఠ్యం మోషేనే నేరుగా పేర్కొంటుంది. ఆ ఉద్రిక్తతను ప్రధాన వాక్యంలో అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘నేరం మోపడం’ ద్వారా న్యాయపరమైన భావం నిలుపబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
