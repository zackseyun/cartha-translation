lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకు వర్తమాన కాలం యోహాను కథనంలో చారిత్రక వర్తమానంగా వాడబడింది. తెలుగులో సహజమైన కథన శైలికి భూతకాల రూపమైన ‘అన్నాడు’ అనుకూలం; ‘అంటున్నాడు’ ఇక్కడ కృత్రిమంగా వినిపించవచ్చు.
- source_word: αὐτῷ
  choice: అతనితో
  rationale: దత్తివాచక పరోక్ష కర్మను తెలుగులో సహజంగా ‘అతనితో’ అని వ్యక్తపరుస్తుంది.
- source_word: Ἔγειρε
  choice: లేచి
  rationale: ἐγείρω ఆజ్ఞారూపం పడుకొని ఉన్న స్థితి నుంచి వెంటనే లేవమనే భావాన్ని ఇస్తుంది. తరువాతి ఆజ్ఞలతో సహజంగా కలవడానికి తెలుగు అసమాపక రూపం ‘లేచి’ వాడబడింది; దాని ఆజ్ఞాబలం చివరి ‘నడువు’తో కొనసాగుతుంది.
- source_word: ἆρον
  choice: ఎత్తుకొని
  rationale: αἴρω ఇక్కడ పరుపును పైకెత్తి తనతో తీసుకెళ్లే భౌతిక చర్యను సూచిస్తుంది. ‘ఎత్తుకొని’ ఈ రెండు భావాలను సహజంగా అందిస్తుంది.
- source_word: κράβαττόν
  choice: పరుపు
  rationale: κράβαττος తేలికగా మోసుకెళ్లగల సాధారణ పడుకునే చాప లేదా పక్కను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పరుపు’ విస్తృతంగా అర్థమవుతుంది; అయితే అది పూర్తి మంచం అని తప్పుగా భావించకుండా పాదసూచిక వివరిస్తుంది.
- source_word: περιπάτει
  choice: నడువు
  rationale: περιπατέω ఇక్కడ రూపకాలంకారంగా కాక శారీరకంగా నడవడాన్ని సూచిస్తుంది. ‘నడువు’ నేరమైన, సహజమైన ఆజ్ఞారూపం.
theological_decisions:
- issue: స్వస్థత సందర్భంలో యేసు ఇచ్చిన ఆజ్ఞ స్వభావం
  choice: లేవడం, పరుపు ఎత్తుకోవడం, నడవడం అనే చర్యలను నేరుగా ఆజ్ఞాపించినట్లే అనువదించబడింది.
  alternative: ‘లేచి స్వస్థత పొందు’ వంటి స్వస్థతను స్పష్టంగా చేర్చిన విస్తృత అనువాదం.
  rationale: ఈ వచనంలోని గ్రీకు పాఠం మూడు భౌతిక చర్యలనే ఆజ్ఞాపిస్తుంది. స్వస్థత భావం సందర్భంలో స్పష్టమైనప్పటికీ, ఈ వచనంలో పదబద్ధంగా లేదు; కాబట్టి దానిని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు కథన సంప్రదాయానికి అనుగుణంగా భూతకాలంలో ఇచ్చాం. వరుస ఆజ్ఞలను ‘లేచి… ఎత్తుకొని… నడువు’ అనే సహజ తెలుగు నిర్మాణంలో ఉంచాం; ఆజ్ఞాబలం తగ్గదు.
