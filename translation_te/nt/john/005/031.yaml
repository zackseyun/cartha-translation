  text: Ἐὰν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἡ μαρτυρία μου οὐκ ἔστιν ἀληθής·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/031.yaml
  text: If I testify about myself[a], my testimony is not true.
translation:
  language: te
  text: “నా గురించి నేనే సాక్ష్యమిస్తే, నా సాక్ష్యం సత్యమైనది కాదు.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా సాక్ష్యం చెల్లుబాటు కాదు.” సాక్షుల న్యాయపరమైన సందర్భాన్ని బట్టి ఈ భావం సాధ్యమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: …ఇస్తే
  rationale: గ్రీకు షరతును సహజమైన తెలుగు షరతార్థక క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: ἐγὼ
  choice: నేనే
  rationale: గ్రీకులోని స్పష్టమైన సర్వనామం ఇచ్చే స్వల్ప ఉద్ఘాటనను తెలుగులో ‘నేనే’ సహజంగా నిలుపుతుంది.
- source_word: μαρτυρῶ
  choice: సాక్ష్యమిస్తే
  rationale: సాక్షి/న్యాయ సందర్భాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: περὶ ἐμαυτοῦ
  choice: నా గురించి
  rationale: περί + సంబంధ విభక్తి యొక్క నేరమైన ‘గురించి’ అనే అర్థాన్ని ఇస్తుంది; ‘నా పక్షంగా’ అనే అదనపు న్యాయార్థాన్ని చేర్చదు.
- source_word: ἡ μαρτυρία μου
  choice: నా సాక్ష్యం
  rationale: μαρτυρῶతో ఉన్న మూలపద సంబంధాన్ని నిలుపుతూ, సాక్ష్యాధార భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἔστιν ἀληθής
  choice: సత్యమైనది కాదు
  rationale: ἀληθής యొక్క నేరమైన సత్యార్థాన్ని నిలుపుతుంది; దానిని కేవలం న్యాయపరమైన చెల్లుబాటుగా పరిమితం చేయదు.
theological_decisions:
- issue: యేసు తన సాక్ష్యం ‘సత్యమైనది కాదు’ అని చెప్పడంలోని భావం
  choice: ‘నా సాక్ష్యం సత్యమైనది కాదు’ అని నేరుగా అనువదించడం
  alternative: ‘నా సాక్ష్యం చెల్లుబాటు కాదు’
  rationale: ἀληθής అనే గ్రీకు పదంలోని ‘సత్యమైన’ భావాన్ని ప్రధాన పాఠ్యంలో నిలిపి, యోహాను 8:14తో కనిపించే ఉద్రిక్తతను అనువాదంలోనే పరిష్కరించకుండా ఉంచుతుంది. సాక్షుల న్యాయపరమైన సందర్భంలో ‘చెల్లుబాటు కాదు’ అనేది సాధ్యమైన వివరణ; అందుకే దాన్ని పాదటిప్పణిలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘నేనే’ ద్వారా గ్రీకు ἐγὼ యొక్క ఉద్ఘాటనను, ‘సాక్ష్యం’ ద్వారా న్యాయ/సాక్షి సందర్భాన్ని నిలిపాం.
