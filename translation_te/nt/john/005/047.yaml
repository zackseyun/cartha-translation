  text: εἰ δὲ τοῖς ἐκείνου γράμμασιν οὐ πιστεύετε, πῶς τοῖς ἐμοῖς ῥήμασιν πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: te
  text: అయితే మీరు ఆయన రాసినవాటిని నమ్మకపోతే, నా మాటలను ఎలా నమ్ముతారు?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: అయితే ... నమ్మకపోతే
  rationale: δέ యొక్క వ్యతిరేక భావాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది; εἰతో కూడిన షరతు తెలుగులో ‘నమ్మకపోతే’ అనే రూపంలో వ్యక్తమవుతుంది.
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: ఆయన రాసినవాటిని
  rationale: γράμματα ఇక్కడ అక్షరాలు లేదా వ్యక్తిగత ఉత్తరాలు కాక, ముందరి సందర్భంలో మోషే రాసిన విషయాలను సూచిస్తుంది. ‘రాసినవాటిని’ అనేది భావాన్ని స్పష్టంగా ఉంచుతూ ‘లేఖనాలు’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: οὐ πιστεύετε
  choice: నమ్మకపోతే
  rationale: ఇక్కడ πιστεύω రాసిన సాక్ష్యాన్ని నిజమని అంగీకరించడాన్ని సూచిస్తుంది. తెలుగు షరతు నిర్మాణంలో వర్తమాన నిరాకరణ సహజంగా ఈ రూపంలో వస్తుంది.
- source_word: πῶς
  choice: ఎలా
  rationale: తరువాతి విశ్వాసం ఎలా సాధ్యమవుతుందనే అలంకారిక ప్రశ్నను నేరుగా నిలుపుతుంది.
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: నా మాటలను
  rationale: ῥήματα పలికిన మాటలను సూచిస్తుంది; ‘మాటలు’ సహజమైన తెలుగు పదం, మోషే రాసినవాటితో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: πιστεύσετε
  choice: నమ్ముతారు
  rationale: భవిష్యత్ సూచనను తెలుగు ప్రశ్నలో ‘నమ్ముతారు?’ సహజంగా వ్యక్తం చేస్తుంది; మొదటి πιστεύω రూపంతో పదసామ్యాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἐκείνου (‘ఆయన’) ఎవరిని సూచిస్తుంది
  choice: తక్షణ సందర్భానుసారం మోషేను సూచించే ‘ఆయన’
  alternative: ప్రధాన వాక్యంలో ‘మోషే’ అని స్పష్టంగా పునరుక్తి చేయడం
  rationale: యోహాను 5:45–46లో మోషే స్పష్టమైన పూర్వపదం. గ్రీకు వాక్యంలోని సర్వనామ సంబంధాన్ని కాపాడేందుకు ప్రధాన పాఠ్యంలో ‘ఆయన’ ఉంచబడింది.
- issue: πιστεύω యొక్క భావం
  choice: రెండు చోట్లా ‘నమ్ము’
  alternative: ‘విశ్వసించు’ లేదా ‘నమ్మకం ఉంచు’
  rationale: ఈ సందర్భంలో మోషే రాసిన సాక్ష్యాన్నీ యేసు మాటలనూ నిజమని అంగీకరించడం ప్రధానంగా ఉంది. ఒకే క్రియను రెండుసార్లు వాడటం మూలంలోని అలంకారిక సమాంతరతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘ఆయన రాసినవాటిని’ అనేది ‘ఆయన లేఖలను’ అనే అపార్థాన్ని నివారిస్తుంది; సందర్భం మోషే రచనలను స్పష్టపరుస్తున్నందున అదనపు పాదటిప్పణి అవసరం లేదు.
