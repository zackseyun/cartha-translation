id: JHN.5.7
reference: John 5:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: te
  text: 'ఆ రోగి ఆయనకు ఇలా జవాబిచ్చాడు: “ప్రభువా, నీళ్లు కదిలినప్పుడు నన్ను కొలనులో దింపడానికి నాకు ఎవరూ లేరు. నేను వెళ్తుండగానే మరొకడు నాకంటే ముందుగా దిగిపోతున్నాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: ఆ రోగి
  rationale: అనారోగ్యంతో ఉన్న వ్యక్తిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριε అనే సంబోధనకు సాధారణంగా ఉన్న ‘ప్రభువు/యజమాని’ భావాన్ని నిలుపుతుంది; సందర్భంలోని గౌరవాన్నీ, సాధ్యమైన క్రీస్తుసంబంధ ప్రతిధ్వనినీ ముందుగానే పరిమితం చేయదు.
- source_word: βάλῃ με εἰς τὴν κολυμβήθραν
  choice: నన్ను కొలనులో దింపడానికి
  rationale: βάλῃ యొక్క అక్షరార్థం ‘వేయడం’ అయినా, కదలలేని రోగిని నీటిలోకి చేర్చే సందర్భంలో ‘దింపడం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἐν ᾧ δὲ ἔρχομαι ἐγώ
  choice: నేను వెళ్తుండగానే
  rationale: అతడు కొలను వైపు చేరడానికి ప్రయత్నిస్తున్న సమయంలోనే మరొకడు ముందుగా దిగుతున్నాడనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: καταβαίνει
  choice: దిగిపోతున్నాడు
  rationale: కొలనులోకి దిగడాన్ని సూచించే మూలపదపు దిశాత్మక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Κύριε అనే సంబోధనలోని భావపరిధి
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ఈ పదం మర్యాదపూర్వక సంబోధనగానూ ‘ప్రభువు’ అనే బిరుదుగానూ అర్థమవుతుంది. ‘ప్రభువా’ మూలపదానికి నేరుగా సరిపోతూ యోహాను సువార్తలో ఉండగల ఉద్దేశపూర్వక భావతీవ్రతను తొలగించదు; అయితే ఈ రోగి యేసు స్వరూపాన్ని అప్పటికే పూర్తిగా గుర్తించాడని అనువాదం నిర్బంధించదు.
- issue: నీళ్లు కదలడానికి కారణం
  choice: కారణాన్ని పేర్కొనకుండా ‘నీళ్లు కదిలినప్పుడు’
  alternative: దేవదూత నీళ్లను కదిలించినప్పుడు
  rationale: SBLGNT లోని ఈ వచనం నీళ్లు కదలడానికి కారణాన్ని చెప్పదు. అందువల్ల తరువాతి పాఠాంతర సంప్రదాయంలోని వివరణను ఇక్కడ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణంతో, సంభాషణకు తగిన గౌరవభరిత శైలిని ఉపయోగించాం.
