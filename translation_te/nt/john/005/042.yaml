source:
  edition: SBLGNT
  text: ἀλλὰ ἔγνωκα ὑμᾶς ὅτι τὴν ἀγάπην τοῦ θεοῦ οὐκ ἔχετε ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: te
  text: 'కానీ, నాకు మీ గురించి తెలుసు: మీలో దేవుని ప్రేమ లేదు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత స్పష్టంగా, “మీలో దేవునిపట్ల ప్రేమ లేదు” అని కూడా అనువదించవచ్చు. గ్రీకు మాటను విస్తృతంగా “దేవుని నుండి వచ్చే ప్రేమ” లేదా “దేవుడు చూపే ప్రేమ” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: కాని
  rationale: ముందటి సందర్భానికి బలమైన వ్యతిరేకతను సహజంగా సూచిస్తుంది.
- source_word: ἔγνωκα
  choice: నేను ఎరిగాను
  rationale: పరిపూర్ణకాల రూపంలోని స్థిరమైన, అనుభవపూర్వక జ్ఞాన భావాన్ని తెలుగులో గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: ὑμᾶς
  choice: మిమ్మల్ని
  rationale: బహువచన ప్రత్యక్ష కర్మను స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: ὅτι
  choice: ':'
  rationale: యేసు వారిని గురించి ఎరిగిన విషయాన్ని తరువాతి వాక్యంగా సహజంగా పరిచయం చేస్తుంది.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: దేవుని ప్రేమ
  rationale: గ్రీకు షష్ఠీ విభక్తిలో ఉన్న ‘దేవునిపట్ల ప్రేమ’ లేదా ‘దేవుని నుండి వచ్చే/దేవునికి చెందిన ప్రేమ’ అనే సాధ్యమైన భావాలను నిర్ణయించకుండా నిలుపుతుంది.
- source_word: οὐκ ἔχετε
  choice: లేదు
  rationale: వారిలో ఆ ప్రేమ ప్రస్తుతం లేదనే కొనసాగుతున్న స్థితిని సహజమైన తెలుగులో తెలుపుతుంది.
- source_word: ἐν ἑαυτοῖς
  choice: మీలో
  rationale: వారి అంతరంగంలో లేదా వారిలోనే ఆ ప్రేమ లేకపోవడాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘దేవుని ప్రేమ’ అనే షష్ఠీ విభక్తి సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘దేవుని ప్రేమ’ అని సందిగ్ధతను నిలిపాం.
  alternative: ‘దేవునిపట్ల ప్రేమ’; లేదా ‘దేవుని నుండి వచ్చే ప్రేమ/దేవుడు చూపే ప్రేమ’
  rationale: τοῦ θεοῦ సందర్భంలో ప్రధానంగా దేవునిపట్ల ప్రేమను సూచించవచ్చు; అయినా మూలంలోని వ్యాకరణ నిర్మాణం ప్రేమకు దేవుడు కర్తా, మూలమా, లక్ష్యమా అన్నదాన్ని పూర్తిగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఎరిగాను’ అనేది సాధారణ ‘తెలుసు’ కంటే మూలంలోని పరిపూర్ణకాల జ్ఞానభావాన్ని కొంత బలంగా అందిస్తుంది; మిగిలిన వాక్యం సరళంగా ఉంచబడింది.
