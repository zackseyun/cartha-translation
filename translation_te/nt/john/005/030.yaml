id: JHN.5.30
reference: John 5:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: te
  text: “నా అంతట నేనే ఏమీ చేయలేను. నేను వినినట్లుగా తీర్పు తీరుస్తాను, నా తీర్పు న్యాయమైనది; ఎందుకంటే నేను నా సొంత చిత్తాన్ని కోరను, నన్ను పంపినవాని చిత్తాన్నే కోరుతాను.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ δύ́ναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: నా అంతట నేనే ఏమీ చేయలేను
  rationale: తెలుగులో సహజంగా ఉండటంతో పాటు, ἀπ’ ἐμαυτοῦ సూచించే స్వతంత్రంగా లేదా తన నుంచే కార్యం చేయడమనే భావాన్ని నిలుపుతుంది. ఇది కేవలం ఒంటరిగా చేయడాన్ని సూచించదు.
- source_word: καθὼς ἀκούω
  choice: నేను విన్న ప్రకారమే
  rationale: వినడానికి, తీర్పు తీర్చడానికి మధ్య ఉన్న అనుగుణతను καθὼς ప్రకారం స్పష్టంగా వ్యక్తం చేస్తుంది. సాధారణంగా కొనసాగుతున్న క్రియను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: κρίνω / ἡ κρίσις ἡ ἐμὴ
  choice: తీర్పు తీరుస్తాను / నా తీర్పు
  rationale: రెండు గ్రీకు పదాల న్యాయసంబంధమైన అనుసంధానాన్ని తెలుగులోనూ నిలుపుతుంది.
- source_word: δικαία
  choice: న్యాయమైనది
  rationale: తీర్పు సందర్భంలో సరైనదీ నిష్పక్షపాతమైనదీ అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν
  choice: నేను నా సొంత చిత్తాన్ని ... నెరవేర్చాలని చూడను
  rationale: ζητῶ ఇక్కడ లక్ష్యంగా పెట్టుకోవడం లేదా సాధించాలని చూడడం అనే భావంలో ఉంది; ‘నా సొంత’ అనేది గ్రీకులోని బలమైన స్వామ్య సూచనను నిలుపుతుంది.
- source_word: ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με
  choice: నన్ను పంపినవాని చిత్తాన్ని నెరవేర్చాలని చూస్తాను
  rationale: పంపిన వ్యక్తిని ‘తండ్రి’ అని విస్తరించకుండా గ్రీకు సంబంధవాచక వర్ణనను నిలుపుతుంది; తెలుగులో వాక్యార్థం సంపూర్ణంగా ఉండేందుకు ζητῶ భావాన్ని ‘నెరవేర్చాలని చూస్తాను’గా వ్యక్తం చేసింది.
theological_decisions:
- issue: ἀπ’ ἐμαυτοῦలో కుమారుని కార్యానికి పంపినవానితో ఉన్న సంబంధం
  choice: నా అంతట నేనే
  alternative: నా నుంచే; నా సొంతగా
  rationale: సంపూర్ణ సామర్థ్యలేమిని సిద్ధాంతపరంగా నిర్ణయించకుండా, స్వతంత్ర మూలంగా కార్యం చేయకపోవడాన్ని తెలియజేస్తుంది; మూలంలోని ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- issue: δικαία పదానికి న్యాయసంబంధ సందర్భంలో అనువాదం
  choice: న్యాయమైనది
  alternative: నీతిగలది; సరైనది
  rationale: κρίσιςతో కలిసి ఉన్నప్పుడు న్యాయబద్ధత, సరైన తీర్పు అనే భావం ప్రధానంగా ఉండటం వల్ల ఈ ఎంపిక సహజంగా, సందర్భోచితంగా ఉంది.
- issue: ζητῶ τὸ θέλημα భావం
  choice: చిత్తాన్ని నెరవేర్చాలని చూస్తాను
  alternative: చిత్తాన్ని వెదుకుతాను; చిత్తాన్ని కోరుతాను
  rationale: ఇక్కడ ζητέω అనేది ఒక చిత్తాన్ని కనుగొనడానికి వెదకడం కంటే దానిని లక్ష్యంగా పెట్టుకోవడాన్ని సూచిస్తుంది. అయితే ‘చిత్తం’ అనే పదాన్ని ఉంచి మూలంలోని సంకల్ప సంబంధ భావాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘చిత్తం,’ ‘తీర్పు’ వంటి యోహాను సువార్తలో ప్రాముఖ్యమైన పదాలను నిలుపుతూ, వాక్య నిర్మాణాన్ని సహజంగా చేసింది.
