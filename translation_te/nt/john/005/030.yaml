revisions:
- from: “నా అంతట నేనే ఏమీ చేయలేను. నేను విన్న ప్రకారమే తీర్పు తీరుస్తాను; నా తీర్పు న్యాయమైనది. ఎందుకంటే నేను నా సొంత చిత్తాన్ని కాదు, నన్ను పంపినవాని చిత్తాన్ని నెరవేర్చాలని చూస్తాను.[a]”
  to: “నా అంతట నేనే ఏమీ చేయలేను. నేను వినినట్లుగా తీర్పు తీరుస్తాను, నా తీర్పు న్యాయమైనది; ఎందుకంటే నేను నా సొంత చిత్తాన్ని కోరను, నన్ను పంపినవాని చిత్తాన్నే కోరుతాను.”
  rationale: The revision replaces the interpretive expansion ‘నెరవేర్చాలని చూస్తాను’ with ‘కోరను/కోరుతాను,’ preserving the repeated ζητῶ and the Greek contrast without importing an additional action. It also adjusts the hearing clause to represent the present-general sense more clearly. The remaining wording is retained because it is accurate, natural, and appropriately formal.
  reviewer_model: gpt-5.6-terra
