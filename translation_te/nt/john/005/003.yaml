revisions:
- from: వీటిలో అనారోగ్యంతో ఉన్నవారు—గుడ్డివారు, కుంటివారు, అవయవాలు వడలిపోయినవారు[a]—అనేకమంది పడి ఉండేవారు.
  to: వీటిలో అనారోగ్యంతో ఉన్న అనేకమంది—చూపులేనివారు, కుంటివారు, అవయవాలు క్షీణించినవారు[a]—పడి ఉండేవారు.
  rationale: The revision improves modern Telugu flow and idiom while preserving the Greek’s collective description and the ambiguity of ξηρῶν. It neither imports the omitted longer pool tradition nor treats paralysis as an unequivocal lexical meaning.
