translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. వ్యక్తులను వారి పరిస్థితితో పూర్తిగా సమీకరించకుండా ‘అనారోగ్యంతో ఉన్నవారు’ అనే వ్యక్తికేంద్రీకృత రూపాన్ని వాడుతూ, జాబితాలోని పదాలను సంక్షిప్తంగా ఉంచింది.
