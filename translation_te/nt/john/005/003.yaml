  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ταύταις κατέκειτο ⸀πλῆθος τῶν ἀσθενούντων, τυφλῶν, χωλῶν, ⸀ξηρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/003.yaml
  text: In these lay a multitude of the sick[a], blind, lame, and paralyzed.
translation:
  language: te
  text: వీటిలో అనారోగ్యంతో ఉన్న అనేకమంది—చూపులేనివారు, కుంటివారు, అవయవాలు క్షీణించినవారు[a]—పడి ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పక్షవాతంతో బాధపడేవారు.” గ్రీకు పదానికి అక్షరార్థంగా “ఎండిపోయినవారు” లేదా “వాడిపోయినవారు” అని అర్థం; బహుశా వాడి క్షీణించిన అవయవాలు ఉన్నవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις
  choice: వీటిలో
  rationale: స్త్రీలింగ బహువచన సూచనాపదం ముందటి వచనంలో చెప్పిన మంటపాలను సూచిస్తుంది. మూలంలో లేని నామవాచకాన్ని చేర్చకుండా సందర్భ సంబంధాన్ని నిలుపుతుంది.
- source_word: κατέκειτο
  choice: పడి ఉండేవారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొంతకాలంగా అక్కడ పడివున్న స్థితిని సూచిస్తుంది. తెలుగులో సమూహంలోని వ్యక్తులకు అనుగుణమైన బహువచనం సహజంగా ఉంటుంది.
- source_word: πλῆθος
  choice: అనేకమంది
  rationale: పెద్ద సంఖ్యలో ఉన్న ప్రజలను సూచించే సమూహార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τῶν ἀσθενούντων
  choice: అనారోగ్యంతో ఉన్నవారు
  rationale: ఇక్కడ ἀσθενέω శారీరక అనారోగ్యం లేదా బలహీనతను సూచిస్తుంది; నైతిక బలహీనత అనే అపార్థం రాకుండా ఈ రూపం స్పష్టంగా ఉంటుంది.
- source_word: τυφλῶν
  choice: గుడ్డివారు
  rationale: చూపులేని వ్యక్తులను సూచించే ప్రత్యక్షమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: χωλῶν
  choice: కుంటివారు
  rationale: నడవడంలో శారీరక వైకల్యం ఉన్నవారనే χωλός అర్థాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ξηρῶν
  choice: అవయవాలు వడలిపోయినవారు
  rationale: ξηρός యొక్క అక్షరార్థమైన ‘ఎండిన/వడలిన’ భావాన్ని, శరీర సందర్భంలో క్షీణించి పనికిరాని అవయవాల సూచనగా నిలుపుతుంది; ‘పక్షవాతం వచ్చినవారు’ అని ఖచ్చితంగా నిర్ణయించదు.
