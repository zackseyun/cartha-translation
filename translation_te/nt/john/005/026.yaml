- from: ఎందుకంటే, తండ్రి తనలో తానే జీవం[a] కలిగి ఉన్నట్లే, కుమారుడు కూడా తనలో తానే జీవం కలిగి ఉండడానికి ఆయన అనుగ్రహించాడు[b].
  to: ఎందుకంటే, తండ్రి తనలోనే జీవం[a] కలిగి ఉన్నట్లే, కుమారుడు కూడా తనలోనే జీవం కలిగి ఉండేలా తండ్రి అనుగ్రహించాడు[b].
  rationale: The revision explicitly identifies the Father as the one who granted this, matching the Greek syntax and avoiding pronoun ambiguity. It uses the natural repeated Telugu phrase తనలోనే for ἐν ἑαυτῷ and corrects the potentially misleading technical expression in the note. No theological conclusion beyond the wording of the verse is introduced.
