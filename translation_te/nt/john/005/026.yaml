  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: te
  text: ఎందుకంటే, తండ్రి తనలోనే జీవం[a] కలిగి ఉన్నట్లే, కుమారుడు కూడా తనలోనే జీవం కలిగి ఉండేలా తండ్రి అనుగ్రహించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తనలోనే జీవం’ అనే మాటను, తన స్వంత అస్తిత్వంలో అంతర్గతంగా జీవం కలిగి ఉండడం అని అర్థం చేసుకోవచ్చు. మూలంలోని మాటలను నిలపడానికి ‘స్వతస్సిద్ధ జీవం’ వంటి వేదాంత సంక్షిప్త పదాన్ని ఉపయోగించలేదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇచ్చాడు.’ గ్రీకు క్రియకు సాధారణ అర్థం ‘ఇచ్చాడు’; ప్రసాదించిన ప్రత్యేకతను సహజమైన తెలుగులో తెలియజేయడానికి ప్రధాన పాఠ్యంలో ‘అనుగ్రహించాడు’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ఎందుకంటే ... ఉన్నట్లే
  rationale: γάρ తెలిపే వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో, ὥσπερ తెలిపే పోలికను ‘ఉన్నట్లే’తో సహజమైన తెలుగులో నిలిపింది.
- source_word: ὁ πατὴρ
  choice: తండ్రి
  rationale: యోహాను సందర్భంలో దేవునిని సూచించే నిర్దిష్ట బిరుదును సరళంగా అనువదించింది.
- source_word: ἔχει ζωὴν
  choice: జీవం కలిగి ఉన్నాడు
  rationale: వర్తమానకాల ప్రకటనను, ἔχω యొక్క సాధారణ అర్థాన్ని అదనపు వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: ζωὴν ἐν ἑαυτῷ
  choice: తనలో తానే జీవం
  rationale: ἐν ἑαυτῷ అనే పదబంధాన్ని స్పష్టంగా ఉంచి, ‘స్వయంభవ జీవం’ వంటి సాంకేతిక వేదాంత పదాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని భావగాంభీర్యాన్ని నిలిపింది.
- source_word: οὕτως καὶ
  choice: కుమారుడు కూడా
  rationale: ὥσπερ…οὕτως అనే పరస్పర పోలికను వాక్య నిర్మాణంలో కొనసాగిస్తూ καί భావాన్ని ‘కూడా’తో తెలిపింది.
- source_word: τῷ υἱῷ
  choice: కుమారుడు ... కలిగి ఉండడానికి
  rationale: గ్రీకులోని దత్త విభక్తి మరియు అనుబంధ క్రియారూపాన్ని సహజమైన తెలుగు ఉపవాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: ἔδωκεν
  choice: అనుగ్రహించాడు
  rationale: సాధారణ ‘ఇచ్చాడు’ అనే అర్థాన్ని నిలుపుతూ, ఇక్కడ ప్రసాదించబడిన ప్రత్యేక హక్కు లేదా సామర్థ్యాన్ని సహజంగా వ్యక్తపరుస్తుంది; భూతకాల భావం అలాగే ఉంది.
- source_word: ζωὴν ἔχειν
  choice: జీవం కలిగి ఉండడానికి
  rationale: అనంత క్రియారూపాన్ని తెలుగులో సహజమైన ఉద్దేశ్య/పూరక నిర్మాణంతో అందిస్తుంది.
- source_word: ἐν ἑαυτῷ
  choice: తనలో తానే
  rationale: తండ్రి, కుమారుడు ఇద్దరి విషయంలోనూ ఒకే పదబంధాన్ని పునరావృతం చేసి మూలంలోని సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: ἐν ἑαυτῷ అనే పదబంధాన్ని ‘స్వయంసత్త’ లేదా ‘స్వయంభవ జీవం’ అని సాంకేతికంగా వివరించాలా?
  choice: ‘తనలో తానే జీవం’ అనే మూలానికి దగ్గరైన పదబంధాన్ని ఉంచడం
  alternative: ‘స్వయంభవ జీవం’ లేదా ‘తనంతట తానే ఉనికిగల జీవం’
  rationale: ఈ వచనం అంతర్గతమైన జీవాన్ని సూచించినప్పటికీ, సాంకేతిక వేదాంత పదం మూలంలోని ἐν ἑαυτῷ కంటే ఎక్కువ వివరణను జోడిస్తుంది. కాబట్టి మూలంలోని భావ ఉద్రిక్తతను అలాగే ఉంచింది.
- issue: తండ్రి కుమారునికి ‘ఇచ్చాడు’ అనే భాషను ఎలా నిలపాలి?
  choice: ‘అనుగ్రహించాడు’ అని అనువదించి, కుమారుడు తనలో తానే జీవం కలిగి ఉండడానికి తండ్రి ప్రసాదించాడనే వాక్య నిర్మాణాన్ని నిలపడం
  alternative: ‘ఇచ్చాడు’
  rationale: ἔδωκεν స్పష్టంగా ఇవ్వడాన్ని సూచిస్తుంది. అనువాదం దానిని తగ్గించకూడదు; అదే సమయంలో కుమారుని దైవత్వం గురించిన అదనపు సిద్ధాంత వివరణను ప్రధాన పాఠ్యంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించింది. ‘తనలో తానే’ అనే పునరుక్తి తెలుగులో సహజంగా ఉండటంతో పాటు గ్రీకు మూలంలోని తండ్రి–కుమారుల సమాంతరతను స్పష్టంగా నిలుపుతుంది.
