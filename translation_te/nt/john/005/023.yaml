id: JHN.5.23
reference: John 5:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: te
  text: అందరూ తండ్రిని గౌరవించినట్లే కుమారుణ్ణి కూడా గౌరవించేలా. కుమారుణ్ణి గౌరవించనివాడు, ఆయనను పంపిన తండ్రిని గౌరవించడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: గౌరవించాలి
  rationale: ἵνα తెలిపే ఉద్దేశం/ఫలిత భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి విధ్యర్థక క్రియారూపాన్ని వాడాం; ముందటి వాక్యంతో అనుసంధానమైన ‘అందరూ ... గౌరవించాలి’ అనే భావం నిలుస్తుంది.
- source_word: πάντες
  choice: అందరూ
  rationale: వ్యక్తులందరినీ సూచించే నామవాచక ప్రయోగానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: గౌరవించాలి / గౌరవించనివాడు / గౌరవించడు
  rationale: τιμάω యొక్క ‘తగిన గౌరవం ఇవ్వడం’ అనే భావాన్ని నిలుపుతూ, గ్రీకులోని పదపునరుక్తిని తెలుగులో కూడా ‘గౌరవించు’ అనే ఒకే మూలక్రియతో కాపాడాం.
- source_word: τὸν υἱὸν
  choice: కుమారుణ్ణి
  rationale: యోహాను సందర్భంలో ఇది యేసును సూచించే సంబంధపదం/బిరుదు. తెలుగు బైబిలు శైలికి అనుగుణంగా గౌరవప్రదమైన ‘కుమారుడు’ రూపాన్ని ఎంచుకున్నాం.
- source_word: καθὼς
  choice: తండ్రిని గౌరవించినట్లే
  rationale: ‘అలాగే/ఏ విధంగా ... అదే విధంగా’ అనే బలమైన పోలికను ‘-ినట్లే’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸν πατέρα
  choice: తండ్రిని / తండ్రిని
  rationale: ఈ సందర్భంలో దేవుణ్ణి వ్యక్తిగత సంబంధపదంగా సూచించే ‘తండ్రి’ సహజమైన సమానం.
- source_word: ὁ μὴ τιμῶν
  choice: గౌరవించనివాడు
  rationale: గ్రీకు సార్వత్రిక substantival participle భావాన్ని సంక్షిప్తమైన తెలుగు సంబంధకృదంత రూపం సహజంగా తెలియజేస్తుంది; ఇది ఏ వ్యక్తికైనా వర్తించే సాధారణ ప్రకటన.
- source_word: τὸν πέμψαντα αὐτόν
  choice: ఆయనను పంపిన తండ్రిని
  rationale: కృదంత పదబంధాన్ని తెలుగులో సహజమైన విశేషణ కృదంతంగా ఉంచాం. సమీపంలోని ‘కుమారుడు’నే ‘ఆయన’ సూచిస్తుంది.
- source_word: πέμψαντα
  choice: పంపిన
  rationale: πέμπω యొక్క సాధారణ అర్థమైన ‘పంపు’ను నేరుగా నిలిపాం; ‘నియమించి పంపు’ వంటి అదనపు భావాన్ని చేర్చలేదు.
theological_decisions:
- issue: కుమారుణ్ణి గౌరవించడానికీ తండ్రిని గౌరవించడానికీ మధ్య పోలిక బలం
  choice: ‘తండ్రిని గౌరవించినట్లే కుమారుణ్ణి కూడా’ అని అనువదించాం.
  alternative: ‘తండ్రిని గౌరవించిన విధంగా కుమారుణ్ణి’ లేదా కేవలం ‘తండ్రిలాగే’ అని అనువదించడం.
  rationale: καθὼς తెలిపే సమాంతర గౌరవాన్ని ‘-ినట్లే ... కూడా’ స్పష్టంగా నిలుపుతుంది. ఇది పోలికను బలహీనపరచదు; అలాగే తరువాతి సిద్ధాంత పరిభాషను వాక్యంలోకి చేర్చదు.
- issue: ‘కుమారుడు’, ‘తండ్రి’ పదాల బిరుదు స్వభావం
  choice: యేసు మరియు దేవుని తండ్రిని సూచించే సందర్భోచిత సంబంధపదాలుగా ‘కుమారుడు’, ‘తండ్రి’ వాడాం.
  alternative: సాధారణ కుటుంబ సంబంధాలను సూచించే పదాలుగా గ్రహించడం.
  rationale: గ్రీకు సందర్భంలో నిర్దిష్ట వ్యక్తులైన కుమారుడు, తండ్రి ఉద్దేశించబడ్డారు. తెలుగు లిపిలో ఆంగ్లంలాంటి capitalization భేదం లేకపోవడంతో సందర్భమే ఈ బిరుదు స్వభావాన్ని తెలియజేస్తుంది.
- issue: ἵνα యొక్క ఉద్దేశం లేదా ఫలిత ఛాయ
  choice: తెలుగు విధ్యర్థక ‘గౌరవించాలి’ రూపంతో రెండింటికీ అనుకూలంగా భావాన్ని వ్యక్తం చేశాం.
  alternative: ‘అందరూ ... గౌరవించేందుకు’ అని స్పష్టమైన ఉద్దేశార్థక ఉపవాక్యంగా అనువదించడం.
  rationale: ఈ వచనం ముందు వాక్యంపై ఆధారపడింది. విడిగా ఇచ్చిన వచనంలో ‘గౌరవించేందుకు’ అసంపూర్ణంగా వినిపిస్తుంది; ‘గౌరవించాలి’ ఉద్దేశ/ఆశించిన ఫలితాన్ని సహజంగా అందిస్తుంది, అయితే కారణ సంబంధాన్ని అతిగా నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘కుమారుడు’, ‘తండ్రి’, ‘గౌరవించు’ వంటి గంభీరమైన యోహానీయ పదజాలం నిలుపబడింది. మూలంలోని పునరుక్తి మరియు రెండు వాక్యాల సమాంతరత సాధ్యమైనంతవరకు కాపాడబడ్డాయి.
