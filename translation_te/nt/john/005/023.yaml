revisions:
- from: అందరూ తండ్రిని గౌరవించినట్లే కుమారుణ్ణి కూడా గౌరవించాలి. కుమారుణ్ణి గౌరవించనివాడు ఆయనను పంపిన తండ్రిని గౌరవించడు.
  to: అందరూ తండ్రిని గౌరవించినట్లే కుమారుణ్ణి కూడా గౌరవించేలా. కుమారుణ్ణి గౌరవించనివాడు, ఆయనను పంపిన తండ్రిని గౌరవించడు.
  rationale: The revision changes only the first clause’s verbal form, replacing the obligation nuance with a Telugu purpose-clause expression corresponding to ἵνα. The comparison, repeated honor terminology, generic negated participle, and the Father’s sending of the Son remain intact.
