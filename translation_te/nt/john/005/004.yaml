id: JHN.5.4
reference: John 5:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἄγγελος γὰρ κατὰ καιρὸν κατέβαινεν ἐν τῇ κολυμβήθρᾳ, καὶ ἐτάρασσεν τὸ ὕδωρ· ὁ οὖν πρῶτος ἐμβὰς μετὰ τὴν ταραχὴν τοῦ ὕδατος, ὑγιὴς ἐγίνετο, ᾧ δήποτε κατείχετο νοσήματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: te
  text: ఎందుకంటే, ఒక దేవదూత అప్పుడప్పుడు ఆ కొలనులోకి దిగివచ్చి నీటిని కదిలించేవాడు. నీరు కదిలిన తర్వాత అందరికంటే ముందుగా కొలనులో దిగినవాడు, తాను ఏ వ్యాధితో బాధపడుతున్నా, స్వస్థత పొందేవాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం (3వ వచనం చివరి భాగంతో పాటు) అత్యంత ప్రాచీన గ్రీకు పపైరస్ ప్రతుల్లో—ఉదాహరణకు మూడవ శతాబ్దానికి చెందిన పపైరస్ 66, పపైరస్ 75—మరియు నాలుగవ శతాబ్దపు ముఖ్య ప్రతులైన సీనైటికస్, వాటికానస్‌లలో లేదు. బైజాంటైన్ అధికసంఖ్యాక పాఠ సంప్రదాయంలోను, ప్రాచీన లాటిన్ మరియు సిరియాక్ అనువాదాల్లోను ఇది ఉంది. వికలాంగులు ఆ కొలను దగ్గర ఎందుకు కూడి ఉండేవారో వివరించడానికి లేఖకులు తొలి కాలంలో చేర్చిన భాగంగా అనేకమంది పండితులు దీనిని భావిస్తారు.
    reason: textual_critical
  - marker: b
    text: లేదా, ‘స్వస్థుడయ్యేవాడు.’
    reason: translation_alternative
lexical_decisions:
- source_word: κατὰ καιρὸν
  choice: అప్పుడప్పుడు
  rationale: నిర్దిష్ట కాలపట్టికను కాకుండా, కాలానుగుణంగా లేదా కొన్నిసార్లు జరిగే చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κατέβαινεν
  choice: దిగివచ్చి…కదిలించేవాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే అలవాటుగా పునరావృతమైన చర్యను ‘-ేవాడు’ రూపం స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἐτάρασσεν
  choice: కదిలించేవాడు
  rationale: నీటిని కలవరపరచడం లేదా కదలించడం అనే భావాన్ని సందర్భానుగుణంగా సహజంగా అందిస్తుంది.
- source_word: ὁ πρῶτος ἐμβὰς
  choice: అందరికంటే ముందుగా అందులో దిగినవాడు
  rationale: πρῶτος లోని మొదటి వ్యక్తి అనే తులనాత్మక భావాన్ని స్పష్టంగా ఉంచుతూ, కొలనులో ప్రవేశించడాన్ని సహజ తెలుగులో తెలుపుతుంది.
- source_word: ὑγιὴς ἐγίνετο
  choice: స్వస్థత పొందేవాడు
  rationale: అసంపూర్ణ భూతకాలంలోని పునరావృత ఫలితాన్ని తెలుగులో ‘పొందేవాడు’ ద్వారా నిలుపుతుంది.
- source_word: ᾧ δήποτε κατείχετο νοσήματι
  choice: తనను పట్టివున్న వ్యాధి ఏదైనా
  rationale: κατέχω యొక్క ‘పట్టివుండు’ రూపకాన్ని నిలుపుతూ, ఏ రకమైన వ్యాధైనా అనే విస్తృత భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దేవదూత నీటిని కదిలించడం చారిత్రక వాస్తవమా లేక అక్కడి ప్రజల నమ్మకానికి వివరణా
  choice: మూలపాఠంలో ఉన్నట్లే నేరుగా వర్ణించడం
  alternative: ‘ప్రజల నమ్మకం ప్రకారం’ అని చేర్చడం
  rationale: గ్రీకు పాఠం ఆ పరిమితిని పేర్కొనదు; దానిని చేరిస్తే మూలంలోని వాక్య స్వరాన్ని వ్యాఖ్యానాత్మకంగా మార్చినట్లవుతుంది.
- issue: ఈ వచనపు పాఠాంతర స్థితి
  choice: ప్రధాన పాఠంలో అనువదించి, [a]లో ముఖ్యమైన ప్రతుల ఆధారాన్ని వివరించడం
  alternative: వచనాన్ని ప్రధాన పాఠం నుండి తొలగించడం లేదా కేవలం కోష్ఠకాల్లో ఉంచడం
  rationale: అందించిన మూల సంచిక బైజాంటైన్ పాఠంలో ఈ వచనం ఉంది; అయితే అత్యంత ప్రాచీన గ్రీకు సాక్ష్యాల్లో లేమిని పాఠకునికి పారదర్శకంగా తెలియజేయాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘స్వస్థత పొందేవాడు’ బైబిలు సందర్భానికి తగినదైనా అతిగా ప్రాచీనంగా లేదు. గ్రీకు అసంపూర్ణ భూతకాలంలోని పునరావృత చర్యను ‘దిగివచ్చి…కదిలించేవాడు’, ‘పొందేవాడు’ రూపాలతో నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
