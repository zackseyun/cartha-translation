review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the doubled affirmation, hearing and believing, present possession of eternal life, and the completed passage from death to life. However, it omits the explicit adversative force of ἀλλά (‘but’) before the final clause. The generic plural is acceptable Telugu, though the verbal wording can be made more idiomatic.
  naturalness: ‘తీర్పులోకి రారు’ is understandable but somewhat literal and less natural in modern Telugu. ‘తీర్పుకు గురికారు’ conveys the expression idiomatically without forcing κρίσις to mean condemnation. ‘నిత్యజీవం కలిగివున్నారు’ is grammatical but heavier than the natural ‘నిత్యజీవం ఉంది.’
  terminology: ‘నిత్యజీవం,’ ‘తీర్పు,’ ‘మరణం,’ and ‘జీవం’ appropriately preserve established Johannine terminology. The footnote appropriately retains the lexical ambiguity of κρίσις; ‘శిక్షావిధి’ is best expressed as ‘శిక్షాత్మక తీర్పు’ in the explanatory note.
  issues:
  - severity: medium
    issue: The adversative ἀλλά is not represented in the main text.
    rationale: 'The semicolon alone does not express the Greek contrast: the believer does not come under judgment, but has passed from death into life.'
  - severity: low
    issue: Some phrasing is overly literal or stiff in modern Telugu.
    rationale: ‘తీర్పులోకి రారు’ and ‘నిత్యజీవం కలిగివున్నారు’ can be revised to idiomatic forms while retaining the source meaning and verbal force.
