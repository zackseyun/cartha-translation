id: JHN.5.24
reference: John 5:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: te
  text: '“నిజంగా, నిజంగా మీతో చెబుతున్నాను: నా మాట విని, నన్ను పంపినవాణ్ణి నమ్మేవారికి నిత్యజీవం ఉంది. వారు తీర్పుకు గురికారు[a], కానీ మరణం నుండి జీవంలోకి దాటిపోయారు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శిక్షాత్మక తీర్పుకు గురికారు.” గ్రీకు κρίσις సాధారణంగా ‘తీర్పు’ అని, సందర్భానుసారంగా ప్రతికూలమైన లేదా శిక్షాత్మక తీర్పు అని అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'ఇక్కడి గ్రీకు సంపూర్ణకాల క్రియ, ఇప్పటికే పూర్తయి దాని ఫలితం కొనసాగుతున్న మార్పును సూచిస్తుంది: వారు మరణం నుండి జీవంలోకి ‘దాటిపోయారు’ లేదా ‘దాటి చేరుకున్నారు.’'
    reason: verbal_aspect
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: నిజంగా, నిజంగా
  rationale: యేసు మాటకు ముందున్న రెండుసార్లు పలికిన గంభీరమైన ధృవీకరణను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: λέγω ὑμῖν
  choice: మీతో చెబుతున్నాను
  rationale: ప్రత్యక్ష సంభాషణ సూత్రాన్ని తెలుగు వాడుకకు అనుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ ... ἀκούων καὶ πιστεύων
  choice: విని ... నమ్మేవారు
  rationale: వర్తమాన కృదంతాల సాధారణ, లక్షణాత్మక భావాన్ని తెలియజేస్తూ, అనవసరమైన పురుషలింగ నిర్దేశాన్ని నివారిస్తుంది.
- source_word: τὸν λόγον μου
  choice: నా మాట
  rationale: యేసు పలికిన సందేశాన్ని సూచిస్తూ, యోహాను రచనలోని ‘మాట’ అనే ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: πιστεύων τῷ πέμψαντί με
  choice: నన్ను పంపినవాణ్ణి నమ్మేవారు
  rationale: దత్తివుతో ఉన్న πιστεύω ఇక్కడ ఒక వ్యక్తి చెప్పేదాన్ని నమ్మడం లేదా ఆ వ్యక్తిపై విశ్వాసం ఉంచడం అనే భావాన్ని కలిగిస్తుంది; ‘నమ్మడం’ మూల నిర్మాణాన్ని అతిగా విస్తరించదు.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: నిత్యజీవం కలిగివున్నారు
  rationale: వర్తమాన కాలంలోని ἔχει తెలియజేసే ప్రస్తుత స్వాధీనతను స్పష్టంగా ఉంచుతుంది.
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: తీర్పులోకి రారు
  rationale: κρίσις అనే పదంలోని విస్తృత ‘తీర్పు’ భావాన్నీ, εἰς లోని దిశాత్మకతనూ నిలుపుతుంది; ‘శిక్షావిధి’ అని అనువదించి ఫలితాన్ని ముందే నిర్దేశించదు.
- source_word: μεταβέβηκεν
  choice: దాటివచ్చారు
  rationale: పూర్తయిన మార్పు మరియు కొనసాగుతున్న ఫలితాన్ని సూచించే గ్రీకు సంపూర్ణ కాల భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: మరణం నుండి జీవంలోకి
  rationale: మరణం–జీవం మధ్యనున్న బలమైన యోహానీయ వ్యత్యాసాన్నీ, మూలంలోని దిశాత్మక విభక్తులనూ నిలుపుతుంది.
theological_decisions:
- issue: ఈ రక్షణ సందర్భంలో κρίσις భావం
  choice: తీర్పు
  alternative: శిక్షావిధి
  rationale: సందర్భం ప్రతికూల తీర్పును సూచించగలిగినా, నామవాచకం స్వయంగా మరింత విస్తృతమైనది. ‘తీర్పు’ అనే అనువాదం మూలంలోని భావ ఉద్రిక్తతను కాపాడుతుంది.
- issue: రక్షణకు సంబంధించి వర్తమాన మరియు సంపూర్ణ క్రియల బలం
  choice: నిత్యజీవం ఇప్పుడు కలిగివుండటం; మరణం నుండి జీవానికి ఇప్పటికే దాటి, ఆ స్థితిలో కొనసాగటం
  alternative: జీవం పూర్తిగా భవిష్యత్తులో మాత్రమే లభించడం
  rationale: ἔχει వర్తమాన స్వాధీనతను, μεταβέβηκεν పూర్తయి కొనసాగుతున్న మార్పును సూచిస్తాయి. ఈ కాలభావాలను ఏ ప్రత్యేక సిద్ధాంత వ్యవస్థలోకి మలచకుండా అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రత్యక్ష వాక్యశైలి వాడబడింది. లింగనిర్దేశం తగ్గించేందుకు సాధారణ వ్యక్తిని గౌరవ/సామాన్య బహువచన రూపంలో వ్యక్తం చేశాం. మూలంలోని ఏకవచన సాధారణ ప్రయోగ భావం సందర్భంలో నిలుస్తుంది. అందించిన ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు విరుద్ధ స్థానాల్లో కనిపించినందున, మూలార్థం ప్రకారం [a]ను ‘తీర్పు’ వద్ద, [b]ను ‘దాటివచ్చారు’ వద్ద ఉంచాం.
