  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: te
  text: ఈ కారణంగానే యూదులు[a] ఆయనను చంపడానికి ఇంకా ఎక్కువగా ప్రయత్నిస్తున్నారు. ఎందుకంటే ఆయన విశ్రాంతి దినాన్ని ఉల్లంఘించడమే కాక, దేవుణ్ణి తన సొంత తండ్రి అని పిలుస్తూ, తనను తాను దేవునితో సమానుడిగా చేసుకుంటున్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యోహాను సువార్తలో “యూదులు” అనే పదం సందర్భానుసారంగా యేసును వ్యతిరేకించిన యూదయవాసులను లేదా కొందరు యూదు అధికారులను మరింత ప్రత్యేకంగా సూచించవచ్చు; ఇది భేదం లేకుండా ప్రతి యూదుణ్ణీ సూచించదు.
    reason: cultural_note
  - marker: b
    text: లేదా, “తనను తాను దేవునికి సమానుడిగా చేసుకుంటున్నాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: కాబట్టి, ఈ కారణంగానే
  rationale: రెండు అన్వయ సూచక పదాల సమిష్టి బలాన్ని నిలుపుతూ, ముందున్న సందర్భంతో గల కారణ సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μᾶλλον
  choice: ఇంకా ఎక్కువగా
  rationale: మునుపటికంటే అధికమైన ప్రయత్నాన్ని సూచించే తులనాత్మక తీవ్రతను స్పష్టంగా నిలుపుతుంది.
- source_word: ἐζήτουν ... ἀποκτεῖναι
  choice: చంపడానికి ... ప్రయత్నిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న లేదా పునరావృత ప్రయత్న భావాన్ని, అలాగే ἀποκτεῖναι యొక్క ప్రత్యక్ష బలాన్ని కాపాడుతుంది.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదానికి నేరమైన సమానార్థకాన్ని ప్రధాన పాఠ్యంలో ఉంచి, యోహాను సందర్భంలో దాని పరిధిని పాదటీకలో వివరిస్తుంది.
- source_word: ἔλυε τὸ σάββατον
  choice: విశ్రాంతి దినాన్ని ఉల్లంఘించడమే
  rationale: ఇక్కడ λύω అనేది విశ్రాంతి దిన నియమాన్ని భంగపరచడం లేదా ఉల్లంఘించడం అనే నుడికారార్థంలో ఉంది; ఆరోపణ స్వరాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: దేవుడు తన సొంత తండ్రి అని ... చెబుతూ
  rationale: ἴδιον లోని ‘తన సొంత’ అనే ప్రత్యేక బలాన్ని నిలుపుతూ, ἔλεγε ను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: తనను తాను దేవునితో సమానునిగా చేసుకుంటున్నాడు
  rationale: కృదంత వాక్యభాగంలోని ‘తనను తాను సమానునిగా చేయడం’ అనే నిర్మాణాన్నీ, సమానత్వ వాదన బలాన్నీ తగ్గించకుండా నిలుపుతుంది.
theological_decisions:
- issue: దేవునితో సమానత్వాన్ని తెలిపే వాక్యభాగపు క్రీస్తు సంబంధిత బలం
  choice: తనను తాను దేవునితో సమానునిగా చేసుకుంటున్నాడు
  alternative: తాను దేవునితో సమానుడనని ప్రకటిస్తున్నాడు
  rationale: మూలంలోని ποιῶν నిర్మాణాన్ని నేరుగా నిలుపుతూ, సమానత్వ భావాన్ని పలుచన చేయదు; అదే సమయంలో మూలంలో లేని తరువాతి సిద్ధాంత పరిభాషను చేర్చదు.
- issue: యోహాను సువార్తలో ‘యూదులు’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘యూదులు’ అని ఉంచి పాదటీకలో సందర్భాన్ని వివరించడం
  alternative: యూదా నాయకులు; యూదయులు
  rationale: οἱ Ἰουδαῖοι అనే మూల పదాన్ని అనువాదంలో కాపాడుతుంది; అయితే అది ప్రతి యూదుణ్ణీ భేదం లేకుండా సూచించాల్సిన అవసరం లేదనే సందర్భోచిత సూక్ష్మతను పాదటీక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘విశ్రాంతి దినం,’ ‘తన సొంత తండ్రి,’ ‘దేవునితో సమానునిగా’ వంటి పదబంధాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, మూలంలోని ఆరోపణాత్మక మరియు ధార్మిక ఉద్రిక్తతను నిలుపుతాయి.
