id: JHN.19.32
reference: John 19:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: te
  text: కాబట్టి సైనికులు వచ్చి మొదటివాని కాళ్లను విరగగొట్టారు; అతనితోపాటు[a] సిలువ వేయబడిన మరొకవాని కాళ్లను కూడా విరగగొట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘అతనితోపాటు’ అని ఉంది. సందర్భంలో ఇది యేసును సూచిస్తుంది; వ్యాకరణపరంగా ‘మొదటివానితోపాటు’ అని కూడా గ్రహించే అవకాశం ఉంది.
    reason: referent_ambiguity
lexical_decisions:
- source_word: οὖν
  choice: అందువల్ల
  rationale: మునుపటి వచనంలో చెప్పిన ఆజ్ఞకు ఫలితంగా సైనికులు చేసిన చర్యను సూచిస్తుంది; కథనంలోని కారణ–ఫలిత సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οἱ στρατιῶται
  choice: సైనికులు
  rationale: ఈ సందర్భంలోని రోమా సైనిక సిబ్బందికి సరళమైన, ప్రామాణిక తెలుగు పదం.
- source_word: τοῦ μὲν πρώτου
  choice: మొదటివాని
  rationale: యేసుతో సిలువ వేయబడిన ఇద్దరిలో మొదటివాడిని సూచిస్తుంది. గ్రీకులో వ్యక్తిని సూచించే నామవాచకం అధ్యాహారంగా ఉంది; తెలుగులో ‘వాని’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κατέαξαν τὰ σκέλη
  choice: కాళ్లను విరగగొట్టారు
  rationale: శిక్ష అమలు సందర్భంలో కాళ్ల ఎముకలను విరిచిన చర్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τοῦ ἄλλου
  choice: మరొకవాని
  rationale: యేసుతో సిలువ వేయబడిన ఇద్దరిలో రెండవ వ్యక్తిని సూచిస్తుంది; తెలుగులో వ్యక్తిగత సూచన స్పష్టంగా ఉంటుంది.
- source_word: συσταυρωθέντος αὐτῷ
  choice: యేసుతోపాటు సిలువ వేయబడిన
  rationale: సహసిలువీకరణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. సందర్భంలో αὐτῷ అనే సర్వనామం ప్రధానంగా యేసును సూచిస్తుంది; ప్రత్యామ్నాయ వ్యాకరణ సంబంధాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: αὐτῷ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: యేసుతోపాటు
  alternative: మొదటివానితోపాటు
  rationale: యోహాను సిలువ సంఘటనలో ఆ ఇద్దరినీ యేసుతో ఉన్న సంబంధంలోనే గుర్తిస్తున్నాడు; అందువల్ల యేసు ప్రధాన సూచితుడు. అయినా, సమీపంలోని ‘మొదటివాని’తో వ్యాకరణపరంగా అనుసంధానించే అవకాశం పూర్తిగా దాచకుండా పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. గ్రీకులో రెండోసారి అధ్యాహారంగా ఉన్న ‘కాళ్లను’ తెలుగులో స్పష్టత కోసం పునరుక్తం చేశాం.
