id: JHN.19.42
reference: John 19:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: te
  text: కాబట్టి, యూదుల సిద్ధపాటు దినం కావడం వల్ల[a], ఆ సమాధి దగ్గరలోనే ఉండడంతో, వారు యేసును అక్కడ ఉంచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదుల సిద్ధపాటు కారణంగా”; లేదా, “అది యూదుల సిద్ధపాటు దినం కావడం వల్ల.”
    reason: παρασκευή అనే పదాన్ని ప్రత్యేక దిననామంగా గానీ, సిద్ధపాటును సూచించే పదంగా గానీ అర్థం చేసుకునే వీలును చూపించడానికి.
lexical_decisions:
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: సమాధి ఉంచిన స్థలాన్ని సూచించే స్థానవాచక క్రియావిశేషణం. తెలుగులో వాక్యాంతంలో ఉంచడం సహజంగా ఉండి గ్రీకు భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భం నుంచి వచ్చే కథనపరమైన ఫలితాన్ని లేదా కొనసాగింపును సూచిస్తుంది.
- source_word: διὰ τὴν παρασκευὴν
  choice: సిద్ధపాటు దినం కావడం వల్ల
  rationale: διά + ద్వితీయా విభక్తి కారణాన్ని సూచిస్తుంది. παρασκευή విశ్రాంతిదినానికి లేదా పండుగకు ముందున్న సిద్ధపాటు దినానికి వాడే ప్రత్యేక కాలపదం; ఆధునిక పాఠకులకు అర్థమయ్యేలా ‘సిద్ధపాటు దినం’ అని అనువదించబడింది.
- source_word: τῶν Ἰουδαίων
  choice: యూదుల
  rationale: ‘సిద్ధపాటు దినం’ను విశేషించే సంబంధవాచక బహువచనం. మూలంలోని నిర్మాణాన్ని అతిగా వివరించకుండా తెలుగులో సహజమైన సంబంధరూపంగా నిలుపుతుంది.
- source_word: ὅτι
  choice: ఉండడంతో
  rationale: ఆ సమాధినే ఎంచుకోవడానికి గల అదనపు కారణాన్ని పరిచయం చేస్తుంది.
- source_word: ἐγγὺς
  choice: దగ్గరలోనే
  rationale: సమాధి సమీపంలో ఉన్నదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘నే’ సమీపతకు సందర్భోచితమైన బలం ఇస్తుంది.
- source_word: μνημεῖον
  choice: సమాధి
  rationale: ఈ అంత్యక్రియల సందర్భంలో శరీరాన్ని ఉంచే సమాధి స్థలాన్ని సూచించే సాధారణమైన, ఖచ్చితమైన తెలుగు పదం.
- source_word: ἔθηκαν
  choice: ఉంచారు
  rationale: τίθημι యొక్క ఈ రూపం యేసును సమాధిలో ఉంచడాన్ని సూచిస్తుంది. ‘ఉంచారు’ మూలంలోని సాధారణ క్రియార్థాన్ని కాపాడుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: τὸν Ἰησοῦν
  choice: యేసును
  rationale: క్రియకు ప్రత్యక్ష కర్మ; పేరుకు ప్రామాణిక తెలుగు రూపం ఉపయోగించబడింది.
theological_decisions:
- issue: శ్రమకాల సందర్భంలో παρασκευή అనువాదం
  choice: సిద్ధపాటు దినం
  alternative: సిద్ధపాటు
  rationale: ఈ గ్రీకు పదం నిర్దిష్ట కాలపదంగా వాడబడగలదు. ‘సిద్ధపాటు దినం’ ఆధునిక పాఠకునికి భావాన్ని స్పష్టం చేస్తుంది; అయితే అది ఏ ప్రత్యేక పండుగ లేదా క్యాలెండర్ గణనను సూచిస్తుందో వచనం చెప్పినదానికంటే ఎక్కువగా నిర్ణయించదు.
- issue: యోహాను కథనంలో τῶν Ἰουδαίων అనువాదం
  choice: యూదుల సిద్ధపాటు దినం
  alternative: యూదుల సిద్ధపాటు; యూదుల ఆచారం ప్రకారం సిద్ధపాటు దినం
  rationale: ఇది గ్రీకు సంబంధవాచక నిర్మాణాన్ని కనిపించేలా ఉంచుతుంది. యూద ప్రజల గురించి వేదాంతపరమైన తీర్పును జోడించకుండా, సందర్భంలోని సిద్ధపాటు దినంతో వారి సంబంధాన్ని మాత్రమే తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే కథనశైలి. గ్రీకు కారణసంబంధ నిర్మాణాన్ని సహజమైన తెలుగు ఉపవాక్యాలతో నిలిపి, వచనం చెప్పని క్యాలెండర్ లేదా మతపరమైన వివరాలను జోడించలేదు.
