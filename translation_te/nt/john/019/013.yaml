id: JHN.19.13
reference: John 19:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: te
  text: కాబట్టి పిలాతు ఈ మాటలు విన్నప్పుడు, యేసును బయటికి తీసుకొచ్చి, రాతి పలకలతో పరచిన ప్రదేశం అని పిలువబడే చోట న్యాయపీఠం మీద కూర్చున్నాడు[a]. ఆ ప్రదేశాన్ని హీబ్రూ భాషలో[b] గబ్బతా అని పిలుస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను న్యాయపీఠం మీద కూర్చోబెట్టాడు.” గ్రీకు క్రియను సకర్మకంగా కూడా అర్థం చేసుకోవచ్చు; అయితే ఇక్కడ పిలాతే న్యాయపీఠం మీద కూర్చున్నాడనే భావం ఎక్కువ సంభావ్యమైనది.
    reason: alternative_reading
  - marker: b
    text: “హీబ్రూ భాషలో” అనేది ఇక్కడి స్థానిక సెమిటిక్ భాషను—బహుశా అరామిక్ భాషను—సూచిస్తుండవచ్చు; యోహాను గ్రంథంలో ఇతర చోట్ల కూడా ఈ విధమైన వాడుక కనిపిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సంభాషణకు ఈ చర్యను అనుసంధానించే కథన సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: ఈ మాటలు విన్నప్పుడు
  rationale: భూతకాల కృదంతాన్ని కాలసంబంధ వాక్యంగా అందిస్తూ, λόγωνను ఇప్పుడే పలికిన మాటలుగా సూచిస్తుంది.
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: యేసును బయటికి తీసుకొచ్చి
  rationale: ἄγω మరియు ἔξω సూచించే బయటికి తీసుకురావడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: న్యాయపీఠం మీద కూర్చున్నాడు
  rationale: βῆμα ఇక్కడ అధికారిక న్యాయాసనాన్ని సూచిస్తుంది; ప్రధాన పఠనంలో పిలాతే దానిపై కూర్చున్నాడని సహజంగా అర్థమవుతుంది.
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: రాతి పరచిన స్థలం అని పిలువబడే చోట
  rationale: Λιθόστρωτον అనే పారదర్శక గ్రీకు స్థలనామ అర్థాన్ని తెలుగులో తెలియజేస్తూ, సందర్భానుగుణంగా గమ్యస్థానాన్ని 'చోట' అని అందిస్తుంది.
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: హీబ్రూ భాషలో ఆ స్థలాన్ని గబ్బతా అంటారు
  rationale: మూలపాఠంలోని Ἑβραϊστίని ప్రధాన వాక్యంలో యథాతథ భావంతో ఉంచి, గబ్బతాను స్థలనామంగా లిప్యంతరీకరించింది.
theological_decisions:
- issue: ἐκάθισεν అనే క్రియకు కర్త మరియు కర్మ
  choice: పిలాతు న్యాయపీఠం మీద కూర్చున్నాడు
  alternative: పిలాతు యేసును న్యాయపీఠం మీద కూర్చోబెట్టాడు
  rationale: గ్రీకు రూపాన్ని అకర్మకంగానూ సకర్మకంగానూ అర్థం చేసుకోవచ్చు. న్యాయవిచారణ సందర్భం మరియు సాధారణ వాక్యనిర్మాణం పిలాతే న్యాయపీఠంపై కూర్చున్నాడనే భావానికి ఎక్కువ మద్దతిస్తాయి; అయినా నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. 'న్యాయపీఠం' న్యాయాధికార సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలంలోని వ్యాకరణ సందిగ్ధతను పాదసూచికలో సంరక్షించాం.
