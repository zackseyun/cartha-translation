- from: కాబట్టి పిలాతు ఈ మాటలు విన్నప్పుడు, యేసును బయటికి తీసుకొచ్చి, రాతి పరచిన స్థలం అని పిలువబడే చోట ఉన్న న్యాయపీఠం మీద కూర్చున్నాడు[a]. హీబ్రూ భాషలో[b] ఆ స్థలాన్ని గబ్బతా అంటారు.
  to: కాబట్టి పిలాతు ఈ మాటలు విన్నప్పుడు, యేసును బయటికి తీసుకొచ్చి, రాతి పలకలతో పరచిన ప్రదేశం అని పిలువబడే చోట న్యాయపీఠం మీద కూర్చున్నాడు[a]. ఆ ప్రదేశాన్ని హీబ్రూ భాషలో[b] గబ్బతా అని పిలుస్తారు.
