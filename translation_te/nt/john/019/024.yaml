  source_fidelity: 'ప్రధాన భావం మూలగ్రంథానికి అనుగుణంగానే ఉంది: వస్త్రాన్ని చింపకూడదని సైనికులు నిర్ణయించుకోవడం, చీట్ల ద్వారా యాజమాన్యాన్ని నిర్ణయించడం, కీర్తన ఉటంకణం, లేఖన నెరవేర్పు, మరియు సైనికుల చర్య అన్నీ ఉన్నాయి. అయితే ఉటంకణంలోని ἐπὶ τὸν ἱματισμόν μου ను “నా దుస్తుల కోసం” అని అనువదించడం కొద్దిగా అస్పష్టంగా ఉంది; ‘నా వస్త్రమీద చీటి వేశారు’ అనేది చీటి వేయబడిన వస్త్రాన్ని స్పష్టంగా సూచిస్తుంది. అలాగే నెరవేర్పు వాక్యంలోని పాదసూచికను నేరుగా ఉటంకణానికి జతచేయడం సముచితం.'
  naturalness: ‘ఒకరితో ఒకరు ... అని చెప్పుకున్నారు’ కంటే ‘ఒకరితో ఒకరు ... అన్నారు’ మరింత సహజంగా, సంక్షిప్తంగా ఉంటుంది. ‘ఇది ఎవరిది కావాలో నిర్ణయించడానికి’ స్థానంలో ‘ఇది ఎవరిదో నిర్ణయించడానికి’ ఆధునిక తెలుగులో సహజం. నెరవేర్పు సూత్రానికి ‘నెరవేరునట్లు’ అనే రూపం ఉద్దేశం/ఫలితం మధ్య మూలంలోని విస్తృతిని కాపాడుతుంది.
