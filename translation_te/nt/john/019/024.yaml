id: JHN.19.24
reference: John 19:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: te
  text: కాబట్టి వారు ఒకరితో ఒకరు, “దీన్ని చింపవద్దు; ఇది ఎవరిదో నిర్ణయించడానికి దీనికోసం చీట్లు వేద్దాం[a]” అన్నారు. “వారు నా వస్త్రాలను తమలో తాము పంచుకున్నారు; నా వస్త్రమీద చీటి వేశారు” అని చెప్పిన లేఖనం నెరవేరునట్లు ఇది జరిగింది.[b] కాబట్టి సైనికులు ఇవి చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దీనికోసం చీట్లు తీసుకుందాం.”
    reason: lexical_alternative
  - marker: b
    text: కీర్తన 22:18 నుండి ఉటంకించబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: చింపవద్దు
  rationale: వస్త్రాన్ని చీల్చడం లేదా చింపడం అనే అర్థాన్ని సందర్భానుకూలమైన సహజ తెలుగు క్రియతో తెలియజేస్తుంది.
- source_word: αὐτόν
  choice: దీన్ని
  rationale: గ్రీకులో పుంలింగ సర్వనామమైనా, సందర్భంలో అది వస్త్రాన్ని సూచిస్తుంది; తెలుగులో సమీపంలోని ఆ వస్త్రానికి సహజ సూచన ‘దీన్ని’.
- source_word: λάχωμεν
  choice: చీట్లు వేద్దాం
  rationale: యాజమాన్యాన్ని చీటి ద్వారా నిర్ణయించే చర్యను ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: ఇది ఎవరిది కావాలో నిర్ణయించడానికి దీని కోసం
  rationale: చీటి వేయడంలోని ఉద్దేశం—ఆ వస్త్రం ఎవరికి దక్కాలో నిర్ణయించడం—తెలుగులో స్పష్టమవుతుంది; గ్రీకు భావానికి మించిన అంశం చేర్చదు.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: లేఖనం నెరవేరేలా ఇది జరిగింది
  rationale: యోహాను వాడే లేఖన నెరవేర్పు సూత్రాన్ని కాపాడుతూ, ఈ సందర్భంలో సహజమైన తెలుగు వాక్య నిర్మాణాన్ని ఇస్తుంది.
- source_word: ἡ γραφή
  choice: లేఖనం
  rationale: ఇది సాధారణ రచనను కాక పవిత్ర లేఖనాన్ని సూచిస్తుంది; ‘లేఖనం’ తెలుగు బైబిలు భాషలో గౌరవప్రదంగా, అర్థవంతంగా ఉంది.
- source_word: ἡ λέγουσα
  choice: అని చెప్పే
  rationale: ఉటంకించబడే లేఖన వాక్యాన్ని పరిచయం చేసే గ్రీకు కృదంతపు పనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Διεμερίσαντο
  choice: పంచుకున్నారు
  rationale: వస్త్రాలను తమ మధ్య విభజించుకున్న పంపిణీ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἱμάτιά
  choice: వస్త్రాలను
  rationale: బహువచన దుస్తులను సూచిస్తూ, కీర్తన ఉటంకణానికి తగిన గౌరవప్రదమైన శైలిని నిలుపుతుంది.
- source_word: ἑαυτοῖς
  choice: తమలో తాము
  rationale: సైనికులు వాటిని తమ మధ్య పంచుకున్నారనే పరస్పర పంపిణీ భావాన్ని కాపాడుతుంది.
- source_word: ἱματισμόν
  choice: దుస్తుల కోసం
  rationale: ముందున్న ἱμάτιαకు ‘వస్త్రాలు’ అన్న పదం వాడగా, ఇక్కడ ‘దుస్తులు’ అని ఇవ్వడం మూలంలోని పదభేదాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: ἔβαλον κλῆρον
  choice: చీటి వేశారు
  rationale: ఏకవచన κλῆρον భావాన్ని సహజ తెలుగు ప్రయోగంతో ఇస్తుంది; కథన భాగంలోని బహువచనాత్మక సామెతతో స్వల్ప సందర్భ భేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἵνα ἡ γραφὴ πληρωθῇలో సైనికుల చర్యకు లేఖన నెరవేర్పుతో ఉన్న సంబంధం
  choice: ఈ సంఘటన లేఖనాన్ని నెరవేర్చిందనే వాక్యాన్ని నేరుగా అనువదించడం; దైవ నిర్ణయం మరియు మానవ చర్యల సంబంధాన్ని మరింత నిర్వచించకపోవడం.
  alternative: ‘లేఖనం నెరవేరడానికి’ అని మరింత ఉద్దేశార్థకంగా అనువదించడం, లేదా కేవలం ఫలితార్థంగా ‘దీనివల్ల లేఖనం నెరవేరింది’ అని ఇవ్వడం.
  rationale: యోహాను నెరవేర్పు సూత్రంలోని ఉద్దేశం/ఫలితం మధ్య ఉన్న భావ ఉద్రిక్తతను ఒక సిద్ధాంతపరమైన వివరణతో పరిష్కరించకుండా, లేఖనం నెరవేరిందనే వచన దావాను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్య నిర్మాణం, కీర్తన ఉటంకణంలో స్వల్ప గౌరవప్రద శైలి. ‘వస్త్రాలు/దుస్తులు’ ద్వారా మూలంలోని రెండు వస్త్రపదాల భేదం కొంత నిలుపబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
