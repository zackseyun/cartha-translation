source:
  edition: SBLGNT
  text: ⸀σκεῦος ἔκειτο ὄξους μεστόν· ⸂σπόγγον οὖν μεστὸν τοῦ⸃ ὄξους ⸀ὑσσώπῳ περιθέντες προσήνεγκαν αὐτοῦ τῷ στόματι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: te
  text: పులిసిన ద్రాక్షారసంతో నిండిన ఒక పాత్ర అక్కడ ఉంది. కాబట్టి వారు పులిసిన ద్రాక్షారసంతో నిండిన ఒక స్పాంజిని హిస్సోపు మీద ఉంచి[a], దాన్ని ఆయన నోటి దగ్గరికి తీసుకొచ్చారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘హిస్సోపుతో ఉంచి,’ లేదా ‘హిస్సోపు కొమ్మ మీద ఉంచి.’ గ్రీకు పదబంధం ‘హిస్సోపు మీద/తో’ అని మాత్రమే చెబుతుంది; ఖచ్చితమైన విధానం వివాదాస్పదం.
    reason: lexical_alternative
  - marker: b
    text: ‘పులిసిన ద్రాక్షారసం’ అనే గ్రీకు పదాన్ని ‘వినిగర్’ అని కూడా అనువదించవచ్చు. ఇక్కడ అది సైనికులకు అందుబాటులో ఉండే పులిసిన ద్రాక్షారస పానీయాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: పాత్ర
  rationale: రకాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా, ఏదైనా ద్రవాన్ని ఉంచే వస్తువు అనే సాధారణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἔκειτο
  choice: అక్కడ ఉంది
  rationale: κεῖμαι యొక్క స్థితిని తెలిపే అసంపూర్ణ భూతకాల భావాన్ని తెలుగులో సహజమైన దృశ్యవర్ణనగా అందిస్తుంది; ‘పడివుంది’ అనడం పాత్ర స్థితిని అతిగా నిర్దిష్టం చేయవచ్చు.
- source_word: ὄξους
  choice: పులిసిన ద్రాక్షారసం
  rationale: ఇక్కడ ὄξος సాధారణ వంట వినిగర్‌కన్నా పానీయంగా వాడే చవకైన పులిసిన ద్రాక్షారసాన్ని సూచించే అవకాశం ఎక్కువ; ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: μεστόν / μεστὸν
  choice: నిండిన
  rationale: పాత్రకూ స్పాంజికీ వర్తించే ‘నిండియున్న’ భావాన్ని సంక్షిప్తంగా, ఒకే విధంగా అందిస్తుంది.
- source_word: σπόγγον
  choice: ఒక స్పాంజిని
  rationale: మూలపదానికి నేరమైన, ఆధునిక తెలుగులో సులభంగా అర్థమయ్యే సమానార్థకం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భం ఫలితంగా జరిగిన చర్యను తెలిపే కథన సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ὑσσώπῳ
  choice: హిస్సోపు మీద
  rationale: దత్తివిభక్తి సాధనం లేదా అనుసంధానాన్ని సూచించవచ్చు. ‘కొమ్మ’ అనే పదం గ్రీకులో స్పష్టంగా లేనందున దాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా అస్పష్టతను నిలుపుతుంది.
- source_word: περιθέντες
  choice: ఉంచి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను తెలిపే aorist participle భావాన్ని సహజమైన తెలుగు పూర్వకాలిక క్రియతో అందిస్తుంది.
- source_word: προσήνεγκαν
  choice: తీసుకొచ్చారు
  rationale: దగ్గరకు తీసుకురావడం లేదా సమర్పించడం అనే భావంలో, యేసు నోటి వైపు చేసిన భౌతిక చర్యను అదనపు వ్యాఖ్యానం లేకుండా తెలుపుతుంది.
- source_word: αὐτοῦ τῷ στόματι
  choice: ఆయన నోటి దగ్గరికి
  rationale: ప్రసంగంలో గౌరవప్రదమైన తెలుగు సర్వనామాన్ని ఉపయోగిస్తూ, నోటివైపు తీసుకురావడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ὑσσώπῳ అనే పదంలోని చారిత్రక లేదా ఆరాధనా ప్రతిధ్వని
  choice: ప్రధాన పాఠ్యంలో ‘హిస్సోపు’ అనే పదాన్నే ఉంచి, దాని ప్రతీకార్థాన్ని వివరించలేదు.
  alternative: ‘హిస్సోపు కొమ్మ మీద’ అని మరింత వివరణాత్మకంగా అనువదించడం, లేదా దాన్ని సాధారణ కాడ/రెల్లుగా చూపడం.
  rationale: యోహాను వాడిన పదం పస్కా లేదా శుద్ధీకరణను గుర్తుకు తేవచ్చు; అయితే ఈ వచనం ఆ ప్రతీకార్థాన్ని ప్రత్యక్షంగా చెప్పదు. ‘హిస్సోపు’ను ఉంచడం ద్వారా సాధ్యమైన ధార్మిక ప్రతిధ్వని నిలుస్తుంది, కానీ ఒక వ్యాఖ్యానాన్ని పాఠ్యంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘పులిసిన ద్రాక్షారసం’ చారిత్రక పానీయ భావాన్ని స్పష్టం చేస్తుంది; ‘హిస్సోపు’ మూలంలోని ప్రత్యేక పదాన్నీ దాని సాధ్యమైన ప్రతిధ్వనులనూ నిలుపుతుంది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
