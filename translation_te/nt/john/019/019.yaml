source:
  edition: SBLGNT
  text: ἔγραψεν δὲ καὶ τίτλον ὁ Πιλᾶτος καὶ ἔθηκεν ἐπὶ τοῦ σταυροῦ· ἦν δὲ γεγραμμένον· Ἰησοῦς ὁ Ναζωραῖος ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: te
  text: 'పిలాతు ఒక వ్రాత కూడా రాసి, దాన్ని సిలువపై పెట్టాడు. దానిపై ఇలా రాసి ఉంది: “నజరేయుడైన యేసు, యూదుల రాజు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదయ ప్రాంత ప్రజల రాజు.” గ్రీకు పదం సందర్భాన్ని బట్టి యూదులందరినీ లేదా ప్రత్యేకంగా యూదయ ప్రాంతవాసులను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: శాసనం
  rationale: శిక్షించబడిన వ్యక్తి గుర్తింపును, అతనిపై మోపిన నేరారోపణను తెలియజేస్తూ సిలువకు పెట్టిన వ్రాతఫలకాన్ని సందర్భానుసారంగా సూచిస్తుంది. ఆధునిక తెలుగులో ‘శాసనం’ సంక్షిప్తంగా, గౌరవప్రదంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: ἔγραψεν ... ὁ Πιλᾶτος
  choice: పిలాతు ... రాయించాడు
  rationale: అధికారిగా పిలాతు స్వయంగా అక్షరాలు రాశాడని తప్పనిసరిగా సూచించకుండా, అతని ఆదేశం మరియు బాధ్యతలో అది రాయబడిందనే సహజమైన తెలుగు భావాన్ని ఇస్తుంది.
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: దాన్ని సిలువపై పెట్టించాడు
  rationale: ἐπί యొక్క ప్రత్యక్ష భావమైన ‘పై’ను నిలుపుతుంది; మూలంలో లేని ‘సిలువకు పైన’ అనే స్థానార్థాన్ని చేర్చదు.
- source_word: ἦν ... γεγραμμένον
  choice: దానిపై ఇలా రాసి ఉంది
  rationale: పూర్తయిన వ్రాత అప్పటికీ కనిపిస్తూ ఉన్న స్థితిని తెలిపే గ్రీకు పరిభాషాత్మక నిర్మాణంలోని ఫలితస్థితి భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ναζωραῖος
  choice: నజరేయుడైన
  rationale: ‘నజరేయుడు’ అనే గుర్తింపు బిరుదు రూపాన్ని నిలుపుతూ, తెలుగు వాక్యంలో యేసును సహజంగా విశేషిస్తుంది.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: యూదుల రాజు
  rationale: శ్రమవృత్తాంతంలోని బహిరంగ రాజబిరుదు/నేరారోపణ సందర్భంలో స్థిరమైన, సహజమైన తెలుగు రూపం. Ἰουδαίωνకు సాధ్యమైన ప్రాంతీయ అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: δὲ καὶ
  choice: కూడా
  rationale: వివరణ కొనసాగింపుతో పాటు ఉన్న అదనపు చర్యను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: σταυροῦ
  choice: సిలువ
  rationale: సువార్తల శ్రమవృత్తాంత సందర్భంలో σταυρόςకు ప్రమాణమైన, సుపరిచితమైన తెలుగు పదం.
theological_decisions:
- issue: శాసనంలోని Ἰουδαίων పదం అనువాదం
  choice: యూదుల
  alternative: యూదయుల
  rationale: ఈ సందర్భంలో అది యేసుకు ఆపాదించిన ప్రజాసంబంధమైన రాజబిరుదుగా పనిచేస్తుంది; అందువల్ల ‘యూదుల’ అనేది సందర్భోచితమైన ప్రధాన పఠనం. అయితే గ్రీకు పదానికి ప్రాంతీయంగా ‘యూదయులు’ అనే అర్థం కూడా సాధ్యమైనందున దాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘రాయించాడు/పెట్టించాడు’ అనే ప్రయోజక రూపాలు పిలాతు అధికారపూర్వక బాధ్యతను సహజంగా తెలియజేస్తాయి. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో స్పష్టంగా చేర్చబడింది.
