  source_fidelity: The translation accurately conveys the explanatory γάρ, the preceding events denoted by ταῦτα, and the purpose/result clause ἵνα ἡ γραφὴ πληρωθῇ. The citation correctly communicates that no bone belonging to him would be broken. The Telugu collective expression “ఆయన ఎముకల్లో ఒక్కటి కూడా” idiomatically represents the Greek singular Ὀστοῦν without materially altering its sense.
  naturalness: The wording is clear, grammatical, and appropriate in modern standard Telugu. “నెరవేరేలా ఇవి జరిగాయి” naturally expresses the fulfillment construction, and the quoted wording has a suitably elevated scriptural register while remaining understandable.
  terminology: “లేఖనం” is an acceptable modern Telugu rendering of ἡ γραφή in this Johannine fulfillment context. “నెరవేరేలా” and “విరగగొట్టబడదు” preserve the fulfillment and passive-breaking senses adequately. The respectful pronoun “ఆయన” is appropriate for the referent and register.
