id: JHN.19.36
reference: John 19:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγένετο γὰρ ταῦτα ἵνα ἡ γραφὴ πληρωθῇ· Ὀστοῦν οὐ συντριβήσεται ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/036.yaml
  text: 'For these things happened so that the Scripture might be fulfilled: “Not one of his bones will be broken.”[a]'
translation:
  language: te
  text: ఎందుకంటే, “ఆయన ఎముకల్లో ఒక్కటి కూడా విరగగొట్టబడదు”[a] అనే లేఖనం నెరవేరేలా ఇవి జరిగాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో అక్షరార్థంగా, “ఆయన ఎముక విరగగొట్టబడదు.” ఇక్కడ ఏకవచనమైన “ఎముక” సమూహార్థంలో ఉంది; అందుకే తెలుగులో “ఆయన ఎముకల్లో ఒక్కటి కూడా” అని సహజంగా అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: జరిగాయి
  rationale: ఇప్పుడే వివరించిన సంఘటనలను సూచించే భూతకాల ఘటనార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యానికి ఈ వాక్యం ఇచ్చే వివరణాత్మక కారణ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ταῦτα
  choice: ఇవి
  rationale: ముందు వివరించిన బహువచన సంఘటనలను సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: ἵνα
  choice: నెరవేరేలా
  rationale: లేఖన నెరవేర్పుతో సంఘటనలకు ఉన్న ఉద్దేశ్య/ఫలిత సంబంధాన్ని తెలుగు వాక్య నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ γραφή
  choice: లేఖనం
  rationale: యోహాను సందర్భంలో పవిత్ర లేఖనంలోని నిర్దిష్ట వాక్యాన్ని సూచిస్తుంది; ‘లేఖనం’ గౌరవప్రదమైన, సుపరిచితమైన బైబిలు పదం.
- source_word: πληρωθῇ
  choice: నెరవేరేలా
  rationale: కర్మణి భావంతో కూడిన నెరవేర్పును ఉద్దేశ్య/ఫలిత నిర్మాణంలో సంక్షిప్తంగా అందిస్తుంది.
- source_word: Ὀστοῦν
  choice: ఎముకల్లో ఒక్కటి
  rationale: గ్రీకు ఏకవచనంలోని సమూహార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ఒక్క ఎముక కూడా మినహాయింపు కాదనే భావాన్ని నిలుపుతుంది.
- source_word: οὐ συντριβήσεται
  choice: విరగగొట్టబడదు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని మరియు ఎముక విరగకపోవడమనే సందర్భార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: గ్రీకు షష్ఠీ సర్వనామాన్ని గౌరవప్రదమైన తెలుగు స్వామ్య నిర్మాణంలో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: నిర్గమకాండము 12:46 / సంఖ్యాకాండము 9:12 / కీర్తన 34:20లను స్మరింపజేసే లేఖన ఉల్లేఖనంలో ఏకవచన ‘ఎముక’ను ఎలా అందించాలి
  choice: ఆయన ఎముకల్లో ఒక్కటి కూడా విరగగొట్టబడదు
  alternative: ఆయన ఎముక విరగగొట్టబడదు
  rationale: మూలంలోని ఏకవచనం సమూహార్థంలో పనిచేస్తుంది. తెలుగు సహజ ప్రయోగంలో ‘ఎముకల్లో ఒక్కటి కూడా’ అని చెప్పడం మూల భావాన్ని విస్తరించకుండా, ఏ ఎముకా విరగదనే ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది; పాత నిబంధన సూచనను కూడా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా లేఖన ఉల్లేఖనానికి తగిన గౌరవప్రదమైన సాహిత్య ధోరణితో రూపొందించబడింది. కారణ సంబంధాన్ని ముందుంచి, మూలంలోని ఉద్దేశ్య/ఫలిత ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
