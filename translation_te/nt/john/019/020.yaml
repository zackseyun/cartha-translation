id: JHN.19.20
reference: John 19:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: te
  text: కాబట్టి యూదుల్లో చాలామంది ఆ శాసనాన్ని చదివారు, ఎందుకంటే యేసు సిలువ వేయబడిన స్థలం పట్టణానికి దగ్గరగా ఉంది. అది హెబ్రీ భాషలో[a], లాటిన్ భాషలో, గ్రీకు భాషలో రాయబడి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అరామిక్ భాషలో’ అని అర్థం కావచ్చు; స్థానిక సెమిటిక్ భాషను సూచించడానికి యోహాను ‘హెబ్రీ’ అనే పదాన్ని ఉపయోగిస్తాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίτλον
  choice: శాసనం
  rationale: సిలువపై ఉంచిన వ్రాతపూర్వక ప్రకటనను సూచించే ఈ సందర్భంలో, ఆధునిక తెలుగులో ‘శాసనం’ సంక్షిప్తంగా, గౌరవప్రదంగా, సహజంగా ఉంది.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: యూదుల్లో చాలామంది
  rationale: జనులందరినీ ఉద్దేశించకుండా, గ్రీకు భాగార్థక షష్ఠీ విభక్తి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀνέγνωσαν
  choice: చదివారు
  rationale: కేవలం చదివే చర్యనే గ్రీకు పదం స్పష్టంగా తెలియజేస్తుంది; ‘బిగ్గరగా చదివారు’ అనే అదనపు భావాన్ని చేర్చలేదు.
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: ఆ స్థలం పట్టణానికి దగ్గరగా ఉంది
  rationale: పట్టణ ద్వారం వంటి మూలంలో లేని వివరాన్ని చేర్చకుండా, గ్రీకు వాక్యార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: యేసును సిలువ వేసిన స్థలం
  rationale: గ్రీకులోని కర్మణి ప్రయోగాన్ని తెలుగులో సహజమైన సంబంధార్థక నిర్మాణంతో వ్యక్తపరుస్తుంది; కర్తను అదనంగా పేర్కొనదు.
- source_word: γεγραμμένον
  choice: రాయబడి ఉంది
  rationale: పరిపూర్ణ కృదంత నిర్మాణంలోని, రాసి ఉన్న స్థితి లేదా ఫలిత భావాన్ని నిలుపుతుంది.
- source_word: Ἑβραϊστί
  choice: హెబ్రీ భాషలో
  rationale: గ్రీకు మూలంలోని ప్రత్యక్ష భాషా పేరును ప్రధాన పాఠ్యంలో నిలిపి, అరామిక్ అనే సంభావ్య అర్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: Ῥωμαϊστί
  choice: లాటిన్ భాషలో
  rationale: అక్షరార్థంగా ‘రోమన్ భాషలో’ అయినప్పటికీ, ఉద్దేశించిన భాష లాటిన్; తెలుగులో ఇదే స్పష్టమైన, సాధారణ రూపం.
- source_word: Ἑλληνιστί
  choice: గ్రీకు భాషలో
  rationale: భాషను సూచించే గ్రీకు క్రియావిశేషణానికి నేరమైన, సహజమైన తెలుగు అనువాదం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వచనంతో ఉన్న తార్కిక లేదా కథన సంబంధాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: యోహాను వాడుకలో Ἑβραϊστί అనువాదం
  choice: ప్రధాన పాఠ్యంలో ‘హెబ్రీ భాషలో’
  alternative: ‘అరామిక్ భాషలో’
  rationale: గ్రీకు మూలం ప్రత్యక్షంగా ‘హెబ్రీ’ అని చెబుతుంది. అయితే యోహాను వాడుకలో ఇది స్థానిక సెమిటిక్ భాష అయిన అరామిక్‌ను సూచించే అవకాశం ఉన్నందున, ఆ ప్రత్యామ్నాయాన్ని ప్రధాన పాఠ్యంలో భర్తీ చేయకుండా పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే మూలంలోని భాగార్థక భావం, కర్మణి భావం, భాషా పేర్ల మధ్య ఉన్న అర్థసంభావ్యతను కాపాడింది.
