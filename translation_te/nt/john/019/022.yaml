  rationale: నపుంసక ఏకవచన సంబంధ సర్వనామం ఇక్కడ పదార్థీకృతంగా ‘ఏది/దానిని’ అనే భావంలో ఉంది; ‘నేను రాసింది’ సహజమైన తెలుగులో ఆ భావాన్ని అందిస్తుంది.
- source_word: γέγραφα
