  rationale: గ్రీకు పరిపూర్ణ కాలం పూర్తయిన క్రియకు కొనసాగుతున్న ఫలితాన్ని సూచిస్తుంది. తెలుగులో ఒకే మూలక్రియను పునరావృతం చేస్తూ ‘రాసింది రాసిందే’ అనడం, వ్రాత ఇప్పటికే స్థిరమైందనే భావాన్నీ పిలాతు మాటలోని తుదినిర్ణయాన్నీ సహజంగా నిలుపుతుంది.
