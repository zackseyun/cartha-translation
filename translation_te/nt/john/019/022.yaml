  choice: “నేను రాసింది రాసిందే.”
  alternative: “నేను ఏది రాశానో అదే రాశాను.”
  rationale: ఎంచుకున్న తెలుగు రూపం పిలాతు ఆ శాసనాన్ని మార్చడానికి నిరాకరించిన స్థిరత్వాన్ని సూచిస్తుంది; అదే సమయంలో మూలంలోని పునరుక్తిని, పూర్తి అయి ఫలితం నిలిచి ఉన్న క్రియాభావాన్ని అనవసరమైన వివరణ లేకుండా కాపాడుతుంది.
