    text: 'లేదా, మరింత సంక్షిప్తంగా: “యేసును వారి మధ్యలో ఉంచి, ఆయనకు చెరో వైపున ఒక్కొక్కరిని సిలువ వేశారు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: అక్కడ
  rationale: ఇది స్థలాన్ని సూచించే సంబంధ క్రియావిశేషణం. ముందున్న వాక్యంతో సహజంగా అనుసంధానమయ్యేలా ‘అక్కడ’ అని అనువదించబడింది.
- source_word: ἐσταύρωσαν
  choice: సిలువ వేశారు
  rationale: యోహాను సువార్తలోని శ్రమానుభవ సందర్భంలో σταυρόω సిలువ మరణశిక్షను సూచిస్తుంది. శిక్ష అమలు విధానాన్ని అనవసరంగా మరింత నిర్దిష్టం చేయకుండా ప్రామాణికమైన తెలుగు పదబంధాన్ని వాడాం.
- source_word: μετ’ αὐτοῦ
  choice: ఆయనతోపాటు
  rationale: μετά + షష్ఠీ విభక్తి సహవాసాన్ని సూచిస్తుంది. ‘ఆయనతోపాటు’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ἄλλους δύο
  choice: మరో ఇద్దరిని
  rationale: గ్రీకు వాక్యం ‘ఇద్దరు ఇతరులను’ సూచిస్తుంది. సందర్భానుసారంగా వ్యక్తులనే సూచించే సహజ తెలుగు రూపం ‘మరో ఇద్దరిని’; మూలంలో లేని అదనపు గుర్తింపును చేర్చలేదు.
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: ఒకరిని ఒక వైపున, మరొకరిని మరో వైపున
  rationale: పునరుక్తమైన స్థలసూచక క్రియావిశేషణాలు ఇద్దరినీ ఎదురెదురు వైపుల ఉంచిన అమరికను చూపుతాయి. ఈ రూపం ఆ పంపిణీ భావాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: μέσον
  choice: మధ్యలో
  rationale: ఇక్కడ μέσον కేంద్ర స్థానాన్ని సూచిస్తుంది. ‘మధ్యలో’ spatial imageను సహజమైన తెలుగులో నిలుపుతుంది; ‘వారి మధ్య’ అని మూలంలో అంతర్లీనమైన సంబంధాన్ని మరింత స్పష్టీకరించదు.
- source_word: δὲ
  choice: ;
  rationale: δέ ఇక్కడ స్వల్ప అనుసంధానాన్ని, అమరికలోని తదుపరి అంశాన్ని సూచిస్తుంది. తెలుగులో ప్రత్యేక సంధిపదం కంటే అర్ధవిరామం సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: τὸν Ἰησοῦν
  choice: యేసు
  rationale: గ్రీకులో యేసే మధ్య స్థానంలో ఉంచబడినవాడని వాక్య నిర్మాణం చూపుతుంది. తెలుగులో ‘యేసు మధ్యలో ఉన్నాడు’ అనే రూపం సహజంగా అదే అర్థాన్ని ఇస్తుంది.
theological_decisions:
- issue: యేసు మిగతా ఇద్దరి మధ్య ఉంచబడ్డాడని ఎంత స్పష్టంగా చెప్పాలి
  choice: ‘ఒకరిని ఒక వైపున, మరొకరిని మరో వైపున … యేసు మధ్యలో ఉన్నాడు’ అని స్థల అమరికను విడిగా నిలిపాం.
  alternative: ‘యేసును వారి మధ్యలో ఉంచి, ఆయనకు చెరో వైపున ఒక్కొక్కరిని’ అని మరింత సంక్షిప్తంగా చెప్పవచ్చు.
  rationale: గ్రీకు మొదట ఇద్దరి పరస్పర వైపు స్థానాలను, తరువాత యేసు మధ్య స్థానాన్ని పేర్కొంటుంది. ఎంచుకున్న రూపం ‘వారి మధ్య’ అనే సందర్భసిద్ధమైన నిర్ధారణను మూలంలోని నిర్మాణంపై రుద్దకుండా దృశ్యాన్ని యథాతథంగా నిలుపుతుంది.
