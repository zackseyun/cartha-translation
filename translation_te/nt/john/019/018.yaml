translation:
  language: te
  text: అక్కడ వారు ఆయనను సిలువ వేశారు; ఆయనతో పాటు మరో ఇద్దరినీ సిలువ వేశారు—ఒకరిని ఒక వైపున, మరొకరిని మరో వైపున, యేసును మధ్యలో.[a]
  philosophy: optimal-equivalence
  footnotes:
