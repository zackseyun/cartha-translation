id: JHN.19.34
reference: John 19:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ εἷς τῶν στρατιωτῶν λόγχῃ αὐτοῦ τὴν πλευρὰν ἔνυξεν, καὶ ⸂ἐξῆλθεν εὐθὺς⸃ αἷμα καὶ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: te
  text: కానీ సైనికుల్లో ఒకడు ఈటెతో[a] ఆయన పక్కను పొడిచాడు. వెంటనే రక్తమూ నీళ్లూ బయటికి వచ్చాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బల్లెంతో.’
    reason: lexical_alternative
  - marker: b
    text: ‘రక్తమూ నీళ్లూ’ అనే మాటలను కొందరు ప్రతీకాత్మకంగా లేదా సంస్కారపరంగా అర్థం చేసుకుంటారు; మరికొందరు దీనిని భౌతికంగా జరిగినదాని వర్ణనగా తీసుకుంటారు. ఇక్కడ గ్రీకు పాఠ్యం దాని ప్రాముఖ్యతను వివరించదు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: కానీ
  rationale: ముందటి వాక్యంలో యేసు కాళ్లు విరగ్గొట్టకపోవడానికి విరుద్ధంగా జరిగిన చర్యను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: εἷς τῶν στρατιωτῶν
  choice: సైనికుల్లో ఒకడు
  rationale: గ్రీకులోని భాగార్థక నిర్మాణాన్ని నిలుపుతూ, ‘ఒక సైనికుడు’ అని సరళీకరించకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λόγχῃ
  choice: ఈటెతో
  rationale: సైనికుడు ఉపయోగించే పొడవైన మొనగల ఆయుధాన్ని సూచించే స్పష్టమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: αὐτοῦ τὴν πλευρὰν
  choice: ఆయన పక్కను
  rationale: సర్వనామం సందర్భానుసారంగా యేసును సూచిస్తుంది; πλευράకు సాధారణ అర్థమైన ‘పక్క’ను అతివివరణ లేకుండా నిలుపుతుంది.
- source_word: ἔνυξεν
  choice: పొడిచాడు
  rationale: మొనగల ఆయుధంతో గుచ్చడం లేదా పొడవడం అనే క్రియార్థాన్ని సహజంగా, గౌరవప్రదమైన కథన శైలిలో అందిస్తుంది.
- source_word: καὶ ⸂ἐξῆλθεν εὐθὺς⸃
  choice: వెంటనే ... బయటికి వచ్చాయి
  rationale: εὐθύς యొక్క తక్షణత్వాన్ని, καί సూచించే వరుస సంఘటనను సహజ తెలుగు వాక్యక్రమంలో నిలుపుతుంది.
- source_word: αἷμα καὶ ὕδωρ
  choice: రక్తమూ నీళ్లూ
  rationale: అసాధారణమైన ఈ జంట పదాలను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నేరుగా అనువదిస్తుంది; ‘నీళ్లు’ సాధారణ ఆధునిక తెలుగు వాడుక.
theological_decisions:
- issue: ‘రక్తమూ నీళ్లూ’ అనే మాటలను సంస్కారపరంగా లేదా శరీరశాస్త్రపరంగా అర్థం చేసి ప్రధాన పాఠ్యంలో వివరించాలా
  choice: ‘రక్తమూ నీళ్లూ’ అనే యథార్థ పదబంధాన్ని వివరణ లేకుండా నిలుపడం
  alternative: దీనిని బాప్తిస్మం మరియు ప్రభుభోజనానికి సూచనగా గానీ, గాయం వల్ల జరిగిన శారీరక పరిణామంగా గానీ స్పష్టీకరించడం
  rationale: ఈ వచనం జరిగిన దృశ్యాన్ని చెబుతుంది గాని దాని ప్రాముఖ్యతను వివరించదు. అందువల్ల ఏ ఒక్క వ్యాఖ్యాన సంప్రదాయాన్నీ ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని భావ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆయన’ యేసును గౌరవపూర్వకంగా సూచిస్తుంది. మూలంలోని రెండు సమన్విత క్రియలను తెలుగులో రెండు చిన్న వాక్యాలుగా ఇచ్చి స్పష్టతను పెంచినా సంఘటనల క్రమం, తక్షణత్వం యథాతథంగా నిలిపాం.
