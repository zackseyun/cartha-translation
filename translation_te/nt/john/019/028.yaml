source:
  edition: SBLGNT
  text: Μετὰ τοῦτο ⸀εἰδὼς ὁ Ἰησοῦς ὅτι ⸂ἤδη πάντα⸃ τετέλεσται ἵνα τελειωθῇ ἡ γραφὴ λέγει· Διψῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: te
  text: దీని తరువాత, అప్పటికే సమస్తం పూర్తయిందని యేసు తెలుసుకొని, లేఖనం నెరవేరేలా, “నాకు దాహంగా ఉంది” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: దీని తరువాత
  rationale: τοῦτο లోని ఏకవచన సూచనను నిలుపుతూ, యోహాను కథనశైలికి సహజమైన కాలసంబంధ మార్పుగా ఉంది.
- source_word: εἰδὼς
  choice: తెలుసుకొని
  rationale: యేసును విశేషించే సమకాలిక సందర్భార్థక కృదంతాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἤδη πάντα τετέλεσται
  choice: అప్పటికే సమస్తం పూర్తయిందని
  rationale: ἤδη యొక్క ‘అప్పటికే’ భావాన్ని, πάντα యొక్క సమగ్రతను, perfect రూపం సూచించే పూర్తయిన స్థితిని నిలుపుతుంది.
- source_word: ἵνα τελειωθῇ ἡ γραφή
  choice: లేఖనం నెరవేరేలా
  rationale: లేఖనానికి సంబంధించి τελειόω ను సహజంగా ‘నెరవేరు’ అని అందిస్తూ, ἵνα లోని ఉద్దేశం/ఫలితం మధ్య ఉన్న భావవ్యాప్తిని అతిగా నిర్ధారించకుండా ఉంచుతుంది.
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు కథనంలో సహజమైన భూతకాలంతో అందిస్తుంది.
- source_word: Διψῶ
  choice: నాకు దాహంగా ఉంది
  rationale: వర్తమాన దాహస్థితిని సాధారణ ఆధునిక తెలుగులో నేరుగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసు జ్ఞానం, సమస్తం పూర్తికావడం, లేఖనం నెరవేరడం మధ్య సంబంధం
  choice: సమస్తం అప్పటికే పూర్తయిందని యేసు తెలుసుకొని, లేఖనం నెరవేరేలా పలికాడని వాక్య నిర్మాణాన్ని నిలిపాం.
  alternative: ఇది ఉద్దేశాన్ని మాత్రమే కాక ఫలితాన్ని కూడా సూచిస్తుందని చదవవచ్చు.
  rationale: ἵνα యొక్క ఉద్దేశం/ఫలితం భావవ్యాప్తిని కృత్రిమంగా పరిష్కరించకుండా, τετέλεσται మరియు τελειωθῇ మధ్య ఉన్న సంబంధాన్నీ ఉద్వేగాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి స్పష్టంగా ఉండేలా, అయితే వాక్య గాంభీర్యాన్ని నిలుపుతూ అనువదించబడింది. అందించిన ఆంగ్ల పాఠంలోని [a] గుర్తుకు అనుబంధించిన గమనిక వాక్యంలోని స్థానంతో లేదా ఎంపికతో సరిపోలకపోవడంతో, మూల గ్రీకు ఆధారంగా అవసరం లేని పాదటిప్పణి చేర్చలేదు.
