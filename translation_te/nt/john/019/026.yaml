id: JHN.19.26
reference: John 19:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ ⸀μητρί· Γύναι, ⸀ἴδε ὁ υἱός σου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: te
  text: కాబట్టి యేసు తన తల్లిని, తాను ప్రేమించిన శిష్యుడు నిలబడి ఉండడాన్ని చూసి, తన తల్లితో, “స్త్రీమణీ,[a] ఇదిగో, నీ కుమారుడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘స్త్రీ’. ఇది గౌరవపూర్వకమైన సంబోధన; అవమానకరమైనది కాదు.
    reason: ‘స్త్రీమణీ’ గౌరవసూచక రూపం; మూలంలోని Γύναι యొక్క అక్షరార్థం మరియు గౌరవపూర్వక స్వరాన్ని స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భంతో ఉన్న కథన సంబంధాన్ని, దాని నుంచి వచ్చే పరిణామాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἰδὼν
  choice: చూసి
  rationale: అయోరిస్ట్ కృదంతం సూచించే ముందరి చర్యను సహజమైన తెలుగు వరుసలో చూపిస్తుంది.
- source_word: τὴν μητέρα
  choice: తన తల్లిని
  rationale: గ్రీకులో స్పష్టమైన స్వామ్యసర్వనామం లేకపోయినా, సందర్భంలో ఆమె యేసు తల్లి అని తెలుగులో సహజంగా స్పష్టం చేయబడింది.
- source_word: τὸν μαθητὴν
  choice: శిష్యుణ్ణి
  rationale: నిర్దిష్టమైన, కథనంలో గుర్తించదగిన శిష్యుణ్ణి సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో నిర్దిష్టత సందర్భం ద్వారా వ్యక్తమవుతుంది.
- source_word: παρεστῶτα
  choice: పక్కనే నిలబడి ఉన్న
  rationale: ఆ దృశ్యంలో సమీపంలో నిలిచి ఉన్న స్థితిని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὃν ἠγάπα
  choice: తాను ప్రేమించిన
  rationale: ప్రేమించినవాడు యేసేనని ప్రతిఫలక సర్వనామం ద్వారా సందేహం లేకుండా తెలియజేస్తూ, మూలంలోని సంబంధ ఉపవాక్యాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: λέγει
  choice: అని చెప్పాడు
  rationale: గ్రీకులోని కథన వర్తమానాన్ని తెలుగు కథనంలో సహజమైన భూతకాలంతో అనువదించింది; సంఘటన భావాన్ని మార్చదు.
- source_word: Γύναι
  choice: అమ్మా
  rationale: ఆధునిక తెలుగులో గౌరవపూర్వకమైన ప్రత్యక్ష సంబోధనగా సహజంగా వినిపిస్తుంది. అక్షరార్థమైన ‘స్త్రీ’ ఈ సందర్భంలో అనవసరంగా కఠినంగా లేదా అవమానకరంగా వినిపించవచ్చు; మూలపద రూపం, స్వరం పాదటిప్పణిలో ఇవ్వబడ్డాయి.
- source_word: ἴδε
  choice: ఇదిగో
  rationale: ఒక వ్యక్తిని చూపిస్తూ గంభీరంగా పరిచయం చేసే ఆజ్ఞార్థక సూచనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὁ υἱός σου
  choice: నీ కుమారుడు
  rationale: ఆ శిష్యుణ్ణి ఆమె కుమారునిగా సూచించే నేరమైన గుర్తింపును నిలుపుతుంది.
theological_decisions:
- issue: Γύναι అనే సంబోధనలో యేసు స్వరం
  choice: ప్రధాన పాఠ్యంలో గౌరవపూర్వకమైన సహజ తెలుగు సంబోధన ‘అమ్మా’ను వాడి, మూలంలోని అక్షరార్థాన్ని పాదటిప్పణిలో తెలియజేయడం.
  alternative: ‘స్త్రీ’ లేదా ‘స్త్రీమణీ’
  rationale: గ్రీకు పదం అగౌరవాన్ని సూచించదు. ‘స్త్రీ’ అక్షరార్థానికి దగ్గరైనా ఆధునిక తెలుగులో కుమారుడు తన తల్లిని అలా సంబోధించడం కఠినంగా వినిపించి మూల స్వరాన్ని తప్పుగా తెలియజేయవచ్చు. అయితే ‘అమ్మా’ మూలపదంలోని సాధారణ ‘woman’ రూపం కంటే సంబంధాన్ని మరింత స్పష్టంచేస్తుంది కాబట్టి, ఆ వ్యత్యాసాన్ని పాదటిప్పణి భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన కథన శైలి. ‘చెప్పాడు’ తెలుగు కథనానికి సహజత్వం ఇస్తుంది; ‘ఇదిగో’ మూలంలోని గంభీర సూచనను నిలుపుతుంది. పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో సంబోధన వెంట ఉంచబడింది.
