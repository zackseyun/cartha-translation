id: JHN.19.5
reference: John 19:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Ἰησοῦς ἔξω, φορῶν τὸν ἀκάνθινον στέφανον καὶ τὸ πορφυροῦν ἱμάτιον. καὶ λέγει αὐτοῖς· ⸀Ἰδοὺ ὁ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: te
  text: అప్పుడు యేసు ముళ్ల కిరీటాన్ని, ఊదారంగు వస్త్రాన్ని ధరించి బయటికి వచ్చాడు. పిలాతు వారితో, “ఇదిగో[a], ఈ మనిషి!” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చూడండి.” గ్రీకు Ἰδοὺ అనేది దృష్టిని ఆకర్షించే ఉద్ఘాటన; సందర్భానుసారం “ఇదిగో,” “చూడండి,” లేదా “చూడండి, ఇదిగో” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν οὖν ... ἔξω
  choice: అప్పుడు ... బయటికి వచ్చాడు
  rationale: οὖν ఇక్కడ కథన కొనసాగింపును సూచిస్తుంది; ἐξῆλθεν మరియు ἔξω కలిపి బయటికి రావడాన్ని నొక్కిచెబుతాయి. ఆధునిక తెలుగులో ‘అప్పుడు ... బయటికి వచ్చాడు’ సహజంగా ఉంటుంది.
- source_word: φορῶν
  choice: ధరించి
  rationale: కిరీటం, వస్త్రం రెండూ ఒంటిపై ఉన్న స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: τὸν ἀκάνθινον στέφανον
  choice: ముళ్ల కిరీటాన్ని
  rationale: ముళ్లతో చేసిన కిరీటమనే అర్థాన్ని స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: τὸ πορφυροῦν ἱμάτιον
  choice: ఊదారంగు వస్త్రాన్ని
  rationale: πορφυροῦν యొక్క రంగును నిలుపుతూ, ἱμάτιον సూచించే సాధారణ వస్త్రార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
- source_word: λέγει αὐτοῖς
  choice: పిలాతు వారితో ... అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన కథన భూతకాలంతో అందించాం. ముందరి సందర్భంలో మాట్లాడుతున్నవాడు పిలాతే కావడంతో, యేసే మాట్లాడాడనే అపార్థం రాకుండా పేరును స్పష్టం చేశాం.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: ప్రేక్షకుల దృష్టిని ఎదుట ఉన్న వ్యక్తిపై నిలిపే బహిరంగ ప్రదర్శనాత్మక ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ ἄνθρωπος
  choice: ఈ మనిషి
  rationale: ఎదుట చూపబడుతున్న నిర్దిష్ట పురుషుడైన యేసును సూచిస్తుంది. ‘మనిషి’ మూలంలోని సాధారణ మానవ పదాన్ని నిలుపుతుంది; ‘ఈ’ తెలుగు వాక్యంలో నిర్దిష్ట సూచనను సహజంగా చేస్తుంది.
theological_decisions:
- issue: పిలాతు పలికిన ὁ ἄνθρωπος పదబంధం
  choice: ఈ మనిషి
  alternative: మానవుడు
  rationale: ఈ సందర్భంలో పిలాతు ఎదుట నిలిచిన యేసును నిర్దిష్టంగా చూపిస్తున్నాడు. ప్రతినిధి మానవత్వం వంటి విస్తృత theological ప్రతిధ్వనులు ఉండవచ్చుగానీ, వాటిని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చకుండా ప్రత్యక్ష సందర్భార్థాన్ని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘మనుష్యుడు’ వంటి పాత రూపానికి బదులు ‘మనిషి’ వాడాం. గ్రీకు చారిత్రక వర్తమానం తెలుగులో అసహజంగా మారకుండా కథన భూతకాలాన్ని ఉపయోగించాం.
