  - severity: low
    issue: Closed spacing in “మాకొక.”
    rationale: Modern standard Telugu prose normally writes this as “మాకు ఒక.”
  - severity: low
    issue: Footnote b's alternative could better identify its idiomatic character.
    rationale: “ప్రకటించుకున్నాడు” is an interpretive paraphrase of the Greek idiom. “తన్ను తాను దేవుని కుమారుడని చెప్పుకున్నాడు” is a clearer idiomatic alternative while the main text preserves the more source-near expression.
