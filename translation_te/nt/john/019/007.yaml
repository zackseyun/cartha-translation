id: JHN.19.7
reference: John 19:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: te
  text: 'యూదులు అతనికి ఇలా జవాబిచ్చారు: “మాకు ఒక ధర్మశాస్త్రం ఉంది, ఆ ధర్మశాస్త్రం ప్రకారం[a] ఇతడు మరణించాలి; ఎందుకంటే ఇతడు తన్ను తాను దేవుని కుమారునిగా చేసుకున్నాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధర్మశాస్త్రం ప్రకారం.” గ్రీకులో “ధర్మశాస్త్రం” అనే పదం రెండుసార్లు వస్తుంది; రెండవసారి వచ్చిన పదం మొదట ప్రస్తావించినదానినే సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన్ను తాను దేవుని కుమారుడని చెప్పుకున్నాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: జవాబిచ్చారు
  rationale: కథన సందర్భంలో ప్రతిస్పందనను తెలిపే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: οἱ Ἰουδαῖοι
  choice: యూదులు
  rationale: గ్రీకు పదబంధంలోని సమూహ సూచనను నేరుగా నిలుపుతుంది; ఈ వచనం స్వయంగా వారిని కేవలం నాయకులుగా పరిమితం చేయదు.
- source_word: νόμον ἔχομεν
  choice: మాకొక ధర్మశాస్త్రం ఉంది
  rationale: మొదటి νόμον నిర్దేశక ఉపపదం లేకుండా ఉంది. ‘ఒక’ అనే రూపం దానిని ప్రతిబింబిస్తుండగా, యూదుల తోరా సంబంధిత న్యాయాధారాన్ని ‘ధర్మశాస్త్రం’ సహజంగా సూచిస్తుంది.
- source_word: κατὰ τὸν νόμον
  choice: ఆ ధర్మశాస్త్రం ప్రకారం
  rationale: రెండవ νόμον ముందు ప్రస్తావించిన ధర్మశాస్త్రాన్నే తిరిగి సూచిస్తుంది; ‘ఆ’ ఈ అన్వయాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: ὀφείλει ἀποθανεῖν
  choice: ఇతడు మరణించాలి
  rationale: ὀφείλει తెలిపే విధిబద్ధతను న్యాయపరమైన దావాగా సహజంగా వ్యక్తపరుస్తుంది; ‘ఇతడు’ సమీపంలో ఉన్న యేసును నిందితునిగా సూచించే మాటతీరుకు సరిపోతుంది.
- source_word: υἱὸν θεοῦ
  choice: దేవుని కుమారుడు
  rationale: తెలుగులో నిర్దేశక ఉపపదాలు లేనందున ఈ రూపం సందర్భానుసారంగా ప్రత్యేకమైన కుమారత్వ బిరుదును సహజంగా తెలియజేస్తుంది; దానిని అనేకమందిలో ఒక కుమారుడనే భావానికి పరిమితం చేయదు.
- source_word: ἑαυτὸν ἐποίησεν
  choice: తనను తాను …గా చేసుకున్నాడు
  rationale: నింద మోపుతున్నవారి అసలు మాటతీరును వ్యాఖ్యానాత్మకంగా ‘అని చెప్పుకున్నాడు’గా మార్చకుండా, గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
theological_decisions:
- issue: యేసుపై విరోధులు చేసిన ఆరోపణలో υἱὸν θεοῦ అనువాదం
  choice: దేవుని కుమారుడు
  alternative: దేవుని కుమారుల్లో ఒకడు
  rationale: యోహాను సందర్భంలో ఆరోపణ ప్రత్యేకమైన దైవిక కుమారత్వ దావాకు సంబంధించినది. తెలుగు రూపం ఆ బిరుదు బలాన్ని నిలుపుతూనే, ఇది విరోధుల ఆరోపణ అని వాక్యమే తెలియజేయనిస్తుంది.
- issue: ἑαυτὸν ἐποίησεν అనే ఆరోపణాత్మక పదబంధం
  choice: తనను తాను …గా చేసుకున్నాడు
  alternative: తాను …నని చెప్పుకున్నాడు
  rationale: ‘చెప్పుకున్నాడు’ భావాన్ని వివరిస్తుంది గాని గ్రీకు వాక్యంలోని ఉద్దేశపూర్వకమైన ‘తనను తాను చేసుకున్నాడు’ అనే ఉద్రిక్తతను తగ్గిస్తుంది. అందువల్ల మరింత రూపసన్నిహితమైన మాటతీరును ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. న్యాయ–తోరా సందర్భానికి ‘ధర్మశాస్త్రం’ను, విధిబద్ధతకు ‘మరణించాలి’ను ఎంచుకున్నాం. మూలంలోని ఆరోపణాత్మక మాటతీరు మరియు కుమారత్వానికి సంబంధించిన ధార్మిక ఉద్రిక్తతను వివరణతో సద్దుమణిగించకుండా నిలిపాం.
