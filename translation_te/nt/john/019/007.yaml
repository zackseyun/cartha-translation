- from: 'యూదులు అతనికి ఇలా జవాబిచ్చారు: “మాకొక ధర్మశాస్త్రం ఉంది. ఆ ధర్మశాస్త్రం ప్రకారం[a] ఇతడు మరణించాలి. ఎందుకంటే ఇతడు తనను తాను దేవుని కుమారుడిగా చేసుకున్నాడు[b].”'
