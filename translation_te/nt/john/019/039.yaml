id: JHN.19.39
reference: John 19:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦλθεν δὲ καὶ Νικόδημος, ὁ ἐλθὼν πρὸς ⸀αὐτὸν νυκτὸς τὸ πρῶτον, φέρων ⸀μίγμα σμύρνης καὶ ἀλόης ὡς λίτρας ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: te
  text: నికోదేము కూడా వచ్చాడు—ఇతడు ఇంతకుముందు రాత్రివేళ ఆయన దగ్గరకు వచ్చినవాడు.[b] అతడు దాదాపు వంద లిత్రాల[a] బరువున్న బోళము, అగరు కలిపిన సుగంధ మిశ్రమాన్ని తీసుకొచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఒక లిత్రా రోమా పౌండు; అది దాదాపు 327 గ్రాములు. వంద లిత్రాలు సుమారు 32–33 కిలోగ్రాములు.
    reason: cultural_note
  - marker: b
    text: ఇది నికోదేము ఇంతకుముందు రాత్రివేళ యేసు దగ్గరకు వచ్చిన ఘటనను గుర్తుచేస్తుంది; యోహాను 3:1–2 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ
  choice: కూడా వచ్చాడు
  rationale: δέ స్వల్ప అనుసంధానాన్ని, καί యోసేపుతో పాటు నికోదేము కూడా పాల్గొన్నాడనే భావాన్ని ఇస్తాయి. ఆధునిక తెలుగులో ‘కూడా వచ్చాడు’ సహజంగా ఉంది.
- source_word: Νικόδημος
  choice: నికోదేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: ఇతడు మొదట రాత్రివేళ ఆయన దగ్గరకు వచ్చినవాడు
  rationale: ఆర్టికల్‌తో కూడిన కృదంత పదబంధం నికోదేమును గుర్తిస్తుంది; νυκτός ‘రాత్రివేళ’ అని, τὸ πρῶτον ముందటి సందర్శనను గుర్తుచేసే ‘మొదట’ అని అనువదించాం.
- source_word: φέρων
  choice: తీసుకొచ్చాడు
  rationale: వచ్చేటప్పుడు వెంట తెచ్చినదాన్ని తెలిపే కృదంతాన్ని తెలుగులో సహజమైన సమాపక క్రియగా వ్యక్తం చేశాం.
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: బోళము, అగరు కలిపిన సుగంధద్రవ్యం
  rationale: σμύρνηకు సంప్రదాయ తెలుగు ‘బోళము’, ἀλόηకు సమాధి సంస్కారంలో ఉపయోగించే సుగంధ కలపను సూచించే ‘అగరు’ ఎంచుకున్నాం; ‘సుగంధద్రవ్యం’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: ὡς
  choice: దాదాపు
  rationale: పరిమాణం సుమారుగా ఉందని తెలిపే ὡς భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λίτρας ἑκατόν
  choice: వంద లిత్రాలు
  rationale: ప్రాచీన రోమా కొలమానాన్ని ఆధునిక ‘పౌండ్లు’గా మార్చకుండా లిప్యంతరీకరించి, దాని సుమారు ఆధునిక సమానాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: గుర్తింపు వాక్యభాగంలోని αὐτόν ఎవరిని సూచిస్తుంది?
  choice: ‘ఆయన’ యేసును సూచిస్తుంది
  alternative: సర్వనామానికి బదులు ‘యేసు’ అని స్పష్టంగా పేర్కొనడం
  rationale: యోహాను 3:1–2లో నికోదేము యేసును రాత్రివేళ కలిసిన ఘటనను కథనం తిరిగి గుర్తుచేస్తోంది. మూలంలోని సర్వనామ రూపాన్ని నిలుపుతూ గౌరవార్థక ‘ఆయన’ వాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథనశైలిని అనుసరించాం. పురాతన కొలమానాన్ని ప్రధాన పాఠ్యంలో నిలిపి పాదసూచికలో వివరించాం. ‘అగరు’ అనేది ఇక్కడ ఆధునిక అలోవెరా మొక్కను కాక, సమాధి సంస్కారంలో ఉపయోగించిన సుగంధ పదార్థాన్ని సూచిస్తుంది.
