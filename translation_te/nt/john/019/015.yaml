id: JHN.19.15
reference: John 19:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: te
  text: 'కాబట్టి వారు బిగ్గరగా కేకలు వేశారు: “అతన్ని తీసివేయండి! తీసివేయండి! అతన్ని సిలువ వేయండి!” పిలాతు వారితో, “మీ రాజును నేను సిలువ వేయాలా?” అని అడిగాడు. ముఖ్య యాజకులు, “కైసరు తప్ప మాకు రాజు లేడు” అని సమాధానమిచ్చారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκραύγασαν οὖν ἐκεῖνοι
  choice: అప్పుడు వారు బిగ్గరగా కేకలు వేస్తూ … అన్నారు
  rationale: ἐκραύγασαν సూచించే గట్టిగా అరవడాన్ని ‘బిగ్గరగా కేకలు వేస్తూ’ సహజంగా వ్యక్తం చేస్తుంది; οὖν ఇక్కడ కథనంలోని పరిణామాన్ని ‘అప్పుడు’ ద్వారా తెలియజేస్తుంది. ἐκεῖνοι లోని స్వల్ప ఉద్ఘాటనను తెలుగులో అసహజంగా చేయకుండా ‘వారు’గా ఇచ్చాం.
- source_word: Ἆρον ἆρον
  choice: ఇతన్ని తీసివేయండి! తీసివేయండి!
  rationale: పునరుక్త ఆజ్ఞలోని తీవ్రతను నిలుపుతూ, న్యాయవిచారణ సందర్భంలో αἴρω సూచించే తొలగింపును ‘తీసివేయండి’గా ఇచ్చాం. గ్రీకులో కర్మ స్పష్టంగా లేకపోయినా సందర్భం కోసం మొదటి ఆజ్ఞలో ‘ఇతన్ని’ చేర్చాం; రెండోసారి దాన్ని పునరావృతం చేయకుండా సహజమైన నినాద ధోరణిని కాపాడాం.
- source_word: σταύρωσον αὐτόν
  choice: సిలువ వేయండి
  rationale: రోమా మరణశిక్ష సందర్భంలో σταυρόωకు స్థిరమైన, చారిత్రకంగా తగిన తెలుగు పదబంధం ‘సిలువ వేయడం’. ముందున్న ‘ఇతన్ని’ వల్ల కర్మ స్పష్టంగా ఉంది.
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω;
  choice: మీ రాజును నేను సిలువ వేయాలా?
  rationale: మొదటి పురుష deliberative subjunctive లోని ప్రశ్నార్థక సవాలును ‘నేను … వేయాలా?’ సహజంగా నిలుపుతుంది; ‘మీ రాజు’ అనే పదబంధంలోని వ్యంగ్యభరితమైన ఒత్తిడి కూడా అలాగే ఉంటుంది.
- source_word: οἱ ἀρχιερεῖς
  choice: ముఖ్య యాజకులు
  rationale: బహువచన ἀρχιερεῖς ఆలయ యాజక నాయకులను సూచిస్తుంది; ‘ముఖ్య యాజకులు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: కైసరు తప్ప మాకు రాజు లేడు
  rationale: εἰ μὴ తెలిపే మినహాయింపు మరియు ఏకైక రాజకీయ విధేయతను ‘తప్ప’ నేరుగా కాపాడుతుంది; మూలంలోని సంక్షిప్తత, తీవ్రత నిలుస్తాయి.
theological_decisions:
- issue: ముఖ్య యాజకుల రాజకీయ విధేయత ప్రకటన
  choice: కైసరు తప్ప మాకు రాజు లేడు
  alternative: కైసరు కాక మాకు మరెవరూ రాజు లేడు
  rationale: వాక్యం చెప్పే సంపూర్ణ మినహాయింపును అలాగే ఉంచి, దాని విస్తృత దైవశాస్త్రీయ భావాన్ని అనువాదంలో వివరించలేదు. తద్వారా కథనంలోని ఉద్రిక్తతను పాఠకుడే గ్రహించేలా వదిలాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. జనసమూహ నినాదంలో చిన్న వాక్యాలు, పునరుక్తి ద్వారా మూలంలోని తీవ్రతను నిలిపాం. అందిన ఆంగ్ల పాదసూచిక గుర్తు మరియు దాని పాఠం పరస్పరం సరిపోకపోవడంతో, గ్రీకు మూలంలో ప్రత్యేక పాఠాంతర అవసరం లేకపోవడం వల్ల ఈ ముసాయిదాలో పాదసూచికను చేర్చలేదు.
