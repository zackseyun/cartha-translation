- from: కాబట్టి పిలాతు ఈ మాట విన్నప్పుడు ఇంకా ఎక్కువగా భయపడ్డాడు.
  to: పిలాతు ఈ మాట విన్నప్పుడు మరింత భయపడ్డాడు.
  rationale: The revision retains the temporal setting, the referentially neutral “this statement,” and the comparative increase in Pilate’s fear. It omits the lightly connective οὖν, as the English audit trail also does, and uses more natural Telugu word order.
