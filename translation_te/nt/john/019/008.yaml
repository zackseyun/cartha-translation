  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἤκουσεν ὁ Πιλᾶτος τοῦτον τὸν λόγον, μᾶλλον ἐφοβήθη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: te
  text: పిలాతు ఈ మాట విన్నప్పుడు మరింత భయపడ్డాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε
  choice: విన్నప్పుడు
  rationale: కాలసంబంధాన్ని తెలుగులో సహజంగా క్రియకు జోడించిన ‘విన్నప్పుడు’ ద్వారా వ్యక్తం చేశాం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాక్యంతో ఉన్న కథనాత్మక, అనుమానాత్మక అనుసంధానాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἤκουσεν
  choice: విన్నప్పుడు
  rationale: ఇక్కడ చెప్పబడిన సమాచారాన్ని వినడాన్ని సూచిస్తుంది; తెలుగు కథనంలో సహజమైన రూపం.
- source_word: ὁ Πιλᾶτος
  choice: పిలాతు
  rationale: వ్యక్తినామానికి ఆధునిక ప్రామాణిక తెలుగు రూపం.
- source_word: τοῦτον τὸν λόγον
  choice: ఈ మాట
  rationale: λόγος ఇక్కడ ముందుగా పలికిన నిర్దిష్ట విషయాన్ని సూచిస్తుంది; ‘ఈ మాట’ సహజంగా ఉండి దాని విషయసారాన్ని అనవసరంగా విస్తరించదు.
- source_word: μᾶλλον
  choice: ఇంకా ఎక్కువగా
  rationale: పిలాతు భయం మునుపటికంటే పెరిగిందనే తులనాత్మక తీవ్రతను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐφοβήθη
  choice: భయపడ్డాడు
  rationale: భయానికి లోనైన కథన సంఘటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; μᾶλλονతో కలిసి భయం పెరిగిన భావం వస్తుంది.
theological_decisions:
- issue: పిలాతు భయ స్వభావం
  choice: భయం పెరిగిందని మాత్రమే చెప్పడం
  alternative: రాజకీయ భయం లేదా దైవసంబంధమైన భయం అని నిర్దిష్టీకరించడం
  rationale: గ్రీకు పాఠం భయానికి కారణమైన అంతర్గత స్వభావాన్ని తేల్చదు. అందువల్ల రాజకీయ, మూఢనమ్మకసంబంధమైన, లేదా దైవసంబంధమైన అర్థాలలో దేనినీ అనువాదంలో బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్తతను, భయం పెరిగిన భావాన్ని నిలుపుకుంది.
