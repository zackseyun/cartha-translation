- from: కాబట్టి యూదులు[a], అది సిద్ధపాటు దినం[b] కావడంతో, విశ్రాంతి దినాన శరీరాలు సిలువ మీద ఉండిపోకూడదని—ఎందుకంటే ఆ విశ్రాంతి దినం ఎంతో ప్రత్యేకమైనది[c]—వారి కాళ్లు విరగగొట్టించి, వారిని తీసివేయించాలని[d] పిలాతును అడిగారు.
