id: JHN.19.31
reference: John 19:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: te
  text: కాబట్టి యూదులు[a], అది సిద్ధపాటు దినం[b] కావడంతో, విశ్రాంతి దినాన శరీరాలు సిలువపై ఉండిపోకూడదని—ఎందుకంటే ఆ విశ్రాంతి దినం ప్రత్యేక ప్రాముఖ్యమున్నది[c]—వారి కాళ్లు విరగగొట్టి, ఆ శరీరాలను తీసివేయించాలని[d] పిలాతును అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యోహాను సువార్తలో ‘యూదులు’ అనే మాట కొన్ని సందర్భాల్లో మరింత నిర్దిష్టంగా యూదయ అధికారులను లేదా యూదు నాయకులను సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అంటే, విశ్రాంతి దినానికి ముందు ఏర్పాట్లు చేసే దినం.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘ఆ విశ్రాంతి దినపు దినం గొప్పది’; అంటే ఆ విశ్రాంతి దినానికి ప్రత్యేక ప్రాముఖ్యం ఉంది.
    reason: alternative_reading
  - marker: d
    text: లేదా ‘సిలువ నుంచి దింపించాలని’ లేదా ‘అక్కడి నుంచి తొలగించాలని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: కాబట్టి యూదులు
  rationale: οὖν యొక్క అనుమానాత్మక/క్రమసూచక భావాన్ని ‘కాబట్టి’ సహజంగా తెలియజేస్తుంది. యోహాను సువార్తలో Ἰουδαῖοι సందర్భానుసారం యూదయవారిని లేదా యూదు అధికారులను సూచించగలిగినా, ఇక్కడ మూలపాఠం స్వయంగా అర్థాన్ని నాయకులకు మాత్రమే పరిమితం చేయదు.
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: అది సిద్ధపాటు దినం కావడంతో
  rationale: παρασκευή విశ్రాంతి దినానికి ముందు ఏర్పాట్లు చేసే దినాన్ని సూచిస్తుంది. ‘సిద్ధపాటు దినం’ ఆ చారిత్రక-కాలసంబంధ అర్థాన్ని స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ
  choice: విశ్రాంతి దినాన శరీరాలు సిలువ మీద ఉండిపోకూడదని
  rationale: ἵνα తో కూడిన ఉద్దేశ భావాన్ని ‘ఉండిపోకూడదని’ తెలియజేస్తుంది; ἐπὶ τοῦ σταυροῦను సహజమైన ‘సిలువ మీద’గా అనువదించింది.
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: ఎందుకంటే ఆ విశ్రాంతి దినం ఎంతో ప్రత్యేకమైనది
  rationale: μεγάλη అక్షరార్థంగా ‘గొప్పది’; ఇక్కడ ఆ విశ్రాంతి దినపు విశిష్ట ప్రాముఖ్యాన్ని సూచిస్తుంది. తెలుగులో ‘ఎంతో ప్రత్యేకమైనది’ అర్థాన్ని సహజంగా అందిస్తూ, ఏ నిర్దిష్ట ఆచారవ్యాఖ్యానాన్నీ చేర్చదు.
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: పిలాతును అడిగారు
  rationale: ἠρώτησαν ఇక్కడ అడగడం లేదా అభ్యర్థించడం అనే అర్థంలో ఉంది. అనుమతి కోరిన భావం సందర్భంలో స్పష్టమే గాని మూలంలో విడిగా లేదు.
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: వారి కాళ్లు విరగగొట్టించి
  rationale: κατάγνυμι ‘విరగగొట్టు’ అని అర్థం; సందర్భం సిలువవేయబడినవారి కాళ్లను సూచిస్తుంది. ‘విరగగొట్టించి’ పిలాతు ద్వారా ఆ చర్య చేయించాలనే అభ్యర్థనను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: καὶ ἀρθῶσιν
  choice: వారిని తీసివేయించాలని
  rationale: αἴρω ఎత్తడం, తొలగించడం, తీసివేయడం అనే విస్తృత అర్థాలు కలిగి ఉంది. ‘తీసివేయడం’ మూలంలోని విస్తృతిని కాపాడుతుంది; ‘సిలువ నుంచి దింపడం’ సందర్భసిద్ధమైన మరింత నిర్దిష్ట ప్రత్యామ్నాయం.
theological_decisions:
- issue: ఆ విశ్రాంతి దినానికి μεγάλη అనే వర్ణన
  choice: ఎంతో ప్రత్యేకమైనది
  alternative: ఆ విశ్రాంతి దినం గొప్ప దినం / అత్యంత ప్రాముఖ్యమైన విశ్రాంతి దినం
  rationale: ఆ దినానికి అసాధారణ ప్రాముఖ్యం ఉందని వాక్యం సూచిస్తుంది. ‘ప్రత్యేకమైనది’ ఆ భావాన్ని సాధారణ పాఠకునికి సహజంగా అందిస్తుంది; తరువాతి సంఘసంబంధ పదప్రయోగాన్ని దిగుమతి చేయదు.
- issue: యోహాను సువార్తలో Ἰουδαῖοι పదపు పరిధి
  choice: యూదులు
  alternative: యూదయవారు / యూదు అధికారులు
  rationale: ఈ పదం యోహాను సువార్తలో సందర్భానుసారం భిన్న పరిధులు కలిగి ఉంటుంది. ఈ వాక్యం నాయకులను మాత్రమే స్పష్టంగా పేర్కొననందున ప్రధాన పాఠంలో విస్తృతమైన అనువాదాన్ని ఉంచి, సందర్భసాధ్యమైన సంకుచిత అర్థాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘విశ్రాంతి దినం,’ ‘సిద్ధపాటు దినం’ వంటి పదాలు చారిత్రక సందర్భాన్ని స్పష్టంగా ఉంచుతాయి. దీర్ఘమైన గ్రీకు వాక్యంలోని కారణవివరణను డాష్‌ల మధ్య ఉంచి పఠనసౌలభ్యం కల్పించబడింది.
