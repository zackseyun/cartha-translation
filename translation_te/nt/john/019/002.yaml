    text: లేదా, “ఆయనకు ఊదారంగు వస్త్రం తొడిగారు.”
    reason: περιέβαλον అనే క్రియ వస్త్రాన్ని చుట్టూ కప్పడం లేదా ధరింపజేయడం అనే రెండింటినీ సూచించగలదు.
lexical_decisions:
- source_word: στρατιῶται
  choice: సైనికులు
  rationale: రోమా సైనిక సిబ్బందిని సూచించే సహజమైన, ఖచ్చితమైన ఆధునిక తెలుగు పదం.
- source_word: πλέξαντες
  choice: అల్లి
  rationale: ముళ్లను పెనవేసి కిరీటంగా చేసిన చర్యను సహజంగా తెలియజేస్తుంది; అసమాపక క్రియారూపం ప్రధాన చర్యకు ముందున్న కార్యక్రమాన్ని నిలుపుతుంది.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: ముళ్లతో ఒక కిరీటం
  rationale: ἐξ ఇక్కడ తయారీ పదార్థాన్ని సూచిస్తుంది; ‘ముళ్లతో’ తెలుగు వాడుకలో సహజంగా ఉండి, రాజరికాన్ని అపహాస్యం చేసే కిరీట దృశ్యాన్ని నిలుపుతుంది.
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: దాన్ని ఆయన తలపై పెట్టి
  rationale: గ్రీకు వాక్యనిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, కిరీటాన్నే సూచించేందుకు ‘దాన్ని’ స్పష్టంగా చేర్చబడింది.
- source_word: ἱμάτιον πορφυροῦν
  choice: ఊదారంగు వస్త్రాన్ని
  rationale: ἱμάτιον అనేది సాధారణంగా వస్త్రం లేదా పైవస్త్రాన్ని సూచించగలదు; ‘వస్త్రం’ దాని విస్తృత అర్థాన్ని అనవసరంగా ‘రాజవస్త్రం’ లేదా నిర్దిష్ట దుస్తుగా పరిమితం చేయదు. πορφυροῦν యొక్క రంగు భావాన్ని ‘ఊదారంగు’ తెలియజేస్తుంది.
- source_word: περιέβαλον αὐτόν
  choice: ఆయనకు ... కప్పారు
  rationale: వస్త్రాన్ని ఒకరి చుట్టూ వేయడం లేదా ధరింపజేయడం అనే భావాన్ని సందర్భానుకూలమైన సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: సైనికుల చర్యలలోని నకిలీ రాజరిక దృశ్యం
  choice: కిరీటం, ఊదారంగు వస్త్రం అనే మూలపాఠంలోని దృశ్యాలను నేరుగా అనువదించడం
  alternative: ‘రాజులా ఎగతాళి చేస్తూ’ వంటి వ్యాఖ్యానాత్మక మాటలను చేర్చడం
  rationale: అపహాస్య భావం సందర్భం ద్వారా స్పష్టమవుతుంది; గ్రీకు పాఠ్యంలో లేని వివరణను అనువాదంలో చేర్చకుండా దృశ్యంలోని అంతర్లీన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. యేసును సూచించే సర్వనామాలకు గౌరవబహువచన రూపాలు వాడబడ్డాయి. ‘వస్త్రం’ అనే విస్తృత పదం మూలంలోని ἱμάτιον ను అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
