source:
  edition: SBLGNT
  text: ἔλαβον οὖν τὸ σῶμα τοῦ Ἰησοῦ καὶ ἔδησαν ⸀αὐτὸ ὀθονίοις μετὰ τῶν ἀρωμάτων, καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: te
  text: కాబట్టి వారు యేసు దేహాన్ని తీసుకొని, సుగంధ ద్రవ్యాలతో కలిసి నారబట్టలతో చుట్టారు; యూదుల సమాధి ఆచారం ప్రకారం చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యూదయవాసులు” అని కూడా అనువదించవచ్చు; అయితే ఇక్కడ సందర్భం యూదుల సాధారణ సమాధి ఆచారాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον
  choice: తీసుకొని
  rationale: సమాధి కోసం యేసు దేహాన్ని తమ ఆధీనంలోకి తీసుకున్న భౌతిక చర్యను సందర్భానుసారంగా సహజంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి వాక్యం నుంచి వచ్చే కథనపరమైన పర్యవసానాన్ని నిలుపుతుంది.
- source_word: σῶμα
  choice: దేహాన్ని
  rationale: మృతదేహం అని మరింత స్పష్టీకరించకుండా, గ్రీకు పదంలోని గౌరవప్రదమైన సాధారణ అర్థాన్ని ఇస్తుంది.
- source_word: ἔδησαν
  choice: చుట్టారు
  rationale: δέω ప్రాథమికంగా కట్టడం/బంధించడం అయినా, నారబట్టలతో సమాధికి సిద్ధం చేసే ఈ సందర్భంలో ‘చుట్టారు’ ఆధునిక తెలుగులో సహజంగా చర్యను తెలియజేస్తుంది.
- source_word: ὀθονίοις
  choice: నారబట్టలతో
  rationale: సమాధి ఏర్పాటులో ఉపయోగించిన చిన్న నారవస్త్రాలు లేదా నారబట్టలను సూచిస్తుంది; ‘సమాధి వస్త్రాలు’ కంటే మూలంలోని పదార్థ సూచనను కాపాడుతుంది.
- source_word: ἀρώματα
  choice: సుగంధ ద్రవ్యాలతో
  rationale: సమాధి ఏర్పాటులో వాడే సువాసనగల పదార్థాలను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: καθὼς ἔθος ἐστὶν
  choice: ఆచారం అదే
  rationale: వివరించిన చర్య యూదుల స్థిరమైన సమాధి ఆచారానికి అనుగుణమని సహజ తెలుగులో చెబుతుంది.
- source_word: τοῖς Ἰουδαίοις
  choice: యూదులు
  rationale: ఇక్కడ భౌగోళికంగా యూదయవాసులను లేదా అధికారులను కాక, యూద ప్రజల సాధారణ మతసాంస్కృతిక ఆచారాన్ని సూచిస్తుంది.
- source_word: ἐνταφιάζειν
  choice: సమాధి కోసం సిద్ధం చేసే
  rationale: ఈ క్రియ కేవలం పాతిపెట్టడమే కాక అంత్యక్రియలకు లేదా సమాధికి సిద్ధం చేయడాన్నీ సూచించగలదు; సందర్భంలోని వస్త్రాలు, సుగంధ ద్రవ్యాల చర్యకు ఇది సరిపోతుంది.
theological_decisions:
- issue: τοῖς Ἰουδαίοις యొక్క పరిధి
  choice: యూదులు
  alternative: యూదయవాసులు
  rationale: ఈ సందర్భం యూదయ ప్రాంత నివాసులను మాత్రమే కాక యూదుల సాధారణ సమాధి ఆచారాన్ని సూచిస్తుంది; అందువల్ల జాతి-మతసాంస్కృతిక అర్థమే సందర్భానికి తగినది.
- issue: ἐνταφιάζειν చర్య యొక్క స్వభావం
  choice: సమాధి కోసం సిద్ధం చేసే
  alternative: పాతిపెట్టే
  rationale: వాక్యంలో చెప్పిన నారబట్టలు, సుగంధ ద్రవ్యాలు అంత్యక్రియల సిద్ధీకరణను వివరిస్తున్నాయి; కేవలం భూమిలో పాతిపెట్టడం లేదా సమాధిలో ఉంచడం అనే సంకుచిత అర్థాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘దేహం,’ ‘నారబట్టలు,’ ‘సుగంధ ద్రవ్యాలు’ సాధారణ పాఠకులకు అర్థమయ్యే పదాలు. మూలంలోని రెండు చర్యలను రెండు సహజ తెలుగు వాక్యాలుగా అమర్చాం; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచాం.
