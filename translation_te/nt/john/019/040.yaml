revisions:
- from: కాబట్టి వారు యేసు దేహాన్ని తీసుకొని, సుగంధ ద్రవ్యాలతో పాటు నారబట్టలతో చుట్టారు. యూదులు సమాధి కోసం సిద్ధం చేసే ఆచారం అదే.[a]
  to: కాబట్టి వారు యేసు దేహాన్ని తీసుకొని, సుగంధ ద్రవ్యాలతో కలిసి నారబట్టలతో చుట్టారు; యూదుల సమాధి ఆచారం ప్రకారం చేశారు.[a]
