review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys taking Jesus’s body, wrapping it in linen cloths with spices, and the reference to Jewish burial practice. However, “యూదులు సమాధి కోసం సిద్ధం చేసే ఆచారం అదే” reverses the Greek comparison awkwardly and can sound like an identifying assertion (“that is the custom”) rather than “as is the custom.”
  naturalness: The first sentence is clear and natural. The second sentence is grammatically possible but unnatural in modern standard Telugu and does not smoothly modify the preceding burial action.
  terminology: “దేహం,” “నారబట్టలు,” and “సుగంధ ద్రవ్యాలు” are suitable and appropriately respectful. “యూదుల సమాధి ఆచారం” clearly conveys the cultural-religious sense of τοῖς Ἰουδαίοις without over-specifying a geographic sense. The footnote preserves the viable alternative “యూదయవాసులు.”
  issues:
  - severity: medium
    issue: The customary-comparison clause is rendered as “యూదులు సమాధి కోసం సిద్ధం చేసే ఆచారం అదే.”
    rationale: καθὼς ἔθος ἐστὶν ... ἐνταφιάζειν means “as is the custom of the Jews in burial.” The Telugu wording is stilted and shifts the clause from a comparison governing the action to a separate, somewhat emphatic statement.
  revised_text: కాబట్టి వారు యేసు దేహాన్ని తీసుకొని, సుగంధ ద్రవ్యాలతో కలిసి నారబట్టలతో చుట్టారు; యూదుల సమాధి ఆచారం ప్రకారం చేశారు.[a]
  revised_footnotes:
  - marker: a
    text: “యూదయవాసులు” అని కూడా అనువదించవచ్చు; అయితే ఇక్కడ సందర్భం యూదుల సాధారణ సమాధి ఆచారాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: alternative_reading
  revision_rationale: 'The revision retains every principal source element while rendering καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν as a natural Telugu phrase that directly qualifies the preceding action: “according to the Jewish burial custom.” “చుట్టారు” remains a sound idiomatic rendering of ἔδησαν in this burial context.'
