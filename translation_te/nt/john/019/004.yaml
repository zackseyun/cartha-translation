language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ πάλιν ἔξω ὁ Πιλᾶτος καὶ λέγει αὐτοῖς· Ἴδε ἄγω ὑμῖν αὐτὸν ἔξω, ἵνα γνῶτε ὅτι ⸂οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: te
  text: 'పిలాతు మళ్లీ బయటికి వచ్చి వారితో ఇలా అన్నాడు: “ఇదిగో, అతనిపై ఎలాంటి అభియోగమూ నాకు కనిపించడం లేదని మీరు తెలుసుకోవడానికి అతన్ని మీ ఎదుటికి బయటకు తీసుకొస్తున్నాను.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిలో ఏ దోషమూ నాకు కనిపించడం లేదు.” గ్రీకు మాటను సంప్రదాయంగా ఇలా కూడా అనువదించవచ్చు. అయితే ఇక్కడ న్యాయవిచారణ సందర్భంలో అది యేసుకు వ్యతిరేకంగా చెల్లుబాటు అయ్యే అభియోగం లేదా కేసు ఏదీ లేదనే భావాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: బయటికి వచ్చి
  rationale: క్రియతో పాటు ఉన్న ἔξω స్థలదిశను స్పష్టంచేస్తుంది. సందర్భంలో పిలాతు లోపలి స్థలం నుంచి జనులున్న బయటికి వస్తున్నందున ‘బయటికి వచ్చి’ సహజమైన తెలుగు.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: చర్య పునరావృతమైందని తెలిపే సాధారణ ఆధునిక తెలుగు రూపం.
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమానకాలం ఉన్నా, తెలుగు కథనంలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: Ἴδε
  choice: చూడండి
  rationale: శ్రోతల దృష్టిని ఆకర్షించే ఆజ్ఞార్థక ప్రయోగాన్ని గౌరవప్రదమైన బహువచన సంబోధనతో సహజంగా అందిస్తుంది.
- source_word: ἄγω ... αὐτὸν ἔξω
  choice: అతన్ని మీ దగ్గరికి బయటికి తీసుకొస్తున్నాను
  rationale: ἄγω ఇక్కడ యేసును జనుల ఎదుటికి తీసుకురావడాన్ని సూచిస్తుంది. వర్తమాన చర్యను ‘తీసుకొస్తున్నాను’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα γνῶτε
  choice: మీరు తెలుసుకునేలా
  rationale: ἵνα తెలిపే ఉద్దేశ భావాన్ని ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: οὐδεμίαν αἰτίαν
  choice: ఏ నేరారోపణకూ ఆధారం ... లేదని
  rationale: αἰτία ఇక్కడ న్యాయవిచారణ సందర్భంలో ఆరోపణకు లేదా కేసుకు చెల్లుబాటు అయ్యే ఆధారాన్ని సూచిస్తుంది; విస్తృతమైన నైతిక ‘దోషం’ కంటే న్యాయపరమైన భావాన్ని ఇది స్పష్టంగా ఇస్తుంది.
- source_word: εὑρίσκω ἐν αὐτῷ
  choice: అతనిలో ... నాకు కనిపించడం లేదు
  rationale: గ్రీకు నిర్మాణంలోని ‘అతనిలో కనుగొనడం’ అనే రూపకాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, న్యాయపరమైన తెలుగులో అర్థమయ్యేలా రూపొందించబడింది.
theological_decisions:
- issue: యేసు గురించి పిలాతు చేసిన ప్రకటనలోని న్యాయపరమైన భావం
  choice: అతనిలో ఏ నేరారోపణకూ ఆధారం నాకు కనిపించడం లేదు
  alternative: అతనిలో ఏ దోషమూ నాకు కనిపించడం లేదు
  rationale: αἰτία ఈ విచారణ సందర్భంలో చెల్లుబాటు అయ్యే ఆరోపణ లేదా దానికి ఆధారాన్ని సూచిస్తుంది. అనువాదం పిలాతు ఇచ్చిన న్యాయపరమైన అంచనాను ముందుంచి, దానిని విస్తృతమైన సిద్ధాంత ప్రకటనగా మార్చదు; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. న్యాయపరమైన భావం స్పష్టంగా ఉండేలా పదబంధం ఎంచుకోబడింది; [a] గుర్తు ప్రధాన వాక్యంలో ఉంచబడింది.
