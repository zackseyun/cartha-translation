revisions:
- from: పిలాతు మళ్లీ బయటికి వచ్చి వారితో, “చూడండి, అతనిలో ఏ నేరారోపణకూ ఆధారం నాకు కనిపించడం లేదని మీరు తెలుసుకునేలా అతన్ని మీ దగ్గరికి బయటికి తీసుకొస్తున్నాను” అన్నాడు.[a]
  to: 'పిలాతు మళ్లీ బయటికి వచ్చి వారితో ఇలా అన్నాడు: “ఇదిగో, అతనిపై ఎలాంటి అభియోగమూ నాకు కనిపించడం లేదని మీరు తెలుసుకోవడానికి అతన్ని మీ ఎదుటికి బయటకు తీసుకొస్తున్నాను.”[a]'
  rationale: The revision retains the source's repetition marker (“మళ్లీ”), public outward movement, attention-getter, purpose clause, and Pilate's present-tense judicial declaration. It replaces an evidential formulation with “అభియోగం,” which more directly represents αἰτία, and improves the idiomatic expression of bringing Jesus out before the crowd.
