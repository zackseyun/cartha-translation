id: JHN.19.11
reference: John 19:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: te
  text: 'యేసు అతనికి ఇలా జవాబిచ్చాడు: “పైనుండి[a] నీకు ఇవ్వబడి ఉండకపోతే, నా మీద నీకు ఏ అధికారమూ ఉండేది కాదు. అందుచేత, నన్ను నీకు అప్పగించినవాడికి[b] మరింత పాపం ఉంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరలోకం నుండి.” గ్రీకు పదానికి అక్షరార్థంగా “పైనుండి” అని అర్థం; యోహాను రచనలో ఇది తరచుగా దైవిక మూలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: యేసును అప్పగించిన వ్యక్తి ఎవరో ఈ వచనం స్పష్టంగా చెప్పదు. దీనిని యూదా, కయఫా, లేదా విస్తృతంగా యూదా నాయకత్వం అని వివిధ రీతుల్లో అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: ఈ న్యాయవిచారణ సందర్భంలో పిలాతుకు అప్పగించబడిన పాలనా అధికారాన్ని ఇది సహజంగా తెలియజేస్తుంది; కేవలం బలాన్ని లేదా హక్కును మాత్రమే సూచించదు.
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: నా మీద నీకు ఏ అధికారమూ
  rationale: κατάతో కూడిన ఈ ప్రయోగం సందర్భానుసారంగా ‘నా మీద అధికారం’ అని సహజంగా వస్తుంది; ‘ఏ...మూ’ οὐδεμίαν యొక్క సంపూర్ణ నిరాకరణను నిలుపుతుంది.
- source_word: δεδομένον σοι
  choice: నీకు ఇవ్వబడి ఉండకపోతే
  rationale: ఇప్పటి అధికారానికి ముందే అది ఇవ్వబడిందనే భావాన్ని, షరతుతో కూడిన వాక్య నిర్మాణంలో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἄνωθεν
  choice: పైనుండి
  rationale: యోహాను రచనలో కనిపించే దైవిక మూలసూచనను నిలుపుతూ, మూలపదంలోని ‘పై నుండి’ అనే రూపాన్ని అనవసరంగా ‘పరలోకం నుండి’గా విస్తరించదు.
- source_word: διὰ τοῦτο
  choice: అందుచేత
  rationale: ముందటి వాక్యంతో ఉన్న కారణాత్మక-నిగమన సంబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ παραδούς
  choice: అప్పగించినవాడు
  rationale: యేసును అధికారుల చేతికి అప్పగించడాన్ని సూచిస్తుంది; ‘ద్రోహి’ అని అనువదించి ఆ వ్యక్తిని ముందుగానే యూదాగా నిర్ధారించదు.
- source_word: μείζονα ἁμαρτίαν
  choice: మరింత పాపం
  rationale: పిలాతు పాపంతో పోలిస్తే ఎక్కువ బాధ్యత లేదా అపరాధం ఉందనే తులనాత్మక భావాన్ని నిలుపుతుంది; గ్రీకులో లేని నిర్దిష్టతను బలవంతంగా చేర్చదు.
theological_decisions:
- issue: ἄνωθεν సూచించే పిలాతు అధికార మూలం
  choice: ‘పైనుండి’ అని అనువదించి దైవిక మూలసూచనను ఉంచడం
  alternative: ‘పరలోకం నుండి’ లేదా సాధారణంగా ‘ఉన్నతాధికారం నుండి’
  rationale: ఈ సందర్భం అధికారానికి పై నుండి వచ్చిన మూలాన్ని సూచిస్తుంది; అయితే వచనం చెప్పినదానికంటే విస్తృతమైన రాజకీయ సిద్ధాంతాన్ని అనువాదంలో చేర్చకుండా ఉండాలి.
- issue: ὁ παραδούς μέ σοι అనే వ్యక్తి గుర్తింపు
  choice: ‘నన్ను నీకు అప్పగించినవాడు’ అని గుర్తింపును అనిర్ణీతంగా ఉంచడం
  alternative: యూదా, కయఫా, లేదా యూదా నాయకత్వం
  rationale: గ్రీకు మూలం ఈ వచనంలో ఆ వ్యక్తిని పేరుతో గుర్తించదు; అనువాదం ఆ నిజమైన సందిగ్ధతను కాపాడుతుంది.
- issue: μείζονα ἁμαρτίανలో తులనాత్మక అపరాధం
  choice: ‘మరింత పాపం’
  alternative: ‘అతి గొప్ప పాపం’ లేదా పిలాతుకు పాపం లేదనే భావం
  rationale: మూలపాఠం ఎక్కువ పాపాన్ని పోల్చుతుంది; అది పిలాతును పూర్తిగా నిర్దోషిగా ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఏ అధికారమూ ఉండేది కాదు’ అనే నిర్మాణం గ్రీకు ప్రతికల్పన భావాన్ని సహజంగా అందిస్తుంది. మూలంలోని సందిగ్ధతలను పాదసూచికలతో కాపాడుతూ, ప్రధాన పాఠంలో అనవసర వ్యాఖ్యానాన్ని చేర్చలేదు.
