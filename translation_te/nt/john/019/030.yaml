id: JHN.19.30
reference: John 19:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: te
  text: కాబట్టి యేసు ఆ పుల్లని ద్రాక్షారసాన్ని[a] స్వీకరించినప్పుడు, “పూర్తయింది”[b] అని చెప్పి, తల వంచి తన ఆత్మను అప్పగించాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పులిసిన ద్రాక్షారసాన్ని,” “ద్రాక్షారసపు వెనిగర్‌ను.” గ్రీకు పదం పుల్లబడిన ద్రాక్షారసాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “సమాప్తమైంది,” “నెరవేరింది.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “చివరి ఊపిరి విడిచాడు.” గ్రీకు పదబంధం నేరుగా “ఆత్మను అప్పగించాడు” అని చెబుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: కాబట్టి … స్వీకరించినప్పుడు
  rationale: ὅτε లోని కాలసంబంధమైన ‘అప్పుడు/ఎప్పుడు’ భావాన్ని, οὖν లోని కథన పర్యవసాన భావాన్ని సహజమైన ఆధునిక తెలుగులో కలిపి తెలియజేస్తుంది.
- source_word: ἔλαβεν
  choice: స్వీకరించినప్పుడు
  rationale: λα（μβάνω ఇక్కడ యేసుకు అందించిన పానీయాన్ని ఆయన స్వీకరించడాన్ని సూచిస్తుంది. ‘తీసుకున్నప్పుడు’ కూడా సాధ్యమే, కానీ ‘స్వీకరించినప్పుడు’ సందర్భానికి మరింత సహజంగా సరిపోతుంది.
- source_word: τὸ ὄξος
  choice: ఆ పుల్లని ద్రాక్షారసం
  rationale: ὄξος పులిసిపోయి పుల్లగా ఉన్న చవక ద్రాక్షారసాన్ని సూచిస్తుంది. ఆధునిక పాఠకులు సాధారణ వంట వినిగర్‌గా అపార్థం చేసుకోకుండా ‘పుల్లని ద్రాక్షారసం’ అని అనువదించబడింది.
- source_word: Τετέλεσται
  choice: పూర్తయింది
  rationale: τελέω యొక్క పరిపూర్ణ కాలరూపం పూర్తయిన కార్యం మరియు దాని నిలిచివున్న ఫలితాన్ని సూచిస్తుంది. దేనిని పూర్తి చేశారో వాక్యం స్పష్టంగా చెప్పదు; ‘పూర్తయింది’ ఆ అనిర్దిష్టతను నిలుపుతుంది.
- source_word: κλίνας τὴν κεφαλήν
  choice: తల వంచి
  rationale: గ్రీకు భూతకాల కృదంతం ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది. ‘తల వంచి’ తెలుగులో సహజంగా ఉండి ఆ క్రమాన్ని కాపాడుతుంది.
- source_word: παρέδωκεν
  choice: అప్పగించాడు
  rationale: παραδίδωμι యొక్క ‘అప్పగించు’ అనే మౌలిక భావాన్ని నిలుపుతూ, πνεῦμαతో కలిసి యేసు మరణాన్ని గంభీరంగా వర్ణిస్తుంది.
- source_word: τὸ πνεῦμα
  choice: తన ఆత్మను
  rationale: πνεῦμαకు ‘ఆత్మ’ లేదా ‘ఊపిరి’ అనే భావాలు ఉండవచ్చు. ఇక్కడ ‘తన ఆత్మను’ అనేది గ్రీకు పదబంధపు వ్యక్తిగత, ఆధ్యాత్మిక గంభీరతను కాపాడుతూ తెలుగులో సహజంగా ఉంది.
theological_decisions:
- issue: παρέδωκεν τὸ πνεῦμα అనే పదబంధాన్ని కేవలం మరణానికి వాడే నుడికారంగా అనువదించాలా, లేక దాని వ్యక్తిగతమైన ఆత్మసంబంధ భావాన్ని నిలుపాలా?
  choice: తన ఆత్మను అప్పగించాడు
  alternative: చివరి ఊపిరి విడిచాడు; మరణించాడు
  rationale: గ్రీకు వాక్యం కేవలం ‘మరణించాడు’ అనేదానికంటే నిర్దిష్టమైనది. ఈ అనువాదం యేసు మరణంలోని ఉద్దేశపూర్వకతకు ఉండగల యోహాను సువార్త సంబంధ ప్రతిధ్వనిని నిలుపుతుంది; అదే సమయంలో వచనం చెప్పని సిద్ధాంత వివరణను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి వాడబడింది. ‘పూర్తయింది’ అనే కర్తలేని రూపం గ్రీకులో దేనిని పూర్తి చేశారో స్పష్టంగా చెప్పని స్వభావాన్ని కాపాడుతుంది. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
