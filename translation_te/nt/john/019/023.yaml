id: JHN.19.23
reference: John 19:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: te
  text: అప్పుడు సైనికులు యేసును సిలువ వేసినప్పుడు, ఆయన పైవస్త్రాలను[a] తీసుకొని, ఒక్కొక్క సైనికునికి ఒక్కొక్క భాగం చొప్పున నాలుగు భాగాలు చేశారు; అంగీని కూడా తీసుకున్నారు. ఆ అంగీ కుట్టులేనిది[c]; అది పై నుండి మొత్తం నేయబడినది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వస్త్రాలను.” గ్రీకు పదం సాధారణంగా దుస్తులన్నిటినీ సూచించగలదు; అయితే ఇక్కడ అంగీ వేరుగా ప్రస్తావించబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పైనుంచి.” ఈ సందర్భంలో ఇది అంగీ పైభాగం నుంచి నేయబడిందని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “వస్త్రమంతా ఒకే ముక్కగా నేయబడినది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: సైనికులు
  rationale: οὖν కథనాన్ని ముందుకు నడిపే అనుసంధాన పదం. తెలుగులో వాక్యక్రమం, ‘తర్వాత’ అనే కాలసూచన ద్వారా కథన సంబంధం సహజంగా స్పష్టమవుతుంది; బలమైన తార్కిక నిష్కర్షను సూచించే పదాన్ని చేర్చలేదు.
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: యేసును సిలువ వేసిన తర్వాత
  rationale: ὅτεతో కూడిన భూతకాల క్రియ, తరువాత చెప్పే చర్యలకు ముందు సిలువ వేయడం జరిగిందని సూచిస్తుంది. ‘తర్వాత’ తెలుగులో ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: ఆయన పైవస్త్రాలను తీసుకొని
  rationale: ἱμάτια సాధారణంగా వస్త్రాలు అని అర్థమిచ్చినా, ఇదే వాక్యంలో χιτών వేరుగా ప్రస్తావించబడినందున ‘పైవస్త్రాలు’ ఆ వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος
  choice: ఒక్కొక్క సైనికునికి ఒక్కొక్క భాగం చొప్పున నాలుగు భాగాలు చేశారు
  rationale: నాలుగు భాగాలు చేయడం, ప్రతి సైనికునికి ఒక భాగం రావడం రెండింటినీ స్పష్టంగా, సహజమైన తెలుగు నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: καὶ τὸν χιτῶνα
  choice: అంగీని కూడా తీసుకున్నారు
  rationale: χίτων శరీరానికి దగ్గరగా ధరించే వస్త్రం. ‘అంగీ’ సాధారణ పాఠకులకు అర్థమయ్యే పదం; ముందు క్రియను పునరుక్తి చేయడం ద్వారా గ్రీకు సంక్షిప్త నిర్మాణం తెలుగులో స్పష్టమవుతుంది.
- source_word: ἦν δὲ ὁ χιτὼν ἄραφος
  choice: ఆ అంగీ కుట్టులేనిది
  rationale: ἄραφος అక్షరార్థంగా ‘కుట్టు లేనిది’; ‘కుట్టులేనిది’ నిర్మాణ లక్షణాన్ని నేరుగా తెలియజేస్తుంది. δέ ఇక్కడ స్వల్ప కథన మార్పును సూచిస్తుంది; ప్రత్యేక విరోధార్థక పదం అవసరం లేదు.
- source_word: ἐκ τῶν ἄνωθεν
  choice: పై నుంచి
  rationale: వస్త్ర నిర్మాణ సందర్భంలో ἄνωθεν వస్త్రపు పైభాగం నుంచి నేయడాన్ని సూచించే అవకాశమే ఎక్కువ. అయితే ‘పైనుంచి/పై నుంచి’ అనే మూలపద ambiguityని పాదసూచికలో ఉంచాం.
- source_word: ὑφαντὸς δι’ ὅλου
  choice: వస్త్రమంతా నేయబడింది
  rationale: ὑφαντός ‘నేయబడినది’; δι’ ὅλου మొత్తం విస్తృతిలో కొనసాగిన నిర్మాణాన్ని సూచిస్తుంది. తెలుగు వాక్యం ఆ సమగ్రతను సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: కుట్టులేని అంగీకి ప్రతీకాత్మక లేదా సిద్ధాంతపరమైన అర్థం ఆపాదించే అవకాశం
  choice: వస్త్ర నిర్మాణాన్ని మాత్రమే వర్ణనాత్మకంగా అనువదించడం
  alternative: యాజక వస్త్రాలకు సూచనగా లేదా సంఘ ఐక్యతకు ప్రతీకగా అనువాదంలోనే వివరించడం
  rationale: ఈ వచనం సైనికుల చర్యలను, అంగీ నిర్మాణాన్ని మాత్రమే ప్రత్యక్షంగా చెబుతుంది. సాధ్యమైన ప్రతీకాత్మక వ్యాఖ్యానాన్ని మూలపాఠం స్పష్టంగా ప్రకటించనందున అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘పైవస్త్రాలు’–‘అంగీ’ అనే వ్యత్యాసం మూలంలోని ἱμάτια–χιτών భేదాన్ని నిలుపుతుంది. మూలంలో లేని ప్రతీకాత్మక లేదా మతసంప్రదాయ వ్యాఖ్యానాన్ని చేర్చలేదు.
