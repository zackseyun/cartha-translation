revisions:
- from: సైనికులు యేసును సిలువ వేసిన తర్వాత, ఆయన పైవస్త్రాలను[a] తీసుకొని, ఒక్కొక్క సైనికునికి ఒక్కొక్క భాగం చొప్పున నాలుగు భాగాలు చేశారు. అంగీని కూడా తీసుకున్నారు. ఆ అంగీ కుట్టులేనిది[c]; పై నుంచి[b] వస్త్రమంతా నేయబడింది.
  to: అప్పుడు సైనికులు యేసును సిలువ వేసినప్పుడు, ఆయన పైవస్త్రాలను[a] తీసుకొని, ఒక్కొక్క సైనికునికి ఒక్కొక్క భాగం చొప్పున నాలుగు భాగాలు చేశారు; అంగీని కూడా తీసుకున్నారు. ఆ అంగీ కుట్టులేనిది[c]; అది పై నుండి మొత్తం నేయబడినది[b].
  rationale: The revision uses ‘అప్పుడు’ for the narrative connective and ‘సిలువ వేసినప్పుడు’ for ὅτε, avoiding the stronger ‘after.’ It keeps the tunic as the grammatical subject in the final clause and adjusts footnote c into a genuine lexical alternative. No symbolic or doctrinal interpretation is introduced.
