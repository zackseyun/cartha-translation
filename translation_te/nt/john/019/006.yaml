id: JHN.19.6
reference: John 19:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: te
  text: కాబట్టి ప్రధాన యాజకులూ అధికారులూ ఆయనను చూసినప్పుడు, “సిలువ వేయండి! సిలువ వేయండి!” అని కేకలు వేశారు. పిలాతు వారితో, “మీరే ఆయనను తీసుకుని సిలువ వేయండి[a]; ఎందుకంటే ఆయనపై ఏ అభియోగమూ నాకు కనిపించడం లేదు[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను మీరే తీసుకొని సిలువ వేయండి.” గ్రీకు మూలంలో “మీరు” అనే సర్వనామం స్పష్టంగా ఉండి, దానికి ఉద్ఘాటన ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయనలో ఏ తప్పూ నాకు కనిపించడం లేదు.” గ్రీకు పదం నేరారోపణను లేదా దానికి ఆధారాన్ని సూచించవచ్చు; ఇక్కడ న్యాయపరమైన భావమే ప్రధానమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: కాబట్టి … చూసినప్పుడు
  rationale: ὅτε యొక్క కాలసూచనను ‘చూసినప్పుడు’తో, οὖν యొక్క కథన కొనసాగింపు/పర్యవసాన భావాన్ని ‘కాబట్టి’తో సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: యెరూషలేములోని యాజక నాయకవర్గాన్ని సూచించే బహువచనానికి ఖచ్చితమైన, సుపరిచితమైన పదబంధం.
- source_word: ὑπηρέται
  choice: అధికారులు
  rationale: యూదు నాయకుల కింద పనిచేసే అధికారిక సిబ్బందిని సూచిస్తుంది; మూలపాఠం చెప్పనంతగా వారిని ఆలయ సేవకులు లేదా కాపలాదారులు అని నిర్దిష్టం చేయదు.
- source_word: ἐκραύγασαν λέγοντες
  choice: అని కేకలు వేశారు
  rationale: బిగ్గరగా చేసిన బహిరంగ అరుపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; λέγοντες తెలిపే మాటల విషయాన్ని ‘అని’ అనుసంధానిస్తుంది.
- source_word: Σταύρωσον σταύρωσον
  choice: సిలువ వేయండి! సిలువ వేయండి!
  rationale: ఆజ్ఞ యొక్క తీవ్రతను, పునరుక్తిని యథాతథంగా నిలుపుతుంది; గ్రీకులో సందర్భం ద్వారా తెలిసే కర్మను తెలుగులో విడిచిపెట్టడం సహజంగా ఉంటుంది.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: మీరే ఆయనను తీసుకెళ్లి
  rationale: స్పష్టంగా ఉన్న ὑμεῖς యొక్క విరుద్ధ ఉద్ఘాటనను ‘మీరే’ నిలుపుతుంది. సందర్భానికి అనుగుణంగా తీసుకుపోయే భావాన్ని ‘తీసుకెళ్లి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σταυρώσατε
  choice: సిలువ వేయండి
  rationale: ఆజ్ఞారూపాన్ని నేరుగా, సుపరిచితమైన తెలుగులో అందిస్తుంది.
- source_word: αἰτίαν
  choice: ఆయనపై మోపడానికి తగిన నేరారోపణ
  rationale: న్యాయవిచారణ సందర్భంలో ఈ పదానికి ఉన్న ‘అభియోగం/అభియోగానికి ఆధారం’ అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు గురించి పిలాతు చేసిన నిర్దోషిత్వ ప్రకటన
  choice: ఆయనపై మోపడానికి తగిన నేరారోపణ ఏదీ నాకు కనిపించడం లేదు
  alternative: ఆయనలో ఏ తప్పూ నాకు కనిపించడం లేదు
  rationale: ఇది విస్తృతమైన సిద్ధాంత ప్రకటనగా కాక, పిలాతు చేసిన న్యాయపరమైన నిర్ధారణగా వినిపించేలా αἰτία యొక్క న్యాయస్థాన భావాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; ‘తప్పు’ అనే విస్తృత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథనశైలిని వాడింది. ‘మీరే’ ద్వారా పిలాతు తనను వారితో విరుద్ధంగా ఉంచిన ఉద్ఘాటనను నిలిపింది. ప్రధాన పాఠంలోని [a], [b] సూచికలు సంబంధిత పాదసూచికల దగ్గరే ఉంచబడ్డాయి.
