id: JHN.19.10
reference: John 19:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ὁ Πιλᾶτος· Ἐμοὶ οὐ λαλεῖς; οὐκ οἶδας ὅτι ἐξουσίαν ἔχω ⸂ἀπολῦσαί σε καὶ ἐξουσίαν ἔχω σταυρῶσαί⸃ σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: te
  text: 'అప్పుడు పిలాతు ఆయనతో ఇలా అన్నాడు: “నాతో మాట్లాడవా? నిన్ను విడుదల చేయడానికి నాకు అధికారం[a] ఉందనీ, నిన్ను సిలువ వేయడానికి నాకు అధికారం ఉందనీ నీకు తెలియదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అధికారం’కు బదులుగా ‘శక్తి’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం ἐξουσία అధికారం, హక్కు లేదా శక్తిని సూచించగలదు. ఇక్కడ పిలాతు న్యాయపాలనా సందర్భంలో మాట్లాడుతున్నందున ‘అధికారం’ ప్రాధాన్య అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν αὐτῷ ὁ Πιλᾶτος
  choice: అప్పుడు పిలాతు ఆయనతో ... అన్నాడు
  rationale: οὖν ఇక్కడ కథనాన్ని ముందుకు నడిపే అనుసంధాన పదం; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా క్రమసూచక భావాన్ని అందిస్తుంది. αὐτῷను ‘ఆయనతో’గా స్పష్టంగా నిలిపాం.
- source_word: Ἐμοὶ οὐ λαλεῖς;
  choice: నాతో మాట్లాడవా?
  rationale: ముందుకు వచ్చిన Ἐμοὶలోని ఉద్ఘాటనను ‘నాతో’ ద్వారా నిలిపి, మందలింపు కలిగిన అలంకార ప్రశ్నను సహజ తెలుగులో వ్యక్తం చేశాం.
- source_word: οὐκ οἶδας ὅτι
  choice: '... ఉందనీ ... ఉందనీ నీకు తెలియదా?'
  rationale: οἶδα యొక్క ప్రాథమిక అర్థమైన ‘తెలుసు’ను ప్రశ్నార్థక రూపంలో ఉంచి, ὅτι పరిచయం చేసే విషయవస్తువును తెలుగు ఉద్ధరణ నిర్మాణంతో తెలిపాం.
- source_word: ἐξουσίαν ἔχω
  choice: నాకు అధికారం ఉంది
  rationale: న్యాయపాలనా సందర్భంలో ἐξουσίαకు ‘అధికారం’ సరైనది; ‘శక్తి’ అనే ప్రత్యామ్నాయం సాధ్యమైనా అది ముడి సామర్థ్యాన్ని ఎక్కువగా సూచించవచ్చు.
- source_word: ἀπολῦσαί σε
  choice: నిన్ను విడుదల చేయడానికి
  rationale: న్యాయ సందర్భంలో ἀπολύω అంటే విడుదల చేయడం; నిర్దోషిగా తీర్పు ఇవ్వడం అనే అదనపు భావాన్ని చేర్చలేదు.
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: నిన్ను సిలువ వేయడానికి నాకు అధికారం ఉంది
  rationale: గ్రీకులో పునరుక్తమైన ἐξουσίαν ἔχωను తెలుగులోనూ పునరావృతం చేసి, విడుదల చేయడం మరియు సిలువ వేయడం మధ్య పిలాతు ఉద్ఘాటించిన వ్యత్యాసాన్ని నిలిపాం.
theological_decisions:
- issue: పిలాతు తనకు ఉందని చెప్పిన ἐξουσία స్వభావం
  choice: ‘అధికారం’గా అనువదించి, అది పిలాతు చేసిన వాదనగానే ఉంచడం
  alternative: ‘శక్తి’ లేదా ‘హక్కు’
  rationale: ఈ వాక్యం పిలాతు వాదనను నివేదిస్తుంది; అతని అధికారం స్వతంత్రమైనదని లేదా సంపూర్ణమైనదని కథకుడు ధృవీకరించడం లేదు. తదుపరి వచనంలో యేసు ఇచ్చే సమాధానంతో ఏర్పడే వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. యేసును సూచించేందుకు ‘ఆయనతో’ వాడినా, ప్రత్యక్ష సంభాషణలో సహజమైన ఏకవచన ‘నీవు’ రూపాలను (‘నాతో’, ‘నిన్ను’, ‘నీకు’) నిలిపాం. గ్రీకు పునరుక్తిని భావోద్రేకం కోసం సంరక్షించాం.
