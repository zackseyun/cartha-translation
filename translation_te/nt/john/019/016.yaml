  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε οὖν παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ. Παρέλαβον ⸀οὖν τὸν ⸀Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
translation:
  language: te
  text: అప్పుడు అతడు ఆయనను సిలువ వేయబడటానికి వారికి అప్పగించాడు.[b] కాబట్టి వారు యేసును తీసుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘వారికి,’ ‘వారు’ అనే పదాలు ఎవరిని సూచిస్తున్నాయో ఈ వచనం స్పష్టంగా పేరుపెట్టి చెప్పదు; సమీప సందర్భమే దానికి మార్గదర్శకం.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: అప్పుడు
  rationale: ఈ రెండు అవ్యయాలు ముందటి సంఘటనల ఫలితంగా కథలో తదుపరి దశను సూచిస్తున్నాయి. తెలుగులో అసహజంగా రెండు అనుసంధాన పదాలను పోగు చేయకుండా ‘అప్పుడు’ అని సహజంగా వ్యక్తం చేశాం.
- source_word: παρέδωκεν
  choice: అప్పగించాడు
  rationale: మరొకరి ఆధీనానికి లేదా చర్యకు ఒకరిని అప్పగించడం అనే న్యాయపరమైన, కథనపరమైన భావాన్ని ఇది సహజంగా నిలుపుతుంది.
- source_word: αὐτὸν
  choice: యేసును
  rationale: గ్రీకులో సర్వనామం ఉన్నా, తెలుగులో మొదటి వాక్యంలో ‘అతడు ... అతనిని’ అంటే సూచన అస్పష్టంగా ఉండవచ్చు. వెంటనే వచ్చే గ్రీకు వాక్యంలో ఉన్న ‘యేసు’ అనే పేరును ముందుకు తీసుకువచ్చి అర్థాన్ని మార్చకుండా స్పష్టత కల్పించాం.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: గ్రహీతలైన గుంపును వచనం పేరుపెట్టి చెప్పనందున సాధారణ బహువచన సర్వనామాన్నే ఉంచాం.
- source_word: ἵνα σταυρωθῇ
  choice: సిలువ వేయబడేందుకు
  rationale: ἵνα ఉద్దేశాన్ని, σταυρωθῇ లోని కర్మణి ప్రయోగాన్ని సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: Παρέλαβον
  choice: తీసుకున్నారు
  rationale: ఇక్కడ యేసును తమ ఆధీనంలోకి తీసుకోవడం లేదా వెంట తీసుకెళ్లడం అనే సందర్భానుకూల భావాన్ని సాధారణ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: యేసును అప్పగించిన చర్యకు తరువాతి చర్యను పర్యవసానంగా అనుసంధానించే భావాన్ని స్పష్టంగా చూపుతుంది.
- source_word: Ἰησοῦν
  choice: యేసును
  rationale: తెలుగులో స్థిరపడిన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
theological_decisions:
- issue: αὐτοῖς (‘వారికి’) మరియు Παρέλαβον లో అంతర్లీనంగా ఉన్న ‘వారు’ ఎవరనే ప్రశ్న
  choice: ప్రధాన పాఠ్యంలో ‘వారికి/వారు’ అనే అస్పష్ట సూచననే నిలుపడం
  alternative: ప్రధాన యాజకులు, వారి అధికారులు, లేదా రోమా సైనికులు అని నిర్దిష్టంగా పేర్కొనడం
  rationale: ఈ వచనంలోని గ్రీకు పాఠ్యం ఆ గుంపును పేరుపెట్టి గుర్తించదు. సందర్భం ఆధారంగా వివిధ గుర్తింపులు ప్రతిపాదించగలిగినా, అనువాదంలో ఒకదానిని నిర్ణయించడం మూలపాఠ్యంలోని సూచనాత్మక తెరచుదనాన్ని తొలగిస్తుంది.
- issue: ἵνα σταυρωθῇ లో ఉద్దేశం మరియు కర్మణి ప్రయోగం
  choice: ‘సిలువ వేయబడేందుకు’
  alternative: ‘సిలువ వేయడానికి’ లేదా ‘వారు సిలువ వేయడానికి’
  rationale: ఎవరు సిలువ వేస్తారో వాక్య నిర్మాణంలో నేరుగా చేర్చకుండా, యేసు సిలువ వేయబడాలనే ఉద్దేశాన్ని మరియు గ్రీకు కర్మణి రూపాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. అస్పష్ట సర్వనామ గుంపును నిర్దిష్ట వర్గంగా మార్చలేదు; కర్మణి ప్రయోగం మరియు ఉద్దేశ భావాన్ని సాధ్యమైనంత సహజంగా నిలిపాం.
