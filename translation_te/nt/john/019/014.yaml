id: JHN.19.14
reference: John 19:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: te
  text: అది పస్కా పండుగకు సిద్ధపడే రోజు; దాదాపు ఆరవ గంట అయింది[a]. అతడు యూదులతో[b], “ఇదిగో, మీ రాజు!” అని అంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గంటలను ఎలా లెక్కించారనే దానిని బట్టి, ఆధునిక కాలమానం ప్రకారం ఇది బహుశా ‘దాదాపు మధ్యాహ్నం పన్నెండు గంటలు’ కావచ్చు.
    reason: cultural_note
  - marker: b
    text: ఈ సందర్భంలో ‘యూదులు’ అనే మాట మరింత నిర్దిష్టంగా యూదయ అధికారులను లేదా యూదు నాయకులను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  choice: పస్కా పండుగకు సిద్ధపడే రోజు
  rationale: παρασκευή అనే పదం పండుగ లేదా విశ్రాంతిదినానికి ముందు సిద్ధపడే దినాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం కాలసూచనను సాధారణ పాఠకులకు స్పష్టంగా చేస్తూ, τοῦ πάσχα తో ఉన్న సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: సమయం దాదాపు ఆరవ గంట
  rationale: ὡς లోని సుమారు అనే భావాన్ని ‘దాదాపు’ నిలుపుతుంది; ప్రాచీన కాలగణనను ముందుగానే ఆధునిక గడియార సమయంగా నిర్ణయించకుండా ‘ఆరవ గంట’ అనే మూల సంస్కృతి వ్యక్తీకరణను ఉంచుతుంది.
- source_word: λέγει
  choice: అని అంటాడు
  rationale: యోహాను ఉపయోగించిన చారిత్రక వర్తమాన కాలపు సజీవతను తెలుగులోనూ నిలుపుతుంది.
- source_word: τοῖς Ἰουδαίοις
  choice: యూదులతో
  rationale: మూలంలోని సాధారణ పదాన్ని నేరుగా ఉంచుతుంది; సందర్భానుసారంగా అది మరింత నిర్దిష్టంగా యూదయ అధికారులను లేదా యూదు నాయకులను సూచించే అవకాశాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: Ἴδε
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే బహిరంగ ప్రకటనలోని గంభీరతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: మీ రాజు
  rationale: గ్రీకు స్వామ్యార్థాన్ని సహజంగా తెలుగులో అందిస్తూ, పిలాతు మాటలలోని రాజకీయ తీవ్రతను నిలుపుతుంది.
theological_decisions:
- issue: యోహాను సువార్తలో ‘యూదులు’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘యూదులు’ అని ఉంచడం
  alternative: యూదయ అధికారులు; యూదు నాయకులు
  rationale: τοῖς Ἰουδαίοις అనే మూలపదం ఈ వాక్యంలో సూచనను స్పష్టంగా పరిమితం చేయదు. అందువల్ల ప్రధాన పాఠ్యం దానిని నేరుగా అనువదిస్తుంది; సందర్భంలో సాధ్యమైన సంకుచిత అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: ‘ఆరవ గంట’ అనే ప్రాచీన కాలసూచన
  choice: ప్రధాన పాఠ్యంలో మూల సంస్కృతి వ్యక్తీకరణను నిలుపడం
  alternative: దాదాపు మధ్యాహ్నం పన్నెండు గంటలు
  rationale: ప్రాచీన గంటల లెక్కింపు గురించి ఉన్న అనిశ్చితిని అనువాదంలోనే పరిష్కరించకుండా, ὡς అనే సుమారు భావంతో కూడిన మూల రూపాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘ఆరవ గంట’ మరియు చారిత్రక వర్తమాన కాలం వంటి మూల లక్షణాలను ఉద్దేశపూర్వకంగా నిలిపింది.
