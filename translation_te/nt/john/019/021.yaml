id: JHN.19.21
reference: John 19:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: te
  text: కాబట్టి యూదుల[a] ప్రధాన యాజకులు పిలాతుతో, “‛యూదుల రాజు’ అని రాయవద్దు. దానికి బదులుగా, ‘నేను యూదుల రాజును[b]’ అని అతడు చెప్పాడని రాయండి” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదయ ప్రాంతవాసుల.” గ్రీకు పదం సందర్భాన్ని బట్టి సాధారణంగా యూదులను లేదా మరింత ప్రత్యేకంగా యూదయ ప్రాంతానికి చెందినవారిని సూచించవచ్చు. ఇదే పదం ఈ వాక్యంలో “యూదుల రాజు” అనే బిరుదులో కూడా రెండుసార్లు వస్తుంది.
    reason: alternative_reading
  - marker: b
    text: “నేను యూదుల రాజును” అనే మాటను “నేను ఆ యూదుల రాజును” అనే నిర్దిష్ట భావంతో కూడా అర్థం చేసుకోవచ్చు. గ్రీకులో ఇక్కడ “రాజు” ముందు నిర్దిష్ట ఉపపదం లేదు; తెలుగులో సాధారణంగా రెండు భావాలకూ ఇదే సహజ రూపం వస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: అన్నారు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పునరావృతమైన మాటను సూచించగలదు. అయితే ఈ ప్రత్యక్ష సంభాషణలో సహజమైన ఆధునిక తెలుగులో ‘అన్నారు’ సందర్భానుకూలంగా ఉంటుంది; ‘చెబుతూ ఉన్నారు’ ఇక్కడ కృత్రిమంగా వినిపిస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాక్యంతో ఉన్న కథనాత్మక-తార్కిక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఇది ఒకేసారి అనేకమంది ప్రధాన యాజకుల పదవిలో ఉన్నారని కాక, ప్రముఖ యాజక అధికారులను సూచించే ప్రామాణిక తెలుగు రూపం.
- source_word: τῶν Ἰουδαίων
  choice: యూదుల
  rationale: శ్రమానుభవ వృత్తాంతంలోని రాజకీయ-మతపరమైన బిరుదైన ‘యూదుల రాజు’ను సహజంగా నిలుపుతుంది. ‘యూదయ ప్రాంతవాసుల’ అనే ప్రాంతీయ అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: Μὴ γράφε
  choice: రాయవద్దు
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థక రూపంలోని నిషేధాన్ని సూటిగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀλλ’ ὅτι
  choice: దానికి బదులుగా ... అని రాయండి
  rationale: వారు కోరిన సవరణలోని వ్యతిరేకతను తెలుగులో స్పష్టంగా చేస్తుంది. రెండవ భాగంలో గ్రీకులో అధ్యాహారంగా ఉన్న ‘రాయండి’ని తెలుగులో సహజత్వం కోసం వ్యక్తం చేశాం.
- source_word: ἐκεῖνος
  choice: ఇతడు
  rationale: సాధారణ ‘అతడు’ కంటే సూచనాత్మక దూరాన్ని కొంత నిలుపుతూ, సందర్భంలో అతిగా అవమానార్థాన్ని చేర్చదు.
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: నేను యూదుల రాజును
  rationale: తెలుగులో సహజమైన విధేయ నామవాచక నిర్మాణం. గ్రీకులో βασιλεύςకు నిర్దిష్ట ఉపపదం లేకపోయినా, తెలుగు వ్యాకరణంలో ఆ భేదాన్ని ఇదే నిర్మాణంలో ప్రత్యేకంగా చూపలేం.
theological_decisions:
- issue: యోహాను శ్రమానుభవ సందర్భంలో Ἰουδαῖος/Ἰουδαίων అర్థం
  choice: యూదులు
  alternative: యూదయ ప్రాంతవాసులు / యూదయులు
  rationale: ఇక్కడ ‘యూదుల రాజు’ స్థిరమైన రాజకీయ-మతపరమైన బిరుదుగా ఉంది. అయినప్పటికీ గ్రీకు పదానికి కొన్ని సందర్భాల్లో ప్రాంతీయమైన ‘యూదయవారు’ అనే అర్థం ఉండగలదని పాదసూచికలో వెల్లడించడం ద్వారా నిజమైన అర్థసాధ్యతను నిలుపుతున్నాం.
- issue: విధేయ బిరుదులో నిర్దిష్టత
  choice: నేను యూదుల రాజును
  alternative: నేనే యూదుల రాజును
  rationale: గ్రీకులో βασιλεύς ముందు ఉపపదం లేదు. ‘నేనే’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని ఉద్ఘాటన చేరుతుంది; అందువల్ల దానిని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. అంతర్గత ఉద్ధరణలను స్పష్టంగా ఉంచి, మూలంలోని సూచనాత్మక ‘ఇతడు’ను నిలిపాం.
