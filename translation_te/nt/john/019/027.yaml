  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: te
  text: తర్వాత ఆయన ఆ శిష్యునితో, “ఇదిగో, నీ తల్లి” అని చెప్పాడు. ఆ సమయం నుండి ఆ శిష్యుడు ఆమెను తన ఇంటిలో చేర్చుకున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: ఇదిగో
  rationale: సంబోధితుని దృష్టిని ఆకర్షించే గ్రీకు ఆజ్ఞార్థక రూపాన్ని సహజమైన, గంభీరమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπ’ ἐκείνης τῆς ὥρας
  choice: ఆ సమయం నుంచే
  rationale: ఆ క్షణం నుంచి మొదలైన చర్యను సూచించే కాలార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τὰ ἴδια
  choice: తన ఇంటికి
  rationale: అక్షరార్థంగా ‘తనవాటిలోకి/తన సొంత స్థలానికి’ అనే భావం ఉన్నప్పటికీ, ఈ సందర్భంలో తన గృహ సంరక్షణలోకి స్వీకరించాడనే భావాన్ని సాధారణ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు మాటలో తల్లి–కుమార సంబంధ ప్రకటన
  choice: “ఇదిగో, నీ తల్లి” అని నేరుగా ఉంచడం
  alternative: దీనిని ‘ఆమెను నీ తల్లిగా చూసుకో’ వంటి వివరణాత్మక ఆజ్ఞగా విస్తరించడం
  rationale: మూలంలోని సంక్షిప్తతను, సంబంధ ప్రకటనలోని భావగాంభీర్యాన్ని కాపాడుతూ, ప్రత్యేక సిద్ధాంతార్థాన్ని పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్య గౌరవాన్ని కాపాడే శైలి. మూలంలోని రెండు వాక్యాల క్రమం, సంక్షిప్తత నిలుపబడ్డాయి.
