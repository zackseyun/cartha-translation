revisions:
- from: తర్వాత ఆయన ఆ శిష్యునితో, “ఇదిగో, నీ తల్లి” అని చెప్పాడు. ఆ సమయం నుంచే ఆ శిష్యుడు ఆమెను తన ఇంటికి తీసుకెళ్లాడు.
  to: తర్వాత ఆయన ఆ శిష్యునితో, “ఇదిగో, నీ తల్లి” అని చెప్పాడు. ఆ సమయం నుండి ఆ శిష్యుడు ఆమెను తన ఇంటిలో చేర్చుకున్నాడు.
