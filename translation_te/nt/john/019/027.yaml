review_pass:
  verdict: revise
  source_fidelity: The first sentence accurately retains the sequence and direct address of εἶτα λέγει τῷ μαθητῇ and Ἴδε ἡ μήτηρ σου. In the second, ‘తన ఇంటికి తీసుకెళ్లాడు’ can merely mean that he escorted her to a house; εἰς τὰ ἴδια means that the disciple received her into his own household/home. ‘ఆ సమయం నుంచే’ adds emphasis not explicit in the Greek; ‘ఆ సమయం నుండి’ is closer to ἀπ’ ἐκείνης τῆς ὥρας.
  naturalness: The Telugu is clear and modern. ‘తన ఇంటిలో చేర్చుకున్నాడు’ is idiomatic and communicates receiving her into his household rather than only taking her somewhere.
  terminology: ‘ఇదిగో, నీ తల్లి’ appropriately preserves the concise demonstrative statement without adding an interpretive command or doctrinal implication. No specialized theological terminology or footnotes are required.
  issues:
  - severity: medium
    issue: The rendering of εἰς τὰ ἴδια is too narrow and potentially temporary.
    rationale: ‘తన ఇంటికి తీసుకెళ్లాడు’ primarily describes taking her to his house, whereas the Greek idiom describes taking her into his own home/household. ‘తన ఇంటిలో చేర్చుకున్నాడు’ preserves the reception sense.
  - severity: low
    issue: ‘నుంచే’ introduces extra emphasis.
    rationale: The source says ‘from that hour,’ without an explicit emphatic particle. ‘నుండి’ expresses the temporal sense directly.
  revised_text: తర్వాత ఆయన ఆ శిష్యునితో, “ఇదిగో, నీ తల్లి” అని చెప్పాడు. ఆ సమయం నుండి ఆ శిష్యుడు ఆమెను తన ఇంటిలో చేర్చుకున్నాడు.
  revised_footnotes: []
  revision_rationale: The revision preserves the source’s concise wording and neutral theological force while making the final clause reflect the Greek sense of receiving her into his own home or household. It also removes unneeded temporal emphasis.
