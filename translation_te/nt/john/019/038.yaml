source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: te
  text: ఈ సంగతుల తరువాత, అరిమతయ నుండి వచ్చిన యోసేపు యేసు శిష్యుడే అయినా, యూదుల[a] భయంవల్ల తన శిష్యత్వాన్ని రహస్యంగా ఉంచుకున్నవాడు. అతడు యేసు శరీరాన్ని తీసుకుపోవడానికి అనుమతి ఇవ్వమని పిలాతును అడిగాడు. పిలాతు అనుమతి ఇచ్చాడు. కాబట్టి అతడు వచ్చి యేసు శరీరాన్ని తీసుకుపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ సందర్భంలో ఇది మరింత నిర్దిష్టంగా యేసును వ్యతిరేకించిన యూదయలోని యూదా నాయకులు లేదా అధికారవర్గాన్ని సూచించవచ్చు. యోహాను తరచుగా ‘యూదులు’ అనే పదాన్ని ఈ సందర్భపరమైన అర్థంలో ఉపయోగిస్తాడు; యూదులందరినీ విచక్షణ లేకుండా సూచించడానికి కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: ఈ సంగతులు జరిగిన తరువాత
  rationale: కాలక్రమాన్ని సూచించే యోహాను శైలిని, అలాగే ταῦτα అనే బహువచనాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Ἰωσὴφ ἀπὸ Ἁριμαθαίας
  choice: అరిమతయ నుండి వచ్చిన యోసేపు
  rationale: ἀπό సూచించే స్థలమూలాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ
  choice: యేసు శిష్యుడై ఉండి కూడా
  rationale: యోసేపు నిజంగా యేసు శిష్యుడనే భావాన్ని నిలుపుతూ, తరువాతి వ్యతిరేక భావంతో సహజంగా కలుపుతుంది.
- source_word: κεκρυμμένος
  choice: ఆ సంగతి రహస్యంగా ఉంచాడు
  rationale: దాచబడినది అతని శిష్యత్వమని సందర్భం ద్వారా స్పష్టం చేస్తూ, పరిపూర్ణ కృదంతంలోని కొనసాగిన గోప్యతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: యూదులకు భయపడి
  rationale: భయమే అతని శిష్యత్వాన్ని దాచడానికి కారణమని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: యేసు దేహాన్ని తీసుకెళ్లనివ్వమని
  rationale: ἵνα ఉద్దేశ్యాన్ని మరియు αἴρω యొక్క ఇక్కడి ‘తీసివేయడం/తీసుకెళ్లడం’ భావాన్ని సహజమైన అభ్యర్థన రూపంలో అందిస్తుంది.
- source_word: ἐπέτρεψεν
  choice: అనుమతి ఇచ్చాడు
  rationale: క్రియలోని అనుమతిని మంజూరు చేసే అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: కాబట్టి అతడు వచ్చి యేసు దేహాన్ని తీసుకెళ్లాడు
  rationale: οὖν యొక్క ఫలిత/క్రమ సంబంధాన్ని నిలుపుతూ, αἴρωకు ముందున్న అనువాదంతో పదసామ్యాన్ని కాపాడుతుంది; తెలుగులో సందిగ్ధత నివారించేందుకు సర్వనామం బదులు ‘యేసు’ను పునరుక్తి చేస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో τῶν Ἰουδαίων అనే పదబంధపు సూచన
  choice: ప్రధాన పాఠ్యంలో ‘యూదులు’ అని ఉంచి, సందర్భానుసారమైన భావాన్ని పాదసూచికలో వివరించడం
  alternative: యూదా మతాధికారులు / యూదయవారు
  rationale: గ్రీకు పాఠ్యంలోని విస్తృత పదాన్ని ప్రధాన పాఠ్యంలో సంకుచితం చేయకుండా నిలుపుతుంది; అదే సమయంలో ఇది యూదులందరినీ విచక్షణ లేకుండా సూచిస్తుందని అపార్థం కాకుండా సందర్భాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గంభీరమైన వచనశైలి. మూలంలోని కాలక్రమం, యోసేపు శిష్యత్వం మరియు దాని గోప్యత మధ్య ఉన్న ఉద్వేగం, అలాగే ‘యూదులు’ అనే సందర్భపరంగా సంక్లిష్టమైన పదం నిలుపబడ్డాయి.
