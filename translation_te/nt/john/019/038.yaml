    issue: గోప్యంగా ఉన్నది ఏమిటో ప్రధాన వాక్యంలో స్పష్టంగా లేదు; మూలంలోని κεκρυμμένος స్థితి విడి క్రియగా మారింది.
    rationale: ‘ఆ సంగతి రహస్యంగా ఉంచాడు’లో ‘ఆ సంగతి’ అస్పష్టంగా ఉంటుంది. మూలం యోసేపు యేసు శిష్యుడుగా గోప్యంగా ఉన్నాడనే సమాచారాన్ని అదే నామవాచక వివరణలో ఇస్తుంది.
