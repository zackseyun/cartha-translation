revisions:
- from: ఈ సంగతులు జరిగిన తరువాత, అరిమతయ నుండి వచ్చిన యోసేపు యేసు శిష్యుడై ఉండి కూడా, యూదులకు[a] భయపడి ఆ సంగతి రహస్యంగా ఉంచాడు. అతడు యేసు దేహాన్ని తీసుకెళ్లనివ్వమని పిలాతును అడిగాడు. పిలాతు అనుమతి ఇచ్చాడు. కాబట్టి అతడు వచ్చి యేసు దేహాన్ని తీసుకెళ్లాడు.
  to: ఈ సంగతుల తరువాత, అరిమతయ నుండి వచ్చిన యోసేపు యేసు శిష్యుడే అయినా, యూదుల[a] భయంవల్ల తన శిష్యత్వాన్ని రహస్యంగా ఉంచుకున్నవాడు. అతడు యేసు శరీరాన్ని తీసుకుపోవడానికి అనుమతి ఇవ్వమని పిలాతును అడిగాడు. పిలాతు అనుమతి ఇచ్చాడు. కాబట్టి అతడు వచ్చి యేసు శరీరాన్ని తీసుకుపోయాడు.
  rationale: 'సవరణ మూలంలోని ఒకే వాక్య ప్రవాహాన్ని మెరుగ్గా నిలుపుతుంది: యోసేపు యేసు శిష్యుడు, అయితే యూదుల భయంవల్ల ఆ శిష్యత్వం గోప్యంగా ఉంది; ఆ తరువాత అతడు పిలాతు వద్ద శరీరాన్ని తీసుకుపోవడానికి అనుమతి కోరాడు. ‘యూదులు’ అనే మూలపదాన్ని ప్రధాన పాఠ్యంలో అలాగే ఉంచి, దాని సందర్భపరమైన సంభావ్య సూచనను మాత్రమే పాదసూచికలో తెలియజేశారు.'
