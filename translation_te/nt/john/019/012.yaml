id: JHN.19.12
reference: John 19:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: te
  text: అప్పటి నుండి పిలాతు ఆయనను విడుదల చేయడానికి ప్రయత్నిస్తూనే ఉన్నాడు.[a] అయితే యూదులు[b] కేకలు వేస్తూ, “ఈయనను విడుదల చేస్తే, నీవు కైసరుకు మిత్రుడు కావు. తనను తాను రాజుగా చేసుకునే ప్రతివాడూ కైసరును ఎదిరిస్తున్నాడు” అన్నారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దీనివల్ల పిలాతు ఆయనను విడుదల చేయడానికి ప్రయత్నిస్తూనే ఉన్నాడు.” గ్రీకు పదబంధం కాలార్థంలో “అప్పటి నుండి” అని గానీ, కారణార్థంలో “దీనివల్ల” అని గానీ అర్థమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: యోహాను సువార్తలో “యూదులు” అనే మాట సందర్భానుసారంగా యూదులందరినీ కాక, ప్రత్యేకంగా యూదయ ప్రాంతపు అధికారులను లేదా యేసును వ్యతిరేకించిన కొందరు యూదులను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, “కైసరుకు వ్యతిరేకంగా మాట్లాడుతున్నాడు,” లేదా “కైసరును వ్యతిరేకిస్తున్నాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: అప్పటి నుండి
  rationale: ఈ సందర్భంలో కథన పురోగతిని సూచించే కాలార్థం సహజంగా సరిపోతుంది; అయితే కారణార్థం కూడా సాధ్యమే కాబట్టి దాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἐζήτει
  choice: ప్రయత్నిస్తూనే ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా పునరావృత ప్రయత్నాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: విడుదల చేయడానికి / విడుదల చేస్తే
  rationale: న్యాయపరమైన నిర్బంధం నుండి అధికారికంగా విడిచిపెట్టడాన్ని ‘విడుదల చేయడం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: అయితే యూదులు
  rationale: మూలంలోని విస్తృత పదాన్ని ప్రధాన పాఠ్యంలో సంకుచితం చేయకుండా నిలుపుతుంది; సందర్భానుసారమైన భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: ἐκραύγασαν λέγοντες
  choice: కేకలు వేస్తూ … అన్నారు
  rationale: బిగ్గరగా చేసిన బహిరంగ నిరసనను సహజమైన తెలుగులో తెలియజేస్తూ, ప్రత్యక్ష వాక్య పరిచయాన్నీ నిలుపుతుంది.
- source_word: τοῦτον
  choice: ఈయనను
  rationale: సూచనాత్మక సర్వనామ బలాన్ని నిలుపుతూ, తెలుగులో వ్యక్తిని సూచించే సహజ రూపాన్ని ఉపయోగిస్తుంది.
- source_word: φίλος τοῦ Καίσαρος
  choice: కైసరుకు మిత్రుడు
  rationale: కైసరుపట్ల రాజకీయ విధేయతను ప్రశ్నించే ఆరోపణను అతిగా వ్యాఖ్యానించకుండా వ్యక్తం చేస్తుంది.
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: తనను తాను రాజుగా చేసుకునే ప్రతివాడూ
  rationale: ‘తనను తాను రాజుగా చేసుకోవడం’ అనే మూలపాఠ్య నిర్మాణాన్ని, కేవలం రాజునని చెప్పుకోవడంగా బలహీనపరచకుండా నిలుపుతుంది.
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: కైసరును ఎదిరిస్తున్నాడు
  rationale: ఈ న్యాయ-రాజకీయ సందర్భంలో మాటల ద్వారా వ్యతిరేకించడం మరియు అధికారాన్ని ప్రతిఘటించడం అనే రెండు ఛాయలను సహజంగా అందిస్తుంది.
theological_decisions:
- issue: యోహాను సువార్తలో ‘యూదులు’ అనే పదం సూచించే వర్గం
  choice: ప్రధాన పాఠ్యంలో ‘యూదులు’ అని మూలపాఠ్య స్థాయి పదాన్ని నిలుపడం
  alternative: యూదుల నాయకులు; యూదయవాసులు
  rationale: οἱ Ἰουδαῖοι అనే పదాన్ని వ్యాఖ్యానాత్మకంగా సంకుచితం చేయకూడదు. అయితే ఈ కథన సందర్భంలో అది యూదులందరినీ కాక ప్రత్యేకంగా అధికారులను లేదా యేసును వ్యతిరేకించిన వారిని సూచించవచ్చని పాదటిప్పణిలో స్పష్టం చేయడం అపార్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘ప్రయత్నిస్తూనే ఉన్నాడు’ ద్వారా కొనసాగుతున్న ప్రయత్నం, ‘కేకలు వేస్తూ’ ద్వారా బిగ్గర నిరసన, ‘కైసరును ఎదిరిస్తున్నాడు’ ద్వారా రాజకీయ విరోధ భావం సహజంగా వ్యక్తమయ్యాయి. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
