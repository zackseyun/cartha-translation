  text: καὶ πάλιν ἑτέρα γραφὴ λέγει· Ὄψονται εἰς ὃν ἐξεκέντησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: te
  text: 'మరొక లేఖనం కూడా ఇలా చెబుతోంది: “వారు పొడిచిన వ్యక్తి వైపు వారు చూస్తారు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు పొడిచిన వ్యక్తిని వారు చూస్తారు.” గ్రీకు నిర్మాణాన్ని బట్టి, చూపు ఆ వ్యక్తి ‘వైపు’ మళ్లినట్లు లేదా ఆ వ్యక్తిని ‘చూసినట్లు’ అనువదించవచ్చు. ఈ మాటలు జెకర్యా 12:10ను ప్రతిధ్వనిస్తున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: కూడా
  rationale: ఇక్కడ ఇది మరొక లేఖన సాక్ష్యాన్ని జోడిస్తున్న అనుసంధాన పదం. తెలుగులో ‘మరొక... కూడా’ సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: ἑτέρα γραφή
  choice: మరొక లేఖనం
  rationale: యోహాను వాడుకలో γραφή పవిత్ర లేఖనాన్ని సూచిస్తుంది; ἑτέρα అదనపు లేఖన వాక్యాన్ని పరిచయం చేస్తుంది.
- source_word: λέγει
  choice: ఇలా చెబుతోంది
  rationale: లేఖనం వర్తమానంలో మాట్లాడుతున్నట్లు ఉన్న గ్రీకు ఉల్లేఖన సూత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Ὄψονται
  choice: వారు చూస్తారు
  rationale: భవిష్యత్ క్రియను నిలుపుతూ, εἰς వల్ల కలిగే దిశాభావాన్ని ‘వైపు’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: εἰς ὃν
  choice: తాము పొడిచిన వ్యక్తి వైపు
  rationale: εἰς చూపు ఒక వ్యక్తి దిశగా మళ్లడాన్ని సూచిస్తుంది. తెలుగు వాక్యక్రమంలో సంబంధ వాక్యాన్ని ముందుంచడం సహజం; ‘వ్యక్తి’ వ్యక్తిగత సూచనను స్పష్టంగా ఉంచుతుంది.
- source_word: ἐξεκέντησαν
  choice: తాము పొడిచిన
  rationale: సిలువ సందర్భంలోని భౌతికంగా చీల్చి పొడిచిన చర్యను సరళంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: జెకర్యా 12:10 ప్రతిధ్వనిని యోహాను వాక్యానికే లోబడి అనువదించడం
  choice: తాము పొడిచిన వ్యక్తి వైపు వారు చూస్తారు
  alternative: తాము పొడిచిన వ్యక్తిని వారు చూస్తారు
  rationale: యోహాను ఇచ్చిన గ్రీకు పదబంధంలో చూపు ఆ వ్యక్తి వైపు మళ్లే భావాన్ని నిలుపుతుంది; జెకర్యా మూలంలోని దైవిక ప్రథమ పురుష రూపాన్ని ఈ వాక్యంలోకి అదనంగా చేర్చదు. అందువల్ల క్రీస్తుసంబంధ సూచన సందర్భంలో నిలిచినా, మూలంలో లేని వివరణను దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మరొక లేఖనం కూడా’ అనేది πάλιν ἑτέρα γραφή యొక్క అదనపు సాక్ష్య భావాన్ని అనవసర పునరుక్తి లేకుండా అందిస్తుంది.
