- from: 'మరొక లేఖనం కూడా ఇలా చెబుతోంది: “తాము పొడిచిన వ్యక్తి వైపు వారు చూస్తారు.”[a]'
  to: 'మరొక లేఖనం కూడా ఇలా చెబుతోంది: “వారు పొడిచిన వ్యక్తి వైపు వారు చూస్తారు.”[a]'
  rationale: The revision preserves the Greek citation formula and its directional ambiguity while using clearer modern Telugu. It also corrects the malformed footnote explanation without introducing material from Zechariah beyond identifying the allusion.
