  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: te
  text: కానీ వారు యేసు వద్దకు వచ్చి, ఆయన అప్పటికే చనిపోయి ఉన్నాడని చూసి,[b] ఆయన కాళ్లను విరగగొట్టలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఈ చర్యను యోహాను తరువాత లేఖనంతో అనుసంధానిస్తున్నాడు: “ఆయన ఎముకలలో ఒక్కటి కూడా విరగదు” (యోహాను 19:36; నిర్గమకాండం 12:46; సంఖ్యాకాండం 9:12; కీర్తన 34:20 చూడండి).'
    reason: cross_reference
  - marker: b
    text: లేదా, “వారు ఆయన అప్పటికే చనిపోయాడని చూసినప్పుడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: కాని వారు యేసు దగ్గరికి వచ్చి
  rationale: δέ ముందుగా ఇతరులకు చేసినదానితో స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; కృదంత నిర్మాణాన్ని తెలుగులో సహజమైన కాలసంబంధ నిర్మాణంగా అందించాం.
- source_word: ὡς εἶδον
  choice: చూసినప్పుడు
  rationale: ఇది తరువాతి చర్యకు ఆధారమైన పరిస్థితిని తెలియజేస్తుంది; తెలుగు సందర్భంలో కాలసంబంధంతో పాటు కారణభావమూ సహజంగా గ్రహింపబడుతుంది.
- source_word: ἤδη
  choice: అప్పటికే
  rationale: వారు చేరుకునే సమయానికి మరణం ముందే సంభవించిందని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τεθνηκότα
  choice: చనిపోయి ఉన్నాడని
  rationale: పరిపూర్ణ కృదంతం మరణించిన తరువాత కొనసాగుతున్న స్థితిని సూచిస్తుంది; ఈ రూపం సంఘటనను, దాని ఫలితస్థితిని రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: οὐ κατέαξαν
  choice: విరగగొట్టలేదు
  rationale: సందర్భంలో అవయవాల ఎముకలను విరిచే చర్యను సూచిస్తుంది; 'విరగగొట్టు' ఉద్దేశపూర్వక చర్యను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ σκέλη
  choice: ఆయన కాళ్లు
  rationale: σκέληకు నేరమైన, సహజమైన తెలుగు సమానం 'కాళ్లు'; 19:36లోని ఎముకల ప్రస్తావనను ముందుగానే ప్రధాన పాఠ్యంలోకి చేర్చలేదు.
theological_decisions:
- issue: యేసు కాళ్లు విరగగొట్టకపోవడంలో లేఖన నెరవేర్పు సూచన
  choice: ప్రధాన పాఠ్యాన్ని సూటి కథన ప్రకటనగానే ఉంచడం
  alternative: యోహాను 19:36ను ముందే సూచించేలా 'ఎముకలు' అనే పదాన్ని ప్రధాన పాఠ్యంలో వాడడం
  rationale: లేఖన నెరవేర్పు సంబంధాన్ని యోహాను 19:36 స్వయంగా వివరిస్తుంది. అందువల్ల ఈ వచనంలో లేని వివరణను చేర్చకుండా, సంబంధాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. 'మరణించి ఉన్నాడు' కంటే సహజమైన 'చనిపోయి ఉన్నాడు'ను ఎంచుకున్నాం. రెండు పాదసూచిక సూచికలనూ అవి వివరిస్తున్న ఉపవాక్యం తరువాత ఉంచాం.
