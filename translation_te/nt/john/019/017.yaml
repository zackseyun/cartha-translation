source:
  edition: SBLGNT
  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: te
  text: ఆయన తానే సిలువను మోసుకుంటూ, కపాల స్థలం అని పిలిచే చోటుకు బయటకు వెళ్లాడు. దానిని హీబ్రూ భాషలో[a] గొల్గొతా అని పిలుస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అరామిక్ భాషలో’ కావచ్చు. యోహాను వాడిన ‘హీబ్రూ భాషలో’ అనే పదబంధం యూదయ ప్రాంతపు స్థానిక సెమిటిక్ భాషను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζων
  choice: మోసుకుంటూ
  rationale: ఈ వర్తమాన కృదంతం భౌతికంగా మోయడాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో ‘మోసుకుంటూ’ సహజంగా ఉంది.
- source_word: αὑτῷ τὸν σταυρόν
  choice: తనకోసం సిలువను
  rationale: αὑτῷ అనే ఆత్మార్థక చతుర్థీ విభక్తిని స్వామ్యార్థంగా మాత్రమే మార్చకుండా, గ్రీకు పాఠంలోని ‘తనకోసం/తానే’ అనే భావసంభావ్యతను నిలుపుతుంది.
- source_word: σταυρός
  choice: సిలువ
  rationale: శ్రమానుభవ సందర్భంలో ఇది స్థిరమైన, స్పష్టమైన తెలుగు సమానార్థకం; ‘అడ్డకర్ర’ అనే చారిత్రక నిర్దిష్టీకరణను గ్రీకు పదం ఇక్కడ తప్పనిసరి చేయదు.
- source_word: ἐξῆλθεν
  choice: బయలుదేరాడు
  rationale: బయటికి వెళ్లడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భంలో గమ్యస్థానంవైపు వెళ్లిన భావాన్నీ అందిస్తుంది.
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: కపాల స్థలం అని పిలువబడే చోటికి
  rationale: ‘కపాలం’ మరియు ‘స్థలం’ అనే రెండు మూలాంశాలను నిలుపుతూ, తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉంటుంది.
- source_word: Κρανίου
  choice: కపాల
  rationale: κρανίον అంటే తల కపాలం; స్థలనామంలో విశేషణాత్మకంగా ‘కపాల’ సరిపోతుంది.
- source_word: ὃ λέγεται
  choice: దానిని ... అని పిలుస్తారు
  rationale: నామకరణాన్ని సూచించే కర్మణి ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἑβραϊστί
  choice: హీబ్రూ భాషలో
  rationale: గ్రీకు పాఠంలోని ప్రత్యక్ష భాషా సూచనను ప్రధాన పాఠంలో నిలుపుతుంది; అరామిక్ భాషను సూచించే అవకాశం పాదసూచికలో ఇవ్వబడింది.
- source_word: Γολγοθα
  choice: గొల్గొతా
  rationale: సెమిటిక్ స్థలనామాన్ని తెలుగులో ధ్వన్యనుకరణగా అందిస్తుంది.
theological_decisions:
- issue: Ἑβραϊστί అనే భాషా సూచన
  choice: హీబ్రూ భాషలో
  alternative: అరామిక్ భాషలో
  rationale: గ్రీకు పాఠం నేరుగా ‘హీబ్రూలో’ అని చెబుతుంది. అయితే యోహాను వాడుకలో ఇది యూదయ ప్రాంతపు సెమిటిక్ భాషను, బహుశా అరామిక్‌ను, సూచించవచ్చు; అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: αὑτῷ τὸν σταυρόν లో ఆత్మార్థక చతుర్థీ విభక్తి
  choice: తనకోసం సిలువను
  alternative: తానే సిలువను / తన సొంత సిలువను
  rationale: αὑτῷ ను స్వామ్యార్థంగా మాత్రమే నిర్ణయించకుండా దాని చతుర్థీ రూపాన్ని ప్రతిబింబిస్తుంది. ‘తానే’ అనేది స్వయంగా మోశాడనే ఉద్ఘాటనను, ‘తన సొంత’ అనేది స్వామ్యాన్ని మరింత స్పష్టంగా చేస్తాయి; మూలంలోని స్వల్ప అస్పష్టతను ప్రధాన పాఠం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కపాల స్థలం’ ద్వారా మూలంలోని స్థలనామ నిర్మాణాన్ని నిలిపి, ‘గొల్గొతా’ను ధ్వన్యనుకరణగా ఇచ్చాం. పాదసూచిక గుర్తు ప్రధాన పాఠంలో సంబంధిత భాషా సూచన వద్ద ఉంచబడింది.
