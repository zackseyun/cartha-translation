source:
  edition: SBLGNT
  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: te
  text: ఆయనను సిలువ వేసిన చోట ఒక తోట ఉంది. ఆ తోటలో ఒక కొత్త సమాధి ఉంది; అందులో అప్పటివరకు ఎవరినీ ఉంచలేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది. తెలుగులో వాక్యప్రవాహమే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘ఇప్పుడు’ అని చేరిస్తే మూలంలో లేని కాలార్థం కలగవచ్చు.
- source_word: τόπῳ
  choice: చోట
  rationale: ఈ కథన సందర్భంలో సహజమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: ὅπου ἐσταυρώθη
  choice: ఆయనను సిలువ వేసిన
  rationale: గ్రీకు క్రియ కర్మణి రూపంలో ఉంది. తెలుగులో ఈ నిర్మాణం సహజంగా ఉండి, సందర్భం ద్వారా తెలిసే ‘ఆయనను’ మాత్రమే స్పష్టం చేస్తుంది.
- source_word: κῆπος
  choice: తోట
  rationale: κῆποςకు సాధారణమైన అర్థం ‘తోట’; ‘పండ్లతోట’ అనడం అనవసరంగా నిర్దిష్టం చేస్తుంది.
- source_word: μνημεῖον
  choice: సమాధి
  rationale: శరీరాన్ని ఉంచే సమాధి స్థలాన్ని సూచించే సహజమైన తెలుగు పదం; ఈ అంత్యక్రియల సందర్భానికి సరిపోతుంది.
- source_word: καινόν
  choice: కొత్త
  rationale: విశేషణం యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; అది వాడబడనిదని తరువాతి ఉపవాక్యం వివరిస్తుంది.
- source_word: ἐν ᾧ
  choice: అందులో
  rationale: ముందున్న సమాధిని స్పష్టంగా సూచించే సహజమైన తెలుగు సంబంధ ప్రయోగం.
- source_word: οὐδέπω οὐδεὶς
  choice: అప్పటివరకు ఎవరినీ ... లేదు
  rationale: οὐδέπω యొక్క కాల పరిమితిని, οὐδείς యొక్క సంపూర్ణ నిరాకరణను సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: ἦν τεθειμένος
  choice: ఉంచలేదు
  rationale: సమాధిలో శరీరాన్ని ఉంచడాన్ని సహజంగా తెలియజేస్తుంది. గ్రీకులోని గతంలో ఏర్పడిన స్థితి భావం ‘అప్పటివరకు’తో కలిసి వ్యక్తమవుతుంది.
theological_decisions:
- issue: μνημεῖον మరియు τεθειμένοςకు అంత్యక్రియల సందర్భానుగుణ పదాలు
  choice: సమాధి ... ఉంచలేదు
  alternative: గోరీ ... పెట్టబడలేదు
  rationale: వాక్యం వివరణాత్మకమైనది. ‘సమాధి’ మరియు ‘ఉంచలేదు’ అంత్యక్రియల సందర్భాన్ని స్పష్టంగా తెలియజేస్తాయి; అదనపు వేదాంత వ్యాఖ్యానాన్ని చేర్చవు.
- issue: ἐσταυρώθη యొక్క కర్మణి భావం
  choice: ఆయనను సిలువ వేసిన
  alternative: వారు ఆయనను సిలువ వేసిన
  rationale: ‘వారు’ అనే కర్తను మూలవాక్యం ఈ ఉపవాక్యంలో స్పష్టంగా పేర్కొనదు. ఎంచుకున్న తెలుగు రూపం ఆ కర్తను చేర్చకుండా కర్మణి భావాన్ని సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. ‘ఉంది’ పునరావృతం మూలంలోని సమాంతర నిర్మాణాన్ని స్పష్టంగా నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
