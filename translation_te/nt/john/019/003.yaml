  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
translation:
  language: te
  text: వారు ఆయన దగ్గరికి వచ్చి, “యూదుల రాజా, వందనం!” అని అనేవారు; ఆయనను చెంపదెబ్బలు కొట్టేవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν
  choice: ఆయన దగ్గరికి వస్తూ
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా పదేపదే జరిగిన సమీపించడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔλεγον
  choice: అని అంటూ
  rationale: అసంపూర్ణ భూతకాల రూపంలోని పునరావృత ఎగతాళిని నిలుపుతూ, ముందు క్రియతో సహజంగా అనుసంధానిస్తుంది.
- source_word: Χαῖρε
  choice: జయము!
  rationale: ఇక్కడ ఇది సాధారణ పలకరింపు కాక, రాజుకు చేసే వందనాన్ని ఎగతాళిగా అనుకరించిన మాట. ‘జయము’ ఆ రాజసంబంధ వ్యంగ్యాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: యూదుల రాజా
  rationale: సంబోధన విభక్తితో బిరుదును నేరుగా అనువదించి, రాజకీయ మరియు మెస్సీయ సంబంధ వ్యంగ్యాన్ని మార్చకుండా ఉంచుతుంది.
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: ఆయనను చెంపదెబ్బలు కొడుతూ ఉన్నారు
  rationale: ῥαπίσματα చేతితో కొట్టే దెబ్బలను, ముఖ్యంగా చెంపదెబ్బలను సూచిస్తుంది; అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న లేదా పునరావృత చర్యను ‘కొడుతూ ఉన్నారు’ నిలుపుతుంది.
theological_decisions:
- issue: యేసును ఉద్దేశించిన పలకరింపు స్వరం
  choice: ఎగతాళితో చేసిన రాజవందనంగా ‘యూదుల రాజా, జయము!’
  alternative: తటస్థంగా ‘యూదుల రాజా, వందనం!’
  rationale: శ్రమల కథనంలోని తక్షణ సందర్భం ఇది నిజమైన గౌరవం కాక వ్యంగ్యపూర్వక రాజవందనమని చూపుతుంది; అనువాదం ఆ స్వరాన్ని సూచిస్తుంది గాని అదనపు వ్యాఖ్యానాన్ని వాక్యంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండేలా వాక్యాన్ని నిర్మించాం. ‘జయము’ కొంత ఘనమైన రాజవందన శైలిని నిలుపుతుంది; ఈ సందర్భంలో దాని వ్యంగ్య స్వరం కథనం ద్వారా స్పష్టమవుతుంది. అసంపూర్ణ భూతకాల క్రియల కొనసాగింపు భావాన్ని ప్రధాన పాఠ్యంలోనే సాధ్యమైనంతవరకు నిలిపాం.
