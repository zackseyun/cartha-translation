id: JHN.19.25
reference: John 19:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἱστήκεισαν δὲ παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ ἡ μήτηρ αὐτοῦ καὶ ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ, Μαρία ἡ τοῦ Κλωπᾶ καὶ Μαρία ἡ Μαγδαληνή.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: te
  text: యేసు సిలువ దగ్గర ఆయన తల్లి, ఆయన తల్లి సోదరి, క్లోపాకు చెందిన మరియ[a], మగ్దలేనే మరియ నిలబడి ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్లోపా భార్య మరియ.’ గ్రీకు పాఠం క్లోపాతో ఆమెకు ఉన్న సంబంధాన్ని స్పష్టంగా పేర్కొనదు; అయితే ఆమె క్లోపా భార్య అనే అర్థం సాధారణంగా తీసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆయన తల్లి సోదరి’ మరియు ‘క్లోపాకు చెందిన మరియ’ ఒకే వ్యక్తిని సూచిస్తున్నట్లు తీసుకుంటే, ఈ వాక్యం నలుగురిని కాక ముగ్గురు స్త్రీలను పేర్కొంటున్నట్లుగా కూడా చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: నిలబడి ఉన్నారు
  rationale: ప్లూపర్‌ఫెక్ట్ రూపం ఇక్కడ కొనసాగుతున్న స్థితిని సూచిస్తుంది; తెలుగు సంయుక్త క్రియ ఆ స్థితి కొనసాగుతున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది బలమైన వ్యతిరేకతకన్నా కథన మార్పును సూచిస్తుంది; తెలుగులో వాక్యప్రవాహమే ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ
  choice: యేసు సిలువ దగ్గర
  rationale: παρά + దత్తివు సమీపాన్ని సూచిస్తుంది; మూలంలోని సరళమైన సంబంధాన్ని విస్తరించకుండా సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: ఆయన తల్లి
  rationale: మూల నామవాచక పదబంధానికి సూటి, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: ఆయన తల్లి సోదరి
  rationale: జనిటివ్ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: క్లోపాకు చెందిన మరియ[a]
  rationale: గ్రీకు పాఠం క్లోపాతో సంబంధాన్ని సూచిస్తుంది గాని ఆమె ఆయన భార్య అని స్పష్టంగా చెప్పదు; తటస్థ రూపం అసలు అనిశ్చితిని కాపాడుతుంది.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: మగ్దలేనే మరియ
  rationale: మగ్దల ప్రాంతానికి చెందిన మరియను గుర్తించే పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు రూపంలో అందిస్తుంది.
theological_decisions:
- issue: సిలువ దగ్గర ఉన్న స్త్రీల గుర్తింపు మరియు సంఖ్య
  choice: ప్రధాన పాఠంలో నలుగురు స్త్రీల జాబితాగా అనువదించడం
  alternative: ‘ఆయన తల్లి సోదరి’ మరియు ‘క్లోపాకు చెందిన మరియ’ ఒకే వ్యక్తిని సూచిస్తే ముగ్గురు స్త్రీల జాబితాగా చదవడం
  rationale: సమన్వయంతో ఉన్న నామవాచక పదబంధాలు నలుగురిని సూచించే పఠనానికి అనుకూలంగా ఉన్నా, గ్రీకు వాక్యనిర్మాణం రెండవ, మూడవ పదబంధాలను ఒకే వ్యక్తికి అన్వయించే అవకాశాన్ని పూర్తిగా తొలగించదు; అందువల్ల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: క్లోపాతో మరియకు ఉన్న సంబంధం
  choice: ‘క్లోపాకు చెందిన మరియ’ అనే సంబంధ-తటస్థ రూపం
  alternative: ‘క్లోపా భార్య మరియ’
  rationale: τοῦ Κλωπᾶ సంబంధాన్ని తెలియజేస్తుంది గాని ‘భార్య’ అనే పదం మూలంలో లేదు; సాధారణ వ్యాఖ్యానాన్ని పాదటిప్పణిలో ఇచ్చి అసలు పాఠంలోని అనిశ్చితిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘క్లోపాకు చెందిన’ అనే రూపం మూలంలోని సంబంధ అస్పష్టతను కాపాడుతుంది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
