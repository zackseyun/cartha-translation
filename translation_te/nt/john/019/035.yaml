id: JHN.19.35
reference: John 19:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: te
  text: చూసినవాడు సాక్ష్యమిచ్చాడు; అతని సాక్ష్యం సత్యమైనది. తాను సత్యమే చెబుతున్నానని అతనికి తెలుసు. మీరు కూడా విశ్వసించాలనే ఉద్దేశంతో అతడు సాక్ష్యమిచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు కూడా విశ్వసిస్తూ ఉండాలనే.” వర్తమాన ఉపవాచక రూపం కొనసాగుతున్న భావాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: ఇది చూసినవాడు
  rationale: పూర్తయిన దర్శనానికి కొనసాగుతున్న ప్రాముఖ్యతను సూచించే పరిపూర్ణ కృదంతాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ‘ప్రత్యక్షసాక్షి’ అని భావాన్ని విస్తరించదు.
- source_word: μεμαρτύρηκεν
  choice: సాక్ష్యమిచ్చాడు
  rationale: తెలుగులో సహజమైన న్యాయ/సాక్ష్య పదజాలాన్ని ఉపయోగిస్తూ, ఇచ్చిన సాక్ష్యానికి కొనసాగుతున్న ప్రామాణికతను సందర్భం ద్వారా నిలుపుతుంది.
- source_word: ἀληθινὴ αὐτοῦ ἐστιν ἡ μαρτυρία
  choice: అతని సాక్ష్యం సత్యమైనది
  rationale: సాక్ష్యపు సత్యత, విశ్వసనీయతను నేరుగా తెలియజేస్తుంది.
- source_word: ἐκεῖνος
  choice: అతడు
  rationale: తెలుగులో ‘ఆ వ్యక్తి’ అనడం అనవసరంగా దూరాన్ని లేదా వేరొక వ్యక్తిని సూచించవచ్చు. ‘అతడు’ మూడవ పురుష రూపాన్ని నిలుపుతూ గ్రీకు సూచన ఎవరికో నిర్ణయించదు.
- source_word: οἶδεν
  choice: అతనికి తెలుసు
  rationale: రూపపరంగా పరిపూర్ణమైన οἶδα యొక్క వర్తమాన స్థితి అర్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀληθῆ λέγει
  choice: తాను సత్యమే చెబుతున్నానని
  rationale: ‘సత్యమైన విషయాలు చెబుతున్నాడు’ అనే అక్షరార్థపు అసహజతను నివారించి, గ్రీకు నుడికారపు భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: మీరు కూడా విశ్వసించాలనే
  rationale: ἵνα యొక్క ఉద్దేశార్థాన్ని, καί యొక్క సమావేష బలాన్ని నిలుపుతుంది; πιστεύητε యొక్క కొనసాగింపు భావాన్ని ప్రధాన పాఠంలో బలవంతంగా నిర్ణయించదు.
theological_decisions:
- issue: ఈ వచనంలోని సాక్షి ఎవరు?
  choice: ‘ఇది చూసినవాడు’, ‘అతడు’ అనే మూడవ పురుష రూపాలతో గుర్తింపును అనిర్ణీతంగా ఉంచడం
  alternative: కథకుడు/ప్రియశిష్యుడు తనను మూడవ పురుషంలో సూచిస్తున్నాడు; లేదా వేరొక ప్రత్యక్షసాక్షిని సూచిస్తున్నాడు
  rationale: గ్రీకు పాఠం సాక్షిని పేరుతో గుర్తించదు. అందువల్ల అనువాదం ఏ ప్రత్యేక గుర్తింపునూ పాఠంలో చేర్చదు.
- issue: πιστεύητε యొక్క కాలాంశ బలం
  choice: విశ్వసించాలి
  alternative: విశ్వసిస్తూ ఉండాలి
  rationale: వర్తమాన సుబ్జంక్టివ్ కొనసాగుతున్న విశ్వాసాన్ని సూచించగలిగినా, ఈ సందర్భంలో ప్రారంభ లేదా కొనసాగింపు భావాల్లో ఒకదాన్ని తప్పనిసరిగా నిర్ణయించదు; ప్రత్యామ్నాయ నుడికారాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘సాక్ష్యం’, ‘సత్యమైనది’, ‘విశ్వసించాలి’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని సహజ వాక్యనిర్మాణంతో వాడాం. చివరి ఉద్దేశ వాక్యానికి ‘అతడు సాక్ష్యమిచ్చాడు’ను పునరుక్తి చేయడం తెలుగులో సంబంధాన్ని స్పష్టం చేస్తుంది; ఇది గ్రీకు ప్రధాన క్రియనే తిరిగి సూచిస్తుంది.
