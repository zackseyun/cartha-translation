source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: te
  text: అతడు మళ్లీ పాలకుని అధికారిక నివాసంలోకి[a] వెళ్లి యేసుతో, “నీవు ఎక్కడి నుంచి వచ్చావు?” అని అడిగాడు. అయితే యేసు అతనికి ఏ జవాబూ ఇవ్వలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రేతోరియం’; ఇది రోమా పాలకుని అధికారిక నివాసం లేదా ప్రధాన కార్యస్థానం.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: లోకి వెళ్లి
  rationale: ఒక స్థలంలోకి ప్రవేశించడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: πραιτώριον
  choice: పాలకుని అధికార నివాసం
  rationale: రోమా పాలకుడు అధికారికంగా నివసించి పరిపాలనా కార్యాలు నిర్వహించే స్థలాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; అపరిచితమైన అనువాదలిపి పదాన్ని ప్రధాన పాఠ్యంలో నివారిస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: చర్య పునరావృతమైందనే అర్థాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λέγει
  choice: అని అడిగాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథనంలో భూతకాలం సహజం; పలికిన మాట ప్రశ్న కావడంతో ‘అడిగాడు’ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: Πόθεν εἶ σύ
  choice: నీవు ఎక్కడి నుంచి వచ్చావు?
  rationale: Πόθεν వ్యక్తి మూలం లేదా వచ్చిన స్థలాన్ని ప్రశ్నిస్తుంది; ఈ రూపం సహజమైన తెలుగులో ఆ భావాన్ని నిలుపుతుంది.
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: అతనికి ఏ జవాబూ ఇవ్వలేదు
  rationale: ‘అతనికి జవాబు ఇవ్వలేదు’ అనే గ్రీకు వ్యక్తీకరణను సహజమైన తెలుగులో దాని పదచిత్రంతో సహా నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: పిలాతు ప్రశ్నకూ యేసు మౌనానికీ మధ్యనున్న వ్యత్యాసాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: క్రియకు స్పష్టంగా చెప్పని కర్త
  choice: సందర్భంలో పిలాతును సూచించేలా ‘అతడు’ అని ఉంచడం
  alternative: ప్రధాన పాఠ్యంలో ‘పిలాతు’ అని స్పష్టంగా చేర్చడం
  rationale: గ్రీకు మూలంలో కర్త పేరు ఈ వాక్యంలో లేదు; ముందున్న సందర్భం పిలాతునే స్పష్టంగా సూచిస్తుంది. ‘అతడు’ మూలంలోని రూపాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- issue: ‘నీవు ఎక్కడి నుంచి వచ్చావు?’ అనే ప్రశ్నలో మూలం గురించిన ఉద్దేశం
  choice: ప్రశ్నను వివరణ జోడించకుండా యథాతథంగా ఉంచడం
  alternative: భౌగోళిక మూలం లేదా దైవిక మూలం అని స్పష్టీకరించడం
  rationale: ప్రశ్న భౌగోళిక మూలాన్నో, వ్యక్తిత్వ మూలాన్నో సూచించగల సందర్భగత ఉద్వేగాన్ని కలిగి ఉంది; మూలపాఠ్యం పరిష్కరించని భావాన్ని అనువాదం కూడా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘నీవు’ ఏకవచన సంబోధనను నిలుపుతూ సాధారణ పాఠకునికి అర్థమయ్యే బైబిలు గాంభీర్యాన్ని కలిగిస్తుంది. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘అధికార నివాసం’ పదబంధం వద్దే ఉంచబడింది.
