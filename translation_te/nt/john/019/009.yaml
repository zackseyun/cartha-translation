    issue: ‘అధికార నివాసం’ is not the most natural modern Telugu collocation.
    rationale: Adding ‘-ిక’ produces the standard expression ‘అధికారిక నివాసం’ (‘official residence’) while preserving the lexical sense of πραιτώριον and the footnote’s stated alternative.
