id: JHN.19.1
reference: John 19:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε οὖν ἔλαβεν ὁ Πιλᾶτος τὸν Ἰησοῦν καὶ ἐμαστίγωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/001.yaml
  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: te
  text: అప్పుడు పిలాతు యేసును తీసుకొని కొరడాలతో కొట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ప్రతినిధుల చేత చేయించిన భావాన్ని మరింత స్పష్టంగా: “అప్పుడు పిలాతు యేసును తీసుకొని, ఆయనను కొరడాలతో కొట్టించాడు.”'
    reason: మూల గ్రీకులో పిలాతు వ్యాకరణ కర్తగా ఉన్నప్పటికీ, ఆ చర్యను అతడు స్వయంగా చేశాడా లేక అధికారంతో చేయించాడా అనేది స్పష్టంగా నిర్ణయించబడలేదు.
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: కథనంలో తరువాత జరిగిన సంఘటనను సూచించే సహజమైన, సంక్షిప్తమైన కాలవాచక పదం.
- source_word: οὖν
  choice: ప్రత్యేక పదంగా అనువదించలేదు; వాక్యప్రవాహంలో అంతర్భూతం
  rationale: ఇది తార్కిక లేదా కథన పురోగతిని సూచిస్తుంది. Τότεను ‘అప్పుడు’గా అనువదించడం ద్వారా ఆ పురోగతి తెలుగులో సహజంగా వ్యక్తమవుతుంది; రెండింటినీ విడిగా అనువదిస్తే వాక్యం కృత్రిమంగా ఉంటుంది.
- source_word: ἔλαβεν
  choice: తీసుకొని
  rationale: λαμβάνω యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది. ‘పట్టుకొని’ అనడం సందర్భం కంటే ఎక్కువ బలప్రయోగాన్ని సూచించవచ్చు; ‘తీసుకురమ్మని ఆజ్ఞాపించి’ అనడం ప్రతినిధి చర్యను మూలపాఠానికి మించి స్పష్టీకరిస్తుంది.
- source_word: ὁ Πιλᾶτος
  choice: పిలాతు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం; సందర్భంలో వ్యక్తి ఇప్పటికే పరిచితుడు కాబట్టి పూర్తి పేరు అవసరం లేదు.
- source_word: τὸν Ἰησοῦν
  choice: యేసును
  rationale: వ్యక్తినామానికి తెలుగు కర్మవిభక్తిని సహజంగా జోడించిన రూపం.
- source_word: ἐμαστίγωσεν
  choice: కొరడాలతో కొట్టాడు
  rationale: μαστιγόω సూచించే కొరడా దెబ్బల శిక్షను ఆధునిక పాఠకులకు స్పష్టంగా, సహజంగా తెలియజేస్తుంది; సాధారణ ‘కొట్టాడు’ కంటే సాధనాన్ని పేర్కొనడం మూలపద తీవ్రతను మెరుగ్గా నిలుపుతుంది.
theological_decisions:
- issue: ἔλαβεν ... ἐμαστίγωσενలో పిలాతు చర్య ప్రత్యక్షమా లేక అధికారికంగా చేయించిందా అనే కర్తృత్వం
  choice: పిలాతునే రెండు క్రియలకూ వ్యాకరణ కర్తగా ఉంచి, ‘తీసుకొని కొరడాలతో కొట్టాడు’ అని అనువదించడం
  alternative: ‘పిలాతు యేసును తీసుకొని, ఆయనను కొరడాలతో కొట్టించాడు’
  rationale: గ్రీకు వాక్యంలో రెండు క్రియలకూ పిలాతే కర్త. తెలుగు ప్రధాన పాఠం ఈ ఉపరితల నిర్మాణాన్ని నిలుపుతుంది; పిలాతు స్వయంగా చేశాడా లేక తన అధికారంతో చేయించాడా అనే చారిత్రక ప్రశ్నను బలవంతంగా తీర్చదు. ప్రత్యామ్నాయ ప్రతినిధి కర్తృత్వాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘కొరడాలతో కొట్టాడు’ అనేది ‘దండించాడు’ వంటి అస్పష్ట పదం కంటే శారీరక శిక్షను స్పష్టంగా తెలియజేస్తుంది. ప్రధాన పాఠం గ్రీకు వ్యాకరణ నిర్మాణాన్ని నిలుపుతూ, పాదటిప్పణి సాధ్యమైన ప్రతినిధి కర్తృత్వాన్ని సంరక్షిస్తుంది.
