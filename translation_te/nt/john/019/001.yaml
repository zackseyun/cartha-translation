  source_fidelity: ప్రధాన పాఠం Τότε οὖν ను సహజంగా ‘అప్పుడు’లో గ్రహించి, ἔλαβεν ను ‘తీసుకొని,’ ἐμαστίγωσεν ను ‘కొరడాలతో కొట్టాడు’గా విశ్వసనీయంగా అందిస్తుంది. గ్రీకులో పిలాతే రెండు క్రియలకు వ్యాకరణ కర్తగా ఉండడాన్ని కాపాడుతుంది; ప్రత్యక్షంగా చేశాడా లేక అధికారంతో చేయించాడా అన్న చారిత్రక అంశాన్ని ప్రధాన పాఠం నిర్ణయించదు.
