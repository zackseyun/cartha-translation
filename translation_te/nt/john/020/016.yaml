id: JHN.20.16
reference: John 20:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· ⸀Μαριάμ. στραφεῖσα ἐκείνη λέγει αὐτῷ ⸀Ἑβραϊστί· Ραββουνι (ὃ λέγεται Διδάσκαλε).
base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: te
  text: యేసు ఆమెతో, “మరియ!” అని అంటాడు. ఆమె తిరిగి, ఆయనతో హెబ్రీ భాషలో[a], “రబ్బూనీ!” అని అంటుంది. (దీని అర్థం, “బోధకుడా!”)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అరామిక్ భాషలో.” యోహాను వాడిన “హెబ్రీ” అనే పదం యూదయ ప్రాంతంలో మాట్లాడిన సెమిటిక్ భాషను విస్తృతంగా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: అని అంటాడు / అని అంటుంది
  rationale: యోహాను వాడిన చారిత్రక వర్తమాన కాలపు సజీవ కథనశైలిని నిలుపుతూ వర్తమాన కాలంలో అనువదించబడింది.
- source_word: αὐτῇ
  choice: ఆమెతో
  rationale: తెలుగులో సంభాషణను సూచించడానికి దత్తివార్థక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Μαριάμ
  choice: మరియా
  rationale: గ్రీకు రూపానికి సమీపంగా ఉండి, ఆధునిక తెలుగు బైబిలు పఠనంలో సహజంగా వినిపించే వ్యక్తినామ రూపం.
- source_word: στραφεῖσα
  choice: ఆమె తిరిగి
  rationale: క్రియకు ముందున్న చర్యను సంక్షిప్తంగా, సహజమైన తెలుగు కథన క్రమంలో తెలియజేస్తుంది.
- source_word: ἐκείνη
  choice: ఆమె
  rationale: సందర్భంలో నిర్దేశక సర్వనామం సహజంగా వ్యక్తిగత సర్వనామంగా పనిచేస్తుంది.
- source_word: Ἑβραϊστί
  choice: హెబ్రీ భాషలో
  rationale: గ్రీకు పదం ప్రత్యక్షంగా తెలిపే ‘హెబ్రీలో’ అనే భావాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అరామిక్ అనే సందర్భసాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: Ραββουνι
  choice: రబ్బూనీ
  rationale: సువార్త రచయిత వెంటనే అర్థం వివరిస్తున్నందున, సంబోధనలోని సాంస్కృతిక మరియు భావోద్వేగ బలాన్ని నిలుపడానికి లిప్యంతరీకరించబడింది.
- source_word: ὃ λέγεται Διδάσκαλε
  choice: దానికి “బోధకుడా!” అని అర్థం
  rationale: λέγεται ఇక్కడ పదార్థ వివరణను పరిచయం చేస్తుంది; Διδάσκαλε సంబోధన రూపం కావడంతో తెలుగులో ‘బోధకుడా’ అని ఇచ్చింది.
theological_decisions:
- issue: యోహాను కథనంలో Ἑβραϊστί పదం అనువాదం
  choice: హెబ్రీ భాషలో
  alternative: అరామిక్ భాషలో
  rationale: మూల గ్రీకు పదప్రయోగాన్ని ప్రధాన పాఠ్యంలో గౌరవించింది. అది యూదయ ప్రాంతపు అరామిక్ భాషను విస్తృతంగా సూచించి ఉండవచ్చనే నిజమైన వ్యాఖ్యాన అవకాశాన్ని పాదటిప్పణిలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, అదే సమయంలో గౌరవప్రదంగా ఉండే కథనశైలి. మూలంలోని చారిత్రక వర్తమాన కాలాన్ని నిలిపింది; ‘రబ్బూనీ’ అనే సాంస్కృతిక సంబోధనను అనువదించకుండా, రచయిత ఇచ్చిన అర్థవివరణను కొనసాగించింది.
