id: JHN.20.13
reference: John 20:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: te
  text: వారు ఆమెతో, “అమ్మా, ఎందుకు ఏడుస్తున్నావు?” అని అడిగారు. ఆమె వారితో, “వారు నా ప్రభువును[a] తీసుకుపోయారు. ఆయనను ఎక్కడ ఉంచారో నాకు తెలియదు” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా ప్రభువు” అనే మాటకు “నా యజమాని” అని కూడా అర్థం కావచ్చు. గ్రీకు κύριος అనే పదం సందర్భానుసారంగా గౌరవ బిరుదుగానూ, ‘ప్రభువు’ అనే బిరుదుగానూ వాడబడుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: అమ్మా
  rationale: స్త్రీని నేరుగా, గౌరవంగా సంబోధించే గ్రీకు పదం. ఆధునిక తెలుగులో ‘స్త్రీ’ అని సంబోధించడం కఠినంగా వినిపించవచ్చు; ‘అమ్మా’ గౌరవభావాన్ని సహజంగా తెలియజేస్తుంది, కానీ అదనపు ఆప్యాయతను బలంగా చేర్చదు.
- source_word: τί κλαίεις
  choice: ఎందుకు ఏడుస్తున్నావు?
  rationale: τί అక్షరార్థంగా ‘ఏమి’ అయినప్పటికీ, ఈ గ్రీకు ప్రయోగం కారణాన్ని అడుగుతుంది. తెలుగులో ‘ఎందుకు ఏడుస్తున్నావు?’ సహజమైన సమానార్థక ప్రయోగం; వర్తమాన రూపం కొనసాగుతున్న ఏడుపును సూచిస్తుంది.
- source_word: Ἦραν
  choice: తీసుకెళ్లిపోయారు
  rationale: సమాధి నుంచి తొలగించి మరొకచోటికి తీసుకెళ్లారనే సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది. గ్రీకు ఏరిస్ట్ పూర్తయిన చర్యను సూచిస్తుంది.
- source_word: τὸν κύριόν μου
  choice: నా ప్రభువును
  rationale: κύριος గౌరవపూర్వక ‘యజమాని’ భావాన్నీ క్రీస్తుసంబంధమైన ‘ప్రభువు’ భావాన్నీ కలిగి ఉండగలదు. ‘నా ప్రభువు’ ఈ సందర్భంలోని ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
- source_word: οὐκ οἶδα
  choice: నాకు తెలియదు
  rationale: οἶδα రూపం సంపూర్ణకాలంలా కనిపించినా వర్తమాన జ్ఞానస్థితిని వ్యక్తం చేస్తుంది; తెలుగులో ‘నాకు తెలియదు’ సహజమైన రూపం.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: ఆయనను ఎక్కడ ఉంచారో
  rationale: τίθημι ఇక్కడ ‘ఉంచడం/పెట్టడం’ అనే సాధారణ అర్థంలో ఉంది. యేసును సూచిస్తూ గౌరవప్రదమైన తెలుగు సర్వనామం ‘ఆయనను’ వాడబడింది.
- source_word: ἐκεῖνοι
  choice: వారు
  rationale: ముందు ప్రస్తావించిన ఇద్దరు దేవదూతలను సూచించే బహువచన సర్వనామం; తెలుగులో ‘వారు’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
theological_decisions:
- issue: మరియ మాటలో κύριος అనువాదం
  choice: నా ప్రభువు
  alternative: నా యజమాని
  rationale: యోహాను సువార్తలో ఈ బిరుదుకు సాధారణ గౌరవార్థమూ, క్రీస్తుసంబంధమైన లోతైన భావమూ ఉండగలవు. ‘ప్రభువు’ ఆ రెండు అవకాశాలను మూసివేయకుండా ఉంచుతుంది.
- issue: Γύναι సంబోధన స్వరం
  choice: అమ్మా
  alternative: స్త్రీ / ఓ స్త్రీ
  rationale: మూలంలోని సంబోధన గౌరవప్రదమైనది, మొరటైనది కాదు. ఆధునిక ప్రామాణిక తెలుగులో ‘అమ్మా’ ఆ గౌరవాన్ని సహజంగా అందిస్తుంది; బంధుత్వార్థాన్ని ఉద్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. సంభాషణ సులభంగా ఉండేలా ‘అని అడిగారు/చెప్పింది’ వాడబడింది. యేసుకు గౌరవసూచక ఏకవచన రూపమైన ‘ఆయనను’ ఉపయోగించబడింది.
