source:
  edition: SBLGNT
  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: te
  text: మగ్దలేనే మరియ శిష్యుల వద్దకు వచ్చి, “నేను ప్రభువును చూశాను,” అని, ఆయన ఆమెతో ఈ మాటలు చెప్పాడని వారికి తెలియజేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మగ్దలేనే మరియ శిష్యుల వద్దకు వచ్చి, ‘నేను ప్రభువును చూశాను’ అని వారికి తెలియజేసింది. ఆయన ఆమెతో ఈ మాటలు చెప్పాడు.” చివరి ఉపవాక్యాన్ని మరియ నివేదికలో భాగంగానైనా, కథకుని వ్యాఖ్యగానైనా అర్థం చేసుకోవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: వచ్చి
  rationale: ఇది కథనంలోని చారిత్రక వర్తమాన కాలం; తెలుగులో సహజమైన భూతకాల సంఘటనగా, శిష్యులవైపు కదలికను సూచించేలా అనువదించాం.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: మగ్దలేనే మరియ
  rationale: స్థలనామ సంబంధిత బిరుదును, వ్యక్తినామాన్ని ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఇచ్చాం.
- source_word: ἀγγέλλουσα
  choice: ప్రకటించింది
  rationale: శిష్యులకు సందేశాన్ని తెలియజేయడం అనే క్రియాబలాన్ని సహజమైన తెలుగు కథన వాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: τοῖς μαθηταῖς
  choice: శిష్యుల దగ్గరికి
  rationale: μαθηταίకు స్థిరమైన తెలుగు పదం ‘శిష్యులు’; ἔρχεταιతో కలిసి గమ్యాన్ని సహజంగా తెలిపేందుకు ‘దగ్గరికి’ వాడాం. గ్రీకులో లేని ‘ఆయన’ అనే స్వామ్య సూచనను చేర్చలేదు.
- source_word: ὅτι
  choice: “నేను ప్రభువును చూశాను” అనీ
  rationale: ὅτι పరిచయం చేసే నివేదిక విషయాన్ని ప్రత్యక్ష వాక్యంగా ఉంచి, తరువాతి సమాంతర నివేదికతో కలపడానికి ‘అనీ’ వాడాం.
- source_word: Ἑώρακα
  choice: నేను ప్రభువును చూశాను
  rationale: పూర్తయిన దర్శనం ప్రస్తుతం ప్రాముఖ్యమున్నదని సూచించే గ్రీకు పరిపూర్ణ కాలాన్ని తెలుగు ‘చూశాను’ సందర్భానుసారంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν κύριον
  choice: ప్రభువును
  rationale: పునరుత్థాన సందర్భంలో యేసుకు వర్తించే κύριος బిరుదు యొక్క ధార్మిక బరువును ‘ప్రభువు’ నిలుపుతుంది.
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: ఆయన తనతో ఈ మాటలు చెప్పాడనీ
  rationale: ఈ భాగాన్ని మరియ ప్రకటించిన విషయానికి కొనసాగింపుగా తీసుకున్నాం. ‘తనతో’ అనే రూపం αὐτῇ మరియనే సూచిస్తుందని తెలుగులో స్పష్టం చేస్తుంది; ‘ఈ మాటలు’ ταῦταను నిలుపుతుంది.
theological_decisions:
- issue: పునరుత్థాన సందర్భంలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని / గురువు
  rationale: ఇక్కడ ఇది యేసును సూచించే బిరుదు; ‘ప్రభువు’ నూతన నిబంధన వాడుకనూ క్రీస్తుసంబంధమైన భావభారాన్నీ తగ్గించకుండా నిలుపుతుంది.
- issue: καὶ ταῦτα εἶπεν αὐτῇకు మరియ నివేదికతో ఉన్న సంబంధం
  choice: 'మరియ ప్రకటించిన విషయంలోని రెండవ అంశంగా: ‘ఆయన తనతో ఈ మాటలు చెప్పాడనీ’'
  alternative: 'కథకుని ప్రత్యేక వ్యాఖ్యగా: ‘ఆయన ఆమెతో ఈ మాటలు చెప్పాడు’'
  rationale: గ్రీకులో రెండవ ὅτι లేకపోయినా, ఈ ఉపవాక్యం ἀγγέλλουσα యొక్క విషయాన్ని సహజంగా కొనసాగించగలదు. అయితే వాక్యనిర్మాణం కథకుని వ్యాఖ్యగా తీసుకునే అవకాశాన్ని పూర్తిగా తొలగించదు; అందుకే పాదటిప్పణిలో ప్రత్యామ్నాయం ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని భావసంబంధ అనిశ్చితిని ప్రధాన పాఠ్యంలో ఒక సాధ్యమైన పఠనంతో ఇచ్చి, మరో సాధ్యమైన పఠనాన్ని పాదటిప్పణిలో నిలిపాం.
