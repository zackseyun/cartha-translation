revisions:
- from: 'యేసు ఆమెతో ఇలా అన్నాడు: “నన్ను పట్టుకొని ఉండకు[a]; ఎందుకంటే నేను ఇంకా తండ్రి దగ్గరికి ఎక్కిపోలేదు. అయితే నా సహోదరుల[b] దగ్గరికి వెళ్లి వారితో, ‘నేను నా తండ్రి, మీ తండ్రి దగ్గరికి, నా దేవుడు, మీ దేవుడు దగ్గరికి ఎక్కిపోతున్నాను’ అని చెప్పు.”'
  to: 'యేసు ఆమెతో ఇలా అన్నాడు: “నన్ను పట్టుకొని ఉండకు[a]; ఎందుకంటే నేను ఇంకా తండ్రి వద్దకు ఆరోహించలేదు. అయితే నా సహోదరుల[b] వద్దకు వెళ్లి వారికి ఇలా చెప్పు: ‘నేను నా తండ్రి వద్దకు, మీ తండ్రి వద్దకు, నా దేవుని వద్దకు, మీ దేవుని వద్దకు ఆరోహిస్తున్నాను.’”'
  rationale: The revision replaces the overly literal climbing expression with ‘ఆరోహించు,’ which is both natural and source-faithful in this Johannine setting. It also supplies explicit Telugu case marking throughout the final fourfold construction, preserving the source’s parallelism without ambiguity. The lexical footnote retains ‘తాకవద్దు’ as a legitimate alternative while the main text expresses the likely continued-holding nuance.
