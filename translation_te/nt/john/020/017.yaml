id: JHN.20.17
reference: John 20:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: te
  text: 'యేసు ఆమెతో ఇలా అన్నాడు: “నన్ను పట్టుకొని ఉండకు[a]; ఎందుకంటే నేను ఇంకా తండ్రి వద్దకు ఆరోహించలేదు. అయితే నా సహోదరుల[b] వద్దకు వెళ్లి వారికి ఇలా చెప్పు: ‘నేను నా తండ్రి వద్దకు, మీ తండ్రి వద్దకు, నా దేవుని వద్దకు, మీ దేవుని వద్దకు ఆరోహిస్తున్నాను.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నన్ను తాకవద్దు” లేదా “నన్ను పట్టుకొని ఉండవద్దు” అని కూడా అనువదించవచ్చు. గ్రీకు పదబంధం కేవలం తాకడంకన్నా, ఆయనను పట్టుకొని ఉండడాన్ని లేదా పట్టును కొనసాగించడాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: “సహోదరులు” అనేది గ్రీకులోని పుంలింగ బహువచన పదానికి అనువాదం. ఇక్కడ అది యేసు శిష్యులను సూచిస్తుంది; మరింత విస్తృతమైన ప్రతినిధి సమూహాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: ἅπτου
  choice: పట్టుకొని ఉండకు
  rationale: μήతో కూడిన వర్తమాన మధ్యమ ఆజ్ఞారూపం కొనసాగుతున్న పట్టును ఆపమనే భావాన్ని ఇవ్వగలదు. కేవలం తాకడాన్ని నిషేధిస్తున్నట్లు కాకుండా, పట్టుకొని ఉండడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: ఎందుకంటే నేను ఇంకా ... ఎక్కిపోలేదు
  rationale: పరిపూర్ణ కాలరూపంలోని ‘ఇంకా ఎక్కిపోలేదు’ అనే భావాన్ని నిలుపుతుంది; యోహాను సందర్భంలో తండ్రి దగ్గరికి ఆరోహణను సూచిస్తుంది.
- source_word: πρὸς τὸν πατέρα
  choice: తండ్రి దగ్గరికి
  rationale: మొదటి ఉపవాక్యంలో గ్రీకు పాఠంలో స్వామ్యసూచక సర్వనామం లేదు; కాబట్టి ‘నా తండ్రి’ అని చేర్చకుండా మూలంలోని ‘తండ్రి’ని నిలుపుతుంది.
- source_word: πορεύου
  choice: వెళ్లి
  rationale: గమనాన్ని ఆజ్ఞాపించే సాధారణ క్రియకు సందర్భానుకూలమైన సహజ తెలుగు రూపం.
- source_word: ἀδελφούς
  choice: సహోదరులు
  rationale: మూలంలోని పుంలింగ బహువచనాన్ని నిలుపుతూ, గౌరవప్రదమైన ఆధునిక తెలుగు పదాన్ని వాడింది; సందర్భపరమైన పరిధిని పాదసూచిక వివరిస్తుంది.
- source_word: εἰπὲ αὐτοῖς
  choice: వారితో ... అని చెప్పు
  rationale: తెలుగులో నివేదిత సందేశానికి సహజమైన నిర్మాణం; ఆజ్ఞ యొక్క బలాన్ని నిలుపుతుంది.
- source_word: Ἀναβαίνω
  choice: ఎక్కిపోతున్నాను
  rationale: వర్తమాన రూపంలోని ముందుకు సాగే, సమీప భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘పైకి వెళ్లడం/ఆరోహణ’ భావాన్ని నిలుపుతుంది.
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: నా తండ్రి, మీ తండ్రి
  rationale: యేసు సంబంధాన్ని, శిష్యుల సంబంధాన్ని పక్కపక్కనే ఉంచే మూలంలోని ఉద్దేశపూర్వక సమాంతరతను కాపాడుతుంది.
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: నా దేవుడు, మీ దేవుడు
  rationale: మూలపాఠంలోని ప్రత్యక్షమైన, సమాంతర పదబంధాన్ని సిద్ధాంతపరమైన మృదీకరణ లేకుండా అందిస్తుంది.
theological_decisions:
- issue: Μή μου ἅπτου యొక్క భావం
  choice: కొనసాగిస్తూ పట్టుకొని ఉండవద్దనే నిషేధం
  alternative: నన్ను తాకవద్దు
  rationale: గ్రీకు క్రియారూపం కొనసాగుతున్న క్రియను ఆపమనే భావానికి అనుకూలంగా ఉంది. అయినప్పటికీ ‘తాకవద్దు’ అనే పదార్థసాధ్యతను పాదసూచికలో నిలిపింది.
- issue: మొదటి ఉపవాక్యంలోని πατέρα
  choice: తండ్రి
  alternative: నా తండ్రి
  rationale: ఈ చోట మూలంలో μου లేదు. తరువాతి ప్రత్యక్ష వాక్యంలో మాత్రమే ‘నా తండ్రి, మీ తండ్రి’ అనే భేదం స్పష్టంగా వస్తుంది.
- issue: ‘నా దేవుడు, మీ దేవుడు’ అనే క్రీస్తుశాస్త్ర సంబంధిత ఉద్వేగం
  choice: పదబంధాన్ని నేరుగా అనువదించడం
  alternative: ‘నా దేవుడు’ అనే మాట బలాన్ని తగ్గించే వివరణాత్మక అనువాదం
  rationale: పాఠంలోని యథార్థ theological tensionను సిద్ధాంతపరంగా ముందే పరిష్కరించకుండా అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘పట్టుకొని ఉండకు’ కొనసాగుతున్న చర్య భావాన్ని స్పష్టం చేస్తుంది. ‘తండ్రి దగ్గరికి’ అనే నిర్మాణం πρὸς యొక్క సంబంధ-గమన భావాన్ని సహజంగా అందిస్తుంది; చివరి వాక్యంలో సమాంతరతను కాపాడటానికి ‘నా తండ్రి, మీ తండ్రి ... నా దేవుడు, మీ దేవుడు’ అనే క్రమం నిలుపబడింది.
