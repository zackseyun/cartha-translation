review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the absence of a possessive in the first occurrence of ‘Father,’ the perfect force of οὔπω ... ἀναβέβηκα, the command to go to Jesus’ brothers, and the fourfold relational parallel in the reported message. However, ‘ఎక్కిపోవడం’ normally suggests physically climbing upward in Telugu and is less precise here than ‘ఆరోహించడం’ for Johannine ascent. The final coordinated phrase also needs explicit dative/genitive marking in Telugu so that each of the four destinations is unambiguous.
  naturalness: ‘తండ్రి దగ్గరికి’ is understandable, but ‘తండ్రి వద్దకు’ is more natural in this formal modern Telugu register. ‘వారికి చెప్పు’ is more idiomatic than ‘వారితో ... అని చెప్పు’ for delivering a message. Repeating ‘వద్దకు’ in the final quotation makes the parallel clear and fluent.
  terminology: ‘ఆరోహించు’ appropriately renders ἀναβαίνω in this theological context without adding interpretation. ‘సహోదరులు’ retains the masculine-plural wording of ἀδελφούς; the footnote adequately explains its contextual reference. ‘నా దేవుని వద్దకు, మీ దేవుని వద్దకు’ accurately maintains the direct wording and parallelism of the Greek.
  issues:
  - severity: medium
    issue: ‘ఎక్కిపోలేదు / ఎక్కిపోతున్నాను’ is used for Jesus’ ascent.
    rationale: In standard Telugu this commonly evokes climbing. ‘ఆరోహించలేదు / ఆరోహిస్తున్నాను’ is the established, precise term for ascent in this context.
  - severity: medium
    issue: The final phrase places ‘దగ్గరికి’ only after ‘నా దేవుడు, మీ దేవుడు.’
    rationale: Telugu requires clear relational/case marking here. Repeating ‘వద్దకు’ with each coordinated noun phrase avoids an ungrammatical or potentially appositional reading and preserves the Greek’s deliberate four-part parallelism.
  - severity: low
    issue: ‘వారితో ... అని చెప్పు’ is less idiomatic for εἰπὲ αὐτοῖς.
    rationale: ‘వారికి చెప్పు’ is natural modern Telugu and directly conveys ‘tell them.’
