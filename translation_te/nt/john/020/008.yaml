id: JHN.20.8
reference: John 20:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: te
  text: అప్పుడు సమాధి దగ్గరికి మొదట వచ్చిన మరో శిష్యుడు కూడా లోపలికి వెళ్లాడు[a]. అతడు చూసి నమ్మాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రవేశించాడు.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు మూలంలో అతడు ఏమి నమ్మాడో స్పష్టంగా చెప్పకుండా కేవలం ‘నమ్మాడు’ అని ఉంది. అతడు యేసు పునరుత్థానాన్ని నమ్మాడా, తన ముందున్న ఆధారాన్ని నమ్మాడా, లేక ఇంతకుముందు వచ్చిన సమాచారాన్ని నమ్మాడా అనే విషయంలో వ్యాఖ్యానాలు భిన్నంగా ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: అప్పుడు
  rationale: ఈ పదబంధం కథనంలోని తదుపరి సంఘటనను సూచిస్తూ స్వల్పమైన నిర్ధారణ భావాన్ని కూడా కలిగిస్తుంది. ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా సంఘటనల క్రమాన్ని తెలియజేస్తుంది; ఇక్కడ ‘కాబట్టి’ అని స్పష్టంగా చేర్చడం మూలంలో ఉన్నదానికంటే నిర్ధారణ భావాన్ని ఎక్కువ చేస్తుంది.
- source_word: εἰσῆλθεν
  choice: లోపలికి వెళ్లాడు
  rationale: సమాధిలోకి ప్రవేశించిన ప్రత్యక్ష కదలికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ ἄλλος μαθητής
  choice: మరో శిష్యుడు
  rationale: యోహాను కథనంలో ఈ వ్యక్తికి వాడిన సాధారణ గుర్తింపును కాపాడుతుంది. μαθητήςకు ఈ సందర్భంలో ‘శిష్యుడు’ స్థిరమైన, సరైన పదం.
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: సమాధి దగ్గరికి మొదట వచ్చిన
  rationale: ప్రధాన క్రియకు ముందే జరిగిన చర్యను తెలుగులో సహజమైన విశేషణ పదబంధంగా వ్యక్తపరుస్తూ, అతడు పేతురుకంటే ముందుగా సమాధిని చేరుకున్నాడనే సందర్భాన్ని నిలుపుతుంది.
- source_word: μνημεῖον
  choice: సమాధి
  rationale: ఈ పునరుత్థాన కథనంలో ఇది యేసును ఉంచిన సమాధి స్థలాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘సమాధి’ స్పష్టమైన, సహజమైన పదం.
- source_word: καὶ εἶδεν
  choice: అతడు చూసి
  rationale: సంబంధవాచక పదబంధం తర్వాత కర్తను ‘అతడు’ అని స్పష్టం చేయడం తెలుగులో వాక్యాన్ని సులభంగా అర్థమయ్యేలా చేస్తుంది. ‘చూసి’ అనేది తదుపరి క్రియతో సహజంగా అనుసంధానిస్తుంది.
- source_word: ἐπίστευσεν
  choice: నమ్మాడు
  rationale: మూలంలోని క్రియకు కర్మను చేర్చకుండా సరళంగా అనువదిస్తుంది; అతడు ఏమి నమ్మాడో పాఠం స్పష్టంగా చెప్పకపోవడాన్ని అలాగే ఉంచుతుంది.
theological_decisions:
- issue: శిష్యుడు ఏమి నమ్మాడనే విషయం
  choice: కర్మను పేర్కొనకుండా ‘నమ్మాడు’ అని అనువదించడం.
  alternative: ‘యేసు లేచాడని నమ్మాడు,’ ‘మరియ చెప్పినదాన్ని నమ్మాడు,’ లేదా ‘విశ్వాసంలోకి వచ్చాడు’ అని స్పష్టీకరించడం.
  rationale: గ్రీకు మూలంలో πιστεύω క్రియకు కర్మ లేదు. తరువాతి వచనం వెలుగులో దీనికి భిన్నమైన వ్యాఖ్యానాలు సాధ్యమైనందున, ఒక నిర్దిష్ట అర్థాన్ని అనువాదంలో చేర్చడం పాఠంలోని ఉద్దేశపూర్వక అనిశ్చితిని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని సంక్షిప్తతను, ముఖ్యంగా ‘నమ్మాడు’ అనే కర్మలేని క్రియలోని వ్యాఖ్యానాత్మక ఉద్వేగాన్ని కాపాడాం. [a] గుర్తును ‘లోపలికి వెళ్లాడు’ తర్వాత ఉంచడం ద్వారా ఆ పదప్రయోగానికి సంబంధించిన ప్రత్యామ్నాయం స్పష్టమైంది.
