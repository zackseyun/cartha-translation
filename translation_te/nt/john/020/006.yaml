  verdict: revise
  source_fidelity: The draft correctly represents the narrative sequence, Peter's entering the tomb, and the final historical present (‘చూస్తాడు’). However, ‘అతని వెనుక వస్తున్న’ can merely describe physical position and is less direct for ἀκολουθῶν αὐτῷ, which denotes following him.
  naturalness: The wording is generally clear modern Telugu. ‘అతనిని అనుసరిస్తూ’ is both more idiomatic and more semantically precise than ‘అతని వెనుక వస్తున్న.’
  terminology: ‘సీమోను పేతురు,’ ‘సమాధి,’ and ‘నారబట్టలు’ are suitable. ‘నారబట్టలు’ appropriately retains the non-interpretive sense of τὰ ὀθόνια without adding ‘burial.’
  issues:
