source:
  edition: SBLGNT
  text: ἔρχεται οὖν ⸀καὶ Σίμων Πέτρος ἀκολουθῶν αὐτῷ, καὶ εἰσῆλθεν εἰς τὸ μνημεῖον· καὶ θεωρεῖ τὰ ὀθόνια κείμενα,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/006.yaml
  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
translation:
  language: te
  text: అప్పుడు సీమోను పేతురు కూడా అతనిని అనుసరిస్తూ వచ్చాడు[a]. అతడు సమాధిలోకి ప్రవేశించి, అక్కడ పడి ఉన్న నారబట్టలను చూస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో ‘వస్తాడు’ అనే చారిత్రక వర్తమాన రూపం ఉంది. తెలుగు కథన ప్రవాహం కోసం ఇక్కడ దాన్ని ‘వచ్చాడు’ అని అనువదించాం; తరువాతి ‘చూస్తాడు’లో మాత్రం మూలంలోని వర్తమాన రూపాన్ని నిలిపాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: వచ్చాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, ఆధునిక తెలుగు కథన ప్రవాహంలో భూతకాల రూపం సహజంగా సంఘటనల క్రమాన్ని తెలియజేస్తుంది.
- source_word: οὖν
  choice: అప్పుడు
  rationale: ముందటి వచనంలోని సంఘటనకు కొనసాగింపుగా కథన పురోగతిని సహజంగా సూచిస్తుంది.
- source_word: καὶ Σίμων Πέτρος
  choice: సీమోను పేతురు కూడా
  rationale: καί ఇక్కడ మరొక శిష్యునితో పాటు సీమోను పేతురు రావడాన్ని సూచించే అదనపు భావాన్ని కలిగిస్తోంది.
- source_word: ἀκολουθῶν αὐτῷ
  choice: అతని వెనుక వస్తున్న
  rationale: ప్రధాన క్రియతో సమకాలంలో జరుగుతున్న అనుసరణను తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: సమాధిలోకి ప్రవేశించి
  rationale: μνημεῖονను సందర్భానుసారంగా ‘సమాధి’గా, εἰς సూచించే లోపలికి కదలికను ‘లోకి’తో స్పష్టంగా అందిస్తుంది.
- source_word: θεωρεῖ
  choice: చూస్తాడు
  rationale: మూలంలోని చారిత్రక వర్తమాన కాలాన్ని నిలిపి, దృశ్యానికి కథన సజీవతను ఇస్తుంది; సాధారణ పాఠకులకు సహజమైన పదం.
- source_word: τὰ ὀθόνια
  choice: నారబట్టలను
  rationale: అంత్యక్రియల సందర్భాన్ని పదంలోనే చేర్చకుండా, నారతో చేసిన వస్త్రాలు అనే మూలపదపు పారదర్శక భావాన్ని నిలుపుతుంది.
- source_word: κείμενα
  choice: అక్కడ పడి ఉన్న
  rationale: బట్టలు ఆ ప్రదేశంలో ఉన్న స్థితిని దృశ్యాత్మకంగా, సహజమైన తెలుగులో తెలియజేస్తుంది.
