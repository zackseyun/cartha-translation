source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: te
  text: 'యేసు అతనితో ఇలా అన్నాడు: “నీవు నన్ను చూశావు కాబట్టి నమ్మావా?[a] చూడక నమ్మినవారు ధన్యులు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవు నన్ను చూశావు కాబట్టి నమ్మావు.” గ్రీకు వాక్యాన్ని ప్రశ్నగా గానీ ప్రకటనగా గానీ చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: యేసు అతనితో … అన్నాడు
  rationale: గ్రీకులో వర్తమానకాల కథన రూపం ఉన్నప్పటికీ, ఆధునిక తెలుగు కథనశైలిలో భూతకాల రూపం సహజం. αὐτῷను ‘అతనితో’ అని స్పష్టంగా నిలిపాం.
- source_word: Ὅτι
  choice: కాబట్టి
  rationale: ఇక్కడ ὅτι, చూడడం మరియు నమ్మడం మధ్య కారణ సంబంధాన్ని సూచిస్తుంది. ప్రశ్నగా చదివినప్పుడు ‘కాబట్టి’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: ἑώρακάς με
  choice: నీవు నన్ను చూశావు
  rationale: గ్రీకు పరిపూర్ణకాలం పూర్తయిన దర్శనానికి ప్రస్తుత సందర్భంలో కొనసాగుతున్న ప్రాముఖ్యతను ఇస్తుంది. తెలుగులో ‘చూశావు’ ఈ సందర్భంలో సహజంగా ఆ భావాన్ని మోస్తుంది.
- source_word: πεπίστευκας
  choice: నమ్మావా
  rationale: పరిపూర్ణకాల రూపం దర్శనం తరువాత ఏర్పడిన విశ్వాసాన్ని సూచిస్తుంది. తెలుగులో ప్రశ్నార్థక ‘నమ్మావా’ సహజంగా ఉండి, గ్రీకు వాక్యంలోని సాధ్యమైన ప్రశ్నార్థక పఠనాన్ని నిలుపుతుంది.
- source_word: μακάριοι
  choice: ధన్యులు
  rationale: μακάριοιకు ‘ధన్యులు’ అనేది ఆశీర్వాద ప్రకటనకు తగిన, స్థిరమైన తెలుగు పదం; కేవలం మానసిక సంతోషాన్ని సూచించే పదాలకంటే మూలభావాన్ని మెరుగ్గా అందిస్తుంది.
- source_word: οἱ μὴ ἰδόντες καὶ πιστεύσαντες
  choice: చూడకపోయినా నమ్మినవారు
  rationale: నిరాకరణతో కూడిన దర్శనం మరియు దాని వెంట విశ్వాసం మధ్య ఉన్న స్పష్టమైన వ్యత్యాసాన్ని సహజమైన తెలుగులో ‘చూడకపోయినా’ తెలియజేస్తుంది; ‘నమ్మినవారు’ రెండు గ్రీకు కృదంతాల నామవాచక ప్రయోగాన్ని సంక్షిప్తంగా అందిస్తుంది.
theological_decisions:
- issue: యేసు పలికిన మొదటి వాక్యం ప్రశ్నా, ప్రకటననా?
  choice: “నీవు నన్ను చూశావు కాబట్టి నమ్మావా?” అని ప్రశ్నగా అనువదించాం.
  alternative: “నీవు నన్ను చూశావు కాబట్టి నమ్మావు.” అని ప్రకటనగా కూడా చదవవచ్చు.
  rationale: ప్రాచీన గ్రీకు ప్రతుల్లో ఆధునిక విరామచిహ్నాలు లేనందున రెండు పఠనాలూ వ్యాకరణపరంగా సాధ్యమే. ప్రధాన పాఠంలో సందర్భానికి అనుగుణమైన ప్రశ్నార్థక పఠనాన్ని ఉంచి, ప్రకటన పఠనాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘ధన్యులు’ బీటిట్యూడ్ తరహా ఆశీర్వాద ప్రకటనకు తగిన బైబిలీయ గంభీరతను నిలుపుతుంది; వాక్యంలోని ప్రశ్న/ప్రకటన అస్పష్టత పాదసూచికలో భద్రపరచబడింది.
