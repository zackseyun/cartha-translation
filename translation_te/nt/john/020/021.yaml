source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: te
  text: 'కాబట్టి యేసు వారితో మళ్లీ ఇలా చెప్పాడు: “మీకు శాంతి కలుగుగాక![a] తండ్రి నన్ను పంపినట్లే, నేనూ మిమ్మల్ని పంపుతున్నాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయంగా, “మీతో శాంతి ఉండుగాక.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: మునుపటి సంఘటనతో కథన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది; సందర్భంలో ఇది కఠినమైన తార్కిక నిర్ధారణకన్నా కథన కొనసాగింపుగా ఉంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: మునుపటి వచనంలోని యేసు పలుకును తిరిగి పలికినట్లు నేరుగా తెలియజేస్తుంది.
- source_word: Εἰρήνη ὑμῖν
  choice: మీకు శాంతి కలుగుగాక
  rationale: క్రియలేని గ్రీకు శుభవచనపు భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగు ఆశీర్వాద రూపంలో అందిస్తుంది.
- source_word: καθὼς
  choice: పంపినట్లే
  rationale: తండ్రి పంపడం మరియు యేసు పంపడం మధ్య ఉన్న పోలికను స్పష్టంగా ఉంచుతుంది.
- source_word: ἀπέσταλκέν
  choice: పంపిన
  rationale: గ్రీకు పరిపూర్ణ కాలంలోని పూర్తయిన పంపకాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; దాని కొనసాగుతున్న ప్రాముఖ్యతను వాక్య సందర్భం తెలియజేస్తుంది.
- source_word: ὁ πατήρ
  choice: తండ్రి
  rationale: మూలంలో ఉన్న నిర్దిష్ట బిరుదును స్వామ్యపదం జోడించకుండా నిలుపుతుంది.
- source_word: κἀγὼ
  choice: నేనూ
  rationale: ‘మరియు నేను కూడా’ అనే సంయుక్త, ఉద్ఘాటన భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: πέμπω
  choice: పంపుతున్నాను
  rationale: ప్రస్తుత కాలంలోని తక్షణ నియామక చర్యను స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: తండ్రి యేసును పంపడానికి, యేసు శిష్యులను పంపడానికి మధ్య సంబంధం
  choice: “తండ్రి నన్ను పంపినట్లే, నేనూ మిమ్మల్ని పంపుతున్నాను”
  alternative: “తండ్రి నన్ను పంపాడు; అలాగే నేనూ మిమ్మల్ని పంపుతున్నాను”
  rationale: మూలంలోని పోలికకు ఉన్న బలాన్ని నిలుపుతూ, అధికారం, విధానం లేదా పరిచర్య పూర్తిగా సమానమని అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా వాక్య గంభీరతను నిలుపుతూ అనువదించబడింది. మూలంలో లేని ‘నా తండ్రి’ అనే స్వామ్యరూపం చేర్చలేదు.
