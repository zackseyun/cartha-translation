    text: లేదా, “పడి ఉన్న నారబట్టలను చూస్తాడు.” గ్రీకు పాఠ్యంలో “అక్కడ” అనే పదం స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακύψας
  choice: వంగి లోపలికి తొంగిచూసినప్పుడు
  rationale: సమాధి ప్రవేశద్వారం దగ్గర శిష్యుడు శరీరాన్ని వంచి లోపలికి చూసిన చర్యను ఈ భూతకాల కృదంతం సూచిస్తుంది. ‘వంగి ... తొంగిచూసినప్పుడు’ అనేది శరీర కదలికను, చూపు దిశను రెండింటినీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: βλέπει
  choice: చూస్తాడు
  rationale: యోహాను కథనంలోని సజీవతను నిలుపుతూ గ్రీకు చారిత్రక వర్తమాన కాలాన్ని తెలుగులో వర్తమాన రూపంతోనే ఉంచాం.
- source_word: κείμενα
  choice: అక్కడ పడి ఉన్న
  rationale: κεῖμαι రూపం బట్టలు ఒక చోట పడి ఉన్న స్థితిని సూచిస్తుంది. సహజమైన తెలుగు కోసం ‘అక్కడ’ను సందర్భానుసారంగా చేర్చాం; అది గ్రీకులో స్పష్టంగా లేదని పాదసూచిక తెలియజేస్తుంది.
- source_word: τὰ ὀθόνια
  choice: నారబట్టలు
  rationale: ఈ పదం సమాధి సందర్భంలో ఉపయోగించిన నారతో చేసిన బట్టలను సూచిస్తుంది. సందర్భం వాటి అంత్యక్రియల వినియోగాన్ని ఇప్పటికే స్పష్టం చేస్తున్నందున వివరణాత్మక విస్తరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: οὐ μέντοι
  choice: అయినా
  rationale: చూడటానికి, లోపలికి వెళ్లకపోవటానికి మధ్యనున్న మృదువైన వ్యతిరేక భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰσῆλθεν
  choice: లోపలికి వెళ్లలేదు
  rationale: సమాధిలోకి ప్రవేశించలేదనే గ్రీకు భూతకాల క్రియ భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
