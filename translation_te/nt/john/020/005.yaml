  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: te
  text: అతడు వంగి లోపలికి తొంగిచూసి, అక్కడ పడి ఉన్న నారబట్టలను చూస్తాడు[a]; అయినా లోపలికి వెళ్లలేదు.
  philosophy: optimal-equivalence
  footnotes:
