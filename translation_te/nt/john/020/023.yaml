source:
  edition: SBLGNT
  text: ἄν τινων ἀφῆτε τὰς ἁμαρτίας ⸀ἀφέωνται αὐτοῖς· ἄν τινων κρατῆτε κεκράτηνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: te
  text: మీరు ఎవరి పాపాలనైనా క్షమిస్తే, అవి వారికి క్షమించబడి ఉన్నాయి; ఎవరి పాపాలనైనా క్షమించకుండా ఉంచితే, అవి క్షమించబడకుండా ఉంచబడి ఉన్నాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄν τινων
  choice: ఎవరి ... అయినా
  rationale: ἄν తో కూడిన సంభావ్యార్థక క్రియ అనిర్దిష్ట షరతును సూచిస్తుంది. తెలుగులో ‘ఎవరి ... అయినా’ సహజంగా అనిర్దిష్ట వ్యక్తులను సూచిస్తూ షరతు భావాన్ని ‘-తే’ ద్వారా నిలుపుతుంది.
- source_word: ἀφῆτε
  choice: మీరు ... క్షమిస్తే
  rationale: పాపాల సందర్భంలో ἀφίημι యొక్క సాధారణ అర్థం ‘క్షమించు’. ‘విడిచిపెట్టు’ ఇక్కడ అతివిస్తృతంగా ఉంటుంది.
- source_word: τὰς ἁμαρτίας
  choice: పాపాలను
  rationale: గ్రీకు నిర్దిష్ట ఉపపదాన్ని తెలుగులో ప్రత్యేక పదంతో చూపడం సహజం కాదు; ‘పాపాలను’ స్పష్టమైన కర్మగా ఉంటుంది.
- source_word: ἀφέωνται
  choice: అవి వారికి క్షమించబడి ఉన్నాయి
  rationale: పరిపూర్ణ కర్మణి రూపంలోని పూర్తయిన క్రియతో కొనసాగుతున్న ఫలితాన్ని ‘క్షమించబడి ఉన్నాయి’ నిలుపుతుంది; కర్తను పేరు పెట్టకుండా గ్రీకు కర్మణి ప్రయోగాన్ని కూడా కాపాడుతుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: దత్తి బహువచన సర్వనామాన్ని తెలుగులో సహజంగా ‘వారికి’ అని చూపడం ద్వారా పాపాలు ఎవరికోసం క్షమించబడ్డాయో స్పష్టమవుతుంది.
- source_word: κρατῆτε
  choice: నిలిపి ఉంచితే
  rationale: క్షమించడానికి విరుద్ధంగా κρατέω ఇక్కడ పాపాలను విడిచిపెట్టకుండా ఉంచడాన్ని సూచిస్తుంది. ‘నిలిపి ఉంచు’ ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κεκράτηνται
  choice: అవి నిలిపి ఉంచబడి ఉన్నాయి
  rationale: పరిపూర్ణ కర్మణి రూపం సూచించే కొనసాగుతున్న స్థితిని, మొదటి భాగంతో సమాంతరంగా, ‘నిలిపి ఉంచబడి ఉన్నాయి’ తెలియజేస్తుంది.
theological_decisions:
- issue: శిష్యుల చర్య స్వతంత్రంగా క్షమాపణను కలిగిస్తుందా, లేక అది ముందుగా లేదా దేవునిచేత ఏర్పడిన వాస్తవానికి అనుగుణంగా ఉందా?
  choice: ‘క్షమించబడి ఉన్నాయి’ / ‘నిలిపి ఉంచబడి ఉన్నాయి’ అనే పరిపూర్ణ కర్మణి రూపాలను ఉంచడం
  alternative: ‘క్షమించబడతాయి’ / ‘క్షమించబడవు’ అని భవిష్యత్ లేదా సాధారణ ఫలితంగా అనువదించడం; లేదా ‘దేవుడు క్షమించాడు’ / ‘దేవుడు నిలిపి ఉంచాడు’ అని కర్తను చేర్చడం
  rationale: గ్రీకు వాక్యం కర్తగా దేవుణ్ణి స్పష్టంగా పేర్కొనదు; అలాగే శిష్యుల చర్యకు మరియు కర్మణి పరిపూర్ణ స్థితికి మధ్య సంబంధాన్ని వివరించదు. అందువల్ల కర్తను చేర్చకుండా, పూర్తయి కొనసాగుతున్న స్థితిని నిలిపి, వచనంలోని నిజమైన వేదాంత ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని రెండు సమాంతర భాగాలు, కర్మణి ప్రయోగం, పరిపూర్ణ ఫలితస్థితి సాధ్యమైనంతవరకు నిలుపబడ్డాయి. పాదసూచనలు లేవు కాబట్టి ప్రధాన పాఠంలో సూచికలు అవసరం లేదు.
