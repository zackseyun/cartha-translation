  text: καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς· Λάβετε πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/022.yaml
  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
translation:
  language: te
  text: ఇది చెప్పిన తర్వాత ఆయన వారిమీద ఊది[a], “పరిశుద్ధాత్మను పొందండి” అని వారితో అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిలోనికి ఊపిరి ఊది.’ ఈ క్రియ ఆదికాండము 2:7 మరియు యెహెజ్కేలు 37లోని సృష్టి, నూతన సృష్టి చిత్రణను కూడా జ్ఞాపకం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: ఇది చెప్పిన తర్వాత
  rationale: అనోరిస్ట్ పార్టిసిపల్ ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది. ఈ రూపం కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐνεφύσησεν
  choice: వారిమీద ఊది
  rationale: ఈ క్రియకు ‘మీద ఊదడం’ లేదా సందర్భానుసారం ‘లోపలికి ఊదడం’ అనే భావాలు సాధ్యము. ప్రధాన పాఠంలో దిశను అతిగా నిర్దిష్టం చేయకుండా సహజమైన ‘వారిమీద ఊది’ ఎంచుకోబడింది; సృష్టి, నూతన సృష్టి ప్రతిధ్వనిని పాదసూచిక తెలియజేస్తుంది.
- source_word: λέγει αὐτοῖς
  choice: వారితో అన్నాడు
  rationale: గ్రీకులో ఇది చారిత్రక వర్తమాన కాలంలో ఉన్నా, తెలుగు కథనశైలిలో గతకాల రూపం సహజంగా ఉండి భావాన్ని మార్చదు.
- source_word: Λάβετε
  choice: పొందండి
  rationale: ఇక్కడ λαμβάνω ఆజ్ఞారూపం ఆత్మను స్వీకరించడాన్ని సూచిస్తుంది. ‘తీసుకోండి’ కంటే ‘పొందండి’ తెలుగు సందర్భంలో సహజంగా ఉండి, స్వప్రయత్నంతో చేజిక్కించుకోవడమనే అనవసర భావాన్ని నివారిస్తుంది.
- source_word: πνεῦμα ἅγιον
  choice: పరిశుద్ధాత్మను
  rationale: యోహాను సువార్త సందర్భంలో ఇది సాధారణమైన పవిత్ర ఆత్మను కాక దైవిక పరిశుద్ధాత్మను సూచిస్తుంది. గ్రీకులో ఉపపదం లేకపోయినా తెలుగు సమాసరూపం సహజంగా నిర్దిష్ట సూచనను అందిస్తుంది.
theological_decisions:
- issue: πνεῦμα ἅγιον వ్యక్తిగత దైవిక పరిశుద్ధాత్మను సూచిస్తుందా, లేక అనిర్దిష్టమైన ‘పవిత్ర ఆత్మ’ను సూచిస్తుందా
  choice: పరిశుద్ధాత్మను
  alternative: పవిత్రమైన ఆత్మను
  rationale: యోహాను సువార్తలోని సమీప మరియు విస్తృత సందర్భం దైవిక పరిశుద్ధాత్మనే సూచిస్తుంది. అయినప్పటికీ మూలపాఠంలో లేని అదనపు వివరణను ప్రధాన పాఠంలో చేర్చలేదు.
- issue: ἐνεφύσησεν ద్వారా సృష్టి లేదా నూతన సృష్టి సూచనను ప్రధాన పాఠంలో స్పష్టీకరించాలా
  choice: ప్రధాన పాఠంలో ‘వారిమీద ఊది’; ప్రతిధ్వనిని పాదసూచికలో పేర్కొనడం
  alternative: వారిలోనికి ఊపిరి ఊది
  rationale: ఆదికాండము 2:7 మరియు యెహెజ్కేలు 37తో పదప్రతిధ్వని నిజమైనదే; అయితే దానిని ప్రధాన అనువాదంలో వివరణగా స్థిరపరచడం మూలంలోని దిశాసంబంధ అస్పష్టతను అతిగా పరిష్కరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘వారిమీద ఊది’ సాధారణ పాఠకునికి అర్థమయ్యే రూపం; సాధ్యమైన ప్రత్యామ్నాయ దిశాభావం మరియు అంతర్పాఠ్య ప్రతిధ్వని పాదసూచికలో భద్రపరచబడ్డాయి.
