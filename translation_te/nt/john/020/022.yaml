  naturalness: The wording is clear, idiomatic modern standard Telugu, and maintains a respectful biblical narrative register. The placement of the quoted imperative before ‘అని వారితో అన్నాడు’ is natural Telugu reported-speech syntax.
  terminology: ‘పరిశుద్ధాత్మ’ is the established Telugu term for πνεῦμα ἅγιον in this Johannine context. The footnote preserves the viable alternative ‘వారిలోనికి’ and identifies the Genesis and Ezekiel resonance without imposing it on the main text.
