source:
  edition: SBLGNT
  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: te
  text: అయితే, పన్నెండుమందిలో ఒకడైన తోమా—దిదుము[a] అని పిలువబడినవాడు—యేసు వచ్చినప్పుడు వారితో లేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దిదుము’ అనే గ్రీకు పేరుకు ‘కవలవాడు’ అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ఇది బలమైన వ్యతిరేకతను కాక, కథనంలో తోమా వైపు దృష్టి మళ్లించే స్వల్ప అనుసంధానాన్ని సూచిస్తుంది. తెలుగు కథన ప్రవాహంలో ‘అయితే’ ఆ మార్పును సహజంగా తెలియజేస్తుంది.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: పన్నెండుమందిలో ఒకడైన
  rationale: యేసు నియమించిన ‘పన్నెండుమంది’ అనే గుర్తింపు పొందిన శిష్యబృందంలో తోమా సభ్యుడని నేరుగా తెలియజేస్తుంది; మూలంలో లేని ‘శిష్యులు’ అనే పదాన్ని చేర్చదు.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: దిదుము[a] అని పిలువబడినవాడు
  rationale: Δίδυμος ఇక్కడ తోమాకు వాడిన గ్రీకు పేరు లేదా బిరుదు. దాని రూపాన్ని ‘దిదుము’గా లిప్యంతరీకరించి, అర్థాన్ని పాదటిప్పణిలో తెలియజేయడం ద్వారా పేరు స్వరూపం మరియు దాని పదార్థం రెండూ నిలుస్తాయి.
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: వారితో లేడు
  rationale: μετά + సంబంధ విభక్తితో కూడిన అసంపూర్ణ భూతకాల క్రియను సహజమైన, సంక్షిప్తమైన తెలుగులో వ్యక్తం చేస్తుంది; ఆ సమయంలో తోమా గుంపుతో లేకపోవడమే భావం.
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: యేసు వచ్చినప్పుడు
  rationale: ἔρχομαι యొక్క సాధారణ అర్థమైన ‘వచ్చు’ను నేరుగా నిలుపుతుంది; ‘చేరుకున్నప్పుడు’ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
theological_decisions:
- issue: Δίδυμοςను అర్థానువాదం చేయాలా, లిప్యంతరీకరించాలా
  choice: ప్రధాన వాక్యంలో ‘దిదుము’ అని లిప్యంతరీకరించి, ‘కవలవాడు’ అనే అర్థాన్ని పాదటిప్పణిలో ఇవ్వడం
  alternative: ప్రధాన వాక్యంలోనే ‘కవలవాడు’ అని అనువదించడం
  rationale: ఈ పదం అర్థవంతమైన బిరుదే అయినప్పటికీ, వాక్యంలో తోమాకు వాడిన పేరులా కూడా పనిచేస్తుంది. లిప్యంతరీకరణ పేరు స్వరూపాన్ని కాపాడుతుంది; పాదటిప్పణి దాని గ్రీకు అర్థాన్ని పాఠకునికి స్పష్టంగా అందిస్తుంది. ఇందులో ఏ ప్రత్యేక సిద్ధాంతపరమైన వ్యాఖ్యానమూ చేర్చబడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మధ్యలోని వివరణాత్మక భాగాన్ని దీర్ఘవిరామాలతో వేరు చేసి, తోమా గుర్తింపును స్పష్టంగా ఉంచాం. ‘పన్నెండుమంది’ని గుర్తింపు పొందిన బృందనామంగా వాడాం.
