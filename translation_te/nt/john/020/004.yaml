revisions:
- from: ఆ ఇద్దరూ కలిసి పరుగెత్తుతున్నారు; మరొక శిష్యుడు పేతురుకంటే వేగంగా ముందుకు పరుగెత్తి[a], సమాధి దగ్గరికి మొదట చేరుకున్నాడు.
  to: ఆ ఇద్దరూ కలిసి పరుగెత్తుతూ ఉండగా, ఆ మరో శిష్యుడు పేతురుకంటే వేగంగా ముందుకు పరుగెత్తి[a] సమాధి వద్దకు మొదట చేరుకున్నాడు.
  rationale: The revision corrects the temporal presentation of the imperfect to clear past-progressive Telugu, clarifies that this is the other disciple of the pair, and improves the standard narrative phrasing for arrival at the tomb. It retains the Greek’s mild connective sense without imposing an adversative contrast, and it preserves the lexical alternative in the footnote.
