translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. గ్రీకు వాక్యంలోని అనుసంధానాన్ని అనవసరమైన విరోధార్థం లేకుండా నిలిపి, పరుగెత్తే చర్యలోని కొనసాగింపు భావాన్ని సంరక్షించాం.
