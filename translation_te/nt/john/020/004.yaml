source:
  edition: SBLGNT
  text: ἔτρεχον δὲ οἱ δύο ὁμοῦ· καὶ ὁ ἄλλος μαθητὴς προέδραμεν τάχιον τοῦ Πέτρου καὶ ἦλθεν πρῶτος εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/004.yaml
  text: The two were running together[a], and the other disciple ran ahead faster than Peter and came first to the tomb.
translation:
  language: te
  text: ఆ ఇద్దరూ కలిసి పరుగెత్తుతూ ఉండగా, ఆ మరో శిష్యుడు పేతురుకంటే వేగంగా ముందుకు పరుగెత్తి[a] సమాధి వద్దకు మొదట చేరుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పేతురును మించి పరుగెత్తి.” గ్రీకు క్రియకు అక్షరార్థంగా “ముందుకు పరుగెత్తి” అని అర్థం; దానితో “పేతురుకంటే వేగంగా” అనే తులన వ్యక్తమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτρεχον
  choice: పరుగెత్తుతున్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న గత చర్యను సూచిస్తుంది; తెలుగు కథనశైలిలో ‘పరుగెత్తుతున్నారు’ ఆ కొనసాగింపు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: ;
  rationale: δέ ఇక్కడ స్వల్ప అనుసంధానాన్ని సూచిస్తుంది. ప్రత్యేకంగా విరోధార్థం చేర్చకుండా, తెలుగు వాక్యంలో అర్ధవిరామంతో ముందరి సందర్భం నుంచి ఈ చర్యకు మార్పును చూపించాం.
- source_word: οἱ δύο ὁμοῦ
  choice: ఆ ఇద్దరూ కలిసి
  rationale: οἱ δύο అనే నిర్దిష్ట ద్వయ సూచనను, ὁμοῦ అనే ఉమ్మడి చర్య భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ ἄλλος μαθητής
  choice: మరొక శిష్యుడు
  rationale: తక్షణ సందర్భంలో పేతురుకు భిన్నమైన రెండవ శిష్యుణ్ణి సూచిస్తుంది; ‘శిష్యుడు’ సువార్త కథనానికి సహజమైన ప్రామాణిక పదం.
- source_word: προέδραμεν
  choice: ముందుకు పరుగెత్తి
  rationale: ముందుగా లేదా ముందుకు పరుగెత్తడం అనే సమాసక్రియ చిత్రణను సంక్షిప్తం చేయకుండా నిలుపుతుంది.
- source_word: τάχιον τοῦ Πέτρου
  choice: పేతురుకంటే వేగంగా
  rationale: గ్రీకు తులనాత్మక నిర్మాణాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἦλθεν πρῶτος
  choice: మొదట చేరుకున్నాడు
  rationale: పదశః ‘మొదట వచ్చాడు’ కంటే గమ్యస్థానానికి ముందుగా చేరిన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς τὸ μνημεῖον
  choice: సమాధి దగ్గరికి
  rationale: తరువాతి వచనంలో అతడు ఇంకా లోపలికి వెళ్లలేదని స్పష్టమవుతుంది; అందువల్ల εἰς ను ఇక్కడ ‘లోపలికి’ అని కాకుండా సమాధి వద్దకు చేరడంగా అనువదించాం.
