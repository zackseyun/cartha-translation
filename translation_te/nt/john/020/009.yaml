id: JHN.20.9
reference: John 20:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδέπω γὰρ ᾔδεισαν τὴν γραφὴν ὅτι δεῖ αὐτὸν ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: te
  text: ఎందుకంటే, ఆయన మృతులలో నుండి లేవవలసి ఉందని లేఖనాన్ని[a] వారు అప్పటివరకు ఇంకా అర్థం చేసుకోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన మృతులలో నుండి లేపబడవలసి ఉందని లేఖనాన్ని.” ఇక్కడ గ్రీకులో క్రియ కర్తరి అనంతరూపంలో ఉంది; దాని భావం “లేవడం.”
    reason: పునరుత్థానాన్ని కర్మణి రూపంలో వ్యక్తం చేసే సాధ్యమైన ప్రత్యామ్నాయాన్ని తెలియజేస్తూనే, మూలంలోని కర్తరి అనంతరూపాన్ని స్పష్టం చేయడం.
lexical_decisions:
- source_word: οὐδέπω
  choice: అప్పటికి ఇంకా … లేదు
  rationale: ఆ సమయం వరకు వారు గ్రహించలేదనే కాలసూచక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను జోడించే సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ᾔδεισαν
  choice: అర్థం చేసుకోలేదు
  rationale: లేఖనం ఉనికిని కేవలం తెలుసుకోవడం కాక, దాని భావాన్ని గ్రహించడం ఇక్కడ ఉద్దేశం.
- source_word: τὴν γραφὴν
  choice: లేఖనాన్ని
  rationale: ఏకవచన గ్రాఫేను ఏకవచనంగానే ఉంచి, అధికారిక పవిత్ర లేఖనాన్ని లేదా నిర్దిష్ట లేఖన సాక్ష్యాన్ని సూచించే వీలును నిలుపుతుంది.
- source_word: ὅτι
  choice: అని చెప్పే
  rationale: వారు లేఖనంలో గ్రహించని విషయాన్ని సహజమైన తెలుగు సంబంధ నిర్మాణంలో పరిచయం చేస్తుంది.
- source_word: δεῖ
  choice: లేవవలసి ఉంది
  rationale: ఇది కేవలం భవిష్యత్ సంఘటన కాక, అవసరంగా జరగవలసినదనే బలాన్ని వ్యక్తం చేస్తుంది; ఆ అవసరానికి మూలాన్ని అనువాదంలో అదనంగా నిర్ధారించదు.
- source_word: αὐτὸν
  choice: ఆయన
  rationale: తెలుగు ఉపవాక్యంలో సహజమైన కర్తగా, యేసును గౌరవపూర్వకంగా సూచిస్తుంది.
- source_word: ἐκ νεκρῶν
  choice: మృతులలో నుండి
  rationale: బహువచన ‘మృతులు’ అనే మూల రూపాన్ని కనిపించేలా ఉంచుతూ పునరుత్థాన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀναστῆναι
  choice: లేవవలసి
  rationale: గ్రీకులోని కర్తరి క్రియారూపాన్ని నిలుపుతూ ‘లేపబడాలి’ అనే కర్మణి రూపాన్ని ప్రధాన పాఠ్యంలోకి తేవదు.
theological_decisions:
- issue: పునరుత్థాన వాక్యంలోని క్రియారూపం మరియు కర్తృత్వం
  choice: ఆయన మృతులలో నుండి లేవవలసి ఉంది
  alternative: ఆయన మృతులలో నుండి లేపబడవలసి ఉంది
  rationale: ἀναστῆναι కర్తరి అనిర్దిష్ట క్రియారూపం కాబట్టి ప్రధాన పాఠ్యంలో ‘లేవడం’ అని ఇచ్చాం. ఇతర నూతన నిబంధన సందర్భాల్లో కనిపించే కర్మణి భావం సత్యమైనదైనా, దాన్ని ఈ వచనంలోని రూపంపై రుద్దకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవపూర్వకమైన ‘ఆయన’ వాడబడింది. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేందుకు ‘ὅτι’ ఉపవాక్యాన్ని ‘అని చెప్పే లేఖనం’గా కూర్చాం. ‘లేఖనం’ అనే ఏకవచనం మరియు ‘మృతులలో నుండి’ అనే మూలానికి సమీపమైన పదబంధం ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
