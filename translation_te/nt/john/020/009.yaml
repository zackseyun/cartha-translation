revisions:
- from: ఎందుకంటే, ఆయన మృతులలో నుండి లేవవలసి ఉందని చెప్పే లేఖనాన్ని[a] వారు అప్పటికి ఇంకా అర్థం చేసుకోలేదు.
  to: ఎందుకంటే, ఆయన మృతులలో నుండి లేవవలసి ఉందని లేఖనాన్ని[a] వారు అప్పటివరకు ఇంకా అర్థం చేసుకోలేదు.
  rationale: The revision restores the Greek content-clause relationship more directly, while retaining the singular ‘లేఖనం,’ the temporal force of οὐδέπω, the necessity expressed by δεῖ, and the active wording of ἀναστῆναι. The footnote continues to preserve the possible passive alternative without placing it in the main text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:53:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the explanatory γάρ, the singular ‘Scripture,’ the temporal ‘not yet,’ necessity, and the active resurrection expression. However, rendering ὅτι as ‘అని చెప్పే’ makes Scripture itself the relative-clause subject (‘the Scripture that says’), whereas the Greek more directly presents the content of what they had not yet understood from/in the Scripture.
  naturalness: The wording is generally modern and clear. A direct content clause before ‘లేఖనాన్ని’ is more idiomatic and closer to the Greek construction.
  terminology: ‘లేఖనం,’ ‘మృతులలో నుండి,’ and active ‘లేవవలసి’ are appropriate. The footnote should call ἀναστῆναι an active infinitive, rather than broadly a ‘కర్తరి క్రియారూపం.’
  issues:
  - severity: low
    issue: The phrase ‘లేవవలసి ఉందని చెప్పే లేఖనాన్ని’ recasts the Greek content clause as a relative clause modifying ‘లేఖనం.’
    rationale: This is understandable Telugu, but ‘ఆయన … లేవవలసి ఉందని లేఖనాన్ని’ more directly preserves ‘they did not yet understand the Scripture, that …’ without adding the explicit sense ‘Scripture that says.’
  - severity: low
    issue: The footnote’s grammatical description is imprecise.
    rationale: ἀναστῆναι is specifically an active infinitive; identifying it as such gives readers a more accurate basis for the alternative passive rendering.
  revised_text: ఎందుకంటే, ఆయన మృతులలో నుండి లేవవలసి ఉందని లేఖనాన్ని[a] వారు అప్పటివరకు ఇంకా అర్థం చేసుకోలేదు.
