id: JHN.20.1
reference: John 20:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: te
  text: వారం మొదటి రోజున[a], మగ్దలేనే మరియ ఉదయాన్నే, ఇంకా చీకటిగా ఉండగా, సమాధికి వస్తుంది. సమాధి నుండి రాయి తొలగించబడి ఉందని ఆమె చూస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘సబ్బతులలో ఒక దినమున’; ఇది ‘వారం మొదటి రోజున’ అనే అర్థమిచ్చే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: వారం మొదటి రోజున
  rationale: ఇది అక్షరార్థంగా ‘సబ్బతులలో ఒకటవ రోజున’ అని ఉన్నా, కొయినే గ్రీకులో వారపు మొదటి రోజును సూచించే నానుడి. δέకు ఇక్కడ ప్రత్యేక విరోధార్థ పదాన్ని చేర్చకుండా సహజ తెలుగు కథన ప్రవాహంలో చూపించాం.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: మగ్దలేనే మరియ
  rationale: వ్యక్తి పేరును, ప్రాంతసూచక బిరుదును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: ἔρχεται
  choice: వస్తుంది
  rationale: గ్రీకు చారిత్రక వర్తమాన కాలాన్ని నిలుపుతూ కథన సజీవతను కాపాడుతుంది.
- source_word: πρωῒ
  choice: తెల్లవారుజామున
  rationale: రోజు ప్రారంభంలోని తొలివేళను సహజ తెలుగులో సూచిస్తుంది; తరువాతి ‘ఇంకా చీకటిగా ఉండగానే’ అనే మాట సమయాన్ని మరింత స్పష్టపరుస్తుంది.
- source_word: σκοτίας ἔτι οὔσης
  choice: ఇంకా చీకటిగా ఉండగానే
  rationale: జెనిటివ్ అబ్సల్యూట్‌ను కొనసాగుతున్న కాలపరిస్థితిని తెలిపే సహజ తెలుగు ఉపవాక్యంగా అనువదించాం.
- source_word: εἰς τὸ μνημεῖον
  choice: సమాధి దగ్గరికి
  rationale: ఇక్కడ μνημεῖον మృతదేహాన్ని ఉంచిన సమాధిని సూచిస్తుంది. గమ్యస్థానాన్ని సహజ తెలుగులో ‘దగ్గరికి’ తెలియజేస్తుంది.
- source_word: βλέπει
  choice: చూస్తుంది
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని నిలుపుతూ నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: τὸν λίθον ἠρμένον
  choice: రాయి తొలగించబడి ఉండడం
  rationale: పర్ఫెక్ట్ పాసివ్ పార్టిసిపుల్ గతంలో జరిగిన చర్య వల్ల కొనసాగుతున్న స్థితిని సూచిస్తుంది; రాయి అప్పటికే తొలగించబడి ఉన్నదనే భావాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: ἐκ τοῦ μνημείου
  choice: సమాధి నుండి
  rationale: ἐκ సూచించే సమాధి నుండి దూరంగా తొలగింపబడిన భావాన్ని, మూలంలో లేని ‘ద్వారం’ వంటి వివరాన్ని చేర్చకుండా అందిస్తుంది.
theological_decisions:
- issue: పునరుత్థాన కథనంలోని క్రియాకాలం
  choice: చారిత్రక వర్తమానాన్ని ‘వస్తుంది’, ‘చూస్తుంది’గా నిలుపడం
  alternative: తెలుగు కథన సౌలభ్యం కోసం రెండింటినీ భూతకాలంగా ‘వచ్చింది’, ‘చూసింది’ అని మార్చడం
  rationale: మూల గ్రీకులోని చారిత్రక వర్తమానం కథనానికి ఇచ్చే తక్షణత్వాన్ని తెలుగులోనూ అర్థస్పష్టత కోల్పోకుండా నిలుపవచ్చు; దీనితో అదనపు సిద్ధాంతార్థం చేర్చబడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రద కథన శైలి. చారిత్రక వర్తమానాన్ని నిలిపి, మూలంలోని ఫలితస్థితిని సహజ తెలుగు నిర్మాణంతో వ్యక్తం చేశాం.
