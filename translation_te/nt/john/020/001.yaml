review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the εβδομαδιαίο idiom, preserves the Greek historical presents, and represents the perfect passive state of the stone. However, “సమాధి దగ్గరికి” weakens εἰς τὸ μνημεῖον (“to the tomb”) into “near the tomb.” The revised wording renders the destination directly. The footnote’s proposed literal wording is also adjusted so that it does not build “first” into what is presented as a literal gloss.
  naturalness: The two-sentence arrangement is acceptable, but “సమాధి నుండి రాయి తొలగించబడి ఉండడం ఆమె చూస్తుంది” is awkward Telugu word order and nominalization. “రాయి తొలగించబడి ఉందని ఆమె చూస్తుంది” is idiomatic while retaining the completed removal and resulting state. “ఉదయాన్నే, ఇంకా చీకటిగా ఉండగా” naturally conveys πρωῒ together with σκοτίας ἔτι οὔσης without implying full daylight.
  terminology: “మగ్దలేనే మరియ” is retained as a recognizable Telugu transliteration of Mary Magdalene. “సమాధి” suitably renders μνημεῖον in this burial context. The footnote retains “సబ్బతు” as a transparent transliteration and explains the Koine idiom.
  issues:
  - severity: medium
    issue: “సమాధి దగ్గరికి” for εἰς τὸ μνημεῖον
    rationale: “దగ్గరికి” means “near/toward,” whereas εἰς marks arrival at the tomb as the destination. “సమాధికి” is direct and natural.
  - severity: medium
    issue: Awkward final clause
    rationale: “రాయి తొలగించబడి ఉండడం ఆమె చూస్తుంది” is grammatically intelligible but unnatural. A finite complement clause is clearer and preserves the perfect passive result.
  - severity: low
    issue: Footnote labeled literal includes “ఒకటవ”
    rationale: A literal Telugu gloss should reflect μιᾷ as “one,” rather than importing the idiomatic conclusion “first.” The explanation can then state that the idiom means the first day of the week.
  revised_text: వారం మొదటి రోజున[a], మగ్దలేనే మరియ ఉదయాన్నే, ఇంకా చీకటిగా ఉండగా, సమాధికి వస్తుంది. సమాధి నుండి రాయి తొలగించబడి ఉందని ఆమె చూస్తుంది.
