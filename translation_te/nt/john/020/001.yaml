- from: వారం మొదటి రోజున[a], ఇంకా చీకటిగా ఉండగానే మగ్దలేనే మరియ తెల్లవారుజామున సమాధి దగ్గరికి వస్తుంది. సమాధి నుండి రాయి తొలగించబడి ఉండడం ఆమె చూస్తుంది.
  to: వారం మొదటి రోజున[a], మగ్దలేనే మరియ ఉదయాన్నే, ఇంకా చీకటిగా ఉండగా, సమాధికి వస్తుంది. సమాధి నుండి రాయి తొలగించబడి ఉందని ఆమె చూస్తుంది.
