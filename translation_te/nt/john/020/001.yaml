    reason: lexical_alternative
  revision_rationale: The revision corrects the directional force of εἰς, smooths the Telugu complement clause, and makes the footnote’s literal gloss more exact. It preserves the source’s historical-present narration, the early-yet-dark temporal setting, and the perfect passive/resulting-state sense of ἠρμένον.
