id: JHN.20.2
reference: John 20:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τρέχει οὖν καὶ ἔρχεται πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητὴν ὃν ἐφίλει ὁ Ἰησοῦς, καὶ λέγει αὐτοῖς· Ἦραν τὸν κύριον ἐκ τοῦ μνημείου, καὶ οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: te
  text: అందుచేత ఆమె పరుగెత్తుకుంటూ సీమోను పేతురు దగ్గరికీ, యేసు ప్రేమించిన మరో శిష్యుని[a] దగ్గరికీ వచ్చి వారితో, “ప్రభువును సమాధిలోనుండి తీసుకెళ్లిపోయారు; ఆయనను ఎక్కడ ఉంచారో మాకు తెలియదు[b]” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో, “యేసు ప్రేమించిన మరో శిష్యుడు.” ఇక్కడ ‘ప్రేమించిన’ అని అనువదించిన క్రియ φιλέω; అది అనురాగాన్ని నొక్కిచెప్పగలదు. మరో విధంగా, “యేసుకు ఆప్తుడైన” అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మరియ “మాకు తెలియదు” అని బహువచనంలో చెప్పింది; గ్రీకు మూలంలోనూ ప్రథమ పురుష బహువచనమే ఉంది. ఇది ఆమెతో ఉన్న ఇతర స్త్రీలను కలుపుకొని చెప్పిందని కొందరు అర్థం చేసుకుంటారు; అయితే ఈ వాక్యం ఆ బహువచనాన్ని వివరించదు.
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει οὖν καὶ ἔρχεται
  choice: అందుచేత ఆమె పరుగెత్తుకుంటూ ... వచ్చి
  rationale: οὖν మునుపటి వాక్యానికి పరిణామ సంబంధాన్ని చూపుతుంది. గ్రీకు చారిత్రక వర్తమానాల సజీవతను సహజమైన తెలుగు కథనంలో ‘పరుగెత్తుకుంటూ ... వచ్చి’ తెలియజేస్తుంది.
- source_word: πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητήν
  choice: సీమోను పేతురు దగ్గరికీ ... మరో శిష్యుని దగ్గరికీ
  rationale: πρός వ్యక్తులవైపు కదలికను సూచిస్తుంది; ‘దగ్గరికీ’ సహజమైన తెలుగు. ἄλλον ను ‘మరో’గా, μαθητήν ను సువార్తల సందర్భానికి తగిన ‘శిష్యుడు’గా అనువదించాం.
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: యేసు ప్రేమించిన
  rationale: φιλέω ఇక్కడ వ్యక్తిగత అనురాగంతో ప్రేమించడాన్ని సూచించగలదు. ‘ప్రేమించిన’ సహజంగా ఉండి, దాని భావాన్ని బలహీనపరచదు; అపూర్ణ భూతకాల రూపాన్ని అసహజమైన కొనసాగింపు రూపంతో చూపలేదు.
- source_word: λέγει αὐτοῖς
  choice: వారితో ... అంది
  rationale: గ్రీకులో చారిత్రక వర్తమానం ఉన్నా, ఆధునిక తెలుగు కథనంలో ముగింపు క్రియగా భూతకాల ‘అంది’ సహజంగా ఉంటుంది; αὐτοῖς భావాన్ని ‘వారితో’ నిలుపుతుంది.
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: ప్రభువును సమాధిలోనుండి తీసుకెళ్లిపోయారు
  rationale: μνημεῖον ఈ సందర్భంలో శవాన్ని ఉంచే సమాధి. ἐκ యొక్క వెలుపలికి కదలికను ‘లోనుండి’ చూపుతుంది. ἦραν లోని తొలగించి ఇప్పుడు అక్కడ లేకపోవడం అనే సందర్భోచిత ఫలితాన్ని ‘తీసుకెళ్లిపోయారు’ సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ οἴδαμεν
  choice: మాకు తెలియదు
  rationale: గ్రీకు క్రియ స్పష్టంగా ప్రథమ పురుష బహువచనం. మరియ ఒక్కరే మాట్లాడుతున్నందున దాన్ని ఏకవచనంగా మార్చకుండా ‘మాకు’గా నిలిపాం.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: ఆయనను ఎక్కడ ఉంచారో
  rationale: τίθημι ఇక్కడ ఉంచడం/పెట్టడం అనే అర్థంలో ఉంది. వ్యక్తి పట్ల గౌరవాన్ని నిలిపే ‘ఆయనను’తో ‘ఉంచారో’ ఆధునిక తెలుగులో సహజంగా ఉంది.
theological_decisions:
- issue: యేసును సూచించే κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని / గురువు
  rationale: పునరుత్థాన సందర్భంలో శిష్యురాలి గౌరవపూర్వక సంబోధనగా κύριος ను స్థిరమైన క్రైస్తవ బిరుదైన ‘ప్రభువు’గా ఉంచడం మూలంలోని క్రీస్తు సంబంధిత భావాన్ని కాపాడుతుంది.
- issue: οἴδαμεν లోని బహువచనం
  choice: మాకు తెలియదు
  alternative: నాకు తెలియదు
  rationale: మరియ వాక్యంలో ఉన్న బహువచనాన్ని మూలం ప్రకారమే నిలిపి, అది ఆమెతో ఉన్న ఇతర స్త్రీలను సూచిస్తుందా అనే ప్రశ్నను అనువాదంలో తీర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన కథన శైలి. గ్రీకు చారిత్రక వర్తమానాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగు కథన సహజత్వాన్ని కాపాడాం; అయితే చర్యల వేగం, ప్రత్యక్షత నిలిచేలా ‘పరుగెత్తుకుంటూ’ వాడాం. రెండు పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
