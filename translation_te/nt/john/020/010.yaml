id: JHN.20.10
reference: John 20:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπῆλθον οὖν πάλιν πρὸς ⸀αὑτοὺς οἱ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/010.yaml
  text: So the disciples went away again to their own homes[a].
translation:
  language: te
  text: కాబట్టి శిష్యులు మళ్లీ తాము ఉంటున్న చోటికి వెళ్లిపోయారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “తమవద్దకు.” ఈ గ్రీకు ప్రయోగం వారు బస చేస్తున్న తమ స్థలానికి తిరిగి వెళ్లారని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: వెళ్లిపోయారు
  rationale: ἀπέρχομαι భూతకాల రూపం ఆ ప్రదేశం నుంచి వెళ్లిపోవడాన్ని సూచిస్తుంది. ‘వెళ్లిపోయారు’ అనేది ఈ భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: οὖν ముందరి సంఘటనకు అనుసంధానమైన కథన కొనసాగింపును లేదా పరిణామాన్ని సూచిస్తుంది. ‘కాబట్టి’ దాని అనుసంధాన బలాన్ని నిలుపుతుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: πάλιν తిరిగి వెళ్లడం లేదా పునరావృతిని సూచిస్తుంది; ‘మళ్లీ’ నేరుగా, సహజంగా ఉంది.
- source_word: πρὸς αὑτούς
  choice: తాము ఉంటున్న చోటికి
  rationale: అక్షరార్థంగా ‘తమవద్దకు/తమ దగ్గరకు’ అనే ఈ గ్రీకు ప్రయోగం సందర్భంలో వారు బస చేస్తున్న తమ స్థలానికి తిరిగి వెళ్లారని సూచించే అవకాశం ఎక్కువ. ‘ఇళ్లకు’ అని చెప్పడం కంటే ఈ అనువాదం మూలంలోని అనిశ్చితిని మెరుగ్గా కాపాడుతుంది.
- source_word: οἱ μαθηταί
  choice: శిష్యులు
  rationale: μαθηταί అనేది యేసును అనుసరించి నేర్చుకునేవారికి సాధారణ కథనపదం; ‘శిష్యులు’ స్థిరమైన, సహజమైన తెలుగు సమానార్థకం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. గ్రీకు ప్రయోగాన్ని ‘తమ ఇళ్లకు’ అని అతిగా నిర్దిష్టం చేయకుండా, సందర్భోచితంగా ‘తాము ఉంటున్న చోటికి’ అని అనువదించబడింది.
