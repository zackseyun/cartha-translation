revisions:
- from: కాబట్టి మిగతా శిష్యులు అతనితో, “మేము ప్రభువును చూశాం” అని చెబుతూ ఉన్నారు. అయితే అతడు వారితో, “ఆయన చేతుల్లో మేకుల గుర్తును చూసి, ఆ మేకుల గుర్తులో నా వేలు పెట్టి, ఆయన పక్కలో నా చెయ్యి పెడితే తప్ప, నేను ఎంతమాత్రమూ నమ్మను[a]” అన్నాడు.
  to: అప్పుడు మిగతా శిష్యులు తోమాతో, “మేము ప్రభువును చూశాం” అని చెబుతూ ఉన్నారు. కానీ అతడు వారితో, “ఆయన చేతుల్లో మేకుల గుర్తును చూసి, మేకుల గుర్తులో నా వేలు పెట్టి, నా చెయ్యిని ఆయన పక్కలో ఉంచితే తప్ప, నేను ఎంతమాత్రమూ నమ్మను[a]” అన్నాడు.
  rationale: 'The revision makes two safe, minor improvements: it renders the narrative connective οὖν with “అప్పుడు,” and identifies Thomas explicitly for idiomatic clarity. The conditional sequence, bodily imagery, and emphatic but condition-bound refusal are retained. The footnote remains correctly placed and accurately describes the Greek emphasis.'
  reviewer_model: gpt-5.6-terra
