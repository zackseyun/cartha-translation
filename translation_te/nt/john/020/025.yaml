id: JHN.20.25
reference: John 20:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: te
  text: అప్పుడు మిగతా శిష్యులు తోమాతో, “మేము ప్రభువును చూశాం” అని చెబుతూ ఉన్నారు. కానీ అతడు వారితో, “ఆయన చేతుల్లో మేకుల గుర్తును చూసి, మేకుల గుర్తులో నా వేలు పెట్టి, నా చెయ్యిని ఆయన పక్కలో ఉంచితే తప్ప, నేను ఎంతమాత్రమూ నమ్మను[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను ఎప్పటికీ నమ్మను.” గ్రీకులో బలమైన నిరాకరణ వాడబడింది.
    reason: బలమైన గ్రీకు నిరాకరణకు సాధ్యమైన ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: ἔλεγον
  choice: చెబుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా పునరావృతమైన మాటను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భం నుంచి వచ్చే కథన సంబంధాన్ని నిలుపుతుంది; ఇక్కడ కేవలం కాలక్రమాన్ని కాక సందర్భానుగత పరిణామాన్ని సూచిస్తుంది.
- source_word: οἱ ἄλλοι μαθηταί
  choice: మిగతా శిష్యులు
  rationale: తోమాతో భేదాన్ని స్పష్టంగా చూపుతూ, తెలుగు వాడుకలో సహజంగా ఉంటుంది.
- source_word: Ἑωράκαμεν
  choice: మేము ప్రభువును చూశాం
  rationale: పూర్తయిన దర్శనాన్ని తెలియజేస్తుంది; తెలుగులో సాధారణ భూతకాల రూపమే ఈ సందర్భంలోని ప్రస్తుత ప్రాసంగికతను సహజంగా మోస్తుంది.
- source_word: κύριον
  choice: ప్రభువును
  rationale: లేచిన యేసును సూచించే బిరుదుగా κύριος యొక్క క్రైస్తవార్థాన్ని నిలుపుతుంది.
- source_word: Ἐὰν μὴ ἴδω
  choice: చూసి … పెడితే తప్ప
  rationale: మూడు షరతులను కలిపి, ‘unless’ అనే ప్రతికూల షరతును సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: ἐν ταῖς χερσὶν αὐτοῦ
  choice: ఆయన చేతుల్లో
  rationale: శరీర భాగంలో ఉన్న గాయపు గుర్తును సూచించే ἐν భావాన్ని దగ్గరగా, సహజంగా అందిస్తుంది.
- source_word: τύπον τῶν ἥλων
  choice: మేకుల గుర్తు
  rationale: మేకు వల్ల మిగిలిన కనిపించే ముద్ర లేదా గుర్తు అనే τύπος భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: βάλω τὸν δάκτυλόν μου εἰς
  choice: నా వేలు పెట్టి
  rationale: లోపలికి కదలికను సందర్భం స్పష్టం చేస్తుంది; ‘పెట్టు’ ఆధునిక తెలుగులో సహజంగా, శరీరసంబంధ సందర్భానికి తగినట్లుగా ఉంది.
- source_word: τὴν πλευρὰν αὐτοῦ
  choice: ఆయన పక్కలో
  rationale: πλευρά సూచించే శరీరపు పక్క భాగాన్ని అతిగా నిర్దిష్టం చేయకుండా అనువదిస్తుంది.
theological_decisions:
- issue: οὐ μὴ πιστεύσω లో తోమా నిరాకరణ బలం
  choice: నేను ఎంతమాత్రమూ నమ్మను
  alternative: నేను ఎప్పటికీ నమ్మను
  rationale: οὐ μή లోని బలమైన నిరాకరణను నిలుపుతూ, ఆధారం కనిపించే వరకు నమ్మననే షరతును కాలాతీతమైన తుదినిరాకరణగా మార్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘చెబుతూ ఉన్నారు’ ద్వారా పునరావృత/కొనసాగుతున్న చర్యను, ‘ఎంతమాత్రమూ నమ్మను’ ద్వారా బలమైన నిరాకరణను సహజంగా నిలిపాం.
