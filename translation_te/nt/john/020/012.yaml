source:
  edition: SBLGNT
  text: καὶ θεωρεῖ δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: te
  text: ఆమె తెల్లని వస్త్రాల్లో కూర్చున్న ఇద్దరు దేవదూతలను చూస్తుంది[a]; యేసు దేహం పడి ఉండిన చోట ఒకరు తలవద్ద, మరొకరు పాదాలవద్ద[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘తెల్లనివాటిలో’; అంటే తెల్లని వస్త్రాల్లో.
    reason: lexical_alternative
  - marker: b
    text: ‘యేసు దేహం ఉండిన చోట’ అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ గతంలో కొనసాగిన స్థితిని సూచిస్తుంది; సందర్భంలో అది దేహం అంతకు ముందు అక్కడ పడి ఉండిన స్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: చూస్తుంది
  rationale: కథనంలోని వర్తమాన కాలపు సజీవతను నిలుపుతుంది; సందర్భం ప్రకారం కర్త మగ్దలేనే మరియ కాబట్టి తెలుగులో ‘ఆమె’ను స్పష్టంగా పేర్కొన్నాం.
- source_word: ἀγγέλους
  choice: దేవదూతలను
  rationale: ఖాళీ సమాధి సందర్భంలో ఇది మానవ దూతలను కాక పరలోక సంబంధమైన దూతలను సూచిస్తుంది.
- source_word: ἐν λευκοῖς
  choice: తెల్లని వస్త్రాలు ధరించి
  rationale: గ్రీకులో అక్షరార్థంగా ‘తెల్లనివాటిలో’; సహజమైన ఆధునిక తెలుగులో వస్త్రార్థాన్ని స్పష్టం చేస్తూ, రంగుకు మించిన వివరాలను చేర్చలేదు.
- source_word: καθεζομένους
  choice: కూర్చున్న
  rationale: దేవదూతల భంగిమను సహజంగా తెలియజేస్తుంది; గ్రీకులో లేని ‘అక్కడ’ అనే పదాన్ని చేర్చలేదు.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: ఒకరు తలవైపు, మరొకరు పాదాలవైపు
  rationale: πρός + dative తెలిపే సమీప స్థానాన్ని ‘వైపు’ సహజంగా వ్యక్తం చేస్తుంది; ఇవి దేహం ఉంచబడిన స్థలపు రెండు చివరలను సూచిస్తాయి.
- source_word: ὅπου
  choice: చోట
  rationale: ‘ఎక్కడ’ అనే సంబంధార్థాన్ని తెలుగు వాక్య నిర్మాణంలో సహజంగా ‘చోట’తో వ్యక్తం చేశాం.
- source_word: ἔκειτο
  choice: ఉంచబడివున్న
  rationale: κεῖμαι తెలిపే పడి/ఉంచబడి ఉన్న స్థితిని, పరిశీలనకు ముందు కొనసాగిన స్థితిగా తెలియజేస్తుంది; క్రియారూపంలోని భావాన్ని అతిగా నిర్ణయించకుండా ఉంచుతుంది.
- source_word: σῶμα
  choice: దేహం
  rationale: గౌరవప్రదమైన, సాధారణ తెలుగు పదం; ‘శవం’ అనే కఠినమైన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: τοῦ Ἰησοῦ
  choice: యేసు
  rationale: సంబంధ విభక్తి భావాన్ని సహజమైన తెలుగు పదక్రమంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పునరుత్థాన సమాధి సందర్భంలో ἀγγέλους స్వభావం
  choice: దేవదూతలు
  alternative: దూతలు
  rationale: ἄγγελος సాధారణంగా ‘దూత’ అని కూడా అర్థమివ్వగలిగినా, ఖాళీ సమాధి మరియు తెల్లని వస్త్రాల సందర్భం పరలోక సంబంధమైన దేవదూతలను సూచిస్తుంది.
- issue: ἔκειτο యొక్క కాల మరియు స్థితి భావం
  choice: ఉంచబడివున్న
  alternative: పడి ఉండేది / ఉంచబడి ఉండేది
  rationale: గ్రీకు imperfect గతంలో కొనసాగిన స్థితిని సూచిస్తుంది. తెలుగు రూపం ఆ దేహం అప్పటికి అక్కడ లేదనే సందర్భాన్ని సహజంగా ప్రతిబింబిస్తూ, క్రియను కేవలం సాధారణ భూతకాలంగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా ఉండేలా, అయితే సమాధి దృశ్యానికి తగిన గౌరవప్రదమైన శైలిని నిలిపాం. గ్రీకు కథన వర్తమానాన్ని ‘చూస్తుంది’గా ఉంచి సజీవతను కాపాడాం.
