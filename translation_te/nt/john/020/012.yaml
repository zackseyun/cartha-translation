revisions:
- from: ఆమె తెల్లని వస్త్రాలు ధరించి కూర్చున్న ఇద్దరు దేవదూతలను చూస్తుంది[a]—యేసు దేహం ఉంచబడివున్న చోట ఒకరు తలవైపు, మరొకరు పాదాలవైపు కూర్చున్నారు[b].
  to: ఆమె తెల్లని వస్త్రాల్లో కూర్చున్న ఇద్దరు దేవదూతలను చూస్తుంది[a]; యేసు దేహం పడి ఉండిన చోట ఒకరు తలవద్ద, మరొకరు పాదాలవద్ద[b].
  rationale: The revision restores the Greek participial structure by making ‘sitting’ directly modify the angels, expresses their positions with natural Telugu locatives, and replaces the awkward passive ‘ఉంచబడివున్న’ with ‘పడి ఉండిన,’ which better reflects κεῖμαι and its imperfect aspect. Footnote anchors and their lexical functions are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T02:53:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies Mary as the implied subject, preserves the narrative present of θεωρεῖ, and rightly renders ἀγγέλους as దేవదూతలు in this context. However, the final clause recasts the angels'' posture as a new finite assertion (కూర్చున్నారు) and makes it awkwardly follow the location phrase. The Greek has a participle modifying ‘two angels’: she sees them sitting, with their respective positions specified. Also, ἔκειτο denotes the body''s prior continuing location; పడి ఉండిన conveys this more directly than ఉంచబడివున్న.'
  naturalness: The proposed revision uses straightforward modern standard Telugu. Placing కూర్చున్న directly with దేవదూతలను clearly attaches the posture to the angels, while semicolon-separated positional wording is natural and readable.
  terminology: దేవదూతలు, దేహం, తలవద్ద, and పాదాలవద్ద are appropriate, respectful, and idiomatic. తెల్లని వస్త్రాల్లో faithfully communicates the idiomatic Greek ἐν λευκοῖς without adding a particular garment type.
  issues:
  - severity: medium
    issue: The draft's post-dash clause ‘...ఒకరు తలవైపు, మరొకరు పాదాలవైపు కూర్చున్నారు’ syntactically recasts the participial description and is poorly ordered in Telugu.
    rationale: καθεζομένους modifies the two angels whom Mary sees. It should be integrated with దేవదూతలను rather than made into a delayed independent predicate after the location phrase.
  - severity: medium
    issue: ‘ఉంచబడివున్న’ is an unnatural and imprecise rendering of ἔκειτο in this sentence.
    rationale: It emphasizes having been placed rather than the body's continuing state/location of lying. ‘పడి ఉండిన’ naturally represents the prior, ongoing state and suits the empty-tomb context.
  revised_text: ఆమె తెల్లని వస్త్రాల్లో కూర్చున్న ఇద్దరు దేవదూతలను చూస్తుంది[a]; యేసు దేహం పడి ఉండిన చోట ఒకరు తలవద్ద, మరొకరు పాదాలవద్ద[b].
