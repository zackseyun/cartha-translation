id: JHN.20.7
reference: John 20:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: te
  text: ఆయన తలపై ఉన్న ముఖవస్త్రం[a] నారబట్టలతో పాటు పడి ఉండకుండా, విడిగా ఒక చోట చుట్టబడి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తలవస్త్రం’.
    reason: సουδάριον సమాధి సందర్భంలో తల లేదా ముఖంతో సంబంధమున్న వస్త్రాన్ని సూచించగలదు.
lexical_decisions:
- source_word: σουδάριον
  choice: ముఖవస్త్రం
  rationale: సమాధి సందర్భంలో యేసు తల లేదా ముఖంపై ఉన్న వస్త్రాన్ని సూచిస్తుంది. తరువాతి వివరణతో కలిసి ‘ముఖవస్త్రం’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: ఆయన తలపై ఉన్న
  rationale: వస్త్రం ఎలా చుట్టబడిందో అతిగా నిర్దిష్టం చేయకుండా గ్రీకు పదబంధంలోని స్థల సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: ὀθονίων
  choice: నారబట్టలు
  rationale: సమాధిలోని నార వస్త్రాలను సూచించే బహువచనాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘కفن’ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: κείμενον
  choice: పడి ఉండకుండా
  rationale: κεῖμαι సూచించే పడి ఉన్న స్థితిని, οὐ ... ἀλλά వ్యత్యాస నిర్మాణానికి సరిపోయే సహజ తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: χωρὶς
  choice: విడిగా
  rationale: ముఖవస్త్రం నారబట్టల నుండి వేరుగా ఉన్న స్థల సంబంధాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐντετυλιγμένον
  choice: చుట్టి పెట్టి ఉంది
  rationale: పరిపూర్ణ కర్మణి కృదంతం సూచించే చుట్టబడిన స్థితిని నిలుపుతుంది. ‘మడతపెట్టి’ అని అనువదిస్తే గ్రీకు పదం కంటే ఎక్కువ క్రమబద్ధతను సూచించే అవకాశం ఉంది.
- source_word: εἰς ἕνα τόπον
  choice: ఒక చోట
  rationale: వేరుగా ఉన్న నిర్దిష్ట స్థలాన్ని అతిగా వ్యాఖ్యానించకుండా సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ
  choice: ప్రత్యేక పదంగా చూపలేదు
  rationale: ఈ వాక్యం ముందరి వచనంలోని జాబితాను కొనసాగిస్తుంది. తెలుగులో వచనం స్వతంత్రంగా సహజంగా ఉండేందుకు అనుసంధాన భావం వాక్య ప్రవాహంలోనే ఉంచబడింది.
theological_decisions:
- issue: సమాధి వస్త్రాల అమరికకు వర్ణనకు మించిన సంకేతార్థం ఇవ్వాలా?
  choice: వస్త్రం విడిగా, చుట్టబడిన స్థితిలో ఉన్నదనే పరిశీలనాత్మక వర్ణనకే పరిమితం చేయడం
  alternative: ఈ అమరిక ఉద్దేశపూర్వకతకు, పునరుత్థానంలోని క్రమానికి సంకేతమని లేదా సంఘటనకు నిర్దిష్ట నిరూపణ అని అనువాదంలో సూచించడం
  rationale: గ్రీకు పాఠం వస్త్రం ఉన్న స్థలాన్ని, స్థితిని మాత్రమే వివరిస్తుంది; దాని సంకేతార్థాన్ని స్పష్టంగా ప్రకటించదు. అందువల్ల తరువాతి సిద్ధాంతపరమైన నిర్ధారణలను ప్రధాన పాఠ్యంలోకి తీసుకురాలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన వర్ణనా శైలి. ‘చుట్టి పెట్టి ఉంది’ ద్వారా ἐντετυλιγμένον యొక్క విస్తృత అర్థాన్ని నిలిపి, ‘మడతపెట్టి’ అనే మరింత నిర్దిష్టమైన భావాన్ని ప్రధాన పాఠ్యంలో నివారించాం.
