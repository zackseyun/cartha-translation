  text: ⸀ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ· Ὁ κύριός μου καὶ ὁ θεός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/028.yaml
  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: te
  text: 'తోమా జవాబిచ్చి ఆయనతో ఇలా అన్నాడు: “నా ప్రభువా, నా దేవా!”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: తక్కువ సంభావ్యమైన ప్రత్యామ్నాయంగా, ‘తోమా, “నా ప్రభువా, నా దేవా!” అని ఆశ్చర్యోద్గారంగా అన్నాడు’ అని తీసుకోవచ్చు. అయితే గ్రీకులో అతడు ‘ఆయనతో’ అన్నాడని ఉండడం వల్ల, ఇవి యేసును నేరుగా సంబోధించిన మాటలని గ్రహించడమే ఎక్కువ సహజం.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబుగా ... అన్నాడు
  rationale: సందర్భంలోని స్పందన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; తరువాతి εἶπεν‌తో కలిపి గ్రీకు వాక్య నిర్మాణాన్ని అనవసరంగా భారంగా చేయకుండా అందిస్తుంది.
- source_word: Θωμᾶς
  choice: తోమా
  rationale: వ్యక్తి పేరును ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: εἶπεν αὐτῷ
  choice: ఆయనకు ... అన్నాడు
  rationale: దత్తివాచక αὐτῷను స్పష్టంగా నిలుపుతుంది; మూలంలో ‘యేసు’ అని మళ్లీ పేర్కొనలేదు కాబట్టి ‘ఆయనకు’ అని ఇచ్చింది.
- source_word: Ὁ κύριός μου
  choice: నా ప్రభువా
  rationale: ప్రత్యక్ష సంబోధనను తెలుగు సంబోధనా రూపంతో సహజంగా వ్యక్తపరుస్తూ, κύριος యొక్క గౌరవం మరియు క్రీస్తు సంబంధిత theological బరువును కాపాడుతుంది.
- source_word: ὁ θεός μου
  choice: నా దేవా
  rationale: θεόςను ‘దేవుడు’ అనే ప్రామాణిక పదానికి సంబోధనా రూపమైన ‘దేవా’గా ఇచ్చి, μουలోని వ్యక్తిగత స్వీకారాన్ని ‘నా’తో నిలిపింది.
- source_word: καὶ
  choice: విరామచిహ్నంతో సమన్వయం
  rationale: తెలుగులో వరుస ప్రత్యక్ష సంబోధనల మధ్య ‘మరియు’ కంటే ‘నా ప్రభువా, నా దేవా’ సహజంగా ఉంటుంది; రెండు బిరుదుల సమన్వయం మాత్రం స్పష్టంగానే నిలుస్తుంది.
theological_decisions:
- issue: తోమా పలికిన మాటలు యేసును ఉద్దేశించిన ప్రత్యక్ష ఒప్పుకోలా, లేక దేవుని వైపు చేసిన ఆశ్చర్యోద్గారమా
  choice: 'యేసును ఉద్దేశించిన ప్రత్యక్ష సంబోధన: ‘నా ప్రభువా, నా దేవా!’'
  alternative: యేసును దేవుడని నేరుగా పేర్కొనని ఆశ్చర్యోద్గారం
  rationale: గ్రీకులో αὐτῷ (‘ఆయనకు’) అని స్పష్టంగా ఉంది; ఆర్టికల్‌తో కూడిన నామవాచక రూపాలు కొయినే గ్రీకులో సంబోధనగా పనిచేస్తాయి. అందువల్ల క్రీస్తు సంబంధిత బలాన్ని తగ్గించకుండా ప్రత్యక్ష సంబోధనగా అనువదించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ప్రత్యక్ష సంబోధన కోసం ‘ప్రభువా’, ‘దేవా’ రూపాలు వాడబడ్డాయి. మూలంలోని ‘ఆయనకు’ అనే అంశం మరియు వ్యక్తిగత ‘నా’ రెండుసార్లు నిలుపబడ్డాయి.
