source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: te
  text: ఎనిమిది రోజుల తర్వాత, ఆయన శిష్యులు మళ్లీ లోపల ఉన్నారు; తోమా కూడా వారితో ఉన్నాడు. తలుపులు మూసి ఉన్నప్పటికీ యేసు వచ్చి, వారి మధ్య నిలబడి, “మీకు శాంతి కలుగుగాక” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: ఎనిమిది రోజుల తర్వాత
  rationale: గ్రీకు కాలవ్యక్తీకరణను సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది; సందర్భపరంగా ‘ఒక వారం తర్వాత’ అని వివరణాత్మకంగా మార్చలేదు.
- source_word: ἔσω
  choice: ఇంటి లోపల
  rationale: ‘లోపల’ అనే భావాన్ని తెలుగులో స్పష్టంగా అందించేందుకు సందర్భానికి సరిపోయే ‘ఇంటి’ని చేర్చాం; గ్రీకులో నిర్దిష్ట భవనం పేర్కొనబడలేదు.
- source_word: ἔρχεται
  choice: వచ్చి
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగు కథన ప్రవాహంలో సహజంగా అనుసంధానించాం; ఘటన యొక్క అకస్మాత్తుతనాన్ని అతిశయింపజేయలేదు.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: తలుపులు మూసి ఉన్నప్పటికీ
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణంలోని పరిస్థితి మరియు విరుద్ధ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Εἰρήνη ὑμῖν
  choice: మీకు శాంతి కలుగుగాక
  rationale: సాధారణ అభివాద భావాన్నీ, శాంతి ప్రకటనలోని గంభీరతనూ నిలుపుతుంది.
theological_decisions:
- issue: మూసి ఉన్న తలుపులు మరియు యేసు రాక మధ్య సంబంధం
  choice: ‘తలుపులు మూసి ఉన్నప్పటికీ యేసు వచ్చి’ అని అనువదించడం
  alternative: ‘మూసి ఉన్న తలుపుల గుండా యేసు వచ్చి’
  rationale: మూలపాఠం తలుపులు మూసి ఉన్నాయని చెబుతుంది గాని, యేసు వాటి గుండా వచ్చిన విధానాన్ని స్పష్టంగా పేర్కొనదు; అందువల్ల యాంత్రిక లేదా అద్భుత విధానాన్ని అదనంగా నిర్దేశించలేదు.
- issue: ἔρχεται అనే చారిత్రక వర్తమానం
  choice: తెలుగు కథనంలో ‘వచ్చి’
  alternative: ‘వస్తాడు’
  rationale: గ్రీకు శైలీ ఉత్సాహాన్ని గమనించినప్పటికీ, తెలుగులో కాలమార్పు అసహజంగా లేదా భవిష్యత్ భావంగా వినిపించకుండా సహజ కథన క్రమాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్య గౌరవం మరియు మూలంలోని సంక్షిప్త కథనశైలిని నిలుపుతూ రూపొందించబడింది.
