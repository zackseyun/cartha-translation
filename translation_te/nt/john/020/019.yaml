id: JHN.20.19
reference: John 20:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: te
  text: అప్పుడు ఆ రోజు—వారంలో మొదటి రోజు—సాయంకాలమైనప్పుడు, యూదుల[a] భయంతో శిష్యులు ఉన్న చోట తలుపులకు తాళాలు వేసి ఉండగా, యేసు వచ్చి వారి మధ్య నిలబడి, “మీకు శాంతి కలుగుగాక”[b] అని వారితో అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భాన్ని బట్టి “యూదుల నాయకులు” లేదా “యూదయవాసులు” అని కూడా అర్థం కావచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా “మీకు శాంతి ఉండుగాక.” గ్రీకు వాక్యానికి అక్షరార్థం “మీకు శాంతి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ
  choice: ఆ రోజు ... సాయంకాలమైనప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అనువదించాం. οὖν ఇక్కడ కథన కొనసాగింపును స్వల్పంగా సూచిస్తుంది; తెలుగులో ప్రత్యేక పదాన్ని చేర్చితే అనవసరంగా బలమైన తార్కిక భావం రావచ్చు కాబట్టి వాక్యక్రమం ద్వారానే కొనసాగింపును తెలిపాం.
- source_word: τῇ μιᾷ σαββάτων
  choice: వారంలో మొదటి రోజు
  rationale: ఇది వారంలోని మొదటి రోజును సూచించే యోహాను రచనలోని సహజ ప్రయోగం; ఆధునిక తెలుగులో స్పష్టంగా ఉండే రూపాన్ని ఎంచుకున్నాం.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: తలుపులు తాళం వేసి ఉండగా
  rationale: పర్ఫెక్ట్ పాసివ్ పార్టిసిపుల్ ముందే జరిగిన చర్య వల్ల కొనసాగుతున్న స్థితిని సూచిస్తుంది. భయంతో కూడిన భద్రతా సందర్భంలో కేవలం ‘మూసి’ కంటే ‘తాళం వేసి’ అనేది భావాన్ని మెరుగ్గా అందిస్తుంది.
- source_word: ὅπου ἦσαν οἱ μαθηταὶ
  choice: శిష్యులు ... ఉన్న చోట
  rationale: మూలపాఠం తెలిపే స్థలార్థాన్ని మాత్రమే ఉంచి, ‘సమకూడిన’ లేదా ‘బసచేసిన’ వంటి అదనపు భావాలను చేర్చలేదు.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: యూదులకు భయపడి
  rationale: διά + accusative తెలిపే కారణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరిచాం. Ἰουδαίων అనే పదానికి ప్రధాన పాఠ్యంలో విస్తృతమైన ప్రత్యక్ష సమానార్థకాన్ని ఉంచి, సందర్భానుసార ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἔστη εἰς τὸ μέσον
  choice: వారి మధ్య నిలబడి
  rationale: యేసు శిష్యుల మధ్యలో నిలిచాడనే స్పష్టమైన స్థలార్థాన్ని సహజమైన తెలుగులో నిలిపాం.
- source_word: λέγει αὐτοῖς
  choice: వారితో అన్నాడు
  rationale: గ్రీకులోని కథన వర్తమాన కాలాన్ని తెలుగు కథన శైలికి సహజమైన భూతకాలంలో అందించాం.
- source_word: Εἰρήνη ὑμῖν
  choice: మీకు శాంతి కలుగుగాక
  rationale: అక్షరార్థంగా ‘మీకు శాంతి’ అయిన ఈ అభివాదాన్ని తెలుగులో సంపూర్ణంగా, సహజంగా వినిపించే ఆశీర్వచన రూపంలో ఇచ్చాం; అక్షరార్థ రూపాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: యోహాను సువార్తలో τῶν Ἰουδαίων పదబంధం సూచించే వర్గం
  choice: ప్రధాన పాఠ్యంలో ‘యూదులు’ అని ఉంచి, సందర్భానుసార అర్థాలను పాదటిప్పణిలో తెలిపాం.
  alternative: ‘యూదుల నాయకులు’ లేదా ‘యూదయవాసులు’
  rationale: గ్రీకు పదం సందర్భాన్ని బట్టి యూదులను విస్తృతంగా, యూదయవాసులను, లేదా ప్రత్యేకంగా విరోధించిన యూదు అధికారులను సూచించవచ్చు. ఈ వాక్యం స్వయంగా ‘నాయకులు’ అని పరిమితం చేయదు; అందువల్ల ప్రధాన పాఠ్యం ఆ అస్పష్టతను కాపాడుతుంది. అదే సమయంలో మొత్తం యూదు ప్రజలపై నిందగా అపార్థం కాకుండా సందర్భానుసార అవకాశాలను పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన కథన శైలిని ఉపయోగించాం. మూలంలోని దీర్ఘ వాక్య సంబంధాన్ని నిలుపుతూ, కాలసూచనను డాష్‌లతో స్పష్టపరిచాం. ‘యూదులు’ అనే పదం కలిగించే సందర్భాత్మక ఉద్రిక్తతను ప్రధాన పాఠ్యంలో తొలగించకుండా, దాని సంభావ్య పరిమిత సూచనను పాదటిప్పణిలో వివరించాం.
