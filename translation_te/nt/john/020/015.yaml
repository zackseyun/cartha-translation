id: JHN.20.15
reference: John 20:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: te
  text: యేసు ఆమెతో, “అమ్మా, ఎందుకు ఏడుస్తున్నావు? ఎవరి కోసం వెదుకుతున్నావు?” అన్నాడు. ఆయన తోటమాలి అని భావించి ఆమె ఆయనతో, “అయ్యా[a], మీరు ఆయనను తీసుకెళ్లి ఉంటే, ఆయనను ఎక్కడ ఉంచారో నాకు చెప్పండి; నేను ఆయనను తీసుకెళ్తాను” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ఉపయోగించిన κύριε అనే పదాన్ని “ప్రభువా” అని కూడా అనువదించవచ్చు. అయితే ఆమె ఆయనను తోటమాలి అని భావిస్తున్నందున, ఇక్కడ అది గౌరవపూర్వకమైన “అయ్యా” అనే అర్థంలో ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: అమ్మా
  rationale: స్త్రీని గౌరవంగా సంబోధించే గ్రీకు పదానికి సహజమైన ఆధునిక తెలుగు సంబోధన. ‘స్త్రీ’ అని నేరుగా పలకడం తెలుగులో కఠినంగా వినిపించవచ్చు; ‘అమ్మా’ అనేది ఇక్కడ బంధుత్వార్థం కాక గౌరవార్థకం.
- source_word: τί κλαίεις
  choice: ఎందుకు ఏడుస్తున్నావు?
  rationale: τί కారణాన్ని అడిగే ప్రయోగం; κλαίω దుఃఖంతో ఏడవడాన్ని సూచిస్తుంది.
- source_word: τίνα ζητεῖς
  choice: ఎవరి కోసం వెదుకుతున్నావు?
  rationale: τίνα వ్యక్తిని సూచిస్తుంది; ζητέω వెదకడం లేదా వెతకడం అనే భావాన్ని ఇస్తుంది. ఈ రూపం తెలుగులో సహజంగా ఉండి వ్యక్తిగత కర్మను స్పష్టంగా ఉంచుతుంది.
- source_word: δοκοῦσα
  choice: అని భావించి
  rationale: ఆమె చేసుకున్న, కాని పొరపాటైన అంచనాను సంక్షిప్తంగా తెలియజేస్తుంది; ఆమెకు నిశ్చయంగా తెలుసన్న భావాన్ని అధికంగా చేర్చదు.
- source_word: ὁ κηπουρός
  choice: తోటమాలి
  rationale: తోటను చూసుకునే వ్యక్తిని నేరుగా, సాధారణ తెలుగులో సూచిస్తుంది.
- source_word: Κύριε
  choice: అయ్యా
  rationale: ఆమె యేసును గుర్తించకుండా తోటమాలి అనుకుంటున్న సందర్భంలో ఇది గౌరవపూర్వక సంబోధన. గ్రీకు పదంలోని ‘ప్రభువు’ అనే సాధ్యార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: ἐβάστασας αὐτόν
  choice: ఆయనను తీసుకెళ్లి ఉంటే
  rationale: మృతదేహాన్ని అక్కడి నుంచి మోసుకొని లేదా తీసుకొని వెళ్లిన చర్యను సహజ తెలుగులో వ్యక్తం చేస్తుంది; భౌతికంగా తరలించిన భావం సందర్భంలో స్పష్టంగా ఉంది.
- source_word: ποῦ ἔθηκας αὐτόν
  choice: ఆయనను ఎక్కడ ఉంచారో
  rationale: τίθημι యొక్క ‘పెట్టు/ఉంచు’ భావాన్ని గౌరవ సంబోధనకు తగిన తెలుగు క్రియారూపంతో అందిస్తుంది.
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: నేను ఆయనను తీసుకెళ్తాను
  rationale: αἴρω ఇక్కడ ఎత్తుకొని అక్కడి నుంచి తీసుకెళ్లడాన్ని సూచిస్తుంది. భవిష్యత్ ఉద్దేశాన్ని ‘తీసుకెళ్తాను’ నిలుపుతుంది.
theological_decisions:
- issue: యేసును గుర్తించకముందు మరియ ఉపయోగించిన κύριε సంబోధన
  choice: అయ్యా
  alternative: ప్రభువా
  rationale: ఆమె ఆయనను తోటమాలి అని భావిస్తున్నందున, ఈ సందర్భంలో గౌరవపూర్వక ‘అయ్యా’ భావమే సహజం; దీనిని క్రీస్తును ప్రభువుగా గుర్తించిన ఒప్పుకోలుగా మార్చలేదు. అయినా κύριε అనే గ్రీకు రూపానికి ‘ప్రభువా’ అనే అర్థం కూడా ఉండగలదని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. యేసు సంబోధనలోని Γύναιకు ‘అమ్మా’ను గౌరవార్థకంగా ఎంచుకున్నాం. మరియ మాటల్లో ‘మీరు/చెప్పండి/ఉంచారు’ అనే గౌరవ రూపాలు నిలిపాం. పాదసూచిక సూచిక [a] సంబంధిత ‘అయ్యా’ పదంపైనే ఉంచబడింది.
