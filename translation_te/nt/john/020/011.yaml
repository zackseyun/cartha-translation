source:
  edition: SBLGNT
  text: Μαρία δὲ εἱστήκει πρὸς ⸂τῷ μνημείῳ ἔξω κλαίουσα⸃. ὡς οὖν ἔκλαιεν παρέκυψεν εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/011.yaml
  text: But Mary was standing outside the tomb, weeping. So, as she was weeping, she bent over to look into the tomb,
translation:
  language: te
  text: కాని మరియ సమాధి బయట నిలబడి ఏడుస్తూ ఉంది. ఆమె ఏడుస్తుండగా, సమాధిలోకి చూడటానికి వంగింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వంగి సమాధిలోకి చూసింది.” గ్రీకు క్రియలో చూడడానికి వంగడం అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: కాని
  rationale: ముందటి దృశ్యం నుంచి మరియవైపు కథనం మళ్లడంలోని స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: εἱστήκει
  choice: నిలబడి ... ఉంది
  rationale: కొనసాగుతున్న స్థితిని తెలిపే గ్రీకు క్రియారూప భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: సమాధి బయట
  rationale: మరియ సమాధికి వెలుపల ఉన్నదనే స్థలసంబంధ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: μνημεῖον
  choice: సమాధి
  rationale: ఈ సందర్భంలో మృతదేహాన్ని ఉంచే సమాధి గుహను సూచించే ప్రామాణిక తెలుగు పదం.
- source_word: κλαίουσα / ἔκλαιεν
  choice: ఏడుస్తూ / అలా ఏడుస్తూ
  rationale: దుఃఖంతో కొనసాగుతున్న ఏడుపును, మూలంలోని పునరుక్తిని నిలుపుతూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὡς οὖν
  choice: ఆమె అలా
  rationale: ఏడుస్తున్న కొనసాగింపు మధ్యనే తదుపరి చర్య జరిగిందనే కథన సంబంధాన్ని తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: παρέκυψεν
  choice: చూడడానికి వంగింది
  rationale: లోపల చూడటానికి శరీరాన్ని వంచే చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰς τὸ μνημεῖον
  choice: సమాధిలోకి
  rationale: సమాధి అంతర్భాగం వైపు చూసిన దిశను నేరుగా వ్యక్తం చేస్తుంది.
