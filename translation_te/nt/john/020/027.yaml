review_pass:
  verdict: approve
  source_fidelity: The Telugu accurately conveys the narrative sequence, address to Thomas, the repeated invitations to bring finger and hand, the commands to see the hands and put the hand into Jesus' side, and the inceptive contrast in μὴ γίνου ἄπιστος ἀλλὰ πιστός. “నమ్మనివాడిగా మారకు; నమ్మేవాడిగా ఉండు” appropriately keeps the contextual focus on belief while representing γίνου as ‘become/change into.’
  naturalness: The wording is clear, idiomatic modern standard Telugu. “నీ వేలు ఇక్కడికి తెచ్చి,” “నా చేతులు చూడు,” and “నా ప్రక్కలో పెట్టు” are natural direct imperatives. The postposed speech verb is also normal Telugu narrative style.
  terminology: “తోమా,” “చేతులు,” and “ప్రక్క” are suitable and recognizable. The primary belief-oriented wording is contextually sound, and the footnote responsibly preserves the lexically possible faithless/faithful contrast without imposing it on the main text.
