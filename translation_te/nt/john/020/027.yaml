id: JHN.20.27
reference: John 20:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: te
  text: తర్వాత ఆయన తోమాతో, “నీ వేలు ఇక్కడికి తెచ్చి నా చేతులు చూడు. నీ చెయ్యి తెచ్చి నా ప్రక్కలో పెట్టు. నమ్మనివాడిగా మారకు; నమ్మేవాడిగా ఉండు[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వాసంలేనివాడిగా మారకు; విశ్వాసపాత్రుడిగా ఉండు.” గ్రీకు విశేషణాలు ఈ రెండు భావాలనూ ఇవ్వగలవు; అయితే ఈ సందర్భంలో పునరుత్థానుడైన యేసును తోమా నమ్మడమే ప్రధానాంశం.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: తర్వాత
  rationale: కథనంలోని కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథనశైలిలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: Φέρε
  choice: తెచ్చి
  rationale: వేలు, చెయ్యి రెండింటినీ యేసు వైపు తీసుకురావాలనే భావాన్ని తెలియజేస్తూ, రెండు ఆజ్ఞల్లోని గ్రీకు క్రియ పునరుక్తిని నిలుపుతుంది.
- source_word: δάκτυλόν σου ὧδε
  choice: నీ వేలు ఇక్కడికి
  rationale: ὧδε లోని స్థలసూచక భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἴδε
  choice: చూడు
  rationale: ఆజ్ఞార్థక భావాన్ని సరళమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὰς χεῖράς μου
  choice: నా చేతులు
  rationale: మూలంలోని బహువచనాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: నా ప్రక్కలో పెట్టు
  rationale: βάλε అనే బలమైన ఆజ్ఞను ‘పెట్టు’ తెలియజేస్తుంది; εἰς సూచించే లోపలికి అనే దిశాభావాన్ని ‘లో’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μὴ γίνου
  choice: మారకు
  rationale: γίνομαι లోని స్థితిలోకి రావడం లేదా మారడం అనే ప్రక్రియాభావాన్ని స్థిరమైన ‘ఉండకు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: ἄπιστος
  choice: నమ్మనివాడిగా
  rationale: తోమా పునరుత్థాన సాక్ష్యాన్ని నమ్మడానికి నిరాకరించిన తక్షణ సందర్భానికి సరిపోతుంది; సాధారణ అవిశ్వాస్యత అనే విస్తృత భావాన్ని బలవంతంగా రుద్దదు.
- source_word: πιστός
  choice: నమ్మేవాడిగా
  rationale: ఇక్కడ ప్రధానంగా పునరుత్థానుడైన యేసును నమ్మడమే సందర్భం; అయినా ‘విశ్వాసపాత్రుడు’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: ἄπιστος / πιστός అనే విశేషణాల వ్యతిరేక జోడీ
  choice: నమ్మనివాడిగా / నమ్మేవాడిగా
  alternative: విశ్వాసంలేనివాడిగా / విశ్వాసపాత్రుడిగా
  rationale: తోమా యేసు పునరుత్థానాన్ని నమ్మే విషయమే తక్షణ కథనకేంద్రం కాబట్టి నమ్మకం-కేంద్రిత అర్థాన్ని ప్రధాన పాఠ్యంలో ఎంచుకున్నాం. అయితే ఈ గ్రీకు పదాలకు విశ్వాసరాహిత్యం/విశ్వాసపాత్రత అనే భావమూ ఉండగలదు కాబట్టి దాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. ‘చెయ్యి’ సహజ వాడుకను, ‘ప్రక్క’ శరీర భాగానికి తగిన గంభీర పదాన్ని ఉపయోగించాం. ఆజ్ఞల ప్రత్యక్షతను మరియు మూలంలోని క్రియ పునరుక్తిని సాధ్యమైనంతవరకు నిలిపాం.
