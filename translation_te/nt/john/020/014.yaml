  to: ఈ మాటలు చెప్పిన తర్వాత[a], ఆమె వెనక్కి తిరిగి నిలబడి ఉన్న యేసును చూసింది; అయితే ఆయన యేసు అని ఆమెకు తెలియలేదు.
