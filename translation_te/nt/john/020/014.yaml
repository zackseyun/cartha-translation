id: JHN.20.14
reference: John 20:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ταῦτα εἰποῦσα ἐστράφη εἰς τὰ ὀπίσω, καὶ θεωρεῖ τὸν Ἰησοῦν ἑστῶτα, καὶ οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: te
  text: ఈ మాటలు చెప్పిన తర్వాత[a], ఆమె వెనక్కి తిరిగి నిలబడి ఉన్న యేసును చూసింది; అయితే ఆయన యేసు అని ఆమెకు తెలియలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ విషయాలు చెప్పిన తర్వాత.”
    reason: ταῦτα అనే బహువచన సర్వనామం పలికిన మాటలను లేదా మరింత విస్తృతంగా ఈ విషయాలను సూచించవచ్చు.
lexical_decisions:
- source_word: ταῦτα
  choice: ఈ మాటలు
  rationale: నపుంసక బహువచన సర్వనామంలోని బహువచన భావాన్ని నిలుపుతూ, ఇక్కడ ముందుగా పలికిన విషయాలను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: εἰποῦσα
  choice: చెప్పిన తర్వాత
  rationale: మరియను విశేషించే భూతకాల కృదంతం ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది; తెలుగులో కాలసంబంధంగా సహజంగా అనువదించబడింది.
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: ఆమె వెనక్కి తిరిగి
  rationale: తన వెనుకవైపుకు తిరగడాన్ని తెలిపే గ్రీకు నుడికారానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: θεωρεῖ
  choice: చూసింది
  rationale: కథనంలోని చారిత్రక వర్తమానాన్ని తెలుగు కథనశైలికి తగిన భూతకాలంలో ఇచ్చింది; ప్రత్యక్షంగా చూడడాన్ని సూచిస్తుంది.
- source_word: ἑστῶτα
  choice: అక్కడ నిలబడి ఉన్న
  rationale: పరిపూర్ణ కృదంతంలోని స్థితి భావాన్ని నిలుపుతూ, దృశ్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκ ᾔδει
  choice: ఆమెకు తెలియలేదు
  rationale: οἶδα యొక్క ప్రాథమిక ‘తెలుసు’ భావానికి దగ్గరగా ఉండి, గుర్తుపట్టకపోవడం అనే సందర్భానుగుణ అర్థాన్ని ప్రధాన పాఠ్యంలో తప్పనిసరిగా రుద్దదు.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: ఆయన యేసు అని
  rationale: ఆ వ్యక్తి యొక్క గుర్తింపే ఆమెకు తెలియలేదనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; గ్రీకులోని వర్తమాన కాలాన్ని తెలుగు పరోక్ష వాక్య నిర్మాణం సహజంగా మోస్తుంది.
theological_decisions:
- issue: పునరుత్థానుడైన యేసు గుర్తింపు
  choice: ఆయన యేసు అని ఆమెకు తెలియలేదు
  alternative: ఆయనే యేసు అని ఆమె గుర్తుపట్టలేదు
  rationale: వచనం ఆమెకు ఆ వ్యక్తి గుర్తింపు తెలియలేదని చెబుతుంది గాని, దానికి కారణాన్ని పేర్కొనదు. ప్రధాన అనువాదం ఆ కథన ఉద్రిక్తతను అలాగే ఉంచుతుంది; సందర్భానుగుణమైన ‘గుర్తుపట్టలేదు’ అనే భావాన్ని పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథనశైలి. గుర్తింపు విషయంలో గ్రీకు పాఠంలోని ‘తెలియలేదు’ భావాన్ని ప్రధాన పాఠ్యంలో నిలిపి ఉంచింది.
