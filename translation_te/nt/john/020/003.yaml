  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: te
  text: కాబట్టి పేతురు మరియు ఆ మరొక శిష్యుడు బయలుదేరి సమాధి వైపుకు వెళ్తూ ఉన్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమాధి వైపుకు వెళ్లారు.’ గ్రీకు భాషలోని అసంపూర్ణ భూతకాల క్రియను ఇలా సరళంగా అనువదించవచ్చు; అయితే ‘వెళ్తూ ఉన్నారు’ అనేది కొనసాగుతున్న చర్యను మరింత స్పష్టంగా తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: బయలుదేరి
  rationale: ఇక్కడ ἐξέρχομαι ఒక చోటు నుంచి బయలుదేరడాన్ని సూచిస్తుంది. తెలుగులో ‘బయలుదేరి’ సహజంగా ఉండి, తరువాతి ప్రయాణ చర్యతో సులభంగా అనుసంధానమవుతుంది.
- source_word: οὖν
  choice: అందుకే
  rationale: ముందరి వచనంలో చెప్పిన విషయానికి ప్రతిస్పందనగా జరిగిన చర్యను οὖν సూచిస్తుంది. ‘అందుకే’ ఆ పర్యవసాన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ Πέτρος
  choice: పేతురు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తి నామరూపం.
- source_word: ὁ ἄλλος μαθητής
  choice: ఆ మరొక శిష్యుడు
  rationale: ἄλλος ముందే సందర్భంలో తెలిసిన మరో వ్యక్తిని వేరుచేస్తుంది; μαθητήςకు సువార్తల సందర్భంలో సహజమైన, స్థిరమైన పదం ‘శిష్యుడు’.
- source_word: ἤρχοντο
  choice: వెళ్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న ప్రయాణ చర్యను చూపుతుంది. ‘వెళ్తూ ఉన్నారు’ ఆ కొనసాగింపు భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: εἰς τὸ μνημεῖον
  choice: సమాధి దగ్గరికి
  rationale: μνημεῖον ఇక్కడ యేసును ఉంచిన సమాధిని సూచిస్తుంది. εἰς గమ్యస్థానం వైపు కదలికను తెలియజేస్తుంది; ‘దగ్గరికి’ అనడం సమాధిలోకి ప్రవేశించారని ముందుగానే చెప్పకుండా గమ్యాన్ని సూచిస్తుంది.
