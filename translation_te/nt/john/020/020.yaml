id: JHN.20.20
reference: John 20:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: te
  text: ఇలా చెప్పిన తరువాత, ఆయన తన చేతులను, తన ప్రక్కను వారికి చూపించాడు. అప్పుడు శిష్యులు ప్రభువును చూసి సంతోషించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: ఇలా చెప్పిన తరువాత
  rationale: Aorist participle ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా కాలక్రమాన్ని తెలియజేస్తుంది.
- source_word: ἔδειξεν
  choice: చూపించాడు
  rationale: δείκνυμι ఇక్కడ కంటికి కనిపించేలా చూపించడం అనే నేరమైన అర్థంలో ఉంది.
- source_word: τὰς χεῖρας
  choice: తన చేతులను
  rationale: గ్రీకులో స్వామ్యసర్వనామం లేకపోయినా, ఇవి యేసు సొంత చేతులని సందర్భం స్పష్టం చేస్తుంది; తెలుగులో ‘తన’ సహజం.
- source_word: τὴν πλευράν
  choice: తన ప్రక్కను
  rationale: πλευρά అంటే శరీరపు ప్రక్క భాగం; గాయాన్ని అని అదనంగా చెప్పకుండా మూలంలోని సూచనను కాపాడుతుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: Dative indirect objectను తెలుగు క్రియతో సహజంగా ‘వారికి చూపించాడు’ అని వ్యక్తపరుస్తుంది.
- source_word: ἐχάρησαν
  choice: సంతోషించారు
  rationale: χαίρωలోని ఆనందాన్ని ఆధునిక సాధారణ తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ‘ఆనందించారు’ కూడా సాధ్యమే.
- source_word: οὖν
  choice: అప్పుడు
  rationale: ఇక్కడ కనిపించిన ఫలితంగా తరువాత జరిగిన ప్రతిస్పందనను కథనంలో సహజంగా అనుసంధానిస్తుంది.
- source_word: οἱ μαθηταί
  choice: శిష్యులు
  rationale: μαθηταίకు సువార్తల సందర్భంలో స్థిరమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: ἰδόντες
  choice: చూసి
  rationale: Aorist participle శిష్యుల సంతోషానికి సందర్భం లేదా కారణాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὸν κύριον
  choice: ప్రభువును
  rationale: κύριος పునరుత్థాన దర్శన సందర్భంలో కేవలం గౌరవసంబోధన కాక క్రీస్తును సూచించే బిరుదు; ‘ప్రభువు’ దాని బరువును నిలుపుతుంది.
theological_decisions:
- issue: κύριος పదానికి అనువాదం
  choice: ప్రభువు
  alternative: యజమాని / గురువు
  rationale: ఈ పునరుత్థాన దర్శన సందర్భంలో ఇది యేసును గుర్తించే క్రీస్తుసంబంధ బిరుదుగా పనిచేస్తుంది; ‘ప్రభువు’ యోహాను వాడుకలోని theological weightను అతిశయింపకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన కథన శైలి. మూలంలోని రెండు participial constructionsను సహజమైన తెలుగు కాలసంబంధ నిర్మాణాలుగా ఇచ్చాం.
