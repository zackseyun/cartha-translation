revisions:
- from: అయితే యేసే మెస్సీయ[b], దేవుని కుమారుడు అని మీరు విశ్వసించాలనీ[a], విశ్వసించడం ద్వారా ఆయన నామంలో జీవం పొందాలనీ ఇవి రాయబడ్డాయి.
  to: అయితే, యేసు మెస్సీయ[b], దేవుని కుమారుడు అని మీరు విశ్వసించేలా, విశ్వసించడం ద్వారా ఆయన నామంలో జీవం పొందేలా ఇవి వ్రాయబడ్డాయి.
  rationale: 'The revision retains every semantic element of the SBLGNT text and the English audit trail: the discourse turn, the completed written testimony, both purposes, Jesus’ messianic and divine-sonship titles, life, and life in his name. It improves Telugu flow by using parallel purpose clauses and corrects the footnote’s inaccurate characterization of the aorist variant as past-time.'
