id: JHN.20.31
reference: John 20:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: te
  text: అయితే, యేసు మెస్సీయ[b], దేవుని కుమారుడు అని మీరు విశ్వసించేలా, విశ్వసించడం ద్వారా ఆయన నామంలో జీవం పొందేలా ఇవి వ్రాయబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా ‘క్రీస్తు.’ గ్రీకు Χριστός ఒక బిరుదు; దాని అర్థం ‘అభిషిక్తుడు.’ ఇక్కడ దాన్ని ‘మెస్సీయ’ అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα δὲ
  choice: అయితే … ఇవి
  rationale: ταῦτα ముందుగా ప్రస్తావించిన సూచకకార్యాలు, వాటి వ్రాతపూర్వక వృత్తాంతాన్ని సూచిస్తుంది. δέ ఇక్కడ స్వల్ప వ్యత్యాసంతో కూడిన భావమార్పును తెలియజేస్తుంది; తెలుగు వాక్యక్రమానికి అనుగుణంగా ‘అయితే’ను మొదట, ‘ఇవి’ని ప్రధాన క్రియ దగ్గర ఉంచాం.
- source_word: γέγραπται
  choice: రాయబడ్డాయి
  rationale: పూర్తయిన రచనా కార్యం ఇప్పటికీ ఫలితాన్ని కలిగి ఉందనే పరిపూర్ణ కర్మణి భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἵνα πιστεύητε
  choice: మీరు విశ్వసించాలనీ
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని తెలుగు సముచ్చయ నిర్మాణంలో వ్యక్తం చేస్తుంది. ‘విశ్వసించాలి’ అనే రూపం విశ్వాసం ఆరంభమవడమా కొనసాగడమా అని ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం చేయదు; పాఠాంతరాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: ఇది వ్యక్తినామం కాక, దేవుడు నియమించిన అభిషిక్తుని సూచించే బిరుదు. ఆధునిక తెలుగు పాఠకులకు గుర్తుపట్టదగిన యూద మెస్సీయ సంబంధిత బిరుదుగా ‘మెస్సీయ’ను వాడి, ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: క్రీస్తు సంబంధిత ఈ బిరుదును తగ్గించకుండా, సహజమైన ప్రామాణిక తెలుగు రూపంలో నిలిపాం.
- source_word: πιστεύοντες
  choice: విశ్వసించడం ద్వారా
  rationale: ‘జీవం పొందడం’తో విశ్వాసానికి ఉన్న సాధనార్థక లేదా అనుబంధ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది; గ్రీకు కృదంతం కంటే అధికమైన సిద్ధాంత వివరణను జోడించదు.
- source_word: ζωὴν ἔχητε
  choice: జీవం పొందాలనీ
  rationale: తెలుగులో ‘జీవం కలిగి ఉండాలి’ కంటే ఉద్దేశ వాక్యంలో ‘జీవం పొందాలి’ సహజంగా ఉంటుంది. మూలంలో αἰώνιος లేనందున ‘నిత్యజీవం’ అని విస్తరించలేదు.
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  choice: ఆయన నామంలో
  rationale: యోహాను రచనలో ‘నామం’కు ఉన్న అధికార, వ్యక్తిత్వ సంబంధిత లోతును వివరించి పరిమితం చేయకుండా గ్రీకు రూపకాన్ని నిలిపాం.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు; అభిషిక్తుడు
  rationale: ఇక్కడ Χριστός యేసు మెస్సీయ గుర్తింపును తెలిపే బిరుదు. ప్రధాన పాఠ్యంలో సుపరిచితమైన ‘మెస్సీయ’ను ఉంచి, ‘క్రీస్తు’ అనే సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చాం; దాని అర్థం ‘అభిషిక్తుడు’ అని కూడా స్పష్టం చేశాం.
- issue: πιστεύητε లోని పాఠాంతరం మరియు క్రియాంశ భావం
  choice: మీరు విశ్వసించాలనీ
  alternative: మీరు విశ్వసించడం మొదలుపెట్టాలనీ; మీరు విశ్వసిస్తూ ఉండాలనీ
  rationale: SBLGNT ప్రధాన పాఠ్యం వర్తమాన సంభావనార్థక రూపమైన πιστεύητεను ముద్రిస్తుంది; πιστεύσητε అనే భూతకాలిక సంభావనార్థక పాఠాంతరం కూడా ఉంది. ఇది విశ్వాసం ఆరంభం లేదా కొనసాగింపుపై వేర్వేరు ఛాయలను కలిగించవచ్చు. ప్రధాన పాఠ్యం ఉద్దేశపూర్వకంగా విస్తృతంగా ఉండేలా చేసి, ఉద్రిక్తతను పాదసూచికలో సంరక్షించాం.
- issue: ζωή యొక్క పరిధి
  choice: జీవం
  alternative: నిత్యజీవం
  rationale: యోహాను సందర్భంలో ఈ పదానికి లోతైన రక్షణ సంబంధిత భావం ఉన్నప్పటికీ, ఈ వాక్యంలో ‘నిత్య’ అనే విశేషణం లేదు. అందువల్ల మూలపాఠ్యాన్ని విస్తరించకుండా ‘జీవం’ అని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. రెండు ἵνα ఉద్దేశ వాక్యాల సమాంతరతను ‘…అనీ, …అనీ’ నిర్మాణంతో నిలిపాం. తెలుగు సహజ వాక్యక్రమం కోసం γέγραπται ప్రధాన క్రియను చివర ఉంచాం.
