source:
  edition: SBLGNT
  text: Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν ⸀μαθητῶν, ἃ οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: te
  text: యేసు శిష్యుల సమక్షంలో అనేక ఇతర సూచక కార్యాలు చేశాడు[a]. అవి ఈ గ్రంథంలో వ్రాయబడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అద్భుతాలు’; గ్రీకులో ‘సూచకాలు’ అనే పదం ఉంది. ఈ కార్యాలు తమకన్నా మించిన దానిని—అంటే, యేసు ఎవరో—సూచిస్తాయని ఈ పదం నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: ఇంకా అనేక
  rationale: ఈ పదసముదాయం ముందున్న వృత్తాంతాన్ని కొనసాగిస్తూ, 31వ వచనంలో వచ్చే భావ వ్యత్యాసానికి మొదటి భాగంగా నిలుస్తుంది. ప్రతి గ్రీకు అవ్యయాన్ని విడిగా అనువదించకుండా, సహజమైన తెలుగులో ‘ఇంకా అనేక’ అని భావాన్ని అందించాం.
- source_word: σημεῖα
  choice: సూచక క్రియలు
  rationale: యోహాను సువార్తలో ఈ పదం కేవలం అద్భుత కార్యాలను కాకుండా, యేసు ఎవరో వెల్లడించే ప్రాముఖ్యంగల క్రియలను సూచిస్తుంది. ‘సూచక క్రియలు’ ఆ అంతర్భావాన్ని నిలుపుతుంది.
- source_word: ἐποίησεν
  choice: చేశాడు
  rationale: ఈ సందర్భంలో ποιέω అనే క్రియకు సహజమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: శిష్యుల సమక్షంలో
  rationale: ఆ క్రియలు శిష్యులు ప్రత్యక్ష సాక్షులుగా ఉండగా జరిగాయని తెలియజేస్తుంది. గ్రీకులో స్వామ్యసూచక పదం లేనందున ‘తన శిష్యులు’ అని విస్తరించలేదు.
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: అవి ... రాయబడలేదు
  rationale: గ్రీకు నిర్మాణంలోని కర్మణి భావాన్ని నిలుపుతూ, ఆ క్రియలు ఈ గ్రంథంలో లిఖితంగా లేవనే ప్రస్తుత ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: ఈ గ్రంథంలో
  rationale: βιβλίον ఇక్కడ లిఖిత సువార్త రచనను సూచిస్తుంది. ‘గ్రంథం’ గౌరవప్రదమైన, సాధారణ పాఠకులకు సుపరిచితమైన తెలుగు పదం.
theological_decisions:
- issue: యోహాను సువార్తలో σημεῖα పద ప్రయోగం
  choice: ‘అద్భుతాలు’కు బదులుగా ‘సూచక క్రియలు’
  alternative: అద్భుతాలు
  rationale: యేసు చేసిన కార్యాలు శక్తి ప్రదర్శనలు మాత్రమే కాకుండా, ఆయన వ్యక్తిత్వం మరియు కార్యాన్ని వెల్లడించే సూచనలని తెలియజేసే యోహాను భావాన్ని ఇది కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. పొడవైన గ్రీకు సంబంధవాచక నిర్మాణాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించాం; భావ సంబంధం యథాతథంగా ఉంది.
