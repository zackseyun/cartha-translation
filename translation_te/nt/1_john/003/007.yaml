id: 1JN.3.7
reference: 1 John 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: te
  text: 'చిన్నపిల్లలారా, ఎవరూ మిమ్మల్ని మోసగించనివ్వకండి.[a] నీతిని[c] ఆచరించేవాడు నీతిమంతుడు; ఆయన[b] నీతిమంతుడై ఉన్నట్లే.


    [a] లేదా, “ఎవరూ మిమ్మల్ని తప్పుదారి పట్టించనివ్వకండి.”

    [b] మూలభాషలో “ఆ వ్యక్తి.” ఇది బహుశా క్రీస్తును సూచిస్తుంది; అయితే కొందరు ఇది దేవుణ్ణి సూచిస్తుందని అర్థం చేసుకుంటారు.

    [c] లేదా, “న్యాయాన్ని.” ఇక్కడ ఈ పదం నీతిమంతునికి తగిన నడవడికను సూచిస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరూ మిమ్మల్ని తప్పుదారి పట్టించనివ్వకండి.”
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో “ఆ వ్యక్తి.” ఇది బహుశా క్రీస్తును సూచిస్తుంది; అయితే కొందరు ఇది దేవుణ్ణి సూచిస్తుందని అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: c
    text: లేదా, “న్యాయాన్ని.” ఇక్కడ ఈ పదం నీతిమంతునికి తగిన నడవడికను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: చిన్నపిల్లలారా
  rationale: ఆప్యాయతతో కూడిన సంబోధనను, గ్రీకు పదంలోని చిన్నతన భావాన్ని సాధ్యమైనంత సహజంగా నిలుపుతుంది.
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: ఎవరూ మిమ్మల్ని మోసగించనివ్వకండి
  rationale: నిషేధార్థక ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; πλανάωలోని ‘తప్పుదారి పట్టించు’ భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: ὁ ποιῶν
  choice: ఆచరించేవాడు
  rationale: వర్తమాన కృదంతం సూచించే అలవాటైన లేదా నిరంతర ప్రవర్తనను ఒకే చర్యగా కాకుండా వ్యక్తం చేస్తుంది.
- source_word: τὴν δικαιοσύνην
  choice: నీతిని
  rationale: δίκαιοςతో ఉన్న పదసంబంధాన్ని ‘నీతిమంతుడు’తో నిలుపుతూ, ఈ సందర్భంలోని నైతిక నడవడిక భావాన్ని అందిస్తుంది.
- source_word: δίκαιός ἐστιν
  choice: నీతిమంతుడు
  rationale: వ్యక్తి స్వభావం లేదా స్థితిని సూచిస్తూ δικαιοσύνηతో ఉన్న భావసంబంధాన్ని తెలుగులో కాపాడుతుంది.
- source_word: καθὼς
  choice: ఉన్నట్లే
  rationale: పోలికను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκεῖνος
  choice: ఆయన
  rationale: దైవిక వ్యక్తిని సూచించే గౌరవప్రదమైన, సహజమైన తెలుగు సర్వనామం; నిర్దిష్టంగా ‘క్రీస్తు’ లేదా ‘దేవుడు’ అని ప్రధాన పాఠ్యంలో నిర్ణయించదు. గ్రీకు నిర్దేశక సర్వనామ స్వరూపాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: ἐκεῖνος ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘ఆయన’ అని ఉంచి సూచిత వ్యక్తిని నిర్దిష్టంగా పేర్కొనలేదు.
  alternative: ‘క్రీస్తు’ అని స్పష్టీకరించడం; లేదా ‘దేవుడు’ అని అర్థం చేసుకోవడం.
  rationale: సమీప యోహానీయ సందర్భంలో క్రీస్తు అత్యంత సహజమైన సూచిత వ్యక్తి అయినప్పటికీ, దేవుడు/తండ్రి అనే అవగాహన కూడా ఉంది. అందువల్ల మూలంలోని భావసందిగ్ధతను పాఠ్యంలో నిలిపి, పాదసూచికలో ప్రత్యామ్నాయాన్ని నమోదు చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఆప్యాయమైన సంబోధన, స్పష్టమైన నిషేధం, గంభీరమైన ధార్మిక పదజాలం కలగలిపిన శైలి. ‘నీతిని ఆచరించేవాడు’ అనేది ఒక్క చర్యకన్నా జీవనపద్ధతిని సూచిస్తుంది. ‘ఆయన’ సహజమైన గౌరవప్రద ప్రయోగంగా ఉండి మూలంలోని సూచిత వ్యక్తి గురించిన ఉద్రిక్తతను పూర్తిగా పరిష్కరించదు.
