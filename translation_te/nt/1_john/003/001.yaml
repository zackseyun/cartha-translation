id: 1JN.3.1
reference: 1 John 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: te
  text: 'తండ్రి మనకు ఎలాంటి ప్రేమను ఇచ్చాడో చూడండి[a]: మనం దేవుని పిల్లలమని పిలువబడాలని—మనం దేవుని పిల్లలమే[b]. ఈ కారణంగానే లోకం మనలను ఎరుగదు[c], ఎందుకంటే అది ఆయనను ఎరుగలేదు[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎంత గొప్ప ప్రేమను’ అని కూడా అనువదించవచ్చు. గ్రీకు మాట తండ్రి ప్రేమ ఎలాంటిదో అన్న ఆశ్చర్యాన్ని ప్రధానంగా వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘మనం దేవుని పిల్లలమే’ అనే మాటలు లేవు.
    reason: textual_variant
  - marker: c
    text: ‘లోకం మనలను గుర్తించదు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: ‘ఆయన’ అనేది ఈ వాక్యంలో సహజంగా తండ్రిని సూచిస్తుంది; యోహాను రచనల విస్తృత సందర్భాన్ని బట్టి కొందరు దీనిని క్రీస్తును సూచించేదిగా గ్రహిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴδετε
  choice: చూడండి
  rationale: బహువచన ఆజ్ఞారూపంలోని శ్రద్ధను ఆకర్షించే ప్రత్యక్ష పిలుపును సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ποταπὴν ἀγάπην
  choice: ఎలాంటి ప్రేమను
  rationale: ప్రేమ పరిమాణాన్ని మాత్రమే కాక దాని స్వభావం పట్ల ఆశ్చర్యాన్ని వ్యక్తం చేసే గ్రీకు గుణార్థాన్ని నిలుపుతుంది.
- source_word: δέδωκεν
  choice: అనుగ్రహించాడో
  rationale: తండ్రి ఇచ్చిన ప్రేమ ఒక వరమనే భావాన్ని సహజంగా తెలియజేస్తుంది; గ్రీకు పూర్ణకాలంలోని కొనసాగుతున్న ఫలితాన్ని సందర్భం మోస్తుంది.
- source_word: τέκνα θεοῦ
  choice: దేవుని పిల్లలు
  rationale: τέκνα లింగసమావేషకమైన పదం; కుమారులు అనే పరిమితిని చేర్చకుండా కుటుంబ సంబంధాన్ని నిలుపుతుంది.
- source_word: κληθῶμεν
  choice: పిలువబడాలి
  rationale: ἵνα తరువాతి కర్మణి సంభావనార్థక రూపంలోని ఉద్దేశం/ఫలిత భావాన్ని సూటిగా నిలుపుతుంది.
- source_word: καὶ ἐσμέν
  choice: నిజంగా మనం ఆయన పిల్లలమే
  rationale: తెలుగులో అసంపూర్ణంగా వినిపించే ‘మనం ఉన్నాం’ను నివారిస్తూ, గ్రీకులోని దృఢ నిర్ధారణను స్పష్టంగా పునరుద్ఘాటిస్తుంది.
- source_word: ὁ κόσμος
  choice: లోకం
  rationale: యోహాను రచనల్లోని విస్తృత భావసాధ్యతను వ్యాఖ్యానించి కుదించకుండా మూల రూపకాన్ని నిలుపుతుంది.
- source_word: οὐ γινώσκει ἡμᾶς / οὐκ ἔγνω αὐτόν
  choice: మనలను ఎరుగదు / ఆయనను ఎరుగలేదు
  rationale: రెండు సమాంతర γινώσκω రూపాలకు ఒకే తెలుగు మూలపదాన్ని వాడి, తెలుసుకోవడం మరియు గుర్తించడం మధ్య భావసాధ్యతను నిలుపుతుంది.
theological_decisions:
- issue: αὐτόν అనే సర్వనామం ఎవరిని సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘ఆయనను’; సమీప పూర్వపదమైన తండ్రి సహజ సూచితుడు
  alternative: క్రీస్తును సూచిస్తుందని కూడా గ్రహించవచ్చు
  rationale: గ్రీకు పురుషలింగ సర్వనామం పేరు చెప్పదు. వాక్యంలోని సమీప స్పష్ట పూర్వపదం తండ్రి అయినా, యోహాను రచనల విస్తృత సందర్భంలో క్రీస్తు అనే అవగాహన సాధ్యం; కాబట్టి ప్రధాన పాఠ్యం అస్పష్టతను నిలుపుతుంది, పాదసూచిక ప్రత్యామ్నాయాన్ని తెలుపుతుంది.
- issue: καὶ ἐσμέν పాఠ్య భాగం
  choice: ప్రధాన పాఠ్యంలో చేర్చడం
  alternative: కొన్ని ప్రతుల్లో ఈ మాటలు లేవు
  rationale: SBLGNT దీన్ని పాఠ్యంలో స్వీకరిస్తుంది; దేవుని పిల్లలు అని కేవలం పేరు మాత్రమే కాదు, నిజంగానే అలాంటి వారమనే దృఢ నిర్ధారణను ఇది ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో. ‘ఎరుగదు’ అనే రూపం ‘తెలియదు’ కంటే వ్యక్తిగత సంబంధం/గుర్తింపు భావాన్ని, అలాగే గ్రీకు సమాంతరాన్ని మెరుగుగా మోస్తుంది. ప్రధాన పాఠ్యంలో ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వద్ద ఉంచబడింది.
