id: 1JN.3.5
reference: 1 John 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: te
  text: ఆయన పాపాలను తొలగించడానికి[b] ప్రత్యక్షమయ్యాడని[a] మీకు తెలుసు; ఆయనలో పాపం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెల్లడయ్యాడని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మోసుకుపోవడానికి.’ గ్రీకు క్రియకు ‘తొలగించడం,’ ‘తీసివేయడం,’ లేదా ‘మోసుకుపోవడం’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: మీకు తెలుసు
  rationale: οἶδα పరిపూర్ణ రూపంలో ఉన్నప్పటికీ కొయినే గ్రీకులో సాధారణంగా వర్తమానార్థాన్ని ఇస్తుంది. బహువచన సంబోధనను సహజమైన ఆధునిక తెలుగులో ‘మీకు తెలుసు’గా ఇచ్చాం.
- source_word: ἐκεῖνος
  choice: ఆయన
  rationale: అక్షరార్థంగా ‘ఆ వ్యక్తి/ఆయనే’ అనే సూచన ఉన్నా, యోహాను సందర్భంలో ఇది యేసు క్రీస్తును సూచిస్తుంది. గౌరవప్రదమైన ‘ఆయన’ సహజంగా ఉండి, సందర్భంలోని సూచనను కాపాడుతుంది.
- source_word: ἐφανερώθη
  choice: ప్రత్యక్షమయ్యాడు
  rationale: φανερόω యొక్క కర్మణి రూపం ఇక్కడ క్రీస్తు చారిత్రకంగా కనిపించడాన్ని లేదా వెల్లడి కావడాన్ని సూచిస్తుంది. ‘ప్రత్యక్షమయ్యాడు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἵνα
  choice: తొలగించడానికి
  rationale: ἵνα ఉద్దేశాన్ని సూచిస్తుంది. తెలుగులో క్రియార్థక ‘-డానికి’ నిర్మాణం ఆ ఉద్దేశార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἁμαρτίας
  choice: పాపాలను
  rationale: గ్రీకులో ఇది బహువచన కర్మపదం. అందువల్ల నిర్దిష్ట పాపకార్యాల బహుత్వాన్ని తగ్గించకుండా ‘పాపాలను’గా అనువదించాం.
- source_word: ἄρῃ
  choice: తొలగించడానికి
  rationale: αἴρω ఎత్తడం, మోసుకుపోవడం, తొలగించడం అనే అర్థాలు ఇవ్వగలదు. ఇక్కడ పాపాలను తొలగించే ఉద్దేశాన్ని ‘తొలగించడానికి’ స్పష్టంగా తెలియజేస్తుంది; మోసుకుపోవడం అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἁμαρτία
  choice: పాపం
  rationale: ఏకవచన, ఉపపదరహిత నామవాచకాన్ని ‘పాపం’గా ఉంచడం ఆయన సంపూర్ణ పాపరాహిత్యాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: ἐν + చతుర్థీ విభక్తి నిర్మాణాన్ని ‘ఆయనలో’గా ఇవ్వడం యోహాను రచనలోని అంతర్భావ భాషను, దాని ధార్మిక ప్రతిధ్వనిని కాపాడుతుంది.
theological_decisions:
- issue: ἐκεῖνος ఎవరిని సూచిస్తుంది?
  choice: యేసు క్రీస్తును సూచించే ‘ఆయన’
  alternative: మరింత అక్షరార్థమైన ‘ఆ వ్యక్తి’ లేదా బలప్రయోగంతో ‘ఆయనే’
  rationale: తక్షణ సందర్భంలో పాపాలను తొలగించడానికి ప్రత్యక్షమైనవాడు, తనలో పాపం లేనివాడు యేసు క్రీస్తే. ‘ఆయన’ అనే పదం అదనపు సిద్ధాంత పదజాలాన్ని చేర్చకుండా ఈ సూచనను సహజంగా ఉంచుతుంది.
- issue: పాపాలకు సంబంధించి αἴρω అర్థం
  choice: పాపాలను తొలగించడం
  alternative: పాపాలను మోసుకుపోవడం లేదా భరించడం
  rationale: ఈ వచనం క్రీస్తు ప్రత్యక్షమైన ఉద్దేశంగా పాపాల తొలగింపును ముందుకు తెస్తుంది. ‘తొలగించడానికి’ ఏకైక ప్రాయశ్చిత్త నమూనాను బలవంతంగా రుద్దదు; ‘మోసుకుపోవడం’ అనే నిజమైన పదార్థ అవకాశాన్ని పాదసూచికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. గ్రీకు వాక్యంలోని రెండు భాగాలను అర్ధవిరామంతో కలిపి, రెండు καί పదాల అనుసంధాన భావాన్ని తెలుగులో భారంగా అనిపించే పునరుక్తి లేకుండా నిలిపాం. ‘ఆయన’ క్రీస్తును గౌరవప్రదంగా సూచిస్తుంది; మూలంలో లేని పేరు లేదా సిద్ధాంత వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
