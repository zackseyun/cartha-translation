id: 1JN.3.18
reference: 1 John 3:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: te
  text: చిన్నపిల్లలారా, మనం మాటతోగానీ, నాలుకతోగానీ[a] ప్రేమించక, చేతల్లోనూ సత్యంలోనూ[b] ప్రేమిద్దాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మాటల్లోగానీ’. గ్రీకులో అక్షరార్థంగా ‘నాలుకతోగానీ’.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కార్యంలోనూ సత్యంలోనూ’.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: చిన్నపిల్లలారా
  rationale: ఆప్యాయతతో సంబోధించే బహువచన రూపం; ‘చిన్న’ అనే భావాన్ని, కుటుంబసంబంధమైన మృదుత్వాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: μὴ ἀγαπῶμεν
  choice: మనం ... ప్రేమించక
  rationale: μήతో కూడిన వర్తమాన కర్తరి విధ్యర్థక రూపం సమూహాన్ని ఉద్దేశించిన ప్రబోధాన్ని సూచిస్తుంది; తరువాతి ‘ప్రేమిద్దాం’తో కలిసి ‘ఇలా కాక, అలా చేద్దాం’ అనే గ్రీకు నిర్మాణాన్ని సహజంగా తెలుపుతుంది.
- source_word: λόγῳ
  choice: మాటతో
  rationale: ఇక్కడ λόγος మాటల ద్వారా వ్యక్తీకరణను సూచిస్తుంది; ఏకవచనంలోని సంక్షిప్తతను నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: μηδὲ τῇ γλώσσῃ
  choice: నాలుకతోగానీ
  rationale: γλῶσσα యొక్క ప్రత్యక్ష అర్థమైన ‘నాలుక’ను నిలిపి, అది మాటకు రూపకాలంకారంగా వాడబడిన స్పష్టమైన దృశ్యాన్ని కాపాడుతుంది.
- source_word: ἀλλὰ
  choice: ప్రేమించక ... ప్రేమిద్దాం
  rationale: తెలుగు ‘-క ... -ద్దాం’ నిర్మాణం గ్రీకులోని బలమైన వ్యతిరేకతను సహజంగా వ్యక్తం చేస్తుంది; భావపరంగా ‘కాని’ అంతర్లీనంగా ఉంది.
- source_word: ἐν ἔργῳ
  choice: చేతల్లోనూ
  rationale: ἔργον ఇక్కడ క్రియలో కనిపించే కార్యాచరణను సూచిస్తుంది. ‘చేతల్లో’ అనేది కేవలం మాటలకు విరుద్ధంగా ఆచరణలో చూపే ప్రేమను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: καὶ ἀληθείᾳ
  choice: సత్యంలోనూ
  rationale: ἀλήθεια యొక్క మూలార్థమైన ‘సత్యం’ను నిలుపుతుంది; దానిని కేవలం ‘నిజాయితీ’ లేదా ‘యథార్థత’గా కుదించకుండా యోహాను రచనలలోని విస్తృత భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ‘చేతల్లోనూ సత్యంలోనూ’ అనే పదబంధంలో ‘సత్యం’ యొక్క భావం
  choice: ‘సత్యం’ అనే విస్తృత పదాన్నే నిలుపడం
  alternative: ‘నిజాయితీతో’ లేదా ‘యథార్థంగా’ అని భావాన్ని కుదించడం
  rationale: ἀλήθεια ఇక్కడ ప్రేమ యొక్క నిజత్వాన్ని సూచించవచ్చు; అయితే యోహాను రచనలలో దీనికి దేవుని సత్యానికి అనుగుణత అనే లోతైన భావం కూడా ఉంది. ‘సత్యం’ ఈ రెండు అవకాశాలనూ తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఆప్యాయమైనా గౌరవప్రదమైన శైలి. ‘మాటతోగానీ, నాలుకతోగానీ’ అనే సమాంతరతను, ‘చేతల్లోనూ సత్యంలోనూ’ అనే వ్యతిరేక జతను నిలిపింది.
