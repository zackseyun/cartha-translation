id: 1JN.3.23
reference: 1 John 3:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: te
  text: 'ఆయన ఆజ్ఞ ఇదే: మనం ఆయన కుమారుడైన యేసు మెస్సీయ పేరులో విశ్వాసం ఉంచాలి[a][b], అలాగే ఆయన మనకు ఆజ్ఞ ఇచ్చినట్లుగా ఒకరినొకరం ప్రేమించాలి[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు క్రీస్తు.” గ్రీకు Χριστόςను సాధారణంగా “క్రీస్తు” అని లిప్యంతరీకరిస్తారు; ఇక్కడ అది బిరుదుగా ఉన్నందున ప్రధాన పాఠంలో “మెస్సీయ” అని అనువదించాం.
    reason: alternative_reading
  - marker: b
    text: “ఆయన కుమారుని పేరులో విశ్వసించాలి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో అక్షరార్థంగా, “ఆయన మనకు ఆజ్ఞ ఇచ్చినట్లుగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολή
  choice: ఆజ్ఞ
  rationale: అధికారపూర్వకమైన ఆదేశం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. రెండు సందర్భాల్లోనూ ఒకే పదాన్ని వాడి గ్రీకు పదపునరుక్తిని నిలిపాం.
- source_word: ἵνα πιστεύσωμεν
  choice: మనం … విశ్వాసముంచాలి
  rationale: ‘ఆయన ఆజ్ఞ ఇదే’ అన్న వాక్యం తరువాత ἵνα ఆ ఆజ్ఞలోని విషయాన్ని పరిచయం చేస్తుంది. తెలుగు విధ్యర్థక రూపం ఆజ్ఞాత్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πιστεύω τῷ ὀνόματι
  choice: పేరునందు విశ్వాసముంచాలి
  rationale: ఇది కేవలం ఒక పేరును వాస్తవమని అంగీకరించడం కాకుండా, ఆ పేరు సూచించే వ్యక్తి యొక్క బయలుపరచబడిన స్వరూపం మరియు అధికారంపై విశ్వాసం ఉంచడాన్ని సూచిస్తుంది.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: ఆయన కుమారుడైన
  rationale: దేవునితో యేసుకున్న సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగు విశేషణ నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ యేసును గుర్తించే అభిషిక్తుని బిరుదుగా పనిచేస్తోంది; అందువల్ల సంప్రదాయ లిప్యంతరీకరణ ‘క్రీస్తు’కు బదులుగా బిరుదు భావాన్ని తెలిపే ‘మెస్సీయ’ను వాడాం.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: ఒకరినొకరం ప్రేమించాలి
  rationale: పరస్పర ప్రేమను తెలిపే సహజమైన, సమాజమంతటినీ ఉద్దేశించే తెలుగు రూపం.
- source_word: καθὼς
  choice: ప్రకారం
  rationale: ప్రేమించాలనే కర్తవ్యాన్ని ఆయన ఇచ్చిన ఆజ్ఞతో అనుసంధానించే పోలిక/అనుగుణత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἔδωκεν ἐντολὴν ἡμῖν
  choice: ఆయన మనకు ఆజ్ఞ ఇచ్చిన
  rationale: గ్రీకులోని δίδωμι + ἐντολή నిర్మాణాన్ని, అలాగే ముందున్న ‘ఆజ్ఞ’తో పదపునరుక్తిని నిలుపుతుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός పేరు వంటి స్థిరరూపం కంటే అభిషిక్తుని బిరుదుగా స్పష్టంగా పనిచేస్తోంది. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని పాఠకునికి ప్రత్యక్షంగా ఉంచుతుంది.
- issue: πιστεύω τῷ ὀνόματι యొక్క భావం
  choice: పేరునందు విశ్వాసముంచాలి
  alternative: పేరును నమ్మాలి / పేరునందు నమ్మకముంచాలి
  rationale: విశ్వాసం యేసు పేరులో వ్యక్తమయ్యే ఆయన వ్యక్తిత్వం మరియు అధికారంపై కేంద్రీకృతమై ఉందనే యోహాను రచనల భావాన్ని నిలుపుతుంది; కేవలం ఒక పేరుకు మేధాపరమైన సమ్మతి అని సంకుచితం చేయదు.
- issue: ఒకే ఆజ్ఞలోని రెండు అంశాల సంబంధం
  choice: విశ్వాసముంచాలి; … ప్రేమించాలి
  alternative: విశ్వాసముంచి … ప్రేమించాలి
  rationale: ఒకవైపు విశ్వాసం, మరోవైపు పరస్పర ప్రేమ—రెండూ καίతో కలిపిన ఆజ్ఞలోని సమాంతర అంశాలుగా ఉన్నాయని స్పష్టంగా చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. ‘పేరునందు’ అనే బైబిలీయ ప్రయోగాన్ని భావసాంద్రత కోసం ఉంచి, మిగతా వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం. సెమికోలన్ ఒకే ఆజ్ఞలోని విశ్వాసం మరియు ప్రేమ అనే రెండు సమాంతర అంశాలను స్పష్టంగా వేరు చేస్తుంది.
