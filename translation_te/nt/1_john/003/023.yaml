revisions:
- from: 'ఆయన ఆజ్ఞ ఇదే: మనం ఆయన కుమారుడైన యేసు మెస్సీయ పేరునందు విశ్వాసముంచాలి[a][b]; ఆయన మనకు ఆజ్ఞ ఇచ్చిన ప్రకారం ఒకరినొకరం ప్రేమించాలి[c].'
  to: 'ఆయన ఆజ్ఞ ఇదే: మనం ఆయన కుమారుడైన యేసు మెస్సీయ పేరులో విశ్వాసం ఉంచాలి[a][b], అలాగే ఆయన మనకు ఆజ్ఞ ఇచ్చినట్లుగా ఒకరినొకరం ప్రేమించాలి[c].'
  rationale: The revision retains every source element and the title-sensitive rendering of Χριστός, while using current Telugu for faith in the name, presenting belief and mutual love as coordinated elements of one command, and clarifying the title footnote.
