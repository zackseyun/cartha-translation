id: 1JN.3.8
reference: 1 John 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: te
  text: పాపం చేస్తూ ఉండేవాడు అపవాది నుండి వచ్చినవాడు[a]. ఎందుకంటే అపవాది ఆది నుంచే పాపం చేస్తూ ఉన్నాడు[b]. అపవాది క్రియలను భగ్నం చేయడానికే దేవుని కుమారుడు ప్రత్యక్షమయ్యాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “అపవాది నుండి వచ్చినవాడు.” ఇది నైతిక-ఆధ్యాత్మిక మూలాన్ని లేదా పక్షసంబంధాన్ని సూచిస్తుంది; అపవాది నుండి అక్షరార్థంగా జన్మించాడని కాదు. “పాపం చేస్తూ ఉండేవాడు” అనే గ్రీకు రూపం సాధారణంగా కొనసాగుతున్న లేదా వ్యక్తికి లక్షణమైన ఆచరణను సూచిస్తుంది; ఒకే ఒక్క విడి పాపక్రియను మాత్రమే కాదు.
    reason: lexical_alternative
  - marker: b
    text: “ఆది” ఏ నిర్దిష్ట ఘట్టమో మూలపాఠం చెప్పదు. అపవాది ఆది నుండి కొనసాగిస్తూ పాపం చేస్తున్నాడనే భావం ఉంది.
    reason: ambiguity
  - marker: c
    text: “ప్రత్యక్షమయ్యాడు” అనే మాటకు “వెల్లడయ్యాడు” అని కూడా అనువదించవచ్చు. “భగ్నం చేయు” అని అనువదించిన గ్రీకు క్రియకు అక్షరార్థంగా “విప్పు”; సందర్భంలో “రద్దు చేయు” లేదా “నాశనం చేయు” అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: పాపం చేస్తూ ఉండేవాడు
  rationale: వర్తమాన కృదంతం నిరంతరమైన లేదా వ్యక్తి స్వభావాన్ని గుర్తించే ఆచరణను సూచిస్తుంది. ఒకే ఒక్క విడి పాపక్రియగా అర్థం కాకుండా సహజమైన ఆధునిక తెలుగులో ఈ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐκ τοῦ διαβόλου
  choice: అపవాది సంబంధి
  rationale: ἐκ సూచించే నైతిక-ఆధ్యాత్మిక మూలం లేదా పక్షసంబంధాన్ని తెలియజేస్తుంది; అపవాది నుండి అక్షరార్థంగా జన్మించాడనే భావాన్ని కలిగించదు.
- source_word: ὁ διάβολος
  choice: అపవాది
  rationale: ఈ సందర్భంలో διάβολος సాతానుకు స్థిరమైన వ్యక్తిగత బిరుదు. తెలుగు బైబిలు వాడుకలో గౌరవప్రదంగా, స్పష్టంగా ఉన్న ‘అపవాది’ దానిని వ్యక్తం చేస్తుంది.
- source_word: ἀπ’ ἀρχῆς
  choice: ఆది నుంచే
  rationale: యోహాను రచనలకు ప్రత్యేకమైన ‘ఆది నుండి’ అనే విస్తృత కాల-వేదాంత ప్రతిధ్వనిని నిలుపుతుంది; ఆ ఆది ఏ ఘట్టమో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἁμαρτάνει
  choice: పాపం చేస్తూ ఉన్నాడు
  rationale: వర్తమాన కాలంతో పాటు ‘ఆది నుండి’ అనే మాట ఉన్నందున గతం నుండి కొనసాగుతున్న లక్షణాత్మక క్రియను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τοῦτο ... ἵνα λύσῃ
  choice: నిర్మూలించేందుకే
  rationale: εἰς τοῦτο ముందున్న ఉద్దేశాన్ని ἵνα వాక్యభాగం వివరిస్తుంది. ‘-ఎందుకే’ ఆ ఉద్దేశాన్నీ దాని ప్రాధాన్యాన్నీ సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἐφανερώθη
  choice: ప్రత్యక్షమయ్యాడు
  rationale: కుమారుడు లోకంలో వెల్లడై కనిపించడాన్ని తెలిపే యోహాను పదప్రయోగాన్ని సహజమైన తెలుగులో అందిస్తుంది. ‘వెల్లడి చేయబడ్డాడు’ అనే కృత్రిమ కర్మణి రూపాన్ని నివారిస్తుంది.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: మూలంలోని క్రీస్తు సంబంధమైన కుమారత్వ బిరుదును నేరుగా, ప్రామాణికంగా నిలుపుతుంది.
- source_word: λύσῃ τὰ ἔργα τοῦ διαβόλου
  choice: అపవాది క్రియలను నిర్మూలించేందుకు
  rationale: λύω యొక్క మూలభావం విప్పడం లేదా విడదీయడం; ఇక్కడ అపవాది కార్యాలను భగ్నం చేసి వాటి ప్రభావాన్ని అంతం చేయడం అనే సందర్భార్థం ఉంది. ‘నిర్మూలించు’ నిర్ణయాత్మక రద్దును సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పాపం చేయడాన్ని తెలిపే వర్తమాన రూపం
  choice: నిరంతరమైన లేదా లక్షణాత్మక ఆచరణగా ‘పాపం చేస్తూ ఉండేవాడు’
  alternative: ఏ ఒక్క పాపక్రియ చేసినవాడైనా అని సంపూర్ణ నిరపేక్ష వాక్యంగా అనువదించడం
  rationale: వర్తమాన కృదంతం ఇక్కడ కొనసాగుతున్న ఆచరణను సూచిస్తుంది. ఈ ఎంపిక 1 యోహాను 1:8–2:2లో విశ్వాసుల పాపాన్ని అంగీకరించే మాటలతో ఉన్న వేదాంత ఉద్రిక్తతను తొలగించకుండా నిలుపుతుంది.
- issue: ‘అపవాది నుండి’ అనే సంబంధం
  choice: నైతిక-ఆధ్యాత్మిక మూలం లేదా పక్షసంబంధం
  alternative: అపవాది నుండి అక్షరార్థ జననం లేదా అస్తిత్వ ఉత్పత్తి
  rationale: ἐκ అనే మూలసూచక పదం యోహాను ద్వంద్వ చిత్రణలో నైతిక అనుబంధాన్ని తెలుపుతుంది. ‘సంబంధి’ ఆ భావాన్ని ఉంచుతూ అక్షరార్థ ఉత్పత్తిని సూచించదు.
- issue: దేవుని కుమారుడు ప్రత్యక్షమైన ఉద్దేశం
  choice: అపవాది క్రియలను నిర్ణయాత్మకంగా నిర్మూలించడం
  alternative: అపవాది క్రియలను కేవలం బహిర్గతం చేయడం
  rationale: ἵνα + λύσῃ స్పష్టమైన ఉద్దేశాన్ని, కార్యాల భగ్నాన్ని సూచిస్తాయి; కేవలం వాటిని చూపించడం మాత్రమే కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘అపవాది,’ ‘దేవుని కుమారుడు,’ ‘ఆది’ వంటి పరిచిత బైబిలు పదజాలం నిలుపబడింది. మూలంలోని కారణం మరియు ఉద్దేశం స్పష్టంగా ఉండేలా మూడు వాక్యాలుగా అమర్చబడింది.
