id: 1JN.3.19
reference: 1 John 3:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἐν τούτῳ ⸀γνωσόμεθα ὅτι ἐκ τῆς ἀληθείας ἐσμέν, καὶ ἔμπροσθεν αὐτοῦ πείσομεν ⸂τὴν καρδίαν⸃ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/019.yaml
  text: By this we will know that we are from the truth[a], and before him we will persuade our hearts[b],
translation:
  language: te
  text: దీనివల్ల మనం సత్యం నుండి వచ్చినవారమని తెలుసుకుంటాం[a]; ఆయన సన్నిధిలో మన హృదయాలకు నమ్మకం కలిగిస్తాం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మనం సత్యానికి చెందినవారమని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మన హృదయాలను ఒప్పిస్తాం’ లేదా ‘మన హృదయాలకు నెమ్మది కలిగిస్తాం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: దీనివల్ల
  rationale: తెలుసుకోవడానికి సాధనాన్ని లేదా ఆధారాన్ని సూచించే గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: γνωσόμεθα
  choice: తెలుసుకుంటాం
  rationale: భవిష్యత్ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘తెలుసుకొని ఉంటాం’ వంటి అదనపు భావాన్ని చేర్చదు.
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: మనం సత్యం నుండి వచ్చినవారమని
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవం అనే భావాన్ని నిలుపుతూ, ‘సత్యానికి చెందినవాళ్లం’ అనే వ్యాఖ్యానాత్మక పరిష్కారాన్ని ప్రధాన పాఠ్యంలోకి తేవదు.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: ఆయన సన్నిధిలో
  rationale: ‘ఆయన ఎదుట’ అనే అర్థాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πείσομεν
  choice: నమ్మకం కలిగిస్తాం
  rationale: πείθω యొక్క ‘ఒప్పించడం/నమ్మించడం’ భావాన్ని ఉంచి, ఈ సందర్భంలో హృదయానికి ధైర్యం లేదా నిశ్చయత కలిగించే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; ‘ఓదార్చుకుంటాం’ అని పూర్తిగా సంకుచితం చేయదు.
- source_word: τὴν καρδίαν ἡμῶν
  choice: మన హృదయాలకు
  rationale: గ్రీకులో ఏకవచన సమూహప్రయోగం ఉన్నప్పటికీ, బహువచన కర్తతో తెలుగులో పంపిణీ భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘సత్యం నుండి’ అనే యోహాను సంబంధిత భావం
  choice: సత్యం నుండి వచ్చినవారమని
  alternative: సత్యానికి చెందినవారమని
  rationale: మూలం, ఉద్భవం, లేదా సంబంధం మధ్యనున్న భావవిస్తృతిని పూర్తిగా సిద్ధాంతపరంగా నిర్ణయించకుండా ἐκ యొక్క రూపకాన్ని నిలుపుతుంది.
- issue: హృదయానికి సంబంధించి πείσομεν యొక్క భావం
  choice: మన హృదయాలకు నమ్మకం కలిగిస్తాం
  alternative: మన హృదయాలను ఒప్పిస్తాం; మన హృదయాలకు నెమ్మది కలిగిస్తాం
  rationale: అంతరంగ నిశ్చయతను సూచించే సందర్భాన్ని గౌరవిస్తూ, మూలపదంలోని ‘ఒప్పించడం’ భావాన్ని పూర్తిగా తొలగించదు; స్వీయన్యాయీకరణ అనే భావాన్ని కూడా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి. వాక్యాంతంలోని భావం తదుపరి వచనంతో కొనసాగుతుండవచ్చని సూచించే విధంగా ముగింపు పెట్టబడింది.
