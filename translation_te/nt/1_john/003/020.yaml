  verdict: revise
  source_fidelity: The draft preserves the explanatory force of the first ὅτι, the heart metaphor, the broad comparison that God is greater, and the comprehensive sense of γινώσκει πάντα. However, ‘తీర్పుతీర్చినా’ is concessive (‘even though/although it condemns’), whereas ἐὰν with the subjunctive expresses an ordinary open condition (‘if it condemns’).
  naturalness: The wording is generally clear and suitably formal in modern standard Telugu. Adding the space in ‘తీర్పు తీర్చితే’ improves standard written readability and restores the conditional construction.
  terminology: ‘హృదయం,’ ‘దేవుడు,’ ‘గొప్పవాడు,’ and ‘సమస్తం’ are appropriate. ‘దోషులమని తీర్పు తీర్చు’ faithfully conveys the judicial nuance of καταγινώσκῃ without replacing ‘heart’ with the interpretive term ‘conscience.’
  issues:
  - severity: medium
    issue: The main verb is rendered with a concessive form, ‘తీర్పుతీర్చినా.’
