id: 1JN.3.20
reference: 1 John 3:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: te
  text: ఎందుకంటే, మన హృదయం మనలను దోషులమని తీర్పు తీర్చితే[a], దేవుడు మన హృదయం కంటే గొప్పవాడు[b]; ఆయనకు సమస్తం తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మన హృదయం మనలను తప్పుపడితే’ లేదా ‘మనలో తప్పు కనుగొంటే.’
    reason: lexical_alternative
  - marker: b
    text: ‘దేవుడు మన హృదయం కంటే గొప్పవాడు’ అనే మాట, మన గురించిన పూర్తి సత్యం ఆయనకు తెలుసని, అలాగే మన స్వీయ దోషనిర్ణయంపై ఆయనకు అధికారం ఉందని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: మొదటి ὅτι ముందున్న వాక్యానికి కారణం లేదా వివరణను పరిచయం చేస్తుంది; తెలుగులో ‘ఎందుకంటే’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐὰν
  choice: …తీర్పుతీర్చినా
  rationale: ἐὰν + వర్తమాన సంభావనార్థక క్రియ షరతును సూచిస్తుంది. సందర్భంలో భరోసానిచ్చే ప్రధాన వాక్యంతో సహజంగా కలపడానికి తెలుగులో concessive రూపమైన ‘…తీర్పుతీర్చినా’ వాడబడింది; షరతు భావం నిలిచేలా ఉంది.
- source_word: καταγινώσκῃ
  choice: దోషులమని తీర్పుతీర్చు
  rationale: ఈ క్రియ ఎవరిమీదనైనా ప్రతికూల నిర్ణయానికి రావడం, తప్పుపట్టడం లేదా ఖండించడం అనే న్యాయసంబంధ అంతర్భావాన్ని కలిగి ఉంది. ‘దోషులమని తీర్పుతీర్చు’ అంతరంగపు ప్రతికూల తీర్పును స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ καρδία ἡμῶν
  choice: మన హృదయం
  rationale: καρδίαను ‘మనస్సాక్షి’గా వ్యాఖ్యానించకుండా మూలంలోని ‘హృదయం’ రూపకాన్ని నిలుపుతుంది; ఇది ఆధునిక తెలుగులోనూ అర్థమయ్యే ప్రయోగం.
- source_word: μείζων
  choice: గొప్పవాడు
  rationale: పోలికను జ్ఞానం, కనికరం లేదా అధికారానికి మాత్రమే పరిమితం చేయకుండా గ్రీకు పదంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: θεόςకు సహజమైన ప్రామాణిక తెలుగు అనువాదం.
- source_word: τῆς καρδίας ἡμῶν
  choice: మన హృదయం కంటే
  rationale: తులనార్థక విశేషణం తరువాతి గ్రీకు షష్ఠీ విభక్తిని తెలుగులో సహజమైన ‘కంటే’ పోలికతో అందిస్తుంది.
- source_word: γινώσκει πάντα
  choice: ఆయనకు సమస్తం తెలుసు
  rationale: πάντα యొక్క సమగ్ర పరిధిని ‘సమస్తం’ నిలుపుతుంది; తెలుగు వాక్య నిర్మాణంలో ఇది సహజంగా, గంభీరంగా ఉంటుంది.
theological_decisions:
- issue: ‘దేవుడు మన హృదయం కంటే గొప్పవాడు’ అనే మాటను ఎలా అర్థం చేసుకోవాలి
  choice: ప్రధాన వాక్యంలో పోలికను విస్తృతంగానే ఉంచి, తరువాతి ‘ఆయనకు సమస్తం తెలుసు’ అనే మాటను యథాతథంగా నిలపడం.
  alternative: దేవుడు మన స్వీయ దోషనిర్ణయం కంటే ఎక్కువ కనికరంగలవాడు; లేదా ఆయన తీర్పు మన హృదయ తీర్పును అధిగమిస్తుంది; లేదా మన గురించి ఆయనకు సంపూర్ణ జ్ఞానం ఉంది అని ప్రత్యేకంగా వివరించడం.
  rationale: మూలపాఠం దేవుని గొప్పతనాన్ని ఒక్క లక్షణానికి పరిమితం చేయదు. తరువాతి ఉపవాక్యం జ్ఞానాన్ని ప్రధానంగా సూచించినా, పోలికలో కనికరం లేదా అధికార భావాలు కూడా పరోక్షంగా ఉండవచ్చు; అందువల్ల అనువాదం ఆ భావసాంద్రతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘హృదయం’ అనే యోహానీయ రూపకాన్ని నిలిపి, ‘మనస్సాక్షి’ అనే వ్యాఖ్యానాత్మక పదాన్ని ప్రధాన పాఠ్యంలో నివారించాం. రెండు పాదాల మధ్య భావసంబంధాన్ని స్పష్టంగా చూపేందుకు అర్ధవిరామం వాడాం.
