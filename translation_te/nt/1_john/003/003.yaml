id: 1JN.3.3
reference: 1 John 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ ἁγνίζει ἑαυτὸν καθὼς ἐκεῖνος ἁγνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: te
  text: ఆయనపై ఈ నిరీక్షణ ఉంచుకున్న ప్రతివాడూ, ఆయన శుద్ధుడై ఉన్నట్లే, తనను తాను శుద్ధి చేసుకుంటాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనలో ఈ నిరీక్షణను కలిగియున్న ప్రతివాడూ.’ గ్రీకు పదబంధాన్ని ఈ విధంగానూ అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆయన’ అనే సూచన సందర్భంలో ఎక్కువగా కుమారుడు/క్రీస్తును ఉద్దేశిస్తుంది; అయితే గ్రీకు పాఠ్యం ఆయన పేరును నేరుగా పేర్కొనదు.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: ఉంచుకున్న ప్రతివాడూ
  rationale: వర్తమానకాల ఆర్టిక్యులర్ పార్టిసిపల్‌ యొక్క సాధారణ, లక్షణాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὴν ἐλπίδα ταύτην
  choice: ఈ నిరీక్షణ
  rationale: ταύτην మునుపటి వాక్యసందర్భంలో చెప్పిన నిరీక్షణను సూచిస్తుంది; ἐλπίς ఇక్కడ కేవలం కోరిక కాక, నమ్మకంతో కూడిన ఎదురుచూపు.
- source_word: ἐπ’ αὐτῷ
  choice: ఆయనపై
  rationale: ἐπί + దత్తివిభక్తి నిరీక్షణ ఆధారపడే వ్యక్తిని లేదా దాని లక్ష్యాన్ని సూచించగలదు; ‘ఆయనపై’ ఆ దిశను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἁγνίζει ἑαυτὸν
  choice: తనను తాను పవిత్రపరచుకుంటాడు
  rationale: ἁγνίζω యొక్క నైతిక శుద్ధీకరణ భావాన్నీ, కర్త తన విషయంలో చేపట్టే చర్యనూ తెలుపుతుంది; ἁγνός‌తో ఉన్న మూలపద సంబంధాన్ని ‘పవిత్ర’ ద్వారా సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: καθὼς
  choice: ఉన్నట్లే
  rationale: పోలికను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκεῖνος
  choice: ఆయన
  rationale: సందర్భంలో కుమారుడు/క్రీస్తే అత్యంత సహజ సూచితుడు; అయితే మూలంలో బిరుదు లేక సర్వనామసదృశ సూచన ఉన్నందున పేరు లేదా బిరుదును చేర్చలేదు.
- source_word: ἁγνός
  choice: పవిత్రుడు
  rationale: నైతిక స్వచ్ఛతను గౌరవప్రదమైన తెలుగులో తెలియజేస్తూ ἁγνίζειతో పదసంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: αὐτῷ మరియు ἐκεῖνος ఎవరిని సూచిస్తున్నాయి
  choice: రెండింటినీ ‘ఆయన’గా ఉంచి, సందర్భానుసారం కుమారుడు/క్రీస్తును సూచించే అవకాశాన్ని పాఠ్యంలో పేరుపెట్టి నిర్ధారించలేదు.
  alternative: ‘క్రీస్తుపై ... క్రీస్తు పవిత్రుడై ఉన్నట్లే’ అని స్పష్టీకరించడం; లేదా మొదటి సర్వనామాన్ని తండ్రియైన దేవునికి అన్వయించడం.
  rationale: మునుపటి సందర్భం కుమారుడు/క్రీస్తును బలంగా సూచించినా, గ్రీకు పాఠ్యం పేరును ఉపయోగించదు. అందువల్ల అసలైన సూచనాత్మక స్వల్ప అస్పష్టతను నిలిపాం.
- issue: ἑαυτὸν యొక్క వ్యాకరణపరమైన పుంలింగ ఏకవచనం
  choice: ‘ప్రతివాడూ ... తనను తాను ... పరచుకుంటాడు’ అనే పుంలింగ ఏకవచన సాధారణ నిర్మాణం.
  alternative: ‘ప్రతి ఒక్కరూ తమను తాము పవిత్రపరచుకుంటారు’ అనే లింగతటస్థ బహువచన నిర్మాణం.
  rationale: గ్రీకు సాధారణ వ్యాప్తిని కలిగిన పుంలింగ ఏకవచన రూపాన్ని తెలుగు సహజత్వంతో ప్రతిబింబిస్తుంది; ‘ప్రతివాడూ’ అందరినీ ఉద్దేశించిన సాధారణ ప్రయోగం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలితో. ‘పవిత్రపరచుకుంటాడు/పవిత్రుడు’ అనే జంట ద్వారా ἁγνίζει/ἁγνός పదసంబంధాన్ని నిలుపడానికి ప్రయత్నించబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
