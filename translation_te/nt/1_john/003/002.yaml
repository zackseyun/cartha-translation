id: 1JN.3.2
reference: 1 John 3:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: te
  text: ప్రియులారా, ఇప్పుడు మనం దేవుని పిల్లలం. మనం ఏమవుతామో ఇంకా ప్రత్యక్షం కాలేదు. ఆయన ప్రత్యక్షమైతే[a][b], మనం ఆయనలాగా ఉంటామని మనకు తెలుసు; ఎందుకంటే ఆయన నిజంగా ఉన్నట్లే మనం ఆయనను చూస్తాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది ప్రత్యక్షమైతే,” అంటే మనం ఏమవుతామనే విషయం ప్రత్యక్షమైతే. గ్రీకులో ఈ క్రియకు కర్త స్పష్టంగా చెప్పబడలేదు; సందర్భం క్రీస్తును సూచించే “ఆయన”కే ఎక్కువ మద్దతిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: అనేక అనువాదాలు దీన్ని “ఆయన ప్రత్యక్షమైనప్పుడు” అని అనువదిస్తాయి. గ్రీకు మరింత అక్షరార్థంగా “ఆయన ప్రత్యక్షమైతే” అని ఉంది; ఈ క్రియే ఈ వచనంలో ఇంతకుముందు కూడా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: ప్రియులారా
  rationale: బహువచన సంబోధనలోని ఆప్యాయతను, గౌరవాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: ప్రస్తుత దేవుని పిల్లల స్థితిని భవిష్యత్తులో వెల్లడి కానున్న స్థితితో స్పష్టంగా వ్యత్యాసపరుస్తుంది.
- source_word: τέκνα θεοῦ
  choice: దేవుని పిల్లలం
  rationale: లింగభేదాన్ని చేర్చకుండా దేవునితో ఉన్న సంతాన సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὔπω ἐφανερώθη
  choice: ఇంకా ప్రత్యక్షం కాలేదు
  rationale: φανερόω యొక్క ప్రత్యక్షం కావడం లేదా వెల్లడి కావడం అనే భావాన్ని తెలుగులో సహజంగా అందిస్తూ, తరువాతి ἐὰν φανερωθῇతో పదబంధ సంబంధాన్ని నిలుపుతుంది.
- source_word: τί ἐσόμεθα
  choice: మనం ఏమవుతామో
  rationale: భవిష్యత్తులో విశ్వాసుల స్థితి లేదా స్వభావం ఏమిటనే భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: οἴδαμεν
  choice: మనకు తెలుసు
  rationale: వర్తమానార్థంలో ఉన్న గ్రీకు క్రియను సహజమైన తెలుగు ప్రయోగంతో అందిస్తుంది.
- source_word: ἐὰν φανερωθῇ
  choice: ఆయన ప్రత్యక్షమైతే
  rationale: గ్రీకులో కర్త స్పష్టంగా లేకపోయినా సందర్భం క్రీస్తును సూచిస్తుంది. ‘-మైతే’ షరతు రూపాన్ని కాపాడుతుంది; అదే సమయంలో ముందున్న ‘ప్రత్యక్షం కాలేదు’తో పదసంబంధాన్ని నిలుపుతుంది.
- source_word: ὅμοιοι αὐτῷ
  choice: ఆయనలాగా ఉంటాం
  rationale: ఆయనతో ఏకత్వం లేదా సారూప్య-సమానత్వం అని అతిశయించకుండా నిజమైన పోలికను తెలియజేస్తుంది.
- source_word: ὀψόμεθα αὐτὸν
  choice: మనం ఆయనను చూస్తాం
  rationale: భవిష్యత్ ప్రత్యక్ష దర్శనాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καθώς ἐστιν
  choice: ఆయన ఉన్న విధంగానే
  rationale: క్రీస్తు నిజంగా ఎలా ఉన్నాడో అలా చూడటం అనే పోలిక/విధ భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ἐὰν φανερωθῇలో అంతర్లీన కర్త ఎవరనే ప్రశ్న
  choice: 'కర్త క్రీస్తు: ‘ఆయన ప్రత్యక్షమైతే.’'
  alternative: ‘అది ప్రత్యక్షమైతే,’ అంటే మనం ఏమవుతామనే విషయం ప్రత్యక్షమైతే.
  rationale: తరువాత ‘ఆయనలాగా’ ఉండటం, ‘ఆయనను’ చూడటం అని రావడం వల్ల క్రీస్తే కర్త కావడం సందర్భానికి బలంగా సరిపోతుంది. అయితే గ్రీకులో కర్త అంతర్లీనంగా ఉన్నందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: విశ్వాసులు భవిష్యత్తులో ఆయనలాగా ఉండటం యొక్క స్వభావం
  choice: ‘ఆయనలాగా ఉంటాం’—క్రీస్తుతో ఒకే వ్యక్తి లేదా ఒకే సారం అవుతారని కాక, ఆయనతో నిజమైన పోలిక కలుగుతుందని సూచిస్తుంది.
  alternative: ‘ఆయన ఉన్నట్లే మనమూ అవుతాం’ వంటి మరింత బలమైన వివరణాత్మక అనువాదం.
  rationale: ὅμοιοι పోలికను సూచిస్తుంది, సంపూర్ణ అభేదాన్ని కాదు; అందువల్ల వాక్యంలోని బలమైన రూపాంతర వాగ్దానాన్ని తగ్గించకుండానే అవసరంలేని తాత్త్విక సమానత్వాన్ని దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఆప్యాయమైనప్పటికీ గౌరవప్రదమైన ధోరణి వాడబడింది. ‘ప్రత్యక్షం కాలేదు/ప్రత్యక్షమైతే’ అనే పునరుక్తి మూలంలోని φανερόω పదసంబంధాన్ని సాధ్యమైనంత సహజంగా నిలుపుతుంది. ‘పిల్లలం’ సాధారణ పాఠకులకు సులభమైన, లింగసమావేశక రూపం.
