- from: పాపం చేస్తూ ఉండే ప్రతి ఒక్కరూ ధర్మవిరోధాన్ని కూడా ఆచరిస్తారు[a]; పాపమే ధర్మవిరోధం[b].
  to: పాపాన్ని ఆచరించే ప్రతి ఒక్కరూ ధర్మవిరోధాన్ని కూడా ఆచరిస్తారు[a]; పాపం ధర్మవిరోధం[b].
  rationale: The revision avoids a potentially overly progressive Telugu construction while preserving the Greek's generic, characteristic sense. It retains the established rendering for ἀνομία and makes the final clause a plain definition, as in the source. Footnote b is adjusted to document the source-language article issue directly rather than supplying an unrelated semantic gloss.
