  yaml_path: translation/nt/1_john/003/004.yaml
  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: te
  text: పాపాన్ని ఆచరించే ప్రతి ఒక్కరూ ధర్మవిరోధాన్ని కూడా ఆచరిస్తారు[a]; పాపం ధర్మవిరోధం[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పాపం చేసే ప్రతి ఒక్కరూ ధర్మవిరోధం కూడా చేస్తారు.’ గ్రీకులోని వర్తమాన రూపాలను మరింత అక్షరార్థంగా ఇలా అనువదించవచ్చు; ప్రధాన పాఠంలోని రూపం సందర్భంలో కనిపించే లక్షణమైన లేదా కొనసాగుతున్న ప్రవర్తన భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘పాపం,’ ‘ధర్మవిరోధం’ అనే రెండు పదాలకూ నిర్దిష్ట ఉపపదం ఉంది; అయితే ఇటువంటి నిర్వచనాత్మక వాక్యంలో తెలుగులో వాటిని సాధారణంగా విడిచిపెడతారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν
  choice: చేస్తూ ఉండే ప్రతి ఒక్కరూ
  rationale: ఆర్టికల్‌తో కూడిన వర్తమాన కృదంతం సాధారణంగా, కొనసాగుతూ లేదా లక్షణంగా జరిగే క్రియను సూచించగలదు. ‘చేస్తూ ఉండే ప్రతి ఒక్కరూ’ అనే రూపం ఒక్క విడి చర్యకే మాటను పరిమితం చేయకుండా ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τὴν ἁμαρτίαν
  choice: పాపం
  rationale: ఇక్కడ ఒక నిర్దిష్ట పాపకార్యం కాకుండా పాపం అనే సాధారణ భావం ఉద్దేశించబడింది; అందువల్ల తెలుగులో సహజంగా ‘పాపం’ అని అనువదించబడింది.
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: ధర్మవిరోధాన్ని కూడా ఆచరిస్తారు
  rationale: ‘కూడా’ అనే పదం καίను నిలుపుతుంది; ‘ఆచరిస్తారు’ అనేది ποιεῖను సందర్భానుసారంగా కొనసాగుతున్న ప్రవర్తనగా తెలియజేస్తూ మొదటి క్రియతో ఉన్న సమాంతరతను కాపాడుతుంది.
- source_word: ἀνομία
  choice: ధర్మవిరోధం
  rationale: ἀνομίαలోని ‘నియమం/ధర్మానికి విరుద్ధం’ అనే భావాన్ని ‘ధర్మవిరోధం’ సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది. ‘చట్టవిరోధం’ అంటే కేవలం పౌర చట్టం అనే అపార్థం కలగవచ్చు; ‘అధర్మం’ మూలపదంలోని ధర్మానికి విరోధమనే సంబంధాన్ని తక్కువ స్పష్టంగా చూపుతుంది.
- source_word: καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: పాపమే ధర్మవిరోధం
  rationale: ఇది నిర్వచనాత్మక వాక్యం. ‘పాపమే’ అనే నొక్కిచెప్పే రూపం గ్రీకు వాక్యంలోని సంక్షిప్త సమీకరణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: వర్తమానకాల క్రియలను ఒక్కసారి జరిగే చర్యగా చూపాలా, కొనసాగుతున్న లేదా లక్షణమైన ఆచరణగా చూపాలా
  choice: ‘చేస్తూ ఉండే/ఆచరిస్తారు’ అని కొనసాగుతున్న లేదా లక్షణమైన ప్రవర్తనను సూచించడం
  alternative: ‘పాపం చేసే ప్రతి ఒక్కరూ ధర్మవిరోధం కూడా చేస్తారు’
  rationale: సమీప సందర్భంలో వర్తమాన రూపాలు కొనసాగుతున్న లేదా వ్యక్తి ప్రవర్తనకు లక్షణమైన క్రియను సూచించగలవు. అయితే దీనిని ప్రత్యేకమైన సాంకేతిక ‘అలవాటు కాలం’గా అతిశయింపకుండా పాదటీపులో మరింత అక్షరార్థ ప్రత్యామ్నాయం ఇవ్వబడింది.
- issue: ἀνομία యొక్క వేదాంతపరమైన పరిధి
  choice: ధర్మవిరోధం
  alternative: చట్టాన్ని అతిక్రమించడం; అధర్మం
  rationale: మూలవాక్యం పాపాన్ని ἀνομίαతో నేరుగా సమీకరిస్తుంది. ‘ధర్మవిరోధం’ ఆ గాఢమైన సంబంధాన్ని నిలుపుతూ, దీనిని మోషే ధర్మశాస్త్రానికి మాత్రమే గానీ పౌర చట్టానికి మాత్రమే గానీ పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి వాడబడింది. ‘ప్రతి ఒక్కరూ’ లింగనిరపేక్షమైన సాధారణ సూచన. ‘ధర్మవిరోధం’ కొంత గంభీరమైన పదమైనప్పటికీ ἀνομίαలోని ధర్మం/నియమానికి విరుద్ధత అనే భావాన్ని ‘అధర్మం’కంటే స్పష్టంగా, ‘చట్టవిరోధం’కంటే విస్తృతంగా నిలుపుతుంది.
