id: 1JN.3.17
reference: 1 John 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: te
  text: అయితే, ఈ లోకపు ఆస్తిపాస్తులు కలిగి ఉండి, అవసరంలో ఉన్న తన సహోదరుణ్ణి[a] చూసి కూడా అతనిపట్ల తన హృదయాన్ని మూసుకుంటే,[b] దేవుని ప్రేమ[c] అతనిలో ఎలా నిలిచి ఉంటుంది?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహోదరుణ్ణి లేదా సహోదరిని.’ గ్రీకులో ‘సహోదరుడు’ అని ఉంది; అది ప్రతినిధిగా తోటి విశ్వాసిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతనికి తన కనికరాన్ని చూపకుండా ఉంటే.’ అక్షరార్థంగా, ‘అతనికి తన అంతరావయవాలను మూసుకుంటే’; ఇది హృదయపూర్వక కనికరాన్ని నిరాకరించడాన్ని తెలిపే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: ‘దేవుని ప్రేమ’ అంటే అతనిలో ఉన్న దేవుని ప్రేమ కావచ్చు, లేదా దేవునిపట్ల అతనికి ఉన్న ప్రేమ కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: ఈ లోకపు ఆస్తిపాస్తులు
  rationale: βίος ఇక్కడ జీవితం అనే అమూర్త భావాన్ని కాక, అవసరంలో ఉన్నవారికి సహాయం చేయగల భౌతిక వనరులు లేదా జీవనోపాధి సాధనాలను సూచిస్తుంది. ‘ఆస్తిపాస్తులు’ సాధారణ ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: θεωρῇ
  choice: చూసి
  rationale: θεωρέω ఇక్కడ కేవలం చూపు పడటాన్ని కాక, సహోదరుని అవసరాన్ని ప్రత్యక్షంగా గమనించి తెలుసుకోవడాన్ని సూచిస్తుంది; సందర్భంలో ‘చూసి’ సహజంగా సరిపోతుంది.
- source_word: ἀδελφὸν
  choice: సహోదరుణ్ణి
  rationale: గ్రీకు పదం పుంలింగ ఏకవచనంలో ఉంది. ‘సహోదరుడు’ దాని రూపాన్ని కాపాడుతూ, యోహాను రచనల సందర్భంలో తోటి విశ్వాసిని కూడా సూచించగలదు.
- source_word: χρείαν ἔχοντα
  choice: అవసరంలో ఉన్న
  rationale: ‘అవసరం కలిగి ఉన్న’ అనే మూల భావాన్ని ఆధునిక తెలుగులో సహజమైన రీతిలో వ్యక్తం చేస్తుంది.
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: అతనిపట్ల తన హృదయాన్ని మూసుకుంటే
  rationale: σπλάγχνα అక్షరార్థంగా అంతరావయవాలు అయినా, ఇక్కడ లోతైన కనికరం లేదా హృదయానుభూతికి నుడికారంగా వాడబడింది. ఈ అనువాదం ఉద్దేశపూర్వకంగా కనికరాన్ని నిరాకరించే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πῶς
  choice: ఎలా
  rationale: πῶς ప్రవేశపెట్టే అలంకారిక ప్రశ్న రూపాన్ని కాపాడుతుంది; ‘ఎలా సాధ్యం?’ అని వివరణాత్మకంగా విస్తరించదు.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: దేవుని ప్రేమ
  rationale: 'ఈ రూపం గ్రీకు షష్ఠీ విభక్తిలోని సందిగ్ధతను కాపాడుతుంది: ఇది దేవుడు చూపే ప్రేమను గానీ, మనిషికి దేవునిపట్ల ఉన్న ప్రేమను గానీ సూచించవచ్చు.'
- source_word: μένει ἐν αὐτῷ
  choice: అతనిలో నిలిచి ఉంటుంది
  rationale: μένω అనే యోహాను రచనల్లో ప్రాముఖ్యమైన పదానికి చెందిన కొనసాగింపు, నివాస భావాలను ‘నిలిచి ఉంటుంది’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘దేవుని ప్రేమ’ అనే షష్ఠీ విభక్తి పదబంధం యొక్క అర్థం
  choice: ‘దేవుని ప్రేమ’ అని సందిగ్ధతను కాపాడటం
  alternative: ‘దేవుడు అతనిపట్ల చూపే ప్రేమ’ లేదా ‘దేవునిపట్ల అతని ప్రేమ’
  rationale: మూల గ్రీకు రెండు అర్థాలకు వ్యాకరణపరంగా అవకాశం ఇస్తుంది. ఒకే అర్థాన్ని ప్రధాన పాఠ్యంలో నిర్ణయించడం కంటే యోహాను ఉంచిన దైవ-మానవ ప్రేమ సంబంధిత ఉద్వేగాన్ని కాపాడటం సముచితం.
- issue: ἀδελφὸν యొక్క లింగ సూచన
  choice: సహోదరుణ్ణి
  alternative: సహోదరుణ్ణి లేదా సహోదరిని; తోటి విశ్వాసిని
  rationale: మూలపదం పుంలింగ ఏకవచనం కాబట్టి ప్రధాన పాఠ్యంలో దానిని కాపాడాం; అది ప్రతినిధిగా సహోదరిని లేదా తోటి విశ్వాసిని కూడా సూచించవచ్చని పాదటిప్పణిలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని కాపాడుతూ అనువదించబడింది. అలంకారిక ప్రశ్నను అలాగే ఉంచి, గ్రీకు నుడికారాన్ని సహజమైన తెలుగు హృదయ రూపకంతో వ్యక్తం చేశాం. పాదటిప్పణి గుర్తులన్నీ సంబంధిత పదబంధాల వద్ద ప్రధాన పాఠ్యంలో ఇవ్వబడ్డాయి.
