id: 1JN.3.10
reference: 1 John 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τούτῳ φανερά ἐστιν τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου· πᾶς ὁ μὴ ποιῶν δικαιοσύνην οὐκ ἔστιν ἐκ τοῦ θεοῦ, καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: te
  text: దేవుని పిల్లలు ఎవరో, అపవాది పిల్లలు ఎవరో దీనివల్ల స్పష్టమవుతుంది:[a] నీతిని ఆచరించని ప్రతి ఒక్కరూ దేవుని నుండి వచ్చినవారు కారు; అలాగే తమ సహోదరుణ్ణి ప్రేమించనివారు కూడా దేవుని నుండి వచ్చినవారు కారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దీనినిబట్టి’ లేదా ‘ఇందులో’ అని కూడా అనువదించవచ్చు. గ్రీకు పదబంధం ఈ తేడా ఏ ఆధారంగా గుర్తించబడుతుందో సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘సహోదరుణ్ణి లేదా సహోదరిని,’ అంటే తోటి విశ్వాసిని అని కూడా అర్థం చేసుకోవచ్చు. గ్రీకులో ‘సహోదరుణ్ణి’ అనే పుంలింగ ఏకవచన రూపం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: దీనివల్ల
  rationale: ఈ పదబంధం ఈ రెండు వర్గాల మధ్య తేడా దేని ఆధారంగా గుర్తించబడుతుందో సూచిస్తుంది. ‘దీనివల్ల’ సహజమైన ఆధునిక తెలుగు; ‘ఇందులో’ లేదా ‘దీనినిబట్టి’ అనే భావసాధ్యతను పూర్తిగా మూసివేయదు.
- source_word: φανερά ἐστιν
  choice: స్పష్టమవుతుంది
  rationale: గుర్తించదగినదిగా లేదా బహిర్గతమైనదిగా ఉండటాన్ని తెలియజేస్తుంది. తెలుగులో ఈ సందర్భానికి ‘స్పష్టమవుతుంది’ సహజంగా సరిపోతుంది.
- source_word: τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου
  choice: దేవుని పిల్లలు ... అపవాది పిల్లలు
  rationale: τέκνα లోని కుటుంబసంబంధ రూపకాన్ని ‘పిల్లలు’ నిలుపుతుంది. διάβολος ఇక్కడ వ్యక్తిగత బిరుదుగా ఉన్నందున ప్రామాణిక తెలుగు పదమైన ‘అపవాది’ వాడబడింది.
- source_word: πᾶς ὁ μὴ ποιῶν δικαιοσύνην
  choice: నీతిని ఆచరించని ప్రతి ఒక్కరూ
  rationale: వర్తమాన కృదంతం ఒకే చర్యకన్నా లక్షణాత్మకమైన జీవనాచరణను సూచిస్తుంది; ‘ఆచరించని’ ఆ భావాన్ని తెలియజేస్తుంది. δικαιοσύνην కు ఈ నైతిక సందర్భంలో ‘నీతి’ సరిపోతుంది.
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: దేవుని నుండి వచ్చినవారు కారు
  rationale: ἐκ మూలం లేదా ఉద్భవాన్ని సూచిస్తుంది. ‘దేవుని నుండి వచ్చినవారు కారు’ ఆ మూలభావాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ
  choice: తమ సహోదరుణ్ణి ప్రేమించనివారు
  rationale: ἀδελφόν వ్యాకరణపరంగా పుంలింగ ఏకవచనం కాబట్టి ‘సహోదరుణ్ణి’ నిలుపబడింది. తెలుగు సాధారణ వాక్యనిర్మాణంలో లింగనిర్దేశిత ‘అతని’ కంటే అనిర్దిష్ట వ్యక్తిని తిరిగి సూచించే ‘తమ’ సహజంగా ఉంటుంది.
- source_word: καὶ
  choice: అలాగే ... కూడా
  rationale: రెండవ కృదంత వాక్యభాగంలో ముందున్న ‘దేవుని నుండి వచ్చినవారు కారు’ అనే విధేయం అధ్యాహారంగా ఉంది. తెలుగులో స్పష్టత కోసం దానిని పునరుక్తి చేసి, καὶ సంబంధాన్ని ‘అలాగే ... కూడా’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: నైతిక లేదా ఆత్మీయ గుర్తింపుకు కుటుంబసంబంధ భాష
  choice: దేవుని పిల్లలు మరియు అపవాది పిల్లలు
  alternative: దేవునికి చెందినవారు మరియు అపవాదికి చెందినవారు
  rationale: మూలపాఠం τέκνα అనే స్పష్టమైన కుటుంబసంబంధ పదాన్ని ఉపయోగిస్తుంది. ‘పిల్లలు’ యోహానీయ రూపకాన్నీ, దాని వేదాంతపరమైన ఉద్రిక్తతనూ మృదువుపరచకుండా నిలుపుతుంది.
- issue: ἀδελφός అనే పుంలింగ పదం యొక్క పరిధి
  choice: తమ సహోదరుణ్ణి
  alternative: తమ సహోదరుణ్ణి లేదా సహోదరిని; తోటి విశ్వాసిని
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని ప్రధాన పాఠంలో కాపాడాం. సందర్భంలో అది తోటి విశ్వాసిని విస్తృతంగా సూచించగలదనే విషయాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: రెండవ నిషేధ వాక్యభాగంలోని అధ్యాహారం
  choice: దేవుని నుండి వచ్చినవారు కారు అనే విధేయాన్ని పునరుక్తి చేయడం
  alternative: అలాగే తమ సహోదరుణ్ణి ప్రేమించనివారు కూడా
  rationale: గ్రీకులో రెండవ భాగంలో విధేయం అధ్యాహారంగా ఉంది. తెలుగులో దానిని విడిచిపెడితే వాక్యం అసంపూర్ణంగా వినిపించవచ్చు; పునరుక్తి కొత్త వేదాంతార్థాన్ని చేర్చకుండా సంబంధాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. కుటుంబసంబంధ రూపకం, మూలం/ఉద్భవాన్ని తెలిపే భాష, లక్షణాత్మక నైతిక ఆచరణ అన్నీ నిలుపబడ్డాయి. పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో సంబంధిత స్థానాల్లో ఉంచబడ్డాయి.
