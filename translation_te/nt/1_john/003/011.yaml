  text: Ὅτι αὕτη ἐστὶν ἡ ἀγγελία ἣν ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: te
  text: 'ఎందుకంటే మీరు ఆరంభం నుంచీ విన్న సందేశం ఇదే: మనం ఒకరినొకరు ప్రేమించాలి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనం ఒకరినొకరు ప్రేమించేలా”; లేదా, “మనం ఒకరినొకరు ప్రేమిద్దాం.”
    reason: ἵνα + సబ్జంక్టివ్ నిర్మాణం ఇక్కడ సందేశపు విషయం, ఉద్దేశం, లేదా ప్రోత్సాహం అనే దగ్గరి భావఛాయలను అనుమతిస్తుంది.
lexical_decisions:
- source_word: Ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యానికి వివరణను అందించే కారణార్థక అనుసంధానంగా ఇక్కడ సహజంగా పనిచేస్తుంది.
- source_word: ἀγγελία
  choice: సందేశం
  rationale: యోహాను వాడుకలోని భావాన్ని స్పష్టంగా, ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἣν ἠκούσατε
  choice: మీరు విన్న
  rationale: గ్రీకు భూతకాల క్రియను నేరుగా ప్రతిబింబిస్తూ, తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἀπ’ ἀρχῆς
  choice: ఆరంభం నుంచీ
  rationale: యోహాను రచనల్లో ప్రాముఖ్యమున్న స్థిరమైన భావాన్ని కాపాడుతుంది.
- source_word: ἵνα ἀγαπῶμεν
  choice: మనం ... ప్రేమించాలి
  rationale: ἵνα ఉపవాక్యం సందేశపు విషయాన్ని, వర్తమాన సబ్జంక్టివ్‌లోని నైతిక ఆదేశ భావాన్ని రెండింటినీ సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀλλήλους
  choice: ఒకరినొకరు
  rationale: పరస్పర చర్యను సూచించే సహజమైన ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: ἵνα ἀγαπῶμεν ἀλλήλους అనే పదబంధపు భావం
  choice: సందేశపు నైతిక సారంగా ‘మనం ఒకరినొకరు ప్రేమించాలి’
  alternative: ‘మనం ఒకరినొకరు ప్రేమించేలా’ లేదా ‘మనం ఒకరినొకరు ప్రేమిద్దాం’
  rationale: సందేశపు విషయాన్ని ప్రధానంగా ఉంచుతూ దానిలోని ఆదేశ భావాన్ని కాపాడుతుంది; ప్రయోజనార్థాన్ని లేదా ప్రత్యక్ష ప్రోత్సాహాన్ని మాత్రమే నిర్ణయాత్మకంగా ఎంచుకోదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుకుంది.
