    rationale: The Greek ἔγνωκεν is perfect (‘has not known’). Modern Telugu normally uses ‘తెలుసుకోలేదు’ (or the more literary ‘ఎరుగలేదు’) here. The current ‘ఎరుగనూ లేదు’ does not naturally express the intended completed/resultative negation.
