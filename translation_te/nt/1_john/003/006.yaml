  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: te
  text: ఆయనలో నిలిచి ఉండే ప్రతివాడూ పాపం చేయడు[a]. పాపం చేసే ప్రతివాడు ఆయనను చూడలేదు, ఆయనను తెలుసుకోలేదు కూడా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ఇక్కడ ‘పాపం చేయడు … పాపం చేసే ప్రతివాడు’ అని ఉంది. ఈ వర్తమానకాల రూపాలు కొనసాగుతున్న లేదా ఒకరి లక్షణంగా మారిన చర్యను సూచించగలవు; అందువల్ల ‘పాపం చేస్తూనే ఉండడు … పాపం చేస్తూనే ఉండే ప్రతివాడు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ
  choice: ప్రతివాడూ / ప్రతివాడు
  rationale: నిర్దిష్ట లక్షణం గల ఎవరినైనా సూచించే గ్రీకు సాధారణీకరణ నిర్మాణంలోని సార్వత్రిక భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐν αὐτῷ μένων
  choice: ఆయనలో నిలిచి ఉండే
  rationale: యోహాను రచనల్లో ముఖ్యమైన μένω పదంలోని కొనసాగింపు, సంబంధం అనే భావాలను అందిస్తూ, ἐν αὐτῷ లోని ‘ఆయనలో’ అనే రూపాన్ని కాపాడుతుంది.
- source_word: οὐχ ἁμαρτάνει
  choice: పాపం చేయడు
  rationale: గ్రీకు వర్తమానకాల రూపాన్ని మూలానికి దగ్గరగా అనువదిస్తుంది. ఈ రూపం సందర్భంలో కొనసాగుతున్న లేదా లక్షణాత్మక క్రియను సూచించగలదనే అంశాన్ని పాదసూచికలో ఉంచి, ప్రధాన పాఠ్యంలో లేని ‘చేస్తూనే’ భావాన్ని తప్పనిసరిగా చేర్చదు.
- source_word: ὁ ἁμαρτάνων
  choice: పాపం చేసే ప్రతివాడు
  rationale: వర్తమాన కృదంతాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, మొదటి వాక్యభాగంతో సమాంతరతను నిలుపుతుంది; కొనసాగుతున్న లేదా అలవాటైన చర్య అనే సాధ్యార్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: οὐχ ἑώρακεν αὐτόν
  choice: ఆయనను చూడలేదు
  rationale: గ్రీకు సంపూర్ణకాల రూపంలోని ఫలితస్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘ఎన్నడూ’ అని మూలంలో లేని బలాన్ని చేర్చదు.
- source_word: οὐδὲ ἔγνωκεν αὐτόν
  choice: ఆయనను ఎరుగనూ లేదు
  rationale: οὐδέ లోని అనుసంధాన నిరాకరణను ‘నూ లేదు’తో చూపుతుంది. ‘ఎరుగుట’ ఇక్కడ కేవలం సమాచారం తెలుసుకోవడం కంటే వ్యక్తిగత/సంబంధపూర్వక జ్ఞానానికీ చోటిస్తుంది.
- source_word: αὐτῷ / αὐτόν
  choice: ఆయనలో / ఆయనను
  rationale: గ్రీకు సర్వనామ రూపాన్నే నిలుపుతూ, దాని సూచిత వ్యక్తిని ‘దేవుడు,’ ‘కుమారుడు,’ లేదా ‘క్రీస్తు’ అని అనువాదంలోనే నిర్ణయించదు.
theological_decisions:
- issue: ఈ వచనం విశ్వాసులు అసలు ఏ పాపమూ చేయరని బోధిస్తుందా?
  choice: ప్రధాన పాఠ్యంలో గ్రీకు వర్తమానకాల రూపాలను ‘పాపం చేయడు / పాపం చేసే’ అని ఉంచి, కొనసాగుతున్న లేదా లక్షణాత్మక పాపాచరణ అనే సాధ్యార్థాన్ని పాదసూచికలో తెలిపాం.
  alternative: ‘పాపం చేస్తూనే ఉండడు / పాపం చేస్తూనే ఉండే ప్రతివాడు’ అని ప్రధాన పాఠ్యంలో స్పష్టీకరించడం; లేదా ఒక్క పాపకార్యానికీ మినహాయింపు లేని సంపూర్ణ నిరాకరణగా చదవడం.
  rationale: గ్రీకు వర్తమాన రూపాలు కొనసాగుతున్న లేదా లక్షణాత్మక చర్యను సూచించగలవు, కాని ఆ భావాన్ని ప్రత్యేక పదాలతో తప్పనిసరిగా వ్యక్తం చేయవు. 1 యోహాను 1:8–2:2తో ఉన్న ఉద్రిక్తతను తొలగించకుండా, మూలంలోని సంక్షిప్తతను ప్రధాన పాఠ్యం కాపాడుతుంది; పాదసూచిక ప్రధాన వ్యాఖ్యాన సాధ్యతను తెలియజేస్తుంది.
- issue: ‘ఆయన’ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ‘ఆయన’ అనే సర్వనామాన్నే నిలుపడం.
  alternative: ‘దేవుడు,’ ‘కుమారుడు,’ లేదా ‘క్రీస్తు’ అని స్పష్టంగా పేర్కొనడం.
  rationale: గ్రీకు వచనం ఇక్కడ సర్వనామాన్నే వాడుతుంది. తక్షణ సందర్భంలో సూచిత వ్యక్తిని అనువాదకుడు అవసరానికి మించి నిర్ధారించకుండా మూలంలోని సూచనాత్మకతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో. యోహాను రచనల్లోని ‘ఆయనలో నిలిచి ఉండడం’ అనే కీలక సంబంధభాషను నిలిపాం. ‘ఎరుగుట’ కొద్దిగా ఉన్నతమైనదైనా, వ్యక్తిగత సంబంధంతో కూడిన γινώσκω భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
