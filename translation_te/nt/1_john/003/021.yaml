id: 1JN.3.21
reference: 1 John 3:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀγαπητοί, ἐὰν ἡ καρδία ⸂μὴ καταγινώσκῃ ἡμῶν⸃, παρρησίαν ἔχομεν πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/021.yaml
  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: te
  text: ప్రియులారా, మన హృదయం[c] మనలను దోషులుగా తీర్చకపోతే[a], దేవుని ఎదుట మనకు ధైర్యం[b] ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మనపై నేరం మోపకపోతే,’ లేదా ‘మనలో తప్పు పట్టకపోతే.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నిబ్బరం,’ లేదా ‘దేవుని ఎదుట సంకోచం లేని స్థితి.’
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘హృదయం’ అంటే అంతరంగ వ్యక్తిత్వం లేదా నైతిక అవగాహన; ఈ సందర్భంలో అది ‘మనస్సాక్షి’కి దగ్గరైన భావాన్ని కలిగి ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἀγαπητοί
  choice: ప్రియులారా
  rationale: ప్రేమతో సంబోధించే బహువచన రూపాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; 1 యోహానులోని ప్రేమ పదజాలంతో సంబంధాన్ని నిలుపుతుంది.
- source_word: ἐὰν
  choice: పోతే
  rationale: ఉపవాక్యంలోని షరతును తెలుగులో సహజంగా తెలియజేసే రూపం.
- source_word: καρδία
  choice: హృదయం
  rationale: మూలంలోని రూపకాన్ని నిలుపుతుంది. సందర్భంలో ఇది అంతరంగ స్వభావం లేదా నైతిక అవగాహనను సూచించినా, ప్రధాన పాఠ్యంలో దాన్ని ‘మనస్సాక్షి’గా కుదించలేదు.
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: మనలను దోషులుగా తీర్చకపోతే
  rationale: καταγινώσκωలోని వ్యతిరేక తీర్పు, నింద లేదా దోషనిర్ణయం అనే న్యాయపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ముందరి వచనంతో ఉన్న భావసంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: παρρησίαν
  choice: ధైర్యం
  rationale: దేవుని సన్నిధిలో సంకోచం లేకుండా, బహిరంగంగా నిలిచే నిబ్బరాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అతిశయమైన సాహసం అనే భావాన్ని రానివ్వదు.
- source_word: πρὸς τὸν θεόν
  choice: దేవుని ఎదుట
  rationale: దేవునితో సంబంధంలో లేదా ఆయన సన్నిధిలో కలిగే ధైర్యాన్ని సందర్భానుకూలంగా వ్యక్తం చేస్తుంది; మూలంలోని సంబంధాత్మక దిశాభావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: καρδία సూచించే అంతరంగ సామర్థ్యం
  choice: హృదయం
  alternative: మనస్సాక్షి
  rationale: ‘హృదయం’ అనే మూల రూపకాన్ని, యోహాను పదప్రయోగాన్ని నిలుపుతుంది. ఇక్కడ మనస్సాక్షికి దగ్గరైన కార్యభావం ఉన్నా, దాన్ని మరింత సంకుచితమైన మానసిక వర్గంగా ప్రధాన పాఠ్యంలో నిర్దేశించలేదు.
- issue: దేవునితో సంబంధంలో παρρησίαν యొక్క భావం
  choice: దేవుని ఎదుట ధైర్యం
  alternative: దేవుని ఎదుట నిబ్బరం; దేవుని సమక్షంలో సంకోచం లేని స్థితి
  rationale: దేవుని సన్నిధిలో విశ్వాసి బహిరంగంగా, సిగ్గుపడకుండా నిలిచే స్థితిని తెలియజేస్తుంది. ఇది భక్తిపూర్వక సమీపతను నిలుపుతూ, భావోద్వేగ నిశ్చయాన్ని అతిగా చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యంలోని గంభీరతను నిలుపుతూ అనువదించబడింది. ‘ప్రియులారా’ ఆప్యాయ సంబోధనను, ‘దోషులుగా తీర్చడం’ నైతిక-న్యాయపరమైన భావాన్ని, ‘ధైర్యం’ దేవుని సన్నిధిలోని బహిరంగ నిబ్బరాన్ని వ్యక్తం చేస్తాయి.
