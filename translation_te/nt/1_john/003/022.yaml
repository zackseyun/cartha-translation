id: 1JN.3.22
reference: 1 John 3:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: te
  text: మనం ఏది అడిగినా ఆయన నుండి పొందుతాం. ఎందుకంటే మనం ఆయన ఆజ్ఞలను పాటిస్తాము, ఆయన దృష్టిలో[a] ఇష్టమైన వాటిని చేస్తాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన ఎదుట.’
    reason: ἐνώπιον αὐτοῦకు ‘ఆయన దృష్టిలో’ మరియు ‘ఆయన ఎదుట’ అనే సమీపార్థక అనువాదాలు సాధ్యమైనందున ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: ὃ ἐὰν
  choice: ఏది … అయినా
  rationale: ἐάνతో కూడిన సంబంధవాచక సర్వనామం అనిర్దిష్ట భావంలో ‘ఏది అయినా’ అని సూచిస్తుంది; ఇది తెలుగులో సహజంగా ఉంది.
- source_word: αἰτῶμεν
  choice: మనం … అడిగినా
  rationale: ప్రార్థనాపూర్వకంగా అడగడం లేదా విన్నవించడం అనే సాధారణ అర్థాన్ని ‘అడుగు’ సహజంగా తెలియజేస్తుంది.
- source_word: λαμβάνομεν
  choice: పొందుతాం
  rationale: వర్తమానకాల రూపం ఇక్కడ సాధారణంగా జరిగేదాన్ని తెలియజేస్తుంది; ‘పొందుతాం’ ఆ భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: ἀπ’ αὐτοῦ
  choice: ఆయన నుండి
  rationale: ἀπόతో కూడిన షష్ఠీ విభక్తి మూలాన్ని సూచిస్తుంది; ‘ఆయన నుండి’ దానిని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఇక్కడ ὅτι, అడిగినది పొందడానికి వచనం చెప్పే కారణాన్ని పరిచయం చేస్తుంది.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: ఆయన ఆజ్ఞలను
  rationale: యోహాను రచనల్లోని ἐντολή పదానికి ‘ఆజ్ఞ’ స్థిరమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: τηροῦμεν
  choice: గైకొంటూ
  rationale: τηρέωలోని పాటించడం, కాపాడుకోవడం అనే విస్తృత భావాన్ని ‘గైకొను’ నిలుపుతుంది; కేవలం ఆదేశానికి లోబడటం అనే భావానికి పరిమితం చేయదు.
- source_word: τὰ ἀρεστὰ
  choice: ఇష్టమైన వాటిని
  rationale: నామవాచకంగా వాడిన నపుంసక బహువచన విశేషణం దేవునికి ఇష్టమైన విషయాలు లేదా క్రియలను విస్తృతంగా సూచిస్తుంది.
- source_word: ἐνώπιον αὐτοῦ
  choice: ఆయన దృష్టిలో
  rationale: ἐνώπιονకు ‘ఎదుట’ లేదా ‘దృష్టిలో’ అనే భావం ఉంది; ఈ సందర్భంలో ‘ఆయన దృష్టిలో’ సహజంగా ఉండి మూలభావాన్ని నిలుపుతుంది.
- source_word: ποιοῦμεν
  choice: చేస్తాం
  rationale: ποιέω యొక్క సాధారణ అర్థమైన ‘చేయడం’ను ఇది అదనపు అలవాటు భావం చేర్చకుండా అందిస్తుంది.
theological_decisions:
- issue: ప్రార్థనకు సమాధానం లభించడానికి, ఆజ్ఞలను గైకొనడానికి మధ్య సంబంధం
  choice: ‘ఎందుకంటే’ ద్వారా మూలపాఠంలోని కారణ సంబంధాన్ని యథాతథంగా ఉంచడం
  alternative: దీనిని కేవలం అనుబంధంగా చూపించి కారణ సంబంధాన్ని సడలించడం
  rationale: గ్రీకు ὅτι స్పష్టంగా కారణాన్ని పరిచయం చేస్తుంది. ఈ వాక్యాన్ని ప్రార్థనకు యాంత్రిక సూత్రంగా విస్తరించకుండానే, పాఠంలోని ధార్మిక ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువదించబడింది. ‘గైకొంటూ’ యోహాను రచనల ఆజ్ఞాపాలన పదజాలాన్ని కొంత అధికారిక గంభీరతతో నిలుపుతుంది.
