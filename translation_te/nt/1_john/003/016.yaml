id: 1JN.3.16
reference: 1 John 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: te
  text: 'దీనివల్ల మనం ప్రేమను తెలుసుకున్నాం[a]: ఆయన మన కోసం తన ప్రాణాన్ని అర్పించాడు; మనం కూడా సహోదరుల కోసం[b] మన ప్రాణాలను అర్పించాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇందులో’ లేదా ‘ఈ విధంగా.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా ‘సహోదరులు’; ఈ సందర్భంలో ఇది సహోదరీలతో సహా తోటి విశ్వాసులందరినీ సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: దీనివల్లనే
  rationale: ఈ పదబంధం ప్రేమను మనం ఏ ఆధారంగా లేదా ఏ విధంగా తెలుసుకున్నామో సూచిస్తుంది. ‘దీనివల్లనే’ అనేది ఆ వివరణాత్మక బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐγνώκαμεν
  choice: మనం తెలుసుకున్నాం
  rationale: పరిపూర్ణ కాలరూపం గతంలో కలిగిన అవగాహన ఇప్పటికీ నిలిచివున్నదనే భావాన్ని ఇస్తుంది. తెలుగు సందర్భంలో ‘తెలుసుకున్నాం’ ఈ ఫలితభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀγάπην
  choice: ప్రేమ అంటే ఏమిటో
  rationale: తెలుగులో ‘ప్రేమను తెలుసుకున్నాం’ కంటే ‘ప్రేమ అంటే ఏమిటో తెలుసుకున్నాం’ సహజంగా ఉండి, క్రీస్తు కార్యం ప్రేమ స్వరూపాన్ని వెల్లడించిందనే వాక్యభావాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐκεῖνος
  choice: ఆయన
  rationale: యోహాను రచనలో ఈ సర్వనామం ఇక్కడ యేసును గౌరవపూర్వకంగా సూచిస్తుంది. పేరు చేర్చకుండా గ్రీకు వాక్యంలోని సూచనాత్మకతను నిలుపుతుంది.
- source_word: ὑπὲρ ἡμῶν
  choice: మన కోసం
  rationale: ὑπέρ ఇక్కడ ఇతరుల మేలు కోసం లేదా వారి పక్షంగా చేసిన స్వీయార్పణను సూచిస్తుంది. ‘మన కోసం’ సహజంగా ఉండి, ప్రాయశ్చిత్తానికి సంబంధించిన ఒక నిర్దిష్ట సిద్ధాంతాన్ని అనవసరంగా చేర్చదు.
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: తన ప్రాణాన్ని అర్పించాడు
  rationale: ఈ యోహాను సంబంధమైన నుడికారం స్వచ్ఛందంగా ప్రాణం ఇవ్వడాన్ని సూచిస్తుంది. ‘ప్రాణాన్ని అర్పించాడు’ ఆధునిక తెలుగులో సహజంగా, గంభీరంగా ఉంది.
- source_word: ὀφείλομεν
  choice: మనం కూడా ... అర్పించాలి
  rationale: ఈ క్రియ నైతిక బాధ్యతను తెలియజేస్తుంది. ‘అర్పించాలి’ ఆ కర్తవ్యబలాన్ని సరళమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τῶν ἀδελφῶν
  choice: సహోదరుల కోసం
  rationale: గ్రీకులో ఇది పుంలింగ బహువచనం. ప్రధాన పాఠ్యంలో ఆ రూపాన్ని నిలిపి, సంఘసందర్భంలో విశ్వాసులందరినీ—సహోదరీలను కూడా—సూచించే సంభావ్య సమగ్ర భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: τὰς ψυχὰς θεῖναι
  choice: మన ప్రాణాలను అర్పించడం
  rationale: ముందున్న ψυχή/τίθημι నుడికారంతో పదసామ్యాన్ని కాపాడుతూ, ప్రతి విశ్వాసి స్వీయార్పణకు సిద్ధంగా ఉండాలనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐκεῖνος అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: సందర్భం ద్వారా యేసు క్రీస్తును సూచించే ‘ఆయన’
  alternative: వ్యక్తిని స్పష్టంగా గుర్తించని ‘ఆ వ్యక్తి’
  rationale: 1 యోహాను సందర్భం మరియు ‘ప్రాణాన్ని అర్పించడం’ అనే యోహాను నుడికారం యేసును సూచిస్తున్నాయి. అయితే మూలంలో లేని ‘యేసు’ అనే పేరును ప్రధాన పాఠ్యంలో చేర్చకుండా ‘ఆయన’ అని ఉంచడం గ్రీకు వ్యక్తీకరణను కాపాడుతుంది.
- issue: ἀδελφῶν పదం యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులు’; సమగ్ర సంఘార్థం పాదసూచికలో
  alternative: ప్రధాన పాఠ్యంలోనే ‘సహోదర సహోదరీలు’ లేదా ‘తోటి విశ్వాసులు’
  rationale: గ్రీకు రూపం పుంలింగ బహువచనమైనప్పటికీ, సంఘసందర్భంలో అది స్త్రీలతో సహా తోటి విశ్వాసులందరినీ సూచించే అవకాశం బలంగా ఉంది. రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని విస్తృత సందర్భార్థాన్ని పాదసూచికలో తెలియజేయడం రెండింటినీ కాపాడుతుంది.
- issue: ὑπὲρ ἡμῶν లోని స్వీయార్పణ భావం
  choice: ‘మన కోసం’ అని అనువదించి ప్రయోజనార్థక/ప్రతినిధిత్వానికి సమీపమైన భావాన్ని తెరిచి ఉంచడం
  alternative: ‘మన స్థానంలో’ అని స్పష్టంగా ప్రతిస్థాపనార్థాన్ని నిర్ణయించడం
  rationale: ὑπέρ ఇక్కడ క్రీస్తు మన పక్షంగా చేసిన స్వీయార్పణను తెలియజేస్తుంది; అయితే ఈ ఒక్క విభక్తి ప్రయోగమే ప్రాయశ్చిత్త విధానాన్ని పూర్తిగా నిర్వచించదు. అందువల్ల ‘మన కోసం’ మూలంలోని దైవశాస్త్రీయ బరువును, అలాగే దాని విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన శైలిని ఉపయోగించాం. మూలంలోని రెండు సమాంతర ‘ప్రాణాన్ని అర్పించడం’ ప్రయోగాలను ఒకే పదబంధంతో నిలిపాం. వివరణాత్మక ὅτι నిర్మాణాన్ని సహజంగా చూపేందుకు మొదటి వాక్యంలో ద్విబిందువు వాడాం; ‘అలాగే’ అనేది καί ద్వారా వచ్చే అనుసరణాత్మక నైతిక సంబంధాన్ని స్పష్టంగా చేస్తుంది.
