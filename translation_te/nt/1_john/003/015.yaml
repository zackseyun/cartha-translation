id: 1JN.3.15
reference: 1 John 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: te
  text: తన సోదరుణ్ణి[a] ద్వేషించే ప్రతి వ్యక్తి హంతకుడు; ఏ హంతకుడిలోనూ నిత్యజీవం నిలిచి ఉండదని[b] మీకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘సోదరుడు’ అనే పదం సందర్భంలో తోటి విశ్వాసిని సూచించే అవకాశం ఉంది; గ్రీకు పదం ఏకవచన పుంలింగంలో ఉంది.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘నివసిస్తూ ఉండదని.’ గ్రీకు μένω అనే క్రియ యోహాను రచనల్లో తరచుగా వచ్చే కీలక పదం; దీనికి ‘నిలిచి ఉండు,’ ‘నివసించు’ అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: ద్వేషించే ప్రతి వ్యక్తి
  rationale: నామవాచక స్వభావమున్న వర్తమాన కృదంతం ఒక సాధారణ వర్గాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం నిరంతరంగా లేదా వ్యక్తిత్వ లక్షణంగా ఉండే ద్వేష భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: తన సోదరుణ్ణి
  rationale: గ్రీకు పదబంధం ఏకవచన పుంలింగంలో ఉంది. ‘తన’ అనే రూపం ద్వేషించేవానికే ఆ సోదరునితో సంబంధం ఉందని తెలుగులో స్పష్టంగా, సహజంగా చూపుతుంది; సందర్భంలోని తోటి విశ్వాసి భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀνθρωποκτόνος
  choice: హంతకుడు
  rationale: మనిషిని చంపేవాడనే బలమైన నైతిక భావానికి ఆధునిక తెలుగులో సహజమైన సమానార్థకం ‘హంతకుడు’; కృత్రిమంగా వినిపించే పదశః రూపాన్ని నివారిస్తుంది.
- source_word: οἴδατε
  choice: మీకు తెలుసు
  rationale: ద్వితీయ పురుష బహువచనాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: ఏ హంతకుడిలోనూ … ఉండదు
  rationale: గ్రీకులోని సార్వత్రిక నిరాకరణను తెలుగులో సహజమైన ‘ఏ … లోనూ … ఉండదు’ నిర్మాణంతో వ్యక్తపరుస్తుంది; ప్రతి హంతకుని గురించీ చెప్పబడుతున్న నిరాకరణను నిలుపుతుంది.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవం
  rationale: యోహాను రచనల్లో స్థిరంగా వినిపించే భావాన్ని, దాని కాలవ్యాప్తి మరియు theological గుణార్థం రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐν αὐτῷ μένουσαν
  choice: అతనిలో నిలిచి ఉండడం
  rationale: μένω అనే యోహాను రచనలకు కీలకమైన క్రియలోని కొనసాగింపు భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ‘నివసించడం’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: ‘సోదరుడు’ అనే పదం పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘తన సోదరుణ్ణి’ అని ఉంచి, తోటి విశ్వాసి అనే సందర్భార్థాన్ని పాదసూచికలో సూచించడం.
  alternative: తోటి విశ్వాసిని; సోదరుణ్ణి లేదా సోదరిని
  rationale: సమీప సందర్భం విశ్వాస సమాజంలోని పరస్పర ప్రేమను గురించి మాట్లాడుతున్నా, గ్రీకు పదం ఏకవచన పుంలింగంలో ఉంది. అందువల్ల మూలరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సంభావ్య సందర్భార్థాన్ని వివరణలో ఇచ్చాం.
- issue: యోహాను రచనల్లో μένω పదం
  choice: ‘నిలిచి ఉండడం’ అని అనువదించడం.
  alternative: నివసిస్తూ ఉండడం
  rationale: ఈ రూపం జీవం ఆ వ్యక్తిలో కొనసాగి ఉండే భావాన్ని స్పష్టంగా తెలుపుతుంది; అయితే యోహాను రచనల్లోని ‘నివసించు/నిలిచి ఉండు’ భావసంబంధాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో కాపాడాం.
- issue: నిత్యజీవం మరియు హంతకుని గురించిన వాక్య బలం
  choice: ‘ఏ హంతకుడిలోనూ నిత్యజీవం నిలిచి ఉండదు’ అనే సార్వత్రిక నిరాకరణ.
  alternative: ప్రతి హంతకుడిలో నిత్యజీవం నిలిచి ఉండదు
  rationale: మూలంలోని πᾶς … οὐκ నిర్మాణం ప్రతి హంతకునికీ వర్తించే నిరాకరణను తెలుపుతుంది. తెలుగు వాక్యం దానిని సహజంగా వ్యక్తపరుస్తుంది; ఆ స్థితి శాశ్వతంగా మారదనే అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘నరహంతకుడు’ కంటే సాధారణమైన ‘హంతకుడు’ను ఎంచుకున్నాం. మూలంలోని రెండు సమన్విత వాక్యభాగాలను తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా ఇచ్చాం; భావసంబంధం మారలేదు.
