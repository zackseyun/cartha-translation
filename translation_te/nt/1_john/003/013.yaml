id: 1JN.3.13
reference: 1 John 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀μὴ θαυμάζετε, ⸀ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: te
  text: సోదరులారా,[a] లోకం మిమ్మల్ని ద్వేషిస్తే ఆశ్చర్యపడకండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సోదరులారా” అనేది గ్రీకులోని పుంలింగ బహువచన రూపానికి అనువాదం; ఇక్కడ ఇది స్త్రీలతో సహా విశ్వాసుల సమాజమంతటినీ ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: ఆశ్చర్యపడకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థక రూపం నిషేధాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో ఈ సందర్భానికి ‘ఆశ్చర్యపడకండి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: ఇది ἀδελφός పదానికి పుంలింగ బహువచన సంబోధన రూపం. మూలంలోని రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, ఇది స్త్రీలతో సహా విశ్వాసుల సమాజమంతటినీ ఉద్దేశించి ఉండవచ్చని పాదటిప్పణిలో వివరించాం.
- source_word: εἰ
  choice: ద్వేషిస్తే
  rationale: గ్రీకు εἰ తెలిపే షరతును తెలుగు సహజమైన ‘-తే’ షరతార్థక రూపంతో వ్యక్తం చేశాం; దానిని ‘ద్వేషించినప్పుడు’ అని మార్చి నిశ్చితార్థాన్ని అధికంగా చేర్చలేదు.
- source_word: μισεῖ
  choice: ద్వేషిస్తే
  rationale: వర్తమాన క్రియ యొక్క సాధారణ, కొనసాగుతున్న వాస్తవ భావాన్ని ‘ద్వేషించు’ సహజంగా అందిస్తుంది; εἰతో కలిపి తెలుగులో ‘ద్వేషిస్తే’ అయింది.
- source_word: ὁ κόσμος
  choice: లోకం
  rationale: యోహాను రచనల్లో ఈ పదం దేవునికి విరోధంగా ఉన్న మానవ లోకాన్ని సూచించగలదు. అయినా వ్యాఖ్యానాత్మక విస్తరణ లేకుండా దాని విస్తృతమైన వేదాంతార్థాన్ని నిలిపేందుకు ‘లోకం’ అని అనువదించాం.
theological_decisions:
- issue: ἀδελφοίలో ప్రతినిధి పుంలింగ సంబోధన
  choice: ప్రధాన పాఠ్యంలో ‘సోదరులారా’ అని ఉంచడం
  alternative: ‘సోదర సోదరీమణులారా’ లేదా ‘తోటి విశ్వాసులారా’
  rationale: మూలంలోని వ్యాకరణ పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. ఈ సంబోధన విశ్వాస సమాజంలోని స్త్రీలను కూడా కలుపుకొని ఉండవచ్చనే విషయాన్ని పాదటిప్పణిలో తెలిపాం.
- issue: κόσμος పదానికి యోహాను రచనల్లోని వేదాంతార్థం
  choice: వ్యాఖ్యానాత్మక విస్తరణ లేకుండా ‘లోకం’
  alternative: ‘దేవునికి విరోధమైన సమాజం’ లేదా ‘లోక వ్యవస్థ’
  rationale: κόσμος దేవునికి విరోధంగా ఉన్న మానవ వ్యవస్థను సూచించగలిగినా, ప్రధాన పాఠ్యంలో దానిని విస్తరించడం మూలంలోని భావవ్యాప్తిని సంకుచితం చేస్తుంది. అందువల్ల సందర్భమే దాని పూర్తి భావాన్ని తెలియజేసేలా ‘లోకం’ అని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంబోధనను వాడాం. గ్రీకు వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, తెలుగు సహజ క్రమంలో షరతార్థక ఉపవాక్యాన్ని ముందుంచాం; మూలంలోని సంక్షిప్తతను నిలిపాం.
