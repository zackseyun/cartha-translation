source:
  edition: SBLGNT
  text: ἡμεῖς οἴδαμεν ὅτι μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν, ὅτι ἀγαπῶμεν τοὺς ἀδελφούς· ὁ μὴ ⸀ἀγαπῶν μένει ἐν τῷ θανάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: te
  text: మనం మరణం నుండి జీవంలోకి దాటిపోయామని మనకు తెలుసు, ఎందుకంటే మనం సోదరులను[a] ప్రేమిస్తున్నాం. ప్రేమించనివాడు మరణంలో ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సోదర సోదరీమణులను’; గ్రీకులో ‘సోదరులను’ అని ఉంది. ఈ సందర్భంలో అది సాధారణంగా తోటి విశ్వాసులందరినీ సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: మనకు తెలుసు
  rationale: οἶδα రూపం పరిపూర్ణ కాలంలో ఉన్నప్పటికీ, కొయినే గ్రీకులో వర్తమాన స్థితిని సూచిస్తుంది. అందువల్ల ఆధునిక తెలుగులో సహజమైన ‘మనకు తెలుసు’ అని అనువదించాం.
- source_word: μεταβεβήκαμεν
  choice: దాటిపోయామని
  rationale: పరిపూర్ణ కాలరూపం పూర్తయిన మార్పునూ దాని కొనసాగుతున్న ఫలితాన్నీ సూచిస్తుంది. ‘దాటిపోయాం’ గమన రూపకాన్ని నిలుపుతుంది.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: మరణం నుండి జీవంలోకి
  rationale: ἐκ...εἰς అనే జత ఒక స్థితి నుండి బయటకు వచ్చి మరొక స్థితిలోకి ప్రవేశించడాన్ని సూచిస్తుంది; ‘జీవంలోకి’ ఆ దిశను స్పష్టంగా నిలుపుతుంది.
- source_word: ἀγαπῶμεν
  choice: ప్రేమిస్తున్నాం
  rationale: వర్తమాన కాలం కొనసాగుతున్న, లక్షణాత్మకమైన ప్రేమను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ప్రేమిస్తున్నాం’ ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς ἀδελφούς
  choice: సోదరులను
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం. ప్రధాన పాఠంలో ఆ రూపాన్ని నిలిపి, సందర్భంలో స్త్రీపురుష విశ్వాసులందరూ ఉద్దేశించబడి ఉండవచ్చని పాదటిప్పణిలో తెలిపాం.
- source_word: ὁ μὴ ἀγαπῶν
  choice: ప్రేమించనివాడు
  rationale: నిర్దేశకంతో కూడిన వర్తమాన కృదంతం ఒక సాధారణ లక్షణం గల వ్యక్తిని సూచిస్తుంది. ‘ప్రేమించనివాడు’ సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: μένει
  choice: ఉంటాడు
  rationale: ఇక్కడ μένω కొనసాగుతున్న స్థితిని సూచిస్తుంది. ‘మరణంలోనే ఉంటాడు’ అనే ప్రయోగం ఆధునిక పాఠకులకు సహజంగా ఉండి, ఆ స్థిరత్వాన్ని తెలియజేస్తుంది.
- source_word: ἐν τῷ θανάτῳ
  choice: మరణంలోనే
  rationale: ఈ పదబంధం మరణం అనే పరిధిలో కొనసాగడాన్ని రూపకంగా సూచిస్తుంది. ‘మరణంలోనే’ అనవసరమైన వ్యాఖ్యాన విస్తరణ లేకుండా ఆ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἀδελφοί పదం సూచించే వర్గం మరియు లింగ భావం
  choice: ప్రధాన పాఠంలో ‘సోదరులను’ అని ఉంచి, సందర్భానుసారమైన సమావేషక భావాన్ని పాదటిప్పణిలో తెలిపాం.
  alternative: సోదర సోదరీమణులను
  rationale: గ్రీకు రూపం పుంలింగ బహువచనం; అయితే 1 యోహాను సందర్భంలో ఇది తోటి విశ్వాసుల సమాజాన్ని, స్త్రీలను కూడా, సూచించే అవకాశం ఉంది. మూలరూపాన్ని చెరపకుండా సందర్భార్థాన్ని పాదటిప్పణి కాపాడుతుంది.
- issue: ‘మరణం’ మరియు ‘జీవం’ స్వభావం
  choice: ‘మరణం’, ‘జీవం’ అనే సంక్షిప్త రూపకాలనే వ్యాఖ్యాన విస్తరణ లేకుండా నిలిపాం.
  alternative: ఆత్మీయ మరణం మరియు నిత్యజీవం
  rationale: వాక్యం లోతైన ఆధ్యాత్మిక మార్పును సూచించినప్పటికీ, గ్రీకు పాఠం దానిని మరింత నిర్దిష్టంగా నిర్వచించదు. కాబట్టి దాని ఉద్దేశపూర్వక సంక్షిప్తతను, theological tension ను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన సరళ శైలిని ఉపయోగించాం. రచయిత తన పాఠకులతో కలిసి మాట్లాడుతున్నందున సమావేషక ప్రథమ పురుష బహువచనమైన ‘మనం/మనకు’ వాడాం. పాదటిప్పణి గుర్తు దాని అసలు సంబంధమైన ‘సోదరులను’ పదం వద్ద ఉంచాం.
