source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: te
  text: దేవుని నుండి జన్మించిన ప్రతి ఒక్కరూ పాపం చేస్తూ ఉండరు[a]. ఎందుకంటే ఆయన విత్తనం వారిలో నిలిచి ఉంటుంది[b]. వారు పాపం చేస్తూనే ఉండలేరు[c], ఎందుకంటే వారు దేవుని నుండి జన్మించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “పాపం చేయరు.” గ్రీకు పదప్రయోగం ఒక్క కార్యంకన్నా కొనసాగుతున్న పాపాచరణను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారిలో నివసిస్తూ ఉంటుంది.”
    reason: lexical_alternative
  - marker: c
    text: మరింత అక్షరార్థంగా, “వారు పాపం చేయలేరు.” సందర్భంలో గ్రీకు వర్తమాన infinitiveకు “పాపం చేస్తూనే ఉండలేరు” అనే కొనసాగింపు భావం ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος
  choice: జన్మించిన ప్రతి ఒక్కరూ
  rationale: πᾶς‌తో కూడిన substantival perfect participle ఒక సాధారణ వర్గంలోని ప్రతి వ్యక్తినీ సూచిస్తుంది. ‘ప్రతి ఒక్కరూ’ సార్వత్రిక భావాన్ని, ‘జన్మించిన’ పూర్తయిన కార్యం వల్ల ఏర్పడిన స్థితిని తెలియజేస్తాయి.
- source_word: ἐκ τοῦ θεοῦ
  choice: దేవుని నుండి
  rationale: ఇక్కడ ἐκ మూలాన్ని లేదా ఉద్భవాన్ని సూచిస్తుంది. ‘దేవుని నుండి’ అనే రూపం యోహాను రచనల్లోని నూతన జన్మ భావాన్ని అర్థవంతంగా ఉంచుతుంది.
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: పాపం చేస్తూ ఉండరు
  rationale: ποιεῖ వర్తమాన కాలంలో ఉండటం, తరువాతి ἁμαρτάνειν‌తో కలసి, ఒక్క పాపకార్యంకన్నా కొనసాగుతున్న లేదా లక్షణంగా మారిన పాపాచరణను సూచించే అవకాశం ఉంది. ‘చేస్తూ ఉండరు’ ఆ కొనసాగింపు భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: σπέρμα αὐτοῦ
  choice: ఆయన విత్తనం
  rationale: σπέρμα అక్షరార్థంగా ‘విత్తనం.’ అది దేవుని వాక్యమా, జీవమా, స్వభావమా అనే విషయాన్ని వచనం స్పష్టంగా చెప్పదు; అందువల్ల రూపకాన్ని వ్యాఖ్యానించకుండా అలాగే ఉంచాం.
- source_word: ἐν αὐτῷ μένει
  choice: వారిలో నిలిచి ఉంటుంది
  rationale: μένω నిలిచి ఉండటం లేదా కొనసాగి ఉండటం అనే భావాన్ని ఇస్తుంది. ‘నిలిచి ఉంటుంది’ ఆధునిక తెలుగులో సహజంగా ఉండి దాని కొనసాగింపు భావాన్ని కాపాడుతుంది. గ్రీకు ఏకవచన సర్వనామాన్ని తెలుగులో ‘ప్రతి ఒక్కరూ’తో సహజంగా సరిపడే గౌరవ/సామాన్య బహువచన రూపంలో ఇచ్చాం.
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: పాపం చేస్తూనే ఉండలేరు
  rationale: వర్తమాన infinitive ἁμαρτάνειν సందర్భంలో కొనసాగుతున్న పాపాచరణను సూచించే అవకాశం ఉంది. ‘చేస్తూనే ఉండలేరు’ ఆ భావాన్ని అందిస్తూ, ఒక్క పాపకార్యమూ చేయలేరని అవసరానికి మించి నిర్ధారించదు.
- source_word: γεγέννηται
  choice: జన్మించారు
  rationale: Perfect tense గతంలో జరిగిన జన్మ వల్ల ప్రస్తుతం కొనసాగుతున్న స్థితిని సూచిస్తుంది. తెలుగు సందర్భంలో ‘జన్మించారు’ సహజంగా ఆ పూర్తయిన కార్యాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ వచనం సంపూర్ణ పాపరాహిత్యాన్ని బోధిస్తుందా, లేక నూతన జన్మకు కొనసాగుతున్న పాపాచరణ సరిపడదని చెబుతుందా?
  choice: ప్రధాన పాఠ్యంలో కొనసాగుతున్న పాపాచరణను నిరాకరించే భావాన్ని ఇచ్చాం.
  alternative: ఏ ఒక్క పాపాన్నీ చేయడం పూర్తిగా అసాధ్యం.
  rationale: ποιεῖ, ἁμαρτάνειν అనే వర్తమాన రూపాలు, ముఖ్యంగా 1 యోహాను 1:8–2:1 సందర్భంలో, కొనసాగుతున్న లేదా అలవాటైన కార్యాన్ని సూచించగలవు. అయినప్పటికీ గ్రీకు పదబంధంలోని మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచి వచనంలోని ఉద్వేగాన్ని కాపాడాం.
- issue: ‘ఆయన విత్తనం’ దేనిని సూచిస్తుంది?
  choice: నిర్దిష్ట వ్యాఖ్యానం చేయకుండా ‘ఆయన విత్తనం’ అనే రూపకాన్నే ఉంచాం.
  alternative: దేవుని వాక్యం; దేవుని జీవం; దేవుని స్వభావం.
  rationale: σπέρμα దేనిని సూచిస్తుందో వచనం స్వయంగా నిర్దిష్టంగా చెప్పదు. అందువల్ల ఏ ప్రత్యేక సిద్ధాంతపరమైన అర్థాన్నీ ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలిని వాడాం. ‘ప్రతి ఒక్కరూ’తో సహజంగా సరిపడేందుకు తరువాతి సూచనల్లో ‘వారు/వారిలో’ రూపాలను ఉపయోగించాం. మూలంలోని ‘విత్తనం’ రూపకాన్ని వ్యాఖ్యానించకుండా నిలిపాం.
