id: 1JN.3.12
reference: 1 John 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: te
  text: కయీను వలె ఉండకూడదు. అతడు దుష్టుని నుండి వచ్చినవాడు[a]; తన సోదరుణ్ణి వధించాడు[b]. అతడు తన సోదరుణ్ణి ఎందుకు వధించాడు? తన క్రియలు చెడ్డవి, తన సోదరుని క్రియలు నీతిమంతమైనవి కాబట్టే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెడు నుండి వచ్చినవాడు.” ఈ గ్రీకు ప్రయోగాన్ని భావవాచకంగా అర్థం చేసుకోవచ్చు; అయితే యోహాను రచనల్లో ఇది సాధారణంగా వ్యక్తిగతమైన దుష్టుణ్ణి సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “హత్య చేశాడు.” గ్రీకు క్రియ సాధారణంగా ‘చంపాడు’ అనేదానికంటే మరింత బలమైనది; బలి జంతువును వధించడానికి కూడా వాడే పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ καθὼς Κάϊν
  choice: కయీనులా ఉండకూడదు
  rationale: ముందున్న ప్రేమించాలనే ప్రబోధంతో ఈ ప్రతికూల పోలికను సహజమైన తెలుగులో కలుపుతుంది. గ్రీకులోని సంక్షిప్త నిర్మాణాన్ని అర్థస్పష్టత కోసం క్రియతో వ్యక్తం చేసింది.
- source_word: ἐκ τοῦ πονηροῦ
  choice: దుష్టుని నుండి వచ్చినవాడు
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవ భావాన్ని నిలుపుతూ, యోహాను రచనల్లో సాధారణంగా వ్యక్తిగతమైన ‘దుష్టుడు’ అనే సూచనను ప్రధాన పాఠ్యంలో ఉంచుతుంది.
- source_word: ἔσφαξεν
  choice: వధించాడు
  rationale: సాధారణంగా ‘చంపాడు’ అనేదానికంటే బలమైన, హింసాత్మక భావాన్ని ఇస్తుంది; అయితే మూలంలో లేని నిర్దిష్టమైన చంపే విధానాన్ని చేర్చదు.
- source_word: ἀδελφὸν αὐτοῦ
  choice: తన సోదరుణ్ణి
  rationale: కయీను తన సొంత సోదరునిపై చేసిన హింసను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: χάριν τίνος
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే గ్రీకు ప్రయోగానికి సరళమైన, సహజమైన తెలుగు సమానం.
- source_word: τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: తన క్రియలు చెడ్డవిగా ఉన్నాయి
  rationale: ἔργα యొక్క నైతిక కార్యాల భావాన్ని ‘క్రియలు’ తెలియజేస్తుంది; πονηράను వ్యక్తిగత దుష్టునితో గందరగోళం లేకుండా గుణవాచకంగా ‘చెడ్డవి’ అని అందిస్తుంది.
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: తన సోదరుని క్రియలు నీతిమంతమైనవిగా ఉన్నాయి
  rationale: తెలుగులో స్పష్టత కోసం గ్రీకులో అధ్యాహారంగా ఉన్న ‘క్రియలు’ను పునరుక్తి చేస్తూ, δίκαια యొక్క నైతిక న్యాయత్వాన్ని ‘నీతిమంతమైనవి’గా నిలుపుతుంది.
theological_decisions:
- issue: τοῦ πονηροῦ అనేది వ్యక్తిగతమైన ‘దుష్టుడు’నా, లేక భావవాచకమైన ‘దుష్టత్వం’నా?
  choice: వ్యక్తిగతమైన ‘దుష్టుడు’
  alternative: ‘దుష్టత్వం’ లేదా ‘చెడు’
  rationale: నిర్దేశక విశేషణంతో ఉన్న ఈ ప్రయోగం యోహాను రచనల్లో సాధారణంగా వ్యక్తిగతమైన దుష్టుణ్ణి సూచిస్తుంది. అయినప్పటికీ భావవాచక పఠనానికి ఉన్న నిజమైన అవకాశాన్ని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘వధించాడు’ మూలపదంలోని తీవ్రతను నిలుపుతుంది; ‘నరికి చంపాడు’ వంటి పదబంధం మూలంలో లేని విధానాన్ని సూచించే ప్రమాదం వల్ల నివారించబడింది. ‘క్రియలు’ అనే పదం నైతిక కార్యాలను సాధారణ పాఠకునికి అర్థమయ్యే రీతిలో అందిస్తుంది.
