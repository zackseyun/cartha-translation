source:
  edition: SBLGNT
  text: καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: te
  text: 'ఆయన ఆజ్ఞలను పాటించేవాడు ఆయనలో నిలిచి ఉంటాడు[a]; ఆయన కూడా అతనిలో నిలిచి ఉంటాడు. ఆయన మనలో నిలిచి ఉంటాడని దీనివల్ల తెలుసుకుంటాం: ఆయన మనకు ఇచ్చిన ఆత్మవల్ల[b].


    [a] “నిలిచి ఉంటాడు” అనే మాటకు “నివసిస్తాడు” అని కూడా అనువదించవచ్చు. ఇక్కడ వాడిన గ్రీకు క్రియ సంబంధంలో నిరంతరం కొనసాగడాన్ని సూచిస్తుంది.


    [b] “ఆత్మ నుండి” అని కూడా అనువదించవచ్చు. గ్రీకు ఉపసర్గ మూలాన్ని లేదా సాధనాన్ని సూచించగలదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నిలిచి ఉంటాడు” అనే మాటకు “నివసిస్తాడు” అని కూడా అనువదించవచ్చు. ఇక్కడ వాడిన గ్రీకు క్రియ సంబంధంలో నిరంతరం కొనసాగడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “ఆత్మ నుండి” అని కూడా అనువదించవచ్చు. గ్రీకు ఉపసర్గ మూలాన్ని లేదా సాధనాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: పాటించేవాడు
  rationale: ఆజ్ఞలను విధేయతతో ఆచరించడం, నమ్మకంగా గైకొనడం అనే భావాలను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐντολάς
  choice: ఆజ్ఞలను
  rationale: యోహాను రచనల్లోని నైతిక, నిబంధనాత్మక బలాన్ని కాపాడే సాధారణ తెలుగు పదం.
- source_word: μένει
  choice: నిలిచి ఉంటాడు
  rationale: ఈ వచనంలో మూడుసార్లు వచ్చే యోహాను రచనలకు ముఖ్యమైన క్రియను ఒకే విధంగా అనువదిస్తూ, సంబంధంలో నిరంతరం కొనసాగడం అనే భావాన్ని అందిస్తుంది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: మూలంలోని సర్వనామాన్ని నిలుపుతుంది; ముందున్న సందర్భం దాని సూచ్యాన్ని తెలియజేస్తుంది.
- source_word: ἐν τούτῳ
  choice: ఈ విధంగా
  rationale: తరువాత చెప్పబడే ఆత్మ ద్వారా కలిగే జ్ఞానాన్ని ముందుగా సూచించే సహజమైన తెలుగు నిర్మాణం.
- source_word: γινώσκομεν
  choice: తెలుసుకుంటాం
  rationale: ప్రస్తుత అవగాహన లేదా గుర్తింపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκ τοῦ πνεύματος
  choice: ఆత్మ ద్వారా
  rationale: ఇక్కడ ἐκ సూచించే ఆధారం లేదా సాధనం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; ‘ఆత్మ నుండి’ అనే మూలార్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: ఆయన మనకు ఇచ్చిన
  rationale: దేవుడు ఇచ్చిన ఆత్మను సూచించే సంబంధ వాక్యాన్ని, గ్రీకు భూతకాల క్రియను అదనపు కాలభావం చేర్చకుండా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: αὐτῷ / αὐτός / μένει ἐν ἡμῖν అనే సర్వనామాల సూచ్యం
  choice: దైవ సూచ్యానికి ‘ఆయన’ అనే సర్వనామాన్ని ఉంచి, ఆజ్ఞలను పాటించే వ్యక్తిని ‘అతను’తో సూచించడం
  alternative: సర్వనామాల స్థానంలో నేరుగా ‘దేవుడు’ లేదా ‘క్రీస్తు’ అని పెట్టడం
  rationale: గ్రీకు పాఠంలోని సర్వనామ రూపాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, వెంటనే ముందున్న సందర్భం సూచ్యాన్ని నిర్ణయించనివ్వడం ద్వారా క్రీస్తు సంబంధమైన అంతర్నివాస భావాన్ని అనవసరంగా సంకుచితం చేయదు.
- issue: πνεῦμα యొక్క సూచ్యం
  choice: దేవుడు ఇచ్చిన పరిశుద్ధాత్మను సూచించే ‘ఆత్మ’
  alternative: మానవ ఆత్మ లేదా సాధారణ ఆధ్యాత్మిక శక్తి
  rationale: ‘ఆయన మనకు ఇచ్చిన’ అనే వాక్యభాగం మరియు యోహాను సందర్భం దీనిని దేవుని ఆత్మగా సూచిస్తాయి; తెలుగు లిపిలో పెద్ద అక్షర భేదం లేకపోవడంతో సందర్భమే ఈ గుర్తింపును మోస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గౌరవప్రదమైన వాక్యశైలి పాటించబడింది. కీలకమైన μένω క్రియను మూడు చోట్లా ‘నిలిచి ఉంటాడు’గా ఏకరీతిగా ఉంచి యోహాను పదప్రయోగాన్ని కాపాడింది.
