id: 1JN.2.15
reference: 1 John 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: te
  text: లోకాన్ని గానీ, లోకంలో ఉన్నవాటిని గానీ ప్రేమించకండి.[a] ఎవరైనా లోకాన్ని ప్రేమిస్తే, తండ్రి ప్రేమ[b] అతనిలో[c] లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “లోకాన్ని ప్రేమించకండి; లోకంలో ఉన్నవాటిని కూడా ప్రేమించకండి.”'
    reason: lexical_alternative
  - marker: b
    text: “తండ్రి ప్రేమ” అంటే ఇక్కడ బహుశా “తండ్రిపట్ల ప్రేమ”; “తండ్రి చూపే ప్రేమ” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: c
    text: గ్రీకులో “అతనిలో” అని పుంలింగ ఏకవచనం ఉంది; ఇక్కడ అది ఎవరినైనా సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε
  choice: ప్రేమించకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞారూపం కొనసాగుతున్న క్రియను ఆపమనే భావాన్నీ, సాధారణ నిషేధాన్నీ సూచించగలదు. సందర్భం నిర్ణయించని క్రియాంశాన్ని అతిగా వివరించకుండా సాధారణ నిషేధంగా అనువదించబడింది.
- source_word: κόσμον
  choice: లోకాన్ని
  rationale: κόσμος అనే విస్తృత పదాన్ని వ్యాఖ్యానాత్మకంగా ‘లోక వ్యవస్థ’ అని కుదించకుండా, యోహాను సందర్భమే దాని దేవునికి విరోధమైన నైతిక భావాన్ని తెలియజేసేలా ‘లోకం’గా ఉంచబడింది.
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: లోకంలో ఉన్నవాటిని గానీ
  rationale: మొదటి నిషేధంతో సహజంగా జతకట్టే ‘గానీ … గానీ’ నిర్మాణం గ్రీకు μηδέ యొక్క ‘అలాగే కాదు/కూడా కాదు’ భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: ἐάν τις ἀγαπᾷ
  choice: ఎవరైనా … ప్రేమిస్తే
  rationale: అనిర్దిష్టమైన τιςను, షరతుతో కూడిన వాక్య నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: తండ్రి ప్రేమ
  rationale: గ్రీకు సంబంధ విభక్తి తండ్రిపట్ల ప్రేమనో తండ్రి ప్రేమనో సూచించగలదు. ‘తండ్రి ప్రేమ’ మూలంలోని సంక్షిప్తతను నిలుపుతూ ఆ సంబంధాన్ని ప్రధాన పాఠంలో పూర్తిగా పరిష్కరించదు; వివరణ పాదసూచికలో ఇవ్వబడింది.
- source_word: ἐν αὐτῷ
  choice: అతనిలో
  rationale: గ్రీకులోని పుంలింగ ఏకవచన రూపాన్ని నిలుపుతుంది; ఇది ఇక్కడ సాధారణంగా ఏ వ్యక్తినైనా సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: యోహాను నైతిక బోధలో ‘లోకం’ అనే పదం అర్థం
  choice: ప్రధాన పాఠంలో ‘లోకం’ అని అనువదించి, సందర్భమే దాని నైతిక భావాన్ని నిర్దేశించేలా ఉంచడం
  alternative: దేవునికి విరోధమైన లోక వ్యవస్థ; లోకరీతి
  rationale: ఈ హెచ్చరిక దేవుని సృష్టినిగానీ మనుషులనుగానీ ప్రేమించవద్దని చెప్పడం కాదు; దేవునికి విరోధమైన ఆశలు, విధేయతలతో కూడిన క్రమాన్ని ఉద్దేశిస్తుంది. అయితే వ్యాఖ్యానాన్ని నేరుగా పాఠంలో చేర్చకుండా మూలపదపు విస్తృతతను కాపాడాలి.
- issue: ἡ ἀγάπη τοῦ πατρὸςలోని సంబంధ విభక్తి
  choice: ‘తండ్రి ప్రేమ’ అని ఉంచి, సాధ్యమైన రెండు సంబంధాలను పాదసూచికలో తెలపడం
  alternative: తండ్రిపట్ల ప్రేమ; తండ్రి చూపే ప్రేమ
  rationale: సమీప సందర్భంలో లోకాన్ని ప్రేమించడానికి విరుద్ధంగా ఉండడం వల్ల ‘తండ్రిపట్ల ప్రేమ’ అనే అర్థం బలంగా ఉంది. అయినా గ్రీకు నిర్మాణం ‘తండ్రి చూపే ప్రేమ’ అనే అర్థాన్నీ వ్యాకరణపరంగా అనుమతిస్తుంది; అందువల్ల ప్రధాన పాఠంలో ఆ ఉద్రిక్తతను బలవంతంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే బహువచన ఆజ్ఞారూపం వాడబడింది. ‘లోకం’ వంటి స్థిరమైన బైబిలు పదాన్ని నిలుపుతూ, అస్పష్టత ఉన్న చోట వ్యాఖ్యానాన్ని ప్రధాన పాఠంలోకి చొప్పించకుండా పాదసూచికల్లో వివరించబడింది.
