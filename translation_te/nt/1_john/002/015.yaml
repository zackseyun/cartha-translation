  source_fidelity: 'The translation closely represents the Greek prohibition: it retains both ‘the world’ and ‘the things in the world,’ and accurately renders the generic conditional and the concluding negation. ‘తండ్రి ప్రేమ’ appropriately preserves the genitival breadth of ἡ ἀγάπη τοῦ πατρὸς rather than deciding the disputed direction of love in the main text.'
