id: 1JN.2.21
reference: 1 John 2:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: te
  text: మీకు సత్యం తెలియదని కాదు, అది మీకు తెలుసని, అలాగే ఏ అబద్ధమూ సత్యం నుండి వచ్చేది కాదని నేను మీకు రాశాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψα
  choice: నేను మీకు రాసింది
  rationale: గ్రీకు ఏఒరిస్ట్‌ను సహజమైన తెలుగు భూతకాలంతో వ్యక్తం చేశాం. ఈ నిర్మాణం ఉత్తరంలో రచయిత చెప్పే ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తూ, ‘రాయలేదు’ అనే అపార్థకరమైన సంపూర్ణ నిరాకరణను నివారిస్తుంది.
- source_word: οἴδατε
  choice: ఎరుగుతున్నారని
  rationale: οἶδα అంటే ‘తెలుసుకొని ఉండడం/ఎరుగడం.’ ముందున్న నిరాకరణతో స్పష్టమైన వ్యత్యాసం నిలిచేలా అదే క్రియను రెండు సందర్భాల్లో ఉంచాం.
- source_word: τὴν ἀλήθειαν
  choice: సత్యాన్ని
  rationale: నిర్దిష్ట ఆర్టికల్‌తో ఉన్న పదాన్ని యోహాను రచనల విస్తృత భావాన్ని కుదించకుండా ‘సత్యం’గా అనువదించాం.
- source_word: πᾶν ψεῦδος
  choice: ఏ అబద్ధమూ
  rationale: పదశః ‘ప్రతి అబద్ధం ... కాదు’ అనే గ్రీకు సార్వత్రిక నిరాకరణను సహజమైన తెలుగులో ‘ఏ అబద్ధమూ ... కాదు’గా వ్యక్తం చేశాం.
- source_word: ἐκ τῆς ἀληθείας οὐκ ἔστιν
  choice: సత్యం నుండి వచ్చేది కాదు
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవ భావాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది; అబద్ధానికి సత్యం మూలం కాదనే వాక్యబలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యోహాను వాడుకలో ‘సత్యం’ స్వభావం
  choice: సత్యం
  alternative: సత్యసందేశం; సువార్త సత్యం
  rationale: ఈ సందర్భం ‘సత్యం’కు లోతైన ధార్మిక భావాన్ని కలిగించవచ్చు, కానీ వాక్యం దానిని ఒక నిర్దిష్ట సిద్ధాంతపరమైన పదబంధంగా పరిమితం చేయదు. అందువల్ల మూలంలోని విస్తృతతను నిలిపాం.
- issue: అబద్ధానికి సత్యంతో ఉన్న సంబంధం
  choice: ఏ అబద్ధమూ సత్యం నుండి వచ్చేది కాదు
  alternative: ఏ అబద్ధమూ సత్యానికి చెందినది కాదు
  rationale: ἐκ ప్రధానంగా మూలం లేదా ఉద్భవాన్ని సూచిస్తుంది. ఎంపిక చేసిన రూపం ఆ సంబంధాన్ని అదనపు తాత్త్విక వివరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘ఎరుగుట’ సాధారణ ‘తెలుసుకోవడం’ కంటే కొద్దిగా గ్రంథోచితమైనదైనా విస్తృతంగా అర్థమయ్యే పదం; రెండు విరుద్ధ భాగాల్లో ఒకే పదాన్ని వాడి గ్రీకు వ్యత్యాసాన్ని నిలిపాం.
