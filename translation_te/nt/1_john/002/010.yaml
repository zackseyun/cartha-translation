id: 1JN.2.10
reference: 1 John 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῷ φωτὶ μένει, καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: te
  text: తన సహోదరుణ్ణి ప్రేమించే వ్యక్తి వెలుగులో నిలిచి ఉంటాడు; అతనిలో తొట్రుపడేలా చేసేది ఏదీ లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి తొట్రుపడే అడ్డంకి ఏదీ లేదు.” గ్రీకు పదబంధం అతనిలో లేనిదాన్ని సూచిస్తున్నదా, లేక అతనికి ఎదురుకాని అడ్డంకిని సూచిస్తున్నదా అనే రెండు విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: ప్రేమించే వ్యక్తి
  rationale: వర్తమానకాల ఆర్టిక్యులర్ పార్టిసిపుల్‌ను వ్యక్తిని సూచించే సాధారణ, కొనసాగుతున్న లక్షణంగా సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: తన సహోదరుణ్ణి
  rationale: మూలంలోని పుంలింగ ఏకవచనాన్ని, అలాగే విశ్వాస సమాజ సభ్యుని సూచించగల కుటుంబ సంబంధ రూపకాన్ని విస్తరించి వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: ἐν τῷ φωτὶ
  choice: వెలుగులో
  rationale: యోహాను రచనలోని వెలుగు రూపకాన్ని సహజంగా, నేరుగా నిలుపుతుంది.
- source_word: μένει
  choice: నిలిచి ఉంటాడు
  rationale: μένω యొక్క కొనసాగుదల, స్థిరత్వ భావాలను ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, కీలకమైన యోహానీయ భావాన్ని కాపాడుతుంది.
- source_word: σκάνδαλον
  choice: తొట్రుపడేలా చేసేది
  rationale: అడ్డంకి, ఉచ్చు, పతనానికి కారణం అనే రూపకార్థాన్ని తెలుగులో అర్థమయ్యే విధంగా తెలియజేస్తుంది; అది ఎవరిని తొట్రుపడేలా చేస్తుందో అనవసరంగా నిర్ణయించదు.
- source_word: ἐν αὐτῷ
  choice: అతనిలో
  rationale: పుంలింగ ఏకవచన సర్వనామాన్ని ప్రేమించే వ్యక్తికే నేరుగా అన్వయిస్తుంది; ‘అతనికి’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: οὐκ ἔστιν
  choice: ఏదీ లేదు
  rationale: గ్రీకు అస్తిత్వ వాక్యాన్ని సహజమైన తెలుగు నిషేధ అస్తిత్వ నిర్మాణంతో అందిస్తుంది.
theological_decisions:
- issue: καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν అనే చివరి వాక్యభాగం యొక్క సూచన మరియు భావం
  choice: ప్రేమించే వ్యక్తిలో తొట్రుపడేలా చేసేది ఏదీ లేదు.
  alternative: అతనికి తొట్రుపడే అడ్డంకి ఏదీ లేదు; లేదా అతనిలో ఇతరులను తొట్రుపడేలా చేసేది ఏదీ లేదు.
  rationale: ἐν αὐτῷ పదబంధం వల్ల అంతర్గత నైతిక స్థితి, ఆ వ్యక్తి ఎదుర్కొనే అడ్డంకి, లేదా ఇతరులకు అతడు కలిగించే అడ్డంకి అనే భావ ఛాయలు సాధ్యమే. ప్రధాన పాఠం నేరుగా ‘అతనిలో’ అని ఉంచి ఎవరికి తొట్రుపాటు కలుగుతుందో నిర్దిష్టం చేయదు; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘వెలుగు’ రూపకాన్ని, ‘నిలిచి ఉండడం’ అనే కొనసాగుదల భావాన్ని నిలిపి, చివరి వాక్యభాగంలోని నిజమైన సందిగ్ధతను పాదసూచికతో భద్రపరచింది.
