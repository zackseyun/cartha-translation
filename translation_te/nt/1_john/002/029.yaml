id: 1JN.2.29
reference: 1 John 2:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ⸀ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: te
  text: ఆయన నీతిమంతుడని[a] మీకు తెలిస్తే, నీతిని ఆచరించే ప్రతి ఒక్కరూ ఆయన నుండి[b] జన్మించారని మీకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ఆయన’ అనేది తండ్రియైన దేవుణ్ణి లేదా కుమారుణ్ణి సూచించవచ్చు; గ్రీకు వాక్యం సూచ్యుణ్ణి స్పష్టంగా పేర్కొనదు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘ఆయన మూలంగా.’ గ్రీకు పదబంధాన్ని ఈ రెండు విధాలుగా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: మీకు తెలిస్తే
  rationale: ἐὰν తో కూడిన εἰδῆτε షరతును సూచిస్తుంది. ఆధునిక తెలుగులో ‘మీకు తెలిస్తే’ సహజంగా ఉండి, గ్రీకు వాక్యంలోని షరతు భావాన్ని నిలుపుతుంది.
- source_word: δίκαιός
  choice: నీతిమంతుడు
  rationale: వ్యక్తి యొక్క నైతిక స్వభావాన్ని తెలిపే δίκαιος కు ‘నీతిమంతుడు’ సహజమైన సమానార్థకం; అదే వాక్యంలోని δικαιοσύνηతో పదసంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: γινώσκετε
  choice: మీకు తెలుసు
  rationale: ఈ రూపాన్ని సూచనార్థక వాక్యంగా గ్రహించి, మొదటి ‘తెలిస్తే’తో ఉన్న భావసమాంతరతను నిలిపాం. ఆజ్ఞార్థకంగా ‘తెలుసుకోండి’ అని కూడా వ్యాకరణపరంగా గ్రహించవచ్చు, అయితే ఇక్కడ సందర్భప్రవాహానికి సూచనార్థక పఠనం అనుకూలంగా ఉంది.
- source_word: πᾶς ὁ ποιῶν τὴν δικαιοσύνην
  choice: నీతిని ఆచరించే ప్రతి ఒక్కరూ
  rationale: వర్తమాన కృదంతం వ్యక్తి లక్షణంగా కనిపించే కొనసాగుతున్న ప్రవర్తనను సూచిస్తుంది; ‘ఆచరించే’ అనే పదం కేవలం ఒక్కసారి చేసే పనికంటే అలవాటైన నడవడిని వ్యక్తం చేస్తుంది.
- source_word: ἐξ αὐτοῦ
  choice: ఆయన మూలంగా
  rationale: ἐξ మూలం లేదా ఉద్భవాన్ని సూచిస్తుంది. ‘ఆయన మూలంగా’ జననానికి మూలం ఆయనే అనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘ఆయన నుండి’ అనేది మరింత అక్షరార్థ ప్రత్యామ్నాయం.
- source_word: γεγέννηται
  choice: జన్మించారని
  rationale: పరిపూర్ణ కర్మణి రూపం గతంలో సంభవించి ఇప్పటికీ ఫలితం కొనసాగుతున్న జననాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘జన్మించారని’ సహజంగా ఈ స్థితిని తెలియజేస్తుంది.
theological_decisions:
- issue: δίκαιός ἐστιν మరియు ἐξ αὐτοῦ లోని ‘ఆయన’ ఎవరిని సూచిస్తుంది?
  choice: దేవుని తండ్రిగా గానీ కుమారునిగా గానీ స్పష్టీకరించకుండా ‘ఆయన’ అనే సర్వనామాన్నే ఉంచడం
  alternative: ‘తండ్రి’ లేదా ‘కుమారుడు’ అని నిర్దిష్టంగా అనువదించడం
  rationale: ఈ వచనం సర్వనామానికి సూచ్యుణ్ణి పేరుతో చెప్పదు; సమీప సందర్భాన్ని బట్టి తండ్రి లేదా కుమారుడు అనే రెండు అవగాహనలూ చర్చనీయమైనవి. అందువల్ల మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘నీతిమంతుడు/నీతి’ ద్వారా మూలంలోని δίκαιος/δικαιοσύνη పదసంబంధాన్ని సాధ్యమైనంతవరకు నిలిపాం; సర్వనామ సూచనలోని అస్పష్టతను పాదటిప్పణితో సంరక్షించాం.
