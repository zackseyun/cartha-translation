source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: te
  text: ఆయనే మన పాపాలకు ప్రాయశ్చిత్త బలి; మన పాపాలకు మాత్రమే కాదు, సమస్త లోకంలోని పాపాలకు కూడా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς
  choice: ఆయనే
  rationale: αὐτός ఇక్కడ ఇచ్చే బలమైన ఉద్ఘాటనను సహజమైన తెలుగులో ‘ఆయనే’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἱλασμός
  choice: ప్రాయశ్చిత్త బలి
  rationale: పాప పరిహారాన్ని కలిగించే బలి అనే భావాన్ని అందుబాటులో ఉండే, గౌరవప్రదమైన భాషలో తెలియజేస్తుంది; పదంలోని వివాదాస్పద సూక్ష్మభేదాలను పాదసూచికలో ఉంచుతుంది.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: మన పాపాలకు
  rationale: ἱλασμόςతో కలిసి περί ఇక్కడ పాపాలకు సంబంధించి, వాటి పరిహారం కోసం అనే భావాన్ని ఇస్తుంది; ‘మన పాపాలకు’ సహజంగా ఉంది.
- source_word: τῶν ἡμετέρων
  choice: మన పాపాలకు
  rationale: గ్రీకులో విశేషణం ముందు చెప్పిన ‘పాపాలు’ అనే నామవాచకాన్ని సూచిస్తూ సంక్షిప్తంగా ఉంది; తెలుగులో స్పష్టత కోసం నామవాచకాన్ని పునరుక్తి చేయడం సహజం.
- source_word: ὅλου τοῦ κόσμου
  choice: సమస్త లోకపు
  rationale: ὅλου యొక్క సమగ్రతను నిలుపుతూ κόσμος పరిధిని ఏ ప్రత్యేక సిద్ధాంతానికి అనుగుణంగా కుదించదు.
- source_word: οὐ ... μόνον ἀλλὰ καὶ
  choice: మాత్రమే కాదు ... కూడా
  rationale: గ్రీకు పరస్పర విరుద్ధ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ‘సమస్త లోకం’ యొక్క పరిధి
  choice: సమస్త లోకపు పాపాలకు
  alternative: లోకమంతటిలోని కొందరి పాపాలకు / లోకమంతటిలోని ఎన్నుకోబడినవారి పాపాలకు
  rationale: గ్రీకు వాక్యంలోని విస్తృతిని వ్యాఖ్యానాత్మకంగా కుదించకుండా, దాని సహజమైన ధార్మిక ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- issue: ἱλασμόςకు ప్రాయశ్చిత్త సంబంధ పదజాలం
  choice: ప్రాయశ్చిత్త బలి
  alternative: కోపశాంతికరమైన బలి / పాపపరిహారం
  rationale: మూలపదం బలి ద్వారా పాపానికి పరిష్కారం అనే భావక్షేత్రాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో ఏ ఒక్క వివాదాస్పద సిద్ధాంత వివరణనూ ఖరారు చేయకుండా, ముఖ్య ప్రత్యామ్నాయ భావాలను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ అనువదించబడింది. రెండో భాగంలో ‘ప్రాయశ్చిత్త బలి’ని పునరుక్తి చేయడం ద్వారా గ్రీకు వాక్యంలోని సంక్షిప్త సూచనను తెలుగులో స్పష్టం చేశాం.
