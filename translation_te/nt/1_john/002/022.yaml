revisions:
- from: యేసు అభిషిక్తుడు కాదని నిరాకరించేవాడు తప్ప అబద్ధికుడు ఎవరు? తండ్రిని, కుమారుణ్ణి నిరాకరించేవాడే క్రీస్తువిరోధి[a][b].
  to: యేసు మెస్సీయ[a] కాదని నిరాకరించేవాడు తప్ప అబద్ధికుడు ఎవడు? ఇతడే ఆ క్రీస్తువిరోధి[b]—తండ్రినీ కుమారునీ నిరాకరించేవాడు.
  rationale: The revision restores the omitted demonstrative-identification clause and relocates both footnote markers to the terms they explain. It uses “మెస్సీయ” for the definite titular ὁ χριστός, while preserving “క్రీస్తు” and the literal meaning “అభిషిక్తుడు” in the footnote. The wording does not decide whether “the antichrist” denotes one final individual or a representative/type.
