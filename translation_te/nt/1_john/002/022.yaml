id: 1JN.2.22
reference: 1 John 2:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: te
  text: యేసు మెస్సీయ[a] కాదని నిరాకరించేవాడు తప్ప అబద్ధికుడు ఎవడు? ఇతడే ఆ క్రీస్తువిరోధి[b]—తండ్రినీ కుమారునీ నిరాకరించేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.” గ్రీకు ὁ χριστός ఇక్కడ పేరుగా కాక బిరుదుగా వాడబడింది; దాని అర్థం “అభిషిక్తుడు.”
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో “ఆ క్రీస్తువిరోధి” అని నిర్దిష్ట ఉపపదం ఉంది. యోహాను పత్రికలలో ఈ పదం తండ్రినీ కుమారునీ నిరాకరించే లక్షణమున్న విరోధి రకాన్ని లేదా ప్రతినిధిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: అబద్ధికుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న నామవాచకం ఈ వాదనాత్మక సందర్భంలో కేవలం ఏదో ఒక అబద్ధికుణ్ణి కాక, అబద్ధికునిగా గుర్తించబడే వ్యక్తిని సూచిస్తుంది.
- source_word: ἀρνούμενος
  choice: నిరాకరించేవాడు
  rationale: వర్తమానకాల కృదంతం వ్యక్తిని అతని కొనసాగుతున్న లేదా లక్షణాత్మక నిరాకరణ ద్వారా గుర్తిస్తుంది; ఈ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: యేసు అభిషిక్తుడు కాదని
  rationale: ὅτι నిరాకరణలోని విషయాన్ని పరిచయం చేస్తుంది; οὐκ ప్రతికూలతను నేరుగా నిలుపుతూ, χριστός అనే బిరుదు యొక్క అర్థాన్ని ‘అభిషిక్తుడు’గా అనువదిస్తుంది.
- source_word: ὁ χριστός
  choice: అభిషిక్తుడు
  rationale: ఇక్కడ ఇది పేరులా కాక బిరుదుగా పనిచేస్తుంది. ‘అభిషిక్తుడు’ మూల గ్రీకు బిరుదు యొక్క అర్థాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀντίχριστος
  choice: క్రీస్తువిరోధి
  rationale: యోహాను పత్రికలలో స్థిరపడిన భావాన్ని సహజంగా తెలియజేస్తూ, పదాన్ని ఒక నిర్దిష్ట వ్యక్తికే పరిమితం చేయకుండా విరోధి రకం లేదా ప్రతినిధినీ సూచించగల గ్రీకు విస్తృతిని కాపాడుతుంది.
- source_word: πατέρα
  choice: తండ్రి
  rationale: ‘కుమారుడు’తో జతగా దేవుడైన తండ్రిని ప్రత్యేకంగా సూచిస్తుంది.
- source_word: υἱόν
  choice: కుమారుడు
  rationale: తండ్రి-కుమార సంబంధంలోని కుమారుణ్ణి సూచిస్తుంది; సాధారణ పుత్రత్వాన్ని కాదు.
- source_word: οὗτός ἐστιν
  choice: నిరాకరించేవాడే
  rationale: ముందు వర్ణించిన వ్యక్తిని బలంగా తిరిగి సూచించే గుర్తింపును తెలుగులో ‘-వాడే’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: క్రీస్తుసంబంధ ఒప్పుకోలు/నిరాకరణలో Χριστός అనువాదం
  choice: అభిషిక్తుడు
  alternative: క్రీస్తు / మెస్సీయ
  rationale: ఇక్కడ పదం బిరుదుగా ఉంది. ‘అభిషిక్తుడు’ దాని అర్థాన్ని నేరుగా అందిస్తూ యేసు గురించి నిరాకరించబడుతున్న మెస్సీయ సంబంధ వాదనను స్పష్టం చేస్తుంది; ప్రత్యామ్నాయ సంప్రదాయ రూపాలను పాదటిప్పణిలో ఇస్తుంది.
- issue: ἀντίχριστος యొక్క సూచన
  choice: క్రీస్తువిరోధి
  alternative: ఆ క్రీస్తువిరోధి / అంత్యకాలంలోని ఒకే వ్యక్తి
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం ఉన్నప్పటికీ, యోహాను పత్రికల వాడుక ఈ పదాన్ని తండ్రి మరియు కుమారుణ్ణి నిరాకరించే రకమైన విరోధికి కూడా వర్తింపజేయగలదు. అనువాదం దాన్ని కేవలం ఒక అంత్యకాల వ్యక్తికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన వాక్య నిర్మాణం. ‘అభిషిక్తుడు’ మూల బిరుదు అర్థాన్ని ముందుకు తెస్తుంది; ‘క్రీస్తువిరోధి’ సుపరిచితమైన ధార్మిక పదంగా ఉంచబడింది. రెండు పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
