id: 1JN.2.16
reference: 1 John 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: te
  text: ఎందుకంటే లోకంలో ఉన్నదంతా—శరీరపు కోరిక[a], కళ్ల కోరిక, జీవనపు డంబం[b]—తండ్రి నుండి వచ్చినది కాదు; లోకం నుండి వచ్చినది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శరీరపు వాంఛ’ లేదా, సందర్భాన్ని వివరిస్తూ, ‘పాప స్వభావపు కోరిక’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం బలమైన కోరిక, వాంఛ లేదా దురాశను సూచించగలదు; ఇక్కడ అది కేవలం లైంగిక కోరికకే పరిమితం కాదు.
    reason: lexical_alternative
  - marker: b
    text: ‘జీవనంలోని అహంకారపూరిత డంబం’ అని కూడా అనువదించవచ్చు. ఈ గ్రీకు పదబంధం ఒకరి హోదా, ఆస్తులు, జీవనాధారాలు లేదా జీవనవిధానం గురించి అతిశయించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి ఆజ్ఞకు కారణాన్ని పరిచయం చేసే పదం; తెలుగు వాక్యసంబంధంలో కారణార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: లోకంలో ఉన్నదంతా
  rationale: గ్రీకులోని సమష్ట్యర్థక ఏకవచన నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: κόσμος
  choice: లోకం
  rationale: దేవునికి విరోధంగా ఉన్న మానవ వ్యవస్థ అనే సందర్భార్థం ఉన్నప్పటికీ, మూలపదంలోని విస్తృతతను కాపాడేందుకు వ్యాఖ్యానాత్మక విస్తరణ లేకుండా ‘లోకం’ అని అనువదించబడింది.
- source_word: ἐπιθυμία
  choice: కోరిక
  rationale: ఈ పదం బలమైన, సందర్భానుసారం చెడు కోరికను సూచించగలదు. ‘కోరిక’ దానిని కేవలం లైంగిక వాంఛకు పరిమితం చేయదు; ప్రతికూల భావం జాబితా మరియు సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: τῆς σαρκὸς
  choice: శరీరపు
  rationale: σάρξ అనే పదం కలిగిన రూపక, నైతిక ఉద్వేగాన్ని ఒక నిర్దిష్ట మానవశాస్త్ర వివరణగా మార్చకుండా ‘శరీరం’ అనే ప్రాథమిక అర్థాన్ని నిలుపుతుంది.
- source_word: τῶν ὀφθαλμῶν
  choice: కళ్ల
  rationale: గ్రీకు బహువచనాన్ని, జన్యార్థ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀλαζονεία τοῦ βίου
  choice: జీవితపు డంబం
  rationale: ἀλαζονείαలోని అతిశయ ప్రదర్శన, అహంకారపూరిత గొప్పచెప్పుకోవడం అనే భావాలను ‘డంబం’ తెలియజేస్తుంది; βίοςలోని జీవనవిధానం, స్థితి, జీవనాధారాల విస్తృతిని ‘జీవితం’ కాపాడుతుంది.
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: తండ్రి నుండి కలిగినది కాదు; లోకం నుండే కలిగినది
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవాన్ని ‘నుండి కలిగినది’ తెలియజేస్తుంది; ‘నుండే’ తండ్రి–లోకం మధ్యనున్న బలమైన వ్యతిరేకతను స్పష్టం చేస్తుంది.
theological_decisions:
- issue: నైతిక సందర్భంలో σάρξ అనువాదం
  choice: శరీరం
  alternative: పాప స్వభావం
  rationale: ‘పాప స్వభావం’ సందర్భానికి సాధ్యమైన వివరణ అయినప్పటికీ, అది రూపకాన్ని ఒక ప్రత్యేక మానవశాస్త్ర భావనగా ముందుగానే పరిష్కరిస్తుంది. ‘శరీరం’ మూలరూపాన్ని, దాని అర్థ ఉద్వేగాన్ని కాపాడుతుంది.
- issue: κόσμος యొక్క సందర్భార్థం
  choice: లోకం
  alternative: దేవునికి విరోధమైన లోక వ్యవస్థ
  rationale: ఈ వచనం ‘తండ్రి నుండి’ మరియు ‘లోకం నుండి’ అనే మూలాల మధ్య వ్యత్యాసం చూపుతుంది. వ్యాఖ్యానాత్మక విస్తరణను ప్రధాన పాఠ్యంలో చేర్చకుండా సందర్భమే భావాన్ని నిర్దేశించనివ్వబడింది.
- issue: ἀλαζονεία τοῦ βίου యొక్క పరిధి
  choice: జీవితపు డంబం
  alternative: ఆస్తి లేదా హోదాను బట్టి కలిగే అహంకారం
  rationale: ఈ పదబంధంలో హోదా, ఆస్తులు, జీవనవిధానం గురించి అతిశయించడం ఉండవచ్చు; అయితే ప్రధాన పాఠ్యంలో వాటిలో ఒక్కదానికే అర్థాన్ని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని మూడు సమాంతర నామపదబంధాలను డాష్‌ల మధ్య నిలిపి, ‘తండ్రి నుండి—లోకం నుండి’ అనే వ్యత్యాసాన్ని స్పష్టంగా ఉంచాం.
