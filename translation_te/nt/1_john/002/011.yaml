id: 1JN.2.11
reference: 1 John 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: te
  text: కాని తన సహోదరుణ్ణి[a] ద్వేషించేవాడు చీకటిలో ఉన్నాడు, చీకటిలో నడుస్తున్నాడు, తాను ఎక్కడికి వెళ్తున్నాడో అతనికి తెలియదు; ఎందుకంటే చీకటి అతని కళ్లను గుడ్డివిగా చేసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సహోదరుడు లేదా సహోదరి.” గ్రీకులో “సహోదరుడు” అని ఉంది; ఈ పదం క్రైస్తవ సమాజంలోని తోటి విశ్వాసిని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: ద్వేషించేవాడు
  rationale: నామవాచకంగా వాడిన వర్తమాన కృదంతం ఒక వ్యక్తి యొక్క కొనసాగుతున్న లేదా లక్షణాత్మక వైఖరిని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: ἀδελφὸν
  choice: సహోదరుణ్ణి
  rationale: గ్రీకు పదం ఏకవచన పుంలింగంలో ఉంది. యోహాను సందర్భంలో ఇది సాధారణంగా విశ్వాసుల సమాజంలోని తోటి సభ్యుణ్ణి సూచించవచ్చు; మూలరూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి విస్తృత సూచనను పాదటిప్పణిలో తెలిపాం.
- source_word: ἐν τῇ σκοτίᾳ
  choice: చీకటిలో
  rationale: యోహాను రచనలోని నైతిక-ఆధ్యాత్మిక రూపకాన్ని నిలుపుతూ, రెండు సందర్భాల్లోనూ ‘చీకటి’ అనే పదాన్ని పునరావృతం చేశాం.
- source_word: περιπατεῖ
  choice: నడుస్తున్నాడు
  rationale: ప్రవర్తన లేదా జీవన విధానాన్ని సూచించే బైబిలు రూపకాన్ని వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: తాను ఎక్కడికి వెళ్తున్నాడో అతనికి తెలియదు
  rationale: దిశ తెలియని కొనసాగుతున్న ప్రయాణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐτύφλωσεν
  choice: గుడ్డివిగా చేసింది
  rationale: ఆరిస్టు క్రియ చీకటి చేసిన కార్యాన్ని సూచిస్తుంది; దాని ఫలితమైన ప్రస్తుత అంధత్వం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: అతని కళ్లను
  rationale: మూలంలోని స్పష్టమైన శరీర రూపకాన్ని అమూర్తంగా మార్చకుండా సహజ తెలుగు స్వామ్య నిర్మాణంతో నిలుపుతుంది.
theological_decisions:
- issue: యోహాను రచనలో చీకటి యొక్క నైతిక-ఆధ్యాత్మిక భావం
  choice: ‘చీకటి’ అనే రూపకాన్నే ఉంచడం
  alternative: ‘చెడు’ లేదా ‘పాపపు చీకటి’ అని వివరణాత్మకంగా అనువదించడం
  rationale: మూలంలోని వెలుగు-చీకటి ప్రతీకాత్మక విరోధాన్ని, దాని బహుస్థాయి వేదాంత భావాన్ని సంకుచితం చేయకుండా నిలుపుతుంది.
- issue: ‘సహోదరుడు’ అనే పదం సూచించే వ్యక్తి
  choice: ప్రధాన పాఠ్యంలో పుంలింగ ఏకవచనమైన ‘సహోదరుడు’ను నిలుపడం
  alternative: ‘సహోదరుడు లేదా సహోదరి’ లేదా ‘తోటి విశ్వాసి’
  rationale: మూల గ్రీకు రూపాన్ని కాపాడుతూ, విశ్వాసుల సమాజంలోని స్త్రీపురుషులిద్దరికీ వర్తించగల విస్తృత భావాన్ని పాదటిప్పణిలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘చీకటిలో’ అనే పునరుక్తిని, ‘నడవడం’ మరియు ‘కళ్లను గుడ్డివిగా చేయడం’ అనే మూల రూపకాలను ఉద్దేశపూర్వకంగా నిలిపాం.
