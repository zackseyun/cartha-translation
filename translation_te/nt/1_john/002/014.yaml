  rationale: గ్రీకులోని నిర్దిష్ట పుంలింగ పదబంధమైన τὸν πονηρόνను ‘ఆ దుష్టుడిని’ అని స్పష్టపరిచాను. παιδίαకు ‘పిల్లలారా’ అని ఇచ్చి, మూలంలో లేని ‘చిన్న’ అనే వయోపరమైన సూక్ష్మార్థాన్ని నివారించాను. ἔγραψα యొక్క పునరావృతాన్ని గ్రీకు క్రమానికి సమీపంగా నిలిపాను. పాదసూచిక a ప్రధాన పాఠ్యంలో ఇక గుర్తు లేకపోవడంతో, అనాథ పాదసూచికను తొలగించాను; b మరియు c గుర్తులు వాటి సంబంధిత పదబంధాల వద్దనే ఉన్నాయి.
