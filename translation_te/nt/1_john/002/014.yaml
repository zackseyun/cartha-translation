- from: చిన్నపిల్లలారా, నేను మీకు రాశాను[a]; ఎందుకంటే మీరు తండ్రిని తెలుసుకున్నారు. తండ్రులారా, నేను మీకు రాశాను; ఎందుకంటే ఆది నుండి ఉన్నవానిని మీరు తెలుసుకున్నారు[b]. యువకులారా, నేను మీకు రాశాను; ఎందుకంటే మీరు బలవంతులు, దేవుని వాక్యం మీలో నిలిచి ఉంది[c], దుష్టుణ్ణి మీరు జయించారు.
