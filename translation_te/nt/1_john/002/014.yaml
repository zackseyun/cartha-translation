id: 1JN.2.14
reference: 1 John 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: te
  text: నేను మీకు రాశాను, పిల్లలారా, ఎందుకంటే మీరు తండ్రిని తెలుసుకున్నారు. నేను మీకు రాశాను, తండ్రులారా, ఎందుకంటే ఆది నుండి ఉన్నవానిని మీరు తెలుసుకున్నారు[b]. నేను మీకు రాశాను, యువకులారా, ఎందుకంటే మీరు బలవంతులు, దేవుని వాక్యం మీలో నిలిచి ఉంది[c], మరియు మీరు ఆ దుష్టుడిని జయించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘ఆది నుండి ఉన్నవాడు’ అనేది యోహాను రచనల ప్రయోగంలో ముందునుండి ఉన్న కుమారుణ్ణి సూచించే అవకాశం ఉంది; అయితే ఈ వచనం ఆయనను పేరుతో గుర్తించదు.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘దేవుని వాక్యం మీలో నివసిస్తూ ఉంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: నేను మీకు రాశాను
  rationale: గ్రీకు ఏఓరిస్టును సహజమైన తెలుగు భూతకాలంతో వ్యక్తపరుస్తూ, లేఖలో ఇప్పటికే రాసిన మాటకు వర్తమాన ప్రాసంగికత ఉందనే అవకాశాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: παιδία
  choice: చిన్నపిల్లలారా
  rationale: ఆప్యాయమైన కుటుంబ సంబోధనను, పితృసంబంధ రూపకాన్ని కాపాడుతుంది; ఇది తప్పనిసరిగా శారీరక వయస్సును మాత్రమే సూచించదు.
- source_word: ἐγνώκατε
  choice: మీరు తెలుసుకున్నారు
  rationale: ముందు ఏర్పడి ఇప్పటికీ ఫలితమున్న పరిజ్ఞానాన్ని గ్రీకు పరిపూర్ణ కాలం సూచిస్తుంది; తెలుగు సందర్భంలో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: τὸν πατέρα
  choice: తండ్రిని
  rationale: యోహాను రచనల సందర్భంలో దేవునికి వాడిన స్పష్టమైన సంబంధపూర్వక బిరుదు.
- source_word: πατέρες
  choice: తండ్రులారా
  rationale: మూలంలోని సంబోధనను, చిన్నపిల్లలు–తండ్రులు–యువకులు అనే వాక్చాతుర్య క్రమాన్ని అలాగే ఉంచుతుంది; ‘పెద్దవారు’ అని వయస్సుకే పరిమితం చేయదు.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: ఆది నుండి ఉన్నవానిని
  rationale: వ్యక్తిగత సూచనను కాపాడుతూ, మూలపాఠం పేరు చెప్పని వ్యక్తిని క్రీస్తు లేదా కుమారుడు అని అనువాదంలోనే స్పష్టీకరించదు.
- source_word: νεανίσκοι
  choice: యువకులారా
  rationale: పురుష బహువచన సంబోధనకు నేరమైన, సహజమైన తెలుగు సమానం; తండ్రులతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἰσχυροί
  choice: బలవంతులు
  rationale: నైతిక-ఆధ్యాత్మిక సందర్భంలో బలమున్నవారనే అర్థాన్ని సంక్షిప్తంగా తెలుపుతుంది.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: దేవుని వాక్యం
  rationale: దేవుని సందేశం లేదా ప్రకటిత సువార్త అనే భావవిస్తృతిని ముందుగానే కుదించకుండా, సుపరిచితమైన బైబిలు పదబంధాన్ని నిలుపుతుంది.
- source_word: μένει
  choice: నిలిచి ఉంది
  rationale: కొనసాగుతూ ఉండడం అనే యోహాను రచనలలోని ప్రధాన భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది.
- source_word: νενικήκατε
  choice: మీరు జయించారు
  rationale: పూర్తయి కొనసాగుతున్న ప్రాముఖ్యతగల విజయాన్ని గ్రీకు పరిపూర్ణ కాలానికి అనుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν πονηρόν
  choice: దుష్టుణ్ణి
  rationale: వ్యాకరణపరంగా వ్యక్తిని సూచించే పుంలింగ రూపాన్ని కాపాడుతుంది; అమూర్తమైన ‘చెడును’ అనే భావానికి మార్చదు.
theological_decisions:
- issue: ‘ఆది నుండి ఉన్నవాడు’ ఎవరు?
  choice: పేరు చెప్పకుండా ‘ఆది నుండి ఉన్నవానిని’ అని ఉంచడం
  alternative: ‘క్రీస్తును’ లేదా ‘కుమారుణ్ణి’ అని స్పష్టీకరించడం; లేదా దేవుడని భావించడం
  rationale: యోహాను ప్రయోగంలో ఇది ముందునుండి ఉన్న కుమారుణ్ణి సూచించే అవకాశం బలంగా ఉన్నా, ఈ వచనం స్వయంగా ఆ వ్యక్తి పేరు చెప్పదు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
- issue: మూడు సంబోధనల లింగం మరియు భావం
  choice: ‘చిన్నపిల్లలు’, ‘తండ్రులు’, ‘యువకులు’ అని మూలరూపాల ప్రకారం అనువదించడం
  alternative: అన్నిటినీ సంఘమంతటికీ వర్తించే లింగతటస్థ ఆధ్యాత్మిక దశలుగా మార్చడం
  rationale: గ్రీకులో παιδία సాధారణ కుటుంబ సంబోధన కాగా, πατέρες మరియు νεανίσκοι పురుష రూపాలు. అవి రూపకాలా, ప్రతినిధి వర్గాలా అన్నది అనువాదంలో నిర్ణయించకుండా, పదరూపాలను ఖచ్చితంగా కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, ప్రజలకు సులభంగా అర్థమయ్యే శైలి. పునరుక్త సంబోధనల లయను కాపాడుతూ, ‘ఆది నుండి ఉన్నవాడు’ అనే ధార్మిక అస్పష్టతను పరిష్కరించకుండా ఉంచింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
