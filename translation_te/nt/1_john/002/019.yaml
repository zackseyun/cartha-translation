  verdict: revise
  source_fidelity: The draft accurately conveys the departure, the contrary-to-fact conditional, and the community-relational force of ἐξ ἡμῶν without imposing a theological interpretation. However, the final Telugu wording “వారందరూ మనవారు కారని” naturally risks meaning that none of them are ours, whereas οὐκ εἰσὶν πάντες ἐξ ἡμῶν means “not all are of us.” Adding “వారిలో” preserves the required scope.
