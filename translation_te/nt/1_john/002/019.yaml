  text: ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ⸂ἐξ ἡμῶν ἦσαν⸃, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: te
  text: వారు మన మధ్యనుండి వెళ్లిపోయారు; కాని వారు మనవారు కారు. ఎందుకంటే వారు మనవారై ఉంటే, మనతోనే నిలిచి ఉండేవారు[a]. అయితే వారిలో అందరూ మనవారు కారని వెల్లడయ్యేలా అలా జరిగింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనతోనే కొనసాగి ఉండేవారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారు బయలుపరచబడేలా” లేదా “వారు వెల్లడయ్యేలా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: మన మధ్యనుండి / మనవారు
  rationale: మొదటి సందర్భంలో సమాజం మధ్యనుండి బయలుదేరడాన్ని ‘మన మధ్యనుండి’ సహజంగా తెలియజేస్తుంది; తరువాతి సందర్భాల్లో అదే పదబంధంలోని అనుబంధం, గుర్తింపు భావాన్ని ‘మనవారు’ అందిస్తుంది.
- source_word: ἐξῆλθαν
  choice: వెళ్లిపోయారు
  rationale: ἐξέρχομαι అనే క్రియలోని బయలుదేరడం అనే సాధారణ భావాన్ని ఉంచుతుంది; క్రియలోనే ‘విశ్వాసత్యాగం’ అనే వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: వారు మనవారు కారు
  rationale: వారు నిజంగా విశ్వాసులా లేదా అనే తరువాతి సిద్ధాంతపరమైన భాషను చేర్చకుండా, మూలంలోని సమాజ సంబంధిత భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: εἰ γὰρ ἐξ ἡμῶν ἦσαν
  choice: ఎందుకంటే వారు మనవారై ఉంటే
  rationale: గ్రీకు వాస్తవవిరుద్ధ షరతును సహజమైన తెలుగు షరతు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: మనతోనే నిలిచి ఉండేవారు
  rationale: μένω లోని నిలిచి ఉండడం/కొనసాగడం అనే యోహాను రచనలకు ప్రత్యేకమైన భావాన్ని కాపాడుతూ, ἄν సూచించే వాస్తవవిరుద్ధ ఫలితాన్ని తెలుపుతుంది.
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: అయితే … స్పష్టమయ్యేలా అలా జరిగింది
  rationale: గ్రీకు నిష్క్రియారూపంలోని బయలుపడడం అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది; అసంపూర్ణంగా అనిపించకుండా సందర్భంలో సూచితమైన సంఘటనను ‘అలా జరిగింది’ అని వ్యక్తపరుస్తుంది.
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: వారందరూ మనవారు కారని
  rationale: οὐ ... πάντες నిర్మాణంలోని పరిధి ఉద్రిక్తతను తెలుగు వాక్యంలో అతిగా వివరించకుండా ఉంచి, ‘నిజమైన విశ్వాసులు’ వంటి వ్యాఖ్యాన పదాలను నివారిస్తుంది.
theological_decisions:
- issue: ‘మనవారు’ అనే మాట కనిపించే సమాజ సభ్యత్వాన్నా, అంతర్గత ఆత్మీయ స్థితినేనా సూచిస్తుందనే ప్రశ్న
  choice: ‘వారు మనవారు కారు’ అనే సంబంధ సూచక భాషను నిలుపడం
  alternative: ‘వారు ఎన్నడూ నిజమైన విశ్వాసులు కారు’ లేదా ‘వారు నిజంగా సంఘానికి చెందినవారు కారు’
  rationale: మూలపాఠం సమాజ సంబంధిత ἐξ ἡμῶν అనే పదబంధాన్నే వాడుతుంది. తరువాతి సిద్ధాంత వర్గీకరణను అనువాదంలో చేర్చకుండా ఉండడం వల్ల అసలు వాక్యంలోని వేదాంత ఉద్రిక్తత నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘మనవారు’ అనే సహజ సంబంధపదం మూలంలోని సమాజ గుర్తింపు భావాన్ని సిద్ధాంతపరంగా విస్తరించకుండా అందిస్తుంది. మూలానికి సరిపడేలా పాదసూచిక [a] μένω ప్రత్యామ్నాయం వద్ద, [b] φανερόω ప్రత్యామ్నాయం వద్ద ఉంచబడ్డాయి.
