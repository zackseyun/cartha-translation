  terminology: “మనవారు” suitably renders the relational/community sense of ἐξ ἡμῶν and avoids doctrinally loaded expansions. “నిలిచి ఉండేవారు” retains the Johannine resonance of μένω. “వెల్లడయ్యేలా” appropriately represents the passive φανερωθῶσιν.
