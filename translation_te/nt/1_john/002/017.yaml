  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: te
  text: లోకమూ దాని కోరికయూ గతించిపోతున్నాయి[a]; అయితే దేవుని చిత్తాన్ని నెరవేర్చేవాడు ఎప్పటికీ నిలిచి ఉంటాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గతించిపోతున్నాయి’ అని అనువదించిన గ్రీకు క్రియ కొనసాగుతున్న ప్రక్రియను సూచిస్తుంది; ‘గతించిపోతాయి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నిలిచి ఉంటాడు’కు మూలమైన గ్రీకు పదాన్ని ‘ఉంటాడు’ లేదా ‘నిలుస్తాడు’ అని కూడా అనువదించవచ్చు; యోహాను రచనల్లో ఈ పదం కొనసాగి ఉండడాన్ని సూచించే ముఖ్యమైన పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: ఈ లోకం
  rationale: యోహాను సందర్భంలో ఇది కేవలం భౌతిక సృష్టిని కాక, దేవునికి విరోధంగా ఉన్న మానవ లోకవ్యవస్థను కూడా సూచిస్తుంది. సందర్భమే ఆ నైతిక భావాన్ని స్పష్టం చేస్తుంది కాబట్టి విస్తృతమైన సహజ పదం ‘లోకం’ను ఉంచాం.
- source_word: παράγεται
  choice: గతించిపోతున్నాయి
  rationale: వర్తమానకాల క్రియలోని కొనసాగుతున్న ప్రక్రియను, లోకపు క్షణభంగురత్వాన్ని వ్యక్తం చేస్తుంది. తెలుగులో సంయుక్త కర్తలైన ‘లోకమూ దాని కోరికా’తో సరిపడేలా బహువచనం వాడాం.
- source_word: ἐπιθυμία αὐτοῦ
  choice: దాని కోరిక
  rationale: ἐπιθυμία ఇక్కడ ప్రతికూలమైన బలమైన కోరికను సూచించినా, దాన్ని కేవలం లైంగిక వాంఛగా పరిమితం చేయకుండా విస్తృత భావాన్ని నిలుపుకోవడానికి ‘కోరిక’ను ఎంచుకున్నాం. αὐτοῦకు సహజ తెలుగు రూపం ‘దాని’.
- source_word: ὁ δὲ ποιῶν
  choice: అయితే ... నెరవేర్చేవాడు
  rationale: ఈ కృదంతం దేవుని చిత్తాన్ని ఆచరించడం ద్వారా గుర్తింపబడే వ్యక్తిని సూచిస్తుంది. ‘చిత్తాన్ని చేసేవాడు’ అనే అసహజ పదబంధానికి బదులు ‘నెరవేర్చేవాడు’ సహజంగా అదే క్రియాశీల భావాన్ని అందిస్తుంది.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: దేవుని చిత్తాన్ని
  rationale: ‘చిత్తం’ దేవుని ఉద్దేశం, సంకల్పం అనే భావాలను కాపాడే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: ఎప్పటికీ నిలిచి ఉంటాడు
  rationale: μένειలోని కొనసాగి ఉండే భావాన్ని ‘నిలిచి ఉంటాడు’ తెలియజేస్తుంది; εἰς τὸν αἰῶναకు ‘ఎప్పటికీ’ సహజమైన ఆధునిక తెలుగు సమానం.
theological_decisions:
- issue: యోహాను సందర్భంలో κόσμος భావం
  choice: దేవునికి విరోధంగా ఉండి గతించిపోయే లోకవ్యవస్థను సూచించే విస్తృత ‘లోకం’
  alternative: భౌతిక సృష్టి మాత్రమే
  rationale: ముందటి వచనాలు లోకాన్ని కోరికలు, జీవన గర్వం ద్వారా వివరిస్తాయి. అయినా మూలపాఠంలోని విస్తృతతను తగ్గించకుండా ప్రధాన పాఠంలో ‘లోకం’నే ఉంచాం.
- issue: μένει εἰς τὸν αἰῶνα యొక్క భావబలం
  choice: దేవుని చిత్తాన్ని నెరవేర్చే వ్యక్తి ఎప్పటికీ నిలిచి ఉండడం
  alternative: ‘నిత్యజీవం పొందుతాడు’ అని సిద్ధాంతపరంగా విపులీకరించడం
  rationale: గ్రీకు పాఠం శాశ్వత కొనసాగింపును చెబుతుంది గాని దాని సిద్ధాంతపరమైన విధానాన్ని ఇక్కడ వివరించదు. అందువల్ల ఆ ఉద్రిక్తతను విపులీకరించకుండా అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘చిత్తం’ వంటి పరిచితమైన ధార్మిక పదాన్ని నిలిపి, ‘నెరవేర్చేవాడు’, ‘నిలిచి ఉంటాడు’ వంటి సులభంగా అర్థమయ్యే ప్రస్తుత వాడుక రూపాలను ఎంచుకున్నాం.
