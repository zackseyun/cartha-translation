revisions:
- from: ఇప్పుడు, చిన్నపిల్లలారా, ఆయనలో నిలిచి ఉండండి. అప్పుడు ఆయన ప్రత్యక్షపరచబడితే[a], మనకు ధైర్యం ఉంటుంది; ఆయన రాక[b] సమయంలో సిగ్గుతో ఆయననుండి వెనక్కి తగ్గకుండా ఉంటాం[c].
  to: ఇక ఇప్పుడు, చిన్నపిల్లలారా, ఆయనలో నిలిచి ఉండండి. తద్వారా ఆయన ప్రత్యక్షమైనప్పుడు[a], మనకు ధైర్యం ఉండగలదు; ఆయన రాక[b] సమయంలో సిగ్గుతో ఆయన నుండి వెనక్కి తగ్గిపోకుండా ఉండగలము[c].
  rationale: 'The revision makes the ἵνα purpose clause and its subjunctive outcomes explicit and natural in Telugu: believers remain in him so that they may have confidence and may not recoil in shame. It replaces an unnaturally literal passive expression in the main text with idiomatic Telugu while preserving the Greek passive and the conditional/temporal nuance in footnote a. It retains the source''s ambiguity concerning the shame expression through footnote c and does not add any doctrinal interpretation.'
