id: 1JN.2.28
reference: 1 John 2:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: te
  text: ఇక ఇప్పుడు, చిన్నపిల్లలారా, ఆయనలో నిలిచి ఉండండి. తద్వారా ఆయన ప్రత్యక్షమైనప్పుడు[a], మనకు ధైర్యం ఉండగలదు; ఆయన రాక[b] సమయంలో సిగ్గుతో ఆయన నుండి వెనక్కి తగ్గిపోకుండా ఉండగలము[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘ఆయన ప్రత్యక్షపరచబడితే.’ గ్రీకు క్రియ కర్మణి రూపంలో ఉంది: ‘ప్రత్యక్షపరచబడితే.’ షరతును తెలిపే ఈ రూపం సందర్భంలో ‘ఆయన ప్రత్యక్షమైనప్పుడు’ అనే కాలసూచక భావాన్ని కూడా ఇవ్వవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయన సన్నిధి సమయంలో.’ ఈ సందర్భంలో గ్రీకు పదానికి ఉన్న అంత్యకాల భావాన్ని ‘రాక’ తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఆయన ఎదుట సిగ్గుపడకుండా ఉండగలము.’ ఈ మాటలను ఆయన సన్నిధిలో సిగ్గుపడడంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: చిన్నపిల్లలారా
  rationale: ఆప్యాయతతో కూడిన సంబోధనలోని కుటుంబ భావాన్ని, అల్పార్థక రూపపు ఛాయను నిలుపుతుంది.
- source_word: μένετε ἐν αὐτῷ
  choice: ఆయనలో నిలిచి ఉండండి
  rationale: యోహాను రచనల్లో ముఖ్యమైన ‘నిలిచి ఉండడం’ అనే నిరంతర సంబంధ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ‘ఆయనలో’ అనే రూపకాన్ని వివరించి మార్చకుండా ఉంచుతుంది.
- source_word: φανερωθῇ
  choice: ఆయన ప్రత్యక్షపరచబడితే
  rationale: గ్రీకు క్రియలోని కర్మణి రూపాన్ని నిలుపుతూ, క్రీస్తు భవిష్య ప్రత్యక్షతను సూచిస్తుంది; ‘ప్రత్యక్షమైతే’ మరింత సహజమైనదైనా కర్మణి రూపాన్ని సున్నితంగా చెరిపేస్తుంది.
- source_word: σχῶμεν παρρησίαν
  choice: మనకు ధైర్యం ఉంటుంది
  rationale: దేవుని ఎదుట నిర్భయమైన నమ్మకంతో ఉండే భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: సిగ్గుతో ఆయననుండి వెనక్కి తగ్గకుండా ఉంటాం
  rationale: సిగ్గు అనే భావంతో పాటు ἀπό సూచించే ‘ఆయననుండి/దూరంగా’ అనే సంబంధ ఛాయను కూడా వ్యక్తం చేస్తుంది; దీనిని తీర్పు లేదా ఖండనగా అతిశయింపదు.
- source_word: παρουσίᾳ
  choice: రాక
  rationale: ఈ అంత్యకాల సందర్భంలో క్రీస్తు భవిష్య రాకను సహజంగా తెలియజేస్తుంది; మూలపదానికి ‘సన్నిధి’ అనే అర్థం కూడా సాధ్యమని పాదసూచికలో ఉంచబడింది.
theological_decisions:
- issue: సర్వనామాల సూచన మరియు భవిష్య ప్రత్యక్షత
  choice: ‘ఆయన’ అనేది సందర్భానుసారం కుమారుడైన యేసు క్రీస్తును సూచిస్తుంది; వాక్యం ఆయన భవిష్య ప్రత్యక్షత, రాక గురించి చెబుతుంది.
  alternative: సర్వనామాన్ని ప్రత్యేకంగా కుమారునికి పరిమితం చేయకుండా దేవునికి సాధారణ సూచనగా గ్రహించడం.
  rationale: సమీప సందర్భం కుమారునిలో నిలిచి ఉండడం, ఆయన ప్రత్యక్షతపై కేంద్రీకృతమై ఉంది. అయితే అనువాదం మూలంలోని సర్వనామాన్నే వాడి, పేరును వాక్యంలో చేర్చి సందిగ్ధతను పూర్తిగా తొలగించదు.
- issue: ఆయన రాకలో కలిగే సిగ్గు స్వభావం
  choice: ఆయన రాక సమయంలో సిగ్గుతో ఆయననుండి వెనక్కి తగ్గే అవకాశం.
  alternative: ‘ఆయన ఎదుట సిగ్గుపడడం’ అని మాత్రమే అర్థం చేసుకోవడం.
  rationale: αἰσχυνθῶμεν తో ἀπ’ αὐτοῦ కలయిక సిగ్గుతో దూరంగా తగ్గే ఛాయను ఇవ్వగలదు. ఇది తప్పనిసరిగా అంతిమ శిక్షను సూచిస్తుందని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఆప్యాయమైన కాపరి సంబోధనను, గంభీరమైన అంత్యకాల స్వరాన్ని కలిపి ఉంచాం. యోహాను రచనల్లో పునరావృతమయ్యే ‘ఆయనలో నిలిచి ఉండండి’ అనే రూపకాన్ని వివరణాత్మకంగా మార్చలేదు. కర్మణి క్రియలోని అసహజత కొంత ఉన్నప్పటికీ మూలరూపాన్ని కాపాడి, సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
