id: 1JN.2.5
reference: 1 John 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: te
  text: 'కాని, ఎవరైనా ఆయన మాటను పాటిస్తారో, వారిలో[a] దేవుని ప్రేమ[b] నిజంగా పరిపూర్ణం చేయబడింది. మనం ఆయనలో ఉన్నామని దీని ద్వారా తెలుసుకుంటాం:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘ఇందులో’ లేదా ‘ఈ వ్యక్తిలో.’ ఈ గ్రీకు పదబంధం ఆయన మాటను పాటించే వ్యక్తిని గానీ, దీనిని రుజువు చేసే ఈ విషయాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘దేవుని ప్రేమ’ అనేది విశ్వాసిలో పనిచేసే దేవుని ప్రేమను గానీ, దేవునిపట్ల విశ్వాసికి ఉన్న ప్రేమను గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: కాని … పాటించేవారిలో
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసాన్ని ‘కాని’ నిలుపుతుంది; ὃς … ἂν లోని సాధారణ, అనిర్దిష్ట భావాన్ని ‘పాటించేవారు’ అనే సహజమైన తెలుగు ప్రయోగం వ్యక్తం చేస్తుంది.
- source_word: τηρῇ
  choice: పాటించేవారు
  rationale: τηρέω అంటే కాపాడడం, గైకొనడం, పాటించడం అనే భావాలు ఉన్నాయి. ఇక్కడ ‘మాటను పాటించడం’ సహజంగా ఉండి, కేవలం బాహ్య విధేయతకు భావాన్ని పరిమితం చేయదు.
- source_word: αὐτοῦ τὸν λόγον
  choice: ఆయన మాటను
  rationale: λόγος ఏకవచనంలో దేవుడు లేదా క్రీస్తు తెలియజేసిన మాటను విస్తృతంగా సూచిస్తుంది. ‘మాట’ యోహాను రచనలోని పదప్రయోగాన్ని నిలుపుతుంది; αὐτοῦ ను ‘ఆయన’గా అనువదించడం ద్వారా మూలంలోని సూచనను అతిగా నిర్దిష్టం చేయలేదు.
- source_word: ἀληθῶς
  choice: నిజంగా
  rationale: ఈ క్రియావిశేషణం వాక్యంలోని ప్రకటనను బలపరుస్తుంది. ‘నిజంగా’ ఆధునిక తెలుగులో సహజమైన, గంభీరమైన సమానం.
- source_word: ἐν τούτῳ
  choice: పాటించేవారిలో
  rationale: సందర్భంలో ఇది ఆయన మాటను పాటించే వ్యక్తిని సూచించవచ్చు. సహజమైన తెలుగు కోసం వ్యక్తిగత భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, ‘ఇందులో/ఈ వ్యక్తిలో’ అనే మరింత అక్షరార్థ అవకాశాన్ని పాదసూచికలో నిలిపాం.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: దేవుని ప్రేమ
  rationale: τοῦ θεοῦ అనే సంబంధవిభక్తి దేవుడు చూపే ప్రేమను లేదా దేవునిపట్ల ఉండే ప్రేమను సూచించవచ్చు. ‘దేవుని ప్రేమ’ ఈ ఉద్దేశపూర్వక అస్పష్టతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: τετελείωται
  choice: పరిపూర్ణమైంది
  rationale: పూర్తి చేయబడి ఇప్పుడు సంపూర్ణ స్థితిలో ఉందనే పరిపూర్ణ కాల కర్మణి భావాన్ని ఈ రూపం సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: దీనివల్ల తెలుసుకుంటాం
  rationale: ఈ యోహానీయ సూత్రప్రయోగం దేనిచేత ఒక విషయం తెలిసిందో తెలిపే ఆధారాన్ని సూచిస్తుంది. ‘దీనివల్ల’ తెలుగులో సహజంగా ఆ ఆధార భావాన్ని అందిస్తుంది.
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: మనం ఆయనలో ఉన్నామని
  rationale: ‘ఆయనలో’ అనే రూపం యోహాను రచనల్లో ముఖ్యమైన సంబంధం, నిలిచి ఉండడం, ఐక్యత అనే భావాలను విపులీకరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ లోని సంబంధవిభక్తి భావం
  choice: దేవుని ప్రేమ
  alternative: దేవుడు మనపట్ల చూపే ప్రేమ; దేవునిపట్ల మనకున్న ప్రేమ
  rationale: గ్రీకు నిర్మాణం ఈ రెండు భావాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠ్యం ఏ ఒక్క భావాన్నీ నిర్ణయించకుండా సంబంధాన్ని యథాతథంగా ఉంచుతుంది; రెండు అవకాశాలను పాదసూచిక స్పష్టం చేస్తుంది.
- issue: మొదటి ἐν τούτῳ దేనిని సూచిస్తుంది
  choice: ఆయన మాటను పాటించే వ్యక్తిని సూచించే ‘పాటించేవారిలో’
  alternative: ఇందులో; ఈ వ్యక్తిలో
  rationale: సమీప పూర్వపదం మాటను పాటించే వ్యక్తే కావడం వల్ల వ్యక్తిగత భావం సందర్భానికి సరిపోతుంది. అయితే గ్రీకు పదబంధం ఈ విషయం లేదా ఈ ఆధారం అనే భావాన్నీ అనుమతించవచ్చు కాబట్టి ఆ అస్పష్టతను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ‘పాటించేవారు’ అనే సాధారణ బహువచన రూపం లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ὃς ἂν లోని ‘ఎవరైనా’ భావాన్ని అందిస్తుంది. మూలపాఠ్యంలో వాక్యం తరువాతి వచనంలో కొనసాగేలా ఉన్నందున చివర ద్విబిందువును నిలిపాం.
