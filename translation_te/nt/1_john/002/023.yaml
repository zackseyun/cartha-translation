  yaml_path: translation/nt/1_john/002/023.yaml
  text: Everyone who denies the Son does not have the Father either[a]; whoever confesses the Son has the Father also.
translation:
  language: te
  text: కుమారుణ్ణి నిరాకరించే ప్రతి వ్యక్తి తండ్రిని కూడా కలిగి ఉండడు; కుమారుణ్ణి ఒప్పుకొనేవాడు తండ్రిని కూడా కలిగి ఉంటాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “కుమారుణ్ణి ఒప్పుకొనేవాడు తండ్రిని కూడా కలిగి ఉంటాడు” అనే మాటలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: నిరాకరించే ప్రతి వ్యక్తి
  rationale: విశేషణార్థక వర్తమాన కృదంతం సాధారణంగా, సమస్తులను ఉద్దేశిస్తూ ఉంది. ఈ తెలుగు రూపం విశ్వవ్యాప్త పరిధినీ కొనసాగుతున్న లేదా స్వభావసూచక క్రియ భావాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: ἀρνούμενος
  choice: నిరాకరించే
  rationale: విశ్వాస ప్రకటన సందర్భంలో ἀρνέομαι అంటే కుమారుని గుర్తింపును కాదనడం లేదా నిరాకరించడం. ‘నిరాకరించే’ అనే పదం అదనపు సామాజిక లేదా సిద్ధాంతార్థాన్ని చేర్చకుండా ఆ భావాన్ని అందిస్తుంది.
- source_word: τὸν υἱὸν
  choice: కుమారుణ్ణి
  rationale: మూలంలో ‘కుమారుడు’ అనే క్రీస్తుసంబంధ నిర్దిష్ట బిరుదు మాత్రమే ఉంది. ‘దేవుని కుమారుడు’ అని విస్తరించకుండా మూలంలోని సంక్షిప్తతను నిలిపింది.
- source_word: οὐδὲ
  choice: కూడా ... లేడు
  rationale: మొదటి నిరాకరణను తండ్రికి కూడా వర్తింపజేసే అనుసంధాన భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὸν πατέρα ἔχει
  choice: తండ్రి ... ఉన్నాడు / తండ్రి ... లేడు
  rationale: ἔχω యొక్క ‘కలిగి ఉండు’ భావాన్ని తెలుగు వ్యక్తిసంబంధ వాక్యనిర్మాణంలో సహజమైన ‘తండ్రి ఉన్నాడు’గా ఇచ్చింది. సహవాసం లేదా చెందినవాడు వంటి నిర్దిష్ట వ్యాఖ్యానాన్ని చేర్చలేదు.
- source_word: ὁ ὁμολογῶν
  choice: ఒప్పుకునే వ్యక్తి
  rationale: ఇది సాధారణ వ్యక్తిని సూచించే విశేషణార్థక వర్తమాన కృదంతం. ‘ఒప్పుకునే’ అనేది కుమారుని బహిరంగంగా అంగీకరించడం లేదా ప్రకటించడం అనే ὁμολογέω భావాన్ని సందర్భానుకూలంగా అందిస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: ముందటి οὐδὲతో ఉన్న వ్యతిరేక సమాంతర నిర్మాణాన్ని ప్రతిబింబిస్తూ, కుమారుణ్ణి ఒప్పుకునే వ్యక్తికి తండ్రి కూడా ఉన్నాడనే అనుబంధాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ముద్రిత గ్రీకు పాఠంలో రెండో ఉపవాక్యం పాఠభేద సూచనతో ఉండటం
  choice: ‘కుమారుణ్ణి ఒప్పుకునే వ్యక్తికి తండ్రి కూడా ఉన్నాడు’ అనే రెండో ఉపవాక్యాన్ని ప్రధాన పాఠంలో చేర్చడం
  alternative: కొన్ని ప్రతుల్లో లేనందున రెండో ఉపవాక్యాన్ని వదలడం
  rationale: అందించిన SBLGNT పాఠం ఈ ఉపవాక్యాన్ని పాఠభేద సూచనతోనైనా ముద్రిత పాఠంలో ఉంచింది. అందువల్ల దాన్ని ప్రధాన పాఠంలో అనువదించి, ప్రతులలోని భేదాన్ని పాదసూచికలో తెలిపింది.
- issue: ‘తండ్రిని కలిగి ఉండటం’ అనే మాటలోని సంబంధార్థం
  choice: నిర్దిష్ట సిద్ధాంత వివరణగా విస్తరించకుండా ‘తండ్రి ఉన్నాడు/లేడు’ అనే మూలానికి సమీపమైన భావాన్ని ఉంచడం
  alternative: ‘తండ్రితో సహవాసం ఉంది’ లేదా ‘తండ్రికి చెందినవాడు’ అని వ్యాఖ్యానాత్మకంగా విస్తరించడం
  rationale: ఈ వాక్యం కుమారుని ఒప్పుకోవడానికీ తండ్రిని కలిగి ఉండడానికీ మధ్య విడదీయరాని సంబంధాన్ని చెబుతుంది. ఆ సంబంధాన్ని ఒకే సిద్ధాంత వర్గానికి పరిమితం చేయకుండా యోహాను వాడిన గంభీరమైన నుడికారాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘కుమారుడు’, ‘తండ్రి’ అనే నిర్దిష్ట క్రీస్తుసంబంధ మరియు దేవునిసంబంధ బిరుదులు నిలిపివేయబడ్డాయి. పాదసూచిక గుర్తు దానికి సంబంధించిన రెండో ఉపవాక్యం తర్వాత ఉంచబడింది.
