id: 1JN.2.3
reference: 1 John 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐν τούτῳ γινώσκομεν ὅτι ἐγνώκαμεν αὐτόν, ἐὰν τὰς ἐντολὰς αὐτοῦ τηρῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/003.yaml
  text: 'And by this we know that we have come to know him: if we keep his commandments[a].'
translation:
  language: te
  text: 'దీని ద్వారా మనకు తెలుసు: మనం ఆయన ఆజ్ఞలను పాటిస్తే, ఆయనను తెలుసుకున్నామని[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “ఆయనను తెలుసుకున్నామని.” గ్రీకు పరిపూర్ణ కాలరూపం, ఆయనను తెలుసుకోవడం గతంలో జరిగి దాని ఫలితం ప్రస్తుతం కొనసాగుతోందనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: దీనివల్ల
  rationale: ఈ వాక్యంలో ఏ ఆధారాన్ని బట్టి ఒక విషయం తెలుస్తుందో సూచించే యోహాను శైలిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని సూచనార్థక భావాన్ని నిలుపుతుంది.
- source_word: γινώσκομεν
  choice: మనకు తెలుస్తుంది
  rationale: ప్రస్తుత గుర్తింపు లేదా నిశ్చయాన్ని సూచించే వర్తమాన కాల భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: ఆయనను తెలుసుకున్నామని
  rationale: గ్రీకు పరిపూర్ణ కాలంలోని గతంలో తెలుసుకోవడం మొదలై ప్రస్తుతం కొనసాగుతున్న ఫలితాన్ని తెలుగు సందర్భంలో సహజంగా సూచిస్తుంది; ఆ కాలరూపంలోని సూక్ష్మభావాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: మూలంలో ఉన్న సర్వనామాన్నే ఉంచి, అది దేవుణ్ణి సూచిస్తుందా క్రీస్తును సూచిస్తుందా అనే విషయాన్ని అనవసరంగా నిర్దిష్టపరచదు.
- source_word: ἐὰν
  choice: పాటిస్తే
  rationale: షరతును తెలుగులో సహజంగా క్రియకు జోడించిన ‘-తే’ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἐντολάς
  choice: ఆజ్ఞలను
  rationale: యోహాను రచనలోని నైతిక, అధికారపూర్వక భావాన్ని కాపాడుతూ, ఆధునిక తెలుగు పాఠకులకు సులభంగా అర్థమయ్యే పదం.
- source_word: τηρῶμεν
  choice: మనం … పాటిస్తే
  rationale: τηρέωలోని కాపాడడం, ఆచరించడం, విధేయతతో అనుసరించడం అనే భావాలను ఈ సందర్భంలో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: αὐτόν (‘ఆయనను’) అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘ఆయనను’ అనే సర్వనామాన్నే నిలుపడం.
  alternative: ‘దేవుణ్ణి’ లేదా ‘యేసు/క్రీస్తును’ అని స్పష్టీకరించడం.
  rationale: గ్రీకు పాఠ్యం సర్వనామాన్నే వాడుతుంది. 1 యోహాను సందర్భం దేవుణ్ణి తెలుసుకోవడం, కుమారునితో సంబంధం అనే అంశాలను సన్నిహితంగా ఉంచుతుంది; కాబట్టి మూలం నిర్దిష్టపరచని చోట అనువాదం ఒకే సూచ్యార్థాన్ని బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: సహజమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. ‘ఆయన,’ ‘ఆజ్ఞలు’ అనే పదాలు బైబిలు సందర్భానికి తగిన గంభీరతను ఉంచినా పాతకాలపు శైలిగా అనిపించవు. షరతు వాక్యాన్ని ముందుంచడం తెలుగులో సహజంగా ఉండి, ఆ ఆజ్ఞలను పాటించడమే తెలుసుకున్నామనే దానికి ఆధారమని స్పష్టంగా చూపిస్తుంది.
