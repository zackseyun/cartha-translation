id: 1JN.2.27
reference: 1 John 2:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: te
  text: మీరు మాత్రం, ఆయన నుండి పొందిన అభిషేకం మీలో నిలిచి ఉంది.[b] ఎవరైనా మీకు బోధించవలసిన అవసరం మీకు లేదు. అయితే ఆయన అభిషేకం అన్నిటి గురించి మీకు బోధిస్తుంది; అది సత్యమైనది, అబద్ధం కాదు. అది మీకు బోధించినట్లే, ఆయనలో నిలిచి ఉండండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'కొన్ని ప్రాచీన ప్రతుల ప్రకారం: “అది మీకు బోధించినట్లే, మీరు ఆయనలో నిలిచి ఉన్నారు.”'
    reason: textual_variant
  - marker: b
    text: “నిలిచి ఉంది,” “నిలిచి ఉండండి” అనే రెండు చోట్లా గ్రీకులో ఒకే క్రియ వాడబడింది; దీనిని “నివసించి ఉంది / నివసించి ఉండండి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: అభిషేకం
  rationale: అభిషేకం అనే రూపకాన్ని యథాతథంగా ఉంచుతుంది; దానిని ప్రధాన పాఠ్యంలో ‘పరిశుద్ధాత్మ’ అని వివరణాత్మకంగా మార్చదు.
- source_word: ἀπ’ αὐτοῦ
  choice: ఆయన నుండి
  rationale: సర్వనామాన్ని అలాగే ఉంచి, దాని పూర్వపదాన్ని సందర్భం ద్వారా గుర్తించేందుకు అవకాశం ఇస్తుంది.
- source_word: μένει ἐν ὑμῖν / μένετε ἐν αὐτῷ
  choice: మీలో నిలిచి ఉంది / ఆయనలో నిలిచి ఉండండి
  rationale: రెండు చోట్ల ఉన్న μένω క్రియ పునరావృతిని సహజమైన ఆధునిక తెలుగులో సాధ్యమైనంత స్పష్టంగా నిలుపుతుంది.
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: ఎవరైనా మీకు బోధించవలసిన అవసరం మీకు లేదు
  rationale: గ్రీకు వాక్యపు బలాన్ని తగ్గించకుండా, దానిని సందర్భానికి మించి సిద్ధాంతపరంగా విస్తరించకుండా అనువదిస్తుంది.
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: బోధించవలసిన / బోధిస్తుంది / బోధించిన
  rationale: మూలంలోని ఒకే క్రియ పునరావృతిని తెలుగులోనూ నిలుపుతుంది.
- source_word: περὶ πάντων
  choice: అన్నిటి గురించి
  rationale: పదబంధం యొక్క విస్తృతిని పరిమితం చేయకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: అది సత్యమైనది, అబద్ధం కాదు
  rationale: యోహాను రచనలోని సత్యం–అబద్ధం వ్యతిరేకతను నేరుగా, స్పష్టంగా ఉంచుతుంది.
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: అది మీకు బోధించిన ప్రకారం
  rationale: అభిషేకం చేసిన బోధనకు చివరి ఆజ్ఞను అనుసంధానించే తులనాత్మక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: χρῖσμα అనే ‘అభిషేకం’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘అభిషేకం’ అనే రూపకమే ఉంచబడింది.
  alternative: పరిశుద్ధాత్మ; స్వీకరించిన సందేశం/సువార్త
  rationale: సందర్భంలో ఇది ఆత్మ యొక్క సన్నిధిని లేదా బోధనా కార్యాన్ని సూచించే అవకాశం ఉన్నా, వచనం స్వయంగా రూపకాన్నే ఉపయోగిస్తుంది; కాబట్టి నిర్దిష్ట వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చలేదు.
- issue: ‘ఎవరైనా మీకు బోధించవలసిన అవసరం లేదు’ అనే మాట యొక్క పరిధి
  choice: మూలంలో ఉన్నట్లే బలంగా ఉంచబడింది.
  alternative: మానవ బోధకులందరినీ పూర్తిగా నిరాకరించడం; విడిపోయినవారి బోధ మాత్రమే అవసరం లేదని స్పష్టీకరించడం
  rationale: మూలవాక్యాన్ని మెత్తబరచలేదు; అదే సమయంలో సందర్భం చెప్పని సిద్ధాంతపరమైన వివరణను అనువాదంలో చేర్చలేదు.
- issue: చివరి μένετε క్రియ యొక్క విధి
  choice: ఆజ్ఞార్థకంగా ‘నిలిచి ఉండండి’
  alternative: నిశ్చయార్థకంగా ‘మీరు ఆయనలో నిలిచి ఉన్నారు’
  rationale: SBLGNTలోని పాఠాన్ని సందర్భానుసారంగా ఆజ్ఞార్థకంగా తీసుకున్నాం; ప్రత్యామ్నాయ పాఠభేదాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘అభిషేకం’ అనే పరిచితమైన బైబిలు రూపకం నిలుపబడింది. బహువచన ‘మీరు’ సందర్భం ద్వారా స్పష్టమవుతుంది; ‘ఆయన’ అనే సర్వనామం మూలంలోని అస్పష్టతను కాపాడుతుంది.
