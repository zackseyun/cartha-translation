id: 1JN.2.18
reference: 1 John 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: te
  text: పిల్లలారా, ఇది చివరి ఘడియ. క్రీస్తువిరోధి వస్తున్నాడని మీరు విన్నట్టే, ఇప్పుడు అనేకమంది క్రీస్తువిరోధులు ఉద్భవించారు.[a] దీనినిబట్టి ఇది చివరి ఘడియ అని మనకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వచ్చారు,’ ‘కనిపించారు.’ గ్రీకు సంపూర్ణ కాల క్రియ అనేకమంది క్రీస్తువిరోధులు ఉద్భవించి, ఇప్పుడు ఉనికిలో ఉన్నారని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδία
  choice: పిల్లలారా
  rationale: సంబోధన రూపంలో ఉన్న ఈ పదం సంఘంతో రచయితకు గల ఆప్యాయమైన కుటుంబ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐσχάτη ὥρα
  choice: చివరి ఘడియ
  rationale: అంత్యకాల ప్రాధాన్యమున్న కాలరూపకాన్ని అలాగే ఉంచుతుంది; దాన్ని అక్షరార్థమైన అరవై నిమిషాల కాలంగా గానీ, నిర్దిష్ట అంత్యకాల పథకంగా గానీ కుదించదు.
- source_word: καθὼς ἠκούσατε
  choice: మీరు విన్నట్టే
  rationale: వారు ఇంతకు ముందు పొందిన బోధకు, ప్రస్తుత పరిస్థితికి మధ్య ఉన్న అనురూపతను సహజంగా తెలియజేస్తుంది.
- source_word: ἀντίχριστος
  choice: క్రీస్తువిరోధి
  rationale: యోహాను రచనలలోని ప్రత్యేక పదాన్ని స్పష్టంగా అందిస్తూ, క్రీస్తుకు వ్యతిరేకమైన వ్యక్తి లేదా పాత్ర అనే భావాన్ని నిలుపుతుంది. గ్రీకులో నిర్దిష్ట ఉపపదం లేకున్నా, తెలుగు వాక్య నిర్మాణంలో అది ప్రత్యేకంగా గుర్తింపబడిన రాబోయే రూపాన్ని సూచించగలదు.
- source_word: ἔρχεται
  choice: వస్తున్నాడు
  rationale: ప్రస్తుతం ఎదురుచూస్తున్న రాకను సూచించే గ్రీకు వర్తమాన కాలపు భవిష్యదర్థ బలాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: καὶ νῦν
  choice: ఇప్పుడు కూడా
  rationale: రాబోయే ఏకవచన క్రీస్తువిరోధి గురించి విన్న సంగతికి, ఇప్పటికే ఉన్న అనేకమంది క్రీస్తువిరోధులకు మధ్య సంబంధాన్ని చూపుతుంది.
- source_word: ἀντίχριστοι πολλοὶ
  choice: అనేకమంది క్రీస్తువిరోధులు
  rationale: ఏకవచన పదంతో ఉన్న పదబంధ సంబంధాన్ని నిలుపుతూ, వ్యక్తులను సూచిస్తున్నందున ‘మంది’ వాడటం తెలుగులో సహజం.
- source_word: γεγόνασιν
  choice: ఉద్భవించారు
  rationale: వారు రంగప్రవేశం చేసి ఇప్పుడు ఉనికిలో ఉన్నారనే గ్రీకు సంపూర్ణ కాల భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ὅθεν γινώσκομεν
  choice: దీనివల్ల ... మనకు తెలుసు
  rationale: ముందు చెప్పిన అనేకమంది క్రీస్తువిరోధుల ఉద్భవం ఆధారంగా తీసుకునే నిర్ణయాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘చివరి ఘడియ’ అర్థం
  choice: అంత్యకాలానికి చెందిన నిర్ణాయక దశను సూచించే కాలరూపకంగా అనువదించడం
  alternative: అక్షరార్థమైన తక్షణ అరవై నిమిషాల కాలం లేదా కేవలం సంక్షోభాన్ని సూచించే అలంకార వాక్యంగా స్పష్టం చేయడం
  rationale: మూలపాఠం అంత్యకాల ప్రాధాన్యాన్ని సూచిస్తుంది గాని దాని ఖచ్చిత కాలవ్యవధిని వివరించదు; అందువల్ల రూపకంలోని ఉద్రిక్తతను అలాగే ఉంచాం.
- issue: ఏకవచన ‘క్రీస్తువిరోధి’ మరియు బహువచన ‘క్రీస్తువిరోధులు’ మధ్య సంబంధం
  choice: ఎదురుచూస్తున్న ఏకవచన రూపాన్నీ, ప్రస్తుతం ఉద్భవించిన బహువచన రూపాలనూ సమన్వయపరచకుండా అలాగే నిలుపడం
  alternative: ఏకవచనాన్ని కేవలం ఒక వర్గంగా లేదా పూర్తిగా నిర్వచితమైన ఒకే వ్యక్తిగా వ్యాఖ్యానించి స్పష్టం చేయడం
  rationale: యోహాను ఉద్దేశపూర్వకంగా ఏకవచన నిరీక్షణను ప్రస్తుత బహువచన వాస్తవంతో పక్కపక్కన ఉంచాడు; అనువాదం ఏదో ఒక అంత్యకాల వ్యవస్థను పాఠ్యంలోకి చొప్పించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పిల్లలారా’ ఆప్యాయమైన కాపరి సంబోధనను నిలుపుతుంది. ‘చివరి ఘడియ’ గంభీరతను కాపాడుతుంది; ‘క్రీస్తువిరోధి’ అనే పదం ఏకవచన-బహువచన పదబంధ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
