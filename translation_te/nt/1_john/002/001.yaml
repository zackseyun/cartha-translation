revisions:
- from: నా చిన్న పిల్లలారా, మీరు పాపం చేయకుండా ఉండాలని ఈ సంగతులు మీకు రాస్తున్నాను. అయినా ఎవరైనా పాపం చేస్తే, తండ్రి సమక్షంలో మన పక్షాన వాదించే వ్యక్తి మనకు ఉన్నాడు[a]—నీతిమంతుడైన యేసు మెస్సీయ[b].
  to: నా చిన్న పిల్లలారా, మీరు పాపం చేయకుండా ఉండాలని నేను ఈ సంగతులు మీకు రాస్తున్నాను. అయితే ఎవరైనా పాపం చేస్తే, తండ్రి యొద్ద మన పక్షాన వాదించే వ్యక్తి మనకు ఉన్నాడు[a]—నీతిమంతుడైన యేసు మెస్సీయ[b].
  rationale: The revision removes the over-specific ‘in the presence of the Father’ nuance, retains the contextual advocacy sense without turning it into a fixed legal technical term, and smooths the conditional transition. It preserves the source’s ambiguity and the draft’s title rendering ‘మెస్సీయ.’
