id: 1JN.2.1
reference: 1 John 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: te
  text: నా చిన్న పిల్లలారా, మీరు పాపం చేయకుండా ఉండాలని నేను ఈ సంగతులు మీకు రాస్తున్నాను. అయితే ఎవరైనా పాపం చేస్తే, తండ్రి యొద్ద మన పక్షాన వాదించే వ్యక్తి మనకు ఉన్నాడు[a]—నీతిమంతుడైన యేసు మెస్సీయ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మన పక్షాన వాదించే వ్యక్తి’ అని అనువదించిన గ్రీకు పదం παράκλητος. సందర్భానుసారం దీనికి ‘సహాయకుడు,’ ‘సలహాదారు,’ లేదా ‘ఆదరణకర్త’ అనే విస్తృత భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'సంప్రదాయ అనువాదం: ‘యేసు క్రీస్తు.’ గ్రీకు Χριστός అనే బిరుదుకు ‘మెస్సీయ’ అనే అర్థం ఉంది; అది ‘క్రీస్తు’ అనే పేరువంటి రూపంలోనూ వాడబడుతుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τεκνία μου
  choice: నా చిన్న పిల్లలారా
  rationale: τεκνία అనే ఆప్యాయ సంబోధనలోని కుటుంబ రూపకాన్నీ, మృదుత్వాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ταῦτα γράφω ὑμῖν
  choice: ఈ సంగతులు మీకు రాస్తున్నాను
  rationale: వర్తమానకాల లేఖా సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ταῦτα ను అతిగా నిర్దిష్టం చేయకుండా ‘ఈ సంగతులు’గా ఉంచుతుంది.
- source_word: ἵνα μὴ ἁμάρτητε
  choice: మీరు పాపం చేయకుండా ఉండాలని
  rationale: ἵνα తో కూడిన ప్రయోజనార్థక భావాన్ని స్పష్టంగా తెలియజేస్తుంది; సంపూర్ణ పాపరాహిత్యంపై వాక్యానికి మించిన సిద్ధాంతార్థాన్ని మోపదు.
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: అయినా ఎవరైనా పాపం చేస్తే
  rationale: ముందటి ఉద్దేశ్య వాక్యానికీ, సంభవించగల వైఫల్యానికీ మధ్య ఉన్న స్వల్ప వ్యతిరేకతను ‘అయినా’ సహజంగా చూపుతుంది.
- source_word: παράκλητον
  choice: మన పక్షాన వాదించే వ్యక్తి
  rationale: తండ్రి సమక్షంలో యేసు ప్రతినిధిగా, సమర్థకుడిగా ఉండే సందర్భార్థాన్ని తెలియజేస్తుంది; పదంలోని విస్తృత భావపరిధిని పాదటిప్పణిలో భద్రపరుస్తుంది.
- source_word: πρὸς τὸν πατέρα
  choice: తండ్రి సమక్షంలో
  rationale: πρός ఇక్కడ సూచించే తండ్రితో సన్నిహిత సాన్నిధ్యాన్నీ, ఆయన ఎదుట ప్రతినిధిత్వ సందర్భాన్నీ తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: Ἰησοῦν Χριστὸν
  choice: యేసు మెస్సీయ
  rationale: Χριστός ను ఇక్కడ బిరుదుగా గ్రహించి ‘మెస్సీయ’గా అనువదిస్తుంది; సంప్రదాయ ‘క్రీస్తు’ రూపాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: δίκαιον
  choice: నీతిమంతుడైన
  rationale: Ἰησοῦν Χριστόν తో ఏకీభవించే విశేషణాన్ని సహజమైన తెలుగులో నిలుపుతూ, యేసు స్వభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἵνα μὴ ἁμάρτητε లో పాపరాహిత్య భావం
  choice: రచయిత ఉద్దేశ్యంగా ‘పాపం చేయకుండా ఉండాలని’
  alternative: సాధించబడిన సంపూర్ణ పాపరాహిత్య ప్రకటన
  rationale: తర్వాతి ‘ఎవరైనా పాపం చేస్తే’ అనే షరతును అలాగే ఉంచి, వాక్యంలోని ఉద్దేశ్యానికీ మానవ వైఫల్య సంభావ్యతకీ మధ్య ఉన్న ఉద్వేగాన్ని కాపాడుతుంది.
- issue: Χριστός యొక్క క్రీస్తుశాస్త్ర సంబంధ బిరుదు
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ నిర్మాణంలో Χριστός బిరుదుగా వినిపిస్తుంది; అందువల్ల అర్థాన్ని తెలిపే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో ఉంచి, పరిచితమైన సంప్రదాయ రూపాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
- issue: παράκλητος యొక్క పాత్ర
  choice: మన పక్షాన వాదించే వ్యక్తి
  alternative: సహాయకుడు / ఆదరణకర్త / సలహాదారు
  rationale: తండ్రి సమక్షం అనే సందర్భంలో సమర్థకుడు లేదా ప్రతినిధి అనే భావం ప్రధానంగా కనిపిస్తుంది; అయినా గ్రీకు పదం యొక్క విస్తృత భావపరిధిని ఒక్క న్యాయపరమైన అర్థానికే పరిమితం చేయకుండా పాదటిప్పణిలో సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆప్యాయమైన అపొస్తలీయ సంబోధనకు గౌరవప్రదమైన శైలి. న్యాయపరమైన రూపకాన్ని సాధారణ పాఠకుడికి స్పష్టంగా చేస్తూ, మూలంలోని అర్థవిస్తృతిని పాదటిప్పణుల్లో నిలుపుతుంది.
