id: 1JN.2.7
reference: 1 John 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: te
  text: ప్రియులారా, నేను మీకు కొత్త ఆజ్ఞను రాయడం లేదు; మొదటి నుంచీ మీకు ఉన్న పాత ఆజ్ఞనే రాస్తున్నాను. ఆ పాత ఆజ్ఞ మీరు విన్న సందేశమే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా ‘వాక్యం’: ‘ఆ పాత ఆజ్ఞ మీరు విన్న వాక్యమే.’'
    reason: λόγος అనే గ్రీకు పదానికి ఇక్కడ ‘సందేశం’ అనే అర్థం సహజమైనప్పటికీ, ‘వాక్యం’ అనేది సాధ్యమైన మరింత అక్షరార్థ అనువాదం.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: ప్రియులారా
  rationale: బహువచన సంబోధనలోని ఆప్యాయతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ἀγαπάω/ἀγάπηతో ఉన్న భావసంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: ἐντολήν
  choice: ఆజ్ఞ
  rationale: యోహాను రచనల్లో ఈ పదానికి ఉన్న ప్రాముఖ్యతను నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా మరియు గంభీరంగా ఉంటుంది.
- source_word: καινήν
  choice: కొత్త
  rationale: παλαιάν అనే ‘పాత’ పదంతో ఉన్న ప్రత్యక్ష వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: γράφω
  choice: రాయడం లేదు / రాస్తున్నాను
  rationale: లేఖ రాస్తున్న ప్రస్తుత చర్యను తెలుగులో సహజంగా తెలియజేస్తుంది; రెండవ భాగంలో గ్రీకులో భావింపబడిన క్రియను స్పష్టత కోసం పునరుక్తి చేసింది.
- source_word: παλαιάν / παλαιά
  choice: పాత
  rationale: ‘కొత్త’కు నేరుగా వ్యతిరేకమైన సాధారణ పదం; ‘ప్రాచీనమైన’ వంటి అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: εἴχετε
  choice: మీకు ఉన్న
  rationale: గతంలో మొదలై కొనసాగిన స్వాధీనాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπ’ ἀρχῆς
  choice: మొదటి నుంచీ
  rationale: దేని మొదలు అన్నది నిర్దిష్టంగా చెప్పకుండా గ్రీకు వాక్యంలోని విస్తృతతను కాపాడుతుంది.
- source_word: λόγος
  choice: సందేశం
  rationale: ఇక్కడ వారు విన్న ప్రకటిత విషయాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; ‘వాక్యం’ అనే సాధ్యమైన అక్షరార్థాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: ἠκούσατε
  choice: మీరు విన్న
  rationale: గ్రీకు ఏఓరిస్ట్‌ను సూటిగా, సహజమైన భూతకాల రూపంలో అందిస్తుంది.
theological_decisions:
- issue: ‘మొదటి నుంచీ’ అనే మాట దేనిని సూచిస్తుంది?
  choice: ‘మొదటి నుంచీ’ అని మాత్రమే ఉంచి, దాని పరిధిని నిర్దిష్టం చేయలేదు.
  alternative: ‘మీ క్రైస్తవ జీవితం మొదలైనప్పటి నుంచీ’ లేదా ‘సువార్త ప్రకటన మొదలైనప్పటి నుంచీ’
  rationale: సమీప సందర్భం వారు మొదట విన్న బోధను సూచించినప్పటికీ, మూలపాఠం దానిని సంకుచితంగా నిర్వచించదు; అందువల్ల అసలు సందిగ్ధతను నిలిపింది.
- issue: పాత ఆజ్ఞకు వారు విన్న λόγοςతో ఉన్న సంబంధం
  choice: పాత ఆజ్ఞను వారు విన్న ‘సందేశం’తో నేరుగా సమీకరించింది.
  alternative: సమీప వచనాల ఆధారంగా ఆ ఆజ్ఞ లేదా సందేశం ఏమిటో వివరణ జోడించడం
  rationale: గ్రీకు వాక్యం చేసిన సమీకరణను మాత్రమే నిలిపి, అదనపు సిద్ధాంతపరమైన వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆప్యాయమైన పాస్టరల్ సంబోధనతో, సూటిగా మరియు గౌరవప్రదంగా ఉంది. విరోధ నిర్మాణాన్ని సహజంగా చేయడానికి రెండవ భాగంలో ‘రాస్తున్నాను’ను స్పష్టంగా పునరుద్ధరించింది. పాదటిప్పణి గుర్తును సంబంధిత ‘సందేశమే’ తరువాత ఉంచింది.
