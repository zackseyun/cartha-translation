id: 1JN.2.13
reference: 1 John 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: te
  text: తండ్రులారా, ఆది నుండి ఉన్నవానిని[a] మీరు ఎరిగారు కాబట్టి నేను మీకు రాస్తున్నాను. యువకులారా, మీరు దుష్టుని జయించారు కాబట్టి నేను మీకు రాస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ మాట బహుశా కుమారుణ్ణి సూచిస్తుంది; అయితే కొందరు దీన్ని దేవుణ్ణి విస్తృతంగా సూచించే మాటగా అర్థం చేసుకుంటారు.
    reason: సూచించబడిన వ్యక్తి గురించి మూలపాఠ్యంలో ఉన్న అనిర్దిష్టతను తెలియజేయడం.
lexical_decisions:
- source_word: γράφω
  choice: రాస్తున్నాను
  rationale: లేఖా సందర్భంలోని వర్తమాన కాల క్రియను సహజమైన తెలుగు కొనసాగుతున్న వర్తమాన రూపంలో వ్యక్తం చేస్తుంది; రచయిత రాస్తున్న ప్రస్తుత చర్యను స్పష్టంగా ఉంచుతుంది.
- source_word: πατέρες
  choice: తండ్రులారా
  rationale: సంబోధన బహువచనంలోని అక్షరార్థాన్ని నిలుపుతుంది. సందర్భంలో ఇది ఆత్మీయ పరిపక్వత గల పురుషులను సూచించవచ్చు గాని, ప్రధాన పాఠ్యంలో ‘పెద్దలారా’ అని వ్యాఖ్యానాత్మకంగా మార్చలేదు.
- source_word: ἐγνώκατε
  choice: మీరు ఎరిగారు
  rationale: పూర్తయి కొనసాగుతున్న పరిచయజ్ఞానాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం సమాచారం తెలుసుకోవడం కంటే వ్యక్తిని ఎరుగడాన్ని సూచిస్తుంది.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: ఆదినుండి ఉన్నవానిని
  rationale: మూలంలోని నామవాచకంగా పనిచేసే పదబంధాన్ని, దాని వ్యక్తిగత సూచనను నిలుపుతూ అనువదిస్తుంది; ఆ వ్యక్తి ఎవరో ప్రధాన పాఠ్యంలో స్పష్టీకరించదు.
- source_word: νεανίσκοι
  choice: యువకులారా
  rationale: మూలంలోని పుంలింగ బహువచన సంబోధనను సహజంగా, ఖచ్చితంగా ప్రతిబింబిస్తుంది.
- source_word: νενικήκατε
  choice: మీరు ... జయించారు
  rationale: సాధించిన విజయాన్ని, దాని కొనసాగుతున్న ఫలితాన్ని సందర్భానుసారంగా తెలియజేస్తుంది; యోహాను రచనల్లోని విజయ భావాన్ని నిలుపుతుంది.
- source_word: τὸν πονηρόν
  choice: దుష్టుణ్ణి
  rationale: పుంలింగ ఏకవచన సబ్స్టాంటివ్ రూపం వ్యక్తిగత దుష్ట ప్రత్యర్థిని సూచిస్తుందని తెలుపుతుంది; మూలంలో లేని ‘సాతాను’ అనే పేరును చేర్చదు.
theological_decisions:
- issue: ‘ఆదినుండి ఉన్నవాడు’ ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘ఆదినుండి ఉన్నవానిని’ అని మాత్రమే ఉంచడం
  alternative: కుమారుడు/మెస్సీయ అని స్పష్టీకరించడం; లేదా దేవుణ్ణి విస్తృతంగా సూచించిందని గ్రహించడం
  rationale: యోహాను వాడుకలో ఇది బహుశా కుమారుణ్ణి సూచిస్తుంది; అయితే ఈ వాక్యంలో గ్రీకు పాఠ్యం ఆయనను పేరుపెట్టి గుర్తించదు. అందువల్ల అసలు పాఠ్యంలోని ఉద్దేశపూర్వక అనిర్దిష్టతను నిలిపాం.
- issue: ‘దుష్టుడు’ అనే పదబంధం యొక్క అర్థం
  choice: వ్యక్తిగత దుష్ట ప్రత్యర్థిగా అనువదించడం
  alternative: అమూర్తమైన చెడుగా అనువదించడం
  rationale: పుంలింగ ఏకవచన నిర్దిష్ట రూపం వ్యక్తిని బలంగా సూచిస్తుంది. అయినా మూలంలో లేని ప్రత్యేక పేరును చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన లేఖా శైలిని ఉపయోగించాం. రెండు సమాంతర సంబోధనల నిర్మాణాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు సంబోధనను వాక్యారంభంలో ఉంచాం.
