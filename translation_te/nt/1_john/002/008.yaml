id: 1JN.2.8
reference: 1 John 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: te
  text: మళ్లీ, నేను మీకు ఒక కొత్త ఆజ్ఞను రాస్తున్నాను; అది ఆయనలోను మీలోను సత్యమైనది[a], ఎందుకంటే చీకటి గతించిపోతూ ఉంది, నిజమైన వెలుగు ఇప్పటికే ప్రకాశిస్తోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అది దానిలోను మీలోను సత్యమైనది.” ఇక్కడ “దానిలో” అనేది ఆజ్ఞను సూచిస్తున్నదిగా తీసుకోవచ్చు.
    reason: αὐτῷ అనే సర్వనామాన్ని ఆజ్ఞను సూచించేదిగా తీసుకునే ప్రత్యామ్నాయ అవగాహనను భద్రపరచడం.
lexical_decisions:
- source_word: πάλιν
  choice: మరోవైపు
  rationale: మునుపటి వచనంలోని ‘కొత్త ఆజ్ఞ కాదు’ అనే మాటకు భిన్నమైన మరో కోణాన్ని పరిచయం చేస్తుంది. తెలుగు సందర్భంలో ‘మరోవైపు’ ఈ భావసంబంధాన్ని సహజంగా చూపిస్తుంది.
- source_word: ἐντολὴν καινὴν
  choice: ఒక కొత్త ఆజ్ఞను
  rationale: కొత్త స్వభావం లేదా గుణం గల ఆజ్ఞ అనే భావాన్ని, యోహాను రచనలలోని స్థిరమైన పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: γράφω
  choice: రాస్తున్నాను
  rationale: ప్రస్తుతం కొనసాగుతున్న పత్రరచనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅ ἐστιν ἀληθὲς
  choice: అది ... నిజమై ఉంది
  rationale: నపుంసక ఏకవచన సంబంధసర్వనామం ముందున్న ఆజ్ఞ లేదా ఆ భావం మొత్తాన్ని సూచించగలదు; ‘అది’ ఈ సంబంధాన్ని స్పష్టంగా, సహజంగా ఉంచుతుంది.
- source_word: ἐν αὐτῷ καὶ ἐν ὑμῖν
  choice: ఆయనలోనూ మీలోనూ
  rationale: αὐτῷ రూపం సందర్భంలో క్రీస్తును సూచించే వ్యక్తిగత సర్వనామంగా సహజంగా అర్థమవుతుంది; రెండు సమాంతర పదబంధాలనూ నిలిపింది.
- source_word: ἡ σκοτία παράγεται
  choice: చీకటి గతించిపోతూ ఉంది
  rationale: చీకటి తొలగిపోతున్న నిరంతర ప్రక్రియను వర్తమాన కాల భావంతో వ్యక్తం చేస్తుంది.
- source_word: τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει
  choice: నిజమైన వెలుగు ఇప్పటికే ప్రకాశిస్తోంది
  rationale: యోహాను రచనలలోని ‘నిజమైన వెలుగు’ పదబంధాన్ని కాపాడుతూ, ἤδη సూచించే ఇప్పటికే ఆరంభమైన వాస్తవాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ἐν αὐτῷ లోని αὐτῷ ఎవరిని లేదా దేనిని సూచిస్తుంది?
  choice: ‘ఆయనలో’—సందర్భంలో క్రీస్తును సూచించేదిగా ప్రధాన పాఠ్యంలో అనువదించబడింది.
  alternative: ‘దానిలో’—ఆజ్ఞను సూచించేదిగా తీసుకోవచ్చు.
  rationale: పుంలింగ సర్వనామం వ్యక్తిగత సూచనకు, యోహాను సందర్భంలో క్రీస్తుకు, ఎక్కువగా అనుకూలిస్తుంది. అయితే వాక్య నిర్మాణం వల్ల ఆజ్ఞను సూచించే అవకాశాన్ని పూర్తిగా తొలగించకుండా పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘మరోవైపు’ 7వ వచనంతో ఉన్న భావవ్యతిరేక సంబంధాన్ని తెలియజేస్తుంది; ‘గతించిపోతూ ఉంది’ మరియు ‘ఇప్పటికే ప్రకాశిస్తోంది’ అనే రూపాలు గ్రీకు వర్తమాన క్రియల కొనసాగుతున్న స్వభావాన్ని నిలుపుతాయి.
