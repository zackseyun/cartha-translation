revisions:
- from: మరోవైపు, నేను మీకు ఒక కొత్త ఆజ్ఞను రాస్తున్నాను. అది ఆయనలోనూ మీలోనూ నిజమై ఉంది[a]; ఎందుకంటే చీకటి గతించిపోతూ ఉంది, నిజమైన వెలుగు ఇప్పటికే ప్రకాశిస్తోంది.
  to: మళ్లీ, నేను మీకు ఒక కొత్త ఆజ్ఞను రాస్తున్నాను; అది ఆయనలోను మీలోను సత్యమైనది[a], ఎందుకంటే చీకటి గతించిపోతూ ఉంది, నిజమైన వెలుగు ఇప్పటికే ప్రకాశిస్తోంది.
