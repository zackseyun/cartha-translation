source:
  edition: SBLGNT
  text: ὁ λέγων ἐν αὐτῷ μένειν ὀφείλει καθὼς ἐκεῖνος περιεπάτησεν καὶ ⸀αὐτὸς περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: te
  text: ఆయనలో నిలిచి ఉన్నానని చెప్పేవాడు, ఆయన ఎలాగు నడిచాడో, తాను కూడా అలాగే నడుచుకోవాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిలిచి ఉండడం’ అని అనువదించిన గ్రీకు పదం μένω; ఇది కొనసాగడం, స్థిరంగా ఉండడం, సంబంధంలో నిలిచి ఉండడం అనే భావాలను కలిగిన యోహాను రచనల్లోని కీలక పదం.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘నడవడం/నడుచుకోవడం’ అనేది ఒకరి జీవన విధానానికి రూపకం. అంటే, ఆయన జీవించినట్లే తాను కూడా జీవించాలి. సందర్భంలో ‘ఆయన’ యేసును సూచిస్తుంది; గ్రీకులో ఈ సర్వనామానికి ప్రత్యేక నిర్దేశక బలం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: చెప్పుకునేవాడు
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతం ఒక ప్రతినిధి వ్యక్తిని సూచిస్తుంది. సందర్భంలో ఇది కేవలం పలకడాన్ని కాక, తన గురించి ఒక వాదన చేసుకోవడాన్ని సూచిస్తున్నందున ‘చెప్పుకునేవాడు’ సహజంగా ఉంది.
- source_word: ἐν αὐτῷ μένειν
  choice: ఆయనలో నిలిచి ఉన్నానని
  rationale: μένω యోహాను రచనల్లో కొనసాగడం, నిలిచి ఉండడం, సంబంధంలో స్థిరంగా ఉండడం అనే భావాలను కలిగిన కీలక పదం. ‘నిలిచి ఉండడం’ ఆ భావవ్యాప్తిని కాపాడుతుంది; తెలుగులో ప్రత్యక్ష వాదన రూపం వాక్యాన్ని సహజంగా చేస్తుంది.
- source_word: ὀφείλει
  choice: నడుచుకోవాలి
  rationale: ὀφείλει నైతిక బాధ్యతను తెలియజేస్తుంది. ‘చాలి’ రూపం అతి న్యాయపరంగా కాకుండా ఆ బాధ్యతను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: καθὼς
  choice: నట్లే
  rationale: పద్ధతి లేదా సారూప్యతను సూచించే καθώς యొక్క బలాన్ని ‘ఎలాగో అలాగే’ అనే భావంతో ‘నట్లే’ సహజంగా అందిస్తుంది.
- source_word: ἐκεῖνος
  choice: ఆయన
  rationale: ἐκεῖνοςకు ఉన్న నిర్దేశక బలం తెలుగులో ‘ఆయన’ అనే గౌరవ ఏకవచన సర్వనామంతో సహజంగా వ్యక్తమవుతుంది. సందర్భానుసారం ఇది యేసును సూచిస్తుంది; ‘ఆ వ్యక్తి’ అనడం తెలుగులో అసహజంగా, దూరంగా వినిపిస్తుంది.
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: నడిచినట్లే ... నడుచుకోవాలి
  rationale: περιπατέω జీవన విధానానికి రూపకం. మొదటి ప్రయోగంలో ‘నడిచిన’ రూపకాన్ని నిలుపుతూ, రెండవదిలో తెలుగులో జీవన ప్రవర్తనను సహజంగా సూచించే ‘నడుచుకోవాలి’ వాడటం రూపకాన్నీ అర్థాన్నీ కాపాడుతుంది.
- source_word: καὶ αὐτὸς
  choice: తాను కూడా
  rationale: αὐτός ఇచ్చే కర్తృప్రాధాన్యాన్ని ‘తాను’, καί యొక్క అనుబంధ బలాన్ని ‘కూడా’ స్పష్టంగా తెలియజేస్తాయి.
theological_decisions:
- issue: αὐτῷ మరియు ἐκεῖνος ఎవరిని సూచిస్తున్నాయి
  choice: రెండింటినీ సందర్భానుసారం యేసును సూచించే ‘ఆయన’గా అనువదించడం
  alternative: మొదటిదాన్ని ‘ఆయనలో’గా, ἐκεῖνοςను మరింత అక్షరార్థంగా ‘ఆ వ్యక్తి’గా అనువదించడం
  rationale: ముందున్న సందర్భం (1 యోహాను 2:1–2) యేసుక్రీస్తును సూచిస్తుంది. అయితే మూలపాఠంలో పేరు ప్రత్యక్షంగా లేనందున ప్రధాన వాక్యంలో ‘యేసు’ అని చేర్చకుండా సర్వనామాన్ని ఉంచి, సూచిత వ్యక్తిని పాదసూచికలో వివరిస్తుంది.
- issue: περιπατέω రూపక స్వభావం
  choice: ‘నడిచినట్లే ... నడుచుకోవాలి’ అని రూపకాన్ని నిలుపడం
  alternative: ‘జీవించినట్లే ... జీవించాలి’ అని అర్థాన్ని నేరుగా చెప్పడం
  rationale: నడక అనే బైబిలీయ రూపకం వ్యక్తి జీవన విధానాన్ని సూచిస్తుంది. తెలుగులో ‘నడుచుకోవడం’ ప్రవర్తనకు సహజమైన ప్రయోగం కాబట్టి రూపకాన్నీ నైతిక భావాన్నీ రెండింటినీ నిలుపుతుంది.
- issue: μένω యొక్క సంబంధాత్మక, నిరంతర భావం
  choice: ‘నిలిచి ఉన్నాను’
  alternative: ‘ఉన్నాను’ లేదా ‘నివసిస్తున్నాను’
  rationale: ‘నిలిచి ఉండడం’ కొనసాగింపు, స్థిరత్వం, సంబంధంలో ఉండడం అనే యోహానీయ భావాలను తెరిచి ఉంచుతుంది; కేవలం స్థల నివాసంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఆయన’ ద్వారా సందర్భంలోని క్రీస్తు సూచనను సహజంగా ఉంచింది; మూలంలో లేని పేరును ప్రధాన పాఠ్యంలో చేర్చలేదు. ‘నిలిచి ఉండడం’ అనే యోహానీయ కీలక పదబంధం మరియు ‘నడక’ అనే జీవన రూపకం కాపాడబడ్డాయి.
