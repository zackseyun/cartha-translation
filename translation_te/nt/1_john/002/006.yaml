revisions:
- from: ఆయనలో నిలిచి ఉన్నానని చెప్పుకునేవాడు, ఆయన నడిచినట్లే తాను కూడా నడుచుకోవాలి.[a][b]
  to: ఆయనలో నిలిచి ఉన్నానని చెప్పేవాడు, ఆయన ఎలాగు నడిచాడో, తాను కూడా అలాగే నడుచుకోవాలి.[a][b]
  rationale: The sole textual revision replaces “చెప్పుకునేవాడు” with the neutral “చెప్పేవాడు,” avoiding an unnecessary implication of boastfulness. The comparison is recast as “ఆయన ఎలాగు నడిచాడో, తాను కూడా అలాగే నడుచుకోవాలి” for clearer modern Telugu while preserving καθώς, the aorist “walked,” and the emphatic/additive sense of καὶ αὐτός. The updated footnote also records the demonstrative force of ἐκεῖνος.
