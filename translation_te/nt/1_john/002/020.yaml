  yaml_path: translation/nt/1_john/002/020.yaml
  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: te
  text: అయితే మీకు పరిశుద్ధుని నుండి అభిషేకం ఉంది, మరియు మీరందరికీ తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరొక పాఠభేదం ప్రకారం, “మీకు అన్నీ తెలుసు.” SBLGNT పాఠం “మీరందరికీ తెలుసు” అనే అర్థానికి మద్దతిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: అయితే
  rationale: మునుపటి వచనంలోని క్రీస్తువిరోధులతో పాఠకులను వ్యత్యాసపరుస్తున్న సందర్భంలో, καί యొక్క సందర్భానుగుణ విరుద్ధ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὑμεῖς
  choice: మీరు
  rationale: గ్రీకులో స్పష్టంగా ఉన్న సర్వనామం వ్యత్యాసాన్ని నొక్కిచెబుతుంది; తెలుగులో ‘అయితే మీరు’ అనే నిర్మాణం ఆ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: χρῖσμα ἔχετε
  choice: అభిషేకం పొందినవారు
  rationale: χρῖσμα అనే అభిషేక రూపకాన్ని నిలుపుతూ, ἔχετε సూచించే ప్రస్తుత స్వాధీన స్థితిని సహజమైన తెలుగు ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τοῦ ἁγίου
  choice: పరిశుద్ధుని నుండి
  rationale: దేవుని బిరుదుగా ఉన్న ‘పరిశుద్ధుడు’ అనే భావాన్ని నిలుపుతుంది; అది తండ్రినో కుమారునో అని అనువాదంలో నిర్దిష్టం చేయదు.
- source_word: καὶ οἴδατε πάντες
  choice: మీరందరూ ఎరిగినవారే
  rationale: SBLGNTలోని πάντεςను కర్తను విశేషించే బహువచన రూపంగా తీసుకొని ‘అందరూ’ అనే భావాన్ని ఇస్తుంది; ‘అన్నిటినీ’ అని వస్తువుగా మార్చదు. ‘ఎరిగినవారే’ జ్ఞానం కలిగిన స్థితిని గౌరవప్రదంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘పరిశుద్ధుడు’ అనే బిరుదు ఎవరిని సూచిస్తుంది?
  choice: ‘పరిశుద్ధుని నుండి’ అని మాత్రమే ఉంచడం
  alternative: తండ్రి నుండి; యేసు క్రీస్తు నుండి; పరిశుద్ధాత్మ నుండి
  rationale: గ్రీకు పాఠం సూచింపబడిన వ్యక్తిని మరింత నిర్దిష్టం చేయదు. కాబట్టి తండ్రి లేదా కుమారుడు అనే సాధ్యమైన సూచనల మధ్య ఉన్న నిజమైన అస్పష్టతను అనువాదం నిలుపుతుంది.
- issue: χρῖσμα యొక్క భావం
  choice: ‘అభిషేకం’ అనే రూపకాన్ని నిలుపడం
  alternative: పరిశుద్ధాత్మ; ఆత్మ అనుగ్రహం
  rationale: సందర్భంలో ఇది పరిశుద్ధాత్మను లేదా ఆయన కార్యాన్ని సూచించవచ్చు; అయినా మూలపాఠం రూపక పదాన్నే వాడుతుంది. అందువల్ల వివరణాత్మక సిద్ధాంత నిర్ణయాన్ని వచనంలో చేర్చలేదు.
- issue: πάντες పాఠభేదం
  choice: ‘మీరందరూ ఎరిగినవారే’
  alternative: ‘మీరు అన్నిటినీ ఎరిగినవారు’
  rationale: ఇచ్చిన SBLGNT పాఠంలో πάντες కర్తను సూచిస్తూ ‘అందరూ’ అనే అర్థాన్ని బలపరుస్తుంది; ప్రత్యామ్నాయ పాఠం ‘అన్నిటినీ’ అనే భావాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘అభిషేకం’ అనే బైబిలీయ రూపకాన్ని, ‘పరిశుద్ధుడు’ అనే నిర్దిష్టీకరించని దైవిక బిరుదును నిలిపింది. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత పాఠభేదపు అడుగుసూచనతో సరిపోలుతుంది.
