revisions:
- from: అయితే మీరు పరిశుద్ధుని నుండి అభిషేకం పొందినవారు; మీరందరూ ఎరిగినవారే.[a]
  to: అయితే మీకు పరిశుద్ధుని నుండి అభిషేకం ఉంది, మరియు మీరందరికీ తెలుసు.[a]
  rationale: The revision restores the present-possession sense of ἔχετε, uses natural modern Telugu for οἴδατε πάντες, and retains both the source text’s ambiguity about “the Holy One” and the textual-variant note.
