id: 1JN.2.12
reference: 1 John 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Γράφω ὑμῖν, τεκνία, ὅτι ἀφέωνται ὑμῖν αἱ ἁμαρτίαι διὰ τὸ ὄνομα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/012.yaml
  text: I am writing to you[a], little children[c][b], because your sins have been forgiven for the sake of his name.
translation:
  language: te
  text: నేను మీకు రాస్తున్నాను[a], చిన్నపిల్లలారా, ఎందుకంటే[b] ఆయన[c] నామం నిమిత్తం మీ పాపాలు క్షమించబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను మీకు రాస్తాను.” పత్రికా సందర్భంలో గ్రీకు వర్తమానకాలాన్ని సాధారణ వర్తమానంగానో, ప్రస్తుతం జరుగుతున్న చర్యగానో అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ పాపాలు ఆయన నామం నిమిత్తం క్షమించబడ్డాయని నేను మీకు రాస్తున్నాను.” ఇక్కడి గ్రీకు సంధిపదం రాయడానికి గల కారణాన్ని సూచించవచ్చు; రాస్తున్న విషయాన్ని పరిచయం చేసే “అని” అనే అర్థం కూడా సాధ్యమే.
    reason: alternative_reading
  - marker: c
    text: “ఆయన” అనేది సందర్భాన్ని బట్టి దేవుణ్ణి లేదా యేసును సూచిస్తున్నదని అర్థం చేసుకోవచ్చు; ఈ వచనంలోని గ్రీకు పాఠ్యం ఎవరిని సూచిస్తుందో స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω
  choice: నేను మీకు రాస్తున్నాను
  rationale: వర్తమానకాల క్రియను పత్రిక రాస్తున్న ప్రస్తుత చర్యగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సాధారణ వర్తమానంగా కూడా అర్థం చేసుకోవచ్చు.
- source_word: τεκνία
  choice: చిన్నపిల్లలారా
  rationale: వయస్సును మాత్రమే కాక ఆప్యాయమైన కుటుంబ సంబోధనను కూడా సూచించే గ్రీకు లఘురూప భావాన్ని నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఈ సందర్భంలో యోహాను రాయడానికి గల కారణాన్ని పరిచయం చేస్తుందని గ్రహించడం చుట్టుపక్కల వాక్యాల ప్రవాహానికి సరిపోతుంది; విషయాన్ని పరిచయం చేసే ‘అని’ అనే అర్థం కూడా సాధ్యమే.
- source_word: ἀφέωνται
  choice: క్షమించబడ్డాయి
  rationale: పూర్తయిన క్షమాపణ చర్యను, దాని ఫలితం కొనసాగుతున్నదనే పరిపూర్ణకాల భావాన్ని, కర్మణి రూపాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: αἱ ἁμαρτίαι
  choice: మీ పాపాలు
  rationale: ὑμῖν అనే దత్తివిభక్తితో కూడిన క్షమాపణ నిర్మాణం పాపాలు పాఠకులకు చెందినవని తెలియజేస్తుంది; తెలుగులో స్వామ్యసూచక రూపం సహజం.
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: ఆయన నామం నిమిత్తం
  rationale: διά + ద్వితీయావిభక్తి తెలియజేసే కారణం లేదా ఆధారాన్ని వ్యక్తం చేస్తూ, ‘నామం’లోని వ్యక్తిగత మరియు వేదాంతపరమైన భావభారాన్ని నిలుపుతుంది.
- source_word: ὄνομα
  choice: నామం
  rationale: కేవలం కీర్తి లేదా ప్రతిష్ఠ అనే అర్థానికి పరిమితం చేయకుండా మూలంలోని బైబిలు సంబంధమైన భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ‘ఆయన నామం’లో ‘ఆయన’ ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘ఆయన’ అని మాత్రమే ఉంచి, వ్యక్తిని స్పష్టంగా గుర్తించలేదు.
  alternative: దేవుడు లేదా యేసు మెస్సీయ
  rationale: ఈ వచనం ఆ వ్యక్తిని పేరుతో స్పష్టంగా గుర్తించదు; విస్తృత సందర్భాన్ని బట్టి రెండు అవగాహనలు ఉన్నాయి. మూలపాఠ్యంలోని అనిశ్చితిని, వేదాంతపరమైన ఉద్రిక్తతను నిలిపేందుకు సర్వనామాన్నే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘చిన్నపిల్లలారా’లోని ఆప్యాయ సంబోధనను, ‘నామం’లోని బైబిలు భావభారాన్ని కాపాడుతూ, మూలపాఠ్యం స్పష్టంగా పరిష్కరించని సర్వనామ సూచనను అలాగే నిలిపాం.
