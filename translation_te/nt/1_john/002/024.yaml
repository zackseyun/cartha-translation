id: 1JN.2.24
reference: 1 John 2:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: te
  text: మీ విషయానికి వస్తే, మొదటి నుంచీ మీరు విన్నది మీలో నిలిచి ఉండనివ్వండి.[a] మొదటి నుంచీ మీరు విన్నది మీలో నిలిచి ఉంటే, మీరు కూడా కుమారునిలో, తండ్రిలో నిలిచి ఉంటారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మొదటి నుంచీ మీరు విన్న ఆ విషయం’ అని కూడా అనువదించవచ్చు. సందర్భంలో ఇది కుమారుని గురించిన తొలి అపొస్తలిక సందేశాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఈ వచనమంతటా ‘నిలిచి ఉండు’ అని అనువదించిన చోట్ల గ్రీకులో ఒకే క్రియ వాడబడింది; సాంప్రదాయకంగా దీనిని ‘నివసించు’ అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: మీ విషయానికైతే
  rationale: వాక్యారంభంలో ముందుకు తెచ్చిన సర్వనామంలోని విషయ-సూచక, వ్యత్యాసాత్మక ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: మొదటినుంచి మీరు విన్నది
  rationale: ὃ అనే నపుంసకలింగ సంబంధసర్వనామాన్ని ‘విన్నది’గా విస్తృతంగానే ఉంచి, ‘సందేశం’ లేదా ‘సువార్త’ అని మూలంలో లేనిదాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἀπ’ ἀρχῆς
  choice: మొదటినుంచి
  rationale: యోహాను రచనల్లోని స్థిరమైన భావవ్యక్తీకరణను సహజంగా, దాని ఆరంభ సంబంధ ప్రతిధ్వనిని కాపాడుతూ అందిస్తుంది.
- source_word: ἐν ὑμῖν μενέτω
  choice: మీలో నిలిచి ఉండనివ్వండి
  rationale: వర్తమాన ఆజ్ఞార్థక రూపంలోని కొనసాగింపు భావాన్ని వ్యక్తం చేస్తుంది; μένω పదపునరుక్తిని ‘నిలిచి ఉండు’తో నిలబెడుతుంది.
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: మీలో నిలిచి ఉంటే
  rationale: ἐάν తో కూడిన షరతును సహజ తెలుగు షరతురూపంలో ఇస్తూ, అదే μένω క్రియకు అనుగుణతను కాపాడుతుంది.
- source_word: καὶ ὑμεῖς
  choice: మీరు కూడా
  rationale: καί లోని ‘కూడా’ భావాన్నీ, వ్యక్తమైన సర్వనామ ఉద్ఘాటననూ స్పష్టంగా ఉంచుతుంది.
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: కుమారునిలో, తండ్రిలో
  rationale: రెండు సంబంధాల సమాంతరత్వాన్ని కాపాడుతుంది; తెలుగులో గౌరవార్థకంగా స్థిరపడిన దైవసంబంధ బిరుదులను ఉపయోగిస్తుంది.
- source_word: μενεῖτε
  choice: నిలిచి ఉంటారు
  rationale: భవిష్యత్ సూచక రూపాన్ని నేరుగా తెలియజేస్తూ, ఈ వచనమంతటా μένω కు ఒకే తెలుగు పదబంధాన్ని కొనసాగిస్తుంది.
theological_decisions:
- issue: చివరి వాక్యభాగంలోని షరతుతో కూడిన వాగ్దానం స్వభావం
  choice: ‘మీరు కూడా కుమారునిలో, తండ్రిలో నిలిచి ఉంటారు’ అని భవిష్యత్ రూపాన్ని నేరుగా అనువదించడం
  alternative: దీనిని కేవలం ఆజ్ఞగా లేదా తరువాతి వ్యవస్థీకృత వేదాంతంలోని నిలకడ సిద్ధాంతానికి నిర్ధారణగా వివరించడం
  rationale: గ్రీకు పాఠ్యం మొదట విన్నది కొనసాగి ఉండటానికి అనుసంధానమైన షరతుతో భవిష్యత్ ప్రకటన చేస్తుంది. అనువాదం పట్టుదల, నిశ్చయత లేదా ఐక్యతపై ఒక నిర్దిష్ట శాఖాపరమైన తీర్మానాన్ని చొప్పించకుండా ఆ ఉద్వేగాన్ని నిలుపుతుంది.
- issue: ‘మొదటినుంచి మీరు విన్నది’ అనే మాటకు సూచితం
  choice: ప్రధాన పాఠ్యంలో సూచితాన్ని సాధారణంగానే ఉంచడం
  alternative: ‘సువార్త’ లేదా ‘అపొస్తలుల సందేశం’ అని స్పష్టీకరించడం
  rationale: సందర్భం కుమారుని గురించిన ఆది అపొస్తలిక ప్రకటనను సూచించినప్పటికీ, మూలపాఠ్యంలో నపుంసకలింగ సంబంధసర్వనామమే ఉంది; అందువల్ల అనువాదం దానిని అనవసరంగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నిలిచి ఉండు’ అనే పదబంధం μένω పునరుక్తిని స్పష్టంగా కాపాడుతుంది. మొదటి ‘మీరు’లోని వ్యత్యాసాత్మక ఉద్ఘాటన కోసం ‘మీ విషయానికైతే’ వాడబడింది; మూలంలో లేని ‘సందేశం’ ప్రధాన పాఠ్యంలో చేర్చబడలేదు.
