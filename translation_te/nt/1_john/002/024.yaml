  terminology: ‘కుమారుడు,’ ‘తండ్రి,’ and the repeated ‘నిలిచి ఉండు’ are appropriate and preserve Johannine relational and lexical consistency. ‘నివసించు’ is a reasonable traditional alternative in the explanatory footnote, without being imposed on the main text.
