source:
  edition: SBLGNT
  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: te
  text: “నేను ఆయనను తెలుసుకున్నాను” అని చెప్పే వ్యక్తి, ఆయన ఆజ్ఞలను పాటించనివాడైతే, అబద్ధికుడు; సత్యం అతనిలో లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నాకు ఆయన తెలుసు.” గ్రీకు పరిపూర్ణకాల రూపాన్ని ఇలా సరళంగా అనువదించవచ్చు; అయితే “తెలుసుకున్నాను” అనేది గతంలో తెలుసుకోవడం వల్ల ఏర్పడి కొనసాగుతున్న ప్రస్తుత సంబంధాన్ని మరింత స్పష్టంగా ప్రతిబింబిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: అని చెప్పుకుంటూ ... వ్యక్తి
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతం సాధారణ స్వభావం గల ఏ వ్యక్తినైనా సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘చెప్పుకుంటూ ... వ్యక్తి’ అని ఉంచడం ద్వారా మాటలోని వాదనతో పాటు దానికి విరుద్ధమైన నిరంతర ప్రవర్తన స్పష్టమవుతుంది.
- source_word: Ἔγνωκα
  choice: నేను ఆయనను తెలుసుకున్నాను
  rationale: γινώσκω యొక్క perfect రూపం గతంలో తెలుసుకోవడం వల్ల ఏర్పడిన ప్రస్తుత సంబంధస్థితిని సూచించగలదు. తెలుగులో ‘తెలుసుకున్నాను’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; ‘తెలుసు’ కూడా సాధ్యమైన సంక్షిప్త అనువాదం.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: ఆయన ఆజ్ఞలను
  rationale: ἐντολήకి ‘ఆజ్ఞ’ సహజమైన, గౌరవప్రదమైన సమానార్థకం; యోహాను రచనల్లోని దైవ ఆజ్ఞల ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: μὴ τηρῶν
  choice: పాటించని
  rationale: τηρέωలోని కాపాడటం/ఆచరించడం అనే భావాన్ని సందర్భానుసారంగా ‘పాటించు’ సహజంగా వ్యక్తం చేస్తుంది. వర్తమాన కృదంతం సూచించే కొనసాగుతున్న వైఫల్యాన్ని ‘పాటించని’ నిలుపుతుంది.
- source_word: ψεύστης
  choice: అబద్ధికుడు
  rationale: ఇది విశేషణం కాదు, వ్యక్తిని నేరుగా వర్ణించే predicate noun. ‘అబద్ధికుడు’ ఆ వ్యక్తిగత నైతిక నిర్ధారణను నిలుపుతుంది.
- source_word: ἐν τούτῳ
  choice: అతనిలో
  rationale: τούτῳ ముందుగా వర్ణించిన వ్యక్తినే తిరిగి సూచించడం అత్యంత సహజం. తెలుగులో ‘అతనిలో’ సులభంగా, స్పష్టంగా ఉంటుంది; గ్రీకు రూపాన్ని మరింత అక్షరార్థంగా చూపే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: ἡ ἀλήθεια οὐκ ἔστιν
  choice: సత్యం ... లేదు
  rationale: ‘సత్యం’ అనే పదం యోహాను రచనల్లోని వాస్తవ, నైతిక, ఆధ్యాత్మిక విస్తృతిని కాపాడుతుంది. సాధారణ నిరాకరణను తెలుగులో సహజమైన ‘లేదు’తో తెలిపాం.
theological_decisions:
- issue: αὐτόν / αὐτοῦ ఎవరిని సూచిస్తున్నాయి?
  choice: ‘ఆయనను / ఆయన’ అనే సర్వనామాలతోనే అనువదించడం
  alternative: దేవుడు అని లేదా మరింత నిర్దిష్టంగా క్రీస్తు అని అనువదించడం
  rationale: తక్షణ సందర్భం ప్రధానంగా దేవునిని సూచించినప్పటికీ, యోహాను ఆలోచనలో దేవుడు మరియు కుమారుని మధ్య సన్నిహిత సంబంధం ఉంది. మూలపాఠం పేరును పేర్కొననందున తెలుగు అనువాదం కూడా సర్వనామాన్ని ఉంచి ఆ ఉద్దేశపూర్వక ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడుతుంది.
- issue: యోహాను వాడిన ‘తెలుసుకోవడం’ అనే భాష యొక్క బలం
  choice: సంబంధపూర్వకంగా తెలుసుకొని ఉన్న స్థితిని సూచించే ‘తెలుసుకున్నాను’
  alternative: ప్రస్తుత జ్ఞానాన్ని మాత్రమే ముందుకు తెచ్చే ‘నాకు ఆయన తెలుసు’
  rationale: perfect రూపం గతంలో తెలుసుకోవడం వల్ల కొనసాగుతున్న ప్రస్తుత స్థితిని సూచిస్తుంది. ‘తెలుసుకున్నాను’ కేవలం మేధోపరమైన సమాచారం అని కుదించకుండా ఈ పార్శ్వాన్ని మితంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఆయన’ దైవసూచక సర్వనామానికి తెలుగు గౌరవప్రయోగం; ఇది మూలపాఠంలో లేని నిర్దిష్ట గుర్తింపును చేర్చదు. ప్రధాన పాఠంలోని [a], [b] గుర్తులు రెండూ సంబంధిత పాదసూచికలకు సరిపోతాయి.
