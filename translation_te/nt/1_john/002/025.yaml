  source_fidelity: 'The Telugu accurately conveys the Greek assertion: the promise made to us by the emphatic pronoun referent is identified as eternal life. “ఆయన స్వయంగా” appropriately preserves the emphasis of αὐτός, while “మనకు చేసిన వాగ్దానం” naturally expresses both the noun and its cognate verb without awkward Telugu repetition. The discourse connective καὶ is acceptably carried by the verse’s contextual flow.'
