  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία ἣν αὐτὸς ἐπηγγείλατο ἡμῖν, τὴν ζωὴν τὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/025.yaml
  text: 'And this is the promise that he himself promised us: eternal life[a][b].'
translation:
  language: te
  text: 'ఆయన స్వయంగా మనకు చేసిన వాగ్దానం ఇదే: నిత్యజీవం.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ నిత్యజీవం.” గ్రీకు మూలంలో నిర్దిష్ట ఉపపదం ఉంది; అయితే తెలుగులో ఇక్కడ “నిత్యజీవం” అనడం సహజం.
    reason: lexical_alternative
  - marker: b
    text: “ఆయన స్వయంగా” అనే మాట గ్రీకులో ఉద్ఘాటనతో ఉంది. అది తండ్రిని సూచిస్తుందా, కుమారుణ్ణి సూచిస్తుందా అనేది ఈ వాక్యం స్పష్టంగా మళ్లీ చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελία / ἐπηγγείλατο
  choice: వాగ్దానం / చేసిన
  rationale: మూలంలో ఒకే పదమూలానికి చెందిన నామవాచకం, క్రియ ఉన్నాయి. తెలుగులో ‘వాగ్దానం చేసిన వాగ్దానం’ అని పునరుక్తి చేయడం అసహజం కాబట్టి, ‘మనకు చేసిన వాగ్దానం’ అనే సహజ నిర్మాణంతో అదే భావాన్ని తెలిపాం.
- source_word: αὐτός
  choice: ఆయన స్వయంగా
  rationale: αὐτόςలోని ఉద్ఘాటనను ‘స్వయంగా’ నిలుపుతుంది; ‘ఆయన’ గౌరవప్రదమైన, సహజమైన సర్వనామం.
- source_word: ἡμῖν
  choice: మనకు
  rationale: దత్తివాచక పరోక్ష కర్మను తెలుగులో సహజంగా ‘మనకు’ అని వ్యక్తం చేస్తుంది.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: నిత్యజీవం
  rationale: ఈ పదబంధం వాగ్దానంలోని విషయాన్ని వివరిస్తుంది. యోహాను రచనల సందర్భంలో ‘నిత్యజీవం’ స్పష్టమైన, స్థిరపడిన తెలుగు ప్రయోగం.
- source_word: καὶ αὕτη ἐστίν
  choice: ఇదే
  rationale: ముందటి సందర్భంతో అనుసంధానాన్ని తెలుగులో వాక్యప్రవాహమే తెలియజేస్తుంది; ‘ఇదే’ మూలంలోని సూచననూ ఉద్ఘాటననూ సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: αὐτός (‘ఆయన స్వయంగా’) ఎవరిని సూచిస్తుంది?
  choice: ‘ఆయన స్వయంగా’ అని మాత్రమే ఉంచి, ఎవరని నిర్దిష్టంగా చెప్పలేదు.
  alternative: తండ్రి; కుమారుడు
  rationale: ఈ వాక్యంలో సర్వనామానికి పూర్వపదాన్ని మూలపాఠం మళ్లీ స్పష్టంగా పేర్కొనదు. సందర్భాన్ని బట్టి తండ్రి లేదా కుమారుడు అని అర్థం చేసుకునే అవకాశం ఉన్నందున, అనువాదం ఆ భావసందిగ్ధతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన సరళ శైలిని ఉపయోగించాం. మూలంలోని ఉద్ఘాటనను ‘స్వయంగా’, ‘ఇదే’ ద్వారా నిలిపి, తెలుగులో అసహజమైన పదపునరుక్తిని నివారించాం.
