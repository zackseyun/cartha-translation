id: 1JN.2.9
reference: 1 John 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ λέγων ἐν τῷ φωτὶ εἶναι καὶ τὸν ἀδελφὸν αὐτοῦ μισῶν ἐν τῇ σκοτίᾳ ἐστὶν ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: te
  text: తాను వెలుగులో ఉన్నానని చెప్పుకుంటూ తన సోదరుణ్ణి ద్వేషించేవాడు ఇప్పటికీ చీకటిలో ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన సోదరుణ్ణి గాని సోదరిని గాని.” గ్రీకులో పుంలింగ ఏకవచనమైన “సోదరుడు” ఉంది; ఈ నైతిక సందర్భంలో అది స్త్రీని కూడా ప్రతినిధిగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: చెప్పుకునేవాడు
  rationale: నిర్దిష్ట ఉపపదంతో కూడిన వర్తమాన కృదంతం ఒక ప్రతినిధి వ్యక్తిని సూచిస్తుంది. సందర్భంలో ఇది కేవలం పలకడాన్ని కాక తన స్థితి గురించి చెప్పుకోవడాన్ని సూచిస్తున్నందున ఈ రూపం సహజంగా ఉంటుంది.
- source_word: ἐν τῷ φωτὶ εἶναι
  choice: వెలుగులో ఉన్నానని
  rationale: యోహాను రచనలోని వెలుగు అనే నైతిక-ఆధ్యాత్మిక రూపకాన్ని యథాతథంగా ఉంచుతూ, పరోక్ష వాక్యానికి సహజమైన తెలుగు రూపాన్ని వాడింది.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: తన సోదరుణ్ణి
  rationale: గ్రీకు పదం పుంలింగ ఏకవచనంలో ఉంది. ‘తోటి విశ్వాసి’ అని వ్యాఖ్యానాత్మకంగా పరిమితం చేయకుండా మూలంలోని బంధుత్వ పదాన్ని నిలిపింది; విస్తృత ప్రతినిధి అర్థాన్ని పాదసూచికలో తెలిపింది.
- source_word: μισῶν
  choice: ద్వేషించేవాడు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న లేదా లక్షణాత్మక వైఖరిని తెలుగు అలవాటర్థక రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ σκοτίᾳ ἐστὶν
  choice: చీకటిలోనే ఉన్నాడు
  rationale: ‘వెలుగులో’ అనే రూపకానికి సమాంతరంగా ‘చీకటిలో’ను నిలిపింది. ‘నే’ వాస్తవ స్థితి అతని వాదనకు విరుద్ధమని సహజ తెలుగులో నొక్కి చెబుతుంది.
- source_word: ἕως ἄρτι
  choice: ఇప్పటివరకు
  rationale: ప్రస్తుత క్షణం వరకు కొనసాగుతున్న స్థితిని తెలిపే గ్రీకు కాలవ్యక్తీకరణకు నేరమైన, సహజమైన తెలుగు సమానం.
theological_decisions:
- issue: ἀδελφός అనే పుంలింగ ఏకవచనం ఈ నైతిక వాక్యంలో ప్రతినిధి అర్థంలో వాడబడటం
  choice: సోదరుడు
  alternative: సోదరుడు లేదా సోదరి; తోటి విశ్వాసి
  rationale: ప్రధాన పాఠ్యంలో మూలంలోని పుంలింగ ఏకవచనాన్ని నిలిపి, అది స్త్రీని కూడా ప్రతినిధిగా చేర్చవచ్చనే విషయాన్ని పాదసూచికలో తెలిపింది. ‘తోటి విశ్వాసి’ సందర్భానుకూలమైన వ్యాఖ్యానం అయినా, ప్రధాన పాఠ్యంలో పెడితే పదం యొక్క బంధుత్వ రూపకాన్నీ దాని పరిధిలోని కొంత సందిగ్ధతనూ ముందుగానే పరిష్కరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘వెలుగు/చీకటి’ అనే యోహానీయ ప్రతీకలను నిలిపి, ‘చెప్పుకుంటూనే’ ద్వారా వాదనకూ ప్రవర్తనకూ ఉన్న సమకాలిక విరోధాన్ని స్పష్టంగా వ్యక్తం చేసింది.
