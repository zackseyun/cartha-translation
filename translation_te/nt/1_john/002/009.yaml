revisions:
- from: వెలుగులో ఉన్నానని చెప్పుకుంటూనే తన సోదరుణ్ణి ద్వేషించేవాడు ఇప్పటివరకు చీకటిలోనే ఉన్నాడు.[a]
  to: తాను వెలుగులో ఉన్నానని చెప్పుకుంటూ తన సోదరుణ్ణి ద్వేషించేవాడు ఇప్పటికీ చీకటిలో ఉన్నాడు.[a]
  rationale: The revision makes the continuing present force of ἕως ἄρτι explicit and slightly reduces an added concessive emphasis, without changing the ethical contrast or interpreting ‘brother’ more narrowly than the source permits.
