id: 1JN.1.2
reference: 1 John 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: te
  text: ఆ జీవం ప్రత్యక్షమైంది[a], మేము దాన్ని చూశాము, దాని గురించి సాక్ష్యమిస్తున్నాము, తండ్రితో ఉన్నదీ మాకు ప్రత్యక్షమైనదీ అయిన ఆ నిత్యజీవాన్ని[b] మీకు ప్రకటిస్తున్నాము—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వెల్లడైంది’ / ‘తేటగా కనబడింది’ (ἐφανερώθη).
    reason: lexical_alternative
  - marker: b
    text: ‘ఆ నిత్యజీవం’ అనే మాట వ్యాకరణరీత్యా ఒక విషయాన్ని సూచించే నామరూపంలో ఉంది; అయితే సందర్భంలో అది తండ్రితో ఉండి మాకు ప్రత్యక్షమైన కుమారునినే సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: ఆ జీవం / ఆ నిత్యజీవం
  rationale: గ్రీకులోని నిర్దిష్ట ఉపపదాల భావాన్ని ‘ఆ’ ద్వారా సహజమైన తెలుగులో చూపుతూ, ఇది కేవలం జీవం అనే భావం కాక నిర్దిష్టమైన వాస్తవాన్ని సూచిస్తోందని నిలుపుతుంది.
- source_word: ἐφανερώθη
  choice: ప్రత్యక్షమైంది
  rationale: దాగి ఉన్నది వెల్లడై కనిపించిందనే భావాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు పదం; గ్రీకు కర్మణి రూపంలోని భావాన్ని నిలుపుతుంది.
- source_word: ἑωράκαμεν
  choice: మేము దాన్ని చూశాము
  rationale: అపొస్తలుల ప్రత్యక్ష సాక్ష్యాన్ని స్పష్టంగా, సహజంగా తెలుపుతుంది. తెలుగు వాక్యప్రవాహం కోసం ‘దాన్ని’ చేర్చినా, అది ముందున్న ‘ఆ జీవం’నే తిరిగి సూచిస్తుంది.
- source_word: μαρτυροῦμεν
  choice: దాని గురించి సాక్ష్యమిస్తున్నాము
  rationale: సాక్షులుగా ధృవీకరించి చెప్పే భావాన్ని నిలుపుతూ, తెలుగులో సహజమైన ప్రయోగాన్ని ఇస్తుంది.
- source_word: ἀπαγγέλλομεν
  choice: ప్రకటిస్తున్నాము
  rationale: సాక్ష్యమివ్వడం నుండి భిన్నంగా, ఇతరులకు తెలియజేసే బహిరంగ ప్రకటన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: ఆ నిత్యజీవం
  rationale: గ్రీకులోని నిర్దిష్టతను ‘ఆ’ ద్వారా నిలిపి, ‘జీవం’ అనే నామరూపాన్ని వ్యక్తిని సూచించే పదంతో భర్తీ చేయకుండా కాపాడుతుంది.
- source_word: ἥτις
  choice: తండ్రితో ఉండి … ప్రత్యక్షమైన
  rationale: తెలుగులో సహజమైన సంబంధవాచక నిర్మాణంతో ‘నిత్యజీవం’ గురించిన రెండు లక్షణాలను కలుపుతుంది; అది వ్యక్తా లేక విషయమా అనే భావాన్ని వ్యాకరణపరంగా అతిగా నిర్ణయించదు.
- source_word: ἦν πρὸς τὸν πατέρα
  choice: తండ్రితో ఉండి
  rationale: తండ్రితో ఉన్న సంబంధపూర్వక సాన్నిధ్యాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; ‘తండ్రి వైపు’ వంటి అసహజమైన అక్షరానువాదాన్ని నివారిస్తుంది.
- source_word: τὸν πατέρα
  choice: తండ్రి
  rationale: ఈ సందర్భంలో దేవుని సూచించే బిరుదుగా గౌరవప్రదంగా ఉపయోగించబడింది.
- source_word: ἡμῖν
  choice: మాకు
  rationale: ప్రత్యక్షత అపొస్తల సాక్షులకు కలిగిందనే మూలపాఠంలోని దత్తివాచక భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘జీవం’ అనే పదాన్ని విషయంగా ఉంచాలా, వ్యక్తిని సూచించేలా మార్చాలా
  choice: ప్రధాన పాఠంలో ‘ఆ జీవం’, ‘ఆ నిత్యజీవం’ అనే నామరూపాలనే ఉంచడం
  alternative: ‘ఆయన ప్రత్యక్షమయ్యాడు’ లేదా ‘కుమారుడు ప్రత్యక్షమయ్యాడు’ అని వ్యక్తీకరించడం
  rationale: సందర్భంలో ఇది కుమారుని వ్యక్తిగతంగా సూచించినా, గ్రీకు పాఠం ζωὴ అనే ‘జీవం’ నామవాచకాన్నే ఉపయోగిస్తుంది. అందువల్ల వ్యక్తిగత సూచనను పాదటిప్పణిలో వివరించి, యోహాను వాడిన ఉద్దేశపూర్వక రూపక-తాత్త్విక ఉద్వేగాన్ని ప్రధాన పాఠంలో నిలిపాము.
- issue: πρὸς τὸν πατέρα లోని పూర్వస్థితి మరియు సంబంధాన్ని ఎంత స్పష్టంగా చెప్పాలి
  choice: ‘తండ్రితో ఉండి’
  alternative: ‘తండ్రి సన్నిధిలో ఉండి’
  rationale: ఈ అనువాదం తండ్రితో సంబంధపూర్వకంగా ముందే ఉన్నదనే వాక్యార్థాన్ని నిలుపుతుంది; అయితే మూలంలో లేని అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘జీవము’ కంటే ప్రస్తుత వాడుకలో సహజమైన ‘జీవం’ను ఎంచుకున్నాం. మూలపాఠంలోని కొనసాగుతున్న వాక్య నిర్మాణాన్ని సూచించేందుకు చివర దీర్ఘ విరామచిహ్నాన్ని నిలిపాము.
