revisions:
- from: ఆ జీవం ప్రత్యక్షమైంది[a]. మేము దాన్ని చూశాము; దాని గురించి సాక్ష్యమిస్తున్నాము; తండ్రితో ఉండి మాకు ప్రత్యక్షమైన ఆ నిత్యజీవాన్ని[b] మీకు ప్రకటిస్తున్నాము—
  to: ఆ జీవం ప్రత్యక్షమైంది[a], మేము దాన్ని చూశాము, దాని గురించి సాక్ష్యమిస్తున్నాము, తండ్రితో ఉన్నదీ మాకు ప్రత్యక్షమైనదీ అయిన ఆ నిత్యజీవాన్ని[b] మీకు ప్రకటిస్తున్నాము—
  rationale: The revision restores the source’s uninterrupted coordinated structure and renders the relative clause with two clear Telugu predicates, while preserving the Greek noun ‘life’ rather than replacing it with an explicit personal pronoun or title. The footnote retains the contextual explanation but improves its Telugu idiom and avoids adding the main text’s implicit referent into the translation itself.
