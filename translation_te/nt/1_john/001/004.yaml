translation:
  language: te
  text: మా ఆనందం పరిపూర్ణం కావాలని మేము ఈ సంగతులను రాస్తున్నాము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘మా ఆనందం’కు బదులుగా ‘మీ ఆనందం’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది ముందున్న వాక్యంతో అనుసంధానించే సాధారణ సముచ్చయం. తెలుగులో వాక్యారంభంలో ‘మరియు’ అని పెట్టడం కృత్రిమంగా ఉండేందున, సహజమైన ప్రవాహం కోసం భావసంబంధాన్ని పదక్రమంలోనే ఉంచాం.
- source_word: ταῦτα
  choice: ఈ సంగతులను
  rationale: నపుంసక బహువచన సూచన సర్వనామం రచించబడుతున్న విషయాలను సూచిస్తుంది; ‘ఈ సంగతులు’ దాని బహువచన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: γράφομεν
  choice: రాస్తున్నాము
  rationale: వర్తమానకాల క్రియను ఉత్తరం రాస్తున్న ప్రస్తుత చర్యగా సహజమైన తెలుగు ప్రగతిశీల రూపంలో ఇచ్చాం.
- source_word: ἡμεῖς
  choice: మేము
  rationale: క్రియలోనే కర్త సూచింపబడినా, మూలంలో స్పష్టంగా ఉన్న సర్వనామం స్వల్ప ఉద్ఘాటనను కలిగి ఉంది; అందువల్ల ‘మేము’ను వ్యక్తంగా ఉంచాం.
- source_word: ἵνα
  choice: కావడానికి
  rationale: ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని తెలియజేసే ἵνα భావాన్ని సహజమైన తెలుగు ఉద్దేశార్థక నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: χαρά
  choice: ఆనందం
  rationale: యోహాను రచనల సందర్భంలో χαράకు సాధారణమైన, గౌరవప్రదమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: ἡμῶν
  choice: మన
  rationale: మూలపాఠంలోని ప్రథమ పురుష బహువచన సంబంధరూపాన్ని అనువదిస్తుంది. సమూహంలో రచయితతో పాటు పాఠకులను సహజంగా కలుపగల తెలుగు రూపం ‘మన’; పాఠాంతరమైన ‘మీ’ని పాదసూచికలో ఉంచాం.
- source_word: ᾖ πεπληρωμένη
  choice: పరిపూర్ణం కావడానికి
  rationale: εἰμί వర్తమాన సంభావనార్థక రూపం మరియు πληρόω సంపూర్ణ కర్మణి కృదంతం కలిసి సంపూర్ణతకు చేరిన స్థితిని సూచిస్తాయి; ‘పరిపూర్ణం కావడం’ ఆ ఫలితస్థితిని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἡ χαρὰ ἡμῶνలోని సర్వనామ పాఠం
  choice: మన ఆనందం
  alternative: మీ ఆనందం
  rationale: ఇచ్చిన SBLGNT మూలపాఠంలో ἡμῶν (‘మన/మా’) ఉంది కాబట్టి ప్రధాన పాఠంలో దానినే అనువదించాం. ప్రతుల పరంపరలో ప్రాముఖ్యమైన ὑμῶν (‘మీ’) పాఠాంతరాన్ని నిర్ణయించకుండా పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ఉద్దేశార్థాన్ని స్పష్టంగా తెలిపే తెలుగు వాక్యనిర్మాణం వాడబడింది; పాఠాంతరం పాదసూచికలో నిలుపబడింది.
