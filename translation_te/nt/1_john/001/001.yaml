- from: ఆదినుంచి ఉన్నది[a], మేము విన్నది, మా కళ్లతో చూసినది, మేము తదేకంగా చూసినదీ మా చేతులు తాకినదీ—జీవవాక్యాన్ని[b] గురించి—
  to: ఆది నుండి ఉన్నది[a], మేము విన్నది, మా కళ్లతో చూసినది, మేము నిశితంగా చూసినదీ మా చేతులు తాకినదీ—జీవవాక్యం గురించి[b]—
