id: 1JN.1.1
reference: 1 John 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: te
  text: ఆది నుండి ఉన్నది[a], మేము విన్నది, మా కళ్లతో చూసినది, మేము నిశితంగా చూసినదీ మా చేతులు తాకినదీ—జీవవాక్యం గురించి[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆది నుండి ఉన్నది ఏదైతే ఉందో.’ గ్రీకులో నపుంసకలింగ సంబంధ సర్వనామం ఉంది. కాబట్టి ఇది ‘ఆయన’ అని నేరుగా చెప్పకుండా, కుమారుని గురించిన అపొస్తలుల సాక్ష్యమంతటినీ విస్తృతంగా సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘జీవవాక్యం’ కుమారుని వ్యక్తిగతంగా సూచిస్తూ యోహాను 1:1ను ప్రతిధ్వనింపజేయవచ్చు; లేదా ఆయనను గురించిన జీవప్రదమైన సందేశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: ఉన్నది / విన్నది / చూసినది
  rationale: గ్రీకు నపుంసకలింగ సంబంధ సర్వనామాల విస్తృతిని తెలుగులో ‘-ది’ రూపాలతో సహజంగా నిలిపాము. ‘ఆయన’ అని వ్యక్తిని నేరుగా పేర్కొనడం మూలపాఠం కంటే ఎక్కువగా నిర్ధారిస్తుంది.
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: ఆదినుంచి ఉన్నది
  rationale: అసంపూర్ణ భూతకాల క్రియతో కూడిన కాలవ్యాప్తిని సూటిగా వ్యక్తం చేస్తూ యోహాను శైలిలోని ‘ఆది’ ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ἀκηκόαμεν
  choice: మేము విన్నది
  rationale: గ్రీకు పరిపూర్ణ కాలం సూచించే సాక్ష్యపు నిలిచియున్న ఫలితాన్ని తెలుగు సందర్భం సహజంగా తెలియజేస్తుంది; అసహజమైన కాలసహాయక నిర్మాణం జోడించలేదు.
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: మా కళ్లతో చూసినది
  rationale: ‘మా కళ్లతో’ అనే స్పష్టమైన పదబంధాన్ని నిలిపి ప్రత్యక్ష సాక్ష్యపు బలాన్ని కాపాడుతుంది.
- source_word: ἐθεασάμεθα
  choice: మేము తదేకంగా చూసినది
  rationale: సాధారణంగా చూడడం కంటే శ్రద్ధగా, పరిశీలనగా చూడడం అనే భావాన్ని ‘తదేకంగా’ తెలియజేస్తుంది.
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: మా చేతులు తాకినది
  rationale: ψηλαφάωలోని భౌతిక స్పర్శను ఆధునిక తెలుగులో స్పష్టంగా, అతిశయింపకుండా వ్యక్తం చేస్తుంది.
- source_word: περὶ
  choice: గురించి
  rationale: సాక్ష్యానికి సంబంధించిన విషయాన్ని పరిచయం చేసే περὶను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: జీవవాక్యాన్ని
  rationale: λόγοςకు ‘వాక్యం’ అనే రూపం వ్యక్తిగతమైన ‘వాక్యము’ ప్రతిధ్వనినీ, ప్రకటిత సందేశ భావాన్నీ తెరిచి ఉంచుతుంది; తెలుగు లిపిలో పెద్ద అక్షర భేదం లేకపోవడం వల్ల వివరణను పాదటిప్పణిలో ఇచ్చాము.
theological_decisions:
- issue: నపుంసక సంబంధ వాక్యాల సూచ్యం
  choice: ‘ఆయన’ అని కాకుండా ‘ఉన్నది, విన్నది, చూసినది’ అనే నపుంసక-విస్తృత నిర్మాణం
  alternative: ‘ఆదినుంచి ఉన్నవాడు’ అని వ్యక్తిగతంగా అనువదించడం
  rationale: సందర్భం కుమారుని గురించిన క్రీస్తు సాక్ష్యమే అయినా, గ్రీకు మూలం నపుంసక సంబంధ సర్వనామాలను వాడుతుంది. అనువాదం వ్యక్తినీ ఆయనను గూర్చిన అపొస్తలుల సాక్ష్య సమగ్రతనూ కలిగిన ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
- issue: λόγος τῆς ζωῆς వ్యక్తినా లేక సందేశమా
  choice: ‘జీవవాక్యం’ అని అనువదించి రెండు భావాలనూ తెరిచి ఉంచడం
  alternative: ‘జీవసందేశం’ అని కేవలం ప్రకటనగా, లేదా వివరణలోనే కుమారునిగా నిర్ధారించడం
  rationale: ఈ పదబంధం కుమారుని వ్యక్తిగతంగా సూచించవచ్చు; అదే సమయంలో ఆయనను గూర్చిన జీవప్రదమైన సందేశాన్నీ సూచించవచ్చు. మూలపాఠంలోని ఈ ధార్మిక ఉద్వేగాన్ని ప్రధాన పాఠంలో పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని వరుస సంబంధ ఉపవాక్యాలను, ప్రత్యక్ష సాక్ష్యపు స్పష్టతను, తదుపరి వచనంలో పూర్తయ్యే దీర్ఘ వాక్య నిర్మాణాన్ని సూచించే ముగింపు గీతను నిలిపాము.
