id: 1JN.1.5
reference: 1 John 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: te
  text: 'మేము ఆయన నుండి విన్న, మీకు ప్రకటిస్తున్న సందేశం ఇదే: దేవుడు వెలుగు; ఆయనలో చీకటి ఎంతమాత్రమూ లేదు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία
  choice: సందేశం
  rationale: స్వీకరించి ఇతరులకు తెలియజేసే విషయాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀκηκόαμεν
  choice: మేము ... విని
  rationale: గ్రీకు పరిపూర్ణ కాలం గతంలో విన్నదాని ప్రస్తుత ప్రాముఖ్యతను సూచిస్తుంది; ప్రధాన క్రియతో కలిపిన తెలుగు నిర్మాణం ఆ కొనసాగుతున్న సాక్ష్యభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀπ’ αὐτοῦ
  choice: ఆయన దగ్గర
  rationale: మూలంలోని సర్వనామాన్ని అలాగే ఉంచి, దాని స్థానంలో ‘యేసు’ లేదా ‘కుమారుడు’ అని వ్యాఖ్యానాత్మకంగా చేర్చదు; వినడం యొక్క మూలాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: ἀναγγέλλομεν
  choice: ప్రకటిస్తున్న
  rationale: అందుకున్న సందేశాన్ని బహిరంగంగా తెలియజేయడం అనే భావాన్ని, వర్తమాన క్రియ యొక్క కొనసాగుతున్న స్వరూపాన్ని కాపాడుతుంది.
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: దేవుడు వెలుగు
  rationale: నిర్వచనాత్మక వివరణలు చేర్చకుండా గ్రీకు రూపకాన్ని నేరుగా, బలంగా నిలుపుతుంది.
- source_word: σκοτία
  choice: చీకటి
  rationale: యోహాను రచనల్లోని భౌతిక మరియు నైతిక-రూపక ప్రతిధ్వనులు రెండింటినీ నిలుపగల సాధారణ తెలుగు పదం.
- source_word: ἐν αὐτῷ οὐκ ἔστιν οὐδεμία
  choice: ఆయనలో చీకటి ఎంతమాత్రమూ లేదు
  rationale: రెట్టింపు నిరాకరణలోని బలాన్ని సహజమైన తెలుగులో ‘ఎంతమాత్రమూ లేదు’ ద్వారా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ‘దేవుడు వెలుగు’ అనే రూపక విధేయం
  choice: రూపకాన్ని వివరణాత్మక విశేషణాలు లేకుండా నేరుగా ఉంచడం
  alternative: ‘దేవుడు పరిశుద్ధమైన వెలుగు’ లేదా ‘దేవుడు నిర్మలమైన వెలుగు’
  rationale: మూల గ్రీకు రూపకాన్ని మాత్రమే చెబుతుంది. ‘పరిశుద్ధమైన’ లేదా ‘నిర్మలమైన’ అని చేర్చడం దాని విస్తృతమైన ధార్మిక, సాహిత్య భావాన్ని ఒక వ్యాఖ్యానానికి పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన లేఖా శైలిని కాపాడుతూ అనువదించబడింది. ఈ వచనానికి ఇచ్చిన ఆంగ్ల [a] గమనిక పదస్థానపరంగా సరిపోలకపోవడంతో, తెలుగు మూలపాఠంలో అవసరం లేని పాదటిప్పణి చేర్చలేదు.
