id: 1JN.1.9
reference: 1 John 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: te
  text: మన పాపాలను మనం ఒప్పుకుంటే, మన పాపాలను క్షమించి, సమస్త దుర్నీతి నుండి మనలను శుద్ధి చేయడానికి ఆయన నమ్మదగినవాడూ నీతిమంతుడూ[a] ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “న్యాయవంతుడూ”: “మన పాపాలను క్షమించి, సమస్త దుర్నీతి నుండి మనలను శుద్ధి చేయడానికి ఆయన నమ్మదగినవాడూ న్యాయవంతుడూ ఉన్నాడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: ఒప్పుకుంటే
  rationale: షరతును సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; పదేపదే జరిగే చర్య అని అతిగా సూచించదు.
- source_word: ὁμολογῶμεν
  choice: మనం ఒప్పుకుంటే
  rationale: పాపాలను అంగీకరించి ఒప్పుకోవడం అనే భావాన్ని సందర్భానుకూలంగా, సామాన్య పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: మన పాపాలను
  rationale: మూలంలోని ప్రత్యక్ష కర్మను సహజమైన తెలుగు స్వామ్య నిర్మాణంతో కచ్చితంగా అందిస్తుంది.
- source_word: πιστός
  choice: నమ్మదగినవాడు
  rationale: దేవుని విశ్వసనీయతను ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది; ‘విశ్వాసపాత్రుడు’ కంటే సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: δίκαιος
  choice: నీతిమంతుడు
  rationale: నైతిక న్యాయవర్తనతో కూడిన విస్తృత భావాన్ని నిలుపుతుంది; ‘న్యాయవంతుడు’ అనే న్యాయపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: ἵνα
  choice: కాబట్టి ... క్షమించి ... శుద్ధి చేస్తాడు
  rationale: విశేషణాల తరువాత వచ్చే ἵνα నిర్మాణాన్ని సహజమైన తెలుగులో దేవుని స్వభావం ఆయన క్షమాపణకు, శుద్ధీకరణకు ఆధారమని తెలియజేసే విధంగా అందిస్తుంది.
- source_word: ἀφῇ
  choice: క్షమించి
  rationale: పాప సందర్భంలో ἀφίημι యొక్క స్థిరమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: καθαρίσῃ
  choice: శుద్ధి చేస్తాడు
  rationale: నైతిక అపవిత్రత తొలగించబడే రూపకాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἀπὸ πάσης ἀδικίας
  choice: సమస్త దుర్నీతి నుండి
  rationale: ἀδικία యొక్క నైతిక-ఆధ్యాత్మిక విస్తృతిని నిలుపుతుంది; ప్రతి విధమైన అనీతిని సమగ్రంగా సూచిస్తుంది.
theological_decisions:
- issue: దేవుని క్షమాపణకు సంబంధించి δίκαιος పదాన్ని అనువదించడం
  choice: నీతిమంతుడు
  alternative: న్యాయవంతుడు
  rationale: ఈ వాక్యం క్షమాపణను, శుద్ధీకరణను దేవుని స్వభావంలో ఆధారపరుస్తుంది. ‘నీతిమంతుడు’ నైతిక సత్యనిష్ఠతో పాటు న్యాయబద్ధతను కూడా కలిగిన విస్తృత భావాన్ని ఇస్తుంది; ‘న్యాయవంతుడు’ అనే బలమైన న్యాయపరమైన భావాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘పాపాలు,’ ‘క్షమించడం,’ ‘శుద్ధి చేయడం,’ ‘దుర్నీతి’ వంటి సందర్భానుకూల బైబిలు పదజాలాన్ని ఉంచి, అతిగా ప్రాచీనమైన క్రియారూపాలను నివారించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘నీతిమంతుడు’ పదానికే జత చేశాం.
