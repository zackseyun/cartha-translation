  to: మన పాపాలను మనం ఒప్పుకుంటే, మన పాపాలను క్షమించి, సమస్త దుర్నీతి నుండి మనలను శుద్ధి చేయడానికి ఆయన నమ్మదగినవాడూ నీతిమంతుడూ[a] ఉన్నాడు.
