review_pass:
  verdict: revise
  source_fidelity: The conditional opening and the renderings of confession, sins, forgiveness, cleansing, and δίκαιος are sound. However, “కాబట్టి ... చేస్తాడు” recasts ἵνα as a straightforward inference and uses a future-like finite verb. The Greek more specifically connects God’s faithfulness and righteousness with forgiving and cleansing; a Telugu purposive construction better preserves that relation.
  naturalness: The draft is clear and modern. The revision retains its accessible register while using “...చేయడానికి ... ఉన్నాడు,” a natural way to express the Greek construction in modern standard Telugu.
  terminology: “నమ్మదగినవాడు,” “నీతిమంతుడు,” “క్షమించి,” and “శుద్ధి” are appropriate. “సమస్త దుర్నీతి” adequately conveys the comprehensive moral sense of ἀδικία. The lexical alternative “న్యాయవంతుడు” should remain in the footnote.
  issues:
  - severity: medium
    issue: Rendering of ἵνα and the following subjunctives
    rationale: “ఆయన నమ్మదగినవాడూ నీతిమంతుడూ కాబట్టి ... శుద్ధి చేస్తాడు” makes the latter clause a consequence expressed with a future-like finite verb. The source presents forgiving and cleansing as the action to which God’s faithfulness and righteousness are directed. A purposive infinitival construction preserves this more closely.
  revised_text: మన పాపాలను మనం ఒప్పుకుంటే, మన పాపాలను క్షమించి, సమస్త దుర్నీతి నుండి మనలను శుద్ధి చేయడానికి ఆయన నమ్మదగినవాడూ నీతిమంతుడూ[a] ఉన్నాడు.
  revised_footnotes:
