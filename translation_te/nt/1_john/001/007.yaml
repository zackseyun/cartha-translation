id: 1JN.1.7
reference: 1 John 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: te
  text: కాని మనం వెలుగులో నడుస్తూ ఉంటే, ఆయన తానే వెలుగులో ఉన్నట్లుగా, మనం ఒకరితో ఒకరం సహవాసం కలిగి ఉంటాం[a]; మరియు ఆయన కుమారుడైన యేసు రక్తం ప్రతి పాపం నుండి మనలను శుద్ధి చేస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మన మధ్య పరస్పర సహవాసం ఉంటుంది.’ ‘ఒకరితో ఒకరం’ అనే మాటను కొందరు విశ్వాసులకు దేవునితో ఉన్న సహవాసంగా అర్థం చేసుకుంటారు. అయితే గ్రీకులోని పరస్పర సర్వనామం సహజంగా విశ్వాసుల మధ్య పరస్పర సహవాసాన్ని సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘సమస్త పాపం నుండి.’ గ్రీకు పదబంధాన్ని విడివిడిగా ‘ప్రతి పాపం’ అనీ, సమష్టిగా ‘సమస్త పాపం’ అనీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: కాని … నడిస్తే
  rationale: δέ ముందరి వచనంలోని చీకటిలో నడిచే వాదనకు వ్యతిరేకతను సూచిస్తుంది; ἐὰν యొక్క షరతును తెలుగులో సహజమైన ‘నడిస్తే’ రూపం వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ φωτὶ
  choice: వెలుగులో
  rationale: యోహాను రచనలోని రూపకాన్ని వివరించి పరిమితం చేయకుండా యథాతథంగా నిలుపుతుంది.
- source_word: περιπατῶμεν
  choice: మనం కూడా … నడిస్తే
  rationale: ‘నడుచుట’ అనే నైతిక జీవన రూపకాన్ని నిలుపుతుంది; పోలికలోని సహజ తెలుగు భావం కోసం ‘కూడా’ చేర్చబడింది.
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: ఆయన వెలుగులో ఉన్నట్లే
  rationale: αὐτός యొక్క స్వల్ప ఉద్ఘాటనను సందర్భానుసారంగా ‘ఆయన’తో వ్యక్తం చేస్తూ, ὡς సూచించే పోలికను ‘ఉన్నట్లే’గా నిలుపుతుంది.
- source_word: κοινωνίαν ἔχομεν μετ’ ἀλλήλων
  choice: మనకు ఒకరితో ఒకరికి సహవాసం ఉంటుంది
  rationale: κοινωνία యొక్క భాగస్వామ్య, సంబంధ భావాన్ని ‘సహవాసం’ సహజంగా తెలియజేస్తుంది; ἀλλήλων యొక్క పరస్పరత్వాన్ని ‘ఒకరితో ఒకరికి’ నిలుపుతుంది.
- source_word: τὸ αἷμα Ἰησοῦ τοῦ υἱοῦ αὐτοῦ
  choice: ఆయన కుమారుడైన యేసు రక్తం
  rationale: రక్తాన్నే వాక్యంలోని కర్తగా ఉంచుతూ, యేసు దేవుని కుమారుడనే సంబంధాన్ని సహజ తెలుగు నిర్మాణంలో స్పష్టంగా నిలుపుతుంది.
- source_word: καθαρίζει
  choice: శుద్ధి చేస్తుంది
  rationale: నైతిక, ఆచారసంబంధ శుద్ధీకరణ భావాలను రెండింటినీ మోయగల పదబంధం; వర్తమాన కాలం కొనసాగుతున్న లేదా లక్షణాత్మక క్రియను అతిగా విస్తరించకుండా వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: ప్రతి పాపం నుంచి
  rationale: πάσης + ఏకవచన ἁμαρτίαςకు సాధ్యమైన పంపిణీ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; సమష్టి భావం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: μετ’ ἀλλήλων (‘ఒకరితో ఒకరికి’) ఎవరిని సూచిస్తుంది?
  choice: విశ్వాసుల మధ్య పరస్పర సహవాసం
  alternative: విశ్వాసులకు దేవునితో ఉన్న సహవాసం
  rationale: ἀλλήλων అనే పరస్పర సర్వనామం సహజంగా సమూహ సభ్యుల మధ్య పరస్పర సంబంధాన్ని సూచిస్తుంది. విస్తృత సందర్భంలో దేవునితో సహవాసం ఉన్నప్పటికీ, ఈ పదబంధాన్ని దానితో సమానంగా చేసి పాఠంలోని ఉద్రిక్తతను తొలగించలేదు.
- issue: καθαρίζει వర్తమాన కాలం యొక్క బలం
  choice: తెలుగు సాధారణ వర్తమానంలో ‘శుద్ధి చేస్తుంది’
  alternative: ‘నిరంతరం శుద్ధి చేస్తూనే ఉంటుంది’ అని స్పష్టంగా ప్రగతిశీలంగా అనువదించడం
  rationale: గ్రీకు వర్తమానం కొనసాగుతున్న లేదా లక్షణాత్మక కార్యాన్ని సూచించగలదు. సాధారణ తెలుగు వర్తమానం ఆ అవకాశాన్ని నిలుపుతూ, మూలంలో లేని ‘నిరంతరం’ వంటి వివరణను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. యోహాను ఉపయోగించిన ‘వెలుగు,’ ‘నడవడం,’ ‘రక్తం,’ ‘శుద్ధి’ రూపకాలు, ధార్మిక బరువు వివరణాత్మక పరిభాష లేకుండా నిలుపబడ్డాయి. పాదసూచిక సూచికలు సంబంధిత పదబంధాల వెంట సరిగా ఉంచబడ్డాయి.
