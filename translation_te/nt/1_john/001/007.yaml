revisions:
- from: కాని ఆయన వెలుగులో ఉన్నట్లే మనం కూడా వెలుగులో నడిస్తే, మనకు ఒకరితో ఒకరికి సహవాసం ఉంటుంది[a]. ఆయన కుమారుడైన యేసు రక్తం ప్రతి పాపం నుంచి మనలను శుద్ధి చేస్తుంది[b].
  to: కాని మనం వెలుగులో నడుస్తూ ఉంటే, ఆయన తానే వెలుగులో ఉన్నట్లుగా, మనం ఒకరితో ఒకరం సహవాసం కలిగి ఉంటాం[a]; మరియు ఆయన కుమారుడైన యేసు రక్తం ప్రతి పాపం నుండి మనలను శుద్ధి చేస్తుంది[b].
  rationale: The revision preserves the source’s conditional structure and metaphors while improving idiomatic Telugu. It retains the interpretive ambiguity of μετ’ ἀλλήλων in the footnote rather than resolving it doctrinally, and it maintains the distributive rendering of πάσης ἁμαρτίας with the collective alternative noted.
