id: 1JN.1.3
reference: 1 John 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: te
  text: మేము చూసినదానినీ విన్నదానినీ మీకు కూడా ప్రకటిస్తున్నాం, మీరు కూడా మాతో సహవాసం[a] కలిగి ఉండేలా; నిజానికి, మా సహవాసం తండ్రితోనూ ఆయన కుమారుడైన యేసు మెస్సీయతోనూ[b] ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహవాసం’ అనే పదాన్ని ‘సహభాగిత,’ ‘భాగస్వామ్యం,’ లేదా ‘పాలుపంచుకోవడం’ అని కూడా అనువదించవచ్చు. ఇది ఉమ్మడి జీవితం, సంబంధం, పాలుపంచుకోవడం అనే భావాలను కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘యేసు క్రీస్తు’ అని కూడా అనువదించవచ్చు. గ్రీకు Χριστός అనే బిరుదుకు ‘క్రీస్తు’ లేదా ‘మెస్సీయ’ అనే రూపాలు సాధ్యమైనవి; ఇక్కడ దాని బిరుదార్థాన్ని స్పష్టంగా ఉంచడానికి ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: మేము చూసినదానినీ విన్నదానినీ
  rationale: గ్రీకు సంబంధవాచక సర్వనామం సూచించే విస్తృత విషయాన్ని వ్యక్తిగా మార్చకుండా ఉంచుతుంది; రెండు పరిపూర్ణకాల క్రియల సాక్ష్యభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: మీకు కూడా ప్రకటిస్తున్నాం
  rationale: ἀπαγγέλλωలోని తెలియజేయడం/ప్రకటించడం అనే సాక్ష్యార్థాన్ని, అలాగే καίలోని ‘కూడా’ భావాన్ని నిలుపుతుంది.
- source_word: ἵνα καὶ ὑμεῖς
  choice: దీని ఉద్దేశం మీరు కూడా … కలిగి ఉండాలనే
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; ‘మీరు కూడా’ అనే సమాంతర ఉద్ఘాటనను కాపాడుతుంది.
- source_word: κοινωνία
  choice: సహవాసం
  rationale: కేవలం సామాజిక పరిచయాన్ని కాకుండా, సంబంధం మరియు ఉమ్మడి పాలుపంచుకోవడం రెండింటినీ సూచించగల సుపరిచితమైన తెలుగు పదం.
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: నిజానికి, మా సహవాసం
  rationale: δέ యొక్క వివరణాత్మక/ఉద్ఘాటన భావాన్ని ‘నిజానికి’ తెలియజేస్తుంది; ἡμετέραను సందర్భంలోని వక్తల సమూహాన్ని సూచించే ‘మా’గా ఉంచుతుంది.
- source_word: μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ
  choice: తండ్రితోనూ ఆయన కుమారుడైన … తోనూ
  rationale: రెండు μετὰ పదబంధాల సమాంతరతను ‘తోనూ … తోనూ’ ద్వారా కాపాడి, తండ్రి–కుమార సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστόςను ఇక్కడ బిరుదుగా గ్రహించి ‘మెస్సీయ’గా అనువదిస్తుంది; తెలుగు వాక్య నిర్మాణంలో ‘యేసు మెస్సీయ’ సహజమైన బిరుదు-పేరు సమాసంగా పనిచేస్తుంది.
theological_decisions:
- issue: κοινωνία యొక్క భావవిస్తృతి
  choice: సహవాసం
  alternative: సహభాగిత / భాగస్వామ్యం / పాలుపంచుకోవడం
  rationale: విశ్వాసులు సాక్షులతో కలిగే సంబంధాన్నీ, తండ్రి మరియు కుమారునితో ఉన్న ఉమ్మడి పాలుపంచుకోవడాన్నీ ఒకే పదంతో ఉంచి, సామాజిక లేదా ఆచారపరమైన ఒక్క అర్థానికి పరిమితం చేయదు.
- issue: Χριστοῦ యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός యేసుకు సంబంధించిన బిరుదుగా నిలుస్తుంది; ‘మెస్సీయ’ దాని అభిషిక్త రాజు/వాగ్దత్త రక్షకుడు అనే బిరుదార్థాన్ని స్పష్టంగా కాపాడుతుంది.
- issue: ἡμετέραలో ‘మా/మన’ ఎంపిక
  choice: మా
  alternative: మన
  rationale: మొదట ‘మాతో’ అని శ్రోతల నుంచి వక్తల సమూహాన్ని వేరు చేసినందున ‘మా’ ఆ సూచనను కొనసాగిస్తుంది; అయినప్పటికీ శ్రోతలు ఆ సహవాసంలో చేరాలనే ఆహ్వానాన్ని ముందరి వాక్యం స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. మూలంలోని సాక్ష్యభాష, ఉద్దేశ సంబంధం, ‘కూడా’ అనే పునరుక్తి, తండ్రి–కుమారునితో సహవాసం అనే సమాంతర నిర్మాణం నిలుపబడ్డాయి. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం.
