source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: te
  text: మనం ఆయనతో సహవాసం కలిగి ఉన్నామని చెప్పి, చీకటిలో నడుస్తుంటే, మనం అబద్ధమాడుతున్నాం; సత్యాన్ని ఆచరించడం లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సత్యాన్ని చేయడం లేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: చెప్పుకుంటూనే ... ఉంటే
  rationale: షరతును సహజమైన తెలుగులో నిలుపుతూ, మాటకూ జీవనానికీ మధ్య ఉన్న వైరుధ్యాన్ని ‘చెప్పుకుంటూనే’ స్పష్టంగా వ్యక్తం చేస్తుంది; ఇది కేవలం ప్రకటనకన్నా సందర్భంలోని వాదన స్వభావాన్ని తెలియజేస్తుంది.
- source_word: κοινωνίαν ἔχομεν
  choice: సహవాసం కలిగి ఉన్నాం
  rationale: κοινωνία యొక్క భాగస్వామ్య సంబంధ భావాన్ని కాపాడే, తెలుగు క్రైస్తవ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రయోగం.
- source_word: μετ’ αὐτοῦ
  choice: ఆయనతో
  rationale: మూలంలోని సర్వనామాన్ని విస్తరించి ‘దేవునితో’ అని వ్యాఖ్యానించకుండా, సందర్భ సూచనను అలాగే ఉంచుతుంది.
- source_word: ἐν τῷ σκότει
  choice: చీకటిలో
  rationale: యోహాను రచనల్లోని నైతిక-ఆధ్యాత్మిక చీకటి రూపకాన్ని నిలుపుతుంది. తెలుగులో నిర్దిష్ట ఉపపదం లేకపోవడంతో ‘చీకటిలో’ సహజంగా అదే భావరంగాన్ని అందిస్తుంది.
- source_word: περιπατῶμεν
  choice: నడుస్తుంటే
  rationale: జీవన విధానాన్ని సూచించే మూల రూపకాన్ని ‘జీవిస్తే’ అని విప్పి చెప్పకుండా నిలుపుతుంది; వర్తమాన క్రియలోని కొనసాగుతున్న ప్రవర్తన భావాన్ని కూడా తెలియజేస్తుంది.
- source_word: ψευδόμεθα
  choice: మనం అబద్ధమాడుతున్నాం
  rationale: వర్తమాన క్రియలోని కొనసాగుతున్న చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: సత్యాన్ని ఆచరించడం లేదు
  rationale: అక్షరార్థమైన ‘సత్యాన్ని చేయడం లేదు’ అనే యోహాను శైలీప్రయోగాన్ని తెలుగులో అర్థవంతంగా చేస్తూ, సత్యం జీవనాచరణలో కనిపించాలనే క్రియాత్మక భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: చీకటి అనే నైతిక-ఆధ్యాత్మిక రూపకం
  choice: చీకటిలో నడుస్తుంటే
  alternative: పాపంలో జీవిస్తుంటే
  rationale: ‘చీకటి’ని కేవలం పాపప్రవర్తనగా పరిమితం చేయకుండా, అసత్యం, చెడు, దేవునికి దూరత్వం వంటి యోహాను రచనలోని విస్తృత భావ ఉద్రిక్తతను నిలుపుతుంది.
- issue: ‘సత్యాన్ని చేయడం’ అనే యోహాను శైలీప్రయోగం
  choice: సత్యాన్ని ఆచరించడం లేదు
  alternative: సత్యాన్ని చేయడం లేదు
  rationale: మూలంలోని క్రియాత్మక నైతిక భావాన్ని నిలుపుతూ, ఆధునిక తెలుగులో అసహజంగా వినిపించే పదానువాదాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే బైబిలు రూపకాల గౌరవప్రదతను నిలుపుతూ రూపొందించబడింది. ‘సహవాసం,’ ‘చీకటిలో నడవడం,’ ‘సత్యాన్ని ఆచరించడం’ అనే కీలక భావాలను మతశాఖాపరమైన అదనపు వ్యాఖ్యానం లేకుండా ఉంచింది.
