id: 1JN.1.10
reference: 1 John 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: te
  text: మనం పాపం చేయలేదని చెబితే, ఆయనను అబద్ధికుడిగా చేస్తున్నాం; ఆయన వాక్యం మనలో లేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘ఆయన వాక్యం’ను ‘ఆయన సందేశం’ అని కూడా అనువదించవచ్చు. గ్రీకు λόγοςకు ఈ రెండు భావాలూ ఉండవచ్చు; యోహాను రచనల పదప్రయోగాన్ని నిలుపడానికి ‘వాక్యం’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: చెబితే
  rationale: ἐὰν + aorist subjunctive షరతును సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘చెబితే’ ఆ షరతు భావాన్ని స్పష్టంగా నిలుపుతుంది; ‘వాదిస్తే’ వంటి పదం మూలంలో లేని అదనపు భావాన్ని చేర్చుతుంది.
- source_word: οὐχ ἡμαρτήκαμεν
  choice: మనం పాపం చేయలేదు
  rationale: పరిపూర్ణ కాల క్రియ గతంలో జరిగిన పాపక్రియను ప్రస్తుతం ప్రాసంగికమైన నిరాకరణగా చూపుతుంది. తెలుగులో ‘పాపం చేయలేదు’ సహజంగా ఉండి ఈ భావాన్ని సందర్భంలో మోస్తుంది; ‘ఎప్పుడూ పాపం చేయలేదు’ అనడం మూలపాఠాన్ని మించి బలపరుస్తుంది.
- source_word: ψεύστην
  choice: అబద్ధికునిగా
  rationale: ψεύστης వ్యక్తిని సూచించే నామవాచకం—‘అబద్ధికుడు.’ దాని ప్రత్యక్షమైన వ్యక్తిగత బలాన్ని తగ్గించకుండా ఉంచుతుంది.
- source_word: ποιοῦμεν αὐτὸν
  choice: ఆయనను ... చేస్తున్నాం
  rationale: predicate accusativeతో ποιέω ఇక్కడ ఒకరిని అటువంటి వానిగా చేయడం లేదా ప్రకటించడం అనే భావం ఇస్తుంది. తెలుగు నిర్మాణం మూలంలోని నేరుగా పలికే బలాన్ని నిలుపుతుంది.
- source_word: ὁ λόγος αὐτοῦ
  choice: ఆయన వాక్యం
  rationale: λόγοςకు ‘వాక్యం,’ ‘సందేశం,’ ‘బోధ’ అనే భావాలు ఉండవచ్చు. ‘వాక్యం’ యోహాను రచనల పదప్రయోగ ప్రతిధ్వనిని, అలాగే దేవుడు పలికిన సత్యం మరియు ప్రకటిత సందేశం అనే సాధ్యమైన భావాలను నిలుపుతుంది.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: మనలో లేదు
  rationale: అంతర్గతమైన, సంబంధపూర్వకమైన భావాన్ని సరళంగా నిలుపుతుంది. ‘మనలో నివసించడం లేదు’ అనడం మూలంలో స్పష్టంగా లేని నివాస రూపకాన్ని చేర్చుతుంది.
theological_decisions:
- issue: αὐτόν / αὐτοῦ యొక్క సూచిత వ్యక్తి
  choice: ప్రధాన పాఠంలో ‘ఆయన/ఆయన వాక్యం’ అనే సర్వనామ రూపాన్నే ఉంచడం
  alternative: సందర్భాన్ని బట్టి ‘దేవుణ్ణి/దేవుని వాక్యం’ అని స్పష్టీకరించడం
  rationale: 1 యోహాను 1:5-10 సందర్భంలో సూచిత వ్యక్తి దేవుడు. అయినప్పటికీ గ్రీకు పాఠం సర్వనామాన్ని వాడుతుంది కాబట్టి అనువాదం దానిని భర్తీ చేయకుండా, సందర్భమే సూచిత వ్యక్తిని తెలియజేయనిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. సమూహాన్ని చేర్చే ‘మనం/మనలో’ రూపాలు ఉపయోగించబడ్డాయి. ‘అబద్ధికుడు’ అనే ప్రత్యక్ష నామవాచక బలం, ‘ఆయన’ అనే గ్రీకు సర్వనామంలోని సందర్భాధారిత సూచన నిలుపబడ్డాయి.
