id: 1JN.1.8
reference: 1 John 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: te
  text: మనకు పాపం లేదని మనం చెబితే,[a] మనల్ని మనమే మోసం చేసుకుంటాం; సత్యం మనలో లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత వ్యాఖ్యానాత్మకంగా, “మనకు పాపస్వభావం లేదని”; గ్రీకులో అక్షరార్థంగా “పాపం” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: మనం చెప్పుకుంటే
  rationale: ἐὰν తో కూడిన aorist subjunctive షరతును సహజమైన తెలుగులో ‘చెప్పుకుంటే’ అని వ్యక్తం చేశాం. ఈ ఆత్మసంబంధ వాదనకు ‘చెప్పుకుంటే’ సహజంగా సరిపోతుంది.
- source_word: ἁμαρτίαν οὐκ ἔχομεν
  choice: మనలో పాపం లేదు
  rationale: గ్రీకులోని ఏకవచన ἁμαρτίανను ఒక ప్రత్యేక పాపకార్యంగా కాక, వ్యక్తిలో పాపం ఉన్నదనే భావంలో ఉంచాం. తెలుగులో ‘మనలో పాపం లేదు’ అనేది ‘పాపం మనకు లేదు’ కంటే సహజంగా ఉండి, అంతర్గత ఉనికిని సూచిస్తుంది.
- source_word: ἑαυτοὺς πλανῶμεν
  choice: మనల్ని మనమే మోసం చేసుకుంటున్నాం
  rationale: Reflexive నిర్మాణాన్ని స్పష్టంగా నిలుపుతూ, స్వీయ మోసాన్ని ఆధునిక సహజ తెలుగులో వ్యక్తం చేశాం.
- source_word: ἡ ἀλήθεια
  choice: సత్యం
  rationale: Johannine సందర్భంలోని వాస్తవ సత్యం, దేవుని వెల్లడితో అనుసరణ, వ్యక్తిగత సత్యనిష్ఠ వంటి ప్రతిధ్వనులను ఏ ఒక్క అర్థానికీ పరిమితం చేయకుండా ‘సత్యం’గా ఉంచాం.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: మనలో లేదు
  rationale: ἐν ἡμῖν యొక్క అంతర్గత, వ్యక్తిగత భావాన్ని సహజంగా మరియు సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘మనలో పాపం లేదు’ అనే వాదనలో ‘పాపం’ అర్థం
  choice: పాపం వ్యక్తిలో లేదనే వాదనగా అనువదించబడింది; ఒక్క పాపకార్యాన్ని సూచించలేదు.
  alternative: ‘మనం పాపం చేయలేదు’ లేదా ‘మనలో పాపస్వభావం లేదు’
  rationale: ἁμαρτίαν ἔχομεν అంటే అక్షరార్థంగా ‘పాపం కలిగి ఉండడం’; ఇది 1 యోహాను 1:10లోని పాపం చేశామనే భాషతో భిన్నం. ‘పాపస్వభావం’ అనడం గ్రీకు పదం కంటే ఎక్కువ వ్యాఖ్యానాత్మకం.
- issue: ‘సత్యం మనలో లేదు’ అనే యోహానీయ వాక్యభావం
  choice: ‘సత్యం మనలో లేదు’ అని సంక్షిప్తతను అలాగే ఉంచాం.
  alternative: ‘దేవుని సత్యం మనలో లేదు’ లేదా ‘మనం సత్యం ప్రకారం జీవించడం లేదు’
  rationale: గ్రీకు వాక్యం objective divine truth మరియు subjective truthfulness రెండింటి ప్రతిధ్వనినీ అనుమతిస్తుంది; విస్తరించి చెప్పడం ఆ ఉద్దేశపూర్వక భావసాంద్రతను ఒకే అర్థానికి పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘చెప్పుకుంటే’ మరియు ‘మోసం చేసుకుంటున్నాం’ ద్వారా సహజ తెలుగు ప్రవాహాన్ని ఉంచుతూ, మూలంలోని షరతు మరియు స్వీయ మోసం స్పష్టంగా నిలుపబడ్డాయి.
