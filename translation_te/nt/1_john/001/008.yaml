revisions:
- from: మనలో పాపం లేదని మనం చెప్పుకుంటే,[a] మనల్ని మనమే మోసం చేసుకుంటున్నాం; సత్యం మనలో లేదు.
  to: మనకు పాపం లేదని మనం చెబితే,[a] మనల్ని మనమే మోసం చేసుకుంటాం; సత్యం మనలో లేదు.
  rationale: The revision restores the source’s ‘have no sin’ construction with natural Telugu possession language, retains the distinct final phrase ‘the truth is not in us,’ and uses a general present form appropriate to the conditional statement. No theological interpretation has been added.
