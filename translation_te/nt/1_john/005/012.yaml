id: 1JN.5.12
reference: 1 John 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: te
  text: కుమారుని కలిగియున్నవానికి జీవం[a] ఉంది; దేవుని కుమారుని కలిగిలేనివానికి జీవం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిత్యజీవం’; యోహాను రచనల్లో ఇక్కడి ‘జీవం’ కుమారునిలో లభించే జీవాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: కలిగివున్న వ్యక్తికి
  rationale: నిర్దేశక పదంతో కూడిన వర్తమాన కృదంతం ఒక వ్యక్తిని సాధారణంగా సూచిస్తుంది. ‘కలిగివున్న వ్యక్తి’ ఆధునిక తెలుగులో సహజంగా ఉండి, ఏకవచన సాధారణ భావాన్ని నిలుపుతుంది.
- source_word: τὸν υἱόν
  choice: కుమారుణ్ణి
  rationale: మొదటి వాక్యభాగంలో మూలపాఠం కేవలం ‘కుమారుడు’ అని ఉంది. సందర్భంలో దేవుని కుమారుడే ఉద్దేశించబడినప్పటికీ, మూలంలోని సంక్షిప్త రూపాన్ని నిలుపుతూ ‘దేవుని’ అని చేర్చలేదు.
- source_word: ἔχει
  choice: ఉంది
  rationale: తెలుగులో ‘వ్యక్తికి జీవం ఉంది’ అనేది సహజమైన స్వామ్య నిర్మాణం. ఇది ἔχω యొక్క ‘కలిగి ఉండడం’ అనే భావాన్ని అతిశయ వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: τὴν ζωήν
  choice: జీవం
  rationale: ζωή ను నేరుగా ‘జీవం’గా అనువదించడం ద్వారా యోహాను రచనల్లోని దాని సమృద్ధ భావాన్ని నిలిపి, ఈ వచనంలో స్పష్టంగా లేని ‘నిత్య’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా ఉంది.
- source_word: ὁ μὴ ἔχων
  choice: కలిగిలేని వ్యక్తికి
  rationale: μή తో నిరాకరించబడిన నామవాచకార్థక కృదంతాన్ని ఇది సహజ తెలుగులో వ్యక్తపరుస్తూ మొదటి భాగంతో సమాంతరతను కాపాడుతుంది.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: దేవుని కుమారుణ్ణి
  rationale: రెండవ భాగంలోని సంపూర్ణ బిరుదును, షష్ఠీ సంబంధంతో సహా, స్పష్టంగా నిలుపుతుంది.
- source_word: οὐκ ἔχει
  choice: లేదు
  rationale: తెలుగు స్వామ్య నిర్మాణంలో ‘జీవం లేదు’ అనేది οὐκ ἔχει కు సహజమైన ప్రతికూల సమానం; మొదటి భాగంలోని ‘జీవం ఉంది’తో స్పష్టమైన వ్యతిరేక సమాంతరతను ఇస్తుంది.
theological_decisions:
- issue: యోహాను రచనల సందర్భంలో ‘జీవం’ యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ζωή ను ‘జీవం’గా అనువదించడం
  alternative: నిత్యజీవం
  rationale: ఈ సందర్భంలో కుమారునిలో లభించే జీవం నిత్యజీవాన్ని సూచించినప్పటికీ, ఈ వచనంలోని గ్రీకు పాఠ్యంలో αἰώνιος లేదు. అందువల్ల ప్రధాన పాఠ్యం మూలంలోని ‘జీవం’నే ఉంచి, విస్తృత భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: సాధారణ వ్యక్తిని సూచించే పుంలింగ ఏకవచన కృదంతాలు
  choice: ‘వ్యక్తి’ అనే సాధారణ సూచనను ఉపయోగించడం
  alternative: ‘ఎవడు... వాడు...’ అనే పుంలింగ నిర్మాణం
  rationale: గ్రీకులోని పుంలింగ ఏకవచనం వ్యాకరణపరమైనదిగా, సాధారణ ప్రతినిధి భావంలో ఉంది. ‘వ్యక్తి’ ఉద్దేశాన్ని లింగపరంగా అనవసరంగా పరిమితం చేయకుండా ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. మూలంలోని రెండు భాగాల వ్యతిరేక సమాంతరతను ‘జీవం ఉంది / జీవం లేదు’ ద్వారా కాపాడాం; మొదటి భాగంలోని ‘కుమారుడు’ మరియు రెండవ భాగంలోని ‘దేవుని కుమారుడు’ అనే ఉద్దేశపూర్వక పదభేదాన్ని నిలిపాం.
