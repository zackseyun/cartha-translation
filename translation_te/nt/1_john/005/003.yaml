id: 1JN.5.3
reference: 1 John 5:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: te
  text: 'ఎందుకంటే దేవునిపట్ల ప్రేమ[a] అంటే ఇదే: మనం ఆయన ఆజ్ఞలను పాటించడం; ఆయన ఆజ్ఞలు భారమైనవి కావు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని ప్రేమ.” గ్రీకు పదబంధానికి దేవునిపట్ల మన ప్రేమ అనే అర్థమూ, దేవుని నుండి వచ్చే ప్రేమ అనే అర్థమూ రావచ్చు; అయితే తక్షణ సందర్భం దేవునిపట్ల ప్రేమ అనే అర్థానికే ఎక్కువ మద్దతిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη
  choice: ఇదే
  rationale: ముందుకు వచ్చే వివరణాత్మక వాక్యాన్ని సూచించే సర్వనామం; తెలుగు వాక్యనిర్మాణంలో ‘అంటే ఇదే’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యానికి కారణం లేదా వివరణను అందించే అనుసంధాన బలాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: దేవునిపట్ల ప్రేమ
  rationale: 2–3 వచనాల తక్షణ సందర్భంలో విశ్వాసులు దేవుణ్ణి ప్రేమించడం ఆయన ఆజ్ఞలను పాటించడంలో వ్యక్తమవుతోంది; అందువల్ల లక్ష్యార్థక షష్ఠీ భావం సహజమైన ప్రధాన పఠనం.
- source_word: ἵνα
  choice: అంటే … పాటించడం
  rationale: ఇక్కడ ఉద్దేశాన్ని కాక, దేవునిపట్ల ప్రేమ దేనిలో ఉందో వివరించే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐντολάς
  choice: ఆజ్ఞలను
  rationale: యోహాను రచనల్లోని ἐντολή పదానికి తగిన గంభీరతను, స్థిరమైన వాడుకను నిలుపుతుంది.
- source_word: τηρῶμεν
  choice: మనం … పాటించడం
  rationale: ఆజ్ఞలను కాపాడడం/గైకొనడం అనే మూలభావాన్ని ఆధునిక సాధారణ తెలుగులో ‘పాటించడం’ సహజంగా అందిస్తుంది.
- source_word: βαρεῖαι
  choice: భారమైనవి
  rationale: మోయడానికి కష్టమైనవి లేదా అణచివేసే భారంలాంటివి అనే రూపకార్థాన్ని మూలంలోని ‘బరువు’ చిత్రంతోనే తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ లోని షష్ఠీ విభక్తి భావం
  choice: దేవునిపట్ల విశ్వాసుల ప్రేమ
  alternative: విశ్వాసులపట్ల దేవుని ప్రేమ; లేదా రెండు భావాలనూ కలిగిన ఉద్దేశపూర్వక సందిగ్ధత
  rationale: మునుపటి వచనం దేవుణ్ణి ప్రేమించడాన్ని ఆయన ఆజ్ఞలను పాటించడంతో కలుపుతుంది; ఈ వచనం వెంటనే ఆ ప్రేమను ఆజ్ఞలను పాటించడంగా వివరిస్తుంది. కాబట్టి సందర్భం దేవునిపట్ల ప్రేమ అనే అర్థానికే ఎక్కువ మద్దతిస్తుంది. అయినప్పటికీ గ్రీకు పదబంధంలోని నిజమైన వ్యాకరణ సందిగ్ధతను పాదటిప్పణిలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘గైకొనడం’ కంటే నేటి వాడుకలో సహజమైన ‘పాటించడం’ ఎంచుకోబడింది; βαρεῖαι యొక్క మూల రూపకాన్ని నిలుపుటకు ‘భారమైనవి’ వాడబడింది.
