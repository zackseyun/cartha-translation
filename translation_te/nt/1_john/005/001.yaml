id: 1JN.5.1
reference: 1 John 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πᾶς ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ἐκ τοῦ θεοῦ γεγέννηται, καὶ πᾶς ὁ ἀγαπῶν τὸν γεννήσαντα ἀγαπᾷ ⸀καὶ τὸν γεγεννημένον ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: te
  text: యేసు మెస్సీయ[a] అని నమ్మే ప్రతి ఒక్కరూ దేవుని నుండి జన్మించారు.[b] జన్మనిచ్చినవానిని ప్రేమించే ప్రతి ఒక్కరూ, ఆయన నుండి జన్మించినవానినీ ప్రేమిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు.’ గ్రీకు Χριστός ఒక బిరుదు; దాని అర్థం ‘అభిషిక్తుడు.’
    reason: alternative_reading
  - marker: b
    text: ‘జన్మించారు,’ ‘జన్మనిచ్చినవానిని,’ ‘జన్మించినవానిని’ అనే చోట్ల గ్రీకులో ఒకే క్రియకు చెందిన రూపాలు వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: నమ్మే ప్రతి ఒక్కరూ
  rationale: వర్తమానకాల కృదంతానికి ఉన్న సాధారణ, వ్యక్తివాచక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: యేసే మెస్సీయ అని
  rationale: ὁ χριστός ఇక్కడ బిరుదు. ‘యేసే’ అనే రూపం యేసు వాగ్దానం చేయబడిన మెస్సీయ అనే ఒప్పుకోలులోని నిర్దిష్టతను సహజంగా తెలియజేస్తుంది.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: దేవుని నుండి జన్మించారు
  rationale: ἐκ దేవుణ్ణి మూలంగా సూచిస్తుంది; పరిపూర్ణ కర్మణి రూపం గతంలో సంభవించి కొనసాగుతున్న ఫలితాన్ని సూచిస్తుంది. తెలుగు గౌరవ/సామాన్య బహువచనం సహజంగా వాడబడింది.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: ప్రేమించే ప్రతి ఒక్కరూ
  rationale: మొదటి కృదంత నిర్మాణానికి సమాంతరంగా, సాధారణంగా వర్తించే భావాన్ని నిలుపుతుంది.
- source_word: τὸν γεννήσαντα
  choice: జన్మనిచ్చినవాణ్ణి
  rationale: ‘తండ్రి’ అని వ్యాఖ్యానాత్మకంగా చేర్చకుండా, γεννάω క్రియ యొక్క సకర్మక భావాన్ని మరియు తరువాతి కర్మణి రూపంతో ఉన్న పదబంధ సంబంధాన్ని నిలుపుతుంది.
- source_word: ἀγαπᾷ καὶ
  choice: కూడా ప్రేమిస్తారు
  rationale: καί ఇక్కడ రెండవ ప్రేమ-విషయాన్ని చేర్చుతుందని సహజ తెలుగు పదక్రమంలో తెలియజేస్తుంది.
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: ఆయన నుండి జన్మించినవాణ్ణి
  rationale: ముందటి ‘దేవుని నుండి జన్మించారు’ అనే భాషతోనూ, ‘జన్మనిచ్చినవాణ్ణి’ అనే క్రియామూలంతోనూ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; ‘ఆయన’ దేవుణ్ణి సూచించే గౌరవ ఏకవచనం.
theological_decisions:
- issue: γεννάω ద్వారా దైవిక జననం/కొత్త జననం
  choice: ‘జన్మించారు / జన్మనిచ్చినవాణ్ణి / జన్మించినవాణ్ణి’ అనే ఒకే క్రియామూలానికి సంబంధించిన రూపాలను ఉపయోగించడం
  alternative: ‘దేవుని పిల్లలు / తండ్రి’ అని సంబంధపదాలతో స్వేచ్ఛగా అనువదించడం
  rationale: మూలపాఠంలో ఒకే γεννάω పదకుటుంబం మూడుసార్లు రావడం వాక్యపు తర్కానికి కీలకం. సంబంధాన్ని స్పష్టంచేస్తూనే పునర్జన్మ క్రమం వంటి అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
- issue: ὁ χριστός అనే యేసు బిరుదు
  choice: మెస్సీయ
  alternative: క్రీస్తు; అభిషిక్తుడు
  rationale: ఇక్కడ ఇది పేరు మాత్రమే కాక, వాగ్దానం చేయబడిన అభిషిక్తుని సూచించే ఒప్పుకోలు. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని సాధారణ పాఠకునికి గుర్తించదగిన రీతిలో నిలుపుతుంది; సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- issue: τὸν γεγεννημένον యొక్క సూచిత వ్యక్తి
  choice: ‘ఆయన నుండి జన్మించినవాణ్ణి’ అని ఏకవచన సాధారణ రూపాన్ని నిలుపడం
  alternative: ‘దేవుని పిల్లలందరినీ’ అని బహువచనంగా స్పష్టీకరించడం
  rationale: సందర్భంలో ఇది తోటి విశ్వాసిని సూచించగలిగినా, గ్రీకు వ్యాకరణంలోని ఏకవచన సాధారణ రూపాన్ని విస్తరించి వ్యాఖ్యానించకుండా ఉంచడం మూలంలోని పరిధిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వచనశైలి. దేవునికి ‘ఆయన’ అనే గౌరవ సూచక రూపం వాడబడింది. గ్రీకు ఏకవచన సాధారణ నిర్మాణాన్ని తెలుగు సహజ గౌరవ/సామాన్య రూపాలతో వ్యక్తపరిచాం.
