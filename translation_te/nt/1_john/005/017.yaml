lexical_decisions:
- source_word: πᾶσα ἀδικία
  choice: ప్రతి అనీతి
  rationale: ఏకవచన నామవాచకంతో ఉన్న πᾶσα సమగ్ర భావాన్ని ఇస్తుంది. ‘ప్రతి అనీతి’ మూలంలోని విస్తృత నైతిక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἁμαρτία
  choice: పాపం
  rationale: రెండు సందర్భాల్లోనూ ἁμαρτίαకు ప్రామాణికమైన, సందర్భోచితమైన తెలుగు పదం.
- source_word: καὶ
  choice: కూడా
  rationale: రెండవ వాక్యభాగం మొదటి సాధారణ ప్రకటనకు ఒక వివరణాత్మక నిర్ధారణను జోడిస్తుంది; తెలుగులో ‘కూడా’ ఈ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὐ πρὸς θάνατον
  choice: మరణానికి దారితీయని
  rationale: πρός ఇక్కడ దిశ లేదా ఫలిత భావాన్ని సూచిస్తుంది. ‘దారితీయని’ అనేది ఆధునిక తెలుగులో స్పష్టంగా ఉండి మూలంలోని భావాన్ని కాపాడుతుంది.
- source_word: θάνατον
  choice: మరణం
  rationale: మూలపాఠం మరణం భౌతికమా, ఆధ్యాత్మికమా, అంతిమ తీర్పుకు సంబంధించినదా అని నిర్దిష్టం చేయదు; అందువల్ల సాధారణ పదమే ఉంచబడింది.
theological_decisions:
- issue: ‘మరణానికి దారితీయని పాపం’లో మరణం యొక్క స్వభావం
  choice: వివరణాత్మక విశేషణం లేకుండా ‘మరణం’ అని అనువదించడం
  alternative: భౌతిక మరణం; ఆధ్యాత్మిక మరణం; అంతిమ శిక్ష
  rationale: గ్రీకు పాఠంలో θάνατον మాత్రమే ఉంది. దాని స్వభావంపై ఉన్న వ్యాఖ్యాన భేదాలను అనువాదం నిర్ణయించకుండా మూలంలోని సందిగ్ధతను నిలుపుతుంది.
- issue: ἀδικία యొక్క నైతిక-దైవశాస్త్రీయ పరిధి
  choice: అనీతి
  alternative: తప్పుచేయడం; అన్యాయం
  rationale: ఈ పదం కేవలం సామాజిక అన్యాయానికే పరిమితం కాకుండా నీతికి విరుద్ధమైన సమస్త ప్రవర్తనను సూచిస్తుంది. ‘అనీతి’ ఆ విస్తృత భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘మరణం’ అనే పదానికి వ్యాఖ్యానాత్మక వివరణను జోడించకుండా దైవశాస్త్రీయ సందిగ్ధత నిలుపబడింది.
