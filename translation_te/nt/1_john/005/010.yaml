id: 1JN.5.10
reference: 1 John 5:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: te
  text: దేవుని కుమారునిలో విశ్వాసముంచేవాడు ఆ సాక్ష్యాన్ని తనలోనే[a] కలిగివున్నాడు. దేవుణ్ణి నమ్మనివాడు ఆయనను అబద్ధికునిగా చేశాడు[b]. ఎందుకంటే దేవుడు తన కుమారుని గురించి ఇచ్చిన సాక్ష్యాన్ని అతడు నమ్మలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘తనలోనే’ బదులు ‘అతనిలో’ అని ఉంది; దాన్ని ‘కుమారునిలో’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘ఆయనను అబద్ధికునిగా పరిగణించాడు.’ గ్రీకులో అక్షరార్థంగా ‘ఆయనను అబద్ధికునిగా చేశాడు’; దేవుని సాక్ష్యాన్ని తిరస్కరించడం దేవుడు చెప్పింది అబద్ధమని పరిగణించడమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων
  choice: విశ్వాసముంచేవాడు
  rationale: నామవాచకంగా వాడిన వర్తమాన కృదంతంలోని సాధారణ ఏకవచన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: దేవుని కుమారునిలో
  rationale: πιστεύωతో వచ్చిన εἰς వ్యక్తిపై నిలిపే విశ్వాసాన్ని సూచిస్తుంది; ‘కుమారునిలో విశ్వాసముంచడం’ ఈ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μαρτυρίαν
  choice: సాక్ష్యం
  rationale: యోహాను రచనల్లోని సాక్ష్యమిచ్చే భావాన్నీ, దాని విషయాన్నీ ఒకేసారి నిలుపుతుంది.
- source_word: ἐν αὑτῷ
  choice: తనలోనే
  rationale: SBLGNTలోని ఆత్మవాచక సర్వనామం ముందున్న విశ్వాసినే సహజంగా సూచిస్తుంది; ‘నే’ అంతర్గతంగా అతనిలో ఉన్నదనే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: దేవుణ్ణి నమ్మనివాడు
  rationale: ఇక్కడ దత్తివిభక్తితో వచ్చిన πιστεύω దేవుని ఉనికిని నమ్మకపోవడం కంటే, దేవుడు చెప్పిన సాక్ష్యాన్ని నిజమని అంగీకరించకపోవడాన్ని సూచిస్తుంది.
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: ఆయనను అబద్ధికునిగా చేశాడు
  rationale: గ్రీకు వాక్యంలోని గట్టిదనాన్ని, సంపూర్ణ కాలం సూచించే ప్రస్తుత ఫలితాన్ని వీలైనంత నేరుగా నిలుపుతుంది; భావం దేవుణ్ణి అబద్ధికునిగా పరిగణించడమని పాదసూచిక వివరిస్తుంది.
- source_word: οὐ πεπίστευκεν
  choice: నమ్మలేదు
  rationale: తెలుగులో సహజమైన భూతకాల రూపం; సందర్భంలో కొనసాగుతున్న అవిశ్వాసపు ఫలితం స్పష్టంగానే ఉంటుంది.
- source_word: ἣν μεμαρτύρηκεν ὁ θεὸς
  choice: దేవుడు ... ఇచ్చిన సాక్ష్యాన్ని
  rationale: గ్రీకులోని ఒకే మూలానికి చెందిన నామవాచక–క్రియ జంటను తెలుగులో యథాతథంగా పునరావృతం చేయడం అసహజం; ‘ఇచ్చిన సాక్ష్యం’ సాక్ష్యదాత దేవుడేనని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: తన కుమారుని గురించి
  rationale: περίతో షష్ఠీ విభక్తి ఇక్కడ ‘గురించి/సంబంధించి’ అనే భావాన్ని ఇస్తుంది; ‘తన’ దేవుణ్ణే సూచిస్తుంది.
theological_decisions:
- issue: ‘తనలోనే ఉన్న సాక్ష్యం’ ఎవరిని సూచిస్తుంది?
  choice: సాక్ష్యం విశ్వాసి తనలోనే కలిగివున్నదిగా అనువదించబడింది.
  alternative: కొన్ని ప్రతులలోని ‘అతనిలో’ అనే పాఠాన్ని అనుసరించి, అది కుమారునిలో ఉన్న సాక్ష్యమని అర్థం చేసుకోవచ్చు.
  rationale: ఇచ్చిన SBLGNT పాఠంలో ἐν αὑτῷ ఆత్మవాచక రూపం; ఇది ముందున్న విశ్వాసిని అత్యంత సహజంగా సూచిస్తుంది. సమీప వచనాల ఆధారంగా అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
- issue: ‘దేవుణ్ణి నమ్మకపోవడం’ యొక్క పరిధి
  choice: దేవుడు తన కుమారుని గురించి ఇచ్చిన సాక్ష్యాన్ని అంగీకరించకపోవడం.
  alternative: దేవుడు ఉన్నాడనే సాధారణ విశ్వాసం లేకపోవడం.
  rationale: తరువాతి ὅτι వాక్యం ఈ అవిశ్వాసాన్ని దేవుని సాక్ష్యాన్ని నమ్మకపోవడంగా వివరిస్తుంది; అందువల్ల ‘దేవునిలో విశ్వాసముంచనివాడు’ అని మార్చకుండా ‘దేవుణ్ణి నమ్మనివాడు’ అని ఉంచబడింది.
- issue: ‘ఆయనను అబద్ధికునిగా చేశాడు’ అనే వాక్యపు బలం
  choice: గ్రీకు వాక్యంలోని నేరమైన, కఠినమైన రూపం ప్రధాన పాఠంలో నిలుపబడింది.
  alternative: ‘ఆయనను అబద్ధికునిగా పరిగణించాడు’ లేదా ‘అబద్ధికునిగా చూపించాడు.’
  rationale: అవిశ్వాసి దేవుని స్వభావాన్ని నిజంగా మార్చాడనే భావాన్ని రుద్దకుండా, దేవుని సాక్ష్యాన్ని తిరస్కరించడం ఆయనను అబద్ధికునిగా పరిగణించడమేనన్న భావాన్ని పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరత కలిగిన శైలి వాడబడింది. ‘విశ్వాసముంచేవాడు,’ ‘సాక్ష్యం,’ ‘అబద్ధికుడు’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యే బైబిలు-సంబంధిత గౌరవప్రద పదజాలంగా నిలుపబడ్డాయి. అందించిన ఆంగ్ల consultation layerలో పాదసూచికల విషయాలు సూచికలతో తారుమారుగా ఉన్నందున, మూలపాఠంలోని స్థానాలకు అనుగుణంగా [a]ను పాఠాంతరానికి, [b]ను ‘అబద్ధికునిగా చేశాడు’ అనే పదబంధానికి జతచేశాం.
