id: 1JN.5.18
reference: 1 John 5:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: te
  text: దేవుని నుండి జన్మించిన ప్రతి ఒక్కరూ పాపం చేస్తూ ఉండడని మనకు తెలుసు.[a] కానీ దేవుని నుండి జన్మించినవాడు అతనిని కాపాడతాడు;[b] దుష్టుడు అతనిని తాకడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పాపం చేస్తూ ఉండడు’ అనే మాట గ్రీకు వర్తమానకాలంలోని కొనసాగింపు భావాన్ని ప్రతిబింబిస్తుంది. విశ్వాసులు ఎన్నటికీ ఏ పాపమూ చేయరని కాక, కొనసాగిస్తూ లేదా అలవాటుగా పాపం చేయరని ఇక్కడ భావం కావచ్చు (1 యోహాను 1:8-10; 2:1తో పోల్చండి).
    reason: cross_reference
  - marker: b
    text: లేదా, ‘దేవుని నుండి జన్మించినవాడు తనను తాను కాపాడుకుంటాడు.’ అయితే, ‘దేవుని నుండి జన్మించినవాడు’ అనేది విశ్వాసిని కాపాడే యేసు, దేవుని కుమారుణ్ణి సూచిస్తుందని అనేకమంది అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: c
    text: ‘తాకడం’ అనే మాట హాని చేయడానికి పట్టుకోవడం అనే భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: మనకు తెలుసు
  rationale: οἶδα రూపంలో పరిపూర్ణకాలంలా కనిపించినా, ఇక్కడ వర్తమాన స్థితిని సూచిస్తుంది. అందువల్ల సహజమైన ఆధునిక తెలుగులో ‘మనకు తెలుసు’ సరైనది.
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: దేవుని వల్ల జన్మించిన ప్రతివాడూ
  rationale: πᾶς ὁ + కృదంతం ‘అలా ఉన్న ప్రతి వ్యక్తి’ అనే పంపిణీ భావాన్ని ఇస్తుంది. γεγεννημένος పరిపూర్ణ కర్మణి కృదంతం కావడంతో జన్మించి ఆ స్థితిలో ఉన్న భావం నిలుస్తుంది.
- source_word: οὐχ ἁμαρτάνει
  choice: పాపం చేస్తూ ఉండడు
  rationale: వర్తమానకాల రూపంలోని కొనసాగుతున్న లేదా అలవాటైన క్రియాభావాన్ని తెలుగులో ‘చేస్తూ ఉండడు’ సహజంగా తెలియజేస్తుంది; విశ్వాసి ఎన్నటికీ ఏ పాపమూ చేయడనే సంపూర్ణ నిర్దోషతను ఇది అనవసరంగా ప్రకటించదు.
- source_word: ἀλλ’
  choice: దానికి బదులుగా
  rationale: ముందటి వాక్యభాగానికి విరుద్ధమైన, సరిదిద్దే మలుపును స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: దేవుని వల్ల జన్మించినవాడు
  rationale: గ్రీకు పదబంధాన్ని వివరణాత్మకంగా ‘యేసు’ లేదా ‘విశ్వాసి’ అని మార్చకుండా ఉంచి, దాని నిజమైన సూచనాసందిగ్ధతను కాపాడుతుంది.
- source_word: τηρεῖ αὐτόν
  choice: అతణ్ణి కాపాడుతాడు
  rationale: τηρέω ఇక్కడ కాపాడటం లేదా భద్రంగా ఉంచటం అనే భావాన్ని కలిగి ఉంది. αὐτόνను సాధారణ పురుష సర్వనామంగా అనువదించడం మూలపాఠానికి దగ్గరగా ఉంటుంది; ఆత్మవాచకంగా అర్థం చేసుకునే అవకాశాన్ని పాదసూచనలో తెలిపాం.
- source_word: ὁ πονηρὸς
  choice: దుష్టుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న యోహాను వాడుకలో ఇది సాధారణంగా అమూర్తమైన చెడును కాక, సాతాను అనే వ్యక్తిగత దుష్టుణ్ణి సూచిస్తుంది.
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: అతణ్ణి తాకడు
  rationale: ἅπτομαι యొక్క ప్రాథమిక భావమైన ‘తాకటం’ను నిలుపుతూ, హాని చేయడానికి పట్టుకోవడం అనే సందర్భార్థాన్ని పాదసూచన వివరిస్తుంది.
theological_decisions:
- issue: οὐχ ἁμαρτάνει అనే వర్తమానకాల వాక్యభాగం యొక్క భావం
  choice: కొనసాగుతూ లేదా అలవాటుగా పాపం చేయడాన్ని నిరాకరించేలా ‘పాపం చేస్తూ ఉండడు’ అని అనువదించాం.
  alternative: ‘పాపం చేయడు’ అని అనువదించి, విశ్వాసి అసలు ఏ పాపమూ చేయడని అర్థం చేసుకోవచ్చు.
  rationale: వర్తమానకాలంలోని కొనసాగింపు భావానికి, అలాగే 1 యోహాను 1:8-10; 2:1లో విశ్వాసుల పాపం అంగీకరించబడటానికి ఈ అనువాదం సరిపోతుంది.
- issue: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘దేవుని వల్ల జన్మించినవాడు’ అని సందిగ్ధతను నిలిపాం.
  alternative: ఇది దేవుని వల్ల జన్మించిన విశ్వాసిని సూచించవచ్చు; లేదా విశ్వాసిని కాపాడే యేసు, దేవుని కుమారుణ్ణి ప్రత్యేకంగా సూచించవచ్చు.
  rationale: గ్రీకు నిర్మాణం రెండు అవగాహనలకు వీలు కల్పిస్తుంది. ప్రధాన పాఠంలో ఏదో ఒక సిద్ధాంతపరమైన వివరణను బలవంతంగా చేర్చకుండా, ప్రత్యామlayersాన్ని పాదసూచనలో తెలిపాం.
- issue: αὐτόν మరియు αὐτοῦ సర్వనామాల సూచన
  choice: రెండింటినీ విశ్వాసిని సూచించే ‘అతణ్ణి’గా అనువదించాం.
  alternative: మొదటి αὐτόνను భావపరంగా ఆత్మవాచకంగా తీసుకొని ‘తన్ను తాను కాపాడుకుంటాడు’ అని అర్థం చేసుకోవచ్చు.
  rationale: ప్రతిలో ఉన్న αὐτόν స్వతహాగా ఆత్మవాచక సర్వనామం కాదు. అయినా, ముందు కర్తను విశ్వాసిగా తీసుకుంటే ఆత్మవాచక భావం సాధ్యమవుతుంది; అందుకే దాన్ని పాదసూచనలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలిని వాడాం. యోహాను రచనలోని ‘దేవుని వల్ల జన్మించడం’ అనే రూపకాన్ని నిలిపాం. పాపం విషయంలో క్రియ యొక్క కొనసాగింపు భావాన్ని సహజమైన ‘చేస్తూ ఉండడు’తో వ్యక్తం చేశాం. రెండవ ‘జన్మించినవాడు’ ఎవరనే సందిగ్ధతను ప్రధాన పాఠంలో పరిష్కరించకుండా పాదసూచనలో రెండు ప్రధాన అవగాహనలను ఇచ్చాం.
