- from: దేవుని కుమారుడు వచ్చాడనీ, సత్యవంతుణ్ణి మనం తెలుసుకునేలా మనకు అవగాహన ఇచ్చాడనీ మనకు తెలుసు. మనం సత్యవంతునిలో ఉన్నాం—ఆయన కుమారుడైన యేసు మెస్సీయలో ఉన్నాం. ఈయనే నిజమైన దేవుడు, శాశ్వత జీవం.[a]
