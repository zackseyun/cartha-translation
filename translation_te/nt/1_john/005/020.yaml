id: 1JN.5.20
reference: 1 John 5:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: te
  text: దేవుని కుమారుడు వచ్చాడని, సత్యమైనవానిని మనం తెలుసుకునేలా ఆయన మనకు అవగాహన ఇచ్చాడని మనకు తెలుసు. మనం సత్యమైనవానిలో ఉన్నాం—ఆయన కుమారుడైన యేసు మెస్సీయలో ఉన్నాం. ఈయనే[a] నిజమైన దేవుడు, శాశ్వత జీవం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఈయనే’ అనే మాట ప్రత్యేకంగా యేసు మెస్సీయను సూచించవచ్చు. అయితే కొందరు దీన్ని ముందటి వాక్యభాగంలోని ‘సత్యమైనవాడు,’ అంటే తండ్రిని సూచించేదిగా అర్థం చేసుకుంటారు.
    reason: οὗτός అనే నిర్దేశక సర్వనామం యొక్క పూర్వపదంపై ఉన్న వాక్యనిర్మాణ, వ్యాఖ్యాన అస్పష్టతను నిలుపుటకు.
lexical_decisions:
- source_word: οἴδαμεν
  choice: మనకు తెలుసు
  rationale: οἶδα పరిపూర్ణ రూపంలో ఉన్నప్పటికీ వర్తమాన స్థితిని తెలిపే వాడుక; స్థిరమైన జ్ఞానాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἥκει
  choice: వచ్చాడు
  rationale: వచ్చి ప్రస్తుతం ఉన్నాడనే ఫలితభావం సందర్భంలో అంతర్లీనంగా ఉంటుంది; తెలుగులో ‘వచ్చాడు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: δέδωκεν
  choice: ఇచ్చాడు
  rationale: ఇచ్చిన అవగాహన కొనసాగుతున్న ఫలితాన్ని సందర్భం తెలియజేస్తుంది; కృత్రిమ కాలరూపం లేకుండా సహజ తెలుగు వాడబడింది.
- source_word: διάνοιαν
  choice: అవగాహన
  rationale: కేవలం ‘మనస్సు’ అనే అర్థం కాకుండా సత్యాన్ని గ్రహించే సామర్థ్యాన్ని సూచిస్తుంది.
- source_word: ἵνα γινώσκωμεν
  choice: మనం తెలుసుకునేలా
  rationale: ἵνα ఉద్దేశాన్ని సూచిస్తుంది; వర్తమాన ఉపసంభావనను అతిగా వ్యాఖ్యానించకుండా సహజంగా అందిస్తుంది.
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: సత్యవంతుణ్ణి / సత్యవంతునిలో
  rationale: నామవాచకంగా వాడిన విశేషణాన్ని వ్యక్తిని సూచించేలా అనువదించి, రెండు చోట్ల యోహాను పునరుక్తిని నిలిపింది.
- source_word: ἐσμὲν ἐν
  choice: మనం …లో ఉన్నాం
  rationale: మూలంలో μένω లేదు; ‘నిలిచియున్నాం’ లేదా ‘ఐక్యమై ఉన్నాం’ వంటి వ్యాఖ్యాన విస్తరణను నివారిస్తుంది.
- source_word: Ἰησοῦ Χριστῷ
  choice: యేసు మెస్సీయలో
  rationale: Χριστός ఇక్కడ బిరుదు శక్తిని కలిగి ఉంది; ఆధునిక తెలుగులో ‘మెస్సీయ’ దానిని స్పష్టంగా ఉంచుతుంది.
- source_word: οὗτός
  choice: ఈయనే
  rationale: గ్రీకు నిర్దేశక సర్వనామ బలాన్ని సహజమైన గౌరవప్రద తెలుగు రూపంలో నిలుపుతుంది.
- source_word: ὁ ἀληθινὸς θεὸς
  choice: నిజమైన దేవుడు
  rationale: విధేయ పదబంధాన్ని నేరుగా, సాధారణ తెలుగు బైబిలు రిజిస్టరులో అందిస్తుంది.
- source_word: ζωὴ αἰώνιος
  choice: శాశ్వత జీవం
  rationale: యోహాను రచనల్లోని స్థిరమైన భావాన్ని—నిరంతరతతో కూడిన జీవాన్ని—సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος లో οὗτός యొక్క పూర్వపదం
  choice: ప్రధాన పాఠ్యంలో ‘ఈయనే’ అని ఉంచడం వల్ల సమీప పూర్వపదమైన యేసు మెస్సీయను సహజంగా సూచిస్తుంది.
  alternative: ఇది ముందు చెప్పిన ‘సత్యవంతుడు,’ అంటే తండ్రిని సూచిస్తుందని కూడా వాక్యనిర్మాణాన్ని అర్థం చేసుకోవచ్చు.
  rationale: οὗτός సాధారణంగా సమీపంలోని వ్యక్తి పూర్వపదాన్ని సూచించినా, ఈ వాక్యంలో చారిత్రకంగా చర్చించబడిన సూచన అస్పష్టత ఉంది. ప్రధాన పాఠ్యం నిర్దేశక బలాన్ని నిలుపుతుంది; పాదటిప్పణి ప్రత్యామ్నాయాన్ని సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘సత్యవంతుడు’ మరియు ‘నిజమైన దేవుడు’ మధ్య మూలంలోని substantival adjective/predicate adjective వ్యత్యాసాన్ని సహజంగా నిలిపింది. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
