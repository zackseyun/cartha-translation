id: 1JN.5.5
reference: 1 John 5:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: te
  text: మరి, యేసు దేవుని కుమారుడని నమ్మేవాడు తప్ప లోకాన్ని జయించేవాడు ఎవరు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘జయించేవాడు ... నమ్మేవాడు.’ గ్రీకులో పుంలింగ ఏకవచన కృదంతాలు ప్రతినిధి భావంలో వాడబడ్డాయి; అవి పురుషులకు మాత్రమే పరిమితం కావు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς δέ ἐστιν
  choice: మరి ... ఎవరు?
  rationale: δέ మునుపటి వాక్యంతో స్వల్ప అనుసంధానాన్ని చూపుతుంది; ‘మరి’ ఆ కొనసాగింపును సహజమైన తెలుగులో నిలుపుతుంది. τίς ఈ వాక్యాన్ని అలంకారిక ప్రశ్నగా ఉంచుతుంది.
- source_word: ὁ νικῶν
  choice: జయించేవాడు
  rationale: ఆర్టికల్‌తో ఉన్న వర్తమాన కృదంతం ఒక వ్యక్తిని సూచిస్తూ, లక్షణాత్మకంగా లేదా కొనసాగుతూ జరిగే జయాన్ని వ్యక్తం చేస్తుంది.
- source_word: τὸν κόσμον
  choice: లోకాన్ని
  rationale: యోహాను రచనల్లో κόσμος దేవునికి విరోధమైన లోక వ్యవస్థను సూచించగలిగినా, మూలపాఠం కేవలం ‘లోకం’ అనే పదాన్నే వాడుతుంది; వివరణాత్మక విస్తరణను నివారించాం.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: ఈ అలంకారిక ప్రశ్నలో εἰ μὴ మినహాయింపును, ప్రత్యేకతను తెలియజేస్తుంది; ‘తప్ప’ సహజమైన తెలుగు సమానార్థకం.
- source_word: ὁ πιστεύων
  choice: నమ్మేవాడు
  rationale: ఆర్టికల్‌తో ఉన్న వర్తమాన కృదంతంలోని క్రియాత్మక భావాన్ని ‘విశ్వాసి’ అనే నామవాచకంకంటే ‘నమ్మేవాడు’ బాగా నిలుపుతుంది.
- source_word: ὅτι
  choice: అని
  rationale: ఇక్కడ ὅτι నమ్మకానికి కారణాన్ని కాకుండా దాని విషయాన్ని పరిచయం చేస్తుంది.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: నిర్దిష్టమైన క్రీస్తు సంబంధ బిరుదును నేరుగా, దాని ఒప్పుకోలు బలాన్ని తగ్గించకుండా అందిస్తుంది.
theological_decisions:
- issue: ὁ νικῶν, ὁ πιστεύων అనే పుంలింగ ఏకవచన కృదంతాల అనువాదం
  choice: జయించేవాడు / నమ్మేవాడు
  alternative: జయించే వ్యక్తి / నమ్మే వ్యక్తి
  rationale: గ్రీకు రూపాలు వ్యాకరణపరంగా పుంలింగ ఏకవచనమైనా ప్రతినిధి లేదా సాధారణ భావంలో ఉన్నాయి. తెలుగు ‘-వాడు’ రూపం మూలంలోని ఏకవచన వ్యక్తిగత నిర్మాణాన్ని సహజంగా నిలుపుతుంది; అది పురుషులకు మాత్రమే పరిమితమని అర్థం కాకుండా పాదటిప్పణి స్పష్టం చేస్తుంది.
- issue: ὁ υἱὸς τοῦ θεοῦ లోని క్రీస్తు సంబంధ ఒప్పుకోలు
  choice: దేవుని కుమారుడు
  alternative: దేవుని పుత్రుడు
  rationale: ‘దేవుని కుమారుడు’ ఆధునిక సాధారణ తెలుగులో స్పష్టంగా ఉండి, యేసు గుర్తింపును తెలిపే మూలపాఠంలోని బిరుదును ఎటువంటి సిద్ధాంతపరమైన విస్తరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన అలంకారిక ప్రశ్నగా అనువదించబడింది. ‘లోకం’ అనే యోహాను పదానికి వివరణాత్మక భావాన్ని ప్రధాన పాఠంలో చేర్చలేదు; మూలంలోని ఏకవచన, క్రియాత్మక నిర్మాణం నిలుపబడింది.
