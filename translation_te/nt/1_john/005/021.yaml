  edition: SBLGNT
  text: Τεκνία, φυλάξατε ἑαυτὰ ἀπὸ τῶν ⸀εἰδώλων.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/021.yaml
  text: Little children[a], guard yourselves from idols.
translation:
  language: te
  text: చిన్నపిల్లలారా,[a] విగ్రహాల నుండి మిమ్మల్ని మీరు కాపాడుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పిల్లలారా,’ ‘ప్రియమైన పిల్లలారా.’ గ్రీకు పదం యోహాను నేరుగా సంబోధించేటప్పుడు ఉపయోగించిన ఆప్యాయతతో కూడిన లఘురూపం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: చిన్నపిల్లలారా
  rationale: τεκνίον పదానికి చెందిన సంబోధన బహువచనం. యోహాను వాడే కుటుంబసంబంధమైన ఆప్యాయతను, లఘురూపంలోని మృదుత్వాన్ని ఈ పదం నిలుపుతుంది.
- source_word: φυλάξατε
  choice: కాపాడుకోండి
  rationale: ఇది రెండవ పురుష బహువచన ఆజ్ఞార్థకం; అప్రమత్తంగా రక్షించుకోవాలనే పిలుపును తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἑαυτὰ
  choice: మిమ్మల్ని మీరు
  rationale: ఆత్మార్థక సర్వనామంలోని ప్రతిబింబార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀπὸ
  choice: నుండి
  rationale: వేరుగా ఉండడం లేదా దూరంగా ఉండడం అనే సంబంధాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: εἰδώλων
  choice: విగ్రహాల
  rationale: εἴδωλον సాధారణంగా పూజకు సంబంధించిన విగ్రహాన్ని సూచిస్తుంది. ‘విగ్రహాలు’ మూలపదాన్ని నేరుగా అనువదిస్తుంది; ‘అబద్ధ దేవుళ్లు’ అనడం భావాన్ని అవసరానికి మించి విస్తరిస్తుంది.
theological_decisions:
- issue: ‘విగ్రహాలు’ అనే పదపు పరిధి
  choice: మూలంలోని నిర్దిష్ట పదాన్ని ‘విగ్రహాలు’ అని అనువదించడం
  alternative: దేవుని స్థానాన్ని ఆక్రమించే ప్రతిదీ; సాధారణంగా విగ్రహారాధన
  rationale: గ్రీకు పాఠం నేరుగా విగ్రహాలనే పేర్కొంటుంది. హెచ్చరిక విస్తృతంగా వర్తించవచ్చునన్న సూచన ఉన్నా, అనువాదంలో మూలపాఠం చెప్పిన దానికంటే భావాన్ని విస్తరించకుండా దాని ఉద్వేగాన్ని నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంబోధన వాడబడింది. ‘చిన్నపిల్లలారా’లో యోహాను పలుకులోని కుటుంబసంబంధ ఆప్యాయత నిలిచింది; ‘మిమ్మల్ని మీరు కాపాడుకోండి’ ఆజ్ఞలోని అప్రమత్తతనూ ఆత్మార్థక భావాన్నీ స్పష్టంగా వ్యక్తం చేస్తుంది.
