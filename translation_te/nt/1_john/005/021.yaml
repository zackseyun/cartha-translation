  source_fidelity: ‘చిన్నపిల్లలారా’ accurately renders the affectionate vocative plural diminutive Τεκνία without adding an explicit adjective such as ‘ప్రియమైన.’ ‘విగ్రహాల నుండి మిమ్మల్ని మీరు కాపాడుకోండి’ preserves the imperative φυλάξατε, reflexive ἑαυτά, separation expressed by ἀπό, and the concrete εἰδώλων.
