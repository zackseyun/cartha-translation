id: 1JN.5.15
reference: 1 John 5:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ⸀ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ⸀ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: te
  text: మనం ఏమి అడిగినా[a] ఆయన మన మాట ఆలకిస్తాడని మనకు తెలిస్తే, మనం ఆయనను కోరినవాటిని కలిగి ఉన్నామని మనకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనం ఏది అడిగినా సరే.” గ్రీకు నిర్మాణం పరిమితిని నిర్దేశించని “ఏదైనా” అనే విస్తృత భావాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: ఆయన మన మాట వింటాడు
  rationale: ప్రార్థన లేదా విన్నపాన్ని దేవుడు వింటాడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘జవాబిస్తాడు’ అని అనువదించి గ్రీకు పదం కంటే ఎక్కువ భావాన్ని చేర్చదు.
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: మనం ఏమి అడిగినా
  rationale: సంబంధ సర్వనామం, ἐάν కలసి ఏర్పరిచే అనిర్దిష్టమైన, విస్తృత ‘ఏదైనా’ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αἰτώμεθα
  choice: అడిగినా
  rationale: ఇక్కడ αἰτέω ప్రార్థనలో అడగడాన్ని సూచిస్తుంది; ‘అడుగు’ సాధారణమైన, నేరుగా అర్థమయ్యే తెలుగు పదం.
- source_word: ἔχομεν
  choice: మనకు ఉన్నాయి
  rationale: వర్తమాన కాలంలోని ‘కలిగి ఉన్నాం’ అనే అర్థాన్ని నిలుపుతుంది; ‘పొందుతాం’ లేదా ‘పొందాము’ అనే వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: τὰ αἰτήματα ἃ ᾐτήκαμεν
  choice: మనం ... అడిగినవి
  rationale: తెలుగులో సహజంగా ఉండే విధంగా ‘మనం అడిగిన విన్నపాలు/విషయాలు’ అనే భావాన్ని వ్యక్తం చేస్తూ, అడగడమనే పదబంధ సంబంధాన్ని నిలుపుతుంది.
- source_word: ἀπ’ αὐτοῦ
  choice: ఆయనను అడిగినవి
  rationale: తెలుగులో ఒక వ్యక్తి నుండి ఏదైనా కోరడాన్ని సహజంగా ‘ఆ వ్యక్తిని అడగడం’ అని చెబుతారు; ఇది విన్నపం దేవుని వైపు ఉద్దేశించబడిందనే మూలభాష భావాన్ని నిలుపుతుంది.
- source_word: οἴδαμεν
  choice: మనకు తెలుసు
  rationale: యోహాను రచనలో పునరావృతమయ్యే జ్ఞానం, నిశ్చయత భావాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: ప్రార్థన సందర్భంలో ἀκούει అనేది కేవలం ‘వింటాడు’ అని అనువదించాలా, లేక అనుకూల స్పందనను సూచించే ‘జవాబిస్తాడు’ అని అనువదించాలా?
  choice: ఆయన మన మాట వింటాడు
  alternative: ఆయన మనకు జవాబిస్తాడు
  rationale: ఈ వాక్యం మొదట దేవుడు వింటాడనే నిశ్చయాన్ని పేర్కొని, దాని ఆధారంగా అడిగినవి మనకు ఉన్నాయని తేలుస్తుంది. ‘జవాబిస్తాడు’ అనడం ఈ రెండు దశలను ఒకటిగా చేసి, గ్రీకు పాఠం స్పష్టంగా చెప్పనిదాన్ని చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. మూలంలోని ‘మనకు తెలుసు’ అనే పునరుక్తిని, అలాగే దేవుడు ‘వింటాడు’ అన్న మాటకూ అడిగినవి ‘మనకు ఉన్నాయి’ అన్న మాటకూ మధ్యనున్న ధార్మిక ఉద్వేగాన్ని నిలుపుకున్నాం.
