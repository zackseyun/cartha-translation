  terminology: ‘చిత్తప్రకారం’ suitably conveys θέλημα in this context. ‘ధైర్యం’ is a viable contextual rendering of παρρησία, and the footnote responsibly supplies ‘నిశ్చయత’ and the nuance of uninhibited freedom of speech. The wording avoids doctrinal overstatement about answered prayer.
