  source_fidelity: 'The Telugu accurately reflects the Greek: παρρησία is rendered as confident boldness (''ధైర్యం''), πρὸς αὐτόν as ''ఆయన ఎదుట,'' the ὅτι clause as the content of that confidence, the general condition ''మనము ... అడిగితే,'' conformity to God''s will, and God''s hearing without adding that he grants every request.'
