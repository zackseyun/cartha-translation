id: 1JN.5.14
reference: 1 John 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: te
  text: 'ఆయన ఎదుట మనకు ఉన్న ధైర్యం[a] ఇదే: మనం ఆయన చిత్తప్రకారం ఏదైనా అడిగితే, ఆయన మన మాట వింటాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిశ్చయత”; ఈ మాటలో సంకోచం లేకుండా మాట్లాడగల స్వేచ్ఛ అనే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: ధైర్యం
  rationale: దేవుని సన్నిధిలో సంకోచం లేకుండా, నిశ్చయతతో ఆయనను సమీపించే భావాన్ని ఈ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; కేవలం బహిరంగంగా మాట్లాడడమనే భావానికి పరిమితం చేయదు.
- source_word: πρὸς αὐτόν
  choice: ఆయన ఎదుట
  rationale: వ్యక్తి వైపు ఉన్న సంబంధపూర్వక దృష్టిని, ప్రార్థన సందర్భంలో ఆయన సన్నిధిలో ఉండడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὅτι
  choice: 'ఇదే:'
  rationale: ὅτι ఇక్కడ కారణాన్ని కాకుండా, ముందున్న ‘ధైర్యం’లోని విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో ద్విబిందువు ఆ వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἐάν τι αἰτώμεθα
  choice: మనం … ఏదైనా అడిగితే
  rationale: సాధారణ షరతును, τι యొక్క విస్తృతమైన అనిర్దిష్ట పరిధిని సహజంగా నిలుపుతుంది.
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: ఆయన చిత్తప్రకారం
  rationale: κατά సూచించే అనుగుణతను కాపాడుతూ, θέλημα యొక్క దైవశాస్త్రపరమైన బరువును సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἀκούει ἡμῶν
  choice: ఆయన మన మాట వింటాడు
  rationale: ప్రార్థనను దేవుడు విని శ్రద్ధ చూపుతాడనే అర్థాన్ని సహజమైన తెలుగులో ఇస్తుంది; అడిగినది తప్పక వెంటనే అనుగ్రహిస్తాడనే అదనపు భావాన్ని చేర్చదు.
theological_decisions:
- issue: ప్రార్థనను దేవుడు ‘వినడం’ అనే మాట యొక్క పరిధి
  choice: ఆయన మన మాట వింటాడు
  alternative: ఆయన మనకు జవాబిస్తాడు / మనం అడిగినది అనుగ్రహిస్తాడు
  rationale: గ్రీకు వాక్యం దేవుడు వింటాడని చెబుతుంది; ప్రతి విన్నపం వెంటనే లేదా అడిగిన రూపంలోనే నెరవేరుతుందని ఈ వచనంలోకి చేర్చదు. తరువాతి వచనం స్వీకరించడం గురించి మరింత వివరిస్తుంది కాబట్టి ఇక్కడి దైవశాస్త్రపరమైన ఉద్వేగాన్ని అలాగే ఉంచాం.
- issue: παρρησία యొక్క భావ ఛాయ
  choice: ధైర్యం
  alternative: నిశ్చయత / సంకోచం లేని స్వేచ్ఛ
  rationale: ప్రార్థనలో దేవుని ఎదుట నిశ్చయతతో సమీపించడమూ, స్వేచ్ఛగా మాట్లాడడమూ ఇందులో కలిసివున్నాయి. ప్రధాన పాఠంలో సహజమైన ‘ధైర్యం’ను ఉంచి, మిగతా భావ ఛాయలను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ప్రార్థనా భాషను ఉపయోగించాం. ‘చిత్తప్రకారం’ అనే పరిచితమైన దైవశాస్త్ర పదబంధాన్ని ఉంచినా, మిగతా వాక్య నిర్మాణాన్ని సరళంగా ఉంచాం.
