  yaml_path: translation/nt/1_john/005/019.yaml
  text: We know that we are from God[b][a], and the whole world lies in the evil one.
translation:
  language: te
  text: మనం దేవుని నుండి వచ్చినవారమని మనకు తెలుసు; లోకమంతా దుష్టుని అధీనంలో ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “లోకమంతా దుష్టునిలో పడి ఉంది.” “దుష్టుడు” అనే పదాన్ని కొందరు “దుష్టత్వం” అని కూడా అర్థం చేసుకుంటారు; అయితే యోహాను రచనల్లో వ్యక్తిగతమైన అర్థానికే ఎక్కువ అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: మనకు తెలుసు
  rationale: οἶδα స్థిరమైన జ్ఞానం లేదా నిశ్చయాన్ని వ్యక్తం చేస్తుంది; ‘మనకు తెలుసు’ సహజమైన తెలుగులో పత్రికలోని ధైర్యభావాన్ని నిలుపుతుంది.
- source_word: ἐκ τοῦ θεοῦ ἐσμεν
  choice: మనం దేవుని నుండి వచ్చినవారము
  rationale: ἐκ మూలాన్ని లేదా సంబంధితత్వాన్ని సూచిస్తుంది. మూలంలో స్పష్టంగా లేని ‘దేవుని వల్ల పుట్టినవారము’ అనే ప్రత్యేక భావాన్ని చేర్చకుండా మూలార్థాన్ని నిలుపుతుంది.
- source_word: ὁ κόσμος ὅλος
  choice: లోకమంతా
  rationale: κόσμος దేవునికి విరోధంగా ఉన్న లోకవ్యవస్థను సూచించగలదు; ὅλος దాని సమగ్ర పరిధిని బలపరుస్తుంది. ‘లోకమంతా’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: ἐν τῷ πονηρῷ
  choice: దుష్టునిలో
  rationale: యోహాను రచనల సందర్భంలో substantivized πονηρός వ్యక్తిగతమైన ‘దుష్టుడు’ అనే భావానికే ఎక్కువ అవకాశం ఉంది. ἐν యొక్క రూపాన్ని వ్యాఖ్యానాత్మకంగా ‘అధీనంలో’ అని మార్చకుండా ‘లో’తో నిలిపాం.
- source_word: κεῖται
  choice: పడి ఉంది
  rationale: κεῖμαι యొక్క ‘పడి ఉండడం’ అనే రూపకాన్ని సహజమైన తెలుగులో నిలుపుతూ, కొనసాగుతున్న స్థితిని తెలియజేస్తుంది.
theological_decisions:
- issue: τῷ πονηρῷ అనేది వ్యక్తిగతమైన దుష్టుణ్ణి సూచిస్తుందా, లేక అమూర్తమైన దుష్టత్వాన్నా?
  choice: 'వ్యక్తిగత భావం: ‘దుష్టునిలో’'
  alternative: 'అమూర్త భావం: ‘దుష్టత్వంలో’'
  rationale: 1 యోహానులో ὁ πονηρός సాధారణంగా వ్యక్తిగతమైన దుష్టుణ్ణి సూచిస్తుంది (2:13-14; 3:12; 5:18); అయినప్పటికీ విశేషణరూపం అమూర్త భావానికి కొంత అవకాశం ఇస్తుంది కాబట్టి దానిని పాదటిప్పణిలో నమోదు చేశాం.
- issue: ἐν τῷ πονηρῷ యొక్క సంబంధాన్ని ఎంతవరకు వివరణాత్మకంగా అనువదించాలి?
  choice: రూపపరంగా దగ్గరైన ‘దుష్టునిలో పడి ఉంది’
  alternative: వివరణాత్మకంగా ‘దుష్టుని అధీనంలో ఉంది’
  rationale: ‘అధీనంలో’ సందర్భార్థాన్ని స్పష్టం చేసినా, గ్రీకులో లేని ‘అధికారం’ భావాన్ని విస్తరించవచ్చు. ప్రధాన పాఠంలో మూలంలోని రూపకాన్ని, పాదటిప్పణిలో సహజమైన భావానువాదాన్ని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘దేవుని నుండి వచ్చినవారు’ మూలం/సంబంధ భావాన్ని కాపాడుతుంది; ‘దుష్టునిలో పడి ఉంది’ గ్రీకు రూపకాన్నీ దాని అసౌకర్యకరమైన theological tension‌నూ ఉద్దేశపూర్వకంగా నిలుపుతుంది.
