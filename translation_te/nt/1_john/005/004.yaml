    issue: Awkward collocation in the second sentence
    rationale: ‘జయించిన జయం’ is an unnatural repetition in contemporary Telugu. Greek uses cognate forms (νίκη / νικήσασα), but Telugu can convey this naturally with ‘జయించిన విజయం.’
  revised_text: ఎందుకంటే, దేవుని నుండి పుట్టిన ప్రతి ఒక్కరూ[a] లోకాన్ని జయిస్తారు. లోకాన్ని జయించిన విజయం ఇదే—మన విశ్వాసం.[b]
