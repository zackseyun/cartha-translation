id: 1JN.5.4
reference: 1 John 5:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: te
  text: ఎందుకంటే, దేవుని నుండి పుట్టిన ప్రతి ఒక్కరూ[a] లోకాన్ని జయిస్తారు. లోకాన్ని జయించిన విజయం ఇదే—మన విశ్వాసం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని నుండి పుట్టిన ప్రతిదీ.’ గ్రీకులోని నపుంసక రూపం దేవుని నుండి పుట్టినవారి సమూహమంతటినీ వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మన విశ్వసనీయత.’ గ్రీకు పదం సందర్భాన్ని బట్టి ‘విశ్వాసం,’ ‘నమ్మకం,’ లేదా ‘విశ్వసనీయత’ అని అర్థమివ్వగలదు; ఇక్కడ ప్రధాన పాఠ్యంలో ‘విశ్వాసం’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని పరిచయం చేసే గ్రీకు సంధానపదంలోని కారణార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πᾶν τὸ γεγεννημένον
  choice: పుట్టిన ప్రతి ఒక్కరూ
  rationale: గ్రీకులో ఇది నపుంసక ఏకవచన రూపంలో ఉన్నప్పటికీ, సందర్భంలో దేవుని నుండి పుట్టినవారి సమూహాన్ని సూచిస్తుంది. వ్యక్తిగత సూచనను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, రూపంలోని విస్తృత భావాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: γεγεννημένον
  choice: పుట్టిన
  rationale: పూర్తయిన జననాన్ని, దాని కొనసాగుతున్న ఫలితాన్ని సూచించే పరిపూర్ణ కర్మణి భావాన్ని సందర్భానుగుణంగా సహజంగా తెలియజేస్తుంది.
- source_word: ἐκ τοῦ θεοῦ
  choice: దేవుని నుండి
  rationale: ἐκ సూచించే మూలం లేదా ఆవిర్భావాన్ని స్పష్టంగా కాపాడుతుంది; దేవుని వలన కలిగిన ఆధ్యాత్మిక జననాన్ని అతిగా వ్యాఖ్యానించదు.
- source_word: νικᾷ
  choice: జయిస్తారు
  rationale: ప్రస్తుతకాల భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; అదే వాక్యంలోని νίκη, νικήσασα పదాలతో ఉన్న మూలపద సంబంధాన్ని ‘జయం/జయించిన’ రూపాల ద్వారా నిలుపుతుంది.
- source_word: τὸν κόσμον
  choice: లోకాన్ని
  rationale: యోహాను రచనల్లో దేవునికి విరోధంగా ఉన్న లోక వ్యవస్థను సూచించగల స్థిరమైన పదాన్ని ఉపయోగిస్తుంది; ప్రధాన పాఠ్యంలో భావాన్ని విస్తరించి వ్యాఖ్యానించదు.
- source_word: αὕτη ἐστὶν ἡ νίκη
  choice: జయం ఇదే
  rationale: సూచక పదానికి ఉన్న నొక్కిచెప్పే భావాన్ని, νίκη అనే నామవాచకాన్ని సూటిగా కాపాడుతుంది.
- source_word: ἡ νικήσασα
  choice: జయించిన
  rationale: అయోరిస్టు కృదంతంలోని సాధించబడిన విజయ భావాన్ని తెలియజేస్తూ, νικᾷ/νίκηతో పదసంబంధాన్ని నిలుపుతుంది.
- source_word: ἡ πίστις ἡμῶν
  choice: మన విశ్వాసం
  rationale: πίστιςకు ఈ సందర్భంలో సహజమైన ప్రధాన అర్థం ‘విశ్వాసం’; ἡμῶνను స్వామ్యార్థకమైన ‘మన’గా అందిస్తుంది. ‘విశ్వసనీయత’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: πᾶν τὸ γεγεννημένον యొక్క సూచన
  choice: వ్యక్తులను సమష్టిగా సూచించే ‘పుట్టిన ప్రతి ఒక్కరూ’
  alternative: ‘దేవుని నుండి పుట్టిన ప్రతిదీ’
  rationale: నపుంసక రూపాన్ని అక్షరార్థంగా ‘ప్రతిదీ’ అని అనువదించవచ్చు; అయితే సందర్భం దేవుని పిల్లల గురించి మాట్లాడుతుంది. అందువల్ల వ్యక్తిగత అనువాదం ఉద్దేశిత సూచనను స్పష్టంగా తెలియజేస్తుంది; రూపపరమైన ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- issue: πίστις యొక్క అర్థం
  choice: విశ్వాసం
  alternative: విశ్వసనీయత; నమ్మకం
  rationale: ఈ వాక్యంలో లోకాన్ని జయించే దానిగా విశ్వాసుల ‘విశ్వాసం’ను గుర్తించడం అత్యంత సహజం. అయినప్పటికీ πίστις కొన్ని సందర్భాల్లో ‘విశ్వసనీయత’ అనే భావాన్ని కూడా కలిగి ఉండగలదు కాబట్టి దాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘జయిస్తారు—జయించిన జయం’ అనే ఉద్దేశపూర్వక పదపునరుక్తి గ్రీకులోని νικάω/νίκη మూలపద సంబంధాన్ని కాపాడుతుంది. ‘దేవుని నుండి’ మూలాన్ని స్పష్టపరుస్తుంది; కొత్త జన్మ భావాన్ని అదనపు సిద్ధాంత పదజాలంతో విస్తరించదు.
