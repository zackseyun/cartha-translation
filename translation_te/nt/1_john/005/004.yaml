- from: ఎందుకంటే, దేవుని నుండి పుట్టిన ప్రతి ఒక్కరూ[a] లోకాన్ని జయిస్తారు. లోకాన్ని జయించిన జయం ఇదే—మన విశ్వాసం.[b]
