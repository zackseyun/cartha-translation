    issue: An explicit witnessing clause is added before the final clause.
    rationale: The supplied Greek text contains only “the Spirit and the water and the blood, and the three are εἰς τὸ ἕν”; it does not include a verb corresponding to “సాక్ష్యమిస్తున్నాయి.” Though contextually true, this addition should not be placed in this bounded verse segment.
  - severity: low
