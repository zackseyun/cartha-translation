  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ πνεῦμα καὶ τὸ ὕδωρ καὶ τὸ αἷμα, καὶ οἱ τρεῖς εἰς τὸ ἕν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/008.yaml
  text: the Spirit and the water and the blood[a], and the three are for the one.
translation:
  language: te
  text: ఆత్మ, నీరు, రక్తం; ఈ మూడూ ఒకే విషయంపై ఏకీభవిస్తున్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ఈ మూడూ ఒక దాని వైపు ఉన్నాయి.” ఈ గ్రీకు ప్రయోగం సందర్భంలో వాటి సాక్ష్యం ఏకీభవిస్తోందని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: ఆత్మ
  rationale: తక్షణ సందర్భంలో ఇది సాక్ష్యమిచ్చే పరిశుద్ధాత్మను సూచించడం అత్యంత సహజం. తెలుగులో గౌరవార్థక పెద్ద అక్షర భేదం లేనందున సందర్భమే నిర్దిష్టతను తెలియజేస్తుంది.
- source_word: τὸ ὕδωρ
  choice: నీరు
  rationale: గ్రీకు పదంలోని స్పష్టమైన, మూర్త భావచిత్రాన్ని కాపాడుతూ, దాని ఖచ్చిత సూచనను ఈ వచనంలోనే వివరణాత్మకంగా నిర్ణయించలేదు.
- source_word: τὸ αἷμα
  choice: రక్తం
  rationale: మూలంలోని మూర్త నామవాచకాన్ని నేరుగా నిలుపుతూ, దాని సూచనను అనువాదంలో అదనంగా వ్యాఖ్యానించలేదు.
- source_word: οἱ τρεῖς
  choice: ఈ మూడూ
  rationale: ఇప్పుడే పేర్కొన్న ఆత్మ, నీరు, రక్తం అనే మూడింటిని సహజమైన తెలుగులో సమష్టిగా సూచిస్తుంది.
- source_word: εἰς τὸ ἕν εἰσιν
  choice: ఒకే సాక్ష్యానికి ఏకీభవిస్తున్నాయి
  rationale: εἰς τὸ ἕν అనే అసాధారణ నిర్మాణంలోని ‘ఒక దాని వైపు/ఒకటిగా’ అనే దిశాత్మక భావాన్ని, సాక్ష్య సందర్భంలో సహజ తెలుగుగా వ్యక్తం చేస్తుంది; అస్తిత్వపరమైన ఏకత్వాన్ని బలవంతంగా చొప్పించదు.
theological_decisions:
- issue: εἰς τὸ ἕν εἰσιν అస్తిత్వపరమైన ఏకత్వాన్నా, సాక్ష్యంలోని ఏకీభావాన్నా సూచిస్తుంది?
  choice: 'సాక్ష్యంలోని ఏకీభావం: “ఒకే సాక్ష్యానికి ఏకీభవిస్తున్నాయి”'
  alternative: “ఈ మూడూ ఒక్కటే” లేదా మరింత అక్షరార్థంగా “ఈ మూడూ ఒకటి వైపుగా ఉన్నాయి”
  rationale: 6–8 వచనాల సందర్భం సాక్ష్యమివ్వడంపై కేంద్రీకృతమై ఉంది. అందువల్ల ప్రధాన పాఠంలో సాక్ష్యాల సంగమాన్ని తెలుపుతూ, అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం మూలంలోని ఉద్వేగాన్ని కాపాడుతుంది; తరువాతి పాఠాంతర సంప్రదాయాల త్రిత్వ సంబంధ వాక్యాన్ని ఈ వచనంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకులో వరుసగా ఉన్న మూడు నామవాచకాలను స్పష్టంగా నిలిపి, సందర్భంలో అంతర్లీనంగా ఉన్న ‘సాక్ష్యమిస్తున్నాయి’ అనే భావాన్ని తెలుగులో వ్యక్తం చేశాం. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠంలో ఉంది.
