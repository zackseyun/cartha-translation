    rationale: εἰς τὸ ἕν can idiomatically refer to agreement in testimony, but it does not explicitly say “to one testimony.” “ఒకే విషయంపై ఏకీభవిస్తున్నాయి” gives the contextual sense more naturally while retaining appropriate openness.
