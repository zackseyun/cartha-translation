id: 1JN.5.2
reference: 1 John 5:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τούτῳ γινώσκομεν ὅτι ἀγαπῶμεν τὰ τέκνα τοῦ θεοῦ, ὅταν τὸν θεὸν ἀγαπῶμεν καὶ τὰς ἐντολὰς αὐτοῦ ⸀ποιῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: te
  text: 'దీనివల్ల మనం దేవుని పిల్లలను ప్రేమిస్తున్నామని తెలుసుకుంటాం: మనం దేవుణ్ణి ప్రేమించి, ఆయన ఆజ్ఞలను ఆచరించినప్పుడు[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులోని క్రియకు అక్షరార్థంగా ‘చేస్తాం’ అని అర్థం. సందర్భానుసారంగా ‘ఆయన ఆజ్ఞలను పాటించినప్పుడు’ లేదా ‘ఆయన ఆజ్ఞలకు లోబడినప్పుడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: దీనివల్ల
  rationale: ఏ ఆధారం లేదా సూచన ద్వారా ఒక విషయం తెలుసుకుంటామో తెలిపే యోహాను శైలిలోని ప్రయోగం; తెలుగులో సహజంగా ఉండేలా, సూచనార్థాన్ని నిలుపుతూ అనువదించబడింది.
- source_word: γινώσκομεν
  choice: మనం ... తెలుసుకుంటాం
  rationale: వర్తమాన కాలంలోని నిరంతర గుర్తింపును సాధారణ, స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀγαπῶμεν
  choice: ప్రేమిస్తున్నామని / ప్రేమించి
  rationale: రెండు చోట్ల ఉన్న ἀγαπάω రూపాలకు ‘ప్రేమించు’ అనే ఒకే మూలపదాన్ని ఉపయోగించి పదసంబంధాన్ని నిలుపుతుంది.
- source_word: τὰ τέκνα τοῦ θεοῦ
  choice: దేవుని పిల్లలను
  rationale: τέκνα అనే సమ్మిళిత సంతానార్థాన్ని ‘పిల్లలు’ సహజంగా వ్యక్తం చేస్తుంది; ‘కుమారులు’ అని లింగపరంగా పరిమితం చేయదు.
- source_word: ὅταν
  choice: అప్పుడు
  rationale: వర్తమాన సబ్జంక్టివ్‌లతో ఉన్న కాల-షరతు భావాన్ని ‘ప్రేమించి ... ఆచరించినప్పుడు’ అనే నిర్మాణంలో సహజంగా తెలియజేస్తుంది.
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: ఆయన ఆజ్ఞలను ఆచరించినప్పుడు
  rationale: ποιέω యొక్క ‘చేయు, అమలు చేయు’ భావాన్ని ‘ఆచరించు’ స్పష్టంగా తెలియజేస్తుంది; తెలుగులో అసహజమైన ‘ఆజ్ఞలను చేయు’ అనే పదప్రయోగాన్ని నివారిస్తుంది.
theological_decisions:
- issue: దేవుని పిల్లలపట్ల ప్రేమకు, దేవునిపట్ల ప్రేమ మరియు ఆయన ఆజ్ఞల ఆచరణకు మధ్య సంబంధం
  choice: ఈ రెండవ అంశాలు దేవుని పిల్లలను ప్రేమిస్తున్నామని తెలుసుకునే సూచనగా వాక్యం చెప్పినట్టుగానే ఉంచబడింది.
  alternative: దీనిని కేవలం సాక్ష్యపరీక్షగా, కారణ సంబంధంగా, లేదా పరస్పర నిర్వచనంగా స్పష్టీకరించడం.
  rationale: గ్రీకు వాక్యం సంబంధాన్ని సంక్షిప్తంగా, కొంత ఉద్రిక్తతతో వ్యక్తం చేస్తుంది; అనువాదం దాని కంటే ఎక్కువగా కారణాత్మకమో నిర్వచనాత్మకమో నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని వాక్యక్రమం మరియు ‘దీనివల్ల ... అప్పుడు’ అనే సూచనాత్మక నిర్మాణం సాధ్యమైనంతవరకు నిలుపబడింది.
