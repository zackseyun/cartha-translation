translation:
  language: te
  text: ఎందుకంటే సాక్ష్యమిచ్చేవారు ముగ్గురు ఉన్నారు,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'తరువాతి కొన్ని ప్రతులు సాధారణంగా ‘కోమా యోహానేయుం’ అని పిలువబడే విస్తృత పాఠాన్ని చేర్చాయి: ‘పరలోకంలో—తండ్రి, వాక్యము, పరిశుద్ధాత్మ; ఈ ముగ్గురూ ఒకటే. భూమిమీద సాక్ష్యమిచ్చేవారు ముగ్గురు ...’ ఈ పదాలు తొలి గ్రీకు ప్రతుల సాక్ష్యంలో లేవు; SBLGNT పాఠంలోనూ చేర్చబడలేదు.'
    reason: textual_variant
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యంలోని వాదనకు కారణం లేదా వివరణను పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τρεῖς
  choice: ముగ్గురు
  rationale: సాక్ష్యమిచ్చేవారిని వ్యక్తులుగా సూచిస్తున్నందున తెలుగులో వ్యక్తివాచక సంఖ్యారూపమైన ‘ముగ్గురు’ సహజం.
- source_word: εἰσιν
  choice: ఉన్నారు
  rationale: వర్తమానకాల అస్తిత్వాన్ని తెలిపే క్రియ; వ్యక్తులను సూచించే ‘ముగ్గురు’తో ‘ఉన్నారు’ సహజంగా సరిపోతుంది.
- source_word: οἱ μαρτυροῦντες
  choice: సాక్ష్యమిచ్చేవారు
  rationale: ఆర్టికల్‌తో ఉన్న వర్తమాన కృదంతం ‘సాక్ష్యమిస్తున్నవారు/సాక్ష్యమిచ్చేవారు’ అనే క్రియాత్మక భావాన్ని కలిగి ఉంది. ‘సాక్షులు’ కంటే ‘సాక్ష్యమిచ్చేవారు’ మూలంలోని చర్యను మెరుగుగా నిలుపుతుంది.
theological_decisions:
- issue: 1 యోహాను 5:7 పాఠరూపం మరియు Comma Johanneum
  choice: 'SBLGNTలో ఉన్న సంక్షిప్త పాఠాన్ని మాత్రమే ప్రధాన వచనంగా అనువదించడం: ‘ఎందుకంటే సాక్ష్యమిచ్చేవారు ముగ్గురు ఉన్నారు,’'
  alternative: 'తరువాతి కొన్ని ప్రతుల్లో ఉన్న విస్తృత పాఠం: ‘పరలోకంలో—తండ్రి, వాక్యము, పరిశుద్ధాత్మ; ఈ ముగ్గురూ ఒక్కరే. భూమిమీద సాక్ష్యమిచ్చేవారు ముగ్గురు...’'
  rationale: అందించిన గ్రీకు మూలపాఠం సంక్షిప్త రూపాన్నే కలిగి ఉంది. ప్రసిద్ధ త్రిత్వ విస్తరణ తొలి గ్రీకు ప్రతుల సాక్ష్యంలో లేదు; SBLGNTలోనూ చేర్చబడలేదు. అందువల్ల ప్రధాన వచనం మూలపాఠాన్ని అనుసరిస్తూ, చారిత్రకంగా ప్రాముఖ్యమైన విస్తృత పాఠాన్ని పాదసూచికలో పారదర్శకంగా తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. తరువాతి వచనంతో వాక్యం కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
