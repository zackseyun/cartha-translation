revisions:
- from: ఎవరైనా తన సహోదరుడు[a] మరణానికి దారితీయని[b] పాపం చేస్తుండడం చూస్తే, అతడు అడగాలి; అప్పుడు దేవుడు[c] అతనికి జీవం ఇస్తాడు—మరణానికి దారితీయని పాపాలు చేస్తున్నవారికి. మరణానికి దారితీసే పాపం ఉంది; దాని గురించి అతడు అడగాలని నేను చెప్పడం లేదు.
  to: ఎవరైనా తన సహోదరుడు[a] మరణానికి దారితీయని[b] పాపం చేస్తూ ఉండటం చూస్తే, అతడు అడగాలి; అప్పుడు దేవుడు[c] ఆ సహోదరునికి జీవం ఇస్తాడు—మరణానికి దారితీయని పాపం చేస్తున్నవారికి. మరణానికి దారితీసే పాపం ఉంది; దాని గురించి అతడు అడగాలని నేను చెప్పడం లేదు.
  rationale: The revision is limited to safe stylistic and referential improvements. It retains the singular “brother,” the source text’s singular-to-plural shift (“him … to those sinning”), the ambiguity of “death,” and the limited force of “I am not saying that he should ask.” No doctrinal interpretation has been added.
