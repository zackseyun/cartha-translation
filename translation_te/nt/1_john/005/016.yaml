id: 1JN.5.16
reference: 1 John 5:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/016.yaml
  text: If anyone sees his brother committing a sin not leading to death[a], he shall ask, and God will give him life—to those committing sins not leading to death. There is sin leading to death[c][b]; I am not saying that he should ask about that.
translation:
  language: te
  text: ఎవరైనా తన సహోదరుడు[a] మరణానికి దారితీయని[b] పాపం చేస్తూ ఉండటం చూస్తే, అతడు అడగాలి; అప్పుడు దేవుడు[c] ఆ సహోదరునికి జీవం ఇస్తాడు—మరణానికి దారితీయని పాపం చేస్తున్నవారికి. మరణానికి దారితీసే పాపం ఉంది; దాని గురించి అతడు అడగాలని నేను చెప్పడం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరుడు’ అనే గ్రీకు పదం ఏకవచన పుంలింగంలో ఉంది. ఇక్కడ అది తోటి విశ్వాసిని సూచించే అవకాశం ఎక్కువ; సందర్భంలో క్రైస్తవ సమాజంలోని విశ్వాసులను విస్తృతంగా సూచించవచ్చు.
    reason: cultural_note
  - marker: b
    text: ఇక్కడ ‘మరణం’ అనేది శారీరక మరణమా, ఆధ్యాత్మిక మరణమా, లేక అంతిమ శిక్షా అనేది గ్రీకు పాఠ్యం నిర్దిష్టంగా చెప్పదు.
    reason: alternative_reading
  - marker: c
    text: గ్రీకు పాఠ్యంలో అక్షరార్థంగా ‘అతనికి జీవం ఇస్తాడు’ అని ఉంది; ఇచ్చేవాని పేరు చెప్పబడలేదు. ప్రార్థన సందర్భం వల్ల దేవుడే ఇచ్చేవాడని భావించి ప్రధాన పాఠ్యంలో స్పష్టం చేశాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφὸν
  choice: సహోదరుడు
  rationale: గ్రీకు పదం ఏకవచన పుంలింగంలో ఉంది; యోహాను రచనల సందర్భంలో ఇది సాధారణంగా తోటి విశ్వాసిని సూచిస్తుంది. మూలరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భంలో ఉండగల విస్తృత భావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: ἁμαρτάνοντα ἁμαρτίαν
  choice: పాపం చేస్తుండడం
  rationale: క్రియతో పాటు అదే మూలానికి చెందిన కర్మపదం ఒక నిర్దిష్ట పాపకార్యాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఇది సహజమైన వ్యక్తీకరణ.
- source_word: μὴ πρὸς θάνατον
  choice: మరణానికి దారితీయని
  rationale: πρός ఇక్కడ ఫలితం లేదా గమ్యం వైపు నడిపే భావాన్ని ఇస్తుంది. ‘మరణం’ ఏ రకమైనదో నిర్ణయించకుండా మూలంలోని సందిగ్ధతను నిలిపింది.
- source_word: αἰτήσει
  choice: అతడు అడగాలి
  rationale: భవిష్యత్ సూచకరూపం ఈ సందర్భంలో ఆదేశాత్మక బలంతో వాడబడవచ్చు. పాపాన్ని చూసిన వ్యక్తి చేయవలసిన ప్రతిస్పందనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δώσει αὐτῷ ζωήν
  choice: అప్పుడు దేవుడు అతనికి జీవం ఇస్తాడు
  rationale: గ్రీకులో ఇచ్చేవాని కర్త ప్రత్యక్షంగా లేదు. ప్రార్థన మరియు దేవుని అనుగ్రహం అనే సందర్భం వల్ల దేవుడే కర్తగా బలంగా సూచించబడుతున్నాడు; తెలుగు వాక్య స్పష్టత కోసం ఆయనను వ్యక్తం చేశాం.
- source_word: ζωήν
  choice: జీవం
  rationale: యోహాను రచనల్లో ఈ పదానికి సమృద్ధమైన ఆధ్యాత్మిక భావం ఉన్నప్పటికీ, మూలంలోని సాధారణ పదాన్నే ఉంచి ‘ఆధ్యాత్మిక జీవం’ లేదా ‘నిత్యజీవం’ అని పరిధిని కుదించలేదు.
- source_word: τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον
  choice: —మరణానికి దారితీయని పాపాలు చేస్తున్నవారికి
  rationale: ఈ బహువచన దత్తివాచక పదబంధం వాక్యనిర్మాణపరంగా క్లిష్టమైనది. డాష్ తర్వాత వివరణాత్మకంగా ఉంచడం ద్వారా దాని అన్వయాన్ని నిలిపి, ఊహాత్మక పునర్నిర్మాణాన్ని నివారించాం.
- source_word: ἔστιν ἁμαρτία πρὸς θάνατον
  choice: మరణానికి దారితీసే పాపం ఉంది
  rationale: నిర్దేశక ఉపపదం లేని గ్రీకు నిర్మాణంలోని సంక్షిప్తతను నిలిపి, ఇది ఒక ప్రత్యేక కార్యమా లేక పాపపు వర్గమా అని అనవసరంగా నిర్ణయించలేదు.
- source_word: οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ
  choice: దాని గురించి అతడు అడగాలని నేను చెప్పడం లేదు
  rationale: περὶ ἐκείνης ను ‘దాని గురించి’ అని సహజంగా అనువదించాం. ముందున్న αἰτέωతో సంబంధం కనిపించేలా ἐρωτάωకూ ‘అడగడం’ వాడి, ప్రార్థన అనే సందర్భార్థాన్ని ప్రత్యేక పదంతో అతిగా నిర్దేశించలేదు.
theological_decisions:
- issue: ‘మరణానికి దారితీసే పాపం’లో ‘మరణం’ యొక్క అర్థం
  choice: ‘మరణం’ అనే పదాన్ని వివరణాత్మక విశేషణం లేకుండా ఉంచడం
  alternative: శారీరక మరణం, ఆధ్యాత్మిక మరణం, లేదా అంతిమ తీర్పు అని నిర్దిష్టంగా అనువదించడం
  rationale: ఈ వచనం మరణ స్వభావాన్ని నిర్వచించదు; అందువల్ల విస్తృతంగా చర్చించబడే ఈ సందిగ్ధతను ప్రధాన పాఠ్యం పరిష్కరించదు.
- issue: ‘జీవం ఇస్తాడు’ అనే వాక్యంలో ఇచ్చేవాని గుర్తింపు
  choice: దేవుణ్ణి స్పష్టమైన కర్తగా పేర్కొనడం
  alternative: ‘అతడు అతనికి జీవం ఇస్తాడు’ అని అస్పష్టంగా ఉంచడం లేదా ప్రార్థించే వ్యక్తినే కర్తగా గ్రహించడం
  rationale: మూలంలో కర్త అవ్యక్తమైనా, ప్రార్థన సందర్భంలో జీవం ఇచ్చేవాడు దేవుడని బలంగా సూచించబడుతుంది. దీనిని స్పష్టం చేయడం తెలుగు పఠనీయతకు తోడ్పడుతుంది; దీనిపై పాదటిప్పణి ఉంచాం.
- issue: మరణానికి దారితీసే పాపం గురించి అడగడంపై చివరి వాక్య బలం
  choice: ‘అడగాలని నేను చెప్పడం లేదు’ అనే పరిమిత వ్యాఖ్య
  alternative: ‘అడగకూడదు’ అనే సంపూర్ణ నిషేధం
  rationale: οὐ ... λέγω ἵνα నిర్మాణం నేరుగా ‘నేను అలా అడగమని చెప్పడం లేదు’ అంటుంది; దాన్ని సంపూర్ణ నిషేధంగా బలపరచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘జీవం,’ ‘మరణం,’ ‘పాపం’ వంటి యోహాను రచనల ప్రధాన పదాలను వ్యాఖ్యాత్మకంగా విస్తరించకుండా ఉంచాం. గ్రీకు వాక్యంలోని ఏకవచన–బహువచన మార్పును డాష్‌తో సాధ్యమైనంతవరకు నిలిపాం.
