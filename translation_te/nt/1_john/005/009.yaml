id: 1JN.5.9
reference: 1 John 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ⸀ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: te
  text: 'మనం మనుషుల సాక్ష్యాన్ని అంగీకరిస్తే, దేవుని సాక్ష్యం అంతకంటే గొప్పది. ఎందుకంటే దేవుని సాక్ష్యం ఇదే: ఆయన తన కుమారుని గురించి సాక్ష్యమిచ్చాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'చివరి ఉపవాక్యాన్ని కారణార్థకంగా కూడా అర్థం చేసుకోవచ్చు: “ఎందుకంటే ఆయన తన కుమారుని గురించి సాక్ష్యమిచ్చాడు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: సాక్ష్యం
  rationale: న్యాయపరమైన లేదా ఆధారపూర్వక భావాన్ని సహజంగా తెలియజేస్తుంది; పదపునరుక్తిని కూడా నిలుపుతుంది.
- source_word: ἀνθρώπων
  choice: మనుషుల
  rationale: ఇక్కడ పురుషులను మాత్రమే కాక, దేవునికి భిన్నంగా మానవులను సాధారణంగా సూచిస్తోంది.
- source_word: λαμβάνομεν
  choice: అంగీకరిస్తే
  rationale: సాక్ష్యాన్ని కేవలం పొందడం కంటే దాన్ని విశ్వసనీయమైనదిగా స్వీకరించే సందర్భార్థాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: μείζων
  choice: అంతకంటే గొప్పది
  rationale: దేవుని సాక్ష్యం మానవ సాక్ష్యాన్ని మించుతుందనే తులనను స్పష్టంగా తెలుపుతుంది.
- source_word: αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ
  choice: దేవుని సాక్ష్యం ఇదే
  rationale: గ్రీకు వాక్యంలోని ఉద్ఘాటనను, సాక్ష్యం అనే పదపునరుక్తిని నిలుపుతుంది.
- source_word: μεμαρτύρηκεν
  choice: సాక్ష్యమిచ్చాడు
  rationale: పూర్తయినప్పటికీ కొనసాగుతున్న ప్రాముఖ్యతగల సాక్ష్యాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: తన కుమారుని గురించి
  rationale: περί సముచితంగా ‘గురించి’ అని అనువదించబడింది; αὐτοῦ కర్తయైన దేవునిని తిరిగి సూచిస్తున్నందున ‘తన’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: రెండవ ὅτι యొక్క విధి
  choice: సాక్ష్యపు విషయాన్ని పరిచయం చేసే ఉపవాక్యం
  alternative: 'కారణార్థక ఉపవాక్యం: ‘ఎందుకంటే ఆయన తన కుమారుని గురించి సాక్ష్యమిచ్చాడు’'
  rationale: αὕτη ἐστὶν ἡ μαρτυρία తరువాత ఇది దేవుని సాక్ష్యం ఏమిటో వివరించడం అత్యంత సహజం; అయినా గ్రీకులో కారణార్థక అవగాహనకు అవకాశం ఉన్నందున పాదటిప్పణిలో ఉంచబడింది.
- issue: ἀνθρώπων యొక్క సాధారణ మానవ సూచన
  choice: మనుషుల
  alternative: ప్రజల
  rationale: ఈ పదం ఇక్కడ లింగపరంగా పురుషులను మాత్రమే సూచించదు; మానవ సాక్ష్యాన్ని దేవుని సాక్ష్యంతో పోలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సాక్ష్యం’ అనే కీలక పదాన్ని వచనమంతటా స్థిరంగా ఉంచి, గ్రీకు వాక్యంలోని పునరుక్తిని కాపాడాం.
