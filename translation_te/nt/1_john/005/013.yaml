source:
  edition: SBLGNT
  text: Ταῦτα ἔγραψα ⸀ὑμῖν ἵνα εἰδῆτε ὅτι ζωὴν ⸂ἔχετε αἰώνιον⸃, ⸂τοῖς πιστεύουσιν⸃ εἰς τὸ ὄνομα τοῦ υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: te
  text: దేవుని కుమారుని నామంలో విశ్వసించే మీకు[a] ఈ సంగతులు రాశాను, మీరు నిత్యజీవం కలిగివున్నారని తెలుసుకునేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, గ్రీకు పదక్రమానికి మరింత దగ్గరగా: “మీరు నిత్యజీవం కలిగివున్నారని తెలుసుకునేలా ఈ సంగతులు మీకు రాశాను—దేవుని కుమారుని నామంలో విశ్వసించేవారికి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: ఈ సంగతులు
  rationale: నపుంసక బహువచన సూచకసర్వనామాన్ని అలాగే నిలుపుతూ, లేఖలోని విషయాలను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: ἔγραψα
  choice: రాశాను
  rationale: గ్రీకు ఏఒరిస్ట్ పూర్తయిన రచనా చర్యను సూచిస్తుంది; తెలుగు లేఖా సందర్భంలో సాధారణ భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: దత్తి విభక్తిలోని పరోక్ష కర్మను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα εἰδῆτε
  choice: తెలుసుకోవాలని
  rationale: ἵνα సూచించే ఉద్దేశ భావాన్ని సహజమైన తెలుగు ఉద్దేశార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవం
  rationale: యోహాను రచనల్లోని స్థిరమైన భావాన్ని సంక్షిప్తంగా, పరిచితంగా నిలుపుతుంది.
- source_word: ἔχετε
  choice: కలిగివున్నారు
  rationale: వర్తమాన సూచనార్థక క్రియను కాపాడి, నిత్యజీవం ఇప్పుడు వారికున్నదనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: τοῖς πιστεύουσιν
  choice: విశ్వాసముంచే మీకు
  rationale: ఈ దత్తి కృదంత పదబంధాన్ని ὑμῖν‌కు సమానాధికారంగా తీసుకొని, పాఠకులను గుర్తించే సహజ తెలుగు నిర్మాణాన్ని ఇస్తుంది.
- source_word: πιστεύουσιν εἰς
  choice: నామంలో విశ్వాసముంచే
  rationale: εἰς‌తో కూడిన πιστεύωలోని వ్యక్తిపై ఆధారపడే విశ్వాస భావాన్ని, తెలుగు బైబిలు శైలికి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ ὄνομα
  choice: నామం
  rationale: వ్యక్తిని, ఆయన వెల్లడైన స్వరూపాన్ని మరియు అధికారాన్ని సూచించే బైబిలు నుడికారాన్ని పరాభాష చేయకుండా నిలుపుతుంది.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: గ్రీకు సంబంధ విభక్తి నిర్మాణాన్ని, క్రీస్తు సంబంధ బిరుదు యొక్క భావబరువును నేరుగా కాపాడుతుంది.
theological_decisions:
- issue: τοῖς πιστεύουσιν పదబంధం యొక్క స్థానం మరియు వాక్యసంబంధం
  choice: 'ὑμῖν‌తో సమానాధికారంగా: ‘దేవుని కుమారుని నామంలో విశ్వాసముంచే మీకు’'
  alternative: 'హామీ వాక్యం తర్వాత పునరుద్ఘాటనగా: ‘మీరు నిత్యజీవం కలిగివున్నారని తెలుసుకోవాలని—దేవుని కుమారుని నామంలో విశ్వాసముంచేవారికి—ఈ సంగతులు రాశాను’'
  rationale: గ్రీకు పదక్రమం రెండు అన్వయాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠంలో పాఠకులను గుర్తించే అన్వయం సహజంగా ఉన్నప్పటికీ, నిజమైన పదక్రమ సందిగ్ధతను పాదటిప్పణిలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బైబిలు శైలి. ‘నామం,’ ‘నిత్యజీవం’ వంటి యోహానీయ పదజాలాన్ని నిలిపి, గ్రీకు పదక్రమంలోని నిజమైన అనిశ్చితిని [a] పాదటిప్పణిలో సూచించాం.
