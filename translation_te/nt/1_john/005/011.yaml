  source_fidelity: 'The Telugu accurately represents the Greek structure and sense: μαρτυρία is rendered as “సాక్ష్యం”; ὅτι appropriately introduces the testimony’s content by a colon; ἔδωκεν is faithfully rendered with the completed-action form “ఇచ్చాడు”; and ἐν τῷ υἱῷ αὐτοῦ is preserved as “ఆయన కుమారునిలో,” without reducing it to an instrumental expression. The repeated demonstratives are retained in “ఇదే” and “ఈ జీవం.”'
  naturalness: '“సాక్ష్యం ఇదే: దేవుడు మనకు నిత్యజీవాన్ని ఇచ్చాడు; ఈ జీవం ఆయన కుమారునిలో ఉంది” is clear, idiomatic modern standard Telugu and maintains a suitably dignified biblical register. The semicolon naturally links the two closely related assertions.'
  terminology: “నిత్యజీవం,” “సాక్ష్యం,” and “కుమారుడు” are established, understandable Telugu biblical terms. Capitalization is not required in Telugu to convey the referential title “his Son”; the possessive relation to God makes the reference clear.
