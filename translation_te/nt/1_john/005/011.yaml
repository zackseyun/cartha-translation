id: 1JN.5.11
reference: 1 John 5:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ μαρτυρία, ὅτι ζωὴν αἰώνιον ἔδωκεν ⸂ὁ θεὸς ἡμῖν⸃, καὶ αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/011.yaml
  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: te
  text: 'సాక్ష్యం ఇదే: దేవుడు మనకు నిత్యజీవాన్ని ఇచ్చాడు; ఈ జీవం ఆయన కుమారునిలో ఉంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆయన కుమారునిలో’ అనేది గ్రీకు వాక్య నిర్మాణాన్ని నిలుపుతుంది; దీన్ని ‘ఆయన కుమారుని ద్వారా’ అని కూడా భావవ్యాఖ్యానంగా చెప్పవచ్చు, కాని అది మూలంలోని సంక్షిప్తమైన, గాఢమైన భావాన్ని పరిమితం చేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: సాక్ష్యం
  rationale: యోహాను రచనల్లోని న్యాయపరమైన, ఆధారాన్ని తెలిపే భావానికి సహజమైన తెలుగు పదం; ఇక్కడ సాక్ష్యమిచ్చే వ్యక్తిని కాక సాక్ష్యంలోని విషయాన్ని సూచిస్తుంది.
- source_word: ὅτι
  choice: వివరణాత్మక ద్విబిందువు (:),
  rationale: ὅτι సాక్ష్యంలోని విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘అదేమిటంటే’ అని విస్తరించకుండా ద్విబిందువు సహజంగా అదే సంబంధాన్ని తెలియజేస్తుంది.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవం
  rationale: యోహాను వాడుకలో స్థిరమైన, సహజమైన తెలుగు పదబంధం; అంతులేని కాలవ్యాప్తితోపాటు దేవుని నుండి వచ్చే జీవం యొక్క గుణాన్ని కూడా నిలుపుతుంది.
- source_word: ἔδωκεν
  choice: ఇచ్చాడు
  rationale: గ్రీకు ఏఓరిస్ట్‌లోని పూర్తయిన దానక్రియను సూటిగా ప్రతిబింబిస్తుంది; సందర్భం దాని ప్రస్తుత ఫలితాన్ని తెలియజేస్తుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: విస్తరణ లేకుండా కర్తకు ప్రత్యక్ష అనువాదం.
- source_word: ἡμῖν
  choice: మనకు
  rationale: తెలుగులో రచయిత తనతోపాటు పాఠకులను చేర్చే సహజమైన దత్తివాచక రూపం.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: ఆయన కుమారునిలో
  rationale: ἐν అనే విభక్త్యర్థాన్నీ, జీవం కుమారునిలో ఉందనే యోహాను ప్రత్యేక భావవ్యక్తీకరణనూ నిలుపుతుంది; ‘ద్వారా’ అని వివరణాత్మకంగా మార్చదు.
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: ఇదే ... ఈ జీవం
  rationale: గ్రీకులో పునరుక్తమైన సూచనార్థక పదాల నొక్కిచెప్పడాన్ని, రెండు వాక్యభాగాల అనుసంధానాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἔδωκεν అనే ఏఓరిస్ట్ క్రియ యొక్క కాలబలం
  choice: ‘ఇచ్చాడు’ అని పూర్తయిన దానక్రియగా అనువదించబడింది
  alternative: ‘ఇచ్చి ఉన్నాడు’ లేదా ‘అనుగ్రహించాడు’
  rationale: సూటిగా గ్రీకు ఏఓరిస్ట్‌ను నిలుపుతూ, నిత్యజీవం ప్రస్తుతం కుమారునిలో ఉందనే తరువాతి వాక్యం ద్వారా కొనసాగుతున్న ఫలితాన్ని సందర్భమే వ్యక్తం చేయనిస్తుంది.
- issue: జీవం ‘ఆయన కుమారునిలో’ ఉండడం
  choice: గ్రీకు భావవ్యక్తీకరణను ‘ఆయన కుమారునిలో’ అని యథాతథంగా నిలిపింది
  alternative: ‘ఆయన కుమారుని ద్వారా’ లేదా ‘ఆయన కుమారుని వద్ద’
  rationale: ఈ వాక్యం జీవాన్ని కుమారునితో గాఢంగా అనుసంధానిస్తుంది; ‘ద్వారా’ అని మార్చడం సాధనార్థానికి పరిమితం చేస్తుంది, ‘వద్ద’ అనడం ἐν యొక్క భావాన్ని బలహీనపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘నిత్యజీవం,’ ‘సాక్ష్యం,’ ‘కుమారుడు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని సహజమైన వాక్య నిర్మాణంతో కలిపాం.
