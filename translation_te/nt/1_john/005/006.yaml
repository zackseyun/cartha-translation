revisions:
- from: నీటి ద్వారా, రక్తం ద్వారా వచ్చినవాడు ఈయనే—యేసు మెస్సీయ[a]. ఆయన నీటి ద్వారా మాత్రమే కాదు, నీటి ద్వారా, రక్తం ద్వారా వచ్చాడు.[b] సాక్ష్యమిస్తున్నది ఆత్మే; ఎందుకంటే[c] ఆత్మే సత్యం.
  to: నీరు, రక్తం ద్వారా వచ్చినవాడు ఈయనే—యేసు మెస్సీయ[a]. ఆయన నీటి ద్వారా మాత్రమే కాక, నీరు మరియు రక్తం ద్వారా వచ్చాడు.[b] సాక్ష్యమిచ్చేది ఆత్మే; ఎందుకంటే[c] ఆత్మే సత్యం.
  rationale: The revision supplies the required Telugu adversative construction (‘మాత్రమే కాక’) for the Greek οὐκ ... μόνον ἀλλ’ contrast, improves idiomatic coordination in the opening phrase, and uses the more natural verbal noun phrase ‘సాక్ష్యమిచ్చేది.’ It retains the source text’s ambiguity concerning water and blood and preserves all footnote anchors and content.
