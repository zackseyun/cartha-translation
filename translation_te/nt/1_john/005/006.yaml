id: 1JN.5.6
reference: 1 John 5:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: te
  text: నీరు, రక్తం ద్వారా వచ్చినవాడు ఈయనే—యేసు మెస్సీయ[a]. ఆయన నీటి ద్వారా మాత్రమే కాక, నీరు మరియు రక్తం ద్వారా వచ్చాడు.[b] సాక్ష్యమిచ్చేది ఆత్మే; ఎందుకంటే[c] ఆత్మే సత్యం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘యేసు క్రీస్తు’; ఇక్కడ Χριστός బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘నీరు మరియు రక్తం’ అనే మాటకు వివిధ వివరణలు ఉన్నాయి—యేసు బాప్తిస్మం మరియు మరణం, ఆయన జననం మరియు మరణం, లేదా ఆచార సంబంధమైన ప్రతీకలు. మూలపాఠ్యం వాటిని వివరించనందున అనువాదం కూడా ఏ ఒక్క వివరణనూ ఎంచుకోలేదు.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘ఆత్మే సత్యమని.’ గ్రీకు ὅτι కారణాన్ని (‘ఎందుకంటే’) లేదా సాక్ష్యంలోని విషయాన్ని (‘అని’) పరిచయం చేయగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ ἐλθὼν
  choice: వచ్చినవాడు ఈయనే
  rationale: గ్రీకు వాక్యంలోని గుర్తింపునిచ్చే, ఉద్ఘాటనతో కూడిన నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: నీటి ద్వారా, రక్తం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సూచించే సాధనం లేదా మాధ్యమ భావాన్ని తెలుపుతూ, ‘నీరు మరియు రక్తం’ దేనిని సూచిస్తాయో ప్రధాన పాఠ్యంలో నిర్ణయించకుండా ఉంచుతుంది.
- source_word: Ἰησοῦς Χριστός
  choice: యేసు మెస్సీయ
  rationale: ఇక్కడ Χριστός యేసును ఆయన మెస్సీయ పదవితో గుర్తించే బిరుదుగా పనిచేస్తుంది; తెలుగులో ప్రత్యేక నిర్దేశక పదం లేకుండానే బిరుదు సహజంగా వ్యక్తమవుతుంది.
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: నీటి ద్వారా మాత్రమే కాదు, నీటి ద్వారా, రక్తం ద్వారా
  rationale: నీరు మాత్రమే కాదని, నీరు మరియు రక్తం రెండింటినీ ఉద్ఘాటించే గ్రీకు వ్యతిరేక నిర్మాణాన్ని, ముందు పదబంధంతో అనుసంధానంగా, తెలుగులో పునరుక్తితో నిలుపుతుంది.
- source_word: τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν
  choice: సాక్ష్యమిస్తున్నది ఆత్మే
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న సాక్ష్య భావాన్ని, అలాగే ఆత్మే సాక్ష్యమిచ్చేది అనే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: సందర్భంలో ఆత్మ సాక్ష్యమివ్వడానికి కారణాన్ని పరిచయం చేసే causal భావం ప్రవాహానికి బాగా సరిపోతుంది; ‘అని’ అనే content భావాన్ని పాదసూచికలో నిలుపాం.
- source_word: ἡ ἀλήθεια
  choice: సత్యం
  rationale: గ్రీకు నిర్దిష్ట predicate భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ‘సత్యవంతుడు’ వంటి వివరణాత్మక మార్పును చేయదు.
theological_decisions:
- issue: ‘నీరు మరియు రక్తం’ యొక్క సూచన
  choice: ప్రధాన పాఠ్యంలో వివరణ ఇవ్వకుండా ‘నీరు’ మరియు ‘రక్తం’ అనే మూల రూపకాలనే ఉంచడం
  alternative: యేసు బాప్తిస్మం మరియు మరణం; జననం మరియు మరణం; లేదా బాప్తిస్మం మరియు ప్రభుభోజనానికి సంబంధించిన ప్రతీకలు
  rationale: గ్రీకు పాఠ్యం వాటిని వివరించదు; ఒక వివాదాస్పద వ్యాఖ్యానాన్ని అనువాదంలో స్థిరపరచకుండా దాని ఉద్దేశపూర్వక ఉద్విగ్నతను కాపాడాలి.
- issue: τὸ πνεῦμα యొక్క సూచిత వ్యక్తి
  choice: పరిశుద్ధాత్మను సూచించే ‘ఆత్మ’
  alternative: సాధారణ ఆత్మ లేదా మానవ ఆత్మ
  rationale: యోహాను రచనలలోని దైవిక సాక్ష్య సందర్భం పరిశుద్ధాత్మనే సూచిస్తుంది; అయితే మూలంలో లేని ‘పరిశుద్ధ’ అనే విశేషణాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: Χριστός యొక్క బిరుదు భావం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ పదం కేవలం పేరులో భాగంలా కాక, యేసును మెస్సీయగా గుర్తించే బిరుదుగా పనిచేస్తుంది.
- issue: ὅτι యొక్క సంబంధం
  choice: కారణార్థకంగా ‘ఎందుకంటే’
  alternative: విషయార్థకంగా ‘అని’
  rationale: కారణార్థం సందర్భ ప్రవాహానికి మెరుగ్గా సరిపోతుంది, కాని గ్రీకు సంధి రెండవ అర్థానికి కూడా వీలు ఇస్తుంది; అందుకే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘వచ్చినవాడు ఈయనే’ మరియు ‘ఆత్మే’ అనే రూపాలు మూలంలోని ఉద్ఘాటనను నిలుపుతాయి. వివాదాస్పద రూపకాలకు ప్రధాన పాఠ్యంలో వ్యాఖ్యానాత్మక పదాలు చేర్చలేదు.
