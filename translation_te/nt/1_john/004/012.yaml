id: 1JN.4.12
reference: 1 John 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: te
  text: దేవుణ్ణి ఎవరూ ఎన్నడూ చూడలేదు. మనం ఒకరినొకరం ప్రేమిస్తే, దేవుడు మనలో నిలిచి ఉంటాడు; ఆయన ప్రేమ[a] మనలో పరిపూర్ణమై ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవునిపట్ల మన ప్రేమ.” గ్రీకులోని “ఆయన ప్రేమ” అనే మాట దేవుడు మనపట్ల చూపే ప్రేమను గానీ, మనం దేవునిపట్ల చూపే ప్రేమను గానీ సూచించవచ్చు; సందర్భం దేవుని ప్రేమ అనే భావానికే ఎక్కువగా అనుకూలిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “మనలో సంపూర్ణమైంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τεθέαται
  choice: చూడలేదు
  rationale: θεάομαι ఇక్కడ ప్రత్యక్షంగా చూడడం అనే భావాన్ని ఇస్తుంది. πώποτεతో కలిసి ఉన్న పరిపూర్ణ కాల రూపాన్ని తెలుగులో ‘ఎన్నడూ చూడలేదు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πώποτε
  choice: ఎన్నడూ
  rationale: నిరాకరణతో కలిసి ‘ఏ కాలంలోనూ’ అనే సార్వత్రిక భావాన్ని బలపరుస్తుంది.
- source_word: ἐὰν ἀγαπῶμεν
  choice: మనం ... ప్రేమిస్తే
  rationale: ἐάνతో వర్తమాన subjunctive షరతును సూచిస్తుంది; ‘ప్రేమిస్తే’ ఆ షరతును సహజంగా, అదనపు వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- source_word: ἀλλήλους
  choice: ఒకరినొకరం
  rationale: పరస్పర చర్యను తెలిపే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: μένει
  choice: నిలిచి ఉంటాడు
  rationale: యోహాను రచనల్లో ముఖ్యమైన μένω పదంలోని కొనసాగుతూ ఉండే సంబంధ భావాన్ని ‘నిలిచి ఉంటాడు’ నిలుపుతుంది; కేవలం ‘ఉంటాడు’ కంటే మూలపదానికి దగ్గరగా ఉంటుంది.
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: ఆయన ప్రేమ
  rationale: αὐτοῦను ప్రధాన పాఠ్యంలో దేవునికి చెందిన లేదా దేవుని నుండి వచ్చే ప్రేమగా తీసుకున్నాం. ఈ సంక్షిప్త రూపం గ్రీకు జనిటివ్‌లోని కొంత భావవిస్తృతిని కూడా నిలుపుతుంది.
- source_word: ἐν ἡμῖν
  choice: మనలో
  rationale: ఈ వాక్యంలో రెండుసార్లు వచ్చే ἐν ἡμῖνను ఏకరీతిగా ‘మనలో’ అని అనువదించడం దేవుని అంతర్నివాస భావానికి అనుగుణంగా ఉంది.
- source_word: τετελειωμένη ἐστιν
  choice: పరిపూర్ణమై ఉంటుంది
  rationale: ఈ periphrastic perfect రూపం పూర్తిచేయబడిన కార్యం వల్ల కొనసాగుతున్న స్థితిని సూచిస్తుంది. ‘పరిపూర్ణమై ఉంటుంది’ ఆ ఫలితస్థితిని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἡ ἀγάπη αὐτοῦ (‘ఆయన ప్రేమ’)లో జనిటివ్ భావం
  choice: దేవుని ప్రేమ మనలో పరిపూర్ణమవుతుంది
  alternative: దేవునిపట్ల మన ప్రేమ మనలో పరిపూర్ణమవుతుంది
  rationale: సమీప సందర్భం (4:10–11) దేవుడే ముందుగా చూపిన ప్రేమను ప్రధానంగా ఉంచుతుంది కాబట్టి subjective/possessive భావాన్ని ప్రధాన పాఠ్యంలో ఎంచుకున్నాం. అయినా objective genitive భావం వ్యాకరణపరంగా సాధ్యమైనందున అడుగుసూచనలో దాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలిని ఉపయోగించాం. ‘నిలిచి ఉంటాడు’ ద్వారా యోహాను రచనల్లోని μένω పదసంబంధాన్ని, ‘పరిపూర్ణమై ఉంటుంది’ ద్వారా perfect ఫలితస్థితిని నిలిపాం. అడుగుసూచికలను అవి వివరిస్తున్న పదబంధాల దగ్గర ఉంచాం.
