- from: ప్రియులారా,[a] మనం ఒకరినొకరం ప్రేమిద్దాం. ఎందుకంటే ప్రేమ దేవుని నుండి కలుగుతుంది. ప్రేమించే ప్రతి వ్యక్తి దేవుని వల్ల పుట్టినవాడు, దేవుణ్ణి ఎరిగినవాడు.
  to: ప్రియులారా,[a] మనం ఒకరినొకరం ప్రేమిద్దాం. ఎందుకంటే ప్రేమ దేవుని నుండి కలుగుతుంది. ప్రేమించే ప్రతి ఒక్కరూ దేవుని నుండి జన్మించినవారే, దేవుణ్ణి ఎరుగుతారు.
