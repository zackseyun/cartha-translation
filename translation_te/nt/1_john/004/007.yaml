source:
  edition: SBLGNT
  text: Ἀγαπητοί, ἀγαπῶμεν ἀλλήλους, ὅτι ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν, καὶ πᾶς ὁ ἀγαπῶν ἐκ τοῦ θεοῦ γεγέννηται καὶ γινώσκει τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: te
  text: ప్రియులారా,[a] మనం ఒకరినొకరం ప్రేమిద్దాం. ఎందుకంటే ప్రేమ దేవుని నుండి కలుగుతుంది. ప్రేమించే ప్రతి ఒక్కరూ దేవుని నుండి జన్మించినవారే, దేవుణ్ణి ఎరుగుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రియమైనవారలారా.” గ్రీకు సంబోధనకు అక్షరార్థం ఇదే; ఈ వాక్యమంతటా పునరావృతమయ్యే “ప్రేమ” పదకుటుంబాన్ని ఇది ప్రతిధ్వనింపజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: ప్రియులారా
  rationale: ఆప్యాయతతో కూడిన బహువచన సంబోధన. సహజమైన ఆధునిక తెలుగులో గౌరవభరితంగా ఉండి, ఈ వాక్యంలో పునరావృతమయ్యే ప్రేమ భావంతో సంబంధాన్ని నిలుపుతుంది.
- source_word: ἀγαπῶμεν
  choice: మనం ... ప్రేమిద్దాం
  rationale: ప్రథమ పురుష బహువచన ప్రేరణార్థక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; గ్రీకులో స్పష్టంగా చెప్పని నిరంతరతను అదనంగా చేర్చదు.
- source_word: ἀλλήλους
  choice: ఒకరినొకరం
  rationale: పరస్పర సర్వనామానికి సహజమైన తెలుగు సమానం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రబోధానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: ἡ ἀγάπη
  choice: ప్రేమ
  rationale: సాధారణ వర్గార్థక ప్రయోగాన్ని సహజంగా అందిస్తూ, ἀγαπ- పదకుటుంబ పునరుక్తిని నిలుపుతుంది.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: దేవుని నుండి కలుగుతుంది
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; అక్షరార్థంలోని స్థిర వాక్యనిర్మాణాన్ని భావం మారకుండా ప్రవాహవంతం చేస్తుంది.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: ప్రేమించే ప్రతి వ్యక్తి
  rationale: సార్వత్రిక వర్గాన్ని సూచించే substantival participle భావాన్ని లింగపరంగా అనవసరంగా పరిమితం చేయకుండా అందిస్తుంది.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: దేవుని వల్ల పుట్టినవాడు
  rationale: పూర్తయిన చర్యతో కొనసాగుతున్న ఫలితాన్ని సూచించే perfect passive భావాన్ని తెలుగులో సంక్షిప్తంగా అందిస్తుంది; ἐκ యొక్క దైవిక మూల భావాన్ని నిలుపుతుంది.
- source_word: γινώσκει τὸν θεόν
  choice: దేవుణ్ణి ఎరిగినవాడు
  rationale: దేవునితో సంబంధమున్న జ్ఞానాన్ని సూచించే వర్తమాన భావాన్ని సహజమైన, గౌరవభరితమైన తెలుగులో అందిస్తుంది; ‘తెలుసుకున్నాడు’ అనే ఆరంభాత్మక భావాన్ని చేర్చదు.
theological_decisions:
- issue: ప్రేమ, దేవుని వల్ల పుట్టడం, దేవుణ్ణి ఎరుగడం మధ్య సంబంధం
  choice: ప్రేమించే వ్యక్తి దేవుని వల్ల పుట్టినవాడనీ దేవుణ్ణి ఎరిగినవాడనీ వాక్యం చెప్పే సంబంధాన్ని నేరుగా నిలుపడం.
  alternative: దీనిని సాంకేతిక రక్షణక్రమానికి ఖచ్చితమైన నిరూపణగా విస్తరించడం లేదా కేవలం నైతిక ప్రకటనగా బలహీనపరచడం.
  rationale: గ్రీకు పాఠం ఈ మూడు విషయాలను అనుసంధానిస్తుంది; అనువాదం తరువాతి మతశాస్త్ర వ్యవస్థను చేర్చకుండా, ఆ అనుసంధానాన్ని యథాతథంగా ఉంచుతుంది.
- issue: ἀγάπη / ἀγαπάω పదకుటుంబ పునరుక్తి
  choice: సంబోధనలో ‘ప్రియులారా’ అని, మిగిలిన cognates వద్ద ‘ప్రేమ’ అని వాడి భావసంబంధాన్ని సాధ్యమైనంతగా నిలుపడం.
  alternative: సంబోధనను ‘స్నేహితులారా’ అని మార్చి ప్రేమ పదకుటుంబంతో ఉన్న సంబంధాన్ని పూర్తిగా కనుమరుగుచేయడం.
  rationale: తెలుగులో ఒకే మూలంతో అన్ని గ్రీకు రూపాలను సహజంగా పునరుత్పత్తి చేయడం సాధ్యం కాదు; ‘ప్రియులారా’ ప్రేమించబడిన వారనే ప్రతిధ్వనిని కొంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే లేఖా శైలికి తగిన గౌరవభరిత స్వరంతో రూపొందించబడింది. ‘ఎరిగినవాడు’ కొద్దిగా ఉన్నతమైనదైనా బైబిలు సందర్భంలో సహజంగా ఉండి సంబంధాత్మక జ్ఞానాన్ని సూచిస్తుంది.
