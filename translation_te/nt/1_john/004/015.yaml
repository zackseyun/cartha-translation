  yaml_path: translation/nt/1_john/004/015.yaml
  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: te
  text: యేసు దేవుని కుమారుడని ఎవరు ఒప్పుకుంటారో, దేవుడు వారిలో నిలిచి ఉంటాడు; వారు దేవునిలో నిలిచి ఉంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘నిలిచి ఉంటాడు/ఉంటారు’ అనే మాటలకు ‘నివసిస్తాడు/నివసిస్తారు’ అని కూడా అనువదించవచ్చు. గ్రీకు μένω (మెనో) అనే క్రియ యోహాను రచనల్లో ముఖ్యమైన పదం; అది ‘నిలిచి ఉండు,’ ‘నివసించు’ అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: ఎవరు ... ఒప్పుకుంటారో
  rationale: అనిర్దిష్ట సంబంధవాచక నిర్మాణంలోని ‘ఎవరైనా/ఎవరు ... వారో’ అనే సాధారణీకరణ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁμολογήσῃ
  choice: ఒప్పుకుంటారో
  rationale: యేసును గూర్చిన సత్యాన్ని బహిరంగంగా అంగీకరించడం లేదా ప్రకటించడం అనే యోహాను రచనల్లోని భావాన్ని ‘ఒప్పుకోవడం’ సహజంగా, తగిన ఆధ్యాత్మిక గంభీరతతో తెలియజేస్తుంది.
- source_word: Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ
  choice: యేసు దేవుని కుమారుడని
  rationale: ὅτι ద్వారా పరిచయమయ్యే ఒప్పుకోలు విషయాన్ని నేరుగా తెలిపి, ‘దేవుని కుమారుడు’ అనే క్రీస్తు సంబంధ బిరుదును సంపూర్ణంగా నిలుపుతుంది.
- source_word: ὁ θεὸς ἐν αὐτῷ μένει
  choice: దేవుడు వారిలో నిలిచి ఉంటాడు
  rationale: μένω లోని కొనసాగుతూ ఉండడం, సంబంధంలో స్థిరంగా ఉండడం అనే భావాలను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది. లింగనిరపేక్ష ఏకవచనానికి సహజ తెలుగు గౌరవ బహువచనాన్ని వాడింది.
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: వారు దేవునిలో నిలిచి ఉంటారు
  rationale: గ్రీకులో రెండో భాగంలో క్రియ అధ్యాహారంగా ఉన్నప్పటికీ, తెలుగులో స్పష్టతకోసం ముందున్న μένει భావాన్ని పునరుక్తం చేసింది; పరస్పర అంతర్నివాస సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: పరస్పర అంతర్నివాస భాష
  choice: ‘దేవుడు వారిలో నిలిచి ఉంటాడు; వారు దేవునిలో నిలిచి ఉంటారు’ అని పరస్పర నిర్మాణాన్ని నిలుపడం
  alternative: ‘దేవుడు వారిలో నివసిస్తాడు; వారు దేవునిలో నివసిస్తారు’
  rationale: ఒప్పుకోలుతో ముడిపడిన దైవ-మానవ పరస్పర అంతర్నివాసాన్ని సిద్ధాంతపరంగా విస్తరించకుండా లేదా కేవలం సహవాసంగా కుదించకుండా యథాతథంగా ఉంచుతుంది.
- issue: క్రీస్తు సంబంధ బిరుదు
  choice: ‘దేవుని కుమారుడు’
  alternative: ‘దేవుని పుత్రుడు’
  rationale: ὁ υἱὸς τοῦ θεοῦ అనే స్పష్టమైన బిరుదును ఆధునిక సాధారణ తెలుగులో సహజంగా, పూర్తి భావంతో అందిస్తుంది; అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. అనిర్దిష్ట మానవ వ్యక్తిని సూచించేందుకు సహజమైన లింగనిరపేక్ష గౌరవ బహువచనం (‘వారు/వారిలో’) వాడబడింది. గ్రీకు వాక్యంలోని పరస్పర నిర్మాణం స్పష్టంగా నిలుపబడింది.
