source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: te
  text: '**1 యోహాను 4:17**


    దీనివల్ల[a] మనతో సంబంధంలో ప్రేమ పరిపూర్ణమైంది, తద్వారా తీర్పు దినాన మనకు ధైర్యం[b] కలుగుతుంది; ఎందుకంటే ఆయన[c] ఎలా ఉన్నాడో, ఈ లోకంలో మనమూ అలాగే ఉన్నాం.


    [a] లేదా, “ఇందులో మనతో సంబంధంలో ప్రేమ పరిపూర్ణమైంది.” గ్రీకు పదబంధం ప్రేమ పరిపూర్ణమయ్యే సందర్భాన్ని, సాధనాన్ని లేదా విధానాన్ని సూచించవచ్చు; “మనతో సంబంధంలో” అనే మాటలను “మన మధ్య” అని కూడా అనువదించవచ్చు.


    [b] “ధైర్యం” అనే మాటను “నమ్మకమైన ధైర్యం” అని కూడా అనువదించవచ్చు.


    [c] “ఆయన” అనేది బహుశా యేసును సూచిస్తుంది; కొందరు అది సాధారణంగా దేవుణ్ణి సూచిస్తుందని అర్థం చేసుకుంటారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇందులో మనతో సంబంధంలో ప్రేమ పరిపూర్ణమైంది.” గ్రీకు పదబంధం ప్రేమ పరిపూర్ణమయ్యే సందర్భాన్ని, సాధనాన్ని లేదా విధానాన్ని సూచించవచ్చు; “మనతో సంబంధంలో” అనే మాటలను “మన మధ్య” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ధైర్యం” అనే మాటను “నమ్మకమైన ధైర్యం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “ఆయన” అనేది బహుశా యేసును సూచిస్తుంది; కొందరు అది సాధారణంగా దేవుణ్ణి సూచిస్తుందని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: దీనివల్ల
  rationale: ఈ పదబంధం ‘ఇందులో’ లేదా ‘ఈ విధంగా’ అనే భావాన్నీ ఇవ్వగలదు. సందర్భంలో ప్రేమ పరిపూర్ణతకు వచ్చే ఆధారాన్ని లేదా విధానాన్ని సూచించేలా ‘దీనివల్ల’ సహజంగా ఉంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: τετελείωται
  choice: పరిపూర్ణతకు వచ్చింది
  rationale: పూర్తికి తీసుకురాబడి, ఆ ఫలితం కొనసాగుతున్నదనే గ్రీకు perfect passive భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ప్రేమలో ముందుగా నైతిక లోపం ఉందని సూచించదు.
- source_word: ἡ ἀγάπη
  choice: ప్రేమ
  rationale: అర్థాన్ని ఒకే దిశకు—దేవుని ప్రేమ లేదా మన ప్రేమ—పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: μεθ’ ἡμῶν
  choice: మన విషయంలో
  rationale: μετά + genitive సాధారణంగా ‘తో’ అని అర్థమైనా, ఇక్కడ విశ్వాసులతో సంబంధంలో ప్రేమ పరిపూర్ణతకు రావడాన్ని సూచిస్తుంది. అక్షరార్థమైన ‘మనతో’ తెలుగులో అసహజం; ‘మన విషయంలో’ సంబంధ భావాన్ని నిలుపుతూ ‘మనలో’ అని అతిగా నిర్ణయించదు. ‘మన మధ్య’ను పాదసూచికలో ఇచ్చాం.
- source_word: παρρησίαν
  choice: ధైర్యం
  rationale: తీర్పు సందర్భంలో దేవుని ఎదుట భయంలేకుండా, నిబ్బరంగా ఉండే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: తీర్పు దినాన
  rationale: అంత్యకాల తీర్పును సూచించే సహజమైన, సంక్షిప్త తెలుగు వ్యక్తీకరణ.
- source_word: καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν
  choice: ఆయన ఎలా ఉన్నాడో, మనమూ అలాగే ఉన్నాం
  rationale: καθώς … καί అనే పోలికను స్పష్టంగా ఉంచి, రెండు క్రియల వర్తమాన కాలాన్ని కాపాడుతుంది.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: ఈ లోకంలో
  rationale: ప్రస్తుత మానవ జీవన రంగాన్ని సూచించే κόσμοςకు ప్రామాణికమైన, సందర్భోచితమైన తెలుగు రూపం.
theological_decisions:
- issue: ἐκεῖνος (‘ఆయన’) ఎవరిని సూచిస్తుంది?
  choice: ప్రధానంగా క్రీస్తు/కుమారుణ్ణి సూచించే సర్వనామంగా ఉంచడం
  alternative: సాధారణంగా దేవుణ్ణి సూచిస్తుంది
  rationale: 1 యోహానులో ἐκεῖνος తరచుగా యేసును సూచిస్తుంది (2:6; 3:3, 5, 7, 16). అయినా మూలపాఠంలాగే పేరును చేర్చకుండా సర్వనామాన్ని ఉంచి, ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో తెలిపాం.
- issue: పరిపూర్ణతకు వచ్చిన ప్రేమ స్వరూపం
  choice: విశ్వాసులతో సంబంధంలో ప్రేమ తన ఉద్దేశిత సంపూర్ణతకు వచ్చి, తీర్పు దినాన ధైర్యానికి దారితీస్తుంది
  alternative: మన దేవప్రేమ నైతికంగా సంపూర్ణమవుతుంది; లేదా దేవుని మనపట్ల ప్రేమ మాత్రమే సంపూర్ణమవుతుంది
  rationale: గ్రీకు వాక్యం ప్రేమను కేవలం దేవుని ప్రేమగా గానీ, కేవలం మన ప్రేమగా గానీ నిర్బంధించదు. అనువాదం ఆ ఉద్దేశపూర్వక అస్పష్టతను, దైవశాస్త్రీయ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గంభీరమైన శైలి. ‘మనతో ప్రేమ’ అనే కఠిన అక్షరానువాదం బదులు సంబంధ భావాన్ని తెలిపే ‘మన విషయంలో’ వాడబడింది. మూలంలోని సర్వనామ అస్పష్టతను, ప్రేమ దిశకు సంబంధించిన దైవశాస్త్రీయ ఉద్వేగాన్ని ఉద్దేశపూర్వకంగా నిలుపుకున్నాం.
