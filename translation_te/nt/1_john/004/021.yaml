  source_fidelity: 'The Telugu accurately represents the Greek clause structure and sense: the community has this command from him, and the person loving God is obligated also to love his brother. ‘మనకు ఈ ఆజ్ఞ ఉంది’ idiomatically conveys ἔχομεν, while ‘ఆయన నుండి’ appropriately retains the antecedent-preserving pronoun of ἀπ’ αὐτοῦ.'
