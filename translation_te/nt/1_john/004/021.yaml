  terminology: ‘ఆజ్ఞ’ is an appropriate rendering of ἐντολή in this Johannine context. The repeated use of ‘ప్రేమించు’ preserves the thematic lexical correspondence. ‘తన సహోదరుణ్ణి’ maintains the masculine singular wording of ἀδελφὸν αὐτοῦ, and the footnote responsibly notes its representative communal use without importing that interpretation into the main text.
