id: 1JN.4.21
reference: 1 John 4:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν ἐντολὴν ἔχομεν ἀπ’ αὐτοῦ, ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/021.yaml
  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: te
  text: 'ఆయన నుండి మనకు ఈ ఆజ్ఞ ఉంది: దేవుణ్ణి ప్రేమించేవాడు తన సహోదరుణ్ణి కూడా ప్రేమించాలి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన సహోదరుణ్ణి లేదా సహోదరిని.’ గ్రీకులో ‘తన సహోదరుణ్ణి’ అని పురుష ఏకవచన రూపం ఉంది; అది తోటి విశ్వాసిని ప్రాతినిధ్యంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολήν
  choice: ఆజ్ఞ
  rationale: యోహాను రచనల్లోని నైతిక అధికార భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπ’ αὐτοῦ
  choice: ఆయన నుండి
  rationale: గ్రీకు మూలంలోని సర్వనామాన్ని నిలుపుతుంది; తక్షణ సందర్భంలో అది దేవుణ్ణి సూచిస్తుంది.
- source_word: ἵνα
  choice: అనే విషయం (తెలుగు వాక్యనిర్మాణంలో ద్విబిందువు తరువాత ఆజ్ఞ యొక్క విషయంగా)
  rationale: ఇక్కడ ἵνα ఆజ్ఞలోని విషయాన్ని పరిచయం చేస్తుంది; తెలుగులో ద్విబిందువు తరువాతి వాక్యం దీనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ ἀγαπῶν τὸν θεὸν
  choice: దేవుణ్ణి ప్రేమించేవాడు
  rationale: లింగపరంగా పురుష ఏకవచన రూపాన్ని, దాని ప్రాతినిధ్య స్వభావాన్ని సాధ్యమైనంత సహజంగా నిలుపుతుంది.
- source_word: ἀγαπᾷ
  choice: ప్రేమించాలి
  rationale: ἵνα తరువాతి సంభావనార్థక క్రియ ఇక్కడ ఆజ్ఞ విధించే బాధ్యతను సూచిస్తుంది; ‘ప్రేమించాలి’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: ἀδελφὸν αὐτοῦ
  choice: తన సహోదరుణ్ణి
  rationale: మూలంలోని పురుష ఏకవచన రూపాన్ని నిలుపుతూ, సందర్భంలోని తోటి విశ్వాసి భావాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: దేవునిపట్ల ప్రేమకు సహోదరునిపట్ల ప్రేమను జోడించే బలాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: ప్రేమించు
  rationale: యోహాను రచనలోని పదసంబంధ ఏకరూపతను కాపాడుతుంది.
theological_decisions:
- issue: ἀδελφὸν αὐτοῦ లోని లింగసూచక ఏకవచన ప్రయోగం
  choice: ప్రధాన పాఠ్యంలో ‘తన సహోదరుణ్ణి’ అని ఉంచి, సమావేషక సామూహిక భావాన్ని పాదసూచికలో తెలియజేయడం.
  alternative: ‘తన సహోదరుణ్ణి లేదా సహోదరిని’ / ‘తోటి విశ్వాసిని’
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పురుష ఏకవచనమైనప్పటికీ, సందర్భంలో తోటి విశ్వాసులను ప్రాతినిధ్యంగా సూచించగలదు. మూలరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని విస్తృత భావాన్ని పాదసూచికలో సంరక్షించడం నిజమైన అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘ఆయన’ అనే సర్వనామం మూలంలోని αὐτοῦ ను నిలుపుతుంది; ముందరి సందర్భం దానిని దేవునికి అన్వయిస్తుంది.
