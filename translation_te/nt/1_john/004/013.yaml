id: 1JN.4.13
reference: 1 John 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ μένομεν καὶ αὐτὸς ἐν ἡμῖν, ὅτι ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
translation:
  language: te
  text: 'దీనివల్ల మనం ఆయనలో నిలిచి ఉన్నామని, ఆయన మనలో నిలిచి ఉన్నాడని తెలుసుకుంటున్నాం: ఎందుకంటే ఆయన తన ఆత్మనుండి మనకు ఇచ్చాడు[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇందులో మనం తెలుసుకుంటున్నాం.’ గ్రీకు పదబంధాన్ని మరింత అక్షరార్థంగా ఇలా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తన ఆత్మనుండి.’ ఈ వ్యక్తీకరణ ఆయన ఆత్మ నుండి లేదా ఆయన ఆత్మలోని భాగాన్ని మనకు ఇచ్చాడనే మూల/భాగార్థక భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τούτῳ
  choice: దీనివల్ల
  rationale: యోహాను రచనల్లో ఇది దేనిని బట్టి ఒక విషయం తెలుసుకుంటామో తెలిపే సూత్రప్రాయ పదబంధం. ‘దీనివల్ల’ అనేది సాధనం లేదా ఆధారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γινώσκομεν
  choice: తెలుసుకుంటున్నాం
  rationale: వర్తమాన కాల క్రియ కొనసాగుతున్న జ్ఞానం లేదా నిశ్చయాన్ని సూచిస్తుంది; ఈ రూపం తెలుగు వాక్యంలో సహజంగా ఉంటుంది.
- source_word: ἐν αὐτῷ μένομεν
  choice: ఆయనలో నిలిచి ఉన్నామని
  rationale: μένω అనే యోహాను రచనల్లోని కీలక పదానికి కొనసాగుతూ ఉండడం, సంబంధంలో స్థిరంగా ఉండడం అనే భావాలున్నాయి. ‘నిలిచి ఉండడం’ ఆ దీర్ఘకాలిక సంబంధ భావాన్ని కాపాడుతుంది.
- source_word: καὶ αὐτὸς ἐν ἡμῖν
  choice: ఆయన మనలో నిలిచి ఉన్నాడని
  rationale: గ్రీకులో రెండో భాగంలో క్రియ అధ్యాహారంగా ఉంది; తెలుగులో స్పష్టత, సహజత్వం కోసం ముందు భాగంలోని ‘నిలిచి ఉండడం’ను పునరుక్తం చేశాం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: రెండో ὅτι పరస్పర నివాసాన్ని మనం తెలుసుకోవడానికి ఆధారాన్ని పరిచయం చేస్తుంది; ‘ఎందుకంటే’ ఆ వివరణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκ τοῦ πνεύματος αὐτοῦ
  choice: తన ఆత్మలోనుండి
  rationale: ἐκ మూలాన్ని సూచిస్తుంది. ‘ఆత్మలోనుండి’ అనే రూపం ఆ మూల/భాగార్థక సూక్ష్మతను ఉద్దేశపూర్వకంగా కాపాడుతుంది.
- source_word: δέδωκεν ἡμῖν
  choice: మనకు అనుగ్రహించాడు
  rationale: పరిపూర్ణ కాలం గతంలో పూర్తయి ఇప్పటికీ ఫలితమున్న దానాన్ని సూచిస్తుంది. ‘అనుగ్రహించాడు’ దేవుడు ఇచ్చిన వరం అనే సందర్భానికి సహజంగా సరిపోతుంది; తెలుగులో కాలరూపం సందర్భానుసారంగా నిలిచే ఫలితాన్ని అనుమతిస్తుంది.
theological_decisions:
- issue: ‘తన’ అనే సర్వనామానికి సూచ్యుడు మరియు ‘ఆత్మ’ గుర్తింపు
  choice: ‘తన ఆత్మ’ దేవుని ఆత్మను, సందర్భంలో పరిశుద్ధాత్మను సూచిస్తుంది.
  alternative: ‘ఆత్మ’ను సాధారణ ఆధ్యాత్మిక వరం లేదా స్వభావంగా చదవడం.
  rationale: సమీప సందర్భంలో దేవుడు మరియు విశ్వాసుల పరస్పర నివాసానికి దేవుడు ఇచ్చిన ఆత్మ సాక్ష్యంగా ఉంది. తెలుగు లిపిలో పెద్ద/చిన్న అక్షర భేదం లేకపోవడంతో సందర్భమే గుర్తింపును తెలియజేస్తుంది.
- issue: యోహాను వాడే పరస్పర నివాస భాష
  choice: రెండు దిశలలోనూ ‘నిలిచి ఉండడం’ అని అనువదించడం.
  alternative: ‘ఆయనలో నివసిస్తున్నాం, ఆయన మనలో నివసిస్తున్నాడు’ లేదా రెండో భాగంలో క్రియను అధ్యాహారంగా వదలడం.
  rationale: ఈ రూపం పరస్పరతను, μένω యొక్క కొనసాగింపు భావాన్ని కాపాడుతూ సాధారణ పాఠకుడికి స్పష్టంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నిలిచి ఉండడం’ను యోహాను రచనల్లోని μένω పదానికి స్థిరమైన కీలక పదంగా ఉపయోగించాం. తెలుగు లిపిలో capitalization లేకపోవడం వల్ల పరిశుద్ధాత్మ గుర్తింపు సందర్భం ద్వారా వ్యక్తమవుతుంది.
