- from: 'దీనివల్ల మనం ఆయనలో నిలిచి ఉన్నామని, ఆయన మనలో నిలిచి ఉన్నాడని తెలుసుకుంటున్నాం: ఎందుకంటే ఆయన తన ఆత్మలోనుండి మనకు అనుగ్రహించాడు[a][b].'
  to: 'దీనివల్ల మనం ఆయనలో నిలిచి ఉన్నామని, ఆయన మనలో నిలిచి ఉన్నాడని తెలుసుకుంటున్నాం: ఎందుకంటే ఆయన తన ఆత్మనుండి మనకు ఇచ్చాడు[a][b].'
