revisions:
- from: దేవుడు తన ఏకైక కుమారుణ్ణి లోకంలోకి పంపడం ద్వారా, మనం ఆయన ద్వారా జీవించేలా చేశాడు. దేవుని ప్రేమ మన మధ్య[a] ఈ విధంగా వెల్లడైంది[b].
  to: దేవుడు తన ఏకైక కుమారుణ్ణి లోకంలోకి పంపియున్నందులో, మనం ఆయన ద్వారా జీవించడానికి, దేవుని ప్రేమ మన మధ్య[a] వెల్లడైంది. [b]
  rationale: The revision changes the erroneous causative “చేశాడు” to the purpose expression “జీవించడానికి” and joins the explanatory clauses to the manifestation statement. Footnote a remains attached to “మన మధ్య,” preserving the alternative “మనలో.” Footnote b is retained as the traditional rendering note; its marker is placed as a sentence-level note because Telugu’s oblique form “కుమారుణ్ణి” makes a direct attachment less clean.
