id: 1JN.4.9
reference: 1 John 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι τὸν υἱὸν αὐτοῦ τὸν μονογενῆ ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: te
  text: దేవుడు తన ఏకైక కుమారుణ్ణి లోకంలోకి పంపియున్నందులో, మనం ఆయన ద్వారా జీవించడానికి, దేవుని ప్రేమ మన మధ్య[a] వెల్లడైంది. [b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మనలో.’ గ్రీకు పదబంధం దేవుని ప్రేమ విశ్వాసులలో వెల్లడైందని గానీ, వారి సమాజం మధ్య వెల్లడైందని గానీ అర్థమివ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: '‘ఏకైక కుమారుడు’ అని అనువదించిన గ్రీకు పదం కుమారుని సాటిలేని ప్రత్యేకతను నొక్కిచెబుతుంది. పారంపర్య అనువాదం: ‘ఏకజనిత కుమారుడు.’'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: ఈ విధంగా
  rationale: తరువాతి ὅτι వాక్యం ప్రేమ వెల్లడైన విధానాన్ని వివరిస్తుంది; ఆధునిక తెలుగులో ఈ ప్రయోగం సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: ἐφανερώθη
  choice: వెల్లడైంది
  rationale: φַనెρόω యొక్క కర్మణి భావాన్ని, దాగి ఉన్నది స్పష్టంగా కనిపించడం లేదా తెలిసిరావడం అనే అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: దేవుని ప్రేమ
  rationale: ఇక్కడ షష్ఠీ విభక్తి ప్రధానంగా దేవునికి చెందిన, ఆయననుండి వ్యక్తమైన ప్రేమను సూచిస్తుంది.
- source_word: ἐν ἡμῖν
  choice: మన మధ్య
  rationale: విశ్వాసుల సమాజంలో లేదా వారి సంబంధంలో దేవుని ప్రేమ వెల్లడైందనే సామూహిక భావాన్ని సహజంగా తెలియజేస్తుంది; ‘మనలో’ అనే అంతర్గత భావానికి కూడా గ్రీకు అవకాశం ఇస్తుంది.
- source_word: ὅτι
  choice: పంపడం ద్వారా
  rationale: ప్రేమ ఎలా వెల్లడైందో తెలిపే వివరణాత్మక వాక్యాన్ని తెలుగులో సహజమైన సాధనార్థక నిర్మాణంతో అనుసంధానిస్తుంది.
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: తన ఏకైక కుమారుణ్ణి
  rationale: μονογενής కుమారుని అద్వితీయతను, సాటిలేని ప్రత్యేక సంబంధాన్ని ప్రధానంగా సూచిస్తుంది; జనన ప్రక్రియను పదంలోనే నిర్బంధంగా చేర్చదు.
- source_word: ἀπέσταλκεν
  choice: పంపడం
  rationale: గ్రీకు పరిపూర్ణ కాలంలోని పూర్తయిన పంపబడుటను తెలుగులో సందర్భానుకూలంగా తెలిపే క్రియారూపం; దాని నిలిచే ప్రాముఖ్యత మొత్తం వాక్యంవల్ల స్పష్టమవుతుంది.
- source_word: εἰς τὸν κόσμον
  choice: లోకంలోకి
  rationale: కుమారుడు పంపబడిన గమ్యాన్ని గ్రీకు ఉపసర్గకు అనుగుణంగా తెలియజేస్తుంది.
- source_word: ἵνα ζήσωμεν
  choice: మనం ... జీవించేలా
  rationale: ἵνα తో కూడిన సంభావ్యార్థక క్రియ వ్యక్తం చేసే ఉద్దేశాన్ని సహజమైన తెలుగు ప్రయోజనార్థక నిర్మాణంతో అందిస్తుంది.
- source_word: δι’ αὐτοῦ
  choice: ఆయన ద్వారా
  rationale: διά తో షష్ఠీ విభక్తి సూచించే సాధనం లేదా మధ్యవర్తిత్వ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: కుమారునికి వర్తించిన μονογενής అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఏకైక కుమారుడు’
  alternative: ‘ఏకజనిత కుమారుడు’ లేదా పారంపర్యంగా ‘అద్వితీయ కుమారుడు’
  rationale: గ్రీకు పదం ప్రధానంగా కుమారుని ప్రత్యేకమైన, సాటిలేని సంబంధాన్ని సూచిస్తుంది. తరువాతి సిద్ధాంత సూత్రీకరణను నేరుగా పదార్థంలోకి చేర్చకుండా, చారిత్రక అనువాదాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- issue: ἐν ἡμῖν యొక్క పరిధి
  choice: ‘మన మధ్య’
  alternative: ‘మనలో’
  rationale: సందర్భంలో దేవుని ప్రేమ సమాజం మధ్య ప్రత్యక్షమైందనే భావం సహజంగా ఉన్నప్పటికీ, వ్యక్తులలో లేదా సమాజంలో అంతర్గతంగా వెల్లడైందనే భావాన్ని గ్రీకు పూర్తిగా తొలగించదు.
- issue: ἵνα ζήσωμεν యొక్క ఉద్దేశ భావం
  choice: ‘మనం ఆయన ద్వారా జీవించేలా’
  alternative: ‘మనం ఆయన ద్వారా జీవించడానికి’
  rationale: దేవుడు కుమారుణ్ణి పంపిన ఉద్దేశాన్ని నిలుపుతుంది; జీవం ఎలా స్వీకరించబడుతుందనే అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. మూలంలోని వివరణాత్మక ὅτι నిర్మాణాన్ని తెలుగులో ముందుగా కారణకార్యాన్ని చెప్పి, తరువాత ప్రధాన ప్రకటనను ఉంచే సహజ వాక్యక్రమంగా మలిచాం. అయితే [b] గుర్తు ప్రస్తుతం ‘వెల్లడైంది’ తరువాత ఉండటం దాని పద సంబంధాన్ని అస్పష్టంగా చేస్తుంది.
