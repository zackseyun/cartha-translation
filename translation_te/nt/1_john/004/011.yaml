id: 1JN.4.11
reference: 1 John 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀγαπητοί, εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς, καὶ ἡμεῖς ὀφείλομεν ἀλλήλους ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: te
  text: ప్రియులారా, దేవుడు మనలను ఈ విధంగా ప్రేమించి ఉంటే[a], మనం కూడా ఒకరినొకరు ప్రేమించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుడు మనలను ఈ విధంగా ప్రేమించాడు గనుక.’ గ్రీకులో షరతు నిర్మాణం ఉంది; అయితే సందర్భంలో దేవుడు నిజంగా ప్రేమించాడనే విషయాన్ని అది అంగీకరిస్తోంది.
    reason: షరతు రూపం మరియు సందర్భంలో అది నిజమని భావించే కారణార్థక ఛాయ రెండింటినీ చూపడం.
lexical_decisions:
- source_word: ἀγαπητοί
  choice: ప్రియులారా
  rationale: బహువచన సంబోధనలో యోహాను చూపే ఆప్యాయతను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఈ వాక్యంలోని ప్రేమ అనే ప్రధాన భావంతోనూ సంబంధాన్ని నిలుపుతుంది.
- source_word: εἰ
  choice: ఉంటే
  rationale: గ్రీకు షరతు రూపాన్ని తెలుగులో నిలుపుతుంది. సందర్భంలో ఆ షరతు నిజమని భావించినప్పటికీ, దాన్ని నేరుగా కారణార్థకంగా మార్చలేదు.
- source_word: οὕτως
  choice: ఈ విధంగా
  rationale: ముందటి సందర్భంలో వెల్లడైన దేవుని ప్రేమ విధానాన్ని సూచిస్తుంది; పరిమాణం లేదా తీవ్రత అనే ప్రతిధ్వనిని పూర్తిగా మూసివేయదు.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: గ్రీకు కర్తకు సూటిగా, సహజంగా సరిపడే తెలుగు రూపం.
- source_word: ἠγάπησεν
  choice: ప్రేమించి ఉంటే
  rationale: గతంలో దేవుడు చూపిన ప్రేమను షరతు ఉపవాక్యంతో సహజంగా కలుపుతుంది.
- source_word: ἡμᾶς
  choice: మనలను
  rationale: ప్రత్యక్ష కర్మను స్పష్టంగా వ్యక్తం చేసే ప్రామాణిక తెలుగు రూపం.
- source_word: καὶ ἡμεῖς
  choice: మనం కూడా
  rationale: గ్రీకులోని ఉద్ఘాటిత కర్తను, ‘కూడా’ అనే భావాన్ని సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: ὀφείλομεν
  choice: ప్రేమించాలి
  rationale: నైతిక బాధ్యతను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; కేవలం సలహాగా బలహీనపరచదు.
- source_word: ἀλλήλους
  choice: ఒకరినొకరు
  rationale: పరస్పర క్రియను తెలుగులో సహజంగా, ఖచ్చితంగా వ్యక్తం చేస్తుంది.
- source_word: ἀγαπᾶν
  choice: ప్రేమించాలి
  rationale: ప్రధాన ప్రేమ పదజాలాన్ని నిలుపుతూ, ὀφείλομενతో కలిపి సహజమైన తెలుగు విధ్యర్థక నిర్మాణాన్ని ఇస్తుంది.
theological_decisions:
- issue: εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς అనే షరతు ఉపవాక్యపు భావబలం
  choice: ‘దేవుడు మనలను ఈ విధంగా ప్రేమించి ఉంటే’ అని షరతు రూపాన్ని నిలుపడం
  alternative: ‘దేవుడు మనలను ఈ విధంగా ప్రేమించాడు గనుక’ అని కారణార్థకంగా అనువదించడం
  rationale: సందర్భంలో దేవుని ప్రేమ నిజమనే విషయాన్ని రచయిత సందేహించడం లేదు; అయినా గ్రీకు వాక్యం ఉపదేశాత్మక బలానికై షరతు రూపంలో ఉంది. అందువల్ల ఆ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సందర్భార్థాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రియులారా’ యోహాను సంబోధనలోని ఆప్యాయతను నిలుపుతుంది. ప్రధాన పాఠ్యంలో గ్రీకు షరతు నిర్మాణాన్ని ఉంచి, సాధ్యమైన కారణార్థక భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
