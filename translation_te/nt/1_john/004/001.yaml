id: 1JN.4.1
reference: 1 John 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: te
  text: ప్రియులారా,[a] ప్రతి ఆత్మనూ నమ్మకండి. అయితే ఆ ఆత్మలు దేవుని నుండి వచ్చినవో కావో పరీక్షించండి;[b] ఎందుకంటే అనేకమంది అబద్ధ ప్రవక్తలు లోకంలోకి బయలుదేరారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రియ స్నేహితులారా.” గ్రీకు సంబోధనకు అక్షరార్థం “ప్రియమైనవారలారా.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, ప్రవచన వాదనల వెనుక ఉన్న ఆత్మీయ మూలాన్ని పరీక్షించాలి; తరువాతి భాగం మానవ ప్రతినిధులైన “అబద్ధ ప్రవక్తల” గురించి చెబుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: ప్రియులారా
  rationale: ఆప్యాయతతో కూడిన బహువచన సంబోధనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ప్రేమించబడినవారు అనే మూలభావాన్ని నిలుపుతుంది.
- source_word: παντὶ πνεύματι
  choice: ప్రతి ఆత్మనూ
  rationale: ప్రవచన వాదనల వెనుక ఉన్న ఆత్మీయ మూలాలను సూచించే గ్రీకు పదబంధాన్ని వ్యాఖ్యానాత్మకంగా కుదించకుండా నేరుగా నిలుపుతుంది.
- source_word: πιστεύετε
  choice: నమ్మకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞ సాధారణ నిషేధాన్ని తెలియజేస్తుంది; చెప్పబడుతున్న దానిని నిజమని వెంటనే అంగీకరించవద్దనే భావానికి ఇది సహజమైన తెలుగు.
- source_word: δοκιμάζετε
  choice: పరీక్షించండి
  rationale: నిజమైనదో కాదో పరిశీలించి నిర్ధారించే మూల క్రియ యొక్క మూల్యాంకన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: τὰ πνεύματα
  choice: ఆ ఆత్మలు
  rationale: ముందున్న ‘ప్రతి ఆత్మ’కు తిరిగి సూచిస్తూ, మూలంలోని బహువచనాన్ని మరియు అతీంద్రియ భాషను నిలుపుతుంది.
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: దేవుని నుండి వచ్చినవో కావో
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; పరీక్ష యొక్క ఉద్దేశాన్ని ‘వో కావో’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πολλοὶ ψευδοπροφῆται
  choice: అనేకమంది అబద్ధ ప్రవక్తలు
  rationale: మానవ ప్రతినిధులను స్పష్టంగా పేర్కొనే మూల పదబంధానికి నేరమైన, స్థిరమైన తెలుగు సమానం.
- source_word: ἐξεληλύθασιν
  choice: బయలుదేరి వెళ్లారు
  rationale: పూర్తయిన చర్యకు కొనసాగుతున్న ఫలితం ఉందనే పర్ఫెక్ట్ కాల భావాన్ని సాధ్యమైనంత సహజంగా నిలుపుతూ, ‘వెళ్లారు’ అనే మూల చలన రూపకాన్ని కాపాడుతుంది.
- source_word: εἰς τὸν κόσμον
  choice: లోకంలోకి
  rationale: మానవ లోకంలోకి ప్రవేశించి ప్రస్తుతం క్రియాశీలంగా ఉన్నారనే దిశా భావాన్ని సహజంగా అందిస్తుంది; ‘లోక వ్యవస్థ’ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
theological_decisions:
- issue: ‘ఆత్మలు’ అనే పదం దేనిని సూచిస్తుంది?
  choice: ప్రవక్తల ద్వారా వ్యక్తమయ్యే వాదనల వెనుకనున్న వాస్తవ ఆత్మలు లేదా ఆత్మీయ మూలాలు
  alternative: కేవలం మానవ బోధకులు, లేదా స్వతంత్రంగా పరిగణించిన ప్రవచన ఉచ్చారణలు
  rationale: వాక్యం ‘ఆత్మలు’ అని చెప్పి తరువాత ‘అబద్ధ ప్రవక్తలు’ అనే మానవ ప్రతినిధులను పేర్కొంటుంది. అందువల్ల అతీంద్రియ భాషను తొలగించకుండా, ఆ ఆత్మలు మానవ ప్రవక్తల ద్వారా పరీక్షించబడతాయనే సందర్భాన్ని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఆప్యాయమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘ఆత్మలు’ అనే మూలపదాన్ని నిలిపి, దాని సందర్భార్థాన్ని పాదసూచికలో వివరించాం. వాక్యాన్ని సహజ పఠనానికి రెండు వాక్యాలుగా విభజించినా, గ్రీకు తార్కిక సంబంధాన్ని ‘అయితే’, ‘ఎందుకంటే’ ద్వారా నిలిపాం.
