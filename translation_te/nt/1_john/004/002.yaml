id: 1JN.4.2
reference: 1 John 4:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τούτῳ ⸀γινώσκετε τὸ πνεῦμα τοῦ θεοῦ· πᾶν πνεῦμα ὃ ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα ἐκ τοῦ θεοῦ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/002.yaml
  text: 'By this you know the Spirit of God: every spirit that confesses Jesus the Messiah having come in the flesh is from God[c][b][a],'
translation:
  language: te
  text: 'దీనివల్ల మీరు దేవుని ఆత్మను గుర్తిస్తారు: శరీరధారిగా వచ్చిన యేసు మెస్సీయను[a][b][c] ఒప్పుకునే ప్రతి ఆత్మ దేవుని నుండి వచ్చినది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యేసు క్రీస్తును.’ గ్రీకు Χριστός (క్రిస్టోస్) ఇక్కడ పేరులోని భాగం మాత్రమే కాక ‘మెస్సీయ’ అనే బిరుదుగా పనిచేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘వచ్చిన’ అనేది పరిపూర్ణకాల కృదంతం; యేసు మెస్సీయ నిజమైన శరీరంతో వచ్చిన సంఘటనతోపాటు దాని నిలిచివుండే ప్రాముఖ్యతను కూడా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘యేసు మెస్సీయ శరీరధారిగా వచ్చాడని ఒప్పుకునే.’
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: దీనివల్ల
  rationale: ఆత్మను గుర్తించే ప్రమాణాన్ని పరిచయం చేసే ప్రయోగం; సాధనార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γινώσκετε
  choice: మీరు ... గుర్తిస్తారు
  rationale: దీనిని ఆజ్ఞార్థకంగా కాక వర్తమాన సూచనార్థకంగా తీసుకున్నాం; సందర్భంలో ఆత్మలను వివేచించి గుర్తించడమే ఉద్దేశం.
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: దేవుని ఆత్మ
  rationale: నిర్దిష్ట ఏకవచన ప్రయోగం దేవుని ఆత్మను సూచిస్తుంది; తరువాతి ‘ప్రతి ఆత్మ’తో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: πᾶν πνεῦμα
  choice: ప్రతి ఆత్మ
  rationale: పరీక్షకు లోబడే ప్రతి ఆత్మీయ ప్రేరణ లేదా ప్రకటనకర్తను కలుపుకునే విభజక ప్రయోగాన్ని నేరుగా నిలుపుతుంది.
- source_word: ὁμολογεῖ
  choice: ఒప్పుకునే
  rationale: బహిరంగంగా అంగీకరించడం లేదా ప్రకటించడం అనే యోహాను రచనలలోని భావాన్ని సహజంగా అందిస్తుంది.
- source_word: Ἰησοῦν Χριστόν
  choice: యేసు మెస్సీయను
  rationale: Χριστόςను కేవలం పేరులోని భాగంలా కాక ‘అభిషిక్తుడు’ అనే బిరుదుగా చూపడానికి ‘మెస్సీయ’ను వాడాం.
- source_word: ἐν σαρκὶ ἐληλυθότα
  choice: శరీరధారిగా వచ్చిన
  rationale: నిజమైన మానవ శరీరంతో ఆయన రాకను సహజమైన తెలుగులో తెలియజేస్తూ, పరిపూర్ణకాల కృదంతపు రాక మరియు దాని కొనసాగుతున్న ప్రాముఖ్యతను సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: దేవుని నుండి వచ్చినది
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: τὸ πνεῦμα τοῦ θεοῦ ప్రత్యేకంగా దేవుని ఆత్మను సూచిస్తుందా, లేక దేవుని నుండి వచ్చిన ఒక ఆత్మను సూచిస్తుందా
  choice: ‘దేవుని ఆత్మ’ అని నిర్దిష్టంగా అనువదించాం.
  alternative: ‘దేవుని నుండి వచ్చిన ఆత్మ’
  rationale: నిర్దిష్ట పదబంధం మరియు 4:1–3లోని నిజమైన, అబద్ధమైన ఆత్మల వ్యత్యాసం దేవుని ఆత్మనే సూచిస్తున్నాయి; అయినా వచనంలో లేని సాంకేతిక వివరణను చేర్చలేదు.
- issue: ἐν σαρκὶ ἐληλυθότα యొక్క క్రీస్తుశాస్త్ర బలం
  choice: ‘శరీరధారిగా వచ్చిన’ అని అనువదించి యేసు యొక్క నిజమైన శారీరక రాకను ప్రకటించాం.
  alternative: ‘మానవుడిగా వచ్చిన’ లేదా ‘శరీరంలో వచ్చిన’
  rationale: మూలంలోని σάρξ భావాన్ని బలహీనపరచకుండా, తరువాతి సిద్ధాంతపరమైన సాంకేతిక పదజాలాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయకుండా ఉంచుతుంది.
- issue: ὁμολογεῖ తరువాతి Ἰησοῦν Χριστὸν ... ἐληλυθότα వాక్యనిర్మాణ సంబంధం
  choice: ‘శరీరధారిగా వచ్చిన యేసు మెస్సీయను ఒప్పుకునే’ అని కృదంత సంబంధాన్ని నిలిపాం.
  alternative: ‘యేసు మెస్సీయ శరీరధారిగా వచ్చాడని ఒప్పుకునే’
  rationale: మూలంలో యేసు మెస్సీయ ప్రత్యక్ష కర్మగా ఉండి, ‘వచ్చిన’ అనే కృదంతం ఆయనను విశేషిస్తుంది. తెలుగులో అర్థస్పష్టత కోసం ప్రత్యామ్నాయ వాక్యనిర్మాణాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన గ్రంథశైలిలో రూపొందించబడింది. ‘గుర్తిస్తారు,’ ‘ఒప్పుకునే,’ ‘దేవుని నుండి’ వంటి సహజ ప్రయోగాలను వాడి, మూలంలోని వాక్యనిర్మాణం మరియు క్రీస్తుశాస్త్ర ఉద్వేగాన్ని సాధ్యమైనంతగా నిలిపాం.
