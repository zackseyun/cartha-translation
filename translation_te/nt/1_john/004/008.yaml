lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: ప్రేమించనివాడు
  rationale: నిర్దిష్ట వ్యక్తిని కాకుండా, ప్రేమించని స్వభావం లేదా కొనసాగుతున్న ప్రవర్తన కలిగిన ఎవరికైనా వర్తించే గ్రీకు article + present participle నిర్మాణాన్ని సహజమైన తెలుగు ఏకవచన రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἀγαπῶν
  choice: ప్రేమించని
  rationale: వాక్యం చివర ఉన్న ἀγάπηతో పదసంబంధం కనిపించేలా ‘ప్రేమ’ అనే ఒకే మూలపదాన్ని నిలుపుతుంది.
- source_word: οὐκ ἔγνω
  choice: ఎరుగలేదు
  rationale: ἔγνω అనే aorist రూపాన్ని గతంలో దేవుణ్ణి తెలుసుకునే సంబంధంలోకి రాలేదనే భావంతో వ్యక్తం చేస్తుంది. ‘అర్థం చేసుకోలేదు’ అనే కేవలం జ్ఞానసంబంధ అర్థానికి పరిమితం చేయదు.
- source_word: τὸν θεόν
  choice: దేవుణ్ణి
  rationale: ἔγνωకు ప్రత్యక్ష కర్మగా ఉన్న పదాన్ని సహజమైన తెలుగు ద్వితీయా విభక్తితో అనువదిస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని పరిచయం చేసే causal forceను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: గ్రీకు వాక్యంలోని కర్తను నేరుగా, ప్రామాణికంగా అనువదిస్తుంది.
- source_word: ἀγάπη
  choice: ప్రేమే
  rationale: విశేషణంగా బలహీనపరచకుండా predicate noun అయిన ‘ప్రేమ’ను నిలుపుతుంది; తెలుగు సమీకరణ వాక్యంలో ‘ఏ’ కారం సహజంగా ‘దేవుడు ప్రేమ’ అనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐστίν
  choice: ప్రేమే అనే సమీకరణ నిర్మాణంలో అంతర్భూతం
  rationale: తెలుగులో వర్తమానకాల సమీకరణ వాక్యాల్లో copulaను విడిగా పలకనవసరం లేదు; ‘ప్రేమే’ సహజంగా ‘is love’ అనే భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: ‘దేవుడు ప్రేమ’ అనే ప్రకటన బలం
  choice: దేవుడు ప్రేమే
  alternative: దేవుడు ప్రేమగలవాడు; ప్రేమే దేవుడు
  rationale: గ్రీకులో ‘దేవుడు’ కర్త, ‘ప్రేమ’ విధేయ నామవాచకం. అందువల్ల దేవుని స్వభావం గురించి ఉన్న బలమైన ప్రకటనను నిలుపుతూ, దానిని ‘ప్రేమే దేవుడు’ అని తారుమారు చేయదు; ‘ప్రేమగలవాడు’ అని విశేషణాత్మకంగా బలహీనపరచదు.
- issue: దేవుణ్ణి ఎరుగుటలోని కాలాంశం మరియు సంబంధార్థం
  choice: ఎరుగలేదు
  alternative: ఎరుగడు; దేవుణ్ణి అర్థం చేసుకోలేదు
  rationale: గ్రీకు aoristను గౌరవిస్తూ, దేవుణ్ణి ఎరుగుటను కేవలం మేధోపరమైన అవగాహనగా కాక సంబంధపూర్వక పరిచయంగా ఉంచుతుంది. సందర్భంలో ఫలితంగా కొనసాగుతున్న స్థితిని పాదసూచికలో ప్రత్యామ్నాయంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. ‘ఎరుగలేదు’ సాధారణ ‘తెలుసుకోలేదు’ కంటే కొద్దిగా ఉన్నతమైనదైనా, దేవునితో సంబంధపూర్వక పరిచయాన్ని స్పష్టంగా సూచించే సుపరిచిత పదం. ‘దేవుడు ప్రేమే’ సహజమైన తెలుగు సమీకరణ నిర్మాణాన్ని ఉపయోగిస్తూ గ్రీకు predicate noun బలాన్ని కాపాడుతుంది.
