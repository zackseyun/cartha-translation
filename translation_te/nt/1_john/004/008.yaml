revisions:
- from: ప్రేమించనివాడు దేవుణ్ణి ఎరుగలేదు[a]; ఎందుకంటే దేవుడు ప్రేమే.
  to: ప్రేమించనివాడు దేవుణ్ణి తెలుసుకోలేదు[a]; ఎందుకంటే దేవుడు ప్రేమ.
  rationale: The revision updates the older “ఎరుగలేదు” to natural modern-standard “తెలుసుకోలేదు,” while preserving the aorist’s sense of not having come to know God. It also removes the additional emphatic nuance of “ప్రేమే”; “దేవుడు ప్రేమ” faithfully preserves the Greek subject–predicate order and noun-predicate force without doctrinal expansion.
