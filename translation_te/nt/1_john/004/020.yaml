id: 1JN.4.20
reference: 1 John 4:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν, καὶ τὸν ἀδελφὸν αὐτοῦ μισῇ, ψεύστης ἐστίν· ὁ γὰρ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ὃν ἑώρακεν, τὸν θεὸν ὃν οὐχ ἑώρακεν ⸀οὐ δύναται ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: te
  text: ఎవరైనా, “నేను దేవుణ్ణి ప్రేమిస్తున్నాను” అని చెప్పి[a], తన సహోదరుణ్ణి ద్వేషిస్తే, అతడు అబద్ధికుడు. ఎందుకంటే, తాను చూసిన తన సహోదరుణ్ణి ప్రేమించనివాడు, తాను చూడని దేవుణ్ణి ప్రేమించలేడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన సహోదరుణ్ణి లేదా సహోదరిని.” గ్రీకు పాఠంలో ‘తన సహోదరుణ్ణి’ (ἀδελφόν) అనే పుంలింగ ఏకవచన రూపం ఉంది; ఈ సందర్భంలో అది ప్రతినిధి అర్థంలో వాడబడి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: ఎవరైనా ... అని చెప్పి
  rationale: ἐάν, aorist subjunctive εἴπῃ, indefinite τις కలిసి సాధారణ షరతును సూచిస్తాయి. తరువాతి μισῇతో సహజమైన తెలుగు షరతు వాక్యంగా ‘చెప్పి ... ద్వేషిస్తే’ అని ఇచ్చాం.
- source_word: Ἀγαπῶ τὸν θεόν
  choice: నేను దేవుణ్ణి ప్రేమిస్తున్నాను
  rationale: వర్తమాన కాలంలోని Ἀγαπῶను సహజమైన ఆధునిక తెలుగులో వర్తమాన స్థితిని తెలిపేలా అనువదించాం; వాక్యమంతటా ἀγαπάω పదబంధ సంబంధాన్ని ‘ప్రేమించు’తో నిలిపాం.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: తన సహోదరుణ్ణి
  rationale: ἀδελφός పుంలింగ ఏకవచనం. ‘సహోదరుడు’ మూలరూపాన్ని కాపాడుతూ, సందర్భంలో తోటి విశ్వాసిని కూడా సూచించగల విస్తృతిని పాదసూచికలో తెలిపాం.
- source_word: μισῇ
  choice: ద్వేషిస్తే
  rationale: వర్తమాన subjunctiveను సాధారణ షరతులో సహజమైన తెలుగు క్రియారూపంతో ఇచ్చాం; ద్వేషం అనే బలమైన విరుద్ధ భావాన్ని తగ్గించలేదు.
- source_word: ψεύστης ἐστίν
  choice: అతడు అబద్ధికుడు
  rationale: ψεύστης క్రియాభావం మాత్రమే కాక వ్యక్తిని వర్ణించే predicate noun; యోహాను చెప్పే నిర్దిష్ట నైతిక తీర్పును ‘అబద్ధికుడు’ కాపాడుతుంది.
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: ఎందుకంటే ... ప్రేమించనివాడు
  rationale: γάρ ఇచ్చే వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో, substantival participleను ‘ప్రేమించనివాడు’తో సహజంగా వ్యక్తం చేశాం.
- source_word: ὃν ἑώρακεν
  choice: తాను చూసిన
  rationale: ἑώρακεν perfect రూపంలోని గత దర్శనం మరియు ప్రస్తుత సంబంధాన్ని తెలుగు relative participle సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ δύναται ἀγαπᾶν
  choice: ప్రేమించలేడు
  rationale: δύναται తెలిపే సామర్థ్యం లేదా సాధ్యతలేమిని బలంగా, సంక్షిప్తంగా నిలిపింది; దాన్ని కేవలం కష్టమనే భావానికి తగ్గించలేదు.
theological_decisions:
- issue: ἀδελφός సందర్భంలో తోటి విశ్వాసులందరినీ ప్రతినిధిగా సూచించగలదా
  choice: సహోదరుడు
  alternative: సహోదరుడు లేదా సహోదరి; తోటి విశ్వాసి
  rationale: మూలంలోని పుంలింగ ఏకవచనాన్ని ప్రధాన పాఠంలో కాపాడాం. సందర్భంలో ప్రతినిధి ప్రయోగం ఉండవచ్చనే అవకాశాన్ని పాదసూచికలో ఉంచి, ప్రధాన పాఠంలో అర్థాన్ని అతిగా నిర్ధారించలేదు.
- issue: οὐ δύναται ἀγαπᾶν యొక్క బలం
  choice: దేవుణ్ణి ప్రేమించలేడు
  alternative: దేవుణ్ణి ప్రేమించగలడు కాదు
  rationale: ఇది కేవలం ఆచరణాత్మక కష్టం కాక, యోహాను వాదనలోని బలమైన నైతిక-ఆధ్యాత్మిక అసాధ్యత. ‘ప్రేమించలేడు’ ఆ బలాన్ని వివరణ జోడించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘దేవుణ్ణి,’ ‘సహోదరుణ్ణి’ వంటి సహజ కర్మరూపాలు, ‘అబద్ధికుడు’ అనే నిర్దిష్ట predicate noun ఉపయోగించబడ్డాయి. మూలంలోని ప్రేమ–ద్వేష వ్యతిరేకతను, చూసినవాడు–చూడని దేవుడు అనే వాదనను స్పష్టంగా నిలిపాం.
