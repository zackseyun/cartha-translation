revisions:
- from: ప్రేమలో భయం ఉండదు. సంపూర్ణమైన ప్రేమ భయాన్ని వెళ్లగొడుతుంది; ఎందుకంటే భయం శిక్షను కలిగి ఉంటుంది.[a] భయపడేవాడు ప్రేమలో సంపూర్ణత పొందలేదు.[b]
  to: ప్రేమలో భయం ఉండదు; కానీ సంపూర్ణమైన ప్రేమ భయాన్ని వెళ్లగొడుతుంది, ఎందుకంటే భయానికి శిక్ష ఉంది.[a] కానీ భయపడేవాడు ప్రేమలో సంపూర్ణపరచబడలేదు.[b]
