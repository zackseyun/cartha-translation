review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the repeated terms for fear (φόβος), love (ἀγάπη), complete/perfect (τελεία), and the expulsion metaphor (ἔξω βάλλει). However, it omits the explicit adversative particles ἀλλά (“but”) and δέ (“but/and”), which are significant to the verse’s contrast. The final perfect passive, οὐ τετελείωται, is better represented by a passive verbal expression than by the less specific ‘సంపూర్ణత పొందలేదు.’
  naturalness: The Telugu is generally clear and modern. ‘భయం శిక్షను కలిగి ఉంటుంది’ is understandable but noticeably calqued. ‘భయానికి శిక్ష ఉంది’ is concise, natural Telugu and retains the source’s direct association without interpretive expansion.
  terminology: ‘ప్రేమ,’ ‘భయం,’ and ‘సంపూర్ణమైన’ are suitable and consistent. ‘ప్రేమలో సంపూర్ణపరచబడలేదు’ preserves the Greek word-family connection between τελεία and τετελείωται while also reflecting the passive form.
  issues:
  - severity: medium
    issue: The contrastive particles are not represented.
    rationale: ἀλλά introduces the contrast between fear and complete love, and δέ introduces the contrasting conclusion about the person who fears. Telugu should include ‘కానీ’ in both places.
  - severity: medium
    issue: The final perfect passive is weakened in ‘సంపూర్ణత పొందలేదు.’
    rationale: οὐ τετελείωται denotes not having been brought to completeness, with a resulting state. ‘ప్రేమలో సంపూర్ణపరచబడలేదు’ more closely represents the passive and retains the lexical link with ‘సంపూర్ణమైన.’
  - severity: low
    issue: ‘భయం శిక్షను కలిగి ఉంటుంది’ is overly literal Telugu.
    rationale: While structurally close to κόλασιν ἔχει, ‘భయానికి శిక్ష ఉంది’ is more idiomatic and still preserves the concise source-level association rather than explaining it as anxiety about punishment.
  revised_text: ప్రేమలో భయం ఉండదు; కానీ సంపూర్ణమైన ప్రేమ భయాన్ని వెళ్లగొడుతుంది, ఎందుకంటే భయానికి శిక్ష ఉంది.[a] కానీ భయపడేవాడు ప్రేమలో సంపూర్ణపరచబడలేదు.[b]
