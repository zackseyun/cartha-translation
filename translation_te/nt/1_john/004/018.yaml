id: 1JN.4.18
reference: 1 John 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: te
  text: ప్రేమలో భయం ఉండదు; కానీ సంపూర్ణమైన ప్రేమ భయాన్ని వెళ్లగొడుతుంది, ఎందుకంటే భయానికి శిక్ష ఉంది.[a] కానీ భయపడేవాడు ప్రేమలో సంపూర్ణపరచబడలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “భయం శిక్షను కలిగి ఉంటుంది.” దీన్ని “భయం శిక్షతో ముడిపడి ఉంటుంది” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “సంపూర్ణమైన” అనే పదానికి “పూర్తయిన” లేదా “పరిపక్వమైన” అనే భావం కూడా ఉండవచ్చు. “సంపూర్ణపరచబడలేదు” అనే మాట మూలభాషలో “సంపూర్ణమైన”తో అదే పదకుటుంబానికి చెందినది.
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος
  choice: భయం
  rationale: తీర్పు మరియు శిక్షకు సంబంధించిన భయాన్ని సూచించే సహజమైన తెలుగు పదం; వచనమంతటా పునరావృతమయ్యే మూలపద సంబంధాన్ని నిలుపుతుంది.
- source_word: ἀγάπῃ / ἀγάπη
  choice: ప్రేమ
  rationale: ἀγάπηకు సహజమైన ప్రామాణిక అనువాదం; వచనంలోని కీలక పద పునరావృతిని కాపాడుతుంది.
- source_word: τελεία
  choice: సంపూర్ణమైన
  rationale: ఉద్దేశించిన నిండుదలకు చేరిన ప్రేమ అనే భావాన్ని తెలియజేస్తుంది; కేవలం భావోద్వేగ పరిపక్వతగా పరిమితం చేయదు.
- source_word: ἔξω βάλλει
  choice: వెళ్లగొడుతుంది
  rationale: బయటకు బలంగా తొలగించడం అనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: κόλασιν ἔχει
  choice: శిక్షను కలిగి ఉంటుంది
  rationale: గ్రీకు వాక్యంలోని ప్రత్యక్షమైన ‘శిక్షను కలిగి ఉంది’ అనే నిర్మాణాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
- source_word: ὁ δὲ φοβούμενος
  choice: భయపడేవాడు
  rationale: లింగాన్ని ప్రత్యేకంగా ఉద్దేశించకుండా, substantival participle‌ను సంక్షిప్తమైన సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: οὐ τετελείωται
  choice: సంపూర్ణత పొందలేదు
  rationale: పూర్తి చేయబడిన ఫలితస్థితిని సహజ తెలుగులో తెలియజేస్తూ, τελείαతో ఉన్న పదార్థ సంబంధాన్ని ‘సంపూర్ణ’ ద్వారా కాపాడుతుంది.
- source_word: ἐν τῇ ἀγάπῃ
  choice: ప్రేమలో
  rationale: ఆ ప్రేమ పరిధిలో లేదా సంబంధంలో అనే భావాన్ని సరళంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘సంపూర్ణమైన ప్రేమ’ మరియు ‘సంపూర్ణత పొందలేదు’ మధ్య సంబంధం
  choice: ఒకే ‘సంపూర్ణ’ పదకుటుంబాన్ని ఉపయోగించి, ప్రేమ నిండుదలకూ వ్యక్తి ప్రేమలో పూర్తి చేయబడటానికీ మధ్య ఉన్న మూలభాషా సంబంధాన్ని నిలుపడం.
  alternative: ‘పరిపక్వమైన ప్రేమ’ / ‘ప్రేమలో పరిపక్వుడు కాలేదు.’
  rationale: ఈ ఎంపిక వచనంలోని ఉద్దేశిత నిండుదల భావాన్ని మరియు దైవశాస్త్రీయ ఉద్వేగాన్ని నిలుపుతుంది; దీనిని పాపరహిత పరిపూర్ణత అనే ప్రత్యేక సిద్ధాంతంగా గానీ, కేవలం మానసిక పరిపక్వతగా గానీ నిర్ణయించదు.
- issue: ‘భయం శిక్షను కలిగి ఉంటుంది’ అనే అసాధారణ నిర్మాణం
  choice: మూలంలోని సంక్షిప్త, ప్రత్యక్ష సంబంధాన్ని ప్రధాన పాఠ్యంలో నిలుపడం.
  alternative: ‘భయం శిక్షతో ముడిపడి ఉంటుంది’ లేదా ‘భయంలో శిక్ష గురించిన ఆందోళన ఉంటుంది.’
  rationale: ప్రత్యామ్నాయాలు భావాన్ని సులభం చేస్తాయి కానీ ‘కలిగి ఉంటుంది’ అనే గ్రీకు నిర్మాణాన్ని వివరణాత్మకంగా పరిష్కరిస్తాయి; మూలంలోని నిజమైన సంక్షిప్తతను నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, గంభీరతను మరియు మూలంలోని కీలక పద పునరావృతిని కాపాడింది. ‘శిక్షను కలిగి ఉంటుంది’ కొద్దిగా అసాధారణమైనప్పటికీ మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను నిలుపుతుంది.
