  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
translation:
  language: te
  text: వారు లోకం నుండి వచ్చినవారు[a]. అందుచేత వారు లోకం నుండి మాట్లాడుతారు; లోకం వారి మాట వింటుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారు లోకానికి చెందినవారు … వారు లోకం నుండి మాట్లాడుతారు’ అని కూడా అనువదించవచ్చు. గ్రీకులో రెండుసార్లు అక్షరార్థంగా ‘లోకం నుండి’ అని ఉంది; అది మూలాన్ని లేదా ఉద్భవాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘లోకం’ అంటే సృష్టించబడిన విశ్వం కాదు; దేవునికి విరోధంగా ఉన్న మానవ క్రమం.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτοὶ
  choice: వారు
  rationale: ముందటి సందర్భంలోని అబద్ధ ప్రవక్తలను సూచిస్తూ, తరువాతి వచనంలోని ‘మనం’తో ఉన్న వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐκ τοῦ κόσμου
  choice: లోకంనుండి వచ్చినవారు
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κόσμος
  choice: లోకం
  rationale: యోహాను రచనలోని విస్తృతమైన ధార్మిక ప్రతిధ్వనిని నిలుపుతుంది; ప్రధాన పాఠ్యంలో వివరణాత్మకంగా ‘లోక వ్యవస్థ’ అని విస్తరించదు.
- source_word: διὰ τοῦτο
  choice: అందుచేత
  rationale: వారి మూలానికీ వారు మాట్లాడే విధానానికీ మధ్య ఉన్న కారణ సంబంధాన్ని సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκ τοῦ κόσμου λαλοῦσιν
  choice: లోకంనుండే మాట్లాడుతారు
  rationale: గ్రీకులో పునరావృతమైన ἐκ τοῦ κόσμου అనే మూలభావాన్ని నిలుపుతూ, ‘ఏ’ అవధారణ ద్వారా దానిని తెలుగులో సహజంగా బలపరుస్తుంది.
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: లోకం వారి మాట వింటుంది
  rationale: ἀκούει ఇక్కడ కేవలం శబ్దం వినడమే కాక అనుకూలంగా ఆలకించడం లేదా స్వీకరించడం సూచిస్తుంది; ‘వారి మాట వింటుంది’ ఈ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: యోహాను రచనలో κόσμος యొక్క అర్థం
  choice: దేవునికి విరోధంగా ఉన్న మానవ వ్యవస్థను సూచించే ‘లోకం’
  alternative: భౌతిక సృష్టి; తటస్థ అర్థంలోని మానవజాతి
  rationale: తక్షణ సందర్భం ‘దేవునినుండి’ ఉన్నవారిని ‘లోకంనుండి’ ఉన్నవారితో వ్యత్యాసపరుస్తుంది. అయినా వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో కలపకుండా సాధారణ పదమైన ‘లోకం’నే ఉంచాం.
- issue: αὐτοὶ యొక్క అవధారణ
  choice: ప్రధాన పాఠ్యంలో ‘వారు’
  alternative: ‘వారే’ లేదా ‘వారు స్వయంగా’
  rationale: గ్రీకులో స్వల్ప అవధారణ ఉన్నప్పటికీ, తెలుగులో ‘వారే’ అనడం అవసరానికి మించి బలంగా వినిపించవచ్చు; సందర్భంలోని వ్యత్యాసం ‘వారు’తోనే స్పష్టంగా ఉంటుంది.
