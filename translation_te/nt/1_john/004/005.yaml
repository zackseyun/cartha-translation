  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. గ్రీకు మూలంలోని ‘లోకంనుండి’ అనే పునరుక్తినీ, మూలం/ఉద్భవం అనే భావాన్నీ సాధ్యమైనంతవరకు నిలిపాం.
