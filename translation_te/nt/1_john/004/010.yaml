id: 1JN.4.10
reference: 1 John 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐστὶν ἡ ἀγάπη, οὐχ ὅτι ἡμεῖς ⸀ἠγαπήκαμεν τὸν θεόν, ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς καὶ ἀπέστειλεν τὸν υἱὸν αὐτοῦ ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/010.yaml
  text: 'In this is love: not that we have loved God, but that he loved us and sent his Son as an atoning sacrifice for our sins.'
translation:
  language: te
  text: 'ప్రేమ అంటే ఇదే: మనం దేవుణ్ణి ప్రేమించాము అని కాదు, ఆయనే మనలను ప్రేమించాడు, మన పాపాల కోసం తన కుమారుణ్ణి పాపపరిహార బలిగా[a] పంపాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రాయశ్చిత్త బలిగా”; “దేవుని కోపాన్ని శాంతింపజేసే బలిగా” అని కూడా అర్థం కావచ్చు. గ్రీకు పదం ἱλασμός కుమారుడు బలి ద్వారా మన పాపాలతో వ్యవహరించడాన్ని సూచిస్తుంది.
    reason: ἱλασμόςకు సంబంధించిన ప్రాయశ్చిత్తం/పాపనివారణ మరియు కోపశాంతి అనే ప్రధాన భావసాధ్యతలను వేరుచేసి చూపుతుంది; వివాదాస్పద వేదాంతపరమైన అర్థాన్ని ప్రధాన పాఠంపై రుద్దదు.
lexical_decisions:
- source_word: ἐν τούτῳ ἐστὶν ἡ ἀγάπη
  choice: ప్రేమ అంటే ఇదే
  rationale: తర్వాత చెప్పబోయేదే ప్రేమకు నిర్వచనాత్మకమైన నిదర్శనమని సూచించే యోహాను శైలిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὐχ ὅτι ἡμεῖς ἠγαπήκαμεν τὸν θεόν, ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς
  choice: మనం దేవుణ్ణి ప్రేమించామని కాదు; ఆయనే మనలను ప్రేమించి
  rationale: ‘కాదు; ... ఆయనే’ అనే నిర్మాణం గ్రీకులోని వ్యత్యాసాన్ని, αὐτός పదంలోని ఉద్ఘాటనను నిలుపుతుంది. తెలుగులో సహజత్వం కోసం సమన్వయ క్రియారూపం వాడబడింది.
- source_word: ἀπέστειλεν τὸν υἱὸν αὐτοῦ
  choice: తన కుమారుణ్ణి ... పంపాడు
  rationale: దేవుడు పంపిన కార్యాన్ని, తండ్రి–కుమార సంబంధాన్ని నేరుగా మరియు స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἱλασμὸν
  choice: పాపపరిహార బలిగా
  rationale: పాపాలతో ప్రభావవంతంగా వ్యవహరించే బలి అనే భావాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా తెలియజేస్తుంది; పదంలో ఉన్న ప్రాయశ్చిత్తం, పాపనివారణ, కోపశాంతి సంబంధిత విస్తృత భావసాధ్యతలను పాదటిప్పణిలో ఉంచుతుంది.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: మన పాపాల కోసం
  rationale: బలి సందర్భంలో περί యొక్క సంబంధార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἱλασμός అనే ప్రాయశ్చిత్త సంబంధిత పదం యొక్క అనువాదం
  choice: పాపపరిహార బలిగా
  alternative: ప్రాయశ్చిత్త బలిగా; పాపాలను తొలగించే బలిగా; దేవుని కోపాన్ని శాంతింపజేసే బలిగా
  rationale: ప్రధాన పాఠంలో బలి మరియు పాపపరిహార భావాలను స్పష్టంగా ఉంచుతూ, ఈ పదం కేవలం పాపనివారణను సూచిస్తుందా లేక దేవుని కోపశాంతిని కూడా సూచిస్తుందా అనే వేదాంతపరమైన ఉద్రిక్తతను పాదటిప్పణి ద్వారా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకుడికి అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలితో అనువదించబడింది. దేవుని కార్యాన్ని చెప్పేటప్పుడు తెలుగు బైబిలు గద్యానికి సహజమైన ఏకవచన క్రియారూపాలు వాడబడ్డాయి; ‘ఆయనే’ ద్వారా గ్రీకు ఉద్ఘాటన నిలుపబడింది.
