  text: ἡμεῖς ⸀ἀγαπῶμεν, ὅτι αὐτὸς πρῶτος ἠγάπησεν ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/019.yaml
  text: We love because he first loved us[a].
translation:
  language: te
  text: మనం ప్రేమిస్తున్నాం; ఎందుకంటే ఆయనే మొదట మనలను ప్రేమించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “ఆయన మొదట మనలను ప్రేమించాడు కాబట్టి మనం ఆయనను ప్రేమిస్తున్నాం” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἡμεῖς
  choice: మనం
  rationale: గ్రీకులో స్పష్టంగా ఉన్న బహువచన కర్తకు స్వల్ప ఉద్ఘాటన ఉంది. ఆధునిక తెలుగులో సమగ్ర భావాన్ని సహజంగా తెలియజేయడానికి ‘మనం’ సరిపోతుంది.
- source_word: ἀγαπῶμεν
  choice: ప్రేమిస్తున్నాం
  rationale: వర్తమానకాల క్రియను సహజమైన తెలుగు వర్తమాన రూపంలో అనువదించి, సందర్భంలోని ప్రేమ అనే ప్రధాన పదబంధ సంబంధాన్ని నిలిపాం; మూలంలో లేని కర్మను చేర్చలేదు.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఇక్కడ ఇది కారణార్థకం; మన ప్రేమకు దేవుని ముందస్తు ప్రేమ కారణమని స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὐτὸς
  choice: ఆయనే
  rationale: సందర్భంలో ఇది దేవుణ్ణి సూచిస్తుంది. ‘ఆయనే’ గ్రీకు సర్వనామంలోని ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: πρῶτος
  choice: మొదట
  rationale: దేవుని ప్రేమ మన ప్రేమకు ముందున్నదనే కాలపరమైన ప్రాధాన్యాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ἠγάπησεν
  choice: ప్రేమించాడు
  rationale: గ్రీకు ఏఓరిస్ట్‌ను దేవుని నిర్ణాయకమైన ముందస్తు ప్రేమ కార్యాన్ని సూచించే సహజ తెలుగు భూతకాల రూపంతో అందించాం.
- source_word: ἡμᾶς
  choice: మనలను
  rationale: ఇది ἠγάπησεν క్రియకు ప్రత్యక్ష కర్మ; ‘మనలను’ స్పష్టమైన, ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: ‘మనం ప్రేమిస్తున్నాం’ అనే క్రియకు కర్మను చేర్చాలా?
  choice: కర్మను పేర్కొనకుండా ‘మనం ప్రేమిస్తున్నాం’ అని ఉంచడం
  alternative: ‘మనం ఆయనను ప్రేమిస్తున్నాం’ లేదా ‘మనం దేవుణ్ణి ప్రేమిస్తున్నాం’
  rationale: SBLGNT పాఠంలో ἀγαπῶμεν తరువాత ప్రత్యక్ష కర్మ లేదు. ‘ఆయనను’ చేర్చడం కొన్ని ప్రతుల పాఠాన్ని అనుసరిస్తుంది; ప్రధాన పాఠంలోని విస్తృతమైన, ఉద్దేశపూర్వకంగా నిర్దిష్టం కాని ప్రేమ భావాన్ని అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. మూలపాఠంలోని కర్మలేని ‘ప్రేమిస్తున్నాం’ రూపాన్ని నిలిపి, పాఠాంతరాన్ని అడుగుసూచనలో ఇచ్చాం.
