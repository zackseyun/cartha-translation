id: 1JN.4.16
reference: 1 John 4:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: te
  text: మనమూ దేవుడు మన మధ్య కలిగి ఉన్న ప్రేమను[a] తెలుసుకున్నాము, విశ్వసించాము. దేవుడు ప్రేమ. ప్రేమలో నిలిచి ఉండేవాడు దేవునిలో నిలిచి ఉంటాడు; దేవుడు అతనిలో[b] నిలిచి ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మనలో కలిగి ఉన్న ప్రేమను.’ గ్రీకు పదబంధం విశ్వాసులలో ఉన్న ప్రేమను గానీ, వారి సమాజంలో వ్యక్తమయ్యే ప్రేమను గానీ సూచించవచ్చు; సందర్భానుసారంగా ‘మనపట్ల ఉన్న ప్రేమను’ అని కూడా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో ‘అతనిలో’ అనేది పుంలింగ ఏకవచనం; ఇక్కడ అది ప్రేమలో నిలిచి ఉండే ఎవరినైనా ప్రతినిధిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: తెలుసుకున్నాం
  rationale: Perfect tense సూచించే గతంలో పొందిన జ్ఞానం ఇప్పటికీ నిలిచివున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘తెలుసుకున్నాం’ తెలియజేస్తుంది.
- source_word: πεπιστεύκαμεν
  choice: విశ్వసించాం
  rationale: πιστεύω యొక్క స్థిరమైన నమ్మకం/విశ్వాస భావాన్ని నిలుపుతుంది; ముందున్న క్రియతో సమాంతరంగా సంక్షిప్తంగా ఉంది.
- source_word: τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: దేవుడు మన మధ్య కలిగివున్న ప్రేమను
  rationale: ἐν ἡμῖν యొక్క స్థానిక/సామూహిక భావాన్ని ‘మన మధ్య’ నిలుపుతుంది; దాన్ని వివరణాత్మకమైన ‘మనపట్ల’గా ప్రధాన పాఠంలో మార్చదు.
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: దేవుడు ప్రేమ
  rationale: గ్రీకు నామవాచక విధేయ వాక్యాన్ని విస్తరించకుండా నేరుగా, గంభీరంగా అందిస్తుంది.
- source_word: ὁ μένων
  choice: నిలిచి ఉండేవాడు
  rationale: μένωలోని కొనసాగింపు, స్థిరత్వ భావాలను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ ἀγάπῃ
  choice: ప్రేమలో
  rationale: దైవప్రేమ అనే సంబంధ పరిధిలో కొనసాగడాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐν τῷ θεῷ μένει / ὁ θεὸς ἐν αὐτῷ μένει
  choice: దేవునిలో నిలిచి ఉంటాడు / దేవుడు అతనిలో నిలిచి ఉంటాడు
  rationale: పరస్పర అంతర్నివాస భావాన్ని మరియు μένω పదపునరుక్తిని ఒకే తెలుగు ప్రయోగంతో నిలుపుతుంది.
theological_decisions:
- issue: ἐν ἡμῖν యొక్క అర్థం
  choice: ‘మన మధ్య’ అనే స్థానిక/సామూహిక భావం
  alternative: ‘మనలో’ అనే అంతర్గత నివాస భావం; లేదా ‘మనపట్ల’ అనే ప్రయోజనార్థక భావం
  rationale: ἐν యొక్క సాధారణ స్థానిక బలాన్ని, సంఘంలో ప్రత్యక్షమయ్యే ప్రేమను ప్రధాన పాఠం కాపాడుతుంది. అంతర్గత నివాస భావం సాధ్యమే; ‘మనపట్ల’ సందర్భానుకూలమైనా మరింత వివరణాత్మకం.
- issue: αὐτῷ లోని పుంలింగ ఏకవచనం
  choice: ‘అతనిలో’ అని మూలరూపానికి అనుగుణంగా అనువదించడం
  alternative: ‘ఆ వ్యక్తిలో’ అనే లింగ-తటస్థ వివరణ
  rationale: గ్రీకులోని పుంలింగ ఏకవచన రూపాన్ని నిలుపుతూ, అది ‘ప్రేమలో నిలిచి ఉండేవాడు’ అనే ప్రతినిధి వ్యక్తిని సూచిస్తుందని పాదసూచిక స్పష్టం చేస్తుంది.
- issue: ‘దేవుడు ప్రేమ’ అనే వాక్య స్వరూపం
  choice: సమీకరణను నేరుగా నిలుపడం
  alternative: ‘దేవుడు ప్రేమగలవాడు’ లేదా ‘దేవుడు ప్రేమాస్వరూపి’
  rationale: ప్రత్యామ్నాయాలు వరుసగా గ్రీకు వాక్యాన్ని కేవలం ఒక గుణంగా తగ్గించవచ్చు లేదా తాత్త్విక విస్తరణను చేర్చవచ్చు; నేర అనువాదం మూలంలోని ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి. ‘నిలిచి ఉండు’ అనే పదబంధం యోహాను రచనల్లోని μένω పునరావృతాన్ని నిలుపుతుంది. ‘దేవుడు ప్రేమ’ అనే సంక్షిప్త నామవాచక వాక్యం మూలంలోని నేరత్వాన్ని కాపాడుతుంది.
