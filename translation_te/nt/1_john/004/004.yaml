id: 1JN.4.4
reference: 1 John 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: te
  text: చిన్నపిల్లలారా, మీరు దేవుని నుండి వచ్చినవారు; మరియు వారిని జయించారు[a], ఎందుకంటే మీలో ఉన్నవాడు లోకంలో ఉన్నవాడికంటే గొప్పవాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఇంతకుముందు ప్రస్తావించిన విరోధులను, ముఖ్యంగా అబద్ధ ప్రవక్తలను.
    reason: cross_reference
  - marker: b
    text: ‘మీలో ఉన్నవాడు,’ ‘లోకంలో ఉన్నవాడు’ అనే మాటలు ఎవరిని సూచిస్తున్నాయో గ్రీకు వాక్యం పేరుపెట్టి చెప్పదు. సందర్భం ప్రకారం మొదటిది దేవుణ్ణి లేదా ఆయన ఆత్మను, రెండవది లోకం వెనుక ఉన్న దుష్టుణ్ణి సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς
  choice: మీరు
  rationale: గ్రీకులో సర్వనామం స్పష్టంగా వచ్చి ఉద్ఘాటనను ఇస్తుంది. తెలుగులో వాక్యారంభంలోని ‘మీరు’ ఆ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: ἐκ τοῦ θεοῦ
  choice: దేవుని నుండి వచ్చినవారు
  rationale: ఇక్కడ ἐκ మూలాన్ని లేదా దేవునితో కలిగిన సంబంధం నుండి ఉద్భవించే చెందినతనాన్ని సూచిస్తుంది. ఈ రూపం యోహాను వాడే వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τεκνία
  choice: చిన్నపిల్లలారా
  rationale: ఇది ప్రేమతో సంబోధించే లఘురూపం. ‘చిన్నపిల్లలారా’ కుటుంబసంబంధమైన ఆప్యాయతను, సంబోధనను రెండింటినీ కాపాడుతుంది.
- source_word: νενικήκατε
  choice: జయించారు
  rationale: గ్రీకు పరిపూర్ణ కాలం పూర్తయిన విజయంతో పాటు దాని కొనసాగుతున్న ఫలితాన్ని సూచిస్తుంది. తెలుగు భూతకాల రూపం సందర్భంలో ఆ సాధించిన విజయాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: αὐτούς
  choice: వారిని
  rationale: ఈ సర్వనామం ముందటి సందర్భంలోని అబద్ధ ప్రవక్తలు మరియు విరోధులను తిరిగి సూచిస్తుంది. ప్రధాన వాక్యంలో వారిని మరింత నిర్దిష్టంగా గుర్తించకుండా గ్రీకు అనుసంధానాన్ని నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: విశ్వాసులు వారిని జయించిన కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘ఎందుకంటే’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: μείζων
  choice: గొప్పవాడు
  rationale: మూలపదం కేవలం బలం కంటే విస్తృతమైన ఆధిక్యాన్ని సూచిస్తుంది. ‘బలవంతుడు’ అని సంకుచితం చేయకుండా ‘గొప్పవాడు’ పూర్తి తులనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: ὁ ἐν ὑμῖν
  choice: మీలో ఉన్నవాడు
  rationale: గ్రీకులో వ్యక్తి పేరు చెప్పకుండా వచ్చిన substantival expression‌ను తెలుగులో సహజంగా వ్యక్తిగత సూచనగా ఉంచుతుంది.
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: లోకంలో ఉన్నవాడు
  rationale: మునుపటి పదబంధంతో సమాంతరతను కాపాడుతూ, సూచిత వ్యక్తిని ప్రధాన వాక్యంలో స్పష్టంగా పేరుపెట్టి చెప్పదు.
- source_word: κόσμῳ
  choice: లోకం
  rationale: యోహాను రచనల్లో ఈ పదానికి దేవునికి విరోధమైన లోకం అనే భావ ఛాయ ఉన్నప్పటికీ, ప్రధాన అనువాదంలో విస్తృతమైన ప్రాథమిక అర్థమైన ‘లోకం’నే ఉంచడం సముచితం.
theological_decisions:
- issue: ‘మీలో ఉన్నవాడు’ మరియు ‘లోకంలో ఉన్నవాడు’ ఎవరనే గుర్తింపు
  choice: ప్రధాన వాక్యంలో ఇద్దరినీ పేరుపెట్టి గుర్తించకుండా మూలంలోని అంతర్లీన రూపాన్నే ఉంచాం.
  alternative: మొదటివాడిని దేవుడు లేదా ఆయన ఆత్మగా, రెండవవాడిని దుష్టుడు లేదా సాతానుగా స్పష్టంగా పేర్కొనడం.
  rationale: సందర్భం మొదటి వ్యక్తిని దేవుడు లేదా ఆయన ఆత్మగా, రెండవ వ్యక్తిని లోకం వెనుక పనిచేసే దుష్టునిగా సూచిస్తుంది. అయినా గ్రీకు వాక్యం పేర్లు చెప్పదు; అందువల్ల వేదాంతపరమైన భావాన్ని ప్రధాన వాక్యంలో విస్తరించకుండా మూలంలోని ఉద్వేగం మరియు సూచనాత్మకతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన మరియు ఆప్యాయమైన శైలి వాడాం. ‘చిన్నపిల్లలారా’ యోహాను సంబోధనలోని మృదుత్వాన్ని నిలుపుతుంది; రెండు అంతర్లీన వ్యక్తుల గుర్తింపును పాదసూచికలో మాత్రమే వివరించాం.
