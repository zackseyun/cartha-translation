revisions:
- from: మేము దేవుని నుండి వచ్చినవాళ్లం. దేవుణ్ణి ఎరిగినవాడు మా మాట వింటాడు; దేవుని నుండి రానివాడు మా మాట వినడు.[a] దీనిని బట్టి సత్యపు ఆత్మను[b][c], మోసపు ఆత్మను గుర్తిస్తాం.
  to: మేము దేవుని నుండి వచ్చినవారము. దేవుణ్ణి ఎరిగినవాడు మా మాట వింటాడు[a]; దేవుని నుండి రానివాడు మా మాట వినడు. దీని ద్వారా సత్యపు ఆత్మను[b][c], మోసపు ఆత్మను గుర్తిస్తాం.
  rationale: The revision strengthens the source-origin sense of ἐκ τοῦ θεοῦ in the opening statement, improves register, and relocates the receptive-hearing footnote anchor to the first relevant occurrence. It otherwise preserves the draft's accurate contrasts, its non-sectarian handling of ‘the Spirit of truth,’ and its natural rendering of the final discernment clause.
