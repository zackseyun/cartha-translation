id: 1JN.4.6
reference: 1 John 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: te
  text: మేము దేవుని నుండి వచ్చినవారము. దేవుణ్ణి ఎరిగినవాడు మా మాట వింటాడు[a]; దేవుని నుండి రానివాడు మా మాట వినడు. దీని ద్వారా సత్యపు ఆత్మను[b][c], మోసపు ఆత్మను గుర్తిస్తాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మా మాట ఆలకిస్తాడు … మా మాట ఆలకించడు’ అని కూడా అనువదించవచ్చు. గ్రీకు క్రియకు వినడం అనే అర్థం ఉంది; ఇక్కడ అపొస్తలుల సాక్ష్యాన్ని స్వీకరించి వినడం భావం ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సత్యానికి సంబంధించిన ఆత్మ’ అని సాధారణ అర్థంలో కూడా గ్రహించవచ్చు. అయితే యోహాను రచనల్లో ఈ పదబంధం సాధారణంగా పరిశుద్ధాత్మను సూచిస్తుంది.
    reason: alternative_reading
  - marker: c
    text: ‘సత్యపు ఆత్మ’ అనే మాట యోహాను 14:17; 15:26; 16:13లను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἐκ τοῦ θεοῦ
  choice: దేవుని నుండి వచ్చినవాళ్లం / దేవుని నుండి రానివాడు
  rationale: ἐκ అనే విభక్తి సూచించే మూలం లేదా ఉద్భవ భావాన్ని ‘నుండి’తో నిలిపి, యోహాను ఉద్దేశించిన రెండు వర్గాల మధ్య వ్యత్యాసాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది.
- source_word: ὁ γινώσκων τὸν θεὸν
  choice: దేవుణ్ణి ఎరిగినవాడు
  rationale: వర్తమానకాల కృదంతంలోని సాధారణ, లక్షణాత్మక భావాన్ని ‘ఎరిగినవాడు’ తెలియజేస్తుంది; ఇది కేవలం సమాచారం తెలుసుకోవడం కంటే సంబంధపూర్వకంగా ఎరుగడాన్ని కూడా అనుమతిస్తుంది.
- source_word: ἀκούει ἡμῶν
  choice: మా మాట వింటాడు
  rationale: గ్రీకు క్రియకు ‘వినడం’ అనే ప్రాథమిక అర్థం ఉన్నప్పటికీ, సందర్భంలో అపొస్తలుల సాక్ష్యాన్ని స్వీకరించి వినడం భావం ఉంది. ‘మా మాట వింటాడు’ సహజంగా ఉండి, ‘లోబడతాడు’ అని అతిగా అనువదించదు.
- source_word: ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: దేవుని నుండి రానివాడు
  rationale: సంబంధసర్వనామంలోని సాధారణ వర్గార్థాన్ని తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తూ, ἐκ సూచించే మూల భావాన్ని నిలిపింది.
- source_word: ἐκ τούτου
  choice: దీనిని బట్టి
  rationale: ముందు చెప్పిన ప్రమాణం ఆధారంగా గుర్తించడాన్ని సూచించే యోహాను శైలిలోని నిర్ధారణాత్మక పదబంధానికి ఇది సహజమైన తెలుగు రూపం.
- source_word: γινώσκομεν
  choice: గుర్తిస్తాం
  rationale: ఇక్కడ సందర్భం ఆత్మలను వివేచించి గుర్తించడమే కాబట్టి ‘గుర్తిస్తాం’ సహజంగా ఉంటుంది; అదే సమయంలో గ్రీకు γινώσκω యొక్క తెలుసుకొనే భావాన్ని నిలుపుతుంది.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: సత్యపు ఆత్మ
  rationale: గ్రీకు పదబంధంలోని సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది. తెలుగు లిపిలో పెద్ద అక్షర భేదం లేకపోవడం వల్ల ఇది పరిశుద్ధాత్మను సూచించే సాధ్యమైన వ్యక్తిగత అర్థాన్నీ, సాధారణ అర్థాన్నీ బలవంతంగా తేల్చదు.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: మోసపు ఆత్మ
  rationale: πλάνηలోని తప్పు, మోసం, తప్పుదారి పట్టించడం అనే భావాల్లో సందర్భానికి తగిన ‘మోసం’ను ఎంచుకుంది. ఇది ‘సత్యం’తో ఉన్న వ్యతిరేకతను స్పష్టంగా ఉంచి, మోసకరమైన ఆత్మీయ ప్రభావాన్ని కూడా సూచించగలదు.
theological_decisions:
- issue: τὸ πνεῦμα τῆς ἀληθείας పరిశుద్ధాత్మను వ్యక్తిగతంగా సూచిస్తుందా, లేక సత్యానికి సంబంధించిన ఆత్మను సాధారణంగా సూచిస్తుందా?
  choice: సత్యపు ఆత్మ
  alternative: సత్యానికి సంబంధించిన ఆత్మ
  rationale: 1 యోహాను 4:1–6లో ఆత్మలను పరీక్షించే సందర్భం, అలాగే యోహాను 14:17; 15:26; 16:13లోని వాడుక, పరిశుద్ధాత్మను సూచించే అర్థాన్ని బలపరుస్తాయి. అయితే గ్రీకు పదబంధం సాధారణ పఠనాన్నీ అనుమతిస్తుంది; తెలుగు పెద్ద అక్షర భేదం చూపదు కాబట్టి పాఠ్యంలో ఆ ఉద్రిక్తత సహజంగా నిలుస్తుంది, పాదటిప్పణి రెండు అవకాశాలను వివరిస్తుంది.
- issue: ἀκούει ἡμῶν సాధారణంగా శబ్దం వినడమా, లేక అపొస్తలుల సాక్ష్యాన్ని స్వీకరించి వినడమా?
  choice: మా మాట వింటాడు
  alternative: మా మాట ఆలకిస్తాడు
  rationale: సందర్భం నిజమైన, అబద్ధమైన ఆత్మలను అపొస్తలుల బోధకు వారి ప్రతిస్పందన ద్వారా గుర్తించడం గురించి ఉంది. ‘మా మాట వింటాడు’ వినడమూ స్వీకరించడమూ రెండింటినీ సహజంగా అనుమతిస్తుంది; ‘లోబడతాడు’ అనే మరింత బలమైన భావాన్ని చేర్చదు.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగును, గౌరవప్రదమైన వాక్యశైలిని ఉపయోగించాం. ‘వచ్చినవాళ్లం’ వంటి రూపం సాధారణ పాఠకులకు సులభంగా ఉండగా, ‘ఎరిగినవాడు’ బైబిలు సందర్భానికి తగిన సంబంధపూర్వక జ్ఞాన భావాన్ని నిలుపుతుంది. అన్ని పాదటిప్పణి గుర్తులు సంబంధిత ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
