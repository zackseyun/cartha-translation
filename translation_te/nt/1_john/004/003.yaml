id: 1JN.4.3
reference: 1 John 4:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ ⸀τὸν ⸀Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/003.yaml
  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
translation:
  language: te
  text: యేసును ఒప్పుకోని ప్రతి ఆత్మ దేవుని నుండి వచ్చినది కాదు.[a] ఇదే క్రీస్తువిరోధి ఆత్మ.[b] అది వస్తుందని మీరు విన్నారు; ఇప్పుడు అది ఇప్పటికే లోకంలో ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “యేసుక్రీస్తు శరీరంలో వచ్చాడని ఒప్పుకోని” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: అక్షరార్థంగా, “ఇది క్రీస్తువిరోధికి సంబంధించినది.” గ్రీకు వాక్యంలో ‘ఆత్మ’ అనే పదం మళ్లీ చెప్పకుండా వదిలివేయబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν πνεῦμα
  choice: ప్రతి ఆత్మ
  rationale: ఏకవచన నపుంసకరూపంతో ఉన్న πᾶν ఇక్కడ పంపిణీయ భావాన్ని ఇస్తుంది. సందర్భంలో పరిశీలించబడుతున్న ఆధ్యాత్మిక ప్రభావాలు లేదా ప్రకటనలను సూచిస్తుంది; పరిశుద్ధాత్మను కాదు.
- source_word: ὁμολογεῖ τὸν Ἰησοῦν
  choice: యేసును ఒప్పుకోని
  rationale: ὁμολογέωలోని బహిరంగ అంగీకారం, విధేయతతో కూడిన ఒప్పుకోలు అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఒప్పుకోని’ వ్యక్తపరుస్తుంది. ప్రధాన పాఠంలోని సంక్షిప్త రూపాన్నే అనుసరించాం.
- source_word: ἐκ τοῦ θεοῦ
  choice: దేవుని నుండి వచ్చినది
  rationale: ἐκ మూలాన్ని లేదా ఉద్భవాన్ని సూచిస్తుంది. తెలుగులో భావం స్పష్టంగా ఉండేందుకు ‘నుండి వచ్చినది’ అని అనువదించాం.
- source_word: τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου
  choice: ఇదే క్రీస్తువిరోధి ఆత్మ
  rationale: గ్రీకులో నామవాచకం మళ్లీ చెప్పకుండా వదిలివేయబడింది; ముందున్న πνεῦμα నుంచే ‘ఆత్మ’ అర్థమవుతుంది. తెలుగులో సహజత, స్పష్టత కోసం దాన్ని పూరించాం; మూలంలోని సంక్షిప్త నిర్మాణాన్ని పాదసూచికలో తెలిపాం.
- source_word: ἀντιχρίστου
  choice: క్రీస్తువిరోధి
  rationale: యోహాను రచనల్లో తెలిసిన క్రీస్తువిరోధి నిరీక్షణను సూచించే పదానికి స్పష్టమైన, స్థిరమైన తెలుగు సమాసాన్ని ఉపయోగించాం.
- source_word: ἀκηκόατε ὅτι ἔρχεται
  choice: అది వస్తుందని మీరు విన్నారు
  rationale: సంబంధ సర్వనామం నపుంసకరూపంలో ఉండి ముందున్న ఆత్మను లేదా క్రీస్తువిరోధికి సంబంధించిన దానిని సూచిస్తుంది. అందువల్ల వ్యక్తిని సూచించే ‘అతడు’ అని కాకుండా ‘అది’ అని ఉంచాం.
- source_word: ἐν τῷ κόσμῳ
  choice: లోకంలో
  rationale: యోహాను వాడుకలో κόσμοςకు సరిపోయే సహజమైన తెలుగు పదం.
- source_word: ἤδη
  choice: ఇప్పటికే
  rationale: ప్రస్తుతం దాని ఉనికి మొదలై ఉందనే బలాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నిరాకరించబడుతున్న ఒప్పుకోలు ఏ రూపంలో ఉంది?
  choice: ప్రధాన పాఠంలో SBLGNTలోని సంక్షిప్త పాఠం ‘యేసును ఒప్పుకోని’ అనుసరించబడింది.
  alternative: ‘యేసు క్రీస్తు శరీరధారిగా వచ్చాడని ఒప్పుకోని’ అనే విస్తృత పాఠాంతరం.
  rationale: విమర్శాత్మక గ్రీకు పాఠం సంక్షిప్త రూపానికి మద్దతిస్తుంది; ముందరి వచనం ఒప్పుకోలు యొక్క క్రీస్తుసంబంధ విషయాన్ని ఇప్పటికే వివరిస్తుంది. విస్తృత పాఠాన్ని ప్రధాన వచనంలో కలపకుండా పాదసూచికలో భద్రపరిచాం.
- issue: τὸ τοῦ ἀντιχρίστου అనే సంక్షిప్త నిర్మాణాన్ని ఎంత స్పష్టంగా చేయాలి?
  choice: ప్రధాన పాఠంలో సందర్భం సూచించే ‘ఆత్మ’ను పూరించి ‘క్రీస్తువిరోధి ఆత్మ’ అని అనువదించాం.
  alternative: ‘ఇది క్రీస్తువిరోధికి సంబంధించినది’ అని గ్రీకు సంక్షిప్తతను నేరుగా ప్రతిబింబించడం.
  rationale: ‘ఆత్మ’ ముందరి వాక్యభాగం నుంచి స్పష్టంగా సూచితమవుతుంది. దాన్ని పూరించడం తెలుగులో అసహజతను తొలగిస్తూ మూలభావాన్ని మార్చదు; గ్రీకు సంక్షిప్తతను పాదసూచికలో పేర్కొన్నాం.
- issue: వస్తున్నది వ్యక్తినా లేక ఆత్మనా?
  choice: నపుంసక సంబంధ సర్వనామానికి అనుగుణంగా ‘అది వస్తుందని’ అని ఉంచాం.
  alternative: ‘అతడు వస్తాడని’ అని క్రీస్తువిరోధి వ్యక్తిని ప్రత్యక్షంగా సూచించడం.
  rationale: గ్రీకు ὃ నపుంసకరూపం. ‘అతడు’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని వ్యక్తిగత సూచనను చేర్చినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఒప్పుకోని’ బహిరంగ విశ్వాస ప్రకటన భావాన్ని నిలుపుతుంది. ‘క్రీస్తువిరోధి’ సాధారణ పాఠకులకు అర్థమయ్యే స్థిరమైన పదం. మూలంలోని నపుంసక సూచనను ‘అది’ ద్వారా కాపాడాం.
