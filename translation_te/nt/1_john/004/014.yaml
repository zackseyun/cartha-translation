id: 1JN.4.14
reference: 1 John 4:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: te
  text: మేము చూశాము; తండ్రి తన కుమారుణ్ణి లోక రక్షకునిగా పంపాడని సాక్ష్యమిస్తున్నాము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “తండ్రి తన కుమారుణ్ణి, లోక రక్షకుణ్ణి, పంపాడు.”'
    reason: σωτῆρα τοῦ κόσμου అనే అనుబంధ కర్మపద నిర్మాణానికి మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని చూపడం.
lexical_decisions:
- source_word: καὶ ἡμεῖς
  choice: మేము
  rationale: స్పష్టంగా ఉన్న సర్వనామంలోని స్వల్ప ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది; ముందు సందర్భంతో అనుసంధానం తెలుగు వాక్యప్రవాహంలో అంతర్లీనంగా ఉంది.
- source_word: τεθεάμεθα
  choice: చూశాము
  rationale: పూర్తయిన దర్శనానికి కొనసాగుతున్న ప్రాముఖ్యత ఉందనే భావాన్ని సందర్భం మోస్తుంది; ‘చూశాము’ ఆధునిక తెలుగులో సహజంగా ఉండి ప్రత్యక్ష సాక్ష్య భావాన్ని నిలుపుతుంది.
- source_word: μαρτυροῦμεν
  choice: సాక్ష్యమిస్తున్నాము
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న సాక్ష్యకార్యాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: ఇది కారణాన్ని కాక సాక్ష్యంలోని విషయాన్ని పరిచయం చేస్తుంది.
- source_word: ὁ πατὴρ
  choice: తండ్రి
  rationale: యోహాను రచనల్లో దేవునికి సంబంధించిన సంబంధపూర్వక బిరుదును సహజంగా నిలుపుతుంది.
- source_word: ἀπέσταλκεν
  choice: పంపాడు
  rationale: గ్రీకు పరిపూర్ణ కాలంలోని పూర్తయిన పంపడం మరియు దాని కొనసాగుతున్న ప్రాముఖ్యతను తెలుగు సందర్భం సహజంగా తెలియజేస్తుంది; కృత్రిమమైన కాలరూపాన్ని నివారిస్తుంది.
- source_word: τὸν υἱὸν
  choice: తన కుమారుణ్ణి
  rationale: గ్రీకులో స్వామ్యసర్వనామం లేకపోయినా, ‘తండ్రి—కుమారుడు’ సంబంధం తెలుగులో స్పష్టంగా, సహజంగా వినిపించేందుకు ప్రతిబింబక స్వామ్యరూపం ఉపయోగించబడింది; ఇది కొత్త సంబంధాన్ని జోడించదు.
- source_word: σωτῆρα τοῦ κόσμου
  choice: లోక రక్షకునిగా
  rationale: అనుబంధ కర్మపద భావాన్ని సహజమైన తెలుగులో ‘గా’ రూపంతో తెలియజేస్తూ, σωτήρ యొక్క స్థిరమైన అర్థాన్ని మరియు κόσμος యొక్క విస్తృత పరిధిని నిలుపుతుంది.
theological_decisions:
- issue: ‘లోక రక్షకుడు’ అనే మాట సూచించే పరిధి
  choice: వాక్యంలోని విస్తృతమైన ‘లోక రక్షకుడు’ అనే వ్యక్తీకరణను యథాతథంగా నిలిపాం.
  alternative: దీనిని ఒక నిర్దిష్ట ప్రజావర్గానికి లేదా ప్రత్యేక ప్రాయశ్చిత్త సిద్ధాంతానికి పరిమితం చేయడం.
  rationale: గ్రీకు పాఠం σωτῆρα τοῦ κόσμου అని నేరుగా చెబుతుంది; అనువాదం ఆ పరిధిని సంకుచితం చేయకూడదు లేదా సిద్ధాంతపరంగా వివరించకూడదు.
- issue: తండ్రి–కుమారుడు సంబంధ భాష
  choice: ‘తండ్రి’ మరియు ‘తన కుమారుడు’ అనే సంబంధపూర్వక భాషను వాడాం.
  alternative: ‘తండ్రియైన దేవుడు యేసుక్రీస్తును పంపాడు’ అని విస్తరించడం.
  rationale: మూల వాక్యం వ్యక్తినామం లేదా ‘క్రీస్తు’ అనే బిరుదును ఉపయోగించకుండా సంబంధపూర్వక బిరుదులనే ఉపయోగిస్తుంది; ఆ రూపాన్ని నిలుపుకోవడం మూలానికి నిబద్ధం.
- issue: σωτῆρα యొక్క వాక్యనిర్మాణ సంబంధం
  choice: ‘లోక రక్షకునిగా పంపాడు’ అని ప్రధాన పాఠంలో ఇచ్చాం.
  alternative: ‘కుమారుణ్ణి—లోక రక్షకుణ్ణి—పంపాడు’ అనే మరింత అక్షరార్థ అనుబంధ నిర్మాణం.
  rationale: గ్రీకులో σωτῆρα అనుబంధ కర్మపదంగా ఉంది. ‘గా’ రూపం తెలుగులో సహజంగా ఆ పాత్రను వ్యక్తం చేస్తుంది; మరింత అక్షరార్థ నిర్మాణాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా నిర్మాణాత్మక సూక్ష్మతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘సాక్ష్యమిస్తున్నాము’ ద్వారా అధికారిక సాక్ష్య భావం నిలుపబడింది. సంధానకమైన καίను ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా, తెలుగు ప్రవాహంలో అర్థమయ్యేలా వాక్యాన్ని నిర్మించాం; రెండు క్రియలను అర్ధవిరామంతో అనుసంధానించాం.
