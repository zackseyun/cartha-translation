revisions:
- from: మీరు విశ్వాసంలో పునాది వేయబడినవారిగా, స్థిరంగా నిలిచి, మీరు విన్న సువార్త వల్ల కలిగిన నిరీక్షణ నుండి తొలగిపోకుండా నిజంగా కొనసాగితేనే. ఆ సువార్త ఆకాశం కింద ఉన్న సమస్త సృష్టిలో[a] ప్రకటించబడింది; దానికి పౌలునైన నేను సేవకుణ్ణి[b] అయ్యాను.
  to: మీరు నిజంగా విశ్వాసంలో కొనసాగుతూ, పునాది వేయబడినవారై స్థిరంగా ఉండి, మీరు విన్న సువార్త నిరీక్షణ నుండి దూరంగా కదిలించబడకుండా ఉంటే. ఆకాశం కింద ఉన్న సమస్త సృష్టిలో[a] ప్రకటించబడిన ఆ సువార్తకు పౌలునైన నేను సేవకుణ్ణి[b] అయ్యాను.
  rationale: The revision keeps the passage as a dependent conditional clause, as in the Greek and as appropriate for this verse excerpt. It renders εἴ γε with an emphasized but non-exclusive real condition; represents τεθεμελιωμένοι and ἑδραῖοι as settled states; restores the passive sense of μετακινούμενοι; and uses the less interpretively loaded 'సువార్త నిరీక్షణ' for the Greek genitive. The proclamation clause is recast so that 'ప్రకటించబడిన' clearly modifies 'సువార్త.'
