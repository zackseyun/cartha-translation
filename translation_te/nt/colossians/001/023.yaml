id: COL.1.23
reference: Colossians 1:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: te
  text: మీరు నిజంగా విశ్వాసంలో కొనసాగుతూ, పునాది వేయబడినవారై స్థిరంగా ఉండి, మీరు విన్న సువార్త నిరీక్షణ నుండి దూరంగా కదిలించబడకుండా ఉంటే. ఆకాశం కింద ఉన్న సమస్త సృష్టిలో[a] ప్రకటించబడిన ఆ సువార్తకు పౌలునైన నేను సేవకుణ్ణి[b] అయ్యాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆకాశం కింద ఉన్న ప్రతి ప్రాణికి.” గ్రీకు పదం κτίσις సందర్భాన్ని బట్టి “సృష్టి” లేదా “సృష్టించబడిన ప్రాణి” అని అర్థమివ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పరిచారకుణ్ణి.” గ్రీకు పదం διάκονος సందర్భాన్ని బట్టి “సేవకుడు” లేదా “పరిచారకుడు” అని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: నిజంగా కొనసాగితేనే
  rationale: షరతును స్పష్టంగా ఉంచుతూ γε ఇచ్చే ఉద్ఘాటనను ‘నిజంగా’ మరియు సహజమైన తెలుగు షరతు రూపం ‘-తేనే’ ద్వారా తెలియజేస్తుంది; దీనిని ‘ఎందుకంటే’ అనే నిశ్చయార్థంగా మార్చదు.
- source_word: ἐπιμένετε τῇ πίστει
  choice: మీరు విశ్వాసంలో ... కొనసాగితేనే
  rationale: వర్తమాన కాలంలోని నిరంతర కొనసాగింపును, విశ్వాసం అనే పరిధిలో నిలిచి ఉండడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: పునాది వేయబడినవారిగా, స్థిరంగా నిలిచి
  rationale: τεθεμελιωμένοι లోని పునాది రూపకాన్నీ, పూర్తయిన నిష్క్రియ క్రియ ఫలితంగా ఉన్న స్థితినీ కాపాడుతుంది; ἑδραῖοι యొక్క దృఢత్వాన్ని ‘స్థిరంగా’ తెలియజేస్తుంది.
- source_word: μὴ μετακινούμενοι
  choice: తొలగిపోకుండా
  rationale: ఒక స్థిర స్థానంనుండి కదిలించబడడం లేదా దూరమవడం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: సువార్త వల్ల కలిగిన నిరీక్షణ నుండి
  rationale: సువార్తతో సంబంధమున్న లేదా దాని ద్వారా కలిగే నిరీక్షణ అనే సంబంధాన్ని తెలుగులో స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: τοῦ κηρυχθέντος
  choice: ప్రకటించబడింది
  rationale: బహిరంగంగా ప్రకటించడం అనే భావాన్ని, నిష్క్రియ రూపాన్ని కాపాడుతుంది.
- source_word: ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: ఆకాశం కింద ఉన్న సమస్త సృష్టిలో
  rationale: ἐν యొక్క ‘లో’ భావాన్నీ, κτίσις యొక్క విస్తృత సృష్టి భావాన్నీ దగ్గరగా నిలుపుతుంది; ‘ప్రతి ప్రాణికి’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος
  choice: దానికి పౌలునైన నేను సేవకుణ్ణి అయ్యాను
  rationale: సంబంధ సర్వనామం సువార్తను సూచించేలా ఉంచి, διάκονος ను సంస్థాగత హోదాగా కాక సాధారణ సేవ భావంతో అనువదిస్తుంది.
theological_decisions:
- issue: εἴ γε యొక్క షరతు మరియు విశ్వాసంలో కొనసాగడం
  choice: నిజంగా కొనసాగితేనే
  alternative: మీరు విశ్వాసంలో కొనసాగుతున్నారు గనుక
  rationale: గ్రీకు వాక్యం నిజమైన షరతును ఉంచుతుంది. రక్షణను కోల్పోవడం లేదా తప్పక చివరివరకు నిలవడం గురించి ఏ సంప్రదాయ సిద్ధాంతాన్నీ వాక్యంలో చేర్చకుండా ఆ ఉద్రిక్తతను నిలుపుతుంది.
- issue: τῇ πίστει లో πίστις అర్థం
  choice: విశ్వాసం
  alternative: విశ్వసనీయత / నమ్మకం
  rationale: ఈ సందర్భంలో విశ్వాసుల విశ్వాసం లేదా వారు నిలిచే విశ్వాస పరిధి ప్రధాన భావం; ‘విశ్వసనీయత’ ఈ నిర్మాణంలో తక్కువ సాధ్యమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరమైన లేఖా శైలిని కాపాడుతూ అనువదించబడింది. గ్రీకు వాక్యం మునుపటి వాక్యానికి అనుసంధానమైన షరతు ఉపవాక్యం కావడంతో తెలుగు పాఠ్యంలో ‘కొనసాగితేనే’ అనే అసంపూర్ణ భావం ఉద్దేశపూర్వకంగా నిలుపబడింది. అందించిన ఆంగ్ల పాఠ్యంలో [a] ‘faith’ వద్ద, [b] ‘Paul’ వద్ద కనిపించినప్పటికీ వాటి పాదసూచిక విషయాలకు సరిపడే పదాలైన ‘సృష్టిలో’ మరియు ‘సేవకుణ్ణి’ వద్ద గుర్తులు ఉంచబడ్డాయి.
