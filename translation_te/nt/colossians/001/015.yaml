id: COL.1.15
reference: Colossians 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου, πρωτότοκος πάσης κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/015.yaml
  text: He is the image of the invisible God[a], the firstborn of all creation.
translation:
  language: te
  text: ఆయన అదృశ్యుడైన దేవుని ప్రతిరూపం; సమస్త సృష్టికి ప్రథమజనుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రథమజనుడు’ అనే పదం మొదట పుట్టినవాడు అనే భావంతో పాటు, హోదా మరియు వారసత్వంలో ప్రథమ స్థానంలో ఉన్నవాడు అనే భావాన్ని కూడా సూచించగలదు; తరువాతి 16–17 వచనాలు చూడండి.
    reason: πρωτότοκος అనే పదంలోని కాలక్రమ, హోదా సంబంధ భావసాధ్యతలను వెల్లడిస్తూ, ప్రధాన పాఠ్యంలో ఒకే వ్యాఖ్యానాన్ని బలవంతంగా స్థిరపరచకుండా ఉండేందుకు.
lexical_decisions:
- source_word: ὅς ἐστιν
  choice: ఆయన …
  rationale: ఈ సంబంధవాచక సర్వనామం ముందటి వచనంలోని కుమారుణ్ణి సూచిస్తుంది. తెలుగులో స్వతంత్ర వాక్యంగా సహజంగా ఉండేందుకు ‘ఆయన’ అని ఇచ్చి, ‘ఉన్నాడు’ అనే అనవసరమైన సంధాన క్రియను చేర్చలేదు.
- source_word: εἰκὼν
  choice: ప్రతిరూపం
  rationale: ‘ప్రతిరూపం’ అనే పదం పోలికను మాత్రమే కాక, కనిపించని దేవుణ్ణి వెల్లడించే ప్రత్యక్ష రూపం అనే భావాన్ని కూడా మితిమీరిన వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: అదృశ్యుడైన దేవుని
  rationale: ἀόρατος అంటే ‘కంటికి కనిపించని, అదృశ్యమైన’. వ్యక్తిని సూచించే తెలుగు వాడుకకు అనుగుణంగా ‘అదృశ్యుడైన’ అని అనువదించబడింది.
- source_word: πρωτότοκος
  choice: ప్రథమజనుడు
  rationale: ‘మొదట పుట్టినవాడు’ అనే కాలక్రమ భావానికే పరిమితం కాకుండా, బైబిలు నేపథ్యంలోని జ్యేష్ఠత్వం, హోదా, వారసత్వ భావాలను నిలుపగల పదం.
- source_word: πάσης κτίσεως
  choice: సమస్త సృష్టికి
  rationale: గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని నేరుగా, అయితే తెలుగులో సహజంగా తెలియజేస్తుంది. ‘సృష్టి అంతటిపై’ అని అనువదించి ఆధిపత్య భావాన్ని ప్రధాన పాఠ్యంలోనే నిర్ణయించకుండా మూలంలోని సంక్షిప్తతను, భావ ఉద్రిక్తతను నిలుపుతుంది.
theological_decisions:
- issue: πρωτότοκος πάσης κτίσεως అనే పదబంధంలో క్రీస్తుకు సృష్టితో ఉన్న సంబంధం
  choice: సమస్త సృష్టికి ప్రథమజనుడు
  alternative: సమస్త సృష్టిపై ప్రథమజనుడు / సమస్త సృష్టికంటే ముందున్నవాడు
  rationale: మూలంలోని షష్ఠీ సంబంధం ఆధిపత్యం, ప్రాధాన్యం లేదా సంబంధాన్ని సూచించవచ్చు; ‘పై’ అని చేర్చడం ఒక వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో స్థిరపరుస్తుంది. ‘ప్రథమజనుడు’ పదం కాలక్రమాన్నే తప్పనిసరిగా సూచించదు; హోదా, వారసత్వం కూడా సూచించగలదు. అందువల్ల మూలంలోని భావసాంద్రతను ప్రధాన పాఠ్యంలో ఉంచి, వెంట వచ్చే 16–17 వచనాల సందర్భాన్ని పాఠకుడు పరిగణించేందుకు పాదసూచికలో సంక్షిప్త వివరణ ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘ప్రతిరూపం’, ‘ప్రథమజనుడు’ వంటి పదాలు సాధారణ పాఠకుడికి గ్రహించగలిగేంత స్పష్టంగా ఉండి, మూలంలోని క్రీస్తుశాస్త్ర సంబంధ భావసాంద్రతను కాపాడుతాయి. సెమీకోలన్ రెండు సమాంతర వర్ణనలను స్పష్టంగా కలుపుతుంది.
