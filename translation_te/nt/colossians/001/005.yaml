id: COL.1.5
reference: Colossians 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τὴν ἐλπίδα τὴν ἀποκειμένην ὑμῖν ἐν τοῖς οὐρανοῖς, ἣν προηκούσατε ἐν τῷ λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/005.yaml
  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: te
  text: పరలోకాల్లో[a] మీ కోసం భద్రపరచబడిన నిరీక్షణను బట్టి; ఆ నిరీక్షణ గురించి మీరు సత్యవాక్యంలో[c]—అంటే సువార్తలో—ఇంతకుముందే[b] విన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరలోకంలో.’ గ్రీకులో ‘పరలోకాలు’ అని బహువచనం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మీరు ముందుగానే విన్నారు’ లేదా ‘మీరు ఇంతకుముందు విన్నారు.’
    reason: lexical_alternative
  - marker: c
    text: ‘సత్యవాక్యం’ను ‘సత్యసందేశం’ అని కూడా అనువదించవచ్చు. ‘సువార్త’ అనే పదం ఆ వాక్యం లేదా సందేశం ఏమిటో గుర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: నిరీక్షణను బట్టి
  rationale: διά + ద్వితీయా విభక్తి ఇక్కడ కారణాన్ని లేదా ఆధారాన్ని సూచిస్తుంది. ‘నిరీక్షణను బట్టి’ అనే రూపం ముందరి వాక్యంతో ఉన్న భావసంబంధాన్ని నిలుపుతుంది.
- source_word: ἀποκειμένην
  choice: భద్రపరచబడిన
  rationale: ἀπόκειμαι దాచివుంచడం లేదా భవిష్యత్తు కోసం నిల్వచేయడం అనే భావాన్ని ఇస్తుంది. ‘భద్రపరచబడిన’ అనేది ఆ సిద్ధంగా ఉంచబడిన స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: ὑμῖν
  choice: మీ కోసం
  rationale: ఈ దత్తివిభక్తి వారికి ప్రయోజనంగా లేదా వారి కొరకు ఉంచబడిందనే భావాన్ని సూచిస్తుంది.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: పరలోకాల్లో
  rationale: గ్రీకులో బహువచనం ఉంది. ‘పరలోకాల్లో’ దానిని నిలుపుతూ సందర్భానుకూలమైన తెలుగు రూపాన్ని ఇస్తుంది.
- source_word: ἣν
  choice: ఆ నిరీక్షణ గురించి
  rationale: స్త్రీలింగ ఏకవచన సంబంధసర్వనామం నేరుగా ἐλπίδα అనే ‘నిరీక్షణ’ను సూచిస్తుంది. తెలుగులో ‘నిరీక్షణను విన్నారు’ కంటే ‘ఆ నిరీక్షణ గురించి విన్నారు’ సహజం.
- source_word: προηκούσατε
  choice: మీరు ఇంతకుముందే విన్నారు
  rationale: προ- ఉపసర్గ ముందుగా లేదా ఇంతకుముందు వినడాన్ని సూచిస్తుంది; ఈ అనువాదం కాలపూర్వత్వాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: సత్యవాక్యంలో
  rationale: λόγος ఇక్కడ ‘వాక్యం’ లేదా ‘సందేశం’ కావచ్చు. ‘సత్యవాక్యం’ మూలంలోని నిర్మాణాన్ని నిలుపుతుంది; వెంట వచ్చే ‘సువార్త’ దాని భావాన్ని గుర్తిస్తుంది.
- source_word: τοῦ εὐαγγελίου
  choice: అంటే సువార్తలో
  rationale: τοῦ εὐαγγελίου ముందున్న ‘సత్యవాక్యం’ను వివరిస్తున్న సమానాధికార పదబంధంగా గ్రహించబడింది. ‘అంటే’ ఈ సంబంధాన్ని తెలుగులో స్పష్టంగా చేస్తుంది.
theological_decisions:
- issue: సంబంధ వాక్యానికి పూర్వపదం
  choice: ‘ఆ నిరీక్షణ గురించి’ అని, సంబంధ వాక్యాన్ని ‘నిరీక్షణ’కే అనుసంధానించడం
  alternative: సంబంధ వాక్యాన్ని మొత్తం సువార్త సందేశానికి విస్తృతంగా అనుసంధానించడం
  rationale: ἣν స్త్రీలింగ ఏకవచనంలో ఉండి ἐλπίδαతో నేరుగా ఏకీభవిస్తుంది; అందువల్ల కొలొస్సయులు ముందుగా విన్నది ఈ నిరీక్షణ గురించేనన్న వాక్యనిర్మాణాన్ని నిలిపాము.
- issue: οὐρανοῖς యొక్క వచనం
  choice: బహువచనంగా ‘పరలోకాల్లో’
  alternative: ఏకవచనంగా ‘పరలోకంలో’
  rationale: మూల గ్రీకు బహువచనాన్ని అనవసరంగా ఏకవచన సంప్రదాయ రూపానికి మార్చకుండా నిలిపాము.
- issue: ‘సత్యవాక్యం’ మరియు ‘సువార్త’ మధ్య సంబంధం
  choice: ‘అంటే’ ద్వారా సువార్తను సత్యవాక్యాన్ని గుర్తించే సమానాధికార వివరణగా చూపడం
  alternative: ‘సువార్త యొక్క సత్యవాక్యం’ అని స్వామ్య లేదా విశేషణ సంబంధంగా చూపడం
  rationale: గ్రీకు పదబంధంలో τοῦ εὐαγγελίου ముందున్న λόγῳ τῆς ἀληθείαςను గుర్తించే సమానాధికార షష్ఠీగా సహజంగా అర్థమవుతుంది; అయినా ‘వాక్యం/సందేశం’ అనే పదార్థ వైవిధ్యాన్ని పాదసూచికలో ఉంచాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాము. ఈ వచనం ముందరి వాక్యానికి కారణాన్ని తెలిపే భాగంగా మొదలవుతుంది కాబట్టి ‘నిరీక్షణను బట్టి’ అనే అసంపూర్ణంగా కనిపించే అనుసంధానాన్ని ఉద్దేశపూర్వకంగా నిలిపాము. దీర్ఘ నిర్మాణాన్ని పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించినా, ‘ఆ నిరీక్షణ’ అనే పునరుక్తి ద్వారా గ్రీకు సంబంధాన్ని స్పష్టంగా కాపాడాము.
