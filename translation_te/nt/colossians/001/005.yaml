  terminology: ‘నిరీక్షణ,’ ‘భద్రపరచబడిన,’ ‘పరలోకాల్లో,’ ‘సత్యవాక్యం,’ and ‘సువార్త’ are suitable modern-standard Telugu biblical terms. The explanatory ‘అంటే’ appropriately signals apposition without imposing an interpretive theological claim.
