  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: te
  text: మీ కోసం దేవుడు నాకు అప్పగించిన నిర్వహణ బాధ్యత ప్రకారం, దేవుని వాక్యాన్ని నెరవేర్చడానికి[a] ఆ సంఘానికి నేను సేవకుడనయ్యాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని వాక్యాన్ని సంపూర్ణంగా తెలియజేయడానికి”; లేదా, “దేవుని వాక్యాన్ని పూర్తి చేయడానికి.”
    reason: πληρῶσαι అనే క్రియకు ఈ సందర్భంలో ఉండగల ప్రత్యామ్నాయ భావాలను కాపాడటానికి.
lexical_decisions:
- source_word: ἧς
  choice: ఆ సంఘానికి
  rationale: స్త్రీలింగ ఏకవచన సంబంధ సర్వనామం ముందున్న ἐκκλησία (‘సంఘం’)ను సూచిస్తుంది. తెలుగు వాక్యంలో సంబంధాన్ని సహజంగా స్పష్టం చేయడానికి ‘ఆ సంఘానికి’ అని అనువదించాం.
- source_word: ἐγενόμην ἐγὼ διάκονος
  choice: నేను సేవకుణ్ణి అయ్యాను
  rationale: γίνομαι ఒక పాత్రలోకి రావడాన్ని సూచిస్తుంది; διάκονος ఇక్కడ సంఘపదవికన్నా సేవ చేసే వ్యక్తిని సూచిస్తుంది. అందువల్ల ‘సేవకుణ్ణి అయ్యాను’ సహజంగా, తటస్థంగా ఉంది.
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι
  choice: దేవుడు నాకు అప్పగించిన నిర్వహణ బాధ్యత ప్రకారం
  rationale: οἰκονομία అప్పగించబడిన నిర్వహణ లేదా బాధ్యత భావాన్ని కలిగి ఉంది. ‘నిర్వహణ బాధ్యత’ ఆ రూపకాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంటుంది; దేవుడే దానిని అప్పగించినవాడని వాక్యనిర్మాణం స్పష్టం చేస్తుంది.
- source_word: εἰς ὑμᾶς
  choice: మీ కోసం
  rationale: పౌలుకు అప్పగించబడిన బాధ్యత కొలొస్సయుల మేలు కోసం ఉందనే లబ్ధిదారు భావాన్ని తెలియజేస్తుంది.
- source_word: πληρῶσαι
  choice: నెరవేర్చడానికి
  rationale: πληρόωలో నెరవేర్చడం, పూర్తి చేయడం, సంపూర్ణంగా ప్రకటించడం అనే భావ ఛాయలు ఉండవచ్చు. ‘నెరవేర్చడానికి’ ఉద్దేశాన్ని తెలియజేస్తూ అర్థాన్ని అతిగా సంకుచితం చేయదు.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యాన్ని
  rationale: λόγος ఇక్కడ దేవుని ప్రకటిత సందేశాన్ని సూచిస్తుంది. ‘దేవుని వాక్యం’ తెలుగు బైబిలు భాషలో సహజమైనది, అంతర్గ్రంథ ప్రతిధ్వనులను కూడా కాపాడుతుంది.
theological_decisions:
- issue: πληρῶσαι τὸν λόγον τοῦ θεοῦ అనే పదబంధపు భావం
  choice: దేవుని వాక్యాన్ని నెరవేర్చడానికి
  alternative: దేవుని వాక్యాన్ని సంపూర్ణంగా తెలియజేయడానికి; దేవుని వాక్యాన్ని పూర్తి చేయడానికి
  rationale: ఈ పదబంధం దేవుని వాక్యాన్ని సంపూర్ణంగా ప్రకటించడం, దానికి పూర్తి వ్యక్తీకరణ ఇవ్వడం, లేదా అప్పగించబడిన వాక్యసేవను నెరవేర్చడం అని అర్థం కావచ్చు. ప్రధాన పాఠం ఈ భావపరిధిని పూర్తిగా ఒకే వివరణకు పరిమితం చేయదు; ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. వచనం ముందరి వాక్యానికి వ్యాకరణపరంగా అనుసంధానమైనప్పటికీ, స్వతంత్రంగా చదివినప్పుడు సూచన స్పష్టంగా ఉండేందుకు ἧς‌ను ‘ఆ సంఘానికి’ అని విప్పి చెప్పాం.
