- from: ఆ సంఘానికి నేను సేవకుణ్ణి అయ్యాను. మీ కోసం దేవుడు నాకు అప్పగించిన నిర్వహణ బాధ్యత ప్రకారం, దేవుని వాక్యాన్ని నెరవేర్చడానికి[a] నేను సేవకుణ్ణి అయ్యాను.
  to: మీ కోసం దేవుడు నాకు అప్పగించిన నిర్వహణ బాధ్యత ప్రకారం, దేవుని వాక్యాన్ని నెరవేర్చడానికి[a] ఆ సంఘానికి నేను సేవకుడనయ్యాను.
