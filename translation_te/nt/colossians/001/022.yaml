source:
  edition: SBLGNT
  text: νυνὶ δὲ ⸀ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: te
  text: కానీ ఇప్పుడు, ఆయన మాంసదేహంలో మరణం ద్వారా, మీరు సమాధానపరచబడ్డారు[a]—మిమ్మల్ని ఆయన ఎదుట పవిత్రులుగా, మచ్చలేనివారిగా[b], నిందారోపణకు తావులేనివారిగా నిలబెట్టడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన తన మాంసదేహంలో మరణం ద్వారా మిమ్మల్ని సమాధానపరిచాడు.” గ్రీకు క్రియ కర్మణి రూపంలో ఉంది.
    reason: alternative_reading
  - marker: b
    text: “మచ్చలేనివారు” అనే పదం బలికి అర్పించే దానిలో లోపం లేదా కళంకం లేకపోవడాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: కానీ ఇప్పుడు
  rationale: 21వ వచనంలోని మునుపటి స్థితికి, ఇప్పటి సమాధాన స్థితికి మధ్య ఉన్న వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀποκατηλλάγητε
  choice: ఆయన ... మిమ్మల్ని సమాధానపరిచాడు
  rationale: రూపం కర్తరి కాని ప్రయోగంలో ఉన్నప్పటికీ, సందర్భంలో సూచితమైన దైవిక కర్తను తెలుగులో స్పష్టంగా చెప్పడం సహజంగా ఉంటుంది; పూర్తయిన సమాధాన కార్యాన్ని తెలియజేస్తుంది. మూలంలోని కర్మణి రూపం పాదసూచికలో నిలుపబడింది.
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: తన మాంసదేహంలో
  rationale: సార్క్స్‌ను పాపస్వభావంగా కాక నిజమైన భౌతిక మాంసంగా గ్రహిస్తూ, క్రీస్తు దేహధారణ మరియు వాస్తవ మరణంపై ఉన్న నొక్కును సంక్షిప్తంగా నిలుపుతుంది.
- source_word: διὰ τοῦ θανάτου
  choice: మరణం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలియజేసే సాధనార్థాన్ని సూటిగా వ్యక్తం చేస్తుంది; ‘ఆయన మరణం’ అని మూలంలో లేని సర్వనామాన్ని చేర్చదు.
- source_word: παραστῆσαι
  choice: నిలబెట్టడానికి
  rationale: ‘ఎదుట నిలబెట్టడం/సమర్పించడం’ అనే భావాన్ని తరువాతి κατενώπιον αὐτοῦతో సహజమైన తెలుగులో కలిపి, ఉద్దేశార్థాన్ని నిలుపుతుంది.
- source_word: ἁγίους
  choice: పవిత్రులుగా
  rationale: ప్రతిష్ఠితత్వం మరియు నైతిక పవిత్రత రెండింటినీ మోయగల స్థిరమైన తెలుగు పదం.
- source_word: ἀμώμους
  choice: మచ్చలేనివారుగా
  rationale: నైతిక నిర్దోషిత్వంతో పాటు బలి సంబంధమైన ‘లోపం/మచ్చ లేని’ ఛాయను కూడా ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: ἀνεγκλήτους
  choice: నిందారోపణకు తావులేనివారుగా
  rationale: ఆరోపణ చేయడానికి ఆధారం లేని న్యాయసంబంధ ఛాయను, సాధారణ పాఠకునికి అర్థమయ్యే తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατενώπιον αὐτοῦ
  choice: తన ఎదుట
  rationale: ‘ఆయన సన్నిధిలో/ఆయన ఎదుట’ అనే మూలార్థాన్ని సహజంగా ఇస్తుంది; సర్వనామపు సూచిత వ్యక్తి విషయంలో మూలంలోని సందర్భాధారిత స్వభావాన్ని యథాశక్తి నిలుపుతుంది.
theological_decisions:
- issue: ἀποκατηλλάγητε లోని కర్మణి ప్రయోగం మరియు కర్త
  choice: ప్రధాన పాఠ్యంలో ‘ఆయన ... మిమ్మల్ని సమాధానపరిచాడు’; పాదసూచికలో ‘మీరు సమాధానపరచబడ్డారు’
  alternative: ‘కానీ ఇప్పుడు మీరు ... సమాధానపరచబడ్డారు’
  rationale: గ్రీకు క్రియ కర్మణి రూపంలో ఉండి కర్తను వ్యాకరణపరంగా పేర్కొనదు. సందర్భంలోని దైవిక కార్యాన్ని తెలుగులో సహజంగా చెప్పేందుకు ప్రధాన పాఠ్యంలో కర్తను స్పష్టం చేసినా, మూలంలోని నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో భద్రపరచాం.
- issue: σάρξ యొక్క భావం
  choice: భౌతిక భావంలో ‘మాంసం’, సంయుక్తంగా ‘మాంసదేహం’
  alternative: ‘పాపస్వభావం’
  rationale: మరణం సంభవించిన నిజమైన శరీరాన్ని ఈ పదబంధం సూచిస్తుంది. ఇక్కడ ‘పాపస్వభావం’ అని అనువదించడం సందర్భానికి అతీతమైన వేదాంతార్థాన్ని దిగుమతి చేస్తుంది.
- issue: ἀμώμους మరియు ἀνεγκλήτους మధ్య భావభేదం
  choice: ‘మచ్చలేనివారుగా’ మరియు ‘నిందారోపణకు తావులేనివారుగా’
  alternative: ‘నిర్దోషులుగా’ మరియు ‘నిందలేనివారుగా’
  rationale: మొదటి పదంలోని బలి సంబంధమైన లోపరాహిత్య ఛాయను, రెండవ పదంలోని ఆరోపణ/న్యాయ ఛాయను ఒకే భావంగా కలిపివేయకుండా వేరు చేస్తుంది.
- issue: κατενώπιον αὐτοῦ లో αὐτοῦ సూచించే వ్యక్తి
  choice: ‘తన ఎదుట’ అని సందర్భానుసార ప్రతిఫల సర్వనామంతో అనువదించడం
  alternative: ‘దేవుని ఎదుట’ లేదా ‘క్రీస్తు ఎదుట’ అని స్పష్టీకరించడం
  rationale: మూలం సర్వనామాన్నే ఉపయోగిస్తుంది. నిర్దిష్ట నామాన్ని చేర్చడం ద్వారా సాధ్యమైన సూచనను అనవసరంగా తేల్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే గంభీరమైన లేఖన శైలి నిలుపబడింది. ‘మాంసదేహం’ దేహధారణ యొక్క భౌతిక వాస్తవికతను చూపుతుంది; ‘నిందారోపణకు తావులేని’ న్యాయసంబంధ భావాన్ని స్పష్టంగా ఉంచుతుంది. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
