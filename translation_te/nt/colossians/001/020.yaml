id: COL.1.20
reference: Colossians 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: te
  text: మరియు ఆయన ద్వారా సమస్తాన్ని తనతో సమాధానపరచుకోవాలని—ఆయన సిలువ రక్తం ద్వారా శాంతిని కలిగించి—ఆయన ద్వారా,[a][d] భూమిమీద ఉన్నవైనా, ఆకాశాల్లో ఉన్నవైనా.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రెండు చోట్ల ఉన్న ‘ఆయన ద్వారా’కు ‘ఆయన చేత’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సమస్తం’ అనే మాటను గ్రీకు పాఠం వలెనే విస్తృతంగా ఉంచాం. తరువాత వచ్చే ‘భూమిమీద ఉన్నవైనా, ఆకాశాల్లో ఉన్నవైనా’ అనే మాటలు కూడా దాని విస్తృతిని చూపుతాయి. ఈ సమాధానపరచడం అంతిమ రక్షణతో ఎలా సంబంధించిందో ఈ వచనం స్వయంగా నిర్దేశించదు.
    reason: alternative_reading
  - marker: c
    text: గ్రీకులో ‘ఆకాశాలు’ బహువచనంలో ఉంది.
    reason: lexical_alternative
  - marker: d
    text: కొన్ని ప్రాచీన ప్రతుల్లో రెండవ ‘ఆయన ద్వారా’ లేదు.
    reason: textual_variant
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: ఆయన ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనాన్ని లేదా ప్రతినిధిత్వాన్ని సూచిస్తుంది. ‘ఆయన ద్వారా’ మధ్యవర్తిత్వ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀποκαταλλάξαι
  choice: సమాధానపరచుకోవాలని
  rationale: ఈ క్రియ తెగిపోయిన సంబంధాన్ని తిరిగి సమాధాన స్థితికి తేవడాన్ని సూచిస్తుంది. ఉపసర్గలోని బలాన్ని ‘పూర్తిగా’ అని అదనంగా విస్తరించకుండా సాధారణమైన ‘సమాధానపరచు’తో తెలిపాం.
- source_word: τὰ πάντα
  choice: సమస్తాన్ని
  rationale: నపుంసక బహువచన సమగ్ర వ్యక్తీకరణ యొక్క విస్తృతిని నిలుపుతుంది; దానిని కేవలం ప్రజలకు లేదా రక్షణ పొందినవారికి పరిమితం చేయదు.
- source_word: εἰς αὐτόν
  choice: తనతో
  rationale: ముందటి వాక్యంలోని అంతర్లీన కర్త దేవుడు కావడంతో ప్రతిఫల సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. ‘తనవైపుకు’ అనే గమనార్థాన్ని కంటే సంబంధ పునరుద్ధరణ సందర్భానికి ‘తనతో’ సరిపోతుంది.
- source_word: εἰρηνοποιήσας
  choice: శాంతిని కలిగించి
  rationale: ఏఒరిస్ట్ కృదంతం సమాధానపరచే కార్యానికి సాధనాత్మకంగా లేదా పూర్వకార్యంగా ఉన్న శాంతి స్థాపనను తెలియజేస్తుంది.
- source_word: διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ
  choice: ఆయన సిలువ రక్తం ద్వారా
  rationale: ‘రక్తం’ మరియు ‘సిలువ’ అనే రెండు స్పష్టమైన మూలపదాలను నిలిపి, సాధనార్థక διάను ‘ద్వారా’తో తెలిపాం.
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: ఆయన ద్వారానే
  rationale: పునరుక్తి యొక్క ఉద్ఘాటనను ‘ఏ’తో సహజంగా వ్యక్తం చేశాం; పాఠభేదాన్ని పాదటీపులో సూచించాం.
- source_word: εἴτε ... εἴτε
  choice: ఉన్నవైనా ... ఉన్నవైనా
  rationale: గ్రీకు సహసంబంధ నిర్మాణాన్ని తెలుగులో సహజమైన ‘అయినా ... అయినా’ జతతో నిలుపుతుంది.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: భూమిమీద ఉన్నవి
  rationale: ఆకాశాలతో ఉన్న విశ్వవ్యాప్త వ్యత్యాసానికి అనుగుణంగా γῆను ‘భూమి’గా అనువదించాం.
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: ఆకాశాల్లో ఉన్నవి
  rationale: οὐρανοῖς బహువచనాన్ని తెలుగులోనూ ‘ఆకాశాల్లో’ అని నిలిపాం.
theological_decisions:
- issue: τὰ πάνταలో సమాధానపరచడం యొక్క పరిధి
  choice: ‘సమస్తాన్ని’ అని విస్తృతంగానే ఉంచడం
  alternative: ప్రజలందరిని; సమస్త జీవులు అంతిమంగా రక్షించబడతారని స్పష్టీకరించడం
  rationale: భూమిమీద మరియు ఆకాశాల్లో ఉన్నవన్నీ అనే తరువాతి జత విశ్వవ్యాప్త పరిధిని సూచిస్తుంది. అయితే ఈ వచనం ఆ సమాధానపరచడం అంతిమ వ్యక్తిగత రక్షణతో ఎలా సంబంధించిందో వివరించదు; అనువాదం ఆ ఉద్రిక్తతను నిలుపుతుంది.
- issue: εἰς αὐτόνలోని సూచన
  choice: దేవుడు సమస్తాన్ని తనతో సమాధానపరచుకోవడం
  alternative: మెస్సీయ సమస్తాన్ని తనతో సమాధానపరచుకోవడం
  rationale: 19వ వచనం నుంచి కొనసాగుతున్న వాక్యనిర్మాణంలో అంతర్లీన కర్త దేవుడని గ్రహించడం అత్యంత సంభావ్యం. అయినా ‘తనతో’ అనే రూపం వాక్య ప్రవాహాన్ని సహజంగా ఉంచుతుంది.
- issue: ‘ఆయన సిలువ రక్తం’ యొక్క భావం
  choice: రక్తం మరియు సిలువ అనే మూర్తమైన భాషను యథాతథంగా నిలుపడం
  alternative: సిలువపై ఆయన మరణం
  rationale: గ్రీకు పాఠం ‘రక్తం’, ‘సిలువ’ రెండింటినీ స్పష్టంగా పేర్కొంటుంది. వాటిని నిలుపడం బలియర్పణ మరియు చారిత్రక సిలువమరణ భావాలను కాపాడుతుంది; ఏ ప్రత్యేక ప్రాయశ్చిత్త సిద్ధాంతాన్నీ అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సమాధానపరచు’, ‘సిలువ రక్తం’, ‘ఆకాశాలు’ వంటి బైబిలు భావపదాలను నిలిపి, అసహజమైన పదానువాదాన్ని నివారించాం. గ్రీకు వాక్యంలోని పునరుక్త ఉద్ఘాటనను డాష్‌లు మరియు ‘ద్వారానే’తో తెలిపాం.
