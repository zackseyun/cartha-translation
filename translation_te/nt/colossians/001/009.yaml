id: COL.1.9
reference: Colossians 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: te
  text: ఈ కారణంగా, మేము కూడా విన్న రోజు నుంచీ మీ కోసం ప్రార్థిస్తూ, సమస్త ఆధ్యాత్మికమైన వివేకంతోను అవగాహనతోను ఆయన చిత్తాన్ని గురించిన జ్ఞానంతో[a] మీరు నింపబడాలని అడగడం మానలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పూర్తి జ్ఞానం.’ గ్రీకు పదం మరింత సంపూర్ణమైన లేదా లోతైన జ్ఞానం అనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ఈ కారణంగా
  rationale: ముందటి వచనాల్లో చెప్పిన కొలొస్సయుల విశ్వాసం, ప్రేమ గురించిన వార్తకు ఇది కారణాత్మకంగా అనుసంధానమవుతుంది.
- source_word: καὶ ἡμεῖς
  choice: మేము కూడా
  rationale: మాట్లాడుతున్న పౌలు, అతని సహచరులను కూడా స్పందనలో చేర్చే καί బలాన్ని నిలుపుతుంది.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: విన్న రోజు నుంచీ
  rationale: వారి నిరంతర ప్రార్థన మొదలైన కాలబిందువును సహజమైన తెలుగులో తెలియజేస్తుంది; గ్రీకులో స్పష్టంగా లేని కర్మను అనవసరంగా చేర్చదు.
- source_word: οὐ παυόμεθα
  choice: మానలేదు
  rationale: గతంలో మొదలై ఇప్పటికీ కొనసాగుతున్న ప్రార్థనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπὲρ ὑμῶν
  choice: మీ కోసం
  rationale: ప్రార్థన వారి మేలు కోసం చేయబడుతోందనే భావాన్ని సరళంగా తెలియజేస్తుంది.
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: ప్రార్థించడం ... వేడుకోవడం
  rationale: సాధారణ ప్రార్థనను, దానిలోని నిర్దిష్ట విన్నపాన్ని సూచించే రెండు వేరు క్రియల భావాన్ని నిలుపుతుంది.
- source_word: ἵνα πληρωθῆτε
  choice: మీరు నింపబడాలని
  rationale: కర్మణి రూపాన్ని నిలుపుతూ, నింపే కర్త దేవుడనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో అదనంగా స్పష్టం చేయదు.
- source_word: τὴν ἐπίγνωσιν
  choice: ఎరుకతో
  rationale: సాధారణ పాఠకుడికి అర్థమయ్యేలా తెలుసుకోవడం అనే భావాన్ని ఇస్తూ, σοφίαకు వాడిన ‘జ్ఞానం’తో పదపునరుక్తిని నివారిస్తుంది; లోతైన లేదా సంపూర్ణమైన జ్ఞానం అనే సాధ్యమైన తీవ్రతను పాదసూచికలో ఉంచుతుంది.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: ఆయన చిత్తాన్ని గురించిన
  rationale: జ్ఞానానికి సంబంధించిన విషయవస్తువు దేవుని చిత్తమని నేరుగా తెలియజేస్తుంది.
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: ఆత్మసంబంధమైన సమస్త జ్ఞానం, అవగాహనతో
  rationale: ἐν యొక్క పరిధి లేదా సహవర్తి విధాన భావాన్ని ‘తో’ ద్వారా సహజంగా అందిస్తుంది; πνευματικῇ అనే విశేషణం జ్ఞానం, అవగాహన రెండింటినీ విశేషించేలా ఉంచుతుంది.
- source_word: σοφίᾳ
  choice: జ్ఞానం
  rationale: ఆచరణాత్మకమైన, దేవునికి సంబంధించిన వివేకజ్ఞానాన్ని సూచించే ప్రామాణిక తెలుగు పదం.
- source_word: συνέσει
  choice: అవగాహన
  rationale: విషయాల మధ్య సంబంధాలను గ్రహించే సామర్థ్యాన్ని స్పష్టంగా తెలియజేస్తూ ‘జ్ఞానం’తో సహజమైన జోడీగా పనిచేస్తుంది.
theological_decisions:
- issue: ἐπίγνωσις పదంలోని తీవ్రత
  choice: ఎరుక
  alternative: పూర్తి జ్ఞానం / లోతైన ఎరుక
  rationale: ఈ పదం మరింత సంపూర్ణమైన లేదా లోతైన జ్ఞానాన్ని సూచించవచ్చు; అయితే ఆ తీవ్రతను ప్రధాన పాఠ్యంలో తప్పనిసరి చేయకుండా, సాధ్యమైన భావంగా పాదసూచికలో నిలుపుతున్నాం.
- issue: πνευματικῇ ఎవరిని లేదా దేనిని సూచిస్తుంది
  choice: ఆత్మసంబంధమైన
  alternative: ఆత్మ ఇచ్చే / పరిశుద్ధాత్మ ప్రసాదించే
  rationale: గ్రీకు విశేషణం ఆధ్యాత్మిక స్వభావాన్ని గానీ పరిశుద్ధాత్మ మూలాన్ని గానీ సూచించవచ్చు. ప్రధాన పాఠ్యం ఈ రెండింటిలో ఒకదాన్ని నిర్బంధంగా నిర్ణయించకుండా అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం వాడబడింది. ‘చిత్తం’ వంటి సుపరిచిత బైబిలు పదాన్ని నిలుపుతూ, ‘అవగాహన’, ‘ఎరుక’ వంటి సాధారణ పాఠకులకు అందుబాటులో ఉన్న పదాలను ఎంచుకున్నాం. మూలంలోని దీర్ఘ ప్రార్థనా వాక్య ప్రవాహాన్ని సాధ్యమైనంతవరకు కాపాడాం.
