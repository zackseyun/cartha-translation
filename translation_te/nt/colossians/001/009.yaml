- from: ఈ కారణంగా, మేము కూడా విన్న రోజు నుంచీ మీ కోసం ప్రార్థించడం, ఆత్మసంబంధమైన[b] సమస్త జ్ఞానం, అవగాహనతో ఆయన చిత్తాన్ని గురించిన ఎరుకతో[a] మీరు నింపబడాలని వేడుకోవడం మానలేదు.
  to: ఈ కారణంగా, మేము కూడా విన్న రోజు నుంచీ మీ కోసం ప్రార్థిస్తూ, సమస్త ఆధ్యాత్మికమైన వివేకంతోను అవగాహనతోను ఆయన చిత్తాన్ని గురించిన జ్ఞానంతో[a] మీరు నింపబడాలని అడగడం మానలేదు.
  rationale: The revision distinguishes ‘జ్ఞానం’ (ἐπίγνωσις), ‘వివేకం’ (σοφία), and ‘అవగాహన’ (σύνεσις), and it reorders the Telugu so that the requested filling with knowledge of God’s will is clear. The principal text retains πνευματικῇ as an open adjective, and the footnote continues to note its possible Spirit-related sense.
