    text: లేదా, ‘పూర్తి జ్ఞానం.’ గ్రీకు పదం మరింత సంపూర్ణమైన లేదా లోతైన జ్ఞానం అనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆధ్యాత్మికమైన’ అంటే ఆధ్యాత్మిక స్వభావం కలిగినది అని గానీ, దేవుని ఆత్మ ఇచ్చినది అని గానీ అర్థం కావచ్చు.
