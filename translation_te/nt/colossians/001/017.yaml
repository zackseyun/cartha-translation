translation:
  language: te
  text: ఆయన అన్నిటికంటే ముందే ఉన్నాడు[a]; సమస్తమూ ఆయనలోనే కలిసి నిలిచి ఉంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అన్నిటికంటే ముందు’ అనే మాట అన్నిటిపై ఆయనకున్న ఆధిక్యాన్ని కూడా సూచించవచ్చు; అయితే గ్రీకు పదాలు ప్రధానంగా పూర్వత్వాన్ని వ్యక్తం చేస్తాయి.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘సమస్తమూ ఆయనలోనే నిలిచి ఉంది’ లేదా ‘సమస్తమూ ఆయనలోనే ఏకబద్ధంగా ఉంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: ఆయన
  rationale: మూలంలో సర్వనామానికి ఉన్న ప్రాధాన్యాన్ని తెలుగు వాక్యారంభంలోని ‘ఆయన’ సహజంగా తెలియజేస్తుంది; ‘ఆయనే’ అని పెంచడం అవసరానికి మించిన నిర్దిష్టతను కలిగించవచ్చు.
- source_word: πρὸ πάντων
  choice: అన్నిటికంటే ముందే
  rationale: πρό + షష్ఠీ విభక్తి ఇక్కడ ప్రధానంగా కాలపరమైన పూర్వత్వాన్ని సూచిస్తుంది. ‘ముందే’ అనే రూపం క్రీస్తు సమస్తానికి పూర్వమే ఉన్నాడనే భావాన్ని సహజ తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: τὰ πάντα
  choice: సమస్తం
  rationale: ఈ నపుంసక బహువచన సమగ్ర పదబంధం సృష్టిలోని సమస్తాన్ని విస్తృతంగా సూచిస్తుంది. తెలుగు ఏకవచన సమాహార రూపమైన ‘సమస్తం’ ఆ సమగ్రతను సహజంగా నిలుపుతుంది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలోనే
  rationale: ἐν యొక్క ‘లో’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, ‘నే’ మూలంలోని సంబంధానికి తగిన కేంద్రీకరణను ఇస్తుంది; ‘ఆయన చేత’ లేదా ‘ఆయన ద్వారా’ అని సాధనార్థానికి పరిమితం చేయదు.
- source_word: συνέστηκεν
  choice: కలిసివుంది
  rationale: పరిపూర్ణ కాలరూపం గతంలో ఏర్పడి ప్రస్తుతం కొనసాగుతున్న స్థితిని సూచిస్తుంది. ‘కలిసివుంది’ సమస్తం ఆయనలో ఏకబద్ధంగా, నిలకడగా ఉందనే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: πρὸ πάντωνలో క్రీస్తుకు సృష్టితో ఉన్న సంబంధం
  choice: కాలపరమైన పూర్వత్వం—‘అన్నిటికంటే ముందే ఉన్నాడు’
  alternative: స్థానపరమైన ఆధిక్యం—‘అన్నిటికంటే పైగా ఉన్నాడు’
  rationale: గ్రీకు పదబంధం ప్రధానంగా పూర్వత్వాన్ని వ్యక్తం చేస్తుంది. సందర్భంలో ఆధిక్య భావం ఉండగలిగినా, ప్రధాన పాఠం దానిని మాత్రమే అని నిర్ధారించకుండా కాలపరమైన భావాన్ని నిలుపుతుంది.
- issue: συνέστηκεν యొక్క భావబలం
  choice: సమస్తం ఏకబద్ధంగా కొనసాగడం—‘కలిసివుంది’
  alternative: ‘ఆయనలో సమస్తం నిలిచివుంది’ లేదా ‘సమస్తం ఆయనలో అస్తిత్వం కలిగివుంది’
  rationale: ఈ క్రియ సృష్టి క్రమబద్ధంగా, సమగ్రంగా కొనసాగుతున్న ప్రస్తుత స్థితిని సూచిస్తుంది. తెలుగు పాఠం సులభంగా ఉండేలా చేస్తూనే, అస్తిత్వ నిర్మాణం లేదా నిరంతర సంధారణ అనే ఒక్క వ్యాఖ్యానానికే భావాన్ని కట్టిపడేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఉన్నాడు’ వ్యక్తిగత అస్తిత్వాన్ని, ‘కలిసివుంది’ సమాహారమైన ‘సమస్తం’ యొక్క కొనసాగుతున్న ఏకబద్ధ స్థితిని సహజంగా వ్యక్తం చేస్తాయి.
