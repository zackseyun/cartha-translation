revisions:
- from: ఒకప్పుడు దేవునికి దూరమై, మీ మనసులో శత్రువులుగా ఉంటూ చెడు కార్యాల్లో జీవించిన మిమ్మల్ని కూడా—[a]
  to: ఒకప్పుడు పరాయివారై, మీ మనస్సులో శత్రువులుగా ఉండి, చెడు కార్యాలలో నిమగ్నమైన మిమ్మల్ని కూడా—[a]
  rationale: The revision removes the unstated complement ‘దేవునికి’ and replaces ‘జీవించిన’ with ‘నిమగ్నమైన,’ which is natural Telugu while avoiding an added durative assertion. The footnote preserves a closer, compact alternative and notes the syntactic ambiguity of ἐν τοῖς ἔργοις τοῖς πονηροῖς without resolving it doctrinally or causally.
