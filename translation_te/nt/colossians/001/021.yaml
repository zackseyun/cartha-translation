  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὑμᾶς ποτε ὄντας ἀπηλλοτριωμένους καὶ ἐχθροὺς τῇ διανοίᾳ ἐν τοῖς ἔργοις τοῖς πονηροῖς—
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/021.yaml
  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: te
  text: ఒకప్పుడు పరాయివారై, మీ మనస్సులో శత్రువులుగా ఉండి, చెడు కార్యాలలో నిమగ్నమైన మిమ్మల్ని కూడా—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఒకప్పుడు పరాయివారై, మనస్సులో శత్రువులుగా, చెడు కార్యాలలో ఉన్న మిమ్మల్ని కూడా—”. గ్రీకు వాక్యం సంక్షిప్తంగా ఉంది; చెడు కార్యాలకు మనస్సులోని శత్రుత్వంతో ఉన్న కచ్చితమైన సంబంధాన్ని అది స్పష్టంగా నిర్ధారించదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: మిమ్మల్ని కూడా
  rationale: ముందటి వాక్యంతో అనుసంధానాన్ని, క్రీస్తు సమాధాన కార్యంలో పాఠకులు కూడా చేర్చబడుతున్నారనే భావాన్ని నిలుపుతుంది. గ్రీకు విభక్తిని అనుసరించి కర్మరూపాన్ని ఉంచింది.
- source_word: ποτε
  choice: ఒకప్పుడు
  rationale: వారి గత స్థితిని సూచించే సహజమైన ఆధునిక తెలుగు కాలవ్యక్తీకరణ.
- source_word: ὄντας
  choice: ఉంటూ
  rationale: గ్రీకు వర్తమాన కృదంతపు వివరణాత్మక బలాన్ని తెలుగు వాక్యప్రవాహంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπηλλοτριωμένους
  choice: దేవునికి దూరమై
  rationale: పరాయీకరణ లేదా సంబంధవిచ్ఛేద స్థితిని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; సందర్భం దేవునితో సమాధానపడటాన్ని గూర్చినందున సంబంధాన్ని తెలుపుతుంది.
- source_word: ἐχθροὺς
  choice: శత్రువులుగా
  rationale: గ్రీకులోని నామవాచక బలాన్ని నిలుపుతూ, కేవలం ‘విరోధభావం గలవారు’ అని మెత్తబరచకుండా అనువదిస్తుంది.
- source_word: τῇ διανοίᾳ
  choice: మీ మనసులో
  rationale: దత్తివిభక్తి సూచించే రంగాన్ని లేదా పరంగా ఉన్న స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: చెడు కార్యాల్లో జీవించిన
  rationale: ἐν యొక్క రంగం లేదా ఆచరణలో వ్యక్తీకరణ అనే భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; కచ్చితమైన సంబంధం అస్పష్టంగా ఉన్నందున పాదటిప్పణిలో మరింత అక్షరార్థ రూపం ఇచ్చింది.
- source_word: ἔργοις
  choice: కార్యాలు
  rationale: నైతిక ప్రవర్తనను సూచించే గౌరవప్రదమైన, సాధారణ తెలుగు పదం.
- source_word: πονηροῖς
  choice: చెడు
  rationale: నైతిక దుష్టత్వాన్ని నేరుగా, అతిశయించకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: మనసులోని శత్రుత్వానికి చెడు కార్యాలతో ఉన్న సంబంధం
  choice: అంతర్గత శత్రుత్వం చెడు కార్యాలతో కూడిన జీవనంలో వ్యక్తమైనట్లు అనువదించబడింది.
  alternative: ‘మీ మనసులో శత్రువులుగా, చెడు కార్యాల్లో ఉన్న’
  rationale: ἐν τοῖς ἔργοις τοῖς πονηροῖς కారణం, రంగం, లేదా వ్యక్తీకరణను సూచించవచ్చు. ప్రధాన పాఠ్యం సహజమైన తెలుగు ఇస్తుంది; పాదటిప్పణి గ్రీకు సంక్షిప్తతను, అస్పష్టతను సంరక్షిస్తుంది.
- issue: ఎవరికి దూరమయ్యారు అనే అంతర్భావిత సంబంధం
  choice: ‘దేవునికి దూరమై’
  alternative: ‘పరాయివారై’ లేదా ‘దూరమై’
  rationale: ముందు-తరువాతి సందర్భంలో సమాధానం దేవునితో సంబంధించింది. అయినా గ్రీకులో ‘దేవునికి’ ప్రత్యక్షంగా లేదని పాదటిప్పణిలో తెలియజేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ఈ వచనం తరువాతి వచనంలో పూర్తయ్యే అసంపూర్ణ వాక్యభాగం కావడంతో చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది; పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంది.
