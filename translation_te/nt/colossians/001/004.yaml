id: COL.1.4
reference: Colossians 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσαντες τὴν πίστιν ὑμῶν ἐν Χριστῷ Ἰησοῦ καὶ τὴν ἀγάπην ⸂ἣν ἔχετε⸃ εἰς πάντας τοὺς ἁγίους
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/004.yaml
  text: having heard of your faith in Messiah Jesus and the love that you have for all the saints,[a]
translation:
  language: te
  text: మెస్సీయ యేసుపై మీకున్న విశ్వాసం[a] గురించి, పరిశుద్ధులందరి పట్ల మీకున్న ప్రేమ గురించి విని,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మెస్సీయ యేసుపై మీకున్న నమ్మకం’ లేదా ‘మెస్సీయ యేసుపట్ల మీ విశ్వసనీయత.’ గ్రీకు నామవాచకం పిస్టిస్ సందర్భాన్ని బట్టి ఈ పరస్పర సంబంధిత అర్థాలను ఇవ్వగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες
  choice: విని
  rationale: ఇది ముందటి వాక్యంలోని కర్తతోను కృతజ్ఞత చెప్పడమనే ప్రధాన క్రియతోను అనుసంధానమైన భూతకాల క్రియావిశేషణ రూపం. ‘విని’ ఆ సంబంధాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πίστιν
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో మెస్సీయ అయిన యేసుతో పాఠకుల సంబంధాన్ని సూచించడానికి ‘విశ్వాసం’ సహజమైన ప్రధాన అర్థం. ‘నమ్మకం,’ ‘విశ్వసనీయత’ అనే సంబంధిత అర్థసాధ్యతలను పాదసూచికలో ఉంచాం.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ అయిన యేసులో
  rationale: ἐν యొక్క సంబంధాత్మక-స్థానార్థక భావాన్ని ‘లో’ నిలుపుతుంది. Χριστόςను పేరులా లిప్యంతరీకరించకుండా బిరుదుగా ‘మెస్సీయ’ అని అనువదించి, సహజమైన తెలుగుకోసం ‘అయిన’ చేర్చాం.
- source_word: ἀγάπην
  choice: ప్రేమ
  rationale: ἀγάπηకి స్పష్టమైన, సాధారణ, సందర్భోచిత తెలుగు సమానార్థకం.
- source_word: ἣν ἔχετε
  choice: మీకున్న
  rationale: సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజంగా విశేషణ రూపంలో వ్యక్తం చేస్తూ, ఆ ప్రేమ పాఠకుల్లో ప్రస్తుతం ఉందనే భావాన్ని నిలుపుతుంది.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: పరిశుద్ధులందరిపట్ల
  rationale: ప్రేమ ఎవరిని ఉద్దేశించిందో εἰς తెలియజేస్తుంది; తెలుగులో ‘పట్ల’ సహజం. ἅγιοι అనే పౌలు వాడే సంబోధనను ‘పరిశుద్ధులు’గా నిలుపుతుంది.
theological_decisions:
- issue: Χριστῷ అనే పదాన్ని బిరుదుగా అనువదించాలా, పేరులా లిప్యంతరీకరించాలా
  choice: మెస్సీయ అయిన యేసు
  alternative: క్రీస్తు యేసు
  rationale: Χριστός ఇక్కడ Ἰησοῦ అనే వ్యక్తినామంతో కలిసి బిరుదుగా పనిచేస్తుంది. అందువల్ల దాని బిరుదు భావాన్ని ‘మెస్సీయ’గా స్పష్టంగా అనువదించాం.
- issue: πίστις పదంలోని అర్థవిస్తృతి
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ἐν Χριστῷ Ἰησοῦ అనే నిర్మాణంలో యేసుతో పాఠకుల విశ్వాస సంబంధమే సందర్భానికి బాగా సరిపోతుంది. అయితే గ్రీకు పదం ‘నమ్మకం’ లేదా ‘విశ్వసనీయత’ భావాలను కూడా మోయగలదు కాబట్టి ఆ ఉద్రిక్తతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఇది ముందటి వచనంలోని ప్రధాన వాక్యంపై ఆధారపడే క్రియావిశేషణ భాగమని చూపేందుకు చివర కామా ఉంచబడింది. ‘మెస్సీయ అయిన యేసు’ బిరుదు భావాన్ని స్పష్టంగా చేస్తుంది; ‘పరిశుద్ధులు’ పౌలు వాడే కీలక సమూహపదాన్ని నిలుపుతుంది.
