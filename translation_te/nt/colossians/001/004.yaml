review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the aorist participle ἀκούσαντες (‘విని’), the two reported objects, the present relative clause (‘మీకున్న’), and the comprehensive scope ‘all the saints.’ ‘మెస్సీయ’ appropriately translates Χριστός as a title. For Telugu idiom, however, ‘యేసులో ... విశ్వాసం’ is liable to sound spatial or less natural; ‘మెస్సీయ యేసుపై ... విశ్వాసం’ clearly conveys the intended relational sense in this context without adding doctrinal interpretation.
  naturalness: The participial ending and final comma appropriately retain the verse’s dependence on the preceding main clause. Replacing ‘గురించీ’ with the neutral standard ‘గురించి,’ spacing ‘పరిశుద్ధులందరి పట్ల,’ and using the compact appositional title ‘మెస్సీయ యేసు’ make the line more natural in modern standard Telugu.
  terminology: ‘విశ్వాసం,’ ‘ప్రేమ,’ and ‘పరిశుద్ధులు’ are suitable established renderings. The footnote should render the Greek term in Telugu script rather than leaving ‘pistis’ in Latin letters. ‘విశ్వసనీయత’ is retained only as a possible contextual sense, as in the audit trail.
  issues:
  - severity: medium
    issue: ‘మెస్సీయ అయిన యేసులో మీకున్న విశ్వాసం’ is syntactically possible but semantically awkward in modern Telugu.
    rationale: With ‘విశ్వాసం,’ ‘లో’ may be read more spatially than relationally. ‘మెస్సీయ యేసుపై మీకున్న విశ్వాసం’ is the normal Telugu construction for faith directed to/centered on Jesus and best communicates the Greek phrase in context.
  - severity: low
    issue: The footnote uses the Latin-script form ‘pistis.’
    rationale: A Telugu footnote reads more consistently and accessibly with ‘పిస్టిస్’ (or an equivalent Telugu transliteration).
  revised_text: మెస్సీయ యేసుపై మీకున్న విశ్వాసం[a] గురించి, పరిశుద్ధులందరి పట్ల మీకున్న ప్రేమ గురించి విని,
