- from: మెస్సీయ అయిన యేసులో మీకున్న విశ్వాసం[a] గురించీ, పరిశుద్ధులందరిపట్ల మీకున్న ప్రేమ గురించీ విని,
  to: మెస్సీయ యేసుపై మీకున్న విశ్వాసం[a] గురించి, పరిశుద్ధులందరి పట్ల మీకున్న ప్రేమ గురించి విని,
  rationale: The revision keeps every source element and the sentence-fragment linkage to Colossians 1:3, while using idiomatic modern Telugu for the faith relationship and regularizing the footnote’s script and phrasing.
