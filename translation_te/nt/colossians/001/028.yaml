id: COL.1.28
reference: Colossians 1:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: te
  text: ఆయననే మేము ప్రకటిస్తున్నాం; సకల జ్ఞానంతో ప్రతి వ్యక్తిని హెచ్చరిస్తూ, ప్రతి వ్యక్తికి బోధిస్తూ, ప్రతి వ్యక్తిని క్రీస్తులో పరిణతి చెందిన వ్యక్తిగా సమర్పించాలని ఇలా చేస్తున్నాం.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: ప్రకటిస్తున్నాం
  rationale: బహిరంగంగా తెలియజేయడం లేదా ప్రకటించడం అనే క్రియ యొక్క సహజమైన అర్థాన్ని ఇస్తుంది.
- source_word: νουθετοῦντες
  choice: హెచ్చరిస్తూ
  rationale: మనస్సులో ఉంచేలా బుద్ధిచెప్పడం, తప్పుదారి గురించి హెచ్చరించడం అనే భావాన్ని సందర్భానుగుణంగా సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: సంపూర్ణ జ్ఞానంతో
  rationale: πάσῃ యొక్క సమగ్రతను నిలుపుతూ, బోధన మరియు హెచ్చరిక జ్ఞానంతో జరిగే విధానాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: παραστήσωμεν
  choice: దేవుని ఎదుట నిలబెట్టాలని
  rationale: ఒకరి ఎదుట సమర్పించడం లేదా నిలబెట్టడం అనే భావం ఉంది; సందర్భంలో అంతర్లీనంగా ఉన్న దేవుని సన్నిధిని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: τέλειον
  choice: పరిణతి చెందినవారిగా
  rationale: ఇక్కడ పాపరహిత పరిపూర్ణతకన్నా ఆధ్యాత్మికంగా సంపూర్ణంగా ఎదిగిన స్థితి ప్రధాన భావం.
- source_word: ἐν Χριστῷ
  choice: క్రీస్తులో
  rationale: క్రీస్తుతో ఐక్యత లేదా ఆయన పరిధిలో ఉండడాన్ని సూచించే పౌలు వాడుకను అస్పష్టతతో సహా నిలుపుతుంది.
theological_decisions:
- issue: τέλειον అనే పదం పరిపూర్ణతనా, పరిణతినా
  choice: పరిణతి చెందినవారిగా
  alternative: పరిపూర్ణులుగా
  rationale: ఈ సందర్భంలో విశ్వాసుల ఆధ్యాత్మిక పరిపక్వతను సూచించడం సహజం; ‘పరిపూర్ణులు’ అనడం పాపరహిత స్థితి అనే అనవసర నిర్ణయాన్ని కలిగించవచ్చు.
- issue: παραστήσωμεν యొక్క పరోక్ష కర్మ
  choice: దేవుని ఎదుట అని స్పష్టం చేయడం
  alternative: సమర్పించాలని / నిలబెట్టాలని మాత్రమే అనువదించడం
  rationale: కొలస్సయులకు 1 అధ్యాయంలోని న్యాయస్థాన సంబంధిత సందర్భం దేవుని సన్నిధిని సూచిస్తుంది; అయినా గ్రీకు పాఠ్యంలో ‘దేవుని’ అనే పదం ప్రత్యక్షంగా లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘ప్రతి వ్యక్తి’ అనే మూడు పునరావృతాలను మూలపాఠంలోని ఉద్ఘాటన కోసం నిలిపాం.
