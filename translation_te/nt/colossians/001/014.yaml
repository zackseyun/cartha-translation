lexical_decisions:
- source_word: ἐν ᾧ
  choice: ఆయనలో
  rationale: పుంలింగ ఏకవచన సర్వనామం ముందున్న ప్రియ కుమారుణ్ణి సూచిస్తుంది. ‘ఆయనలో’ అనేది వ్యక్తిగతమైన, సంబంధపూర్వకమైన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἔχομεν
  choice: మనకు ... ఉంది
  rationale: వర్తమాన కాలంలోని ‘కలిగి ఉన్నాము’ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా, ప్రస్తుత స్వాధీనతగా వ్యక్తపరుస్తుంది.
- source_word: ἀπολύτρωσιν
  choice: విమోచన
  rationale: విడుదల అనే మూలభావంతోపాటు పౌలు వాడుకలోని విమోచనాత్మక ప్రాధాన్యాన్ని కూడా నిలుపుతుంది.
- source_word: ἄφεσιν
  choice: క్షమాపణ
  rationale: పాపాల సందర్భంలో ἄφεσις‌కు స్పష్టమైన ఆధునిక తెలుగు సమానం; ఇక్కడ ఇది ‘విమోచన’ను మరింత నిర్దిష్టంగా వివరిస్తుంది.
- source_word: τῶν ἁμαρτιῶν
  choice: పాపక్షమాపణ
  rationale: ‘పాపాల క్షమాపణ’ అనే భావాన్ని సహజమైన తెలుగు సమాసరూపంలో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘విమోచన’కు ‘పాపక్షమాపణ’కు మధ్య సంబంధం
  choice: ‘విమోచన, అంటే పాపక్షమాపణ’ అని సమానాధికార సంబంధాన్ని స్పష్టంగా చూపించడం.
