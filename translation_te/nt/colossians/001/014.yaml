  rationale: గ్రీకులో రెండవ నామవాచక పదబంధం మొదటిదానికి సమానాధికారంగా ఉంది. తెలుగులో కేవలం కామాతో ఉంచితే జాబితాగా అపార్థమయ్యే అవకాశం ఉన్నందున ‘అంటే’ ఆ వ్యాకరణ సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది; విమోచన యొక్క అన్ని కోణాలను దీనికే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘ఆయనలో’ ద్వారా క్రీస్తుతో సంబంధాన్ని, ‘విమోచన’ ద్వారా పదంలోని ధార్మిక బరువును నిలుపుకుంది. పాదసూచిక గుర్తు ప్రధాన వచనంలో చేర్చబడింది.
