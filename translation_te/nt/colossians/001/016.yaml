id: COL.1.16
reference: Colossians 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: te
  text: ఎందుకంటే ఆయనలో సమస్తం సృష్టించబడింది—ఆకాశాల్లోనివీ భూమిమీదివీ, కనిపించేవీ కనిపించనివీ, సింహాసనాలైనా ఆధిపత్యాలైనా పాలకులైనా అధికారాలైనా; సమస్తం ఆయన ద్వారానూ ఆయన కోసమూ సృష్టించబడి ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆయన కోసమూ’ అన్న మాటకు ‘ఆయనను లక్ష్యంగా చేసుకొని’ అని కూడా అర్థం చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో కుమారుని గురించి చెప్పిన మాటకు ఇది కారణాన్ని తెలియజేస్తుంది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలోనే
  rationale: తరువాతి δι’ αὐτοῦ (‘ఆయన ద్వారా’)తో ఉన్న భేదాన్ని కాపాడుతూ ἐν అనే పూర్వప్రత్యయాన్ని సాధ్యమైనంత నేరుగా అనువదిస్తుంది; ‘నే’ సమస్త సృష్టి ఆయనలోనే జరిగిందనే ఉద్ఘాటనను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὰ πάντα
  choice: సమస్తం
  rationale: సృష్టించబడిన వాటన్నిటినీ సమగ్రంగా సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: ఆకాశాల్లో ఉన్నవీ
  rationale: గ్రీకులోని బహువచనాన్ని నిలుపుతూ, తరువాతి ‘భూమిమీద ఉన్నవీ’తో సహజంగా జతచేస్తుంది.
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: కనిపించేవీ కనిపించనివీ
  rationale: నామవాచకాలుగా పనిచేసే విశేషణాలను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: θρόνοι
  choice: సింహాసనాలు
  rationale: అధికార స్థానాలు లేదా శ్రేణులను సూచించే మూల రూపకాన్ని వ్యాఖ్యానించి పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: κυριότητες
  choice: ఆధిపత్యాలు
  rationale: ప్రభుత్వం లేదా ఏలుబడి గల శక్తుల భావాన్ని తెలుపుతుంది; వాటి స్వభావాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἀρχαὶ
  choice: పాలకులు
  rationale: పరిపాలించే శక్తులు లేదా అధిపతులు అనే భావాన్ని ఆధునిక పాఠకునికి సులభంగా అందిస్తుంది.
- source_word: ἐξουσίαι
  choice: అధికారాలు
  rationale: అధికారం కలిగిన శక్తుల భావాన్ని నేరుగా తెలుపుతూ ἀρχαί నుండి పదభేదాన్ని కాపాడుతుంది.
- source_word: δι’ αὐτοῦ καὶ εἰς αὐτόν
  choice: ఆయన ద్వారానూ ఆయన కోసమూ
  rationale: సృష్టిలో కుమారుని మధ్యవర్తిత్వాన్నీ, సృష్టి ఆయననే లక్ష్యంగా కలిగి ఉండటాన్నీ వేర్వేరుగా నిలుపుతుంది.
- source_word: ἔκτισται
  choice: సృష్టించబడి ఉంది
  rationale: పరిపూర్ణ కాలపు రూపం సృష్టి జరిగిపోయినదనీ దాని ఫలితం కొనసాగుతున్నదనీ సూచించేలా తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐν αὐτῷ / δι’ αὐτοῦ / εἰς αὐτόν అనే మూడు పదబంధాల్లో కుమారునికి సృష్టితో ఉన్న సంబంధం
  choice: ‘ఆయనలోనే … ఆయన ద్వారానూ … ఆయన కోసమూ’ అనే భిన్న రూపాలను నిలిపాం.
  alternative: మూడింటినీ ‘ఆయన చేత’ లేదా ‘ఆయన ద్వారా’ అని ఒకే సాధనార్థక భావంగా చేయడం.
  rationale: గ్రీకు వాక్యం ఉద్దేశపూర్వకంగా మూడు వేర్వేరు పూర్వప్రత్యయాలను వాడుతుంది. వాటిని ఒకే భావంగా కుదించకుండా సృష్టికి కుమారుడు సందర్భం/పరిధి, మధ్యవర్తి, లక్ష్యం అనే బహుస్థాయి సంబంధాన్ని నిలుపడం సముచితం.
- issue: ‘సింహాసనాలు, ఆధిపత్యాలు, పాలకులు, అధికారాలు’ అనే వర్గాల స్వభావం
  choice: వాటిని సృష్టించబడిన అధికార శ్రేణులుగా మాత్రమే అనువదించి, అవి దేవదూతలవో ఆత్మీయ శక్తులవో మానవ పాలనా వ్యవస్థలవో నిర్దిష్టం చేయలేదు.
  alternative: వాటిని స్పష్టంగా దేవదూతల శ్రేణులు లేదా మానవ రాజకీయ అధికారాలుగా పేర్కొనడం.
  rationale: ఈ వచనం వాటి ఉనికి మరియు సృష్టికి లోబడిన స్థితిని చెబుతుంది గాని, వాటి స్వభావాన్ని ఇక్కడ ఖచ్చితంగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. ‘ఆకాశాలు’ అనే గ్రీకు బహువచనాన్ని నిలిపాం. జాబితాలోని అధికార పదాలను సాంకేతిక దేవదూతల శ్రేణులుగా వ్యాఖ్యానించకుండా ఉంచాం. ప్రధాన వాక్యంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
