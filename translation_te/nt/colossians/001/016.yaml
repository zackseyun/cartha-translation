revisions:
- from: ఎందుకంటే ఆయనలోనే సమస్తం సృష్టించబడింది—ఆకాశాల్లో ఉన్నవీ భూమిమీద ఉన్నవీ, కనిపించేవీ కనిపించనివీ, అవి సింహాసనాలైనా ఆధిపత్యాలైనా పాలకులైనా అధికారాలైనా సరే; సమస్తం ఆయన ద్వారానూ ఆయన కోసమూ సృష్టించబడి ఉంది.[a]
  to: ఎందుకంటే ఆయనలో సమస్తం సృష్టించబడింది—ఆకాశాల్లోనివీ భూమిమీదివీ, కనిపించేవీ కనిపించనివీ, సింహాసనాలైనా ఆధిపత్యాలైనా పాలకులైనా అధికారాలైనా; సమస్తం ఆయన ద్వారానూ ఆయన కోసమూ సృష్టించబడి ఉంది.[a]
