source:
  edition: SBLGNT
  text: ⸀περιπατῆσαι ἀξίως τοῦ κυρίου εἰς πᾶσαν ἀρεσκείαν ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες καὶ αὐξανόμενοι ⸂τῇ ἐπιγνώσει⸃ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/010.yaml
  text: so as to walk worthily of the Lord[a], to all pleasing, bearing fruit in every good work and growing in the knowledge of God[b],
translation:
  language: te
  text: 'మీరు ప్రభువుకు తగిన విధంగా నడుచుకుంటూ, అన్ని విధాలా ప్రీతికరంగా ఉండి[a], ప్రతి మంచి పనిలో ఫలిస్తూ, దేవుని గురించిన జ్ఞానంలో[b] ఎదిగేలా.


    [a] లేదా, “అన్ని విధాలా ఆయనను సంతోషపరుస్తూ.” గ్రీకు పాఠంలో ఎవరిని సంతోషపెట్టాలో స్పష్టంగా చెప్పలేదు; సందర్భాన్ని బట్టి “ప్రభువు” అని అర్థమవుతుంది.


    [b] లేదా, “దేవుని గురించిన సంపూర్ణ జ్ఞానంలో.” ఇక్కడి గ్రీకు పదం మరింత సంపూర్ణమైన లేదా లోతైన జ్ఞానాన్ని సూచించవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అన్ని విధాలా ఆయనను సంతోషపరుస్తూ.” గ్రీకు పాఠంలో ఎవరిని సంతోషపెట్టాలో స్పష్టంగా చెప్పలేదు; సందర్భాన్ని బట్టి “ప్రభువు” అని అర్థమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవుని గురించిన సంపూర్ణ జ్ఞానంలో.” ఇక్కడి గ్రీకు పదం మరింత సంపూర్ణమైన లేదా లోతైన జ్ఞానాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατῆσαι
  choice: నడుచుకొని
  rationale: పౌలు తరచుగా ఉపయోగించే జీవన ప్రవర్తనకు సంబంధించిన ‘నడవడం’ అనే రూపకాన్ని నిలుపుతూ, ముందు వచనంలోని ప్రార్థనతో అనుసంధానమయ్యేలా అనువదించబడింది.
- source_word: ἀξίως τοῦ κυρίου
  choice: ప్రభువుకు తగిన విధంగా
  rationale: ప్రవర్తన ప్రభువుకు తగినదిగా ఉండాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: అన్ని విధాలా ప్రీతికరంగా ఉంటూ
  rationale: గ్రీకులో సంతోషానికి పాత్రుడైన వ్యక్తి ప్రత్యక్షంగా పేర్కొనబడని అంశాన్ని ప్రధాన పాఠంలో అలాగే ఉంచి, తెలుగు సహజత్వాన్ని కాపాడుతుంది.
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες
  choice: ప్రతి మంచి పనిలో ఫలిస్తూ
  rationale: ‘ఫలించడం’ అనే మూల రూపకాన్నీ, παντί యొక్క ‘ప్రతి’ అనే విభజనాత్మక భావాన్నీ నిలుపుతుంది.
- source_word: αὐξανόμενοι
  choice: ఎదగాలని
  rationale: καρποφοροῦντες‌తో ఉన్న సజీవ వృద్ధి చిత్రణను సహజమైన తెలుగులో కొనసాగిస్తుంది.
- source_word: τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: దేవుని గురించిన జ్ఞానంలో
  rationale: దీనిని వృద్ధి జరిగే పరిధిగా గ్రహించి అనువదించబడింది; ‘దేవుని జ్ఞానం’ వల్ల కలిగే సంభావ్య తెలుగు సందిగ్ధతను ‘గురించిన’తో తగ్గించింది.
theological_decisions:
- issue: ἀρεσκείαν యొక్క సూచిత సంబంధం
  choice: ప్రధాన పాఠంలో ఎవరికి ప్రీతికరమో ప్రత్యక్షంగా చేర్చకుండా ‘అన్ని విధాలా ప్రీతికరంగా ఉంటూ’ అని ఉంచడం
  alternative: అన్ని విధాలా ఆయనను సంతోషపెడుతూ
  rationale: సందర్భంలో ప్రభువే సూచిత సంబంధమైనప్పటికీ, గ్రీకు పాఠం ప్రత్యక్ష కర్మను పేర్కొనదు. ప్రధాన పాఠం ఆ అంతర్లీనతను నిలుపుతుంది; సహజమైన విస్తరణను పాదసూచికలో ఇస్తుంది.
- issue: ἐπίγνωσις యొక్క భావ ఛాయ
  choice: జ్ఞానం
  alternative: సంపూర్ణ జ్ఞానం
  rationale: ఈ పదం మరింత సంపూర్ణమైన లేదా లోతైన జ్ఞానాన్ని సూచించగలదు; అయితే ప్రతి సందర్భంలో ఆ భావాన్ని తప్పనిసరి సాంకేతిక అర్థంగా మోపకుండా ప్రధాన పాఠంలో సాధారణ పదాన్ని ఉంచి, భావ ఛాయను పాదసూచికలో తెలిపింది.
- issue: τῇ ἐπιγνώσει దత్తివిభక్తి ప్రయోగం
  choice: జ్ఞానంలో ఎదగడం
  alternative: జ్ఞానం ద్వారా ఎదగడం
  rationale: దీనిని పరిధి లేదా సంబంధ సూచక దత్తివిభక్తిగా గ్రహించడం వృద్ధి రూపకంతో, సమీప వాక్య నిర్మాణంతో సహజంగా సరిపోతుంది; సాధనార్థక పఠనం సాధ్యమైన ప్రత్యామ్నాయంగా మిగులుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘నడుచుకొని’ మరియు ‘ఫలిస్తూ’ అనే బైబిలీయ రూపకాలు సహజంగా నిలుపబడ్డాయి. ఈ వచనం ముందున్న ప్రార్థనా వాక్య నిర్మాణాన్ని కొనసాగిస్తున్నందున ‘మీరు … ఎదగాలని’ అనే నిర్మాణం వాడబడింది.
