id: COL.1.11
reference: Colossians 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν πάσῃ δυνάμει δυναμούμενοι κατὰ τὸ κράτος τῆς δόξης αὐτοῦ εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν μετὰ χαρᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/011.yaml
  text: being strengthened with all power[a], according to the might of his glory, for all endurance and patience with joy,
translation:
  language: te
  text: ఆయన మహిమ బలానికి అనుగుణంగా మీరు సమస్త శక్తితో బలపరచబడుతూ, సమస్త సహనానికీ ఓర్పుకూ ఆనందంతో,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει
  choice: సమస్త శక్తితో
  rationale: ἐν ఇక్కడ సాధనార్థక భావాన్ని ఇస్తుంది. ‘సమస్త శక్తితో’ అనేది సహజమైన ఆధునిక తెలుగు; శక్తి సమగ్రంగా అనుగ్రహించబడుతున్న భావాన్ని నిలుపుతుంది.
- source_word: δυναμούμενοι
  choice: బలపరచబడుతూ
  rationale: వర్తమానకాల కర్మణి కృదంతం నిరంతరంగా బలం పొందుతున్న ప్రక్రియను సూచిస్తుంది; కార్యసాధకుడు దేవుడని సందర్భం తెలియజేస్తుంది.
- source_word: κατὰ τὸ κράτος
  choice: బలానికి తగినట్లుగా
  rationale: κατά ఇక్కడ ప్రమాణాన్ని లేదా కొలతను సూచిస్తుంది. ‘తగినట్లుగా’ అనేది దేవుని బలానికి అనుగుణంగా బలపరచబడుతున్న భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: τῆς δόξης αὐτοῦ
  choice: ఆయన మహిమ యొక్క
  rationale: మూలంలోని షష్ఠీ విభక్తి సంబంధాన్ని అలాగే ఉంచి, దానిని ‘మహిమాన్వితమైన బలం’ అని విశదీకరించి మూలంలోని సాంద్రతను తగ్గించలేదు.
- source_word: εἰς πᾶσαν ὑπομονὴν
  choice: సంపూర్ణ సహనం ... చూపడానికి
  rationale: εἰς ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. ὑπομονή శ్రమల మధ్య నిలకడగా సహించడాన్ని సూచిస్తుంది; πᾶσαν యొక్క సమగ్ర భావాన్ని ‘సంపూర్ణ’ తెలియజేస్తుంది.
- source_word: μακροθυμίαν
  choice: ఓర్పు
  rationale: వ్యక్తులు లేదా దీర్ఘకాల పరిస్థితుల పట్ల కోపపడకుండా సహించే భావాన్ని సాధారణ ఆధునిక తెలుగులో ‘ఓర్పు’ సహజంగా తెలియజేస్తుంది; ὑπομονήకు వాడిన ‘సహనం’తో స్వల్ప భేదమూ నిలుస్తుంది.
- source_word: μετὰ χαρᾶς
  choice: ఆనందంతో
  rationale: χαρά అనే నామవాచకాన్ని స్పష్టంగా ఉంచుతుంది; ఈ పదబంధం సహనమూ ఓర్పూ ప్రదర్శించే విధానాన్ని సహజంగా విశేషిస్తుంది.
theological_decisions:
- issue: దైవిక బలపరచడం మరియు దేవుని మహిమ మధ్య సంబంధం
  choice: ‘ఆయన మహిమ యొక్క బలానికి తగినట్లుగా’ అని మూలంలోని సాంద్రమైన షష్ఠీ విభక్తి నిర్మాణాన్ని నిలుపడం
  alternative: ‘ఆయన మహిమాన్వితమైన బలానికి తగినట్లుగా’
  rationale: మూలం మహిమను కేవలం బలానికి విశేషణంగా మార్చకుండా, మహిమతో సంబంధమున్న బలాన్ని చెబుతుంది. అందువల్ల వివరణాత్మక సిద్ధాంత విస్తరణ లేకుండా అసలు వాక్యంలోని భావభారాన్ని, సంభావ్య అర్థసాంద్రతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అదే సమయంలో ప్రార్థనా సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. ఇది కొలొస్సయులు 1:9–12లోని దీర్ఘ వాక్యంలో భాగమైనందున చివర కామా ఉంచబడింది.
