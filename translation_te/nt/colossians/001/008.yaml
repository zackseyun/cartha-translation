  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ καὶ δηλώσας ἡμῖν τὴν ὑμῶν ἀγάπην ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/008.yaml
  text: and who also made known to us your love in the Spirit[a].
translation:
  language: te
  text: ఆయన కూడా ఆత్మలో మీకు ఉన్న ప్రేమను మాకు తెలియజేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ ఆధ్యాత్మిక ప్రేమను.”
    reason: πνεύματι అనే పదం పరిశుద్ధాత్మను సూచించవచ్చు; లేదా ప్రేమ యొక్క ఆధ్యాత్మిక స్వభావాన్ని సూచించవచ్చు.
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: ఆయనే ... తెలియజేశాడు
  rationale: నిర్దేశక పదంతో కూడిన భూతకాల కృదంతం మునుపటి వచనంలోని ఎపఫ్రాను సూచిస్తుంది. తెలుగులో సహజమైన సమాపక వాక్యంగా అనువదించాం; δηλόω ఇక్కడ ‘తెలియజేయడం/వార్త చెప్పడం’ అనే అర్థం ఇస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: మునుపటి వచనంలో చెప్పిన ఎపఫ్రా సేవకు మరో కార్యాన్ని ఇది జతచేస్తుంది.
- source_word: ἡμῖν
  choice: మాకు
  rationale: ఇది పరోక్ష కర్మ; ఎపఫ్రా పౌలుకు, అతని సహచరులకు ఈ విషయం తెలియజేశాడు.
- source_word: τὴν ὑμῶν ἀγάπην
  choice: మీకున్న ప్రేమను
  rationale: ἀγάπηకి సహజమైన ప్రామాణిక తెలుగు పదం ‘ప్రేమ.’ గ్రీకు సంబంధ నిర్మాణాన్ని తెలుగులో సహజంగా ‘మీకున్న ప్రేమ’ అని వ్యక్తం చేశాం.
- source_word: ἐν πνεύματι
  choice: ఆత్మలో
  rationale: పౌలు వాడుకలో నిర్దేశక పదం లేకున్నా πνεύματι పరిశుద్ధాత్మను సూచించగలదు. ‘ఆత్మలో’ అనే రూపం ప్రధాన సంభావ్య అర్థాన్ని నిలుపుతూ అతివ్యాఖ్యానం చేయదు; ‘ఆధ్యాత్మికమైన ప్రేమ’ అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: πνεύματι దేనిని సూచిస్తుంది?
  choice: ‘ఆత్మలో’—పరిశుద్ధాత్మను సూచించే పఠనం ప్రధానార్థంగా తీసుకున్నాం.
  alternative: ‘ఆధ్యాత్మికమైన ప్రేమ’ లేదా ‘ఆత్మ సంబంధమైన ప్రేమ.’
  rationale: ఈ పదబంధం పరిశుద్ధాత్మను సూచించవచ్చు; లేక ప్రేమ యొక్క ఆధ్యాత్మిక స్వభావాన్ని వర్ణించవచ్చు. పౌలు వాడుకను బట్టి మొదటి భావం ఎక్కువ సంభావ్యమైనదిగా ప్రధాన పాఠ్యంలో ఉంచి, నిజమైన సందిగ్ధతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మునుపటి వచనంలోని ఎపఫ్రాను స్పష్టంగా తిరిగి సూచించడానికి ‘ఆయనే’ వాడాం; మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలిపాం.
