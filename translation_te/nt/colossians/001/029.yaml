id: COL.1.29
reference: Colossians 1:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: te
  text: దీనికోసమే నేను కూడా ప్రయాసపడుతున్నాను[a]; నాలో శక్తితో పనిచేస్తున్న[d] ఆయన కార్యశక్తికి[c] అనుగుణంగా పోరాడుతున్నాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ లక్ష్యంతోనే’ లేదా ‘దేనికోసం.’
    reason: lexical_alternative
  - marker: b
    text: ‘పోరాడుతున్నాను’కు బదులుగా ‘తీవ్రంగా కృషి చేస్తున్నాను’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు పాఠంలో ‘ఆయన కార్యశక్తి’ అని ఉంది; ‘ఆయన’ అనేది దేవుణ్ణి సూచిస్తుందా లేక క్రీస్తును సూచిస్తుందా అనేది ఈ వచనం స్పష్టంగా చెప్పదు.
    reason: alternative_reading
  - marker: d
    text: లేదా, ‘నాలో శక్తివంతంగా పనిచేస్తున్న’ లేదా ‘నాలో శక్తితో కార్యం చేస్తున్న.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: దీనికోసమే
  rationale: ఈ పదబంధం ముందటి వచనంలో చెప్పిన పరిచర్య లక్ష్యాన్ని వెనక్కి సూచిస్తుంది. ‘దీనికోసమే’ అనేది ఉద్దేశాన్ని సహజంగా తెలియజేస్తూ, దాని పరిధిని అతిగా నిర్దిష్టం చేయదు.
- source_word: καὶ
  choice: కూడా
  rationale: ముందు చెప్పిన పరిచర్యతో పౌలు చేస్తున్న కృషిని కలిపే అదనపు భావాన్ని తెలియజేస్తుంది.
- source_word: κοπιῶ
  choice: ప్రయాసపడుతున్నాను
  rationale: అలసట కలిగేంతటి కఠిన శ్రమ అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀγωνιζόμενος
  choice: పోరాడుతున్నాను
  rationale: తీవ్రంగా శ్రమించడం, పోటీలో సంపూర్ణంగా కృషి చేయడం అనే రూపకభావాన్ని నిలుపుతుంది.
- source_word: κατὰ
  choice: అనుగుణంగా
  rationale: పౌలు పోరాటం ఆయన కార్యశక్తి ప్రమాణానికి లేదా పరిమాణానికి అనుగుణంగా జరుగుతుందని చూపిస్తుంది; కేవలం సాధనార్థక భావానికి పరిమితం చేయదు.
- source_word: ἐνέργειαν
  choice: కార్యశక్తి
  rationale: ఫలప్రదంగా పనిచేసే శక్తి అనే భావాన్ని ఇస్తుంది; ‘శక్తి’తో మాత్రమే అనువదిస్తే తరువాతి δύναμις‌తో ఉన్న భేదం కనుమరుగవుతుంది.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: గ్రీకులో ఉన్న సర్వనామాన్ని అలాగే ఉంచి, అది దేవుణ్ణి సూచిస్తుందా లేక క్రీస్తును సూచిస్తుందా అనే విషయాన్ని అనువాదంలో నిర్ణయించదు.
- source_word: τὴν ἐνεργουμένην
  choice: పనిచేస్తున్న
  rationale: కొనసాగుతున్న క్రియాశీలతను సహజమైన తెలుగులో తెలియజేస్తుంది; ἐνέργεια పదంతో ఉన్న మూలపద సంబంధాన్ని ‘కార్యశక్తి—పనిచేస్తున్న’ అనే భావసామ్యంతో కొంతవరకు నిలుపుతుంది.
- source_word: ἐν ἐμοὶ
  choice: నాలో
  rationale: ἐν యొక్క ప్రత్యక్ష స్థానార్థాన్ని నిలుపుతూ, అంతర్గత బలపరచడమా లేక పౌలు ద్వారా జరిగే కార్యమా అనే వివరణను తెరిచి ఉంచుతుంది.
- source_word: ἐν δυνάμει
  choice: శక్తితో
  rationale: దైవిక కార్యం జరిగే శక్తిమంతమైన రీతిని సహజమైన తెలుగులో తెలిపి, δύναμις యొక్క నామవాచక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: αὐτοῦ (‘ఆయన’) ఎవరిని సూచిస్తుంది?
  choice: దేవుడు లేదా క్రీస్తు అని స్పష్టీకరించకుండా ‘ఆయన’ అనే సర్వనామాన్నే ఉంచడం.
  alternative: ‘దేవుని కార్యశక్తి’ లేదా ‘క్రీస్తు కార్యశక్తి.’
  rationale: ఈ వచనంలో పూర్వపదం స్పష్టంగా పేరు పెట్టబడలేదు. కొలొస్సయుల పత్రిక సందర్భం రెండు సూచనలను పరిశీలించడానికి వీలు ఇస్తుంది; అందువల్ల మూలపాఠంలోని సందిగ్ధతను అనువాదం పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ప్రయాసపడుతున్నాను—పోరాడుతున్నాను’ అనే జంట మూలంలోని కఠిన శ్రమను నిలుపుతుంది. ‘కార్యశక్తి’ కొద్దిగా ఉన్నత పదమైనప్పటికీ ἐνέργεια మరియు δύναμις మధ్య తేడాను కాపాడటానికి ఉపయోగించబడింది.
