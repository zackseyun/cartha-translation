id: COL.1.13
reference: Colossians 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/013.yaml
  text: who rescued us from the authority of darkness and transferred us into the kingdom of the Son of his love,[a]
translation:
  language: te
  text: ఆయన మనలను చీకటి అధికారం నుండి రక్షించి, తన ప్రేమపాత్రుడైన కుమారుని[a] రాజ్యంలోకి తరలించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “తన ప్రేమ యొక్క కుమారుని”; లేదా “తాను ప్రేమించే కుమారుని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρρύσατο
  choice: రక్షించి
  rationale: ప్రమాదకరమైన లేదా శత్రుసంబంధమైన శక్తి నుండి నిర్ణయాత్మకంగా విడిపించడం అనే ῥύομαι భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐξουσίας
  choice: అధికారం
  rationale: ἐξουσίαలోని పాలించే అధికారం లేదా ఆధిపత్యం అనే భావాన్ని నేరుగా నిలుపుతుంది; ‘రాజ్యం’ లేదా ‘ప్రదేశం’ అని చేసి భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: σκότους
  choice: చీకటి
  rationale: మూలపదానికి నేరమైన సమానార్థకం; దానిలోని నైతిక, ఆధ్యాత్మిక సూచనలను వివరణగా విస్తరించకుండా వదిలేస్తుంది.
- source_word: μετέστησεν
  choice: తరలించాడు
  rationale: ఒక అధికారం లేదా స్థితి నుండి మరొక రాజ్యంలోకి మార్చడం అనే కదలికను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: βασιλείαν
  choice: రాజ్యం
  rationale: εἰςతో కూడిన తరలింపు చిత్రణలో, కుమారుని పాలనలోని రాజ్యానికి చేర్చబడటాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: υἱοῦ
  choice: కుమారుని
  rationale: υἱόςకు నేరమైన సమానార్థకం; సందర్భంలో దేవుని కుమారుణ్ణి సూచిస్తుంది.
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: తన ప్రేమపాత్రుడైన కుమారుని
  rationale: ‘తన ప్రేమ యొక్క కుమారుడు’ అనే యథాపద నిర్మాణం తెలుగులో అసహజంగా, అస్పష్టంగా ఉంటుంది. ఈ ఎంపిక తండ్రి ప్రత్యేక ప్రేమకు పాత్రుడైన కుమారుడు అనే గ్రీకు నామవిభక్తి సంబంధ భావాన్ని సహజంగా అందిస్తుంది; మూల నిర్మాణం మరియు మరో సాధ్యమైన వ్యక్తీకరణ పాదసూచికలో నిలుపబడ్డాయి.
theological_decisions:
- issue: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ అనే సంబంధవిభక్తి పదబంధం
  choice: తన ప్రేమపాత్రుడైన కుమారుని
  alternative: పదశః, ‘తన ప్రేమ యొక్క కుమారుని’; లేదా ‘తాను ప్రేమించే కుమారుని’
  rationale: ఈ పదబంధం తండ్రికి కుమారునిపై ఉన్న ప్రత్యేక ప్రేమను వ్యక్తం చేస్తుంది. తెలుగులో అసహజమైన యథాపద నిర్మాణాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా ఉంచకుండా, దాని భావాన్ని ‘ప్రేమపాత్రుడు’తో తెలిపి, మూలంలోని నిర్మాణాన్ని మరియు మరొక సహజ వ్యాఖ్యానాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, రాజ్యం మరియు కుమారుడు అనే క్రీస్తుసంబంధ సందర్భానికి తగిన గౌరవభరిత శైలిలోనూ రూపొందించబడింది. గ్రీకులోని సంబంధవాచక ప్రారంభాన్ని తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ‘ఆయన’గా ఇచ్చాం; దాని పూర్వపదం ముందరి వచన సందర్భం ద్వారా తెలుస్తుంది.
