source:
  edition: SBLGNT
  text: τοῦ παρόντος εἰς ὑμᾶς, καθὼς καὶ ἐν παντὶ τῷ ⸀κόσμῳ ἐστὶν καρποφορούμενον καὶ αὐξανόμενον καθὼς καὶ ἐν ὑμῖν, ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε τὴν χάριν τοῦ θεοῦ ἐν ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: te
  text: అది మీ వద్దకు వచ్చింది[a]. మీరు విని దేవుని కృపను సత్యంలో[d] తెలుసుకున్న రోజు మొదలుకొని, ప్రపంచమంతటా[b] అది ఫలిస్తూ పెరుగుతున్నట్లే మీ మధ్య కూడా[c] ఫలిస్తూ పెరుగుతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అది మీతో ఉంది,’ లేదా ‘అది మీ మధ్యకు చేరుకుంది.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘లోకమంతటిలో.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మీలో కూడా.’ గ్రీకు పదబంధం సంఘాన్ని సమష్టిగా సూచించవచ్చు లేదా సువార్త వారిలో అంతర్గతంగా చేస్తున్న కార్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘నిజంగా,’ లేదా ‘సత్యంలోనే.’
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: అది మీ దగ్గరకు వచ్చింది
  rationale: ఈ కృదంత పదబంధం 5వ వచనంలోని సువార్తను సూచిస్తుంది. πάρειμιలోని చేరికతో కూడిన ఉనికి భావాన్ని సహజమైన తెలుగులో ‘మీ దగ్గరకు వచ్చింది’ అని వ్యక్తం చేశాం.
- source_word: ἐν παντὶ τῷ κόσμῳ
  choice: ప్రపంచమంతటా
  rationale: κόσμος ఇక్కడ సువార్త విస్తరణను విశాలంగా వర్ణించే ప్రయోగం. భౌగోళిక పరిధిని అనవసరంగా నిర్దిష్టం చేయకుండా గ్రీకు సార్వత్రిక భాషను నిలుపుతుంది.
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: అది ఫలిస్తూ పెరుగుతోంది
  rationale: వర్తమాన కృదంతాలు కొనసాగుతున్న క్రియను తెలియజేస్తాయి. ‘ఫలిస్తూ’ వ్యవసాయ రూపకాన్ని, ‘పెరుగుతోంది’ విస్తరణ భావాన్ని సహజంగా నిలుపుతాయి.
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: మీ మధ్య కూడా
  rationale: ἐν ὑμῖν సంఘాన్ని సమష్టిగా ఉద్దేశించవచ్చు; ‘మీ మధ్య’ సువార్త వారి సమాజంలో పనిచేస్తున్న భావాన్ని సహజంగా తెలియజేస్తుంది. ‘మీలో’ అనే అంతర్గత భావం కూడా సాధ్యమే కనుక పాదసూచికలో ఉంచాం.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε
  choice: మీరు విని ... తెలుసుకున్న రోజు మొదలుకొని
  rationale: వినడం, తెలుసుకోవడం అనే రెండు గత సంఘటనలను నిలిపి, ఆ రోజు నుంచి కొనసాగుతున్న ఫలింపు మరియు పెరుగుదలకు కాలారంభాన్ని స్పష్టంగా చూపుతుంది.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: దేవుని కృపను
  rationale: పౌలు వాడే ప్రధానమైన పదబంధాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా అనువదిస్తుంది.
- source_word: ἐν ἀληθείᾳ
  choice: సత్యంలో
  rationale: ఈ పదబంధం ‘నిజంగా’ అనే విధానార్థాన్నీ, సత్యం అనే పరిధి లేదా విషయార్థాన్నీ సూచించగలదు. ‘సత్యంలో’ మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను ప్రధాన పాఠ్యంలో ఎక్కువగా నిలుపుతుంది.
theological_decisions:
- issue: ‘ప్రపంచమంతటా’ అనే మాట పరిధి
  choice: సువార్త విస్తృతంగా వ్యాపించడాన్ని తెలిపే విశాల వర్ణనగా మూలంలోని సార్వత్రిక భాషను నిలిపాం.
  alternative: ఆ సమయానికే భూమిపై ప్రతి ప్రాంతం, ప్రతి వ్యక్తి చేరుకోబడ్డారని అక్షరార్థంగా గ్రహించడం.
  rationale: అనువాదం మూలంలోని విస్తృత దావాను తగ్గించదు; అలాగే మూలంలో లేని కచ్చితమైన భౌగోళిక వివరణను కూడా చేర్చదు.
- issue: ἐν ἀληθείᾳ యొక్క భావం
  choice: ‘సత్యంలో’ అని అనువదించి, విధానం మరియు పరిధి/విషయం మధ్య ఉన్న భావసంభావ్యతను నిలిపాం.
  alternative: ‘నిజంగా’ లేదా ‘సత్యానుసారంగా’.
  rationale: గ్రీకు పదబంధం ఒకే భావానికి పరిమితం కాదు; అందువల్ల ప్రధాన పాఠ్యంలో దానిని నిశ్చయంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు వాక్యంలోని కొనసాగుతున్న క్రియను తెలుగులో స్పష్టంచేయడానికి ‘ఫలిస్తూ పెరుగుతోంది’ అనే పదబంధాన్ని తులనలో రెండుసార్లు వ్యక్తం చేశాం. ‘సత్యంలో’ కొద్దిగా గంభీరమైన నిర్మాణమైనప్పటికీ మూలంలోని భావసందిగ్ధతను కాపాడుతుంది.
