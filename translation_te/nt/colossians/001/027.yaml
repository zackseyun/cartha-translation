- from: వారికి దేవుడు, అన్యజనుల మధ్య ఈ మర్మపు మహిమాసంపద ఏమిటో తెలియజేయాలని కోరుకున్నాడు. ఆ మర్మం మీలో[a] ఉన్న మెస్సీయే—మహిమను పొందే నిరీక్షణ.
