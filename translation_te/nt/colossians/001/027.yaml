id: COL.1.27
reference: Colossians 1:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: te
  text: వారికి దేవుడు, అన్యజనుల మధ్య ఈ మర్మపు మహిమాసంపద ఏమిటో తెలియజేయాలని కోరుకున్నాడు. ఆ మర్మం మీలో[a] ఉన్న మెస్సీయే—మహిమ యొక్క నిరీక్షణ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ మధ్య.” గ్రీకు పదబంధం మెస్సీయ విశ్వాసులలో ఉండడాన్ని గానీ, వారి సమాజం మధ్య—ప్రత్యేకంగా అన్యజనుల మధ్య—ఉండడాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: వారికి
  rationale: మునుపటి వచనంలోని పరిశుద్ధులను సూచించే బహువచన దత్తివాచక సర్వనామం; γνωρίσαιతో సహజంగా ‘వారికి తెలియజేయడం’ అనే భావాన్ని ఇస్తుంది.
- source_word: ἠθέλησεν
  choice: కోరుకున్నాడు
  rationale: దేవుని సంకల్పపూర్వకమైన ఇష్టాన్ని తెలియజేస్తుంది; ‘నిర్ణయించాడు’ కంటే మూలపదంలోని కోరిక/చిత్తం పరిధిని విస్తృతంగా ఉంచుతుంది.
- source_word: γνωρίσαι
  choice: తెలియజేయాలని
  rationale: γνωρίζω యొక్క ప్రత్యక్ష భావమైన ‘తెలిసేలా చేయడం’ను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου
  choice: ఈ మర్మపు మహిమాసంపద ఏమిటో
  rationale: సంక్షిప్తమైన గ్రీకు నిర్మాణాన్ని తెలుగులో అర్థవంతంగా ఉంచుతూ πλοῦτος (‘సంపద’) మరియు δόξα (‘మహిమ’) రెండింటినీ నిలుపుతుంది.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: అన్యజనుల మధ్య
  rationale: పౌలు సందర్భంలో ἔθνη యూదేతర ప్రజలను సూచిస్తుంది; ‘దేశాల మధ్య’ కంటే ‘అన్యజనుల మధ్య’ ఆ సందర్భభేదాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: μυστηρίου / ὅ ἐστιν
  choice: మర్మం / ఆ మర్మం ... మెస్సీయే
  rationale: μυστήριον అనేది తెలియరాని చిక్కు కాక, ఒకప్పుడు దాచబడి ఇప్పుడు వెల్లడైన దేవుని ఉద్దేశం. వివరణాత్మక సంబంధవాక్యాన్ని సహజమైన తెలుగు వాక్యంగా విడదీసింది.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ పదం వివరణాత్మక వాక్యంలో బిరుదుగా బలంగా పనిచేస్తుంది; అందువల్ల ‘క్రీస్తు’ అనే పేరులాంటి రూపం కంటే ‘మెస్సీయ’ ఎంచుకుంది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: గ్రీకు పదబంధానికి అత్యంత ప్రత్యక్షమైన అనువాదం; వ్యక్తులలో నివాసం మరియు సమాజం మధ్య సాన్నిధ్యం అనే రెండు సాధ్య భావాలను పూర్తిగా పరిష్కరించకుండా ఉంచుతుంది.
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: మహిమను పొందే నిరీక్షణ
  rationale: సాంద్రమైన సంబంధవిభక్తి పదబంధాన్ని సాధారణ పాఠకునికి సహజంగా అందిస్తూ, భవిష్య మహిమపై ఆధారపడిన నిరీక్షణ భావాన్ని వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: Χριστός యొక్క బిరుదు స్వభావం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ మర్మం ఏమిటో గుర్తింపజేసే విధంగా Χριστός బిరుదుగా ఉంది; కాబట్టి బిరుదు భావాన్ని స్పష్టంగా నిలిపింది.
- issue: ἐν ὑμῖν యొక్క స్థలార్థం
  choice: మీలో
  alternative: మీ మధ్య
  rationale: ఈ పదబంధం విశ్వాసులలో మెస్సీయ నివాసాన్ని లేదా అన్యజన సమాజం మధ్య ఆయన సాన్నిధ్యాన్ని సూచించగలదు. ప్రధాన పాఠంలో ప్రత్యక్ష రూపాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- issue: ἡ ἐλπὶς τῆς δόξης లో సంబంధవిభక్తి
  choice: మహిమను పొందే నిరీక్షణ
  alternative: మహిమ యొక్క నిరీక్షణ
  rationale: తెలుగులో అర్థం సహజంగా ఉండేందుకు సంబంధాన్ని కొద్దిగా విప్పి చెప్పింది; మహిమ నిరీక్షణకు విషయమా, ఫలితమా అన్న భావాన్ని అతిగా సిద్ధాంతీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకునికి అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని సాంద్రతను తగ్గించేందుకు రెండు వాక్యాలుగా విభజించినా, భావక్రమాన్ని మరియు ‘మర్మం—మెస్సీయ—మహిమ నిరీక్షణ’ అనే నిర్మాణాన్ని నిలిపింది.
