id: COL.1.3
reference: Colossians 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: te
  text: మేము మీ కోసం ప్రార్థించేటప్పుడు, మన ప్రభువైన యేసు మెస్సీయకు తండ్రియైన దేవునికి ఎల్లప్పుడూ కృతజ్ఞతలు చెల్లిస్తున్నాము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యేసు క్రీస్తు” అని సంప్రదాయంగా అనువదించవచ్చు.
    reason: Χριστόςకు అర్థాన్ని తెలిపే ‘మెస్సీయ’ మరియు సంప్రదాయ లిప్యంతరీకరణ ‘క్రీస్తు’ అనే రెండు సముచిత రూపాలు ఉన్నాయి.
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: కృతజ్ఞతలు చెల్లిస్తున్నాము
  rationale: కృతజ్ఞతను వ్యక్తం చేయడం అనే మూలార్థాన్ని, పత్రికా శైలికి తగిన సహజమైన తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
- source_word: τῷ θεῷ πατρὶ
  choice: తండ్రియైన దేవునికి
  rationale: రెండు చతుర్థీ విభక్తి పదాల అన్వయాన్ని తండ్రి దేవుని వివరిస్తున్నట్లు సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῦ κυρίου ἡμῶν
  choice: మన ప్రభువైన
  rationale: κύριος అనే బిరుదును ‘ప్రభువు’గా ఉంచి, సంబంధాన్ని సహజ తెలుగు నిర్మాణంలో తెలియజేస్తుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός యొక్క బిరుదాత్మక అర్థాన్ని ‘మెస్సీయ’గా స్పష్టంగా ఉంచుతుంది; తెలుగులో ‘యేసు మెస్సీయ’ సహజమైన పేరు-బిరుదు క్రమం.
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: కాలవ్యాప్తిని నేరుగా తెలియజేస్తుంది; గ్రీకు వాక్యంలో ఇది ప్రధాన క్రియను విశేషించే అవకాశాన్ని తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: περὶ ὑμῶν
  choice: మీ కోసం
  rationale: ప్రార్థనా సందర్భంలో περί + షష్ఠీ విభక్తి యొక్క మధ్యవర్తిత్వ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: προσευχόμενοι
  choice: ప్రార్థించేటప్పుడు
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలీనంగా ఉన్న సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός యొక్క బిరుదాత్మక భావం సజీవంగా ఉండగలదు; ‘మెస్సీయ’ దాని అర్థాన్ని పారదర్శకంగా ఉంచుతుంది. సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ఇస్తున్నాము.
- issue: πατρὶ పదబంధం యొక్క సంబంధం
  choice: మన ప్రభువైన యేసు మెస్సీయకు తండ్రియైన దేవుడు
  alternative: దేవుడు, మన ప్రభువైన యేసు మెస్సీయ యొక్క తండ్రి
  rationale: రెండూ సమానార్థక నిర్మాణాలే; ఎంపిక చేసిన తెలుగు రూపం అనుబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- issue: πάντοτε యొక్క అన్వయం
  choice: కృతజ్ఞతలు చెల్లిస్తున్నాము అనే ప్రధాన క్రియతో అన్వయం
  alternative: ప్రార్థించేటప్పుడు అనే కృదంతంతో అన్వయం
  rationale: గ్రీకు పదక్రమం మరియు సాధారణ పత్రికా వాడుక ప్రకారం ‘ఎల్లప్పుడూ కృతజ్ఞతలు చెల్లిస్తున్నాము’ అన్వయం సహజం; అయితే మూలంలో స్వల్ప నిర్మాణాత్మక అస్పష్టత ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా శైలి. ‘కృతజ్ఞతలు చెల్లిస్తున్నాము’ అధికారికమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో తప్పనిసరిగా చేర్చబడింది.
