  yaml_path: translation/nt/colossians/001/012.yaml
  text: giving thanks to the Father[a], who has qualified you for the share of the inheritance of the saints in the light[b],
translation:
  language: te
  text: వెలుగులో ఉన్న పరిశుద్ధులకు చెందిన స్వాస్థ్యంలో భాగం[b] పొందడానికి మిమ్మల్ని[a] అర్హులుగా చేసిన తండ్రికి కృతజ్ఞతలు చెల్లిస్తూ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘మిమ్మల్ని’కు బదులుగా ‘మనలను’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘వెలుగులో ఉన్న పరిశుద్ధులకు కేటాయించబడిన భాగం’; గ్రీకు పదబంధం చీటి ద్వారా కేటాయించబడిన స్వాస్థ్యభాగం అనే ప్రతీకను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: కృతజ్ఞతలు చెల్లిస్తూ
  rationale: వర్తమాన కర్తరి అసమాపక క్రియ యొక్క కొనసాగుతున్న భావాన్ని, ముందున్న వాక్యప్రవాహంతో సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τῷ πατρὶ
  choice: తండ్రికి
  rationale: మూలంలో ఉన్న నిర్దిష్ట సంబంధపదాన్ని అదనంగా ‘దేవుడు’ అని చేర్చకుండా యథాతథంగా అందిస్తుంది.
- source_word: τῷ ἱκανώσαντι
  choice: అర్హులుగా చేసిన
  rationale: ἱκανόωలోని సరిపడేలా లేదా యోగ్యులుగా చేయడం అనే భావాన్ని వ్యక్తం చేస్తుంది; కేవలం అనుమతించాడనే భావాన్ని కలిగించదు.
- source_word: ὑμᾶς
  choice: మిమ్మల్ని
  rationale: ఇచ్చిన SBLGNT పాఠంలోని ద్వితీయ పురుష బహువచనాన్ని అనుసరిస్తుంది; ‘మనలను’ అనే పాఠాంతరాన్ని పాదసూచికలో ఉంచింది.
- source_word: εἰς τὴν μερίδα τοῦ κλήρου
  choice: స్వాస్థ్యంలో భాగం పొందడానికి
  rationale: μερίς యొక్క ‘భాగం’ భావాన్నీ, κλῆρος యొక్క వారసత్వం/కేటాయింపు నేపథ్యాన్నీ సహజ తెలుగులో కలిపి అందిస్తుంది; εἰς యొక్క ఉద్దేశం లేదా ఫలిత భావాన్ని ‘పొందడానికి’ తెలియజేస్తుంది.
- source_word: τῶν ἁγίων
  choice: పరిశుద్ధుల
  rationale: పౌలు వాడుకలో దేవునికి ప్రతిష్ఠించబడిన ప్రజలను సూచించే సంప్రదాయబద్ధమైన, అర్థమయ్యే పదం.
- source_word: ἐν τῷ φωτί
  choice: వెలుగులో
  rationale: వెలుగు అనే రూపకాన్ని వివరణతో పరిమితం చేయకుండా నిలుపుతుంది; స్వాస్థ్యం మరియు పరిశుద్ధుల సమూహంతో దాని సంబంధాన్ని సహజంగా ఉంచుతుంది.
theological_decisions:
- issue: కర్మ సర్వనామంలోని పాఠాంతరం
  choice: మిమ్మల్ని
  alternative: మనలను
  rationale: ఇచ్చిన గ్రీకు మూలపాఠం ὑμᾶς (‘మిమ్మల్ని’) అని చదువుతుంది. కొన్ని ప్రతుల్లోని ἡμᾶς (‘మనలను’) పాఠాన్ని ప్రధాన పాఠంలో కలపకుండా పాదసూచికలో సంరక్షించాం.
- issue: μερίς మరియు κλῆρος కలయికలోని స్వాస్థ్య/కేటాయింపు ప్రతీక
  choice: స్వాస్థ్యంలో భాగం
  alternative: పరిశుద్ధులకు కేటాయించబడిన భాగం
  rationale: ప్రధాన పాఠం వారసత్వ భావాన్ని స్పష్టంగా తెలియజేస్తూనే, గ్రీకులోని చీటి ద్వారా కేటాయించబడిన భాగం అనే పాత నిబంధన నేపథ్యాన్ని పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ఈ వచనం ముందున్న వాక్యంతో కొనసాగే అసమాపక క్రియారూపం కాబట్టి చివర అల్పవిరామం ఉంచబడింది. పాఠాంతర సూచికను సంబంధిత సర్వనామం వెంట ఉంచాం.
