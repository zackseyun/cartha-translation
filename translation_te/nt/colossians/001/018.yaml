- from: ఆయనే శరీరానికి, అంటే సంఘానికి, శిరస్సు. ఆయనే ఆది[a], మృతులలోనుండి పుట్టిన ప్రథముడు. తద్వారా అన్నిటిలో ఆయనే మొదటి స్థానంలో ఉండాలి[b].
  to: ఆయనే శరీరానికి, అంటే సంఘానికి, శిరస్సు. ఆయనే ఆది[a], మృతులలోనుండి లేచినవారిలో ప్రథముడు. తద్వారా అన్నిటిలో ఆయనే మొదటి స్థానంలో అయ్యేలా[b].
  rationale: The revised wording preserves the source’s Christological claims and its unresolved lexical range. “మృతులలోనుండి లేచినవారిలో ప్రథముడు” is clear Telugu resurrection language, and “అయ్యేలా” reflects the purpose/result force of ἵνα γένηται rather than adding an obligation. Footnote markers remain attached to the corresponding expressions.
