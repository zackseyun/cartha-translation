source:
  edition: SBLGNT
  text: καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ⸀ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: te
  text: ఆయనే శరీరానికి, అంటే సంఘానికి, శిరస్సు. ఆయనే ఆది[a], మృతులలోనుండి లేచినవారిలో ప్రథముడు. తద్వారా అన్నిటిలో ఆయనే మొదటి స్థానంలో అయ్యేలా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మూలం’; లేదా ‘పరిపాలకుడు’.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అన్నిటిలో ప్రథముడయ్యేలా’.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: ఆయనే
  rationale: గ్రీకు సర్వనామంలోని ఉద్ఘాటనను సహజమైన తెలుగులో ‘ఆయనే’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: κεφαλή
  choice: శిరస్సు
  rationale: శరీర రూపకాన్ని యథాతథంగా నిలుపుతుంది; దీనిని కేవలం ‘అధిపతి’గానో ‘మూలం’గానో పరిమితం చేయదు.
- source_word: σῶμα
  choice: శరీరం
  rationale: క్రీస్తు–సంఘం సంబంధాన్ని తెలిపే రూపకానికి సహజమైన ప్రత్యక్ష సమానార్థకం.
- source_word: ἐκκλησία
  choice: సంఘం
  rationale: పౌలు సందర్భంలో విశ్వాసుల సముదాయాన్ని సూచించే స్థిరమైన, సహజమైన తెలుగు పదం.
- source_word: ἀρχή
  choice: ఆది
  rationale: ‘మృతులలోనుండి పుట్టిన ప్రథముడు’ అనే తదుపరి మాటతో అనుసంధానమై కొత్త జీవితం లేదా పునరుత్థాన క్రమానికి ఆరంభకుడనే భావాన్ని నిలుపుతుంది; పదంలోని ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచుతుంది.
- source_word: πρωτότοκος
  choice: పుట్టిన ప్రథముడు
  rationale: ‘మొదట పుట్టినవాడు’ అనే మూల రూపాన్ని సహజమైన తెలుగులో నిలుపుతూ, క్రమం మరియు ప్రాధాన్యం రెండింటికీ అవకాశం ఇస్తుంది.
- source_word: ἐκ τῶν νεκρῶν
  choice: మృతులలోనుండి
  rationale: పునరుత్థానాన్ని సూచించే గ్రీకు ప్రయోగాన్ని సంక్షిప్తంగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἵνα γένηται
  choice: తద్వారా … ఉండాలి
  rationale: ఈ ఉపవాక్యంలో ఉన్న ఉద్దేశం లేదా ఫలితం రెండింటినీ తెలుగులో సహజంగా తెలియజేస్తుంది; కేవలం స్థితిని చెప్పకుండా γένηται యొక్క భావాన్ని సందర్భానుగుణంగా అందిస్తుంది.
- source_word: ἐν πᾶσιν
  choice: అన్నిటిలో
  rationale: నపుంసక బహువచన ప్రయోగానికి సహజమైన సమానార్థకం; సందర్భంలోని విశ్వవ్యాప్త పరిధిని నిలుపుతుంది.
- source_word: πρωτεύων
  choice: మొదటి స్థానంలో
  rationale: ‘ప్రథమత్వం కలిగి ఉండడం’ అనే క్రియాత్మక భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: క్రీస్తు–శరీరం రూపకంలో κεφαλή అర్థం
  choice: ‘శిరస్సు’ అనే రూపకాన్నే నిలుపుట
  alternative: అధిపతి; మూలం
  rationale: గ్రీకు రూపకం అధికారాన్ని లేదా మూలాన్ని మాత్రమే ప్రత్యేకంగా నిర్దేశించదు. ‘శిరస్సు’ అని అనువదించడం ఆ అర్థసంపదను, వ్యాఖ్యాన సంబంధమైన ఉద్వేగాన్ని కాపాడుతుంది.
- issue: పునరుత్థాన సందర్భంలో ἀρχή అర్థం
  choice: ఆది
  alternative: మూలం; పరిపాలకుడు
  rationale: తక్షణ సందర్భంలోని ‘మృతులలోనుండి పుట్టిన ప్రథముడు’ అనే మాటతో ‘ఆది’ బాగా సరిపోతుంది. అయినా గ్రీకు పదానికి ఉన్న ఇతర సాధ్యార్థాలను పాదటిప్పణిలో తెలియజేస్తుంది.
- issue: πρωτότοκος ἐκ τῶν νεκρῶν యొక్క భావం
  choice: మృతులలోనుండి పుట్టిన ప్రథముడు
  alternative: మృతులలోనుండి మొదట లేచినవాడు; మృతులపై ప్రథముడు
  rationale: ‘పుట్టిన’ అనే మూల పదరూపాన్ని నిలుపుతూ పునరుత్థాన ప్రాధాన్యాన్ని సందర్భమే వివరించేలా చేస్తుంది; సృష్టించబడినవాడనే భావాన్ని అనవసరంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘శిరస్సు’ అనే బైబిలీయ రూపకాన్ని నిలిపి, వివాదాస్పదమైన అర్థాన్ని అనువాదంలోనే నిర్ణయించలేదు. పాదటిప్పణి సూచికలు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
