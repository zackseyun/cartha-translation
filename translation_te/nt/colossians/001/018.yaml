review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the head/body/church metaphor, the emphatic pronouns, and ἀρχή as “ఆది.” However, “మృతులలోనుండి పుట్టిన ప్రథముడు” is not idiomatic resurrection language in Telugu and can suggest a literal birth from the dead. Further, “ఉండాలి” introduces a deontic sense (“ought to be”) not conveyed by γένηται, which means “might become/come to be.”
  naturalness: “ఆయనే శరీరానికి, అంటే సంఘానికి, శిరస్సు” is understandable and suitably formal. The revision makes the resurrection phrase idiomatic and replaces the obligation-like final verb with a purposive/resultative expression natural in modern standard Telugu.
  terminology: “శిరస్సు,” “సంఘం,” “ఆది,” and “ప్రథముడు” appropriately preserve the biblical metaphors and key terminology without resolving debated senses. The footnote for ἀρχή correctly presents lexical alternatives. The final footnote remains tied to the expression for holding first place.
  issues:
  - severity: medium
    issue: The phrase “మృతులలోనుండి పుట్టిన ప్రథముడు” is misleading and unnatural.
    rationale: Although πρωτότοκος literally contains birth imagery, in this resurrection context Telugu requires an expression involving rising from the dead. “లేచినవారిలో ప్రథముడు” clearly conveys resurrection primacy while retaining “ప్రథముడు.”
  - severity: medium
    issue: “ఉండాలి” adds an obligation/deontic nuance to γένηται.
    rationale: 'The Greek ἵνα γένηται is purpose/result language: “so that he might become/come to have.” “అయ్యేలా” preserves this without implying that he ought to attain first place.'
