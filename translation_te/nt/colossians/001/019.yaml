    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఈ సందర్భంలో ముందున్న వాక్యానికి కారణాన్ని లేదా ఆధారాన్ని పరిచయం చేసే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘అని’ అనే అన్వయమూ వ్యాకరణపరంగా సాధ్యమే.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: సమీప సందర్భంలోని కుమారునినే సర్వనామం సూచిస్తుంది. మూలంలో లేని ‘క్రీస్తులో’ లేదా ‘మెస్సీయలో’ అనే బిరుదును చేర్చకుండా సర్వనామ రూపాన్ని నిలుపుతుంది.
- source_word: εὐδόκησεν
  choice: ఇష్టపడింది
  rationale: εὐδοκέω తెలియజేసే అనుకూల సంకల్పం లేదా సంతోషపూర్వక సమ్మతిని సహజంగా వ్యక్తం చేస్తుంది. మూలంలో స్పష్టంగా లేని ‘దేవుడు’ లేదా ‘తండ్రి’ అనే కర్తను చేర్చదు.
- source_word: πᾶν τὸ πλήρωμα
  choice: సంపూర్ణత అంతా
  rationale: πᾶν యొక్క సమగ్ర భావాన్నీ, πλήρωμα యొక్క గంభీరమైన భావాన్నీ నిలుపుతూ, మూలంలో లేని ‘దేవుని’ అనే విస్తరణను చేర్చదు.
- source_word: κατοικῆσαι
  choice: నివసించడానికి
  rationale: స్థిరంగా నివాసముండడం అనే క్రియాభావాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: εὐδόκησεν క్రియ యొక్క సూచిత కర్త
  choice: ప్రధాన పాఠ్యంలో ‘దేవుడు’ లేదా ‘తండ్రి’ అనే కర్తను చేర్చకుండా, వ్యాకరణపరంగా ‘సంపూర్ణత అంతా’తో అనుసంధానించడం.
  alternative: ‘తన సంపూర్ణత అంతా ఆయనలో నివసించాలని దేవుడు ఇష్టపడ్డాడు’ లేదా ‘తండ్రి ఇష్టపడ్డాడు.’
  rationale: గ్రీకు వాక్యంలో దేవుడు లేదా తండ్రి అని కర్త ప్రత్యక్షంగా లేదు. సాధారణ వ్యాఖ్యానాన్ని పాఠ్యంలోనే స్థిరపరచకుండా మూలంలోని సంక్షిప్తతను, ఉద్వేగాన్ని నిలుపుతుంది; పాఠకునికి సహాయంగా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ‘సంపూర్ణత’ యొక్క నిర్దిష్ట సూచన
  choice: ‘సంపూర్ణత అంతా’ అని మాత్రమే ఉంచడం.
  alternative: ‘దేవుని సంపూర్ణత అంతా’ లేదా ‘ఆయన సంపూర్ణత అంతా.’
  rationale: సందర్భం, ముఖ్యంగా కొలొస్సయులకు 2:9, దీనిని దేవుని సంపూర్ణతగా అర్థం చేసుకోవడానికి బలమైన ఆధారం ఇస్తుంది. అయినప్పటికీ ఈ వచనంలో ఆ సంబంధపదం ప్రత్యక్షంగా లేదు కాబట్టి ప్రధాన పాఠ్యంలో దాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే వచనంలోని ఉన్నతమైన క్రీస్తు సంబంధిత స్వరాన్ని నిలుపుతూ రూపొందించబడింది. ‘సంపూర్ణత’ అనే ధార్మికంగా బరువున్న పదాన్ని వివరణతో పలుచన చేయలేదు. తెలుగు వాక్యం సహజంగా ఉండేందుకు పదక్రమాన్ని మార్చినా, మూలంలోని సర్వనామం, సంపూర్ణత, నివాస భావం, అలాగే చెప్పని కర్త వల్ల కలిగే వ్యాఖ్యాన ఉద్వేగం కాపాడబడ్డాయి.
