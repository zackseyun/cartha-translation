  text: ఎందుకంటే, సంపూర్ణత అంతా ఆయనలో నివసించడం ఇష్టమైంది.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సంపూర్ణత అంతా ఆయనలో నివసించిందని’ అని కూడా అనువదించవచ్చు. సందర్భంలో ఈ సంధిపదం కారణాన్ని లేదా వివరణను పరిచయం చేయగలదు.
    reason: lexical_alternative
  - marker: b
    text: చాలా అనువాదాలు సూచిత కర్తను స్పష్టం చేస్తూ, ‘తన సంపూర్ణత అంతా ఆయనలో నివసించాలని దేవుడు ఇష్టపడ్డాడు’ లేదా ‘తండ్రి ఇష్టపడ్డాడు’ అని అనువదిస్తాయి. గ్రీకులో ఆ కర్త ప్రత్యక్షంగా చెప్పబడలేదు.
    reason: alternative_reading
  - marker: c
