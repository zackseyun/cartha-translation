source:
  edition: SBLGNT
  text: τοῖς ἐν ⸀Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: te
  text: 'కొలొస్సయిలో ఉన్న పవిత్రులకును, మెస్సీయలో[c] నమ్మకమైన[a] సహోదరులకును[b]: మన తండ్రియైన దేవుని నుండి మీకు కృప, సమాధానం కలుగుగాక.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వసించే.” గ్రీకు πιστοῖς అనే పదం విశ్వసించే వారినిగానీ, నమ్మకంగా ఉండే వారినిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “సహోదరులు” అని ఉంది; సందర్భంలో పౌలు స్త్రీలతో సహా సంఘమంతటినీ ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: 'సంప్రదాయ అనువాదం: “క్రీస్తులో.” Χριστός అనే గ్రీకు బిరుదుకు “మెస్సీయ” అని అర్థం.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: కొలొస్సయిలో ఉన్న ... వారికి
  rationale: గ్రహీతలను వారి స్థలంతో గుర్తించే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగు సంబోధన రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἁγίοις
  choice: పవిత్రులైన
  rationale: దేవునికి ప్రత్యేకపరచబడినవారు అనే ప్రాథమిక భావాన్ని నిలుపుతూ, తరువాతి కాలపు ప్రత్యేక బిరుదు భావాన్ని అనవసరంగా జోడించదు.
- source_word: πιστοῖς
  choice: నమ్మకమైన
  rationale: విశ్వసనీయత లేదా నిబద్ధత అనే భావాన్ని సహజంగా తెలియజేస్తుంది; ‘విశ్వసించే’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచి గ్రీకు పదంలోని అర్థసందిగ్ధతను కాపాడింది.
- source_word: ἀδελφοῖς
  choice: సహోదరులకు
  rationale: గ్రీకులోని పుంలింగ బహువచన రూపాన్ని మూలానికి దగ్గరగా ప్రతిబింబిస్తుంది; సందర్భంలో స్త్రీలు కూడా ఉద్దేశించబడి ఉండవచ్చని పాదసూచిక వివరిస్తుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని ‘మెస్సీయ’గా అనువదించి, పౌలు వాడే ‘లో’ అనే ఐక్యతా భాషను నిలుపుతుంది.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: మీకు కృప, సమాధానం కలుగుగాక
  rationale: గ్రీకు శుభవందనంలోని పదక్రమం, భావాన్ని కాపాడుతూ తెలుగులో సహజమైన ఆశీర్వాద వాక్యంగా రూపొందించింది.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: మన తండ్రియైన దేవుని నుండి
  rationale: πατρὸς ἡμῶνను θεοῦకు వివరణాత్మక సమానాధికార నిర్మాణంగా తీసుకొని, గ్రీకులో లేని సంధిని చేర్చకుండా సహజమైన తెలుగులో వ్యక్తం చేసింది.
theological_decisions:
- issue: ἐν Χριστῷలో Χριστῷను ఎలా అనువదించాలి
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: Χριστός యొక్క బిరుదు భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా అనువదిస్తుంది; సంప్రదాయ రూపమైన ‘క్రీస్తులో’ను పాదసూచికలో కాపాడుతుంది.
- issue: ἀδελφοῖςలో లింగ సూచన
  choice: సహోదరులకు
  alternative: సహోదర సహోదరీలకు
  rationale: గ్రీకు పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; అయితే సంఘమంతా, స్త్రీలతో సహా, ఉద్దేశించబడి ఉండవచ్చనే సందర్భార్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: πιστοῖς యొక్క భావ ఛాయ
  choice: నమ్మకమైన
  alternative: విశ్వసించే
  rationale: వాక్యం విశ్వాసం మరియు విశ్వసనీయత మధ్య ఖచ్చితమైన ఎంపికను బలవంతం చేయదు; అందువల్ల ఒక భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి మరొక సాధ్యమైన భావాన్ని పాదసూచికలో కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే పత్రికా-శుభవందన శైలి. మూలంలోని దీర్ఘ గ్రహీత-వివరణను తెలుగులో సహజంగా ఉంచి, ‘కలుగుగాక’తో గ్రీకు నామవాచక శుభవందనాన్ని స్పష్టమైన ఆశీర్వాదంగా వ్యక్తం చేసింది.
