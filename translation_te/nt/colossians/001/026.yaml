id: COL.1.26
reference: Colossians 1:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ μυστήριον τὸ ἀποκεκρυμμένον ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν,— ⸀νῦν δὲ ἐφανερώθη τοῖς ἁγίοις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/026.yaml
  text: the mystery hidden from the ages and from the generations—but now revealed to his saints[b][a],
translation:
  language: te
  text: యుగాల నుంచీ, తరతరాల నుంచీ దాచబడి ఉన్న మర్మం[a]—కాని ఇప్పుడు అది ఆయన పరిశుద్ధులకు[b] బయలుపరచబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రహస్యం.’ పౌలు వాడుకలో ‘మర్మం’ సాధారణంగా ఒకప్పుడు దాచబడి, ఇప్పుడు బయలుపరచబడిన దైవ ఉద్దేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆయన పవిత్రులకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μυστήριον
  choice: మర్మం
  rationale: పౌలు వాడుకలో ఇది కేవలం కొందరికే తెలిసిన గూఢవిషయం కాదు; ఒకప్పుడు దాచబడి, ఇప్పుడు దేవుడు బయలుపరచిన దైవ ఉద్దేశాన్ని సూచిస్తుంది. ‘మర్మం’ ఈ భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀποκεκρυμμένον
  choice: దాచబడి ఉన్న
  rationale: పూర్వం దాచబడిన చర్య ఫలితంగా కొనసాగిన స్థితిని పరిపూర్ణ కర్మణి కృదంతం సూచిస్తుంది; ‘దాచబడి ఉన్న’ ఆ స్థితినీ కర్మణి భావాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: ἀπὸ τῶν αἰώνων
  choice: యుగాల నుండియు
  rationale: ἀπό లోని ‘నుండి’ భావాన్ని నిలుపుతూ, αἰῶνεςను నిత్యత్వం అనే అమూర్త భావంగా కాక కాలయుగాలుగా వ్యక్తపరుస్తుంది.
- source_word: καὶ ἀπὸ τῶν γενεῶν
  choice: తరతరాల నుండియు
  rationale: ముందున్న ‘యుగాల నుండియు’ అనే సమాంతర నిర్మాణాన్ని నిలుపుతూ, γενεαίను మానవ తరాలుగా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: νῦν δὲ
  choice: కాని ఇప్పుడు
  rationale: గతంలోని దాచబడిన స్థితికీ ప్రస్తుత బయలుపాటుకీ మధ్య ఉన్న బలమైన వ్యత్యాసాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἐφανερώθη
  choice: బయలుపరచబడింది
  rationale: అయోరిస్టు కర్మణి రూపాన్ని సహజంగా నిలుపుతూ, మర్మం వెల్లడించబడిందనే భావాన్ని ఇస్తుంది; వెల్లడించిన కర్తను మూలపాఠం వలె ప్రత్యక్షంగా పేర్కొనదు.
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: ఆయన పరిశుద్ధులకు
  rationale: పౌలు వాడుకలో ἅγιοι దేవునికి ప్రత్యేకపరచబడిన విశ్వాసుల సమాజాన్ని సూచిస్తుంది. ‘పరిశుద్ధులు’ పదం ఆ ఆధ్యాత్మిక, సమాజపరమైన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘ఆయన పరిశుద్ధులు’ అనే పదబంధం ఎవరిని సూచిస్తుంది
  choice: దేవునికి ప్రత్యేకపరచబడిన విశ్వాసుల సమాజం
  alternative: ప్రత్యేకంగా గుర్తింపు పొందిన కొద్దిమంది పవిత్ర వ్యక్తులు; లేదా సాధారణంగా ‘ఆయన ప్రజలు’
  rationale: పౌలు రచనల్లో ἅγιοι సాధారణంగా విశ్వాసులందరినీ దేవునికి ప్రత్యేకపరచబడిన వారిగా సూచిస్తుంది. ‘పరిశుద్ధులు’ అనే అనువాదం ఈ విస్తృత సమాజపరమైన అర్థాన్ని నిలుపుతూ, తరువాతి కాలపు పరిమిత వర్గీకరణను పాఠ్యంలోకి చేర్చదు.
- issue: మర్మం యొక్క స్వభావం
  choice: ఒకప్పుడు దాచబడి, ఇప్పుడు బయలుపరచబడిన దైవ ఉద్దేశం
  alternative: కొందరికే తెలిసే గూఢమైన లేదా అర్థంకాని రహస్యం
  rationale: దాచబడటం–బయలుపరచబడటం అనే వాక్యంలోని వ్యత్యాసమే μυστήριον భావాన్ని నిర్దేశిస్తుంది. అందువల్ల దాని నిజమైన అర్థాన్ని పూర్తిగా వివరించి ఉద్రిక్తతను తొలగించకుండా ‘మర్మం’గా ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని సమాంతరతను ‘యుగాల నుండియు తరతరాల నుండియు’ ద్వారా, దాచబడటం–బయలుపరచబడటం అనే వ్యత్యాసాన్ని ‘కాని ఇప్పుడు’ ద్వారా నిలిపాం. తెలుగు వాక్య స్పష్టత కోసం ‘అది’ చేర్చబడింది; దీనికి మూలపాఠంలోని ‘మర్మం’నే ప్రత్యక్ష పూర్వపదం.
