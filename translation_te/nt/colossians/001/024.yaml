id: COL.1.24
reference: Colossians 1:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: te
  text: ఇప్పుడు మీ కోసం నేను అనుభవిస్తున్న బాధల్లో ఆనందిస్తున్నాను. మెస్సీయ[b] శ్రమల్లో లోటుగా ఉన్నవాటిని నా దేహంలో నేను ఆయన శరీరమైన సంఘం కోసం నింపుతున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెస్సీయ శ్రమల్లో ఇంకా మిగిలి ఉన్నవాటిని నా దేహంలో నేను పూర్తిచేస్తున్నాను.” మెస్సీయ చేసిన ప్రాయశ్చిత్త కార్యంలో లోపం ఉందని పౌలు సూచించడం లేదు; మెస్సీయతోను ఆయన శరీరమైన సంఘంతోను సంబంధమున్న శ్రమల్లో పౌలు పాలుపంచుకోవడం గురించి ఈ వాక్యం చెబుతుంది.
    reason: alternative_reading
  - marker: b
    text: 'గ్రీకు: “క్రీస్తు.” ఇక్కడ Χριστός బిరుదుగా ఉన్నందున “మెస్సీయ” అని అనువదించబడింది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Νῦν
  choice: ఇప్పుడు
  rationale: పౌలు ప్రస్తుత పరిస్థితిని, తన ప్రస్తుత మనోభావాన్ని పరిచయం చేసే సహజమైన కాలసూచక పదం.
- source_word: χαίρω
  choice: ఆనందిస్తున్నాను
  rationale: వర్తమాన క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν
  choice: మీ కోసం నేను అనుభవిస్తున్న బాధల్లో
  rationale: ὑπέρ యొక్క ప్రయోజనార్థక భావాన్ని ‘మీ కోసం’గా ఉంచి, సందర్భం సూచించే పౌలు సొంత బాధలను తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀνταναπληρῶ τὰ ὑστερήματα
  choice: లోటుగా ఉన్నవాటిని ... నింపుతున్నాను
  rationale: మూలంలోని ‘లోటు/మిగులు’ మరియు ‘నింపడం’ అనే బలమైన రూపకాన్ని సిద్ధాంతపరంగా మృదువుచేయకుండా నిలుపుతుంది.
- source_word: τῶν θλίψεων
  choice: శ్రమల్లో
  rationale: ముందున్న παθήματαకు ‘బాధలు’ అని ఇచ్చి, θλίψειςలోని ఒత్తిడి, కష్టం, హింసార్థక ఛాయను ‘శ్రమలు’తో వేరుగా ఉంచుతుంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తున్నందున దాని అభిషిక్త రాజు అనే బిరుదార్థాన్ని నిలుపుతుంది.
- source_word: ἐν τῇ σαρκί μου
  choice: నా దేహంలో
  rationale: ఇక్కడ σάρξ పాపస్వభావాన్ని కాక పౌలు శారీరక, దేహధారిత ఉనికిని సూచిస్తుంది; ‘దేహంలో’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: ఆయన శరీరం కోసం
  rationale: ὑπέρ యొక్క ప్రయోజనార్థక భావాన్నీ, పౌలు ఉపయోగించిన శరీర రూపకాన్నీ నిలుపుతుంది.
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: అంటే సంఘం
  rationale: సంబంధవాచక వాక్యం ‘ఆయన శరీరం’ దేనిని సూచిస్తుందో వివరిస్తుంది; ‘అంటే’ తెలుగులో ఈ గుర్తింపును సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘మెస్సీయ శ్రమల్లో లోటుగా ఉన్నవి’ అనే మాట యొక్క భావం
  choice: మూలంలోని బలమైన, కొంత ఉద్విగ్నమైన వ్యక్తీకరణను ప్రధాన పాఠ్యంలో యథాతథంగా నిలిపి, పౌలు తన దేహంలో వాటిని నింపుతున్నాడని అనువదించడం.
  alternative: మెస్సీయ విమోచన కార్యంలో ఏదో లోపాన్ని పౌలు తన బాధలతో పూరిస్తున్నాడని భావించడం; లేదా ఇది కేవలం అంత్యకాల శ్రమల నిర్ణీత పరిమాణాన్ని సూచిస్తుందని భావించడం.
  rationale: θλίψεις అనే పదం మరియు ‘ఆయన శరీరం కోసం, అంటే సంఘం కోసం’ అనే సందర్భం పౌలు మెస్సీయతోను ఆయన ప్రజల సేవతోను ముడిపడిన కొనసాగుతున్న శ్రమల్లో పాలుపంచుకోవడాన్ని సూచిస్తాయి. అయినా మూలపాఠ్యంలో ఉన్న ‘లోటు’ భావాన్ని అనువాదంలో తొలగించకుండా, విమోచన మరణం అసంపూర్ణమని ఈ వాక్యం చెప్పడం లేదనే వివరణను పాదసూచికలో ఇస్తుంది.
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός పేరు మాత్రంగా కాక బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ ఆ బిరుదార్థాన్ని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘బాధలు/శ్రమలు’ అనే పదభేదంతో παθήματα మరియు θλίψεις మధ్యనున్న స్వల్ప పదార్థ భేదం నిలుపబడింది; ‘నా దేహంలో’ అనే రూపం పాపస్వభావార్థాన్ని అనవసరంగా దిగుమతి చేయకుండా శారీరక బాధను తెలియజేస్తుంది.
