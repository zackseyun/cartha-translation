revisions:
- from: ఇప్పుడు మీ కోసం నేను అనుభవిస్తున్న బాధల్లో ఆనందిస్తున్నాను. మెస్సీయ[b] శ్రమల్లో లోటుగా ఉన్నవాటిని ఆయన శరీరం కోసం, అంటే సంఘం కోసం, నా దేహంలో నేను నింపుతున్నాను.[a]
  to: ఇప్పుడు మీ కోసం నేను అనుభవిస్తున్న బాధల్లో ఆనందిస్తున్నాను. మెస్సీయ[b] శ్రమల్లో లోటుగా ఉన్నవాటిని నా దేహంలో నేను ఆయన శరీరమైన సంఘం కోసం నింపుతున్నాను.[a]
  rationale: The revision preserves the source's tension-filled wording about what is lacking while making the final phrase clearly identify the church as the Messiah's body. It also completes the alternative-rendering footnote by retaining ‘in my flesh.’ No disputed interpretation has been introduced into the main text.
