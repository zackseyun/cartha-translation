source:
  edition: SBLGNT
  text: ⸀καθὼς ἐμάθετε ἀπὸ Ἐπαφρᾶ τοῦ ἀγαπητοῦ συνδούλου ἡμῶν, ὅς ἐστιν πιστὸς ὑπὲρ ⸀ἡμῶν διάκονος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow servant, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: te
  text: మీరు మా ప్రియమైన తోటి దాసుడైన[a] ఎపఫ్రా నుండి నేర్చుకున్నట్లే, అతడు మా తరఫున[b] మెస్సీయ యొక్క[c] నమ్మకమైన పరిచారకుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తోటి దాసుడు’కు గ్రీకు పదం σύνδουλος; అక్షరార్థంగా, ఒకే యజమాని కింద మరొకరితో కలిసి దాసుడిగా ఉన్న వ్యక్తి.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని గ్రీకు ప్రతుల్లో ‘మా తరఫున’కు బదులు ‘మీ తరఫున’ అని ఉంది.
    reason: textual_variant
  - marker: c
    text: 'గ్రీకు: Χριστοῦ (క్రీస్తు యొక్కది); ఇక్కడ ఆ పదం బిరుదుగా వాడబడినందున ‘మెస్సీయ యొక్క’ అని అనువదించబడింది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: నేర్చుకున్నట్లే
  rationale: ముందటి వాక్యంలోని సువార్తను వారు నిజంగా గ్రహించిన విధానంతో ఈ మాటను అనుసంధానించే పోలిక భావాన్ని నిలుపుతుంది.
- source_word: ἐμάθετε ἀπὸ Ἐπαφρᾶ
  choice: ఎపఫ్రా దగ్గర నేర్చుకున్నారు
  rationale: ἀπό ఇక్కడ నేర్చుకున్న మూలాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో వ్యక్తి దగ్గర నేర్చుకోవడం సహజమైన ప్రయోగం.
- source_word: ἀγαπητοῦ συνδούλου ἡμῶν
  choice: మా ప్రియమైన తోటి దాసుడు
  rationale: ἀγαπητός లోని ఆప్యాయతను ‘ప్రియమైన’ నిలుపుతుంది; σύνδουλος ఒకే యజమాని కింద కలిసి దాసులుగా ఉన్న సంబంధాన్ని సూచించేందున ‘తోటి దాసుడు’ అని అనువదించబడింది.
- source_word: πιστὸς
  choice: నమ్మకమైన
  rationale: ఎపఫ్రా తన సేవలో విశ్వసనీయుడనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὑπὲρ ἡμῶν
  choice: మా తరఫున
  rationale: ὑπέρ తో కూడిన షష్ఠీ విభక్తి ఇక్కడ ప్రతినిధిత్వం లేదా ప్రయోజనం అనే భావాన్ని ఇస్తుంది; ‘మా తరఫున’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: διάκονος
  choice: పరిచారకుడు
  rationale: ఇక్కడ సువార్త సేవ చేసే వ్యక్తిని సూచిస్తుంది; తరువాత ఏర్పడిన సంఘ పదవిని తప్పనిసరిగా సూచించే ‘డీకన్’ అనే సాంకేతిక అర్థాన్ని దిగుమతి చేయదు.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయకు
  rationale: Χριστός ఇక్కడ సేవింపబడే వ్యక్తి యొక్క బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ ఆ బిరుదు యొక్క అర్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: σύνδουλος లోని దాసత్వ రూపకం
  choice: తోటి దాసుడు
  alternative: తోటి సేవకుడు
  rationale: ఈ పదం కేవలం కలిసి సేవ చేయడమే కాక, ఒకే యజమానికి కలిసి చెందినవారనే రూపకాన్ని కలిగి ఉంది. ‘తోటి దాసుడు’ ఆ బంధాన్ని స్పష్టంగా ఉంచుతుంది.
- issue: Χριστός ను బిరుదుగా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός పేరు వలె మాత్రమే కాక బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ దాని అభిషిక్తుడు అనే భావాన్ని పాఠకునికి అందిస్తుంది.
- issue: ὑπὲρ ἡμῶν యొక్క సంబంధార్థం
  choice: మా తరఫున
  alternative: మా కోసం
  rationale: ప్రయోజనం అనే భావంతో పాటు ప్రతినిధిగా సేవ చేయడం అనే సాధ్యమైన భావాన్ని కూడా ‘మా తరఫున’ నిలుపుతుంది.
- issue: ὑπὲρ ἡμῶν వద్ద పాఠాంతరం
  choice: మా తరఫున
  alternative: మీ తరఫున
  rationale: SBLGNT ప్రధాన పాఠంలోని ἡμῶν ను అనుసరించాం; కొన్ని గ్రీకు సాక్ష్యాల్లో ఉన్న ὑμῶν పాఠాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘తోటి దాసుడు’ మూలంలోని బలమైన రూపకాన్ని నిలుపుతుంది; పాదసూచిక దాని భావాన్ని వివరిస్తుంది. వచనం ముందటి వాక్యంతో వ్యాకరణపరంగా అనుసంధానమై ఉన్నందున ‘నేర్చుకున్నట్లే’ అనే నిర్మాణం ఉంచబడింది.
