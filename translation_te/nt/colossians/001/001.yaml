  text: Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother[b],
translation:
  language: te
  text: దేవుని చిత్తం ద్వారా మెస్సీయ యేసు అపొస్తలుడైన పౌలు, సహోదరుడైన తిమోతి—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παῦλος
  choice: పౌలు
  rationale: Παῦλος అనే వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: ἀπόστολος
  choice: అపొస్తలుడు
  rationale: ఇక్కడ ఇది సాధారణ దూతను కాక, పౌలు పరిచర్యకు సంబంధించిన గుర్తింపును సూచిస్తుంది; తెలుగులో స్థిరపడిన బైబిలు పదాన్ని నిలుపుతుంది.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστός ఇక్కడ యేసుకు చెందిన బిరుదుగా అర్థవంతంగా ఉంది; అందువల్ల పేరులా లిప్యంతరీకరించకుండా ‘మెస్సీయ’ అని అనువదించబడింది. షష్ఠీ సంబంధాన్ని ‘అపొస్తలుడు’తో సహజంగా కలిపాం.
- source_word: διὰ θελήματος θεοῦ
  choice: దేవుని చిత్తం వల్ల
  rationale: διά + షష్ఠీ ఇక్కడ పౌలు అపొస్తలత్వానికి దేవుని సంకల్పమే ఆధారమని సూచిస్తుంది; ‘వల్ల’ ఆధునిక తెలుగులో సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: Τιμόθεος
  choice: తిమోతి
  rationale: Τιμόθεος అనే వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: ὁ ἀδελφὸς
  choice: సహోదరుడైన
  rationale: గ్రీకు నిర్దిష్టపదంతో ఉన్న ‘సోదరుడు’ క్రైస్తవ సమాజ సంబంధాన్ని సూచిస్తుంది. తెలుగు వాక్యారంభంలో ‘సహోదరుడైన తిమోతి’ సహజంగా ఉండి, మూలంలో లేని ‘మన’ అనే సర్వనామాన్ని చేర్చదు.
theological_decisions:
- issue: Χριστός పదం యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός బిరుదు భావాన్ని ఇంకా కలిగి ఉంది. ‘మెస్సీయ’ ఆ బిరుదు యొక్క అర్థాన్ని స్పష్టంగా నిలుపుతుంది; అయితే ‘క్రీస్తు’ అనేది సంప్రదాయ తెలుగు రూపం.
- issue: ὁ ἀδελφός యొక్క సంబంధ భావం
  choice: సహోదరుడైన
  alternative: మన సహోదరుడైన
  rationale: మూలంలో ‘మన’కు సమానమైన సర్వనామం లేదు. నిర్దిష్టపదం మరియు పత్రికా సందర్భం సమాజ సంబంధాన్ని సూచించినా, దాన్ని అదనపు సర్వనామంతో స్పష్టీకరించకుండా నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా ఆరంభ శైలి. మూలంలోని పదక్రమాన్ని యథాశక్తి నిలుపుతూ, తెలుగులో సహజంగా వినిపించేందుకు ‘దేవుని చిత్తం వల్ల’ను ముందుంచాం. తరువాతి వచనంలోని స్వీకర్తల వాక్యభాగంతో కొనసాగుతుందని సూచించేందుకు చివర దీర్ఘ విరామచిహ్నం వాడాం.
