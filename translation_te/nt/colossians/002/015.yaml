id: COL.2.15
reference: Colossians 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: te
  text: పాలక శక్తులనూ అధికార శక్తులనూ నిరాయుధులను చేసి, వారిని బహిరంగంగా ప్రదర్శించి, ఆయనలో వారిపై విజయోత్సవం జరుపుతూ వారిని జయించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆయనలో” అనే మాటను “దానిలో,” అంటే ముందటి వచనంలో చెప్పిన సిలువలో లేదా సిలువ ద్వారా, అని కూడా అర్థం చేసుకోవచ్చు.
    reason: ἐν αὐτῷ అనే గ్రీకు పదబంధం క్రీస్తును సూచించవచ్చుననే ప్రధాన పఠనంతోపాటు, వెంటనే ముందున్న ‘సిలువ’ను సూచించవచ్చుననే సందర్భపరమైన అవకాశాన్ని కూడా సంరక్షిస్తుంది.
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: నిరాయుధులను చేసి
  rationale: ఈ మధ్యమవాచక కృదంతానికి అక్షరార్థంగా ‘విప్పివేసి/తీసివేసి’ అనే భావం ఉన్నా, జయించిన శక్తుల బలాన్ని తొలగించడం అనే సందర్భోచిత భావాన్ని ‘నిరాయుధులను చేసి’ సహజంగా తెలియజేస్తుంది.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: పాలక శక్తులను, అధికార శక్తులను
  rationale: ఇవి సాధారణ మానవ పాలకులకే పరిమితం కాక, సందర్భంలో ఆధ్యాత్మిక లేదా విశ్వ సంబంధ శక్తులను సూచించవచ్చు; ‘శక్తులు’ అనే పదం ఆ విస్తృతిని నిలుపుతుంది.
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: వారిని బహిరంగంగా ప్రదర్శించి
  rationale: ἐδειγμάτισεν అంటే అందరికీ కనిపించేలా ప్రదర్శించడం; ἐν παρρησίᾳ ఆ చర్య బహిరంగంగా జరిగినదని బలపరుస్తుంది. మూలంలో నేరుగా లేని ‘అవమానించాడు’ అనే వ్యాఖ్యానాన్ని చేర్చలేదు.
- source_word: θριαμβεύσας αὐτούς
  choice: వారిపై విజయోత్సవం జరిపాడు
  rationale: θριαμβεύω విజయ ఊరేగింపు లేదా ఘనవిజయాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేలా విజయోత్సవ రూపకాన్ని నిలిపి, వారిపై సాధించిన విజయాన్ని వ్యక్తం చేసింది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలోనే
  rationale: ఆంగ్ల సంప్రదింపుపాఠంలోని ‘in him’ను అనుసరిస్తూ క్రీస్తును సూచించే పఠనాన్ని ప్రధాన పాఠంలో ఉంచింది; గ్రీకు రూపంలోని సూచనాస్పష్టతను పాదసూచికలో సంరక్షించింది.
theological_decisions:
- issue: క్రియల కర్త ఎవరు?
  choice: తెలుగులో అంతర్లీన ఏకవచన పురుష కర్తను ఉంచడం
  alternative: ‘దేవుడు’ అని స్పష్టంగా చేర్చడం
  rationale: గ్రీకు వాక్యంలో కర్త ప్రత్యక్షంగా పునరుక్తం కాలేదు; ముందరి సందర్భం దేవుణ్ణి సూచించినా, ఈ వచనంలో లేని నామాన్ని చేర్చకుండా మూల నిర్మాణాన్ని నిలిపింది.
- issue: ἐν αὐτῷ యొక్క సూచ్యం
  choice: ‘ఆయనలోనే’—క్రీస్తులో
  alternative: ‘దానిలోనే’ లేదా ‘సిలువ ద్వారా’—సిలువను సూచిస్తూ
  rationale: వ్యాకరణపరంగా మరియు సందర్భపరంగా క్రీస్తు లేదా ముందటి వచనంలోని సిలువ అనే రెండు అనుసంధానాలు చర్చించబడతాయి. ప్రధాన పాఠం అందించిన సంప్రదింపుపాఠాన్ని అనుసరిస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచిక వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. ‘పాలక శక్తులు/అధికార శక్తులు’ అనే పదజాలం మానవ అధికారులకు మాత్రమే భావాన్ని కుదించకుండా ఉంచుతుంది.
