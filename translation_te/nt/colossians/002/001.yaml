revisions:
- from: మీ కోసం, లవొదికయలో ఉన్నవారి కోసం, శరీరరీతిగా నా ముఖాన్ని చూడని వారందరి కోసం నేను ఎంత గొప్ప పోరాటం చేస్తున్నానో మీరు తెలుసుకోవాలని కోరుతున్నాను.[a]
  to: ఎందుకంటే, మీ కొరకు, లవొదికయలో ఉన్నవారి కొరకు, అలాగే నా ముఖాన్ని ప్రత్యక్షంగా చూడని వారందరి కొరకు నేను ఎంత గొప్ప పోరాటం చేస్తున్నానో మీరు తెలుసుకోవాలని కోరుతున్నాను.[a]
  rationale: The revision restores the connective γάρ, replaces an unnatural rendering of ἐν σαρκί with clear modern Telugu, and retains ‘నా ముఖాన్ని’ to reflect πρόσωπόν μου. The footnote supplies the literal Greek-oriented wording and explains its contextual reference to physical presence.
