id: COL.2.1
reference: Colossians 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: te
  text: ఎందుకంటే, మీ కొరకు, లవొదికయలో ఉన్నవారి కొరకు, అలాగే నా ముఖాన్ని ప్రత్యక్షంగా చూడని వారందరి కొరకు నేను ఎంత గొప్ప పోరాటం చేస్తున్నానో మీరు తెలుసుకోవాలని కోరుతున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నన్ను శారీరకంగా’ లేదా ‘స్వయంగా చూడని.’ గ్రీకులో అక్షరార్థంగా ‘శరీరంలో నా ముఖాన్ని చూడని’ అని ఉంది; ఇక్కడ ఇది భౌతికమైన, వ్యక్తిగత సమక్షాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω γὰρ ὑμᾶς εἰδέναι
  choice: మీరు తెలుసుకోవాలని కోరుతున్నాను
  rationale: θέλω ... εἰδέναι నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది. γάρ మునుపటి వాక్యంతో కారణసంబంధాన్ని చూపుతుంది; అయితే ఈ ఒక్క వచనంలో తెలుగు ప్రవాహం కోసం ప్రత్యేక పదంగా అనువదించలేదు.
- source_word: ἡλίκον ἀγῶνα ἔχω
  choice: నేను ఎంత గొప్ప పోరాటం చేస్తున్నానో
  rationale: ἡλίκον పరిమాణం లేదా తీవ్రతను సూచిస్తుంది; ἀγών ఇక్కడ క్రీడాపోటీ కంటే శ్రమతో కూడిన పోరాటాన్ని సూచిస్తుంది. ἔχωను సహజ తెలుగు ప్రయోగంగా కొనసాగుతున్న కార్యరూపంలో తెలిపాం.
- source_word: ὑπὲρ ὑμῶν
  choice: మీ కోసం
  rationale: ὑπέρ ఇక్కడ వారి పక్షాన, వారి మేలు కోసం అనే భావాన్ని ఇస్తుంది.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: లవొదికయలో ఉన్నవారి కోసం
  rationale: నగరంలో ఉన్న ప్రజలను సూచించే substantival prepositional phraseను స్పష్టంగా, సహజంగా అనువదిస్తుంది.
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: చూడని వారందరి కోసం
  rationale: ὅσοιలోని సమగ్ర భావాన్ని ‘వారందరి’ నిలుపుతుంది; గ్రీకు perfect ఇక్కడ ఇప్పటివరకు ప్రత్యక్షంగా చూడని స్థితిని సూచిస్తుంది.
- source_word: τὸ πρόσωπόν μου ἐν σαρκί
  choice: శరీరరీతిగా నా ముఖాన్ని
  rationale: πρόσωπον యొక్క ‘ముఖం’ రూపాన్ని, ἐν σαρκί యొక్క భౌతిక ప్రత్యక్షతను సాధ్యమైనంత పారదర్శకంగా నిలుపుతుంది; అర్థాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: ἐν σαρκίలో σάρξ అనువాదం
  choice: శరీరరీతిగా
  alternative: ప్రత్యక్షంగా / శరీరంతో
  rationale: ఇక్కడ σάρξ పాపస్వభావాన్ని కాక, పౌలు భౌతికంగా సమక్షంలో ఉండటాన్ని సూచిస్తుంది. ‘శరీరరీతిగా’ మూలపదానికి దగ్గరగా ఉండి, ‘ప్రత్యక్షంగా’ అనే భావాన్ని పాదసూచికలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పోరాటం’ పౌలు చేస్తున్న తీవ్రమైన ఆధ్యాత్మిక-పాస్టరల్ శ్రమను అనవసరంగా నిర్దిష్టీకరించకుండా నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత వాక్యభాగం చివర ఉంచబడింది.
