id: COL.2.13
reference: Colossians 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὑμᾶς νεκροὺς ὄντας ⸀ἐν τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ· χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/013.yaml
  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: te
  text: మీ అపరాధాలలోను, మీ శరీరానికి సున్నతి లేని స్థితిలోను[b] చనిపోయివున్న మిమ్మల్ని, మన[a] అపరాధాలన్నిటినీ క్షమించి, ఆయన క్రీస్తుతో కలిసి సజీవులుగా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకు పాఠం ఇక్కడ ‘మిమ్మల్ని’ నుండి ‘మన’కు మారుతుంది: ‘మన అపరాధాలన్నిటినీ క్షమించి.’'
    reason: lexical_alternative
  - marker: b
    text: ‘మీ శరీరానికి సున్నతి లేని స్థితి’ అనేది ప్రత్యక్షంగా వారి శరీరానికి సున్నతి చేయని స్థితిని సూచిస్తుంది; ఈ సందర్భంలో దానికి ఆధ్యాత్మిక ప్రాధాన్యం కూడా ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: చనిపోయి ఉన్న
  rationale: గ్రీకు వర్తమాన కృదంత నిర్మాణం సూచించే స్థితిని సహజమైన తెలుగులో నిలుపుతుంది; సందర్భంలో ఇది ఆధ్యాత్మిక మరణాన్ని సూచిస్తుంది.
- source_word: ἐν τοῖς παραπτώμασιν
  choice: అపరాధాలలో
  rationale: ἐν అనే విభక్త్యర్థాన్ని, వారి అపరాధాల పరిధిలో ఉన్న స్థితి అనే పౌలు చిత్రణను కేవలం కారణార్థంగా మార్చకుండా కాపాడుతుంది.
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: మీ శరీరపు సున్నతిలేని స్థితిలో
  rationale: ἀκροβυστία సూచించే సున్నతి చేయించుకోని శారీరక స్థితిని సహజంగా వ్యక్తపరుస్తుంది; σάρξ‌ను ఇక్కడ ‘పాప స్వభావం’గా వ్యాఖ్యానించి తేల్చదు.
- source_word: συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ
  choice: మిమ్మల్ని ఆయన క్రీస్తుతో కలిసి సజీవులుగా చేశాడు
  rationale: కలిసి జీవింపజేయడం అనే సంయుక్త క్రియ బలాన్ని నిలుపుతుంది. సందర్భం (2:12) αὐτός‌కు క్రీస్తే సూచితుడని స్పష్టం చేయడం తెలుగులో సందిగ్ధతను నివారిస్తుంది.
- source_word: χαρισάμενος
  choice: క్షమించాడు
  rationale: χαρίζομαιలోని కృపాపూర్వక క్షమాపణ భావాన్ని సహజమైన ప్రధాన వాక్య సమన్వయంతో అందిస్తుంది; గ్రీకు కృదంతం ప్రధాన క్రియతో సన్నిహితంగా అనుసంధానమై ఉంది.
- source_word: ἡμῖν
  choice: మన
  rationale: మొదటివ్యక్తి బహువచనానికి మారే గ్రీకు పాఠాన్ని ‘మీ’గా సమన్వయపరచకుండా యథాతథంగా నిలుపుతుంది.
- source_word: πάντα τὰ παραπτώματα
  choice: అపరాధాలన్నిటినీ
  rationale: πάντα యొక్క సంపూర్ణతను, ముందు వచ్చిన παράπτωμα పదంతో పదసామ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: τῆς σαρκὸς ὑμῶνలో σάρξ అర్థం
  choice: ప్రధాన పాఠంలో శారీరక అర్థమున్న ‘శరీరం’
  alternative: ‘పాప స్వభావం’ అనే రూపకాలంకార అర్థం
  rationale: సమీప సందర్భంలోని సున్నతి భాష (2:11) ప్రకారం ఇది మొదటిగా సున్నతి చేయించుకోని శారీరక స్థితిని సూచిస్తుంది. ‘పాప స్వభావం’ అని అనువదిస్తే పాఠం నిర్బంధించని వ్యాఖ్యానాన్ని దిగుమతి చేసినట్లవుతుంది; అయినా సందర్భంలో ఆధ్యాత్మిక ప్రాధాన్యం ఉంది.
- issue: σὺν αὐτῷలో αὐτός సూచించే వ్యక్తి
  choice: క్రీస్తు
  alternative: విస్తృతంగా దేవుడు
  rationale: 2:12లో క్రీస్తుతో సమాధి చేయబడటం, ఆయనతో లేపబడటం అనే తక్షణ సందర్భం కారణంగా సూచితుడు క్రీస్తే. తెలుగులో కర్తయైన ‘ఆయన’తో మరో ‘ఆయన’ గందరగోళం రాకుండా పేరును స్పష్టం చేయడం అవసరం.
- issue: రెండవ వ్యక్తి ὑμᾶς నుండి మొదటి వ్యక్తి ἡμῖνకు మార్పు
  choice: ‘మిమ్మల్ని’ నుండి ‘మన’కు మార్పును నిలుపడం
  alternative: అంతటా ‘మీ’ అని సమన్వయపరచడం
  rationale: గ్రీకు వ్యక్తి మార్పు నిజమైన పాఠ్య లక్షణం; పౌలు తనను కూడా చేర్చుకొని విశ్వాసుల పరిధిని విస్తరించే అవకాశాన్ని అనువాదం తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరమైన శైలిలో రూపొందించబడింది. ‘సున్నతిలేని స్థితి’ సాంస్కృతిక-శారీరక భావాన్ని నిలుపుతుంది. గ్రీకులోని ‘మీరు/మనం’ మార్పును ఉద్దేశపూర్వకంగా కాపాడి పాదటిప్పణిలో తెలిపాం.
