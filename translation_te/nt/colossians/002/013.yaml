revisions:
- from: అపరాధాలలోనూ, మీ శరీరపు సున్నతిలేని స్థితిలోనూ చనిపోయి ఉన్న మిమ్మల్ని ఆయన క్రీస్తుతో కలిసి సజీవులుగా చేశాడు; మన అపరాధాలన్నిటినీ క్షమించాడు.[a][b]
  to: మీ అపరాధాలలోను, మీ శరీరానికి సున్నతి లేని స్థితిలోను[b] చనిపోయివున్న మిమ్మల్ని, మన[a] అపరాధాలన్నిటినీ క్షమించి, ఆయన క్రీస్తుతో కలిసి సజీవులుగా చేశాడు.
