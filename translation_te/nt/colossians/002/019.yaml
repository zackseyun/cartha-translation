id: COL.2.19
reference: Colossians 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐ κρατῶν τὴν κεφαλήν, ἐξ οὗ πᾶν τὸ σῶμα διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον αὔξει τὴν αὔξησιν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: te
  text: అతడు శిరస్సును గట్టిగా పట్టుకొని ఉండడు.[a] ఆ శిరస్సు నుంచే శరీరమంతా కీళ్లూ స్నాయుబంధాల ద్వారా పోషణ పొందుతూ, ఒకటిగా కలుపబడి,[b] దేవుని నుండి కలిగే ఎదుగుదలతో[c] ఎదుగుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శిరస్సును హత్తుకొని ఉండడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “కీళ్లూ స్నాయుబంధాల ద్వారా పోషణ పొంది, ఒకటిగా అల్లబడి.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “దేవుని ఎదుగుదలను ఎదుగుతుంది.” ఈ పదబంధం దేవుని నుండి వచ్చే లేదా దేవుడు కలిగించే ఎదుగుదలను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατῶν
  choice: గట్టిగా పట్టుకొని ఉండడం
  rationale: కేవలం తాకడం లేదా పట్టుకోవడం కాకుండా, దృఢంగా అంటిపెట్టుకొని నిలిచి ఉండడాన్ని ఈ పదం సూచిస్తుంది.
- source_word: κεφαλήν
  choice: శిరస్సు
  rationale: శరీర రూపకాన్ని నిలుపుతూ, సందర్భంలో క్రీస్తును సూచించే గౌరవప్రదమైన సహజ తెలుగు పదం.
- source_word: ἐξ οὗ
  choice: ఆ శిరస్సు నుంచే
  rationale: సంబంధసర్వనామం ముందున్న ‘శిరస్సు’ను సూచిస్తుంది; ‘నుంచే’ శరీరానికి సరఫరా, ఐక్యత, ఎదుగుదల అక్కడి నుంచే వస్తాయని తెలియజేస్తుంది.
- source_word: πᾶν τὸ σῶμα
  choice: శరీరమంతా
  rationale: ఒకే శరీరం సంపూర్ణంగా ఉద్దేశించబడిందనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἁφῶν
  choice: కీళ్లు
  rationale: శరీర భాగాలు కలిసే స్థానాలు అనే శరీరరూపక భావానికి స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: συνδέσμων
  choice: స్నాయుబంధాలు
  rationale: భాగాలను బంధించి ఉంచే శరీర నిర్మాణాలను సూచిస్తుంది; ‘కీళ్లు’తో కలిసి రూపకంలోని రెండు అంశాలను నిలుపుతుంది.
- source_word: ἐπιχορηγούμενον
  choice: అవసరమైనవన్నీ పొంది
  rationale: పోషణ మాత్రమే అని అర్థాన్ని కుదించకుండా, శరీరానికి కావలసిన సరఫరా మరియు తోడ్పాటు అందుతున్న విస్తృత భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: συμβιβαζόμενον
  choice: కలిపి ఉంచబడి
  rationale: శరీర భాగాలు ఒక సమగ్ర ఐక్యతగా జతచేయబడి నిలిచే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: αὔξει
  choice: ఎదుగుతుంది
  rationale: శరీర రూపకాన్ని కొనసాగిస్తూ జీవసంబంధమైన పెరుగుదలను సహజంగా తెలియజేస్తుంది.
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: దేవుని నుండి కలిగే ఎదుగుదలతో
  rationale: దేవుడే ఎదుగుతున్నాడనే అపార్థాన్ని నివారించి, ఎదుగుదలకు దేవుడు మూలమనే సందర్భోచిత భావాన్ని ఇస్తుంది; గ్రీకు నిర్మాణంలోని సంక్షిప్తతను పాదసూచికలో నిలిపింది.
theological_decisions:
- issue: τὴν αὔξησιν τοῦ θεοῦ లోని τοῦ θεοῦ షష్ఠీవిభక్తి భావం
  choice: దేవుని నుండి కలిగే ఎదుగుదల—దేవుడు మూలం
  alternative: ‘దేవుని ఎదుగుదల’ లేదా ‘దేవునికి చెందిన ఎదుగుదల’
  rationale: తక్షణ సందర్భంలో శరీరం శిరస్సు నుండి జీవం, సరఫరా, ఐక్యత పొంది ఎదుగుతుంది. అందువల్ల దేవుడు ఎదుగుదలకు మూలమనే పఠనం సందర్భానికి సరిపోతుంది; అయినా గ్రీకు పదబంధపు నిజమైన సంక్షిప్తతను, సాధ్యమైన విస్తృత భావాన్ని పాదసూచికలో చూపించాం.
- issue: ‘శిరస్సు’ అనే రూపకంలోని సూచన
  choice: సందర్భంలో క్రీస్తును సూచించే శిరస్సు
  alternative: కేవలం శరీరంలోని తల అనే సామాన్య అర్థం
  rationale: కొలొస్సయులు 1:18; 2:10 మరియు ఈ వాక్యంలోని శరీర రూపకం ప్రకారం శిరస్సు క్రీస్తును సూచిస్తుంది; అయితే అనువాదంలో ‘క్రీస్తు’ అని చేర్చకుండా మూలరూపకాన్నే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘శిరస్సు–శరీరం–కీళ్లు–స్నాయుబంధాలు’ అనే ఏకరీతి శరీర రూపకం నిలుపబడింది. ప్రధాన పాఠం సహజంగా ఉండేలా చేసి, గ్రీకు షష్ఠీవిభక్తి సంక్షిప్తతను పాదసూచికలో వెల్లడించాం.
