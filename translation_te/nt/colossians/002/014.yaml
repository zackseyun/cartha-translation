revisions:
- from: మనకు వ్యతిరేకంగా ఉండి, శాసనాలతో కూడిన మన రుణపత్రాన్ని[a] ఆయన తుడిచివేశాడు. దానిని సిలువకు మేకులతో కొట్టి, మన మధ్యనుండి తొలగించివేశాడు[b].
  to: ఆయన శాసనాలలో వ్యక్తమైన, మనకు వ్యతిరేకంగా ఉన్న రుణపత్రాన్ని[a] తుడిచివేశాడు; దానిని సిలువకు మేకులతో కొట్టి, మార్గం నుండి తొలగించివేశాడు[b].
