source:
  edition: SBLGNT
  text: ἐξαλείψας τὸ καθ’ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου προσηλώσας αὐτὸ τῷ σταυρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: te
  text: ఆయన శాసనాలలో వ్యక్తమైన, మనకు వ్యతిరేకంగా ఉన్న రుణపత్రాన్ని[a] తుడిచివేశాడు; దానిని సిలువకు మేకులతో కొట్టి, మార్గం నుండి తొలగించివేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అప్పు అంగీకారపత్రం,” “చేతివ్రాత పత్రం.” గ్రీకు పదం చేతితో వ్రాసిన అప్పు చీటీని లేదా చట్టబద్ధమైన బాధ్యతను నమోదు చేసిన పత్రాన్ని సూచించగలదు. “శాసనాలలో వ్యక్తమైన” అనే మాటకు “శాసనాలతో కూడిన” లేదా “శాసనాలతో ఏర్పడిన” అనే భావాలు కూడా సాధ్యమే.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మధ్యలోనుండి తీసివేశాడు.” ఇది అడ్డుగా ఉన్న దానిని తొలగించడం అనే నుడికారం.
    reason: idiom
lexical_decisions:
- source_word: ἐξαλείψας
  choice: తుడిచివేశాడు
  rationale: వ్రాతను చెరిపివేయడం లేదా పూర్తిగా తొలగించడం అనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: χειρόγραφον
  choice: రుణపత్రం
  rationale: చేతితో వ్రాసిన అప్పు అంగీకారపత్రం లేదా చట్టబద్ధమైన బాకీ పత్రం అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; విస్తృత ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇస్తుంది.
- source_word: καθ’ ἡμῶν
  choice: మనకు వ్యతిరేకంగా
  rationale: మన మీద ప్రతికూలంగా నిలిచినదనే భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: τοῖς δόγμασιν
  choice: శాసనాలతో కూడిన
  rationale: దత్తివిభక్తి యొక్క కచ్చితమైన సంబంధం వివాదాస్పదమైనందున, రుణపత్రం శాసనాలలో వ్యక్తమైందా లేదా వాటితో ఏర్పడిందా అనే రెండు భావాలకు చోటు ఇస్తుంది; దీన్ని మోషే ధర్మశాస్త్రమని ముందుగానే పరిమితం చేయదు.
- source_word: ὑπεναντίον
  choice: వ్యతిరేకంగా ఉండి
  rationale: ప్రతికూలంగా లేదా ఎదురుగా నిలిచిందనే భావాన్ని అతిశయోక్తి లేకుండా వ్యక్తపరుస్తుంది.
- source_word: ἦρκεν ἐκ τοῦ μέσου
  choice: మన మధ్యనుండి తొలగించివేశాడు
  rationale: పూర్తయి నిలిచివున్న తొలగింపు చర్యను, అడ్డుగా ఉన్నదాన్ని మధ్యనుండి తీసివేయడం అనే గ్రీకు నుడికారాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: προσηλώσας αὐτὸ τῷ σταυρῷ
  choice: దానిని సిలువకు మేకులతో కొట్టి
  rationale: సిలువకు మేకులతో బిగించడం అనే స్పష్టమైన చిత్రాన్ని, తొలగింపుకు సాధనం లేదా దానితో కూడిన చర్యగా నిలుపుతుంది.
theological_decisions:
- issue: χειρόγραφον τοῖς δόγμασιν యొక్క అర్థం
  choice: శాసనాలతో కూడిన మన రుణపత్రం
  alternative: మోషే ధర్మశాస్త్రమే; పాపాల బాకీచీటి; న్యాయపరమైన నేరారోపణ పత్రం
  rationale: మూలంలోని పత్రం–రుణం రూపకాన్ని నిలుపుతూ, దానిని ఏకైక ధార్మిక వ్యవస్థతో సమానపరచదు. τοῖς δόγμασιν సంబంధంలోని నిజమైన సందిగ్ధతను పాదటిప్పణిలో సూచిస్తుంది.
- issue: ἦρκεν యొక్క కర్త
  choice: ఆయన—సందర్భంలో దేవుడు
  alternative: కర్తను స్పష్టంగా పేర్కొనకుండా ఉంచడం
  rationale: విస్తృత వాక్యసందర్భంలో దేవుడే క్రియచేసేవాడిగా ఉన్నాడు; తెలుగు వాక్యానికి సహజత్వం కోసం సర్వనామాన్ని స్పష్టంగా ఉంచడం సిద్ధాంతపరమైన అదనపు వ్యాఖ్యానం కాదు.
- issue: ప్రయోజనం/సహచర్యంగా προσηλώσας
  choice: సిలువకు మేకులతో కొట్టి, తొలగించివేశాడు
  alternative: తొలగించి, తరువాత సిలువకు మేకులతో కొట్టాడు
  rationale: గ్రీకు కృదంతం ప్రధాన క్రియతో దగ్గరి సంబంధాన్ని సూచిస్తుంది; తెలుగు నిర్మాణం మేకులతో కొట్టడాన్ని తొలగింపుకు సంబంధించిన చర్యగా చూపుతుంది, కఠిన కాలక్రమాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘రుణపత్రం’ న్యాయపరమైన పత్రం మరియు బాకీ అనే రెండు భావాలను నిలుపుతుంది. రెండు పాదటిప్పణి సూచికలూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
