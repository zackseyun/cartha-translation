  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ⸀ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: te
  text: కాబట్టి, ఆహారం లేదా పానీయం విషయంలోగానీ,[a] పండుగ, కొత్త నెల ఉత్సవం, లేదా సబ్బాతు దినాల విషయంలోగానీ[b] ఎవ్వరూ మీపై తీర్పు తీర్చనివ్వకండి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఆహారం మరియు పానీయాలకు సంబంధించిన నియమాల విషయంలో.
    reason: cultural_note
  - marker: b
    text: ‘పండుగ, కొత్త నెల ఉత్సవం, సబ్బాతు దినాలు’ అనే వరుస యూదుల పవిత్ర కాలపట్టికలోని వార్షిక, నెలవారీ, వారపు ఆచారాలను ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
  - marker: c
    text: లేదా, ‘ఎవ్వరూ మిమ్మల్ని దోషులుగా తీర్పు తీర్చనివ్వకండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ οὖν τις
  choice: కాబట్టి ... ఎవ్వరూ ... తీర్చనివ్వకండి
  rationale: οὖν ముందున్న వాదనతో తార్కిక సంబంధాన్ని చూపుతుంది; μή + వర్తమాన ఆజ్ఞార్థక క్రియ నిషేధాన్ని తెలియజేస్తుంది; τις ఈ నిర్మాణంలో సహజంగా ‘ఎవ్వరూ’ అవుతుంది.
- source_word: ὑμᾶς κρινέτω
  choice: మీపై తీర్పు తీర్చనివ్వకండి
  rationale: κρίνω ఇక్కడ ఆచారాల ఆధారంగా ఒకరిని మదింపు చేయడం లేదా దోషిగా తీర్పు చెప్పడం అనే భావం కలిగి ఉంది. ‘మీపై తీర్పు తీర్చడం’ ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: తినే ఆహారం విషయంలోగానీ, తాగే పానీయం విషయంలోగానీ
  rationale: βρῶσις, πόσις పదాలు క్రియను లేదా దాని వస్తువును సూచించగలవు. ఇక్కడ ఆహారపానీయాలకు సంబంధించిన ఆచారాల జాబితా ఉన్నందున వస్తు/విషయార్థం అనుకూలం; పదాల క్రియాత్మక ఛాయను కూడా తెలుగు పదబంధం ఉంచుతుంది.
- source_word: ἐν μέρει ἑορτῆς
  choice: పండుగ ... విషయంలో
  rationale: ἐν μέρει ఇక్కడ ‘ఒక భాగంలో’ కాక ‘సంబంధించి/విషయంలో’ అనే నుడికారార్థం. ἑορτή మతపరమైన పండుగను సూచిస్తుంది.
- source_word: νουμηνίας
  choice: అమావాస్య ఉత్సవం
  rationale: νουμηνία నెలవారీ కొత్తచంద్ర దిన ఆచారాన్ని సూచిస్తుంది. తెలుగు సాంస్కృతిక వాడుకలో ‘అమావాస్య’ స్పష్టంగా ఉన్నా, ఇది కేవలం చంద్రదశ కాదని తెలియజేయడానికి ‘ఉత్సవం’ చేర్చబడింది.
- source_word: σαββάτων
  choice: విశ్రాంతి దినాలు
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, సాధారణ తెలుగు పాఠకునికి అర్థమయ్యే విధంగా శబ్బాత్ దినాలను ‘విశ్రాంతి దినాలు’గా ఇచ్చాం; ప్రత్యేక యూదు కాలపట్టిక భావాన్ని పాదసూచన వివరిస్తుంది.
theological_decisions:
- issue: పేర్కొన్న ఆచారాల స్వభావం
  choice: ఆహారపానీయాలు, పండుగలు, అమావాస్య ఉత్సవం, విశ్రాంతి దినాల విషయంలో ఇతరులు విశ్వాసులపై తీర్పు తీర్చకూడదనే నిషేధంపైనే వాక్యాన్ని కేంద్రీకరించడం
  alternative: ఈ వాక్యం ఆ ఆచారాలన్నిటినీ పూర్తిగా రద్దు చేస్తుందని లేదా ఇది కేవలం మానవ కల్పిత నియమాలనే ఉద్దేశిస్తుందని స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం ఈ విషయాల్లో తీర్పు తీర్చడాన్ని నేరుగా నిషేధిస్తుంది; ఆ ఆచారాల కొనసాగింపు లేదా రద్దు గురించిన విస్తృతమైన వేదాంత వివాదాన్ని ఈ వాక్యం ఒక్కటే పూర్తిగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. జాబితాలోని సమాంతర నిర్మాణాన్ని ‘విషయంలోగానీ’తో నిలిపి, ప్రధాన నిషేధాన్ని వాక్యాంతంలో సహజంగా ఉంచాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
