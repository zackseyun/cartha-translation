revisions:
- from: కాబట్టి, తినే ఆహారం విషయంలోగానీ, తాగే పానీయం విషయంలోగానీ,[a] పండుగ, అమావాస్య ఉత్సవం, లేదా విశ్రాంతి దినాల విషయంలోగానీ[b] ఎవ్వరూ మీపై తీర్పు తీర్చనివ్వకండి.[c]
  to: కాబట్టి, ఆహారం లేదా పానీయం విషయంలోగానీ,[a] పండుగ, కొత్త నెల ఉత్సవం, లేదా సబ్బాతు దినాల విషయంలోగానీ[b] ఎవ్వరూ మీపై తీర్పు తీర్చనివ్వకండి.[c]
  rationale: The revision corrects the historically and lexically significant new-moon error without importing an interpretation of the practices. It also uses ‘సబ్బాతు దినాలు’ to retain the specific referent of σαββάτων and streamlines the food-and-drink wording. The word order and repeated ‘విషయంలోగానీ’ preserve the Greek list and its focus on judgment concerning these matters.
