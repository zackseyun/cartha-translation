revisions:
- from: 'మీరు మెస్సీయతో కలిసి లోకపు మూలసూత్రాల నుండి చనిపోయారైతే[a], ఇంకా లోకంలో జీవిస్తున్నవారిలా విధినియమాలకు ఎందుకు లోబడుతున్నారు[b]:'
  to: 'మీరు మెస్సీయతో కలిసి లోకపు మూలసూత్రాలకు[a] చనిపోయారైతే, ఇంకా లోకంలో జీవిస్తున్నవారిలా నియమాలకు ఎందుకు లోబడుతున్నారు[b]:'
  rationale: The revision changes the Telugu case construction from ‘నుండి చనిపోయారు’ to the idiomatic and semantically precise ‘కు చనిపోయారు,’ expressing death to the worldly στοιχεῖα and resulting separation from them. It also simplifies ‘విధినియమాలు’ to natural ‘నియమాలు’ and moves both footnote anchors to their precise referents. The conditional force, ambiguity of στοιχεῖα, and middle/passive range of δογματίζεσθε are preserved.
