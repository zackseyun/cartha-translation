id: COL.2.20
reference: Colossians 2:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: te
  text: 'మీరు మెస్సీయతో కలిసి లోకపు మూలసూత్రాలకు[a] చనిపోయారైతే, ఇంకా లోకంలో జీవిస్తున్నవారిలా నియమాలకు ఎందుకు లోబడుతున్నారు[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా ‘లోకపు మూలశక్తులు’; మరొక సాధ్యార్థం: ‘లోకపు మూలకాలు.’'
    reason: στοιχεῖα అనే పదానికి ప్రాథమిక సూత్రాలు, విశ్వశక్తులు/ఆత్మిక శక్తులు, లేదా భౌతిక మూలకాలు అనే అర్థాలు సాధ్యమైనందున.
  - marker: b
    text: లేదా ‘నియమాల కింద ఎందుకు ఉంచబడుతున్నారు?’
    reason: δογματίζεσθε అనే మధ్యమ/కర్మణి రూపం స్వచ్ఛందంగా లోబడడాన్నీ, నియమాలకు లోబరచబడడాన్నీ సూచించగలదు.
lexical_decisions:
- source_word: Εἰ
  choice: అయితే
  rationale: షరతును సూచించే గ్రీకు రూపాన్ని నిలుపుతుంది; సందర్భంలో ఆ షరతు నిజమని భావించినా, దానిని ‘కాబట్టి’గా మార్చి అర్థాన్ని ముందే నిర్ణయించదు.
- source_word: ἀπεθάνετε
  choice: చనిపోయారైతే
  rationale: నిర్ణాయకమైన గత సంఘటనను సూచించే aorist భావాన్ని సహజమైన తెలుగు షరతు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: σὺν Χριστῷ
  choice: మెస్సీయతో కలిసి
  rationale: Χριστόςను కేవలం వ్యక్తినామంలా కాక అభిషిక్తుని బిరుదుగా వ్యక్తం చేస్తుంది; σύν సూచించే సహభాగితను ‘కలిసి’ స్పష్టం చేస్తుంది.
- source_word: ἀπὸ τῶν στοιχείων τοῦ κόσμου
  choice: లోకపు మూలసూత్రాల నుండి
  rationale: ἀπόలోని వేరుపాటు భావాన్ని ‘నుండి’ సహజంగా తెలియజేస్తుంది. στοιχεῖα యొక్క మౌలిక సూత్రాలు/మూలకాలు/అధిభౌతిక శక్తులు అనే విస్తృత అర్థపరిధిని ప్రధాన పాఠంలో పూర్తిగా ఒకే దిశకు పరిమితం చేయకుండా ‘మూలసూత్రాలు’తో అందిస్తుంది.
- source_word: τί
  choice: ఎందుకు
  rationale: ఈ అలంకారిక ప్రశ్నలోని కారణార్థక ప్రయోగానికి సహజమైన తెలుగు రూపం.
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: ఇంకా లోకంలో జీవిస్తున్నవారిలా
  rationale: ὡςతో ఉన్న పోలిక/ఊహ భావాన్ని ‘జీవిస్తున్నవారిలా’ నిలుపుతుంది; వాక్యంలోని విరుద్ధతను తెలుగులో స్పష్టంగా చేయడానికి ‘ఇంకా’ చేర్చబడింది.
- source_word: δογματίζεσθε
  choice: విధినియమాలకు లోబడుతున్నారు
  rationale: మధ్యమ/కర్మణి రూపంలోని ‘నియమాలచేత పాలించబడడం’ లేదా ‘వాటికి తాము లోబడడం’ అనే ద్వంద్వ ఛాయను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పౌలు వాడిన στοιχεῖα పదం యొక్క భావం
  choice: ప్రధాన పాఠంలో ‘మూలసూత్రాలు’
  alternative: ‘మూలశక్తులు’ లేదా ‘మూలకాలు’
  rationale: ఈ పదం లోకాన్ని నడిపే ప్రాథమిక వ్యవస్థలను, మూలకాలను, లేదా వ్యక్తిత్వమున్న విశ్వశక్తులను సూచించవచ్చు. ప్రధాన పాఠం ఒక నిర్దిష్ట విశ్వదృక్పథాన్ని బలవంతంగా రుద్దకుండా విస్తృత భావాన్ని ఉంచుతుంది; ఇతర సాధ్యార్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- issue: δογματίζεσθεలో మధ్యమ లేదా కర్మణి భావం
  choice: ‘విధినియమాలకు లోబడుతున్నారు’
  alternative: ‘విధినియమాల కింద ఉంచబడుతున్నారు’
  rationale: పాఠకుల భాగస్వామ్యాన్ని సూచించే మధ్యమ భావానికీ, బయటి నియంత్రణను సూచించే కర్మణి భావానికీ గ్రీకు రూపం వీలు కల్పిస్తుంది. ప్రధాన అనువాదం సందర్భంలోని ఆచరణాత్మక లోబడడాన్ని చూపుతూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. తదుపరి వచనంలోని ఆజ్ఞల జాబితాకు వాక్యం నేరుగా దారితీస్తున్నందున చివర ద్విబిందువు ఉంచబడింది. [a], [b] సూచికలు ప్రధాన పాఠంలో సంబంధిత పదబంధాల వెంట ఉన్నాయి.
