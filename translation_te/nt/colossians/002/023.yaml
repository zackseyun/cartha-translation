  to: ఇవి స్వయంకల్పిత ఆరాధనలో[b], వినయంలో, శరీరాన్ని కఠినంగా శ్రమపెట్టడంలో జ్ఞానమున్నట్లుగా కనిపిస్తాయి[a]. అయితే శరీర సంబంధమైన వాంఛల తృప్తిని నిరోధించడంలో వీటికి ఏ విలువా లేదు[c][d].
  rationale: ఎంచుకున్న సందర్భానుగుణ అర్థాన్ని నిలుపుతూ, జ్ఞానపు పైపై రూపాన్ని మరింత ఖచ్చితంగా వ్యక్తపరిచాం. σάρξను ఒకే నిర్దిష్ట అర్థానికి పరిమితం చేయకుండా, దేహం గురించిన ముందరి పదంతో ఉన్న భేదాన్ని కూడా వీలైనంత కాపాడాం. క్లిష్టమైన చివరి వాక్యభాగానికి ఉన్న ప్రత్యామ్నాయాలను పాదసూచికలో, అదనపు ఉద్దేశ-భావాన్ని చేర్చకుండా, తటస్థంగా సవరించాం.
