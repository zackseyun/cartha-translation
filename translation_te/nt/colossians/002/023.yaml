id: COL.2.23
reference: Colossians 2:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: te
  text: ఇవి స్వయంకల్పిత ఆరాధనలో[b], వినయంలో, శరీరాన్ని కఠినంగా శ్రమపెట్టడంలో జ్ఞానమున్నట్లుగా కనిపిస్తాయి[a]. అయితే శరీర సంబంధమైన వాంఛల తృప్తిని నిరోధించడంలో వీటికి ఏ విలువా లేదు[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “జ్ఞానమున్నవనే పేరు వీటికి ఉంది.”'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “తమంతట తామే విధించుకున్న ఆరాధన”; సంప్రదాయంగా, “సంకల్ప ఆరాధన.”'
    reason: lexical_alternative
  - marker: c
    text: 'చివరి వాక్యభాగం అర్థం క్లిష్టమైనది. మరో విధంగా: “శరీర సంబంధమైన వాంఛల తృప్తి కొరకు వీటికి ఏ గౌరవమూ లేదు,” లేదా “శరీర సంబంధమైన వాంఛల తృప్తిని ఎదుర్కోవడంలో వీటికి ఏ గౌరవమూ లేదు.”'
    reason: alternative_reading
  - marker: d
    text: ఇక్కడ “శరీర సంబంధమైన” అని అనువదించిన పదం పతిత మానవ కోరికలను సూచించవచ్చు; పౌలు ఇతర సందర్భాల్లో ఈ పదాన్ని ఉపయోగించిన విధానంతో పోల్చండి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: ఇవి
  rationale: మునుపటి వచనాల్లో చెప్పిన నియమాలను తిరిగి సూచిస్తుంది; తెలుగులో సహజమైన నిర్దేశక రూపం.
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: జ్ఞానం ఉన్నవాటిలా నిజానికి కనిపిస్తాయి
  rationale: λόγον ἔχειν అనే నుడికారం పేరు, ప్రతిష్ఠ లేదా పైకి కనిపించే రూపాన్ని సూచించగలదు; μέν లోని అంగీకార భావాన్ని ‘నిజానికి’ తెలియజేస్తుంది.
- source_word: ἐθελοθρησκίᾳ
  choice: స్వయంకల్పిత ఆరాధన
  rationale: దేవుని ఆజ్ఞకన్నా మానవ సంకల్పం నుంచి పుట్టిన ఆరాధనా ఆచారాన్ని సూచించే అరుదైన పదం; ‘స్వయంకల్పిత’ దాని ప్రతికూల సందర్భార్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ταπεινοφροσύνῃ
  choice: వినయం
  rationale: పదానికి సాధారణ అర్థాన్ని నిలుపుతుంది; ఇక్కడ అది కృత్రిమమైన లేదా తపస్సుకు సంబంధించిన వినయం కావచ్చనే వ్యంగ్య ఛాయను సందర్భమే తెలియజేస్తుంది.
- source_word: ἀφειδίᾳ σώματος
  choice: శరీరాన్ని కఠినంగా శ్రమపెట్టడం
  rationale: శరీరానికి ఉపశమనం ఇవ్వకుండా కఠినంగా వ్యవహరించే తపోనిష్ఠను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οὐκ ἐν τιμῇ τινι
  choice: వీటికి ఏ విలువా లేదు
  rationale: క్లిష్టమైన ఈ సందర్భంలో τιμήని గౌరవం కంటే ప్రయోజనం లేదా విలువగా గ్రహించడం ముందున్న పైపై జ్ఞానానికి తగిన వ్యత్యాసాన్ని ఇస్తుంది.
- source_word: πρὸς πλησμονὴν
  choice: అదుపు చేయడంలో
  rationale: తపోనియమాలు శరీర సంబంధమైన తృప్తిని నిరోధించలేవనే సందర్భానుగుణ భావాన్ని అందిస్తుంది; గ్రీకు పదబంధంలోని సంక్షిప్తత వల్ల ఇతర నిర్మాణాలు సాధ్యమని పాదసూచిక తెలియజేస్తుంది.
- source_word: τῆς σαρκός
  choice: శరీర వాంఛలను
  rationale: ఇక్కడ σάρξ కేవలం భౌతిక దేహం కాక పతిత మానవ కోరికలను సూచించే అవకాశం ఉంది; ‘శరీర వాంఛలు’ సందర్భార్థాన్ని సహజంగా తెలుపుతూనే పాదసూచికలో పదంలోని విస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός అనే క్లిష్టమైన చివరి భాగం అర్థం
  choice: ఈ తపోపద్ధతులకు శరీర వాంఛలను అదుపు చేయడంలో నిజమైన విలువ లేదు.
  alternative: ‘శరీర వాంఛలను తృప్తిపరచడానికే తప్ప వీటికి ఏ గౌరవమూ లేదు’ లేదా ‘శరీరాన్ని గౌరవించకుండా, దాని తృప్తిని నిరోధించడానికి ఉద్దేశించినవి.’
  rationale: గ్రీకు వాక్యనిర్మాణం సంక్షిప్తంగా ఉండి వివాదాస్పదంగా ఉంది. సందర్భంలో పౌలు పైకి జ్ఞానంగా కనిపించే తపోనియమాలు శరీర సంబంధమైన కోరికలను అణచలేవని విమర్శిస్తున్నట్లు గ్రహించడం వాదన ప్రవాహానికి బాగా సరిపోతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో నిలిపాం.
- issue: σάρξ యొక్క సందర్భార్థం
  choice: ప్రధాన పాఠ్యంలో ‘శరీర వాంఛలు’ అని ఇచ్చి, పతిత మానవ కోరికల భావాన్ని సందర్భానుగుణంగా చూపడం.
  alternative: ‘శరీరం’ లేదా ‘మాంసం’ అని అక్షరార్థంగా ఇవ్వడం.
  rationale: తెలుగులో ‘మాంసం’ ప్రధానంగా దేహమాంసం లేదా ఆహారాన్ని సూచించి అపార్థం కలిగించవచ్చు. అయినప్పటికీ σάρξలోని దేహం–పతిత కోరికల మధ్య ఉద్వేగాన్ని పాదసూచికలో స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువదించబడింది. అరుదైన ἐθελοθρησκίᾳకు ‘స్వయంకల్పిత ఆరాధన’ను వాడి ప్రతికూల ఛాయను నిలిపాం. క్లిష్టమైన చివరి భాగానికి సందర్భానుగుణ ప్రధాన పఠనాన్ని ఇచ్చి, నిజమైన భాషా అస్పష్టతను పాదసూచికలో భద్రపరిచాం.
