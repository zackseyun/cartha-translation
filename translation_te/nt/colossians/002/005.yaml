id: COL.2.5
reference: Colossians 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: te
  text: ఎందుకంటే, నేను శరీరరీత్యా మీకు దూరంగా ఉన్నప్పటికీ, ఆత్మలో మీతోనే ఉన్నాను[a], మీ క్రమబద్ధతను, మెస్సీయలో మీ విశ్వాసం యొక్క దృఢత్వాన్ని[b] చూస్తూ ఆనందిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆత్మలో’ అనేది ఇక్కడ పౌలు తన ఆత్మలో వారితో ఉన్నాడని ప్రధానంగా సూచించవచ్చు; పరిశుద్ధాత్మ ద్వారా వారితో ఉన్నాడనే అర్థం కూడా సాధ్యమే.
    reason: alternative_reading
  - marker: b
    text: ‘విశ్వాసం యొక్క దృఢత్వం’ అనే మాటను ‘విశ్వాసం యొక్క స్థిరత్వం’ అని కూడా అనువదించవచ్చు. లేదా, ‘మెస్సీయపట్ల మీ విశ్వసనీయత యొక్క దృఢత్వం’ అనే అర్థం సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ σαρκί
  choice: శరీరరీత్యా
  rationale: ఇక్కడ σάρξ పాపస్వభావాన్ని కాక పౌలు భౌతికంగా అక్కడ లేకపోవడాన్ని సూచిస్తుంది. ‘శరీరరీత్యా’ అనే రూపం ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, తరువాతి ‘ఆత్మలో’ అనే వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: τῷ πνεύματι
  choice: ఆత్మలో
  rationale: ‘శరీరరీత్యా’ అనే పదబంధానికి వ్యతిరేకంగా ఇది పౌలు భౌతికేతరంగా వారితో ఉన్నాడనే భావాన్ని ప్రధానంగా సూచిస్తుంది; అయితే పరిశుద్ధాత్మను సూచించే అవకాశాన్ని అనువాదం పూర్తిగా మూసివేయదు.
- source_word: τὴν τάξιν
  choice: మీ క్రమబద్ధతను
  rationale: τάξις క్రమం, సక్రమమైన ఏర్పాటు లేదా క్రమశీలతను సూచిస్తుంది. సందర్భంలోని ప్రశంసాత్మక భావాన్ని ‘క్రమబద్ధత’ సహజంగా వ్యక్తం చేస్తుంది; అనవసరమైన సైనిక భావాన్ని రుద్దదు.
- source_word: τὸ στερέωμα
  choice: దృఢత్వాన్ని
  rationale: στερέωμα స్థిరత్వం, గట్టితనం లేదా చెదరని దృఢతను సూచిస్తుంది. విశ్వాసంతో సహజంగా కలిసే ‘దృఢత్వం’ మూలంలోని స్థిరమైన ఆధార భావాన్ని నిలుపుతుంది.
- source_word: τῆς ... πίστεως ὑμῶν
  choice: మీకున్న విశ్వాసపు
  rationale: πίστιςకు ప్రధాన అర్థంగా ‘విశ్వాసం’ తీసుకున్నాం. ‘విశ్వసనీయత’ అనే సాధ్యమైన భావఛాయను పాదసూచికలో ఉంచాం.
- source_word: εἰς Χριστόν
  choice: మెస్సీయలో
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది; అందువల్ల ‘మెస్సీయ’ అని అనువదించాం. విశ్వాసానికి లక్ష్యాన్ని సూచించే εἰςను తెలుగులో సహజమైన ‘మెస్సీయలో విశ్వాసం’గా ఇచ్చాం.
- source_word: χαίρων καὶ βλέπων
  choice: చూస్తూ ఆనందిస్తున్నాను
  rationale: రెండు వర్తమాన అసమాపక క్రియల సమకాలీన సంబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంతో వ్యక్తం చేస్తుంది; βλέπωను మానసికంగా గమనించడం మాత్రమే అని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: ‘ఆత్మలో’ అన్న పదానికి సూచితార్థం
  choice: పౌలు శరీరంగా దూరంగా ఉన్నప్పటికీ తన ఆత్మలో వారితో ఉన్నాడనే భావాన్ని ప్రధాన పాఠంలో ఉంచడం
  alternative: పరిశుద్ధాత్మ ద్వారా వారితో ఉన్నాడనే భావం
  rationale: శరీరం–ఆత్మ అనే ప్రత్యక్ష వ్యత్యాసం పౌలు వ్యక్తిగత, భౌతికేతర సాన్నిధ్యాన్ని బలపరుస్తుంది. అయినా గ్రీకు పదంలోని సాధ్యమైన పరిశుద్ధాత్మ సూచనను పాదసూచికలో నిలిపాం.
- issue: Χριστόν అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός పేరులా కాక బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని బిరుదు భావాన్ని స్పష్టంగా ఉంచాం.
- issue: πίστις అర్థం
  choice: విశ్వాసం
  alternative: మెస్సీయపట్ల విశ్వసనీయత
  rationale: ఈ నిర్మాణంలో ‘మెస్సీయలో విశ్వాసం’ అత్యంత సహజమైన పఠనం. అయినా πίστιςకు ఉండగల ‘విశ్వసనీయత’ భావాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. మూలంలోని శరీరం–ఆత్మ వ్యత్యాసాన్ని సహజమైన తెలుగులో నిలిపి, చివరి రెండు కర్మపదాలను ‘చూస్తూ ఆనందిస్తున్నాను’తో సమతుల్యంగా కలిపాం. ‘క్రమబద్ధత,’ ‘దృఢత్వం’ అనే పదాలు సంఘ స్థిరత్వాన్ని తెలియజేస్తాయి గాని మూలంలో లేని సైనిక లేదా మతశాఖాపరమైన భావాలను చేర్చవు.
