source:
  edition: SBLGNT
  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: te
  text: బాప్తిస్మంలో[a] ఆయనతో కలిసి పాతిపెట్టబడిన మీరు, అందులో ఆయనతో కలిసి లేపబడ్డారు; ఆయనను మృతులలోనుండి లేపిన దేవుని కార్యంపై విశ్వాసం ద్వారా ఇది జరిగింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంబంధ సర్వనామం బాప్తిస్మాన్ని కాక మెస్సీయను సూచిస్తుందని తీసుకుంటే, ‘అందులో’కు బదులు ‘ఆయనలో’ అని అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘విశ్వాసం’ను ‘నమ్మకం’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం కొన్ని సందర్భాల్లో ‘విశ్వసనీయత’ అనే భావాన్నీ కలిగి ఉంటుంది; అయితే ఇక్కడ ‘విశ్వాసం’ ప్రధాన అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνταφέντες
  choice: ఆయనతో పాటు పాతిపెట్టబడిన
  rationale: అయోరిస్టు కర్మణి కృదంతంలోని పూర్తయిన చర్యను, అలాగే συν- ఉపసర్గలోని ‘తో పాటు’ భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ βαπτισμῷ
  choice: బాప్తిస్మంలో
  rationale: ἐν లోని స్థలార్థక, సాధనార్థక భావాల మధ్య ఉన్న విస్తృతిని అతిగా నిర్ణయించకుండా సహజమైన తెలుగులో చూపుతుంది.
- source_word: ἐν ᾧ
  choice: ఆ బాప్తిస్మంలోనే
  rationale: సమీప పూర్వపదమైన βαπτισμῷను ప్రధాన సూచ్యంగా తీసుకుంటుంది; ‘నే’ ద్వారా అదే పరిధిలో పాతిపెట్టబడటం, లేపబడటం అనే అనుసంధానం స్పష్టమవుతుంది.
- source_word: συνηγέρθητε
  choice: ఆయనతో పాటు లేపబడ్డారు
  rationale: కర్మణి క్రియను, συν- ఉపసర్గలోని సహ-లేపబడటం అనే భావాన్ని రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: διὰ τῆς πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: ఇక్కడ πίστιςకు ప్రధానమైన వ్యక్తిగత విశ్వాసం/నమ్మకం అనే భావాన్ని సంప్రదాయబద్ధంగాను సహజంగాను వ్యక్తపరుస్తుంది.
- source_word: τῆς ἐνεργείας τοῦ θεοῦ
  choice: దేవుని కార్యశక్తిపై
  rationale: ἐνέργεια దేవుని క్రియాశీలమైన, ఫలప్రదమైన శక్తిని సూచిస్తుంది. πίστεωςతో సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘పై’ వాడబడింది; కేవలం నైరూప్యమైన ‘శక్తి’గా కుదించదు.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: ఆయనను మృతులలోనుండి లేపిన
  rationale: దేవుణ్ణి గుర్తించే ఆర్టిక్యులర్ కృదంతాన్ని సహజమైన విశేషణ ఉపవాక్యంగా అందిస్తూ పునరుత్థాన భాషను నిలుపుతుంది.
theological_decisions:
- issue: ἐν ᾧ యొక్క సూచ్యం
  choice: బాప్తిస్మాన్ని సూచించే ‘ఆ బాప్తిస్మంలోనే’
  alternative: మెస్సీయను సూచించే ‘ఆయనలోనే’
  rationale: వ్యాకరణపరంగా అత్యంత సమీప పూర్వపదం βαπτισμῷ. అయినా గ్రీకు రూపం మెస్సీయను సూచించే అవకాశాన్ని పూర్తిగా తొలగించదు; అందువల్ల ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- issue: బాప్తిస్మ భాష యొక్క సిద్ధాంతార్థం
  choice: బాప్తిస్మం, క్రీస్తుతో సహ-సమాధి, సహ-పునరుత్థానం, విశ్వాసం మధ్య ఉన్న బలమైన సంబంధాన్ని యథాతథంగా నిలుపడం
  alternative: దీనిని నిర్దిష్టంగా సంస్కార ప్రభావముగానో, పూర్తిగా ప్రతీకాత్మక చర్యగానో వివరించడం
  rationale: వాక్యం ఈ అంశాలను సన్నిహితంగా కలుపుతుంది, కాని తరువాతి మతశాఖల సిద్ధాంత వివాదాన్ని స్వయంగా తీర్చదు.
- issue: πίστις యొక్క భావం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఈ నిర్మాణంలో దేవుని కార్యశక్తిపై ఉంచే విశ్వాసమే సందర్భానుకూలం; ‘విశ్వసనీయత’ సాధ్యమైన విస్తృత నిఘంటు భావమైనా ఇక్కడ తక్కువ సంభావ్యం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి అర్థమయ్యే శైలి. ‘ఆయనతో పాటు’ అనే పదబంధం రెండు συν- సమాసక్రియల ఐక్యతా భావాన్ని స్పష్టంగా ఉంచుతుంది. పాఠ్యంలో [a], [b] సూచికలు రెండూ చేర్చబడ్డాయి.
