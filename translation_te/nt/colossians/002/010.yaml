translation:
  language: te
  text: మరియు ఆయనలో మీరు సంపూర్ణతతో నింపబడి ఉన్నారు[a]. ఆయనే ప్రతి పాలక శక్తికీ, అధికారానికీ శిరస్సు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సంపూర్ణులుగా చేయబడ్డారు,” లేదా “నింపబడ్డారు.”
    reason: lexical_alternative
  - marker: b
    text: “శిరస్సు” అనే మాట గ్రీకులోని రూపకాన్ని నిలుపుతుంది; ఇక్కడ భావం ఏమిటంటే, ఆయన ప్రతి పాలక శక్తిపైనా, అధికారంపైనా సర్వోన్నతుడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (ముందటి వాక్యంతో కొనసాగింపుగా భావంలో నిలుపబడింది)
  rationale: ఈ సంధాయకం ముందటి వచనంలోని వాదనను కొనసాగిస్తుంది. తెలుగులో వచనం స్వతంత్రంగా సహజంగా వినిపించేందుకు ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా వాక్యానుసంధానంలో దాని భావాన్ని నిలిపాం.
- source_word: ἐστὲ … πεπληρωμένοι
  choice: మీరు సంపూర్ణత పొందారు
  rationale: పూర్తయిన క్రియ ఫలితంగా కొనసాగుతున్న స్థితిని సూచించే perfect passive నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. ‘సంపూర్ణులు అయ్యారు’ అని అనువదిస్తే నైతిక పాపరాహిత్యమనే అనవసర భావం కలగవచ్చు; ‘సంపూర్ణత పొందారు’ అనేది 2:9లోని సంపూర్ణత భావంతో సంబంధాన్ని నిలుపుతుంది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: క్రీస్తుతో విశ్వాసుల సంబంధం లేదా ఐక్యతను సూచించే పౌలు వాడిన సంక్షిప్తమైన భాషను వ్యాఖ్యానంతో విస్తరించకుండా నిలుపుతుంది.
- source_word: ὅς ἐστιν
  choice: ఆయనే
  rationale: సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజమైన రెండవ వాక్యంగా మార్చి, అది క్రీస్తునే సూచిస్తోందని స్పష్టంగా ఉంచుతుంది.
- source_word: κεφαλή
  choice: శిరస్సు
  rationale: గ్రీకు రూపకాన్ని యథాతథంగా నిలుపుతుంది. సందర్భంలో ఆధిపత్యం భావం ఉన్నప్పటికీ, ప్రధాన పాఠ్యంలో నేరుగా ‘పాలకుడు’ అని వ్యాఖ్యానించలేదు.
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: ప్రతి పాలకునికీ అధికారానికీ
  rationale: సకల పాలక శక్తులపై, అధికారాలపై క్రీస్తు ఉన్నతత్వాన్ని సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక భాషలో తెలియజేస్తుంది. ἀρχήకి ఈ సందర్భంలో వ్యక్తిగత పాలకుడు లేదా పాలక శక్తి అనే భావం ఉండవచ్చు; ‘పాలకుడు’ ప్రధాన భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: క్రీస్తులో విశ్వాసులు పొందిన సంపూర్ణత
  choice: విశ్వాసులు క్రీస్తులో సంపూర్ణత పొందారని చెప్పి, ఆ సంపూర్ణత స్వభావాన్ని మరింత సంకుచితంగా నిర్వచించలేదు.
  alternative: రక్షణకు కావలసినదేదీ వారికి కొదవలేదని చెప్పడం; లేదా వారు దైవిక సంపూర్ణతతో నింపబడ్డారని స్పష్టీకరించడం.
  rationale: గ్రీకు వాక్యం క్రీస్తులో లభించే సంపూర్ణతలో విశ్వాసుల భాగస్వామ్యాన్ని ప్రకటిస్తుంది; అయితే అది పాపరహిత పరిపూర్ణత సిద్ధాంతాన్నో, కేవలం న్యాయపరమైన స్థితినో ప్రత్యేకంగా నిర్దేశించదు. అనువాదం ఆ విస్తృతతను నిలుపుతుంది.
- issue: పాలకులు, అధికారాల పట్ల κεφαλή భావం
  choice: ‘శిరస్సు’ అనే రూపకాన్ని నిలుపుతూ, సందర్భానుసారం క్రీస్తు సమస్త పాలకులు మరియు అధికారాలపై సర్వోన్నతుడని సూచించడం.
  alternative: క్రీస్తు ప్రతి పాలకునికీ అధికారానికీ మూలం అని అర్థం చేసుకోవడం.
  rationale: కొన్ని సందర్భాల్లో κεφαλή అర్థంపై చర్చ ఉన్నప్పటికీ, కొలొస్సయుల పత్రికలోని విశ్వసంబంధ శక్తుల సందర్భం ఇక్కడ సర్వోన్నతత్వం లేదా ఆధిపత్య భావాన్నే బలపరుస్తుంది. అయినా ప్రధాన పాఠ్యం గ్రీకు రూపకాన్ని తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గంభీరతను మరియు పౌలు వాడిన ‘ఆయనలో,’ ‘శిరస్సు,’ ‘సంపూర్ణత’ వంటి theological imageryని నిలుపుతూ రూపొందించబడింది.
