source:
  edition: SBLGNT
  text: Μὴ ἅψῃ μηδὲ γεύσῃ μηδὲ θίγῃς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/021.yaml
  text: “Do not handle[a], nor taste, nor touch,”
translation:
  language: te
  text: “పట్టుకోవద్దు[a], రుచి చూడవద్దు, ముట్టుకోవద్దు”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ముట్టుకోవద్దు, రుచి చూడవద్దు, ముట్టుకోవద్దు.’ మొదటి క్రియ (ἅψῃ)కు ‘ముట్టుకోవడం’ లేదా ‘పట్టుకోవడం’ అనే అర్థాలు రావచ్చు. చివరి θίγῃς కూడా ‘ముట్టుకోవడం’ అనే అర్థం కలిగి ఉన్నందున, రెండు క్రియల మధ్య తేడాను చూపడానికి ఇక్కడ ‘పట్టుకోవద్దు’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: వద్దు
  rationale: μή అఓరిస్టు సబ్జంక్టివ్‌తో కలిసి నిషేధాన్ని తెలియజేస్తుంది. తెలుగులో క్రియతో కలిసిన ‘వద్దు’ సహజంగా, సంక్షిప్తంగా ఆ నిషేధాన్ని వ్యక్తపరుస్తుంది.
- source_word: ἅψῃ
  choice: పట్టుకోవద్దు
  rationale: ἅπτω మధ్యమ రూపానికి ‘తాకడం,’ ‘పట్టుకోవడం’ అనే అర్థాలు ఉన్నాయి. చివరి θίγῃς నుండి భేదాన్ని నిలుపుతూ, ఇక్కడ ‘పట్టుకోవద్దు’ అని అనువదించడం సహజంగా ఉంటుంది.
- source_word: μηδὲ
  choice: —వద్దు
  rationale: పునరావృతమైన μηδέ నిషేధాలను వరుసగా కలుపుతుంది. తెలుగులో ప్రతి క్రియకు ‘వద్దు’ను పునరావృతం చేయడం దాని సంచిత బలాన్ని సహజంగా నిలుపుతుంది; ప్రత్యేక సంధాయక పదం అవసరం లేదు.
- source_word: γεύσῃ
  choice: రుచి చూడవద్దు
  rationale: γεύομαι యొక్క ప్రత్యక్ష అర్థం ‘రుచి చూడడం.’ తినడం లేదా పాలుపంచుకోవడం అనే విస్తృత భావాన్ని అనవసరంగా చేర్చకుండా మూలార్థాన్ని నిలుపుతుంది.
- source_word: θίγῃς
  choice: ముట్టుకోవద్దు
  rationale: θιγγάνω సాధారణంగా ‘తాకడం, ముట్టుకోవడం’ అని అర్థం. ἅψῃను ‘పట్టుకోవద్దు’గా ఇచ్చినందున, ‘ముట్టుకోవద్దు’ రెండు వేర్వేరు గ్రీకు క్రియల మధ్య తేడాను నిలుపుతుంది.
theological_decisions:
- issue: సందర్భంలో ఈ నిషేధాల స్వభావం
  choice: వివరణాత్మక పదాలు చేర్చకుండా, ఉద్ధరణలాంటి సంక్షిప్త నిషేధాల వరుసగా అనువదించడం
  alternative: ‘దీనిని పట్టుకోవద్దు, దానిని రుచి చూడవద్దు’ అని విస్తరించడం లేదా మానవ నియమాలతో ప్రత్యక్షంగా అనుసంధానించడం
  rationale: ఈ వచనంలోని గ్రీకు పాఠం కేవలం మూడు సంక్షిప్త నిషేధాలను మాత్రమే ఇస్తుంది. సందర్భంలోని వివరణను వచనంలోకి చేర్చకుండా దాని ఆకస్మికతను, వ్యాఖ్యానసంబంధ ఉద్రిక్తతను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన నిషేధ వాక్యాలుగా రూపొందించబడింది. గ్రీకు పాఠంలోని మూడు భాగాల లయను నిలుపుతూ, తెలుగులో సహజమైన ‘వద్దు’ పునరావృతాన్ని ఉపయోగించాం.
