id: COL.2.6
reference: Colossians 2:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: te
  text: కాబట్టి, మీరు ప్రభువైన మెస్సీయ యేసును[a] ఎలాగైతే స్వీకరించారో, అలాగే ఆయనలో నడుచుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు యేసు.”
    reason: Χριστόςను అర్థానువాదంగా ‘మెస్సీయ’ అని లేదా సంప్రదాయ లిప్యంతరీకరణగా ‘క్రీస్తు’ అని ఇవ్వవచ్చు.
lexical_decisions:
- source_word: Ὡς
  choice: ఎలాగైతే … అలాగే
  rationale: కొలొస్సయులు గతంలో యేసును స్వీకరించిన విధానానికీ, ఇప్పుడు ఆయనలో కొనసాగవలసిన నడవడికకూ ఉన్న పోలికను సహజమైన తెలుగులో స్పష్టంగా చూపిస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణను సూచించే అన్వయాన్ని నిలుపుతుంది.
- source_word: παρελάβετε
  choice: స్వీకరించారో
  rationale: అపొస్తలుల బోధను అందుకోవడం, వ్యక్తిగా యేసును అంగీకరించడం అనే రెండు భావసాధ్యతలనూ అనవసరంగా పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: τὸν Χριστὸν Ἰησοῦν
  choice: మెస్సీయ యేసును
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్న భావాన్ని ‘మెస్సీయ’ ద్వారా అనువదిస్తూ, Ἰησοῦς అనే పేరును లిప్యంతరీకరిస్తుంది.
- source_word: τὸν κύριον
  choice: ప్రభువైన
  rationale: κύριος అనే క్రీస్తుసంబంధమైన బిరుదును ‘ప్రభువు’గా నిలుపుతూ, తెలుగు వాక్యంలో యేసుతో సహజంగా అనుసంధానిస్తుంది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: పౌలు ఉపయోగించిన సంక్షిప్తమైన ఐక్యత/సంబంధ భాషను వివరణాత్మకంగా విస్తరించకుండా, దాని భావసమృద్ధి మరియు సందిగ్ధతను కాపాడుతుంది.
- source_word: περιπατεῖτε
  choice: నడుచుకోండి
  rationale: ఇది వర్తమానకాల ఆజ్ఞారూపం. జీవన ప్రవర్తనకు సంబంధించిన పౌలు రూపకాన్ని ‘జీవించండి’ అని సపాటుగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: పౌలు ఉపయోగించిన బిరుదుల వరుసలో Χριστός అనువాదం
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఇక్కడ Χριστός కేవలం పేరులో భాగంగా కాక బిరుదుగా పనిచేస్తుంది. అందువల్ల దాని అర్థాన్ని ‘మెస్సీయ’గా అనువదించాం; సంప్రదాయ రూపమైన ‘క్రీస్తు యేసు’ను పాదసూచికలో ఉంచాం.
- issue: ἐν αὐτῷలోని పౌలు ఐక్యత భాష
  choice: ఆయనలో
  alternative: ఆయనతో ఐక్యమై
  rationale: గ్రీకు మూలం సంక్షిప్తంగా ఉండి, స్థానం, సంబంధం, ఐక్యత వంటి భావాలను మోస్తుంది. ‘ఆయనతో ఐక్యమై’ అని విప్పి చెప్పకుండా మూలంలోని దైవశాస్త్రీయ భావవిస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో ఉంది. ‘నడుచుకోండి’ అనే సుపరిచిత బైబిలీయ రూపకాన్ని నిలుపుతూ, ‘ఎలాగైతే … అలాగే’ నిర్మాణంతో గ్రీకు పోలికను సహజంగా వ్యక్తం చేసింది.
