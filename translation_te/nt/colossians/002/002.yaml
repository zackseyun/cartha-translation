source:
  edition: SBLGNT
  text: ἵνα παρακληθῶσιν αἱ καρδίαι αὐτῶν, ⸀συμβιβασθέντες ἐν ἀγάπῃ καὶ εἰς ⸂πᾶν πλοῦτος⸃ τῆς πληροφορίας τῆς συνέσεως, εἰς ἐπίγνωσιν τοῦ μυστηρίου τοῦ ⸀θεοῦ, Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/002.yaml
  text: so that their hearts may be encouraged[a], having been knit together in love and unto all the riches of the full assurance of understanding, unto the knowledge of the mystery of God, Messiah[d][c][b],
translation:
  language: te
  text: వారి హృదయాలు ప్రోత్సాహం పొందాలని[a], వారు ప్రేమలో ఏకపరచబడి[b], అవగాహనకు సంబంధించిన సంపూర్ణ నిశ్చయత యొక్క సమస్త సంపదను పొంది, దేవుని మర్మమైన మెస్సీయను[d][e] సంపూర్ణంగా తెలుసుకోవాలని[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆదరణ పొందాలని’ లేదా ‘బలపరచబడాలని’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం ధైర్యపరచడం, ఓదార్చడం, అంతరంగంగా బలపరచడం వంటి భావాలను కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రేమలో సన్నిహితంగా ఏకం చేయబడి’ అని కూడా అనువదించవచ్చు. ఈ క్రియ కలిపి ఉంచడం లేదా దగ్గరగా జతచేయడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘పూర్తి జ్ఞానాన్ని పొందాలని’ అని కూడా అనువదించవచ్చు. ἐπίγνωσις అనే గ్రీకు పదం లోతైన లేదా పరిపూర్ణ జ్ఞానాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: d
    text: గ్రీకు వాక్యం ‘దేవుని మర్మం, మెస్సీయ’ అని చాలా సంక్షిప్తంగా ఉంది. ఇక్కడ మెస్సీయను దేవుని మర్మంతో సమానాధికారంగా ఉంచినట్లు ఈ అనువాదం గ్రహిస్తుంది. ‘మర్మమైన మెస్సీయ’ అనే రూపం ఆ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
    reason: alternative_reading
  - marker: e
    text: కొన్ని ప్రతుల్లో ‘దేవుని, అనగా తండ్రి యొక్క, మరియు మెస్సీయ యొక్క మర్మం’ వంటి పొడవైన పాఠభేదాలు ఉన్నాయి. ఈ అనువాదం అందించిన చిన్న గ్రీకు పాఠాన్ని అనుసరిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: παρακληθῶσιν
  choice: ప్రోత్సాహం పొందేలా
  rationale: ఈ సందర్భంలో అంతరంగ బలాన్ని, ధైర్యాన్ని, ఆదరణను సూచించే విస్తృత భావాన్ని ‘ప్రోత్సాహం పొందడం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καρδίαι
  choice: హృదయాలు
  rationale: గ్రీకు రూపకాన్ని నిలుపుతూ మనిషి అంతరంగాన్ని సూచించే సుపరిచితమైన బైబిలు పదం.
- source_word: συμβιβασθέντες
  choice: ఒక్కటిగా కలుపబడేలా
  rationale: ప్రేమ అనే పరిధిలో విశ్వాసులు సన్నిహితంగా ఏకం చేయబడడమే ఇక్కడ ప్రధాన భావం; బోధించబడడం అనే తక్కువ సంభావ్య అర్థాన్ని ఎంచుకోలేదు.
- source_word: ἐν ἀγάπῃ
  choice: ప్రేమలో
  rationale: వారు ఏకం చేయబడే పరిధిని లేదా బంధాన్ని సరళంగా సూచిస్తుంది.
- source_word: εἰς πᾶν πλοῦτος
  choice: సమస్త సంపదను పొందేలా
  rationale: εἰς సూచించే లక్ష్యం లేదా ఫలితాన్ని తెలుగులో సహజమైన ప్రయోజనార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: πληροφορίας τῆς συνέσεως
  choice: అవగాహనవల్ల కలిగే సంపూర్ణ నిశ్చయత
  rationale: సరైన అవగాహనకు సంబంధించిన దృఢమైన, నిండైన నమ్మకాన్ని తెలియజేస్తుంది; గ్రీకు షష్ఠీ సంబంధాన్ని తెలుగులో స్పష్టంగా కానీ అతిగా నిర్దేశించకుండా అందిస్తుంది.
- source_word: ἐπίγνωσιν
  choice: సంపూర్ణంగా తెలుసుకోవడం
  rationale: సాధారణ సమాచారాన్ని మించిన లోతైన లేదా పరిపూర్ణ జ్ఞాన భావాన్ని సహజమైన తెలుగు క్రియారూపంలో వ్యక్తం చేస్తుంది.
- source_word: μυστηρίου
  choice: మర్మం
  rationale: ఒకప్పుడు దాచబడి ఇప్పుడు వెల్లడైన దేవుని ఉద్దేశాన్ని సూచించే పౌలు వాడుకకు ‘మర్మం’ తగిన, గౌరవప్రదమైన పదం.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστόςను వ్యక్తిపేరులా కాక అభిషిక్తుడనే బిరుదుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: τοῦ μυστηρίου τοῦ θεοῦ, Χριστοῦ లోని సంక్షిప్త అన్వయ సంబంధం
  choice: ‘దేవుని మర్మాన్ని—మెస్సీయను’ అని సమానాధికార సంబంధాన్ని డాష్‌తో చూపించడం
  alternative: ‘దేవుని మర్మమైన మెస్సీయను’ లేదా అక్షరార్థంగా ‘దేవుని మర్మం, మెస్సీయ’
  rationale: అందించిన చిన్న గ్రీకు పాఠంలో Χριστοῦ ‘దేవుని మర్మం’ ఏమిటో సమానాధికారంగా గుర్తిస్తున్నట్లు బలంగా కనిపిస్తుంది. అయితే ‘అంటే’ వంటి వివరణాత్మక పదాన్ని మూలంలో లేనప్పుడు చేర్చకుండా, గ్రీకు సంక్షిప్తతను మరియు కొంత అనిశ్చితిని డాష్ నిలుపుతుంది.
- issue: Χριστός యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: గ్రీకు పదంలోని ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు స్వభావాన్ని స్పష్టంగా నిలుపుతుంది; ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మూలంలోని ἵνα ఆధారిత ప్రయోజనార్థక ఉపవాక్య స్వభావాన్ని వరుసగా ‘-ేలా’ రూపాలతో నిలిపాం; ముందటి వచనంతో ఉన్న వాక్య సంబంధాన్ని భర్తీ చేయడానికి కొత్త ప్రధాన క్రియను చేర్చలేదు.
