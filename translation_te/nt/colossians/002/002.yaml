revisions:
- from: వారి హృదయాలు ప్రోత్సాహం పొందేలా[a], వారు ప్రేమలో ఒక్కటిగా కలుపబడేలా[b], అవగాహనవల్ల కలిగే సంపూర్ణ నిశ్చయత అనే సమస్త సంపదను పొందేలా, దేవుని మర్మాన్ని—మెస్సీయను[d][e]—సంపూర్ణంగా తెలుసుకునేలా[c].
  to: వారి హృదయాలు ప్రోత్సాహం పొందాలని[a], వారు ప్రేమలో ఏకపరచబడి[b], అవగాహనకు సంబంధించిన సంపూర్ణ నిశ్చయత యొక్క సమస్త సంపదను పొంది, దేవుని మర్మమైన మెస్సీయను[d][e] సంపూర్ణంగా తెలుసుకోవాలని[c].
  rationale: 'The revision corrects two fidelity-and-usage concerns without changing the passage’s meaning: it renders the genitive relation around ‘full assurance of understanding’ more neutrally, and it replaces a strained double-accusative dash construction with a natural Telugu appositional phrase. It also retains the passive participial force of συμβιβασθέντες more closely.'
