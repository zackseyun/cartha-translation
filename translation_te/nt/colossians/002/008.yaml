id: COL.2.8
reference: Colossians 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: te
  text: తత్వశాస్త్రం మరియు వట్టి మోసం ద్వారా ఎవరూ మిమ్మల్ని చెరపట్టకుండా జాగ్రత్తపడండి; అవి మానవ సంప్రదాయానికి అనుగుణంగా, లోకపు మూలసూత్రాలకు అనుగుణంగా[a], మెస్సీయకు అనుగుణంగా మాత్రం కావు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లోకపు మూల ఆత్మశక్తులు.” గ్రీకు పదబంధం ప్రాథమిక సూత్రాలను లేదా విశ్వసంబంధ ఆత్మశక్తులను సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో “క్రీస్తు”; ఇక్కడ బిరుదార్థం ప్రధానంగా ఉన్నందున “మెస్సీయ” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: ఎవరూ ... చెరపట్టకుండా జాగ్రత్తపడండి
  rationale: వర్తమాన ఆజ్ఞారూపంలోని హెచ్చరిక భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔσται ὁ συλαγωγῶν
  choice: మిమ్మల్ని చెరపట్టకుండా
  rationale: సొత్తుగా పట్టుకొని తీసుకుపోవడం అనే συλαγωγέω రూపకాన్ని స్పష్టంగా నిలుపుతుంది; గ్రీకు పరివ్యాప్త క్రియారూపంలోని సంభావ్య ముప్పును హెచ్చరిక నిర్మాణంలో సహజంగా అందిస్తుంది.
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: తత్వశాస్త్రం, వట్టి మోసం ద్వారా
  rationale: διά సూచించే సాధనార్థాన్ని ‘ద్వారా’తో చూపి, రెండు సమన్వయ పదాలను వేరువేరుగానే ఉంచుతుంది; ‘వట్టి’ κενῆς లోని సారహీనతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: మానవ సంప్రదాయం ప్రకారం
  rationale: κατά లోని ప్రమాణం లేదా అనుసరణ భావాన్ని, లింగనిరపేక్షమైన ἀνθρώπων అర్థాన్ని కాపాడుతుంది.
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: లోకపు మూలసూత్రాల ప్రకారం
  rationale: στοιχεῖα కు సాధ్యమైన ప్రాథమిక నియమాలు/అంశాలు అనే భావాన్ని ప్రధాన పాఠ్యంలో ఇస్తూ, ఆత్మశక్తులు అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: οὐ κατὰ Χριστόν
  choice: మెస్సీయ ప్రకారం కాకుండా
  rationale: Χριστός యొక్క బిరుదార్థాన్ని స్పష్టంగా తెలియజేస్తూ, మానవ సంప్రదాయం మరియు లోకపు στοιχεῖα తో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: στοιχεῖα τοῦ κόσμου యొక్క అర్థం
  choice: లోకపు మూలసూత్రాలు
  alternative: లోకపు మూల ఆత్మశక్తులు
  rationale: పౌలు వాడుకలో ఈ పదబంధం ప్రాథమిక సూత్రాలను గానీ విశ్వసంబంధ ఆత్మశక్తులను గానీ సూచించవచ్చు. ప్రధాన పాఠ్యం ఒక అర్థాన్ని పూర్తిగా ఖరారు చేయకుండా సాధారణ రూపాన్ని ఉపయోగిస్తుంది; ముఖ్యమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంటుంది.
- issue: Χριστός ను బిరుదుగా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వాక్యంలో Χριστός, అనుసరించవలసిన ప్రమాణంగా మానవ సంప్రదాయానికి వ్యతిరేకంగా నిలుస్తున్నందున బిరుదార్థం స్పష్టంగా ఉంది; గ్రీకు రూపానికి దగ్గరైన సాధారణ ప్రత్యామ్నాయాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే హెచ్చరిక శైలి. దీర్ఘ గ్రీకు వాక్యంలోని వ్యత్యాసాన్ని డాష్‌లతో స్పష్టపరిచింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
