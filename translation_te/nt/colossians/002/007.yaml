revisions:
- from: ఆయనలో వేరుపాతబడినవారై, ఆయనలో కట్టబడుతూ, మీరు బోధించబడిన ప్రకారం విశ్వాసంలో[a] స్థిరపరచబడుతూ, కృతజ్ఞతతో పొంగిపొర్లుతూ ఉండండి.
  to: ఆయనలో వేర్లు పాతబడి, ఆయనలో నిర్మించబడుతూ, మీరు బోధ పొందిన ప్రకారం విశ్వాసంలో[a] స్థిరపరచబడుతూ, కృతజ్ఞతతో పొంగిపొర్లుతూ ఉండండి.
  rationale: The revision corrects an unnatural rooted-metaphor expression, clarifies the ongoing construction metaphor, and refines the footnote’s Telugu terminology for the alternative ‘faithfulness’ sense. It retains the Greek participial progression, the pronoun-based reference to Christ, the ambiguity of πίστις, and the verse’s connection to the preceding exhortation.
