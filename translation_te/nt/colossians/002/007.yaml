review_pass:
  verdict: revise
  source_fidelity: The draft preserves the sequence of participles, the agricultural and construction metaphors, the passive sense of being made firm, and the likely content-oriented sense of τῇ πίστει. However, “వేరుపాతబడినవారై” is not idiomatic Telugu and does not clearly convey the rooted metaphor. The added “ఉండండి” is a reasonable way to make this verse readable as a Telugu continuation of the governing exhortation in 2:6.
  naturalness: Replacing the awkward compound with “వేర్లు పాతబడి” yields natural modern Telugu. “నిర్మించబడుతూ” is clearer and more idiomatic than the underspecified “కట్టబడుతూ” for the continuing construction metaphor. “బోధ పొందిన ప్రకారం” is more natural than “మీరు బోధించబడిన ప్రకారం.”
  terminology: “విశ్వాసం” appropriately retains πίστις without doctrinal over-specification. The footnote should use “విశ్వాస్యత” rather than “విశ్వసనీయత” for the possible sense ‘faithfulness’; the latter more commonly denotes reliability/trustworthiness. “కృతజ్ఞతతో” adequately conveys ἐν εὐχαριστίᾳ in idiomatic Telugu.
  issues:
  - severity: medium
    issue: అసహజమైన “వేరుపాతబడినవారై”
    rationale: This is not a standard or readily intelligible Telugu expression for having been rooted. “వేర్లు పాతబడి” preserves the metaphor and the resulting-state sense naturally.
  - severity: low
    issue: “కట్టబడుతూ” అనే నిర్మాణ రూపకం అస్పష్టంగా ఉంది
    rationale: In this context, “నిర్మించబడుతూ” more clearly expresses the ongoing passive construction/building-up metaphor.
  - severity: low
    issue: పాదసూచికలో ‘faithfulness’కు “విశ్వసనీయత”
    rationale: “విశ్వాస్యత” better represents faithfulness in this semantic discussion, whereas “విశ్వసనీయత” ordinarily means reliability.
  revised_text: ఆయనలో వేర్లు పాతబడి, ఆయనలో నిర్మించబడుతూ, మీరు బోధ పొందిన ప్రకారం విశ్వాసంలో[a] స్థిరపరచబడుతూ, కృతజ్ఞతతో పొంగిపొర్లుతూ ఉండండి.
