id: COL.2.7
reference: Colossians 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ ⸀βεβαιούμενοι τῇ πίστει καθὼς ἐδιδάχθητε, ⸀περισσεύοντες ἐν εὐχαριστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: te
  text: ఆయనలో వేర్లు పాతబడి, ఆయనలో నిర్మించబడుతూ, మీరు బోధ పొందిన ప్రకారం విశ్వాసంలో[a] స్థిరపరచబడుతూ, కృతజ్ఞతతో పొంగిపొర్లుతూ ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నమ్మకంలో’; మరొక సాధ్యత, ‘విశ్వాస్యతలో.’ గ్రీకు πίστις (పిస్టిస్) అనే పదానికి విశ్వాసం, నమ్మకం, లేదా విశ్వాస్యత అనే అర్థాలు ఉండవచ్చు. అయితే ఇక్కడ ‘విశ్వాసం’ అనేది వారికి బోధించబడిన విశ్వాస సందేశాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: వేరుపాతబడినవారై
  rationale: పూర్తయిన క్రియకు కొనసాగుతున్న ఫలితాన్ని సూచించే పరిపూర్ణ కృదంత భావాన్ని, అలాగే వ్యవసాయ రూపకాన్ని నిలుపుతుంది.
- source_word: ἐποικοδομούμενοι
  choice: కట్టబడుతూ
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న ప్రక్రియను, నిర్మాణ రూపకాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: సమీప సందర్భంలోని క్రీస్తును సూచించే సర్వనామాన్ని పేరుగా విప్పకుండా నిలుపుతుంది.
- source_word: βεβαιούμενοι
  choice: స్థిరపరచబడుతూ
  rationale: దృఢంగా, స్థిరంగా చేయబడుతున్న భావాన్నీ కర్మణి రూపాన్నీ కాపాడుతుంది.
- source_word: τῇ πίστει
  choice: విశ్వాసంలో
  rationale: నిర్దిష్ట ఉపదేశంతో సంబంధమున్న విశ్వాసం అనే సంభావ్య భావాన్ని ఇస్తుంది; తెలుగు వాక్యంలో ప్రత్యేక నిర్దేశక పదం లేకున్నా తరువాతి ‘మీరు బోధించబడిన ప్రకారం’ దానిని స్పష్టం చేస్తుంది.
- source_word: καθὼς ἐδιδάχθητε
  choice: మీరు బోధించబడిన ప్రకారం
  rationale: καθώς యొక్క అనురూప భావాన్నీ, ἐδιδάχθητε యొక్క కర్మణి రూపాన్నీ నిలుపుతుంది.
- source_word: περισσεύοντες
  choice: పొంగిపొర్లుతూ
  rationale: సమృద్ధిగా ఉండటం అనే భావాన్ని సజీవంగా, సహజంగా వ్యక్తం చేస్తూ వర్తమాన కృదంతంలోని కొనసాగింపును నిలుపుతుంది.
- source_word: ἐν εὐχαριστίᾳ
  choice: కృతజ్ఞతతో
  rationale: తెలుగు నుడికారానికి సహజంగా ఉండి, కృతజ్ఞత/కృతజ్ఞతాస్తుతి భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: τῇ πίστει యొక్క భావం
  choice: విశ్వాసంలో—వారికి బోధించబడిన విశ్వాస సందేశం లేదా విశ్వాస పరిధి
  alternative: వ్యక్తిగతంగా నమ్మడంలో; లేదా విశ్వసనీయతలో
  rationale: నిర్దిష్ట సూచన కలిగిన τῇ πίστει మరియు ‘మీరు బోధించబడిన ప్రకారం’ అనే మాటలు బోధించబడిన విశ్వాస విషయాన్ని సూచించే అవకాశాన్ని బలపరుస్తాయి. అయినా πίστις పదంలోని విశ్వాసం, నమ్మకం, విశ్వసనీయత అనే భావ విస్తృతిని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని వ్యవసాయ, నిర్మాణ రూపకాలు మరియు కృదంతాల కాల/దృక్కోణ భేదాలు సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
