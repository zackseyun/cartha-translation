lexical_decisions:
- source_word: τοῦτο
  choice: ఇది
  rationale: నపుంసక ఏకవచన సూచన సర్వనామం ముందున్న పౌలు మాటను లేదా వాదన క్రమాన్ని సూచిస్తుంది; దాని పరిధిని అనవసరంగా నిర్దిష్టం చేయకుండా ఏకవచన భావాన్ని నిలుపుతుంది.
- source_word: λέγω
