lexical_decisions:
- source_word: ἅ
  choice: ఇవి
  rationale: ముందరి వచనంలో ప్రస్తావించిన ఆహారం, పానీయం, పండుగ, అమావాస్య, విశ్రాంతిదినం వంటి విషయాలను సూచించే నపుంసక బహువచన సర్వనామం. తెలుగులో “ఇవి” సహజంగా ఆ పూర్వసూచనను నిలుపుతుంది.
- source_word: σκιὰ
  choice: నీడ
  rationale: ఏకవచన విధేయ నామవాచకాన్ని నేరుగా అనువదించి, తాత్కాలిక సూచనకూ దాని సంపూర్ణ రూపానికీ మధ్య ఉన్న రూపకాన్ని నిలుపుతుంది.
- source_word: τῶν μελλόντων
  choice: రాబోయేవాటికి
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతంలోని భవిష్యదర్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; అది అంత్యకాల విషయాలనో, మెస్సీయలో నెరవేర్పునో నిర్దిష్టంగా పరిమితం చేయదు.
- source_word: δὲ
  choice: అయితే
  rationale: నీడకూ శరీరానికీ మధ్య ఉన్న వ్యత్యాసాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: σῶμα
  choice: శరీరం
  rationale: పదానికి ప్రధానమైన ప్రత్యక్ష అర్థాన్ని నిలుపుతూ, “నీడ”తో ఉన్న రూపక సంబంధాన్ని పాఠకుడు వ్యాఖ్యానించేందుకు వీలు కల్పిస్తుంది. “అసలు వాస్తవం” అనే భావానువాదాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయది
  rationale: గ్రీకులోని సంక్షిప్త సంబంధవిభక్తి నిర్మాణాన్ని తెలుగులో సహజమైన స్వామ్యరూపంతో వ్యక్తం చేస్తుంది. ఇక్కడ Χριστός బిరుదుగా ఉన్నందున “మెస్సీయ” అని అనువదించాం.
theological_decisions:
- issue: నీడకు విరుద్ధంగా σῶμα అనే పదం యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో “శరీరం” అని రూపపరంగా అనువదించి రూపకంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను నిలిపాం.
  alternative: “అసలు వాస్తవం” లేదా “సారం” అని భావానువాదం చేయడం.
  rationale: σῶμα సాధారణంగా “శరీరం” అని అర్థం. ఇక్కడ అది నీడకు భిన్నంగా దృఢమైన అసలు రూపాన్ని సూచించవచ్చు; అయినా ప్రధాన పాఠ్యంలో ఆ వ్యాఖ్యానాన్ని ఖరారు చేయకుండా, భావానువాదాన్ని పాదసూచికలో ఉంచడం మూలంలోని రూపకాన్నీ నిజమైన అర్థసందిగ్ధతనూ కాపాడుతుంది.
- issue: τοῦ Χριστοῦ యొక్క సంబంధం
  choice: “మెస్సీయది” అనే స్వామ్య నిర్మాణం.
  alternative: “మెస్సీయకు చెందింది” లేదా సందర్భాన్ని విస్తరించి “మెస్సీయలో ఉంది.”
  rationale: గ్రీకు వాక్యంలో రెండో భాగపు క్రియ అధ్యాహారంగా ఉంది. “మెస్సీయది” అనే రూపం సమాంతర నిర్మాణాన్ని, సంక్షిప్తతను కాపాడుతుంది; “మెస్సీయలో ఉంది” అని అనడం మూలంలో లేని స్థానార్థాన్ని జోడించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. “శరీరం మెస్సీయది” కొంత ఉద్దేశపూర్వకంగా రూపకాత్మకంగా వినిపిస్తుంది; ఇది గ్రీకు మూలంలోని “నీడ—శరీరం” వ్యత్యాసాన్ని సరళీకరించకుండా నిలుపుతుంది.
