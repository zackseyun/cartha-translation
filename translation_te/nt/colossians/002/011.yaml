  text: ἐν ᾧ καὶ περιετμήθητε περιτομῇ ἀχειροποιήτῳ ἐν τῇ ἀπεκδύσει τοῦ ⸀σώματος τῆς σαρκός, ἐν τῇ περιτομῇ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: te
  text: ఆయనలో మీరు కూడా చేతులతో చేయబడని సున్నతితో[a] సున్నతి చేయబడ్డారు. మాంసపు దేహాన్ని తొలగించడంలో[b][c], మెస్సీయ యొక్క సున్నతిలో[d] ఇది జరిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చేతులతో చేయబడని సున్నతితో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘విప్పివేయడంలో.’ ఈ పదం వస్త్రాన్ని తీసివేసినట్లుగా పూర్తిగా తీసివేయడాన్ని చిత్రిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘మాంసం’ అనే పదాన్ని వ్యాఖ్యానాత్మకంగా ‘పాప స్వభావం’ అని కూడా అర్థం చేసుకోవచ్చు; అయితే ఇక్కడ గ్రీకు పదానికి దగ్గరగా అనువదించబడింది.
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘మెస్సీయ చేసిన సున్నతి ద్వారా,’ ‘మెస్సీయ సున్నతిలో.’ గ్రీకు పదబంధం మెస్సీయ చేసిన సున్నతిని, ఆయనకు చెందిన సున్నతిని, లేదా ఆయనతో సంబంధమున్న సున్నతిని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ఆయనలో
  rationale: ముందటి సందర్భంలోని మెస్సీయనే సంబంధ సర్వనామం సూచిస్తోంది. ‘ఆయనలో’ అనేది సహజమైన తెలుగులో ఉండి, మెస్సీయతో ఐక్యత భావాన్ని నిలుపుతుంది.
- source_word: περιετμήθητε
  choice: సున్నతి చేయబడ్డారు
  rationale: ఇది భూతకాల నిష్క్రియ క్రియారూపం; పూర్తయిన చర్యను నేరుగా తెలియజేస్తూ, సున్నతి రూపకాన్ని వివరణగా మార్చకుండా నిలుపుతుంది.
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: చేతులతో చేయబడని సున్నతితో
  rationale: దైవికమైన, మానవ చేతిపని కాని చర్య అనే వ్యత్యాసాన్ని నిలుపుతూ, సాధనార్థక దత్తివును ‘తో’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ ἀπεκδύσει
  choice: తొలగించడంలో
  rationale: ఈ నామవాచకం విప్పివేయడం లేదా పూర్తిగా తొలగించడం అనే భావాన్ని ఇస్తుంది. ప్రధాన పాఠంలో చదవడానికి సులభమైన పదాన్ని ఎంచుకుని, మరింత చిత్రాత్మక రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: τοῦ σώματος τῆς σαρκός
  choice: మాంసపు దేహాన్ని
  rationale: కష్టమైన గ్రీకు సంబంధపద నిర్మాణాన్ని అతిగా వ్యాఖ్యానించకుండా ‘మాంసపు దేహం’గా నిలుపుతుంది; ఇది కేవలం భౌతిక దేహమా, మాంసం చేత లక్షణీకరించబడిన ఉనికా అనే ప్రశ్నను తేల్చదు.
- source_word: σαρκός
  choice: మాంసపు
  rationale: ‘పాప స్వభావం’ వంటి వ్యాఖ్యానాత్మక పదాన్ని చేర్చకుండా, పౌలు వాడిన ‘మాంసం’ అనే పదబంధాన్ని సాధ్యమైనంత నేరుగా నిలుపుతుంది.
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: మెస్సీయ యొక్క సున్నతిలో
  rationale: ἐν ను ‘లో’గా, Χριστόςను బిరుదుగా ‘మెస్సీయ’గా అనువదించాం. ‘యొక్క’ అనే సంబంధరూపం ఈ సున్నతి మెస్సీయ చేసినదా, ఆయనకు చెందినదా, ఆయనతో సంబంధమున్నదా అనే గ్రీకు సందిగ్ధతను తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: ‘మెస్సీయ యొక్క సున్నతి’ అనే పదబంధం యొక్క అర్థం
  choice: సంబంధార్థాన్ని ఉద్దేశపూర్వకంగా తెరిచి ఉంచే ‘మెస్సీయ యొక్క సున్నతి’
  alternative: మెస్సీయ చేసిన సున్నతి; మెస్సీయ స్వయంగా పొందిన సున్నతి; మెస్సీయకు చెందిన నూతన నిబంధన సున్నతి
  rationale: τοῦ Χριστοῦ అనే గ్రీకు సంబంధరూపం అనేక విధాలుగా అర్థమవుతుంది. ఒకే సిద్ధాంతపరమైన అర్థాన్ని నిర్ణయించకుండా మూలంలోని ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
- issue: ‘మాంసపు దేహం’ యొక్క భావం
  choice: ‘పాప స్వభావం’గా విస్తరించకుండా ‘మాంసపు దేహం’ అని ఉంచడం
  alternative: మాంససంబంధమైన దేహం; పాపమయ స్వభావపు దేహం; మాంసమనే దేహం
  rationale: ఈ పదబంధం పాఠ్యపరంగా, వ్యాఖ్యానపరంగా కష్టమైనది. SBLGNT పాఠాన్ని అనుసరించి, తరువాతి ప్రతులలో కనిపించే వివరణాత్మక విస్తరణలను లేదా నిర్దిష్ట మానవశాస్త్ర వ్యాఖ్యానాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. గ్రీకు వాక్యంలోని పునరుక్త ‘సున్నతి’ని రూపక సంబంధం స్పష్టంగా ఉండేందుకు నిలిపాం; అయితే తెలుగులో వాక్యభారం తగ్గించేందుకు రెండవ వాక్యంలో ‘ఇది జరిగింది’ అని పూరించాం.
