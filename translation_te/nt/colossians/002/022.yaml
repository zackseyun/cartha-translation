id: COL.2.22
reference: Colossians 2:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἅ ἐστιν πάντα εἰς φθορὰν τῇ ἀποχρήσει, κατὰ τὰ ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: te
  text: ఇవన్నీ వాడకంతో నశించిపోతాయి—ఈ నియమాలు మనుషుల ఆజ్ఞలు, బోధల ప్రకారం ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మనుషుల ఆజ్ఞలు, బోధలు” అనే పదబంధం యెషయా 29:13ను ప్రతిధ్వనించవచ్చు; ఈ నియమాలు దేవునివి కాక మానవ మూలం గలవని ఇది సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἅ ἐστιν πάντα
  choice: ఇవన్నీ
  rationale: ముందటి వచనంలోని తాకడం, రుచి చూడడం, ముట్టడం గురించిన నిషేధాలకు సంబంధించిన వస్తువులను సూచించే నపుంసక బహువచన సంబంధ సర్వనామ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς φθοράν
  choice: నశించిపోయేవి
  rationale: φθορά ఇక్కడ వాడకంలో క్షయమై అంతరించిపోయే వినియోగ వస్తువుల నాశనాన్ని సూచిస్తుంది; భౌతిక కుళ్లుదలకే పరిమితం చేయదు.
- source_word: τῇ ἀποχρήσει
  choice: వాడడంతోనే
  rationale: వాడివేయడం లేదా వినియోగంతో అయిపోవడం అనే ἀπόχρησις భావాన్ని, దత్తివిభక్తి తెలిపే సాధన/సందర్భ సంబంధంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κατὰ
  choice: అనుగుణమైనవి
  rationale: ఈ నియమాలు దేనిని ప్రమాణంగా లేదా మూలంగా అనుసరిస్తున్నాయో తెలిపే సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐντάλματα
  choice: ఆజ్ఞలు
  rationale: నియమబద్ధమైన ఆదేశాల భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: διδασκαλίας
  choice: బోధలు
  rationale: సాంకేతిక సిద్ధాంతార్థాన్ని అనవసరంగా జోడించకుండా διδασκαλία యొక్క సాధారణ బోధన భావాన్ని ఇస్తుంది.
- source_word: τῶν ἀνθρώπων
  choice: మనుషుల
  rationale: లింగ సమావేషకమైన ἄνθρωποι పదానికి సరైన సహజ తెలుగు; ఈ ఆజ్ఞలు దేవుని నుండి కాక మానవ మూలం నుండి వచ్చినవని సూచిస్తుంది.
theological_decisions:
- issue: ఈ వివరణాత్మక భాగం నశించే వస్తువులను విమర్శిస్తుందా, లేక వాటిని నియంత్రించే నియమాలను విమర్శిస్తుందా?
  choice: వాడకంతో నశించే వస్తువులను ముందుగా పేర్కొని, వాటికి సంబంధించిన నియమాలు మానవ ఆజ్ఞలు మరియు బోధలకు అనుగుణమైనవని తెలిపే పఠనం.
  alternative: మొత్తం వాక్యాన్ని నశించే వస్తువుల విషయంలో ఉన్న మానవ నియమాలపై మరింత నేరమైన నిరాకరణగా చదవవచ్చు.
  rationale: గ్రీకు వాక్యంలో ἅ...πάντα మొదట వస్తువులను సూచిస్తుంది; తరువాత κατὰ... వాటికి సంబంధించిన నియమాల మానవ మూలాన్ని వివరిస్తుంది. అనువాదం ఈ రెండింటి మధ్య ఉన్న భావ ఉద్రిక్తతను అతిగా పరిష్కరించదు.
- issue: యెషయా 29:13 ప్రతిధ్వని
  choice: ‘మనుషుల ఆజ్ఞలు...బోధలు’ అనే పదజాలాన్ని నిలుపడం.
  alternative: ‘మానవ నియమాలు, ఉపదేశాలు’ అని స్వేచ్ఛగా అనువదించడం.
  rationale: ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων అనే పదబంధం యెషయా 29:13 గ్రీకు రూపాన్ని ప్రతిధ్వనించే అవకాశం ఉంది; అయితే అది ప్రత్యక్ష ఉల్లేఖనమని ప్రధాన పాఠ్యంలో నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని వివరణాత్మక విరామాన్ని దీర్ఘరేఖతో చూపించి, వస్తువుల నశ్వరత్వం మరియు నియమాల మానవ మూలం రెండింటినీ స్పష్టంగా ఉంచాం.
