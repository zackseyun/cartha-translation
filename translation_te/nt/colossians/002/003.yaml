translation:
  language: te
  text: ఆయనలో జ్ఞానానికీ వివేకానికీ సంబంధించిన సంపదలన్నీ దాగి ఉన్నాయి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, దేవుని మర్మాన్ని విస్తృత పూర్వపదంగా తీసుకుంటే, “దానిలో.”
    reason: alternative_reading
  - marker: b
    text: లేదా, “నిల్వ ఉంచబడి ఉన్నాయి”; గ్రీకు విశేషణం దాగి ఉండడం లేదా భద్రంగా నిల్వ ఉండడం అనే భావాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ఆయనలోనే
  rationale: సమీప పూర్వపదమైన వ్యక్తిగత సూచన ‘క్రీస్తు’ (2:2) వైపు సహజంగా సూచిస్తుంది. ‘లో’ అనేది ἐν యొక్క స్థానార్థాన్ని నిలుపుతుంది; ‘నే’ గ్రీకులో ప్రత్యేక పదానికి అనువాదం కాకపోయినా, సహజ తెలుగు వాక్యనిర్మాణంలో క్రీస్తులో ఉన్నాయనే సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: πάντες οἱ θησαυροὶ
  choice: సంపదలన్నీ
  rationale: నిర్దిష్ట బహువచన సమూహార్థాన్ని సహజ తెలుగులో సమగ్రంగా వ్యక్తం చేస్తుంది.
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: జ్ఞానవివేకాల
  rationale: σοφίαను ‘వివేకం’గా, γνῶσιςను ‘జ్ఞానం’గా వేరు చేసి నిలుపుతుంది. తెలుగు సమాసంలో మూలంలోని క్రమం మారినా రెండు భావాలూ స్పష్టంగా ఉంటాయి.
- source_word: ἀπόκρυφοι
  choice: దాగి
  rationale: ‘దాచబడి’ అని కర్తను ఊహింపజేయకుండా, దాగి ఉండడం లేదా భద్రంగా నిల్వ ఉండడం అనే అర్థసాధ్యతను తటస్థంగా ఉంచుతుంది.
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: దాగి ఉన్నాయి
  rationale: క్రియతో కూడిన విధేయ విశేషణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐν ᾧ యొక్క పూర్వపదం క్రీస్తా, లేక దేవుని మర్మమా
  choice: ప్రధాన పాఠంలో ‘ఆయనలోనే’ అని వ్యక్తిగతంగా అనువదించడం
  alternative: ‘దానిలోనే’—దేవుని మర్మాన్ని విస్తృత పూర్వపదంగా తీసుకోవడం
  rationale: సమీప వ్యక్తిగత పూర్వపదం క్రీస్తు కావడం వల్ల ఇది సహజమైన పఠనం; అయితే వ్యాకరణపరమైన విస్తృత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
- issue: ἀπόκρυφοι రహస్యంగా దాచబడినవని సూచిస్తుందా, భద్రంగా నిల్వ ఉన్నవని సూచిస్తుందా
  choice: ‘దాగి ఉన్నాయి’ అని తటస్థంగా అనువదించడం
  alternative: ‘నిల్వచేయబడి ఉన్నాయి’ లేదా ‘దాచబడి ఉన్నాయి’
  rationale: మూల విశేషణం రహస్యత్వాన్ని లేదా భద్రంగా ఉంచబడటాన్ని సూచించగలదు. ఒకే వ్యాఖ్యానాన్ని బలవంతంగా ఎంచుకోకుండా భావ ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘జ్ఞానవివేకాలు’ అనే జత సాధారణ పాఠకుడికి అర్థమయ్యేలా σοφία మరియు γνῶσις మధ్య భేదాన్ని నిలుపుతుంది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
