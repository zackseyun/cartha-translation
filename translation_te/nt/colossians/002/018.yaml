id: COL.2.18
reference: Colossians 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: te
  text: ఎవ్వరూ వినయాన్ని, దేవదూతల ఆరాధనను[a] ఇష్టపడుతూ, తాను చూసిన వాటిపై విస్తారంగా చెప్పుకుంటూ[c][b], తన శరీర సంబంధమైన మనస్సుచేత నిరర్థకంగా ఉబ్బిపోతూ, మీ బహుమతిని కోల్పోయేలా చేయనివ్వకండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవదూతల మతాచారం,’ లేదా ‘దేవదూతలతో కలిసి ఆరాధన.’ గ్రీకు పదబంధాన్ని ఒకటి కంటే ఎక్కువ విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: కొన్ని ప్రతుల్లో ‘తాను చూసిన వాటిని’ అనే దానికి బదులు ‘తాను చూడని వాటిని’ అని ఉంది; అప్పుడు ‘తాను చూడని వాటి గురించి విస్తారంగా చెప్పుకుంటూ’ అనే భావం వస్తుంది.
    reason: textual_variant
  - marker: c
    text: లేదా, ‘తాను చూసిన వాటిలో ప్రవేశిస్తూ,’ లేదా ‘తాను చూసిన వాటిని పరిశీలిస్తూ.’ ఇక్కడి గ్రీకు క్రియ అరుదైనది, దాని అర్థం కష్టమైనది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβραβευέτω
  choice: బహుమతికి అనర్హులుగా చేయనివ్వకండి
  rationale: ఈ క్రియలో న్యాయనిర్ణేత ఒకరికి వ్యతిరేకంగా తీర్పిచ్చి బహుమతిని కోల్పోయేలా చేయడం అనే భావం ఉంది. తెలుగు వాక్యం హెచ్చరికను సహజంగా ఉంచుతూ బహుమతి నేపథ్యాన్ని కూడా నిలుపుతుంది.
- source_word: θέλων ἐν
  choice: ఇష్టపడుతూ
  rationale: ఇక్కడ కేవలం సంకల్పం కాక, పేర్కొన్న ఆచారాలపట్ల స్వచ్ఛంద ఆసక్తి లేదా ఆనందం సూచితమవుతుంది.
- source_word: ταπεινοφροσύνῃ
  choice: వినయాన్ని
  rationale: మూల పదానికి సాధారణ అర్థమైన ‘వినయం’నే ఉంచి, అది నటనతో కూడినదా లేదా తపోపద్ధతికి సంబంధించినదా అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: దేవదూతల ఆరాధనను
  rationale: దేవదూతలను ఉద్దేశించి చేసే ఆరాధన అనే objective genitive పఠనం ప్రధాన పాఠ్యంలో సహజంగా సరిపోతుంది; ఇతర సాధ్యార్థాలను పాదసూచికలో నిలిపాం.
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: తాను చూసిన వాటిలో నిమగ్నమై
  rationale: అరుదైన ἐμβατεύω క్రియకు దర్శించిన విషయాల్లో ప్రవేశించడం, వాటిపై విస్తారంగా నిలవడం అనే భావాలు సాధ్యం. ‘నిమగ్నమై’ మూలంలోని అస్పష్టతను కొంతవరకు కాపాడుతూ గౌరవప్రదమైన ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: εἰκῇ
  choice: నిరర్థకంగా
  rationale: అతని గర్వానికి నిజమైన ఆధారం లేదనీ, అది వ్యర్థమైనదనీ సూచిస్తుంది.
- source_word: φυσιούμενος
  choice: ఉబ్బిపోతూ
  rationale: పౌలు వాడే గర్వంతో ఉబ్బిపోవడం అనే రూపకాన్ని తెలుగులో నిలుపుతుంది.
- source_word: νοὸς τῆς σαρκὸς αὐτοῦ
  choice: తన శరీర సంబంధమైన మనస్సుచేత
  rationale: νοῦς‌ను ‘మనస్సు’గా అనువదించి, σάρξ‌ను సిద్ధాంతపరంగా ‘పాప స్వభావం’ అని విపులీకరించకుండా శరీర/మాంస సంబంధిత మానవ దృక్పథం అనే ఉద్వేగాన్ని కాపాడాం.
theological_decisions:
- issue: θρησκείᾳ τῶν ἀγγέλων అనే పదబంధంలోని genitive సంబంధం
  choice: దేవదూతలను ఉద్దేశించి చేసే ఆరాధన
  alternative: దేవదూతలు చేసే ఆరాధన; లేదా దేవదూతలతో కలిసి చేసే ఆరాధన
  rationale: సందర్భంలో దేవదూతల ఆరాధనకు వ్యతిరేకమైన హెచ్చరిక సాధ్యమైన ప్రధాన పఠనం. అయినా గ్రీకు నిర్మాణం ఇతర సంబంధాలనూ అనుమతిస్తుంది కాబట్టి వాటిని పాదసూచికలో ఇచ్చాం.
- issue: τῆς σαρκὸς αὐτοῦ లో σάρξ అర్థం
  choice: శరీర సంబంధమైన
  alternative: పాప స్వభావానికి సంబంధించిన
  rationale: ‘పాప స్వభావం’ అనే వ్యాఖ్యానాత్మక పదబంధాన్ని ప్రధాన పాఠ్యంలో పెట్టకుండా, పౌలు వాడిన σάρξ పదంలోని మానవీయ-నైతిక ఉద్వేగాన్ని నిలిపాం.
- issue: ἃ ἑόρακεν యొక్క పాఠాంతరం
  choice: తాను చూసినవి
  alternative: తాను చూడనివి
  rationale: SBLGNT ప్రధాన పాఠ్యాన్ని అనుసరించాం; ‘కాని/కాదు’ అనే నిరాకరణ కలిగిన పాఠాంతరం అర్థాన్ని గణనీయంగా మార్చుతుంది కాబట్టి పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని పొడవైన participial నిర్మాణాన్ని తెలుగు కృదంతాలతో కొనసాగించాం. ‘ఉబ్బిపోతూ’ అనే రూపకం, ‘మనస్సు’ మరియు శరీర సంబంధమైన దృక్పథం మధ్యనున్న పౌలు భావ ఉద్వేగం నిలిచేలా చేశాం.
