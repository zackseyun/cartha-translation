revisions:
- from: ఎవ్వరూ వినయాన్ని, దేవదూతల ఆరాధనను[a] ఇష్టపడుతూ, తాను చూసిన వాటిలో నిమగ్నమై[c][b], తన శరీర సంబంధమైన మనస్సుచేత నిరర్థకంగా ఉబ్బిపోతూ, మిమ్మల్ని బహుమతికి అనర్హులుగా చేయనివ్వకండి.
