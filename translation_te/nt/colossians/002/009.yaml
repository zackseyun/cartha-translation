- from: ఎందుకంటే ఆయనలో దైవత్వపు సంపూర్ణత అంతా శరీరరూపంగా నివసిస్తోంది.[a]
  to: ఎందుకంటే ఆయనలో దైవత్వపు సంపూర్ణత అంతా శరీరరూపంలో నివసిస్తోంది.[a]
  rationale: The revision retains the draft’s faithful rendering of the verse while making the Telugu expression of σωματικῶς more idiomatic and correcting the footnote’s potentially misleading “శరీరసహితంగా.” No doctrinal expansion or narrowing has been introduced.
