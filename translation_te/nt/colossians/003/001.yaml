id: COL.3.1
reference: Colossians 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: te
  text: కాబట్టి, మీరు మెస్సీయతో కలిసి లేపబడి ఉంటే[a], పైనున్న వాటిని వెదకండి. అక్కడ మెస్సీయ[b] దేవుని కుడివైపున కూర్చుని ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కాబట్టి, మీరు మెస్సీయతో కలిసి లేపబడ్డారు గనుక’ అని కూడా అనువదించవచ్చు. గ్రీకులో షరతు రూపం (‘ఉంటే’) ఉన్నప్పటికీ, సందర్భంలో అది నిజమని భావించి చెప్పిన మాటగా ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: 'గ్రీకు: ‘క్రీస్తు’; ఇక్కడ Χριστός బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించబడింది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: కాబట్టి, ... ఉంటే
  rationale: οὖν యొక్క నిర్ధారణాత్మక భావాన్ని ‘కాబట్టి’తో, εἰ యొక్క షరతు రూపాన్ని ‘ఉంటే’తో నిలిపి ఉంచుతుంది. సందర్భంలో ఆ షరతు నిజమని భావించినప్పటికీ దానిని ‘గనుక/కాబట్టి మీరు లేపబడ్డారు’ అనే నిశ్చయ వాక్యంగా మార్చలేదు.
- source_word: συνηγέρθητε τῷ Χριστῷ
  choice: మీరు మెస్సీయతో కూడ లేపబడి ఉంటే
  rationale: సహచర్యాన్ని సూచించే దత్తివుతో పాటు συνεγείρω లోని ‘కలిసి’ అనే భావాన్ని ‘తో కూడ’ తెలియజేస్తుంది; కర్త చేత లేపబడిన భావాన్ని నిష్క్రియ రూపం కాపాడుతుంది.
- source_word: τὰ ἄνω
  choice: పైనున్న వాటిని
  rationale: గ్రీకు నపుంసక బహువచన నిర్మాణాన్ని సహజమైన తెలుగు బహువచనంగా ఉంచి, దానిని వివరణాత్మకంగా ‘పరలోక సంబంధమైనవి’ అని పరిమితం చేయదు.
- source_word: ζητεῖτε
  choice: వెదకండి
  rationale: ఆజ్ఞార్థక భావాన్ని నేరుగా అందిస్తుంది; వర్తమాన కాలంలోని కొనసాగింపు ఛాయను సందర్భానికి వదిలి, గ్రీకులో లేని అదనపు పదాలను చేర్చదు.
- source_word: ὁ Χριστός
  choice: మెస్సీయ
  rationale: Χριστός లోని అభిషిక్త రాజు అనే బిరుదు భావాన్ని తెలుగులో అర్థవంతంగా నిలుపుతుంది; ‘క్రీస్తు’ అనే పరిచిత రూపాన్ని పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తుంది.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ καθήμενος
  choice: దేవుని కుడివైపున కూర్చుని ఉన్నాడు
  rationale: అధికారం, ఘనతలను సూచించే స్థిరమైన బైబిలు రూపకాన్ని కాపాడుతూ, ప్రస్తుత స్థితిని తెలిపే participle భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Εἰ అనే షరతు పదం యొక్క బలం
  choice: ‘ఉంటే’ అనే షరతు రూపాన్ని నిలిపి ఉంచడం
  alternative: ‘మీరు ... లేపబడ్డారు గనుక’
  rationale: పౌలు ఈ పరిస్థితిని నిజమని భావించి వాదిస్తున్నట్లు సందర్భం సూచించినా, మూలపాఠం షరతు రూపాన్నే వాడుతుంది. అనువాదం ఆ వాక్య నిర్మాణంలోని ఉద్వేగాన్ని ముందుగానే పరిష్కరించదు.
- issue: Χριστός ను బిరుదుగా లేదా పేరులా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో ఉత్థానింపబడి దేవుని కుడివైపున ఉన్న అభిషిక్తుని గురించి చెప్పడం వల్ల బిరుదు భావం సజీవంగా ఉంది; అందుచేత అర్థానువాదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, పరిచిత లిప్యంతరీకరణను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘పైనున్న వాటిని’ అనే సంక్షిప్త రూపం మూలంలోని విస్తృతతను కాపాడుతుంది. వాక్యాన్ని సహజ తెలుగు ప్రవాహం కోసం రెండు వాక్యాలుగా విభజించినా, భావ సంబంధం మారలేదు.
