review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the conditional εἰ οὖν, the passive raising, the plural scope of τὰ ἄνω, and the Messiah’s present seated position at God’s right hand. The locative ‘అక్కడ’ appropriately refers back to ‘పైనున్న వాటిని.’
  naturalness: The wording is generally clear modern standard Telugu. Replacing ‘మెస్సీయతో కూడ’ with ‘మెస్సీయతో కలిసి’ is more idiomatic and directly conveys the συν- element in συνεγείρω without sounding elevated or archaic.
  terminology: ‘మెస్సీయ’ appropriately retains the titular sense of Χριστός in both occurrences. ‘దేవుని కుడివైపున’ is a natural Telugu equivalent for the biblical exaltation idiom. The notes correctly explain both the conditional force and the title rendering.
  issues:
  - severity: low
    issue: ‘మెస్సీయతో కూడ’ is less natural than ‘మెస్సీయతో కలిసి.’
    rationale: In current standard Telugu, ‘తో కలిసి’ is the usual clear expression for being raised together/with someone. It also makes the union component of συνηγέρθητε more explicit while retaining the passive ‘లేపబడి.’
