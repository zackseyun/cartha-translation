id: COL.3.23
reference: Colossians 3:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ὃ ἐὰν ποιῆτε, ἐκ ψυχῆς ἐργάζεσθε, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/023.yaml
  text: Whatever you do[a], work from the soul, as for the Lord and not for men[c][b],
translation:
  language: te
  text: మీరు ఏ పని చేసినా, మనుషుల[c] కోసం కాక ప్రభువు[b] కోసం చేస్తున్నట్టుగా మనస్ఫూర్తిగా[a] పనిచేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో అక్షరార్థంగా ‘ప్రాణం నుండి’; భావం: అంతరంగపూర్వకంగా లేదా హృదయపూర్వకంగా.'
    reason: lexical_alternative
  - marker: b
    text: ఈ గృహసంబంధ సందర్భంలో ‘ప్రభువు’ అనే పదానికి ‘యజమాని’ అనే భావఛాయ కూడా వినిపించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: గ్రీకు పదం ఇక్కడ పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది.
    reason: lexical_clarification
lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: మీరు ఏ పని చేసినా
  rationale: ἐάνతో కూడిన సంబంధవాచక రూపం నిర్దిష్టం కాని సాధారణ భావాన్ని—‘ఏది చేసినా’—తెలుపుతుంది. సందర్భంలో ‘ఏ పని చేసినా’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἐκ ψυχῆς
  choice: మనస్ఫూర్తిగా[a]
  rationale: అక్షరార్థం ‘ప్రాణం నుండి.’ ఇక్కడ అది అంతరంగ నిజాయితీతో, సంపూర్ణ నిబద్ధతతో చేయడాన్ని సూచిస్తుంది. తెలుగు వాడుకలో ‘మనస్ఫూర్తిగా’ ఆ భావాన్ని సహజంగా అందిస్తుంది; మూల రూపకాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἐργάζεσθε
  choice: పనిచేయండి
  rationale: ఇది కొనసాగించే కృషిని కోరే ఆజ్ఞార్థక రూపం. ‘పనిచేయండి’ సందర్భానికి సరళమైన, విస్తృతమైన సమానార్థకం.
- source_word: ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις
  choice: మనుషుల కోసం కాక ప్రభువు కోసం చేస్తున్నట్టుగా
  rationale: ὡς పని చేసే దృక్పథాన్ని లేదా విధానాన్ని సూచిస్తుంది. గ్రీకు వాక్యంలోని ప్రభువు–మనుషులు వ్యత్యాసాన్ని తెలుగు సహజ పదక్రమంలో నిలిపాం.
- source_word: τῷ κυρίῳ
  choice: ప్రభువు[b] కోసం
  rationale: κύριος ఇక్కడ క్రీస్తును సూచించే బిరుదుగా ప్రధానంగా అర్థమవుతుంది. అందువల్ల ‘ప్రభువు’ అని అనువదించాం; గృహసంబంధ సందర్భంలో వినిపించే ‘యజమాని’ భావఛాయను పాదటిప్పణిలో తెలిపాం.
- source_word: ἀνθρώποις
  choice: మనుషుల[c] కోసం
  rationale: ఈ బహువచన పదం పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది. ‘మనుషులు’ ఆ విస్తృత భావాన్ని తెలుగులో కచ్చితంగా ఇస్తుంది.
theological_decisions:
- issue: గృహ నియమాల సందర్భంలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: సమీప సందర్భంలో దాసులు, యజమానుల ప్రస్తావన ఉన్నప్పటికీ, ఇక్కడ κύριος ప్రధానంగా ఉన్నతుడైన క్రీస్తును సూచిస్తుంది. ‘ప్రభువు’ అనే అనువాదం ఆ బిరుదును కాపాడుతుంది; ‘యజమాని’ అనే సందర్భోచిత భావఛాయను ప్రత్యామ్నాయంగా గుర్తించాం.
- issue: ἐκ ψυχῆς లోని మానవ అంతరంగ భాష
  choice: ప్రధాన పాఠ్యంలో ‘మనస్ఫూర్తిగా’; పాదటిప్పణిలో ‘ప్రాణం నుండి’
  alternative: ప్రాణం నుండి
  rationale: ఈ పదబంధం మానవ స్వభావంలోని భాగాలపై ప్రత్యేక సిద్ధాంత నిర్వచనం చేయడం కంటే, వ్యక్తి అంతరంగం నుండి సంపూర్ణ నిబద్ధతతో పనిచేయడాన్ని సూచిస్తుంది. అందుకే సహజ భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, గ్రీకు రూపకాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఆజ్ఞారూపాన్ని వాడాం. ‘మనస్ఫూర్తిగా’ సాధారణ పాఠకులకు సహజంగా ఉండగా, మూలంలోని ψυχή రూపకాన్ని పాదటిప్పణిలో సంరక్షించాం. ప్రభువు–మనుషులు వ్యత్యాసాన్ని స్పష్టంగా ఉంచాం.
