  source_fidelity: మొదటి రెండు గ్రీకు వర్తమాన కృదంతాలు (ἀνεχόμενοι, χαριζόμενοι) సమన్వయంగా ఉన్నాయి. ముసాయిదాలో ‘సహించుకుంటూ’ అనే రూపం క్షమించడాన్ని దానికి అనుసరించే ప్రధాన చర్యగా చూపుతుంది; మూలంలో లేని కాల/విధాన అధీనత స్వల్పంగా ఏర్పడుతుంది. రెండింటినీ సమాన ఉపదేశాలుగా తెలుగులో వ్యక్తం చేయడం మరింత నమ్మకమైనది. చివరి అధ్యాహార క్రియను ‘అలాగే చేయండి’గా పూరించడం సందర్భానుకూలం.
  naturalness: ‘ఒకరినొకరు సహించండి’ మరియు ‘ఒకరినొకరు క్షమించండి’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, సమాంతరమైన సంఘ-ఉపదేశ శైలి. ‘ఫిర్యాదు’ సాధారణ వాడుకలో సహజమే. పాదటిప్పణి గుర్తును అది వివరిస్తున్న పదానికే చేర్చడం పాఠనాన్ని మెరుగుపరుస్తుంది.
  terminology: ‘ప్రభువు’ κύριος‌కు సరైన, మూలంలోని నిర్దిష్టతను మించని బిరుదు. χαρίζομαι/ἐχαρίσατο రెండింటికీ ‘క్షమించు’ వాడటం సందర్భానుసారంగా సముచితం. μομφήకు ‘ఫిర్యాదు’ సరిపోతుంది; పాదటిప్పణిలోని ప్రత్యామ్నాయాలు అర్థపరిధిని తగినంతగా సూచిస్తాయి.
