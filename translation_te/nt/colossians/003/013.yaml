revisions:
- from: ఒకరినొకరు సహించుకుంటూ, ఎవరికైనా మరొకరిపై ఫిర్యాదు ఉంటే ఒకరినొకరు క్షమించుకోండి.[a] ప్రభువు మిమ్మల్ని క్షమించినట్లే, మీరు కూడా అలాగే చేయండి.[b]
  to: ఒకరినొకరు సహించండి; ఎవరికైనా మరొకరిపై ఫిర్యాదు[a] ఉంటే, ఒకరినొకరు క్షమించండి. ప్రభువు మిమ్మల్ని క్షమించినట్లే, మీరు కూడా అలాగే చేయండి.[b]
  rationale: సమన్వయంగా ఉన్న రెండు గ్రీకు కృదంతాలను తెలుగులో సమాన ఉపదేశాలుగా మార్చి, మూలంలో లేని అధీన భావాన్ని తొలగించాం. అర్థం మార్చకుండా పాదటిప్పణి aను అది వివరిస్తున్న ‘ఫిర్యాదు’ పదానికి తరలించాం. చివరి వాక్యభాగంలోని గ్రీకు అధ్యాహారాన్ని సహజమైన తెలుగు కోసం ‘అలాగే చేయండి’గా ఉంచి, దానిని పాదటిప్పణిలో వివరించాం.
