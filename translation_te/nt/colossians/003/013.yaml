id: COL.3.13
reference: Colossians 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀνεχόμενοι ἀλλήλων καὶ χαριζόμενοι ἑαυτοῖς ἐάν τις πρός τινα ἔχῃ μομφήν· καθὼς καὶ ὁ ⸀κύριος ἐχαρίσατο ὑμῖν οὕτως καὶ ὑμεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/013.yaml
  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: te
  text: ఒకరినొకరు సహించండి; ఎవరికైనా మరొకరిపై ఫిర్యాదు[a] ఉంటే, ఒకరినొకరు క్షమించండి. ప్రభువు మిమ్మల్ని క్షమించినట్లే, మీరు కూడా అలాగే చేయండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఫిర్యాదు’కు బదులుగా ‘మనస్తాపానికి కారణం’ లేదా ‘అభ్యంతరం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పాఠం అక్షరార్థంగా ‘అలాగే మీరు కూడా’ అని ముగుస్తుంది; ‘చేయండి’ అనే క్రియ సందర్భం నుంచి గ్రహించబడుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι
  choice: ఒకరినొకరు సహించుకుంటూ
  rationale: వర్తమాన మధ్యమ కృదంతం సంఘంలోని నిరంతర పరస్పర సహనాన్ని సూచిస్తుంది. ‘సహించుకుంటూ’ అనేది అవమానకరమైన లేదా అతిగా కఠినమైన భావం లేకుండా ఆ సంబంధపరమైన అర్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: ఒకరినొకరు క్షమించుకోండి
  rationale: ఈ సందర్భంలో χαρίζομαι అపరాధాన్ని మన్నించడం లేదా క్షమించడం అనే అర్థం ఇస్తుంది; ἑαυτοῖς ఇక్కడ పరస్పరార్థకంగా వాడబడింది. తెలుగు ఉపదేశ శైలికి అనుగుణంగా కృదంతాన్ని ఆజ్ఞారూపంలో సహజంగా వ్యక్తం చేశాం.
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: ఎవరికైనా మరొకరిపై ఫిర్యాదు ఉంటే
  rationale: షరతు వాక్యంలోని అనిర్దిష్టతను నిలుపుతూ, μομφή సూచించే నిందకు లేదా అసంతృప్తికి గల కారణాన్ని ‘ఫిర్యాదు’ అనే సాధారణ ఆధునిక పదంతో తెలిపాం.
- source_word: καθὼς καὶ
  choice: …అలాగే
  rationale: ప్రభువు చేసిన క్షమాపణను విశ్వాసుల ప్రవర్తనకు నమూనాగా ఉంచే పోలికను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: κύριος అనే బిరుదుకు సాధారణమైన తెలుగు సమానార్థకం; సూచిత వ్యక్తిని అనువాదంలో మరింత నిర్దిష్టం చేయకుండా మూలంలోని రూపాన్ని నిలుపుతుంది.
- source_word: ἐχαρίσατο
  choice: క్షమించినట్లే
  rationale: ముందటి χαριζόμενοι తో ఉన్న అర్థసంబంధాన్ని ‘క్షమించు’ అనే అదే ధాతువు ద్వారా స్పష్టంగా ఉంచుతుంది.
- source_word: οὕτως καὶ ὑμεῖς
  choice: మీరు కూడా అలాగే చేయండి
  rationale: గ్రీకులో క్రియ అధ్యాహారంగా ఉన్నప్పటికీ, సహజమైన తెలుగులో వాక్యాన్ని పూర్తి చేయడానికి ‘చేయండి’ చేర్చబడింది; ‘అలాగే’ వల్ల క్షమించడమే ఉద్దేశించిన చర్య అని సందర్భం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ὁ κύριος ఎవరిని సూచిస్తుంది?
  choice: ‘ప్రభువు’ అనే బిరుదును మాత్రమే ఉపయోగించడం
  alternative: ‘క్రీస్తు’ లేదా ‘దేవుడు’ అని స్పష్టీకరించడం
  rationale: కొలొస్సయులకు పత్రిక సందర్భంలో ఇది అత్యంత సహజంగా క్రీస్తును సూచించినప్పటికీ, గ్రీకు పాఠం కేవలం ‘ప్రభువు’ అని ఉంది. అందువల్ల అనువాదం మూలంలోని బిరుదును అలాగే ఉంచి అనవసరమైన వివరణను ప్రధాన పాఠ్యంలో చేర్చదు.
- issue: చివరి వాక్యభాగంలోని అధ్యాహార క్రియ
  choice: ‘మీరు కూడా అలాగే చేయండి’ అని సహజమైన తెలుగులో పూర్తి చేయడం
  alternative: క్రియను చేర్చకుండా ‘మీరు కూడా అలాగే’ అని ఉంచడం లేదా ‘మీరు కూడా క్షమించండి’ అని స్పష్టంగా పునరుక్తి చేయడం
  rationale: గ్రీకు పాఠంలో చివరి క్రియ సందర్భం నుంచి గ్రహించబడుతుంది. తెలుగులో అసంపూర్ణంగా వినిపించకుండా ‘చేయండి’ చేర్చాం; అయితే మూలంలోని సంక్షిప్తతను, క్షమించడమే అధ్యాహార చర్య అనే భావాన్ని పాదటిప్పణిలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఉపదేశ శైలి ఉపయోగించబడింది. కృదంతాలతో నిండిన గ్రీకు నిర్మాణాన్ని తెలుగులో సహజంగా వినిపించేందుకు మొదటి చర్యను ‘సహించుకుంటూ’గా, ప్రధాన ఉపదేశాన్ని ‘క్షమించుకోండి’గా అమర్చాం. ‘ఒకరినొకరు’ అనే పరస్పర రూపం సంఘసంబంధ భావాన్ని స్పష్టంగా నిలుపుతుంది.
