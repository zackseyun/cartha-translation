id: COL.3.15
reference: Colossians 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ ⸀Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: te
  text: మెస్సీయ[a] శాంతి మీ హృదయాల్లో పరిపాలించనివ్వండి[b]. ఆ శాంతికే మీరు కూడా ఒకే శరీరంలో[c] పిలువబడ్డారు. కృతజ్ఞులుగా ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు శాంతి.’ గ్రీకు Χριστός అంటే ‘అభిషిక్తుడు’; దీనిని సంప్రదాయంగా ‘క్రీస్తు’ అని కూడా అంటారు.
    reason: lexical_alternative
  - marker: b
    text: ఈ క్రియకు ‘క్రీడా నిర్ణేతగా వ్యవహరించు’ లేదా ‘నిర్ణయించు’ అనే భావం కూడా ఉండవచ్చు. అంటే మెస్సీయ శాంతి సమాజపు అంతరంగ జీవనంలో నిర్ణయాత్మకంగా మార్గనిర్దేశం చేయాలి.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ఒకే శరీరంలోకి.’ ఈ విధంగా చదివితే అందరూ ఒకే సామూహిక శరీరంలో చేర్చబడటంపై ఎక్కువ ఉద్ఘాటన ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: శాంతి
  rationale: పౌలు వాడిన సంబంధపరమైన, సమాజపరమైన శాంతి భావాన్ని సహజంగా తెలియజేసే ప్రామాణిక తెలుగు పదం.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ యొక్క
  rationale: Χριστός ఇక్కడ అభిషిక్తుడు అనే బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని బిరుదు భావాన్ని నిలుపుతూ ‘మెస్సీయ’గా అనువదించాం.
- source_word: βραβευέτω
  choice: ఏలనివ్వండి
  rationale: తీర్పరి లేదా మధ్యవర్తిలా నిర్ణయాత్మకంగా వ్యవహరించడం అనే రూపకాన్ని సహజమైన తెలుగులో పాలించే, నిర్దేశించే భావంతో వ్యక్తపరుస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: మీ హృదయాల్లో
  rationale: అంతరంగం, మనోభావాలు, సంకల్పం అనే విస్తృత భావాన్ని నిలుపుతూ గ్రీకు బహువచనాన్ని కూడా ప్రతిబింబిస్తుంది.
- source_word: εἰς ἣν
  choice: ఆ శాంతికే
  rationale: సంబంధసర్వనామం తిరిగి ‘శాంతి’నే సూచిస్తుందని స్పష్టంగా, సహజంగా తెలుపుతుంది; εἰς లోని లక్ష్య భావాన్ని ‘కే’ తెలియజేస్తుంది.
- source_word: καὶ ἐκλήθητε
  choice: పిలువబడ్డారు
  rationale: καί ఇచ్చే ఉద్ఘాటనను ‘ఆ శాంతికే’లోని ‘కే’ ద్వారా సహజ తెలుగులో తెలియజేశాం; కర్తరి భావాన్ని జోడించకుండా దైవిక పిలుపు యొక్క కర్మణి రూపాన్ని నిలిపాం.
- source_word: ἐν ἑνὶ σώματι
  choice: ఒకే శరీరంలో
  rationale: సంఘాన్ని సూచించే పౌలు శరీర రూపకాన్ని వివరణతో విస్తరించకుండా నేరుగా నిలుపుతుంది.
- source_word: εὐχάριστοι γίνεσθε
  choice: కృతజ్ఞులై ఉండండి
  rationale: కృతజ్ఞత కలిగిన స్థితిలో ఉండాలని చెప్పే ఆజ్ఞను సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: Χριστοῦ బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో పదం అభిషిక్తుడు అనే బిరుదు భావాన్ని కలిగి ఉంది; ‘మెస్సీయ’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది. సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ‘ఒకే శరీరంలో’ అనే మాట యొక్క భావం
  choice: శరీర రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: దీనిని ప్రధాన పాఠ్యంలో ‘ఒకే సంఘంగా’ అని స్పష్టీకరించడం
  rationale: ఇది సంఘ ఐక్యతను సూచించినప్పటికీ, మూలంలోని రూపకాన్నీ దాని భావ విస్తృతినీ కాపాడటానికి ‘సంఘం’ అనే వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: εἰς మరియు ἐν మధ్య సంబంధం
  choice: శాంతిని పిలుపు యొక్క లక్ష్యంగా, ఒకే శరీరాన్ని ఆ పిలుపు యొక్క సామూహిక పరిధిగా చూపడం
  alternative: ‘ఒకే శరీరంలోకి పిలువబడ్డారు’ అని incorporation భావంతో అనువదించడం
  rationale: గ్రీకులో εἰς ἣν నేరుగా శాంతిని సూచిస్తుండగా, ἐν ἑνὶ σώματι సాధారణంగా ‘ఒకే శరీరంలో’ అనే పరిధిని తెలియజేస్తుంది. ప్రత్యామ్నాయ సాధ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘హృదయాలు,’ ‘శరీరం’ వంటి పౌలు రూపకాలను నిలిపి, వివరణాత్మక విస్తరణలను పాదసూచికలకు పరిమితం చేశాం.
