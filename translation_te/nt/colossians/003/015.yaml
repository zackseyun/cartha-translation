  source_fidelity: 'ప్రధాన భావం మూలానికి నమ్మకంగా ఉంది: Χριστοῦను బిరుదు భావంతో ‘మెస్సీయ’గా, βραβευέτωను పాలనా/నిర్ణయాత్మక భావంతో, మరియు ἐν ἑνὶ σώματιను రూపకాన్ని నిలుపుతూ అనువదించింది. అయితే καὶ ἐκλήθητεలోని καί యొక్క అదనపు/ఉద్ఘాటక బలాన్ని ప్రధాన పాఠ్యంలో ‘కూడా’ ద్వారా స్పష్టంగా ప్రతిబింబించడం మంచిది.'
