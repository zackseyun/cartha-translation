translation:
  language: te
  text: పైనున్న వాటిపై మీ మనస్సులను నిలపండి[a]; భూమిమీదనున్న వాటిపై కాదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పైనున్న వాటి గురించి ఆలోచిస్తూ ఉండండి.” గ్రీకు క్రియ ఆలోచించడమే కాక, మనోభావాన్ని లేదా శ్రద్ధను వాటివైపు నిలపడాన్ని కూడా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “భూమిపై ఉన్న వాటిపై కాదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄνω
  choice: పైనున్న వాటిపైనే
  rationale: నపుంసక బహువచనార్థాన్ని నిలుపుతూ, పైలోక సంబంధమైన వాస్తవాలు లేదా విషయాలను సూచిస్తుంది. ‘ఏ’ ప్రత్యయం భూమిమీద ఉన్న వాటితో గ్రీకు వాక్యంలో ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: φρονεῖτε
  choice: మీ మనస్సు నిలపండి
  rationale: φρονέω కేవలం ఆలోచించడమే కాక, మనోభావాన్ని, దృష్టిని, శ్రద్ధను ఒకదానివైపు మళ్లించి ఉంచడాన్ని సూచిస్తుంది. ఈ అనువాదం వర్తమాన ఆజ్ఞలోని కొనసాగుతున్న జీవన దృక్పథాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: μὴ
  choice: కాదు
  rationale: ఆజ్ఞకు సంబంధించిన రెండవ అంశాన్ని వ్యతిరేకంగా నిరాకరిస్తుంది. తెలుగులో ‘వాటిపైన కాదు’ అనే నిర్మాణం సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: భూమిమీద ఉన్న వాటిపైన
  rationale: τὰ ἄνωతో ఉన్న స్థలసంబంధ వ్యత్యాసాన్ని, అలాగే గ్రీకులోని నామవాచకసదృశ బహువచన నిర్మాణాన్ని కాపాడుతుంది.
- source_word: γῆς
  choice: భూమి
  rationale: ‘పైనున్నవి’ అనే విశ్వవ్యాప్త వ్యత్యాసంలో γῆ ఒక ప్రత్యేక దేశాన్ని కాక భూమిని సూచిస్తుంది.
theological_decisions:
- issue: φρονεῖτεలో పౌలు ఇచ్చిన ప్రబోధ స్వభావం
  choice: పైనున్న వాస్తవాలవైపు మనస్సు, దృష్టి, విలువలను నిరంతరం నిలిపే ప్రబోధం
  alternative: పరలోకం గురించి కేవలం బుద్ధిపరంగా ఆలోచించాలనే సంకుచిత ఆజ్ఞ
  rationale: φρονέω పదం ఆలోచనతోపాటు మనోభావం, దృక్పథం, శ్రద్ధ అనే విస్తృత భావాలను కలిగి ఉంది. ‘మీ మనస్సు నిలపండి’ ఆ విస్తృత నైతిక, ఆధ్యాత్మిక బలాన్ని అనవసర సిద్ధాంత వివరణ లేకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా చేస్తూనే, మూలంలోని ‘పైనున్నవి/భూమిమీద ఉన్నవి’ అనే సమాంతర వ్యత్యాసాన్ని నిలుపుకుంది.
