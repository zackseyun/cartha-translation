id: COL.3.24
reference: Colossians 3:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ἀπὸ κυρίου ⸀ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας· ⸀τῷ κυρίῳ Χριστῷ δουλεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: te
  text: ప్రభువు నుండి వారసత్వపు ప్రతిఫలాన్ని పొందుతారని తెలుసుకొని, మీరు ప్రభువైన మెస్సీయకు[b] దాసులుగా సేవ చేస్తున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు క్రియారూపం ‘మీరు సేవ చేస్తున్నారు’ అనే సూచనార్థక రూపం; అది నేరుగా ‘సేవ చేయండి’ అనే ఆజ్ఞార్థక రూపం కాదు.
    reason: lexical_alternative
  - marker: b
    text: సంప్రదాయంగా, ‘ప్రభువైన క్రీస్తుకు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδότες
  choice: తెలుసుకొని
  rationale: ముందటి వచనంలోని ఉపదేశంతో అనుసంధానమయ్యే కారణార్థక ఛాయగల కృదంత రూపాన్ని తెలుగులో సహజమైన అసమాపక క్రియతో నిలుపుతుంది; దాన్ని స్వతంత్ర ఆజ్ఞగా మార్చదు.
- source_word: ἀπὸ κυρίου
  choice: ప్రభువు నుండి
  rationale: ἀπό సహిత షష్ఠీ విభక్తి ప్రతిఫలం వచ్చే మూలాన్ని సూచిస్తుంది. సందర్భంలో κύριος క్రీస్తుకు సంబంధించిన బిరుదుగా ఉంది.
- source_word: ἀπολήμψεσθε
  choice: పొందుతారని
  rationale: భవిష్యత్ మధ్యమ సూచనార్థక రూపాన్ని సహజంగా వ్యక్తపరుస్తుంది; తిరిగి పొందడం అనే ఛాయను తరువాతి ‘ప్రతిఫలం’ మోస్తుంది.
- source_word: ἀνταπόδοσιν
  choice: ప్రతిఫలాన్ని
  rationale: తగిన ప్రతిదానం లేదా బహుమానాన్ని సూచించే పదానికి ఆధునిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: τῆς κληρονομίας
  choice: వారసత్వపు
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది; వారసత్వమే ప్రతిఫలమా లేక వారసత్వానికి సంబంధించిన ప్రతిఫలమా అన్న సంబంధాన్ని అనవసరంగా ఖరారు చేయదు.
- source_word: τῷ κυρίῳ Χριστῷ
  choice: ప్రభువైన మెస్సీయకు
  rationale: దత్తివిభక్తి δουλεύετε క్రియకు కర్మగా ఉంది. Χριστός యొక్క బిరుదు భావాన్ని ‘మెస్సీయ’గా, κύριοςను ‘ప్రభువు’గా అందిస్తుంది.
- source_word: δουλεύετε
  choice: దాసులుగా సేవ చేస్తున్నారు
  rationale: ఇది వర్తమాన సూచనార్థక రూపం; ప్రత్యక్ష ఆజ్ఞ కాదు. δουλεύωలోని దాస్యసేవ భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: Χριστῷ అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός కేవలం పేరులోని భాగంలా కాక బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో ఉంచి, సంప్రదాయ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- issue: δουλεύετε యొక్క క్రియాభావం
  choice: సూచనార్థకం—‘మీరు ... సేవ చేస్తున్నారు’
  alternative: ఆజ్ఞార్థకంగా—‘సేవ చేయండి’
  rationale: గ్రీకు రూపం వర్తమాన క్రియ, కర్తరి ప్రయోగం, సూచనార్థకం, రెండవ పురుష బహువచనం. సందర్భం ఉపదేశాత్మకమైనప్పటికీ దాన్ని నేరుగా ఆజ్ఞార్థకంగా మార్చకుండా వ్యాకరణ రూపాన్ని కాపాడుతుంది.
- issue: ἀνταπόδοσιν τῆς κληρονομίας లోని షష్ఠీ సంబంధం
  choice: వారసత్వపు ప్రతిఫలం
  alternative: వారసత్వమనే ప్రతిఫలం
  rationale: గ్రీకు పదబంధం వారసత్వమే ప్రతిఫలమని వివరణాత్మకంగా గ్రహించవచ్చు; అయితే ప్రధాన పాఠ్యం ఆ సంబంధాన్ని పూర్తిగా నిర్ధారించకుండా మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘దాసులుగా సేవ చేస్తున్నారు’ అనే పదబంధం గృహదాసుల సందర్భాన్నీ δουλεύω యొక్క భావాన్నీ నిలుపుతుంది. వచనం ముందటి ఉపదేశంతో వ్యాకరణపరంగా కలిసేలా ‘తెలుసుకొని’ వాడబడింది.
