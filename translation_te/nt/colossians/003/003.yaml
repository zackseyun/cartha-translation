translation:
  language: te
  text: ఎందుకంటే మీరు చనిపోయారు, మీ జీవం మెస్సీయతో[a] కలిసి దేవునిలో దాచబడి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మెస్సీయతో’కు బదులుగా ‘క్రీస్తుతో’ అని కూడా అనువదించవచ్చు. గ్రీకు Χριστός అనే బిరుదును ‘మెస్సీయ’ లేదా ‘క్రీస్తు’గా అనువదించవచ్చు; ఇక్కడ దాని బిరుదు భావాన్ని నిలుపడానికి ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: మీరు చనిపోయారు
  rationale: ద్వితీయ పురుష బహువచన ఏఓరిస్ట్ రూపం విశ్వాసుల గతంలోని నిర్ణాయక మరణాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన భూతకాల రూపం.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి కారణం లేదా వివరణను పరిచయం చేసే అనుసంధానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἡ ζωὴ ὑμῶν
  choice: మీ జీవం
  rationale: ζωήకు నేరమైన అర్థం ‘జీవం’; సందర్భార్థాన్ని వివరణగా విస్తరించకుండా నిలుపుతుంది.
- source_word: κέκρυπται
  choice: దాచబడి ఉంది
  rationale: పర్ఫెక్ట్ పాసివ్ రూపంలోని పూర్తయిన చర్య వల్ల కొనసాగుతున్న ప్రస్తుత స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: σὺν τῷ Χριστῷ
  choice: మెస్సీయతోపాటు
  rationale: σύν సహవాసం లేదా ఐక్యతను సూచిస్తుంది; Χριστόςను ఇక్కడ బిరుదుగా ‘మెస్సీయ’ అని అనువదించడం మూలార్థాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ θεῷ
  choice: దేవునిలో
  rationale: ἐν సూచించే స్థానం లేదా పరిధిని నేరుగా నిలుపుతుంది; ‘దేవునితో’ అని మార్చి సంబంధాన్ని అతిగా వ్యాఖ్యానించదు.
theological_decisions:
- issue: Χριστῷను బిరుదుగా లేదా పేరు వలె అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός అభిషిక్తుడనే బిరుదు భావాన్ని కలిగి ఉంది; ‘మెస్సీయ’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది, కాగా తెలుగు పాఠకులకు సుపరిచితమైన ‘క్రీస్తు’ను పాదటీకలో ప్రత్యామ్నాయంగా ఇస్తుంది.
- issue: κέκρυπταιలోని పర్ఫెక్ట్ భావం
  choice: దాచబడి ఉంది
  alternative: దాచబడింది
  rationale: గతంలో జరిగిన చర్యతో ఏర్పడిన ప్రస్తుత స్థితిని ‘దాచబడి ఉంది’ సహజంగా తెలియజేస్తుంది; కేవలం గత సంఘటనగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని కారణసూచక అనుసంధానం, దేవునిలో ఉన్న స్థితి, మెస్సీయతో సహవాసం, పర్ఫెక్ట్ క్రియ సూచించే కొనసాగుతున్న స్థితి నిలుపబడ్డాయి.
