  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα, τοῦτο γὰρ ⸂εὐάρεστόν ἐστιν⸃ ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: te
  text: పిల్లలారా, మీ తల్లిదండ్రులకు ప్రతి విషయంలో విధేయులుగా ఉండండి. ఎందుకంటే ఇది ప్రభువులో ప్రీతికరమైనది[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమోదయోగ్యమైనది.”
    reason: lexical_alternative
  - marker: b
    text: “ప్రభువులో” అనే మాటను, కేవలం “ప్రభువుకు” అని కాకుండా, ప్రభువుతో ఉన్న సంబంధంలో ఏది ప్రీతికరమో దాన్ని సూచిస్తున్నట్లు అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: పిల్లలారా
  rationale: τέκνα అనేది కుమారులు, కుమార్తెలు ఇద్దరినీ కలుపుకొని సంతానాన్ని సూచించే సాధారణ బహువచన సంబోధన. ‘పిల్లలారా’ ఆధునిక తెలుగులో సహజమైన ప్రత్యక్ష సంబోధన.
- source_word: ὑπακούετε
  choice: విధేయత చూపండి
  rationale: ὑπακούω ఇక్కడ తల్లిదండ్రుల మాట విని దానికి లోబడాలని ఆజ్ఞాపిస్తుంది. ‘విధేయత చూపండి’ ఆజ్ఞ యొక్క బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τοῖς γονεῦσιν
  choice: మీ తల్లిదండ్రులకు
  rationale: γονεῦσιν అంటే తల్లిదండ్రులు. గ్రీకులో స్వామ్యసూచక పదం స్పష్టంగా లేకపోయినా, ప్రత్యక్ష సంబోధనలో ‘మీ’ అని చేర్చడం తెలుగులో సహజం; అర్థాన్ని మార్చదు.
- source_word: κατὰ πάντα
  choice: ప్రతి విషయంలో
  rationale: κατά + πάντα ఇక్కడ కాలాన్ని కాక విస్తృతిని లేదా పరిధిని సూచిస్తుంది. అందువల్ల ‘ప్రతి విషయంలో’ అనేది ‘ఎల్లప్పుడూ’ కంటే కచ్చితమైనది.
- source_word: τοῦτο
  choice: ఇది
  rationale: τοῦτο ముందున్న ఆజ్ఞలో చెప్పిన విధేయతను తిరిగి సూచిస్తుంది. ‘ఇది’ గ్రీకు వాక్య నిర్మాణాన్ని సరళంగా నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందున్న ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది. ‘ఎందుకంటే’ తెలుగులో ఆ వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: εὐάρεστόν ἐστιν
  choice: ప్రీతికరమైనది
  rationale: εὐάρεστος అనేది ప్రీతికరమైనది లేదా ఆమోదయోగ్యమైనది అనే భావాన్ని కలిగి ఉంది. ‘ప్రీతికరమైనది’ ప్రధాన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: ἐν κυρίῳ అనే పౌలు తరచుగా ఉపయోగించే సంబంధ లేదా పరిధి సూచక పదబంధాన్ని ‘ప్రభువులో’ అని నేరుగా నిలిపాం. ‘ప్రభువుకు’ అని అనువదిస్తే గ్రీకులోని భావాన్ని అవసరానికి మించి సంకుచితం చేస్తుంది.
theological_decisions:
- issue: ‘ప్రతి విషయంలో’ అనే ఆజ్ఞకు ‘ప్రభువులో’ అనే పదబంధంతో ఉన్న సంబంధం
  choice: రెండు పదబంధాలనూ ఎలాంటి అదనపు మినహాయింపు చేర్చకుండా నిలిపి, ‘ప్రభువులో’ను ప్రీతికరమైనదితో అనుసంధానించాం.
  alternative: ‘ప్రభువులో’ అనేది ప్రభువు చిత్తానికి అనుగుణమైన విషయాల్లో మాత్రమే విధేయత చూపాలనే పరిమితిగా తీసుకోవచ్చు; లేదా ‘ఇది ప్రభువుకు ప్రీతికరం’ అని అర్థం చేసుకోవచ్చు.
  rationale: గ్రీకు పాఠ్యంలో ‘ప్రతి విషయంలో’ తర్వాత స్పష్టమైన మినహాయింపు లేదు; అలాగే ἐν κυρίῳ వ్యాకరణపరంగా ఆజ్ఞకు నేరుగా జతచేయబడలేదు. అందువల్ల అనువాదం క్రైస్తవ సంబంధ పరిధిని నిలుపుతూ, నైతిక పరిమితిని గానీ ‘ప్రభువుకు’ అనే దిశార్థాన్ని గానీ పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కుటుంబ సందర్భానికి తగిన స్పష్టమైన మరియు గౌరవప్రదమైన శైలి. ‘పిల్లలారా’ సహజమైన సంబోధన; ‘విధేయత చూపండి’ ఆజ్ఞ యొక్క బలాన్ని నిలుపుతుంది. మూలంలోని ‘ప్రభువులో’ అనే ఉద్దేశపూర్వక అస్పష్టతను పరిష్కరించకుండా కాపాడాం.
