id: COL.3.11
reference: Colossians 3:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, servant, free, but Messiah is all[c][b], and in all.
translation:
  language: te
  text: అక్కడ గ్రీకుడు, యూదుడు, సున్నతి పొందినవాడు, సున్నతి పొందనివాడు, అనాగరికుడు[a], స్కిథీయుడు[b], బానిస, స్వతంత్రుడు అనే భేదం లేదు. కాని మెస్సీయే సమస్తం, అందరిలోనూ ఉన్నాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అనాగరికుడు” అని అనువదించిన గ్రీకు పదం, గ్రీకు భాషా సంస్కృతులకు వెలుపలివారిగా భావించబడిన ప్రజలకు వాడిన ప్రాచీన పదం.
    reason: historical_context
  - marker: b
    text: స్కిథీయులు ప్రాచీన నల్ల సముద్రానికి ఉత్తరానున్న మైదాన ప్రాంతాలతో సంబంధం కలిగిన ప్రజలు; గ్రీకు-రోమా ప్రపంచంలో వారిని అత్యంత అనాగరికులుగా భావించేవారు.
    reason: historical_context
  - marker: c
    text: లేదా “మెస్సీయే సమస్తం, సమస్తంలోనూ ఉన్నాడు.” గ్రీకులోని “అందరిలో/అన్నిటిలో” అనే పదబంధం సంక్షిప్తమైనది; సందర్భంలో అది నూతన సమాజంలోని సభ్యులందరినీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: అక్కడ
  rationale: ముందటి వచనంలో చెప్పిన నూతన మానవత్వపు పరిధిని సూచించే స్థానార్థక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὐκ ἔνι
  choice: భేదం లేదు
  rationale: ఇక్కడ వ్యక్తులే ఉనికిలో లేరని కాక, నూతన సమాజంలో ఈ గుర్తింపులు నిర్ణాయక విభజనలుగా లేవని సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: గ్రీకువాడని యూదుడని
  rationale: Ἕλλην అనే నిర్దిష్ట జాతి-సాంస్కృతిక పదాన్ని విస్తృతమైన ‘అన్యజనుడు’గా మార్చకుండా నిలుపుతుంది.
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: సున్నతి పొందినవాడని పొందనివాడని
  rationale: మూలంలోని సంక్షిప్త సామాజిక-మత గుర్తింపులను ఆధునిక పాఠకునికి సహజంగా, వ్యక్తులకు వర్తించే విధంగా అందిస్తుంది.
- source_word: βάρβαρος
  choice: అనాగరికుడు
  rationale: గ్రీకు-రోమా ప్రపంచంలో భాషా, సాంస్కృతిక బాహ్యునిపై వాడిన పదంలోని కఠినమైన ప్రాచీన వర్గీకరణను నిలుపుతుంది.
- source_word: Σκύθης
  choice: స్కిథీయుడు
  rationale: నిర్దిష్ట ప్రాచీన జాతి పేరును సాధారణీకరించకుండా తెలుగు లిప్యంతరీకరణలో ఇస్తుంది.
- source_word: δοῦλος
  choice: బానిస
  rationale: ἐλεύθεροςతో ప్రత్యక్ష సామాజిక-చట్టపరమైన వ్యత్యాసం ఉన్నందున బంధిత స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐλεύθερος
  choice: స్వతంత్రుడు
  rationale: బానిసకు విరుద్ధమైన స్వేచ్ఛా సామాజిక స్థితిని సహజమైన తెలుగులో తెలుపుతుంది.
- source_word: Χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తున్నందున దాని అభిషిక్త రాజు అనే బిరుదు భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది.
- source_word: τὰ πάντα
  choice: సమస్తం
  rationale: మెస్సీయ యొక్క సమగ్ర ప్రాధాన్యాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తూ, మూలం స్పష్టంచేయని తాత్త్విక వివరాలను చేర్చదు.
- source_word: ἐν πᾶσιν
  choice: అందరిలోనూ
  rationale: తక్షణ సందర్భం నూతన సమాజంలోని సభ్యుల గురించినది కాబట్టి వ్యక్తిగత బహువచన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని విస్తృత సాధ్యతను పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: ἐν πᾶσιν యొక్క పరిధి
  choice: అందరిలోనూ
  alternative: అన్నిటిలోనూ / సమస్తంలోనూ
  rationale: సందర్భం మానవ గుర్తింపులు కలిగిన నూతన సమాజాన్ని సూచించడం వల్ల వ్యక్తులను ఉద్దేశించిన అర్థం ప్రధానంగా కనిపిస్తుంది. అయినా గ్రీకు పదబంధం సంక్షిప్తంగా, విస్తృతంగా ఉండగలదని పాదసూచిక తెలియజేస్తుంది.
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వాక్యంలో పదం బిరుదు-సంబంధమైన ధార్మిక కేంద్రత్వాన్ని వ్యక్తం చేస్తుంది; ‘మెస్సీయ’ దాని భావాన్ని నేరుగా నిలుపుతుంది.
- issue: δοῦλος యొక్క సామాజిక స్థితి
  choice: బానిస
  alternative: దాసుడు / సేవకుడు
  rationale: ‘స్వతంత్రుడు’తో ఉన్న వ్యత్యాసం బంధిత చట్టపరమైన స్థితిని ప్రధానంగా చేస్తుంది; ‘సేవకుడు’ ఆ తీవ్రతను తగ్గిస్తుంది.
- issue: గుర్తింపుల లేమి యొక్క అర్థం
  choice: భేదం లేదు
  alternative: ఎవరూ లేరు
  rationale: పౌలు ఈ వర్గాలకు చెందిన వ్యక్తుల ఉనికిని నిరాకరించడం లేదు; నూతన మానవత్వంలో అవి నిర్ణాయక హోదా లేదా విభజన కావని చెబుతున్నాడు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలి. జాబితాలోని జాతి, మత, సాంస్కృతిక, సామాజిక వ్యత్యాసాలను సమాంతర నిర్మాణంతో ఉంచి, చివరి మెస్సీయ-కేంద్ర ప్రకటనకు స్పష్టమైన వ్యతిరేక మలుపు ఇచ్చాం.
