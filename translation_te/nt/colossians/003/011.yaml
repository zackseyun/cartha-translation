revisions:
- from: అక్కడ గ్రీకువాడని యూదుడని, సున్నతి పొందినవాడని పొందనివాడని, అనాగరికుడని[a] స్కిథీయుడని[b], బానిస అని స్వతంత్రుడు అని భేదం లేదు. కాని మెస్సీయే సమస్తం, అందరిలోనూ ఉన్నాడు.[c]
  to: అక్కడ గ్రీకుడు, యూదుడు, సున్నతి పొందినవాడు, సున్నతి పొందనివాడు, అనాగరికుడు[a], స్కిథీయుడు[b], బానిస, స్వతంత్రుడు అనే భేదం లేదు. కాని మెస్సీయే సమస్తం, అందరిలోనూ ఉన్నాడు.[c]
  rationale: The revision replaces the unnatural repeated quotative morphology with an idiomatic Telugu list of social, ethnic, religious, cultural, and legal identity markers, governed by “అనే భేదం లేదు.” It retains the draft’s context-sensitive but non-doctrinal rendering of the final phrase and preserves its broader semantic possibility in a footnote. The Scythian note is made geographically more precise and explicitly historical in perspective.
