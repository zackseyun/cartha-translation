id: COL.3.5
reference: Colossians 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: te
  text: 'కాబట్టి, భూమిమీద ఉన్న అవయవాలను[a] చంపివేయండి: లైంగిక దుర్నీతి, అపవిత్రత, కామవాంఛ, చెడు కోరిక, దురాశ[b]—అది విగ్రహారాధన.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీలో భూసంబంధమైన వాటిని.” గ్రీకులో అక్షరార్థంగా “భూమిమీద ఉన్న అవయవాలను” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “లోభం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: చంపివేయండి
  rationale: నిర్ణయాత్మక చర్యను ఆదేశించే గ్రీకు భూతకాల క్రియాజ్ఞ బలాన్ని స్పష్టంగా నిలుపుతుంది; ‘మృతపరచండి’ కంటే ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μέλη τὰ ἐπὶ τῆς γῆς
  choice: భూమిమీద ఉన్న అవయవాలను
  rationale: గ్రీకులోని శరీరావయవాల రూపకాన్నీ, భూమికి సంబంధించిన స్థలరూపకాన్నీ వ్యాఖ్యానంతో భర్తీ చేయకుండా నిలుపుతుంది. తెలుగులో సహజత్వం కోసం గ్రీకులో స్పష్టంగా లేని ‘మీ’ అనే పదాన్ని చేర్చలేదు.
- source_word: πορνείαν
  choice: లైంగిక దుర్నీతి
  rationale: πορνεία సూచించే విస్తృతమైన అనైతిక లైంగిక ప్రవర్తనను ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀκαθαρσίαν
  choice: అపవిత్రత
  rationale: నైతిక అశుద్ధతను సూచించే పౌలు వాడుకకు సరిపోయే, సాధారణంగా అర్థమయ్యే పదం.
- source_word: πάθος
  choice: మోహావేశం
  rationale: సందర్భంలో అదుపులేని, క్రమరహితమైన బలమైన వాంఛను తెలియజేస్తూ, దానిని కేవలం ఒక నిర్దిష్ట లైంగిక భావానికి పరిమితం చేయదు.
- source_word: ἐπιθυμίαν κακήν
  choice: చెడు కోరిక
  rationale: ἐπιθυμία అనే కోరికను κακήν నైతికంగా చెడ్డదిగా విశేషిస్తున్న నిర్మాణాన్ని సంక్షిప్తంగా, నేరుగా నిలుపుతుంది.
- source_word: πλεονεξίαν
  choice: దురాశ
  rationale: మరింత పొందాలనే స్వార్థపూరితమైన పట్టుదలను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: అది విగ్రహారాధన
  rationale: పౌలు చేసిన నేరమైన, బలమైన సమీకరణను మృదువుపరచకుండా ఉంచుతుంది; ‘అది’ సమీపంలోని ఏకవచన నామవాచకమైన ‘దురాశ’ను స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: ‘అది విగ్రహారాధన’ అనే మాట దేనిని సూచిస్తుంది?
  choice: ప్రత్యేకంగా ‘దురాశ’ను సూచిస్తుంది.
  alternative: ముందున్న దోషాల జాబితా మొత్తాన్ని విగ్రహారాధనగా సంగ్రహిస్తుంది.
  rationale: స్త్రీలింగ ఏకవచన సంబంధసర్వనామం ἥτις, తనకు అత్యంత సమీపంలో ఉన్న స్త్రీలింగ ఏకవచన నామవాచకం πλεονεξίανతో సహజంగా ఏకీభవిస్తుంది. తెలుగు వాక్యంలో ‘అది’ ఈ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- issue: ‘భూమిమీద ఉన్న అవయవాలు’ అనే రూపకానికి అర్థం
  choice: ప్రధాన వచనంలో శరీరావయవాల రూపకాన్ని నిలుపడం.
  alternative: ‘మీలో భూసంబంధమైనది’ లేదా ‘మీ భూసంబంధ స్వభావం’ అని భావార్థం చెప్పడం.
  rationale: మూలపాఠం ‘అవయవాలు’ అని చెబుతుంది; తరువాతి నామవాచకాలు చంపివేయవలసిన వాటిని వివరిస్తున్న సమానాధికార పదాలుగా చదవవచ్చు. రూపకాన్ని నిలపడం ద్వారా మూలంలో లేని సిద్ధాంతపరమైన వివరణను ప్రధాన వచనంలో చేర్చకుండా ఉంటాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని శరీరావయవాల రూపకాన్ని ప్రధాన వచనంలో ఉంచి, సహజమైన భావార్థాన్ని పాదసూచికలో ఇచ్చాం. దోషాల జాబితా సంక్షిప్తతను, చివరి వాక్యంలోని ధార్మిక బలాన్ని నిలిపాం.
