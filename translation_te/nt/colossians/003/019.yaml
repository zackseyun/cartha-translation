id: COL.3.19
reference: Colossians 3:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας καὶ μὴ πικραίνεσθε πρὸς αὐτάς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/019.yaml
  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: te
  text: భర్తలారా, మీ భార్యలను ప్రేమించండి; వారిపట్ల కఠినంగా ప్రవర్తించకండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిపట్ల మనసులో కసి పెంచుకోకండి.” గ్రీకు క్రియ చేదుగా మారడం లేదా మనసులో కసి పెంచుకోవడం అనే భావాన్ని సూచించగలదు; ఇక్కడ అది భార్యలపట్ల కఠినమైన, కసితో కూడిన ప్రవర్తనను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: భర్తలారా
  rationale: ἀνήρ అనే పదానికి ‘పురుషుడు’ లేదా ‘భర్త’ అనే అర్థాలు ఉండవచ్చు. అయితే గృహసంబంధ ఉపదేశ సందర్భం, అలాగే భార్యలను ఉద్దేశించిన సంబంధం వల్ల ఇక్కడ ‘భర్తలు’ అనే అర్థమే స్పష్టం.
- source_word: ἀγαπᾶτε
  choice: ప్రేమించండి
  rationale: ἀγαπάω అనే క్రియలోని ప్రేమ భావాన్ని సహజంగా, ఆజ్ఞార్థక బలంతో తెలియజేస్తుంది.
- source_word: τὰς γυναῖκας
  choice: మీ భార్యలను
  rationale: γυνή అంటే ‘స్త్రీ’ లేదా ‘భార్య’ కావచ్చు. పరస్పర గృహసంబంధ ఉపదేశంలో ‘భార్యలు’ అనే అర్థం అవసరం; తెలుగులో సంబంధాన్ని సహజంగా స్పష్టం చేయడానికి ‘మీ’ చేర్చబడింది.
- source_word: μὴ πικραίνεσθε
  choice: కఠినంగా ప్రవర్తించకండి
  rationale: πικραίνω మౌలికంగా చేదుతనం లేదా మనసులో కసి పెరగడాన్ని సూచించగలదు. πρὸς αὐτάςతో కూడిన ఈ సందర్భంలో ఆ కసి నుంచి వచ్చే కఠినమైన వైఖరి లేదా ప్రవర్తన ప్రధాన భావం; ఎంపిక చేసిన పదబంధం దాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πρὸς αὐτάς
  choice: వారిపట్ల
  rationale: πρός + ద్వితీయా విభక్తి ఇక్కడ వైఖరి లేదా ప్రవర్తన దిశను సూచిస్తుంది; ‘వారిపట్ల’ తెలుగులో సహజమైన సమానార్థకం.
theological_decisions:
- issue: గృహసంబంధ ఉపదేశంలో లింగనిర్దిష్టమైన సంబోధన
  choice: ‘భర్తలారా’, ‘మీ భార్యలను’ అని వివాహసంబంధ, లింగనిర్దిష్ట సంబోధనను నిలుపుకోవడం
  alternative: ‘పురుషులారా’, ‘స్త్రీలను’ వంటి విస్తృత పదాలు ఉపయోగించడం
  rationale: గ్రీకు వాక్యం ఈ సందర్భంలో వివాహసంబంధ పాత్రలను స్పష్టంగా సూచిస్తుంది. అందువల్ల సాధారణ పురుషులు, స్త్రీలు అనే భావానికి విస్తరించకుండా మూలంలోని సంబంధాన్ని నిలుపుకున్నాం.
- issue: πικραίνεσθεలో అంతర్గత కసి మరియు బాహ్య కఠిన ప్రవర్తన మధ్య భావ ఉద్రిక్తత
  choice: ప్రధాన పాఠ్యంలో ‘కఠినంగా ప్రవర్తించకండి’ అని సందర్భానుగుణ భావాన్ని ఇవ్వడం
  alternative: ‘వారిపట్ల మనసులో కసి పెంచుకోకండి’ లేదా ‘వారిపట్ల చేదుగా మారకండి’
  rationale: భార్యలపట్ల దిశానిర్దేశిత వైఖరిని సూచించే πρὸς αὐτάς కారణంగా కఠిన ప్రవర్తన సందర్భానికి బాగా సరిపోతుంది. అయినా క్రియలోని ‘చేదుతనం/కసి’ భావాన్ని పూర్తిగా తొలగించకుండా పాదటీపులో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞార్థక శైలిని ఉపయోగించాం. ‘కఠినంగా ఉండకండి’ కంటే ప్రవర్తనా దిశను స్పష్టం చేయడానికి ‘కఠినంగా ప్రవర్తించకండి’ ఎంచుకున్నాం; మూలంలోని చేదుతనం/కసి భావాన్ని పాదటీపులో భద్రపరిచాం.
