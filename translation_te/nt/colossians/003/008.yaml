  source_fidelity: The draft accurately represents the imperative ἀπόθεσθε (‘put away/lay aside’) and preserves the comprehensive force of τὰ πάντα through ‘వీటన్నిటినీ.’ The five vices are all present and in source order. ‘కోపం, ఆగ్రహం’ appropriately retains the rhetorical distinction between ὀργή and θυμός without making it artificially technical. ‘దూషణ’ permits βλασφημία’s contextual sense of abusive or defamatory speech rather than restricting it to blasphemy against God. ‘అసభ్యమైన మాటలు’ adequately conveys αἰσχρολογία, and ‘మీ నోటి నుండి వచ్చే’ naturally reflects ἐκ τοῦ στόματος ὑμῶν.
