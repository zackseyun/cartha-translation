id: COL.3.8
reference: Colossians 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: te
  text: 'అయితే ఇప్పుడు మీరు కూడా వీటన్నిటినీ విడిచిపెట్టండి: కోపం, ఆగ్రహం, దుష్టత్వం, దూషణ, మీ నోటి నుండి వచ్చే అసభ్యమైన మాటలు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: విడిచిపెట్టండి
  rationale: దుస్తులను తీసివేయడం అనే రూపక నేపథ్యంతో, ఇక్కడ చెడు ప్రవర్తనలను పూర్తిగా వదలివేయాలనే ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὀργήν
  choice: కోపం
  rationale: నిలకడగా ఉండే కోపాన్ని సూచించగల సాధారణ పదం; తరువాతి θυμόςతో భేదాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: θυμόν
  choice: ఆగ్రహం
  rationale: తీవ్రంగా ఉప్పొంగే కోపం లేదా rage భావాన్ని తెలియజేస్తూ ὀργή నుండి భేదాన్ని కాపాడుతుంది.
- source_word: κακίαν
  choice: దుష్టత్వం
  rationale: కేవలం ఒక హానికర చర్యకన్నా చెడు మనస్తత్వం లేదా దురుద్దేశాన్ని విస్తృతంగా సూచిస్తుంది.
- source_word: βλασφημίαν
  choice: దూషణ
  rationale: ఈ సందర్భంలో దేవదూషణకే పరిమితం చేయకుండా, ఇతరులను అపకీర్తిపాలు చేసే నిందాపూర్వక మాట అనే విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: αἰσχρολογίαν
  choice: అసభ్యమైన మాటలు
  rationale: అవమానకరమైన, అశ్లీలమైన లేదా నీచమైన మాటల పరిధిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: మీ నోటి నుండి వచ్చే
  rationale: మూలంలోని 'మీ నోటి నుండి' అనే శరీరాంగ రూపకాన్ని ఉంచుతూ, తెలుగులో జాబితా చివరి అంశంతో సహజంగా అనుసంధానిస్తుంది.
theological_decisions:
- issue: βλασφημίαν యొక్క పరిధి
  choice: దూషణ
  alternative: దేవదూషణ
  rationale: సమీప సందర్భం పరస్పర సంబంధాల్లోని చెడు మాటల గురించి ఉంది; గ్రీకు పదం దేవునిపై దూషణను సూచించగలిగినా, ఇక్కడ దానికే పరిమితం చేయడం మూలంలోని విస్తృతతను అనవసరంగా కుదిస్తుంది.
- issue: ὀργή మరియు θυμός మధ్య భేదం
  choice: కోపం, ఆగ్రహం
  alternative: కోపం, ఉగ్రకోపం
  rationale: రెండు సమీపార్థక పదాల వాక్చాతుర్యాన్ని నిలుపుతూ, ఖచ్చితమైన మానసిక విభజనను మూలంపై బలవంతంగా మోపకుండా సాధారణ పాఠకుడికి స్పష్టంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాన్ని ఉపయోగించాం. జాబితా నేరుగా, గంభీరంగా ఉండేలా చేసి, మూలంలోని దుస్తులు తీసివేయడం అనే రూపకాన్ని 'విడిచిపెట్టండి' ద్వారా సహజంగా ప్రతిబింబించాం.
