source:
  edition: SBLGNT
  text: καὶ πᾶν ⸂ὅ τι⸃ ⸀ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, εὐχαριστοῦντες τῷ ⸀θεῷ πατρὶ δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: te
  text: 'మీరు మాటలోనైనా పనిలోనైనా ఏమి చేసినా[a], ప్రతిదీ ప్రభువైన యేసు నామంలో[b] చేయండి; ఆయన ద్వారా తండ్రియైన దేవునికి కృతజ్ఞతలు తెలుపుతూ ఉండండి.


    [a] లేదా, “మాటలలోనైనా చేతలలోనైనా.”


    [b] “నామంలో” అనే పదబంధానికి “ఆయన అధికారంతో” లేదా “ఆయన ప్రతినిధులుగా” అనే భావాలు కూడా ఉండవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాటలలోనైనా చేతలలోనైనా.”
    reason: lexical_alternative
  - marker: b
    text: “నామంలో” అనే పదబంధానికి “ఆయన అధికారంతో” లేదా “ఆయన ప్రతినిధులుగా” అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: మీరు ... ఏమి చేసినా
  rationale: గ్రీకు ప్రయోగంలోని అనిర్దిష్టమైన, సమగ్ర భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: మాటలోగానీ కార్యంలోగానీ
  rationale: మౌఖిక ప్రవర్తనను, ఆచరణను పరస్పరం జతచేసే గ్రీకు సంక్షిప్త నిర్మాణాన్ని, దాని అలంకార సమతౌల్యాన్ని నిలుపుతుంది.
- source_word: πάντα
  choice: ప్రతిదీ
  rationale: ముందున్న సమగ్ర వాక్యభాగాన్ని తిరిగి సంక్షిప్తంగా చేర్చి, ఏదీ మినహాయింపు కాదనే భావాన్ని తెలియజేస్తుంది.
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: ప్రభువైన యేసు నామంలో
  rationale: అధికారం, ప్రాతినిధ్యం, అనుబంధం వంటి విస్తృత భావపరిధిని ఒకే వివరణకు కుదించకుండా బైబిలు నుడికారాన్ని నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువైన
  rationale: ఇక్కడ κύριος క్రీస్తుకు సంబంధించిన బిరుదు; ‘ప్రభువు’ దాని నూతన నిబంధన భావగాంభీర్యాన్ని నిలుపుతుంది.
- source_word: εὐχαριστοῦντες
  choice: కృతజ్ఞతలు చెల్లిస్తూ ఉండండి
  rationale: ప్రధాన ఆజ్ఞతో పాటు కొనసాగే కృతజ్ఞతా చర్యను తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τῷ θεῷ πατρὶ
  choice: తండ్రియైన దేవునికి
  rationale: θεῷకు సమానాధికరణంగా ఉన్న πατρίని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δι’ αὐτοῦ
  choice: ఆయన ద్వారా
  rationale: సమీప పూర్వపదమైన ప్రభువైన యేసును సూచించే సర్వనామాన్ని నిలుపుతూ, మధ్యవర్తిత్వ భావాన్ని అతిగా వివరించదు.
theological_decisions:
- issue: ‘ప్రభువైన యేసు నామంలో’ అనే పదబంధం యొక్క భావపరిధి
  choice: ప్రధాన పాఠ్యంలో ‘ప్రభువైన యేసు నామంలో’ అనే నుడికారాన్ని నిలుపడం
  alternative: ‘ప్రభువైన యేసు అధికారానికి లోబడి’ లేదా ‘ప్రభువైన యేసు ప్రతినిధులుగా’ అని విప్పి చెప్పడం
  rationale: గ్రీకు పదబంధంలో అధికారం, ప్రాతినిధ్యం, అనుబంధం వంటి పరస్పర సంబంధిత భావాలు ఉన్నాయి. ప్రధాన పాఠ్యంలో నుడికారాన్ని నిలపడం వాటిలో ఒక్కదానికే అర్థాన్ని పరిమితం చేయదు.
- issue: ‘ఆయన ద్వారా’ అనే సర్వనామం ఎవరిని సూచిస్తుంది
  choice: అది సమీప పూర్వపదమైన ప్రభువైన యేసును సూచిస్తుంది
  alternative: ప్రత్యేకమైన క్రీస్తు-మధ్యవర్తిత్వ ప్రాధాన్యం లేకుండా సాధారణ సూచనగా తీసుకోవడం
  rationale: వాక్యనిర్మాణంలో అత్యంత సహజమైన పూర్వపదం ‘ప్రభువైన యేసు’; అందువల్ల కృతజ్ఞతలు ఆయన ద్వారా తండ్రియైన దేవునికి చెల్లించబడతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే శైలిని ఉపయోగించాం. ‘కార్యం,’ ‘నామంలో,’ ‘తండ్రియైన దేవుడు’ వంటి బైబిలు సందర్భానికి తగిన పదాలను ఉంచుతూ, వాక్యాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా నిర్మించాం.
