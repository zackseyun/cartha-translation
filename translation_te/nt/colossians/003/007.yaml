  edition: SBLGNT
  text: ἐν οἷς καὶ ὑμεῖς περιεπατήσατέ ποτε ὅτε ἐζῆτε ἐν ⸀τούτοις·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/007.yaml
  text: In these things you too once walked[a], when you were living in them.
translation:
  language: te
  text: మీరు కూడా ఒకప్పుడు ఈ విషయాల్లో నడుచుకున్నారు[a], వాటిలో జీవిస్తూ ఉండగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటిలో మీరు కూడా ఒకప్పుడు నడుచుకున్నారు, ఈ విషయాల్లో జీవిస్తూ ఉండగా.” గ్రీకులోని సంబంధవాచక సర్వనామాన్ని మరింత అక్షరార్థంగా “వాటిలో” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: వీటిలోనే
  rationale: సంబంధవాచక సర్వనామం ముందున్న దురాచారాలను సూచిస్తుంది. ‘వీటిలోనే’ అనేది ఆ సూచనను సహజమైన తెలుగులో స్పష్టం చేస్తూ ἐν యొక్క పరిధి భావాన్ని నిలుపుతుంది.
- source_word: καὶ ὑμεῖς
  choice: మీరు కూడా
  rationale: καὶ మరియు స్పష్టంగా ఉన్న ὑμεῖς కొలస్సయులు సైతం గతంలో ఈ జీవనరీతిలో పాలుపంచుకున్నారని నొక్కిచెబుతాయి.
- source_word: περιεπατήσατε
  choice: నడుచుకున్నారు
  rationale: περιπατέω ఇక్కడ జీవన ప్రవర్తనకు రూపకాలంకారంగా వాడబడింది. ‘నడుచుకున్నారు’ పౌలు వాడిన రూపకాన్ని నిలుపుతూ తరువాతి ἐζῆτεతో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: ποτε
  choice: ఒకప్పుడు
  rationale: గతంలోని, ఇప్పుడు ముగిసిన కాలాన్ని సహజంగా సూచిస్తుంది.
- source_word: ὅτε
  choice: ఉన్నప్పుడు
  rationale: వారి గత ప్రవర్తనను, ఆ దురాచారాల పరిధిలో కొనసాగిన గత జీవనస్థితితో కాలసంబంధంగా కలుపుతుంది.
- source_word: ἐζῆτε
  choice: జీవిస్తూ ఉన్నప్పుడు
  rationale: అసంపూర్ణ భూతకాల రూపం నిరంతరంగా కొనసాగిన గత స్థితిని సూచిస్తుంది. ఈ అనువాదం ఆ కొనసాగింపు భావాన్ని వ్యక్తం చేసి ‘నడుచుకున్నారు’ అనే రూపకంతో కలిసిపోకుండా ఉంచుతుంది.
- source_word: ἐν τούτοις
  choice: వాటిలో
  rationale: ఇది కూడా ముందుగా ప్రస్తావించిన దురాచారాలనే సూచిస్తుంది. ‘వాటిలో’ పునరుక్తిని తగ్గిస్తూ వాటి పరిధిలో జీవించడమనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘నడుచుకున్నారు’ మరియు ‘జీవిస్తూ ఉన్నారు’ మధ్య సంబంధం
  choice: గత ప్రవర్తనను (‘నడుచుకున్నారు’), వారు జీవించిన గత నైతిక పరిధి లేదా స్థితి నుంచి (‘వాటిలో జీవిస్తూ’) పదప్రయోగపరంగా వేరు చేయడం.
  alternative: రెండు క్రియలనూ సమానార్థకాలుగా తీసుకొని రెండింటినీ ‘జీవించారు’ అని అనువదించడం.
  rationale: περιπατέω మరియు ζάω అనే వేర్వేరు గ్రీకు క్రియలను ప్రతిబింబిస్తూ, అదనపు సిద్ధాంతార్థాన్ని చేర్చకుండా పౌలు చెప్పిన పొరలుగల నైతిక వర్ణనను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే పౌలు ఉపయోగించిన ‘నడుచుకోవడం/జీవించడం’ అనే క్రియాభేదం మరియు రూపకం నిలుపబడ్డాయి.
