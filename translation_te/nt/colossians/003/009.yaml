    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: అబద్ధం చెప్పకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థక రూపంలోని నిషేధాన్ని ఆధునిక తెలుగులో నేరుగా, సహజంగా వ్యక్తపరుస్తుంది. సందర్భం కొనసాగుతున్న అలవాటును తప్పనిసరిగా సూచించనందున ‘అబద్ధాలు చెప్పడం మానండి’ అని చేయలేదు.
- source_word: εἰς ἀλλήλους
  choice: ఒకరితో ఒకరు
  rationale: పరస్పర సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ఈ సందర్భంలో εἰς అనే ఉపసర్గను పదశః అనువదించడం అవసరం లేదు.
- source_word: ἀπεκδυσάμενοι
  choice: విప్పివేశారు కదా
  rationale: ἀπεκδύομαιలోని వస్త్రాన్ని విప్పివేసే రూపకాన్ని నిలుపుతుంది. ‘కదా’ అనే నిర్మాణం ఆజ్ఞకు ఆధారంగా ఉన్న పూర్తయిన చర్యను సహజ తెలుగులో సూచిస్తుంది; భాగధాతువు యొక్క సంబంధం పూర్తిగా ఏకార్థకమని మాత్రం నిర్ధారించదు.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: పాత మనిషిని
  rationale: తదుపరి వచనంలోని ‘కొత్త మనిషి’తో పౌలు ఉద్దేశించిన సమాంతర వ్యత్యాసాన్ని నిలుపుతుంది. ‘పాత స్వభావం’ మరింత వ్యాఖ్యానాత్మకమైనది.
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: అతని ఆచరణలతో సహా
  rationale: σύνలోని సహవర్తిత్వాన్ని ‘తో సహా’ స్పష్టంగా చూపుతుంది. πράξειςకు నైతిక సందర్భంలో అలవాటైన ప్రవర్తనను సూచించే ‘ఆచరణలు’ సరిపోతుంది; αὐτοῦ అనే పుంలింగ ఏకవచన సర్వనామం ‘పాత మనిషి’తో అన్వయించబడింది.
theological_decisions:
- issue: τὸν παλαιὸν ἄνθρωπον యొక్క భావం
  choice: పాత మనిషి
  alternative: పాత స్వభావం; పాత వ్యక్తిత్వం
  rationale: పౌలు ఉపయోగించిన పుంలింగ ఏకవచన మానవ రూపకాన్నీ, తదుపరి వచనంలోని ‘కొత్త మనిషి’తో దాని సంబంధాన్నీ ప్రధాన పాఠం కాపాడుతుంది. ప్రత్యామ్నాయాలు అర్థాన్ని సులభం చేసినా రూపకంలోని మానవశాస్త్ర సంబంధిత ఉద్వేగాన్ని తగ్గించవచ్చు.
- issue: ἀπεκδυσάμενοι అనే భాగధాతువు ప్రధాన ఆజ్ఞతో కలిగిన సంబంధం
  choice: ఆజ్ఞకు ఆధారం/కారణం అనే భావాన్ని ‘కదా’తో వ్యక్తపరచడం
  alternative: ‘విప్పివేసుకొని’ అనే సమాంతర లేదా కాలసంబంధ భాగధాతు నిర్మాణం
  rationale: సందర్భంలో విశ్వాసుల మారిన స్థితి అబద్ధం చెప్పవద్దనే ఆజ్ఞకు ఆధారంగా కనిపిస్తుంది. అయినా గ్రీకు భాగధాతువు కారణ, కాల, లేదా అనుబంధ చర్యగా గ్రహించగల సౌలభ్యాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన బహువచన ఆజ్ఞారూపం వాడబడింది. ‘విప్పివేశారు’ వస్త్రరూపకాన్ని నిలుపుతూనే సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంది. ‘ఆచరణలు’ నైతిక ప్రవర్తనను సహజంగా సూచిస్తుంది.
