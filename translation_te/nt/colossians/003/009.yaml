  yaml_path: translation/nt/colossians/003/009.yaml
  text: Do not lie to one another[a], since you have stripped off the old man with his practices[b],
translation:
  language: te
  text: ఒకరితో ఒకరు అబద్ధం చెప్పకండి[a], ఎందుకంటే మీరు పాత మనిషిని[b] అతని ఆచరణలతో పాటు విప్పివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకరితో ఒకరు అబద్ధాలు చెప్పడం మానండి.” గ్రీకు వర్తమాన ఆజ్ఞార్థక రూపం కొనసాగుతున్న పనిని ఆపమనే భావాన్ని ఇవ్వగలదు; అయితే ఇక్కడ ఆ భావం తప్పనిసరి కాదు.
    reason: lexical_alternative
  - marker: b
