id: COL.3.16
reference: Colossians 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: te
  text: మెస్సీయ వాక్యం మీలో సమృద్ధిగా నివసించనీయండి[a]. సమస్త జ్ఞానంతో, కీర్తనలతో, స్తోత్రగీతాలతో, ఆధ్యాత్మిక గీతాలతో ఒకరికొకరు బోధిస్తూ, హెచ్చరిస్తూ, మీ హృదయాల్లో కృపతో[b] దేవునికి పాడండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ మధ్య.” గ్రీకులోని బహువచనం, వాక్యం సంఘమంతటిలో నివసించడాన్నీ విశ్వాసులలో వ్యక్తిగతంగా నివసించడాన్నీ సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: లేదా “కృతజ్ఞతతో.” గ్రీకు పదబంధం సందర్భానుసారంగా కృప, సౌమ్యత, లేదా కృతజ్ఞత అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ Χριστοῦ
  choice: మెస్సీయ వాక్యం
  rationale: λόγος యొక్క విస్తృత భావాన్ని ‘వాక్యం’ నిలుపుతుంది. Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది; షష్ఠీ విభక్తిలోని మూలం/విషయం అనే భావసాధ్యతను అతిగా నిర్ణయించకుండా ‘మెస్సీయ వాక్యం’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐνοικείτω ἐν ὑμῖν πλουσίως
  choice: మీలో సమృద్ధిగా నివసించనివ్వండి
  rationale: వర్తమాన ఆజ్ఞార్థకం నిరంతర స్థితిని సూచిస్తుంది. ‘నివసించు’ అంతర్నివాస రూపకాన్ని కాపాడుతుంది; బహువచనమైన ‘మీలో’ సమాజమంతటిలోను వ్యక్తులలోను అనే సాధ్యతను తెరిచి ఉంచుతుంది.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: సంపూర్ణ జ్ఞానంతో
  rationale: ఈ పదబంధం ముందున్న నివాసానికి గానీ తరువాతి బోధన-హెచ్చరికలకు గానీ అనుసంధానమయ్యే వాక్యనిర్మాణ సందిగ్ధత కలిగి ఉంది. తెలుగు పదక్రమం దానిని ప్రధానంగా తరువాతి క్రియలతో సహజంగా కలిపినా, భావాన్ని పూర్తిగా కుదించదు.
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτούς
  choice: ఒకరికొకరు బోధిస్తూ, హెచ్చరిస్తూ
  rationale: బహువచన సందర్భంలో ἑαυτούς పరస్పర చర్యను సూచిస్తుంది. νουθετέω లోని దిద్దుబాటు/హితబోధ భావాన్ని ‘హెచ్చరిస్తూ’ స్పష్టంగా అందిస్తుంది.
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: కీర్తనలతో, స్తోత్రగీతాలతో, ఆత్మసంబంధమైన పాటలతో
  rationale: మూడు గానరూపాల భేదాన్ని నిలుపుతూ దత్తివిభక్తిని సాధనార్థక ‘తో’ ద్వారా వ్యక్తం చేసింది. πνευματικαῖς నేరుగా ᾠδαῖς‌ను విశేషిస్తున్నందున ‘ఆత్మసంబంధమైన పాటలు’ అని ఇచ్చింది.
- source_word: ἐν χάριτι
  choice: కృపతో
  rationale: χάρις యొక్క కృప/కృతజ్ఞత భావసాధ్యతలో మూలపదానికి దగ్గరైన ‘కృపతో’ను ప్రధాన పాఠంలో ఉంచి, ‘కృతజ్ఞతతో’ను పాదసూచికలో నిలిపింది.
- source_word: ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ
  choice: మీ హృదయాల్లో ... దేవునికి
  rationale: అంతరంగ గానాన్ని సూచించే గ్రీకు నిర్మాణాన్ని నేరుగా, సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: Χριστοῦ యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός మెస్సీయ బిరుదుగా పనిచేస్తుంది. అందువల్ల దాని యూద మెస్సీయ సంబంధిత భావాన్ని స్పష్టంగా నిలిపేందుకు ‘మెస్సీయ’ ఎంచుకోబడింది.
- issue: ἐν ὑμῖν లో సామూహిక మరియు వ్యక్తిగత భావాలు
  choice: మీలో
  alternative: మీ మధ్య
  rationale: గ్రీకు బహువచనం సంఘంలో సమష్టిగా నివసించడాన్నీ విశ్వాసులలో వ్యక్తిగతంగా నివసించడాన్నీ సూచించగలదు. ‘మీలో’ మూలానికి దగ్గరగా ఉండి రెండు భావాలకు చోటిస్తుంది; సామూహిక ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- issue: ἐν χάριτι యొక్క భావం
  choice: కృపతో
  alternative: కృతజ్ఞతతో
  rationale: సందర్భంలో χάρις కృపను లేదా కృతజ్ఞతను సూచించగలదు. ప్రధాన పాఠం మూలపద రూపాన్ని నిలుపగా, నిజమైన ప్రత్యామ్నాయ భావాన్ని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘నివసించనివ్వండి,’ ‘ఒకరికొకరు,’ ‘హృదయాల్లో’ వంటి సహజ రూపాలు ఎంచుకోబడ్డాయి; ‘మెస్సీయ,’ ‘కృప’ వంటి కీలక దైవశాస్త్రీయ పదాలు భావపరిధిని నిలుపుతాయి.
