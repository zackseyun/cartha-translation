  rationale: మధ్యమ ప్రయోగంలోని ఆజ్ఞారూపాన్ని, సద్గుణాలను వస్త్రాలవలె ధరించాలనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὖν
