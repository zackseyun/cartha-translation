  yaml_path: translation/nt/colossians/003/012.yaml
  text: Put on[a], then, as God’s chosen ones, holy and beloved, compassion, kindness, humility, gentleness[b], and patience[c],
translation:
  language: te
  text: కాబట్టి, దేవునిచే ఎన్నుకోబడినవారిగా, పవిత్రులుగా, ప్రియమైనవారిగా, కనికర హృదయాన్ని[a], దయను, వినయాన్ని, సౌమ్యతను[b], సహనాన్ని[c] ధరించుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా “కనికరపు అంతరంగ భాగాలు”; ఇది లోతైన, అంతరంగ కనికరాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మృదుత్వాన్ని.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “దీర్ఘ సహనాన్ని”; ముఖ్యంగా ఇతరుల పట్ల ఓర్పుతో, కోపాన్ని అదుపులో ఉంచడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνδύσασθε
