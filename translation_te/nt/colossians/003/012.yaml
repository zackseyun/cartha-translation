  rationale: ముందటి ఉపదేశం నుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὡς ἐκλεκτοὶ τοῦ θεοῦ
  choice: దేవుడు ఎన్నుకున్నవారిగా
  rationale: ఎన్నుకోవడంలో దేవుని చొరవను నిలుపుతూ, తరువాతి సిద్ధాంత వ్యవస్థలను వాక్యంలోకి చేర్చదు.
- source_word: ἅγιοι καὶ ἠγαπημένοι
  choice: పవిత్రులుగా, ఆయన ప్రేమించినవారిగా
  rationale: రెండు విశేషణాత్మక గుర్తింపులను తెలుగులో స్పష్టంగా ఉంచుతుంది; ἠγαπημένοιలోని దైవీయ కర్తను సందర్భానుసారంగా ‘ఆయన’తో వెల్లడిస్తుంది.
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: కనికరంతో నిండిన హృదయాన్ని
  rationale: అక్షరార్థంగా ‘కనికరపు అంతరంగ అవయవాలు’ అనే గ్రీకు నుడికారాన్ని సహజమైన తెలుగులో లోతైన అంతరంగ కనికరంగా వ్యక్తపరుస్తుంది.
- source_word: χρηστότητα
  choice: దయను
  rationale: ఇతరుల మేలు కోరే దయాగుణాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: ταπεινοφροσύνην
  choice: వినయాన్ని
  rationale: తన్నుతాను తగ్గించుకునే మనోభావాన్ని తెలిపే ప్రామాణిక ఆధునిక తెలుగు పదం.
- source_word: πραΰτητα
  choice: సాత్వికాన్ని
  rationale: బలహీనత అనే భావాన్ని కలిగించకుండా అదుపులోని మృదుత్వం, శాంత స్వభావం అనే నైతిక భావాన్ని నిలుపుతుంది.
- source_word: μακροθυμίαν
  choice: దీర్ఘశాంతాన్ని
  rationale: ముఖ్యంగా ఇతరుల పట్ల కోపాన్ని ఆలస్యం చేస్తూ సహించే μακροθυμία భావాన్ని సాధారణ ‘ఓర్పు’కన్నా నిర్దిష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἐκλεκτοὶ τοῦ θεοῦలోని ఎన్నిక భాషను ఏ సిద్ధాంత వ్యవస్థను ముందుగానే నిర్ణయించకుండా అనువదించడం
  choice: దేవుడు ఎన్నుకున్నవారిగా
  alternative: దేవుని ఎన్నికైనవారిగా
  rationale: ఈ వాక్యం దేవుడు వారిని ఎన్నుకున్నాడని చెబుతుంది గాని ఆ ఎన్నిక విధానం లేదా క్రమాన్ని వివరించదు; క్రియాత్మక రూపం మూల భావాన్ని స్పష్టంగా, తటస్థంగా నిలుపుతుంది.
- issue: ἠγαπημένοιలోని కర్తను తెలుగులో స్పష్టపరచడం
  choice: ఆయన ప్రేమించినవారిగా
  alternative: ప్రియులుగా
  rationale: సందర్భంలో దేవుడే ఎన్నుకున్నవారిని ప్రేమించినవాడని నిర్మాణం సూచిస్తుంది. ‘ఆయన’ అనేది కొత్త సిద్ధాంత సమాచారాన్ని చేర్చకుండా తెలుగులో సంబంధాన్ని స్పష్టం చేస్తుంది.
- issue: πραΰτητα యొక్క నైతిక బలాన్ని ఆధునిక తెలుగులో నిలుపడం
  choice: సాత్వికాన్ని
  alternative: మృదుత్వాన్ని
  rationale: ‘సాత్వికం’ శాంతమైన, అదుపుగల స్వభావాన్ని సూచిస్తుంది; కేవలం మృదుత్వం లేదా బలహీనతగా భావాన్ని కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైన బహువచన ఆజ్ఞారూపం. వస్త్రధారణ రూపకాన్ని ‘ధరించుకోండి’తో నిలిపి, గుణాల జాబితాను సహజమైన ద్వితీయా విభక్తిలో ఇచ్చాం. ‘సాత్వికం,’ ‘దీర్ఘశాంతం’ బైబిలు పఠనంలో పరిచితమైనప్పటికీ అర్థస్పష్టత కోసం పాదటిప్పణులు జోడించాం.
