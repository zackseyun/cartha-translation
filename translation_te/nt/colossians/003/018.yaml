id: COL.3.18
reference: Colossians 3:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Αἱ γυναῖκες, ὑποτάσσεσθε ⸀τοῖς ἀνδράσιν, ὡς ἀνῆκεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/018.yaml
  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: te
  text: భార్యలారా, ప్రభువులో తగినట్లుగా[b] మీ భర్తలకు లోబడి ఉండండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ భర్తలకు విధేయులై ఉండండి.’
    reason: lexical_alternative
  - marker: b
    text: ‘తగినట్లుగా’ అని అనువదించిన గ్రీకు క్రియ రూపపరంగా ‘తగినదై ఉండేది’ అని కూడా చెప్పవచ్చు; అయితే ఈ సందర్భంలో అది సాధారణంగా వర్తించే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: భార్యలారా
  rationale: గృహసంబంధ ఉపదేశంలో ἀνδράσινతో జతగా ఉన్నందున ఇక్కడ సాధారణంగా ‘స్త్రీలు’ అని కాక, వివాహ సంబంధంలోని ‘భార్యలు’ అని అర్థం. సంబోధనను సహజమైన తెలుగులో ‘భార్యలారా’గా ఇచ్చాం.
- source_word: ὑποτάσσεσθε
  choice: లోబడి ఉండండి
  rationale: వర్తమాన మధ్యమ/కర్మణి ఆజ్ఞారూపం సంబంధంలో తనను తాను క్రమపరచుకొని లోబడటాన్ని సూచిస్తుంది. ‘లోబడి ఉండండి’ అనేది బలవంతంగా లోబరచబడటం అనే భావాన్ని చేర్చకుండా తెలుగులో సహజంగా ఉంటుంది.
- source_word: τοῖς ἀνδράσιν
  choice: మీ భర్తలకు
  rationale: గృహసంబంధ సందర్భంలో ἀνήρ అంటే ‘పురుషుడు’ కాక ‘భర్త.’ తెలుగు సంబంధాన్ని స్పష్టంగా, సహజంగా చెప్పేందుకు ‘మీ’ చేర్చబడింది.
- source_word: ὡς
  choice: తగిన విధంగా
  rationale: ὡς ఇక్కడ కారణాన్ని కాక, ఆచరణకు తగిన ప్రమాణం లేదా విధాన్ని పరిచయం చేస్తుంది.
- source_word: ἀνῆκεν
  choice: తగిన
  rationale: రూపపరంగా ఇది అసంపూర్ణ భూతకాలమైనా, ఈ ఉపదేశ సందర్భంలో సాధారణంగా వర్తించే సముచితతను వ్యక్తం చేస్తుంది. ‘తగిన’ అనే రూపం కాలాన్ని అతిగా నిర్ధారించకుండా సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: ఈ పదబంధాన్ని సన్నిహితంగా నిలుపుతూ, ఆచరణ తగినదనే నిర్ణయాన్ని ప్రభువుతో ఉన్న సంబంధ పరిధిలో ఉంచుతుంది.
theological_decisions:
- issue: ఉపదేశం యొక్క పరిధి మరియు ఆధారం
  choice: ‘ప్రభువులో తగిన విధంగా’ అని ఉంచి, ఈ ఉపదేశంలోని సముచితత ప్రభువుతో ఉన్న సంబంధంలో నిర్ణయించబడుతుందని చూపించాం.
  alternative: దీన్ని ఎలాంటి పరిమితి లేని సాధారణ సామాజిక నియమంగా అనువదించడం; లేదా ‘ప్రభువులో’ అన్నది భార్యలను మాత్రమే విశేషిస్తుందని స్పష్టం చేయడం.
  rationale: గ్రీకు వాక్య నిర్మాణంలో ἐν κυρίῳ సముచితతను తెలిపే ἀνῆκενతో సహజంగా కలిసి ఉంది. అనువాదం ఈ అర్థసంబంధాన్ని కాపాడుతుంది; అయితే వచనం స్పష్టంగా చెప్పని సిద్ధాంతపరమైన పరిమితులను లేదా విస్తరణలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన సాధారణ పాఠక శైలిని వాడాం. ‘లోబడి ఉండండి’ అనే పదబంధం మూలంలోని సంబంధపరమైన ఆజ్ఞను నిలుపుతుంది; ‘ప్రభువులో తగిన విధంగా’ దాని ధార్మిక అర్హతను విస్తరించకుండా కాపాడుతుంది.
