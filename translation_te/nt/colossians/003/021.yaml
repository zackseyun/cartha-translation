id: COL.3.21
reference: Colossians 3:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ πατέρες, μὴ ἐρεθίζετε τὰ τέκνα ὑμῶν, ἵνα μὴ ἀθυμῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/021.yaml
  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: te
  text: తండ్రులారా, మీ పిల్లలు నిరుత్సాహపడకుండా వారిని రెచ్చగొట్టకండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ధైర్యం కోల్పోకుండా.”
    reason: ἀθυμέω అనే క్రియకు ‘నిరుత్సాహపడడం’తో పాటు ‘ధైర్యం కోల్పోవడం’ అనే భావం కూడా ఉంది.
lexical_decisions:
- source_word: οἱ πατέρες
  choice: తండ్రులారా
  rationale: πατέρες అనే పదం ఇక్కడ వ్యాకరణపరంగా, పదార్థపరంగా ‘తండ్రులు’ అని సూచిస్తుంది. గృహసంబంధ ఉపదేశంలో ప్రత్యేకంగా సంబోధించబడిన వారిని యథాతథంగా ఉంచుతుంది.
- source_word: μὴ ἐρεθίζετε
  choice: రెచ్చగొట్టకండి
  rationale: ἐρεθίζω ప్రతికూల ప్రతిస్పందన కలిగేలా పదేపదే చికాకు పెట్టడం లేదా ప్రేరేపించడం అనే భావాన్ని ఇస్తుంది. ‘రెచ్చగొట్టకండి’ క్రియాశీల భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὰ τέκνα ὑμῶν
  choice: మీ పిల్లలను
  rationale: τέκνα సంతానాన్ని లింగభేదం లేకుండా సూచించే సాధారణ పదం; ‘మీ పిల్లలను’ సహజమైన, ఖచ్చితమైన అనువాదం.
- source_word: ἵνα μὴ
  choice: అలా చేస్తే ... పడవచ్చు
  rationale: ἵνα μή ఇక్కడ ఉద్దేశం లేదా నివారించవలసిన ఫలితాన్ని సూచిస్తుంది. తెలుగులో ఈ హెచ్చరికను సహజంగా తెలియజేస్తూ ఫలిత సంబంధాన్ని నిలుపుతుంది.
- source_word: ἀθυμῶσιν
  choice: నిరుత్సాహపడవచ్చు
  rationale: ἀθυμέω ధైర్యం కోల్పోవడం, మనసు కుంగిపోవడం అనే అంతరంగ స్థితిని సూచిస్తుంది. ‘నిరుత్సాహపడవచ్చు’ ఆధునిక పాఠకులకు సులభంగా అర్థమవుతుంది.
theological_decisions:
- issue: గృహసంబంధ ఉపదేశంలో πατέρες పరిధి
  choice: ప్రత్యేకంగా తండ్రులను సంబోధించడం
  alternative: సాధారణంగా తల్లిదండ్రులను సంబోధించడం
  rationale: గ్రీకు మూలంలో ‘తండ్రులు’ అని స్పష్టంగా ఉంది. ఈ ఉపదేశ సూత్రం ఇతర సంరక్షకులకు వర్తించవచ్చుగానీ, అనువాదం మూలంలోని నిర్దిష్ట సంబోధనను సాధారణీకరించదు.
- issue: ἵνα μή యొక్క సంబంధం
  choice: నివారించవలసిన ఫలితాన్ని సహజ తెలుగు షరతు-ఫలిత నిర్మాణంతో వ్యక్తపరచడం
  alternative: ‘వారు నిరుత్సాహపడకుండా’ అని ఉద్దేశార్థకంగా అనువదించడం
  rationale: ఈ నిర్మాణం ఉద్దేశం లేదా ఫలితం రెండింటి ఛాయను కలిగి ఉండగలదు. ‘అలా చేస్తే’ అనేది తండ్రుల ప్రవర్తనకూ పిల్లల నిరుత్సాహానికీ ఉన్న సంబంధాన్ని స్పష్టం చేస్తుంది; గమనిక ప్రత్యామ్నాయ సహజ రూపాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన బహువచన సంబోధనతో రూపొందించబడింది. ‘రెచ్చగొట్టకండి’ సాధారణ పాఠకులకు సహజంగా ఉండి మూలంలోని ప్రతికూల ప్రేరేపణ భావాన్ని నిలుపుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
