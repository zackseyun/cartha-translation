revisions:
- from: తండ్రులారా, మీ పిల్లలను రెచ్చగొట్టకండి; అలా చేస్తే వారు నిరుత్సాహపడవచ్చు.[a]
  to: తండ్రులారా, మీ పిల్లలు నిరుత్సాహపడకుండా వారిని రెచ్చగొట్టకండి.[a]
  rationale: The revision preserves the source’s specific address to fathers, the prohibition against provoking children, and the ἵνα μή preventive-purpose relationship in natural modern Telugu. The footnote supplies the legitimate lexical alternative for ἀθυμῶσιν and remains correctly anchored.
