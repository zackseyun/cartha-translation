    text: లేదా, “వారు ధైర్యం కోల్పోకుండా.”
    reason: ἀθυμέω అనే క్రియకు ‘నిరుత్సాహపడడం’తో పాటు ‘ధైర్యం కోల్పోవడం’ అనే భావం కూడా ఉంది.
  revision_rationale: The revision preserves the source’s specific address to fathers, the prohibition against provoking children, and the ἵνα μή preventive-purpose relationship in natural modern Telugu. The footnote supplies the legitimate lexical alternative for ἀθυμῶσιν and remains correctly anchored.
