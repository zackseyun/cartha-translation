id: COL.3.4
reference: Colossians 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ⸀ὑμῶν, τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: te
  text: మీ జీవమైన మెస్సీయ[a][b] ప్రత్యక్షమైనప్పుడు, అప్పుడు మీరు కూడా ఆయనతో పాటు మహిమలో ప్రత్యక్షమవుతారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.” గ్రీకు Χριστός ఒక బిరుదు; దాన్ని “మెస్సీయ” లేదా “క్రీస్తు” అని ఇవ్వవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “మెస్సీయ, మీ జీవం.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మహిమలో ఆయనతో పాటు మీరు కూడా బయలుపరచబడతారు.” వాక్యంలోని రెండు చోట్లా ఒకే గ్రీకు క్రియామూలం వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ప్రత్యక్షమైనప్పుడు
  rationale: భవిష్యత్తులో ఎదురుచూస్తున్న సంఘటనను సూచించే కాలవాచక నిర్మాణాన్ని సహజమైన తెలుగులో ‘అప్పుడు/ఎప్పుడు’ భావంతో అందిస్తుంది.
- source_word: ὁ Χριστὸς
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉంది. దాని బిరుదు స్వభావాన్ని నిలుపుతూ ‘మెస్సీయ’ అని అనువదించాం; తెలుగులో సుపరిచితమైన ‘క్రీస్తు’ను పాదసూచికలో ఇచ్చాం.
- source_word: φανερωθῇ
  choice: ప్రత్యక్షమైనప్పుడు
  rationale: φανερόω యొక్క భావం బహిరంగంగా కనిపించడం లేదా వెల్లడికావడం. ‘ప్రత్యక్షమైనప్పుడు’ సహజమైన తెలుగు; సందర్భంలోని భవిష్య సంఘటనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἡ ζωὴ ὑμῶν
  choice: మీ జీవమైన
  rationale: ‘మీ జీవం’ అనే గ్రీకు సమానాధికార పదబంధం మెస్సీయనే విశ్వాసుల జీవంగా గుర్తిస్తుంది. తెలుగులో ‘మీ జీవమైన’ ఆ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా ఉంచుతుంది.
- source_word: τότε καὶ ὑμεῖς
  choice: అప్పుడు మీరు కూడా
  rationale: τότε యొక్క కాలక్రమాన్ని, καί మరియు స్పష్టమైన ὑμεῖς ఇచ్చే భాగస్వామ్య ఉద్ఘాటనను రెండింటినీ నిలుపుతుంది.
- source_word: σὺν αὐτῷ
  choice: ఆయనతో పాటు
  rationale: సన్నిహిత సహవాసం మరియు ఆయనతో కలసి ఆ సంఘటనలో పాలుపంచుకోవడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: φανερωθήσεσθε
  choice: ప్రత్యక్షమవుతారు
  rationale: మొదటి φανερωθῇతో ఉన్న పదపునరుక్తిని ‘ప్రత్యక్ష’ అనే ఒకే మూలంతో నిలుపుతుంది. కఠినమైన కర్మణి రూపం కంటే ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: ἐν δόξῃ
  choice: మహిమలో
  rationale: మూలంలోని సంక్షిప్త పూర్వప్రత్యయ పదబంధాన్ని, దాని అంత్యకాల మరియు దైవిక గంభీరతను నిలుపుతుంది.
theological_decisions:
- issue: Χριστόςను బిరుదుగా లేదా పేరువలె అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: నిర్దిష్ట ఉపపదంతో వచ్చిన Χριστός ఇక్కడ బిరుదు భావాన్ని బలంగా కలిగి ఉంది. అందువల్ల బిరుదు అర్థాన్ని ముందుకు తెచ్చే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో ఉంచి, సుపరిచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: మెస్సీయను విశ్వాసుల జీవంగా గుర్తించే సమానాధికార నిర్మాణం
  choice: మీ జీవమైన మెస్సీయ
  alternative: మెస్సీయ—మీ జీవం
  rationale: మెస్సీయనే వారి జీవం అని మూలపాఠ్యం నేరుగా గుర్తిస్తుంది. దాన్ని కేవలం జీవానికి కారణం లేదా జీవదాత అని వివరణాత్మకంగా మార్చకుండా, మూలంలోని బలమైన గుర్తింపును నిలిపాం.
- issue: రెండు φανερόω రూపాల మధ్య సమాంతరత
  choice: ప్రత్యక్షమైనప్పుడు … ప్రత్యక్షమవుతారు
  alternative: బయలుపరచబడినప్పుడు … బయలుపరచబడతారు
  rationale: ఒకే తెలుగు మూలపదాన్ని ఉపయోగించి క్రీస్తు ప్రత్యక్షతకూ విశ్వాసుల ప్రత్యక్షతకూ మధ్యనున్న ఉద్దేశపూర్వక సమాంతరతను నిలిపాం; అదే సమయంలో సహజమైన తెలుగు వాక్యనిర్మాణాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యక్రమం, అయితే ‘మెస్సీయ’, ‘మహిమ’ వంటి గంభీరమైన బైబిలు పదాలను నిలిపాం. మూలంలోని క్రీస్తు–విశ్వాసుల ప్రత్యక్షత సమాంతరతను ఒకే తెలుగు పదమూలంతో ప్రతిబింబించాం.
