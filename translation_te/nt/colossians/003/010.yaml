  yaml_path: translation/nt/colossians/003/010.yaml
  text: and have put on the new self[a], which is being renewed in knowledge according to the image of the one who created it[b],
translation:
  language: te
  text: మరియు మీరు నూతన మనిషిని[a] ధరించుకున్నారు; అతనిని సృష్టించినవాని స్వరూపానికి అనుగుణంగా జ్ఞానం పొందుటకు అతడు నూతనపరచబడుతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నూతన స్వరూపాన్ని.” గ్రీకు వ్యక్తీకరణ పరిసర వాక్యంలోని “పాత మనిషి/స్వరూపం”తో వ్యత్యాసాన్ని చూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: ధరించుకున్నారు
  rationale: భూతకాల అసమాపక క్రియ సూచించే, ఇప్పటికే జరిగిన చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, వస్త్రాన్ని ధరించే రూపకాన్ని నిలుపుతుంది.
- source_word: τὸν νέον
  choice: నూతన మనిషిని
  rationale: కొత్త/పాత మనిషి అనే సందర్భానుసారమైన మానవశాస్త్రీయ వ్యత్యాసాన్ని నిలుపుతుంది. తెలుగులో ‘మనిషి’ సాధారణంగా మానవ వ్యక్తిని సూచించగలదు; ‘స్వభావం’ అనడం మూలంలో లేని భావాన్ని చేర్చవచ్చు.
- source_word: ἀνακαινούμενον
  choice: నూతనపరచబడుతున్నాడు
  rationale: వర్తమానకాల కర్మణి అసమాపక క్రియలోని కొనసాగుతున్న ప్రక్రియను, కర్మణి భావాన్ని రెండింటినీ కాపాడుతుంది.
- source_word: εἰς ἐπίγνωσιν
  choice: జ్ఞానం పొందేలా
  rationale: εἰς సూచించే గమ్యం లేదా ఫలిత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ἐπίγνωσις‌లో ఉండగల ‘పూర్ణమైన/లోతైన జ్ఞానం’ అనే నుడికారాన్ని ప్రధాన పాఠంలో బలవంతంగా చేర్చకుండా పాదసూచికలో ఉంచుతుంది.
- source_word: κατ’ εἰκόνα
  choice: స్వరూపానికి అనుగుణంగా
  rationale: κατά ఇక్కడ ప్రమాణం లేదా సారూప్యాన్ని సూచిస్తుంది; ఆదికాండంలోని దేవుని స్వరూప భాషకు ఉండగల ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: τοῦ κτίσαντος αὐτόν
  choice: తనను సృష్టించినవాని
  rationale: సృష్టికర్తను వ్యక్తిగతంగా సూచిస్తూ, αὐτόν‌ను ‘నూతన మనిషి’తో స్పష్టంగా అనుసంధానిస్తుంది.
theological_decisions:
- issue: τὸν νέον అనే మానవశాస్త్రీయ వ్యక్తీకరణ
  choice: నూతన మనిషిని
  alternative: నూతన స్వరూపాన్ని / కొత్త వ్యక్తిత్వాన్ని
  rationale: మూలంలోని substantival adjectiveను, పరిసర వాక్యంలోని ‘పాత మనిషి’తో వ్యత్యాసాన్ని కాపాడుతుంది. ‘స్వభావం’ లేదా ‘వ్యక్తిత్వం’ అని అనువదిస్తే అర్థం అనవసరంగా సంకుచితం కావచ్చు.
- issue: ἐπίγνωσις యొక్క భావబలం
  choice: జ్ఞానం
  alternative: పూర్ణ జ్ఞానం / లోతైన జ్ఞానం
  rationale: ఈ పదానికి మరింత సంపూర్ణమైన లేదా లోతైన జ్ఞానం అనే నుడికారం ఉండవచ్చు; అయితే ‘పూర్ణ’ అన్నది రూపంలో స్పష్టంగా లేకపోవడంతో ఆ అవకాశాన్ని పాదసూచికలో ఉంచాం.
- issue: పునరుద్ధరణకు ప్రమాణమైన ‘స్వరూపం’
  choice: తనను సృష్టించినవాని స్వరూపానికి అనుగుణంగా
  alternative: తన సృష్టికర్త పోలికలో
  rationale: సృష్టికర్త స్వరూపమే పునరుద్ధరణకు ప్రమాణమని తెలిపే నిర్మాణాన్ని నిలుపుతూ, అది వ్యక్తిగతమా సామూహికమా అనే ప్రశ్నను అనవసరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ధరించుకున్నారు’ ద్వారా వస్త్ర రూపకాన్ని, ‘నూతనపరచబడుతున్నాడు’ ద్వారా కొనసాగుతున్న కర్మణి ప్రక్రియను నిలిపాం. మూలంలోని పొడవైన భాగవాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం.
