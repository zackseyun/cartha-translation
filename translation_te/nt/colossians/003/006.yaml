id: COL.3.6
reference: Colossians 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δι’ ἃ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ⸂ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας⸃·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/006.yaml
  text: Because of these things the wrath of God is coming upon the sons of disobedience[a].
translation:
  language: te
  text: వీటి కారణంగా దేవుని ఉగ్రత అవిధేయత కుమారులపైకి వస్తోంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అవిధేయత సంతానం’; అంటే అవిధేయతతో గుర్తించబడినవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ἃ
  choice: వీటి కారణంగానే
  rationale: διά + accusative ఇక్కడ కారణాన్ని సూచిస్తుంది. ‘వీటి’ అనేది ముందరి వచనంలో పేర్కొన్న దురాచారాలను బహువచనంగా తిరిగి సూచిస్తుంది; ‘-నే’ కారణ సంబంధాన్ని సహజంగా బలపరుస్తుంది.
- source_word: ἔρχεται
  choice: వస్తోంది
  rationale: వర్తమానకాల రూపంలోని రాబోయే లేదా సమీపిస్తున్న తీర్పు భావాన్ని నిలుపుతుంది; దీనిని సాధారణ సత్యంగా ‘వస్తుంది’ అని మాత్రమే మార్చదు.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: దేవుని ఉగ్రత
  rationale: ὀργήలోని దైవిక న్యాయతీర్పుకు సంబంధించిన తీవ్రమైన కోప భావాన్ని ‘ఉగ్రత’ సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది; సంబంధ విభక్తి నిర్మాణం కూడా నిలుస్తుంది.
- source_word: ἐπὶ
  choice: మీదికి
  rationale: Accusativeతో ἐπί ఉగ్రత వచ్చే లక్ష్యాన్ని లేదా దిశను సూచిస్తుంది. ‘మీదికి’ తెలుగులో ఆ చలన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: అవిధేయత కుమారులు
  rationale: మూలంలోని సెమిటిక్ శైలిగల ‘అవిధేయత కుమారులు’ అనే పురుషలింగ రూపకాన్ని ప్రధాన పాఠ్యంలో కాపాడుతుంది; ఇది అవిధేయత లక్షణంగా గల మనుషులను సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
theological_decisions:
- issue: ‘అవిధేయత కుమారులు’ అనే మూలభాషా నుడికారాన్ని ఉంచాలా, లేక దాని భావాన్ని నేరుగా చెప్పాలా
  choice: ప్రధాన పాఠ్యంలో ‘అవిధేయత కుమారులు’ అని ఉంచడం
  alternative: ‘అవిధేయులైనవారు’ లేదా ‘అవిధేయత సంతానం’
  rationale: గ్రీకు పాఠంలోని υἱούς అనే పురుషలింగ నుడికారాన్ని, దాని మూలభాషా ప్రత్యేకతను నిలుపుతూ అనువదించాం. అది జీవశాస్త్రీయ కుమారత్వాన్ని కాక, అవిధేయతతో లక్షణీకరించబడిన ప్రజలను సూచిస్తుందని పాదటిప్పణిలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బైబిలు శైలి. వాక్యం సంక్షిప్తంగా ఉంచి, మూలంలోని కారణం, రాబోయే తీర్పు, లక్ష్యం అనే సంబంధాలను స్పష్టంగా నిలిపాం.
