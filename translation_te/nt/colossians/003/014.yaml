id: COL.3.14
reference: Colossians 3:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: te
  text: వీటన్నిటికంటే మించి ప్రేమను ధరించుకోండి. అదే పరిపూర్ణత యొక్క బంధం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సంపూర్ణత యొక్క బంధం,’ లేదా ‘పరిణతి యొక్క బంధం.’
    reason: τελειότης అనే పదానికి పరిపూర్ణత, సంపూర్ణత, పరిణతి అనే సంబంధిత అర్థఛాయలు ఉన్నాయి; ‘యొక్క’ అనే నిర్మాణం గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: అయితే, వీటన్నిటిపైన
  rationale: ἐπί + దత్తి విభక్తి ఇక్కడ ముందున్న దుస్తులు ధరించే రూపకాన్ని కొనసాగిస్తూ, ఇతర సద్గుణాలన్నిటికి పైన ప్రేమను ధరించాలనే భావాన్ని ఇస్తుంది. ‘వీటన్నిటిపైన’ ఆ రూపకాన్నీ ప్రాధాన్యాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: τὴν ἀγάπην
  choice: ప్రేమను
  rationale: ἀγάπηకి సహజమైన, విస్తృతంగా అర్థమయ్యే ఆధునిక తెలుగు పదం ‘ప్రేమ’; సందర్భంలో ఇది మిగతా సద్గుణాలను ఏకం చేసే ప్రధాన గుణం.
- source_word: '[implicit verb from ἐνδύσασθε in 3:12]'
  choice: ధరించుకోండి
  rationale: ఈ వాక్యంలో క్రియ ప్రత్యక్షంగా లేకపోయినా, 12వ వచనంలోని ἐνδύσασθε అనే ఆజ్ఞ ఇక్కడ కొనసాగుతుంది. ‘ధరించుకోండి’ దుస్తుల రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: ὅ
  choice: అదే
  rationale: నపుంసక ఏకవచన సంబంధ సర్వనామం ప్రేమ అనే భావాన్ని లేదా మొత్తం ఉపదేశాన్ని తిరిగి సూచిస్తుంది. ‘అదే’ ఈ వివరణాత్మక సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; దాని సూచనను మరీ సంకుచితం చేయదు.
- source_word: σύνδεσμος
  choice: బంధం
  rationale: σύνδεσμος కట్టేది లేదా కలిపి ఉంచేది అనే భావం కలిగిన పదం. ‘బంధం’ సంక్షిప్తంగా ఉండి, ప్రేమ ఇతర గుణాలను ఏకం చేస్తుందనే రూపకానికి సరిపోతుంది.
- source_word: τῆς τελειότητος
  choice: పరిపూర్ణతకు
  rationale: τελειότης సంపూర్ణత, పరిపూర్ణత లేదా పరిణతి అనే భావాలను కలిగి ఉంది. ‘పరిపూర్ణతకు’ అనే రూపం గ్రీకు షష్ఠీ విభక్తిలోని సంబంధాన్ని అతిగా నిర్దిష్టం చేయకుండా, సహజమైన తెలుగులో సంక్షిప్తతను నిలుపుతుంది.
theological_decisions:
- issue: ప్రేమ ‘పరిపూర్ణతకు బంధం’ కావడం అనే భావం
  choice: ప్రేమను పరిపూర్ణతతో సంబంధమున్న, ఏకం చేసే బంధంగా సంక్షిప్తంగా పేర్కొనడం
  alternative: ప్రేమ పరిపూర్ణతను కలిగించే బంధం; లేదా పరిపూర్ణతకు చెందిన బంధం; లేదా పరిణతికి నడిపే బంధం
  rationale: τῆς τελειότητος అనే షష్ఠీ విభక్తి బంధం పరిపూర్ణతకు చెందినదా, దానిని కలిగించేదా, లేక సంపూర్ణ ఏకత్వాన్ని సూచించేదా అన్నది పూర్తిగా నిర్దిష్టం చేయదు. ‘పరిపూర్ణతకు బంధం’ గ్రీకు వాక్యపు సంక్షిప్తతను, భావపరమైన విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన బహువచన ఆజ్ఞారూపం వాడబడింది. ‘వీటన్నిటిపైన … ధరించుకోండి’ అనే నిర్మాణం సందర్భంలోని దుస్తుల రూపకాన్ని స్పష్టంగా కొనసాగిస్తుంది; వాక్యం సాధారణ పాఠకులకు సహజంగా, సంక్షిప్తంగా ఉండేలా రూపొందించబడింది.
