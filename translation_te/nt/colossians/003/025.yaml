translation:
  language: te
  text: ఎందుకంటే అన్యాయం చేసేవాడు తాను చేసిన అన్యాయానికి తగిన ప్రతిఫలాన్ని పొందుతాడు[a]; పక్షపాతం ఉండదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాను చేసిన అన్యాయాన్నే తిరిగి పొందుతాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎవరి పక్షమూ వహించడం ఉండదు.” గ్రీకు పదానికి అక్షరార్థంగా ‘ముఖాన్ని స్వీకరించడం’ అనే నేపథ్యం ఉంది; అంటే ఒకరి బాహ్య హోదా లేదా స్థితిని బట్టి పక్షపాతం చూపడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: ఎందుకంటే అన్యాయం చేసేవాడు
  rationale: γάρ ముందున్న ఉపదేశానికి కారణాన్ని సూచిస్తుంది; substantival present participle సాధారణంగా అన్యాయం చేసే వ్యక్తిని సూచిస్తుంది. ‘అన్యాయం చేసేవాడు’ సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: κομίσεται
  choice: తగిన ప్రతిఫలం పొందుతాడు
  rationale: ఈ సందర్భంలో κομίζω చేసిన పనికి తిరిగి దక్కేదాన్ని పొందడం అనే ప్రతిఫల భావాన్ని కలిగిస్తుంది. తెలుగు వాక్యంలో ప్రతికార స్వరాన్ని అతిగా చేర్చకుండా న్యాయమైన ప్రతిఫల భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ὃ ἠδίκησεν
  choice: తాను చేసిన అన్యాయానికి
  rationale: సంబంధవాచక సర్వనామం మరియు aorist క్రియ గతంలో చేసిన అన్యాయాన్ని సూచిస్తాయి. ‘తాను’ ఏకవచన కర్తతో సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: పక్షపాతం ఉండదు
  rationale: προσωπολημψία హోదా లేదా బాహ్య స్థితిని బట్టి ఒకరికి అనుకూలంగా తీర్పు చెప్పడాన్ని సూచిస్తుంది. ‘పక్షపాతం’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: implicit generic masculine in ὁ ... ἀδικῶν / ἠδίκησεν
  choice: అన్యాయం చేసేవాడు … తాను
  rationale: గ్రీకులోని వ్యాకరణ ఏకవచనాన్ని నిలుపుతూ, తెలుగులో సహజంగా సాధారణ వ్యక్తిని సూచిస్తుంది; అవసరం లేని లింగ సూచక సర్వనామాన్ని చేర్చదు.
theological_decisions:
- issue: దైవిక తీర్పు మరియు నిష్పక్షపాతత్వం యొక్క స్వభావం
  choice: అన్యాయం చేసినవాడు దానికి తగిన ప్రతిఫలం పొందుతాడనే సాధారణ సూత్రంగా అనువదించబడింది; తీర్పు జరిగే విధానం లేదా సమయం పేర్కొనబడలేదు.
  alternative: దీనిని కేవలం అంత్యకాల తీర్పుగా లేదా దాసులు–యజమానుల సామాజిక సంబంధాలకు మాత్రమే పరిమితమైన హెచ్చరికగా అనువదించడం.
  rationale: గ్రీకు వాక్యం విస్తృతమైన నైతిక-దైవశాస్త్రీయ హెచ్చరికను ఇస్తుంది. మూలం నిర్దేశించని తీర్పు సమయాన్ని లేదా పరిధిని అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, హెచ్చరికలోని గంభీరతను నిలుపుతూ సంక్షిప్తంగా రూపొందించబడింది. మూలంలోని సాధారణ ఏకవచనం మరియు నిష్పక్షపాత ప్రతిఫల భావం కాపాడబడ్డాయి.
