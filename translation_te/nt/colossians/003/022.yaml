revisions:
- from: దాసులారా,[a] శరీరపరంగా మీ యజమానులైనవారికి[b] అన్ని విషయాల్లో విధేయులై ఉండండి. మనుషులను మెప్పించేవారిలా, కంటికి కనిపించేటప్పుడు మాత్రమే సేవ చేయకుండా,[c] ప్రభువుకు భయపడుతూ హృదయనిష్కపటత్వంతో సేవ చేయండి.
  to: దాసులారా,[a] ఈ లోక సంబంధంలో మీ యజమానులకు[b] ప్రతి విషయంలో విధేయత చూపండి. మనుషులను మెప్పించేవారిలా, కంటికి కనిపించడానికి మాత్రమే సేవ చేయకుండా,[c] హృదయపూర్వక నిజాయితీతో సేవ చేయండి; ప్రభువుకు భయపడుతూ ఉండండి.
  rationale: The revision retains every semantic element of the Greek while using more natural modern Telugu. It keeps the ancient slavery setting explicit, retains the distinction between human masters and the Lord, and expresses ‘eye-service’ idiomatically. The added explicit ‘సేవ చేయండి’ remains a permissible Telugu completion of the Greek’s coordinated manner clauses; the semicolon permits ‘ప్రభువుకు భయపడుతూ ఉండండి’ to function naturally as the participial motivation accompanying the command.
