reference: Colossians 3:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: te
  text: దాసులారా,[a] ఈ లోక సంబంధంలో మీ యజమానులకు[b] ప్రతి విషయంలో విధేయత చూపండి. మనుషులను మెప్పించేవారిలా, కంటికి కనిపించడానికి మాత్రమే సేవ చేయకుండా,[c] హృదయపూర్వక నిజాయితీతో సేవ చేయండి; ప్రభువుకు భయపడుతూ ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘దాసులు’ (గ్రీకు: δοῦλοι) అనే పదం సాధారణంగా యజమాని అధికారానికి లోబడిన బానిసలను సూచిస్తుంది; సందర్భానుసారం దీనిని ‘సేవకులు’ అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: ‘ఈ లోక సంబంధంలో’ అనేది అక్షరార్థంగా ‘శరీరానుసారంగా’ అనే భావం; ఈ యజమానుల అధికారం మానవ, ఈ లోక సంబంధాల పరిధికే చెందినదని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అంటే, ఎవరైనా చూస్తున్నప్పుడు మాత్రమే పని చేయడం.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: దాసులారా
  rationale: ఈ గృహనియమాల సందర్భంలో δοῦλοι యజమాని అధికారానికి లోబడిన బానిసలనే సూచిస్తుంది. ‘దాసులు’ తెలుగు బైబిలు వాడుకకు అనుగుణంగా ఉండి, ‘సేవకులు’ అనే మృదువైన ఉద్యోగార్థాన్ని నివారిస్తుంది; చారిత్రక స్థితిని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: ὑπακούετε κατὰ πάντα
  choice: అన్ని విషయాల్లో విధేయులై ఉండండి
  rationale: ఆజ్ఞార్థకమైన ὑπακούετεను సహజమైన ఆధునిక తెలుగులో అందిస్తూ, κατὰ πάντα యొక్క విస్తృత పరిధిని నిలుపుతుంది.
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: శరీరపరంగా మీ యజమానులైనవారికి
  rationale: κατὰ σάρκα అనే పౌలు ప్రయోగాన్ని ‘ఈ లోక సంబంధంలో’ అని పూర్తిగా వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది; κυρίοιςను మానవ యజమానులకు తగినట్లు అనువదించి, చివరలోని దైవిక ‘ప్రభువు’తో భేదం చూపుతుంది.
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: కంటికి కనిపించేటప్పుడు మాత్రమే సేవ చేయకుండా
  rationale: అరుదైన సమాసపదానికి అక్షరానువాదమైన అసహజ ‘కంటిసేవ’కు బదులు, పర్యవేక్షణ ఉన్నప్పుడే పని చేయడమనే భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: మనుషులను మెప్పించేవారిలా
  rationale: మానవుల మెప్పునే లక్ష్యంగా చేసుకునే ప్రతికూల భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ἁπλότητι καρδίας
  choice: హృదయనిష్కపటత్వంతో
  rationale: ἁπλότης ఇక్కడ అమాయకత్వం లేదా సరళబుద్ధి కాకుండా ఏకచిత్తమైన నిజాయితీని సూచిస్తుంది; ఈ సమాసం ఆ నైతిక భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: φοβούμενοι τὸν κύριον
  choice: ప్రభువుకు భయపడుతూ
  rationale: దైవభయమనే బైబిలు భావాన్ని మృదువుగా ‘గౌరవిస్తూ’ అని మార్చకుండా నిలుపుతుంది; κύριος ఇక్కడ మానవ యజమానులకు భిన్నమైన ప్రభువును సూచిస్తుంది.
theological_decisions:
- issue: దాసత్వ సందర్భంలోని నైతిక ఉపదేశం
  choice: దాసులు–యజమానులు అనే ప్రాచీన సామాజిక వాస్తవాన్ని స్పష్టంగా అనువదించి, దానిని ఆధునిక ఉద్యోగ సంబంధంగా మార్చలేదు.
  alternative: ‘సేవకులు–ఉద్యోగదాతలు’ అని మృదువుగా లేదా ఆధునికీకరించి అనువదించడం.
  rationale: గ్రీకు పదాలు ప్రాచీన దాసత్వ గృహవ్యవస్థను సూచిస్తున్నాయి. దాన్ని ఉద్యోగ సంబంధంగా చూపడం వచనంలోని చారిత్రక, నైతిక ఉద్రిక్తతను మరుగుపరుస్తుంది; అనువాదం ఈ వ్యవస్థను సమర్థిస్తున్నట్లు అదనంగా వ్యాఖ్యానించదు.
- issue: మానవ యజమానులు మరియు ప్రభువు మధ్య వ్యత్యాసం
  choice: మానవ κυρίοιςకు ‘యజమానులు,’ దైవిక τὸν κύριονకు ‘ప్రభువు’ వాడబడింది.
  alternative: రెండు చోట్లా ఒకే పదమైన ‘ప్రభువులు/ప్రభువు’ లేదా ‘యజమానులు/యజమాని’ వాడడం.
  rationale: మూలంలోని పదప్రయోగ సంబంధాన్ని పూర్తిగా చెరపకుండా, సందర్భం ఉద్దేశించిన మానవ అధికారం–దైవిక ప్రభువు భేదాన్ని తెలుగులో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘దాసులు’ చారిత్రక వాస్తవాన్ని నిలుపుతుంది; ‘కంటికి కనిపించేటప్పుడు మాత్రమే’ అరుదైన గ్రీకు సమాసాన్ని సహజంగా వివరిస్తుంది. మూలంలో ‘సేవ చేయండి’ అనే క్రియ రెండోసారి ప్రత్యక్షంగా లేకపోయినా, ἐν ἁπλότητι καρδίας అనే వ్యతిరేక విధానవాచక భాగాన్ని తెలుగులో సంపూర్ణంగా, సహజంగా చేయడానికి సందర్భానుగుణంగా చేర్చబడింది.
