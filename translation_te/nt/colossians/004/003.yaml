source:
  edition: SBLGNT
  text: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι’ ὃ καὶ δέδεμαι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: te
  text: 'అదే సమయంలో మా కోసం కూడా ప్రార్థిస్తూ ఉండండి: మెస్సీయ మర్మాన్ని చెప్పడానికి దేవుడు మాకు వాక్యము కొరకు ఒక ద్వారం తెరవాలని[a]. దాని కారణంగానే నేనూ బంధించబడి ఉన్నాను[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాక్యము కోసం ఒక అవకాశం తెరవాలని’; అక్షరార్థంగా, ‘వాక్యము కొరకు ఒక ద్వారం.’
    reason: రూపకానికి సంబంధించిన భావ ప్రత్యామ్నాయం
  - marker: c
    text: లేదా, ‘దాని కారణంగానే నేనూ సంకెళ్లలో ఉన్నాను.’
    reason: కారాగార బంధాన్ని స్పష్టం చేసే పద ప్రత్యామ్నాయం
lexical_decisions:
- source_word: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν
  choice: అదే సమయంలో మా కోసం కూడా ప్రార్థిస్తూ ఉండండి
  rationale: వర్తమాన కృదంతం మునుపటి వచనంలోని ప్రార్థనా ప్రోత్సాహాన్ని కొనసాగిస్తుంది. ‘అదే సమయంలో’ ἅμα భావాన్ని, ‘కూడా’ καί భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతాయి.
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου
  choice: దేవుడు మాకు వాక్యానికి ఒక తలుపు తెరవాలని
  rationale: θύρα అనే రూపకాన్ని ‘అవకాశం’ అని పూర్తిగా వివరణాత్మకంగా మార్చకుండా తలుపు రూపకంగానే ఉంచింది; λόγος‌ను పౌలు ప్రకటించే సందేశాన్ని సూచించే ‘వాక్యం’గా అనువదించింది.
- source_word: λαλῆσαι
  choice: మేము చెప్పగలగాలని
  rationale: తలుపు తెరవడం యొక్క ఉద్దేశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, λαλέω యొక్క సాధారణ ‘చెప్పు/మాట్లాడు’ భావాన్ని నిలుపుతుంది; ‘ప్రకటించు’ అనే మరింత సాంకేతిక భావాన్ని అనవసరంగా చేర్చదు.
- source_word: τὸ μυστήριον
  choice: మర్మాన్ని
  rationale: పౌలు వాడుకలో ఒకప్పుడు దాచబడి ఇప్పుడు బయలుపరచబడిన దేవుని ఉద్దేశం అనే భావాన్ని ‘మర్మం’ నిలుపుతుంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తోంది. ‘మెస్సీయ మర్మం’ అనే నిర్మాణం గ్రీకు షష్ఠీ విభక్తిలోని సంబంధాన్ని అతిగా నిర్వచించకుండా ఉంచుతుంది.
- source_word: δι’ ὃ καὶ δέδεμαι
  choice: దాని కారణంగానే నేనూ బంధించబడి ఉన్నాను
  rationale: διά + accusative యొక్క కారణార్థాన్ని స్పష్టం చేస్తుంది. perfect passive వల్ల వచ్చిన ప్రస్తుత బంధిత స్థితిని ‘బంధించబడి ఉన్నాను’ నిలుపుతుంది; καί‌ను ‘నేనూ’గా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός పేరు వలె కాక బిరుదుగా అర్థవంతంగా పనిచేస్తోంది; అందువల్ల ‘మెస్సీయ’ మూలపద బిరుదు భావాన్ని ప్రత్యక్షంగా తెలియజేస్తుంది.
- issue: θύραν τοῦ λόγου రూపకం
  choice: వాక్యానికి ఒక తలుపు
  alternative: సందేశాన్ని చెప్పడానికి ఒక అవకాశం
  rationale: పౌలు ఉపయోగించిన తలుపు రూపకాన్ని ప్రధాన పాఠ్యంలో కాపాడి, దాని భావవ్యాఖ్యను పాదటిప్పణిలో అందించింది.
- issue: τοῦ Χριστοῦ అనే షష్ఠీ సంబంధం
  choice: మెస్సీయ మర్మం
  alternative: మెస్సీయకు సంబంధించిన మర్మం
  rationale: గ్రీకు పదబంధం ‘మెస్సీయకు సంబంధించిన మర్మం’ లేదా ‘మెస్సీయ యొక్క మర్మం’ వంటి సంబంధ ఛాయలను అనుమతిస్తుంది. సంక్షిప్త తెలుగు సమాసం ఆ సంబంధాన్ని మితిమీరి నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వాక్య నిర్మాణం మునుపటి వచనంలోని ప్రోత్సాహానికి కొనసాగింపుగా ఉంది. ‘వాక్యం,’ ‘మర్మం,’ ‘తలుపు’ వంటి పౌలీయ పదచిత్రాలను నిలుపుతూ, అసహజమైన పదానువాదాన్ని తగ్గించింది.
