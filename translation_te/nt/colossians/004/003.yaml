  to: 'అదే సమయంలో మా కోసం కూడా ప్రార్థిస్తూ ఉండండి: మెస్సీయ మర్మాన్ని చెప్పడానికి దేవుడు మాకు వాక్యము కొరకు ఒక ద్వారం తెరవాలని[a]. దాని కారణంగానే నేనూ బంధించబడి ఉన్నాను[c].'
