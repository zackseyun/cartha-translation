review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately retains the central imagery of gracious, salt-seasoned speech and the distributive force of responding to each person. However, πῶς δεῖ (‘how it is necessary/fitting [for you]’) is not expressed: ‘ఎలా జవాబివ్వాలో’ means only ‘how to answer,’ omitting the source’s sense of what is appropriate or required. ‘అప్పుడు ... తెలుసుకుంటారు’ also recasts the infinitival clause as a straightforward future-result assertion more strongly than necessary.'
  naturalness: The draft is generally understandable modern Telugu. ‘ఉప్పుతో రుచిచేయబడినవిగా’ is intelligible but somewhat mechanically passive; it is retained in the revision because it directly preserves the metaphor and is acceptable in a formal exhortative register. ‘మీ మాటతీరు’ naturally conveys λόγος here as one’s manner of speaking.
  terminology: ‘కృపతో’ appropriately preserves the breadth of ἐν χάριτι without reducing it solely to politeness. The revised wording explicitly renders δεῖ with ‘తగిన విధంగా.’
  issues:
  - severity: medium
    issue: The force of δεῖ is omitted.
    rationale: The Greek asks how believers ought/need to answer each individual, not merely how they will answer. A Telugu expression such as ‘ఎలా తగిన విధంగా జవాబివ్వాలో’ retains this fitting-necessity nuance.
  - severity: low
    issue: The result/purpose relation of εἰδέναι is rendered as an unqualified future statement.
    rationale: ‘అప్పుడు ... తెలుసుకుంటారు’ is possible as a result reading, but ‘దీని ద్వారా ... తెలుసుకోగలరు’ more naturally preserves the practical purpose/result connection without making it overly definite.
  revised_text: మీ మాటతీరు ఎల్లప్పుడూ కృపతో కూడినదిగా[a], ఉప్పుతో రుచిచేయబడినదిగా[b] ఉండాలి. దీని ద్వారా ప్రతి ఒక్కరికి ఎలా తగిన విధంగా జవాబివ్వాలో మీరు తెలుసుకోగలరు.
