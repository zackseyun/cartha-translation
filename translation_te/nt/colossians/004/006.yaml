source:
  edition: SBLGNT
  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: te
  text: మీ మాటతీరు ఎల్లప్పుడూ కృపతో కూడినదిగా[a], ఉప్పుతో రుచిచేయబడినదిగా[b] ఉండాలి. దీని ద్వారా ప్రతి ఒక్కరికి ఎలా తగిన విధంగా జవాబివ్వాలో మీరు తెలుసుకోగలరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దయతో కూడినదిగా.’ ‘కృపతో’ అనే పదబంధం దయ, సౌమ్యత, లేదా అనుగ్రహంతో గుర్తించబడే మాటతీరును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఉప్పుతో రుచిచేయబడినది’ అనేది సందర్భానికి తగిన, ఆసక్తికరమైన, వివేకవంతమైన మాటతీరుకు రూపకం; చప్పగా లేదా చెడగొట్టేదిగా ఉండే మాటతీరుకు భిన్నమైనది.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος ὑμῶν
  choice: మీ మాటలు
  rationale: ఈ ఉపదేశ సందర్భంలో λόγος ఒకే పదాన్ని లేదా అధికారిక సందేశాన్ని కాక, విశ్వాసుల మాటతీరును సూచిస్తుంది. ‘మీ మాటలు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: కాలవ్యాప్తిని సంపూర్ణంగా సూచించే సహజమైన తెలుగు సమానార్థకం.
- source_word: ἐν χάριτι
  choice: కృపతో
  rationale: మూలంలోని విభక్తి సంబంధాన్ని నిలుపుతూ, దయతో కూడిన మాట అనే భావాన్నీ పౌలు రచనల్లోని విస్తృత ‘కృప’ ప్రతిధ్వనినీ అనవసరంగా కుదించకుండా ఉంచుతుంది.
- source_word: ἅλατι ἠρτυμένος
  choice: ఉప్పుతో రుచిచేయబడినవిగా
  rationale: ఉప్పు అనే మూల రూపకాన్ని నిలుపుతుంది. పరిపూర్ణ కృదంతం సూచించే స్థిరమైన లక్షణాన్ని ‘రుచిచేయబడినవిగా’ తెలియజేస్తుంది; బహువచనమైన ‘మాటలు’కు అనుగుణంగా ఉంది.
- source_word: εἰδέναι
  choice: అప్పుడు ... తెలుసుకుంటారు
  rationale: ఈ క్రియారూపానికి ముందరి ఉపదేశంతో ఉన్న వాక్యనిర్మాణ సంబంధం కఠినమైనది; ఉద్దేశం లేదా ఫలితం అనే భావాన్ని సహజ తెలుగులో ‘అప్పుడు’ ద్వారా చూపిస్తూ, దానిని అతిగా నిర్దిష్టీకరించదు.
- source_word: πῶς δεῖ
  choice: ఎలా ... జవాబివ్వాలో
  rationale: δεῖ సూచించే అవసరం లేదా తగిన విధానం తెలుగులో అంతర్లీనంగా వ్యక్తమవుతుంది. ‘ఎలా’ ప్రతి వ్యక్తికి తగిన జవాబు చెప్పే విధానంపై దృష్టి నిలుపుతుంది.
- source_word: ἑνὶ ἑκάστῳ
  choice: ప్రతి ఒక్కరికి
  rationale: ప్రతి వ్యక్తిని విడివిడిగా పరిగణించే మూలంలోని పంపిణీ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀποκρίνεσθαι
  choice: జవాబివ్వాలో
  rationale: సంభాషణలో ప్రత్యుత్తరం ఇవ్వడం అనే మూలక్రియ యొక్క ప్రత్యక్ష భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἐν χάριτι యొక్క భావ పరిధి
  choice: కృపతో
  alternative: దయతో / మనోహరంగా
  rationale: ‘కృపతో’ అనే రూపం మాటల్లో దయ, అనుగ్రహం, సౌమ్యత అనే పరస్పర సంబంధ భావాన్ని అనుమతించడంతో పాటు, χάρις పదంలోని పౌలీయ ధార్మిక ప్రతిధ్వనిని తొలగించదు.
- issue: εἰδέναι యొక్క వాక్యనిర్మాణ సంబంధం
  choice: ఫలితం లేదా ఆచరణాత్మక పరిణామాన్ని సూచించే ‘అప్పుడు’
  alternative: ‘తెలుసుకోవడానికి’ అనే స్పష్టమైన ఉద్దేశార్థం
  rationale: గ్రీకు అనంతక్రియ ఉద్దేశం లేదా ఫలితం రెండింటిలో ఏదో ఒకటిగా అర్థమవవచ్చు. ‘అప్పుడు’ సహజమైన తెలుగును ఇస్తూ ఈ సంబంధాన్ని మరీ కఠినంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఉపదేశ శైలి వాడబడింది. మూలంలోని ఉప్పు రూపకం అలాగే నిలుపబడింది. ‘కృపతో’ అనే పదబంధంలోని భావ విస్తృతిని పాదటిప్పణి వివరిస్తుంది.
