id: COL.4.18
reference: Colossians 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: te
  text: ఈ అభివాదాన్ని నా స్వహస్తంతో రాశాను—పౌలు.[a] నా సంకెళ్లను జ్ఞాపకం ఉంచుకోండి.[b] కృప మీతో ఉండుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అభివాదం.” గ్రీకు పదం ఇక్కడ పౌలు స్వయంగా రాసిన ఉత్తర ముగింపు అభివాదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నా చెరను” లేదా “నా బంధాలను.” అక్షరార్థంగా “నా సంకెళ్లను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασμός
  choice: శుభాకాంక్ష
  rationale: ఉత్తరం చివరలో పౌలు స్వయంగా రాసిన అభివాదాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: పౌలు అనే నేను నా స్వహస్తంతో ... రాస్తున్నాను
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్త నిర్మాణాన్ని తెలుగులో సహజంగా విప్పి, ఇది పౌలు స్వయంగా చేతితో రాసిన ముగింపు అభివాదమని తెలియజేస్తుంది.
- source_word: μνημονεύετέ
  choice: జ్ఞాపకం ఉంచుకోండి
  rationale: వర్తమాన ఆజ్ఞార్థక రూపంలోని కొనసాగింపు భావాన్ని అతిగా విస్తరించకుండా సహజమైన తెలుగు ఆజ్ఞగా వ్యక్తం చేస్తుంది.
- source_word: μου τῶν δεσμῶν
  choice: నా సంకెళ్లను
  rationale: δεσμοί యొక్క స్పష్టమైన సంకెళ్ల రూపకాన్ని నిలుపుతుంది; ఇది పౌలు చెరలో ఉన్న స్థితిని కూడా సూచిస్తుంది.
- source_word: ἡ χάρις
  choice: కృప
  rationale: మూలంలో ఎవరి కృపో స్పష్టంగా జోడించబడలేదు; అందువల్ల అదనపు వివరణ లేకుండా పౌలు వాడే ఆశీర్వాద పదాన్ని నిలుపుతుంది.
- source_word: μεθ’ ὑμῶν
  choice: మీకు తోడుగా ఉండుగాక
  rationale: క్రియలేని గ్రీకు ఆశీర్వాద వాక్యాన్ని సహజమైన తెలుగు దీవెన రూపంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: క్రియ స్పష్టంగా లేని పౌలు ముగింపు ఆశీర్వాదం
  choice: కృప మీకు తోడుగా ఉండుగాక
  alternative: కృప మీతో
  rationale: మూల గ్రీకులో క్రియ లేదు. తెలుగులో సంపూర్ణమైన, సహజమైన ఆశీర్వాద వాక్యం కోసం ‘ఉండుగాక’ను సరఫరా చేసింది; కొత్త వేదాంత విషయాన్ని జోడించలేదు.
- issue: δεσμοί యొక్క సాక్షాత్కార మరియు రూపకాల భావం
  choice: నా సంకెళ్లను
  alternative: నా చెరను
  rationale: సంకెళ్లనే సాక్షాత్కార చిత్రాన్ని నిలుపుతూ, పౌలు కారాగార స్థితిని సూచించే సహజమైన రూపకార్థాన్ని తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘స్వహస్తంతో’ ఉత్తర రచనా సందర్భానికి తగిన కొద్దిగా అధికారిక పదం; ‘సంకెళ్లు’ మూలంలోని సజీవ చిత్రాన్ని కాపాడుతుంది.
