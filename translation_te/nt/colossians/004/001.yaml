id: COL.4.1
reference: Colossians 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν ⸀οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your servants with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: te
  text: యజమానులారా, మీ బానిసలకు న్యాయమైనదాన్నీ నిష్పక్షపాతమైనదాన్నీ[a] ఇవ్వండి; పరలోకంలో మీకూ ప్రభువు ఉన్నాడని తెలిసికొని ఇలా చేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమానత్వం.” ఇక్కడి గ్రీకు పదానికి “సమానత్వం,” “న్యాయసమ్మతత,” లేదా “నిష్పక్షపాతత” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι
  choice: యజమానులారా
  rationale: ఈ గృహసంబంధ సందర్భంలో κύριοι అనేది బానిసలపై అధికారం కలిగిన మానవ యజమానులను సూచిస్తుంది. సంబోధనను తెలుగులో సహజంగా చూపించడానికి ‘యజమానులారా’ అని అనువదించాం.
- source_word: τὸ δίκαιον
  choice: న్యాయమైనది
  rationale: దీనికి న్యాయబద్ధమైనది లేదా సరైనది అనే భావం ఉంది. ‘న్యాయమైనది’ ఈ ఆజ్ఞలోని నైతిక బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὴν ἰσότητα
  choice: సముచితమైనది
  rationale: ἰσότης అనే పదం సమానత్వం, న్యాయసమ్మతత, సముచితత అనే భావాలను కలిగి ఉంటుంది. సందర్భంలో న్యాయమైన వ్యవహారాన్ని సహజ తెలుగులో తెలియజేయడానికి ‘సముచితమైనది’ అని వాడి, ‘సమానత్వం’ అనే ముఖ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: τοῖς δούλοις
  choice: మీ బానిసలకు
  rationale: యజమానులు–బానిసల సామాజిక సంబంధం ఇక్కడ ప్రత్యక్షంగా ఉంది. కాబట్టి బంధిత స్థితిని మృదువుగా మార్చకుండా δοῦλοι అనే పదాన్ని ‘బానిసలు’గా అనువదించాం.
- source_word: παρέχεσθε
  choice: ఇవ్వండి
  rationale: ఈ ఆజ్ఞారూప క్రియ అవసరమైన న్యాయమైన వ్యవహారాన్ని అందించడం లేదా కల్పించడం అనే భావాన్ని ఇస్తుంది. ‘ఇవ్వండి’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: εἰδότες
  choice: తెలుసుకోండి
  rationale: మూలంలోని కృదంతం ఆజ్ఞకు ఆధారమైన అవగాహనను తెలియజేస్తుంది. తెలుగులో సహజమైన ఆజ్ఞా నిర్మాణం కోసం ప్రత్యేక క్రియగా వ్యక్తం చేశాం.
- source_word: καὶ ὑμεῖς
  choice: మీకూ
  rationale: మానవ యజమానులు కూడా మరొకరి అధికారానికి లోబడినవారనే నొక్కిచెప్పే భావాన్ని ‘మీకూ’ నిలుపుతుంది.
- source_word: κύριον
  choice: ప్రభువు
  rationale: ఇక్కడ పరలోక అధికారిని సూచించే κύριος పదంలోని ధార్మిక గౌరవాన్ని ‘ప్రభువు’ నిలుపుతుంది; భూలోక యజమానుల నుంచి ఆయనను భేదిస్తుంది.
- source_word: ἐν οὐρανῷ
  choice: పరలోకంలో
  rationale: ఈ ఏకవచన గ్రీకు పదబంధానికి ‘పరలోకంలో’ అనేది స్పష్టమైన, సాధారణ తెలుగు సమానార్థకం.
theological_decisions:
- issue: గృహసంబంధ సందర్భంలో δοῦλοι పదం
  choice: బానిసలు
  alternative: సేవకులు; దాసులు
  rationale: ఈ వాక్యంలో యజమానులతో ఉన్న బంధిత సామాజిక సంబంధం స్పష్టంగా ప్రస్తావించబడింది. ‘సేవకులు’ ఆ స్థితిని మృదువుపరచవచ్చు; ‘దాసులు’ ఆధునిక పాఠకులకు తక్కువ ప్రత్యక్షంగా ఉండవచ్చు. అందువల్ల ‘బానిసలు’ ఎంచుకున్నాం.
- issue: ἰσότητα పదంలోని భావ పరిధి
  choice: సముచితమైనది
  alternative: సమానత్వం; న్యాయసమ్మతమైనది
  rationale: ఈ పదం సమానత్వాన్నీ సముచితమైన లేదా న్యాయసమ్మతమైన వ్యవహారాన్నీ సూచించగలదు. సందర్భానికి సహజంగా సరిపోయే ‘సముచితమైనది’ని ప్రధాన పాఠ్యంలో ఉంచి, నిజమైన ‘సమానత్వం’ అనే భావసాధ్యతను పాదసూచికలో నిలిపాం.
- issue: భూలోక κύριοι మరియు పరలోక κύριος మధ్య పదబంధ సంబంధం
  choice: యజమానులారా … ప్రభువు
  alternative: ప్రభువులారా … యజమాని
  rationale: గ్రీకులో ఒకే మూలపదం ఉన్నప్పటికీ, తెలుగులో మానవ యజమానులను ‘యజమానులు’గానూ పరలోక అధికారిని ‘ప్రభువు’గానూ చెప్పడం సందర్భాన్నీ ధార్మిక గౌరవాన్నీ స్పష్టంగా ఉంచుతుంది. అయితే మానవ యజమానులు కూడా అధికారానికి లోబడినవారనే వ్యత్యాసం వాక్య నిర్మాణంలో నిలిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన నేర ఆజ్ఞా శైలిని ఉపయోగించాం. ‘బానిసలు’ అనే పదం చారిత్రక బంధిత స్థితిని దాచకుండా తెలియజేస్తుంది; ‘సముచితమైనది’ ప్రధాన పాఠ్యాన్ని సహజంగా ఉంచగా, గ్రీకు పదంలోని సమానత్వ భావాన్ని పాదసూచిక సంరక్షిస్తుంది.
