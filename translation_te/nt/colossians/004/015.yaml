id: COL.4.15
reference: Colossians 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ ⸂Νύμφαν καὶ τὴν κατ’ οἶκον αὐτῆς⸃ ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: te
  text: లవొదికయలో ఉన్న సహోదరులకు, నింఫాకు, ఆమె ఇంట్లోని సంఘానికి[a] వందనాలు చెప్పండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘నింఫాసుకు, అతని ఇంట్లోని సంఘానికి’ అని ఉంది; మరికొన్ని పాఠభేదాలు ‘వారి ఇంట్లోని సంఘానికి’ అనే భావానికి మద్దతిస్తాయి.
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: వందనాలు చెప్పండి
  rationale: రెండవ పురుష బహువచన ఆజ్ఞారూపంలోని పలకరింపు భావాన్ని ఆధునిక తెలుగులో సహజంగా, విస్తరించకుండా వ్యక్తపరుస్తుంది.
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: లవొదికయలో ఉన్న సహోదరులకు
  rationale: ἀδελφοὺς వ్యాకరణపరంగా పుంలింగ బహువచనమైనప్పటికీ, పౌలు వాడుకలో తోటి విశ్వాసుల సమూహాన్ని సూచించగలదు. ‘సహోదరులు’ మూలరూపాన్నీ, సందర్భంలోని సమూహార్థాన్నీ నిలుపుతుంది.
- source_word: Νύμφαν
  choice: నింఫాకు
  rationale: SBLGNTలోని Νύμφαν రూపాన్ని స్త్రీ పేరైన ‘నింఫా’గా అనుసరిస్తుంది; పాఠభేదంలోని పుంలింగ పేరు ‘నింఫాసు’ను పాదసూచికలో భద్రపరుస్తుంది.
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: ఆమె ఇంట్లోని సంఘానికి
  rationale: κατ’ οἶκον అనే నుడికారంలోని గృహస్థాన భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; αὐτῆςను ‘ఆమె’గా స్పష్టంగా అనువదిస్తుంది.
- source_word: ἐκκλησίαν
  choice: సంఘం
  rationale: ఈ పౌలు పత్రిక సందర్భంలో కూడే క్రైస్తవ సమాజాన్ని సూచించే ప్రామాణికమైన, సహజమైన తెలుగు పదం.
theological_decisions:
- issue: Νύμφαν అనే పేరుకు సంబంధించిన లింగం, దానికి అనుగుణమైన సర్వనామం
  choice: నింఫా … ఆమె ఇంట్లోని సంఘం
  alternative: నింఫాసు … అతని ఇంట్లోని సంఘం; లేదా వారి ఇంట్లోని సంఘం
  rationale: ముద్రిత SBLGNT పాఠంలోని స్త్రీలింగ ఏకవచన αὐτῆς (‘ఆమె’)ను ప్రధాన పాఠం అనుసరిస్తుంది. పుంలింగ, బహువచన పాఠభేదాలు నిజమైన పాఠసంబంధ అనిశ్చితిని చూపుతాయి కాబట్టి వాటిని పాదసూచికలో పేర్కొంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. వాక్యక్రమం తెలుగు నుడికారానికి అనుగుణంగా ఉన్నప్పటికీ, మూలంలోని మూడు పలకరింపు గ్రహీతల నిర్మాణం నిలుపబడింది.
