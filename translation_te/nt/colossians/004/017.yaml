id: COL.4.17
reference: Colossians 4:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: te
  text: 'అర్ఖిప్పుతో ఇలా చెప్పండి: “ప్రభువులో[a] నీవు పొందిన పరిచర్యను నెరవేర్చేలా జాగ్రత్తగా చూసుకో.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువు నుండి నీవు పొందిన పరిచర్యను.”
    reason: ἐν κυρίῳ అనే పదబంధాన్ని సందర్భానుసారంగా మూలాన్ని సూచించేదిగా కూడా అర్థం చేసుకునే అవకాశం ఉంది.
lexical_decisions:
- source_word: εἴπατε
  choice: చెప్పండి
  rationale: సంఘాన్ని ఉద్దేశించిన బహువచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: Ἀρχίππῳ
  choice: అర్ఖిప్పుతో
  rationale: వ్యక్తి పేరును గ్రీకు ఉచ్చారణకు సమీపంగా లిప్యంతరీకరించి, εἴπατε తీసుకునే పరోక్ష కర్మను ‘-తో’ విభక్తితో తెలిపింది.
- source_word: Βλέπε
  choice: శ్రద్ధ ఉంచు
  rationale: జాగ్రత్తగా గమనిస్తూ బాధ్యతను చూసుకోవాలనే వర్తమానకాల ఆజ్ఞ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: διακονίαν
  choice: పరిచర్యను
  rationale: ప్రభువుతో సంబంధంలో అప్పగించబడిన సేవ లేదా బాధ్యతను సూచిస్తుంది; ఏ ప్రత్యేక సంఘ పదవినీ నిర్దేశించదు.
- source_word: παρέλαβες
  choice: పొందిన
  rationale: తానే స్వీకరించుకున్నది కాక, అందుకున్న లేదా అప్పగించబడిన బాధ్యత అనే భావాన్ని నిలుపుతుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: ἐν అనే విభక్తి సూచించే సంబంధం లేదా పరిధిని యథాతథంగా ఉంచి, దానిని కేవలం మూలార్థమైన ‘ప్రభువు నుండి’గా నిర్ణయించదు.
- source_word: ἵνα αὐτὴν πληροῖς
  choice: పూర్తిగా నెరవేర్చేలా
  rationale: పరిచర్యను సంపూర్ణంగా నిర్వహించాలనే ఉద్దేశం మరియు కొనసాగుతున్న బాధ్యత రెండింటినీ తెలుపుతుంది.
theological_decisions:
- issue: ἐν κυρίῳ యొక్క భావసూక్ష్మత
  choice: ప్రధాన పాఠంలో ‘ప్రభువులో’
  alternative: ‘ప్రభువు నుండి’
  rationale: గ్రీకులో ἐν ఉంది; ఇది ప్రభువుతో సంబంధిత పరిధిని సూచించవచ్చు, సందర్భానుసారంగా మూలాన్ని కూడా సూచించవచ్చు. ప్రధాన పాఠం ఈ అనిశ్చితిని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంఘంలో బహిరంగంగా చదవడానికి తగిన గౌరవప్రదమైన, సులభమైన శైలి. ‘పరిచర్య’ క్రైస్తవ వాడుకలో పరిచితమైనదే అయినా ఇక్కడ ప్రత్యేక పదవిని సూచించకుండా విస్తృత సేవా బాధ్యతగా వాడబడింది.
