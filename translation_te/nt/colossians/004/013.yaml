revisions:
- from: ఎందుకంటే, మీ కోసం, లవొదికయలో ఉన్నవారి కోసం, హియెరాపొలిలో ఉన్నవారి కోసం అతడు ఎంతో ప్రయాసపడుతున్నాడని[a] అతని గురించి నేను సాక్ష్యమిస్తున్నాను.
