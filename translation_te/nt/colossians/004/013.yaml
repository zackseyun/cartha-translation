source:
  edition: SBLGNT
  text: μαρτυρῶ γὰρ αὐτῷ ὅτι ἔχει ⸂πολὺν πόνον⸃ ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/013.yaml
  text: For I testify for him that he has great labor for you and for those in Laodicea and those in Hierapolis[a].
translation:
  language: te
  text: 'ఎందుకంటే, నేను అతని గురించి సాక్ష్యమిస్తున్నాను: అతడు మీ కోసం, లవొదికయలో ఉన్నవారి కోసం, హియెరాపొలిలో ఉన్నవారి కోసం ఎంతో శ్రమపడుతున్నాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి చాలా శ్రమ ఉంది,” “అతనికి ఎంతో శ్రద్ధ ఉంది,” లేదా “అతడు తీవ్రమైన వేదన అనుభవిస్తున్నాడు.” గ్రీకు పదబంధం కఠినమైన శ్రమను సూచిస్తుంది; సందర్భానుసారంగా తీవ్రమైన శ్రద్ధను లేదా వేదనను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ … αὐτῷ
  choice: అతని గురించి నేను సాక్ష్యమిస్తున్నాను
  rationale: వర్తమానకాలంలోని వ్యక్తిగత సాక్ష్యాన్ని నేరుగా తెలియజేస్తుంది. μαρτυρέωతో వచ్చిన దత్తివిభక్తి ఇక్కడ ఎవరి గురించి సాక్ష్యమిస్తున్నాడో సూచించగలదు; తెలుగు వాక్యప్రయోగంలో ‘అతని గురించి’ సహజంగా ఉంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందరి వచనంలోని ఎపఫ్రా ప్రార్థనా పోరాటాన్ని ఈ మాట వివరిస్తున్నందున కారణార్థక అనుసంధానాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἔχει πολὺν πόνον
  choice: అతడు ఎంతో ప్రయాసపడుతున్నాడు
  rationale: అక్షరార్థకమైన ‘అతనికి చాలా శ్రమ ఉంది’ కంటే తెలుగులో సహజంగా ఉండి, πόνοςలోని కఠిన శ్రమ మరియు పట్టుదలతో కూడిన కృషి భావాన్ని నిలుపుతుంది; భావోద్వేగ ఆందోళనకే అర్థాన్ని పరిమితం చేయదు.
- source_word: ὑπὲρ ὑμῶν
  choice: మీ కోసం
  rationale: ὑπέρ ఇక్కడ వారి మేలు కోసం చేసే కృషి లేదా కలిగిన శ్రద్ధను సూచిస్తుంది; ‘మీ కోసం’ సహజమైన, స్పష్టమైన అనువాదం.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: లవొదికయలో ఉన్నవారి కోసం
  rationale: స్థలంలో ఉన్న విశ్వాసులను సూచించే గ్రీకు నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: τῶν ἐν Ἱεραπόλει
  choice: హియెరాపొలిలో ఉన్నవారి కోసం
  rationale: ముందరి సమాంతర పదబంధాన్ని నిలుపుతూ పట్టణనామాన్ని తెలుగులో లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: ఎపఫ్రా సేవకు సంబంధించి πόνος అర్థం
  choice: ఎంతో ప్రయాసపడుతున్నాడు
  alternative: ఎంతో శ్రద్ధ కలిగి ఉన్నాడు; తీవ్రమైన వేదన కలిగి ఉన్నాడు
  rationale: సమీప సందర్భం ఎపఫ్రా ప్రార్థనలో పోరాడుతున్నాడని చెబుతుంది; అందువల్ల లోతైన శ్రద్ధ లేదా వేదన భావం సాధ్యమే. అయినా πόνος ప్రాథమికంగా శ్రమ, ప్రయాసను సూచిస్తుంది. ఎంపిక చేసిన రూపం ప్రార్థనతో సహా అతని కఠిన కృషిని విస్తృతంగా నిలుపుతుంది.
- issue: μαρτυρῶ αὐτῷలో దత్తివిభక్తి సంబంధం
  choice: అతని గురించి నేను సాక్ష్యమిస్తున్నాను
  alternative: అతని పక్షంగా నేను సాక్ష్యమిస్తున్నాను
  rationale: ఈ నిర్మాణం ఎపఫ్రాకు అనుకూలంగా సాక్ష్యమివ్వడాన్ని సూచించవచ్చును; అయితే సందర్భంలో పౌలు అతని కృషి గురించి ధృవీకరిస్తున్నాడు. ‘అతని గురించి’ ఆ విషయసంబంధాన్ని సహజంగా తెలియజేస్తూ, ప్రత్యేక న్యాయపరమైన లేదా పక్షపాత భావాన్ని అనవసరంగా బలపరచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ప్రయాసపడుతున్నాడు’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని శ్రమ భావాన్ని నిలుపుతుంది. స్థలనామాలు ‘లవొదికయ,’ ‘హియెరాపొలి’గా లిప్యంతరీకరించబడ్డాయి.
