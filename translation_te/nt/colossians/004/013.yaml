  rationale: The revision improves Telugu idiom and clause clarity while preserving the source's explanatory connection, Paul's attestation concerning Epaphras, and the broad lexical range of πολὺν πόνον. The footnote anchor remains attached to the statement expressing Epaphras's labor, and the single footnote continues to document the relevant lexical alternatives.
