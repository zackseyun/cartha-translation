  - severity: low
    issue: “ఎంతో ప్రయాసపడుతున్నాడు” is somewhat less idiomatic
    rationale: “ఎంతో శ్రమపడుతున్నాడు” is more usual in modern standard Telugu and conveys the strenuous-labor sense of πολὺν πόνον clearly.
