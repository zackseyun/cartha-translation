id: COL.4.9
reference: Colossians 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σὺν Ὀνησίμῳ τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ, ὅς ἐστιν ἐξ ὑμῶν· πάντα ὑμῖν γνωρίσουσιν τὰ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: te
  text: అతనితోపాటు నమ్మకమైన, ప్రియమైన సహోదరుడూ, మీలో ఒకడూ[a] అయిన ఒనేసిము కూడా వస్తున్నాడు. ఇక్కడి సంగతులన్నిటినీ[b] వారు మీకు తెలియజేస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీ మధ్యనుండి వచ్చినవాడూ.’
    reason: ἐξ ὑμῶν మూలం లేదా సమాజానికి చెందినతనం అనే రెండు దగ్గరి భావ ఛాయలను కలిగి ఉండవచ్చు.
  - marker: b
    text: లేదా ‘ఇక్కడ ఉన్న విషయాలన్నిటినీ.’
    reason: τὰ ὧδεను ‘ఇక్కడి సంగతులు’ లేదా మరింత పదశఃగా ‘ఇక్కడ ఉన్న విషయాలు’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: σὺν
  choice: అతనితోపాటు
  rationale: σύν సహవాసాన్ని సూచిస్తుంది. మునుపటి వచనంలోని తుకికుతో ఒనేసిము కలిసి వస్తున్నాడనే సంబంధాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘అతనితోపాటు’ అని అనువదించాం.
- source_word: Ὀνησίμῳ
  choice: ఒనేసిము
  rationale: వ్యక్తి పేరును తెలుగులో సాధారణంగా వాడే రూపంలో లిప్యంతరీకరించాం.
- source_word: πιστῷ
  choice: నమ్మకమైన
  rationale: πιστός ఇక్కడ విశ్వసనీయత లేదా నమ్మకత్వాన్ని సూచిస్తుంది. ‘నమ్మకమైన’ అనే పదం ఈ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἀγαπητῷ
  choice: ప్రియమైన
  rationale: ἀγαπητόςలోని ఆప్యాయతను, సంఘ సంబంధమైన స్నేహభావాన్ని ‘ప్రియమైన’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀδελφῷ
  choice: సహోదరుడు
  rationale: ఇక్కడ ఈ పదం తోటి విశ్వాసిని సూచిస్తుంది. మూలంలోని కుటుంబ సంబంధ రూపకాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: మీలో ఒకడైన
  rationale: ἐξ ὑμῶν కొలొస్సయి సమాజానికి చెందినవాడనే భావాన్ని లేదా వారి మధ్యనుండి వచ్చినవాడనే మూలభావాన్ని కలిగి ఉంది. ‘మీలో ఒకడైన’ సహజంగా ఉండి సమాజ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πάντα
  choice: సంగతులన్నిటినీ
  rationale: πάντα సమగ్రతను సూచిస్తుంది. τὰ ὧδεతో కలిపి తెలుగులో ‘ఇక్కడి సంగతులన్నిటినీ’ అని చెప్పడం సహజం.
- source_word: γνωρίσουσιν
  choice: తెలియజేస్తారు
  rationale: γνωρίζω అంటే తెలిసేలా చేయడం లేదా సమాచారం ఇవ్వడం. ‘తెలియజేస్తారు’ మూలానికి దగ్గరగా ఉండి గౌరవప్రదమైన ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: τὰ ὧδε
  choice: ఇక్కడి సంగతులు
  rationale: ὧδε పౌలు ఉన్న చోటుకు సంబంధించిన విషయాలను సూచిస్తుంది. ‘ఇక్కడి సంగతులు’ సంఘటనలకే పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἀδελφῷ పదంలోని సంఘ సంబంధ భావం
  choice: సహోదరుడు
  alternative: విశ్వాస సహోదరుడు
  rationale: ఇది తోటి క్రైస్తవుణ్ణి సూచించినా, మూలంలో విశ్వాసం అనే వివరణాత్మక పదం లేదు. అందువల్ల కుటుంబ సంబంధమైన సంఘ భాషను విస్తరించకుండా ఉంచాం.
- issue: ἐξ ὑμῶν యొక్క భావం
  choice: మీలో ఒకడైన
  alternative: మీ మధ్యనుండి వచ్చినవాడైన
  rationale: ఒనేసిము కొలొస్సయి విశ్వాసుల సమాజానికి చెందినవాడనే గుర్తింపును ఇది కాపాడుతుంది; ఇతర లేఖలనుండి అతని సామాజిక స్థితి గురించి అదనపు భావాలను దిగుమతి చేయదు.
- issue: వచనారంభంలోని σύν యొక్క వ్యాకరణ ఆధారం
  choice: అతనితోపాటు … ఒనేసిము కూడా వస్తున్నాడు
  alternative: ఒనేసిముతో కలిసి
  rationale: గ్రీకు వాక్యం ముందరి వచనంపై వ్యాకరణపరంగా ఆధారపడుతుంది. స్వతంత్ర తెలుగు వచనంగా సహజంగా చదవడానికి ముందరి వచనంలో చెప్పిన తుకికును ‘అతనితో’ అని సూచించి, ప్రయాణ భావాన్ని ‘వస్తున్నాడు’ ద్వారా స్పష్టం చేశాం; ఇది సందర్భం నుంచి పొందిన భావమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే లేఖా శైలికి తగిన గౌరవప్రదమైన స్వరంతో రూపొందించబడింది. ‘ప్రియమైన సహోదరుడు’ అనే సంఘ సంబంధమైన ఆప్యాయ భాషను నిలిపి, మూలంలో లేని సిద్ధాంత వివరణలను చేర్చలేదు.
