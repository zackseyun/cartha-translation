  source_fidelity: సύν ముందరి వచనంలోని తుకికుతో ఒనేసిము సహప్రయాణాన్ని సూచిస్తున్న వ్యాకరణ ఆధారాన్ని సరిగ్గా ప్రతిబింబించింది. πιστός, ἀγαπητός, ἀδελφός, ἐξ ὑμῶν, πάντα, γνωρίσουσιν, τὰ ὧδε అనే అంశాలన్నీ మూలార్థానికి నమ్మకంగా ఉన్నాయి. ‘వస్తున్నాడు’ అనేది 4:7–8లోని తుకికు పంపబడుతున్న సందర్భం ద్వారా అవసరమయ్యే తెలుగు వాక్యపూర్తి; కొత్త చారిత్రక లేదా సిద్ధాంత సమాచారాన్ని చేర్చదు.
