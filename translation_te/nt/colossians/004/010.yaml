id: COL.4.10
reference: Colossians 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀσπάζεται ὑμᾶς Ἀρίσταρχος ὁ συναιχμάλωτός μου, καὶ Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ (περὶ οὗ ἐλάβετε ἐντολάς, ἐὰν ἔλθῃ πρὸς ὑμᾶς δέξασθε αὐτόν),
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: te
  text: నా తోటి ఖైదీ అరిస్తార్కు, బర్నబాకు కజిన్ అయిన మార్కు[a] మీకు వందనాలు చెబుతున్నారు. (అతని గురించి మీరు ఆదేశాలు పొందారు; అతడు మీ దగ్గరకు వస్తే, అతనికి స్వాగతం పలకండి[b].)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదానికి నిర్దిష్టంగా ‘కజిన్’ అనే అర్థం ఉంది. కొన్ని పాత అనువాదాలు దీనిని ‘మేనల్లుడు’గా అనువదించాయి, కానీ అది తక్కువ ఖచ్చితమైన అర్థం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతన్ని స్వీకరించండి.’ ఇక్కడి గ్రీకు క్రియ ఒక వ్యక్తిని, ప్రత్యేకంగా అతిథిగా, ఆదరంగా స్వీకరించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: వందనాలు చెబుతున్నాడు
  rationale: లేఖల ముగింపులో పలికే అభివాదాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: συναιχμάλωτός
  choice: తోటి ఖైదీ
  rationale: కలిసి చెరలో ఉన్న వ్యక్తి అనే మూలార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘క్రీస్తులో’ వంటి మూలంలో లేని వివరణను చేర్చదు.
- source_word: ἀνεψιὸς
  choice: వరుస సోదరుడు
  rationale: కొయినే గ్రీకులోని ‘కజిన్’ అనే నిర్దిష్ట బంధాన్ని, లింగాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
- source_word: ἐλάβετε ἐντολάς
  choice: మీరు ఆదేశాలు పొందారు
  rationale: ἐντολήలోని అధికారపూర్వక సూచన భావాన్ని అతిగా కఠినం చేయకుండా తెలియజేస్తుంది.
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: అతడు మీ దగ్గరికి వస్తే
  rationale: ἐάνతో కూడిన భవిష్యదర్థక షరతును సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: δέξασθε αὐτόν
  choice: అతనికి స్వాగతం పలకండి
  rationale: ప్రయాణికుణ్ణి ఆదరంగా చేర్చుకోవడం అనే సందర్భోచిత భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: συναιχμάλωτός μουలో పౌలుతో అరిస్తార్కుకు ఉన్న సంబంధ స్వభావం
  choice: నా తోటి ఖైదీ
  alternative: ప్రభువులో నా తోటి బందీ; కష్టాల్లో నా సహోద్యోగి
  rationale: బంధనం అక్షరార్థమా రూపకాలంకారమా అని వచనం స్పష్టంగా నిర్ణయించదు. అందువల్ల మూలంలోని పదబంధాన్ని అనువదించి, ఆ చారిత్రక లేదా తాత్త్విక ప్రశ్నను పాఠకునికి తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి వాడబడింది. మూలంలోని కుండలీకరణ నిలుపబడింది. తెలుగులో సాధారణ ‘కజిన్’కు ఏకపద నిర్దిష్ట సమానార్థకం లేకపోవడంతో ‘వరుస సోదరుడు’ ఎంచుకొని పాదసూచికలో బంధార్థాన్ని వివరించాం.
