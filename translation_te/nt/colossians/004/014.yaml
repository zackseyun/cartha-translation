id: COL.4.14
reference: Colossians 4:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: te
  text: ప్రియమైన వైద్యుడు లూకా మరియు దేమా మీకు అభివందనాలు చెబుతున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: అభివందనాలు చెబుతున్నారు
  rationale: పత్రికా సందర్భంలోని పలకరింపు సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. గ్రీకులో క్రియ ఏకవచనంగా ఉన్నప్పటికీ, లూకా మరియు దేమా అనే సంయుక్త కర్తకు అనుగుణంగా తెలుగులో బహువచన క్రియ సహజం.
- source_word: ὑμᾶς
  choice: మీకు
  rationale: రెండవ పురుష బహువచనాన్ని, కొలొస్సయి విశ్వాసుల సమూహాన్ని ఉద్దేశించిన గౌరవప్రదమైన తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: Λουκᾶς
  choice: లూకా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἰατρὸς
  choice: వైద్యుడు
  rationale: మొదటి శతాబ్దపు వృత్తిని స్పష్టంగా, గౌరవప్రదంగా సూచించే సహజమైన తెలుగు పదం.
- source_word: ἀγαπητὸς
  choice: ప్రియమైన
  rationale: ఆప్యాయతతో కూడిన గౌరవాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; లూకాను వర్ణించే విశేషణంగా ఉంచబడింది.
- source_word: καὶ
  choice: —
  rationale: లూకా, దేమా అనే ఇద్దరినీ తెలుగు సంయుక్త కర్తగా వరుసగా ఉంచడం ద్వారా సమన్వయ భావం సహజంగా వ్యక్తమవుతుంది; ప్రత్యేకంగా ‘మరియు’ చేర్చడం అవసరం లేదు.
- source_word: Δημᾶς
  choice: దేమా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
theological_decisions:
- issue: ‘ప్రియమైన’ అనే విశేషణం ఎవరిని వర్ణిస్తుంది?
  choice: ‘ప్రియమైన వైద్యుడు’ అనే పదబంధం లూకాను మాత్రమే వర్ణిస్తుంది.
  alternative: లూకా మరియు దేమా ఇద్దరికీ ‘ప్రియమైన’ వర్తిస్తుందనే పఠనం.
  rationale: గ్రీకు ὁ ἰατρὸς ὁ ἀγαπητὸς అనే సమానాధికార పదబంధం నేరుగా Λουκᾶς‌ను వర్ణిస్తుంది. తెలుగు పదక్రమం కూడా ఇదే సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే పత్రికకు తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. మూలంలోని పలకరింపు భావాన్ని ‘అభివందనాలు చెబుతున్నారు’గా సహజీకరించాం.
