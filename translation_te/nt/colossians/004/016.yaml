source:
  edition: SBLGNT
  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: te
  text: మీ మధ్య ఈ పత్రిక చదవబడిన తర్వాత, లవొదికయవారి సంఘంలో కూడా అది చదవబడేలా చూడండి. అలాగే, లవొదికయ నుండి వచ్చిన పత్రికను[a] మీరు కూడా చదవండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘పత్రిక’ అనే పదం ఇక్కడ అధ్యాహారంగా ఉంది; అక్షరార్థంగా ‘లవొదికయ నుండి వచ్చినదాన్ని’ అని ఉంది. ఈ పత్రిక ఏదో ఖచ్చితంగా తెలియదు. అది లవొదికయలో ఉన్న పత్రికను సూచించవచ్చు; మొదట లవొదికయవారికే రాసిన పత్రిక అని తప్పనిసరిగా అర్థం కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: చదివిన తర్వాత / చదవండి
  rationale: ἀναγινώσκω అంటే ‘చదవడం’; తొలి క్రైస్తవ సంఘాల సందర్భంలో బహిరంగంగా చదవడం భావంలో ఉండవచ్చు. అయితే ఆ విధానాన్ని మూలపాఠం స్పష్టంగా చెప్పనందున సహజమైన ‘చదవడం’నే వాడాం.
- source_word: παρ’ ὑμῖν
  choice: మీ మధ్య
  rationale: παρά + చతుర్థీ ఇక్కడ కొలొస్సయుల సమాజంలో పత్రిక చదవబడటాన్ని సూచిస్తుంది; కేవలం ఎవరిచేత చదివారనే కర్తృత్వాన్ని కాదు.
- source_word: ἡ ἐπιστολή
  choice: ఈ పత్రిక
  rationale: నిర్దేశక ఉపపదం సందర్భంలో ప్రస్తుతం కొలొస్సయులకు పంపిన పత్రికనే సూచిస్తుంది. తెలుగులో ‘ఈ పత్రిక’ ఆ సూచనను సహజంగా స్పష్టం చేస్తుంది.
- source_word: ποιήσατε ἵνα
  choice: చదివేలా చూడండి
  rationale: ποιέω ఆజ్ఞారూపం ἵνα ఉపవాక్యంతో కలిసి కోరిన పని జరిగేలా చూసుకోవాలనే భావాన్ని ఇస్తుంది. ఈ తెలుగు ప్రయోగం ఆజ్ఞాబలాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: లవొదికయవారి సంఘంలో
  rationale: Λαοδικέων అంటే లవొదికయవారు; ἐκκλησίαను పౌలు పత్రికల సందర్భంలో ‘సంఘం’గా అనువదించడం సహజం మరియు విస్తృతంగా అర్థమయ్యేది.
- source_word: τὴν ἐκ Λαοδικείας
  choice: లవొదికయ నుండి వచ్చిన పత్రికను
  rationale: గ్రీకులో ‘పత్రిక’ అనే నామవాచకం ముందున్న సందర్భం వల్ల అధ్యాహారంగా ఉంది. తెలుగులో అర్థం స్పష్టంగా ఉండేందుకు దాన్ని వ్యక్తం చేశాం; ἐκ యొక్క సహజమైన ‘నుండి’ భావాన్ని నిలిపాం.
theological_decisions:
- issue: ‘లవొదికయ నుండి వచ్చిన పత్రిక’ ఏదనే గుర్తింపు
  choice: దాన్ని ఏ తెలిసిన ప్రామాణిక లేదా అప్రామాణిక పత్రికతోనూ గుర్తించకుండా తటస్థంగా అనువదించడం
  alternative: లవొదికయవారికి రాసిన పత్రిక; లవొదికయ నుండి కొలొస్సయికి పంపిన పత్రిక; లవొదికయతో సంబంధమున్న చక్రపత్రిక
  rationale: గ్రీకు పాఠం ఆ పత్రికకు లవొదికయతో ఉన్న సంబంధాన్ని మాత్రమే తెలుపుతుంది; దాని ఖచ్చితమైన గుర్తింపును లేదా మొదటి గమ్యస్థానాన్ని చెప్పదు. కాబట్టి చారిత్రక ఊహను ప్రధాన పాఠంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘంలో వినిపించేంత గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు స్పష్టంగా రూపొందించాం. గ్రీకు వాక్యంలోని క్రమాన్ని తెలుగులో సహజంగా రెండు వాక్యాలుగా ఇచ్చాం; లవొదికయ పత్రిక గుర్తింపులోని అనిశ్చితిని పాదసూచికలో నిలిపాం.
