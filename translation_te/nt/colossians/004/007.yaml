id: COL.4.7
reference: Colossians 4:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τὰ κατ’ ἐμὲ πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow servant in the Lord[c][b], will make known to you everything about me.
translation:
  language: te
  text: ప్రియ సహోదరుడును, నమ్మకమైన పరిచారకుడును, ప్రభువులో నాతోటి దాసుడునైన తుకికు నా సంగతులన్నిటినీ[a] మీకు తెలియజేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నాకు సంబంధించిన విషయాలన్నిటినీ”; లేదా “నా పరిస్థితులన్నిటినీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: నా సంగతులన్నిటినీ
  rationale: ఈ గ్రీకు నుడికారం పౌలుకు సంబంధించిన విషయాలు, వ్యవహారాలు, లేదా పరిస్థితులన్నిటినీ విస్తృతంగా సూచిస్తుంది. ‘నా సంగతులన్నిటినీ’ సహజమైన ఆధునిక తెలుగు; πάντα అనే పదంలోని సంపూర్ణ భావాన్ని కూడా నిలుపుతుంది.
- source_word: γνωρίσει
  choice: తెలియజేస్తాడు
  rationale: γνωρίζω భవిష్యత్ రూపం ‘తెలియజేయడం’ లేదా ‘సమాచారం ఇవ్వడం’ అనే అర్థం ఇస్తుంది. ‘తెలియజేస్తాడు’ మూలానికి దగ్గరగా ఉండి సహజంగా ఉంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: దత్తి విభక్తిలో ఉన్న పరోక్ష కర్మను తెలుగులో సహజంగా ‘మీకు’ అని అనువదించాం.
- source_word: Τυχικὸς
  choice: తుకికు
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: ప్రియ సహోదరుడు
  rationale: ἀγαπητός లోని ఆప్యాయతను ‘ప్రియ’ తెలియజేస్తుంది; ఇక్కడ ఒక పురుషుడైన తుకికును సూచిస్తున్నందున ἀδελφός ను ‘సహోదరుడు’గా అనువదించాం.
- source_word: πιστὸς διάκονος
  choice: నమ్మకమైన పరిచారకుడు
  rationale: πιστός ఇక్కడ విశ్వసనీయతను సూచిస్తుంది. διάκονος సేవకుడు, పరిచారకుడు, లేదా కొన్ని సందర్భాల్లో సంఘ పదవిని సూచించవచ్చు; ఇక్కడ నిర్దిష్ట సంఘ పదవి స్పష్టంగా లేనందున ‘పరిచారకుడు’ ఎంచుకున్నాం.
- source_word: σύνδουλος
  choice: నాతోటి దాసుడు
  rationale: σύνδουλος అనేది ఒకే యజమాని కింద దాస్యసేవను పంచుకునే వ్యక్తిని సూచిస్తుంది. ‘నాతోటి దాసుడు’ పౌలుతో కలిసి ప్రభువుకు చెందినవాడిగా సేవచేసే భావాన్ని నిలుపుతుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: ఇది ప్రభువుతో ఉన్న సంబంధాన్ని లేదా సేవ జరిగే పరిధిని సూచించే సాధారణ పౌలీయ పదబంధం. ‘ప్రభువులో’ ఆ ఉద్దేశపూర్వకమైన విస్తృతతను నిలుపుతుంది.
theological_decisions:
- issue: σύνδουλος / δοῦλος సంబంధిత దాస్యభాషను ఎలా అనువదించాలి
  choice: నాతోటి దాసుడు
  alternative: నాతోటి సేవకుడు
  rationale: ఈ పదం తుకికు పౌలుతో కలిసి ఒకే ప్రభువుకు చెందినవాడై సేవచేస్తున్న స్థితిని సూచిస్తుంది. ‘దాసుడు’ ఆ చెందినతనం, అధీనత అనే బలమైన భావాన్ని నిలుపుతుంది; ఆధునిక పాఠకులు పదాన్ని కేవలం చారిత్రక బానిసత్వంతో మాత్రమే అనుసంధానించకుండా ఉండేందుకు ‘సేవకుడు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ἐν κυρίῳ అనే పదబంధం ఏ పదాలకు వర్తిస్తుంది
  choice: వర్ణనలన్నింటికీ సహజంగా అనుసంధానమయ్యేలా ‘ప్రభువులో’ను ముందుంచడం
  alternative: ‘తోటి దాసుడు’ తర్వాత మాత్రమే ‘ప్రభువులో’ ఉంచడం
  rationale: గ్రీకులో ఈ పదబంధం చివర ఉన్నప్పటికీ, అది ముఖ్యంగా పరిచర్య మరియు తోటి దాసత్వాన్ని లేదా తుకికు గురించి మొత్తం ప్రశంసను సూచించవచ్చు. తెలుగు వాక్యంలో ముందుంచడం ద్వారా దాని సంబంధపరమైన విస్తృతిని కృత్రిమంగా ఒకే పదానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘ప్రియ సహోదరుడు,’ ‘నమ్మకమైన పరిచారకుడు,’ ‘నాతోటి దాసుడు’ అనే మూడు ప్రశంసాత్మక వర్ణనలను తెలుగు సముచ్చయ నిర్మాణంతో స్పష్టంగా ఉంచాం; మూలంలోని భావసందిగ్ధతలను పాదసూచికల్లో కాపాడాం.
