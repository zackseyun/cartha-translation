id: COL.4.11
reference: Colossians 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: te
  text: యూస్తు అని పిలువబడే యేసు కూడా మీకు వందనాలు చెబుతున్నాడు. సున్నతి పొందినవారిలో దేవుని రాజ్యం కోసం సహపనివారిగా ఉన్నవారు వీరు మాత్రమే[a]; వీరు నాకు ఓదార్పుగా నిలిచారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా: “దేవుని రాజ్యం కోసం సహపనివారిగా ఉన్నవారిలో సున్నతి పొందినవారు వీరు మాత్రమే.” “సున్నతి పొందినవారు” అంటే ఇక్కడ యూద నేపథ్యమున్నవారు.'
    reason: మూలంలోని పదబంధ సంబంధంలో ఉన్న స్వల్ప అస్పష్టతను, అలాగే యూద గుర్తింపు భావాన్ని తెలియజేయడం.
  - marker: b
    text: లేదా “వీరు నాకు ప్రోత్సాహంగా నిలిచారు”; లేదా “వీరు నాకు ఓదార్పయ్యారు.”
    reason: παρηγορία మరియు ἐγενήθησαν పదాలకు సందర్భానుసారంగా ఓదార్పు, ప్రోత్సాహం, అయ్యారు లేదా నిలిచారు అనే భావాలు సాధ్యమవుతాయి.
lexical_decisions:
- source_word: Ἰησοῦς ὁ λεγόμενος Ἰοῦστος
  choice: యూస్తు అని పిలువబడే యేసు
  rationale: వ్యక్తి పేరును నూతన నిబంధనలో సాధారణంగా వాడే ‘యేసు’గా ఉంచి, ప్రత్యామ్నాయ రోమా పేరు లేదా బిరుదైన Ἰοῦστοςను ‘యూస్తు’గా లిప్యంతరీకరించాం.
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: సున్నతి పొందినవారిలో
  rationale: ఈ ప్రయోగం యూద నేపథ్యాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సహజంగా ఉండేలా ‘సున్నతి పొందినవారిలో’ అని ఇచ్చి, దాని గుర్తింపు భావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: οὗτοι μόνοι
  choice: వీరు మాత్రమే
  rationale: నిర్దిష్ట సమూహంలో వీరే తన సహకారులని పౌలు చెప్పే ప్రత్యేకతను స్పష్టంగా నిలుపుతుంది.
- source_word: συνεργοὶ
  choice: నాతో కలిసి పనిచేస్తున్నవారు
  rationale: పౌలుతో కలిసి పరిచర్య చేసే సహకారులను సూచించే పదాన్ని సామాన్య ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యం కోసం
  rationale: εἰς ఇక్కడ లక్ష్యం లేదా సేవాభావాన్ని సూచిస్తుంది; ‘కోసం’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: వీరు నాకు ఓదార్పుగా నిలిచారు
  rationale: γίνομαι యొక్క అక్షరార్థమైన ‘అయ్యారు’కన్నా ‘నిలిచారు’ తెలుగులో సహజంగా ఉండి, παρηγορίαలోని ఓదార్పు లేదా ప్రోత్సాహ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘సున్నతి పొందినవారు’ అనే మాట ఎవరిని సూచిస్తుంది?
  choice: యూద నేపథ్యమున్న విశ్వాసులు లేదా సహపనివారిని సూచించే గుర్తింపుగా అనువదించడం
  alternative: ‘సున్నతి వర్గం’ అనే మరింత సంకుచితమైన పక్షాన్ని సూచించడం; లేదా క్రైస్తవ విశ్వాసాన్ని సూచించకుండా యూదులను మాత్రమే ఉద్దేశించడం
  rationale: సందర్భంలో పౌలు తన సహపనివారిని పేర్కొంటున్నాడు. అందువల్ల యూద నేపథ్యమున్న సహపనివారనే భావం సహజమైనది; అయితే ఒక ప్రత్యేక పక్షమని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా మూలంలోని గుర్తింపు భాషను నిలిపాం.
- issue: μόνοι యొక్క పరిధి
  choice: సున్నతి పొందినవారి సమూహంలో వీరు మాత్రమే పౌలుతో కలిసి పనిచేస్తున్నారని చూపించడం
  alternative: దేవుని రాజ్యం కోసం పనిచేసే పౌలు సహపనివారందరిలో వీరు మాత్రమే యూదులని అర్థం చేసుకోవడం
  rationale: గ్రీకు పదక్రమం ముందుగా ‘సున్నతి పొందినవారు’ అనే సమూహాన్ని స్థాపించి, ఆ సమూహంలో ‘వీరు మాత్రమే’ సహపనివారని ప్రధానంగా సూచిస్తుంది; ఇతర వ్యాకరణ సంబంధం సాధ్యమని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ఈ వచనం ముందున్న పేర్ల జాబితాను కొనసాగిస్తున్నందున ‘కూడా’ను, లేఖా సందర్భంలోని ἀσπάζονται భావాన్ని తెలుగులో పూర్తి వాక్యంగా సహజంగా వ్యక్తం చేయడానికి ‘మీకు వందనాలు చెబుతున్నాడు’ను సందర్భపూరకంగా చేర్చాం. పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో రెండూ ఉన్నాయి.
