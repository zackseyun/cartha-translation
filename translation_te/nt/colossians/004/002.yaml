  text: Τῇ προσευχῇ προσκαρτερεῖτε, γρηγοροῦντες ἐν αὐτῇ ἐν εὐχαριστίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/002.yaml
  text: Devote yourselves to prayer[a], staying alert in it with thanksgiving,
translation:
  language: te
  text: ప్రార్థనలో నిలకడగా ఉండండి[a]; కృతజ్ఞతతో అందులో జాగరూకులై ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రార్థనకు అంకితమై ఉండండి.’
    reason: προσκαρτερεῖτε నిరంతర పట్టుదలతో ఉండడం, లేదా అంకితభావంతో కొనసాగడం అనే భావాలను వ్యక్తం చేయగలదు.
lexical_decisions:
- source_word: Τῇ προσευχῇ
  choice: ప్రార్థనలో
  rationale: ఆర్టికల్‌తో ఉన్న దత్తి విభక్తి ఇక్కడ ఒక నిర్దిష్ట ప్రార్థనను కాక, ప్రార్థన అనే నిరంతర ఆచరణను సూచిస్తుంది. సందర్భానికి సహజమైన తెలుగులో ‘ప్రార్థనలో’ అని అనువదించాం.
- source_word: προσκαρτερεῖτε
  choice: నిలకడగా కొనసాగండి
  rationale: వర్తమాన ఆజ్ఞారూపం నిరంతర పట్టుదలను సూచిస్తుంది. ‘నిలకడగా కొనసాగండి’ ఆ కొనసాగింపు భావాన్నీ ఆజ్ఞ బలాన్నీ స్పష్టంగా అందిస్తుంది.
- source_word: γρηγοροῦντες
  choice: అప్రమత్తంగా ఉండండి
  rationale: ఈ వర్తమాన కృదంతం ప్రార్థనలో కొనసాగాల్సిన విధానాన్ని తెలియజేస్తుంది. అక్షరార్థమైన ‘మేలుకొని ఉండడం’ కంటే ‘అప్రమత్తంగా ఉండడం’ ఆత్మీయ జాగరూకతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν αὐτῇ
  choice: దానిలో
  rationale: స్త్రీలింగ సర్వనామం సహజంగా ముందున్న ‘ప్రార్థన’ను సూచిస్తుంది. ‘దానిలో’ అనే రూపం మూలంలోని అన్వయాన్ని నిలుపుతుంది.
- source_word: ἐν εὐχαριστίᾳ
  choice: కృతజ్ఞతతో
  rationale: ఈ పదబంధం ప్రార్థనలోని జాగరూకతకు తోడుగా ఉండే కృతజ్ఞతాభావాన్ని సూచిస్తుంది. ‘కృతజ్ఞతతో’ ఆధునిక తెలుగులో సహజంగా ఉంది.
theological_decisions: []
translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. వాక్యానికి గౌరవప్రదమైన ఆజ్ఞాశైలి ఉంది; కృదంత సంబంధాన్ని సహజమైన తెలుగు సమాంతర ఆజ్ఞలతో వ్యక్తం చేశాం.
