  revision_rationale: The revision preserves the source’s ongoing imperative and its participial manner—persistent prayer marked by vigilant attentiveness and thanksgiving—while improving Telugu idiom. The footnote remains a legitimate lexical alternative for προσκαρτερεῖτε.
