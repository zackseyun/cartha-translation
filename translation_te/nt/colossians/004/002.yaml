review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the present imperative of προσκαρτερεῖτε, the vigilance expressed by γρηγοροῦντες, the anaphoric reference of ἐν αὐτῇ to prayer, and the accompanying thanksgiving. However, “నిలకడగా కొనసాగండి” is somewhat redundant and less idiomatic with “ప్రార్థనలో”; “నిలకడగా ఉండండి” more directly represents persevering in prayer.
  naturalness: The revised wording is more fluent modern standard Telugu. “అందులో జాగరూకులై ఉండండి” makes the participial, accompanying sense natural while retaining prayer as the antecedent.
  terminology: “ప్రార్థన,” “జాగరూకులై,” and “కృతజ్ఞతతో” are suitable, neutral, and understandable in a contemporary biblical register. No doctrinally loaded terminology is introduced.
  issues:
  - severity: low
    issue: “నిలకడగా కొనసాగండి” is mildly redundant and awkward in this construction.
    rationale: The verb కొనసాగండి already includes continuative force, while the Greek calls for sustained devotion/perseverance in prayer. “ప్రార్థనలో నిలకడగా ఉండండి” is clearer and idiomatic.
  - severity: low
    issue: “దానిలో అప్రమత్తంగా ఉండండి” is grammatically understandable but stylistically stiff.
    rationale: “అందులో జాగరూకులై ఉండండి” is a more natural Telugu expression of watchful attentiveness in prayer and retains the connection to the preceding noun.
  revised_text: ప్రార్థనలో నిలకడగా ఉండండి[a]; కృతజ్ఞతతో అందులో జాగరూకులై ఉండండి.
