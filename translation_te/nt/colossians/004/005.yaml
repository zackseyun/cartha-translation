review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the exhortation to wise conduct toward people outside the believing community and the idiomatic force of ἐξαγοραζόμενοι. However, ‘ప్రతి’ (“every”) adds a distributive element not expressed by the singular τὸν καιρόν. ‘అనుకూల అవకాశం’ represents καιρός more precisely than merely an opportunity that happens to be available.
  naturalness: ‘బయటివారి పట్ల జ్ఞానంతో నడుచుకోండి’ is natural modern standard Telugu and preserves the ethical-life metaphor. ‘అనుకూల అవకాశాన్ని సద్వినియోగం చేసుకోండి’ is clear and idiomatic.
  terminology: ‘జ్ఞానం’ and ‘నడుచుకోండి’ appropriately retain the ethical force and metaphor of σοφίᾳ and περιπατεῖτε. ‘బయటివారు’ can be misunderstood as merely geographically external, so a brief note clarifies its contextual reference without imposing doctrine. The note on the commercial metaphor is retained.
  issues:
  - severity: medium
    issue: ‘దొరికే ప్రతి అవకాశాన్ని’ adds ‘every.’
    rationale: τὸν καιρόν is singular and definite, referring to the opportune time/opportunity; it does not explicitly say ‘every opportunity.’ Removing ‘ప్రతి’ avoids an added distributive meaning.
  - severity: low
    issue: The contextual sense of ‘బయటివారు’ is not footnoted.
    rationale: πρὸς τοὺς ἔξω conventionally denotes those outside the believing community in this context. A concise note preserves this referential nuance while leaving the main text natural.
  revised_text: బయటివారి పట్ల జ్ఞానంతో నడుచుకోండి; అనుకూల అవకాశాన్ని[a] సద్వినియోగం చేసుకోండి.
