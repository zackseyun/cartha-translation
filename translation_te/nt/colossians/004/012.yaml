revisions:
- from: మీలో ఒకడైన ఎపఫ్రా మీకు అభివందనాలు చెబుతున్నాడు. అతడు క్రీస్తు[a] దాసుడు. మీరు పరిణతి చెందినవారిగా, దేవుని చిత్తమంతటిలో సంపూర్ణ నిశ్చయం కలిగినవారిగా[b] నిలిచి ఉండాలని అతడు తన ప్రార్థనల్లో ఎల్లప్పుడూ మీ కోసం తీవ్రంగా ప్రయాసపడుతున్నాడు.
  to: మీలో ఒకడైన ఎపఫ్రా మీకు అభివందనాలు చెబుతున్నాడు—అతడు మెస్సీయ[a] దాసుడు. మీరు పరిణతి చెందినవారిగా, దేవుని సమస్త చిత్తంలో సంపూర్ణ నిశ్చయం కలిగినవారిగా నిలబడాలని, అతడు తన ప్రార్థనల్లో ఎల్లప్పుడూ మీకోసం తీవ్రంగా ప్రయాసపడుతున్నాడు.
  rationale: 'The revision makes only safe, source-sensitive adjustments: it renders Χριστός as “మెస్సీయ” rather than adding the absent name “యేసు”; improves the idiom for God’s comprehensive will; and keeps the disputed nuance of πεπληροφορημένοι in a properly anchored footnote. The purpose clause remains explicitly dependent on Epaphras’s ongoing prayerful striving.'
