id: COL.4.12
reference: Colossians 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: te
  text: మీలో ఒకడైన ఎపఫ్రా మీకు అభివందనాలు చెబుతున్నాడు—అతడు మెస్సీయ[a] దాసుడు. మీరు పరిణతి చెందినవారిగా, దేవుని సమస్త చిత్తంలో సంపూర్ణ నిశ్చయం కలిగినవారిగా నిలబడాలని, అతడు తన ప్రార్థనల్లో ఎల్లప్పుడూ మీకోసం తీవ్రంగా ప్రయాసపడుతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెస్సీయ యేసు.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζεται
  choice: అభివందనాలు చెబుతున్నాడు
  rationale: పౌలు పత్రికల ముగింపుల్లో కనిపించే వ్యక్తిగత పలకరింపు భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ ἐξ ὑμῶν
  choice: మీలో ఒకడైన
  rationale: ఎపఫ్రా కొలొస్సయి సమాజానికి చెందినవాడని సూచించే గ్రీకు నుడికారానికి స్పష్టమైన తెలుగు రూపం.
- source_word: δοῦλος
  choice: దాసుడు
  rationale: క్రీస్తుకు చెందినవాడిగా సంపూర్ణ విధేయతను సూచిస్తూ, ‘సేవకుడు’ కంటే బలమైన భావాన్ని ఇస్తుంది; ‘బానిస’ అనే పదం కలిగించే అనవసర ఆధునిక సామాజిక ఛాయను నివారిస్తుంది.
- source_word: Χριστοῦ
  choice: క్రీస్తు
  rationale: మూలపాఠంలో యేసు అనే పేరు లేకుండా Χριστοῦ మాత్రమే ఉంది. తెలుగులో స్థిరపడిన మెస్సీయ బిరుదు రూపమైన ‘క్రీస్తు’ను ఉపయోగించింది.
- source_word: ἀγωνιζόμενος
  choice: తీవ్రంగా ప్రయాసపడుతున్నాడు
  rationale: ప్రార్థనలో ఎపఫ్రా చేసే గాఢమైన శ్రమను, పోరాటాత్మక బలాన్ని అతిగా రూపకాలంకరించకుండా తెలియజేస్తుంది.
- source_word: ἐν ταῖς προσευχαῖς
  choice: తన ప్రార్థనల్లో
  rationale: ఎపఫ్రానే ప్రార్థిస్తున్నాడని స్పష్టం చేస్తూ, బహువచనం సూచించే పునరావృత ప్రార్థన భావాన్ని నిలుపుతుంది.
- source_word: ἵνα σταθῆτε
  choice: నిలిచి ఉండాలని
  rationale: ἵστημι లోని ‘నిలుచుట’ అనే చిత్రాన్ని కాపాడుతుంది; మూలంలో స్పష్టంగా లేని ‘స్థిరంగా’ అనే అదనపు విశేషణాన్ని చేర్చదు.
- source_word: τέλειοι
  choice: పరిణతి చెందినవారిగా
  rationale: ఈ పౌలు వాడుకలో పాపరహిత పరిపూర్ణతకన్నా ఆధ్యాత్మిక పరిపక్వత లేదా సంపూర్ణత భావం సందర్భానికి సరిపోతుంది.
- source_word: πεπληροφορημένοι
  choice: సంపూర్ణ నిశ్చయం కలిగినవారిగా
  rationale: పూర్తి ధృఢనమ్మకం లేదా నిశ్చయ స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది; స్థిరపరచబడినవారు అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: దేవుని చిత్తమంతటిలో
  rationale: ఈ పదబంధం పరిధి, విషయం లేదా అనుగుణతను సూచించవచ్చు. కొంత విధి-సామ్యాన్ని నిలుపుతూ ఏ ఒక్క భావాన్నీ అతిగా నిర్ణయించదు.
theological_decisions:
- issue: δοῦλος అనే సంబంధపదంలోని బలం
  choice: దాసుడు
  alternative: సేవకుడు; బానిస
  rationale: ఈ గుర్తింపు ఎపఫ్రా క్రీస్తుకు పూర్తిగా చెందినవాడని, ఆయనకు విధేయుడని సూచిస్తుంది. ‘దాసుడు’ ఆ బలాన్ని నిలుపుతూ ఆధునిక తెలుగులో గౌరవప్రదమైన బైబిలు శైలికి సరిపోతుంది.
- issue: Χριστοῦలో బిరుదు మరియు పాఠాంతరం
  choice: క్రీస్తు
  alternative: క్రీస్తు యేసు
  rationale: ప్రధాన SBLGNT పాఠంలో Χριστοῦ మాత్రమే ఉన్నందున యేసు అనే పేరును ప్రధాన వాక్యంలో చేర్చలేదు. పాఠాంతరాన్ని పాదసూచికలో తెలిపింది.
- issue: πεπληροφορημένοι యొక్క భావం
  choice: సంపూర్ణ నిశ్చయం కలిగినవారిగా
  alternative: సంపూర్ణంగా స్థిరపరచబడినవారిగా
  rationale: క్రియారూపం పూర్తి నిశ్చయం లేదా స్థిరమైన స్థితి రెండింటినీ సూచించగలదు. ప్రధాన పాఠం సాధారణంగా అంగీకరించబడిన నిశ్చయ భావాన్ని తీసుకుంటూ, నిజమైన అర్థసందిగ్ధతను పాదసూచికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పత్రికా-బైబిలు శైలి. పొడవైన గ్రీకు వాక్యాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించినా, తార్కిక సంబంధం మరియు ప్రార్థన ఉద్దేశం యథాతథంగా ఉంచబడ్డాయి.
