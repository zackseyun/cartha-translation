translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని ఉద్దేశ భావం, సర్వనామ సూచన, మరియు δεῖలోని బాధ్యత/అవసర భావం నిలుపబడ్డాయి.
