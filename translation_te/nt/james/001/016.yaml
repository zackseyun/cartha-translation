  text: μὴ πλανᾶσθε, ἀδελφοί μου ἀγαπητοί.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: te
  text: నా ప్రియ సోదరులారా, మోసపోవద్దు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సోదర సోదరీమణులారా’; ‘సోదరులు’ అనే గ్రీకు పదం స్త్రీలతో సహా తోటి విశ్వాసులందరినీ సమష్టిగా ఉద్దేశించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: మోసపోవద్దు
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞారూపం నిషేధాన్ని వ్యక్తం చేస్తుంది. ఈ సందర్భంలో πλανᾶσθε తప్పుడు నమ్మకానికి లోనవడాన్ని సూచిస్తుంది. ‘మోసపోవద్దు’ సహజమైన ఆధునిక తెలుగు; మూలంలోని కర్మణి/మధ్యమ భావాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: సంబోధనలో ఉన్న పురుష బహువచన రూపాన్ని ‘సోదరులారా’ నేరుగా ప్రతిబింబిస్తుంది. ఇది విశ్వాసుల సమాజంలోని స్త్రీలను కూడా సమష్టిగా ఉద్దేశించగలదని పాదసూచికలో స్పష్టం చేయబడింది.
- source_word: μου
  choice: నా
  rationale: వక్తకు పాఠకులతో ఉన్న అనుబంధాన్ని, ఆప్యాయతను సహజంగా తెలియజేస్తుంది.
- source_word: ἀγαπητοί
  choice: ప్రియ
  rationale: ἀγαπητοίలోని ప్రేమపూర్వక సంబోధనను ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా తెలిపే పదం. ‘ప్రియమైన’ కూడా సాధ్యమే గాని, ‘నా ప్రియ సోదరులారా’ మరింత సంక్షిప్తంగా ప్రవహిస్తుంది.
theological_decisions:
- issue: క్రైస్తవ సమాజానికి లింగసూచక సంబోధన
  choice: ప్రధాన పాఠ్యంలో ἀδελφοίను ‘సోదరులారా’ అని అనువదించి, దాని సమష్టి విస్తృతిని పాదసూచికలో తెలపడం.
  alternative: ‘సోదర సోదరీమణులారా’ లేదా ‘తోటి విశ్వాసులారా’
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పురుష బహువచనం; అయితే మిశ్రమ విశ్వాసుల సమాజాన్ని సమష్టిగా ఉద్దేశించగలదు. ప్రధాన పాఠ్యం మూలరూపాన్ని నిలుపుకుంటూ, పాదసూచిక ఉద్దేశిత విస్తృతిని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆప్యాయమైనప్పటికీ గౌరవప్రదమైన అపొస్తలీయ సంబోధన. గ్రీకు వాక్యంలో ఆజ్ఞ ముందున్నా, తెలుగులో సహజమైన సంబోధన క్రమం కోసం ‘నా ప్రియ సోదరులారా’ ముందుంచబడింది. పాదసూచిక గుర్తు సంబంధిత సంబోధన వెంట ఉంచబడింది.
