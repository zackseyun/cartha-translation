id: JAS.1.21
reference: James 1:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: te
  text: కాబట్టి, సమస్త మలినతను, పొంగిపొర్లే దుష్టత్వాన్ని[a] విడిచిపెట్టి, సౌమ్యతతో[b] మీలో నాటబడిన[c], మీ ప్రాణాలను[d] రక్షించగల వాక్యాన్ని స్వీకరించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అధికమైన దుష్టత్వాన్ని,” “విస్తారమైన చెడును.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “వినయంతో.”
    reason: lexical_alternative
  - marker: c
    text: 'లేదా “సహజంగా మీలో ఉన్న వాక్యాన్ని”; సాంప్రదాయ అనువాదం: “అంటుకట్టబడిన వాక్యాన్ని.”'
    reason: lexical_alternative
  - marker: d
    text: లేదా “మీ జీవితాలను” లేదా “మిమ్మల్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: కాబట్టి
  rationale: ముందటి ఉపదేశం నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: ἀποθέμενοι
  choice: విడిచిపెట్టి
  rationale: ప్రధాన ఆజ్ఞకు ముందు లేదా దానితో పాటు జరగవలసిన చర్యను తెలుగులోని పూర్వకాలిక క్రియారూపం సహజంగా తెలియజేస్తుంది.
- source_word: πᾶσαν ῥυπαρίαν
  choice: సమస్త నైతిక మలినాన్ని
  rationale: ῥυπαρίαలోని మురికి రూపకాన్ని నిలుపుతూ, సందర్భంలో ఉద్దేశించిన నైతిక భావాన్ని స్పష్టం చేస్తుంది.
- source_word: περισσείαν κακίας
  choice: పొంగిపొర్లే దుష్టత్వాన్ని
  rationale: περισσείαలోని అధికత్వం లేదా పొంగిపొర్లే భావాన్ని, κακίαలోని విస్తృతమైన చెడు భావాన్ని నిలుపుతుంది.
- source_word: ἐν πραΰτητι
  choice: సాత్వికతతో
  rationale: ప్రతిఘటనలేని సౌమ్యతను, వినయపూర్వకంగా నేర్చుకునే మనోభావాన్ని ఒకే సహజమైన తెలుగు పదంతో సూచిస్తుంది.
- source_word: δέξασθε
  choice: స్వీకరించండి
  rationale: ఆజ్ఞారూప బలాన్ని నిలుపుతూ, వాక్యాన్ని మనస్ఫూర్తిగా అంగీకరించే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὸν ἔμφυτον λόγον
  choice: మీలో నాటబడిన వాక్యాన్ని
  rationale: ἔμφυτος యొక్క ‘నాటబడిన’ భావాన్ని నిలుపుతూ, అది స్వీకర్తలలో ఉన్నదనే సంబంధాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; దానిని దేవుడు ఎలా నాటాడో అదనంగా నిర్ణయించదు.
- source_word: τὸν δυνάμενον σῶσαι
  choice: రక్షించగలిగే
  rationale: వాక్యానికి రక్షించే సామర్థ్యం ఉందనే భావాన్ని అతిశయింపకుండా సంబంధవాచక రూపంలో తెలుపుతుంది.
- source_word: τὰς ψυχὰς ὑμῶν
  choice: మీ ప్రాణాలను
  rationale: ψυχήకి తెలుగు బైబిలు సందర్భంలో సహజమైన ‘ప్రాణం’ను ఎంచుకుని, కేవలం శరీరజీవితం అనే అర్థానికి పరిమితం చేయకుండా వ్యక్తి జీవం లేదా స్వరూపం అనే విస్తృతిని ఉంచుతుంది.
theological_decisions:
- issue: రక్షణ సందర్భంలో τὰς ψυχὰς ὑμῶν అర్థం
  choice: మీ ప్రాణాలను
  alternative: మిమ్మల్ని / మీ జీవితాలను
  rationale: ‘ప్రాణాలు’ అనే పదం రక్షణకు సంబంధించిన గంభీరతను నిలుపుతుంది; అదే సమయంలో గ్రీకు ψυχή సూచించగల వ్యక్తి, జీవితం, అంతరంగ జీవం అనే భావాలను పూర్తిగా మూసివేయదు.
- issue: ἔμφυτον λόγον యొక్క భావం
  choice: మీలో నాటబడిన వాక్యం
  alternative: సహజంగా మీలో ఉన్న వాక్యం / అంటుకట్టబడిన వాక్యం
  rationale: వాక్యం శ్రోతలలో నాటబడి, ఇప్పుడు వారిలో ఉన్నదనే భావాన్ని నిలుపుతుంది; అది సహజసిద్ధమా, దేవునిచే ఏ విధంగా నాటబడిందా అనే ప్రశ్నను అనవసరంగా పరిష్కరించదు.
- issue: περισσείαν κακίαςలో అధికత్వపు రూపకం
  choice: పొంగిపొర్లే దుష్టత్వం
  alternative: అధికమైన దుష్టత్వం / మిగులుగా ఉన్న చెడు
  rationale: చెడు విస్తారంగా లేదా మితిమీరి ఉన్నదనే గ్రీకు భావాన్ని సజీవంగా ఉంచుతుంది; దానిని ‘ద్వేషం’ అనే సన్నని అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. ‘నైతిక మలినం’ మూలంలోని మురికి రూపకాన్నీ దాని నైతిక సందర్భాన్నీ కలిపి తెలియజేస్తుంది. ‘సాత్వికత’ సాధారణ పాఠకునికి అర్థమయ్యే గంభీర పదంగా ఎంచుకోబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా ఇవ్వబడ్డాయి.
