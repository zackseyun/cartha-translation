- from: కాబట్టి, సమస్త నైతిక మలినాన్ని, పొంగిపొర్లే దుష్టత్వాన్ని విడిచిపెట్టి, మీ ప్రాణాలను రక్షించగలిగేలా మీలో నాటబడిన వాక్యాన్ని సాత్వికతతో స్వీకరించండి.[a][b][c]
