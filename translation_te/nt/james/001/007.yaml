lexical_decisions:
- source_word: μὴ γὰρ
  choice: ఎందుకంటే ... అనుకోకూడదు
  rationale: γάρ ముందున్న వచనంలోని సందేహించే వ్యక్తి గురించిన వివరణతో ఈ హెచ్చరికను కలుపుతుంది; μήతో కూడిన ఆజ్ఞార్థక రూపం నిషేధాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో ఈ కలయిక సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: οἰέσθω
  choice: అనుకోకూడదు
  rationale: οἴομαι అంటే ‘అనుకోవడం, భావించడం.’ సందర్భంలోని హెచ్చరికను మానసిక చర్యగానే ఉంచుతూ ‘అనుకోకూడదు’ సహజంగా అనువదిస్తుంది.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: ఆ మనిషి
  rationale: గ్రీకు పదబంధం పుంలింగ ఏకవచనంలో ఉండి, ముందటి వచనంలో చెప్పబడిన సందేహించే వ్యక్తిని సూచిస్తుంది. ‘ఆ మనిషి’ మూలంలోని వ్యాకరణ రూపాన్ని, వాక్యసంబంధ సూచనను నిలుపుతుంది.
- source_word: ὅτι
  choice: అని
  rationale: అతడు అనుకోకూడని విషయాన్ని పరిచయం చేసే content clause‌ను తెలుగులో సహజమైన ‘అని’ రూపంతో వ్యక్తపరుస్తుంది.
- source_word: λήμψεταί
  choice: తనకు ... లభిస్తుందని
  rationale: λαμβάνω యొక్క భవిష్యత్ రూపం పొందడాన్ని సూచిస్తుంది. ‘లభిస్తుంది’ అనేది ప్రభువు మూలంగా ఇచ్చేది తనకు అందుతుందనే భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో తెలుపుతుంది.
- source_word: τι
  choice: ఏదైనా
  rationale: నిషేధ సందర్భంలో τι సమగ్ర అనిర్దిష్ట భావాన్ని, అంటే ‘ఏ ఒక్కటైనా,’ వ్యక్తపరుస్తుంది.
- source_word: παρὰ τοῦ κυρίου
  choice: ప్రభువు నుండి
  rationale: జనిటివ్‌తో παρά మూలాన్ని, ‘నుండి,’ సూచిస్తుంది. κύριοςను మరింత నిర్దిష్టంగా వ్యాఖ్యానించకుండా ‘ప్రభువు’గా ఉంచింది.
theological_decisions:
- issue: τοῦ κυρίου (‘ప్రభువు’) ఎవరిని సూచిస్తుంది
  choice: ప్రభువు
  alternative: దేవుడు; ప్రభువైన దేవుడు
  rationale: గ్రీకు పాఠం κύριος అనే బిరుదునే ఉపయోగిస్తుంది; ఈ వచనంలో దాని సూచితుణ్ణి మరింత స్పష్టంగా గుర్తించదు. ‘ప్రభువు’ మూలపాఠంలోని భావపరిధిని, సాధ్యమైన అస్పష్టతను కాపాడుతుంది.
- issue: ὁ ἄνθρωπος ἐκεῖνος లోని లింగ సూచన
  choice: ఆ మనిషి
  alternative: ఆ వ్యక్తి
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని ప్రధాన పాఠంలో నిలిపి, అది ముందటి వచనంలోని సందేహించే వ్యక్తికి ప్రతినిధిగా వర్తిస్తుందని పాదటిప్పణిలో స్పష్టం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి పాటించబడింది. ‘ఎందుకంటే’తో ముందటి వచనానికి గల వివరణాత్మక సంబంధం స్పష్టంగా ఉంచబడింది; ‘ప్రభువు’ అనే బిరుదు వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపబడింది.
