  text: ఎందుకంటే, ఆ మనిషి[a] ప్రభువు నుండి ఏదైనా పొందుతాడని అనుకోకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ వ్యక్తి.’ గ్రీకులో ఇది పుంలింగ ఏకవచనంలో (‘ఆ మనిషి’) ఉంది; అయితే ముందటి వచనంలో వర్ణించిన సందేహించే వ్యక్తిని ప్రతినిధిగా సూచిస్తుంది.
