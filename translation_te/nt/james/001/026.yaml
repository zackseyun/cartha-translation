id: JAS.1.26
reference: James 1:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: te
  text: ఎవరైనా తాను మతపరమైన ఆచరణలో నిష్ఠగలవాడినని భావిస్తూ[a], తన నాలుకకు కళ్లెం వేయకుండా[b] తన హృదయాన్ని మోసం చేసుకుంటే, అతని మతపరమైన ఆచరణ వ్యర్థం.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తాను మతపరమైన ఆచరణలో నిష్ఠగలవాడిగా కనిపిస్తున్నానని అనుకుంటూ.’
    reason: δοκεῖ అనే పదానికి ‘భావించడం’తో పాటు ‘కనిపించడం’ అనే అర్థఛాయ కూడా ఉండవచ్చు.
  - marker: b
    text: గ్రీకు మూలంలో అక్షరార్థంగా ‘తన నాలుకకు కళ్లెం వేయకుండా’ అని ఉంది; ఇది జంతువును అదుపుచేసే కళ్లెం రూపకం.
    reason: మూలపాఠంలోని రూపకాన్ని వివరించడం.
  - marker: c
    text: ‘వ్యర్థం’ అనే పదాన్ని ‘పనికిరానిది’ లేదా ‘ఫలితం లేనిది’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: μάταιος పదంలోని సమీప అర్థ ప్రత్యామ్నాయాలను సూచించడం.
lexical_decisions:
- source_word: δοκεῖ
  choice: భావిస్తూ
  rationale: ఇక్కడ ఈ క్రియ బాహ్యంగా కనిపించడంకన్నా వ్యక్తి తన గురించి తాను చేసుకునే అంచనాను సూచిస్తుంది; అందుకే ‘భావిస్తూ’ అని అనువదించాం.
- source_word: θρησκὸς
  choice: మతనిష్ఠ గలవాడు
  rationale: మతపరమైన ఆచరణలో నిష్ఠగలవాడనే విశేషణ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: χαλιναγωγῶν
  choice: కళ్లెం వేయడం
  rationale: జంతువును అదుపుచేసే కళ్లెం అనే మూలపాఠంలోని సజీవ రూపకాన్ని, యాకోబు 3లోని నాలుక గురించిన చిత్రణతో దాని సంబంధాన్ని నిలుపుతుంది.
- source_word: γλῶσσαν αὐτοῦ
  choice: తన నాలుక
  rationale: ‘మాటలను’ అని విప్పి చెప్పకుండా మూలంలోని శరీరాంగ చిత్రాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: ἀπατῶν καρδίαν αὐτοῦ
  choice: తన హృదయాన్ని మోసం చేసుకోవడం
  rationale: ‘హృదయం’ అనే మూలపదాన్ని నిలుపుతూ, తెలుగులో ఆ మోసం తిరిగి ఆ వ్యక్తిపైనే పడుతుందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τούτου
  choice: అతని
  rationale: ముందు వర్ణించిన వ్యక్తినే సూచించే గ్రీకు సర్వనామాన్ని తెలుగులో సహజంగా అనుసంధానిస్తుంది.
- source_word: μάταιος
  choice: వ్యర్థం
  rationale: ఫలితం లేని, విలువలేని స్థితి అనే అర్థాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ θρησκεία
  choice: మతాచారం
  rationale: ఇక్కడ తీర్పు మతం అనే భావవ్యవస్థపై కాక, వ్యక్తి ప్రకటించే మతపరమైన ఆచరణపై ఉందని స్పష్టపరుస్తుంది; అదే సమయంలో θρησκός‌తో ఉన్న పదసంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
theological_decisions:
- issue: లింగ సూచన కలిగిన సాధారణ ఏకవచనం
  choice: ఎవరైనా ... గలవాడినని ... అతని
  alternative: ఎవరైనా ... మతనిష్ఠ కలిగిన వ్యక్తినని ... వారి
  rationale: గ్రీకులో పురుష ఏకవచన రూపాలు సాధారణ ప్రతినిధి భావంతో ఉన్నాయి. ‘ఎవరైనా’ అందరికీ వర్తించే పరిధిని చూపుతుండగా, తరువాతి పురుష ఏకవచనం మూల నిర్మాణాన్ని నిలుపుతుంది.
- issue: θρησκός / θρησκεία అర్థం
  choice: మతనిష్ఠ గలవాడు / మతాచారం
  alternative: భక్తుడు / భక్తి; మతస్థుడు / మతం
  rationale: ఈ వాక్యం అంతరంగ భక్తినే కాక, అదుపులేని మాటలతో విరుద్ధంగా ఉన్న ప్రకటిత మతపరమైన ఆచరణను పరిశీలిస్తుంది. ఎంపిక చేసిన పదాలు ఏ ప్రత్యేక మతశాఖ భావాన్నీ చొప్పించకుండా ఆ దృష్టిని నిలుపుతాయి.
- issue: ἑαυτόν స్థానంలో ‘తన హృదయాన్ని’ అనే అసాధారణ నిర్మాణం
  choice: తన హృదయాన్ని మోసం చేసుకుంటే
  alternative: తన్నుతాను మోసం చేసుకుంటే
  rationale: మూలపాఠంలోని ‘హృదయం’ అనే భావపూర్ణ పదాన్ని తొలగించకుండా, తెలుగులో స్వీయమోసం అనే సందర్భార్థాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘నాలుకకు కళ్లెం వేయడం’ అనే మూల రూపకాన్ని నిలుపుతూ, ‘మతనిష్ఠ/మతాచారం’ ద్వారా θρησκός–θρησκεία పదబంధ సంబంధాన్ని వీలైనంత స్పష్టంగా చూపించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
