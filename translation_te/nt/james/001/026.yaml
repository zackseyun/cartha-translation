  naturalness: The main sentence is understandable and generally natural in modern standard Telugu. Relocating each footnote marker to its corresponding word or phrase improves readability and anchor clarity. ‘మతపరమైన ఆచరణలో నిష్ఠగలవాడు’ is a natural, suitably formal expression for the outwardly religious/observant sense in context.
  terminology: ‘నాలుకకు కళ్లెం వేయడం,’ ‘హృదయాన్ని మోసం చేసుకోవడం,’ and ‘వ్యర్థం’ are faithful and natural. Revising ‘మతనిష్ఠ గలవాడు / మతాచారం’ to the linked wording ‘మతపరమైన ఆచరణలో నిష్ఠగలవాడు / మతపరమైన ఆచరణ’ better represents the lexical and contextual relationship without reducing θρησκεία to a religious system or importing a denominational sense.
