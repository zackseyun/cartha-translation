id: JAS.1.27
reference: James 1:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: te
  text: 'తండ్రియైన దేవుని దృష్టిలో పవిత్రమైన, కల్మషంలేని భక్తి ఇదే: అనాథలను, విధవలను వారి కష్టాల్లో పరామర్శించి ఆదుకోవడం[a], లోకం చేత కలుషితం కాకుండా తనను తాను కాపాడుకోవడం[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనాథలను, విధవలను వారి కష్టాల్లో సందర్శించడం.” గ్రీకు క్రియలో సందర్శించడంతో పాటు వారి అవసరాలను పట్టించుకొని ఆదుకునే భావం కూడా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “లోకం” అంటే సృష్టి స్వతహాగా కాదు; దేవునికి విరోధంగా ఉండి నైతికంగా కలుషితం చేసే వ్యవస్థ.
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: భక్తి
  rationale: ఇక్కడ ఈ పదం కేవలం విశ్వాసాన్ని కాక, బయటికి కనిపించే ఆచరణాత్మక మతనిష్ఠను సూచిస్తుంది; ఆధునిక తెలుగులో ‘భక్తి’ సహజంగా ఉండి సందర్భంలోని జీవనాచరణ భావాన్ని అందిస్తుంది.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: పవిత్రమైన, కల్మషంలేని
  rationale: రెండు విశేషణాల నైతిక, ఆరాధనాపరమైన శుద్ధత భావాన్నీ, వాటి వాక్చాతుర్య జతనూ నిలుపుతుంది.
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: తండ్రియైన దేవుని దృష్టిలో
  rationale: παρά దత్తివుతో మూల్యాంకనార్థకమైన ‘దృష్టిలో’ భావాన్ని తెలియజేస్తుంది; θεῷ καὶ πατρὶ ఒకే వ్యక్తిని దేవుడు మరియు తండ్రిగా సూచించే భావాన్ని నిలుపుతుంది.
- source_word: ἐπισκέπτεσθαι
  choice: పరామర్శించి ఆదుకోవడం
  rationale: ఈ క్రియ కేవలం కలుసుకోవడమే కాక అవసరాన్ని గమనించి శ్రద్ధతో సహాయం చేయడాన్నీ కలిగి ఉంటుంది; రెండు సహజ తెలుగు క్రియలు దాని విస్తృత భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తాయి.
- source_word: ὀρφανοὺς καὶ χήρας
  choice: అనాథలను, విధవరాళ్లను
  rationale: సామాజికంగా రక్షణ అవసరమైన ఈ రెండు వర్గాలకు నేరుగా, సహజంగా సరిపోయే తెలుగు పదాలు.
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: వారి కష్టాల్లో
  rationale: θλῖψις లోని బాధ, ఇబ్బంది, ఒత్తిడి భావాలను సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది.
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: తనకు మలినం అంటకుండా కాపాడుకోవడం
  rationale: నైతిక కలుషం అంటకుండా జాగ్రత్తగా ఉండాలనే రూపకాన్నీ, సాధారణ ఉపదేశంలోని స్వీయసంబంధ భావాన్నీ సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἀπὸ τοῦ κόσμου
  choice: లోకం వల్ల
  rationale: ἀπό సూచించే కలుషానికి మూలం లేదా దూరంగా ఉండే సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తూ, κόσμος అనే పదాన్ని వివరణాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: నైతిక సందర్భంలో κόσμος అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘లోకం’ అని ఉంచి, దేవునికి విరోధమైన నైతికంగా కలుషిత వ్యవస్థ అనే సందర్భార్థాన్ని పాదసూచికలో వివరించడం.
  alternative: లోకపు చెడు; దేవునికి విరోధమైన లోకవ్యవస్థ
  rationale: మూలపదంలోని సంక్షిప్తతను, వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతూ, భౌతిక సృష్టి అంతా చెడ్డదనే అపార్థాన్ని నివారిస్తుంది.
- issue: ἑαυτόν యొక్క సాధారణ వర్తింపు
  choice: ‘తనకు… కాపాడుకోవడం’ అనే లింగనిరపేక్ష సాధారణ ఉపదేశంగా అనువదించడం.
  alternative: తన్నుతాను; తనను తాను
  rationale: గ్రీకు వ్యాకరణంలో పుంలింగ ఏకవచనమైనా, ఇది ప్రతి వ్యక్తికీ వర్తించే నైతిక సూత్రం; తెలుగు రూపం ఆ సాధారణ వర్తింపును సహజంగా అందిస్తుంది.
- issue: παρὰ τῷ θεῷ καὶ πατρὶ లో దేవుడు–తండ్రి సంబంధం
  choice: ‘తండ్రియైన దేవుడు’ అనే ఒకే వ్యక్తిని సూచించే పఠనం.
  alternative: దేవుని మరియు తండ్రి దృష్టిలో
  rationale: ఒకే నిర్దేశకంతో కలిసిన θεῷ καὶ πατρὶ ఇక్కడ దేవుణ్ణే తండ్రిగా వర్ణిస్తున్నదని గ్రహించడం వ్యాకరణపరంగా సహజం; ‘మన’ అనే మూలంలో లేని పదాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘మతం’ కంటే ఆచరణలో వ్యక్తమయ్యే మతనిష్ఠను సూచించేందుకు ‘భక్తి’ ఎంచుకోబడింది. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
