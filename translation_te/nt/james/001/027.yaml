- from: 'తండ్రియైన దేవుని దృష్టిలో పవిత్రమైన, కల్మషంలేని భక్తి ఇదే: అనాథలను, విధవరాళ్లను వారి కష్టాల్లో పరామర్శించి ఆదుకోవడం[a], లోకం వల్ల తనకు మలినం అంటకుండా కాపాడుకోవడం[b].'
  to: 'తండ్రియైన దేవుని దృష్టిలో పవిత్రమైన, కల్మషంలేని భక్తి ఇదే: అనాథలను, విధవలను వారి కష్టాల్లో పరామర్శించి ఆదుకోవడం[a], లోకం చేత కలుషితం కాకుండా తనను తాను కాపాడుకోవడం[b].'
