  text: a double-minded man[a], unstable in all his ways.
translation:
  language: te
  text: ద్విమనస్కుడైన మనిషి[a] తన మార్గాలన్నిటిలోనూ అస్థిరంగా ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ద్విమనస్కుడైన వ్యక్తి తన మార్గాలన్నిటిలోనూ అస్థిరంగా ఉంటాడు.’ గ్రీకు పాఠ్యం పుంలింగ ఏకవచనంలో ఉంది; అయితే సందర్భంలో ఇది సాధారణంగా ఏ వ్యక్తినైనా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: మనిషి
  rationale: ఇది గ్రీకులో పుంలింగ ఏకవచనం; మునుపటి వచనంలోని అడిగే వ్యక్తినే సూచిస్తుంది. తెలుగులో ‘మనిషి’ సహజంగా ఉండి, వెంట వచ్చే పుంలింగ ఏకవచన రూపమైన ‘నిలకడలేనివాడు’తో మూలంలోని వ్యాకరణ రూపాన్ని నిలుపుతుంది; సందర్భంలో దీని భావం ప్రతినిధికమైనది.
- source_word: δίψυχος
  choice: రెండు మనసులుగల
  rationale: ఈ అరుదైన పదం అక్షరార్థంగా ‘రెండు ప్రాణాలు/మనసులు గల’ అనే భావాన్ని సూచిస్తుంది. ‘రెండు మనసులుగల’ అనేది అంతరంగ విభజనను, ఊగిసలాటను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀκατάστατος
  choice: నిలకడలేనివాడు
  rationale: వ్యక్తి ఆలోచనల్లోను ప్రవర్తనలోను స్థిరత్వం లేకపోవడాన్ని ఇది స్పష్టంగా వ్యక్తం చేస్తుంది. ‘అశాంతుడు’ లేదా ‘అస్తవ్యస్తుడు’ అనేవి సందర్భం కంటే వేరే భావఛాయలను కలిగించవచ్చు.
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: తన మార్గాలన్నిటిలో
  rationale: ‘మార్గాలు’ అనే రూపకం వ్యక్తి జీవన విధానమంతటినీ, ప్రవర్తననూ సూచిస్తుంది. ఇది మూలంలోని రూపకాన్ని అనవసరంగా వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: పుంలింగ ఏకవచన రూపానికి ప్రతినిధిక భావం
  choice: ప్రధాన పాఠ్యంలో ‘మనిషి’తో పాటు పుంలింగ ఏకవచనమైన ‘నిలకడలేనివాడు’ను ఉంచడం
  alternative: ‘రెండు మనసులుగల వ్యక్తి, తన మార్గాలన్నిటిలో నిలకడలేని వ్యక్తి’
  rationale: గ్రీకు పాఠ్యం పుంలింగ ఏకవచనంలో ఉన్నప్పటికీ, సందర్భంలో హెచ్చరిక పురుషులకు మాత్రమే పరిమితం కాదు. ప్రధాన పాఠ్యం మూలరూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది; పాదసూచిక దాని ప్రతినిధిక వ్యాప్తిని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు సులభంగా ఉండేలా ‘ద్విమనస్కుడు’ వంటి ఎక్కువ సాంప్రదాయిక పదం బదులు ‘రెండు మనసులుగల’ అని వాడబడింది.
