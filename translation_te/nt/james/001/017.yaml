source:
  edition: SBLGNT
  text: Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστιν, καταβαῖνον ἀπὸ τοῦ πατρὸς τῶν φώτων, παρ’ ᾧ οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: te
  text: ప్రతి మంచి దానమూ, ప్రతి పరిపూర్ణమైన బహుమతీ పైనుండి వచ్చి, వెలుగుల తండ్రి నుండి దిగివస్తాయి. ఆయనలో మార్పుగానీ, తిరుగుదలతో కలిగే నీడగానీ లేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, ‘తిరుగుదల నీడ’ లేదా ‘మారుతూ ఉండే నీడ.’ ఈ మాటలు ఆకాశజ్యోతుల కదలికలతో మారే నీడలను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ
  choice: ప్రతి మంచి దానం
  rationale: δόσις ఇచ్చే కార్యాన్ని లేదా ఇచ్చిన దానాన్ని సూచించగలదు. ‘దానం’ ఈ రెండు భావాలకు కొంత చోటిస్తూ, πᾶσα యొక్క పంపిణీ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πᾶν δώρημα τέλειον
  choice: ప్రతి పరిపూర్ణమైన బహుమానం
  rationale: δώρημα ప్రధానంగా ఇవ్వబడిన వస్తువును సూచిస్తుంది; ‘బహుమానం’ మొదటి నామవాచకమైన ‘దానం’తో తేడాను నిలుపుతుంది. τέλειονను సంపూర్ణంగా మంచిదైనది అనే భావంలో ‘పరిపూర్ణమైన’గా అనువదించాం.
- source_word: ἄνωθέν ἐστιν, καταβαῖνον
  choice: పైనుండి వచ్చేవే; ... దిగివస్తాయి
  rationale: ἄνωθεν మూలాన్ని, καταβαῖνον పై నుండి కిందికి రావడాన్ని తెలుపుతాయి. తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం రెండింటినీ పరస్పరపూరకంగా వ్యక్తం చేశాం.
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: వెలుగుల తండ్రి నుండి
  rationale: గ్రీకు రూపకాన్ని వ్యాఖ్యానాత్మకంగా ‘ఆకాశజ్యోతుల సృష్టికర్త’ అని మార్చకుండా యథాతథంగా నిలిపాం.
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: ఆయనలో మార్పుగానీ ... లేదు
  rationale: παρ’ ᾧ దేవునికి సంబంధించిన స్థిరత్వాన్ని సూచిస్తుంది; παραλλαγήను స్పష్టమైన ఆధునిక తెలుగు పదమైన ‘మార్పు’తో అనువదించాం.
- source_word: ἢ τροπῆς ἀποσκίασμα
  choice: తిరుగుదలతో కలిగే నీడగానీ
  rationale: కఠినమైన ఈ పదబంధంలో τροπή తిరగడం లేదా మార్పును, ἀποσκίασμα నీడను సూచిస్తాయి. ‘తిరుగుదలతో కలిగే నీడ’ మూలంలోని దృశ్యరూపాన్ని నిలుపుతూ తెలుగులో అర్థమయ్యేలా ఉంది.
theological_decisions:
- issue: ‘వెలుగుల తండ్రి’ అనే రూపకం మరియు దేవుని మార్పులేనితనం
  choice: రూపకాన్ని, మార్పు మరియు నీడకు సంబంధించిన వ్యత్యాసాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘వెలుగులు’ను నేరుగా సూర్యచంద్రనక్షత్రాలుగా వివరించడం లేదా చివరి భాగాన్ని కేవలం ‘ఆయన మారనివాడు’గా భావానువాదం చేయడం
  rationale: గ్రీకు వాక్యం దేవుణ్ణి మంచి దానాల మూలంగా చూపుతూ, మారుతూ కనిపించే ఆకాశజ్యోతులతో ఆయనను పరోక్షంగా వ్యత్యాసపరుస్తుంది. సిద్ధాంతపరమైన విస్తరణ లేకుండా ఆ రూపక ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘వెలుగుల తండ్రి’ వంటి మూల రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపాం; కఠినమైన చివరి పదబంధానికి ప్రధాన పాఠ్యంలో స్వల్పంగా వివరణాత్మకమైన సహజ నిర్మాణం, పాదటిప్పణిలో మరింత పదశః ప్రత్యామ్నాయాలు ఇచ్చాం.
