  naturalness: The revised wording uses idiomatic modern Telugu, avoids the awkward 'వచ్చేవే; అవి ... దిగివస్తాయి' sequence, and retains a dignified biblical register. 'ఆయనలో' is a natural Telugu expression for the source clause's assertion that no variation exists in God.
