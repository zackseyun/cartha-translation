id: JAS.1.11
reference: James 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: te
  text: ఎందుకంటే సూర్యుడు మండించే వేడితో[a] ఉదయించి గడ్డిని ఎండబెట్టాడు; దాని పువ్వు రాలిపోయింది, దాని రూపసౌందర్యం నశించింది. అలాగే ధనవంతుడు కూడా తన కార్యకలాపాల మధ్యనే[b] వాడిపోతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వడగాలితో.’ గ్రీకు పదం καύσων మండించే వేడిని, కొన్ని సందర్భాల్లో దానితో కూడిన వేడి గాలిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘తన ప్రయాణాలలోనే.’ గ్రీకు పదం అక్షరార్థంగా ప్రయాణాలను లేదా విస్తృతంగా ఒక వ్యక్తి సాగించే పనులు, జీవన కార్యకలాపాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: ఉదయించి
  rationale: సూర్యుడు పైకి రావడాన్ని సహజమైన ఆధునిక తెలుగులో తెలిపే పదం; గ్రీకు భూతకాల వర్ణనను తరువాతి క్రియతో అనుసంధానిస్తుంది.
- source_word: σὺν τῷ καύσωνι
  choice: మండించే వేడితో
  rationale: καύσων సూచించే తీవ్రమైన దహనకరమైన వేడిని ప్రధాన పాఠంలో సహజంగా వ్యక్తం చేస్తుంది; వేడి గాలి అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐξήρανεν τὸν χόρτον
  choice: గడ్డిని ఎండబెట్టాడు
  rationale: వేడి వృక్షజాలంపై చూపే ప్రభావాన్ని స్పష్టంగా, మూర్తంగా నిలుపుతుంది.
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: దాని పువ్వు రాలిపోయింది
  rationale: ἐκπίπτω లోని భౌతికంగా రాలిపోవడం అనే చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: దాని రూపసౌందర్యం
  rationale: మొక్కకు అసహజంగా అనిపించే ‘ముఖం’ అనే అక్షరార్థానికి బదులు, πρόσωπον ఇక్కడ సూచించే వెలుపలి రూపాన్ని, εὐπρέπεια సూచించే అందాన్ని కలిపి తెలియజేస్తుంది.
- source_word: ἀπώλετο
  choice: నశించింది
  rationale: అందం పూర్తిగా పోవడం లేదా కనుమరుగవడం అనే భావాన్ని గంభీరమైనప్పటికీ సాధారణంగా అర్థమయ్యే భాషలో ఇస్తుంది.
- source_word: ὁ πλούσιος
  choice: ధనవంతుడు
  rationale: గ్రీకులోని ఏకవచన పుంలింగ ప్రతినిధి వ్యక్తిని తెలుగులో సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: తన కార్యకలాపాల మధ్యనే
  rationale: πορεία యొక్క అక్షరార్థమైన ప్రయాణాలకే పరిమితం చేయకుండా, వ్యక్తి కొనసాగిస్తున్న పనులు మరియు జీవిత కార్యకలాపాల విస్తృత భావాన్ని అందిస్తుంది; ‘మధ్యనే’ అతడు వాటిలో నిమగ్నుడై ఉండగానే వాడిపోతాడనే బలాన్ని తెలియజేస్తుంది.
- source_word: μαρανθήσεται
  choice: వాడిపోతాడు
  rationale: ముందున్న గడ్డి, పువ్వు చిత్రాన్ని కొనసాగిస్తూ భవిష్యత్తులో తప్పక సంభవించే క్షీణతను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ὁ πλούσιος లోని లింగ సూచన
  choice: ధనవంతుడు
  alternative: ధనవంతమైన వ్యక్తి / ధనికుడు
  rationale: మూలంలోని ఏకవచన పుంలింగ ప్రతినిధి రూపాన్ని నిలిపింది; హెచ్చరిక స్త్రీలకు వర్తించదనే భావాన్ని ఇది ఉద్దేశించదు.
- issue: ధనవంతునికి సంబంధించిన πορείαις యొక్క పరిధి
  choice: కార్యకలాపాలు
  alternative: ప్రయాణాలు / పనులు / వ్యాపార కార్యకలాపాలు
  rationale: ఈ పదానికి అక్షరార్థంగా ప్రయాణాలు అనే భావం ఉన్నప్పటికీ, సందర్భంలో ధనవంతుడు కొనసాగించే జీవన గమనాన్ని, పనులను విస్తృతంగా సూచించవచ్చు. ‘కార్యకలాపాలు’ హెచ్చరికను కేవలం ప్రయాణానికో వ్యాపారానికో పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. గడ్డి–పువ్వు–వాడిపోవడం అనే మూల రూపకాన్ని యథాతథంగా కొనసాగించాం. అర్థసందిగ్ధత ఉన్న καύσων మరియు πορείαις పదాలకు ప్రత్యామ్నాయాలను పాదసూచికల్లో ఇచ్చాం.
