lexical_decisions:
- source_word: Καυχάσθω
  choice: అతిశయించాలి
  rationale: వర్తమానకాల మధ్యమ ఆజ్ఞార్థక రూపంలోని ప్రబోధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ‘సంతోషించాలి’ కంటే καυχάομαι యొక్క అతిశయించడం/గర్వించడం అనే బలాన్ని నిలుపుతుంది; అతిశయానికి ఆధారం దేవుడు అనుగ్రహించిన స్థితి అని సందర్భం నిర్దేశిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి మాటలనుంచి స్వల్ప మలుపును, 9–10 వచనాల్లోని అణగారినవాడు–ధనవంతుడు అనే వ్యత్యాసానికి మార్పును సహజంగా సూచిస్తుంది.
- source_word: ὁ ἀδελφὸς
  choice: సహోదరుడు
  rationale: గ్రీకు పదంలోని ఏకవచన పుంలింగ రూపాన్ని నిలుపుతూ, విశ్వాస సమాజంలోని తోటి విశ్వాసిని సూచించే భావాన్ని అందిస్తుంది.
- source_word: ὁ ταπεινὸς
  choice: అణగారిన స్థితిలో ఉన్న
  rationale: ταπεινός ఇక్కడ వినయగుణాన్ని మాత్రమే కాక సామాజిక లేదా ఆర్థికంగా తక్కువ స్థితినీ సూచించవచ్చు. 10వ వచనంలోని ధనవంతునితో ఉన్న వ్యత్యాసాన్ని దృష్టిలో ఉంచి, ఈ విస్తృతిని తెలుగులో నిలుపుతుంది.
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: తనకు కలిగిన ఉన్నత స్థితిని బట్టి
  rationale: ὕψος యొక్క ఎత్తు/ఉన్నతి భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, దేవుని ఎదుట గౌరవస్థానం, ప్రస్తుత లేదా భవిష్యత్తు స్థితిమార్పు అనే సాధ్యమైన భావాలను ఏ ఒక్కదానికీ పరిమితం చేయదు.
theological_decisions:
- issue: అణగారిన విశ్వాసి యొక్క ‘ఉన్నత స్థితి’ భావం
  choice: దేవుని ఎదుట అతనికి కలిగిన గౌరవప్రదమైన ఉన్నత స్థితిగా అనువదించడం; ప్రస్తుతమా భవిష్యత్తులోనిదా అని నిర్దిష్టంగా పరిమితం చేయకపోవడం
  alternative: ప్రస్తుత సామాజిక ఉన్నతి మాత్రమే; ఆత్మీయ స్థితి మాత్రమే; భవిష్యత్తు అంత్యకాల ఉన్నతి మాత్రమే
  rationale: 9–10 వచనాల్లో స్థితుల తారుమారు భావం ఉంది. మూలంలోని విస్తృతిని కాపాడేందుకు అనువాదం కాలాన్ని లేదా ఉన్నతి స్వరూపాన్ని సంకుచితం చేయదు.
- issue: ἀδελφός యొక్క లింగ సూచన
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరుడు’ అని పుంలింగ ఏకవచనాన్ని నిలుపడం
  alternative: సహోదరుడు లేదా సహోదరి; తోటి విశ్వాసి
  rationale: మూలపదం వ్యాకరణపరంగా పుంలింగ ఏకవచనం. సందర్భంలో అది ప్రతినిధి ప్రయోగంగా విశ్వాసినిని కూడా సూచించవచ్చని పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలి. ‘అణగారిన స్థితిలో ఉన్న’ అనే పదబంధం కేవలం అంతరంగ వినయానికి పరిమితం కాకుండా సామాజిక-ఆర్థిక తక్కువ స్థితినీ సూచిస్తుంది. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వరుసగా [a][b]గా ఇవ్వబడ్డాయి.
