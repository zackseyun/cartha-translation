revisions:
- from: అయితే, అణగారిన స్థితిలో ఉన్న సహోదరుడు తనకు కలిగిన ఉన్నత స్థితిని బట్టి అతిశయించాలి.[a][b]
  to: అయితే, తక్కువ స్థితిలోనున్న సహోదరుడు తన ఉన్నత స్థితిలో అతిశయించాలి.[a][b]
  rationale: The revision corrects the prepositional relation of ἐν (‘in’) and uses a less restrictive equivalent for ταπεινός. It retains the masculine singular ‘సహోదరుడు,’ the imperative sense of ‘అతిశయించాలి,’ and the intentional ambiguity of the believer’s ‘exaltation.’ Footnote anchors remain correctly placed and their alternatives align with the revised wording.
