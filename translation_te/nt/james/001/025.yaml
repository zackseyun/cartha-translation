id: JAS.1.25
reference: James 1:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: te
  text: కాని పరిపూర్ణమైన ధర్మశాస్త్రంలోకి, అంటే స్వాతంత్ర్య ధర్మశాస్త్రంలోకి, శ్రద్ధగా తొంగిచూచి దానిలో నిలిచి ఉండి, విని మరచిపోయేవాడిగా కాకుండా కార్యాన్ని ఆచరించేవాడిగా ఉండేవాడు తాను చేసేదానిలో ధన్యుడవుతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακύψας
  choice: శ్రద్ధగా తొంగిచూచి
  rationale: ఈ క్రియ వంగి లోపలికి చూడడం లేదా జాగ్రత్తగా పరిశీలించడం అనే సజీవ భావాన్ని ఇస్తుంది; సాధారణంగా చూడడంకన్నా గాఢమైన పరిశీలనను తెలుపుతుంది.
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: స్వాతంత్ర్యానికి సంబంధించిన పరిపూర్ణమైన ధర్మశాస్త్రం
  rationale: τέλειον ను ‘పరిపూర్ణమైన’గా నిలుపుతూ, τὸν τῆς ἐλευθερίας అనే వివరణాత్మక సంబంధాన్ని ‘స్వాతంత్ర్యానికి సంబంధించిన’గా అనువదించాం; అది స్వాతంత్ర్యాన్ని ఇస్తుందా, దాని స్వభావమే స్వాతంత్ర్యమా అనే విషయాన్ని అనవసరంగా నిర్ణయించలేదు.
- source_word: παραμείνας
  choice: దానిలో నిలిచివుండేవాడు
  rationale: ఒక్కసారి పరిశీలించి వెళ్లిపోవడం కాక, దానితో నిరంతరం కొనసాగడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: విని మరచిపోయేవాడిగా కాక
  rationale: గ్రీకు షష్టీ విభక్తి నిర్మాణాన్ని తెలుగులో సహజమైన క్రియాత్మక పదబంధంగా ఇచ్చి, వినడం మరియు మరచిపోవడం మధ్య సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ποιητὴς ἔργου
  choice: క్రియ చేసేవాడిగా
  rationale: ἔργον అనేది ‘పని/క్రియ’ అని స్పష్టంగా ఉండేలా చేసి, సమీప సందర్భంలోని ‘వాక్యాన్ని ఆచరించేవాడు’ అనే పదబంధాన్ని ఇక్కడికి దిగుమతి చేయకుండా, వినేవాడికి విరుద్ధంగా కార్యాచరణను తెలియజేస్తుంది.
- source_word: μακάριος
  choice: ధన్యుడు
  rationale: దైవానుగ్రహంతో కూడిన శ్రేయస్థితిని సూచించే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: తాను చేసేదానిలో
  rationale: ‘చేయడం’ అనే నామభావాన్ని సహజ తెలుగులో నిలుపుతూ, ముందు ఉన్న ‘క్రియ చేసేవాడు’ అనే భావంతో అనుసంధానిస్తుంది.
- source_word: ὁ ... οὗτος
  choice: …వాడు … ధన్యుడవుతాడు
  rationale: గ్రీకులోని ఏకవచన ప్రతినిధి నిర్మాణాన్ని తెలుగులో సహజంగా నిలిపి, పురుషులకు మాత్రమే పరిమితమైన అర్థాన్ని ఉద్దేశపూర్వకంగా జోడించదు.
theological_decisions:
- issue: ‘స్వాతంత్ర్యానికి సంబంధించిన ధర్మశాస్త్రం’ అనే పదబంధం అర్థం
  choice: స్వాతంత్ర్యంతో దాని సంబంధాన్ని మాత్రమే తెలిపి, ఆ సంబంధ స్వరూపాన్ని తెరిచి ఉంచడం
  alternative: ‘స్వాతంత్ర్యాన్ని ఇచ్చే ధర్మశాస్త్రం’ అని కారణార్థకంగా చెప్పడం
  rationale: గ్రీకు పదబంధం సువార్తను, నెరవేర్చబడిన నైతిక ధర్మశాస్త్రాన్ని, లేదా దేవుని బోధను ప్రత్యేకంగా మాత్రమే సూచిస్తుందని నిర్ణయించదు; అందువల్ల దాని theological tensionను కాపాడాం.
- issue: సాధారణార్థక పుంలింగ ఏకవచనం
  choice: తెలుగులో ఏకవచన ప్రతినిధి నిర్మాణాన్ని వాడడం
  alternative: బహువచనంగా మార్చడం లేదా పురుషుడని ప్రత్యేకంగా చెప్పడం
  rationale: మూలంలోని ఏకవచన బలాన్ని నిలుపుతూ, సందర్భం ఉద్దేశించని పురుష-పరిమితిని మోపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే లేఖనానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. మూలంలోని ‘చూచుట—నిలిచివుండుట—చేయుట—ధన్యుడగుట’ అనే ప్రవాహం కాపాడబడింది.
