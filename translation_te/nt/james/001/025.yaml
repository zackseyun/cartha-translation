revisions:
- from: కాని స్వాతంత్ర్యానికి సంబంధించిన పరిపూర్ణమైన ధర్మశాస్త్రంలోకి శ్రద్ధగా తొంగిచూచి, దానిలో నిలిచివుండేవాడు—విని మరచిపోయేవాడిగా కాక, క్రియ చేసేవాడిగా ఉండేవాడు—తాను చేసేదానిలో ధన్యుడవుతాడు.
  to: కాని పరిపూర్ణమైన ధర్మశాస్త్రంలోకి, అంటే స్వాతంత్ర్య ధర్మశాస్త్రంలోకి, శ్రద్ధగా తొంగిచూచి దానిలో నిలిచి ఉండి, విని మరచిపోయేవాడిగా కాకుండా కార్యాన్ని ఆచరించేవాడిగా ఉండేవాడు తాను చేసేదానిలో ధన్యుడవుతాడు.
  rationale: The revision preserves the Greek participial flow and its generic singular construction. It renders the appositional “perfect law, the law of freedom” directly, without imposing a doctrinal interpretation, and expresses “a doer of work” in natural Telugu while retaining the explicit emphasis on enacted work.
