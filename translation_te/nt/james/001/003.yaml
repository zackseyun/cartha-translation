id: JAS.1.3
reference: James 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γινώσκοντες ὅτι τὸ δοκίμιον ὑμῶν τῆς πίστεως κατεργάζεται ὑπομονήν·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/003.yaml
  text: because you know that the testing of your faith produces endurance[a][b].
translation:
  language: te
  text: ఎందుకంటే, మీ విశ్వాసానికి జరిగే పరీక్ష[a] స్థిరసహనాన్ని[b] కలిగిస్తుందని మీకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరీక్షలో నిరూపితమైన మీ విశ్వాసపు యథార్థత.” గ్రీకు పదం పరీక్షించే ప్రక్రియను గాని, పరీక్ష ద్వారా వెల్లడైన గుణాన్ని గాని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “స్థిరత్వం” లేదా “పట్టుదల.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: ఎందుకంటే ... మీకు తెలుసు
  rationale: ఈ వర్తమాన కర్తరి అసమాపక క్రియ 2వ వచనంలోని ఆదేశానికి కారణాన్ని తెలియజేస్తుంది. తెలుగులో కారణ సంబంధాన్ని సహజంగా స్పష్టం చేయడానికి ఈ నిర్మాణం ఉపయోగించబడింది.
- source_word: ὅτι
  choice: అని
  rationale: వారు తెలిసికొన్న విషయాన్ని పరిచయం చేసే పూరకార్థక అవ్యయంగా సహజ తెలుగు రూపం.
- source_word: τὸ δοκίμιον
  choice: పరీక్షించబడడం
  rationale: ఈ పదం పరీక్షించే ప్రక్రియను గాని, పరీక్ష ద్వారా నిరూపితమైన యథార్థతను గాని సూచించగలదు. సందర్భంలో ప్రక్రియార్థం సహజంగా సరిపోతుంది; ఫలితార్థం పాదసూచికలో నిలుపబడింది.
- source_word: ὑμῶν τῆς πίστεως
  choice: మీ విశ్వాసం
  rationale: షష్ఠీ విభక్తి నిర్మాణం పాఠకుల విశ్వాసమే పరీక్షకు లోనవుతోందని సూచిస్తుంది. πίστις‌కు ఇక్కడ ‘విశ్వాసం’ స్పష్టమైన, ప్రామాణిక తెలుగు పదం.
- source_word: κατεργάζεται
  choice: కలిగిస్తుంది
  rationale: ఏదో ఒక ఫలితాన్ని ఉత్పత్తి చేయడం లేదా తీసుకురావడం అనే క్రియాశీల భావాన్ని సహజ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑπομονήν
  choice: సహనం
  rationale: కష్టాల మధ్య నిలకడగా భరించే గుణాన్ని సంక్షిప్తంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది; ‘స్థిరత్వం’, ‘పట్టుదలతో కొనసాగడం’ అనే భావఛాయలు పాదసూచికలో ఇవ్వబడ్డాయి.
theological_decisions:
- issue: πίστις పదం అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఈ సందర్భంలో పాఠకుల దేవునిపై విశ్వాసం పరీక్షించబడటమే ప్రధాన భావం. ‘విశ్వసనీయత’ అనే అర్థాన్ని ఎంచుకోవాలని సందర్భం నిర్బంధించదు.
- issue: δοκίμιον యొక్క ప్రక్రియార్థం లేదా ఫలితార్థం
  choice: పరీక్షించబడడం
  alternative: పరీక్షలో నిరూపితమైన మీ విశ్వాసపు యథార్థత
  rationale: శ్రమల సందర్భంలో విశ్వాసం పరీక్షకు లోనవడం సహనాన్ని కలిగిస్తుందనే ప్రవాహం సహజంగా ఉంది. అయినా గ్రీకు పదంలోని నిరూపిత యథార్థత అనే సాధ్యమైన భావాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. మూలంలోని కారణ సంబంధం స్పష్టంగా వ్యక్తమైంది; δοκίμιον మరియు ὑπομονή పదాల భావ విస్తృతి పాదసూచికల్లో భద్రపరచబడింది.
