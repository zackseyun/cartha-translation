review_pass:
  verdict: revise
  source_fidelity: The causal participle is represented appropriately by “ఎందుకంటే ... మీకు తెలుసు,” and the content clause and causal result are retained. However, “సహనం” by itself commonly suggests patience/tolerance and does not adequately convey ὑπομονή, namely steadfast endurance under adversity. The translation also places both footnote anchors at the sentence end, obscuring which source terms they qualify.
  naturalness: The wording is generally understandable, but “మీ విశ్వాసం పరీక్షించబడడం” is less direct than the natural possessive construction “మీ విశ్వాసానికి జరిగే పరీక్ష.” “స్థిరసహనం” communicates the intended quality concisely in a modern, dignified register.
  terminology: “విశ్వాసం” is appropriate for πίστις. “పరీక్ష” appropriately represents the process sense of δοκίμιον while retaining its possible result sense in a note. “స్థిరసహనం” is preferable to bare “సహనం” for ὑπομονή.
  issues:
  - severity: medium
    issue: ὑπομονήν is rendered only as “సహనం.”
    rationale: In modern Telugu, “సహనం” can primarily mean patience or tolerance. The Greek refers more specifically to persevering, steadfast endurance amid difficulty. “స్థిరసహనం” preserves this component without imposing interpretation.
  - severity: low
    issue: Footnote anchors are both attached to the final punctuation rather than to their respective terms.
    rationale: The lexical alternatives concern δοκίμιον and ὑπομονή separately. Anchoring note a to “పరీక్ష” and note b to “స్థిరసహనం” makes their scope clear.
  revised_text: ఎందుకంటే, మీ విశ్వాసానికి జరిగే పరీక్ష[a] స్థిరసహనాన్ని[b] కలిగిస్తుందని మీకు తెలుసు.
