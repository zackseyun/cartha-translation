revisions:
- from: ఎందుకంటే, మీ విశ్వాసం పరీక్షించబడడం సహనాన్ని కలిగిస్తుందని మీకు తెలుసు[a][b].
  to: ఎందుకంటే, మీ విశ్వాసానికి జరిగే పరీక్ష[a] స్థిరసహనాన్ని[b] కలిగిస్తుందని మీకు తెలుసు.
  rationale: The revision preserves the source’s causal relationship and its process-oriented main reading for δοκίμιον, while making the Telugu possessive construction more idiomatic. It strengthens the rendering of ὑπομονή to indicate steadfast endurance rather than generic patience and relocates each note marker to the term it explains.
