id: JAS.1.10
reference: James 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ, ὅτι ὡς ἄνθος χόρτου παρελεύσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: te
  text: అయితే ధనవంతుడు తన దీనస్థితిలో[a], ఎందుకంటే అతడు గడ్డి పువ్వులా[b] గతించిపోతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మునుపటి వచనంలో సూచితమైన క్రియను పూరిస్తే: “అయితే ధనవంతుడు తన దీనస్థితిలో అతిశయించాలి.”'
    reason: alternative_reading
  - marker: b
    text: “గడ్డి పువ్వు” అనేది గ్రీకు చిత్రానికి సన్నిహితమైన అనువాదం; పుష్పించిన గడ్డివలె ధనవంతుడు ఎంత త్వరగా గతించిపోతాడో ఇది నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: అయితే ధనవంతుడు
  rationale: δέ ఇక్కడ 9వ వచనంలోని సమాంతర ఉపదేశాన్ని కొనసాగిస్తూ, దీనస్థితిలో ఉన్న సహోదరునికి ధనవంతునికి మధ్యనున్న వ్యత్యాసాన్ని కూడా సూచిస్తుంది. అందువల్ల సహజమైన తెలుగు అనుసంధాన పదంగా ‘అయితే’ వాడబడింది. πλούσιος విశేషణం నామవాచకంగా వాడబడినందున ‘ధనవంతుడు’ అని అనువదించబడింది.
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: తాను తగ్గించబడిన స్థితిలో
  rationale: ταπείνωσις ఇక్కడ వినయమనే సద్గుణాన్ని ప్రధానంగా సూచించకుండా, తగ్గింపుకు లేదా హీనస్థితికి గురికావడాన్ని సూచిస్తుంది. ‘తాను తగ్గించబడిన స్థితి’ అనే రూపం సామాజిక స్థాయి, సంపద, జీవితం తాత్కాలికమవడం వల్ల కలిగే తగ్గింపును నిలుపుతుంది; అనవసరంగా నైతిక వినయాన్ని చేర్చదు.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ὅτι తరువాత వచ్చే మాట ముందున్న తగ్గింపుకు కారణాన్ని తెలియజేస్తుంది. ‘ఎందుకంటే’ ఆ కారణార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: ὡς ἄνθος χόρτου
  choice: గడ్డిపువ్వులా
  rationale: ఈ రూపం గ్రీకు వాక్యంలోని ‘గడ్డి పువ్వు’ చిత్రాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది. మూలంలో లేని ‘పొలం’ వంటి భావాన్ని చేర్చకుండా, పుష్పించిన వృక్షజీవితం త్వరగా వాడిపోయే దృశ్యాన్ని కాపాడుతుంది.
- source_word: παρελεύσεται
  choice: అతడు గతించిపోతాడు
  rationale: παρέρχομαι ఇక్కడ ధనవంతుని జీవితం, ప్రాధాన్యం శాశ్వతం కాకుండా గతించిపోవడాన్ని సూచిస్తుంది. ‘గతించిపోతాడు’ కేవలం స్థలాన్ని దాటి వెళ్లడంకన్నా ఈ నశ్వరతను తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: మునుపటి వచనం నుండి క్రియను పూరించాల్సిన లోపవాక్యం
  choice: గ్రీకు మూలంలో ఈ వచనంలో లేని ‘అతిశయించాలి’ అనే క్రియను ప్రధాన పాఠ్యంలో చేర్చకుండా, వాక్యంలోని లోపాన్ని నిలిపాము.
  alternative: ‘అయితే ధనవంతుడు తాను తగ్గించబడిన స్థితిలో అతిశయించాలి’ అని 9వ వచనం నుండి క్రియను స్పష్టంగా పూరించడం.
  rationale: 10వ వచనం వాక్యనిర్మాణపరంగా 9వ వచనంలోని ఆజ్ఞార్థక క్రియపై ఆధారపడుతుంది. దాన్ని పూరిస్తే విడిగా చదివినప్పుడు అర్థం సులభమవుతుంది; అయితే మూలంలో లేని పదాన్ని ప్రధాన పాఠ్యంలో చేర్చినట్లవుతుంది. కాబట్టి అసలైన లోపవాక్యాన్ని నిలిపి, పాదటిప్పణిలో పూర్ణార్థాన్ని తెలిపాము.
- issue: ధనవంతుని ταπείνωσις అర్థం
  choice: ధనవంతుడు తగ్గించబడే స్థితి—ప్రత్యేకంగా అతని సంపద, స్థానం, జీవితం నశ్వరమైనవనే సందర్భంలో.
  alternative: అతని స్వచ్ఛంద వినయం లేదా సాధారణ సామాజిక దీనస్థితి.
  rationale: ‘గడ్డిపువ్వులా అతడు గతించిపోతాడు’ అనే కారణవాక్యం, ఇక్కడ ప్రధాన భావం వినయమనే సద్గుణం కాదని, ధనవంతుని స్థితి మరియు జీవితం తాత్కాలికమైనందువల్ల కలిగే తగ్గింపని సూచిస్తుంది. అనువాదం దీనిని ఏ ప్రత్యేక సిద్ధాంత వ్యవస్థతోనూ పూర్తిగా నిర్ధారించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని ఉద్దేశపూర్వక లోపవాక్యాన్ని ప్రధాన పాఠ్యంలో నిలిపినందున వాక్యం సందర్భంపై ఆధారపడుతుంది; దీన్ని [a] పాదటిప్పణి వివరిస్తుంది. ‘తాను తగ్గించబడిన స్థితి’ అనే పదబంధం కొద్దిగా గంభీరమైనదైనా, ‘వినయం’ అని తప్పుగా సద్గుణార్థం చేర్చకుండా ταπείνωσις యొక్క భావాన్ని కాపాడుతుంది.
