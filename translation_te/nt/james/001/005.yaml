id: JAS.1.5
reference: James 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: te
  text: అయితే మీలో ఎవరికైనా జ్ఞానం కొరవడితే, అతడు అందరికీ ఉదారంగా, తప్పుపట్టకుండా[a] ఇచ్చే దేవుని దగ్గర అడగాలి; అది అతనికి ఇవ్వబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిందించకుండా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δέ
  choice: అయితే
  rationale: δέ ముందటి సందర్భాన్ని కొనసాగిస్తూ స్వల్ప మలుపును సూచిస్తుంది; ‘అయితే’ దాని అనుసంధాన బలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τις ὑμῶν
  choice: మీలో ఎవరికైనా
  rationale: అనిర్దిష్టమైన τις మరియు విభాగార్థక ὑμῶν కలిసి నేరుగా పాఠకులను ఉద్దేశించే ‘మీలో ఎవరికైనా’ అనే భావాన్ని ఇస్తాయి.
- source_word: λείπεται σοφίας
  choice: జ్ఞానం కొరవడితే
  rationale: λείπεται ఇక్కడ ఏదో అవసరమైనది లేకపోవడాన్ని సూచిస్తుంది. ‘కొరవడితే’ సహజమైనది; σοφίας యొక్క విస్తృత భావాన్ని ‘జ్ఞానం’గా నిలుపుతుంది.
- source_word: αἰτείτω παρὰ τοῦ ... θεοῦ
  choice: దేవుణ్ణి ... అడగాలి
  rationale: మూడవ పురుష ఏకవచన ఆజ్ఞను తెలుగులో సహజంగా ‘అడగాలి’ అని వ్యక్తం చేశాం; సందర్భం దేవుని దగ్గర జ్ఞానం అడగడమేనని స్పష్టం చేస్తుంది.
- source_word: πᾶσιν
  choice: అందరికీ
  rationale: πᾶσιν యొక్క విస్తృత, అనిర్దిష్ట పరిధిని యథాతథంగా ఉంచుతుంది.
- source_word: ἁπλῶς
  choice: ఉదారంగా
  rationale: దేవుడు ఇచ్చే తీరును వర్ణిస్తున్న ఈ సందర్భంలో ἁπλῶς కొరత లేకుండా, ఉదారంగా ఇవ్వడాన్ని సూచిస్తుంది; ‘ఉదారంగా’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: μὴ ὀνειδίζοντος
  choice: నిందించకుండా
  rationale: అడిగేవారిని దేవుడు దూషించడు, అవమానించడు, తప్పుపట్టడు అనే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: δοθήσεται αὐτῷ
  choice: అది అతనికి ఇవ్వబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నేరుగా నిలుపుతుంది; ‘అది’ ముందున్న జ్ఞానాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ప్రతినిధి అర్థంలో ఉన్న పురుష ఏకవచనం
  choice: అతడు ... అతనికి
  alternative: ఆ వ్యక్తి ... ఆ వ్యక్తికి
  rationale: గ్రీకు వాక్యంలో αὐτῷ పురుష ఏకవచన రూపంలో ఉన్నా, ‘మీలో ఎవరికైనా’ వర్తించే ప్రతినిధి అర్థం ఉంది. మూలంలోని ఏకవచన రూపాన్ని నిలుపుతూ, అది పురుషులకు మాత్రమే పరిమితం కాదని పాదసూచికలో స్పష్టం చేశాం.
- issue: ἁπλῶςలో దేవుని ఇచ్చే తీరుకు సంబంధించిన భావం
  choice: ఉదారంగా
  alternative: నిష్కపటంగా; ఏ సంకోచమూ లేకుండా
  rationale: ఈ సందర్భంలో దేవుడు జ్ఞానాన్ని కొరతగా కాక ఉదారంగా ఇస్తాడనే భావం ప్రధానమైనది. అయితే పదాన్ని సంపద లేదా భౌతిక సమృద్ధి వాగ్దానంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘జ్ఞానం’ అనే పదాన్ని సందర్భానికి మించి కేవలం శ్రమలను ఎదుర్కొనే ఆచరణాత్మక వివేకంగా సంకుచితం చేయలేదు. పాదసూచిక గుర్తులను వాటి నిజమైన సంబంధిత పదాల దగ్గర ఉంచాం.
