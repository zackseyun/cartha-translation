  to: ఎందుకంటే, ఎవరైనా వాక్యాన్ని వినేవాడై, దాన్ని ఆచరించేవాడు కాకపోతే, అతడు అద్దంలో తన సహజ ముఖాన్ని[a] శ్రద్ధగా చూసే మనిషిని పోలి ఉన్నాడు.
