review_pass:
  verdict: revise
  source_fidelity: The central comparison and the hearer/doer contrast are retained. However, “తాను పుట్టినప్పటి ముఖం” means ‘the face he had when he was born,’ introducing a temporal meaning that does not represent the genitive τῆς γενέσεως. In this mirror context the phrase denotes one’s natural/native face. Rendering it as “సహజ ముఖం” is both accurate and idiomatic, while a footnote can retain the literal birth-related wording.
  naturalness: The draft is generally clear modern Telugu. “దాని ప్రకారం చేసేవాడు” is understandable but slightly expansive; “దాన్ని ఆచరించేవాడు” is a natural, concise expression for a doer of the word. The revised comparison is smoother Telugu.
  terminology: “వాక్యం,” “వినేవాడు,” and “ఆచరించేవాడు” preserve the important hearing/doing parallel. “మనిషి” works naturally for the illustrative ἀνήρ in this universally framed saying, without forcing an unnecessarily restrictive reading. “సహజ ముఖం” accurately communicates the idiomatic sense of the unusual Greek expression.
  issues:
  - severity: medium
    issue: “తాను పుట్టినప్పటి ముఖం” renders τῆς γενέσεως as a time expression.
    rationale: The Greek says literally ‘the face of his birth/origin,’ not specifically the face at the moment of birth. In context it refers to the person’s natural/native face. The temporal Telugu wording is potentially misleading.
  - severity: low
    issue: “దాని ప్రకారం చేసేవాడు” adds an explicit ‘according to it’ formulation.
    rationale: This does not substantially alter the meaning, but “దాన్ని ఆచరించేవాడు” conveys ποιητής more directly and preserves the hearer/doer contrast in idiomatic Telugu.
  revised_text: ఎందుకంటే, ఎవరైనా వాక్యాన్ని వినేవాడై, దాన్ని ఆచరించేవాడు కాకపోతే, అతడు అద్దంలో తన సహజ ముఖాన్ని[a] శ్రద్ధగా చూసే మనిషిని పోలి ఉన్నాడు.
