id: JAS.1.23
reference: James 1:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: te
  text: ఎందుకంటే, ఎవరైనా వాక్యాన్ని వినేవాడై, దాన్ని ఆచరించేవాడు కాకపోతే, అతడు అద్దంలో తన సహజ ముఖాన్ని[a] శ్రద్ధగా చూసే మనిషిని పోలి ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘తన పుట్టుకకు చెందిన ముఖం’; అంటే తాను పుట్టుకతో పొందిన సహజ ముఖం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροατὴς λόγου
  choice: వాక్యాన్ని వినేవాడు
  rationale: ‘వినడం—చేయడం’ అనే యాకోబు ఉద్దేశించిన నైతిక వ్యత్యాసాన్ని నిలుపుతూ, λόγος ను సందర్భానుసారంగా ‘వాక్యం’ అని నేరుగా అనువదించింది.
- source_word: ποιητής
  choice: దాని ప్రకారం చేసేవాడు
  rationale: తెలుగులో సహజంగా ఉండేందుకు కేవలం ‘చేసేవాడు’ అనకుండా, విన్న వాక్యాన్ని ఆచరించడం అనే సందర్భార్థాన్ని స్పష్టం చేసింది.
- source_word: ἔοικεν
  choice: లా ఉన్నాడు
  rationale: వర్తమాన భావంతో ఉన్న పోలికను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀνδρὶ
  choice: మనిషి
  rationale: ఇక్కడి ἀνήρ పురుషరూపమైనప్పటికీ ఉపమానం సాధారణంగా ఎవరినైనా ఉద్దేశిస్తుంది; ‘మనిషి’ తెలుగు భాషలో ఆ రూపాన్ని, సాధారణ అన్వయాన్ని రెండింటినీ సహజంగా మోస్తుంది.
- source_word: κατανοοῦντι
  choice: శ్రద్ధగా చూసే
  rationale: κατανοέω సూచించే పరిశీలనాత్మక, శ్రద్ధగల చూపును సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: τὸ πρόσωπον τῆς γενέσεως αὐτοῦ
  choice: తాను పుట్టినప్పటి ముఖాన్ని
  rationale: ‘తన పుట్టుకకు చెందిన ముఖం’ అనే గ్రీకు నిర్మాణాన్ని పూర్తిగా అసహజంగా చేయకుండా దగ్గరగా నిలుపుతుంది; ‘సహజ ముఖం’ అనే సందర్భార్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: ἐν ἐσόπτρῳ
  choice: అద్దంలో
  rationale: ἔσοπτρον కు సాధారణమైన, స్పష్టమైన ఆధునిక తెలుగు పదం.
theological_decisions:
- issue: ἀνδρὶ లోని పురుషరూప ప్రతినిధి భాష
  choice: మనిషి
  alternative: పురుషుడు
  rationale: గ్రీకులో పదం వ్యాకరణపరంగా పురుషరూపంలో ఉన్నా, ‘ఎవరైనా’ అని మొదలయ్యే ఈ ఉపమానం సార్వత్రికంగా వర్తిస్తుంది. ‘మనిషి’ మూలంలోని వ్యక్తిగత పోలికను నిలుపుతూ తెలుగులో అనవసరంగా మగవారికే పరిమితం చేయదు.
- issue: τῆς γενέσεως αὐτοῦ యొక్క అసాధారణ జననసంబంధ పదబంధం
  choice: తాను పుట్టినప్పటి ముఖం
  alternative: తన సహజ ముఖం
  rationale: మూలంలోని ‘జననం/పుట్టుక’ భావాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భానుగుణ భావాన్ని పాదటిప్పణిలో చూపడం ద్వారా నిజమైన పదార్థ ఉద్రిక్తతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘వినేవాడు—చేసేవాడు’ సమాంతరాన్ని నిలిపి, అసహజమైన జననసంబంధ గ్రీకు పదబంధాన్ని ప్రధాన పాఠ్యంలో సాధ్యమైనంత దగ్గరగా ఉంచి పాదటిప్పణితో వివరణ ఇచ్చింది.
