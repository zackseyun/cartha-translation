source:
  edition: SBLGNT
  text: Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a servant of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: te
  text: దేవునికీ, ప్రభువైన యేసు మెస్సీయకూ[a] దాసుడైన[b] యాకోబు, ప్రవాసంలో ఉన్న[c] పన్నెండు గోత్రాలకు శుభాకాంక్షలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యేసు క్రీస్తుకు.’ గ్రీకు Χριστός అనే బిరుదును ‘మెస్సీయ’ అనీ, పేరు వలె స్థిరపడిన ప్రయోగంలో ‘క్రీస్తు’ అనీ అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘దాసుడు’ అని అనువదించిన గ్రీకు పదం యజమానికి చెందిన వ్యక్తిని సూచిస్తుంది; సందర్భాన్ని బట్టి ‘సేవకుడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అంటే, ఇశ్రాయేలు దేశం వెలుపల ఇతర ప్రాంతాల్లో చెదరిపోయి నివసిస్తున్నవారు.
    reason: cultural_note
lexical_decisions:
- source_word: Ἰάκωβος
  choice: యాకోబు
  rationale: గ్రీకు పేరుకు నేరుగా సరిపోయే, తెలుగులో స్థిరపడిన బైబిలు పేరు; ఆంగ్ల సంప్రదాయ రూపమైన ‘James’ను అనుసరించలేదు.
- source_word: θεοῦ
  choice: దేవునికి
  rationale: δοῦλος‌తో ఉన్న స్వామిత్వ సంబంధాన్ని సహజమైన తెలుగు షష్ఠీ/సంబంధ భావంలో తెలియజేస్తుంది.
- source_word: κυρίου
  choice: ప్రభువైన
  rationale: యేసు అధికారాన్ని సూచించే స్థిరమైన నూతన నిబంధన బిరుదును నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయకు
  rationale: Ἰησοῦను పేరుగా, Χριστοῦను అభిషిక్త రాజును సూచించే బిరుదుగా అనువదించి, దానిని కేవలం రెండో పేరుగా మార్చలేదు.
- source_word: δοῦλος
  choice: దాసుడు
  rationale: యజమానికి చెందినవాడనే బలమైన భావాన్ని ఉంచుతూ, ఆధునిక గౌరవప్రద తెలుగు వాక్యశైలిలో సహజంగా ఉంటుంది.
- source_word: ταῖς δώδεκα φυλαῖς
  choice: పన్నెండు గోత్రాలవారికి
  rationale: ఇశ్రాయేలు పన్నెండు గోత్రాల ఒడంబడిక సంబంధిత భాషను సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: διασπορᾷ
  choice: చెదరిపోయి నివసిస్తున్న
  rationale: యూదులు తమ దేశం వెలుపల చెల్లాచెదురుగా నివసించడాన్ని సూచించే అర్థాన్ని సాధారణ తెలుగు పాఠకుడికి స్పష్టంగా అందిస్తుంది.
- source_word: χαίρειν
  choice: శుభాకాంక్షలు
  rationale: ఉత్తరారంభంలో వాడే గ్రీకు అభివాద పద్ధతిని సందర్భానుగుణంగా అనువదిస్తుంది; అక్షరార్థమైన ‘సంతోషించండి’ ఇక్కడ సరిపోదు.
theological_decisions:
- issue: Χριστοῦను బిరుదుగా లేదా పేరులో భాగంగా చూపడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ పదంలోని ‘అభిషిక్తుడు’ అనే బిరుదు భావాన్ని స్పష్టంగా నిలుపుతుంది; ‘క్రీస్తు’ అనే స్థిరపడిన రూపం కూడా సాధ్యమే కాబట్టి పాదసూచికలో ఇచ్చాం.
- issue: δοῦλοςలోని స్వామిత్వ భావం
  choice: దాసుడు
  alternative: సేవకుడు
  rationale: దేవునికీ ప్రభువైన యేసుకూ పూర్తిగా చెందినవాడనే బలమైన భావాన్ని ‘దాసుడు’ మెరుగుగా నిలుపుతుంది; అయినా ఇది వినయపూర్వక సేవను కూడా సూచించగలదు.
- issue: పన్నెండు గోత్రాలు ఎవరిని సూచిస్తున్నాయి
  choice: రూపకంగా విస్తరించకుండా ‘పన్నెండు గోత్రాలు’ అని ఉంచడం
  alternative: దేవుని ప్రజలు
  rationale: సంబోధనలోని ఇశ్రాయేలు భాషకు అక్షరార్థమూ విస్తృత ధార్మిక ప్రయోగమూ ఉండగలవు; వచనం స్వయంగా నిర్ణయించనిదాన్ని అనువాదం నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఉత్తరారంభ శైలి. ‘యాకోబు’ మూల గ్రీకు పేరును అనుసరిస్తుంది. ‘మెస్సీయ’ బిరుదు భావాన్ని నిలుపగా, ‘దాసుడు’ స్వామిత్వం మరియు సంపూర్ణ విధేయత రెండింటినీ వ్యక్తం చేస్తుంది. మూలంలోని సంక్షిప్త అభివాద నిర్మాణాన్ని తెలుగులో సహజమైన క్రమంలో అమర్చాం.
