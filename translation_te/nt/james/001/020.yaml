  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ ⸂οὐκ ἐργάζεται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: te
  text: ఎందుకంటే, మనిషి కోపం దేవుని నీతిని సాధించదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ ἀνδρός
  choice: మనిషి కోపం
  rationale: ἀνδρός ఇక్కడ సాధారణ మానవుని సూచిస్తుంది; లింగాన్ని అనవసరంగా ముందుకు తేవకుండా సహజమైన ఆధునిక తెలుగు వాడబడింది.
- source_word: δικαιοσύνην θεοῦ
  choice: దేవుని నీతిని
  rationale: గ్రీకు షష్ఠీ విభక్తిలో దేవునితో నీతికి ఉన్న సంబంధం ఉద్దేశపూర్వకంగా తెరిచి ఉంచబడింది; అది దేవుని స్వభావమైన నీతి లేదా దేవుడు కోరే నీతిమంతమైన ఫలితం అనే భావాలను అనవసరంగా విడదీయదు.
- source_word: οὐκ ἐργάζεται
  choice: సాధించదు
  rationale: ἐργάζεται ఇక్కడ ‘కలిగించడం/నెరవేర్చడం/సాధించడం’ అనే ఫలితార్థాన్ని కలిగి ఉంది; ‘సాధించదు’ తెలుగు వాక్యంలో సహజంగా ఉండి, మానవ కోపం దేవుని నీతిని కార్యరూపంలోకి తేలేదని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘దేవుని నీతి’ అనే పదబంధం యొక్క అర్థపరిధి
  choice: దేవుని నీతిని
  alternative: దేవుడు కోరే నీతిని
  rationale: ‘దేవుడు కోరే నీతి’ అని విపులీకరిస్తే θεοῦ అనే సంబంధాన్ని ఒకే వ్యాఖ్యానానికి పరిమితం చేసినట్లవుతుంది. మూలంలోని సంక్షిప్తతను, భావ ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వాక్యం. ‘ఎందుకంటే’ γάρ యొక్క కారణసూచక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
