id: JAS.1.18
reference: James 1:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: te
  text: సంకల్పించి[a], ఆయన సత్యవాక్యం ద్వారా మనకు జన్మనిచ్చాడు. మనం ఆయన సృష్టించిన వాటిలో ఒక విధమైన ప్రథమఫలంగా[b] ఉండాలని ఆయన ఇలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “తన సంకల్పం ప్రకారం ఆయన సత్యవాక్యం ద్వారా మనకు జన్మనిచ్చాడు.”'
    reason: alternative_reading
  - marker: b
    text: “ప్రథమఫలం” అంటే పంటలో మొదట లభించి దేవునికి అంకితం చేసే భాగం. ఇక్కడ దేవుడు సృష్టించిన వాటిలో విశ్వాసులు తొలిగా వచ్చిన, ఆయనకు అంకితమైన భాగమని ఈ రూపకం చిత్రిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: సంకల్పించి
  rationale: భూతకాల క్రియావిశేషణ రూపం దేవుని సంకల్పం ప్రధాన క్రియకు ముందున్నదని చూపుతుంది. తెలుగు వాక్యంలో ఇది సహజంగా ఉండి, దేవుని చొరవను తెలియజేస్తుంది; అయితే ఏ ప్రత్యేక సిద్ధాంత వ్యవస్థనూ చేర్చదు.
- source_word: ἀπεκύησεν
  choice: మనకు జన్మనిచ్చాడు
  rationale: ఈ క్రియలోని ప్రసవం/జననం రూపకాన్ని నిలుపుతుంది; యాకోబు 1:15లోని ‘జన్మనిస్తుంది’ అనే భావంతో ఉన్న ఉద్దేశపూర్వక ప్రతిధ్వనిని కూడా కాపాడుతుంది.
- source_word: λόγῳ ἀληθείας
  choice: సత్యవాక్యం ద్వారా
  rationale: λόγῳ ఇక్కడ సాధనార్థకంగా ఉంది. ‘సత్యవాక్యం’ మూలంలోని సంక్షిప్తమైన బైబిలు పదబంధాన్ని నిలుపుతుంది; ‘ద్వారా’ ఆ వాక్యం సాధనమని స్పష్టం చేస్తుంది.
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: మనం … ఉండాలని
  rationale: εἰς + articular infinitive తెలిపే ఉద్దేశం లేదా ఫలిత భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; రెండింటిలో ఒక్కదానికే అతిగా పరిమితం చేయదు.
- source_word: ἀπαρχήν
  choice: ప్రథమఫలం
  rationale: పంటలో మొదట లభించి దేవునికి అంకితం చేసే భాగాన్ని సూచించే రూపకాన్నీ, దాని బైబిలు ప్రతిధ్వనినీ నిలుపుతుంది.
- source_word: τινα
  choice: ఒక విధమైన
  rationale: τινα ఇక్కడ సంఖ్యను కాక ఉపమానాత్మక అర్హతను సూచిస్తుంది; విశ్వాసులు ఏ భావంలో ప్రథమఫలమో పూర్తిగా నిర్దిష్టం చేయకుండా మూలంలోని మృదుత్వాన్ని కాపాడుతుంది.
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: ఆయన సృష్టించిన వాటిలో
  rationale: κτίσματα అనే బహువచనం సృష్టించబడిన జీవులు లేదా వస్తువులను విస్తృతంగా సూచిస్తుంది. దీన్ని కేవలం మనుషులకు పరిమితం చేయకుండా సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: నూతన జననంలో దేవుని చొరవ
  choice: దేవుడు సంకల్పించి సత్యవాక్యం ద్వారా మనకు జన్మనిచ్చాడని అనువదించడం
  alternative: ‘తన స్వసంకల్పం ప్రకారం మనలను పుట్టించాడు’ అని అనువదించడం లేదా పునర్జన్మ సిద్ధాంతాన్ని మరింత స్పష్టంగా చేర్చడం
  rationale: గ్రీకు వాక్యం దేవుని సంకల్పాన్ని జన్మనివ్వడానికి ముందున్న చొరవగా చూపుతుంది; అయితే అది ఏ ప్రత్యేక పూర్వనిర్ణయ లేదా పునర్జన్మ సిద్ధాంత వ్యవస్థనూ వివరించదు.
- issue: κτισμάτων యొక్క పరిధి
  choice: ‘ఆయన సృష్టించిన వాటిలో’ అని విస్తృతంగా ఉంచడం
  alternative: ‘ఆయన సృష్టించిన మనుషుల్లో’ లేదా ‘సర్వసృష్టిలో’ అని కుదించడం/సామూహికీకరించడం
  rationale: మూలంలోని బహువచన పదం సృష్టించబడిన వాటిని విస్తృతంగా సూచించగలదు. దాన్ని మనుషులకు మాత్రమే పరిమితం చేయడం మూలంలో లేని నిర్దిష్టతను చేర్చుతుంది.
- issue: εἰς τὸ εἶναι లో ఉద్దేశం–ఫలితం సంబంధం
  choice: ‘ఉండాలని ఆయన ఇలా చేశాడు’
  alternative: ‘దాని ఫలితంగా మనం అయ్యాము’
  rationale: నిర్మాణంలోని లక్ష్యార్థాన్ని స్పష్టంగా తెలియజేస్తూనే, ఉద్దేశం మరియు నెరవేరిన ఫలితం మధ్య ఉన్న భావసంబంధాన్ని అతిగా సిద్ధాంతీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘జన్మనిచ్చాడు’ జనన రూపకాన్ని స్పష్టంగా ఉంచుతుంది. పొడవైన గ్రీకు వాక్యాన్ని చదవడానికి సులభంగా రెండు తెలుగు వాక్యాలుగా విభజించినా, వాటి తార్కిక సంబంధాన్ని ‘ఇలా చేశాడు’ ద్వారా నిలిపాం. సాంస్కృతికంగా అపరిచితమయ్యే ‘ప్రథమఫలం’ పదాన్ని వివరణాత్మక పాదటిప్పణితో ఉంచాం.
