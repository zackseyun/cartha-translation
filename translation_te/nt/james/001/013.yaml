id: JAS.1.13
reference: James 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: te
  text: ఎవరూ ప్రలోభానికి గురవుతున్నప్పుడు, “నేను దేవుని వల్ల ప్రలోభానికి గురవుతున్నాను” అని అనకూడదు. ఎందుకంటే దేవుడు చెడువల్ల ప్రలోభానికి లోనుకానివాడు[a]; ఆయన స్వయంగా ఎవరినీ ప్రలోభపరచడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సహజంగా: “దేవుడు చెడువల్ల ప్రలోభానికి లోనుకాలేడు.” గ్రీకులో అరుదైన విశేషణం ఉంది; అక్షరార్థానికి దగ్గరగా, “దేవుడు చెడులచేత ప్రలోభింపబడనివాడు” అని ఉంటుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεὶς ... λεγέτω
  choice: ఎవరైనా ... అనకూడదు
  rationale: గ్రీకు నిషేధాత్మక ఆజ్ఞను సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: πειραζόμενος
  choice: శోధించబడుతున్నప్పుడు
  rationale: వర్తమాన కర్మణి అసమాపక క్రియలోని కొనసాగుతున్న భావాన్ని నిలుపుతుంది; సందర్భం పాపం వైపు ప్రలోభపరచడాన్ని సూచిస్తుంది.
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: దేవుని వల్లనే నేను శోధించబడుతున్నాను
  rationale: ἀπό సూచించే మూలం లేదా కారణాన్ని ‘వల్ల’ సహజంగా తెలియజేస్తుంది; ‘నే’ వక్త దేవునినే మూలంగా ఆరోపిస్తున్న భావాన్ని స్పష్టం చేస్తుంది.
- source_word: ἀπείραστός ἐστιν κακῶν
  choice: చెడు చేత శోధించబడనివాడు
  rationale: అరుదైన విశేషణం ἀπείραστος యొక్క సంక్షిప్త విశేషణ బలాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, κακῶνను సందర్భానుసారంగా సమష్టి భావమైన ‘చెడు’గా అందిస్తుంది.
- source_word: πειράζει δὲ αὐτὸς οὐδένα
  choice: ఆయన స్వయంగా ఎవరినీ శోధించడు
  rationale: αὐτόςలోని ఉద్ఘాటనను ‘స్వయంగా’ నిలుపుతుంది; పునరావృత πειράζωకు ఒకే తెలుగు పదాన్ని వాడుతుంది.
theological_decisions:
- issue: πειράζω పదశ్రేణి యొక్క భావం
  choice: అన్ని సందర్భాల్లో ‘శోధించు/శోధించబడుట’
  alternative: ‘పరీక్షించు/పరీక్షించబడుట’ లేదా మొదట ‘పరీక్ష’, తరువాత ‘శోధన’
  rationale: తదుపరి వచనాల్లో చెడు కోరిక పాపానికి దారితీయడం ప్రధాన సందర్భం. అందువల్ల ఇక్కడ నైతికంగా చెడువైపు ప్రలోభపరచే భావమే ముందుంటుంది; దేవుడు ఇతర సందర్భాల్లో పరీక్షించవచ్చనే విస్తృత బైబిలు అంశాన్ని ఈ వచనంలో కలపలేదు.
- issue: ἀπείραστός ἐστιν κακῶν యొక్క క్లిష్ట భావం
  choice: దేవుడు చెడు చేత శోధించబడనివాడు
  alternative: దేవుడు చెడు చేత శోధించబడలేడు; దేవునికి చెడుతో అనుభవం లేదు; దేవుణ్ణి చెడుతో శోధించకూడదు
  rationale: గ్రీకు విశేషణ రూపాన్ని నిలుపుతూ, సందర్భంలో దేవుడు చెడు ప్రలోభానికి లోబడనివాడనే భావాన్ని ఇస్తుంది. పదబంధంలోని నిజమైన వ్యాఖ్యాన క్లిష్టతను పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘ప్రలోభపరచు’ కంటే ‘శోధించు’ను ఎంచుకోవడం ద్వారా ఒకే గ్రీకు మూలపదపు పునరావృతాన్ని నిలిపి, తెలుగు బైబిలు పరిచయాన్ని కొనసాగించాం; పాదసూచిక అరుదైన గ్రీకు విశేషణంలోని అస్పష్టతను సంరక్షిస్తుంది.
