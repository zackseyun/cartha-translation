revisions:
- from: ఎవరైనా శోధించబడుతున్నప్పుడు, “దేవుని వల్లనే నేను శోధించబడుతున్నాను” అని అనకూడదు. ఎందుకంటే దేవుడు చెడు చేత శోధించబడనివాడు[a]; ఆయన స్వయంగా ఎవరినీ శోధించడు.
  to: ఎవరూ ప్రలోభానికి గురవుతున్నప్పుడు, “నేను దేవుని వల్ల ప్రలోభానికి గురవుతున్నాను” అని అనకూడదు. ఎందుకంటే దేవుడు చెడువల్ల ప్రలోభానికి లోనుకానివాడు[a]; ఆయన స్వయంగా ఎవరినీ ప్రలోభపరచడు.
  rationale: The revision makes the moral-temptation sense explicit throughout, as required by the immediate context, while retaining the difficult adjectival force of ἀπείραστος in ‘ప్రలోభానికి లోనుకానివాడు.’ It removes an unwarranted Telugu emphasis from ‘దేవుని వల్లనే’ and revises the footnote to preserve the rare adjective and the Greek plural κακῶν without treating a disputed nuance as doctrinally settled.
  reviewer_model: gpt-5.6-terra
