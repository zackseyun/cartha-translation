review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the prohibition, God as the alleged source, the difficult assertion that God is not susceptible to evil temptation, and the emphatic denial that God tempts anyone. However, ‘శోధించు’ normally suggests examining or testing in modern Telugu and does not adequately carry the immediate sense of morally evil enticement. The added emphatic ‘వల్లనే’ is not required by ἀπὸ θεοῦ.
  naturalness: ‘చెడు చేత శోధించబడనివాడు’ is grammatically possible but stiff and readily understood as ‘not tested by evil,’ rather than ‘not susceptible to temptation by evil.’ ‘ప్రలోభానికి గురవు/లోనుకావు’ and ‘ప్రలోభపరచు’ are clear modern-standard Telugu formulations for this context.
  terminology: 'Use the temptation/enticement terminology consistently at the semantic level: ‘ప్రలోభానికి గురవు,’ ‘ప్రలోభానికి లోనుకావు,’ and ‘ప్రలోభపరచు.’ This accurately distinguishes the moral-enticing sense intended here from ordinary testing, without making a doctrinal statement about every sense in which God may test people.'
  issues:
  - severity: medium
    issue: ‘శోధించు’ is semantically too broad in the verse text.
    rationale: In current Telugu, it commonly means investigate, examine, or test. James 1:13–14 concerns enticement toward evil; ‘ప్రలోభ’ communicates that sense directly.
  - severity: low
    issue: The quotation adds ‘నే’ in ‘దేవుని వల్లనే.’
    rationale: The Greek attributes the temptation to God but does not supply an explicit restrictive/emphatic particle. Removing it more closely reflects the source.
  - severity: low
    issue: The footnote’s literal paraphrase ‘చెడుల విషయంలో శోధించబడనివాడు’ is not idiomatic Telugu and can obscure the lexical difficulty.
    rationale: A concise alternative plus an explanation that the Greek adjective is rare and that the noun is plural preserves both readability and the source-language feature.
  revised_text: ఎవరూ ప్రలోభానికి గురవుతున్నప్పుడు, “నేను దేవుని వల్ల ప్రలోభానికి గురవుతున్నాను” అని అనకూడదు. ఎందుకంటే దేవుడు చెడువల్ల ప్రలోభానికి లోనుకానివాడు[a]; ఆయన స్వయంగా ఎవరినీ ప్రలోభపరచడు.
  revised_footnotes:
