id: JAS.1.15
reference: James 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: te
  text: అప్పుడు కోరిక గర్భం దాల్చి[a] పాపాన్ని కంటుంది; పాపం పూర్తిగా ఎదిగినప్పుడు[b] మరణాన్ని కంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గర్భం ధరించిన తరువాత.’ గ్రీకు అసమాపక క్రియ కోరికతో గర్భధారణ చిత్రణను దగ్గరగా అనుసంధానిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పూర్తి అయినప్పుడు’ లేదా ‘పరిపక్వతకు చేరినప్పుడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: అప్పుడు
  rationale: మునుపటి వచనంలో మొదలైన శోధన నుంచి మరణం వరకు సాగే క్రమంలో తదుపరి దశను సహజంగా సూచిస్తుంది.
- source_word: ἐπιθυμία
  choice: కోరిక
  rationale: ఈ పదం సందర్భంలో చెడు వైపు లాగే కోరికను సూచించినా, ‘దురాశ’ అని అనువదిస్తే ధనలోభం వంటి మరింత సంకుచిత భావం రావచ్చు. ‘కోరిక’ మూలపదంలోని విస్తృతతను కాపాడుతుంది.
- source_word: συλλαβοῦσα
  choice: గర్భం దాల్చి
  rationale: కోరికను వ్యక్తీకరిస్తూ వాడిన గర్భధారణ రూపకాన్ని స్పష్టంగా నిలుపుతుంది; ప్రధాన క్రియకు ముందు జరిగిన చర్యను కూడా తెలుపుతుంది.
- source_word: τίκτει
  choice: కంటుంది
  rationale: ‘పాపాన్ని కలిగిస్తుంది’ అనే నైరూప్యమైన మాటకు బదులుగా ప్రసవ రూపకాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἁμαρτίαν
  choice: పాపాన్ని
  rationale: నైతిక దుష్టత్వాన్ని సూచించే మూలపదానికి ప్రామాణికమైన, సందర్భోచితమైన అనువాదం.
- source_word: δὲ
  choice: ;
  rationale: తెలుగులో వాక్య నిర్మాణం మరియు విరామచిహ్నం ద్వారా తదుపరి దశకు మార్పు సహజంగా వ్యక్తమవుతుంది; మూలంలోని δέ ఇక్కడ తీవ్రమైన వ్యతిరేకతను కాక కొనసాగింపును సూచిస్తుంది.
- source_word: ἀποτελεσθεῖσα
  choice: పూర్తిగా ఎదిగినప్పుడు
  rationale: పాపం సంపూర్ణ స్థితికి లేదా పరిపక్వతకు చేరడాన్ని తెలియజేస్తూ, గర్భధారణ–జననం–ఎదుగుదల రూపక క్రమాన్ని సహజంగా కొనసాగిస్తుంది.
- source_word: ἀποκύει
  choice: కంటుంది
  rationale: ఈ క్రియలోనూ ఉన్న ప్రసవ చిత్రణను నిలుపుతుంది. తెలుగులో పునరుక్తి ఈ క్రమబద్ధమైన రూపకానికి బలం చేకూరుస్తుంది.
- source_word: θάνατον
  choice: మరణాన్ని
  rationale: మూలంలో ఉన్న విస్తృతమైన, వివరణలేని భావాన్ని అలాగే ఉంచుతుంది; శారీరక, ఆత్మీయ లేదా నిత్య మరణం అని అనువాదంలో పరిమితం చేయదు.
theological_decisions:
- issue: కోరిక, పాపం, మరణం మధ్య ఉన్న రూపకం
  choice: గర్భధారణ, ప్రసవం, ఎదుగుదల అనే వ్యక్తీకృత రూపకాన్ని నిలుపడం
  alternative: ‘కోరిక పాపానికి దారితీస్తుంది; పాపం మరణానికి దారితీస్తుంది’ అని కేవలం కారణ–ఫలిత సంబంధంగా చెప్పడం
  rationale: కేవలం కారణ–ఫలిత భాష వాడితే మూలంలోని సజీవమైన ప్రసవ రూపకం మరియు దాని హెచ్చరిక బలం తగ్గిపోతాయి.
- issue: θάνατος యొక్క పరిధి
  choice: ‘మరణం’ అని మాత్రమే అనువదించడం
  alternative: ‘ఆత్మీయ మరణం’ లేదా ‘నిత్య మరణం’ అని నిర్దిష్టీకరించడం
  rationale: గ్రీకు పాఠం మరణం యొక్క రకాన్ని పేర్కొనదు. అందువల్ల అనువాదం ఒక నిర్దిష్ట సిద్ధాంతార్థాన్ని చేర్చకుండా మూలంలోని ఉద్దేశపూర్వక విస్తృతతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అదే సమయంలో గంభీరతను నిలుపుతూ అనువదించబడింది. ‘కంటుంది’ అనే సహజమైన క్రియ మూలంలోని ప్రసవ రూపకాన్ని రెండుచోట్లా స్పష్టంగా కాపాడుతుంది; ‘కోరిక’ అనే పదం అనవసరంగా లైంగిక వాంఛకో లేదా ధనలోభానికో భావాన్ని పరిమితం చేయదు.
