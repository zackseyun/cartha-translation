  text: κατενόησεν γὰρ ἑαυτὸν καὶ ἀπελήλυθεν καὶ εὐθέως ἐπελάθετο ὁποῖος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/024.yaml
  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: te
  text: ఎందుకంటే అతడు తనను తాను చూసి వెళ్లిపోయి, వెంటనే తాను ఎలాంటివాడో మరిచిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాను ఎలా ఉన్నాడో.” గ్రీకు పదబంధం అతడు ఏ విధమైనవాడో లేదా ఎలాంటివాడో సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατενόησεν
  choice: చూసుకొని
  rationale: κατανοέω శ్రద్ధగా గమనించడం లేదా పరిశీలించడం అనే భావాన్ని కలిగి ఉంది. అద్దం ఉపమానంలో ‘చూసుకొని’ సహజంగా ఉండి, కేవలం క్షణికంగా చూసిన చర్యను సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందటి వాక్యంలోని పోలికకు వివరణ ఇస్తుంది; ‘ఎందుకంటే’ ఆ వివరణాత్మక సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా చూపిస్తుంది.
- source_word: ἑαυτὸν
  choice: తనను తాను
  rationale: ఈ ఆత్మవాచక సర్వనామం నేరుగా ‘తనను తాను’ అని అర్థమిస్తుంది. ముందు వచనంలో అద్దం, ముఖం ప్రస్తావించబడినా, ఈ వచనంలో లేని ‘ముఖం’ అనే పదాన్ని చేర్చలేదు.
- source_word: ἀπελήλυθεν
  choice: వెళ్లిపోయి
  rationale: ἀπέρχομαι యొక్క పరిపూర్ణ భూతరూపం వెళ్లిపోవడాన్ని సూచిస్తుంది. వరుసగా జరిగే చర్యలను తెలుగులో సహజంగా కలపడానికి ‘వెళ్లిపోయి’ అని అనువదించబడింది.
- source_word: εὐθέως
  choice: వెంటనే
  rationale: εὐθέως ఆలస్యం లేకుండా జరిగినదని సూచిస్తుంది; ‘వెంటనే’ దాని బలాన్ని సహజమైన ప్రామాణిక తెలుగులో నిలుపుతుంది.
- source_word: ἐπελάθετο
  choice: మరిచిపోయాడు
  rationale: ἐπιλανθάνομαι గుర్తుంచుకోకపోవడం లేదా మరిచిపోవడం అని అర్థం; ‘మరిచిపోయాడు’ సూటిగా, సహజంగా ఉంది.
- source_word: ὁποῖος ἦν
  choice: తాను ఎలాంటివాడో
  rationale: ὁποῖος వ్యక్తి యొక్క గుర్తింపుకన్నా అతడు ఏ విధమైనవాడో, అతని స్వరూపం లేదా తీరు ఎలాంటిదో సూచిస్తుంది. ‘తాను ఎలాంటివాడో’ ఈ గుణాత్మక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: అద్దం ఉపమానంలోని వ్యాకరణపరమైన పుంలింగ ఏకవచనం
  choice: తాను ఎలాంటివాడో
  alternative: తాను ఎలాంటి వ్యక్తో
  rationale: గ్రీకు వాక్యం పుంలింగ ఏకవచనంలో ఉన్న ప్రతినిధి వ్యక్తిని వర్ణిస్తుంది. తెలుగు వాక్యంలో అదే ఏకవచన రూపాన్ని సహజంగా ఉంచినా, భావాన్ని పురుషులకు మాత్రమే పరిమితం చేయలేదు; సందర్భంలో ఇది వాక్యాన్ని విని ఆచరించని ఎవరినైనా సూచించే సాధారణ ఉదాహరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన క్రియాక్రమం, అయితే మూలంలోని వివరణాత్మక సంబంధం మరియు వ్యక్తి స్వరూపాన్ని సూచించే గుణాత్మక అస్పష్టత నిలుపబడింది.
