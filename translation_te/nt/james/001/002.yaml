  verdict: revise
  source_fidelity: The draft accurately represents the vocative address, the indefinite/repeated temporal force of ὅταν, the variety indicated by ποικίλοις, and the contextual sense of πειρασμοῖς. However, ‘ఎంచండి’ means ‘choose,’ whereas ἡγήσασθε calls for regarding, reckoning, or considering; this should be corrected.
  naturalness: ‘రకరకాల పరీక్షల్లో చిక్కుకున్నప్పుడల్లా’ is understandable and vivid, but ‘వివిధమైన పరీక్షలను ఎదుర్కొన్నప్పుడల్లా’ is more natural in modern standard Telugu and avoids suggesting entrapment as the primary sense. ‘పరిగణించండి’ naturally expresses the required evaluative imperative.
  terminology: ‘నా సహోదరులారా’ appropriately retains the masculine Greek form, with an inclusive alternative footnote. ‘పరీక్షలు’ fits the immediate context; the footnote properly preserves the broader semantic range. ‘సంపూర్ణ ఆనందంగా’ adequately conveys Πᾶσαν χαράν.
  issues:
  - severity: medium
    issue: ‘ఎంచండి’ for ἡγήσασθε
    rationale: The Greek imperative is an instruction to evaluate or reckon the experience as joy, not to select it. ‘పరిగణించండి’ preserves the mental-assessment sense without adding volitional-choice meaning.
  - severity: low
    issue: ‘చిక్కుకున్నప్పుడల్లా’ for περιπέσητε
    rationale: Though possible, it can foreground being trapped. ‘ఎదుర్కొన్నప్పుడల్లా’ is a more idiomatic modern Telugu expression for encountering various trials while retaining the indefinite temporal force.
