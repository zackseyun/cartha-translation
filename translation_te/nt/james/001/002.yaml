id: JAS.1.2
reference: James 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πᾶσαν χαρὰν ἡγήσασθε, ἀδελφοί μου, ὅταν πειρασμοῖς περιπέσητε ποικίλοις,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/002.yaml
  text: Consider it all joy[a], my brothers, whenever you fall into various trials[b],
translation:
  language: te
  text: నా సహోదరులారా,[a] మీరు వివిధమైన పరీక్షలను ఎదుర్కొన్నప్పుడల్లా, వాటిని సంపూర్ణ ఆనందంగా పరిగణించండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా సహోదర సహోదరీలారా’; ‘సహోదరులు’ అనే సంభోధన విశ్వాస సమాజమంతటినీ ఉద్దేశించి ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘పరీక్షలు’ అని అనువదించిన గ్రీకు పదానికి సందర్భానుసారంగా ‘శోధనలు’ లేదా ‘ప్రలోభాలు’ అనే అర్థాలు కూడా ఉండవచ్చు. ఇక్కడ విశ్వాసాన్ని పరీక్షించే బయటి కష్టాలే ప్రధాన భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: సంపూర్ణ ఆనందంగా
  rationale: ఈ కర్మవిభక్తి పదబంధం ἡγήσασθε క్రియకు విధేయపూరకంగా ఉంది. ‘సంపూర్ణ ఆనందంగా’ అనేది ఆనందం ఏమాత్రం తగ్గనిదిగా పరిగణించాలనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; కష్టాలనే ఆనందకరమైనవిగా ప్రకటిస్తున్నట్టు అనవసరంగా బలపరచదు.
- source_word: ἡγήσασθε
  choice: ఎంచండి
  rationale: ఇక్కడ ἡγέομαι మానసికంగా లెక్కించడం, పరిగణించడం, ఒక విధంగా నిర్ధారించుకోవడం అనే అర్థంలో ఉన్న ఆజ్ఞార్థక క్రియ. ‘ఎంచండి’ కన్నా ‘పరిగణించండి’ మరింత ప్రత్యక్ష ప్రత్యామ్నాయం అయినప్పటికీ, ‘దాన్ని ...గా ఎంచండి’ ఆధునిక తెలుగులో ఉద్దేశపూర్వక విలువనిర్ణయాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἀδελφοί μου
  choice: నా సహోదరులారా
  rationale: సంభోధనలోని వ్యాకరణపరమైన పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది. ఇది విశ్వాస సమాజమంతటినీ ఉద్దేశించే అవకాశం ఉన్నందున సమ్మిళిత అర్థాన్ని పాదటిప్పణిలో పేర్కొంటుంది.
- source_word: ὅταν
  choice: అప్పుడల్లా
  rationale: ఉపవాక్యంలోని సంభావనార్థక క్రియతో కలిసి ὅταν అనిశ్చిత లేదా పునరావృత కాలార్థాన్ని ఇస్తుంది. ‘అప్పుడల్లా’ ఆ whenever భావాన్ని సహజంగా అందిస్తుంది.
- source_word: πειρασμοῖς
  choice: పరీక్షల్లో
  rationale: సందర్భంలో విశ్వాసాన్ని పరీక్షించే బయటి కష్టాలు ప్రధానంగా ఉద్దేశించబడ్డాయి. గ్రీకు పదానికి ‘శోధనలు’ అనే నైతిక ప్రలోభ భావం కూడా సందర్భానుసారంగా ఉండగలదని పాదటిప్పణి స్పష్టం చేస్తుంది.
- source_word: περιπέσητε
  choice: చిక్కుకున్న
  rationale: περιπίπτω అక్షరార్థంగా ‘లో పడడం’ లేదా అనుకోకుండా ఎదుర్కోవడం. పరీక్షల విషయంలో ‘చిక్కుకోవడం’ ఆ అనూహ్యంగా చుట్టుముట్టబడే సజీవ భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ποικίλοις
  choice: రకరకాల
  rationale: ఈ విశేషణం వైవిధ్యాన్ని సూచిస్తుంది. ‘రకరకాల’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
theological_decisions:
- issue: పత్రికా సంభోధనలో ἀδελφοί యొక్క సమ్మిళిత పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘నా సహోదరులారా’ అని ఉంచి, సమాజంలోని స్త్రీలను కూడా ఉద్దేశించి ఉండవచ్చని పాదటిప్పణిలో తెలియజేయడం.
  alternative: నా సహోదర సహోదరీలారా
  rationale: ఇది గ్రీకు పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో కాపాడుతూ, సందర్భంలో ఉన్న విస్తృత సమాజపరమైన ఉద్దేశాన్ని దాచకుండా ఉంచుతుంది.
- issue: పరీక్షల మధ్య ఆనందం అనే ఆజ్ఞ యొక్క భావం
  choice: పరీక్షలను సంపూర్ణ ఆనందంగా ఎంచమనే విలువనిర్ణయ ఆజ్ఞగా అనువదించడం.
  alternative: పరీక్షలు స్వతహాగా ఆనందకరమైనవని చెప్పడం.
  rationale: వాక్యం బాధను మంచిదిగా ప్రకటించడం కంటే, పరీక్షలను ఎదుర్కొన్నప్పుడు విశ్వాసి వాటిని ఎలా అంచనా వేయాలో ఆజ్ఞాపిస్తుంది. తదుపరి వచనాలు ఆ అంచనాకు కారణాన్ని వివరిస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సహోదరులారా’ బైబిలు సంభోధనకు తగిన గౌరవాన్ని నిలుపుతుంది; ‘రకరకాల పరీక్షల్లో చిక్కుకున్నప్పుడల్లా’ మూలంలోని వైవిధ్యం, అనిశ్చిత కాలం, సజీవ క్రియాభావాన్ని సహజంగా అందిస్తుంది. రెండు పాదటిప్పణి సూచికలూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
