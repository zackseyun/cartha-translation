source:
  edition: SBLGNT
  text: ἕκαστος δὲ πειράζεται ὑπὸ τῆς ἰδίας ἐπιθυμίας ἐξελκόμενος καὶ δελεαζόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: te
  text: కాని ప్రతి వ్యక్తి తన సొంత కోరికచేత బయటకు లాగబడి, ఎరకు ఆకర్షింపబడి, శోధనకు లోనవుతాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కోరిక’ అనే గ్రీకు పదాన్ని ‘తీవ్రమైన వాంఛ’ లేదా సందర్భానుసారం ‘దురాశ’ అని కూడా అనువదించవచ్చు. అది కేవలం లైంగిక కోరికను మాత్రమే సూచించదు.
    reason: lexical_alternative
  - marker: b
    text: ‘బయటకు లాగబడి, ఎరకు ఆకర్షింపబడి’ అనే జత పదాలు ఎరతో చేపను లేదా వేటను ఉచ్చు వైపు ఆకర్షించే చిత్రాన్ని సూచిస్తాయి.
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: ప్రతి వ్యక్తీ
  rationale: గ్రీకులోని పంపిణీయ ఏకవచన భావాన్ని, వ్యక్తిగత బాధ్యతపై ఉన్న నొక్కును సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: కాని
  rationale: '13వ వచనంతో ఉన్న స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది: దేవుడు ఎవరినీ శోధించడు; కాని ప్రతి వ్యక్తి తన సొంత కోరిక వల్ల శోధనకు లోనవుతాడు.'
- source_word: πειράζεται
  choice: శోధించబడుతున్నాడు
  rationale: ఈ సందర్భంలో ఇది సాధారణ పరీక్షను కాక పాపం వైపు ప్రలోభపరచబడటాన్ని సూచిస్తుంది; 13, 15 వచనాల సందర్భానికి ఈ పదం సరిపోతుంది.
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: తన సొంత కోరిక చేత
  rationale: శోధనకు సమీప కారణంగా వ్యక్తిలోని కోరికనే చూపుతుంది. ‘సొంత’ అనే పదం వ్యక్తిగత బాధ్యతను నొక్కిచెబుతుంది.
- source_word: ἐπιθυμίας
  choice: కోరిక
  rationale: గ్రీకు పదం బలమైన ఆశ లేదా వాంఛను విస్తృతంగా సూచించగలదు; కేవలం లైంగిక భావానికి పరిమితం చేయకుండా సందర్భంలోని చెడు దిశను నిలుపుతుంది.
- source_word: ἐξελκόμενος
  choice: బయటికి లాగబడి
  rationale: ఏదో సురక్షిత స్థానం నుంచి లేదా సరైన మార్గం నుంచి బయటికి లాగబడుతున్న చిత్రాన్ని సాధ్యమైనంత ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: δελεαζόμενος
  choice: ఎరవేయబడి
  rationale: ఎరతో చేపను లేదా వేటను ఆకర్షించే మూల రూపకాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది; జతగా ఉన్న రెండు కృదంతాల వేట/చేపల వేట చిత్రాన్ని కాపాడుతుంది.
theological_decisions:
- issue: శోధనకు మూలం—దేవుడా లేక వ్యక్తి సొంత కోరికా
  choice: వ్యక్తి తన సొంత కోరిక చేత శోధించబడుతున్నాడని స్పష్టంగా అనువదించాం.
  alternative: దీనిని కేవలం బాహ్య పరీక్షా పరిస్థితులుగా మృదువుగా అనువదించడం.
  rationale: 13వ వచనం దేవుడు ఎవరినీ శోధించడని చెబుతుంది; 14వ వచనం శోధనకు సమీప మూలంగా వ్యక్తి సొంత కోరికను పేర్కొంటుంది. పాఠం చెప్పినదానికంటే విస్తృతమైన కారణ సిద్ధాంతాన్ని ఇందులో చేర్చలేదు.
- issue: ప్రాతినిధ్య ఏకవచనం మరియు లింగం
  choice: ‘ప్రతి వ్యక్తీ ... తన’ అనే సహజ తెలుగు ఏకవచన నిర్మాణాన్ని వాడాం.
  alternative: ‘ప్రతి ఒక్కరూ ... తమ’ అనే బహువచన గౌరవ/లింగనిరపేక్ష నిర్మాణం.
  rationale: గ్రీకు ఏకవచనంలోని వ్యక్తిగత నొక్కును తెలుగులో సహజంగా కాపాడుతూ, అనవసరంగా పురుష లింగాన్ని ముందుకు తేవకుండా మూలంలోని సాధారణ మానవ సూచనను వ్యక్తం చేస్తుంది.
- issue: కృదంతాల సంబంధం
  choice: ‘బయటికి లాగబడి, ఎరవేయబడి’ అనే రెండు ప్రక్రియలనూ శోధించబడటాన్ని వివరిస్తున్న సమాంతర రూపాలుగా ఉంచాం.
  alternative: వాటిని వరుసగా జరిగే రెండు స్వతంత్ర క్రియలుగా మార్చడం.
  rationale: మూలంలోని రెండు వర్తమాన కర్మణి కృదంతాల వ్యాకరణ సంబంధాన్ని, వాటి కలిసిన రూపక ప్రభావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘ఎరవేయబడి’ కొంత రూపకాత్మకంగా ఉన్నప్పటికీ మూలంలోని చేపల వేట/వేట చిత్రాన్ని కాపాడేందుకు ఉద్దేశపూర్వకంగా వాడబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
