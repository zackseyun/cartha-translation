id: JAS.1.4
reference: James 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: te
  text: సహనం తన కార్యాన్ని పరిపూర్ణంగా చేయనివ్వండి[a]; తద్వారా మీరు పరిణతి గలవారుగా, సంపూర్ణులుగా, ఏ విషయంలోనూ లోటులేనివారుగా ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహనం తన పనిని పూర్తిగా నెరవేర్చనివ్వండి.” ఇక్కడ గ్రీకులో వాడిన సంబంధిత పదాలు ఉద్దేశించిన ముగింపుకు చేరడాన్నీ, అన్ని భాగాల్లో సమగ్రంగా ఉండడాన్నీ సూచిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴ
  choice: సహనం
  rationale: పరీక్షల మధ్య స్థిరంగా నిలిచి కొనసాగడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘సహనం’ సహజంగా ఉండగా, సందర్భం దానికి కేవలం నిష్క్రియ ఓర్పు కాక పట్టుదలతో భరించే భావాన్ని ఇస్తుంది.
- source_word: ἔργον τέλειον
  choice: పరిపూర్ణ కార్యం
  rationale: ἔργον అనే ‘కార్యం’ భావాన్నీ, τέλειον అనే ఉద్దేశించిన ముగింపు లేదా సంపూర్ణత భావాన్నీ నేరుగా నిలుపుతుంది. తెలుగులో ‘తన ... కార్యాన్ని జరిగించు’ అనే నిర్మాణం ఫలితం పూర్తిగా నెరవేరడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐχέτω
  choice: జరిగించనివ్వండి
  rationale: మూడవ పురుష ఆజ్ఞార్థక బలాన్ని నిలుపుతూ, సహనం తన కార్యాన్ని పూర్తి చేయడానికి అడ్డుపడవద్దనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἵνα ἦτε
  choice: అప్పుడు ... ఉంటారు
  rationale: గ్రీకు పదబంధంలోని ఉద్దేశం/ఫలితం సంబంధాన్ని తెలుగులో స్పష్టంగా చూపిస్తుంది; ‘అప్పుడు’ ముందున్న ఆజ్ఞకు ఫలితాన్ని అనుసంధానిస్తుంది.
- source_word: τέλειοι
  choice: పరిణతి చెంది
  rationale: వ్యక్తుల విషయమై ఉద్దేశించిన పక్వతకు చేరడాన్ని సూచిస్తుంది; పాపరహిత పరిపూర్ణత అనే నిర్దిష్ట సిద్ధాంతార్థాన్ని బలవంతంగా చొప్పించదు.
- source_word: ὁλόκληροι
  choice: సంపూర్ణులుగా
  rationale: అన్ని భాగాల్లోనూ పూర్ణంగా, సమగ్రంగా ఉండే భావాన్ని వ్యక్తం చేస్తూ τέλειοι నుండి ఉన్న స్వల్ప భావభేదాన్ని కాపాడుతుంది.
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: ఏ విషయంలోనూ లోటులేకుండా
  rationale: ἐν μηδενί యొక్క సమగ్ర బలాన్నీ λειπόμενοι యొక్క కొరత లేదా లోటు భావాన్నీ సహజ తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక సంధానపదం లేకుండా వాక్య కొనసాగింపు
  rationale: ఇక్కడ δέ తీవ్రమైన వ్యతిరేకతను కాక ముందరి వాక్యాన్ని కొనసాగిస్తుంది. తెలుగు ప్రవాహంలో ప్రత్యేకంగా ‘అయితే’ లేదా ‘మరియు’ చేర్చకుండానే ఆ కొనసాగింపు స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: పరిశుద్ధీకరణ సందర్భంలో τέλειοι అర్థం
  choice: పరిణతి చెంది
  alternative: పరిపూర్ణులై
  rationale: యాకోబు సహనం కలిగించే ఉద్దేశిత పక్వతను, సమగ్రతను వర్ణిస్తున్నాడు. ‘పరిణతి’ ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; అదే సమయంలో ఈ జీవితంలో సంపూర్ణ పాపరాహిత్యాన్ని వాక్యం తప్పనిసరిగా బోధిస్తోందని ముందే నిర్ణయించదు.
- issue: ἔργον τέλειον లో τέλειον యొక్క భావం
  choice: పరిపూర్ణ కార్యం
  alternative: పూర్తి ఫలితం
  rationale: మూలంలోని ‘కార్యం’ రూపకాన్ని నిలుపుతూ, అది ఉద్దేశించిన ముగింపుకు చేరే భావాన్ని పాదటిప్పణి ద్వారా స్పష్టం చేస్తుంది. దీనివల్ల ‘పరిపూర్ణ’ అనే పదంలోని భావ ఉద్రిక్తతను పూర్తిగా తొలగించకుండా పాఠకుడికి అర్థం అందుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, లేఖన పఠనానికి తగిన గౌరవప్రదమైన శైలిలోనూ రూపొందించబడింది. ‘పరిణతి’ మరియు ‘సంపూర్ణులు’ ద్వారా మూలంలోని τέλειοι/ὁλόκληροι భావభేదం నిలుపబడింది.
