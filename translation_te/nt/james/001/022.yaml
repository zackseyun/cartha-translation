id: JAS.1.22
reference: James 1:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: te
  text: అయితే, వాక్యాన్ని ఆచరించేవారుగా ఉండండి; మిమ్మల్ని మీరు మోసగించుకుంటూ[a] కేవలం వినేవారుగా ఉండకండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మిమ్మల్ని మీరు భ్రమలో పడేసుకుంటూ,” లేదా “తప్పుడు తర్కంతో మిమ్మల్ని మీరు తప్పుదారి పట్టించుకుంటూ.”
    reason: παραλογιζόμενοι అనే పదంలో స్వీయమోసంతో పాటు తప్పుడు తర్కం ద్వారా తప్పుకు చేరడం అనే సూక్ష్మార్థం కూడా ఉంది.
lexical_decisions:
- source_word: Γίνεσθε
  choice: ఉండండి
  rationale: వర్తమానకాల ఆజ్ఞారూపం నిరంతర జీవన విధానానికి పిలుపునిస్తుంది. ‘ఉండండి’ సహజమైన తెలుగులో ఆ ఆజ్ఞాబలాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి ఉపదేశానికి కొనసాగింపుగా స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ ఈ సందర్భంలో సహజంగా ఉంది.
- source_word: ποιηταὶ
  choice: ఆచరించేవారుగా
  rationale: వాక్యం చెప్పేదాన్ని చేయడం అనే భావాన్ని సహజంగా తెలియజేస్తూ, ‘వినేవారు’ అనే పదంతో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: λόγου
  choice: వాక్యాన్ని
  rationale: యాకోబు 1:21లోని ‘నాటబడిన వాక్యం’తో భావసంబంధాన్ని నిలుపుతూ, సాధారణ సందేశం కంటే గ్రంథసంబంధ ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: ἀκροαταὶ μόνον
  choice: కేవలం వినేవారుగా
  rationale: ἀκροαταί అనే నామపద భావాన్నీ μόνον యొక్క పరిమితి భావాన్నీ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: παραλογιζόμενοι
  choice: మిమ్మల్ని మీరు మోసగించుకుంటూ
  rationale: తప్పుడు తర్కం వల్ల కలిగే స్వీయమోసం అనే ప్రధాన భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది; తర్కసంబంధ సూక్ష్మార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἑαυτούς
  choice: మిమ్మల్ని మీరు
  rationale: ప్రత్యావర్తక సర్వనామాన్ని సహజమైన తెలుగు రూపంలో నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యాకోబు 1:22లో λόγος యొక్క అర్థం
  choice: వాక్యం—దేవుని నుండి స్వీకరించిన వాక్కు/సందేశం అనే విస్తృత భావంతో
  alternative: సందేశం; బోధ
  rationale: 1:21లోని ‘నాటబడిన వాక్యం’తో కొనసాగింపును, బైబిలు సంబంధమైన భావగాంభీర్యాన్ని నిలుపుతుంది; దీనిని అనవసరంగా ఒక నిర్దిష్ట సిద్ధాంతార్థానికి పరిమితం చేయదు.
- issue: Γίνεσθε అనే ఆజ్ఞ యొక్క కాలబలం
  choice: ఆచరించేవారిగా నిరంతరం జీవించాలనే పిలుపు
  alternative: ఆచరించేవారిగా మారండి అనే ఆరంభార్థం
  rationale: వర్తమానకాల ఆజ్ఞ సాధారణంగా కొనసాగుతున్న ఆచరణను సూచిస్తుంది; ‘ఉండండి’ దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఆచరించేవారు—వినేవారు’ అనే మూలపాఠంలోని వ్యత్యాసాన్ని స్పష్టంగా నిలిపాం; కృదంతమైన παραλογιζόμενοι భావాన్ని ‘మోసగించుకుంటూ’గా ఉంచి వాక్య నిర్మాణ సంబంధాన్ని సాధ్యమైనంతవరకు కాపాడాం.
