id: JAS.1.19
reference: James 1:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: te
  text: 'నా ప్రియ సహోదరులారా[b], ఇది తెలుసుకోండి[a]: ప్రతి మనిషీ[c] వినడంలో త్వరగా, మాట్లాడడంలో నిదానంగా, కోపపడడంలో నిదానంగా ఉండాలి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా ప్రియ సహోదరులారా, మీకు ఇది తెలుసు.” గ్రీకు క్రియారూపాన్ని ఆజ్ఞార్థకంగా లేదా సూచనార్థకంగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “నా ప్రియ సహోదర సహోదరీలారా”; గ్రీకులో “సహోదరులు” అని ఉన్నా, యాకోబు విశ్వాస సమాజమంతటినీ ఉద్దేశించి మాట్లాడుతున్నట్లు ఉంది.
    reason: alternative_reading
  - marker: c
    text: లేదా, “ప్రతి వ్యక్తీ”; గ్రీకులోని ఏకవచన రూపం ఇక్కడ స్త్రీపురుషులందరికీ వర్తించే సామాన్యార్థంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴστε
  choice: ఇది తెలుసుకోండి
  rationale: ఈ క్రియారూపాన్ని ఆజ్ఞార్థకంగానూ సూచనార్థకంగానూ గ్రహించవచ్చు. వెంట వచ్చే ఉపదేశాల ప్రవాహానికి ఆజ్ఞార్థక అనువాదం సహజంగా సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: నా ప్రియ సహోదరులారా
  rationale: గ్రీకులోని ఆప్యాయ సంబోధనను గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగులో ప్రతిబింబిస్తుంది. వ్యాకరణపరమైన పుంలింగ బహువచనాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సమాజమంతటికీ వర్తించే భావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: ἔστω δὲ
  choice: ఉండాలి
  rationale: మూడవ పురుష ఆజ్ఞార్థక భావాన్ని తెలుగులో సహజమైన విధ్యర్థక నిర్మాణంతో వ్యక్తం చేస్తుంది. δέ స్వల్ప అనుసంధానక పదం కావడంతో ప్రత్యేకమైన బలమైన విరోధార్థక పదాన్ని చేర్చలేదు.
- source_word: πᾶς ἄνθρωπος
  choice: ప్రతి మనిషీ
  rationale: ఏ ఒక్కరినీ మినహాయించని ఏకవచన సామాన్యార్థాన్ని నిలుపుతుంది. ఇక్కడ ‘మనిషి’ పురుషులకు మాత్రమే కాక ప్రతి వ్యక్తికీ వర్తిస్తుంది.
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: వినడంలో త్వరగా
  rationale: వినడానికి వెంటనే సిద్ధపడే భావాన్ని, మూలంలోని ‘త్వరగా’ అనే సమాంతర పదరూపాన్ని నిలుపుతూ తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: మాట్లాడడంలో నిదానంగా
  rationale: మాట పలకడంలో తొందరపడకూడదనే ఉపదేశాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; తరువాతి పదబంధంతో సమాంతరతను కూడా నిలుపుతుంది.
- source_word: βραδὺς εἰς ὀργήν
  choice: కోపపడడంలో నిదానంగా
  rationale: ὀργή యొక్క కోపం అనే సాధారణ భావాన్ని అతిశయింపకుండా అందిస్తుంది; ‘నిదానంగా’ అనే పునరావృతంతో గ్రీకు వాక్య సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: Ἴστε క్రియారూపం ఆజ్ఞార్థకమా, సూచనార్థకమా
  choice: ‘ఇది తెలుసుకోండి’ అనే ఆజ్ఞార్థక పఠనం
  alternative: ‘మీకు ఇది తెలుసు’ అనే సూచనార్థక పఠనం
  rationale: రెండు విశ్లేషణలూ వ్యాకరణపరంగా సాధ్యమే. తరువాత వచ్చే ఆజ్ఞాత్మక ఉపదేశంతో ఆజ్ఞార్థక పఠనం బాగా కలుస్తుంది; అయినా మూలంలోని నిజమైన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
- issue: సంబోధనలోను సాధారణ ఉపదేశంలోను పుంలింగ రూపాల వ్యాప్తి
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులారా’, ‘ప్రతి మనిషీ’ అని ఉంచడం
  alternative: ‘సహోదర సహోదరీలారా’, ‘ప్రతి వ్యక్తీ’
  rationale: మూల గ్రీకులో పుంలింగ రూపాలు ఉన్నప్పటికీ అవి విశ్వాస సమాజమంతటికీ, ప్రతి వ్యక్తికీ ప్రతినిధి లేదా సామాన్యార్థంలో వర్తించగలవు. ప్రధాన పాఠ్యం రూపాన్ని నిలుపుతుండగా పాదటిప్పణులు దాని సమగ్ర వ్యాప్తిని స్పష్టం చేస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ఉపదేశ ధోరణిని ఉపయోగించాం. ‘వినడంలో త్వరగా / మాట్లాడడంలో నిదానంగా / కోపపడడంలో నిదానంగా’ అనే మూడు సమాంతర నిర్మాణాలు మూల వాక్యపు లయను, వ్యతిరేకతను కాపాడుతాయి.
