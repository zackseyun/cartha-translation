id: JAS.1.12
reference: James 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: te
  text: పరీక్షను[a] సహించే మనిషి ధన్యుడు. ఎందుకంటే, అతడు పరీక్షలో యోగ్యుడని తేలిన తరువాత, ఆయనను ప్రేమించేవారికి ఆయన వాగ్దానం చేసిన జీవకిరీటాన్ని[b] పొందుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శోధనను’ లేదా ‘ప్రలోభాన్ని’. గ్రీకు పదం పరీక్షను, పాపానికి ప్రలోభాన్ని రెండింటినీ సూచించగలదు; ఇక్కడి సందర్భం పరీక్షలో సహించడాన్ని ప్రధానంగా చూపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘కిరీటం’కు వాడిన గ్రీకు పదం రాజకిరీటాన్ని మాత్రమే కాక, విజేతకు ఇచ్చే పుష్పమాల లేదా విజయమాలను కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: ధన్యుడు
  rationale: ఆశీర్వాద వాక్యానికి తగిన భావగాంభీర్యాన్ని కాపాడుతుంది; కేవలం వ్యక్తిగత సంతోషాన్ని సూచించే పదం కంటే మూలానికి సమీపంగా ఉంది.
- source_word: ἀνὴρ
  choice: మనిషి
  rationale: గ్రీకులో పుంలింగ ఏకవచనం ఉన్నప్పటికీ ఇక్కడ ప్రతినిధాత్మక సాధారణ అర్థం ఉంది; ఆధునిక తెలుగులో ‘మనిషి’ సహజంగా ఆ రూపాన్నీ సాధారణ వర్తింపునీ నిలుపుతుంది.
- source_word: ὑπομένει
  choice: సహించే
  rationale: ఒత్తిడి లేదా కష్టంలో స్థిరంగా నిలిచి భరించడాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πειρασμόν
  choice: పరీక్షను
  rationale: ఈ సందర్భంలో సహనం, యోగ్యుడని తేలడం, ప్రతిఫలం ప్రధానంగా ఉన్నందున ‘పరీక్ష’ తగినది; శోధన/ప్రలోభం అనే అర్థసాధ్యతను పాదటిప్పణిలో నిలిపాం.
- source_word: δόκιμος γενόμενος
  choice: పరీక్షలో యోగ్యుడని తేలిన తరువాత
  rationale: పరీక్షను దాటి నిజమైనవాడిగా లేదా ఆమోదయోగ్యుడిగా నిరూపించబడే భావాన్నీ, కృదంతంలోని కాలసంబంధాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: λήμψεται
  choice: పొందుతాడు
  rationale: వాగ్దానం చేయబడిన ప్రతిఫలాన్ని భవిష్యత్తులో స్వీకరించడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: στέφανον
  choice: కిరీటాన్ని
  rationale: స్థిరపడిన బైబిలు ప్రయోగాన్ని నిలుపుతుంది; ఇది రాజకిరీటం కాక విజయమాల కావచ్చనే సాంస్కృతిక సూక్ష్మతను పాదటిప్పణి వివరిస్తుంది.
- source_word: τῆς ζωῆς
  choice: జీవకిరీటాన్ని
  rationale: ‘జీవపు కిరీటం’ అనే గ్రీకు షష్ఠీ సంబంధాన్ని తెలుగులో సహజమైన సమాసరూపంగా ఇస్తుంది; జీవమే కిరీటమా లేదా జీవానికి సంబంధించిన కిరీటమా అనే భావాన్ని విప్పి నిర్ణయించదు.
- source_word: ἐπηγγείλατο
  choice: వాగ్దానం చేసిన
  rationale: గ్రీకు అనిర్దిష్ట భూతకాలాన్ని సహజమైన తెలుగు భూతకాల కృదంతంతో ప్రతిబింబిస్తుంది; సందర్భానుసారం కర్త దేవుడు.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: తనను ప్రేమించేవారికి
  rationale: వర్తమాన కృదంతంలోని లక్షణాత్మక, కొనసాగుతున్న ప్రేమను సహజంగా తెలియజేస్తుంది; దత్తివును ‘వారికి’గా కాపాడుతుంది.
theological_decisions:
- issue: యాకోబు 1:12లో πειρασμός యొక్క భావం
  choice: పరీక్ష
  alternative: శోధన లేదా ప్రలోభం
  rationale: తక్షణ సందర్భంలో సహించడం, పరీక్షలో యోగ్యుడని తేలడం, జీవకిరీటం పొందడం ప్రధానంగా ఉన్నాయి. అయినా గ్రీకు పదంలోని పరీక్ష/ప్రలోభం రెండర్థాల ఉద్రిక్తతను పాదటిప్పణిలో ఉంచాం.
- issue: ἐπηγγείλατο అనే క్రియకు స్పష్టంగా చెప్పని కర్త
  choice: ‘ఆయన’ అని ఉంచి, సందర్భానుసారం దేవుణ్ణి సూచించేలా అనువదించడం
  alternative: ‘దేవుడు వాగ్దానం చేసిన’ అని స్పష్టీకరించడం
  rationale: మూలంలో ‘దేవుడు’ అనే నామవాచకం లేదు. ‘ఆయన’ మూలంలోని అనాఫోరిక అస్పష్టతను ఎక్కువగా కాపాడుతూ తెలుగులో వాక్యాన్ని సహజంగా చేస్తుంది.
- issue: τῆς ζωῆς అనే షష్ఠీ సంబంధం
  choice: జీవకిరీటం
  alternative: జీవమే అయిన కిరీటం / జీవాన్ని ఇచ్చే కిరీటం
  rationale: మూలంలోని షష్ఠీ సంబంధాన్ని వ్యాఖ్యానాత్మకంగా ఒకే విధంగా నిర్ణయించకుండా సంక్షిప్తంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని ఆశీర్వాద వాక్య గాంభీర్యాన్ని ‘ధన్యుడు’తో నిలిపి, పరీక్ష/ప్రలోభం భావవ్యాప్తినీ జీవకిరీటం అనే రూపకాన్నీ అతివ్యాఖ్యానం చేయకుండా కాపాడాం.
