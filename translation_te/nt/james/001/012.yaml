    rationale: In Telugu, తనను normally functions reflexively and can be taken as referring back to the main subject, ‘మనిషి.’ The Greek αὐτόν in this clause refers to the promiser, whose identity is contextually God. ‘ఆయనను’ preserves the intended referent without inserting the noun ‘దేవుడు’ into the text.
