id: JAS.1.6
reference: James 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: te
  text: అయితే అతడు విశ్వాసంతో[a], ఏమాత్రం సందేహించకుండా అడగాలి. ఎందుకంటే సందేహించేవాడు గాలికి నెట్టబడుతూ, అటూ ఇటూ కొట్టుకుపోతున్న సముద్రపు అలవంటివాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నమ్మకంతో.’ ఇక్కడి గ్రీకు పదం దేవునిపై నమ్మకంతో ఆధారపడే భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: అడగాలి
  rationale: మూడవ పురుష వర్తమాన ఆజ్ఞార్థక రూపంలోని ప్రబోధక బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ముందటి వచనంలో దేవుని దగ్గర జ్ఞానం అడగడమే సందర్భం.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వచనంలోని వాగ్దానం నుండి అడిగే విధానానికి వచ్చే స్వల్ప వ్యత్యాసాన్ని, కొనసాగింపును సహజంగా సూచిస్తుంది.
- source_word: ἐν πίστει
  choice: విశ్వాసంతో
  rationale: గ్రీకు విభక్తి ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, దేవునిపై నమ్మకంతో ఆధారపడే భావాన్ని నిలుపుతుంది.
- source_word: μηδὲν διακρινόμενος
  choice: ఏమాత్రం సందేహించకుండా
  rationale: μηδέν యొక్క సంపూర్ణ నిరాకరణను, διακρίνομαι ఇక్కడ సూచించే అంతర్గత సందేహం లేదా ఊగిసలాటను స్పష్టంగా అందిస్తుంది.
- source_word: ὁ γὰρ διακρινόμενος
  choice: ఎందుకంటే సందేహించేవాడు
  rationale: పుంలింగ రూపాన్ని అనవసరంగా లింగ-నిర్దిష్టం చేయకుండా, సాధారణ వ్యక్తిని సూచించే గ్రీకు substantival participle భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἔοικεν
  choice: వంటివాడు
  rationale: పోలికను సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κλύδωνι θαλάσσης
  choice: సముద్రపు అల
  rationale: κλύδων యొక్క సముద్రపు ఉప్పెన లేదా అల అనే సజీవ చిత్రాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: ἀνεμιζομένῳ
  choice: గాలికి నెట్టబడుతూ
  rationale: గాలి చేత కదిలించబడుతున్న నిష్క్రియ భావాన్ని, అస్థిరత చిత్రాన్ని నిలుపుతుంది.
- source_word: ῥιπιζομένῳ
  choice: అటూ ఇటూ ఎగసిపడే
  rationale: గాలి తాకిడికి అల అల్లకల్లోలంగా కదిలే దృశ్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; కేవలం మొదటి క్రియను పునరుక్తి చేయదు.
theological_decisions:
- issue: ప్రార్థనా సందర్భంలో πίστις అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం
  rationale: ప్రధాన పాఠ్యంలో πίστις యొక్క విస్తృతమైన ధార్మిక అనుసంధానాన్ని నిలుపుతూ ‘విశ్వాసం’ వాడబడింది. ఈ సందర్భంలో దేవునిపై నమ్మకంతో ఆధారపడటం అనే భావం కూడా ఉండటంతో దానిని పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఉంచాం.
- issue: διακρινόμενος యొక్క సందర్భార్థం
  choice: సందేహించేవాడు
  alternative: ఊగిసలాడేవాడు
  rationale: ఈ వాక్యంలోని అల ఉపమానం అంతర్గత అస్థిరతను సూచించినప్పటికీ, పదానికి ఇక్కడ సహజమైన ప్రధాన భావం ‘సందేహించడం.’ ప్రత్యామ్నాయంలోని ఊగిసలాట భావాన్ని ప్రధాన పాఠ్యం నిశ్శబ్దంగా తొలగించకుండా, వాక్యంలోని అల చిత్రమే దానిని మోస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ఆజ్ఞార్థక భావానికి ‘అడగాలి’ వాడి, సముద్రపు అల ఉపమానాన్ని సజీవంగా ఉంచాం. పాదటిప్పణి గుర్తు [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
