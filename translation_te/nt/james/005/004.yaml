id: JAS.5.4
reference: James 5:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: te
  text: ఇదిగో, మీ పొలాల్లో పంట కోసిన పనివారికి ఇవ్వకుండా మీరు నిలిపివేసిన కూలి మొరపెడుతోంది. కోత కోసినవారి కేకలు సైన్యాల ప్రభువు[a] చెవుల్లోకి ప్రవేశించాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సబాఓత్ ప్రభువు.” గ్రీకు పాఠ్యం హీబ్రూ దైవిక బిరుదైన Σαβαώθ అనే రూపాన్ని లిప్యంతరీకరించి ఉంచింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని బలంగా ఆకర్షించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: μισθὸς
  choice: కూలి
  rationale: వ్యవసాయ పనివారికి చెల్లించవలసిన ప్రతిఫలాన్ని సందర్భానుకూలంగా సూచిస్తుంది; గ్రీకులోని ఏకవచన సమష్టి భావాన్ని కూడా నిలుపుతుంది.
- source_word: ἐργατῶν
  choice: పనివారు
  rationale: వ్యవసాయ సందర్భానికి సరిపోయే, సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక పదం.
- source_word: ἀμησάντων τὰς χώρας ὑμῶν
  choice: మీ పొలాల్లో పంట కోసిన
  rationale: కోత కోయడం అనే వ్యవసాయ చర్యను, χώρας సూచించే సాగుభూములను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ ἀφυστερημένος ἀφ’ ὑμῶν
  choice: ఇవ్వకుండా మీరు నిలిపివేసిన
  rationale: చెల్లించాల్సిన కూలిని యజమానులు తమవద్దే అన్యాయంగా ఉంచుకున్నారనే ప్రత్యక్ష ఆరోపణను వ్యక్తం చేస్తుంది; ‘మోసం చేసిన’ అని మరీ వ్యాఖ్యానాత్మకంగా విస్తరించదు.
- source_word: κράζει
  choice: మొరపెడుతోంది
  rationale: చెల్లించని కూలిని వ్యక్తీకరించి, న్యాయం కోసం అది కేక వేస్తున్న చిత్రాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: βοαὶ
  choice: కేకలు
  rationale: సహాయం లేదా న్యాయం కోసం చేసే తీవ్రమైన అరుపులను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: θερισάντων
  choice: కోత కోసినవారు
  rationale: పంట కోత పనిలో పాల్గొన్న వారిని సహజంగా, సంక్షిప్తంగా సూచిస్తుంది.
- source_word: εἰς τὰ ὦτα
  choice: చెవుల్లోకి
  rationale: గ్రీకు వాక్యంలోని సజీవమైన సెమిటిక్ రూపకాన్ని సరళీకరించకుండా నిలుపుతుంది.
- source_word: Κυρίου Σαβαὼθ
  choice: సైన్యాల ప్రభువు
  rationale: దేవునికి ఉపయోగించిన ఈ పాత నిబంధన నేపథ్యపు బిరుదు అర్థాన్ని ఆధునిక పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: εἰσεληλύθασιν
  choice: ప్రవేశించాయి
  rationale: కేకలు ప్రభువు చెవుల్లోకి చేరి, ఇప్పుడు ఆయన ఎదుట ఉన్నాయనే సంపూర్ణ కాల భావాన్నీ మూలంలోని ప్రవేశ రూపకాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: Κυρίου Σαβαὼθ అనే దైవిక బిరుదు అనువాదం
  choice: సైన్యాల ప్రభువు
  alternative: సబయోతు ప్రభువు
  rationale: Σαβαώθ హీబ్రూ మూలం నుంచి వచ్చిన దైవిక బిరుదు. ప్రధాన పాఠ్యంలో దాని అర్థాన్ని అనువదించడం సాధారణ పాఠకులకు స్పష్టతనిస్తుంది; గ్రీకులో నిలిచిన లిప్యంతరీకృత రూపాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. చెల్లించని కూలి మొరపెడుతుందనే వ్యక్తీకరణను, కేకలు ప్రభువు చెవుల్లోకి ప్రవేశించాయనే మూల రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపింది.
