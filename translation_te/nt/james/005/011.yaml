id: JAS.5.11
reference: James 5:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: te
  text: ఇదిగో, సహనంతో నిలిచినవారిని ధన్యులని మనం అంటాం. యోబు సహనం గురించి మీరు విన్నారు; ప్రభువు కలిగించిన అంతిమ ఫలితాన్ని మీరు చూశారు.[a] ప్రభువు ఎంతో కనికరంగలవాడు, కరుణామయుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ప్రభువు ఉద్దేశాన్ని.” మూలభాషలోని పదబంధం ప్రభువు కలిగించిన చివరి ఫలితాన్ని లేదా ఆయన ఉద్దేశాన్ని సూచించవచ్చు.'
    reason: τὸ τέλος κυρίου అనే గ్రీకు పదబంధంలో ఉన్న నిజమైన అర్థసంభావ్యతను పాఠకునికి తెలియజేయడానికి.
lexical_decisions:
- source_word: ὑπομείναντας / ὑπομονήν
  choice: సహనంతో నిలిచినవారిని / సహనం
  rationale: కష్టాల మధ్య ఓర్పుతో స్థిరంగా కొనసాగడాన్ని సూచించే మూలపద భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μακαρίζομεν
  choice: ధన్యులని మనం అంటాం
  rationale: వారిని దేవుని అనుగ్రహం పొందినవారిగా గుర్తించి ప్రకటించే భావాన్ని వ్యక్తం చేస్తుంది; కేవలం ‘సంతోషవంతులు’ అనే అర్థానికి పరిమితం చేయదు.
- source_word: τὸ τέλος κυρίου
  choice: ప్రభువు కలిగించిన అంతిమ ఫలితం
  rationale: యోబు కథ చివర్లో ప్రభువు కలిగించిన పరిణామాన్ని సందర్భానుసారంగా తెలియజేస్తుంది. మూలంలోని సంబంధబోధక నిర్మాణానికి ఉన్న ఇతర సాధ్యార్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: πολύσπλαγχνος
  choice: ఎంతో కనికరంగలవాడు
  rationale: లోతైన అంతరంగ కనికరాన్ని సూచించే బలమైన గ్రీకు విశేషణాన్ని ప్రతిబింబిస్తుంది.
- source_word: οἰκτίρμων
  choice: కరుణామయుడు
  rationale: దయ చూపే స్వభావాన్ని గౌరవప్రదమైన, సాధారణ తెలుగు పదంతో తెలియజేస్తుంది.
theological_decisions:
- issue: τὸ τέλος κυρίου అనే పదబంధంలోని భావం
  choice: ప్రభువు కలిగించిన అంతిమ ఫలితం
  alternative: ప్రభువు ఉద్దేశం / ప్రభువు యొక్క ముగింపు
  rationale: యోబు ప్రస్తావనలో దేవుడు చివరికి కలిగించిన పరిణామం ప్రధాన భావంగా కనిపిస్తుంది. అయితే τέλος అంటే ‘ముగింపు’, ‘ఫలితం’, లేదా సందర్భానుసారంగా ‘ఉద్దేశం’ కావచ్చు కాబట్టి ఆ అనిశ్చితిని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఇదిగో’ ద్వారా ἰδού యొక్క శ్రద్ధాకర్షక స్వరాన్ని నిలిపాం; ‘సహనంతో నిలిచినవారు’ ద్వారా కేవలం నిష్క్రియ ఓర్పు కాక కష్టాల్లో స్థిరంగా కొనసాగడాన్ని వ్యక్తం చేశాం.
