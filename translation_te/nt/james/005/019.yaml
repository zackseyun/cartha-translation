lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: నా సహోదరులారా
  rationale: నేరుగా సంబోధించే పుంలింగ బహువచన రూపాన్ని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా సహజమైన సంబోధనను వాడింది. సందర్భంలో ఇది విశ్వాస సమాజమంతటినీ కలుపుకోవచ్చు.
- source_word: ἐάν τις ἐν ὑμῖν
  choice: మీలో ఎవరైనా
  rationale: ἐάν యొక్క షరతును, τις యొక్క అనిర్దిష్ట ఏకవచన భావాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: πλανηθῇ
  choice: తప్పిపోయి
  rationale: ఈ సందర్భంలో సత్యం నుండి దారి తప్పడం అనే భావాన్ని సహజంగా అందిస్తుంది; గ్రీకు నిష్క్రియ రూపం మోసపోవడం లేదా తప్పుదారి పట్టించబడడం అనే ఛాయను కూడా అనుమతిస్తుంది, కాబట్టి దానిని పాదటిప్పణిలో నిలిపాం.
- source_word: ἀπὸ τῆς ἀληθείας
  choice: సత్యం నుండి
  rationale: గ్రీకు విభక్తి సంబంధాన్ని నేరుగా నిలుపుతుంది; ‘సత్యం’ను సువార్త లేదా క్రైస్తవ జీవనమార్గం అని అనువాదంలో అతిగా నిర్దిష్టం చేయదు.
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: మరొకరు అతన్ని తిరిగి మళ్లిస్తే
  rationale: ἐπιστρέφω లోని తిరిగి తిప్పడం/మళ్లించడం అనే రూపకాన్ని నిలుపుతుంది; τις ను ‘మరొకరు’గా, αὐτόν లోని ఏకవచన పుంలింగ సూచనను ‘అతన్ని’గా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: సంబోధనలో లింగ సూచన
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులారా’ అనే పుంలింగ రూపాన్ని నిలుపడం
  alternative: సహోదర సహోదరీలారా
  rationale: గ్రీకు పాఠ్యంలో పుంలింగ బహువచన సంబోధన ఉంది; అది సమాజమంతటినీ సూచించే అవకాశం ఉన్నందున ఆ సమగ్ర భావాన్ని పాదటిప్పణిలో తెలిపాం, కానీ ప్రధాన పాఠ్యంలో మూలరూపాన్ని నిలిపాం.
- issue: πλανηθῇ యొక్క కర్తృత్వ ఛాయ
  choice: ‘తప్పిపోయి’
  alternative: తప్పుదారి పట్టించబడి; మోసపోయి
  rationale: ఈ నిష్క్రియ రూపం స్వయంగా దారి తప్పడం, మోసపోవడం, తప్పుదారి పట్టించబడడం వంటి భావ ఛాయలను మోయగలదు. ప్రధాన పాఠ్యం సహజమైన సందర్భార్థాన్ని ఇస్తూ, ప్రత్యామ్నాయ ఛాయలను పాదటిప్పణిలో సంరక్షిస్తుంది.
- issue: ἐπιστρέψῃ యొక్క భావం
  choice: ‘తిరిగి మళ్లిస్తే’
  alternative: తిరిగి తీసుకొస్తే
  rationale: తప్పిపోయిన వ్యక్తిని సత్యం వైపు తిరిగి తిప్పే రూపకాన్ని నిలుపుతుంది; మార్పు ఎలా జరుగుతుందో లేదా దానికి ఎవరి శక్తి కారణమో పాఠ్యానికి మించి నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర కామాను నిలిపాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
