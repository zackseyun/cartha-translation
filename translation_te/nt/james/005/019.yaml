  language: en
  yaml_path: translation/nt/james/005/019.yaml
  text: My brothers[a], if anyone among you wanders from the truth and someone turns him back[c][b],
translation:
  language: te
  text: నా సహోదరులారా[a], మీలో ఎవరైనా సత్యం నుండి తప్పిపోయి[b], ఎవరో ఒకరు అతన్ని తిరిగి మళ్లిస్తే[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా సహోదర సహోదరీలారా’; గ్రీకులో పుంలింగ బహువచన సంబోధన ఉన్నప్పటికీ, అది సమాజమంతటినీ చేర్చగలదు.
