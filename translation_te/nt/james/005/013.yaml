    issue: Generic singular reference is expressed as 'వారు'.
    rationale: Although increasingly used as gender-neutral reference, 'వారు' is ordinarily plural or honorific in modern standard Telugu and can momentarily suggest multiple persons. 'ఆ వ్యక్తి' unambiguously maintains the representative singular of τις with the third-singular imperatives.
  - severity: low
    issue: Main rendering 'స్తుతిగీతాలు పాడాలి' narrows ψαλλέτω slightly.
    rationale: The Greek may refer to psalms or broader praise-song/melodic praise. 'స్తుతి పాడాలి' is idiomatic Telugu and leaves the genre unspecified; the footnote preserves the specific 'psalms' possibility.
