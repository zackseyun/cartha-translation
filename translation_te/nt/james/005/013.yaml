  yaml_path: translation/nt/james/005/013.yaml
  text: Is anyone among you suffering? Let him pray[a]. Is anyone cheerful? Let him sing praise.
translation:
  language: te
  text: మీలో ఎవరైనా కష్టాలు అనుభవిస్తున్నారా? ఆ వ్యక్తి ప్రార్థించాలి. ఎవరైనా ఉల్లాసంగా ఉన్నారా? ఆ వ్యక్తి స్తుతి పాడాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కీర్తనలు పాడాలి”; గ్రీకు క్రియ ప్రత్యేకంగా కీర్తనలు పాడడాన్ని లేదా విస్తృతంగా స్తుతి పాడడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: కష్టాలు అనుభవిస్తున్నారా
  rationale: κακοπαθέω అనేది కేవలం అనారోగ్యం లేదా హింసకు పరిమితం కాకుండా కష్టం, బాధ, ప్రతికూల పరిస్థితులు అనుభవించడాన్ని సూచిస్తుంది. ఈ విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τις
  choice: ఎవరైనా
  rationale: అనిర్దిష్ట ఏకవచన సర్వనామంలోని సాధారణ, లింగభేదరహిత భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: సంబోధించబడుతున్న సమాజంలో ఆ వ్యక్తి ఉన్నాడనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలుపుతుంది.
- source_word: προσευχέσθω
  choice: వారు ప్రార్థించాలి
  rationale: మూడవ పురుష ఏకవచన ఆజ్ఞార్థక భావాన్ని తెలుగులో గౌరవ/లింగభేదరహిత ఏకవచన ప్రయోగంతో స్పష్టమైన ప్రబోధంగా వ్యక్తం చేస్తుంది.
- source_word: εὐθυμεῖ
  choice: ఉల్లాసంగా ఉన్నారా
  rationale: εὐθυμέω లోని మంచి మనోస్థితి, ధైర్యం లేదా సంతోషభరితమైన స్థితిని సందర్భానుకూలంగా తెలియజేస్తుంది.
- source_word: ψαλλέτω
  choice: స్తుతిగీతాలు పాడాలి
  rationale: ψάλλω ఇక్కడ దేవునికి గానంతో స్తుతి చెల్లించడాన్ని సూచిస్తుంది. ఇది ప్రత్యేకంగా కీర్తనలు పాడటాన్ని కూడా సూచించవచ్చు; ఆ భావసాధ్యతను పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: సాధారణార్థక ఏకవచన ఆజ్ఞలు
  choice: లింగభేదరహిత గౌరవ ఏకవచనమైన ‘వారు ... చేయాలి’
  alternative: ‘అతడు ... చేయాలి’ లేదా బహువచనంగా మార్చడం
  rationale: గ్రీకులో τις తో ఏకవచన ఆజ్ఞలు ఉన్నప్పటికీ ఉద్దేశం ఏ లింగానికైనా చెందిన వ్యక్తి. తెలుగు గౌరవ ఏకవచన ‘వారు’ సంఖ్యను భావపరంగా నిలుపుతూ అనవసర పురుష పరిమితిని నివారిస్తుంది.
- issue: ψαλλέτω యొక్క పరిధి
  choice: స్తుతిగీతాలు పాడాలి
  alternative: కీర్తనలు పాడాలి
  rationale: పదం కీర్తనలు పాడటాన్ని ప్రత్యేకంగా సూచించగలిగినా, ఈ సందర్భంలో దేవునికి గానస్తుతి అనే విస్తృత భావం సహజంగా సరిపోతుంది. ఒక నిర్దిష్ట ఆరాధనా పద్ధతిని వాక్యంలోకి దిగుమతి చేయకుండా సంకుచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ప్రశ్న–ప్రబోధ నిర్మాణాన్ని, రెండు పరిస్థితుల మధ్య సమాంతరతను నిలుపుకుంది. ‘వారు’ ఇక్కడ గౌరవ/లింగభేదరహిత ఏకవచనంగా వాడబడింది.
