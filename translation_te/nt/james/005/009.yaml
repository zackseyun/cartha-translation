id: JAS.5.9
reference: James 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: te
  text: సోదరులారా,[a] ఒకరిపై ఒకరు సణుగుకోవద్దు; మీరు తీర్పు పొందకుండునట్లు. ఇదిగో, న్యాయాధిపతి తలుపుల ముందు నిలిచి ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సోదరులారా’ అనేది గ్రీకు పదమైన ἀδελφοίకి అనువాదం; సందర్భానుసారం ఇది స్త్రీలతో సహా తోటి విశ్వాసులందరినీ ఉద్దేశించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: στενάζετε
  choice: సణుగుకోవద్దు
  rationale: κατ’ ἀλλήλων అనే పరస్పర వ్యతిరేక భావంతో కలిసి, ఇది కేవలం లోలోపల మూలుగడాన్ని కాక తోటి విశ్వాసులపై అసంతృప్తితో ఫిర్యాదు చేయడాన్ని సూచిస్తుంది. ‘సణుగుకోవద్దు’ ఆ నైతిక, పరస్పర సంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు సంబోధన బహువచనంలోని రూపాన్ని గౌరవిస్తూ ‘సోదరులారా’ అని అనువదించాం; సందర్భానుసారం ఇది స్త్రీలతో సహా తోటి విశ్వాసుల సమూహాన్ని ఉద్దేశించగలదని పాదసూచికలో స్పష్టం చేశాం.
- source_word: κατ’ ἀλλήλων
  choice: ఒకరిమీద ఒకరు
  rationale: κατά + షష్ఠీ విభక్తి ఇక్కడ పరస్పరం వ్యతిరేకంగా ప్రవర్తించడం లేదా ఫిర్యాదు చేయడం అనే భావాన్ని ఇస్తుంది. ‘ఒకరిమీద ఒకరు’ ఆ దిశాత్మక విరోధాన్ని తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: κριθῆτε
  choice: మీరు తీర్పు పొందరు
  rationale: κρίνω యొక్క కర్మణి ప్రయోగాన్ని ‘తీర్పు పొందడం’గా ఉంచాం. ‘శిక్షకు గురికావడం’ అని చెప్పడం ఫలితాన్ని అతిగా నిర్దిష్టం చేస్తుంది; మూలంలో తీర్పు మాత్రమే పేర్కొనబడింది.
- source_word: κριτὴς
  choice: న్యాయాధిపతి
  rationale: ఇది అంత్యకాలపు దైవిక న్యాయాధిపతిని సూచిస్తుంది. అయితే ఆయనను మూలం కంటే స్పష్టంగా ‘ప్రభువు’ లేదా ‘క్రీస్తు’ అని గుర్తించకుండా నామవాచకాన్నే నిలిపాం.
- source_word: πρὸ τῶν θυρῶν
  choice: తలుపుల ముందు
  rationale: మూలంలోని θυρῶν బహువచనాన్ని నిలుపుతూ, సమీపత్వం మరియు ఆసన్నతను సూచించే రూపకాన్ని ‘తలుపుల ముందు’గా అనువదించాం.
- source_word: ἕστηκεν
  choice: నిలిచి ఉన్నాడు
  rationale: పరిపూర్ణ కాలరూపం గతంలో స్థానాన్ని తీసుకొని ప్రస్తుతం సిద్ధంగా నిలిచి ఉన్న స్థితిని సూచిస్తుంది. ‘నిలిచి ఉన్నాడు’ ఈ కొనసాగుతున్న ప్రస్తుత స్థితిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘న్యాయాధిపతి’ ఎవరిని సూచిస్తున్నాడు?
  choice: అంత్యకాలపు దైవిక న్యాయాధిపతి; సందర్భంలో అత్యంత సహజంగా ప్రభువు/క్రీస్తు
  alternative: సాధారణంగా న్యాయాధిపతియైన దేవుడు
  rationale: యాకోబులోని ప్రభువు రాకడ మరియు ఆసన్న తీర్పు సందర్భం ఈ సూచనకు బలం ఇస్తుంది. అయినా గ్రీకు పాఠం ‘న్యాయాధిపతి’ అని మాత్రమే చెప్పేందున, అనువాదం ఆ వ్యక్తిని మరింత నిర్దిష్టంగా గుర్తించకుండా మూలంలోని theological tensionను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘సణుగుకోవద్దు’ ద్వారా పరస్పర అసంతృప్తి/ఫిర్యాదు భావం, ‘తలుపుల ముందు’ ద్వారా మూలంలోని బహువచనం, ‘నిలిచి ఉన్నాడు’ ద్వారా పరిపూర్ణ కాలపు ప్రస్తుత స్థితి నిలుపబడ్డాయి.
