review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prohibition, its interpersonal direction, the Judge, plural ‘doors,’ and the Judge’s present standing. However, ‘అప్పుడు’ (“then”) renders the ἵνα μή clause as a temporal consequence rather than its stated purpose/result (“so that ... not”), and ‘పొందరు’ is more indicative than the Greek subjunctive.
  naturalness: ‘సోదరులారా’ and ‘న్యాయాధిపతి’ are clear and suitably respectful in modern standard Telugu. ‘ఒకరిమీద ఒకరు సణుగుకోవద్దు’ is understandable, but ‘ఒకరిపై ఒకరు’ is the more natural standard expression for complaint directed against others.
  terminology: ‘సణుగుకోవద్దు’ appropriately captures resentful grumbling rather than merely inward groaning. ‘న్యాయాధిపతి’ preserves the Greek title without identifying the referent beyond the text. The footnote appropriately explains the collective scope of ἀδελφοί.
  issues:
  - severity: medium
    issue: The purpose clause is rendered with ‘అప్పుడు’ and an indicative outcome.
    rationale: ἵνα μὴ κριθῆτε means “so that you may not be judged,” not simply “then you will not receive judgment.” Recasting it with ‘...కుండునట్లు’ preserves the clause’s purpose/result force and avoids making an unqualified predictive statement.
  - severity: low
    issue: The directional phrase can be more idiomatic.
    rationale: For interpersonal complaint, ‘ఒకరిపై ఒకరు’ is more natural modern standard Telugu than ‘ఒకరిమీద ఒకరు,’ while retaining κατ’ ἀλλήλων (“against one another”).
  revised_text: సోదరులారా,[a] ఒకరిపై ఒకరు సణుగుకోవద్దు; మీరు తీర్పు పొందకుండునట్లు. ఇదిగో, న్యాయాధిపతి తలుపుల ముందు నిలిచి ఉన్నాడు.
