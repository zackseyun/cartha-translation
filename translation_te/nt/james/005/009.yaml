  to: సోదరులారా,[a] ఒకరిపై ఒకరు సణుగుకోవద్దు; మీరు తీర్పు పొందకుండునట్లు. ఇదిగో, న్యాయాధిపతి తలుపుల ముందు నిలిచి ఉన్నాడు.
  rationale: The revision preserves the draft’s sound lexical choices while correcting the syntax of ἵνα μὴ κριθῆτε with a Telugu purpose construction. It also makes the reciprocal hostile direction more idiomatic. The Judge’s identity remains unstated beyond the Greek, and the plural ‘doors’ and perfect-state sense of ἕστηκεν are retained.
