revisions:
- from: ఏలీయా మనలాగే మానవ స్వభావం గలవాడు[a]. వర్షం కురవకూడదని అతడు పట్టుదలగా ప్రార్థించాడు; అప్పుడు దేశం మీద మూడు సంవత్సరాల ఆరు నెలలు వర్షం కురవలేదు.
  to: ఏలీయా మనలాగే మానవ స్వభావం గల మనిషి[a]. వర్షం కురవకూడదని అతడు మనస్ఫూర్తిగా ప్రార్థించాడు; మరియు దేశంలో మూడు సంవత్సరాల ఆరు నెలలు వర్షం కురవలేదు.
