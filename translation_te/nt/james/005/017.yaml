id: JAS.5.17
reference: James 5:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: te
  text: ఏలీయా మనలాగే మానవ స్వభావం గల మనిషి[a]. వర్షం కురవకూడదని అతడు మనస్ఫూర్తిగా ప్రార్థించాడు; మరియు దేశంలో మూడు సంవత్సరాల ఆరు నెలలు వర్షం కురవలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏలీయా మనలాంటి మనిషే”; లేదా, “ఏలీయాకు కూడా మనలాంటి భావాలు, వాంఛలు ఉండేవి.”
    reason: ὁμοιοπαθὴς అనే పదం సమానమైన మానవ స్థితిని విస్తృతంగా సూచించవచ్చు; భావాలు లేదా వాంఛల సారూప్యతను ప్రత్యేకంగా సూచించే అర్థం కూడా సాధ్యమే.
lexical_decisions:
- source_word: Ἠλίας
  choice: ఏలీయా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ప్రవక్త పేరు.
- source_word: ἄνθρωπος
  choice: మానవ స్వభావం గలవాడు
  rationale: ఏలీయా పురుషుడని వ్యాకరణపరంగా సూచిస్తూనే, అతడు సాధారణ మానవుడనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: మనలాగే మానవ స్వభావం గలవాడు
  rationale: మనతో సమానమైన మానవ స్థితి, అనుభవాలు కలవాడనే విస్తృత భావాన్ని నిలుపుతుంది; కేవలం భావోద్వేగాలకు మాత్రమే పరిమితం చేయదు.
- source_word: προσευχῇ προσηύξατο
  choice: పట్టుదలగా ప్రార్థించాడు
  rationale: మూలంలోని సమానధాతు నిర్మాణం ప్రార్థనను బలంగా నొక్కిచెబుతుంది. ‘పట్టుదలగా’ అనేది తీవ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τοῦ μὴ βρέξαι
  choice: వర్షం కురవకూడదని
  rationale: ప్రార్థనలో కోరిన విషయాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οὐκ ἔβρεξεν
  choice: వర్షం కురవలేదు
  rationale: గ్రీకు క్రియకు సందర్భానుకూలమైన సహజ తెలుగు రూపం.
- source_word: ἐπὶ τῆς γῆς
  choice: దేశం మీద
  rationale: ఏలీయా కథనంలోని కరవు సంభవించిన భూభాగాన్ని సూచిస్తుంది; అనవసరంగా ప్రపంచమంతటినీ సూచించే భావాన్ని నివారిస్తుంది.
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: మూడు సంవత్సరాల ఆరు నెలలు
  rationale: కరవు కొనసాగిన కాలవ్యవధిని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఏలీయా మానవత్వానికి సంబంధించి ὁμοιοπαθὴς అనే పదం భావం
  choice: ఏలీయా పాఠకులవలెనే మానవ స్వభావం, స్థితి గల సాధారణ మానవుడని చూపించడం
  alternative: ఏలీయాకు మనలాంటి భావోద్వేగాలు లేదా వాంఛలు ఉండేవని మాత్రమే చెప్పడం
  rationale: విశ్వాసులను ప్రోత్సహించేందుకు ఏలీయా కూడా వారిలాంటి మానవుడేనని వాక్యం నొక్కిచెబుతుంది. అనువాదం ఈ విస్తృత భావాన్ని నిలుపుతూ, దానిని భావోద్వేగాలకు మాత్రమే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ప్రార్థనా తీవ్రతను ‘పట్టుదలగా’ అని, γῆ యొక్క సందర్భానుకూల భావాన్ని ‘దేశం’ అని అందించింది.
