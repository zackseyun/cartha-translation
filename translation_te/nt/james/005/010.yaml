id: JAS.5.10
reference: James 5:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑπόδειγμα λάβετε, ⸀ἀδελφοί, τῆς κακοπαθίας καὶ τῆς μακροθυμίας τοὺς προφήτας, οἳ ἐλάλησαν ⸀ἐν τῷ ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: te
  text: సోదరులారా[a], ప్రభువు నామంలో మాట్లాడిన ప్రవక్తలను బాధలను అనుభవించడంలోను సహనంలోను ఆదర్శంగా తీసుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సోదరులారా’ అనేది పుంలింగ బహువచనమైన ἀδελφοίకు అనువాదం; ఈ సందర్భంలో యాకోబు స్త్రీలతో సహా విశ్వాస సమాజమంతటినీ ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: ఆదర్శంగా
  rationale: అనుసరించదగిన ఉదాహరణ లేదా నమూనా అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λάbετε
  choice: తీసుకోండి
  rationale: λαμβάνω అనే ఆజ్ఞార్థక క్రియకు నేరమైన సమానార్థకం; ‘ఆదర్శంగా తీసుకోండి’ అనే నిర్మాణంలో గ్రీకు భావం సహజంగా వ్యక్తమవుతుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకులోని పుంలింగ బహువచన సంబోధనను ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భంలోని సమగ్ర వర్తింపును పాదసూచిక వివరిస్తుంది.
- source_word: κακοπαθίας
  choice: బాధను సహించడంలో
  rationale: కేవలం బాధ అనే స్థితికన్నా కష్టానుభవాన్ని భరించడం అనే సందర్భోచిత భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: μακροθυμίας
  choice: దీర్ఘశాంతి చూపడంలో
  rationale: μακροθυμίαలోని దీర్ఘకాల సహనం, ఓర్పు భావాన్ని ‘దీర్ఘశాంతి’ కాపాడుతుంది; క్రియాత్మక తెలుగు కోసం ‘చూపడంలో’ జోడించబడింది.
- source_word: τοὺς προφήτας
  choice: ప్రవక్తలను
  rationale: ఆదర్శంగా తీసుకోవలసిన వారిని సూచించే ప్రత్యక్ష కర్మకు సరళమైన అనువాదం.
- source_word: ἐλάλησαν
  choice: మాట్లాడిన
  rationale: λαλέω యొక్క సాధారణ ‘మాట్లాడు’ భావాన్ని కాపాడి, ‘ప్రకటించిన’ వంటి అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: ప్రభువు నామంలో
  rationale: ప్రాతినిధ్యం మరియు అధికారాన్ని సూచించే బైబిలీయ నుడికారాన్ని నేరుగా నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριοςకు గౌరవప్రదమైన, సహజమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: సమాజాన్ని ఉద్దేశించిన పుంలింగ సంబోధన ἀδελφοί
  choice: ప్రధాన పాఠ్యంలో ‘సోదరులారా’; సమగ్ర వర్తింపును పాదసూచికలో వివరణ
  alternative: ‘సోదర సోదరీమణులారా’ లేదా ‘తోటి విశ్వాసులారా’
  rationale: మూలంలోని వ్యాకరణ పుంలింగాన్ని చెరపకుండా ఉంచుతూ, యాకోబు సంబోధన స్త్రీలతో సహా విశ్వాస సమాజమంతటినీ ఉద్దేశించి ఉండవచ్చని పాదసూచిక తెలియజేస్తుంది.
- issue: ప్రవక్తలకు ὑπόδειγμαతో ఉన్న భావసంబంధం
  choice: బాధను సహించడంలో, దీర్ఘశాంతి చూపడంలో ప్రవక్తలను ఆదర్శంగా తీసుకోవడం
  alternative: బాధకూ దీర్ఘశాంతికీ ఉదాహరణగా ప్రవక్తలను తీసుకోవడం
  rationale: ప్రవక్తలే అనుసరించవలసిన ఆదర్శమని, సంబంధిత షష్ఠీ విభక్తి పదాలు వారు ఏ విషయంలో ఆదర్శమో తెలుపుతున్నాయని గ్రీకు వాక్యనిర్మాణానికి అనుగుణంగా వ్యక్తపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఉపదేశ శైలి. ‘దీర్ఘశాంతి’ బైబిలీయ గంభీరతను నిలుపుతూనే ‘చూపడంలో’తో అర్థాన్ని సులభంగా గ్రహించగలిగేలా చేయబడింది.
