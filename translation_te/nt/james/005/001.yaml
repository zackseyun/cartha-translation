id: JAS.5.1
reference: James 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ πλούσιοι, κλαύσατε ὀλολύζοντες ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: te
  text: ఇప్పుడు వినండి, ధనవంతులారా! మీ మీదికి వస్తున్న దురవస్థలను[b] బట్టి విలపిస్తూ ఏడవండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బిగ్గరగా కేకలు వేస్తూ ఏడవండి.’ గ్రీకు కృదంతం బిగ్గరగా చేసే విలాపాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘దురవస్థలు’ అనే పదానికి ‘విపత్తులు’ లేదా ‘తీవ్ర కష్టాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: ఇప్పుడు వినండి
  rationale: తీవ్రమైన పిలుపు లేదా ప్రవక్తల శైలిలోని ఖండనను ప్రారంభించే గ్రీకు ప్రయోగం. ఆధునిక తెలుగులో ‘ఇప్పుడు వినండి’ దాని నేరమైన, హెచ్చరికతో కూడిన బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ πλούσιοι
  choice: ధనవంతులారా
  rationale: రూపంలో ప్రథమావిభక్తి అయినా ఇక్కడ సంబోధనగా పనిచేస్తుంది. ‘ధనవంతులారా’ ప్రత్యక్ష సంబోధనను స్పష్టంగా నిలుపుతుంది.
- source_word: κλαύσατε
  choice: ఏడవండి
  rationale: బయటికి కనబడే దుఃఖాన్ని ఆజ్ఞాపించే భూతకాల ఆజ్ఞార్థకం. ‘ఏడవండి’ సాధారణ పాఠకులకు సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: ὀλολύζοντες
  choice: బిగ్గరగా విలపించండి
  rationale: బిగ్గరగా, బహిరంగంగా చేసే శోకధ్వనిని సూచించే వర్తమాన కృదంతం. తెలుగులో వాక్యప్రవాహం కోసం సమన్వయ ఆజ్ఞగా వ్యక్తం చేసినా, ప్రధాన ఆజ్ఞను తీవ్రతరం చేసే భావం నిలిచింది.
- source_word: ἐπὶ
  choice: బట్టి
  rationale: చతుర్థీ విభక్తితో ఇక్కడ విలాపానికి కారణం లేదా సందర్భాన్ని సూచిస్తుంది. ‘బట్టి’ ఆ కారణసంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ταλαιπωρίαις
  choice: విపత్తులను
  rationale: తీవ్రమైన దురవస్థలు, కష్టాలు లేదా విపరీత పరిస్థితులను సూచిస్తుంది. ‘విపత్తులు’ రాబోయే తీర్పు సందర్భానికి తగిన గంభీరతను కలిగి ఉంది; ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: ταῖς ἐπερχομέναις
  choice: మీ మీదికి రాబోతున్న
  rationale: విపత్తులు సమీపిస్తున్నాయని తెలిపే వర్తమాన కృదంతం. ‘రాబోతున్న’ సమీపిస్తున్న భావాన్ని నిలుపుతూ, గ్రీకు పదం చెప్పేదానికంటే కాలసమీపతను అతిగా నిర్దిష్టం చేయదు; ‘మీ మీదికి’ వాటి లక్ష్యాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ధనవంతుల సంబోధన యొక్క స్వరం మరియు సూచిత వర్గం
  choice: రాబోయే విపత్తు లేదా తీర్పును ఎదుర్కొనే ధనవంతులపై ప్రవక్తల శైలిలో చేసిన ఖండనగా అనువదించాం; వారు విశ్వాసులా అవిశ్వాసులా అని ఈ వచనంలో నిర్ణయించలేదు.
  alternative: ఇది ప్రత్యేకంగా పీడించే అవిశ్వాసి భూస్వాములను లేదా క్రైస్తవ సమాజంలోని ధనవంతులను మాత్రమే ఉద్దేశించిందని నిర్దిష్టీకరించడం.
  rationale: ఈ వాక్యం ‘ధనవంతులను’ నేరుగా సంబోధించి రాబోయే విపత్తులను ప్రకటిస్తుంది; అయితే వారి సమూహ గుర్తింపును ఈ వచనం మాత్రమే స్పష్టంగా చెప్పదు. అందువల్ల విస్తృత సంబోధనను, తీర్పు స్వరాన్ని యథాతథంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన ప్రవక్తీయ ఖండన స్వరాన్ని ఉంచాం. ప్రత్యక్ష సంబోధనకు ‘ధనవంతులారా’ వాడాం. గ్రీకు κλαύσατε ὀλολύζοντες నిర్మాణాన్ని తెలుగులో సహజంగా రెండు సమన్వయ ఆజ్ఞలుగా అందించాం; బిగ్గరమైన విలాప భావాన్ని తగ్గించలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదాల వద్ద ఉన్నాయి.
