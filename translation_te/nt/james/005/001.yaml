revisions:
- from: ఇప్పుడు వినండి, ధనవంతులారా! మీ మీదికి రాబోతున్న విపత్తులను[b] బట్టి ఏడవండి; బిగ్గరగా విలపించండి.[a]
  to: ఇప్పుడు వినండి, ధనవంతులారా! మీ మీదికి వస్తున్న దురవస్థలను[b] బట్టి విలపిస్తూ ఏడవండి.[a]
  rationale: The revision restores the Greek imperative-plus-participle construction with ‘విలపిస్తూ ఏడవండి,’ retains the prophetic direct address, and uses ‘దురవస్థలు’ to represent the broad sense of ταλαιπωρίαι. Footnote markers remain attached to their relevant expressions and retain unique, matching entries.
