review_pass:
  verdict: revise
  source_fidelity: The direct address, imperative mourning, and coming afflictions are conveyed. However, κλαύσατε ὀλολύζοντες is an imperative modified by a participle ('weep, wailing'), not two coordinate imperatives. The current wording also separates the cause of lament from the modified mourning expression, weakening the Greek structure.
  naturalness: The Telugu is generally clear and modern, but ‘ఏడవండి; బిగ్గరగా విలపించండి’ is somewhat redundant and changes the participial intensification into a second command. ‘విలపిస్తూ ఏడవండి’ is both natural and closer to the source.
  terminology: ‘ధనవంతులారా’ is apt. ‘విపత్తులు’ is a possible rendering of ταλαιπωρίαι, though ‘దురవస్థలు’ better retains the sense of severe wretched conditions without importing a disaster-specific sense. ‘ఇప్పుడు వినండి’ is an acceptable sharp summons for Ἄγε νῦν.
  issues:
  - severity: medium
    issue: κλαύσατε ὀλολύζοντες is rendered as two coordinated imperatives.
    rationale: The Greek has one imperative, κλαύσατε ('weep'), qualified by the present participle ὀλολύζοντες ('wailing/howling'). Rendering it as ‘విలపిస్తూ ఏడవండి’ preserves both the syntax and the intensifying manner.
  - severity: low
    issue: ‘విపత్తులు’ can be narrower and more event-disaster oriented than ταλαιπωρίαι.
    rationale: ταλαιπωρίαι denotes miseries, severe distress, or wretched conditions. ‘దురవస్థలు’ preserves this breadth and the denunciatory force.
  revised_text: ఇప్పుడు వినండి, ధనవంతులారా! మీ మీదికి వస్తున్న దురవస్థలను[b] బట్టి విలపిస్తూ ఏడవండి.[a]
  revised_footnotes:
