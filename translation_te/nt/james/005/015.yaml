  revision_rationale: 'ప్రధాన పాఠ్యార్థాన్ని మార్చకుండా రెండు స్వల్ప సవరణలు చేశాం: (1) πίστεωςకు సంబంధించిన ఆంగ్ల ఆడిట్-ట్రెయిల్ ప్రత్యామ్నాయాన్ని సరైన గుర్తుతో పాదసూచికలో చేర్చాం; (2) క్షమాపణ పొందేది పాపాలేనన్న గ్రీకు భావాన్ని ‘అతని పాపాలు క్షమించబడతాయి’గా స్పష్టపరిచాం. κἄνలోని సంభావ్య/అంగీకార ఛాయను ‘చేసి ఉన్నా’ మరియు ప్రత్యామ్నాయ పాదసూచిక ద్వారా నిలిపాం.'
