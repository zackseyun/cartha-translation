  to: విశ్వాసంతో చేసే ప్రార్థన[b] అనారోగ్యంతో ఉన్నవానిని రక్షిస్తుంది[a]; ప్రభువు అతణ్ణి లేపుతాడు. అతడు పాపాలు చేసి ఉన్నా[c], అతని పాపాలు క్షమించబడతాయి.
