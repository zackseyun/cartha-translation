id: JAS.5.15
reference: James 5:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: te
  text: విశ్వాసంతో చేసే ప్రార్థన[b] అనారోగ్యంతో ఉన్నవానిని రక్షిస్తుంది[a]; ప్రభువు అతణ్ణి లేపుతాడు. అతడు పాపాలు చేసి ఉన్నా[c], అతని పాపాలు క్షమించబడతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘స్వస్థపరుస్తుంది’ లేదా ‘బాగుచేస్తుంది’; గ్రీకు పదానికి అక్షరార్థం ‘రక్షిస్తుంది.’
    reason: lexical_alternative
  - marker: b
    text: ‘విశ్వాసంతో చేసే ప్రార్థన’ను దేవునిపై నమ్మకంతో చేసే ప్రార్థనగా కూడా అర్థం చేసుకోవచ్చు; ఇక్కడ తక్కువ సంభావ్యంగా ‘విశ్వసనీయతతో చేసే ప్రార్థన’ అనే అర్థం కూడా సాధ్యమే.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘అతడు పాపాలు చేసి ఉంటే.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ τῆς πίστεως
  choice: విశ్వాసంతో చేసే ప్రార్థన
  rationale: సందర్భంలో εὐχή అంటే ‘ప్రార్థన’; τῆς πίστεως ప్రార్థనను విశ్వాసం లేదా దేవునిపై నమ్మకం లక్షణంగా కలిగినదిగా సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ఈ సంబంధాన్ని ‘విశ్వాసంతో చేసే’ అని వ్యక్తం చేశాం.
- source_word: σώσει
  choice: రక్షిస్తుంది
  rationale: σῴζω అనారోగ్య సందర్భంలో స్వస్థపరచడం లేదా బాగుచేయడం అనే భావాన్ని కలిగి ఉండగలిగినా, మూలపదంలోని విస్తృతమైన రక్షణ భావాన్ని ‘రక్షిస్తుంది’ నిలుపుతుంది; శారీరక స్వస్థత భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: τὸν κάμνοντα
  choice: అనారోగ్యంతో ఉన్నవానిని
  rationale: κάμνω అలసిపోవడం లేదా అనారోగ్యంగా ఉండడం అని అర్థమవుతుంది. ముందున్న వచనంలోని రోగం, అభిషేకం, ప్రార్థనల సందర్భంలో అనారోగ్యమే ఉద్దేశించిన భావం.
- source_word: ἐγερεῖ
  choice: లేపుతాడు
  rationale: ἐγείρω యొక్క ‘లేపడం’ అనే చిత్రణను నిలిపి ఉంచుతుంది. ఇక్కడ రోగశయ్య నుంచి కోలుకునేలా చేయడం ప్రధాన భావమైనా, దేవుడు పునరుద్ధరించే విస్తృత ప్రతిధ్వనిని ఈ పదం కాపాడుతుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: కొత్త నిబంధనలో κύριοςకు సహజమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం; దైవిక కార్యసాధకత్వాన్ని నిలుపుతుంది.
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: అతడు పాపాలు చేసి ఉన్నా
  rationale: κἄν ఇక్కడ షరతుతో కూడిన అంగీకార భావాన్ని, ‘చేసి ఉన్నా’ లేదా ‘చేసి ఉంటే’ అనే భావాన్ని ఇస్తుంది. ‘చేసి ఉన్నా’ ఆ concessive ఛాయను సహజంగా నిలుపుతుంది.
- source_word: ἀφεθήσεται αὐτῷ
  choice: అతనికి క్షమాపణ లభిస్తుంది
  rationale: భవిష్యత్ కర్మణి రూపం పాపక్షమాపణను, క్షమించేవాడైన దేవుణ్ణి ప్రత్యక్షంగా పేర్కొనని దైవిక కార్యాన్ని సూచిస్తుంది. తెలుగు వాడుకలో ‘అతనికి క్షమాపణ లభిస్తుంది’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: σώσειను కేవలం శారీరక స్వస్థతగా అనువదించాలా, లేక విస్తృతమైన రక్షణ భావాన్ని నిలుపాలా
  choice: ప్రధాన పాఠ్యంలో ‘రక్షిస్తుంది’ అని ఉంచి, స్వస్థత భావాన్ని సందర్భానికి మరియు పాదసూచికకు వదిలాం.
  alternative: ‘స్వస్థపరుస్తుంది’ లేదా ‘బాగుచేస్తుంది’
  rationale: వచనం అనారోగ్యాన్ని గురించి చెప్పినా, యాకోబు మరింత విస్తృతమైన σῴζω పదాన్ని వాడాడు. ‘రక్షిస్తుంది’ దాని పదార్థ విస్తృతిని కాపాడుతుంది.
- issue: ప్రార్థన ప్రతి సందర్భంలో యాంత్రికంగా స్వస్థతను హామీ ఇస్తుందా
  choice: గ్రీకు భవిష్యత్ నిర్దేశక రూపాల నేరమైన బలాన్ని అలాగే ఉంచాం; అదనపు షరతులు గానీ, ‘ప్రతి సందర్భంలో తప్పక’ వంటి అతిశయాన్ని గానీ చేర్చలేదు.
  alternative: ‘స్వస్థపరచవచ్చు’ లేదా ‘ప్రతి రోగినీ తప్పకుండా స్వస్థపరుస్తుంది’ వంటి వ్యాఖ్యాత్మక రూపాలు
  rationale: మూలపాఠ్యపు నేరమైన ప్రకటనను బలహీనపరచకూడదు; అదే సమయంలో ప్రత్యేక సిద్ధాంతాన్ని పాఠ్యంలోకి చొప్పించకూడదు.
- issue: అనారోగ్యం తప్పనిసరిగా వ్యక్తిగత పాపం వల్లనే వస్తుందా
  choice: పాపాన్ని సంభావ్య పరిస్థితిగా మాత్రమే చూపే ‘చేసి ఉన్నా’ అనే నిర్మాణాన్ని వాడాం.
  alternative: ప్రతి అనారోగ్యమూ వ్యక్తిగత పాపం వల్లనే వస్తుందని సూచించడం
  rationale: గ్రీకు వాక్యం పాపాన్ని సర్వసాధారణ కారణంగా కాక, ఉండవచ్చని చెప్పే షరతుతో కూడిన అంశంగా ఉంచుతుంది.
- issue: πίστεωςను ‘విశ్వాసం’గా లేదా ‘విశ్వసనీయత’గా అర్థం చేయాలా
  choice: ఇక్కడ దేవునిపై నమ్మకంతో లక్షణీకరించబడిన ప్రార్థనగా ‘విశ్వాసంతో చేసే ప్రార్థన’ అని అనువదించాం.
  alternative: ‘విశ్వసనీయతతో చేసే ప్రార్థన’
  rationale: స్వస్థత కోసం పెద్దలు చేసే ప్రార్థన సందర్భంలో ‘విశ్వాసం/నమ్మకం’ ప్రధాన భావం; ‘విశ్వసనీయత’ సూత్రతః సాధ్యమైనా ఇక్కడ తక్కువ సంభావ్యం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘రక్షిస్తుంది’ మరియు ‘లేపుతాడు’ అనే పదాలు మూలంలోని విస్తృతతను, చిత్రణను నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో అమర్చబడ్డాయి.
