  source_fidelity: 'ప్రధాన అనువాదం గ్రీకు వాక్యనిర్మాణానికీ భావానికీ విశ్వసనీయంగా ఉంది: εὐχὴ τῆς πίστεως, σώσει, κάμνοντα, ἐγερεῖ, κἄν, మరియు ἀφεθήσεται అన్నిటి ప్రధాన భావాలు నిలిచాయి. అయితే ἀφεθήσεται αὐτῷలో క్షమించబడేది పాపాలు అనే బహువచన భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టపరచడం మంచిది. అలాగే ఆంగ్ల ఆడిట్ ట్రెయిల్‌లో ఉన్న πίστεωςకు సంబంధించిన ప్రత్యామ్నాయ-భావ పాదసూచికకు తెలుగు పాఠ్యంలో గుర్తు/పాదసూచిక లేదు; కాబట్టి దానిని చేర్చాలి.'
  naturalness: ‘విశ్వాసంతో చేసే ప్రార్థన,’ ‘అనారోగ్యంతో ఉన్నవానిని,’ ‘ప్రభువు అతణ్ణి లేపుతాడు,’ మరియు ‘పాపాలు చేసి ఉన్నా’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగాను గౌరవప్రదంగాను ఉన్నాయి. ‘అతనికి క్షమాపణ లభిస్తుంది’ కూడా సహజమే, కానీ ‘అతని పాపాలు క్షమించబడతాయి’ అనేది మూలంలోని బహువచన పాపాలకు మరింత స్పష్టమైన తెలుగు రూపం.
  terminology: ‘విశ్వాసం,’ ‘ప్రార్థన,’ ‘రక్షిస్తుంది,’ ‘ప్రభువు,’ ‘పాపాలు,’ ‘క్షమించబడతాయి’ అనే పదాలు స్థిరమైన, తటస్థమైన బైబిలు-తెలుగు వాడుకకు అనుకూలం. σώσειకు ‘రక్షిస్తుంది’ ఉంచడం మూలపద విస్తృతిని కాపాడుతుంది; స్వస్థత ప్రత్యామ్నాయం పాదసూచికలో సముచితంగా ఉంది.
