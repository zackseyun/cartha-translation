id: JAS.5.3
reference: James 5:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: te
  text: మీ బంగారమూ వెండీ తుప్పుపట్టాయి[a]. వాటి తుప్పు మీకు వ్యతిరేకంగా సాక్ష్యంగా ఉంటుంది; అది అగ్నిలా మీ మాంసాన్ని తినివేస్తుంది[b]. అంత్యదినాల్లో మీరు ధనాన్ని కూడబెట్టుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తుప్పుపట్టాయి’ అనే మాట ఇక్కడ లోహాలు మకిలిపట్టడం లేదా క్షయించడం అనే విస్తృత భావంలో ఉంది. బంగారానికి సాధారణ అర్థంలో తుప్పు పట్టకపోయినా, యాకోబు సంపద చెడిపోయిందనే ప్రవచనాత్మక చిత్రాన్ని ఉపయోగిస్తున్నాడు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అంత్యదినాల్లో మీరు అగ్నిలా ధనాన్ని కూడబెట్టుకున్నారు.’ ‘అగ్నిలా’ అనే మాటను ముందున్న ‘తినివేస్తుంది’తో కాకుండా తరువాతి వాక్యభాగంతో కలిపి చదివే అవకాశం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: తుప్పుపట్టాయి
  rationale: పరిపూర్ణ కాలం గతంలో మొదలై ప్రస్తుతం కొనసాగుతున్న స్థితిని సూచిస్తుంది. బంగారం, వెండికి శాస్త్రీయ అర్థంలో ‘తుప్పు’ అసహజంగా అనిపించినా, గ్రీకు క్రియ లోహం చెడిపోవడం లేదా మకిలిపట్టడం అనే విస్తృత భావాన్ని కలిగి ఉంది; ప్రవచనాత్మక చిత్రాన్ని ‘తుప్పుపట్టాయి’ స్పష్టంగా నిలుపుతుంది.
- source_word: ἰὸς
  choice: తుప్పు
  rationale: లోహాల సందర్భంలో ఇది విషం కంటే లోహాన్ని పట్టిన తుప్పు లేదా క్షయపదార్థాన్ని సూచిస్తుంది. అదే మూలచిత్రాన్ని తెలుగులో సహజంగా కొనసాగించేందుకు ‘తుప్పు’ ఎంచుకున్నాం.
- source_word: εἰς μαρτύριον ὑμῖν
  choice: మీకు వ్యతిరేకంగా సాక్ష్యంగా ఉంటుంది
  rationale: ఈ పదబంధానికి న్యాయస్థాన సంబంధమైన భావం ఉంది. ‘సాక్ష్యంగా ఉంటుంది’ మూలంలోని μαρτύριονను నిలుపుతూ, సందర్భంలోని ప్రతికూల దిశను ‘మీకు వ్యతిరేకంగా’ స్పష్టం చేస్తుంది.
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: మీ మాంసాన్ని తినివేస్తుంది
  rationale: మూలంలోని తీవ్రమైన, సజీవమైన రూపకాన్ని ‘తినివేస్తుంది’ నిలుపుతుంది; ‘నాశనం చేస్తుంది’ కంటే ఇది గ్రీకుకు దగ్గరగా ఉంటుంది.
- source_word: σάρκας
  choice: మాంసాన్ని
  rationale: ఇక్కడ శరీర సంబంధమైన తీర్పు లేదా నాశన చిత్రమే ఉంది; పాపస్వభావం వంటి వేదాంతార్థం కాదు. అందుచేత ప్రత్యక్షమైన ‘మాంసం’ సరిపోతుంది.
- source_word: ὡς πῦρ
  choice: అగ్నిలా
  rationale: దీనిని ముందున్న ‘తినివేస్తుంది’ అనే క్రియతో కలిపితే సహజమైన విధ్వంసక తీర్పు చిత్రం ఏర్పడుతుంది. తరువాతి వాక్యంతో కలిపే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐθησαυρίσατε
  choice: ధనాన్ని కూడబెట్టుకున్నారు
  rationale: క్రియలో విలువైన సంపదను నిల్వచేసే భావం ఉంది. ‘దాచిపెట్టారు’ ప్రతికూల ఉద్దేశాన్ని ఎక్కువగా చేర్చవచ్చు; ‘ధనాన్ని కూడబెట్టుకున్నారు’ మూలార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: అంత్యదినాల్లో
  rationale: ఇది స్థిరమైన అంత్యకాల పదబంధం. గ్రీకులో లేని ‘ఈ’ అనే నిర్దేశకాన్ని చేర్చకుండా ‘అంత్యదినాల్లో’ నేరుగా అనువదించాం.
theological_decisions:
- issue: వాక్యంలో ὡς πῦρ (‘అగ్నిలా’) దేనితో సంబంధించింది?
  choice: ముందున్న వాక్యభాగంతో కలిపి, తుప్పు ‘అగ్నిలా మీ మాంసాన్ని తినివేస్తుంది’ అని అనువదించడం.
  alternative: తరువాతి వాక్యభాగంతో కలిపి, ‘అంత్యదినాల్లో మీరు అగ్నిలాంటి ధనాన్ని కూడబెట్టుకున్నారు’ లేదా ‘అగ్నిని కూడబెట్టుకున్నారు’ అని అర్థం చేసుకోవడం.
  rationale: సమీప పదక్రమం మరియు భావసంబంధం ὡς πῦρను φάγεταιతో కలపడానికే ఎక్కువ మద్దతిస్తాయి. అయినా, ప్రాచీన విరామచిహ్నాల లేమి వల్ల తరువాతి వాక్యంతో కలిపే పఠనం సాధ్యమే; అందుకే ఆ సందిగ్ధతను పాదసూచికలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని ఉపయోగించాం. ‘తుప్పు,’ ‘సాక్ష్యం,’ ‘మాంసం,’ ‘అంత్యదినాలు’ వంటి మూలచిత్రాలు, న్యాయసంబంధ భావం, అంత్యకాల ఉద్వేగం నిలుపబడ్డాయి. రెండు పాదసూచిక సూచికలూ ప్రధాన పాఠ్యంలో [a], [b]గా ఉన్నాయి.
