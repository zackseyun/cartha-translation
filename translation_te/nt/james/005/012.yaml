id: JAS.5.12
reference: James 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: te
  text: అన్నిటికంటే ముఖ్యంగా, నా సహోదరులారా[a], ప్రమాణం చేయకండి—ఆకాశం మీదగానీ, భూమి మీదగానీ, మరే ఇతర ప్రమాణంగానీ చేయకండి. దానికి బదులు, మీ ‘అవును’ అవునుగానే, మీ ‘కాదు’ కాదుగానే ఉండాలి; మీరు తీర్పు కింద పడకుండా ఉండేందుకు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా సహోదర సహోదరీలారా”; గ్రీకులో “సహోదరులు” అని ఉంది; అది విశ్వాసుల సమాజమంతటినీ ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీరు శిక్షావిధి కింద పడకుండా ఉండేందుకు.”
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: అన్నిటికంటే ముఖ్యంగా
  rationale: ఇది ఉపదేశంలోని ప్రధాన ప్రాముఖ్యతను సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండడంతో పాటు గ్రీకు పదబంధంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἀδελφοί μου
  choice: నా సహోదరులారా
  rationale: గ్రీకులోని పుంలింగ బహువచన సంబోధన రూపాన్ని గౌరవిస్తూ, తెలుగు బైబిలు శైలిలో సహజమైన ‘సహోదరులు’ వాడబడింది; ఇది ఇక్కడ విశ్వాసుల సమాజమంతటినీ ఉద్దేశించి ఉండవచ్చని పాదసూచిక తెలియజేస్తుంది.
- source_word: μὴ ὀμνύετε
  choice: ప్రమాణం చేయకండి
  rationale: ఇక్కడ అశ్లీలంగా తిట్టడం కాదు, ప్రమాణం చేయడమే ఉద్దేశం. సాధారణ నిషేధాన్ని స్పష్టంగా తెలిపే సహజమైన తెలుగు రూపం.
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν
  choice: ఆకాశం తోడని గానీ, భూమి తోడని గానీ
  rationale: ఆకాశం లేదా భూమిని సాక్షిగా పెట్టుకొని ప్రమాణం చేయడాన్ని సూచించే గ్రీకు భావాన్ని తెలుగులోని సహజమైన ప్రమాణ ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: μήτε ἄλλον τινὰ ὅρκον
  choice: మరే ఇతర ప్రమాణం గానీ చేయకండి
  rationale: నిషేధంలోని సమగ్రతను నిలుపుతూ, తెలుగులో వాక్యార్థం సందిగ్ధం కాకుండా క్రియను పునరుక్తం చేసింది.
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: మీ ‘అవును’ అవునుగానే, మీ ‘కాదు’ కాదుగానే ఉండాలి
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తమైన సామెతసదృశ బలాన్ని, సూటిగా నిజం చెప్పాలనే భావాన్ని నిలుపుతుంది.
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: అప్పుడు మీరు తీర్పు కింద పడరు
  rationale: πέσητε లోని ‘పడటం’ రూపకాన్ని, κρίσις యొక్క విస్తృతమైన ‘తీర్పు’ అర్థాన్ని కాపాడుతుంది. గ్రీకు ఉద్దేశ్య/ఫలిత భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: κρίσις ను ‘తీర్పు’గా అనువదించాలా, మరింత బలమైన ‘శిక్షావిధి’గా అనువదించాలా
  choice: తీర్పు
  alternative: శిక్షావిధి
  rationale: κρίσις విస్తృత అర్థంలో తీర్పును సూచించగలదు; అది తప్పనిసరిగా అంతిమ శిక్షావిధినే నిర్దేశించదు. మూలపాఠం కంటే సంకుచితమైన సిద్ధాంతార్థాన్ని చేర్చకుండా ‘తీర్పు’ను ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: మిశ్రమ విశ్వాస సమాజాన్ని ఉద్దేశించిన ἀδελφοί ను ఎలా అందించాలి
  choice: నా సహోదరులారా
  alternative: నా సహోదర సహోదరీలారా
  rationale: ప్రధాన పాఠం గ్రీకు పుంలింగ బహువచన రూపాన్ని ప్రతిబింబిస్తుంది; అయితే సందర్భంలో అది విశ్వాస సమాజమంతటినీ సూచించే అవకాశం ఉన్నందున దాన్ని పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన ఉపదేశ శైలి. ‘ఆకాశం తోడని’ వంటి తెలుగు ప్రమాణ ప్రయోగం మూలంలోని oath-taking భావాన్ని స్పష్టం చేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
