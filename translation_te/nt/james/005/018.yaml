  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ⸂ὑετὸν ἔδωκεν⸃ καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: te
  text: అతడు మళ్లీ ప్రార్థించాడు; ఆకాశం[a] వర్షాన్ని ఇచ్చింది, భూమి తన పంటను పండించింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరలోకం.’ ఇక్కడి గ్రీకు పదానికి ‘ఆకాశం’ లేదా ‘పరలోకం’ అనే అర్థాలు ఉండవచ్చు; వర్షం గురించిన సందర్భం వల్ల ‘ఆకాశం’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘భూమి తన ఫలాన్ని ఇచ్చింది,’ లేదా ‘భూమి తన దిగుబడిని ఇచ్చింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: మళ్లీ
  rationale: ప్రార్థన పునరావృతమైందని సూచించే సహజమైన, సంక్షిప్తమైన ఆధునిక తెలుగు పదం.
- source_word: προσηύξατο
  choice: ప్రార్థించాడు
  rationale: προσεύχομαι అనే క్రియ యొక్క సాధారణ అర్థాన్ని ఇస్తుంది. ఈ వచనంలో లేని ‘మనస్ఫూర్తిగా’ లేదా ‘తీవ్రంగా’ వంటి భావాలను చేర్చలేదు.
- source_word: ὁ οὐρανὸς
  choice: ఆకాశం
  rationale: వర్షం గురించిన ఈ సందర్భంలో οὐρανός కనిపించే ఆకాశాన్ని సూచిస్తుంది; ‘పరలోకం’ అనే వేదాంతపరమైన భావాన్ని అనవసరంగా తీసుకురాదు.
- source_word: ὑετὸν ἔδωκεν
  choice: వర్షాన్నిచ్చింది
  rationale: గ్రీకు వాక్యంలోని ‘వర్షాన్ని ఇచ్చింది’ అనే రూపకాన్ని తెలుగులో అర్థమయ్యే విధంగా నిలుపుతుంది; దేవుడు వర్షం పంపాడని మూలంలో లేని వివరణను నేరుగా చేర్చదు.
- source_word: ἡ γῆ
  choice: భూమి
  rationale: ఆకాశంతో ఉన్న సమాంతర నిర్మాణాన్ని నిలుపుతూ γῆ యొక్క విస్తృత అర్థాన్ని అందిస్తుంది; వ్యవసాయ భూమి అనే భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: ἐβλάστησεν
  choice: పండించింది
  rationale: భూమి మొలకెత్తించి ఫలాన్ని లేదా దిగుబడిని కలిగించిందనే వ్యవసాయ ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὸν καρπὸν αὐτῆς
  choice: తన ఫలాన్ని
  rationale: καρπός అనే పదంలోని ‘ఫలం’ భావాన్ని, αὐτῆς సూచించే భూమితో సంబంధాన్ని నిలుపుతుంది; ‘పంట’ లేదా ‘దిగుబడి’ కూడా సందర్భానుసార ప్రత్యామ్నాయాలు.
theological_decisions:
- issue: ఏలీయా ప్రార్థనకు వచ్చిన దైవిక ప్రతిస్పందన
  choice: వచనం చెప్పినట్లే ఆకాశం వర్షాన్నిచ్చిందని, భూమి ఫలాన్ని పండించిందని అనువదించడం
  alternative: ‘దేవుడు వర్షాన్ని పంపాడు’ అని స్పష్టంగా చేర్చడం
  rationale: సందర్భం దేవుని ప్రతిస్పందనను సూచించినా, ఈ వచనం ప్రత్యక్షంగా ఆకాశం వర్షాన్నివ్వడం, భూమి ఫలాన్ని పండించడం అనే భాషనే ఉపయోగిస్తుంది. అందువల్ల మూలంలో లేని వివరణను చేర్చకుండా ఆ అభివ్యక్తిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని వరుస సమాంతర క్రియలను అర్ధవిరామం, కామాతో నిలిపాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వద్ద ఉంచబడింది.
