id: JAS.5.5
reference: James 5:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: te
  text: మీరు భూమిమీద విలాసంగా జీవించారు[a], స్వీయసుఖాసక్తితో జీవించారు[b]; వధ దినాన[c] మీ హృదయాలను కొవ్వెక్కించారు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సుఖభోగాలతో జీవించారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతిగా సుఖభోగాలలో మునిగిపోయారు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘వధ దినం కోసం.’
    reason: alternative_reading
  - marker: d
    text: వధకు ముందు జంతువులను కొవ్వెక్కించే దృశ్యాన్ని ఇది సూచిస్తుంది; ఇది రాబోయే తీర్పును సూచిస్తుండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: విలాసంగా జీవించి
  rationale: ఈ క్రియ సుఖభోగాలను వెదుకుతూ విలాసవంతంగా జీవించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, దాని నైతిక మందలింపు భావాన్ని నిలిపే ఎంపిక.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిమీద
  rationale: γῆకు ‘భూమి’ లేదా ‘దేశం’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ లోకసంబంధమైన విలాసజీవితం గురించిన విస్తృత ఖండనకు ‘భూమిమీద’ సరిపోతుంది.
- source_word: ἐσπαταλήσατε
  choice: మీ కోరికలలో మునిగిపోయారు
  rationale: ఈ క్రియ అదుపులేని స్వీయసుఖాసక్తితో జీవించడాన్ని సూచిస్తుంది. ముందు ఉన్న ‘విలాసంగా జీవించి’ అనే భావాన్ని బలపరుస్తూ, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే రూపం.
- source_word: ἐθρέψατε
  choice: కొవ్వెక్కించారు
  rationale: τρέφω సాధారణంగా పోషించడం లేదా మేపడం అని అర్థమిచ్చినా, వధకు ముందు జంతువులను కొవ్వెక్కించే వ్యంగ్య చిత్రణ ఈ సందర్భంలో ప్రధానంగా ఉంది.
- source_word: τὰς καρδίας ὑμῶν
  choice: మీ హృదయాలను
  rationale: మూలంలోని రూపకాన్నీ బైబిలీయ మానవ అంతరంగ భావననీ వ్యాఖ్యానాత్మక పరామర్శగా మార్చకుండా నిలుపుతుంది.
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: వధ జరిగే రోజున
  rationale: ἐν అనే విభక్తి సూచించే కాలస్థితిని దగ్గరగా ప్రతిబింబిస్తూ, ‘వధ దినం’ అనే కఠిన రూపకాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ‘వధ జరిగే రోజు’ అనే రూపకపు భావం
  choice: రాబోయే వధ లేదా తీర్పు చిత్రాన్ని ప్రధాన పాఠ్యంలో వివరణ లేకుండా నిలుపడం
  alternative: ‘తీర్పు దినం కోసం’ అని స్పష్టీకరించడం
  rationale: సందర్భం దేవుని తీర్పును బలంగా సూచించినా, గ్రీకు పాఠ్యం దానిని నేరుగా పేర్కొనదు. అందువల్ల రూపకంలోని ఉత్కంఠనూ అనిశ్చితినీ నిలుపుతున్నాం.
- issue: ἐν ἡμέρᾳ యొక్క సంబంధం
  choice: ‘వధ జరిగే రోజున’
  alternative: ‘వధ జరిగే రోజు కోసం’
  rationale: ‘రోజున’ అనేది ἐνకు మరింత ప్రత్యక్ష సమానార్థకం; అయితే జంతువులను వధ కోసం కొవ్వెక్కించే చిత్రణ కారణంగా ఉద్దేశార్థక పఠనం కూడా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన మందలింపు స్వరాన్ని నిలిపే సహజ శైలి. ‘కొవ్వెక్కించారు’ అనే బలమైన రూపకాన్ని మృదువుపరచలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
