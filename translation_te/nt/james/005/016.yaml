  revision_rationale: 'పాఠ్యాంతర పాదసూచిక [a] SBLGNTలో οὖνతో అనుసంధానమైన పాఠ్యభేదాన్ని సముచితంగా సూచిస్తుంది; దాని స్థానం కూడా సరైనది. ప్రధాన సవరణ ἐνεργουμένη కు సంబంధించినది: ‘క్రియాశీలంగా ఉన్నప్పుడు’ ప్రార్థన పనిచేయడం/కార్యరూపంలో ఉండడం అనే భావాన్ని వ్యక్తపరుస్తుంది, కానీ దాని క్రియాశీలతను ఒక నిర్దిష్ట సిద్ధాంతపరమైన శక్తినింపడం లేదా హామీచేయబడిన ఫలితంగా మార్చదు. చివరి ప్రధాన క్రియను ‘ఎంతో శక్తివంతంగా ఉంటుంది’గా మార్చడం ఆధునిక తెలుగు ప్రవాహాన్ని మెరుగుపరుస్తుంది.'
