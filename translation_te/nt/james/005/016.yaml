id: JAS.5.16
reference: James 5:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: te
  text: కాబట్టి[a] మీ పాపాలను ఒకరితో ఒకరు ఒప్పుకోండి; మీరు స్వస్థత పొందేలా ఒకరి కోసం ఒకరు ప్రార్థించండి. నీతిమంతుని విజ్ఞాపన క్రియాశీలంగా ఉన్నప్పుడు ఎంతో శక్తివంతంగా ఉంటుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “కాబట్టి” లేదు.
    reason: textual_variant
  - marker: b
    text: లేదా, “క్రియాశీలంగా ఉన్న నీతిమంతుని విజ్ఞాపనకు ఎంతో బలం ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: ఒప్పుకోండి
  rationale: పాపాలను బహిరంగంగా అంగీకరించాలనే పరస్పర ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; అధికారిక మతకర్మను అనవసరంగా సూచించదు.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న ప్రార్థన, పాపం, పునరుద్ధరణ విషయాలనుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἀλλήλοις
  choice: ఒకరితో ఒకరు
  rationale: పరస్పరతను స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὰς ἁμαρτίας
  choice: మీ పాపాలను
  rationale: పరస్పర ఆజ్ఞ సందర్భంలో తెలుగులో అవసరమైన స్వామ్యార్థాన్ని సహజంగా అందిస్తూ, ἁμαρτίας యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: εὔχεσθε
  choice: ప్రార్థించండి
  rationale: ఆజ్ఞార్థక రూపాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
- source_word: ὑπὲρ ἀλλήλων
  choice: ఒకరి కోసం ఒకరు
  rationale: ఇతరుల పక్షంగా చేసే మధ్యవర్తిత్వ ప్రార్థన భావాన్నీ పరస్పరతనూ నిలుపుతుంది.
- source_word: ὅπως
  choice: పొందేలా
  rationale: ఉద్దేశం లేదా ఫలితం అనే రెండింటికీ వీలున్న సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἰαθῆτε
  choice: మీరు స్వస్థత పొందేలా
  rationale: భౌతిక లేదా ఆత్మసంబంధ స్వస్థతకే పరిమితం చేయకుండా గ్రీకు పదంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: πολὺ ἰσχύει
  choice: ఎంతో శక్తిగలది
  rationale: గొప్ప బలం లేదా ప్రభావసామర్థ్యం ఉందనే భావాన్ని ఫలితం గురించి అతిగా వ్యాఖ్యానించకుండా వ్యక్తపరుస్తుంది.
- source_word: δέησις
  choice: విజ్ఞాపన
  rationale: సాధారణ ప్రార్థనకన్నా నిర్దిష్టమైన వేడుకోలు లేదా supplication భావాన్ని తెలుగులో కచ్చితంగా తెలియజేస్తుంది.
- source_word: δικαίου
  choice: నీతిమంతుని
  rationale: సుభాషిత ధోరణిలో సాధారణ వ్యక్తిని సూచించే substantival adjective ను సంక్షిప్తంగా అందిస్తుంది; ఇది తప్పనిసరిగా పురుషునికే పరిమితం కాదు.
- source_word: ἐνεργουμένη
  choice: కార్యసాధకంగా ఉన్నప్పుడు
  rationale: ప్రార్థన క్రియాశీలంగా పని చేయడం లేదా ప్రభావవంతంగా ఉండడం అనే క్లిష్టమైన participial భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: ఈ వాక్యం మతాధికారుల వద్ద సంస్కారపరమైన పాపఒప్పుకోలును ఆజ్ఞాపిస్తుందా, లేక విశ్వాసుల మధ్య పరస్పర ఒప్పుకోలునా
  choice: ఒకరితో ఒకరు పరస్పరం పాపాలను ఒప్పుకోవడం
  alternative: నియమిత మతాధికారుల మధ్యవర్తిత్వంలో పాపఒప్పుకోలు
  rationale: ἀλλήλοις అనే పరస్పర సర్వనామం సంబోధించబడిన సమాజంలోని పరస్పర చర్యను స్పష్టంగా సూచిస్తుంది; అందువల్ల ఏ ప్రత్యేక సంఘపరంపర ఆచారాన్నీ పాఠ్యంలోకి చేర్చలేదు.
- issue: ἰαθῆτε సూచించే స్వస్థత పరిధి
  choice: భౌతిక, ఆత్మసంబంధ అర్థాలను ముందుగానే కుదించని ‘స్వస్థత’
  alternative: కేవలం శారీరక స్వస్థత లేదా కేవలం ఆత్మసంబంధ స్వస్థత
  rationale: సమీప సందర్భంలో శారీరక అనారోగ్యం ప్రధానమైనా, పాపాల ప్రస్తావన అర్థపరిధిని విస్తరిస్తుంది; అందువల్ల మూలంలోని ఉద్రిక్తతను అలాగే ఉంచింది.
- issue: δικαίου యొక్క లింగపరమైన సూచన
  choice: సాధారణంగా నీతిమంతుడైన వ్యక్తిని సూచించే ‘నీతిమంతుని’
  alternative: కేవలం పురుషుడైన నీతిమంతుడు
  rationale: గ్రీకు పురుషలింగ ఏకవచనం ఇక్కడ సుభాషిత శైలిలో సాధారణ వ్యక్తిని సూచిస్తుంది; తెలుగు రూపం సందర్భానుసారం సాధారణ మానవ సూచనగా చదవబడుతుంది.
- issue: ἐνεργουμένη యొక్క వాచ్యం మరియు ప్రార్థన ప్రభావం
  choice: కార్యసాధకంగా ఉన్నప్పుడు
  alternative: కార్యరూపంలో ఉన్నది; ప్రభావితం చేయబడినది
  rationale: ఈ మధ్యమ/కర్మణి participle ను కేవలం మానవ కృషి వల్ల పనిచేసేదిగా గానీ, బయటినుంచి శక్తినింపబడేదిగా గానీ నిర్ధారించకుండా దాని నిజమైన వ్యాకరణ అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఒప్పుకోండి’, ‘స్వస్థత’, ‘విజ్ఞాపన’ వంటి పదాలు మూలంలోని నైతిక, స్వస్థత, ప్రార్థన భావాలను కాపాడుతాయి. పాదసూచిక [a] SBLGNT apparatus లో οὖν పక్కనున్న variant గుర్తును ప్రతిబింబిస్తుంది; [b] ἐνεργουμένη యొక్క క్లిష్టమైన participial నిర్మాణానికి ప్రత్యామ్నాయాన్ని ఇస్తుంది.
