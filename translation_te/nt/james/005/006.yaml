id: JAS.5.6
reference: James 5:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατεδικάσατε, ἐφονεύσατε τὸν δίκαιον. οὐκ ἀντιτάσσεται ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/005/006.yaml
  text: You condemned[a], you murdered the righteous one[b]. He does not resist you.
translation:
  language: te
  text: మీరు నీతిమంతుణ్ణి[a] దోషిగా తీర్చారు; మీరు అతణ్ణి హత్య చేశారు. అతడు మిమ్మల్ని ఎదిరించడం లేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీతిమంతుడు’ అనే మాటను కొందరు యేసుకు సంబంధించిన సాధ్యమైన ప్రతిధ్వనిగా అర్థం చేసుకుంటారు. అయితే తక్షణ సందర్భంలో ఇది ధనవంతుల చేత అణచివేయబడిన ప్రతినిధి నీతిమంతుణ్ణి కూడా సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: 'గ్రీకులో ప్రశ్నగా కూడా చదవవచ్చు: “అతడు మిమ్మల్ని ఎదిరించడం లేదా?” ప్రధాన పాఠ్యంలో ఆ అలంకారిక ప్రశ్న ఉద్దేశించిన భావాన్ని వాక్యరూపంలో ఇచ్చాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδικάσατε
  choice: దోషిగా తీర్చారు
  rationale: న్యాయపరమైన ఖండన లేదా దోషనిర్ణయం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. భూతకాల క్రియ మూలంలోని aorist ఆరోపణాత్మక శైలిని నిలుపుతుంది.
- source_word: ἐφονεύσατε
  choice: హత్య చేశారు
  rationale: φονεύω కేవలం చంపడం కంటే అన్యాయంగా ప్రాణం తీయడం అనే బలమైన నైతిక భావాన్ని కలిగిస్తుంది; ‘హత్య చేశారు’ ఆ తీవ్రతను నిలుపుతుంది.
- source_word: τὸν δίκαιον
  choice: నీతిమంతుణ్ణి
  rationale: ఆర్టికల్‌తో వచ్చిన పుంలింగ ఏకవచన విశేషణం నామవాచకంగా వాడబడింది. ‘నీతిమంతుణ్ణి’ అనే రూపం ఒక ప్రతినిధి నీతిమంతునికీ, ప్రత్యేకంగా గుర్తించబడిన ‘నీతిమంతుడు’ అనే సాధ్యమైన భావానికీ తావిస్తుంది.
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: అతడు మిమ్మల్ని ఎదిరించడం లేదు
  rationale: ἀντιτάσσομαι అంటే ఎదిరించడం లేదా ప్రతిఘటించడం. ప్రధాన పాఠ్యంలో వాక్యరూపంగా ఇవ్వడం సందర్భంలోని అణచివేతను సహజంగా తెలియజేస్తుంది; గ్రీకు ప్రశ్నార్థక విరామచిహ్నాన్ని పాదసూచికలో నిలుపుతున్నాం.
theological_decisions:
- issue: ‘నీతిమంతుడు’ ఎవరిని సూచిస్తున్నాడు?
  choice: ధనవంతుల చేత అణచివేయబడిన ప్రతినిధి నీతిమంతుడు; ప్రధాన పాఠ్యంలో దీనిని యేసుకు ప్రత్యేకమైన బిరుదుగా నిర్ధారించలేదు.
  alternative: ‘నీతిమంతుడు’ అనే యేసు బిరుదుకు పరోక్ష సూచన.
  rationale: తక్షణ సందర్భం ధనిక అణచివేతదారుల చేత బాధపడే నీతిమంతుని సాధారణ లేదా ప్రతినిధి భావానికి మద్దతిస్తుంది. అయినా, యేసును ‘నీతిమంతుడు’గా సూచించే ప్రతిధ్వని సాధ్యమే; అందువల్ల దానిని పాదసూచికలో పేర్కొని theological tension ను నిలుపుతున్నాం.
- issue: చివరి ఉపవాక్య స్వరూపం
  choice: 'అలంకారిక ప్రశ్న యొక్క ఉద్దేశిత భావాన్ని వాక్యంగా: ‘అతడు మిమ్మల్ని ఎదిరించడం లేదు.’'
  alternative: 'ప్రశ్నగా: ‘అతడు మిమ్మల్ని ఎదిరించడం లేదా?’'
  rationale: SBLGNT దీనికి ప్రశ్నార్థక విరామచిహ్నం ఇస్తుంది. అయితే సందర్భంలో అది ఎదిరించని నీతిమంతుని గురించి చెప్పే అలంకారిక ప్రశ్నగా గ్రహించబడుతుంది. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు వాక్యరూపాన్ని ఉంచి, రూపపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, నేరుగా ఆరోపించే శైలి. మూలంలోని రెండు బలమైన క్రియలను వేర్వేరుగా ఉంచి పునరుక్త ‘మీరు’ను నిలిపాం. ‘నీతిమంతుణ్ణి’ సాధారణ ప్రతినిధి భావాన్నీ, సాధ్యమైన ప్రత్యేక బిరుదు భావాన్నీ ముందుగానే తేల్చకుండా ఉంచుతుంది.
