  source_fidelity: ‘మీరు నీతిమంతుణ్ణి దోషిగా తీర్చారు; మీరు అతణ్ణి హత్య చేశారు’ accurately represents the two aorist accusations, retaining both the judicial force of κατεδικάσατε and the grave force of ἐφονεύσατε. ‘అతడు మిమ్మల్ని ఎదిరించడం లేదు’ is a defensible declarative rendering of the final rhetorically punctuated clause; the interrogative form is appropriately retained in the footnote.
  naturalness: The Telugu is clear, modern standard, and suitably forceful for James’s prophetic denunciation. Repetition of ‘మీరు’ is natural for emphasis, and ‘అతణ్ణి’ makes the object of ‘హత్య చేశారు’ explicit.
  terminology: ‘నీతిమంతుణ్ణి’ faithfully preserves the masculine singular substantival adjective without prematurely making it a fixed christological title. ‘దోషిగా తీర్చారు’ and ‘హత్య చేశారు’ are idiomatic and semantically apt. The note preserves the possible Jesus-related echo without imposing it.
