id: JAS.5.14
reference: James 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: te
  text: మీలో ఎవరైనా అనారోగ్యంతో ఉన్నారా?[a] అతడు సంఘ పెద్దలను పిలిపించాలి. వారు ప్రభువు నామంలో అతనికి నూనె రాసి[b], అతనిపై ప్రార్థించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీలో ఎవరైనా బలహీనంగా ఉన్నారా?” గ్రీకు క్రియ విస్తృతమైన బలహీనతను సూచించగలదు. అయితే ఇక్కడ ప్రార్థన, నూనె రాయడం, తదుపరి వచనంలోని స్వస్థత సందర్భం కారణంగా అనారోగ్యమే ప్రధాన భావంగా కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: నూనె రాయడాన్ని ఔషధపరమైన చర్యగా, ప్రతీకాత్మక చర్యగా, లేదా రెండూ కలిసిన చర్యగా అర్థం చేసుకోవచ్చు; దాని కార్యవిధానాన్ని పాఠ్యం స్పష్టంగా చెప్పదు.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: అనారోగ్యంతో ఉన్నారా
  rationale: ఈ క్రియ సాధారణ బలహీనతను కూడా సూచించగలదు; అయితే పెద్దలను పిలిపించడం, నూనె రాయడం, ప్రార్థన, తదుపరి వచనంలోని స్వస్థత సందర్భం ఇక్కడ శారీరక అనారోగ్యాన్ని ప్రధానంగా సూచిస్తున్నాయి.
- source_word: τις ἐν ὑμῖν
  choice: మీలో ఎవరైనా
  rationale: సమాజంలోని ఏ వ్యక్తినైనా ఉద్దేశించే అనిర్దిష్టమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: προσκαλεσάσθω
  choice: పిలిపించాలి
  rationale: తన దగ్గరకు రావాలని సంఘ పెద్దలను కబురు చేసి పిలవడం అనే మధ్యమ క్రియ భావాన్ని, ఆజ్ఞార్థక బలాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: τοὺς πρεσβυτέρους τῆς ἐκκλησίας
  choice: సంఘ పెద్దలను
  rationale: ఇక్కడ πρεσβύτεροι కేవలం వయోవృద్ధులు కాక, సంఘంలో గుర్తింపు పొందిన నాయకులు. ‘సంఘ పెద్దలు’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో స్పష్టమైన పదబంధం.
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: అతని మీద ప్రార్థన చేయాలి
  rationale: ἐπίతో కూడిన ప్రయోగంలోని ‘మీద/పై’ భావాన్ని నిలుపుతూ, రోగి సమక్షంలో అతని మీద చేయబడే ప్రార్థనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: అతనికి నూనె రాసి
  rationale: ἀλείφω శరీరానికి నూనె పూయడం లేదా రాయడం అనే క్రియ. ఈ అనువాదం ఆ చర్యను స్పష్టంగా చెబుతుంది; అది ఔషధపరమైనదా, ప్రతీకాత్మకమైనదా, లేక రెండూ కలిసినదా అని నిర్ణయించదు.
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: ప్రభువు నామంలో
  rationale: ప్రభువు వ్యక్తి మరియు అధికారంతో సంబంధం కలిగిన చర్య అనే బైబిలీయ నుడికారాన్ని నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριοςకు గౌరవప్రదమైన, ప్రామాణిక తెలుగు సమానార్థకం; గ్రీకులో ఉన్న బిరుదునే నిలుపుతుంది.
theological_decisions:
- issue: ἀσθενεῖ పదం సూచించే స్థితి
  choice: ప్రధాన పాఠ్యంలో శారీరక అనారోగ్యం
  alternative: బలహీనత లేదా సాధారణ దుర్బలత
  rationale: ప్రార్థన, నూనె రాయడం, తరువాతి వచనంలోని స్వస్థత సందర్భం శారీరక అనారోగ్యాన్ని బలంగా సూచిస్తాయి; అయినా పదానికి ఉన్న విస్తృత అర్థాన్ని పాదసూచికలో నిలిపాం.
- issue: నూనె రాయడం యొక్క ఉద్దేశం
  choice: ఉద్దేశం లేదా కార్యవిధానాన్ని నిర్ధారించకుండా చర్యను తటస్థంగా అనువదించడం
  alternative: ఔషధ చికిత్స, ప్రతీకాత్మక చర్య, లేదా సంస్కార కర్మ అని ప్రత్యేకంగా నిర్ధారించడం
  rationale: గ్రీకు పాఠ్యం నూనె రాయాలని చెబుతుంది గాని, అది ఎలా పనిచేస్తుందో లేదా దాని ఖచ్చితమైన ధార్మిక స్వభావమేమిటో చెప్పదు.
- issue: ఏకవచన వ్యక్తి ప్రస్తావన
  choice: ‘ఎవరైనా’ తరువాత ‘అతడు/అతనికి/అతని’
  alternative: పూర్తిగా లింగనిరపేక్షమైన బహువచన నిర్మాణం
  rationale: ‘ఎవరైనా’ ద్వారా ఆహ్వానం అందరికీ వర్తిస్తుందని సహజంగా తెలిపి, తరువాత గ్రీకు ఏకవచన ప్రవాహాన్ని తెలుగులో స్పష్టంగా నిలిపాం.
- issue: ‘ప్రభువు’ అనే బిరుదు ఎవరిని సూచిస్తుంది
  choice: గ్రీకు పాఠ్యంలోని ‘ప్రభువు’ అనే బిరుదునే అనువదించడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘ప్రభువైన యేసు’ అని విస్తరించడం
  rationale: క్రైస్తవ సంఘ సందర్భంలో ఇది సహజంగా యేసును సూచించవచ్చు; అయితే మూలపాఠ్యం పేరును చేర్చనందున అనువాదం కూడా బిరుదునే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూడవ పురుష ఆజ్ఞార్థకాలను కృత్రిమమైన ‘చేయనివ్వండి’ రూపాలకంటే సహజమైన ‘చేయాలి’ రూపంలో ఇచ్చాం. ‘సంఘ పెద్దలు,’ ‘ప్రభువు నామంలో’ వంటి స్థిరమైన బైబిలీయ పదబంధాలను సాధారణ పాఠకులకు అర్థమయ్యేలా నిలిపాం.
