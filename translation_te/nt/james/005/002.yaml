  text: Your wealth has rotted, and your clothes have become moth-eaten.
translation:
  language: te
  text: మీ సంపద కుళ్లిపోయింది; మీ బట్టలు చిమ్మటలు తిని పాడైపోయాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλοῦτος
  choice: సంపద
  rationale: సమకూర్చుకున్న భౌతిక ఆస్తిని సూచించే సహజమైన ఆధునిక తెలుగు పదం; ధనవంతులపై యాకోబు చేస్తున్న ఖండనకు సరిపోతుంది.
- source_word: σέσηπεν
  choice: కుళ్లిపోయింది
  rationale: పూర్తయిన క్షయక్రియ వల్ల ప్రస్తుతం ఏర్పడిన స్థితిని గ్రీకు perfect సూచిస్తుంది; ఈ తెలుగు రూపం ఆ క్రియను, దాని ఫలిత స్థితిని రెండింటినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἱμάτια
  choice: బట్టలు
  rationale: సాధారణంగా దుస్తులను సూచించే, అందరికీ అర్థమయ్యే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: σητόβρωτα
  choice: చిమ్మటలు తిని పాడైపోయాయి
  rationale: చిమ్మటలు తినడం అనే స్పష్టమైన దృశ్యాన్ని సహజ తెలుగులో నిలుపుతూ, దాని వల్ల కలిగిన నాశన స్థితిని తెలియజేస్తుంది.
- source_word: γέγονεν
  choice: పాడైపోయాయి
  rationale: దుస్తులు ఒక నాశన స్థితికి చేరి ఇప్పుడు అదే స్థితిలో ఉన్నాయనే perfect రూపపు ఫలిత భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. మూలంలోని రెండు perfect క్రియల ఫలిత స్థితి ‘కుళ్లిపోయింది,’ ‘పాడైపోయాయి’ అనే రూపాల్లో నిలుపబడింది; పద్యంలోని స్పష్టమైన క్షయచిత్రణను మృదువుపరచలేదు.
