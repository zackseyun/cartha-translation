id: JAS.5.7
reference: James 5:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: te
  text: కాబట్టి సహోదరులారా[a], ప్రభువు రాక[b] వరకు ఓపిక పట్టండి. చూడండి, రైతు భూమి పండించే విలువైన పంట కోసం ఎదురుచూస్తాడు; అది తొలకరి, కడవరి వర్షాలను పొందే వరకు దాని విషయంలో ఓపికగా ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదర సహోదరీలారా’ అని కూడా భావించవచ్చు; గ్రీకులో ‘సహోదరులు’ అని ఉన్నా, ఈ విధమైన సంబోధన తరచుగా విశ్వాససమాజమంతటినీ ఉద్దేశిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: ‘రాక’కు ఉపయోగించిన గ్రీకు పదానికి ‘సన్నిధి’ అనే అర్థం కూడా ఉంది; ఇక్కడ అది ప్రభువు భవిష్యత్తులో రావడాన్ని సూచిస్తున్నట్లు సందర్భం తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακροθυμήσατε / μακροθυμῶν
  choice: ఓపిక పట్టండి / ఓపికగా ఉంటాడు
  rationale: దీర్ఘకాలం సహనంతో ఎదురుచూడటాన్ని తెలిపే ఒకే గ్రీకు మూలపదం రెండుసార్లు వచ్చింది. తెలుగులో సహజంగా ఉండేలా, ఆ పునరుక్త సంబంధాన్ని ‘ఓపిక’తో నిలిపాం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి సందర్భం నుంచి తీసుకున్న నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు పుంలింగ బహువచన సంబోధనను నిలిపి, తెలుగు విశ్వాససమాజ భాషలో సహజమైన పదాన్ని వాడాం; సమాజమంతటికీ వర్తించే భావాన్ని పాదటీకలో తెలిపాం.
- source_word: παρουσίας τοῦ κυρίου
  choice: ప్రభువు రాక
  rationale: ఈ అంత్యకాల నిరీక్షణ సందర్భంలో παρουσία ప్రభువు భవిష్యత్తులో రావడాన్ని సూచిస్తుంది; ‘సన్నిధి’ అనే మూలార్థ సాధ్యతను పాదటీకలో ఉంచాం.
- source_word: ἰδοὺ
  choice: చూడండి
  rationale: ఉదాహరణవైపు పాఠకుని దృష్టిని మళ్లించే ఆదేశ బలాన్ని ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: γεωργὸς
  choice: రైతు
  rationale: వ్యవసాయం చేసే వ్యక్తికి సాధారణంగా అర్థమయ్యే సహజ తెలుగు సమానార్థకం.
- source_word: ἐκδέχεται
  choice: ఎదురుచూస్తూ
  rationale: నిరీక్షణతో కూడిన నిరంతర ఎదురుచూపును వ్యక్తం చేస్తుంది.
- source_word: τὸν τίμιον καρπὸν τῆς γῆς
  choice: నేల ఇచ్చే విలువైన పంట
  rationale: τίμιοςలోని విలువ, కోరదగినత భావాన్ని ‘విలువైన’ నిలుపుతుంది; వ్యవసాయ సందర్భంలో καρπόςను ‘పంట’గా అనువదించడం సాధారణ పాఠకునికి సహజం.
- source_word: ἐπ’ αὐτῷ
  choice: దానికి ... ఓపికగా
  rationale: సర్వనామం పంటను సూచిస్తున్నదని సహజంగా గ్రహించి, రైతు దాని విషయమై చూపే సహనాన్ని తెలుగులో సులభంగా వ్యక్తం చేశాం.
- source_word: ἕως λάβῃ πρόϊμον καὶ ὄψιμον
  choice: దానికి తొలకరి వానలు, కడవరి వానలు అందే వరకు
  rationale: గ్రీకులో ‘వాన’ అనే నామవాచకం అధ్యాహారంగా ఉంది. తెలుగు పాఠకునికి అర్థం స్పష్టమయ్యేలా దాన్ని వెల్లడించి, పంట వానలను పొందే భావాన్ని నిలిపాం.
theological_decisions:
- issue: ἀδελφοί అనే లింగసూచక సంబోధన
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా
  rationale: మూలంలోని వ్యాకరణ పుంలింగాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; అయితే ఈ సంబోధన విశ్వాససమాజమంతటినీ ఉద్దేశించగలదని పాదటీక స్పష్టం చేస్తుంది.
- issue: παρουσία τοῦ κυρίου
  choice: ప్రభువు రాక
  alternative: ప్రభువు సన్నిధి
  rationale: యాకోబు చేస్తున్న భవిష్యత్ నిరీక్షణ ప్రబోధంలో ‘రాక’ సందర్భానికి అత్యంత సహజం; ప్రత్యేక అంత్యకాల సిద్ధాంత పద్ధతిని పాఠ్యంలోకి దిగుమతి చేయలేదు.
- issue: తొలకరి, కడవరి వానల రూపకం
  choice: వ్యవసాయ నిరీక్షణను యథాతథంగా నిలపడం
  alternative: సాధారణంగా ‘వానాకాలం’ అని మార్చడం
  rationale: పాలస్తీనా వ్యవసాయ చక్రంలోని రెండు కాలపు వానల ప్రత్యేక చిత్రాన్ని మూలానికి అనుగుణంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకునికి సులభమైన శైలి. ‘సహోదరులారా’, ‘ప్రభువు’ వంటి పరిచితమైన బైబిలు పదాలను నిలిపి, కృత్రిమంగా లేదా ప్రాచీనంగా వినిపించే నిర్మాణాలను నివారించాం. గ్రీకులో రెండుసార్లు వచ్చిన μακροθυμ- భావాన్ని ‘ఓపిక’ పునరావృతితో ప్రతిబింబించాం.
