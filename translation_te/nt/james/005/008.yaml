source:
  edition: SBLGNT
  text: μακροθυμήσατε καὶ ὑμεῖς, στηρίξατε τὰς καρδίας ὑμῶν, ὅτι ἡ παρουσία τοῦ κυρίου ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: te
  text: మీరు కూడా సహనంతో ఉండండి; మీ హృదయాలను దృఢపరచుకోండి, ఎందుకంటే ప్రభువు రాక[a] సమీపించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రభువు సన్నిధి.” గ్రీకు పదానికి “సన్నిధి” లేదా “రాక” అనే అర్థాలు ఉండవచ్చు; ఈ సందర్భంలో అది అంత్యకాలంలో ప్రభువు రాకను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: సహనంతో ఉండండి
  rationale: కష్టాల మధ్య దీర్ఘకాలం ఓపికగా నిలిచే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఇది బహువచన ఆజ్ఞారూపాన్ని కూడా నిలుపుతుంది.
- source_word: καὶ ὑμεῖς
  choice: మీరు కూడా
  rationale: ముందటి వచనంలోని ఉదాహరణతో పాఠకులను అనుసంధానిస్తూ, గ్రీకు వాక్యంలోని నొక్కిచెప్పే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: στηρίξατε
  choice: దృఢపరచుకోండి
  rationale: స్థిరపరచడం, బలపరచడం అనే భావాన్ని ‘హృదయాలు’ అనే రూపకంతో సహజంగా కలుపుతుంది; అంతరంగ ధైర్యాన్ని స్థిరం చేసుకోవాలనే ఆజ్ఞను తెలియజేస్తుంది.
- source_word: τὰς καρδίας ὑμῶν
  choice: మీ హృదయాలను
  rationale: సంకల్పం, ధైర్యం, అంతరంగ వ్యక్తిత్వాన్ని సూచించే బైబిలు రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న రెండు ఆజ్ఞలకు కారణాన్ని స్పష్టంగా పరిచయం చేసే సహజమైన కారణార్థక సంధాన పదం.
- source_word: ἡ παρουσία
  choice: రాక
  rationale: యాకోబు 5:7–8లోని భవిష్యద్ నిరీక్షణ సందర్భంలో ప్రభువు రాక లేదా ఆగమనాన్ని సూచిస్తుంది; పదానికి ‘సన్నిధి’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలుపుతున్నాం.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: కొత్త నిబంధనలో యేసుకు వాడే κύριος బిరుదుకు సాధారణమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: ἤγγικεν
  choice: సమీపించింది
  rationale: గ్రీకు పరిపూర్ణ కాలం సూచించే, దగ్గరకు వచ్చి ఇప్పుడు సమీపంగా ఉన్న స్థితిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రభువును గురించి అంత్యకాల సందర్భంలో παρουσία అనే పదం అర్థం
  choice: ప్రభువు రాక
  alternative: ప్రభువు సన్నిధి
  rationale: యాకోబు 5:7–8లో ప్రభువు కోసం ఎదురుచూడమనే భవిష్యద్ దృష్టిగల సందర్భం ‘రాక’ను ప్రధాన అర్థంగా సూచిస్తుంది. అయితే παρουσία అనే పదానికి ‘సన్నిధి’ అనే నిజమైన పదార్థ పరిధి కూడా ఉన్నందున దాన్ని పాదసూచికలో ఇచ్చి సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘హృదయాలు’ అనే బైబిలు రూపకాన్ని నిలిపి, ఆజ్ఞల బహువచన భావాన్ని స్పష్టంగా వ్యక్తం చేశాం.
