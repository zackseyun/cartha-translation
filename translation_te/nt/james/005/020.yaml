id: JAS.5.20
reference: James 5:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: te
  text: పాపిని తన తప్పుదారి నుండి వెనక్కి తిప్పినవాడు అతని ప్రాణాన్ని మరణం నుండి రక్షిస్తాడనీ, అనేక పాపాలను కప్పివేస్తాడనీ తెలుసుకోవాలి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని జీవితాన్ని మరణం నుండి రక్షిస్తాడు.” గ్రీకు పదానికి “ప్రాణం” లేదా “జీవితం” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “అతని” అనేది వెనక్కి తిప్పబడిన పాపిని సూచించవచ్చు; కొందరు అది అతన్ని వెనక్కి తిప్పినవానిని సూచిస్తుందని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: తెలుసుకోవాలి
  rationale: మూడవ పురుష ఏకవచన వర్తమాన ఆజ్ఞార్థక రూపంలోని ప్రబోధక బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ ἐπιστρέψας
  choice: వెనక్కి తిప్పినవాడు
  rationale: దారి తప్పిన వ్యక్తిని తిరిగి నడిపించే పునరుద్ధరణ భావాన్ని తెలియజేస్తుంది; సాంకేతిక మతపరమైన అర్థాన్ని అనవసరంగా చేర్చదు.
- source_word: ἁμαρτωλὸν
  choice: పాపిని
  rationale: అనిర్దిష్టంగా, సాధారణ వర్గాన్ని సూచించే గ్రీకు ప్రయోగాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: తన తప్పుదారి నుండి
  rationale: πλάνη లోని తప్పు/దారితప్పడం భావాన్ని, ὁδός లోని జీవనమార్గ రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: σώσει
  choice: రక్షిస్తాడు
  rationale: భవిష్యత్ సూచనను, σῴζω పదంలోని రక్షణ బరువును నిలుపుతుంది.
- source_word: ψυχὴν αὐτοῦ
  choice: అతని ప్రాణాన్ని
  rationale: ψυχήకు ప్రాణం లేదా జీవితం అనే విస్తృత అర్థాలు ఉండగలవు. 'ప్రాణం' మరణం నుండి రక్షించడం అనే సందర్భంలో సహజంగా ఉండి, కేవలం శరీరరహిత ఆత్మ అనే సంకుచిత భావానికి పరిమితం చేయదు. αὐτοῦ యొక్క పూర్వపద సందిగ్ధతను 'అతని' నిలుపుతుంది.
- source_word: ἐκ θανάτου
  choice: మరణం నుండి
  rationale: శారీరకమా ఆధ్యాత్మికమా అని మూలపాఠం నిర్దిష్టం చేయనందున విస్తృత పదాన్నే నిలుపుతుంది.
- source_word: καλύψει
  choice: కప్పివేస్తాడు
  rationale: పాపాలను కప్పడం అనే బైబిలీయ నుడికారాన్ని వివరణతో సంకుచితం చేయకుండా నిలుపుతుంది.
- source_word: πλῆθος ἁμαρτιῶν
  choice: అనేక పాపాలను
  rationale: సమూహ పరిమాణాన్ని ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ψυχὴν αὐτοῦ లో αὐτοῦ ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో 'అతని' అని ఉంచి పూర్వపదాన్ని నిర్దిష్టం చేయలేదు
  alternative: తిరిగి తిప్పబడిన పాపి ప్రాణం; లేదా అతన్ని వెనక్కి తిప్పినవాని ప్రాణం
  rationale: గ్రీకు సర్వనామం వ్యాకరణపరంగా సందిగ్ధంగా ఉంది. ప్రధాన పాఠం ఆ సందిగ్ధతను నిలుపుతుంది; పాదసూచిక రెండు అవగాహనలను తెలియజేస్తుంది.
- issue: ψυχή మరియు θάνατος యొక్క భావపరిధి
  choice: '''ప్రాణం'' మరియు ''మరణం'' అనే విస్తృత పదాలను ఉంచడం'
  alternative: '''జీవితం ... మరణం నుండి''; లేదా ''ఆత్మ ... ఆధ్యాత్మిక మరణం నుండి'''
  rationale: వాక్యం జీవరక్షణను, ఆధ్యాత్మిక రక్షణను, లేదా రెండింటినీ సూచించగలదు. ఒక నిర్దిష్ట సిద్ధాంత వివరణకు పాఠాన్ని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. 'తప్పుదారి' ద్వారా πλάνη–ὁδός దిశాత్మక రూపకం నిలుపబడింది. పాదసూచిక సూచికలు ప్రధాన పాఠంలో [a][b]గా చేర్చబడ్డాయి.
