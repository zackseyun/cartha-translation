id: JAS.3.18
reference: James 3:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καρπὸς ⸀δὲ δικαιοσύνης ἐν εἰρήνῃ σπείρεται τοῖς ποιοῦσιν εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/018.yaml
  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: te
  text: మరియు నీతి ఫలం[a] శాంతిలో, శాంతిని నెలకొల్పేవారిచేత[b] విత్తబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘న్యాయ ఫలం.’ గ్రీకు పదం నైతికమైన నీతితోపాటు సంబంధపరమైన లేదా న్యాయపరమైన భావాలను కూడా కలిగి ఉండగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘శాంతిని నెలకొల్పేవారికోసం.’ గ్రీకు దత్తివిభక్తిని వేరుగా అర్థం చేసుకోవచ్చు; అయితే ఇక్కడ కర్మణి క్రియ ఉన్నందున ‘వారిచేత’ అనే భావమే సందర్భానికి బాగా సరిపోతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: ఫలం
  rationale: ఏకవచన నామవాచకంలోని ఫల రూపకాన్ని నేరుగా నిలుపుతుంది; ‘పంట’ సందర్భానికి సరిపోవచ్చుగాని మూలపద రూపకానికి ‘ఫలం’ మరింత సమీపం.
- source_word: δὲ
  choice: మరియు
  rationale: ఇక్కడ బలమైన వ్యతిరేకతకన్నా ముందటి వాక్యంతో మృదువైన అనుసంధానాన్ని సూచిస్తుంది.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: నైతిక సత్ప్రవర్తనతోపాటు సంబంధపరమైన లేదా న్యాయపరమైన భావసూచనను కూడా కలిగించగల పదం. ప్రధాన పాఠ్యంలో సాధారణమైన ‘నీతి’ని ఉంచి, ‘న్యాయం’ అనే భావాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: ἐν εἰρήνῃ
  choice: శాంతిలో
  rationale: విత్తడం జరిగే తీరు లేదా పరిధి—ఈ రెండింటిలో ఏ భావమో ఖచ్చితంగా తేల్చకుండా మూలంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: σπείρεται
  choice: విత్తబడుతుంది
  rationale: గ్రీకు వర్తమానకాల కర్మణి రూపాన్ని సహజమైన తెలుగు కర్మణి ప్రయోగంతో వ్యక్తం చేస్తుంది.
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: శాంతిని నెలకొల్పేవారిచేత
  rationale: ποιέω + εἰρήνην అనే క్రియాత్మక పదబంధాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది. కర్మణి క్రియతో ఉన్నందున కర్తృార్థక దత్తివుగా గ్రహించడం సందర్భానికి బాగా సరిపోతుంది.
theological_decisions:
- issue: ‘నీతి ఫలం’ అనే పదబంధపు భావం
  choice: నీతి లక్షణం గల ఫలం లేదా ఫలితం అనే భావాన్ని అనువాదంలో నిర్దిష్టంగా విడమరచకుండా ‘నీతి ఫలం’గా ఉంచడం.
  alternative: నీతియే ఫలంగా ఉండే పంట; లేదా నీతిని కలిగించే ఫలం.
  rationale: δικαιοσύνης అనే షష్ఠీ విభక్తి పదం వివరణాత్మకంగానో, సమానార్థకంగానో, ఫలితాన్ని సూచించేదిగానో గ్రహించవచ్చు. తెలుగు పదబంధం ఈ భావసంభావ్యతను అనవసరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే శైలిని వాడాం. ‘నీతి ఫలం,’ ‘శాంతిలో,’ ‘విత్తబడుతుంది’ అనే పదాలతో మూలంలోని వ్యవసాయ రూపకాన్ని, వ్యాకరణ సంబంధాల అస్పష్టతను సాధ్యమైనంతవరకు నిలిపాం.
