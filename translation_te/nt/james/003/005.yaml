id: JAS.3.5
reference: James 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ ⸂μεγάλα αὐχεῖ⸃. Ἰδοὺ ⸀ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: te
  text: అలాగే నాలుక కూడా చిన్న అవయవమే; అయినా అది గొప్పలు చెప్పుకుంటుంది. ఎంత చిన్న నిప్పు[a] ఎంత పెద్ద అడవిని[b] తగలబెడుతుందో చూడండి!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎంత గొప్ప నిప్పు ఎంత పెద్ద అడవిని తగలబెడుతుందో చూడండి!” గ్రీకు వాక్యాన్ని ఆశ్చర్యార్థకంగా ఇలా కూడా అర్థం చేసుకోవచ్చు. అయితే చిన్న అవయవమైన నాలుకతో ఉన్న పోలికను బట్టి ప్రధాన పాఠం చిన్న కారణం పెద్ద ఫలితాన్ని కలిగిస్తుందనే భావాన్ని అనుసరిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా “కలపను,” “దుంగలను,” లేదా “పొదలను.” గ్రీకు పదం మండగల పదార్థాన్ని లేదా అటవీ ప్రాంతాన్ని విస్తృతంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: నాలుక
  rationale: మాట అనే భావాన్ని మాత్రమే ఇవ్వకుండా, శరీర అవయవంతో చేసిన యాకోబు ప్రత్యక్ష రూపకాన్ని నిలుపుతుంది.
- source_word: μικρὸν μέλος
  choice: చిన్న అవయవం
  rationale: శరీర భాగం అనే చిత్రాన్ని స్పష్టంగా, ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: μεγάλα αὐχεῖ
  choice: గొప్పలు చెప్పుకుంటుంది
  rationale: గొప్ప విషయాల గురించి అతిశయంగా చెప్పుకోవడం అనే గ్రీకు నుడికార భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἰδοὺ
  choice: చూడండి
  rationale: తదుపరి ఉదాహరణవైపు పాఠకుని దృష్టిని మళ్లించే ఆదేశ భావాన్ని ఆధునిక, గౌరవప్రదమైన భాషలో నిలుపుతుంది.
- source_word: ἡλίκον πῦρ
  choice: ఎంత చిన్న నిప్పు
  rationale: చిన్న అవయవమైన నాలుకతో ఉన్న తక్షణ పోలికకు అనుగుణంగా, చిన్న కారణం గొప్ప ఫలితాన్ని కలిగిస్తుందనే భావాన్ని వ్యక్తం చేస్తుంది; గ్రీకు పదబంధానికి మరో అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: ἡλίκην ὕλην
  choice: ఎంత పెద్ద అడవి
  rationale: ὕλη ఇక్కడ మండగల కలప సముదాయం లేదా అటవీ ప్రాంతాన్ని సూచించగలదు; అగ్ని వ్యాపించే దృశ్యానికి ‘అడవి’ సహజంగా సరిపోతుంది.
- source_word: ἀνάπτει
  choice: తగలబెడుతుంది
  rationale: నిప్పు పెద్ద అడవికి అంటుకొని మండేలా చేయడాన్ని స్పష్టమైన, ప్రస్తుత వాడుక తెలుగులో తెలియజేస్తుంది.
