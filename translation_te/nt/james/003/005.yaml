  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. ‘నాలుక,’ ‘చిన్న అవయవం’ అనే ప్రత్యక్ష శరీర రూపకాన్ని నిలిపి, గ్రీకు వాక్యంలో ఉన్న పరిమాణ సంబంధమైన అర్థసాధ్యతను పాదసూచికలో సంరక్షించాం.
