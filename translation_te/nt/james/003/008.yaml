id: JAS.3.8
reference: James 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: te
  text: కాని మనుష్యుల్లో ఎవ్వరూ నాలుకను మచ్చిక చేయలేరు.[a] అది నిలకడలేని కీడు, ప్రాణాంతకమైన విషంతో నిండినది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత సరళంగా: “ఏ మనిషీ నాలుకను మచ్చిక చేయలేడు.”'
    reason: alternative_reading
  - marker: b
    text: లేదా “అదుపులేని కీడు” లేదా “చంచలమైన కీడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: నాలుకను
  rationale: శరీర అవయవాన్ని సూచించే మూలపదాన్ని నిలుపుతూ, మానవ మాటకు యాకోబు ఉపయోగిస్తున్న రూపకాన్ని మరియు ముందున్న వచనాలతో సంబంధాన్ని కాపాడుతుంది.
- source_word: οὐδεὶς ... ἀνθρώπων
  choice: మనుష్యుల్లో ఎవ్వరూ
  rationale: οὐδείς‌తో ἀνθρώπων‌ను భాగసూచక షష్ఠీగా గ్రహించి, ‘మనుష్యుల్లో ఒక్కరూ కాదు’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δαμάσαι δύναται
  choice: మచ్చిక చేసుకోలేరు
  rationale: జంతువులను మచ్చిక చేయడం గురించి ముందున్న సందర్భంతో క్రియాసంబంధాన్ని నిలుపుతుంది; కేవలం ‘అదుపు చేయడం’కన్నా మూలంలోని జంతు-మచ్చిక చిత్రాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἀκατάστατον
  choice: నిలకడలేని
  rationale: అస్థిరత, చంచలత్వం, అదుపులేమి వంటి మూలపద విస్తృతిని అతిగా సంకుచితం చేయకుండా దాని ప్రాథమిక భావాన్ని నిలుపుతుంది.
- source_word: κακόν
  choice: కీడు
  rationale: నాలుకను కేవలం ఇబ్బందికరమైనదిగా కాక, నైతికంగా చెడును మరియు హానిని కలిగించేదిగా వర్ణించే బలాన్ని వ్యక్తం చేస్తుంది.
- source_word: μεστὴ
  choice: నిండినది
  rationale: మూలంలోని స్పష్టమైన, బలమైన వర్ణనను సహజమైన తెలుగులో ఇస్తుంది.
- source_word: ἰοῦ θανατηφόρου
  choice: ప్రాణాంతకమైన విషంతో
  rationale: ఈ సందర్భంలో ἰός ‘విషం’ అనే అర్థంలోనూ θανατηφόρος ప్రాణాన్ని తీసేదనే అర్థంలోనూ ఉన్నాయి; ఈ పదబంధం రెండింటినీ సూటిగా అందిస్తుంది.
theological_decisions:
- issue: οὐδεὶς‌తో ἀνθρώπων‌కు లింగం మరియు మానవ-సమూహ భావం
  choice: మనుష్యుల్లో ఎవ్వరూ
  alternative: ఏ మనిషీ
  rationale: గ్రీకులోని మానవ సమూహానికి చెందిన ఒక్కరూ లేరనే భాగసూచక నిర్మాణాన్ని నిలుపుతూ, తెలుగులో అనవసరంగా పురుషులకు మాత్రమే పరిమితం కాని సాధారణ మానవ సూచనను ఇస్తుంది.
- issue: ἀκατάστατον యొక్క అర్థ పరిధి
  choice: నిలకడలేని
  alternative: అదుపులేని / చంచలమైన
  rationale: ఈ విశేషణం అస్థిరత, అశాంతి, క్రమరాహిత్యం వంటి పరస్పర సంబంధిత భావాలను కలిగి ఉంది. ప్రధాన పాఠం ఆ అస్పష్టతను కొంతవరకు నిలుపుతుంది; సందర్భానుసార ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. ‘మచ్చిక చేసుకోవడం’ ముందున్న జంతు-మచ్చిక రూపకాన్ని నిలుపుతుంది; ‘నిలకడలేని’ ἀκατάστατον‌లోని ఉద్దేశపూర్వక అర్థవిస్తృతిని పూర్తిగా ఒకే భావానికి కుదించదు.
