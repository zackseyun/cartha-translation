id: JAS.3.3
reference: James 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂εἰ δὲ⸃ τῶν ἵππων τοὺς χαλινοὺς εἰς τὰ στόματα βάλλομεν ⸀εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν, καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: te
  text: గుర్రాలు మన మాట వినేలా వాటి నోళ్లలో కళ్లెపు కడ్డీలు[a] పెడితే, వాటి శరీరమంతటినీ మనం నడిపిస్తాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కళ్లెములు”; అయితే ఇక్కడ గుర్రం నోటిలో పెట్టే కళ్లెపు కడ్డీనే మరింత నిర్దిష్టంగా సూచిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: పెడితే
  rationale: δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని తెలుగులో ప్రత్యేక పదంతో బలవంతంగా చూపకుండా, εἰ యొక్క షరతు భావాన్ని సహజమైన ‘పెడితే’ నిర్మాణంలో నిలిపింది.
- source_word: χαλινοὺς
  choice: కళ్లెపు కడ్డీలు
  rationale: గుర్రం నోటిలో పెట్టే భాగాన్ని సూచిస్తున్నందున, మొత్తం కళ్లెం అనే విస్తృత అర్థం కంటే ‘కళ్లెపు కడ్డీలు’ సందర్భానికి మరింత నిర్దిష్టం.
- source_word: εἰς τὰ στόματα βάλλομεν
  choice: వాటి నోళ్లలో ... పెడితే
  rationale: εἰς తో కూడిన βάλλομεν తెలిపే లోపలికి పెట్టే చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: మన మాట వినేలా
  rationale: ఇక్కడి ఉద్దేశార్థాన్ని, ἡμῖν తో πείθεσθαι తెలిపే విధేయతను అతిశయింపకుండా సహజంగా అందిస్తుంది.
- source_word: ὅλον τὸ σῶμα αὐτῶν
  choice: వాటి శరీరమంతటినీ
  rationale: గ్రీకు ఏకవచన σώμα యొక్క పంపిణీ భావాన్ని తెలుగు సమూహసూచక సందర్భంలో సహజంగా నిలిపింది.
- source_word: μετάγομεν
  choice: మనం నడిపించగలం
  rationale: గుర్రం మొత్తం కదలికను దిశానిర్దేశం చేయడం అనే భావాన్ని ‘నడిపించు’ స్పష్టంగా అందిస్తుంది; తెలుగు షరతు నిర్మాణంలో ‘గలం’ ఫలితసామర్థ్యాన్ని సహజంగా తెలియజేస్తుంది.
