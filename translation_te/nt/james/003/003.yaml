translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గుర్రపు సామగ్రికి సంబంధించిన అంతగా పరిచయం లేని పదాన్ని పాదటిప్పణితో వివరించాం.
