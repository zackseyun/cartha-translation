id: JAS.3.16
reference: James 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: te
  text: ఎందుకంటే ఈర్ష్య[a], స్వార్థపూరిత ఆశ ఎక్కడ ఉంటాయో, అక్కడ అస్తవ్యస్తత, ప్రతి నీచ కార్యమూ[b] ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అసూయ’ అని కూడా అనువదించవచ్చు. గ్రీకు పదానికి ‘ఉత్సాహం’ అనే అర్థం కూడా ఉండగలదు; అయితే ఇక్కడి సందర్భంలో దాని భావం స్పష్టంగా ప్రతికూలమైనది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ప్రతి చెడ్డ విషయం/పని.’ అక్షరార్థంగా, ‘ప్రతి నీచమైన విషయం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: ఎక్కడ ఉంటాయో
  rationale: ἐκεῖతో కలిసి ఉన్న ‘ఎక్కడ… అక్కడ…’ నిర్మాణాన్ని సహజమైన తెలుగు సంబంధ నిర్మాణంగా నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఈ వాక్యం ఇచ్చే వివరణాత్మక కారణ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ζῆλος
  choice: ఈర్ష్య
  rationale: 3:14–15 సందర్భంలో ఈ పదం ప్రతికూలమైన మనోభావాన్ని సూచిస్తుంది. ‘ఈర్ష్య’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది; ‘అసూయ’ కూడా సాధ్యమే.
- source_word: ἐριθεία
  choice: స్వార్థపూరిత ఆశ
  rationale: వ్యక్తిగత ప్రయోజనం కోసం ఇతరులతో పోటీపడే, తనను తాను ముందుకు తెచ్చుకునే ధోరణిని సాధారణ పాఠకులకు అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: ὅπουకు ప్రతిస్పందిస్తూ మూలంలోని ‘ఎక్కడ… అక్కడ…’ సూక్తి నిర్మాణాన్ని నిలుపుతుంది.
- source_word: ἀκαταστασία
  choice: అస్తవ్యస్తత
  rationale: కేవలం మానసిక అయోమయాన్ని కాకుండా, సంబంధాలు లేదా సమాజంలో ఏర్పడే క్రమరాహిత్యాన్ని సూచిస్తుంది.
- source_word: πᾶν
  choice: ప్రతి
  rationale: ఏకవచనమైన πρᾶγμαతో ఉన్న మూల నిర్మాణాన్ని సహజమైన తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: φαῦλον
  choice: నీచ
  rationale: నైతికంగా చెడ్డది, హీనమైనది అనే ప్రతికూల భావాన్ని బలంగా తెలియజేస్తుంది.
- source_word: πρᾶγμα
  choice: కార్యం
  rationale: అక్షరార్థంగా ‘విషయం’ లేదా ‘పని’ అని అర్థమవగలిగినా, ఈ నైతిక సందర్భంలో ‘కార్యం’ తప్పు ప్రవర్తనను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ζῆλος పదానికి సందర్భానుసారమైన నైతిక భావం
  choice: ప్రతికూల దుర్గుణంగా ‘ఈర్ష్య’
  alternative: తటస్థ లేదా అనుకూల భావంలోని ‘ఉత్సాహం’; లేదా ‘అసూయ’
  rationale: 3:14–15లో చేదైన ζῆλος, స్వార్థపూరిత ఆశ భూసంబంధమైన జ్ఞాన లక్షణాలుగా చెప్పబడ్డాయి. కాబట్టి ఇక్కడ అనుకూలమైన ‘ఉత్సాహం’ సరిపోదు; ‘ఈర్ష్య’ సందర్భంలోని దుర్గుణ భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ‘ఎక్కడ… అక్కడ…’ నిర్మాణం నిలుపబడింది. భాష గౌరవప్రదంగా ఉన్నప్పటికీ పాతకాలపు పదప్రయోగాలను నివారించింది.
