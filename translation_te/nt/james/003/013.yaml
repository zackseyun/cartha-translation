id: JAS.3.13
reference: James 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: te
  text: మీలో జ్ఞానవంతుడు, వివేకం గలవాడు ఎవడు?[a] అతడు తన మంచి ప్రవర్తన ద్వారా, జ్ఞానంతో కూడిన సౌమ్యతతో[b] తన కార్యాలను చూపించాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ఇక్కడ పుంలింగ ఏకవచన రూపం ఉంది; అయితే అది సమాజంలో ఇలాంటి లక్షణాలు గల ఏ వ్యక్తినైనా ప్రతినిధిగా సూచించగలదు.
    reason: cultural_note
  - marker: b
    text: లేదా, “జ్ఞానం వల్ల కలిగే సౌమ్యతతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν
  choice: మీలో జ్ఞానవంతుడు, వివేకం గలవాడు ఎవడు?
  rationale: రచయిత సమాజంలోని వ్యక్తిని ఉద్దేశించి వేసిన అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది. σοφόςకు ‘జ్ఞానవంతుడు’, ἐπιστήμωνకు నైతిక-ఆచరణాత్మక అవగాహనను సూచించే ‘వివేకం గలవాడు’ అని వేర్వేరు భావఛాయలతో అనువదించాం.
- source_word: δειξάτω
  choice: చూపించాలి
  rationale: మూడవ పురుష ఏకవచన ఆజ్ఞార్థక భావాన్ని, అతిగా ప్రాచీనంగా వినిపించే ‘చూపించుగాక’కు బదులుగా, సహజమైన తెలుగు ఆదేశ రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: తన మంచి ప్రవర్తన ద్వారా
  rationale: ἀναστροφή ఒకరి నిరంతర ప్రవర్తన లేదా జీవనరీతిని సూచిస్తుంది; ἐκ ఇక్కడ ఆ కార్యాలు కనిపించే ఆధారం లేదా మార్గాన్ని తెలియజేస్తుంది.
- source_word: τὰ ἔργα αὐτοῦ
  choice: తన కార్యాలను
  rationale: ἔργα యొక్క క్రియాత్మక భావాన్ని ‘కార్యాలు’ నిలుపుతుంది; αὐτοῦను సహజమైన ప్రతిబింబక సర్వనామం ‘తన’తో వ్యక్తం చేశాం.
- source_word: ἐν πραΰτητι σοφίας
  choice: జ్ఞానంతో కూడిన సౌమ్యతతో
  rationale: πραΰτηςలోని అదుపుగల మృదుత్వం, వినయశీలత అనే నైతిక భావాన్ని ‘సౌమ్యత’ తెలియజేస్తుంది. σοφίας అనే సంబంధ విభక్తి జ్ఞానం లక్షణంగా ఉన్న సౌమ్యతను గానీ, జ్ఞానం నుంచి కలిగే సౌమ్యతను గానీ సూచించవచ్చు; ప్రధాన పాఠం మొదటి భావానికి దగ్గరగా ఉండి సంబంధాన్ని పూర్తిగా కారణార్థకంగా నిర్ధారించదు.
theological_decisions:
- issue: పుంలింగ ఏకవచన రూపం మరియు ప్రతినిధి భావం
  choice: ఎవడు? అతడు ... చూపించాలి
  alternative: అలాంటి వ్యక్తి తన కార్యాలను చూపించాలి
  rationale: గ్రీకు పాఠంలోని పుంలింగ ఏకవచన రూపాన్ని ప్రధాన పాఠంలో నిలిపి, అది సంఘంలోని అటువంటి ఏ వ్యక్తినైనా ప్రతినిధిగా సూచించగలదని పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: σοφίας అనే సంబంధ విభక్తి భావం
  choice: జ్ఞానంతో కూడిన సౌమ్యతతో
  alternative: జ్ఞానం వల్ల కలిగే సౌమ్యతతో
  rationale: సంబంధ విభక్తి లక్షణాన్ని లేదా మూలాన్ని సూచించగలదు. ప్రధాన పాఠం లక్షణార్థక సంబంధాన్ని ఇస్తుంది; కారణం లేదా మూలం అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచి అసలు పాఠంలోని ఉద్వేగాన్ని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘సౌమ్యత’ నైతికంగా అదుపులో ఉన్న మృదుత్వాన్ని తెలియజేస్తుంది; ‘చూపించాలి’ ఆజ్ఞార్థక బలాన్ని సహజంగా అందిస్తుంది.
