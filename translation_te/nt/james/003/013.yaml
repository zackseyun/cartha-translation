  terminology: “జ్ఞానవంతుడు” and “వివేకం గలవాడు” distinguish wisdom from understanding/knowledge well in context. “కార్యాలు” retains the meaningful works/deeds terminology, while “సౌమ్యత” suitably conveys πραΰτης as a moral disposition rather than mere softness. The masculine singular and its representative force are responsibly retained and footnoted.
