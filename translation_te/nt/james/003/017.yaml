id: JAS.3.17
reference: James 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: te
  text: అయితే పైనుండి వచ్చే జ్ఞానం మొదట పవిత్రమైనది; తరువాత శాంతిని కోరేది, సౌమ్యమైనది, సమంజసమైన మాటను అంగీకరించేది, కనికరంతోనూ మంచి ఫలాలతోనూ నిండినది, పక్షపాతం లేనిది[a], నిష్కపటమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భేదభావం లేనిది.” ఇక్కడి గ్రీకు పదాన్ని “విభజిత మనస్సు లేనిది” లేదా “సందేహం లేనిది” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: ἀδιάκριτος అనే గ్రీకు విశేషణానికి సందర్భంలో ఒకటి కంటే ఎక్కువ సాధ్యమైన అర్థాలు ఉన్నాయి.
lexical_decisions:
- source_word: ἄνωθεν
  choice: పైనుండి వచ్చే
  rationale: యాకోబు 3:15లోని భూసంబంధమైన జ్ఞానానికి వ్యతిరేకంగా ఉన్న స్థలసూచక రూపకాన్ని నిలుపుతుంది; ‘పరలోకం నుండి’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: σοφία
  choice: జ్ఞానం
  rationale: ఈ సందర్భంలో వివరించబడుతున్న జ్ఞాన స్వభావాన్ని సూచించే సహజమైన ప్రామాణిక పదం.
- source_word: πρῶτον μὲν ... ἔπειτα
  choice: మొదట ... తరువాత
  rationale: లక్షణాల క్రమాన్ని తెలుగులో సహజంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: ἁγνή
  choice: పవిత్రమైనది
  rationale: నైతిక స్వచ్ఛతను, కల్మషం లేని స్వభావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἰρηνική
  choice: శాంతిని కోరేది
  rationale: కేవలం ప్రశాంత స్థితిని కాకుండా, శాంతిపట్ల మొగ్గు చూపే స్వభావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐπιεικής
  choice: సౌమ్యమైనది
  rationale: మృదుత్వం, సహనం, పట్టువిడుపు వంటి భావాలను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: εὐπειθής
  choice: మంచి మాట వినడానికి సిద్ధంగా ఉండేది
  rationale: మొండితనం లేకుండా సముచితమైన మాటను వినడానికి, అంగీకరించడానికి సిద్ధంగా ఉండే భావాన్ని ఇస్తుంది; అమాయకంగా ఎవరి మాటైనా నమ్మడం అనే భావాన్ని నివారిస్తుంది.
- source_word: μεστὴ ἐλέους
  choice: కనికరంతో ... నిండినది
  rationale: μεστή సూచించే సమృద్ధిని, ἔλεος యొక్క దయాపూర్వక భావాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: καρπῶν ἀγαθῶν
  choice: మంచి ఫలాలతో
  rationale: కనిపించే మంచి పరిణామాలు లేదా క్రియలను సూచించే మూలభాషలోని ఫలాల రూపకాన్నీ బహువచనాన్నీ నిలుపుతుంది.
- source_word: ἀδιάκριτος
  choice: పక్షపాతం లేనిది
  rationale: కనికరం, మంచి ఫలాలు, నిష్కపటతతో కూడిన ఈ నైతిక జాబితాలో సామాజిక భేదభావం లేని స్వభావం సందర్భానికి చక్కగా సరిపోతుంది; పదంలోని ఇతర సాధ్యమైన భావాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: ἀνυπόκριτος
  choice: నిష్కపటమైనది
  rationale: కపటం లేదా నటన లేని నిజాయితీగల స్వభావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἀδιάκριτος పదానికి అర్థనిర్ణయం
  choice: పక్షపాతం లేనిది
  alternative: భేదభావం లేనిది; విభజిత మనస్సు లేనిది; సందేహం లేనిది
  rationale: యాకోబు పత్రికలో పక్షపాతం (2:1–4), సందేహం లేదా ద్విమనస్కత (1:6–8; 4:8) రెండూ సందర్భోచిత అంశాలు. ఈ నైతిక లక్షణాల వరుసలో ‘పక్షపాతం లేనిది’ ప్రధాన పాఠ్యానికి బాగా సరిపోతుంది; అయితే గ్రీకు పదంలోని నిజమైన భావసందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. మూలంలోని వరుస లక్షణాలు, ‘ఫలాలు’ అనే రూపకం, ἀδιάκριτος లోని భావసందిగ్ధత నిలుపబడ్డాయి.
