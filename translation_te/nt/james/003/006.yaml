id: JAS.3.6
reference: James 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: te
  text: నాలుక అగ్ని. నాలుక మన అవయవాల మధ్య అనీతిమయమైన ఒక లోకంగా ఉంది; అది శరీరమంతటినీ కలుషితం చేస్తూ[a], జనన చక్రానికి[b] నిప్పంటిస్తూ, గెహెన్నా[c] చేత నిప్పంటించబడుతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శరీరమంతటినీ అపవిత్రం చేస్తూ.”
    reason: lexical_alternative
  - marker: b
    text: “జనన చక్రం” అనే గ్రీకు పదబంధాన్ని “జీవిత గమనం” లేదా “జీవనచక్రం” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: గెహెన్నా అనేది ఇక్కడ వాడిన గ్రీకు పదం; దీన్ని సాంప్రదాయంగా “నరకం” అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: నాలుక
  rationale: సందర్భమంతటా శరీర అవయవాన్ని ఆధారంగా చేసుకున్న రూపకం కొనసాగుతుంది; అదే సమయంలో మాటను సూచించే పరోక్షార్థం కూడా నిలుస్తుంది.
- source_word: πῦρ
  choice: అగ్ని
  rationale: వినాశకరమైన శక్తిని సూచించే ప్రత్యక్ష రూపకాన్ని సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: κόσμος τῆς ἀδικίας
  choice: అనీతిమయమైన ఒక లోకం
  rationale: గ్రీకులోని అసాధారణమైన ‘అనీతితో లక్షణీకరించబడిన లోకం’ అనే విస్తృత నైతిక రూపకాన్ని ‘చెడుతో నిండి ఉంది’ అని సులభీకరించకుండా కాపాడుతుంది.
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: మన అవయవాల మధ్య ... ఉంది
  rationale: నాలుకకు శరీర అవయవాల మధ్య ఉన్న స్థానం, స్థితిని తెలుగులో సహజంగా తెలియజేస్తుంది; ఎవరు దానిని అక్కడ ఉంచారో వచనం చెప్పనందున దాన్ని చేర్చదు.
- source_word: σπιλοῦσα
  choice: కలుషితం చేస్తూ
  rationale: మరకపరచడం ద్వారా కలిగే నైతిక అపవిత్రత భావాన్ని చదవడానికి సహజమైన తెలుగులో అందిస్తుంది; ‘అపవిత్రం చేస్తూ’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: ὅλον τὸ σῶμα
  choice: శరీరమంతటినీ
  rationale: ὅλον లోని సంపూర్ణతను సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: φλογίζουσα
  choice: నిప్పంటిస్తూ
  rationale: అగ్ని రూపకాన్ని కొనసాగిస్తూ క్రియాశీల విధ్వంసక చర్యను స్పష్టంగా చూపుతుంది.
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: జనన చక్రానికి
  rationale: కఠినమైన గ్రీకు పదబంధంలోని ‘చక్రం’ మరియు ‘జననం/ఉనికి ఆరంభం’ అనే పదరూపాలను ఉద్దేశపూర్వకంగా నిలుపుతుంది; సాధ్యమైన భావానువాదాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: φλογιζομένη ὑπὸ τῆς γεέννης
  choice: తానే గెహెన్నా చేత నిప్పంటించబడుతోంది
  rationale: నాలుక ఇతర వాటికి నిప్పంటించినా, దానికి మరొక మూలం నిప్పంటిస్తోందనే కర్తరి-కర్మ సంబంధ ఉద్రిక్తతను నిలుపుతుంది; γέεννα అనే నిర్దిష్ట పదాన్ని లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: γέεννα పద అనువాదం
  choice: గెహెన్నా
  alternative: నరకం
  rationale: గ్రీకులో ఉన్న నిర్దిష్ట చారిత్రక పదాన్ని నిలిపి, తరువాతి విస్తృతమైన సిద్ధాంత భావాలను ప్రధాన వచనంలో ముందుగానే కలపదు; సాంప్రదాయ అనువాదం పాదసూచికలో ఇవ్వబడింది.
- issue: τὸν τροχὸν τῆς γενέσεως అర్థం
  choice: జనన చక్రం
  alternative: జీవిత గమనం / జీవనచక్రం
  rationale: మూలంలోని అసాధారణ రూపకాన్ని ప్రధాన వచనంలో నిలుపుతూ, అది పునర్జన్మ సిద్ధాంతాన్ని తప్పనిసరిగా సూచిస్తుందని నిర్ణయించదు; సందర్భానుకూలమైన భావార్థాలను పాదసూచికలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజత, గంభీరత రెండింటినీ పాటించాం. నాలుక–అగ్ని రూపక శ్రేణిని స్పష్టంగా ఉంచాం. మూలంలోని అసాధారణ ‘జనన చక్రం’ పదబంధాన్ని వివరణాత్మకంగా మార్చకుండా ప్రధాన వచనంలో నిలిపి, భారతీయ సందర్భంలో దాన్ని పునర్జన్మ సిద్ధాంతంగా తప్పుగా ఖరారు చేయకుండా పాదసూచికలో సాధ్యమైన భావాలను తెలిపాం.
