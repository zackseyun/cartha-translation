id: JAS.3.1
reference: James 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ πολλοὶ διδάσκαλοι γίνεσθε, ἀδελφοί μου, εἰδότες ὅτι μεῖζον κρίμα λημψόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: te
  text: నా సహోదరులారా[a], మీలో చాలామంది బోధకులు కావద్దు; మనం మరింత కఠినమైన తీర్పు పొందుతామని మీకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరులు’ అనే సంబోధన ఇక్కడ సహోదరీలతో సహా విశ్వాస సమాజమంతటినీ ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ πολλοὶ ... γίνεσθε
  choice: మీలో చాలామంది ... కావద్దు
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థక క్రియ ఇక్కడ నిషేధాత్మక హెచ్చరికను వ్యక్తం చేస్తుంది. రెండవ పురుష బహువచనాన్ని తెలుగులో సహజంగా చూపేందుకు ‘మీలో’ చేర్చబడింది; γίνεσθεలోని ‘అవడం/పాత్రలోకి రావడం’ భావాన్ని ‘కావద్దు’ నిలుపుతుంది.
- source_word: διδάσκαλοι
  choice: బోధకులు
  rationale: సంఘ సందర్భంలో బోధించే వ్యక్తులను సహజంగా సూచిస్తుంది; పాఠ్యంలో లేని అధికారిక పదవిని ఇది తప్పనిసరిగా ఆపాదించదు.
- source_word: ἀδελφοί μου
  choice: నా సహోదరులారా
  rationale: ప్రత్యక్ష సంబోధనను, ‘నా’ అనే ఆత్మీయ సంబంధాన్ని నిలుపుతుంది. గ్రీకు పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో ప్రతిబింబిస్తూ, సమాజమంతటికీ వర్తించే సంభావ్య సమగ్ర భావాన్ని పాదటిప్పణిలో తెలుపుతుంది.
- source_word: εἰδότες
  choice: మీకు తెలుసు
  rationale: గ్రీకు కృదంతం హెచ్చరికకు ఆధారాన్ని లేదా దానితో పాటు ఉన్న అవగాహనను సూచిస్తుంది. తెలుగులో సహజమైన వాక్య నిర్మాణాన్ని ఇస్తూనే కారణార్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: μεῖζον κρίμα
  choice: మరింత కఠినమైన తీర్పు
  rationale: μεῖζον యొక్క తులనాత్మక బలాన్ని ఉపాధ్యాయుల అధిక బాధ్యత సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది. κρίμαను ‘శిక్షావిధి’ లేదా ‘ఖండన’గా కుదించకుండా ‘తీర్పు’గా ఉంచుతుంది.
- source_word: λημψόμεθα
  choice: మనకు ... కలుగుతుంది
  rationale: మొదటి పురుష బహువచనాన్ని నిలుపుతూ, రచయిత తనను కూడా ఈ బాధ్యతలో చేర్చుకున్న భావాన్ని చూపుతుంది. ‘తీర్పు పొందుతాము’ కంటే తెలుగులో ప్రవాహవంతంగా ఉంది.
theological_decisions:
- issue: మిశ్రమ విశ్వాస సమాజంలో ἀδελφοί μου యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘నా సహోదరులారా’; సమగ్ర సంబోధన కావచ్చని పాదటిప్పణి
  alternative: నా సహోదర సహోదరీలారా
  rationale: గ్రీకు రూపంలోని పురుష బహువచనాన్ని చెరపకుండా ఉంచుతూనే, అది స్త్రీలతో సహా విశ్వాస సమాజమంతటినీ సంబోధించే సాధారణ ప్రయోగం కావచ్చని పాదటిప్పణి ద్వారా తెలియజేస్తుంది.
- issue: κρίμα యొక్క భావపరిధి
  choice: తీర్పు
  alternative: ఖండన; శిక్షావిధి
  rationale: ఈ వచనం బోధకుల అధిక జవాబుదారీతనాన్ని హెచ్చరిస్తుంది; అయితే κρίμα తప్పనిసరిగా అంతిమ ఖండననే సూచించదు. ‘తీర్పు’ ఆ భావసందిగ్ధతను నిలుపుతుంది.
- issue: μεῖζον యొక్క తులనాత్మక బలం
  choice: మరింత కఠినమైన
  alternative: గొప్పదైన; ఎక్కువైన
  rationale: అక్షరార్థంగా ‘ఎక్కువ/గొప్ప’ అనే తులనాత్మక భావం ఉన్నప్పటికీ, తీర్పుతో కలిసినప్పుడు దాని తీవ్రతను తెలుగులో సహజంగా ‘మరింత కఠినమైన’ అని వ్యక్తం చేయవచ్చు; ఎవరి తీర్పుతో పోలిక అనేది పాఠ్యం చెప్పనందున దాన్ని విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ప్రత్యక్ష సంబోధనను వాక్యారంభంలో ఉంచి సహజ ప్రవాహం కల్పించబడింది. పాదటిప్పణి సూచిక [a] సంబంధిత సంబోధన తర్వాత కాకుండా వాక్యాంతంలో ఉంచబడినా, అది ప్రధాన పాఠ్యంలో స్పష్టంగా ఉంది.
