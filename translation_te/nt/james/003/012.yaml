id: JAS.3.12
reference: James 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; ⸂οὔτε ἁλυκὸν⸃ γλυκὺ ποιῆσαι ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: te
  text: నా సహోదరులారా[a], అంజూరపు చెట్టు ఒలీవ పండ్లను కాయగలదా? లేక ద్రాక్షతీగ అంజూరపు పండ్లను కాయగలదా? అలాగే ఉప్పునీరు తియ్యని నీటిని[b] ఇవ్వగలదా?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా సహోదర సహోదరీలారా.’ గ్రీకులో పుంలింగ బహువచనమైన ‘సహోదరులు’ అనే పదం ఉంది; అది స్త్రీపురుషులు కలిసిన సమూహాన్ని కూడా సంబోధించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘తియ్యని నీరు’; ఇక్కడ ఉప్పునీటికి విరుద్ధంగా ‘మంచినీరు’ అనే భావం.
    reason: lexical_alternative
  - marker: c
    text: చివరి భాగం గ్రీకులో అధ్యాహారంగా ఉంది. ముందటి వచనంలోని ఊట దృశ్యం ప్రకారం దీనిని, ‘ఉప్పని ఊట తియ్యని నీటిని ఇవ్వగలదా?’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: నా సహోదరులారా
  rationale: గ్రీకు పాఠంలోని పుంలింగ బహువచన సంబోధనను గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగు రూపంలో నిలుపుతుంది; సందర్భంలో ఇది సమాజమంతటికీ వర్తించవచ్చు.
- source_word: μὴ δύναται
  choice: కాయగలదా?
  rationale: μήతో మొదలయ్యే ప్రశ్న ప్రతికూల సమాధానాన్ని ఆశిస్తుంది. ఫలవృక్షాల సందర్భంలో ‘కాయగలదా?’ సహజంగా ఉండి అసాధ్యతను ప్రశ్నారూపంలో తెలియజేస్తుంది.
- source_word: συκῆ
  choice: అంజూరపు చెట్టు
  rationale: ఈ నామవాచకం పండును కాక చెట్టును సూచిస్తుంది; ‘అంజూరపు చెట్టు’ ఆధునిక తెలుగులో స్పష్టమైన సమానం.
- source_word: ἐλαίας ποιῆσαι
  choice: ఒలీవ పండ్లను కాయగలదా
  rationale: ποιέω ఇక్కడ ఫలాన్ని ఉత్పత్తి చేయడం అనే అర్థంలో ఉంది. చెట్టు విషయంలో ‘కాయడం’ సహజమైన తెలుగు ప్రయోగం.
- source_word: ἄμπελος
  choice: ద్రాక్షతీగ
  rationale: ఉద్దేశించిన తీగ ద్రాక్షతీగ అని స్పష్టంగా తెలియజేసి వ్యవసాయ దృశ్యాన్ని నిలుపుతుంది.
- source_word: σῦκα
  choice: అంజూరపు పండ్లు
  rationale: బహువచన ఫలార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: οὔτε ἁλυκὸν
  choice: అలాగే ఉప్పునీరు
  rationale: గ్రీకు వాక్యం సంక్షిప్తంగా, కొంత అధ్యాహారంగా ఉంది. ἁλυκόν నామవాచకార్థంలో వాడిన విశేషణం; తరువాతి ὕδωρ మరియు 3:11లోని నీటి ఊట దృశ్యం ఆధారంగా ‘ఉప్పునీరు’ కనిష్ఠ అవసరమైన విప్పు.
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: తియ్యని నీటిని ఇవ్వలేదు
  rationale: γλυκύς అక్షరార్థంగా ‘తియ్యని’; ఉప్పునీటికి విరుద్ధంగా మంచినీరు/తాజా నీరు అనే భావం వస్తుంది. ప్రధాన పాఠం మూలపద చిత్రాన్ని నిలుపగా పాదసూచిక సందర్భార్థాన్ని వివరిస్తుంది.
