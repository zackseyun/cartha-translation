id: JAS.3.9
reference: James 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν αὐτῇ εὐλογοῦμεν τὸν ⸀κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: te
  text: అదే నాలుకతో ప్రభువునూ తండ్రినీ[a] దీవిస్తాము; అదే నాలుకతో దేవుని పోలిక ప్రకారం రూపొందించబడిన మనుష్యులను[b] శపిస్తాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తండ్రియైన ప్రభువును.” గ్రీకు పదబంధాన్ని ఈ విధంగా ఉపపదార్థకంగా గాని, దేవునికి వర్తించే రెండు జత బిరుదులుగా గాని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “మానవులను”; ఇక్కడ గ్రీకు పదం మానవజాతిని సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: అదే నాలుకతో
  rationale: ముందటి సందర్భంలో సూచించబడిన నాలుకను తెలుగులో స్పష్టంగా పేర్కొని, సాధనార్థక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εὐλογοῦμεν
  choice: దీవిస్తాము
  rationale: దేవుని ఉద్దేశించి పలికే ఆశీర్వాద/స్తుతి భావాన్ని నిలుపుతూ, తరువాతి ‘శపిస్తాము’ అనే పదంతో ఉన్న బలమైన వ్యతిరేకతను కాపాడుతుంది.
- source_word: τὸν κύριον καὶ πατέρα
  choice: ప్రభువును, తండ్రిని
  rationale: ఒకే దేవునికి వర్తించే రెండు సంబోధనలుగా చదవగల నిర్మాణాన్ని ఇస్తూ, వాటి ఖచ్చిత సంబంధాన్ని ప్రధాన పాఠ్యంలో అతిగా నిర్ణయించదు.
- source_word: καταρώμεθα
  choice: శపిస్తాము
  rationale: మూలంలోని నేరమైన నైతిక తీవ్రతను, ‘దీవిస్తాము’తో ఉన్న వ్యతిరేకతను స్పష్టంగా అందిస్తుంది.
- source_word: τοὺς ἀνθρώπους
  choice: మనుష్యులను
  rationale: ఇక్కడ పురుషులను మాత్రమే కాక మానవజాతిని సాధారణంగా సూచించే గ్రీకు పదానికి సహజమైన సమగ్ర తెలుగు రూపం.
- source_word: καθ’ ὁμοίωσιν θεοῦ
  choice: దేవుని పోలిక ప్రకారం
  rationale: సృష్టి వర్ణనను ప్రతిధ్వనించే ‘పోలిక’ భావాన్ని, καθ’ యొక్క ప్రమాణార్థాన్ని సమీపంగా నిలుపుతుంది.
- source_word: γεγονότας
  choice: చేయబడిన
  rationale: మనుష్యులు దేవుని పోలిక ప్రకారం ఉనికిలోకి తీసుకురాబడ్డారనే ఫలితస్థితిని, సూచిత దైవిక కర్తృత్వాన్ని అతిగా విస్తరించకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ప్రభువు మరియు తండ్రి’ మధ్య సంబంధం
  choice: ప్రభువును, తండ్రిని
  alternative: ప్రభువును మరియు తండ్రిని; తండ్రియైన ప్రభువును
  rationale: గ్రీకు పదబంధం ఉపపదార్థకంగా ‘తండ్రియైన ప్రభువు’ అని గాని, దేవునికి జతగా వర్తించే బిరుదులుగా గాని అర్థమయ్యే అవకాశాన్ని కలిగి ఉంది. ప్రధాన పాఠ్యం ఒకే వివరణను బలవంతంగా నిర్ణయించకుండా ఉంచుతుంది.
- issue: ἀνθρώπους యొక్క సాధారణ మానవ సూచన
  choice: మనుష్యులను
  alternative: మానవులను; పురుషులను
  rationale: వాక్యం దేవుని పోలిక ప్రకారం చేయబడిన మానవులందరి గురించి చెబుతుంది; ‘పురుషులను’ అనడం మూలంలోని సాధారణ సూచనను అనవసరంగా సంకుచితం చేస్తుంది.
- issue: దేవుని పోలిక ప్రకారం మానవులు చేయబడటం
  choice: దేవుని పోలిక ప్రకారం చేయబడిన
  alternative: దేవుని పోలికలో సృష్టించబడిన
  rationale: సృష్టి సూచనను కాపాడుతూ, γεγονότας అనే పదాన్ని ‘సృష్టించబడిన’ అని మరీ నిర్దిష్టంగా విస్తరించకుండా దాని ఫలితస్థితి భావాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘దీవిస్తాము/శపిస్తాము’ అనే సమాంతర వ్యతిరేకతను ఉద్దేశపూర్వకంగా నిలిపి, దేవుని బిరుదుల మధ్య సంబంధంలోని మూలభాషా సందిగ్ధతను పాదటిప్పణిలో సంరక్షించాం.
