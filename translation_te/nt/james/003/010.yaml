revisions:
- from: అదే నోటి నుండి దీవెన, శాపం వెలువడుతున్నాయి. నా సహోదరులారా[a], ఇలా జరగడం తగదు.
  to: అదే నోటి నుండి దీవెన, శాపం వెలువడతాయి. నా సహోదరులారా[a], ఇవి ఇలా జరగడం తగదు.
  rationale: The revision preserves the Greek plural ταῦτα explicitly, retains οὕτως as “ఇలా,” and uses a natural generic present for the blessing-and-cursing contrast. No theological or interpretive expansion has been introduced.
