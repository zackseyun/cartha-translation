id: JAS.3.10
reference: James 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκ τοῦ αὐτοῦ στόματος ἐξέρχεται εὐλογία καὶ κατάρα. οὐ χρή, ἀδελφοί μου, ταῦτα οὕτως γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: te
  text: అదే నోటి నుండి దీవెన, శాపం వెలువడతాయి. నా సహోదరులారా[a], ఇవి ఇలా జరగడం తగదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా సహోదర సహోదరీలారా.” గ్రీకులో “సహోదరులారా” అని ఉంది; అయితే సందర్భంలో యాకోబు విశ్వసించే సమాజమంతటినీ ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: అదే నోటి నుండి
  rationale: మాటలు ఒకే మూలం నుండి వెలువడుతున్నాయనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐξέρχεται
  choice: వెలువడుతున్నాయి
  rationale: నోటి నుండి పలుకులు బయటకు రావడాన్ని సహజంగా వ్యక్తపరుస్తుంది; దీవెన, శాపం అనే జంట కర్తలకు అనుగుణంగా తెలుగులో బహువచనం వాడబడింది.
- source_word: εὐλογία
  choice: దీవెన
  rationale: ఇక్కడ నోటితో పలికే ఆశీర్వాద వాక్యాన్ని సూచిస్తూ, κατάραతో ఉన్న ప్రత్యక్ష వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: κατάρα
  choice: శాపం
  rationale: నోటితో పలికే శాపవాక్యాన్ని సూచించే సాధారణ, స్పష్టమైన తెలుగు పదం.
- source_word: οὐ χρή
  choice: తగదు
  rationale: ఇది జరగడం సముచితం కాదనే నైతిక అనుచితత్వాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀδελφοί μου
  choice: నా సహోదరులారా
  rationale: గ్రీకు మూలంలోని పురుష బహువచన సంబోధన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భంలో మొత్తం విశ్వాస సమాజం ఉద్దేశించబడి ఉండవచ్చనే భావాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: ఇలా జరగడం
  rationale: οὕτως లోని ‘ఈ విధంగా’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ముందున్న రెండు విరుద్ధ పలుకులు ఒకే నోటి నుండి రావడాన్ని సమగ్రంగా సూచిస్తుంది.
theological_decisions:
- issue: ἀδελφοί μου అనే లింగసూచక కుటుంబ సంబోధన
  choice: నా సహోదరులారా
  alternative: నా సహోదర సహోదరీలారా
  rationale: గ్రీకు రూపం పురుష బహువచనం కాబట్టి ప్రధాన పాఠ్యంలో దానిని ప్రతిబింబించాం. అయితే యాకోబు మొత్తం విశ్వాస సమాజాన్ని ఉద్దేశించి ఉండే అవకాశాన్ని పాదసూచికలో స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దీవెన, శాపం’ అనే సమాంతర జంట మూలంలోని వాక్కు-క్రియ వ్యత్యాసాన్ని నిలుపుతుంది; ‘తగదు’ χρή యొక్క సముచితత/నైతిక అవసర భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
