source:
  edition: SBLGNT
  text: πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: te
  text: ఎందుకంటే, ప్రతి రకమైన అడవి జంతువులు, పక్షులు, పాకే జీవులు, సముద్ర జీవులు మానవజాతిచేత మచ్చిక చేయబడుతున్నాయి; మచ్చిక చేయబడ్డాయి కూడా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మానవ స్వభావంచేత” లేదా “మానవత్వంచేత.” గ్రీకులోని τῇ φύσει τῇ ἀνθρωπίνῃ అనే పదబంధం సమష్టిగా మానవజాతిని గానీ, మరింత అమూర్తంగా మానవ స్వభావాన్ని లేదా మానవ పరిధిని గానీ సూచించవచ్చు; ప్రధాన పాఠం దాన్ని సమష్టిగా మానవజాతి అని తీసుకుంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: ప్రతి రకమైన
  rationale: జంతువుల జాబితాలో φύσις సహజ స్వభావం కంటే ‘రకం/వర్గం’ అనే భావాన్ని ఇస్తుంది; πᾶσα యొక్క విభజనాత్మక బలాన్ని ‘ప్రతి రకమైన’ నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను కలిపే γάρ సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: θηρίων
  choice: అడవి జంతువులు
  rationale: θηρίον సాధారణంగా మృగం లేదా అడవి జంతువును సూచిస్తుంది; ‘అడవి జంతువులు’ ఆధునిక పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: πετεινῶν
  choice: పక్షులు
  rationale: ఎగిరే జీవులను, ప్రత్యేకంగా పక్షులను సూచించే పదానికి ఇది సహజమైన సంక్షిప్త అనువాదం.
- source_word: ἑρπετῶν
  choice: పాకే జీవులు
  rationale: ἑρπετά ఆధునిక శాస్త్రీయ ‘సరీసృపాలు’ అనే వర్గానికంటే విస్తృతంగా నేలపై పాకే జీవులను సూచించగలదు; అందువల్ల మూలంలోని పరిధిని కుదించకుండా ఈ రూపం ఎంచుకోబడింది.
- source_word: ἐναλίων
  choice: సముద్ర జీవులు
  rationale: సముద్రంలో ఉండే జీవులను విస్తృతంగా సూచించే గ్రీకు పదానికి ఇది సహజమైన తెలుగు రూపం.
- source_word: δαμάζεται
  choice: మచ్చిక చేయబడుతున్నాయి
  rationale: వర్తమాన కర్మణి రూపంలోని కొనసాగుతున్న లేదా సాధారణ ప్రక్రియను నిలుపుతుంది.
- source_word: δεδάμασται
  choice: మచ్చిక చేయబడ్డాయి
  rationale: పూర్తయిన కార్యం వల్ల ఏర్పడిన స్థితిని సూచించే perfect passive బలాన్ని, ముందున్న వర్తమాన రూపంతో భేదాన్ని నిలుపుతూ వ్యక్తం చేస్తుంది.
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: మానవజాతిచేత
  rationale: సందర్భంలో ఈ పదబంధాన్ని జంతు రకాలతో వ్యత్యాసంగా సమష్టి మానవాళిని సూచించేదిగా తీసుకుంది; కర్మణి క్రియకు కర్తృసాధనాన్ని ‘చేత’ స్పష్టం చేస్తుంది.
theological_decisions:
- issue: τῇ φύσει τῇ ἀνθρωπίνῃ యొక్క అర్థం
  choice: మానవజాతిచేత
  alternative: మానవ స్వభావంచేత / మానవత్వంచేత
  rationale: ఈ సందర్భంలో సమష్టిగా మానవజాతి జంతువులను మచ్చిక చేయడం ప్రధాన భావంగా కనిపిస్తుంది; అయితే గ్రీకు పదబంధానికి ‘మానవ స్వభావం’ అనే మరింత అమూర్తమైన పఠనం సాధ్యమే కాబట్టి దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని వర్తమాన–పూర్త భేదాన్ని ‘చేయబడుతున్నాయి; చేయబడ్డాయి కూడా’ ద్వారా నిలిపింది. పాదసూచిక సూచిక [a] ప్రధాన పాఠంలో సంబంధిత వాక్యాంతంలో ఉంచబడింది.
