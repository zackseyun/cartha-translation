id: JAS.3.4
reference: James 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδοὺ καὶ τὰ πλοῖα, τηλικαῦτα ὄντα καὶ ὑπὸ ⸂ἀνέμων σκληρῶν⸃ ἐλαυνόμενα, μετάγεται ὑπὸ ἐλαχίστου πηδαλίου ὅπου ⸂ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: te
  text: 'ఓడలను కూడా చూడండి: అవి ఎంతో పెద్దవైనా, బలమైన గాలులచేత నెట్టబడుతున్నా, నడిపేవాని ఉద్దేశం కోరిన దిక్కుకు అతి చిన్న చుక్కాని ద్వారా మళ్లించబడతాయి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఓడ నడిపేవాడు ఎటు వెళ్లాలనుకుంటాడో అటు.” గ్రీకులో మరింత అక్షరార్థంగా, “నడిపేవాని మొగ్గు ఎటు కోరుతుందో అటు” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: ఓడలను కూడా చూడండి
  rationale: ἰδοὺను ఆధునిక తెలుగులో సహజమైన అవధాన ఆహ్వానంగా ఇచ్చి, καὶ ద్వారా ముందటి ఉదాహరణకు సమాంతరమైన మరో ఉదాహరణను సూచించాం.
- source_word: τηλικαῦτα ὄντα
  choice: అవి ఎంతో పెద్దవైనా
  rationale: ఓడల భారీ పరిమాణాన్ని, చిన్న చుక్కానితో ఉన్న సందర్భానుగత వ్యత్యాసాన్ని concessive రూపంలో నిలిపింది.
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: బలమైన గాలులచేత నెట్టబడుతున్నా
  rationale: σκληρῶνకు గాలుల సందర్భంలో సహజమైన ‘బలమైన’ను, ἐλαυνόμενα యొక్క కర్మణి భావానికి ‘నెట్టబడుతున్నా’ను వాడాం.
- source_word: μετάγεται
  choice: మళ్లించబడతాయి
  rationale: చుక్కాని ద్వారా ఓడ దిశ మార్చబడటాన్ని తెలిపే నౌకా సందర్భానికి అనువైన పదం; గ్రీకు కర్మణి రూపాన్ని కాపాడుతుంది.
- source_word: ὑπὸ ἐλαχίστου πηδαλίου
  choice: అతి చిన్న చుక్కానిచేత
  rationale: ἐλαχίστου యొక్క అత్యల్పత భావాన్ని ‘అతి చిన్న’గా, πηδάλιονను సాధారణ ఆధునిక తెలుగు నౌకా పదమైన ‘చుక్కాని’గా ఇచ్చాం.
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: నడిపేవాని అభీష్టం ఎటు కోరుతుందో అటు
  rationale: εὐθύνοντοςను వృత్తిపదంగా ప్రత్యేకీకరించకుండా ‘నడిపేవాడు’గా ఉంచి, ὁρμήలోని అంతర్గత మొగ్గు/ప్రేరణను ‘అభీష్టం’తో వ్యక్తం చేశాం. βούλεταιతో ఉన్న అసాధారణ వ్యక్తీకరణను పూర్తిగా సరళీకరించకుండా నిలిపాం.
theological_decisions:
- issue: నడిపేవాని అంతర్గత సంకల్పాన్ని తెలిపే అసాధారణ గ్రీకు పదబంధం
  choice: నడిపేవాని అభీష్టం ఎటు కోరుతుందో అటు
  alternative: ఓడ నడిపేవాడు ఎటు వెళ్లాలనుకుంటాడో అటు
  rationale: సహజమైన ప్రత్యామ్నాయం అర్థాన్ని స్పష్టం చేస్తుంది; అయితే మూలంలోని ἡ ὁρμή ... βούλεται అనే వ్యక్తీకరణలో అభీష్టమే కోరుతున్నట్లు ఉన్న రూపక ఉద్వేగాన్ని ప్రధాన పాఠంలో సాధ్యమైనంతగా కాపాడాం. దీనికి ప్రత్యేక మతసంప్రదాయ వ్యాఖ్యానాన్ని జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి స్పష్టమైన శైలి. ‘చుక్కాని’ నౌకా సందర్భంలో సహజమైన పదం. ప్రధాన పాఠంలో [a] గుర్తు సంబంధిత వాక్యాంతంలో ఉంచబడింది.
