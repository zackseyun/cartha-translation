id: JAS.3.14
reference: James 3:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: te
  text: అయితే మీ హృదయాల్లో[d] కటువైన అసూయ[a], స్వార్థపూరిత ఆశయం[b] ఉంటే, గొప్పలు చెప్పుకోకండి; సత్యానికి విరుద్ధంగా అబద్ధం చెప్పకండి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కటువైన అసూయ’కు ‘కటువైన ఉత్సాహం’ లేదా ‘కటువైన ఈర్ష్య’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘స్వార్థపూరిత ఆశయం’కు ‘పోటీ తత్వం’ లేదా ‘వర్గకక్ష’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘సత్యానికి వ్యతిరేకంగా అబద్ధమాడకండి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: మూలభాషలో అక్షరార్థంగా ‘మీ హృదయంలో’; ఇది సమూహంలోని ఒక్కొక్కరిని ఉద్దేశించే ఏకవచన ప్రయోగం.
    reason: previous_rendering
lexical_decisions:
- source_word: ζῆλον πικρὸν
  choice: కటువైన అసూయ
  rationale: ζῆλος అనే పదానికి ఆసక్తి, ఉత్సాహం, అసూయ అనే అర్థాలు రావచ్చు. ఇక్కడ అది ἐριθείαతో కలిసి ప్రతికూలంగా వాడబడినందున ‘అసూయ’ సందర్భానికి తగినది; πικρόνలోని చేదు, హానికర స్వభావాన్ని ‘కటువైన’ నిలుపుతుంది.
- source_word: ἐριθείαν
  choice: స్వార్థపూరిత ఆశయం
  rationale: ఈ పదం స్వప్రయోజనాన్ని వెదికే ఆశనూ, పోటీ లేదా పక్షపోరాటానికి దారితీసే ధోరణినీ సూచించగలదు. ‘స్వార్థపూరిత ఆశయం’ అంతర్గత ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: మీ హృదయాల్లో
  rationale: గ్రీకులో ‘హృదయం’ ఏకవచనంలో, ‘మీ’ బహువచనంలో ఉన్న విభజనాత్మక నిర్మాణం. సమూహంగా సంబోధిస్తున్న సంగతి తెలుగులో స్పష్టంగా ఉండేందుకు సహజమైన బహువచనం వాడబడింది.
- source_word: μὴ κατακαυχᾶσθε
  choice: గొప్పలు చెప్పుకోకండి
  rationale: క్రియలో తనను తాను హెచ్చించుకొని ప్రగల్భాలు పలికే భావం ఉంది. ‘గొప్పలు చెప్పుకోకండి’ ఆ హెచ్చరికను సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: సత్యానికి విరుద్ధంగా అబద్ధం చెప్పకండి
  rationale: ψεύδεσθε అబద్ధం చెప్పడాన్ని, κατά + షష్ఠీ విభక్తి సత్యానికి వ్యతిరేకతను సూచిస్తాయి. ఈ అనువాదం రెండు భావాలనూ స్పష్టంగా నిలుపుతుంది.
- source_word: εἰ δὲ
  choice: అయితే … ఉంటే
  rationale: δέ ముందున్న పరలోక జ్ఞాన వర్ణనతో వ్యత్యాసాన్ని చూపుతుంది; షరతును తెలిపే εἰతో కలిపి తెలుగులో ‘అయితే … ఉంటే’ సహజంగా ఉంది.
theological_decisions:
- issue: ‘సత్యం’ యొక్క పరిధి
  choice: ‘సత్యం’ అని విస్తృతంగానే ఉంచడం
  alternative: ‘సువార్త సత్యం,’ ‘నిజమైన జ్ఞానమార్గం,’ లేదా కేవలం ‘నిజాయితీ’ అని నిర్దిష్టీకరించడం
  rationale: ἀλήθεια ఇక్కడ దేవుని సత్యాన్నీ, దానికి విరుద్ధమైన స్వయంవంచక ప్రగల్భాలనూ సూచించేంత విస్తృతంగా ఉంది. దానిని ఒక నిర్దిష్ట సిద్ధాంత సూత్రానికో, కేవలం మాటల్లో నిజాయితీకో పరిమితం చేయడం మూలపాఠం చెప్పేదానికంటే ఎక్కువగా భావాన్ని నిర్ణయిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ప్రతికూల నైతిక పదాల తీవ్రతను నిలుపుతూ, ‘సత్యం’ అనే పదంలోని ఉద్దేశపూర్వక విస్తృతార్థాన్ని సంకుచితం చేయలేదు.
