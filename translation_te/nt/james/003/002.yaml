  verdict: revise
  source_fidelity: The draft conveys the inclusive assertion, the conditional case concerning speech, ethical maturity, and the ability to govern the whole body. However, the final Telugu clause places కూడా awkwardly after the predicate and renders the bridle metaphor syntactically less naturally than necessary. The revision preserves the metaphor while making the capability relation clear.
