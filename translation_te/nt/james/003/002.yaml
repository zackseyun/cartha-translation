id: JAS.3.2
reference: James 3:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: te
  text: ఎందుకంటే మనమందరం అనేక విధాలుగా తప్పిపోతున్నాం. ఎవరైనా మాటలో తప్పిపోకపోతే, అతడు పరిణతి చెందిన మనిషి[a]; తన శరీరమంతటినీ కూడా కళ్లెంతో అదుపులో ఉంచగలవాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిపూర్ణుడైన మనిషి” లేదా “సంపూర్ణుడైన మనిషి.” గ్రీకు τέλειος అనే పదానికి “పరిపూర్ణ,” “సంపూర్ణ,” లేదా “పరిణతి చెందిన” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ సంపూర్ణ పాపరాహిత్యం కంటే నైతిక పరిణతినే సూచించే అవకాశం ఎక్కువ. గ్రీకులో “మనిషి” అనే పురుష ఏకవచనం ఉంది; ఈ సాధారణ వాక్యంలో అది ప్రతినిధి భావంతో వాడబడింది.
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: “కళ్లెంతో అదుపులో ఉంచడం” అనే రూపకం తరువాతి వచనాల్లోని గుర్రాల కళ్లెం రూపకంతో అనుసంధానమవుతుంది.
    reason: metaphor_clarification
lexical_decisions:
- source_word: πολλὰ
  choice: అనేక విధాలుగా
  rationale: నపుంసక బహువచన రూపం ఇక్కడ క్రియావిశేషణార్థంగా ఉండి, ‘అనేక విషయాలను’ కంటే ‘అనేక రీతుల్లో’ అనే భావాన్ని ఇస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి బోధకుల హెచ్చరికకు కారణం లేదా వివరణను అనుసంధానిస్తుంది.
- source_word: πταίομεν / πταίει
  choice: తప్పిపోతున్నాం / తప్పిపోకపోతే
  rationale: మూలపదంలోని తడబడటం అనే రూపకాన్ని తెలుగులో సహజంగా సూచిస్తూ, నైతిక వైఫల్య భావాన్ని నిలుపుతుంది; నేరుగా ‘పాపం చేయడం’ అని విపులీకరించదు.
- source_word: ἅπαντες
  choice: మనమందరం
  rationale: రచయిత తనను కూడా చేర్చుకున్న సమగ్ర, ఉద్ఘాటనాత్మక భావాన్ని తెలియజేస్తుంది.
- source_word: εἴ τις
  choice: ఎవరైనా
  rationale: సాధారణంగా వర్తించే అనిర్దిష్ట షరతును సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐν λόγῳ
  choice: మాటలో
  rationale: సంక్షిప్తమైన గ్రీకు రూపాన్ని కాపాడుతూ, మాట లేదా పలుకుబడిలో అనే విస్తృత భావాన్ని ఇస్తుంది.
- source_word: οὗτος
  choice: అతడు
  rationale: ముందు చెప్పిన ఊహాత్మక వ్యక్తినే సూచిస్తుంది; తెలుగులో ‘ఇతడే’ కంటే ‘అతడు’ సహజంగా ప్రవహిస్తుంది.
- source_word: τέλειος
  choice: పరిణతి చెందిన
  rationale: సంపూర్ణత, పరిపక్వత అనే నైతిక భావాన్ని తెలియజేస్తూ, సంపూర్ణ పాపరాహిత్యాన్ని అనవసరంగా సూచించదు.
- source_word: ἀνήρ
  choice: మనిషి
  rationale: మూలంలోని ఏకవచన పురుషరూపాన్ని ప్రతినిధి భావంతో ఉంచుతుంది; ‘ఎవరైనా’ అనే షరతు సాధారణ వర్తింపును స్పష్టం చేస్తుంది.
- source_word: δυνατὸς
  choice: వేయగలవాడు
  rationale: సామర్థ్యాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: χαλιναγωγῆσαι
  choice: కళ్లెం వేయగలవాడు
  rationale: తరువాతి వచనాల్లో విస్తరించే గుర్రపు కళ్లెం రూపకాన్ని నిలుపుతుంది; కేవలం ‘అదుపు చేయడం’గా చదును చేయదు.
- source_word: καὶ
  choice: కూడా
  rationale: మాటను అదుపు చేయగల సామర్థ్యానికి శరీరమంతటినీ అదుపు చేయగల సామర్థ్యాన్ని అదనంగా జతచేస్తుంది.
theological_decisions:
- issue: నైతిక సందర్భంలో τέλειος అర్థం
  choice: పరిణతి చెందిన
  alternative: పరిపూర్ణుడు / సంపూర్ణుడు
  rationale: యాకోబులో ఈ పదం స్వభావ పరిపక్వత లేదా సంపూర్ణతను సూచిస్తుంది. వెంటనే ‘మనమందరం తప్పిపోతున్నాం’ అని చెప్పినందున, ఆధునిక పాఠకుడు దీనిని సంపూర్ణ పాపరాహిత్యంగా అపార్థం చేసుకోకుండా ‘పరిణతి చెందిన’ అని అనువదించబడింది; ప్రత్యామ్నాయ అర్థం పాదటిప్పణిలో నిలుపబడింది.
- issue: ἀνήρ యొక్క ప్రతినిధి పురుషరూపం
  choice: మనిషి అనే పురుష ఏకవచన రూపం
  alternative: వ్యక్తి
  rationale: గ్రీకులో స్పష్టంగా పురుష ఏకవచనం ఉంది; అయితే εἴ τις (‘ఎవరైనా’) వల్ల వాక్యం సాధారణ వర్తింపును కలిగి ఉంది. మూలరూపం మరియు ప్రతినిధి భావం రెండూ కాపాడబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మాటలో’ అనే సంక్షిప్త మూలవ్యక్తీకరణను ఉంచి, ‘కళ్లెం వేయడం’ రూపకాన్ని సంరక్షించాం. పాదటిప్పణి గుర్తులు [a], [b] ప్రధాన పాఠ్యంలో రెండూ ఉన్నాయి.
