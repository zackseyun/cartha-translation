revisions:
- from: ఈ జ్ఞానం పైనుండి దిగివచ్చేది కాదు; అది భూసంబంధమైనది, ఆత్మసంబంధం లేనిది[a], దయ్యాలకు సంబంధించినది.
  to: ఈ జ్ఞానం పైనుండి దిగివచ్చేది కాదు; అది భూసంబంధమైనది, ఆత్మికత లేనిది[a], దయ్యస్వభావమైనది.
  rationale: The revision retains the source’s threefold evaluative sequence and its above/earthly contrast. It clarifies the Telugu rendering of ψυχική while retaining the viable ‘natural’ sense in the footnote, and it strengthens the final adjective to match the characterizing force of δαιμονιώδης.
  reviewer_model: gpt-5.6-terra
