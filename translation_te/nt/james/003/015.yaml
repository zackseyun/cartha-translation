id: JAS.3.15
reference: James 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη, ἀλλὰ ἐπίγειος, ψυχική, δαιμονιώδης·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: te
  text: ఈ జ్ఞానం పైనుండి దిగివచ్చేది కాదు; అది భూసంబంధమైనది, ఆత్మికత లేనిది[a], దయ్యస్వభావమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహజమైనది.” గ్రీకు విశేషణం ఆత్మికమైన దానికి భిన్నంగా, కేవలం సహజ జీవనానికి చెందినదాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: ఈ జ్ఞానం
  rationale: సందర్భంలో ఇంతకుముందు వర్ణించిన జ్ఞానాన్ని సూచించే నిర్దేశక పదబంధాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἄνωθεν
  choice: పైనుండి
  rationale: దేవుని మూలాన్ని సూచించే భావస్ఫూర్తిని నిలుపుతూ, ‘పరలోకం నుండి’ అనే వివరణాత్మక విస్తరణను నివారిస్తుంది.
- source_word: κατερχομένη
  choice: దిగివచ్చేది
  rationale: జ్ఞానాన్ని విశేషించే వర్తమాన కృదంత భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐπίγειος
  choice: భూసంబంధమైనది
  rationale: ‘పైనుండి’ అనే మాటకు ఉన్న స్థానిక-భావాత్మక వ్యత్యాసాన్ని కాపాడుతుంది; ‘లోకసంబంధమైనది’ కంటే మూలపదానికి దగ్గరగా ఉంటుంది.
- source_word: ψυχική
  choice: ఆత్మసంబంధం లేనిది
  rationale: ψυχικός ఇక్కడ ఆత్మికమైన దానికి వ్యతిరేకంగా, కేవలం సహజ జీవన పరిధికి చెందినదనే భావాన్ని కలిగి ఉంది. ప్రధాన పాఠంలో ప్రతికూల ఆత్మిక వ్యత్యాసాన్ని స్పష్టంగా ఉంచి, ‘సహజమైనది’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: δαιμονιώδης
  choice: దయ్యాలకు సంబంధించినది
  rationale: దయ్యాలకు చెందినది లేదా వాటి స్వభావాన్ని కలిగినది అనే గ్రీకు విశేషణ భావాన్ని, ‘దయ్యపూరితమైనది’ వంటి మరింత బలమైన వ్యాఖ్యానాన్ని జోడించకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: ψυχική పదంలోని సహజ/ఆత్మిక వ్యత్యాసం
  choice: ఆత్మసంబంధం లేనిది
  alternative: సహజమైనది
  rationale: సందర్భంలోని ప్రతికూల నైతిక-ఆధ్యాత్మిక వ్యత్యాసాన్ని ఆధునిక పాఠకునికి స్పష్టంగా తెలియజేస్తుంది. అయితే ఈ పదం కేవలం సహజ జీవనానికి చెందినదనే అర్థాన్నీ ఇవ్వగలదు కాబట్టి ఆ నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే నిర్మాణం వాడబడింది. మూడు విశేషణాల వరుసను, అలాగే ‘పైనుండి’/‘భూసంబంధమైనది’ వ్యత్యాసాన్ని నిలిపాం.
