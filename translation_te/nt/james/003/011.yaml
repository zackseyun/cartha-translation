  yaml_path: translation/nt/james/003/011.yaml
  text: Does a spring pour out both sweet and bitter water from the same opening?[a]
translation:
  language: te
  text: ఒకే రంధ్రం నుండి ఊట తియ్యని నీటినీ చేదు నీటినీ వెలువరిస్తుందా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఒకే రంధ్రం నుండి ఊట తియ్యనిదానినీ చేదుదానినీ ఉబికిస్తుందా?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτι
  choice: …పొంగింపజేస్తుందా?
  rationale: μήτι ప్రతికూల సమాధానాన్ని ఆశించే అలంకారప్రశ్నను పరిచయం చేస్తుంది. తెలుగులో సాధారణ ప్రశ్నారూపమే సందర్భానుసారంగా ఆ ప్రతికూల నిరీక్షణను సహజంగా తెలియజేస్తుంది.
- source_word: ἡ πηγή
  choice: ఊట
  rationale: సహజంగా నీరు ఉద్భవించే స్థలాన్ని సూచించే πηγήకు ఆధునిక తెలుగులో ‘ఊట’ స్పష్టమైన, సహజమైన సమానం.
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: ఒకే రంధ్రం నుండి
  rationale: ὀπή అంటే రంధ్రం లేదా తెరువు. ఊటలో నీరు బయటకు వచ్చే భౌతిక రంధ్రాన్ని ‘రంధ్రం’ నేరుగా వ్యక్తపరుస్తుంది.
- source_word: βρύει
  choice: పొంగింపజేస్తుంది
  rationale: βρύωలో పొంగి లేదా ఉబికి బయటకు రావడం అనే బలమైన జలచిత్రం ఉంది; ‘పొంగింపజేస్తుంది’ దానిని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: τὸ γλυκύ
  choice: తియ్యని నీరు
  rationale: γλυκύ అక్షరార్థంగా ‘తియ్యనిది’; విశేషణం నామవాచకంగా వాడబడింది. సందర్భం స్పష్టత కోసం ‘నీరు’ చేర్చబడింది.
- source_word: τὸ πικρόν
  choice: చేదు నీరు
  rationale: πικρόν అంటే ‘చేదైనది’; τὸ γλυκύతో సమాంతరంగా, సూచిత నామవాచకమైన ‘నీరు’ స్పష్టంగా చేర్చబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన అలంకారప్రశ్న. గ్రీకు వాక్యంలోని నీటి ఊట చిత్రం, ‘ఒకే’ అనే వ్యత్యాస బలం, తీపి–చేదు విరోధం నిలుపబడ్డాయి.
