  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: te
  text: క్రియల ద్వారా ఒక మనిషి నీతిమంతునిగా తీర్చబడతాడనీ, విశ్వాసం ద్వారా మాత్రమే కాదనీ మీరు చూస్తున్నారు[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీతిమంతుడని చూపబడతాడు’ లేదా ‘నీతిమంతుడని నిరూపించబడతాడు.’ ‘నీతిమంతునిగా తీర్చబడతాడు’ అనే పదాన్ని పౌలు ఉపయోగించిన విధానంతో ఈ వాక్యానికి ఉన్న సంబంధం గురించిన వ్యాఖ్యాన భేదాన్ని పరిష్కరించకుండా, యాకోబు మాటను యథాతథంగా ఉంచాం.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో ‘ఒక మనిషి’; ఇక్కడ అది సాధారణంగా ఏ మానవునినైనా సూచించే ప్రాతినిధ్య ప్రయోగం.
    reason: cultural_note
  - marker: c
    text: ‘విశ్వాసం’కు బదులుగా ‘నమ్మకం’ లేదా ‘విశ్వసనీయత’ అని కూడా అర్థం కావచ్చు; అయితే ఈ అనువాదంలో గ్రీకు πίστις‌కు సాధారణంగా ‘విశ్వాసం’ అనే పదమే వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: మీరు చూస్తున్నారు
  rationale: ఇది వర్తమానకాల, కర్తరి ప్రయోగ, బహువచన సూచనార్థక క్రియ. ముందు చెప్పిన అబ్రాహాము ఉదాహరణనుంచి పాఠకులు గ్రహిస్తున్న నిర్ధారణను నేరుగా తెలియజేస్తుంది; ఆజ్ఞార్థకంగా మార్చలేదు.
- source_word: ἐξ ἔργων
  choice: క్రియల మూలంగా
  rationale: ἐξ ఇక్కడ మూలం లేదా ఆధారాన్ని సూచిస్తుంది. ‘క్రియల మూలంగా’ అనే ప్రయోగం ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δικαιοῦται
  choice: నీతిమంతునిగా తీర్చబడతాడు
  rationale: δικαιόω అనే పదంలో నీతిమంతునిగా తీర్చడం, నీతిమంతుడని చూపడం, నిర్దోషిత్వాన్ని రుజువు చేయడం వంటి భావసాధ్యతలు ఉన్నాయి. ప్రధాన పాఠంలో దాని న్యాయపరమైన, వేదాంతపరమైన బరువును నిలుపుతూ వివరణాత్మక అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: గ్రీకు పదం పుంలింగ ఏకవచనంలో ఉన్నా ఇక్కడ మానవుణ్ణి సాధారణంగా సూచిస్తుంది. ‘ఒక మనిషి’ మూలరూపాన్ని, ప్రాతినిధ్య భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: πίστις‌కు ఈ సందర్భంలో సహజమైన ప్రధాన సమానార్థకం ‘విశ్వాసం.’ ‘నమ్మకం,’ ‘విశ్వసనీయత’ అనే ఇతర భావసాధ్యతలను పాదసూచికలో సూచించాం.
- source_word: μόνον
  choice: మాత్రమే
  rationale: విశ్వాసం ఒక్కటే అనే ప్రత్యేకతను సహజమైన తెలుగు పదక్రమంలో స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: δικαιοῦται అనే పదానికి నీతిమంతునిగా తీర్చడం లేదా నీతిమంతుడని చూపడం అనే అర్థాలు
  choice: ప్రధాన పాఠంలో ‘నీతిమంతునిగా తీర్చబడతాడు’ అని ఉంచడం
  alternative: ‘నీతిమంతుడని చూపబడతాడు’ లేదా ‘అతడు నీతిమంతుడని రుజువవుతుంది’
  rationale: యాకోబు వాడిన పదాన్ని పౌలు వాడుకతో ముందుగానే సమన్వయపరచకుండా, మూలంలోని వేదాంత ఉద్రిక్తతను నిలుపుతున్నాం. సందర్భానుసారమైన ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఇస్తున్నాం.
- issue: ἄνθρωπος యొక్క సాధారణ ప్రాతినిధ్య భావం
  choice: ‘ఒక మనిషి’
  alternative: ‘ఒక వ్యక్తి’ లేదా ‘మానవుడు’
  rationale: మూలంలోని ఏకవచన పుంలింగ రూపాన్ని ప్రతిబింబిస్తూనే, ఇది పురుషులకు మాత్రమే పరిమితమైన మాట కాదని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదైనా సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. ‘మీరు చూస్తున్నారు’ ద్వారా మూలంలోని సూచనార్థక బహువచనాన్ని నిలిపాం. వేదాంత వివాదాన్ని ప్రధాన పాఠంలో పరిష్కరించకుండా ప్రత్యామ్నాయాలను పాదసూచికల్లో ఇచ్చాం.
