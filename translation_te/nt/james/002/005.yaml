id: JAS.2.5
reference: James 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: te
  text: 'నా ప్రియ సహోదరులారా[a], వినండి: లోకపు దృష్టిలో పేదవారిని[b] విశ్వాసంలో[c] ధనవంతులుగాను, తనను ప్రేమించేవారికి తాను వాగ్దానం చేసిన రాజ్యానికి వారసులుగాను దేవుడు ఏర్పరచుకోలేదా?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా ప్రియ సహోదర సహోదరీలారా’; గ్రీకులో ‘సహోదరులు’ అని ఉంది, అయితే అది విశ్వాస సమాజమంతటినీ కలుపుకొని ఉద్దేశించి ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘లోక ప్రమాణాల ప్రకారం పేదవారిని.’
    reason: lexical_alternative
  - marker: c
    text: ‘విశ్వాసం’ను ‘నమ్మకం’ అని కూడా అనువదించవచ్చు; ఇక్కడ ‘విశ్వసనీయత’ అనే అర్థం తక్కువ సంభావ్యం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: వినండి
  rationale: బహువచన ఆజ్ఞారూపంలోని శ్రద్ధగా ఆలకించాలనే ప్రత్యక్ష పిలుపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: నా ప్రియ సహోదరులారా
  rationale: ἀδελφοί అనే పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, ἀγαπητοίలోని ఆప్యాయతను ‘ప్రియ’ తెలియజేస్తుంది; సమస్త విశ్వాస సమాజాన్ని ఉద్దేశించే అవకాశం పాదసూచికలో ఉంచబడింది.
- source_word: οὐχ ... ἐξελέξατο
  choice: దేవుడు ఏర్పరచుకోలేదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే గ్రీకు అలంకారప్రశ్నను నిలుపుతుంది. ‘ఏర్పరచుకున్నాడు’ దైవిక ఎంపికను తెలుపుతుంది గాని, ఈ వాక్యానికి మించిన సిద్ధాంతార్థాన్ని చేర్చదు.
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: లోకపు దృష్టిలో పేదవారిని
  rationale: τῷ κόσμῳను సంబంధం లేదా ప్రమాణాన్ని సూచించే దత్తివుగా గ్రహించి, ‘లోక ప్రమాణాల ప్రకారం’ అనే భావాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: πλουσίους ἐν πίστει
  choice: విశ్వాసంలో ధనవంతులుగా
  rationale: లోకసంబంధమైన పేదరికానికి వ్యతిరేకంగా ఆధ్యాత్మిక సమృద్ధిని వ్యక్తం చేస్తుంది; πίστιςకు ఇక్కడ ‘విశ్వాసం’ అత్యంత సహజమైన అర్థం.
- source_word: κληρονόμους τῆς βασιλείας
  choice: రాజ్యానికి వారసులుగా
  rationale: κληρονόμοιలోని న్యాయపరమైన, కుటుంబపరమైన వారసత్వ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν
  choice: తనను ప్రేమించేవారికి తాను వాగ్దానం చేసిన
  rationale: వాగ్దాన గ్రహీతలను దత్తివుకు అనుగుణంగా తెలియజేస్తూ, వర్తమాన కృదంతంలోని లక్షణాత్మక భావాన్ని ‘ప్రేమించేవారు’గా సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవుని ఎంపికను సిద్ధాంతపరంగా అతివ్యాఖ్యానించే అవకాశం
  choice: ἐξελέξατοను ‘ఏర్పరచుకున్నాడు’ అని సరళంగా అనువదించడం
  alternative: ముందస్తు నిర్ణయం లేదా రక్షణ ఎన్నిక సిద్ధాంతాన్ని స్పష్టంగా ముందుకు తెచ్చే వ్యాఖ్యానాత్మక పదజాలం వాడడం
  rationale: ఇక్కడ యాకోబు ఉద్దేశం పేదవారిపట్ల దేవుని విలువనూ, పక్షపాతంలోని అసంగతినీ చూపడం. తరువాతి సిద్ధాంత వివాదాలను వాక్యంలోకి చేర్చకుండా మూలంలోని భావాన్నీ ఉద్రిక్తతనూ నిలుపాలి.
- issue: ἀδελφοί యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులారా’ ఉంచి, సమగ్ర సమాజాన్ని సూచించే అవకాశాన్ని పాదసూచికలో తెలపడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘సహోదర సహోదరీలారా’ అని అనువదించడం
  rationale: గ్రీకు రూపం వ్యాకరణపరంగా పుంలింగ బహువచనం; అయితే పత్రికా సంబోధనలో అది విశ్వాస సమాజమంతటినీ కలుపుకొని ఉండవచ్చు.
- issue: ఈ వాక్యంలో πίστις అర్థం
  choice: ‘విశ్వాసం’
  alternative: ‘నమ్మకం’ లేదా, ఇక్కడ తక్కువ సంభావ్యంగా, ‘విశ్వసనీయత’
  rationale: ‘విశ్వాసంలో ధనవంతులు’ అనే నిర్మాణంలో దేవునిపై విశ్వాసమే సందర్భానికి అత్యంత సహజం; ఇతర పదార్థ అవకాశాలు పాదసూచికలో సంరక్షించబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభమైన శైలి. గ్రీకు అలంకారప్రశ్న, పేదరికం–విశ్వాససంపద వ్యత్యాసం, ఎంపిక మరియు వారసత్వ పదజాలం నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
