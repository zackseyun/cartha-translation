id: JAS.2.18
reference: James 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: te
  text: 'అయితే ఎవరో ఇలా అంటాడు: “నీకు విశ్వాసం ఉంది, నాకు క్రియలు ఉన్నాయి.” క్రియలు లేకుండా నీ విశ్వాసాన్ని నాకు చూపించు[a][b]; నేను నా క్రియల ద్వారా నా విశ్వాసాన్ని నీకు చూపిస్తాను[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్రియల నుండి వేరుగా.” గ్రీకు పదబంధానికి “క్రియలు లేకుండా” లేదా “క్రియల నుండి వేరుగా” అని అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “విశ్వాసం” అనే గ్రీకు పదానికి “నమ్మకం” అని కూడా అర్థం కావచ్చు; కొన్ని సందర్భాల్లో “విశ్వసనీయత” అనే భావమూ ఉంటుంది.
    reason: alternative_reading
  - marker: c
    text: లేదా “నా క్రియల నుండి.” గ్రీకు విభక్త్యర్థక పదం మూలాన్ని లేదా సాధనాన్ని సూచించగలదు; “ద్వారా” అనేది క్రియలు విశ్వాసాన్ని కనిపించేలా చేస్తాయనే భావాన్ని వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλ’
  choice: అయితే
  rationale: ముందున్న వాదనకు ప్రతిస్పందనగా ఊహాత్మక అభ్యంతరాన్ని ప్రవేశపెట్టే వ్యతిరేక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐρεῖ τις
  choice: ఎవరో ఇలా అంటారు
  rationale: గ్రీకు భవిష్యత్ రూపం వాదనా శైలిలో ఊహాత్మక వక్తను ప్రవేశపెడుతుంది; తెలుగులో వర్తమాన రూపం ఈ అలంకారిక ప్రయోగాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πίστιν
  choice: విశ్వాసం
  rationale: యాకోబు వాదనలో స్థిరమైన కీలక పదంగా ఉండి, నమ్మకం లేదా విశ్వసనీయత అనే సాధ్యమైన భావాలను ముందుగానే సంకుచితం చేయకుండా వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
- source_word: ἔργα
  choice: క్రియలు
  rationale: ఈ విభాగంలోని విశ్వాసం–క్రియలు అనే భావసంబంధాన్ని, వేదాంతపరమైన పరిచిత పదజాలాన్ని నిలుపుతుంది.
- source_word: δεῖξόν μοι
  choice: నాకు చూపించు
  rationale: స్పష్టమైన ప్రదర్శనను కోరే ఆజ్ఞను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: χωρὶς τῶν ἔργων
  choice: క్రియలు లేకుండా
  rationale: χωρίς యొక్క ‘వేరుగా/లేకుండా’ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: κἀγώ σοι δείξω
  choice: నేను ... నీకు చూపిస్తాను
  rationale: ప్రతివాదంలోని ‘నేను’ అనే ఉద్ఘాటనను, భవిష్యత్ వాగ్దాన రూపాన్ని నిలుపుతుంది.
- source_word: ἐκ τῶν ἔργων μου
  choice: నా క్రియల ద్వారా
  rationale: ἐκ ఇక్కడ మూలం లేదా సాధనాన్ని సూచించగలదు; ప్రధాన పాఠంలో క్రియలు విశ్వాసాన్ని కనిపించేలా చేసే సాధనమనే సందర్భోచిత భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: విశ్వాసం మరియు క్రియల చర్చలో πίστις అర్థం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ‘విశ్వసనీయత’ అని అనువదిస్తే వాక్యంలోని వేదాంతపరమైన ఉద్రిక్తత ముందుగానే పరిష్కారమవుతుంది. ‘విశ్వాసం’ మూలపద పరిధిని, యాకోబు వాదనలోని ప్రశ్నను నిలుపుతుంది.
- issue: ἐκ τῶν ἔργων μουలో క్రియలు విశ్వాసానికి మూలమా, దాన్ని చూపే సాధనమా
  choice: నా క్రియల ద్వారా
  alternative: నా క్రియల నుండి
  rationale: గ్రీకు ἐκ మూలం లేదా ఆధారాన్ని సూచించగలదు. సందర్భంలో క్రియల ద్వారా విశ్వాసం ప్రదర్శితమవుతుందనే భావం సహజంగా ఉన్నా, ‘నుండి’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, నేరుగా సాగే వాదనా శైలి. ‘విశ్వాసం,’ ‘క్రియలు’ అనే పరిచిత కీలక పదాలను స్థిరంగా ఉంచి, మూలంలోని సమాంతర నిర్మాణాన్ని సాధ్యమైనంతవరకు కాపాడాం.
