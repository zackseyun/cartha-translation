source:
  edition: SBLGNT
  text: Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/001.yaml
  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: te
  text: నా సహోదరులారా,[a] మహిమగల మన ప్రభువైన యేసు మెస్సీయపై విశ్వాసం ఉంచుతూ పక్షపాతం చూపకండి.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా సహోదర సహోదరీలారా.” గ్రీకులో “సహోదరులారా” అని ఉన్నా, సందర్భంలో విశ్వాస సమాజమంతా ఉద్దేశించబడింది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు నిర్మాణాన్ని మరింత అక్షరార్థంగా “మన ప్రభువైన యేసు మెస్సీయకు సంబంధించిన విశ్వాసం” అని కూడా అర్థం చేసుకోవచ్చు; ఆ సంబంధం ఒకే విధంగా నిర్ధారించబడదు.
    reason: alternative_reading
  - marker: c
    text: లేదా “మన ప్రభువైన యేసు మెస్సీయ, మహిమ యొక్క ప్రభువు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: నా సహోదరులారా
  rationale: పుంలింగ బహువచన సంబోధనను నేరుగా నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా వినిపిస్తుంది; విశ్వాస సమాజమంతటినీ ఉద్దేశించే విస్తృత సందర్భార్థాన్ని పాదటీపులో తెలిపాం.
- source_word: μὴ ... ἔχετε
  choice: ఉంచుతూ ... చూపకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థక రూపంలోని నిషేధాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ἐν προσωπολημψίαις
  choice: పక్షపాతం చూపుతూ
  rationale: προσωπολημψία సూచించే వ్యక్తుల మధ్య అన్యాయమైన భేదభావాన్ని సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది; గ్రీకు బహువచనాన్ని తెలుగులో సహజంగా సమాహార భావంతో తెలిపింది.
- source_word: τὴν πίστιν
  choice: విశ్వాసం
  rationale: ఇక్కడ πίστιςకు ప్రాథమికమైన అర్థాన్ని నిలుపుతుంది; తెలుగులో నిర్దిష్ట ఉపపదం లేకపోవడం వల్ల సందర్భమే నిర్దిష్టతను తెలియజేస్తుంది.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: మన ప్రభువైన యేసు మెస్సీయపై
  rationale: κύριοςను ‘ప్రభువు’గా, Χριστόςను సజీవమైన బిరుదుగా ‘మెస్సీయ’గా అనువదించింది. πίστιςతో వచ్చిన షష్ఠీ విభక్తిని ప్రధాన పాఠ్యంలో సహజమైన లక్ష్యార్థక ‘పై’తో తెలిపి, మరో సాధ్యమైన సంబంధాన్ని పాదటీపులో ఉంచింది.
- source_word: τῆς δόξης
  choice: మహిమగల
  rationale: ఈ షష్ఠీ రూపాన్ని ప్రభువైన యేసును విశేషించే గుణార్థక నిర్మాణంగా సహజ తెలుగులో తెలిపింది; ‘మహిమకు ప్రభువు’ అనే సాధ్యమైన ఘనమైన బైబిలీయ ప్రయోగాన్ని పాదటీపులో నిలిపింది.
theological_decisions:
- issue: τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦలో షష్ఠీ విభక్తి సంబంధం
  choice: మన ప్రభువైన యేసు మెస్సీయపై విశ్వాసం
  alternative: మన ప్రభువైన యేసు మెస్సీయకు సంబంధించిన విశ్వాసం; లేదా మన ప్రభువైన యేసు మెస్సీయ యొక్క విశ్వాసం
  rationale: తెలుగులో ‘యొక్క విశ్వాసం’ ప్రధాన పాఠ్యంలో యేసు చూపిన విశ్వాసం/విశ్వసనీయత అనే భావాన్ని బలంగా రేకెత్తించి వాక్యాన్ని అసహజం చేస్తుంది. అందువల్ల సందర్భానికి సహజమైన లక్ష్యార్థాన్ని ప్రధాన పాఠ్యంలో ఎంచుకుని, గ్రీకు నిర్మాణంలోని విస్తృత సంబంధార్థాన్ని పాదటీపులో సంరక్షించాం.
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ‘ప్రభువైన యేసు’తో కూడిన ఈ ఘనమైన బిరుదుల వరుసలో Χριστός యొక్క అభిషిక్త రాజు అనే బిరుదార్థం సజీవంగా ఉంది; అందుకే ‘మెస్సీయ’ను ఎంచుకున్నాం.
- issue: Ἀδελφοί అనే లింగసూచక సంబోధన
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా
  rationale: గ్రీకు రూపంలోని పుంలింగ బహువచనాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. అయితే యాకోబు మిశ్రమ విశ్వాస సమాజాన్ని ఉద్దేశిస్తున్నందున సమగ్ర సందర్భార్థాన్ని పాదటీపులో స్పష్టం చేశాం.
- issue: τῆς δόξης యొక్క అన్వయం
  choice: మహిమగల మన ప్రభువు
  alternative: మన ప్రభువైన యేసు మెస్సీయ, మహిమకు ప్రభువు
  rationale: గ్రీకు పదబంధం గుణార్థకంగా లేదా వివరణాత్మక బిరుదుగా అర్థమవవచ్చు. ప్రధాన పాఠ్యంలో సహజమైన గుణార్థక రూపాన్ని వాడి, ‘మహిమకు ప్రభువు’ అనే ప్రత్యామ్నాయాన్ని పాదటీపులో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంఘంలో బహిరంగంగా చదవడానికి తగిన గౌరవప్రదమైన, స్పష్టమైన శైలి. ‘కలిగియుండకండి’ వంటి పాతబడ్డ రూపాలను నివారించి, ‘విశ్వాసం ఉంచుతూ పక్షపాతం చూపకండి’ అనే సహజ నిషేధ నిర్మాణాన్ని ఉపయోగించాం.
