id: JAS.2.2
reference: James 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: te
  text: ఎందుకంటే, బంగారు ఉంగరాలు ధరించి, శోభాయమానమైన వస్త్రాలు వేసుకున్న ఒక మనిషి మీ సమావేశానికి[a] ప్రవేశిస్తే, మురికి వస్త్రాలు వేసుకున్న ఒక పేదవాడు కూడా ప్రవేశిస్తే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదుల ప్రార్థనామందిరానికి.” గ్రీకు పదం సునగోగే; దాని అక్షరార్థం “ప్రార్థనామందిరం” లేదా “సమావేశం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: సమావేశం
  rationale: ఈ సందర్భంలో కూడివచ్చిన సమూహాన్ని సహజంగా సూచిస్తుంది; గ్రీకు పదానికి ఉన్న ‘సమాజమందిరం’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἀνὴρ
  choice: ఒక మనిషి
  rationale: గ్రీకు పదం పురుష ఏకవచనం; దృష్టాంతంలోని పురుష వ్యక్తిని స్పష్టంగా నిలుపుతుంది.
- source_word: χρυσοδακτύλιος
  choice: బంగారు ఉంగరాలు ధరించి
  rationale: వేళ్లపై బంగారు ఆభరణాలు ఉన్న వ్యక్తిని సూచించే గ్రీకు విశేషణానికి ఇది సహజమైన తెలుగు; సంపద ప్రదర్శన భావాన్ని నిలుపుతుంది.
- source_word: ἐσθῆτι λαμπρᾷ
  choice: మెరిసే వస్త్రాలు వేసుకున్న
  rationale: λαμπρός లోని ప్రకాశవంతమైన లేదా శోభాయమానమైన దృశ్యభావాన్ని ‘మెరిసే’ నిలుపుతుంది.
- source_word: πτωχὸς
  choice: ఒక పేదవాడు
  rationale: పురుష ఏకవచనంగా నామవాచకార్థంలో వాడిన విశేషణాన్ని, మొదటి వ్యక్తితో ఉన్న వ్యతిరేక సమాంతరతను నిలుపుతూ అనువదిస్తుంది.
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: మురికి వస్త్రాలు వేసుకున్న
  rationale: ῥυπαρός సూచించే మలినతను నేరుగా, ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: వచ్చాడనుకోండి ... కూడా వచ్చాడనుకోండి
  rationale: తెలుగు ఊహాత్మక దృష్టాంతానికి సహజమైన నిర్మాణంలో, పునరుక్త క్రియను మరియు సమాంతరతను నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలోని పక్షపాత నిషేధానికి ఈ దృష్టాంతం వివరణగా అనుసంధానమవుతున్నదని తెలియజేస్తుంది.
theological_decisions:
- issue: క్రైస్తవ సందర్భంలోని συναγωγή అనువాదం
  choice: సమావేశం
  alternative: సమాజమందిరం
  rationale: ఈ పదం ఇక్కడ సంఘ పరిపాలనపై సిద్ధాంత ప్రకటన చేయకుండా, కూడివచ్చిన సమావేశాన్ని సూచిస్తుంది. ‘సమావేశం’ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది; గ్రీకు పదపు మరింత అక్షరార్థమైన ‘సమాజమందిరం’ పాదటిప్పణిలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ఊహాత్మక ἐὰν నిర్మాణాన్ని సహజమైన ‘వచ్చాడనుకోండి’ రూపంలో వ్యక్తపరచి, రెండు వ్యక్తుల మధ్య సమాంతర వ్యతిరేకతను నిలిపాం.
