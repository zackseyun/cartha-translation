revisions:
- from: మీ మీద పిలువబడిన ఆ ఘనమైన నామాన్ని దూషించేది వారే కాదా?[a][b]
  to: మీపై పిలువబడిన ఆ ఘనమైన నామాన్ని దూషించేవారు వారే కాదా?[a][b]
  rationale: The revision corrects the plural verbal expression while preserving the Greek rhetorical emphasis and the source’s intentional ambiguity concerning the name. It also makes the alternative-reading footnote idiomatic and complete without asserting a particular covenantal or baptismal interpretation.
  reviewer_model: gpt-5.6-terra
