  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ αὐτοὶ βλασφημοῦσιν τὸ καλὸν ὄνομα τὸ ἐπικληθὲν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/007.yaml
  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: te
  text: మీపై పిలువబడిన ఆ ఘనమైన నామాన్ని దూషించేవారు వారే కాదా?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ గౌరవనీయమైన నామాన్ని’ లేదా ‘ఆ శ్రేష్ఠమైన నామాన్ని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీపై పిలువబడిన నామం.’ ఈ మాట విశ్వాసులు ఏ నామంతో గుర్తింపబడుతున్నారో సూచించే అవకాశం ఉంది; ఒడంబడిక లేదా బాప్తిస్మానికి సంబంధించిన భాషను కూడా ప్రతిధ్వనింపజేయవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: వారే కాదా?
  rationale: οὐκతో కూడిన ప్రశ్న సానుకూల సమాధానాన్ని ఆశిస్తుంది; αὐτοὶలోని బలాన్ని ‘వారే’ సహజంగా నిలుపుతుంది.
- source_word: βλασφημοῦσιν
  choice: దూషించేది
  rationale: ఈ క్రియ అపకీర్తిగా, అవమానకరంగా మాట్లాడడాన్ని సూచిస్తుంది; ఇక్కడ గౌరవనీయమైన నామం కర్మగా ఉన్నందున ‘దూషించు’ మతపరమైన తీవ్రతను కూడా నిలుపుతుంది.
- source_word: τὸ καλὸν ὄνομα
  choice: ఆ ఘనమైన నామం
  rationale: καλός ఇక్కడ మంచితనంతో పాటు గౌరవనీయత, శ్రేష్ఠత భావాలను కలిగి ఉంది. ‘ఘనమైన’ అనేది ఆధునిక తెలుగులో సహజంగా ఆ గౌరవార్థాన్ని వ్యక్తం చేస్తుంది; నిర్దిష్ట నామాన్ని వచనం చెప్పకపోవడాన్ని ‘నామం’ అలాగే నిలుపుతుంది.
- source_word: τὸ ἐπικληθὲν
  choice: పిలువబడిన
  rationale: ἐπικαλέω యొక్క నిష్క్రియ భావాన్ని నేరుగా నిలుపుతూ, నామం ఒకరి మీద పిలువబడే గ్రీకు ప్రయోగాన్ని తరువాతి పదబంధంతో కలిపి ఉంచుతుంది.
- source_word: ἐφ’ ὑμᾶς
  choice: మీ మీద
  rationale: ἐπίతో ఉన్న ‘మీ మీద/పై’ అనే స్థానిక రూపకాన్ని కాపాడుతుంది; విశ్వాసులు ఆ నామంతో గుర్తింపబడుతున్నారనే భావాన్ని ముందుగానే వివరణాత్మకంగా మార్చదు.
theological_decisions:
- issue: ‘ఆ ఘనమైన నామం’ దేనిని సూచిస్తుంది?
  choice: విశ్వాసుల మీద పిలువబడిన గౌరవనీయమైన నామం అని ఉద్దేశపూర్వకంగా విస్తృతంగా ఉంచడం
  alternative: దీనిని నేరుగా ‘క్రీస్తు నామం’ లేదా ‘యేసు నామం’ అని అనువదించడం
  rationale: గ్రీకు వాక్యం నామాన్ని స్పష్టంగా పేర్కొనదు. యాకోబు 2:1 సందర్భం ప్రభువైన యేసు మెస్సీయను బలంగా సూచించినా, ప్రధాన పాఠ్యంలో ‘యేసు’ లేదా ‘క్రీస్తు’ను చేర్చడం మూలంలోని అనిశ్చితిని తొలగిస్తుంది. అందువల్ల సాధ్యమైన క్రీస్తు-సంబంధ సూచనను తెరిచి ఉంచుతూ పదబంధాన్ని నిర్దిష్టీకరించలేదు.
- issue: ‘మీ మీద పిలువబడిన’ అనే ప్రయోగం యొక్క నేపథ్యం
  choice: నామం వారి మీద పిలువబడిందనే మూల రూపకాన్ని నిలుపడం
  alternative: ‘మీరు ఏ నామంతో పిలువబడుతున్నారో’ అని గుర్తింపు భావంతో వివరణాత్మకంగా అనువదించడం
  rationale: ఈ ప్రయోగం సమాజపు గుర్తింపును సూచించవచ్చు; ఒడంబడిక లేదా బాప్తిస్మ సంబంధ భాషను ప్రతిధ్వనింపజేసే అవకాశమూ ఉంది. అయితే వాక్యమే ఆ నేపథ్యాన్ని ఖచ్చితంగా నిర్ణయించదు కాబట్టి అనువాదం దానిని నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రశ్నారూపం వాడబడింది. ‘వారే’ ద్వారా గ్రీకులోని నొక్కిచెప్పే భావం నిలిచింది. ‘నామం’ అనే పదం బైబిలీయ గౌరవం, వ్యక్తిత్వం, అధికారాన్ని మోసేలా ఉంచబడింది; మూలంలో లేని నిర్దిష్ట క్రీస్తు-పేరు ప్రధాన పాఠ్యంలో చేర్చబడలేదు.
