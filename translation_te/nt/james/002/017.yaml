  text: So also faith[a], if it does not have works, is dead by itself.
translation:
  language: te
  text: అలాగే, విశ్వాసం[a]కు క్రియలు లేకపోతే, అది దానికదే మృతమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నమ్మకం’; ఇక్కడ ‘విశ్వసనీయత’ అనే అర్థం ఉండే అవకాశం తక్కువ. గ్రీకు పదమైన పిస్టిస్‌కు ఈ అర్థాలు ఉండవచ్చు; అయితే ఈ వాక్యంలో యాకోబు చేస్తున్న వాదనకు ‘విశ్వాసం’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: అలాగే
  rationale: ముందున్న ఉదాహరణతో పోలికను, దాని నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ πίστις
  choice: విశ్వాసం
  rationale: యాకోబు వాదనలో ఇక్కడ చెప్పబడుతున్నది ప్రధానంగా ప్రకటించుకునే విశ్వాసం; ఈ పదం గ్రీకు పదంలోని భావాన్ని, విశ్వాసం–క్రియల మధ్య ఉన్న ఉద్రిక్తతను కాపాడుతుంది.
- source_word: ἐὰν μὴ ἔχῃ
  choice: కలిగి లేకపోతే
  rationale: ἐάν μήతో వచ్చిన షరతును, ‘క్రియలు దానికి లేకపోవడం’ అనే భావాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: ἔργα
  choice: క్రియలు
  rationale: విశ్వాసం నిజమైనదని బయటకు చూపే కార్యాలను సూచిస్తూ, యాకోబు 2 అంతటా ఉన్న పదసంబంధాన్ని కాపాడుతుంది; భావాన్ని ఒక ప్రత్యేక రకమైన పనులకు పరిమితం చేయదు.
- source_word: νεκρά
  choice: మృతమైనది
  rationale: మూలంలోని బలమైన రూపకాన్ని మృదువుచేయకుండా, గౌరవప్రదమైన సహజ తెలుగులో అందిస్తుంది.
- source_word: καθ’ ἑαυτήν
  choice: దానంతట అదే
  rationale: క్రియల నుండి వేరుగా, ఒంటరిగా పరిగణించిన విశ్వాసం అనే భావాన్ని అదనపు వ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: విశ్వాసం మరియు క్రియలపై చర్చకు కేంద్రంగా ఉన్న πίστις పదం అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఈ సందర్భంలో యాకోబు క్రియలు తోడులేని, ప్రకటించుకునే విశ్వాసం గురించి మాట్లాడుతున్నాడు. ‘విశ్వాసం’ మూలంలోని పదార్థాన్నీ theological tensionనూ కాపాడుతుంది; విశ్వాసం ద్వారా నీతిమంతులుగా తీర్చబడటం లేదా క్రియల పాత్ర గురించిన ఏ సంప్రదాయపరమైన పరిష్కారాన్నీ వాక్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘క్రియలు,’ ‘మృతమైనది’ వంటి పదాలు సందర్భంలోని గంభీరతను, పదసంబంధాన్ని నిలుపుతాయి.
