id: JAS.2.14
reference: James 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: te
  text: నా సహోదరులారా,[a] ఎవడైనా తనకు విశ్వాసం ఉందని చెప్పి, క్రియలు లేకపోతే, దానివల్ల ప్రయోజనం ఏమిటి? ఆ విశ్వాసం అతన్ని రక్షించగలదా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నా సహోదర సహోదరీలారా” అని కూడా భావించవచ్చు. గ్రీకులో పుంలింగ బహువచనమైన “సహోదరులు” విశ్వాసుల సమాజమంతటికీ ప్రాతినిధ్య సంబోధనగా వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: “అలాంటి విశ్వాసం అతన్ని రక్షించగలదా?” అని కూడా అనువదించవచ్చు. గ్రీకులో అక్షరార్థంగా “ఆ విశ్వాసం” అని ఉంది; ఇది క్రియలు లేని, ఉందని చెప్పబడిన విశ్వాసాన్ని తిరిగి సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: దానివల్ల ప్రయోజనం ఏమిటి?
  rationale: గ్రీకు అలంకారప్రశ్నలోని ఆచరణాత్మక ప్రయోజనం లేదా లాభం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀδελφοί μου
  choice: నా సహోదరులారా
  rationale: మూలంలోని పుంలింగ బహువచన సంబోధనను గౌరవప్రదంగా నిలుపుతుంది; ఇది విశ్వాసుల సమాజమంతటికీ ప్రాతినిధ్య సంబోధనగా ఉండగలదని పాదసూచిక తెలియజేస్తుంది.
- source_word: πίστιν
  choice: విశ్వాసం
  rationale: ఇక్కడ ఒక వ్యక్తి తనకు ఉందని చెప్పుకునే నమ్మకాన్ని సూచిస్తుంది; యాకోబు వాదనలోని ప్రధాన పదబంధ సంబంధాన్ని నిలుపుతుంది.
- source_word: λέγῃ τις ἔχειν
  choice: ఎవడైనా తనకు ... ఉందని చెబుతూ
  rationale: ‘కలిగియున్నానని చెప్పడం’ అనే గ్రీకు నిర్మాణానికి దగ్గరగా ఉండి, కేవలం ప్రకటిత దావాను సహజంగా తెలుపుతుంది.
- source_word: ἔργα
  choice: క్రియలు
  rationale: విశ్వాసం–క్రియలు అనే యాకోబు పత్రికలోని వాదనాత్మక, ధార్మిక పదసంబంధాన్ని నిలుపుతుంది; కేవలం సాధారణ చర్యలుగా భావాన్ని పలుచన చేయదు.
- source_word: μὴ ἔχῃ
  choice: లేకుండా ఉంటే
  rationale: క్రియలు అతనికి లేవనే స్థితిని సహజమైన తెలుగు షరతు వాక్యంలో వ్యక్తం చేస్తుంది.
- source_word: μὴ δύναται
  choice: రక్షించగలదా?
  rationale: μή వల్ల ప్రతికూల సమాధానం ఆశించబడే అలంకారప్రశ్నను అదనపు వివరణ చేర్చకుండా ప్రశ్నరూపంలోనే నిలుపుతుంది.
- source_word: ἡ πίστις
  choice: ఆ విశ్వాసం
  rationale: నిర్దిష్ట ఉపపదం ముందుగా చెప్పిన—క్రియలు లేని ప్రకటిత విశ్వాసాన్ని—తిరిగి సూచిస్తున్న అనాఫరిక భావాన్ని తెలుపుతుంది.
- source_word: σῶσαι αὐτόν
  choice: అతన్ని రక్షించగలదా
  rationale: σῴζω యొక్క సాధారణ ధార్మిక బరువును ‘రక్షించు’ నిలుపుతుంది; αὐτόν యొక్క ఏకవచన పుంలింగ రూపాన్నీ ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: విశ్వాసం మరియు క్రియల సంబంధం
  choice: ‘ఆ విశ్వాసం’ అని అనువదించి, క్రియలు లేవని చెప్పబడిన విశ్వాసాన్నే ప్రశ్న తిరిగి సూచించేలా చేయడం.
  alternative: ‘విశ్వాసం అతన్ని రక్షించగలదా?’ లేదా ‘అలాంటి విశ్వాసం అతన్ని రక్షించగలదా?’
  rationale: ἡ πίστις లోని నిర్దిష్టత ముందటి వాక్యంలోని విశ్వాసాన్ని సూచిస్తుంది. ‘ఆ విశ్వాసం’ మూలంలోని ఉద్రిక్తతను నిలుపుతూ, విశ్వాసం సాధారణంగా రక్షించలేదని విస్తరించదు; అలాగే సిద్ధాంతపరమైన పరిష్కారాన్ని వాక్యంలోకి దిగుమతి చేయదు.
- issue: సంబోధన మరియు ఏకవచన పుంలింగ రూపం
  choice: ‘నా సహోదరులారా’ మరియు ‘అతన్ని’ అని మూల రూపాలకు అనుగుణంగా ఉంచడం.
  alternative: ‘నా సహోదర సహోదరీలారా’ మరియు లింగతటస్థ బహువచన రూపం.
  rationale: గ్రీకు పుంలింగ రూపాలను ప్రధాన పాఠ్యంలో నిలుపుతూ, సంబోధన విశ్వాసుల సమాజమంతటికీ ప్రాతినిధ్యంగా ఉండవచ్చని పాదసూచికలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘సహోదరులారా,’ ‘విశ్వాసం,’ ‘క్రియలు,’ ‘రక్షించు’ వంటి పదాలు మూలంలోని ధార్మిక పదసంబంధాలను నిలుపుతాయి. అలంకారప్రశ్న యొక్క ప్రతికూల నిరీక్షణను వివరణాత్మకంగా విస్తరించకుండా ప్రశ్నరూపంలోనే ఉంచాం.
