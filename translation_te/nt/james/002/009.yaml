base_translation:
  language: en
  yaml_path: translation/nt/james/002/009.yaml
  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: te
  text: కాని మీరు పక్షపాతం చూపిస్తే[a], పాపం చేస్తున్నారు; ధర్మశాస్త్రం మిమ్మల్ని దాని ఉల్లంఘకులుగా[b] నిర్ధారిస్తుంది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముఖపక్షం చూపిస్తే.’ గ్రీకు క్రియ బాహ్య హోదా లేదా రూపాన్ని బట్టి మనుషులను చూడడం లేదా వారితో ప్రవర్తించడం అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతిక్రమకులుగా,’ ‘ధర్మశాస్త్రాన్ని మీరినవారిగా.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మీ తప్పును బయటపెడుతుంది,’ ‘మిమ్మల్ని మందలిస్తుంది.’ గ్రీకు పదం తప్పును వెలుగులోకి తెచ్చి, దోషిగా నిర్ధారించే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: కాని ... చూపిస్తే
  rationale: εἰ యొక్క షరతును ‘చూపిస్తే’ తెలియజేస్తుంది; δέ ముందున్న వాదనతో ఉన్న వ్యత్యాసాన్ని ‘కాని’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: προσωπολημπτεῖτε
  choice: మీరు పక్షపాతం చూపిస్తే
  rationale: బాహ్య స్థితి, హోదా లేదా రూపాన్ని బట్టి వ్యక్తులను భిన్నంగా చూడడం లేదా ప్రవర్తించడం అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: పాపం చేస్తున్నారు
  rationale: అక్షరార్థంగా ‘పాపాన్ని చేయడం’ అనే గ్రీకు ప్రయోగాన్ని సహజమైన తెలుగులో, వర్తమాన క్రియాభావాన్ని నిలుపుతూ అందిస్తుంది.
- source_word: ἐλεγχόμενοι
  choice: దోషులని నిరూపిస్తుంది
  rationale: తప్పును వెలికి తీసి దోషాన్ని స్థాపించడం అనే న్యాయసంబంధ భావాన్ని తెలియజేస్తుంది; గ్రీకులోని కర్మణి భావం తెలుగులో ధర్మశాస్త్రాన్ని కర్తగా ఉంచి సహజంగా వ్యక్తమవుతుంది.
- source_word: ὑπὸ τοῦ νόμου
  choice: ధర్మశాస్త్రం
  rationale: νόμος అనే పదానికి తెలుగు బైబిలు పరిభాషలో సహజమైన సమానార్థకం; ‘మోషే ధర్మశాస్త్రం’ లేదా ‘దేవుని ధర్మశాస్త్రం’ అని మూలంలో లేని నిర్దిష్టతను చేర్చదు.
- source_word: ὡς παραβάται
  choice: దాని ఉల్లంఘకులుగా
  rationale: నిర్దేశించిన హద్దును లేదా నియమాన్ని మీరినవారు అనే న్యాయపరమైన భావాన్ని స్పష్టంగా తెలుపుతుంది. ‘దాని’ అనేది తెలుగులో సంబంధాన్ని సహజంగా చేసి, ధర్మశాస్త్రాన్నే సూచిస్తుంది.
theological_decisions:
- issue: యాకోబు నైతిక వాదనలో νόμος యొక్క పరిధి
  choice: ‘ధర్మశాస్త్రం’ అని మాత్రమే అనువదించడం
  alternative: ‘మోషే ధర్మశాస్త్రం’ లేదా ‘దేవుని ధర్మశాస్త్రం’
  rationale: ఈ వచనంలో ధర్మశాస్త్రం పక్షపాతాన్ని పాపంగా బయటపెట్టే ప్రమాణంగా ఉంది. గ్రీకు పాఠం దాని పరిధిని ఇక్కడ మరింత నిర్దిష్టంగా చెప్పదు; అందువల్ల అనువాదం ఏ ప్రత్యేక నిబంధనా లేదా సంఘపరమైన వ్యాఖ్యానాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే ‘ధర్మశాస్త్రం,’ ‘పాపం,’ ‘ఉల్లంఘకులు’ వంటి గౌరవప్రదమైన బైబిలు-న్యాయ పరిభాషను నిలుపుకుంది.
