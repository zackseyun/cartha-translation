id: JAS.2.13
reference: James 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος· κατακαυχᾶται ⸀ἔλεος κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: te
  text: ఎందుకంటే, కనికరం చూపనివానికి తీర్పు కనికరం లేకుండా ఉంటుంది; కనికరం తీర్పుపై విజయం సాధిస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కనికరం తీర్పుపై అతిశయిస్తుంది.” గ్రీకు క్రియకు దేనిమీదనైనా అతిశయించడం లేదా విజయోత్సాహం చూపడం అనే భావం ఉండవచ్చు; ప్రధాన పాఠంలో దానిని సహజంగా “విజయం సాధిస్తుంది” అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: తీర్పు / తీర్పుపై
  rationale: దైవిక న్యాయపరమైన మదింపును సూచించే సహజమైన తెలుగు పదం. రెండు సందర్భాల్లోనూ ఒకే మూలపద సంబంధాన్ని నిలుపుతుంది.
- source_word: ἀνέλεος
  choice: కనికరం లేకుండా
  rationale: తీర్పు స్వభావాన్ని తెలిపే విధంగా, ἔλεοςతో ఉన్న పదసంబంధాన్ని స్పష్టంగా నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: కనికరం చూపనివానికి
  rationale: ‘కనికరం చేయడం’ అనే మూలభాషా ప్రయోగాన్ని తెలుగులో సహజమైన ‘కనికరం చూపడం’గా అందిస్తుంది; తీర్పు ఎదుర్కొనే వ్యక్తిని స్పష్టంగా గుర్తిస్తుంది.
- source_word: κατακαυχᾶται
  choice: విజయం సాధిస్తుంది
  rationale: ఈ మధ్యమవాచక క్రియలోని ‘దేనిమీదనైనా అతిశయించడం/విజయోత్సాహం చూపడం’ అనే రూపక బలాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἔλεος
  choice: కనికరం
  rationale: ఈ వచనంలో మూడుసార్లు ప్రతిధ్వనించే mercy భావానికి సాధారణంగా అర్థమయ్యే, గౌరవప్రదమైన తెలుగు సమానం.
theological_decisions:
- issue: κατακαυχᾶται ἔλεος κρίσεως అనే చివరి వాక్యభాగం యొక్క భావం
  choice: కనికరం తీర్పుపై విజయం సాధిస్తుంది
  alternative: కనికరం తీర్పుపై అతిశయిస్తుంది
  rationale: సంక్షిప్తమైన సామెతసదృశ వాక్యాన్ని సాధారణ సూత్రంగానే ఉంచుతుంది. ఇది దేవుని కనికరాన్నా, తీర్పులో పనిచేసే కనికరాన్నా, విశ్వాసులు చూపిన కనికరాన్నా ప్రత్యేకంగా నిర్ణయించకుండా మూలంలోని ఉద్దేశపూర్వక వేదాంత ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘కనికరం’ అనే పదాన్ని పునరావృతం చేసి మూలంలోని ἔλεος పదబంధ సంబంధాన్ని నిలిపాం.
