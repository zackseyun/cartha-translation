  to: మన తండ్రియైన అబ్రాహాము తన కుమారుడైన ఇస్సాకును బలిపీఠం మీద అర్పించినప్పుడు, క్రియలవల్ల నీతిమంతుడిగా తీర్చబడలేదా?[a]
  rationale: The revision retains the source’s ambiguity concerning δικαιόω and preserves the rhetorical force of the question. It regularizes the Telugu name spelling, clarifies the appositional phrase ‘our father Abraham,’ and refines the alternative-reading footnote without imposing a theological interpretation.
