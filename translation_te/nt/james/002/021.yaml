id: JAS.2.21
reference: James 2:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: te
  text: మన తండ్రియైన అబ్రాహాము తన కుమారుడైన ఇస్సాకును బలిపీఠం మీద అర్పించినప్పుడు, క్రియలవల్ల నీతిమంతుడిగా తీర్చబడలేదా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీతిమంతుడని చూపబడలేదా?’ లేదా ‘నీతిమంతుడని రుజువుకాలేదా?’ సందర్భాన్ని బట్టి గ్రీకు క్రియకు నీతిమంతుడిగా ప్రకటించే భావం లేదా ఒకరి నీతిని ప్రదర్శించే భావం ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: మన తండ్రి
  rationale: కుటుంబ సంబంధ రూపకాన్నీ, నిబంధన సమాజపు గుర్తింపునీ నిలుపుతుంది; ‘మన పూర్వికుడు’ కంటే మూలంలోని సంబంధాత్మక బలం స్పష్టంగా ఉంటుంది.
- source_word: ἐξ ἔργων
  choice: క్రియలవల్ల
  rationale: ἐξ ఇక్కడ మూలం లేదా ఆధారాన్ని సూచిస్తుంది. ‘క్రియలవల్ల’ సహజమైన తెలుగు ప్రయోగం; వాక్యంలోని ధార్మిక ఉద్వేగాన్ని ముందుగానే పరిష్కరించదు.
- source_word: ἐδικαιώθη
  choice: నీతిమంతుడిగా తీర్చబడలేదా
  rationale: δικαιόω పదంలోని న్యాయపరమైన భావాన్నీ, యాకోబు వాదనలోని ధార్మిక ఉద్వేగాన్నీ నిలుపుతుంది. ప్రదర్శనాత్మక లేదా నిరూపణాత్మక భావాలను ప్రధాన పాఠ్యంలో ఖరారు చేయకుండా పాదసూచికలో ఇస్తుంది.
- source_word: ἀνενέγκας
  choice: అర్పించినప్పుడు
  rationale: అయోరిస్టు కృదంతానికి సందర్భానుసారమైన కాలార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; బలి అర్పణ భావం కూడా నిలుస్తుంది.
- source_word: θυσιαστήριον
  choice: బలిపీఠం
  rationale: బలి అర్పించే పీఠాన్ని సూచించే స్పష్టమైన, ప్రామాణిక తెలుగు పదం.
- source_word: οὐκ ... ἐδικαιώθη;
  choice: నీతిమంతుడిగా తీర్చబడలేదా?
  rationale: అవుననే సమాధానాన్ని ఆశించే గ్రీకు అలంకారప్రశ్న స్వరాన్ని సహజమైన తెలుగు ప్రశ్నారూపంలో నిలుపుతుంది.
theological_decisions:
- issue: యాకోబు 2:21లో క్రియలకు సంబంధించి δικαιόω అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘నీతిమంతుడిగా తీర్చబడడం’ అని అనువదించడం
  alternative: ‘నీతిమంతుడని చూపబడడం’ లేదా ‘నీతిమంతుడని రుజువవడం’
  rationale: ఈ వచనం విశ్వాసం, క్రియలు, నీతిమంతునిగా తీర్చబడడం గురించిన ధార్మిక చర్చలో భాగం. ప్రధాన పాఠ్యం ఒకే వివరణను బలవంతంగా ఖరారు చేయకుండా మూలంలోని న్యాయపరమైన పదసంబంధాన్నీ ఉద్వేగాన్నీ నిలుపుతుంది; ఇతర సాధ్యమైన భావాలు పాదసూచికలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. ‘మన తండ్రి,’ ‘క్రియలు,’ ‘నీతిమంతుడిగా తీర్చబడడం’ అనే పదబంధాలు మూలంలోని సంబంధాత్మకతను మరియు ధార్మిక పదసంబంధాన్ని కాపాడుతాయి.
