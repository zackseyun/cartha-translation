id: JAS.2.22
reference: James 2:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βλέπεις ὅτι ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ καὶ ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: te
  text: విశ్వాసం అతని క్రియలతో కలిసి పనిచేస్తూ ఉండిందనీ, ఆ క్రియల ద్వారా విశ్వాసం పరిపూర్ణతకు తీసుకురాబడిందనీ[a] నీవు చూస్తున్నావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రియల ద్వారా విశ్వాసం సంపూర్ణం చేయబడింది.” గ్రీకు క్రియాపదం ఉద్దేశిత ముగింపు లేదా పరిపక్వతకు చేరడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: నీవు చూస్తున్నావు
  rationale: వర్తమానకాల, ద్వితీయ పురుష ఏకవచన ప్రత్యక్ష సంబోధనను నిలుపుతూ యాకోబు వాదనాత్మక శైలిని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో అబ్రాహాము నమ్మకాన్ని సూచించే సాధారణమైన, స్థిరమైన పదం; ‘నమ్మకం’ లేదా ‘విశ్వసనీయత’ అనే సాధ్యమైన ఛాయలను అనవసరంగా ప్రధాన పాఠ్యంలో నిర్ధారించదు.
- source_word: συνήργει
  choice: కలిసి పనిచేస్తూ ఉండింది
  rationale: సహకార భావాన్ని, అలాగే భూతకాలంలో కొనసాగుతున్న చర్యను సూచించే అసంపూర్ణ కాల రూపాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: అతని క్రియలతో
  rationale: సహకారాన్ని సూచించే దత్తివును ‘తో’ ద్వారా సహజంగా వ్యక్తపరుస్తుంది; ἔργα కోసం యాకోబు వాదనకు తగిన ‘క్రియలు’ అనే పదాన్ని వాడుతుంది.
- source_word: ἐκ τῶν ἔργων
  choice: ఆ క్రియల ద్వారా
  rationale: ἐκ ఇక్కడ మూలం/సాధనం అనే భావాన్ని కలిగిస్తుంది; ‘ద్వారా’ అనేది క్రియలు విశ్వాసం పరిపూర్ణతకు చేరడంలో సాధనమయ్యాయని సహజంగా తెలియజేస్తుంది.
- source_word: ἐτελειώθη
  choice: పరిపూర్ణతకు తీసుకురాబడింది
  rationale: ఆరిస్టు కర్మణి రూపాన్ని నిలుపుతూ, ఉద్దేశిత ముగింపు లేదా సంపూర్ణతకు చేరడం అనే τελειόω భావాన్ని వ్యక్తపరుస్తుంది; ముందుగా విశ్వాసంలో నైతిక లోపముందని అనవసరంగా సూచించదు.
theological_decisions:
- issue: విశ్వాసం మరియు క్రియల మధ్య సంబంధం
  choice: విశ్వాసం క్రియలతో కలిసి పనిచేసిందని, క్రియల ద్వారా పరిపూర్ణతకు తీసుకురాబడిందని మూలపాఠ్యంలోని సంబంధాన్ని యథాతథంగా ఉంచడం
  alternative: క్రియలు కేవలం మనుషుల ఎదుట విశ్వాసాన్ని చూపించాయి; లేదా క్రియలు విశ్వాసానికి అవసరమైన వ్యక్తీకరణగా దానితో సహకరించాయి
  rationale: గ్రీకు పాఠ్యం సహకారాన్నీ పరిపూర్ణతకు చేరడాన్నీ చెబుతుంది గాని, నీతిమంతులుగా తీర్చబడటం గురించి సంపూర్ణ సిద్ధాంత వివరణ ఇవ్వదు. అందువల్ల ఏ మతశాఖ వ్యాఖ్యానాన్నీ అనువాదంలో చేర్చలేదు.
- issue: πίστις యొక్క భావం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: యాకోబు 2లోని వాదనకు ‘విశ్వాసం’ సహజంగా సరిపోతుంది; ఇతర సాధ్యమైన భావఛాయలను ప్రధాన పాఠ్యం బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి. ‘క్రియలు’ అనే పదం ἔργα యొక్క వాదనాత్మక, ధార్మిక సందర్భాన్ని నిలుపుతుంది. వాక్య నిర్మాణం విశ్వాసం–క్రియలు అనే రెండు అంశాల పరస్పర సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
