  source_fidelity: 'The conditional construction, explicit brother/sister pair, inadequate-clothing sense of γυμνοί, and daily-food sense are retained. However, ‘రోజువారీ ఆహారం కొరవడినవారై’ is not a sound Telugu rendering of λειπόμενοι τῆς ἐφημέρου τροφῆς: it can imply that the food itself is deficient rather than that the person lacks it.'
