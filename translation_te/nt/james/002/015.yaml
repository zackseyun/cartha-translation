  terminology: ‘సహోదరుడు గానీ సహోదరి గానీ’ appropriately preserves the source’s explicit familial masculine/feminine pair without narrowing or expanding its referent. The footnote responsibly retains the literal lexical alternative for γυμνοί.
  issues:
  - severity: medium
    issue: ‘రోజువారీ ఆహారం కొరవడినవారై’ has an unclear and non-idiomatic dependency.
    rationale: The Greek participle λειπόμενοι describes the brother or sister as lacking daily food. Telugu ‘ఆహారం కొరవడినవారై’ is awkward and may be read as ‘persons whose food is deficient,’ rather than ‘persons without food.’
