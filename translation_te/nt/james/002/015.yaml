id: JAS.2.15
reference: James 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἐὰν ἀδελφὸς ἢ ἀδελφὴ γυμνοὶ ὑπάρχωσιν καὶ ⸀λειπόμενοι τῆς ἐφημέρου τροφῆς,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/015.yaml
  text: If a brother or sister is poorly clothed and lacking daily food,[a]
translation:
  language: te
  text: ఒక సహోదరుడు గానీ సహోదరి గానీ తగినంత బట్టలు లేక[a], రోజువారీ ఆహారం లేక ఉంటే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బట్టలు లేక”; గ్రీకు పదానికి అక్షరార్థంగా “నగ్నంగా” అని కూడా అర్థం రావచ్చు, అయితే ఇక్కడ తగినంత బట్టలు లేకపోవడాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν
  choice: ఉంటే
  rationale: ఇది ఊహాత్మక షరతును పరిచయం చేస్తుంది. తెలుగు వాక్య నిర్మాణంలో చివర ఉంచిన ‘ఉంటే’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: ἀδελφὸς ἢ ἀδελφή
  choice: ఒక సహోదరుడు గానీ సహోదరి గానీ
  rationale: గ్రీకులోని పుంలింగ, స్త్రీలింగ పదజంటను స్పష్టంగా ఉంచుతూ, రెండింటిలో ఎవరైనా అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: γυμνοὶ
  choice: సరిపడా బట్టలు లేక
  rationale: ఈ సందర్భంలో ఈ పదం పూర్తిగా నగ్నంగా ఉండడంకన్నా తగినంత వస్త్రాలు లేకపోవడాన్ని సూచించే అవకాశం ఎక్కువ. ఎంపిక చేసిన రూపం దారిద్ర్యపు సందర్భాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὑπάρχωσιν
  choice: ఉంటే
  rationale: ఇక్కడ ఇది స్థితిని తెలిపే అనుసంధాన క్రియగా పనిచేస్తుంది. తెలుగులో షరతార్థక ‘ఉంటే’ ఆ క్రియాభావాన్నీ ἐὰν యొక్క షరతునూ సహజంగా మోస్తుంది.
- source_word: λειπόμενοι
  choice: కొరవడినవారై
  rationale: అవసరమైనది నిరంతరం లోపిస్తున్న స్థితిని తెలియజేస్తుంది. ‘కొరవడినవారై’ ఆ ongoing deficiency భావాన్ని నిలుపుతుంది.
- source_word: τῆς ἐφημέρου τροφῆς
  choice: రోజువారీ ఆహారం
  rationale: ἐφήμερος రోజుకు కావలసినది లేదా రోజువారీదని, τροφή ఆహారం లేదా పోషణని సూచిస్తాయి. ‘రోజువారీ ఆహారం’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది.
theological_decisions:
- issue: క్రైస్తవ సమాజంలో ἀδελφὸς ἢ ἀδελφή యొక్క పరిధి
  choice: ‘సహోదరుడు గానీ సహోదరి గానీ’ అనే కుటుంబ సంబంధ భాషను యథాతథంగా నిలుపడం
  alternative: సాధారణంగా అవసరంలో ఉన్న ఏ తోటి మానవుడినైనా సూచించేలా విస్తరించడం
  rationale: సందర్భంలో యాకోబు వాడే సహోదర భాష విశ్వాస సమాజ సభ్యులను సూచించే అవకాశం ఉంది. అయితే అనువాదం పరిధిని మరింత కుదించకుండా లేదా విస్తరించకుండా మూలంలోని పదప్రయోగాన్నే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణం. ఇది 16వ వచనంలో కొనసాగుతున్న షరతు వాక్యం కాబట్టి చివర అల్పవిరామం ఉంచబడింది.
