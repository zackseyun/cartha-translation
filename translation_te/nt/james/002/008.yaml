id: JAS.2.8
reference: James 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: te
  text: అయితే, లేఖనం ప్రకారం, “నిన్ను నీవు ప్రేమించుకున్నట్లే నీ పొరుగువానిని ప్రేమించాలి” అనే రాజసంబంధమైన ధర్మశాస్త్రాన్ని[a] మీరు నెరవేర్చుతున్నట్లయితే, మీరు బాగా చేస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “రాజసంబంధమైన ధర్మశాస్త్రం” అనే గ్రీకు పదబంధాన్ని “రాజోచిత ధర్మశాస్త్రం” లేదా “రాజ్య ధర్మశాస్త్రం” అని కూడా అర్థం చేసుకోవచ్చు. ఇది రాజు నుండి వచ్చినదనే భావాన్ని లేదా దాని అత్యున్నత స్థానాన్ని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: అయితే ... నెరవేర్చుతున్నట్లయితే
  rationale: εἰ యొక్క షరతును ‘-ట్లయితే’ తెలియజేస్తుంది; μέντοι లోని స్వల్ప వ్యత్యాస/కొనసాగింపు భావాన్ని ‘అయితే’ సహజంగా అందిస్తుంది.
- source_word: νόμον ... βασιλικὸν
  choice: రాజసంబంధమైన ధర్మశాస్త్రం
  rationale: βασιλικός అంటే రాజుకు సంబంధించినది లేదా రాజోచితమైనది. మూలం, ప్రాధాన్యం, రాజ్యసంబంధం అనే సాధ్యార్థాల్లో ఒక్కదానికే పరిమితం చేయకుండా ఈ రూపం విస్తృతిని నిలుపుతుంది.
- source_word: τελεῖτε
  choice: నెరవేర్చుతున్నారు
  rationale: τελέω ఇక్కడ ఆజ్ఞను కార్యరూపంలో పూర్తిగా అమలు చేయడం/నెరవేర్చడం అనే భావాన్ని ఇస్తుంది; వర్తమాన కాల భావమూ నిలుస్తుంది.
- source_word: κατὰ τὴν γραφήν
  choice: లేఖనం ప్రకారం
  rationale: ఏకవచనంలోని γραφή ను ‘లేఖనం’గా ఉంచి, దానితో అనుగుణతను ‘ప్రకారం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἀγαπήσεις
  choice: ప్రేమించాలి
  rationale: భవిష్యత్ రూపంలో ఉన్న ఆజ్ఞాత్మక బలాన్ని ఆధునిక తెలుగులో సహజమైన ‘ప్రేమించాలి’ తెలియజేస్తుంది.
- source_word: τὸν πλησίον σου
  choice: నీ పొరుగువానిని
  rationale: నైతిక అర్థంలోని πλησίον కు స్థిరమైన బైబిలు తెలుగు పదబంధం; సమీపంలో నివసించేవారికే పరిమితమని అనవసరంగా వివరించదు.
- source_word: ὡς σεαυτόν
  choice: నిన్ను నీవు ప్రేమించుకున్నట్లే
  rationale: తెలుగులో పోలికను స్పష్టంగా, సహజంగా వ్యక్తపరచడానికి అంతర్లీన క్రియను పునరుక్తి చేస్తుంది; మూలంలోని భావాన్ని మార్చదు.
- source_word: καλῶς ποιεῖτε
  choice: మీరు మంచిగానే చేస్తున్నారు
  rationale: సరైన పని చేస్తున్నారనే ప్రశంసను, వర్తమాన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘రాజసంబంధమైన ధర్మశాస్త్రం’ యొక్క భావం
  choice: రాజుకు సంబంధించినదిగా లేదా రాజోచితమైనదిగా వర్ణించబడిన ధర్మశాస్త్రం; దాని మూలం లేదా అత్యున్నత స్థానం ఏది ఉద్దేశమో ప్రధాన పాఠ్యం తేల్చదు.
  alternative: ‘రాజు ఇచ్చిన ధర్మశాస్త్రం,’ ‘అత్యున్నత ధర్మశాస్త్రం,’ లేదా ‘రాజ్య ధర్మశాస్త్రం.’
  rationale: βασιλικός అనే విశేషణం రాజసంబంధ మూలాన్ని గానీ, శ్రేష్ఠ స్థానాన్ని గానీ, రాజ్య అనుబంధాన్ని గానీ సూచించవచ్చు. అనువాదం ఈ నిజమైన భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బహువచన సంబోధనను కొనసాగిస్తూ, లేవీయకాండము 19:18 ఉద్ధరణకు స్పష్టమైన ఆజ్ఞాత్మక స్వరాన్ని ఇచ్చింది. గమనిక గుర్తు సంబంధిత అస్పష్ట పదబంధం తరువాత ఉంచబడింది.
