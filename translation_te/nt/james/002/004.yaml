  text: ⸀οὐ διεκρίθητε ἐν ἑαυτοῖς καὶ ἐγένεσθε κριταὶ διαλογισμῶν πονηρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/004.yaml
  text: have you not made distinctions among yourselves and become judges with evil thoughts?[a][b]
translation:
  language: te
  text: మీరు మీ మధ్య భేదాలు చూపించి, చెడు ఆలోచనలతో తీర్పు చెప్పేవారిగా మారలేదా?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు మీ మధ్య వివక్ష చూపించి.” ఈ క్రియకు “విభజించబడడం,” మరికొన్ని సందర్భాల్లో “సందేహించడం” అనే అర్థాలు కూడా ఉండవచ్చు; అయితే ఇక్కడి సందర్భం వివక్షాపూర్వక భేదాలు చేయడం అనే అర్థానికే అనుకూలంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “చెడు ఆలోచనల/తర్కాల తీర్పు చెప్పేవారుగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: భేదాలు చూపించి
  rationale: సభలో ధనవంతునికి, పేదవానికి వేర్వేరు రీతుల్లో ప్రవర్తించిన 2:1–3 సందర్భంలో, ఈ క్రియ సామాజిక వివక్షతో కూడిన భేదాలు చేయడాన్ని సూచిస్తుంది. ‘సందేహించారు’ అనే అర్థం ఇక్కడ సందర్భానికి సరిపోదు.
- source_word: ἐν ἑαυτοῖς
  choice: మీ మధ్య
  rationale: సమాజంలోని పరస్పర ప్రవర్తనే సందర్భం కాబట్టి, అంతరంగ అర్థమైన ‘మీలోపల’ కంటే సామూహిక అర్థమైన ‘మీ మధ్య’ సహజంగా ఉంది.
- source_word: ἐγένεσθε
  choice: మారలేదా
  rationale: ముందు చేసిన భేదాల ఫలితంగా వారు ఒక విధమైన తీర్పరులయ్యారని γίνομαι తెలియజేస్తుంది.
- source_word: κριταὶ
  choice: తీర్పు చెప్పేవారిగా
  rationale: తెలుగులో ‘న్యాయాధిపతులు’ అధికారిక పదవిని సూచించే అవకాశం ఉంది; ఇక్కడ ఇతరులను అన్యాయంగా అంచనా వేసే చర్యను ‘తీర్పు చెప్పేవారు’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: διαλογισμῶν πονηρῶν
  choice: చెడు ఆలోచనలతో
  rationale: మూలంలోని షష్ఠీ విభక్తి నిర్మాణం ‘చెడు ఆలోచనలు/తర్కాల తీర్పరులు’ అని అక్షరార్థంగా రావచ్చు. ప్రధాన పాఠంలో సహజమైన తెలుగు కోసం, వారి తీర్పును చెడు ఆలోచనలు లక్షణీకరిస్తున్నాయని తెలిపే సాధనార్థక రూపం వాడబడింది.
- source_word: οὐ
  choice: మారలేదా?
  rationale: οὐతో మొదలయ్యే ప్రశ్న సమ్మతికర జవాబును ఆశించే గద్దింపు ప్రశ్న. తెలుగులో నిషేధార్థక ప్రశ్నారూపం ఆ బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పక్షపాత సందర్భంలో διακρίνω అర్థం
  choice: విశ్వాసుల సమాజంలో వివక్షాపూర్వక భేదాలు చూపడాన్ని ఈ వాక్యం గద్దిస్తుంది.
  alternative: అంతరంగంలో విభజించబడడం లేదా సందేహించడం
  rationale: యాకోబు 2:1–3లో ధనవంతునికి ప్రాధాన్యం ఇచ్చి పేదవాణ్ణి తక్కువగా చూడడమే తక్షణ సందర్భం. కాబట్టి ‘సందేహించడం’ కంటే వివక్షతో భేదాలు చూపడం అనే అర్థమే సందర్భానికి తగినది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని గద్దింపు ప్రశ్నను నిలిపి, ప్రధాన పాఠాన్ని సహజంగా ఉంచుతూ మూలంలోని సందిగ్ధమైన షష్ఠీ విభక్తి నిర్మాణాన్ని పాదటిప్పణిలో సంరక్షించాం.
