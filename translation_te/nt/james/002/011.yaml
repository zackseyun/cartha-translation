id: JAS.2.11
reference: James 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: te
  text: ఎందుకంటే, “వ్యభిచారం చేయవద్దు” అని చెప్పినవాడే, “హత్య చేయవద్దు” అని కూడా చెప్పాడు. నీవు వ్యభిచారం చేయకపోయినా హత్య చేస్తే, ధర్మశాస్త్రాన్ని అతిక్రమించినవాడివయ్యావు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: చెప్పినవాడే
  rationale: ఆర్టికల్‌తో ఉన్న కృదంతం వ్యక్తిని సూచిస్తోంది. దేవుడే వక్త అని సందర్భం తెలియజేసినా, మూలంలో లేని ‘దేవుడు’ అనే పదాన్ని చేర్చకుండా వ్యక్తిగత సూచనను నిలుపుతుంది; ‘-ఏ’ అదే వక్త రెండు ఆజ్ఞలు చెప్పాడనే బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Μὴ μοιχεύσῃς
  choice: వ్యభిచారం చేయవద్దు
  rationale: μή తో కూడిన aorist subjunctive నిషేధాజ్ఞను వ్యక్తపరుస్తుంది. ఈ తెలుగు రూపం ఆజ్ఞ యొక్క స్పష్టతను, గంభీరతను సహజంగా నిలుపుతుంది.
- source_word: καί
  choice: కూడా
  rationale: అదే వక్త మరొక ఆజ్ఞను కూడా ఇచ్చాడనే యాకోబు వాదనను స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: Μὴ φονεύσῃς
  choice: హత్య చేయవద్దు
  rationale: φονεύω సాధారణంగా చంపడమంతటినీ కాక అన్యాయమైన మానవహత్యను సూచిస్తుంది; ‘హత్య’ దాని నైతిక-న్యాయ భావాన్ని కాపాడుతుంది.
- source_word: εἰ δὲ
  choice: '...చేయకపోయినా ... చేస్తే'
  rationale: ఊహాత్మక అన్వయాన్నీ, రెండు క్రియల మధ్య వ్యత్యాసాన్నీ సహజ తెలుగు షరతు నిర్మాణంలో తెలియజేస్తుంది.
- source_word: οὐ μοιχεύεις ... φονεύεις δέ
  choice: వ్యభిచారం చేయకపోయినా హత్య చేస్తే
  rationale: వర్తమాన సూచక క్రియలను సాధారణ ఉదాహరణగా తెలుగులో సహజంగా వ్యక్తపరుస్తూ, δέ సూచించే వ్యత్యాసాన్ని ‘చేయకపోయినా’ ద్వారా నిలుపుతుంది.
- source_word: γέγονας
  choice: అతిక్రమించినవాడివయ్యావు
  rationale: γίνομαι యొక్క perfect రూపం ఒక చర్య వలన ఏర్పడి కొనసాగుతున్న స్థితిని సూచిస్తుంది. ‘అయ్యావు’ ఆ ఫలితస్థితిని సాధారణ ‘ఉన్నావు’ కంటే మెరుగ్గా కాపాడుతుంది.
- source_word: παραβάτης νόμου
  choice: ధర్మశాస్త్రాన్ని అతిక్రమించినవాడు
  rationale: παραβάτης నిర్ణయించిన హద్దు లేదా ఆజ్ఞను ఉల్లంఘించిన వ్యక్తిని సూచిస్తుంది. ఈ రూపం న్యాయ-నైతిక ధ్వనిని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: νόμου
  choice: ధర్మశాస్త్రం
  rationale: ఇప్పుడే ఉదహరించిన దైవిక ఆజ్ఞలను కలిగిన గుర్తించదగిన ధర్మశాస్త్రాన్ని సూచిస్తుంది; బైబిలు సందర్భంలో ‘ధర్మశాస్త్రం’ స్పష్టమైన, స్థిరమైన పదం.
theological_decisions:
- issue: ఆజ్ఞలు చెప్పిన వక్త యొక్క గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘చెప్పినవాడే’ అని ఉంచడం
  alternative: ‘దేవుడు ... చెప్పాడు’ అని స్పష్టీకరించడం
  rationale: సందర్భంలో వక్త దేవుడని స్పష్టమైనా, గ్రీకు పాఠ్యం నేరుగా ‘దేవుడు’ అని చెప్పకుండా substantival participle వాడుతుంది. అనువాదం ఆ రూపాన్ని, దానిలోని సూచనను విస్తరించకుండా నిలుపుతుంది.
- issue: ధర్మశాస్త్ర అతిక్రమణ యొక్క పరిధి
  choice: ‘ధర్మశాస్త్రాన్ని అతిక్రమించినవాడివయ్యావు’ అని అనువదించడం
  alternative: ‘ఆ ఆజ్ఞను అతిక్రమించినవాడివయ్యావు’
  rationale: గ్రీకు νόμου మొత్తం ధర్మశాస్త్రాన్ని సూచిస్తుంది; ఒక్క ఆజ్ఞ ఉల్లంఘనతో వ్యక్తి ధర్మశాస్త్ర అతిక్రమణదారుడవుతాడనే వాదనను సంకుచితం చేయకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం. ఆజ్ఞలకు ‘చేయవద్దు’ను, న్యాయ-నైతిక సందర్భానికి ‘ధర్మశాస్త్రం’ మరియు ‘అతిక్రమించినవాడు’ను ఉపయోగించాం. పాదసూచనలు అవసరం లేదు; అందువల్ల ప్రధాన పాఠ్యంలో సూచికలు లేవు.
