id: JAS.2.25
reference: James 2:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: te
  text: అదేవిధంగా, వేశ్య రాహాబు కూడా దూతలను[b] ఆహ్వానించి, వారిని వేరొక మార్గం గుండా పంపివేసి, క్రియల వల్ల నీతిమంతురాలిగా తీర్చబడలేదా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీతిమంతురాలని చూపబడలేదా?’ లేదా ‘నీతిమంతురాలని ప్రకటించబడలేదా?’ గ్రీకు పదం ‘నీతిమంతురాలిగా తీర్చబడింది’ అనే భావాన్ని ఇస్తుంది. ఇక్కడ దాని సూక్ష్మార్థంపై ఉన్న వేదాంతపరమైన చర్చను తేల్చకుండా ప్రధాన పాఠ్యంలో ఆ పదబంధాన్నే నిలిపాం.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదానికి ‘దూతలు’ అని అర్థం. ఈ సందర్భంలో ఇది రాహాబు ఆహ్వానించిన మనుష్యులను సూచిస్తుంది (యెహోషువ 2), దేవదూతలను కాదు.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: అదేవిధంగా ... కూడా
  rationale: ఇది ముందున్న అబ్రాహాము ఉదాహరణతో పోలికను చూపిస్తూ, రాహాబును మరో ఉదాహరణగా చేర్చుతుంది. ‘అదేవిధంగా ... కూడా’ అనేది ఆ రెండు భావాలను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Ῥαὰβ
  choice: రాహాబు
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన వ్యక్తినామ రూపాన్ని ఉపయోగించాం.
- source_word: ἡ πόρνη
  choice: వేశ్యయైన
  rationale: πόρνη అనే పదం వేశ్యను స్పష్టంగా సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘వేశ్య’ నేరుగా, గౌరవప్రదమైన అనువాద శైలిలో మూలపదపు సామాజిక భావాన్ని నిలుపుతుంది.
- source_word: οὐκ ... ἐδικαιώθη
  choice: నీతిమంతురాలిగా తీర్చబడలేదా?
  rationale: δικαιόω యొక్క కర్మణి రూపాన్ని సంప్రదాయపరంగా, సందర్భానుకూలంగా ‘నీతిమంతురాలిగా తీర్చబడింది’ అని ఇచ్చాం. ఇది ‘నీతిమంతురాలని చూపబడింది’ లేదా ‘ప్రకటించబడింది’ అనే ఒకే వ్యాఖ్యానానికి వాక్యాన్ని పరిమితం చేయదు.
- source_word: ἐξ ἔργων
  choice: క్రియల వల్ల
  rationale: ἐκ + షష్ఠీ విభక్తి ఇక్కడ ఆధారం లేదా కారణాన్ని సూచిస్తుంది. ‘క్రియల వల్ల’ సంక్షిప్తంగా ఉండి యాకోబు 2లోని వాదనతో పదసంబంధాన్ని నిలుపుతుంది.
- source_word: ὑποδεξαμένη
  choice: స్వాగతించి
  rationale: ఈ అసమాపక క్రియ ఆ దూతలను ఆతిథ్యంతో చేర్చుకున్న భావాన్ని తెలియజేస్తుంది; ‘స్వాగతించి’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: τοὺς ἀγγέλους
  choice: దూతలను
  rationale: ἄγγελος అంటే ‘దూత’ లేదా సందర్భానుసారం ‘దేవదూత’ కావచ్చు. ఇక్కడ యెహోషువ 2లో రాహాబు చేర్చుకున్న మనుష్యులను సూచిస్తున్నందున, మూలంలోని సాధారణ అర్థాన్ని నిలుపుతూ ‘దూతలను’ వాడి, పాదసూచికలో సందర్భాన్ని స్పష్టం చేశాం.
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: వారిని మరో మార్గంలో పంపివేసినప్పుడు
  rationale: ἐκβάλλω ఇక్కడ బలవంతంగా వెళ్లగొట్టడం కాక పంపివేయడాన్ని సూచిస్తుంది; ἑτέρᾳ ὁδῷ అంటే ‘మరో మార్గంలో.’ అసమాపక క్రియకు ప్రధాన క్రియతో ఉన్న సందర్భ సంబంధాన్ని తెలుగులో ‘పంపివేసినప్పుడు’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యాకోబు 2:25లో విశ్వాసం, క్రియలకు సంబంధించి δικαιόω యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘నీతిమంతురాలిగా తీర్చబడింది’ అని ఉంచి, అది ప్రారంభ న్యాయస్థానపరమైన నీతితీర్పా లేక తరువాతి నీతి నిరూపణా అని సంకుచితం చేయలేదు.
  alternative: ‘నీతిమంతురాలని చూపబడింది’ లేదా ‘నీతిమంతురాలని ప్రకటించబడింది.’
  rationale: యాకోబు క్రియలతో ముడిపెట్టి నీతిమంతులుగా తీర్చబడటాన్ని చెప్పడం వల్ల కలిగే వేదాంతపరమైన ఉద్రిక్తతను అనువాదం స్వయంగా పరిష్కరించకూడదు. ప్రధాన పదబంధం మూలపదంతోను పరిసర వాదనతోను సంబంధాన్ని నిలుపుతుంది; పాదసూచిక భావసాధ్యతలను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే వేదాంతపరమైన కీలక పదాలకు తగిన గంభీరతను నిలిపాం. ప్రశ్నార్థక నిర్మాణాన్ని మూలపాఠ్యానుసారం ఉంచాం.
