id: JAS.2.20
reference: James 2:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι ἡ πίστις χωρὶς τῶν ἔργων ⸀ἀργή ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: te
  text: అయితే, ఓ బుద్ధిహీనుడా[a], క్రియలు లేని విశ్వాసం నిష్ఫలమైనదని[b] తెలుసుకోవాలనుకుంటున్నావా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలోని గ్రీకు పదబంధం అక్షరార్థంగా ‘ఓ ఖాళీ మనిషీ’ అని ఉంటుంది; ‘ఓ అవివేకీ’ లేదా ‘ఓ వ్యర్థుడా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘క్రియారహితమైనదని’ లేదా ‘ప్రభావం లేనిదని.’ గ్రీకు పదం పనిచేయనిది లేదా ఫలించనిది అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: అయితే … తెలుసుకోవాలనుకుంటున్నావా?
  rationale: θέλω + infinitive లోని కోరుకోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; δέ ఇక్కడ సందర్భాన్ని ముందుకు తీసుకెళ్లే స్వల్ప ప్రతివాద భావంతో ‘అయితే’గా అనువదించబడింది.
- source_word: ὦ ἄνθρωπε κενέ
  choice: ఓ బుద్ధిహీనుడా
  rationale: κενός అక్షరార్థంగా ‘ఖాళీ’ అయినా, వ్యక్తిని ఉద్దేశించిన ఈ ప్రయోగంలో వివేకం లేదా సారవంతమైన ఆలోచన లేనివాడనే భావం ఉంది. ‘ఓ ఖాళీ మనిషీ’ తెలుగు వాడుకలో అసహజంగా ఉండటంతో భావాన్ని స్పష్టంగా తెలిపే ‘బుద్ధిహీనుడా’ ఎంచుకోబడింది; ఏకవచన పుంలింగ సంబోధన నిలుపబడింది.
- source_word: ὅτι
  choice: అని
  rationale: తెలుసుకోవలసిన విషయాన్ని పరిచయం చేసే content clause‌ను తెలుగులో సహజంగా ‘అని’ సూచిస్తుంది.
- source_word: ἡ πίστις
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో πίστις‌కు స్థిరమైన, తక్కువ వ్యాఖ్యానభారం గల తెలుగు పదం ‘విశ్వాసం’.
- source_word: χωρὶς τῶν ἔργων
  choice: క్రియలు లేని
  rationale: χωρίς + genitive సూచించే ‘లేకుండా/వేరుగా’ అనే భావాన్ని సంక్షిప్తంగా తెలుపుతుంది; ἔργαకు ఈ వాదనలో సుపరిచితమైన ‘క్రియలు’ వాడబడింది.
- source_word: ἀργή ἐστιν
  choice: నిష్ఫలమైనది
  rationale: ἀργός ఇక్కడ క్రియారహితంగా, ఫలితం కలిగించకుండా ఉండటాన్ని సూచిస్తుంది. ‘నిష్ఫలమైనది’ ఆ ఆచరణాత్మక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయ అర్థాలను పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: యాకోబు వాదనలో విశ్వాసం–క్రియల సంబంధం
  choice: క్రియలు లేని విశ్వాసాన్ని ‘నిష్ఫలమైనది’గా నేరుగా వర్ణించడం
  alternative: దీనిని బలహీనంగా ‘క్రియారహితమైనది’గా లేదా సమీప వచనాలతో సమన్వయపరుస్తూ బలంగా ‘మృతమైనది’గా అనువదించడం
  rationale: ఈ వచనంలో ἀργή ఉంది, νεκρά లేదు. కాబట్టి సమీప వచనంలోని ‘మృతమైనది’ అనే భాషను ఇక్కడికి దిగుమతి చేయకుండా, అలాగే ఏ సిద్ధాంతపరమైన వివరణనూ జోడించకుండా మూలవచనంలోని ప్రత్యేకమైన ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ప్రశ్నారూపం వాడబడింది. ‘ఓ బుద్ధిహీనుడా’ అనే ప్రత్యక్ష సంబోధన మూలంలోని ఏకవచన పుంలింగ రూపాన్ని నిలుపుతుంది. పాదటిప్పణి సూచికలు అవి వివరిస్తున్న పదాల వెంటనే ఉంచబడ్డాయి.
