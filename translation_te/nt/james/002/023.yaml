id: JAS.2.23
reference: James 2:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: te
  text: “అబ్రాహాము దేవుణ్ణి నమ్మాడు; అది అతనికి నీతిగా లెక్కించబడింది[a]” అని చెప్పే లేఖనం నెరవేరింది. అంతేకాక, అతడు దేవుని స్నేహితుడు అని పిలువబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఖాతాలో చేర్చబడింది”; గ్రీకు క్రియను “గణించబడింది” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπληρώθη
  choice: నెరవేరింది
  rationale: లేఖన ఉల్లేఖన సందర్భంలో πληρόω కర్మణి రూపానికి సహజమైన తెలుగు సమానం; ఆ లేఖనం అబ్రాహాము విధేయతలో నెరవేరిందనే యాకోబు వాదనను నిలుపుతుంది.
- source_word: ἡ γραφή ἡ λέγουσα
  choice: అని చెప్పే లేఖనం
  rationale: γραφήను పవిత్ర లేఖనంగా సూచిస్తూ, λέγουσα అనే వర్తమాన కృదంతాన్ని సహజమైన తెలుగు ఉల్లేఖన నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: Ἐπίστευσεν ... Ἀβραὰμ τῷ θεῷ
  choice: అబ్రాహాము దేవుణ్ణి నమ్మాడు
  rationale: πιστεύωతో వచ్చిన చతుర్థీ విభక్తి దేవుడు చెప్పినదాన్ని నిజమని అంగీకరించి ఆయనను నమ్మడాన్ని సూచిస్తుంది; ‘దేవునిలో విశ్వాసముంచాడు’ అని విస్తరించకుండా మూలానికి దగ్గరగా ఉంటుంది.
- source_word: ἐλογίσθη αὐτῷ
  choice: అది అతనికి ... లెక్కించబడింది
  rationale: λογίζομαιలోని లెక్కింపు లేదా ఖాతాలో చేర్చడం అనే భావాన్ని కర్మణి రూపంలో నిలుపుతుంది. ‘అది’ దేనిని సూచిస్తుందో మూలపాఠంలాగే సందర్భానికి వదిలేస్తుంది.
- source_word: εἰς δικαιοσύνην
  choice: నీతిగా
  rationale: ఆదికాండపు ఉల్లేఖనంలోను యాకోబు వాదనలోను δικαιοσύνηకి ‘నీతి’ సరైన, స్థిరమైన తెలుగు సమానం.
- source_word: φίλος θεοῦ
  choice: దేవుని స్నేహితుడు
  rationale: సంబంధాన్ని సహజంగా తెలియజేస్తూ, జనిటివ్ నిర్మాణాన్ని అతిగా వ్యాఖ్యానించదు.
- source_word: ἐκλήθη
  choice: పిలువబడ్డాడు
  rationale: καλέω కర్మణి రూపాన్ని నేరుగా ప్రతిబింబిస్తూ, ఇది పేరు పెట్టడమా లేక గుర్తింపా అనే భావవ్యాప్తిని తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: అబ్రాహాము విశ్వాసం, క్రియలు, లేఖనం నెరవేరడం మధ్య సంబంధం
  choice: లేఖనం ‘నెరవేరింది’ అని అనువదించి, అబ్రాహాము విధేయ కార్యంలో ఆదికాండపు వాక్యం నెరవేరిందనే యాకోబు వాదనను యథాతథంగా ఉంచడం
  alternative: క్రియలతో సంబంధం లేని పూర్తిగా న్యాయస్థానపరమైన అర్థం ఇవ్వడం, లేదా విశ్వాసం స్థానంలో క్రియలే నీతికి ఆధారమని చెప్పడం
  rationale: ఈ వచనం విశ్వాసం గురించిన ఆదికాండం 15:6 ఉల్లేఖనాన్ని అబ్రాహాము ప్రదర్శించిన విధేయతతో కలుపుతుంది. అనువాదం ఆ వేదాంతపరమైన ఉద్వేగాన్ని ఏ సంప్రదాయం వైపూ పరిష్కరించకూడదు.
- issue: δικαιοσύνη పదం అర్థం
  choice: నీతి
  alternative: న్యాయం
  rationale: అబ్రాహాము విశ్వాసం నీతిగా లెక్కించబడిన సందర్భంలో ‘నీతి’ సరిపోతుంది; ‘న్యాయం’ ఈ సందర్భంలోని వ్యక్తి స్థితి భావాన్ని సరిగా వ్యక్తం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ఆదికాండపు ఉల్లేఖనానికి సహజమైన తెలుగు వాక్యనిర్మాణం ఇచ్చి, మూలంలోని ‘అది’ అనే సూచనలో ఉన్న సంక్షిప్తతను నిలుపుకున్నాం.
