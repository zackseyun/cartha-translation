id: JAS.2.3
reference: James 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: te
  text: మెరిసే వస్త్రాలు[a] ధరించినవానిని మీరు శ్రద్ధగా గమనించి, “నీవు ఇక్కడ మంచి చోట కూర్చో” అని చెప్పి, పేదవానితో, “నీవు నిలబడు; లేదా అక్కడ[b], నా పాదపీఠం కింద కూర్చో” అని చెబితే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “శోభాయమానమైన వస్త్రాలు” లేదా “వైభవమైన వస్త్రాలు.”
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రతుల్లో “లేదా అక్కడ కూర్చో” అనే మాటలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: ప్రత్యేక శ్రద్ధ చూపి
  rationale: ఈ సందర్భంలో ఇది కేవలం చూడడాన్ని కాక, ఒక వ్యక్తిని అనుకూలంగా గుర్తించి అతనిపై శ్రద్ధ పెట్టడాన్ని సూచిస్తుంది. అయితే ‘పక్షపాతం చూపి’ అని అనువదించి సందర్భంలోని తీర్పును ముందుగానే ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: φοροῦντα
  choice: ధరించినవానిపై
  rationale: వస్త్రాలు వేసుకొని ఉండడాన్ని తెలుగులో సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: మెరిసే వస్త్రాలు
  rationale: λαμπρός పదంలోని ప్రకాశవంతమైన, ఆకర్షణీయమైన రూపాన్ని నిలుపుతూ, సందర్భంలో కనిపించే వైభవాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: నీవు ఇక్కడ మంచి చోట కూర్చో
  rationale: ఆజ్ఞారూపాన్ని, ὧδε అనే ‘ఇక్కడ’ భావాన్ని, καλῶς సూచించే అనుకూలమైన కూర్చునే స్థానాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τῷ πτωχῷ
  choice: పేదవానితో
  rationale: గ్రీకు పాఠ్యంలో నిర్దిష్టమైన పురుష ఏకవచన వ్యక్తి ఉన్నందున లింగాన్ని తటస్థీకరించకుండా అనువదించబడింది.
- source_word: στῆθι
  choice: నీవు నిలబడు
  rationale: ఇది నిలబడమనే సరళమైన ఆజ్ఞ; తెలుగులో అదే బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἢ κάθου ἐκεῖ
  choice: లేదా అక్కడ కూర్చో
  rationale: పేదవానికి ఇచ్చే ప్రత్యామ్నాయ ఆజ్ఞను, ἐκεῖలోని దూరాన్ని సూచించే భావాన్ని నిలుపుతుంది.
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: నా పాదపీఠం కింద
  rationale: ὑπό + accusative యొక్క సహజమైన ‘కింద’ భావాన్ని నిలుపుతుంది. ఈ మాట అసౌకర్యకరంగా అనిపించినా, అది వ్యక్తికి కలిగించే అవమానాన్ని మృదువుచేయకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సామాజిక పక్షపాతాన్ని తెలిపే భాష
  choice: ధనవంతునికి ఇచ్చే గౌరవాన్ని, పేదవానికి కలిగించే అవమానాన్ని మాటలు మరియు కూర్చునే స్థానం ద్వారా చూపించడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘పక్షపాతం చూపి’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: ఈ వచనం పక్షపాతాన్ని సిద్ధాంతపదంతో నిర్వచించకుండా, భిన్నమైన ప్రవర్తనను ప్రత్యక్షంగా వర్ణిస్తుంది. అందువల్ల సందర్భం నుంచే దాని నైతిక, వేదాంతపరమైన అర్థం బయటపడేలా ఉంచబడింది.
- issue: πτωχῷ యొక్క లింగ సూచన
  choice: పేదవాడు
  alternative: పేద వ్యక్తి
  rationale: గ్రీకు రూపం పురుష ఏకవచనంలో ఒక నిర్దిష్ట సందర్శకుణ్ణి సూచిస్తుంది; అందువల్ల మూలంలోని లింగ సూచన నిలుపబడింది.
- issue: సంబోధనలో సామాజిక స్థాయి
  choice: ధనికునికీ పేదవానికీ ఒకే ‘నీవు’ రూపాన్ని ఉపయోగించడం
  alternative: ధనికునికి గౌరవార్థక ‘మీరు’, పేదవానికి ‘నీవు’ ఉపయోగించడం
  rationale: గ్రీకులో ఇద్దరికీ ఒకే ఏకవచన సంబోధన రూపం ఉంది. తెలుగులో వేర్వేరు గౌరవస్థాయి సర్వనామాలు వాడితే మూలంలో లేని అదనపు సామాజిక వ్యత్యాసం చేరుతుంది; కాబట్టి వ్యత్యాసాన్ని కూర్చునే స్థానం ద్వారానే చూపించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గౌరవప్రదమైన శైలి ఉపయోగించబడింది. వాక్యం తరువాతి వచనంతో కొనసాగుతున్నందున చివర కామా ఉంచబడింది. ‘నీవు’ అనే రూపం ఇద్దరికీ సమానంగా వాడి, మూలంలో లేని తెలుగు గౌరవస్థాయి వ్యత్యాసాన్ని చేర్చలేదు.
