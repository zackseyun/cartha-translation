  naturalness: The revised wording is modern standard Telugu and keeps the sentence naturally open-ended, as the Greek construction continues into the following verse. Adding a comma after 'అక్కడ' makes clear that 'there' and 'under my footstool' jointly locate the offered seat.
  terminology: '''మెరిసే వస్త్రాలు'' is a sound rendering of ἐσθῆτα τὴν λαμπράν, with viable lexical alternatives retained in the note. ''పాదపీఠం'' accurately renders ὑποπόδιον. The poor visitor remains explicitly masculine, as in the Greek.'
