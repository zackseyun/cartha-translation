review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the paired imperatives (λαλεῖτε ... ποιεῖτε), the prospective passive sense of μέλλοντες κρίνεσθαι, and διά + genitive as ‘ద్వారా’ (‘through’).
  naturalness: The sentence is clear and suitably concise in modern standard Telugu. However, ‘స్వాతంత్ర్య నియమం’ can primarily suggest a law concerning political independence; ‘స్వేచ్ఛా నియమం’ is the more natural Telugu expression for the source’s ‘law of freedom/liberty.’
  terminology: Retain ‘నియమం ద్వారా’ so that the translation does not prematurely restrict διά to a single explanatory sense such as ‘according to.’ Replace ‘స్వాతంత్ర్య’ with ‘స్వేచ్ఛా’ for the key term ἐλευθερίας.
  issues:
  - severity: medium
    issue: ‘స్వాతంత్ర్య నియమం’ is potentially misleading in contemporary Telugu.
    rationale: ‘స్వాతంత్ర్యం’ commonly denotes national or political independence, whereas ἐλευθερία here denotes freedom/liberty. ‘స్వేచ్ఛా నియమం’ preserves the compact genitival phrase and is more idiomatic in the intended register.
  revised_text: స్వేచ్ఛా నియమం ద్వారా తీర్పు పొందబోయేవారిలా మాట్లాడండి, అలాగే ప్రవర్తించండి.
