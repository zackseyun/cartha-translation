revisions:
- from: స్వాతంత్ర్య నియమం ద్వారా తీర్పు పొందబోయేవారిలా మాట్లాడండి, అలాగే ప్రవర్తించండి.
  to: స్వేచ్ఛా నియమం ద్వారా తీర్పు పొందబోయేవారిలా మాట్లాడండి, అలాగే ప్రవర్తించండి.
  rationale: A single terminology adjustment improves modern Telugu precision and naturalness without altering the Greek syntax, the passive future-judgment sense, or the deliberately broad instrumental/mediating force of διά.
