  text: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε ὡς διὰ νόμου ἐλευθερίας μέλλοντες κρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/012.yaml
  text: So speak and so act as those who are going to be judged through the law of freedom.
translation:
  language: te
  text: స్వేచ్ఛా నియమం ద్వారా తీర్పు పొందబోయేవారిలా మాట్లాడండి, అలాగే ప్రవర్తించండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε
  choice: మాట్లాడండి, అలాగే ప్రవర్తించండి
  rationale: రెండు వర్తమాన ఆజ్ఞారూపాల నిరంతర నైతిక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; పునరుక్తమైన οὕτως భావాన్ని ‘అలాగే’ ద్వారా తెలియజేస్తుంది.
- source_word: νόμου ἐλευθερίας
  choice: స్వాతంత్ర్య నియమం
  rationale: ‘law of freedom’ అనే సంబంధాన్ని వ్యాఖ్యానాత్మకంగా విప్పకుండా, యాకోబు ఉపయోగించిన భావపరమైన ఉద్రిక్తతను నిలుపుతుంది.
- source_word: διὰ νόμου
  choice: నియమం ద్వారా
  rationale: διά + genitive యొక్క సాధన/మాధ్యమ భావాన్ని ‘ద్వారా’ నేరుగా ప్రతిబింబిస్తుంది; దానిని కేవలం తీర్పు ప్రమాణంగా ముందుగానే నిర్ణయించదు.
- source_word: μέλλοντες κρίνεσθαι
  choice: తీర్పు పొందబోయేవారిలా
  rationale: μέλλω యొక్క భావి నిరీక్షణను, κρίνεσθαι యొక్క కర్మణి రూపాన్ని కాపాడుతుంది.
theological_decisions:
- issue: స్వాతంత్ర్య నియమానికి తీర్పుతో ఉన్న సంబంధం
  choice: ‘ద్వారా’ అని అనువదించడం
  alternative: ‘చేత’ లేదా ‘ప్రకారం’
  rationale: గ్రీకు διά + షష్ఠీ విభక్తి మాధ్యమం/సాధనం అనే విస్తృత భావాన్ని ఇస్తుంది. ‘ప్రకారం’ అని అనువదిస్తే అది తీర్పు ప్రమాణమనే ఒకే వివరణకు భావాన్ని కుదించే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన ఆజ్ఞా శైలి. ‘ప్రవర్తించండి’ సాధారణ పాఠకులకు సహజంగా ఉండి ποιεῖτε యొక్క కార్యాచరణ భావాన్ని సందర్భానుగుణంగా అందిస్తుంది.
