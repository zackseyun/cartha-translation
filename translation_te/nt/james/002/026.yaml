id: JAS.2.26
reference: James 2:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: te
  text: ఎందుకంటే, ప్రాణం[a] లేని శరీరం ఎలాగైతే మృతమై ఉందో, అలాగే కార్యాలు లేని విశ్వాసం[b] కూడా మృతమై ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఊపిరి.’ గ్రీకు పదానికి ‘ప్రాణం,’ ‘ఆత్మ,’ లేదా ‘ఊపిరి’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నమ్మకత్వం.’ గ్రీకు పదం ‘నమ్మకం’ లేదా ‘నమ్మకత్వం’ అనే భావాలను కూడా సూచించవచ్చు; ఇక్కడ ప్రధాన పాఠంలో ‘విశ్వాసం’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ఎందుకంటే, ... ఎలాగైతే
  rationale: γάρ ముందున్న వాదనకు వివరణను కలుపుతుంది; ὥσπερ పోలికలోని మొదటి భాగాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: τὸ σῶμα
  choice: శరీరం
  rationale: భౌతిక దేహాన్ని సూచించే సహజమైన, ప్రత్యక్ష సమానార్థకం.
- source_word: χωρὶς πνεύματος
  choice: ప్రాణం లేని
  rationale: ఈ సందర్భంలో πνεῦμα శరీరాన్ని సజీవంగా ఉంచే ప్రాణాన్ని సూచించగలదు. సహజమైన తెలుగులో పోలికను స్పష్టంగా ఉంచుతూ, 'ఊపిరి' అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- source_word: νεκρόν ἐστιν
  choice: మృతమై ఉందో
  rationale: మూలంలోని బలమైన స్థితివాచక భావాన్ని నిలుపుతుంది; పోలికకు తగిన తెలుగు వాక్యనిర్మాణం కోసం 'ఎలాగైతే ... ఉందో' రూపం వాడబడింది.
- source_word: οὕτως καὶ
  choice: అలాగే ... కూడా
  rationale: పోలికలోని రెండవ, అనురూప భాగాన్ని సహజంగా మరియు స్పష్టంగా సూచిస్తుంది.
- source_word: ἡ πίστις
  choice: విశ్వాసం
  rationale: πίστιςకు ఈ సందర్భంలో ప్రామాణిక తెలుగు అనువాదం; 'విశ్వసనీయత' అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: χωρὶς ἔργων
  choice: క్రియలు లేని
  rationale: ἔργα అనే పదానికి క్రియలు అనే రూపం యాకోబు వాదనలోని పదసంబంధాన్ని నిలుపుతూ, కేవలం సాధారణ 'పనులు' కంటే ఉద్దేశపూర్వక కార్యాలను సూచిస్తుంది.
- source_word: νεκρά ἐστιν
  choice: మృతమై ఉంది
  rationale: మొదటి భాగంలోని అదే విశేషణాన్ని పునరావృతం చేసి మూలంలోని సమాంతరతను, వాక్చాతుర్య బలాన్ని కాపాడుతుంది.
theological_decisions:
- issue: పోలికలో πνεύματος అర్థం
  choice: ప్రాణం
  alternative: ఊపిరి; ఆత్మ
  rationale: ఇక్కడ శరీరాన్ని సజీవం చేసే అంశం ప్రధాన భావం. 'ప్రాణం' ఆధునిక తెలుగులో సహజంగా ఉండి గ్రీకు పదంలోని జీవప్రదమైన భావాన్ని తెలియజేస్తుంది; 'ఊపిరి' అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా అస్పష్టతను పూర్తిగా తొలగించదు.
- issue: యాకోబు 2:26లో πίστις అనువాదం
  choice: విశ్వాసం
  alternative: విశ్వసనీయత; నమ్మకం
  rationale: సందర్భంలో 'విశ్వాసం' ప్రామాణికమైన, వేదాంతపరంగా తటస్థమైన ప్రధాన అనువాదం. పదానికి 'విశ్వసనీయత' అనే అర్థం కూడా ఉండగలదని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని ‘శరీరం—విశ్వాసం,’ ‘ప్రాణం లేకపోవడం—క్రియలు లేకపోవడం,’ ‘మృతం—మృతం’ అనే సమాంతర నిర్మాణం నిలుపబడింది.
