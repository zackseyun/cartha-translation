id: JAS.2.6
reference: James 2:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: te
  text: అయితే మీరు ఆ పేదవాణ్ణి అవమానించారు.[a] మిమ్మల్ని అణచివేసేవారు ధనవంతులే కాదా? మిమ్మల్ని న్యాయస్థానాలకు ఈడ్చుకుపోయేవారు కూడా వారే కాదా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆ పేద వ్యక్తిని”; మరింత సాధారణంగా “పేదలను.” గ్రీకులో ఏకవచనం ఉంది. ఇది ముందు వచనాల్లోని నిర్దిష్ట పేద వ్యక్తిని ప్రతిధ్వనింపజేస్తూనే, పేదలను విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “న్యాయస్థానాలు” అంటే న్యాయ విచారణ జరిగే కోర్టులు లేదా న్యాయ పీఠాలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: అవమానించారు
  rationale: గౌరవాన్ని నిరాకరించడం, హీనంగా చూడడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸν πτωχόν
  choice: ఆ పేదవాణ్ణి
  rationale: గ్రీకు ఏకవచనాన్ని, ముందు వచనాల్లో పేర్కొన్న నిర్దిష్ట పేద వ్యక్తితో ఉన్న అనుసంధానాన్ని నిలుపుతుంది; అదే సమయంలో అతడు పేదలకు ప్రతినిధిగా ఉండగల భావాన్ని మూసివేయదు.
- source_word: οἱ πλούσιοι
  choice: ధనవంతులు
  rationale: వర్గాన్ని సూచించే substantival adjective‌కు తెలుగులో సహజమైన సమానార్థకం.
- source_word: καταδυναστεύουσιν
  choice: అణచివేసేది
  rationale: అధికారాన్ని కఠినంగా, ప్రతికూలంగా ప్రయోగించి పీడించడం అనే క్రియ బలాన్ని తెలియజేస్తుంది.
- source_word: ἕλκουσιν
  choice: ఈడ్చుకుపోయేది
  rationale: బలవంతంగా లాగడం అనే సజీవమైన, ప్రతికూల న్యాయ సందర్భానికి తగిన భావాన్ని కాపాడుతుంది.
- source_word: κριτήρια
  choice: న్యాయస్థానాలు
  rationale: ఇక్కడ ఉద్దేశించిన న్యాయ విచారణ జరిగే కోర్టులను స్పష్టంగా సూచిస్తుంది.
- source_word: καὶ αὐτοὶ
  choice: కూడా వారే
  rationale: ధనవంతులే ఈ పని చేస్తున్నారని గ్రీకులోని emphatic pronoun ఇచ్చే నొక్కిచెప్పడాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὐχ ... ;
  choice: '... కాదా?'
  rationale: అవును అనే జవాబును ఆశించే గ్రీకు అలంకారిక ప్రశ్న స్వరాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఏకవచనంలోని ‘పేదవాడు’ ఎవరిని సూచిస్తున్నాడు?
  choice: సభ సందర్భంలో ముందు చెప్పిన పేద వ్యక్తి; విస్తృతంగా పేదలకు ప్రతినిధి కూడా
  alternative: సామూహిక ఏకవచనంగా సాధారణంగా ‘పేదలు’
  rationale: యాకోబు 2:2–3లోని నిర్దిష్ట ఉదాహరణతో వాక్య సంబంధాన్ని ఏకవచనం కాపాడుతుంది; అయినా దాని విస్తృత ప్రతినిధి భావాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. రెండు అలంకారిక ప్రశ్నలుగా విభజించడం ద్వారా గ్రీకు వాక్యంలోని ఆరోపణాత్మక బలం, καὶ αὐτοὶ యొక్క నొక్కిచెప్పడం సహజంగా వ్యక్తమయ్యాయి.
