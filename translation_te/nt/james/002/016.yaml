id: JAS.2.16
reference: James 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν· Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, ⸀τί ὄφελος;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/016.yaml
  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: te
  text: మీలో ఎవరైనా వారికి, “క్షేమంగా వెళ్లండి; వెచ్చగా ఉండండి, తృప్తిగా ఉండండి”[a] అని చెప్పి, వారి శరీరానికి అవసరమైనవి ఇవ్వకపోతే, దానివల్ల ప్రయోజనం ఏమిటి?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత అక్షరార్థంగా, “వెచ్చదనం పొందండి, తృప్తి పొందండి.” గ్రీకు క్రియారూపాలను కర్మణి భావంలోగానీ మధ్యమ భావంలోగానీ అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις ... ἐξ ὑμῶν
  choice: మీలో ఎవరైనా ... చెప్పి
  rationale: ఇది ఒక ఊహాత్మక ఉదాహరణను పరిచయం చేస్తుంది. ἐξ ὑμῶν లోని సమూహార్థాన్ని సహజమైన ఆధునిక తెలుగులో ‘మీలో’ తెలియజేస్తుంది; δέ ను వాక్యప్రవాహంలో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: క్షేమంగా వెళ్లండి
  rationale: ఇది వీడ్కోలు పలికేటప్పుడు ఉపయోగించే ఆశీర్వాదసదృశమైన మాట. ‘క్షేమంగా వెళ్లండి’ తెలుగులో సహజంగా ఉండి, సందర్భంలోని వ్యంగ్యబలాన్ని నిలుపుతుంది.
- source_word: θερμαίνεσθε
  choice: వెచ్చగా ఉండండి
  rationale: మధ్యమ లేదా కర్మణి భావానికి అవకాశం ఉన్న రూపాన్ని, ఎవరు వెచ్చదనం కలిగిస్తారో నిర్ణయించకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: χορτάζεσθε
  choice: కడుపు నిండా తినండి
  rationale: ఆహారంతో తృప్తి చెందడం లేదా నిండడం అనే సందర్భార్థాన్ని సాధారణ పాఠకులకు స్పష్టమైన తెలుగులో తెలియజేస్తుంది; గ్రీకు రూపంలోని మధ్యమ/కర్మణి సంభావ్యతను పాదసూచికలో ఉంచింది.
- source_word: μὴ δῶτε δὲ αὐτοῖς
  choice: వారి ... ఇవ్వకపోతే
  rationale: మాటలకూ కార్యలేమికీ మధ్యనున్న వ్యతిరేకతను తెలుగు షరతు నిర్మాణంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὰ ἐπιτήδεια τοῦ σώματος
  choice: వారి శరీరానికి అవసరమైనవి
  rationale: ἐπιτήδεια సూచించే అవసరమైన సరఫరాలను, τοῦ σώματος లోని శారీరక ప్రాధాన్యాన్ని నిలుపుతూ స్పష్టంగా అనువదిస్తుంది.
- source_word: τί ὄφελος;
  choice: దానివల్ల ప్రయోజనం ఏమిటి?
  rationale: ఆ కార్యరహితమైన మాటల ఆచరణాత్మక విలువను ప్రశ్నించే గ్రీకు అలంకారప్రశ్నను సహజంగా, మూలానికి దగ్గరగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: θερμαίνεσθε మరియు χορτάζεσθε క్రియారూపాల భావం
  choice: ‘వెచ్చగా ఉండండి, కడుపు నిండా తినండి’ అని, స్వయంగా చేసుకోవడం లేదా ఇతరులచేత పొందడం అనే దానిని ప్రధాన పాఠ్యంలో ఖచ్చితంగా నిర్ణయించకుండా అనువదించడం.
  alternative: ‘వెచ్చదనం పొందండి, తృప్తిపరచబడండి’ లేదా ‘మిమ్మల్ని మీరు వెచ్చగా ఉంచుకొని కడుపు నింపుకోండి.’
  rationale: ఈ గ్రీకు రూపాలను మధ్యమ భావంలోనూ కర్మణి భావంలోనూ గ్రహించవచ్చు. యాకోబు ఉద్దేశం శారీరక సహాయం లేని శుభాకాంక్షల వ్యర్థతను చూపడం; స్వయం సహాయమా, ఇతరుల సహాయమా అన్న విషయాన్ని నిర్ణయించడం కాదు. అందువల్ల అసలు భావంలోని ఉద్రిక్తతను పాదసూచికతో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘క్షేమంగా వెళ్లండి’ సంప్రదాయ వీడ్కోలు భావాన్ని నిలుపుతుంది. ‘కడుపు నిండా తినండి’ సాధారణ పాఠకులకు స్పష్టంగా ఉండే ప్రస్తుత వాడుక; ప్రధాన పాఠ్యంలో ఉన్న [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోలుతుంది.
