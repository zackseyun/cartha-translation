id: JAS.2.19
reference: James 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: te
  text: 'నీవు దేవుడు ఒక్కడే అని నమ్ముతున్నావు[a]; మంచిదే. దయ్యాలు సైతం నమ్ముతున్నాయి—భయంతో గడగడలాడుతున్నాయి[b].


    [a] లేదా, “ఒక్కడే దేవుడు ఉన్నాడు.” గ్రీకు వాక్యాన్ని ఈ రెండు విధాలుగానూ అనువదించవచ్చు. “దేవుడు ఒక్కడే” అనేది గ్రీకు పదక్రమాన్ని మరింత దగ్గరగా అనుసరిస్తుంది; యూదుల ఏకదేవ విశ్వాస ప్రకటనను ప్రతిధ్వనింపజేస్తూ ఉండవచ్చు.


    [b] లేదా, “వణుకుతున్నాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక్కడే దేవుడు ఉన్నాడు.” గ్రీకు వాక్యాన్ని ఈ రెండు విధాలుగానూ అనువదించవచ్చు. “దేవుడు ఒక్కడే” అనేది గ్రీకు పదక్రమాన్ని మరింత దగ్గరగా అనుసరిస్తుంది; యూదుల ఏకదేవ విశ్వాస ప్రకటనను ప్రతిధ్వనింపజేస్తూ ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “వణుకుతున్నాయి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: నీవు
  rationale: గ్రీకులో కర్త సర్వనామం స్పష్టంగా ఉండి సంబోధనకు నొక్కిచెబుతుంది. ఏకవచన రెండవ పురుషను ‘నీవు’ సహజంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: πιστεύεις
  choice: నమ్ముతున్నావు
  rationale: ὅτι ద్వారా వచ్చిన సిద్ధాంతపరమైన వాక్యాంశానికి ‘నమ్ముతున్నావు’ సహజమైన తెలుగు; ‘విశ్వాసముంచుతున్నావు’ ఇక్కడ అవసరానికి మించిన వ్యక్తిగత నమ్మకభావాన్ని సూచించవచ్చు.
- source_word: εἷς ἐστιν ὁ θεός
  choice: దేవుడు ఒక్కడే
  rationale: గ్రీకు నిర్మాణానికి దగ్గరగా ఉండి, దేవుని ఏకత్వ ప్రకటనను నిలుపుతుంది. ‘ఒక్కడే దేవుడు ఉన్నాడు’ కూడా సాధ్యమైన అనువాదం కాబట్టి పాదసూచికలో ఇచ్చాం.
- source_word: καλῶς ποιεῖς
  choice: మంచిదే
  rationale: యాకోబు ఇచ్చే సంక్షిప్త అంగీకారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; తరువాతి వ్యంగ్యస్ఫూర్తిగల వ్యత్యాసాన్ని ముందుగానే అతిగా వివరించదు.
- source_word: καὶ
  choice: సైతం
  rationale: ఇక్కడ καί ఆరోహణార్థకంగా ‘కూడా/సైతం’ అనే బలాన్ని కలిగి ఉంది. ‘సైతం’ దయ్యాలకూ ఇదే స్థాయి నమ్మకం ఉందనే ఆశ్చర్యకరమైన పోలికను పదునుగా తెలియజేస్తుంది.
- source_word: τὰ δαιμόνια
  choice: దయ్యాలు
  rationale: δαιμόνιαకు నేరుగా, సాధారణ ఆధునిక తెలుగులో అర్థమయ్యే పదం. ‘దురాత్మలు’ మూలపదంలో లేని వివరణాత్మక ఛాయను జోడించవచ్చు.
- source_word: πιστεύουσιν
  choice: నమ్ముతున్నాయి
  rationale: మొదటి πιστεύειςతో ఉన్న పదపునరుక్తిని నిలుపుతుంది; యాకోబు వాదనలో ఈ పునరుక్తి కీలకం.
- source_word: φρίσσουσιν
  choice: భయంతో గడగడలాడుతున్నాయి
  rationale: భయంతో కలిగే తీవ్రమైన శారీరక ప్రతిచర్యను సజీవమైన, సహజమైన తెలుగులో తెలియజేస్తుంది. సంక్షిప్త ప్రత్యామ్నాయంగా ‘వణుకుతున్నాయి’ పాదసూచికలో ఉంది.
theological_decisions:
- issue: εἷς ἐστιν ὁ θεός అనే ఏకదేవ ప్రకటనను ఎలా అందించాలి
  choice: దేవుడు ఒక్కడే
  alternative: ఒక్కడే దేవుడు ఉన్నాడు
  rationale: ఎంచుకున్న రూపం గ్రీకు వాక్యనిర్మాణానికి దగ్గరగా ఉండి, ఇశ్రాయేలు ఏకదేవ విశ్వాస ప్రకటనకు ఉండవచ్చిన ప్రతిధ్వనిని కాపాడుతుంది. ప్రత్యామ్నాయ అస్తిత్వార్థక రూపమూ వ్యాకరణపరంగా సాధ్యమే కాబట్టి పాదసూచికలో నిలిపాం.
- issue: మానవుని నమ్మకానికి దయ్యాల నమ్మకానికి మధ్య యాకోబు ఉంచిన వ్యత్యాసం
  choice: దయ్యాలు సైతం నమ్ముతున్నాయి—భయంతో గడగడలాడుతున్నాయి
  alternative: దయ్యాలు కూడా నమ్మి వణుకుతున్నాయి
  rationale: ‘సైతం’ పోలికను పదును పెడుతుంది; దీర్ఘ విరామచిహ్నం దయ్యాల ప్రతిచర్యను బలంగా ముందుకు తెస్తుంది. సరైన సిద్ధాంతాన్ని మేధోపరంగా అంగీకరించడం మాత్రమే సరిపోదనే వచనంలోని ఉద్రిక్తతను అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘నీవు’ మూలంలోని ఏకవచన ప్రత్యక్ష సంబోధనను, ‘సైతం’ ఆరోహణార్థక బలాన్ని, పునరావృతమైన ‘నమ్ము’ క్రియ యాకోబు వాదనను నిలుపుతున్నాయి.
