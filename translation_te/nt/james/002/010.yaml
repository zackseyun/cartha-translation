id: JAS.2.10
reference: James 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅστις γὰρ ὅλον τὸν νόμον ⸂τηρήσῃ, πταίσῃ⸃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: te
  text: ఎందుకంటే ఎవరైనా ధర్మశాస్త్రమంతటినీ పాటించినా, ఒక్క విషయంలో తడబడితే, అతడు ధర్మశాస్త్రమంతటికీ దోషి అయ్యాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక్క విషయంలో విఫలమైతే” లేదా “దానిలోని ఒక్క భాగాన్ని ఉల్లంఘిస్తే.” గ్రీకులో “ఒక్క విషయంలో తడబడితే” అని ఉంది; ఇది నైతిక వైఫల్యాన్ని సూచించే రూపకం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ధర్మశాస్త్రమంతటికీ బాధ్యుడు అయ్యాడు.” ధర్మశాస్త్రంలోని ఒక్క భాగాన్ని ఉల్లంఘించడం వల్ల వ్యక్తి ధర్మశాస్త్రమంతటికీ సంబంధించి జవాబుదారుడవుతాడని ఈ పదబంధం సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: ఎవడైనా … వాడు
  rationale: నిర్దిష్ట వ్యక్తిని కాకుండా అందరికీ వర్తించే సాధారణ సూత్రాన్ని తెలిపే అనిశ్చిత సంబంధ సర్వనామ భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను అందించే అనుసంధాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὅλον τὸν νόμον
  choice: ధర్మశాస్త్రమంతటినీ
  rationale: ὅλον తెలిపే సంపూర్ణతను నిలుపుతూ, νόμοςకు తెలుగు బైబిలు సందర్భంలో సహజమైన ‘ధర్మశాస్త్రం’ అనే పదాన్ని వాడుతుంది.
- source_word: τηρήσῃ
  choice: పాటిస్తూ
  rationale: ఆజ్ఞలను కాపాడడం, ఆచరించడం అనే τηρέω భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: πταίσῃ
  choice: తడబడినవాడు
  rationale: πταίωలోని అక్షరార్థమైన ‘తడబడడం’ రూపకాన్ని నిలుపుతూ, సందర్భంలో నైతిక వైఫల్యాన్ని సూచిస్తుంది.
- source_word: ἐν ἑνί
  choice: ఒక్క విషయంలో
  rationale: ఒక నియమం లేదా అంశానికి సంబంధించి అనే గ్రీకు భావాన్ని, అవసరానికి మించి నిర్దిష్టీకరించకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γέγονεν
  choice: అయ్యాడు
  rationale: పరిపూర్ణ కాలం సూచించే—ఒక చర్యవల్ల ఏర్పడిన ప్రస్తుత స్థితి—భావాన్ని తెలుగు సందర్భంలో సహజంగా అందిస్తుంది.
- source_word: πάντων
  choice: దానంతటి విషయంలో
  rationale: ముందు పేర్కొన్న ధర్మశాస్త్రమంతటికి సంబంధించి బాధ్యత ఏర్పడిందనే భావాన్ని నిలుపుతుంది; ప్రతి ఆజ్ఞను విడివిడిగా అతిక్రమించాడని చెప్పదు.
- source_word: ἔνοχος
  choice: దోషి
  rationale: నైతిక-న్యాయ సందర్భంలోని అపరాధబాధ్యతను సహజంగా తెలియజేస్తుంది; ‘బాధ్యుడు’ అనే ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచవచ్చు.
theological_decisions:
- issue: ఒక్క విషయంలో అతిక్రమించినప్పుడు ధర్మశాస్త్రమంతటితో సంబంధమైన దోషం
  choice: ఒక్క విషయంలో తడబడిన వ్యక్తి ధర్మశాస్త్రమంతటి విషయంలో దోషిగా అయ్యాడని అనువదించడం.
  alternative: అతడు ప్రతి ఆజ్ఞనూ విడివిడిగా అతిక్రమించినట్టే లేదా ప్రతి పాపమూ సమాన తీవ్రత కలదని అర్థం చేయడం.
  rationale: πάντων ἔνοχος అనే పదబంధం ధర్మశాస్త్రమంతటికి సంబంధించి అపరాధబాధ్యతను సూచిస్తుంది. ప్రతి ఆజ్ఞను నిజంగా అతిక్రమించాడని గానీ, అన్ని పాపాల తీవ్రత ఒకటేనని గానీ వచనం స్పష్టంగా చెప్పదు; కాబట్టి ఆ సిద్ధాంత నిర్ణయాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘ధర్మశాస్త్రం’ బైబిలు సందర్భంలో స్థిరమైన పదం. ‘తడబడడం’ అనే మూల రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని నైతిక భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
