source:
  edition: SBLGNT
  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: te
  text: రేపు ఏమి జరుగుతుందో మీకు తెలియదు. మీ జీవితం ఎలాంటిది? ఎందుకంటే, కొద్దిసేపు కనిపించి, ఆ తర్వాత అదృశ్యమయ్యే ఆవిరి మీరు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పొగమంచు.”
    reason: ἀτμίς అనే పదానికి సందర్భానుగుణంగా ‘ఆవిరి’ లేదా ‘పొగమంచు’ అనే అర్థాలు సాధ్యమైనందున.
lexical_decisions:
- source_word: ἐπίστασθε
  choice: మీకు తెలియదు
  rationale: భవిష్యత్తు గురించి మానవులకు జ్ఞానం లేదనే భావాన్ని ఆధునిక తెలుగులో సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: τὸ τῆς αὔριον
  choice: రేపు ఏమి జరుగుతుందో
  rationale: గ్రీకులోని సంక్షిప్త, అధ్యాహార ప్రయోగం ‘రేపటికి సంబంధించినది’ అనే భావాన్ని ఇస్తుంది; తెలుగులో ఈ రూపం సహజంగా ఉండి భావాన్ని అతిగా విస్తరించదు.
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: మీ జీవితం ఎలాంటిది?
  rationale: ποία జీవితం యొక్క స్వభావాన్ని ప్రశ్నిస్తుంది. ‘ఎలాంటిది?’ అనే రూపం ఆ ప్రశ్నార్థక బలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀτμὶς
  choice: ఆవిరి
  rationale: క్షణికంగా కనిపించి మాయమయ్యే, స్థిరత్వం లేని దృశ్యరూపాన్ని ‘ఆవిరి’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది; ‘పొగమంచు’ సాధ్యమైన ప్రత్యామ్నాయంగా పాదటిప్పణిలో ఉంచబడింది.
- source_word: πρὸς ὀλίγον
  choice: కొద్దిసేపు
  rationale: అతి స్వల్ప కాలవ్యవధిని సహజమైన, సంక్షిప్తమైన తెలుగులో తెలియజేస్తుంది.
- source_word: φαινομένη
  choice: కనిపించి
  rationale: ఆవిరి తాత్కాలికంగా దృశ్యమవుతుందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: ఆ తర్వాత అదృశ్యమయ్యే
  rationale: మొదట కనిపించడం, తరువాత కనుమరుగవడం అనే క్రమాన్ని, మూలంలోని సజీవ రూపకాన్ని నిలుపుతూ తెలియజేస్తుంది.
theological_decisions:
- issue: మానవ జీవితం యొక్క క్షణభంగురతను తెలిపే రూపకం
  choice: జీవితాన్ని నేరుగా ‘ఆవిరి’గా పేర్కొనే రూపకాన్ని నిలుపడం
  alternative: ‘మీ జీవితం క్షణికమైనది’ అని వివరణాత్మకంగా అనువదించడం లేదా ‘ఆవిరిలాంటివారు’ అని ఉపమానంగా మార్చడం
  rationale: మూలపాఠం మానవ జీవితం యొక్క అనిశ్చితి, స్వల్పకాలికతను సజీవ రూపకంతో చెబుతుంది. దానిని సిద్ధాంతపరంగా విస్తరించకుండా, అలాగే ఉపమానంగా బలహీనపరచకుండా నేరుగా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్యంలోని గంభీరమైన ప్రశ్నార్థక స్వరం మరియు సంక్షిప్త రూపకం నిలుపబడ్డాయి.
