  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: te
  text: కానీ ఇప్పుడు మీరు మీ డాంబికపు వాదనల్లో[a] గొప్పలు చెప్పుకుంటున్నారు. అలాంటి గొప్పలు చెప్పుకోవడమంతా దుష్టమైనదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ అహంకారంలో,” “మీ డాంబికపు గొప్పవాదనల్లో.” గ్రీకు పదం సాధారణంగా అహంకారపూరితమైన డాంబికాన్ని లేదా గొప్పవాదనలను సూచించవచ్చు; ఇక్కడ అది ముందు వచనాల్లో చెప్పిన స్వయంనిశ్చయంతో కూడిన ప్రణాళికలను ప్రత్యేకంగా సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: కాని ఇప్పుడైతే
  rationale: మునుపటి వచనంలో చెప్పిన ప్రభువుపై ఆధారపడే వైఖరికి భిన్నంగా, వారి ప్రస్తుత వాస్తవ వైఖరిని ఈ పదబంధం సూచిస్తుంది.
- source_word: καυχᾶσθε
  choice: గొప్పలు చెప్పుకుంటున్నారు
  rationale: క్రియలోని ప్రగల్భపడటం లేదా అతిశయంగా చెప్పుకోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; తరువాతి καύχησις‌తో ఉన్న పదసంబంధాన్నీ నిలుపుతుంది.
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: మీ డాంబికపు ప్రగల్భాలలో
  rationale: ἀλαζονείαలోని అహంకారపూరితమైన డాంబికం, ఆత్మవిశ్వాసంతో చేసే గొప్ప వాదనలు అనే భావాలను చూపిస్తుంది. బహువచన రూపాన్నీ నిలుపుతుంది; ‘ప్రణాళికలు’ అని మూలంలో లేని భావాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: πᾶσα καύχησις τοιαύτη
  choice: అలాంటి గొప్పలు చెప్పుకోవడమంతా
  rationale: τοιαύτηలోని ‘ఈ విధమైన’ అనే గుణాత్మక భావాన్నీ, πᾶσα యొక్క సమగ్ర సాధారణీకరణనూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πονηρά
  choice: చెడ్డదే
  rationale: ఇక్కడ ఉద్దేశించిన నైతిక ఖండనను సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఖండించబడుతున్న గొప్పలు చెప్పుకోవడం యొక్క స్వభావం
  choice: ప్రభువుకు లోబడకుండా మానవ ప్రణాళికలపై డాంబికమైన స్వయంనమ్మకంతో గొప్పలు చెప్పుకోవడాన్ని సందర్భం ఖండిస్తుంది; ప్రధాన పాఠ్యం మాత్రం ἀλαζονεία యొక్క విస్తృత భావాన్ని నిలుపుతుంది.
  alternative: ఇది అన్ని రకాల ఆత్మవిశ్వాసాన్నీ ఖండిస్తుందని లేదా కేవలం వ్యాపార ప్రణాళికలనుమాత్రమే ఖండిస్తుందని అనువదించడం.
  rationale: యాకోబు 4:13–15లో స్వయంనిశ్చయంతో వేసుకున్న ప్రణాళికలే తక్షణ సందర్భం. అయినప్పటికీ ఈ వచనం చివర వాటి వంటి గొప్పలు చెప్పుకోవడాన్ని సాధారణంగా నైతికంగా ఖండిస్తుంది; అందువల్ల వివరణాత్మక పరిమితిని పాఠ్యంలో బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ‘డాంబికపు ప్రగల్భాలు’ మూలంలోని అహంకారపూరిత వాదనల భావాన్ని నిలుపుతూ, ‘ప్రణాళికలు’ అనే సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో అతిగా స్పష్టీకరించకుండా ఉంచుతుంది.
