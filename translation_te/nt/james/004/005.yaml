revisions:
- from: లేకపోతే, లేఖనం వ్యర్థంగా చెబుతుందని మీరు అనుకుంటున్నారా? ఆయన మనలో నివసింపజేసిన ఆత్మ మనకోసం అసూయతో ప్రగాఢంగా ఆశపడుతున్నాడు[a].
  to: లేక, లేఖనం వ్యర్థంగా మాట్లాడుతుందని మీరు అనుకుంటున్నారా? ఆయన మనలో నివసింపజేసిన ఆత్మ అసూయతో తీవ్రంగా కోరుకుంటుంది[a].
  rationale: The revision removes the unsupported “మనకోసం,” uses the proper alternative connective, and changes the verb so that the main text does not grammatically force the Holy-Spirit reading. The footnote retains the genuine syntactic and lexical ambiguity without imposing a doctrinal resolution.
