review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents κενῶς, γραφή, the causative force of κατῴκισεν, and the disputed referent of τὸ πνεῦμα. However, “మనకోసం” (“for us”) has no basis in the Greek and improperly supplies an object/direction for ἐπιποθεῖ. The masculine verb also unnecessarily resolves the ambiguous referent as the Holy Spirit in the main text.
  naturalness: The proposed revision is natural modern standard Telugu while retaining an elevated scriptural register. “లేక” better reflects the disjunctive ἤ than “లేకపోతే,” and the impersonal/neuter-compatible verb form allows the ambiguity of “ఆత్మ” to remain open.
  terminology: “లేఖనం,” “ఆత్మ,” and “నివసింపజేసిన” are appropriate. “అసూయతో తీవ్రంగా కోరుకుంటుంది” conveys the difficult Πρὸς φθόνον ἐπιποθεῖ without adding an unsupported object. The footnote explicitly preserves both the Holy-Spirit/human-spirit and jealousy/envy alternatives.
  issues:
  - severity: medium
    issue: The phrase “మనకోసం” is added to the main text.
    rationale: The Greek says that the spirit yearns in relation to φθόνος; it does not say that it yearns “for us.” This addition narrows an intentionally difficult construction and should be removed.
  - severity: medium
    issue: The masculine form “ఆశపడుతున్నాడు” biases the main text toward the Holy Spirit.
    rationale: τὸ πνεῦμα may refer to either the Holy Spirit or the human spirit. A Telugu verb form that does not mark masculine personal gender better preserves the source ambiguity, which the footnote rightly notes.
  - severity: low
    issue: “లేకపోతే” is stronger than the Greek connective ἤ.
    rationale: Here ἤ introduces an alternative rhetorical question (“Or do you think …?”). Simple “లేక” is more accurate and idiomatic.
  revised_text: లేక, లేఖనం వ్యర్థంగా మాట్లాడుతుందని మీరు అనుకుంటున్నారా? ఆయన మనలో నివసింపజేసిన ఆత్మ అసూయతో తీవ్రంగా కోరుకుంటుంది[a].
