id: JAS.4.5
reference: James 4:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: te
  text: లేక, లేఖనం వ్యర్థంగా మాట్లాడుతుందని మీరు అనుకుంటున్నారా? ఆయన మనలో నివసింపజేసిన ఆత్మ అసూయతో తీవ్రంగా కోరుకుంటుంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన మనలో నివసింపజేసిన మానవ ఆత్మ ఈర్ష్యతో తీవ్రంగా కోరుకుంటుంది.” గ్రీకు పాఠంలోని “ఆత్మ” పరిశుద్ధాత్మను గానీ మానవ ఆత్మను గానీ సూచించవచ్చు. “అసూయతో” అనే పదబంధాన్ని “ఈర్ష్యతో” లేదా “అసూయపడేంతగా” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: κενῶς
  choice: వ్యర్థంగా
  rationale: లేఖనం ప్రయోజనం లేకుండా లేదా ఫలితం లేకుండా మాట్లాడుతుందా అనే అలంకారప్రశ్నను సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡ γραφὴ
  choice: లేఖనం
  rationale: అధికారపూర్వకమైన పవిత్ర లిఖితాన్ని సూచించే ఏకవచన గ్రీకు ప్రయోగాన్ని నిలుపుతుంది.
- source_word: Πρὸς φθόνον
  choice: అసూయతో
  rationale: ఈ క్లిష్టమైన పదబంధంలోని jealous/envy భావాన్ని నేరుగా ఉంచుతుంది; అది నీతియుక్తమైన ప్రత్యేక హక్కు కోరే అసూయనా, ప్రతికూలమైన ఈర్ష్యనా అన్న సందిగ్ధతను పాదసూచిక వివరిస్తుంది.
- source_word: ἐπιποθεῖ
  choice: ప్రగాఢంగా ఆశపడుతున్నాడు
  rationale: తీవ్రమైన కోరిక లేదా ఆరాటాన్ని సూచించే క్రియాబలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ πνεῦμα
  choice: ఆత్మ
  rationale: గ్రీకులో ఇది పరిశుద్ధాత్మను గానీ మానవ ఆత్మను గానీ సూచించవచ్చు. తెలుగు ప్రధాన పాఠంలో ‘ఆత్మ’ అనే రూపం రెండింటికీ వీలు కల్పిస్తుంది; క్రియలో పుంలింగ గౌరవ ఏకవచనం ప్రధానంగా పరిశుద్ధాత్మ పఠనానికి అనుగుణంగా ఉంది.
- source_word: κατῴκισεν
  choice: నివసింపజేసిన
  rationale: సాధారణంగా ‘నివసించిన’ అని కాక, ఎవరో నివసించేలా చేసిన causative భావాన్ని కాపాడుతుంది.
- source_word: ἐν ἡμῖν
  choice: మనలో
  rationale: సమూహం మధ్య ఉనికికంటే అంతర్నివాస భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: τὸ πνεῦμα ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠం పరిశుద్ధాత్మ పఠనానికి మొగ్గుచూపుతుంది.
  alternative: దేవుడు మనలో నివసింపజేసిన మానవ ఆత్మ.
  rationale: వ్యాకరణం రెండు పఠనాలకూ అవకాశం ఇస్తుంది. ‘నివసింపజేసిన’ అనే భాష దైవిక అంతర్నివాసాన్ని సహజంగా సూచించినప్పటికీ, అసలులోని సిద్ధాంతపరమైన సందిగ్ధతను పాదసూచికలో స్పష్టంగా నిలిపాం.
- issue: φθόνος యొక్క నైతిక భావం
  choice: ‘అసూయతో’ అని అనువదించి, దాన్ని తీవ్రమైన ప్రత్యేక హక్కు కోరే ఆరాటంగా ప్రధాన పాఠంలో చదివాం.
  alternative: ‘ఈర్ష్యతో’ లేదా ‘ఈర్ష్యపడేంతగా’.
  rationale: పరిశుద్ధాత్మ పఠనంలో ఇది దేవునికి తగిన హక్కుగల అసూయగా అర్థమవవచ్చు; అయితే గ్రీకు పదబంధం ప్రతికూల ఈర్ష్య భావానికీ వీలు కల్పిస్తుంది. అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: ἐπιποθεῖ యొక్క కర్త మరియు సాధ్యమైన వాక్యనిర్మాణం
  choice: ఆత్మే ప్రగాఢంగా ఆశపడుతున్నాడని తీసుకున్నాం.
  alternative: దేవుడు మనలో నివసింపజేసిన ఆత్మను ఈర్ష్యపడేంతగా కోరుతున్నాడనే వాక్యనిర్మాణం.
  rationale: ప్రధాన పాఠం τὸ πνεῦμα ను కర్తగా తీసుకునే సరళమైన నిర్మాణాన్ని అనుసరిస్తుంది. ఇతర నిర్మాణాలు చర్చించబడుతున్నప్పటికీ, ఇచ్చిన గ్రీకు పాఠంలో ప్రధాన ప్రత్యామ్నాయం ఆత్మ యొక్క గుర్తింపు మరియు φθόνος భావానికి సంబంధించినది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా లేఖనోచిత గౌరవభావంతో రూపొందించబడింది. ‘లేఖనం’, ‘నివసింపజేసిన’ వంటి పదాలు మూలంలోని అధికారపూర్వకత మరియు causative భావాన్ని నిలుపుతాయి.
