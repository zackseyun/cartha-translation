id: JAS.4.17
reference: James 4:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: te
  text: కాబట్టి[a], మేలు చేయవలసిందని తెలిసి దాన్ని చేయనివానికి అది పాపం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అందువల్ల, తాను చేయవలసిన మేలు ఏమిటో తెలిసి దాన్ని చేయనివానికి అది పాపం.”
    reason: οὖν యొక్క నిర్ధారణాత్మక భావాన్ని, అలాగే καλὸν ποιεῖν‌లో సందర్భానుసారంగా ఉన్న చేయవలసిన మేలు అనే భావాన్ని మరింత విప్పి చెప్పే సాధ్యమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: εἰδότι
  choice: తెలిసి కూడా ... చేయనివానికి
  rationale: దత్తివ ఏకవచన కృదంతాన్ని వ్యక్తిని సూచించే విధంగా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ‘కూడా’ తెలిసినదానికి విరుద్ధంగా చేయకపోవడాన్ని స్పష్టం చేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి చర్చనుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: καλὸν
  choice: మేలు
  rationale: నైతికంగా మంచిదైనదనే విస్తృత భావాన్ని నిలుపుతుంది; ‘మేలు చేయడం’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: ποιεῖν
  choice: చేయాలని
  rationale: καλὸνతో కలిసి చేయవలసిన మేలును తెలిసికొనడం అనే భావాన్ని సహజ తెలుగులో అందిస్తుంది; ‘చేయాలి’ అనే బాధ్యతాభావం సందర్భంలో అంతర్భూతమైనదే అయినా, దానిని అతిగా సిద్ధాంతీకరించదు.
- source_word: μὴ ποιοῦντι
  choice: దాన్ని చేయనివానికి
  rationale: తెలిసిన మేలును చేయకపోవడాన్ని వ్యక్తిని సూచించే దత్తివ నిర్మాణంతో సహజంగా వ్యక్తపరుస్తుంది; ‘దాన్ని’ అనేది గ్రీకులో సందర్భానుసారంగా విడిచిపెట్టిన కర్మను తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ἁμαρτία
  choice: పాపం
  rationale: అనిర్దిష్ట predicate noun యొక్క గుణాత్మక బలాన్ని నిలుపుతూ, ఆ చేయకపోవడం పాపమని నేరుగా చెబుతుంది.
- source_word: αὐτῷ
  choice: చేయనివానికి
  rationale: ‘ఆ వ్యక్తికి/అతని విషయంలో’ అనే దత్తివ సంబంధాన్ని తెలుగు వ్యక్తిసూచక క్రియారూపంలో సహజంగా కలుపుతుంది.
- source_word: ἐστιν
  choice: అది ... పాపం
  rationale: గ్రీకు సంధానక్రియను తెలుగులో సహజమైన నామవాక్య నిర్మాణంతో అందిస్తుంది; ‘అది’ చేయని కార్యాన్ని తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: తెలిసిన మేలును చేయకపోవడం గురించిన వాక్య స్వభావం
  choice: తెలిసి కూడా మేలు చేయకపోవడం పాపమని వాక్యం సాధారణ నైతిక సూత్రంగా చెబుతుంది.
  alternative: ఇది కేవలం తక్షణ సందర్భంలోని గర్వపూరిత ప్రణాళికలకే వర్తిస్తుంది.
  rationale: తక్షణ సందర్భం స్వయంప్రతిపత్తితో కూడిన ప్రణాళికలను గూర్చినదైనా, గ్రీకు వాక్య నిర్మాణం సాధారణ సూత్రంలా విస్తృతంగా ఉంది. అనువాదం ఆ విస్తృతిని నిలుపుతూ ఏ ప్రత్యేక సిద్ధాంత వ్యవస్థకూ పరిమితం చేయదు.
- issue: ποιεῖν‌తో కూడిన καλὸν భావం
  choice: ‘మేలు చేయాలని తెలిసి’
  alternative: ‘చేయవలసిన మేలు ఏమిటో తెలిసి’
  rationale: గ్రీకులో ‘చేయవలసిన’ అనే ప్రత్యేక పదం లేదు. ప్రధాన పాఠం మూలంలోని సంక్షిప్తతను నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. ‘మేలు చేయడం,’ ‘పాపం’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఉపయోగించి, ఏ మతశాఖకు ప్రత్యేకమైన పదజాలాన్నీ చేర్చలేదు.
