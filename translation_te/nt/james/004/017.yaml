- from: కాబట్టి[a], మేలు చేయాలని తెలిసి కూడా దాన్ని చేయనివానికి అది పాపం.
  to: కాబట్టి[a], మేలు చేయవలసిందని తెలిసి దాన్ని చేయనివానికి అది పాపం.
  rationale: The revision changes only the potentially misleading volitional expression ‘చేయాలని’ to ‘చేయవలసిందని.’ It preserves the source’s general ethical formulation, singular personal application, and conclusion that such omission is sin. The footnote remains a legitimate expanded alternative and its rationale is made clearer.
