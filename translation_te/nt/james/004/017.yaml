review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inferential οὖν, the generic singular dative participant, the omission of known good, and the qualitative predicate ‘sin.’ However, ‘మేలు చేయాలని తెలిసి’ normally means ‘knowing/wishing to do good’ and can imply intention rather than knowing what one ought to do. This does not adequately represent καλὸν ποιεῖν in context.
  naturalness: The sentence is concise and natural modern standard Telugu. Replacing ‘చేయాలని’ with ‘చేయవలసిందని’ removes the unintended volitional sense while retaining an idiomatic, clear Telugu construction.
  terminology: ‘మేలు’ and ‘పాపం’ are appropriate, broadly intelligible terms. ‘చేయవలసిందని’ expresses the ethical force inherent in knowing the good to be done without imposing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: ‘మేలు చేయాలని తెలిసి’ is semantically ambiguous and may mean ‘knowing that one wants/intends to do good.’
    rationale: The Greek means knowing the good action to do, followed by failure to do it. Telugu ‘చేయవలసిందని తెలిసి’ naturally marks the recognized obligation/action and preserves the contrast with nonperformance.
  revised_text: కాబట్టి[a], మేలు చేయవలసిందని తెలిసి దాన్ని చేయనివానికి అది పాపం.
