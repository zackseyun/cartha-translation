id: JAS.4.7
reference: James 4:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑποτάγητε οὖν τῷ θεῷ· ἀντίστητε δὲ τῷ διαβόλῳ, καὶ φεύξεται ἀφ’ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: te
  text: కాబట్టి, దేవునికి లోబడండి[a]. కాని అపవాదిని ఎదిరించండి; అప్పుడు అతడు మీ దగ్గరనుండి పారిపోతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవుని ఆధీనంలో ఉండండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτάγητε
  choice: లోబడండి
  rationale: ఇది ὑποτάσσω క్రియ యొక్క ఆజ్ఞార్థక రూపం; దేవుని అధికారాన్ని స్వచ్ఛందంగా అంగీకరించి ఆయనకు విధేయులుగా ఉండాలనే పిలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి వచ్చే నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: ὑποτάγητε క్రియకు దత్తి విభక్తి పూరకంగా ఉన్న గ్రీకు రూపాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἀντίστητε
  choice: ఎదిరించండి
  rationale: ఒకరికి వ్యతిరేకంగా నిలిచి ప్రతిఘటించడమనే ఆజ్ఞను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: కాని
  rationale: దేవునికి లోబడటానికి, అపవాదిని ఎదిరించటానికి మధ్యనున్న స్వల్ప వ్యతిరేక భావాన్ని నిలుపుతుంది.
- source_word: τῷ διαβόλῳ
  choice: అపవాదిని
  rationale: ఇక్కడ διάβολος వ్యక్తిగత దుష్ట ప్రత్యర్థికి వాడిన బిరుదు; తెలుగు బైబిలు భాషలో స్థిరపడిన ‘అపవాది’ ఆ భావాన్ని నిలుపుతుంది.
- source_word: καὶ
  choice: అప్పుడు
  rationale: ఆజ్ఞకు అనుసరించే ఫలితాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; గ్రీకులోని అనుసంధాన భావాన్ని కారణ-ఫలిత సంబంధంగా అతిగా మార్చకుండా సందర్భానుసారంగా అందిస్తుంది.
- source_word: φεύξεται
  choice: అతడు ... పారిపోతాడు
  rationale: భవిష్యత్ ఫలితాన్ని తెలియజేస్తుంది; తెలుగులో స్పష్టత కోసం ముందున్న అపవాదిని సూచించే ‘అతడు’ చేర్చబడింది.
- source_word: ἀφ’ ὑμῶν
  choice: మీ దగ్గరనుండి
  rationale: వారి సమీపం నుంచి దూరంగా వెళ్లడమనే ἀπό భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: διάβολος పదానికి అర్థం
  choice: వ్యక్తిగతమైన దుష్ట ప్రత్యర్థిగా ‘అపవాది’
  alternative: సాధారణంగా ‘నిందకుడు’ లేదా వ్యక్తిత్వరహిత దుష్టశక్తి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న τῷ διαβόλῳ మరియు అతడు పారిపోతాడనే వ్యక్తిగత క్రియారూపం ఇక్కడ వ్యక్తిగత ప్రత్యర్థిని సూచిస్తున్నాయి; అయినా మూలంలో లేనివివరాలను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. వాక్యంలోని తార్కిక అనుసంధానం, వ్యతిరేకత, వాగ్దాన ఫలితం నిలుపబడ్డాయి.
