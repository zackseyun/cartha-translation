id: JAS.4.1
reference: James 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: te
  text: మీ మధ్య యుద్ధాలు, పోరాటాలు ఎక్కడి నుండి వస్తున్నాయి? మీ అవయవాల్లో యుద్ధం చేస్తున్న మీ సుఖాసక్తుల నుండే అవి వస్తున్నవి కాదా?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కలహాలు, గొడవలు.’ గ్రీకులో అక్షరార్థంగా ‘యుద్ధాలు, పోరాటాలు’ అనే సైనిక పదాలు సమాజంలోని వివాదాలకు వాడబడ్డాయి.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మీలో.’ ఈ పదబంధం ‘మీ మధ్య’ లేదా ‘మీ లోపల’ అనే భావాన్ని ఇవ్వవచ్చు. ఈ వాక్యం బాహ్య కలహాలను అంతర్గత సుఖాసక్తులతో ముడిపెడుతుంది.
    reason: alternative_reading
  - marker: c
    text: ‘అవయవాలు’ మూలపదానికి అక్షరార్థ అనువాదం; ఇది శరీర భాగాలనో, మరింత విస్తృతంగా వ్యక్తిలోని అంతర్గత కార్యశక్తులనో సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν
  choice: ఎక్కడి నుండి వస్తున్నాయి
  rationale: మూలంలోని కారణం లేదా ఆరంభస్థానాన్ని ప్రశ్నించే భావాన్ని, పునరుక్తితో సహా, సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πόλεμοι
  choice: యుద్ధాలు
  rationale: సమాజంలోని తీవ్రమైన విభేదాలకు రూపకంగా వాడబడిన సైనిక చిత్రణను ముందుగానే సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: μάχαι
  choice: పోరాటాలు
  rationale: πόλεμοι నుండి భిన్నమైన రెండవ సైనిక పదాన్ని సహజంగా వ్యక్తం చేస్తూ, మూలంలోని జంట పదాల ప్రభావాన్ని కాపాడుతుంది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: తెలుగులో ఇది ‘మీ మధ్య’ అనే సామూహిక భావాన్నీ, ‘మీ లోపల’ అనే అంతర్గత భావాన్నీ మోయగలదు; గ్రీకు పదబంధంలోని నిజమైన సందిగ్ధతను నిలుపుతుంది.
- source_word: οὐκ ἐντεῦθεν
  choice: అవి ఇక్కడి నుండే కాదా
  rationale: అవుననే సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్నను, వెంటనే చెప్పబోయే మూలకారణానికి చూపించే భావాన్ని కాపాడుతుంది.
- source_word: ἡδονῶν
  choice: సుఖాసక్తుల
  rationale: ἡδονήలోని సుఖానుభవం మరియు దానిపట్ల ఆకర్షణ రెండింటినీ తెలుగులో సహజంగా తెలియజేస్తుంది; కేవలం తటస్థమైన ‘సుఖాలు’ కంటే సందర్భంలోని క్రియాశీల కోరిక భావానికి సరిపోతుంది.
- source_word: στρατευομένων
  choice: యుద్ధం చేస్తున్న
  rationale: కొనసాగుతున్న అంతర్గత పోరాటాన్ని సూచించే సైనిక రూపకాన్ని నిలుపుతూ, ముందు వచ్చిన ‘యుద్ధాలు’ అనే పదంతో ప్రతిధ్వనిస్తుంది.
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: మీ అవయవాల్లో
  rationale: μέλη యొక్క శరీర సంబంధ రూపకాన్ని యథాతథంగా నిలుపుతుంది; అది శరీర భాగాలనో, వ్యక్తిలోని కార్యశక్తులనో సూచిస్తుందనే అవకాశాన్ని తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: ప్రారంభంలోని కలహాలు సమాజంలోని వివాదాలా, వ్యక్తుల అంతర్గత సంఘర్షణలా
  choice: మొదటి ἐν ὑμῖνను ‘మీలో’ అని, చివరి పదబంధాన్ని ‘మీ అవయవాల్లో’ అని అనువదించడం
  alternative: మొదటిదాన్ని స్పష్టంగా ‘మీ మధ్య’ అని, చివరిదాన్ని ‘మీ లోపల’ అని అనువదించడం
  rationale: ‘మీలో’ అనే తెలుగు రూపం సామూహిక మరియు అంతర్గత భావాలకు రెండింటికీ అవకాశం ఇస్తుంది; తద్వారా బాహ్య కలహాలను అంతర్గత సుఖాసక్తులతో యాకోబు కలిపే ఉద్వేగాన్ని ఏకపక్షంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే మూలంలోని సైనిక రూపకాలు, అలంకారిక ప్రశ్న, అంతర్గత-సామూహిక సందిగ్ధతలను నిలుపుతూ గౌరవప్రదమైన శైలిని ఉపయోగించింది.
