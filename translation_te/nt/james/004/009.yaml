id: JAS.4.9
reference: James 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος ⸀μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: te
  text: వేదనపడండి[a], దుఃఖించండి, ఏడవండి. మీ నవ్వు దుఃఖంగా మారాలి; మీ సంతోషం దిగులుగా[b] మారాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దురవస్థలో ఉండండి.’ గ్రీకు క్రియ దురవస్థలో లేదా తీవ్రమైన బాధలో ఉండడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కుంగుబాటుగా.’ గ్రీకు పదం ముఖం వాడిపోయినట్లుండే విషాదం లేదా కుంగిన మనస్థితిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: వేదనపడండి
  rationale: ఈ భూతకాల ఆజ్ఞార్థక క్రియ దురవస్థ లేదా తీవ్రమైన మనోవేదనను అనుభవించమనే కఠినమైన పిలుపును ఇస్తుంది. ‘వేదనపడండి’ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాతి రెండు ఆజ్ఞలతో పూర్తిగా కలిసిపోకుండా దాని తీవ్రతను నిలుపుతుంది.
- source_word: πενθήσατε
  choice: దుఃఖించండి
  rationale: πενθέω తెలిపే గాఢమైన శోకాన్ని, ఈ సందర్భంలోని పశ్చాత్తాప స్వరాన్ని ‘దుఃఖించండి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: κλαύσατε
  choice: ఏడవండి
  rationale: కన్నీటితో వ్యక్తమయ్యే దుఃఖాన్ని సూచించే సరళమైన, బలమైన ఆధునిక తెలుగు పదం; ముందు ఉన్న ‘దుఃఖించండి’ నుంచి క్రియాత్మకమైన పురోగతిని నిలుపుతుంది.
- source_word: ὁ γέλως ὑμῶν
  choice: మీ నవ్వు
  rationale: గ్రీకు వాక్యంలోని స్పష్టమైన నామవాచక రూపాన్ని, స్వామ్యాన్ని సహజమైన తెలుగులో నేరుగా నిలుపుతుంది.
- source_word: εἰς πένθος
  choice: దుఃఖంగా
  rationale: πένθος సూచించే శోకస్థితిని సహజమైన తెలుగులో తెలియజేస్తూ, ముందున్న πενθήσατεతో ఉన్న పదార్థ సంబంధాన్ని నిలుపుతుంది.
- source_word: μετατραπήτω
  choice: మారాలి
  rationale: మూడవ పురుష ఆజ్ఞార్థక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఒక స్థితి మరొక స్థితిగా మారడాన్ని అనవసరంగా విస్తరించదు.
- source_word: ἡ χαρὰ
  choice: మీ సంతోషం
  rationale: రెండవ సమాంతర భాగంలో గ్రీకులో ὑμῶν మళ్లీ లేకపోయినా, మొదటి భాగంలోని స్వామ్య భావం దీనికీ వర్తిస్తుంది. ‘మీ’ను చేర్చడం తెలుగు సమాంతర నిర్మాణాన్ని స్పష్టం చేస్తుంది.
- source_word: εἰς κατήφειαν
  choice: దిగులుగా
  rationale: κατήφεια సూచించే కుంగిన, విషాదభరిత స్థితిని ‘దిగులు’ సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పశ్చాత్తాప పిలుపులోని భావోద్వేగ తీవ్రత
  choice: దుఃఖభరితమైన పశ్చాత్తాపానికి ఇచ్చిన బలమైన పిలుపుగా ఆజ్ఞలను అనువదించడం
  alternative: కేవలం గంభీరంగా లేదా నిగ్రహంగా ఉండమనే మృదువైన హెచ్చరికగా అనువదించడం
  rationale: యాకోబు 4:6–10 సందర్భం దేవుని ఎదుట దీనతతో కూడిన పశ్చాత్తాపాన్ని కోరుతుంది. అందువల్ల మూలంలోని కఠినమైన వరుస ఆజ్ఞలను మృదుపరచకుండా ఉంచాం; అయితే వచనంలో లేని సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, నేరుగా సంబోధించే బహువచన గౌరవ ఆజ్ఞార్థక రూపాలు వాడబడ్డాయి. మూడు వరుస ఆజ్ఞల లయను, తరువాతి రెండు సమాంతర మార్పుల నిర్మాణాన్ని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే పదాలను ఎంచుకున్నాం.
