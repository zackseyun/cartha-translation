review_pass:
  verdict: approve
  source_fidelity: 'The Telugu accurately represents the three coordinated aorist imperatives (ταλαιπωρήσατε, πενθήσατε, κλαύσατε) with a suitably forceful sequence: “వేదనపడండి, దుఃఖించండి, ఏడవండి.” The two third-person passive imperatives are naturally conveyed by “మారాలి,” and the movement into mourning/dejection is retained without importing interpretation.'
  naturalness: The wording is clear, idiomatic modern standard Telugu, with an appropriately solemn register. “మీ నవ్వు దుఃఖంగా మారాలి; మీ సంతోషం దిగులుగా మారాలి” is balanced and readily understandable. The plural imperative forms are natural for direct exhortation.
  terminology: “దుఃఖించండి” and “ఏడవండి” preserve the distinct mourning/weeping expressions. “దిగులుగా” suitably communicates κατήφεια as downcast dejection or gloom. “వేదనపడండి” is a defensible modern rendering of ταλαιπωρήσατε, and its footnote supplies the important alternative sense of being in wretched distress.
