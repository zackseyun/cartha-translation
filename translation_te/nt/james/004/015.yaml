id: JAS.4.15
reference: James 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: te
  text: 'దానికి బదులుగా[a], మీరు ఇలా చెప్పాలి: “ప్రభువు చిత్తమైతే, మనం జీవిస్తాం; ఇది గాని అది గాని చేస్తాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “మీరు చెప్పడానికి బదులుగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: దానికి బదులుగా మీరు ఇలా చెప్పాలి
  rationale: ἀντὶ τοῦ + క్రియార్థక రూపం అక్షరార్థంగా ‘మీరు చెప్పడానికి బదులుగా’ అని ఉన్నా, ముందటి వాక్యానికి విరుద్ధమైన సవరణాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘మీరు ఇలా చెప్పాలి’ స్పష్టం చేస్తుంది.
- source_word: Ἐὰν
  choice: అయితే
  rationale: ఉపాధిని సూచించే సహజ తెలుగు ప్రయోగం; θελήσῃతో కలిసి ‘చిత్తమైతే’గా వ్యక్తమవుతుంది.
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: κύριοςకు గౌరవప్రదమైన సాధారణ తెలుగు సమానార్థకం; అది తండ్రినేనా లేక ప్రభువైన యేసునేనా అని అనువాదంలో నిర్ణయించదు.
- source_word: θελήσῃ
  choice: చిత్తమైతే
  rationale: దైవ సంకల్పాన్ని గంభీరంగా, సహజంగా తెలియజేస్తుంది; సాధారణ కోరికను సూచించే ‘కోరుకుంటే’ కంటే సందర్భానికి తగినది.
- source_word: καὶ ζήσομεν
  choice: మనం జీవిస్తాం
  rationale: కొనసాగి జీవించడం కూడా ప్రభువు చిత్తంపై ఆధారపడుతుందని భవిష్యత్ భావంతో నేరుగా తెలియజేస్తుంది.
- source_word: καὶ ποιήσομεν
  choice: చేస్తాం
  rationale: ποιέω యొక్క విస్తృతమైన ‘చేయు’ భావాన్ని నిలుపుతుంది. తెలుగు వాక్య నిర్మాణంలో విడిగా ‘కూడా’ చేర్చకుండానే జీవించడం, చేయడం అనే రెండూ ఒకే షరతుకు లోబడినట్టు స్పష్టంగా ఉంది.
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: ఇది గాని అది గాని
  rationale: నిర్దిష్టం కాని వివిధ ప్రణాళికలను సూచించే సహజమైన తెలుగు జంట ప్రయోగం.
theological_decisions:
- issue: షరతు వాక్యంలో ‘ప్రభువు’ అనే పదం ఎవరిని సూచిస్తుంది, దాని భావం ఏమిటి
  choice: మూలంలోని ‘ప్రభువు’నే ఉంచి, జీవితం మరియు మానవ ప్రణాళికలు ఆయన చిత్తంపై ఆధారపడతాయని తెలియజేయడం
  alternative: ‘దేవుడు’ లేదా ‘ప్రభువైన యేసు’ అని నిర్దిష్టీకరించడం
  rationale: గ్రీకు పాఠంలో ὁ κύριος మాత్రమే ఉంది. తండ్రిని ప్రత్యేకంగా సూచిస్తుందా, యేసును ప్రత్యేకంగా సూచిస్తుందా అన్నది పాఠం తేల్చనందున ఆ అనిశ్చితిని అనువాదం కూడా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘చిత్తమైతే’ దైవ సంకల్పానికి తగిన గంభీరతను ఇస్తుంది; ‘ఇది గాని అది గాని’ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రయోగం.
