id: JAS.4.6
reference: James 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: te
  text: 'అయితే ఆయన మరింత కృపను ఇస్తాడు. అందుకే ఇలా చెప్పబడింది[a]: “దేవుడు గర్విష్ఠులను ఎదిరిస్తాడు, కానీ వినయంగలవారికి కృపను ఇస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అందుకే ఆయన చెబుతున్నాడు,” లేదా “అందుకే లేఖనం చెబుతోంది.” గ్రీకులో “చెబుతోంది” అనే క్రియకు కర్త వ్యక్తంగా లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: మరింత
  rationale: μέγας యొక్క తులనాత్మక రూపాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భంలో కృప పరిమాణం అధికమవుతుందనే భావాన్ని నిలుపుతుంది.
- source_word: δίδωσιν χάριν
  choice: కృపను ఇస్తాడు
  rationale: క్రియ-కర్మ జతను నేరుగా అనువదిస్తూ, వాక్యంలో రెండుసార్లు వచ్చే పదబంధ పునరావృతిని నిలుపుతుంది.
- source_word: διὸ
  choice: అందుకే
  rationale: ముందున్న ప్రకటన నుంచి వచ్చే నిర్ధారణను సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: λέγει
  choice: ఇలా చెప్పబడింది
  rationale: గ్రీకులో కర్త వ్యక్తంగా లేదు. కర్మణి ప్రయోగం ఏ నిర్దిష్ట కర్తనూ చేర్చకుండా లేఖన ఉల్లేఖన సూత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπερηφάνοις
  choice: గర్విష్ఠులను
  rationale: నామవాచకంగా వాడిన విశేషణానికి సరిపోయే రూపం; అహంకార స్వభావాన్ని స్పష్టంగా తెలియజేస్తూ వినయంగలవారితో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ἀντιτάσσεται
  choice: ఎదిరిస్తాడు
  rationale: దేవుడు వారికి విరోధంగా నిలుస్తాడనే క్రియాశీల భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ταπεινοῖς
  choice: వినయంగలవారికి
  rationale: ఈ సందర్భంలోని నైతిక వినయ భావాన్ని అందిస్తుంది; సామాజికంగా అణగారిన స్థితిని మాత్రమే సూచించే పదాన్ని నివారిస్తుంది.
- source_word: δὲ
  choice: అయితే / కానీ
  rationale: వచనం ఆరంభంలోనూ ఉల్లేఖనంలోనూ ఉన్న వ్యతిరేక భావాన్ని సందర్భానుసారమైన సహజ తెలుగు సంధానాలతో నిలుపుతుంది.
theological_decisions:
- issue: λέγει అనే ఉల్లేఖన సూత్రంలోని అవ్యక్త కర్త
  choice: అందుకే ఇలా చెప్పబడింది
  alternative: అందుకే ఆయన చెబుతున్నాడు; అందుకే లేఖనం చెబుతోంది
  rationale: గ్రీకు పాఠం ‘చెబుతున్నది’ ఎవరో వ్యక్తంగా పేర్కొనదు. కర్మణి రూపం దేవుడు లేదా లేఖనం అని అనువాదంలోనే నిర్ణయించకుండా అసలు పాఠంలోని సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కృప’ అనే విస్తృతంగా అర్థమయ్యే ధార్మిక పదాన్ని నిలిపి, మూలంలోని పదబంధ పునరావృతిని కాపాడాం. ఉల్లేఖన సూత్రంలోని కర్తను పాదటిప్పణిలో ప్రత్యామ్నాయాలతో చూపించాం.
