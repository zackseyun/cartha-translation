  source_fidelity: మూల గ్రీకులోని తులనాత్మక భావం (μείζονα), ‘కృపను ఇస్తాడు’ అనే పునరావృతం, διὸ యొక్క నిర్ధారణాత్మక సంబంధం, అలాగే గర్విష్ఠులు/వినయంగలవారు అనే వ్యత్యాసం అన్నీ సక్రమంగా ప్రతిఫలించాయి. λέγειలో కర్త పేర్కొనబడని విషయాన్ని ‘ఇలా చెప్పబడింది’ అనే రూపం అనవసరంగా దేవుడు లేదా లేఖనం అని నిర్దిష్టపరచకుండా కాపాడుతుంది.
