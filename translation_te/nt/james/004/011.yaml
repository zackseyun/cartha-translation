id: JAS.4.11
reference: James 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: te
  text: సోదరులారా,[a] ఒకరి గురించి ఒకరు చెడుగా మాట్లాడకండి.[b] తన సోదరుని గురించి చెడుగా మాట్లాడేవాడు లేదా తన సోదరునికి తీర్పు చెప్పేవాడు ధర్మశాస్త్రానికి వ్యతిరేకంగా మాట్లాడి, ధర్మశాస్త్రానికి తీర్పు చెబుతాడు. నీవు ధర్మశాస్త్రానికి తీర్పు చెబుతుంటే, ధర్మశాస్త్రాన్ని ఆచరించేవాడివి కావు; ధర్మశాస్త్రానికి తీర్పు చెప్పేవాడివి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సోదరులారా’ అనే గ్రీకు పదం పుంలింగ బహువచన రూపంలో ఉంది; ఇక్కడ అది సంఘంలోని సోదర సోదరీమణులందరినీ ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఒకరిపై ఒకరు అపవాదు చెప్పకండి’; గ్రీకు క్రియ ఒకరికి వ్యతిరేకంగా, వారి ప్రతిష్ఠకు హాని కలిగేలా మాట్లాడడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: గురించి చెడుగా మాట్లాడకండి / గురించి చెడుగా మాట్లాడేవాడు / వ్యతిరేకంగా మాట్లాడి
  rationale: ఈ క్రియ ఇతరుల ప్రతిష్ఠకు హాని కలిగించేలా వారికి వ్యతిరేకంగా మాట్లాడడాన్ని సూచిస్తుంది. వ్యక్తి విషయంలో సహజమైన తెలుగు కోసం ‘గురించి చెడుగా మాట్లాడు’ అని, ధర్మశాస్త్రం విషయంలో భావసంబంధాన్ని నిలుపుతూ ‘వ్యతిరేకంగా మాట్లాడు’ అని వాడాం; అపవాదు అనే న్యాయపరంగా సంకుచితమైన అర్థానికి పరిమితం చేయలేదు.
- source_word: ἀλλήλων
  choice: ఒకరి గురించి ఒకరు
  rationale: పరస్పర చర్యను తెలుగులో సహజంగా, నిషేధ వాక్యానికి సరిపోయేలా వ్యక్తం చేస్తుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పుంలింగ బహువచన సంబోధనను, సంఘ కుటుంబ రూపకాన్ని నిలుపుతుంది; సందర్భంలో స్త్రీపురుషులందరూ ఉద్దేశింపబడి ఉండవచ్చని పాదసూచిక తెలియజేస్తుంది.
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: తన సోదరుని / తన సోదరునికి
  rationale: యాకోబులోని కుటుంబ రూపకాన్ని, సంబోధనతో పదసంబంధాన్ని కాపాడుతుంది.
- source_word: ἢ
  choice: లేదా
  rationale: సోదరుని గురించి చెడుగా మాట్లాడడం, అతనికి తీర్పు తీర్చడం అనే సమాంతర చర్యలను విభాజకంగా కలుపుతుంది.
- source_word: κρίνων / κρίνει / κρίνεις
  choice: తీర్పు తీర్చు
  rationale: ఒకే గ్రీకు మూలపదపు పునరావృతిని నిలుపుతుంది; ‘దోషిగా తీర్చు’ కంటే విస్తృత భావాన్ని ఉంచుతుంది.
- source_word: νόμου / νόμον
  choice: ధర్మశాస్త్రం
  rationale: తెలుగు బైబిలు వాడుకలో దేవుని నియమబోధను సూచించే సహజమైన పదం. ఇది మోషే ధర్మశాస్త్రమా, రాజధర్మశాస్త్రమా అని వచనం చెప్పని నిర్దిష్టతను జోడించదు.
- source_word: ποιητὴς
  choice: ఆచరించేవాడు
  rationale: తెలుగులో సహజంగా ఉండి, ధర్మశాస్త్రాన్ని చేయడం/పాటించడం అనే క్రియాత్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: κριτής
  choice: తీర్పు తీర్చేవాడు
  rationale: ‘ఆచరించేవాడు’తో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా ఉంచి, κρίνω పదకుటుంబంతో సంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: సంఘాన్ని ఉద్దేశించిన ἀδελφοί పదపు పరిధి
  choice: ముఖ్య పాఠ్యంలో ‘సోదరులారా’ అని ఉంచి, స్త్రీపురుషులందరూ ఉద్దేశింపబడి ఉండవచ్చని పాదసూచికలో పేర్కొనడం.
  alternative: సోదర సోదరీమణులారా
  rationale: గ్రీకు రూపాన్ని, కుటుంబ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సందర్భంలోని సమగ్ర ఉద్దేశాన్ని ఆధునిక పాఠకులకు తెలియజేస్తుంది.
- issue: ‘ధర్మశాస్త్రం’ అనే పదం దేనిని సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో కేవలం ‘ధర్మశాస్త్రం’ అని అనిర్దిష్టంగా ఉంచడం.
  alternative: మోషే ధర్మశాస్త్రం / రాజధర్మశాస్త్రం / దేవుని ధర్మశాస్త్రం
  rationale: యాకోబు ముందుగా చర్చించిన దైవిక నైతిక బోధ, ముఖ్యంగా పొరుగువాని ప్రేమ, నేపథ్యంగా ఉండవచ్చు; అయితే ఈ వచనం దాని పరిధిని స్పష్టంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ధర్మశాస్త్రం’, ‘ఆచరించేవాడు’, ‘తీర్పు తీర్చేవాడు’ అనే పదాలు యాకోబు వాదనలోని పునరుక్తి మరియు వ్యత్యాసాన్ని నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
