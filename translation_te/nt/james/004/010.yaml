translation:
  language: te
  text: ప్రభువు సన్నిధిలో మిమ్మల్ని మీరు వినయపరచుకోండి; ఆయన మిమ్మల్ని ఉన్నతపరుస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పైకి లేపుతాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: మిమ్మల్ని మీరు తగ్గించుకోండి
  rationale: ఈ ఆజ్ఞారూపం సందర్భంలో స్వచ్ఛందంగా తనను తాను తగ్గించుకోవాలనే భావాన్ని ఇస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండడంతో పాటు, వినయాన్ని కార్యరూపంలో చూపాలనే పిలుపును ఇది నిలుపుతుంది.
- source_word: ἐνώπιον
  choice: సన్నిధిలో
  rationale: ఈ పదానికి ‘ఎదుట’ లేదా ‘సన్నిధిలో’ అనే భావం ఉంది. ఇక్కడ ‘ప్రభువు సన్నిధిలో’ అనేది సంబంధపూర్వకమైన, గౌరవప్రదమైన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: గ్రీకు పదంలోని నిర్దిష్టమైన ‘ప్రభువు’ అనే సూచనను నిలుపుతూ, అది దేవుణ్ణా యేసు ప్రభువునా అని మూలపాఠం కంటే ఎక్కువగా నిర్ధారించదు.
- source_word: ὑψώσει
  choice: హెచ్చిస్తాడు
  rationale: ఇక్కడ పదం అక్షరార్థంగా పైకి ఎత్తడం కంటే గౌరవస్థితికి చేర్చడం లేదా ఉన్నతపరచడం అనే రూపకాలంకార భావంలో ఉంది. ‘హెచ్చిస్తాడు’ ఆ భావాన్ని సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: ὑμᾶς
  choice: మిమ్మల్ని
  rationale: ఇది ద్వితీయ పురుష బహువచన కర్మరూపం. ‘మిమ్మల్ని’ ఆ బహువచన ప్రత్యక్ష సంబోధనను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘ప్రభువు’ అనే పదం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘ప్రభువు’ అని మాత్రమే అనువదించడం
  alternative: ‘దేవుడు’ లేదా ‘ప్రభువైన యేసు’ అని నిర్దిష్టంగా పేర్కొనడం
  rationale: యాకోబు పత్రికలో κύριος అనే పదం దేవుణ్ణి గానీ యేసును గానీ సూచించగలదు. ఈ వాక్యంలోని సమీప సందర్భం దాని సూచనను మరింత సంకుచితం చేయదు; అందువల్ల మూలపాఠంలోని అనిశ్చితిని నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాన్ని వాడాం. ‘మిమ్మల్ని మీరు’ ద్వారా స్వీయ-తగ్గింపు భావం, బహువచన సంబోధన రెండూ స్పష్టమవుతాయి. ‘హెచ్చిస్తాడు’ కొంత గ్రంథశైలిని కలిగి ఉన్నా సాధారణ పాఠకులకు అర్థమయ్యే గంభీర పదం.
