id: JAS.4.12
reference: James 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: te
  text: ధర్మశాసనాన్ని ఇచ్చేవాడూ న్యాయనిర్ణేతా ఒక్కడే—రక్షించగలవాడూ నాశనం చేయగలవాడూ ఆయనే. అయితే, నీ పొరుగువానిపై తీర్పు తీర్చుతున్న నీవెవరు?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: ధర్మశాసనాన్ని ఇచ్చేవాడు
  rationale: ‘శాసనకర్త’ కంటే సాధారణ పాఠకులకు సహజంగా అర్థమయ్యేలా, దేవుని ధర్మశాసనాన్ని స్థాపించి ఇచ్చే అధికారాన్ని తెలియజేస్తుంది.
- source_word: κριτής
  choice: న్యాయనిర్ణేత
  rationale: తీర్పు చెప్పే అధికారమున్న న్యాయాధిపతి అనే భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: σῶσαι
  choice: రక్షించగలవాడు
  rationale: భౌతిక లేదా అంతిమ రక్షణ అనే మూలపదపు విస్తృత భావాన్ని పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: ἀπολέσαι
  choice: నాశనం చేయగలవాడు
  rationale: మూలంలోని బలమైన వ్యతిరేక భావాన్ని మృదువుచేయకుండా ‘destroy’ అనే అర్థాన్ని నిలుపుతుంది.
- source_word: ὁ κρίνων
  choice: తీర్పు తీరుస్తున్న
  rationale: వర్తమాన కృదంత రూపాన్ని ప్రతిబింబిస్తూ, ‘తీర్పు తీర్చే హక్కు నీకెక్కడిది?’ అని విస్తరించకుండా మూలంలోని ప్రత్యక్ష ప్రశ్నను నిలుపుతుంది.
- source_word: πλησίον
  choice: పొరుగువాడు
  rationale: సమీపంలోని తోటి వ్యక్తి/పక్కవాడు అనే బైబిలు సంబంధార్థాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ధర్మశాసనకర్త మరియు న్యాయనిర్ణేత యొక్క ఏకత్వం
  choice: ‘ధర్మశాసనాన్ని ఇచ్చేవాడూ న్యాయనిర్ణేతా ఒక్కడే’
  alternative: ‘ఒక్కడే ధర్మశాసనకర్త, న్యాయాధిపతి’
  rationale: εἷς యొక్క ఉద్ఘాటనను నిలుపుతూ, ధర్మశాసనం ఇచ్చే అధికారం మరియు తీర్పు తీర్చే అధికారం ఒకే వ్యక్తికి చెందుతాయని స్పష్టంగా తెలియజేస్తుంది.
- issue: ‘రక్షించడం’ మరియు ‘నాశనం చేయడం’ యొక్క పరిధి
  choice: అదనపు వివరణ లేకుండా మూలంలోని రెండు క్రియలను సమాంతరంగా ఉంచడం
  alternative: వాటిని ప్రత్యేకంగా నిత్య రక్షణ మరియు నిత్య శిక్షగా వివరించడం
  rationale: వాక్యం ఆ పరిధిని స్పష్టంగా నిర్దేశించదు; అందువల్ల నిజమైన భావవిస్తృతిని, ధార్మిక ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- issue: చివరి ప్రశ్నలో అధికారంపై సూచన
  choice: ‘తీర్పు తీరుస్తున్న నీవెవరు?’
  alternative: ‘తీర్పు తీర్చడానికి నీకేం హక్కుంది?’
  rationale: ప్రశ్నలో అధికారంపై సవాలు అంతర్భూతమైనప్పటికీ, మూలంలో లేని ‘హక్కు’ అనే పదాన్ని చేర్చకుండా వాక్య నిర్మాణాన్ని దగ్గరగా అనుసరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ‘ఒక్కడే’ అనే ఉద్ఘాటన, సమాంతర క్రియలు, చివరి కృదంత ప్రశ్న సంరక్షించబడ్డాయి.
