revisions:
- from: ధర్మశాసనాన్ని ఇచ్చేవాడూ న్యాయనిర్ణేతా ఒక్కడే—రక్షించగలవాడూ నాశనం చేయగలవాడూ ఆయనే. అయితే, నీ పొరుగువానికి తీర్పు తీరుస్తున్న నీవెవరు?
