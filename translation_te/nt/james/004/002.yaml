id: JAS.4.2
reference: James 4:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: te
  text: మీరు కోరుకుంటున్నారు, కానీ మీకు లేదు[a]; మీరు హత్య చేస్తున్నారు[b], అసూయపడుతున్నారు[c], కానీ మీరు పొందలేకపోతున్నారు; మీరు పోరాడుతున్నారు, యుద్ధం చేస్తున్నారు. మీరు అడగకపోవడం వల్ల మీకు లేదు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దురాశపడుతున్నారు.” గ్రీకు పదం బలమైన కోరికను సూచిస్తుంది; ఈ సందర్భంలో ఆ కోరిక తప్పుదిశలో ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “చంపుతున్నారు.” గ్రీకు క్రియ సాధారణంగా మరింత నిర్దిష్టంగా “హత్య చేయడం” అనే అర్థం ఇస్తుంది. కొందరు ఈ మాటను అలంకారికంగా అర్థం చేసుకున్నప్పటికీ, అనువాదం దాని బలమైన పదార్థాన్ని నిలుపుతుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “ఈర్ష్యపడుతున్నారు.”
    reason: lexical_alternative
  - marker: d
    text: చుట్టుపక్కల సందర్భం ప్రకారం అడిగేది దేవుణ్ణే; అయితే ఈ వాక్యంలోని గ్రీకు పాఠం ఆ కర్మను స్పష్టంగా చెప్పదు.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: కోరుకుంటున్నారు
  rationale: ఈ క్రియ బలమైన కోరికను సూచిస్తుంది; సందర్భంలో అది చెడు కోరిక అయినప్పటికీ, ‘కోరుకుంటున్నారు’ అనే పదం దాని అర్థవిస్తృతిని నిలుపుతుంది. సందర్భమే దాని తప్పుదిశను స్పష్టం చేస్తుంది.
- source_word: οὐκ ἔχετε
  choice: మీకు దొరకడం లేదు
  rationale: తెలుగులో కోరుకున్నది తమకు లభించకపోవడాన్ని సహజంగా వ్యక్తపరుస్తుంది; ఇక్కడ ἔχω యొక్క ఫలితార్థాన్ని సందర్భానుగుణంగా అందిస్తుంది.
- source_word: φονεύετε
  choice: హత్య చేస్తున్నారు
  rationale: φονεύω సాధారణంగా కేవలం చంపడాన్ని కాక, హత్య చేయడాన్ని సూచిస్తుంది. మూలంలోని తీవ్రమైన నైతిక బలాన్ని తగ్గించకుండా ఉంచబడింది.
- source_word: ζηλοῦτε
  choice: అసూయపడుతున్నారు
  rationale: ζηλόω సానుకూల ఉత్సాహాన్నీ ప్రతికూల అసూయనూ సూచించగలదు; ఇక్కడ శత్రుత్వం, తీరని కోరికల సందర్భం ప్రతికూల భావానికే మద్దతిస్తుంది.
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: మీరు కోరుకున్నది పొందలేకపోతున్నారు
  rationale: కోరిన లక్ష్యాన్ని చేరుకోలేకపోవడం లేదా దానిని సంపాదించలేకపోవడం అనే సంయుక్త భావాన్ని స్పష్టమైన సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: μάχεσθε
  choice: పోరాడుతున్నారు
  rationale: మాటల తగాదా నుండి ప్రత్యక్ష పోరాటం వరకు ఈ క్రియకు ఉన్న బలాన్ని నిలుపుతుంది; తరువాతి πολεμεῖτε కంటే కొద్దిగా విస్తృతమైన పదంగా పనిచేస్తుంది.
- source_word: πολεμεῖτε
  choice: యుద్ధం చేస్తున్నారు
  rationale: πολεμέωలోని యుద్ధసంబంధమైన బలాన్ని, ముందు ఉన్న μάχεσθεతో కనిపించే తీవ్రత పెరుగుదలను నిలుపుతుంది.
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: మీరు అడగకపోవడం వల్లనే
  rationale: διάతో వచ్చిన articular infinitive యొక్క కారణార్థాన్ని సహజ తెలుగులో అందిస్తుంది. ఎవరిని అడగాలో మూలపాఠం ఈ వాక్యంలో స్పష్టంగా చెప్పనందున కర్మను చేర్చలేదు.
theological_decisions:
- issue: φονεύετεను అలంకారికమైన లేదా తక్కువ తీవ్రమైన పదంగా మృదువుపరచాలా
  choice: ప్రధాన పాఠంలో ‘హత్య చేస్తున్నారు’ అని ఉంచడం
  alternative: ‘చంపుతున్నారు’ లేదా వ్యాఖ్యానాత్మకంగా ‘హృదయంలో హత్య చేస్తున్నారు’
  rationale: గ్రీకు క్రియ స్వయంగా తీవ్రమైనది. దానిని అలంకారం, అతిశయోక్తి లేదా అంతరంగ హత్యగా అర్థం చేసుకోవడం వ్యాఖ్యాన పరిధిలోకి వస్తుంది; అనువాదం యాకోబు మాటల తీవ్రతను నిలుపుతుంది.
- issue: αἰτεῖσθαιకు దేవుణ్ణి అనే కర్మను స్పష్టంగా చేర్చాలా
  choice: ‘అడగకపోవడం’ అని కర్మను సూచితంగానే ఉంచడం
  alternative: ‘దేవుణ్ణి అడగకపోవడం’
  rationale: తదుపరి సందర్భం అడిగేది దేవుణ్ణేనని సూచిస్తుంది; అయితే ఈ వాక్యంలో θεόν లేదు. అందువల్ల మూలంలోని సూచనను స్పష్టీకరణగా ప్రధాన పాఠంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రత్యక్ష శైలి వాడబడింది. వరుసగా వచ్చే గ్రీకు ఉపవాక్యాల తీవ్రతను అర్ధవిరామాలతో నిలుపుతూ, చివరి కారణవాక్యాన్ని సహజంగా వేరు చేశాం. ‘పోరాడుతున్నారు, యుద్ధం చేస్తున్నారు’ అనే జంట μάχεσθε/πολεμεῖτε మధ్యనున్న తీవ్రతను సాధ్యమైనంతవరకు కాపాడుతుంది.
