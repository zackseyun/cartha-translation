- from: మీరు కోరుకుంటున్నారు, అయినా మీకు దొరకడం లేదు[a]; మీరు హత్య చేస్తున్నారు[b], అసూయపడుతున్నారు[c], అయినా మీరు కోరుకున్నది పొందలేకపోతున్నారు; మీరు పోరాడుతున్నారు, యుద్ధం చేస్తున్నారు. మీరు అడగకపోవడం వల్లనే మీకు దొరకడం లేదు[d].
  to: మీరు కోరుకుంటున్నారు, కానీ మీకు లేదు[a]; మీరు హత్య చేస్తున్నారు[b], అసూయపడుతున్నారు[c], కానీ మీరు పొందలేకపోతున్నారు; మీరు పోరాడుతున్నారు, యుద్ధం చేస్తున్నారు. మీరు అడగకపోవడం వల్ల మీకు లేదు[d].
  rationale: The revision restores the simple possessive force of οὐκ ἔχετε as “మీకు లేదు,” reserving “పొందలేకపోతున్నారు” for οὐ δύνασθε ἐπιτυχεῖν. It also removes untranslated emphasis from the final causal clause. The severe lexical force of “murder,” the negative sense of envy, the escalation from fighting to waging war, and the source’s implicit object of asking are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:06:30Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the sequence and force of the Greek verbs, including the strong φονεύετε (“murder”) and the implicit object of αἰτεῖσθαι (“ask”). However, rendering both instances of οὐκ ἔχετε as “మీకు దొరకడం లేదు” shifts the basic sense of ἔχετε (“have”) toward receiving/finding and blurs its distinction from ἐπιτυχεῖν (“obtain/attain”). “వల్లనే” also adds emphasis not expressed by διά.
  naturalness: The Telugu is generally modern and readable. A small revision makes the repeated “do not have” more direct and idiomatic while retaining the progression from desire, to inability to obtain, to conflict.
  terminology: “హత్య చేస్తున్నారు,” “అసూయపడుతున్నారు,” “పోరాడుతున్నారు,” and “యుద్ధం చేస్తున్నారు” are appropriate. The wording continues to avoid making “God” an explicit object of asking in the main text.
  issues:
  - severity: medium
    issue: οὐκ ἔχετε is rendered “మీకు దొరకడం లేదు” in both occurrences.
    rationale: The source says “you do not have,” whereas “దొరకడం లేదు” means “is not being found/received.” Since the next clause explicitly expresses inability to obtain (οὐ δύνασθε ἐπιτυχεῖν), a more direct Telugu equivalent for having is preferable.
  - severity: low
    issue: “వల్లనే” adds an emphatic particle.
    rationale: The causal διά construction means “because”; “వల్ల” communicates this without adding the emphasis of “నే.”
  revised_text: మీరు కోరుకుంటున్నారు, కానీ మీకు లేదు[a]; మీరు హత్య చేస్తున్నారు[b], అసూయపడుతున్నారు[c], కానీ మీరు పొందలేకపోతున్నారు; మీరు పోరాడుతున్నారు, యుద్ధం చేస్తున్నారు. మీరు అడగకపోవడం వల్ల మీకు లేదు[d].
