source:
  edition: SBLGNT
  text: αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: te
  text: మీరు అడుగుతారు, కానీ పొందరు; ఎందుకంటే మీరు తప్పుగా అడుగుతారు, మీ సుఖభోగాల కోసం ఖర్చు చేయడానికి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మీ సుఖభోగాలలో ఖర్చు చేయడానికి.” “సుఖభోగాలు” అనే మాట స్వార్థపూరిత కోరికలు లేదా వాంఛలు అనే భావాన్ని కూడా కలిగి ఉండవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε
  choice: మీరు అడుగుతారు
  rationale: వర్తమానకాల బహువచన క్రియను సహజంగా అనువదిస్తుంది; దేవునికి చేసే విన్నపం సందర్భంలో సూచితమైనా, మూలంలో కర్మ స్పష్టంగా లేదు.
- source_word: οὐ λαμβάνετε
  choice: పొందరు
  rationale: అడగడం–పొందడం అనే మూలంలోని సంబంధాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: διότι
  choice: ఎందుకంటే
  rationale: పొందకపోవడానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: κακῶς αἰτεῖσθε
  choice: మీరు తప్పుగా అడుగుతారు
  rationale: κακῶς యొక్క నైతిక, గుణాత్మక విస్తృతిని నిలుపుతుంది; దాన్ని కేవలం తప్పు ఉద్దేశాలకు మాత్రమే పరిమితం చేయదు.
- source_word: ἵνα
  choice: అనే ఉద్దేశంతో
  rationale: ఇక్కడి ప్రయోజనార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: మీ సుఖభోగాల కోసం
  rationale: ἡδοναίలోని ఆనందాలు, స్వార్థపూరిత సుఖాసక్తులు అనే సందర్భోచిత భావాన్ని అందిస్తుంది; ἐν యొక్క ప్రయోగాన్ని δαπανάωతో సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δαπανήσητε
  choice: ఖర్చు చేయాలనే
  rationale: ‘ఖర్చు చేయడం/వెచ్చించడం’ అనే తటస్థ మూలార్థాన్ని నిలుపుతుంది; ‘వృథా చేయడం’ అనే అదనపు తీవ్రతను చేర్చదు.
theological_decisions:
- issue: అడగడం దేవునికి చేసే ప్రార్థన అని స్పష్టంగా చేర్చాలా
  choice: 'కర్మను సూచితంగానే ఉంచడం: ‘మీరు అడుగుతారు’'
  alternative: ‘మీరు దేవుణ్ణి అడుగుతారు’
  rationale: సందర్భం ప్రార్థనను సూచించినా, ఈ గ్రీకు వాక్యంలో ‘దేవుడు’ అని స్పష్టంగా లేదు; అందువల్ల మూలంలో లేని పదాన్ని చేర్చలేదు.
- issue: κακῶςను తప్పు ఉద్దేశాలుగా మాత్రమే వివరించాలా
  choice: ప్రధాన పాఠ్యంలో ‘తప్పుగా’
  alternative: ‘తప్పుడు ఉద్దేశాలతో’
  rationale: క్రియావిశేషణం ఉద్దేశాన్ని మించిన విస్తృత భావాన్ని కలిగి ఉంది; తరువాతి ἵνα వాక్యభాగమే ఆ తప్పుదనంలోని ఉద్దేశాన్ని వివరిస్తుంది.
- issue: ἵναను ఉద్దేశమా ఫలితమా అన్నట్లు అనువదించాలి
  choice: ప్రయోజనార్థకంగా ‘అనే ఉద్దేశంతో’
  alternative: ఫలితార్థకంగా ‘దాంతో ... ఖర్చు చేస్తారు’
  rationale: ఈ సందర్భంలో వారు అడిగే తప్పు లక్ష్యాన్ని ἵνα ప్రధానంగా తెలియజేస్తుంది; అయినా ప్రయోజనం–ఫలితం మధ్య గ్రీకు నిర్మాణంలోని సమీపతను పూర్తిగా అతిశయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన కాని అతిగా గ్రాంథికం కాని శైలి. గ్రీకు వాక్యంలోని అడగడం–పొందడం పునరుక్తిని నిలిపి, దేవుని పేరును అనవసరంగా చేర్చలేదు. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
