revisions:
- from: 'వ్యభిచారిణులారా[a], లోకంతో స్నేహం దేవునిపట్ల శత్రుత్వమని[c] మీకు తెలియదా? ఇక్కడ “లోకం” అంటే దేవునికి విరోధంగా ఉన్న మానవ వ్యవస్థ; సృష్టి కాదు.[b] కాబట్టి, లోకానికి స్నేహితుడిగా ఉండాలని కోరుకునేవాడు తనను తాను దేవునికి శత్రువుగా చేసుకుంటాడు[d].


    [a] అక్షరార్థంగా స్త్రీలింగ బహువచన సంబోధన. ఇక్కడ ఇది ప్రవక్తల నిబంధన భాషను ప్రతిధ్వనింపజేస్తూ, దేవునిపట్ల ఆత్మీయ అవిశ్వాసాన్ని సూచించే రూపకంగా ఉండవచ్చు.

    [b] “లోకం” ఇక్కడ సృష్టిని కాకుండా, దేవునికి విరోధంగా ఉన్న మానవ వ్యవస్థను సూచిస్తుంది.

    [c] లేదా, “దేవునితో శత్రుత్వం.”

    [d] లేదా, “దేవునికి శత్రువవుతాడు.”'
  to: వ్యభిచారిణులారా[a], లోకంతో[b] స్నేహం దేవునిపట్ల శత్రుత్వమని[c] మీకు తెలియదా? కాబట్టి, లోకానికి స్నేహితుడిగా ఉండాలని కోరుకునేవాడు దేవునికి శత్రువవుతాడు[d].
  rationale: The cultural explanation concerning ‘లోకం’ has been removed from the translated verse and retained as an anchored footnote. The final clause uses the natural, source-faithful ‘దేవునికి శత్రువవుతాడు’; the alternative note preserves the more explicitly reflexive rendering represented in the English audit trail. No doctrinal expansion has been introduced.
