id: JAS.4.4
reference: James 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: te
  text: వ్యభిచారిణులారా[a], లోకంతో[b] స్నేహం దేవునిపట్ల శత్రుత్వమని[c] మీకు తెలియదా? కాబట్టి, లోకానికి స్నేహితుడిగా ఉండాలని కోరుకునేవాడు దేవునికి శత్రువవుతాడు[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా స్త్రీలింగ బహువచన సంబోధన. ఇక్కడ ఇది ప్రవక్తల నిబంధన భాషను ప్రతిధ్వనింపజేస్తూ, దేవునిపట్ల ఆత్మీయ అవిశ్వాసాన్ని సూచించే రూపకంగా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “లోకం” ఇక్కడ సృష్టిని కాకుండా, దేవునికి విరోధంగా ఉన్న మానవ వ్యవస్థను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: లేదా, “దేవునితో శత్రుత్వం.”
    reason: alternative_reading
  - marker: d
    text: లేదా, “తనను తాను దేవునికి శత్రువుగా చేసుకుంటాడు.”
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: వ్యభిచారిణులారా
  rationale: స్త్రీలింగ బహువచన సంబోధనను మెత్తబరచకుండా నేరుగా నిలుపుతుంది. సందర్భంలో ఇది నిబంధనపరమైన ఆత్మీయ అవిశ్వాసానికి రూపకం కావచ్చు; ఆ వివరణను పాదటిప్పణిలో ఉంచాం.
- source_word: οὐκ οἴδατε
  choice: మీకు తెలియదా?
  rationale: ప్రతికూల అలంకారప్రశ్న యొక్క సవాలు చేసే బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: φιλία
  choice: స్నేహం
  rationale: φίλος అనే తరువాతి పదంతో ఉన్న పదసంబంధాన్ని నిలుపుతూ, సంబంధపరమైన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: κόσμου
  choice: లోకం
  rationale: మూలంలోని విస్తృత పదాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ఇక్కడ ఉద్దేశించిన దేవవిరోధ మానవ వ్యవస్థ అనే భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: ἔχθρα τοῦ θεοῦ
  choice: దేవునిపట్ల శత్రుత్వం
  rationale: τοῦ θεοῦను సందర్భానుసారంగా కర్మార్థక షష్ఠీగా గ్రహించి, దేవుని వైపు మళ్లిన విరోధాన్ని సహజ తెలుగులో తెలియజేస్తుంది; సంబంధార్థక సాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: ὃς ἐὰν οὖν
  choice: కాబట్టి, … కోరుకునేవాడు
  rationale: οὖνలోని నిర్ధారణాత్మక భావాన్నీ, నిర్దిష్టం కాని సాధారణ వ్యక్తిని సూచించే సంబంధ వాక్యాన్నీ తెలుగులో సహజంగా అందిస్తుంది.
- source_word: βουληθῇ
  choice: ఉండాలని కోరుకునేవాడు
  rationale: ఉద్దేశపూర్వకమైన కోరికను తెలియజేస్తుంది; కేవలం యాదృచ్ఛిక స్థితిని సూచించదు.
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: లోకానికి స్నేహితుడిగా ఉండాలని
  rationale: φιλίαతో ఉన్న పదసంబంధాన్ని కాపాడి, మూలంలోని నామవాచక నిర్మాణాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἐχθρὸς τοῦ θεοῦ
  choice: దేవునికి శత్రువు
  rationale: ‘లోకానికి స్నేహితుడు’ అనే పదబంధానికి బలమైన సంబంధపరమైన వ్యతిరేకతను నేరుగా నిలుపుతుంది.
- source_word: καθίσταται
  choice: తనను తాను … చేసుకుంటాడు
  rationale: ఎంచుకున్న అనుబంధం వల్ల ఆ స్థితిలో తనను తాను ఉంచుకునే నైతిక బాధ్యతను వ్యక్తం చేస్తుంది; ‘శత్రువవుతాడు’ అనే సాధ్యమైన సరళ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: μοιχαλίδες యొక్క రూపకార్థం
  choice: ప్రధాన పాఠ్యంలో అక్షరార్థమైన స్త్రీలింగ సంబోధన ‘వ్యభిచారిణులారా’ను నిలుపడం
  alternative: వ్యభిచార స్వభావంగల ప్రజలారా; అవిశ్వాసులారా
  rationale: ఈ పదం ప్రవక్తల నిబంధన భాషలోని ఆత్మీయ అవిశ్వాసాన్ని ప్రతిధ్వనింపజేసే అవకాశం ఉంది. అయినా రూపకాన్ని వివరణాత్మక పదంతో భర్తీ చేస్తే మూలంలోని తీక్ష్ణత, స్త్రీలింగ రూపం పోతాయి.
- issue: κόσμος యొక్క భావపరిధి
  choice: ప్రధాన పాఠ్యంలో ‘లోకం’ అని అనువదించి, సందర్భార్థాన్ని పాదటిప్పణిలో వివరించడం
  alternative: దేవునికి విరోధమైన లోక వ్యవస్థ; ప్రస్తుత దుష్ట వ్యవస్థ
  rationale: ఇక్కడ భౌతిక సృష్టి కాక దేవునికి విరోధంగా ఉన్న మానవ విలువల వ్యవస్థ ఉద్దేశించబడింది. అయితే మూలపాఠ్యం ‘లోకం’ అనే పదాన్నే వాడుతుంది కాబట్టి, విస్తృత వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: ἔχθρα τοῦ θεοῦలోని షష్ఠీ సంబంధం
  choice: ‘దేవునిపట్ల శత్రుత్వం’ అనే కర్మార్థక భావం
  alternative: దేవునితో శత్రుత్వం
  rationale: లోకంతో స్నేహాన్ని ఎంచుకోవడం దేవునికి వ్యతిరేకమైన వైఖరిగా మారుతుందని సందర్భం సూచిస్తుంది. అయినా సంబంధార్థక అనువాదం వ్యాకరణపరంగా సాధ్యమే కనుక పాదటిప్పణిలో నిలిపాం.
- issue: καθίσταταιలో కర్తృత్వం మరియు స్థితిమార్పు
  choice: ‘తనను తాను … చేసుకుంటాడు’
  alternative: ‘… శత్రువవుతాడు’
  rationale: βούλομαιతో కలిసిన సందర్భంలో వ్యక్తి ఉద్దేశపూర్వక ఎంపికకు ఉన్న బాధ్యతను ఈ రూపం స్పష్టం చేస్తుంది. క్రియను కేవలం స్థితిమార్పుగా అనువదించే అవకాశం కూడా ఉంది; దానిని పాదటిప్పణిలో ఇచ్చాం.
