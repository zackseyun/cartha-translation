  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, నేరుగా సవాలు చేసే సంబోధనను వాడాం. ‘వ్యభిచారిణులారా’ అనే కఠిన రూపకాన్ని మెత్తబరచలేదు. ‘స్నేహం/స్నేహితుడు,’ ‘శత్రుత్వం/శత్రువు’ అనే సమాంతర పదజాలంతో మూలంలోని సంబంధపరమైన వ్యతిరేకతను నిలిపాం.
