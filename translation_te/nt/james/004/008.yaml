review_pass:
  verdict: revise
  source_fidelity: The imperative sequence, vocatives, future promise, and deliberate parallelism of approaching God are accurately represented. However, the reflexive forms శుభ్రపరచుకోండి and పవిత్రపరచుకోండి can shift the direct-object imperatives ('cleanse hands' and 'purify hearts') toward 'cleanse/purify yourselves.' Non-reflexive transitive imperatives better reflect the Greek syntax while retaining the images.
  naturalness: దేవునికి దగ్గరవండి and ఆయన మీకు దగ్గరవుతాడు are natural modern Telugu and preserve the verbal parallel. The revised direct-object forms are also more idiomatic with explicit objects. ద్విమనస్కులారా is concise, intelligible, and suitably forceful in this exhortative register.
  terminology: పాపులారా, చేతులు, and హృదయాలు appropriately retain the source imagery. Rendering καθαρίσατε as శుభ్రపరచండి and ἁγνίσατε as శుద్ధపరచండి preserves a useful lexical distinction without importing an interpretive theological distinction. The footnote correctly retains the literal 'two-souled' image and explains divided loyalty.
  issues:
  - severity: medium
    issue: The verbs శుభ్రపరచుకోండి and పవిత్రపరచుకోండి are reflexive.
    rationale: The Greek has transitive aorist imperatives with χεῖρας ('hands') and καρδίας ('hearts') as their direct objects. Telugu పరచుకోండి can suggest performing the action for/on oneself, rather than directly cleansing the stated objects. Use non-reflexive transitive imperatives.
  - severity: low
    issue: పవిత్రపరచుకోండి may suggest making the hearts holy rather than purifying them.
    rationale: ἁγνίσατε primarily calls for purification. శుద్ధపరచండి more directly communicates purification and maintains contrast with the cleansing of hands.
  revised_text: దేవునికి దగ్గరవండి; అప్పుడు ఆయన మీకు దగ్గరవుతాడు. పాపులారా, మీ చేతులను శుభ్రపరచండి; ద్విమనస్కులారా[a], మీ హృదయాలను శుద్ధపరచండి.
