id: JAS.4.8
reference: James 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: te
  text: దేవునికి దగ్గరవండి; అప్పుడు ఆయన మీకు దగ్గరవుతాడు. పాపులారా, మీ చేతులను శుభ్రపరచండి; ద్విమనస్కులారా[a], మీ హృదయాలను శుద్ధపరచండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “రెండు ఆత్మలు గలవారు.” ఈ పదం నిబద్ధతలో లేదా అంతరంగ నిబద్ధతలో చీలిపోయినవారిని వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίσατε
  choice: దగ్గరవండి
  rationale: బహువచన ఆజ్ఞారూపంలోని ‘సమీపించండి’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; తరువాతి వాక్యభాగంలోని అదే క్రియతో సమాంతరతను నిలుపుతుంది.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: ἐγγίζω క్రియతో వచ్చిన దత్తి విభక్తి సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐγγιεῖ
  choice: ఆయన మీకు దగ్గరవుతాడు
  rationale: భవిష్యత్ సూచనను, దేవుడే అంతర్లీన కర్త అనే విషయాన్ని స్పష్టంగా ఉంచి, మొదటి వాక్యభాగంలోని క్రియా సమాంతరతను కాపాడుతుంది.
- source_word: καθαρίσατε
  choice: శుభ్రపరచుకోండి
  rationale: తీవ్రమైన ఆజ్ఞను నిలుపుతూ, చేతుల శుద్ధికి సంబంధించిన బాహ్య చిత్రాన్నీ దాని నైతిక సూచననూ అతిగా వివరించకుండా ఉంచుతుంది.
- source_word: χεῖρας
  choice: మీ చేతులను
  rationale: గ్రీకులో స్వామ్యసర్వనామం లేకపోయినా ప్రత్యక్ష సంబోధనలో తెలుగు సహజత్వం కోసం ‘మీ’ చేర్చబడింది; బాహ్య ప్రవర్తనను సూచించే శరీర చిత్రాన్ని అలాగే ఉంచుతుంది.
- source_word: ἁμαρτωλοί
  choice: పాపులారా
  rationale: బహువచన సంబోధనలోని సూటైన గద్దింపును సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἁγνίσατε
  choice: పవిత్రపరచుకోండి
  rationale: καθαρίσατεతో ఉన్న పదభేదాన్ని నిలుపుతూ, హృదయాల అంతరంగ శుద్ధి భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: καρδίας
  choice: మీ హృదయాలను
  rationale: అంతరంగ వ్యక్తిత్వం, ఉద్దేశాలు, నిబద్ధతలను సూచించే బైబిలు చిత్రాన్ని నిలుపుతుంది; తెలుగు సహజత్వం కోసం ‘మీ’ చేర్చబడింది.
- source_word: δίψυχοι
  choice: ద్విమనస్కులారా
  rationale: అంతరంగ నిబద్ధతలో చీలిక ఉన్నవారనే భావాన్ని సంక్షిప్తంగా, గద్దింపు స్వరంతో తెలియజేస్తుంది; గ్రీకు పదంలోని సజీవమైన ‘రెండు ఆత్మలు’ చిత్రాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
theological_decisions:
- issue: నైతిక ప్రబోధంలోని శరీర రూపకాలను ఎలా అనువదించాలి
  choice: ‘చేతులు,’ ‘హృదయాలు’ అనే చిత్రాలను ప్రధాన పాఠ్యంలో అలాగే ఉంచడం
  alternative: వాటిని ‘బాహ్య క్రియలు,’ ‘అంతరంగ ఉద్దేశాలు’ అని వివరణాత్మకంగా మార్చడం
  rationale: ఈ భాషలో నైతిక శుద్ధితో పాటు ఆచారసంబంధ శుద్ధి ప్రతిధ్వని కూడా ఉండవచ్చు. వివరణాత్మక భావానువాదంతో ఆ ఉద్రిక్తతను తొలగించకుండా మూల చిత్రాలను నిలుపుతుంది.
- issue: δίψυχοι పదంలోని విభజిత నిబద్ధత
  choice: ప్రధాన పాఠ్యంలో ‘ద్విమనస్కులారా’ అని అనువదించడం
  alternative: ‘రెండు ఆత్మలు గలవారలారా’ లేదా ‘చీలిన నిబద్ధత గలవారలారా’
  rationale: ‘ద్విమనస్కులు’ ఆధునిక పాఠకులకు అర్థమయ్యేలా అంతరంగ అస్థిరతను, విభజిత విధేయతను తెలియజేస్తుంది. మరింత అక్షరార్థమైన రూపాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా గ్రీకు పదచిత్రం కోల్పోకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన సంబోధనను ఉపయోగించాం. వరుస ఆజ్ఞల తీవ్రతను, ‘దగ్గరవండి/దగ్గరవుతాడు’ అనే సమాంతరతను, ‘చేతులు/హృదయాలు’ అనే బాహ్య–అంతరంగ చిత్రజోడును నిలుపుకున్నాం. పాదటిప్పణి గుర్తు అది వివరిస్తున్న ‘ద్విమనస్కులారా’ పదానికే జతచేయబడింది.
