revisions:
- from: దేవునికి దగ్గరవండి; అప్పుడు ఆయన మీకు దగ్గరవుతాడు. పాపులారా, మీ చేతులను శుభ్రపరచుకోండి; ద్విమనస్కులారా[a], మీ హృదయాలను పవిత్రపరచుకోండి.
  to: దేవునికి దగ్గరవండి; అప్పుడు ఆయన మీకు దగ్గరవుతాడు. పాపులారా, మీ చేతులను శుభ్రపరచండి; ద్విమనస్కులారా[a], మీ హృదయాలను శుద్ధపరచండి.
  rationale: The revision changes only the two reflexive verb forms to direct transitive imperatives, matching the Greek construction with explicit objects. It also uses శుద్ధపరచండి for the hearts to express purification more precisely, while preserving the source's distinction between cleansing hands and purifying hearts. The footnote anchor remains correctly attached to ద్విమనస్కులారా, and its literal lexical alternative is retained.
