id: JAS.4.13
reference: James 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ λέγοντες· Σήμερον ⸀ἢ αὔριον ⸀πορευσόμεθα εἰς τήνδε τὴν πόλιν καὶ ⸀ποιήσομεν ἐκεῖ ⸀ἐνιαυτὸν καὶ ⸀ἐμπορευσόμεθα καὶ ⸀κερδήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: te
  text: ఇప్పుడు వినండి, “ఈ రోజు లేదా రేపు మేము ఈ నగరానికి[a] వెళ్లి, అక్కడ ఒక సంవత్సరం గడిపి, వ్యాపారం చేసి, లాభం సంపాదిస్తాం” అని చెప్పేవారూ!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, నుడికారంగా, “ఫలానా నగరానికి.” గ్రీకులో “ఈ నగరానికి” అని ఉంది; అది వారి ప్రణాళికలోని ఒక నిర్దిష్ట నగరాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: ఇప్పుడు వినండి
  rationale: మందలింపును లేదా హెచ్చరికను ప్రారంభించే శ్రద్ధాకర్షక నుడికారం. అక్షరార్థమైన ‘ఇప్పుడు రండి’ కంటే ఆధునిక తెలుగులో ‘ఇప్పుడు వినండి’ సహజంగా ఉండి, మూలంలోని ప్రత్యక్షతను నిలుపుతుంది.
- source_word: οἱ λέγοντες
  choice: అని చెప్పేవారలారా
  rationale: ఆర్టికల్‌తో ఉన్న పార్టిసిపల్ ఇక్కడ సంబోధనగా పనిచేస్తుంది. ప్రత్యక్షంగా ఎదుర్కొనే స్వరాన్ని తెలుగులో సహజమైన సంబోధనతో వ్యక్తం చేస్తుంది.
- source_word: Σήμερον ἢ αὔριον
  choice: ఈ రోజు లేదా రేపు
  rationale: ἢ విభాజక సంయోజకం; అందువల్ల ‘లేదా’ సమీప భవిష్యత్తు గురించి వారు వేసుకున్న ప్రత్యామ్నాయ ప్రణాళికను సరిగ్గా తెలియజేస్తుంది.
- source_word: πορευσόμεθα
  choice: మేము … వెళ్లి
  rationale: πορεύομαι ఇక్కడ సాధారణంగా ఒక చోటికి వెళ్లడాన్ని సూచిస్తుంది. ‘వెళ్లి’ సహజమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: εἰς τήνδε τὴν πόλιν
  choice: ఈ నగరానికి
  rationale: τήνδε ఒక నిర్దిష్ట నగరాన్ని సూచించే ప్రదర్శక సర్వనామం. εἰς యొక్క గమ్యార్థాన్ని తెలుగులో సహజంగా ‘-కి’తో వ్యక్తం చేశాం; ‘ఫలానా నగరానికి’ అనే సందర్భోచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: అక్కడ ఒక సంవత్సరం గడిపి
  rationale: కాలవ్యవధిని సూచించే accusativeతో ποιέω అంటే ఆ కాలాన్ని గడపడం. ఈ గ్రీకు నుడికారాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలిపింది.
- source_word: ἐμπορευσόμεθα
  choice: వ్యాపారం చేసి
  rationale: ఈ క్రియ వాణిజ్య కార్యకలాపాన్ని సూచిస్తుంది. ‘వ్యాపారం చేసి’ సాధారణ పాఠకులకు సహజంగా, తగినంత విస్తృతంగా ఉంటుంది.
- source_word: κερδήσομεν
  choice: లాభం సంపాదిస్తాం
  rationale: వ్యాపార సందర్భంలో ఈ క్రియ ఆర్థిక లాభాన్ని పొందడాన్ని సూచిస్తుంది. ‘లాభం సంపాదిస్తాం’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రత్యక్ష మందలింపు స్వరం
  choice: ‘అని చెప్పేవారలారా’ అనే ప్రత్యక్ష సంబోధన
  alternative: ‘అని చెప్పేవారు’ అనే పరోక్ష వివరణ
  rationale: యాకోబు స్వయంభరోసాతో ప్రణాళికలు వేసేవారిని నేరుగా ఉద్దేశిస్తున్నాడు. ప్రత్యక్ష సంబోధన మూలంలోని ప్రవక్తీయ మందలింపు బలాన్ని నిలుపుతుంది; వారి ప్రణాళికలు లేదా వ్యాపారం స్వతహాగా తప్పని అదనపు భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైనప్పటికీ గట్టిగా మందలించే స్వరాన్ని ఉపయోగించాం. ఉటంకించిన ప్రణాళికలో వరుసగా వచ్చే భవిష్యత్ చర్యలను తెలుగులో సహజమైన క్రియాక్రమంతో వ్యక్తం చేసి, చివరి క్రియలో భవిష్యత్ భావాన్ని స్పష్టంగా ఉంచాం.
