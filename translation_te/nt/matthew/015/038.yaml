  text: οἱ δὲ ἐσθίοντες ἦσαν τετρακισχίλιοι ἄνδρες χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: te
  text: తిన్నవారు నాలుగు వేల మంది పురుషులు; స్త్రీలను, పిల్లలను లెక్కలో చేర్చలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్త్రీలు, పిల్లలు అదనం.”
    reason: χωρὶς నాలుగు వేల సంఖ్య నుండి స్త్రీలు, పిల్లలు మినహాయించబడ్డారని, వారు అదనంగా ఉన్నారని సూచించవచ్చు.
lexical_decisions:
- source_word: οἱ δὲ
  choice: తిన్నవారు
  rationale: δέ స్వల్ప అనుసంధాన పదం; తెలుగులో సందర్భప్రవాహం సహజంగా ఉండేందుకు దానిని ప్రత్యేక పదంతో అనువదించలేదు. ఆర్టికల్‌తో కూడిన కృదంతాన్ని వ్యక్తులను సూచించే రూపంగా అనువదించాం.
- source_word: ἐσθίοντες
  choice: తిన్నవారు
  rationale: రూపరీత్యా వర్తమాన కృదంతమైనప్పటికీ, సందర్భంలో భోజనం చేసిన సమూహాన్ని సూచిస్తుంది; పూర్తయిన చర్యను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἦσαν τετρακισχίλιοι
  choice: నాలుగు వేల మంది
  rationale: కర్తల సంఖ్యను తెలిపే గ్రీకు సంయోజక నిర్మాణాన్ని సహజమైన తెలుగు సంఖ్యా నిర్మాణంగా ఇచ్చాం.
- source_word: ἄνδρες
  choice: పురుషులు
  rationale: ἀνήρ ఇక్కడ సాధారణంగా మనుషులు అనే అర్థం కాకుండా పురుషులను ప్రత్యేకంగా సూచిస్తుంది; తరువాత స్త్రీలు, పిల్లలు విడిగా పేర్కొనబడటం దీనిని నిర్ధారిస్తుంది.
- source_word: χωρὶς
  choice: కాకుండా
  rationale: చెప్పిన నాలుగు వేల లెక్కలో స్త్రీలు, పిల్లలు చేరలేదని సూచించే సహజ తెలుగు ప్రయోగం.
- source_word: γυναικῶν καὶ παιδίων
  choice: స్త్రీలు, పిల్లలు
  rationale: γυνήకి ఇక్కడ సాధారణ అర్థమైన ‘స్త్రీలు’ సరిపోతుంది; παιδίονను వయోపరిమితిని అనవసరంగా కుదించకుండా ‘పిల్లలు’గా ఇచ్చాం.
theological_decisions:
- issue: లెక్కింపులో లింగ-నిర్దిష్ట పదప్రయోగం
  choice: ప్రధాన పాఠ్యంలో ‘పురుషులు’ అని ఉంచి, స్త్రీలు మరియు పిల్లలు ఆ సంఖ్యలో చేరలేదని స్పష్టంగా చూపించాం.
  alternative: అందరినీ కలిపి ‘ప్రజలు’ లేదా ‘మనుషులు’ అని అనువదించడం.
  rationale: గ్రీకు ἄνδρες పురుషులను సూచిస్తుంది; స్త్రీలు, పిల్లలు విడిగా చెప్పబడ్డారు. ‘ప్రజలు’ అని అనువదిస్తే మూలంలోని ముఖ్యమైన భేదం చెరిగిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువదించాం. ‘పురుషులు’ అనే పదంతో మూలంలోని లింగ-నిర్దిష్టతను నిలిపాం.
