id: MAT.15.30
reference: Matthew 15:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: te
  text: అనేక జనసమూహాలు ఆయన దగ్గరకు వచ్చాయి. వారు తమతోపాటు మాట్లాడలేనివారిని[a], చూపులేనివారిని, కుంటివారిని, చేతులు లేదా కాళ్లలో వైకల్యం ఉన్నవారిని[b], ఇంకా అనేకమందిని తీసుకొచ్చి ఆయన పాదాల దగ్గర ఉంచారు. ఆయన వారిని స్వస్థపరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వినలేనివారిని.’ గ్రీకు పదం κωφούς సందర్భాన్ని బట్టి వినలేనివారిని, మాట్లాడలేనివారిని, లేదా ఈ రెండూ చేయలేనివారిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అవయవాలు దెబ్బతిన్నవారిని.’ గ్రీకు పదం κυλλούς చేతులు లేదా కాళ్లు సరిగా పనిచేయని, వంకరగా ఉన్న, లేదా దెబ్బతిన్నవారిని విస్తృతంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: ఆయన దగ్గరకు వచ్చాయి
  rationale: προσέρχομαι ఇక్కడ ‘దగ్గరకు రావడం’ లేదా ‘సమీపించడం’ అనే భావాన్ని ఇస్తుంది. కథనంలో సహజంగా వినిపించే ‘దగ్గరకు వచ్చాయి’ను ఎంచుకున్నాం.
- source_word: ὄχλοι πολλοὶ
  choice: అనేక జనసమూహాలు
  rationale: మూలంలో ‘జనసమూహాలు’ బహువచనంలో ఉంది; ‘అనేక’ అనే మాట వాటి సంఖ్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: తమతోపాటు ... తీసుకొచ్చి
  rationale: అక్షరార్థంగా ‘తమతో కలిగి’ అయినా, సందర్భంలో బాధితులను వెంట తీసుకురావడమే భావం. తెలుగులో క్రియాశీలంగా, సహజంగా వ్యక్తం చేశాం.
- source_word: κωφούς
  choice: మాట్లాడలేనివారిని
  rationale: κωφός చెవిటితనాన్ని, మూగతనాన్ని, లేదా రెండింటినీ సూచించగలదు. ప్రధాన పాఠ్యంలో వ్యక్తిని గౌరవించే ఆధునిక ప్రయోగాన్ని వాడి, పదంలోని సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: τυφλούς
  choice: చూపులేనివారిని
  rationale: τυφλόςకు ఇది స్పష్టమైన, ఆధునిక, వ్యక్తి గౌరవాన్ని కాపాడే తెలుగు రూపం.
- source_word: χωλούς
  choice: కుంటివారిని
  rationale: χωλός నడకలో తీవ్రమైన ఇబ్బంది లేదా కుంటితనం ఉన్నవారిని సూచిస్తుంది. జాబితాలో సంక్షిప్తతను కాపాడేందుకు సుపరిచితమైన పదాన్ని వాడాం.
- source_word: κυλλούς
  choice: చేతులు కాళ్లు వైకల్యంతో ఉన్నవారిని
  rationale: κυλλός చేతులు లేదా కాళ్లు దెబ్బతిన్న, వంకరైన, లేదా సరిగా పనిచేయని స్థితిని విస్తృతంగా సూచిస్తుంది. అవమానకరంగా వినిపించగల సంక్షిప్త నామపదానికి బదులు వివరణాత్మకమైన, గౌరవప్రదమైన రూపాన్ని ఎంచుకున్నాం.
- source_word: ἑτέρους πολλούς
  choice: ఇంకా అనేకమందిని
  rationale: జాబితాలో పేర్కొనని మరెందరో బాధితులను సహజంగా సూచిస్తుంది.
- source_word: ἔρριψαν
  choice: ఉంచారు
  rationale: ῥίπτωకు అక్షరార్థంగా ‘విసిరారు’ అనే భావం ఉండగలిగినా, ఈ సందర్భంలో యేసు పాదాల దగ్గరికి వారిని తీసుకువచ్చి ఉంచడమే ఉద్దేశం; అనవసరమైన కాఠిన్యాన్ని కలిగించకుండా సందర్భార్థాన్ని ఇచ్చాం.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: ఆయన పాదాల దగ్గర
  rationale: παρά + accusative ఇక్కడ ఆయన పాదాల పక్కన లేదా సమీపంలో ఉంచడాన్ని సూచిస్తుంది; తెలుగు కథనానికి సహజమైన రూపం.
- source_word: ἐθεράπευσεν αὐτούς
  choice: ఆయన వారిని స్వస్థపరిచాడు
  rationale: సువార్తలలో θεραπεύω సూచించే స్వస్థత కలిగించే కార్యానికి ‘స్వస్థపరిచాడు’ సుపరిచితమైన, సముచితమైన రూపం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని అనుసరించాం. వైకల్యాలను సూచించే చోట సాధ్యమైనంతవరకు వ్యక్తి-కేంద్రిత పదబంధాలను వాడాం; అయితే మూలంలోని సంక్షిప్త జాబితా స్వరూపాన్ని కూడా కాపాడాం. మూలపాఠంలోని κωφούς, κυλλούς పదాల విస్తృత అర్థపరిధిని పాదసూచికల్లో నిలిపాం.
