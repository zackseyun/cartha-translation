id: MAT.15.18
reference: Matthew 15:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: te
  text: అయితే నోటి నుండి బయటికి వచ్చేవి హృదయం నుండి వస్తాయి; అవే మనిషిని అపవిత్రం చేస్తాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అశుద్ధం చేస్తాయి’ అని కూడా అనువదించవచ్చు. గ్రీకులో ‘మనిషి’ అనే పదం ఏకవచనంలో ఉన్నప్పటికీ, సాధారణంగా ఏ మనిషినైనా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ... ἐκπορευόμενα
  choice: బయటికి వచ్చేవి
  rationale: నపుంసక బహువచన కృదంతం నామవాచకంగా వాడబడింది. ‘బయటికి వచ్చేవి’ అనే రూపం బహువచన భావాన్నీ, నోటి నుండి వెలువడే వాటి దృశ్యాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: στόματος
  choice: నోటి
  rationale: మాటకు సంబంధించిన శరీర రూపకాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: καρδίας
  choice: హృదయంలో
  rationale: ఇక్కడ ‘హృదయం’ అంతరంగాన్ని—ఆలోచనలు, ఉద్దేశాలు, నైతిక స్వభావాన్ని—సూచిస్తుంది. మూలంలోని ముఖ్యమైన బైబిలీయ రూపకాన్ని అలాగే ఉంచుతుంది.
- source_word: ἐξέρχεται
  choice: వస్తాయి
  rationale: గ్రీకులో నపుంసక బహువచన కర్తతో క్రియ ఏకవచనంలో ఉన్నప్పటికీ భావం సమూహార్థకమైనది. తెలుగులో ‘వస్తాయి’ వ్యాకరణపరంగా సహజంగా ఉండి, హృదయం మూలమని స్పష్టం చేస్తుంది.
- source_word: κἀκεῖνα
  choice: అవే
  rationale: ‘మరియు అవి’ అనే సూచనార్థాన్ని సంక్షిప్తంగా తెలియజేస్తూ, నోటి నుండి వచ్చేవాటినే ప్రత్యేకంగా తిరిగి సూచిస్తుంది.
- source_word: κοινοῖ
  choice: అపవిత్రం చేస్తాయి
  rationale: శుద్ధి–అశుద్ధి సందర్భంలో κοινόω ఒకరిని అపవిత్రునిగా లేదా అశుద్ధునిగా చేయడాన్ని సూచిస్తుంది. ‘అపవిత్రం చేస్తాయి’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, సందర్భంలోని నైతిక మరియు శుద్ధి సంబంధిత ఉద్వేగాన్ని నిలుపుతుంది.
- source_word: ἄνθρωπον
  choice: మనిషిని
  rationale: మూలంలోని ఏకవచన సాధారణ ప్రతినిధి ప్రయోగాన్ని ‘మనిషిని’ సహజంగా నిలుపుతుంది; తెలుగులో ఇది సందర్భానుసారం స్త్రీపురుషులందరికీ వర్తించే సాధారణ మానవ సూచనగా అర్థమవుతుంది.
theological_decisions:
- issue: నైతిక అపవిత్రతకు అంతరంగమే మూలం
  choice: నోటి నుండి వెలువడేవి హృదయం నుండి వస్తాయని, అవే మనిషిని అపవిత్రం చేస్తాయని అనువదించబడింది.
  alternative: ఈ వాక్యాన్ని కేవలం మాటల వల్ల కలిగే ఆచారపరమైన అశుద్ధతకు మాత్రమే పరిమితం చేయడం.
  rationale: సమీప సందర్భం బయటి నుండి ప్రవేశించే ఆహారాన్ని, లోపలి నుండి వెలువడేదానితో వ్యత్యాసపరుస్తుంది. ‘హృదయం’ మరియు ‘అపవిత్రం’ అనే పదాలు ఆచారపరమైన నేపథ్యాన్ని చెరపకుండా, అంతరంగ నైతిక మూలాన్ని కూడా నిలుపుతాయి.
- issue: ἄνθρωπον యొక్క సాధారణ ప్రతినిధి ఏకవచనం
  choice: మనిషిని
  alternative: వ్యక్తిని
  rationale: ‘మనిషిని’ మూలంలోని ఏకవచనాన్ని మరియు మానవజాతికి సాధారణంగా వర్తించే భావాన్ని సహజ తెలుగులో నిలుపుతుంది. దీనిని పురుషునికే పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘నోటి నుండి… హృదయంలో నుండి’ అనే సమాంతర నిర్మాణం మూలంలోని శరీర రూపకాన్నీ, మూలం–వెలువడటం అనే వ్యత్యాసాన్నీ నిలుపుతుంది.
