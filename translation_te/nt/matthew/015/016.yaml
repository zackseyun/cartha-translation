  text: ὁ ⸀δὲ εἶπεν· Ἀκμὴν καὶ ὑμεῖς ἀσύνετοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/016.yaml
  text: But he said[a], “Are you also still without understanding?”
translation:
  language: te
  text: అయితే ఆయన, “మీరు కూడా ఇంకా అవగాహనలేనివారేనా?” అని అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: శిష్యుల ప్రశ్నకు యేసు ఇచ్చిన జవాబులోని స్వల్ప ప్రతిస్పందనాత్మక మలుపును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ … εἶπεν
  choice: ఆయన … అని అన్నాడు
  rationale: ὁ ఇక్కడ యేసును సూచించే సర్వనామార్థక ఆర్టికల్; εἶπεν సాధారణ కథన క్రియ. తెలుగులో స్పష్టత కోసం ‘ఆయన’ను ఉపయోగించి, ప్రత్యక్ష వాక్యానికి సహజమైన ‘అని అన్నాడు’ నిర్మాణాన్ని ఎంచుకున్నాం.
- source_word: Ἀκμὴν
  choice: ఇంకా
  rationale: ఇప్పటివరకు కూడా కొనసాగుతున్న స్థితిని సూచించే ‘still/even now’ భావాన్ని ప్రశ్నలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ ὑμεῖς
  choice: మీరు కూడా
  rationale: శిష్యులు సైతం అవగాహనలేమిలో ఉన్నారనే నొక్కిచెప్పే భావాన్ని నిలుపుతుంది.
- source_word: ἀσύνετοί ἐστε
  choice: గ్రహించలేకపోతున్నారా
  rationale: సందర్భంలో ఇది నైతిక మూర్ఖత్వం కంటే బోధను అర్థం చేసుకోలేని స్థితిని సూచిస్తుంది. ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉండి, కొనసాగుతున్న అవగాహనలేమిని తెలియజేస్తుంది.
theological_decisions:
- issue: శిష్యులపట్ల యేసు గద్దింపు స్వరం
  choice: ‘మీరు కూడా ఇంకా గ్రహించలేకపోతున్నారా?’ అనే సూటియైన ప్రశ్నగా అనువదించాం.
  alternative: ‘మీరు కూడా ఇంకా అవివేకులేనా?’
  rationale: మూలంలోని గద్దింపును నిలుపుతూ, ἀσύνετοι పదాన్ని సందర్భానికి మించిన నైతిక ఖండనగా లేదా తీవ్రమైన అవమానంగా మార్చకుండా బోధను గ్రహించని స్థితిగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అదే సమయంలో గౌరవప్రదమైన కథన శైలిని పాటించాం. మూలంలోని ప్రశ్నార్థక గద్దింపు మరియు ‘ఇంకా/కూడా’ అనే రెండు భావబలాలను నిలిపాం.
