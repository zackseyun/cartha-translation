id: MAT.15.22
reference: Matthew 15:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: te
  text: ఇదిగో, ఆ ప్రాంతాల నుండి బయటకు వచ్చిన ఒక కనానీయురాలు, “ప్రభువా, దావీదు కుమారుడా, నన్ను కరుణించు! నా కుమార్తె దయ్యం చేత తీవ్రంగా పీడించబడుతోంది[a]” అని కేకలు వేస్తూనే ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా కుమార్తెకు దయ్యం పట్టి ఆమె తీవ్రంగా బాధపడుతోంది” లేదా “దయ్యం ఆమెను తీవ్రంగా బాధిస్తోంది.”
    reason: δαιμονίζεται దయ్యపు ప్రభావం లేదా దయ్యం చేత కలిగే బాధను సూచిస్తుంది. ఆ స్థితి యొక్క ఖచ్చిత స్వరూపాన్ని గ్రీకు క్రియ మరింతగా నిర్వచించదు.
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో పాఠకుని దృష్టిని అకస్మాత్తుగా ఆకర్షించే గ్రీకు సంభాషణ సూచకపు సజీవతను నిలుపుతుంది.
- source_word: Χαναναία
  choice: కనానీయ
  rationale: మత్తయి ప్రత్యేకంగా ఉపయోగించిన జాతి గుర్తింపును, దానితో ముడిపడిన ఇశ్రాయేలు చారిత్రక నేపథ్యాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: ఆ ప్రాంతాల నుంచి
  rationale: ὅρια యొక్క భూభాగాలు లేదా సరిహద్దు ప్రాంతాలు అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో, బహువచనాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: ἐξελθοῦσα
  choice: బయటకు వచ్చిన
  rationale: అయోరిస్ట్ కృదంతాన్ని తెలుగు కథనానికి సహజమైన విశేషణీయ రూపంలో అందిస్తుంది.
- source_word: ἔκραζεν
  choice: కేకలు వేస్తూనే ఉంది
  rationale: ఇంపర్ఫెక్ట్ క్రియలోని కొనసాగుతున్న లేదా పదేపదే జరుగుతున్న చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἐλέησόν με
  choice: నన్ను కరుణించు
  rationale: విన్నపంలోని అత్యవసరతను, అలాగే కరుణకు సంబంధించిన బైబిలు పదజాలాన్ని సహజంగా నిలుపుతుంది.
- source_word: κύριε
  choice: ప్రభువా
  rationale: ‘దావీదు కుమారుడా’ అనే మెస్సీయ సంబంధిత సంబోధనతో కలిసి ఉన్న గౌరవభరితమైన అర్థాన్ని నిలుపుతుంది.
- source_word: υἱὸς Δαυίδ
  choice: దావీదు కుమారుడా
  rationale: రాజవంశీయమైన, మెస్సీయ సంబంధిత బిరుదును నేరుగా నిలుపుతుంది.
- source_word: κακῶς δαιμονίζεται
  choice: దయ్యం పట్టి, ఆమె తీవ్రంగా బాధపడుతోంది
  rationale: దయ్యపు ప్రభావాన్ని స్పష్టంగా పేర్కొంటూనే κακῶς సూచించే తీవ్రమైన దుస్థితిని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; గ్రీకు క్రియ సూచించే స్థితిని అతిగా నిర్దిష్టీకరించదు.
theological_decisions:
- issue: మెస్సీయ సంబంధిత సంబోధనలో κύριε అనువాదం
  choice: ప్రభువా
  alternative: అయ్యా / యజమానీ
  rationale: ‘దావీదు కుమారుడా’ అనే సంబోధన వల్ల ఇది కేవలం మర్యాదపూర్వకమైన ‘అయ్యా’ కంటే ఎక్కువ గౌరవార్థాన్ని కలిగి ఉండవచ్చు. అయితే స్త్రీ చేసిన క్రీస్తు సంబంధిత అవగాహనను అవసరానికి మించి నిర్ధారించకుండా ‘ప్రభువా’ ఆ సాధ్యమైన భావాన్ని నిలుపుతుంది.
- issue: δαιμονίζεται సూచించే దయ్యపు ప్రభావం యొక్క స్వభావం
  choice: దయ్యం పట్టి, ఆమె తీవ్రంగా బాధపడుతోంది
  alternative: దయ్యం ఆమెను తీవ్రంగా పీడిస్తోంది / ఆమె దయ్యం ఆధీనంలో ఉంది
  rationale: వాక్యం దయ్యపు కార్యాన్ని స్పష్టంగా పేర్కొంటుంది; అయితే ఆ స్థితి యొక్క ఖచ్చిత స్వరూపాన్ని గ్రీకు క్రియ పూర్తిగా నిర్వచించదు. అందువల్ల ప్రధాన పాఠ్యంలో సాధారణ తెలుగు వాడుకను ఉంచి, ప్రత్యామ్నాయ భావవ్యక్తీకరణను పాదటిప్పణిలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ ద్వారా మత్తయి కథనంలోని దృష్టి ఆకర్షణ నిలుపబడింది; ‘కేకలు వేస్తూనే ఉంది’ ద్వారా కొనసాగుతున్న చర్య స్పష్టమైంది. సంబోధనల్లో తెలుగు వ్యాకరణానికి అనుగుణంగా ‘ప్రభువా,’ ‘కుమారుడా’ రూపాలు వాడబడ్డాయి.
