review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the attention marker, Matthew’s designation “Canaanite,” the regional origin, the ongoing force of ἔκραζεν, and the messianic address “Lord, Son of David.” Its rendering “దయ్యం పట్టి, ఆమె తీవ్రంగా బాధపడుతోంది” is understandable, but it splits δαιμονίζεται into a colloquial possession expression plus a separate suffering clause. A single expression for severe demonic affliction more directly reflects κακῶς δαιμονίζεται while leaving its precise phenomenology open.
  naturalness: The narrative is generally natural modern standard Telugu. “కనానీయురాలు” is a more idiomatic feminine personal designation than “కనానీయ స్త్రీ,” and “కేకలు వేస్తూనే ఉంది” effectively conveys repeated or continued crying out.
  terminology: “ప్రభువా” and “దావీదు కుమారుడా” appropriately preserve the elevated and potentially messianic force of κύριε and υἱὸς Δαυίδ without imposing a fuller doctrinal conclusion. “దయ్యం చేత తీవ్రంగా పీడించబడుతోంది” retains explicit demonic agency but does not require the more specific interpretation implied by “దయ్యం పట్టి.”
  issues:
  - severity: low
    issue: The main-text wording for κακῶς δαιμονίζεται is unnecessarily divided into two clauses.
    rationale: “దయ్యం పట్టి, ఆమె తీవ్రంగా బాధపడుతోంది” can suggest that possession and suffering are two separately asserted conditions. The Greek presents one severe state of demonic affliction; a unified Telugu rendering is clearer and less interpretively specific.
  - severity: low
    issue: “కనానీయ స్త్రీ” is slightly less idiomatic than a feminine noun form.
    rationale: “కనానీయురాలు” is natural modern Telugu and retains Matthew’s explicit ethnic and gender identification.
