  text: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Φράσον ἡμῖν τὴν παραβολὴν ⸀ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/015.yaml
  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: te
  text: 'అయితే పేతురు సమాధానంగా ఆయనతో ఇలా అన్నాడు: “ఈ ఉపమానాన్ని మాకు వివరించండి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ ఉపమానాన్ని మాకు చెప్పండి”; లేదా “ఈ ఉపమానాన్ని మాకు స్పష్టం చేయండి.”
    reason: φράζω అనే క్రియకు ‘తెలియజేయు,’ ‘వివరించు,’ ‘స్పష్టం చేయు’ అనే భావాలు సాధ్యమైనందున పదార్థంలోని విస్తృతిని చూపించడానికి.
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: అయితే పేతురు ఆయనతో … అన్నాడు
  rationale: గ్రీకు భాషలోని ‘జవాబిచ్చి చెప్పాడు’ అనే కథన ప్రయోగాన్ని పదేపదే అనువదిస్తే ఆధునిక తెలుగులో కృత్రిమంగా ఉంటుంది. ‘అయితే’ δέ సూచించే స్వల్ప వ్యత్యాసాన్ని లేదా కథన మలుపును నిలుపుతుంది; ‘ఆయనతో … అన్నాడు’ సమాధానంగా పలికిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Φράσον
  choice: వివరించండి
  rationale: φράζω ఇక్కడ ఒక రూపకాలంకారపు మాట అర్థమయ్యేలా తెలియజేయడం లేదా స్పష్టం చేయడం అనే భావాన్ని ఇస్తుంది. ‘వివరించండి’ ఆ అభ్యర్థనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఇతర సాధ్యమైన అర్థాలను పాదసూచికలో ఉంచాం.
- source_word: ἡμῖν
  choice: మాకు
  rationale: వివరణను పొందేవారిని సూచించే దత్తి సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: τὴν παραβολὴν ταύτην
  choice: ఈ ఉపమానాన్ని
  rationale: παραβολήకు సువార్తలలో స్థిరంగా వాడే ‘ఉపమానం’ సరిపోతుంది. ταύτην వెంటనే ముందున్న మాటను సూచిస్తున్నందున ‘ఈ’ అని అనువదించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. యేసును ఉద్దేశించిన ఆజ్ఞారూపాన్ని గౌరవార్థక బహువచనంగా ‘వివరించండి’ అని ఇచ్చాం.
