id: MAT.15.5
reference: Matthew 15:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: te
  text: 'కాని మీరు ఇలా అంటారు: “ఎవరైనా తన తండ్రికైనా తల్లికైనా, ‘నా నుండి నీకు కలిగే ప్రయోజనం కానుక[a]’ అని చెబితే,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అర్పణ.” తల్లిదండ్రుల పోషణకు ఉపయోగపడగలదాన్ని దేవునికి అంకితం చేసినదిగా ప్రకటించడం ఇక్కడి భావం. “కొర్బాను” అనే పదం వాడిన మార్కు 7:11తో పోల్చండి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: కాని మీరు ఇలా అంటారు
  rationale: δὲ ముందున్న దేవుని ఆజ్ఞతో వ్యత్యాసాన్ని సూచిస్తుంది; λέγετε సాధారణ వర్తమాన భావాన్ని ఇస్తుంది. ‘ఇలా’ తరువాతి ఉక్తిని సహజంగా పరిచయం చేస్తుంది.
- source_word: Ὃς ἂν εἴπῃ
  choice: ఎవరైనా ... చెబితే
  rationale: సాపేక్ష సర్వనామం, ἄν, అనిర్దిష్ట భూతకాల సంభావనార్థక క్రియ కలిసి సాధారణ అనిర్దిష్ట షరతును వ్యక్తం చేస్తాయి; తెలుగులో ‘ఎవరైనా ... చెబితే’ సహజంగా అదే భావాన్ని ఇస్తుంది.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: తన తండ్రితో గాని తల్లితో గాని
  rationale: దత్తివిభక్తి మాట చెప్పబడే వ్యక్తులను సూచిస్తుంది. ‘తన’ సంబంధాన్ని స్పష్టం చేస్తుంది; ‘గాని ... గాని’ ἢ లోని ప్రత్యామ్నాయ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: Δῶρον
  choice: దేవునికి అర్పించిన కానుక
  rationale: δῶρον యొక్క మౌలిక అర్థం ‘కానుక’; ఈ సందర్భంలో అది దేవునికి అంకితం చేసినదని సూచిస్తుంది. తెలుగు పాఠకుడికి ఉద్దేశిత భావం అర్థమయ్యేలా ‘దేవునికి అర్పించిన’ అని స్పష్టం చేసి, [a]లో మరింత వివరణ ఇచ్చాం.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: నా నుండి నీకు అందవలసిన సహాయం
  rationale: ఈ వాక్యభాగం తల్లిదండ్రికి ఆ వ్యక్తి నుండి లభించగల ప్రయోజనం లేదా సహాయాన్ని సూచిస్తుంది. గ్రీకు నిష్క్రియారూప భావాన్ని పదేపదే అనుకరించకుండా, ‘నా నుండి’ అనే మూలదిశను కాపాడుతూ సహజ తెలుగులో అందించబడింది.
theological_decisions:
- issue: మత్తయి వాక్యంలో మార్కు 7:11లోని సాంకేతిక పదమైన ‘కొర్బాను’ను చేర్చాలా?
  choice: మత్తయి వాడిన δῶρονను ‘కానుక’గా ఉంచి, దాని దేవార్పిత భావాన్ని వివరించడం
  alternative: ‘కొర్బాను’ అని ప్రధాన పాఠంలో చేర్చడం
  rationale: మత్తయి δῶρον అనే పదాన్ని వాడుతున్నాడు; మార్కులో ఉన్న κορβᾶνను ఇక్కడికి దిగుమతి చేయడం మూలపాఠ భేదాన్ని చెరిపివేస్తుంది. కాబట్టి ‘కానుక’ను ఉంచి సందర్భార్థాన్ని పాదటిప్పణిలో వివరిస్తాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర కామా ఉంచబడింది; ఉద్ధరణల పొరలు స్పష్టంగా గుర్తించబడ్డాయి.
