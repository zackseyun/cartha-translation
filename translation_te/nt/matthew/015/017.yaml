id: MAT.15.17
reference: Matthew 15:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: te
  text: నోటిలోకి వెళ్లేదంతా కడుపులోకి వెళ్లి, ఆ తర్వాత మరుగుదొడ్డిలోకి విసర్జించబడుతుందని మీకు అర్థం కావడం లేదా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నోటిలోకి వెళ్లేది ఏదైనా ... మలవిసర్జన స్థలంలోకి వెళ్లిపోతుంది.”
    reason: ἀφεδρών మరియు ἐκβάλλεται పదబంధానికి సాధ్యమైన మరొక సహజ తెలుగు రూపం.
lexical_decisions:
- source_word: νοεῖτε
  choice: అర్థం కావడం
  rationale: ఇక్కడ ఈ క్రియ యేసు చెప్పిన విషయాన్ని మనసుతో గ్రహించడాన్ని సూచిస్తుంది. ప్రశ్నారూపంలోని మందలింపుకు ఆధునిక తెలుగులో ఈ ప్రయోగం సహజంగా ఉంటుంది.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: వెళ్లేదంతా
  rationale: ఈ నపుంసకలింగ ఏకవచన కృదంత నిర్మాణం నోటిలోకి వెళ్లే దేనినైనా సాధారణంగా సూచిస్తుంది; ‘అంతా’ దాని సమగ్ర పరిధిని నిలుపుతుంది.
- source_word: εἰς τὸ στόμα
  choice: నోటిలోకి
  rationale: εἰς లోపలికి జరిగే గమనాన్ని సూచిస్తుంది; ‘నోటిలోకి’ మూలంలోని భౌతిక చిత్రణను నేరుగా అందిస్తుంది.
- source_word: κοιλίαν
  choice: కడుపు
  rationale: సందర్భం జీర్ణక్రియకు సంబంధించినది కాబట్టి κοιλία ఇక్కడ కడుపును సూచిస్తుంది; ఇది సాధారణ ఆధునిక తెలుగు పదం.
- source_word: χωρεῖ
  choice: వెళ్లి
  rationale: ఈ జీర్ణక్రియా సందర్భంలో ఆహారం కడుపులోకి చేరడాన్ని సూచిస్తుంది. పునరుక్తి ఉన్నప్పటికీ మూలంలోని εἰσπορευόμενον/χωρεῖ గమనాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀφεδρῶνα
  choice: మరుగుదొడ్డి
  rationale: ఈ పదం విసర్జన జరిగే మరుగు ప్రదేశాన్ని సూచిస్తుంది. ‘మరుగుదొడ్డి’ ఆధునిక పాఠకులకు స్పష్టంగా, మర్యాదగా ఉంటుంది.
- source_word: ἐκβάλλεται
  choice: విసర్జించబడుతుంది
  rationale: నిష్క్రియారూపాన్ని నిలుపుతూ శరీరం నుంచి బయటకు పంపబడే ప్రక్రియను మర్యాదగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు మాటకు ఆచారపరమైన శుద్ధి నియమాలతో ఉన్న సంబంధం
  choice: జీర్ణక్రియకు సంబంధించిన వాక్యాన్ని ఉన్నదున్నట్లుగా అనువదించి, ఆహారాలన్నీ శుద్ధమైనవని ప్రకటించే వివరణను ఈ వచనంలో చేర్చలేదు.
  alternative: అన్ని ఆహారాలూ దీనివల్ల శుద్ధమైనవిగా ప్రకటించబడ్డాయని స్పష్టంగా తెలిపే వ్యాఖ్యానాత్మక విస్తరణను చేర్చడం.
  rationale: ఈ వచనం మనిషిని నిజంగా అపవిత్రం చేసేది ఏమిటనే యేసు వాదనకు శారీరక ప్రక్రియ ద్వారా ఆధారం ఇస్తుంది; అయితే మార్కు 7:19లో ఉన్న వ్యాఖ్యను మత్తయి వచనం స్పష్టంగా చేర్చదు. అందువల్ల మూలంలోని ఉద్వేగాన్ని, పరిమితిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, శరీర విసర్జన అంశాన్ని అసభ్యంగా కాకుండా స్పష్టంగా చెప్పే గౌరవప్రదమైన శైలి ఉపయోగించబడింది.
