  naturalness: ‘నోటిలోకి వెళ్లేదంతా కడుపులోకి వెళ్లి, ఆ తర్వాత మరుగుదొడ్డిలోకి విసర్జించబడుతుందని మీకు అర్థం కావడం లేదా?’ అనేది ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా, సహజంగా ఉంది. శరీర విసర్జన విషయాన్ని అసభ్యంగా చేయకుండా మూలంలోని సూటితనాన్ని నిలుపుతుంది.
