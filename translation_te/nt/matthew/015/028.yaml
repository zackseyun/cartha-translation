    issue: The main text renders ἀπὸ τῆς ὥρας ἐκείνης as “ఆ క్షణం నుంచే.”
    rationale: Although immediate healing is clearly implied by the narrative, the Greek says literally “from that hour,” idiomatically “from that time.” “క్షణం” specifically means a moment and slightly over-specifies the duration/precision. Use “ఆ సమయం నుంచే,” while preserving the literal wording in the footnote.
