id: MAT.15.28
reference: Matthew 15:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: te
  text: అప్పుడు యేసు ఆమెతో, “అమ్మా, నీ విశ్వాసం[a] గొప్పది! నీవు కోరుకున్నట్టే నీకు జరుగుగాక” అని అన్నాడు. ఆ సమయం నుంచే[b] ఆమె కుమార్తె స్వస్థపడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమ్మకం.” గ్రీకు πίστις అనే పదానికి సందర్భానుసారం విశ్వాసం, నమ్మకం, లేదా నమ్మకత్వం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: పదశః, “ఆ గంట నుంచే.” ఇక్కడ అది “ఆ సమయం నుంచే” అనే భావాన్ని ఇస్తుంది.
    reason: literal_rendering
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: ముందటి సంభాషణకు యేసు జవాబును అనుసంధానించే సహజమైన కాలసూచక పదం.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτῇ
  choice: యేసు ఆమెతో ... అని అన్నాడు
  rationale: గ్రీకు కథనంలో ఈ కృదంతం, తరువాతి మాటల క్రియ కలిసి ఒకే పలుకుబడి పరిచయంగా పనిచేస్తాయి; తెలుగులో అనవసరమైన క్రియాపునరుక్తి లేకుండా αὐτῇ భావాన్ని కూడా నిలుపుతుంది.
- source_word: Ὦ γύναι
  choice: అమ్మా
  rationale: స్త్రీని నేరుగా, గౌరవంగా సంబోధించే గ్రీకు ప్రయోగానికి ఆధునిక తెలుగులో సహజమైన సమానం. ‘ఓ స్త్రీ’ పదశః దగ్గరగా ఉన్నా తెలుగులో కఠినంగా, అసహజంగా వినిపిస్తుంది.
- source_word: μεγάλη σου ἡ πίστις
  choice: నీ విశ్వాసం గొప్పది
  rationale: ముందుంచబడిన μεγάλη ఇచ్చే ప్రశంసాత్మక ఉద్ఘాటనను సహజమైన తెలుగు పదక్రమంతో, ఆశ్చర్యార్థక చిహ్నంతో వ్యక్తం చేస్తుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో యేసుపై ఆమె ఉంచిన నమ్మకంతో కూడిన ఆధారపడటాన్ని సూచిస్తుంది; ‘విశ్వాసం’ ప్రధాన అనువాదంగా సరిపోతుంది, ‘నమ్మకం’ భావఛాయను పాదసూచికలో ఉంచాం.
- source_word: γενηθήτω σοι
  choice: నీకు జరుగుగాక
  rationale: γίνομαι యొక్క ఆజ్ఞార్థక భావాన్ని, యేసు పలికిన కార్యసాధక ప్రకటన స్వరాన్ని నిలుపుతుంది.
- source_word: ὡς θέλεις
  choice: నీవు కోరుకున్నట్టే
  rationale: θέλω లోని కోరుకోవడం లేదా అభిలషించడం అనే భావాన్ని ప్రస్తుత సందర్భంలో సహజంగా తెలుపుతుంది.
- source_word: ἰάθη
  choice: స్వస్థపడింది
  rationale: ἰάομαι యొక్క భూతకాల కర్మణి భావాన్ని తెలుగులో సహజమైన ఆరోగ్యపునరుద్ధరణ క్రియతో వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: ఆ క్షణం నుంచే
  rationale: గ్రీకు పదశః ‘ఆ గంట నుంచి’ అన్నప్పటికీ, సందర్భంలో తక్షణ స్వస్థతను సూచించే కాలప్రయోగం; ‘ఆ క్షణం నుంచే’ ఆధునిక తెలుగులో ఉద్దేశాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: యేసు ప్రశంసలో πίστις అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం; నమ్మకత్వం
  rationale: సందర్భం ఆ స్త్రీ యేసును నమ్మి ఆయనపై ఆధారపడిన విజ్ఞప్తిని ప్రశంసిస్తోంది; దీర్ఘకాల నమ్మకత్వం ప్రధాన భావం కాదు. అయినా ‘నమ్మకం’ అనే సహజ భావఛాయను పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘అమ్మా’ అనేది γύναιకి ఈ సందర్భంలో గౌరవసూచక సంబోధన; బంధుత్వార్థాన్ని ఉద్దేశించడం లేదు. ఆశ్చర్యార్థక చిహ్నం యేసు ప్రశంసలోని ఉద్ఘాటనను తెలియజేస్తుంది.
