id: MAT.15.36
reference: Matthew 15:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: te
  text: ఆయన ఏడు రొట్టెలను, చేపలను తీసుకొని, కృతజ్ఞతలు చెల్లించిన తర్వాత రొట్టెలను విరిచి శిష్యులకు ఇస్తూ వచ్చాడు; శిష్యులు జనసమూహాలకు పంచుతూ వచ్చారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: తీసుకొని
  rationale: ఆహారాన్ని పంచే ముందు యేసు దానిని చేతిలోకి తీసుకున్న చర్యను సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: ఆ ఏడు రొట్టెలను
  rationale: ἄρτος ఇక్కడ లెక్కించదగిన రొట్టెలను సూచిస్తుంది; నిర్దిష్టతను చూపేందుకు గ్రీకు నిర్దేశక పదాన్ని ‘ఆ’తో వ్యక్తం చేశాం.
- source_word: τοὺς ἰχθύας
  choice: చేపలను
  rationale: బహువచనాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: εὐχαριστήσας
  choice: కృతజ్ఞతలు చెల్లించిన తర్వాత
  rationale: కర్మను గ్రీకు పాఠం స్పష్టంగా చెప్పనందున ‘దేవునికి’ అని చేర్చకుండా, ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔκλασεν
  choice: వాటిని విరిచి
  rationale: సందర్భంలో రొట్టెలను విరిచినట్టు అర్థమవుతుంది; తెలుగు వాక్యప్రవాహం కోసం అంతర్నిహిత కర్మను ‘వాటిని’గా ఇచ్చాం.
- source_word: ἐδίδου
  choice: ఇస్తూ వచ్చాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న లేదా పునరావృత పంపిణీ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: τοῖς μαθηταῖς
  choice: శిష్యులకు
  rationale: దత్తివిభక్తిలోని గ్రహీతలను తెలుగులో ‘కు’ విభక్తితో వ్యక్తం చేస్తుంది; గ్రీకులో లేని ‘తన’ను చేర్చలేదు.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: శిష్యులు జనసమూహాలకు ఇచ్చారు
  rationale: గ్రీకులో రెండవ ఉపవాక్యంలో క్రియ అధ్యాహారంగా ఉంది; తెలుగులో స్పష్టత, సహజత్వం కోసం ‘ఇచ్చారు’ను పూరించాం. ὄχλοι యొక్క బహువచనాన్ని ‘జనసమూహాలకు’గా నిలిపాం.
theological_decisions:
- issue: εὐχαριστήσαςలో సంభావ్య ప్రభుభోజన ప్రతిధ్వని
  choice: సాధారణ కథన చర్యగా ‘కృతజ్ఞతలు చెల్లించిన తర్వాత’ అని అనువదించడం
  alternative: ప్రభుభోజన సంబంధాన్ని ముందుకు తెచ్చే ఆరాధనాత్మక పదజాలం ఉపయోగించడం
  rationale: ఈ మాట ప్రభుభోజనంతో అనుబంధితమైన నమూనాను ప్రతిధ్వనింపజేయవచ్చు; అయినా ఈ వచనం ఆహారం మీద యేసు కృతజ్ఞతలు చెల్లించడాన్నే నేరుగా చెబుతుంది. గ్రీకులో లేని మతశాస్త్రీయ వివరణను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు కథనశైలిని పాటించాం. గ్రీకు పాఠంలోని కొనసాగుతున్న పంపిణీ భావాన్ని ‘ఇస్తూ వచ్చాడు’తో నిలిపి, అధ్యాహార క్రియను రెండవ ఉపవాక్యంలో సహజంగా పూరించాం.
