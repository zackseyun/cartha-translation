  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: te
  text: యేసు అక్కడి నుండి బయలుదేరి, గలిలయ సముద్రం వెంట[a] వచ్చాడు. ఆయన కొండ మీదికి ఎక్కి, అక్కడ కూర్చొని ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘గలిలయ సముద్రం ఒడ్డున.’ గ్రీకు విభక్త్యుపసర్గం ఒడ్డు వెంట కదలడాన్ని లేదా ఒడ్డు పక్కన ఉన్న స్థానాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అక్కడ కూర్చున్నాడు.’ గ్రీకు అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న స్థితిని సూచించగలదు; తెలుగులో దీనిని మరింత సరళంగానూ అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: అక్కడి నుండి బయలుదేరి
  rationale: అయోరిస్టు క్రియావిశేషణ రూపం ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది. తెలుగు కథన శైలిలో ‘బయలుదేరి’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: ἦλθεν
  choice: వచ్చాడు
  rationale: ἔρχομαι యొక్క సాధారణ కథన అయోరిస్టు రూపానికి సందర్భానుకూలమైన ప్రత్యక్ష తెలుగు సమానం.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: గలిలయ సముద్రం వెంట
  rationale: చలనాన్ని తెలిపే ἦλθενతో కలిసి, accusative παρά ఒడ్డుకు సమాంతరంగా లేదా దాని వెంట కదలడాన్ని సూచించగలదు. ‘వెంట’ ఈ చలన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: కొండ మీదికి ఎక్కి
  rationale: ἀναβαίνωతో εἰς τὸ ὄρος కొండపైకి ఎక్కడాన్ని సూచిస్తుంది. ‘మీదికి ఎక్కి’ గమ్యదిశను, ముందుగా జరిగిన చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκάθητο ἐκεῖ
  choice: అక్కడ కూర్చొని ఉన్నాడు
  rationale: κάθημαι యొక్క imperfect రూపం గతంలో కొనసాగుతున్న కూర్చున్న స్థితిని చిత్రిస్తుంది. ‘కూర్చొని ఉన్నాడు’ ఆ కొనసాగింపు భావాన్ని తెలుగులో నిలుపుతుంది.
