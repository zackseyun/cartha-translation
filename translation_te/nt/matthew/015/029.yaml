translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని వరుస చర్యలు మరియు చివరి క్రియలోని కొనసాగింపు భావం నిలుపబడ్డాయి; ‘సముద్రం వెంట’ అనే స్థాన–చలన సందిగ్ధతను పాదటిప్పణిలో స్పష్టం చేశాం.
