id: MAT.15.13
reference: Matthew 15:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: te
  text: 'అయితే ఆయన ప్రత్యుత్తరమిచ్చి ఇలా అన్నాడు: “నా పరలోకపు తండ్రి నాటని ప్రతి మొక్క వేళ్లతో సహా పెకలింపబడుతుంది.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ఇలా జవాబిచ్చాడు
  rationale: గ్రీకులోని రెండు క్రియలతో కూడిన కథన సూత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘అని జవాబిచ్చాడు’ అనే భావాన్ని ‘ఇలా’ మోస్తుంది.
- source_word: Πᾶσα
  choice: ప్రతి
  rationale: ఏకవచన నామవాచకంతో ఉన్న విభాజక భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: φυτεία
  choice: మొక్క
  rationale: ఈ పదానికి ‘నాటబడినది’ లేదా ‘నాటడం’ అనే భావాలు సాధ్యమైనా, తరువాతి ‘వేళ్లతో సహా పెకలించడం’ అనే చిత్రానికి ‘మొక్క’ సహజంగా సరిపోతుంది.
- source_word: ἐφύτευσεν
  choice: నాటని
  rationale: మూలంలోని వ్యవసాయ రూపకాన్ని అలాగే నిలుపుతూ, φυτείαతో ఉన్న పదసంబంధాన్ని కాపాడుతుంది.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: నా పరలోకపు తండ్రి
  rationale: ‘నా’ అనే సంబంధాన్నీ οὐράνιος అనే పరలోక సంబంధ విశేషణాన్నీ స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἐκριζωθήσεται
  choice: వేళ్లతో సహా పెకలింపబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్నీ, వేళ్లతో సహా తీసివేయడం అనే బలమైన వ్యవసాయ/తీర్పు చిత్రాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: ‘ప్రతి మొక్క’ అనే రూపకానికి సూచితార్థం
  choice: బోధలు, సంప్రదాయాలు లేదా వ్యక్తులు అని నిర్దిష్టీకరించకుండా ‘ప్రతి మొక్క’ అనే రూపకాన్నే ఉంచడం
  alternative: ప్రతి బోధ / ప్రతి సంప్రదాయం / తండ్రి నాటని ప్రతి వ్యక్తి
  rationale: గ్రీకు వాక్యం రూపకానికి సూచితార్థాన్ని స్పష్టంగా నిర్ణయించదు. వ్యాఖ్యానాన్ని అనువాదంలో చేర్చకుండా అసలైన ఉద్దేశపూర్వక విస్తృతతను నిలుపుతుంది.
translation_notes:
  register: సహజమైన, ప్రస్తుత ప్రామాణిక తెలుగు; గౌరవప్రదమైన బైబిలు శైలి. వ్యవసాయ రూపకం ప్రత్యక్షంగా నిలుపబడింది. అవసరం లేని పాదటిప్పణి చేర్చలేదు.
