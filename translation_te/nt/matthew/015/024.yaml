revisions:
- from: 'అయితే ఆయన ఇలా జవాబిచ్చాడు: “ఇశ్రాయేలు ఇంటివారిలో తప్పిపోయిన గొర్రెల దగ్గరకు తప్ప నేను పంపబడలేదు.”'
  to: 'అయితే ఆయన ఇలా జవాబిచ్చాడు: “ఇశ్రాయేలు ఇంటికి చెందిన తప్పిపోయిన గొర్రెల దగ్గరకు తప్ప నేను పంపబడలేదు.”'
  rationale: The revision corrects the attachment ambiguity in the phrase representing ‘the lost sheep of the house of Israel.’ It preserves the aorist passive (‘పంపబడలేదు’), the explicit exception and limitation (‘దగ్గరకు తప్ప’), and the sheep metaphor, without resolving the statement’s narrative-theological tension.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:05Z'
review_pass:
  verdict: revise
  source_fidelity: The restrictive Greek construction οὐκ ... εἰ μὴ is retained accurately by ‘... దగ్గరకు తప్ప నేను పంపబడలేదు.’ However, ‘ఇశ్రాయేలు ఇంటివారిలో తప్పిపోయిన గొర్రెలు’ makes the sheep sound as though they are lost among the members of Israel’s household, rather than identifying them as the lost sheep belonging to the house of Israel.
  naturalness: The sentence is clear and suitably formal in modern standard Telugu. Recasting the genitival relationship as ‘ఇశ్రాయేలు ఇంటికి చెందిన’ removes the syntactic ambiguity while remaining natural.
  terminology: ‘తప్పిపోయిన గొర్రెలు’ fittingly preserves the pastoral metaphor of ἀπολωλότα πρόβατα. ‘ఇశ్రాయేలు ఇల్లు’ is retained through the natural Telugu relational expression ‘ఇశ్రాయేలు ఇంటికి చెందిన’; this does not reduce the biblical corporate idiom to individual household members.
  issues:
  - severity: medium
    issue: Ambiguous rendering of οἴκου Ἰσραήλ
    rationale: '‘ఇశ్రాయేలు ఇంటివారిలో తప్పిపోయిన గొర్రెలు’ can mean ‘sheep lost among the people of Israel.’ The Greek instead modifies ‘sheep’: ‘the lost sheep of the house of Israel.’ ‘ఇశ్రాయేలు ఇంటికి చెందిన తప్పిపోయిన గొర్రెలు’ makes that relation explicit without adding interpretation.'
  revised_text: 'అయితే ఆయన ఇలా జవాబిచ్చాడు: “ఇశ్రాయేలు ఇంటికి చెందిన తప్పిపోయిన గొర్రెల దగ్గరకు తప్ప నేను పంపబడలేదు.”'
  revised_footnotes: []
  revision_rationale: The revision corrects the attachment ambiguity in the phrase representing ‘the lost sheep of the house of Israel.’ It preserves the aorist passive (‘పంపబడలేదు’), the explicit exception and limitation (‘దగ్గరకు తప్ప’), and the sheep metaphor, without resolving the statement’s narrative-theological tension.
