  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: te
  text: 'అయితే ఆయన ఇలా జవాబిచ్చాడు: “ఇశ్రాయేలు ఇంటికి చెందిన తప్పిపోయిన గొర్రెల దగ్గరకు తప్ప నేను పంపబడలేదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ఇలా జవాబిచ్చాడు
  rationale: గ్రీకులోని క్రియావిశేషక భాగం మరియు ప్రధాన క్రియను సహజమైన ఆధునిక తెలుగు వాక్యంగా కలిపి, సమాధాన భావాన్ని నిలిపింది.
- source_word: Οὐκ ἀπεστάλην
  choice: నేను పంపబడలేదు
  rationale: దైవిక నియోగాన్ని సూచించే గ్రీకు భూతకాల కర్మణి రూపాన్ని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: εἰ μὴ
  choice: దగ్గరకు తప్ప
  rationale: Οὐκ ... εἰ μὴ నిర్మాణంలోని స్పష్టమైన మినహాయింపు మరియు పరిమితిని తెలుగులో సహజంగా కాపాడుతుంది.
- source_word: πρόβατα
  choice: గొర్రెలు
  rationale: ప్రజలను సూచించే రూపకాన్ని వివరణాత్మకంగా మార్చకుండా యథాతథంగా నిలుపుతుంది.
- source_word: ἀπολωλότα
  choice: తప్పిపోయిన
  rationale: దారి తప్పిన గొర్రెల రూపకానికి సందర్భోచితమైన అర్థాన్ని ఇస్తుంది; అంతిమ నాశనమనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: οἴκου Ἰσραήλ
  choice: ఇశ్రాయేలు ఇంటివారు
  rationale: ‘ఇశ్రాయేలు ఇల్లు’ అనే సెమిటిక్ జాతీయ/ఒడంబడిక సంబంధిత నుడికారాన్ని ఆధునిక తెలుగులో అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి సందర్భానికి ప్రతిస్పందనగా వచ్చే స్వల్ప వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: ఈ మాటలో యేసు ప్రకటించిన పంపబడిన కార్యపరిధి
  choice: ‘దగ్గరకు తప్ప నేను పంపబడలేదు’ అని స్పష్టమైన పరిమితిగా అనువదించడం
  alternative: ఇశ్రాయేలుకు కేవలం ప్రాధాన్యం ఉందని సూచించేలా ‘ముఖ్యంగా’ లేదా ‘మొదటగా’ అని సడలించి అనువదించడం
  rationale: గ్రీకు Οὐκ ... εἰ μὴ నిర్మాణం స్పష్టమైన మినహాయింపు/పరిమితిని తెలియజేస్తుంది. తరువాతి అన్యజనుల పరిచర్యను ఈ వాక్యంలోకి ముందుగానే చేర్చి కథనంలోని ధార్మిక ఉద్రిక్తతను తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణం. గ్రీకు మినహాయింపు నిర్మాణాన్ని తెలుగులో సహజమైన ‘దగ్గరకు తప్ప ... పంపబడలేదు’ రూపంలో ఉంచినందున ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
