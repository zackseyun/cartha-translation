  naturalness: ‘గుడ్డివారికి గుడ్డి మార్గదర్శకులు’ అర్థవంతమైనదే అయినా, ఆధునిక ప్రామాణిక తెలుగులో ‘అంధులకు అంధ మార్గదర్శకులు’ మరింత సహజంగా, సంక్షిప్తంగా ఉంటుంది. ‘గుంటలో పడతారు’ కూడా ‘గోతిలో పడతారు’ కంటే విస్తృతంగా సహజమైన వినియోగం.
