id: MAT.15.14
reference: Matthew 15:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: te
  text: వారిని వదిలేయండి. వారు అంధులకు అంధ మార్గదర్శకులు.[a] ఒక అంధుడు మరొక అంధునికి దారి చూపిస్తే, ఇద్దరూ గుంటలో పడతారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో, “అంధులకు” అనే మాట లేదు.
    reason: textual_variant
  - marker: b
    text: “గుంట” అనే పదాన్ని “గొయ్యి” లేదా “గోతి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: వారిని వదిలేయండి
  rationale: ఇక్కడ ἀφίημι అంటే క్షమించడం కాదు, వారిని వారి మానాన వదిలివేయడం. ఆధునిక తెలుగులో ‘వదిలేయండి’ ఆ ఆజ్ఞలోని నిర్లిప్తతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τυφλοί
  choice: గుడ్డి / గుడ్డివారు
  rationale: ఆత్మీయ అవగాహనలేమిని సూచించే మూలపాఠంలోని రూపకాన్ని వివరణతో విస్తరించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: ὁδηγοὶ τυφλῶν
  choice: గుడ్డివారికి గుడ్డి మార్గదర్శకులు
  rationale: ὁδηγός యొక్క ‘మార్గదర్శకుడు’ అనే భావాన్ని నిలుపుతూ, గ్రీకు షష్ఠీ విభక్తికి సాధ్యమైన సహజ తెలుగు సంబంధాన్ని ఇస్తుంది. పాఠాంతర భేదం కారణంగా ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: τυφλὸς ... τυφλὸν
  choice: ఒక గుడ్డివాడు మరొక గుడ్డివాడికి
  rationale: గ్రీకులోని పుంలింగ ఏకవచన సామెతరూపాన్ని తెలుగులో సహజంగా, ప్రతినిధ్యార్థంతో నిలుపుతుంది.
- source_word: ἐὰν ὁδηγῇ
  choice: దారి చూపిస్తే
  rationale: సాధారణ షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తూ, మార్గనిర్దేశం అనే రూపకాన్ని కొనసాగిస్తుంది.
- source_word: ἀμφότεροι
  choice: ఇద్దరూ
  rationale: ఆ ఇద్దరినీ కలిపి సూచించే గ్రీకు పదానికి సంక్షిప్తమైన సహజ తెలుగు రూపం.
- source_word: εἰς βόθυνον
  choice: గోతిలో
  rationale: βόθυνος సూచించే గొయ్యి, గుంట లేదా గోతి అనే విస్తృత భావపరిధిలో ‘గోతి’ సామెత చిత్రాన్ని స్పష్టంగా నిలుపుతుంది; ప్రత్యామ్నాయాలు పాదసూచికలో ఉన్నాయి.
- source_word: πεσοῦνται
  choice: పడతారు
  rationale: షరతు నెరవేరితే సంభవించే భవిష్యత్ ఫలితాన్ని సహజమైన తెలుగు క్రియారూపంతో తెలుపుతుంది.
theological_decisions:
- issue: ‘గుడ్డి’ అనే రూపకపు భావం
  choice: ఆత్మీయ అవగాహనలేమిని సూచించే ‘గుడ్డి’ రూపకాన్ని ప్రధాన పాఠంలో వివరణ లేకుండా నిలుపడం
  alternative: ‘ఆత్మీయంగా గుడ్డివారు’ లేదా ‘అవివేకులైన నాయకులు’ అని స్పష్టీకరించడం
  rationale: మూలపాఠం ఉద్దేశపూర్వకంగా ఉపయోగించిన సజీవ రూపకాన్ని విప్పిచెప్పడం వ్యాఖ్యానాన్ని అనువాదంలోకి తెస్తుంది; అందువల్ల దాని వేదాంతపరమైన ఉద్వేగాన్ని నిలుపాం.
- issue: సామెతలో పుంలింగ ఏకవచనం
  choice: ‘ఒక గుడ్డివాడు ... మరొక గుడ్డివాడు’ అని అనువదించడం
  alternative: ‘ఒక గుడ్డి వ్యక్తి ... మరొక గుడ్డి వ్యక్తి’ లేదా బహువచన సాధారణీకరణ
  rationale: గ్రీకు పుంలింగ ఏకవచన సామెతరూపాన్ని తెలుగులో సహజంగా ప్రతిబింబిస్తుంది; ఇది సాధారణంగా వర్తించే మాట అనే అంశాన్ని ప్రత్యేక పాదసూచిక అవసరం లేకుండానే తెలుగు సామెత నిర్మాణం తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘వదిలేయండి’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి ఆజ్ఞ స్వరాన్ని నిలుపుతుంది. ‘మార్గదర్శకులు’ మరియు ‘దారి చూపిస్తే’ రూపక సంబంధాన్ని కాపాడుతాయి. SBLGNTలోని పాఠాంతర సూచనను ప్రధాన పాఠంలోని [a]తో నమోదు చేశాం; ప్రధాన పాఠం గుడ్డివారిని కూడా పేర్కొనే పఠనాన్ని అనుసరిస్తుంది.
