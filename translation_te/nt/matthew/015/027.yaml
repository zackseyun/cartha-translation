id: MAT.15.27
reference: Matthew 15:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: te
  text: అందుకు ఆమె, “అవును, ప్రభువా; ఎందుకంటే చిన్న కుక్కలు కూడా తమ యజమానుల బల్ల మీద నుంచి పడే తునకలను తింటాయి” అంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ναί
  choice: అవును
  rationale: స్త్రీ యేసు చెప్పిన మాటను అంగీకరిస్తూ ఇచ్చిన సూటి జవాబును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κύριε
  choice: ప్రభువా
  rationale: గౌరవపూర్వక సంబోధన అనే భావంతో పాటు యేసు అధికారాన్ని గుర్తించే సాధ్యతను కూడా నిలుపుతుంది; ‘అయ్యా’ అనే అర్థసాధ్యతను పాదసూచికలో తెలిపాం.
- source_word: καὶ γὰρ
  choice: ఎందుకంటే … కూడా
  rationale: γάρ లోని వివరణాత్మక కారణభావాన్ని ‘ఎందుకంటే’, καί లోని చేర్పు/ఉద్ఘాటన భావాన్ని ‘కూడా’ సహజంగా తెలియజేస్తాయి.
- source_word: κυνάρια
  choice: చిన్న కుక్కలు
  rationale: గ్రీకు పదంలోని అల్పార్థక రూపాన్ని నిలుపుతూ, సాధారణ కుక్కలకన్నా చిన్న లేదా ఇంటి కుక్కల చిత్రాన్ని సూచిస్తుంది; ‘కుక్కపిల్లలు’ అని వయస్సును అనవసరంగా నిర్దేశించదు.
- source_word: ἐσθίει
  choice: తింటాయి
  rationale: నపుంసక బహువచన కర్తతో గ్రీకులో క్రియ ఏకవచన రూపంలో ఉన్నా, తెలుగు వ్యాకరణానికి తగిన బహువచన క్రియను వాడాం.
- source_word: ψιχίων
  choice: ముక్కలను
  rationale: బల్ల మీద నుంచి పడే చిన్న ఆహారపు భాగాలను సహజంగా సూచిస్తుంది; ‘రొట్టె పొడి’ అని మూలంలో లేని నిర్దిష్టతను చేర్చదు.
- source_word: τῶν πιπτόντων
  choice: పడే
  rationale: వర్తమాన కృదంతంలోని సాధారణంగా లేదా కొనసాగుతూ జరిగే చర్య భావాన్ని సంక్షిప్తమైన తెలుగు విశేషణ రూపంలో నిలుపుతుంది.
- source_word: τραπέζης
  choice: బల్ల
  rationale: గృహ భోజన దృశ్యానికి సరిపోయే సాధారణ తెలుగు పదం.
- source_word: τῶν κυρίων αὐτῶν
  choice: తమ యజమానుల
  rationale: ఉపమానంలో కుక్కలకు సంబంధించిన మానవ యజమానులను సూచిస్తుంది; ఇక్కడ κύριος ను దైవ బిరుదుగా కాక యజమానత్వ సంబంధంగా అనువదించడం సందర్భోచితం.
theological_decisions:
- issue: యేసును ఉద్దేశించిన κύριε సంబోధన
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: మత్తయి సువార్తలో ఈ సంబోధన గౌరవార్థకంగా ఉండగలిగినా, యేసు అధికారాన్ని గుర్తించే లోతైన భావాన్నీ కలిగి ఉండవచ్చు. ‘ప్రభువా’ ఆ అర్థపరిధిని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- issue: κυνάρια లోని అల్పార్థక భావం
  choice: చిన్న కుక్కలు
  alternative: కుక్కలు; ఇంటి కుక్కలు; కుక్కపిల్లలు
  rationale: ఉపమానంలోని కఠినతను పెంచకుండా లేదా తొలగించకుండా, గ్రీకు రూపంలోని చిన్నదనం లేదా గృహసంబంధ సూచనను వీలైనంత నేరుగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. ‘తింటాయి కదా’ అనే రూపం స్త్రీ అంగీకరిస్తూనే తన వాదనను ముందుకు తీసుకెళ్లే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. రెండు పాదసూచిక గుర్తులూ అవి వివరించే పదాల వెంటనే ఉంచబడ్డాయి.
