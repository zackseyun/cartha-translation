revisions:
- from: అందుకు ఆమె, “అవును, ప్రభువా[b]. ఎందుకంటే తమ యజమానుల బల్ల మీద నుంచి పడే ముక్కలను చిన్న కుక్కలు[a] కూడా తింటాయి కదా” అంది.
  to: అందుకు ఆమె, “అవును, ప్రభువా; ఎందుకంటే చిన్న కుక్కలు కూడా తమ యజమానుల బల్ల మీద నుంచి పడే తునకలను తింటాయి” అంది.
  rationale: 'The revision replaces the overly broad “pieces” with “crumbs/small fragments” (తునకలు), retains every source element, and uses direct declarative syntax for the explanatory statement. Footnote anchors remain immediately after the terms they explain: ప్రభువా[b] and చిన్న కుక్కలు[a].'
  reviewer_model: gpt-5.6-terra
