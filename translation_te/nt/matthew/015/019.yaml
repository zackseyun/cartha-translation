id: MAT.15.19
reference: Matthew 15:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: te
  text: ఎందుకంటే హృదయం నుంచే దుష్ట ఆలోచనలు, హత్యలు, వ్యభిచారాలు, లైంగిక దుర్నీతులు, దొంగతనాలు, అబద్ధ సాక్ష్యాలు, దూషణలు[a] బయటకు వస్తాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దైవదూషణలు.” గ్రీకు పదం సందర్భాన్ని బట్టి మనుషులపై దూషణలను లేదా దేవునికి వ్యతిరేకమైన దూషణలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: ఎందుకంటే హృదయంలో నుంచే
  rationale: γάρ యొక్క వివరణాత్మక భావాన్ని ‘ఎందుకంటే’ తెలియజేస్తుంది; ἐκ మూలాన్ని సూచిస్తుంది. ‘హృదయం’ అనే బైబిలు రూపకాన్ని నిలుపుతూ, ‘నుంచే’ అంతరంగమే ఈ చెడులకు మూలమని సహజమైన తెలుగులో నొక్కిచెబుతుంది.
- source_word: ἐξέρχονται
  choice: బయటకు వస్తాయి
  rationale: ఈ క్రియలోని లోపలి మూలం నుంచి వెలువడే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: διαλογισμοὶ πονηροί
  choice: దుష్ట ఆలోచనలు
  rationale: διαλογισμοί ఆలోచనలు, తర్కాలు లేదా యోచనలను సూచించగలదు. సందర్భాన్ని అతిగా నిర్దిష్టం చేయకుండా దాని నైతిక భావాన్ని ‘దుష్ట ఆలోచనలు’ అందిస్తుంది.
- source_word: φόνοι
  choice: హత్యలు
  rationale: నైతికంగా తప్పైన ప్రాణహరణాలను నేరుగా సూచిస్తూ గ్రీకు బహువచనాన్ని నిలుపుతుంది.
- source_word: μοιχεῖαι
  choice: వ్యభిచారాలు
  rationale: వివాహబంధాన్ని ఉల్లంఘించే లైంగిక సంబంధాలను సూచించే పదానికి సాధారణ ఆధునిక తెలుగు సమానార్థకం; బహువచన జాబితా రూపాన్ని నిలుపుతుంది.
- source_word: πορνεῖαι
  choice: లైంగిక దుర్నీతులు
  rationale: అనుచితమైన లైంగిక ప్రవర్తనల విస్తృత పరిధిని సూచిస్తుంది; దీనిని ఒక్క నిర్దిష్ట చర్యకు పరిమితం చేయదు.
- source_word: κλοπαί
  choice: దొంగతనాలు
  rationale: దొంగిలించే క్రియలను సహజమైన తెలుగులో సంక్షిప్తంగా తెలియజేసి బహువచనాన్ని నిలుపుతుంది.
- source_word: ψευδομαρτυρίαι
  choice: అబద్ధ సాక్ష్యాలు
  rationale: అసత్యంగా సాక్ష్యం చెప్పే న్యాయపరమైన లేదా సాక్ష్య సంబంధమైన భావాన్ని నిలుపుతుంది.
- source_word: βλασφημίαι
  choice: దూషణలు
  rationale: ఈ పదం మనుషులపై అపనింద లేదా దేవునిపై దైవదూషణ అనే రెండు సందర్భార్థాలను పొందగలదు. సాధారణ దోషాల జాబితాలో ‘దూషణలు’ విస్తృతమైన అర్థాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
theological_decisions:
- issue: ఈ దోషాల జాబితాలో βλασφημίαι యొక్క పరిధి
  choice: దూషణలు
  alternative: దైవదూషణలు
  rationale: సందర్భం ప్రత్యేకంగా దేవునికి వ్యతిరేకమైన మాటలకే పరిమితం చేయదు. కాబట్టి మనుషులపై దూషణను కూడా చేర్చగల విస్తృత పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దేవునిపై దూషణ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో పరిరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన దోషాల జాబితా. గ్రీకు బహువచన రూపాలను సాధ్యమైనంతవరకు నిలిపి, హృదయం నుంచి చెడులు వెలువడే రూపకాన్ని స్పష్టంగా ఉంచాం.
