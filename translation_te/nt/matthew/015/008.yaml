source:
  edition: SBLGNT
  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: te
  text: “ఈ ప్రజలు తమ పెదవులతో నన్ను గౌరవిస్తారు; కానీ వారి హృదయం నాకు దూరంగా ఉంది.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి హృదయాలు నాకు దూరంగా ఉన్నాయి.” గ్రీకు పాఠంలో “హృదయం” ఏకవచనంలో ఉంది; అది ప్రజలందరినీ ఒక సమష్టిగా సూచిస్తున్నట్లు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: ఈ ప్రజలు
  rationale: λαός సమూహంగా ఉన్న ప్రజలను సూచిస్తుంది; οὗτος లోని నిర్దేశక భావాన్ని ‘ఈ’ నిలుపుతుంది. ఆధునిక తెలుగులో క్రియతో సహజ అన్వయం కోసం ‘ప్రజలు’ వాడబడింది.
- source_word: τοῖς χείλεσίν
  choice: తమ పెదవులతో
  rationale: ఇది సాధనార్థక చతుర్థీ విభక్తి. ‘పెదవులతో’ అనే రూపం శరీరాంగపు స్పష్టమైన రూపకాన్ని నిలుపుతుంది; ‘తమ’ అనేది ప్రజలనే తిరిగి సూచిస్తుంది.
- source_word: με
  choice: నన్ను
  rationale: τιμᾷ క్రియకు ప్రత్యక్ష కర్మ; సహజమైన తెలుగు రూపం.
- source_word: τιμᾷ
  choice: ఘనపరుస్తారు
  rationale: τιμάω ఇక్కడ గౌరవం చూపడాన్ని సూచిస్తుంది. ‘ఘనపరుస్తారు’ ఆరాధనా సందర్భానికి తగినదిగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంది; ‘మహిమపరుస్తారు’ కంటే మూలార్థాన్ని అతిశయింపజేయదు.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: కానీ వారి హృదయం
  rationale: δέ లోని వ్యతిరేక భావాన్ని ‘కానీ’ తెలియజేస్తుంది. ఏకవచన καρδίαను ‘హృదయం’గా ఉంచి, ప్రజల సమష్టి అంతరంగ వైఖరిని నిలుపుతుంది.
- source_word: πόρρω
  choice: దూరంగా
  rationale: πόρρω దూరాన్ని సూచిస్తుంది; ‘దూరంగా’ ఆధునిక తెలుగులో సహజమైన క్రియావిశేషణ రూపం.
- source_word: ἀπέχει ἀπ’ ἐμοῦ
  choice: నాకు దూరంగా ఉంది
  rationale: ἀπέχω ἀπό నిర్మాణం ఒకరి నుండి దూరంగా ఉండటాన్ని తెలుపుతుంది. తెలుగు వాడుకలో ‘నాకు దూరంగా ఉంది’ సంబంధపరమైన ఎడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సమష్టిని సూచించే ఏకవచన ‘హృదయం’ లేదా వ్యక్తులను సూచించే బహువచనం
  choice: ‘వారి హృదయం’ అనే ఏకవచనాన్ని నిలుపుట
  alternative: ‘వారి హృదయాలు’
  rationale: గ్రీకులో καρδία ఏకవచనంలో ఉంది; ఇది ప్రజలను ఒక సమష్టిగా చూపిస్తూ వారి ఉమ్మడి అంతరంగ వైఖరిని సూచించే అవకాశం ఉంది. ఏకవచనాన్ని నిలుపడం ప్రవచన ఉల్లేఖనంలోని అలంకార బలాన్ని కాపాడుతుంది; బహువచనం కూడా తెలుగులో సహజమైన పంపిణీ భావాన్ని ఇవ్వగలదని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. ‘పెదవులతో’ అనే మూల రూపకం, ‘హృదయం’ అనే సమష్టి ఏకవచనం నిలుపబడ్డాయి. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
