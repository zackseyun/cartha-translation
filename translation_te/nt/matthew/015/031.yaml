- from: దాంతో, మూగవారు[a] మాట్లాడడం, అవయవాలు దెబ్బతిన్నవారు బాగుపడడం[b], నడవలేనివారు నడవడం, చూపులేనివారు చూడడం చూసి జనసమూహం ఆశ్చర్యపోయింది. వారు ఇశ్రాయేలు దేవుణ్ణి మహిమపరిచారు.
