id: MAT.15.31
reference: Matthew 15:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: te
  text: దాంతో, మాట్లాడలేనివారు[a] మాట్లాడడం, అవయవ వైకల్యమున్నవారు స్వస్థులుగా ఉండడం[b], నడకలో వైకల్యమున్నవారు నడవడం, చూపులేనివారు చూడడం చూసి జనసమూహం ఆశ్చర్యపోయింది. వారు ఇశ్రాయేలు దేవుణ్ణి మహిమపరిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చెవిటివారు మాట్లాడడం.’ గ్రీకు పదం చెవిటివారినిగానీ మాట్లాడలేనివారినిగానీ సూచించవచ్చు; ఇక్కడ ‘మాట్లాడడం’ అనే సందర్భం వల్ల ‘మాట్లాడలేనివారు’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అవయవాలు దెబ్బతిన్నవారు స్వస్థులవడం’ / ‘అవయవ వైకల్యమున్నవారు ఆరోగ్యంగా ఉండడం.’ గ్రీకు పదబంధం దెబ్బతిన్న లేదా పనిచేయని అవయవాలున్నవారు స్వస్థమైన స్థితిలో ఉండటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: దాంతో
  rationale: ముందు జరిగిన స్వస్థతల ఫలితంగా జనసమూహం స్పందించినట్లు తెలిపే consecutive భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὄχλον
  choice: జనసమూహం
  rationale: కథన సందర్భానికి సరిపోయే, ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన సమూహవాచక పదం.
- source_word: θαυμάσαι
  choice: ఆశ్చర్యపోయింది
  rationale: చూసిన అద్భుతాల వల్ల కలిగిన విస్మయాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: βλέποντας
  choice: చూసి
  rationale: జనసమూహం ఆశ్చర్యపడటానికి ఆధారమైన ప్రత్యక్ష దర్శనాన్ని తెలుగులో సహజంగా కలుపుతుంది.
- source_word: κωφοὺς
  choice: మూగవారు
  rationale: κωφός అనే పదానికి చెవిటివారు లేదా మూగవారు అనే రెండు అర్థాలు ఉండగలవు; ఇక్కడ వెంటనే వచ్చే ‘మాట్లాడడం’ వల్ల మాటలాడలేనివారనే భావం సందర్భానికి బాగా సరిపోతుంది.
- source_word: λαλοῦντας
  choice: మాట్లాడడం
  rationale: λαλέω యొక్క ప్రత్యక్ష భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κυλλοὺς ὑγιεῖς
  choice: అవయవాలు దెబ్బతిన్నవారు బాగుపడడం
  rationale: κυλλός సూచించే దెబ్బతిన్న లేదా పనిచేయని అవయవాల స్థితినీ, ὑγιής సూచించే బాగైన స్థితినీ కలిపి స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: χωλοὺς περιπατοῦντας
  choice: నడవలేనివారు నడవడం
  rationale: నడకలో వైకల్యం ఉన్నవారు ఇప్పుడు నడుస్తున్నారనే అద్భుతపు వ్యత్యాసాన్ని స్పష్టమైన, గౌరవప్రదమైన భాషలో చూపుతుంది.
- source_word: τυφλοὺς βλέποντας
  choice: చూపులేనివారు చూడడం
  rationale: చూడలేనివారికి చూపు కలిగిన ఫలితాన్ని గ్రీకు వాక్యంలోని సమాంతర నిర్మాణానికి దగ్గరగా ఉంచుతుంది.
- source_word: ἐδόξασαν
  choice: మహిమపరిచారు
  rationale: దేవుని కార్యాలను చూసి ఆయనకు మహిమ ఆపాదించిన బలమైన ఆరాధనా స్పందనను నిలుపుతుంది.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: ఇశ్రాయేలు దేవుణ్ణి
  rationale: గ్రీకు నామవాచక సంబంధాన్ని సహజమైన తెలుగు రూపంలో నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: κωφοὺς λαλοῦντας అనే పదబంధంలో κωφός అర్థం
  choice: మూగవారు మాట్లాడడం
  alternative: చెవిటివారు మాట్లాడడం
  rationale: κωφός రెండు అర్థాలను అనుమతించినా, λαλοῦντας (‘మాట్లాడడం’) అనే వెంటనే వచ్చే క్రియారూపం మాటలాడే సామర్థ్యం పునరుద్ధరించబడిందనే భావాన్ని ప్రధానంగా సూచిస్తుంది. ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- issue: దేవునికి సంబంధించిన δοξάζω అనువాదం
  choice: ఇశ్రాయేలు దేవుణ్ణి మహిమపరిచారు
  alternative: ఇశ్రాయేలు దేవుణ్ణి స్తుతించారు / ఇశ్రాయేలు దేవునికి మహిమ చెల్లించారు
  rationale: అద్భుత కార్యాల దృష్ట్యా దేవునికి మహిమను ఆపాదించే స్పందనను ‘మహిమపరిచారు’ బలంగా, సంక్షిప్తంగా నిలుపుతుంది.
- issue: κυλλοὺς ὑγιεῖς లో స్వస్థత స్వభావం
  choice: అవయవాలు దెబ్బతిన్నవారు బాగుపడడం
  alternative: అంగవైకల్యమున్నవారు సంపూర్ణులవడం / ఛిన్నమైన అవయవాలున్నవారు పునరుద్ధరించబడడం
  rationale: ὑγιεῖς అనే విశేషణాన్ని అనవసరమైన సిద్ధాంతార్థంతో విస్తరించకుండా, ఆరోగ్యంగా లేదా బాగైన స్థితిలో ఉన్నారనే ఫలితాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని సమాంతర అద్భుతాల జాబితాను నిలుపుతూ, తెలుగులో భారంగా అనిపించకుండా చివరి ప్రధాన క్రియలతో వాక్యాన్ని విభజించాం. వైకల్యాన్ని సూచించే అవమానకరంగా వినిపించగల సంప్రదాయ పదాలకు బదులుగా వివరణాత్మక వ్యక్తి-కేంద్రిత రూపాలను ఎంచుకున్నాం.
