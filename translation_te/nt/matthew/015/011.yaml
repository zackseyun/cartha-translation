id: MAT.15.11
reference: Matthew 15:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: te
  text: నోటిలోకి వెళ్లేది మనిషిని అపవిత్రం చేయదు; అయితే నోటిలోనుండి బయటికి వచ్చేదే మనిషిని అపవిత్రం చేస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘మనిషి’ అనే మాట ఏ మానవునికైనా—స్త్రీకైనా పురుషునికైనా—వర్తించే సాధారణ అర్థంలో వాడబడింది.
    reason: cultural_note
lexical_decisions:
- source_word: κοινοῖ
  choice: అపవిత్రం చేస్తుంది
  rationale: పరిశుద్ధత–అపవిత్రత సందర్భంలో κοινόω ఒకరిని అపవిత్ర స్థితికి చేర్చడాన్ని సూచిస్తుంది. ‘అపవిత్రం చేయు’ అనే పదబంధం ఆచారపరమైన, నైతికమైన భావసూచనలను రెండింటినీ సంకుచితం చేయకుండా సహజంగా నిలుపుతుంది.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: నోటిలోకి వెళ్లేది
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతాన్ని ఆధునిక తెలుగులో సహజంగా ‘వెళ్లేది’ అని అందించి, εἰς సూచించే లోనికి వెళ్లే దిశను ‘నోటిలోకి’ ద్వారా నిలిపాం.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: నోటిలోనుండి బయటికి వచ్చేది
  rationale: ἐκπορευόμενον మరియు ἐκ తెలిపే బయటికి వచ్చే భావాన్ని స్పష్టంగా, సాధారణ పాఠకులకు సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἄνθρωπον
  choice: మనిషిని
  rationale: ἄνθρωπος ఇక్కడ ఏ మానవునికైనా వర్తించే ప్రతినిధి ఏకవచనంగా ఉంది. తెలుగు ‘మనిషి’ కూడా సందర్భంలో సాధారణ మానవార్థాన్ని సహజంగా ఇస్తుంది.
- source_word: τοῦτο
  choice: వచ్చేదే
  rationale: 'గ్రీకు నిర్దేశక సర్వనామం ఇచ్చే ఉద్ఘాటనను తెలుగు నిశ్చయార్థక ‘ఏ’ ద్వారా నిలిపాం: బయటికి వచ్చేదే అపవిత్రం చేస్తుంది.'
- source_word: οὐ ... ἀλλὰ
  choice: చేయదు; అయితే ... చేస్తుంది
  rationale: గ్రీకు వ్యతిరేక నిర్మాణాన్ని స్పష్టమైన, సహజమైన తెలుగు వైరుధ్య వాక్యనిర్మాణంతో అందిస్తుంది.
theological_decisions:
- issue: κοινόω లోని పవిత్రత–అపవిత్రత భాష
  choice: ‘అపవిత్రం చేయు’ అని అనువదించడం
  alternative: ‘అశుద్ధుణ్ణి చేయు’ లేదా ‘మైలపరచు’
  rationale: ఈ మాట ఆచారశుద్ధి వివాదానికి సంబంధించినదైనా, దాని నైతిక విస్తృతిని కూడా కలిగి ఉంది. ‘అపవిత్రం చేయు’ రెండు భావాలను నిలుపుతూ, కేవలం శారీరక మురికి లేదా ఒక్క ఆచారస్థితికే అర్థాన్ని పరిమితం చేయదు.
- issue: ἄνθρωπον యొక్క సాధారణ మానవార్థం
  choice: ప్రధాన పాఠ్యంలో ‘మనిషిని’ ఉంచి, దాని సమగ్ర వర్తింపును పాదసూచికలో తెలపడం
  alternative: ‘వ్యక్తిని’ లేదా ‘ఒకరిని’
  rationale: మూలంలోని ఏకవచన ప్రతినిధి రూపాన్ని ‘మనిషి’ సహజంగా ప్రతిబింబిస్తుంది; అదే సమయంలో ఇది కేవలం పురుషునికే పరిమితం కాదని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా పవిత్రతకు సంబంధించిన గంభీర భావాన్ని నిలుపుతూ అనువదించబడింది. రెండు భాగాల మధ్య వ్యతిరేకతను అర్ధవిరామం మరియు ‘అయితే’తో స్పష్టం చేశాం; τοῦτο యొక్క ఉద్ఘాటనను ‘వచ్చేదే’లోని ‘ఏ’ నిలుపుతుంది.
