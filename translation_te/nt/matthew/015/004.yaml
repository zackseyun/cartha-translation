id: MAT.15.4
reference: Matthew 15:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: te
  text: 'ఎందుకంటే దేవుడు ఇలా అన్నాడు: “నీ తండ్రిని, నీ తల్లిని ఘనపరచు”; అలాగే, “తండ్రినిగానీ తల్లినిగానీ దూషించేవాడు తప్పక మరణించాలి.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తండ్రినిగానీ తల్లినిగానీ శపించేవాడికి మరణశిక్ష విధించాలి.”
    reason: κακολογῶν అనే పదానికి ‘శపించు’ అనే బలమైన భావం ఉండవచ్చు; θανάτῳ τελευτάτω అనే న్యాయసూత్రాన్ని కార్యనిర్వాహక భావంతో ‘మరణశిక్ష విధించాలి’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: ὁ γὰρ θεὸς εἶπεν
  choice: ఎందుకంటే దేవుడు ఇలా అన్నాడు
  rationale: γάρ ముందున్న వాదనకు కారణాన్ని పరిచయం చేస్తుంది; εἶπεν యొక్క సాధారణ అర్థమైన ‘అన్నాడు’నే ఉంచి, ‘ఆజ్ఞాపించాడు’ అనే బలమైన భావాన్ని అదనంగా చేర్చలేదు.
- source_word: Τίμα
  choice: ఘనపరచు
  rationale: τιμάω ఇక్కడ తల్లిదండ్రులకు తగిన గౌరవం ఇవ్వాలనే ఆజ్ఞను సూచిస్తుంది. ‘ఘనపరచు’ ఆ నైతిక బరువును సహజమైన బైబిలు తెలుగులో నిలుపుతుంది.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: నీ తండ్రిని, నీ తల్లిని
  rationale: గ్రీకు వచనంలోని నిర్దిష్ట పదాలను, ఉటంకించబడిన ఆజ్ఞలో అంతర్లీనంగా ఉన్న రెండవ పురుష సంబంధాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: Ὁ κακολογῶν
  choice: దూషించేవాడు
  rationale: κακολογέω చెడుగా మాట్లాడడం, అవమానించడం, శపించడం అనే భావ పరిధిని కలిగి ఉంది. ‘దూషించు’ ఆధునిక తెలుగులో సంక్షిప్తంగా, గంభీరంగా ఆ పరిధిలోని ప్రధాన భావాన్ని తెలియజేస్తుంది.
- source_word: πατέρα ἢ μητέρα
  choice: తండ్రినిగానీ తల్లినిగానీ
  rationale: ἢ తెలిపే ప్రత్యామ్నాయ సంబంధాన్ని తెలుగు ‘గానీ…గానీ’ నిర్మాణం సహజంగా వ్యక్తపరుస్తుంది; మూలంలో లేని స్వామ్యసర్వనామాన్ని చేర్చలేదు.
- source_word: θανάτῳ τελευτάτω
  choice: తప్పక మరణించాలి
  rationale: ఇది గంభీరమైన మరణశిక్ష సూత్రం. ‘తప్పక మరణించాలి’ దాని నిశ్చితత్వం, తీవ్రతను నిలుపుతూ, గ్రీకులో స్పష్టంగా చెప్పని మానవ కార్యనిర్వాహకత్వాన్ని జోడించదు.
theological_decisions:
- issue: లేఖన ధర్మశాస్త్ర ఉటంకింపులోని మరణశిక్ష సూత్రం
  choice: తప్పక మరణించాలి
  alternative: మరణశిక్ష విధించాలి
  rationale: θανάτῳ τελευτάτω శిక్ష యొక్క తీవ్రతను, నిశ్చితత్వాన్ని తెలియజేస్తుంది; అయితే ఎవరు చంపుతారో వ్యాకరణపరంగా స్పష్టంగా చెప్పదు. అందువల్ల ప్రధాన పాఠం ఆ అస్పష్టతను నిలుపుతుంది; స్పష్టమైన కార్యనిర్వాహక భావాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖన ఉటంకింపుకు తగిన గంభీరతతో రూపొందించబడింది. ‘ఘనపరచు’, ‘దూషించు’ పదాలు సహజతతో పాటు ఆజ్ఞ యొక్క నైతిక బరువును నిలుపుతాయి.
