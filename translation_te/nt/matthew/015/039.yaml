reference: Matthew 15:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἐνέβη εἰς τὸ πλοῖον, καὶ ἦλθεν εἰς τὰ ὅρια ⸀Μαγαδάν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: te
  text: జనసమూహాలను పంపివేసిన తర్వాత ఆయన పడవ ఎక్కి మగదాను[a] ప్రాంతానికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘మగదాను’కు బదులుగా ‘మగ్దల’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: పంపివేసిన తర్వాత
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచించే భూతకాల అసమాపక క్రియారూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; జనసమూహాలను అక్కడి నుంచి పంపివేయడం అనే భావాన్ని అదనపు అర్థం లేకుండా నిలుపుతుంది.
- source_word: τοὺς ὄχλους
  choice: జనసమూహాలను
  rationale: గ్రీకు బహువచనాన్ని స్పష్టంగా నిలుపుతూ, సాధారణ ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యే పదం.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: పడవ ఎక్కి
  rationale: పడవలోకి ప్రవేశించి ప్రయాణం మొదలుపెట్టడాన్ని తెలుగులో సహజంగా చెప్పే సంక్షిప్త ప్రయోగం.
- source_word: ἦλθεν
  choice: వచ్చాడు
  rationale: ἔρχομαι క్రియ యొక్క సాధారణ దిశార్థాన్ని నిలుపుతుంది; ప్రయాణ కథనంలో లక్ష్యప్రాంతానికి చేరడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὰ ὅρια
  choice: ప్రాంతానికి
  rationale: అక్షరార్థంగా ‘సరిహద్దులు’ అయిన ఈ బహువచన రూపం ఇక్కడ భౌగోళిక ప్రాంతాన్ని సూచిస్తుంది; ‘ప్రాంతం’ ఆ ప్రయోగార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: Μαγαδάν
  choice: మగదాను
  rationale: SBLGNTలోని స్థలనామాన్ని అనువదించకుండా తెలుగులో ధ్వన్యనుకరణ చేసింది; ప్రత్యామ్నాయ పాఠాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: వచనం చివర ఉన్న స్థలనామపు పాఠభేదం
  choice: మగదాను
  alternative: మగ్దల
  rationale: ఇది సిద్ధాంత సంబంధమైనది కాక పాఠాంతర/స్థలనామ సంబంధమైన అంశం. ప్రధాన పాఠం అందించిన SBLGNTలో Μαγαδάν ఉన్నందున దానినే అనుసరించి, ప్రసిద్ధ ప్రత్యామ్నాయ పాఠాన్ని పాదసూచికలో పారదర్శకంగా తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు వాక్యంలోని చర్యల క్రమం నిలుపబడింది. పాఠభేద సూచికను అది సంబంధించిన ‘మగదాను’ స్థలనామం తర్వాత ఉంచడం బదులుగా, ప్రచురణ వాక్యాంత విరామానికి ముందు ఉంచబడింది.
