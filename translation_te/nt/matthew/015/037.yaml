id: MAT.15.37
reference: Matthew 15:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ⸂τὸ περισσεῦον τῶν κλασμάτων ἦραν⸃ ἑπτὰ σπυρίδας πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/037.yaml
  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: te
  text: అందరూ తిని తృప్తి చెందారు; మిగిలిన ముక్కలను ఏడు గంపల నిండుగా పోగుచేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ వాడిన గ్రీకు పదం (σπυρίς) కొన్ని ఇతర ఆహార పంపిణీ వృత్తాంతాల్లోని బుట్టలకంటే పెద్ద రకమైన గంపను సూచించవచ్చు. అందువల్ల, “మిగిలిన ముక్కలను ఏడు పెద్ద గంపల నిండుగా పోగుచేశారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: తిని
  rationale: ἐσθίω యొక్క భూతకాల రూపం ఇక్కడ సాధారణంగా ‘తిన్నారు’ అనే అర్థం ఇస్తుంది; తదుపరి క్రియతో సహజంగా కలపడానికి ‘తిని’ అని అనువదించాం.
- source_word: πάντες
  choice: అందరూ
  rationale: జనసమూహంలోని వారందరినీ మినహాయింపు లేకుండా సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἐχορτάσθησαν
  choice: తృప్తి చెందారు
  rationale: కడుపు నిండేంతగా తిని సంతృప్తి పొందారనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: మిగిలిన ముక్కలను
  rationale: మిగిలిపోయిన విరిగిన ఆహారపు ముక్కలను సూచిస్తుంది; తెలుగులో అనవసర పునరుక్తి లేకుండా సంక్షిప్తంగా ఇచ్చాం.
- source_word: ἦραν
  choice: పోగుచేసినప్పుడు
  rationale: αἴρω ఇక్కడ చెల్లాచెదురుగా మిగిలిన ముక్కలను ఎత్తి సమకూర్చడాన్ని సూచిస్తుంది; సందర్భానుసారంగా ‘పోగుచేశారు’ సహజంగా ఉంటుంది.
- source_word: ἑπτὰ σπυρίδας πλήρεις
  choice: ఏడు గంపలు నిండాయి
  rationale: ఏడు గంపలు పూర్తిగా నిండేంత ముక్కలు పోగయ్యాయని తెలుగులో సహజంగా తెలియజేస్తుంది; σπυρίς సూచించగల పెద్ద గంప భావాన్ని ‘గంప’ కొంతవరకు నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని సంఘటనల క్రమం, అందరూ తృప్తిగా తిన్నారనే భావం, మిగిలిన ముక్కల పరిమాణం నిలుపబడ్డాయి.
