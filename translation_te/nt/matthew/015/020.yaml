source:
  edition: SBLGNT
  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: te
  text: ఇవే మనిషిని[a] అపవిత్రం చేసేవి[b]. కాని కడగని చేతులతో తినడం మనిషిని అపవిత్రం చేయదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మనిషి’ ఇక్కడ ప్రతినిధి ఏకవచనం; ఇది సాధారణంగా ప్రతి మానవునికీ వర్తించే సత్యాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అశుద్ధునిగా చేసేవి.’ గ్రీకు క్రియ ఆచారపరంగా అశుద్ధునిగా చేయడాన్ని సూచించగలదు; ఇక్కడ ‘అపవిత్రం’ అనే పదం శుద్ధి–అశుద్ధి నేపథ్యాన్నీ, యేసు బోధలోని విస్తృతమైన నైతిక కలుషిత భావాన్నీ నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῦντα / κοινοῖ
  choice: అపవిత్రం చేసేవి / అపవిత్రం చేయదు
  rationale: శుద్ధి–అశుద్ధి సందర్భంలో ఈ పదం ఆచారపరమైన అపవిత్రతను సూచించగలదు; అదే సమయంలో యేసు బోధలోని విస్తృతమైన నైతిక కలుషిత భావాన్నీ మోస్తుంది. ‘అపవిత్రం చేయడం’ ఈ రెండు పార్శ్వాలను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἄνθρωπον
  choice: మనిషిని
  rationale: గ్రీకు మూలంలోని ఏకవచనం ఇక్కడ సాధారణంగా ప్రతి మానవునికీ వర్తించే ప్రతినిధి ఏకవచనం. ‘మనిషిని’ ఆ రూపాన్నీ సాధారణ సత్యాన్నీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀνίπτοις χερσὶν
  choice: కడుక్కోని చేతులతో
  rationale: చేతులు కడుక్కోకపోవడాన్ని నేరుగా, సహజంగా తెలుపుతూ, సందర్భంలోని ఆచారపరమైన చేతులు కడుక్కోవడం గురించిన వివాదాన్ని ప్రతిబింబిస్తుంది.
- source_word: φαγεῖν
  choice: తినడం
  rationale: గ్రీకు క్రియారూపాన్ని తెలుగులో సహజమైన క్రియానామ రూపంతో వ్యక్తపరుస్తుంది.
- source_word: ταῦτά ἐστιν τὰ
  choice: ఇవే … చేసేవి
  rationale: ‘ఇవే’ అనే ఉద్ఘాటనతో గ్రీకు నిర్దేశక నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: δέ
  choice: కాని
  rationale: నిజంగా అపవిత్రం చేసేవాటికీ, కడుక్కోని చేతులతో తినడానికీ మధ్య ఉన్న వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: శుద్ధి వివాదంలో κοινόω పదం యొక్క భావపరిధి
  choice: ‘అపవిత్రం చేయడం’ అని అనువదించడం
  alternative: ‘అశుద్ధునిగా చేయడం’
  rationale: తక్షణ సందర్భం ఆచారపరమైన శుద్ధికి సంబంధించినదైనా, యేసు వాదన మనిషిని లోపల నుంచి కలుషితం చేసే నైతిక విషయాల వరకూ విస్తరిస్తుంది. ‘అపవిత్రం చేయడం’ ఈ రెండింటినీ అనవసరంగా విడదీయకుండా నిలుపుతుంది.
- issue: ἄνθρωπον అనే ప్రతినిధి ఏకవచనం
  choice: ‘మనిషిని’ అని ఏకవచనంలో ఉంచడం
  alternative: ‘ఒక వ్యక్తిని’ లేదా ‘మనుషులను’
  rationale: మూలంలోని ఏకవచన రూపాన్ని కాపాడుతూ, ఇది పురుషునికి మాత్రమే కాక సాధారణంగా మానవునికి వర్తించే సత్యమని పాదసూచిక ద్వారా స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఇవే’ మూలంలోని ఉద్ఘాటనను, ‘కాని’ స్పష్టమైన వ్యత్యాసాన్ని నిలుపుతాయి. ‘కడుక్కోని చేతులతో’ సాధారణ పాఠకులకు సహజంగా ఉండి ఆచారపరమైన సందర్భాన్ని అతిగా వివరణ చేయకుండా సూచిస్తుంది.
