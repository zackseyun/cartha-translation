  text: Καὶ ἐξελθὼν ἐκεῖθεν ὁ Ἰησοῦς ἀνεχώρησεν εἰς τὰ μέρη Τύρου καὶ Σιδῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: te
  text: యేసు అక్కడి నుండి బయలుదేరి, తూరు, సీదోను ప్రాంతాలకు వెళ్లిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తూరు, సీదోను ప్రాంతాలకు దూరంగా వెళ్లాడు.” గ్రీకు క్రియను సాధారణంగా “వెళ్లిపోయాడు” అని అనువదించవచ్చు; అయితే మత్తయి ఈ క్రియను పదేపదే వాడే తీరు ఉద్దేశపూర్వకంగా దూరంగా వెళ్లిన భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: '[ప్రత్యేకంగా అనువదించలేదు]'
  rationale: తెలుగులో వాక్యారంభంలో ‘మరియు’ అనడం సహజంగా ఉండదు; ముందటి కథనంతో సంబంధం వాక్యక్రమం ద్వారానే స్పష్టమవుతుంది.
- source_word: ἐξελθὼν
  choice: బయలుదేరి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన కదలికను సహజమైన తెలుగు పూర్వకాలిక క్రియారూపంతో తెలియజేస్తుంది.
- source_word: ἐκεῖθεν
  choice: అక్కడి నుండి
  rationale: మునుపటి ప్రదేశం నుండి బయలుదేరడాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνεχώρησεν
  choice: వెళ్లిపోయాడు
  rationale: దూరంగా వెళ్లడం లేదా వెనుదిరిగి వెళ్లడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది; కారణాన్ని మాత్రం చేర్చదు. మత్తయి వాడుకలోని ‘విరమించి వెళ్లడం’ అనే ఛాయను పాదటిప్పణి సూచిస్తుంది.
- source_word: εἰς τὰ μέρη
  choice: ప్రాంతాలకు
  rationale: ఆ పట్టణాల పరిసర ప్రాంతాల వైపు కదలికను సూచిస్తుంది; తప్పనిసరిగా పట్టణాల్లోకే ప్రవేశించాడని చెప్పదు.
- source_word: Τύρου καὶ Σιδῶνος
  choice: తూరు సీదోను
  rationale: గ్రీకు స్థలనామాలకు ప్రాచుర్యంలో ఉన్న తెలుగు రూపాలను ఉపయోగించి, రెండింటికి సంబంధించిన ప్రాంతాలను సూచిస్తుంది.
theological_decisions:
- issue: అన్యజనులతో సంబంధమున్న ప్రాంతం వైపు యేసు వెళ్లడంలోని కథన ఛాయ
  choice: ‘వెళ్లిపోయాడు’ అని అనువదించి, ఉద్దేశాన్ని స్పష్టీకరించకుండా ఉంచడం.
  alternative: ‘వెనుదిరిగి వెళ్లాడు’ లేదా ‘విరమించి వెళ్లాడు’ అని అనువదించడం.
  rationale: ἀνεχώρησεν అనే పదం ఉద్దేశపూర్వకంగా దూరంగా వెళ్లిన భావాన్ని కలిగి ఉండవచ్చు; అయితే ఎందుకు వెళ్లాడో వాక్యం చెప్పదు. అందువల్ల సాధ్యమైన ఛాయను పాదటిప్పణిలో ఉంచి, ప్రధాన పాఠ్యంలో కారణాన్ని దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ప్రాంతాలకు’ అనే బహువచనం గ్రీకు τὰ μέρηను ప్రతిబింబిస్తూ తూరు, సీదోను పరిసర భూభాగాన్ని సూచిస్తుంది.
