id: MAT.15.34
reference: Matthew 15:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πόσους ἄρτους ἔχετε; οἱ δὲ εἶπαν· Ἑπτά, καὶ ὀλίγα ἰχθύδια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/034.yaml
  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: te
  text: యేసు వారితో, “మీ దగ్గర ఎన్ని రొట్టెలు ఉన్నాయి?” అని అడిగాడు. వారు, “ఏడు; ఇంకా కొన్ని చిన్న చేపలు ఉన్నాయి” అని చెప్పారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: అడిగాడు
  rationale: గ్రీకులో అక్షరార్థంగా ‘చెబుతున్నాడు’ అనే చారిత్రక వర్తమానం ఉన్నా, వెంటనే వచ్చే ప్రశ్న కారణంగా ఆధునిక తెలుగు కథనంలో ‘అడిగాడు’ సహజంగా ఉండి సంభాషణ ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Πόσους ἄρτους
  choice: ఎన్ని రొట్టెలు
  rationale: ἄρτους లెక్కించగల రొట్టెలను సూచిస్తుంది; ‘ఎన్ని రొట్టెలు’ సహజమైన తెలుగు సమానార్థకం.
- source_word: ἔχετε
  choice: మీ దగ్గర ... ఉన్నాయి
  rationale: స్వాధీనాన్ని తెలిపే గ్రీకు వర్తమాన ప్రశ్నకు ఆధునిక తెలుగులో ఇది సహజమైన రూపం.
- source_word: οἱ δὲ εἶπαν
  choice: వారు ... అని చెప్పారు
  rationale: δέ ఇక్కడ బలమైన విరోధం కంటే కథన కొనసాగింపును సూచిస్తుంది; అందువల్ల ‘కాని’ చేర్చకుండా సహజంగా అనువదించబడింది.
- source_word: Ἑπτά
  choice: ఏడు
  rationale: సంఖ్యకు నేర అనువాదం; ముందున్న ‘రొట్టెలు’ సందర్భం వల్ల దానిని మళ్లీ చెప్పాల్సిన అవసరం లేదు.
- source_word: ὀλίγα
  choice: కొన్ని
  rationale: అనిర్దిష్టమైన కొద్ది సంఖ్యను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἰχθύδια
  choice: చిన్న చేపలు
  rationale: గ్రీకు లఘుత్వ రూపంలోని చిన్న పరిమాణ సూచనను తెలుగులో స్పష్టంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు చారిత్రక వర్తమానాన్ని సహజ తెలుగు భూతకాలంగా మార్చి, ప్రశ్నార్థక క్రియను సందర్భానుసారం ‘అడిగాడు’గా వ్యక్తం చేశాం. ‘చిన్న చేపలు’ అని మూలంలోని లఘుత్వ భావాన్ని ప్రధాన పాఠ్యంలోనే నిలిపినందున పాదసూచిక అవసరం లేదు.
