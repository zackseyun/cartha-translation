id: MAT.15.23
reference: Matthew 15:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: te
  text: కాని ఆయన ఆమెకు ఒక్క మాట కూడా జవాబివ్వలేదు. అప్పుడు ఆయన శిష్యులు ఆయన దగ్గరికి వచ్చి, “ఆమెను పంపివేయండి[a]; ఆమె మన వెనుక కేకలు వేస్తోంది[b]” అని ఆయనను అడుగుతూనే ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: శిష్యులు, ‘ఆమె కోరిక తీర్చి పంపివేయండి’ అని ఉద్దేశించారా, లేక కేవలం ‘ఆమెను ఇక్కడి నుంచి పంపివేయండి’ అని ఉద్దేశించారా అనేది గ్రీకు మాట స్పష్టం చేయదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “మన వెంట.” గ్రీకు మాట ‘మన వెనుక’ అనే స్థానాన్ని గానీ, ‘మన వెంట’ అనే వెంబడింపును గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῇ λόγον
  choice: ఆమెకు ఒక్క మాట కూడా జవాబివ్వలేదు
  rationale: గ్రీకు నుడికారంలోని సంపూర్ణ మౌనాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: προσελθόντες
  choice: ఆయన దగ్గరికి వచ్చి
  rationale: శిష్యులు యేసు వద్దకు రావడాన్ని సహజమైన కథన శైలిలో తెలియజేస్తుంది.
- source_word: ἠρώτουν
  choice: అడుగుతూనే ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగిన లేదా పదేపదే చేసిన అభ్యర్థనను చూపుతుంది; ‘వేడుకున్నారు’ అని అనువదించి మూలపద బలాన్ని అతిశయింపజేయదు.
- source_word: Ἀπόλυσον αὐτήν
  choice: ఆమెను పంపివేయండి
  rationale: ఆమె కోరిక తీర్చి పంపమన్నారా, లేక కేవలం అక్కడి నుంచి పంపేయమన్నారా అనే విషయాన్ని నిర్ణయించకుండా ἀπολύω యొక్క సందర్భోచిత అర్థాన్ని నిలుపుతుంది.
- source_word: κράζει
  choice: కేకలు వేస్తోంది
  rationale: κράζω సూచించే బిగ్గరగా మొరపెట్టుకోవడం లేదా పిలవడం అనే తీవ్రతను వర్తమాన కొనసాగింపు రూపంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὄπισθεν ἡμῶν
  choice: మన వెనుక
  rationale: స్థానార్థమైన ‘వెనుక’ అనే నేర అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ‘మన వెంట’ అనే వెంబడింపు భావాన్ని పాదటిప్పణిలో సంరక్షిస్తుంది.
theological_decisions:
- issue: Ἀπόλυσον αὐτήνలో శిష్యుల ఉద్దేశం
  choice: ‘ఆమెను పంపివేయండి’ అని తటస్థంగా అనువదించడం
  alternative: ‘ఆమె కోరిక తీర్చి పంపండి’ లేదా ‘ఆమెను మా దగ్గరనుంచి వెళ్లగొట్టండి’ అని ఉద్దేశాన్ని నిర్దిష్టం చేయడం
  rationale: గ్రీకు ఆజ్ఞ ఆమెను ఏ విధంగా పంపాలో స్పష్టం చేయదు. అందువల్ల శిష్యుల ఉద్దేశం గురించిన కథన ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. యేసును ఉద్దేశించిన ఆజ్ఞకు మర్యాదార్థక బహువచన రూపం ఉపయోగించబడింది. పాదటిప్పణి గుర్తులు వాటికి సంబంధించిన పదబంధాల వెంటనే ఉంచబడ్డాయి.
