id: MAT.15.7
reference: Matthew 15:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: te
  text: 'కపటులారా, యెషయా మీ గురించి సరిగ్గానే ప్రవచించాడు, ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριταί
  choice: వేషధారులారా
  rationale: బహువచన సంబోధనను, యేసు పలికిన తీవ్రమైన నైతిక-ఆధ్యాత్మిక గద్దింపును సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: καλῶς
  choice: సరిగ్గానే
  rationale: యెషయా ప్రవచనం వీరికి తగినదిగా, సత్యంగా వర్తించిందనే భావాన్ని తెలియజేస్తుంది; ‘బాగానే’ కంటే ఇక్కడ స్పష్టంగా ఉంటుంది.
- source_word: ἐπροφήτευσεν
  choice: ప్రవచిస్తూ ... అన్నాడు
  rationale: గ్రీకు భూతకాల క్రియతో పాటు ఉల్లేఖనాన్ని పరిచయం చేసే λέγων భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో కలిపి, ప్రవక్తగా పలికిన భావాన్ని కాపాడుతుంది.
- source_word: περὶ ὑμῶν
  choice: మీ గురించి
  rationale: περί + షష్ఠీ విభక్తి యొక్క ‘గురించి/సంబంధించి’ అనే సాధారణ అర్థాన్ని నేరుగా అందిస్తుంది.
- source_word: Ἠσαΐας
  choice: యెషయా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ప్రవక్త పేరు రూపం.
- source_word: λέγων
  choice: 'ఇలా అన్నాడు:'
  rationale: తదుపరి ఉల్లేఖనాన్ని పరిచయం చేసే వర్తమాన కృదంతపు కార్యాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యేసు చేసిన ప్రత్యక్ష సంబోధనలోని గద్దింపు తీవ్రత
  choice: వేషధారులారా
  alternative: కపటులారా
  rationale: ὑποκριταί ఇక్కడ బలమైన నైతిక-మతపరమైన నింద. ‘వేషధారులు’ అనే పదం బయటకు భక్తిగా కనిపిస్తూ లోపల భిన్నంగా ఉండే సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది; గద్దింపును మృదువుచేయదు.
- issue: καλῶς యొక్క భావం
  choice: సరిగ్గానే
  alternative: బాగానే
  rationale: యెషయా పలికినది ఈ శ్రోతలకు తగినట్లుగా నిజంగా వర్తిస్తుందనే తీర్పును వ్యక్తపరుస్తుంది; కేవలం పలికిన తీరు బాగుందని సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ప్రత్యక్ష గద్దింపు. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు కాపాడుతూ, తెలుగు ఉల్లేఖన పరిచయానికి సహజమైన పదక్రమం వాడబడింది.
