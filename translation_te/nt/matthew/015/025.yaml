  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλθοῦσα ⸀προσεκύνει αὐτῷ λέγουσα· Κύριε, βοήθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/025.yaml
  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: te
  text: అయితే ఆమె వచ్చి ఆయన ముందు మోకరించి[a], “ప్రభువా, నాకు సహాయం చేయండి” అని వేడుకుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను ఆరాధించి.” గ్రీకు క్రియ సందర్భానుసారం గౌరవంతో వంగడం, సాష్టాంగపడడం లేదా ఆరాధించడం అనే అర్థాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి సంభాషణకు భిన్నంగా ఆమె పట్టుదలతో ముందుకు వచ్చిన మృదువైన వ్యతిరేక మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: ἐλθοῦσα
  choice: ఆమె వచ్చి
  rationale: భూతకాల కృదంతాన్ని సహజమైన తెలుగు సంయుక్త క్రియగా అందించి, ఆమె యేసు దగ్గరకు వచ్చిన కదలికను నిలుపుతుంది.
- source_word: προσεκύνει αὐτῷ
  choice: ఆయన ముందు మోకరించి
  rationale: ఈ క్రియ సూచించగల శారీరక వినయాన్ని, గౌరవాన్ని తెలియజేస్తూ, అది ఆరాధనే అని ప్రధాన పాఠ్యంలో ముందుగానే నిర్ణయించదు.
- source_word: λέγουσα
  choice: అని వేడుకుంది
  rationale: నేరుగా చెప్పిన మాటను సహజ తెలుగులో కలుపుతుంది; సందర్భంలోని అత్యవసర విన్నప స్వభావాన్ని కూడా వ్యక్తం చేస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును ఉద్దేశించిన గౌరవభరితమైన, బరువైన సంబోధనను నిలుపుతుంది.
- source_word: βοήθει μοι
  choice: నాకు సహాయం చేయండి
  rationale: అత్యవసరమైన ఆజ్ఞార్థక విన్నపాన్ని సాధారణ ఆధునిక తెలుగులో నేరుగా అందిస్తుంది; గౌరవార్థక క్రియారూపం సంబోధనకు తగినది.
theological_decisions:
- issue: యేసు పట్ల προσκυνέω క్రియను అనువదించడం
  choice: ఆయన ముందు మోకరించి
  alternative: ఆయనను ఆరాధించి
  rationale: గ్రీకు క్రియ సందర్భానుసారం సాష్టాంగపడడం, గౌరవం అర్పించడం లేదా ఆరాధించడం అనే అర్థాలను ఇవ్వగలదు. ప్రధాన పాఠ్యం కనిపించే శారీరక వినయక్రియను తెలియజేస్తుంది; ‘ఆరాధించి’ అనే సముచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి theological ambiguityని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన శైలి. ‘మోకరించి’ సాధారణ పాఠకులకు అర్థమయ్యేలా శారీరక వినయాన్ని స్పష్టంగా చూపుతుంది; గౌరవార్థక ‘చేయండి’ యేసును ఉద్దేశించిన సంబోధనకు తగినది.
