revisions:
- from: అప్పుడు శిష్యులు ఆయన దగ్గరికి వచ్చి, “పరిసయ్యులు ఈ మాట విని అభ్యంతరపడ్డారని[a] మీకు తెలుసా?” అని ఆయనను అడిగారు.[b]
  to: 'అప్పుడు శిష్యులు ఆయన దగ్గరకు వచ్చి ఆయనతో ఇలా అన్నారు: “పరిసయ్యులు ఈ మాట[b] విని అభ్యంతరపడ్డారని[a] మీకు తెలుసా?”'
  rationale: The revision restores the source’s speech verb (“said to him”) rather than narrowing it to “asked him,” while retaining a natural Telugu question. It also places each footnote marker on its proper textual anchor and smooths the literal-oriented lexical alternative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:10Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the narrative sequence, the disciples’ approach, the Pharisees, and their adverse reaction to Jesus’ preceding saying. However, λέγουσιν αὐτῷ is more faithfully represented by “said to him” than by “asked him,” even though the direct speech is a question. The lexical and cross-reference footnote anchors are also attached to the wrong expressions.
  naturalness: The revised wording is natural modern standard Telugu and retains a respectful narrative register. “ఆయనతో ఇలా అన్నారు” is an idiomatic rendering of “said to him,” while the ensuing question remains direct and clear.
  terminology: “శిష్యులు,” “పరిసయ్యులు,” and “అభ్యంతరపడ్డారు” are appropriate. “అభ్యంతరపడ్డారు” suitably expresses the contextual sense of ἐσκανδαλίσθησαν without importing a doctrinal interpretation. The note preserves the more literal stumbling imagery without overstating it.
  issues:
  - severity: medium
    issue: The translation renders λέγουσιν αὐτῷ as “ఆయనను అడిగారు” (“asked him”).
    rationale: The Greek verb is “said,” not specifically “asked.” Since the quoted speech is interrogative, Telugu may naturally use a question, but the speech-introduction should retain the broader verb of saying.
  - severity: medium
    issue: Footnote markers are misanchored.
    rationale: The lexical-alternative note for ἐσκανδαλίσθησαν is currently attached after “ఈ మాట,” while the cross-reference note for “this word” is attached after the whole speech. They should be anchored respectively to “అభ్యంతరపడ్డారని” and “ఈ మాట.”
  - severity: low
    issue: The literal alternative “తడబడేలా చేయబడ్డారని” is somewhat cumbersome in Telugu.
    rationale: A more readable literal-oriented alternative is “తడబడిపోయారని,” while noting that the underlying expression is more literally connected with stumbling.
  revised_text: 'అప్పుడు శిష్యులు ఆయన దగ్గరకు వచ్చి ఆయనతో ఇలా అన్నారు: “పరిసయ్యులు ఈ మాట[b] విని అభ్యంతరపడ్డారని[a] మీకు తెలుసా?”'
  revised_footnotes:
