id: MAT.15.12
reference: Matthew 15:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: te
  text: 'అప్పుడు శిష్యులు ఆయన దగ్గరకు వచ్చి ఆయనతో ఇలా అన్నారు: “పరిసయ్యులు ఈ మాట[b] విని అభ్యంతరపడ్డారని[a] మీకు తెలుసా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నొచ్చుకున్నారని”; మరింత అక్షరార్థంగా, “తడబడిపోయారని.”
    reason: lexical_alternative
  - marker: b
    text: “ఈ మాట” అనేది యేసు అంతకుముందు చెప్పిన మాటను సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనను సూచించే సహజమైన కాలసంబంధ పదం.
- source_word: προσελθόντες
  choice: దగ్గరికి వచ్చి
  rationale: προσέρχομαι లోని సమీపించడం అనే భావాన్ని సహజమైన తెలుగు క్రియారూపంలో నిలుపుతుంది.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులు
  rationale: గ్రీకులో ‘ఆయన శిష్యులు’ అని స్వామ్యసూచకం లేదు; సందర్భం ద్వారా ఎవరని స్పష్టమవుతుంది.
- source_word: λέγουσιν αὐτῷ
  choice: అని ఆయనను అడిగారు
  rationale: చారిత్రక వర్తమానాన్ని తెలుగు కథనానికి సహజమైన భూతకాలంలో ఇచ్చాం; వాక్యం ప్రశ్న కావడంతో ‘అడిగారు’ సహజంగా ఉంటుంది.
- source_word: Οἶδας
  choice: మీకు తెలుసా
  rationale: οἶδα అనే జ్ఞానార్థక క్రియను నేరుగా, గౌరవప్రదమైన సంభాషణా తెలుగులో అందిస్తుంది.
- source_word: οἱ Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ మతవర్గానికి తెలుగులో స్థిరపడిన పేరును ఉపయోగించాం.
- source_word: ἀκούσαντες τὸν λόγον
  choice: ఈ మాట విని
  rationale: λόγος ఇక్కడ యేసు అంతకుముందు పలికిన మాటను సూచిస్తుంది; ‘ఈ మాట’ మూలానికి సన్నిహితంగా, తెలుగులో సహజంగా ఉంది.
- source_word: ἐσκανδαλίσθησαν
  choice: అభ్యంతరపడ్డారని
  rationale: ఈ సందర్భంలో బోధకు ప్రతికూలంగా స్పందించి నొచ్చుకోవడం లేదా అభ్యంతరం వ్యక్తం చేయడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని ‘తడబడేలా కావడం’ రూపకాన్ని పాదసూచనలో ఉంచాం.
theological_decisions:
- issue: సందర్భంలో σκανδαλίζω అర్థం
  choice: అభ్యంతరపడ్డారు
  alternative: నొచ్చుకున్నారు; తడబడేలా చేయబడ్డారు
  rationale: ఇక్కడ పరిసయ్యులు యేసు మాటకు ప్రతికూలంగా స్పందించడమే ప్రధాన భావం. రక్షణ కోల్పోవడం లేదా నైతిక పతనం వంటి సిద్ధాంతార్థాన్ని బలవంతంగా చేర్చకుండా, పదంలోని రూపక విస్తృతిని పాదసూచనలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘అభ్యంతరపడ్డారు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, σκανδαλίζω పదంలోని రూపకార్థాన్ని పాదసూచనలో నిలిపాం.
