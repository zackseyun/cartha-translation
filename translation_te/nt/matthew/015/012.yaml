    text: లేదా “నొచ్చుకున్నారని”; మరింత అక్షరార్థంగా, “తడబడిపోయారని.”
    reason: lexical_alternative
  - marker: b
    text: “ఈ మాట” అనేది యేసు అంతకుముందు చెప్పిన మాటను సూచిస్తుంది.
    reason: cross_reference
  revision_rationale: The revision restores the source’s speech verb (“said to him”) rather than narrowing it to “asked him,” while retaining a natural Telugu question. It also places each footnote marker on its proper textual anchor and smooths the literal-oriented lexical alternative.
