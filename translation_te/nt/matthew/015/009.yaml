  verdict: approve
  source_fidelity: '‘కాని వారు … నన్ను వ్యర్థంగా ఆరాధిస్తున్నారు’ accurately represents δὲ, σέβονταί με, and μάτην. ‘మనుషుల ఆజ్ఞలను బోధలుగా బోధిస్తూ’ appropriately conveys the compressed relationship in διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων: human commands are presented as authoritative teachings. It does not introduce an unwarranted interpretive claim.'
  naturalness: The sentence is clear and suitably formal in modern standard Telugu. The deliberate repetition in ‘బోధలుగా బోధిస్తూ’ is mildly marked but understandable and helps retain the source wordplay/relationship without becoming unnatural.
  terminology: ‘ఆరాధిస్తున్నారు’ is appropriate for God-directed σέβονταί. ‘వ్యర్థంగా’ preserves the sense of worship being futile. ‘మనుషుల’ naturally carries the generic-human contrast intended by ἀνθρώπων, and the note correctly prevents a male-exclusive reading. ‘ఆజ్ఞలు’ is a sound rendering of ἐντάλματα.
