id: MAT.15.9
reference: Matthew 15:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: te
  text: కాని వారు మనుషుల[a] ఆజ్ఞలను బోధలుగా బోధిస్తూ, నన్ను వ్యర్థంగా ఆరాధిస్తున్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “మనుషులు” అనే పదం పురుషులను మాత్రమే కాక, దేవునికి భిన్నంగా మానవులను సాధారణంగా సూచిస్తుంది.
    reason: lexical_clarification
  - marker: b
    text: '“బోధలుగా బోధిస్తూ” అనే గ్రీకు పదబంధం సంక్షిప్తంగా ఉంది; భావం: మానవ ఆజ్ఞలను అధికారమున్న బోధలుగా బోధించడం.'
    reason: translation_clarification
lexical_decisions:
- source_word: μάτην
  choice: వ్యర్థంగా
  rationale: ప్రయోజనం లేకుండా, ఫలితం లేకుండా అనే తీర్పు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: కాని
  rationale: సందర్భంలోని మందలింపుకు తగిన స్వల్ప వ్యతిరేక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: σέβονταί
  choice: ఆరాధిస్తున్నారు
  rationale: దేవుని పట్ల చూపే భక్తి లేదా ఆరాధనను సూచించే ఈ క్రియకు సందర్భోచితమైన సమానార్థకం.
- source_word: διδάσκοντες
  choice: బోధిస్తూ
  rationale: వారి ఆరాధన ఎందుకు వ్యర్థమో తెలిపే వర్తమాన అసమాపక క్రియా సంబంధాన్ని నిలుపుతుంది.
- source_word: διδασκαλίας
  choice: బోధలుగా
  rationale: మానవ ఆజ్ఞలను అధికారిక బోధలుగా అందిస్తున్నారనే భావాన్ని, మూలంలోని పదసంబంధాన్ని అతిగా వివరించకుండా వ్యక్తం చేస్తుంది.
- source_word: ἐντάλματα
  choice: ఆజ్ఞలను
  rationale: నిర్దేశించబడిన మతపరమైన ఆదేశాల భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀνθρώπων
  choice: మనుషుల
  rationale: పురుషులను మాత్రమే కాక మానవ మూలాన్ని సాధారణంగా సూచిస్తూ, దైవిక మూలానికి ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: διδασκαλίας ἐντάλματα ἀνθρώπων అనే సంక్షిప్త పదబంధం
  choice: మనుషుల ఆజ్ఞలను బోధలుగా బోధిస్తూ
  alternative: మనుషుల ఆజ్ఞలనే బోధలుగా బోధిస్తూ
  rationale: మానవ ఆజ్ఞలకు బోధనాపరమైన అధికారం ఇస్తున్నారనే భావాన్ని తెలుపుతుంది; అయితే మూలంలో ప్రత్యక్షంగా లేని ఉద్ఘాటనను చేర్చకుండా ఉండేందుకు ‘ఆజ్ఞలనే’ బదులు ‘ఆజ్ఞలను’ ఎంచుకున్నాం.
- issue: ἀνθρώπων యొక్క సాధారణ మానవార్థం
  choice: మనుషుల
  alternative: మానవుల
  rationale: ఈ పదం పురుషులకు మాత్రమే పరిమితం కాదు. ‘మనుషుల’ అనేది సాధారణ పాఠకులకు సహజంగా ఉండి, దేవుని ఆజ్ఞలకు విరుద్ధంగా మానవ మూలం గల ఆజ్ఞలనే సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘బోధలుగా బోధిస్తూ’ అనే స్వల్ప పునరుక్తి మూలంలోని διδάσκοντες/διδασκαλίας పదసంబంధాన్ని నిలుపుతుంది; వాక్యక్రమం తెలుగులో సహజంగా ఉండేలా మార్చబడింది.
