id: MAT.15.33
reference: Matthew 15:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: te
  text: 'శిష్యులు ఆయనతో ఇలా అన్నారు: “ఇంత పెద్ద జనసమూహానికి కడుపునిండా తినిపించడానికి[c] సరిపడినన్ని రొట్టెలు[b] ఈ నిర్జన ప్రదేశంలో[a] మనకు ఎక్కడ దొరుకుతాయి?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అరణ్యంలో” / “జనావాసం లేని ప్రదేశంలో.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “ఇన్ని రొట్టెలు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “తృప్తిపరచడానికి”; గ్రీకు క్రియ కడుపు నిండా ఆహారం పెట్టడం లేదా ఆహారంతో తృప్తిపరచడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: అన్నారు
  rationale: గ్రీకు కథనంలోని చారిత్రక వర్తమాన కాలాన్ని సహజమైన తెలుగు కథనశైలిలో భూతకాలంగా అనువదించాం.
- source_word: οἱ μαθηταί
  choice: శిష్యులు
  rationale: నిర్దిష్టంగా, సందర్భంలో ఇప్పటికే తెలిసిన శిష్యుల సమూహాన్ని సూచిస్తుంది; మూలంలో లేని ‘ఆయన శిష్యులు’ అనే స్వామ్యపదాన్ని చేర్చలేదు.
- source_word: Πόθεν ἡμῖν
  choice: మనకు ఎక్కడ దొరుకుతాయి?
  rationale: సరఫరా ఎక్కడి నుంచి లభిస్తుందనే ప్రశ్నను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ἐρημίᾳ
  choice: ఈ నిర్జన ప్రదేశంలో
  rationale: జనావాసం లేని లేదా ఏకాంతమైన ప్రాంతం అనే భావాన్ని కాపాడుతూ, సందర్భానికి సహజంగా ‘ఈ’ చేర్చాం.
- source_word: ἄρτοι τοσοῦτοι
  choice: సరిపడేన్ని రొట్టెలు
  rationale: ἄρτοι యొక్క బహువచన భావాన్ని ‘రొట్టెలు’గా ఉంచి, τοσοῦτοι సూచించే అవసరమైన పెద్ద పరిమాణాన్ని ‘సరిపడేన్ని’తో తెలిపాం.
- source_word: ὥστε χορτάσαι
  choice: కడుపు నిండా తినిపించడానికి
  rationale: χορτάσαι కేవలం ఆహారం ఇవ్వడమే కాక పూర్తిగా తృప్తిపడేలా తినిపించడం అనే భావాన్ని వ్యక్తం చేస్తుంది; ὥστεతో ఉన్న ఫలిత/ఉద్దేశ భావాన్ని తెలుగు క్రియార్థక రూపంలో అందించాం.
- source_word: ὄχλον τοσοῦτον
  choice: ఇంత పెద్ద జనసమూహానికి
  rationale: జనసమూహం యొక్క అసాధారణ పరిమాణంపై ఉన్న ఉద్ఘాటనను సహజమైన తెలుగులో నిలిపాం.
