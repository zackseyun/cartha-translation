  text: And after instructing the crowd to recline on the ground,[a]
translation:
  language: te
  text: ఆయన జనసమూహానికి నేల మీద కూర్చోవాలని ఆదేశించి,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేల మీద ఆనుకొని కూర్చోవాలని.’ గ్రీకు క్రియ భోజనం కోసం తమ స్థానాలు తీసుకోవడాన్ని సూచించవచ్చు; తరచుగా అందులో ఆనుకొని భోజనం చేసే భంగిమ భావం ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ఆయన ... ఆదేశించి
  rationale: ఇది కథనంలోని తదుపరి చర్యను కలుపుతుంది. తెలుగు అసమాపక క్రియ నిర్మాణంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా అనుసంధానం సహజంగా వ్యక్తమవుతుంది.
- source_word: παραγγείλας
  choice: ఆదేశించి
  rationale: ఆరిస్ట్ కృదంతంలోని నిర్దేశాత్మక బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ఈ చర్య తరువాతి వచనంలోని ప్రధాన క్రియకు ముందుగా జరుగుతుంది.
- source_word: τῷ ὄχλῳ
  choice: జనసమూహాన్ని
  rationale: గ్రీకులో ఇది పరోక్ష కర్మ అయినా, ‘ఆదేశించు’ అనే తెలుగు క్రియతో ద్వితీయా విభక్తి సహజం. ‘జనసమూహం’ సందర్భానికి తగిన, గౌరవప్రదమైన ఆధునిక పదం.
- source_word: ἀναπεσεῖν
  choice: భోజనానికి కూర్చోమని
  rationale: ఈ క్రియ భోజనం కోసం తమ స్థానాల్లో కూర్చోవడం లేదా ఆనుకోవడం సూచిస్తుంది. తెలుగు సందర్భంలో ‘ఆనుకొని పడుకోవడం’ అసహజంగా లేదా తప్పుగా అర్థమయ్యే అవకాశం ఉన్నందున, భోజన సందర్భాన్ని స్పష్టంచేస్తూ సాధారణ భంగిమను తెలిపింది; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: ἐπὶ τὴν γῆν
  choice: నేల మీద
  rationale: ఇక్కడ γῆ భూమండలాన్ని కాక, ప్రజలు కూర్చునే నేల ఉపరితలాన్ని సూచిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలి వాడబడింది. ‘ఆదేశించి’ నిర్దేశ బలాన్ని నిలుపుతుంది. ‘భోజనానికి’ అనేది ἀναπεσεῖν పదంలోని భోజన-స్థాన భావాన్ని తెలియజేస్తుంది; భంగిమకు సంబంధించిన నిజమైన పదార్థ పరిధిని పాదసూచిక సంరక్షిస్తుంది.
