translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ అనువదించబడింది. గ్రీకు వాక్యంలోని కరుణ, మూడు రోజుల నిరంతర సమీపం, ఆహారం లేని స్థితి, ప్రయాణంలో శక్తి కోల్పోయే ఆశంక అన్నీ నిలుపబడ్డాయి.
