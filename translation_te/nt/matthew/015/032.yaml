id: MAT.15.32
reference: Matthew 15:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: te
  text: 'అప్పుడు యేసు తన శిష్యులను దగ్గరికి పిలిచి ఇలా అన్నాడు: “ఈ జనసమూహం మీద నాకు కనికరం కలుగుతోంది[a]. ఎందుకంటే వీరు ఇప్పటికే మూడు రోజులుగా నా దగ్గరే ఉన్నారు[b]; వీరికి తినడానికి ఏమీ లేదు. వీరిని ఆకలితో[c] పంపివేయడం నాకు ఇష్టం లేదు; దారిలో నీరసించి కూలిపోతారేమో[d].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ జనసమూహాన్ని చూసి నేను కనికరంతో కదిలిపోయాను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వీరు ఇప్పటికే మూడు రోజులుగా నాతోనే కొనసాగుతున్నారు.”
    reason: lexical_alternative
  - marker: c
    text: νήστεις అనే పదానికి అక్షరార్థంగా “ఉపవాసంతో” లేదా “ఆహారం లేకుండా” అని అర్థం. ఇక్కడ మతపరమైన ఉపవాసం కాకుండా, వారు ఆహారం తీసుకోని స్థితిని ఇది సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: లేదా, “దారిలో సొమ్మసిల్లిపోతారేమో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: దగ్గరికి పిలిచి
  rationale: మధ్యమ ప్రయోగంలోని దిశాభావాన్ని, అంటే యేసు శిష్యులను తన దగ్గరికి పిలిచాడనే అర్థాన్ని, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Σπλαγχνίζομαι
  choice: నాకు కనికరం కలుగుతోంది
  rationale: లోతైన అంతరంగ కరుణను సూచించే క్రియను స్పష్టమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὄχλον
  choice: జనసమూహం
  rationale: కథన సందర్భంలోని ὄχλοςకు సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: వీరు ఇప్పటికే మూడు రోజులుగా నా దగ్గరే ఉన్నారు
  rationale: ప్రజలు యేసుతోనే కొనసాగి ఉన్నారనే προσμένω భావాన్ని, కాలవ్యవధితో సహజంగా అందిస్తుంది.
- source_word: τί φάγωσιν
  choice: తినడానికి ఏమీ లేదు
  rationale: ఆహారం లేకపోవడాన్ని తెలిపే గ్రీకు నుడికారానికి సహజమైన తెలుగు రూపం.
- source_word: ἀπολῦσαι
  choice: పంపివేయడం
  rationale: సమకూడిన ప్రజలను అక్కడి నుంచి పంపే కథన సందర్భానికి తగిన అర్థం.
- source_word: νήστεις
  choice: ఆకలితో
  rationale: ఇక్కడ మతపరమైన ఉపవాసం కాకుండా ఆహారం తీసుకోని స్థితి ఉద్దేశించబడింది; ‘ఆకలితో’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μήποτε ἐκλυθῶσιν
  choice: నీరసించి కూలిపోతారేమో
  rationale: ప్రయాణంలో శక్తి కోల్పోయి సొమ్మసిల్లే ప్రమాదాన్ని సూచించే భయాశంకను తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν τῇ ὁδῷ
  choice: దారిలో
  rationale: తిరుగు ప్రయాణాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం.
