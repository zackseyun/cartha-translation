source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: te
  text: 'కాని ఆయన ఇలా జవాబిచ్చాడు: “పిల్లల రొట్టెను తీసుకొని చిన్న కుక్కలకు[a] వేయడం తగదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇంట్లో పెంచుకునే కుక్కలకు’ లేదా ‘కుక్కపిల్లలకు’; గ్రీకులో అల్పార్థక రూపం వాడబడింది. అది వీధి కుక్కలకన్నా చిన్నవైన లేదా ఇంట్లో పెంచుకునే కుక్కలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ఇలా జవాబిచ్చాడు
  rationale: క్రియావిశేషణ రూపం, ప్రధాన క్రియ కలిసి ఉన్న గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ఒకే ప్రతిస్పందన క్రియగా వ్యక్తపరుస్తుంది.
- source_word: καλὸν
  choice: తగదు
  rationale: ఈ సందర్భంలో నైతిక మంచితనం కంటే సముచితత లేదా యుక్తత భావం ప్రధానమైనది; నిషేధంతో కూడిన ‘తగదు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: λαβεῖν
  choice: తీసుకొని
  rationale: రొట్టెను చేతికి తీసుకోవడం లేదా దాని స్థానం నుంచి తీసివేయడం అనే సాధారణ సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: ἄρτον
  choice: రొట్టె
  rationale: మూలంలోని స్పష్టమైన ఆహార చిత్రాన్ని ‘ఆహారం’ అని సాధారణీకరించకుండా నిలుపుతుంది.
- source_word: τέκνων
  choice: పిల్లల
  rationale: τέκνα లింగభేదం లేకుండా పిల్లలను సూచిస్తుంది; తెలుగు షష్ఠీ సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: βαλεῖν
  choice: వేయడం
  rationale: βάλλω లోని విసరడం లేదా వేయడం అనే సజీవ చిత్రాన్ని నిలుపుతూ, ఈ వాక్యంలో సహజమైన తెలుగు ప్రయోగాన్ని ఇస్తుంది.
- source_word: κυναρίοις
  choice: చిన్న కుక్కలకు
  rationale: గ్రీకు పదంలోని అల్పార్థక రూపాన్ని నిలుపుతుంది; అది వీధి కుక్కలకన్నా చిన్నవైన లేదా ఇంట్లో పెంచుకునే కుక్కలను సూచించవచ్చు.
theological_decisions:
- issue: పిల్లలు, కుక్కల రూపకం సూచించే వ్యక్తులను మరియు యేసు మాటల స్వరాన్ని అనువాదంలో వివరించాలా?
  choice: ప్రధాన పాఠ్యంలో ‘పిల్లల రొట్టె’, ‘చిన్న కుక్కలు’ అనే రూపకాన్ని నేరుగా నిలుపడం
  alternative: జాతులు లేదా గుంపులను స్పష్టంగా పేరుపెట్టి రూపకాన్ని వివరణాత్మకంగా అనువదించడం
  rationale: ఈ వచనం రూపకంలోని సూచిత వ్యక్తులను స్వయంగా పేరుపెట్టదు. సందర్భంలో ఉన్న ఉద్రిక్తతను, వ్యాఖ్యానసాధ్యతను ముందుగానే పరిష్కరించకుండా మూలరూపంలో ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘అందుకు’ ప్రతిస్పందన సంబంధాన్ని చూపుతుంది; ‘తగదు’ సముచితత భావాన్ని సంక్షిప్తంగా అందిస్తుంది. రూపకాన్ని వివరణతో మృదువుచేయకుండా యథాతథంగా నిలిపాం.
