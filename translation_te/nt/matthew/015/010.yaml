translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. గ్రీకు కృదంత నిర్మాణాన్ని సహజ తెలుగు ‘పిలిచి’ రూపంతో నిలిపి, రెండు ఆజ్ఞలను వేర్వేరుగా ఉంచింది.
