  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: te
  text: ఆయన జనసమూహాన్ని తన దగ్గరికి పిలిచి వారితో, “వినండి, అర్థం చేసుకోండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: ఆయన ... పిలిచి
  rationale: గ్రీకు సంధానార్థక పదం కథనాన్ని ముందుకు నడిపిస్తుంది. తెలుగులో వాక్యారంభంలో ప్రత్యేకంగా ‘మరియు’ అనడం కంటే క్రమార్థక క్రియారూపంతో అనుసంధానం సహజంగా వ్యక్తమవుతుంది.
- source_word: προσκαλεσάμενος
  choice: తన దగ్గరికి పిలిచి
  rationale: అయోరిస్ట్ మధ్యమ కృదంతం ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది; ‘తన దగ్గరికి’ అనేది προσκαλέομαι లోని సమీపానికి పిలిచే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: τὸν ὄχλον
  choice: జనసమూహాన్ని
  rationale: సందర్భంలో కూడివున్న ప్రజల సమూహాన్ని సూచించే ఆధునిక, గౌరవప్రదమైన తెలుగు పదం.
- source_word: εἶπεν αὐτοῖς
  choice: వారితో ... అని చెప్పాడు
  rationale: వ్యక్తులకు ఉద్దేశించి పలికిన మాటను సహజ తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో వ్యక్తపరుస్తుంది.
- source_word: Ἀκούετε
  choice: వినండి
  rationale: వర్తమాన క్రియాజ్ఞ బహువచనంలోని ఆజ్ఞార్థాన్ని సహజంగా తెలియజేస్తుంది; ఇక్కడ నిరంతరతను ప్రత్యేకంగా చేర్చాల్సిన అవసరం లేదు.
- source_word: συνίετε
  choice: అర్థం చేసుకోండి
  rationale: కేవలం శబ్దం వినడం కాక, విన్నదాని భావాన్ని గ్రహించమనే ఆజ్ఞను స్పష్టంగా నిలుపుతుంది.
