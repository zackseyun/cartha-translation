  to: 'అయితే ఆయన వారికి జవాబుగా ఇలా అన్నాడు: “మీ సంప్రదాయం కారణంగా[a] మీరు కూడా దేవుని ఆజ్ఞను ఎందుకు అతిక్రమిస్తున్నారు?”'
  rationale: The revision makes the causal force of διὰ τὴν παράδοσιν ὑμῶν explicit in natural modern Telugu while preserving the alternative “నిమిత్తం” in the anchored footnote. No other wording requires change.
