id: MAT.15.3
reference: Matthew 15:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: te
  text: 'అయితే ఆయన వారికి జవాబుగా ఇలా అన్నాడు: “మీ సంప్రదాయం కారణంగా[a] మీరు కూడా దేవుని ఆజ్ఞను ఎందుకు అతిక్రమిస్తున్నారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ సంప్రదాయం నిమిత్తం.”
    reason: διά + accusative ఇక్కడ ప్రధానంగా కారణాన్ని సూచిస్తుంది; సందర్భానుసారంగా “నిమిత్తం/కోసం” అనే భావఛాయ కూడా సాధ్యమే.
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: అయితే ఆయన వారికి జవాబుగా ఇలా అన్నాడు
  rationale: ‘అయితే’ మునుపటి ఆరోపణకు ప్రతిస్పందనను సూచిస్తుంది. ‘జవాబుగా ఇలా అన్నాడు’ అనే సహజమైన తెలుగు ప్రయోగం ἀποκριθεὶς మరియు εἶπεν అనే రెండు అంశాల భావాన్ని నిలుపుతుంది.
- source_word: Διὰ τί
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే ఈ గ్రీకు ప్రయోగానికి ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: καὶ ὑμεῖς
  choice: మీరు కూడా
  rationale: వారు శిష్యులపై చేసిన ఆరోపణకు యేసు ప్రతిగా వారినే ప్రశ్నిస్తున్న సమాంతర భావాన్ని καὶ సూచిస్తుంది.
- source_word: παραβαίνετε
  choice: అతిక్రమిస్తున్నారు
  rationale: ఆజ్ఞ నిర్దేశించిన హద్దును దాటడం లేదా దానిని ఉల్లంఘించడం అనే భావాన్ని ఇది స్పష్టంగా, గౌరవప్రదమైన బైబిలు శైలిలో వ్యక్తం చేస్తుంది.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: దేవుని ఆజ్ఞను
  rationale: దైవిక అధికారాన్ని తెలిపే ἐντολή భావాన్ని ‘ఆజ్ఞ’ సహజంగా నిలుపుతుంది; తెలుగు విభక్తి నిర్మాణం గ్రీకు సంబంధార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: మీ సంప్రదాయం నిమిత్తం
  rationale: διά + accusative సూచించే కారణం లేదా దాని కోసం అనే స్వల్ప భావవిస్తృతిని ‘నిమిత్తం’ నిలుపుతుంది. παράδοσις‌ను ‘సంప్రదాయం’గా అనువదించడం, తరతరాలుగా అందిన ఆచారం లేదా బోధ అనే మూలభావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దేవుని ఆజ్ఞకు మానవ సంప్రదాయానికి మధ్య ఉన్న వ్యత్యాసం
  choice: ‘దేవుని ఆజ్ఞ’ మరియు ‘మీ సంప్రదాయం’ అనే ప్రత్యక్ష వ్యత్యాసాన్ని నిలుపడం
  alternative: ‘దేవుని ఆదేశం’ మరియు ‘మీ ఆచారం/బోధ’ అని అనువదించడం
  rationale: వాక్యం అన్ని సంప్రదాయాలనూ సాధారణంగా ఖండించడం లేదు; ఇక్కడ ప్రశ్నించబడుతున్న వారి నిర్దిష్ట సంప్రదాయం దేవుని ఆజ్ఞను అతిక్రమించడానికి దారితీస్తోందని ఆరోపిస్తోంది. అందువల్ల ‘మీ సంప్రదాయం’ అనే పరిమితిని యథాతథంగా ఉంచాం.
- issue: διὰ τὴν παράδοσιν ὑμῶν లో కారణం మరియు ప్రయోజనం మధ్య భావసూక్ష్మత
  choice: ప్రధాన పాఠ్యంలో ‘నిమిత్తం’
  alternative: ‘కారణంగా’
  rationale: ‘నిమిత్తం’ కారణం మరియు సంప్రదాయానికి ప్రాధాన్యం ఇవ్వడం అనే రెండు భావఛాయలను మోయగలదు; కారణార్థాన్ని పాదసూచికలో స్పష్టంగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన బైబిలు శైలిని అనుసరించాం. ‘అతిక్రమిస్తున్నారు,’ ‘ఆజ్ఞ,’ ‘సంప్రదాయం’ వంటి పదాలు మూలంలోని న్యాయపరమైన మరియు అధికారపరమైన వ్యత్యాసాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా నిలుపుతాయి.
