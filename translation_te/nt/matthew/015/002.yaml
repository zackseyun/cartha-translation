id: MAT.15.2
reference: Matthew 15:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: te
  text: “మీ శిష్యులు పెద్దల సంప్రదాయాన్ని ఎందుకు అతిక్రమిస్తున్నారు? వారు రొట్టె తినేటప్పుడు తమ చేతులు కడుక్కోరు[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది కేవలం సాధారణ పరిశుభ్రత గురించిన విషయం కాదు; పెద్దల సంప్రదాయంతో సంబంధమున్న చేతులు కడుక్కునే ఆచారాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా “భోజనం చేసేటప్పుడు.” గ్రీకులోని “రొట్టె” అనే పదం కొన్నిసార్లు సాధారణంగా ఆహారాన్ని లేదా భోజనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే గ్రీకు ప్రయోగానికి సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: παραβαίνουσιν
  choice: అతిక్రమిస్తున్నారు
  rationale: అధికారబద్ధంగా అందిన సంప్రదాయాన్ని మీరడం అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; కేవలం సాధారణ అలవాటును పాటించకపోవడం అనే స్థాయికి భావాన్ని తగ్గించదు.
- source_word: τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: పెద్దల సంప్రదాయాన్ని
  rationale: παράδοσις అంటే అందించబడిన సంప్రదాయం; πρεσβύτεροι ఇక్కడ కేవలం వృద్ధులు కాక, పూర్వపు గుర్తింపు పొందిన మతాధికారులు లేదా పూర్వపెద్దలను సూచిస్తుంది.
- source_word: οὐ γὰρ νίπτονται τὰς χεῖρας αὐτῶν
  choice: వారు తమ చేతులు కడుక్కోరు
  rationale: νίπτω శరీరంలోని ఒక భాగాన్ని, ముఖ్యంగా చేతులు లేదా కాళ్లను కడగడాన్ని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో కర్తను మళ్లీ ఉంచడం కారణ వివరణను స్పష్టంగా చేస్తుంది.
- source_word: ὅταν
  choice: తినేటప్పుడు
  rationale: వర్తమాన సుబ్జంక్టివ్‌తో కూడిన ఈ పదం అలవాటుగా జరిగే సందర్భాన్ని సూచిస్తుంది; ‘తినేటప్పుడు’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἄρτον
  choice: రొట్టె
  rationale: మూలపదానికి ప్రత్యక్ష అర్థం ‘రొట్టె’. ఇది విస్తృతంగా భోజనాన్ని కూడా సూచించగలిగినా, ప్రధాన పాఠ్యంలో మూలంలోని నిర్దిష్ట పదాన్ని నిలిపి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἐσθίωσιν
  choice: తినేటప్పుడు
  rationale: ὅταν తో కలిసి సాధారణంగా లేదా అలవాటుగా జరిగే తినే సందర్భాన్ని సహజమైన తెలుగు కాలప్రయోగంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: చేతులు కడుక్కోవడం యొక్క స్వభావం
  choice: ప్రధాన పాఠ్యంలో దీనిని ‘పెద్దల సంప్రదాయం’ గురించిన వివాదంగానే ఉంచడం
  alternative: దీనిని నేరుగా ఆచారపరమైన శుద్ధీకరణగా లేదా సాధారణ పరిశుభ్రతగా పేర్కొనడం
  rationale: వచనం స్వయంగా వివాదాన్ని పెద్దల సంప్రదాయానికి విధేయత అనే రూపంలో ఉంచుతుంది. చేతులు కడుక్కోవడంలోని ఆచార నేపథ్యాన్ని పాదసూచిక వివరిస్తుంది గాని, మూలపాఠ్యం చెప్పినదానికంటే ఎక్కువగా ప్రధాన పాఠ్యం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్న-వివరణ నిర్మాణం వాడబడింది. ‘పెద్దలు’ అనే పదం సందర్భంలో పూర్వపు అధికారబద్ధ బోధకులను సూచిస్తుంది; ‘సంప్రదాయం’ దానికి ఉన్న బలాన్ని నిలుపుతుంది. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత వాక్యాంతంలో ఉంచబడ్డాయి.
