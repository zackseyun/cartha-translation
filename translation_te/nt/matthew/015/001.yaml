id: MAT.15.1
reference: Matthew 15:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε προσέρχονται τῷ ⸀Ἰησοῦ ἀπὸ Ἱεροσολύμων ⸂Φαρισαῖοι καὶ γραμματεῖς⸃ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: te
  text: 'అప్పుడు యెరూషలేము నుండి పరిసయ్యులు, శాస్త్రులు[b] యేసు దగ్గరకు వచ్చి[a] ఇలా అన్నారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసును సమీపించి.”
    reason: lexical_alternative
  - marker: b
    text: “శాస్త్రులు” అనే పదం ఈ సందర్భంలో “ధర్మశాస్త్ర నిపుణులు” లేదా “ధర్మశాస్త్ర బోధకులు” అని కూడా అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: తదుపరి సంఘటనను పరిచయం చేసే కాలసూచక పదంగా, కథన ప్రవాహాన్ని సహజంగా నిలుపుతుంది.
- source_word: προσέρχονται
  choice: దగ్గరకు వచ్చి
  rationale: యేసువైపు వచ్చి ఆయనను సమీపించడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగులో సహజ కథన భూతకాలంతో అందించింది.
- source_word: τῷ Ἰησοῦ
  choice: యేసు దగ్గరకు
  rationale: προσέρχομαιతో ఉన్న దత్తి విభక్తి, సమీపించబడిన వ్యక్తిని సూచిస్తుంది.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: యెరూషలేము నుండి
  rationale: ἀπό సూచించే మూలస్థానాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూద మతవర్గానికి తెలుగులో స్థిరపడిన చారిత్రక పేరు.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: లేఖనాలు, ధర్మశాస్త్రంలో నిపుణులైన వర్గానికి సంప్రదాయబద్ధమైనప్పటికీ గ్రాహ్యమైన తెలుగు పదం; వివరణాత్మక ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చింది.
- source_word: λέγοντες
  choice: ఇలా అన్నారు
  rationale: తదుపరి వచనంలోని ప్రత్యక్ష సంభాషణను సహజ తెలుగులో పరిచయం చేస్తుంది.
theological_decisions:
- issue: కథన వర్తమాన కాలం
  choice: తెలుగు కథనంలో సహజమైన భూతకాల రూపం (‘వచ్చి ... అన్నారు’) ఉపయోగించడం
  alternative: గ్రీకు చారిత్రక వర్తమానాన్ని రూపపరంగా నిలిపి ‘వస్తూ ... అంటున్నారు’ అని అనువదించడం
  rationale: προσέρχονται అనే చారిత్రక వర్తమానం సంఘటనకు సజీవతను ఇస్తుంది; అయితే తెలుగులో దాన్ని యథారూపంగా ఉంచితే సందర్భం లేకుండా అసహజంగా వినిపిస్తుంది. సహజ కథన భూతకాలం సంఘటనల క్రమాన్ని కాపాడుతుంది, ఏ సిద్ధాంతార్థాన్నీ మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు గ్రాహ్యంగా, గౌరవప్రదమైన కథన శైలి. ‘శాస్త్రులు’ అనే చారిత్రక పదానికి అర్థవివరణను పాదసూచికలో ఇచ్చింది. ప్రతి పాదసూచిక గుర్తు ప్రధాన వచనంలో ఉంది.
