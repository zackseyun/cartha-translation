id: MAT.15.6
reference: Matthew 15:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: te
  text: ‘అతడు తన తండ్రిని గౌరవించాల్సిన అవసరమే లేదు[b].’ మరియు మీరు మీ సంప్రదాయం కారణంగా దేవుని వాక్యాన్ని[a] చెల్లనిదిగా చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘దేవుని వాక్యం’కు బదులుగా ‘దేవుని ఆజ్ఞ’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: ఇక్కడ ‘గౌరవించడం’ అంటే కేవలం మర్యాద చూపడం మాత్రమే కాకుండా, తల్లిదండ్రుల అవసరాలు తీర్చే ఆచరణాత్మక బాధ్యతను కూడా సూచిస్తుండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: అవసరమే లేదు
  rationale: οὐ μή అనే బలమైన నిషేధాన్ని, ఈ సందర్భంలో తల్లిదండ్రిని గౌరవించవలసిన బాధ్యత నుంచి మినహాయిస్తున్న భావంగా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τιμήσει
  choice: గౌరవించాల్సిన
  rationale: τιμάω యొక్క ప్రాథమిక అర్థమైన ‘గౌరవించు’ను నిలుపుతుంది; సందర్భంలో ఉన్న ఆర్థికంగా ఆదరించే బాధ్యతను ప్రధాన వచనంలో అతిగా నిర్దిష్టం చేయదు.
- source_word: πατέρα αὐτοῦ
  choice: తన తండ్రిని
  rationale: గ్రీకు పాఠంలోని ఏకవచన ‘అతని తండ్రి’ని విస్తరించకుండా అనువదిస్తుంది; తెలుగులో కర్తను సూచించడానికి ‘తన’ సహజంగా ఉంటుంది.
- source_word: ἠκυρώσατε
  choice: చెల్లకుండా చేశారు
  rationale: ἀκυρόω సూచించే చెల్లుబాటును తొలగించడం లేదా నిరర్థకం చేయడం అనే బలమైన భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యాన్ని
  rationale: SBLGNTలోని λόγονను నేరుగా అనుసరిస్తుంది; ‘ఆజ్ఞ’ అనే పాఠాంతరాన్ని ప్రధాన వచనంలోకి తీసుకురాదు.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: మీ సంప్రదాయం కారణంగా
  rationale: accusativeతో వచ్చిన διά ఇక్కడ కారణాన్ని సూచిస్తుంది; వారి సంప్రదాయం వల్ల దేవుని వాక్యం చెల్లకుండా చేయబడిందనే సంబంధాన్ని సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: ‘గౌరవించు’లో తల్లిదండ్రులకు ఆర్థిక సహాయం చేసే బాధ్యతను స్పష్టంగా చేర్చాలా
  choice: ప్రధాన వచనంలో ‘గౌరవించు’నే ఉంచి, దాని ఆచరణాత్మక పరిధిని పాదసూచికలో తెలియజేయడం.
  alternative: ‘పోషించు’ లేదా ‘ఆదరించు’ అని అనువదించడం.
  rationale: వివాద సందర్భంలో భౌతిక సహాయం అంతర్భాగమైనప్పటికీ, గ్రీకు క్రియ విస్తృతమైన τιμάω. ‘గౌరవించు’ ఆజ్ఞతో ఉన్న పదసంబంధాన్ని కాపాడుతూ అర్థాన్ని అనవసరంగా కుదించదు.
- issue: సమీప సందర్భం లేదా పాఠాంతరంతో వచనాన్ని సమన్వయపరచాలా
  choice: SBLGNTలో ఉన్నట్లుగా ‘తన తండ్రిని’ మరియు ‘దేవుని వాక్యాన్ని’ అనువదించడం.
  alternative: ‘తండ్రిని లేదా తల్లిని’ అని విస్తరించడం; లేదా ‘దేవుని ఆజ్ఞను’ అనే పాఠాంతరాన్ని ప్రధాన వచనంలో ఉంచడం.
  rationale: ఇచ్చిన గ్రీకు పాఠానికి ప్రాధాన్యం ఇస్తూ ఏకవచనాన్ని, λόγον అనే పదాన్ని అలాగే నిలుపుతుంది; ముఖ్యమైన పాఠాంతరాన్ని పాదసూచికలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ముందటి వాక్యంలో చెప్పబడిన సంప్రదాయ నియమానికి కొనసాగింపుగా మొదటి వాక్యాన్ని ఉద్ధరణలో ఉంచాం. ‘అవసరమే లేదు’ ద్వారా బలమైన నిషేధంతో కూడిన బాధ్యతా మినహాయింపును వ్యక్తం చేశాం; ‘ఇలా’ καὶ యొక్క సందర్భానుసార ఫలిత సంబంధాన్ని సహజంగా కలుపుతుంది.
