id: MAT.6.34
reference: Matthew 6:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: te
  text: కాబట్టి రేపటి గురించి చింతించకండి; రేపటి గురించి రేపే చింతిస్తుంది. ప్రతి రోజుకూ దాని కష్టమే చాలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి రోజుకూ దాని చెడే చాలు.” ఇక్కడ వాడిన గ్రీకు పదానికి “చెడు” అని అర్థం ఉండవచ్చు; ఈ సందర్భంలో అది ఆ రోజు ఎదురయ్యే కష్టం లేదా ఇబ్బందిని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεριμνήσητε
  choice: చింతించకండి
  rationale: ఈ సందర్భంలో క్రియ ఆందోళనతో కూడిన చింతను సూచిస్తుంది. ‘చింతించకండి’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, మత్తయి 6:25–34లో పునరావృతమయ్యే భావాన్ని నిలుపుతుంది.
- source_word: εἰς τὴν αὔριον
  choice: రేపటి గురించి
  rationale: చింత దేనివైపు మళ్లిందో తెలిపే గ్రీకు ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ αὔριον μεριμνήσει αὑτῆς
  choice: రేపటి సంగతి రేపే చూసుకుంటుంది
  rationale: ‘రేపు’ను వ్యక్తీకరించే మూలభాషా అలంకారాన్ని నిలుపుతూ, తెలుగులో సహజమైన సామెతసదృశ రూపాన్ని ఇస్తుంది. పదశః ‘రేపు తన గురించి తానే చింతిస్తుంది’ అనే భావమే ఇందులో ఉంది.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: ఆ రోజుకు చాలు
  rationale: ప్రతి రోజుకు దాని భారమే సరిపోతుందనే విభజనాత్మక భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἡ κακία αὐτῆς
  choice: ఏ రోజుకున్న కష్టం
  rationale: κακία యొక్క ప్రాథమిక ‘చెడు’ భావాన్ని సందర్భానుసారంగా ఆ రోజు ఎదురయ్యే కష్టం లేదా ఇబ్బందిగా అందిస్తుంది; స్వాధీన భావాన్ని ‘రోజుకున్న’ ద్వారా చూపిస్తుంది.
theological_decisions:
- issue: ఆందోళన గురించిన జ్ఞానోక్తిలో κακία యొక్క భావం
  choice: కష్టం
  alternative: చెడు
  rationale: సమీప సందర్భం భవిష్యత్తు గురించి చింతించడాన్ని ప్రస్తావిస్తుంది; అందువల్ల ఇక్కడ నైతిక దుష్టత్వం కన్నా ఆ రోజు తెచ్చే కష్టం లేదా ఇబ్బంది ప్రధాన భావం. అయితే ‘చెడు’ అనే పదార్థసాధ్యాన్ని పాదటిప్పణిలో భద్రపరచాం.
- issue: ‘రేపు తన గురించి తానే చింతిస్తుంది’ అనే వ్యక్తీకరణ
  choice: రేపటి సంగతి రేపే చూసుకుంటుంది
  alternative: రేపు తన గురించి తానే చింతిస్తుంది
  rationale: ఎంచుకున్న రూపం మూలంలోని వ్యక్తీకరణను నిలుపుతూ సహజమైన ఆధునిక తెలుగు పలుకుబడిగా వినిపిస్తుంది; అది దైవపరిపాలన గురించి అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవసూచక బహువచన ఆజ్ఞారూపం వాడబడింది. వాక్యం సామెతసదృశంగా, సాధారణ పాఠకులకు సులభంగా ఉండేలా చేయబడింది; మూలంలోని ‘రేపు’ వ్యక్తీకరణను సహజ తెలుగు రూపంలో నిలుపుకుంది.
