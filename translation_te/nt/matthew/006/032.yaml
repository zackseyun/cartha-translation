id: MAT.6.32
reference: Matthew 6:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: te
  text: ఎందుకంటే అన్యజనులు[a] ఈ అన్నిటినీ ఆసక్తిగా వెదుకుతారు[b]; ఎందుకంటే ఈ అన్నీ మీకు అవసరమని మీ పరలోక తండ్రికి తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జనాంగాలు,’ లేదా ‘అన్యమతస్థులు.’ గ్రీకు పదం సాధారణంగా జనాంగాలను సూచించగలదు; ఇక్కడ అది యూదేతరులను సూచించే అవకాశం ఎక్కువ.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘వెదుకుతారు,’ లేదా ‘పట్టుదలగా వెదుకుతారు.’ గ్రీకు క్రియ ఆసక్తితో లేదా నిరంతరంగా వెదకడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: అన్యజనులు
  rationale: మత్తయి సందర్భంలో ఈ పదం యేసు శిష్యులకు భిన్నంగా ఉన్న యూదేతర ప్రజలను సూచిస్తుంది. ‘అన్యజనులు’ ఆ చారిత్రక, సామాజిక భేదాన్ని నిలుపుతుంది; అవమానార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: ἐπιζητοῦσιν
  choice: ఆత్రంగా వెదుకుతారు
  rationale: ἐπιζητέω సాధారణంగా వెదకడం కంటే శ్రద్ధతో లేదా పట్టుదలతో వెదకడాన్ని సూచించగలదు. ‘ఆత్రంగా వెదుకుతారు’ ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: మీ పరలోకపు తండ్రి
  rationale: ఈ రూపం ‘మీ’ అనే సంబంధాన్నీ, తండ్రి పరలోక సంబంధితుడనే విశేషణాన్నీ సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: οἶδεν
  choice: తెలుసు
  rationale: οἶδα రూపరీత్యా పరిపూర్ణ కాలమైనా ఇక్కడ వర్తమానార్థంలో వాడబడింది; అందువల్ల ‘తెలుసు’ ఖచ్చితమైన సహజ అనువాదం.
- source_word: χρῄζετε
  choice: మీకు అవసరం
  rationale: అవసరాన్ని స్పష్టంగా, ప్రస్తుత తెలుగు వాడుకలో సహజంగా తెలియజేస్తుంది.
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: వీటన్నిటినీ ... ఇవన్నీ
  rationale: గ్రీకులోని ‘అన్నీ’ అనే పునరుక్తిని తెలుగులోనూ నిలిపి, వాక్యంలోని ఉద్ఘాటనను కాపాడింది.
- source_word: γὰρ ... γὰρ
  choice: ఎందుకంటే ... ఎందుకంటే
  rationale: రెండు γάρ పదాల వివరణాత్మక సంబంధాన్ని తెలుగులోనూ స్పష్టంగా నిలిపింది; పునరుక్తి కొంత అసాధారణంగా వినిపించినా మూలంలోని తార్కిక ప్రవాహాన్ని ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: యేసు బోధలో τὰ ἔθνη పదం సూచించే వర్గం
  choice: అన్యజనులు
  alternative: జనాలు; అన్యమతస్థులు
  rationale: సందర్భం శిష్యులకూ వారి చుట్టూ ఉన్న యూదేతర ప్రజలకూ మధ్య భేదాన్ని చూపుతుంది. ‘అన్యజనులు’ నిబంధనాత్మక, చారిత్రక నేపథ్యాన్ని కాపాడుతుంది; అయితే యూదేతరులందరిపై సంపూర్ణ నైతిక తీర్పును మోపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని రెండు వివరణాత్మక γάρ పదాలనూ, ‘అన్నీ’ అనే పునరుక్తినీ ఉద్దేశపూర్వకంగా నిలిపాం. ‘మీ పరలోకపు తండ్రి’ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉండి మూల నిర్మాణ భావాన్ని కాపాడుతుంది.
