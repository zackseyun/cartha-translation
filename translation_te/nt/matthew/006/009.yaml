source:
  edition: SBLGNT
  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: te
  text: 'కాబట్టి మీరు ఈ విధంగా ప్రార్థించండి: పరలోకాలలో ఉన్న మా తండ్రీ, నీ నామం పవిత్రమైనదిగా గౌరవించబడుగాక[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ నామం పరిశుద్ధపరచబడుగాక.” అంటే, నీ నామం పవిత్రమైనదిగా గుర్తించబడి గౌరవించబడుగాక.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: ఈ విధంగా
  rationale: ప్రార్థించవలసిన విధానాన్ని లేదా నమూనాను పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని సూచనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి బోధననుండి వచ్చే నిర్ధారణను సూచించే అనుసంధాన పదం; దాని తార్కిక బలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: προσεύχεσθε ὑμεῖς
  choice: మీరు ... ప్రార్థించండి
  rationale: వర్తమానకాల ఆజ్ఞార్థక క్రియతో పాటు స్పష్టమైన ὑμεῖς సర్వనామం ఉంది; ‘మీరు’ ద్వారా ఆ ఉద్దేశపూర్వక ఉద్ఘాటన తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: Πάτερ ἡμῶν
  choice: మా తండ్రీ
  rationale: సంబోధన రూపాన్నీ, సమూహాన్ని సూచించే బహువచన స్వామ్యభావాన్నీ సహజమైన తెలుగు ప్రార్థనా భాషలో నిలుపుతుంది.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: పరలోకాలలో ఉన్న
  rationale: మూలంలోని బహువచన τοῖς οὐρανοῖς‌ను నిలుపుతూ, ὁ యొక్క సంబంధార్థాన్ని తెలుగులో ‘ఉన్న’ అని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἁγιασθήτω
  choice: పవిత్రమైనదిగా ఎంచబడుగాక
  rationale: ఆయన నామం పవిత్రమైనదిగా గుర్తింపబడి గౌరవింపబడాలనే ప్రార్థనను తెలియజేస్తుంది. కేవలం ‘పవిత్రపరచబడుగాక’ అనడం దేవుని నామం ముందుగా అపవిత్రంగా ఉందనే అపార్థానికి దారితీయవచ్చు; ‘ఎంచబడుగాక’ దాని గౌరవింపబడే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: τὸ ὄνομά σου
  choice: నీ నామం
  rationale: మూలపదాన్ని నేరుగా నిలుపుతుంది; ‘నామం’ వ్యక్తి, కీర్తి, వెల్లడైన స్వభావాన్ని సూచించగల విస్తృత బైబిలీయ భావాన్ని అనవసరంగా వివరణలో కలపదు.
theological_decisions:
- issue: ప్రభువు ప్రార్థన ఆరంభంలో దైవిక సాన్నిహిత్యాన్నీ మహోన్నతత్వాన్నీ ఎలా వ్యక్తం చేయాలి
  choice: పరలోకాలలో ఉన్న మా తండ్రీ
  alternative: పరలోకంలో ఉన్న మా తండ్రీ; పరలోకపు మా తండ్రీ
  rationale: గ్రీకు పాఠంలో ‘ఆకాశాలు/పరలోకాలు’ బహువచనంలో ఉంది. ఎంచుకున్న రూపం ‘తండ్రీ’ అనే సన్నిహిత సంబోధనతో పాటు ‘పరలోకాలలో ఉన్న’ అనే మహోన్నతత్వ భావాన్ని నిలుపుతుంది; ‘పరలోకపు తండ్రి’ వంటి విశేషణాత్మక పునర్వ్యాఖ్యానాన్ని నివారిస్తుంది.
- issue: ἁγιασθήτω అనే అభ్యర్థనను సమకాలీనమైనా వేదాంతపరమైన బరువుతో ఎలా అనువదించాలి
  choice: నీ నామం పవిత్రమైనదిగా ఎంచబడుగాక
  alternative: నీ నామం పవిత్రపరచబడుగాక; నీ నామం పరిశుద్ధంగా గౌరవించబడుగాక
  rationale: ఇది దేవుని నామం పవిత్రమైనదిగా గుర్తించబడి గౌరవింపబడాలనే అభ్యర్థన. ఎంచుకున్న రూపం మూలంలోని నిష్క్రియార్థక ఆజ్ఞ/కోరిక భావాన్ని నిలుపుతూ, దేవుని నామానికి పవిత్రత కలిగించబడుతున్నదనే అపార్థాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనా శైలిని ఉపయోగించాం. ‘పరలోకాలలో’ ద్వారా మూలంలోని బహువచనాన్ని నిలిపాం. ‘తండ్రీ,’ ‘ఎంచబడుగాక’ వంటి రూపాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండేంత సహజతతో, వాక్యానికి తగిన గంభీరతను కాపాడుతాయి.
