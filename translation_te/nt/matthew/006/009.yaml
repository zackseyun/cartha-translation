    issue: ‘ఎంచబడుగాక’ is semantically incorrect for ἁγιασθήτω.
    rationale: ఎంచు means ‘choose/select.’ The Greek passive imperative asks that God’s name be sanctified or treated as holy; selection is not part of its sense.
