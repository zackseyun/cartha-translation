  source_fidelity: The opening instruction, plural second-person address, communal vocative, and plural ‘heavens’ are represented faithfully. However, ‘పవిత్రమైనదిగా ఎంచబడుగాక’ means ‘may [it] be chosen as holy,’ not ‘may [it] be regarded/treated as holy,’ and does not render ἁγιασθήτω adequately.
  naturalness: ‘కాబట్టి మీరు ఈ విధంగా ప్రార్థించండి’ and ‘పరలోకాలలో ఉన్న మా తండ్రీ’ are clear and suitably reverent in modern standard Telugu. Replacing ‘ఎంచబడుగాక’ with ‘పవిత్రమైనదిగా గౌరవించబడుగాక’ gives an idiomatic, intelligible petition.
  terminology: ‘మా తండ్రీ,’ ‘పరలోకాలలో,’ and ‘నీ నామం’ appropriately preserve the prayer’s reverent register and the Greek plural τοῖς οὐρανοῖς. ‘పవిత్రమైనదిగా గౌరవించబడుగాక’ expresses the petition that the name be honored as holy without implying that holiness must be newly conferred on it.
