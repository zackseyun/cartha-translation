id: MAT.6.19
reference: Matthew 6:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: te
  text: భూమిమీద మీకోసం ధనసంపదలను కూడబెట్టుకోకండి. అక్కడ చిమ్మట, క్షయం[a] వాటిని నాశనం చేస్తాయి; అక్కడ దొంగలు గోడను తవ్వి చొరబడి[b] దొంగిలిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తుప్పు.’ గ్రీకు పదం లోహానికి పట్టే తుప్పును మాత్రమే కాకుండా, తినివేసే క్షయాన్ని లేదా ఇతర రకాల పాడైపోవడాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘తవ్వి లోనికి చొరబడతారు.’ మట్టితో చేసిన గోడలను దొంగలు తవ్వి లోపలికి ప్రవేశించడాన్ని ఇది సూచిస్తుండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: కూడబెట్టుకోకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థక రూపం నిషేధాన్ని తెలుపుతుంది. ‘కూడబెట్టుకోకండి’ ఆధునిక తెలుగులో సంపదను పోగుచేసే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑμῖν
  choice: మీకోసం
  rationale: ఇక్కడ దత్తి విభక్తి స్వప్రయోజన భావాన్ని కలిగి ఉంది; ‘మీకోసం’ ఆ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: θησαυροὺς
  choice: ధనసంపదలను
  rationale: విలువైన భౌతిక ఆస్తులను సూచించే విస్తృత భావాన్ని ఇది అందిస్తుంది; కేవలం నగదుకే పరిమితం చేయదు.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిమీద
  rationale: తదుపరి వచనంలోని పరలోక స్థానంతో ఉన్న వ్యత్యాసాన్ని కాపాడుతూ, తెలుగులో సహజమైన స్థానార్థక రూపాన్ని ఉపయోగిస్తుంది.
- source_word: σὴς
  choice: చిమ్మట
  rationale: దాచిన వస్త్రాలు మొదలైన వాటిని పాడుచేసే moth అనే అర్థానికి సాధారణ తెలుగు సమానం.
- source_word: βρῶσις
  choice: క్షయం
  rationale: ఈ పదం అక్షరార్థంగా తినివేయడం లేదా క్రమంగా నశింపజేయడం అనే విస్తృత భావాన్ని కలిగి ఉంది. ‘క్షయం’ లోహపు తుప్పుకే పరిమితం కాకుండా ఆ విస్తృతతను కాపాడుతుంది.
- source_word: ἀφανίζει
  choice: నాశనం చేస్తాయి
  rationale: కనుమరుగయ్యేలా చేయడం లేదా పూర్తిగా పాడుచేయడం అనే క్రియ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: κλέπται
  choice: దొంగలు
  rationale: మూలపదానికి నేరుగా సరిపడే సహజ తెలుగు పదం.
- source_word: διορύσσουσιν
  choice: గోడను తవ్వి చొరబడి
  rationale: క్రియకు అక్షరార్థంగా ‘తవ్వి దూసుకుపోవడం/చొరబడడం’ అనే భావం ఉంది; మట్టిగోడలను తవ్వి లోనికి ప్రవేశించే ప్రాచీన పద్ధతిని తెలుగులో అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
- source_word: κλέπτουσιν
  choice: దొంగిలిస్తారు
  rationale: దొంగతనం చేయడాన్ని తెలిపే ప్రామాణిక తెలుగు క్రియ.
theological_decisions:
- issue: γῆ యొక్క పరిధి
  choice: భూమిమీద
  alternative: లోకంలో
  rationale: ‘భూమిమీద’ మూలంలోని స్థలార్థాన్ని, వెంటనే వచ్చే పరలోక వ్యత్యాసాన్ని కాపాడుతుంది; ‘లోకంలో’ అనవసరమైన నైతిక లేదా తాత్త్విక భావాన్ని సూచించే అవకాశం ఉంది.
- issue: βρῶσις అనువాదం
  choice: క్షయం
  alternative: తుప్పు
  rationale: ‘తుప్పు’ సందర్భంలో సాధ్యమైనప్పటికీ లోహ క్షయానికే పరిమితమవుతుంది. మూలపదంలోని తినివేయడం, పాడుచేయడం అనే విస్తృత భావాన్ని ‘క్షయం’ మెరుగ్గా నిలుపుతుంది; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ధనసంపదలు’ భౌతిక విలువైన ఆస్తుల విస్తృత భావాన్ని ఇస్తుంది. మూలంలోని రెండు ὅπου భాగాలను ‘అక్కడ’తో సమాంతరంగా ఉంచి వాక్య నిర్మాణాన్ని స్పష్టంగా నిలిపాం.
