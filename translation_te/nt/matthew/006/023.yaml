  to: కాని నీ కన్ను చెడ్డదైతే[a], నీ శరీరమంతా చీకటిగా ఉంటుంది. కాబట్టి నీలో ఉన్న వెలుగే చీకటైతే, ఆ చీకటి ఎంత తీవ్రమైనదో!
