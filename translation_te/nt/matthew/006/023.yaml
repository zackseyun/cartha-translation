review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the conditional contrast, ‘your whole body,’ and the repeated light/darkness metaphor. ‘చెడ్డది’ suitably preserves the broad force of πονηρός without prematurely choosing ‘evil,’ defective, or stingy. The closing ‘ఎంత గొప్పది’ is less faithful idiomatically: in Telugu it can imply importance or greatness rather than the degree/intensity of the darkness expressed by πόσον.'
  naturalness: The wording is modern and clear overall. Replacing ‘ఆ చీకటి ఎంత గొప్పది!’ with ‘ఆ చీకటి ఎంత తీవ్రమైనదో!’ gives a natural Telugu exclamation and communicates the climactic force more accurately.
  terminology: ‘కన్ను,’ ‘శరీరమంతా,’ ‘వెలుగు,’ and ‘చీకటి’ are appropriate, consistent, and preserve the source metaphor. The footnote appropriately maintains the lexical and idiomatic alternatives; ‘అనారోగ్యమైనది’ is a more direct and natural equivalent for ‘unhealthy’ than ‘లోపమున్నది.’
  issues:
  - severity: medium
    issue: The final phrase ‘ఆ చీకటి ఎంత గొప్పది!’ may suggest that the darkness is important or admirable.
    rationale: Greek πόσον is an exclamatory expression of extent or intensity. ‘ఎంత తీవ్రమైనదో!’ conveys that force naturally without changing the metaphor.
