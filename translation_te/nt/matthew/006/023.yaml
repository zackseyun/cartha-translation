id: MAT.6.23
reference: Matthew 6:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: te
  text: కాని నీ కన్ను చెడ్డదైతే[a], నీ శరీరమంతా చీకటిగా ఉంటుంది. కాబట్టి నీలో ఉన్న వెలుగే చీకటైతే, ఆ చీకటి ఎంత తీవ్రమైనదో!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దుష్టమైనది,” “అనారోగ్యమైనది”; కన్నుకు సంబంధించిన నుడికారాన్ని, చుట్టుపక్కల సందర్భాన్ని బట్టి “ఉదారతలేనిది” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: చెడ్డది
  rationale: ఈ పదం చెడు, లోపభూయిష్టం, లేదా సందర్భానుసారంగా ఉదారతలేని కన్ను అనే భావాలను సూచించగలదు. ‘చెడ్డది’ అనే విస్తృత పదం రూపకంలోని ఉద్దేశపూర్వక అనిశ్చితిని నిలుపుతుంది.
- source_word: σκοτεινὸν
  choice: చీకటిగా
  rationale: గ్రీకు విశేషణపు విధేయార్థాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: φῶς
  choice: వెలుగు
  rationale: అంతర్గత గ్రహింపు లేదా నైతిక దృష్టిని సూచించే రూపకాన్ని వివరించి పరిమితం చేయకుండా మూలంలోని వెలుగు అనే పదాన్నే నిలుపుతుంది.
- source_word: σκότος
  choice: చీకటి
  rationale: వెలుగుతో ఉన్న రూపకాలంకార విరుద్ధతను, చివరి వాక్యంలోని బలమైన పునరుక్తిని నిలుపుతుంది.
- source_word: πόσον
  choice: ఎంత గొప్పది
  rationale: పరిమాణం లేదా తీవ్రతను తెలిపే ఆశ్చర్యార్థక, క్రియారహిత గ్రీకు వాక్యభాగపు బలాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ὀφθαλμός
  choice: కన్ను
  rationale: శారీరక అవయవం ద్వారా గ్రహింపు, ఉద్దేశం, నైతిక దిశను సూచించే మూల రూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: ὅλον τὸ σῶμά σου
  choice: నీ శరీరమంతా
  rationale: ὅλον తెలిపే సంపూర్ణతను సహజమైన తెలుగు పదక్రమంలో స్పష్టంగా నిలుపుతుంది.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: నీలో ఉన్న వెలుగు
  rationale: ‘అంతర్వెలుగు’ వంటి వ్యాఖ్యాత్మక పదాన్ని చేర్చకుండా గ్రీకు పదబంధానికి దగ్గరగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: ‘చెడ్డ కన్ను’ అనే రూపకానికి గల అర్థం
  choice: ప్రధాన పాఠంలో విస్తృతార్థమున్న ‘చెడ్డది’ అనే పదాన్ని ఉపయోగించి రూపకాన్ని తెరిచి ఉంచడం.
  alternative: ‘దుష్టమైన కన్ను’ అని నైతిక చెడును ప్రధానంగా చూపడం; ‘లోపమున్న/అనారోగ్యమైన కన్ను’ అని దృష్టిలోని లోపాన్ని చూపడం; లేదా సందర్భంలోని ధనం, ఔదార్యాన్ని బట్టి ‘పిసినారి కన్ను’ అని పేర్కొనడం.
  rationale: మత్తయి 6:19–24 సందర్భం నైతిక చీకటి, వక్రీకృత గ్రహింపు, అలాగే ఉదారతలేని కన్ను అనే సెమిటిక్ నుడికార భావం—ఇవన్నీ పరస్పరం మిళితమై ఉండే అవకాశాన్ని ఇస్తుంది. ఒక భావానికే పరిమితం చేయకుండా పాఠంలోని వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైనప్పటికీ సహజమైన శైలి వాడబడింది. వెలుగు–చీకటి రూపకం, ‘కన్ను’ అనే శారీరక రూపకం వివరించి తగ్గించకుండా నిలుపబడ్డాయి.
