revisions:
- from: 'అందుచేత, నీవు దానధర్మం చేసేటప్పుడు[a], వేషధారులు ప్రజలచేత ఘనత పొందాలనే ఉద్దేశంతో సమాజమందిరాల్లో, వీధుల్లో చేసినట్లు నీ ముందు బాకా ఊదకు[b]. నేను మీతో నిశ్చయంగా చెబుతున్నాను: వారు తమ ప్రతిఫలాన్ని పూర్తిగా పొందేశారు[c][d].'
  to: 'కాబట్టి, నీవు దానధర్మం చేసేటప్పుడు[a], కపటులు సమాజమందిరాల్లోను వీధుల్లోను ప్రజలచేత ఘనత పొందాలని[c] చేసే విధంగా, నీ ముందు బాకా ఊదకు[b]. నేను మీతో నిశ్చయంగా చెబుతున్నాను: వారు తమ ప్రతిఫలాన్ని పూర్తిగా పొందారు[d].'
  rationale: The revision preserves the source’s unresolved trumpet image and its purpose clause, while making the comparison clause explicit and natural in modern Telugu. It also corrects the misplaced c footnote anchor and retains each note only at the wording it documents.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:34:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft retains the principal Greek sense: charitable giving, the trumpet image without deciding whether it is literal or figurative, public recognition as the hypocrites’ purpose, and the completed-receipt force of ἀπέχουσιν. However, the comparison is syntactically less clear in Telugu than in Greek, and the footnote for δοξασθῶσιν is not anchored to its corresponding word.'
  naturalness: The proposed revision uses more natural clause order and the idiomatic connective pair “సమాజమందిరాల్లోను వీధుల్లోను.” “కపటులు” is a more direct modern-standard equivalent for ὑποκριταί in this moral context than “వేషధారులు.”
  terminology: “దానధర్మం,” “బాకా,” “సమాజమందిరాలు,” and “ప్రతిఫలం” are suitable biblical-register Telugu terms. “ఘనత పొందాలని” appropriately conveys the public-honor sense of δοξασθῶσιν without importing a doctrinal sense of divine glory.
  issues:
  - severity: medium
    issue: Footnote c lacks an anchor at “ఘనత పొందాలనే ఉద్దేశంతో.”
    rationale: Footnote c explains δοξασθῶσιν (“be glorified / praised / honored”), but it is presently attached after “పొందేశారు,” alongside a footnote on ἀπέχουσιν. Footnote anchors should attach to the words they explain.
  - severity: low
    issue: The comparison clause is awkwardly ordered and “వేషధారులు” is less direct than needed.
    rationale: 'The Greek comparison qualifies the prohibited trumpet-sounding: “as the hypocrites do in the synagogues and streets.” Reordering the Telugu makes this relationship clearer. “కపటులు” directly communicates the contextual ethical sense of ὑποκριταί.'
  - severity: low
