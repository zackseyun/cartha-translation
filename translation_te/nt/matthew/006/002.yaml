id: MAT.6.2
reference: Matthew 6:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: te
  text: 'కాబట్టి, నీవు దానధర్మం చేసేటప్పుడు[a], కపటులు సమాజమందిరాల్లోను వీధుల్లోను ప్రజలచేత ఘనత పొందాలని[c] చేసే విధంగా, నీ ముందు బాకా ఊదకు[b]. నేను మీతో నిశ్చయంగా చెబుతున్నాను: వారు తమ ప్రతిఫలాన్ని పూర్తిగా పొందారు[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అవసరంలో ఉన్నవారికి ఇచ్చేటప్పుడు,’ ‘కరుణాకార్యాలు చేసేటప్పుడు.’ గ్రీకు వ్యక్తీకరణ దాతృత్వంగా ఇవ్వడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నీ ముందు బాకా ఊదకు.’ ఇది అతిశయోక్తి లేదా రూపకం కావచ్చు; అయితే గ్రీకు పాఠ్యం బాకా ఊదడమనే చిత్రాన్నే ఉపయోగిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘ప్రజలచేత ప్రశంస పొందాలని’ లేదా ‘గౌరవం పొందాలని.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘మహిమపరచబడడం’ అనే బలమైన భావం ఉంది.
    reason: lexical_alternative
  - marker: d
    text: ‘ప్రతిఫలాన్ని పూర్తిగా పొందారు’ అనేది లావాదేవీలకు సంబంధించిన గ్రీకు నుడికారం; వారికి దక్కబోయే ప్రతిఫలమంతా ఇప్పటికే దక్కిందనే భావం.
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: అందుచేత, ... చేసేటప్పుడు
  rationale: Ὅταν తో ఉన్న subjunctive సాధారణంగా లేదా పునరావృతంగా సంభవించే సందర్భాన్ని సూచిస్తుంది; తెలుగు ‘చేసేటప్పుడు’ దానిని సహజంగా తెలియజేస్తుంది. ‘అందుచేత’ οὖν ద్వారా ముందరి బోధతో ఉన్న అనుసంధానాన్ని నిలుపుతుంది.
- source_word: ποιῇς ἐλεημοσύνην
  choice: దానధర్మం చేసేటప్పుడు
  rationale: ఈ గ్రీకు నుడికారం అవసరంలో ఉన్నవారికి దానం చేయడాన్ని సూచిస్తుంది. ‘దానధర్మం చేయడం’ ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమయ్యే సంక్షిప్త వ్యక్తీకరణ; ప్రత్యామ్నాయ అర్థాలను [a]లో ఇచ్చాం.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: నీ ముందు బాకా ఊదకు
  rationale: మూలంలోని స్పష్టమైన బాకా చిత్రాన్ని అలంకారమని ముందుగానే తేల్చకుండా నిలిపాం. ἔμπροσθέν σου ను సహజమైన ‘నీ ముందు’గా అనువదించాం.
- source_word: οἱ ὑποκριταί
  choice: వేషధారులు
  rationale: బయటికి భక్తిని ప్రదర్శిస్తూ వేరే ఉద్దేశం కలిగిన వారిని సందర్భానుసారంగా సూచిస్తుంది. ‘వేషధారులు’ సాధారణ తెలుగు పాఠకులకు స్పష్టంగా ఉండి నటన/కపట ప్రదర్శన భావాన్ని నిలుపుతుంది.
- source_word: ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις
  choice: సమాజమందిరాల్లో, వీధుల్లో
  rationale: συναγωγή కి స్థిరపడిన తెలుగు సమానార్థకంగా ‘సమాజమందిరం’ను, బహిరంగ ప్రదర్శన జరిగే ῥύμαις కి సహజంగా ‘వీధులు’ను ఎంచుకున్నాం.
- source_word: ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: ప్రజలచేత ఘనత పొందాలనే ఉద్దేశంతో
  rationale: ὅπως ఉద్దేశాన్ని సూచిస్తుంది. δοξάζω యొక్క బలమైన గౌరవం/మహిమపరచడం భావాన్ని ‘ఘనత పొందడం’ సహజ తెలుగులో నిలుపుతుంది; ἀνθρώπων ఇక్కడ స్త్రీపురుషులందరినీ సాధారణంగా సూచిస్తున్నందున ‘ప్రజలు’ అని ఇచ్చాం.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిశ్చయంగా చెబుతున్నాను
  rationale: యేసు మాటకు గంభీరమైన ధృవీకరణనిచ్చే సూత్రవాక్యాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: వారు తమ ప్రతిఫలాన్ని పూర్తిగా పొందేశారు
  rationale: ἀπέχω ఇక్కడ లావాదేవీ సంబంధమైన నుడికారంగా ‘పూర్తిగా అందుకోవడం’ అనే భావాన్ని ఇస్తుంది. పూర్తి అయిన స్వీకరణను ‘పొందేశారు’ తెలియజేస్తుంది.
theological_decisions:
- issue: δοξασθῶσιν యొక్క బలాన్ని ఎలా వ్యక్తం చేయాలి
  choice: ఘనత పొందాలని
  alternative: ప్రశంస పొందాలని / మహిమ పొందాలని
  rationale: ‘ప్రశంస’ మూలపద బలాన్ని కొంత తగ్గించవచ్చు; ‘మహిమ పొందడం’ ఈ సందర్భంలో తెలుగు వాడుకలో అసహజంగా లేదా దేవునికి సంబంధించిన ప్రత్యేక భావంగా వినిపించవచ్చు. ‘ఘనత పొందడం’ మానవుల నుంచి గౌరవం కోరే భావాన్ని నిలుపుతుంది.
- issue: ἀνθρώπων ను లింగసామాన్యంగా వ్యక్తం చేయడం
  choice: ప్రజలచేత
  alternative: మనుష్యులచేత / ఇతరులచేత
  rationale: ఇక్కడ పదం పురుషులను మాత్రమే కాక మానవ వీక్షకులను సాధారణంగా సూచిస్తుంది. ‘ప్రజలు’ మూల ఉద్దేశాన్ని లింగభేదం లేకుండా సహజంగా తెలియజేస్తుంది.
- issue: బాకా ఊదడం అక్షరార్థమా, అతిశయోక్తా అనే ప్రశ్న
  choice: మూలంలోని చిత్రాన్ని ‘నీ ముందు బాకా ఊదకు’గా నిలుపడం
  alternative: నీ దానాన్ని ప్రచారం చేసుకోకు
  rationale: ఇది నిజమైన ఆచారమా, అతిశయోక్తా, రూపకమా అన్నది వాక్యం స్వయంగా తేల్చదు. అందువల్ల వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయకుండా మూలచిత్రాన్ని నిలిపాం.
- issue: ప్రతిఫలం స్వభావం
  choice: తమ ప్రతిఫలాన్ని పూర్తిగా పొందేశారు
  alternative: వారికి ఇక మరే ప్రతిఫలమూ లేదు
  rationale: లావాదేవీ నుడికారంలోని సంపూర్ణ స్వీకరణను అనువదించాం; దేవుని ప్రతిఫలం గురించి సందర్భం సూచించే తాత్పర్యాన్ని ప్రధాన పాఠ్యంలో అదనపు వివరణగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బోధనా శైలిని వాడాం. ‘దానధర్మం,’ ‘వేషధారులు,’ ‘సమాజమందిరాలు,’ ‘ప్రతిఫలం’ వంటి పదాలు స్పష్టతతో పాటు బైబిలు సందర్భ గంభీరతను నిలుపుతాయి. ఏకవచన ‘నీవు’ నుంచి బహువచన ‘మీతో’కు మార్పు గ్రీకు మూలంలోని సంఖ్యా మార్పును యథాతథంగా ప్రతిబింబిస్తుంది.
