id: MAT.6.21
reference: Matthew 6:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: te
  text: ఎందుకంటే నీ సంపద ఎక్కడ ఉందో, అక్కడే నీ హృదయం కూడా ఉంటుంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, కాలాతీత సాధారణ సత్యంగా: “నీ సంపద ఎక్కడ ఉందో, అక్కడే నీ హృదయం కూడా ఉంది.” అయితే గ్రీకు మూలంలోని చివరి క్రియ భవిష్యత్ కాలంలో ఉంది: “ఉంటుంది.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: ఎక్కడ
  rationale: స్థానాన్ని సూచించే సంబంధవాచక ఉపవాక్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ἐκεῖతో కలిసి ‘ఎక్కడ… అక్కడే’ అనే సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందున్న బోధకు ఈ వాక్యం ఇచ్చే వివరణాత్మక కారణ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: θησαυρός
  choice: ధనం
  rationale: సందర్భంలో కూడబెట్టిన విలువైన సంపదను సూచిస్తూ, అక్షరార్థం మరియు రూపకాలంకార భావం రెండింటినీ సాధారణ పాఠకునికి సహజంగా అందిస్తుంది.
- source_word: σου
  choice: నీ
  rationale: ‘ధనం,’ ‘హృదయం’ రెండింటితోనూ ఉన్న ఏకవచన ద్వితీయ పురుష స్వామ్యాన్ని నిలుపుతుంది.
- source_word: ἐκεῖ
  choice: అక్కడే
  rationale: ὅπουతో ఉన్న ‘ఎక్కడ… అక్కడే’ అనుసంధానాన్ని నిలుపుతూ, ఆ స్థానంపైనే ఉన్న ఉద్ఘాటనను ‘-ఏ’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔσται
  choice: ఉంటుంది
  rationale: తెలుగులో ఇది సందర్భానుసారంగా భవిష్యత్ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. గ్రీకు క్రియ భవిష్యత్ కాలంలో ఉందని పాదటిప్పణి స్పష్టం చేస్తుంది.
- source_word: καρδία
  choice: హృదయం
  rationale: కోరికలు, నిబద్ధత, అంతరంగ దిశ వంటి విస్తృత భావపరిధిని కుదించకుండా నిలుపే స్థిరమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: καὶ
  choice: కూడా
  rationale: ధనం ఉన్న చోటుతో హృదయాన్ని అనుసంధానించే అదనపు భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: జ్ఞానోక్తి వంటి ఈ వాక్యంలో ἔσται యొక్క కాలభావం
  choice: ప్రధాన పాఠ్యంలో ‘ఉంటుంది’ అని ఉంచి, గ్రీకులో అది భవిష్యత్ కాలమని పాదటిప్పణిలో స్పష్టం చేయడం
  alternative: కాలాతీత సాధారణ సత్యంగా ‘ఉంది’ అని అనువదించడం
  rationale: గ్రీకు పాఠ్యంలో రెండవ క్రియ భవిష్యత్ రూపంలో ఉంది. తెలుగు ‘ఉంటుంది’ భవిష్యత్ భావాన్ని సహజంగా మోయగలదు; పాదటిప్పణి దాని కాలబలాన్ని స్పష్టం చేస్తుంది. ఇలా చేయడం ద్వారా హృదయం ధనం ఉన్న చోటుకు అనుసరించే దిశాత్మక భావాన్ని చెరపకుండా, తెలుగును అసహజంగా చేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి సులభంగా అర్థమయ్యేలా, అయినా గౌరవప్రదంగా ఉంది. ‘హృదయం’ అనే పదం మూలంలోని విస్తృత అంతరంగ భావాన్ని నిలుపుతుంది. సంబోధన ఏకవచనంగా ఉంది.
