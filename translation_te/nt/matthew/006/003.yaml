  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: te
  text: కానీ నీవు పేదవారికి దానం చేసేటప్పుడు[a], నీ కుడిచేయి ఏమి చేస్తుందో నీ ఎడమచేతికి తెలియనివ్వకు.
  philosophy: optimal-equivalence
  footnotes:
