    text: లేదా, ‘ధర్మదానం చేసేటప్పుడు’; గ్రీకు పదం పేదవారికి చేసే దానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: కానీ నీవు ... చేసేటప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా ఇచ్చి, δέ సూచించే ముందటి వాక్యంతోని వ్యత్యాసాన్ని ‘కానీ’తో నిలిపాము.
- source_word: ἐλεημοσύνην
  choice: పేదవారికి దానం
  rationale: ఈ గ్రీకు పదం సాధారణ దయకన్నా ముఖ్యంగా పేదలకు చేసే ధర్మదానాన్ని సూచిస్తుంది. ఆధునిక పాఠకులకు స్పష్టంగా ఉండేందుకు ‘పేదవారికి దానం’ అని అనువదించాము.
- source_word: μὴ γνώτω
  choice: తెలియనివ్వకు
  rationale: μήతో కూడిన మూడవ పురుష ఆజ్ఞార్థక రూపాన్ని సహజమైన తెలుగు నిషేధాజ్ఞగా ఇచ్చాము; చేతులను వ్యక్తులుగా చూపే మూలంలోని సజీవ రూపకాన్ని కాపాడాము.
- source_word: ἡ ἀριστερά σου
  choice: నీ ఎడమచేతికి
  rationale: మూలంలోని చేతి రూపకాన్ని నేరుగా నిలిపి, ‘తెలియడం’ అనే క్రియకు సహజమైన తెలుగు చతుర్థీ విభక్తిని వాడాము.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: నీ కుడిచెయ్యి చేసేది
  rationale: వర్తమానకాల ποιεῖ భావాన్ని సహజమైన తెలుగు సంబంధవాచక నిర్మాణంలో వ్యక్తపరచి, మూలంలోని సంక్షిప్తతను నిలిపాము.
theological_decisions:
- issue: ఎడమచేతికి కుడిచెయ్యి చేసేది తెలియకూడదనే మాట యొక్క అర్థం
  choice: దానం చేసేటప్పుడు స్వప్రదర్శనకు చోటులేని అత్యంత గోప్యతను బోధించే సజీవ రూపకంగా యథాతథంగా ఉంచడం
  alternative: దీనిని సాధారణ వినయానికి వివరణాత్మక ఉపమానంగా మార్చడం, లేదా ఏ విధమైన బహిరంగ దానాన్నైనా పూర్తిగా నిషేధించేదిగా స్పష్టం చేయడం
  rationale: వాక్యం అతిశయోక్తితో కూడిన వ్యక్తీకరణను ఉపయోగిస్తుంది. దాని రూపకాన్ని అనువాదంలో నిలపడం వల్ల యేసు ఉద్ఘాటించిన గుప్త దాతృత్వం స్పష్టమవుతుంది; అయితే పాఠ్యంలో లేని సంపూర్ణ నియమాన్ని చేర్చడం జరగదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం వాడబడింది. ‘కుడిచెయ్యి/ఎడమచేతి’ అనే సాధారణ రూపాలు మూలంలోని జ్ఞాపకార్థక సమాంతర రూపకాన్ని కాపాడుతాయి.
