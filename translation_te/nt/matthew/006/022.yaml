source:
  edition: SBLGNT
  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: te
  text: “కన్ను శరీరానికి దీపం. కాబట్టి, నీ కన్ను ఆరోగ్యంగా[a] ఉంటే, నీ శరీరమంతా వెలుగుతో నిండివుంటుంది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఏకమైనది,” “స్పష్టమైనది,” లేదా “సక్రమమైనది” అని అనువదించవచ్చు. గ్రీకు పదం అవిభక్తమైన లేదా ఏకాగ్రమైన భావాన్ని కూడా సూచించగలదు; కొన్ని సందర్భాల్లో “ఉదారమైన” అనే భావం కూడా కలిగి ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: దీపం
  rationale: అమూర్తమైన ‘వెలుగు’ కంటే, ఈ గ్రీకు పదం సాధారణంగా వెలిగించే దీపాన్ని సూచిస్తుంది; కన్నును శరీరానికి దీపంగా చూపే స్పష్టమైన రూపకాన్ని ఇది నిలుపుతుంది.
- source_word: σῶμα
  choice: శరీరం
  rationale: శారీరక రూపకానికి సహజమైన, ప్రామాణిక తెలుగు పదం.
- source_word: ὀφθαλμός
  choice: కన్ను
  rationale: భౌతిక అర్థాన్నీ నైతిక రూపకాన్నీ నిలిపే సహజమైన తెలుగు పదం.
- source_word: ἐὰν οὖν
  choice: కాబట్టి, ... ఉంటే
  rationale: οὖν ముందున్న వాక్యం నుంచి వచ్చే నిర్ధారణను సూచిస్తుంది; షరతుతో కూడిన భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἁπλοῦς
  choice: ఆరోగ్యంగా
  rationale: కన్ను, వెలుగు అనే తక్షణ రూపకంలో సరిగా పనిచేసే కన్ను అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది. మూలపదంలోని ‘ఏకాగ్రమైన/నిష్కపటమైన/ఉదారమైన’ భావసాధ్యతలను పాదసూచికలో ఉంచాం.
- source_word: ὅλον
  choice: అంతా
  rationale: శరీరం మొత్తాన్ని సమగ్రంగా సూచించే సహజమైన ప్రయోగం.
- source_word: φωτεινὸν
  choice: వెలుగుతో నిండివుంటుంది
  rationale: అక్షరార్థంలోని ‘వెలుగైన/ప్రకాశవంతమైన’ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేసి, శరీరమంతటిపై వెలుగు ప్రభావాన్ని నిలుపుతుంది.
- source_word: ἔσται
  choice: నిండివుంటుంది
  rationale: గ్రీకు భవిష్యత్ కాలాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: కన్ను గురించి వాడిన ἁπλοῦς అనే పదం యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘ఆరోగ్యంగా’
  alternative: ఏకాగ్రంగా, నిష్కపటంగా, లేదా ఉదారంగా
  rationale: తక్షణ సందర్భంలో కన్ను శరీరానికి దీపమని చెప్పి, తరువాతి వచనంలో చెడ్డ కన్నుతో వ్యత్యాసం చూపుతారు. అందువల్ల చూపు సరిగా పనిచేసే భావం ప్రధాన పాఠ్యంలో సహజం. అయితే పదానికి ఉన్న నైతిక, అవిభక్తత, ఉదారత సంబంధిత భావాలను తొలగించకుండా పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని వాడాం. ‘శరీరానికి దీపం కన్ను’ అనే సంక్షిప్త నిర్మాణం మూలంలోని రూపకబలాన్ని నిలుపుతుంది.
