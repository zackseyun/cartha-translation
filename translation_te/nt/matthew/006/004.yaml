id: MAT.6.4
reference: Matthew 6:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: te
  text: నీ పేదలకు ఇచ్చే దానం[a] రహస్యంగా ఉండేలా చేయి; రహస్యంగా చూసే నీ తండ్రి నీకు ప్రతిఫలం ఇస్తాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భిక్షాదానం.’ గ్రీకు పదం ప్రత్యేకంగా పేదలకు ఇచ్చే దానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీకు తిరిగి చెల్లిస్తాడు.’
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως ᾖ
  choice: ఉండేలా చేయి
  rationale: ὅπωςతో వచ్చిన ఉద్దేశ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ‘చేయి’ అనేది ముందటి వచనంలోని ఆజ్ఞకు ఈ వాక్యం ఆధారపడుతున్న సంగతిని స్పష్టంగా చేస్తుంది; కొత్త ఆజ్ఞను జోడించదు.
- source_word: ἐλεημοσύνη
  choice: పేదలకిచ్చే దానం
  rationale: ఇది సాధారణ దయను లేదా ఏ దానాన్నైనా కాక, ప్రత్యేకంగా పేదలకు ఇచ్చే దానాన్ని సూచిస్తుంది. ఈ అర్థాన్ని ఆధునిక పాఠకులకు నేరుగా తెలియజేస్తుంది.
- source_word: ἐν τῷ κρυπτῷ
  choice: రహస్యంగా
  rationale: ప్రజల దృష్టికి కనబడకుండా చేయడమనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది. రెండు ఉపవాక్యాల్లోనూ ఉన్న ‘రహస్య’ భావాన్ని నిలుపుతుంది.
- source_word: ὁ πατήρ σου
  choice: నీ తండ్రి
  rationale: మూలంలో ‘పరలోకపు’ అనే విశేషణం లేదు కాబట్టి దాన్ని చేర్చలేదు.
- source_word: ὁ βλέπων
  choice: చూసే
  rationale: గ్రీకు కృదంతాన్ని తెలుగులో సహజమైన సంబంధార్థక రూపంతో అనువదిస్తుంది.
- source_word: ἀποδώσει σοι
  choice: నీకు ప్రతిఫలం ఇస్తాడు
  rationale: దేవుని అనుకూల ప్రతిస్పందనను తెలియజేస్తూ, ఆ ప్రతిఫలం భౌతికమా, ఆత్మీయమా, ప్రస్తుతమా, భవిష్యత్తులోనిదా అన్నది నిర్దేశించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ἀποδώσει సూచించే దైవిక ప్రతిఫల స్వభావం
  choice: నీకు ప్రతిఫలం ఇస్తాడు
  alternative: నీకు తిరిగి చెల్లిస్తాడు
  rationale: ‘ప్రతిఫలం ఇస్తాడు’ అనేది సందర్భంలోని అనుకూల భావాన్ని సహజంగా అందిస్తుంది; అయితే ప్రతిఫలం ఏ రూపంలో ఉంటుందో నిర్ణయించదు. మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి వాడబడింది. వచనం ముందటి ఆజ్ఞకు కొనసాగింపుగా ఉన్నందున ὅπως ᾖ యొక్క ఉద్దేశ భావాన్ని ‘ఉండేలా చేయి’గా సహజీకరించాం. మూలంలో లేని ‘పరలోకపు’ అనే పదాన్ని చేర్చలేదు.
