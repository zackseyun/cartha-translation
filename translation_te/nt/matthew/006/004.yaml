    rationale: Greek says literally ‘your Father, the one seeing in secret,’ repeating the same phrase used in the first clause. The added ‘జరిగేదాన్ని’ is not required and slightly restricts the wording. A direct repeated Telugu expression preserves the source’s compact phrasing better.
