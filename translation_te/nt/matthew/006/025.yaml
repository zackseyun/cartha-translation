revisions:
- from: 'అందుకే నేను మీతో చెబుతున్నాను: మీ ప్రాణం గురించి—ఏమి తింటామా అని—మీ శరీరం గురించి—ఏమి ధరించుకుంటామా అని—ఆందోళన పడకండి. ఆహారం కంటే ప్రాణం, వస్త్రం కంటే శరీరం గొప్పవి కావా? [a]'
