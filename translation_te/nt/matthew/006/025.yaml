id: MAT.6.25
reference: Matthew 6:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: te
  text: 'అందుకే నేను మీతో చెబుతున్నాను: మీ జీవితం[a] గురించి—ఏమి తింటామో అని—మీ శరీరం గురించి—ఏమి ధరించుకుంటామో అని—ఆందోళన పడకండి. జీవితం ఆహారం కంటే, శరీరం వస్త్రం కంటే మించినవి కావా?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘జీవితం’కు ప్రత్యామ్నాయంగా ‘ఆత్మ’ అని కూడా అనువదించవచ్చు (గ్రీకు ψυχή); అయితే ఇక్కడ తినడం, వస్త్రధారణ గురించిన సందర్భం ‘జీవితం’ అనే అర్థానికి అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: అందుకే
  rationale: ముందున్న బోధన నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μεριμνᾶτε
  choice: ఆందోళన పడకండి
  rationale: అవసరాల గురించి కలతతో మునిగిపోవడాన్ని సూచిస్తుంది; సాధారణ పాఠకులకు స్పష్టమైన ప్రయోగం.
- source_word: ψυχῇ / ψυχὴ
  choice: ప్రాణం
  rationale: తినడం, ఆహారం అనే సందర్భంలో ఇది అమూర్తమైన ఆత్మను ప్రత్యేకంగా కాక, జీవితం లేదా సజీవ ప్రాణాన్ని సూచిస్తుంది; ‘ప్రాణం’ మూలపదంలోని భావపరిధిని కొంత నిలుపుతుంది.
- source_word: τί φάγητε
  choice: ఏమి తింటామా అని
  rationale: ఆందోళనకు విషయమైన భవిష్యత్ అవసరాన్ని సహజమైన తెలుగు పరోక్ష ప్రశ్నగా అందిస్తుంది.
- source_word: σώματι / σῶμα
  choice: శరీరం
  rationale: వస్త్రంతో వ్యత్యాసంలో ఉన్న భౌతిక దేహాన్ని నేరుగా సూచిస్తుంది.
- source_word: τί ἐνδύσησθε
  choice: ఏమి ధరించుకుంటామా అని
  rationale: దుస్తులు వేసుకోవడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐχὶ
  choice: కావా?
  rationale: అవును అనే సమాధానాన్ని ఆశించే గ్రీకు అలంకార ప్రశ్న బలాన్ని నిలుపుతుంది.
- source_word: πλεῖόν
  choice: గొప్పవి
  rationale: ఆహారం, వస్త్రం కంటే ప్రాణం, శరీరం అధిక ప్రాముఖ్యత కలవని తెలిపే తులన; తెలుగులో సహజమైన వాక్య నిర్మాణం కోసం బహువచన సమన్వయం వాడబడింది.
- source_word: τροφῆς
  choice: ఆహారం
  rationale: జీవాన్ని పోషించే ఆహారాన్ని స్పష్టంగా, గౌరవప్రదమైన సాధారణ పదంతో తెలుపుతుంది.
- source_word: ἐνδύματος
  choice: వస్త్రం
  rationale: ధరించే దానిని సాధారణ సమష్టి భావంలో సూచించి ‘ఆహారం’తో సమాంతరతను నిలుపుతుంది.
theological_decisions:
- issue: ψυχή అనే పదం యొక్క సందర్భార్థం
  choice: ప్రాణం
  alternative: జీవితం; ఆత్మ
  rationale: తినడం మరియు ఆహారం గురించిన తక్షణ సందర్భం భౌతిక జీవితాన్ని సూచిస్తుంది. ‘ఆత్మ’ అని అనువదిస్తే ఈ వచనం స్పష్టంగా చేయని దేహం–అమూర్త ఆత్మ విభజనను దిగుమతి చేసే ప్రమాదం ఉంది; ‘ప్రాణం’ మూలపదంలోని జీవితం/స్వయం భావాన్ని నిలుపుతుంది.
- issue: πλεῖόν యొక్క తులనాత్మక భావం
  choice: గొప్పవి
  alternative: ఎక్కువ విలువైనవి; మించినవి
  rationale: మూలంలో తులన నిజమే అయినా అది ఖచ్చితంగా ఆర్థిక ‘విలువ’కే పరిమితం కాదు. ‘గొప్పవి’ ప్రాముఖ్యత, అధికత్వం రెండింటినీ తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; బోధనా గాంభీర్యాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ‘మీ ప్రాణం గురించి… మీ శరీరం గురించి…’ అనే సమాంతర నిర్మాణం గ్రీకు వాక్యంలోని తులనను కాపాడుతుంది.
