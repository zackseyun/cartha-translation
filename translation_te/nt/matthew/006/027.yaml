id: MAT.6.27
reference: Matthew 6:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: te
  text: మీలో ఎవరు ఆందోళన చెందడం వల్ల తన జీవితకాలానికి[a] ఒక్క మూరైనా చేర్చగలరు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన ఎత్తుకు ఒక్క మూరైనా.” ఇక్కడి గ్రీకు పదానికి “వయస్సు/జీవితకాలం” లేదా “ఎత్తు” అనే అర్థాలు రావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: మీలో ఎవరు
  rationale: τίς ... ἐξ ὑμῶν అనే ప్రయోగం సహజంగా ‘మీలో ఎవరు’ అనే అర్థమిస్తుంది. δέ ఇక్కడ స్వల్ప అనుసంధానకంగా ఉంది; తెలుగులో ప్రత్యేక పదం చేర్చకుండానే సందర్భ ప్రవాహం సహజంగా నిలుస్తుంది.
- source_word: μεριμνῶν
  choice: ఆందోళన చెందడం వల్ల
  rationale: μεριμνάω ఆందోళనపడడం లేదా చింతించడాన్ని సూచిస్తుంది. కృదంతానికి ఇక్కడ సాధన/కారణ భావం ఉండటంతో ‘వల్ల’ దాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δύναται
  choice: చేర్చగలరు
  rationale: δύναμαι సామర్థ్యాన్ని తెలియజేస్తుంది; తెలుగులో ‘గలరు’ సహజమైన ప్రశ్నారూపాన్ని ఇస్తుంది.
- source_word: προσθεῖναι
  choice: చేర్చగలరు
  rationale: προστίθημι యొక్క ‘చేర్చు’ అనే మూల చిత్రాన్ని నిలుపుతుంది; తదుపరి కొలతతో ఉన్న రూపకాన్ని అనవసరంగా వివరించదు.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: తన జీవితకాలానికి
  rationale: ἡλικίαకు ‘వయస్సు/జీవితకాలం’ లేదా ‘ఎత్తు’ అనే అర్థాలు రావచ్చు. ఆందోళన మరియు జీవితం గురించిన సందర్భంలో ‘జీవితకాలం’ ప్రధాన పాఠంగా ఎంచుకోబడింది; నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో నిలిపాం. αὐτοῦ యొక్క ప్రతినిధి ఏకవచన భావాన్ని ‘తన’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πῆχυν ἕνα
  choice: ఒక్క మూరైనా
  rationale: πῆχυς మోచేతి నుంచి వేళ్ల కొనవరకు ఆధారమైన ప్రాచీన పొడవు కొలత, అంటే ‘మూర.’ ‘ఒక్క ... అయినా’ మూలంలోని ‘ఒకటి’ అనే పరిమాణాన్ని, అలంకార ప్రశ్న బలాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ఈ మాటలో ἡλικία యొక్క అర్థం
  choice: జీవితకాలం
  alternative: ఎత్తు
  rationale: ప్రాణం గురించి చింతించవద్దనే విస్తృత సందర్భంలో ‘జీవితకాలం’ సార్ధకంగా ఉంటుంది. అయితే పొడవు కొలతైన ‘మూర’తో కలిసినప్పుడు ‘ఎత్తు’ కూడా నిఘంటుపరంగా సాధ్యమైన, సాంప్రదాయిక పఠనం. అందువల్ల ప్రధాన పాఠంలో ఒక అర్థాన్ని ఎంచుకుని, మరొకదాన్ని పాదసూచికలో స్పష్టంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ప్రాచీన కొలతను ఆధునిక ప్రమాణంలోకి మార్చకుండా ‘మూర’గా ఉంచి మూల రూపకాన్ని కాపాడాం.
