id: MAT.6.14
reference: Matthew 6:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: te
  text: ఎందుకంటే, మీరు మనుషుల అపరాధాలను[a] క్షమిస్తే, పరలోకస్థుడైన మీ తండ్రి[b] కూడా మిమ్మల్ని క్షమిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అతిక్రమాలను,’ ‘తప్పులను,’ లేదా ‘చేసిన అన్యాయాలను’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం నైతిక తప్పటడుగులను లేదా అపరాధాలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా, ‘మీ తండ్రి, పరలోకస్థుడు’; సంప్రదాయంగా, ‘పరలోకంలో ఉన్న మీ తండ్రి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: ఎందుకంటే, … క్షమిస్తే
  rationale: γάρ ముందున్న ప్రార్థనతో వివరణాత్మక సంబంధాన్ని చూపుతుంది; ἐάν మరియు aorist subjunctive నిజమైన షరతును తెలియజేస్తాయి. అందువల్ల కారణసూచకమైన ‘ఎందుకంటే’తో పాటు సహజమైన తెలుగు షరతురూపం ‘-తే’ వాడబడింది.
- source_word: ἀφῆτε / ἀφήσει
  choice: క్షమిస్తే / క్షమిస్తాడు
  rationale: ఈ నైతిక-సంబంధ సందర్భంలో ἀφίημι అంటే ‘క్షమించు’. రెండు రూపాల్లోనూ ఒకే మూలక్రియను ఉంచడం వాక్యంలోని పరస్పర సంబంధాన్ని నిలుపుతుంది.
- source_word: τοῖς ἀνθρώποις … αὐτῶν
  choice: మనుషుల
  rationale: ἄνθρωποι ఇక్కడ పురుషులను మాత్రమే కాక సాధారణంగా మనుషులను సూచిస్తుంది. గ్రీకులోని దత్తివిభక్తి మరియు స్వామ్యసర్వనామ సంబంధం తెలుగులో సహజంగా ‘మనుషుల అపరాధాలను క్షమించడం’ అనే నిర్మాణంలో వ్యక్తమవుతుంది.
- source_word: τὰ παραπτώματα
  choice: అపరాధాలను
  rationale: παράπτωμα నైతిక తప్పటడుగు, అతిక్రమం లేదా ఇతరునికి చేసిన తప్పును సూచిస్తుంది. ‘అపరాధాలు’ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉండి నైతిక-సంబంధ భావాన్ని నిలుపుతుంది.
- source_word: καὶ ὑμῖν
  choice: కూడా మిమ్మల్ని
  rationale: καί తెలిపే అనురూపతను ‘కూడా’ నిలుపుతుంది. ὑμῖν అనే దత్తివిభక్తి క్షమించడం అనే తెలుగు క్రియతో సహజంగా ‘మిమ్మల్ని’గా వ్యక్తమవుతుంది.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: పరలోకస్థుడైన మీ తండ్రి
  rationale: రెండవ నిర్దేశకంతో వచ్చిన οὐράνιος ‘తండ్రి’ని పరలోకానికి చెందినవాడిగా విశేషిస్తుంది. ‘పరలోకస్థుడైన మీ తండ్రి’ మూలంలోని బలాన్ని నిలుపుతూ సహజమైన, గౌరవప్రదమైన తెలుగును ఇస్తుంది.
theological_decisions:
- issue: మనుషుల క్షమాపణకు దేవుని క్షమాపణకు మధ్య ఉన్న షరతుతో కూడిన సంబంధం
  choice: ‘మీరు … క్షమిస్తే … మీ తండ్రి కూడా మిమ్మల్ని క్షమిస్తాడు’ అని షరతును నేరుగా అనువదించడం
  alternative: మనుషుల క్షమాపణ దేవుని క్షమాపణను సంపాదిస్తుందని బలంగా కారణార్థం చేర్చడం; లేదా అది ముందే పొందిన దేవుని క్షమాపణకు కేవలం సాక్ష్యమని వివరణాత్మకంగా మార్చడం
  rationale: గ్రీకు వాక్యం స్పష్టమైన షరతును ఉంచుతుంది గాని దాని విస్తృత సిద్ధాంత సంబంధాన్ని ఇక్కడ వివరించదు. అందువల్ల ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ చేర్చకుండా వాక్యంలోని దైవశాస్త్రీయ ఉద్రిక్తతను యథాతథంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఎందుకంటే’ ముందున్న సందర్భంతో సంబంధాన్ని స్పష్టం చేస్తుంది; ‘పరలోకస్థుడైన’ మూలంలోని attributive నిర్మాణాన్ని అసహజత లేకుండా నిలుపుతుంది.
