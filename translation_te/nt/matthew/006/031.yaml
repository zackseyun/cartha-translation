id: MAT.6.31
reference: Matthew 6:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: te
  text: కాబట్టి, ‘మేమేమి తింటాం?’ లేదా ‘ఏమి తాగుతాం?’ లేదా ‘ఏమి ధరించుకుంటాం?’ అని చింతించకండి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆందోళనపడకండి.’
    reason: μεριμνάω అనే పదంలోని కలవరపూరిత చింత భావానికి సమీపమైన తెలుగు ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: కాబట్టి ... చింతించకండి
  rationale: οὖν ముందున్న బోధన నుంచి వచ్చే నిర్ధారణను ‘కాబట్టి’గా తెలియజేస్తుంది. μεριμνάω ఇక్కడ జీవనావసరాల గురించిన కలవరపూరిత చింతను సూచిస్తుంది; ‘చింతించకండి’ సహజమైన ఆధునిక తెలుగు నిషేధ రూపం.
- source_word: λέγοντες
  choice: అని
  rationale: చింతకు తోడుగా పలికే మూడు ప్రత్యక్ష ప్రశ్నలను తెలుగులో సహజంగా ‘అని’తో కలిపింది.
- source_word: Τί φάγωμεν;
  choice: మేమేమి తింటాం?
  rationale: మొదటి పురుష బహువచన deliberative ప్రశ్నను సహజ తెలుగు భవిష్యదర్థంలో వ్యక్తపరుస్తుంది. ప్రశ్నార్థక ‘ఏమి’కి ముందు ‘మేము’ సంధిలో ‘మేమేమి’ అవుతుంది.
- source_word: Τί πίωμεν;
  choice: ఏమి తాగుతాం?
  rationale: φάγωμενకు సమాంతరంగా, భవిష్యత్తు పోషణను గురించిన deliberative ప్రశ్నను సహజంగా అందిస్తుంది.
- source_word: Τί περιβαλώμεθα;
  choice: ఏమి ధరించుకుంటాం?
  rationale: περιβάλλω మధ్యమ రూపం ఇక్కడ బట్టలు వేసుకోవడాన్ని సూచిస్తుంది; ‘ధరించుకుంటాం’ భావాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἤ ... ἤ ... ἤ
  choice: లేదా ... లేదా
  rationale: మూడు ప్రత్యక్ష ప్రశ్నల మధ్యనున్న పునరుక్త విభజక సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: జీవనావసరాల విషయంలో యేసు చేసిన నిషేధ స్వభావం
  choice: కలవరపూరిత చింతను నిషేధించేలా ‘చింతించకండి’ అని అనువదించడం
  alternative: ‘ఆందోళనపడకండి’; లేదా అన్ని రకాల శ్రద్ధనూ నిషేధిస్తున్నట్లు ‘ఏ మాత్రమూ పట్టించుకోకండి’
  rationale: సందర్భం ఆహారం, పానీయం, వస్త్రం లభిస్తాయా అనే కలవరాన్ని ఉద్దేశిస్తుంది; బాధ్యతాయుతమైన ముందుచూపును పూర్తిగా నిషేధిస్తున్నట్లు పాఠాన్ని విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని మూడు ప్రత్యక్ష ప్రశ్నలు, వాటి సమాంతర నిర్మాణం నిలుపబడ్డాయి.
