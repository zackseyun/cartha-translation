id: MAT.6.33
reference: Matthew 6:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: te
  text: అయితే మీరు మొదట ఆయన రాజ్యాన్నీ ఆయన నీతినీ[a] వెదకండి; ఇవన్నీ మీకు అదనంగా చేర్చబడతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన న్యాయాన్ని.’ గ్రీకు పదం నీతి లేదా న్యాయం అనే భావాలను సూచించగలదు. ఇక్కడ దేవునితో సరైన సంబంధం, ఆయన చిత్తానికి తగిన ప్రవర్తన కూడా సందర్భంలో ఉన్నందున ప్రధాన పాఠంలో ‘నీతి’ అని ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: వెదకండి
  rationale: వర్తమానకాల ఆజ్ఞారూపం నిరంతరంగా, చురుకుగా అన్వేషించడాన్ని సూచిస్తుంది. ‘వెదకండి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ క్రియాశీల అన్వేషణ భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వచనాల్లో భౌతిక అవసరాల గురించి చింతించవద్దన్న బోధకు విరుద్ధమైన ప్రాధాన్యాన్ని ఇది పరిచయం చేస్తుంది. ‘అయితే’ ఆ మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: πρῶτον
  choice: మొదట
  rationale: మూలపదంలోని క్రమం మరియు ప్రథమ ప్రాధాన్యం అనే రెండు భావాలనూ నేరుగా నిలుపుతుంది.
- source_word: βασιλείαν
  choice: రాజ్యాన్ని
  rationale: ఈ పదం రాజ్యపాలన లేదా రాజ్యం అనే భావాలను కలిగి ఉంటుంది. మత్తయి సందర్భంలో ‘రాజ్యం’ స్థిరమైన, సహజమైన పదం; అది దేవుని రాజాధికారాన్ని కూడా మోయగలదు.
- source_word: δικαιοσύνην
  choice: నీతిని
  rationale: ‘నీతి’ దేవుని చిత్తానికి అనుగుణమైన సరైన స్థితి, సంబంధం, ప్రవర్తన అనే విస్తృత భావాన్ని నిలుపుతుంది. కేవలం న్యాయపరమైన లేదా సామాజిక న్యాయానికి పరిమితం చేయదు.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: సందర్భంలో ఇది దేవుణ్ణి లేదా తండ్రిని సూచిస్తుంది. దేవుడు అని విపులీకరించకుండా మూలంలోని సర్వనామాన్ని నిలుపుతుంది; తెలుగులో స్పష్టత కోసం సమన్వయించబడిన రెండు నామాల ముందూ పునరుక్తి చేయబడింది.
- source_word: ταῦτα πάντα
  choice: ఇవన్నీ
  rationale: సమీప సందర్భంలో చెప్పిన ఆహారం, పానీయం, వస్త్రం వంటి అవసరాలన్నిటినీ తిరిగి సూచిస్తుంది.
- source_word: προστεθήσεται
  choice: అదనంగా ఇవ్వబడతాయి
  rationale: భవిష్యత్ కర్మణి రూపంలోని ‘తోడుగా చేర్చబడతాయి’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ప్రధాన అన్వేషణకు ఇవి అదనంగా లభిస్తాయనే అర్థాన్ని నిలుపుతుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: బహువచన ద్వితీయ పురుష దత్తి భావాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: δικαιοσύνην పదానికి అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ మత్తయి సందర్భంలో ఈ పదం దేవుని చిత్తానికి అనుగుణమైన స్థితి మరియు ప్రవర్తనను విస్తృతంగా సూచిస్తుంది. ‘న్యాయం’ ఒక్కటే వాడితే భావం న్యాయపరమైన లేదా సామాజిక న్యాయానికి కుదించబడే అవకాశం ఉంది; అందువల్ల దానిని పాదసూచికలో ప్రత్యామ్నాయంగా ఉంచాం.
- issue: αὐτοῦ సర్వనామపు సూచన మరియు పరిధి
  choice: ఆయన రాజ్యాన్ని, ఆయన నీతిని
  alternative: దేవుని రాజ్యాన్ని, దేవుని నీతిని
  rationale: సందర్భం సూచించే దేవుడు లేదా తండ్రి అనే వ్యక్తిని విపులీకరించకుండా మూలంలోని సర్వనామ రూపాన్ని నిలిపాం. సమన్వయించబడిన రెండు నామాలకూ అది వర్తిస్తుందనే అర్థాన్ని తెలుగులో స్పష్టంగా చూపేందుకు ‘ఆయన’ను పునరుక్తి చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘మీరు’ ద్వారా గ్రీకులోని బహువచన సంబోధనను స్పష్టం చేశాం. ‘అదనంగా ఇవ్వబడతాయి’ అనేది కఠినమైన పదానువాదాన్ని నివారిస్తూ προστεθήσεται లోని అదనపు ప్రసాద భావాన్ని నిలుపుతుంది.
