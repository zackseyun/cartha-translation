  verdict: revise
  source_fidelity: 'The draft correctly renders the principal elements: the adversative δέ, priority expressed by πρῶτον, God''s kingdom and righteousness, and the promise concerning the necessities in context. However, it adds “అప్పుడు” (“then”), which has no corresponding Greek word and can imply a temporal/conditional sequence not explicitly stated. “ఇవన్నీ” is acceptable for ταῦτα πάντα, but “చేర్చబడతాయి” more directly preserves προστεθήσεται (“will be added”) than “ఇవ్వబడతాయి” (“will be given”).'
  naturalness: The revised wording is modern, clear, and appropriately reverent Telugu. Repeating “ఆయన” is natural and clearly applies the pronoun to both coordinated nouns. Coordinating suffixes in “రాజ్యాన్నీ ... నీతినీ” make the syntax smooth.
  terminology: “రాజ్యం” is established for βασιλεία, and “నీతి” appropriately retains the broad sense of δικαιοσύνη in this setting. The footnote responsibly retains “న్యాయం” as a lexical alternative without narrowing the main-text sense.
  issues:
