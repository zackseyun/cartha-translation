  - severity: low
    issue: “అదనంగా ఇవ్వబడతాయి” weakens the lexical imagery of προστεθήσεται.
    rationale: “ఇవ్వబడతాయి” is broadly compatible with the context, but “చేర్చబడతాయి” directly expresses that these things are added in addition to the primary pursuit.
