review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrastive address, the temporal sense of νηστεύων, and the ordinary-grooming sense of ἄλειψαι. However, the Greek has two coordinated imperatives ('anoint ... and wash ...'). The conjunctive form రాసుకొని can make the first action sound merely subordinate to the command to wash; rendering both as direct imperatives better preserves the source syntax and force.
  naturalness: ఉపవాసం ఉన్నప్పుడు, నీ తలకు నూనె రాసుకో, అలాగే నీ ముఖం కడుక్కో is clear, idiomatic modern standard Telugu. It maintains the singular direct address and reads naturally as practical instruction.
  terminology: నూనె రాసుకో is an appropriate context-sensitive rendering of ἀλείφω and avoids importing a ritual or ecclesial sense that అభిషేకించు could carry here. ముఖం కడుక్కో accurately renders νίψαι. The notes appropriately explain ordinary appearance without presenting it as a prohibition of fasting.
  issues:
  - severity: low
    issue: The first Greek imperative is rendered as a conjunctive participial form.
    rationale: రాసుకొని can grammatically subordinate the anointing/oiling to the washing. Using రాసుకో ... కడుక్కో represents the two coordinated imperatives more directly.
  revised_text: కానీ నీవు ఉపవాసం ఉన్నప్పుడు, నీ తలకు నూనె రాసుకో[a], అలాగే నీ ముఖం కడుక్కో[b].
