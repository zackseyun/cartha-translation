id: MAT.6.17
reference: Matthew 6:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: te
  text: కానీ నీవు ఉపవాసం ఉన్నప్పుడు, నీ తలకు నూనె రాసుకో[a], అలాగే నీ ముఖం కడుక్కో[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలోని క్రియకు ‘తలకు నూనె రాసుకో’ అనే అర్థం ఉంది. ఇది సాధారణ శరీర సంరక్షణలో భాగంగా నూనె రాసుకోవడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, నీ ఉపవాసం ఇతరులకు స్పష్టంగా కనిపించేలా చేయకుండా సాధారణంగా కనిపించు.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: కానీ నీవు
  rationale: వ్యాజభక్తులతో ఉన్న వ్యత్యాసాన్ని δέ సూచిస్తుండగా, σὺ అనే స్పష్ట సర్వనామం ‘నీవు’పై నొక్కు ఉంచుతుంది.
- source_word: νηστεύων
  choice: ఉపవాసం ఉన్నప్పుడు
  rationale: వర్తమాన అసమాపక క్రియను సహజమైన కాలార్థక ఉపవాక్యంగా అనువదించాం.
- source_word: ἄλειψαί σου τὴν κεφαλήν
  choice: నీ తలకు నూనె రాసుకొని
  rationale: ἀλείφω ఇక్కడ సాధారణ అలంకరణలో భాగంగా తలకు నూనె రాయడాన్ని సూచిస్తుంది. తెలుగులో ‘నూనె రాసుకో’ అనేది ‘అభిషేకించు’ కంటే సహజంగా ఉండి, సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: καὶ
  choice: —కొని ... కడుక్కో
  rationale: రెండు ఆజ్ఞలను సహజ తెలుగు వాక్యప్రవాహంలో అనుసంధానించేందుకు మొదటి క్రియకు ‘కొని’ రూపాన్ని, రెండవదానికి ప్రధాన ఆజ్ఞారూపాన్ని వాడాం.
- source_word: τὸ πρόσωπόν σου νίψαι
  choice: నీ ముఖం కడుక్కో
  rationale: νίπτω శరీరంలోని ఒక భాగాన్ని కడగడాన్ని సూచిస్తుంది; ‘ముఖం కడుక్కో’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
theological_decisions:
- issue: ఉపవాస సమయంలో కనిపించే తీరు గురించి ఆజ్ఞ స్వభావం
  choice: ఉపవాసం ఇతరులకు కనిపించేలా ప్రదర్శించకుండా సాధారణంగా తలను సంరక్షించుకొని ముఖం కడుక్కోవాలని యేసు బోధిస్తున్నాడు.
  alternative: ఇది ఆచారపరమైన అభిషేకాన్ని ఆదేశిస్తుంది; లేదా బహిరంగ ఉపవాసాన్నే నిషేధిస్తుంది.
  rationale: ముందటి వచన సందర్భం ముఖాన్ని వికారంగా చేసుకునే వ్యాజభక్తులకు విరుద్ధంగా సాధారణ రూపాన్ని కొనసాగించడాన్ని సూచిస్తుంది. అయితే ఈ వివరణను ప్రధాన వాక్యంలో చేర్చకుండా సాంస్కృతిక గమనికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఏకవచన ప్రత్యక్ష సంబోధనను నిలిపి, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన శైలిని ఉపయోగించాం. ‘అభిషేకించుకో’ అనే సంఘపరమైన లేదా ఆచారపరమైన భావం కలిగించగల పదానికి బదులు సందర్భానుగుణమైన ‘నూనె రాసుకో’ను ఎంచుకున్నాం.
