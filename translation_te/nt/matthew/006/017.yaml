- from: కానీ నీవు ఉపవాసం ఉన్నప్పుడు, నీ తలకు నూనె రాసుకొని[a], నీ ముఖం కడుక్కో[b].
  to: కానీ నీవు ఉపవాసం ఉన్నప్పుడు, నీ తలకు నూనె రాసుకో[a], అలాగే నీ ముఖం కడుక్కో[b].
  rationale: The revision is limited to changing రాసుకొని to the imperative రాసుకో and adding అలాగే to make the coordination explicit in natural Telugu. This preserves the Greek's two imperatives without altering the meaning or the culturally contextual sense of ordinary grooming.
