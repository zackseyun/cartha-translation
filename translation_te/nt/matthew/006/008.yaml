id: MAT.6.8
reference: Matthew 6:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: te
  text: కాబట్టి మీరు వారిలా మారకండి[a]. ఎందుకంటే, మీరు ఆయనను అడగకముందే మీకు ఏమి అవసరమో మీ తండ్రికి తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, ‘వారిలా చేయబడకండి’ / ‘వారిలా ఉండకండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ οὖν
  choice: కాబట్టి ... మారకండి
  rationale: οὖν ముందున్న అన్యజనుల ప్రార్థనా విధానం గురించిన హెచ్చరికతో ఈ నిషేధాన్ని అనుసంధానిస్తుంది; ‘కాబట్టి’ ఆ తార్కిక సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: ὁμοιωθῆτε
  choice: వారిలా మారకండి
  rationale: ఏరిస్టు పాసివ్ సబ్జంక్టివ్ రూపంలోని నిషేధాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తూ, వారి పద్ధతికి అనుగుణంగా మారిపోవద్దనే భావాన్ని నిలుపుతుంది.
- source_word: αὐτοῖς
  choice: వారిలా
  rationale: సమీప సందర్భంలోని అన్యజనులను సూచించే సర్వనామాన్ని అనవసర వివరణ లేకుండా నిలుపుతుంది.
- source_word: οἶδεν
  choice: తెలుసు
  rationale: οἶδα రూపపరంగా పర్ఫెక్ట్ అయినా వర్తమానార్థంలో వాడబడింది; అందువల్ల ‘తెలుసు’ సరైనది.
- source_word: ὁ πατὴρ ὑμῶν
  choice: మీ తండ్రి
  rationale: మూలంలో ‘పరలోకపు’ అనే విశేషణం లేదు; కాబట్టి దానిని చేర్చకుండా ‘మీ తండ్రి’ అని అనువదించబడింది.
- source_word: ὧν χρείαν ἔχετε
  choice: మీకు ఏమి అవసరమో
  rationale: అవసరమైన వాటి విషయాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: మీరు ఆయనను అడగకముందే
  rationale: πρὸ τοῦ తో కూడిన ఇన్ఫినిటివ్ ముందటి కాలాన్ని సూచిస్తుంది; ‘ఆయనను అడగకముందే’ వ్యక్తిగత కర్మను కూడా స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రార్థనకు సంబంధించి దేవుని ముందస్తు జ్ఞానం
  choice: శిష్యులు అడగకముందే వారి అవసరాలు తండ్రికి తెలుసని నేరుగా అనువదించడం
  alternative: ప్రార్థన సమాచారం అందించడానికి కాక సంబంధం కోసం అని వివరణాత్మకంగా చేర్చడం, లేదా సంపూర్ణ ముందస్తు జ్ఞానంపై సిద్ధాంతపరమైన పదజాలం చేర్చడం
  rationale: వాక్యం తండ్రి ముందస్తు జ్ఞానాన్ని స్పష్టంగా చెబుతుంది; అయినా ప్రార్థన ఎందుకు చేయాలో వివరించదు. అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా యథాతథంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. మూలంలో లేని ‘పరలోకపు’ వంటి పదాలను చేర్చలేదు; ‘ఆయన’ గౌరవ సూచకంగా వాడబడింది.
