revisions:
- from: మీరు ఉపవాసం చేస్తున్నారని మనుషులకు కనబడకుండా, రహస్యంలో ఉన్న మీ తండ్రికే కనబడేలా ఉండండి; అప్పుడు రహస్యంలో చూసే మీ తండ్రి మీకు ప్రతిఫలం ఇస్తాడు.
  to: మీరు ఉపవాసం చేస్తున్నారని మనుషులకు కనబడకుండా, రహస్యంలో ఉన్న మీ తండ్రికి మాత్రం కనబడేలా ఉండండి; మరియు రహస్యంలో చూసే మీ తండ్రి మీకు ప్రతిఫలం ఇస్తాడు.
  rationale: The revision retains the source’s purpose-oriented formulation and its deliberate repetition of “in secret,” while rendering the negative-positive contrast more idiomatically in Telugu. “అప్పుడు” is replaced by “మరియు” to avoid adding a temporal nuance absent from the Greek.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:30:26Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the purpose clause, the contrast between human observers and the Father, the repeated hidden/secret sphere, and the promised recompense. However, the added connective “అప్పుడు” makes the final clause more explicitly temporal/consequential than Greek καί (“and”).
  naturalness: The Telugu is modern and readable. “మీ తండ్రికే కనబడేలా” is understandable, but “మీ తండ్రికి మాత్రం కనబడేలా” expresses the μὴ ... ἀλλά contrast more naturally and explicitly without implying an exclusive property of the Father.
  terminology: “ఉపవాసం,” “మనుషులు,” “తండ్రి,” “రహస్యంలో,” and “ప్రతిఫలం” are appropriate modern-standard Telugu choices. The repeated “రహస్యంలో” suitably preserves the Greek repetition and its ambiguity.
  issues:
  - severity: low
    issue: “అప్పుడు” is not represented by the Greek conjunction καί.
    rationale: 'The source simply coordinates the result clause: “and your Father ... will reward you.” Replacing it with “మరియు” preserves the connection without adding a temporal implication.'
  - severity: low
    issue: The contrast is expressed chiefly through the emphatic suffix in “తండ్రికే.”
    rationale: While defensible, “తండ్రికి మాత్రం” more transparently renders the contrast of “not to people, but to your Father” in natural Telugu.
  revised_text: మీరు ఉపవాసం చేస్తున్నారని మనుషులకు కనబడకుండా, రహస్యంలో ఉన్న మీ తండ్రికి మాత్రం కనబడేలా ఉండండి; మరియు రహస్యంలో చూసే మీ తండ్రి మీకు ప్రతిఫలం ఇస్తాడు.
  revised_footnotes: []
  revision_rationale: The revision retains the source’s purpose-oriented formulation and its deliberate repetition of “in secret,” while rendering the negative-positive contrast more idiomatically in Telugu. “అప్పుడు” is replaced by “మరియు” to avoid adding a temporal nuance absent from the Greek.
