id: MAT.6.18
reference: Matthew 6:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: te
  text: మీరు ఉపవాసం చేస్తున్నారని మనుషులకు కనబడకుండా, రహస్యంలో ఉన్న మీ తండ్రికి మాత్రం కనబడేలా ఉండండి; మరియు రహస్యంలో చూసే మీ తండ్రి మీకు ప్రతిఫలం ఇస్తాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: కనబడేలా ఉండండి
  rationale: ఉద్దేశాన్ని తెలిపే ὅπως భావాన్ని తెలుగులో సహజమైన ప్రయోజనార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది; ఇది ముందున్న ఆదేశంతో అనుసంధానమై ఉంది.
- source_word: μὴ φανῇς
  choice: కనబడకుండా
  rationale: φαίνω యొక్క సందర్భార్థమైన ఇతరులకు కనిపించడం లేదా తెలిసిపోవడం అనే భావాన్ని సహజంగా తెలుపుతుంది.
- source_word: τοῖς ἀνθρώποις
  choice: మనుషులకు
  rationale: ఇక్కడ ἄνθρωποι పురుషులను మాత్రమే కాక సాధారణంగా మానవ పరిశీలకులందరినీ సూచిస్తుంది; తెలుగు ‘మనుషులు’ ఆ విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: νηστεύων
  choice: మీరు ఉపవాసం చేస్తున్నారని
  rationale: ఉపవాస క్రియలో ఉన్న వ్యక్తిగా కనిపించడాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀλλὰ τῷ πατρί σου
  choice: మీ తండ్రికే
  rationale: 'ἀλλά తెలిపే విరోధాన్ని ‘-కే’ బలపరుస్తుంది: మనుషులకు కాదు, తండ్రికి.'
- source_word: τῷ ἐν τῷ κρυφαίῳ
  choice: రహస్యంలో ఉన్న
  rationale: స్థలార్థం మరియు దాచబడిన పరిధి అనే రెండు సాధ్య ఛాయలను అతిగా నిర్ధారించకుండా గ్రీకు పదబంధాన్ని సమీపంగా నిలుపుతుంది.
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: రహస్యంలో చూసే
  rationale: మూలంలోని సంక్షిప్తతను, అలాగే κρυφαίῳ పునరుక్తిని కాపాడుతుంది; ‘రహస్యంగా చేసినదాన్ని’ అని మూలంలో లేని కర్మను చేర్చదు.
- source_word: ἀποδώσει σοι
  choice: మీకు ప్రతిఫలం ఇస్తాడు
  rationale: భక్తి ఆచరణకు దేవుని స్పందన అనే సందర్భంలో ἀποδίδωμι యొక్క ప్రతిఫలార్థాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: τοῖς ἀνθρώποις యొక్క సాధారణ మానవ సూచన
  choice: మనుషులకు
  alternative: ప్రజలకు; ఇతరులకు
  rationale: గ్రీకు వ్యాకరణ రూపం పుంలింగ బహువచనమైనా, సందర్భంలో ఇది పురుషులను మాత్రమే కాక మానవ పరిశీలకులను సాధారణంగా సూచిస్తుంది.
- issue: κρυφαίῳ యొక్క రెండు ప్రయోగాలు
  choice: రెండింటిలోనూ ‘రహస్యంలో’
  alternative: ఏకాంత స్థలంలో; రహస్యంగా; ఎవరికీ కనిపించని చోట
  rationale: ఒకే గ్రీకు పదబంధపు పునరుక్తిని కాపాడుతూ, అది ఖచ్చితమైన స్థలాన్నా లేక దాగిన పరిధిన​​ా సూచిస్తుందనే స్వల్ప సందిగ్ధతను నిలుపుతుంది.
- issue: μὴ ... ἀλλά విరోధ నిర్మాణం
  choice: మనుషులకు కనబడకుండా, ... మీ తండ్రికే కనబడేలా
  alternative: మనుషులకు కాదు, మీ తండ్రికి ఉపవాసం చేస్తున్నవారిగా కనబడేలా
  rationale: నిరాకరణను మనుషుల ముందు ప్రదర్శనపై ఉంచి, తండ్రి వైపు ఉన్న సానుకూల విరోధాన్ని తెలుగులో స్పష్టంగా చేస్తుంది; తండ్రి అజ్ఞాతంగా ఉన్నాడనే భావాన్ని ఉపవాసి తండ్రికి అక్షరార్థంగా కనిపించాలి అన్న భావంగా అతిగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవభరితమైన బైబిలు శైలి. ‘మీ తండ్రి’ అనే సంబోధనను నిలిపి, మూలంలోని రహస్యత్వం–చూడటం అనే పదబంధ సంబంధాన్ని కాపాడాం.
