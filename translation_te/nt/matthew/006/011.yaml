translation:
  language: te
  text: ఈ రోజు మాకు మా రోజువారీ రొట్టెను ఇవ్వు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ రోజుకు మా రొట్టెను,” “రాబోయే రోజుకు మా రొట్టెను,” లేదా “మాకు అవసరమైన రొట్టెను.” గ్రీకు విశేషణం ἐπιούσιον చాలా అరుదైనది; దాని ఖచ్చితమైన అర్థం వివాదాస్పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄρτον ἡμῶν
  choice: మాకు అవసరమైన ఆహారాన్ని
  rationale: ἄρτος యొక్క ప్రత్యక్ష అర్థం ‘రొట్టె’; అయితే ఈ ప్రార్థనలో అది జీవనానికి కావలసిన ఆహారాన్ని సూచించగలదు. ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉండేందుకు ‘ఆహారం’ వాడబడింది; ἡμῶν భావం ‘మాకు’లో వ్యక్తమవుతుంది.
- source_word: τὸν ἐπιούσιον
  choice: అవసరమైన
  rationale: అత్యంత అరుదైన ἐπιούσιος పదానికి ‘రోజువారీ,’ ‘ఈ రోజుకు కావలసిన,’ ‘రాబోయే రోజుకు కావలసిన,’ లేదా ‘జీవనానికి అవసరమైన’ అనే అర్థాలు ప్రతిపాదించబడ్డాయి. ‘అవసరమైన’ అనేది సందర్భానికి సహజంగా సరిపోతూ ఒక సాధ్యమైన అర్థాన్ని ఇస్తుంది; మిగతా ప్రధాన అర్థాలు పాదసూచికలో నిలుపబడ్డాయి.
- source_word: δὸς ἡμῖν
  choice: మాకు ఇవ్వు
  rationale: δὸς అనేది నేరుగా చేసిన ఏకవచన ఆజ్ఞార్థక విజ్ఞప్తి; ἡμῖν దాని పరోక్ష కర్మ. ‘మాకు ఇవ్వు’ ఆధునిక తెలుగులో సరళమైన, ప్రార్థనకు తగిన రూపం.
- source_word: σήμερον
  choice: ఈ రోజు
  rationale: σήμερον యొక్క కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రభువు ప్రార్థనలో ἐπιούσιον అర్థం
  choice: అవసరమైన
  alternative: రోజువారీ; ఈ రోజుకు కావలసిన; రాబోయే రోజుకు కావలసిన
  rationale: ఈ విశేషణం యొక్క ఖచ్చితమైన అర్థం వివాదాస్పదం. ప్రధాన పాఠంలో జీవనావసరంపై ఆధారపడే విజ్ఞప్తిని సహజంగా తెలిపి, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో స్పష్టంగా ఉంచాం.
- issue: ἄρτος ను ‘రొట్టె’గా లేదా విస్తృతంగా ‘ఆహారం’గా అనువదించడం
  choice: ఆహారం
  alternative: రొట్టె
  rationale: మూలపదం ప్రత్యక్షంగా ‘రొట్టె’ అయినప్పటికీ, ఇక్కడ అది ప్రాథమిక పోషణకు ప్రతినిధిగా ఉండవచ్చు. సాధారణ ఆధునిక తెలుగులో ప్రార్థన యొక్క ఉద్దేశాన్ని స్పష్టంగా అందించేందుకు ‘ఆహారం’ ఎంచుకున్నాం; ఈ ఎంపిక ἐπιούσιος యొక్క అస్పష్టతను సిద్ధాంతపరంగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ప్రార్థనా శైలి. ‘ఈ రోజు’ సహజ కాలవ్యక్తీకరణగా, ‘ఇవ్వు’ దేవునితో నేరుగా చేసే ఏకవచన విజ్ఞప్తిగా వాడబడ్డాయి.
