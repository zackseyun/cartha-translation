review_pass:
  verdict: revise
  source_fidelity: The two petitions accurately represent the third-person imperatives ἐλθέτω and γενηθήτω. ‘రాజ్యం,’ ‘చిత్తం,’ and ‘నెరవేరాలి’ preserve the principal senses without doctrinal over-specification. The heaven–earth comparison is appropriately attached in the main text to the immediately preceding will petition, while its broader possible scope is retained in a note.
  naturalness: The draft is generally modern and prayerful. Recasting the elliptical comparison as ‘పరలోకంలో ఉన్నట్లే భూమిమీద కూడా’ is more idiomatic Telugu than ‘పరలోకంలోలాగే భూమి మీద కూడా,’ while preserving the Greek ellipsis and comparison.
  terminology: ‘నీ రాజ్యం,’ ‘నీ చిత్తం,’ ‘పరలోకం,’ and ‘భూమి’ are established, comprehensible Telugu biblical terminology in a respectful modern register. ‘నీ’ remains suitable for direct address to God in this prayer.
  issues:
  - severity: medium
    issue: The existing footnote presents the identical Telugu wording as an alternative ‘reading.’
    rationale: The alternative concerns the interpretive scope of the final comparative phrase, not a distinct textual reading. As written, the note does not clearly communicate the alternative and may imply a textual variant where none is claimed.
  - severity: low
    issue: The comparison phrase is somewhat compressed and less idiomatic in the draft.
    rationale: ‘పరలోకంలో ఉన్నట్లే భూమిమీద కూడా’ naturally supplies Telugu’s expected comparative expression without adding a substantive assertion beyond the Greek’s ‘as in heaven, also on earth.’
  revised_text: నీ రాజ్యం రావాలి; నీ చిత్తం నెరవేరాలి[a]—పరలోకంలో ఉన్నట్లే భూమిమీద కూడా.
