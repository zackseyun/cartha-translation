id: MAT.6.10
reference: Matthew 6:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: te
  text: నీ రాజ్యం రావాలి; నీ చిత్తం నెరవేరాలి[a]—పరలోకంలో ఉన్నట్లే భూమిమీద కూడా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోకంలో ఉన్నట్లే భూమిమీద కూడా’ అనే చివరి పదబంధం ‘నీ రాజ్యం రావాలి,’ ‘నీ చిత్తం నెరవేరాలి’ అనే రెండు విన్నపాలకూ వర్తించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθέτω
  choice: రావాలి
  rationale: ἔρχομαι యొక్క తృతీయ పురుష ఏకవచన ఆజ్ఞార్థక రూపం; దేవునికి చేసే ప్రార్థనలోని విన్నప భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: βασιλεία
  choice: రాజ్యం
  rationale: ఈ పదం రాజపాలన లేదా రాజ్యాన్ని సూచించగలదు. మత్తయి సందర్భంలో స్థిరమైన, సహజమైన ‘రాజ్యం’ అనే పదం దేవుని ఏలుబడి భావాన్నీ మోస్తుంది.
- source_word: γενηθήτω
  choice: నెరవేరాలి
  rationale: γίνομαι యొక్క తృతీయ పురుష ఏకవచన ఆజ్ఞార్థక కర్మణి రూపం. θέλημαతో కలిసి, దేవుని చిత్తం కార్యరూపం దాల్చాలనే భావాన్ని ‘నెరవేరాలి’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: θέλημα
  choice: చిత్తం
  rationale: ఒకరు సంకల్పించేది, కోరేది లేదా ఉద్దేశించేది అనే అర్థాన్ని సూచిస్తుంది. దేవుని విషయంగా ‘చిత్తం’ సహజమైన, గౌరవప్రదమైన తెలుగు పదం; అర్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: ὡς
  choice: లాగే
  rationale: పోలికను పరిచయం చేసే ὡςకు ‘లాగే’ ఆధునిక తెలుగులో సంక్షిప్తమైన, సహజమైన సమానార్థకం.
- source_word: ἐν οὐρανῷ
  choice: పరలోకంలో
  rationale: ఇక్కడ దేవుని పరలోక పరిధిని సూచించే సందర్భంలో ‘పరలోకంలో’ స్పష్టమైన, తెలుగు బైబిలు వాడుకకు అనుగుణమైన రూపం.
- source_word: ἐπὶ γῆς
  choice: భూమి మీద
  rationale: ἐπίతో కూడిన γῆ ‘భూమి మీద’ అనే అర్థం ఇస్తుంది; పరలోకం–భూమి వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
- source_word: καὶ
  choice: కూడా
  rationale: ὡς ... καὶ నిర్మాణంలో పోలిక యొక్క రెండో భాగాన్ని ‘లాగే ... కూడా’ అనే సహజ తెలుగు నిర్మాణం పూర్తి చేస్తుంది.
theological_decisions:
- issue: ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς అనే పోలిక పదబంధం ఏ విన్నపానికి వర్తిస్తుంది
  choice: ప్రధాన పాఠ్యంలో దాన్ని సమీపంలోని రెండో విన్నపమైన ‘నీ చిత్తం నెరవేరాలి’తో అనుసంధానించాం.
  alternative: ‘పరలోకంలోలాగే భూమి మీద కూడా’ అనే మాటలు ‘నీ రాజ్యం రావాలి’ మరియు ‘నీ చిత్తం నెరవేరాలి’ అనే రెండు విన్నపాలకూ వర్తిస్తాయని అర్థం చేసుకోవచ్చు.
  rationale: గ్రీకు ప్రతులలోని ఆధునిక విరామచిహ్నాలు సంపాదకీయమైనవి. పదబంధం సమీపంలోని రెండో విన్నపానికి అనుసంధానించడం వ్యాకరణపరంగా అత్యంత సహజమైనా, రెండు విన్నపాలకూ వర్తించే అవకాశం ఉంది; ఆ అనిశ్చితిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలి. ‘వచ్చుగాక/నెరవేరుగాక’ వంటి ప్రాచీన రూపాల బదులు సాధారణ పాఠకులకు సులభమైన ‘రావాలి/నెరవేరాలి’ వాడాం; ‘నీ’ అనేది సందర్భానుకూలమైన ఏకవచన దైవ సంబోధన.
