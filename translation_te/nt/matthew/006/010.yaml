revisions:
- from: నీ రాజ్యం రావాలి; నీ చిత్తం నెరవేరాలి[a]—పరలోకంలోలాగే భూమి మీద కూడా.
  to: నీ రాజ్యం రావాలి; నీ చిత్తం నెరవేరాలి[a]—పరలోకంలో ఉన్నట్లే భూమిమీద కూడా.
