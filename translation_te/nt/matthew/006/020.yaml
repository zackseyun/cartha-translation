id: MAT.6.20
reference: Matthew 6:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: te
  text: కానీ మీ కొరకు పరలోకంలో నిధులను కూడబెట్టుకోండి. అక్కడ చిమ్మటగానీ, క్షయంగానీ వాటిని నాశనం చేయవు; దొంగలు గోడను పగులగొట్టి లోపలికి చొరబడరు, దొంగిలించరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θησαυρίζετε
  choice: కూడబెట్టుకోండి
  rationale: వర్తమాన ఆజ్ఞారూపం సూచించే కొనసాగుతున్న చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సంపదను పోగుచేసే రూపకాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: కానీ
  rationale: మునుపటి వచనంలోని ‘కూడబెట్టుకోవద్దు’ అనే ఆజ్ఞకు ఇక్కడ ఉన్న వ్యతిరేక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑμῖν
  choice: మీ కోసం
  rationale: ప్రయోజనార్థక దత్తివిభక్తి భావాన్ని సహజంగా తెలియజేస్తుంది; ఈ కూడబెట్టడం తమకోసమే అన్న భావాన్ని నిలుపుతుంది.
- source_word: θησαυροὺς
  choice: సంపదలను
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే పదాన్ని ఉపయోగిస్తుంది.
- source_word: ἐν οὐρανῷ
  choice: పరలోకంలో
  rationale: స్థానార్థాన్ని సహజమైన ప్రామాణిక తెలుగు బైబిలు వాడుకలో తెలియజేస్తుంది.
- source_word: σὴς
  choice: చిమ్మట
  rationale: దాచిన వస్త్రాలను పాడుచేసే పురుగును సూచించే ఖచ్చితమైన, సుపరిచితమైన తెలుగు పదం.
- source_word: βρῶσις
  choice: క్షయం
  rationale: ‘తినివేయడం’ లేదా వస్తువులను క్రమంగా నశింపజేసే ప్రక్రియ అనే విస్తృత భావాన్ని నిలుపుతుంది; దానిని కేవలం లోహపు తుప్పుకే పరిమితం చేయదు.
- source_word: ἀφανίζει
  choice: నాశనం చేయవు
  rationale: వస్తువును కనుమరుగయ్యేలా లేదా పనికిరాకుండా చేయడం అనే భావాన్ని స్పష్టంగా అందిస్తుంది; సంయుక్త కర్తలకు అనుగుణంగా బహువచనం వాడబడింది.
- source_word: κλέπται
  choice: దొంగలు
  rationale: గ్రీకు బహువచన నామవాచకానికి నేరమైన, సహజమైన సమానార్థకం.
- source_word: διορύσσουσιν
  choice: గోడను పగులగొట్టి లోపలికి చొరబడరు
  rationale: మట్టి లేదా ఇటుక గోడను తవ్వి లేదా పగులగొట్టి ఇంటిలోకి ప్రవేశించే ప్రాచీన విధానాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: κλέπτουσιν
  choice: దొంగిలించరు
  rationale: క్రియ యొక్క సరళమైన అర్థాన్ని నేరుగా, సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘పరలోకంలో సంపదలు’ అనే మాట స్వభావం
  choice: ‘పరలోకంలో ... సంపదలను’ అనే రూపకాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలిపాం.
  alternative: ‘పరలోక ప్రతిఫలాలు’ లేదా ‘ఆత్మీయ ఐశ్వర్యం’
  rationale: మూలపాఠం ఈ సంపదలను ప్రత్యేకంగా నిర్వచించదు. రూపకాన్ని అలాగే ఉంచడం వల్ల ప్రతిఫలం, యోగ్యత లేదా ఆత్మీయ సంపద గురించి ఏదైనా ప్రత్యేక సిద్ధాంతాన్ని పాఠ్యంలోకి చేర్చకుండా దాని ఉద్దేశపూర్వక విస్తృతత నిలుస్తుంది.
- issue: βρῶσις యొక్క అర్థ పరిధి
  choice: ‘క్షయం’
  alternative: ‘తుప్పు’ లేదా ‘తినివేయడం’
  rationale: ఈ పదం నశింపజేసే విస్తృత ప్రక్రియను సూచించగలదు. ‘క్షయం’ దానిని లోహాల తుప్పుకు మాత్రమే పరిమితం చేయకుండా, నశించే భూసంబంధ సంపదకూ నశించని పరలోక సంపదకూ మధ్య ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘కూడబెట్టుకోండి’ రూపకాన్ని సహజంగా నిలుపుతుంది. మూలంలో లేని వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా, διορύσσουσιν యొక్క సాంస్కృతిక చిత్రాన్ని స్పష్టంగా చేసి పాదటిప్పణిలో అక్షరార్థాన్ని ఇచ్చాం. అందించిన ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదటిప్పణి గుర్తులు వాటి విషయాలతో సరిపోలనందున, మూలపాఠ్య ఆధారంగా [a]ను ‘క్షయం’ వద్ద, [b]ను గోడ పగులగొట్టి చొరబడడం వద్ద ఉంచాం.
