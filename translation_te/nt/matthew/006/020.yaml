review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the contrastive imperative, the beneficiary sense ('for yourselves'), the heavenly-treasure metaphor, the broad destructive force of βρῶσις, and the two coordinated actions of thieves. The rendering of διορύσσουσιν as breaking through a wall is contextually sound, while the footnote appropriately retains the literal image of digging through.
  naturalness: The sentence is generally fluent modern standard Telugu. However, ‘నిధులు’ is a more precise and idiomatic equivalent for the repeated treasure metaphor than the broader ‘సంపదలు.’ ‘మీ కొరకు’ is also preferable as standard spaced orthography.
  terminology: Revise ‘సంపదలను’ to ‘నిధులను’ to preserve the concrete yet metaphorical sense of θησαυροὺς without interpretively broadening it into wealth/assets. ‘పరలోకం,’ ‘చిమ్మట,’ and ‘క్షయం’ are suitable. The footnote anchors correctly correspond to the Telugu text.
  issues:
  - severity: low
    issue: ‘సంపదలను’ is broader than θησαυρούς.
    rationale: While not wrong, ‘సంపదలు’ can suggest wealth or resources generally. ‘నిధులు’ more directly preserves the source’s recurring ‘treasures’ metaphor and is natural in this register.
  revised_text: కానీ మీ కొరకు పరలోకంలో నిధులను కూడబెట్టుకోండి. అక్కడ చిమ్మటగానీ, క్షయంగానీ వాటిని నాశనం చేయవు; దొంగలు గోడను పగులగొట్టి లోపలికి చొరబడరు, దొంగిలించరు.
