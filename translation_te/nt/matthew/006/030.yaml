id: MAT.6.30
reference: Matthew 6:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: te
  text: అయితే, నేడు ఉండి రేపు పొయ్యిలో[a] వేయబడే పొలంలోని గడ్డికి దేవుడు ఇలా వస్త్రధారణ కలిగిస్తే, ఆయన మిమ్మల్ని మరెంతో ఎక్కువగా వస్త్రధారణ కలిగించడా, అల్పవిశ్వాసులారా[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘పొయ్యి’ అంటే రొట్టెలు కాల్చే పొయ్యి. ఎండిన గడ్డినీ పొలంలోని మొక్కలనూ దానికి ఇంధనంగా ఉపయోగించేవారు.
    reason: cultural_note
  - marker: b
    text: ‘విశ్వాసం తక్కువగా ఉన్నవారారా’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం ప్రత్యక్ష సంబోధన; అది తగినంత కాని విశ్వాసం గురించి మందలింపును వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: అయితే
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసంతో కూడిన వాదనామలుపును ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τὸν χόρτον τοῦ ἀγροῦ
  choice: పొలంలోని గడ్డి
  rationale: χόρτος ఇక్కడ తక్కువకాలం ఉండే గడ్డి లేదా పచ్చికను సూచిస్తుంది; ‘పువ్వులు’ అని అర్థాన్ని అనవసరంగా కుదించకుండా సమూహార్థక ఏకవచనాన్ని నిలుపుతుంది.
- source_word: σήμερον ὄντα
  choice: నేడు ఉండి
  rationale: ὄντα యొక్క ‘ఉండడం’ అనే అర్థాన్ని జీవశాస్త్ర సంబంధమైన అదనపు భావం లేకుండా సంక్షిప్తంగా నిలుపుతుంది.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: రేపు పొయ్యిలో వేయబడే
  rationale: κλίβανος రొట్టెలు కాల్చే పొయ్యిని సూచించగలదు; ‘కొలిమి’ అనే లోహకర్మ భావాన్ని రానివ్వదు. వర్తమాన కర్మణి అసమాపక క్రియను తెలుగులో సహజమైన సంబంధ క్రియారూపంగా ఇచ్చాం.
- source_word: οὕτως ἀμφιέννυσιν
  choice: ఇలా వస్త్రం తొడిగిస్తే
  rationale: ἀμφιέννυμι లోని వస్త్రధారణ చిత్రాన్ని ‘అలంకరిస్తే’ అని మాత్రమే చెప్పి బలహీనపరచకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: οὐ πολλῷ μᾶλλον ὑμᾶς
  choice: ఆయన మిమ్మల్ని మరెంత ఎక్కువగా వస్త్రాలతో కప్పడా?
  rationale: తక్కువదాని నుంచి ఎక్కువదానికి సాగే వాదనను, అలాగే గ్రీకులో సూచితంగా పునరుక్తమయ్యే ‘వస్త్రం తొడిగించు’ క్రియను సహజమైన తెలుగు ప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: ὀλιγόπιστοι
  choice: అల్పవిశ్వాసులారా
  rationale: ఇది బహువచన సంబోధనలో ఉన్న మందలింపు. తక్కువ లేదా చాలనంత విశ్వాసం అనే భావాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక శైలిలో నిలుపుతుంది.
theological_decisions:
- issue: తక్కువదాని నుంచి ఎక్కువదానికి దేవుని సంరక్షణను నిర్ధారించే వాదన
  choice: క్షణికమైన గడ్డికి దేవుడు వస్త్రం తొడిగిస్తే, శిష్యులను మరింతగా వస్త్రాలతో కప్పుతాడనే భావాన్ని అలంకార ప్రశ్నగానే ఉంచాం.
  alternative: ప్రశ్నను నిశ్చయార్థక ప్రకటనగా మార్చడం.
  rationale: οὐ πολλῷ μᾶλλον అనే నిర్మాణం మరియు చివరి సంబోధన అలంకార ప్రశ్నకు మద్దతిస్తాయి. ఇది ఆందోళనకు వ్యతిరేకంగా యేసు ఇచ్చిన మందలింపును నిలుపుతుంది; అదనపు సిద్ధాంత వివరణను చేర్చదు.
- issue: ὀλιγόπιστοι లోని విశ్వాస పరిమాణం మరియు మందలింపు
  choice: ‘అల్పవిశ్వాసులారా’ అనే ప్రత్యక్ష సంబోధనను వాడాం.
  alternative: ‘విశ్వాసం లేనివారలారా’ అని సంపూర్ణ అవిశ్వాసంగా అనువదించడం.
  rationale: ఈ పదం విశ్వాసం పూర్తిగా లేదని కాక, విశ్వాసం తక్కువగా లేదా చాలనంతగా ఉందని మందలిస్తుంది; ఆ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి వాడాం. ‘వస్త్రం తొడిగిస్తే/వస్త్రాలతో కప్పడా’ అనే పదజాలం మూలంలోని clothing రూపకాన్ని నిలుపుతుంది. సంప్రదింపుగా ఇచ్చిన ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోకుండా ఉన్నందున, సాంస్కృతిక సూచికను ‘పొయ్యి’ వద్ద [a]గా, పదార్థ సూచికను ‘అల్పవిశ్వాసులారా’ వద్ద [b]గా సరిచేశాం.
