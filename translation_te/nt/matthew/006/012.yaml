source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: te
  text: మేము కూడా మాకు అప్పుపడినవారిని క్షమించినట్లే[b], మా అప్పులను[a] క్షమించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అప్పులు’ అంటే ఇక్కడ దేవుని ఎదుట చేసిన పాపాలు లేదా అపరాధాలు. గ్రీకు పాఠం చెల్లించవలసిన దాని రూపకాన్ని నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మేము కూడా మాకు అప్పుపడినవారిని క్షమించాము.’ గ్రీకు క్రియను సాధారణ భూతకాలంగా కూడా అనువదించవచ్చు; ప్రధాన పాఠ్యం పూర్తయిన చర్యతో పోలికను సహజంగా వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: క్షమించు
  rationale: ప్రార్థన సందర్భంలో ἀφίημι అంటే ‘విడిచిపెట్టు’ అనే మూలభావం ఉన్నప్పటికీ, నైతిక అప్పుల రూపకంతో కలిసి ఇక్కడ ‘క్షమించు’ అనడం సహజమూ సందర్భోచితమూ.
- source_word: τὰ ὀφειλήματα ἡμῶν
  choice: మా అప్పులను
  rationale: ὀφειλήματα యొక్క ప్రత్యక్ష అర్థమైన ‘అప్పులు’ను నిలుపుతూ, పాపాలు లేదా అపరాధాలను అప్పులుగా చూపే మూల రూపకాన్ని కాపాడుతుంది.
- source_word: ὡς
  choice: అట్లే
  rationale: దేవుని నుండి కోరే క్షమాపణకు, ఇతరులకు చూపిన క్షమాపణకు మధ్య ఉన్న పోలికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καὶ ἡμεῖς
  choice: మేము కూడా
  rationale: రెండవ καὶ మరియు స్పష్టంగా ఉన్న ἡμεῖς కలిగించే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἀφήκαμεν
  choice: క్షమించిన
  rationale: గ్రీకు ఏఓరిస్ట్ సూచించే పూర్తయిన చర్యను తెలుగు భూతకాల కృదంతం సహజంగా తెలియజేస్తుంది; అది ప్రస్తుత ప్రార్థనతో ఉన్న సంబంధాన్ని కూడా విడదీయదు.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: మాకు అప్పుపడినవారిని
  rationale: ‘అప్పులు’ అనే రూపకంతో సంబంధాన్ని నిలుపుతూ, ఆధునిక తెలుగులో ‘మా అప్పుదారులు’ వల్ల కలగగల అర్థసందిగ్ధతను నివారిస్తుంది.
theological_decisions:
- issue: ὀφειλήματα అనే నైతిక అప్పుల రూపకం
  choice: ప్రధాన పాఠ్యంలో ‘అప్పులు’ అనే రూపకాన్నే నిలుపడం.
  alternative: పాపాలు; అపరాధాలు
  rationale: మూలపాఠం సాధారణ ‘పాపాలు’ అనే పదాన్ని కాక, చెల్లించవలసిన అప్పుల భాషను వాడుతుంది. ఆ రూపకాన్ని నిలపడం మూలానికి పారదర్శకంగా ఉంటుంది; ఉద్దేశించిన నైతిక భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- issue: ἀφήκαμεν యొక్క కాలసూచన
  choice: పూర్తయిన చర్యను సూచించే ‘క్షమించినట్లే’ అని అనువదించడం.
  alternative: క్షమిస్తున్నట్లే; క్షమించాము గనుక
  rationale: ఏఓరిస్ట్‌ను కొనసాగుతున్న వర్తమాన చర్యగా మార్చకుండా, అలాగే కారణార్థకంగా కఠినీకరించకుండా, పూర్తయిన మానవ క్షమాపణతో పోలికను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, ప్రార్థనకు తగిన గౌరవభరితమైన ఏకవచన సంబోధనతో అనువదించబడింది. తెలుగు వాక్యప్రవాహం కోసం పోలిక ఉపవాక్యాన్ని ముందుంచినా, గ్రీకు పాఠంలోని భావసంబంధం మారలేదు.
