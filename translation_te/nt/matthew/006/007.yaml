- from: మీరు ప్రార్థించేటప్పుడు, అన్యజనుల్లా అర్థంలేని మాటలను పోగుచేయకండి[a]. ఎందుకంటే, తాము ఎక్కువ మాటలు చెప్పడం వల్ల దేవుడు తమ ప్రార్థన వింటాడని వారు అనుకుంటారు[b].
