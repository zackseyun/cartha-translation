id: MAT.6.7
reference: Matthew 6:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: te
  text: మీరు ప్రార్థిస్తున్నప్పుడు, అన్యజనులవలె అర్థంలేని మాటలను విరివిగా పలకకండి[a]; ఎందుకంటే తమ ఎక్కువ మాటలవల్ల తాము వినబడతామని వారు అనుకుంటారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాగుతూనే ఉండకండి,” లేదా “అర్థంలేని మాటలను పదే పదే పలకకండి.” ఇక్కడి గ్రీకు క్రియ అరుదైనది. ఇది హృదయపూర్వకంగా మళ్లీ చేసే ప్రతి ప్రార్థనను కాకుండా, శూన్యమైన, యాంత్రికమైన లేదా అతివిస్తారమైన మాటలను సూచిస్తున్నట్టు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మూలంలో “తమ ఎక్కువ మాటలవల్ల తాము వినబడతారని.” ఇక్కడ “వినబడటం” అంటే అనుకూలంగా ఆలకించబడటం; అది తప్పనిసరిగా జవాబు పొందడమనే మరింత నిర్దిష్ట భావాన్ని చెప్పదు.
    reason: translation_clarity
lexical_decisions:
- source_word: Προσευχόμενοι δὲ
  choice: మీరు ప్రార్థించేటప్పుడు
  rationale: సందర్భాన్ని సూచించే వర్తమాన కృదంతాన్ని సహజమైన ఆధునిక తెలుగులో కాలార్థక ఉపవాక్యంగా అందించింది. δέ బోధలో కొనసాగింపును సూచిస్తోంది; తెలుగులో ప్రత్యేక సంధాయకం లేకుండానే ఆ ప్రవాహం సహజంగా నిలుస్తుంది.
- source_word: μὴ βατταλογήσητε
  choice: అర్థంలేని మాటలను పోగుచేయకండి
  rationale: అరుదైన βατταλογέω పదంలోని శూన్యమైన, యాంత్రికమైన, అతివిస్తారమైన మాటల భావాన్ని తెలియజేస్తుంది; ప్రతి విధమైన పునరుక్త ప్రార్థనను నిషేధిస్తున్నట్టు చెప్పదు.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: అన్యజనుల్లా
  rationale: యూదు సందర్భంలో నిబంధన ప్రజలకు వెలుపల ఉన్న జనాలను సూచించే ἐθνικοίకి తెలుగు బైబిలు వాడుకలో సహజమైన, మతపరంగా అతిగా వ్యాఖ్యానించని సమానార్థకం.
- source_word: δοκοῦσιν
  choice: వారు అనుకుంటారు
  rationale: వారి ఊహ లేదా నమ్మకాన్ని సరళంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: తాము ఎక్కువ మాటలు చెప్పడం వల్ల
  rationale: వారు తమ ప్రార్థన వినబడటానికి ఆధారంగా భావించిన అధిక వాచాలతను కారణార్థకంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰσακουσθήσονται
  choice: దేవుడు తమ ప్రార్థన వింటాడని
  rationale: దైవసంబంధ కర్మణి భావాన్ని తెలుగులో సహజంగా కర్తరిగా వ్యక్తం చేస్తూ, ‘జవాబు ఇస్తాడు’ అనే మరింత బలమైన భావాన్ని చేర్చకుండా అనుకూలంగా వినడమనే అర్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యేసు ప్రార్థనలోని ప్రతి పునరుక్తినీ నిషేధిస్తున్నాడా, లేక శూన్యమైన అతివాచాలతనే నిషేధిస్తున్నాడా?
  choice: అర్థంలేని మాటలను పోగుచేయకండి
  alternative: వ్యర్థంగా పదే పదే పలకకండి; వాగుతూనే ఉండకండి
  rationale: అరుదైన గ్రీకు క్రియలోని అనిశ్చితిని పూర్తిగా తొలగించకుండా, దేవుని దృష్టిని ఆకర్షించేందుకు ఉపయోగించే శూన్యమైన లేదా యాంత్రికమైన విస్తార ప్రసంగమే విమర్శకు గురవుతోందని చూపుతుంది. హృదయపూర్వకంగా ఒకే ప్రార్థనను మళ్లీ చేయడమంతటినీ నిషేధిస్తున్నట్టు అనవసరమైన సిద్ధాంత నిర్ణయం చేయదు.
- issue: εἰσακουσθήσονται అనేది కేవలం వినడమా లేక ప్రార్థనకు జవాబు ఇవ్వడమా?
  choice: దేవుడు తమ ప్రార్థన వింటాడని
  alternative: తమ ప్రార్థనకు జవాబు ఇస్తాడని
  rationale: గ్రీకు పదం అనుకూలంగా ఆలకించబడటాన్ని సూచించగలదు. ‘జవాబు ఇస్తాడు’ అని అనువదిస్తే మూలంలోని దానికంటే ఫలితాన్ని మరింత నిర్దిష్టంగా చేస్తుంది; అందువల్ల ‘వింటాడు’ అనే విస్తృత భావాన్ని ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన బోధనా శైలి. ‘అన్యజనులు’ అనే స్థిరమైన బైబిలు పదాన్ని ఉంచి, అరుదైన గ్రీకు క్రియకు సహజమైన వివరణాత్మక పదబంధాన్ని వాడింది. ప్రధాన వాక్యంలో ‘దేవుడు’ అనేది గ్రీకులో స్పష్టంగా లేకపోయినా దైవసంబంధ కర్మణి భావాన్ని తెలుగులో సహజంగా తెలియజేయడానికి చేర్చబడింది; పాదటిప్పణి మూల నిర్మాణాన్ని తెలియజేస్తుంది.
