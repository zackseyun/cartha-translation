id: MAT.6.26
reference: Matthew 6:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: te
  text: ఆకాశంలోని పక్షులను చూడండి[a], ఎందుకంటే అవి విత్తవు, కోయవు, గోదాముల్లో కూడబెట్టవు; మీ పరలోక తండ్రి వాటికి ఆహారం ఇస్తాడు. వాటికంటే మీరు ఎంతో విలువైనవారు కారా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా: ‘గగనంలోని పక్షులను’ లేదా సంప్రదాయబద్ధంగా ‘గాలిలో ఎగిరే పక్షులను.’'
    reason: lexical_alternative
  - marker: b
    text: 'మరొక విధంగా: ‘వాటికంటే మీరు ఎక్కువ ప్రాముఖ్యమైనవారు కారా?’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: చూడండి
  rationale: ఇది శ్రద్ధగా దృష్టి పెట్టమని ఆదేశించే భూతకాల ఆజ్ఞార్థక రూపం. ‘చూడండి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆజ్ఞ బలాన్ని నిలుపుతుంది.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ఆకాశ పక్షులు
  rationale: πετεινά పక్షులను లేదా ఎగిరే జీవులను సూచిస్తుంది; τοῦ οὐρανοῦ ఇక్కడ కనబడే ఆకాశాన్ని సూచించడం సందర్భోచితం. ‘ఆకాశ పక్షులు’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: σπείρουσιν ... θερίζουσιν ... συνάγουσιν εἰς ἀποθήκας
  choice: విత్తవు, కోయవు, గోదాముల్లో పోగుచేయవు
  rationale: మూడు వ్యవసాయ క్రియల సమాంతరతను, పంటను నిల్వచేసే భావాన్ని కాపాడుతుంది.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: మీ పరలోక తండ్రి
  rationale: తండ్రితో సంబంధాన్ని, ఆయన పరలోక సంబంధిత గుర్తింపును సంక్షిప్తమైన సుపరిచిత తెలుగులో నిలుపుతుంది.
- source_word: τρέφει
  choice: పోషిస్తున్నాడు
  rationale: τρέφω ఇక్కడ ఆహారం అందించి జీవింపజేయడాన్ని సూచిస్తుంది. ‘పోషిస్తున్నాడు’ కేవలం ఒకసారి ఆహారం పెట్టడం కంటే దేవుని కొనసాగుతున్న సంరక్షణను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: వాటికంటే మీరు ఎంతో విలువైనవారు కారా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే ప్రశ్నా రూపాన్ని, పక్షులతో పోల్చిన అధిక విలువను కాపాడుతుంది; ఆ విలువకు వచనం చెప్పని సిద్ధాంత కారణాన్ని జోడించదు.
theological_decisions:
- issue: మనుషులకు పక్షులకంటే ఎక్కువ విలువ ఉందనే యేసు వాదన
  choice: యేసు సంబోధిస్తున్న వారికి పక్షులకంటే అధిక విలువ ఉందని మాత్రమే స్పష్టంగా చెప్పడం
  alternative: ఆ అధిక విలువకు దేవుని స్వరూపంలో సృష్టించబడటం లేదా నిబంధన సంబంధం అనే నిర్దిష్ట కారణాన్ని అనువాదంలో చేర్చడం
  rationale: మూలవచనం పోలికను స్పష్టంగా చెబుతుంది గాని దానికి సిద్ధాంతపరమైన ఆధారాన్ని ఈ వాక్యంలో పేర్కొనదు. అందువల్ల ఆ ఉద్వేగాన్ని వివరణతో పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో రూపొందించబడింది. వ్యవసాయ రూపకంలోని వరుస క్రియలను నిలిపి, గ్రీకులోని సాధారణ సంధికి సందర్భానుసారమైన వ్యతిరేక భావాన్ని తెలుగులో ‘అయినా’తో సహజంగా వ్యక్తపరిచాం.
