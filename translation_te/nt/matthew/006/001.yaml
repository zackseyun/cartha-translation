id: MAT.6.1
reference: Matthew 6:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: te
  text: అయితే, మనుషుల ఎదుట, వారు చూడాలనే ఉద్దేశంతో మీ నీతిని[a] ఆచరించకుండా జాగ్రత్తపడండి. లేకపోతే, పరలోకాలలో ఉన్న మీ తండ్రి దగ్గర మీకు ఏ ప్రతిఫలమూ ఉండదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీ నీతియుక్త కార్యాలను’ అని కూడా అనువదించవచ్చు. కొన్ని ప్రాచీన ప్రతులలో ‘మీ దానధర్మం’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: గ్రీకులో ‘పరలోకాలలో’ అని బహువచనంలో ఉంది; దీనిని సాధారణంగా ‘పరలోకంలో’ అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε
  choice: జాగ్రత్తపడండి
  rationale: వర్తమాన ఆజ్ఞార్థక బహువచనం నిరంతర అప్రమత్తతను కోరుతోంది; ఆధునిక తెలుగులో హెచ్చరిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి బోధ నుండి హెచ్చరిక వైపు వచ్చే మార్పు లేదా స్వల్ప వ్యతిరేకతను సహజంగా సూచిస్తుంది.
- source_word: δικαιοσύνην
  choice: నీతి
  rationale: SBLGNT పాఠంలోని విస్తృత భావాన్ని నిలుపుతుంది; సందర్భాన్ని కేవలం దానధర్మానికి పరిమితం చేయదు.
- source_word: μὴ ποιεῖν
  choice: ఆచరించకుండా
  rationale: ఇక్కడ నీతిని కార్యరూపంలో పాటించడాన్ని సూచిస్తుంది; సాధారణ ‘చేయకుండా’ కంటే సందర్భానికి స్పష్టంగా సరిపోతుంది.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: మనుషులు … వారి ఎదుట
  rationale: ἀνθρώπων ఇక్కడ స్త్రీపురుషులందరినీ సూచిస్తుంది; ‘మనుషులు’ అనే పదం ఆ సాధారణ భావాన్ని కాపాడుతుంది.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: వారు చూడాలనే ఉద్దేశంతో
  rationale: ఈ గ్రీకు నిర్మాణంలోని ఉద్దేశ భావాన్ని స్పష్టంగా నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: εἰ δὲ μή γε
  choice: లేకపోతే
  rationale: షరతుతో కూడిన హెచ్చరిక ఫలితాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: μισθὸν
  choice: ప్రతిఫలం
  rationale: దేవుని నుండి లభించే ఫలాన్ని సూచించే ఈ సందర్భంలో ‘జీతం’ కంటే ‘ప్రతిఫలం’ తగినది.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: మీ తండ్రి దగ్గర
  rationale: παρά + చతుర్థీ విభక్తిలోని సన్నిధి లేదా సంబంధ భావాన్ని నిలుపుతుంది; ప్రతిఫలం తండ్రి వద్ద లేదనే గ్రీకు వాక్య నిర్మాణానికి దగ్గరగా ఉంటుంది.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: పరలోకాలలో ఉన్న
  rationale: గ్రీకులోని బహువచన రూపాన్ని కాపాడుతూ మత్తయి శైలిని ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: δικαιοσύνην పదం యొక్క పరిధి
  choice: విస్తృత భావంలో ‘నీతి’
  alternative: ‘నీతి కార్యాలు’ లేదా ‘దానధర్మం’
  rationale: SBLGNTలో δικαιοσύνην ఉంది; ఇది సాధారణంగా నీతిని లేదా నీతియుక్త ఆచరణను సూచించగలదు. సమీప సందర్భం దానధర్మాన్ని చర్చించినా, ప్రధాన పాఠాన్ని దానికే పరిమితం చేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: παρὰ τῷ πατρὶ ὑμῶν యొక్క భావం
  choice: ‘మీ తండ్రి దగ్గర’
  alternative: ‘మీ తండ్రి నుండి’
  rationale: παρά + చతుర్థీ విభక్తి తండ్రి సన్నిధిలో లేదా ఆయన వద్ద ప్రతిఫలం ఉండటాన్ని నేరుగా సూచిస్తుంది; సందర్భపరంగా ప్రతిఫలానికి మూలం తండ్రే అన్న భావమూ సాధ్యమే, కానీ దానిని ప్రధాన పాఠంలో తప్పనిసరిగా నిర్ణయించలేదు.
- issue: τοῖς οὐρανοῖς యొక్క సంఖ్య
  choice: బహువచనంగా ‘పరలోకాలలో’
  alternative: ఏకవచనంగా ‘పరలోకంలో’
  rationale: గ్రీకు పాఠంలో బహువచనం ఉంది. దానిని నిలుపుకోవడం మత్తయి పదప్రయోగాన్ని ప్రతిబింబిస్తుంది; దీనిపై అదనపు విశ్వనిర్మాణ సిద్ధాంతాన్ని మోపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘మీ తండ్రి దగ్గర’ అనే రూపం సహజ తెలుగు మరియు గ్రీకు సన్నిధి భావం రెండింటినీ కాపాడుతుంది.
