review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the warning, the broad scope of δικαιοσύνην, the purpose clause, the conditional consequence, and the plural τοῖς οὐρανοῖς. ‘మీ తండ్రి దగ్గర’ can express the source phrase’s ‘with/from your Father’ range in this context.
  naturalness: The paired expressions ‘మనుషులు చూడాలనే ఉద్దేశంతో వారి ఎదుట’ are redundant and slightly awkward. Recasting them as ‘మనుషుల ఎదుట, వారు చూడాలనే ఉద్దేశంతో’ preserves both the public setting and intended visibility in natural modern Telugu.
  terminology: ‘నీతి’ appropriately retains the broad wording of δικαιοσύνη rather than prematurely restricting it to almsgiving. ‘ప్రతిఫలం’ is suitable for μισθός. ‘పరలోకాలలో’ retains the Greek plural and is acceptable in biblical register.
  issues:
  - severity: low
    issue: Redundant expression of the human observers
    rationale: The draft says both ‘మనుషులు చూడాలనే ఉద్దేశంతో’ and ‘వారి ఎదుట’ in an order that sounds repetitive. The Greek contains two related but distinct elements—before people and in order to be seen by them—which Telugu can convey more smoothly by placing ‘మనుషుల ఎదుట’ first and then stating the purpose.
  - severity: low
    issue: Footnote a wording
    rationale: ‘మీ నీతి కార్యాలను’ is understandable but less idiomatic than ‘మీ నీతియుక్త కార్యాలను’; the latter more clearly represents the alternative ‘acts of righteousness’ without narrowing the main-text sense.
