id: MAT.6.28
reference: Matthew 6:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: te
  text: 'బట్టల గురించి మీరు ఎందుకు ఆందోళనపడుతున్నారు? పొలంలోని లిల్లీలు[a] ఎలా పెరుగుతున్నాయో శ్రద్ధగా గమనించండి[b]: అవి శ్రమపడవు, నూలు వడకవు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పొలంలోని అడవి పువ్వులు.’ ఇక్కడి గ్రీకు పదం ఏ నిర్దిష్ట పుష్పజాతిని సూచిస్తుందో ఖచ్చితంగా తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘పరిశీలించి నేర్చుకోండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: బట్టల గురించి
  rationale: ఏకవచన రూపం ఉన్నప్పటికీ, ఈ సందర్భంలో ἔνδυμα సాధారణంగా ధరించే బట్టలను ఒక వర్గంగా సూచిస్తుంది; ఆధునిక తెలుగులో ‘బట్టల గురించి’ సహజంగా ఉంటుంది.
- source_word: τί μεριμνᾶτε
  choice: మీరు ఎందుకు ఆందోళనపడుతున్నారు?
  rationale: τί ఇక్కడ ‘ఎందుకు?’ అనే ప్రశ్నార్థక భావాన్ని ఇస్తుంది; μεριμνάω సాధారణ శ్రద్ధకన్నా కలవరంతో కూడిన చింతను సూచిస్తుంది.
- source_word: καταμάθετε
  choice: శ్రద్ధగా గమనించండి
  rationale: ఈ ఆజ్ఞ కేవలం చూడడమే కాక, గమనించి గ్రహించమనే భావాన్ని కలిగి ఉంది; ‘శ్రద్ధగా గమనించండి’ ఆ పరిశీలనా బలాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: పొలంలోని లిల్లీ పువ్వులు
  rationale: κρίναకు ప్రత్యక్ష సమానార్థం ‘లిల్లీలు’; τοῦ ἀγροῦ అవి సాగుచేసిన తోటలోనివి కాక పొలంలో పెరిగేవని సూచిస్తుంది. విస్తృత అర్థమైన ‘అడవి పువ్వులు’ పాదసూచికలో ఉంచబడింది.
- source_word: πῶς αὐξάνουσιν
  choice: ఎలా పెరుగుతున్నాయో
  rationale: αὐξάνω ఇక్కడ మొక్కల సహజ పెరుగుదలను సూచిస్తుంది; ఈ తెలుగు రూపం ప్రధాన వాక్యంతో సహజంగా అనుసంధానమవుతుంది.
- source_word: οὐ κοπιῶσιν
  choice: అవి కష్టపడి పనిచేయవు
  rationale: κοπιάω శ్రమతో పని చేయడాన్ని సూచిస్తుంది; ‘కష్టపడి పనిచేయవు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉండి మూలంలోని శ్రమ భావాన్ని నిలుపుతుంది.
- source_word: οὐδὲ νήθουσιν
  choice: నూలు వడకవు
  rationale: νήθω నారను నూలుగా వడకడాన్ని సూచిస్తుంది; తెలుగులో ‘నూలు వడకడం’ స్పష్టమైన, సహజమైన ప్రయోగం.
theological_decisions:
- issue: మెριμνάω ద్వారా సూచించబడే ఆందోళన
  choice: ఆందోళనపడుతున్నారు
  alternative: చింతిస్తున్నారు
  rationale: యేసు సాధారణ ముందుచూపును గద్దించడం కాదు; జీవనావసరాల విషయంలో కలిగే కలవరాన్ని ప్రశ్నిస్తున్నాడు. ‘ఆందోళనపడుతున్నారు’ ఈ భేదాన్ని స్పష్టంగా ఉంచుతుంది.
- issue: κρίνα యొక్క మొక్కల గుర్తింపు
  choice: లిల్లీ పువ్వులు
  alternative: అడవి పువ్వులు
  rationale: పదానికి సాధారణ ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచుతూ, ఖచ్చితమైన వృక్షజాతి అనిశ్చితిని పాదసూచికలో సంరక్షించాం; దీనిపై ఏ ప్రతీకాత్మక లేదా సిద్ధాంతపరమైన అర్థాన్నీ మోపలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధన వాడబడింది. వాక్యం సాధారణ పాఠకులకు సహజంగా ఉండేలా రూపొందించబడింది; అయితే మూలంలోని ప్రశ్న, ఆజ్ఞ, ‘పనిచేయడం—నూలు వడకడం’ అనే సమాంతర భావాలు నిలుపబడ్డాయి.
