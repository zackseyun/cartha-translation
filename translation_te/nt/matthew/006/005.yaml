review_pass:
  verdict: revise
  source_fidelity: The draft conveys the temporal instruction, prohibition, public-display motive, and the commercial nuance of ἀπέχουσι well. However, γωνίαις means street corners, not intersections/crossroads; ‘కూడళ్లు’ can shift the location. ‘వేషధారులు’ is overly concrete (‘costume wearers’) for ὑποκριταί in this moral context.
  naturalness: The revision uses idiomatic modern standard Telugu while retaining a formal instructional register. ‘విశాల వీధుల మూలల్లో’ is both natural and closer to the Greek.
  terminology: ‘కపటులు’ is a clear, established rendering for ‘hypocrites’ without importing a more specific characterization. ‘సమాజమందిరాలు’ and ‘ప్రతిఫలం’ suitably retain the historical setting and reward language.
  issues:
  - severity: medium
    issue: ‘విశాల వీధుల కూడళ్లలో’ renders γωνίαις as intersections/crossroads.
    rationale: The Greek denotes corners of broad streets. ‘విశాల వీధుల మూలల్లో’ preserves this more precisely.
  - severity: low
    issue: ‘వేషధారులు’ is an unduly literal theatrical image for ὑποκριταί.
    rationale: In this context the word denotes hypocritical or insincere persons. ‘కపటులు’ communicates the established contextual sense naturally.
  - severity: low
    issue: The infinitive phrase can be more idiomatically linked to the act of praying.
    rationale: ‘నిలబడి ప్రార్థించడాన్ని ఇష్టపడతారు’ clearly expresses that they like praying while standing, without changing the meaning.
  revised_text: 'మీరు ప్రార్థన చేసేటప్పుడు, కపటుల్లా ఉండకండి. ఎందుకంటే ప్రజలకు కనిపించాలని వారు సమాజమందిరాల్లోనూ విశాల వీధుల మూలల్లోనూ నిలబడి ప్రార్థించడాన్ని ఇష్టపడతారు. నేను మీతో నిజంగా చెబుతున్నాను: వారు తమ ప్రతిఫలాన్ని పూర్తిగా పొందారు.[a]'
