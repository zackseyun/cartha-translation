  to: 'మీరు ప్రార్థన చేసేటప్పుడు, కపటుల్లా ఉండకండి. ఎందుకంటే ప్రజలకు కనిపించాలని వారు సమాజమందిరాల్లోనూ విశాల వీధుల మూలల్లోనూ నిలబడి ప్రార్థించడాన్ని ఇష్టపడతారు. నేను మీతో నిజంగా చెబుతున్నాను: వారు తమ ప్రతిఫలాన్ని పూర్తిగా పొందారు.[a]'
