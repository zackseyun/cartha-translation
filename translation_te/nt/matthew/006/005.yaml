id: MAT.6.5
reference: Matthew 6:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: te
  text: 'మీరు ప్రార్థన చేసేటప్పుడు, కపటుల్లా ఉండకండి. ఎందుకంటే ప్రజలకు కనిపించాలని వారు సమాజమందిరాల్లోనూ విశాల వీధుల మూలల్లోనూ నిలబడి ప్రార్థించడాన్ని ఇష్టపడతారు. నేను మీతో నిజంగా చెబుతున్నాను: వారు తమ ప్రతిఫలాన్ని పూర్తిగా పొందారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “వారు తమ ప్రతిఫలాన్ని పొందారు.” ఇక్కడి గ్రీకు క్రియకు చెల్లింపును పూర్తిగా పొందడం అనే భావం కూడా ఉండవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: మీరు ప్రార్థన చేసేటప్పుడు
  rationale: ὅταν యొక్క అనిర్దిష్ట కాలార్థాన్ని సాధారణంగా పునరావృతమయ్యే సందర్భంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἔσεσθε ὡς οἱ ὑποκριταί
  choice: వేషధారుల్లా ఉండకండి
  rationale: భవిష్యత్ సూచక రూపంలోని నిషేధార్థాన్ని సహజమైన ఆజ్ఞారూపంలో ఇస్తుంది; ὑποκριταί ఇక్కడ భక్తిని ప్రదర్శనగా నటించేవారిని సూచిస్తుంది.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: సమాజమందిరాల్లో
  rationale: మొదటి శతాబ్దపు యూదుల ప్రార్థనా, సమావేశ స్థలమైన συναγωγή యొక్క చారిత్రక ప్రత్యేకతను నిలుపుతుంది.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: విశాల వీధుల కూడళ్లలో
  rationale: πλατεῖα యొక్క ‘విశాల వీధి/బహిరంగ మార్గం’ అనే అర్థాన్ని, γωνίαις సూచించే కూడలి మూలల భావాన్ని చదవడానికి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: నిలబడి ప్రార్థించడానికి
  rationale: నిలబడటం ప్రార్థన చేసే తీరును సూచిస్తున్న గ్రీకు నిర్మాణాన్ని కాపాడుతుంది.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: ప్రజలకు కనిపించాలని
  rationale: ఉద్దేశార్థాన్ని స్పష్టంగా తెలుపుతుంది; ἀνθρώποις ఇక్కడ స్త్రీపురుషులందరినీ సూచించే సాధారణ పదం.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: యేసు ఉపయోగించిన గంభీరమైన ధృవీకరణ సూత్రాన్ని ఆధునిక, సహజ తెలుగులో అందిస్తుంది.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: వారు తమ ప్రతిఫలాన్ని పూర్తిగా పొందారు
  rationale: ἀπέχω యొక్క వాణిజ్య వ్యవహారార్థమైన ‘పూర్తిగా చెల్లింపును పొందడం’ అనే భావాన్ని సందర్భానుసారం వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రజల ఎదుట కనిపించాలనే ఉద్దేశం
  choice: ప్రజలకు కనిపించాలని
  alternative: మనుష్యులకు కనిపించాలని
  rationale: τοῖς ἀνθρώποις లింగపరంగా సాధారణమైన మానవ వీక్షకులను సూచిస్తుంది; ‘ప్రజలు’ మూల ఉద్దేశాన్ని స్పష్టంగా అందిస్తుంది.
- issue: ప్రతిఫలం పొందిన విధానం
  choice: తమ ప్రతిఫలాన్ని పూర్తిగా పొందారు
  alternative: తమ ప్రతిఫలాన్ని పొందారు
  rationale: ἀπέχουσι అనే క్రియకు సందర్భంలో ‘పూర్తిగా అందుకోవడం/చెల్లింపు పొందడం’ అనే సాధ్యమైన వ్యవహారార్థం ఉంది. అదనపు సిద్ధాంతాన్ని చేర్చకుండా, వారి ప్రజాప్రశంసే వారికి లభించిన మొత్తం ప్రతిఫలమనే హెచ్చరికను వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. ‘సమాజమందిరం’ చారిత్రక యూదు సందర్భాన్ని నిలుపుతుంది. మూలపాఠంలో లేని ఇతర పాదసూచికలను చేర్చలేదు; [a] ప్రధాన వాక్యంలో ఉంచబడింది.
