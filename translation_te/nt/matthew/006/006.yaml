id: MAT.6.6
reference: Matthew 6:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: te
  text: అయితే నీవు ప్రార్థించేటప్పుడు, నీ లోపలి గదిలోకి[a] వెళ్లి, నీ తలుపు మూసి, మరుగున ఉన్న నీ తండ్రికి ప్రార్థించు. అప్పుడు మరుగున చూసే నీ తండ్రి నీకు ప్రతిఫలమిస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఏకాంత గది,’ ‘నిల్వ గది.’ గ్రీకు పదం ఏకాంతం కోసం లేదా వస్తువులు నిల్వ చేయడానికి ఉపయోగించే ఇంటి లోపలి గదిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నీకు తిరిగి ఇస్తాడు,’ ‘నీకు తిరిగి చెల్లిస్తాడు.’ గ్రీకు క్రియ సందర్భానుసారం తిరిగి ఇవ్వడం, తిరిగి చెల్లించడం లేదా ప్రతిఫలమివ్వడం అని అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: అయితే నీవు
  rationale: మునుపటి వచనంలోని వేషధారులతో ఉన్న వ్యత్యాసాన్ని δέ మరియు స్పష్టంగా వాడిన σὺ సూచిస్తున్నాయి; ‘అయితే నీవు’ ఆ ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὅταν προσεύχῃ
  choice: ప్రార్థించేటప్పుడు
  rationale: ὅταν తో కూడిన subjunctive సాధారణంగా లేదా పునరావృతంగా జరిగే సందర్భాన్ని సూచిస్తుంది; ఈ రూపం తెలుగులో సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: నీ లోపలి గదిలోకి వెళ్లి
  rationale: ταμεῖον ఇంటి లోపల ఏకాంతం లేదా నిల్వ కోసం ఉపయోగించే గదిని సూచించవచ్చు. ‘లోపలి గది’ ఆధునిక పాఠకునికి స్పష్టంగా ఉండి, కేవలం వస్తువులు పెట్టే గదిగానే భావాన్ని పరిమితం చేయదు.
- source_word: κλείσας τὴν θύραν σου
  choice: తలుపు మూసి
  rationale: Aorist participle ప్రధాన ఆజ్ఞకు ముందుగా జరిగే చర్యను సూచిస్తుంది; తెలుగు వరుస క్రియారూపం ఆ క్రమాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πρόσευξαι τῷ πατρί σου
  choice: నీ తండ్రికి ప్రార్థించు
  rationale: మూలంలో ఉన్న సరళమైన ఆజ్ఞను, ‘పరలోకపు’ వంటి లేని విశేషణాన్ని చేర్చకుండా, సంబంధాత్మకమైన ‘నీ తండ్రి’తో నేరుగా అనువదిస్తుంది.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: మరుగున ఉన్న
  rationale: κρυπτός లోని దాపరికం లేదా ఇతరులకు కనిపించకపోవడం అనే భావాన్ని ‘మరుగున’ తెలియజేస్తుంది; దానిని కేవలం ఒక భౌతిక రహస్య స్థలానికి పరిమితం చేయదు.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: మరుగున చూసే
  rationale: మొదటి ἐν τῷ κρυπτῷతో ఉన్న పదపునరుక్తిని ‘మరుగున’ ద్వారా నిలుపుతూ, తండ్రి దాగి ఉన్నదాన్ని చూస్తాడా లేక మరుగునుండి చూస్తాడా అనే మూలంలోని సంక్షిప్తతను పూర్తిగా విప్పి చెప్పదు.
- source_word: ἀποδώσει σοι
  choice: నీకు ప్రతిఫలమిస్తాడు
  rationale: ἀποδίδωμι సందర్భానుసారం తిరిగి ఇవ్వడం, తీర్చడం లేదా ప్రతిఫలమివ్వడం అనే అర్థాలు కలిగి ఉంటుంది. ఇక్కడ ‘ప్రతిఫలమిస్తాడు’ సానుకూల దైవ స్పందనను సహజంగా తెలియజేస్తూ, దాని స్వరూపాన్ని నిర్దిష్టం చేయదు.
theological_decisions:
- issue: ἐν τῷ κρυπτῷ అనే పదబంధం రెండుసార్లు రావడం
  choice: రెండుచోట్లా ‘మరుగున’ అని పునరావృతం చేయడం
  alternative: ‘రహస్య స్థలంలో’ / ‘రహస్యంగా’ / ‘దాగి ఉన్నదాన్ని’
  rationale: బహిరంగ ప్రదర్శనకు విరుద్ధంగా ఉన్న దాపరికాన్ని పదపునరుక్తి బలపరుస్తుంది. ఒకచోట స్థలార్థంగా, మరొకచోట కర్మార్థంగా విస్తరించి మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను తొలగించలేదు.
- issue: దేవునికి πατήρ అనే సంబోధన
  choice: తండ్రి
  alternative: పరలోకపు తండ్రి
  rationale: ఈ వచనం నేరుగా ‘నీ తండ్రి’ అని మాత్రమే చెబుతుంది. సమీప సందర్భంలోని భాషను చేర్చకుండా మూలంలోని సంబంధాత్మక సంబోధనను యథాతథంగా ఉంచింది.
- issue: ἀποδώσει యొక్క దైవ ప్రతిస్పందన భావం
  choice: ప్రతిఫలమిస్తాడు
  alternative: తిరిగి ఇస్తాడు / తీర్చుతాడు
  rationale: సందర్భం నిజమైన ప్రార్థనకు తండ్రి ఇచ్చే సానుకూల స్పందనను సూచిస్తుంది. అయితే ప్రతిఫలం ఏమిటో అనువాదం అదనంగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘లోపలి గది’ సాధారణ పాఠకునికి అర్థమయ్యే పదబంధం; ‘మరుగున’ మూలంలోని పునరుక్తి, దాపరికం, మరియు స్థలార్థం-విధార్థం మధ్య ఉన్న స్వల్ప అస్పష్టతను నిలుపుతుంది.
