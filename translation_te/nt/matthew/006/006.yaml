revisions:
- from: అయితే నీవు ప్రార్థించేటప్పుడు, నీ లోపలి గది[a]లోకి వెళ్లి, తలుపు మూసి, మరుగున ఉన్న నీ తండ్రికి ప్రార్థించు. అప్పుడు మరుగున చూసే నీ తండ్రి నీకు ప్రతిఫలమిస్తాడు[b].
  to: అయితే నీవు ప్రార్థించేటప్పుడు, నీ లోపలి గదిలోకి[a] వెళ్లి, నీ తలుపు మూసి, మరుగున ఉన్న నీ తండ్రికి ప్రార్థించు. అప్పుడు మరుగున చూసే నీ తండ్రి నీకు ప్రతిఫలమిస్తాడు[b].
  rationale: The revision makes the explicit possessive ‘your door’ visible, improves Telugu footnote-marker placement, and narrows the lexical footnote to alternatives genuinely supported by ἀποδίδωμι. It retains ‘మరుగున’ in both occurrences, preserving the Greek repetition and its compact locative/adverbial ambiguity without doctrinal expansion.
