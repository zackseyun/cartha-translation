id: MAT.6.13
reference: Matthew 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: te
  text: మమ్మల్ని శోధనలోకి నడిపించకు[a], కానీ దుష్టుని నుండి మమ్మల్ని విడిపించు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరీక్షలోకి’ లేదా ‘కష్టపరీక్షలోకి.’ ఇక్కడి గ్రీకు పదం పాపానికి ప్రలోభపరచే శోధనను లేదా పరీక్షించే కఠిన పరిస్థితిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘చెడు నుండి.’ గ్రీకు పదబంధాన్ని వ్యక్తిగతంగా ‘దుష్టుని నుండి’ అని గానీ, నిరవ్యక్తికంగా ‘చెడు నుండి’ అని గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: నడిపించకు
  rationale: μή తో కూడిన aorist subjunctive ఇక్కడ ప్రార్థనలోని నిషేధాత్మక విన్నపం. ‘నడిపించకు’ అనేది గ్రీకు వాక్యంలోని ప్రత్యక్షతను నిలుపుతుంది; ‘లోనుకానివ్వకు’ వంటి వివరణాత్మక భావాన్ని చేర్చదు.
- source_word: πειρασμόν
  choice: శోధన
  rationale: πειρασμός పాపానికి ప్రలోభపరచే శోధనను గానీ, పరీక్ష లేదా కఠినమైన ordeal‌ను గానీ సూచించగలదు. తెలుగు బైబిలు-ప్రార్థనా సందర్భంలో ‘శోధన’ సహజంగా ఉండి ఈ అర్థవిస్తృతిని కొంతవరకు నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదటిప్పణిలో స్పష్టం చేశాం.
- source_word: ῥῦσαι
  choice: విడిపించు
  rationale: ῥῦσαι దేవుడు చురుకుగా రక్షించి బయటకు తేవాలనే విన్నపాన్ని వ్యక్తం చేస్తుంది. ‘విడిపించు’ ఆధునిక తెలుగులో సహజంగా, గంభీరంగా ఉండి ప్రార్థనా లయకు సరిపోతుంది.
- source_word: τοῦ πονηροῦ
  choice: దుష్టుని నుండి
  rationale: ఆర్టికల్‌తో ఉన్న πονηροῦ రూపం పుంలింగంగా ‘దుష్టుడు’ లేదా నపుంసకలింగంగా ‘చెడు’ అని అర్థమవుతుంది. సందర్భంలో వ్యక్తిగత విరోధిని సూచించే పఠనం బలంగా ఉన్నందున ప్రధాన పాఠ్యంలో ‘దుష్టుని నుండి’ ఎంచుకుని, నిజమైన వ్యాకరణార్థ సందిగ్ధతను పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: τοῦ πονηροῦ వ్యక్తిగత దుష్టుని సూచిస్తుందా, లేక నిరవ్యక్తికమైన చెడును సూచిస్తుందా?
  choice: దుష్టుని నుండి
  alternative: చెడు నుండి
  rationale: గ్రీకు రూపం పుంలింగం, నపుంసకలింగం రెండింటికీ సరిపోతుంది. శోధనతో ఉన్న సమీప సంబంధం వ్యక్తిగత దుష్టుని పఠనానికి మద్దతు ఇస్తుంది; అయినా ‘చెడు’ అనే పఠనం కూడా నిజమైన సాధ్యత కాబట్టి దానిని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రార్థనా శైలి. మూలంలోని రెండు ప్రత్యక్ష విన్నపాల నిర్మాణాన్ని నిలిపి, అనవసర వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
