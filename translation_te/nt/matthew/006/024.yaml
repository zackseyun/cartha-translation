id: MAT.6.24
reference: Matthew 6:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: te
  text: ఎవ్వరూ ఇద్దరు యజమానులకు సేవ చేయలేరు. ఎందుకంటే అతడు ఒకరిని ద్వేషించి మరొకరిని ప్రేమిస్తాడు; లేదా ఒకరి పక్షాన నిలిచి మరొకరిని తృణీకరిస్తాడు. మీరు దేవునికీ మమ్మోనుకూ[a] సేవ చేయలేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మమ్మోను’ అంటే ‘సంపద’ లేదా ‘ధనం.’ గ్రీకు పాఠం అరామీయ మూలం గల ఈ ఋణపదాన్ని ఉపయోగిస్తుంది; ఇది సంపదను దేవునికి పోటీగా నిలిచే మరో యజమానిలా వ్యక్తీకరించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: ఎవ్వరూ
  rationale: సార్వత్రిక నిషేధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: δυσὶ κυρίοις
  choice: ఇద్దరు యజమానులకు
  rationale: δουλεύεινతో కలిసి ఇది యజమాని–దాసుడు సంబంధాన్ని సూచిస్తుంది; ఈ సందర్భంలో ‘ప్రభువులు’ కంటే ‘యజమానులు’ స్పష్టంగా ఉంటుంది.
- source_word: δουλεύειν
  choice: సేవ చేయలేరు
  rationale: మూలపదంలో దాసునిగా సేవచేసే భావం ఉంది; ‘యజమానులు’ అనే సందర్భపదం ఆ ఆధీనతను మోస్తుండగా, ఈ పదబంధం తెలుగులో సహజంగా ఉంటుంది.
- source_word: μισήσει / ἀγαπήσει
  choice: ద్వేషించి / ప్రేమిస్తాడు
  rationale: మూలంలోని బలమైన వ్యతిరేకతను తగ్గించకుండా నిలుపుతుంది.
- source_word: ἑνὸς ἀνθέξεται
  choice: ఒకరిని అంటిపెట్టుకొని
  rationale: ఒకరిని గట్టిగా పట్టుకొని, ఆయన పక్షాన నిలిచే భావాన్ని సజీవంగా వ్యక్తపరుస్తుంది.
- source_word: καταφρονήσει
  choice: తృణీకరిస్తాడు
  rationale: చులకనగా చూడటం, విలువలేనివాడిగా ఎంచటం అనే బలమైన భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: θεῷ
  choice: దేవునికి
  rationale: దైవాన్ని సూచించే దత్తి విభక్తి రూపానికి ప్రామాణిక తెలుగు అనువాదం.
- source_word: μαμωνᾷ
  choice: మమ్మోనుకు
  rationale: అరామీయ మూలం గల ఋణపదాన్ని నిలిపి, దేవునికి పోటీగా నిలిచే యజమానిలాంటి వ్యక్తీకరణను కాపాడుతుంది; అర్థాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: κύριος అనే పదాన్ని దైవ బిరుదుగా కాక సామాజిక సంబంధంలో అనువదించడం
  choice: యజమానులు
  alternative: ప్రభువులు
  rationale: బహువచన రూపం మరియు దాస్యసేవ చిత్రం ఇక్కడ మానవ యజమానులను సూచిస్తాయి; ‘ప్రభువులు’ అనడం అనవసరమైన దైవార్థ సందిగ్ధతను కలిగించవచ్చు.
- issue: μαμωνᾶς పదాన్ని అనువదించాలా లేక ఋణపదంగా నిలపాలా
  choice: మమ్మోను
  alternative: సంపద / ధనం
  rationale: దేవుడు మరియు మమ్మోను సేవను పరస్పర విరుద్ధమైన రెండు యజమానుల సేవగా వాక్యం చూపుతుంది. ఋణపదాన్ని నిలపడం ఆ వ్యక్తీకరణను కాపాడుతుంది; సాధారణ అర్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- issue: μισήσει యొక్క బలాన్ని నిలపడం
  choice: ద్వేషించి
  alternative: తక్కువగా ప్రేమించి
  rationale: ప్రేమించడం–ద్వేషించడం, అంటిపెట్టుకోవడం–తృణీకరించడం అనే సమాంతర వ్యతిరేకతను మూలపాఠం ఉద్దేశపూర్వకంగా బలంగా ఉంచుతుంది; దానిని మృదువుగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బోధనా శైలి. మూలంలోని యజమాని–సేవకుడు చిత్రం, కఠినమైన వ్యతిరేక జంటలు, చివరి వాక్యంలోని ప్రత్యక్ష బహువచన సంబోధన నిలుపబడ్డాయి. పాదసూచిక గుర్తు అది వివరించే ‘మమ్మోను’ పదానికే జోడించబడింది.
