id: MAT.6.16
reference: Matthew 6:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: te
  text: '“మీరు ఉపవాసం ఉన్నప్పుడల్లా, కపటులవలె దిగులైన ముఖంతో ఉండకండి. తాము ఉపవాసం ఉన్నట్టు మనుషులకు కనిపించడానికి వారు తమ ముఖాలను చెడగొట్టుకుంటారు. నేను మీతో నిజంగా చెబుతున్నాను: వారు తమ ప్రతిఫలాన్ని పూర్తిగా పొందారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: మీరు ఉపవాసం ఉన్నప్పుడల్లా
  rationale: ὅταν యొక్క అనిర్దిష్ట, పునరావృత కాలభావాన్ని ‘ఉన్నప్పుడల్లా’ సహజంగా తెలియజేస్తుంది; δέ సందర్భంలోని ముందరి ఉపదేశాలతో అనుసంధానమవుతుంది, తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే ప్రవాహం స్పష్టంగా ఉంటుంది.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: ముఖం దిగులుగా పెట్టుకోకండి
  rationale: γίνεσθε లోని ఒక స్థితిని ధరించడం అనే భావాన్ని, σκυθρωποί సూచించే ఉద్దేశపూర్వక దిగులైన ముఖకవళికతో కలిపి సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ὡς οἱ ὑποκριταὶ
  choice: వేషధారుల్లా
  rationale: ὑποκριτής ఇక్కడ భక్తిని ప్రదర్శనగా చేసే కపట వ్యక్తిని సూచిస్తుంది; ‘వేషధారులు’ మూలపదంలోని నటన/కపట ప్రదర్శన ఛాయను నిలుపుతుంది.
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: తమ ముఖాలను వికారంగా చేసుకుంటారు
  rationale: ముఖాన్ని మార్చి, చెడిపోయినట్టుగా లేదా కృశించినట్టుగా చూపించే సందర్భార్థాన్ని అందిస్తుంది; కేవలం ‘నిర్లక్ష్యం చేస్తారు’ అని పరిమితం చేయదు.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: తాము ఉపవాసం ఉన్నట్టు మనుషులకు కనిపించడానికి
  rationale: ὅπως యొక్క ఉద్దేశార్థాన్ని, φανῶσιν యొక్క ‘కనిపించడం’ భావాన్ని కాపాడుతుంది. ἄνθρωποι ఇక్కడ మానవులను సాధారణంగా సూచిస్తుంది; ‘మనుషులు’ తెలుగులో సహజంగా సమగ్రార్థం ఇస్తుంది.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: యేసు పలికే గంభీరమైన ధృవీకరణ సూత్రాన్ని స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: వారు తమ ప్రతిఫలాన్ని పూర్తిగా పొందేశారు
  rationale: ἀπέχω యొక్క వాణిజ్యసంబంధ జాతీయ ప్రయోగం—పూర్తి చెల్లింపును అందుకొని ఇక మరే హక్కూ మిగలకపోవడం—తెలియజేయడానికి ‘పూర్తిగా’ అవసరం; μισθός కు సందర్భానుగుణంగా ‘ప్రతిఫలం’ సరిపోతుంది.
theological_decisions:
- issue: τοῖς ἀνθρώποις యొక్క సాధారణ మానవార్థం
  choice: మనుషులకు
  alternative: ప్రజలకు / ఇతరులకు
  rationale: ఈ బహువచనం సందర్భంలో పురుషులను మాత్రమే కాక ప్రజలను సాధారణంగా సూచిస్తుంది. ‘మనుషులకు’ మూలపదానికి దగ్గరగా ఉండి సమగ్రార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- issue: ἀπέχουσιν τὸν μισθὸν αὐτῶν యొక్క సంపూర్ణ స్వీకరణ భావం
  choice: తమ ప్రతిఫలాన్ని పూర్తిగా పొందేశారు
  alternative: తమ ప్రతిఫలాన్ని పొందుతున్నారు / వారికి ప్రతిఫలం ఉంది
  rationale: మానవుల ప్రశంసే వారికి లభించే పూర్తి ప్రతిఫలమని వాక్యం సూచిస్తుంది. ‘పూర్తిగా’ అనే పదం జాతీయ ప్రయోగంలోని ఇకపై బాకీ లేదనే భావాన్ని నిలుపుతుంది; దైవ ప్రతిఫలంపై అంతర్లీన హెచ్చరికను అతిగా వివరించదు.
- issue: ἀφανίζουσιν యొక్క సందర్భార్థం
  choice: తమ ముఖాలను వికారంగా చేసుకుంటారు
  alternative: తమ ముఖాలను నిర్లక్ష్యం చేస్తారు / గుర్తుపట్టలేనివిగా చేసుకుంటారు
  rationale: వారు ఖచ్చితంగా ఏ పద్ధతిలో ముఖరూపాన్ని మార్చారో మూలం నిర్దిష్టం చేయదు. ఎటువంటి ప్రత్యేక ఉపవాసాచారాన్నీ చేర్చకుండా, కనిపించే రూపాన్ని ఉద్దేశపూర్వకంగా చెడగొట్టడాన్ని ఈ అనువాదం తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన సంభాషణ శైలి. మూలంలోని రెండవ పురుష బహువచనాన్ని ‘మీరు/మీతో’గా, కపట ప్రదర్శనపై ఉన్న పదునైన విమర్శను అతిశయోక్తి లేకుండా నిలుపుకుంది. ఈ వచనానికి అవసరమైన పాఠభేద లేదా పదార్థ పాదటిప్పణి లేదు.
