revisions:
- from: '“మీరు ఉపవాసం ఉన్నప్పుడల్లా, వేషధారుల్లా ముఖం దిగులుగా పెట్టుకోకండి. తాము ఉపవాసం ఉన్నట్టు మనుషులకు కనిపించడానికి వారు తమ ముఖాలను వికారంగా చేసుకుంటారు. నేను మీతో నిజంగా చెబుతున్నాను: వారు తమ ప్రతిఫలాన్ని పూర్తిగా పొందేశారు.”'
  to: '“మీరు ఉపవాసం ఉన్నప్పుడల్లా, కపటులవలె దిగులైన ముఖంతో ఉండకండి. తాము ఉపవాసం ఉన్నట్టు మనుషులకు కనిపించడానికి వారు తమ ముఖాలను చెడగొట్టుకుంటారు. నేను మీతో నిజంగా చెబుతున్నాను: వారు తమ ప్రతిఫలాన్ని పూర్తిగా పొందారు.”'
  rationale: 'The revision corrects the key term for ‘hypocrites,’ moderates an unnecessarily strong description of altering the face while preserving the source’s deliberate appearance-spoiling, and maintains a solemn modern-standard register. No footnote is required: the generic force of “మనుషులు” and the full-receipt sense of “పూర్తిగా పొందారు” are clear in Telugu.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:30:35Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the iterative temporal clause, prohibition, purpose clause, inclusive sense of τοῖς ἀνθρώποις, and the idiomatic force of ἀπέχουσιν τὸν μισθὸν αὐτῶν. However, “వేషధారులు” primarily denotes people in disguise/costume and does not adequately express ὑποκριταί in its established moral sense of hypocrites. “వికారంగా” can suggest a grotesque physical deformity more strongly than the source requires.
  naturalness: The overall Telugu is clear and modern. Replacing the more colloquial-completive “పొందేశారు” with “పొందారు” retains the full-receipt idiom when paired with “పూర్తిగా” and better suits the solemn register.
  terminology: “కపటులు” is the natural modern Telugu term for ὑποκριταί in this ethical-religious context, without importing an interpretive explanation. “మనుషులకు” appropriately conveys the generic human reference. “ప్రతిఫలం” is suitable for μισθός here.
  issues:
  - severity: medium
    issue: వేషధారుల్లా for ὡς οἱ ὑποκριταὶ
    rationale: This can mean ‘like those wearing a disguise/costume’ and foregrounds theatrical disguise rather than the hypocrisy meant in the context. “కపటులవలె” directly conveys the source term’s relevant sense.
  - severity: low
    issue: వికారంగా for ἀφανίζουσιν
    rationale: It may imply severe or grotesque bodily distortion. “చెడగొట్టుకుంటారు” retains the deliberate spoiling of their facial appearance without specifying a method or intensifying the action.
  - severity: low
    issue: పొందేశారు for ἀπέχουσιν
    rationale: Although understandable, this completion form is somewhat colloquial. “పూర్తిగా పొందారు” is more even in register and preserves the commercial idiom’s full-receipt sense.
  revised_text: '“మీరు ఉపవాసం ఉన్నప్పుడల్లా, కపటులవలె దిగులైన ముఖంతో ఉండకండి. తాము ఉపవాసం ఉన్నట్టు మనుషులకు కనిపించడానికి వారు తమ ముఖాలను చెడగొట్టుకుంటారు. నేను మీతో నిజంగా చెబుతున్నాను: వారు తమ ప్రతిఫలాన్ని పూర్తిగా పొందారు.”'
  revised_footnotes: []
