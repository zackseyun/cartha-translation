id: MAT.6.15
reference: Matthew 6:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: te
  text: కానీ మీరు మనుష్యులను క్షమించకపోతే, మీ తండ్రి కూడా మీ అపరాధాలను క్షమించడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: కానీ ... క్షమించకపోతే
  rationale: ἐάν షరతును, δέ ముందటి వాక్యంతో వ్యత్యాసాన్ని, μή నిరాకరణను సూచిస్తున్నాయి. ఆధునిక తెలుగులో ఈ సమ్మేళనం సహజంగా షరతుతో కూడిన వ్యతిరేక భావాన్ని తెలియజేస్తుంది.
- source_word: ἀφῆτε
  choice: క్షమించకపోతే
  rationale: ఈ సందర్భంలో ἀφίημι వ్యక్తుల అపరాధాలను క్షమించడాన్ని సూచిస్తుంది. తరువాతి ἀφήσειతో ఉన్న పదపునరుక్తిని తెలుగులోనూ ‘క్షమించు’తో నిలిపాం.
- source_word: τοῖς ἀνθρώποις
  choice: మనుష్యులను
  rationale: ἄνθρωποι ఇక్కడ పురుషులను మాత్రమే కాక సాధారణంగా మానవులను సూచిస్తుంది. ‘మనుష్యులు’ మూలపదాన్ని స్పష్టంగా, లింగపరంగా సమగ్రంగా అందిస్తుంది.
- source_word: οὐδὲ
  choice: కూడా ... క్షమించడు
  rationale: οὐδέ షరతు నెరవేరనప్పుడు దానికి సమాంతరమైన ఫలితమూ జరగదని ప్రతికూలంగా బలపరుస్తుంది. తెలుగులో ‘కూడా ... కాదు/డు’ ఈ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ πατὴρ ὑμῶν
  choice: మీ తండ్రి
  rationale: గ్రీకు పాఠంలో ‘పరలోకపు’ అనే విశేషణం లేదు; అందువల్ల మూలంలోని సరళమైన ‘మీ తండ్రి’నే ఉంచాం.
- source_word: ἀφήσει
  choice: క్షమించడు
  rationale: భవిష్యత్ క్రియను తెలుగులో సహజమైన సాధారణ భవిష్యత్ రూపంతో ఇచ్చి, మొదటి ἀφίημι పదంతో భావపరమైన సమాంతరతను నిలిపాం.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: మీ అపరాధాలను
  rationale: παραπτώματα నైతిక తప్పులు, అతిక్రమాలు లేదా అపరాధాలను సూచిస్తుంది. ‘అపరాధాలు’ ఆధునిక సాధారణ తెలుగులో స్పష్టంగా ఉండి తగిన నైతిక బరువును కలిగి ఉంది.
theological_decisions:
- issue: మనుష్యులు క్షమించడానికి దేవుని క్షమాపణకు మధ్య ఉన్న షరతుతో కూడిన సంబంధం
  choice: మూలంలోని ప్రత్యక్ష షరతును తగ్గించకుండా ఉంచడం
  alternative: ఇది కేవలం నిజమైన విశ్వాసానికి రుజువు అని గానీ, సహవాసం కోల్పోవడాన్ని మాత్రమే సూచిస్తుందని గానీ వివరణాత్మకంగా మార్చడం
  rationale: గ్రీకు వాక్యం ప్రత్యక్షమైన షరతు-ఫలిత సంబంధాన్ని తెలియజేస్తుంది. విస్తృతమైన సిద్ధాంత చర్చలను అనువాదంలో పరిష్కరించకుండా, ‘మీ తండ్రి కూడా ... క్షమించడు’ అనే ఉద్రిక్తతను యథాతథంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. ‘మనుష్యులు’ లింగపరంగా సమగ్రం. ‘అపరాధాలు’ ప్రాచీనంగా వినిపించే ప్రత్యామ్నాయాలకన్నా సహజమైనది. పాదసూచిక అవసరం లేదు; ఆంగ్ల పాఠంలోని [a] గుర్తు స్థానపరంగా ‘people’ తరువాత ఉన్నప్పటికీ దాని పాదసూచిక విషయం ‘trespasses’ యొక్క పదప్రత్యామ్నాయాలకు సంబంధించినది; తెలుగు ప్రధాన పాఠంలో ‘అపరాధాలు’ స్పష్టంగా ఉండటంతో అసంబద్ధ గుర్తును దిగుమతి చేయలేదు.
