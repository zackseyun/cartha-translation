review_pass:
  verdict: approve
  source_fidelity: The Telugu accurately preserves the contrastive conditional structure (ἐὰν δὲ μὴ), the generic reference to people (τοῖς ἀνθρώποις), the repeated forgiveness verb (ἀφῆτε/ἀφήσει), and the direct negative consequence introduced by οὐδέ. It does not add “heavenly,” which is absent from this verse.
  naturalness: The sentence is clear, idiomatic modern standard Telugu, and retains an appropriately sober biblical register. “కూడా ... క్షమించడు” naturally conveys the negative parallel, “neither will.”
  terminology: “క్షమించు” consistently renders both occurrences of ἀφίημι in this interpersonal-forgiveness context. “అపరాధాలు” is a natural and suitably weighty rendering of παραπτώματα. “మనుష్యులు” is generic and not male-exclusive in intended sense.
