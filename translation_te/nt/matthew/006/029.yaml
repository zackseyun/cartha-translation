id: MAT.6.29
reference: Matthew 6:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: te
  text: 'అయినా, నేను మీతో చెబుతున్నాను: సొలొమోను తన సమస్త వైభవంలో[a] కూడా వీటిలో ఒక్కదానిలా వస్త్రాలు ధరించలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన సమస్త మహిమలో కూడా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: అయితే నేను మీతో చెబుతున్నాను
  rationale: λέγω + దత్తివిభక్తి సహజంగా ‘మీతో చెబుతున్నాను’ అని వస్తుంది. δέ ముందున్న మాటకు స్వల్ప వ్యత్యాసాన్ని సూచిస్తున్నందున ‘అయితే’ సందర్భానికి సరిపోతుంది.
- source_word: οὐδὲ
  choice: కూడా ... లేదు
  rationale: సొలొమోను వంటి మహారాజు సైతం ఈ పోలికకు సరిపోలలేదనే బలమైన నిరాకరణను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Σολομὼν
  choice: సొలొమోను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: తన వైభవమంతటిలో
  rationale: ఇక్కడ δόξα దైవిక మహిమకన్నా రాజసమైన శోభ, సంపద, ఘనతను సూచిస్తుంది. ‘వైభవం’ ఆధునిక తెలుగులో ఈ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: περιεβάλετο
  choice: అలంకరించుకోలేదు
  rationale: మధ్యమ రూపం వస్త్రధారణను సూచిస్తుంది; పూల అలంకరణతో పోల్చే సందర్భంలో ‘అలంకరించుకోలేదు’ సహజంగా ఉండి, కేవలం దుస్తులు వేసుకోవడాన్ని మించిన దృశ్య శోభను కూడా తెలియజేస్తుంది.
- source_word: ὡς ἓν τούτων
  choice: వీటిలో ఒక్కదానిలా
  rationale: ἓν అనే ఏకవచన బలాన్ని నిలుపుతూ, సమీప సందర్భంలోని పువ్వుల్లో ఒక్కదానితో పోలికను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: సొలొమోనుకు సంబంధించిన δόξα స్వభావం
  choice: రాజసమైన శోభ అనే భావంలో ‘వైభవం’
  alternative: మహిమ
  rationale: ఈ సందర్భం సొలొమోను రాజవైభవాన్ని దేవుడు పువ్వులకు ఇచ్చిన అలంకరణతో పోలుస్తుంది. ‘వైభవం’ అనడం వల్ల దైవిక మహిమ అనే అనవసర భావాన్ని రుద్దకుండా సందర్భార్థం నిలుస్తుంది.
- issue: περιεβάλετο లోని మధ్యమ/నిష్క్రియ రూపం
  choice: అలంకరించుకోలేదు
  alternative: వస్త్రాలు ధరించలేదు / అలంకరింపబడలేదు
  rationale: గ్రీకు రూపం స్వయంగా ధరించుకోవడం లేదా ధరింపబడడం రెండింటికీ అవకాశమిస్తుంది. తెలుగులో ‘అలంకరించుకోలేదు’ పోలిక యొక్క భావాన్ని సహజంగా అందిస్తుంది; అలంకరణకు అంతిమ కారణం ఎవరో అదనంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన బైబిలు శైలి. ‘వీటిలో’ అనే సూచన ముందున్న సందర్భంలోని పొలపు పువ్వులను సూచిస్తుంది.
