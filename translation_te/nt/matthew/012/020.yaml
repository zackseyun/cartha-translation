id: MAT.12.20
reference: Matthew 12:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: te
  text: నలిగిన రెల్లును ఆయన విరువడు; పొగలు వస్తున్న వత్తిని[a] ఆర్పడు—న్యాయానికి విజయం కలిగించేవరకు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పొగలు వస్తున్న అవిసె నారను.” గ్రీకు పదం అక్షరార్థంగా దీపపు వత్తిగా ఉపయోగించే అవిసె నారను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తీర్పుకు విజయం కలిగించేవరకు.”
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον
  choice: రెల్లు
  rationale: κάλαμος ఇక్కడ రెల్లు లేదా రెల్లు కాండాన్ని సూచిస్తుంది. యెషయా ప్రవచనంలోని రూపకానికి ‘రెల్లు’ సహజమైన తెలుగు సమానం.
- source_word: συντετριμμένον
  choice: నలిగిన
  rationale: συντρίβω నుండి వచ్చిన ఈ పదం నలిగిపోయిన లేదా దెబ్బతిన్న స్థితిని సూచిస్తుంది. తరువాత ‘విరువడు’ అని ఉన్నందున, ఇప్పటికే పూర్తిగా విరిగిపోయిందనే భావం రాకుండా ‘నలిగిన’ అని అనువదించబడింది.
- source_word: κατεάξει
  choice: విరువడు
  rationale: κατάγνυμι అంటే విరచడం లేదా విరిచివేయడం. ‘విరువడు’ రూపకంలోని సున్నితత్వాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: λίνον
  choice: వత్తి
  rationale: λίνον అక్షరార్థంగా అవిసె నారను సూచించినా, ఇక్కడ దీపంలో ఉపయోగించే అవిసె నార వత్తి ఉద్దేశించబడింది. ఆధునిక పాఠకునికి వస్తువు వెంటనే అర్థమయ్యేలా ‘వత్తి’ ఎంచుకోబడింది; అక్షరార్థ రూపం పాదసూచికలో ఉంచబడింది.
- source_word: τυφόμενον
  choice: పొగలు కక్కుతున్న
  rationale: τύφομαι ఆరిపోవడానికి దగ్గరగా ఉండి పొగ వెలువరిస్తున్న వత్తిని వర్ణిస్తుంది. ‘పొగలు కక్కుతున్న’ అనేది ఆ బలహీనమైన మండే స్థితిని సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: σβέσει
  choice: ఆర్పడు
  rationale: σβέννυμι అంటే మంటను ఆర్పడం. దీపపు వత్తి సందర్భంలో ‘ఆర్పడు’ స్పష్టమైన, సాధారణ తెలుగు ప్రయోగం.
- source_word: ἕως ἂν
  choice: చేర్చేవరకు
  rationale: ఈ నిర్మాణం ముందున్న నిరాకరణలు కొనసాగు భవిష్యత్ గమ్యబిందువును సూచిస్తుంది. ‘వరకు’ అనే రూపం మూలంలోని కాలసంబంధ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
- source_word: ἐκβάλῃ
  choice: చేర్చే
  rationale: ἐκβάλλω అక్షరార్థంగా బయటికి తేవడం అనే భావం కలిగినా, ఇక్కడ న్యాయం నిర్ణాయక ఫలితాన్ని పొందేలా చేయడాన్ని సూచిస్తుంది. ‘చేర్చే’ అనేది εἰς νῖκοςతో కలిసి గమ్యభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς νῖκος
  choice: విజయానికి
  rationale: ఈ పదబంధం విజయవంతమైన ఫలితాన్ని లేదా గమ్యాన్ని సూచిస్తుంది. ‘విజయానికి’ దాని దిశా, ఫలిత భావాలను నిలుపుతుంది.
- source_word: τὴν κρίσιν
  choice: న్యాయాన్ని
  rationale: κρίσις అంటే ‘న్యాయం’ లేదా ‘తీర్పు’ కావచ్చు. యెషయా సేవకుని సందర్భంలో న్యాయమైన క్రమాన్ని స్థాపించే విస్తృత భావానికి ‘న్యాయం’ సరిపోతుంది; ‘తీర్పు’ పాదసూచికలో ప్రత్యామ్నాయంగా ఇవ్వబడింది.
theological_decisions:
- issue: యెషయా సేవకుని ఉల్లేఖనంలో κρίσις అనువాదం
  choice: న్యాయం
  alternative: తీర్పు
  rationale: ఈ సందర్భం కేవలం శిక్షాత్మక తీర్పు ప్రకటించడం కంటే దేవుని న్యాయమైన క్రమాన్ని ఫలప్రదంగా స్థాపించే సేవకుని కార్యాన్ని సూచిస్తుంది. అయినా κρίσιςలోని న్యాయనిర్ణయ భావాన్ని పాదసూచికలో ‘తీర్పు’గా భద్రపరచబడింది.
- issue: దీపపు రూపకంలో అక్షరార్థ స్థాయి
  choice: వత్తి … ఆర్పడు
  alternative: అవిసె నార … ఆర్పడు
  rationale: గ్రీకు పదం అవిసె నారను అక్షరార్థంగా సూచించినా, సందర్భంలో అది దీపపు వత్తిగా ఉపయోగించిన నార. ప్రధాన పాఠంలో ఉద్దేశిత వస్తువును స్పష్టంగా ఇచ్చి, అక్షరార్థ రూపాన్ని పాదసూచికలో నిలుపబడింది.
- issue: ἕως ἂν వల్ల కలిగే కాలసంబంధ ఉద్వేగం
  choice: విజయానికి చేర్చేవరకు
  alternative: న్యాయం విజయం పొందేలా చేసేదాకా
  rationale: ‘వరకు’ అనే మూల నిర్మాణాన్ని నిలుపుతూ, తరువాత అతడు రెల్లును విరుస్తాడా లేదా వత్తిని ఆర్పుతాడా అనే ప్రశ్నను అనువాదంలో సిద్ధాంతపరంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘రెల్లు,’ ‘వత్తి,’ ‘న్యాయం’ వంటి సాధారణంగా అర్థమయ్యే పదాలు ఎంచుకోబడ్డాయి. గ్రీకు వాక్యంలోని సమాంతర నిర్మాణాన్ని అర్ధవిరామాలతో, చివరి గమ్యవాక్యాన్ని దీర్ఘవిరామంతో స్పష్టంచేయబడింది.
