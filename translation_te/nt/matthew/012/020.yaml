  source_fidelity: 'మూల గ్రీకు భావం ప్రధానంగా సరిగ్గా ప్రతిఫలించింది: నలిగిన రెల్లు, పొగ విడిచే దీపపు వత్తి, అలాగే న్యాయాన్ని విజయానికి చేర్చడం అనే యెషయా-సందర్భ రూపకం నిలిచాయి. ‘వరకు’ ἕως ἂν యొక్క కాలసంబంధ పరిమితిని, దాని తరువాతి చర్యలపై నిర్ణయం చెప్పకుండా, కాపాడుతుంది.'
  naturalness: ‘పొగలు కక్కుతున్న’ అనేది అర్థవంతమే అయినా కొద్దిగా కఠినమైన/వ్యావహారికమైన ప్రయోగం. దీపపు వత్తికి ‘పొగలు వస్తున్న’ మరింత సహజమైన, సౌమ్యమైన ఆధునిక ప్రామాణిక తెలుగు. ‘న్యాయాన్ని విజయానికి చేర్చేవరకు’ అర్థమవుతున్నప్పటికీ, ‘న్యాయానికి విజయం కలిగించేవరకు’ తెలుగు వాక్యనిర్మాణంలో మరింత ప్రవాహంగా ఉంది మరియు గ్రీకు గమ్యార్థాన్ని నిలుపుతుంది.
  terminology: ‘రెల్లు,’ ‘వత్తి,’ ‘ఆర్పడు,’ ‘న్యాయం’ సరైన పదాలు. κρίσιςకు ‘న్యాయం’ ప్రధాన పాఠంలో సముచితం; ‘తీర్పు’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం మంచిది. λίνονకు ‘వత్తి’ సందర్భానుగుణంగా ఖచ్చితమైనది; అవిసె నార అనే అక్షరార్థాన్ని పాదసూచిక భద్రపరుస్తుంది.
