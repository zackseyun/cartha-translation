  to: నలిగిన రెల్లును ఆయన విరువడు; పొగలు వస్తున్న వత్తిని[a] ఆర్పడు—న్యాయానికి విజయం కలిగించేవరకు[b].
  rationale: రూపకం, సమాంతర వాక్యనిర్మాణం, మరియు ἕως ἂν యొక్క ఉద్దేశపూర్వక కాలసంబంధ అస్పష్టతను మార్చకుండా, రెండు ప్రయోగాలను ఆధునిక ప్రామాణిక తెలుగులో మరింత సహజంగా సవరించాను. పాదసూచికల సూచికలు వాటి సంబంధిత పదబంధాల వద్దనే ఉన్నాయి.
