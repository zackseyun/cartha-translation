id: MAT.12.8
reference: Matthew 12:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: te
  text: ఎందుకంటే మనుష్యకుమారుడు విశ్రాంతిదినానికి ప్రభువు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మనుష్యకుమారుడు విశ్రాంతిదినంపై అధికారం గలవాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘మనుష్యకుమారుడు’ అనేది సువార్తల్లో యేసు తనను సూచించుకోవడానికి విశిష్టంగా ఉపయోగించే పేరు. ఈ మాటలను మరింత సాధారణంగా ‘మానవుడు’ అని కూడా అర్థం చేసుకోవచ్చు; అయితే అలా అనువదిస్తే దీనిలో ఉండే బిరుదు భావం బలహీనపడుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: మునుపటి వాదనకు ఈ ప్రకటన ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: అధికారాన్ని, బిరుదులోని ధార్మిక బరువును రెండింటినీ నిలుపుతుంది; ‘యజమాని’ సాధ్యమైన అర్థమైనా ఇక్కడ భావాన్ని కొంత బలహీనపరచవచ్చు.
- source_word: τοῦ σαββάτου
  choice: విశ్రాంతిదినానికి
  rationale: κύριος తరువాత ఉన్న సంబంధవాచక రూపాన్ని సహజమైన తెలుగు నిర్మాణంలో తెలియజేస్తుంది; ఇది సాధారణ విశ్రాంతిని కాక యూదుల పవిత్ర విశ్రాంతిదినాన్ని సూచిస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: సువార్తల్లో యేసు తనను సూచించుకోవడానికి విశిష్టంగా ఉపయోగించే బిరుదును, దాని అంతర్గ్రంథ ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ἐστιν
  choice: —డు
  rationale: గ్రీకు వర్తమానకాల సంధాన క్రియ భావం తెలుగులో విధేయ నామపదమైన ‘ప్రభువు’తో సహజంగా వ్యక్తమవుతుంది; ప్రత్యేకంగా ‘అయి ఉన్నాడు’ అని విస్తరించాల్సిన అవసరం లేదు.
theological_decisions:
- issue: κύριος ... τοῦ σαββάτου అనే మాటలోని క్రీస్తుసంబంధమైన అధికార భావం
  choice: ‘మనుష్యకుమారుడు విశ్రాంతిదినానికి ప్రభువు’ అని బలమైన అధికార బిరుదుగా అనువదించడం.
  alternative: ‘మనుష్యకుమారుడు విశ్రాంతిదినానికి యజమాని.’
  rationale: విశ్రాంతిదినానికి సంబంధించి మనుష్యకుమారుని అధికారాన్ని వాక్యం బలంగా ప్రకటిస్తుంది. ‘ప్రభువు’ ఆ బరువును నిలుపుతుంది; అయితే మూలపాఠం చెప్పినదానికంటే అదనపు సిద్ధాంత వివరణను చేర్చదు.
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనువాదం
  choice: స్థిరమైన బిరుదుగా ‘మనుష్యకుమారుడు’ అని అనువదించడం.
  alternative: ‘మానవుడు’ లేదా ‘మనిషి’ అని సాధారణార్థంలో అనువదించడం.
  rationale: సువార్త సంప్రదాయంలో ఇది యేసు యొక్క విశిష్ట స్వీయనామం. బిరుదును నిలపడం దాని సాధ్యమైన దానియేలు 7 ప్రతిధ్వనిని, భావంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘విశ్రాంతిదినం’ సాధారణ పాఠకులకు అర్థమయ్యేలా సబ్బాతును సూచిస్తుంది; ‘మనుష్యకుమారుడు,’ ‘ప్రభువు’ అనే స్థిరమైన బైబిలు బిరుదులు భావబరువును నిలుపుతాయి.
