id: MAT.12.7
reference: Matthew 12:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: te
  text: కానీ, ‘నేను బలిని కాదు, కనికరాన్నే కోరుతున్నాను’[a] అనే మాటకు అర్థమేమిటో మీరు తెలుసుకొని ఉంటే, నిర్దోషులను[b] ఖండించి ఉండేవారు కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యేసు హోషేయ 6:6ను ఉటంకిస్తున్నాడు.
    reason: cross_reference
  - marker: b
    text: లేదా, ‘అపరాధం లేనివారిని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: మీరు తెలుసుకొని ఉంటే
  rationale: అవాస్తవ గత షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, ముందే గ్రహించాల్సిన విషయాన్ని గ్రహించలేదనే యేసు గద్దింపును నిలుపుతుంది.
- source_word: τί ἐστιν
  choice: అనే మాటకు అర్థమేమిటో
  rationale: ఉల్లేఖించిన లేఖనవాక్యపు భావాన్ని గ్రహించడమే సందర్భంలోని ఉద్దేశం; ఇది తెలుగులో సహజంగా ఉంది.
- source_word: Ἔλεος
  choice: కనికరం
  rationale: ἔλεος సూచించే దయాపూర్వక ప్రవర్తనను సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; సందర్భంలో కేవలం భావోద్వేగం కాక, దయతో వ్యవహరించడం ప్రధానమైనది.
- source_word: θέλω
  choice: కోరుతున్నాను
  rationale: ప్రవచన ఉల్లేఖనానికి తగిన గౌరవభరిత శైలిలో దేవుని అభిలాషను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: θυσίαν
  choice: బలి
  rationale: ఆచార సంబంధమైన అర్పణను సంక్షిప్తంగా, సంప్రదాయబద్ధంగా, స్పష్టంగా సూచిస్తుంది.
- source_word: κατεδικάσατε
  choice: దోషులుగా తీర్చేవారు కాదు
  rationale: న్యాయపరమైన ఖండన భావాన్ని తెలుగులో స్పష్టంగా చూపిస్తుంది; అవాస్తవ గత షరతు ఫలితాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀναιτίους
  choice: నిర్దోషులను
  rationale: దోషారోపణకు అర్హులు కానివారనే న్యాయపరమైన భావాన్ని నిలుపుతుంది; ‘అపరాధం లేనివారు’ అనే అర్థం కూడా సాధ్యమే.
theological_decisions:
- issue: హోషేయ 6:6 ఉల్లేఖనంలోని కనికరం–బలి వ్యత్యాసాన్ని ఎలా నిలుపాలి
  choice: నేను బలిని కాదు, కనికరాన్నే కోరుతున్నాను
  alternative: నేను కనికరాన్ని కోరుతున్నాను, బలిని కాదు
  rationale: గ్రీకు వాక్యంలోని పదక్రమం ‘కనికరం’ను ముందుకు తెచ్చినా, తెలుగులో ‘బలిని కాదు, కనికరాన్నే’ అనే నిర్మాణం οὐ యొక్క వ్యత్యాసాన్ని సహజంగా మరియు పదునుగా తెలియజేస్తుంది. ఇది బలిని అన్ని సందర్భాల్లో రద్దు చేస్తున్నట్లు విస్తరించకుండా, ఆచారంపై కనికరానికి ఇచ్చిన ప్రవచనాత్మక ప్రాధాన్యాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే లేఖన ఉల్లేఖనానికి తగిన గౌరవభరిత శైలితో రూపొందించబడింది. మూలంలోని అవాస్తవ గత షరతు మరియు న్యాయపరమైన పదజాలం నిలుపబడ్డాయి.
