  - marker: b
    text: లేదా, ‘అపరాధం లేనివారిని.’
    reason: lexical_alternative
  revision_rationale: The revision changes only the final verb phrase to preserve the completed-past, contrary-to-fact force of the Greek. It retains the draft’s natural modern Telugu, the quotation’s emphatic contrast between mercy and sacrifice, and both correctly placed footnotes.
