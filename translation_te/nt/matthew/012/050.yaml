id: MAT.12.50
reference: Matthew 12:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: te
  text: ఎందుకంటే పరలోకంలో ఉన్న నా తండ్రి చిత్తాన్ని ఎవరైతే చేస్తారో, వారే నాకు సోదరుడు, సోదరి, తల్లి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: ఎవరు ... నెరవేరుస్తారో
  rationale: ఈ అనిర్దిష్ట సంబంధవాచక నిర్మాణం సాధారణంగా ఎవరికైనా వర్తించే షరతును తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘ఎవరు ... చేస్తారో’ అనే నిర్మాణం ఆ విస్తృత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భానికి ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ποιήσῃ τὸ θέλημα
  choice: చిత్తాన్ని ... నెరవేరుస్తారో
  rationale: ‘చిత్తాన్ని నెరవేర్చడం’ అనేది కేవలం తెలుసుకోవడం కాక, దానికి అనుగుణంగా కార్యం చేయడాన్ని సహజంగా తెలియజేస్తుంది; ‘లోబడడం’ అని అనువదిస్తే మూలంలోని ποιέω భావం కొంత సంకుచితమవుతుంది.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: పరలోకంలో ఉన్న నా తండ్రి
  rationale: మూలంలోని సంబంధాన్ని, స్థల సూచనను రెండింటినీ స్పష్టంగా ఉంచుతూ తెలుగులో సహజమైన పదక్రమాన్ని ఉపయోగిస్తుంది.
- source_word: αὐτός
  choice: ఆ వ్యక్తే
  rationale: αὐτός లోని ఉద్ఘాటనను ‘ఏ’ నిలుపుతుంది. ‘ఆ వ్యక్తి’ సాధారణ వర్తింపును తెలుగులో సహజంగా తెలియజేస్తుంది; మూలంలోని వ్యాకరణపరమైన పుంలింగ ఏకవచన రూపం గురించి పాదసూచిక వివరిస్తుంది.
- source_word: ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ
  choice: సోదరుడు, సోదరి, తల్లి
  rationale: మూలంలో విడివిడిగా పేర్కొన్న మూడు కుటుంబ సంబంధాలనూ ఏకవచనంలో యథాతథంగా నిలుపుతుంది.
- source_word: μου
  choice: నాకు
  rationale: తెలుగులో ‘నాకు సోదరుడు/సోదరి/తల్లి’ అనడం ఈ బంధ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సాధారణ వర్తింపుగల వాక్యంలో వ్యాకరణపరమైన పుంలింగ ఏకవచనం
  choice: ఆ వ్యక్తే
  alternative: అతడే
  rationale: గ్రీకులో ὅστις, αὐτός పుంలింగ ఏకవచన రూపాల్లో ఉన్నప్పటికీ అవి ఇక్కడ సాధారణంగా ఎవరికైనా వర్తిస్తాయి. తెలుగు ‘ఆ వ్యక్తే’ ఆ సాధారణ పరిధిని సహజంగా కాపాడుతుంది; అదే సమయంలో మూల రూపాన్ని పాదసూచికలో పారదర్శకంగా తెలియజేస్తుంది. వాక్యమే ‘సోదరి,’ ‘తల్లి’ అని పేర్కొనడం వల్ల స్త్రీలను కూడా స్పష్టంగా కలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని అనుసరించాం. ‘చిత్తం’ అనే పదం దైవసంబంధ సందర్భంలోని భావగాంభీర్యాన్ని నిలుపుతుంది; ‘నెరవేర్చడం’ కార్యాచరణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
