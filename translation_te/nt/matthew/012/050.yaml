    text: గ్రీకు మూలంలో ‘ఎవరైతే’ మరియు ‘వారే’కు సంబంధించిన రూపాలు వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉన్నాయి; ఇక్కడ అవి సాధారణంగా ఎవరికైనా వర్తిస్తాయి.
    reason: lexical_alternative
