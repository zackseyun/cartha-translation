id: MAT.12.36
reference: Matthew 12:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: te
  text: 'అయితే నేను మీతో చెబుతున్నాను: మనుషులు పలికే ప్రతి నిర్లక్ష్యమైన మాట[a]కు తీర్పు రోజున వారు లెక్క చెప్పవలసి ఉంటుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పనిలేని మాట,’ ‘ఫలించని మాట.’ గ్రీకు విశేషణానికి ‘పనిలేని,’ ‘ఫలించని,’ లేదా ‘నిర్లక్ష్యమైన’ అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: అయితే నేను మీతో చెప్తున్నాను
  rationale: δέ ఇక్కడ ముందున్న సందర్భానికి స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; వర్తమాన కాలంలోని ప్రత్యక్ష సంబోధనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πᾶν ῥῆμα
  choice: ప్రతి ... మాట
  rationale: πᾶν ఏకవచన నామవాచకంతో పంపిణీ భావంలో ‘ప్రతి’ అని అర్థం; ῥῆμα ఇక్కడ పలికిన మాటను సూచిస్తుంది.
- source_word: ἀργὸν
  choice: బాధ్యతలేని
  rationale: ἀργός యొక్క ‘పనికిరాని/ఫలించని/నిర్లక్ష్యమైన’ భావపరిధిలో, తీర్పుకు లోబడే బాధ్యతారహితమైన మాట అనే నైతిక బలాన్ని ఇది సహజమైన తెలుగులో తెలియజేస్తుంది; దురుద్దేశాన్ని అనవసరంగా చేర్చదు.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: మనుషులు పలికే
  rationale: οἱ ἄνθρωποι పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది. గ్రీకు భవిష్యత్ రూపం సాధారణ సూత్రాన్ని తెలుగులో సహజంగా తెలిపే ‘పలికే’ రూపంలో వ్యక్తమైంది.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: దాని గురించి వారు లెక్క చెప్పాల్సి ఉంటుంది
  rationale: ἀποδίδωμι + λόγος జవాబుదారీతనం లేదా లెక్క అప్పగించే న్యాయపరమైన నుడికారాన్ని ఏర్పరుస్తుంది; περὶ αὐτοῦ యొక్క ‘దాని గురించి’ అనే సంబంధాన్ని వాక్య నిర్మాణంలో ‘మాట గురించి’గా స్పష్టంగా నిలిపింది.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: తీర్పు రోజున
  rationale: ἐν తో వచ్చిన కాలసూచక పదబంధాన్ని సహజ తెలుగులో ‘రోజున’గా, κρίσις యొక్క న్యాయతీర్పు భావాన్ని ‘తీర్పు’గా అనువదించింది.
theological_decisions:
- issue: ἀργόν అనే పదంలోని నైతిక బలం
  choice: బాధ్యతలేని
  alternative: పనిలేని / వ్యర్థమైన / నిర్లక్ష్యంగా పలికిన
  rationale: సందర్భం దైవిక తీర్పులో మాటలకు జవాబుదారీతనాన్ని బోధిస్తుంది. ‘బాధ్యతలేని’ అనే ఎంపిక నైతిక గంభీరతను నిలుపుతూ, ప్రతి సాధారణ లేదా ప్రయోజనం లేని సంభాషణ స్వతహాగా పాపమని అతివ్యాఖ్యానించదు.
- issue: οἱ ἄνθρωποι యొక్క సాధారణ మానవ సూచన
  choice: మనుషులు
  alternative: పురుషులు / ప్రజలు
  rationale: మూల గ్రీకు ఇక్కడ లింగపరంగా పురుషులను మాత్రమే ఉద్దేశించదు; మానవులందరినీ సాధారణంగా సూచిస్తుంది.
- issue: తీర్పు రోజున వ్యక్తిగత జవాబుదారీతనం
  choice: లెక్క చెప్పాల్సి ఉంటుంది
  alternative: జవాబు చెప్పాలి
  rationale: మూలంలోని లెక్క అప్పగించే నుడికారాన్ని నిలుపుతుంది; తీర్పు ఎవరి చేత జరుగుతుందో వాక్యంలో లేనందున అనువాదం దానిని అదనంగా పేర్కొనదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా తీర్పు సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. ‘లెక్క చెప్పాల్సి ఉంటుంది’ అనే సహజ నుడికారం మూలంలోని న్యాయపరమైన జవాబుదారీతనాన్ని నిలుపుతుంది.
