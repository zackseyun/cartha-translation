  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ἦλθεν εἰς τὴν συναγωγὴν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: te
  text: ఆయన అక్కడి నుంచి బయలుదేరి, వారి సమాజమందిరంలోకి వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: అంతర్లీన అనుసంధానం
  rationale: తెలుగులో వాక్యారంభంలో ‘మరియు’ అనడం అసహజంగా ఉంటుంది. కృదంత నిర్మాణంతో కథన అనుసంధానం సహజంగానే వ్యక్తమవుతుంది.
- source_word: μεταβὰς
  choice: బయలుదేరి
  rationale: మునుపటి ప్రదేశాన్ని విడిచి మరో చోటికి వెళ్లడాన్ని సహజమైన తెలుగు కృదంత రూపంలో తెలియజేస్తుంది.
- source_word: ἐκεῖθεν
  choice: అక్కడి నుంచి
  rationale: ముందు పేర్కొన్న ప్రదేశం నుంచి కదలడాన్ని నేరుగా సూచిస్తుంది.
- source_word: ἦλθεν
  choice: వెళ్లాడు
  rationale: కొత్త ప్రదేశం వైపు కథన కదలికను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; గ్రీకు ἔρχομαι యొక్క సందర్భానుగుణ భావాన్ని నిలుపుతుంది.
- source_word: εἰς τὴν συναγωγὴν
  choice: సమాజమందిరంలోకి
  rationale: εἰς సూచించే లోపలికి కదలికను ‘లోకి’ స్పష్టంగా నిలుపుతుంది.
- source_word: συναγωγὴν
  choice: సమాజమందిరం
  rationale: యూదులు కూడి ఆరాధించే స్థలానికి తెలుగులో స్థిరపడిన, సాధారణ పాఠకులకు అర్థమయ్యే పదం.
- source_word: αὐτῶν
  choice: వారి
  rationale: గ్రీకు సంబంధార్థక సర్వనామాన్ని తటస్థంగా నిలుపుతుంది; అది ఎవరిని సూచిస్తుందో అనువాదంలో అదనంగా నిర్ధారించదు.
theological_decisions:
- issue: ‘వారి సమాజమందిరం’లో ‘వారి’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: వారి సమాజమందిరం
  alternative: ఆ యూదుల సమాజమందిరం / వారి సమావేశ స్థలం
  rationale: గ్రీకు మూలం αὐτῶν అని మాత్రమే చెబుతుంది. విరోధ భావాన్ని గానీ, ఒక నిర్దిష్ట వర్గాన్ని గానీ అనువాదంలో చేర్చకుండా మూలంలోని సూచనాత్మక అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా ఉండే కథన శైలి. ‘బయలుదేరి … వెళ్లాడు’ అనే నిర్మాణం గ్రీకు కృదంతం-ప్రధాన క్రియ సంబంధాన్ని సహజ తెలుగులో ప్రతిబింబిస్తుంది.
