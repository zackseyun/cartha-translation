  terminology: “బలవంతుడు,” “సామాన్లు,” “లాక్కోవడం,” and “కొల్లగొట్టడం” suitably preserve the concrete metaphor and the distinction between ἁρπάσαι and the more intensive διαρπάσει. The footnote alternatives are appropriate and correctly anchored.
