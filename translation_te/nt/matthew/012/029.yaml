id: MAT.12.29
reference: Matthew 12:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: te
  text: లేదా, ఎవరైనా బలవంతుడి ఇంట్లోకి ప్రవేశించి, మొదట ఆ బలవంతుణ్ణి కట్టివేయకుండా[b] అతని సామాన్లను[a] ఎలా లాక్కోగలడు? అప్పుడు అతని ఇంటిని కొల్లగొడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతని వస్తువులను’ లేదా ‘అతని ఆస్తిని’; గ్రీకు పదం అక్షరార్థంగా పాత్రలు లేదా పనిముట్లను, విస్తృతంగా ఇంట్లోని సామాన్లను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘బంధించకుండా’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: లేదా
  rationale: ముందటి వాదనకు అనుసంధానమైన మరో వివరణాత్మక పోలికను సహజంగా పరిచయం చేస్తుంది.
- source_word: δύναταί τις
  choice: ఎవరైనా … ఎలా … గలడు?
  rationale: అనిర్దిష్ట కర్తను, సామర్థ్యాన్ని తెలిపే అలంకారప్రశ్న రూపాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: బలవంతుడు / బలవంతుణ్ణి
  rationale: గ్రీకు విశేషణం ఇక్కడ నామవాచకంగా, పురుషవాచక ఏకవచన రూపంలో ఉంది; దొంగతనం గురించిన దృష్టాంతంలోని వ్యక్తిగత చిత్రాన్ని నిలుపుతుంది.
- source_word: τὰ σκεύη αὐτοῦ
  choice: అతని సామాన్లు
  rationale: σκεύη పాత్రలు లేదా పనిముట్లను అక్షరార్థంగా సూచించగలిగినా, ఇంటిని దోచే సందర్భంలో ఇంట్లోని వస్తువులు లేదా ఆస్తిని విస్తృతంగా సూచిస్తుంది.
- source_word: ἁρπάσαι
  choice: లాక్కోగలడు
  rationale: బలవంతంగా తీసుకోవడాన్ని తెలియజేస్తూ, తరువాతి διαρπάσει అనే మరింత సమగ్ర దోపిడీ క్రియతో ఉన్న భేదాన్ని కాపాడుతుంది.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: మొదట … కట్టివేయకుండా
  rationale: షరతును, చర్యల క్రమాన్ని స్పష్టంగా తెలిపే సహజమైన తెలుగు రూపం.
- source_word: καὶ τότε
  choice: కట్టివేసిన తర్వాతే
  rationale: అప్పుడు మాత్రమే తదుపరి చర్య సాధ్యమనే కాలక్రమ బలాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διαρπάσει
  choice: కొల్లగొడతాడు
  rationale: ఇంటిని పూర్తిగా దోచుకోవడం లేదా దాని వస్తువులను ఎత్తుకుపోవడం అనే బలమైన భావాన్ని అందిస్తుంది.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: అతని ఇంటిని
  rationale: రూపకంలోని ప్రత్యక్ష ఇంటి చిత్రాన్ని నిలుపుతూ, దానిని ముందుగానే ‘అధికార పరిధి’ వంటి వ్యాఖ్యానంగా మార్చదు.
theological_decisions:
- issue: దృష్టాంతంలోని పురుషవాచక రూపం
  choice: బలవంతుడు
  alternative: బలమైన వ్యక్తి
  rationale: గ్రీకులోని పురుషవాచక నామీకృత విశేషణాన్ని, దృష్టాంతంలోని నిర్దిష్ట వ్యక్తి చిత్రాన్ని నిలుపుతూ అనువదించాం; అయితే అనిర్దిష్ట కర్త τις ను సహజంగా ‘ఎవరైనా’ అని ఇచ్చాం.
- issue: ‘ఇల్లు’, ‘సామాన్లు’ అనే రూపకపు పరిధి
  choice: దొంగతనం గురించిన స్పష్టమైన రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: ఇల్లును ‘అధికార పరిధి’గా, సామాన్లను ఆధ్యాత్మిక ఆధీనంలోని వారిగా వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: సందర్భం దయ్యాల శక్తిపై యేసు అధికారాన్ని సూచించినా, వాక్యమే ఇచ్చే రూపకాన్ని అనువాదంలో విప్పి చెప్పకుండా దాని వేదాంత ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన శైలి. మొదటి క్రియకు ‘లాక్కోవడం’, రెండవ బలమైన క్రియకు ‘కొల్లగొట్టడం’ వాడి గ్రీకు క్రియల మధ్య భావభేదాన్ని నిలిపాం; తెలుగు వాక్యప్రవాహం కోసం షరతు భాగాన్ని మధ్యలో సహజంగా అమర్చాం.
