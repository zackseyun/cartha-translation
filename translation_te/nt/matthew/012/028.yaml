id: MAT.12.28
reference: Matthew 12:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: te
  text: కాని నేను దేవుని ఆత్మ ద్వారా[a] దయ్యాలను వెళ్లగొడితే, దేవుని రాజ్యం మీ మీదికి వచ్చి చేరింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని ఆత్మలో.’ గ్రీకు పదబంధం సాధనం లేదా కార్యనిర్వాహకత్వాన్ని, అలాగే ‘లో’ అనే భావాన్ని వ్యక్తం చేయగలదు; ఇక్కడ ‘ద్వారా’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మిమ్మల్ని చేరుకుంది,’ ‘మీ మీదికి వచ్చి చేరింది.’ గ్రీకు క్రియ దేవుని రాజ్యం వారిని చేరిందనే భావాన్ని నొక్కిచెబుతుంది; యేసు కార్యాలు దానికి సాక్ష్యంగా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: కాని ... అంటే
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసాన్ని ‘కాని’ నిలుపుతుంది; షరతును సహజమైన ఆధునిక తెలుగులో ‘అంటే’ వ్యక్తం చేస్తుంది.
- source_word: ἐν πνεύματι θεοῦ
  choice: దేవుని ఆత్మ ద్వారా
  rationale: ἐν తో దత్తి విభక్తి ఇక్కడ సాధనం లేదా కార్యనిర్వాహకత్వాన్ని సూచించగలదు. ‘ద్వారా’ యేసు దయ్యాలను వెళ్లగొట్టడం దేవుని ఆత్మ కార్యం ద్వారా జరుగుతోందనే భావాన్ని సహజంగా తెలియజేస్తుంది; ‘దేవుని ఆత్మలో’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐγὼ
  choice: నేను
  rationale: గ్రీకులో స్పష్టంగా ఉన్న కర్త సర్వనామం వాదనలో ఉద్ఘాటన కలిగిస్తుంది; తెలుగులోనూ ‘నేను’ అని స్పష్టంగా ఉంచాం.
- source_word: ἐκβάλλω
  choice: వెళ్లగొడుతున్నాను
  rationale: దయ్యాలను బలవంతంగా బయటకు పంపడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὰ δαιμόνια
  choice: దయ్యాలను
  rationale: δαιμόνια అనే దుష్ట ఆత్మసంబంధ జీవులను సూచించడానికి సాధారణ పాఠకులకు స్పష్టమైన, ప్రామాణిక తెలుగు పదం.
- source_word: ἄρα
  choice: అంటే
  rationale: షరతు నుంచి వచ్చే నిర్ధారణను తెలుగు వాక్య నిర్మాణంలో సహజంగా తెలియజేస్తుంది.
- source_word: ἔφθασεν
  choice: వచ్చేసింది
  rationale: φθάνω ఇక్కడ చేరడం లేదా వచ్చి ఉండడం అనే భావాన్ని ఇస్తుంది. ‘వచ్చేసింది’ రాజ్యం కేవలం సమీపించిందని కాక, వారిని చేరిందనే పూర్తయిన రాకను మరియు దాని ప్రస్తుత ఫలితాన్ని తెలియజేస్తుంది.
- source_word: ἐφ’ ὑμᾶς
  choice: మీ మీదికి
  rationale: ἐπί తో కర్మ విభక్తి సూచించే ‘వారి మీదికి చేరడం’ అనే సజీవమైన దిశాభావాన్ని నిలుపుతుంది; ‘మీ దగ్గరికి’ కంటే మూలానికి దగ్గరగా ఉంటుంది.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: దేవుని రాజాధికారం మరియు రాజ్య పరిధి రెండింటినీ విస్తృతంగా నిలుపుకునే స్థిరమైన తెలుగు అనువాదం.
theological_decisions:
- issue: యేసు దయ్యాలను వెళ్లగొట్టడానికి సంబంధించి ‘దేవుని రాజ్యం’ అర్థం
  choice: యేసు దేవుని ఆత్మ ద్వారా దయ్యాలను వెళ్లగొట్టడం, దేవుని రాజ్యం ఆయన శ్రోతల మీదికి నిజంగా వచ్చిందనడానికి ప్రస్తుత సాక్ష్యంగా వాక్యం చూపుతుంది.
  alternative: రాజ్యం ఇంకా రాకుండా కేవలం సమీపించింది; లేదా ఇది భవిష్యత్తులో మాత్రమే నెరవేరే రాజ్యాన్ని సూచిస్తుంది.
  rationale: ἔφθασεν అనేది చేరడం లేదా వచ్చేయడం సూచిస్తుంది; యేసు కార్యాల్లో దేవుని రాజపాలన ఇప్పటికే ప్రవేశించిందనే నిర్ధారణపై ఈ వాదన ఆధారపడింది. అయినా భవిష్యత్ సంపూర్ణత గురించి ఈ వచనం తేల్చని అంశాన్ని అనువాదం పరిష్కరించదు.
- issue: ‘దేవుని ఆత్మ’ యొక్క సూచన
  choice: దయ్యాలను వెళ్లగొట్టే కార్యంలో దైవిక కార్యనిర్వాహకుడైన దేవుని ఆత్మను సూచిస్తుంది.
  alternative: వ్యక్తిత్వం లేని సాధారణ దైవిక శక్తిని మాత్రమే సూచిస్తుంది.
  rationale: πνεύματι θεοῦ సందర్భంలో యేసు కార్యానికి మూలమైన దేవుని ఆత్మను సూచిస్తుంది. తెలుగు రూపం మూలపాఠాన్ని మించి వివరణను చేర్చకుండా ఈ వ్యక్తిగత సూచనను సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘వచ్చేసింది’ అనే సహజ రూపం రాక పూర్తయి దాని ప్రభావం ప్రస్తుతం ఉందనే భావాన్ని ఇస్తుంది; ‘మీ మీదికి’ మూలంలోని సజీవమైన, కొంత ఎదుర్కొనే ఛాయను నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
