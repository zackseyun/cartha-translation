id: MAT.12.15
reference: Matthew 12:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: te
  text: అయితే యేసు ఈ సంగతి తెలుసుకొని[a] అక్కడి నుంచి తప్పుకొని వెళ్లిపోయాడు. చాలామంది ఆయనను అనుసరించారు; ఆయన వారందరినీ స్వస్థపరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు అది తెలుసుకొని అక్కడి నుంచి తప్పుకొని వెళ్లిపోయాడు.” “తెలుసుకొని” అనే పదానికి కర్మ గ్రీకు పాఠంలో స్పష్టంగా పేర్కొనబడలేదు; ముందటి వచనంలోని సందర్భమే దాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: ఈ సంగతి తెలుసుకొని
  rationale: ఇది γινώσκω యొక్క భూతార్థక కృదంత రూపం; ప్రధాన క్రియకు ముందు కలిగిన అవగాహనను సూచిస్తుంది. దాని కర్మ గ్రీకు వాక్యంలో వ్యక్తంగా లేకపోయినా, ముందటి వచనంలోని పరిసయ్యుల కుట్రను సందర్భం సూచిస్తుంది. ‘ఈ సంగతి’ ఆ సంబంధాన్ని సహజమైన తెలుగులో చూపిస్తూ, వివరాన్ని అతిగా విస్తరించదు.
- source_word: ἀνεχώρησεν
  choice: తప్పుకొని వెళ్లిపోయాడు
  rationale: మత్తయి వర్ణనలో ఈ క్రియ తరచుగా వ్యతిరేకత లేదా ప్రమాదం ఉన్న చోటు నుంచి ఉద్దేశపూర్వకంగా తొలగిపోవడాన్ని సూచిస్తుంది. ‘తప్పుకొని వెళ్లిపోయాడు’ ఆ భావాన్ని ఉంచుతుంది; అయితే భయంతో పారిపోయాడనే భావాన్ని చేర్చదు.
- source_word: ἐκεῖθεν
  choice: అక్కడి నుంచి
  rationale: ఒక స్థలం నుంచి దూరంగా కదలడాన్ని తెలిపే సహజమైన, సంక్షిప్త తెలుగు ప్రయోగం.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: చాలామంది ఆయనను అనుసరించారు
  rationale: πολλοί అంటే కేవలం ‘చాలామంది’; మూలపాఠంలో ‘జనసమూహాలు’ అనే నామవాచకం లేదు. ‘అనుసరించారు’ వ్యక్తిగతంగా లేదా శిష్యత్వార్థంగా అతిగా నిర్దిష్టం చేయకుండా ἀκολουθέω యొక్క ప్రాథమిక భావాన్ని అందిస్తుంది.
- source_word: ἐθεράπευσεν
  choice: స్వస్థపరిచాడు
  rationale: సువార్తలలో θεραπεύω రోగులను బాగుచేయడాన్ని సూచిస్తుంది. ‘స్వస్థపరిచాడు’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన సమానార్థకం.
- source_word: αὐτοὺς πάντας
  choice: వారందరినీ
  rationale: πάντας యొక్క సమగ్ర భావాన్ని సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
theological_decisions:
- issue: γνοὺς క్రియకు వ్యక్తంగా లేని కర్మ
  choice: ‘ఈ సంగతి తెలుసుకొని’ అని అనువదించి, ముందటి వచనంలోని విరోధపూరిత కుట్రతో సందర్భ సంబంధాన్ని చూపడం.
  alternative: ‘అది తెలుసుకొని’ లేదా కర్మను చెప్పకుండా ‘తెలుసుకొని’ అని ఉంచడం.
  rationale: గ్రీకు పాఠంలో తెలుసుకున్న విషయం వ్యక్తంగా లేదు. ‘ఈ సంగతి’ అనేది సందర్భం అందించే సూచన మాత్రమే; యేసు ప్రత్యేకంగా ఏమి లేదా ఏ విధంగా తెలుసుకున్నాడనే అదనపు సిద్ధాంతాన్ని ఇది చేర్చదు. పాదసూచిక మూలంలోని అస్పష్టతను వెల్లడిస్తుంది.
- issue: యేసు అక్కడి నుంచి వెళ్లిన తీరులోని భావఛాయ
  choice: ‘తప్పుకొని వెళ్లిపోయాడు’
  alternative: ‘వెళ్లిపోయాడు’ లేదా ‘బయలుదేరాడు’
  rationale: వ్యతిరేకతకు ప్రతిస్పందనగా ఉద్దేశపూర్వకంగా ఆ ప్రదేశం నుంచి తొలగిన భావాన్ని నిలుపుతూ, భయం లేదా పిరికితనాన్ని ఆపాదించకుండా ఉండేందుకు ఈ రూపం ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘అనుసరించారు,’ ‘స్వస్థపరిచాడు’ వంటి పదాలు సంఘపరమైన ప్రత్యేక పదజాలాన్ని ఆశ్రయించకుండా సువార్త వర్ణనకు తగిన స్థాయిని నిలుపుతాయి.
