id: MAT.12.27
reference: Matthew 12:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: te
  text: నేను బయెల్జెబూలు[a] శక్తితో దయ్యాలను వెళ్లగొడుతున్నానయితే, మీ కుమారులు ఎవరి శక్తితో వాటిని వెళ్లగొడుతున్నారు? కాబట్టి వారే మీ న్యాయాధిపతులుగా ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో ‘బయెల్జెబూలు’; కొన్ని అనువాదాల్లో ‘బయెల్జెబూబు’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: బయెల్జెబూలు శక్తితో
  rationale: ἐν ఇక్కడ సాధనం లేదా కార్యసాధక శక్తిని సూచిస్తుంది. తెలుగులో కేవలం ‘బయెల్జెబూలుతో’ అనడం అస్పష్టంగా ఉండవచ్చు కాబట్టి ‘శక్తితో’ అని సహజంగా వ్యక్తపరిచాం; పేరును మూలపాఠంలోని Βεελζεβούλ రూపానుసారంగా లిప్యంతరీకరించాం.
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: దయ్యాలను వెళ్లగొడుతున్నాను
  rationale: భూతవిమోచన సందర్భంలో ἐκβάλλω బలవంతంగా బయటకు పంపడాన్ని సూచిస్తుంది. ‘వెళ్లగొట్టు’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; δαιμόνιαకు సాధారణంగా అర్థమయ్యే ‘దయ్యాలు’ వాడాం.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: మీ కుమారులు
  rationale: గ్రీకు పదబంధంలోని బంధుత్వ పదాన్ని యథాతథంగా నిలిపి, యేసు వాదనలోని అలంకారిక సమాంతరతను కాపాడాం. సందర్భంలో ఇది వారి వర్గానికి చెందిన వారిని లేదా శిష్యులను సూచించవచ్చనే భావాన్ని అనువాదంలో నిర్బంధంగా నిర్ణయించలేదు.
- source_word: ἐν τίνι
  choice: ఎవరి శక్తితో
  rationale: ఇక్కడ కూడా ἐν సాధనాన్ని లేదా కార్యసాధక శక్తిని సూచిస్తుంది. వ్యక్తిగత శక్తి/అధికారంతో పోలిక ఉన్నందున ‘ఎవరి శక్తితో’ సహజమైన తెలుగు.
- source_word: διὰ τοῦτο
  choice: కాబట్టి
  rationale: ముందున్న అలంకారిక ప్రశ్ననుంచి వచ్చే నిర్ధారణను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: κριταὶ ἔσονται ὑμῶν
  choice: వారే మీకు న్యాయాధిపతులుగా ఉంటారు
  rationale: భవిష్యత్ కాలాన్ని, κριταί అనే నామవాచక నిర్మాణాన్ని నిలిపి ఉంచుతుంది. ‘వారే’ అనేది αὐτοί యొక్క ఉద్ఘాటనను వ్యక్తపరుస్తుంది; ‘మీకు న్యాయాధిపతులు’ తెలుగు వాడుకలో సహజంగా ఉంది.
theological_decisions:
- issue: Βεελζεβούλ అనే పేరు మరియు దాని రూపం
  choice: బయెల్జెబూలు
  alternative: బయెల్జెబూబు
  rationale: అందించిన SBLGNT మూలపాఠంలోని Βεελζεβούλ రూపాన్నే లిప్యంతరీకరించాం; పరిచితమైన ప్రత్యామ్నాయ సంప్రదాయ రూపానికి అనుగుణంగా మూలపాఠాన్ని మార్చలేదు.
- issue: οἱ υἱοὶ ὑμῶν ఎవరిని సూచిస్తుంది
  choice: మీ కుమారులు
  alternative: మీ శిష్యులు / మీవారు
  rationale: సందర్భంలో వినేవారి వర్గానికి చెందిన భూతవైద్యులను సూచించే అవకాశం ఉన్నప్పటికీ, మూలంలోని బంధుత్వ భాషను నిలిపి దాని సూచనను అనువాదంలో అతిగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. అలంకారిక ప్రశ్నను, ‘వారే’ అనే ఉద్ఘాటనను, భవిష్యత్ న్యాయాధిపతి భావాన్ని కాపాడాం.
