- from: అయితే ఆయన వారితో, “దావీదు ఆకలితో ఉన్నప్పుడు—అతనితో ఉన్నవారు కూడా ఆకలితో ఉన్నప్పుడు—అతడు ఏమి చేశాడో మీరు చదవలేదా?[a]” అన్నాడు.
  to: 'అయితే ఆయన వారితో ఇలా అన్నాడు: “దావీదూ అతనితో ఉన్నవారూ ఆకలితో ఉన్నప్పుడు అతడు ఏమి చేశాడో మీరు చదవలేదా?[a]”'
  rationale: 'The revision removes an awkward repeated clause and gives the naturally understood collective sense: David and those with him were hungry. The footnote preserves the relevant grammatical ambiguity by noting that the Greek singular verb directly refers to David, without implying that the source excludes those with him from the hunger situation.'
