id: MAT.12.3
reference: Matthew 12:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐκ ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε ⸀ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: te
  text: 'అయితే ఆయన వారితో ఇలా అన్నాడు: “దావీదూ అతనితో ఉన్నవారూ ఆకలితో ఉన్నప్పుడు అతడు ఏమి చేశాడో మీరు చదవలేదా?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘ఆకలితో ఉన్నప్పుడు’ అనే క్రియ ఏకవచనంలో ఉంది; అది ప్రత్యక్షంగా దావీదును సూచిస్తుంది. అయితే ‘అతనితో ఉన్నవారు’ అనే పదబంధం కూడా అదే ఆకలి పరిస్థితిలో చేర్చబడి ఉన్నట్లు అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: అయితే ఆయన
  rationale: δέ ఇక్కడ పరిసయ్యుల ఆరోపణకు యేసు ఇచ్చిన ప్రతిస్పందనను సున్నితమైన వ్యత్యాసంతో అనుసంధానిస్తుంది; ‘అయితే’ ఆధునిక తెలుగులో సహజంగా ఆ ప్రవాహాన్ని చూపుతుంది.
- source_word: εἶπεν αὐτοῖς
  choice: వారితో ... అన్నాడు
  rationale: లέγω మరియు దత్తివాచకమైన αὐτοῖςను తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణంతో అందించింది.
- source_word: Οὐκ ἀνέγνωτε
  choice: మీరు చదవలేదా?
  rationale: ఇది లేఖన పరిజ్ఞానాన్ని ప్రశ్నించే అలంకార ప్రశ్న. తెలుగు సాధారణ భూతకాల రూపమే ఆ భావాన్ని సహజంగా మోస్తుంది.
- source_word: τί ἐποίησεν Δαυὶδ
  choice: దావీదు ... అతడు ఏమి చేశాడో
  rationale: ποιέω యొక్క సాధారణ చారిత్రక అర్థమైన ‘చేయు’ను నిలిపి, క్రియకు దావీదే కర్త అని స్పష్టంగా ఉంచింది.
- source_word: ὅτε ἐπείνασεν
  choice: ఆకలితో ఉన్నప్పుడు
  rationale: πεινάωకు ఆధునిక తెలుగులో సహజమైన సమానార్థకం; ఏకవచన గ్రీకు క్రియ ప్రత్యక్షంగా దావీదును సూచిస్తుందనే విషయాన్ని ప్రధాన పాఠంలో నిలిపింది.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: అతనితో ఉన్నవారు కూడా
  rationale: పదబంధంలోని ‘అతనితో ఉన్నవారు’ అనే సూటి భావాన్ని కాపాడుతూ καίని సందర్భానుసారంగా ‘కూడా’గా ఇచ్చింది; ‘సహచరులు’ కంటే ఇది తక్కువ వ్యాఖ్యానాత్మకం.
theological_decisions:
- issue: ఆకలి దావీదుకే వర్తిస్తుందా, అతనితో ఉన్నవారికీ వర్తిస్తుందా?
  choice: ప్రధాన పాఠంలో దావీదును ఏకవచనంగా స్పష్టంగా పేర్కొని, అతనితో ఉన్నవారు కూడా ఆకలితో ఉన్నారని విరామచిహ్నాల మధ్య తెలిపింది.
  alternative: “దావీదూ అతనితో ఉన్నవారూ ఆకలితో ఉన్నప్పుడు” అని సంయుక్త కర్తతో అనువదించడం.
  rationale: ἐπείνασεν ఏకవచన క్రియ కాబట్టి వ్యాకరణపరంగా దావీదును ప్రత్యక్షంగా సూచిస్తుంది; అయితే καὶ οἱ μετ’ αὐτοῦ అనే సంక్షిప్త పదబంధం ఆకలి పరిస్థితిలో అతనితో ఉన్నవారిని కూడా చేర్చినట్లు అర్థం చేసుకోవచ్చు. అందువల్ల అసలు పాఠంలోని ఉద్రిక్తతను ప్రధాన పాఠం మరియు పాదసూచిక కలిసి కాపాడుతున్నాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగానూ సాధారణ పాఠకులకు సులభంగానూ ఉంచబడింది. ‘ఆకలిగొన్నప్పుడు’ కంటే సంభాషణలో సహజమైన ‘ఆకలితో ఉన్నప్పుడు’ ఎంచుకోబడింది. మధ్య గీతలు మూలంలోని సంక్షిప్త సమన్వయాన్ని తెలుగులో స్పష్టంగా చూపుతాయి.
