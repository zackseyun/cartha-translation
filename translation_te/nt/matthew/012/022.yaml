id: MAT.12.22
reference: Matthew 12:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: te
  text: అప్పుడు దయ్యం పట్టిన, చూపులేని, మాట్లాడలేని[a] ఒక మనిషిని ఆయన దగ్గరికి తీసుకొచ్చారు. ఆయన అతణ్ణి స్వస్థపరిచాడు; దాంతో మాట్లాడలేని ఆ మనిషి మాట్లాడాడు, చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వినలేని.” గ్రీకు పదం వినలేని వ్యక్తినీ, మాట్లాడలేని వ్యక్తినీ సూచించవచ్చు. ఇక్కడ అతడు మాట్లాడాడని తరువాత చెప్పబడడం వల్ల “మాట్లాడలేని” అనే అర్థం సందర్భానికి సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: తరువాత జరిగిన సంఘటనను పరిచయం చేసే సహజమైన తెలుగు కాలసూచకం.
- source_word: προσηνέχθη αὐτῷ
  choice: ఆయన దగ్గరికి తీసుకొచ్చారు
  rationale: గ్రీకులో కర్తను పేర్కొనని కర్మణి ప్రయోగం ఉంది. తెలుగులో సహజంగా ఉండే అనిర్దిష్ట బహువచన క్రియతో కర్తను గుర్తించకుండా అదే భావాన్ని తెలిపింది.
- source_word: δαιμονιζόμενος
  choice: దయ్యం పట్టిన
  rationale: దయ్య సంబంధమైన బాధను స్పష్టంగా ఉంచే, సామాన్య ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: τυφλὸς
  choice: చూపులేని
  rationale: అంధత్వాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక భాషలో తెలియజేస్తుంది.
- source_word: κωφός
  choice: మాట్లాడలేని
  rationale: ఈ పదం వినలేని లేదా మాట్లాడలేని స్థితిని సూచించగలదు; అయితే ఫలిత వాక్యంలో అతడు మాట్లాడాడని చెప్పడం వల్ల ఇక్కడ మాట్లాడలేని స్థితి సందర్భానికి సరిపోతుంది. పదంలోని నిజమైన ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: ἐθεράπευσεν αὐτόν
  choice: ఆయన అతణ్ణి స్వస్థపరిచాడు
  rationale: సువార్తలలో స్వస్థత కలిగించడాన్ని తెలిపే θεραπεύω అనే క్రియకు పారదర్శకమైన, స్థిరమైన తెలుగు సమానార్థకం.
- source_word: ὥστε
  choice: దాంతో
  rationale: స్వస్థపరచడం వల్ల కలిగిన ఫలితాన్ని సహజమైన తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: మాట్లాడలేని ఆ మనిషి మాట్లాడగలిగాడు, చూడగలిగాడు
  rationale: గ్రీకులోని విశేషణ నామీకరణను స్పష్టమైన తెలుగు నామవాచక పదబంధంగా ఇచ్చి, స్వస్థత ఫలితంగా వచ్చిన రెండు సామర్థ్యాలను సహజంగా తెలిపింది.
theological_decisions:
- issue: దయ్య సంబంధమైన బాధ స్వభావం
  choice: “దయ్యం పట్టిన” అనే స్పష్టమైన భాషను నిలుపుకోవడం
  alternative: మానసిక వ్యాధిగల / బాధపడుతున్న
  rationale: మూలపాఠం ఈ స్థితిని దయ్య సంబంధమైనదిగా స్పష్టంగా పేర్కొంటుంది. దానిని ఆధునిక వైద్య వర్గంగా మార్చడం లేదా అస్పష్టంగా చేయడం మూలంలోని వాదనను మార్చుతుంది.
- issue: ఈ సందర్భంలో κωφός అర్థం
  choice: మాట్లాడలేని
  alternative: వినలేని
  rationale: పదం రెండు అర్థాలను కలిగి ఉండగలిగినా, స్వస్థత ఫలితంగా అతడు మాట్లాడాడని పాఠం చెబుతుంది; వినికిడి తిరిగి వచ్చిందని చెప్పదు. అందువల్ల సందర్భానుసారమైన అర్థాన్ని ప్రధాన పాఠంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించింది. “మూగవాడు,” “గుడ్డివాడు” వంటి వ్యక్తిని స్థితితోనే నిర్వచించే పదాలకు బదులుగా “మాట్లాడలేని,” “చూపులేని” అనే పారదర్శక వర్ణనలను ఎంచుకుంది. వాక్య నిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచుతూ, మూలంలోని సంఘటన క్రమం, దయ్య సంబంధమైన భాష, స్వస్థత ఫలితం నిలుపుకుంది.
