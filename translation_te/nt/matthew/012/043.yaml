review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the general temporal condition, the spirit's departure from a man, its movement through waterless places, its search for rest, and its failure to find it. However, “సంచరిస్తుంది” can suggest wandering about rather than the more neutral “passes through,” and “దొరకదు” shifts slightly from the spirit’s active failure to find rest to an impersonal outcome.
  naturalness: The draft is generally clear, but “అపవిత్రమైన ఆత్మ” is more idiomatic and immediately transparent in modern standard Telugu than the compounded form “అపవిత్రాత్మ.” “నీరు లేని” is also a clean standard form for the literal image.
  terminology: “అపవిత్రమైన ఆత్మ” preserves τὸ ἀκάθαρτον πνεῦμα without replacing it with “దయ్యం.” “విశ్రాంతి” appropriately renders ἀνάπαυσις. The alternative “ఎండిన ప్రదేశాలు” gives the permitted sense of “dry places” without implying specifically that the places had dried up.
  issues:
  - severity: low
    issue: “సంచరిస్తుంది” is somewhat stronger/different than διέρχεται.
    rationale: The Greek denotes passing through places; “సంచరించు” may imply roaming or wandering. “గుండా వెళుతూ” is more direct.
  - severity: low
    issue: “దానికి విశ్రాంతి దొరకదు” slightly recasts the active verb εὑρίσκει.
    rationale: The source says that the spirit does not find rest. “దానిని కనుగొనదు” retains the subject’s search and failure to find.
  - severity: low
    issue: The compound “అపవిత్రాత్మ” is less transparent than an adjectival phrase.
    rationale: “అపవిత్రమైన ఆత్మ” is natural modern Telugu and preserves the source phrase's two-part wording.
  revised_text: “అపవిత్రమైన ఆత్మ ఒక మనిషి నుండి బయటికి వెళ్లినప్పుడు, అది విశ్రాంతి కోసం వెదుకుతూ నీరు లేని ప్రదేశాల గుండా వెళుతుంది[a], కాని దానిని కనుగొనదు.”
