id: MAT.12.43
reference: Matthew 12:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: te
  text: “అపవిత్రమైన ఆత్మ ఒక మనిషి నుండి బయటికి వెళ్లినప్పుడు, అది విశ్రాంతి కోసం వెదుకుతూ నీరు లేని ప్రదేశాల గుండా వెళుతుంది[a], కాని దానిని కనుగొనదు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎండిన ప్రదేశాలు.’ గ్రీకులో అక్షరార్థంగా, ‘నీరు లేని ప్రదేశాలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: వెళ్లినప్పుడు
  rationale: Ὅταν సాధారణంగా సంభవించే కాలసంబంధ పరిస్థితిని సూచిస్తుంది. δέ ఇక్కడ స్వల్ప సంధాన/మార్పు భావాన్ని ఇస్తుంది; తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు దానిని ప్రత్యేక పదంతో బలవంతంగా వ్యక్తం చేయలేదు.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: అపవిత్రాత్మ
  rationale: సువార్తలలోని దయ్యాల సందర్భంలో వాడే మూలపదబంధాన్ని సంక్షిప్తంగా, సంప్రదాయార్థాన్ని కాపాడుతూ వ్యక్తం చేస్తుంది.
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: ఒక మనిషి నుండి బయటికి వెళ్లినప్పుడు
  rationale: సాధారణ ఉదాహరణగా చెప్పబడుతున్న ఏకవచన మానవ వ్యక్తిని తెలుగులో సహజంగా సూచిస్తుంది; కదలిక మనిషి నుండి వెలుపలికి అనే భావాన్ని నిలుపుతుంది.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: నీళ్లులేని ప్రదేశాల గుండా సంచరిస్తుంది
  rationale: διέρχεται యొక్క ప్రాంతాల గుండా కదిలే భావాన్ని ‘సంచరిస్తుంది’ తెలియజేస్తుంది. ἀνύδρων యొక్క అక్షరార్థమైన ‘నీళ్లులేని’ అనే స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది.
- source_word: ζητοῦν ἀνάπαυσιν
  choice: విశ్రాంతి కోసం వెదుకుతూ
  rationale: ప్రధాన క్రియతో సమకాలంగా జరుగుతున్న ఉద్దేశపూర్వక అన్వేషణను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καὶ οὐχ εὑρίσκει
  choice: కానీ దానికి విశ్రాంతి దొరకదు
  rationale: మూలంలో కర్త చేసిన అన్వేషణకు విరుద్ధమైన ఫలితాన్ని తెలుగులో స్పష్టంగా చెబుతుంది. ‘విశ్రాంతి’ని పునరుక్తి చేయడం తెలుగు వాక్యంలో సూచ్య వస్తువును సహజంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: దయ్యసంబంధ సందర్భంలో πνεῦμα అనువాదం
  choice: ఆత్మ
  alternative: దయ్యం
  rationale: సందర్భంలో ఇది దుష్టమైన వ్యక్తిగత ఆత్మను సూచించినప్పటికీ, గ్రీకు మూలం δαιμόνιον అని కాక πνεῦμα అని చెబుతుంది. అందువల్ల మూలపదాన్ని నిలుపుతూ ‘అపవిత్రాత్మ’గా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గంభీరతను కాపాడే శైలి. ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తు ‘man’ తరువాత ఉన్నప్పటికీ, దాని విషయం ἀνύδρων τόπων గురించినందున తెలుగులో సంబంధిత ‘నీళ్లులేని ప్రదేశాలు’ తరువాత ఉంచబడింది.
