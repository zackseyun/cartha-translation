- from: “అపవిత్రాత్మ ఒక మనిషి నుండి బయటికి వెళ్లినప్పుడు, అది విశ్రాంతి కోసం వెదుకుతూ నీళ్లులేని ప్రదేశాల గుండా సంచరిస్తుంది[a]; కానీ దానికి విశ్రాంతి దొరకదు.”
