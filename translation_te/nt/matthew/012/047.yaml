revisions:
- from: అప్పుడు ఒకరు ఆయనతో[a], “ఇదిగో, నీ తల్లి, నీ సహోదరులు నీతో మాట్లాడాలని బయట నిలబడి ఉన్నారు” అన్నారు.
  to: 'అప్పుడు ఒకడు ఆయనతో ఇలా అన్నాడు: “ఇదిగో, నీ తల్లీ నీ సహోదరులూ బయట నిలబడి, నీతో మాట్లాడాలని కోరుతున్నారు.”[a]'
  rationale: The revision preserves the supplied SBLGNT wording while improving Telugu narrative grammar, representing the force of ζητοῦντες as ‘కోరుతున్నారు,’ and relocating the textual-variant anchor to the complete verse. No theological or interpretive claim has been added.
