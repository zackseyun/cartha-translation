    text: కొన్ని ప్రతుల్లో ఈ వచనం లేదు.
    reason: textual_variant
  revision_rationale: The revision preserves the supplied SBLGNT wording while improving Telugu narrative grammar, representing the force of ζητοῦντες as ‘కోరుతున్నారు,’ and relocating the textual-variant anchor to the complete verse. No theological or interpretive claim has been added.
