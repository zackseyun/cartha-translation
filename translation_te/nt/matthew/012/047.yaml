id: MAT.12.47
reference: Matthew 12:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: te
  text: 'అప్పుడు ఒకడు ఆయనతో ఇలా అన్నాడు: “ఇదిగో, నీ తల్లీ నీ సహోదరులూ బయట నిలబడి, నీతో మాట్లాడాలని కోరుతున్నారు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ఈ వచనం లేదు.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: అప్పుడు ఒకరు ఆయనతో ... అన్నారు
  rationale: δέ కథనాన్ని స్వల్పంగా ముందుకు నడిపే అనుసంధాన పదం; ‘అప్పుడు’ సహజమైన కథన క్రమాన్ని ఇస్తుంది. τις అనిర్దిష్టమైనది కాబట్టి ‘ఒకరు’ అని అనువదించాం.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే, ఎదురుగా ఉన్న పరిస్థితిని సూచించే ἰδού భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఇదిగో’ నిలుపుతుంది.
- source_word: ἡ μήτηρ σου
  choice: నీ తల్లి
  rationale: మూలంలోని సాధారణ ఏకవచన స్వామ్య నిర్మాణాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: οἱ ἀδελφοί σου
  choice: నీ సహోదరులు
  rationale: ఈ కథన సందర్భంలో ἀδελφοί పురుష కుటుంబ సభ్యులను సూచిస్తుంది; ‘సహోదరులు’ మూలంలోని లింగ సూచనను నిలుపుతూ గౌరవప్రదమైన ఆధునిక పదంగా ఉంటుంది.
- source_word: ἔξω ἑστήκασιν
  choice: బయట నిలబడి ఉన్నారు
  rationale: ἵστημι పరిపూర్ణ కాలం, వారు నిలిచిన ఫలితంగా ఇప్పుడు నిలబడి ఉన్న స్థితిని తెలియజేస్తుంది; ἔξωను ‘బయట’గా స్పష్టంగా ఉంచాం.
- source_word: ζητοῦντες
  choice: మాట్లాడాలని
  rationale: ζητέω అక్షరార్థంగా ‘వెదకడం/ప్రయత్నించడం’ అయినా, ఈ సందర్భంలో ఉద్దేశాన్ని తెలిపే ‘మాట్లాడాలని’ సహజమైన తెలుగులో భావాన్ని అందిస్తుంది; ప్రయత్నం విజయవంతమైందని ముందే నిర్ణయించదు.
- source_word: σοι λαλῆσαι
  choice: నీతో మాట్లాడాలని
  rationale: σοιతో కూడిన λαλῆσαιను తెలుగులో సహజంగా ‘నీతో మాట్లాడడం’ అని వ్యక్తపరచవచ్చు; ప్రత్యక్ష సంభాషణ ఉద్దేశం నిలుస్తుంది.
theological_decisions:
- issue: మత్తయి 12:47 పాఠాంతర స్థితి
  choice: ఇచ్చిన SBLGNT మూలంలో ఉన్నట్లుగా వచనాన్ని ప్రధాన పాఠంలో చేర్చి, కొన్ని ప్రతుల్లో అది లేదని పాదసూచికలో తెలియజేయడం.
  alternative: కొన్ని ప్రాచీన ప్రతుల్లో లేనందున ఈ వచనాన్ని ప్రధాన పాఠం నుంచి తొలగించడం.
  rationale: ఇచ్చిన విమర్శాత్మక గ్రీకు పాఠంలో వచనం గుర్తులతో సహా ఉంది. కాబట్టి దాన్ని అనువదిస్తూ, ముఖ్యమైన పాఠాంతర సాక్ష్యాన్ని దాచకుండా పాదసూచికలో పారదర్శకంగా నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ఉద్ధరణలో యేసును ఉద్దేశించినందున ‘నీ’ వాడటం మూలంలోని ఏకవచన రెండవ పురుష రూపాన్ని సహజంగా ప్రతిబింబిస్తుంది; కథనకర్త మాటల్లో ‘ఆయనతో’, ‘అన్నారు’ అనే గౌరవ రూపాలు ఉంచాం.
