revisions:
- from: దక్షిణ దేశపు రాణి[b] తీర్పు సమయంలో ఈ తరంవారితో పాటు లేచి, ఈ తరాన్ని దోషిగా తీర్పుతీరుస్తుంది. ఎందుకంటే సొలొమోను జ్ఞానాన్ని వినడానికి ఆమె భూమి అంచుల నుండి వచ్చింది. ఇదిగో, సొలొమోను కంటే గొప్పది ఇక్కడ ఉంది.[a]
  to: దక్షిణపు రాణి[b] తీర్పులో ఈ తరంతో కలిసి లేస్తుంది, ఈ తరాన్ని ఖండిస్తుంది. ఎందుకంటే సొలొమోను జ్ఞానాన్ని వినడానికి ఆమె భూమి అంచుల నుండి వచ్చింది. ఇదిగో, సొలొమోను కంటే గొప్పది ఇక్కడ ఉంది.[a]
  rationale: సవరణలు మూల గ్రీకు పదబంధాలకు మరింత సమీపంగా ఉండేలా, భవిష్యత్ క్రియను స్పష్టపరచేలా, మరియు ఆధునిక ప్రామాణిక తెలుగులో వాక్యాన్ని సజావుగా చేసేలా మాత్రమే చేశాయి. πλεῖον యొక్క నపుంసక రూపం ‘గొప్పది’గా నిలిపి, ప్రత్యామ్నాయ వ్యక్తివాచక అనువాదాన్ని పాదసూచికలో ఉంచాం. పాదసూచిక గుర్తులు సరైన సూచనల వద్దనే ఉన్నాయి.
