    rationale: βασίλισσα νότου అక్షరార్థంగా ‘దక్షిణపు రాణి’; గ్రీకు ఏ దేశాన్ని పేర్కొనదు. ‘దక్షిణపు రాణి’ మూలంలోని భౌగోళిక అస్పష్టతను బాగా నిలుపుతుంది.
