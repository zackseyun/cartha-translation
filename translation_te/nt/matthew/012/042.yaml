id: MAT.12.42
reference: Matthew 12:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: te
  text: దక్షిణపు రాణి[b] తీర్పులో ఈ తరంతో కలిసి లేస్తుంది, ఈ తరాన్ని ఖండిస్తుంది. ఎందుకంటే సొలొమోను జ్ఞానాన్ని వినడానికి ఆమె భూమి అంచుల నుండి వచ్చింది. ఇదిగో, సొలొమోను కంటే గొప్పది ఇక్కడ ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సొలొమోను కంటే గొప్పవాడు ఇక్కడ ఉన్నాడు.’ గ్రీకులో నపుంసక రూపం (‘గొప్పది’) ఉంది; అది యేసులోను ఆయన పరిచర్యలోను ఉన్న, సొలొమోనును మించిన గొప్పతనాన్ని నొక్కిచెప్పవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘దక్షిణపు రాణి’ అనేది షెబా రాణిని సూచిస్తుంది (1 రాజులు 10:1–13; 2 దినవృత్తాంతాలు 9:1–12); అయితే గ్రీకు పాఠం ‘షెబా’ అనే పేరును స్పష్టంగా పేర్కొనదు.
    reason: cross_reference
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: దక్షిణ దేశపు రాణి
  rationale: గ్రీకులో ఉన్న ‘దక్షిణపు రాణి’ అనే భౌగోళిక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. పాత నిబంధన నేపథ్యం ప్రకారం ఆమె షెబా రాణి అయినప్పటికీ, గ్రీకు వాక్యం ఆ పేరును నేరుగా చెప్పదు.
- source_word: ἐγερθήσεται
  choice: లేచి
  rationale: తీర్పు సందర్భంలో ఆమె లేచి నిలబడటాన్నీ, పునరుత్థాన సూచననూ అనవసరంగా విడదీయకుండా ఉంచే సహజమైన తెలుగు ప్రయోగం.
- source_word: ἐν τῇ κρίσει
  choice: తీర్పు సమయంలో
  rationale: నిర్దిష్టమైన అంత్యకాల తీర్పును సూచించే గ్రీకు పదబంధాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: ఈ తరంవారితో పాటు
  rationale: μετά + genitive యొక్క సాధారణ ‘తో/తో పాటు’ అర్థాన్ని కాపాడుతుంది; ‘వ్యతిరేకంగా’ అనే భావాన్ని ముందుగానే చేర్చదు.
- source_word: κατακρινεῖ αὐτήν
  choice: ఈ తరాన్ని దోషిగా తీర్పుతీరుస్తుంది
  rationale: κατακρίνω లోని ఖండన లేదా దోషనిర్ణయ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; తెలుగు లింగసూచక సర్వనామం అస్పష్టంగా ఉండకుండా పూర్వపదాన్ని మళ్లీ పేర్కొంటుంది.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: భూమి అంచుల నుండి
  rationale: అత్యంత దూరాన్ని సూచించే మూలభాషా నుడికారాన్ని తెలుగులో సుపరిచితమైన రూపంలో నిలుపుతుంది.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: సొలొమోను జ్ఞానాన్ని వినడానికి
  rationale: ఆమె వచ్చిన ఉద్దేశాన్ని తెలిపే infinitive నిర్మాణాన్నీ, ‘సొలొమోను జ్ఞానం’ అనే genitive సంబంధాన్నీ నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని గంభీరంగా ఆకర్షించే గ్రీకు discourse marker కు సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: πλεῖον Σολομῶνος
  choice: సొలొమోను కంటే గొప్పది
  rationale: πλεῖον నపుంసక రూపాన్ని ‘గొప్పవాడు’గా మార్చకుండా కాపాడుతుంది; యేసు మరియు ఆయన కార్యంలో ప్రత్యక్షమైన అధిక గొప్పతనాన్ని సూచించే విస్తృతిని నిలుపుతుంది.
- source_word: ὧδε
  choice: ఇక్కడ ఉంది
  rationale: ‘ఇక్కడ’ అనే స్థలార్థాన్ని తెలుగులో పూర్తి, సహజమైన వాక్యంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సొలొమోనుతో పోల్చిన πλεῖον అనే నపుంసక comparative ను యేసుకు సంబంధించి ఎలా అనువదించాలి
  choice: సొలొమోను కంటే గొప్పది ఇక్కడ ఉంది
  alternative: సొలొమోను కంటే గొప్పవాడు ఇక్కడ ఉన్నాడు
  rationale: గ్రీకు నపుంసక రూపంలోని ఉద్దేశపూర్వక విస్తృతిని, వేదాంతపరమైన ఉద్రిక్తతను కాపాడుతుంది. సందర్భంలో యేసే దృష్టిలో ఉన్నప్పటికీ, మూలపాఠం వ్యక్తిని సూచించే పుంలింగ రూపాన్ని ఉపయోగించలేదు.
- issue: ἐγερθήσεται లోని పునరుత్థాన మరియు న్యాయసభలో లేచి నిలబడే భావాలు
  choice: లేచి
  alternative: లేపబడుతుంది
  rationale: ‘లేచి’ తీర్పులో సాక్షిగా నిలబడే దృశ్యానికి సహజంగా సరిపోతూ, పునరుత్థాన సందర్భాన్ని నిరాకరించదు. ‘లేపబడుతుంది’ దైవిక కర్తృత్వాన్ని మరింత స్పష్టంగా చేస్తుంది గానీ, తెలుగు వాక్యంలో అసహజంగా మరియు అధికంగా నిర్దిష్టంగా వినిపించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘ఇదిగో’ మూలంలోని గంభీర దృష్టి-ఆకర్షణను నిలుపుతుంది. ప్రధాన పాఠంలోని పాదసూచిక గుర్తులు వాటి వివరణలకు తగిన పదాల దగ్గర ఉంచబడ్డాయి.
