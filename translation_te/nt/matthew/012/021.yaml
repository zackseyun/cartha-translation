  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τῷ ὀνόματι αὐτοῦ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/021.yaml
  text: and in his name the nations will hope[a].
translation:
  language: te
  text: మరియు ఆయన నామంలో జనములు ఆశ ఉంచుతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అన్యజనులు ఆయన నామంలో ఆశ ఉంచుతారు.’
    reason: ἔθνη అనే గ్రీకు పదం సందర్భానుసారం ‘జనములు/దేశాలు’ లేదా ‘అన్యజనులు’ అని అర్థం కావచ్చు.
lexical_decisions:
- source_word: καὶ
  choice: (తెలుగు వాక్యంలో ప్రత్యేకంగా అనువదించలేదు)
  rationale: ఇది ముందున్న యెషయా ఉల్లేఖనాన్ని కొనసాగించే సాధారణ సముచ్చయం. అయితే ఒంటరి వచనంగా సహజమైన ఆధునిక తెలుగులో ప్రారంభ ‘మరియు’ అవసరం లేదు; వాక్యసంబంధం సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: ఆయన నామంలో
  rationale: ἐλπίζωతో వచ్చిన దత్తివిభక్తిని ‘లో’ ద్వారా సహజంగా వ్యక్తం చేశాం. ‘నామం’ అనే పదం పేరు మాత్రమే కాక, ఆ పేరుతో సూచింపబడే వ్యక్తి, అధికారం, ఖ్యాతి వంటి భావవ్యాప్తిని కూడా నిలుపుతుంది.
- source_word: ἔθνη
  choice: జనాలు
  rationale: ఈ యెషయా ఉల్లేఖనంలో ఇశ్రాయేలుకు అవతల ఉన్న విస్తృత ప్రజాసమూహాలను సూచిస్తుంది. ‘జనాలు’ సాధారణ పాఠకులకు సహజంగా ఉండి, ‘దేశాలు’ అనే భౌగోళిక భావానికి పరిమితం చేయదు; ‘అన్యజనులు’ అనే సందర్భోచిత అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἐλπιοῦσιν
  choice: నిరీక్షణ ఉంచుతారు
  rationale: భవిష్యత్ క్రియారూపాన్ని నిలుపుతూ, ἐλπίζω యొక్క ‘ఆశించు/నిరీక్షించు’ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. ‘నమ్ముతారు’ అని అనువదించడం కంటే వాగ్దానంలోని భవిష్యదాశను మెరుగుగా కాపాడుతుంది.
theological_decisions:
- issue: మెస్సీయ సంబంధమైన ఉల్లేఖనంలో ἔθνη అనువాదం
  choice: జనాలు
  alternative: అన్యజనులు
  rationale: ‘జనాలు’ యెషయా ప్రవచనంలోని విశాల ప్రజల పరిధిని నిలుపుతుంది; అదే సమయంలో యూదేతర ప్రజలను సూచించే ‘అన్యజనులు’ అనే సందర్భోచిత భావాన్ని పాదటిప్పణి ద్వారా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘నామం’, ‘నిరీక్షణ’ వంటి బైబిలు భావసాంద్రత గల పదాలను ఉంచి, వాక్యనిర్మాణాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దాం.
