id: MAT.12.26
reference: Matthew 12:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: te
  text: సాతాను సాతానును వెళ్లగొడితే[a], అతడు తనకు తానే విరోధంగా చీలిపోయాడు[b]. అలాంటప్పుడు అతని రాజ్యం ఎలా నిలుస్తుంది?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బయటకు వెళ్లగొడితే.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తనకు తానే విరోధంగా చీలిపోయి ఉన్నాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: …తే
  rationale: ముందటి వాదనతో సంబంధాన్ని తెలుగులో సహజంగా కొనసాగిస్తూ, షరతును స్పష్టంగా తెలియజేస్తుంది; వాక్యారంభంలో ‘మరి’ చేర్చడం అవసరం లేదు.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: సాతాను
  rationale: వ్యక్తినామం/బిరుదుకు తెలుగులో స్థిరపడిన లిప్యంతరీకరణను వాడింది.
- source_word: ἐκβάλλει
  choice: వెళ్లగొడితే
  rationale: దయ్యాలను బలవంతంగా బయటకు పంపే భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐφ’ ἑαυτὸν
  choice: తనకు తానే విరోధంగా
  rationale: స్వీయవిరోధం, అంతర్గత సంఘర్షణ అనే గ్రీకు నుడికార భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐμερίσθη
  choice: చీలిపోయాడు
  rationale: అయోరిస్టు పాసివ్ రూపంలోని విభజించబడిన స్థితిని సహజమైన తెలుగు ఫలితభావంతో వ్యక్తం చేస్తుంది; కాలరూపపు ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: πῶς οὖν
  choice: అలాంటప్పుడు … ఎలా
  rationale: οὖν యొక్క తార్కిక పర్యవసాన భావాన్నీ πῶς యొక్క ప్రశ్నార్థకతనూ సహజ తెలుగులో అందిస్తుంది.
- source_word: σταθήσεται
  choice: నిలుస్తుంది
  rationale: కొనసాగడం లేదా స్థిరంగా ఉండడం అనే భావంతో పాటు మూలంలోని ‘నిలుచుట’ రూపకాన్ని కాపాడుతుంది.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: అతని రాజ్యం
  rationale: అతని ఆధిపత్య పరిధి అనే భావానికి సందర్భానుకూలమైన, స్థిరమైన తెలుగు పదబంధం.
theological_decisions:
- issue: సాతాను తనకు తానే విరోధంగా చీలిపోవడం అనే వాదన
  choice: సాతాను సాతానునే వెళ్లగొడుతున్నాడనే ఊహ అతని స్వీయవిభజనకు, తద్వారా అతని రాజ్యం నిలువలేకపోవడానికి దారితీస్తుందని ప్రశ్నారూప తార్కిక వాదనగా అనువదించబడింది.
  alternative: విస్తృత సందర్భంలోని ‘విభజించబడిన ఇల్లు’ రూపకాన్ని ఇక్కడ వివరణగా చేర్చడం.
  rationale: గ్రీకు వాక్యం అంతర్గత విభజన మరియు రాజ్య అస్థిరతను మాత్రమే ప్రత్యక్షంగా చెబుతుంది; అదనపు రూపకాన్ని దిగుమతి చేయకుండా ఆ వేదాంతపరమైన ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలిలో రూపొందించబడింది. ‘సాతానునే’ అనే ఉద్ఘాటన మూలంలోని కర్త–కర్మ పునరుక్తిని స్పష్టంగా ఉంచుతుంది; చివరి ప్రశ్న మూలంలోని తార్కిక బలాన్ని సహజంగా తెలియజేస్తుంది.
