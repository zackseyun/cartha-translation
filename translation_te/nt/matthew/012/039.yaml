id: MAT.12.39
reference: Matthew 12:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: te
  text: 'అయితే ఆయన వారికి జవాబుగా ఇలా చెప్పాడు: “దుష్టమైన, వ్యభిచారిణియైన[a] తరం ఒక సూచన కోసం వెదుకుతోంది. మరియు యోనా ప్రవక్త సూచన[b] తప్ప మరే సూచనా దానికి ఇవ్వబడదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వ్యభిచారిణియైన’ అనే మాట అక్షరార్థ వ్యభిచారంతోపాటు, ప్రవక్తల భాషలో దేవునిపట్ల నమ్మకద్రోహాన్ని కూడా సూచించవచ్చు.
    reason: theological_ambiguity
  - marker: b
    text: లేదా “ప్రవక్తయైన యోనా సూచన.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ఇలా జవాబిచ్చాడు
  rationale: గ్రీకులోని ‘జవాబిచ్చి చెప్పాడు’ అనే కథన సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా, దాని సమాధానార్థాన్ని నిలుపుతూ వ్యక్తపరుస్తుంది.
- source_word: Γενεὰ
  choice: తరం
  rationale: ఒకే కాలానికి చెందిన ప్రజలను సమష్టిగా సూచించే ఈ నామవాచకానికి ‘తరం’ సహజమైన, సందర్భోచితమైన అనువాదం.
- source_word: πονηρὰ
  choice: దుష్టమైన
  rationale: ఇక్కడున్న తీవ్రమైన నైతిక ఖండనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: μοιχαλὶς
  choice: వ్యభిచారిణియైన
  rationale: పదంలోని వ్యభిచార రూపకాన్ని నిలుపుతుంది; దానిని కేవలం ‘నమ్మకద్రోహమైన’ అని వ్యాఖ్యానాత్మకంగా పరిమితం చేయదు.
- source_word: σημεῖον
  choice: సూచన
  rationale: ధృవీకరించే గుర్తు లేదా సూచక కార్యం అనే విస్తృత భావాన్ని నిలుపుతుంది; గ్రీకులో లేని ‘అద్భుతం’ అనే విశేషణాన్ని చేర్చదు.
- source_word: ἐπιζητεῖ
  choice: కోసం వెదుకుతోంది
  rationale: క్రియలోని వెదకడం లేదా కోరడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘డిమాండ్ చేస్తోంది’ అని అతిగా బలపరచదు.
- source_word: δοθήσεται
  choice: ఇవ్వబడదు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: αὐτῇ
  choice: దానికి
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం తిరిగి ‘తరం’ను సూచిస్తుంది; తెలుగులో సమష్టివాచక నామానికి ‘దానికి’ సహజం.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: నిరాకరణతో కూడిన ఈ నిర్మాణంలోని ‘మినహా’ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: యోనా ప్రవక్త సూచన
  rationale: సంబంధాన్ని వివరించి నిర్ణయించకుండా మూలంలోని సంక్షిప్తతను, అస్పష్టతను నిలుపుతుంది; దాని స్వరూపాన్ని తరువాతి సందర్భమే వివరించనిస్తుంది.
theological_decisions:
- issue: ‘వ్యభిచారిణి’ అనే నిందలోని భావం
  choice: ప్రవక్తల గ్రంథాల్లోని నిబంధనాపరమైన అవిశ్వాసాన్ని సూచించగల వ్యభిచార రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం.
  alternative: నమ్మకద్రోహమైన తరం
  rationale: ఈ పదం అక్షరార్థ నైతిక నిందను, దేవునిపట్ల అవిశ్వాసాన్ని సూచించే ప్రవక్తీయ రూపకాన్ని రెండింటినీ ప్రతిధ్వనింపజేయగలదు; ఒకే వ్యాఖ్యానానికి పరిమితం చేయకూడదు.
- issue: ‘యోనా ప్రవక్త సూచన’ స్వరూపం
  choice: ఈ వచనంలో పదబంధాన్ని వివరించకుండా అలాగే ఉంచడం.
  alternative: యోనాకు జరిగినదానివంటి సూచన
  rationale: ఈ సూచనకు నిర్దిష్ట వివరణను ఇక్కడే చేర్చితే తరువాతి వచనం ఇచ్చే వివరణను ముందుగానే పాఠ్యంలోకి తెచ్చినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సూచన’ అనే పదం గ్రీకు σημεῖον యొక్క విస్తృతతను కాపాడుతుంది; ‘అద్భుత సూచక క్రియ’ అని అధికంగా నిర్దిష్టం చేయలేదు. అందించిన ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచిక గుర్తుల స్థానాలు వాటి విషయాలతో సరిపోలకపోవడంతో, తెలుగులో ప్రతి పాదసూచికను దానికి సంబంధించిన పదం వద్ద ఉంచాం.
