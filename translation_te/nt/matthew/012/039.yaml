  to: 'అయితే ఆయన వారికి జవాబుగా ఇలా చెప్పాడు: “దుష్టమైన, వ్యభిచారిణియైన[a] తరం ఒక సూచన కోసం వెదుకుతోంది. మరియు యోనా ప్రవక్త సూచన[b] తప్ప మరే సూచనా దానికి ఇవ్వబడదు.”'
