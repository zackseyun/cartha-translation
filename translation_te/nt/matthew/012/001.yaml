id: MAT.12.1
reference: Matthew 12:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: te
  text: ఆ సమయంలో యేసు సబ్బాతు దినాన[a] ధాన్యపు చేల గుండా వెళ్లాడు. ఆయన శిష్యులకు ఆకలి వేసి, వారు ధాన్యపు వెన్నులు తుంచి తినడం మొదలుపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘సబ్బాతు దినాల్లో’; ఇది ‘సబ్బాతు దినాన’ అనే అర్థమిచ్చే వ్యావహారిక బహువచనం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: ఆ సమయంలో
  rationale: καιρός ఇక్కడ ఒక సందర్భాన్ని లేదా కాలాన్ని సూచిస్తుంది; సహజమైన తెలుగు కథనంలో ‘ఆ సమయంలో’ ఆ కాలసూచనను స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπορεύθη
  choice: వెళ్లాడు
  rationale: πορεύομαι యొక్క సాధారణ గమనార్థాన్ని తెలుగు కథనశైలిలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῖς σάββασιν
  choice: విశ్రాంతి దినాన
  rationale: గ్రీకులో బహువచన రూపం ఉన్నప్పటికీ, ఇది ఒక విశ్రాంతి దినాన్ని సూచించే కొయినే గ్రీకు వాడుక; తెలుగులో ఏకవచనం భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: διὰ τῶν σπορίμων
  choice: పంటచేల గుండా
  rationale: σπόριμος విత్తబడిన, ముఖ్యంగా ధాన్యపు పంట ఉన్న చేలను సూచిస్తుంది; ‘పంటచేలు’ సాధారణ ఆధునిక తెలుగు పాఠకులకు సహజంగా అర్థమవుతుంది.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులకు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక కథన కొనసాగింపును సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో తదుపరి సంఘటనను సహజంగా కలుపుతుంది.
- source_word: ἐπείνασαν
  choice: ఆకలి వేసి
  rationale: ఆకలి మొదలైన భావాన్ని సహజమైన తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
- source_word: ἤρξαντο
  choice: మొదలుపెట్టారు
  rationale: తదనంతర క్రియల ఆరంభాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: τίλλειν στάχυας
  choice: వెన్నులు తుంచి
  rationale: τίλλω చేతితో తుంచడాన్ని, στάχυς ధాన్యపు వెన్నును సూచిస్తాయి; ఈ పదబంధం సంక్షిప్తంగా, వ్యవసాయ సందర్భానికి తగినట్లు ఉంది.
- source_word: καὶ ἐσθίειν
  choice: తినడం
  rationale: τίλλεινతో సమన్వయమైన రెండవ క్రియను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: τοῖς σάββασιν యొక్క బహువచన రూపం
  choice: విశ్రాంతి దినాన
  alternative: విశ్రాంతి దినాల్లో
  rationale: గ్రీకు బహువచనం ఇక్కడ ఒక విశ్రాంతి దినాన్ని సూచించే సుపరిచితమైన వ్యావహారిక రూపం. తెలుగులో అక్షరార్థ బహువచనం అనేక దినాలు ఉద్దేశించబడ్డాయని తప్పుదారి పట్టించవచ్చు; అందువల్ల ఏకవచన భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, రూపాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘విశ్రాంతి దినం’ మూలపద భావాన్ని పారదర్శకంగా ఉంచుతుంది; ‘వెన్నులు తుంచి’ గ్రామీణ-వ్యవసాయ సందర్భంలో స్పష్టంగా ఉండే సాధారణ ప్రయోగం.
