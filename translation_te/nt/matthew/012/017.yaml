  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: te
  text: 'ప్రవక్తయైన యెషయా ద్వారా[a] ఇలా చెప్పబడినది నెరవేరునట్లు ఇది జరిగింది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యెషయా ప్రవక్త చేత.’ గ్రీకులో మరింత అక్షరార్థంగా ‘ద్వారా’ అని ఉంది; ఇది ప్రవక్త మధ్యవర్తిగా వ్యవహరించిన భావాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: నెరవేరేలా
  rationale: ఉద్దేశం లేదా ఫలితం అనే రెండింటికీ అవకాశం ఉంచుతూ, ἵνα యొక్క అనుసంధాన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πληρωθῇ
  choice: నెరవేరేలా
  rationale: మత్తయి ఉపయోగించే నెరవేర్పు సూత్రాన్ని నిలుపుతూ, ἵνα తరువాత ఉన్న నిష్క్రియార్థక సంభావ్య క్రియ భావాన్ని తెలుగు వాక్య నిర్మాణంలో సహజంగా అందిస్తుంది.
- source_word: τὸ ῥηθὲν
  choice: చెప్పబడినది
  rationale: నామవాచకంగా పనిచేస్తున్న నిష్క్రియార్థక కృదంతాన్ని సంక్షిప్తంగా, మూలానికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: διὰ
  choice: ద్వారా
  rationale: షష్ఠీ విభక్తితో వచ్చిన διά మధ్యవర్తి సాధనత్వాన్ని సూచిస్తుంది; దేవుడు అంతిమ వక్తగా, యెషయా ప్రవక్త ద్వారా సందేశం పలికిన భావాన్ని ఇది నిలుపుతుంది.
- source_word: Ἠσαΐου
  choice: యెషయా
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ప్రవక్త పేరు రూపం.
- source_word: τοῦ προφήτου
  choice: ప్రవక్తయైన
  rationale: యెషయాను ప్రవక్తగా స్పష్టంగా గుర్తించే మూలపాఠంలోని విశేషణాత్మక గుర్తింపును నిలుపుతుంది.
- source_word: λέγοντος
  choice: ఆయన ఇలా అన్నాడు
  rationale: తదుపరి వచనంలోని ఉల్లేఖనాన్ని ముందుకు అనుసంధానిస్తూ, తెలుగులో సహజమైన ఉల్లేఖన పరిచయాన్ని ఇస్తుంది.
theological_decisions:
- issue: ప్రవచన సందేశంలో మధ్యవర్తి పాత్ర
  choice: యెషయా ద్వారా
  alternative: యెషయా చేత
  rationale: διά అనే గ్రీకు విభక్త్యవయం దేవుడు ప్రవక్త ద్వారా పలికిన మధ్యవర్తిత్వ భావాన్ని సూచిస్తుంది. ‘ద్వారా’ అనే రూపం యెషయానే సందేశానికి అంతిమ మూలమని సూచించకుండా ఈ భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ముందటి వచనంలోని చర్యతో ἵνα ఉపవాక్యానికి ఉన్న సంబంధం స్పష్టమయ్యేందుకు ‘ఇది జరిగింది’ చేర్చబడింది; ఉల్లేఖనం తదుపరి వచనంలో కొనసాగుతుందని చూపేందుకు చివరలో ద్విబిందువు ఉంచబడింది.
