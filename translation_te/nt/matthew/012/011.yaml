  to: 'అయితే ఆయన వారితో ఇలా అన్నాడు: “మీలో ఏ మనిషికి ఒక్క గొర్రె ఉండి, అది సబ్బాతు దినాన[a] ఒక గోతిలో పడితే, అతడు దాన్ని పట్టుకొని పైకి తీయకుండా ఉంటాడా?”'
