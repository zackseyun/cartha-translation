id: MAT.12.11
reference: Matthew 12:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: te
  text: 'అయితే ఆయన వారితో ఇలా అన్నాడు: “మీలో ఏ మనిషికి ఒక్క గొర్రె ఉండి, అది సబ్బాతు దినాన[a] ఒక గోతిలో పడితే, అతడు దాన్ని పట్టుకొని పైకి తీయకుండా ఉంటాడా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘సబ్బాతు దినాల్లో’; ఇది ‘సబ్బాతు దినాన’ అనే అర్థమిచ్చే నానుడి బహువచనం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: మీలో ఏ మనిషికైనా
  rationale: సానుకూల సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, మూలంలోని పురుష ఏకవచన ప్రతినిధి రూపాన్ని నిలుపుతుంది.
- source_word: ἕξει πρόβατον ἕν
  choice: ఒక గొర్రె ఉండి
  rationale: భవిష్యత్ రూపంలో ఉన్న క్రియను షరతుతో కూడిన సాధారణ ఉదాహరణకు తగిన తెలుగు నిర్మాణంలో అందిస్తుంది; ἕν వల్ల గొర్రె ఒక్కటే అనే అంశం నిలుస్తుంది.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: అది ... పడితే
  rationale: అనిశ్చిత షరతును సహజంగా వ్యక్తం చేస్తుంది; τοῦτο సూచించే గొర్రెను ‘అది’గా స్పష్టంగా కొనసాగిస్తుంది.
- source_word: τοῖς σάββασιν
  choice: విశ్రాంతి దినాన
  rationale: గ్రీకు బహువచనం ఇక్కడ విశ్రాంతి దినాన్ని సూచించే నానుడి ప్రయోగం; తెలుగులో ఏకవచనం భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰς βόθυνον
  choice: ఒక గోతిలో
  rationale: βόθυνος అనే సాధారణ గుంత లేదా గొయ్యి భావాన్ని అనవసరంగా ప్రత్యేకీకరించకుండా అందిస్తుంది.
- source_word: οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ
  choice: అతడు దాన్ని పట్టుకొని పైకి తీయకుండా ఉంటాడా?
  rationale: οὐχί సూచించే ‘తప్పకుండా చేస్తాడు’ అనే ఆశిత సమాధానాన్ని తెలుగు అలంకారిక ప్రశ్నలో స్పష్టంగా నిలుపుతుంది; ἐγερεῖను సందర్భానుసారంగా గోతిలోనుంచి పైకి తీయడంగా అందిస్తుంది.
theological_decisions:
- issue: ప్రతినిధి పురుష లింగ భాష
  choice: మనిషి ... అతడు
  alternative: వ్యక్తి ... వారు
  rationale: మూలంలోని ἄνθρωπος పురుష ఏకవచన ప్రతినిధి ఉదాహరణను నిలుపుతూ, తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఈ ఉదాహరణను లింగతటస్థంగా మార్చాల్సిన సందర్భోచిత అవసరం లేదు.
- issue: τοῖς σάββασιν రూపం
  choice: విశ్రాంతి దినాన
  alternative: విశ్రాంతి దినాల్లో
  rationale: గ్రీకు బహువచనం ఇక్కడ నానుడి ప్రయోగం. ఏకవచన తెలుగు రూపం విశ్రాంతి దిన ధర్మశాస్త్ర వివాద సందర్భాన్ని సరిగ్గా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘విశ్రాంతి దినం’ బైబిలు సందర్భాన్ని గుర్తించదగినదిగా ఉంచుతూనే, పాతకాలపు ‘విశ్రాంతిదినము’ రూపాన్ని నివారిస్తుంది. ప్రశ్న సానుకూల సమాధానాన్ని ఆశిస్తుందనే భావాన్ని ‘తీయకుండా ఉంటాడా?’ నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
