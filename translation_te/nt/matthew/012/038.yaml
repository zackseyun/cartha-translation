id: MAT.12.38
reference: Matthew 12:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: te
  text: 'అప్పుడు శాస్త్రులలోను పరిసయ్యులలోను కొందరు ఆయనకు జవాబిచ్చి ఇలా అన్నారు: “బోధకుడా, నీ నుండి ఒక సూచకాన్ని[a] చూడాలని మేము కోరుతున్నాం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అద్భుత సూచకాన్ని.” గ్రీకు పదం అద్భుతమైన ప్రాముఖ్యతగల సూచకాన్ని సూచించవచ్చు; ప్రధాన పాఠంలో దాని విస్తృతమైన అర్థాన్ని ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనను పరిచయం చేసే సహజమైన కాలసూచక పదం.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: ఆయనకు జవాబిస్తూ ... అన్నారు
  rationale: ముందు ప్రత్యక్ష ప్రశ్న లేకపోయినా, గ్రీకు కథన ప్రయోగంలోని ‘జవాబిచ్చారు/ప్రతిస్పందించారు’ అనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τινες τῶν γραμματέων καὶ Φαρισαίων
  choice: శాస్త్రులలోను పరిసయ్యులలోను కొందరు
  rationale: ఇది ఆ సమూహాలన్నిటినీ కాక, వారిలో కొందరిని సూచిస్తుంది. ‘శాస్త్రులు’, ‘పరిసయ్యులు’ సువార్తల సందర్భంలో సుపరిచితమైన సమూహనామాలు.
- source_word: λέγοντες
  choice: '... అన్నారు'
  rationale: ప్రత్యక్ష వాక్యాన్ని తెలుగులో సహజంగా పరిచయం చేయడానికి గ్రీకు కృదంతాన్ని ప్రధాన వాక్య నిర్మాణంలో కలిపింది.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: యేసును సంబోధించే ‘బోధించేవాడు/గురువు’ అనే ప్రాథమిక అర్థాన్ని తెలియజేస్తుంది; ‘ప్రభువు’ వంటి అధికమైన అధికార భావాన్ని చేర్చదు.
- source_word: θέλομεν
  choice: మేము కోరుతున్నాం
  rationale: వారి సంకల్పం లేదా కోరికను గౌరవప్రదమైన, ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ σοῦ
  choice: నీ నుండి
  rationale: ఆ సూచన యేసు నుండి రావాలని వారు కోరుతున్నారనే మూలం/ఉద్భవ భావాన్ని నిలుపుతుంది.
- source_word: σημεῖον
  choice: సూచన
  rationale: గ్రీకు పదంలోని విస్తృతమైన ‘గుర్తు/సూచన’ భావాన్ని ప్రధాన పాఠంలో ఉంచి, సందర్భంలో ఉండే అద్భుత ప్రాముఖ్యతను పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: ἰδεῖν
  choice: చూడాలని
  rationale: ὁράω క్రియ యొక్క సాధారణ దృశ్యార్థాన్ని నేరుగా, సహజంగా అనువదిస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో σημεῖον స్వభావం
  choice: ప్రధాన పాఠంలో ‘సూచన’
  alternative: ‘అద్భుత సూచక క్రియ’
  rationale: వారు యేసు అధికారాన్ని నిర్ధారించే అద్భుతమైన రుజువును కోరుతున్నారని సందర్భం సూచిస్తుంది. అయినా గ్రీకు పదం స్వయంగా విస్తృతమైన ‘సూచన’ అనే అర్థాన్ని కలిగి ఉన్నందున, ప్రధాన పాఠం దానిని అనవసరంగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు వాక్యంలోని ‘జవాబిస్తూ’ అనే భావం నిలుపబడింది; ప్రత్యక్ష వాక్యంలో సాధారణ పాఠకులకు అర్థమయ్యే పదాలు ఎంచుకోబడ్డాయి.
