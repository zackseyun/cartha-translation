    text: లేదా, “అద్భుత సూచకాన్ని.” గ్రీకు పదం అద్భుతమైన ప్రాముఖ్యతగల సూచకాన్ని సూచించవచ్చు; ప్రధాన పాఠంలో దాని విస్తృతమైన అర్థాన్ని ఉంచాం.
    reason: lexical_alternative
  revision_rationale: The revision corrects the potentially misleading Telugu sense of ‘సూచన’ (‘advice/instruction’) by using ‘సూచకం’ for a sign/token, preserves the deliberate lexical breadth of σημεῖον, and makes the response-and-speech construction natural modern Telugu. No theological interpretation has been added.
