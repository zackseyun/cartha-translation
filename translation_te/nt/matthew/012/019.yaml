id: MAT.12.19
reference: Matthew 12:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: te
  text: ఆయన వాదులాడడు, కేకలు వేయడు[a]; వీధుల్లో ఆయన స్వరం ఎవరికీ వినిపించదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన పోరాడడు, బిగ్గరగా అరవడు; బహిరంగ కూడళ్లలో ఆయన స్వరం ఎవరికీ వినిపించదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρίσει
  choice: వాదులాడడు
  rationale: ἐρίζω కలహపూరితంగా వాదించడం లేదా వివాదానికి దిగడం అనే భావాన్ని ఇస్తుంది. ‘వాదులాడడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సేవకుని కలహరహిత వైఖరిని తెలియజేస్తుంది.
- source_word: κραυγάσει
  choice: కేకలు వేయడు
  rationale: κραυγάζω బిగ్గరగా కేక వేయడం లేదా అరవడం సూచిస్తుంది. ‘కేకలు వేయడు’ బహిరంగంగా గట్టిగా ఘోషించే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀκούσει τις
  choice: ఎవరికీ వినిపించదు
  rationale: నిషేధంతో కూడిన τις ఇక్కడ ‘ఎవరూ వినరు’ అనే భావం ఇస్తుంది. స్వరం అనే కర్తతో తెలుగులో ‘ఎవరికీ వినిపించదు’ మరింత సహజంగా ఉంది.
- source_word: ἐν ταῖς πλατείαις
  choice: వీధుల్లో
  rationale: πλατεῖαι విశాలమైన వీధులు లేదా బహిరంగ రాకపోకల ప్రదేశాలను సూచిస్తుంది. ‘వీధుల్లో’ సంక్షిప్తంగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంది; ‘బహిరంగ కూడళ్లలో’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: φωνὴν αὐτοῦ
  choice: ఆయన స్వరం
  rationale: φωνή ఈ సందర్భంలో వ్యక్తి స్వరాన్ని సూచిస్తుంది. ‘ఆయన స్వరం’ ప్రత్యక్షమైన, గౌరవప్రదమైన అనువాదం.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: వాదులాడడు, కేకలు వేయడు; … ఎవరికీ వినిపించదు
  rationale: గ్రీకులోని వరుస నిషేధాల సంచిత బలాన్ని తెలుగులో సహజమైన మూడు నిషేధ వాక్యభాగాలతో నిలిపాము.
theological_decisions:
- issue: యెషయా సేవకుని ఉల్లేఖనంలో మెస్సీయ ప్రవర్తన చిత్రణ
  choice: ఈ వాక్యం మెస్సీయ కలహానికి దిగకుండా, బహిరంగ ఆర్భాటంతో తనను ప్రకటించుకోని వైఖరిని వర్ణిస్తుంది.
  alternative: సాంప్రదాయ ఉల్లేఖన శైలిని అనుసరించి ‘పోరాడడు, అరవడు’ అని మరింత పదశః అనువదించవచ్చు.
  rationale: గ్రీకు పాఠం యేసు అసలు ఎప్పుడూ బహిరంగంగా మాట్లాడడని చెప్పడం కాదు; ఆయన కలహపూరితంగా లేదా ఆర్భాటంగా వ్యవహరించని స్వభావాన్ని చూపుతుంది. అనువాదం ఈ ఉద్రిక్తతను సిద్ధాంతపరంగా విస్తరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. భవిష్యత్ సూచనను తెలుగులో సహజమైన నిషేధ అలవాటు/నిశ్చయ రూపాలైన ‘వాదులాడడు’, ‘వేయడు’, ‘వినిపించదు’తో వ్యక్తం చేశాము. విరామచిహ్నం మూడు సమాంతర నిషేధాలను స్పష్టంగా విడదీస్తుంది.
