id: MAT.12.41
reference: Matthew 12:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: te
  text: నీనెవెవాసులైన పురుషులు తీర్పులో ఈ తరంతో కలిసి లేచి, దానిని దోషిగా తీర్పు తీరుస్తారు. ఎందుకంటే వారు యోనా ప్రకటనకు ప్రతిస్పందించి పశ్చాత్తాపపడ్డారు.[a] ఇదిగో, యోనా కంటే గొప్పది ఇక్కడ ఉంది![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యోనా ప్రకటించిన సందేశానికి ప్రతిస్పందించి పశ్చాత్తాపపడ్డారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యోనా కంటే గొప్పవాడు ఇక్కడ ఉన్నాడు.” గ్రీకులో ఈ మాట నపుంసక రూపంలో ఉంది; అక్షరార్థంగా “యోనా కంటే గొప్పది.” ఇది కేవలం ఇద్దరు వ్యక్తుల పోలికనే కాకుండా, యేసులోనూ ఆయన పరిచర్యలోనూ ప్రత్యక్షమైన మరింత గొప్ప వాస్తవాన్ని నొక్కిచెప్పవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: నీనెవె పట్టణపు పురుషులు
  rationale: ἄνδρες అనే స్పష్టమైన పుంలింగ బహువచనాన్ని ‘పురుషులు’ అని ఉంచుతూ, Νινευῖταιను సహజమైన ఆధునిక తెలుగులో స్థలసంబంధంగా వ్యక్తం చేస్తుంది.
- source_word: ἀναστήσονται
  choice: లేచి
  rationale: భవిష్య న్యాయసందర్భంలో వారు లేస్తారనే భావాన్ని నిలుపుతుంది; పునరుత్థాన సూచనను తొలగించదు, అలాగే అనవసరంగా వివరణను జోడించదు.
- source_word: ἐν τῇ κρίσει
  choice: తీర్పు సమయంలో
  rationale: ఇక్కడ κρίσις సూచించే అంతిమ న్యాయసందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: ఈ తరంవారితో కలిసి
  rationale: μετά + సంబంధ విభక్తి యొక్క ప్రాథమిక ‘తో’ భావాన్ని నిలుపుతుంది; వ్యతిరేకత తరువాతి ఖండించే క్రియ ద్వారా వ్యక్తమవుతుంది.
- source_word: κατακρινοῦσιν αὐτήν
  choice: వీరిని దోషులుగా తీర్చుతారు
  rationale: κατακρίνω యొక్క ఖండించి దోషిగా తీర్చే న్యాయార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; ‘వీరిని’ ఈ తరంవారిని సూచిస్తుంది.
- source_word: μετενόησαν
  choice: పశ్చాత్తాపపడ్డారు
  rationale: ప్రవక్త ప్రకటనకు ప్రతిస్పందనగా కలిగిన మారుమనస్సును సందర్భానుకూలమైన, స్థిరపడిన తెలుగు పదంతో తెలియజేస్తుంది.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: యోనా చేసిన ప్రకటనకు స్పందించి
  rationale: κήρυγμαను ‘ప్రకటన’గా, εἰς నిర్మాణంలోని ప్రతిస్పందన భావాన్ని ‘స్పందించి’గా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని గంభీరంగా ఆకర్షించే గ్రీకు ఉద్ఘాటనను సహజమైన తెలుగు సంభాషణ సూచకంతో నిలుపుతుంది.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: యోనా కంటే గొప్పది ఇక్కడ ఉంది
  rationale: πλεῖον నపుంసక ఏకవచన రూపాన్ని ‘గొప్పది’గా నిలిపి, కేవలం వ్యక్తుల మధ్య పోలికగా పరిమితం చేయకుండా యేసులో ఉన్న గొప్ప వాస్తవాన్ని సూచించే మూలంలోని విస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: πλεῖον Ἰωνᾶ ద్వారా యేసు తనను సూచించడాన్ని ఎలా అనువదించాలి
  choice: యోనా కంటే గొప్పది ఇక్కడ ఉంది
  alternative: యోనా కంటే గొప్పవాడు ఇక్కడ ఉన్నాడు
  rationale: గ్రీకులో పుంలింగ వ్యక్తివాచక రూపం కాకుండా నపుంసక తులనాత్మక రూపం ఉంది. అందువల్ల యేసును సూచిస్తూనే, ఆయన వ్యక్తి మరియు పరిచర్యలో ఉన్న గొప్ప వాస్తవం అనే ఉద్దేశపూర్వక విస్తృతిని అనువాదం నిలుపుతుంది.
- issue: ἄνδρες అనే లింగ-నిర్దిష్ట పదం
  choice: పురుషులు
  alternative: ప్రజలు
  rationale: మూలపాఠం సాధారణ నివాసులను సూచించే లింగతటస్థ పదం కాకుండా స్పష్టంగా ἄνδρες అని చెప్పింది; అందువల్ల దాన్ని సాధారణీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే తీర్పు, పశ్చాత్తాపం వంటి గంభీర ధార్మిక పదజాలం నిలుపబడింది. మూలంలోని పుంలింగ ἄνδρες మరియు నపుంసక πλεῖον మధ్య ఉన్న ఉద్దేశపూర్వక భేదాన్ని ప్రధాన పాఠం, పాదటిప్పణి రెండింటిలో కాపాడాం.
