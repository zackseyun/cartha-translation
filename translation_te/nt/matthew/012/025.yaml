id: MAT.12.25
reference: Matthew 12:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: te
  text: 'అయితే ఆయన వారి ఆలోచనలు[a] తెలుసుకొని వారితో ఇలా అన్నాడు: “తనకు తానే విరోధంగా చీలిపోయిన ప్రతి రాజ్యం నాశనమవుతుంది[b]. అలాగే తనకు తానే విరోధంగా చీలిపోయిన ప్రతి పట్టణం గానీ ఇల్లు[c] గానీ నిలవదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆలోచనలు’కు ‘తర్కాలు’ లేదా ‘ఉద్దేశాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నాశనమవుతుంది’కు ‘పాడైపోతుంది’ లేదా ‘నిర్జనమవుతుంది’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘ఇల్లు’ అనే పదానికి ‘ఇంటివారు’ లేదా ‘కుటుంబం’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: తెలుసుకొని
  rationale: ఈ భూతకాల క్రియావిశేషణ రూపం మానసికంగా గ్రహించడం లేదా తెలుసుకోవడం అనే భావాన్ని ఇస్తుంది. యేసు వారికి సంబంధించిన అంతరంగ విషయాన్ని ఏ విధంగా తెలుసుకున్నాడో అదనంగా నిర్ధారించకుండా, ప్రధాన క్రియతో దాని సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: δέ ఇక్కడ స్వల్పమైన మలుపు లేదా వ్యత్యాసాన్ని సూచిస్తుంది. సందర్భంలోని వాదనా మలుపుకు ‘అయితే’ సహజంగా సరిపోతుంది.
- source_word: ἐνθυμήσεις
  choice: ఆలోచనలు
  rationale: ఈ పదం అంతరంగ ఆలోచనలు, తర్కాలు, ఉద్దేశాలు అనే అర్థవిస్తృతిని కలిగి ఉంది. ‘ఆలోచనలు’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, ఆ విస్తృతిని అతిగా కుదించదు.
- source_word: Πᾶσα βασιλεία
  choice: ప్రతి రాజ్యం
  rationale: ఏకవచన నామవాచకంతో వచ్చిన πᾶσα సామాన్యంగా వర్తించే సూత్రాన్ని తెలియజేస్తుంది; ‘ప్రతి రాజ్యం’ దాని సార్వత్రిక భావాన్ని నిలుపుతుంది.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: తనకు తానే విరోధంగా చీలిపోయిన
  rationale: ఈ పదబంధం కేవలం అంతర్గత భేదాన్ని కాక, తనకే వ్యతిరేకంగా నిలిచే అంతర్గత చీలికను సూచిస్తుంది. ఈ తెలుగు రూపం κατά యొక్క విరోధ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐρημοῦται
  choice: నాశనమవుతుంది
  rationale: ఈ క్రియ పాడై నిర్జనమవడం లేదా వినాశానికి చేరడం అనే తీవ్రమైన ఫలితాన్ని సూచిస్తుంది. ‘నాశనమవుతుంది’ సహజమైన ఆధునిక తెలుగులో ఆ ఫలితాన్ని తెలియజేస్తుంది; ప్రత్యామ్నాయ ఛాయలను పాదసూచికలో ఉంచాం.
- source_word: πόλις ἢ οἰκία
  choice: పట్టణం గానీ ఇల్లు గానీ
  rationale: πόλιςకు ‘పట్టణం’ సహజమైన సమానార్థకం. οἰκία భవనమైన ఇల్లు లేదా ఇంటివారు అనే రెండు భావాలు కలిగి ఉండగలదు; ప్రధాన పాఠంలో ‘ఇల్లు’ ఉంచి, విస్తృత భావాన్ని పాదసూచికలో తెలిపాం. ‘గానీ…గానీ’ నిర్మాణం ἢను సహజమైన తెలుగు సామాన్య వాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ σταθήσεται
  choice: నిలవదు
  rationale: ఇక్కడ ἵστημι స్థిరంగా కొనసాగడం లేదా నిలిచి ఉండడం అనే నుడికార భావంలో ఉంది. ‘నిలవదు’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యేసు వారి అంతరంగ ఆలోచనలను తెలుసుకున్న విధానం
  choice: ‘వారి ఆలోచనలు తెలుసుకొని’ అని మాత్రమే అనువదించి, ఆయనకు అవి ఎలా తెలిసాయో పేర్కొనలేదు.
  alternative: ఆయన దైవిక సర్వజ్ఞతవల్ల తెలుసుకున్నాడు; లేదా వారి మాటలు, పరిస్థితులనుబట్టి గ్రహించాడు అని స్పష్టీకరించడం.
  rationale: మూల వాక్యం ఆయనకు వారి ఆలోచనలు తెలుసని చెబుతుంది గానీ, ఆ జ్ఞానం వచ్చిన విధానాన్ని వివరించదు. అందువల్ల అనువాదం అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చకుండా మూలంలోని విపులీకరించని ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. రాజ్యం–పట్టణం–ఇల్లు అనే మూల రూపకాల క్రమాన్ని నిలిపి, తెలుగు సహజత్వం కోసం రెండో భాగంలో ‘అలాగే’ మరియు ‘గానీ…గానీ’ నిర్మాణాన్ని వాడాం.
