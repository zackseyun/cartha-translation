revisions:
- from: అయితే పరిసయ్యులు బయటికి వెళ్లి, ఆయనను ఎలా నాశనం చేయాలో అని ఆయనకు వ్యతిరేకంగా కుట్ర పన్నారు.[a]
  to: అయితే పరిసయ్యులు బయటికి వెళ్లి, ఆయనను ఎలా నాశనం చేయాలా అని ఆయనకు వ్యతిరేకంగా కుట్ర పన్నారు.[a]
  rationale: The revision corrects the Telugu deliberative indirect-question syntax while preserving the Greek purpose/content nuance and the existing optimal-equivalence decision to render ἀπολέσωσιν broadly as ‘నాశనం చేయడం.’ The footnote is smoothed into idiomatic Telugu and retains the English audit trail’s alternatives.
  reviewer_model: gpt-5.6-terra
