id: MAT.12.14
reference: Matthew 12:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: te
  text: అయితే పరిసయ్యులు బయటికి వెళ్లి, ఆయనను ఎలా నాశనం చేయాలా అని ఆయనకు వ్యతిరేకంగా కుట్ర పన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను చంపాలో’ లేదా ‘ఆయనకు మరణశిక్ష విధించాలో.’ గ్రీకు పదానికి ‘నాశనం చేయడం’ అనే విస్తృత అర్థం ఉంది; ఈ సందర్భంలో అది ప్రాణాంతక ఉద్దేశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: బయటికి వెళ్లి
  rationale: అనంతరంగా జరిగిన చర్యను సూచించే aorist participleను సహజమైన తెలుగు క్రమార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: యేసు చేసిన కార్యానికి పరిసయ్యుల ప్రతికూల స్పందనను సూచించే స్వల్ప వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: οἱ Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూదు వర్గానికి ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన లిప్యంతరీకరణ.
- source_word: συμβούλιον ἔλαβον
  choice: కుట్ర పన్నారు
  rationale: అక్షరార్థంగా ‘ఆలోచన తీసుకున్నారు’ అనే ఈ నుడికారం, ఇక్కడి శత్రుత్వపూరిత సందర్భంలో ఆయనను నిర్మూలించేందుకు ఉద్దేశపూర్వకంగా పన్నాగం చేయడాన్ని సూచిస్తుంది.
- source_word: κατ’ αὐτοῦ
  choice: ఆయనకు వ్యతిరేకంగా
  rationale: κατά + genitiveకు ఈ సందర్భంలో ఉన్న ప్రతికూల, విరోధార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὅπως
  choice: ఎలా … చేయాలో అని
  rationale: వారి కుట్రలోని ఆలోచన లేదా లక్ష్యాన్ని తెలిపే deliberative భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀπολέσωσιν
  choice: నాశనం చేయాలో
  rationale: ἀπόλλυμι అనే క్రియలోని విస్తృత ‘నాశనం చేయు/నిర్మూలించు’ భావాన్ని నిలుపుతూ, సందర్భంలోని ప్రాణాంతక ఉద్దేశాన్ని మరింత నిర్దిష్టంగా ప్రధాన పాఠంలో రుద్దదు.
theological_decisions:
- issue: ἀπολέσωσινలోని నిర్దిష్టత స్థాయి
  choice: నాశనం చేయాలో
  alternative: చంపాలో / మరణానికి గురిచేయాలో
  rationale: సందర్భం ప్రాణాంతక ఉద్దేశాన్ని బలంగా సూచించినప్పటికీ, గ్రీకు క్రియ ప్రత్యక్షంగా ‘చంపు’ అనే క్రియకన్నా విస్తృతమైనది. అందువల్ల ప్రధాన పాఠం ఆ విస్తృతతను నిలుపుతుంది; స్పష్టమైన సందర్భార్థాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘కుట్ర పన్నారు’ అనే నుడికారం గ్రీకు సందర్భంలోని ఉద్దేశపూర్వక శత్రుత్వాన్ని తెలియజేస్తుంది; ‘నాశనం చేయాలో’ మూలపదంలోని అర్థవిస్తృతిని కాపాడుతుంది.
