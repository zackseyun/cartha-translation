id: MAT.12.4
reference: Matthew 12:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: te
  text: అతడు దేవుని మందిరంలోకి ప్రవేశించి, అతడూ అతనితో ఉన్నవారూ సన్నిధి రొట్టెలను[b] ఎలా తిన్నారో[a]—వాటిని తినడం అతనికిగాని అతనితో ఉన్నవారికిగాని ధర్మసమ్మతం కాదు; యాజకులకు మాత్రమే అది ధర్మసమ్మతం—?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘వారు తిన్నారు’ అనే బహువచనానికి బదులు ‘అతడు తిన్నాడు’ అనే ఏకవచనం ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘సముఖపు రొట్టెలు’; దేవుని ఎదుట ఉంచే ప్రతిష్ఠిత రొట్టెలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: ఎలా
  rationale: ముందరి వచనంలో ప్రారంభమైన దావీదు వృత్తాంతాన్ని వివరించే ప్రశ్నను కొనసాగిస్తుంది; గ్రీకు వాక్యంలోని విధానార్థాన్ని సహజంగా నిలుపుతుంది.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: దేవుని మందిరంలోకి ప్రవేశించి
  rationale: ‘దేవుని గృహం’ అనే అక్షరార్థం తెలుగులో ఈ పవిత్ర స్థలాన్ని సూచించేటప్పుడు ‘దేవుని మందిరం’గా సహజంగా వ్యక్తమవుతుంది; సందర్భాన్ని మించి నిర్దిష్ట స్థలపేరును చేర్చలేదు.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: సన్నిధి రొట్టెలు
  rationale: దేవుని ఎదుట ఉంచే ప్రతిష్ఠిత రొట్టెలను సూచించే ఆరాధనా సంబంధ పదబంధం; ఆధునిక పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని ‘సన్నిధి/ముందు ఉంచడం’ భావాన్ని నిలుపుతుంది.
- source_word: ἔφαγον
  choice: అతడూ అతనితో ఉన్నవారూ ... తిన్నారు
  rationale: SBLGNTలోని బహువచన క్రియను స్పష్టంగా ప్రతిబింబిస్తుంది. తెలుగులో కర్తను స్పష్టం చేయడం సహజం; ఏకవచన పాఠాంతరాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: వాటిని తినడం అతనికి ... ధర్మసమ్మతం కాదు
  rationale: ἐξὸν యొక్క అనుమతి/చట్టబద్ధత భావాన్ని సాధారణ అనుమతిగా బలహీనపరచకుండా, ఆరాధనా ధర్మానికి సంబంధించిన న్యాయబద్ధతగా తెలుపుతుంది.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: అతనితో ఉన్నవారికిగాని
  rationale: దావీదుతో ఉన్నవారిని మూలానికి దగ్గరగా, సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: యాజకులకు మాత్రమే ధర్మసమ్మతం
  rationale: εἰ μὴ తెలిపే మినహాయింపును, μόνοις తెలిపే ప్రత్యేకతను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ἐξὸν యొక్క ఆరాధనా-ధర్మ సంబంధ బలం
  choice: ధర్మసమ్మతం కాదు
  alternative: అనుమతి లేదు
  rationale: ఇది కేవలం సామాజిక అనుమతి విషయం కాదని, పవిత్ర రొట్టెల వినియోగంపై ఉన్న ధర్మపరమైన పరిమితి అని తెలియజేస్తుంది; అదనపు సిద్ధాంతాన్ని చేర్చదు.
- issue: ἔφαγον క్రియకు కర్త
  choice: బహువచనం—అతడూ అతనితో ఉన్నవారూ తిన్నారు
  alternative: ఏకవచనం—అతడు తిన్నాడు
  rationale: అందించిన SBLGNT పాఠం బహువచనాన్ని కలిగి ఉంది. ప్రాముఖ్యమైన ఏకవచన పాఠాంతరాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: దేవుని గృహం యొక్క సందర్భార్థం
  choice: దేవుని మందిరం
  alternative: దేవుని గృహం; ప్రత్యక్ష గుడారం
  rationale: మూలంలోని సాధారణ పవిత్రస్థల పదప్రయోగాన్ని నిలుపుతూ, సందర్భం ఆధారంగా ‘ప్రత్యక్ష గుడారం’ అని మరీ నిర్దిష్టీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం ముందరి వచనంలో ప్రారంభమైన ప్రశ్నకు వ్యాకరణపరంగా కొనసాగింపు కావడం వల్ల ‘ఎలా’ నిర్మాణాన్ని నిలిపాం. ఆరాధనా పదాలకు అతి ప్రాచీన రూపాలను ప్రధాన పాఠంలో నివారించి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
