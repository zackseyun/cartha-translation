id: MAT.12.40
reference: Matthew 12:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: te
  text: ఎందుకంటే, యోనా పెద్ద సముద్ర జీవి[a] కడుపులో మూడు రోజులు, మూడు రాత్రులు[c] ఉన్నట్టే, మనుష్యకుమారుడు భూమి హృదయంలో[b] మూడు రోజులు, మూడు రాత్రులు ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పెద్ద చేప.’ గ్రీకు పదం ఒక పెద్ద సముద్ర జీవిని సూచిస్తుంది; అది నిర్దిష్టమైన జంతుశాస్త్రీయ పదంకన్నా విస్తృతమైనది.
    reason: lexical_alternative
  - marker: b
    text: ‘భూమి హృదయంలో’ అనేది పాతిపెట్టబడటాన్ని, సమాధిని, లేదా భూమి లోతులను/మృతుల లోకాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో గ్రీకు రూపకాన్ని అలాగే ఉంచాం.
    reason: alternative_reading
  - marker: c
    text: ‘మూడు రోజులు, మూడు రాత్రులు’ అనే మాటను కొందరు మూడు రోజులలోని భాగాలను కూడా కలుపుకునే కాలవాడుకగా అర్థం చేసుకుంటారు; మరికొందరు దాన్ని మరింత కచ్చితమైన కాలవ్యవధిగా తీసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ఎందుకంటే ... ఉన్నట్టే
  rationale: γάρ తెలిపే వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో, ὥσπερ తెలిపే పోలికను ‘ఉన్నట్టే’తో సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Ἰωνᾶς
  choice: యోనా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἐν τῇ κοιλίᾳ
  choice: కడుపులో
  rationale: κοιλία యొక్క సాధారణ అర్థమైన ‘కడుపు/ఉదరం’ను సామాన్యులకు సహజంగా అర్థమయ్యేలా అందిస్తుంది.
- source_word: τοῦ κήτους
  choice: పెద్ద సముద్ర జీవి
  rationale: κῆτος ఒక నిర్దిష్ట జంతుశాస్త్రీయ జాతికన్నా విస్తృతంగా పెద్ద సముద్ర జీవిని సూచిస్తుంది; అందువల్ల ప్రధాన పాఠంలో ‘చేప’ అని పరిమితం చేయలేదు.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: మూడు పగళ్లు, మూడు రాత్రులు
  rationale: మూలంలోని కాలవ్యక్తీకరణను వ్యాఖ్యానాత్మకంగా మార్చకుండా నేరుగా నిలుపుతుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు స్వీయనామంగా ఉపయోగించిన ఈ బైబిలు బిరుదు యొక్క ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ἔσται
  choice: ఉంటాడు
  rationale: εἰμί భవిష్యత్ రూపాన్ని అదనపు కాలవ్యాప్తి భావం చేర్చకుండా సహజంగా అనువదిస్తుంది.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: భూమి హృదయంలో
  rationale: καρδία అనే రూపకాన్ని నిలుపుతూ, దానిని ‘సమాధి’ లేదా ‘మృతుల లోకం’గా ప్రధాన పాఠంలోనే నిర్ధారించదు.
theological_decisions:
- issue: ‘భూమి హృదయంలో’ అనే మాట యొక్క భావం
  choice: రూపకాన్ని ‘భూమి హృదయంలో’ అని యథాతథంగా నిలిపాం.
  alternative: సమాధిలో; భూమి లోతుల్లో; మృతుల లోకంలో
  rationale: గ్రీకు పదబంధం రూపకాత్మకమైనది; పాతిపెట్టబడటం, సమాధి, లేదా మృతుల లోకం అనే వివరణల్లో ఒక్కదానినే అది స్పష్టంగా నిర్బంధించదు.
- issue: ‘మూడు పగళ్లు, మూడు రాత్రులు’ అనే కాలవ్యక్తీకరణ
  choice: ప్రధాన పాఠంలో నేరుగా అనువదించాం.
  alternative: మూడు రోజులలోని భాగాలను కలుపుకునే యూదీయ కాలవాడుక; కచ్చితమైన డెబ్బై రెండు గంటలు
  rationale: కాలక్రమానికి సంబంధించిన వివాదాన్ని అనువాదంలో పరిష్కరించకుండా, వచనం చెప్పిన వ్యక్తీకరణనే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘పెద్ద సముద్ర జీవి’ సాధారణ పాఠకునికి స్పష్టంగా ఉండడంతో పాటు గ్రీకు పదం యొక్క విస్తృతిని కాపాడుతుంది; ‘భూమి హృదయం’ అనే ఉద్దేశపూర్వక రూపకం అలాగే నిలిచింది.
