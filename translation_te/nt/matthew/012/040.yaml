    issue: ‘మూడు పగళ్లు’ renders τρεῖς ἡμέρας.
    rationale: Greek ἡμέρας denotes days, whereas Telugu ‘పగళ్లు’ normally means the daylight portions of days. ‘మూడు రోజులు, మూడు రాత్రులు’ preserves the stated expression without narrowing it.
