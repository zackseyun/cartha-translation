id: MAT.12.18
reference: Matthew 12:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: te
  text: '“ఇదిగో, నేను ఎన్నుకున్న నా సేవకుడు,

    నా ప్రియుడు—ఆయనలో నా ప్రాణం ఆనందించింది.

    నా ఆత్మను ఆయన మీద ఉంచుతాను;

    ఆయన జనాలకు న్యాయాన్ని[a] ప్రకటిస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీర్పును.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: ప్రవచన ఉల్లేఖనంలోని దృష్టిని ఆకర్షించే పిలుపును సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: παῖς
  choice: సేవకుడు
  rationale: యెషయా సేవకుని సందర్భంలో ‘బిడ్డ’ కంటే ‘సేవకుడు’ అనే అర్థమే ఉద్దేశితం; మూలంలోని సేవకుని ఇతివృత్తాన్ని కాపాడుతుంది.
- source_word: ὃν ᾑρέτισα
  choice: నేను ఎన్నుకున్న
  rationale: దేవుడు చేసిన నిర్దిష్ట ఎంపికను తెలుగులో సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ὁ ἀγαπητός μου
  choice: నా ప్రియుడు
  rationale: దైవిక ప్రేమను, వాక్యంలోని గౌరవాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: εἰς ὃν εὐδόκησεν ἡ ψυχή μου
  choice: ఆయనలో నా ప్రాణం ఆనందించింది
  rationale: ‘నా ప్రాణం’ అనే స్పష్టమైన కర్తను తొలగించకుండా, εὐδοκέωలోని సంతోషపూర్వక అనుకూలతను వ్యక్తం చేస్తుంది.
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: నా ఆత్మను ఆయన మీద ఉంచుతాను
  rationale: ప్రవచనాత్మక నియామక భాషను, ‘నా ఆత్మ’ మరియు ‘ఆయన మీద’ అనే మూల నిర్మాణాన్ని స్పష్టంగా కాపాడుతుంది.
- source_word: κρίσιν
  choice: న్యాయాన్ని
  rationale: యెషయా సంబంధిత సేవకుని కార్యంలో దేవుని నీతియుక్తమైన న్యాయవ్యవస్థను జనాలకు చాటే భావాన్ని ‘న్యాయం’ సముచితంగా తెలియజేస్తుంది; ‘తీర్పు’ అనే సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: τοῖς ἔθνεσιν
  choice: జనాలకు
  rationale: ἔθνη యొక్క విస్తృతమైన ‘జనాలు/దేశజనాలు’ భావాన్ని అందిస్తుంది; కేవలం యూదేతరులు అనే వివరణకు అనవసరంగా పరిమితం చేయదు.
- source_word: ἀπαγγελεῖ
  choice: ప్రకటిస్తాడు
  rationale: బహిరంగంగా తెలియజేయడం అనే క్రియ యొక్క ప్రవచనాత్మక, అధికారపూర్వక భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: παῖςలో మెస్సీయ సేవకుని గుర్తింపు
  choice: ‘సేవకుడు’ అని అనువదించడం
  alternative: ‘బిడ్డ’ లేదా ‘కుమారుడు’
  rationale: ఇది యెషయా సేవకుని వాక్య ఉల్లేఖనం. ‘సేవకుడు’ పాత నిబంధన అంతర్వచన సంబంధాన్ని కాపాడుతూ, ఈ పదంలో ప్రత్యక్షంగా లేని కుమారత్వ భాషను చేర్చదు.
- issue: ప్రవచనాత్మక కార్య సందర్భంలో κρίσις
  choice: ప్రధాన పాఠ్యంలో ‘న్యాయం’
  alternative: ‘తీర్పు’
  rationale: సేవకుడు జనాలకు తీసుకువచ్చి ప్రకటించే దేవుని నీతియుక్తమైన వ్యవస్థను ఈ సందర్భంలో ‘న్యాయం’ మెరుగ్గా వ్యక్తం చేస్తుంది. గ్రీకు పదానికి ‘తీర్పు’ అనే నిజమైన ప్రత్యామ్నాయార్థం ఉన్నందున దాన్ని పాదసూచికలో కాపాడాం.
- issue: εὐδόκησεν ἡ ψυχή μουలో మానవాకార భాష
  choice: ‘నా ప్రాణం ఆనందించింది’ అని స్పష్టంగా ఉంచడం
  alternative: ‘నేను ఎంతో సంతోషించాను’ అని సరళీకరించడం
  rationale: మూలంలోని ‘నా ప్రాణం’ అనే భావోద్వేగపూర్వక వ్యక్తీకరణను సిద్ధాంతపరంగా చదును చేయకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రవచన ఉల్లేఖనానికి తగిన గౌరవప్రదమైన శైలి. సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఉపయోగిస్తూ, మూలంలోని సమాంతర కవితా నిర్మాణం మరియు ‘నా ప్రాణం’ అనే వ్యక్తీకరణను నిలిపాం.
