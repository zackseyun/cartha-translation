  to: లేదా, విశ్రాంతి దినాల్లో దేవాలయంలో యాజకులు విశ్రాంతి దినాన్ని అపవిత్రపరుస్తారు, అయినా నిర్దోషులుగా ఉంటారని ధర్మశాస్త్రంలో మీరు చదవలేదా?[a][b][c]
