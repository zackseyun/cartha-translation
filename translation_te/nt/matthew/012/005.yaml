id: MAT.12.5
reference: Matthew 12:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: te
  text: లేదా, విశ్రాంతి దినాల్లో దేవాలయంలో యాజకులు విశ్రాంతి దినాన్ని అపవిత్రపరుస్తారు, అయినా నిర్దోషులుగా ఉంటారని ధర్మశాస్త్రంలో మీరు చదవలేదా?[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అపవిత్రపరుస్తారు’కు బదులుగా ‘విశ్రాంతి దినాన్ని ఉల్లంఘిస్తారు’ లేదా ‘విశ్రాంతి దిన నియమాన్ని మీరుతారు’ అని అనువదించవచ్చు. గ్రీకు క్రియకు పవిత్రమైనదాన్ని సామాన్యమైనదిగా లేదా అపవిత్రమైనదిగా చూడడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘విశ్రాంతి దినాల్లో’ అని బహువచనం ఉంది; ఇది ఒకే సందర్భాన్ని కాక, మళ్లీ మళ్లీ వచ్చే విశ్రాంతి దినాలను సూచిస్తుండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘ధర్మశాస్త్రం’ మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది; ముఖ్యంగా విశ్రాంతి దినాన యాజకులు చేయవలసిన సేవకు సంబంధించిన నియమాలు ఉద్దేశించబడి ఉండవచ్చు (సంఖ్యా 28:9–10 చూడండి).
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: లేదా
  rationale: యేసు ప్రతివాదంలో మరో లేఖనాధారాన్ని పరిచయం చేసే ప్రత్యామ్నాయ సూచనను సహజంగా నిలుపుతుంది.
- source_word: οὐκ ἀνέγνωτε
  choice: మీరు చదవలేదా?
  rationale: మత్తయిలో కనిపించే అలంకారప్రశ్నను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ νόμῳ
  choice: ధర్మశాస్త్రంలో
  rationale: సాధారణ నియమాన్ని కాక మోషే ధర్మశాస్త్రం అనే లేఖన సంపుటాన్ని సూచిస్తుంది.
- source_word: τοῖς σάββασιν
  choice: విశ్రాంతి దినాల్లో
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, పునరావృతమయ్యే విశ్రాంతి దిన సందర్భాలను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: οἱ ἱερεῖς
  choice: యాజకులు
  rationale: దేవాలయ సేవలు నిర్వహించే యాజకులను నేరుగా సూచిస్తుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయంలోని
  rationale: ἱερόν దేవాలయ సముదాయాన్ని సూచిస్తుంది; తెలుగులో 'దేవాలయం' సహజమైన, తగిన విస్తృతిగల పదం.
- source_word: τὸ σάββατον
  choice: విశ్రాంతి దినాన్ని
  rationale: కర్మగా ఉన్న ఏకవచనాన్ని, ఆ దినం/వ్యవస్థను సూచించే విధంగా నిలుపుతుంది.
- source_word: βεβηλοῦσιν
  choice: అపవిత్రం చేసినా
  rationale: పవిత్రమైనదాన్ని సామాన్యమైనదిగా చూడడం లేదా దాని పవిత్రతను ఉల్లంఘించడం అనే బలమైన భావాన్ని నిలుపుతుంది; 'చేసినా' వాక్యంలోని విరుద్ధతను తెలుగులో సహజంగా కలుపుతుంది.
- source_word: ἀναίτιοί εἰσιν
  choice: నిర్దోషులుగా ఉంటారు
  rationale: అలాంటి చర్య ఉన్నప్పటికీ వారు న్యాయపరంగా దోషులు కారనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యాజకులు నిజంగా విశ్రాంతి దినాన్ని ఉల్లంఘించినట్లు అనిపించకుండా వాక్యాన్ని మృదువుగా చేయాలా?
  choice: '''విశ్రాంతి దినాన్ని అపవిత్రం చేసినా నిర్దోషులుగా ఉంటారు'' అనే బలమైన విరుద్ధతను నిలుపడం'
  alternative: '''విశ్రాంతి దినాన పని చేసినా నిర్దోషులుగా ఉంటారు'''
  rationale: మూలంలోని βεβηλοῦσιν మరియు ἀναίτιοί మధ్య ఉద్దేశపూర్వకమైన ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపాలి. ధర్మశాస్త్రం ఆదేశించిన దేవాలయ సేవ వల్ల యాజకులకు దోషం ఆపాదించబడదనే వాదన దీనిలో ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖనానికి తగిన గంభీరతతో రూపొందించబడింది. ‘సబ్బాతు’ కంటే అర్థవంతమైన ‘విశ్రాంతి దినం’ వాడబడింది. మూలంలోని బహువచనం మరియు ‘అపవిత్రం—నిర్దోషులు’ అనే ఉద్దేశపూర్వక ఉద్రిక్తత నిలుపబడ్డాయి.
