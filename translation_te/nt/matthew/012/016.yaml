lexical_decisions:
- source_word: καὶ
  choice: ఆయన
  rationale: తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని ప్రారంభించడం అవసరం లేదు; కథన కొనసాగింపును సహజ వాక్యనిర్మాణం తెలియజేస్తుంది.
- source_word: ἐπετίμησεν
  choice: గట్టిగా హెచ్చరించాడు
  rationale: ఈ సందర్భంలో ఇది మందలింపుకన్నా బలమైన ఆదేశంతో కూడిన హెచ్చరికను సూచిస్తుంది. ‘గట్టిగా’ అనే పదం క్రియలోని తీవ్రతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτοῖς
  choice: వారిని
  rationale: సందర్భంలో యేసు సంబోధించిన బహువచన సమూహాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἵνα μὴ
  choice: తెలియజేయవద్దని
  rationale: హెచ్చరిక లేదా ఆదేశం తరువాత వచ్చే నిషేధాత్మక విషయాన్ని తెలుగులో ‘-వద్దని’ నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: తన గురించి ఎవరికీ తెలియజేయవద్దని
  rationale: φανερὸν ποιέω అనే గ్రీకు ప్రయోగం ‘బయటపెట్టు/తెలియజేయు’ అనే అర్థం ఇస్తుంది. ‘తన గురించి’ αὐτόν అనే వ్యక్తిగత కర్మను నిలుపుతుంది; ‘ఎవరికీ’ ప్రజలకు వెల్లడించకూడదనే భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: యేసు ప్రచారాన్ని నిరోధించిన ఆదేశ స్వభావం
  choice: తన గురించి తెలియజేయవద్దనే గట్టి హెచ్చరిక
  alternative: వారిని మందలించడం లేదా వారికి అధికారికంగా ఆజ్ఞాపించడం
  rationale: గ్రీకు క్రియ తీవ్ర హెచ్చరిక, మందలింపు, లేదా ఆదేశం అనే భావాలను మోయగలదు. సందర్భం వెల్లడిని నిషేధించే బలమైన నిర్దేశాన్ని సూచిస్తుంది; అయితే దానికి గల వేదాంత కారణాన్ని ఈ వచనం చెప్పనందున అనువాదం దానిని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘గట్టిగా హెచ్చరించాడు’ మూలంలోని తీవ్రతను చూపుతూ అనవసరంగా నైతిక తప్పును ఆపాదించదు.
