id: MAT.12.23
reference: Matthew 12:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: te
  text: జనసమూహాలన్నీ ఆశ్చర్యపోతూ, “ఈయనే దావీదు కుమారుడు అయి ఉంటాడా?” అని అంటూ ఉన్నారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దావీదు కుమారుడు” అనేది దావీదు వంశం నుండి వస్తాడని వాగ్దానం చేయబడిన రాజూ విమోచకుడూ అయిన మెస్సీయను సూచించే బిరుదు.
    reason: cross_reference
  - marker: b
    text: 'ప్రశ్నలోని ప్రతికూల అంచనాను మరింత అక్షరార్థంగా ప్రతిబింబిస్తే: “ఈయన దావీదు కుమారుడు కాదుగదా?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: ఆశ్చర్యపడి
  rationale: ఇక్కడి అపూర్ణ భూతకాల క్రియ జనసమూహాలు ఆశ్చర్యానికి లోనై ఉన్న ప్రతిస్పందనను సూచిస్తుంది. ‘ఆశ్చర్యపడి’ సహజమైన ఆధునిక తెలుగు; సందర్భంలో దాని బలం స్పష్టంగా ఉంటుంది.
- source_word: πάντες οἱ ὄχλοι
  choice: జనసమూహాలన్నీ
  rationale: గ్రీకులో ‘జనసమూహాలు’ బహువచనంలో ఉంది; ఈ రూపం ఆ సంఖ్యను నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἔλεγον
  choice: అని అనుకుంటూ ఉన్నారు
  rationale: అపూర్ణ భూతకాలం కొనసాగుతున్న లేదా పలువురిలో వ్యాపించిన మాటను సూచిస్తుంది. ప్రశ్నార్థక సందర్భంలో ‘అని అనుకుంటూ ఉన్నారు’ వారి ఆశ్చర్యభరితమైన చర్చను సహజంగా వ్యక్తం చేస్తుంది; దీనిని కేవలం అంతరంగ ఆలోచనగా పరిమితం చేయదు.
- source_word: Μήτι
  choice: అయి ఉంటాడా?
  rationale: Μήτι సాధారణంగా ప్రతికూల సమాధానాన్ని ఊహించే లేదా సంకోచంతో అడిగే ప్రశ్నను ప్రవేశపెడుతుంది. ‘అయి ఉంటాడా?’ ఆశ్చర్యంతో కూడిన అనిశ్చితిని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ὁ υἱὸς Δαυίδ
  choice: దావీదు కుమారుడు
  rationale: మత్తయిలో ఇది మెస్సీయను సూచించే స్థిరమైన బిరుదు. మూలంలోని బంధుత్వ రూపాన్నీ, దాని చారిత్రక-వేదాంత ప్రాధాన్యాన్నీ యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: ‘దావీదు కుమారుడు’ అనే బిరుదులోని మెస్సీయ సంబంధిత భావం
  choice: ప్రధాన పాఠ్యంలో ‘దావీదు కుమారుడు’ అనే బిరుదునే ఉంచడం
  alternative: ‘మెస్సీయ’ లేదా ‘దావీదు వంశంలో వాగ్దానం చేయబడిన రాజు’ అని వివరణాత్మకంగా అనువదించడం
  rationale: గ్రీకు పాఠ్యం వివరణను కాకుండా బిరుదునే ఉపయోగిస్తుంది. అందువల్ల దాని చారిత్రక, వేదాంతపరమైన ఉద్వేగాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అర్థాన్ని పాదసూచికలో వివరిస్తాం.
- issue: Μήτι ప్రశ్నలోని ప్రతికూల అంచనా
  choice: ‘ఈయనే ... అయి ఉంటాడా?’ అనే సంకోచభరిత ప్రశ్న
  alternative: ‘ఈయన ... కాదుగదా?’ లేదా ‘ఈయన ... కాడు కదా?’
  rationale: మూలంలోని ప్రశ్న ప్రతికూల సమాధానాన్ని కొంతవరకు ఊహించినప్పటికీ, సందర్భంలో జనసమూహాల ఆశ్చర్యం మరియు సంభావ్యతపై విచారణ కూడా ఉన్నాయి. ప్రధాన పాఠ్యం ఆ అనిశ్చితిని సహజంగా ఇస్తుంది; మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. గ్రీకులోని బహువచన ‘జనసమూహాలు,’ కొనసాగుతున్న ప్రతిస్పందన, మరియు Μήτι లోని సంకోచభరిత ప్రతికూల అంచనాను వీలైనంతవరకు నిలిపింది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
