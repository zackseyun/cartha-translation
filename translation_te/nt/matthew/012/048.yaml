source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: te
  text: అయితే తనతో మాట్లాడుతున్న వ్యక్తికి ఆయన ఇలా జవాబిచ్చాడు:[a] “నా తల్లి ఎవరు? నా సోదరులు ఎవరు?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “అయితే తనతో మాట్లాడుతున్న వ్యక్తికి ఆయన జవాబిచ్చి ఇలా అన్నాడు.”'
    reason: ἀποκριθεὶς εἶπεν అనే గ్రీకు జంట ప్రయోగంలోని రెండు క్రియారూపాలను మరింత రూపపరంగా చూపే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: అయితే ... ఆయన ఇలా జవాబిచ్చాడు
  rationale: ἀποκριθεὶς εἶπεν అనే గ్రీకు జంట ప్రయోగం సహజంగా ‘జవాబిచ్చాడు’ అనే అర్థాన్నిస్తుంది; δέ సంభాషణలోని మలుపును ‘అయితే’ ద్వారా తెలియజేస్తుంది. ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: τῷ λέγοντι αὐτῷ
  choice: తనతో మాట్లాడుతున్న వ్యక్తికి
  rationale: వర్తమాన కృదంతమైన λέγοντι కొనసాగుతున్న సంభాషణ చర్యను సూచిస్తుంది. దాతువు భావాన్ని ‘వ్యక్తికి’ ద్వారా నిలుపుతూ, తెలుగులో సహజంగా అనువదించబడింది.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: నా తల్లి ఎవరు?
  rationale: గుర్తింపును అడిగే ప్రశ్నను తెలుగులో సహజమైన పదక్రమంతో నేరుగా అందిస్తుంది.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: నా సోదరులు ఎవరు?
  rationale: బహువచన పుంలింగ బంధుత్వ పదమైన ἀδελφοίను ‘సోదరులు’గా అనువదించి, మూలంలోని రెండవ సమాంతర ప్రశ్నను నిలుపుతుంది.
theological_decisions:
- issue: కుటుంబ గుర్తింపు గురించి యేసు అడిగిన అలంకారిక ప్రశ్నలను వివరణాత్మకంగా మృదువుచేయడం
  choice: ప్రశ్నలను ఎలాంటి వివరణాత్మక విస్తరణ లేకుండా నేరుగా ఉంచడం
  alternative: ‘నా తల్లిగా పరిగణించబడేది ఎవరు? నా సోదరులుగా పరిగణించబడేవారు ఎవరు?’
  rationale: తరువాతి సందర్భంలో వచ్చే బంధుత్వ పునర్నిర్వచనాన్ని ఈ వాక్యంలో ముందుగానే చేర్చకుండా, కథనంలోని భావ ఉద్వేగం మరియు వేదాంతపరమైన ఉత్కంఠను నిలుపుతుంది.
- issue: ἀδελφοίలో లింగ సూచన
  choice: సోదరులు
  alternative: సోదర సోదరీమణులు; తోబుట్టువులు
  rationale: ఈ సందర్భంలోని తక్షణ ప్రస్తావన యేసు కుటుంబంలోని పురుష సహోదరుల వైపే ఉంది; అందువల్ల మూలంలోని పుంలింగ బంధుత్వ పదాన్ని విస్తరించకుండా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే సహజమైన, గౌరవప్రదమైన శైలి. ‘అన్నదమ్ములు’ కంటే ‘సోదరులు’ను ఎంచుకోవడం మూలంలోని బంధుత్వ పదానికి నేరుగా సరిపోవడమే కాక, ప్రమాణ తెలుగు పఠనానికి అనుకూలం.
