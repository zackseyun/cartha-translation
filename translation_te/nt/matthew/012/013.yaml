id: MAT.12.13
reference: Matthew 12:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: te
  text: అప్పుడు ఆయన ఆ మనిషితో, “నీ చెయ్యి చాపు” అన్నాడు.[a] అతడు దానిని చాపాడు; అది పునరుద్ధరించబడి, మరో చెయ్యిలా ఆరోగ్యంగా అయింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతులలో “నీ చెయ్యి” అనే మాటలు లేవు.
    reason: textual_variant
  - marker: b
    text: అక్షరార్థంగా, “మరొకదానిలా ఆరోగ్యంగా”; ఇక్కడ “మరొకటి” అంటే ఆ మనిషి మరో చెయ్యి.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనను సహజంగా సూచించే కాలవాచక అవ్యయం.
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో భూతకాలంగా అందించింది.
- source_word: τῷ ἀνθρώπῳ
  choice: ఆ మనిషితో
  rationale: సందర్భంలో ఒక నిర్దిష్ట పురుషుణ్ణి సూచిస్తుంది; తెలుగులో మాట చెప్పడాన్ని సూచించేందుకు ‘తో’ సహజం.
- source_word: Ἔκτεινόν σου τὴν χεῖρα
  choice: నీ చెయ్యి చాపు
  rationale: ఆజ్ఞ యొక్క ప్రత్యక్షతను, χείρ యొక్క సాధారణ అర్థమైన ‘చెయ్యి’ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐξέτεινεν
  choice: అతడు దాన్ని చాపాడు
  rationale: ఆజ్ఞలోని క్రియాపునరుక్తిని నిలుపుతూ, తెలుగులో అవసరమైన కర్మసూచక సర్వనామాన్ని జతచేస్తుంది.
- source_word: ἀπεκατεστάθη
  choice: అది మళ్లీ బాగై
  rationale: కేవలం స్వస్థతకన్నా సరైన మునుపటి స్థితికి పునరుద్ధరించబడిన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ὑγιὴς ὡς ἡ ἄλλη
  choice: మరో చెయ్యిలా ఆరోగ్యంగా అయింది
  rationale: ‘మరొకటి’ అనే స్త్రీలింగ సూచన చెయ్యినే ఉద్దేశిస్తుందని తెలుగులో స్పష్టంగా చేస్తూ, ఆరోగ్యకరమైన స్థితిని నిలుపుతుంది.
theological_decisions:
- issue: స్వస్థతను వర్ణించిన తీరు
  choice: చెయ్యి మళ్లీ బాగై, మరో చెయ్యిలా ఆరోగ్యంగా అయిందని అనువదించడం
  alternative: చెయ్యి స్వస్థపడింది / పూర్తిగా బాగుపడింది
  rationale: ἀποκαθίστημι లోని పూర్వపు సరైన స్థితికి పునరుద్ధరణ భావాన్ని నిలుపుతూ, వచనం చెప్పనిదే అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన భూతకాల కథనంగా అందించాం; ‘చెయ్యి’ సాధారణ ఆధునిక రూపం.
