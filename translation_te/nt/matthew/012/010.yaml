source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: te
  text: ఇదిగో, చేయి ఎండిపోయిన ఒక మనిషి ఉన్నాడు. వారు ఆయనను నిందించడానికి, “విశ్రాంతి దినాల్లో స్వస్థపరచడం ధర్మశాస్త్రానుసారం సమ్మతమేనా?[a]” అని ఆయనను అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్రాంతి దినాన స్వస్థపరచడం ధర్మశాస్త్రానుసారం సమ్మతమేనా?” గ్రీకులో “విశ్రాంతి దినాల్లో” అని బహువచనం ఉంది; ఇది విశ్రాంతి దినాలను సూచించే సాధారణ ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: దృశ్యంలోని వ్యక్తివైపు పాఠకుని దృష్టిని ఆకర్షించే గ్రీకు సంభాషణ సూచిక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: ఇక్కడ ఒక నిర్దిష్ట పురుష వ్యక్తిని సూచిస్తుంది; సాధారణ మానవాళిని కాదు.
- source_word: χεῖρα ἔχων ξηράν
  choice: చెయ్యి చచ్చుబడిపోయిన
  rationale: ξηράν అక్షరార్థంగా ఎండిపోయిన లేదా క్షీణించిన స్థితిని సూచించినా, ఈ స్వస్థత సందర్భంలో పనిచేయని లేదా క్షీణించిన చేతిని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; నిర్దిష్ట వైద్య నిర్ధారణను అనవసరంగా చేర్చదు.
- source_word: ἐπηρώτησαν αὐτὸν
  choice: ఆయనను అడిగారు
  rationale: క్రియను సూటిగా అందిస్తుంది; వారి శత్రుత్వ ఉద్దేశాన్ని తరువాతి ఉద్దేశవాక్యమే స్పష్టం చేస్తుంది.
- source_word: ἔξεστι
  choice: ధర్మశాస్త్రం ప్రకారం సమ్మతమేనా
  rationale: విశ్రాంతి దిన ఆచరణకు సంబంధించిన ఈ సందర్భంలో కేవలం సాధారణ అనుమతి కాక, ధార్మిక-న్యాయబద్ధ అనుమతిని ప్రశ్నిస్తున్న భావాన్ని స్పష్టం చేస్తుంది.
- source_word: τοῖς σάββασιν
  choice: విశ్రాంతి దినాల్లో
  rationale: గ్రీకులోని బహువచనాన్ని నిలుపుతూ, తెలుగు పాఠకునికి సహజంగా అర్థమయ్యే రూపాన్ని ఉపయోగిస్తుంది.
- source_word: θεραπεύειν
  choice: స్వస్థపరచడం
  rationale: సువార్తలలో శారీరక స్వస్థతను సూచించడానికి సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: ఆయన మీద నేరం మోపడానికి
  rationale: ἵνα యొక్క ఉద్దేశ భావాన్నీ, κατηγορέω యొక్క న్యాయపరమైన ఆరోపణ భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: విశ్రాంతి దినానికి సంబంధించిన బహువచన ప్రయోగం
  choice: విశ్రాంతి దినాల్లో
  alternative: విశ్రాంతి దినాన
  rationale: τοῖς σάββασιν గ్రీకులో బహువచనం. ఇది విశ్రాంతి దినాలను సాధారణంగా సూచించే ప్రయోగం కావచ్చు; అందువల్ల మూలంలోని సంఖ్యను ప్రధాన పాఠ్యంలో నిలిపి, సహజమైన ఏకవచన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తున్నాం.
- issue: ἔξεστι లోని అనుమతి భావం
  choice: ధర్మశాస్త్రం ప్రకారం సమ్మతమేనా
  alternative: అనుమతి ఉందా
  rationale: వివాదం విశ్రాంతి దిన ధర్మాచరణకు సంబంధించినది కాబట్టి, ప్రశ్నలోని న్యాయ-ధార్మిక కోణాన్ని వ్యక్తం చేశాం; ఏ ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్నీ చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ మూలంలోని దృష్టి ఆకర్షణను నిలుపుతుంది. ‘చెయ్యి చచ్చుబడిపోయిన’ సాధారణ పాఠకునికి అర్థమయ్యే విధంగా పరిస్థితిని తెలియజేస్తుంది; అతిగా వైద్యపరంగా నిర్దిష్టం చేయదు.
