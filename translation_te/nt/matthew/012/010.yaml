revisions:
- from: అప్పుడు ఇదిగో, చెయ్యి చచ్చుబడిపోయిన ఒక మనిషి అక్కడ ఉన్నాడు. వారు ఆయన మీద నేరం మోపడానికి, “విశ్రాంతి దినాల్లో స్వస్థపరచడం ధర్మశాస్త్రం ప్రకారం సమ్మతమేనా?[a]” అని ఆయనను అడిగారు.
  to: ఇదిగో, చేయి ఎండిపోయిన ఒక మనిషి ఉన్నాడు. వారు ఆయనను నిందించడానికి, “విశ్రాంతి దినాల్లో స్వస్థపరచడం ధర్మశాస్త్రానుసారం సమ్మతమేనా?[a]” అని ఆయనను అడిగారు.
