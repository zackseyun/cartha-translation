id: MAT.12.49
reference: Matthew 12:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: te
  text: తన శిష్యుల వైపు చేయి చాపి, “ఇదిగో, నా తల్లి, నా సోదరులు!” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας
  choice: చేయి చాపి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన సహాయక చర్యను సహజమైన తెలుగు క్రియారూపంతో తెలియజేస్తూ, యేసు చేసిన భౌతిక సంజ్ఞను స్పష్టంగా ఉంచుతుంది.
- source_word: χεῖρα
  choice: చేయి
  rationale: ఈ సందర్భంలో శరీర భాగాన్ని సూచించే సాధారణమైన, సహజమైన తెలుగు పదం.
- source_word: ἐπὶ
  choice: వైపు
  rationale: కర్మవిభక్తితో ఉన్న ἐπί ఇక్కడ సంజ్ఞ యొక్క దిశను సూచిస్తుంది; ‘వైపు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: μαθητὰς
  choice: శిష్యులు
  rationale: బోధకుడు–శిష్యుడు సంబంధాన్ని నిలుపుకునే, సువార్తల్లో స్థిరంగా వాడే సముచిత పదం.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే ἰδού యొక్క ప్రత్యక్ష, ఉద్ఘాటనాత్మక బలాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: μήτηρ
  choice: తల్లి
  rationale: సాధారణ కుటుంబ సంబంధ పదానికి నేరమైన తెలుగు సమానార్థకం.
- source_word: ἀδελφοί
  choice: సోదరులు
  rationale: గ్రీకు పదంలోని పుంలింగ బహువచనాన్ని నిలుపుతూ, ‘సోదర సోదరీమణులు’ లేదా ‘తోబుట్టువులు’ అని విస్తరించి వ్యాఖ్యానించదు.
theological_decisions:
- issue: యేసు శిష్యులను తన కుటుంబంగా గుర్తించే మాటలోని బంధుత్వ భాష
  choice: ‘తల్లి’, ‘సోదరులు’ అనే నిర్దిష్ట కుటుంబ సంబంధ పదాలను నిలుపుకోవడం
  alternative: ‘కుటుంబం’ లేదా ‘తోబుట్టువులు’ వంటి సమగ్ర పదాలతో భావానువాదం చేయడం
  rationale: మూలపాఠం నిర్దిష్ట బంధుత్వ పదాల ద్వారా శిష్యులను యేసు కుటుంబంతో గుర్తిస్తుంది. విస్తృతమైన భావానువాదం ఆ వాక్యంలోని అలంకారిక బలాన్ని తగ్గించి, మూలంలో స్పష్టంగా లేని వివరణను చేర్చవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘ఇదిగో’ ఉద్ఘాటనను నిలుపుతుంది; ‘సోదరులు’ మూలంలోని పుంలింగ బహువచనాన్ని విస్తరించకుండా అందిస్తుంది.
