  - severity: low
    issue: ‘గుర్తించబడుతుంది’ is somewhat formal and less natural for this Telugu proverbial formulation.
    rationale: ‘తెలిసిపోతుంది’ naturally expresses that the nature of a tree becomes known from its fruit and retains the source’s present passive sense.
