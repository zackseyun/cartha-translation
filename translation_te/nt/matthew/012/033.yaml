  terminology: ‘చెట్టు,’ ‘పండు,’ ‘మంచిది,’ and ‘కుళ్లినది’ are suitable, coherent choices. ‘పండు’ preserves the physical image directly. No doctrinally loaded terminology has been introduced.
  issues:
