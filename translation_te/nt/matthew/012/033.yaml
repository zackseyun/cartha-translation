  verdict: revise
  source_fidelity: 'The draft accurately retains the repeated aorist imperatives (ποιήσατε), the good/rotten tree-and-fruit parallelism, and the explanatory present passive: a tree is known by its fruit. ‘కుళ్లినది’ appropriately conveys σαπρός in the concrete metaphor while allowing its evaluative force.'
