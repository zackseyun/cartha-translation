id: MAT.12.33
reference: Matthew 12:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: te
  text: “చెట్టును మంచిదిగా చేయండి, దాని పండును కూడా మంచిదిగా చేయండి; లేదా చెట్టును కుళ్లినదిగా చేయండి, దాని పండును కూడా కుళ్లినదిగా చేయండి.[a][b] ఎందుకంటే చెట్టు దాని పండును బట్టి తెలిసిపోతుంది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కుళ్లినది’ అనే మాటకు బదులుగా ‘చెడైనది’ లేదా ‘పనికిరానిది’ అని కూడా అనువదించవచ్చు; σαπρός అనే గ్రీకు పదం చెడిపోయిన, భ్రష్టమైన, లేదా పనికిరాని దానిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ రెండుసార్లు వచ్చిన ‘చేయండి’ అనే ఆజ్ఞ సందర్భానుసారంగా ‘అలా పరిగణించండి’ లేదా ‘అలా చూపండి’ అనే అలంకారిక భావాన్ని కలిగి ఉండవచ్చు; అయితే గ్రీకు రూపం ఆజ్ఞార్థకమే.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσατε
  choice: చేయండి
  rationale: గ్రీకులోని భూతార్థక ఆజ్ఞార్థక బహువచన రూపాన్ని నేరుగా నిలుపుతుంది. సందర్భంలో ‘అలా పరిగణించండి’ లేదా ‘అలా చూపండి’ అనే అలంకారిక భావం ఉండవచ్చుగానీ, ఆ భావాన్ని ప్రధాన పాఠ్యంలో స్థిరపరచకుండా మూలంలోని పదునైన ఆజ్ఞను కాపాడుతుంది.
- source_word: δένδρον
  choice: చెట్టు
  rationale: రూపకంలోని ప్రధాన చిత్రాన్ని సహజమైన ఆధునిక తెలుగు పదంతో నేరుగా అందిస్తుంది.
- source_word: καλός
  choice: మంచిది
  rationale: నాణ్యత, స్వభావం, నైతిక ప్రతిధ్వని—ఈ మూడింటినీ నిలుపుతుంది; ‘ఆరోగ్యకరమైనది’ అనడం భావాన్ని శారీరక స్థితికే పరిమితం చేస్తుంది.
- source_word: καρπός
  choice: పండు
  rationale: చెట్టు రూపకంలో సహజంగా సరిపోతుంది; ‘ఫలం’ కూడా సాధ్యమే అయినా, సాధారణ ఆధునిక తెలుగులో ‘పండు’ చిత్రం మరింత ప్రత్యక్షంగా ఉంటుంది.
- source_word: σαπρός
  choice: కుళ్లినది
  rationale: చెడిపోయిన, భ్రష్టమైన, పనికిరాని స్థితిని సూచించే గ్రీకు పదంలోని బలమైన చిత్రాన్ని నిలుపుతుంది; చెట్టుకూ పండుకూ వర్తించేలా ఉంది.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: ఎందుకంటే ... పండును బట్టి
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో, ἐκ యొక్క ఆధారార్థాన్ని తెలుగులో సహజమైన ‘బట్టి’తో వ్యక్తం చేస్తుంది.
- source_word: γινώσκεται
  choice: గుర్తించబడుతుంది
  rationale: వర్తమాన కర్మణి భావాన్ని నిలుపుతూ, చెట్టు స్వభావం దాని పండు ద్వారా తెలిసిపోతుందనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: αὐτοῦ
  choice: దాని
  rationale: నపుంసకలింగమైన ‘చెట్టు’ను సూచించే సర్వనామానికి తెలుగులో సహజమైన సమానార్థకం.
theological_decisions:
- issue: యేసు చెప్పిన రూపకంలో ఆజ్ఞార్థకాల బలం
  choice: ‘చేయండి’ అనే ప్రత్యక్ష ఆజ్ఞార్థక రూపాన్ని రెండుసార్లు నిలిపాం.
  alternative: ‘మంచిదిగా పరిగణించండి,’ ‘మంచిదని చూపండి,’ లేదా షరతు వాక్యంగా అనువదించడం.
  rationale: మూల గ్రీకు పాఠంలో రెండుసార్లు ఆజ్ఞార్థక రూపమే ఉంది. అది అలంకారిక సవాలు కావచ్చుగానీ, దానిని వివరణాత్మక వాక్యంగా మార్చితే మూలంలోని ఉద్దేశపూర్వక ఉద్రిక్తత తగ్గిపోతుంది.
- issue: σαπρός పదంలోని రూపక మరియు నైతిక విస్తృతి
  choice: ‘కుళ్లినది’ అని అనువదించాం.
  alternative: ‘చెడైనది’ లేదా ‘పనికిరానిది.’
  rationale: ‘కుళ్లినది’ చెట్టు–పండు చిత్రాన్ని సజీవంగా ఉంచుతుంది; అదే సమయంలో చెడిపోయిన లేదా భ్రష్టమైన స్వభావాన్ని సూచించే విస్తృతిని పూర్తిగా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. సమాంతర నిర్మాణాన్ని నిలిపి, మూలంలోని ఆజ్ఞార్థక ఉద్రిక్తతను సాఫీ చేయలేదు. రెండు పాదాల తరువాతే [a] ఉంచడం ద్వారా σαπρός యొక్క రెండు ప్రయోగాలకూ ఒకే గమనిక వర్తించేలా చేశాం; [b] ‘గుర్తించబడుతుంది’ వద్ద కనిపించినా, దాని గమనిక పూర్వపు పునరుక్త ‘చేయండి’ రూపాన్ని వివరిస్తుంది.
