revisions:
- from: మంచి మనిషి[a] తన మంచి నిధిలోనుండి మంచి వాటిని బయటికి తీస్తాడు[b]; దుష్ట మనిషి తన దుష్ట నిధిలోనుండి దుష్టమైన వాటిని బయటికి తీస్తాడు.
  to: మంచి మనిషి[a] తన మంచి నిధి నుండి మంచి వాటిని వెలువరించుతాడు[b]; దుష్ట మనిషి తన దుష్ట నిధి నుండి దుష్టమైన వాటిని వెలువరించుతాడు.
  rationale: 'The revision changes only the rendering of the source relationship and action: ‘నిధి నుండి’ directly represents ἐκ τοῦ ... θησαυροῦ, while ‘వెలువరించుతాడు’ communicates the metaphorical bringing-forth sense of ἐκβάλλει. It preserves the source’s ambiguity about whether the things brought forth are specifically words or more broadly words and deeds; the contextual clarification remains in footnote b.'
