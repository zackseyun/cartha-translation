id: MAT.12.35
reference: Matthew 12:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: te
  text: మంచి మనిషి[a] తన మంచి నిధి నుండి మంచి వాటిని వెలువరించుతాడు[b]; దుష్ట మనిషి తన దుష్ట నిధి నుండి దుష్టమైన వాటిని వెలువరించుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ఇక్కడ వ్యాకరణపరంగా పుంలింగ ఏకవచన రూపం ఉంది; అయితే అది ప్రతినిధిగా ఒక వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: దగ్గరి సందర్భం మాటల గురించి ఉంది; కాబట్టి ‘మంచి వాటిని’, ‘దుష్టమైన వాటిని’ అనేవి ముఖ్యంగా మాటలను సూచించవచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς / ἀγαθά
  choice: మంచి / మంచి వాటిని
  rationale: వ్యక్తినీ అతని నుంచి వెలువడే వాటినీ వర్ణించేందుకు గ్రీకులో ఒకే పదం పునరావృతమవుతుంది; ఆ పదపునరుక్తినీ నైతిక వ్యత్యాసాన్నీ తెలుగులో నిలిపింది.
- source_word: ἄνθρωπος
  choice: మనిషి
  rationale: ఇది ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, సామెతలాంటి ఈ వాక్యంలో ప్రతినిధిగా చెప్పబడిన వ్యక్తిని సూచిస్తుంది.
- source_word: θησαυροῦ
  choice: నిధి
  rationale: లోపల కూడబెట్టిన సంపద నుంచి బయటికి తీసే రూపకాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐκβάλλει
  choice: బయటికి తీస్తాడు
  rationale: ἐκβάλλειలోని బయటికి తెచ్చే భావాన్ని కాపాడుతూ, ఈ సందర్భంలో అతిగా బలంగా వినిపించని సహజ తెలుగు ప్రయోగాన్ని ఎంచుకుంది.
- source_word: πονηρὸς / πονηρά
  choice: దుష్ట / దుష్టమైన వాటిని
  rationale: ἀγαθόςతో ఉన్న బలమైన నైతిక వ్యత్యాసాన్ని కాపాడుతుంది; కేవలం ‘చెడు’ అనడం కంటే వ్యక్తిని వర్ణించడంలో ‘దుష్ట’ మరింత సముచితం.
- source_word: ἐκ
  choice: నుండి
  rationale: మూలం లేదా నిల్వ నుంచి వెలువడే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: లోపలి నైతిక నిధి నుంచి వెలువడేవి మాటలేనా, లేక మాటలు మరియు క్రియలు సహా విస్తృతమైనవా?
  choice: మూలంలోని నపుంసక బహువచన విశేషణాలను ‘మంచి వాటిని’, ‘దుష్టమైన వాటిని’ అని విస్తృతంగానే ఉంచింది.
  alternative: తక్షణ సందర్భాన్ని బట్టి ‘మంచి మాటలు’, ‘దుష్టమైన మాటలు’ అని స్పష్టీకరించడం.
  rationale: మత్తయి 12:34, 36-37లో మాటలే ప్రధాన సందర్భమైనప్పటికీ, ఈ వచనంలో ‘మాటలు’ అనే నామవాచకం లేదు. అందువల్ల ప్రధాన పాఠం మూలంలోని విస్తృతతను నిలిపి, సందర్భ సూచనను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలిని వాడింది. రెండు భాగాల సమాంతర నిర్మాణం, ‘మంచి/దుష్ట’ పదపునరుక్తి, నిధి నుంచి బయటికి తీసే రూపకం నిలిపివేయబడ్డాయి.
