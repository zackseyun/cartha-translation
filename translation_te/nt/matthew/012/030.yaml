revisions:
- from: నాతో లేనివాడు నాకు విరోధంగా ఉన్నాడు; నాతో కూడ సమకూర్చనివాడు చెదరగొడుతున్నాడు.[a]
  to: నాతో ఉండనివాడు నాకు విరోధంగా ఉన్నాడు; నాతో కలిసి కూడగట్టనివాడు చెదరగొడతాడు.[a]
  rationale: The revision clarifies the relational sense of being “with” Jesus, uses natural modern Telugu, and preserves the Greek’s generic, balanced gather/scatter antithesis. The footnote retains the legitimate alternative way Telugu may express the substantival participles.
  reviewer_model: gpt-5.6-terra
