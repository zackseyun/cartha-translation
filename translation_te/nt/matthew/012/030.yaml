review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two parallel assertions and the absolute contrast. However, “నాతో లేనివాడు” can suggest mere absence rather than the relational association expressed by μετ’ ἐμοῦ, and the present generic force is better conveyed in the second clause by a habitual form.
  naturalness: “నాతో కలిసి” is more natural modern standard Telugu than “నాతో కూడ” in this context. “కూడగట్టని” and “చెదరగొడతాడు” form a clear, idiomatic antithetical pair.
  terminology: “నాకు విరోధంగా” accurately renders κατ’ ἐμοῦ. “కూడగట్టడం / చెదరగొట్టడం” retains the gather/scatter contrast without specifying an unstated object or image.
  issues:
  - severity: medium
    issue: “నాతో లేనివాడు” is potentially ambiguous.
    rationale: It may be understood as someone who is physically absent from the speaker, whereas ὁ μὴ ὢν μετ’ ἐμοῦ denotes one who is not with Jesus in association or alignment. “నాతో ఉండనివాడు” communicates this more directly.
  - severity: low
    issue: The second clause’s verbal form is less natural for a generic maxim.
    rationale: “చెదరగొడుతున్నాడు” can sound like an action currently in progress. The Greek present in this aphoristic parallel is naturally represented by Telugu “చెదరగొడతాడు.”
  - severity: low
    issue: “నాతో కూడ” is somewhat less idiomatic in modern standard Telugu.
    rationale: “నాతో కలిసి” is a clear contemporary expression of accompanying or cooperating with Jesus.
  revised_text: నాతో ఉండనివాడు నాకు విరోధంగా ఉన్నాడు; నాతో కలిసి కూడగట్టనివాడు చెదరగొడతాడు.[a]
  revised_footnotes:
  - marker: a
    text: లేదా, “నాతో ఉండని ఎవరైనా నాకు విరోధంగా ఉంటారు; నాతో కలిసి కూడగట్టని ఎవరైనా చెదరగొడతారు.”
    reason: గ్రీకులో ఆర్టికల్‌తో వచ్చిన కృదంతాలను సాధారణ ఏకవచనంగా లేదా తెలుగులో సహజమైన ‘ఎవరైనా’ నిర్మాణంతో వ్యక్తపరచవచ్చు.
  revision_rationale: The revision clarifies the relational sense of being “with” Jesus, uses natural modern Telugu, and preserves the Greek’s generic, balanced gather/scatter antithesis. The footnote retains the legitimate alternative way Telugu may express the substantival participles.
