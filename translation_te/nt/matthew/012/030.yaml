id: MAT.12.30
reference: Matthew 12:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: te
  text: నాతో ఉండనివాడు నాకు విరోధంగా ఉన్నాడు; నాతో కలిసి కూడగట్టనివాడు చెదరగొడతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాతో ఉండని ఎవరైనా నాకు విరోధంగా ఉంటారు; నాతో కలిసి కూడగట్టని ఎవరైనా చెదరగొడతారు.”
    reason: గ్రీకులో ఆర్టికల్‌తో వచ్చిన కృదంతాలను సాధారణ ఏకవచనంగా లేదా తెలుగులో సహజమైన ‘ఎవరైనా’ నిర్మాణంతో వ్యక్తపరచవచ్చు.
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: లేనివాడు
  rationale: ఆర్టికల్‌తో కూడిన కృదంతం ఒక వ్యక్తిని సాధారణ ఏకవచనంలో సూచిస్తుంది. ‘లేనివాడు’ సహజమైన తెలుగులో ఆ లక్షణాత్మక భావాన్ని నిలుపుతుంది.
- source_word: μετ’ ἐμοῦ
  choice: నాతో
  rationale: μετά + షష్ఠీ విభక్తి సహవాసం లేదా అనుబంధాన్ని సూచిస్తుంది. ‘నాతో’ అనేది నేరుగా, సహజంగా ఉండి యేసుతో అనుసంధాన భావాన్ని నిలుపుతుంది.
- source_word: κατ’ ἐμοῦ
  choice: నాకు విరోధంగా
  rationale: κατά + షష్ఠీ విభక్తి ఇక్కడ వ్యతిరేకతను సూచిస్తుంది. ‘నాకు విరోధంగా’ ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: συνάγων
  choice: సమకూర్చనివాడు
  rationale: పదం కూడగట్టడం లేదా ఒకచోట చేర్చడం అనే భావాన్ని ఇస్తుంది. ‘సమకూర్చు’ పంట లేదా మందకు సంబంధించిన సాధ్యమైన రూపకాన్ని అతిగా నిర్దిష్టం చేయకుండా వ్యతిరేక సమాంతరతను నిలుపుతుంది.
- source_word: σκορπίζει
  choice: చెదరగొడుతున్నాడు
  rationale: ఈ క్రియ చెదరగొట్టడం లేదా చెల్లాచెదురు చేయడం అని అర్థం. ‘సమకూర్చు’కు సహజమైన వ్యతిరేక పదంగా ఉండి, కర్త వల్ల కలిగే చెదరగొట్టే చర్యను తెలియజేస్తుంది.
- source_word: καὶ
  choice: ;
  rationale: గ్రీకు καὶ రెండు సమాంతర వాక్యాలను కలుపుతుంది. తెలుగులో అర్ధవిరామం సహజమైన సమన్వయాన్ని ఇస్తూ, రెండవ వాక్యం మొదటిదానికి సమాంతర విస్తరణ అని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: యేసుతో ఉండటం లేదా ఆయనకు విరోధంగా ఉండటం అనే సంపూర్ణ వైరుధ్యం
  choice: మధ్యస్థ స్థితిని సూచించకుండా, యేసుతో లేనివాడు ఆయనకు విరోధంగా ఉన్నాడనే కఠిన వైరుధ్యాన్ని యథాతథంగా ఉంచడం.
  alternative: వైరుధ్యాన్ని తగ్గించే విధంగా ‘నా పక్షాన లేనివాడు’ వంటి వివరణాత్మక రూపం.
  rationale: గ్రీకు పాఠంలో ఉపశమన పదాలు లేకుండా రెండు స్పష్టమైన సమాంతర ప్రకటనలు ఉన్నాయి. అనవసర సిద్ధాంత నిర్ధారణలు జోడించకుండా ఆ వేదాంత ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన, సంక్షిప్తమైన శైలి. గ్రీకు వాక్యంలోని సమాంతర నిర్మాణం, వర్తమాన క్రియల కొనసాగుతున్న భావం, మరియు కఠినమైన వ్యతిరేకత నిలుపబడ్డాయి.
