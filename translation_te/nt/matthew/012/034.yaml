review_pass:
  verdict: revise
  source_fidelity: The principal clauses and the rebuke are accurately represented. However, ‘హృదయంలో నిండిపొర్లేదానినే నోరు పలుకుతుంది’ makes ‘దానిని’ the direct object of ‘పలుకుతుంది’ (‘the mouth speaks that very thing’), whereas the Greek states that the mouth speaks from/out of the heart’s abundance. The source relationship should be expressed with ‘నుండి/నుంచే.’
  naturalness: The address, rhetorical question, and register are natural modern standard Telugu. The final clause in the draft is grammatically and idiomatically strained because ‘నిండిపొర్లేదానినే’ is not a natural form here and obscures the source relation. ‘హృదయంలోని సమృద్ధి నుండే’ is clear and suitably concise.
  terminology: ‘విషసర్పాల సంతానమా,’ ‘దుష్టులై ఉండి,’ ‘హృదయం,’ and ‘నోరు పలుకుతుంది’ appropriately preserve the metaphorical and moral force of the Greek without doctrinal expansion. The lexical-alternative footnotes remain appropriate and their anchors correspond to the relevant expressions.
  issues:
  - severity: medium
    issue: The final clause changes the Greek source relation into a direct-object construction.
    rationale: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας means ‘for from/out of the abundance of the heart.’ The draft’s ‘...దానినే నోరు పలుకుతుంది’ uses the accusative-emphatic form ‘దానినే,’ suggesting that the mouth speaks the overflowing thing itself. Revising to ‘హృదయంలోని సమృద్ధి నుండే నోరు పలుకుతుంది’ restores the intended ‘from’ relation.
  revised_text: విషసర్పాల సంతానమా![a] మీరు దుష్టులై ఉండి మంచివి ఎలా మాట్లాడగలరు? ఎందుకంటే హృదయంలోని సమృద్ధి నుండే[b] నోరు పలుకుతుంది.
