  to: విషసర్పాల సంతానమా![a] మీరు దుష్టులై ఉండి మంచివి ఎలా మాట్లాడగలరు? ఎందుకంటే హృదయంలోని సమృద్ధి నుండే[b] నోరు పలుకుతుంది.
