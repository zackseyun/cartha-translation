id: MAT.12.34
reference: Matthew 12:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: te
  text: విషసర్పాల సంతానమా![a] మీరు దుష్టులై ఉండి మంచివి ఎలా మాట్లాడగలరు? ఎందుకంటే హృదయంలోని సమృద్ధి నుండే[b] నోరు పలుకుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విషసర్పాల పుట్టా!’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘హృదయంలో సమృద్ధిగా ఉన్నదానినుండే.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: విషసర్పాల సంతానమా
  rationale: γέννημα అనేది పుట్టినది లేదా సంతానం అనే భావాన్ని ఇస్తుంది; ἐχιδνῶν విషసర్పాలను సూచిస్తుంది. సంబోధనలోని తీవ్రతను, వంశం/స్వభావం అనే రూపకాన్ని ఈ ఎంపిక సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πῶς δύνασθε
  choice: ఎలా మాట్లాడగలరు?
  rationale: ఇది సామర్థ్యాన్ని ప్రశ్నించే అలంకారిక ప్రశ్న. తెలుగులో ‘ఎలా ... గలరు?’ ఆ అసాధ్యతా భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀγαθὰ λαλεῖν
  choice: మంచివి మాట్లాడగలరు
  rationale: ἀγαθά నపుంసక బహువచన నామీకృత విశేషణంగా ‘మంచివి’ అని అర్థమిస్తుంది; ‘మంచి మాటలు’ అని స్పష్టీకరించకుండా మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: πονηροὶ ὄντες
  choice: మీరు దుష్టులై ఉండి
  rationale: πονηροίలోని నైతిక తీవ్రతను ‘దుష్టులు’ నిలుపుతుంది; participial constructionను ‘అయి ఉండి’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: ఎందుకంటే హృదయంలో నిండిపొర్లేదానినే
  rationale: περίσσευμα సమృద్ధి, మిగులు, పొంగిపొర్లడం అనే భావాలను కలిగి ఉంది. ‘నిండిపొర్లేది’ అంతరంగపు నిండుదల బయటకు వ్యక్తమయ్యే రూపకాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τὸ στόμα λαλεῖ
  choice: నోరు పలుకుతుంది
  rationale: మూలంలోని కర్త-క్రియ నిర్మాణాన్ని నిలుపుతూ, తెలుగులో గంభీరంగా మరియు సహజంగా వినిపించే ‘పలుకుతుంది’ను ఎంచుకున్నాం.
theological_decisions:
- issue: ‘హృదయం’ అనే రూపకం
  choice: హృదయం
  alternative: అంతరంగం; మనసు
  rationale: καρδία కేవలం భావోద్వేగాలను కాక ఆలోచన, సంకల్పం, నైతిక స్వభావం సహా అంతరంగ వ్యక్తిని సూచించగలదు. ‘హృదయం’ అనే బైబిలు రూపకాన్ని నిలుపడం దాని అర్థాన్ని అనవసరంగా కుదించదు.
- issue: πονηροὶ ὄντεςలోని నైతిక నిర్ధారణ
  choice: దుష్టులై ఉండి
  alternative: చెడ్డవారై ఉండి
  rationale: ఇక్కడ యేసు కేవలం నాసిరకమైన స్థితిని కాక నైతిక చెడును గట్టిగా ఎత్తిచూపుతున్నాడు. ‘దుష్టులు’ ఆ తీవ్రతను మృదువుపరచకుండా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన మందలింపు ధోరణిని నిలిపాం. ‘విషసర్పాలు,’ ‘హృదయం,’ ‘నోరు పలుకుతుంది’ అనే రూపకాలను వ్యాఖ్యానించి మార్చకుండా భద్రపరిచాం.
