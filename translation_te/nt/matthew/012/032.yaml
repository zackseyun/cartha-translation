  source_fidelity: మూల గ్రీకు వాక్యంలోని సాధారణ షరతు, ‘మనుష్యకుమారుడు’ అనే బిరుదు, పరిశుద్ధాత్మకు వ్యతిరేకంగా మాట్లాడడం, అలాగే ప్రస్తుత మరియు రాబోయే యుగాల కాలవ్యత్యాసం ముసాయిదాలో సరిగానే ఉన్నాయి. అయితే ‘అది క్షమించబడుతుంది/క్షమించబడదు’లోని ‘అది’కి తెలుగులో స్పష్టమైన సూచ్యపదం లేకపోవడం వల్ల వాక్యం కొంత అసహజంగా, సందిగ్ధంగా ఉంది. గ్రీకులోని కర్మణి నిర్మాణం, దత్తివాచక వ్యక్తిసంబంధం తెలుగులో ‘అతనికి క్షమించబడుతుంది’ ద్వారా మరింత సహజంగా నిలుస్తాయి.
