id: MAT.12.32
reference: Matthew 12:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: te
  text: మనుష్యకుమారునికి వ్యతిరేకంగా ఒక మాట మాట్లాడే ఎవరికైనా అతనికి క్షమించబడుతుంది; కానీ పరిశుద్ధాత్మకు వ్యతిరేకంగా మాట్లాడే ఎవరికైనా అతనికి క్షమించబడదు—ఈ యుగంలోనూ కాదు, రాబోయే యుగంలోనూ కాదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా “రాబోయేదానిలోనూ కాదు” అని ఉంది; ముందటి పదబంధంలోని “యుగం” ఇక్కడ భావించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: ఎవరైనా ... కానీ ... ఎవరైనా
  rationale: ఈ నిర్మాణం నిర్దిష్ట వ్యక్తిని కాక, ఎవరికైనా వర్తించే సాధారణ షరతును తెలియజేస్తుంది. తెలుగు వాక్యంలో ‘ఎవరైనా’ ఆ విస్తృత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: εἴπῃ λόγον
  choice: ఒక మాట మాట్లాడే
  rationale: λόγον అనే పదం స్పష్టంగా ఉన్నందున ‘ఒక మాట’ను నిలిపి, λέγω భావాన్ని ఆధునిక తెలుగులో సహజమైన ‘మాట్లాడు’తో వ్యక్తపరిచాం.
- source_word: κατὰ
  choice: విరోధంగా
  rationale: ఇక్కడ κατά షష్ఠీ విభక్తితో కలిసి ఒకరికి వ్యతిరేకంగా ఉద్దేశించిన మాటను సూచిస్తుంది; ‘విరోధంగా’ ఆ ప్రతికూల దిశను స్పష్టంగా తెలియజేస్తుంది.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: ఇది స్థిరమైన బిరుదు; గ్రీకు పదరూపాన్నీ దాని మెస్సీయ సంబంధిత ప్రతిధ్వనినీ అనవసర వివరణ లేకుండా నిలుపుతుంది.
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: అది క్షమించబడుతుంది / అది క్షమించబడదు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, క్షమించబడేది పలికిన అపరాధమేనని సందర్భానుసారంగా ‘అది’ ద్వారా తెలియజేస్తుంది. ‘ఎవరికైనా’తో వ్యక్తి సంబంధం కూడా స్పష్టంగా ఉంటుంది.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: పరిశుద్ధాత్మ
  rationale: ఇది ఆధునిక ప్రామాణిక తెలుగులో స్థిరపడిన, గౌరవప్రదమైన బిరుదు.
- source_word: αἰών
  choice: యుగం
  rationale: ఇక్కడ భావం స్థలసంబంధమైన ‘లోకం’ కాదు, కాలసంబంధమైన ప్రస్తుత యుగం మరియు రాబోయే యుగం మధ్య వ్యత్యాసం. అందువల్ల ‘యుగం’ మూలభావాన్ని కచ్చితంగా ఇస్తుంది.
- source_word: ἐν τῷ μέλλοντι
  choice: రాబోయే యుగంలో
  rationale: గ్రీకులో ‘రాబోయేదానిలో’ అని సంక్షిప్తంగా ఉండి, ముందున్న αἰών (‘యుగం’) భావం ఇక్కడ గ్రహించబడుతుంది. తెలుగులో స్పష్టత కోసం ఆ నామవాచకాన్ని పునరుక్తం చేశాం.
theological_decisions:
- issue: αἰών / μέλλων కాల వ్యత్యాసం
  choice: ఈ యుగంలోనూ కాదు, రాబోయే యుగంలోనూ కాదు
  alternative: ఈ లోకంలోనూ కాదు, రాబోయే లోకంలోనూ కాదు
  rationale: మూలపాఠం రెండు కాలయుగాలను వ్యత్యాసపరుస్తుంది; రెండు స్థలాలనో లోకాలనో కాదు. ‘యుగం’ ఎటువంటి ప్రత్యేక అంత్యకాల సిద్ధాంతాన్ని చేర్చకుండా ఆ కాలసంబంధ భావాన్ని నిలుపుతుంది.
- issue: పరిశుద్ధాత్మకు విరోధంగా మాట్లాడే అపరాధ స్వభావం
  choice: వచనంలో ఉన్న హెచ్చరికను మాత్రమే అనువదించి, అపరాధానికి తరువాతి సిద్ధాంతపరమైన నిర్వచనం జోడించలేదు
  alternative: దీనిని యేసు చేసిన భూతవిమోచనలపై వచ్చిన ఒక ప్రత్యేక చారిత్రక ఆరోపణగా లేదా అంతిమ పశ్చాత్తాపరాహిత్యంగా అనువాదంలోనే నిర్వచించడం
  rationale: ఈ వచనం పరిణామాన్ని స్పష్టంగా చెబుతుంది గాని అపరాధాన్ని మరింత సిద్ధాంతపరంగా నిర్వచించదు. అందువల్ల అనువాదం ఆ ఉద్దేశపూర్వక పరిమితినీ theological tensionనీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉండి, హెచ్చరికకు తగిన గంభీరతను నిలుపుతుంది. రెండు భాగాల్లో సమాంతర నిర్మాణం ఉంచబడింది; అనవసరమైన మతశాఖా పదజాలం చేర్చబడలేదు.
