id: MAT.12.44
reference: Matthew 12:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: te
  text: అప్పుడు అది, ‘నేను బయటికి వచ్చిన నా ఇంటికే తిరిగి వెళ్తాను’ అని అంటుంది. వచ్చి, దానిని నివాసి లేకుండా[a], ఊడ్చబడి, క్రమంగా అమర్చబడి[b] ఉన్నట్లు చూస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఖాళీగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అలంకరించబడి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε λέγει
  choice: అప్పుడు అది … అని అంటుంది
  rationale: τότε యొక్క కాలక్రమ భావాన్ని ‘అప్పుడు’ సహజంగా తెలియజేస్తుంది. λέγει వర్తమానకాలంలోని సజీవ కథనశైలిని ‘అంటుంది’గా నిలుపుతుంది; మునుపటి సందర్భంలోని అపవిత్రాత్మే కర్త కాబట్టి ‘అది’ వాడబడింది.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: ఆ నా ఇంటికి తిరిగి వెళ్తాను
  rationale: ἐπιστρέψωలోని తిరిగి వెళ్లే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ఆత్మ చెప్పే ‘నా ఇల్లు’ అనే స్వామ్యవాదనను యథాతథంగా ఉంచుతుంది.
- source_word: ὅθεν ἐξῆλθον
  choice: నేను ఎక్కడినుంచి బయటికి వచ్చానో
  rationale: ὅθενలోని ‘ఎక్కడినుంచి’ భావాన్నీ, ἐξῆλθονలోని బయటికి రావడం అనే స్పష్టమైన దృశ్యాన్నీ నిలుపుతుంది.
- source_word: ἐλθὸν εὑρίσκει
  choice: అక్కడికి వచ్చినప్పుడు … ఉండడం చూస్తుంది
  rationale: ముందుగా జరిగిన ἐλθὸν చర్యను కాలవాచక ఉపవాక్యంగా సహజీకరించి, εὑρίσκειలోని సజీవ వర్తమాన కథనాన్ని ‘చూస్తుంది’గా అందిస్తుంది.
- source_word: σχολάζοντα
  choice: ఖాళీగా
  rationale: ఇంటి సందర్భంలో σχολάζοντα అంటే ఎవరూ నివసించకుండా లేదా ఆక్రమించకుండా ఖాళీగా ఉండడం. సాధారణ పాఠకులకు ‘ఖాళీగా’ సహజమైనది; ‘ఎవరూ లేకుండా’ అనే సాధ్యమైన సూక్ష్మార్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: σεσαρωμένον
  choice: ఊడ్చబడి
  rationale: σαρόω యొక్క సంపూర్ణ కర్మణి రూపం, ఊడ్చడం పూర్తై ఆ స్థితిలో ఉన్న ఇంటిని సూచిస్తుంది. ‘ఊడ్చబడి’ ఆ ఫలితస్థితిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: κεκοσμημένον
  choice: క్రమంగా అమర్చబడి
  rationale: κοσμέωకు క్రమపరచడం, అమర్చడం, అలంకరించడం అనే అర్థాలు ఉన్నాయి. సందర్భంలో ‘క్రమంగా అమర్చబడి’ అలంకరణ భావాన్ని అతిగా ముందుకు తేవకుండా ఇంటి సక్రమ స్థితిని తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఇల్లు’ అనే రూపకపు భావం
  choice: మూలంలోని ‘నా ఇల్లు’ అనే దృశ్యాన్ని ప్రధాన పాఠ్యంలో అలాగే ఉంచడం
  alternative: నేను విడిచివచ్చిన వ్యక్తి దగ్గరకు తిరిగి వెళ్తాను
  rationale: సందర్భంలో ఇల్లు ఒక వ్యక్తిని సూచించినప్పటికీ, ఈ వచనం οἶκος అనే రూపకాన్నే వాడుతుంది. దానిని ‘వ్యక్తి’గా విప్పి చెప్పడం మూలపాఠ్యపు దృశ్యాన్ని మరియు దాని ఉద్దేశపూర్వక రూపకత్వాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథనశైలి వాడబడింది. గ్రీకు పాఠ్యంలోని సజీవ వర్తమానకాలం, ‘నా ఇల్లు’ అనే రూపకం, మూడు ఫలితస్థితులు నిలుపబడ్డాయి.
