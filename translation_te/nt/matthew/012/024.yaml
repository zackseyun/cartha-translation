    text: 'బయెల్జెబూలు: సంప్రదాయ రూపం ‘బయెల్జెబూబు.’'
    reason: alternative_reading
  revision_rationale: The revision clarifies the negated ‘except by’ construction, uses a natural finite Telugu verb for the Pharisees’ assertion, and anchors the alternative-name footnote at the proper name. It does not alter the accusation’s meaning or add theological interpretation.
