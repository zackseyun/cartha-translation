revisions:
- from: అయితే పరిసయ్యులు అది విని, “ఇతడు దయ్యాల అధిపతియైన బయెల్జెబూలు శక్తితో తప్ప దయ్యాలను వెళ్లగొట్టడం లేదు” అన్నారు.[a]
  to: అయితే, పరిసయ్యులు అది విని, “ఇతడు దయ్యాల అధిపతి బయెల్జెబూలు[a] ద్వారా తప్ప దయ్యాలను వెళ్లగొట్టడు” అన్నారు.
