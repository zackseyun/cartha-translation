id: MAT.12.24
reference: Matthew 12:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: te
  text: అయితే, పరిసయ్యులు అది విని, “ఇతడు దయ్యాల అధిపతి బయెల్జెబూలు[a] ద్వారా తప్ప దయ్యాలను వెళ్లగొట్టడు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'బయెల్జెబూలు: సంప్రదాయ రూపం ‘బయెల్జెబూబు.’'
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వచనంలోని ప్రజల స్పందనకు పరిసయ్యుల మాటలను వ్యతిరేకంగా నిలిపే అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀκούσαντες
  choice: అది విని
  rationale: అనిశ్చిత భూతకాల అసమాపక క్రియను కాలార్థకంగా అనువదించి, సందర్భంలో సూచితమైన విషయాన్ని ‘అది’తో తెలిపింది.
- source_word: Οὗτος
  choice: ఇతడు
  rationale: సాధారణ ‘అతడు’ కంటే సందర్భంలోని నిరసనాత్మక, కొంత తృణీకార ధ్వనిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: దయ్యాలను వెళ్లగొట్టడం
  rationale: భూతవైద్య సందర్భంలో ‘బయటకు తోలడం’ అనే మూలభావాన్ని సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా అందిస్తుంది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: ఆరోపణలో పేర్కొన్న ఏకైక సాధనాన్ని లేదా ఆధారాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: బయెల్జెబూలు శక్తితో
  rationale: ఇక్కడ ἐν సాధనం లేదా శక్తిని సూచిస్తుంది; ‘శక్తితో’ అనడం ఆరోపణ స్వభావాన్ని తెలుగులో స్పష్టం చేస్తుంది, అయితే వ్యక్తి పేరును మూలరూపానుసారంగా లిప్యంతరీకరిస్తుంది.
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: దయ్యాల అధిపతియైన
  rationale: ἄρχων సూచించే అధికారాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో ‘అధిపతి’గా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Οὗτος లోని విరోధపూర్వక సూచన
  choice: ఇతడు
  alternative: ఈ మనిషి / అతడు
  rationale: పరిసయ్యుల తృణీకార ధ్వనిని అతిశయింపజేయకుండా నిలుపుతుంది; యేసు గురించి అదనపు సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చదు.
- issue: Βεελζεβοὺλ అనే పేరు
  choice: బయెల్జెబూలు
  alternative: బయెల్జెబూబు
  rationale: SBLGNT గ్రీకు పాఠంలోని Βεελζεβοὺλ రూపాన్ని ప్రధాన పాఠ్యంలో అనుసరిస్తూ, సంప్రదాయ రూపాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: ἐν ద్వారా సూచితమైన సాధనం
  choice: శక్తితో
  alternative: ద్వారా / వలన
  rationale: పరిసయ్యులు దయ్యాలను వెళ్లగొట్టే శక్తి బయెల్జెబూలు నుండి వస్తోందని ఆరోపిస్తున్న భావాన్ని స్పష్టం చేస్తుంది; బయెల్జెబూలుతో ఏకత్వం వంటి అదనపు భావాన్ని మోపడాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే పరిసయ్యుల విరోధపూర్వక స్వరం మరియు మూలపాఠంలోని అధికార/సాధన సంబంధం నిలుపబడ్డాయి. పాదసూచిక గుర్తు ప్రధాన వాక్యాంతంలో ఉంచబడింది.
