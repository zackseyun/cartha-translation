review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the contrast (δὲ), the temporal participle, the dismissive demonstrative, the casting out of demons, and Beelzebul's designation as ruler of demons. However, the negated-exception construction is less clear in its current Telugu word order. Placing ‘తప్ప’ immediately after ‘శక్తితో’ before the infinitival nominal makes the scope momentarily awkward. A direct finite verb and a clearer placement of the exception more closely convey οὐκ ... εἰ μὴ.
  naturalness: ‘దయ్యాలను వెళ్లగొట్టడం లేదు’ is understandable, but a finite verbal form, ‘వెళ్లగొట్టడు,’ is more idiomatic in this reported accusation. The revised ordering is natural modern standard Telugu and makes the exclusive alleged means clear.
  terminology: ‘పరిసయ్యులు,’ ‘దయ్యాలు,’ ‘అధిపతి,’ and ‘బయెల్జెబూలు’ are suitable. ‘ద్వారా’ renders the instrumental/agency sense of ἐν without adding an explicit ‘power’ that is not stated in Greek. The traditional alternate name remains appropriately footnoted.
  issues:
  - severity: low
    issue: The exception construction is awkwardly ordered.
    rationale: ‘బయెల్జెబూలు శక్తితో తప్ప దయ్యాలను వెళ్లగొట్టడం లేదు’ is comprehensible, but the placement of ‘తప్ప’ can momentarily obscure that Beelzebul is the sole alleged means. Reordering it as ‘బయెల్జెబూలు ద్వారా తప్ప ... వెళ్లగొట్టడు’ gives the Greek οὐκ ... εἰ μὴ construction a clearer Telugu equivalent.
  - severity: low
    issue: Footnote marker is placed at the sentence end rather than directly after the name it explains.
    rationale: The note concerns ‘బయెల్జెబూలు’; anchoring it immediately after that name improves reference clarity while retaining the same footnote content.
  revised_text: అయితే, పరిసయ్యులు అది విని, “ఇతడు దయ్యాల అధిపతి బయెల్జెబూలు[a] ద్వారా తప్ప దయ్యాలను వెళ్లగొట్టడు” అన్నారు.
  revised_footnotes:
