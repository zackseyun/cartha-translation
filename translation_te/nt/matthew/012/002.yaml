id: MAT.12.2
reference: Matthew 12:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: te
  text: అయితే పరిసయ్యులు అది చూసి ఆయనతో, “చూడండి, మీ శిష్యులు విశ్రాంతిదినాన చేయకూడని పని చేస్తున్నారు[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్రాంతిదినాన చట్టబద్ధం కాని పని చేస్తున్నారు.”
    reason: ἔξεστιν అనుమతి/చట్టబద్ధత అనే భావపరిధిలో వాడబడింది. ఈ ప్రత్యామ్నాయం ఆ చట్టపరమైన నుడికారాన్ని చూపిస్తూ, విశ్రాంతిదినానికి సంబంధించిన కాలసూచనను కూడా నిలుపుతుంది.
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి కథనంలోని చర్యకు పరిసయ్యుల అభ్యంతరాన్ని వ్యతిరేక మలుపుగా సహజంగా సూచిస్తుంది.
- source_word: ἰδόντες
  choice: అది చూసి
  rationale: అయోరిస్ట్ కృదంతాన్ని తెలుగులో సహజమైన కాలసంబంధ ఉపవాక్యంగా అందించింది. ‘అది’ అనేది ముందటి వచనంలో శిష్యులు చేసిన పనిని సందర్భం నుంచి సూచిస్తుంది.
- source_word: εἶπαν αὐτῷ
  choice: ఆయనతో ... అన్నారు
  rationale: గ్రీకు వాక్యంలోని సాధారణ, తటస్థమైన సంభాషణ సూత్రాన్ని సహజమైన తెలుగు ప్రయోగంతో అందిస్తుంది.
- source_word: Ἰδοὺ
  choice: చూడండి
  rationale: ఆరోపణ వైపు వెంటనే దృష్టి మళ్లించే ఆజ్ఞార్థక ఉద్ఘాటనను ఆధునిక, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: μαθηταί
  choice: శిష్యులు
  rationale: బోధకుడు–శిష్యుడు సంబంధాన్ని కాపాడే, సువార్తల సందర్భంలో స్థిరంగా వాడే సరైన పదం.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: చేయడానికి ... చేస్తున్నారు
  rationale: ποιέω పదం పునరావృతిని సాధ్యమైనంతవరకు నిలుపుతూ తెలుగులో సహజమైన వాక్య నిర్మాణాన్ని ఇస్తుంది.
- source_word: ὃ οὐκ ἔξεστιν
  choice: అనుమతి లేనిది
  rationale: ἔξεστινలోని అనుమతి లేదా చట్టబద్ధత భావాన్ని కాపాడుతుంది; ఆ అనుమతికి ఖచ్చితమైన మూలం ఏమిటో అనువాదంలో నిర్ణయించదు.
- source_word: ἐν σαββάτῳ
  choice: విశ్రాంతిదినాన
  rationale: యూదుల సబ్బాతు దినాన్ని సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదప్రయోగం; కాలసంబంధ ἐν భావాన్ని ‘-న’ విభక్తితో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: పరిసయ్యుల అభ్యంతరం ఏ విధమైన నియమంపై ఆధారపడిందన్నది
  choice: ‘అనుమతి లేనిది’ అని చట్టపరమైన లేదా అనుమతి సంబంధ భావంలో తటస్థంగా అనువదించడం
  alternative: ‘ధర్మశాస్త్ర విరుద్ధమైనది’ లేదా ‘ఆచారానికి విరుద్ధమైనది’ అని నిర్దిష్టీకరించడం
  rationale: గ్రీకు వాక్యం అభ్యంతరానికి ఆధారం లిఖిత ధర్మశాస్త్రమా, పరిసయ్యుల వ్యాఖ్యాన సంప్రదాయమా అని తేల్చదు. అందువల్ల ఆ కథనాత్మక, ధార్మిక ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే సువార్త కథనానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. ‘ఇదిగో’ కంటే సంభాషణలో సహజమైన ‘చూడండి’ ఎంచుకోబడింది.
