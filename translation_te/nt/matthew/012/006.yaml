id: MAT.12.6
reference: Matthew 12:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: te
  text: 'అయితే నేను మీతో చెబుతున్నాను: దేవాలయం కంటే గొప్పది ఇక్కడ ఉంది[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవాలయం కంటే గొప్పవాడు ఇక్కడ ఉన్నాడు,” లేక “దేవాలయం కంటే గొప్ప వ్యక్తి ఇక్కడ ఉన్నాడు.” గ్రీకులో ‘గొప్పది’ అనే నపుంసక రూపం ఉంది; అది దేనిని లేదా ఎవరిని సూచిస్తుందో వ్యాకరణపరంగా స్పష్టంగా చెప్పలేదు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఈ స్థలంలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: అయితే నేను మీతో చెబుతున్నాను
  rationale: λέγω ... ὑμῖν నేరుగా సంబోధించి చెప్పే సాధారణ ప్రయోగం. δέ మునుపటి వాదనతో స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ ఆధునిక తెలుగులో సహజంగా దాన్ని వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: తెలుగులో ద్విబిందువు ద్వారా భావం వ్యక్తీకరణ
  rationale: ὅτι యేసు చెప్పబోయే విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘అని’తో వాక్యక్రమాన్ని మార్చడం కంటే ద్విబిందువు నేర వాక్యాన్ని స్పష్టంగా, సహజంగా ఉంచుతుంది.
- source_word: τοῦ ἱεροῦ
  choice: దేవాలయం కంటే
  rationale: ἱερόν సాధారణంగా అంతర్గర్భాలయాన్ని మాత్రమే కాక దేవాలయ సముదాయాన్ని సూచిస్తుంది. ఈ సందర్భంలో ‘దేవాలయం’ సహజమైన, సరైన సమానార్థకం.
- source_word: μεῖζόν
  choice: గొప్పది
  rationale: ఇది నపుంసక ఏకవచన తులనాత్మక రూపం; సూచిత విషయం లేదా వ్యక్తి స్పష్టంగా చెప్పబడలేదు. ‘గొప్పది’ ఆ వ్యాకరణపరమైన అనిశ్చితిని తెలుగులో సాధ్యమైనంతవరకు కాపాడుతుంది.
- source_word: ἐστιν
  choice: ఉంది
  rationale: సాధారణ వర్తమాన అస్తిత్వార్థక క్రియ; తెలుగు వాక్యంలోని ‘గొప్పది’కి అనుగుణంగా ‘ఉంది’ వాడబడింది.
- source_word: ὧδε
  choice: ఇక్కడ
  rationale: స్థలాన్ని సూచించే ఈ క్రియావిశేషణానికి ‘ఇక్కడ’ సంక్షిప్తమైన, సహజమైన అనువాదం.
theological_decisions:
- issue: నపుంసక తులనాత్మక రూపమైన μεῖζόν సూచించే దాని గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘గొప్పది’ అని, సూచిత వ్యక్తి లేదా విషయాన్ని నిర్దిష్టంగా పేర్కొనకుండా అనువదించడం
  alternative: ‘దేవాలయం కంటే గొప్పవాడు ఇక్కడ ఉన్నాడు’ లేదా ‘దేవాలయం కంటే గొప్ప వ్యక్తి ఇక్కడ ఉన్నాడు’
  rationale: గ్రీకు పాఠ్యంలో పురుషలింగ రూపం కాక నపుంసక ఏకవచన రూపం ఉంది. సందర్భం యేసును, ఆయన అధికారాన్ని బలంగా సూచించినా, ప్రధాన పాఠ్యం సూచితార్థాన్ని మరీ నిర్దిష్టం చేయకుండా మూలంలోని వ్యాకరణపరమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘గొప్పది’ కొంత అసాధారణంగా వినిపించినా, మూలంలోని నపుంసక రూపం మరియు సూచితార్థ అనిశ్చితిని ఉద్దేశపూర్వకంగా కాపాడుతుంది; ప్రత్యామ్నాయ వ్యక్తివాచక పఠనాలు పాదటిప్పణిలో ఇవ్వబడ్డాయి.
