revisions:
- from: అయితే, గొర్రె కంటే మనిషి విలువ ఎంత ఎక్కువ! కాబట్టి సబ్బాతు దినాల్లో[a] మేలు చేయడం ధర్మసమ్మతమే.
  to: అలాంటప్పుడు, గొర్రె కంటే మనిషి విలువ ఎంత ఎక్కువ! కాబట్టి సబ్బాతు దినాల్లో[a] మేలు చేయడం ధర్మసమ్మతమే.
  rationale: The sole revision replaces the potentially adversative connector అయితే with the inferential, context-dependent అలాంటప్పుడు. The rest of the wording faithfully conveys the comparative worth of a human being over a sheep and the legal-ethical conclusion concerning doing good on the Sabbath. The plural Sabbath wording and its explanatory footnote are retained.
