id: MAT.12.12
reference: Matthew 12:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: te
  text: అలాంటప్పుడు, గొర్రె కంటే మనిషి విలువ ఎంత ఎక్కువ! కాబట్టి సబ్బాతు దినాల్లో[a] మేలు చేయడం ధర్మసమ్మతమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా సహజమైన నుడికారంగా, ‘సబ్బాతు దినాన.’ గ్రీకులో ‘సబ్బాతు దినాల్లో’ అని బహువచనం ఉంది; ఇది సబ్బాతు ఆచరణను సూచించే సాధారణ నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ
  choice: ఎంత ఎక్కువ
  rationale: తక్కువదాని నుండి ఎక్కువదానికి చేసే వాదనలో ఉన్న తులనాత్మక బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: అయితే
  rationale: ముందున్న గొర్రె ఉదాహరణనుండి తీసుకొనే నిర్ధారణను సూచిస్తూ, తెలుగు వాక్యప్రవాహంలో సహజంగా ఉంటుంది.
- source_word: διαφέρει
  choice: విలువ ... ఎక్కువ
  rationale: ఈ సందర్భంలో ఇది కేవలం భేదాన్ని కాక, గొర్రెతో పోలిస్తే మనిషికి ఉన్న అధిక విలువను సూచిస్తుంది.
- source_word: ἄνθρωπος
  choice: మనిషి
  rationale: ఏ మానవునికైనా వర్తించే ఏకవచన ప్రతినిధి ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: προβάτου
  choice: గొర్రె కంటే
  rationale: γενitive తులనను తెలుగులో సహజమైన ‘కంటే’ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ὥστε
  choice: కాబట్టి
  rationale: మునుపటి తులననుండి వచ్చే ముగింపును స్పష్టంగా సూచిస్తుంది.
- source_word: ἔξεστιν
  choice: ధర్మసమ్మతమే
  rationale: సబ్బాతు ఆచరణకు సంబంధించిన ధర్మశాస్త్ర వివాద సందర్భంలో, కేవలం అనుమతిని కాక న్యాయబద్ధతను తెలియజేస్తుంది.
- source_word: τοῖς σάββασιν
  choice: సబ్బాతు దినాల్లో
  rationale: గ్రీకులోని బహువచన రూపాన్ని కనిపించేలా ఉంచి, తెలుగు పాఠకులకు అర్థమయ్యే విధంగా ‘దినాలు’ అని స్పష్టం చేస్తుంది.
- source_word: καλῶς ποιεῖν
  choice: మేలు చేయడం
  rationale: ప్రయోజనకరమైన మంచి కార్యం చేయడాన్ని తెలిపే గ్రీకు నుడికారానికి సమీపమైన, సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: ἄνθρωπος యొక్క ప్రతినిధి ఏకవచనం
  choice: మనిషి
  alternative: ఒక వ్యక్తి / మానవుడు
  rationale: లింగాన్ని అనవసరంగా ప్రత్యేకించకుండా, గొర్రెతో పోల్చబడిన మానవుని సాధారణ విలువను ‘మనిషి’ సహజంగా తెలియజేస్తుంది.
- issue: సబ్బాతు బహువచన నుడికారం
  choice: సబ్బాతు దినాల్లో
  alternative: సబ్బాతు దినాన
  rationale: మూలంలోని బహువచనాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది సబ్బాతు ఆచరణను సూచించే సాధారణ నుడికారం కావచ్చని పాదటిప్పణిలో తెలియజేస్తుంది.
- issue: ἔξεστιν యొక్క ధర్మశాస్త్ర సంబంధ భావం
  choice: ధర్మసమ్మతమే
  alternative: అనుమతించబడింది
  rationale: సందర్భం సబ్బాతునాడు ఏది చేయడం ధర్మబద్ధమనే వివాదం కావడంతో, ‘ధర్మసమ్మతమే’ దాని న్యాయ-నైతిక భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ఆశ్చర్యార్థక చిహ్నం వాక్యంలోని వాదనాత్మక, ఉద్ఘాటనాత్మక బలాన్ని ప్రతిబింబిస్తుంది.
