review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents γάρ, the repeated possessive phrase, the future passive judicial contrast, and the evidential/basis sense of ἐκ. However, ‘నీతిమంతుడివని తీర్పు పొందుతావు’ can sound like a verdict about inherent moral righteousness and is less idiomatic than a direct forensic acquittal expression. ‘ఆధారంగానే’ also adds an exclusive emphasis not overtly expressed by ἐκ.
  naturalness: ‘నీ మాటలను బట్టి’ is a natural modern Telugu idiom for a judgment made on the basis of someone’s words. ‘నిర్దోషిగా తీర్పు పొందుతావు’ and ‘దోషిగా తీర్పు పొందుతావు’ are clear, balanced, and natural judicial expressions.
  terminology: The revision preserves the courtroom force and antithesis of δικαιωθήσῃ and καταδικασθήσῃ without importing a broader doctrinal formulation. A footnote retains ‘నీతిమంతునిగా తీర్పు పొందుతావు’ as a closer traditional/theological lexical alternative and explains the judicial sense.
  issues:
  - severity: medium
    issue: ‘నీతిమంతుడివని తీర్పు పొందుతావు’ is potentially moralizing and stylistically awkward in this judicial contrast.
    rationale: In this context δικαιόω denotes a favorable judicial verdict, contrasted directly with condemnation. ‘నిర్దోషిగా తీర్పు పొందుతావు’ states that forensic result naturally in Telugu.
  - severity: low
    issue: ‘ఆధారంగానే’ introduces an unnecessary exclusive particle.
    rationale: The Greek ἐκ marks basis or grounds, but does not itself explicitly say ‘on the basis of these alone.’ ‘నీ మాటలను బట్టి’ communicates the intended relation without extra emphasis.
  revised_text: ఎందుకంటే నీ మాటలను బట్టి నీవు నిర్దోషిగా తీర్పు పొందుతావు[a], మరియు నీ మాటలను బట్టి నీవు దోషిగా తీర్పు పొందుతావు.
