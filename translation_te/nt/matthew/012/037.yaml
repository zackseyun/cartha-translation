id: MAT.12.37
reference: Matthew 12:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: te
  text: ఎందుకంటే నీ మాటలను బట్టి నీవు నిర్దోషిగా తీర్పు పొందుతావు[a], మరియు నీ మాటలను బట్టి నీవు దోషిగా తీర్పు పొందుతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీతిమంతునిగా తీర్పు పొందుతావు’; లేదా, ‘సరైనవాడివని నిర్ధారించబడతావు.’ గ్రీకు క్రియకు న్యాయస్థాన సందర్భంలో ఒకరిని సరైన పక్షంలో ఉన్నవాడిగా ప్రకటించే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: ఆధారంగానే
  rationale: జనిటివ్‌తో ఉన్న ἐκ ఇక్కడ తీర్పుకు ఆధారం లేదా సాక్ష్యాన్ని సూచిస్తుంది. ‘ఆధారంగా’ అనే పదం ఈ న్యాయసంబంధ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘-నే’ మూలపాఠంలోని సమాంతర వాక్య నిర్మాణాన్ని బలపరుస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: γάρ ముందున్న హెచ్చరికకు కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది. ‘ఎందుకంటే’ ఆధునిక తెలుగులో ఈ అనుసంధానాన్ని స్పష్టంగా చూపుతుంది.
- source_word: λόγων
  choice: మాటలు
  rationale: ఇక్కడ λόγος బహువచనంలో పలికిన మాటలను సూచిస్తుంది. ‘మాటలు’ నేరుగా, సహజంగా ఉండి రెండు భాగాల్లోని పునరుక్తిని నిలుపుతుంది.
- source_word: σου
  choice: నీ
  rationale: సంబంధవాచక సర్వనామం రెండు చోట్లా ‘మాటలు’ను విశేషిస్తూ స్వామ్యాన్ని సూచిస్తుంది.
- source_word: δικαιωθήσῃ
  choice: నీతిమంతుడివని తీర్పు పొందుతావు
  rationale: δικαιόω యొక్క భవిష్యత్ కర్మణి రూపం, ఎదురుగా ఉన్న καταδικασθήσῃ వల్ల, న్యాయస్థాన సంబంధ అర్థాన్ని కలిగి ఉంది. ఈ అనువాదం ‘సరైనవాడిగా/నిర్దోషిగా ప్రకటించబడడం’ అనే భావాన్ని తెలియజేస్తూ, కేవలం వ్యక్తిగత నైతిక మార్పుగా అర్థమయ్యే ప్రమాదాన్ని తగ్గిస్తుంది.
- source_word: καταδικασθήσῃ
  choice: దోషివని తీర్పు పొందుతావు
  rationale: ఈ భవిష్యత్ కర్మణి క్రియ న్యాయపరమైన ఖండనను సూచించి δικαιωθήσῃకు ఉద్దేశపూర్వక విరుద్ధంగా నిలుస్తుంది. ‘దోషివని తీర్పు పొందడం’ ఆ న్యాయస్థాన వ్యత్యాసాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
theological_decisions:
- issue: మాటలు మరియు తీర్పు సందర్భంలో δικαιόω యొక్క న్యాయస్థాన సంబంధ భావం
  choice: ‘నీతిమంతుడివని తీర్పు పొందుతావు’ అని అనువదించి, ఒకరి మాటలు తీర్పులో ఆధారంగా నిలుస్తాయని తెలిపాం.
  alternative: ‘నిర్దోషివని తీర్పు పొందుతావు’ లేదా ‘నీవు సరైనవాడివని నిర్ధారించబడతావు’
  rationale: వెంటనే వచ్చే ‘దోషివని తీర్పు పొందుతావు’ అనే విరుద్ధ వాక్యం న్యాయస్థాన సందర్భాన్ని స్పష్టం చేస్తుంది. ఎంచుకున్న రూపం δικαιόω యొక్క విస్తృత బైబిలు పదసంబంధాన్ని కొంతవరకు నిలుపుతూ, ఈ ఒక్క వచనం చెప్పేదానికంటే విస్తృతమైన సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే న్యాయసంబంధ భాషను ఉపయోగించాం. గ్రీకులోని రెండు సమాంతర భాగాలు, ‘నీ మాటలు’ అనే పునరుక్తి, భవిష్యత్ కర్మణి భావం కాపాడబడ్డాయి.
