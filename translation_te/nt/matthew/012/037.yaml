revisions:
- from: ఎందుకంటే, నీ మాటల ఆధారంగానే నీవు నీతిమంతుడివని తీర్పు పొందుతావు[a]; నీ మాటల ఆధారంగానే నీవు దోషివని తీర్పు పొందుతావు.
  to: ఎందుకంటే నీ మాటలను బట్టి నీవు నిర్దోషిగా తీర్పు పొందుతావు[a], మరియు నీ మాటలను బట్టి నీవు దోషిగా తీర్పు పొందుతావు.
  rationale: The revised wording uses idiomatic Telugu judicial language for the paired future passives, retains the repeated ‘నీ మాటలను బట్టి’ parallelism, and expresses ἐκ as the basis for judgment without adding exclusivity. The footnote preserves the broader lexical range of δικαιόω and its forensic nuance.
