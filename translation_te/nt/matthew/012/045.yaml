id: MAT.12.45
reference: Matthew 12:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: te
  text: అప్పుడు అది వెళ్లి, తనకంటే మరింత దుష్టమైన మరో ఏడు ఆత్మలను తనతో తీసుకువెళ్తుంది[a]. అవి లోపలికి ప్రవేశించి అక్కడ నివసిస్తాయి. దాంతో ఆ మనిషి చివరి స్థితి మొదటి స్థితికంటే అధ్వాన్నమవుతుంది[b]. ఈ దుష్ట తరానికి కూడా అలాగే జరుగుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనకంటే ఎక్కువ దుష్టమైన వేరే ఏడు ఆత్మలను.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా, “ఆ మనిషి చివరి విషయాలు మొదటి వాటికంటే అధ్వాన్నమవుతాయి”; అంటే అతని చివరి స్థితి మునుపటి స్థితికంటే అధ్వాన్నంగా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε πορεύεται
  choice: అప్పుడు అది వెళ్లి
  rationale: τότε తరువాతి పరిణామాన్ని సూచిస్తుంది; చారిత్రక వర్తమానమైన πορεύεταιను తెలుగులో సహజమైన కథన క్రమంతో అనువదించాం.
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: తనతో తీసుకొస్తుంది
  rationale: వెంట తీసుకురావడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: మరో ఏడు ఆత్మలను
  rationale: ἕτερα మొదటి ఆత్మకు అదనంగా ఉన్న ఇతర ఆత్మలను సూచిస్తుంది; πνεύματαను మూలంలోని సాధారణ పదానికి అనుగుణంగా ‘ఆత్మలు’గా ఉంచాం.
- source_word: πονηρότερα ἑαυτοῦ
  choice: తనకంటే చెడ్డవైన
  rationale: తులనాత్మక నైతిక దుష్టత్వాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: అవి లోపలికి ప్రవేశించి అక్కడ నివసిస్తాయి
  rationale: కృదంతంలోని చర్యల క్రమాన్ని తెలుగులో సహజంగా తెలిపాం. ముద్రిత గ్రీకు పాఠంలో κατοικεῖ ఏకవచన రూపంలో ఉన్నప్పటికీ, సందర్భార్థం అక్కడ ఆ ఆత్మలు నివాసం ఏర్పరచుకోవడమే.
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: ఆ మనిషి చివరి స్థితి
  rationale: అక్షరార్థంగా ‘ఆ మనిషి చివరి విషయాలు’ అనే గ్రీకు నుడికారాన్ని దాని సందర్భార్థమైన చివరి పరిస్థితిగా అందించాం.
- source_word: χείρονα τῶν πρώτων
  choice: మొదటి స్థితికంటే అధ్వాన్నమవుతుంది
  rationale: చివరి పరిస్థితిని మునుపటి పరిస్థితితో పోల్చే భావాన్ని స్పష్టంగా వ్యక్తం చేయడానికి ‘స్థితి’ని పునరుక్తం చేశాం.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: ఈ దుష్ట తరం పరిస్థితి కూడా అలాగే ఉంటుంది
  rationale: ఉపమానాన్ని అప్పటి తరానికి వర్తింపజేసే భావాన్ని సహజమైన తెలుగులో స్పష్టంగా చూపిస్తుంది.
theological_decisions:
- issue: πνεύματα అనే దయ్యసంబంధ పదప్రయోగం
  choice: ఆత్మలు
  alternative: దయ్యాలు
  rationale: గ్రీకు మూలం ‘ఆత్మలు’ అనే పదాన్నే వాడుతుంది; సమీప సందర్భం అవి అపవిత్ర ఆత్మలని తెలియజేస్తుంది. కాబట్టి మరింత నిర్దిష్టమైన ‘దయ్యాలు’ అనే పదాన్ని ఈ వాక్యంలో చేర్చలేదు.
- issue: ἀνθρώπου యొక్క లింగ సూచన
  choice: ఆ మనిషి
  alternative: ఆ వ్యక్తి
  rationale: మూలంలోని ఏకవచన పుంలింగ ఉదాహరణను నిలుపుతూ, తెలుగులో సహజమైన ‘మనిషి’ని వాడాం.
- issue: చివరి స్థితి మరియు మొదటి స్థితి మధ్య పోలిక
  choice: చివరి స్థితి మొదటి స్థితికంటే అధ్వాన్నమవుతుంది
  alternative: చివరి విషయాలు మొదటి వాటికంటే చెడ్డవవుతాయి
  rationale: ఇది వ్యక్తి పరిస్థితిని సూచించే గ్రీకు నుడికారం; అసహజమైన అక్షరానువాదం కంటే అర్థాన్ని స్పష్టపరుస్తూ వేదాంతపరమైన అదనపు వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని అనుసరించాం. ‘నివసిస్తాయి,’ ‘అధ్వాన్నం,’ ‘దుష్ట తరం’ వంటి పదాలు మూలంలోని గంభీరతను నిలుపుతూ సహజంగా చదవబడేలా ఎంచుకున్నాం.
