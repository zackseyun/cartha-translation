id: MAT.12.31
reference: Matthew 12:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: te
  text: 'కాబట్టి నేను మీతో చెబుతున్నాను: ప్రతి పాపమూ, ప్రతి దైవదూషణా మనుషులకు క్షమించబడతాయి; అయితే ఆత్మను[a] దూషించడం క్షమించబడదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధాత్మను.” ఈ వచనంలోని గ్రీకు పాఠంలో “ఆత్మ” అని మాత్రమే ఉంది; సమీప సందర్భం పరిశుద్ధాత్మను సూచిస్తుంది.
    reason: మూలపాఠంలోని రూపాన్ని ప్రధాన పాఠంలో నిలుపుతూ, సందర్భం స్పష్టం చేసే పూర్తి సూచనను తెలియజేయడం.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: కాబట్టి
  rationale: ముందటి సందర్భం నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా కలుపుతుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, యేసు మాటలోని గంభీరతను నిలుపుతూ సహజమైన తెలుగు ప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: ప్రతి పాపమూ ప్రతి దైవదూషణా
  rationale: πᾶσα యొక్క విభజనాత్మక భావాన్ని రెండు ఏకవచన నామవాచకాలకూ స్పష్టంగా వర్తింపజేస్తుంది. βλασφημίαకు ఈ దైవసంబంధ సందర్భంలో ‘దైవదూషణ’ సాధారణ ‘దూషణ’కంటే నిర్దిష్టమైనది.
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: మనుషులకు ... క్షమించబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్నీ, క్షమాపణ పొందేవారిని సూచించే దత్తి విభక్తినీ కాపాడుతుంది; ‘మనుషులు’ ఇక్కడ స్త్రీపురుషులందరినీ సూచించే సాధారణ మానవ పదం.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: అయితే ఆత్మకు విరోధంగా చేసే దైవదూషణ మాత్రం
  rationale: τοῦ πνεύματοςను దూషణకు గురయ్యే వ్యక్తిని సూచించే objective genitiveగా తెలియజేస్తుంది. ‘మాత్రం’ ముందు వాక్యభాగంతో ఉన్న బలమైన వ్యత్యాసాన్ని సహజ తెలుగులో చూపుతుంది.
- source_word: οὐκ ἀφεθήσεται
  choice: క్షమించబడదు
  rationale: గ్రీకు భవిష్యత్ కర్మణి నిరాకరణను సంక్షిప్తంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πνεύματοςను ప్రధాన పాఠంలో ‘ఆత్మ’గా లేదా ‘పరిశుద్ధాత్మ’గా అనువదించాలా
  choice: ఆత్మ
  alternative: పరిశుద్ధాత్మ
  rationale: ఈ వచనంలోని గ్రీకు పాఠంలో ἁγίου (‘పరిశుద్ధ’) లేదు. సమీప సందర్భం పరిశుద్ధాత్మనే సూచిస్తున్నప్పటికీ, ప్రధాన పాఠం మూలంలోని సంక్షిప్త రూపాన్ని నిలుపుతుంది; స్పష్టీకరణను పాదసూచికలో ఇస్తుంది.
- issue: τοῦ πνεύματος అనే సంబంధ విభక్తి స్వామ్యాన్నా లేక దూషణకు గురయ్యే వ్యక్తినే సూచిస్తుందా
  choice: ఆత్మకు విరోధంగా చేసే దైవదూషణ
  alternative: ఆత్మ యొక్క దైవదూషణ
  rationale: సందర్భంలో ఆత్మ దూషణకు కర్త కాదు, గురయ్యే వ్యక్తి. అందువల్ల objective genitive భావాన్ని తెలుగులో స్పష్టంగా చూపించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని పాటించబడింది. ‘దైవదూషణ’ సాధారణ పాఠకునికి అర్థమయ్యే స్థిరమైన ధార్మిక పదం; ‘క్షమించబడుతుంది/క్షమించబడదు’ అనే సమాంతర నిర్మాణం మూలంలోని వ్యత్యాసాన్ని నిలుపుతుంది.
