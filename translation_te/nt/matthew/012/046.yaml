id: MAT.12.46
reference: Matthew 12:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: te
  text: ఆయన ఇంకా జనసమూహాలతో మాట్లాడుతుండగా, ఇదిగో, ఆయన తల్లి, ఆయన సహోదరులు[a] ఆయనతో మాట్లాడాలని కోరుతూ బయట నిలబడి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ἀδελφοί అనే పదాన్ని విస్తృతార్థంలో సన్నిహిత బంధువులను సూచించేదిగా తీసుకుంటే, ‘తోబుట్టువులు’ లేదా ‘సన్నిహిత బంధువులు.’ గ్రీకు పదం ఇక్కడ పుంలింగ బహువచనంలో ఉన్నందున ప్రధాన పాఠంలో ‘సహోదరులు’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: ఆయన ఇంకా ... మాట్లాడుతుండగా
  rationale: ἔτι కొనసాగుతున్న చర్యను సూచిస్తుంది; δέ స్వల్ప కథన మార్పును తెలియజేస్తుంది; genitive absolute సమకాలీన చర్యను వ్యక్తం చేస్తుంది. ఈ తెలుగు నిర్మాణం కాలసంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: τοῖς ὄχλοις
  choice: జనసమూహాలతో
  rationale: గ్రీకులో బహువచనం ఉన్నందున ‘జనసమూహాలు’ అని సంఖ్యను నిలిపి, తెలుగు వాడుకకు అనుగుణంగా ‘మాట్లాడుట’తో ‘తో’ విభక్తిని వాడాం.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కొత్త పరిణామంపై పాఠకుని దృష్టిని ఆకర్షించే సజీవ కథన సూచికగా ἰδού యొక్క బలాన్ని నిలుపుతుంది.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: ఆయన తల్లి, ఆయన సహోదరులు
  rationale: సందర్భానుసారంగా తల్లికి కూడా స్వామ్యార్థాన్ని స్పష్టంగా తెలిపాం. ἀδελφοί పుంలింగ బహువచనం కావడంతో ప్రధాన పాఠంలో ‘సహోదరులు’ అని అనువదించాం.
- source_word: εἱστήκεισαν ἔξω
  choice: బయట నిలబడి ఉన్నారు
  rationale: εἱστήκεισαν సూచించే కొనసాగుతున్న స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; గ్రీకు పాఠంలో స్పష్టంగా లేని ‘ఇంటి బయట’ వంటి వివరాన్ని చేర్చలేదు.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: ఆయనతో మాట్లాడాలని
  rationale: ζητοῦντες ఇక్కడ ఉద్దేశపూర్వక కోరిక లేదా ప్రయత్నాన్ని సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘మాట్లాడాలని’ అని ఇచ్చినా, ఆయనను సంప్రదించాలనే ఉద్దేశాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యేసు కుటుంబానికి సంబంధించి ἀδελφοί పదం అర్థం
  choice: ఆయన సహోదరులు
  alternative: ఆయన తోబుట్టువులు; ఆయన దగ్గరి బంధువులు
  rationale: గ్రీకు రూపం పుంలింగ బహువచనం; కథన ఉపరితల అర్థాన్ని ప్రధాన పాఠంలో ‘సహోదరులు’గా నిలిపాం. వీరు యేసుతో ఏ ఖచ్చితమైన బంధుత్వంలో ఉన్నారనే తరువాతి సిద్ధాంత వివాదాన్ని ఈ అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇదిగో’ ద్వారా మూలంలోని సజీవ దృష్టి-ఆకర్షణను, ‘ఇంకా ... మాట్లాడుతుండగా’ ద్వారా కొనసాగుతున్న చర్యను నిలిపాం.
