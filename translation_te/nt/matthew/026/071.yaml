  text: ἐξελθόντα ⸀δὲ εἰς τὸν πυλῶνα εἶδεν αὐτὸν ἄλλη καὶ λέγει ⸀τοῖς ἐκεῖ· ⸀Οὗτος ἦν μετὰ Ἰησοῦ τοῦ Ναζωραίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/071.yaml
  text: But when he had gone out to the gateway, another woman saw him and says to those there, “This man was with Jesus the Nazarene.”
translation:
  language: te
  text: అయితే అతడు బయటికి వెళ్లి ద్వారప్రాంతానికి చేరినప్పుడు, మరొక స్త్రీ అతన్ని చూసి అక్కడ ఉన్నవారితో, “ఇతడు నజరేతువాడైన యేసుతో ఉన్నాడు” అని అంటుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πυλῶνα
  choice: ప్రవేశద్వారం దగ్గరికి
  rationale: ఈ పదం ఆవరణ నుంచి బయటికి వెళ్లే ద్వారప్రాంతాన్ని సూచిస్తుంది; ఆధునిక పాఠకులకు సహజంగా అర్థమయ్యేలా స్థలార్థాన్ని వ్యక్తం చేసింది.
- source_word: ἄλλη
  choice: మరొక స్త్రీ
  rationale: గ్రీకు విశేషణం స్త్రీలింగంలో ఉంది; సందర్భానుసారం సూచిత నామవాచకాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేసింది.
- source_word: λέγει
  choice: అంటుంది
  rationale: మూలంలోని చారిత్రక వర్తమాన కాలాన్ని నిలుపుతూ కథనంలోని సజీవతను కాపాడింది.
- source_word: τοῦ Ναζωραίου
  choice: నజరేతువాడైన
  rationale: యేసును నజరేతుతో అనుసంధానించే భౌగోళిక గుర్తింపును సహజమైన తెలుగు రూపంలో ఇచ్చింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని λέγει అనే చారిత్రక వర్తమానాన్ని ‘అంటుంది’గా ఉద్దేశపూర్వకంగా నిలిపింది; అవసరం లేని వివరణాత్మక పదాలు లేదా మతపరమైన ప్రత్యేక వ్యాఖ్యానాలు చేర్చలేదు.
