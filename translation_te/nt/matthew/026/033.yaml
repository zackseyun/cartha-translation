  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: te
  text: 'అయితే పేతురు ఆయనకు జవాబిస్తూ ఇలా అన్నాడు: “అందరూ నీ విషయమై తడబడినా[a], నేను ఎన్నటికీ తడబడను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అభ్యంతరపడినా,” “వెనుదిరిగినా,” లేదా “తొట్రుపడేలా చేయబడినా.” గ్రీకు క్రియకు తొట్రుపడటం, అభ్యంతరపడటం, లేదా ఒకరి విషయంలో వెనుదిరగడం అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: అయితే పేతురు ఆయనకు జవాబిచ్చాడు
  rationale: గ్రీకు వాక్యంలోని participle + finite speech verb అనే కథన ప్రయోగాన్ని సహజమైన తెలుగులో ఒకే మాటల పరిచయంగా అందిస్తుంది. δέ ఇక్కడ ముందటి మాటకు స్వల్ప వ్యతిరేకతను సూచిస్తుంది; αὐτῷను ‘ఆయనకు’గా నిలుపుతుంది.
- source_word: Εἰ πάντες
  choice: అందరూ … అయినా
  rationale: εἰ ప్రాథమికంగా షరతును సూచించినా, ఇక్కడ పేతురు తనను మిగతా అందరితో వ్యతిరేకంగా నిలబెట్టే concessive భావం ఉంది; తెలుగు ‘అయినా’ దాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σκανδαλισθήσονται
  choice: విశ్వాసం నుంచి తొలగిపోయినా
  rationale: ఈ శిష్యత్వ సందర్భంలో క్రియ కేవలం తడబడటాన్ని కాక, యేసుపట్ల నిబద్ధతలో వైఫల్యం చెంది వెనుదిరగడాన్ని సూచిస్తుంది. ‘విశ్వాసం నుంచి తొలగిపోవడం’ ఆ బలమైన భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν σοί
  choice: నీ కారణంగా
  rationale: σκανδαλίζωతో కలిసిన ἐν σοί ఇక్కడ ‘నీ విషయంలో/నీ కారణంగా తొలగిపోవడం’ అనే భావాన్ని ఇస్తుంది; ‘నీ కారణంగా’ సహజమైన ఆధునిక తెలుగు.
- source_word: ἐγὼ οὐδέποτε σκανδαλισθήσομαι
  choice: నేను ఎన్నటికీ తొలగిపోను
  rationale: ప్రత్యక్ష సర్వనామమైన ἐγώ ‘అందరూ’ అనే పదానికి విరుద్ధంగా పేతురును నొక్కిచెబుతుంది. οὐδέποτεలోని దృఢమైన కాలనిరాకరణను ‘ఎన్నటికీ’ వ్యక్తం చేస్తుంది; ఒకే వాక్యంలో క్రియకు అనువాద సారూప్యతను నిలుపుతుంది.
theological_decisions:
- issue: శిష్యత్వ వైఫల్య సందర్భంలో σκανδαλίζω అర్థం
  choice: విశ్వాసం నుంచి తొలగిపోవడం
  alternative: తడబడటం; అభ్యంతరపడటం; తొట్రుపడేలా చేయబడటం
  rationale: సందర్భం ఒత్తిడిలో శిష్యులు యేసును విడిచిపెట్టడం గురించి ఉంది. ఎంపిక చేసిన పదబంధం ఆ నిబద్ధతా వైఫల్యాన్ని తెలియజేస్తుంది; అయితే ఇది అంతిమ మతభ్రష్టత్వం గురించి ఏదైనా నిర్దిష్ట సిద్ధాంతాన్ని నిర్ణయించదు. పదంలోని విస్తృత అర్థపరిధిని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆయనకు’ యేసును గౌరవసూచకంగా సూచిస్తుంది; ప్రత్యక్ష సంభాషణలోని ‘నీ’ మూలంలోని ఏకవచన రెండో పురుష రూపాన్ని సహజంగా నిలుపుతుంది. ప్రధాన పాఠ్యం శిష్యత్వ సందర్భాన్ని స్పష్టం చేస్తూ, గ్రీకు పదంలోని నిజమైన అర్థవిస్తృతిని పాదసూచికలో పరిరక్షిస్తుంది.
