revisions:
- from: 'అయితే పేతురు ఆయనకు జవాబిచ్చాడు: “అందరూ నీ కారణంగా విశ్వాసం నుంచి తొలగిపోయినా[a], నేను ఎన్నటికీ తొలగిపోను.”'
  to: 'అయితే పేతురు ఆయనకు జవాబిస్తూ ఇలా అన్నాడు: “అందరూ నీ విషయమై తడబడినా[a], నేను ఎన్నటికీ తడబడను.”'
  rationale: The revision preserves the Greek’s repeated verb and Peter’s emphatic self-contrast while avoiding the interpretively narrower phrase ‘విశ్వాసం నుంచి తొలగిపోవడం.’ The footnote retains the relevant lexical range, including the contextual possibility of defection, without presenting it as the sole meaning.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:24Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Peter's contrast with all the others and the emphatic 'never.' However, ‘విశ్వాసం నుంచి తొలగిపోవడం’ specifies departure from faith more explicitly than σκανδαλίζω itself does here. In this verse the verb retains the broader sense of being made to stumble, taking offense, or falling away in relation to Jesus.
  naturalness: The draft is generally modern and readable. ‘తడబడడం’ is a natural, concise principal rendering, while ‘నీ విషయమై’ naturally expresses the relationship denoted by ἐν σοί without making Jesus sound merely causally culpable.
  terminology: Use ‘తడబడడం’ in both occurrences for lexical consistency and retain the broader alternatives in the footnote. This avoids importing a more technical or determinate notion of apostasy while allowing the context to communicate the disciples’ impending failure.
  issues:
  - severity: medium
    issue: ‘విశ్వాసం నుంచి తొలగిపోయినా/తొలగిపోను’ over-specifies σκανδαλισθήσονται / σκανδαλισθήσομαι.
    rationale: The Greek verb can encompass stumbling, offense, and defection, but it does not explicitly say ‘from faith.’ The added phrase narrows the wording toward a theological interpretation that should remain available rather than be made explicit in the main text.
  - severity: low
    issue: ‘నీ కారణంగా’ can sound more directly causal than the Greek’s relational ‘ἐν σοί.’
    rationale: '‘నీ విషయమై’ is idiomatic Telugu and preserves the wording’s range: stumbling in connection with, or over, Jesus.'
  revised_text: 'అయితే పేతురు ఆయనకు జవాబిస్తూ ఇలా అన్నాడు: “అందరూ నీ విషయమై తడబడినా[a], నేను ఎన్నటికీ తడబడను.”'
