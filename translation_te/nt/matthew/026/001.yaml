  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς πάντας τοὺς λόγους τούτους, εἶπεν τοῖς μαθηταῖς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: te
  text: 'యేసు ఈ మాటలన్నీ చెప్పడం ముగించినప్పుడు,[a] ఆయన తన శిష్యులతో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: ‘యేసు ఈ మాటలన్నిటిని ముగించినప్పుడు ఇలా జరిగింది: ఆయన తన శిష్యులతో అన్నాడు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: ముగించినప్పుడు
  rationale: మత్తయి వాడే సెమిటిక్ శైలిగల కథన సూత్రాన్ని తెలుగులో పదేపదే అనువదిస్తే అసహజంగా ఉంటుంది. ‘అప్పుడు సంభవించింది’ అనే అదనపు పదబంధం లేకుండానే ‘అప్పుడు/ప్పుడు’ కాలసంబంధాన్ని, కథన మార్పును సహజంగా తెలియజేస్తుంది.
- source_word: ἐτέλεσεν
  choice: చెప్పడం ముగించినప్పుడు
  rationale: క్రియ ముందుగా పూర్తయి, ఆ తరువాత ప్రధాన క్రియ జరిగినట్టు చూపుతుంది. λόγουςతో కలిపి ‘మాటలన్నీ చెప్పడం ముగించినప్పుడు’ అనడం ఆధునిక తెలుగులో సహజం.
- source_word: πάντας τοὺς λόγους τούτους
  choice: ఈ మాటలన్నీ
  rationale: λόγους అనే పదానికి సమీపమైన ‘మాటలు’ను నిలుపుతూ, మునుపటి ఉపదేశ భాగమంతటినీ సూచించే ముగింపు సూత్రాన్ని కాపాడుతుంది.
- source_word: εἶπεν
  choice: ఇలా అన్నాడు
  rationale: తరువాత ప్రత్యక్ష ఉక్తి రాబోతున్నందున తెలుగులో ‘ఇలా అన్నాడు’ సహజమైన కథన ప్రయోగం; గ్రీకు క్రియకు లేని అదనపు భావాన్ని చేర్చదు.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: తన శిష్యులతో
  rationale: αὐτοῦలోని సంబంధాన్ని ‘తన’ ద్వారా స్పష్టంగా నిలుపుతుంది. ‘శిష్యులు’ μαθηταίకు ప్రామాణికమైన తెలుగు పదం; ‘తో’ తెలుగు ఉక్తి నిర్మాణంలో సహజం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సహజంగా ఉండేలా, అదే సమయంలో గంభీరమైన గ్రంథశైలిని నిలిపింది. గ్రీకు కథన సూత్రంలోని సెమిటిక్ నిర్మాణాన్ని ప్రధాన పాఠ్యంలో సహజీకరించి, పదానుసార రూపాన్ని పాదసూచికలో ఇచ్చింది.
