id: MAT.26.24
reference: Matthew 26:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: te
  text: మనుష్యకుమారుడు తన గురించి రాయబడి ఉన్నట్లే వెళ్తున్నాడు. అయితే ఎవరి ద్వారా మనుష్యకుమారుడు ద్రోహానికి గురవుతున్నాడో[a], ఆ మనిషికి అయ్యో! ఆ మనిషి పుట్టకపోయి ఉంటే అతనికి మేలై ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరి ద్వారా మనుష్యకుమారుడు అప్పగించబడుతున్నాడో.” గ్రీకు క్రియకు “ద్రోహం చేయడం” లేదా మరింత అక్షరార్థంగా “అప్పగించడం” అనే రెండు భావాలూ ఉండవచ్చు; ఇక్కడ యూదా విశ్వాసఘాతుకం సందర్భంలో ఉన్నందున “ద్రోహానికి గురవుతున్నాడు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు ... ప్రకారమే
  rationale: ὁ υἱὸς τοῦ ἀνθρώπου అనే స్థిరమైన బిరుదును ‘మనుష్య కుమారుడు’గా నిలిపి, μὲν యొక్క స్వల్ప బలాన్ని ‘ప్రకారమే’లోని ‘ఏ’ ద్వారా సహజంగా సూచించాం; తరువాతి δὲతో ఉన్న వ్యత్యాసం ‘అయితే’లో స్పష్టమవుతుంది.
- source_word: ὑπάγει
  choice: వెళ్తున్నాడు
  rationale: వర్తమాన కాలపు సాధారణ భావాన్ని నిలుపుతూ, ఇది కేవలం వెళ్లిపోవడమా లేక మరణాన్ని సూచించడమా అని అనువాదంలోనే నిర్ణయించలేదు.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: తన గురించి రాయబడి ఉన్న ప్రకారమే
  rationale: γέγραπται యొక్క గతంలో రాయబడి ఇప్పటికీ అమలులో ఉన్న భావాన్ని ‘రాయబడి ఉన్న’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: అయితే ... ఆ మనిషికి అయ్యో!
  rationale: δὲ యొక్క వ్యత్యాసాన్ని ‘అయితే’తో, οὐαί యొక్క ప్రవచనాత్మకమైన తీవ్ర హెచ్చరికను ‘అయ్యో’తో నిలిపాం.
- source_word: δι’ οὗ
  choice: ఎవరి ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే మధ్యవర్తిత్వం లేదా కార్యసాధకత్వాన్ని, అతిగా వ్యాఖ్యానించకుండా వ్యక్తం చేస్తుంది.
- source_word: παραδίδοται
  choice: ద్రోహానికి గురవుతున్నాడు
  rationale: యూదా విశ్వాసఘాతుక సందర్భంలో క్రియకు ఉన్న ‘betray’ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘అప్పగించబడుతున్నాడు’ అనే అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: καλὸν ἦν αὐτῷ
  choice: అతనికి మేలై ఉండేది
  rationale: తరువాతి అవాస్తవ షరతుతో కలిసి, జరగని పరిస్థితి అతనికి మేలై ఉండేదనే ప్రతికల్పన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος
  choice: ఆ మనిషి పుట్టకపోయి ఉంటే
  rationale: అవాస్తవ గత షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ἐκεῖνος యొక్క దూరసూచక బలాన్ని ‘ఆ మనిషి’గా నిలిపాం.
theological_decisions:
- issue: లేఖన నెరవేర్పు మరియు ద్రోహి వ్యక్తిగత బాధ్యత మధ్య సంబంధం
  choice: మనుష్య కుమారుని ప్రయాణం లేఖనంలో రాయబడిన ప్రకారమే జరుగుతుందని, అదే సమయంలో ద్రోహి ‘అయ్యో’ అనే తీర్పుకు లోనవుతాడని రెండు అంశాలనూ సమానంగా నిలిపాం.
  alternative: లేఖన నెరవేర్పును మానవ బాధ్యతను తొలగించే నిర్ణయవాదంగా చదవడం, లేదా మానవ చర్యను మాత్రమే చూపి లేఖన నెరవేర్పు బలాన్ని తగ్గించడం.
  rationale: గ్రీకు వాక్యం ఉంచిన దైవిక ఉద్దేశం–మానవ బాధ్యత ఉద్వేగాన్ని అనువాదం పరిష్కరించకుండా యథాతథంగా ఉంచుతుంది.
- issue: పుట్టకపోవడం మేలనే చివరి వాక్యపు తీవ్రత
  choice: దానిని తీవ్రమైన తీర్పు వాక్యంగా మాత్రమే అనువదించాం.
  alternative: దీనిని కేవలం అతిశయోక్తిగా తగ్గించడం లేదా నిర్దిష్టమైన నిత్యగతి సిద్ధాంతానికి విస్తరించడం.
  rationale: మూలం చెప్పినదానికంటే మించి ఆ మనిషి అంతిమ గతి గురించి సిద్ధాంతపరమైన నిర్ధారణను జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన వచన శైలిని ఉపయోగించాం. ‘మనుష్య కుమారుడు’ అనే స్థిరమైన బైబిలు బిరుదును నిలిపి, పాతకాలపు క్రియారూపాలను నివారించాం.
