id: MAT.26.12
reference: Matthew 26:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βαλοῦσα γὰρ αὕτη τὸ μύρον τοῦτο ἐπὶ τοῦ σώματός μου πρὸς τὸ ἐνταφιάσαι με ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: te
  text: ఎందుకంటే, ఈమె ఈ సుగంధ తైలాన్ని నా శరీరంపై పోసి, నన్ను సమాధికి సిద్ధం చేయడానికి ఇలా చేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా సమాధి కోసం.” గ్రీకు క్రియలో దేహాన్ని సమాధి కోసం సిద్ధం చేసే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: పోసి
  rationale: βάλλω అనే క్రియ ఇక్కడ అక్షరార్థమైన ‘విసరడం’ను కాక, సుగంధ తైలాన్ని శరీరంపై పోయడం లేదా పూయడాన్ని సూచిస్తుంది. తెలుగు అసమాపక క్రియారూపం గ్రీకు క్రియావిశేషణ రూపానికి సహజమైన సమానార్థక నిర్మాణం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు యేసు ఇస్తున్న వివరణను γάρ పరిచయం చేస్తుంది; ‘ఎందుకంటే’ దాని వివరణాత్మక బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὕτη
  choice: ఈమె
  rationale: స్త్రీని సూచించే నిర్దేశక సర్వనామ బలాన్ని ‘ఈమె’ నిలుపుతుంది; కేవలం ‘ఆమె’ అనడం కంటే గ్రీకు మూలానికి దగ్గరగా ఉంటుంది.
- source_word: μύρον
  choice: సుగంధ తైలం
  rationale: μύρον సువాసనగల అభిషేక తైలం లేదా లేపనాన్ని సూచిస్తుంది. ‘సుగంధ తైలం’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, అది కేవలం సువాసన ద్రవ్యం మాత్రమే అనే అపార్థాన్ని తగ్గిస్తుంది.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: నా శరీరంపై
  rationale: ἐπί + షష్ఠీ విభక్తి ఇక్కడ శరీరంపై తైలం ఉంచిన లేదా పోసిన స్థానాన్ని సూచిస్తుంది.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: నన్ను సమాధికి సిద్ధం చేయడానికి
  rationale: πρὸς తో కూడిన క్రియానామ రూపం ఉద్దేశాన్ని తెలియజేస్తుంది. ἐνταφιάζω కేవలం పాతిపెట్టడమే కాక, మృతదేహాన్ని సమాధికి సిద్ధం చేయడాన్ని కూడా సూచిస్తుంది.
- source_word: ἐποίησεν
  choice: ఇలా చేసింది
  rationale: ποιέω ఇక్కడ ముందే చెప్పిన తైలం పోయే చర్యను తిరిగి సూచిస్తుంది. ‘ఇలా చేసింది’ తెలుగులో సహజంగా ఆ చర్యతో ప్రధాన క్రియను అనుసంధానిస్తుంది.
theological_decisions:
- issue: యేసు మరణంతో ἐνταφιάζωకు ఉన్న సంబంధం
  choice: స్త్రీ చేసిన పని యేసును సమాధికి సిద్ధం చేసే చర్యగా వివరించబడింది.
  alternative: ఆ చర్యను మరింత సంక్షిప్తంగా ‘నా సమాధి కోసం’ అని చెప్పడం.
  rationale: గ్రీకు పదం సమాధి కోసం దేహాన్ని సిద్ధం చేసే భావాన్ని కలిగి ఉంది. ఈ అనువాదం యేసు తన సమీప మరణాన్ని ముందుగా సూచిస్తున్న ఉద్రిక్తతను నిలుపుతూ, అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘ఈమె’ మూలంలోని నిర్దేశక బలాన్ని నిలుపుతుంది; ‘సుగంధ తైలం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది. ‘సమాధికి సిద్ధం చేయడం’ అనే పదబంధం అంత్యక్రియల విస్తృత భావం కంటే మూలంలోని burial-preparation భావాన్ని నేరుగా తెలియజేస్తుంది.
