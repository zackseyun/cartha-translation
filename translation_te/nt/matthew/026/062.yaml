id: MAT.26.62
reference: Matthew 26:62
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: te
  text: 'ప్రధాన యాజకుడు లేచి ఆయనతో ఇలా అన్నాడు: “నువ్వేమీ జవాబు చెప్పవా? వీళ్లు నీకు వ్యతిరేకంగా ఏం సాక్ష్యం చెబుతున్నారు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: లేచి నిలబడి
  rationale: ప్రధాన యాజకుడు మాట్లాడే ముందు చేసిన శారీరక చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది; దృశ్యంలోని న్యాయసభాపరమైన ఉద్వేగాన్ని కూడా నిలుపుతుంది.
- source_word: ὁ ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: ఈ సందర్భంలోని ఏకవచన యాజక ప్రధానాధికార పదవికి ఆధునిక ప్రామాణిక తెలుగులో స్థిరమైన సమానార్థకం.
- source_word: εἶπεν αὐτῷ
  choice: ఆయనతో ... అన్నాడు
  rationale: గ్రీకులోని పరోక్ష సర్వనామాన్ని పేరుతో భర్తీ చేయకుండా గౌరవార్థక తెలుగు సర్వనామంతో నిలుపుతుంది.
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: నువ్వేమీ జవాబు చెప్పవా?
  rationale: ప్రస్తుతకాల ప్రత్యక్ష ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, సమాధానం కోరుతున్న ఒత్తిడిని నిలుపుతుంది.
- source_word: τί
  choice: ఏమిటి?
  rationale: సాక్ష్యం యొక్క విషయమేమిటో అడిగే సంక్షిప్త ప్రశ్నార్థక భావాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: οὗτοί
  choice: వీళ్లు
  rationale: అక్కడున్న పురుష సాక్షులను సూచించే నిర్దేశక సర్వనామాన్ని సందర్భానుకూలమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: σου
  choice: నీకు వ్యతిరేకంగా
  rationale: καταμαρτυροῦσιν‌తో కలిసి నిందితునికి వ్యతిరేకంగా ఇచ్చే సాక్ష్యమనే న్యాయపరమైన భావాన్ని స్పష్టం చేస్తుంది.
- source_word: καταμαρτυροῦσιν
  choice: ఇస్తున్న సాక్ష్యం
  rationale: కొనసాగుతున్న న్యాయపరమైన ప్రతికూల సాక్ష్యాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; కేవలం ‘నిందిస్తున్నారు’ అని వ్యాఖ్యానాత్మకంగా మార్చదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే న్యాయసభా సంభాషణ. యేసును ఉద్దేశించిన మాటలో గ్రీకు ఏకవచన ప్రత్యక్ష సంబోధనను సహజ తెలుగు ‘నువ్వు’ రూపంలో ఉంచి, కథకుని సూచనలో గౌరవార్థక ‘ఆయన’ వాడబడింది.
