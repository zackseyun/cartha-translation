  yaml_path: translation/nt/matthew/026/067.yaml
  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: te
  text: అప్పుడు వారు ఆయన ముఖం మీద ఉమ్మివేసి, ఆయనను పిడికిళ్లతో కొట్టారు; మరికొందరు ఆయనకు చెంపదెబ్బలు వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలో తరువాత జరిగిన సంఘటనను సూచించే సహజమైన కాలక్రమ పదం.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: ఆయన ముఖం మీద ఉమ్మివేసి
  rationale: గ్రీకు ప్రయోగం నేరుగా ఆయన ముఖంపై ఉమ్మివేసిన అవమానకర చర్యను సూచిస్తుంది; ఆధునిక తెలుగులో ఇది సహజమైన వ్యక్తీకరణ.
- source_word: ἐκολάφισαν αὐτόν
  choice: ఆయనను పిడికిళ్లతో కొట్టారు
  rationale: κολαφίζω సాధారణంగా పిడికిలితో కొట్టడాన్ని సూచిస్తుంది; చర్య విధానాన్ని స్పష్టంగా, అతిశయింపకుండా తెలియజేస్తుంది.
- source_word: οἱ δὲ ἐράπισαν
  choice: మరికొందరు ఆయనను చెంపదెబ్బలు కొట్టారు
  rationale: నామవాచకంగా వాడిన οἱ ‘మరికొందరు’ అని సూచిస్తుంది; ῥαπίζω సాధారణంగా అరచేతితో కొట్టడం లేదా చెంపదెబ్బ కొట్టడం అనే భావం ఇస్తుంది. సందర్భం వల్ల అంతర్లీనంగా ఉన్న కర్మను తెలుగులో ‘ఆయనను’ అని స్పష్టపరిచాం.
- source_word: δέ
  choice: మరి-
  rationale: ఇక్కడ బలమైన వ్యతిరేకతకన్నా వేరొక సమూహం చేసిన చర్యకు స్వల్ప మార్పును సూచిస్తుంది; ‘మరికొందరు’లో ఆ భావం సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: మహాసభ ఎదుట యేసుకు జరిగిన అవమానం, శారీరక హింసను వర్ణించడం
  choice: ఉమ్మివేయడం, పిడికిళ్లతో కొట్టడం, చెంపదెబ్బలు కొట్టడం అనే చర్యలను నిర్దిష్టంగా అనువదించడం.
  alternative: ‘హింసించారు’ లేదా ‘కొట్టారు’ వంటి సాధారణ పదాలతో చర్యలను కలిపి చెప్పడం.
  rationale: మూలవాక్యం అవమానాన్ని, వేర్వేరు రకాల శారీరక దాడులను స్పష్టంగా వర్ణిస్తుంది. నిర్దిష్ట పదాలు కథన బలాన్ని కాపాడుతూ అదనపు సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చవు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మూలంలోని మూడు నిర్దిష్ట అవమానకర/హింసాత్మక చర్యలను మృదువుపరచకుండా సహజంగా తెలిపాం.
