  source_fidelity: The draft accurately represents Jesus’ address, the solemn affirmation, the emphatic temporal phrase, the pre-crowing limit, and the threefold future denial. The idiom for denial is contextually defensible, but its placement is clearer when the threefold modifier directly precedes the denial expression.
  naturalness: Modern standard Telugu is generally natural. Reordering the final clause avoids a slight momentary ambiguity about what is repeated three times and produces a smoother direct-speech cadence.
  terminology: “నిజంగా చెబుతున్నాను” suitably renders Ἀμὴν λέγω σοι, and “నన్ను ఎరుగనని చెబుతావు” is a natural contextual expression for denying Jesus. The footnote on the Greek anarthrous noun is clarified without implying that Telugu has a grammatical definite article.
  issues:
  - severity: low
    issue: Placement of “మూడుసార్లు”
    rationale: In the draft, “మూడుసార్లు” occurs before “నన్ను ఎరుగనని చెబుతావు.” Moving it directly before the denial idiom makes its scope immediately clear while retaining the source order and meaning.
  - severity: low
    issue: Footnote b wording
    rationale: The existing wording about a “definite form” is imprecise for Telugu. The revised note directly explains that Greek lacks a definite article and that either indefinite or definite Telugu contextual renderings are possible.
