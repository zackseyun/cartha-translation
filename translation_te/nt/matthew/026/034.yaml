  to: 'యేసు అతనితో, “నేను నీతో నిజంగా చెబుతున్నాను: ఈ రాత్రే[a], కోడి కూయకముందే[b], నన్ను ఎరుగనని మూడుసార్లు చెబుతావు” అన్నాడు.'
