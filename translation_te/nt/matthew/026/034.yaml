id: MAT.26.34
reference: Matthew 26:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: te
  text: 'యేసు అతనితో, “నేను నీతో నిజంగా చెబుతున్నాను: ఈ రాత్రే[a], కోడి కూయకముందే[b], నన్ను ఎరుగనని మూడుసార్లు చెబుతావు” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ రాత్రిలోనే.” గ్రీకులో అక్షరార్థంగా “ఈ రాత్రిలో”; “ఈ” అనే పదానికి ఉద్ఘాటన ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆ కోడి కూయకముందే.” గ్రీకులో ఇక్కడ నిర్దిష్ట ఉపపదం లేదు; సందర్భానుసారంగా “కోడి” లేదా “ఆ కోడి” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: అన్నాడు
  rationale: కథన సందర్భంలో సాధారణ భూతకాల వాక్కు క్రియగా సహజంగా ఉంది; మూలంలోని సరళతను నిలుపుతుంది.
- source_word: Ἀμὴν λέγω σοι
  choice: నేను నీతో నిజంగా చెబుతున్నాను
  rationale: యేసు పలికిన గంభీరమైన నిశ్చయవాక్యాన్ని ఆధునిక, సహజ తెలుగులో తెలియజేస్తుంది; ‘ఆమేన్’ అనే అనువదించని రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచదు.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: ఈ రాత్రే
  rationale: ταύτῃ లోని నిర్దిష్ట ఉద్ఘాటనను తెలుగు ‘ఏ’ నిపాతంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: కోడి కూయకముందే
  rationale: గ్రీకు అనిశ్చితార్థక నామవాచక ప్రయోగాన్ని తెలుగులో సహజమైన సాధారణ రూపంతో అందిస్తుంది; ‘ముందే’ సమీప కాలపరిమితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τρὶς
  choice: మూడుసార్లు
  rationale: ఆధునిక తెలుగులో స్పష్టమైన సాధారణ సంఖ్యావాచక ప్రయోగం.
- source_word: ἀπαρνήσῃ με
  choice: నన్ను ఎరుగనని చెబుతావు
  rationale: ఈ సందర్భంలో ἀπαρνέομαι సూచించే వ్యక్తిని తెలియదని నిరాకరించే చర్యను సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘నిరాకరిస్తావు’ కంటే సందర్భార్థం అందుబాటులో ఉంటుంది.
theological_decisions:
- issue: Ἀμὴν λέγω σοι అనే ప్రవేశ సూత్రం
  choice: నేను నీతో నిజంగా చెబుతున్నాను
  alternative: ఆమేన్, నేను నీతో చెబుతున్నాను
  rationale: యేసు మాటలోని గంభీర నిశ్చయాన్ని కాపాడుతూ, తరువాతి ఆరాధనా వాడుకల భావాన్ని ప్రధాన పాఠ్యంలోకి అనవసరంగా తీసుకురాదు.
- issue: ἀπαρνήσῃ με లోని నిరాకరణ స్వభావం
  choice: నన్ను ఎరుగనని చెబుతావు
  alternative: నన్ను నిరాకరిస్తావు
  rationale: పేతురు తరువాత చేసే నిరాకరణలో యేసును తెలియదని చెప్పే భావాన్ని వ్యక్తం చేస్తుంది; సంబంధాన్ని పూర్తిగా త్యజించాడనే అదనపు సిద్ధాంతార్థాన్ని బలవంతంగా మోపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ప్రత్యక్ష సంభాషణలో ‘నీతో’, ‘నువ్వు’ రూపాలు సందర్భానుకూలంగా వాడబడ్డాయి.
