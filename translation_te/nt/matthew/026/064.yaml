revisions:
- from: 'యేసు అతనితో, “నీవే అన్నావు.[a] అయితే నేను మీతో చెప్తున్నాను: ఇకమీదట మనుష్య కుమారుడు శక్తి కుడివైపున[b] ఆసీనుడై ఉండడం, ఆకాశ మేఘాల మీద రావడం మీరు చూస్తారు” అన్నాడు.[c]'
  to: 'యేసు అతనితో, “నీవే అన్నావు.[a] అయితే నేను మీతో చెప్తున్నాను: ఇకమీదట శక్తి యొక్క కుడివైపున ఆసీనుడై, ఆకాశ మేఘాల మీద వస్తున్న మనుష్యకుమారుని మీరు చూస్తారు” అన్నాడు.[c]'
  rationale: 'The revision restores a natural Telugu equivalent of the Greek accusative noun phrase: the Son of Man is the one seen, while ‘seated’ and ‘coming’ qualify him. It also clarifies that the right side belongs to ‘Power.’ No disputed temporal interpretation is added, and all supplied footnote markers and notes are retained.'
  reviewer_model: gpt-5.6-terra
