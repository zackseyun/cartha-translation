review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the affirmative-but-formulated reply, the plural address after the singular reply, the reverential circumlocution ‘Power,’ and the paired participles of enthronement and coming. However, its Telugu construction turns the two participles into awkward abstract nouns (‘ఆసీనుడై ఉండడం, ... రావడం’), rather than describing the Son of Man whom they will see.
  naturalness: A small syntactic revision makes the sentence fluent modern standard Telugu while retaining the Greek structure and ambiguity. ‘శక్తి యొక్క కుడివైపున’ also makes the possessive relationship explicit and prevents a momentary reading as merely ‘to the right of power.’
  terminology: ‘మనుష్యకుమారుడు’ and capital-free ‘శక్తి’ are retained. The footnotes appropriately explain the idiomatic affirmative and the reverential use of ‘Power’; the allusion note is accurate.
  issues:
  - severity: medium
    issue: The phrase ‘మనుష్య కుమారుడు శక్తి కుడివైపున ఆసీనుడై ఉండడం, ఆకాశ మేఘాల మీద రావడం మీరు చూస్తారు’ is syntactically unnatural in Telugu.
    rationale: The nominalized forms ‘ఉండడం’ and ‘రావడం’ make the object of ‘చూస్తారు’ cumbersome. The Greek has ‘the Son of Man’ as the object, qualified by two participles; Telugu can represent this naturally with ‘...వస్తున్న మనుష్యకుమారుని మీరు చూస్తారు.’
  - severity: low
    issue: ‘శక్తి కుడివైపున’ leaves the possessive relation underexpressed.
    rationale: Although recoverable in context, ‘శక్తి యొక్క కుడివైపున’ more clearly conveys ‘at the right hand of Power’ without expanding ‘Power’ to ‘God.’
  revised_text: 'యేసు అతనితో, “నీవే అన్నావు.[a] అయితే నేను మీతో చెప్తున్నాను: ఇకమీదట శక్తి యొక్క కుడివైపున ఆసీనుడై, ఆకాశ మేఘాల మీద వస్తున్న మనుష్యకుమారుని మీరు చూస్తారు” అన్నాడు.[c]'
