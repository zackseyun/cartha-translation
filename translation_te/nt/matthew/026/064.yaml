id: MAT.26.64
reference: Matthew 26:64
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: te
  text: 'యేసు అతనితో, “నీవే అన్నావు.[a] అయితే నేను మీతో చెప్తున్నాను: ఇకమీదట శక్తి యొక్క కుడివైపున ఆసీనుడై, ఆకాశ మేఘాల మీద వస్తున్న మనుష్యకుమారుని మీరు చూస్తారు” అన్నాడు.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీవే చెప్పావు.” ఈ గ్రీకు మాటతీరు సమ్మతిని సూచించే జవాబు.
    reason: lexical_alternative
  - marker: c
    text: ఈ ప్రకటన దానియేలు 7:13; కీర్తన 110:1లను సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: నీవే అన్నావు
  rationale: గ్రీకు పదబంధంలోని మాటతీరును నిలుపుకుంటూనే, అది సమ్మతిని సూచించే జవాబని తెలియజేస్తుంది; కేవలం ‘అవును’ అని మార్చి మూలంలోని ఉద్దేశపూర్వక పదప్రయోగాన్ని తొలగించదు.
- source_word: πλὴν
  choice: అయితే
  rationale: ముందటి సంక్షిప్త జవాబు నుంచి తరువాతి గంభీర ప్రకటనకు బలమైన మలుపును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἀπ’ ἄρτι
  choice: ఇకమీదట
  rationale: ఈ సమయం నుంచి మొదలయ్యే కొత్త పరిస్థితిని సూచిస్తుంది; దానిని కేవలం తక్షణ క్షణానికే పరిమితం చేయదు.
- source_word: ὄψεσθε
  choice: మీరు చూస్తారు
  rationale: భవిష్యత్ క్రియ యొక్క సహజమైన ప్రత్యక్ష అనువాదం; సంబోధన బహువచనమని కూడా స్పష్టంగా నిలుపుతుంది.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: దానియేలు గ్రంథంతో ఉన్న ప్రతిధ్వనిని, యేసు వాడిన స్థిరమైన స్వీయ సంబోధనను కాపాడుతుంది.
- source_word: καθήμενον
  choice: ఆసీనుడై ఉండడం
  rationale: సాధారణంగా కూర్చోవడం కంటే సింహాసనాసీనత, ఘనత అనే సందర్భార్థాన్ని సహజంగా సూచిస్తూ వర్తమాన కృదంత స్వభావాన్ని నిలుపుతుంది.
- source_word: ἐκ δεξιῶν
  choice: కుడివైపున
  rationale: గౌరవం, అధికారం, సాన్నిధ్యం సూచించే బైబిలు భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: τῆς δυνάμεως
  choice: శక్తి
  rationale: దేవుని గురించి గౌరవసూచకంగా పరోక్షంగా చెప్పిన మూలపదాన్ని ‘దేవుడు’ లేదా ‘సర్వశక్తుడు’గా విస్తరించకుండా నిలుపుతుంది.
- source_word: ἐρχόμενον
  choice: రావడం
  rationale: దానియేలు 7లోని కదలికను, అంత్యకాల సంబంధిత ప్రతిధ్వనిని ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: ఆకాశ మేఘాల మీద
  rationale: గ్రీకు విభక్తి సంబంధాన్ని పారదర్శకంగా అందించి, దానియేలు 7:13తో ఉన్న పదబంధ సంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ప్రధాన యాజకునికి యేసు ఇచ్చిన Σὺ εἶπας అనే జవాబు బలం
  choice: సమ్మతిని సూచిస్తూ కూడా మూలంలోని మాటతీరును నిలిపే ‘నీవే అన్నావు.’
  alternative: సూటిగా ‘అవును’; లేదా సమాధానం తప్పించుకున్నట్లుగా అనువదించడం
  rationale: ఈ గ్రీకు మాట సమ్మతిగా పనిచేస్తుంది; అయితే కేవలం ‘అవును’ అనడం యేసు వాడిన రూపాన్ని తొలగిస్తుంది, దానిని తప్పించుకునే జవాబుగా చూపడం సందర్భంలోని బలాన్ని తగ్గిస్తుంది.
- issue: ‘శక్తి’ (τῆς δυνάμεως) ఎవరిని సూచిస్తుంది
  choice: దేవునికి గౌరవసూచక పరోక్ష నామంగా భావిస్తూ, పాఠ్యంలో ‘శక్తి’ అని నిలుపడం
  alternative: ‘దేవుడు’ లేదా ‘సర్వశక్తుడు’ అని స్పష్టీకరించడం
  rationale: అర్థంలో ఇది దేవునినే సూచించినా, మూలం చూపిన గౌరవపూర్వక పరోక్షతను అనువాదం దాటిపోకుండా కాపాడుతుంది.
- issue: ‘మీరు చూస్తారు’ అనే మాటకు ఆసీనత, మేఘాలపై రాకతో ఉన్న కాలసంబంధం
  choice: ఘనపరచబడిన ఆసీనతను, మేఘాలపై రాకను ఒకే ప్రకటనలో కలిపి, వాటి కాలవ్యవస్థను అనువాదంలో నిర్ణయించకుండా ఉంచడం
  alternative: మొత్తం ప్రకటనను సమీప భవిష్యత్తులోనే నెరవేరినదిగా లేదా ప్రత్యేకంగా రెండవ రాకను మాత్రమే సూచించేదిగా చేయడం
  rationale: గ్రీకు వాక్యం రెండు కృదంతాలనూ ‘చూస్తారు’ అనే ఒకే క్రియకు అనుసంధానిస్తుంది. వివాదాస్పదమైన కాలవ్యాఖ్యను బలవంతంగా చేర్చకుండా ఆ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. యేసు–ప్రధాన యాజకుని ఏకవచన సంభాషణకు ‘నీవు’, సభను ఉద్దేశించిన బహువచనానికి ‘మీరు’ వాడి గ్రీకు సంఖ్యాభేదం కాపాడబడింది. ‘శక్తి’ కొంత అసాధారణంగా వినిపించినా, మూలంలోని గౌరవసూచక పరోక్ష నామాన్ని ఉద్దేశపూర్వకంగా నిలుపుతూ వివరణను పాదటిప్పణిలో ఇచ్చాం.
