revisions:
- from: ఆయన శిష్యుల దగ్గరికి వచ్చి, వారు నిద్రపోతూ ఉండడం చూస్తాడు. అప్పుడు పేతురుతో, “ఏమిటి, మీరు నాతో కలిసి ఒక్క గంటైనా మేలుకొని ఉండలేకపోయారా[a]?” అని అంటాడు.
  to: ఆయన శిష్యుల దగ్గరికి వచ్చి, వారు నిద్రపోతూ ఉండడాన్ని గమనిస్తాడు. అప్పుడు పేతురుతో, “ఏమిటి, మీరు నాతో కలిసి ఒక్క గంట మేల్కొని ఉండలేకపోయారా[a]?” అని అంటాడు.
  rationale: The revision replaces ‘చూస్తాడు’ with the idiomatic contextual expression ‘వారు నిద్రపోతూ ఉండడాన్ని గమనిస్తాడు,’ better reflecting Jesus’ finding the disciples asleep. It also standardizes ‘మేల్కొని ఉండడం’ and refines the footnote alternative. The address to Peter and the Greek plural rebuke (‘మీరు’) are deliberately retained without explanatory expansion.
