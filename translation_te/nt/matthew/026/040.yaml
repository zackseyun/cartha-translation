review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the historical-present narrative style, Peter as the singular named addressee, and the plural ‘మీరు’ in the rebuke. However, ‘చూస్తాడు’ means ‘sees/observes’ and does not adequately render εὑρίσκει (‘finds’). The wording can be made more faithful while remaining idiomatic.
  naturalness: The revised wording is natural modern standard Telugu. ‘వారు నిద్రపోతూ ఉండడాన్ని గమనిస్తాడు’ is idiomatic narrative Telugu, though it necessarily expresses the contextual sense of finding them asleep rather than mechanically reproducing the Greek construction.
  terminology: ‘పేతురు,’ ‘శిష్యులు,’ and ‘మేల్కొని ఉండడం’ are suitable. The footnote’s alternative is better expressed as ‘కాపలా కాయడం,’ which conveys the watchful nuance of γρηγορέω more precisely than the somewhat abstract ‘జాగరూకంగా ఉండడం.’
  issues:
  - severity: medium
    issue: εὑρίσκει is rendered as ‘చూస్తాడు.’
    rationale: ‘చూస్తాడు’ primarily means ‘sees,’ whereas εὑρίσκει means ‘finds.’ In this context, ‘వారు నిద్రపోతూ ఉండడాన్ని గమనిస్తాడు’ naturally conveys that he comes upon and finds them sleeping.
  - severity: low
    issue: Footnote alternative ‘జాగరూకంగా ఉండడం’ is less specific than the lexical alternative ‘keep watch.’
    rationale: ‘కాపలా కాయడం’ more directly communicates the vigilance/watch sense available in γρηγορέω, while the main text preserves the immediate contrast with sleeping.
  revised_text: ఆయన శిష్యుల దగ్గరికి వచ్చి, వారు నిద్రపోతూ ఉండడాన్ని గమనిస్తాడు. అప్పుడు పేతురుతో, “ఏమిటి, మీరు నాతో కలిసి ఒక్క గంట మేల్కొని ఉండలేకపోయారా[a]?” అని అంటాడు.
