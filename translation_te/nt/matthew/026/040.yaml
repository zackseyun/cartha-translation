id: MAT.26.40
reference: Matthew 26:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: te
  text: ఆయన శిష్యుల దగ్గరికి వచ్చి, వారు నిద్రపోతూ ఉండడాన్ని గమనిస్తాడు. అప్పుడు పేతురుతో, “ఏమిటి, మీరు నాతో కలిసి ఒక్క గంట మేల్కొని ఉండలేకపోయారా[a]?” అని అంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మేల్కొని ఉండడం” లేదా “కాపలా కాయడం.”
    reason: γρηγορέω ఇక్కడ నిద్రపోకుండా మెలకువగా ఉండడాన్ని సూచిస్తుంది; సందర్భాన్ని బట్టి కాపలా కాయడం లేదా మెలకువగా కాచివుండడం అనే భావమూ ఉంటుంది.
lexical_decisions:
- source_word: ἔρχεται
  choice: వచ్చి
  rationale: గ్రీకు చారిత్రక వర్తమానంలోని కథన సజీవతను తరువాతి ‘చూస్తాడు,’ ‘అంటాడు’ అనే వర్తమాన క్రియల ద్వారా నిలిపి, తెలుగులో సహజమైన క్రియాక్రమాన్ని వాడింది.
- source_word: πρὸς τοὺς μαθητὰς
  choice: శిష్యుల దగ్గరికి
  rationale: చలనాన్ని సూచించే πρόςకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: వారు నిద్రపోతూ ఉండడం చూస్తాడు
  rationale: καθεύδονταςలోని కొనసాగుతున్న క్రియాభావాన్ని ‘నిద్రపోతూ ఉండడం’ నిలుపుతుంది; ‘చూస్తాడు’ ఈ సందర్భంలో εὑρίσκειకు సహజంగా ‘వారు అలా ఉన్నారని గమనించడం’ అనే భావాన్ని ఇస్తుంది.
- source_word: λέγει τῷ Πέτρῳ
  choice: పేతురుతో … అని అంటాడు
  rationale: పేతురు అనే ఏకవచన సంబోధితుణ్ణి స్పష్టంగా ఉంచుతూ, గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగులో నిలిపింది.
- source_word: Οὕτως
  choice: ఏమిటి
  rationale: ఇక్కడ οὕτως కేవలం విధానాన్ని కాక ఆశ్చర్యంతో కూడిన స్వల్ప మందలింపును పరిచయం చేస్తుంది; ‘ఏమిటి’ ఆధునిక తెలుగులో ఆ సంభాషణ స్వరాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἰσχύσατε
  choice: ఉండలేకపోయారా
  rationale: ἰσχύω ఇక్కడ శారీరక బలం కంటే సామర్థ్యాన్ని సూచిస్తుంది; ప్రశ్నలోని మందలింపు స్వరాన్ని కూడా ఈ రూపం నిలుపుతుంది.
- source_word: μίαν ὥραν
  choice: ఒక్క గంటైనా
  rationale: కాలవ్యవధిని తెలుపుతూ, ప్రశ్నలో ‘అంత స్వల్ప సమయమైనా’ అనే సందర్భసిద్ధమైన నొక్కును సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γρηγορῆσαι
  choice: మేలుకొని ఉండడం
  rationale: నిద్రకు ప్రత్యక్ష విరుద్ధమైన ప్రాథమిక భావాన్ని స్పష్టంగా ఇస్తుంది; జాగరూకత అనే విస్తృత భావం పాదసూచికలో ఉంచబడింది.
- source_word: μετ’ ἐμοῦ
  choice: నాతో కలిసి
  rationale: μετά సూచించే సహవాసాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పేతురుతో మాట్లాడుతూనే బహువచన క్రియ ἰσχύσατε వాడబడటం
  choice: ‘పేతురుతో’ అనే ఏకవచన సంబోధితుణ్ణి, ‘మీరు’ అనే బహువచన మందలింపును రెండింటినీ నిలిపింది.
  alternative: ప్రశ్నను పేతురుకు మాత్రమే వర్తించే ఏకవచనంగా మార్చడం, లేదా పేతురు సమూహానికి ప్రతినిధి అని వివరణాత్మకంగా చేర్చడం.
  rationale: గ్రీకు పాఠం యేసు పేతురుతో చెప్పాడని స్పష్టంగా పేర్కొంటూనే రెండవ పురుష బహువచనాన్ని వాడుతుంది. పేతురు ఇతర శిష్యులకు ప్రతినిధిగా ఉన్నాడనే సాధ్యమైన భావాన్ని అనువాదంలో తేల్చకుండా మూలంలోని సంఖ్యా ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదైనా గౌరవప్రదమైన కథన శైలి. గ్రీకు చారిత్రక వర్తమానాన్ని ‘చూస్తాడు,’ ‘అంటాడు’ ద్వారా నిలిపింది. ‘మీరు’ను ఇక్కడ బహువచనార్థంలో వాడింది; పేతురును మాత్రమే ఏకవచనంగా సంబోధించేలా వాక్యాన్ని మార్చలేదు.
