id: MAT.26.74
reference: Matthew 26:74
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: te
  text: అప్పుడు అతడు శాపాలు పెట్టడం, ప్రమాణం చేయడం మొదలుపెట్టి, “ఆ మనిషి ఎవరో నాకు తెలియదు” అన్నాడు. వెంటనే కోడి కూసింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలో తదుపరి సంఘటనను సూచించే సహజమైన కాలక్రమ పదం.
- source_word: ἤρξατο
  choice: చెప్పడం మొదలుపెట్టాడు
  rationale: రెండు క్రియలతో కూడిన నిరాకరణ తీవ్రత పెరగడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καταθεματίζειν
  choice: శాపాలు పెట్టుకుంటూ
  rationale: ఒట్టు సందర్భంలో శాపాన్ని ఆహ్వానించే భావాన్ని సూచిస్తుంది; సాధారణంగా దూషించడం లేదా యేసును శపించడం అనే అపార్థాన్ని తగ్గిస్తుంది. అయితే కర్మ గ్రీకులో స్పష్టంగా లేనందున పాదసూచికలో మరింత అక్షరార్థ ప్రత్యామ్నాయం ఇవ్వబడింది.
- source_word: ὀμνύειν
  choice: ఒట్టు పెట్టుకుంటూ
  rationale: ఇక్కడ ఉద్దేశం బూతులు తిట్టడం కాదు, తన నిరాకరణను బలపరచేందుకు ప్రమాణం చేయడం.
- source_word: ὅτι
  choice: “... అని
  rationale: ప్రమాణం/నిరాకరణలోని మాటలను ప్రత్యక్ష ఉల్లేఖనంగా సహజంగా అందిస్తుంది.
- source_word: Οὐκ οἶδα
  choice: నాకు తెలియదు
  rationale: తెలుసు లేదా పరిచయం ఉంది అనే విషయాన్ని నేరుగా నిరాకరిస్తుంది.
- source_word: τὸν ἄνθρωπον
  choice: ఆ మనిషి ఎవరో
  rationale: తెలుగులో వ్యక్తితో పరిచయం లేదని సహజంగా చెప్పే రూపం; గ్రీకులోని ‘మనిషి’ పదాన్ని నిలుపుతుంది.
- source_word: καὶ εὐθέως
  choice: వెంటనే
  rationale: యేసు ముందుగా చెప్పిన మాట తక్షణమే నెరవేరిన కథన వేగాన్ని కాపాడుతుంది.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: కోడి కూసింది
  rationale: తెలుగులో కోడి చేసే ధ్వనికి సహజమైన ప్రయోగం.
theological_decisions:
- issue: పేతురు నిరాకరణలో καταθεματίζειν భావం
  choice: తన మాట అబద్ధమైతే తనపై శాపం రావాలని సూచిస్తూ శాపాలు పెట్టుకోవడం
  alternative: సాధారణంగా శపించడం; లేదా యేసును శపించడం
  rationale: ὀμνύειν (‘ఒట్టు పెట్టుకోవడం’)తో జతగా ఉన్నందున ఇది నిరాకరణను బలపరిచే శాపసహిత ప్రమాణాన్ని సూచించే అవకాశం ఎక్కువ. అయితే శాపం ఎవరిపై అనే కర్మ మూలపాఠంలో స్పష్టంగా లేదు కాబట్టి పాదసూచిక ఆ అంశాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘ఒట్టు పెట్టుకోవడం’ సాధారణ పాఠకునికి ‘ప్రమాణం చేయడం’ కంటే సులభంగా అర్థమవుతుంది; ‘శాపాలు పెట్టుకోవడం’ దూషణ అనే అపార్థాన్ని తగ్గిస్తూ మూలంలోని తీవ్రతను నిలుపుతుంది.
