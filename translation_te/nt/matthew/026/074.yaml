revisions:
- from: అప్పుడు అతడు శాపాలు పెట్టుకుంటూ, ఒట్టు పెట్టుకుంటూ[a], “ఆ మనిషి ఎవరో నాకు తెలియదు” అని చెప్పడం మొదలుపెట్టాడు. వెంటనే కోడి కూసింది.
  to: అప్పుడు అతడు శాపాలు పెట్టడం, ప్రమాణం చేయడం మొదలుపెట్టి, “ఆ మనిషి ఎవరో నాకు తెలియదు” అన్నాడు. వెంటనే కోడి కూసింది.
  rationale: 'The revision preserves the Greek coordination and ingressive force: Peter begins both invoking curses and swearing. It avoids making the curses reflexively directed at Peter in the main text, while the footnote responsibly records the likely contextual sense and the source’s grammatical ambiguity. The revised phrasing is idiomatic modern standard Telugu and maintains the sober narrative register.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:38Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the sequence, Peter’s escalating denial, the direct denial, and the immediate rooster crow. However, “శాపాలు పెట్టుకుంటూ” makes the curses explicitly reflexive in the main text, whereas the Greek does not state the target of the curses. Also, “చెప్పడం మొదలుపెట్టాడు” grammatically makes only the act of speaking ingressive, rather than clearly representing that he began invoking curses and swearing.
  naturalness: The Telugu is generally clear, but “ఒట్టు పెట్టుకుంటూ” is comparatively colloquial and “శాపాలు పెట్టుకుంటూ” is interpretively specific. “శాపాలు పెట్టడం, ప్రమాణం చేయడం మొదలుపెట్టి” is natural modern standard Telugu while retaining the two coordinated actions.
  terminology: Use “ప్రమాణం చేయడం” for ὀμνύειν in this formal narrative register. Retain a footnote to explain that the curse formula likely involved a self-imprecation, without placing that unstated object in the translation itself.
  issues:
  - severity: medium
    issue: The main text specifies that Peter invoked curses on himself.
    rationale: “శాపాలు పెట్టుకుంటూ” is reflexive and thus goes beyond καταθεματίζειν, whose curse target is not expressed in the Greek. The likely self-imprecatory sense belongs in the footnote, not as an explicit main-text assertion.
  - severity: medium
    issue: The ingressive verb is attached chiefly to “చెప్పడం.”
    rationale: ἤρξατο governs both infinitives, καταθεματίζειν and ὀμνύειν. The Telugu should more directly state that he began invoking curses and making oaths.
  - severity: low
    issue: “ఒట్టు పెట్టుకుంటూ” is less suitable for the stated formal narrative register.
    rationale: “ప్రమాణం చేయడం” is clear, standard, and accurately expresses oath-taking without colloquial coloring.
  revised_text: అప్పుడు అతడు శాపాలు పెట్టడం, ప్రమాణం చేయడం మొదలుపెట్టి, “ఆ మనిషి ఎవరో నాకు తెలియదు” అన్నాడు. వెంటనే కోడి కూసింది.
  revised_footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అతడు శాపాలు పెట్టడం మరియు ప్రమాణం చేయడం మొదలుపెట్టాడు.” తన నిరాకరణను బలపరచడానికి, తన మాట అబద్ధమైతే తనపై శాపం రావాలని అతడు కోరుకున్న భావం కావచ్చు; అయితే శాపం ఎవరిపై అన్నది మూలపాఠంలో స్పష్టంగా చెప్పబడలేదు.
