source:
  edition: SBLGNT
  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: te
  text: అయితే అతడు అందరి ఎదుట దానిని నిరాకరించి, “నువ్వు చెప్పేది ఏమిటో నాకు తెలియదు” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: దాన్ని నిరాకరిస్తూ
  rationale: ఇక్కడ క్రియ ముందున్న ఆరోపణను పేతురు తిరస్కరించాడని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు సందర్భంలో అంతర్లీనంగా ఉన్న కర్మను ‘దాన్ని’ అని చేర్చాం; యేసునే నేరుగా నిరాకరించాడని వాక్యంలో లేని విశిష్టతను జోడించలేదు.
- source_word: ἔμπροσθεν πάντων
  choice: అందరి ఎదుట
  rationale: ఈ పదబంధం అక్కడున్న వారందరి సమక్షంలో బహిరంగంగా జరిగిన నిరాకరణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λέγων
  choice: అన్నాడు
  rationale: గ్రీకు వర్తమాన కృదంతాన్ని తెలుగులో సహజమైన కథన నిర్మాణమైన ‘...అన్నాడు’తో వ్యక్తం చేశాం.
- source_word: Οὐκ οἶδα
  choice: నాకు తెలియదు
  rationale: తెలుసుకోవడం అనే క్రియకు ఉన్న సరళమైన నిరాకరణను సహజమైన తెలుగు వాక్యరూపంలో నిలిపాం.
- source_word: τί λέγεις
  choice: నువ్వు చెప్పేది ఏమిటో
  rationale: గ్రీకు పదబంధానికి నేరుగా సరిపోయే ‘నువ్వు చెప్పేది ఏమిటో’ అనే రూపం, పేతురు అవగాహన లేదని చెప్పిన భావాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా అందిస్తుంది.
theological_decisions:
- issue: పేతురు చేసిన నిరాకరణ స్వరూపం
  choice: ముందు చేసిన ఆరోపణను అతడు అందరి ఎదుట నిరాకరించినట్లు అనువదించడం
  alternative: పేతురు యేసును నేరుగా నిరాకరించాడని లేదా పనిపిల్లను ఎరుగనని చెప్పినట్లు విశిష్టీకరించడం
  rationale: గ్రీకు పాఠంలో ἠρνήσατοకు కర్మ స్పష్టంగా లేదు; అది ముందున్న మాటకు ప్రతిస్పందన. అందువల్ల సందర్భానికి అవసరమైన ‘దాన్ని’ మాత్రమే చేర్చి, పాఠం చెప్పని నిర్దిష్ట కర్మను దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్తతను కాపాడుతూ తెలుగు సహజ వాక్యక్రమాన్ని ఉపయోగించాం.
