  verdict: approve
  source_fidelity: The Telugu accurately conveys the explanatory γάρ, the repeated πάντοτε, the collective reference to τοὺς πτωχούς, the presence sense of ἔχετε with μεθ’ ἑαυτῶν, and the contrast introduced by δέ. “నేను ఎప్పుడూ మీతో ఉండను” naturally expresses the temporal limitation intended by οὐ πάντοτε without adding interpretation.
  naturalness: The wording is fluent, modern standard Telugu. “పేదవారు ఎప్పుడూ మీతో ఉంటారు; కానీ నేను ఎప్పుడూ మీతో ఉండను” is clear and preserves the verse’s balanced contrast.
  terminology: “పేదవారు” is respectful and idiomatic for the collective plural. The footnote alternative “పేద ప్రజలు” is valid, and its anchor is correctly placed after the term it explains. No doctrinally loaded terminology has been introduced.
