id: MAT.26.11
reference: Matthew 26:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: te
  text: ఎందుకంటే పేదవారు[a] ఎప్పుడూ మీతో ఉంటారు; కానీ నేను ఎప్పుడూ మీతో ఉండను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పేద ప్రజలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: ఎప్పుడూ
  rationale: నిరంతర లభ్యత లేదా ఉనికిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; రెండు భాగాల్లోని పునరుక్తిని కూడా నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు కారణాన్ని వివరిస్తున్న సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τοὺς πτωχοὺς
  choice: పేదవారు
  rationale: పేద వ్యక్తులను సమూహంగా సూచించే గ్రీకు బహువచన భావాన్ని గౌరవప్రదమైన, సాధారణ తెలుగు రూపంలో అందిస్తుంది.
- source_word: ἔχετε
  choice: మీతో ఉంటారు / మీతో ఉండను
  rationale: ఇక్కడ సొంతం చేసుకోవడం కాదు, సమక్షంలో లేదా అందుబాటులో ఉండడం ఉద్దేశం. అందువల్ల తెలుగులో ‘ఉండు’ అనే క్రియ సహజంగా భావాన్ని అందిస్తుంది.
- source_word: μεθ’ ἑαυτῶν
  choice: మీతో
  rationale: శిష్యులకు సంబంధించి తోడుగా లేదా సమక్షంలో ఉండటాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐμὲ
  choice: నేను
  rationale: తెలుగు వాక్య నిర్మాణంలో ‘ఉండు’ క్రియతో యేసును సూచించే ప్రథమ పురుష కర్త రూపం సహజం; గ్రీకులోని ప్రధాన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: కానీ
  rationale: పేదవారి నిరంతర ఉనికికి, యేసు వారితో ఉండే పరిమిత కాలానికి మధ్యనున్న వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
- source_word: οὐ πάντοτε
  choice: ఎప్పుడూ ... ఉండను
  rationale: మొదటి πάντοτεతో ఉన్న పదపునరుక్తిని కాపాడుతూ, నిరాకరణను సహజమైన తెలుగు వాక్యక్రమంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసు సమక్షం గురించిన సూచన
  choice: పేదవారు శిష్యులతో నిరంతరం ఉండటానికి, యేసు వారితో భౌతికంగా ఉండే కాలం పరిమితమైనదిగా ఉండటానికి మధ్య కాలసంబంధమైన వ్యత్యాసాన్ని నిలిపాం.
  alternative: ఈ మాట పేదవారి సంరక్షణ ప్రాముఖ్యతను తగ్గిస్తోందని అర్థం చేసుకోవడం.
  rationale: గ్రీకు వాక్యం ప్రధానంగా కాలసంబంధమైన వ్యత్యాసాన్ని చేస్తుంది; పేదవారి పట్ల కరుణను నిరాకరించడం లేదా తగ్గించడం అనే భావాన్ని పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘కలిగి ఉంటారు’ అనే అక్షరార్థ రూపం యాజమాన్య భావాన్ని కలిగించవచ్చునని, సమక్ష భావానికి ‘మీతో ఉంటారు’ ఎంచుకోబడింది.
