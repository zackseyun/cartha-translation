id: MAT.26.17
reference: Matthew 26:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: te
  text: పులియని రొట్టెల పండుగ మొదటి రోజున[a], శిష్యులు యేసు దగ్గరికి వచ్చి, “మీరు పస్కా భోజనం చేయడానికి మేము ఎక్కడ ఏర్పాట్లు చేయాలని కోరుకుంటున్నారు?” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పాఠంలో అక్షరార్థంగా, “పులియని రొట్టెల మొదటి రోజున” అని ఉంది. పస్కా కాలక్రమానికి సంబంధించిన చర్చలను అనువాదం ఒక్కటే పరిష్కరించకూడదు.
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: పులియని రొట్టెల పండుగ మొదటి రోజున
  rationale: కాలాన్ని సూచించే దత్తివ విభక్తి నిర్మాణాన్ని సహజమైన తెలుగులో ‘మొదటి రోజున’గా ఇచ్చాం. τῶν ἀζύμων అనేది పులియని రొట్టెల పండుగకాలాన్ని సూచిస్తుంది; అందువల్ల ‘పండుగ’ను స్పష్టత కోసం చేర్చాం. δέ స్వల్ప అనుసంధాన పదం కాబట్టి తెలుగులో ప్రత్యేకంగా అనువదించకపోవడం సహజం.
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: శిష్యులు యేసు దగ్గరికి వచ్చి
  rationale: προσέρχομαι ఇక్కడ ఒకరి దగ్గరికి రావడం లేదా సమీపించడం అనే భావం ఇస్తుంది. ‘యేసు దగ్గరికి వచ్చి’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, దిశను స్పష్టంగా ఉంచుతుంది. మూలంలో లేని ‘ఆయన శిష్యులు’ అనే స్వామ్యాన్ని చేర్చలేదు.
- source_word: λέγοντες
  choice: అని అన్నారు
  rationale: సమకాలీన క్రియను తెలిపే వర్తమాన కృదంతాన్ని తెలుగు ప్రత్యక్ష సంభాషణకు సహజమైన ‘అని అన్నారు’తో అందించాం. ప్రశ్న ఉన్నప్పటికీ, మూలంలోని సాధారణ ‘చెబుతూ’ అనే భావాన్ని మరింత నిర్దిష్టమైన ‘అడిగారు’గా మార్చలేదు.
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: మేము మీ కోసం ఎక్కడ ఏర్పాట్లు చేయాలని కోరుకుంటున్నారు?
  rationale: θέλωను ఆధునిక గౌరవప్రద తెలుగులో ‘కోరుకుంటున్నారు’గా ఇచ్చాం. మొదటి పురుష బహువచన విధ్యర్థక సంభావనను ‘మేము ... చేయాలని’గా, σοι అనే ప్రయోజన దత్తివాన్ని ‘మీ కోసం’గా నిలిపాం. ఇక్కడ భోజనం కోసం స్థలం మరియు అవసరమైన ఏర్పాట్లు రెండూ సందర్భంలో ఉన్నందున ἑτοιμάζωకు ‘ఏర్పాట్లు చేయడం’ సహజంగా సరిపోతుంది.
- source_word: φαγεῖν τὸ πάσχα
  choice: పస్కా భోజనం చేయడానికి
  rationale: πάσχα పండుగను గానీ, పస్కా భోజనాన్ని గానీ సూచించగలదు. ఇక్కడ ‘తినడానికి’ అనే క్రియతో వచ్చినందున భోజనం ఉద్దేశంలో ఉంది. తెలుగులో ‘భోజనం చేయడం’ సహజమైన వ్యక్తీకరణ; ‘పస్కా’ అనే చారిత్రక పండుగపేరును నిలిపాం.
theological_decisions:
- issue: ‘పులియని రొట్టెల పండుగ మొదటి రోజు’ మరియు పస్కా భోజన సమయానికి సంబంధించిన సువార్తల కాలక్రమ ప్రశ్న
  choice: గ్రీకు పాఠంలోని పండుగకాల వ్యక్తీకరణను యథాతథ భావంతో ‘పులియని రొట్టెల పండుగ మొదటి రోజున’గా నిలిపాం.
  alternative: ‘పులియని రొట్టెల పండుగకు ముందు రోజు’ లేదా ‘పస్కా మొదటి రోజు’ అని వ్యాఖ్యానాత్మకంగా మార్చడం.
  rationale: మూలపాఠం ‘పులియని వాటి మొదటి రోజున’ అని చెబుతుంది. కాలక్రమ చర్చను అనువాదంలోనే పరిష్కరించకుండా, పాఠంలోని ఉద్రిక్తతను మరియు సాధ్యమైన ప్రశ్నను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. యేసును ఉద్దేశించిన సంభాషణలో గౌరవ బహువచన రూపాలైన ‘మీరు/మీ కోసం/కోరుకుంటున్నారు’ను ఉపయోగించాం. ‘పులియని రొట్టెల పండుగ’ మరియు ‘పస్కా’ అనే స్థిర బైబిలు-సాంస్కృతిక పదాలను వివరణాత్మక పాదటిప్పణులతో నిలిపాం.
