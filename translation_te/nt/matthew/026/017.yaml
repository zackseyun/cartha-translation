review_pass:
  verdict: revise
  source_fidelity: The draft retains the temporal expression, the disciples’ approach to Jesus, and the question about preparing for Jesus to eat the Passover. Rendering πάσχα as “పస్కా భోజనం” is contextually justified and is appropriately qualified by footnote b.
  naturalness: 'The question as drafted has a grammatical/semantic mismatch: “మేము ... చేయాలని కోరుకుంటున్నారు” can make the disciples, rather than Jesus, appear to be the ones desiring the action. Reordering the clause makes Jesus clearly the implicit subject of “కోరుకుంటున్నారు” and produces natural modern Telugu.'
  terminology: “పులియని రొట్టెల పండుగ” and “పస్కా” are suitable standard Telugu biblical-cultural terms. The respectful plural address to Jesus is maintained. “ఎర్పాట్లు చేయడం” naturally represents the contextually elliptical object of ἑτοιμάσωμεν.
  issues:
  - severity: medium
    issue: Ambiguous/misaligned subject in the direct question
    rationale: 'In “మేము మీ కోసం ఎక్కడ ఏర్పాట్లు చేయాలని కోరుకుంటున్నారు?”, the placement of “మేము” immediately before “చేయాలని కోరుకుంటున్నారు” creates an awkward subject association. Greek θέλεις has Jesus as the singular subject: “Where do you want us to prepare...?” The revision makes this relation clear without adding interpretive content.'
  revised_text: పులియని రొట్టెల పండుగ మొదటి రోజున[a], శిష్యులు యేసు దగ్గరికి వచ్చి, “మీరు పస్కా భోజనం చేయడానికి మేము ఎక్కడ ఏర్పాట్లు చేయాలని కోరుకుంటున్నారు?” అని అన్నారు.
