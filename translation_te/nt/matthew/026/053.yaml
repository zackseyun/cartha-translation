id: MAT.26.53
reference: Matthew 26:53
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: te
  text: లేక, నేను నా తండ్రిని వేడుకోలేనని అనుకుంటున్నావా?[a] నేను వేడుకుంటే ఆయన వెంటనే పన్నెండు లెగియోన్లకంటే[c] ఎక్కువ దేవదూతల దళాలను నా కోసం సమకూర్చుతాడు కదా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వేడుకోను’ అనే మాటను ‘సహాయం కోసం పిలుచు’ లేదా ‘నా తండ్రిని అడుగు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నా పక్కన ఉంచుతాడు’; అంటే, నా సహాయం కోసం అందుబాటులో ఉంచుతాడు.
    reason: lexical_alternative
  - marker: c
    text: ‘లెగియోను’ రోమా సైన్యంలోని పెద్ద సైనిక విభాగం. ఈ మాట అపారమైన పరలోక సైన్యాన్ని నొక్కిచెబుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: లేకపోతే
  rationale: మునుపటి మందలింపులో మరో ప్రత్యామ్నాయాన్ని సూచించే ప్రశ్నను సహజమైన తెలుగులో కొనసాగిస్తుంది.
- source_word: δοκεῖς
  choice: అనుకుంటున్నావా?
  rationale: నేరుగా అడిగే అలంకారప్రశ్న బలాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ δύναμαι
  choice: వేడుకోలేనని
  rationale: అనుమతి లేదా సంకల్పం కాక, సామర్థ్యాన్ని సూచించే గ్రీకు భావాన్ని నిలుపుతుంది.
- source_word: παρακαλέσαι
  choice: వేడుకోను
  rationale: ఈ సందర్భంలో సహాయం కోసం తండ్రికి చేసే గంభీరమైన అభ్యర్థనను సూచిస్తుంది; ‘అడుగు’ కంటే petitionary force స్పష్టంగా ఉంటుంది.
- source_word: τὸν πατέρα μου
  choice: నా తండ్రిని
  rationale: యేసు దేవునితో తన కుమార సంబంధాన్ని నేరుగా వ్యక్తం చేసిన రూపాన్ని నిలుపుతుంది.
- source_word: παραστήσει μοι
  choice: నాకు సహాయంగా ఉంచలేడా
  rationale: అక్షరార్థంగా ‘నా పక్కన నిలబెడతాడు’ అనే భావం; సహాయం కోసం అందుబాటులో ఉంచడాన్ని సహజంగా తెలియజేస్తుంది, ‘పంపు’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: ἄρτι
  choice: వెంటనే
  rationale: దైవిక సహాయం తక్షణమే అందుబాటులో ఉండగలదనే సందర్భోచిత భావాన్ని తెలియజేస్తుంది.
- source_word: πλείω δώδεκα
  choice: పన్నెండు ... కంటే ఎక్కువ
  rationale: సంఖ్యను మించిన పరిమాణాన్ని సూటిగా వ్యక్తం చేస్తుంది.
- source_word: λεγιῶνας
  choice: దళాలు
  rationale: రోమా సైనిక విభాగాన్ని సూచించే పదాన్ని సాధారణ ఆధునిక తెలుగు పాఠకుడు గ్రహించగల రూపంలో ఇస్తుంది; సాంస్కృతిక పరిమాణం పాదసూచికలో వివరించబడుతుంది.
- source_word: ἀγγέλων
  choice: దేవదూతలు
  rationale: ఈ సందర్భంలో మానవ దూతలు కాక పరలోక జీవులే ఉద్దేశించబడ్డారు.
theological_decisions:
- issue: దైవిక సహాయాన్ని కోరడంలో యేసు అసమర్థత, అనుమతి లేదా సంకల్పం—ఏ భావాన్ని అనువదించాలి?
  choice: 'సామర్థ్యంగా: ‘నేను ... వేడుకోలేనని’'
  alternative: అనుమతి లేదా ఇష్టంలేనితనాన్ని సూచించే సడలించిన అనువాదం
  rationale: δύναμαι సామర్థ్యం లేదా శక్తిని సూచిస్తుంది. యేసు అరెస్టు ఆయన నిస్సహాయత వల్ల కాదనే ఉద్వేగాన్ని వచనం కలిగించినా, దానిని వ్యాఖ్యానంగా విస్తరించకుండా ప్రశ్న రూపంలోనే నిలుపుతుంది.
- issue: παραστήσει అనే భవిష్యత్ సూచకాన్ని రెండవ అలంకారప్రశ్నగా తెలుగులో వ్యక్తం చేయడం
  choice: ‘ఆయన ... ఉంచలేడా?’
  alternative: ‘ఆయన ... ఉంచుతాడు’
  rationale: గ్రీకులో మొదటి ప్రశ్నలోని ‘నేను చేయలేనని అనుకుంటున్నావా?’ అనే పరిధిలో తరువాతి ఫలితం వస్తుంది. తెలుగులో రెండు అనుసంధానమైన ప్రశ్నలుగా ఇవ్వడం సహజంగా ఉండి, తండ్రి స్పందనపై సందేహాన్ని కాక మొత్తం ఊహనే సవాలు చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, నేరుగా వినిపించే అలంకారప్రశ్న శైలిని వాడాం. ‘లెగియోన్లు’ అనే అపరిచిత లిప్యంతరీకరణకు బదులు ‘దళాలు’ అని ఇచ్చి, రోమా సైనిక నేపథ్యాన్ని పాదసూచికలో నిలిపాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
