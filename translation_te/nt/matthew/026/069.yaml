  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని ఉపయోగించాం. పనిపిల్ల మాటలో సామాజిక సందర్భానికి తగిన సాధారణ ఏకవచన సంబోధన ‘నువ్వు’ వాడాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘పనిపిల్ల’ పదానికే జతచేశాం.
