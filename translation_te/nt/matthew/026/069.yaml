  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: te
  text: పేతురు బయట ప్రాంగణంలో కూర్చుని ఉన్నాడు. ఒక పనిపిల్ల[a] అతని దగ్గరకు వచ్చి, “నువ్వు కూడా గలిలయుడైన యేసుతో ఉన్నావు” అంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సేవకురాలు” లేదా “బానిస బాలిక.” గ్రీకు పదం παιδίσκη యువ సేవకురాలిని సూచించవచ్చు; కొన్నిసార్లు ఆమె బానిస స్థితిని కూడా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్ప కథన సంధానాన్ని సూచిస్తుంది; తెలుగులో వాక్యక్రమమే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది. ‘అప్పుడు’ అని చేరిస్తే మూలంలో లేని కాలసూచన బలపడవచ్చు.
- source_word: ἐκάθητο ἔξω
  choice: బయట … కూర్చుని ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న స్థితిని సూచిస్తుంది; ‘కూర్చుని ఉన్నాడు’ దానిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν τῇ αὐλῇ
  choice: ప్రాంగణంలో
  rationale: ఇది ప్రధాన యాజకుని నివాసంలోని బహిరంగ ఆవరణను సూచిస్తుంది; ‘ప్రాంగణం’ స్పష్టమైన, ప్రస్తుత ప్రామాణిక తెలుగు పదం.
- source_word: προσῆλθεν αὐτῷ
  choice: అతని దగ్గరకు వచ్చి
  rationale: శారీరకంగా సమీపించడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μία παιδίσκη
  choice: ఒక పనిపిల్ల
  rationale: μία లోని అనిర్దిష్ట పరిచయ భావాన్ని ‘ఒక’ నిలుపుతుంది. παιδίσκη యువ సేవకురాలిని, కొన్నిసార్లు బానిస స్థితిగల బాలికను సూచించగలదు; ‘పనిపిల్ల’ సందర్భంలోని సామాజిక పాత్రను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: λέγουσα
  choice: … అంది
  rationale: తెలుగులో ప్రత్యక్ష వాక్యం తరువాత పరిమిత క్రియ వాడటం సహజం; గ్రీకు కృదంతంలోని మాటల క్రియను అర్థనష్టంలేకుండా అందిస్తుంది.
- source_word: Καὶ σὺ
  choice: నువ్వు కూడా
  rationale: καί మరియు బలప్రయోగంతో ఉన్న σὺ, యేసుతో ఉన్న ఇతరులతో పాటు పేతురును కూడా చేర్చుతున్నాయి; ‘కూడా’ ఆ ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἦσθα μετὰ
  choice: తో ఉన్నావు
  rationale: మూలంలోని సూటి సహవాస సంబంధాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: గలిలయుడైన యేసు
  rationale: Γαλιλαίου ఇక్కడ యేసును గుర్తించే ప్రాంతీయ విశేషణం; ‘గలిలయుడైన’ ఆ బిరుదు స్వరూపాన్ని నిలుపుతుంది.
