  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: te
  text: అప్పుడు పన్నెండుమందిలో ఒకడు, ఇస్కరియోతు యూదా అనే వాడు, ప్రధాన యాజకుల దగ్గరకు వెళ్లాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: తదుపరి సంఘటనను కథాక్రమంలో పరిచయం చేసే కాలసూచక పదంగా సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: πορευθεὶς
  choice: వెళ్లాడు
  rationale: గ్రీకులోని క్రియావిశేషణాత్మక కృదంతాన్ని తెలుగులో సహజమైన సమాపక క్రియగా వ్యక్తం చేసి, ప్రధాన యాజకుల వైపు జరిగిన గమనాన్ని నిలుపుతుంది.
- source_word: εἷς τῶν δώδεκα
  choice: పన్నెండుమందిలో ఒకడైన
  rationale: భాగసూచక గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది; ఇది యేసు ఎంపిక చేసిన పన్నెండుమంది సమూహాన్ని సూచిస్తుంది.
- source_word: ὁ λεγόμενος
  choice: అని పిలువబడే వాడు
  rationale: యూదాను గుర్తించే గ్రీకు కృదంత నిర్మాణంలోని స్పష్టతను నిలుపుతుంది.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: ఇస్కరియోతు యూదా
  rationale: తెలుగు బైబిల్ వాడుకకు అనుగుణంగా వ్యక్తి పేరు, బిరుదును లిప్యంతరీకరించింది.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: ప్రధాన యాజకుల దగ్గరకు
  rationale: πρός తో కూడిన కర్మవిభక్తి సూచించే గమ్యదిశను ‘దగ్గరకు’ సహజంగా తెలియజేస్తుంది; ἀρχιερεῖς అనేది సీనియర్ యాజక అధికారులను సూచిస్తుంది.
theological_decisions:
- issue: τῶν δώδεκα అనే సమూహ సూచన
  choice: పన్నెండుమందిలో ఒకడు
  alternative: పన్నెండుగురిలో ఒకడు / ‘పన్నెండుమంది’లో ఒకడు
  rationale: ఇది ప్రధానంగా శైలీ-పదప్రయోగ నిర్ణయం. తెలుగు లిపిలో పెద్ద/చిన్న అక్షరాల వ్యత్యాసం లేకపోవడం వల్ల ఆంగ్లంలోని ‘twelve/Twelve’ తేడాను నేరుగా చూపలేం; సాధారణ సంఖ్యావాచక రూపం సందర్భంలో ఆ ప్రత్యేక సమూహాన్ని స్పష్టంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సహజమైన కథనశైలి, గౌరవప్రదమైన బైబిల్ పదజాలం. వాక్యం మూలపాఠంలో తదుపరి వచనానికి కొనసాగుతున్నందున చివర పూర్తి విరామం బదులు కామా ఉంచవచ్చు; ఇక్కడ ఇచ్చిన పాఠ్యంలో మూల ఆంగ్ల విరామచిహ్నానికి అనుగుణంగా ప్రచురణలో కామా వాడటం సముచితం.
