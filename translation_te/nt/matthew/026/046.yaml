  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ἤγγικεν ὁ παραδιδούς με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/046.yaml
  text: Get up, let us go. Look, my betrayer[a] is near.
translation:
  language: te
  text: లేవండి, వెళ్దాం. ఇదిగో, నన్ను అప్పగించేవాడు[a] దగ్గరికి వచ్చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకు ద్రోహం చేసేవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: లేవండి
  rationale: ఇది శిష్యులను ఉద్దేశించిన బహువచన ఆజ్ఞ; ఆధునిక తెలుగులో సహజంగా, నేరుగా ఉంది.
- source_word: ἄγωμεν
  choice: వెళ్దాం
  rationale: ప్రథమ పురుష బహువచన hortatory subjunctive భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἰδού
  choice: ఇదిగో
  rationale: తక్షణంగా జరుగుతున్న పరిణామంపై శ్రద్ధను ఆకర్షించే మూలపదపు సజీవ బలాన్ని నిలుపుతుంది.
- source_word: ἤγγικεν
  choice: దగ్గరికి వచ్చేశాడు
  rationale: perfect రూపం సూచించే—సమీపానికి వచ్చి ఇప్పుడు దగ్గరగా ఉన్న—ఫలితస్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ παραδιδούς με
  choice: నన్ను అప్పగించేవాడు
  rationale: substantival participle లోని స్పష్టమైన ‘అప్పగించడం’ అనే కార్యాన్ని నిలుపుతుంది; సందర్భంలో ద్రోహభావం ఉన్నా దానిని ప్రధాన పాఠంలో మాత్రమే అర్థవివరణగా స్థిరపరచదు.
theological_decisions:
- issue: శ్రమల సందర్భంలో παραδιδούς అనువాదం
  choice: నన్ను అప్పగించేవాడు
  alternative: నాకు ద్రోహం చేసేవాడు
  rationale: క్రియకు ప్రత్యక్షంగా ‘అప్పగించడం/చేతికి అందించడం’ అనే అర్థం ఉంది; ఈ సందర్భంలో అది ద్రోహమే అయినప్పటికీ, మూలంలోని కార్యరూపాన్ని ఉంచడం genuine lexical tensionను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; అత్యవసరతతో కూడిన ప్రత్యక్ష సంభాషణకు తగిన సహజ, గౌరవప్రదమైన శైలి. ‘లేవండి’ బహువచన సంబోధనను, ‘వెళ్దాం’ సమిష్టి ప్రేరణను స్పష్టంగా ఉంచాయి.
