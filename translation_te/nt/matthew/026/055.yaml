id: MAT.26.55
reference: Matthew 26:55
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: te
  text: 'ఆ సమయంలో యేసు జనసమూహాలతో ఇలా అన్నాడు: “నేను దోపిడీదారుణ్ణన్నట్లు నన్ను అరెస్టు చేయడానికి కత్తులతోనూ కర్రలతోనూ బయలుదేరి వచ్చారా? ప్రతిరోజూ నేను దేవాలయంలో కూర్చొని బోధిస్తూ ఉండేవాణ్ణి, మీరు నన్ను పట్టుకోలేదు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ఆ సమయంలో
  rationale: తెలుగులో సహజమైన కాలసూచన; గ్రీకు పదబంధంలోని తక్షణ సందర్భాన్ని నిలుపుతుంది.
- source_word: τοῖς ὄχλοις
  choice: జనసమూహాలతో
  rationale: ὄχλοις బహువచన రూపాన్ని ప్రతిబింబిస్తూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: నేను దోపిడీదారుణ్ణన్నట్లు
  rationale: యేసును ప్రమాదకర నేరస్థునిలా పరిగణించి వచ్చిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; λῃστής పదంలోని విస్తృత భావపరిధిని పాదసూచికలో ఉంచింది.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: కత్తులతోనూ దుడ్డుకర్రలతోనూ
  rationale: μάχαιραι ఆయుధాలైన కత్తులను, ξύλα ఇక్కడ కొట్టడానికి వాడే బలమైన కర్రలను సూచిస్తాయి.
- source_word: συλλαβεῖν με
  choice: నన్ను పట్టుకోవడానికి
  rationale: ఈ సందర్భంలోని నిర్బంధించడానికి వచ్చిన చర్యను సరళంగా తెలియజేస్తుంది.
- source_word: καθ’ ἡμέραν
  choice: ప్రతిరోజూ
  rationale: κατά యొక్క పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయంలో
  rationale: ἱερόν దేవాలయ సముదాయాన్ని సూచిస్తుంది; సందర్భంలో ‘దేవాలయం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంది.
- source_word: ἐκαθεζόμην διδάσκων
  choice: కూర్చొని బోధిస్తూ ఉండేవాణ్ణి
  rationale: అసంపూర్ణ భూతకాల క్రియలోని అలవాటైన, కొనసాగుతున్న చర్యను మరియు సమకాలిక బోధనను నిలుపుతుంది.
- source_word: οὐκ ἐκρατήσατέ με
  choice: మీరు నన్ను పట్టుకోలేదు
  rationale: κρατέω యొక్క పట్టుకోవడం/అదుపులోకి తీసుకోవడం అనే భావాన్ని ఇక్కడ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: λῃστής పదానికి ఉన్న నేరపరమైన లేదా రాజకీయమైన భావ ఛాయ
  choice: దోపిడీదారుడు
  alternative: బందిపోటు; తిరుగుబాటుదారుడు
  rationale: ఈ సందర్భంలో యేసును హింసాత్మకమైన ప్రమాదకర నేరస్థునిలా చూస్తున్నారనే ప్రధాన భావం స్పష్టం. అయితే పదాన్ని తప్పనిసరిగా రాజకీయ తిరుగుబాటుదారుడిగానే పరిమితం చేయకుండా ప్రత్యామ్నాయ భావాలను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే సహజ వాక్యనిర్మాణం ఉపయోగించబడింది. అలవాటైన గత చర్యను ‘ఉండేవాణ్ణి’ ద్వారా వ్యక్తం చేశాం.
