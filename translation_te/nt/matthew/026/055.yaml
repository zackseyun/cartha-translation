revisions:
- from: 'ఆ సమయంలో యేసు జనసమూహాలతో ఇలా అన్నాడు: “నేను దోపిడీదారుణ్ణన్నట్లు[a] నన్ను పట్టుకోవడానికి కత్తులతోనూ దుడ్డుకర్రలతోనూ బయలుదేరి వచ్చారా? ప్రతిరోజూ నేను దేవాలయంలో కూర్చొని బోధిస్తూ ఉండేవాణ్ణి; అయినా మీరు నన్ను పట్టుకోలేదు.”'
  to: 'ఆ సమయంలో యేసు జనసమూహాలతో ఇలా అన్నాడు: “నేను దోపిడీదారుణ్ణన్నట్లు నన్ను అరెస్టు చేయడానికి కత్తులతోనూ కర్రలతోనూ బయలుదేరి వచ్చారా? ప్రతిరోజూ నేను దేవాలయంలో కూర్చొని బోధిస్తూ ఉండేవాణ్ణి, మీరు నన్ను పట్టుకోలేదు.”'
  rationale: The revision makes the arrest/seize distinction explicit, uses a neutral modern term for the wooden weapons, and removes the added concessive connector. The λῃστής rendering and its lexical-alternative footnote are retained. No footnote is needed for the English audit trail's former-rendering note, since it does not represent a source-language ambiguity requiring a Telugu anchor.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal setting, the armed approach, the habitual public teaching in the temple, and the failure to take Jesus then. A small revision better distinguishes συλλαβεῖν ('arrest') from κρατέω ('seize/take hold of') and avoids adding an adversative not explicit in καί.
  naturalness: The register is generally modern and clear. 'కర్రలతో' is more broadly natural and neutral than 'దుడ్డుకర్రలతో,' while 'అరెస్టు చేయడానికి' is an established modern Telugu expression in this legal-custodial context.
  terminology: '''దోపిడీదారుడు'' is a suitable main rendering for λῃστής. The footnote appropriately preserves the possible bandit/insurrectionist nuance without requiring a political sense. ''దేవాలయంలో'' is acceptable for ἱερόν in this context.'
  issues:
  - severity: low
    issue: The two Greek verbs for taking Jesus are rendered identically as 'పట్టుకోవడానికి' / 'పట్టుకోలేదు.'
    rationale: συλλαβεῖν in the armed-party context is naturally 'to arrest,' whereas ἐκρατήσατέ conveys 'you did not seize/take hold of me.' Distinguishing them reflects the source's wording and rhetorical force.
  - severity: low
    issue: '''అయినా'' introduces an explicit concessive relation where the Greek has καί (''and'').'
    rationale: The contrast is clear from context, but it need not be supplied as an overt concessive. A coordinate clause preserves the source more closely.
  - severity: low
    issue: '''దుడ్డుకర్రలతో'' is more marked than needed for ξύλων.'
    rationale: The Greek denotes wooden weapons such as clubs or staves. 'కర్రలతో' is clear, standard, and retains the needed breadth.
  revised_text: 'ఆ సమయంలో యేసు జనసమూహాలతో ఇలా అన్నాడు: “నేను దోపిడీదారుణ్ణన్నట్లు నన్ను అరెస్టు చేయడానికి కత్తులతోనూ కర్రలతోనూ బయలుదేరి వచ్చారా? ప్రతిరోజూ నేను దేవాలయంలో కూర్చొని బోధిస్తూ ఉండేవాణ్ణి, మీరు నన్ను పట్టుకోలేదు.”'
  revised_footnotes:
