    text: లేదా “బందిపోటునన్నట్లు”; కొన్ని సందర్భాల్లో ఈ గ్రీకు పదం హింసాత్మక దోపిడీదారుణ్ణి లేదా తిరుగుబాటుదారుణ్ణి కూడా సూచించవచ్చు.
    reason: lexical_alternative
