  text: When evening came[a], he reclined at the table with the twelve disciples.
translation:
  language: te
  text: సాయంకాలమైనప్పుడు, ఆయన పన్నెండు మంది శిష్యులతో[a] కలిసి భోజన బల్ల వద్ద వాలియున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘పన్నెండు మంది శిష్యులతో’ అనే బదులు కేవలం ‘పన్నెండు మందితో’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: సాయంకాలమైనప్పుడు
  rationale: ఈ genitive absolute కాలసందర్భాన్ని సూచిస్తుంది. ఈ ఎంపిక ఆధునిక తెలుగులో సహజంగా ఉండి, ‘సాయంకాలం వచ్చినప్పుడు/అయినప్పుడు’ అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀνέκειτο
  choice: భోజనానికి బల్ల దగ్గర వాలుకొని కూర్చున్నాడు
  rationale: ఈ క్రియ సాధారణంగా కూర్చోవడాన్ని కాదు, భోజన సందర్భంలో ఆనుకొని లేదా వాలుకొని ఉండడాన్ని సూచిస్తుంది. తెలుగులో సందర్భం స్పష్టంగా ఉండేందుకు ‘భోజనానికి’, ‘బల్ల దగ్గర’ అనే భావవ్యక్తీకరణను చేర్చాం.
- source_word: μετὰ
  choice: తో కలిసి
  rationale: Genitive‌తో వచ్చిన μετά సహవాసాన్ని సూచిస్తుంది; ‘తో కలిసి’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
- source_word: τῶν δώδεκα μαθητῶν
  choice: పన్నెండు మంది శిష్యులతో
  rationale: SBLGNT పాఠ్యంలో μαθητῶν ఉంది కాబట్టి దాన్ని ‘శిష్యులు’గా అనువదించాం. వ్యక్తులను లెక్కించేటప్పుడు ‘మంది’ వాడటం సహజ తెలుగు.
