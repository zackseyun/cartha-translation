translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ప్రాచీన భోజన పద్ధతిలో వాలుకొని భోజనం చేసే భావాన్ని కాపాడుతూ, పాఠకులకు అర్థమయ్యేలా భోజన సందర్భాన్ని స్పష్టం చేశాం.
