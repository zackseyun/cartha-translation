source:
  edition: SBLGNT
  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: te
  text: ఆయన పేతురును, జెబెదయి ఇద్దరు కుమారులను తనతో పాటు తీసుకొని, దుఃఖించడం మరియు తీవ్రంగా కలత చెందడం మొదలుపెట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దుఃఖంతోను కలవరంతోను ఉండడం మొదలుపెట్టాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν
  choice: తన వెంట తీసుకొని వెళ్లి
  rationale: ఇక్కడ యేసు ఎంపిక చేసిన శిష్యులను తనతో పాటు తీసుకువెళ్లడాన్ని ఈ భూతకాల క్రియావిశేషణ రూపం సూచిస్తుంది. ‘తన వెంట’ అనే మాట తెలుగులో సహజంగా ఈ సహవాస భావాన్ని తెలియజేస్తుంది.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: జెబెదయి ఇద్దరు కుమారులను
  rationale: గ్రీకు మూలంలోని గుర్తింపునే నిలుపుతుంది; ఈ వచనంలో లేని యాకోబు, యోహాను అనే పేర్లను అనువాదంలో చేర్చదు.
- source_word: ἤρξατο
  choice: మొదలుపెట్టాడు
  rationale: పూరక క్రియలతో వచ్చిన ఈ రూపం భావోద్వేగ స్థితి ఆరంభాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: λυπεῖσθαι
  choice: దుఃఖపడడం
  rationale: ఈ క్రియ దుఃఖాన్ని అనుభవించడాన్ని సూచిస్తుంది. ఈ ఎంపిక గంభీరమైన సందర్భానికి తగినదిగా ఉండి, ఆధునిక పాఠకులకు సహజంగా ఉంటుంది.
- source_word: ἀδημονεῖν
  choice: తీవ్రంగా కలతచెందడం
  rationale: ఈ పదం తీవ్రమైన అంతరంగ వేదన లేదా ఆందోళనను సూచిస్తుంది. ‘తీవ్రంగా కలతచెందడం’ మొదటి క్రియకంటే ఉన్న అధిక తీవ్రతను అతిశయోక్తి లేకుండా తెలియజేస్తుంది.
- source_word: καὶ ... καὶ
  choice: '..., ...'
  rationale: తెలుగులో జతగా వచ్చే రెండు పూరక క్రియారూపాలను కామాతో కలపడం సహజ ప్రవాహాన్ని ఇస్తుంది; గ్రీకులోని సంచిత భావం రెండింటినీ స్పష్టంగా ఉంచడం ద్వారా నిలుస్తుంది.
theological_decisions:
- issue: క్రీస్తు స్వరూపశాస్త్రం దృష్ట్యా యేసు భావోద్వేగ స్థితి వర్ణన
  choice: యేసు నిజమైన మానవ దుఃఖాన్ని, తీవ్రమైన కలతను అనుభవించినట్లు రెండు క్రియలనూ నేరుగా అనువదించడం
  alternative: ఆయన భావోద్వేగ బలహీనతను తగ్గించి చెప్పడం; లేదా మూలపదాల పరిధిని మించి ‘భయం’ లేదా ‘నిరాశ’గా తీవ్రత పెంచడం
  rationale: మూలంలోని రెండు క్రియలు నిజమైన దుఃఖాన్ని, తీవ్రమైన అంతరంగ కలతను తెలియజేస్తాయి. వాటిని తగ్గించకుండా, అలాగే నిస్సహాయ నిరాశగా అతిశయింపకుండా అనువదించడం మూలంలోని మానవ బాధను, దైవశాస్త్రీయ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. ‘జెబెదయి ఇద్దరు కుమారులు’ అని మూలంలోని వ్యక్తీకరణను నిలిపి, పేర్లను వివరణాత్మకంగా చేర్చలేదు.
