id: MAT.26.49
reference: Matthew 26:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εὐθέως προσελθὼν τῷ Ἰησοῦ εἶπεν· Χαῖρε, ῥαββί· καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: te
  text: అతడు వెంటనే యేసు దగ్గరకు వచ్చి, “రబ్బీ, వందనం!”[a] అని చెప్పి, ఆయనను ముద్దుపెట్టుకున్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వందనం” అనే మాటకు అక్షరార్థంగా “సంతోషించు” అని కూడా అర్థం రావచ్చు; ఇక్కడ అది పలకరింపుగా వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: 'ఈ గ్రీకు క్రియ గాఢంగా లేదా పదేపదే ముద్దుపెట్టడాన్ని సూచించవచ్చు: “ఆయనను గాఢంగా ముద్దుపెట్టుకున్నాడు” లేదా “ఆయనను పదేపదే ముద్దుపెట్టుకున్నాడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా జరిగిన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కథనంలోని వేగాన్ని నిలుపుతుంది.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: యేసు దగ్గరకు వచ్చి
  rationale: యేసు వద్దకు సమీపించి రావడం అనే భౌతిక కదలికను తెలుగులో సహజమైన క్రమంతో వ్యక్తం చేస్తుంది.
- source_word: εἶπεν
  choice: అని చెప్పి
  rationale: గ్రీకు వాక్యంలోని సాధారణ కథన క్రియను తెలుగు ప్రత్యక్ష సంభాషణ నిర్మాణానికి అనుగుణంగా అందిస్తుంది.
- source_word: Χαῖρε
  choice: వందనం
  rationale: ఇక్కడ ఇది ‘సంతోషించు’ అనే అక్షరార్థంలో కాక, సంప్రదాయ పలకరింపుగా వాడబడింది. ‘వందనం’ ఆధునిక, గౌరవప్రదమైన పలకరింపును తెలియజేస్తుంది.
- source_word: ῥαββί
  choice: రబ్బీ
  rationale: గ్రీకు మూలం సెమిటిక్ బిరుదును లిప్యంతరీకరించినట్లే, తెలుగులోనూ గుర్తించదగిన బిరుదుగా నిలుపుతుంది; దాన్ని ‘బోధకుడా’ అని వివరణాత్మకంగా మార్చదు.
- source_word: κατεφίλησεν
  choice: ముద్దుపెట్టుకున్నాడు
  rationale: ప్రధాన వచనంలో సహజమైన తెలుగు ప్రయోగాన్ని వాడుతుంది. క్రియలో ఉండగల గాఢమైన లేదా పదేపదే ముద్దుపెట్టడం అనే భావాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: సర్వనామం యేసును సూచిస్తుంది; తెలుగు గౌరవప్రయోగానికి అనుగుణంగా ‘ఆయనను’ అని అనువదించబడింది.
theological_decisions:
- issue: యూదా పలికిన Χαῖρε అనే పలకరింపు
  choice: రబ్బీ, వందనం!
  alternative: సంతోషించు, రబ్బీ!
  rationale: ఈ సందర్భంలో పదం సాధారణ సామాజిక పలకరింపు; ధార్మిక స్తుతి లేదా అక్షరార్థపు ఆజ్ఞ కాదు. అందువల్ల కథలోని వ్యంగ్యాన్ని వ్యాఖ్యానంతో పెంచకుండా సహజ పలకరింపుగా ఉంచబడింది.
- issue: κατεφίλησεν క్రియలోని తీవ్రత
  choice: ముద్దుపెట్టుకున్నాడు
  alternative: గాఢంగా ముద్దుపెట్టుకున్నాడు / పదేపదే ముద్దుపెట్టుకున్నాడు
  rationale: క్రియ తీవ్రతను లేదా పునరావృతాన్ని సూచించవచ్చు; అయితే వాటిలో ఏది ఉద్దేశించబడిందో సందర్భం ఖచ్చితంగా నిర్ణయించదు. ప్రధాన వచనంలో సాధారణ రూపం ఉంచి, నిజమైన భావసంభావ్యతను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘రబ్బీ’ అనే మూల బిరుదు అలాగే నిలుపబడింది; యేసును సూచించే సర్వనామంలో తెలుగు గౌరవప్రయోగం అనుసరించబడింది. మూలంలోని κατεφίλησεν క్రియకు ఉన్న సంభావ్య తీవ్రతను ప్రధాన వచనంలో అతివివరణ చేయకుండా పాదసూచికలో భద్రపరచాం.
