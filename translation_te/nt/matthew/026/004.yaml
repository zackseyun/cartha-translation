  text: and they conspired so that they might seize Jesus by stealth and kill him.
translation:
  language: te
  text: వారు యేసును మోసపూరితంగా పట్టుకొని చంపాలని కలిసి పన్నాగం పన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: కలిసి పన్నాగం పన్నారు
  rationale: పరస్పరం సంప్రదించి కుట్రపూరిత నిర్ణయం చేసుకున్నారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δόλῳ
  choice: మోసపూరితంగా
  rationale: δόλος లోని మోసం, కపట ఉపాయం అనే భావాన్ని కాపాడుతుంది; కేవలం రహస్యంగా అనే అర్థానికి పరిమితం చేయదు.
- source_word: κρατήσωσιν
  choice: పట్టుకొని
  rationale: ఈ సందర్భంలో యేసును అదుపులోకి తీసుకోవడం లేదా బంధించడం అనే భావానికి సరళమైన సందర్భోచిత రూపం.
- source_word: ἀποκτείνωσιν
  choice: చంపాలని
  rationale: మూలంలోని ప్రత్యక్షమైన ‘చంపడం’ భావాన్ని మృదువుచేయకుండా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ἵνα సూచించే ఉద్దేశాన్ని తెలుగులోని ‘-ాలని’ నిర్మాణంతో వ్యక్తం చేశాం; వాక్యంలోని కుట్ర మరియు మోసపూరిత చర్యల భావం నిలిచింది.
