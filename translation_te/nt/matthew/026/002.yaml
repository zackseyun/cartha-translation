id: MAT.26.2
reference: Matthew 26:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: te
  text: “రెండు రోజుల తర్వాత పస్కా పండుగ వస్తుందని మీకు తెలుసు. మనుష్యకుమారుడు సిలువ వేయబడడానికి అప్పగించబడతాడు[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ద్రోహం చేయబడతాడు.” గ్రీకు క్రియ ద్రోహాన్ని సూచించగలదు; అయితే విస్తృతంగా “అప్పగించబడటం” లేదా “చేతికి ఇవ్వబడటం” అని కూడా అర్థమిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: మీకు తెలుసు
  rationale: οἶδα యొక్క ద్వితీయ పురుష బహువచన రూపానికి వర్తమానార్థం ఉంది; ఆధునిక తెలుగులో సహజంగా, నేరుగా అర్థాన్ని తెలియజేస్తుంది.
- source_word: μετὰ δύο ἡμέρας
  choice: రెండు రోజుల తర్వాత
  rationale: μετά + accusative యొక్క కాలసంబంధమైన ‘రెండు రోజుల తర్వాత’ అనే భావాన్ని దగ్గరగా నిలుపుతుంది.
- source_word: τὸ πάσχα
  choice: పస్కా పండుగ
  rationale: πάσχα యూదుల పస్కాను సూచిస్తుంది; సాధారణ తెలుగు పాఠకులకు ఇది ఒక పండుగ అని స్పష్టంచేయడానికి ‘పండుగ’ వాడబడింది.
- source_word: γίνεται
  choice: వస్తుందని
  rationale: ఇక్కడ γίνομαι పస్కా సమయం సమీపించడాన్ని లేదా సంభవించడాన్ని సూచిస్తుంది; ‘వస్తుంది’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: యేసు తనను తాను సూచించడానికి ఉపయోగించిన బిరుదును వివరణాత్మకంగా మార్చకుండా, స్థిరమైన బైబిలు రూపంలో నిలుపుతుంది.
- source_word: παραδίδοται
  choice: అప్పగించబడతాడు
  rationale: క్రియ యొక్క విస్తృతమైన ‘అప్పగించబడటం’ అనే భావాన్ని నిలుపుతుంది; సందర్భంలో ద్రోహం ఉన్నప్పటికీ అర్థాన్ని దానికే పరిమితం చేయదు. గ్రీకు వర్తమాన రూపం సమీప భవిష్యత్తును సూచిస్తున్నందున తెలుగులో భవిష్యత్ కర్మణి సహజంగా ఉంది.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: సిలువ వేయబడడానికి
  rationale: εἰς తో కూడిన articular infinitive తెలిపే ఉద్దేశం లేదా ఫలితాన్ని నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: శ్రమల ముందస్తు ప్రకటనలో παραδίδοται అనువాదం
  choice: అప్పగించబడతాడు
  alternative: ద్రోహం చేయబడతాడు
  rationale: సందర్భం యూదా ద్రోహాన్ని కలిగి ఉన్నా, గ్రీకు క్రియకు మరింత విస్తృతమైన అర్థం ఉంది. ‘అప్పగించబడతాడు’ మానవ ద్రోహం, అధికారులకు అప్పగింపు, అలాగే అంతర్లీన దైవ సంకల్పం మధ్యనున్న theological tensionను సంకుచితం చేయకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పస్కా పండుగ’ సాధారణ పాఠకుడికి స్పష్టతనిస్తుంది; ‘మనుష్య కుమారుడు’ స్థిరమైన బైబిలు బిరుదుగా నిలుపబడింది.
