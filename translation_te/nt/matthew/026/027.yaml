id: MAT.26.27
reference: Matthew 26:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: te
  text: 'ఆయన ఒక పానపాత్రను తీసుకొని, కృతజ్ఞతలు చెల్లించి, వారికి ఇచ్చి ఇలా అన్నాడు: “మీరందరూ దానిలోనుండి తాగండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: తీసుకొని
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచించే భూతకాల క్రియావిశేషణ రూపాన్ని సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: ποτήριον
  choice: ఒక పాత్రను
  rationale: గ్రీకులో నిర్దేశక ఉపపదం లేకపోవడాన్ని ‘ఒక’ ద్వారా ప్రతిబింబిస్తుంది; భోజన సందర్భంలో పానపాత్ర అని స్పష్టమే.
- source_word: εὐχαριστήσας
  choice: కృతజ్ఞతలు చెల్లించి
  rationale: εὐχαριστέω యొక్క కృతజ్ఞతలు చెప్పడం/చెల్లించడం అనే మౌలిక అర్థాన్ని నిలుపుతూ, తరువాతి ఆచార సంబంధ పదజాలాన్ని చేర్చదు.
- source_word: ἔδωκεν αὐτοῖς
  choice: వారికి ఇచ్చి
  rationale: దత్తివాచకమైన αὐτοῖςను సహజంగా చూపిస్తుంది; ఇచ్చిన వస్తువు ముందున్న పాత్ర అని సందర్భం స్పష్టం చేస్తుంది.
- source_word: λέγων
  choice: ఇలా అన్నాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే గ్రీకు వర్తమాన క్రియావిశేషణాన్ని తెలుగులో సహజమైన వాక్య నిర్మాణంగా మారుస్తుంది.
- source_word: Πίετε
  choice: తాగండి
  rationale: బహువచన ఆజ్ఞను ఆధునిక గౌరవప్రదమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἐξ αὐτοῦ
  choice: దీనిలోనుండి
  rationale: ἐξ్ సూచించే మూలం లేదా పాత్రలోనుండి తాగడం అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: πάντες
  choice: మీరందరూ
  rationale: ఆజ్ఞ మొత్తం శిష్యబృందానికీ ఉద్దేశించబడిందని తెలుపుతుంది; తాగవలసిన పరిమాణాన్ని సూచిస్తున్నట్టు అపార్థం రాకుండా చేస్తుంది.
theological_decisions:
- issue: εὐχαριστήσαςకు ప్రభుభోజన సంబంధమైన తరువాతి పరిభాషను ఆపాదించే అవకాశం
  choice: కృతజ్ఞతలు చెల్లించి
  alternative: దానిని ఆశీర్వదించి
  rationale: మూల క్రియ యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; ‘పాత్రను ఆశీర్వదించాడు’ అనే మూలంలో స్పష్టంగా లేని భావాన్ని చేర్చదు.
- issue: πάντες యొక్క పరిధి
  choice: మీరందరూ
  alternative: అంతా తాగండి
  rationale: πάντες ఆజ్ఞకు కర్తలైన వారందరినీ సూచిస్తుంది; పాత్రలో ఉన్నదంతా తాగాలని చెప్పినట్టు తెలుగులో కలిగే సందిగ్ధతను నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్య గౌరవం నిలిచేలా అనువదించబడింది. ‘పాత్ర’ అనేది ποτήριονకు సహజమైన విస్తృత పదం; సందర్భం దానిని తాగే పాత్రగా నిర్ధారిస్తుంది.
