  to: 'ఆయన ఒక పానపాత్రను తీసుకొని, కృతజ్ఞతలు చెల్లించి, వారికి ఇచ్చి ఇలా అన్నాడు: “మీరందరూ దానిలోనుండి తాగండి.”'
