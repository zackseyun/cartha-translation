lexical_decisions:
- source_word: ἐδύνατο
  choice: ఇవ్వగలిగేవారు
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో సాధ్యమై ఉండి కార్యరూపం దాల్చని అవకాశాన్ని సూచిస్తుంది; తెలుగులో ‘అమ్మి... ఇవ్వగలిగేవారు’ అనే నిర్మాణం సహజంగా దానిని వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ఫిర్యాదుకు కారణాన్ని వివరించే అనుసంధాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τοῦτο
  choice: దీనిని
  rationale: నపుంసక ఏకవచన సూచన సర్వనామాన్ని అలాగే ఉంచి, సందర్భంలోని సుగంధ తైలాన్ని పేరుతో మళ్లీ చేర్చదు.
- source_word: πραθῆναι
  choice: అమ్మి
  rationale: πιπράσκω యొక్క భూతకర్మణి క్రియార్థక రూపానికి తెలుగులో సమన్విత క్రియలతో సహజమైన నిర్మాణం; ἐδύνατοతో కలిసి ‘అమ్మగలిగి ఉండేది’ అనే నెరవేరని గత అవకాశాన్ని తెలియజేస్తుంది.
- source_word: πολλοῦ
  choice: చాలా డబ్బుకు
  rationale: ఇది ధరను సూచించే షష్ఠీ విభక్తి ప్రయోగం; ‘చాలా డబ్బుకు’ అనేది నిర్దిష్ట మొత్తాన్ని చేర్చకుండా అధిక ధర భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: δοθῆναι
  choice: ఆ డబ్బును ... ఇవ్వగలిగేవారు
  rationale: δίδωμι యొక్క భూతకర్మణి క్రియార్థక రూపం; తెలుగులో అమ్మకంతో వచ్చిన డబ్బే ఇవ్వబడుతుందని స్పష్టంగా, సహజంగా తెలియజేయడానికి కర్మను పునఃప్రస్తావించింది.
- source_word: πτωχοῖς
  choice: పేదలకు
  rationale: దత్తివాచక బహువచన విశేషణం పేదవారిని సమూహంగా సూచిస్తుంది; ‘పేదలకు’ సంక్షిప్తంగా, సహజంగా ఉంది.
