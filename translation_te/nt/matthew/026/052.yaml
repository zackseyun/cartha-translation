id: MAT.26.52
reference: Matthew 26:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: te
  text: 'అప్పుడు యేసు అతనితో ఇలా చెప్పాడు: “నీ కత్తిని తిరిగి దాని స్థానంలో పెట్టు; ఎందుకంటే కత్తిని ఎత్తినవారందరూ[a] కత్తిచేత నశిస్తారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కత్తిని తీసుకున్నవారు.” ఈ ప్రయోగం కేవలం ఆయుధాన్ని పట్టుకోవడాన్ని కాక, హింసాత్మక బలాన్ని ఆశ్రయించడాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనను సహజంగా పరిచయం చేసే కాలసూచక అవ్యయం.
- source_word: λέγει αὐτῷ
  choice: అతనితో ... అని చెప్పాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, ఆధునిక తెలుగు కథనశైలిలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: Ἀπόστρεψον
  choice: తిరిగి ... పెట్టు
  rationale: వెంటనే చర్యను వెనక్కి మళ్లించమనే ఆజ్ఞను, సందర్భంలో ఆయుధాన్ని దాని చోటికి చేర్చడాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὴν μάχαιράν σου
  choice: నీ కత్తిని
  rationale: μάχαιρα కత్తి, బాకు, లేదా పొట్టి ఖడ్గాన్ని సూచించవచ్చు; ఈ అరెస్టు సందర్భంలో సాధారణ పాఠకునికి ‘కత్తి’ స్పష్టమైన, సహజమైన పదం.
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: దాని స్థానంలో
  rationale: ఆయుధాన్ని అది ఉండవలసిన చోటికి తిరిగి పెట్టాలనే అర్థాన్ని నేరుగా నిలుపుతుంది; ‘ఒరలో’ అని మూలంలో లేని వివరాన్ని చేర్చదు.
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: ఎందుకంటే కత్తి చేపట్టే వారందరూ
  rationale: నామవాచకసదృశ కృదంతం ఇక్కడ సాధారణ సూత్రాన్ని తెలియజేస్తుంది. ‘కత్తి చేపట్టు’ అనేది ఆయుధాన్ని కేవలం చేతితో పట్టుకోవడం కంటే హింసాత్మక బలాన్ని ఆశ్రయించే భావాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἐν μαχαίρῃ
  choice: కత్తిచేతనే
  rationale: సాధనార్థక చతుర్థీ విభక్తిని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, సామెతలాంటి సమాంతరతను నిలుపుతుంది.
- source_word: ἀπολοῦνται
  choice: నశిస్తారు
  rationale: ἀπόλλυμι యొక్క భవిష్యత్ రూపం ఇక్కడ మరణం లేదా వినాశాన్ని సూచిస్తుంది; ‘నశిస్తారు’ దాని గంభీరతను నిలుపుతూ విధానాన్ని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: కత్తి గురించి యేసు చెప్పిన మాట యొక్క పరిధి
  choice: ‘కత్తి చేపట్టే వారందరూ’ అనే సాధారణ సూత్రంగా అనువదించడం
  alternative: అన్ని రకాల బలప్రయోగానికీ సంపూర్ణ నిషేధంగా లేదా పేతురు తక్షణ పరిస్థితికే పరిమితమైన ముందుచెప్పుగా అనువదించడం
  rationale: గ్రీకు నిర్మాణం సాధారణీకరించే, సూక్తి స్వభావమున్న వాక్యం. అనువాదం దాని విస్తృతిని నిలుపుతుంది గాని, హింసపై మూలపాఠం కంటే సన్నని లేదా విస్తృతమైన మతపరమైన నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘ఖడ్గం’ కంటే సాధారణ పాఠకులకు సులభమైన ‘కత్తి’ ఎంచుకోబడింది. మూలంలోని ‘దాని స్థానంలో’ అనే అనిర్దిష్టతను కాపాడటానికి ‘ఒరలో’ అని వివరణాత్మకంగా మార్చలేదు.
