revisions:
- from: మెలకువగా ఉండి ప్రార్థించండి; మీరు శోధనలోకి ప్రవేశించకుండా[a] అలా చేయండి. ఆత్మ సిద్ధంగా ఉంది, కాని శరీరం బలహీనంగా ఉంది.
  to: మీరు శోధనలోకి ప్రవేశించకుండా[a] మెలకువగా ఉండి ప్రార్థించండి. ఆత్మ ఇష్టంగా ఉంది, కాని శరీరం బలహీనంగా ఉంది.
  rationale: The revision restores the Greek purpose relationship by placing the prevention clause before the paired commands, without changing the metaphor of entering into πειρασμός. “ఇష్టంగా ఉంది” conveys the readiness/willingness of πρόθυμον naturally while retaining the source contrast with bodily weakness. The footnote is corrected to identify the actual Greek lexical item and continues to preserve the disputed semantic range of πειρασμόν.
