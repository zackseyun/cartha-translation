review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the plural imperatives, the prevention-purpose clause, the contrast marked by μέν/δέ, and the human-frailty sense of πνεῦμα/σάρξ. However, the Telugu placement of “అలా చేయండి” reverses and weakens the Greek syntactic relationship: vigilance and prayer are the means commanded so that the disciples may not enter testing.'
  naturalness: “మీరు శోధనలోకి ప్రవేశించకుండా అలా చేయండి” is unnatural and vague, since “అలా” has no clear antecedent and follows the stated purpose. Reordering the clause produces clear, modern standard Telugu. “సిద్ధంగా ఉంది” is acceptable, though “ఇష్టంగా ఉంది” more directly communicates πρόθυμον (“willing/eager”) in this contrast.
  terminology: “శోధన” suitably preserves the semantic breadth of πειρασμόν when supported by a footnote. “ఆత్మ” and “శరీరం” preserve the source wording and avoid importing an interpretation such as “Holy Spirit” or “sinful nature.” The footnote should identify πειρασμόν, rather than calling the Telugu word “శోధన” a Greek word.
  issues:
  - severity: medium
    issue: Purpose clause is rendered with an unclear and misplaced “అలా చేయండి.”
    rationale: 'ἵνα μὴ εἰσέλθητε εἰς πειρασμόν modifies the paired commands “stay awake and pray.” The revised order directly expresses: “Stay awake and pray so that you may not enter into testing.”'
  - severity: low
    issue: Footnote inaccurately calls “శోధన” a Greek word.
    rationale: శోధన is Telugu; the underlying Greek term is πειρασμόν. Naming the Greek term makes the lexical note accurate.
