source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: te
  text: మీరు శోధనలోకి ప్రవేశించకుండా[a] మెలకువగా ఉండి ప్రార్థించండి. ఆత్మ ఇష్టంగా ఉంది, కాని శరీరం బలహీనంగా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదమైన πειρασμόν కు ‘ప్రలోభం,’ ‘పరీక్ష,’ లేదా ‘కష్టకాలం’ అనే అర్థాలు కూడా ఉండవచ్చు. అది పాపం చేయడానికి కలిగే ప్రలోభాన్నిగానీ, ఒకరిని పరీక్షించే కష్టమైన పరిస్థితినిగానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: మెలకువగా ఉండండి
  rationale: ఈ సందర్భంలో శిష్యులు నిద్రపోతున్నారు కాబట్టి, ఈ బహువచన ఆజ్ఞ భౌతికంగా మేలుకొని ఉండడాన్నీ ఆత్మీయ అప్రమత్తతనూ సూచిస్తుంది. ‘మెలకువగా ఉండండి’ రెండింటినీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: προσεύχεσθε
  choice: ప్రార్థించండి
  rationale: వర్తమానకాల బహువచన ఆజ్ఞను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: మీరు … లోకి ప్రవేశించకుండా
  rationale: ἵνα μή నిర్మాణంలోని నివారణ ఉద్దేశాన్ని తెలియజేస్తూ, ‘పడిపోకుండా’ అని వ్యాఖ్యానించకుండా గ్రీకు మూలంలోని ‘ప్రవేశించడం’ అనే రూపకాన్ని నిలుపుతుంది.
- source_word: πειρασμόν
  choice: శోధన
  rationale: πειρασμός పాపానికి ప్రలోభాన్నీ కష్టమైన పరీక్షనూ సూచించగలదు. ‘శోధన’ ఈ సందర్భంలోని నైతిక ప్రమాదానికి సరిపోవడంతో పాటు మూలపదంలోని విస్తృత అర్థాన్ని కొంతవరకు నిలుపుతుంది; ప్రత్యామ్నాయ అర్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: τὸ μὲν πνεῦμα
  choice: ఆత్మ
  rationale: ‘మనసు’ అని అర్థాన్ని కుదించకుండా πνεῦμα అనే పదాన్ని నిలుపుతుంది. ఇక్కడ అది శిష్యుల అంతరంగ సంకల్పాన్ని సూచించే అవకాశం ఎక్కువైనా, తెలుగు పదం మూలంలోని కొంత అనిశ్చితిని కాపాడుతుంది.
- source_word: πρόθυμον
  choice: సిద్ధంగా ఉంది
  rationale: πρόθυμος లోని సంసిద్ధత, ఇష్టపూర్వకత భావాలను ఈ సందర్భంలో సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ δὲ σὰρξ
  choice: కాని శరీరం
  rationale: σάρξ ఇక్కడ అభివృద్ధి చెందిన ‘పాప స్వభావం’ అనే భావం కంటే మానవ దౌర్బల్యాన్ని సూచిస్తుంది. ‘శరీరం’ ఆధునిక తెలుగులో సహజమైన దేహార్థ పదం; మూలంలోని ఆత్మ–శరీరం వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἀσθενής
  choice: బలహీనంగా ఉంది
  rationale: ఆత్మ సిద్ధతకు విరుద్ధంగా ఉన్న మానవ అసమర్థతను స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: πνεῦμα ఎవరిని లేదా దేనిని సూచిస్తుంది?
  choice: మానవ ఆత్మ లేదా అంతరంగ సంకల్పాన్ని ప్రధాన భావంగా తీసుకొని ‘ఆత్మ’ అని అనువదించడం
  alternative: పరిశుద్ధాత్మ
  rationale: శిష్యులకు చేయాలనే ఉద్దేశం ఉన్నా వారు విఫలమైన తక్షణ సందర్భం, అలాగే ‘శరీరం’తో ఉన్న వ్యత్యాసం మానవ అంతరంగాన్ని సూచిస్తాయి. అయినా ‘ఆత్మ’ అనే అనువాదం మూలపాఠం చెప్పనిదాన్ని సిద్ధాంతపరంగా బలవంతంగా నిర్ణయించదు.
- issue: σάρξ అనువాదం
  choice: శరీరం
  alternative: పాప స్వభావం; దేహం; మాంసం
  rationale: ఇక్కడ ప్రధాన భావం శరీరంతో కూడిన మానవ బలహీనత; పౌలు పత్రికల్లో కనిపించే ప్రత్యేకమైన ‘పాప స్వభావం’ భావాన్ని ఈ వాక్యంలోకి దిగుమతి చేయకూడదు. ‘మాంసం’ తెలుగులో ఈ సందర్భానికి అసహజంగా, కేవలం భౌతిక పదార్థంలా వినిపించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘ప్రవేశించకుండా’ అనే రూపం కొద్దిగా గ్రంథశైలిలో ఉన్నప్పటికీ, మూలంలోని రూపకాన్ని కాపాడుతుంది. పాదసూచిక గుర్తు [a] సంబంధిత పదబంధం వెంట ఉంచబడింది.
