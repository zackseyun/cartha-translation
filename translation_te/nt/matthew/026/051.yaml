review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the narrative marker, the unspecified identity of the person with Jesus, the sequence of actions, the high priest’s slave, and the severing of the ear. However, “తన కత్తిని దూసి” ordinarily suggests thrusting/charging with the sword rather than drawing it, and so does not reliably render ἀπέσπασεν (“drew/pulled out”).
  naturalness: The sentence is otherwise clear modern standard Telugu. Replacing “దూసి” with “బయటికి తీసి” makes the weapon action both natural and unambiguous without adding a sheath not stated in the Greek.
  terminology: “ప్రధాన యాజకుడు,” “దాసుడు,” and “చెవి” are appropriate. The footnote preserves “సేవకుడు” as a viable lexical alternative for δοῦλος.
  issues:
  - severity: medium
    issue: “తన కత్తిని దూసి” can mean thrusting or rushing with the sword, not drawing it.
    rationale: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ denotes pulling out/drawing his sword. “తన కత్తిని బయటికి తీసి” expresses this action clearly while avoiding an unsupported reference to a sheath.
  revised_text: ఇదిగో, యేసుతో ఉన్నవారిలో ఒకడు చేయి చాపి తన కత్తిని బయటికి తీసి, ప్రధాన యాజకుని దాసుని[a] కొట్టి అతని చెవిని నరికివేశాడు.
  revised_footnotes:
