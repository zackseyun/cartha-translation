    text: లేదా, “సేవకుని.”
    reason: δοῦλος అనే పదానికి సందర్భానుసారంగా ‘దాసుడు’ లేదా ‘సేవకుడు’ అనే అర్థాలు ఉండగలవు.
  revision_rationale: The sole revision corrects the rendering of the sword-drawing action. The rest of the wording faithfully and naturally represents the Greek sequence, including the finite final action of removing the ear.
