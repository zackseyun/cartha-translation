id: MAT.26.51
reference: Matthew 26:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s servant, and cut off his ear.
translation:
  language: te
  text: ఇదిగో, యేసుతో ఉన్నవారిలో ఒకడు చేయి చాపి తన కత్తిని బయటికి తీసి, ప్రధాన యాజకుని దాసుని[a] కొట్టి అతని చెవిని నరికివేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సేవకుని.”
    reason: δοῦλος అనే పదానికి సందర్భానుసారంగా ‘దాసుడు’ లేదా ‘సేవకుడు’ అనే అర్థాలు ఉండగలవు.
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా జరిగే చర్యపై దృష్టి నిలిపే గ్రీకు సూచకపదపు సజీవతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: యేసుతో ఉన్నవారిలో ఒకడు
  rationale: భాగసూచక నిర్మాణాన్ని సహజంగా వ్యక్తపరుస్తూ, ఆ వ్యక్తి ఎవరనే విషయాన్ని మూలపాఠానికి మించి నిర్దిష్టం చేయదు.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: చెయ్యి చాపి
  rationale: ప్రధాన చర్యకు ముందు జరిగిన శారీరక కదలికను సంక్షిప్తమైన, సహజమైన తెలుగు క్రియారూపంలో తెలియజేస్తుంది.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: తన కత్తిని దూసి
  rationale: ఆయుధాన్ని ఒర నుంచి బయటకు తీయడాన్ని తెలుగులో సహజంగా తెలిపే ప్రయోగం; αὐτοῦను ‘తన’గా స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: μάχαιραν
  choice: కత్తి
  rationale: ఈ పదం చిన్న ఖడ్గం లేదా పెద్ద కత్తిని సూచించగలదు; ‘కత్తి’ అనవసరమైన ఆయుధ-విశిష్టతను జోడించకుండా విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: πατάξας
  choice: కొట్టి
  rationale: కత్తితో చేసిన హింసాత్మక దెబ్బను సరళంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: δοῦλον
  choice: దాసుని
  rationale: ప్రధాన యాజకునికి లోబడిన వ్యక్తి సామాజిక స్థితిని ‘సేవకుడు’ కంటే స్పష్టంగా ప్రతిబింబిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: ἀρχιερέως
  choice: ప్రధాన యాజకుని
  rationale: ఏకవచన ἀρχιερεύςకు తెలుగు బైబిలు సందర్భంలో స్పష్టమైన, ప్రామాణిక సమానార్థకం.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: అతని చెవిని నరికివేశాడు
  rationale: పదశః ‘చెవిని తీసివేశాడు’ అనే ఫలితాన్ని కత్తిదెబ్బ సందర్భంలో సహజంగా, స్పష్టంగా వ్యక్తపరుస్తూ గ్రీకు సమాపక క్రియను పూర్తి క్రియగా నిలుపుతుంది.
- source_word: ὠτίον
  choice: చెవి
  rationale: రూపపరంగా లఘురూపమైనప్పటికీ సందర్భంలో సాధారణంగా చెవినే సూచిస్తుంది; ‘చెవితమ్మె’ అని మరీ నిర్దిష్టం చేయదు.
theological_decisions:
- issue: సామాజికంగా నిర్దిష్టమైన కథన సందర్భంలో δοῦλος అనువాదం
  choice: దాసుడు
  alternative: సేవకుడు
  rationale: ఇక్కడ ప్రధాన యాజకునితో ఉన్న ఆధీన సంబంధాన్ని మూలపదం సూచిస్తుంది. ‘దాసుడు’ ఆ సామాజిక వాస్తవాన్ని మృదువుచేయకుండా నిలుపుతుంది; అయితే ‘సేవకుడు’ అనే సాధ్యమైన పఠనాన్ని పాదటిప్పణిలో సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథనశైలి. వరుస చర్యలను ‘చాపి… దూసి… కొట్టి… నరికివేశాడు’ అనే సహజ క్రమంలో ఉంచి, గ్రీకు వాక్యంలోని వేగం మరియు సజీవతను నిలిపింది.
