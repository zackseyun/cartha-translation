- from: ఇదిగో, యేసుతో ఉన్నవారిలో ఒకడు చెయ్యి చాపి తన కత్తిని దూసి, ప్రధాన యాజకుని దాసుని[a] కొట్టి అతని చెవిని నరికివేశాడు.
  to: ఇదిగో, యేసుతో ఉన్నవారిలో ఒకడు చేయి చాపి తన కత్తిని బయటికి తీసి, ప్రధాన యాజకుని దాసుని[a] కొట్టి అతని చెవిని నరికివేశాడు.
