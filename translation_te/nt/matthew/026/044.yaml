id: MAT.26.44
reference: Matthew 26:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: te
  text: ఆయన వారిని విడిచిపెట్టి, మళ్లీ వెళ్లి, అదే మాటను మళ్లీ పలుకుతూ మూడవసారి ప్రార్థించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: వారిని విడిచిపెట్టి
  rationale: శిష్యులను అక్కడే వదలి వారి దగ్గరనుండి వెళ్లడాన్ని సహజమైన తెలుగు అసమాపక క్రియతో తెలియజేస్తుంది.
- source_word: πάλιν ἀπελθὼν
  choice: మళ్లీ వెళ్లి
  rationale: చర్య పునరావృతిని తెలిపే πάλιν‌ను స్పష్టంగా ఉంచి, ἀπελθών‌ను కథనానికి సహజంగా అనువదించింది.
- source_word: προσηύξατο ἐκ τρίτου
  choice: మూడవసారి ప్రార్థిస్తూ
  rationale: ἐκ τρίτου అనే ప్రయోగం ‘మూడవసారి’ అని అర్థం; ప్రధాన వాక్యంలోని పలకడితో ప్రార్థనను అనుసంధానించే సహజ తెలుగు నిర్మాణం.
- source_word: τὸν αὐτὸν λόγον
  choice: అవే మాటలను
  rationale: λόγος ఏకవచనంలో ఉన్నప్పటికీ ఇక్కడ ముందటి ప్రార్థనలో పలికిన అదే వాక్యాంశం లేదా విషయాన్ని సూచిస్తుంది; ‘అవే మాటలను’ తెలుగులో సహజంగా, పాఠ్యానికి దగ్గరగా ఉంటుంది.
- source_word: εἰπὼν πάλιν
  choice: మళ్లీ పలికాడు
  rationale: చివరి πάλιν‌ను విడిచిపెట్టకుండా ప్రార్థనా మాటల పునరావృతిని నిలుపుతుంది.
theological_decisions:
- issue: ప్రార్థన పునరావృతి
  choice: మూడవసారి ప్రార్థించడాన్నీ, అదే ప్రార్థనా మాటలను మళ్లీ పలకడాన్నీ రెండింటినీ స్పష్టంగా ఉంచడం
  alternative: శైలీ సౌలభ్యం కోసం చివరి ‘మళ్లీ’ని విడిచిపెట్టడం
  rationale: గ్రీకు పాఠంలో πάλιν రెండుసార్లు ఉంది; రెండింటినీ అనువదించడం కథనంలోని పునరావృతి ప్రాధాన్యాన్ని వ్యాఖ్యానంతో విస్తరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరమైన బైబిల్ కథన శైలిని నిలుపుతూ రూపొందించబడింది.
