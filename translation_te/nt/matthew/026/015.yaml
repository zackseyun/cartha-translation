revisions:
- from: అతడు, “మీరు నాకు ఏమి ఇవ్వడానికి సిద్ధంగా ఉన్నారు? నేను ఆయనను మీకు అప్పగిస్తాను[a]” అని అడిగాడు. అప్పుడు వారు అతనికి ముప్పై వెండి నాణాలు తూచి ఇచ్చారు.
  to: అతడు, “మీరు నాకు ఏమి ఇవ్వడానికి సిద్ధంగా ఉన్నారు? నేను ఆయనను మీకు అప్పగిస్తాను[a]” అని చెప్పాడు. అప్పుడు వారు అతనికి ముప్పై వెండి ముక్కలు తూచి ఇచ్చారు.
