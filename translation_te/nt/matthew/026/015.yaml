id: MAT.26.15
reference: Matthew 26:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: te
  text: అతడు, “మీరు నాకు ఏమి ఇవ్వడానికి సిద్ధంగా ఉన్నారు? నేను ఆయనను మీకు అప్పగిస్తాను[a]” అని చెప్పాడు. అప్పుడు వారు అతనికి ముప్పై వెండి ముక్కలు తూచి ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయనను మీకు ద్రోహపూర్వకంగా అప్పగిస్తాను.” గ్రీకు క్రియకు “అప్పగించు,” “చేతికి ఇవ్వు,” లేదా ఈ సందర్భంలో “ద్రోహపూర్వకంగా అప్పగించు” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: మీరు నాకు ఏమి ఇవ్వడానికి సిద్ధంగా ఉన్నారు?
  rationale: θέλωలోని ఇష్టం లేదా సంసిద్ధత భావాన్ని ఈ బేరసారాల సందర్భంలో సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: నేను ఆయనను మీకు అప్పగిస్తాను
  rationale: παραδίδωμι యొక్క విస్తృతమైన ‘అప్పగించు/చేతికి ఇవ్వు’ భావాన్ని నిలుపుతుంది; ‘ద్రోహం చేస్తాను’ అని ప్రధాన పాఠంలో పెట్టడం ద్వారా నైతిక వ్యాఖ్యానాన్ని పదంలోనే చేర్చదు.
- source_word: οἱ δὲ
  choice: అప్పుడు వారు
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానంగా ఉంది; తెలుగు కథన ప్రవాహంలో ‘అప్పుడు’ సహజంగా తదుపరి చర్యను సూచిస్తుంది.
- source_word: ἔστησαν αὐτῷ
  choice: అతనికి ... తూచి ఇచ్చారు
  rationale: వెండి చెల్లింపును నిర్ణయించి లేదా తూచి ఇవ్వడం అనే వాణిజ్య సందర్భాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; కేవలం ‘చెల్లించారు’ కంటే మూలంలోని స్పష్ట రూపాన్ని ఎక్కువగా నిలుపుతుంది.
- source_word: τριάκοντα ἀργύρια
  choice: ముప్పై వెండి నాణాలు
  rationale: ἀργύρια వెండి డబ్బు లేదా వెండి ముక్కలను సూచిస్తుంది. తెలుగులో ‘వెండి నాణాలు’ చెల్లింపు భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలో లేని నిర్దిష్ట నాణెపు రకాన్ని పేర్కొనదు.
theological_decisions:
- issue: యూదా ప్రతిపాదనలో παραδώσω అనువాదం
  choice: అప్పగిస్తాను
  alternative: ద్రోహం చేసి పట్టిస్తాను
  rationale: మూల క్రియ యొక్క విస్తృత అర్థాన్ని ప్రధాన పాఠంలో నిలిపి, ఈ చర్య ద్రోహమనే సందర్భోచిత నైతిక భావాన్ని పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. యేసును సూచించే సర్వనామానికి గౌరవార్థకంగా ‘ఆయనను’ ఎంచుకోబడింది; బేరసారాల నేరుగా పలికిన మాటలోని ఉద్రిక్తతను నిలిపాం.
