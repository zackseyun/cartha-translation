  text: καὶ πάλιν ἠρνήσατο μετὰ ὅρκου ὅτι Οὐκ οἶδα τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/072.yaml
  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: te
  text: అతడు మళ్లీ ఒట్టు పెట్టి, “ఆ మనిషి ఎవరో నాకు తెలియదు” అని నిరాకరించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: అతడు
  rationale: గ్రీకు వాక్యంలోని సాధారణ అనుసంధానాన్ని తెలుగులో సహజ కథన ప్రవాహం కోసం ప్రత్యేకంగా ‘మరియు’ అని చూపకుండా, కర్తతో వాక్యాన్ని ప్రారంభించాం.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: పేతురు చేసిన నిరాకరణ పునరావృతమైందని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἠρνήσατο
  choice: నిరాకరించాడు
  rationale: క్రియకు ‘తాను చెప్పిన మాటను తిరస్కరించాడు’ అనే భావం ఉంది; తరువాత వచ్చే మాటలే నిరాకరణలోని విషయాన్ని తెలియజేస్తాయి.
- source_word: μετὰ ὅρκου
  choice: ఒట్టు పెట్టుకొని
  rationale: ఒట్టుతో కూడిన నిరాకరణను సహజ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; అధికారిక న్యాయస్థాన ప్రమాణం అనే అదనపు భావాన్ని రానివ్వదు.
- source_word: ὅτι
  choice: అని
  rationale: నిరాకరణలోని ప్రత్యక్ష మాటలను తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: Οὐκ οἶδα
  choice: నాకు తెలియదు
  rationale: తెలుసుననే విషయాన్ని నేరుగా నిరాకరించే సహజ తెలుగు రూపం.
- source_word: τὸν ἄνθρωπον
  choice: ఆ మనిషి ఎవరో
  rationale: ἄνθρωπος ఇక్కడ ఒక పురుష వ్యక్తిని సూచిస్తుంది. తెలుగు వాడుకలో వ్యక్తిని ఎరుగనని చెప్పేటప్పుడు ‘ఆ మనిషి ఎవరో నాకు తెలియదు’ అనడం సహజం; ‘యేసు’ అని స్పష్టీకరించకుండా మూలంలోని దూరం ఉంచే సంభాషణను కాపాడుతుంది.
theological_decisions:
- issue: పేతురు పలికిన ‘ఆ మనిషి’ ఎవరిని సూచిస్తుంది?
  choice: ‘ఆ మనిషి’ అనే వ్యక్తీకరణను అలాగే నిలుపుకోవడం
  alternative: ‘ఆయన’ లేదా ‘యేసు’
  rationale: గ్రీకు మూలం స్పష్టంగా ‘మనిషి’ అంటుంది. అది పేతురు తనను దూరం చేసుకుంటూ పలికిన మాటల తీవ్రతను చూపుతుంది; ‘యేసు’ అని మార్చడం మూలంలో లేని వివరణను చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన కథన శైలిని ఉపయోగించాం. ‘ఒట్టు పెట్టుకొని’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; ‘ఆ మనిషి’ మూలంలోని దూరం ఉంచే భాషను కాపాడుతుంది.
