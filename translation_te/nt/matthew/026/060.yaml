  text: καὶ οὐχ εὗρον ⸂πολλῶν προσελθόντων ψευδομαρτύρων. ὕστερον δὲ προσελθόντες δύο⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/060.yaml
  text: and they did not find any[a], though many false witnesses had come forward. But later two came forward
translation:
  language: te
  text: చాలామంది అబద్ధ సాక్షులు ముందుకు వచ్చినప్పటికీ, వారు ఏదీ కనుగొనలేదు[a]. అయితే తర్వాత ఇద్దరు ముందుకు వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారికి ఏదీ దొరకలేదు’; గ్రీకులో కర్మ వ్యక్తంగా లేదు. సందర్భం ప్రకారం అది వారు వెదుకుతున్న సాక్ష్యం లేదా నేరారోపణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: వారు ఏదీ కనుగొనలేకపోయారు
  rationale: εὗρον అనే క్రియకు కర్మ గ్రీకు పాఠంలో వ్యక్తంగా లేదు; ముందరి వచన సందర్భంలో వారు యేసుకు వ్యతిరేకంగా ఉపయోగపడే సాక్ష్యం లేదా నేరారోపణ కోసం వెదుకుతున్నారు. తెలుగు వాక్యం సహజంగా ఉండేలా ‘ఏదీ’ అని ఉంచి, ఆ అంతర్లీన భావాన్ని నిర్దిష్టంగా పరిమితం చేయకుండా కాపాడింది.
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: చాలామంది అబద్ధ సాక్షులు ముందుకు వచ్చినప్పటికీ
  rationale: జనిటివ్ అబ్సల్యూట్ నిర్మాణానికి సందర్భానుసారమైన concessive భావాన్ని ‘వచ్చినప్పటికీ’ తెలియజేస్తుంది. న్యాయవిచారణ సందర్భంలో ψευδομάρτυρες‌ను ‘అబద్ధ సాక్షులు’గా అనువదించడం సముచితం.
- source_word: ὕστερον δὲ
  choice: అయితే తర్వాత
  rationale: ὕστερον కాలక్రమంలో తరువాతి దశను సూచిస్తుంది; δέ స్వల్ప వ్యతిరేక లేదా పరివర్తన భావాన్ని ఇస్తుంది. ‘అయితే తర్వాత’ రెండింటినీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: προσελθόντες δύο
  choice: ఇద్దరు ముందుకు వచ్చారు
  rationale: న్యాయవిచారణ సందర్భంలో προσέρχομαιకు కేవలం దగ్గరకు రావడం కంటే సాక్ష్యం చెప్పడానికి ‘ముందుకు రావడం’ సహజమైన సమానార్థకం. δύοపై ఉన్న సమాచార ప్రాధాన్యాన్ని ‘ఇద్దరు’తో నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, న్యాయవిచారణ సందర్భానికి తగిన గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకులో అంతర్లీనంగా ఉన్న కర్మను పాదసూచిక ద్వారా స్పష్టం చేస్తూ అస్పష్టతను నిలిపింది.
