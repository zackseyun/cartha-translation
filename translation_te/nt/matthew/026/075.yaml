id: MAT.26.75
reference: Matthew 26:75
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: te
  text: 'పేతురు యేసు చెప్పిన మాటను జ్ఞాపకం చేసుకున్నాడు: “కోడి కూయకముందే[a] నువ్వు మూడుసార్లు నన్ను నిరాకరిస్తావు.” అతడు బయటికి వెళ్లి చాలా దుఃఖంగా ఏడ్చాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ కోడి కూయకముందే.” గ్రీకులో ‘కోడి’ అనే పదానికి నిర్దిష్ట సూచక పదం లేదు; అయితే తెలుగులో సందర్భానుసారంగా రెండు విధాలుగా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: జ్ఞాపకం చేసుకున్నాడు
  rationale: గతంలో యేసు పలికిన మాటను ఆ క్షణంలో పేతురు గుర్తుచేసుకున్నాడనే కథన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ῥήματος Ἰησοῦ εἰρηκότος
  choice: యేసు చెప్పిన మాటను
  rationale: ῥῆμα పలికిన మాటను సూచిస్తుంది; పరిపూర్ణ కృదంతం ఆ మాట ముందే చెప్పబడి ఇప్పుడు ప్రాసంగికమైందని తెలియజేస్తుంది. తెలుగులో ఈ నిర్మాణం సహజంగా ఉంటుంది.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: కోడి కూయకముందే
  rationale: గ్రీకు అనిర్దిష్ట నామవాచకాన్ని తెలుగులో తప్పనిసరిగా ‘ఒక’ అని వ్యక్తపరచాల్సిన అవసరం లేదు; ఈ నుడికారం నిర్దిష్ట పక్షికన్నా కోడి కూసే సంఘటనను సూచిస్తుంది.
- source_word: τρὶς
  choice: మూడుసార్లు
  rationale: స్పష్టమైన, ప్రస్తుత వాడుకలోని తెలుగు రూపం.
- source_word: ἀπαρνήσῃ
  choice: నన్ను ఎరుగనంటావు
  rationale: ఈ సందర్భంలో పేతురు చేసిన నిరాకరణ యేసును ఎరుగనని చెప్పడమే; ఈ తెలుగు నుడికారం కార్యార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐξελθὼν ἔξω
  choice: బయటికి వెళ్లి
  rationale: గ్రీకులోని కృదంతం-క్రియావిశేషణ నిర్మాణాన్ని పునరుక్తి లేకుండా సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἔκλαυσεν πικρῶς
  choice: మనసు విరిగేలా ఏడ్చాడు
  rationale: πικρῶς సూచించే తీవ్రమైన దుఃఖాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; పశ్చాత్తాపం అనే సిద్ధాంతార్థాన్ని నేరుగా చేర్చదు.
theological_decisions:
- issue: యేసు పేరుకు బిరుదు జోడించడం
  choice: యేసు
  alternative: ప్రభువైన యేసు
  rationale: మూల గ్రీకు పాఠంలో Ἰησοῦ మాత్రమే ఉంది; లేని క్రీస్తు సంబంధ బిరుదును చేర్చలేదు.
- issue: పేతురు నిరాకరణ భావం
  choice: నన్ను ఎరుగనంటావు
  alternative: నన్ను తిరస్కరిస్తావు
  rationale: ἀπαρνέομαι కు ‘తిరస్కరించు/నిరాకరించు’ అనే విస్తృత భావం ఉన్నా, తక్షణ కథన సందర్భంలో పేతురు యేసును ఎరుగనని చెప్పాడు. ఎరుగననడం ఆ నిరాకరణ స్వరూపాన్ని సహజంగా తెలియజేస్తుంది.
- issue: πικρῶς లో పశ్చాత్తాపాన్ని స్పష్టంగా చేర్చాలా
  choice: మనసు విరిగేలా ఏడ్చాడు
  alternative: పశ్చాత్తాపంతో ఏడ్చాడు
  rationale: మూలపాఠం తీవ్రమైన దుఃఖాన్ని చెబుతుంది గాని ‘పశ్చాత్తాపం’ అనే పదాన్ని ఉపయోగించదు; అందువల్ల ఆ వేదాంత వ్యాఖ్యానాన్ని నేరుగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ప్రత్యక్ష సంభాషణలో సహజమైన ఏకవచన ‘నువ్వు’ వాడబడింది. మూలంలోని కాలక్రమం, భావతీవ్రత నిలుపబడ్డాయి.
