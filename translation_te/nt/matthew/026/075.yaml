revisions:
- from: 'అప్పుడు పేతురు యేసు చెప్పిన మాటను జ్ఞాపకం చేసుకున్నాడు: “కోడి కూయకముందే[a] నువ్వు మూడుసార్లు నన్ను ఎరుగనంటావు.” అతడు బయటికి వెళ్లి మనసు విరిగేలా ఏడ్చాడు.'
  to: 'పేతురు యేసు చెప్పిన మాటను జ్ఞాపకం చేసుకున్నాడు: “కోడి కూయకముందే[a] నువ్వు మూడుసార్లు నన్ను నిరాకరిస్తావు.” అతడు బయటికి వెళ్లి చాలా దుఃఖంగా ఏడ్చాడు.'
  rationale: The revision retains all narrative elements and avoids doctrinal expansion. It uses direct modern Telugu for Peter’s denial and renders πικρῶς as intense sorrow rather than adding the figurative idea of a broken heart. The footnote anchor and its lexical alternative are retained and clarified.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:37Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter’s remembering Jesus’ prior saying, the threefold denial, departure outside, and ensuing grief. However, “మనసు విరిగేలా” adds a particular image not expressed by πικρῶς (‘bitterly’) and is less direct than a rendering of intense sorrow. “అప్పుడు” can also imply a stronger temporal transition than the connective καί requires.
  naturalness: The Telugu is generally fluent and accessible. “నన్ను ఎరుగనంటావు” is understandable, but “నన్ను నిరాకరిస్తావు” is more natural in modern standard Telugu and directly represents ἀπαρνήσῃ without narrowing it to a specific wording of denial.
  terminology: “పేతురు,” “యేసు,” “కోడి,” and “మూడుసార్లు” are appropriate. No title is added to Jesus. “నిరాకరిస్తావు” best retains the broad sense of denying/disowning Jesus.
  issues:
  - severity: medium
    issue: “మనసు విరిగేలా ఏడ్చాడు” for ἔκλαυσεν πικρῶς
    rationale: This phrase can portray being heartbroken, an image not stated in the Greek. The source states that he wept bitterly; “చాలా దుఃఖంగా ఏడ్చాడు” conveys the intensity without adding the image.
  - severity: low
    issue: “అప్పుడు” for καί
    rationale: The Greek begins with a simple connective, ‘and.’ Telugu need not reproduce every connective, but “అప్పుడు” can introduce an unnecessary temporal nuance. Omitting it produces smoother narration.
  - severity: low
    issue: “నన్ను ఎరుగనంటావు” for ἀπαρνήσῃ με
    rationale: The expression is contextually plausible, but it narrows the verb ‘deny’ to saying one does not know Jesus. “నన్ను నిరాకరిస్తావు” preserves the source verb’s broader sense in modern Telugu.
  revised_text: 'పేతురు యేసు చెప్పిన మాటను జ్ఞాపకం చేసుకున్నాడు: “కోడి కూయకముందే[a] నువ్వు మూడుసార్లు నన్ను నిరాకరిస్తావు.” అతడు బయటికి వెళ్లి చాలా దుఃఖంగా ఏడ్చాడు.'
