  text: While Jesus was in Bethany[a], in the house of Simon the leper[b],
translation:
  language: te
  text: యేసు బేతనియలో[a] కుష్ఠరోగి సీమోను ఇంట్లో[b] ఉన్నప్పుడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యేసు బేతనియలో ఉండగా.’ గ్రీకులోని జెనిటివ్ అబ్సల్యూట్ నిర్మాణం సంఘటనకు కాలసంబంధ నేపథ్యాన్ని ఏర్పరుస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘కుష్ఠరోగి’ అనేది సీమోనును గుర్తించడానికి ఉపయోగించిన గ్రీకు బిరుదుకు అనువాదం. దాని వల్ల అతనికి ఆ స్థితి అప్పటికీ ఉందా, లేక గతంలో ఉందా అన్నది నిర్ధారించబడదు.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: యేసు … ఉన్నప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణం సంఘటనకు కాలసంబంధ నేపథ్యాన్ని ఏర్పరుస్తుంది. సహజమైన తెలుగులో ‘ఉన్నప్పుడు’ దాని సందర్భార్థాన్ని నిలుపుతుంది; γίνομαιను పదశః అనువదించడం ఇక్కడ అసహజం. δέ స్వల్ప కథన సంధానాన్ని సూచిస్తుంది; ప్రత్యేక పదంతో చూపకుండానే తెలుగు వాక్యప్రవాహంలో అది వ్యక్తమవుతుంది.
- source_word: ἐν Βηθανίᾳ
  choice: బేతనియలో
  rationale: ἐν యొక్క స్థలార్థాన్ని సహజంగా తెలుపుతుంది; Βηθανία అనే స్థలనామాన్ని ‘బేతనియ’గా లిప్యంతరీకరించింది.
- source_word: ἐν οἰκίᾳ Σίμωνος
  choice: సీమోను ఇంట్లో
  rationale: ఇది సీమోనుకు చెందిన ఇల్లు అనే స్వామ్యసంబంధాన్ని సహజమైన తెలుగు నిర్మాణంలో తెలుపుతుంది.
- source_word: τοῦ λεπροῦ
  choice: కుష్ఠరోగి అని పిలువబడే
  rationale: λεπρός సీమోనును గుర్తించడానికి వాడిన బిరుదు. ‘అని పిలువబడే’ అనేది అతనికి అప్పటికీ ఆ వ్యాధి ఉందని తేల్చకుండా ఆ గుర్తింపు స్వభావాన్ని కాపాడుతుంది; ‘కుష్ఠరోగి’ సంప్రదాయ, సంక్షిప్త సమానార్థకం.
theological_decisions:
- issue: ‘కుష్ఠరోగి’ అనే బిరుదు సీమోను అప్పటి స్థితి గురించి కలిగించే సూచన
  choice: ‘కుష్ఠరోగి అని పిలువబడే సీమోను’ అని గుర్తింపు బిరుదును నిలుపుతూ, అతనికి అప్పటికీ వ్యాధి ఉందో లేదో నిర్ధారించలేదు.
  alternative: ‘మునుపు కుష్ఠరోగిగా ఉన్న సీమోను’ లేదా ‘చర్మవ్యాధిగల సీమోను’
  rationale: గ్రీకు పాఠం గుర్తింపు బిరుదును మాత్రమే ఇస్తుంది; గతంలో స్వస్థత పొందాడని గానీ, ఆధునిక వైద్యపరంగా నిర్దిష్ట వ్యాధి ఉందని గానీ చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ఇది తరువాతి వచనంతో కొనసాగే ఆధీన కాలవాక్యం కాబట్టి చివర కామా ఉంచబడింది. ‘కుష్ఠరోగి’ అనే పదానికి సంబంధించిన అవసరమైన స్పష్టతను అనువాదంలోనే ‘అని పిలువబడే’ ద్వారా ఇచ్చినందున అదనపు పాదసూచిక పెట్టలేదు; అందువల్ల ప్రధాన పాఠ్యంలో [a] మాత్రమే ఉంది.
