revisions:
- from: అప్పుడు ఆయనను అప్పగించబోతున్న యూదా, “రబ్బీ, నేను కాను కదా?” అని అడిగాడు. యేసు అతనితో, “నువ్వే అన్నావు” అని చెప్పాడు.
  to: 'అప్పుడు ఆయనను అప్పగించబోతున్న యూదా జవాబిచ్చి ఇలా అన్నాడు: “రబ్బీ, నేను కాను కదా?” యేసు అతనితో ఇలా అన్నాడు: “నువ్వే అన్నావు.”'
  rationale: The revision restores the source’s explicit ‘answered and said’ framing while retaining the draft’s faithful lexical choices and the ambiguity of Jesus’ reply. No footnotes are needed.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:21Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves Judas’s identifying participle, the negative-answer-expecting question, ‘Rabbi,’ and Jesus’ deliberately indirect reply. However, ‘అడిగాడు’ represents only speaking a question and loses the explicit narrative indication that Judas answered. Restoring that element is a safe, source-based improvement.
  naturalness: The Telugu is clear and modern. ‘జవాబిచ్చి ఇలా అన్నాడు’ is natural narrative Telugu and retains the source’s responsive force without mechanically duplicating Greek wording.
  terminology: ‘అప్పగించబోతున్న’ appropriately retains the broad sense of παραδίδω rather than prematurely narrowing it to ‘betray.’ ‘రబ్బీ’ and ‘నువ్వే అన్నావు’ are suitable; the latter preserves the concise, non-explicit formulation of Σὺ εἶπας.
  issues:
  - severity: low
    issue: The draft renders ἀποκριθεὶς ... εἶπεν simply as ‘అడిగాడు.’
    rationale: While Judas does ask a question, the Greek explicitly presents it as an answer. This responsive narrative detail should be retained in a complete translation.
  revised_text: 'అప్పుడు ఆయనను అప్పగించబోతున్న యూదా జవాబిచ్చి ఇలా అన్నాడు: “రబ్బీ, నేను కాను కదా?” యేసు అతనితో ఇలా అన్నాడు: “నువ్వే అన్నావు.”'
  revised_footnotes: []
  revision_rationale: The revision restores the source’s explicit ‘answered and said’ framing while retaining the draft’s faithful lexical choices and the ambiguity of Jesus’ reply. No footnotes are needed.
