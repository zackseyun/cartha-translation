id: MAT.26.25
reference: Matthew 26:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: te
  text: 'అప్పుడు ఆయనను అప్పగించబోతున్న యూదా జవాబిచ్చి ఇలా అన్నాడు: “రబ్బీ, నేను కాను కదా?” యేసు అతనితో ఇలా అన్నాడు: “నువ్వే అన్నావు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: ఆయనను అప్పగించబోతున్న
  rationale: παραδίδω యొక్క మూలభావమైన ‘అప్పగించడం’ను నిలుపుతూ, సందర్భంలో సమీపిస్తున్న ద్రోహకార్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Μήτι ἐγώ εἰμι
  choice: నేను కాను కదా?
  rationale: μήτι ఆశించే ప్రతికూల సమాధానాన్ని తెలుగులో సహజంగా తెలిపే ప్రశ్నారూపం; యూదా అడిగిన ప్రశ్నలోని ఉద్విగ్నతను నిలుపుతుంది.
- source_word: ῥαββί
  choice: రబ్బీ
  rationale: సంబోధనను అనువదించకుండా ప్రసిద్ధ రూపంలో ఉంచి, యూదా ఉపయోగించిన ప్రత్యేక బిరుదును కాపాడుతుంది.
- source_word: Σὺ εἶπας
  choice: నువ్వే అన్నావు
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తతను, పరోక్ష ధృవీకరణలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
theological_decisions:
- issue: Σὺ εἶπας అనే జవాబు ప్రత్యక్ష అంగీకారమా లేక పరోక్ష ధృవీకరణమా
  choice: నువ్వే అన్నావు
  alternative: అవును, నువ్వే
  rationale: మూలపాఠం స్పష్టమైన ‘అవును’ అనకుండా పరోక్షంగా స్పందిస్తుంది; దాని వాక్యరూపం మరియు వ్యాఖ్యానాత్మక ఉద్రిక్తతను అలాగే ఉంచాలి.
- issue: యూదా చర్యకు ఉపయోగించిన παραδίδω యొక్క అనువాదం
  choice: అప్పగించబోతున్న
  alternative: ద్రోహం చేయబోతున్న
  rationale: ‘ద్రోహం’ సందర్భార్థాన్ని స్పష్టం చేసినా, మూల క్రియ యొక్క విస్తృతమైన ‘అప్పగించు’ భావాన్ని సంకుచితం చేస్తుంది; అందువల్ల మూలానికి దగ్గరైన పదాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే శైలి. గ్రీకులోని ‘జవాబిచ్చి అన్నాడు’ అనే పునరుక్తిని తెలుగులో సహజమైన ‘అడిగాడు’గా కుదించాం; ప్రత్యుత్తరంలో వక్తను స్పష్టంచేయడానికి ‘యేసు’ను చేర్చాం.
