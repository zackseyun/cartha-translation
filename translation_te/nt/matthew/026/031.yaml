  source_fidelity: ప్రధాన పాఠ్యం గ్రీకు వచనార్థాన్ని విశ్వసనీయంగా ప్రతిబింబిస్తుంది. Πάντες ὑμεῖς యొక్క నొక్కిచెప్పే భావం ‘మీరందరూ’లో ఉంది; ἐν τῇ νυκτὶ ταύτῃ ‘ఈ రాత్రి’గా, γέγραπται γάρ లేఖన-ఉల్లేఖన సూత్రంగా, అలాగే కాపరి–మందలోని గొర్రెల రూపకం నిలిచాయి. σκανδαλισθήσεσθε ను ‘నా కారణంగా నన్ను విడిచిపెడతారు’గా సందర్భానుగుణంగా ఇచ్చారు; ఇది వెంటనే జరిగే శిష్యుల పరిత్యాగాన్ని స్పష్టపరుస్తుంది, మరియు పాదసూచిక మూలపదానికి ఉన్న విస్తృతమైన ‘తడబడడం’ భావాన్ని కాపాడుతుంది.
  naturalness: ఆధునిక ప్రామాణిక తెలుగులో వాక్యం సులభంగా, గౌరవప్రదమైన కథనశైలిలో ఉంది. ‘అప్పుడు యేసు వారితో ఇలా అన్నాడు’ తెలుగు కథనంలో సహజం. ‘మందలోని గొర్రెలు చెదరగొట్టబడతాయి’ కొద్దిగా లేఖనశైలిని కలిగివున్నా, ఉల్లేఖన సందర్భానికి తగినది మరియు గ్రీకులోని కర్మణి భావాన్ని బాగా ఇస్తుంది.
  terminology: ‘యేసు,’ ‘కాపరి,’ ‘మంద,’ ‘గొర్రెలు,’ మరియు ‘రాయబడి ఉంది’ వంటి పదాలు స్థిరమైన, అర్థవంతమైన బైబిలు తెలుగు వాడుకకు సరిపోతాయి. ‘నన్ను విడిచిపెడతారు’ను అంతిమ మతభ్రష్టత్వానికి సంబంధించిన సాంకేతిక పదంగా చేయలేదు. జెకర్యా ఉల్లేఖనంలో మొదటి పురుష కర్తను వివరణాత్మకంగా విస్తరించకుండా నిలిపారు.
