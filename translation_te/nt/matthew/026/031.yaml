id: MAT.26.31
reference: Matthew 26:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: te
  text: 'అప్పుడు యేసు వారితో ఇలా అన్నాడు: “ఈ రాత్రి మీరందరూ నా కారణంగా నన్ను విడిచిపెడతారు[a]. ఎందుకంటే, ‘నేను కాపరిని కొడతాను; మందలోని గొర్రెలు చెదరగొట్టబడతాయి’ అని రాయబడి ఉంది[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా విషయంలో మీరందరూ తడబడతారు,” “తడబడేలా చేయబడతారు,” లేదా “అభ్యంతరపడతారు.” గ్రీకు పదానికి ఈ భావాల పరిధి ఉంది; ఇక్కడి సందర్భం శిష్యులు యేసును విడిచిపెట్టడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: జెకర్యా 13:7 నుండి ఉల్లేఖనం.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: అప్పుడు యేసు వారితో ఇలా అన్నాడు
  rationale: గ్రీకు కథనంలోని చారిత్రక వర్తమాన కాలాన్ని సహజమైన ఆధునిక తెలుగు కథనశైలిలో భూతకాలంగా ఇచ్చాం; Τότε యొక్క సంఘటనాక్రమ భావాన్ని ‘అప్పుడు’ నిలుపుతుంది.
- source_word: Πάντες ὑμεῖς
  choice: మీరందరూ
  rationale: ὑμεῖς మరియు Πάντες కలిగిన నొక్కిచెప్పే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: σκανδαλισθήσεσθε ἐν ἐμοὶ
  choice: నా కారణంగా నన్ను విడిచిపెడతారు
  rationale: సందర్భంలో శిష్యులు యేసును విడిచి పారిపోవడమే ప్రధాన భావం. ‘తడబడతారు’ అనే రూపకం ఒక్కటే ఆ సందర్భార్థాన్ని పూర్తిగా తెలియజేయకపోవచ్చు; అయినా గ్రీకు పదంలోని విస్తృత భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: ఈ రాత్రి
  rationale: గ్రీకు పదక్రమానికి సమీపంగా ఉంటూనే ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: γέγραπται γάρ
  choice: ఎందుకంటే, … అని రాయబడి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే సంప్రదాయ పరిపూర్ణ కర్మణి సూత్రాన్ని నిలుపుతుంది.
- source_word: Πατάξω τὸν ποιμένα
  choice: నేను కాపరిని కొడతాను
  rationale: క్రియ ఫలితాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘strike’ భావాన్ని, కాపరి రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης
  choice: మందలోని గొర్రెలు చెదరగొట్టబడతాయి
  rationale: భవిష్యత్ కర్మణి రూపాన్ని, అలాగే πρόβατα మరియు ποίμνης రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: σκανδαλισθήσεσθε యొక్క సందర్భార్థం
  choice: ఆ రాత్రి శిష్యులు యేసుతో తమ నమ్మకమైన అనుబంధంలో తడబడి ఆయనను విడిచిపెడతారని తెలిపేలా అనువదించడం
  alternative: కేవలం ‘అభ్యంతరపడతారు’ లేదా సాధారణంగా ‘తడబడతారు’ అని అనువదించడం
  rationale: తదుపరి సందర్భం మరియు కాపరి–గొర్రెల ఉల్లేఖనం శిష్యుల చెదరిపోవడాన్ని సూచిస్తాయి. ఇది అంతిమ మతభ్రష్టత్వం అనే తరువాతి సిద్ధాంత వర్గాన్ని బలవంతంగా రుద్దదు.
- issue: λέγει అనే చారిత్రక వర్తమానం
  choice: తెలుగు కథనంలో సహజమైన ‘అన్నాడు’
  alternative: గ్రీకు రూపాన్ని ప్రతిబింబించే ‘అంటున్నాడు’ లేదా ‘అన్నాడు’కు బదులు ‘అంటాడు’
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు. ఆధునిక తెలుగు కథన ప్రవాహంలో భూతకాలం సహజంగా ఉండగా, సంఘటనార్థం మారదు.
- issue: జెకర్యా 13:7 ఉల్లేఖనంలోని కర్త
  choice: ‘నేను కాపరిని కొడతాను’ అనే మొదటి పురుష రూపాన్ని యథాతథంగా నిలుపడం
  alternative: కర్తను దేవుడు అని వివరణాత్మకంగా చేర్చడం
  rationale: మూల వాక్యంలోని ఉద్దేశపూర్వక మొదటి పురుషాన్ని నిలుపుతూ, వచనంలో లేని వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి. ‘మందలోని గొర్రెలు’ అనే రూపం మూలంలోని రెండు నామపదాలను నిలుపుతుంది. పాదసూచిక గుర్తులు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
