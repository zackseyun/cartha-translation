translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయినా గౌరవప్రదమైన కథన శైలిలో రూపొందించబడింది. వివరణాత్మక γάρ సంబంధం స్పష్టంగా ఉంచబడింది.
