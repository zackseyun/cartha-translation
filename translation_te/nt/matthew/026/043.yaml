source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ⸂πάλιν εὗρεν αὐτοὺς⸃ καθεύδοντας, ἦσαν γὰρ αὐτῶν οἱ ὀφθαλμοὶ βεβαρημένοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: te
  text: ఆయన మళ్లీ వచ్చి, వారు నిద్రపోతుండగా వారిని కనుగొన్నాడు; ఎందుకంటే వారి కళ్లు బరువెక్కి ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి కళ్లు భారంగా ఉన్నాయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: వచ్చి
  rationale: కాలసూచకంగా ప్రధాన క్రియకు ముందు జరిగిన చర్యను తెలిపే ఏరిస్టు కృదంతాన్ని సహజమైన తెలుగు సంయుక్త క్రియారూపంతో అందిస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: చర్య పునరావృతమైందనే సాధారణ అర్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: εὗρεν
  choice: చూశాడు
  rationale: ఇక్కడ εὑρίσκω ఒక స్థితిలో వారిని కనుగొనడం లేదా గమనించడం అనే కథనార్థంలో ఉంది; తెలుగులో ‘వారు నిద్రపోతుండడం చూశాడు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: καθεύδοντας
  choice: నిద్రపోతుండడం
  rationale: ఆయన వచ్చినప్పుడు కొనసాగుతున్న వారి నిద్ర స్థితిని వర్తమాన కృదంత భావంతో నిలుపుతుంది.
- source_word: ἦσαν γὰρ
  choice: ఎందుకంటే ... ఉన్నాయి
  rationale: γάρ ఇచ్చే వివరణాత్మక కారణ సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ ὀφθαλμοὶ
  choice: వారి కళ్లు
  rationale: αὐτῶν οἱ ὀφθαλμοί అనే గ్రీకు నిర్మాణానికి సహజమైన తెలుగు స్వామ్య నిర్మాణం.
- source_word: βεβαρημένοι
  choice: బరువెక్కి ఉన్నాయి
  rationale: βαρέω యొక్క పరిపూర్ణ కర్మణి కృదంతం సూచించే ఫలితస్థితిని సహజమైన తెలుగు నుడికారంలో నిలుపుతుంది; కళ్లు నిద్రమత్తుతో భారంగా ఉన్న భావం వస్తుంది.
