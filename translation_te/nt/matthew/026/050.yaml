id: MAT.26.50
reference: Matthew 26:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: te
  text: అయితే యేసు అతనితో, “స్నేహితుడా, నీవు వచ్చిన పని చేయి.[a]” అన్నాడు. అప్పుడు వారు దగ్గరకు వచ్చి, యేసు మీద చేతులు వేసి ఆయనను పట్టుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్నేహితుడా, నీవు దేనికోసం వచ్చావు?” గ్రీకు ప్రయోగం సంక్షిప్తంగా ఉంది; దాన్ని ప్రశ్నగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: స్నేహితుడా
  rationale: యూదాను నేరుగా సంబోధించే పదం. ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భంలోని నిగ్రహపూర్వకమైన కాని అతిసన్నిహితం కాని స్వరాన్ని నిలుపుతుంది.
- source_word: ἐφ’ ὃ πάρει
  choice: నీవు వచ్చిన పని చేయి
  rationale: గ్రీకు ప్రయోగం సంక్షిప్తంగా, వ్యాకరణపరంగా కొంత సందిగ్ధంగా ఉంది. సందర్భంలో యూదా వచ్చిన ఉద్దేశాన్ని కార్యరూపంలో పెట్టమనే భావాన్ని ప్రధాన పాఠంలో సహజంగా వ్యక్తం చేస్తుంది; ప్రశ్నార్థక అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: προσελθόντες
  choice: దగ్గరకు వచ్చి
  rationale: యేసువైపు కదిలి రావడాన్ని, ఆ తరువాత జరిగిన చర్యతో సహజమైన కథన క్రమంలో తెలియజేస్తుంది.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: యేసు మీద చేతులు వేసి
  rationale: బలవంతంగా పట్టుకోవడాన్ని సూచించే మూలభాషా నుడికారాన్ని తెలుగులోనూ స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐκράτησαν αὐτόν
  choice: ఆయనను పట్టుకున్నారు
  rationale: κρατέω ఇక్కడ బలంగా అదుపులోకి తీసుకోవడాన్ని సూచిస్తుంది. ‘అరెస్టు చేశారు’ అనే అదనపు న్యాయపరమైన స్పష్టీకరణను చేర్చకుండా ప్రత్యక్ష శారీరక చర్యను తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి చర్యకు యేసు ప్రతిస్పందనను స్వల్ప వ్యత్యాసం లేదా కథన మలుపుతో అనుసంధానిస్తుంది.
theological_decisions:
- issue: యూదాను యేసు సంబోధించిన తీరు మరియు ఆయన పలికిన సంక్షిప్త వాక్యానికి అర్థం
  choice: “స్నేహితుడా, నీవు వచ్చిన పని చేయి” అని ప్రధాన పాఠంలో ఉంచడం
  alternative: “స్నేహితుడా, నీవు దేనికోసం వచ్చావు?”
  rationale: Ἑταῖρε అనే సంబోధనను అతిగా ఆప్యాయంగా గానీ, పూర్తిగా నిందాత్మకంగా గానీ మార్చకుండా నిగ్రహపూర్వక స్వరంలో ఉంచుతుంది. తరువాతి గ్రీకు మాటలు నిజంగా సంక్షిప్తమూ సందిగ్ధమూ కావడంతో, సందర్భానుకూలమైన కార్యార్థాన్ని ప్రధాన పాఠంలో ఇచ్చి ప్రశ్నార్థక పఠనాన్ని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన సరళమైన, గౌరవప్రదమైన శైలి. యేసుకు సూచనగా ‘ఆయనను’ వాడి సహజమైన తెలుగు గౌరవప్రయోగాన్ని పాటించాం. మూలంలోని సంక్షిప్తత, ఉద్రిక్తత, సందిగ్ధతను సాధ్యమైనంతవరకు నిలిపాం.
