id: MAT.26.45
reference: Matthew 26:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: te
  text: 'అప్పుడు ఆయన శిష్యుల దగ్గరికి వచ్చి వారితో ఇలా అన్నాడు: “ఇక నిద్రపోండి, విశ్రాంతి తీసుకోండి.[a] ఇదిగో, గడియ సమీపించింది; మనుష్యకుమారుడు పాపుల చేతుల్లోకి అప్పగించబడుతున్నాడు.[b][c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇంకా నిద్రపోతూ విశ్రాంతి తీసుకుంటున్నారా?” గ్రీకు మాటలను అలంకారప్రశ్నగా కూడా అర్థం చేసుకోవచ్చు; ప్రధాన పాఠం వాటిలో ఉండవచ్చిన వ్యంగ్యాన్ని, సందిగ్ధతను నిలుపుతుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “గడియ వచ్చేసింది,” లేక “గడియ ఆసన్నమైంది.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ద్రోహం చేయబడుతున్నాడు.” గ్రీకు పదానికి మరింత విస్తృతంగా “అప్పగించబడుతున్నాడు” లేదా “వశం చేయబడుతున్నాడు” అనే అర్థం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనను సూచించే సహజమైన కాలసంబంధ పదం.
- source_word: ἔρχεται πρὸς τοὺς μαθητάς
  choice: శిష్యుల దగ్గరికి వచ్చి
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగులో సహజ కథనశైలికి అనుగుణంగా భూతకాల సంబంధ క్రియారూపంతో అందించింది; πρός సూచించే సమీపించడాన్ని ‘దగ్గరికి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: λέγει αὐτοῖς
  choice: వారితో ... అని అన్నాడు
  rationale: తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో సహజమైన రూపం; గ్రీకు భావాన్ని మార్చకుండా కథన కాలసామరస్యాన్ని కాపాడుతుంది.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: ఇక నిద్రపోయి విశ్రాంతి తీసుకోండి
  rationale: ఉపరితలంగా ఆజ్ఞారూప భావాన్ని నిలుపుతూ, సందర్భంలోని వ్యంగ్య లేదా అనుమతిసూచక ఉద్వేగాన్ని పూర్తిగా పరిష్కరించకుండా ఉంచుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను గంభీరంగా ఆకర్షించే, ఆధునిక తెలుగులో సహజమైన పదం.
- source_word: ἤγγικεν ἡ ὥρα
  choice: సమయం సమీపించింది
  rationale: ἐγγίζω యొక్క సమీపత్వ భావాన్నీ, పరిపూర్ణ కాలం సూచించే ప్రస్తుత ఫలితాన్నీ సంక్షిప్తంగా కాపాడుతుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: యేసు స్వీయసంబోధనగా స్థిరపడిన బిరుదును వ్యాఖ్యానించకుండా అనువదిస్తుంది.
- source_word: παραδίδοται
  choice: అప్పగించబడుతున్నాడు
  rationale: ‘ద్రోహం చేయబడుతున్నాడు’ అనే సంకుచిత అర్థానికి పరిమితం కాకుండా, అప్పగించడం లేదా అధికారానికి లోను చేయడం అనే విస్తృత గ్రీకు భావాన్ని నిలుపుతుంది.
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: పాపుల చేతికి
  rationale: గ్రీకు దృశ్యరూపకాన్ని సహజమైన తెలుగు ఏకవచన సామెతరూపంలో కాపాడుతుంది; వారి అధీనంలోకి అప్పగింపబడటం అనే భావం స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: Καθεύδετε ... καὶ ἀναπαύεσθε యొక్క వాక్యబలం
  choice: “ఇక నిద్రపోయి విశ్రాంతి తీసుకోండి” అనే వ్యంగ్య లేదా అనుమతిసూచక వాక్యంగా అందించడం
  alternative: “ఇంకా నిద్రపోతూ విశ్రాంతి తీసుకుంటున్నారా?” అనే అలంకారప్రశ్నగా అందించడం
  rationale: గ్రీకు రూపం సందర్భంలో ఆజ్ఞగా, వ్యంగ్యంగా లేదా అలంకారప్రశ్నగా గ్రహించవచ్చు. ప్రధాన పాఠం ఉపరితల రూపాన్ని కాపాడి, వెంటనే వచ్చే ప్రకటనతో ఉన్న ఉద్వేగాన్ని పరిష్కరించదు.
- issue: శ్రమానుభవ సందర్భంలో παραδίδοται అర్థం
  choice: “అప్పగించబడుతున్నాడు”
  alternative: “ద్రోహం చేయబడుతున్నాడు”
  rationale: ఈ విస్తృత పదప్రయోగం యూదా ద్రోహాన్ని మాత్రమే కాక అరెస్టు మరియు శ్రమలకు అప్పగింపబడటాన్నీ కలిగి ఉండగలదు; అంతేకాక క్రియలోని కర్తను అనవసరంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. గ్రీకు చారిత్రక వర్తమానం తెలుగులో సహజమైన భూతకాల కథనంగా మార్చబడింది. సందిగ్ధత ఉన్న చోట ప్రధాన పాఠం దానిని నిలిపి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
