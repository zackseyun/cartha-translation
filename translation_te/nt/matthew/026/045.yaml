  to: 'అప్పుడు ఆయన శిష్యుల దగ్గరికి వచ్చి వారితో ఇలా అన్నాడు: “ఇక నిద్రపోండి, విశ్రాంతి తీసుకోండి.[a] ఇదిగో, గడియ సమీపించింది; మనుష్యకుమారుడు పాపుల చేతుల్లోకి అప్పగించబడుతున్నాడు.[b][c]”'
  rationale: The revision makes limited source-focused and idiomatic corrections. It renders ὥρα as “గడియ,” preserves εἰς χεῖρας with “చేతుల్లోకి,” uses the established title “మనుష్యకుమారుడు,” and improves the speech frame. The main text continues to preserve the grammatical and contextual ambiguity of the opening statement. Footnote c is corrected so that its alternative is intelligible and does not narrow the main rendering’s broader sense.
