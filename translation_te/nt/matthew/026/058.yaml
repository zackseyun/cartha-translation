revisions:
- from: కాని పేతురు దూరం నుంచే ఆయనను వెంబడిస్తూ ప్రధాన యాజకుని ప్రాంగణం వరకు వెళ్లాడు. లోపలికి వెళ్లి, ఏమవుతుందో చూడడానికి పరిచారకులతో[a] కలిసి కూర్చున్నాడు[b].
  to: అయితే పేతురు దూరం నుండి ఆయనను వెంబడిస్తూ ప్రధాన యాజకుని ప్రాంగణం వరకు వెళ్లాడు. లోపలికి వెళ్లి, ముగింపు ఏమిటో చూడడానికి పరిచారకులతో[a] కలిసి కూర్చుని ఉన్నాడు[b].
  rationale: The revision removes added emphasis, represents the imperfect sitting posture more transparently, and brings the main-text rendering of τὸ τέλος closer to its lexical range. The footnote retains the contextual ‘outcome’ sense without specifying beyond the Greek that the outcome concerns Jesus, and it supplies ‘officers’ as an explicit alternative for ὑπηρέται.
