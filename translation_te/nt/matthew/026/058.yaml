id: MAT.26.58
reference: Matthew 26:58
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: te
  text: అయితే పేతురు దూరం నుండి ఆయనను వెంబడిస్తూ ప్రధాన యాజకుని ప్రాంగణం వరకు వెళ్లాడు. లోపలికి వెళ్లి, ముగింపు ఏమిటో చూడడానికి పరిచారకులతో[a] కలిసి కూర్చుని ఉన్నాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సేవకులతో,” “సహాయకులతో,” “అధికారులతో,” లేదా “కాపలాదారులతో.” గ్రీకు పదం ఆధీనంలో పనిచేసే అధికారులను లేదా పరిచారకులను సూచించగలదు; ఇక్కడ వారి ఖచ్చితమైన పాత్ర స్పష్టంగా లేదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “ముగింపును చూడడానికి.” ఇక్కడ ఇది ఈ వ్యవహారం ఎలా ముగుస్తుందో, దాని పరిణామం ఏమిటో చూడడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: వెంబడిస్తూ ... వెళ్లాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న నేపథ్య చర్యను సూచిస్తుంది; తెలుగు సహజ వాక్యనిర్మాణంలో ‘వెంబడిస్తూ ... వెళ్లాడు’ ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ἀπὸ μακρόθεν
  choice: దూరం నుంచే
  rationale: భౌతిక దూరాన్ని ఆధునిక, సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; ‘చే’ పేతురు దూరం పాటించిన సంగతిని ఉద్ఘాటిస్తుంది.
- source_word: ἕως τῆς αὐλῆς
  choice: ప్రాంగణం వరకు
  rationale: ἕως లోని హద్దు లేదా విస్తృతి భావాన్ని ‘వరకు’ నిలుపుతుంది; αὐλή ఇక్కడ చుట్టూ కట్టడాలున్న ప్రాంగణాన్ని సూచిస్తుంది.
- source_word: ἀρχιερέως
  choice: ప్రధాన యాజకుని
  rationale: సువార్తల శ్రమకథన సందర్భంలో ἀρχιερεύςకు ప్రామాణికమైన, అర్థవంతమైన తెలుగు పదబంధం.
- source_word: εἰσελθὼν ἔσω
  choice: లోపలికి వెళ్లి
  rationale: కృదంతం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది; ఈ క్రమాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἐκάθητο
  choice: కూర్చున్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగిన స్థితిని సూచించినా, తెలుగులో ‘కూర్చున్నాడు’ సహజంగా ఆ స్థితినీ, కూర్చోవడం అనే చర్యనూ వ్యక్తం చేయగలదు.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: పరిచారకులతో కలిసి
  rationale: ὑπηρέται ప్రధాన యాజకుని ఆధీనంలో సేవచేసే సహాయక అధికారులు లేదా పరిచారకులను సూచించవచ్చు. ‘పరిచారకులు’ వారిని కేవలం గృహ సేవకులుగానో సాయుధ కాపలాదారులుగానో అతిగా నిర్దిష్టం చేయదు.
- source_word: ἰδεῖν
  choice: చూడడానికి
  rationale: ప్రయోజనార్థక క్రియారూపాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ τέλος
  choice: ఏమవుతుందో
  rationale: ఈ సందర్భంలో ‘ముగింపు’ లేదా ‘ఫలితం’ అనే భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, పేతురు జరగబోయేదాన్ని తెలుసుకోవాలనుకున్నాడనే ఉద్దేశాన్ని అతిగా వివరణ చేయకుండా ఉంచుతుంది.
theological_decisions:
- issue: τὸ τέλος యొక్క సందర్భార్థం
  choice: ఏమవుతుందో
  alternative: ముగింపు ఏమిటో / పరిణామం ఏమిటో
  rationale: గ్రీకు పదానికి అక్షరార్థంగా ‘ముగింపు’ అనే భావమున్నా, ఇక్కడ జరుగుతున్న విచారణ లేదా యేసుకు సంభవించబోయే దాని ఫలితాన్ని సూచించే అవకాశం ఉంది. ప్రధాన పాఠ్యంలో సహజ సందర్భార్థాన్ని ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. గ్రీకు వాక్యంలోని చర్యల క్రమం, పేతురు దూరం నుంచే వెంబడించిన కొనసాగింపు, ὑπηρέται మరియు τέλος పదాల భావవిస్తృతి నిలుపబడ్డాయి.
