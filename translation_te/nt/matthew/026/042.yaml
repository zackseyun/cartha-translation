id: MAT.26.42
reference: Matthew 26:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάλιν ἐκ δευτέρου ἀπελθὼν προσηύξατο λέγων· Πάτερ μου, εἰ οὐ δύναται ⸀τοῦτο ⸀παρελθεῖν ἐὰν μὴ αὐτὸ πίω, γενηθήτω τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: te
  text: 'ఆయన మళ్లీ, రెండోసారి వెళ్లి ఇలా ప్రార్థించాడు: “నా తండ్రీ, నేను ఈదాన్ని తాగితే తప్ప ఇది దాటిపోవడం సాధ్యం కాకపోతే, నీ చిత్తం నెరవేరుగాక.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: మళ్లీ, రెండోసారి
  rationale: పునరావృత్తిని తెలిపే πάλιν, ‘రెండోసారి’ అనే అర్థమిచ్చే ἐκ δευτέρου—రెండింటినీ కుదించకుండా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀπελθὼν προσηύξατο
  choice: వెళ్లి ... ప్రార్థించాడు
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను తెలిపే భూతకాల కృదంతాన్ని తెలుగు కథనశైలికి సహజంగా సంయుక్త క్రియగా అనువదించింది.
- source_word: Πάτερ μου
  choice: నా తండ్రీ
  rationale: సంబోధనతో కూడిన స్వామ్య భావాన్ని నేరుగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: ఇది తొలగిపోవడం సాధ్యం కాకపోతే
  rationale: οὐ δύναται లోని అసాధ్యత భావాన్ని, παρελθεῖν లోని దాటిపోవడం/తొలగిపోవడం భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τοῦτο ... αὐτό
  choice: ఇది ... దీనిని
  rationale: ఈ వచనంలో ‘పాత్ర’ అనే నామవాచకం లేకపోవడంతో, గ్రీకు సూచనార్థక సర్వనామాలనే ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: నేను దీనిని తాగితే తప్ప
  rationale: ἐὰν μή అనే మినహాయింపు షరతును ‘తప్ప’తో స్పష్టంగా, సహజంగా అందిస్తుంది; αὐτόను ‘దీనిని’గా ఉంచుతుంది.
- source_word: γενηθήτω τὸ θέλημά σου
  choice: నీ చిత్తం నెరవేరుగాక
  rationale: ఆజ్ఞార్థక ప్రార్థనా భావాన్ని నిలుపుతూ, దేవుని సంకల్పం కార్యరూపం దాల్చాలనే అర్థాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: τοῦτο / αὐτόకు ‘పాత్ర’ అని ప్రధాన పాఠ్యంలో స్పష్టీకరించాలా?
  choice: ‘ఇది ... దీనిని’ అని గ్రీకు సర్వనామాలను నిలుపడం
  alternative: ‘ఈ పాత్ర ... దీనిని’ అని సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో చేర్చడం
  rationale: మత్తయి 26:39 సందర్భంలో ఇది శ్రమల పాత్రను సూచిస్తుంది; అయితే 26:42లో ποτήριον లేదు. అందువల్ల ప్రధాన పాఠ్యంలో లేని నామవాచకాన్ని చేర్చకుండా, సందర్భార్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: యేసు సమర్పణ ప్రార్థనను ఎలా వ్యక్తపరచాలి?
  choice: నీ చిత్తం నెరవేరుగాక
  alternative: నీ చిత్తప్రకారం జరగనివ్వు
  rationale: γενηθήτω యొక్క ప్రార్థనాత్మక ఆజ్ఞార్థక బలాన్ని నిలుపుతుంది; మత్తయి 6:10లోని ప్రార్థనా భాషతో భావసామ్యాన్ని కూడా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలి, ప్రార్థనకు తగిన గౌరవప్రదమైన సంబోధన వాడబడ్డాయి. మూలంలోని ‘మళ్లీ’ మరియు ‘రెండోసారి’ రెండూ నిలుపబడ్డాయి; సందర్భం సూచించే ‘పాత్ర’ను ప్రధాన పాఠ్యంలో చేర్చలేదు.
