source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: te
  text: 'ఆయన ఇలా జవాబిచ్చాడు: “నాతో కలిసి గిన్నెలో చెయ్యి ముంచిన అతడే నన్ను అప్పగించనున్నాడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను ద్రోహం చేస్తాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: జవాబిచ్చాడు
  rationale: కృదంతం + సమాపక క్రియ కలిగిన ఈ గ్రీకు ప్రయోగం సహజంగా ‘జవాబిచ్చాడు’ అనే ఒకే భావాన్ని ఇస్తుంది; రెండు క్రియలను విడిగా అనువదించడం తెలుగులో కృత్రిమంగా ఉంటుంది.
- source_word: ἐμβάψας
  choice: ముంచినవాడు
  rationale: అయోరిస్టు కృదంతం ఇప్పటికే జరిగిన, వ్యక్తిని గుర్తించే చర్యను సూచిస్తుంది; ‘ముంచినవాడు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μετ’ ἐμοῦ
  choice: నాతో పాటు
  rationale: జెనిటివ్‌తో μετά సహచర్యాన్ని సూచిస్తుంది; ‘నాతో పాటు’ స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: τὴν χεῖρα
  choice: చెయ్యి
  rationale: శరీర భాగంతో గ్రీకు నిర్దిష్ట ఉపపదాన్ని తెలుగులో ప్రత్యేక స్వామ్యసూచక పదం లేకుండానే సహజంగా వ్యక్తం చేయవచ్చు; కర్తకు చెందిన చెయ్యే ఉద్దేశమని సందర్భం స్పష్టం చేస్తుంది.
- source_word: ἐν τῷ τρυβλίῳ
  choice: గిన్నెలో
  rationale: τρύβλιον భోజన పదార్థం ఉంచే గిన్నె లేదా పళ్లెాన్ని సూచించవచ్చు; ‘గిన్నె’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: οὗτός
  choice: వాడే
  rationale: నిర్దేశక సర్వనామంలోని ఉద్ఘాటనను తెలుగు ప్రత్యయం ‘-ఏ’ సహజంగా నిలుపుతుంది.
- source_word: παραδώσει
  choice: అప్పగిస్తాడు
  rationale: παραδίδωμι యొక్క ప్రాథమిక భావమైన ‘అప్పగించు/చేతికి ఒప్పగించు’ను ఇది నిలుపుతుంది; ఈ సందర్భంలో ఉన్న ద్రోహ భావం కథన పరిసరాల ద్వారా స్పష్టమవుతుంది.
theological_decisions:
- issue: యూదా సందర్భంలో παραδίδωμι అనువాదం
  choice: అప్పగిస్తాడు
  alternative: ద్రోహం చేస్తాడు
  rationale: క్రియకు ‘అప్పగిస్తాడు’ అనే ప్రత్యక్ష భావం ఉంది; సందర్భం ఆ అప్పగింపు ద్రోహపూరితమని తెలియజేస్తుంది. ‘ద్రోహం చేస్తాడు’ సందర్భార్థాన్ని ముందుకు తెస్తుంది గాని, అసలు క్రియలోని అప్పగింపు చర్యను మరుగుపరచవచ్చు. అందువల్ల మూలంలోని భావ ఉద్రిక్తతను నిలుపుతూ ప్రత్యక్ష అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సందర్భార్థాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష వాక్య నిర్మాణం. ‘వాడే’ సంభాషణలో సహజమైనప్పటికీ అవమానార్థకం కాకుండా గుర్తింపుపై ఉద్ఘాటనను వ్యక్తం చేస్తుంది.
