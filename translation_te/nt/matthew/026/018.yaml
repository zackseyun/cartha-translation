revisions:
- from: 'ఆయన ఇలా అన్నాడు: “పట్టణంలోకి వెళ్లి ఫలానా వ్యక్తి దగ్గరకు వెళ్లి, అతనితో ఇలా చెప్పండి: ‘బోధకుడు ఇలా అంటున్నాడు: “నా సమయం సమీపించింది. నేను నా శిష్యులతో కలిసి నీ దగ్గర పస్కా ఆచరిస్తాను.”’”'
  to: 'ఆయన ఇలా అన్నాడు: “పట్టణంలోకి వెళ్లి, అక్కడ ఫలానా వ్యక్తి దగ్గరకు వెళ్లి అతనితో ఇలా చెప్పండి: ‘గురువు ఇలా అంటున్నాడు: “నా సమయం దగ్గరగా ఉంది. నేను నా శిష్యులతో కలిసి నీ దగ్గర పస్కా ఆచరిస్తాను.”’”'
  rationale: The revision corrects the Greek present sense of ἐγγύς ἐστιν, uses the more natural and established Telugu Gospel title “గురువు,” and smooths repeated movement language without adding “house” or otherwise narrowing πρὸς σέ. No footnotes are needed because the Telugu text retains the relevant ambiguities directly.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the intentionally unnamed but particular person (πρὸς τὸν δεῖνα), the broad ambiguity of καιρός, the hospitality-oriented but non-explicit sense of πρὸς σέ, the Passover idiom, and the disciples. However, “సమీపించింది” presents the time as having already drawn near, whereas ἐγγύς ἐστιν is present: “is near.”'
  naturalness: The repeated “వెళ్లి ... వెళ్లి” is understandable but unnecessarily awkward in modern standard Telugu. “గురువు” is the normal, established Gospel-register equivalent of ὁ διδάσκαλος; “బోధకుడు” can sound like a generic instructor or preacher.
  terminology: Use “గురువు” for διδάσκαλος and retain “పస్కా,” “శిష్యులు,” and “ఫలానా వ్యక్తి.” “నా సమయం దగ్గరగా ఉంది” accurately retains the open scope of καιρός without adding “appointed” or defining its referent.
  issues:
  - severity: medium
    issue: Aspect of Ὁ καιρός μου ἐγγύς ἐστιν
    rationale: “నా సమయం సమీపించింది” is perfective/completed in Telugu, while the Greek present predicate says that the time is presently near. “నా సమయం దగ్గరగా ఉంది” is closer and preserves the intended ambiguity.
  - severity: low
    issue: Register and naturalness of Ὁ διδάσκαλος
    rationale: “బోధకుడు” is intelligible, but “గురువు” is more idiomatic in modern Telugu and is the conventional Gospel term for Jesus as διδάσκαλος.
  - severity: low
    issue: Repetitive movement wording
    rationale: “పట్టణంలోకి వెళ్లి ... దగ్గరకు వెళ్లి” is a literal but clumsy repetition. Adding “అక్కడ” permits natural Telugu while retaining the two destination elements of the Greek.
  revised_text: 'ఆయన ఇలా అన్నాడు: “పట్టణంలోకి వెళ్లి, అక్కడ ఫలానా వ్యక్తి దగ్గరకు వెళ్లి అతనితో ఇలా చెప్పండి: ‘గురువు ఇలా అంటున్నాడు: “నా సమయం దగ్గరగా ఉంది. నేను నా శిష్యులతో కలిసి నీ దగ్గర పస్కా ఆచరిస్తాను.”’”'
  revised_footnotes: []
  revision_rationale: The revision corrects the Greek present sense of ἐγγύς ἐστιν, uses the more natural and established Telugu Gospel title “గురువు,” and smooths repeated movement language without adding “house” or otherwise narrowing πρὸς σέ. No footnotes are needed because the Telugu text retains the relevant ambiguities directly.
