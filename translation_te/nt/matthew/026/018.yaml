id: MAT.26.18
reference: Matthew 26:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: te
  text: 'ఆయన ఇలా అన్నాడు: “పట్టణంలోకి వెళ్లి, అక్కడ ఫలానా వ్యక్తి దగ్గరకు వెళ్లి అతనితో ఇలా చెప్పండి: ‘గురువు ఇలా అంటున్నాడు: “నా సమయం దగ్గరగా ఉంది. నేను నా శిష్యులతో కలిసి నీ దగ్గర పస్కా ఆచరిస్తాను.”’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπάγετε
  choice: వెళ్లండి
  rationale: చలనాన్ని సూచించే బహువచన ఆజ్ఞ; సందర్భానికి సహజంగా, అదనపు బలం చేర్చకుండా ఉంటుంది.
- source_word: πρὸς τὸν δεῖνα
  choice: ఫలానా వ్యక్తి దగ్గరకు
  rationale: δεῖνα ఉద్దేశపూర్వకంగా పేరు చెప్పని, అయితే నిర్దిష్టమైన వ్యక్తిని సూచిస్తుంది. ‘ఫలానా వ్యక్తి’ ఈ లక్షణాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Ὁ διδάσκαλος
  choice: బోధకుడు
  rationale: διδάσκαλος యొక్క బోధించే వ్యక్తి అనే భావాన్ని గౌరవప్రదమైన, సులభమైన తెలుగులో వ్యక్తం చేస్తుంది; κύριος భావాన్ని కలపదు.
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: నా సమయం సమీపించింది
  rationale: καιρός ఇక్కడ ప్రాముఖ్యమైన సమయాన్ని సూచించినా, అది మరణాన్నా, భోజనాన్నా, లేక పరిచర్య పరిపూర్ణతనంతటినీ సూచిస్తుందా అన్నది వచనం స్పష్టంగా పరిమితం చేయదు. అందువల్ల విస్తృతతను నిలుపుతుంది.
- source_word: πρὸς σὲ
  choice: నీ దగ్గర
  rationale: అక్షరార్థంగా ‘నీ వైపు/నీతో’ అనే భావం. ఆతిథ్య సందర్భంలో స్థలాన్ని సూచించినప్పటికీ, మూలంలో లేని ‘ఇల్లు’ అనే పదాన్ని చేర్చకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ποιῶ τὸ πάσχα
  choice: పస్కా ఆచరిస్తాను
  rationale: ποιέω + πάσχα అనే గ్రీకు నుడికారం పస్కాను పాటించడం లేదా ఆచరించడం అనే అర్థం ఇస్తుంది. ‘ఆచరిస్తాను’ తెలుగులో సహజంగా ఉండి పండుగాచరణ భావాన్ని నిలుపుతుంది.
- source_word: τὸ πάσχα
  choice: పస్కా
  rationale: యూదుల పస్కా పండుగకు తెలుగులో స్థిరపడిన పేరు.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: నా శిష్యులతో కలిసి
  rationale: μαθηταί కు సువార్తల సందర్భంలో స్థిరమైన, సంబంధపూర్వక అర్థాన్ని ఇచ్చే సహజ తెలుగు రూపం.
theological_decisions:
- issue: యేసు సమీపించిన καιρός గురించి చెప్పిన మాట యొక్క పరిధి
  choice: ‘నా సమయం సమీపించింది’ అని విస్తృతంగా అనువదించడం
  alternative: ‘నా నియమిత సమయం సమీపించింది’ లేదా ‘నా మరణ సమయం సమీపించింది’
  rationale: ఈ వచనం సమయం ఆసన్నమైందని చెబుతుంది గాని దాని పరిధిని ఇక్కడే నిర్దిష్టంగా నిర్వచించదు. అందువల్ల మరణం, పస్కా భోజనం, లేదా పరిచర్య పరాకాష్ఠ అనే ఏకైక వివరణను అనువాదంలో రుద్దలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వాక్యశైలి. మూలంలోని ఉద్దేశపూర్వక అనిర్దిష్టతను ‘ఫలానా వ్యక్తి’ ద్వారా, καιρός యొక్క భావవిస్తృతిని ‘సమయం’ ద్వారా నిలిపాం. πρὸς σέ లో స్పష్టంగా లేని ‘ఇల్లు’ను ప్రధాన పాఠ్యంలో చేర్చలేదు.
