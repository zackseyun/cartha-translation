id: MAT.26.29
reference: Matthew 26:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: te
  text: 'కానీ నేను మీతో చెబుతున్నాను: నా తండ్రి రాజ్యంలో మీతో కలిసి దానిని కొత్తగా[a] తాగే ఆ రోజు వరకు, ఇక మీదట ఈ ద్రాక్షావల్లి ఫలం నుండి నేను ఎంతమాత్రమూ తాగను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మళ్లీ.” గ్రీకు విశేషణం గుణంలో లేదా రకంలో కొత్తదనాన్ని సూచించగలదు; రాబోయే రాజ్యంలో దానిని కొత్త విధంగా తాగడమనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: కానీ నేను మీతో చెబుతున్నాను
  rationale: δέ ఇక్కడ స్వల్ప వ్యత్యాసాన్ని లేదా మాటలో మలుపును సూచిస్తుంది; ‘కానీ’ దానిని సహజంగా తెలియజేస్తుంది.
- source_word: οὐ μὴ πίω ἀπ’ ἄρτι
  choice: ఇకనుంచి ... నేను ఇక ఎంతమాత్రమూ తాగను
  rationale: οὐ μή తో కూడిన క్రియ బలమైన భవిష్యత్ నిరాకరణను వ్యక్తం చేస్తుంది; ‘ఎంతమాత్రమూ తాగను’ ఆ ఉద్ఘాటనను ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: ఈ ద్రాక్షావల్లి ఫలాన్ని
  rationale: మూలంలోని ‘ద్రాక్షావల్లి ఫలం/ఉత్పత్తి’ అనే యూదీయ ప్రయోగాన్ని ‘ద్రాక్షారసం’గా స్పష్టీకరించకుండా నిలుపుతుంది.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: ఆ రోజు వరకు
  rationale: ἐκείνης సూచించే నిర్దిష్టమైన భవిష్యత్ దినాన్ని యథాతథంగా తెలియజేస్తుంది.
- source_word: ὅταν αὐτὸ πίνω μεθ’ ὑμῶν
  choice: మీతో కలిసి దీనిని ... తాగే
  rationale: భవిష్యత్తులో సంభవించే సందర్భాన్ని, అలాగే శిష్యులతో కూడిన సహవాసాన్ని సహజమైన తెలుగు వాక్యక్రమంలో వ్యక్తం చేస్తుంది.
- source_word: καινὸν
  choice: కొత్తగా
  rationale: καινός సూచించే కొత్త గుణం లేదా కొత్త విధానాన్ని అతిగా నిర్ధారించకుండా తెలుగు క్రియావిశేషణ రూపంలో అందిస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: నా తండ్రి రాజ్యంలో
  rationale: గ్రీకు భావాన్ని సంక్షిప్తంగా, గంభీరంగా, సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: పాత్రలోని దానిని నేరుగా ‘ద్రాక్షారసం’ అని అనువదించాలా, లేక మూలంలోని ప్రయోగాన్ని నిలుపాలా
  choice: ప్రధాన పాఠ్యంలో ‘ద్రాక్షావల్లి ఫలం’ అని ఉంచడం
  alternative: ద్రాక్షారసం
  rationale: గ్రీకులో οἶνος కాదు, ‘ద్రాక్షావల్లి ఫలం/ఉత్పత్తి’ అని ఉంది. మూల ప్రయోగాన్ని నిలపడం వల్ల పాఠ్యం చెప్పినదానికంటే ఎక్కువ సాక్రమెంటల్ లేదా ప్రతీకాత్మక నిర్దిష్టతను చేర్చకుండా ఉంటుంది.
- issue: రాబోయే రాజ్యంలో καινὸν అనే పదం యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘కొత్తగా’ అని ఉంచి, దాని నిర్దిష్ట భావాన్ని నిర్ణయించకపోవడం
  alternative: మళ్లీ; ఒక కొత్త విధంగా; కొత్తదాన్ని
  rationale: ఈ విశేషణం గుణంలో లేదా విధానంలో కొత్తదనాన్ని సూచించవచ్చు; వాక్యం ఆ సూక్ష్మభేదాన్ని పూర్తిగా తేల్చదు. అందువల్ల అస్పష్టతను పాదటిప్పణిలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గాంభీర్యాన్ని మరియు అంత్యకాల సూచనను నిలుపుతూ అనువదించబడింది. పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
