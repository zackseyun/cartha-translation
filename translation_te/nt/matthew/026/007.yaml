source:
  edition: SBLGNT
  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: te
  text: ఒక స్త్రీ అతి ఖరీదైన సుగంధ తైలం ఉన్న అలబాస్టర్ సీసా[a] పట్టుకొని ఆయన దగ్గరికి వచ్చింది. ఆయన భోజనానికి వాలుకొని ఉండగా[b], ఆమె ఆ తైలాన్ని ఆయన తల మీద పోసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతి ఖరీదైన సుగంధ లేపనం ఉన్న అలబాస్టర్ పాత్ర.” గ్రీకు పదం సువాసనగల నూనెను లేదా లేపనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఆ కాలపు ఆచారం ప్రకారం భోజనం చేయడానికి బల్ల దగ్గర వాలుకొని ఉన్నప్పుడు.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν αὐτῷ
  choice: ఆయన దగ్గరికి వచ్చింది
  rationale: వ్యక్తి వైపు కదలి రావడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γυνή
  choice: ఒక స్త్రీ
  rationale: మూలంలో ఆ స్త్రీకి ఇక్కడ ప్రత్యేక గుర్తింపు లేదు; అనిర్దిష్ట భావాన్ని నిలుపుతుంది.
- source_word: ἔχουσα
  choice: పట్టుకొని
  rationale: ఆమె ఆ పాత్రను తనతో తీసుకొని వచ్చిన భౌతిక సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀλάβαστρον μύρου
  choice: సుగంధ తైలం ఉన్న అలబాస్టర్ సీసా
  rationale: ἀλάβαστρον ఆ పదార్థంతో చేసిన లేదా ఆ పేరుతో పిలిచే చిన్న పాత్రను సూచిస్తుంది; μύρον సువాసనగల నూనె లేదా లేపనాన్ని సూచించగలదు. ప్రధాన పాఠంలో ‘సుగంధ తైలం’ ఈ సందర్భానికి స్పష్టంగా, సహజంగా ఉంది; విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: βαρυτίμου
  choice: అతి ఖరీదైన
  rationale: దాని అత్యధిక విలువను తెలిపే తీవ్రతను ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: κατέχεεν
  choice: పోసింది
  rationale: తల మీద ద్రవాన్ని పోయడాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: ఆయన తల మీద
  rationale: ἐπί ఇక్కడ ఉపరితలంపై పోయడాన్ని సూచిస్తుంది.
- source_word: ἀνακειμένου
  choice: భోజనానికి వాలుకొని ఉండగా
  rationale: ప్రాచీన భోజన పద్ధతిలో బల్ల దగ్గర పక్కకు వాలి ఉండే భంగిమను సూచిస్తుంది; కేవలం విశ్రాంతి తీసుకుంటున్నట్టు అపార్థం కాకుండా భోజన సందర్భాన్ని స్పష్టం చేస్తుంది.
