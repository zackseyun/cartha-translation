  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: te
  text: అయితే వారు, “పండుగ సమయంలో వద్దు; ప్రజల మధ్య అల్లకల్లోలం చెలరేగకుండా ఉండాలి” అని చెబుతూ ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: అని అనుకుంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న చర్చ లేదా పదేపదే వ్యక్తమైన అభిప్రాయాన్ని సూచిస్తుంది. ఈ సందర్భంలో వారు పన్నాగం గురించి పరస్పరం చర్చిస్తున్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δέ
  choice: అయితే
  rationale: మునుపటి వాక్యంలోని కుట్రకు, పండుగ సమయంలో చేయకూడదనే వారి జాగ్రత్తకు మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని చూపుతుంది.
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: పండుగ సమయంలో వద్దు
  rationale: కాలార్థకమైన ἐνను ‘సమయంలో’గా, సంక్షిప్త నిషేధార్థక Μὴను సహజమైన ‘వద్దు’గా అందిస్తుంది. ἑορτήకు ఈ పస్కా సందర్భంలో ‘పండుగ’ సాధారణ ఆధునిక తెలుగు పదం.
- source_word: ἵνα μὴ
  choice: చెలరేగవచ్చు
  rationale: 'ఇక్కడ ఉద్దేశించిన నివారణను తెలుగులో సహజంగా కారణాత్మక హెచ్చరిక రూపంలో వ్యక్తం చేస్తుంది: అల్లకల్లోలం రాకూడదనే ఉద్దేశంతో వారు అలా అంటున్నారు.'
- source_word: θόρυβος
  choice: అల్లకల్లోలం
  rationale: ప్రజల మధ్య కలిగే బహిరంగ కలత లేదా గందరగోళాన్ని సూచిస్తుంది; ‘అల్లరి’ కంటే గంభీరంగా, ‘దొమ్మీ’ లేదా ‘తిరుగుబాటు’ కంటే తక్కువ నిర్దిష్టంగా ఉండి మూలపద విస్తృతిని కాపాడుతుంది.
- source_word: γένηται
  choice: చెలరేగవచ్చు
  rationale: θόρυβος పుట్టడం లేదా సంభవించడం అనే భావాన్ని సహజమైన తెలుగు సంయుక్త క్రియగా అందిస్తుంది.
- source_word: ἐν τῷ λαῷ
  choice: ప్రజల్లో
  rationale: λαόςను సమూహంగా ఉన్న ప్రజలని సూచించే సహజమైన, సంక్షిప్త తెలుగు రూపంలో అందిస్తుంది.
