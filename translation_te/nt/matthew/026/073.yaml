id: MAT.26.73
reference: Matthew 26:73
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: te
  text: కొద్దిసేపటి తర్వాత, అక్కడ నిలబడి ఉన్నవారు పేతురు దగ్గరికి వచ్చి, “నిజంగా నువ్వు కూడా వారిలో ఒకడివే; నీ మాటతీరే నిన్ను బయటపెడుతోంది[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ మాటతీరే నువ్వెవరో స్పష్టం చేస్తోంది.” గ్రీకు పదం λαλιά మాటను, మాట్లాడే విధానాన్ని లేదా యాసను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: కొద్దిసేపటి తర్వాత
  rationale: కొద్ది కాలవ్యవధి గడిచిన తరువాత అనే సహజమైన కాలార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: —
  rationale: ఇక్కడ ఇది కథనాన్ని ముందుకు నడిపే స్వల్ప అనుసంధాన పదం; తెలుగు వాక్యక్రమంలో ప్రత్యేక పదంతో అనువదించాల్సిన అవసరం లేదు.
- source_word: προσελθόντες
  choice: దగ్గరికి వచ్చి
  rationale: పేతురు వైపు వచ్చి చేరిన కదలికను సహజంగా, మూలంలోని క్రియావిశేషణ రూప సంబంధాన్ని నిలుపుతూ తెలుపుతుంది.
- source_word: οἱ ἑστῶτες
  choice: అక్కడ నిలబడి ఉన్నవారు
  rationale: ‘నిలబడి ఉన్నవారు’ అనే మూలార్థాన్ని కాపాడుతూ సందర్భానికి అవసరమైన ‘అక్కడ’ను సహజంగా చేర్చుతుంది.
- source_word: εἶπον τῷ Πέτρῳ
  choice: పేతురు ... అన్నారు
  rationale: దత్తి విభక్తిలోని పేతురును ఉద్దేశించిన మాటను సహజ తెలుగు ప్రత్యక్ష సంభాషణ నిర్మాణంలో అందిస్తుంది.
- source_word: Ἀληθῶς
  choice: నిజంగా
  rationale: వారు నిశ్చయంగా చేస్తున్న ఆరోపణను సహజ సంభాషణ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καὶ σὺ
  choice: నువ్వు కూడా
  rationale: పేతురును ఆ గుంపులో చేర్చే ఉద్ఘాటనను స్పష్టంగా నిలుపుతుంది.
- source_word: ἐξ αὐτῶν
  choice: వారిలో ఒకడివే
  rationale: ఆ సమూహానికి చెందినవాడని సూచించే గ్రీకు నుడికారానికి సహజ తెలుగు సమానార్థకం; ‘వే’ వారి నిశ్చయాన్ని ప్రతిబింబిస్తుంది.
- source_word: καὶ γὰρ
  choice: నీ మాటతీరే
  rationale: γάρ ఇచ్చే కారణ సంబంధాన్ని తెలుగు విరామచిహ్నం మరియు వాక్యనిర్మాణం తెలియజేస్తాయి; καί యొక్క ఉద్ఘాటనను ‘మాటతీరే’లోని ‘ఏ’ నిలుపుతుంది.
- source_word: ἡ λαλιά σου
  choice: నీ మాటతీరు
  rationale: λαλιά ఇక్కడ మాట, మాట్లాడే విధానం లేదా యాసను సూచించవచ్చు. ‘మాటతీరు’ ఆ అర్థపరిధిని అనవసరంగా ‘యాస’కే పరిమితం చేయదు.
- source_word: δῆλόν σε ποιεῖ
  choice: నిన్ను బయటపెడుతోంది
  rationale: ‘నిన్ను స్పష్టంగా కనిపించేలా చేస్తోంది’ అనే భావాన్ని సహజ ఆధునిక తెలుగులో వ్యక్తం చేస్తూ ప్రత్యక్ష కర్మను నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ఆరోపణలోని నిశ్చయాన్ని ‘నిజంగా’ మరియు ‘ఒకడివే’తో నిలిపాం. λαλιάలోని ఉద్దేశపూర్వక అర్థవిస్తృతిని ప్రధాన పాఠంలో ‘మాటతీరు’తో కాపాడి, ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
