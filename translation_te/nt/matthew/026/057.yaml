source:
  edition: SBLGNT
  text: Οἱ δὲ κρατήσαντες τὸν Ἰησοῦν ἀπήγαγον πρὸς Καϊάφαν τὸν ἀρχιερέα, ὅπου οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι συνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: te
  text: యేసును పట్టుకున్నవారు ఆయనను ప్రధాన యాజకుడైన కయఫా దగ్గరకు తీసుకువెళ్లారు. అక్కడ శాస్త్రులు, పెద్దలు సమకూడి ఉన్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమకూర్చబడ్డారు.” గ్రీకు క్రియ నిష్క్రియ రూపంలో ఉంది; ఈ సందర్భంలో అది “సమకూడారు” అనే అర్థంలో కూడా వాడబడవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: పట్టుకున్నవారు
  rationale: δέ కథనాన్ని స్వల్పంగా ముందుకు నడిపే అనుసంధాన పదం; తెలుగులో ప్రత్యేక విరోధార్థక పదం చేర్చకుండా సహజమైన కథన ప్రవాహంలో దాని బలాన్ని చూపించాం. ఆర్టికల్‌తో కూడిన కృదంతాన్ని వ్యక్తులను సూచించే ‘వారు’ రూపంలో అనువదించాం.
- source_word: κρατήσαντες
  choice: పట్టుకున్నవారు
  rationale: ప్రధాన క్రియకు ముందు జరిగిన పట్టుకోవడం లేదా అదుపులోకి తీసుకోవడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; ‘అరెస్టు చేసినవారు’ అనడం గ్రీకు పదంలో తప్పనిసరిగా లేని న్యాయపరమైన భావాన్ని పెంచుతుంది.
- source_word: ἀπήγαγον
  choice: తీసుకువెళ్లారు
  rationale: అదుపులో ఉన్న వ్యక్తిని ఒకరి దగ్గరకు నడిపించి తీసుకుపోవడం అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πρὸς Καϊάφαν
  choice: కయప దగ్గరకు
  rationale: πρός + ద్వితీయా విభక్తి వ్యక్తివైపు గమనాన్ని సూచిస్తుంది. ‘కయప ఇంటికి’ అని మూలంలో లేని స్థల సమాచారాన్ని చేర్చలేదు.
- source_word: τὸν ἀρχιερέα
  choice: ప్రధాన యాజకుడైన
  rationale: కయప పదవిని స్పష్టంగా తెలిపే, తెలుగు బైబిలు వాడుకలో స్థిరమైన బిరుదు.
- source_word: ὅπου
  choice: అక్కడ
  rationale: మునుపు పేర్కొన్న గమ్యస్థలాన్ని సూచించే సహజమైన తెలుగు స్థానసూచక రూపం.
- source_word: οἱ γραμματεῖς
  choice: శాస్త్రులు
  rationale: యూదుల ధర్మశాస్త్ర సంబంధిత అధికారిక వర్గాన్ని సూచించే సాంప్రదాయికమైన, సంక్షిప్తమైన తెలుగు పదం.
- source_word: οἱ πρεσβύτεροι
  choice: పెద్దలు
  rationale: ఈ సందర్భంలోని గుర్తింపు పొందిన యూదు నాయకులను సూచించే స్థిరమైన తెలుగు ప్రయోగం.
- source_word: συνήχθησαν
  choice: సమకూడి ఉన్నారు
  rationale: యేసును అక్కడికి తీసుకువచ్చే సమయానికే వారు కూడి ఉన్నారని కథన క్రమాన్ని సహజంగా తెలియజేస్తుంది; గ్రీకు రూపంలోని నిష్క్రియార్థ సాధ్యతను పాదసూచికలో నిలిపాం.
