  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలో లేని ‘ఇంటి’ లేదా స్పష్టమైన న్యాయపరమైన ‘అరెస్టు’ భావాలను చేర్చలేదు.
