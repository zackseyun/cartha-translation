base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: te
  text: అయితే, ఈ విధంగా జరగాలి అని చెప్పే లేఖనాలు ఎలా నెరవేరగలవు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయితే, ఈ విధంగా జరగాలి అని చెప్పే లేఖనాలు ఎలా నెరవేరుతాయి?”
    reason: పరోక్షమైన సంభావ్యతా భావాన్ని తెలుగులో ప్రశ్న నిర్మాణం ద్వారానే వ్యక్తం చేసే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: πῶς
  choice: ఎలా
  rationale: అలంకారప్రశ్న యొక్క సహజమైన ప్రశ్నార్థక బలాన్ని నిలుపుతుంది.
- source_word: οὖν
  choice: అలాగైతే
  rationale: ముందటి సందర్భం నుంచి వచ్చే తార్కిక పరిణామాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: πληρωθῶσιν
  choice: నెరవేరుతాయి
  rationale: πληρόω యొక్క అఓరిస్ట్ పాసివ్ సబ్జంక్టివ్‌ను అలంకారప్రశ్నలో సందర్భానుగుణమైన సంభావ్యతతో వ్యక్తం చేస్తుంది; తెలుగులో ప్రశ్న నిర్మాణమే ఆ భావాన్ని మోస్తుంది.
- source_word: αἱ γραφαὶ
  choice: లేఖనాలు
  rationale: ఇక్కడ సాధారణ రచనలు కాక, ఇశ్రాయేలు పవిత్ర గ్రంథాలను సూచించే స్థిరమైన తెలుగు బైబిలు పదప్రయోగం.
- source_word: ὅτι
  choice: అని చెప్పే
  rationale: లేఖనాల విషయవస్తువును పరిచయం చేసే ὅτι భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా కలుపుతుంది.
- source_word: οὕτως
  choice: ఈ విధంగానే
  rationale: సంఘటనలు జరుగుతున్న తీరును సూచిస్తూ, మూలంలోని విధానార్థాన్ని మరియు సందర్భంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: δεῖ
  choice: జరగాలి
  rationale: అవసరతను సంక్షిప్తంగా తెలియజేస్తుంది; దాని వెనుకనున్న దైవిక ప్రణాళికను అనువాదంలో అదనంగా వివరించదు.
- source_word: γενέσθαι
  choice: జరగాలి
  rationale: సంఘటనలు సంభవించడాన్ని ఆధునిక సాధారణ తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; δεῖతో కలిసి ఒకే క్రియారూపంగా అనువదించబడింది.
theological_decisions:
- issue: δεῖ తెలియజేసే అవసరత స్వభావం
  choice: “జరగాలి” అని మాత్రమే అనువదించడం
  alternative: “దేవుని ప్రణాళిక ప్రకారం జరగాలి” అని వివరణను చేర్చడం
  rationale: లేఖనాల నెరవేర్పుతో కలిపి చూసినప్పుడు దైవిక అవసరత సూచితమైనా, గ్రీకు మూలం దానిని విస్తరించి వివరించదు. అందువల్ల వచనంలోని theological tensionను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన లేఖన శైలిని నిలుపుతూ అనువదించబడింది. “లేఖనాలు” అనే స్థిరమైన బైబిలు పదం వాడబడింది.
