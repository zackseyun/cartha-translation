  yaml_path: translation/nt/matthew/026/016.yaml
  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: te
  text: అప్పటి నుండి అతడు ఆయనను అప్పగించడానికి తగిన అవకాశం కోసం వెదుకుతూ ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనకు ద్రోహం చేయడానికి.’ గ్రీకు క్రియకు మరింత అక్షరార్థంగా ‘అప్పగించు’ లేదా ‘చేతికి అప్పగించు’ అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: అప్పటి నుండి
  rationale: ἀπό + τότε సూచించే ఆరంభ బిందువుతో కొనసాగుతున్న కాలభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐζήτει
  choice: వెదుకుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియారూపం సూచించే కొనసాగుతున్న ప్రయత్నాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: εὐκαιρίαν
  choice: తగిన అవకాశం
  rationale: అనుకూలమైన లేదా సరైన సందర్భం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα
  choice: అప్పగించడానికి
  rationale: ἵνα ఇక్కడ సూచించే ఉద్దేశాన్ని తెలుగు క్రియార్థక రూపం సహజంగా తెలియజేస్తుంది.
- source_word: παραδῷ
  choice: అప్పగించడానికి
  rationale: παραδίδωμι యొక్క ప్రాథమికమైన ‘చేతికి అప్పగించు’ భావాన్ని నిలుపుతూ, సందర్భం వల్ల కలిగే ‘ద్రోహం చేయు’ అనే సంకుచిత అర్థాన్ని ప్రధాన పాఠ్యంలో తప్పనిసరిగా చేర్చదు.
- source_word: αὐτὸν
  choice: ఆయనను
  rationale: సందర్భంలో యేసును సూచించే కర్మ సర్వనామాన్ని సహజమైన గౌరవార్థక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: యూదా సందర్భంలో παραδῷ అనువాదం
  choice: ఆయనను అప్పగించడానికి
  alternative: ఆయనకు ద్రోహం చేయడానికి
  rationale: యూదా చేసిన పని ద్రోహమే అయినప్పటికీ, గ్రీకు క్రియకు విస్తృతంగా ‘అప్పగించు’ అనే అర్థం ఉంది. అందువల్ల ప్రధాన పాఠ్యం ఆ మూలార్థాన్ని నిలుపుతుంది; సందర్భానుగుణ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనదైనా గౌరవప్రదమైన వాక్యనిర్మాణం. ‘వెదుకుతూ ఉన్నాడు’ ద్వారా కొనసాగుతున్న చర్యను, ‘తగిన అవకాశం’ ద్వారా అనుకూల సందర్భ భావాన్ని నిలిపింది.
