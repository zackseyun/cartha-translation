  to: ప్రధాన యాజకులూ మహాసభ అంతా[a] యేసుకు వ్యతిరేకంగా అబద్ధ సాక్ష్యం[b] కోసం వెదుకుతూ ఉన్నారు, ఆయనను చంపివేయడానికి.
