id: MAT.26.59
reference: Matthew 26:59
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: te
  text: ప్రధాన యాజకులూ మహాసభ అంతా[a] యేసుకు వ్యతిరేకంగా అబద్ధ సాక్ష్యం[b] కోసం వెదుకుతూ ఉన్నారు, ఆయనను చంపివేయడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సన్హెడ్రిన్ అంతా.’ ఇది యూదుల పాలక న్యాయసభను సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘అబద్ధ సాక్షి.’ గ్రీకు పదం న్యాయ సందర్భంలో అబద్ధ సాక్ష్యాన్ని లేదా అబద్ధ సాక్షిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్ప కథన సంధానాన్ని సూచిస్తుంది; ‘అయితే’ అని అనువదిస్తే మూలంలో ఉన్నదానికంటే బలమైన వ్యతిరేక భావం కలగవచ్చు. తెలుగు కథన ప్రవాహంలో సంధాన పదం లేకుండానే భావం సహజంగా వస్తుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఇది ఆ కాలపు ఉన్నత యాజక నాయకత్వాన్ని సూచిస్తుంది; అనేకమంది ఒకేసారి ప్రధాన యాజక పదవిలో ఉన్నారనే భావం రాకుండా, తెలుగులో ప్రాచుర్యంలో ఉన్న అర్థవంతమైన పదబంధాన్ని ఉపయోగించాం.
- source_word: συνέδριον ὅλον
  choice: మహాసభ అంతా
  rationale: యూదుల పాలక న్యాయసభను సాధారణ పాఠకులకు అర్థమయ్యేలా అనువదిస్తూ, ὅλον లోని సమగ్రతను ‘అంతా’తో నిలిపాం.
- source_word: ἐζήτουν
  choice: వెదుకుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న ప్రయత్నాన్ని సూచిస్తుంది; అందుకే ప్రగతిశీల క్రియారూపాన్ని వాడాం.
- source_word: ψευδομαρτυρίαν
  choice: అబద్ధ సాక్ష్యం
  rationale: న్యాయ సందర్భంలో అసత్యమైన వాంగ్మూలం లేదా సాక్ష్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; వ్యక్తిని సూచించే ‘అబద్ధ సాక్షి’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: యేసుకు వ్యతిరేకంగా
  rationale: κατά + షష్ఠీ విభక్తి ఇక్కడ న్యాయపరంగా యేసుకు విరోధంగా ఉన్న దిశను సూచిస్తుంది.
- source_word: ὅπως … θανατώσωσιν
  choice: ఆయనను చంపివేయాలన్నదే వారి ఉద్దేశం
  rationale: ఉద్దేశార్థక ఉపవాక్యాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తపరుస్తూ, ఆయన మరణమే వారి చర్య లక్ష్యమని చూపుతుంది; ‘మరణశిక్ష విధింపజేయడం’ వంటి మరింత నిర్దిష్ట న్యాయ ప్రక్రియను మూలానికి మించి చేర్చలేదు.
theological_decisions:
- issue: నాయకుల న్యాయపరమైన ఉద్దేశం
  choice: అబద్ధ సాక్ష్యం కోసం వారు కొనసాగిస్తూ చేసిన ప్రయత్నానికీ, యేసును చంపివేయాలనే వారి ఉద్దేశానికీ స్పష్టమైన సంబంధం చూపించాం.
  alternative: ‘యేసును చంపడానికి అబద్ధ సాక్ష్యం వెదికారు’ అని సంక్షిప్తంగా చెప్పవచ్చు.
  rationale: ἐζήτουν లోని కొనసాగుతున్న ప్రయత్నాన్నీ, ὅπως … θανατώσωσιν లోని ఉద్దేశాన్నీ నిలిపి, వారి పన్నాగాన్ని తెలియజేస్తుంది; అయితే మరణదండన అమలు విధానాన్ని లేదా అదనపు సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. ‘మహాసభ’కు సాంస్కృతిక వివరణను, ‘అబద్ధ సాక్ష్యం’లోని నిజమైన పదార్థ సందిగ్ధతను పాదసూచికల్లో నిలిపాం.
