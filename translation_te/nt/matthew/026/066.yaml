  text: τί ὑμῖν δοκεῖ; οἱ δὲ ἀποκριθέντες εἶπαν· Ἔνοχος θανάτου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/066.yaml
  text: What do you think? They answered[a], “He is deserving of death.”
translation:
  language: te
  text: '“మీ అభిప్రాయం ఏమిటి?” వారు జవాబిచ్చారు: “ఇతడు మరణశిక్షకు పాత్రుడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతడు మరణానికి దోషి” లేదా “ఇతడు మరణశిక్షకు బాధ్యుడు.” గ్రీకు పదబంధం న్యాయపరమైన తీర్పును వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: మీ అభిప్రాయం ఏమిటి?
  rationale: δοκέω + దత్తివిభక్తి ఇక్కడ అభిప్రాయం మాత్రమే కాక తీర్పును అడిగే న్యాయసందర్భపు ప్రశ్న. ‘మీ అభిప్రాయం ఏమిటి?’ అనేది సహజమైన ఆధునిక తెలుగు; సందర్భం దాని తీర్పు భావాన్ని స్పష్టం చేస్తుంది.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: వారు … అని జవాబిచ్చారు
  rationale: ἀποκριθέντες εἶπαν అనే గ్రీకు కథన ప్రయోగాన్ని తెలుగులో సహజమైన ఒక సమాపక క్రియతో అందించింది. δέ ఇక్కడ స్వల్ప అనుసంధానకమైనందున ప్రత్యేకంగా ‘అయితే’ అని బలపరచలేదు.
- source_word: Ἔνοχος
  choice: పాత్రుడు
  rationale: ἔνοχος న్యాయపరంగా దోషిగా లేదా శిక్షకు బాధ్యుడిగా ఉండడాన్ని సూచిస్తుంది. θανάτουతో కలిపి ‘మరణశిక్షకు పాత్రుడు’ అనడం సభ ప్రకటించిన న్యాయతీర్పును సహజంగా తెలియజేస్తుంది.
- source_word: θανάτου
  choice: మరణశిక్షకు
  rationale: ἔνοχος θανάτου అనే నిర్మాణం కేవలం మరణాన్ని వర్ణించకుండా, మరణదండనకు గురిచేయదగినవాడనే న్యాయబాధ్యతను సూచిస్తుంది.
- source_word: ἐστίν
  choice: ఇతడు … పాత్రుడు
  rationale: గ్రీకులో అంతర్లీనంగా ఉన్న పురుష ఏకవచన కర్తను తెలుగులో ‘ఇతడు’గా వ్యక్తం చేసి, సభ ఎదుట ఉన్న యేసును ఉద్దేశించిన ప్రత్యక్ష తీర్పును నిలిపింది.
theological_decisions:
- issue: సభ తీర్పులోని న్యాయపరమైన బలం
  choice: ఇతడు మరణశిక్షకు పాత్రుడు
  alternative: ఇతడు మరణానికి దోషి / ఇతడు మరణానికి బాధ్యుడు
  rationale: ఇది సభ యేసుపై ప్రకటించిన తీర్పు; దేవుని ఎదుట ఆయన నిజంగా దోషి అని అనువాదం నిర్ధారించకూడదు. ‘మరణశిక్షకు పాత్రుడు’ అనే రూపం వక్తల న్యాయతీర్పును స్పష్టంగా ఉంచుతూ, ప్రాయశ్చిత్తం లేదా అంతిమ దైవతీర్పు గురించి అదనపు సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయసందర్భ భాషను వాడింది. ‘మరణశిక్షకు పాత్రుడు’ సాధారణ పాఠకునికి స్పష్టంగా ఉండి మూలంలోని సంక్షిప్త తీర్పు ధోరణిని కాపాడుతుంది.
