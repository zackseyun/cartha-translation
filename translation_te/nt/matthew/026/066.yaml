  naturalness: The revised wording is natural modern standard Telugu. ‘వారు జవాబిచ్చారు’ is concise and idiomatic narrative Telugu, and the colon cleanly introduces their quoted verdict.
  terminology: '‘మరణశిక్షకు పాత్రుడు’ suitably retains the legal force without asserting an ultimate divine judgment. The footnote alternatives are adjusted to use natural Telugu legal phrasing: ‘మరణశిక్షకు బాధ్యుడు’ rather than the potentially ambiguous ‘మరణానికి బాధ్యుడు.’'
