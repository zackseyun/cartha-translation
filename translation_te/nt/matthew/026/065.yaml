id: MAT.26.65
reference: Matthew 26:65
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: te
  text: అప్పుడు ప్రధాన యాజకుడు తన వస్త్రాలు చింపుకొని[a], “ఇతడు దేవదూషణ చేశాడు! ఇక మనకు సాక్షులు ఎందుకు అవసరం? ఇదిగో, ఇప్పుడు మీరు ఆ దేవదూషణ విన్నారు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: వస్త్రాలు చింపుకోవడం దిగ్భ్రాంతి, దుఃఖం లేదా తీవ్ర ఆగ్రహాన్ని బహిరంగంగా చూపించే చర్య.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథన క్రమంలో తదుపరి సంఘటనను సహజంగా పరిచయం చేసే కాలసూచకం.
- source_word: ὁ ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: యూదుల ఏకవచన మహాయాజక పదవిని తెలిపే ప్రామాణిక ఆధునిక తెలుగు పదబంధం.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: తన వస్త్రాలు చింపుకొని
  rationale: క్రియ యొక్క బలాన్ని, వస్త్రాల సాధారణ అర్థాన్ని నిలుపుతూ, వెంటనే పలికిన మాటతో చర్యను సహజంగా కలుపుతుంది.
- source_word: Ἐβλασφήμησεν
  choice: ఇతడు దేవదూషణ చేశాడు
  rationale: ఆరోపణ యొక్క మతపరమైన, న్యాయపరమైన తీవ్రతను నిలుపుతుంది; ఇది ప్రధాన యాజకుని తీర్పని సందర్భం స్పష్టం చేస్తుంది.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: ఇక మనకు సాక్షులతో ఏమి అవసరం?
  rationale: χρείαν ἔχειν నిర్మాణాన్ని దగ్గరగా అనుసరించి, ἔτι యొక్క ‘ఇక/ఇంకా’ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἴδε νῦν
  choice: ఇదిగో, ఇప్పుడు
  rationale: శ్రోతల దృష్టిని ఆకర్షించే ఆజ్ఞార్థక ఉద్ఘాటనను, తక్షణ కాలసూచనను రెండింటినీ నిలుపుతుంది.
- source_word: ἠκούσατε τὴν βλασφημίαν
  choice: మీరే ఆ దేవదూషణ విన్నారు
  rationale: ప్రత్యక్షంగా విన్న వారినే సాక్ష్యాధారంగా చూపే వాక్యబలాన్ని ‘మీరే’ ద్వారా సహజంగా వెల్లడిస్తూ, నిర్దిష్ట ఆరోపణను ‘ఆ దేవదూషణ’గా ఉంచుతుంది.
theological_decisions:
- issue: βλασφημέω / βλασφημία ఆరోపణను ఎలా అనువదించాలి
  choice: దేవదూషణ చేశాడు / ఆ దేవదూషణ
  alternative: దేవుని అవమానించాడు / దూషణ మాట పలికాడు
  rationale: మూలంలోని మతపరమైన-న్యాయపరమైన పదాన్ని నిలుపుతుంది. ఇది ప్రధాన యాజకుడు చేసిన ఆరోపణగానే అందించబడుతుంది; కథకుడు దానిని సమర్థిస్తున్నట్లు అనవసరంగా సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. న్యాయసభలాంటి సందర్భంలోని తీవ్రతను నిలుపుతూ, సామాన్య పాఠకులకు అర్థమయ్యే పదాలను ఉపయోగించాం. అందించిన ఇంగ్లీషు పాదసూచికల్లో గుర్తులు-విషయాలు పరస్పరం మారినట్లు కనిపించినందున, మూల వాక్యానికి నిజంగా సంబంధించిన సాంస్కృతిక వివరణను వస్త్రాలు చింపుకోవడం వద్ద [a]గా ఉంచాం.
