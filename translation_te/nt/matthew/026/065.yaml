    reason: cultural_note
  revision_rationale: The revision corrects the Telugu case construction for ‘need of witnesses’ and removes an unwarranted emphasis from the plural addressee. It otherwise preserves the draft’s source-faithful terminology, narrative register, and cultural-note anchor.
