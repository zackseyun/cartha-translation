revisions:
- from: అప్పుడు ప్రధాన యాజకుడు తన వస్త్రాలు చింపుకొని[a], “ఇతడు దేవదూషణ చేశాడు! ఇక మనకు సాక్షులతో ఏమి అవసరం? ఇదిగో, ఇప్పుడు మీరే ఆ దేవదూషణ విన్నారు” అన్నాడు.
  to: అప్పుడు ప్రధాన యాజకుడు తన వస్త్రాలు చింపుకొని[a], “ఇతడు దేవదూషణ చేశాడు! ఇక మనకు సాక్షులు ఎందుకు అవసరం? ఇదిగో, ఇప్పుడు మీరు ఆ దేవదూషణ విన్నారు” అన్నాడు.
