  edition: SBLGNT
  text: μετὰ δὲ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/032.yaml
  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: te
  text: అయితే నేను లేపబడిన తరువాత[a], మీకంటే ముందుగా గలిలయకు వెళ్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “నేను లేచిన తరువాత.” గ్రీకులో మరింత అక్షరార్థంగా కర్మణి రూపం ఉంది: “నేను లేపబడిన తరువాత.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: అయితే … తరువాత
  rationale: μετάతో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ కాలక్రమంలో ‘తరువాత’ అనే భావాన్ని ఇస్తుంది; δέ ముందటి వాక్యంతో ఉన్న స్వల్ప వ్యత్యాసాన్ని ‘అయితే’ ద్వారా సహజంగా నిలుపుతుంది.
- source_word: τὸ ἐγερθῆναί με
  choice: నేను లేపబడిన తరువాత
  rationale: ἐγείρω యొక్క ఏరిస్ట్ పాసివ్ ఇన్ఫినిటివ్ రూపాన్ని కర్తరి ప్రయోగంగా మార్చకుండా, తెలుగులోని కర్మణి రూపంతో నిలిపాం. ఇది కార్యసాధకుని పేరును వచనంలో చేర్చదు.
- source_word: προάξω ὑμᾶς
  choice: మీకంటే ముందుగా … వెళ్తాను
  rationale: ఇక్కడ προάγω అంటే వారి కంటే ముందుగా వెళ్లడం. ‘ముందుండి నడిపిస్తాను’ అని అనువదిస్తే మూలంలో నిర్బంధంగా లేని నాయకత్వ భావం అధికంగా చేరవచ్చు.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: గలిలయకు
  rationale: εἰς గమ్యస్థానం వైపు కదలికను సూచిస్తుంది; ఆధునిక తెలుగులో ప్రాంతానికి వెళ్లడాన్ని ‘గలిలయకు’ అని చెప్పడం సహజం.
theological_decisions:
- issue: ἐγερθῆναίలో పునరుత్థాన సంబంధమైన కర్మణి ప్రయోగం
  choice: ‘నేను లేపబడిన తరువాత’ అని కర్మణి భావాన్ని నిలిపాం.
  alternative: ‘నేను లేచిన తరువాత’
  rationale: గ్రీకు మూలం స్పష్టంగా కర్మణి రూపాన్ని వాడుతుంది. దానిని నిలపడం ద్వారా కార్యసాధకుని గురించి మూలంలో ప్రత్యక్షంగా చెప్పనిదాన్ని చేర్చకుండా, ఆ రూపంలోని ధార్మిక భావసూచనను కూడా చెరపకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘లేపబడిన’ అనే కర్మణి రూపం సాధారణ మాటకన్నా కొద్దిగా సాహిత్య ధోరణిలో ఉన్నప్పటికీ, మూలంలోని ఉద్దేశపూర్వక వ్యాకరణ రూపాన్ని స్పష్టంగా నిలుపుతుంది.
