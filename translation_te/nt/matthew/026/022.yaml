revisions:
- from: వారు ఎంతో దుఃఖపడి, ఒక్కొక్కరుగా[a] ఆయనతో, “ప్రభువా, నేను కాను కదా?[b]” అని చెప్పడం మొదలుపెట్టారు.
  to: వారు ఎంతో దుఃఖిస్తూ, ఒక్కొక్కరుగా ఆయనతో, “ప్రభువా, నేను కాను కదా?” అని చెప్పడం మొదలుపెట్టారు.
  rationale: వర్తమాన కృదంతమైన λυπούμενοι యొక్క కొనసాగుతున్న భావస్థితిని “ఎంతో దుఃఖిస్తూ” ద్వారా మరింత సమీపంగా ప్రతిబింబించాం. వాక్యంలోని ఇతర పదాలు, ప్రశ్న యొక్క ప్రతికూల నిరీక్షణ, మరియు “ప్రభువా” అనే సంబోధన యథాతథంగా నిలిపాం.
