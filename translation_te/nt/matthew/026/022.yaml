id: MAT.26.22
reference: Matthew 26:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λυπούμενοι σφόδρα ἤρξαντο λέγειν αὐτῷ ⸂εἷς ἕκαστος⸃· Μήτι ἐγώ εἰμι, κύριε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: te
  text: వారు ఎంతో దుఃఖిస్తూ, ఒక్కొక్కరుగా ఆయనతో, “ప్రభువా, నేను కాను కదా?” అని చెప్పడం మొదలుపెట్టారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: ఎంతో దుఃఖపడి
  rationale: వర్తమాన కృదంతం తెలిపే భావస్థితిని, σφόδρα ఇచ్చే తీవ్రతతో కలిపి సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἤρξαντο λέγειν
  choice: చెప్పడం మొదలుపెట్టారు
  rationale: క్రియ ప్రారంభాన్ని స్పష్టంగా నిలుపుతూ గ్రీకు నిర్మాణానికి దగ్గరగా, తెలుగులో సహజంగా ఉంది.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: యేసుతో నేరుగా మాట్లాడుతున్న సందర్భంలోని పరోక్ష కర్మ భావాన్ని సహజమైన తెలుగు ప్రయోగంలో తెలియజేస్తుంది.
- source_word: εἷς ἕκαστος
  choice: ఒక్కొక్కరుగా
  rationale: ప్రతి శిష్యుడూ వ్యక్తిగతంగా స్పందించాడనే విభజనాత్మక బలాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: Μήτι ἐγώ εἰμι
  choice: నేను కాను కదా?
  rationale: μήτι ప్రతికూల సమాధానాన్ని ఆశించే ప్రశ్నను సూచిస్తుంది; తెలుగు ‘కాను కదా?’ ఆ నిరీక్షణను సహజంగా నిలుపుతుంది.
- source_word: κύριε
  choice: ప్రభువా
  rationale: యేసును సంబోధించే κύριε యొక్క బిరుదు సంబంధమైన, కథనపరమైన బరువును నిలుపుతుంది.
theological_decisions:
- issue: యేసును సంబోధించేటప్పుడు κύριε అనువాదం
  choice: ప్రభువా
  alternative: అయ్యా / గురువా
  rationale: ఈ సందర్భంలో కేవలం మర్యాదపూర్వక సంబోధనగా పరిమితం చేయకుండా, మత్తయి కథనంలో ఈ బిరుదుకు ఉన్న విస్తృత భావబరువును ‘ప్రభువా’ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. ప్రశ్నలోని ఆందోళనతో కూడిన ప్రతికూల నిరీక్షణను ‘కాను కదా?’ ద్వారా కాపాడింది.
