id: MAT.26.61
reference: Matthew 26:61
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: te
  text: వారు, “ఈ మనిషి, ‘నేను దేవుని ఆలయాన్ని[b] పడగొట్టి, మూడు రోజుల్లో[a] దాన్ని కట్టగలను’ అని చెప్పాడు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మూడు రోజుల వ్యవధిలో.” గ్రీకు పదబంధం ఆ కాలపరిమితిలో పని పూర్తికావడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఆలయం గురించి యేసు చెప్పిన మాట ఆయన శరీరాన్ని సూచించిందని యోహాను 2:19–21 వివరిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: అన్నారు
  rationale: అయోరిస్టు క్రియను కథనంలోని సాధారణ గత సంఘటనగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Οὗτος
  choice: ఈ మనిషి
  rationale: విచారణలో నింద మోపే సాక్షుల సూచనాత్మక, కొంత తృణీకారభరితమైన ధోరణిని ‘ఇతడు’ కంటే సాధారణ ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ἔφη
  choice: చెప్పాడు
  rationale: ఇది ఆరోపించబడిన మాటను సాధారణంగా నివేదిస్తుంది; ‘ప్రకటించాడు’ లేదా ‘వాదించాడు’ అని బలాన్ని పెంచదు.
- source_word: Δύναμαι
  choice: కట్టగలను
  rationale: తెలుగు సంయుక్త క్రియా నిర్మాణంలో ‘పడగొట్టి ... కట్టగలను’ అని చెప్పడం ద్వారా సామర్థ్య భావం రెండు క్రియల సముదాయానికీ సహజంగా వర్తిస్తుంది.
- source_word: καταλῦσαι
  choice: పడగొట్టి
  rationale: కట్టడం లేదా ఆలయం సందర్భంలో నిర్మాణాన్ని కూల్చడం/నాశనం చేయడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ναὸν
  choice: ఆలయాన్ని
  rationale: ναός ఇక్కడ దేవుని ఆలయాన్ని సూచిస్తుంది; ‘పరిశుద్ధ స్థలం’ అనే సాంకేతికంగా సంకుచితమైన పదం కంటే ‘ఆలయం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: గ్రీకు షష్ఠీ విభక్తిలోని సంబంధాన్ని సంక్షిప్తమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: διὰ τριῶν ἡμερῶν
  choice: మూడు రోజుల్లో
  rationale: ఆ కాలవ్యవధిలో నిర్మాణం పూర్తిచేయడం అనే భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; గ్రీకు కాలప్రయోగంలోని సూక్ష్మతను పాదసూచిక వివరిస్తుంది.
- source_word: οἰκοδομῆσαι
  choice: దాన్ని కట్టగలను
  rationale: గ్రీకులో ముందున్న ‘ఆలయం’ కర్మగా కొనసాగుతుంది; తెలుగులో స్పష్టత కోసం ‘దాన్ని’ చేర్చబడింది. ‘తిరిగి కట్టగలను’ అనేది సందర్భానుకూలమైనా మూలంలో లేని భావాన్ని మరింత స్పష్టంగా జోడిస్తుంది.
theological_decisions:
- issue: ఆరోపణలోని ‘దేవుని ఆలయం’ దేనిని సూచిస్తుంది?
  choice: సాక్షుల ఆరోపణను పైకి కనిపించే అర్థంలో భౌతిక ఆలయాన్ని సూచించేదిగా అనువదించడం
  alternative: యోహాను 2:21 ప్రకారం యేసు శరీరాన్ని నేరుగా ప్రధాన పాఠ్యంలో సూచించేలా అనువదించడం
  rationale: మత్తయి 26:61లో సాక్షులు యేసు చెప్పాడని ఆరోపిస్తున్న మాట నివేదించబడుతోంది. యోహాను ఇచ్చే క్రీస్తుసంబంధ వివరణను ప్రధాన అనువాదంలో కలపకుండా, పాదసూచికలో పరస్పర సూచనగా ఇవ్వడం మూలంలోని న్యాయవిచారణ సందర్భాన్నీ వేదాంతపరమైన ఉద్రిక్తతనూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన న్యాయవిచారణ-కథన శైలి వాడబడింది. ‘ఈ మనిషి’ ఆరోపణలోని సూచనాత్మక ధోరణిని నిలుపుతుంది. పాదసూచిక గుర్తులు అవి వివరిస్తున్న ‘ఆలయం’ మరియు ‘మూడు రోజుల్లో’ అనే పదబంధాల దగ్గర ఉంచబడ్డాయి.
