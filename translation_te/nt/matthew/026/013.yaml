  terminology: ‘సువార్త,’ ‘ప్రకటించబడుతుంది,’ and ‘జ్ఞాపకార్థంగా’ fit a modern standard Telugu biblical register without imposing doctrinal interpretation. ‘జ్ఞాపకార్థంగా’ preserves the memorial/remembrance sense of εἰς μνημόσυνον αὐτῆς.
