  source_fidelity: The translation accurately represents the solemn affirmation (ἀμὴν λέγω ὑμῖν), the indefinite universal location (ὅπου ἐὰν), proclamation of ‘this gospel’ throughout the world, and the future passive statement that the woman’s deed will be spoken of as a memorial to her. ‘సువార్త’ is an appropriate established Telugu equivalent for εὐαγγέλιον.
