id: MAT.26.13
reference: Matthew 26:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: te
  text: 'నిజంగా నేను మీతో చెబుతున్నాను: లోకమంతటా ఈ సువార్త ఎక్కడ ప్రకటించబడుతుందో, అక్కడ ఈమె చేసినది కూడా ఆమె జ్ఞాపకార్థంగా[a] చెప్పబడుతుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెకు స్మారకంగా చెప్పబడుతుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: నిజంగా
  rationale: యేసు మాటకు గంభీరమైన నిశ్చయాన్ని ఇచ్చే ఆరంభ పదం; ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే రూపం.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, వర్తమాన వాక్యరూపాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ὅπου ἐὰν
  choice: ఎక్కడ ... అక్కడ
  rationale: గ్రీకు అనిర్దిష్ట స్థానార్థాన్ని తెలుగులో సహజమైన సహసంబంధ నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: κηρυχθῇ
  choice: ప్రకటించబడుతుందో
  rationale: నిష్క్రియ రూపాన్ని, బహిరంగంగా చాటే భావాన్ని నిలుపుతుంది.
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: ఈ సువార్త
  rationale: εὐαγγέλιονకు తెలుగులో స్థిరపడిన, అర్థవంతమైన సమానార్థకం; సందర్భంలోని నిర్దేశక పదాన్ని కూడా నిలుపుతుంది.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: లోకమంతటా
  rationale: సార్వత్రిక విస్తృతిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: λαληθήσεται
  choice: చెప్పబడుతుంది
  rationale: భవిష్యత్ నిష్క్రియ భావాన్ని నిలుపుతూ, ఆ కార్యం గురించి చెప్పబడుతుందనే భావాన్ని సందర్భం ద్వారా సహజంగా తెలియజేస్తుంది.
- source_word: ὃ ἐποίησεν αὕτη
  choice: ఈమె చేసినది
  rationale: సందర్భంలో ముందుగా ప్రస్తావించిన స్త్రీని αὕτη సూచిస్తుంది; ‘ఈమె’ ఆ సూచనను అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: ఆమె జ్ఞాపకార్థంగా
  rationale: ఆమెను స్మరించే ఉద్దేశం లేదా ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: εὐαγγέλιον అనువాదం
  choice: సువార్త
  alternative: శుభవార్త
  rationale: ‘సువార్త’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో స్థిరమైన పదమైనప్పటికీ దాని మూలార్థమైన మంచి వార్తను కూడా మోస్తుంది; ప్రత్యేక సిద్ధాంతార్థాన్ని అదనంగా చేర్చదు.
- issue: εἰς μνημόσυνον αὐτῆς యొక్క సంబంధం
  choice: ఆమె జ్ఞాపకార్థంగా చెప్పబడుతుంది
  alternative: ఆమెకు స్మారకంగా చెప్పబడుతుంది
  rationale: ఈ పదబంధం చెప్పబడే కార్యంతో అనుసంధానమై స్మరణాత్మక భావాన్ని ఇస్తుంది. ‘జ్ఞాపకార్థంగా’ ఉద్దేశం/ఫలితం మధ్య ఉన్న స్వల్ప విస్తృతిని అనవసరంగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని నిష్క్రియ రూపాలు, సార్వత్రిక విస్తృతి, స్త్రీ కార్యాన్ని స్మరించే భావం నిలుపబడ్డాయి.
