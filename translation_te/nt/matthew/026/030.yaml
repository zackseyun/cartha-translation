  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: te
  text: వారు స్తుతిగీతం పాడిన తరువాత[a], ఒలీవల కొండకు బయలుదేరి వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్తుతి పాడిన తరువాత.’ గ్రీకు క్రియ సాధారణంగా స్తుతి పాడడాన్ని సూచించవచ్చు; భోజన సందర్భంలో ‘స్తుతిగీతం పాడడం’ కూడా తగిన భావమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσαντες
  choice: స్తుతిగీతం పాడిన తరువాత
  rationale: ὑμνέω క్రియారూపం దేవుని స్తుతిస్తూ పాడడాన్ని సూచిస్తుంది; aorist participle ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను తెలియజేస్తుంది. ‘స్తుతిగీతం’ సహజమైన ఆధునిక తెలుగు; అయితే సాధారణంగా ‘స్తుతి పాడడం’ అనే భావమూ సాధ్యమే కాబట్టి పాదటిప్పణిలో ఉంచబడింది.
- source_word: ἐξῆλθον
  choice: వెళ్లారు
  rationale: సందర్భంలో భోజనం జరిగిన స్థలం నుంచి బయలుదేరి గమ్యస్థానానికి వెళ్లడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘బయటికి వెళ్లారు’ అని యాంత్రికంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ఒలీవల కొండకు
  rationale: ఇది స్థిరమైన భౌగోళిక నామం. εἰς గమ్యాన్ని సూచిస్తుంది; Ὄρος τῶν Ἐλαιῶν అక్షరార్థంగా ఒలీవ చెట్ల కొండ.
- source_word: καὶ
  choice: వారు
  rationale: గ్రీకు καὶ ముందరి కథనంతో సాధారణ అనుసంధానం చేస్తుంది. తెలుగులో వాక్యారంభ ‘మరియు’ కృత్రిమంగా వినిపించే కారణంగా, సహజ కథన ప్రవాహంలో అనుసంధానం అంతర్గతంగా వ్యక్తమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు కథన శైలిని నిలుపుకుంది. ‘ఒలీవల కొండ’ను స్థిరమైన ప్రదేశనామంగా వాడింది.
