id: MAT.26.26
reference: Matthew 26:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐσθιόντων δὲ αὐτῶν λαβὼν ὁ Ἰησοῦς ⸀ἄρτον καὶ ⸀εὐλογήσας ἔκλασεν καὶ ⸂δοὺς τοῖς μαθηταῖς⸃ εἶπεν· Λάβετε φάγετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: te
  text: వారు భోజనం చేస్తుండగా[a], యేసు రొట్టె తీసుకుని, ఆశీర్వాదం పలికి[b], దాన్ని విరిచి శిష్యులకు ఇచ్చి, “తీసుకోండి, తినండి[c]; ఇది నా శరీరం[d]” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు తింటుండగా.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆశీర్వదించి’; కొందరు దీన్ని రొట్టె విషయమై దేవునికి కృతజ్ఞతలు చెల్లించడంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: c
    text: 'గ్రీకులో సంధాయక పదం లేకుండా రెండు ఆజ్ఞలు వరుసగా ఉన్నాయి: ‘తీసుకోండి, తినండి.’ దీన్ని ‘తీసుకుని తినండి’ అని కూడా సహజంగా చెప్పవచ్చు.'
    reason: lexical_alternative
  - marker: d
    text: గ్రీకు అక్షరార్థంగా, ‘ఇది నా శరీరం’ అని ఉంది. కొందరు దీన్ని ‘ఇది నా శరీరాన్ని సూచిస్తుంది’ అని అర్థం చేసుకుంటారు; అయితే అనువాదం మూలంలోని మాటలనే నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: వారు భోజనం చేస్తుండగా
  rationale: ఈ genitive absolute భోజనం కొనసాగుతున్న సమయంలో జరిగిన కార్యాన్ని సూచిస్తుంది. δέ ఇక్కడ బలమైన వ్యతిరేక భావం ఇవ్వదు; సహజమైన తెలుగు కాలసంబంధ వాక్య నిర్మాణంలో దాని స్వల్ప అనుసంధాన భావం ఇమిడిపోతుంది.
- source_word: λαβὼν
  choice: తీసుకుని
  rationale: ప్రధాన క్రియకు ముందున్న aorist participle‌ను తెలుగులో సహజమైన వరుస చర్యగా చూపిస్తుంది.
- source_word: ἄρτον
  choice: రొట్టె
  rationale: భోజన సందర్భంలో ἄρτος‌కు సాధారణమైన, స్పష్టమైన తెలుగు సమానం. ‘ఒక రొట్టె’ అని సంఖ్యను అనవసరంగా ముందుకు తేవదు.
- source_word: εὐλογήσας
  choice: ఆశీర్వాదం పలికి
  rationale: మూలంలోని ‘ఆశీర్వదించుట’ అనే భావాన్ని నిలుపుతూ, దాన్ని εὐχαριστέω అనే ‘కృతజ్ఞతలు చెల్లించుట’తో పూర్తిగా సమానం చేయదు. గ్రీకులో ప్రత్యక్ష కర్మ లేకపోవడంతో తెలుగు వాక్యంలోనూ దాన్ని బలవంతంగా చేర్చలేదు.
- source_word: ἔκλασεν
  choice: దాన్ని విరిచి
  rationale: ‘విరిచాడు’ అనే మూల అర్థాన్ని నిలుపుతుంది; తెలుగులో సహజత్వం కోసం ముందు చెప్పిన రొట్టెను సూచించే ‘దాన్ని’ చేర్చబడింది.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: శిష్యులకు ఇచ్చి
  rationale: Participle‌ను వరుస చర్యగా సహజ తెలుగులో అందిస్తుంది. మూలంలో లేని ‘తన’ అనే పదాన్ని చేర్చలేదు.
- source_word: Λάβετε φάγετε
  choice: తీసుకోండి, తినండి
  rationale: సంధాయక పదం లేకుండా వరుసగా ఉన్న రెండు aorist imperatives‌ను రెండు ప్రత్యక్ష ఆజ్ఞలుగా నిలుపుతుంది.
- source_word: τοῦτό ἐστιν
  choice: ఇది
  rationale: తెలుగు నామవాచక విధేయ వాక్యంలో వర్తమాన ‘ఉంది/అయి ఉంది’ అనే copula సాధారణంగా లోపిస్తుంది. ‘ఇది నా శరీరం’ అనేది ἐστιν యొక్క నేరమైన సహజ తెలుగు వ్యక్తీకరణ; ‘సూచిస్తుంది’ లేదా ‘అర్థం’ అనే వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: τὸ σῶμά μου
  choice: నా శరీరం
  rationale: σῶμα మరియు మొదటి పురుష స్వామ్యాన్ని నేరుగా, సాధారణ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ప్రభుభోజన సందర్భంలో యేసు పలికిన τοῦτό ἐστιν τὸ σῶμά μου మాటల భావం
  choice: ‘ఇది నా శరీరం’ అని మూలంలోని సరళ copular వాక్యాన్ని యథాతథ భావంతో ఉంచడం.
  alternative: ‘ఇది నా శరీరాన్ని సూచిస్తుంది’ లేదా ‘దీని అర్థం నా శరీరం.’
  rationale: ἐστιν సాధారణంగా ‘అయి ఉంది/is’ అనే అర్థం ఇస్తుంది. ‘సూచిస్తుంది’ అని అనువదిస్తే ఒక నిర్దిష్ట ప్రభుభోజన సిద్ధాంతాన్ని పాఠ్యంలోనే నిర్ణయించినట్లవుతుంది. అందువల్ల మూలంలోని నిజమైన వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. యేసు అనేకమంది శిష్యులతో మాట్లాడుతున్నందున బహువచన గౌరవ/సమూహ ఆజ్ఞారూపాలు ‘తీసుకోండి, తినండి’ వాడబడ్డాయి. సంప్రదాయపరమైన ప్రత్యేక వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
