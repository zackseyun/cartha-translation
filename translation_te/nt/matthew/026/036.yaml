review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the setting, accompaniment, place-name formula, and the contrast between ‘here’ and ‘there.’ However, ‘ప్రార్థించి వచ్చేంతవరకు’ adds Jesus’ return (‘coming back’), which is not expressed in the Greek. The source says only that he will go there and pray, governed by ‘until.’
  naturalness: The narrative past tense and respectful plural imperative are natural in modern standard Telugu. ‘నేను అక్కడికి వెళ్లి ప్రార్థించేంతవరకు’ is both idiomatic and closer to the Greek than the draft’s return-implying phrasing.
  terminology: ‘గెత్సేమనే’ and ‘చోటు’ are appropriate. Rendering χωρίον as ‘చోటు’ properly avoids importing ‘garden’ from another Gospel account.
  issues:
  - severity: medium
    issue: ‘ప్రార్థించి వచ్చేంతవరకు’ adds a return action.
    rationale: ἀπελθὼν ... προσεύξωμαι means ‘having gone away/go there ... pray’; it does not state that Jesus will return. The added ‘వచ్చి/వచ్చే’ changes the explicit content and should be removed.
  revised_text: అప్పుడు యేసు వారితో కలిసి గెత్సేమనే అనే చోటికి వచ్చాడు. ఆయన శిష్యులతో, “నేను అక్కడికి వెళ్లి ప్రార్థించేంతవరకు మీరు ఇక్కడ కూర్చోండి” అని చెప్పాడు.
  revised_footnotes: []
  revision_rationale: The revision removes the unstated return while retaining the Greek temporal boundary (‘until’), the movement contrast of ‘here’ and ‘there,’ and natural modern Telugu narrative style. No footnote is needed because the Telugu wording directly represents the source’s temporal construction without introducing a disputed interpretation.
