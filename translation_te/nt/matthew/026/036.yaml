id: MAT.26.36
reference: Matthew 26:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: te
  text: అప్పుడు యేసు వారితో కలిసి గెత్సేమనే అనే చోటికి వచ్చాడు. ఆయన శిష్యులతో, “నేను అక్కడికి వెళ్లి ప్రార్థించేంతవరకు మీరు ఇక్కడ కూర్చోండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: తరువాత జరిగిన సంఘటనను సహజమైన కథన క్రమంలో పరిచయం చేసే కాలసూచక పదం.
- source_word: ἔρχεται
  choice: వచ్చి
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన భూతకాల కథన నిర్మాణంలో అందించింది.
- source_word: μετ’ αὐτῶν
  choice: వారితో కలిసి
  rationale: μετά యొక్క సహవాస భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: χωρίον
  choice: చోటు
  rationale: ఇది స్థలం లేదా భూభాగాన్ని సూచించే విస్తృత పదం; మత్తయి చెప్పని ‘తోట’ అనే వివరాన్ని చేర్చదు.
- source_word: λεγόμενον
  choice: అనే
  rationale: స్థల నామాన్ని పరిచయం చేయడానికి ఆధునిక తెలుగులో సహజమైన రూపం.
- source_word: Γεθσημανί
  choice: గెత్సేమనే
  rationale: గ్రీకు స్థలనామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: λέγει
  choice: చెప్పాడు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు కథన భూతకాలంతో అనువదించింది.
- source_word: Καθίσατε
  choice: కూర్చోండి
  rationale: సరళమైన ఆజ్ఞను గౌరవబహువచనంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτοῦ
  choice: ఇక్కడ
  rationale: శిష్యులు ఉన్న ప్రదేశాన్ని సూచించే సహజమైన స్థానవాచకం.
- source_word: ἕως οὗ
  choice: వచ్చేంతవరకు
  rationale: ‘అంతవరకు’ అనే కాలపరిమితి భావాన్ని నిలుపుతూ, యేసు వెళ్లి ప్రార్థించిన తరువాత తిరిగి వస్తాడనే సందర్భానుగుణ తెలుగు వాక్యనిర్మాణాన్ని ఇస్తుంది.
- source_word: ἀπελθὼν
  choice: వెళ్లి
  rationale: ప్రార్థనకు ముందు జరిగే వెళ్లడాన్ని సహజమైన క్రమబోధక క్రియతో వ్యక్తం చేస్తుంది.
- source_word: ἐκεῖ
  choice: అక్కడికి
  rationale: ‘ఇక్కడ’తో వ్యత్యాసంగా యేసు వెళ్లబోయే వేరొక ప్రదేశాన్ని సూచిస్తుంది.
- source_word: προσεύξωμαι
  choice: ప్రార్థించి
  rationale: దేవునికి ప్రార్థించే చర్యను సాధారణ, గౌరవప్రదమైన తెలుగు పదంతో అందిస్తుంది.
theological_decisions:
- issue: గెత్సేమనే స్వరూపం
  choice: χωρίον అనే పదాన్ని ‘చోటు’గా అనువదించడం
  alternative: ‘తోట’
  rationale: మత్తయి వచనం దానిని ఒక స్థలంగా మాత్రమే పేర్కొంటుంది; ‘తోట’ అనడం యోహాను 18:1లోని వివరాన్ని ఇక్కడికి దిగుమతి చేస్తుంది.
- issue: యేసు మాటలోని కాలసంబంధం
  choice: ‘వచ్చేంతవరకు’ అనే సహజ తెలుగు నిర్మాణం
  alternative: ‘నేను వెళ్లి అక్కడ ప్రార్థించేంతవరకు’
  rationale: ἕως οὗ యొక్క ‘అంతవరకు’ భావాన్ని నిలుపుతూ తెలుగు వాక్యాన్ని సహజంగా చేస్తుంది; అయితే ‘వచ్చి’ అనే భావం గ్రీకు మూలంలో ప్రత్యక్షంగా లేక సందర్భం ద్వారా గ్రహించబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన భూతకాల కథనశైలి, గౌరవప్రదమైన సంభాషణ. ‘తోట’ వంటి ఇతర సువార్తల వివరాలను చేర్చలేదు.
