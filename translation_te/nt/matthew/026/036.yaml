revisions:
- from: అప్పుడు యేసు వారితో కలిసి గెత్సేమనే అనే చోటికి వచ్చి, శిష్యులతో, “నేను అక్కడికి వెళ్లి ప్రార్థించి వచ్చేంతవరకు మీరు ఇక్కడ కూర్చోండి” అని చెప్పాడు.
  to: అప్పుడు యేసు వారితో కలిసి గెత్సేమనే అనే చోటికి వచ్చాడు. ఆయన శిష్యులతో, “నేను అక్కడికి వెళ్లి ప్రార్థించేంతవరకు మీరు ఇక్కడ కూర్చోండి” అని చెప్పాడు.
  rationale: The revision removes the unstated return while retaining the Greek temporal boundary (‘until’), the movement contrast of ‘here’ and ‘there,’ and natural modern Telugu narrative style. No footnote is needed because the Telugu wording directly represents the source’s temporal construction without introducing a disputed interpretation.
  reviewer_model: gpt-5.6-terra
