id: MAT.26.56
reference: Matthew 26:56
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: te
  text: కానీ ఇదంతా ప్రవక్తల లేఖనాలు నెరవేరేలా జరిగింది. అప్పుడు శిష్యులందరూ ఆయనను విడిచిపెట్టి[a] పారిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను వదిలేసి’; ἀφέντες అనే పదం ఈ సందర్భంలో పరిత్యజించడం అనే మరింత బలమైన భావాన్ని ఇవ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: కానీ ఇదంతా
  rationale: τοῦτο ὅλον ముందున్న సంఘటనలన్నిటినీ సూచిస్తుంది; δέ లోని స్వల్ప వ్యతిరేక లేదా అనుసంధాన భావాన్ని ‘కానీ’ సహజంగా నిలుపుతుంది.
- source_word: γέγονεν
  choice: జరిగింది
  rationale: γίνομαι పరిపూర్ణ కాలరూపం పూర్తయిన సంఘటనను సూచిస్తుంది. తెలుగులో ‘జరిగింది’ సహజంగా ఉండి, సందర్భంలో దాని ప్రస్తుత ప్రాముఖ్యత స్పష్టంగానే ఉంటుంది.
- source_word: ἵνα πληρωθῶσιν
  choice: నెరవేరేలా
  rationale: ἵνα తో కూడిన కర్మణి విధ్యర్థక రూపంలోని ఉద్దేశం/ఫలిత భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది; ఉద్దేశం మరియు ఫలితం మధ్య ఉన్న గ్రీకు అస్పష్టతను అతిగా నిర్ణయించదు.
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: ప్రవక్తల లేఖనాలు
  rationale: γραφαί ఇక్కడ పవిత్ర లేఖనాలను సూచిస్తుంది. ‘ప్రవక్తల లేఖనాలు’ అనేది గ్రీకు షష్ఠీ సంబంధాన్ని ‘రాసినవి’ లేదా ‘చెప్పినవి’ అని విస్తరించకుండా నిలుపుతుంది.
- source_word: τότε
  choice: అప్పుడు
  rationale: తర్వాత జరిగిన సంఘటనను సూచించే సహజమైన తెలుగు కథన అనుసంధానం.
- source_word: οἱ μαθηταὶ πάντες
  choice: శిష్యులందరూ
  rationale: πάντες తెలిపే సంపూర్ణతను స్పష్టంగా నిలుపుతుంది; మూలంలో లేని ‘ఆయన శిష్యులు’ అనే స్వామ్యపదాన్ని జోడించదు.
- source_word: ἀφέντες αὐτὸν
  choice: ఆయనను విడిచిపెట్టి
  rationale: ἀφίημι ఇక్కడ వెనుక వదిలివేయడం లేదా పరిత్యజించడం అనే భావాన్ని కలిగి ఉంది. ‘విడిచిపెట్టి’ సహజంగా ఉండి, మరింత బలమైన ‘వదిలేసి/పరిత్యజించి’ అనే సందర్భార్థాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: ἔφυγον
  choice: పారిపోయారు
  rationale: φεύγω తెలిపే భయంతో లేదా ప్రమాదం నుంచి వేగంగా వెళ్లిపోవడం అనే భావాన్ని నేరుగా, గంభీరంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ప్రవచనాత్మక లేఖనాల నెరవేర్పు
  choice: ‘ప్రవక్తల లేఖనాలు నెరవేరేలా’ అనే స్పష్టమైన నెరవేర్పు భాషను నిలుపడం
  alternative: ‘ప్రవక్తలు రాసినవి నిజమయ్యేలా’
  rationale: మత్తయి రచనలో నెరవేర్పు భావం ప్రాముఖ్యమైనది; మూలంలోని లేఖన మరియు ప్రవక్తల ప్రస్తావనను వివరణాత్మక పరిభాషగా మార్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే లేఖన పఠనానికి తగిన గౌరవభరిత శైలిలో రూపొందించబడింది. ‘ఆయన’ అనే గౌరవ సర్వనామం సహజ తెలుగు క్రైస్తవ వాడుకకు అనుగుణం.
