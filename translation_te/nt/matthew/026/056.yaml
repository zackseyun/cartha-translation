  source_fidelity: ‘కానీ ఇదంతా ప్రవక్తల లేఖనాలు నెరవేరేలా జరిగింది’ faithfully represents τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. ‘నెరవేరేలా’ appropriately retains the Greek purpose/result nuance without over-specifying it. ‘అప్పుడు శిష్యులందరూ ఆయనను విడిచిపెట్టి పారిపోయారు’ accurately conveys τότε, the emphatic totality of πάντες, the attendant participle ἀφέντες αὐτόν, and ἔφυγον.
  naturalness: The Telugu is clear, idiomatic modern standard Telugu, and maintains an appropriately dignified Scripture-reading register. The sequence ‘విడిచిపెట్టి పారిపోయారు’ is especially natural and preserves the participial relationship.
  terminology: ‘ప్రవక్తల లేఖనాలు’ preserves the concise genitive relationship in the Greek without adding whether the prophets wrote or spoke them. ‘శిష్యులు,’ ‘ఆయన,’ and ‘నెరవేరేలా’ are suitable established terms/register. The footnote correctly offers the contextually stronger desertion nuance of ἀφέντες without forcing it into the main text.
