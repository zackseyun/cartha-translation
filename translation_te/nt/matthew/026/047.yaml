revisions:
- from: ఆయన ఇంకా మాట్లాడుతుండగానే, ఇదిగో, పన్నెండుగురిలో ఒకడైన యూదా వచ్చాడు. అతనితో పాటు కత్తులు, దుడ్డుకర్రలు[b] పట్టుకున్న పెద్ద గుంపు వచ్చింది. వారు ప్రధాన యాజకుల దగ్గరనుంచి, ప్రజల పెద్దల దగ్గరనుంచి వచ్చారు.[a]
  to: ఆయన ఇంకా మాట్లాడుతుండగానే, ఇదిగో, పన్నెండుగురిలో ఒకడైన యూదా వచ్చాడు; అతనితో పాటు కత్తులు, దుడ్డుకర్రలు[b] పట్టుకున్న పెద్ద గుంపు ప్రధాన యాజకుల నుంచీ ప్రజల పెద్దల నుంచీ వచ్చింది.[a]
  rationale: సవరణ గుంపు, దాని ఆయుధాలు, మరియు ప్రధాన యాజకులు/ప్రజల పెద్దలతో దాని మూలసంబంధాన్ని ఒకే వాక్యనిర్మాణంలో ఉంచుతుంది. “పంపిన” అనే భావాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా, పాదసూచికలో ప్రత్యామ్నాయంగా మాత్రమే ఇస్తుంది; కాబట్టి గ్రీకు ἀπό యొక్క ఉద్దేశపూర్వక విస్తృతత నిలిచి ఉంటుంది.
