id: MAT.26.47
reference: Matthew 26:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: te
  text: ఆయన ఇంకా మాట్లాడుతుండగానే, ఇదిగో, పన్నెండుగురిలో ఒకడైన యూదా వచ్చాడు; అతనితో పాటు కత్తులు, దుడ్డుకర్రలు[b] పట్టుకున్న పెద్ద గుంపు ప్రధాన యాజకుల నుంచీ ప్రజల పెద్దల నుంచీ వచ్చింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రధాన యాజకులు, ప్రజల పెద్దలు పంపిన గుంపు.” గ్రీకులో అక్షరార్థంగా “ప్రధాన యాజకుల నుంచీ ప్రజల పెద్దల నుంచీ” అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “కర్రలు.” గ్రీకు పదం అక్షరార్థంగా చెక్కముక్కలను లేదా కర్రలను సూచిస్తుంది; ఇక్కడ అవి కొట్టడానికి ఉపయోగించే దుడ్డుకర్రలు కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: ఆయన ఇంకా మాట్లాడుతుండగానే
  rationale: ఈ genitive absolute సమకాలీనంగా జరుగుతున్న చర్యను సూచిస్తుంది. ‘ఇంకా’ ἔτι భావాన్ని, ‘మాట్లాడుతుండగానే’ ఆ సమయ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో హఠాత్తుగా దృష్టిని ఆకర్షించి సన్నివేశానికి సజీవతను ఇచ్చే సూచక పదంగా నిలుపబడింది; ‘అకస్మాత్తుగా’ అని అనువదిస్తే మూలంలో లేని కాలభావాన్ని బలపరుస్తుంది.
- source_word: Ἰούδας
  choice: యూదా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: εἷς τῶν δώδεκα
  choice: పన్నెండుగురిలో ఒకడైన
  rationale: భాగసూచక నిర్మాణాన్ని సహజమైన తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: ἦλθεν
  choice: వచ్చాడు
  rationale: ἔρχομαι యొక్క సాధారణ కథనార్థానికి నేరమైన తెలుగు సమానం.
- source_word: ὄχλος πολὺς
  choice: పెద్ద గుంపు
  rationale: πολύς యొక్క పరిమాణ భావాన్ని సహజంగా ఇస్తుంది; ‘మూక’ అని అంటే మూల నామవాచకంలో స్పష్టంగా లేని శత్రుత్వ భావాన్ని అదనంగా చేర్చవచ్చు.
- source_word: μετὰ μαχαιρῶν
  choice: కత్తులు ... పట్టుకున్న
  rationale: μάχαιρα కత్తి లేదా చిన్న ఖడ్గం వంటి ఆయుధాన్ని సూచిస్తుంది. ఈ సందర్భంలో ‘కత్తులు’ విస్తృతమైన, సులభంగా అర్థమయ్యే సమానం; ‘పట్టుకున్న’ అనేది తెలుగులో ఆయుధాలతో రావడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ ξύλων
  choice: దుడ్డుకర్రలు
  rationale: ξύλον అక్షరార్థంగా చెక్కముక్క లేదా కర్రను సూచించినా, ఇక్కడ ఆయుధాల జాబితాలో కొట్టడానికి ఉపయోగించే కర్రల భావం ఉంది. ‘దుడ్డుకర్రలు’ ఆ సందర్భార్థాన్ని స్పష్టంగా ఇస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: ప్రధాన యాజకుల దగ్గరనుంచి, ప్రజల పెద్దల దగ్గరనుంచి
  rationale: ἀπό గుంపు వచ్చిన మూలాన్ని లేదా వారి అధికార సంబంధాన్ని సూచిస్తుంది. ‘పంపబడ్డారు’ అనే క్రియను మూలంలో లేకుండానే ప్రధాన పాఠ్యంలో చేర్చకుండా, ‘దగ్గరనుంచి’ ద్వారా అసలు నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఈ గుంపును యూదుల నాయకులు అధికారికంగా పంపారని ప్రధాన పాఠ్యంలో స్పష్టంగా చెప్పాలా?
  choice: వారు ప్రధాన యాజకుల దగ్గరనుంచి, ప్రజల పెద్దల దగ్గరనుంచి వచ్చారు
  alternative: వారిని ప్రధాన యాజకులు, ప్రజల పెద్దలు పంపారు
  rationale: ἀπό మూలం లేదా ఆరంభ స్థానాన్ని సూచిస్తుంది; సందర్భం అధికారపూర్వక పంపకాన్ని సూచించవచ్చు గాని, గ్రీకు పాఠ్యంలో ‘పంపారు’ అనే క్రియ లేదు. అందువల్ల ప్రధాన పాఠ్యం ఆ సంబంధాన్ని బలవంతంగా నిర్ధారించకుండా మూలంలోని భావ విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఇదిగో’ అనే స్వల్ప సంప్రదాయ పదాన్ని మూలంలోని దృష్టి ఆకర్షించే కథన బలాన్ని కాపాడేందుకు ఉంచాం. పొడవైన గ్రీకు వాక్యాన్ని స్పష్టత కోసం తెలుగులో మూడు వాక్యాలుగా విభజించాం; భావ సంబంధం యథాతథంగా ఉంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
