  naturalness: “దుడ్డుకర్రలు” ఆయుధసందర్భంలో సహజంగానే ఉంది; “కర్రలు” అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇవ్వడం సముచితం. ఒకే వాక్యంలో గుంపుకు సంబంధించిన విశేషణాలు, దాని మూలసంబంధం ఉంచడం ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
  terminology: “యూదా,” “పన్నెండుగురిలో ఒకడైన,” “ప్రధాన యాజకులు,” “ప్రజల పెద్దలు,” మరియు “కత్తులు” సరైన, స్థిరమైన పదప్రయోగాలు. “ఇదిగో” ἰδού యొక్క కథనాత్మక దృష్ట్యాకర్షణను అతిశయార్థం లేకుండా నిలుపుతుంది.
