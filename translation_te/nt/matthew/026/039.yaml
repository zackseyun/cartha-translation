id: MAT.26.39
reference: Matthew 26:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: te
  text: 'ఆయన ఇంకొంచెం ముందుకు వెళ్లి, ముఖం నేలపై ఉంచి పడిపోయి[a], ప్రార్థిస్తూ ఇలా అన్నాడు: “నా తండ్రీ, సాధ్యమైతే ఈ గిన్నె[b] నా నుండి తొలగిపోనివ్వు. అయినా, నేను కోరినట్లు కాక, నీవు కోరినట్లే జరగనీ.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన ముఖం నేలవైపు చేసి పడిపోయాడు.”
    reason: lexical_alternative
  - marker: b
    text: “గిన్నె” అనేది ఒకరికి నియమించబడిన భాగాన్ని, ముఖ్యంగా బాధను సూచించే బైబిలు రూపకం; మత్తయి 20:22; 26:42 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: ఇంకొంచెం ముందుకు వెళ్లి
  rationale: ముందుకు కొద్ది దూరం కదిలిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; μικρόν యొక్క స్వల్ప దూర భావాన్ని నిలుపుతుంది.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: ముఖం నేలకు ఆనించి పడిపోయి
  rationale: ముఖం కిందికి ఉండే శరీర భంగిమను స్పష్టంగా చూపిస్తూ, ప్రార్థనలోని సాష్టాంగ స్థితిని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: προσευχόμενος καὶ λέγων
  choice: ప్రార్థిస్తూ ఇలా అన్నాడు
  rationale: ప్రార్థించడం, పలకడం ప్రధాన క్రియతో ఏకకాలంలో జరుగుతున్నాయని సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: Πάτερ μου
  choice: నా తండ్రీ
  rationale: సంబోధనలోని సాన్నిహిత్యాన్నీ గౌరవాన్నీ అదనపు భావరంగు చేర్చకుండా నిలుపుతుంది.
- source_word: εἰ δυνατόν ἐστιν
  choice: సాధ్యమైతే
  rationale: పూర్తి షరతు భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: నా నుండి తొలగిపోనివ్వు
  rationale: ఇది ఆజ్ఞ కంటే ప్రార్థనాత్మక అభ్యర్థన అని తెలుపుతూ, తన నుండి దాటిపోవడం లేదా తొలగిపోవడం అనే భావాన్ని అందిస్తుంది.
- source_word: τὸ ποτήριον τοῦτο
  choice: ఈ గిన్నె
  rationale: మూలంలోని స్పష్టమైన పాత్ర-రూపకాన్ని నిలుపుతుంది; ‘బాధ’ అని విప్పి చెప్పి దాని బైబిలు అంతర్గత ప్రతిధ్వనులను కుదించదు.
- source_word: πλὴν
  choice: అయినా
  rationale: ముందటి అభ్యర్థనకు బలమైన పరిమితి లేదా వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: నేను కోరినట్లు కాదు, నీవు కోరినట్లే
  rationale: యేసు యొక్క నిజమైన కోరికకూ తండ్రి కోరికకు ఆయన లోబడడానికీ మధ్య ఉన్న ఉద్వేగాన్ని నిలుపుతుంది; రెండవ భాగంలోని క్రియా లుప్తిని తెలుగులో సమాంతర నిర్మాణంతో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యేసు ప్రార్థనలోని ‘గిన్నె’ రూపకం
  choice: ప్రధాన పాఠ్యంలో ‘ఈ గిన్నె’ అనే ప్రత్యక్ష రూపకాన్ని నిలుపడం
  alternative: ఈ బాధ; నాకు నియమించబడిన ఈ వేదన
  rationale: ποτήριον బైబిలు వాడుకలో నియమించబడిన భాగాన్ని, ముఖ్యంగా బాధను సూచించగలదు. రూపకాన్ని అలాగే ఉంచడం ద్వారా దాని అంతర్గ్రంథ, ధార్మిక లోతు నిలుస్తుంది; పాదసూచిక దాని నేపథ్యాన్ని వివరిస్తుంది.
- issue: యేసు కోరిక మరియు తండ్రి కోరిక మధ్య సంబంధం
  choice: ‘నేను కోరినట్లు కాదు, నీవు కోరినట్లే’
  alternative: నా ఇష్టం కాదు, నీ చిత్తమే జరగాలి
  rationale: ప్రత్యామ్నాయం భావాన్ని స్పష్టపరుస్తున్నప్పటికీ, మూలంలో లేని ‘జరగాలి’ని చేర్చి వాక్యంలోని సంక్షిప్తతను పరిష్కరిస్తుంది. ఎంపిక చేసిన రూపం రెండు కోరికల మధ్య ఉన్న నిజమైన ఉద్వేగాన్నీ యేసు లోబడడాన్నీ వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘నా తండ్రీ’ ప్రార్థనలోని సాన్నిహిత్యాన్నీ గంభీరతనూ నిలుపుతుంది. రూపకాన్ని ప్రధాన పాఠ్యంలో ఉంచి, వివరణను పాదసూచికకు పరిమితం చేశాం.
