revisions:
- from: 'ఆయన ఇంకొంచెం ముందుకు వెళ్లి, ముఖం నేలకు ఆనించి పడిపోయి[a], ప్రార్థిస్తూ ఇలా అన్నాడు: “నా తండ్రీ, సాధ్యమైతే ఈ గిన్నె[b] నా నుండి తొలగిపోనివ్వు. అయినా, నేను కోరినట్లు కాదు, నీవు కోరినట్లే.”'
  to: 'ఆయన ఇంకొంచెం ముందుకు వెళ్లి, ముఖం నేలపై ఉంచి పడిపోయి[a], ప్రార్థిస్తూ ఇలా అన్నాడు: “నా తండ్రీ, సాధ్యమైతే ఈ గిన్నె[b] నా నుండి తొలగిపోనివ్వు. అయినా, నేను కోరినట్లు కాక, నీవు కోరినట్లే జరగనీ.”'
