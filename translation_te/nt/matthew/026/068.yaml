  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: te
  text: '“మెస్సీయా[a], మాకు ప్రవచించు: నిన్ను కొట్టినవాడు ఎవరు?” అని అన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్రీస్తూ.” గ్రీకు పదమైన Χριστός ఇక్కడ పేరు వలె కాక బిరుదుగా వాడబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: అని అన్నారు
  rationale: వర్తమాన క్రియావిశేషణ రూపం వారి మాటలను పరిచయం చేస్తుంది; తెలుగులో ఉద్ధరణ చివర ‘అని అన్నారు’ సహజంగా ఉంటుంది.
- source_word: Προφήτευσον
  choice: ప్రవచించు
  rationale: ఆజ్ఞార్థక రూపాన్ని, అలాగే యేసును ఎగతాళి చేస్తూ చేసిన ప్రవచన సవాలును నేరుగా నిలుపుతుంది.
- source_word: ἡμῖν
  choice: మాకు
  rationale: ప్రవచనం ఎవరికి చెప్పాలనే దాతువు భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: χριστέ
  choice: మెస్సీయా
  rationale: ఇది సంబోధనలో వాడిన బిరుదు; అభిషిక్తుడనే మెస్సీయ సంబంధ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: నిన్ను కొట్టినవాడు ఎవరు?
  rationale: కర్తను గుర్తించమనే ప్రశ్నను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, కొట్టిన చర్యను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయా
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός పేరు వంటి స్థిర రూపంగా కాక సంబోధనా బిరుదుగా, పైగా ఎగతాళిలో వాడబడింది. ‘మెస్సీయా’ ఆ బిరుదులోని భావాన్ని పాఠకునికి స్పష్టంగా అందిస్తుంది; ‘క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని ప్రత్యక్ష ప్రశ్నను, ఎగతాళి ధ్వనిని, ప్రవచించమనే ఆజ్ఞను వివరణాత్మక విస్తరణ లేకుండా నిలిపింది.
