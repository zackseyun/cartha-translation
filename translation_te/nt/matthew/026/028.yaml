id: MAT.26.28
reference: Matthew 26:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: te
  text: ఎందుకంటే ఇది నా నిబంధన రక్తం[a]—అనేకుల కోసం, పాపాల క్షమాపణ కోసం చిందించబడుతోంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'కొన్ని ప్రతుల్లో: “కొత్త నిబంధనకు సంబంధించిన నా రక్తం.”'
    reason: textual_variant
  - marker: b
    text: 'లేదా: “అనేకుల పక్షంగా.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ఇది
  rationale: గ్రీకు పాఠంలో కేవలం సూచన సర్వనామమే ఉంది; ఈ వాక్యభాగంలో లేని ‘గిన్నె’ అనే పదాన్ని చేర్చలేదు.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందున్న తాగమనే ఆజ్ఞకు ఈ మాట ఇచ్చే వివరణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ αἷμά μου τῆς διαθήκης
  choice: నిబంధనకు సంబంధించిన నా రక్తం
  rationale: ‘రక్తం,’ ‘నిబంధన’ అనే కీలక భావాలను నేరుగా నిలుపుతూ, గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని అవసరానికి మించి నిర్ధారించకుండా తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: περὶ πολλῶν
  choice: అనేకుల కోసం
  rationale: ఈ బలి సందర్భంలో ఇతరుల ప్రయోజనార్థమైన భావాన్ని సహజంగా తెలియజేస్తూ ‘అనేకులు’ అనే మూలపదాన్ని అలాగే కాపాడుతుంది; ‘అందరి కోసం’ అని విస్తరించదు.
- source_word: ἐκχυννόμενον
  choice: చిందించబడుతోంది
  rationale: రక్తాన్ని కుమ్మరించే బలి చిత్రాన్ని నిలుపుతుంది. వర్తమానకాల నిష్క్రియార్థక కృదంతాన్ని తెలుగులో సహజమైన సంబంధ వాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: పాపాల క్షమాపణ కోసం
  rationale: ఉద్దేశం లేదా ఫలితాన్ని స్పష్టంగా తెలియజేసే, ఆధునిక పాఠకులకు సహజమైన పదబంధం.
theological_decisions:
- issue: ‘నిబంధన’తో ‘కొత్త’ అనే పదాన్ని చేర్చాలా
  choice: ప్రధాన పాఠంలో ‘నిబంధన’ మాత్రమే
  alternative: ‘కొత్త నిబంధన’
  rationale: ఇచ్చిన SBLGNT పాఠంలో καινῆς (‘కొత్త’) లేదు. అందువల్ల దాన్ని ప్రధాన పాఠంలో చేర్చకుండా, కొన్ని ప్రతుల్లో ఉన్న పాఠాంతరాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ప్రాయశ్చిత్త సందర్భంలో ‘అనేకుల కోసం’ అనే మాట పరిధి
  choice: అనేకుల కోసం
  alternative: అందరి కోసం
  rationale: మూలపాఠంలో πολλῶν (‘అనేకులు’) ఉంది. విస్తృత ప్రాయశ్చిత్త సిద్ధాంత వివాదాన్ని ఈ వచనంలోనే పరిష్కరించకుండా మూలంలోని పదాన్ని నిలిపాం.
- issue: περί యొక్క ప్రయోజనార్థక భావం
  choice: అనేకుల కోసం
  alternative: అనేకుల పక్షంగా
  rationale: ‘కోసం’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది; ‘పక్షంగా’ అనే మరింత స్పష్టమైన ప్రతినిధిత్వ/ప్రయోజనార్థక సాధ్యతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరత కలిగిన శైలి. ‘రక్తం,’ ‘నిబంధన,’ ‘పాపాల క్షమాపణ’ వంటి ధార్మికంగా కీలకమైన పదాలను పారాఫ్రేజ్ చేయలేదు. దీర్ఘమైన గ్రీకు నిర్మాణాన్ని స్పష్టత కోసం డ్యాష్‌తో అనుసంధానించిన రెండు భాగాల తెలుగు వాక్యంగా మలిచాం.
