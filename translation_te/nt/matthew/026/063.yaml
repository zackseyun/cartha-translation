source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: te
  text: 'అయితే యేసు మౌనంగా ఉన్నాడు. అప్పుడు ప్రధాన యాజకుడు ఆయనతో, “సజీవుడైన దేవుని పేరిట నిన్ను ప్రమాణం చేయిస్తున్నాను[a]: నీవే అభిషిక్తుడవు, దేవుని కుమారుడవు కాదో మాకు చెప్పు” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సజీవుడైన దేవుని పేరిట నిన్ను గంభీరంగా ఆజ్ఞాపిస్తున్నాను.” గ్రీకులో ఇది గంభీరమైన ప్రమాణ సూత్రం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσιώπα
  choice: మౌనంగా ఉండిపోయాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ యేసు కొంతసేపు మౌనాన్ని కొనసాగించాడనే భావాన్ని ఇస్తుంది; ఈ రూపం దానిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀρχιερεὺς
  choice: ప్రధాన యాజకుడు
  rationale: యూదుల అత్యున్నత యాజక పదవిని స్పష్టంగా సూచించే ప్రామాణిక తెలుగు పదబంధం.
- source_word: Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: సజీవుడైన దేవుని పేరట నిన్ను ప్రమాణం చేయిస్తున్నాను
  rationale: ఇది భూతవైద్యానికి సంబంధించిన అర్థం కాదు; దేవుణ్ణి సాక్షిగా ఉంచి సమాధానం కోరే గంభీరమైన ప్రమాణ సూత్రం. ఎంపిక చేసిన రూపం న్యాయవిచారణ సందర్భంలోని బలాన్ని నిలుపుతుంది.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: మాకు చెప్పు
  rationale: ప్రమాణపూర్వకంగా కోరుతున్న సమాధానాన్ని సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ὁ χριστὸς
  choice: అభిషిక్తుడు
  rationale: ఇక్కడ Χριστός వ్యక్తిగత పేరుగా కాక, ఎదురుచూస్తున్న దేవుని అభిషిక్తుని బిరుదుగా వాడబడింది; అందువల్ల అర్థానువాదం చేయబడింది.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: క్రీస్తు సంబంధమైన బిరుదును తగ్గించకుండా లేదా అదనంగా వివరించకుండా నేరుగా నిలుపుతుంది.
- source_word: ὁ δὲ Ἰησοῦς
  choice: అయితే యేసు
  rationale: δέ ముందు సందర్భంతో ఉన్న స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ తెలుగు కథన ప్రవాహంలో సహజంగా ఉంటుంది.
theological_decisions:
- issue: ప్రధాన యాజకుని ప్రశ్నలో Χριστός అనే బిరుదు
  choice: అభిషిక్తుడు
  alternative: క్రీస్తు లేదా మెస్సీయ
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ పదం ఇక్కడ పేరుగా కాక బిరుదుగా పనిచేస్తుంది. ‘అభిషిక్తుడు’ మూలార్థాన్ని తెలియజేస్తుంది; పరిచితమైన ప్రత్యామ్నాయ రూపాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- issue: Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος యొక్క బలం
  choice: దేవుని పేరట ప్రమాణం చేయించే గంభీర సూత్రం
  alternative: సాధారణంగా ఆజ్ఞాపించడం లేదా అడగడం
  rationale: దేవుణ్ణి ఆహ్వానిస్తూ పలికిన ఈ మాట న్యాయవిచారణలోని ప్రమాణపూర్వక బలాన్ని కలిగి ఉంది; దానిని సాధారణ ప్రశ్నగా బలహీనపరచలేదు.
- issue: ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ మధ్య సంబంధం
  choice: ‘దేవుని కుమారుడు’ అనే పదబంధాన్ని ‘అభిషిక్తుడు’తో సన్నిహితంగా ఉంచడం
  alternative: వాటిని రెండు పూర్తిగా వేర్వేరు ప్రశ్నలుగా విభజించడం
  rationale: గ్రీకు వాక్యంలో రెండవ బిరుదు మొదటిదాన్ని వివరిస్తున్న అనుబంధ బిరుదుగా చదవవచ్చు. తెలుగు వాక్యం ఆ సన్నిహిత సంబంధాన్ని నిలుపుతూ, మూలంలో లేని వివరణను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయవిచారణ శైలిని నిలిపాం. ‘మౌనంగా ఉండిపోయాడు’ కొనసాగిన మౌనాన్ని, ‘ప్రమాణం చేయిస్తున్నాను’ ప్రమాణ సూత్రపు బలాన్ని తెలియజేస్తాయి. బిరుదును అర్థానువాదంగా ప్రధాన పాఠ్యంలో ఉంచి, పరిచితమైన ‘క్రీస్తు/మెస్సీయ’ రూపాలను పాదసూచికలో ఇచ్చాం.
