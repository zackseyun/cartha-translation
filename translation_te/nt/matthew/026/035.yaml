    text: లేదా, “నేను నిన్ను ఎన్నటికీ నిరాకరించను.” గ్రీకులో ఇక్కడ బలమైన నిరాకరణ (οὐ μή) ఉంది.
    reason: lexical_alternative
  revision_rationale: The revision renders ἀπαρνήσομαι directly as ‘నిరాకరించను’ rather than specifying the later-narrative formulation ‘say that I do not know you.’ It retains the strong force of οὐ μή, the concessive condition, and the statement that all the disciples spoke similarly. The footnote is revised to provide a genuine idiomatic alternative while retaining the explanation of the Greek emphatic negation.
