id: MAT.26.35
reference: Matthew 26:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: te
  text: 'పేతురు ఆయనతో ఇలా అన్నాడు: “నీతో కలిసి చనిపోవలసి వచ్చినా, నేను నిన్ను ఎట్టి పరిస్థితుల్లోనూ నిరాకరించను[a].” శిష్యులందరూ కూడా అలాగే అన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నిన్ను ఎన్నటికీ నిరాకరించను.” గ్రీకులో ఇక్కడ బలమైన నిరాకరణ (οὐ μή) ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో కథన వర్తమాన కాలం ఉన్నప్పటికీ, ఆధునిక తెలుగు కథనశైలిలో భూతకాల రూపం సహజంగా ఉండి అదే కథన విధిని నిలుపుతుంది.
- source_word: Κἂν
  choice: వచ్చినా
  rationale: κἄν సూచించే concessive భావాన్ని ‘చనిపోవలసి వచ్చినా’ అనే సహజమైన తెలుగు నిర్మాణం స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: δέῃ με
  choice: నేను … చనిపోవలసి
  rationale: δέῃ తెలియజేసే అవసరం లేదా అనివార్యతను ‘చనిపోవలసి’ నిలుపుతుంది.
- source_word: σὺν σοὶ
  choice: నీతో కలిసి
  rationale: తోడుగా ఉండే భావాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀποθανεῖν
  choice: చనిపోవలసి
  rationale: అవసరాన్ని సూచించే δέῃతో కలిసి ఉన్న infinitive భావాన్ని తెలుగులో సమగ్రంగా అందిస్తుంది.
- source_word: οὐ μή
  choice: ఎట్టి పరిస్థితిలోనూ … చెప్పను
  rationale: οὐ μήలోని బలమైన నిరాకరణను సహజమైన, దృఢమైన తెలుగు వాక్యంతో వ్యక్తం చేస్తుంది.
- source_word: ἀπαρνήσομαι
  choice: నిన్ను … ఎరుగనని చెప్పను
  rationale: ఈ సందర్భంలో యేసుతో తనకున్న సంబంధాన్ని నిరాకరించడమే ఉద్దేశం. ‘ఎరుగనని చెప్పడం’ తరువాతి కథనంలోని పేతురు నిరాకరణతో సహజంగా అనుసంధానమవుతుంది.
- source_word: ὁμοίως
  choice: అలాగే
  rationale: మిగతా శిష్యులు పేతురు చెప్పినదానితో సమానమైన మాట చెప్పారనే భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: πάντες οἱ μαθηταὶ
  choice: శిష్యులందరూ
  rationale: πάντεςలోని సమగ్రతను, μαθηταίకు సువార్తలలో స్థిరమైన తెలుగు పదప్రయోగాన్ని కాపాడుతుంది.
- source_word: εἶπαν
  choice: అన్నారు
  rationale: బహువచన కర్తకు సరిపోయే సహజమైన భూతకాల రూపం.
theological_decisions:
- issue: పేతురు చేసిన నిరాకరణ వాగ్దానంలోని బలం
  choice: οὐ μήను ‘ఎట్టి పరిస్థితిలోనూ … చెప్పను’ అని బలమైన భవిష్యత్ నిరాకరణగా అనువదించడం
  alternative: ‘నిన్ను ఎన్నటికీ ఎరుగనని చెప్పను’
  rationale: మూలంలోని దృఢమైన నిరాకరణను నిలుపుతూ, పేతురు ఆత్మవిశ్వాసాన్ని కథనం చెప్పినంతవరకే వ్యక్తం చేస్తుంది; తరువాతి సంఘటనల ఆధారంగా అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘ఆయనతో’ గౌరవాన్ని నిలుపుతుంది; ప్రత్యక్ష సంభాషణలో మూలంలోని ఏకవచన రెండవ పురుషాన్ని అనుసరించి ‘నీతో/నిన్ను’ వాడాం.
