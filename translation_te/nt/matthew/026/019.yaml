- from: శిష్యులు యేసు తమకు ఆదేశించినట్లే చేసి, పస్కాను[a] సిద్ధం చేశారు.
  to: శిష్యులు యేసు వారికి ఆదేశించినట్లుగా చేసి, పస్కాను[a] సిద్ధం చేశారు.
  rationale: The revision makes only idiomatic Telugu improvements. It preserves the Greek sequence and sense—“the disciples did as Jesus directed them, and they prepared the Passover”—while retaining “పస్కా” in the main text and the meal-related lexical alternative in a footnote.
