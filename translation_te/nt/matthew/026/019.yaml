reference: Matthew 26:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: te
  text: శిష్యులు యేసు వారికి ఆదేశించినట్లుగా చేసి, పస్కాను[a] సిద్ధం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పస్కా భోజనాన్ని’. πάσχα అనే పదం పస్కా ఆచరణను విస్తృత అర్థంలో, దానితో సంబంధమున్న భోజనంతో సహా, సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν
  choice: చేసి
  rationale: ὡς συνέταξεν‌తో కలిసి, యేసు ఆదేశించిన ప్రకారమే వారు చేశారనే సహజమైన భావాన్ని ఇస్తుంది.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులు
  rationale: సువార్తల్లో μαθηταίకు ప్రామాణికమైన, సహజమైన తెలుగు పదం; యేసును అనుసరించి నేర్చుకునేవారనే సంబంధాన్ని సూచిస్తుంది.
- source_word: ὡς
  choice: ఆదేశించినట్లే
  rationale: వారు యేసు చెప్పిన విధానానికి అనుగుణంగా చేశారనే conformity భావాన్ని ‘-ినట్లే’ సహజంగా తెలియజేస్తుంది.
- source_word: συνέταξεν
  choice: ఆదేశించిన
  rationale: సందర్భంలో యేసు ముందుగా ఇచ్చిన నిర్దేశాలను సూచిస్తుంది; ఆయన అధికారాన్ని నిలుపుతూ అనవసరమైన కఠినతను జోడించదు.
- source_word: ἡτοίμασαν
  choice: సిద్ధం చేశారు
  rationale: ἑτοιμάζωకు నేరుగా సరిపోయే, ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: τὸ πάσχα
  choice: పస్కాను
  rationale: గ్రీకు పదంలోని విస్తృతార్థాన్ని కాపాడుతుంది; అది పండుగ ఆచరణను, దాని భోజనాన్ని లేదా సంబంధిత ఏర్పాట్లను సూచించగలదు. సందర్భానికి మించిన నిర్దిష్టతను ప్రధాన పాఠ్యంలో జోడించలేదు.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: తెలుగులో స్థిరపడిన ప్రామాణిక నామరూపం.
theological_decisions:
- issue: τὸ πάσχα యొక్క అర్థపరిధి
  choice: పస్కా
  alternative: పస్కా భోజనం; పస్కా గొర్రెపిల్ల
  rationale: ఈ పదం పస్కా పండుగను విస్తృతంగా, దాని భోజనాన్ని, లేదా సంబంధిత బలి అంశాన్ని సూచించగలదు. ఈ సందర్భంలో భోజన ఏర్పాట్లు ప్రధానంగా ఉన్నప్పటికీ, గ్రీకు పాఠ్యం దానిని ‘భోజనం’ లేదా ‘గొర్రెపిల్ల’ అని కుదించదు. అందువల్ల ప్రధాన పాఠ్యంలో విస్తృతమైన పదాన్ని ఉంచి, భోజనార్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘ఆదేశించినట్లే’ యేసు అధికారాన్ని, శిష్యుల విధేయతను స్పష్టంగా చూపుతుంది; ‘పస్కా’ మూలపాఠ్యంలోని అర్థవిస్తృతిని నిలుపుతుంది.
