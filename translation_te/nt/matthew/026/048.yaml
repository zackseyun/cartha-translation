  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: te
  text: ఆయనకు ద్రోహం చేస్తున్నవాడు[a] వారికి ఒక సంకేతం[b] ఇచ్చి, “నేను ఎవరిని ముద్దుపెడతానో ఆయనే. ఆయనను పట్టుకోండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయనను అప్పగిస్తున్నవాడు.” గ్రీకు క్రియకు “అప్పగించు” అనే అర్థం రావచ్చు; ఈ సందర్భంలో అది యూదా చేసిన ద్రోహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “గుర్తు.” ఇక్కడ అది యేసును గుర్తించడానికి ముందుగా నిర్ణయించిన సంకేతం.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: ద్రోహం చేస్తున్నవాడు
  rationale: παραδίδωμι ప్రాథమికంగా ‘అప్పగించు’ అని అర్థమివ్వగలిగినా, ఈ సందర్భంలో యూదా చేసిన ద్రోహపూరిత అప్పగింతను సూచిస్తుంది. అందువల్ల నైతిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేశాం; అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: σημεῖον
  choice: సంకేతం
  rationale: ఇక్కడ ఇది యేసును గుర్తించడానికి ముందుగా నిర్ణయించిన గుర్తును సూచిస్తుంది. ‘సంకేతం’ ఈ సందర్భంలో సహజంగా ఉండి, sign/signal రెండింటి భావాన్నీ మోయగలదు.
- source_word: Ὃν ἂν φιλήσω
  choice: నేను ఎవరిని ముద్దుపెడతానో
  rationale: ἄνతో కూడిన aorist subjunctive నిర్దిష్టంగా పేరు చెప్పని వ్యక్తిని గుర్తించే relative construction. తెలుగు ‘ఎవరిని…నో’ నిర్మాణం ఈ అనిశ్చిత-గుర్తింపు భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: φιλήσω
  choice: ముద్దుపెడతానో
  rationale: φιλέω ఇక్కడ గుర్తింపు చర్యగా ముద్దుపెట్టడాన్ని సూచిస్తుంది. ‘ముద్దుతో పలకరిస్తానో’ అని విస్తరించడం మూలంలో లేని వివరాన్ని చేర్చుతుంది.
- source_word: αὐτός ἐστιν
  choice: ఆయనే
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్త గుర్తింపునూ αὐτόςపై ఉన్న ఉద్ఘాటననూ తెలుగు ‘ఆయనే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κρατήσατε
  choice: పట్టుకోండి
  rationale: κρατέω బలంగా పట్టుకోవడం లేదా అదుపులోకి తీసుకోవడం అనే భావాన్ని ఇస్తుంది. అరెస్టు సందర్భం స్పష్టమైనప్పటికీ, ‘అరెస్టు చేయండి’ అనే న్యాయపరమైన పదాన్ని మూలంలోకి దిగుమతి చేయకుండా ‘పట్టుకోండి’ ఉపయోగించాం.
theological_decisions:
- issue: యూదాను సూచించే παραδιδοὺς పదంలోని నైతిక భావం
  choice: ‘ద్రోహం చేస్తున్నవాడు’ అని అనువదించడం
  alternative: ‘ఆయనను అప్పగిస్తున్నవాడు’
  rationale: యేసు శ్రమల కథనంలో ఈ క్రియ తటస్థమైన అప్పగింతను కాక యూదా ద్రోహాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సందర్భానుగుణ నైతిక భావాన్ని తెలిపి, మూల క్రియకు సాధ్యమైన మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. యేసును సూచించేటప్పుడు ‘ఆయన’ రూపం వాడబడింది. గ్రీకులో లేని కాలసూచక ‘ఇప్పుడు’ వంటి discourse marker చేర్చలేదు. పాదసూచిక గుర్తులను వాటి నిజమైన పదసంబంధ స్థానాల్లో ఉంచాం.
