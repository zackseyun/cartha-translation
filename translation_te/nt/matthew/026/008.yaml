revisions:
- from: అయితే శిష్యులు అది చూసి కోపంతో, “ఇంత వృథా ఎందుకు?” అన్నారు.
  to: అయితే, శిష్యులు అది చూసి ఆగ్రహించి, “ఈ వృథా దేనికి?” అన్నారు.
  rationale: The revision preserves the implicit contextual object and the concise direct question, while rendering the disciples’ indignation as an actual verbal action and retaining the purposive force of εἰς τί in natural modern Telugu.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:09Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the implicit object of ἰδόντες (‘అది చూసి’), the narrative turn δέ (‘అయితే’), and μαθηταί (‘శిష్యులు’). However, ‘కోపంతో’ is an adverbial expression (‘angrily’) rather than a clear equivalent of the finite verb ἠγανάκτησαν, ‘they were indignant.’
  naturalness: The sentence is generally fluent modern Telugu. Using a finite/participial verb for the disciples’ indignation and ‘దేనికి?’ for εἰς τί produces a more idiomatic, direct rhetorical question.
  terminology: ‘శిష్యులు’ is the standard Gospel term. ‘ఆగ్రహించి’ suitably conveys ἠγανάκτησαν without overstating it. ‘ఈ వృథా’ retains the contextual sense of ἀπώλεια as waste/loss.
  issues:
  - severity: medium
    issue: ‘కోపంతో’ does not fully represent the verbal assertion of ἠγανάκτησαν.
    rationale: The Greek states that the disciples became/were indignant. ‘ఆగ్రహించి’ naturally supplies that predication in Telugu and maintains the connection to their speech.
  - severity: low
    issue: ‘ఎందుకు?’ is possible for εἰς τί, but ‘దేనికి?’ more directly preserves its purposive sense.
    rationale: Εἰς τί literally asks ‘for what purpose/to what end?’; ‘ఈ వృథా దేనికి?’ is idiomatic Telugu while retaining that nuance.
  revised_text: అయితే, శిష్యులు అది చూసి ఆగ్రహించి, “ఈ వృథా దేనికి?” అన్నారు.
  revised_footnotes: []
  revision_rationale: The revision preserves the implicit contextual object and the concise direct question, while rendering the disciples’ indignation as an actual verbal action and retaining the purposive force of εἰς τί in natural modern Telugu.
