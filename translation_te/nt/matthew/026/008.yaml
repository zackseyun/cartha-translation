translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని సంక్షిప్తతను, శిష్యుల బలమైన అసంతృప్తిని నిలిపి ఉంచాం.
