base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: te
  text: అయితే, శిష్యులు అది చూసి ఆగ్రహించి, “ఈ వృథా దేనికి?” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: అది చూసి
  rationale: అయోరిస్ట్ కృదంతాన్ని సహజమైన తెలుగు పూర్వకాలిక నిర్మాణంతో అనువదించాం. గ్రీకులో కర్మ ప్రత్యక్షంగా లేకపోయినా, ముందటి సందర్భంలోని అభిషేక కార్యాన్ని సూచించేందుకు ‘అది’ చేర్చాం.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి కార్యానికి శిష్యుల ప్రతికూల స్పందనను స్వల్ప వ్యత్యాసంతో పరిచయం చేసే కథన సంధిగా ‘అయితే’ సహజంగా సరిపోతుంది.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులు
  rationale: సువార్తల సందర్భంలో μαθηταίకు ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం. గ్రీకులో లేని ‘ఆయన’ను చేర్చలేదు.
- source_word: ἠγανάκτησαν
  choice: కోపంతో
  rationale: ఈ క్రియ బలమైన అసంతృప్తి లేదా ఆగ్రహాన్ని సూచిస్తుంది. ‘కోపంతో’ సాధారణ ఆధునిక తెలుగులో ఆ తీవ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: λέγοντες
  choice: అన్నారు
  rationale: తెలుగులో ప్రత్యక్ష వాక్యాన్ని సహజంగా కలపడానికి కృదంత నిర్మాణాన్ని సమాపక క్రియగా మార్చాం; శిష్యుల ఆగ్రహ స్పందనతో సంబంధం నిలిచింది.
- source_word: Εἰς τί
  choice: ఎందుకు
  rationale: అక్షరార్థంగా ‘ఏ ఉద్దేశానికి?’ అయినా, ఈ సందర్భంలో దాని ప్రశ్నార్థక బలాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఎందుకు’ తెలియజేస్తుంది.
- source_word: ἡ ἀπώλεια αὕτη
  choice: ఇంత వృథా
  rationale: ఖరీదైన సుగంధ తైలాన్ని కుమ్మరించిన సందర్భంలో ἀπώλεια ‘నష్టం/వృథా’ భావాన్ని ఇస్తుంది. ‘ఇంత వృథా’ వారి తీవ్ర అభ్యంతరాన్ని సహజంగా ప్రతిబింబిస్తుంది.
