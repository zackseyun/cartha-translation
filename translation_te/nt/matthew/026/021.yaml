id: MAT.26.21
reference: Matthew 26:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐσθιόντων αὐτῶν εἶπεν· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: te
  text: 'వారు భోజనం చేస్తుండగా ఆయన, “నేను మీతో నిజంగా చెబుతున్నాను: మీలో ఒకడు నన్ను అప్పగిస్తాడు[a]” అని అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భార్థంగా, “నాకు ద్రోహం చేస్తాడు”; మూలపదానికి అక్షరార్థంగా “నన్ను వేరొకరి చేతికి అప్పగిస్తాడు” అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: వారు భోజనం చేస్తుండగా
  rationale: కర్తరి షష్ఠీ స్వతంత్ర ప్రయోగం ప్రధాన క్రియతో సమకాలీనంగా జరుగుతున్న చర్యను సూచిస్తుంది. ఈ తెలుగు రూపం ఆ కాలసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: Ἀμὴν
  choice: నిజంగా
  rationale: యేసు పలుకులకు ముందుగా వచ్చే ఈ పదం గంభీరమైన ధృవీకరణను సూచిస్తుంది. ఆధునిక తెలుగులో ‘నిజంగా’ దాని భావాన్ని సహజంగా అందిస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో ... చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, వర్తమాన కాలంలోని గంభీర ప్రకటనను నిలుపుతూ సహజమైన తెలుగు వాక్యరూపాన్ని ఉపయోగించింది.
- source_word: εἷς ἐξ ὑμῶν
  choice: మీలో ఒకడు
  rationale: సమూహంలో ఒకరిని సూచించే భాగార్థక ప్రయోగానికి ఇది స్పష్టమైన, సహజమైన తెలుగు అనువాదం.
- source_word: παραδώσει
  choice: అప్పగిస్తాడు
  rationale: ఈ క్రియ యొక్క ప్రాథమిక భావమైన ‘వేరొకరి చేతికి అప్పగించడం’ను నిలుపుతుంది. సందర్భంలో ఉన్న ద్రోహభావాన్ని చెరపకుండా, క్రియకే ‘ద్రోహం చేయడం’ అనే మరింత సంకుచిత అర్థాన్ని తప్పనిసరిగా మోపదు; భవిష్యత్ కాలాన్ని కూడా నిలుపుతుంది.
- source_word: με
  choice: నన్ను
  rationale: యేసును సూచించే ప్రత్యక్ష కర్మ సర్వనామాన్ని యథాతథంగా అందిస్తుంది.
theological_decisions:
- issue: యాతనావృత్తాంత సందర్భంలో παραδώσει అనువాదం
  choice: నన్ను అప్పగిస్తాడు
  alternative: నాకు ద్రోహం చేస్తాడు; నన్ను పట్టిస్తాడు
  rationale: గ్రీకు క్రియకు ‘అప్పగించడం’ అనే విస్తృత భావం ఉంది; ఈ సందర్భంలో ఆ చర్య ద్రోహపూరితమైనదే అయినా, ‘అప్పగిస్తాడు’ అనేది చర్యను నేరుగా వ్యక్తం చేసి మూలంలోని అర్థవిస్తృతిని కాపాడుతుంది. పాఠకునికి సందర్భార్థం తెలియజేయడానికి పాదసూచికను ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రత్యక్ష వాక్యరచనను ఉపయోగించాం. ‘భోజనం చేస్తుండగా’ సమకాలీన చర్యను స్పష్టంగా చూపుతుంది; ‘నిజంగా’ గంభీర ధృవీకరణను సాధారణ పాఠకునికి అర్థమయ్యేలా అందిస్తుంది.
