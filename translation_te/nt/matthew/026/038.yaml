id: MAT.26.38
reference: Matthew 26:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: te
  text: 'అప్పుడు ఆయన వారితో ఇలా అంటాడు: “నా ప్రాణం మరణం వరకూ తీవ్ర దుఃఖంతో నిండిపోయింది.[a][b] మీరు ఇక్కడే ఉండి, నాతో కలిసి మెలకువగా ఉండండి.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎంతో దుఃఖంగా ఉంది,” “తీవ్ర శోకంలో ఉంది,” లేదా “దుఃఖంతో కుంగిపోయింది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “చనిపోయేంతగా,” లేదా “మరణపు అంచు వరకు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నాతో కలిసి జాగరూకులై ఉండండి,” లేదా “నాతో కలిసి కాపలా కాయండి.” గ్రీకు పదం నిద్రపోకుండా మెలకువగా ఉండడం, అప్రమత్తంగా కనిపెట్టుకొని ఉండడం—ఈ రెండు భావాలనూ సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: తర్వాతి సంఘటనను పరిచయం చేసే సహజమైన కాలసూచక పదం; కథన ప్రవాహాన్ని నిలుపుతుంది.
- source_word: λέγει
  choice: అంటాడు
  rationale: మూలంలోని చారిత్రక వర్తమాన కాలాన్ని నిలిపి, కథనానికి సజీవతను ఇస్తుంది.
- source_word: αὐτοῖς
  choice: వారితో
  rationale: λέγει తరువాత వచ్చిన పరోక్ష కర్మను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Περίλυπός
  choice: తీవ్ర దుఃఖంతో నిండిపోయింది
  rationale: ఈ పదం సూచించే అత్యంత గాఢమైన శోకాన్ని ఆధునిక, సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ ψυχή μου
  choice: నా ప్రాణం
  rationale: ψυχή అనే స్పష్టమైన నామవాచకాన్ని కేవలం ‘నేను’గా మార్చకుండా నిలుపుతూ, యేసు అంతరంగ వేదనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἕως θανάτου
  choice: మరణం వరకూ
  rationale: శోకం మరణపు అంచు వరకు చేరినంత తీవ్రమైనదనే భావాన్ని, మూలంలోని సంక్షిప్తత మరియు కొంత భావసందిగ్ధతతో సహా నిలుపుతుంది.
- source_word: μείνατε ὧδε
  choice: మీరు ఇక్కడే ఉండి
  rationale: ఆ స్థలంలోనే ఉండాలనే ఆజ్ఞను స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: γρηγορεῖτε
  choice: మెలకువగా ఉండండి
  rationale: గెత్సేమనే సందర్భంలో నిద్రపోకుండా ఉండడమనే ప్రత్యక్ష భావాన్ని ముందుకు తెస్తుంది; జాగరూకత అనే విస్తృత భావాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: μετ’ ἐμοῦ
  choice: నాతో కలిసి
  rationale: సహవాసాన్ని సూచించే μετά యొక్క భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసు మాటలో ψυχή ను అనువదించడం
  choice: నా ప్రాణం
  alternative: నేను తీవ్ర దుఃఖంలో ఉన్నాను
  rationale: మూలంలోని ψυχή అనే నామవాచకాన్ని తొలగించకుండా యేసు నిజమైన మానవ అంతరంగ వేదనను నిలుపుతుంది; అయితే మానవ స్వభావంపై పాఠ్యంలో లేని సాంకేతిక సిద్ధాంతాన్ని చేర్చదు.
- issue: γρηγορεῖτε యొక్క సందర్భార్థం
  choice: మెలకువగా ఉండండి
  alternative: జాగరూకులై ఉండండి; కాపలా కాయండి
  rationale: ఇక్కడ శిష్యులు నిద్రపోకుండా యేసుతో ఉండాలనే తక్షణ సందర్భానికి ఇది సరిపోతుంది; అదే పదంలో ఉన్న అప్రమత్తత భావాన్ని పాదటిప్పణి ద్వారా సంరక్షిస్తుంది.
- issue: ἕως θανάτου యొక్క పరిధి
  choice: మరణం వరకూ
  alternative: చనిపోయేంతగా; మరణపు అంచు వరకు
  rationale: ఈ పదబంధం మరణం వరకు కొనసాగడాన్నా, మరణం సంభవించేంత తీవ్రతనైనా సూచించగలదు. ప్రధాన పాఠ్యం మూలరూపానికి దగ్గరగా ఉండగా, ప్రత్యామ్నాయ భావం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరత కలిగిన శైలి వాడబడింది. మూలంలోని చారిత్రక వర్తమాన కాలాన్ని ‘అంటాడు’గా నిలిపాం. ‘నా ప్రాణం’ అనే రూపం ψυχή ను స్పష్టంగా ఉంచుతుంది; ‘మరణం వరకూ’ మరియు ‘మెలకువగా ఉండండి’ వద్ద ఉన్న భావ విస్తృతిని పాదటిప్పణుల్లో సంరక్షించాం.
