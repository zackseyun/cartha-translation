id: MAT.26.10
reference: Matthew 26:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: te
  text: అయితే యేసు ఇది తెలుసుకొని వారితో, “ఈ స్త్రీని ఎందుకు ఇబ్బంది పెడుతున్నారు? ఆమె నా పట్ల ఒక మంచి కార్యం చేసింది.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: ఇది తెలుసుకొని
  rationale: γινώσκω యొక్క భూతకాల కృదంత రూపం ప్రధాన క్రియకు ముందు సందర్భసూచకంగా ఉంది. సందర్భంలోని శిష్యుల విమర్శను సూచించే అంతర్లీన కర్మను ‘ఇది’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: δέ స్వల్ప వ్యత్యాసాన్ని లేదా కథన మలుపును సూచిస్తుంది; శిష్యుల అభ్యంతరం నుంచి యేసు ఇచ్చిన సవరణాత్మక జవాబుకు ‘అయితే’ సహజంగా సరిపోతుంది.
- source_word: Τί κόπους παρέχετε
  choice: ఎందుకు ఇబ్బంది పెడుతున్నారు?
  rationale: κόπους παρέχετε అనే ప్రయోగం కష్టం, బాధ లేదా ఇబ్బంది కలిగించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఇబ్బంది పెట్టడం’ సహజంగా ఉండి మందలింపు భావాన్ని నిలుపుతుంది.
- source_word: τῇ γυναικί
  choice: ఈ స్త్రీని
  rationale: παρέχωతో వచ్చిన దత్తి విభక్తి ప్రభావిత వ్యక్తిని సూచిస్తుంది. తెలుగు క్రియాప్రయోగంలో ‘ఈ స్త్రీని ఇబ్బంది పెట్టడం’ సహజం; సందర్భంలో ఆమె ప్రత్యక్షంగా ఉన్నందున ‘ఈ’ సముచితం.
- source_word: ἔργον καλὸν
  choice: ఒక మంచి కార్యం
  rationale: καλός ఇక్కడ మంచి, ప్రశంసనీయం, తగినది అనే భావాలను కలిగి ఉంది. ‘మంచి కార్యం’ సహజమైన, గౌరవప్రదమైన తెలుగు; అనవసర సిద్ధాంతార్థాన్ని చేర్చదు.
- source_word: ἠργάσατο
  choice: చేసింది
  rationale: పూర్తయిన చర్యను సూచించే ఆఓరిస్ట్ మధ్యమ రూపానికి తెలుగులో సాధారణ భూతకాలమైన ‘చేసింది’ సహజంగా సరిపోతుంది.
- source_word: εἰς ἐμέ
  choice: నా పట్ల
  rationale: εἰς వ్యక్తితో వచ్చినప్పుడు దిశను లేదా సంబంధాన్ని సూచించగలదు. ‘నా పట్ల’ మూలంలోని దిశాత్మక-సంబంధ భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: స్త్రీ చేసిన కార్యంపై యేసు ఇచ్చిన అంచనా
  choice: ఒక మంచి కార్యం
  alternative: ఒక సుందరమైన కార్యం / ఒక ప్రశంసనీయమైన పని
  rationale: వచనం ఆమె చర్యను సానుకూలంగా, ప్రశంసనీయంగా అంచనా వేస్తుంది. ‘మంచి కార్యం’ καλόν యొక్క నైతిక-యోగ్య భావాన్ని నిలుపుతుంది; అదనపు పుణ్యార్జన లేదా సంస్కార సంబంధ సిద్ధాంతాన్ని దిగుమతి చేయదు.
- issue: εἰς ἐμέ యొక్క సంబంధార్థం
  choice: నా పట్ల
  alternative: నా కోసం
  rationale: ‘నా పట్ల’ దిశాత్మక లేదా సంబంధ భావాన్ని కాపాడుతుంది; ‘నా కోసం’ ప్రయోజనార్థాన్ని మరింత స్పష్టంగా చేస్తుంది. మూలంలో రెండింటికీ అవకాశం ఉన్నందున ప్రధాన పాఠంలో తక్కువగా నిర్ణయాత్మకమైన రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలిలో ఉంది. మూలంలోని సంక్షిప్తతను, యేసు మందలింపు స్వరాన్ని నిలుపుకుంది.
