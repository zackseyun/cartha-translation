translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘యాజకులూ, పెద్దలూ’ అనే జంటలో సహజ ధ్వనిసంధిని ఉపయోగించాం. మూలంలోని స్థలార్థం మరియు క్రియారూపపు సందిగ్ధతలను పాదసూచికల్లో నిలిపాం.
