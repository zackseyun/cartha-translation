- from: అప్పుడు ప్రధాన యాజకులూ, ప్రజల పెద్దలూ కయప అని పిలువబడే ప్రధాన యాజకుని ప్రాంగణంలో[a] సమావేశమయ్యారు[b].
  to: అప్పుడు ప్రధాన యాజకులూ, ప్రజల పెద్దలూ కయఫా అని పిలువబడే ప్రధాన యాజకుని ప్రాంగణంలో[a] సమకూడారు[b].
  rationale: The revision corrects the transliteration of Caiaphas and uses a more direct, natural Telugu expression for the group’s gathering. The location footnote remains anchored to ‘ప్రాంగణంలో,’ and the gathering footnote remains anchored to the verb, preserving the relevant lexical and grammatical information without changing the verse’s meaning.
