id: MAT.26.3
reference: Matthew 26:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε συνήχθησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως τοῦ λεγομένου Καϊάφα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: te
  text: అప్పుడు ప్రధాన యాజకులూ, ప్రజల పెద్దలూ కయఫా అని పిలువబడే ప్రధాన యాజకుని ప్రాంగణంలో[a] సమకూడారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ప్రాంగణం” అనే పదాన్ని “పెద్ద నివాస భవనపు ఆవరణ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “సమకూడారు” అనే క్రియకు గ్రీకులో రూపరీత్యా కర్మణి రూపం ఉంది; “సమావేశమయ్యారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: తదుపరి సంఘటనను పరిచయం చేసే సహజమైన కాలసూచక పదం.
- source_word: συνήχθησαν
  choice: సమావేశమయ్యారు
  rationale: వారంతా ఒకచోట కూడిన భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; గ్రీకు క్రియ రూపరీత్యా కర్మణి రూపమనే విషయాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఒకే ప్రధాన యాజకుని పదవిని సూచించకుండా, యాజక నాయకవర్గాన్ని సూచించే సువార్తల సందర్భానికి ప్రామాణికమైన అనువాదం.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: ప్రజల పెద్దలు
  rationale: ప్రజలలో గుర్తింపు పొందిన నాయకులను సూచించే సహజమైన, సూటి తెలుగు ప్రయోగం.
- source_word: εἰς τὴν αὐλὴν
  choice: ప్రాంగణంలో
  rationale: సమావేశం జరిగిన స్థలాన్ని సహజంగా తెలుపుతుంది; αὐλή పదానికి పెద్ద నివాస భవనపు ఆవరణ అనే విస్తృత అర్థం ఉండగలదని పాదసూచిక తెలియజేస్తుంది.
- source_word: τοῦ ἀρχιερέως
  choice: ప్రధాన యాజకుని
  rationale: ఇక్కడ ఏకవచనంలో ఉన్న అధికార పదవిని స్పష్టంగా సూచిస్తుంది.
- source_word: τοῦ λεγομένου Καϊάφα
  choice: కయప అని పిలువబడే
  rationale: పేరుతో ఆ ప్రధాన యాజకుణ్ణి గుర్తించే గ్రీకు అసమాపక క్రియా నిర్మాణాన్ని సన్నిహితంగా, సహజంగా ప్రతిబింబిస్తుంది.
