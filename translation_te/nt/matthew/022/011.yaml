id: MAT.22.11
reference: Matthew 22:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: te
  text: అయితే రాజు బల్లవద్ద వాలుకొని ఉన్న అతిథులను[a] చూడడానికి లోపలికి వచ్చినప్పుడు, అక్కడ వివాహ వస్త్రం[b] ధరించని ఒక మనిషిని చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో ‘వాలుకొని ఉన్నవారు’ అని ఉంది. ప్రాచీన అధికారిక విందుల్లో అతిథులు బల్లవద్ద వాలుకొని భోజనం చేసేవారు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘వివాహ బట్టలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν δὲ ὁ βασιλεὺς
  choice: అయితే రాజు ... లోపలికి వచ్చినప్పుడు
  rationale: δέ కథనంలో స్వల్ప మలుపును సూచిస్తుంది; కాలసూచక ఉపవాక్యం అఓరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందున్న చర్యను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: θεάσασθαι
  choice: చూడడానికి
  rationale: ఈ మధ్యమ infinitive రాజు లోపలికి రావడానికి గల ఉద్దేశాన్ని సూచిస్తుంది. ‘పరిశీలించడానికి’ అనేది సందర్భంలో సాధ్యమైనా, మూలపదం కంటే అధికారిక తనిఖీ భావాన్ని ఎక్కువ చేయవచ్చు.
- source_word: τοὺς ἀνακειμένους
  choice: భోజనానికి వాలుకొని ఉన్న అతిథులను
  rationale: ἀνάκειμαι ప్రాచీన విందులో బల్లవద్ద ఆనుకొని లేదా వాలుకొని భోజనం చేసే భంగిమను సూచిస్తుంది. ‘అతిథులు’ సందర్భాన్ని స్పష్టం చేస్తుంది; ‘వాలుకొని ఉన్న’ సాంస్కృతిక వివరాన్ని నిలుపుతుంది.
- source_word: εἶδεν ἐκεῖ
  choice: అక్కడ చూశాడు
  rationale: సాధారణ కథన రూపంలో క్రియనూ స్థల సూచననూ నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἄνθρωπον
  choice: ఒక మనిషిని
  rationale: ఇక్కడ ἄνθρωπος ఏకవచన పురుష వ్యక్తిని సూచిస్తుంది; లింగాన్ని తటస్థం చేయకుండా మూలంలోని నిర్దిష్టతను నిలుపుతుంది.
- source_word: οὐκ ἐνδεδυμένον
  choice: ధరించని
  rationale: పర్ఫెక్ట్ కృదంతం ఆ వ్యక్తి అప్పటి స్థితిని వివరిస్తుంది. తెలుగులో ‘ధరించని’ సహజంగాను సంక్షిప్తంగాను ఉంది.
- source_word: ἔνδυμα γάμου
  choice: పెళ్లి వస్త్రం
  rationale: ఏకవచన ἔνδυμαను అలాగే నిలుపుతూ, γάμοςకు సందర్భానుగుణంగా ‘పెళ్లి’ వాడబడింది. ఇది పెళ్లి సందర్భానికి తగిన వస్త్రం అనే భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: విందులో అతిథుల భంగిమ
  choice: వాలుకొని ఉన్న అతిథులు అని సాంస్కృతిక వివరంతో అనువదించడం
  alternative: కేవలం ‘అతిథులు’ లేదా మరింత అక్షరార్థంగా ‘వాలుకొని ఉన్నవారు’
  rationale: ఈ భంగిమ ప్రాచీన అధికారిక విందు ఆచారాన్ని సూచిస్తుంది. సందర్భాన్ని స్పష్టం చేయడానికి ‘అతిథులు’ చేర్చినా, మూలంలోని చారిత్రక వివరాన్ని తొలగించలేదు.
- issue: ἄνθρωπον యొక్క లింగ సూచన
  choice: ఒక మనిషి
  alternative: ఒక వ్యక్తి / ఎవరో ఒకరు
  rationale: ఇది మానవజాతిని సాధారణంగా సూచించడం కాదు; ఉపమాన కథలోని ఏకవచన పురుష పాత్రను సూచిస్తుంది. అందువల్ల మూలంలోని లింగ సూచనను నిలుపుతుంది.
- issue: ἔνδυμα γάμου యొక్క అర్థ పరిధి
  choice: పెళ్లి వస్త్రం
  alternative: పెళ్లి బట్టలు / పెళ్లికి తగిన వస్త్రం
  rationale: మూలంలోని ఏకవచన రూపాన్ని నిలుపుతూ, ఆ వస్త్రాన్ని ఎవరు ఇచ్చారు లేదా ఏ ప్రత్యేక ఆచారం అమలులో ఉందనే వివరణను పాఠ్యంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రాచీన విందు భంగిమను పాఠ్యంలో నిలిపి, పాదసూచికలో వివరించబడింది. ‘పెళ్లి వస్త్రం’ మూలంలోని ఏకవచనాన్ని కాపాడుతుంది; దాని ప్రతీకాత్మక అర్థాన్ని అనువాదం ముందుగానే నిర్ణయించదు.
