translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు మూలంలోని ఆజ్ఞ, నాణెం యొక్క చారిత్రక నిర్దిష్టత, κῆνσος పదంలోని సాధ్యమైన విస్తృతార్థం నిలుపబడ్డాయి.
