  text: ἐπιδείξατέ μοι τὸ νόμισμα τοῦ κήνσου. οἱ δὲ προσήνεγκαν αὐτῷ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/019.yaml
  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: te
  text: “పన్ను[a] చెల్లించడానికి కావలసిన నాణెాన్ని నాకు చూపించండి.” వారు ఆయనకు ఒక దేనారాన్ని తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తలపన్ను” లేదా “జనగణన పన్ను.” κῆνσος అనేది రోమా సామ్రాజ్యపు పన్నును సూచించే పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: నాకు చూపించండి
  rationale: ద్వితీయ పురుష బహువచన ఆజ్ఞారూపంలోని దృశ్య భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τὸ νόμισμα
  choice: నాణెం
  rationale: చలామణిలో ఉన్న నిర్దిష్ట లోహ నాణాన్ని సూచిస్తుంది; తరువాత దానిని దేనారంగా గుర్తించడం వల్ల ‘నాణెం’ స్పష్టంగా ఉంటుంది.
- source_word: τοῦ κήνσου
  choice: పన్ను చెల్లించడానికి ఉపయోగించే
  rationale: సంబంధ విభక్తి ఇక్కడ పన్నుతో సంబంధమున్న నాణాన్ని సూచిస్తుంది. ఈ సహజ తెలుగు రూపం నాణెం ఏ ప్రయోజనానికి సంబంధించినదో తెలియజేస్తూ, ప్రధాన పాఠ్యంలో పన్ను రకాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: προσήνεγκαν
  choice: ఆయన దగ్గరికి తీసుకొచ్చారు
  rationale: προσφέρω యొక్క సందర్భానుగుణ దిశాత్మక భావాన్ని సహజమైన కథన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δηνάριον
  choice: ఒక దేనారాన్ని
  rationale: చారిత్రకంగా నిర్దిష్టమైన రోమా నాణెం పేరును లిప్యంతరీకరించి నిలుపుతుంది.
