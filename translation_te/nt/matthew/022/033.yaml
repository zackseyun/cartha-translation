  yaml_path: translation/nt/matthew/022/033.yaml
  text: And when the crowds heard it[a], they were astonished at his teaching.
translation:
  language: te
  text: మరియు జనసమూహాలు అది విన్నప్పుడు[a], ఆయన బోధకు ఆశ్చర్యపోయాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇది విన్న తర్వాత’; మరింత అక్షరార్థంగా, ‘విని’.
    reason: ἀκούσαντες అనే కృదంతం కాలసంబంధాన్ని పలువిధాలుగా సహజంగా వ్యక్తపరచవచ్చు; మూలంలో వినబడిన దానికి ప్రత్యేక కర్మ లేదు.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: అది విన్నప్పుడు
  rationale: కాలసంబంధాన్ని తెలిపే భూతకాల కృదంతాన్ని సహజమైన ఆధునిక తెలుగులో కాలవాచక ఉపవాక్యంగా అనువదించాం. గ్రీకులో కర్మ స్పష్టంగా లేకపోయినా, సందర్భంలోని యేసు సమాధానాన్ని సూచించేలా ‘అది’ చేర్చాం.
- source_word: οἱ ὄχλοι
  choice: జనసమూహాలు
  rationale: మూలంలోని నిర్దిష్ట బహువచన రూపాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఉండే పదాన్ని ఎంచుకున్నాం.
- source_word: ἐξεπλήσσοντο
  choice: ఆశ్చర్యపోయాయి
  rationale: వారి బలమైన ప్రతిస్పందనను సహజంగా తెలియజేస్తుంది; అసంపూర్ణ భూతకాల రూపంలోని దృశ్యాత్మక ప్రతిస్పందనను సందర్భం తగినంతగా వ్యక్తపరుస్తుంది.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: ఆయన బోధకు
  rationale: ἐπί + దత్తివు ఇక్కడ ఆశ్చర్యానికి ఆధారం లేదా సందర్భాన్ని సూచిస్తుంది. ‘బోధకు’ అనేది తెలుగులో సంక్షిప్తంగా, సహజంగా ఉంది; సాంకేతికంగా వినిపించే ‘సిద్ధాంతం’ను నివారిస్తుంది.
- source_word: καὶ
  choice: ''
  rationale: ఈ వాక్యం ముందటి సంఘటనకు అనుసంధానమైనప్పటికీ, ఒంటరి వచనంగా ఆధునిక తెలుగులో వాక్యారంభ ‘మరియు’ అసహజంగా ఉంటుంది; కథన అనుసంధానం సందర్భం ద్వారా స్పష్టంగా ఉంటుంది.
