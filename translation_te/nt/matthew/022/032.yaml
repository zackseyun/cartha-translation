id: MAT.22.32
reference: Matthew 22:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: te
  text: “నేను అబ్రాహాము దేవుణ్ణి, ఇస్సాకు దేవుణ్ణి, యాకోబు దేవుణ్ణి.” దేవుడు మృతుల దేవుడు కాదు, సజీవుల దేవుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: నేను … దేవుణ్ణి
  rationale: వర్తమానకాల స్వీయ పరిచయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, యేసు ఉటంకించిన వాక్యంలోని వర్తమాన భావాన్ని నిలుపుతుంది.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: అబ్రాహాము దేవుణ్ణి, ఇస్సాకు దేవుణ్ణి, యాకోబు దేవుణ్ణి
  rationale: గ్రీకులో ప్రతి పితరుని పేరుతో ‘దేవుడు’ అనే పదం పునరావృతమవుతుంది; ఆ అలంకార బలాన్ని తెలుగులోనూ కుదించకుండా నిలిపాం.
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: దేవుడు … దేవుడు కాదు
  rationale: గ్రీకు వాక్యంలో ‘దేవుడు’ స్పష్టంగా ఉన్నందున దాన్ని సర్వనామంగా మార్చకుండా పునరావృతం చేశాం; ఇది తెలుగులో సహజంగానే ఉంది.
- source_word: νεκρῶν
  choice: మృతుల
  rationale: నామవాచకంగా వాడిన బహువచన విశేషణాన్ని సంక్షిప్తంగా, గంభీరంగా ‘మృతులు’ అని అనువదించాం.
- source_word: ζώντων
  choice: సజీవుల
  rationale: ‘మృతుల’తో ఉన్న సంక్షిప్త వ్యత్యాసాన్ని నిలుపుతూ, జీవించి ఉన్నవారిని సూచించే నామవాచక రూపంగా అనువదించాం.
theological_decisions:
- issue: పితరులు దేవుని ఎదుట జీవించి ఉన్నారనే భావం మరియు పునరుత్థానం గురించి యేసు చేస్తున్న వాదన
  choice: మూలంలోని ‘మృతులు—సజీవులు’ అనే వ్యత్యాసాన్ని మాత్రమే నేరుగా అనువదించడం
  alternative: ‘దేవుని దృష్టిలో ఇంకా జీవిస్తున్నవారు’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: వాక్యం సూచించే సిద్ధాంతపరమైన బలాన్ని నిలుపుతూనే, పునరుత్థానం లేదా మధ్యస్థితి గురించి మూలంలో లేని వివరణను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే లేఖనోచిత గౌరవభావంతో రూపొందించబడింది. గ్రీకులోని ఉద్దేశపూర్వక పునరుక్తిని నిలిపాం.
