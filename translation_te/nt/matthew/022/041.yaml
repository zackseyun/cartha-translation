  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. తరువాతి వచనంలోని ప్రత్యక్ష ప్రశ్నకు ఈ వాక్యం పరిచయంగా నిలుస్తుంది కాబట్టి చివర ద్విబిందువు వాడబడింది.
