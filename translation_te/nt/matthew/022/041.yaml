  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: te
  text: 'పరిసయ్యులు సమకూడి ఉన్నప్పుడు, యేసు వారిని ఇలా అడిగాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: సమకూడి ఉన్నప్పుడు
  rationale: συνάγω క్రియకు చెందిన ఈ షష్ఠీ విభక్తి కృదంత నిర్మాణం నేపథ్య పరిస్థితిని సూచిస్తుంది. ‘సమకూడి ఉన్నప్పుడు’ అనేది వారు ఒకచోట కూడి ఉన్నారనే సామూహిక భావాన్నీ, ప్రధాన క్రియతో దాని సమకాలిక సంబంధాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప సంధానాన్ని లేదా కథన పురోగతిని సూచిస్తుంది; బలమైన వ్యతిరేకతను కాదు. తెలుగు ఉపవాక్య నిర్మాణంలో ఆ అనుసంధానం సహజంగానే వ్యక్తమవుతుంది కాబట్టి ‘అయితే’ లేదా ‘ఇప్పుడు’ చేర్చలేదు.
- source_word: τῶν Φαρισαίων
  choice: పరిసయ్యులు
  rationale: Φαρισαῖοι అనే సమూహనామానికి ఆధునిక ప్రామాణిక తెలుగు రూపం. గ్రీకు షష్ఠీ రూపం genitive absolute నిర్మాణంలో భాగం; తెలుగులో ఇది కర్తృరూపంతో సహజంగా వ్యక్తమవుతుంది.
- source_word: ἐπηρώτησεν
  choice: అడిగాడు
  rationale: ఈ సందర్భంలో ἐπερωτάω యేసు ప్రశ్న వేయడాన్ని సూచిస్తుంది. ‘అడిగాడు’ సహజమైన ఆధునిక తెలుగు; ‘ప్రశ్నించాడు’ అనవసరంగా విచారణాత్మక లేదా ప్రతికూల ఛాయ ఇవ్వవచ్చు.
- source_word: αὐτοὺς
  choice: వారిని
  rationale: ఈ ప్రత్యక్ష కర్మ సర్వనామం ముందే ప్రస్తావించిన పరిసయ్యులను సూచిస్తుంది.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: వ్యక్తినామాన్ని తెలుగులో సహజంగా నిర్దేశక పదం లేకుండా ఇచ్చాం.
