id: MAT.22.18
reference: Matthew 22:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: te
  text: అయితే యేసు వారి దురుద్దేశాన్ని గ్రహించి, “కపటులారా, నన్నెందుకు పరీక్షిస్తున్నారు[a]?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్నెందుకు శోధిస్తున్నారు?” గ్రీకు క్రియ సందర్భాన్ని బట్టి “పరీక్షించు,” “ప్రయత్నించు,” లేదా “శోధించు” అనే అర్థాలను ఇవ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: గ్రహించి
  rationale: యేసు వారి అంతర్గత ఉద్దేశాన్ని తెలుసుకున్నాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రధాన క్రియకు ముందున్న సందర్భసూచక భూతకృదంత భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి మోసపూరిత సంభాషణకు యేసు స్పందనను స్వల్ప వ్యతిరేకతతో అనుసంధానిస్తుంది.
- source_word: πονηρίαν
  choice: దురుద్దేశాన్ని
  rationale: ఈ సందర్భంలో సాధారణ దుష్టత్వం కంటే ప్రశ్న వెనుకనున్న హానికరమైన ఉద్దేశమే ప్రధానంగా ఉంది; అందువల్ల సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: εἶπεν
  choice: అని అడిగాడు
  rationale: మూలంలో సాధారణంగా ‘అన్నాడు’ అనే క్రియ ఉన్నా, దాని వెంట ప్రత్యక్ష ప్రశ్న ఉన్నందున తెలుగులో ‘అని అడిగాడు’ సహజంగా ఉంటుంది.
- source_word: Τί
  choice: ఎందుకు
  rationale: క్రియతో కలిసిన τί ఇక్కడ కారణాన్ని ప్రశ్నిస్తుంది; తెలుగులో ‘ఎందుకు’ సహజమైన సమానం.
- source_word: πειράζετε
  choice: పరీక్షిస్తున్నారు
  rationale: πειράζωలోని పరీక్షించడం, ప్రయత్నించి చిక్కులో పెట్టడం అనే సందర్భార్థాన్ని నిలుపుతుంది; ‘శోధించడం’ అనే ప్రత్యామ్నాయం నైతిక ప్రలోభ భావాన్ని ఎక్కువగా సూచించవచ్చు.
- source_word: ὑποκριταί
  choice: వేషధారులారా
  rationale: బయటకు నిజాయితీగా నటిస్తూ లోపల విరుద్ధ ఉద్దేశం కలిగిన వారిని సూచించే మూలపద భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు ప్రత్యర్థుల అంతర్గత ఉద్దేశాన్ని గ్రహించడం
  choice: వారి దురుద్దేశాన్ని గ్రహించి
  alternative: వారి దుష్టత్వాన్ని తెలుసుకొని / వారి కపటాన్ని గుర్తించి
  rationale: వారి ప్రశ్న వెనుకనున్న నైతికంగా చెడ్డ ఉద్దేశాన్ని యేసు సరిగ్గా గ్రహించాడని వాక్యం చెబుతుంది; దీనిని విస్తృతమైన సిద్ధాంత ప్రకటనగా మార్చకుండా మూలపాఠ పరిమితిలోనే ఉంచుతుంది.
- issue: πειράζετε అనే క్రియలోని పరీక్ష/శోధన అర్థభేదం
  choice: పరీక్షిస్తున్నారు
  alternative: శోధిస్తున్నారు
  rationale: ఈ సందర్భంలో వారు యేసును చిక్కులో పెట్టడానికి ప్రశ్నిస్తున్నారు. ‘పరీక్షిస్తున్నారు’ ఆ సందర్భాన్ని సహజంగా తెలియజేస్తూనే, మూలపదంలోని విస్తృత అర్థాన్ని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘వేషధారులారా’ నేరుగా సంబోధించే బహువచన రూపం. ఆంగ్ల పాదసూచిక a యేసు పేరుకు తగని స్థానంలో ఉన్నట్లు కనిపించినందున, πονηρίανకు సంబంధించిన భావాన్ని ప్రధాన అనువాదంలో ‘దురుద్దేశం’గా స్పష్టంగా ఇచ్చి అనవసర పాదసూచికను చేర్చలేదు; పాదసూచిక గుర్తు [a]ను πειράζετε వద్ద ఉంచాం.
