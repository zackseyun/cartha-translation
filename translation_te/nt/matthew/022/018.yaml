review_pass:
  verdict: revise
  source_fidelity: ‘దురుద్దేశాన్ని గ్రహించి’ accurately represents γνοὺς ... τὴν πονηρίαν αὐτῶν in context, and ‘నన్నెందుకు పరీక్షిస్తున్నారు?’ appropriately renders the idiomatic Τί με πειράζετε. However, εἶπεν is ‘said,’ not specifically ‘asked’; Telugu can preserve the direct question while retaining the narrative verb as ‘అన్నాడు.’
  naturalness: The sentence is clear and modern. ‘కపటులారా’ is the normal, direct modern Telugu equivalent of ὑποκριταί in this moral context; ‘వేషధారులారా’ can suggest literal costumed persons and is less idiomatic here.
  terminology: Retain ‘దురుద్దేశం’ for πονηρία in this setting. Replace ‘వేషధారులు’ with ‘కపటులు.’ The footnote correctly preserves the semantic range of πειράζω, with wording adjusted for smooth Telugu.
  issues:
  - severity: medium
    issue: ‘అని అడిగాడు’ narrows εἶπεν (‘he said’) to ‘he asked.’
    rationale: Although Jesus’ words are phrased as a question, the Greek narrative verb is εἶπεν, not a verb of asking. ‘అన్నాడు’ is both natural and source-faithful.
  - severity: medium
    issue: ‘వేషధారులారా’ is not the best contextual rendering of ὑποκριταί.
    rationale: The Greek denotes hypocrites—those feigning sincerity—not primarily people wearing a disguise or costume. ‘కపటులారా’ is standard, natural Telugu and preserves the ethical force.
  revised_text: అయితే యేసు వారి దురుద్దేశాన్ని గ్రహించి, “కపటులారా, నన్నెందుకు పరీక్షిస్తున్నారు[a]?” అన్నాడు.
