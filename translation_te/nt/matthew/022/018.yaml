revisions:
- from: అయితే యేసు వారి దురుద్దేశాన్ని గ్రహించి, “వేషధారులారా, నన్నెందుకు పరీక్షిస్తున్నారు[a]?” అని అడిగాడు.
  to: అయితే యేసు వారి దురుద్దేశాన్ని గ్రహించి, “కపటులారా, నన్నెందుకు పరీక్షిస్తున్నారు[a]?” అన్నాడు.
  rationale: The revision preserves the draft’s accurate contextual sense for πονηρία and πειράζω, while restoring the broader force of εἶπεν with ‘అన్నాడు’ and using the established contextual equivalent ‘కపటులారా’ for ὑποκριταί. The footnote remains anchored to πειράζετε and retains the lexical ambiguity without imposing a theological interpretation.
  reviewer_model: gpt-5.6-terra
