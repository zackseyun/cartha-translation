id: MAT.22.6
reference: Matthew 22:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his servants, mistreated them and killed them.
translation:
  language: te
  text: అయితే మిగతావారు అతని దాసులను[a] పట్టుకొని, వారితో దుర్వ్యవహారం చేసి, వారిని చంపేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సేవకులను’.
    reason: δοῦλος అనే గ్రీకు పదానికి సందర్భాన్ని బట్టి ‘దాసుడు’ లేదా ‘సేవకుడు’ అనే అర్థం ఉండవచ్చు.
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: అయితే మిగిలినవారు
  rationale: λοιποί ఇంతకు ముందు పేర్కొన్న ఆహ్వానితులలో మిగిలినవారిని సూచిస్తుంది; δέ ఇక్కడ స్వల్పమైన వ్యతిరేక భావాన్ని చూపుతుంది.
- source_word: κρατήσαντες
  choice: పట్టుకొని
  rationale: అరిస్టు కృదంతం ప్రధాన క్రియలకు ముందు జరిగిన చర్యను సూచిస్తుంది; తెలుగు వరుసక్రియా నిర్మాణం ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς δούλους αὐτοῦ
  choice: అతని దాసులను
  rationale: δοῦλος సేవకుడు లేదా దాసుడు అనే అర్థాలను కలిగి ఉంటుంది. రాజుకు చెందిన ప్రతినిధుల సందర్భంలో ‘దాసులు’ వారి ఆధీన స్థితిని స్పష్టంగా ఉంచుతుంది; సహజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ὕβρισαν
  choice: వారితో దుర్మార్గంగా ప్రవర్తించి
  rationale: ὑβρίζω కేవలం మాటలతో అవమానించడమే కాకుండా అవమానకరమైన, దౌర్జన్యపూరితమైన దుర్వ్యవహారాన్ని కూడా సూచిస్తుంది. ఈ తెలుగు పదబంధం ఆ విస్తృత భావాన్ని అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
- source_word: ἀπέκτειναν
  choice: వారిని చంపేశారు
  rationale: ἀποκτείνωకు ఇది సూటిగా, ఆధునిక తెలుగులో సహజంగా ఉండే అనువాదం; ‘హత్య చేశారు’ అనడం ద్వారా మూల క్రియలో స్పష్టంగా లేని న్యాయపరమైన ఛాయను జోడించలేదు.
theological_decisions:
- issue: ఉపమాన సందర్భంలో δοῦλος అనువాదం
  choice: దాసులు
  alternative: సేవకులు
  rationale: ఇక్కడ వారు రాజుకు ఆధీనులైన ప్రతినిధులు. ‘దాసులు’ సామాజిక వాస్తవాన్ని నిలుపుతుంది; ‘సేవకులు’ కూడా సందర్భానుకూలమైన భావసాధ్యత కాబట్టి పాదటిప్పణిలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పట్టుకొని … ప్రవర్తించి … చంపేశారు’ అనే వరుసక్రియా నిర్మాణం గ్రీకు కృదంతం మరియు ప్రధాన క్రియల క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
