revisions:
- from: అయితే మిగిలినవారు అతని దాసులను[a] పట్టుకొని, వారితో దుర్మార్గంగా ప్రవర్తించి, వారిని చంపేశారు.
  to: అయితే మిగతావారు అతని దాసులను[a] పట్టుకొని, వారితో దుర్వ్యవహారం చేసి, వారిని చంపేశారు.
  rationale: The revision makes the abusive force of ὕβρισαν explicit, improves idiomatic Telugu for οἱ λοιποί, and otherwise preserves the source sequence, ambiguity, register, and the existing lexical alternative for δοῦλος.
