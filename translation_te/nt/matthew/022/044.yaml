  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: te
  text: '“ప్రభువు నా ప్రభువుతో ఇలా అన్నాడు: ‘నేను నీ శత్రువులను నీ పాదాల కింద ఉంచేవరకు నా కుడివైపున కూర్చో’[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కీర్తన 110:1లోని హెబ్రీ నుడికారాన్ని అనుసరించి, “నేను నీ శత్రువులను నీ పాదాలకు పాదపీఠముగా చేసేవరకు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: అన్నాడు
  rationale: సాధారణమైన λέγω క్రియకు సహజమైన ఆధునిక తెలుగు రూపం; సందర్భంలోని ప్రత్యక్ష ఉల్లేఖనానికి సరిపోతుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: రెండు చోట్లా గ్రీకు మూలంలో ఒకే κύριος పదం ఉంది. అందువల్ల మొదటి సూచన దేవునికీ, రెండవది దావీదు ప్రభువుకీ అయినప్పటికీ ఒకే తెలుగు బిరుదును నిలిపి ఉంచాం.
- source_word: τῷ κυρίῳ μου
  choice: నా ప్రభువుతో
  rationale: దాతృవిభక్తి ఇక్కడ మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో సూచిస్తుంది. తెలుగులో ‘అతనితో అన్నాడు’ అనే నిర్మాణం సహజంగా ఉండి, ‘నా’ అనే సంబంధాన్ని కాపాడుతుంది.
- source_word: Κάθου
  choice: కూర్చో
  rationale: κάθημαι యొక్క ఆజ్ఞార్థక రూపాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది; ఇది గౌరవస్థానంలో ఆసీనుడవ్వాలనే భావాన్ని సందర్భం ద్వారా అందిస్తుంది.
- source_word: ἐκ δεξιῶν μου
  choice: నా కుడివైపున
  rationale: అధికారమూ గౌరవమూ గల స్థానాన్ని సూచించే గ్రీకు నుడికారానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: ἕως ἂν θῶ
  choice: నేను … ఉంచేవరకు
  rationale: భవిష్యత్తులో నెరవేరబోయే చర్య వరకు కొనసాగే స్థితిని సహజమైన తెలుగు కాలనిర్మాణంతో తెలియజేస్తుంది.
- source_word: τοὺς ἐχθρούς σου
  choice: నీ శత్రువులను
  rationale: స్పష్టమైన, సాధారణ ఆధునిక తెలుగు పదప్రయోగం.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: నీ పాదాల కింద
  rationale: మత్తయిలోని గ్రీకు పదబంధం చెప్పే స్థానార్థాన్ని నేరుగా నిలుపుతుంది; హెబ్రీ కీర్తనలోని ‘పాదపీఠం’ రూపకాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయదు.
theological_decisions:
- issue: కీర్తన 110:1 ఉల్లేఖనంలో రెండుసార్లు వచ్చిన κύριος
  choice: ప్రభువు నా ప్రభువుతో
  alternative: యెహోవా నా ప్రభువుతో / ప్రభువు నా యజమానితో
  rationale: గ్రీకు పాఠ్యం ఇద్దరికీ ఒకే బిరుదైన κύριος వాడుతుంది. ‘యెహోవా’ అనేది అంతర్లీన హెబ్రీ దైవనామాన్ని స్పష్టం చేస్తుంది గాని గ్రీకు రూపంలోని సమాన బిరుదును మార్చుతుంది; ‘యజమాని’ రెండవ κύριος యొక్క భావగాంభీర్యాన్ని తగ్గించవచ్చు. ఒకే బిరుదును వాడటం మూలంలోని సంబంధాన్నీ యేసు వాదనలోని ఉద్రిక్తతనూ కాపాడుతుంది.
- issue: వచనం చివర ప్రశ్నగా ఉండటం
  choice: అని దావీదు చెప్పాడు కదా?
  alternative: ఉల్లేఖనాన్ని మాత్రమే ప్రశ్నార్థక చిహ్నంతో ముగించడం
  rationale: గ్రీకు పాఠ్యంలో ఈ ఉల్లేఖనం ముందరి వచనంలో మొదలైన యేసు ప్రశ్నలో భాగం. తెలుగులో వచనాన్ని ఒంటరిగా చదివినప్పటికీ ప్రశ్న స్వభావం స్పష్టంగా ఉండేందుకు కనిష్ఠ సందర్భాన్ని పునరుద్ధరించాం; దావీదు అనే కర్త 43వ వచనం నుండి వస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్యనిర్మాణం. ‘పాదాలు’ అనే రూపం గౌరవపూర్వక బైబిలు సందర్భానికి అనుకూలంగా ఎంచుకోబడింది.
