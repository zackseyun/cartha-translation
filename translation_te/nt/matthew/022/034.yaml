  yaml_path: translation/nt/matthew/022/034.yaml
  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: te
  text: అయితే, ఆయన సద్దూకయ్యులను నోరెత్తకుండా చేశాడని[a] పరిసయ్యులు విని, ఒకచోట సమావేశమయ్యారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత పదశఃగా, “సద్దూకయ్యుల మూతికి ముసుగు వేశాడని.” గ్రీకు క్రియకు జంతువు మూతికి ముసుగు వేయడం అనే అర్థం ఉంది; ఇక్కడ వాదనలో వారిని నోరెత్తకుండా చేయడాన్ని రూపకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి సంభాషణకు అనుసంధానంగా స్వల్ప కథన మలుపు లేదా వ్యత్యాసాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూద మతవర్గానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: ἀκούσαντες
  choice: విని
  rationale: అయోరిస్ట్ కృదంతంలోని కాలసంబంధ భావాన్ని సహజమైన తెలుగు పూర్వకాలిక క్రియతో వ్యక్తం చేస్తుంది.
- source_word: ἐφίμωσεν
  choice: నోరెత్తకుండా చేశాడు
  rationale: మూల క్రియలోని ‘మూతికి చిక్కం వేయడం’ అనే బలమైన రూపకాన్ని పదశః కాకుండా, వాదనలో సమాధానం చెప్పలేని స్థితికి తెచ్చాడనే సందర్భార్థంతో సహజంగా తెలియజేస్తుంది; పదశః రూపకాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: Σαδδουκαίους
  choice: సద్దూకయ్యులను
  rationale: ఈ యూద మతవర్గానికి తెలుగులో సాధారణంగా వాడే లిప్యంతరీకరణ.
- source_word: συνήχθησαν
  choice: సమావేశమయ్యారు
  rationale: రూపానికి కర్మణి అయినా సందర్భంలో స్వయంగా ఒక సమూహంగా కూడారనే అకర్మక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τὸ αὐτό
  choice: ఒకచోట
  rationale: ‘అదే స్థలంలో/కలిసి’ అనే నుడికార భావాన్ని ఉద్దేశాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది; συνήχθησαν తో కలిపి ‘ఒకచోట సమావేశమయ్యారు’ సహజంగా ఉంది.
