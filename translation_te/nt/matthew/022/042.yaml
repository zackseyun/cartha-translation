id: MAT.22.42
reference: Matthew 22:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: te
  text: 'ఇలా అన్నాడు: “మెస్సీయా[a] గురించి మీ అభిప్రాయం ఏమిటి? ఆయన ఎవరి కుమారుడు?” వారు ఆయనకు, “దావీదు కుమారుడు” అని అన్నారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.” గ్రీకు బిరుదు Χριστός (క్రిస్టోస్); ఇక్కడ అది మెస్సీయా అనే భావంలో వాడబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: ఇలా అన్నాడు
  rationale: వర్తమాన కృదంతమైన λέγων తరువాత వచ్చే యేసు మాటలను పరిచయం చేస్తుంది. తెలుగు కథన శైలిలో ‘ఇలా అన్నాడు’ సహజంగా ఉండి మూలంలోని చెప్పడం అనే భావాన్ని నిలుపుతుంది.
- source_word: Τί ὑμῖν δοκεῖ
  choice: మీ అభిప్రాయం ఏమిటి?
  rationale: δοκέω దత్తివిభక్తితో ఇక్కడ ఎదుటివారి అభిప్రాయాన్ని అడుగుతోంది. ఈ రూపం ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: περὶ τοῦ χριστοῦ
  choice: మెస్సీయా గురించి
  rationale: Χριστός ఇక్కడ వ్యక్తిగత పేరులా కాక, యూదుల నిరీక్షణలోని అభిషిక్తుని బిరుదుగా వాడబడింది; అందువల్ల ‘మెస్సీయా’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τίνος υἱός ἐστιν
  choice: ఆయన ఎవరి కుమారుడు?
  rationale: ఇది వంశసంబంధాన్ని అడిగే ప్రత్యక్ష ప్రశ్న. ‘ఆయన’ ముందున్న మెస్సీయాను సూచిస్తూ గౌరవప్రదమైన సహజ తెలుగు ప్రయోగాన్ని ఇస్తుంది.
- source_word: λέγουσιν αὐτῷ
  choice: వారు ఆయనతో … అన్నారు
  rationale: గ్రీకు కథనంలోని చారిత్రక వర్తమానాన్ని తెలుగు కథనానికి సహజమైన భూతకాలంలో ఇచ్చి, αὐτῷ సూచించే సంబంధాన్ని ‘ఆయనతో’గా నిలిపింది.
- source_word: Τοῦ Δαυίδ
  choice: దావీదు కుమారుడు
  rationale: గ్రీకులో ఇది ముందటి ప్రశ్నలోని ‘కుమారుడు’ అనే పదాన్ని అధ్యాహారంగా ఉంచిన సంక్షిప్త షష్ఠీవిభక్తి సమాధానం. తెలుగులో అర్థం సహజంగా పూర్తవడానికి ఆ పదాన్ని పునరుద్ధరించడం అవసరం.
theological_decisions:
- issue: Χριστός పదానికి అనువాదం
  choice: మెస్సీయా
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός ఒక బిరుదుగా, దావీదు వంశానికి సంబంధించిన మెస్సీయా చర్చలో కనిపిస్తుంది. ‘మెస్సీయా’ ఆ బిరుదు భావాన్ని తెలియజేస్తుంది; ‘క్రీస్తు’ అనే సన్నిహిత రూపాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలపద సంబంధం కూడా కనిపిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నోత్తర శైలి వాడబడింది. ‘మెస్సీయా’ను బిరుదుగా ఉంచి, మూలంలోని సంక్షిప్త ‘దావీదుది’ అనే సమాధానాన్ని తెలుగులో స్పష్టత కోసం ‘దావీదు కుమారుడు’గా వ్యక్తం చేశాం.
