  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: te
  text: కాబట్టి, దావీదు అతణ్ణి ‘ప్రభువు’ అని పిలిస్తే[a], అతడు దావీదు కుమారుడు ఎలా అవుతాడు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సందర్భాన్ని మరింత స్పష్టంగా చెప్పాలంటే: “కాబట్టి, దావీదు మెస్సీయను ‘ప్రభువు’ అని పిలిస్తే, మెస్సీయ దావీదు కుమారుడు ఎలా అవుతాడు?”'
    reason: మూలంలోని సర్వనామం మునుపటి సందర్భంలో ఉన్న మెస్సీయను సూచిస్తుంది; ఈ ప్రత్యామ్నాయం ఆ సూచనను స్పష్టంగా చెబుతుంది, కానీ ప్రధాన పాఠ్యంలో లేని నామవాచకాన్ని అక్కడ చేర్చదు.
lexical_decisions:
- source_word: εἰ οὖν
  choice: కాబట్టి … పిలిస్తే
  rationale: εἰ యొక్క షరతు భావాన్నీ, οὖν యొక్క తార్కిక పరిణామ భావాన్నీ సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది; వాదనను ముందే నిశ్చయించిన విషయంగా మార్చదు.
- source_word: Δαυὶδ
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: καλεῖ
  choice: అని పిలిస్తే
  rationale: ఇక్కడ καλέω అంటే ఒకరిని ఒక బిరుదుతో పిలవడం; కీర్తన 110:1లోని సంబోధనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: αὐτὸν
  choice: అతణ్ణి
  rationale: మునుపటి సందర్భంలో ప్రస్తావించిన మెస్సీయను సూచించే కర్మకారక సర్వనామాన్ని నేరుగా నిలుపుతుంది.
- source_word: κύριον
  choice: ‘ప్రభువు’
  rationale: గౌరవార్థకమైనదీ క్రీస్తుసంబంధ ప్రతిధ్వని కలిగినదీ అయిన κύριοςకు సహజమైన తెలుగు సమానార్థకం; ‘యజమాని’ కంటే మూలంలోని ప్రాముఖ్యతను మెరుగ్గా నిలుపుతుంది.
- source_word: πῶς
  choice: ఎలా
  rationale: దావీదు ఆయనను ప్రభువు అని పిలవడానికీ ఆయన దావీదు కుమారుడై ఉండడానికీ మధ్య ఉన్న తార్కిక సంబంధాన్ని ప్రశ్నించే ప్రత్యక్ష, సహజ రూపం.
- source_word: υἱὸς αὐτοῦ
  choice: దావీదు కుమారుడు
  rationale: αὐτοῦ సూచించే దావీదును తెలుగులో స్పష్టంగా పునరుక్తి చేసి, ‘కుమారుడు’ అనే కుటుంబ మరియు రాజవంశ సంబంధ పదాన్ని అలాగే ఉంచుతుంది; ‘వంశస్థుడు’ అని విస్తరించి మూలంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను తగ్గించదు.
- source_word: ἐστιν
  choice: అవుతాడు
  rationale: ‘ఎలా … అవుతాడు?’ అనేది ఈ తార్కిక ప్రశ్నకు సహజమైన తెలుగు రూపం; గ్రీకు వర్తమాన సంబంధార్థాన్ని సందర్భానుగుణంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దావీదు మెస్సీయను ‘ప్రభువు’ అని పిలవడంలోని మెస్సీయ సంబంధమైన, క్రీస్తుసంబంధమైన భావం
  choice: ప్రధాన పాఠ్యంలో ‘ప్రభువు’, ‘దావీదు కుమారుడు’ అనే రెండు భావాలనూ వివరణతో పరిష్కరించకుండా నిలుపడం.
  alternative: “దావీదు మెస్సీయను ‘ప్రభువు’ అని పిలిస్తే, మెస్సీయ దావీదు కుమారుడు ఎలా అవుతాడు?” అని ప్రధాన పాఠ్యంలోనే స్పష్టీకరించడం.
  rationale: ఈ వాక్యపు బలం దావీదు కుమారత్వానికీ ప్రభుత్వానికీ మధ్య యేసు ఉంచిన ప్రశ్నాత్మక ఉద్రిక్తతలో ఉంది. గ్రీకులో ఈ వాక్యంలో ‘మెస్సీయ’ అనే నామవాచకం లేదు; αὐτόν మునుపటి సందర్భం నుంచి తన సూచనను పొందుతుంది. అందువల్ల ప్రధాన పాఠ్యంలో సర్వనామాన్ని ఉంచి, స్పష్టీకరణను పాదసూచికకు పరిమితం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రశ్నారూపం. ‘అతణ్ణి’ సాధారణ వాడుకలో స్పష్టంగా ఉండగా, ‘ప్రభువు’ మరియు ‘కుమారుడు’ మూలంలోని గౌరవార్థక, వంశసంబంధ పదాలను నిలుపుతాయి.
