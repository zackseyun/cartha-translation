id: MAT.22.8
reference: Matthew 22:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: te
  text: 'అప్పుడు అతడు తన సేవకులతో ఇలా అంటాడు: “పెళ్లి విందు సిద్ధంగా ఉంది, కానీ ఆహ్వానించబడినవారు[a] యోగ్యులు కాలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పిలువబడినవారు.” గ్రీకు కృదంతాన్ని మరింత అక్షరార్థంగా ఇలా అనువదించవచ్చు; అయితే ఈ విందు సందర్భంలో అది పెళ్లి విందుకు ఆహ్వానించబడినవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనను సూచించే సహజమైన కాలసూచక పదం.
- source_word: λέγει
  choice: అంటాడు
  rationale: మూలంలోని చారిత్రక వర్తమాన కాలాన్ని నిలుపుతూ కథన సజీవతను కాపాడుతుంది.
- source_word: δούλοις
  choice: సేవకులతో
  rationale: ఈ రాజసభా ఉపమాన సందర్భంలో సహజంగా సరిపోతుంది; బానిసత్వ స్థితిని అనవసరంగా ముందుకు తేవదు.
- source_word: Ὁ μὲν γάμος
  choice: పెళ్లి విందు
  rationale: ఇక్కడ γάμος వివాహ కార్యాన్ని మాత్రమే కాక సిద్ధం చేసిన వివాహ విందును సూచిస్తుంది; μὲν...δὲ వ్యత్యాసం ‘కానీ’ ద్వారా వ్యక్తమైంది.
- source_word: ἕτοιμός ἐστιν
  choice: సిద్ధంగా ఉంది
  rationale: విశేషణం-క్రియ నిర్మాణానికి నేరుగా, సహజంగా సరిపోతుంది.
- source_word: οἱ δὲ κεκλημένοι
  choice: కానీ ఆహ్వానించబడినవారు
  rationale: విందు సందర్భంలో καλέω యొక్క భావం ఆహ్వానించడమే; పరిపూర్ణ కర్మణి కృదంత భావాన్ని కూడా నిలుపుతుంది.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: యోగ్యులు కారు
  rationale: వారు యోగ్యులు కాదనే మూలంలోని విలువ నిర్ధారణను, దానికి కారణం జోడించకుండా, సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: κεκλημένοι అనే పదంలో ఉండగల ‘పిలువబడినవారు’ అనే దైవశాస్త్రీయ ప్రతిధ్వని
  choice: ప్రధాన పాఠ్యంలో ‘ఆహ్వానించబడినవారు’
  alternative: ‘పిలువబడినవారు’
  rationale: తక్షణ సందర్భం పెళ్లి విందుకు ముందుగా ఆహ్వానించబడిన అతిథుల గురించే ఉంది. ‘పిలువబడినవారు’ అని ప్రధాన పాఠ్యంలో ఉంచితే ఈ వచనం అవసరం చేయనంతగా ప్రత్యేక దైవశాస్త్రీయ భావం ముందుకు రావచ్చు; అయితే మూలపదపు విస్తృతిని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని చారిత్రక వర్తమానాన్ని ‘అంటాడు’తో నిలిపి, విందు సందర్భాన్ని ‘పెళ్లి విందు’తో స్పష్టంచేశాం. పాదటిప్పణి గుర్తును అది వివరిస్తున్న ‘ఆహ్వానించబడినవారు’ అన్న పదబంధం వెంట ఉంచాం.
