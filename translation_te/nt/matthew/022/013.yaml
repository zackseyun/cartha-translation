id: MAT.22.13
reference: Matthew 22:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: te
  text: అప్పుడు రాజు పరిచారకులతో, “ఇతని కాళ్లను, చేతులను కట్టి, ఇతన్ని వెలుపలి చీకటిలోకి విసిరివేయండి.[a] అక్కడ ఏడుపు, పళ్లు కొరుక్కోవడం ఉంటాయి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇతని చేతులను, కాళ్లను కట్టి, బయట ఉన్న చీకటిలోకి ఇతన్ని విసిరివేయండి.”
    reason: పదక్రమం మరియు వ్యక్తీకరణకు సహజమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలో తరువాతి సంఘటనను సహజంగా పరిచయం చేసే సాధారణ కాలసూచక పదం.
- source_word: ὁ βασιλεὺς
  choice: రాజు
  rationale: ఉపమానంలోని రాజసంబంధ దృశ్యాన్ని నేరుగా, స్పష్టంగా నిలుపుతుంది.
- source_word: τοῖς διακόνοις
  choice: పరిచారకులతో
  rationale: విందులో రాజుకు సేవచేసే వారిని సూచిస్తుంది; సంఘపరమైన ‘పరిచారకులు/డీకనులు’ అనే ప్రత్యేక పదవిని ఇక్కడ అనవసరంగా సూచించదు.
- source_word: Δήσαντες
  choice: కట్టి
  rationale: ప్రధాన ఆజ్ఞకు ముందు జరిగే చర్యను తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంతో వ్యక్తం చేస్తుంది; బలంగా బంధించే భావమూ సందర్భంలో నిలుస్తుంది.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: ఇతని కాళ్లను, చేతులను
  rationale: గ్రీకు మూలంలోని ‘కాళ్లు, చేతులు’ అనే క్రమాన్ని నిలుపుతుంది.
- source_word: ἐκβάλετε αὐτὸν
  choice: ఇతన్ని … విసిరివేయండి
  rationale: ἐκβάλλω సూచించే బలవంతపు, కఠినమైన వెలివేతను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: వెలుపలి చీకటిలోకి
  rationale: మత్తయి రచనలోని ప్రత్యేకమైన తీర్పు చిత్రణను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: ముందు పేర్కొన్న వెలుపలి చీకటిని సహజంగా తిరిగి సూచించే స్థలవాచకం.
- source_word: ὁ κλαυθμὸς
  choice: ఏడుపు
  rationale: దుఃఖంతో రోదించే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: పళ్లు కొరకడం
  rationale: వేదన లేదా ఆగ్రహాన్ని సూచించగల గ్రీకు నుడికారాన్ని దాని సందిగ్ధతతోనే సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ఉపమానంలోని వెలివేత చిత్రణ స్వభావం
  choice: ‘వెలుపలి చీకటి’లోకి విసిరివేయడమనే స్పష్టమైన రూపక చిత్రణను యథాతథంగా నిలపడం
  alternative: దీనిని నేరుగా నరకశిక్షగా వివరించడం లేదా కేవలం విందు నుండి తొలగింపుగా మృదుపరచడం
  rationale: గ్రీకు పాఠం తీర్పును గంభీరంగా చిత్రిస్తుంది గాని, ఈ వాక్యంలో దాని సిద్ధాంతపరమైన పరిధిని విడమరచదు; కాబట్టి అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే కథనశైలి. రాజు పలికే ఆజ్ఞలోని కఠినత్వాన్ని నిలుపుతూ, పాతకాలపు లేదా ప్రత్యేక సంఘపరమైన పదజాలాన్ని నివారించింది.
