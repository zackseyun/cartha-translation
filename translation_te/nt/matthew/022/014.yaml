  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: te
  text: ఎందుకంటే పిలువబడినవారు[a] అనేకులు, కానీ ఎన్నుకోబడినవారు[b] కొద్దిమందే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆహ్వానించబడినవారు”; ఈ సందర్భంలో ఈ పదానికి విందుకు ఆహ్వానించబడినవారు అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
