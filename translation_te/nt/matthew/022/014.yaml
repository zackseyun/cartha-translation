    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: అనేకులు
  rationale: నామవాచకంగా వాడిన బహువచన విశేషణం. ὀλίγοιతో ఉన్న సంక్షిప్తమైన వ్యతిరేకతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపమాన వాక్యానికి ఈ మాట వివరణాత్మక కారణాన్ని ఇస్తుందని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰσιν
  choice: తెలుగు వాక్య నిర్మాణంలో ప్రత్యేక పదంగా వ్యక్తం చేయలేదు
  rationale: గ్రీకులోని వర్తమానకాల ‘ఉన్నారు’ భావం తెలుగులో విధేయ పదాలైన ‘అనేకులు,’ ‘కొద్దిమందే’ ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: κλητοὶ
  choice: పిలువబడినవారు
  rationale: ‘పిలువబడినవారు’ అనే విస్తృత ప్రాథమిక భావాన్ని, అలాగే ἐκλεκτοίతో ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని కాపాడుతుంది. వివాహ విందు సందర్భంలో సాధ్యమైన ‘ఆహ్వానించబడినవారు’ అనే భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὀλίγοι
  choice: కొద్దిమందే
  rationale: πολλοὶకి నేరమైన వ్యతిరేక భావాన్ని తెలుపుతుంది; ‘-ఏ’ వల్ల కొద్దిమంది మాత్రమే అనే గ్రీకు సూక్తి బలం సహజంగా వ్యక్తమవుతుంది.
- source_word: δὲ
  choice: కానీ
  rationale: రెండు భాగాల మధ్య ఉన్న స్పష్టమైన వ్యతిరేకతను తెలియజేస్తుంది.
- source_word: ἐκλεκτοί
  choice: ఎన్నుకోబడినవారు
  rationale: గ్రీకు పదంలోని పారదర్శకమైన ‘chosen’ భావాన్ని ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, తరువాతి కాలపు సిద్ధాంత పరిభాషను ప్రధాన పాఠ్యంలో ముందుకు తేవదు.
theological_decisions:
- issue: ఎన్నిక లేదా ఏర్పాటుకు సంబంధించిన చర్చల్లో ἐκλεκτοί పదాన్ని అనువదించడం
  choice: ఎన్నుకోబడినవారు
  alternative: ఏర్పరచబడినవారు
  rationale: ప్రధాన పాఠ్యం గ్రీకు పదంలోని సాధారణ ఎంపిక భావాన్ని నేరుగా ఉంచుతుంది. ‘ఏర్పరచబడినవారు’ అనే సంప్రదాయ ధార్మిక ప్రత్యామ్నాయాన్ని పాదసూచికలో చూపడం ద్వారా ఏ ప్రత్యేక సిద్ధాంత నిర్ణయాన్నీ అనువాదం రుద్దదు.
- issue: వివాహ విందు ఉపమాన సందర్భంలో κλητοί పదాన్ని అనువదించడం
  choice: పిలువబడినవారు
  alternative: ఆహ్వానించబడినవారు
  rationale: తక్షణ సందర్భంలో ‘ఆహ్వానించబడినవారు’ సముచితమే అయినా, ‘పిలువబడినవారు’ పదం విస్తృతమైన అర్థ ప్రతిధ్వనిని, ἐκλεκτοίతో ఉన్న జతను కాపాడుతుంది. విందు సందర్భపు ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన సూక్తి శైలిని ఉపయోగించాం. ‘అనేకులు—కొద్దిమందే’ మరియు ‘పిలువబడినవారు—ఎన్నుకోబడినవారు’ అనే సమాంతర వ్యతిరేకతలను స్పష్టంగా నిలిపాం.
