revisions:
- from: వారు ఆయనతో, “కైసరుది” అన్నారు. అప్పుడు ఆయన వారితో, “కాబట్టి కైసరుకు చెందవలసినవి కైసరుకు, దేవునికి చెందవలసినవి దేవునికి చెల్లించండి[a]” అన్నారు.
  to: వారు ఆయనతో, “కైసరుది” అన్నారు. అప్పుడు ఆయన వారితో, “కాబట్టి కైసరువి కైసరుకు, దేవునివి దేవునికి ఇవ్వండి[a]” అన్నారు.
