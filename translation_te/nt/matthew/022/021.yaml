id: MAT.22.21
reference: Matthew 22:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: te
  text: వారు ఆయనతో, “కైసరుది” అన్నారు. అప్పుడు ఆయన వారితో, “కాబట్టి కైసరువి కైసరుకు, దేవునివి దేవునికి ఇవ్వండి[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తిరిగి ఇవ్వండి.” గ్రీకు క్రియకు ‘తిరిగి ఇవ్వడం,’ ‘బాకీ చెల్లించడం,’ లేదా ‘చెల్లవలసినది ఇవ్వడం’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: అన్నారు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, సహజమైన తెలుగు కథనశైలిలో భూతకాలాన్ని వాడాం.
- source_word: Καίσαρος
  choice: కైసరుది
  rationale: నాణెంపై ఉన్న రూపం, లేఖనం ఎవరివనే అంతర్లీన ప్రశ్నకు సమాధానమిచ్చే సంబంధార్థక షష్ఠీ విభక్తిని సహజమైన తెలుగు ఏకవచన స్వామ్యరూపంతో తెలిపాం.
- source_word: τότε λέγει αὐτοῖς
  choice: అప్పుడు ఆయన వారితో … అన్నారు
  rationale: సంభాషణలోని క్రమాన్ని నిలుపుతూ, చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు భూతకాలంలో వ్యక్తం చేశాం.
- source_word: Ἀπόδοτε
  choice: చెల్లించండి
  rationale: అప్పగించవలసినది లేదా బాకీ ఉన్నది ఇవ్వడం అనే భావాన్ని సందర్భానుకూలంగా తెలియజేస్తుంది; ‘తిరిగి ఇవ్వండి’ అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: వారి సమాధానం నుంచి యేసు తీసిన నిర్ధారణను సూచిస్తుంది.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: కైసరుకు చెందవలసినవి కైసరుకు
  rationale: గ్రీకు సమాంతర నిర్మాణాన్ని, బాధ్యత లేదా హక్కుకు సంబంధించిన విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: దేవునికి చెందవలసినవి దేవునికి
  rationale: మొదటి భాగంతో ఉన్న వాక్యసమతౌల్యాన్ని నిలుపుతూ దేవుని హక్కు ఎంత విస్తృతమో అనవసరంగా నిర్ధారించదు.
theological_decisions:
- issue: పౌరాధికారానికి, దేవునికి సంబంధించిన బాధ్యతల పరిధి
  choice: కైసరుకు చెందవలసినవి కైసరుకు, దేవునికి చెందవలసినవి దేవునికి
  alternative: ఈ మాటను కేవలం పన్ను చెల్లింపుకే పరిమితం చేయడం లేదా రాజ్యాధికారానికి సంపూర్ణ విధేయతగా విస్తరించడం
  rationale: మూలవాక్యం రెండు హక్కులను సమాంతరంగా ఉంచుతుంది గాని వాటి పూర్తి పరిధిని నిర్వచించదు. అందుచేత దాని ఉద్దేశపూర్వక ఉద్వేగాన్ని, అస్పష్టతను అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘కైసరుది’ సంక్షిప్త సమాధానాన్ని నిలుపుతుంది; ‘చెందవలసినవి’ అనే పదం గ్రీకు వాక్యంలోని హక్కు-బాధ్యత భావాన్ని అతిగా సంకుచితం చేయకుండా అందిస్తుంది.
