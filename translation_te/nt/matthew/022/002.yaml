id: MAT.22.2
reference: Matthew 22:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: te
  text: పరలోక రాజ్యం తన కుమారుని కోసం పెళ్లి విందు[b] ఏర్పాటు చేసిన ఒక రాజుతో పోల్చబడింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పోల్చవచ్చు.” గ్రీకు క్రియారూపం అక్షరార్థంగా “పోల్చబడింది” లేదా “పోలి ఉండేలా చేయబడింది” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “పెళ్లి వేడుకలు” అని బహువచనంలో ఉంది; అది పెళ్లి ఉత్సవాలను లేదా పెళ్లి విందును సూచించే నానుడి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: పోల్చబడింది
  rationale: ఇది ὁμοιόω క్రియ యొక్క భూతకాల కర్మణి రూపం. ‘పోల్చబడింది’ ఆ రూపాన్ని నేరుగా నిలుపుతుంది; ఉపమాన ప్రవేశ వాక్యంగా సహజంగా ఉండే ‘పోల్చవచ్చు’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి ప్రత్యేకంగా వాడే పదబంధాన్ని దేవుని రాజ్యం అని సమన్వయపరచకుండా నిలుపుతూ, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజమైన రూపాన్ని ఎంచుకున్నాం.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: ఒక రాజుతో
  rationale: గ్రీకులో అక్షరార్థంగా ‘ఒక మనిషితో—ఒక రాజుతో’ ఉన్నప్పటికీ, ఇక్కడ βασιλεῖ ἀνθρώπῳను విశదపరుస్తుంది. తెలుగులో ‘ఒక రాజుతో’ అనడం పూర్తి భావాన్ని సహజంగా తెలియజేస్తుంది; ‘ఒక మనిషితో, అంటే ఒక రాజుతో’ అనడం అనవసరంగా బరువుగా ఉంటుంది.
- source_word: ὅστις
  choice: చేసిన
  rationale: సంబంధవాచక భావాన్ని తెలుగులో సహజమైన అసమాపక క్రియ నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: ἐποίησεν
  choice: ఏర్పాటు చేసిన
  rationale: γάμουςతో కలిసినప్పుడు ποιέω ఇక్కడ వివాహ ఉత్సవం లేదా విందు నిర్వహించడాన్ని సూచిస్తుంది. ‘ఏర్పాటు చేసిన’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: γάμους
  choice: పెళ్లి విందు
  rationale: బహువచన రూపం ఇక్కడ పెళ్లి వేడుకలను, సందర్భానుసారంగా ఆహ్వానాలతో కూడిన విందును సూచిస్తుంది. ఉపమానం తరువాత విందుపైన దృష్టి పెట్టేందున ‘పెళ్లి విందు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: τῷ υἱῷ αὐτοῦ
  choice: తన కుమారుని కోసం
  rationale: దత్తివిభక్తి కుమారుని ప్రయోజనార్థం లేదా అతనికి సంబంధించిన వేడుక అనే భావాన్ని ఇస్తుంది. వివాహ భావం ఇప్పటికే ‘పెళ్లి విందు’లో ఉన్నందున దాన్ని మళ్లీ జోడించలేదు.
theological_decisions:
- issue: ‘పరలోక రాజ్యం’ అనే మాట యొక్క స్వభావం
  choice: మత్తయి వాడిన ‘పరలోక రాజ్యం’ అనే రూపాన్నే నిలుపడం
  alternative: ‘దేవుని రాజ్యం’ లేదా ‘పరలోక పరిపాలన’
  rationale: మత్తయి పదప్రయోగాన్ని వేరొక సువార్తలోని సమాన పదబంధంతో మార్చకుండా, ‘రాజ్యం’లోని పరిపాలన/రాజ్యక్షేత్రం అనే భావ విస్తృతిని పాఠకునికి తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. కర్మణి రూపాన్ని నిలిపి, మిగతా వాక్య నిర్మాణాన్ని తెలుగులో సహజంగా ఉంచాం.
