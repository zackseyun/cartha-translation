  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: te
  text: “కాబట్టి, మీ అభిప్రాయం ఏమిటో మాకు చెప్పండి. కైసరుకు తలపన్ను[a] ఇవ్వడం న్యాయసమ్మతమా, కాదా?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: రోమా పాలనలో వ్యక్తులపై విధించిన పన్ను.
    reason: κῆνσον అనే చారిత్రక పన్ను పదానికి సంక్షిప్త వివరణ ఇస్తుంది.
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: నీ అభిప్రాయం ఏమిటో
  rationale: అక్షరార్థంగా ‘నీకు ఏమనిపిస్తోంది’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔξεστιν
  choice: న్యాయసమ్మతమా
  rationale: ఇది కేవలం ప్రభుత్వ చట్టబద్ధతనే కాక, అనుమతించదగినదా అనే విస్తృత ప్రశ్నను నిలుపుతుంది.
- source_word: δοῦναι
  choice: ఇవ్వడం
  rationale: మూలంలోని ‘ఇవ్వడం’ అనే సాధారణ క్రియను నిలుపుతుంది; ‘చెల్లించడం’ అని ప్రత్యేకీకరించదు.
- source_word: κῆνσον
  choice: తలపన్ను
  rationale: రోమా పాలనలో వ్యక్తులపై విధించిన పన్నును సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: Καίσαρι
  choice: కైసరుకు
  rationale: రోమా చక్రవర్తికి వాడిన బిరుదును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: ἔξεστιν అనే పదం సూచించే ప్రమాణం
  choice: న్యాయసమ్మతమా
  alternative: ధర్మశాస్త్రం ప్రకారం సమ్మతమా
  rationale: ప్రశ్న యూద ధర్మశాస్త్రాన్ని సూచించవచ్చు, కాని మూలపాఠం ఆ ప్రమాణాన్ని స్పష్టంగా పేర్కొనదు. అందువల్ల ఆ ఉద్దేశాన్ని అనువాదంలో ముందుగానే నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంభాషణ సహజంగా, కానీ గౌరవప్రదంగా ఉంది. ఏకవచన ‘నీ’ మూలంలోని రెండవ పురుష ఏకవచనాన్ని ప్రతిబింబిస్తుంది.
