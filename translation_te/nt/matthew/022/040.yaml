  text: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος ⸂κρέμαται καὶ οἱ προφῆται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: te
  text: ఈ రెండు ఆజ్ఞలపై ధర్మశాస్త్రమంతా, ప్రవక్తల గ్రంథాలన్నీ ఆధారపడి ఉన్నాయి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో అక్షరార్థంగా, “ఈ రెండు ఆజ్ఞలలో” అని ఉంది. κρέμαται అనే క్రియ అక్షరార్థంగా “వేలాడుతుంది”; ఈ రూపకంలో ధర్మశాస్త్రం, ప్రవక్తల గ్రంథాలు ఈ ఆజ్ఞలపై ఆధారపడుతున్నాయని భావం.
    reason: lexical_alternative
  - marker: b
    text: “ధర్మశాస్త్రం మరియు ప్రవక్తలు” అనేది యూదుల లేఖనాల ప్రధాన విభాగాలను సమగ్రంగా సూచించే స్థిరమైన జంటపదం.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: ఈ రెండు ఆజ్ఞల మీదనే
  rationale: ἐν అనే ఉపసర్గను సందర్భంలోని κρέμαται రూపకంతో కలిపి, ఆధారాన్ని సూచించే సహజమైన తెలుగు ప్రయోగంగా ‘మీదనే’ అని అనువదించాం. ‘నే’ మొత్తం వాక్యభారం ఈ రెండింటిపైనే ఉందనే ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: ὅλος ὁ νόμος
  choice: ధర్మశాస్త్రమంతా
  rationale: ὅλος సూచించే సంపూర్ణతను ‘అంతా’ నిలుపుతుంది. ఇక్కడ νόμος సాధారణ నియమాన్ని కాక తోరా/లేఖన విభాగాన్ని సూచిస్తున్నందున ‘ధర్మశాస్త్రం’ ఎంచుకున్నాం.
- source_word: κρέμαται
  choice: ఆధారపడి ఉన్నాయి
  rationale: క్రియకు అక్షరార్థంగా ‘వేలాడుతున్నాయి’ అనవచ్చు; అయితే తెలుగులో ఈ సందర్భంలో అది అసహజంగా లేదా భౌతిక వేలాడుదలగా వినిపించవచ్చు. ‘మీద… ఆధారపడి ఉన్నాయి’ మూలంలోని ఆధారపడే రూపకార్థాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: καὶ οἱ προφῆται
  choice: ప్రవక్తల గ్రంథాలు
  rationale: ఇక్కడ οἱ προφῆται కేవలం ప్రవక్త వ్యక్తులను కాక ‘ధర్మశాస్త్రము మరియు ప్రవక్తలు’ అనే లేఖన సూత్రంలోని ప్రవక్తల రచనలను సూచిస్తుంది. సాధారణ తెలుగు పాఠకునికి ఆ సాహిత్యార్థం స్పష్టమయ్యేందుకు ‘గ్రంథాలు’ చేర్చాం.
theological_decisions:
- issue: ‘ధర్మశాస్త్రము మరియు ప్రవక్తలు’ అనే సూత్రం యొక్క పరిధి
  choice: మొత్తం అధికారిక లేఖన సాక్ష్యాన్ని సూచించే స్థిరమైన సూత్రంగా నిలిపాం
  alternative: నైతిక బోధ ఉన్న ధర్మశాస్త్ర, ప్రవక్తల భాగాలకు మాత్రమే పరిమితమైన సూచన
  rationale: మత్తయి సందర్భంలో ఈ జంటపదం లేఖన సాక్ష్యాన్ని సమగ్రంగా సూచిస్తుంది. దానిని ‘లేఖనాలన్నీ’ అని పూర్తిగా వివరణాత్మకంగా మార్చకుండా, మూలంలోని రెండు విభాగాల రూపాన్ని నిలిపాం.
- issue: κρέμαται రూపకం
  choice: ఆధారపడడం అనే భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేసి, అక్షరార్థ రూపకాన్ని పాదసూచికలో ఇచ్చాం
  alternative: ‘వేలాడుతున్నాయి’ అని రూపకాన్ని అక్షరాలా ప్రధాన పాఠ్యంలో ఉంచడం
  rationale: అక్షరార్థ తెలుగు అనవసరమైన భౌతిక చిత్రాన్ని ముందుకు తెచ్చే అవకాశం ఉంది. ‘ఆధారపడి ఉన్నాయి’ మూలంలోని సంబంధాన్ని తెలియజేస్తూ, పాదసూచిక ద్వారా అసలు రూపకాన్ని పారదర్శకంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘ధర్మశాస్త్రం’ మరియు ‘ప్రవక్తల గ్రంథాలు’ ద్వారా యూద లేఖన విభాగాల భావం సాధారణ పాఠకునికి స్పష్టంగా ఉండేలా చేశాం; మూలంలోని రూపక సంబంధాన్ని ‘మీదనే… ఆధారపడి ఉన్నాయి’గా అందించాం.
