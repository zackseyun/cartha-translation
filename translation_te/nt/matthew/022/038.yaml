  text: This is the great and first commandment[a].
translation:
  language: te
  text: ఇదే గొప్పదైన, మొదటిదైన ఆజ్ఞ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇదే అతి ముఖ్యమైన ఆజ్ఞ.” గ్రీకులో మరింత అక్షరార్థంగా “గొప్పదైన, మొదటిదైన ఆజ్ఞ” అనే రెండు వర్ణనలు ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: ఇదే
  rationale: ఈ సూచన సర్వనామం 37వ వచనంలో చెప్పిన ఆజ్ఞను తిరిగి సూచిస్తుంది. ‘ఇదే’ ఆ అన్వయాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐστὶν
  choice: ఆజ్ఞ (నామవాక్య నిర్మాణంలో అంతర్లీనమైన ‘అయి ఉంది’)
  rationale: తెలుగులో వర్తమానకాల అనుసంధాన క్రియను విడిగా పలకకుండానే నామవాక్యం సహజంగా ఉంటుంది; ‘ఇదే … ఆజ్ఞ’ గ్రీకు వర్తమాన నిర్దేశార్థాన్ని నిలుపుతుంది.
- source_word: μεγάλη
  choice: గొప్పదైన
  rationale: ఇక్కడ పరిమాణం కాక ప్రాముఖ్యత లేదా స్థాయిని సూచిస్తుంది. మూలంలోని సాధారణ విశేషణ రూపాన్ని అతిశయోక్తిగా మార్చకుండా ‘గొప్పదైన’ అని అనువదించాం.
- source_word: πρώτη
  choice: మొదటిదైన
  rationale: క్రమంలో లేదా స్థాయిలో మొదటిదనే భావాన్ని నేరుగా నిలుపుతుంది; ‘ప్రధానమైన’ అని అనువదిస్తే μεγάληతో ఉన్న రెండు వేర్వేరు విశేషణాల భావం కలిసిపోయే అవకాశం ఉంది.
- source_word: ἐντολή
  choice: ఆజ్ఞ
  rationale: ధర్మశాస్త్ర చర్చలో దేవుడు ఇచ్చిన నిర్దేశాన్ని సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
theological_decisions:
- issue: μεγάλη మరియు πρώτη అనే రెండు విశేషణాలు ఆజ్ఞను ఎలా వర్ణిస్తున్నాయి
  choice: రెండింటినీ సమన్వయంగా ‘గొప్పదైన, మొదటిదైన ఆజ్ఞ’ అని ఉంచడం
  alternative: ‘అతి ముఖ్యమైన ఆజ్ఞ’
  rationale: గ్రీకులో μεγάλη, πρώτη అనే రెండు సానుకూల విశేషణాలు ἐντολήను వర్ణిస్తున్నాయి. రెండింటినీ వెల్లడించడం ద్వారా గొప్పతనం, మొదటితనం మధ్యనున్న భావభేదం నిలుస్తుంది; వాటిని ఒకే అతిశయార్థంలో కలిపివేయడం నివారించబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఇదే’ ముందున్న వచనానికి ఉన్న సూచనను బలంగా నిలుపుతుంది; రెండు విశేషణాలనూ విడివిడిగా వ్యక్తం చేశాం.
