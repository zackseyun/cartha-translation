  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: te
  text: ఎవరూ ఆయనకు జవాబుగా ఒక్క మాటైనా చెప్పలేకపోయారు[a]. ఆ రోజు నుండి ఇకపై ఆయనను ప్రశ్నించడానికి ఎవరూ సాహసించలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనకు ఒక మాట జవాబు చెప్పలేకపోయారు.” గ్రీకు నుడికారం అక్షరార్థంగా “ఆయనకు ఒక మాట జవాబు చెప్పడం” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: ఎవరూ … లేదు
  rationale: ఏ ఒక్క వ్యక్తీ జవాబు చెప్పలేకపోయాడనే సంపూర్ణ నిరాకరణను సహజమైన తెలుగు నిర్మాణంలో తెలియజేస్తుంది.
- source_word: ἐδύνατο
  choice: చెప్పలేకపోయారు
  rationale: గతకాలంలోని అసమర్థతను తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: ఆయనకు ఒక్క మాట కూడా జవాబు చెప్పడం
  rationale: λόγον అనే ‘మాట’ను నిలుపుతూ, గ్రీకు నుడికారంలోని గాఢతను తెలుగులో సహజమైన ‘ఒక్క మాట కూడా’ అనే రూపంలో అందిస్తుంది.
- source_word: οὐδὲ
  choice: అంతేకాదు … ఎవ్వరూ … లేదు
  rationale: మొదటి నిరాకరణకు రెండవ నిరాకరణను బలంగా జోడించే గ్రీకు సంబంధాన్ని సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: ἐτόλμησέν τις
  choice: ఎవ్వరూ సాహసించలేదు
  rationale: ప్రశ్న అడగడానికి తెగించకపోవడం లేదా ధైర్యం చేయకపోవడం అనే τολμάω భావాన్ని సూటిగా తెలియజేస్తుంది.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: ఆ రోజు నుండి
  rationale: కొనసాగిన పరిస్థితి మొదలైన కాలబిందువును స్పష్టంగా సూచిస్తుంది.
- source_word: ἐπερωτῆσαι
  choice: ప్రశ్నించడానికి
  rationale: సాధారణంగా సమాచారం అడగడం కంటే, ఈ సందర్భంలో యేసును వాదనాత్మకంగా ప్రశ్నకు గురిచేయడం అనే భావాన్ని నిలుపుతుంది; ‘విచారించడం’ లేదా ‘నిలదీయడం’ కన్నా తటస్థంగా ఉంటుంది.
- source_word: οὐκέτι
  choice: ఇకపై
  rationale: ఆ సమయం నుంచి ప్రశ్నించడం పూర్తిగా నిలిచిపోయిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యేసు జవాబు తరువాత ప్రత్యర్థుల మౌనానికి ఉన్న కథనాత్మక ప్రాధాన్యం
  choice: వారు జవాబు చెప్పలేకపోయారని, ఇకపై ప్రశ్నించడానికి సాహసించలేదని మాత్రమే చారిత్రక కథనంగా అనువదించడం
  alternative: అనువాద పదాల్లోనే యేసు జ్ఞానం లేదా అధికారపు ఆధిక్యాన్ని మరింత స్పష్టంగా వ్యాఖ్యానించడం
  rationale: సందర్భం యేసు వాదనాత్మక విజయాన్ని సూచించినప్పటికీ, ఈ వచనం వారి అసమర్థతను, ఆ తరువాత ప్రశ్నించకపోవడాన్ని మాత్రమే నేరుగా చెబుతుంది. అందువల్ల అదనపు సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే కథన గౌరవాన్ని నిలుపుతూ రూపొందించబడింది. ‘ఒక్క మాట కూడా’ అనే సాధారణ తెలుగు నుడికారం మూలంలోని λόγονను మరియు దాని ఉద్ఘాటనను రెండింటినీ నిలుపుతుంది.
