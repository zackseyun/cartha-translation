  source_fidelity: 'మూల గ్రీకు భావాన్ని ప్రధాన వాక్యం బాగా ప్రతిబింబిస్తుంది: Δευτέραకు ‘రెండవది,’ ὁμοία αὐτῇకు ‘దానివంటిదే,’ మరియు లేవీయకాండము ఉల్లేఖనంలోని ఆజ్ఞార్థక భవిష్యత్‌కు ‘ప్రేమించాలి’ సరిపోతాయి. అయితే δέను ‘కూడా’గా తప్పనిసరిగా వ్యక్తం చేయడం కొద్దిగా అధికంగా అనిపించవచ్చు; ఇక్కడ అది మృదువైన అనుసంధానం మాత్రమే. అలాగే ప్రస్తుత పాదటిప్పణి మూలంలోని ప్రధాన ప్రత్యామ్నాయం అయిన అనిశ్చిత/నిశ్చిత ‘రెండవది’ భేదాన్ని నమోదు చేయకుండా δέ వివరణను ఇస్తోంది.'
  naturalness: ‘రెండవది దానివంటిదే’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది. ‘నిన్ను నీవు ప్రేమించుకున్నట్లే’ అనే ప్రయోగం కూడా సాధారణంగా అర్థమవుతుంది మరియు శాస్త్రోక్త ఆజ్ఞా ధోరణిని నిలుపుతుంది.
