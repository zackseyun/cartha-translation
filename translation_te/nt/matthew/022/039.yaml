id: MAT.22.39
reference: Matthew 22:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: te
  text: 'రెండవది దానివంటిదే: ‘నిన్ను నీవు ప్రేమించుకున్నట్లే నీ పొరుగువానిని ప్రేమించాలి.’[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ రెండవది దానివంటిదే.’
    reason: Δευτέρα ఆర్టికల్ లేకుండా ఉన్నప్పటికీ సందర్భంలో రెండవ ఆజ్ఞను సూచిస్తుంది; తెలుగులో నిర్దిష్టంగా ‘ఆ రెండవది’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: Δευτέρα
  choice: రెండవది
  rationale: ఆర్టికల్ లేని స్త్రీలింగ క్రమసంఖ్యావాచకం నామవాచకంగా పనిచేస్తోంది. సందర్భంలో ఇది రెండవ ఆజ్ఞను సూచిస్తుంది; తెలుగులో ‘రెండవది’ సహజంగా ordinal భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: కూడా
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక, ముందటి ఆజ్ఞకు మరో ఆజ్ఞను జోడిస్తూ వాక్యాన్ని ముందుకు తీసుకెళ్తుంది. తెలుగులో ‘కూడా’ ఆ అనుబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁμοία αὐτῇ
  choice: దానివంటిదే
  rationale: ὁμοία మరియు దత్తివిభక్తి αὐτῇ కలిసి ముందుగా చెప్పిన మొదటి ఆజ్ఞతో పోలికను సూచిస్తాయి. ‘దానివంటిదే’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని కాపాడుతుంది.
- source_word: Ἀγαπήσεις
  choice: ప్రేమించాలి
  rationale: భవిష్యత్ సూచక క్రియ ఇక్కడ ఆజ్ఞార్థక బలంతో, లేవీయకాండము 19:18 ఉల్లేఖనంలో ఉంది. ఆధునిక తెలుగులో ‘ప్రేమించాలి’ ఆజ్ఞాత్మక బాధ్యతను సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν πλησίον σου
  choice: నీ పొరుగువానిని
  rationale: ఈ స్థిరమైన ప్రయోగం ‘నీ పొరుగువాడు/సమీపస్థుడు’ అనే సంబంధార్థాన్ని ఇస్తుంది; కేవలం భౌగోళిక సమీపాన్ని కాదు. ‘పొరుగువానిని’ సాధారణ బైబిలు-తెలుగు వాడుకతో పాటు స్పష్టతను ఇస్తుంది.
- source_word: ὡς σεαυτόν
  choice: నిన్ను నీవు ప్రేమించుకున్నట్లే
  rationale: ὡς పోలికకు ప్రమాణాన్ని, σεαυτόν కర్తను తిరిగి సూచించే ఆత్మనిర్దేశక సర్వనామాన్ని ఇస్తాయి. తెలుగులో క్రియను పూరించడం ద్వారా ‘నిన్ను నీవు ప్రేమించుకున్నట్లే’ అనే పోలిక స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: రెండవ ఆజ్ఞకు మొదటి ఆజ్ఞతో ఉన్న సంబంధం
  choice: రెండవది కూడా దానివంటిదే
  alternative: మరొక రెండవ ఆజ్ఞ దానివంటిది
  rationale: గ్రీకు పాఠం రెండవ ఆజ్ఞ మొదటిదానితో సమాన స్వభావం లేదా ప్రాముఖ్యత కలిగినదని పోలుస్తుంది; రెండింటినీ ఒకటిగా కలపదు. తెలుగు అనువాదం ఆ పోలికను అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
- issue: Ἀγαπήσεις యొక్క ఆజ్ఞార్థక బలం
  choice: ప్రేమించాలి
  alternative: ప్రేమిస్తావు
  rationale: రూపం భవిష్యత్ సూచకమైనప్పటికీ, ధర్మశాస్త్ర ఉల్లేఖనంలో ఇది ఆజ్ఞార్థకంగా పనిచేస్తుంది. ‘ప్రేమించాలి’ ఆధునిక తెలుగులో ఆ బాధ్యతను స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ఆజ్ఞ యొక్క గౌరవప్రదమైన శాస్త్రోక్త ధోరణి నిలుపబడింది. ఉల్లేఖనాన్ని తెలుగు ఏక ఉద్ధరణ చిహ్నాలతో చూపించాం.
