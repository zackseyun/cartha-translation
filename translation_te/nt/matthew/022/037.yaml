id: MAT.22.37
reference: Matthew 22:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: te
  text: 'ఆయన అతనితో ఇలా అన్నాడు: “నీ పూర్ణ హృదయంతో, నీ పూర్ణ ఆత్మతో[b], నీ పూర్ణ మనస్సుతో[c] నీ దేవుడైన ప్రభువును ప్రేమించాలి[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులోని భవిష్యత్ సూచకరూపం ఇక్కడ ఆజ్ఞార్థకంగా వాడబడింది; అందుకే ‘ప్రేమించాలి’ అని అనువదించబడింది.
    reason: grammatical_clarification
  - marker: b
    text: ‘ఆత్మ’కు మూలమైన ψυχή అనే గ్రీకు పదం కొన్ని సందర్భాల్లో ‘ప్రాణం,’ ‘జీవితం,’ లేదా ‘స్వయం’ అని కూడా అర్థమవుతుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘మనస్సు’కు మూలమైన διάνοιαను ‘బుద్ధి’ లేదా ‘గ్రహణశక్తి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ఇలా
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక సంభాషణ కొనసాగింపును సూచిస్తుంది. తెలుగు ప్రత్యక్ష వాక్య పరిచయంలో ‘ఇలా అన్నాడు’ సహజంగా ఆ ప్రవాహాన్ని అందిస్తుంది.
- source_word: ἔφη αὐτῷ
  choice: ఆయన అతనితో ఇలా అన్నాడు
  rationale: φημί ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది; ‘జవాబిచ్చాడు’ అనే అర్థాన్ని క్రియలో లేనప్పుడు చేర్చకుండా, గ్రీకు దత్తివాచకమైన αὐτῷను ‘అతనితో’గా నిలుపుతుంది.
- source_word: Ἀγαπήσεις
  choice: ప్రేమించాలి
  rationale: భవిష్యత్ సూచకరూపం ఇక్కడ ద్వితీయోపదేశకాండపు ఆజ్ఞను ఉటంకిస్తూ ఆజ్ఞార్థక బలంతో ఉంది. ఆధునిక తెలుగులో ‘ప్రేమించాలి’ ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κύριον τὸν θεόν σου
  choice: నీ దేవుడైన ప్రభువును
  rationale: κύριοςకు ‘ప్రభువు,’ θεόςకు ‘దేవుడు’ అనే ప్రామాణిక పదాలను ఉంచి, తెలుగు విభక్తి నిర్మాణంలో రెండింటి అనుబంధాన్ని స్పష్టంగా, సహజంగా చూపుతుంది.
- source_word: ἐν ὅλῃ τῇ καρδίᾳ σου
  choice: నీ పూర్ణహృదయంతో
  rationale: ἐνను ఈ భక్తి-సమగ్రతను తెలిపే సందర్భంలో తెలుగు సహజ ప్రయోగమైన సహాయకార్థక ‘తో’గా, ὅλῃను ‘పూర్ణ’గా అందిస్తుంది.
- source_word: ψυχῇ
  choice: ఆత్మతో
  rationale: ψυχήకు జీవం, స్వయం అనే అర్థాలు కూడా ఉన్నా, ఈ త్రిపద ఆజ్ఞలో ‘ఆత్మ’ మూలంలోని ప్రత్యేక పదాన్ని నిలుపుతూ సంపూర్ణ వ్యక్తిత్వ సమర్పణను సూచిస్తుంది.
- source_word: διανοίᾳ
  choice: మనస్సుతో
  rationale: διάνοια ఆలోచన, గ్రహణశక్తి గల అంతరంగ సామర్థ్యాన్ని సూచిస్తుంది; ‘మనస్సు’ ఆధునిక తెలుగులో సంక్షిప్తమూ సహజమూ అయిన సమానార్థకం.
theological_decisions:
- issue: ద్వితీయోపదేశకాండపు ఆజ్ఞను యేసు ఉటంకించిన రూపం
  choice: ‘హృదయం ... ఆత్మ ... మనస్సు’ అనే మూడు పదాల భేదాన్ని నిలుపుతూ ఆజ్ఞార్థకంగా అనువదించడం
  alternative: మూడు పదాలను కలిపి ‘నీ సర్వస్వంతో’ అని భావానువాదం చేయడం, లేదా διάνοιαను ‘బుద్ధి’గా ఇవ్వడం
  rationale: గ్రీకు పాఠం మూడు అంశాలను వేరుగా పేర్కొంటుంది; వాటిని ఒకే భావపదంగా కుదించకుండా ఉంచడం మూలంలోని సమగ్రతనూ అంతర్గత భేదాన్నీ కాపాడుతుంది. ‘మనస్సు’ అనేది διάνοια యొక్క ఆలోచనా కోణాన్ని సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘నీ పూర్ణహృదయంతో ...’ అనే పునరుక్త నిర్మాణం మూలంలోని ἐν ὅλῃ ... వరుసను కాపాడుతూ తెలుగులో సహజంగా ఉండేలా రూపొందించబడింది.
