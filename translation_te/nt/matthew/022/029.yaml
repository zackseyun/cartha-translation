id: MAT.22.29
reference: Matthew 22:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: te
  text: 'అయితే యేసు వారికి ఇలా జవాబిచ్చాడు: “మీరు లేఖనాలనూ దేవుని శక్తినీ ఎరుగకపోవడం వల్ల పొరబడుతున్నారు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దారితప్పుతున్నారు” లేదా “తప్పులో ఉన్నారు.”
    reason: Πλανᾶσθε అనే గ్రీకు క్రియ తప్పులో ఉండడం, దారితప్పడం అనే భావాలను కలిగి ఉండగలదు.
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: అయితే యేసు వారికి ఇలా జవాబిచ్చాడు
  rationale: గ్రీకు జవాబు సూత్రాన్ని తెలుగులో సహజంగా ఒకే క్రియతో వ్యక్తం చేశాం; δέ లోని స్వల్ప వ్యతిరేక లేదా సంధాన భావాన్ని ‘అయితే’ నిలుపుతుంది.
- source_word: Πλανᾶσθε
  choice: పొరబడుతున్నారు
  rationale: ఇక్కడ క్రియ తప్పులో ఉండడం లేదా దారితప్పడం అనే భావాన్ని ఇస్తుంది. ‘పొరబడుతున్నారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం బయటి వ్యక్తి మోసగించాడనే భావాన్ని అనవసరంగా నిర్దేశించదు.
- source_word: μὴ εἰδότες
  choice: ఎరుగకపోవడం వల్ల
  rationale: ఈ కృదంత ప్రయోగం వారి పొరపాటుకు కారణాన్ని తెలియజేస్తుంది; ‘వల్ల’ ఆ కారణ సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰς γραφὰς
  choice: లేఖనాలు
  rationale: యూదు మరియు తొలి క్రైస్తవ సందర్భంలో ఈ బహువచనం పవిత్ర గ్రంథరచనలను సూచిస్తుంది; ‘లేఖనాలు’ స్థిరమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: τὴν δύναμιν τοῦ θεοῦ
  choice: దేవుని శక్తి
  rationale: δύναμις కు ‘శక్తి’ నేరమైన సమానార్థకం; τοῦ θεοῦ అనే సంబంధాన్ని ‘దేవుని’ సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: సద్దూకయ్యుల పొరపాటుకు కారణం
  choice: లేఖనాలనూ దేవుని శక్తినీ ఎరుగకపోవడమే వారి పొరపాటుకు కారణమని యేసు చెబుతున్నాడు.
  alternative: వారి అజ్ఞానాన్ని కారణంగా చూపకుండా, వారు సాధారణంగా మోసపోయారని మాత్రమే చెప్పడం.
  rationale: μὴ εἰδότες అనే కృదంత ప్రయోగం, μηδέ తో జతచేయబడిన రెండు కర్మలతో కలిసి, వారి పొరపాటుకు కారణాన్ని సహజంగా వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని వాడాం. ‘లేఖనాలు,’ ‘దేవుని శక్తి’ వంటి బైబిలు పదజాలాన్ని సాధారణ పాఠకులకు అర్థమయ్యే రూపంలో నిలిపాం.
