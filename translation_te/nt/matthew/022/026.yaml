  text: Likewise also the second and the third[a], up to the seven.
translation:
  language: te
  text: రెండవవానికి కూడా, మూడవవానికి కూడా అలాగే జరిగింది; ఏడుగురి వరకూ అలాగే జరిగింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సహజంగా, “ఏడుగురికీ అలాగే జరిగింది” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: అలాగే
  rationale: మునుపటి వాడికి జరిగినదే తరువాతివారికీ జరిగిందని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: καὶ ὁ δεύτερος καὶ ὁ τρίτος
  choice: రెండవవాడికీ, మూడవవాడికీ
  rationale: గ్రీకులోని substantival ordinals‌ను ‘సోదరుడు’ అని స్పష్టంగా చేర్చకుండా నిలుపుతూ, పూర్వవచనంలోని క్రియను తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ‘జరిగింది’ అని పూరించాం; -కీ...-కీ నిర్మాణం పునరుక్త καὶ భావాన్ని ప్రతిబింబిస్తుంది.
- source_word: ἕως τῶν ἑπτά
  choice: ఆ విధంగా ఏడుగురి వరకూ
  rationale: ఏడుగురితో కూడిన మొత్తం క్రమంలో అదే పరిణామం కొనసాగిందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘అందరికీ’ అనే వివరణాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని క్రియా-లోపాన్ని తెలుగులో అర్థస్పష్టత కోసం ‘జరిగింది’తో పూరించాం; సందర్భంలో ఉన్న ‘సోదరుడు’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
