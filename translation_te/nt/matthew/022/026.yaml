    text: మరింత సహజంగా, “ఏడుగురికీ అలాగే జరిగింది” అని అనువదించవచ్చు.
    reason: lexical_alternative
  revision_rationale: The revision retains the Greek ellipsis by supplying only the necessary Telugu predicate, keeps ‘brother’ implicit, represents the repeated καί distributively with కూడా, and preserves ἕως τῶν ἑπτά as ‘ఏడుగురి వరకూ.’ The footnote offers an idiomatic inclusive alternative.
