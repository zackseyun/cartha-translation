  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς πάλιν εἶπεν ⸂ἐν παραβολαῖς αὐτοῖς⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/001.yaml
  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: te
  text: యేసు జవాబిచ్చి, మళ్లీ వారికి ఉపమానాలతో ఇలా చెప్పాడు:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు స్పందించి, మళ్లీ వారికి ఉపమానాలతో ఇలా చెప్పాడు.” వెంటనే ముందు ప్రత్యక్ష ప్రశ్న చెప్పబడకపోయినా, గ్రీకులో “జవాబిచ్చి” అనేది సాధారణ కథన ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: సందర్భానుసారంగా ప్రత్యేక పదంగా అనువదించలేదు
  rationale: తెలుగులో వాక్యారంభంలో ‘మరియు’ అనడం కృత్రిమంగా ఉంటుంది; కథన కొనసాగింపు వాక్యక్రమంలోనే స్పష్టమవుతుంది.
- source_word: ἀποκριθεὶς
  choice: జవాబిస్తూ
  rationale: గ్రీకు కథనంలో ప్రత్యక్ష ప్రశ్న లేకున్నా సాధారణంగా వాడే ‘జవాబిచ్చి/ప్రతిస్పందించి’ అనే ప్రయోగాన్ని నిలుపుతుంది.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: వ్యక్తినామానికి గ్రీకులో ఉన్న నిర్దిష్ట ఉపపదాన్ని తెలుగులో విడిగా అనువదించాల్సిన అవసరం లేదు.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: మాట్లాడే చర్య పునరావృతమైందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἶπεν
  choice: అన్నాడు
  rationale: మాట్లాడడాన్ని సూచించే సహజమైన తెలుగు కథన క్రియ; తరువాతి మాటలను పరిచయం చేస్తుంది.
- source_word: ἐν παραβολαῖς
  choice: ఉపమానాలతో
  rationale: ἐν ఇక్కడ విధానం లేదా మాధ్యమాన్ని సూచిస్తుంది; ‘ఉపమానాలతో’ అనేది సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: యేసు మాటల శ్రోతలను సూచించే దత్తివ సర్వనామానికి నేరమైన తెలుగు సమానం.
- source_word: λέγων
  choice: ఇలా
  rationale: తదుపరి ప్రత్యక్ష వాక్యాన్ని సహజంగా పరిచయం చేస్తూ λέγων యొక్క కార్యాన్ని తెలుగులో అందిస్తుంది; ‘అంటూ అన్నాడు’ అనే పునరుక్తిని నివారిస్తుంది.
theological_decisions:
- issue: వెంటనే ముందు ప్రత్యక్ష ప్రశ్న లేకున్నా ἀποκριθεὶς వాడుక
  choice: ‘జవాబిస్తూ’ అని నిలుపడం
  alternative: ‘మాట్లాడుతూ’ లేదా ఆ పదాన్ని అనువదించకుండా వదలడం
  rationale: ఇది సాధారణ గ్రీకు కథన ప్రయోగం; దానిని తొలగించకుండా మూలంలోని సంభాషణాత్మక కొనసాగింపును నిలుపుతుంది, అయితే లేనిపోని ప్రశ్నను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం. మూలంలోని ‘జవాబు’ అనే కథన ప్రయోగాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దాని సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
