  terminology: ‘హంతకులు,’ ‘నాశనం చేసి,’ and ‘తగలబెట్టాడు’ appropriately convey φονεῖς, ἀπώλεσεν, and ἐνέπρησεν without adding interpretive claims. No footnotes are required by the source or supplied audit trail.
