id: MAT.22.7
reference: Matthew 22:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: te
  text: అయితే రాజుకు కోపం వచ్చింది; అతను తన సైన్యదళాలను పంపి, ఆ హంతకులను నాశనం చేసి, వారి పట్టణాన్ని తగలబెట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: కోపగించి
  rationale: రాజుకు కోపం వచ్చిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: తన సైన్యాలను
  rationale: బహువచన రూపాన్ని నిలుపుతూ, రాజు అధీనంలోని సైనిక దళాలను సూచిస్తుంది.
- source_word: ἀπώλεσεν
  choice: నాశనం చేసి
  rationale: సందర్భంలో హంతకులను సంహరించడాన్ని సూచించే బలమైన క్రియ; గ్రీకు క్రియలోని తీవ్రతను నిలుపుతుంది.
- source_word: τοὺς φονεῖς ἐκείνους
  choice: ఆ హంతకులను
  rationale: ἐκείνους లోని నిర్దిష్ట సూచనను ‘ఆ’తోను, φονεῖς అర్థాన్ని ‘హంతకులు’తోను స్పష్టంగా అందిస్తుంది.
- source_word: τὴν πόλιν αὐτῶν ἐνέπρησεν
  choice: వారి పట్టణాన్ని తగలబెట్టాడు
  rationale: పట్టణాన్ని అగ్నికి ఆహుతి చేశాడనే ప్రత్యక్ష అర్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని రాజు చర్యలకు చారిత్రక లేదా అంత్యకాల సంబంధిత నిర్దిష్ట వ్యాఖ్యానాన్ని జోడించాలా
  choice: వచనంలోని కథనాన్ని మాత్రమే అనువదించడం
  alternative: పట్టణ నాశనాన్ని ఒక నిర్దిష్ట చారిత్రక సంఘటనకు లేదా దైవిక తీర్పుకు వ్యాఖ్యానాత్మకంగా అనుసంధానించడం
  rationale: మూల వచనం ఇక్కడ వ్యాఖ్యానాన్ని స్పష్టంగా చెప్పదు; అందువల్ల దాని ఉపమానాత్మక ఉద్రిక్తతను పరిష్కరించకుండా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీర కథన శైలిని నిలుపుతూ అనువదించబడింది. గ్రీకు వాక్యంలోని వరుస చర్యలు తెలుగులో సహజంగా వినిపించే సంయుక్త క్రియలతో అందించబడ్డాయి.
