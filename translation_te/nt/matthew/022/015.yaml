id: MAT.22.15
reference: Matthew 22:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: te
  text: అప్పుడు పరిసయ్యులు వెళ్లి, ఆయనను మాట ద్వారా ఎలా చిక్కించాలో సంప్రదించుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన చెప్పిన మాటను బట్టి ఆయనను ఎలా ఉచ్చులో పడవేయాలో పథకం వేశారు.”
    reason: ἐν λόγῳకు మరింత స్పష్టమైన ‘ఆయన చెప్పిన మాటను బట్టి’ అనే ప్రత్యామ్నాయాన్నీ, συμβούλιον ἔλαβονకు సందర్భానుగుణమైన బలమైన ‘పథకం వేశారు’ అనే ప్రత్యామ్నాయాన్నీ చూపిస్తుంది.
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనను సహజంగా సూచించే సంక్షిప్త కాలవాచకం.
- source_word: πορευθέντες
  choice: వెళ్లి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన కదలికను తెలుగు కథన శైలిలో సహజమైన అసమాపక క్రియతో వ్యక్తం చేస్తుంది.
- source_word: οἱ Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూద మతవర్గానికి ఆధునిక ప్రామాణిక తెలుగులో వాడుకలో ఉన్న పేరు.
- source_word: συμβούλιον ἔλαβον
  choice: కలిసి ఆలోచించారు
  rationale: ‘సంప్రదించుకొని పథకం వేశారు’ అనే మూలభాషా నుడికారంలోని సమాలోచన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; దుష్ట ఉద్దేశాన్ని తరువాతి ఉద్దేశ వాక్యమే స్పష్టం చేస్తుంది.
- source_word: ὅπως
  choice: ఎలా … ఆలోచించారు
  rationale: వారి సమాలోచనలోని విషయాన్నీ ఉద్దేశాన్నీ తెలుగు వాక్య నిర్మాణంలో సహజంగా కలుపుతుంది.
- source_word: αὐτὸν
  choice: ఆయనను
  rationale: యేసును సూచించే సర్వనామాన్ని గౌరవప్రదమైన సాధారణ తెలుగు రూపంలో ఇస్తుంది.
- source_word: παγιδεύσωσιν
  choice: చిక్కించాలో
  rationale: వలలో పట్టడం అనే రూపకార్థాన్ని, మాట ద్వారా ఇరకాటంలో పెట్టాలనే ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν λόγῳ
  choice: మాటలో
  rationale: ఏకవచన λόγῳ యొక్క సంక్షిప్తతను నిలుపుతూ, ఆయన పలికే మాట ఆధారంగా చిక్కించాలనే భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: συμβούλιον ἔλαβον లో శత్రుత్వ తీవ్రత
  choice: ‘కలిసి ఆలోచించారు’ అని తటస్థ సమాలోచన పదబంధంతో అనువదించి, దుష్ట ఉద్దేశాన్ని ‘చిక్కించాలో’ అనే భాగంలో వ్యక్తం చేయడం.
  alternative: ‘కుట్ర పన్నారు’ అని మరింత వ్యాఖ్యానాత్మకంగా అనువదించడం.
  rationale: వచనంలో శత్రుత్వం స్పష్టమే అయినా, అది ప్రధానంగా παγιδεύσωσιν అనే ఉద్దేశ క్రియలో ఉంది. అందువల్ల సమాలోచనను సూచించే నుడికారంపై అదనపు తీవ్రతను మోపకుండా మూలంలోని విభజనను నిలుపుతుంది.
- issue: ἐν λόγῳ యొక్క అర్థ పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘మాటలో’ అని ఉంచడం.
  alternative: ‘ఆయన చెప్పే మాటను బట్టి’ అని స్పష్టీకరించడం.
  rationale: మూలంలోని సంక్షిప్తమైన, కొంత విస్తృతార్థం గల పదబంధాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సహజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన కథన శైలి. ‘కలిసి ఆలోచించారు’ సహజత్వాన్ని కాపాడుతుండగా, ‘మాటలో చిక్కించడం’ మూలంలోని వల రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
