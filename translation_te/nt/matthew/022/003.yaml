id: MAT.22.3
reference: Matthew 22:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: te
  text: తన సేవకులను[a] పంపించి, పెళ్లి విందుకు[c] ముందే ఆహ్వానించబడినవారిని[b] రమ్మని పిలిపించాడు. కానీ వారు రావడానికి ఇష్టపడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాసులను.’ గ్రీకు పదం సేవకులను లేదా దాసులను సూచించవచ్చు. ఇక్కడ రాజు ప్రతినిధులుగా వారు నిర్వర్తించే పాత్ర ప్రధానంగా ఉన్నందున ‘సేవకులను’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ముందే పిలువబడినవారిని.’ ‘పిలిపించాడు’ అనే పదానికి సంబంధించిన అదే గ్రీకు పదకుటుంబం మూలంలో ఇక్కడ మళ్లీ వస్తుంది; ఈ విందు సందర్భంలో అది ముందే ఆహ్వానం పొందినవారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘పెళ్లి వేడుకకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: పంపించి … పిలిపించాడు
  rationale: ἀποστέλλω యొక్క పంపడం అనే భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ఉంచుతుంది; ఉద్దేశార్థకమైన καλέσαιతో కలిసి రాజు తన ప్రతినిధుల ద్వారా పిలిపించినట్లు తెలియజేస్తుంది.
- source_word: δούλους
  choice: సేవకులను
  rationale: δοῦλος అంటే దాసులు లేదా సేవకులు కావచ్చు. ఈ ఉపమానంలో వారి బానిస స్థితికన్నా రాజు తరఫున పనిచేసే పాత్ర ప్రధానంగా ఉంది కాబట్టి ‘సేవకులు’ సహజంగా సరిపోతుంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: καλέσαι
  choice: రమ్మని పిలిపించాడు
  rationale: ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తూ καλέωలోని ‘పిలువు’ భావాన్ని నిలుపుతుంది. సేవకులను పంపి వారి ద్వారా పిలిచాడు అనే సందర్భానికి ‘పిలిపించాడు’ సహజమైన తెలుగు.
- source_word: κεκλημένους
  choice: ముందే ఆహ్వానించబడినవారిని
  rationale: పర్ఫెక్ట్ పాసివ్ పార్టిసిపుల్ ముందుగా జరిగిన ఆహ్వానం ఇప్పటికీ వర్తిస్తోందని సూచిస్తుంది. విందు సందర్భంలో ‘ఆహ్వానించబడినవారు’ స్పష్టంగా ఉంటుంది; గ్రీకులోని పదపునరుక్తిని సూచించే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: εἰς τοὺς γάμους
  choice: పెళ్లి విందుకు
  rationale: బహువచన రూపమైన γάμοι ఇక్కడ వివాహ వేడుకను, ముఖ్యంగా విందును సూచిస్తుంది. ‘పెళ్లి విందు’ ఉపమానంలోని సందర్భాన్ని సాధారణ పాఠకునికి స్పష్టంగా అందిస్తుంది.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: వారు రావడానికి ఇష్టపడలేదు
  rationale: వారు రాలేదని మాత్రమే కాక, రావాలనే సంకల్పం లేకపోయిందనే ἤθελον యొక్క ఇచ్ఛార్థాన్ని కాపాడుతుంది. ‘నిరాకరించారు’ అనడం మూలంలోని మాటకన్నా కొద్దిగా బలంగా ఉంటుంది.
theological_decisions:
- issue: ఉపమానంలో δοῦλος పదానికి అనువాదం
  choice: సేవకులు
  alternative: దాసులు
  rationale: ఈ వాక్యంలో వారి సామాజిక బంధిత స్థితి కాకుండా రాజు పంపిన ప్రతినిధుల పాత్ర ముందుకు వస్తుంది. అందువల్ల ‘సేవకులు’ సందర్భానుకూలంగా ఉంది; ‘దాసులు’ అనే నిజమైన అర్థసాధ్యతను పాదసూచికలో నిలిపాం.
- issue: καλέω పదకుటుంబంలోని పునరుక్తి
  choice: ‘పిలిపించాడు’ మరియు ‘ఆహ్వానించబడినవారు’
  alternative: ‘పిలువబడినవారిని … పిలిపించాడు’
  rationale: గ్రీకులో ఒకే పదకుటుంబం పునరావృతమైనా, విందు సందర్భంలో ముందటి పిలుపు ‘ఆహ్వానం’ అని తెలుగులో చెప్పడం స్పష్టంగా, సహజంగా ఉంటుంది. మరింత అక్షరానుసారమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చి మూలంలోని పునరుక్తిని దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘రమ్మని పిలిపించాడు’ అనేది సేవకులను పంపడం మరియు వారి ద్వారా అతిథులను పిలవడం అనే రెండు చర్యలను తెలుగులో సూటిగా కలుపుతుంది. ‘ఇష్టపడలేదు’ మూలంలోని సంకల్పభావాన్ని అతిశయింపకుండా నిలుపుతుంది.
