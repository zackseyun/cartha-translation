  text: Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: te
  text: బోధకుడా, ధర్మశాస్త్రంలో ఏ ఆజ్ఞ గొప్పది[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, “ధర్మశాస్త్రంలో అన్నిటికంటే గొప్ప ఆజ్ఞ ఏది?”
    reason: μεγάλη సాధారణ విశేషణ రూపంలో ఉన్నప్పటికీ, ఈ సందర్భంలో ఆజ్ఞలలో అగ్రస్థానాన్ని సూచించే అత్యుత్తమార్థం ఉండవచ్చు.
lexical_decisions:
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: యేసును నేరుగా సంబోధించే పదం. ఆధునిక తెలుగులో ‘బోధకుడా’ అనేది διδάσκαλος యొక్క సాధారణ అర్థాన్ని సహజంగా తెలియజేస్తుంది; ‘యజమానుడా’ అనే భిన్నమైన అధికార భావాన్ని రానివ్వదు.
- source_word: ποία
  choice: ఏ
  rationale: ధర్మశాస్త్రంలోని ఆజ్ఞల సమూహం నుంచి ఒకదాన్ని గుర్తించమని అడిగే ప్రశ్నార్థక విశేషణానికి తెలుగులో ‘ఏ’ సహజమైన సమానం.
- source_word: ἐντολὴ
  choice: ఆజ్ఞ
  rationale: యూదుల ధర్మశాస్త్ర సందర్భంలో దేవుడు విధించిన ఆదేశాన్ని సూచించే స్పష్టమైన, స్థిరమైన తెలుగు పదం.
- source_word: μεγάλη
  choice: గొప్పది
  rationale: గ్రీకులో స్పష్టమైన అత్యుత్తమ రూపం కాకుండా సాధారణ విశేషణ రూపమే ఉంది. ‘గొప్పది’ మూలరూపాన్ని నిలుపుతూ, సందర్భంలో ప్రాముఖ్యత లేదా అగ్రస్థానం అనే భావాన్నీ సహజంగా అనుమతిస్తుంది.
- source_word: ἐν τῷ νόμῳ
  choice: ధర్మశాస్త్రంలో
  rationale: ఇక్కడ νόμος సాధారణ చట్టాన్ని కాక యూదుల తోరా/మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది. తెలుగు బైబిలు వాడుకలో ‘ధర్మశాస్త్రం’ స్పష్టమైన, విస్తృతంగా అర్థమయ్యే పదం.
theological_decisions:
- issue: μεγάλη అనే సాధారణ విశేషణాన్ని అత్యుత్తమార్థకంగా అనువదించాలా
  choice: గొప్పది
  alternative: అన్నిటికంటే గొప్పది / అత్యంత గొప్పది
  rationale: మూల గ్రీకు రూపాన్ని ప్రధాన పాఠ్యంలో కాపాడుతూ, ఆజ్ఞలలో అగ్రస్థానాన్ని అడిగే సందర్భార్థాన్ని పాదసూచికలో చూపించాం. దీనివల్ల మూలంలోని రూపం మరియు సందర్భంలోని పోలిక భావం రెండూ నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం. ‘ధర్మశాస్త్రం’ ద్వారా తోరా అనే నిర్దిష్ట లేఖనసంపుటి సూచన స్పష్టమవుతుంది; వాక్యాన్ని అనవసరంగా మతపరమైన ప్రత్యేక పరిభాషతో భారంగా చేయలేదు.
