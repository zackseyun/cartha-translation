  to: 'అతడు మళ్లీ ఇతర దాసులను[a] పంపి, ఇలా చెప్పాడు: “ఆహ్వానించబడిన వారితో ఇలా చెప్పండి: ‘ఇదిగో, నేను నా భోజనాన్ని[b] సిద్ధం చేశాను. నా ఎద్దులను, కొవ్వబెట్టిన పశువులను వధించారు; అన్నీ సిద్ధంగా ఉన్నాయి. పెళ్లి విందుకు[c] రండి.’”'
  rationale: The revision restores the completed narrative sequence of the Greek (“sent ... saying”) and makes the instruction to the previously invited guests idiomatic Telugu. It retains the draft’s sound lexical choices, preserves the nested quotation and footnote anchors, and uses a natural unspecified-agent form for the animals’ slaughter without implying ritual sacrifice.
