id: MAT.22.4
reference: Matthew 22:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other servants[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: te
  text: 'అతడు మళ్లీ ఇతర దాసులను[a] పంపి, ఇలా చెప్పాడు: “ఆహ్వానించబడిన వారితో ఇలా చెప్పండి: ‘ఇదిగో, నేను నా భోజనాన్ని[b] సిద్ధం చేశాను. నా ఎద్దులను, కొవ్వబెట్టిన పశువులను వధించారు; అన్నీ సిద్ధంగా ఉన్నాయి. పెళ్లి విందుకు[c] రండి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇతర సేవకులను.” గ్రీకు పదం δοῦλος (దూలోస్) సందర్భాన్ని బట్టి “దాసుడు” లేదా “సేవకుడు” అని అర్థమివ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నా విందును.” గ్రీకు పదం సిద్ధం చేసిన భోజనాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “పెళ్లి వేడుకలకు.” ఇక్కడి గ్రీకు బహువచనం పెళ్లి సంబరాలన్నిటినీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: మళ్లీ
  rationale: మునుపటి చర్య పునరావృతమైందని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἄλλους δούλους
  choice: వేరే దాసులను
  rationale: ἄλλους అంటే ముందుగా పంపినవారికి అదనంగా లేదా వారికంటే వేరైన వారని సూచిస్తుంది. తెలుగు ‘దాసులు’ రాజగృహ సందర్భంలోని అధీనస్థితిని నిలుపుతూ, సేవకులు అనే సందర్భార్థాన్నీ అనుమతిస్తుంది.
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: ఆహ్వానించబడిన వారితో … చెప్పండి
  rationale: κεκλημένοις పరిపూర్ణ కర్మణి రూపం; వారు ఇప్పటికే ఆహ్వానం పొందినవారని, ఆ స్థితి ఇప్పటికీ వర్తిస్తోందని ఈ రూపం చూపిస్తుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: వినేవారి దృష్టిని తరువాతి ప్రకటనపై నిలిపే సహజమైన తెలుగు సూచనపదం.
- source_word: τὸ ἄριστόν μου
  choice: నా భోజనాన్ని
  rationale: ἄριστον సిద్ధం చేసిన భోజనాన్ని, సాధారణంగా రోజు తొలిభాగంలోని ప్రధాన భోజనాన్ని సూచించగలదు. ‘భోజనం’ కాలాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా అర్థాన్ని అందిస్తుంది.
- source_word: ἡτοίμακα
  choice: సిద్ధం చేశాను
  rationale: పరిపూర్ణ కాలంలోని పూర్తయిన సిద్ధపాటు మరియు దాని ప్రస్తుత ఫలితాన్ని తెలుగు సందర్భంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οἱ ταῦροί μου
  choice: నా ఎద్దులు
  rationale: ταῦροι కి తగిన సాధారణ తెలుగు పశుపదం; విందు కోసం ఉంచిన గోవర్గ జంతువులను సూచిస్తుంది.
- source_word: τὰ σιτιστὰ
  choice: కొవ్వబెట్టిన పశువులు
  rationale: ప్రత్యేకంగా మేపి వధకు సిద్ధం చేసిన జంతువులనే సూచిస్తుంది; మూలంలో లేని ‘దూడలు’ వంటి వయోనిర్దేశాన్ని చేర్చదు.
- source_word: τεθυμένα
  choice: వధించబడ్డాయి
  rationale: విందు కోసం జంతువులను చంపడం అనే సందర్భార్థాన్ని నిలుపుతుంది; ‘బలి ఇవ్వబడ్డాయి’ అని అనువదించి ఆచారబలి భావాన్ని అనవసరంగా దిగుమతి చేయదు. పరిపూర్ణ కర్మణి భావాన్నీ కాపాడుతుంది.
- source_word: καὶ πάντα ἕτοιμα
  choice: అన్నీ సిద్ధంగా ఉన్నాయి
  rationale: πάντα యొక్క సమగ్ర భావాన్ని సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: పెళ్లి విందుకు రండి
  rationale: γάμοι బహువచనం పెళ్లి వేడుకలను లేదా వాటితో కూడిన విందును సూచించగలదు; ఈ భోజన సందర్భంలో ‘పెళ్లి విందు’ సహజమైన ప్రధాన పాఠం.
theological_decisions:
- issue: రాజగృహ ఉపమాన సందర్భంలో δοῦλος అనువాదం
  choice: దాసులు
  alternative: సేవకులు
  rationale: δοῦλος కేవలం వేతన ఉద్యోగిని కాక యజమాని అధికారానికి లోబడిన వ్యక్తిని సూచించగలదు. రాజు గృహసందర్భంలో ‘దాసులు’ ఆ సామాజిక వాస్తవాన్ని నిలుపుతుంది; అయితే పదానికి సందర్భానుసారంగా ‘సేవకులు’ అనే అర్థం కూడా సాధ్యమని పాదటిప్పణి స్పష్టం చేస్తుంది.
- issue: τοὺς γάμους యొక్క బహువచన భావం
  choice: పెళ్లి విందు
  alternative: పెళ్లి వేడుకలు
  rationale: సిద్ధం చేసిన భోజనం గురించి సమీప సందర్భం ఉన్నందున విందు ప్రధాన పాఠంలో సహజం. అయినప్పటికీ గ్రీకు బహువచనం మొత్తం పెళ్లి సంబరాలను సూచించగల విస్తృతిని పాదటిప్పణిలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన కథనశైలి వాడబడింది. ఉల్లేఖనాల పొరలను స్పష్టంగా ఉంచాం. ‘వధించబడ్డాయి’ కొంత అధికారికమైనప్పటికీ మూలంలోని కర్మణి రూపాన్ని, విందు కోసం జరిగిన వధను ఖచ్చితంగా నిలుపుతుంది.
