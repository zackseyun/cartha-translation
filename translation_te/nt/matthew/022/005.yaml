id: MAT.22.5
reference: Matthew 22:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: te
  text: కాని వారు దాన్ని పట్టించుకోకుండా వెళ్లిపోయారు[a]—ఒకడు తన సొంత పొలానికి వెళ్లగా, మరొకడు తన వ్యాపారానికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దాన్ని లెక్కచేయకుండా’ లేదా ‘దాన్ని నిర్లక్ష్యం చేసి’; సందర్భంలో ఇది రాజు ఆహ్వానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: దాన్ని పట్టించుకోకుండా
  rationale: ἀμελέω ఇక్కడ శ్రద్ధ చూపకపోవడం లేదా నిర్లక్ష్యం చేయడం అనే భావాన్ని ఇస్తుంది. సందర్భంలో సూచించబడిన రాజు ఆహ్వానాన్ని తెలుగులో సహజంగా సూచించేందుకు ‘దాన్ని’ వాడబడింది; ‘పట్టించుకోకుండా’ వారి నిర్లక్ష్య ధోరణిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπῆλθον
  choice: వెళ్లిపోయారు
  rationale: ἀπέρχομαι తెలిపే అక్కడి నుంచి వెళ్లిపోవడం అనే కథన కదలికను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: ఒకడు ... మరొకడు
  rationale: μέν ... δέతో కూడిన విభజనాత్మక నిర్మాణాన్ని, వేర్వేరు వ్యక్తులు వేర్వేరు గమ్యాలకు వెళ్లినట్లు సహజ తెలుగులో నిలుపుతుంది.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: తన సొంత పొలానికి
  rationale: ἀγρόςకు నేరుగా ‘పొలం’ అని అనువదించి, ἴδιονలోని స్వకీయతను ‘సొంత’తో నిలిపింది.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: తన వ్యాపారానికి
  rationale: ἐμπορία ఇక్కడ వర్తకం లేదా వ్యాపార కార్యకలాపాన్ని సూచిస్తుంది. ‘వ్యాపారం’ ఆధునిక తెలుగులో సహజంగా ఉండి, వ్యవసాయ పనితో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἀμελήσαντεςకు సూచింపబడిన కర్మ
  choice: సందర్భంలోని రాజు ఆహ్వానాన్ని వారు పట్టించుకోలేదనే భావాన్ని ‘దాన్ని పట్టించుకోకుండా’ అని అనువదించడం.
  alternative: ‘నిర్లక్ష్యం చేసి’ లేదా ‘ఆహ్వానాన్ని పట్టించుకోకుండా’ అని అనువదించడం.
  rationale: గ్రీకులో కర్మ ప్రత్యక్షంగా లేదు; వెంటనే ముందున్న సందర్భం రాజు ఆహ్వానాన్ని సూచిస్తుంది. ‘దాన్ని’ అనేది ఆ సందర్భాన్ని సహజంగా అందిస్తూనే, గ్రీకు చెప్పినదానికంటే అతిగా నిర్దిష్టీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే కథన గౌరవాన్ని నిలుపుతూ రూపొందించబడింది. పునరుక్తిని నివారించకుండా చివర ‘వెళ్లాడు’ను ఉంచడం ద్వారా రెండు గమ్యాలూ ప్రధాన క్రియతో స్పష్టంగా అనుసంధానించబడ్డాయి.
