  text: λέγει αὐτοῖς· Πῶς οὖν Δαυὶδ ἐν πνεύματι ⸂καλεῖ αὐτὸν κύριον⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “అయితే దావీదు ఆత్మలో ఆయనను ప్రభువు అని ఎలా పిలుస్తున్నాడు, ఇలా చెబుతూ:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: ఆయన వారితో ఇలా అన్నాడు
  rationale: గ్రీకులోని వర్తమాన కాలం ఇక్కడ కథనంలోని చారిత్రక వర్తమానం; సహజమైన తెలుగు కథనశైలిలో భూతకాలంగా అనువదించబడింది.
- source_word: Πῶς οὖν
  choice: అయితే ... ఎలా
  rationale: πῶς యొక్క ప్రశ్నార్థక భావాన్నీ, οὖν యొక్క పూర్వ వాదం నుంచి వచ్చే అనుమానార్థక/నిర్ణయాత్మక అనుసంధానాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Δαυὶδ
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἐν πνεύματι
  choice: ఆత్మలో
  rationale: ἐν అనే విభక్తి సూచించే పరిధి లేదా సాధనం అనే రెండు సాధ్యతలను అతిగా పరిష్కరించకుండా మూల పదబంధాన్ని సమీపంగా అనుసరిస్తుంది.
- source_word: καλεῖ αὐτὸν κύριον
  choice: ఆయనను ‘ప్రభువు’ అని పిలుస్తూ
  rationale: κύριος అనే బిరుదుకు ‘ప్రభువు’ సహజమైన ప్రమాణ అనువాదం; కీర్తన 110తో ఉన్న అంతర్గ్రంథ సంబంధాన్నీ వాదంలోని బిరుదు ప్రాధాన్యాన్నీ కాపాడుతుంది.
- source_word: λέγων
  choice: ఇలా అన్నాడు
  rationale: తదుపరి వచనంలో వచ్చే ఉద్ధరణను సహజమైన తెలుగు వాక్యనిర్మాణంతో పరిచయం చేస్తుంది.
theological_decisions:
- issue: ἐν πνεύματι లోని ‘ఆత్మ’కు సూచితార్థం
  choice: ప్రధాన పాఠ్యంలో ‘ఆత్మలో’; సందర్భానుసారం పరిశుద్ధాత్మ ఉద్దేశించబడ్డాడని పాదసూచికలో తెలియజేయడం
  alternative: ‘ఆత్మ ప్రేరణతో’ లేదా ‘తన ఆత్మలో’
  rationale: లేఖన ఉద్ధరణ సందర్భం పరిశుద్ధాత్మ కార్యాన్ని బలంగా సూచించినా, గ్రీకు పదబంధం పరిధి లేదా సాధనం రెండింటినీ వ్యక్తం చేయగలదు. అందువల్ల ప్రధాన పాఠ్యం నిజమైన వ్యాకరణ అస్పష్టతను నిలుపుతుంది.
- issue: κύριος యొక్క అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: మెస్సీయ సంబంధమైన ఈ లేఖన వాదంలో ‘ప్రభువు’ బిరుదు యొక్క గంభీరతను, కీర్తన 110తో సంబంధాన్ని కాపాడుతుంది; సాధారణ ‘యజమాని’ భావాన్ని పాదసూచికలో సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, లేఖన ఉద్ధరణకు తగిన గౌరవభరిత శైలిలోనూ ఉంది. వాక్యం తరువాతి వచనంలోని ఉద్ధరణలో కొనసాగుతుందని సూచించడానికి చివర ద్విబిందువు ఉంచబడింది.
