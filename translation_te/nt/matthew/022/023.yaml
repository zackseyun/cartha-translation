id: MAT.22.23
reference: Matthew 22:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: te
  text: ఆ రోజు సద్దూకయ్యులు ఆయన దగ్గరకు వచ్చి, పునరుత్థానం లేదని చెబుతూ ఆయనను ప్రశ్నించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత స్పష్టంగా: “పునరుత్థానం లేదని చెప్పే సద్దూకయ్యులు ఆ రోజు ఆయన దగ్గరకు వచ్చి ఆయనను ప్రశ్నించారు.”'
    reason: λέγοντες అనే కృదంతాన్ని సద్దూకయ్యులను వివరించే సంబంధార్థక నిర్మాణంగా కూడా సహజంగా అనువదించవచ్చు.
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ఆ రోజు
  rationale: ఇది సహజమైన ఆధునిక తెలుగు కాలసూచక ప్రయోగం; గ్రీకు వాక్యంలోని నిర్దిష్టమైన రోజు సూచనను నిలుపుతుంది.
- source_word: προσῆλθον αὐτῷ
  choice: ఆయన దగ్గరకు వచ్చి
  rationale: προσέρχομαι అంటే ‘దగ్గరకు రావడం/సమీపించడం.’ కథన ప్రవాహంలో ‘ఆయన దగ్గరకు వచ్చి’ సహజంగా ఉంటుంది; సర్వనామం యేసును సూచిస్తుంది.
- source_word: Σαδδουκαῖοι
  choice: సద్దూకయ్యులు
  rationale: ఈ యూదు వర్గానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణను ఉపయోగించాం.
- source_word: λέγοντες
  choice: చెబుతూ
  rationale: వర్తమాన కృదంతాన్ని క్రియావిశేషణాత్మకంగా అనువదించి గ్రీకు నిర్మాణాన్ని నిలిపాం. ఇది వారి ప్రశ్నకు సంబంధించిన నేపథ్య వాదనను తెలియజేస్తుంది; వారిని ఆ అభిప్రాయం గలవారిగా స్పష్టీకరించే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: μὴ εἶναι ἀνάστασιν
  choice: పునరుత్థానం లేదని
  rationale: సద్దూకయ్యులు తిరస్కరించిన విషయాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀνάστασιν
  choice: పునరుత్థానం
  rationale: ఈ సందర్భంలో ἀνάστασιςకు స్థిరపడిన వేదాంతపరమైన తెలుగు పదం ఇది; మూలంలోని భావబలాన్ని కాపాడుతుంది.
- source_word: ἐπηρώτησαν αὐτόν
  choice: ఆయనను ప్రశ్నించారు
  rationale: ἐπερωτάωలోని అడగడం లేదా పరిశీలనాత్మకంగా ప్రశ్నించడం అనే భావాన్ని ‘ప్రశ్నించారు’ తగిన విధంగా తెలియజేస్తుంది.
theological_decisions:
- issue: సద్దూకయ్యుల పునరుత్థాన నిరాకరణను ఎలా వ్యక్తపరచాలి
  choice: పునరుత్థానం లేదని చెబుతూ
  alternative: పునరుత్థానం లేదని చెప్పే సద్దూకయ్యులు
  rationale: ప్రధాన పాఠం గ్రీకు వర్తమాన కృదంతపు క్రియావిశేషణాత్మక నిర్మాణాన్ని ప్రతిబింబిస్తుంది. ప్రత్యామ్నాయం దీనిని సద్దూకయ్యుల ప్రత్యేక అభిప్రాయంగా మరింత స్పష్టంగా చూపుతుంది. రెండూ వారి వాదనను మాత్రమే నివేదిస్తాయి; కథకుని సమ్మతిని సూచించవు, అదనపు సిద్ధాంత వివరణను చేర్చవు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ఆయన’ అనే గౌరవ సర్వనామం యేసును సూచిస్తుంది. వాక్యం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండగా, గ్రీకు కృదంతంలోని స్వల్ప నిర్మాణ సందిగ్ధతను పాదసూచికలో నిలిపాం.
