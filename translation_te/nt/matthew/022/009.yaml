id: MAT.22.9
reference: Matthew 22:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: te
  text: కాబట్టి మీరు రహదారుల కూడళ్లకు[a] వెళ్లండి, మీకు ఎదురైన వారందరినీ పెళ్లి విందుకు[b] ఆహ్వానించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రహదారులు విడిపోయే చోట్లకు” లేదా “రహదారుల బయటికి వెళ్లే దారుల వద్దకు”; గ్రీకు పదబంధం రహదారులు కలిసే, విడిపోయే లేదా బయటికి వెళ్లే ప్రదేశాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా “పెళ్లి వేడుకలకు”; ఇక్కడ అది పెళ్లి వేడుకను లేదా విందును సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: వెళ్లి
  rationale: ఆజ్ఞార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; తరువాతి ‘ఆహ్వానించండి’ అనే ప్రధాన ఆజ్ఞతో సులభంగా అనుసంధానమవుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి మాటలనుంచి వచ్చే ఫలితం లేదా నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: రహదారులు కలిసే చోట్లకు
  rationale: διέξοδοι అనే పదం రహదారులు బయటికి వెళ్లే, విడిపోయే లేదా కలిసే ప్రదేశాలను సూచించగలదు. ఈ ఎంపిక సాధారణ పాఠకులకు సహజంగా ఉండి, సందర్భంలోని బహిరంగ కూడలి భావాన్ని అందిస్తుంది.
- source_word: ὅσους ἐὰν εὕρητε
  choice: మీకు కనిపించిన వారందరినీ
  rationale: ὅσους తో ఉన్న విస్తృతమైన, సంఖ్యాపరంగా పరిమితి లేని భావాన్ని ‘వారందరినీ’ నిలుపుతుంది; εὕρητε ను సందర్భానుసారంగా సహజమైన ‘కనిపించిన’తో వ్యక్తపరుస్తుంది.
- source_word: καλέσατε
  choice: ఆహ్వానించండి
  rationale: వివాహ విందు సందర్భంలో καλέω కేవలం పిలవడం కాక ఆహ్వానించడం అనే అర్థాన్ని ఇస్తుంది.
- source_word: εἰς τοὺς γάμους
  choice: పెళ్లి విందుకు
  rationale: బహువచన రూపమైన γάμους ఇక్కడ అనేక పెళ్లిళ్లను కాక పెళ్లి వేడుకను లేదా విందును సూచించే నుడికారంగా ఉంది.
