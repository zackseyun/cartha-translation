translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. మూలంలోని రహదారి ప్రదేశానికి సంబంధించిన పదబంధపు విస్తృత అర్థాన్ని పాదటిప్పణిలో నిలిపి, ప్రధాన పాఠంలో స్పష్టతకు ప్రాధాన్యం ఇచ్చాం.
