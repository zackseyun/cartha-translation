- from: కాబట్టి మీరు రహదారులు కలిసే చోట్లకు[a] వెళ్లి, మీకు కనిపించిన వారందరినీ పెళ్లి విందుకు[b] ఆహ్వానించండి.
  to: కాబట్టి మీరు రహదారుల కూడళ్లకు[a] వెళ్లండి, మీకు ఎదురైన వారందరినీ పెళ్లి విందుకు[b] ఆహ్వానించండి.
