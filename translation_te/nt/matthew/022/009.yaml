review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inferential οὖν, the banquet-context sense of καλέσατε, and the idiomatic singular sense of εἰς τοὺς γάμους. However, «వెళ్లి» makes the first Greek imperative dependent on the second; the source has two coordinate imperatives, «Go ... and invite». The rendering of διεξόδους as places where roads meet is plausible but somewhat narrows a term that can denote road outlets, branching points, or junctions.
  naturalness: The Telugu is clear and modern. Using the finite respectful imperative «వెళ్లండి» gives a more natural and structurally faithful pair of commands. «మీకు ఎదురైన వారందరినీ» is idiomatic in this setting and communicates the open-ended scope of ὅσους ἐὰν εὕρητε without implying merely visual perception.
  terminology: «పెళ్లి విందు» appropriately communicates the wedding-banquet sense. «రహదారుల కూడళ్లు» is a readable contextual rendering for the difficult location term, while the footnote retains the relevant alternatives and avoids falsely resolving the lexical range.
  issues:
  - severity: medium
    issue: The first imperative is rendered as a conjunctive participial form.
    rationale: «వెళ్లి» means ‘having gone/go and,’ whereas πορεύεσθε is an independent present imperative coordinated with καλέσατε. «వెళ్లండి» preserves the two commands.
  - severity: low
    issue: The main-text location wording specifies only roads meeting.
    rationale: διέξοδοι τῶν ὁδῶν may refer more broadly to road outlets or branching/junction points. A junction rendering is acceptable if alternatives are retained in the note.
  revised_text: కాబట్టి మీరు రహదారుల కూడళ్లకు[a] వెళ్లండి, మీకు ఎదురైన వారందరినీ పెళ్లి విందుకు[b] ఆహ్వానించండి.
  revised_footnotes:
