- from: మా మధ్య ఏడుగురు అన్నదమ్ములు ఉండేవారు. మొదటివాడు పెళ్లి చేసుకొని చనిపోయాడు. అతనికి సంతానం[a] లేకపోవడంతో, తన భార్యను తన సోదరునికి వదిలివెళ్లాడు[b].
  to: మా మధ్య ఏడుగురు అన్నదమ్ములు ఉండేవారు. మొదటివాడు పెళ్లి చేసుకొని చనిపోయాడు; సంతానం లేక, తన భార్యను తన సోదరుని కోసం వదిలివెళ్లాడు[a].
  rationale: The two original footnotes respectively explain “సంతానం” and the customary implication of leaving the wife to the brother, but their anchors create an avoidable mismatch because the cultural note is attached after the complete clause while the lexical note is attached directly to “సంతానం.” A single anchor after the clause permits both necessary notes to be retained in one footnote and avoids a misleading split. The main text is adjusted to preserve the Greek participial construction more closely and to improve natural Telugu without making the brother's marriage explicit.
