id: MAT.22.25
reference: Matthew 22:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: te
  text: మా మధ్య ఏడుగురు అన్నదమ్ములు ఉండేవారు. మొదటివాడు పెళ్లి చేసుకొని చనిపోయాడు; సంతానం లేక, తన భార్యను తన సోదరుని కోసం వదిలివెళ్లాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘విత్తనం లేకుండా.’ ఇక్కడ ‘విత్తనం’ అంటే సంతానం లేదా వంశస్థులు. ఇది మరిది వివాహ ఆచారాన్ని సూచిస్తుంది. ఆ ఆచారం ప్రకారం, సంతానం లేకుండా చనిపోయిన వ్యక్తి సోదరుడు అతని విధవరాలిని పెళ్లి చేసుకొని, చనిపోయినవాని కోసం సంతానం కలిగించాల్సి ఉండేది; ద్వితీయోపదేశకాండము 25:5 చూడండి.
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: మా మధ్య
  rationale: παρά + దత్తివిభక్తి ఇక్కడ సమూహంలో ఉనికిని లేదా అనుబంధాన్ని సూచిస్తుంది. ‘మా మధ్య’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని భావాన్ని కాపాడుతుంది.
- source_word: ἑπτὰ ἀδελφοί
  choice: ఏడుగురు అన్నదమ్ములు
  rationale: లేవిరేట్ వివాహ సందర్భంలో ἀδελφοί ఒకే కుటుంబంలోని పురుష సహోదరులను సూచిస్తుంది. ‘అన్నదమ్ములు’ ఈ కుటుంబ సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ πρῶτος
  choice: మొదటివాడు
  rationale: πρῶτος ఇక్కడ వయస్సులో పెద్దవాడని తప్పనిసరిగా సూచించకుండా వరుసలో మొదటివాడిని సూచిస్తుంది.
- source_word: γήμας
  choice: పెళ్లి చేసుకొని
  rationale: ఈ భూతకాల అసమాపక క్రియ ప్రధాన క్రియకు ముందు జరిగిన వివాహాన్ని సూచిస్తుంది. ‘పెళ్లి చేసుకొని’ సంఘటనల క్రమాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐτελεύτησεν
  choice: చనిపోయాడు
  rationale: τελευτάω జీవితం ముగియడం, మరణించడం అనే ప్రత్యక్ష అర్థాన్ని ఇస్తుంది. ‘చనిపోయాడు’ స్పష్టమైన, సాధారణ ఆధునిక తెలుగు.
- source_word: μὴ ἔχων σπέρμα
  choice: అతనికి సంతానం లేకపోవడంతో
  rationale: σπέρμα అక్షరార్థంగా ‘విత్తనం’ అయినా, ఈ కుటుంబ-న్యాయ సందర్భంలో సంతతిని సూచిస్తుంది. ‘సంతానం’ పిల్లలు లేదా వంశస్థులు అనే విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: తన భార్యను … వదిలివెళ్లాడు
  rationale: ἀφίημι ఇక్కడ విడాకులు ఇవ్వడం లేదా పరిత్యజించడం కాక, మరణించినప్పుడు భార్యను వెనుక వదిలిపోవడాన్ని సూచిస్తుంది. ‘వదిలివెళ్లాడు’ ఆ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: తన సోదరునికి
  rationale: దత్తివిభక్తి, మృతుని భార్య ఎవరి కోసం లేదా ఎవరి వద్ద వదిలివేయబడిందో సూచిస్తుంది. ‘తన సోదరునికి’ మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
theological_decisions:
- issue: లేవిరేట్ వివాహ నేపథ్యాన్ని ప్రధాన వచనంలో స్పష్టంగా చేర్చాలా?
  choice: గ్రీకు మూలం చెప్పినంతవరకే ఉంచి, వివాహ ఉద్దేశాన్ని ప్రధాన వచనంలో పరోక్షంగానే ఉంచడం.
  alternative: ‘తన భార్యను పెళ్లి చేసుకోవడానికి తన సోదరునికి వదిలివెళ్లాడు’ అని విస్తరించడం.
  rationale: ద్వితీయోపదేశకాండము 25:5లోని లేవిరేట్ ఆచారం ఇక్కడ ఊహించబడినా, గ్రీకు వాక్యంలో ‘పెళ్లి చేసుకోవడానికి’ అనే మాట స్పష్టంగా లేదు. అందువల్ల ప్రధాన వచనం మూలంలోని సంక్షిప్తతను కాపాడుతుంది; సాంస్కృతిక నేపథ్యం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘అన్నదమ్ములు’ కుటుంబ సంబంధాన్ని సహజంగా తెలియజేస్తే, తరువాతి ఏకవచన ప్రస్తావనలో ‘సోదరుడు’ స్పష్టతను నిలుపుతుంది. ‘వదిలివెళ్లాడు’ అనే రూపం విడాకులు లేదా ఉద్దేశపూర్వక పరిత్యాగం అనే అపార్థాన్ని తగ్గిస్తూ, మరణంతో భార్య వెనుక మిగిలిన భావాన్ని అందిస్తుంది.
