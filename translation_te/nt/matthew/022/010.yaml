id: MAT.22.10
reference: Matthew 22:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those servants went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: te
  text: ఆ దాసులు దారుల్లోకి వెళ్లి, తమకు కనిపించిన వారందరినీ—చెడ్డవారినీ[a] మంచివారినీ—ఒకచోట చేర్చారు. అలా పెళ్లి విందు[c] భోజనానికి వాలి కూర్చున్న అతిథులతో[b] నిండిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దుష్టులనూ మంచివారినీ.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, ఆ కాలపు అధికారిక విందుల ఆచారం ప్రకారం భోజనం చేయడానికి ఆనుకుని లేదా వాలి కూర్చున్నవారు.
    reason: cultural_note
  - marker: c
    text: గ్రీకులో “పెళ్లి.” ఇక్కడ అది భోజనార్థులతో నిండిందని చెప్పబడినందున, ఈ పదం పెళ్లి విందును సూచిస్తుంది; సందర్భంలో విందు జరిగే స్థల భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: దాసులు
  rationale: రాజు అధీనంలో ఉన్న గృహ దాసుల సామాజిక స్థితిని మెత్తబరచకుండా, ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁδοὺς
  choice: దారులు
  rationale: ప్రజలు కనిపించే బహిరంగ మార్గాలు అనే విస్తృత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; కేవలం పట్టణ వీధులు లేదా పెద్ద రహదారులు అనే భావానికి పరిమితం చేయదు.
- source_word: συνήγαγον
  choice: సమకూర్చారు
  rationale: వారు కనుగొన్న ప్రజలను ఒకచోటికి చేర్చారనే కథనార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πάντας οὓς εὗρον
  choice: తమకు కనిపించిన వారందరినీ
  rationale: πάντας అనే సమగ్రతను, οὓς εὗρον అనే సంబంధ వాక్యభావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: చెడ్డవారినీ మంచివారినీ
  rationale: నైతిక వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ఆహ్వానం ఎలాంటి వారికైనా చేరిందనే ఆశ్చర్యకర విస్తృతిని కాపాడుతుంది.
- source_word: γάμος
  choice: పెళ్లి విందు మందిరం
  rationale: γάμος పెళ్లిని లేదా పెళ్లి విందును సూచించగలదు; అది భోజనార్థులతో నిండిందని చెప్పబడటం వల్ల ఇక్కడ విందు జరిగే స్థలాన్ని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: ἐπλήσθη
  choice: నిండిపోయింది
  rationale: స్థలం పూర్తిగా నిండిన ఫలితస్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: ἀνακειμένων
  choice: భోజనానికి వాలికూర్చున్న అతిథులు
  rationale: ప్రాచీన విందుల్లో భోజనం చేసేటప్పుడు ఆనుకుని లేదా వాలి కూర్చునే ఆచారాన్ని, కేవలం ‘పడుకున్నవారు’ అనే అపార్థం రాకుండా సందర్భంతో సహా తెలియజేస్తుంది.
theological_decisions:
- issue: సమకూర్చబడినవారి నైతిక స్వభావం
  choice: చెడ్డవారినీ మంచివారినీ
  alternative: దుష్టులనూ మంచివారినీ
  rationale: ఆహ్వానం విచక్షణ లేకుండా విస్తరించినట్లు వచనం చెబుతుంది; అయితే విందుకు హాజరవడమే తుది ఆమోదమని నిర్ణయించదు. ఈ అనువాదం తరువాతి ఉపమానంలోని ఉద్రిక్తతను ముందుగానే పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని వరుసను సాధ్యమైనంతవరకు నిలుపుతూ, భోజన భంగిమను అపార్థం కాకుండా స్వల్పంగా స్పష్టం చేశాం.
