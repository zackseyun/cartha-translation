revisions:
- from: ఆ దాసులు దారుల్లోకి వెళ్లి, తమకు కనిపించిన వారందరినీ—చెడ్డవారినీ[a] మంచివారినీ—సమకూర్చారు. భోజనానికి వాలికూర్చున్న అతిథులతో[b] పెళ్లి విందు మందిరం[c] నిండిపోయింది.
  to: ఆ దాసులు దారుల్లోకి వెళ్లి, తమకు కనిపించిన వారందరినీ—చెడ్డవారినీ[a] మంచివారినీ—ఒకచోట చేర్చారు. అలా పెళ్లి విందు[c] భోజనానికి వాలి కూర్చున్న అతిథులతో[b] నిండిపోయింది.
  rationale: The revision retains the narrative and moral contrast while removing an unwarranted restriction of γάμος to a hall. It also improves modern Telugu idiom and corrects the spacing of the banquet-posture expression. The footnote preserves the contextual possibility of the venue without making it the main-text meaning.
  reviewer_model: gpt-5.6-terra
