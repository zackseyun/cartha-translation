id: MAT.22.24
reference: Matthew 22:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς εἶπεν· Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “బోధకుడా, మోషే ఇలా చెప్పాడు: ‘ఒక పురుషుడు పిల్లలు లేకుండా చనిపోతే, అతని సోదరుడు చనిపోయిన ఆ వ్యక్తి భార్యను వివాహం చేసుకొని[a], తన మరణించిన సోదరుని కోసం సంతానం కలిగించాలి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత అధికారికంగా: “విధవరాలి విషయంలో భర్త సోదరుని కర్తవ్యాన్ని నిర్వర్తించాలి.” గ్రీకు క్రియ ప్రత్యేకంగా మరణించిన సోదరుని విధవరాలిని అతని సోదరుడు వివాహం చేసుకునే ఆచారాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: యేసును బోధించే వ్యక్తిగా నేరుగా సంబోధించే పదం; ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: Ἐάν τις ἀποθάνῃ
  choice: ఒక పురుషుడు ... చనిపోతే
  rationale: చర్చలో ఉన్న మోషే ధర్మశాస్త్ర సంబంధమైన సందర్భం పురుషుని మరణం, అతని సోదరుని బాధ్యత గురించి ప్రత్యేకంగా చెబుతోంది; అందువల్ల లింగాన్ని తటస్థం చేయలేదు.
- source_word: μὴ ἔχων τέκνα
  choice: పిల్లలు లేకుండా
  rationale: τέκνα సాధారణంగా పిల్లలను సూచిస్తుంది; కుమారులకు మాత్రమే పరిమితం కాదు. ఈ రూపం తెలుగులో సహజంగా ఉంది.
- source_word: ἐπιγαμβρεύσει
  choice: వివాహం చేసుకొని
  rationale: ఈ క్రియ ప్రత్యేకంగా మరణించిన సోదరుని విధవరాలిని వివాహం చేసుకునే దేవర న్యాయాన్ని సూచిస్తుంది. ప్రధాన వాక్యంలో సహజమైన అర్థాన్ని ఇచ్చి, ప్రత్యేక న్యాయపరమైన భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: అతని భార్యను
  rationale: గ్రీకు వాక్య నిర్మాణాన్ని నేరుగా అనుసరిస్తుంది; సందర్భంలో ఆమె మరణించిన వ్యక్తి విధవరాలని స్పష్టమవుతుంది.
- source_word: ἀναστήσει σπέρμα
  choice: సంతానం కలిగించాలి
  rationale: ఇది మరణించిన సోదరుని వంశాన్ని కొనసాగించే దేవర న్యాయ సంబంధమైన నుడికారం. అక్షరార్థమైన ‘విత్తనాన్ని లేపాలి’ కంటే ఈ అనువాదం ఆధునిక తెలుగులో అర్థవంతంగా ఉంది.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: తన సోదరునికి
  rationale: దత్తి విభక్తి సంతానం మరణించిన సోదరుని పేరున లేదా అతని పక్షాన లెక్కించబడుతుందనే భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ధర్మశాస్త్ర ఉదాహరణలో లింగ నిర్దిష్టత
  choice: ‘ఒక పురుషుడు’, ‘అతని సోదరుడు’ అని లింగ నిర్దిష్టంగా అనువదించడం
  alternative: ‘ఒక వ్యక్తి’, ‘ఆ వ్యక్తి సోదరుడు’ అని లింగ తటస్థంగా అనువదించడం
  rationale: ఈ వాక్యం పురుష కుటుంబ పాత్రలతో నిర్మితమైన దేవర న్యాయాన్ని ఉటంకిస్తోంది. మూలంలోని ఉద్దేశపూర్వక లింగ నిర్దిష్టతను నిలిపాం.
- issue: ἀναστήσει σπέρμα యొక్క వంశపరమైన భావం
  choice: ‘తన సోదరునికి సంతానం కలిగించాలి’
  alternative: ‘తన సోదరుని వంశాన్ని నిలబెట్టాలి’
  rationale: మూలంలోని సంతానోత్పత్తి భావాన్ని ప్రత్యక్షంగా ఉంచుతూ, ఆ సంతానం మరణించిన సోదరుని పేరున లెక్కించబడే న్యాయపరమైన సంబంధాన్ని కాపాడుతుంది; ‘వంశం’ అని మాత్రమే చెప్పి భావాన్ని విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మోషే ధర్మశాస్త్రపు ఉటంకింపుకు తగిన విధంగా ‘కలిగించాలి’ అనే విధ్యర్థక రూపం వాడబడింది. సాంకేతికమైన దేవర న్యాయ భావాన్ని ప్రధాన వాక్యాన్ని భారంగా చేయకుండా పాదసూచికలో నిలిపాం.
