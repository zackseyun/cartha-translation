id: MAT.22.12
reference: Matthew 22:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: te
  text: అప్పుడు రాజు అతనితో, “మిత్రమా, వివాహ విందు వస్త్రం లేకుండా నీవు ఇక్కడికి ఎలా వచ్చావు?” అని అడిగాడు. అయితే అతడు నోరు మెదపలేకపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “అతడు మౌనింపబడాడు.” గ్రీకు క్రియకు అక్షరార్థంగా “మూతి వేయడం” అనే భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: మిత్రమా
  rationale: ఇది సంబోధన పదం. మత్తయి సువార్తలో మర్యాదతో కూడినప్పటికీ కొంత దూరాన్ని, గద్దింపు ఛాయను కలిగిస్తుంది. ‘మిత్రమా’ సహజంగా ఉండి, అతిగా ఆప్యాయతను గానీ శత్రుత్వాన్ని గానీ చేర్చదు.
- source_word: πῶς
  choice: ఎలా
  rationale: ఈ క్రియావిశేషణం కారణం కంటే ప్రవేశించిన తీరు లేదా సాధ్యతను ప్రశ్నిస్తుంది; అందువల్ల ‘ఎందుకు’ కంటే ‘ఎలా’ మూలానికి దగ్గరగా ఉంటుంది.
- source_word: εἰσῆλθες ὧδε
  choice: నీవు ఇక్కడికి ... వచ్చావు
  rationale: అయోరిస్ట్ రూపం పూర్తయిన ప్రవేశాన్ని సూచిస్తుంది. తెలుగులో ‘ఇక్కడికి వచ్చావు’ సహజంగా ఉండి, ఈ స్థలంలోకి ప్రవేశించిన భావాన్ని సందర్భం స్పష్టం చేస్తుంది.
- source_word: μὴ ἔχων
  choice: లేకుండా
  rationale: వస్త్రం లేని పరిస్థితిలో ప్రవేశించడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔνδυμα γάμου
  choice: పెళ్లి వస్త్రం
  rationale: వివాహ విందుకు సంబంధించిన ఏకవచన వస్త్రాన్ని సూచిస్తుంది; దాని నిర్దిష్ట రూపాన్ని ‘అంగీ’ లేదా ‘వస్త్రాలు’ అని అనవసరంగా నిర్ణయించదు.
- source_word: ἐφιμώθη
  choice: నోరు మెదపలేకపోయాడు
  rationale: φιμόω యొక్క నిష్క్రియ రూపానికి అక్షరార్థంగా ‘మూతి కట్టబడడం,’ సందర్భానుసారంగా ‘మాట్లాడలేని స్థితికి రావడం’ అనే భావాలున్నాయి. ప్రశ్నకు సమాధానం చెప్పలేని ఫలితాన్ని ఈ సహజ తెలుగు నుడికారం తెలియజేస్తుంది; అక్షరార్థ ఛాయను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: సరైన వస్త్రం ధరించని అతిథిని యజమాని సంబోధించిన తీరు
  choice: మర్యాదతో ఉన్నప్పటికీ పరోక్ష గద్దింపు కలిగిన ‘మిత్రమా’
  alternative: ‘సహచరుడా’ వంటి మరింత దూరాన్ని సూచించే సంబోధన
  rationale: గ్రీకు పదంలో ఉన్న కథన ఉద్రిక్తతను నిలుపుతూ, దానిలో లేనంత ఆప్యాయతను లేదా తిరస్కారాన్ని అనువాదం చేర్చదు.
- issue: ἐφιμώθη యొక్క భావం
  choice: ఫలితాన్ని తెలిపే ‘నోరు మెదపలేకపోయాడు’
  alternative: మరింత అక్షరార్థంగా ‘అతని నోరు మూయబడింది’
  rationale: ప్రధాన పాఠంలో సహజమైన ఆధునిక తెలుగును వాడుతూ, గ్రీకు నిష్క్రియ క్రియలోని బలమైన రూపకాన్ని పాదసూచికలో భద్రపరుస్తుంది; అతడు ఉద్దేశపూర్వకంగా మౌనం వహించాడని నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పెళ్లి’ సాధారణ ఆధునిక రూపం; ‘వస్త్రం’ సందర్భానికి తగిన గంభీరతను నిలుపుతుంది. ప్రశ్నలోని ‘ఎలా’ మరియు చివరి వాక్యంలోని అసమర్థత మూలపాఠంలోని ఉద్రిక్తతను పరిష్కరించకుండా అలాగే ఉంచుతాయి.
