id: MAT.22.16
reference: Matthew 22:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: te
  text: 'వారు తమ శిష్యులను హేరోదీయులతో[a] కలిసి ఆయన దగ్గరికి ఇలా చెప్పమని పంపారు: “బోధకుడా, నీవు సత్యవంతుడివనీ, దేవుని మార్గాన్ని సత్యానుసారంగా బోధిస్తావనీ మాకు తెలుసు. నీవు ఎవరి ప్రభావానికీ లోనుకావు; ఎందుకంటే నీవు మనుషుల ముఖం చూసి వ్యవహరించవు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “హేరోదీయులు” అంటే హేరోదు వంశపు పరిపాలనకు మద్దతిచ్చిన రాజకీయ వర్గానికి చెందినవారు.
    reason: historical_context
  - marker: b
    text: అంటే, “నీవు మనుషుల విషయంలో పక్షపాతం చూపవు” లేదా “వారి హోదాను బట్టి వ్యవహరించవు.”
    reason: idiom_clarification
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: పంపి
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగు కథన శైలికి సహజమైన భూతకాల ప్రధాన క్రియతో అనుసంధానించే అసమాపక రూపంగా ఇచ్చాం.
- source_word: μαθητὰς
  choice: శిష్యులను
  rationale: సువార్తల సందర్భంలో నేర్చుకుంటూ అనుసరించేవారిని సూచించే స్థిరమైన, సహజమైన తెలుగు పదం.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: హేరోదు పక్షంవారితో కలిసి
  rationale: Ἡρῳδιανοί అనేది హేరోదీయ రాజకీయ వర్గానికి మద్దతిచ్చేవారిని సూచిస్తుంది; కేవలం లిప్యంతరీకరణకన్నా ఈ భావం సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: సంబోధనలో గురువు/బోధకుడు అనే సాధారణ అర్థాన్ని గౌరవప్రదంగా, అతిశయ హోదా జోడించకుండా తెలియజేస్తుంది.
- source_word: ἀληθὴς
  choice: సత్యవంతుడివి
  rationale: ఇక్కడ యేసు మాటలకే కాక ఆయన స్వభావానికీ సంబంధించిన నిజాయితీని సూచించే విధంగా అనువదించాం.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: దేవుని మార్గాన్ని
  rationale: దేవుడు కోరే జీవన విధానం అనే విస్తృత రూపకార్థాన్ని అలాగే ఉంచుతుంది.
- source_word: ἐν ἀληθείᾳ
  choice: సత్యంగా
  rationale: సత్యానికి అనుగుణంగా బోధించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: నీవు ఎవరి ప్రభావానికీ లోనుకావు
  rationale: ఎవరిపట్లా శ్రద్ధలేదనే తప్పుదోవ పట్టించే అక్షరార్థాన్ని నివారించి, ఎవరి స్థాయి లేదా అభిప్రాయం చేత ప్రభావితం కాడనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: నీవు మనుషుల ముఖం చూసి తీర్పు చెప్పవు
  rationale: గ్రీకు ముఖం చూడడం అనే నుడికారపు రూపాన్ని కొంత నిలిపి, పక్షపాతం చూపకపోవడం అనే అర్థాన్ని తెలుగులో గ్రాహ్యంగా చేస్తుంది.
theological_decisions:
- issue: మానవుల ముఖం చూడడం అనే పక్షపాత నుడికారం
  choice: నీవు మనుషుల ముఖం చూసి తీర్పు చెప్పవు
  alternative: నీవు మనుషుల విషయంలో పక్షపాతం చూపవు
  rationale: మూలంలోని πρόσωπον రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది బాహ్యరూప పరిశీలన మాత్రమే కాక సామాజిక హోదా ఆధారంగా పక్షపాతం చూపడాన్ని సూచిస్తుందని పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: οὐ μέλει σοι περὶ οὐδενός యొక్క భావం
  choice: నీవు ఎవరి ప్రభావానికీ లోనుకావు
  alternative: నీవు ఎవరి గురించీ పట్టించుకోవు
  rationale: ప్రత్యామ్నాయం యేసు ప్రజల పట్ల నిర్లక్ష్యంగా ఉంటాడనే అనుచిత భావాన్ని కలిగించవచ్చు. సందర్భం ఆయన ఎవరి ప్రతిష్ఠ, అభిప్రాయం చేతా వశంకాడనే విషయాన్ని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని నుడికారాన్ని సాధ్యమైనంతవరకు నిలిపినా, తెలుగులో యేసు నిర్లక్ష్యుడిగా వినిపించే అక్షరార్థాన్ని నివారించాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
