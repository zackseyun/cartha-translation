  to: 'వారు తమ శిష్యులను హేరోదీయులతో[a] కలిసి ఆయన దగ్గరికి ఇలా చెప్పమని పంపారు: “బోధకుడా, నీవు సత్యవంతుడివనీ, దేవుని మార్గాన్ని సత్యానుసారంగా బోధిస్తావనీ మాకు తెలుసు. నీవు ఎవరి ప్రభావానికీ లోనుకావు; ఎందుకంటే నీవు మనుషుల ముఖం చూసి వ్యవహరించవు[b].”'
