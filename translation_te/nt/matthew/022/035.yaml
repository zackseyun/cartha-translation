  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: te
  text: వారిలో ఒక ధర్మశాస్త్ర నిపుణుడు[a] ఆయనను పరీక్షిస్తూ ప్రశ్నించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ధర్మశాస్త్ర పండితుడు.’ ఈ గ్రీకు పదం యూదుల ధర్మశాస్త్రంలో నిపుణుడైన వ్యక్తిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: తెలుగులో ఈ వాక్యాన్ని సహజంగా కొనసాగించడానికి ఆరంభంలోని సాధారణ సంధానార్థక καὶని ప్రత్యేకంగా పలకనవసరం లేదు; సందర్భ సంబంధం అలాగే నిలుస్తుంది.
- source_word: ἐπηρώτησεν
  choice: ప్రశ్నించాడు
  rationale: ‘అడిగాడు/ప్రశ్నించాడు’ అనే అర్థాన్ని సహజమైన, సంక్షిప్తమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలో లేని ‘ఒక ప్రశ్న’ అనే నామవాచకాన్ని చేర్చదు.
- source_word: εἷς ἐξ αὐτῶν
  choice: వారిలో ఒక
  rationale: ఇప్పుడే ప్రస్తావించిన సమూహానికి అతడు చెందినవాడనే భాగార్థక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: νομικὸς
  choice: ధర్మశాస్త్ర నిపుణుడు
  rationale: ఇక్కడ సాధారణ న్యాయవాది కాక, యూదుల ధర్మశాస్త్రంలో నిపుణుడని స్పష్టపరుస్తుంది; ఆధునిక పాఠకునికి అపార్థం కలగకుండా చేస్తుంది.
- source_word: πειράζων
  choice: పరీక్షిస్తూ
  rationale: క్రియతో సమకాలికమైన ఉద్దేశం లేదా విధానాన్ని నిలుపుతుంది. ‘శోధిస్తూ’ అనే పదం పాపానికి ప్రలోభపెట్టడం అనే సంకుచిత భావాన్ని కలిగించవచ్చు; ‘పరీక్షిస్తూ’ మూలంలోని ప్రతికూల పరిశీలన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: యేసును సూచించే ప్రత్యక్ష కర్మను గౌరవప్రదమైన ఆధునిక తెలుగు సర్వనామంతో తెలియజేస్తుంది.
theological_decisions:
- issue: πειράζων పదం యేసుకు సంబంధించి తెలిపే భావం
  choice: పరీక్షిస్తూ
  alternative: శోధిస్తూ / ప్రలోభపెడుతూ
  rationale: గ్రీకు పదానికి పరీక్షించడం, ప్రయత్నించడం, శోధించడం వంటి భావాలు ఉండవచ్చు. ఈ కథన సందర్భంలో దుష్టకార్యానికి ప్రలోభపెట్టడం కంటే ప్రతికూల ఉద్దేశంతో పరిశీలించడం లేదా చిక్కులో పెట్టేలా పరీక్షించడం ప్రధాన భావం; అయినా ఉద్దేశాన్ని మరీ విస్తరించి వ్యాఖ్యానించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదంగా మరియు సంక్షిప్తంగా రూపొందించబడింది. ‘న్యాయవాది’ అనే ఆధునిక వృత్తిపరమైన అపార్థాన్ని నివారించేందుకు ‘ధర్మశాస్త్ర నిపుణుడు’ ఎంచుకోబడింది.
