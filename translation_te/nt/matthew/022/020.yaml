  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/020.yaml
  text: And he said to them[a], “Whose image is this, and whose inscription?”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “ఈ ప్రతిరూపం, ఈ శాసనం ఎవరివి?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరానుసారంగా: “ఈ ప్రతిరూపం మరియు శాసనం ఎవరివి?” గ్రీకులోని షష్ఠీవిభక్తి ప్రశ్నార్థక పదం యాజమాన్యాన్ని లేదా సంబంధాన్ని అడుగుతుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: అడిగాడు
  rationale: గ్రీకులో అక్షరార్థంగా ‘చెబుతున్నాడు’ అనే చారిత్రక వర్తమాన కాలం ఉంది; ఇక్కడ ప్రశ్నను పరిచయం చేస్తున్నందున ఆధునిక తెలుగు కథనంలో ‘అడిగాడు’ సహజంగా ఉంటుంది.
- source_word: αὐτοῖς
  choice: వారితో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో తెలిపే దత్తివాచక బహువచన సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: Τίνος
  choice: ఎవరివి
  rationale: సంబంధం లేదా యాజమాన్యాన్ని ప్రశ్నించే గ్రీకు షష్ఠీవిభక్తి ప్రశ్నార్థక పదాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εἰκών
  choice: రూపం
  rationale: నాణెంపై ఉన్న వ్యక్తి ప్రతిరూపాన్ని సూచిస్తుంది; ‘రూపం’ సాధారణ పాఠకులకు సహజంగా ఉండి మూలపద భావాన్ని నిలుపుతుంది.
- source_word: αὕτη
  choice: ఈ
  rationale: దగ్గరలో చూపబడుతున్న నాణెంపైని రూపాన్ని సూచించే నిర్దేశక పదం.
- source_word: ἐπιγραφή
  choice: శాసనం
  rationale: నాణెంపై చెక్కబడిన వ్రాతను ఖచ్చితంగా, సంక్షిప్తంగా సూచించే ఆధునిక ప్రామాణిక తెలుగు పదం.
- source_word: καὶ
  choice: —
  rationale: తెలుగులో ఒకే ప్రశ్నలోని రెండు నామపదాలను కామాతో సహజంగా అనుసంధానించవచ్చు; ప్రతి దానికి ‘ఈ’ మరియు చివరలో బహువచన ప్రశ్నారూపం ఉండటం మూలంలోని సంయోజన సంబంధాన్ని స్పష్టం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు కథనానికి సహజమైన భూతకాలంగా ఇచ్చి, ప్రశ్నార్థక క్రియ కావడంతో ‘అడిగాడు’ అని అనువదించబడింది.
