    text: 'మరింత అక్షరానుసారంగా: “ఈ ప్రతిరూపం మరియు శాసనం ఎవరివి?” గ్రీకులోని షష్ఠీవిభక్తి ప్రశ్నార్థక పదం యాజమాన్యాన్ని లేదా సంబంధాన్ని అడుగుతుంది.'
    reason: lexical_alternative
