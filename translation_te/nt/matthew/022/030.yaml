id: MAT.22.30
reference: Matthew 22:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: te
  text: ఎందుకంటే, పునరుత్థానంలో[a] వారు పెళ్లి చేసుకోరు, పెళ్లికి ఇవ్వబడరు; పరలోకంలోని దేవుని దూతల్లా ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పునరుత్థానం జరిగినప్పుడు.’
    reason: ἐν ... τῇ ἀναστάσει అనే పదబంధం పునరుత్థాన జీవనస్థితితో పాటు పునరుత్థానం జరిగే సమయాన్ని కూడా సూచించగలదు.
lexical_decisions:
- source_word: ἐν ... τῇ ἀναστάσει
  choice: పునరుత్థానంలో
  rationale: ఈ పదబంధం పునరుత్థానం తరువాతి జీవనస్థితిని లేదా ఆ సమయాన్ని సూచించగలదు. ‘పునరుత్థానంలో’ అనేది గ్రీకు విభక్త్యర్థాన్ని నిలుపుతూ తరువాత చెప్పబడే నిరంతర స్థితికి సహజంగా సరిపోతుంది.
- source_word: γαμοῦσιν
  choice: పెళ్లి చేసుకోరు
  rationale: వివాహంలో ప్రవేశించడాన్ని సూచించే సాధారణ క్రియ. ఆధునిక సాధారణ తెలుగు వాడుకలో ‘పెళ్లి చేసుకోరు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: γαμίζονται
  choice: పెళ్లికి ఇవ్వబడరు
  rationale: కర్మణి రూపాన్ని, అలాగే ముందున్న ‘పెళ్లి చేసుకోరు’ అనే క్రియతో గ్రీకులో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: ὡς
  choice: దూతల్లా
  rationale: ఇది సాదృశ్యాన్ని సూచిస్తుంది, సమాన అస్తిత్వాన్ని కాదు. పునరుత్థానమైనవారు దూతలుగా మారతారని కాక, ఈ విషయంలో వారిలా ఉంటారని తెలియజేస్తుంది.
- source_word: ἄγγελοι θεοῦ
  choice: దేవుని దూతలు
  rationale: మూలంలోని θεοῦ అనే సంబంధపదాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: ἐν τῷ οὐρανῷ
  choice: పరలోకంలోని
  rationale: ఇక్కడ οὐρανός భౌతిక ఆకాశాన్ని కాక దేవదూతల నివాసమైన పరలోకాన్ని సూచిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు ఈ వాక్యం కారణం లేదా వివరణ ఇస్తోందనే సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: దూతలతో పోలిక స్వభావం
  choice: పునరుత్థానమైనవారు వివాహం చేసుకోని విషయంలో దేవుని దూతల్లా ఉంటారు.
  alternative: వారు దూతలుగా మారతారు లేదా అన్ని విధాలా దూతల అస్తిత్వాన్ని పొందుతారు.
  rationale: ὡς సాదృశ్యాన్ని సూచిస్తుంది. సమీప సందర్భంలో పోలికకు సంబంధించిన అంశం వివాహం లేకపోవడమే; అందువల్ల అనువాదం సాదృశ్యాన్ని నిలుపుతుంది కానీ అస్తిత్వపరమైన మార్పును చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సహజంగా ఉండే ‘పెళ్లి’ అనే పదాన్ని ఉపయోగించాం. ‘పరలోకం’ ద్వారా భౌతిక ఆకాశం అనే అపార్థాన్ని నివారించాం. వాక్యానికి గౌరవప్రదమైన, స్పష్టమైన శైలిని నిలిపాం.
