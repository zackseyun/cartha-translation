  text: ὕστερον δὲ πάντων ἀπέθανεν ⸀ἡ γυνή.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/027.yaml
  text: Last of all[a], the woman died.
translation:
  language: te
  text: చివరికి వారందరి తరువాత ఆ స్త్రీ కూడా చనిపోయింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον δὲ πάντων
  choice: చివరికి వారందరి తరువాత
  rationale: ὕστερον మరియు πάντων కలిసి సంఘటనల క్రమంలో ‘అందరి తరువాత/చివరికి’ అనే భావాన్ని ఇస్తాయి. δέ ఇక్కడ స్వల్ప అనుసంధానకంగా ఉండి, సహజమైన తెలుగు వాక్యనిర్మాణంలో ప్రత్యేక పదంగా అనువదించనవసరం లేదు.
- source_word: ἀπέθανεν
  choice: చనిపోయింది
  rationale: ఈ క్రియ మరణాన్ని సరళంగా, ప్రత్యక్షంగా తెలియజేస్తుంది; భావాన్ని మృదువుచేసే సభ్యోక్తిని ఉపయోగించలేదు.
- source_word: ἡ γυνή
  choice: ఆ స్త్రీ
  rationale: γυνήకు ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉండవచ్చు. అనేకమంది సోదరులతో వరుసగా వివాహమైన వ్యక్తిని సూచించే ఈ సందర్భంలో ‘ఆ స్త్రీ’ గ్రీకు పదంలోని తటస్థతను కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యం. ‘కూడా’ మూలంలోని వరుస ముగింపు భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
