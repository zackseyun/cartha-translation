id: MAT.22.31
reference: Matthew 22:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: te
  text: 'చనిపోయినవారి పునరుత్థానం గురించి, దేవుడు మీకు చెప్పినదాన్ని మీరు చదవలేదా? ఆయన ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: గురించి
  rationale: περί + షష్ఠీ విభక్తి చర్చలోని అంశాన్ని పరిచయం చేస్తుంది; δέ అంశమార్పును సూచిస్తుంది. తెలుగులో వాక్యనిర్మాణం సహజంగా ఉండేందుకు ప్రత్యేక సంధానపదాన్ని చేర్చకుండా ‘గురించి’తో అంశాన్ని చూపించాం.
- source_word: ἀναστάσεως
  choice: పునరుత్థానం
  rationale: ఇక్కడ చనిపోయినవారు తిరిగి లేపబడటాన్ని సూచించే ప్రామాణికమైన, స్పష్టమైన పదం.
- source_word: τῶν νεκρῶν
  choice: చనిపోయినవారి
  rationale: షష్ఠీ నిర్మాణాన్ని నేరుగా నిలుపుతూ, పునరుత్థానం పొందే వర్గంగా మృతులను సూచిస్తుంది.
- source_word: οὐκ ἀνέγνωτε
  choice: మీరు చదవలేదా?
  rationale: ప్రశ్నారూపంలోని ప్రతికూల ఏరిస్టును సహజమైన తెలుగు అలంకారిక ప్రశ్నగా అందిస్తుంది.
- source_word: τὸ ῥηθὲν
  choice: చెప్పిన మాటను
  rationale: నామవాచకంగా పనిచేసే కర్మణి భూతకృదంత భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑμῖν
  choice: మీతో
  rationale: ఈ సందర్భంలో దైవవాక్యం శ్రోతలను ఉద్దేశించి పలికిందనే పరోక్ష కర్మ భావాన్ని ‘మీతో’ సహజంగా తెలియజేస్తుంది.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: దేవుడు
  rationale: గ్రీకులోని కర్మణి ప్రయోగకర్తను తెలుగులో సహజమైన కర్తరి నిర్మాణంగా మార్చినా, మాటకు దైవమే కర్త అనే భావం పూర్తిగా నిలుస్తుంది.
- source_word: λέγοντος
  choice: 'ఆయన ఇలా అన్నాడు:'
  rationale: తదుపరి వచనంలోని ప్రత్యక్ష ఉల్లేఖనాన్ని పరిచయం చేస్తుంది; తెలుగులో అసంపూర్ణంగా వినిపించే ‘అంటూ’ కంటే వచనాంతంలో ఇది సహజం.
theological_decisions:
- issue: దైవ కర్తృత్వం మరియు లేఖనపు ప్రత్యక్ష సంబోధన
  choice: ‘దేవుడు మీతో చెప్పిన మాట’
  alternative: ‘మీతో దేవునిచేత చెప్పబడినది’
  rationale: మూలంలోని దైవ కర్తృత్వాన్ని, శ్రోతలకే ఉద్దేశించిన సంబోధనను రెండింటినీ కాపాడుతూ, తెలుగులో సహజమైన కర్తరి నిర్మాణాన్ని ఉపయోగించాం; ప్రేరణ సిద్ధాంతానికి సంబంధించిన అదనపు వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ అనువదించబడింది. మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ను చేర్చలేదు.
