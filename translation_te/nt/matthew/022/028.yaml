source:
  edition: SBLGNT
  text: ἐν τῇ ⸂ἀναστάσει οὖν⸃ τίνος τῶν ἑπτὰ ἔσται γυνή; πάντες γὰρ ἔσχον αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: te
  text: “కాబట్టి పునరుత్థానంలో ఆమె ఆ ఏడుగురిలో ఎవరి భార్యగా ఉంటుంది? ఎందుకంటే వారందరూ ఆమెను భార్యగా చేసుకున్నారు[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరాలా, “వారందరూ ఆమెను కలిగియుండిరి.” సందర్భంలో భావం, “ఆ ఏడుగురూ ఆమెను పెళ్లి చేసుకున్నారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάσει
  choice: పునరుత్థానంలో
  rationale: ἐν తో వచ్చిన దత్తివిభక్తి కాలం/స్థితిని సూచిస్తుంది. సందర్భంలో ఇది చనిపోయినవారి భవిష్యత్ పునరుత్థానాన్నే సూచిస్తుంది.
- source_word: οὖν
  choice: అయితే
  rationale: ముందు చెప్పిన పరిస్థితి నుంచి వచ్చే ప్రశ్నను సహజమైన ఆధునిక తెలుగులో అనుసంధానిస్తుంది; మూలంలోని తార్కిక కొనసాగింపును నిలుపుతుంది.
- source_word: τίνος τῶν ἑπτὰ
  choice: ఆ ఏడుగురిలో ఎవరి
  rationale: ఏడుగురిలో ఒకరిని గుర్తించమనే సంబంధార్థక ప్రశ్నను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔσται γυνή
  choice: భార్యగా ఉంటుంది
  rationale: వివాహ సందర్భంలో γυνή అంటే ‘భార్య’; భవిష్యత్ రూపాన్ని ‘ఉంటుంది’గా వ్యక్తం చేసింది.
- source_word: πάντες γὰρ
  choice: వారందరూ … కదా
  rationale: πάντες ఏడుగురు సోదరులందరినీ సూచిస్తుంది. γάρ ఇచ్చే కారణ/సమర్థన భావాన్ని తెలుగులో ప్రశ్నకు సహజంగా అనుసంధానించే ‘కదా’తో తెలిపింది.
- source_word: ἔσχον αὐτήν
  choice: ఆమెను భార్యగా చేసుకున్నారు
  rationale: అక్షరార్థం ‘ఆమెను కలిగియున్నారు’ అయినా, ఈ సందర్భంలో అది వైవాహిక సంబంధాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో అర్థాన్ని స్పష్టంగా, సహజంగా ఇచ్చి అక్షరార్థాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: సద్దూకయ్యుల ప్రశ్నలో ἀνάστασις భావం
  choice: చనిపోయినవారి భవిష్యత్ పునరుత్థానం
  alternative: సాధారణంగా మరణానంతర జీవితం
  rationale: సందర్భంలో సద్దూకయ్యులు ప్రత్యేకంగా పునరుత్థానాన్ని ప్రశ్నిస్తున్నారు; తరువాతి వచనాల్లో యేసు అదే అంశానికి జవాబిస్తాడు. అందువల్ల ‘పునరుత్థానం’ అనే నిర్దిష్ట భావాన్ని నిలుపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ‘కలిగియున్నారు’ వంటి ప్రాచీన పదప్రయోగాన్ని ప్రధాన పాఠంలో నివారించి, మూలంలోని సంక్షిప్త పదబంధాన్ని పాదసూచికలో చూపించింది.
