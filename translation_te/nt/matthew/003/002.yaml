  text: and saying[a], “Repent[b], for the kingdom of heaven has drawn near.”
translation:
  language: te
  text: ఇలా చెబుతూ, “పశ్చాత్తాపపడండి[a]; ఎందుకంటే పరలోక రాజ్యం సమీపించింది[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనస్సు మార్చుకోండి” లేదా “మారుమనస్సు పొందండి.” గ్రీకు పదం కేవలం తప్పు చేసినందుకు బాధపడడాన్ని మాత్రమే కాదు; మనస్సు, జీవనదిశ మారి దేవుని వైపు తిరగడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “పరలోకాల రాజ్యం దగ్గరకు వచ్చింది.” గ్రీకులో “పరలోకాలు” బహువచనంలో ఉంది; “సమీపించింది” అనేది అది దగ్గరకు వచ్చి ఇప్పుడు సమీపంలో ఉందనే భావాన్ని కలిగి ఉంది.
    reason: lexical_and_aspectual_clarification
lexical_decisions:
- source_word: καὶ λέγων
  choice: ఇలా చెబుతూ ఉన్నాడు
  rationale: ముందరి వచనంలోని క్రియతో ఈ వర్తమాన కృదంతం అనుసంధానమై ఉంది. తెలుగులో సహజమైన కొనసాగింపుగా ‘ఇలా చెబుతూ ఉన్నాడు’ అని ఇచ్చి, ‘ప్రకటిస్తూ’ వంటి మరింత నిర్దిష్ట భావాన్ని చేర్చలేదు.
- source_word: Μετανοεῖτε
  choice: మీ మనసు మార్చుకోండి
  rationale: ఇది బహువచన వర్తమాన ఆజ్ఞ. గ్రీకు పదం కేవలం దుఃఖించడం లేదా అపరాధభావం చెందడం కంటే, మనస్సు మరియు జీవనదిశలో మౌలిక మార్పును కోరుతుంది. ఆధునిక తెలుగులో ‘మీ మనసు మార్చుకోండి’ సహజంగా ఉండి ఆ విస్తృత పిలుపును నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἤγγικεν
  choice: సమీపించింది
  rationale: 'ἐγγίζω యొక్క సంపూర్ణ కాలరూపం: రాజ్యం దగ్గరకు వచ్చి ఇప్పుడు సమీపంలో ఉందనే భావాన్ని ‘సమీపించింది’ సంక్షిప్తంగా వ్యక్తపరుస్తుంది.'
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి ప్రత్యేకంగా వాడే ఈ పదబంధాన్ని వివరణాత్మకంగా ‘దేవుని పరిపాలన’ అని మార్చకుండా, తెలుగులో స్థిరపడిన సహజ రూపంలో నిలుపుతుంది. βασιλείαలో రాజ్యం మరియు రాజపాలన అనే భావవిస్తృతి రెండూ ఉండగలవు.
theological_decisions:
- issue: Μετανοεῖτε అనే పిలుపు యొక్క స్వభావం
  choice: మీ మనసు మార్చుకోండి
  alternative: పశ్చాత్తాపపడండి / మారుమనస్సు పొందండి
  rationale: ప్రధాన పాఠం గ్రీకు పదంలోని మనస్సు, అవగాహన, జీవనదిశ మార్పును ముందుకు తెస్తుంది; కేవలం భావోద్వేగ దుఃఖంగా దాన్ని కుదించదు. సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా పరిచితమైన ధార్మిక భాషను కూడా అందిస్తుంది.
- issue: ‘పరలోక రాజ్యం’ యొక్క భావం
  choice: మత్తయి పదప్రయోగాన్ని ‘పరలోక రాజ్యం’గా నిలుపడం
  alternative: దేవుని పరిపాలన / పరలోకపు పరిపాలన
  rationale: ‘పరలోక రాజ్యం’ అనే రూపం మత్తయి వాడుకలోని ధార్మిక నుడికారాన్ని నిలుపుతుంది; ‘రాజ్యం’ను కేవలం ప్రదేశంగా గానీ, కేవలం పాలనా చర్యగా గానీ ముందుగానే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే ప్రకటనకు తగిన గంభీరతతో ఉంది. ‘మారుమనస్సు పొందండి’ అనే సంఘపరమైన పదబంధం బదులు ప్రధాన పాఠంలో సాధారణ వాడుకలోని ‘మీ మనసు మార్చుకోండి’ను ఎంచుకుని, సంప్రదాయ రూపాలను పాదటిప్పణిలో ఇచ్చాం.
