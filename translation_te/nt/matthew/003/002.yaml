  source_fidelity: మెτανοεῖτε అనేది కేవలం అభిప్రాయం లేదా ఆలోచనను మార్చుకోవడాన్ని మాత్రమే సూచించదు; ఈ సందర్భంలో దేవుని వైపు తిరిగి జీవనమార్పు పొందమనే పిలుపు కూడా అంతర్భాగం. ప్రధాన పాఠంలోని “మీ మనసు మార్చుకోండి” ఆధునిక తెలుగులో తరచుగా ఒక అభిప్రాయాన్ని మార్చుకోవడమనే పరిమిత అర్థాన్ని ఇస్తుంది. “పశ్చాత్తాపపడండి” సంప్రదాయంగా స్థిరపడినదీ, ఈ ప్రకటనాత్మక సందర్భంలో విస్తృతంగా సరిపడేదీ. ἤγγικεν కు “సమీపించింది” అనువాదం సముచితం.
  naturalness: “ఇలా చెబుతూ ఉన్నాడు” వ్యాకరణపరంగా సాధ్యమే అయినా, ఈ ముందు-సందర్భానికి అనుసంధానమైన కృదంతానికి “ఇలా చెబుతూ” మరింత సంక్షిప్తంగా, సహజంగా ఉంటుంది. “పరలోక రాజ్యం సమీపించింది” ఆధునిక ప్రామాణిక తెలుగులో సహజమైన బైబిలు-శైలి ప్రయోగం.
