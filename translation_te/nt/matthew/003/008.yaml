base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: te
  text: కాబట్టి, పశ్చాత్తాపానికి తగిన ఫలాన్ని ఇవ్వండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పశ్చాత్తాపానికి అనుగుణమైన ఫలాన్ని ఇవ్వండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: ఫలించండి
  rationale: ఇది రెండవ పురుష బహువచన ఆజ్ఞార్థకం; καρπόςతో కలిసి వచ్చినప్పుడు తెలుగు ఫలరూపకంలో ‘ఫలించండి’ సహజంగా ఉండి ఆజ్ఞ బలాన్ని నిలుపుతుంది. అక్షరార్థమైన ‘చేయండి’ ఇక్కడ అసహజంగా ఉంటుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న హెచ్చరిక, పిలుపు నుంచి వచ్చే నిర్ధారణను స్పష్టంగా కలుపుతుంది.
- source_word: καρπὸν
  choice: ఫలాన్ని
  rationale: καρπόςకు ప్రామాణిక సమానం; ఇక్కడ కనిపించే ప్రవర్తన లేదా ఫలితాన్ని సూచించే రూపకం. గ్రీకు ఏకవచనాన్ని నిలిపింది.
- source_word: ἄξιον
  choice: తగిన
  rationale: ἄξιος + షష్ఠీ విభక్తి ఇక్కడ యోగ్యత లేదా అనురూపతను తెలియజేస్తుంది; ‘తగిన’ అనే పదం సంపాదించడం అనే భావాన్ని చేర్చకుండా ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μετανοίας
  choice: పశ్చాత్తాపానికి
  rationale: μετάνοια ఇక్కడ యోహాను పిలుపుకు ప్రతిస్పందనగా మనస్సు, దిశ మారి దేవునివైపు తిరగడాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘పశ్చాత్తాపం’ స్థిరపడిన, విస్తృతంగా అర్థమయ్యే పదం.
theological_decisions:
- issue: καρπὸν ἄξιον τῆς μετανοίας అనే పదబంధం భావం
  choice: నిజమైన పశ్చాత్తాపానికి తగిన బాహ్య ప్రవర్తనను ఆజ్ఞాపించడం
  alternative: పశ్చాత్తాపాన్ని సంపాదించే ఫలం లేదా పశ్చాత్తాపంతో సమాన విలువగల ఫలం
  rationale: షష్ఠీ విభక్తితో ఉన్న ἄξιον యోగ్యత లేదా అనురూపతను సూచిస్తుంది, అర్హత సంపాదించడాన్ని కాదు. అందువల్ల పశ్చాత్తాపానికి కనిపించే ఫలాన్ని కోరే నైతిక బలాన్ని నిలుపుతూ, క్రియల వల్ల పశ్చాత్తాపం కొనుగోలు చేయబడుతుందనే భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ఆజ్ఞారూపం. ‘ఫలాన్ని ఫలించండి’ అనే ఫలరూపకాన్ని నిలిపి, సాధారణ పాఠకులకు అర్థమయ్యే ‘పశ్చాత్తాపం’ పదాన్ని ఉపయోగించింది.
