review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the inferential οὖν, the plural imperative ποιήσατε, the collective-singular καρπόν, and ἄξιον τῆς μετανοίας as fruit corresponding to repentance rather than earning it. The proposed revision retains these features.
  naturalness: '‘ఫలాన్ని ఫలించండి’ is stylistically and grammatically awkward in modern standard Telugu: ఫలించు is ordinarily intransitive (‘bear fruit’/‘be fruitful’) and does not naturally take ఫలాన్ని as its object. ‘ఫలాన్ని ఇవ్వండి’ is a natural Telugu realization of the fruit metaphor while retaining the command.'
  terminology: ‘పశ్చాత్తాపం’ is an established, comprehensible rendering of μετάνοια in this context. ‘తగిన’ accurately expresses correspondence/suitability without suggesting merit. ‘కాబట్టి’ appropriately conveys οὖν.
  issues:
  - severity: medium
    issue: Awkward verb–object construction in ‘ఫలాన్ని ఫలించండి’
    rationale: The phrase repeats the fruit root and employs ఫలించండి with a direct object in a way that is not idiomatic in modern standard Telugu. This can distract from the exhortation and reduce clarity.
  revised_text: కాబట్టి, పశ్చాత్తాపానికి తగిన ఫలాన్ని ఇవ్వండి.[a]
  revised_footnotes:
  - marker: a
    text: లేదా, “పశ్చాత్తాపానికి అనుగుణమైన ఫలాన్ని ఇవ్వండి.”
    reason: lexical_alternative
  revision_rationale: Replaced the non-idiomatic ‘ఫలాన్ని ఫలించండి’ with ‘ఫలాన్ని ఇవ్వండి.’ This preserves the aorist imperative’s force and the metaphorical command to produce conduct that corresponds to repentance, without adding a doctrinal interpretation or changing the collective singular ‘fruit.’ The alternative footnote is revised to match the corrected verb.
