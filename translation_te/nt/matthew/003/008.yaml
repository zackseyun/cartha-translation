revisions:
- from: కాబట్టి, పశ్చాత్తాపానికి తగిన ఫలాన్ని ఫలించండి.[a]
  to: కాబట్టి, పశ్చాత్తాపానికి తగిన ఫలాన్ని ఇవ్వండి.[a]
  rationale: Replaced the non-idiomatic ‘ఫలాన్ని ఫలించండి’ with ‘ఫలాన్ని ఇవ్వండి.’ This preserves the aorist imperative’s force and the metaphorical command to produce conduct that corresponds to repentance, without adding a doctrinal interpretation or changing the collective singular ‘fruit.’ The alternative footnote is revised to match the corrected verb.
  reviewer_model: gpt-5.6-terra
