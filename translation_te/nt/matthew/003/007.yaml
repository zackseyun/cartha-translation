revisions:
- from: 'అయితే పరిసయ్యులలోను సద్దూకయ్యులలోను చాలామంది తన బాప్తిస్మం దగ్గరకు రావడం అతడు చూసి, వారితో ఇలా అన్నాడు: “విషసర్పాల సంతానమా![a] రాబోయే ఉగ్రత[b] నుండి పారిపోవాలని మీకు హెచ్చరించినవాడెవడు?”'
  to: 'అయితే పరిసయ్యులలోను సద్దూకయ్యులలోను చాలామంది తన బాప్తిస్మానికి వస్తుండగా అతడు చూసి, వారితో ఇలా అన్నాడు: “విషపాముల సంతానమా![a] రాబోయే ఉగ్రకోపం[b] నుండి తప్పించుకోవాలని మీకు హెచ్చరించినవాడెవడు?”'
  rationale: The revision improves lexical precision and idiomatic Telugu without adding the claim that the visitors actually received baptism. It retains the partitive scope of the groups, the prophetic invective, the warning sense of ὑπέδειξεν, and the future/impending force of μελλούσης. Footnote anchors remain attached to the corresponding expressions and preserve genuine lexical alternatives.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:29:24Z'
review_pass:
  verdict: revise
  source_fidelity: 'The partitive sense is preserved well: ‘పరిసయ్యులలోను సద్దూకయ్యులలోను చాలామంది’ identifies many from both groups. The rebuke and urgent ‘flee’ imagery are retained. However, ‘ఉగ్రత’ denotes severity or ferocity rather than the personal/responding sense of ὀργή; ‘ఉగ్రకోపం’ better conveys ‘wrath.’ ‘బాప్తిస్మం దగ్గరకు రావడం’ is understandable but less idiomatic for ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ than ‘తన బాప్తిస్మానికి వస్తుండగా.’'
  naturalness: The proposed revision uses fluent modern standard Telugu while retaining a serious prophetic register. ‘విషపాముల సంతానమా’ is direct and idiomatic, and ‘రాబోయే ఉగ్రకోపం నుండి తప్పించుకోవాలని’ is a natural Telugu rendering of the warning question.
  terminology: ‘పరిసయ్యులు,’ ‘సద్దూకయ్యులు,’ and ‘బాప్తిస్మం’ are appropriate established biblical forms. ‘విషపాములు’ is more precise for ἐχίδναι than the broader ‘విషసర్పాలు.’ ‘ఉగ్రకోపం’ preserves the lexical force of ὀργή without replacing it with the interpretive terms ‘తీర్పు’ or ‘శిక్ష.’
  issues:
  - severity: medium
    issue: ‘ఉగ్రత’ for τῆς μελλούσης ὀργῆς
    rationale: ‘ఉగ్రత’ primarily expresses fierceness/intensity, whereas ὀργή is wrath/anger. ‘ఉగ్రకోపం’ retains both the wrath sense and the gravity of the phrase.
  - severity: low
    issue: ‘తన బాప్తిస్మం దగ్గరకు రావడం’
    rationale: This is somewhat awkward Telugu and ‘దగ్గరకు’ is spatially vague. ‘తన బాప్తిస్మానికి వస్తుండగా’ naturally expresses approach to John's baptismal ministry/event without asserting that they were baptized.
  - severity: low
    issue: ‘విషసర్పాలు’ for ἐχιδνῶν
    rationale: The Greek refers specifically to vipers. ‘విషపాములు’ is a more usual and suitably precise modern Telugu equivalent.
  revised_text: 'అయితే పరిసయ్యులలోను సద్దూకయ్యులలోను చాలామంది తన బాప్తిస్మానికి వస్తుండగా అతడు చూసి, వారితో ఇలా అన్నాడు: “విషపాముల సంతానమా![a] రాబోయే ఉగ్రకోపం[b] నుండి తప్పించుకోవాలని మీకు హెచ్చరించినవాడెవడు?”'
