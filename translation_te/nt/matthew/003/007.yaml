id: MAT.3.7
reference: Matthew 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: te
  text: 'అయితే పరిసయ్యులలోను సద్దూకయ్యులలోను చాలామంది తన బాప్తిస్మానికి వస్తుండగా అతడు చూసి, వారితో ఇలా అన్నాడు: “విషపాముల సంతానమా![a] రాబోయే ఉగ్రకోపం[b] నుండి తప్పించుకోవాలని మీకు హెచ్చరించినవాడెవడు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాముల గుంపా!”
    reason: γεννήματα అనే పదానికి సమూహార్థకమైన సాంప్రదాయిక ప్రత్యామ్నాయం.
  - marker: b
    text: లేదా, “రాబోయే కోపం.”
    reason: τῆς μελλούσης ὀργῆς కు సంక్షిప్తమైన పదప్రయోగ ప్రత్యామ్నాయం; ప్రధాన పాఠంలోని ‘ఉగ్రకోపం’ ὀργή యొక్క తీవ్రతను స్పష్టంగా తెలియజేస్తుంది.
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: అయితే ... అతడు చూసి
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసాన్ని ‘అయితే’ నిలుపుతుంది; ఏఒరిస్ట్ కృదంతాన్ని తెలుగులో సహజమైన ‘చూసి’ నిర్మాణంగా ఇచ్చాం.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: పరిసయ్యులలోను సద్దూకయ్యులలోను చాలామంది
  rationale: గ్రీకు విభాగార్థక షష్ఠీ నిర్మాణం ఆ రెండు వర్గాల సభ్యులందరినీ కాక, వారిలో చాలామందిని సూచిస్తుంది.
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: తన బాప్తిస్మం దగ్గరకు రావడం
  rationale: వారు యోహాను బాప్తిస్మ కార్యం వద్దకు వస్తున్నారని తెలుపుతుంది; ఈ వచనంలోనే వారు తప్పక బాప్తిస్మం పొందడానికి వచ్చారని అదనంగా నిర్ధారించదు. ‘తన’ అనే పదం వాక్యంలోని కర్తయైన యోహానునే సహజంగా సూచిస్తుంది.
- source_word: Γεννήματα ἐχιδνῶν
  choice: విషసర్పాల సంతానమా
  rationale: γεννήματα యొక్క పుట్టినవారు/సంతానం అనే భావాన్ని ‘సంతానం’ నిలుపుతుంది; ἐχιδνῶν సూచించే విషపాముల భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేయడానికి ‘విషసర్పాలు’ వాడాం.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: మీకు హెచ్చరించినవాడెవడు
  rationale: ఈ సందర్భంలో ὑποδείκνυμι కేవలం చూపించడం కంటే రాబోయే ప్రమాదం గురించి హెచ్చరించడం అనే భావాన్ని కలిగిస్తుంది.
- source_word: φυγεῖν ἀπὸ
  choice: నుండి పారిపోవాలని
  rationale: φυγεῖν లోని త్వరగా తప్పించుకునే ఉజ్జ్వల చిత్రాన్ని ‘పారిపోవడం’ నేరుగా నిలుపుతుంది.
- source_word: τῆς μελλούσης ὀργῆς
  choice: రాబోయే ఉగ్రత
  rationale: μέλλω లోని సమీపిస్తున్న/రానున్న భావాన్ని ‘రాబోయే’ తెలియజేస్తుంది; ὀργή యొక్క బలాన్ని ‘ఉగ్రత’ మృదువుచేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: సంబోధించబడిన పరిసయ్యులు, సద్దూకయ్యుల పరిధి
  choice: ఆ వర్గాలలోని చాలామందిని ఉద్దేశించిన మాట
  alternative: పరిసయ్యులు, సద్దూకయ్యులు అందరినీ సమష్టిగా ఉద్దేశించిన మాట
  rationale: πολλούς తో వచ్చిన విభాగార్థక నిర్మాణం అక్కడికి వచ్చిన ఉపసమూహాన్ని సూచిస్తుంది; అందువల్ల మూలపాఠం చెప్పినదానికంటే విస్తృతమైన సాధారణీకరణ చేయలేదు.
- issue: ὀργή యొక్క అంత్యకాల సంబంధమైన బలం
  choice: ఉగ్రత
  alternative: తీర్పు లేదా శిక్ష
  rationale: ‘తీర్పు’, ‘శిక్ష’ అనేవి సాధ్యమైన ఫలితాలను వివరిస్తాయి గాని ὀργή అనే పదంలోని ఆగ్రహ భావాన్ని ప్రత్యక్షంగా ఇవ్వవు. ‘ఉగ్రత’ ఆ దైవిక, రాబోయే తీవ్రతను వ్యాఖ్యానంతో పరిమితం చేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన ప్రవక్తీయ స్వరం నిలుపబడింది. ‘బాప్తిస్మం’, ‘పరిసయ్యులు’, ‘సద్దూకయ్యులు’ వంటి స్థిరమైన బైబిలు పదరూపాలు కొనసాగించబడ్డాయి; సంబోధనలోని తీవ్రతను మృదువుచేయలేదు.
