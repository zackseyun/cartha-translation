id: MAT.3.4
reference: Matthew 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: te
  text: యోహాను స్వయంగా ఒంటె వెంట్రుకలతో చేసిన వస్త్రాన్ని ధరించేవాడు; అతని నడుము చుట్టూ తోలు బెల్టు ఉండేది.[a][b][c] అతని ఆహారం మిడతలు, అడవి తేనె.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ దుస్తుల వర్ణన 2 రాజులు 1:8లోని ప్రవక్త ఏలీయా వర్ణనను గుర్తుచేస్తుంది; మత్తయి యోహానును చిత్రించడంలో ఇది ముఖ్యమైన నేపథ్యం.
    reason: cross_reference
  - marker: b
    text: లేదా, ‘అతని వస్త్రం ఒంటె వెంట్రుకలతో చేసినది.’
    reason: lexical_alternative
  - marker: c
    text: ‘ధరించేవాడు’ అని అనువదించిన గ్రీకు పదానికి అక్షరార్థం ‘కలిగి ఉండేవాడు.’
    reason: source_form
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: యోహాను స్వయంగా
  rationale: αὐτόςలోని ఉద్ఘాటనను ‘స్వయంగా’ నిలుపుతుంది. δέ స్వల్ప సంధాన సూచకం; తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు ప్రత్యేక పదంతో అనువదించలేదు.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: వస్త్రం ధరించి
  rationale: εἶχεν అక్షరార్థంగా ‘కలిగి ఉండేవాడు’; దుస్తుల సందర్భంలో తెలుగులో ‘ధరించి’ అనడం భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: ఒంటె వెంట్రుకలతో చేసిన
  rationale: ἀπό ఇక్కడ పదార్థాన్ని సూచిస్తుంది. ‘వెంట్రుకలతో చేసిన’ అనేది వస్త్రం ఏ పదార్థంతో తయారైందో స్పష్టం చేస్తుంది.
- source_word: ζώνην δερματίνην
  choice: తోలు నడికట్టు
  rationale: ζώνη నడుము చుట్టూ కట్టుకునే బెల్టు లేదా నడికట్టు; చారిత్రక సందర్భంలో సహజమైన తెలుగు పదంగా ‘నడికట్టు’ ఎంచుకున్నాం. δερματίνηνను ‘తోలు’గా అనువదించాం.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: నడుముకు ... కట్టుకున్నాడు
  rationale: ὀσφύςకు ఆధునిక సహజ సమానం ‘నడుము’; περί భావాన్ని తెలుగు క్రియారూపమైన ‘కట్టుకున్నాడు’ ద్వారా వ్యక్తం చేశాం.
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: అతని ఆహారం
  rationale: τροφήకు సూటి, గౌరవప్రదమైన ఆధునిక తెలుగు సమానం ‘ఆహారం’. గ్రీకు నామవాచక వాక్యాన్ని తెలుగులో సహజమైన నిర్మాణంగా ఇచ్చాం.
- source_word: ἀκρίδες
  choice: మిడతలు
  rationale: పదానికి ప్రామాణిక అర్థం తినదగిన మిడతలు/locusts; ప్రత్యామ్నాయ వృక్షార్థాన్ని స్వీకరించడానికి పాఠ్య ఆధారం లేదు.
- source_word: μέλι ἄγριον
  choice: అడవి తేనె
  rationale: ἄγριον అనేది μέλιని విశేషిస్తూ అడవిలో లభించే తేనెను సూచిస్తుంది; ‘అడవి తేనె’ సంక్షిప్తంగా, సహజంగా ఉంది.
theological_decisions:
- issue: ఏలీయాను గుర్తుచేసే ప్రవక్తరూప వర్ణన
  choice: ప్రధాన పాఠ్యంలో యోహాను దుస్తులు, ఆహారాన్ని నేరుగా వర్ణించడం
  alternative: ఏలీయాతో పోలికను అనువాదంలోనే స్పష్టంగా చేర్చడం
  rationale: వచనం పోలికను ప్రత్యక్షంగా చెప్పదు. 2 రాజులు 1:8 నేపథ్యం ముఖ్యమైనదైనా, దానిని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయకుండా పాదసూచికలో తెలియజేయడం మూలపాఠ్య పరిమితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా వాక్య గౌరవాన్ని నిలుపుతూ ‘వస్త్రం’, ‘నడికట్టు’, ‘ఆహారం’ వంటి పదాలు వాడబడ్డాయి. మూలంలోని రెండు వివరణాత్మక భాగాలను తెలుగులో సహజంగా రెండు వాక్యాలుగా ఇచ్చాం.
