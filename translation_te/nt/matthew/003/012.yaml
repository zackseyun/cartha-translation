source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: te
  text: ఆయన చేతిలో తూర్పారబట్టే చేట[a] ఉంది. ఆయన తన కళ్లాన్ని పూర్తిగా శుభ్రపరుస్తాడు; తన గోధుమలను గాదెలో[b] పోగుచేస్తాడు. అయితే ఊకను ఆరిపోని అగ్నితో పూర్తిగా కాల్చివేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తూర్పారబట్టే పార.’ ఈ గ్రీకు పదం ధాన్యాన్ని గాలిలోకి ఎగరవేసి వేరు చేయడానికి ఉపయోగించే పనిముట్టును సూచిస్తుంది; దాని ఖచ్చితమైన ఆకారం నిర్ధారితం కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ధాన్యాగారం’ లేదా ‘నిల్వగది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: తూర్పారబట్టే చేట
  rationale: ధాన్యాన్ని గాలిలోకి ఎగరవేసి గింజలను ఊకనుంచి వేరు చేయడానికి ఉపయోగించే వ్యవసాయ పనిముట్టును సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు పని స్పష్టమయ్యేలా ‘తూర్పారబట్టే’ అని పేర్కొని, సాధారణ వ్యవసాయ పదమైన ‘చేట’ను వాడాం; పనిముట్టు ఖచ్చిత ఆకారాన్ని గ్రీకు పదం నిర్ణయించనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: διακαθαριεῖ
  choice: పూర్తిగా శుభ్రం చేసి
  rationale: సమ్మిళిత క్రియలోని సంపూర్ణంగా శుభ్రపరచడం లేదా ఖాళీ చేయడం అనే తీవ్రతను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἅλωνα
  choice: కళ్లం
  rationale: ధాన్యాన్ని నూర్చి తూర్పారబట్టే స్థలానికి తెలుగు వ్యవసాయ వాడుకలో సరైన, సంక్షిప్త పదం.
- source_word: σῖτον
  choice: గోధుమలు
  rationale: ఈ పదం ధాన్యాన్ని సాధారణంగా కూడా సూచించగలిగినా, ఊకతో ఉన్న వ్యత్యాసంలో ‘గోధుమలు’ సహజంగా ఉండి రూపకంలోని నిర్దిష్ట చిత్రాన్ని నిలుపుతుంది.
- source_word: ἀποθήκην
  choice: గాదె
  rationale: ధాన్యాన్ని నిల్వచేసే స్థలాన్ని సహజంగా సూచిస్తుంది; గ్రీకు పదంలోని సాధారణ నిల్వస్థలం భావానికి సరిపోతుంది.
- source_word: ἄχυρον
  choice: ఊక
  rationale: తూర్పారబట్టేటప్పుడు గింజలనుంచి వేరయ్యే పనికిరాని తేలిక భాగానికి సందర్భానుసారమైన తెలుగు పదం.
- source_word: κατακαύσει
  choice: పూర్తిగా కాల్చివేస్తాడు
  rationale: సాధారణంగా కాల్చడం మాత్రమే కాక పూర్తిగా దహించివేయడం అనే సమాస క్రియ తీవ్రతను వ్యక్తం చేస్తుంది.
- source_word: πυρὶ ἀσβέστῳ
  choice: ఆరని అగ్నితో
  rationale: ఆర్పలేని అగ్ని అనే విశేషణ భావాన్ని, అలాగే సాధనార్థక దత్తివును సంక్షిప్తంగా నిలుపుతుంది.
- source_word: οὗ
  choice: ఆయన ... ఆయన
  rationale: ముందటి వచనంలోని రాబోయే వ్యక్తిని సూచించే సంబంధసర్వనామపు స్వామ్య భావాన్ని తెలుగులో సహజమైన స్వతంత్ర వాక్య నిర్మాణంగా అందిస్తుంది.
theological_decisions:
- issue: గోధుమలు, ఊకను వేరుచేసే తీర్పు రూపకం
  choice: వ్యవసాయ రూపకాన్ని, భవిష్యత్తు తీర్పు తీవ్రతను యథాతథంగా ఉంచాం.
  alternative: గోధుమలు నీతిమంతులని, ఊక దుష్టులని ప్రధాన పాఠ్యంలోనే వివరణాత్మకంగా చెప్పడం.
  rationale: వచనం స్వయంగా మూర్తమైన వ్యవసాయ రూపకాన్నే ఇస్తుంది. దాని ప్రతీకలను అనువాదంలో విడమరచి సిద్ధాంతపరంగా నిర్ణయించకుండా, రూపకంలోని భావభారాన్ని మరియు ఉద్రిక్తతను పాఠకునికి అలాగే అందించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని అనుసరించాం. ‘కళ్లం,’ ‘చేట,’ ‘ఊక,’ ‘గాదె’ వంటి వ్యవసాయ పదాలు మూలంలోని సజీవ చిత్రాన్ని నిలుపుతాయి; అరుదుగా అనిపించగల పనిముట్టు, నిల్వస్థలం పదాలకు పాదసూచికల్లో ప్రత్యామ్నాయాలు ఇచ్చాం.
