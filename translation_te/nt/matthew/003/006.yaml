id: MAT.3.6
reference: Matthew 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: te
  text: మరియు వారు తమ పాపాలను ఒప్పుకుంటూ, యొర్దాను నదిలో అతనిచేత బాప్తిస్మం పొందుతూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘బాప్తిస్మం పొందారు’ అని కూడా అనువదించవచ్చు; గ్రీకు అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే జరిగిన చర్యను నొక్కిచెప్పవచ్చు: ‘బాప్తిస్మం పొందుతూ ఉన్నారు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: బాప్తిస్మం పొందుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల కర్మణి రూపం కథనంలో కొనసాగుతున్న లేదా పదేపదే జరిగిన కార్యాన్ని సూచించగలదు. స్థిరపడిన ఆచార సంబంధ పదమైన ‘బాప్తిస్మం’ను ఉంచడం ద్వారా విధానాన్ని ప్రత్యేకంగా నిర్ధారించలేదు.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: యొర్దాను నదిలో
  rationale: ἐν తో కూడిన చతుర్థీ విభక్తి స్థలాన్ని సూచిస్తుంది; ποταμῷ యొర్దాను ఒక నది అని స్పష్టంగా పేర్కొంటుంది.
- source_word: ὑπ’ αὐτοῦ
  choice: అతని చేత
  rationale: ὑπό తో కూడిన షష్ఠీ విభక్తి వ్యక్తిగత కర్తృత్వాన్ని సూచిస్తుంది. సర్వనామాన్ని అలాగే ఉంచి, ఈ వచనంలో ‘యోహాను’ అని విస్తరించలేదు.
- source_word: ἐξομολογούμενοι
  choice: ఒప్పుకుంటూ
  rationale: ఈ వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలికమైన చర్యను సూచిస్తుంది; పాపాలను మాటల ద్వారా అంగీకరించడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: తమ పాపాలను
  rationale: తెలుగులో కర్తను తిరిగి సూచించే ‘తమ’ సహజంగా ఉంటుంది; ‘పాపాలు’ అనే బహువచనాన్ని నిలుపుతుంది.
- source_word: καὶ
  choice: మరియు భావం సందర్భానుసారంగా వాక్యప్రవాహంలో అంతర్లీనంగా ఉంది
  rationale: గ్రీకు καὶ ముందరి వచనంతో సాధారణ అనుసంధానం చేస్తుంది. తెలుగులో స్వతంత్ర వచనంగా సహజంగా ఉండేందుకు ప్రత్యేకంగా ‘మరియు’ అని ప్రారంభించకుండా వాక్యక్రమం ద్వారా అనుసంధాన భావాన్ని అందించాం.
theological_decisions:
- issue: బాప్తిస్మ విధానానికి సంబంధించిన పదప్రయోగం
  choice: ‘బాప్తిస్మం పొందారు’ అనే స్థిరపడిన ఆచార సంబంధ పదాన్ని వాడటం
  alternative: ‘ముంచబడ్డారు’ లేదా ‘కడుగబడ్డారు’
  rationale: ఈ వచనం యొర్దానులో యోహాను ద్వారా జరిగిన బాప్తిస్మాన్ని చెబుతుంది గాని దాని విధానాన్ని స్పష్టంగా నిర్వచించదు. ‘బాప్తిస్మం’ అని ఉంచడం ద్వారా ఏ సంప్రదాయానికీ ప్రత్యేకమైన నిర్ధారణను పాఠ్యంలోకి చేర్చడం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అతని చేత’ మూలంలోని సర్వనామాన్ని కాపాడుతుంది; ‘తమ పాపాలను’ తెలుగు ప్రతిఫలక స్వామ్యప్రయోగానికి అనుగుణంగా ఉంది. కృదంతాన్ని ముందుంచిన వాక్యక్రమం ఒప్పుకోలు బాప్తిస్మంతో సమకాలికమని స్పష్టపరుస్తుంది.
