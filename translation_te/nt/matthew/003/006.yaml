  source_fidelity: The draft accurately represents the imperfect passive ἐβαπτίζοντο as an ongoing past action, retains baptism as a ritual term without specifying mode, preserves the locative ‘in the Jordan River,’ the personal agent ‘by him,’ and the contemporaneous confession of plural ‘sins.’ However, the explicit opening connective καὶ should be represented rather than left entirely implicit.
  naturalness: The sentence is clear and natural in modern standard Telugu. Writing the agent as ‘అతనిచేత’ is the standard joined form. The participial order (‘తమ పాపాలను ఒప్పుకుంటూ’) naturally conveys simultaneity.
  terminology: ‘బాప్తిస్మం’ is an appropriate established Telugu theological term and does not prejudge the mode. ‘పాపాలను ఒప్పుకుంటూ’ appropriately renders ἐξομολογούμενοι in this context. ‘యొర్దాను నది’ preserves the explicit Greek noun ποταμός.
  issues:
  - severity: low
    issue: The Greek connective καὶ is omitted as an explicit element.
    rationale: Although Telugu can sometimes leave narrative linkage implicit, ‘మరియు’ readily preserves the source’s simple connective without harming naturalness.
