  to: మరియు వారు తమ పాపాలను ఒప్పుకుంటూ, యొర్దాను నదిలో అతనిచేత బాప్తిస్మం పొందుతూ ఉన్నారు.[a]
  rationale: The revision adds ‘మరియు’ for καὶ and standardizes ‘అతనిచేత.’ All other wording is retained because it faithfully and naturally conveys the Greek imperfect passive, locative phrase, agency, and contemporaneous participle without introducing interpretive claims about baptismal mode.
