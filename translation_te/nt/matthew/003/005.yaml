  to: అప్పుడు యెరూషలేము నుండీ, యూదయ ప్రాంతమంతటి నుండీ, యొర్దాను చుట్టుపక్కల ప్రాంతమంతటి నుండీ ప్రజలు ఆయన దగ్గరికి వెళ్తూ ఉండేవారు[a][b].
