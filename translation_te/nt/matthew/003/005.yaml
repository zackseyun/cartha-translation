id: MAT.3.5
reference: Matthew 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: te
  text: అప్పుడు యెరూషలేము నుండీ, యూదయ ప్రాంతమంతటి నుండీ, యొర్దాను చుట్టుపక్కల ప్రాంతమంతటి నుండీ ప్రజలు ఆయన దగ్గరికి వెళ్తూ ఉండేవారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆయన దగ్గరికి బయలుదేరి వెళ్తూనే ఉండేవారు’ అని కూడా అనువదించవచ్చు; గ్రీకు అపూర్ణ భూతకాల రూపం కొనసాగిన లేదా పదేపదే జరిగిన చర్యను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘యూదయ ప్రాంతమంతటి నుండీ,’ ‘యొర్దాను చుట్టుపక్కల ప్రాంతమంతటి నుండీ’ అనేవి యోహాను పట్ల ఏర్పడిన విస్తృత ప్రజాస్పందనను తెలిపే సాధారణ భౌగోళిక వ్యక్తీకరణలు; అవి తప్పనిసరిగా ప్రతి వ్యక్తినీ సూచించవు.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: ముందటి సందర్భంలో చెప్పిన యోహాను పరిచర్యతో ప్రజల స్పందనను కలిపే సహజమైన కాలసూచకం.
- source_word: ἐξεπορεύετο
  choice: తరలివస్తూ ఉండేవారు
  rationale: గ్రీకు అపూర్ణ భూతకాల రూపం గతంలో కొనసాగిన లేదా పదేపదే జరిగిన రాకను సూచిస్తుంది; సమూహాల విస్తృత స్పందనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πρὸς αὐτὸν
  choice: ఆయన దగ్గరికి
  rationale: వ్యక్తివైపు కదలికను సూచించే πρός భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భంలో ‘ఆయన’ యోహానును సూచిస్తుంది.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపం.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: యూదయ ప్రాంతమంతా
  rationale: ప్రాంతాన్ని సమగ్రంగా సూచించే విస్తృత భౌగోళిక వ్యక్తీకరణను నిలుపుతుంది; ప్రతి వ్యక్తినీ తప్పనిసరిగా సూచించదు.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: యొర్దాను చుట్టుపక్కల ప్రాంతమంతా
  rationale: περίχωρος యొక్క ‘చుట్టుపక్కల ప్రాంతం’ అనే భౌగోళిక భావాన్నీ, యొర్దానుతో సంబంధాన్నీ సహజంగా నిలుపుతుంది.
- source_word: καὶ ... καὶ
  choice: జాబితాలో విరామాలతో సమన్వయం
  rationale: తెలుగులో మూడు భౌగోళిక అంశాల క్రమబద్ధ సమన్వయం విరామాలతో సహజంగా వ్యక్తమవుతుంది; చివరి సమూహం సమష్టి క్రియతో కలుస్తుంది.
theological_decisions:
- issue: భౌగోళిక సమగ్ర పదాల పరిధి
  choice: విస్తృత ప్రజాస్పందనను సూచించే ‘ప్రాంతమంతా’ అనే రూపాన్ని ఉంచడం
  alternative: ‘యెరూషలేము నుండి, యూదయ అంతటి నుండి, యొర్దాను పరిసరాల నుండి ప్రజలు’ అని స్పష్టీకరించడం
  rationale: మూలంలోని ప్రాంతాలనే కర్తలుగా చూపే అలంకారిక నిర్మాణాన్ని నిలుపుతూ, ప్రాచీన భాషలోని విస్తృత సాధారణీకరణను ప్రతి నివాసి అనే గణితార్థంగా మార్చకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ‘ఆయన’ ప్రయోగం. ‘తరలివస్తూ ఉండేవారు’ కొనసాగిన సామూహిక కదలికను సహజంగా తెలియజేస్తుంది. భౌగోళిక పేర్లకు తెలుగు బైబిలు పాఠకులకు పరిచితమైన రూపాలు వాడబడ్డాయి.
