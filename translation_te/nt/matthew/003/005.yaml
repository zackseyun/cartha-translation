  source_fidelity: మూలంలోని ἐξεπορεύετο అపూర్ణ భూతకాలం సూచించే కొనసాగిన/పదేపదే జరిగిన కదలికను ముసాయిదా సాధారణంగా ప్రతిబింబిస్తుంది. అయితే భౌగోళిక ప్రాంతాలను నేరుగా బహువచన కర్తలుగా చేసి ‘తరలివస్తూ ఉండేవారు’ అనడం తెలుగులో కొంత అసహజంగా ఉంది; అలాగే ἐκ-భావమున్న ‘బయలుదేరి వెళ్లడం’ కంటే ‘వస్తూ’ అనే దృష్టికోణం కొద్దిగా తక్కువ స్పష్టంగా ఉంది. మూలంలోని విస్తృత భౌగోళిక సూచనను సహజంగా నిలుపుటకు ‘... నుండి ప్రజలు’ అనే రూపం సురక్షితం.
  naturalness: ‘యెరూషలేము నుండీ, యూదయ ప్రాంతమంతటి నుండీ, యొర్దాను చుట్టుపక్కల ప్రాంతమంతటి నుండీ ప్రజలు’ అనేది ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది. ‘ఆయన దగ్గరికి వెళ్తూ ఉండేవారు’ కొనసాగుతున్న చర్యను తెలుపుతుంది మరియు యోహాను ఉన్న చోటుకు ప్రజలు కదలడాన్ని స్పష్టపరుస్తుంది.
  terminology: ‘యెరూషలేము,’ ‘యూదయ,’ ‘యొర్దాను’ తెలుగు బైబిలు వాడుకకు అనుగుణమైన పేర్లు. ‘ఆయన’ సందర్భానుసారంగా యోహానును గౌరవప్రదంగా సూచిస్తుంది. ‘ప్రాంతమంతటి’ మూలంలోని πᾶσα పదం కలిగించే విస్తృత భౌగోళిక పరిధిని, ప్రతి వ్యక్తి అనే కచ్చిత గణనార్థాన్ని రుద్దకుండా వ్యక్తం చేస్తుంది.
