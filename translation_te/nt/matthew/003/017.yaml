id: MAT.3.17
reference: Matthew 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: te
  text: 'మరియు ఇదిగో, ఆకాశాల నుండి[a] ఒక స్వరం ఇలా పలికింది: “ఈయనే నా ప్రియ కుమారుడు; ఈయన పట్ల నేను సంతోషంగా ఉన్నాను[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆకాశం నుండి.” గ్రీకు మూలంలో “ఆకాశాలు” అని బహువచనం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “ఈయనయందు నేను సంతోషించాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: ఇదిగో
  rationale: ἰδού ప్రాముఖ్యమైన సంఘటనవైపు పాఠకుని దృష్టిని మళ్లించే సంభాషణా సూచకం. ‘ఇదిగో’ దాని గంభీరమైన, దృష్టిని ఆకర్షించే బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: φωνὴ
  choice: ఒక స్వరం
  rationale: తరువాత ప్రత్యక్ష వాక్యం వస్తున్నందున φωνή ఇక్కడ సాధారణ శబ్దాన్ని కాక, మాటలుగా వినిపించిన స్వరాన్ని సూచిస్తుంది.
- source_word: ἐκ τῶν οὐρανῶν
  choice: ఆకాశాల నుండి
  rationale: మూల గ్రీకులో οὐρανῶν బహువచనంలో ఉంది. తెలుగులో కొంత అసాధారణంగా అనిపించినా అర్థం స్పష్టంగానే ఉండడంతో మూల రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
- source_word: λέγουσα
  choice: ఇలా పలికింది
  rationale: ఈ వర్తమాన కృదంతం ‘స్వరం’ను విశేషించి ఉల్లేఖనాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఇలా పలికింది’ సహజంగా ఉండి ప్రకటన యొక్క గంభీరతను కూడా నిలుపుతుంది.
- source_word: Οὗτός ἐστιν
  choice: ఈయనే
  rationale: సూచక సర్వనామం, క్రియ కలిగిన గుర్తింపు బలాన్ని గౌరవప్రదమైన సహజ తెలుగులో ‘ఈయనే’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: నా ప్రియ కుమారుడు
  rationale: ‘ప్రియ’ ἀγαπητόςలోని ప్రేమింపబడినవాడు అనే భావాన్ని సంక్షిప్తంగా, గంభీరంగా వ్యక్తం చేస్తుంది; ‘నా కుమారుడు’ అనే స్పష్టమైన పుత్ర సంబంధాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: ἐν ᾧ
  choice: ఈయన పట్ల
  rationale: ἐν అక్షరార్థంగా ‘లో/యందు’ అయినా, εὐδοκέωతో కలిసి ఇక్కడ సమ్మతి, ఆనందం ఎవరిపట్ల ఉందో సూచిస్తుంది. ‘ఈయన పట్ల’ ఆధునిక తెలుగులో సహజమైన సమానార్థకం; అక్షరార్థ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: εὐδόκησα
  choice: నేను ఎంతో సంతోషిస్తున్నాను
  rationale: ఈ సందర్భంలోని సూత్రబద్ధమైన దైవ ప్రకటనలో గ్రీకు భూతకాల రూపం ప్రస్తుత సమ్మతి, ఆనంద స్థితిని తెలియజేస్తుంది. ఈ తెలుగు రూపం దైవ ఆమోదాన్ని సహజంగా వ్యక్తం చేస్తూ క్రియాంశాన్ని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: యేసు పుత్రత్వాన్ని తెలిపే దైవ ప్రకటన
  choice: నా ప్రియ కుమారుడు
  alternative: నేను ప్రేమించే నా కుమారుడు
  rationale: మూలంలోని పుత్ర సంబంధాన్నీ ἀγαπητόςలోని ప్రేమ భావాన్నీ ప్రత్యక్షంగా నిలుపుతుంది; పాఠ్యంలో లేని దత్తపుత్రత్వం వంటి వివరణను చేర్చదు.
- issue: οὐρανῶν యొక్క బహువచనం
  choice: ఆకాశాల నుండి
  alternative: ఆకాశం నుండి
  rationale: మూల పాఠ్యంలోని బహువచనాన్ని ప్రధాన అనువాదంలో నిలిపి, తెలుగులో సాధారణంగా వినిపించే ఏకవచనాన్ని పాదసూచికలో అందించాం.
- issue: ἐν ᾧ εὐδόκησα అనే వాక్యభాగం
  choice: ఈయన పట్ల నేను ఎంతో సంతోషిస్తున్నాను
  alternative: ఈయనయందు నేను సంతోషించాను
  rationale: దైవ సమ్మతి, ఆనందం అనే భావాన్ని సహజ తెలుగులో తెలియజేస్తూనే, ‘లో/యందు’ అనే మరింత అక్షరార్థ నిర్మాణాన్ని పాదసూచిక ద్వారా భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, దైవ ప్రకటనకు తగిన గంభీరతతో అనువదించాం. ‘పలికింది,’ ‘ఈయనే,’ ‘ప్రియ కుమారుడు’ వంటి రూపాలు మర్యాదపూర్వకమైన ఉన్నత శైలిని ఇస్తాయి; అతిపురాతన పదజాలాన్ని నివారించాం.
