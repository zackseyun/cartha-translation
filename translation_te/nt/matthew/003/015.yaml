revisions:
- from: అయితే యేసు అతనికి జవాబిస్తూ, “ఇప్పటికి ఇలా జరగనివ్వు; ఎందుకంటే ఈ విధంగా నీతియంతటినీ[a] నెరవేర్చడం మనకు తగినది” అన్నాడు. అప్పుడు యోహాను ఆయనను అనుమతించాడు.
  to: 'అయితే యేసు అతనికి ఇలా జవాబిచ్చాడు: “ఇప్పటికైతే అనుమతించు; ఎందుకంటే ఈ విధంగా సమస్త నీతిని[a] నెరవేర్చడం మనకు తగినది.” అప్పుడు యోహాను ఆయనను అనుమతించాడు.'
  rationale: The revision retains all source-level distinctions while improving modern Telugu idiom. ‘ఇప్పటికైతే అనుమతించు’ directly addresses John and naturally expresses Jesus’ request for present compliance. The wording neither restricts ‘all righteousness’ to legal requirements nor expands it beyond the verse.
