source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: te
  text: 'అయితే యేసు అతనికి ఇలా జవాబిచ్చాడు: “ఇప్పటికైతే అనుమతించు; ఎందుకంటే ఈ విధంగా సమస్త నీతిని[a] నెరవేర్చడం మనకు తగినది.” అప్పుడు యోహాను ఆయనను అనుమతించాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమస్త న్యాయాన్ని.” గ్రీకు పదం నీతిని లేదా న్యాయాన్ని సూచించగలదు; ఇక్కడ దేవుని చిత్తానికి అనుగుణంగా నడుచుకోవడంపై మత్తయి ఉంచే ప్రధాన భావానికి “నీతి” బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: అయితే యేసు అతనికి జవాబిస్తూ ... అన్నాడు
  rationale: ἀποκριθεὶς ... εἶπεν అనే గ్రీకు జాతీయాన్ని సహజమైన తెలుగులో ‘జవాబిస్తూ ... అన్నాడు’గా అందించాం. δέ ముందు వచనంలోని యోహాను అభ్యంతరానికి వ్యతిరేక మలుపును సూచిస్తున్నందున ‘అయితే’ వాడాం; πρὸς αὐτόνను ‘అతనికి’గా స్పష్టంగా ఉంచాం.
- source_word: Ἄφες ἄρτι
  choice: ఇప్పటికి ఇలా జరగనివ్వు
  rationale: ἀφίημι ఇక్కడ ‘క్షమించు’ అని కాక, యోహాను బాప్తిస్మం ఇవ్వడానికి అనుమతించు అనే అర్థం. ἄρτιలోని ప్రస్తుత సందర్భానికి పరిమితమైన భావాన్ని ‘ఇప్పటికి’ తెలియజేస్తుంది.
- source_word: οὕτως γὰρ
  choice: ఎందుకంటే ఈ విధంగా
  rationale: οὕτως యోహాను యేసుకు బాప్తిస్మం ఇవ్వడమనే ఇప్పుడే ప్రస్తావించిన విధానాన్ని సూచిస్తుంది; γάρ కారణాన్ని పరిచయం చేస్తుంది.
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: మనకు తగినది
  rationale: πρέπονలోని సముచితత, యుక్తత భావాన్ని ఆధునిక సహజ తెలుగులో ‘తగినది’ నిలుపుతుంది; ἡμῖνను ‘మనకు’గా చేర్చాం.
- source_word: πληρῶσαι πᾶσαν δικαιοσύνην
  choice: నీతియంతటినీ నెరవేర్చడం
  rationale: πληρόωకు మత్తయి రచనలో ఉన్న ‘నెరవేర్చు’ ప్రతిధ్వనిని నిలిపాం. δικαιοσύνηను సంకుచితమైన ధర్మశాస్త్ర ఆచరణగా వివరణ చేయకుండా, దేవుని చిత్తానికి అనుగుణమైన నీతి అనే విస్తృత భావంతో ‘నీతి’గా అనువదించాం.
- source_word: τότε ἀφίησιν αὐτόν
  choice: అప్పుడు యోహాను ఆయనను అనుమతించాడు
  rationale: ἀφίησιν చారిత్రక వర్తమాన కాలంలో ఉన్నా తెలుగు కథనానికి సహజంగా భూతకాలం వాడాం. గ్రీకులోని సర్వనామ సూచనలను సందర్భానుసారం యోహాను, యేసు అని స్పష్టం చేశాం; క్రియను మొదటి ἀφίημι వలే ‘అనుమతించాడు’గా ఉంచాం.
theological_decisions:
- issue: πᾶσαν δικαιοσύνην యొక్క అర్థం
  choice: నీతియంతటినీ
  alternative: న్యాయమంతటినీ; నీతి కోరేదంతా
  rationale: ఈ పదబంధాన్ని ప్రతి న్యాయశాస్త్ర ఆజ్ఞను పాటించడమనే సంకుచిత భావానికి పరిమితం చేయలేదు; అలాగే వచనం స్పష్టంగా చెప్పని సిద్ధాంత వ్యవస్థను చొప్పించలేదు. ఈ సందర్భంలో యోహాను చేత బాప్తిస్మం పొందడం ద్వారా దేవుని నీతియుక్తమైన ఉద్దేశానికి అనుగుణంగా చేయాల్సినదంతా చేయడం అనే విస్తృత భావాన్ని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని కారణ సంబంధం, ‘మనకు’ అనే సంయుక్త బాధ్యత, δικαιοσύνη యొక్క విశాలమైన భావపరిధి నిలిచాయి. పాదసూచిక గుర్తును దానికి సంబంధించిన ‘నీతియంతటినీ’ పదం వద్ద ఉంచాం.
