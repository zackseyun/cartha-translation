- from: యేసు బాప్తిస్మం పొందగానే నీళ్లనుండి పైకి వచ్చాడు.[a] ఇదిగో, ఆకాశాలు తెరవబడ్డాయి; దేవుని ఆత్మ పావురంలా[b] దిగివచ్చి తన మీదికి రావడం ఆయన చూశాడు.[c]
