id: MAT.3.16
reference: Matthew 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: te
  text: యేసు బాప్తిస్మం పొందిన వెంటనే నీళ్లనుండి[a] పైకి వచ్చాడు. ఇదిగో, ఆకాశాలు తెరవబడ్డాయి; దేవుని ఆత్మ పావురంలా[b] దిగివచ్చి తన మీదికి రావడాన్ని ఆయన చూశాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘నీళ్లలోనుండి పైకి వచ్చాడు.’ గ్రీకులో అక్షరార్థంగా ‘నీళ్లనుండి’ (ἀπὸ τοῦ ὕδατος) అని ఉంది.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: ‘పావురం వలె.’ గ్రీకు పదం పోలికను సూచిస్తుంది; ఆత్మ అక్షరార్థంగా పావురమని చెప్పదు.'
    reason: alternative_reading
  - marker: c
    text: కొన్ని అనువాదాలు ‘ఆయన మీద వాలడం’ అని చెబుతాయి; గ్రీకు క్రియకు మరింత అక్షరార్థంగా ‘ఆయన మీదికి రావడం’ అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: యేసు బాప్తిస్మం పొందగానే
  rationale: కాలసంబంధమైన aorist passive participle‌ను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. ‘పొందగానే’ ప్రధాన క్రియకు ముందున్న బాప్తిస్మాన్ని, వెంటనే జరిగిన తదుపరి చర్యను స్పష్టంగా తెలియజేస్తుంది; δέను ప్రత్యేక విరోధార్థక పదంతో బలపరచకుండా కథన ప్రవాహంలో కలుపుతుంది.
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: నీళ్లనుండి పైకి వచ్చాడు
  rationale: ‘పొందగానే’ ద్వారా εὐθύς సూచించే తక్షణ క్రమం వ్యక్తమవుతుంది. ἀπόకు అనుగుణంగా ‘నీళ్లనుండి’ అని ఉంచడం, ‘నీళ్లలోనుండి’ అని తప్పనిసరిగా మరింత బలంగా చెప్పకుండా మూలంలోని పరిమితిని కాపాడుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే కథన సూచిక యొక్క హఠాత్తు, సజీవ ప్రభావాన్ని సహజమైన తెలుగు బైబిలు శైలిలో నిలుపుతుంది.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: ఆకాశాలు తెరవబడ్డాయి
  rationale: బహువచనమైన οἱ οὐρανοίను, క్రియలోని passive రూపాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: πνεῦμα θεοῦ
  choice: దేవుని ఆత్మ
  rationale: గ్రీకు genitive నిర్మాణాన్ని నేరుగా ప్రతిబింబిస్తూ, మూలంలో లేని ‘పరిశుద్ధ’ అనే విశేషణాన్ని చేర్చదు.
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: పావురంలా దిగివచ్చి
  rationale: ὡσεὶలోని పోలికను నిలుపుతుంది; ఆత్మ అక్షరార్థంగా పావురమే అని నిర్ధారించదు.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: తన మీదికి రావడం
  rationale: ἐρχόμενον యొక్క సాధారణ ‘రావడం’ భావాన్ని నిలుపుతూ, ἐπί సూచించే యేసు వైపు/మీదికి కదలికను తెలియజేస్తుంది; ‘వాలి కూర్చోవడం’ వంటి అదనపు భావాన్ని చేర్చదు.
theological_decisions:
- issue: πνεῦμα θεοῦ సాధారణ ఆత్మను సూచిస్తుందా, దేవుని ఆత్మను సూచిస్తుందా
  choice: దేవుని ఆత్మ
  alternative: దేవుని నుండి వచ్చిన ఒక ఆత్మ
  rationale: బాప్తిస్మ సందర్భం నిర్దిష్టమైన దేవుని ఆత్మను సూచిస్తుంది. అయినా గ్రీకులో ఉన్న మాటనే ఉంచి ‘పరిశుద్ధాత్మ’ అనే మరింత వ్యాఖ్యానాత్మక బిరుదును ప్రత్యామ్నాయంగా చేర్చలేదు.
- issue: ὡσεὶ περιστερὰν ఆత్మను పావురంగా గుర్తిస్తుందా లేక పోలికను మాత్రమే చెబుతుందా
  choice: పావురంలా
  alternative: పావురంగా
  rationale: ὡσεὶ పోలికను సూచిస్తుంది. అందువల్ల ఆత్మ అక్షరార్థంగా పావురమని చెప్పకుండా మూలంలోని రూపక పరిమితిని కాపాడుతుంది.
- issue: εἶδεν అనే క్రియకు కర్త ఎవరు
  choice: ఆయన చూశాడు—సందర్భంలో యేసు
  alternative: యోహాను చూశాడు
  rationale: వాక్యంలోని వ్యాకరణ కర్త యేసే; ప్రధాన క్రియకు కూడా అదే కర్త సహజంగా కొనసాగుతుంది. తెలుగులో ‘ఆయన’ ద్వారా దీనిని స్పష్టంగా, కాని అనవసర నామపునరుక్తి లేకుండా తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే ‘ఇదిగో,’ ‘దేవుని ఆత్మ,’ ‘ఆకాశాలు’ వంటి మూలపాఠ్య గంభీరతను మోసే పదాలతో గౌరవప్రదమైన శైలి. ‘బాప్తిస్మం’ విస్తృతంగా గుర్తుపట్టే బైబిలు పదంగా ఉంచబడింది.
