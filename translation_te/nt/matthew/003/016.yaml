  rationale: 'The revision separates the temporal passive participle from the adverb of immediacy: పొందిన reflects ''was baptized,'' and వెంటనే reflects εὐθύς. It also moves the lexical-alternative anchor to the translated prepositional phrase. The remaining wording is retained because it is source-faithful, natural in modern standard Telugu, and preserves the Greek comparison and motion language without interpretive expansion.'
