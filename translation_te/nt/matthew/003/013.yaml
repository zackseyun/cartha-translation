revisions:
- from: అప్పుడు యేసు తనకు యోహాను చేత బాప్తిస్మం పొందడానికి గలిలయ నుండి యొర్దాను దగ్గరికి, యోహాను వద్దకు వస్తాడు.[a]
  to: అప్పుడు యేసు గలిలయ నుండి యొర్దాను దగ్గరికి, యోహాను వద్దకు, యోహాను చేత బాప్తిస్మం పొందడానికి వస్తాడు.[a]
  rationale: The revision retains the source order and vivid historical present while removing the unnecessary reflexive element and placing John’s agency directly with the passive-purpose expression it modifies. The footnote remains correctly anchored to ‘వస్తాడు’ and accurately notes the historical present and lexical alternatives.
