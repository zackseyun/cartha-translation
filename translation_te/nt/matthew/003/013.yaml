id: MAT.3.13
reference: Matthew 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: te
  text: అప్పుడు యేసు గలిలయ నుండి యొర్దాను దగ్గరికి, యోహాను వద్దకు, యోహాను చేత బాప్తిస్మం పొందడానికి వస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వస్తాడు’ అని అనువదించిన గ్రీకు క్రియ చారిత్రక వర్తమాన కాలంలో ఉంది; ‘వచ్చాడు’ లేదా ‘చేరుకుంటాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: తరువాతి సంఘటనను కథన క్రమంలో ప్రవేశపెట్టే సహజమైన తెలుగు కాలసూచకం.
- source_word: παραγίνεται
  choice: వస్తాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమాన కాలపు సజీవ కథనశైలిని తెలుగులో వర్తమాన రూపంతో నిలుపుతుంది; సందర్భంలో చేరుకోవడం అనే భావమూ ఉంది.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: గలిలయ నుండి
  rationale: ἀπό సూచించే బయలుదేరిన స్థలం లేదా మూలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: యొర్దాను దగ్గరికి
  rationale: చలనాన్ని సూచించే ἐπί + ద్వితీయా విభక్తి యొర్దాను వైపు చేరడాన్ని తెలియజేస్తుంది; తెలుగులో నదిని ఉద్దేశించినట్లు సహజంగా ఉంటుంది.
- source_word: πρὸς τὸν Ἰωάννην
  choice: యోహాను వద్దకు
  rationale: ఒక వ్యక్తి వైపు వెళ్లడాన్ని సూచిస్తుంది; ఈ వచనంలో లేని ‘బాప్తిస్మమిచ్చే’ అనే బిరుదును చేర్చదు.
- source_word: τοῦ βαπτισθῆναι
  choice: బాప్తిస్మం పొందడానికి
  rationale: కర్తరి కాని అనంతక్రియతో వ్యక్తమైన ఉద్దేశాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑπ’ αὐτοῦ
  choice: తనకు యోహాను చేత
  rationale: ὑπό + షష్ఠీ సూచించే వ్యక్తిగత కర్తృత్వాన్ని తెలుగులో ‘చేత’తో తెలియజేస్తుంది; తెలుగు వాక్యస్పష్టత కోసం సర్వనామానికి బదులు దాని పూర్వపదమైన యోహానును ఉంచింది.
theological_decisions:
- issue: παραγίνεται అనే చారిత్రక వర్తమాన కాలం
  choice: ‘వస్తాడు’ అనే వర్తమాన రూపాన్ని నిలుపడం
  alternative: ‘వచ్చాడు’ అనే సాధారణ భూతకాలం
  rationale: మత్తయి కథనంలోని సజీవతను నిలుపుతుంది; సిద్ధాంతపరమైన అదనపు అర్థాన్ని కలపదు.
- issue: యోహాను బిరుదు
  choice: ‘యోహాను’ మాత్రమే
  alternative: ‘బాప్తిస్మమిచ్చే యోహాను’
  rationale: మూల వచనంలో పేరు మాత్రమే ఉంది కాబట్టి సందర్భం నుండి తెలిసే బిరుదును ఈ వచనంలో చేర్చలేదు.
- issue: ὑπ’ αὐτοῦ లోని సర్వనామం
  choice: తెలుగు స్పష్టత కోసం ‘యోహాను చేత’
  alternative: ‘అతని చేత’
  rationale: గ్రీకులో సూచిత వ్యక్తి యోహానే. తెలుగులో ‘అతని’ అనడం క్షణిక అస్పష్టత కలిగించవచ్చు; పేరును పునరుక్తి చేయడం అర్థాన్ని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే కథనశైలి. ‘యొర్దాను’ అనే స్థిరపడిన బైబిలు నామరూపాన్ని, ‘బాప్తిస్మం’ అనే విస్తృతంగా గుర్తించబడే పదాన్ని ఉపయోగించింది.
