revisions:
- from: అయితే యోహాను, “నేనే నీ చేత బాప్తిస్మం పొందాల్సినవాణ్ణి; నువ్వు నా దగ్గరికి వస్తున్నావా?” అంటూ ఆయనను ఆపడానికి పదేపదే ప్రయత్నించాడు.[a]
  to: కానీ యోహాను, “నాకే నీ చేత బాప్తిస్మం పొందవలసిన అవసరం ఉంది; నువ్వే నా దగ్గరికి వస్తున్నావా?” అంటూ ఆయనను అడ్డుకోవడానికి పదేపదే ప్రయత్నించాడు.[a]
  rationale: The revision directly renders John’s stated need, preserves the passive-agent relation (‘నీ చేత’), and reflects the Greek’s explicit reciprocal emphasis (‘నాకే ... నువ్వే’). It retains the imperfective nuance of διεκώλυεν and does not resolve the verse’s theological implication beyond what John says.
