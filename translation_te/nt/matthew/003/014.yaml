id: MAT.3.14
reference: Matthew 3:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: te
  text: కానీ యోహాను, “నాకే నీ చేత బాప్తిస్మం పొందవలసిన అవసరం ఉంది; నువ్వే నా దగ్గరికి వస్తున్నావా?” అంటూ ఆయనను అడ్డుకోవడానికి పదేపదే ప్రయత్నించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను అడ్డుకోవడానికి ప్రయత్నించాడు.” గ్రీకు అసంపూర్ణ భూతకాల క్రియ పునరావృతమైన లేదా కొనసాగిన చర్యను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: ఆపడానికి పదేపదే ప్రయత్నించాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగిన లేదా పునరావృతమైన ప్రయత్నాన్ని సూచించగలదు. తెలుగు సహజత్వంతో ఆ భావాన్ని వ్యక్తం చేస్తుంది; అయితే సాధారణ గతకాల భావమూ సాధ్యమేనని పాదసూచికలో ఉంచాం.
- source_word: λέγων
  choice: అంటూ
  rationale: యోహాను పలికిన మాటలే ఆయన అడ్డుకునే చర్యతో ఏకకాలంలో సాగాయని సహజమైన తెలుగులో అనుసంధానిస్తుంది.
- source_word: χρείαν ἔχω
  choice: పొందాల్సినవాణ్ణి
  rationale: ‘నాకు అవసరం ఉంది’ అనే గ్రీకు నుడికారాన్ని సందర్భానుగుణంగా సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὑπὸ σοῦ
  choice: నీ చేత
  rationale: కర్మణి క్రియారూపంతో కలిసి వ్యక్తిగత కర్తృత్వాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: βαπτισθῆναι
  choice: బాప్తిస్మం పొందాల్సిన
  rationale: కర్మణి భావాన్ని నిలుపుతూ, బాప్తిస్మ విధానాన్ని అవసరానికి మించి నిర్దిష్టం చేయని స్థిరమైన తెలుగు పదప్రయోగం.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: నువ్వు నా దగ్గరికి వస్తున్నావా?
  rationale: వర్తమాన కాలంలోని ఆశ్చర్యం, వ్యతిరేకత కలిగిన ప్రశ్నను అదనపు వ్యాఖ్యానం లేకుండా సహజంగా అందిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వచనంలో యేసు యోహాను దగ్గరికి రావడానికి, యోహాను స్పందనకు మధ్యనున్న స్వల్ప వ్యతిరేకతను తెలియజేస్తుంది.
theological_decisions:
- issue: యేసుకు బాప్తిస్మం ఇవ్వడంపై యోహాను అభ్యంతరం
  choice: యోహాను యేసు గొప్పతనాన్ని గుర్తించి, తానే యేసు చేత బాప్తిస్మం పొందాల్సినవాడినని చెప్పిన మాటను యథాతథంగా ఉంచడం.
  alternative: దీనిని ప్రధానంగా యేసు పాపరాహిత్యం గురించిన ప్రకటనగా లేదా కేవలం హోదా/అధికారం గురించిన ప్రకటనగా వివరించడం.
  rationale: వచనం యోహాను అవసరాన్ని, యేసు ఆధిక్యతను వ్యక్తం చేస్తుంది; కానీ దాని పూర్తి సిద్ధాంతపరమైన కారణాన్ని వివరించదు. అందువల్ల ఆ ఉద్వేగాన్ని అనువాదం పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ప్రత్యక్ష సంభాషణలో ‘నీ/నువ్వు’ రూపాలు సాధారణ బైబిలు తెలుగు వాడుకకు అనుగుణంగా ఉన్నాయి; ‘బాప్తిస్మం’ స్థిరమైన మతపర పదంగా ఉంచబడింది.
