id: MAT.3.3
reference: Matthew 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: te
  text: 'ఎందుకంటే, ప్రవక్తయైన యెషయా ద్వారా ఇలా చెప్పబడినవాడు ఇతడే:


    “అరణ్యంలో కేక వేస్తున్నవాని స్వరం[a]:


    ‘ప్రభువు[b] మార్గాన్ని సిద్ధం చేయండి;


    ఆయన బాటలను తిన్నగా చేయండి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “కేక వేస్తున్నవాని స్వరం: ‘అరణ్యంలో ప్రభువు మార్గాన్ని సిద్ధం చేయండి…’”'
    reason: ‘అరణ్యంలో’ అనే పదబంధాన్ని కేక వేయడంతో కాకుండా మార్గాన్ని సిద్ధం చేయాలనే ఆజ్ఞతో అనుసంధానించే సాధ్యమైన పఠనాన్ని చూపుతుంది.
  - marker: b
    text: ఈ ఉల్లేఖనం యెషయా 40:3ను ప్రతిధ్వనిస్తుంది; అక్కడి హీబ్రూ పాఠంలో ‘ప్రభువు’కు బదులుగా YHWH అనే దైవనామం ఉంది.
    reason: గ్రీకు κυρίου ను అనుసరించిన ప్రధాన అనువాదంతో పాటు హీబ్రూ మూలంలోని దైవనామ నేపథ్యాన్ని సంరక్షిస్తుంది.
lexical_decisions:
- source_word: οὗτος
  choice: ఇతడే
  rationale: సమీప సందర్భంలోని బాప్తిస్మమిచ్చే యోహానును సూచించే నిర్దేశక సర్వనామం. ‘ఇతడే’ గ్రీకు పదంలోని సూచనను, ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి వివరణను పరిచయం చేస్తుంది; ఆధునిక తెలుగులో కారణసంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ ῥηθεὶς
  choice: చెప్పబడినవాడు
  rationale: నామవాచకంగా పనిచేసే కర్మణి భూతకాల అసమాపక క్రియారూపాన్ని నిలుపుతూ, ప్రవచనంలో ప్రస్తావించబడిన వ్యక్తిని సూచిస్తుంది.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: ప్రవక్తయైన యెషయా ద్వారా
  rationale: διά + షష్ఠీ విభక్తి ప్రవక్తను మధ్యవర్తి సాధనంగా చూపుతుంది. ‘ద్వారా’ ఆ భావాన్ని ‘యెషయా చెప్పాడు’ అని సరళీకరించకుండా కాపాడుతుంది.
- source_word: λέγοντος
  choice: ఇలా
  rationale: వెంటనే వచ్చే ఉల్లేఖనాన్ని సహజమైన తెలుగు ఉల్లేఖన సూత్రంతో పరిచయం చేస్తుంది; ‘చెబుతూ’ అనే అసహజ నిర్మాణాన్ని నివారిస్తుంది.
- source_word: Φωνὴ βοῶντος
  choice: కేక వేస్తున్న ఒకని స్వరం
  rationale: φωνή అనిర్దిష్టంగా ఉండడం వల్ల ‘ఒకని’ వాడబడింది; βοῶντος లోని బిగ్గరగా ప్రకటించే భావాన్ని ‘కేక వేస్తున్న’ తెలియజేస్తుంది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: యోహాను పరిచర్య జరిగిన జనావాసం లేని ప్రాంతాన్ని, యెషయా ప్రతిధ్వనిని రెండింటినీ తెలిపే స్థిరమైన తెలుగు పదం. ఈ పదబంధం దేనితో అనుసంధానించాలో ఉన్న వ్యాకరణ సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: Ἑτοιμάσατε
  choice: సిద్ధం చేయండి
  rationale: నిర్ణాయక చర్యకు పిలిచే బహువచన ఆజ్ఞను స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὴν ὁδὸν
  choice: మార్గాన్ని
  rationale: ప్రవచనాత్మక రూపకాన్ని, యెషయా 40:3తో అంతర్గ్రంథ సంబంధాన్ని నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: మత్తయి గ్రీకు పాఠంలోని κυρίου ను నేరుగా అనుసరిస్తుంది. యెషయా 40:3 హీబ్రూ పాఠంలో దైవనామం YHWH ఉండడాన్ని పాదసూచిక తెలియజేస్తుంది.
- source_word: εὐθείας ποιεῖτε
  choice: తిన్నగా చేయండి
  rationale: దారులను వంకరలులేకుండా నేరుగా చేయాలనే రూపకాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰς τρίβους αὐτοῦ
  choice: ఆయన బాటలను
  rationale: τρίβος యొక్క చిన్న దారి/బాట భావాన్ని కాపాడుతూ, αὐτοῦ లోని వ్యక్తిగత సూచనను గౌరవార్థక ‘ఆయన’తో నిలుపుతుంది.
theological_decisions:
- issue: హీబ్రూ యెషయా 40:3లో YHWH ఉన్న ఉల్లేఖనంలో κυρίου అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా / దైవనామం YHWH
  rationale: ప్రధాన పాఠం మత్తయి ఉపయోగించిన గ్రీకు κυρίου ను అనుసరిస్తుంది; అదే సమయంలో మూల హీబ్రూ ఉల్లేఖనంలోని దైవనామ నేపథ్యాన్ని పాదసూచికలో వెల్లడించడం ద్వారా క్రైస్తవార్థాన్ని అతిగా వివరించకుండా అంతర్గ్రంథ ఉద్వేగాన్ని కాపాడుతుంది.
- issue: ἐν τῇ ἐρήμῳ పదబంధం ఎక్కడ అనుసంధానమవుతుంది
  choice: 'కేక వేస్తున్న వ్యక్తితో: ‘అరణ్యంలో కేక వేస్తున్న’'
  alternative: 'ఆజ్ఞతో: ‘అరణ్యంలో ప్రభువు మార్గాన్ని సిద్ధం చేయండి’'
  rationale: మత్తయి సమీప సందర్భంలో యోహాను అరణ్యంలో ప్రకటిస్తున్నందున ప్రధాన పాఠంలోని అనుసంధానం సహజం. అయితే గ్రీకు పదక్రమం, యెషయా ఉల్లేఖన సంప్రదాయం మరో అనుసంధానానికి వీలు ఇస్తాయి; అందువల్ల దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రవచన ఉల్లేఖనానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. ‘అరణ్యం,’ ‘మార్గం,’ ‘బాటలు’ వంటి పదాలు కవితాత్మక సమాంతరతను నిలుపుతాయి; పాతకాలపు క్రియారూపాలను నివారించాం.
