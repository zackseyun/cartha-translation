id: MAT.3.1
reference: Matthew 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ἐκείναις παραγίνεται Ἰωάννης ὁ βαπτιστὴς κηρύσσων ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/001.yaml
  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: te
  text: ఆ రోజుల్లో బాప్తిస్మమిచ్చే యోహాను[a] యూదయ అరణ్యంలో ప్రకటిస్తూ వచ్చాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బాప్తిస్మదాత యోహాను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రత్యక్షమయ్యాడు.” గ్రీకు మూలంలో ఇక్కడ చారిత్రక వర్తమాన కాల క్రియ ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: ఆ రోజుల్లో
  rationale: కాలాన్ని సూచించే మూలభాషా పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది. δέ స్వల్ప కథన అనుసంధానాన్ని సూచించినా, తెలుగులో ప్రత్యేక సంధానపదం చేర్చకుండానే సందర్భ మార్పు స్పష్టంగా ఉంటుంది.
- source_word: παραγίνεται
  choice: వచ్చాడు
  rationale: గ్రీకులో ఇది చారిత్రక వర్తమాన కాలంలో ఉంది; తెలుగు కథనశైలిలో భూతకాలమైన ‘వచ్చాడు’ సహజంగా ఉంటుంది. కొత్త వ్యక్తి కథనంలో ప్రవేశించడాన్ని ఇది అతిశయార్థం లేకుండా తెలియజేస్తుంది.
- source_word: Ἰωάννης
  choice: యోహాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ὁ βαπτιστὴς
  choice: బాప్తిస్మమిచ్చే యోహాను
  rationale: βαπτιστής అనే కార్యాధారిత బిరుదును సాధారణ పాఠకునికి వెంటనే అర్థమయ్యే సహజ తెలుగు పదబంధంగా అందిస్తుంది; ఇది ఏ సంఘపరమైన గుర్తింపునూ మూలపాఠంలోకి దిగుమతి చేయదు.
- source_word: κηρύσσων
  choice: ప్రకటిస్తూ
  rationale: ప్రధాన క్రియతో సమకాలీనంగా జరుగుతున్న ప్రకటన కార్యాన్ని వర్తమాన క్రియావిశేషణ రూపంలో నిలుపుతుంది. ‘బోధిస్తూ’ కంటే ‘ప్రకటిస్తూ’ అనే పదం దూతవలె బహిరంగంగా చాటే భావానికి దగ్గరగా ఉంటుంది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: నివాసాలు తక్కువగా ఉన్న నిర్జన ప్రాంతాన్ని సూచిస్తుంది; ఆధునిక పాఠకుడు ఇసుక ఎడారిగా మాత్రమే అర్థం చేసుకునే ప్రమాదాన్ని నివారిస్తుంది.
- source_word: τῆς Ἰουδαίας
  choice: యూదయ
  rationale: ఇక్కడ గోత్రనామం ‘యూదా’ కాక, భౌగోళిక ప్రాంతమైన యూదయ ఉద్దేశించబడింది.
theological_decisions:
- issue: βαπτιστής అనే యోహాను బిరుదు
  choice: బాప్తిస్మమిచ్చే యోహాను
  alternative: బాప్తిస్మదాత యోహాను
  rationale: ఇది సిద్ధాంత నిర్ణయం కాక, కార్యాన్ని తెలిపే బిరుదుకు సంబంధించిన పదప్రయోగ నిర్ణయం. ప్రధాన పాఠంలోని రూపం ఆధునిక సాధారణ తెలుగులో పారదర్శకంగా ఉండి, గ్రీకు పదంలోని ‘బాప్తిస్మమిచ్చేవాడు’ అనే భావాన్ని కాపాడుతుంది.
- issue: παραγίνεται యొక్క కథన కాలం మరియు భావ ఛాయ
  choice: వచ్చాడు
  alternative: ప్రత్యక్షమయ్యాడు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన భూతకాల కథనంగా ఇచ్చాం. ‘ప్రత్యక్షమయ్యాడు’ కూడా సాధ్యమే కాని, అది అకస్మాత్తు లేదా అసాధారణ ప్రత్యక్షత అనే అదనపు భావాన్ని కొందరు పాఠకులకు కలిగించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ‘బాప్తిస్మమిచ్చే’ అనే పారదర్శక రూపం సంప్రదాయ బిరుదు వల్ల కలగగల సంఘపరమైన అపార్థాన్ని తగ్గిస్తుంది; ‘అరణ్యం’ భౌగోళిక భావాన్ని సహజంగా నిలుపుతుంది.
