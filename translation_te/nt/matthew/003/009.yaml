id: MAT.3.9
reference: Matthew 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: te
  text: ‘అబ్రాహాము మా తండ్రి’ అని మీలో మీరు చెప్పుకోవడం మొదలుపెట్టకండి.[a] ఎందుకంటే, దేవుడు ఈ రాళ్ల నుంచే అబ్రాహాముకు పిల్లలను లేవనెత్తగలడని నేను మీకు చెబుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ మనసుల్లో చెప్పుకోవడం.” గ్రీకు పదబంధం అంతరంగంలో తమకు తాము అనుకోవడాన్నిగానీ, ఒక సమూహంగా తమలో తాము చెప్పుకోవడాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: చెప్పుకోవచ్చని అనుకోకండి
  rationale: μήతో కూడిన aorist subjunctive ఒక తప్పుడు, ధీమాతో కూడిన ఊహను చేపట్టవద్దనే హెచ్చరిక. తెలుగులో సహజంగా ఉండేందుకు λέγεινతో కలిపి ‘చెప్పుకోవచ్చని అనుకోకండి’ అని అనువదించబడింది.
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: మీలో మీరు చెప్పుకోవడం
  rationale: ఈ పదబంధం అంతరంగ స్వగతాన్నిగానీ, సమూహంలో పరస్పరం చెప్పుకోవడాన్నిగానీ సూచించవచ్చు. ‘మీలో మీరు’ ఈ రెండు భావాలకు చోటిస్తుంది; సందిగ్ధతను పాదటిప్పణి వివరిస్తుంది.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: అబ్రాహాము మా తండ్రి
  rationale: వంశపారంపర్య ఆధిక్యతపై ఆధారపడే వారి బలమైన వాదనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: λέγω γὰρ ὑμῖν
  choice: ఎందుకంటే ... మీతో చెబుతున్నాను
  rationale: γάρ ఇచ్చే వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’ నిలుపుతుంది; ‘మీతో చెబుతున్నాను’ ఆ సంభాషణ సూత్రానికి గంభీరమైన సహజ తెలుగు రూపం.
- source_word: δύναται
  choice: చేయగలడు
  rationale: దేవుని సామర్థ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκ τῶν λίθων τούτων
  choice: ఈ రాళ్ల నుంచే
  rationale: ἐκ యొక్క మూలార్థాన్ని నిలుపుతూ, ‘నుంచే’ ద్వారా చూపబడుతున్న ఈ రాళ్ల నుండికూడా దేవుడు చేయగలడనే వాక్యబలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐγεῖραι
  choice: పుట్టించు
  rationale: ఇక్కడ ἐγείρω పునరుత్థానాన్ని తప్పనిసరిగా సూచించదు; అబ్రాహాముకు సంతానాన్ని ఉనికిలోకి తేవడం అనే సందర్భార్థాన్ని ‘పుట్టించు’ స్పష్టంగా, సహజంగా ఇస్తుంది.
- source_word: τέκνα
  choice: పిల్లలు
  rationale: τέκνα లింగపరంగా సమగ్రంగా పిల్లలు లేదా సంతానాన్ని సూచిస్తుంది; ‘పిల్లలు’ సాధారణ పాఠకులకు సహజమైన ఎంపిక.
- source_word: τῷ Ἀβραάμ
  choice: అబ్రాహాముకు
  rationale: 'దత్తి విభక్తిలోని సంబంధ భావాన్ని నేరుగా నిలుపుతుంది: అబ్రాహాముతో సంతాన సంబంధంలో ఉన్న పిల్లలు.'
theological_decisions:
- issue: అబ్రాహాము సంతతి గురించి యోహాను చేసిన హెచ్చరిక
  choice: శారీరకంగా అబ్రాహాము వంశానికి చెందినదానిపైనే దేవుని ఎదుట భద్రత కోసం ఆధారపడడాన్ని వాక్యం తిరస్కరిస్తుంది; అయితే ఇశ్రాయేలుకు అబ్రాహాము చారిత్రక పితరుడనే విషయాన్ని తిరస్కరించదు.
  alternative: ఇది వంశాధిక్యతపై ఎలాంటి వేదాంత విమర్శ లేని కేవలం అలంకారిక అతిశయోక్తి; లేదా జాతిపరమైన ఇశ్రాయేలు స్థానభ్రంశం చేయబడిందని ఇది సూచిస్తుంది.
  rationale: వాక్యం పూర్వీకత్వంపై పెట్టుకున్న నమ్మకాన్ని నేరుగా మందలిస్తుంది. అయితే అది చెప్పని స్థానభ్రంశ సిద్ధాంతాన్నిగానీ ఇతర తరువాతి వేదాంత వ్యవస్థలనుగానీ అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే యోహాను హెచ్చరికలోని గంభీరతను నిలుపుతూ రూపొందించబడింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
