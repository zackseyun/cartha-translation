  to: “నేను మిమ్మల్ని పశ్చాత్తాపం కోసం నీటిలో[a][b] బాప్తిస్మం ఇస్తున్నాను. అయితే నా తర్వాత వచ్చేవాడు నాకంటే శక్తిమంతుడు; ఆయన చెప్పులను మోయటానికైనా నేను అర్హుడను కాను. ఆయనే మిమ్మల్ని పరిశుద్ధాత్మలోనూ అగ్నిలోనూ[c] బాప్తిస్మం ఇస్తాడు.”
  rationale: The revision makes only stylistic and register-level improvements. It retains every source-level element, including the emphatic ‘ఆయనే,’ the carrying—not removing—of sandals, the repeated ‘in’ construction, and the unresolved force of ‘Holy Spirit and fire.’ Footnote markers remain anchored to the relevant expressions and all original note functions are retained.
