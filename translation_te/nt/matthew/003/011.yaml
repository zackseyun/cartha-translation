id: MAT.3.11
reference: Matthew 3:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: te
  text: “నేను మిమ్మల్ని పశ్చాత్తాపం కోసం నీటిలో[a][b] బాప్తిస్మం ఇస్తున్నాను. అయితే నా తర్వాత వచ్చేవాడు నాకంటే శక్తిమంతుడు; ఆయన చెప్పులను మోయటానికైనా నేను అర్హుడను కాను. ఆయనే మిమ్మల్ని పరిశుద్ధాత్మలోనూ అగ్నిలోనూ[c] బాప్తిస్మం ఇస్తాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీటితో’ అని, తరువాత ‘పరిశుద్ధాత్మతోనూ అగ్నితోనూ’ అని కూడా అనువదించవచ్చు; ఈ పదబంధాల్లో గ్రీకు ἐν అనే పదానికి ‘లో’ లేదా ‘తో’ అనే భావాలు ఉండగలవు.
    reason: lexical_alternative
  - marker: b
    text: ‘పశ్చాత్తాపం కోసం’ అనే మాటను ‘పశ్చాత్తాపం వైపుగా’ అని కూడా అర్థం చేసుకోవచ్చు. గ్రీకు పదబంధం దిశాత్మక భావాన్ని కలిగి ఉంది; పశ్చాత్తాపం బాప్తిస్మానికి ముందా, లేక బాప్తిస్మం దానిని సూచిస్తుందా అనేది ఈ పదబంధం ఒక్కటే నిర్ణయించదు.
    reason: lexical_alternative
  - marker: c
    text: ‘అగ్ని’ శుద్ధీకరణను లేదా తీర్పును సూచించవచ్చు; ఇక్కడ గ్రీకు పాఠ్యం ఈ చిత్రార్థాన్ని తెరిచి ఉంచుతుంది. అర్థాన్ని నిర్ణయించడంలో చుట్టుపక్కల సందర్భాన్ని గమనించాలి.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: బాప్తిస్మమిస్తున్నాను / బాప్తిస్మమిస్తాడు
  rationale: తెలుగులో స్థిరపడిన ‘బాప్తిస్మం’ పదాన్ని ఉంచడం ద్వారా, సందర్భం స్పష్టంగా నిర్దేశించని విధానాన్ని ‘ముంచడం’ అని పరిమితం చేయకుండా ఆచారార్థాన్ని నిలుపుతుంది.
- source_word: ἐν ὕδατι
  choice: నీళ్లలో
  rationale: ἐν అనే విభక్త్యర్థక అవ్యయానికి ఇక్కడ ‘లో’ అనే ప్రత్యక్ష అర్థాన్ని ఇచ్చి, తరువాతి ‘పరిశుద్ధాత్మలోనూ అగ్నిలోనూ’ అనే సమాంతర నిర్మాణాన్ని నిలిపింది.
- source_word: εἰς μετάνοιαν
  choice: పశ్చాత్తాపం కోసం
  rationale: εἰς లోని దిశాత్మక లేదా ప్రయోజనార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; బాప్తిస్మానికి పశ్చాత్తాపంతో ఉన్న ఖచ్చిత సంబంధాన్ని ప్రధాన పాఠ్యంలో మరింత నిర్దేశించదు.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: అయితే నా తర్వాత వస్తున్నవాడు
  rationale: సుబంత క్రియారూపాన్ని సహజంగా తెలుగులో వ్యక్తం చేస్తూ, ὀπίσω μου లోని క్రమానుసార భావాన్ని ‘నా తర్వాత’ అని స్పష్టం చేస్తుంది.
- source_word: ἰσχυρότερός μού
  choice: నాకంటే శక్తిమంతుడు
  rationale: తులనాత్మక భావాన్ని సంక్షిప్తంగా, సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: ఆయన ... నేను తగినవాణ్ణి కాను
  rationale: ἱκανός కు ‘సామర్థ్యం గలవాడు’ అనే అర్థం ఉండగలిగినా, ఈ వినయప్రకటనలో ‘తగినవాడు కాను’ అనేది సందర్భోచితమైన భావాన్ని ఇస్తుంది.
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: ఆయన చెప్పులు మోయడానికి
  rationale: βαστάσαι అంటే ‘మోయడం’; ‘విప్పడం’ కాదు. ‘చెప్పులు’ సాధారణ పాఠకులకు సహజంగా ఉండి, ప్రాచీన పాదరక్షలను సూచించగలదు.
- source_word: αὐτός
  choice: ఆయనే
  rationale: యోహాను చేసే బాప్తిస్మానికి రాబోయే వ్యక్తి చేసే బాప్తిస్మాన్ని ఎదురుగా ఉంచే గ్రీకు సర్వనామపు ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: పరిశుద్ధాత్మలోనూ
  rationale: ఈ మత్తయి సందర్భంలో πνεῦμα ἅγιον పరిశుద్ధాత్మను సూచిస్తుంది. ‘లో’ అనే రూపం పునరావృతమైన ἐν నిర్మాణాన్ని నిలుపుతుంది.
- source_word: καὶ πυρί
  choice: అగ్నిలోనూ
  rationale: సమన్వయ దత్తివిభక్తి పదబంధాన్ని నేరుగా అనువదిస్తూ, అగ్ని శుద్ధీకరణను సూచిస్తుందా లేక తీర్పును సూచిస్తుందా అనే ప్రశ్నను ప్రధాన పాఠ్యంలో తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: ‘పరిశుద్ధాత్మ మరియు అగ్ని’ అనే పదబంధం యొక్క భావం
  choice: ‘పరిశుద్ధాత్మలోనూ అగ్నిలోనూ’ అని వ్యాఖ్యాన విస్తరణ లేకుండా ఉంచడం
  alternative: ‘పరిశుద్ధాత్మలోనూ శుద్ధిచేసే అగ్నిలోనూ’ లేదా ‘పరిశుద్ధాత్మలోనూ తీర్పు అగ్నిలోనూ’
  rationale: తక్షణ సందర్భం అగ్నిని శుద్ధీకరణగా లేదా తీర్పుగా అర్థం చేసుకునే అవకాశాన్ని ఇస్తుంది. అనువాదం వాటిలో ఒకదాన్ని నిశ్చయించకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: πνεύματι ἁγίῳ యొక్క సూచన
  choice: ‘పరిశుద్ధాత్మ’
  alternative: ‘పవిత్ర ఆత్మ’ లేదా ‘పరిశుద్ధాత్మ శక్తి’
  rationale: కొత్త నిబంధనలోని ఈ సందర్భంలో ఇది వ్యక్తిగతమైన పరిశుద్ధాత్మను సూచించడం అత్యంత సహజం; ‘శక్తి’ అని చేర్చడం మూలపాఠ్యాన్ని మించి వ్యాఖ్యానించడం అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడింది. ‘బాప్తిస్మం’, ‘పశ్చాత్తాపం’, ‘పరిశుద్ధాత్మ’ వంటి విస్తృతంగా పరిచయమైన బైబిలు పదజాలాన్ని నిలిపి, పాతకాలపు వాక్యనిర్మాణాన్ని నివారించింది. ‘కూడా’ యోహాను తనను తాను తగ్గించుకునే భావాన్ని సహజంగా బలపరుస్తుంది.
