id: MAT.3.10
reference: Matthew 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: te
  text: ఇప్పటికే గొడ్డలి చెట్ల వేరు దగ్గర ఉంచబడి ఉంది[a]. కాబట్టి మంచి ఫలం ఫలించని ప్రతి చెట్టూ నరికివేయబడి అగ్నిలో వేయబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చెట్ల వేరు దగ్గర పడి ఉంది.’
    reason: κεῖται అనే గ్రీకు పదానికి ‘ఉంచబడి ఉంది’తో పాటు ‘పడి ఉంది’ అనే అర్థం కూడా సాధ్యమని చూపే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἤδη δὲ
  choice: ఇప్పటికే
  rationale: ἤδη సూచించే తీర్పు సమీపత్వాన్ని ‘ఇప్పటికే’ సహజంగా తెలియజేస్తుంది. δέ ఇక్కడ స్వల్ప అనుసంధాన పదం; తెలుగులో ప్రత్యేక సంధాయకాన్ని చేర్చకుండానే వాక్యప్రవాహం సహజంగా ఉంటుంది.
- source_word: ἀξίνη
  choice: గొడ్డలి
  rationale: చెట్టును నరికే పనిముట్టును సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: చెట్ల వేరు దగ్గర ఉంచబడి ఉంది
  rationale: κεῖται లోని ‘పడి ఉంది/ఉంచబడి ఉంది’ అనే స్థితి భావాన్ని, πρὸς లోని సమీపతను కాపాడుతుంది; గొడ్డలి వెంటనే ఉపయోగించడానికి సిద్ధంగా ఉందని అదనంగా వివరించదు.
- source_word: πᾶν οὖν δένδρον
  choice: కాబట్టి ... ప్రతి చెట్టూ
  rationale: οὖν తెలిపే నిర్ధారణను ‘కాబట్టి’ స్పష్టంగా వ్యక్తం చేస్తుంది; πᾶν ను ‘ప్రతి’గా నిలుపుతుంది.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: మంచి ఫలం ఫలించని
  rationale: తెలుగులో చెట్టు ఫలాన్ని ఉత్పత్తి చేయడాన్ని ‘ఫలించడం’ సహజంగా తెలియజేస్తుంది; καλόν లోని గుణాత్మక భావం ‘మంచి’గా నిలుస్తుంది.
- source_word: ἐκκόπτεται
  choice: నరికివేయబడి
  rationale: చెట్టు సందర్భంలో పూర్తిగా నరికివేయడాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰς πῦρ βάλλεται
  choice: అగ్నిలో వేయబడుతుంది
  rationale: βάλλεται లోని క్రియాశక్తిని, πῦρ అనే తీర్పు ప్రతిమను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా కాపాడుతుంది.
theological_decisions:
- issue: అగ్ని ప్రతిమ స్వభావం
  choice: ‘అగ్నిలో’ అని మాత్రమే అనువదించి ప్రతిమను యథాతథంగా ఉంచడం
  alternative: అంత్యకాల తీర్పు, తాత్కాలిక తీర్పు లేదా నరకాగ్ని అని నిర్దిష్టంగా వ్యాఖ్యానించడం
  rationale: వాక్యం తీర్పును సూచించినా, అగ్ని దేనిని నిర్దిష్టంగా సూచిస్తుందో స్వయంగా వివరించదు. అందువల్ల ఒక ప్రత్యేక సిద్ధాంతార్థాన్ని చేర్చకుండా మూలంలోని వేదాంతపరమైన విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే తీర్పు ప్రకటనకు తగిన గంభీరతతో అనువదించబడింది. ‘అగ్ని’ గౌరవప్రదమైనప్పటికీ సులభంగా అర్థమయ్యే పదం; వాక్యంలోని కర్మణి రూపాలు మూలంలోని తీర్పు ప్రకటన శైలిని నిలుపుతాయి.
