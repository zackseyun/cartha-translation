  terminology: 'Key terms are well chosen: “గొడ్డలి” accurately denotes an axe, “వేరు దగ్గర” naturally communicates the positioning expressed by πρὸς ... ῥίζαν, and “అగ్ని” retains the elevated but accessible register. No theological terminology has been added beyond the source’s metaphor.'
