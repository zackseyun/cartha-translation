  text: Ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου σῶσαι τὸ ἀπολωλός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/011.yaml
  text: For the Son[a] of Man came to save the lost.
translation:
  language: te
  text: ఎందుకంటే, తప్పిపోయిన దానిని రక్షించడానికి మనుష్యకుమారుడు వచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం అత్యంత ప్రాచీన గ్రీకు ప్రతులలో—నాలుగో శతాబ్దానికి చెందిన సీనాయిటికస్, వాటికానస్ ప్రతులతో సహా—మరియు ప్రాచీన కాప్టిక్ అనువాదాలలో లేదు. అయితే ఇది ఐదో శతాబ్దపు కోడెక్స్ బేజా ప్రతిలో, బైజాంటైన్ అధికసంఖ్యాక ప్రతుల సంప్రదాయంలో, లాటిన్ వుల్గేట్‌లో ఉంది. లూకా 19:10తో సరిపోల్చేందుకు తరువాతి నకలుదారులు దీన్ని చేర్చి ఉండవచ్చు.
    reason: textual_critical
lexical_decisions:
- source_word: ἀπολωλός
  choice: పోయినదాన్ని
  rationale: నపుంసక ఏకవచన సంపూర్ణక్రియాంత విశేషణం ఇక్కడ నామవాచకంగా వాడబడింది. అందువల్ల వ్యక్తిని మాత్రమే అని స్పష్టీకరించకుండా, ‘పోయినదాన్ని’ అని మూలంలోని వ్యాకరణ రూపాన్నీ భావంలోని విస్తృతతనూ నిలుపుతుంది.
- source_word: σῶσαι
  choice: రక్షించడానికి
  rationale: σῴζω అనే క్రియ ఇక్కడ ప్రమాదం లేదా నాశనం నుండి కాపాడే భావాన్ని కలిగి ఉంది; ఈ సందర్భంలోని రక్షణార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: యేసు వాడిన బిరుదును గుర్తించగలిగే, గౌరవప్రదమైన సాంప్రదాయ రూపంలో ఉంచుతుంది; దాని అంతర్లీన గ్రంథసంబంధ ప్రతిధ్వనులను వివరణతో పరిమితం చేయదు.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ఈ వాక్యం ముందున్న బోధకు కారణం లేదా వివరణను అందిస్తున్నదనే అనుసంధానాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: τὸ ἀπολωλός యొక్క పరిధి
  choice: పోయినదాన్ని
  alternative: తప్పిపోయినవారిని
  rationale: మూల గ్రీకులోని నపుంసక ఏకవచన రూపం ‘పోయినది/పోయినదాన్ని’ అనే విస్తృత, కొంత అనిర్దిష్ట భావాన్ని అనుమతిస్తుంది. దాన్ని తప్పిపోయిన మనుషులకు మాత్రమే పరిమితం చేసి మూలంలోని అస్పష్టతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. పాఠ్య సంప్రదాయంలో వచనం ఉన్నందున ప్రధాన పాఠ్యంలో అనువదించి, ప్రధాన ప్రతుల మధ్య ఉన్న పాఠభేదాన్ని [a] పాదసూచికలో స్పష్టంగా తెలిపాం.
