  terminology: “తోటి దాసుడు” preserves the socially bonded sense of σύνδουλος in this parable. The alternative “తోటి సేవకుడు” is appropriately supplied in the footnote. “నా పట్ల ఓపిక చూపు” is a natural rendering of the request for patience/forbearance.
