id: MAT.18.29
reference: Matthew 18:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow servant fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: te
  text: అప్పుడు అతని తోటి దాసుడు[a] అతని ఎదుట పడి, ‘నా పట్ల ఓపిక చూపు; నీకు తిరిగి చెల్లిస్తాను’ అంటూ అతన్ని వేడుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తోటి సేవకుడు.’ గ్రీకు σύνδουλος అనే పదం ఒకే యజమాని కింద ఉన్న వ్యక్తిని సూచిస్తుంది; ఈ ఉపమానంలో బంధిత సంబంధం ప్రధానంగా ఉన్నందున ఇక్కడ ‘తోటి దాసుడు’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: σύνδουλος
  choice: తోటి దాసుడు
  rationale: ఈ పదం ఒకే యజమాని కింద ఉన్న సహదాసుణ్ని సూచిస్తుంది. రాజు, అప్పు, అధీనస్థులు ప్రధానంగా ఉన్న ఈ ఉపమాన సందర్భంలో బంధిత స్థితిని ‘దాసుడు’ స్పష్టంగా నిలుపుతుంది.
- source_word: πεσὼν
  choice: అతని ఎదుట పడి
  rationale: విన్నపంతో తనను తాను తగ్గించుకొని పడిన శారీరక చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది; ‘సాగిలపడి’ కంటే మూలంలోని చర్యకే దగ్గరగా ఉంటుంది.
- source_word: οὖν
  choice: అప్పుడు
  rationale: ఇక్కడ οὖν కథనాన్ని ముందుకు నడిపే అనుక్రమ/పర్యవసాన సంబంధాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఆ ప్రవాహాన్ని అందిస్తుంది.
- source_word: παρεκάλει
  choice: వేడుకున్నాడు
  rationale: అప్పు విషయంలో కనికరం కోరుతూ చేసిన గాఢమైన విన్నపాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: నా పట్ల ఓపిక చూపు
  rationale: ఒక వ్యక్తి విషయంలో సహనంతో కొంతకాలం వేచి ఉండమనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἀποδώσω
  choice: తిరిగి చెల్లిస్తాను
  rationale: అప్పు సందర్భంలో ఇవ్వవలసినదాన్ని తిరిగి చెల్లిస్తాననే అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: σύνδουλος లోని δοῦλος-భాషను ఎలా అనువదించాలి
  choice: ప్రధాన పాఠ్యంలో ‘తోటి దాసుడు’
  alternative: తోటి సేవకుడు
  rationale: σύνδουλος ఒకే యజమాని కింద బంధిత స్థితిని పంచుకునే వ్యక్తిని సూచిస్తుంది. ఉపమానంలోని యజమాని–అధీనస్థుడి సంబంధం ముఖ్యమైనందున ‘దాసుడు’ మూలపదంలోని సామాజిక వాస్తవాన్ని నిలుపుతుంది; మరింత మృదువైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన గౌరవప్రదమైన సరళ శైలి. ‘నా పట్ల ఓపిక చూపు’ అనే మాట నేరుగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది. మూలంలో లేని ‘కాళ్లపై’ వంటి వివరాలను చేర్చలేదు.
