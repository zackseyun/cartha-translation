id: MAT.18.14
reference: Matthew 18:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: te
  text: అదే విధంగా, ఈ చిన్నవారిలో ఒక్కరైనా నశించిపోవడం పరలోకంలో ఉన్న మీ తండ్రి చిత్తం కాదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ చిన్నవారిలో ఒక్కరైనా తప్పిపోవడం.” గ్రీకు క్రియకు “నశించడం,” “తప్పిపోవడం” అనే రెండు భావాలూ ఉండవచ్చు; వెంటనే ముందు ఉన్న తప్పిపోయిన గొర్రె సందర్భం రెండవ భావానికి మద్దతిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: అదే విధంగా
  rationale: ముందున్న తప్పిపోయిన గొర్రె ఉపమానంతో ఈ వాక్యానికి ఉన్న పోలికను, అనుసంధానాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: οὐκ ἔστιν θέλημα ἔμπροσθεν
  choice: సమక్షంలో చిత్తం కాదు
  rationale: θέλημαను ‘చిత్తం’గా, ἔμπροσθενను ‘సమక్షంలో’గా వ్యక్తపరచి మూలంలోని అసాధారణమైన నిర్మాణాన్ని పూర్తిగా ‘తండ్రి చిత్తం కాదు’గా సరళీకరించకుండా నిలుపుతుంది.
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: పరలోకంలో ఉన్న మీ తండ్రి
  rationale: గ్రీకు బహువచన రూపాన్ని తెలుగు వాడుకలో సహజమైన ‘పరలోకం’తో అందిస్తూ, సంబంధవాచక నిర్మాణాన్ని కాపాడుతుంది.
- source_word: ἵνα ἀπόληται
  choice: నశించిపోవడం
  rationale: ἀπόλλυμι యొక్క తీవ్రమైన ‘నశించు’ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచుతుంది; ముందున్న తప్పిపోయిన గొర్రె సందర్భం సూచించే ‘తప్పిపోవడం’ భావాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- source_word: ἓν τῶν μικρῶν τούτων
  choice: ఈ చిన్నవారిలో ఒక్కరైనా
  rationale: ἓν అనే ఏకవచన కనిష్ఠతను తెలుగులో సహజంగా బలపరుస్తుంది; μικρῶνను కేవలం చిన్నపిల్లలకు పరిమితం చేయకుండా ‘చిన్నవారు’గా ఉంచుతుంది.
theological_decisions:
- issue: ముందున్న తప్పిపోయిన గొర్రె సందర్భంలో ἀπόληται అర్థం
  choice: నశించిపోవడం
  alternative: తప్పిపోవడం
  rationale: క్రియ అంతిమ నాశనాన్నీ, తప్పిపోయి ఉండడాన్నీ సూచించగలదు. హెచ్చరిక తీవ్రతను ప్రధాన పాఠ్యంలో ఉంచి, సమీప సందర్భం బలపరచే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ἔμπροσθεν యొక్క భావం
  choice: మీ తండ్రి సమక్షంలో
  alternative: మీ తండ్రి చిత్తం కాదు
  rationale: మూలంలోని ‘ముందు/సమక్షంలో’ అనే పదాన్ని కనిపించేలా ఉంచుతుంది; ప్రత్యామ్నాయం మరింత సహజమైన తెలుగు అయినా ఆ మూలాంశాన్ని అంత స్పష్టంగా వ్యక్తం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘చిన్నవారు’ అనే పదం వయస్సును మాత్రమే సూచించకుండా శిష్యత్వ సందర్భంలోని విస్తృత సూచనను నిలుపుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
