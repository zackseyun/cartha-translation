  source_fidelity: The draft accurately represents the solemn introductory formula, the indefinite scope of ὅσα ἐὰν, the bind/loose metaphor, and the future-periphrastic perfect passive constructions. “అప్పటికే ... బంధించబడి/విప్పబడి ఉంటాయి” reasonably conveys the resulting state reflected by ἔσται + perfect passive participle, while the footnote appropriately preserves the traditional alternative.
