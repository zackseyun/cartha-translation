id: MAT.18.18
reference: Matthew 18:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: te
  text: '“నేను మీతో నిజంగా చెబుతున్నాను: మీరు భూమిపై ఏవైతే బంధిస్తారో, అవి పరలోకంలో అప్పటికే బంధించబడి ఉంటాయి; మీరు భూమిపై ఏవైతే విప్పుతారో, అవి పరలోకంలో అప్పటికే విప్పబడి ఉంటాయి.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సంప్రదాయబద్ధంగా: “పరలోకంలో బంధించబడతాయి ... పరలోకంలో విప్పబడతాయి.” గ్రీకు రూపాన్ని ఇలా కూడా అనువదించవచ్చు. అయితే ప్రధాన పాఠంలోని అనువాదం భవిష్యత్ కాల క్రియతో సంపూర్ణ అసమాపక రూపం కలిసిన నిర్మాణాన్ని ప్రతిబింబిస్తుంది; అది పరలోకంలో అప్పటికే స్థిరపడిన స్థితిని సూచించవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: నిజంగా
  rationale: అధికారపూర్వకమైన మాటను ప్రారంభించే గంభీర ధృవీకరణను ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో ... చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, పలుకుతున్నవాని అధికారాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: ὅσα ἐὰν
  choice: వేటిని ... అవి
  rationale: నిర్దిష్టంగా పేర్కొనని సమస్త విషయాలను సూచించే గ్రీకు నిర్మాణ పరిధిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δήσητε
  choice: బంధిస్తారో
  rationale: ‘కట్టు, బంధించు’ అనే మూల రూపకాన్ని నిలుపుతూ, దానిని కేవలం ‘నిషేధించు’ అనే న్యాయపరమైన అర్థానికే పరిమితం చేయదు.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిపై
  rationale: భూలోకానికి, పరలోకానికి మధ్యనున్న వ్యత్యాసాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔσται δεδεμένα
  choice: అప్పటికే బంధించబడి ఉంటాయి
  rationale: భవిష్యత్ కాల సహాయక క్రియతో కూడిన సంపూర్ణ కర్మణి అసమాపక రూపం సూచించే, ముందే ఏర్పడిన స్థితి భవిష్యత్తులో కొనసాగుతుందనే భావాన్ని తెలుగులో ప్రతిబింబిస్తుంది.
- source_word: ἐν οὐρανῷ
  choice: పరలోకంలో
  rationale: దేవుని పరలోక పరిధిని సూచించే ఏకవచన గ్రీకు పదబంధానికి ఆధునిక తెలుగు బైబిలు సందర్భంలో స్పష్టమైన సమానార్థకం.
- source_word: λύσητε
  choice: విప్పుతారో
  rationale: ‘బంధించు’కు ఎదురైన ‘విప్పు’ అనే రూపక జతను నిలుపుతుంది; అర్థాన్ని కేవలం ‘అనుమతించు’ లేదా ‘విడుదల చేయు’ అని ముందుగానే కుదించదు.
- source_word: ἔσται λελυμένα
  choice: అప్పటికే విప్పబడి ఉంటాయి
  rationale: మొదటి ఉపవాక్యంలాగే, ముందే సంభవించిన చర్య ఫలితంగా నిలిచే స్థితిని తెలియజేసే గ్రీకు కాల-రూప స్వభావాన్ని ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: బంధించడం–విప్పడం అనే సూత్రంలో కాలసంబంధమైన, తాత్త్వికమైన బలం
  choice: ‘పరలోకంలో అప్పటికే బంధించబడి/విప్పబడి ఉంటాయి’ అని అనువదించడం
  alternative: ‘పరలోకంలో బంధించబడతాయి/విప్పబడతాయి’
  rationale: ἔσται తో సంపూర్ణ కర్మణి అసమాపక రూపం కలిసిన గ్రీకు నిర్మాణం, ముందే జరిగిన చర్య ఫలితంగా తరువాత నిలిచే స్థితిని సూచించగలదు. అందువల్ల భూమిపై తీసుకునే చర్య పరలోకంలో అప్పటికే స్థిరపడిన దానితో అనుగుణంగా ఉందనే అవకాశాన్ని ఈ అనువాదం నిలుపుతుంది; అదే సమయంలో సంఘాధికారానికి సంబంధించిన ఏ ప్రత్యేక మతశాఖ సిద్ధాంతాన్నీ పాఠ్యంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే యేసు పలుకులోని గంభీరతను నిలుపుకునేలా రూపొందించబడింది. ‘బంధించు/విప్పు’ రూపక జతను ఉద్దేశపూర్వకంగా కాపాడి, దాని న్యాయపరమైన లేదా సంఘపరమైన ప్రయోగాన్ని అనువాదంలోనే నిర్దిష్టం చేయలేదు.
