id: MAT.18.28
reference: Matthew 18:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that servant went out[a], he found one of his fellow servants who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: te
  text: అయితే ఆ దాసుడు బయటికి వెళ్లినప్పుడు, తనకు వంద దేనారాలు బాకీ ఉన్న తన తోటి దాసులలో ఒకణ్ణి చూశాడు.[a] అతణ్ణి పట్టుకొని గొంతు నులుముతూ, “నువ్వు నాకు ఎంత బాకీ ఉంటే అంత తిరిగి చెల్లించు!” అన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దేనారం సాధారణంగా ఒక కూలీ లేదా సైనికుడి ఒక రోజు వేతనానికి సమానమైన నాణెం.
    reason: cultural_note
  - marker: b
    text: 'మరింత అక్షరార్థంగా: “నువ్వు ఏమైనా బాకీ ఉంటే తిరిగి చెల్లించు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: దాసుడు
  rationale: యజమాని ఆధీనంలో ఉన్న బంధిత స్థితిని సూచిస్తూ, ఆధునిక తెలుగులో సహజంగా వినిపించే పదం.
- source_word: ἐξελθὼν δὲ
  choice: అయితే ... బయటికి వెళ్లినప్పుడు
  rationale: δέ సూచించే కథన మలుపును, aorist participle సూచించే కాల సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: συνδούλων
  choice: తోటి దాసులలో ఒకణ్ణి
  rationale: σύν-లోని ‘తోటి’ భావాన్ని, δοῦλοςకు ఎంచుకున్న పదంతో సుసంగతంగా వ్యక్తం చేస్తుంది.
- source_word: ὤφειλεν
  choice: బాకీ ఉన్న
  rationale: ఇక్కడ ఉద్దేశించిన ఆర్థిక రుణాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἑκατὸν δηνάρια
  choice: వంద దేనారాలు
  rationale: చారిత్రక నాణెం పేరును నిలిపి, ముందు చెప్పిన అపారమైన అప్పుతో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: κρατήσας
  choice: పట్టుకొని
  rationale: బలవంతంగా అదుపులోకి తీసుకున్న చర్యను సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἔπνιγεν
  choice: గొంతు నులుముతూ
  rationale: imperfect రూపంలోని కొనసాగుతున్న హింసాత్మక చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἀπόδος
  choice: తిరిగి చెల్లించు
  rationale: అప్పు సందర్భంలో ఉన్న కఠిన ఆజ్ఞను స్పష్టంగా అందిస్తుంది.
- source_word: εἴ τι ὀφείλεις
  choice: నువ్వు నాకు ఎంత బాకీ ఉంటే అంత
  rationale: ‘ఏమైనా బాకీ ఉంటే / ఎంత బాకీ ఉంటే అంత’ అనే అనిర్దిష్ట భావాన్ని సహజమైన తెలుగు డిమాండ్‌గా నిలుపుతుంది.
theological_decisions:
- issue: ఉపమాన కథనంలో δοῦλος అనువాదం
  choice: దాసుడు / తోటి దాసులు
  alternative: సేవకుడు / తోటి సేవకులు
  rationale: ఈ కథలో యజమాని ఆధీనత, అప్పు, బలవంతపు అధికారం ప్రధానంగా ఉన్నందున ‘దాసుడు’ సామాజిక వాస్తవాన్ని ‘సేవకుడు’కన్నా స్పష్టంగా ప్రతిబింబిస్తుంది.
- issue: εἴ τι ὀφείλειςలోని అనిర్దిష్టత
  choice: నువ్వు నాకు ఎంత బాకీ ఉంటే అంత
  alternative: నువ్వు నాకు బాకీ ఉన్నది
  rationale: గ్రీకు పదబంధంలోని ‘ఏమైనా/ఎంతైనా’ అనే అనిర్దిష్ట భావాన్ని తొలగించకుండా, బెదిరింపుతో కూడిన డిమాండ్‌ను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. హింసాత్మక చర్యను మృదువుపరచలేదు; చారిత్రక నాణెం పేరును వివరణాత్మక పాదసూచికతో నిలిపాం.
