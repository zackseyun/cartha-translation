id: MAT.18.12
reference: Matthew 18:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: te
  text: “మీకేమనిపిస్తుంది? ఒక మనిషికి వంద గొర్రెలు ఉండి, వాటిలో ఒకటి దారితప్పితే[a], అతడు తొంభై తొమ్మిదింటిని కొండల మీద విడిచిపెట్టి, వెళ్లి దారితప్పుతున్న దానిని[b] వెదకడా?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అటుఇటు తిరుగుతూ పోతే”; ఈ గ్రీకు క్రియకు “దారితప్పు,” “అటుఇటు తిరుగుతూ పోవు,” కొన్ని సందర్భాల్లో “తప్పుదారి పట్టించబడడం” అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “దారితప్పుతున్న దానిని”; సంప్రదాయంగా “తప్పిపోయిన దానిని” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: మీకేమనిపిస్తుంది?
  rationale: శ్రోతల అభిప్రాయాన్ని నేరుగా అడిగే గ్రీకు ప్రశ్నకు సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: ఒక మనిషికి ... ఉండి
  rationale: దత్తివ విభక్తితో ఉన్న γίνομαι ఇక్కడ కలిగియుండడాన్ని సూచిస్తుంది; ἀνθρώπῳ యొక్క ఏకవచన మానవ పాత్రను నిలుపుతుంది.
- source_word: ἑκατὸν πρόβατα
  choice: వంద గొర్రెలు
  rationale: సంఖ్యను, పశువుల సూచనను నేరుగా మరియు సహజంగా అందిస్తుంది.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: వాటిలో ఒకటి దారితప్పితే
  rationale: πλανάω యొక్క ‘దారితప్పు/తిరిగిపోవు’ భావాన్ని ఉంచి, బాహ్యంగా తప్పుదారి పట్టించబడిందని నిర్దిష్టం చేయదు.
- source_word: οὐχὶ ἀφήσει
  choice: విడిచిపెట్టి ... వెదకడా?
  rationale: οὐχί ఆశించే సానుకూల జవాబును తెలుగు ప్రతికూల ప్రశ్న సహజంగా తెలియజేస్తుంది; ‘విడిచిపెట్టు’ తాత్కాలికంగా అక్కడ ఉంచడాన్ని సూచిస్తుంది, పూర్తిగా పరిత్యజించడాన్ని కాదు.
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: తొంభై తొమ్మిదింటిని
  rationale: గొర్రెలను తిరిగి సూచించే సహజ తెలుగు సంఖ్యా రూపం.
- source_word: ἐπὶ τὰ ὄρη
  choice: కొండల మీద
  rationale: ὄρη యొక్క బహువచన భూభాగ చిత్రాన్ని నేరుగా నిలుపుతుంది; సందర్భానుసారం ‘కొండప్రాంతంలో’ కూడా సాధ్యం.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: వెళ్లి ... వెదకడా?
  rationale: గ్రీకు కృదంతం మరియు ప్రధాన క్రియను సహజ తెలుగు వరుస చర్యలుగా అందిస్తుంది; ζητεῖకి ‘వెదకు’ దగ్గరి సమానార్థకం.
- source_word: τὸ πλανώμενον
  choice: దారితప్పుతున్న దానిని
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న క్రియాభావాన్ని, ముందటి πλανηθῇతో పదసంబంధాన్ని నిలుపుతుంది; మూలంలో లేని ‘పోయినది’ అనే వేరే పదభావాన్ని దిగుమతి చేయదు.
theological_decisions:
- issue: ἀνθρώπῳ యొక్క సాధారణ పురుష ఏకవచనం
  choice: ఒక మనిషికి
  alternative: ఒకరికి
  rationale: మూలంలోని పురుష ఏకవచన పాత్రను నిలుపుతూ, అది ఉదాహరణాత్మకంగా వాడబడిందనే విషయాన్ని అతిశయింపకుండా ఉంచుతుంది.
- issue: గొర్రె రూపకంలో πλανάω భావం
  choice: దారితప్పితే / దారితప్పుతున్న దానిని
  alternative: తిరిగిపోతే / తప్పిపోయిన దానిని / తప్పుదారి పట్టించబడితే
  rationale: నైతిక దారితప్పుదలతో ఉండగల ప్రతిధ్వనిని కాపాడుతుంది; గొర్రె స్వయంగా తిరిగిందా లేక వేరొకటి తప్పుదారి పట్టించిందా అనే ఏజెన్సీని నిర్ణయించదు. ‘తప్పిపోయినది’ అని అనువదిస్తే మూలంలో లేని ἀπόλλυμι భావం బలపడవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని ప్రశ్నారూపం, కొండల చిత్రం, πλανάω పదపునరుక్తి నిలుపబడ్డాయి. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
