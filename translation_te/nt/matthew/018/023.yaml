id: MAT.18.23
reference: Matthew 18:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his servants[a][b].
translation:
  language: te
  text: అందుచేత పరలోక రాజ్యం తన బానిసలతో[a] లెక్కలు తీర్చాలని కోరుకున్న ఒక రాజుతో పోల్చబడింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సేవకులు’ అని కూడా అనువదించవచ్చు; గ్రీకు పదం δοῦλοι సాధారణంగా ‘బానిసలు’ అని అర్థం. ఇది రాజుకు బంధితులై ఉన్న వారి స్థితిని నొక్కిచెబుతుంది.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో ‘పోల్చబడింది’ లేదా ‘వంటిదిగా చేయబడింది’ అనే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: అందుచేత
  rationale: ముందటి బోధతో ఈ ఉపమానానికి ఉన్న కారణాత్మక, నిర్ధారణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὡμοιώθη
  choice: పోల్చబడింది
  rationale: ὁμοιόω పదంలోని భూతకాల నిష్క్రియ రూపాన్ని నిలుపుతూ, ‘దానితో పోల్చబడింది’ అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి సువార్తలోని స్థిరమైన భావవ్యక్తీకరణకు సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు రూపం.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: ఒక రాజుతో
  rationale: అక్షరార్థంగా ‘ఒక మనిషితో—అంటే రాజుతో’ ఉన్నప్పటికీ, βασιλεῖ ఆ మనిషిని రాజుగా నిర్దిష్టపరుస్తుంది; తెలుగులో ‘ఒక రాజుతో’ అనడం భావనష్టంలేకుండా సహజంగా ఉంటుంది.
- source_word: ἠθέλησεν
  choice: కోరిన
  rationale: రాజు సంకల్పాన్ని తెలియజేసే θέλω యొక్క భావాన్ని సరళంగా, కథనానికి తగిన విధంగా వ్యక్తం చేస్తుంది.
- source_word: συνᾶραι λόγον
  choice: లెక్కలు తేల్చుకోవాలని
  rationale: ఆర్థిక లెక్కలను పరిశీలించి బాకీలను నిర్ణయించే సందర్భోచిత నుడికారాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: తన దాసులతో
  rationale: δοῦλοι సూచించే రాజు అధికారానికి లోబడిన స్థితిని ‘దాసులు’ నిలుపుతుంది; అదే సమయంలో తెలుగు పాఠకులకు కథనంలో సహజంగా ఉంటుంది. ‘సేవకులు’, ‘బానిసలు’ అనే భావ ఛాయలను పాదసూచికలో వెల్లడించాం.
theological_decisions:
- issue: రాజసంబంధమైన ఆర్థిక సందర్భంలో δοῦλος అనువాదం
  choice: దాసులు
  alternative: సేవకులు; బానిసలు
  rationale: ఈ సందర్భంలో వారు కేవలం జీతపు పనివారు కాక రాజు అధికారానికి బద్ధులై ఉన్నారని δοῦλος సూచిస్తుంది. ‘దాసులు’ ఆ బద్ధస్థితిని తెలియజేస్తూ, ‘బానిసలు’ కంటే కథన తెలుగులో మరింత సహజంగా ఉంటుంది; ఇతర సాధ్యమైన పదాలను పాదసూచికలో ఉంచడం ద్వారా మూలపదపు విస్తృతిని దాచలేదు.
- issue: ὡμοιώθη యొక్క నిష్క్రియ పోలిక
  choice: పోల్చబడింది
  alternative: వంటిది; సాటిగా చేయబడింది
  rationale: మూలంలోని నిష్క్రియ రూపాన్ని, ఉపమానాన్ని ప్రవేశపెట్టే విధానాన్ని నిలుపుతుంది. ‘వంటిది’ సహజమైనదైనా క్రియారూపంలోని నిష్క్రియ భావాన్ని సమతలపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని నిష్క్రియ పోలికను నిలిపి, లెక్కల సందర్భాన్ని సహజమైన తెలుగు నుడికారంతో తెలిపాం.
