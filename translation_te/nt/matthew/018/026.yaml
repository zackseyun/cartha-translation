id: MAT.18.26
reference: Matthew 18:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the servant fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: te
  text: 'అప్పుడు ఆ బానిస అతని ముందు పడిపోయి, అతనికి సాగిలపడుతూ ఇలా అన్నాడు: “నాపట్ల ఓపిక చూపండి; నేను మీకు అంతా తిరిగి చెల్లిస్తాను.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν
  choice: నేలపై పడి
  rationale: ఈ భూతకాల క్రియావిశేషణం బానిస మాట్లాడే ముందు శారీరకంగా కిందపడిన చర్యను సూచిస్తుంది; ‘నేలపై పడి’ అనేది సందర్భంలోని దీనమైన భంగిమను సహజంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: అప్పుడు
  rationale: మునుపటి వచనంలో జరిగినదానికి ప్రతిస్పందనగా కథనం ముందుకు సాగుతున్నట్లు ఆధునిక తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: δοῦλος
  choice: బానిస
  rationale: ఋణం, సంపూర్ణ బాధ్యత, అమ్మివేయబడే పరిస్థితి ఉన్న ఈ ఉపమానంలో బంధిత సామాజిక స్థితి ప్రధానమైనది; ‘బానిస’ ఆ వాస్తవాన్ని ‘సేవకుడు’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: προσεκύνει αὐτῷ
  choice: అతని ముందు ... సాగిలపడుతూ
  rationale: ఇక్కడ προσκυνέω మానవ యజమాని ఎదుట గౌరవభయాలతో సాష్టాంగపడడాన్ని సూచిస్తుంది; అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను ‘సాగిలపడుతూ’ నిలుపుతుంది.
- source_word: λέγων
  choice: అని వేడుకున్నాడు
  rationale: పదశః ‘అంటూ’ అయినప్పటికీ, బానిస భంగిమ మరియు అతని అభ్యర్థన వల్ల వ్యక్తమయ్యే విన్నప స్వరాన్ని సహజ తెలుగులో ‘వేడుకున్నాడు’ తెలియజేస్తుంది.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: నాపట్ల ఓపిక చూపండి
  rationale: తక్షణ తీర్పు లేదా వసూలును వాయిదా వేసి సహనం చూపమనే ఆజ్ఞార్థక విన్నపాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πάντα
  choice: అంతా
  rationale: తాను చెల్లించవలసిన మొత్తం మొత్తాన్ని సమగ్రంగా సూచించే సహజ తెలుగు రూపం.
- source_word: ἀποδώσω σοι
  choice: నేను మీకు ... తిరిగి చెల్లిస్తాను
  rationale: ఋణ సందర్భంలో ἀποδίδωμι అంటే తిరిగి చెల్లించడం; భవిష్యత్ వాగ్దానాన్ని ఈ రూపం స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: మానవ యజమాని పట్ల προσκυνέω యొక్క అర్థం
  choice: మతపరమైన ఆరాధనగా కాక, గౌరవభయాలతో సాగిలపడే చర్యగా అనువదించడం
  alternative: ‘అతన్ని ఆరాధించాడు’
  rationale: ఉపమాన కథలో ఈ చర్య ఒక మానవ రాజు లేదా యజమాని ఎదుట జరుగుతుంది. ‘ఆరాధించాడు’ అనడం సందర్భం తప్పనిసరిగా సూచించని బలమైన మతపరమైన భావాన్ని చేర్చవచ్చు; ‘సాగిలపడుతూ’ దీనత్వాన్ని నిలుపుతూ ఆ అతివ్యాఖ్యను నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. బానిస తన యజమానితో మాట్లాడుతున్నందున ‘చూపండి,’ ‘మీకు’ అనే గౌరవ బహువచన రూపాలు ఉపయోగించబడ్డాయి.
