id: MAT.18.6
reference: Matthew 18:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: te
  text: అయితే నన్ను విశ్వసించే ఈ చిన్నవారిలో ఒకరిని ఎవరైనా తొట్రుపడేలా చేస్తే,[a] అతని మెడకు గాడిదతో తిప్పే పెద్ద తిరుగలి రాయిని వేలాడదీసి,[b] అతడిని నడిసముద్రంలో ముంచివేయడమే అతనికి మేలు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాపంలో పడేలా చేస్తే” లేక “విశ్వాసం నుండి తొలగిపోయేలా చేస్తే.” గ్రీకు క్రియకు తొట్రుపడేలా చేయడం, పాపంలో పడేలా చేయడం, లేదా విశ్వాసం నుండి తొలగిపోయేలా చేయడం వంటి భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “గాడిద తిరుగలి.” ఇది గాడిదతో తిప్పే పెద్ద తిరుగలి రాయి.
    reason: cultural_note
  - marker: c
    text: లేదా, “లోతైన సముద్రంలో.” గ్రీకు పదబంధం ప్రత్యేకంగా తీరానికి దూరమైన బహిరంగ సముద్రాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: పాపంలో పడేలా చేస్తే
  rationale: ఈ క్రియకు తొట్రిల్లజేయడం, పాపానికి కారణమవడం, విశ్వాసం నుండి పడిపోవడానికి కారణమవడం అనే విస్తృత భావపరిధి ఉంది. సహజమైన తెలుగులో ప్రధాన భావాన్ని స్పష్టంగా తెలిపే రూపాన్ని ఎంచుకుని, రూపకాలంకారాన్ని పాదసూచికలో ఉంచాం.
- source_word: μικρῶν τούτων
  choice: ఈ చిన్నవారిలో
  rationale: ఇది కేవలం వయస్సులో చిన్న పిల్లలకే పరిమితం కాకుండా, దీనులుగా లేదా అల్పులుగా పరిగణించబడే విశ్వాసులను కూడా సూచించగలదు; అందువల్ల విస్తృతతను నిలిపే పదబంధం వాడాం.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: నన్ను విశ్వసించే
  rationale: వ్యక్తిని ఉద్దేశించిన πιστεύω εἰς భావాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: συμφέρει αὐτῷ
  choice: అతనికి మేలు
  rationale: ప్రయోజనం లేదా మేలు అనే మూలభావాన్ని కఠినమైన హెచ్చరిక సందర్భంలో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: μύλος ὀνικὸς
  choice: గాడిదతో తిప్పే పెద్ద తిరుగలి
  rationale: ὀνικός గాడిదతో తిప్పబడే, చేతితో తిప్పే తిరుగలికంటే పెద్దదైన రాయిని సూచిస్తుంది. తెలుగు పాఠకునికి దృశ్యం స్పష్టమయ్యేలా పరిమాణ సూచనతో అనువదించాం.
- source_word: καταποντισθῇ
  choice: ముంచివేయడం
  rationale: లోతైన నీటిలో ముంచబడటం అనే కర్మణి భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: నడిసముద్రంలో
  rationale: πέλαγος తీరానికి దూరమైన బహిరంగ సముద్ర విస్తారాన్ని సూచిస్తుంది; 'నడిసముద్రం' ఆ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: '''చిన్నవారు'' అనే పదబంధపు పరిధి'
  choice: పిల్లలకే పరిమితం చేయకుండా, యేసును విశ్వసించే అల్పులు లేదా బలహీనులనూ సూచించగల విస్తృత రూపం
  alternative: నన్ను విశ్వసించే ఈ చిన్నపిల్లల్లో
  rationale: సమీప సందర్భంలో ఒక చిన్నపిల్ల ఉన్నప్పటికీ, 'నన్ను విశ్వసించే' అనే విశేషణం వినయస్థులైన లేదా అల్పులుగా పరిగణించబడే శిష్యులకు సూచనను విస్తరించగలదు. అనువాదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: σκανδαλίσῃ యొక్క ఆధ్యాత్మిక తీవ్రత
  choice: పాపంలో పడేలా చేస్తే
  alternative: తొట్రిల్లజేస్తే / విశ్వాసం నుండి పడిపోయేలా చేస్తే
  rationale: క్రియ యొక్క రూపకాన్ని పూర్తిగా శారీరక తొట్రుపాటుగా అపార్థం చేసుకోకుండా ఆధ్యాత్మిక హానిని ప్రధాన పాఠంలో స్పష్టం చేశాం; విస్తృత ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన హెచ్చరిక స్వరాన్ని నిలిపేలా రచించబడింది. 'చిన్నవారు' ద్వారా మూలంలోని సూచనావ్యాప్తిని కాపాడాం; 'గాడిదతో తిప్పే పెద్ద తిరుగలి' అనే రూపం ప్రాచీన సాంస్కృతిక దృశ్యాన్ని సాధారణ పాఠకునికి స్పష్టం చేస్తుంది.
