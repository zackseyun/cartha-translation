revisions:
- from: అయితే నన్ను విశ్వసించే ఈ చిన్నవారిలో ఒక్కరిని ఎవరైనా పాపంలో పడేలా చేస్తే,[a] అతని మెడకు గాడిదతో తిప్పే పెద్ద తిరుగలిని కట్టి,[b] నడిసముద్రంలో ముంచివేయడం అతనికి మేలు.[c]
  to: అయితే నన్ను విశ్వసించే ఈ చిన్నవారిలో ఒకరిని ఎవరైనా తొట్రుపడేలా చేస్తే,[a] అతని మెడకు గాడిదతో తిప్పే పెద్ద తిరుగలి రాయిని వేలాడదీసి,[b] అతడిని నడిసముద్రంలో ముంచివేయడమే అతనికి మేలు.[c]
  rationale: The revision restores the broader metaphorical force of σκανδαλίσῃ in the main text rather than selecting ‘cause to sin’ alone. It retains that legitimate narrower sense, together with falling away, in the anchored lexical note. It also clarifies the millstone as a stone and uses a direct, natural Telugu formulation for the warning’s hypothetical drowning image. No doctrinal interpretation is imposed; ‘చిన్నవారు’ remains broad rather than being restricted to children.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:36Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the referent as believers among ‘these little ones,’ the donkey-operated large millstone, and the open sea. However, ‘పాపంలో పడేలా చేస్తే’ narrows σκανδαλίσῃ to causing sin, whereas the Greek retains the broader stumbling/falling-away metaphor. The main text should preserve that breadth, with narrower senses in a note. The infinitival wording also benefits from a more direct rendering of the two grim hypothetical actions.
  naturalness: ‘ఈ చిన్నవారిలో ఒకరిని’ and ‘నడిసముద్రంలో’ are natural modern standard Telugu. ‘తొట్రుపడేలా చేస్తే’ is understandable and preserves the source metaphor; the footnote can clarify its broader spiritual senses. ‘గాడిదతో తిప్పే పెద్ద తిరుగలి రాయి’ is clear and idiomatic for the culturally specific millstone.
  terminology: ‘నన్ను విశ్వసించే,’ ‘చిన్నవారు,’ and ‘నడిసముద్రం’ are appropriate. ‘పెద్ద తిరుగలి రాయి’ makes clear that μύλος is a millstone, while ‘గాడిదతో తిప్పే’ accurately represents ὀνικός. The note wording is corrected to avoid the nonstandard/awkward ‘తొట్రిల్లజేస్తే.’
  issues:
  - severity: medium
    issue: The main rendering ‘పాపంలో పడేలా చేస్తే’ is too narrow for σκανδαλίσῃ.
    rationale: σκανδαλίζω can include causing someone to stumble, fall away, or sin. Rendering only sin in the text resolves a lexical breadth that the Greek leaves open.
  - severity: low
    issue: The footnote’s ‘తొట్రిల్లజేస్తే’ is awkward/nonstandard and does not match the preferred Telugu expression.
    rationale: ‘తొట్రుపడేలా చేస్తే’ is clearer, natural modern Telugu, and better reflects the metaphor.
  - severity: low
    issue: ‘పెద్ద తిరుగలి’ may not clearly identify the object as a millstone.
    rationale: Adding ‘రాయి’ makes the object immediately clear without adding meaning beyond the culturally implied large millstone.
  revised_text: అయితే నన్ను విశ్వసించే ఈ చిన్నవారిలో ఒకరిని ఎవరైనా తొట్రుపడేలా చేస్తే,[a] అతని మెడకు గాడిదతో తిప్పే పెద్ద తిరుగలి రాయిని వేలాడదీసి,[b] అతడిని నడిసముద్రంలో ముంచివేయడమే అతనికి మేలు.[c]
