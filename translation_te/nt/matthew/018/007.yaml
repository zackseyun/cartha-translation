id: MAT.18.7
reference: Matthew 18:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: te
  text: తడబడేలా చేసే విషయాల[a] వల్ల లోకానికి అయ్యో! ఎందుకంటే తడబడేలా చేసే విషయాలు రావడం అనివార్యం; అయితే, ఎవరి ద్వారా ఆ తడబడేలా చేసే విషయం వస్తుందో ఆ మనిషికి అయ్యో![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పాపానికి కారణాలు,” “ఉచ్చులు.” గ్రీకు పదం σκάνδαλον/σκάνδαλα ఒక వ్యక్తి తడబడేలా, పాపంలో పడేలా, లేదా దారి తప్పేలా చేసే దానిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “మనిషి” అనే పదం గ్రీకులో వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉంది; ఇక్కడ అలాంటి తడబడేలా చేసే విషయం ఎవరి ద్వారా వస్తుందో ఆ ఏ వ్యక్తినైనా ఇది ప్రతినిధిగా సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: అయ్యో
  rationale: ప్రవచనాత్మక హెచ్చరిక, తీర్పు ప్రకటన అనే బలాన్ని నిలుపుతూ, రెండు భాగాల్లోని వాక్చాతుర్య సమాంతరతను కాపాడుతుంది.
- source_word: κόσμῳ
  choice: లోకానికి
  rationale: భౌతిక సృష్టిని మాత్రమే కాక, పాప ప్రభావానికి లోనైన మానవ లోకాన్ని విస్తృతంగా సూచిస్తుంది.
- source_word: ἀπὸ
  choice: కారణంగా
  rationale: ఈ సందర్భంలో కీడు కలగడానికి కారణం లేదా మూలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: σκάνδαλα / σκάνδαλον
  choice: అభ్యంతరాలు కలిగించే వాటి / ఆ అభ్యంతరం
  rationale: ఎవరినైనా తడబడేలా, పాపంలో పడేలా లేదా దారి తప్పేలా చేసే దాని విస్తృత భావాన్ని ఉంచుతుంది; గ్రీకులోని బహువచన–ఏకవచన భేదాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: ἀνάγκη
  choice: అనివార్యం
  rationale: అవి తప్పక వస్తాయనే అవసరతను తెలియజేస్తుంది; ఆ అవసరతకు దైవ నిర్ణయమా, లోక పరిస్థితులా అనే ఆధారాన్ని నిర్దిష్టం చేయదు.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: మొదటి అయ్యో ప్రకటనకు తరువాతి వాక్యం వివరణ ఇస్తున్న సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: రావడం ... వస్తుందో
  rationale: గ్రీకు మూలంలోని ఒకే క్రియ పునరావృతిని తెలుగులో కూడా నిలుపుతుంది.
- source_word: πλήν
  choice: అయినా
  rationale: అభ్యంతరాలు రావడం అనివార్యమనే మాట నుంచి, వాటిని తీసుకొచ్చే వ్యక్తిపై తీర్పుకు జరిగే బలమైన మలుపును సూచిస్తుంది.
- source_word: ἀνθρώπῳ
  choice: ఆ మనిషికి
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; అది ప్రతినిధి భావంలో ఏ వ్యక్తినైనా సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది.
- source_word: δι’ οὗ
  choice: ఎవరి ద్వారా
  rationale: అభ్యంతరం రావడానికి వ్యక్తి సాధనంగా లేదా మాధ్యమంగా ఉండడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα లోని అవసరత స్వభావం
  choice: “రావడం అనివార్యం” అని అనువదించి అవసరతను ఉంచడం, కానీ దాని కారణాన్ని పేర్కొనకపోవడం.
  alternative: “దేవుని నిర్ణయం ప్రకారం తప్పక రావాలి” అని బలంగా అర్థనిర్ణయం చేయడం లేదా “రాక తప్పదు” అని కేవలం ప్రాయోగిక అనివార్యతగా చూపడం.
  rationale: గ్రీకు పాఠ్యం అవసరతను చెబుతుంది గాని దాని ఆధారం ఏమిటో వివరించదు. అందువల్ల దైవ ప్రత్యక్ష కారణత్వాన్ని చేర్చకుండా మూలంలోని theological tension ను నిలుపుతుంది.
- issue: ἀνθρώπῳ యొక్క ప్రతినిధి భావం
  choice: ప్రధాన పాఠ్యంలో “ఆ మనిషి” అని పుంలింగ ఏకవచనాన్ని ఉంచి, అది ఏ వ్యక్తికైనా వర్తిస్తుందని పాదటిప్పణిలో స్పష్టం చేయడం.
  alternative: “ఆ వ్యక్తికి” లేదా “ఎవరికైతే” అని లింగనిరపేక్షంగా అనువదించడం.
  rationale: మూల రూపం పుంలింగ ఏకవచనం; సందర్భంలో హెచ్చరిక ఏ వ్యక్తికైనా ప్రతినిధిగా వర్తిస్తుంది. రెండింటినీ పాఠ్యం–పాదటిప్పణి కలయికతో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచనాత్మక స్వరాన్ని ఉంచాం. “అయ్యో” అనే పునరుక్తి మూలంలోని తీర్పు ధ్వనినీ అలంకార సమాంతరతనూ నిలుపుతుంది. “అభ్యంతరం” ఒక్కటే పూర్తి భావాన్ని అందించకపోవచ్చునని, ప్రధాన పాఠ్యంలో క్రియాత్మక రూపాన్ని మరియు పాదటిప్పణిలో ప్రత్యామ్నాయ భావాలను ఇచ్చాం.
