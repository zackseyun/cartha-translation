revisions:
- from: అభ్యంతరాలు కలిగించే వాటి[a] కారణంగా లోకానికి అయ్యో! ఎందుకంటే అభ్యంతరాలు కలిగించేవి రావడం అనివార్యం; అయినా, ఎవరి ద్వారా ఆ అభ్యంతరం వస్తుందో ఆ మనిషికి అయ్యో![b]
  to: తడబడేలా చేసే విషయాల[a] వల్ల లోకానికి అయ్యో! ఎందుకంటే తడబడేలా చేసే విషయాలు రావడం అనివార్యం; అయితే, ఎవరి ద్వారా ఆ తడబడేలా చేసే విషయం వస్తుందో ఆ మనిషికి అయ్యో![b]
  rationale: The revision corrects the central rendering of σκάνδαλον/σκάνδαλα. “తడబడేలా చేసే విషయాలు” retains the metaphorical breadth of something that causes stumbling without prematurely limiting it to personal offense, deliberate temptation, or sin alone. The plural “విషయాలు” and singular “విషయం” retain the Greek number contrast; “రావడం … వస్తుందో” preserves the verbal repetition; and “అనివార్యం” leaves the basis of the stated necessity unspecified.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:32Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse’s overall structure, the plural-to-singular contrast, the unqualified necessity of the coming of σκάνδαλα, and the representative masculine singular in ἀνθρώπῳ. However, “అభ్యంతరాలు” ordinarily means objections, reservations, or affronts in modern Telugu; it does not adequately convey something that makes someone stumble or leads them into sin. This is a material lexical mismatch for σκάνδαλα/σκάνδαλον.
  naturalness: “అయ్యో” and the sentence structure are natural in modern standard Telugu with an appropriately solemn warning tone. Replacing the objection-based wording with “తడబడేలా చేసే విషయాలు” is clearer and more idiomatic while retaining the source metaphor broadly.
  terminology: Use wording based on “తడబడేలా చేయు” for σκάνδαλον rather than “అభ్యంతరం.” The revised footnote supplies “పాపానికి కారణాలు” and “ఉచ్చులు” as interpretive alternatives without restricting the main text to only one nuance.
  issues:
  - severity: high
    issue: “అభ్యంతరాలు కలిగించే వాటి / ఆ అభ్యంతరం” for σκάνδαλα/σκάνδαλον
    rationale: In Telugu, అభ్యంతరం primarily denotes an objection, reservation, or offense taken, not a stumbling block, enticement, or cause of falling. It therefore obscures the central metaphor and ethical force of the Greek term.
  - severity: medium
    issue: Footnote a repeats the same lexical error and uses “అపరాధాలకు కారణాల”
    rationale: The note should explain the semantic range of σκάνδαλον in terms of stumbling, enticement, or a cause of sin. “అపరాధాలు” can mean offenses/wrongs but does not clearly express the intended causal sense here.
  revised_text: తడబడేలా చేసే విషయాల[a] వల్ల లోకానికి అయ్యో! ఎందుకంటే తడబడేలా చేసే విషయాలు రావడం అనివార్యం; అయితే, ఎవరి ద్వారా ఆ తడబడేలా చేసే విషయం వస్తుందో ఆ మనిషికి అయ్యో![b]
