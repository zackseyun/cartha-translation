- from: కాని అతడు ఒప్పుకోలేదు[a]. బదులుగా, వెళ్లి, బాకీ ఉన్నదంతా చెల్లించే వరకు అతణ్ణి చెరసాలలో వేయించాడు[b][c].
  to: కాని అతడు అందుకు ఇష్టపడలేదు[a]. బదులుగా, వెళ్లి, బాకీ ఉన్నది[c] చెల్లించే వరకు అతణ్ణి చెరసాలలో పడవేశాడు[b].
  rationale: The revision restores the volitional force of οὐκ ἤθελεν, removes the causative meaning not present in ἔβαλεν, and places each lexical footnote at its corresponding expression. It also avoids making ‘all’ explicit where the Greek says simply ‘the thing owed.’
