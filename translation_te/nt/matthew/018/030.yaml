  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: te
  text: కాని అతడు అందుకు ఇష్టపడలేదు[a]. బదులుగా, వెళ్లి, బాకీ ఉన్నది[c] చెల్లించే వరకు అతణ్ణి చెరసాలలో పడవేశాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అతడు అంగీకరించలేదు’ లేదా ‘నిరాకరించాడు’; గ్రీకులో అక్షరార్థంగా, ‘ఇష్టపడలేదు’ లేదా ‘సిద్ధంగా లేడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అతణ్ణి చెరసాలలో పెట్టాడు’; గ్రీకు క్రియ మరింత బలమైనది—అక్షరార్థంగా, ‘అతణ్ణి చెరసాలలో విసిరాడు/పడవేశాడు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘బాకీ మొత్తం’ లేదా ‘అప్పు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: కాని అతడు
  rationale: δέ సూచించే వ్యతిరేక భావాన్ని ‘కాని’ తెలియజేస్తుంది; substantival article మునుపు చెప్పిన సేవకుణ్ణి సూచిస్తున్నందున తెలుగులో సహజంగా ‘అతడు’ అని వ్యక్తం చేశాం.
- source_word: οὐκ ἤθελεν
  choice: ఒప్పుకోలేదు
  rationale: θέλω యొక్క సంకల్ప/ఇష్ట భావాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఇది అతడు విన్నపాన్ని అంగీకరించలేదనే భావాన్ని ఇస్తుంది, అయితే ‘నిరాకరించాడు’ అనే మరింత బలమైన రూపాన్ని ప్రధాన పాఠ్యంలో పెట్టదు.
- source_word: ἀλλὰ
  choice: బదులుగా
  rationale: మునుపటి విన్నపానికి విరుద్ధంగా అతడు చేసిన చర్యను ἀλλά బలంగా చూపిస్తుంది; ‘బదులుగా’ ఆధునిక తెలుగులో ఆ వ్యతిరేకతను సహజంగా అందిస్తుంది.
- source_word: ἀπελθὼν
  choice: వెళ్లి
  rationale: Aorist participle తెలిపే ముందరి చర్యను తెలుగు అనుక్రమ క్రియారూపమైన ‘వెళ్లి’ సంక్షిప్తంగా, సహజంగా కాపాడుతుంది.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: అతణ్ణి చెరసాలలో వేయించాడు
  rationale: βάλλω లోని బలవంతపు, కఠిన చర్యను ‘వేయించాడు’ నిలుపుతుంది; అప్పుదారుణ్ణి అధికారుల ద్వారా నిర్బంధింపజేసిన సందర్భానికి ఈ causative రూపం సహజంగా సరిపోతుంది.
- source_word: ἕως οὗ
  choice: వరకు
  rationale: చెరసాల నిర్బంధానికి సంబంధించిన కాల పరిమితిని సరళంగా, ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: ἀποδῷ
  choice: చెల్లించే
  rationale: ἕως οὗ తరువాతి aorist subjunctive సూచించే ఎదురుచూసిన పూర్తి చెల్లింపును ‘చెల్లించే వరకు’ అనే సహజ తెలుగు నిర్మాణం అందిస్తుంది.
- source_word: τὸ ὀφειλόμενον
  choice: బాకీ ఉన్నదంతా
  rationale: Substantival participle యొక్క ‘బాకీగా ఉన్నది’ అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; సందర్భంలో చెల్లించవలసిన మొత్తమంతటినీ సూచించేలా ‘అంతా’ ఉపయోగించబడింది.
