translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘చెరసాల’ బైబిలు సందర్భానికి తగినదైనా ఇప్పటికీ సులభంగా అర్థమయ్యే పదం. మూలంలోని చర్యల క్రమం మరియు కఠినతను నిలిపాం.
