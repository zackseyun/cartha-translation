id: MAT.18.20
reference: Matthew 18:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: te
  text: ఎందుకంటే ఇద్దరు లేదా ముగ్గురు నా నామంలో సమకూడి ఉన్న చోట, అక్కడ వారి మధ్య[a] నేను ఉన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి నడుమ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: చోట
  rationale: స్థలాన్ని సూచించే ఉపవాక్యాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘ఎక్కడైతే’ కంటే సంక్షిప్తంగా ఉంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భంతో ఈ మాటకు ఉన్న వివరణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: δύο ἢ τρεῖς
  choice: ఇద్దరు లేదా ముగ్గురు
  rationale: వ్యక్తులను లెక్కించే సహజమైన తెలుగు సంఖ్యారూపాలను ఉపయోగిస్తుంది.
- source_word: συνηγμένοι
  choice: సమకూడి ఉన్న
  rationale: పరిపూర్ణ కర్మణి కృదంతంలోని, కూడి ప్రస్తుతం కలిసి ఉన్న స్థితిని ప్రతిబింబిస్తుంది; ఎవరు సమకూర్చారో అనవసరంగా నిర్ధారించదు.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: నా నామంలో
  rationale: యేసు నామాన్ని ఆశ్రయించి, ఆయన అధికారానికి లేదా ఆయనతో తమ అనుబంధానికి సంబంధించి కూడడాన్ని తెలిపే సహజమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: ‘చోట ... అక్కడ’ అనే మూలంలోని స్థానసంబంధ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: εἰμι
  choice: నేను ఉన్నాను
  rationale: సాధారణ వర్తమాన క్రియను నేరుగా అనువదిస్తుంది; ‘నేను సన్నిహితంగా ఉంటాను’ వంటి వివరణాత్మక విస్తరణను నివారిస్తుంది.
- source_word: ἐν μέσῳ αὐτῶν
  choice: వారి మధ్య
  rationale: మూలంలోని మధ్యస్థితి భావాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది; ‘వారి నడుమ’ కూడా సాధ్యమే కానీ కొంత సాహిత్య శైలిగా వినిపిస్తుంది.
theological_decisions:
- issue: తన నామంలో సమకూడినవారి మధ్య యేసు ఉనికి
  choice: ‘వారి మధ్య నేను ఉన్నాను’ అని నేరుగా అనువదించి, యేసు ఉనికి స్వరూపాన్ని మరింత నిర్వచించకుండా ఉంచడం.
  alternative: ‘నేను వారితో సన్నిహితంగా ఉంటాను’ అని వివరణాత్మకంగా అనువదించడం, లేదా దీనిని ఒక నిర్దిష్ట సంస్కార/సంఘ సిద్ధాంతానికి కట్టిపెట్టడం.
  rationale: వాక్యం యేసు ఉనికిని స్పష్టంగా ప్రకటిస్తుంది; అయితే ఆ ఉనికి ఏ విధమైనదో నిర్దేశించదు. అందువల్ల తరువాతి మతశాఖల ప్రత్యేక సిద్ధాంతాన్ని చేర్చకుండా మూలంలోని వాదనను, దాని తెరవుదలను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండడంతో పాటు వాక్యానికి తగిన గౌరవప్రదమైన ధోరణి. ‘నామం’ బైబిలు సందర్భానికి తగినదిగా నిలిపి, మిగతా నిర్మాణాన్ని సహజంగా ఉంచాం.
