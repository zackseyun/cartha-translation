id: MAT.18.5
reference: Matthew 18:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: te
  text: “నా పేరున ఇలాంటి ఒక బిడ్డను[b] ఎవరు స్వీకరిస్తారో[a], వారు నన్ను స్వీకరిస్తారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆహ్వానిస్తారో.” గ్రీకు క్రియకు “స్వీకరించు,” “ఆహ్వానించు,” లేదా “అంగీకరించు” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఇలాంటి ఒక బిడ్డను”; ఈ వచనంలోని గ్రీకు పాఠ్యంలో “చిన్న” అనే విశేషణం లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: ఎవరు … స్వీకరిస్తారో, వారు
  rationale: ఈ నిర్మాణం సాధారణమైన, నిర్దిష్టం కాని షరతును సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఎవరు … వారో/వారు’ అనే నిర్మాణం ‘whoever’ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δέξηται / δέχεται
  choice: స్వీకరిస్తారో / స్వీకరిస్తారు
  rationale: ఒకే గ్రీకు క్రియ రెండుసార్లు రావడాన్ని తెలుగులోనూ ఒకే క్రియతో నిలుపుతుంది. ‘ఆహ్వానిస్తారు’ లేదా ‘చేర్చుకుంటారు’ కూడా సందర్భానుసారంగా సాధ్యమే; అయితే ‘స్వీకరించు’ అనేది receive, welcome, accept అనే భావపరిధిని విస్తృతంగా కాపాడుతుంది.
- source_word: ἓν παιδίον τοιοῦτο
  choice: ఇలాంటి ఒక బిడ్డను
  rationale: τοιοῦτο ముందు ప్రస్తావించిన బిడ్డలాంటి వ్యక్తిని సూచిస్తుంది. παιδίονకు ఇక్కడ ప్రత్యేకంగా ‘చిన్న’ అనే విశేషణం లేదు; అందువల్ల దానిని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: నా పేరున
  rationale: యేసు పేరు, అధికారం లేదా ఆయనతో అనుబంధాన్ని ఆధారంగా చేసుకొని చేసే స్వీకరణ అనే భావాలను అతిగా నిర్దిష్టం చేయకుండా ‘నా పేరున’ సహజంగా కాపాడుతుంది.
- source_word: ἐμὲ
  choice: నన్ను
  rationale: గ్రీకులోని ప్రథమ పురుష ఏకవచన కర్మను నేరుగా తెలుగులో వ్యక్తపరుస్తుంది; అదే క్రియ పునరావృతం కావడం బిడ్డను స్వీకరించడం యేసును స్వీకరించడమే అనే బలమైన సంబంధాన్ని చూపుతుంది.
theological_decisions:
- issue: బిడ్డకూ యేసుకూ మధ్య ప్రతినిధిత్వ గుర్తింపు
  choice: ఇలాంటి బిడ్డను యేసు పేరున స్వీకరించడం యేసునే స్వీకరించడంగా వాక్యం నేరుగా చెబుతుంది.
  alternative: దీనిని కేవలం ఆ బిడ్డను స్వీకరించడం ద్వారా యేసును గౌరవించడం అని మృదువుగా అర్థం చేయవచ్చు.
  rationale: δέχομαι అనే ఒకే క్రియకు మొదట ‘ఇలాంటి ఒక బిడ్డను,’ తరువాత ‘నన్ను’ అనే కర్మలు రావడం బలమైన ప్రతినిధిత్వ గుర్తింపును తెలియజేస్తుంది. మూలపాఠ్యంలో లేని మతసంస్థాపరమైన లేదా సంస్కార సంబంధమైన భావాలను అనువాదం జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. రెండు ఉపవాక్యాల్లో ‘స్వీకరించు’ అనే పదాన్ని పునరావృతం చేసి మూలంలోని వాక్యబలాన్ని నిలిపాం; గౌరవార్థక బహువచన క్రియారూపాలు లింగనిరపేక్ష సాధారణ సూచనకు కూడా అనుకూలంగా ఉన్నాయి.
