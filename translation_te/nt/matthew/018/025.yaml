id: MAT.18.25
reference: Matthew 18:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: te
  text: అయితే అతనికి తిరిగి చెల్లించే స్తోమత లేకపోవడంతో, యజమాని[a] అతణ్ణి, అతని భార్యను, పిల్లలను, అతనికి ఉన్నదంతటినీ అమ్మాలని, చెల్లింపు జరగాలని ఆజ్ఞాపించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు κύριος అనే పదానికి సందర్భాన్ని బట్టి ‘ప్రభువు’ లేదా ‘యజమాని’ అని అర్థం కావచ్చు. ఇక్కడ అది ఉపమానంలోని సేవకుని మానవ యజమానిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అతణ్ణి, అతని భార్యను, పిల్లలను అమ్మడం ద్వారా, అలాగే అతని ఆస్తిని అమ్మడం ద్వారా చెల్లింపు జరగాలన్నదే ఈ ఆజ్ఞ ఉద్దేశం.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: అయితే అతనికి తిరిగి చెల్లించే స్తోమత లేకపోవడంతో
  rationale: μή + వర్తమాన కృదంతంతో ఉన్న genitive absolute అతడు చెల్లించలేని పరిస్థితిని లేదా కారణాన్ని తెలియజేస్తుంది. ‘స్తోమత లేకపోవడంతో’ అనేది ఏమీ లేదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, కేవలం ఇష్టంలేదనే అర్థాన్ని రానివ్వదు.
- source_word: ἀποδοῦναι
  choice: తిరిగి చెల్లించే
  rationale: ఉపమానంలోని అప్పు సందర్భంలో ἀποδίδωμι తిరిగి చెల్లించడాన్ని సూచిస్తుంది.
- source_word: ἐκέλευσεν
  choice: ఆజ్ఞాపించాడు
  rationale: κελεύω అధికారపూర్వకమైన ఆదేశాన్ని సూచిస్తుంది; ‘ఆజ్ఞాపించాడు’ గౌరవప్రదమైన కథన శైలికి సరిపోతుంది.
- source_word: ὁ κύριος
  choice: యజమాని
  rationale: ఈ ఉపమానంలో κύριος సేవకునిపై అధికారం గల మానవ యజమానిని సూచిస్తుంది. ‘యజమాని’ సందర్భానికి సహజంగా ఉండి, దీనిని నేరుగా దైవ బిరుదుగా చూపదు.
- source_word: πραθῆναι
  choice: అమ్మి
  rationale: πιπράσκω యొక్క కర్మణి infinitive అతడు అమ్మబడాలని ఇచ్చిన ఆదేశాన్ని సూచిస్తుంది. తెలుగులో వరుస కర్మలతో ‘అతణ్ణి ... అమ్మి’ అని చెప్పడం సహజం.
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: అతని భార్యాపిల్లలను
  rationale: గ్రీకులో నిర్దిష్ట articles ఉన్నా, సంబంధాన్ని తెలుగులో సహజంగా స్పష్టం చేయడానికి ‘అతని’ వాడబడింది; భార్యతో పాటు పిల్లలూ అమ్మబడాలనే కఠిన భావం నిలుపబడింది.
- source_word: πάντα ὅσα ἔχει
  choice: అతనికి ఉన్నదంతటినీ
  rationale: ఈ పదబంధం అతని ఆస్తి మొత్తాన్ని సూచిస్తుంది; ఎంపిక గ్రీకు భావానికి సమీపంగా, సహజంగా ఉంది.
- source_word: καὶ ἀποδοθῆναι
  choice: చెల్లింపు చేయాలని
  rationale: కర్మణి infinitive అమ్మకం ద్వారా చెల్లింపు జరగాలనే ఉద్దేశాన్ని తెలియజేస్తుంది. మూలంలో ‘అప్పు’ అనే నామవాచకం స్పష్టంగా లేనందున దాన్ని ప్రధాన వాక్యంలో చేర్చలేదు.
theological_decisions:
- issue: ఉపమాన సందర్భంలో κύριος అనువాదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: కథలో ఈ పదం సేవకుని మానవ అధిపతిని సూచిస్తుంది. ‘యజమాని’ ఆ సామాజిక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘ప్రభువు’ కూడా పదసాధ్యమైన అనువాదమే అయినా ఇక్కడ ప్రత్యక్ష దైవ బిరుదుగా అపార్థమయ్యే అవకాశం ఉంది.
- issue: కుటుంబ సభ్యుల అమ్మకాన్ని స్పష్టంగా ఉంచడం
  choice: అతణ్ణి, అతని భార్యాపిల్లలను ... అమ్మి
  alternative: అతని ఆస్తినంతా అమ్మి బాకీ తీర్చాలని
  rationale: మూలపాఠం భార్యను, పిల్లలను కూడా అమ్మాలనే ఆదేశంలో స్పష్టంగా చేర్చుతుంది. ఆధునిక సున్నితత్వం కోసం ఈ కఠినమైన చారిత్రక అంశాన్ని మృదువుగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని అధికార సంబంధం, కుటుంబ సభ్యుల అమ్మకం అనే కఠిన అంశం, చెల్లింపు జరగాలనే ఉద్దేశం అన్నీ మృదువుపరచకుండా నిలుపబడ్డాయి.
