id: MAT.18.3
reference: Matthew 18:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: te
  text: 'ఆయన ఇలా అన్నారు: “నిజంగా నేను మీతో చెబుతున్నాను: మీరు మారి పిల్లలవలె కాకపోతే, పరలోక రాజ్యంలో ఎంతమాత్రమూ ప్రవేశించరు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎంతమాత్రమూ ప్రవేశించరు’ అని అనువదించిన గ్రీకు పదబంధంలో బలమైన నిషేధం ఉంది; ‘ఎన్నటికీ ప్రవేశించరు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: నిశ్చయంగా
  rationale: గంభీరమైన, అధికారపూర్వక ప్రకటనను పరిచయం చేసే ఈ పదానికి ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే సమానార్థకం.
- source_word: στραφῆτε
  choice: తిరిగి
  rationale: క్రియలోని నిర్ణయాత్మక మలుపును చూపుతుంది; కర్తృత్వాన్ని అతిగా నిర్దిష్టం చేయకుండా ‘తిరగడం/తిరిగి రావడం’ అనే భావాన్ని నిలుపుతుంది.
- source_word: γένησθε
  choice: మారకపోతే
  rationale: స్థితిలో మార్పును సూచించే ‘అగుట/మారుట’ భావాన్ని సహజమైన తెలుగు షరతు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ὡς τὰ παιδία
  choice: పిల్లలవలె
  rationale: పిల్లలకు ఉపమానంగా ఉండమనే భావాన్ని నిలుపుతుంది; అమాయకత్వం, వినయం వంటి ఏ ప్రత్యేక గుణాన్నీ వచనంలోకి చేర్చదు. గ్రీకు నిర్దేశక పదం ఇక్కడ వర్గాన్ని సామాన్యంగా సూచించగలదు; తెలుగు వాడుకలో ‘పిల్లలవలె’ సహజం.
- source_word: οὐ μὴ εἰσέλθητε
  choice: ఎంతమాత్రమూ ప్రవేశించరు
  rationale: οὐ μή అనే బలమైన నిషేధాన్ని ఆధునిక, గంభీరమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి సువార్తలోని ప్రత్యేక పదబంధానికి తెలుగులో స్థిరపడిన, సహజమైన అనువాదం.
theological_decisions:
- issue: στραφῆτε లోని మారుమనస్సు/పరివర్తన సంబంధమైన భావం
  choice: ‘తిరిగి’ అని అనువదించడం
  alternative: ‘మారుమనస్సు పొంది’ లేదా ‘మార్చబడి’
  rationale: గ్రీకు నిర్ణయాత్మక మలుపును సూచిస్తుంది గాని, తరువాతి కాలపు సాంకేతిక లేదా సంప్రదాయ సిద్ధాంత పదాన్ని తప్పనిసరి చేయదు. ఈ ఎంపిక కర్తృత్వంలోని వ్యాకరణ సందిగ్ధతను అతిగా పరిష్కరించదు.
- issue: παιδία సూచించే శిష్యత్వ లక్షణం
  choice: ‘పిల్లలవలె’ అని స్పష్టమైన ఉపమానాన్ని మాత్రమే ఉంచడం
  alternative: ‘పిల్లలవలె అమాయకులై’ లేదా ‘పిల్లలవలె వినయంగా’
  rationale: ఈ వచనం ఏ ప్రత్యేక బాల్యగుణాన్ని పేర్కొనదు. అందువల్ల అమాయకత్వం లేదా వినయం వంటి వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా భావ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే యేసు పలుకులోని గంభీరతను నిలుపుతూ అనువదించబడింది. ‘పిల్లలవలె’ అనే సహజ తెలుగు రూపం ద్వారా గ్రీకు ఉపమానంలోని వ్యాఖ్యాన విస్తృతి కాపాడబడింది.
