revisions:
- from: అతడు వారి మాట వినడానికి నిరాకరిస్తే, ఆ సంగతి సమాజానికి[a] చెప్పు. సమాజం మాట కూడా వినడానికి నిరాకరిస్తే, అతడు నీకు అన్యజనుడిలా, పన్ను వసూలు చేసేవాడిలా ఉండాలి.
