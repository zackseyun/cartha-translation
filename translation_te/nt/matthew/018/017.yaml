id: MAT.18.17
reference: Matthew 18:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: te
  text: అతడు వారి మాట వినడానికి నిరాకరిస్తే, ఆ సంగతి సభకు[a] చెప్పు. సభ మాట కూడా వినడానికి నిరాకరిస్తే, అతడు నీకు అన్యజనుడిలా, పన్ను వసూలు చేసేవాడిలా ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘సభ’ అనే చోట ‘సంఘం’ లేదా ‘సమాజం’ అని కూడా అనువదించవచ్చు (గ్రీకు: ఎక్లేసియా).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: మాట వినడానికి నిరాకరిస్తే
  rationale: ఈ క్రమశిక్షణ సందర్భంలో ఈ పదం కేవలం వినకపోవడం కాక, చెప్పినదాన్ని పెడచెవిన పెట్టడం లేదా ఆలకించడానికి నిరాకరించడం అనే భావాన్ని ఇస్తుంది. తెలుగు వాక్యంలో ఉద్దేశపూర్వక నిరాకరణను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰπὸν
  choice: ఆ సంగతి ... చెప్పు
  rationale: ఆజ్ఞార్థక బలాన్ని నిలుపుతూ, సందర్భంలో అంతర్లీనంగా ఉన్న విషయాన్ని ‘ఆ సంగతి’ అని సహజమైన తెలుగులో స్పష్టం చేస్తుంది; కొత్త వివరాన్ని చేర్చదు.
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: సమాజం
  rationale: ఇక్కడ సమకూడిన విశ్వాసుల సముదాయాన్ని సూచిస్తుంది. ‘సమాజం’ మూలపదంలోని సముదాయ భావాన్ని నిలుపుతూ, తరువాతి కాలపు సంస్థాగత అర్థాలను అనవసరంగా ముందుకు తేవదు. సంప్రదాయ ‘సంఘం’ మరియు ‘సభ’ రూపాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: ἔστω σοι
  choice: అతడు నీకు ... ఉండాలి
  rationale: గ్రీకు ఆజ్ఞార్థక భావాన్నీ, σοι అనే ఏకవచన దత్తివిభక్తి సంబంధాన్నీ తెలుగులో సహజంగా నిలుపుతుంది; ‘అతణ్ణి అలా పరిగణించు’ అనే వివరణాత్మక విస్తరణను నివారిస్తుంది.
- source_word: ὥσπερ
  choice: -లా
  rationale: మూలంలోని ఉపమానాన్ని సహజమైన తెలుగు తులనార్థక ప్రత్యయంతో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ὁ ἐθνικὸς
  choice: అన్యజనుడు
  rationale: యూదుల సందర్భంలో నిబంధన సమాజానికి వెలుపలివాడైన యూదేతరుణ్ణి సూచించే సాధారణ తెలుగు బైబిలు పదం. గ్రీకులోని నిర్దిష్ట ఉపపదం ఒక వర్గానికి ప్రాతినిధ్యంగా ఉంది; తెలుగులో ప్రత్యేక ఉపపదం అవసరం లేదు.
- source_word: ὁ τελώνης
  choice: పన్ను వసూలు చేసేవాడు
  rationale: τελώνης యొక్క అర్థాన్ని సాధారణ ఆధునిక తెలుగు పాఠకునికి వెంటనే అర్థమయ్యేలా వ్యక్తం చేస్తుంది. ‘సుంకరి’ సంక్షిప్తమైనా నేటి వాడుకలో తక్కువ సహజం.
theological_decisions:
- issue: పునరుత్థానానికి ముందున్న మత్తయి సందర్భంలో ἐκκλησία అనువాదం
  choice: సమాజం
  alternative: సంఘం; సభ
  rationale: యేసు సూచనలోని సమకూడిన సముదాయ భావాన్ని ముందుకు తెచ్చి, తరువాతి కాలపు సంఘ వ్యవస్థ లేదా ఏదైనా ప్రత్యేక సంఘశాఖ పాలనా రూపాన్ని వాక్యంలోకి దిగుమతి చేయకుండా ఉంటుంది. సంప్రదాయంగా సాధ్యమైన ప్రత్యామ్నాయాలు పాదసూచికలో నిలుపబడ్డాయి.
- issue: పశ్చాత్తాపపడని వ్యక్తిని వెలుపలివానితో పోల్చడంలోని బలం
  choice: అతడు నీకు అన్యజనుడిలా, పన్ను వసూలు చేసేవాడిలా ఉండాలి
  alternative: అతణ్ణి అన్యజనుడిగా, పన్ను వసూలు చేసేవాడిగా చూడు
  rationale: మూలంలోని ఉపమానాన్నీ ఆజ్ఞార్థక బలాన్నీ నిలుపుతుంది. దీనిని విస్తృతమైన బహిష్కరణ విధానంగా గానీ, వ్యక్తిగత ద్వేషానికి ఆజ్ఞగా గానీ వివరణాత్మకంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకునికి అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘పన్ను వసూలు చేసేవాడు’ అనే రూపం సంప్రదాయ ‘సుంకరి’ కంటే నేటి పాఠకునికి స్పష్టంగా ఉంటుంది; వాక్యం ఏకవచన ‘నీకు’ను నిలుపుతుంది.
