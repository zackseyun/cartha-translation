id: MAT.18.13
reference: Matthew 18:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: te
  text: అతనికి అది దొరికితే[a], నేను మీతో నిజంగా చెబుతున్నాను, తప్పిపోని తొంభై తొమ్మిదింటికన్నా దాని గురించి అతడు ఎక్కువగా సంతోషిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపనిష్ఠంగా: ‘అతడు దానిని కనుగొనడం జరిగితే.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: '[ప్రత్యేక పదంగా అనువదించలేదు]'
  rationale: తెలుగులో ముందరి వాక్యంతో అనుసంధానం సందర్భం ద్వారా సహజంగా స్పష్టమవుతుంది; ‘మరియు’ అని ప్రారంభించడం అసహజంగా ఉంటుంది.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: అది దొరికితే
  rationale: ఈ నిర్మాణం కనుగొనడం నిజంగా సంభవించడాన్ని షరతుగా ఉంచుతుంది. సహజమైన తెలుగులో ‘దొరికితే’ ఆ అనిశ్చితిని కాపాడుతుంది; మరింత రూపనిష్ఠమైన భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: యేసు పలికే గంభీరమైన ధృవీకరణ సూత్రాన్ని ఆధునిక, సహజ తెలుగులో నిలుపుతుంది.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: దాని గురించి అతడు ... సంతోషిస్తాడు
  rationale: χαίρω లోని ఆనందభావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ‘దాని గురించి’ ఆనందానికి కారణమైన గొర్రెను సూచిస్తుంది.
- source_word: μᾶλλον ἢ
  choice: '... కంటే ... ఎక్కువగా'
  rationale: గ్రీకు తులనను నేరుగా నిలుపుతుంది; ఒకదాన్ని పూర్తిగా మినహాయించే భావాన్ని చేర్చదు.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: తొంభై తొమ్మిదింటి
  rationale: గ్రీకులో ‘గొర్రెలు’ అనే నామవాచకం పునరుక్తం కాలేదు. తెలుగులో సంఖ్యకు ‘ఇంటి’ ప్రత్యయం జోడించడం ద్వారా సందర్భంలోని గొర్రెల సూచన స్పష్టంగా ఉంటుంది.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: తప్పిపోని
  rationale: దారి తప్పి వెళ్లని గొర్రెలను సంక్షిప్తంగా, సహజంగా సూచిస్తుంది; క్రియలోని తప్పుదారి/తప్పిపోవడం భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: కాపరి ఆనందానికి సంబంధించిన తులనాత్మక బలం
  choice: తిరిగి దొరికిన ఒక్కదాని గురించి, తప్పిపోని తొంభై తొమ్మిదింటి కంటే అతడు ఎక్కువగా సంతోషిస్తాడనే తులనను నేరుగా ఉంచడం.
  alternative: ఇది కేవలం అతిశయోక్తి అన్నట్లు తులనను మృదువుగా చేయడం, లేదా తొంభై తొమ్మిది తక్కువ విలువైనవని సూచించడం.
  rationale: μᾶλλον ἢ నిజమైన తులనను వ్యక్తం చేస్తుంది. తొంభై తొమ్మిదింటి పట్ల శ్రద్ధ లేదని గానీ, అవి తక్కువ విలువైనవని గానీ పాఠం చెప్పదు; అందువల్ల ఆ వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్యనిర్మాణం. గొర్రెకు ‘అది/దాని’ అనే నపుంసక సూచనను వాడి గ్రీకు αὐτόను సహజంగా ప్రతిబింబించాం.
