id: MAT.18.32
reference: Matthew 18:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked servant[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: te
  text: 'అప్పుడు అతని యజమాని అతన్ని పిలిపించి, అతనితో ఇలా అన్నాడు: “దుష్ట దాసుడా[b], నువ్వు నన్ను వేడుకున్నావు కాబట్టి ఆ అప్పంతటినీ నీకు మాఫు చేశాను[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆ అప్పంతటినీ నీ కోసం రద్దు చేశాను.” గ్రీకు క్రియ అప్పును వదిలివేయడం లేదా రద్దు చేయడంతో పాటు క్షమించడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “సేవకుడా.” గ్రీకు δοῦλος అనే పదం సేవకుణ్ణి లేదా దాసుణ్ణి సూచించగలదు; ఈ ఉపమానంలో యజమానికి లోబడిన బంధిత సంబంధం ప్రధానంగా ఉన్నందున “దాసుడు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: ఉపమాన కథనంలోని సంఘటనల క్రమాన్ని సహజంగా సూచిస్తుంది.
- source_word: προσκαλεσάμενος
  choice: పిలిపించి
  rationale: యజమాని అధికారంతో తన దగ్గరకు పిలిచిన భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ κύριος αὐτοῦ
  choice: అతని యజమాని
  rationale: ఇక్కడ κύριος దైవ బిరుదుగా కాక, దాసునిపై అధికారం గల యజమానిని సూచిస్తుంది.
- source_word: λέγει αὐτῷ
  choice: అతనితో ఇలా అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమాన కాలాన్ని సహజ తెలుగు కథన శైలిలో భూతకాలంగా ఇచ్చింది.
- source_word: Δοῦλε πονηρέ
  choice: దుష్ట దాసుడా
  rationale: πονηρέలోని నైతిక నిందను ‘దుష్ట’ తెలియజేస్తుంది; δοῦλεలోని బంధిత, అధీన సామాజిక స్థితిని ‘దాసుడు’ నిలుపుతుంది.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: ఆ అప్పంతటినీ
  rationale: మొత్తం అప్పును సూచించే గ్రీకు పదబంధాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἀφῆκά σοι
  choice: నీకు మాఫు చేశాను
  rationale: అప్పును వదిలివేయడం లేదా రద్దు చేయడం అనే తక్షణ భావంతో పాటు క్షమాపణకు సంబంధించిన విస్తృత ప్రతిధ్వనినీ ‘మాఫు’ నిలుపుతుంది.
- source_word: ἐπεὶ
  choice: కాబట్టి
  rationale: యజమాని అప్పు మాఫు చేసిన కారణాన్ని స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: παρεκάλεσάς με
  choice: నువ్వు నన్ను వేడుకున్నావు
  rationale: పరితాపంతో చేసిన విన్నపాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యజమాని–దాసుని సంబంధంలో δοῦλος అనువాదం
  choice: దాసుడు
  alternative: సేవకుడు
  rationale: ఈ ఉపమానంలో యజమానికి లోబడిన బంధిత స్థితి ప్రధానంగా ఉంది. ‘దాసుడు’ ఆ సామాజిక వాస్తవాన్ని ‘సేవకుడు’ కంటే స్పష్టంగా నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సూచించింది.
- issue: అప్పు సందర్భంలో ἀφίημι అనువాదం
  choice: మాఫు చేశాను
  alternative: రద్దు చేశాను
  rationale: సందర్భంలో ఇది అప్పు రద్దును సూచించినా, మత్తయి రచనలోని క్షమాపణ భావంతో ఉన్న సంబంధాన్ని పూర్తిగా వాణిజ్యపరమైన పదంతో సమతలపరచకుండా ‘మాఫు’ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పిలిపించి’, ‘వేడుకున్నావు’, ‘మాఫు చేశాను’ వంటి పదాలు సహజ వాడుకను, మూలంలోని అధికార సంబంధం మరియు అప్పు–క్షమాపణ ద్వంద్వార్థాన్ని సమతుల్యం చేస్తాయి.
