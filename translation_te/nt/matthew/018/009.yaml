review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the conditional warning, the stumbling metaphor, forceful removal, entry into life, and the passive contrast. However, the Greek εἰς in βληθῆναι εἰς τὴν γέενναν calls for movement into Gehenna; the draft's locative form “గెహెన్నాలో” can mean simply ‘in Gehenna.’
  naturalness: The wording is generally modern and clear. “పెరికివేసి” is the more idiomatic Telugu verb for forcibly removing an eye than “పీకివేసి,” while retaining the source’s severe imagery. “గెహెన్నాలోకి” is both natural and semantically precise.
  terminology: “జీవంలో” appropriately avoids adding ‘eternal,’ and transliterating γέεννα as “గెహెన్నా” appropriately preserves the specific Greek term. “అగ్ని గెహెన్నా” is retained as a compact, intelligible rendering of ‘the Gehenna of fire.’
  issues:
  - severity: medium
    issue: The phrase “అగ్ని గెహెన్నాలో పడవేయబడడం” uses a locative form.
    rationale: The Greek says to be thrown εἰς (‘into’) the Gehenna of fire. Telugu “గెహెన్నాలోకి” preserves this directional sense.
  - severity: low
    issue: “పీకివేసి” is less idiomatic for an eye in this register.
    rationale: “పెరికివేసి” is standard natural Telugu for the forceful removal depicted by ἔξελε, without softening the imagery.
  revised_text: నీ కన్ను నిన్ను తడబడేలా చేస్తే[a], దాన్ని పెరికివేసి నీ నుండి దూరంగా పారవేయి. రెండు కళ్లతో అగ్ని గెహెన్నాలోకి[b] పడవేయబడటంకంటే, ఒక కన్నుతో జీవంలో ప్రవేశించడం నీకు మేలు.
