id: MAT.18.9
reference: Matthew 18:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: te
  text: నీ కన్ను నిన్ను తడబడేలా చేస్తే[a], దాన్ని పెరికివేసి నీ నుండి దూరంగా పారవేయి. రెండు కళ్లతో అగ్ని గెహెన్నాలోకి[b] పడవేయబడటంకంటే, ఒక కన్నుతో జీవంలో ప్రవేశించడం నీకు మేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నిన్ను పాపంలో పడేలా చేస్తే.’ గ్రీకు క్రియకు ఒకరిని తడబడేలా, పడిపోయేలా లేదా పాపం చేసేలా చేయడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘గెహెన్నా’ అంతిమ తీర్పు స్థలాన్ని సూచిస్తుంది; సంప్రదాయంగా దీనిని ‘నరకం’ అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: తడబడేలా చేస్తే
  rationale: పడిపోవడం లేదా పాపంలో చిక్కుకోవడం అనే రూపకాన్ని నిలుపుతుంది; అర్థాన్ని కేవలం అంతరంగిక శోధనకు పరిమితం చేయదు.
- source_word: ἔξελε
  choice: పీకివేసి
  rationale: ఆజ్ఞలోని తీవ్రతను, అత్యవసరమైన నిర్ణయాత్మక చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: βάλε ἀπὸ σοῦ
  choice: నీ నుండి దూరంగా పారవేయి
  rationale: పూర్తిగా వేరుచేసి తొలగించాలనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: καλόν σοί ἐστιν
  choice: నీకు మేలు
  rationale: తర్వాతి ‘కంటే’ అనే పోలికకు అనుగుణంగా, కేవలం ‘మంచిది’ కాక ‘మేలైనది’ అనే భావాన్ని ఇస్తుంది.
- source_word: μονόφθαλμον
  choice: ఒక కన్నుతో
  rationale: ‘ఒంటికన్నుగలవాడిగా’ కంటే సహజంగా ఉండి, శారీరక దృశ్యాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: εἰς τὴν ζωὴν
  choice: జీవంలో ప్రవేశించడం
  rationale: గ్రీకులో లేని ‘నిత్య’ అనే విశేషణాన్ని చేర్చకుండా, అంత్యకాల సంబంధమైన భావసూచనను తెరిచి ఉంచుతుంది.
- source_word: βληθῆναι
  choice: పడవేయబడడం
  rationale: గ్రీకు కర్మణి రూపాన్ని స్పష్టంగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: γέενναν
  choice: గెహెన్నా
  rationale: ప్రత్యేకమైన యూదా చారిత్రక, అంత్యకాల నేపథ్యమున్న మూలపదాన్ని సాధారణ ‘నరకం’ అనే పదంలో కలిపివేయకుండా నిలుపుతుంది.
- source_word: τοῦ πυρός
  choice: అగ్ని గెహెన్నా
  rationale: అగ్ని అనే స్పష్టమైన దృశ్యాన్ని నిలుపుతూ గ్రీకు సంబంధార్థాన్ని సంక్షిప్తమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: γέεννα పదం అనువాదం
  choice: గెహెన్నా
  alternative: నరకం
  rationale: మూలపాఠంలోని ప్రత్యేక పదాన్ని నిలిపి, తర్వాతి కాలపు విస్తృతమైన మతపరమైన భావాలను అనవసరంగా దిగుమతి చేయకుండా ఉంటుంది.
- issue: εἰς τὴν ζωὴν పదబంధం
  choice: జీవంలో ప్రవేశించడం
  alternative: నిత్యజీవంలో ప్రవేశించడం
  rationale: సందర్భంలో అంత్యకాల జీవితం సూచితమైనా, గ్రీకు పాఠంలో ‘నిత్య’ అని స్పష్టంగా లేదు; అందువల్ల మూలపాఠపు సంక్షిప్తతను, భావవిస్తృతిని కాపాడుతుంది.
- issue: కన్ను పీకివేయాలనే ఆజ్ఞ తీవ్రత
  choice: తీవ్రమైన దృశ్యభాషను అనువాదంలో యథాతథంగా ఉంచడం
  alternative: హానికరమైనదాన్ని తొలగించు అని వివరణాత్మకంగా సరళీకరించడం
  rationale: మూలంలోని ఉద్దేశపూర్వకమైన తీవ్రతను అనువాదకుడు మృదువుచేయకూడదు; దాని ప్రయోగ స్వరూపాన్ని పాఠకుడు సందర్భంలో గ్రహించేలా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన నేరుగా చెప్పే శైలిని వాడాం. ‘తడబడేలా’ అనే రూపకం, ‘పీకివేసి’ అనే తీవ్రత, ‘జీవం’ అనే సంక్షిప్త అంత్యకాల పదప్రయోగం నిలుపబడ్డాయి. ‘గెహెన్నా’ మూలపదంగా ఉంచి పాదసూచికలో వివరణ ఇచ్చాం.
