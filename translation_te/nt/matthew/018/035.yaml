id: MAT.18.35
reference: Matthew 18:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: te
  text: “మీరిలో ప్రతి ఒక్కరూ తన సహోదరుణ్ణి[a] హృదయపూర్వకంగా క్షమించకపోతే, పరలోకస్థుడైన నా తండ్రి కూడా మీకు అలాగే చేస్తాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరుడు’ అని అనువదించిన గ్రీకు పదం పుంలింగ ఏకవచనంలో ఉంది; ఈ సందర్భంలో అది ప్రతి తోటి శిష్యుణ్ణి లేదా తోటి విశ్వాసిని ప్రాతినిధ్యంగా సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: కూడా … అలాగే
  rationale: ముందున్న ఉపమానంలోని యజమాని చర్యను ఈ హెచ్చరికకు అన్వయించే తులనాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: పరలోకస్థుడైన నా తండ్రి
  rationale: ‘నా’ అనే సంబంధాన్నీ, οὐράνιος అనే విశేషణ భావాన్నీ స్పష్టంగా ఉంచుతుంది; మూలంలో లేని నిర్దిష్ట స్థలవాచక వివరణను చేర్చదు.
- source_word: ποιήσει ὑμῖν
  choice: మీకు … చేస్తాడు
  rationale: ముందటి ఉపమానంలో యజమాని చేసిన దానిని సూచించే ποιέω యొక్క విస్తృత భావాన్ని నిలుపుతుంది; తీర్పు స్వరూపాన్ని వచనం చెప్పినదానికంటే విస్తరించదు.
- source_word: ἐὰν μὴ
  choice: క్షమించకపోతే
  rationale: ప్రతికూల షరతును ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀφῆτε
  choice: క్షమించకపోతే
  rationale: వ్యక్తిగత అపరాధం, అప్పు అనే సందర్భంలో ἀφίημι ఇక్కడ ‘క్షమించు’ అనే అర్థాన్నే ఇస్తుంది.
- source_word: ἕκαστος
  choice: మీలో ప్రతి ఒక్కరూ
  rationale: బహువచన శ్రోతలలో ఒక్కొక్కరిపై బాధ్యతను పంపిణీ చేసే మూలంలోని ఏకవచన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: తన సహోదరుణ్ణి
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని నిలుపుతూ, కర్తకు తిరిగి సూచించే αὐτοῦను సహజమైన తెలుగు ‘తన’తో వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: హృదయపూర్వకంగా
  rationale: అక్షరార్థమైన ‘మీ హృదయాలనుంచి’ తెలుగులో కృత్రిమంగా వినిపిస్తుంది; ఈ ప్రయోగం అంతరంగం నుంచి వచ్చే నిజమైన క్షమాపణ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: హెచ్చరిక యొక్క పరిధి, తీవ్రత
  choice: ఉపమానంలోని చర్యకు అనుగుణంగా దేవుడు ‘మీకు అలాగే చేస్తాడు’ అనే ప్రత్యక్ష హెచ్చరికగా అనువదించడం
  alternative: దీనిని నిత్యశిక్షగా లేదా ప్రతిఫల నష్టంగా విస్తరించి వివరించడం
  rationale: గ్రీకు వాక్యం గంభీరమైన షరతుతో కూడిన దైవిక తీర్పును ప్రకటిస్తుంది; అయితే ఆ తీర్పుకు సంబంధించిన సంపూర్ణ సిద్ధాంత వర్గాన్ని ఈ వచనమే నిర్దిష్టంగా చెప్పదు.
- issue: ἀδελφῷలోని పుంలింగ భాష
  choice: తన సహోదరుణ్ణి
  alternative: తన సహోదరుణ్ణి లేదా సహోదరిని; తోటి విశ్వాసిని
  rationale: మూలంలోని పుంలింగ ఏకవచనాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భంలో దాని ప్రాతినిధ్య ప్రయోగాన్ని పాదటిప్పణిలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైన హెచ్చరిక స్వరాన్ని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే వాక్య నిర్మాణం. ‘హృదయపూర్వకంగా’ అనేది మూలంలోని బహువచన ‘మీ హృదయాలనుంచి’ అనే అంతరంగ నిజాయితీ భావానికి సహజ తెలుగు సమానార్థకం.
