id: MAT.18.24
reference: Matthew 18:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: te
  text: అతడు లెక్కలు తేల్చడం మొదలుపెట్టినప్పుడు, పదివేల తలాంతులు[a] అప్పు పడిన ఒక వ్యక్తిని అతని దగ్గరికి తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: తలాంతు అనేది చాలా పెద్ద బరువు/ద్రవ్య ప్రమాణం. ఈ ఉపమానంలోని సందర్భంలో ‘పదివేల తలాంతులు’ ఊహకందనంత అపారమైన అప్పును సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ συναίρειν
  choice: అతడు లెక్కలు తీర్చడం మొదలుపెట్టినప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ తెలిపే కాలసంబంధ పరిస్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. συναίρειν ఇక్కడ ఆర్థిక లెక్కలను పరిష్కరించడం అనే భావంలో ఉంది.
- source_word: προσηνέχθη αὐτῷ
  choice: అతని దగ్గరికి తీసుకొచ్చారు
  rationale: గ్రీకు కర్మణి రూపం ఆ వ్యక్తిని ఇతరులు రాజు వద్దకు తీసుకొచ్చారని సూచిస్తుంది; తెలుగు సహజ ప్రయోగంలో అనిర్దిష్ట కర్తతో క్రియాశీల రూపం స్పష్టంగా ఉంటుంది.
- source_word: εἷς ὀφειλέτης
  choice: ఒక రుణస్థుణ్ణి
  rationale: εἷς ను ‘ఒక’గా నిలుపుతూ, ὀφειλέτης కు గౌరవప్రదమైన సాధారణ తెలుగు పదమైన ‘రుణస్థుడు’ను వాడాం.
- source_word: μυρίων ταλάντων
  choice: పదివేల తలాంతులు
  rationale: μύριοι యొక్క సంఖ్యార్థమైన ‘పదివేలు’ను నిలిపి, చారిత్రక ద్రవ్య/బరువు ప్రమాణమైన τάλαντον ను ఆధునిక కరెన్సీగా ఊహాత్మకంగా మార్చకుండా ‘తలాంతు’గా లిప్యంతరీకరించాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. చారిత్రక ప్రమాణాన్ని ప్రధాన పాఠంలో నిలిపి, దాని పరిమాణ భావాన్ని పాదసూచికలో వివరించాం.
