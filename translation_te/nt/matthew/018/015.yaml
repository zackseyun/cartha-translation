id: MAT.18.15
reference: Matthew 18:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: te
  text: “నీ సహోదరుడు[b] నీకు విరోధంగా పాపం చేస్తే[a], నీవు వెళ్లి అతనితో ఏకాంతంగా అతని తప్పును ఎత్తిచూపు[c]. అతడు నీ మాట వింటే, నీవు నీ సహోదరుణ్ణి గెలుచుకున్నావు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'కొన్ని ప్రాచీన ప్రతుల్లో ‘నీకు విరోధంగా’ అనే మాటలు లేవు. అప్పుడు వాక్యం: ‘నీ సహోదరుడు పాపం చేస్తే, నీవు వెళ్లి…’ అని ఉంటుంది.'
    reason: textual_variant
  - marker: b
    text: ‘సహోదరుడు’ అనే గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ ఏకవచనం; ఈ సందర్భంలో అది తోటి శిష్యుని మరింత విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అతని తప్పును అతనికి చూపించు’; ‘అతన్ని గద్దించు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: పాపం చేస్తే
  rationale: ἐὰνతో వచ్చిన aorist subjunctive సాధారణ షరతును సూచిస్తుంది. ‘పాపం చేస్తే’ అనేది సహజమైన తెలుగు; అలాగే ἁμαρτάνωలోని నైతిక, ఆధ్యాత్మిక భావాన్ని నిలుపుతుంది.
- source_word: εἰς σέ
  choice: నీకు విరోధంగా
  rationale: ఈ సందర్భంలో εἰς + accusative వ్యక్తిగతంగా ఒకరికి వ్యతిరేకంగా చేసిన పాపాన్ని సూచిస్తుంది. ‘నీకు విరోధంగా’ ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὁ ἀδελφός σου
  choice: నీ సహోదరుడు
  rationale: గ్రీకు పదబంధం వ్యాకరణపరంగా పుంలింగ ఏకవచనం. ప్రసంగ సందర్భంలో ఇది తోటి శిష్యుని సూచించవచ్చు; మూలరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, విస్తృత సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: ὕπαγε
  choice: నీవు వెళ్లి
  rationale: ఆజ్ఞారూపంలోని ఈ క్రియ తదుపరి చర్యను ప్రారంభిస్తుంది. తెలుగులో ‘వెళ్లి’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: ἔλεγξον
  choice: అతని తప్పును ఎత్తిచూపు
  rationale: ἐλέγχω ఇక్కడ తప్పును బయటపెట్టి, దానిని ఆ వ్యక్తి ఎదుట స్పష్టం చేయడాన్ని సూచిస్తుంది. ‘ఎత్తిచూపు’ కేవలం గద్దించడం కంటే ఈ భావాన్ని సమతుల్యంగా అందిస్తుంది.
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: అతనితో ఏకాంతంగా
  rationale: ఈ పదబంధం ఇతరులెవరూ లేకుండా ఇద్దరి మధ్య మాత్రమే జరగాలని నొక్కి చెబుతుంది. ‘అతనితో ఏకాంతంగా’ ఆ గోప్యతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀκούσῃ
  choice: నీ మాట వింటే
  rationale: ἀκούω ఇక్కడ కేవలం శబ్దం వినడమే కాక, చెప్పినదాన్ని శ్రద్ధగా స్వీకరించడాన్ని సూచించగలదు. ‘నీ మాట వింటే’ విధేయత అనే అధిక భావాన్ని చేర్చకుండా స్పందనాత్మక వినికిడిని తెలియజేస్తుంది.
- source_word: ἐκέρδησας
  choice: గెలుచుకున్నావు
  rationale: κερδαίνωలోని ‘సంపాదించు/గెలుచుకో’ అనే రూపకాన్ని ‘గెలుచుకున్నావు’ సహజమైన సంబంధభాషలో నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘తిరిగి’ అనే భావాన్ని చేర్చదు.
theological_decisions:
- issue: ἀδελφός అనే పదాన్ని అన్వయంలో లింగసమావేషంగా అనువదించాలా
  choice: నీ సహోదరుడు
  alternative: తోటి విశ్వాసి; సహోదరుడు లేదా సహోదరి
  rationale: మూల గ్రీకు వ్యాకరణపరంగా పుంలింగ ఏకవచనం. సందర్భంలో విస్తృతంగా తోటి శిష్యునికి వర్తించే అవకాశం ఉన్నా, ఆ వ్యాఖ్యాన విస్తరణను ప్రధాన పాఠ్యంలో మూలరూపానికి బదులుగా పెట్టలేదు.
- issue: εἰς σέ పాఠాంతర స్థితి
  choice: ప్రధాన పాఠ్యంలో ‘నీకు విరోధంగా’ చేర్చడం
  alternative: ‘నీ సహోదరుడు పాపం చేస్తే’ అని ఆ పదబంధాన్ని విడిచిపెట్టడం
  rationale: అందించిన SBLGNT పాఠ్యంలో εἰς σέ ఉంది. కొన్ని ప్రతుల్లో అది లేకపోవడం వాక్య పరిధిని ప్రభావితం చేస్తుంది కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో స్పష్టంగా ఉంచాం.
- issue: κερδαίνωకు సంబంధపరమైన అర్థం
  choice: నీ సహోదరుణ్ణి గెలుచుకున్నావు
  alternative: నీ సహోదరుణ్ణి తిరిగి పొందావు
  rationale: ‘తిరిగి పొందావు’ సందర్భానికి సరిపోవచ్చు గాని, ‘తిరిగి’ అనే భావం క్రియలో స్పష్టంగా లేదు. అందువల్ల మూలంలోని gain/win రూపకాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఏకవచన సంభోదనను వాడాం. ‘అతనితో ఏకాంతంగా’ అని చెప్పడం ద్వారా ఇద్దరి మధ్య మాత్రమే అనే గ్రీకు భావాన్ని సహజంగా అందించాం. ‘గెలుచుకున్నావు’ ద్వారా మూలంలోని సంబంధపరమైన రూపకాన్ని నిలిపాం.
