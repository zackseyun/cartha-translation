id: MAT.18.19
reference: Matthew 18:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: te
  text: '“మళ్లీ నేను మీతో నిజంగా చెబుతున్నాను: భూమిపై మీలో ఇద్దరు తాము అడిగే ఏ విషయం గురించైనా ఏకీభవిస్తే[a][c], పరలోకంలో ఉన్న నా తండ్రి నుండి అది వారికి కలుగుతుంది.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీలోనుండి ఇద్దరు ఒకే అభిప్రాయంతో ఉంటే.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా “పరలోకాల్లో”; తెలుగులో సహజంగా “పరలోకంలో” అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: c
    text: సందర్భంలో ఈ మాట, సమాజంలోని సరిదిద్దడం మరియు అధికారాన్ని గురించి యేసు చెప్పిన బోధ (18:15–18) తరువాత వస్తుంది; అయితే ఈ వాక్యంలోని మాటలు తాము ఏకీభవించి అడిగే విషయాల గురించి విస్తృతంగా చెబుతున్నాయి.
    reason: cross_reference
lexical_decisions:
- source_word: Πάλιν
  choice: మళ్లీ
  rationale: ముందున్న బోధకు అనుసంధానంగా మరో గంభీరమైన ప్రకటనను ప్రారంభిస్తున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: యేసు వాడే గంభీరమైన ధృవీకరణ సూత్రంలోని ఉద్ఘాటనను ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: మీలో ఇద్దరు ఏకీభవిస్తే
  rationale: συμφωνέω ఇక్కడ ఒకే విషయంపై సమ్మతించడం లేదా ఏకాభిప్రాయానికి రావడం అనే భావాన్ని ఇస్తుంది; ἐξ ὑμῶν ను ‘మీలో’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిపై
  rationale: పరలోకంలో ఉన్న తండ్రితో ఉన్న స్థలపరమైన వ్యత్యాసాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: περὶ παντὸς πράγματος
  choice: ఏ విషయం గురించైనా
  rationale: πρᾶγμα యొక్క విస్తృతమైన ‘విషయం, వ్యవహారం’ అనే అర్థాన్ని అనవసరంగా పరిమితం చేయదు.
- source_word: οὗ ἐὰν αἰτήσωνται
  choice: తాము అడిగే
  rationale: అడగడం లేదా అభ్యర్థించడం అనే αἰτέω భావాన్ని సహజంగా తెలుపుతుంది; ప్రార్థన అనే పదాన్ని మూలపాఠంలో లేనందున నేరుగా చేర్చలేదు.
- source_word: γενήσεται αὐτοῖς
  choice: అది వారికి కలుగుతుంది
  rationale: ‘వారికి జరుగుతుంది/కలుగుతుంది’ అనే ఫలితార్థాన్ని నిలుపుతూ తెలుగులో సహజమైన నిర్మాణాన్ని ఇస్తుంది.
- source_word: παρὰ τοῦ πατρός μου
  choice: నా తండ్రి నుండి
  rationale: παρά + షష్ఠీ విభక్తి తెలిపే మూలం లేదా కార్యసాధకత్వంలోని అస్పష్టతను ‘నుండి’ ద్వారా నిలుపుతుంది; తండ్రి ఆ ఫలితానికి మూలమని తెలియజేస్తుంది.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: పరలోకంలో ఉన్న
  rationale: గ్రీకు బహువచనాన్ని తెలుగులో సాధారణంగా వాడే ఏకవచన పరలోక రూపంతో సహజంగా అందిస్తుంది; అక్షరార్థ రూపాన్ని పాదసూచికలో పేర్కొంటుంది.
theological_decisions:
- issue: వాగ్దానపు పరిధి
  choice: సమ్మతించి అడిగే విషయాన్ని వాక్యం చెప్పినంత విస్తృతంగానే ఉంచడం; ప్రార్థన, సంఘ క్రమశిక్షణ లేదా దేవుని చిత్తం వంటి స్పష్టంగా లేని పరిమితులను ప్రధాన పాఠ్యంలో చేర్చకపోవడం
  alternative: ఈ వాగ్దానాన్ని సంఘ క్రమశిక్షణ నిర్ణయాలకే స్పష్టంగా పరిమితం చేయడం, లేదా ప్రతి ఉమ్మడి అభ్యర్థనకు షరతులేని హామీగా విస్తరించడం
  rationale: తక్షణ సందర్భం సమాజంలోని సరిదిద్దడం మరియు అధికారాన్ని గురించి మాట్లాడుతున్నా, ఈ వాక్యంలోని మాటలు విస్తృతంగా ఉన్నాయి. అందువల్ల సందర్భాన్ని పాదసూచికలో తెలియజేసి, ప్రధాన పాఠ్యంలోని ఉద్దేశపూర్వక విస్తృతతను మరియు ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘నిజంగా’ గంభీరమైన ἀμήν సూత్రాన్ని అందిస్తుంది; ‘ఏకీభవిస్తే’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలంలోని సమ్మతి భావాన్ని నిలుపుతుంది. ప్రధాన పాఠ్యంలో లేని సిద్ధాంతపరమైన పరిమితులు చేర్చబడలేదు.
