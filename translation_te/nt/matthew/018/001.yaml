id: MAT.18.1
reference: Matthew 18:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: te
  text: ఆ సమయంలో శిష్యులు యేసు దగ్గరికి వచ్చి, “అయితే పరలోక రాజ్యంలో ఎవరు గొప్పవారు?” అని అడిగారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ఆ సమయంలో
  rationale: కాలసూచనను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: προσῆλθον ... τῷ Ἰησοῦ
  choice: యేసు దగ్గరికి వచ్చి
  rationale: గ్రీకు దత్తివుతో కూడిన ‘సమీపించారు’ అనే భావాన్ని సాధారణ, సహజ తెలుగులో అందిస్తుంది.
- source_word: Τίς ἄρα μείζων ἐστὶν
  choice: అయితే ... ఎవరు గొప్పవారు?
  rationale: ἄρα యొక్క సందర్భానుగుణ నిర్ధారణ/పర్యవసాన భావాన్ని ‘అయితే’గా, μείζων యొక్క తులనాత్మక రూపాన్ని సందర్భంలో సహజంగా వినిపించే ‘గొప్పవారు’గా అందిస్తుంది; ఎవరికంటే గొప్పవారు అనే పోలిక మూలంలోనూ స్పష్టంగా చెప్పబడలేదు.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి వాడే స్థిరమైన భావవ్యక్తీకరణకు తెలుగులో సుపరిచితమైన, గౌరవప్రదమైన సమానార్థకం.
theological_decisions:
- issue: μείζων అనే తులనాత్మక విశేషణాన్ని ‘గొప్పవారు’గా అనువదించడం
  choice: ఎవరు గొప్పవారు?
  alternative: ఎవరు మరింత గొప్పవారు? / ఎవరు అందరికంటే గొప్పవారు?
  rationale: గ్రీకులో రూపం తులనాత్మకమైనదే అయినా పోలికకు రెండో పక్షం వ్యక్తంగా లేదు. తెలుగు ప్రశ్నలో ‘ఎవరు గొప్పవారు?’ సహజంగా సమూహంలోని ప్రాముఖ్యతను అడుగుతుంది; ‘అందరికంటే’ అని చేర్చి మూలాన్ని అతిశయోక్తి రూపంగా ఖచ్చితపరచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్య గౌరవం మరియు మూలంలోని తులనాత్మక అస్పష్టత నిలుపబడ్డాయి.
