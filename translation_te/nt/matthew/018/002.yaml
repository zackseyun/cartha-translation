translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. గ్రీకు మూలంలోని చర్యల క్రమం—పిలవడం, మధ్య నిలబెట్టడం—యథాతథంగా నిలుపబడింది.
