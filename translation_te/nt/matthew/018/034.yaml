source:
  edition: SBLGNT
  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: te
  text: అప్పుడు అతని యజమాని కోపంతో, తాను చెల్లించవలసినదంతా తీర్చేవరకు అతన్ని హింసించేవారికి అప్పగించాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువు.” గ్రీకు పదం క్యూరియోస్. ఇక్కడ అది ఉపమాన కథలోని సేవకుని యజమానిని సూచిస్తున్నందున ప్రధాన పాఠంలో “యజమాని” అని అనువదించాం.
    reason: alternative_reading
  - marker: b
    text: లేదా, “యాతన పెట్టేవారికి”; తక్కువ తీవ్రతతో, “కారాగార కాపలాదారులకు.” గ్రీకు పదం కేవలం సాధారణ కాపలాదారులను కాకుండా హింస లేదా యాతన కలిగించేవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: కోపంతో
  rationale: కర్తలో కలిగిన కోపాన్ని ప్రధాన క్రియకు కారణభావంతో అనుసంధానించే సహజమైన తెలుగు ప్రయోగం.
- source_word: κύριος
  choice: యజమాని
  rationale: ఉపమాన కథలో ఇది సేవకునిపై అధికారం గల మానవ యజమానిని సూచిస్తుంది; సందర్భానికి తగిన అర్థాన్ని ఇస్తుంది.
- source_word: παρέδωκεν
  choice: అప్పగించాడు
  rationale: మరొకరి అదుపులోకి లేదా అధికారంలోకి అప్పగించడం అనే న్యాయపరమైన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: βασανισταῖς
  choice: హింసించేవారికి
  rationale: ఈ పదం సాధారణ కాపలాదారులను కాకుండా బాధ లేదా హింస కలిగించేవారిని సూచిస్తుంది; మూలపదంలోని తీవ్రతను నిలుపుతుంది.
- source_word: ἕως οὗ
  choice: వరకు
  rationale: ఎదురుచూసే ముగింపు బిందువును తెలిపే కాలసంబంధ నిర్మాణానికి సహజమైన తెలుగు సమానం.
- source_word: ἀποδῷ
  choice: చెల్లించే
  rationale: బాకీ మొత్తాన్ని తిరిగి చెల్లించడం అనే సందర్భార్థాన్ని, ఇంకా నెరవేరవలసిన ముగింపు చర్యగా తెలియజేస్తుంది.
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: అతడు చెల్లించవలసినదంతా
  rationale: ‘బాకీ’ అనే నామవాచకాన్ని అనవసరంగా చేర్చకుండా, బాకీ ఉన్న సమస్తాన్ని సూచించే మూలంలోని విస్తృత భాగవాచక భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: κύριος ను ‘ప్రభువు’గా అనువదించాలా, ‘యజమాని’గా అనువదించాలా
  choice: యజమాని
  alternative: ప్రభువు
  rationale: ఈ ఉపమాన కథలో పదం సేవకుని మానవ అధిపతిని సూచిస్తుంది. ‘యజమాని’ కథన సంబంధాన్ని స్పష్టంగా ఉంచి, ప్రధాన పాఠంలో అనవసరంగా క్రీస్తు బిరుదు భావాన్ని రుద్దదు.
- issue: βασανισταῖς యొక్క తీవ్రత
  choice: హింసించేవారు
  alternative: యాతన పెట్టేవారు; కారాగార కాపలాదారులు
  rationale: మూలపదం కేవలం నిర్బంధించే కాపలాదారులకన్నా హింస లేదా యాతన కలిగించేవారిని సూచిస్తుంది. ఈ ఎంపిక ఉపమానంలోని తీవ్రమైన హెచ్చరికను నిలుపుతూ, అంతిమ తీర్పు స్వరూపంపై పాఠం చెప్పినదానికంటే ఎక్కువగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. ‘హింసించేవారు’ మూలంలోని తీవ్రతను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; రెండు పాదసూచిక గుర్తులు ప్రధాన పాఠంలో వరుసగా చేర్చబడ్డాయి.
