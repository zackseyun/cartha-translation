id: MAT.18.4
reference: Matthew 18:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: te
  text: కాబట్టి, ఈ చిన్నపిల్లలాగా తనను తాను తగ్గించుకునేవాడే పరలోక రాజ్యంలో అత్యంత గొప్పవాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινώσει ἑαυτόν
  choice: తనను తాను తగ్గించుకునేవాడు
  rationale: తనను తాను వినమ్ర స్థితిలో ఉంచుకోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం అంతర్గత వినయభావానికి మాత్రమే పరిమితం చేయదు.
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: ఈ చిన్నపిల్లలాగా
  rationale: ప్రత్యక్షంగా సూచించబడుతున్న నిర్దిష్ట చిన్నపిల్లను, అలాగే పోలికను స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ μείζων
  choice: గొప్పవాడు
  rationale: సందర్భంలో ఉన్న తులనాత్మక రూపం రాజ్యంలో ఎవరు గొప్పవారో తెలిపే అర్థంలో పనిచేస్తుంది; తెలుగులో సహజంగా ‘గొప్పవాడు’ అని అనువదించబడింది.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి సువార్తలోని స్థిరమైన భావవ్యక్తీకరణను సాధారణ తెలుగు క్రైస్తవ వాడుకకు అనుగుణంగా అందిస్తుంది.
theological_decisions:
- issue: తన్నుతాను తగ్గించుకోవడం మరియు రాజ్యంలో గొప్పతనం మధ్య సంబంధం
  choice: ‘తనను తాను తగ్గించుకునేవాడే ... గొప్పవాడు’ అని బలమైన గుర్తింపుతో అనువదించడం
  alternative: ‘తనను తాను తగ్గించుకునేవాడు ... అత్యంత గొప్పవాడు’
  rationale: οὗτός ἐστιν ὁ μείζων అనే బలపరిచే నిర్మాణాన్ని ‘వాడే’ ద్వారా నిలుపుతూ, సందర్భానికి అనవసరమైన స్థాయి-క్రమ భావాన్ని అతిశయింపకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనదిగా, గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. గ్రీకు వాక్యంలోని అంశాన్ని మళ్లీ సూచించే οὗτος భావాన్ని తెలుగులో సహజమైన ‘వాడే’ ద్వారా ప్రతిబింబించింది.
