source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: te
  text: 'యేసు అతనితో ఇలా అన్నాడు: “నేను నీతో ఏడుసార్ల వరకు అని చెప్పడం లేదు, కానీ డెబ్బై ఏడుసార్ల వరకు అని చెబుతున్నాను.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “డెబ్బై సార్లు ఏడు.”
    reason: గ్రీకు ἑβδομηκοντάκις ἑπτά అనే పదబంధాన్ని ‘డెబ్బై ఏడుసార్లు’ లేదా ‘డెబ్బై సార్లు ఏడు’ అని అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: యేసు అతనితో ఇలా అన్నాడు
  rationale: గ్రీకులో కథన వర్తమాన కాలం ఉన్నా, ఆధునిక తెలుగు కథనంలో భూతకాల రూపం సహజంగా ఉంటుంది. αὐτῷ లోని సర్వనామాన్ని సందర్భంలోని పేతురు పేరుతో భర్తీ చేయకుండా ‘అతనితో’గా ఉంచాం.
- source_word: Οὐ λέγω σοι
  choice: నేను నీతో చెప్పడం లేదు
  rationale: నిషేధాన్ని, ప్రత్యక్ష సంబోధనను స్పష్టంగా నిలుపుతూ ఆధునిక తెలుగులో సహజంగా అనిపించే రూపం.
- source_word: ἕως ἑπτάκις
  choice: ఏడుసార్ల వరకు
  rationale: సంఖ్యాపరమైన పరిమితిని సూచించే ἕωςను ‘వరకు’గా, పునరావృతిని సూచించే ἑπτάκιςను ‘ఏడుసార్లు’గా అనువదించాం.
- source_word: ἀλλὰ
  choice: ; ... అని
  rationale: గ్రీకులోని వ్యతిరేక భావాన్ని తెలుగు వాక్య నిర్మాణంలో మొదటి వాక్యంలోని నిషేధానికి ఎదురుగా రెండవ వాక్యాన్ని ఉంచి సహజంగా వ్యక్తం చేశాం.
- source_word: ἑβδομηκοντάκις ἑπτά
  choice: డెబ్బై ఏడుసార్లు
  rationale: ఈ గ్రీకు పదబంధానికి ‘డెబ్బై ఏడుసార్లు’ (77) లేదా ‘ఏడుకు డెబ్బై రెట్లు’ (490) అనే రెండు పఠనాలు సాధ్యం. ప్రధాన పాఠ్యంలో 77ను తీసుకుని, మరో పఠనాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: క్షమాపణ బోధలోని అస్పష్ట సంఖ్యా పదబంధం
  choice: డెబ్బై ఏడుసార్లు
  alternative: ఏడుకు డెబ్బై రెట్లు, అంటే 490 సార్లు
  rationale: ἑβδομηκοντάκις ἑπτά అనే గ్రీకు పదబంధం రెండు విధాలుగా అర్థమవుతుంది. ప్రధాన పాఠ్యంలో 77 అనే పఠనాన్ని ఎంచుకున్నా, వేరొక పురాతనమైన పఠనాన్ని పాదసూచికలో ఇచ్చి మూలంలోని అస్పష్టతను దాచలేదు. ఈ సంఖ్యకు మించిన వ్యాఖ్యానాన్ని వాక్యంలో చేర్చలేదు.
translation_notes:
  register: సామాన్య పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగును, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ శైలిని ఉపయోగించాం. మూలంలోని సంఖ్యా అస్పష్టతను పాదసూచిక ద్వారా భద్రపరిచాం.
