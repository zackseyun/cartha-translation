  naturalness: ‘ఏడుసార్ల వరకు అని నేను నీతో చెప్పడం లేదు; ... అని చెబుతున్నాను’ అర్థమయ్యేదే అయినా, ‘కానీ’ లేకపోవడం వల్ల సంభాషణలోని సవరణాత్మక వ్యతిరేకత కొద్దిగా అసహజంగా ఉంది. సవరించిన వాక్యం ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
