id: MAT.18.27
reference: Matthew 18:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that servant[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: te
  text: అప్పుడు ఆ బానిసకు యజమాని[a] కనికరపడి, అతన్ని విడుదల చేసి, అతని రుణాన్ని[b] మాఫీ చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులోని κύριος అనే పదానికి ‘ప్రభువు’ లేదా ‘యజమాని’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ అది ఉపమానంలోని మానవ యజమానిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మూల గ్రీకు పదం సాధారణ బాకీ కంటే ప్రత్యేకంగా అప్పుగా ఇచ్చినదాన్ని, అంటే రుణాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: కనికరపడి
  rationale: లోతైన జాలి, కరుణ కలగడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ కథనంలోని తదుపరి పరిణామాన్ని సూచిస్తుంది; యాంత్రికంగా ‘కాని’ అని అనువదించదు.
- source_word: κύριος
  choice: యజమాని
  rationale: ఉపమానంలోని మానవ అధిపతిని సూచిస్తుంది. ‘ప్రభువు’ అని అనువదిస్తే నేరుగా దేవుణ్ణి సూచిస్తున్నట్లు అపార్థం కలగవచ్చు.
- source_word: δοῦλου
  choice: బానిస
  rationale: యాజమాన్యానికి లోబడిన స్థితిని స్పష్టంగా చూపిస్తుంది; ‘సేవకుడు’ కంటే మూలపదంలోని సామాజిక అసమానతను బాగా నిలుపుతుంది.
- source_word: ἀπέλυσεν αὐτόν
  choice: అతన్ని విడుదల చేసి
  rationale: అతన్ని నిర్బంధం లేదా తక్షణ బాధ్యత నుంచి వెళ్లనిచ్చాడనే భావాన్ని అతిగా వివరించకుండా తెలుపుతుంది.
- source_word: τὸ δάνειον
  choice: అతని రుణాన్ని
  rationale: δάνειον ప్రత్యేకంగా ఇచ్చిన అప్పు లేదా రుణాన్ని సూచిస్తుంది; ‘రుణం’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆర్థిక సందర్భాన్ని నిలుపుతుంది.
- source_word: ἀφῆκεν αὐτῷ
  choice: మాఫీ చేశాడు
  rationale: ఆర్థిక బాకీని రద్దు చేయడాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ఈ సందర్భంలో ἀφίημι యొక్క క్షమించడం/విడిచిపెట్టడం అనే భావాన్ని కార్యాత్మకంగా అందిస్తుంది.
theological_decisions:
- issue: κύριος అనే పదాన్ని దైవ బిరుదుగా అతిగా చదివే అవకాశం
  choice: మానవ ‘యజమాని’గా అనువదించడం
  alternative: ప్రభువు
  rationale: తక్షణ కథనంలో ఇతడు బానిసకు యజమాని. ఉపమానం దేవునితో కలిగించే విస్తృత పోలికను అనువాదంలో నేరుగా సమానీకరించలేదు.
- issue: δοῦλος యొక్క సామాజిక స్థితి
  choice: బానిస
  alternative: సేవకుడు / దాసుడు
  rationale: అధికారం, యాజమాన్యం, అప్పు ప్రధానమైన ఈ సందర్భంలో బంధితమైన దిగువ స్థితి ప్రాముఖ్యమైనది.
- issue: ἀφίημι లోని క్షమాపణ మరియు ఆర్థిక రద్దు భావాలు
  choice: రుణాన్ని మాఫీ చేశాడు
  alternative: రుణాన్ని క్షమించాడు
  rationale: ఆర్థిక సందర్భంలో సహజమైన తెలుగును ఎంచుకుంది; అదే సమయంలో ఉపమానంలోని క్షమాపణ ప్రతిధ్వనిని సందర్భం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘బానిస’ మూలంలోని సామాజిక స్థితిని స్పష్టంగా ఉంచుతుంది; ‘మాఫీ చేశాడు’ ఆర్థిక సందర్భంలో సాధారణ పాఠకునికి వెంటనే అర్థమయ్యే ప్రయోగం.
