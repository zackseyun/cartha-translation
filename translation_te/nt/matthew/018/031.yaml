id: MAT.18.31
reference: Matthew 18:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow servants saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: te
  text: అందువల్ల అతని తోటి దాసులు[a] జరిగినదాన్ని చూసి ఎంతో దుఃఖపడ్డారు. వారు తమ యజమాని[b] వద్దకు వచ్చి, జరిగినదంతా ఆయనకు వివరంగా తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తోటి సేవకులు.’ గ్రీకు పదం σύνδουλοι అంటే అక్షరార్థంగా ఒకే యజమాని కింద ఉన్న ‘తోటి దాసులు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ప్రభువు.’ గ్రీకు κύριος పదం సందర్భానుసారం ‘యజమాని,’ ‘ప్రభువు’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: అప్పుడు
  rationale: ఈ సందర్భంలో ఇది ముందటి సంఘటనను అనుసరించే కథన పురోగతిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: σύνδουλοι
  choice: తోటి దాసులు
  rationale: ఈ పదం ఒకే యజమాని కింద దాసులుగా ఉన్నవారిని సూచిస్తుంది. ఉపమానంలోని బంధిత సేవా స్థితిని నిలుపుకోవడానికి ‘తోటి దాసులు’ అని అనువదించాం.
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: జరిగినదాన్ని / జరిగినదంతా
  rationale: γίνομαι యొక్క నామవాచకార్థక కృదంతానికి సహజమైన తెలుగు రూపాలు ఇవి; రెండవ సందర్భంలోని πάντα భావాన్ని ‘అంతా’ నిలుపుతుంది.
- source_word: ἐλυπήθησαν σφόδρα
  choice: ఎంతో దుఃఖపడ్డారు
  rationale: λυπέω తెలిపే దుఃఖాన్ని, σφόδρα తెలిపే తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐλθόντες
  choice: దగ్గరికి వచ్చి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన కదలికను తెలిపే కృదంతాన్ని తెలుగులో సహజమైన పూర్వకాల క్రియారూపంతో ఇచ్చాం; యజమాని సన్నిధికి రావడం సందర్భానికి సరిపోతుంది.
- source_word: διεσάφησαν
  choice: వివరంగా తెలియజేశారు
  rationale: ఈ క్రియ కేవలం చెప్పడమే కాక విషయాన్ని స్పష్టంగా లేదా పూర్తిగా నివేదించడాన్ని సూచిస్తుంది; ‘వివరంగా తెలియజేశారు’ ఆ భావాన్ని నిలుపుతుంది.
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: తమ యజమానికి
  rationale: ఇక్కడ κύριος ఉపమానంలోని మానవ అధిపతిని సూచిస్తుంది. ఆ సంబంధాన్ని తెలుగులో ‘యజమాని’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని σύνδουλοι పదంలో దాస్యస్థితిని ఎలా వ్యక్తం చేయాలి
  choice: తోటి దాసులు
  alternative: తోటి సేవకులు
  rationale: సేవ చేస్తున్నవారనే సాధారణ భావం మాత్రమే కాక, ఒకే యజమాని అధీనంలో ఉన్న దాస్యస్థితి కూడా మూలపదంలో ఉంది. అందువల్ల దాన్ని మృదువుగా మార్చకుండా ‘తోటి దాసులు’ అని ఇచ్చాం.
- issue: మానవ అధిపతిని సూచించే κύριος పదాన్ని ఎలా అనువదించాలి
  choice: యజమాని
  alternative: ప్రభువు
  rationale: ఈ వచనంలో దైవిక బిరుదును ముందుగానే ఆపాదించకుండా, ఉపమానంలోని మానవ దాసయజమాని సంబంధాన్ని ‘యజమాని’ స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, కథనానికి తగిన గౌరవప్రదమైన కానీ సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘దాసులు’ అనే పదం మూలంలోని సామాజిక స్థితిని నిలుపుతుంది; ‘వివరంగా తెలియజేశారు’ అనే రూపం διεσάφησαν యొక్క సంపూర్ణ నివేదిక భావాన్ని వ్యక్తం చేస్తుంది.
