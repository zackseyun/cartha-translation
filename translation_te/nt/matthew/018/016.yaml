  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: te
  text: అయితే అతడు నీ మాట వినకపోతే, నీతో పాటు ఇంకొకరిని లేదా ఇద్దరిని తీసుకువెళ్లు; తద్వారా ఇద్దరు లేదా ముగ్గురు సాక్షుల నోటి ద్వారా[a] ప్రతి విషయం స్థిరపరచబడేలా చేయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ద్వితీయోపదేశకాండము 19:15లోని న్యాయసూత్రానికి ఇది సూచన. భావానువాదం: “ఇద్దరు లేదా ముగ్గురు సాక్షుల సాక్ష్యం మీద ప్రతి విషయం నిర్ధారించబడుతుంది.”'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: నీ మాట వినకపోతే
  rationale: సందర్భంలో ఇది కేవలం శబ్దం వినడం కాక, చెప్పిన మాటను ఆలకించి అంగీకరించడం లేదా పట్టించుకోవడం అనే భావాన్ని ఇస్తుంది. సహజమైన తెలుగులో ‘నీ మాట వినకపోతే’ ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: παράλαβε μετὰ σοῦ
  choice: నీతో పాటు ... తీసుకువెళ్లు
  rationale: παράλαβε అనే ఆజ్ఞారూపం మరియు μετὰ σοῦలోని సహచర్య భావం రెండింటినీ సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἔτι ἕνα ἢ δύο
  choice: మరొకరిని లేదా ఇద్దరిని
  rationale: ἔτι అదనంగా తీసుకువెళ్లే వ్యక్తులను సూచిస్తుంది. ‘మరొకరిని లేదా ఇద్దరిని’ అని చెప్పడం వక్తకు తోడుగా ఇంకా ఒకరు లేదా ఇద్దరు అనే అర్థాన్ని ఇస్తుంది.
- source_word: ἵνα
  choice: అప్పుడు
  rationale: గ్రీకు పదం ఉద్దేశం లేదా ఫలితాన్ని పరిచయం చేస్తుంది. ముందు ఇచ్చిన ఆజ్ఞకు అనుసరించే లక్ష్యాన్ని తెలుగులో సహజంగా కలుపుతుంది.
- source_word: ἐπὶ στόματος
  choice: నోటి ద్వారా
  rationale: ద్వితీయోపదేశకాండము 19:15ను ప్రతిధ్వనించే సెమిటిక్ న్యాయపరమైన నుడికారాన్ని నిలుపుతుంది; తెలుగులోనూ అర్థమయ్యే రూపం.
- source_word: μαρτύρων
  choice: సాక్షుల
  rationale: న్యాయపరమైన సందర్భానికి సరిపోయే సాధారణ, స్పష్టమైన పదం.
- source_word: σταθῇ
  choice: స్థిరపరచబడుతుంది
  rationale: న్యాయపరమైన సందర్భంలో ఒక విషయం సాక్ష్యంతో స్థాపించబడడం లేదా నిర్ధారించబడడం అనే భావాన్ని తెలియజేస్తుంది; కర్త తెలియని కర్మణి రూపాన్ని కూడా నిలుపుతుంది.
- source_word: πᾶν ῥῆμα
  choice: ప్రతి విషయం
  rationale: అక్షరార్థమైన ‘ప్రతి మాట’ కంటే, ద్వితీయోపదేశకాండపు న్యాయసూత్రంలో పరిశీలనలో ఉన్న ప్రతి విషయం లేదా వ్యవహారం అనే భావం ఇక్కడ తగినది.
theological_decisions:
- issue: పాత నిబంధన న్యాయసూత్రానికి సూచన మరియు సంఘ క్రమశిక్షణ సందర్భం
  choice: ‘ఇద్దరు లేదా ముగ్గురు సాక్షుల నోటి ద్వారా ప్రతి విషయం స్థిరపరచబడుతుంది’ అని న్యాయపరమైన బలాన్ని, బైబిలు నుడికారాన్ని రెండింటినీ నిలిపాం.
  alternative: ‘ఇద్దరు లేదా ముగ్గురు సాక్షుల సాక్ష్యం మీద ప్రతి విషయం నిర్ధారించబడుతుంది’ అని మరింత భావానువాదంగా చెప్పవచ్చు.
  rationale: వాక్యం ద్వితీయోపదేశకాండము 19:15లోని సాక్షుల సూత్రాన్ని సమాజ క్రమశిక్షణకు వర్తింపజేస్తుంది. ‘నోటి ద్వారా’ మూలంలోని రూపకాన్ని నిలుపుతుంది; ‘ప్రతి విషయం’ దానిని కేవలం నేరారోపణకే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని న్యాయపరమైన పాత నిబంధన ప్రతిధ్వనిని చూపేందుకు ఉద్ధరణ రూపం మరియు ‘సాక్షుల నోటి ద్వారా’ అనే నుడికారం ఉంచబడ్డాయి.
