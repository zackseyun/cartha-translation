- from: అయితే అతడు నీ మాట వినకపోతే, నీతో పాటు మరొకరిని లేదా ఇద్దరిని తీసుకువెళ్లు. అప్పుడు ‘ఇద్దరు లేదా ముగ్గురు సాక్షుల నోటి ద్వారా ప్రతి విషయం స్థిరపరచబడుతుంది.’[a]
