id: MAT.18.21
reference: Matthew 18:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: te
  text: 'అప్పుడు పేతురు ఆయన దగ్గరకు వచ్చి ఇలా అన్నాడు: “ప్రభువా, నా సోదరుడు[a] నాకు వ్యతిరేకంగా ఎన్నిసార్లు పాపం చేస్తే, నేను అతనిని క్షమించాలి? ఏడు సార్ల వరకా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా సోదరుడు లేదా సహోదరి.” గ్రీకులో “నా సోదరుడు” అని పుంలింగ ఏకవచనంలో ఉంది; సందర్భంలో ఇది తోటి శిష్యుణ్ణి సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: కథనంలోని కాలక్రమ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: προσελθὼν αὐτῷ
  choice: ఆయన దగ్గరకు వచ్చి
  rationale: పేతురు యేసును సమీపించి మాట్లాడిన చర్యను సహజంగా వ్యక్తం చేస్తుంది; సర్వనామం సందర్భంలో యేసును సూచిస్తుంది.
- source_word: ὁ Πέτρος εἶπεν
  choice: పేతురు ఇలా అన్నాడు
  rationale: εἶπεν అనే సాధారణ వాక్కు క్రియను నేరుగా నిలుపుతూ, తరువాతి ప్రత్యక్ష సంభాషణకు తెలుగు సహజత్వం కోసం ‘ఇలా’ వాడబడింది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: గౌరవసూచక ప్రత్యక్ష సంబోధనను, అలాగే దీనిలో ఉండగల ధార్మిక ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: ποσάκις
  choice: ఎన్నిసార్లు
  rationale: తరువాత పేర్కొన్న సంఖ్యాత్మక పరిమితికి అనుగుణంగా పునరావృతాల సంఖ్యను స్పష్టంగా సూచిస్తుంది.
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: నాకు విరోధంగా ... పాపం చేస్తే
  rationale: εἰς ἐμέ యొక్క లక్ష్యార్థాన్ని ‘నాకు విరోధంగా’గా తెలియజేస్తుంది. గ్రీకు భవిష్యత్ రూపాన్ని తెలుగులో పునరావృతమయ్యే ఊహాత్మక పరిస్థితికి సహజమైన షరతు నిర్మాణంతో అందించింది.
- source_word: ὁ ἀδελφός μου
  choice: నా సహోదరుడు
  rationale: గ్రీకు పుంలింగ ఏకవచన రూపాన్ని ప్రధాన పాఠ్యంలో కాపాడుతుంది; సందర్భంలో విస్తృత శిష్యసమూహాన్ని సూచించే అవకాశం పాదటీపులో ఉంచబడింది.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: నేను అతన్ని క్షమించాలి
  rationale: ἀφίημι యొక్క నైతిక సందర్భార్థమైన క్షమాపణను స్పష్టంగా ఇస్తుంది. ప్రశ్న యొక్క ఉద్దేశాన్ని సహజ తెలుగులో తెలియజేయడానికి విధ్యర్థక ‘క్షమించాలి’ వాడబడింది.
- source_word: ἕως ἑπτάκις
  choice: ఏడు సార్ల వరకా?
  rationale: పేతురు ప్రతిపాదించిన గరిష్ఠ పరిమితిని సంక్షిప్తంగా, సహజంగా కాపాడుతుంది.
theological_decisions:
- issue: సందర్భంలో ἀδελφός యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘నా సహోదరుడు’
  alternative: ‘నా సహోదరుడు లేదా సహోదరి’; ‘తోటి శిష్యుడు’
  rationale: మూల గ్రీకు పుంలింగ ఏకవచనంలో ఉంది. అది సందర్భంలో తోటి శిష్యులను విస్తృతంగా సూచించవచ్చు; అయితే ఆ విస్తరణను ప్రధాన పాఠ్యంలో నిశ్శబ్దంగా చేర్చకుండా పాదటీపులో తెలియజేయడం మూలరూపాన్నీ సందర్భసాధ్యతనూ రెండింటినీ కాపాడుతుంది.
- issue: భవిష్యత్ సూచక క్రియల తెలుగు రూపాంతరం
  choice: ‘పాపం చేస్తే నేను ... క్షమించాలి?’ అనే సహజ ప్రశ్నారూపం
  alternative: ‘పాపం చేస్తాడు, నేను అతన్ని క్షమిస్తాను?’
  rationale: గ్రీకులో రెండు భవిష్యత్ సూచక క్రియలు ఉన్నప్పటికీ, తెలుగులో వాటిని యథారూపంగా కలిపితే ప్రశ్న కృత్రిమంగా లేదా అస్పష్టంగా వినిపిస్తుంది. షరతు-విధ్యర్థక నిర్మాణం పేతురు అడిగిన క్షమాపణ పరిమితిని స్పష్టంగా తెలియజేస్తుంది; భావాన్ని సిద్ధాంతపరంగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్య గౌరవం మరియు మూలంలోని ప్రశ్నాత్మక ఉద్వేగం నిలిచేలా రూపొందించబడింది.
