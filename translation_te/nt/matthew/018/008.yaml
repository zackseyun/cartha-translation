id: MAT.18.8
reference: Matthew 18:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: te
  text: నీ చెయ్యి గాని నీ కాలు గాని నిన్ను తడబడేలా చేస్తే[a], దానిని నరికి నీ నుండి దూరంగా పారవేయి. రెండు చేతులు లేదా రెండు కాళ్లు ఉండి నిత్యాగ్నిలో పడవేయబడడం కంటే, అవయవం లేనివాడివై లేదా కుంటివాడివై జీవంలోకి ప్రవేశించడం నీకు మేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిన్ను పాపం చేయించేలా చేస్తే.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘తడబడేలా చేస్తే’ అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: నిన్ను తడబడేలా చేస్తే
  rationale: గ్రీకు పదంలోని ‘తడబడేలా చేయడం’ అనే రూపకాన్ని నిలుపుతూ, సందర్భంలోని పాపానికి దారితీయడం అనే భావాన్ని పాదటిప్పణిలో సూచిస్తుంది.
- source_word: ἔκκοψον
  choice: దాన్ని నరికి
  rationale: ఆజ్ఞలోని తీవ్రతను, చెయ్యి లేదా కాలును తెగనరకడం అనే స్పష్టమైన చిత్రాన్ని కాపాడుతుంది.
- source_word: βάλε ἀπὸ σοῦ
  choice: నీ దగ్గర నుంచి పారవేయి
  rationale: బలంగా తొలగించి తనకు దూరం చేయడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καλόν σοί ἐστιν
  choice: నీకు మేలు
  rationale: ἢతో ఏర్పడిన పోలికలో καλόν ‘మేలు’ అనే తులనాత్మక భావాన్ని ఇస్తుంది.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: జీవంలో ప్రవేశించడం
  rationale: మూలంలో ఉన్న ‘జీవం’ అనే పదాన్నే ఉంచి, దాని అంత్యకాల సంబంధమైన భావాన్ని సందర్భం ద్వారా గ్రహించనిస్తుంది.
- source_word: κυλλὸν
  choice: అవయవం కోల్పోయినా
  rationale: చెయ్యి లేదా కాలు నరికివేయబడిన తక్షణ సందర్భానికి సరిపోయేలా అవయవ నష్టాన్ని స్పష్టంగా తెలియజేస్తుంది; విస్తృతమైన లేదా అవమానకరమైన పదాన్ని నివారిస్తుంది.
- source_word: χωλόν
  choice: కుంటివాడివైనా
  rationale: కాలు లేదా నడకకు సంబంధించిన χωλός భావానికి నేరుగా సరిపోయే సహజ తెలుగు ప్రయోగం.
- source_word: βληθῆναι
  choice: పడవేయబడడం
  rationale: గ్రీకు నిష్క్రియార్థక క్రియను అలాగే నిలుపుతూ తీర్పు యొక్క బలమైన చిత్రాన్ని వ్యక్తం చేస్తుంది.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: నిత్యాగ్ని
  rationale: ఈ తీర్పు సందర్భంలో αἰώνιοςకు సహజమైన ‘నిత్య’ భావాన్ని సంక్షిప్తంగా, గంభీరంగా అందిస్తుంది.
theological_decisions:
- issue: σκανδαλίζειను నేరుగా పాపం చేయించడం అని అనువదించాలా, లేక తడబడే రూపకాన్ని నిలుపాలా
  choice: నిన్ను తడబడేలా చేస్తే
  alternative: నిన్ను పాపం చేయిస్తే
  rationale: మూల గ్రీకులోని రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; నైతిక భావాన్ని పాదటిప్పణి స్పష్టం చేస్తుంది.
- issue: εἰς τὴν ζωὴνలోని ‘జీవం’ను ‘నిత్యజీవం’గా విస్తరించాలా
  choice: జీవంలో ప్రవేశించడం
  alternative: నిత్యజీవంలో ప్రవేశించడం
  rationale: సందర్భానికి అంత్యకాల భావం ఉన్నప్పటికీ, మూలంలో లేని ‘నిత్య’ అనే పదాన్ని ఇక్కడ చేర్చకుండా గ్రీకు పాఠ్యాన్ని అనుసరిస్తుంది.
- issue: శరీర అవయవాన్ని నరికివేయమనే ఆజ్ఞను అలంకారార్థంగా వివరించాలా
  choice: ఆజ్ఞను దాని తీవ్రతతో యథాతథంగా అనువదించడం
  alternative: తీవ్రమైన పశ్చాత్తాపానికి రూపకంగా వివరిస్తూ మృదువుగా చెప్పడం
  rationale: ఈ మాట అతిశయోక్తా కాదా అనే వ్యాఖ్యాన నిర్ణయాన్ని పాఠ్యంలో చొప్పించకుండా, మూలంలోని ఉద్దేశపూర్వక తీవ్రతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో నేరుగా సంబోధించే, గంభీరమైన శైలిని వాడింది. ‘జీవం,’ ‘నిత్యాగ్ని’ వంటి సంక్షిప్త పదాలు మూలంలోని ధార్మిక ఉద్వేగాన్ని నిలుపుతాయి; ఆజ్ఞ యొక్క కఠినతను మృదువుచేయలేదు.
