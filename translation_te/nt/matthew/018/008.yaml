  to: నీ చెయ్యి గాని నీ కాలు గాని నిన్ను తడబడేలా చేస్తే[a], దానిని నరికి నీ నుండి దూరంగా పారవేయి. రెండు చేతులు లేదా రెండు కాళ్లు ఉండి నిత్యాగ్నిలో పడవేయబడడం కంటే, అవయవం లేనివాడివై లేదా కుంటివాడివై జీవంలోకి ప్రవేశించడం నీకు మేలు.
  rationale: The revision preserves the Greek metaphor and severity while improving the personal contrast between κυλλός and χωλός. It also makes the separation inherent in βάλε ἀπὸ σοῦ and the directional sense of εἰς more natural in modern standard Telugu. No interpretive resolution of the stark command has been added.
