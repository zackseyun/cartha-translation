id: MAT.18.10
reference: Matthew 18:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: te
  text: ఈ చిన్నవారిలో ఒక్కరినైనా తృణీకరించకుండా ఉండేందుకు జాగ్రత్తపడండి.[a] ఎందుకంటే, పరలోకంలో[c] ఉన్న వారి దూతలు[b] పరలోకంలో ఉన్న నా తండ్రి ముఖాన్ని ఎల్లప్పుడూ చూస్తుంటారని మీతో చెబుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చిన్నచూపు చూడకుండా’.
    reason: lexical_alternative
  - marker: b
    text: ‘వారి దూతలు’ అనేది ఈ చిన్నవారితో సంబంధమున్న లేదా వారికి ప్రాతినిధ్యం వహించే దూతలను సూచించవచ్చు. వ్యక్తిగత సంరక్షక దూతల గురించిన పూర్తి సిద్ధాంతాన్ని ఈ వచనం ఒక్కటే నిర్ధారించదు.
    reason: alternative_reading
  - marker: c
    text: ఇక్కడ, అలాగే తరువాత ‘నా తండ్రి’ గురించి చెప్పిన చోట, గ్రీకులో అక్షరార్థంగా ‘పరలోకాలలో’ అని ఉంది; తెలుగులో సహజంగా ‘పరలోకంలో’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: జాగ్రత్తపడండి
  rationale: వర్తమాన ఆజ్ఞార్థక రూపం హెచ్చరికతో కూడిన అప్రమత్తతను సూచిస్తుంది. తెలుగులో ‘జాగ్రత్తపడండి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μὴ καταφρονήσητε
  choice: తృణీకరించకుండా
  rationale: Ὁρᾶτεతో కలిసి ఇది నిషేధాత్మక హెచ్చరికను రూపొందిస్తుంది. καταφρονέωలో ఉన్న చిన్నచూపు చూడటం, విలువలేనివారిగా ఎంచటం అనే గంభీర భావాన్ని ‘తృణీకరించు’ నిలుపుతుంది.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: ఈ చిన్నవారిలో ఒక్కరినైనా
  rationale: ఈ పదబంధం వయస్సులో చిన్న పిల్లలకే పరిమితం కావచ్చు అని నిర్ధారించకుండా, హోదాలో లేదా ప్రాముఖ్యంలో చిన్నవారిని కూడా సూచించగల గ్రీకు విస్తృతిని నిలుపుతుంది.
- source_word: λέγω γὰρ ὑμῖν
  choice: ఎందుకంటే ... మీతో చెబుతున్నాను
  rationale: γάρ ఇచ్చే వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో, సాధారణ ప్రకటన సూత్రాన్ని సహజమైన తెలుగు ‘మీతో చెబుతున్నాను’తో వ్యక్తం చేశాం.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: వారి దూతలు
  rationale: గ్రీకు స్వామ్య సంబంధాన్ని నేరుగా నిలుపుతూ, వ్యక్తిగత సంరక్షక దూతల సిద్ధాంతాన్ని అనువాదంలో అదనంగా చేర్చలేదు.
- source_word: ἐν οὐρανοῖς
  choice: పరలోకంలో
  rationale: గ్రీకులో బహువచనం ఉన్నప్పటికీ, ఈ స్థలసూచక ప్రయోగానికి ఆధునిక తెలుగులో ఏకవచన ‘పరలోకంలో’ సహజం.
- source_word: διὰ παντὸς
  choice: ఎల్లప్పుడూ
  rationale: ఈ నుడికారం నిరంతరంగా లేదా అన్ని వేళలా అనే భావాన్ని ఇస్తుంది; ‘ఎల్లప్పుడూ’ స్పష్టమైన, సహజమైన తెలుగు రూపం.
- source_word: βλέπουσι τὸ πρόσωπον
  choice: ముఖాన్ని ... చూస్తుంటారు
  rationale: దేవుని ప్రత్యక్ష సన్నిధి లేదా రాజసభలో ప్రవేశం అనే బైబిలు చిత్రణను అక్షరార్థానికి దగ్గరగా నిలుపుతుంది; కొనసాగుతున్న వర్తమాన భావాన్ని ‘చూస్తుంటారు’ తెలియజేస్తుంది.
- source_word: τοῦ πατρός μου
  choice: నా తండ్రి
  rationale: యేసు పలికిన స్పష్టమైన స్వామ్యాన్ని, ఆయన ప్రత్యేక పుత్ర సంబంధ భాషను యథాతథంగా నిలుపుతుంది.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: పరలోకంలో ఉన్న
  rationale: ‘నా తండ్రి’ని విశేషించే స్థలసూచక పదబంధాన్ని సహజమైన తెలుగు క్రమంలో అందిస్తుంది.
theological_decisions:
- issue: ‘వారి దూతలు’ అనే పదబంధం యొక్క అర్థం
  choice: ‘వారి దూతలు’ అని నేరుగా ఉంచి, ప్రతి వ్యక్తికీ ప్రత్యేకంగా నియమించబడిన సంరక్షక దూత ఉన్నాడని నిర్ధారించలేదు.
  alternative: ప్రతి చిన్నవానికి లేదా విశ్వాసికి ఒక వ్యక్తిగత సంరక్షక దూత ఉన్నాడని స్పష్టంగా వ్యాఖ్యానించడం; లేదా వీరికి సేవచేసే లేదా వీరికి ప్రాతినిధ్యం వహించే దూతలను సాధారణంగా సూచించడంగా భావించడం.
  rationale: గ్రీకు పాఠం సంబంధాన్ని మాత్రమే ‘వారి దూతలు’ అని పేర్కొంటుంది; ఆ దూతల నియామక విధానాన్ని లేదా పూర్తి దూతశాస్త్ర సిద్ధాంతాన్ని నిర్వచించదు. అందువల్ల అసలు పాఠంలోని వేదాంతపరమైన ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే యేసు హెచ్చరిక యొక్క గంభీరతను మరియు ‘తండ్రి ముఖాన్ని చూడటం’ అనే బైబిలు చిత్రణను నిలుపుతూ రూపొందించబడింది.
