review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the rhetorical question, the moral obligation in οὐκ ἔδει, the comparative ὡς, the additive force of καί/κἀγώ, and σύνδουλος as ‘తోటి దాసుడు.’ It also retains the repetition of mercy language.
  naturalness: ‘కనికరించవలసి ఉండలేదా?’ is understandable, but ‘కనికరం చూపవలసి ఉండలేదా?’ is more idiomatic modern standard Telugu and more naturally takes the person receiving mercy with ‘మీద.’
  terminology: ‘తోటి దాసుడు’ appropriately preserves the shared subordinate/slave status signaled by σύνδουλος. ‘కనికరం చూపు’ is a clear, register-appropriate rendering of ἐλεάω and can be repeated in both clauses.
  issues:
  - severity: low
    issue: Verb collocation is slightly less idiomatic in the draft.
    rationale: Although ‘కనికరించు’ is intelligible, contemporary Telugu more commonly uses ‘కనికరం చూపు’ in this ethical and interpersonal sense; this also gives a smooth parallel in both clauses.
  revised_text: నేను నీ మీద కనికరం చూపినట్లే, నువ్వు కూడా నీ తోటి దాసుని మీద కనికరం చూపవలసి ఉండలేదా?
  revised_footnotes: []
  revision_rationale: The revision changes only the mercy-verb collocation for natural modern Telugu. It preserves the source’s rebuking question, obligation, repeated mercy vocabulary, comparison, and ‘fellow slave’ sense.
