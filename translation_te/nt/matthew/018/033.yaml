revisions:
- from: నేను నీ మీద కనికరించినట్లే, నువ్వు కూడా నీ తోటి దాసుని మీద కనికరించవలసి ఉండలేదా?
  to: నేను నీ మీద కనికరం చూపినట్లే, నువ్వు కూడా నీ తోటి దాసుని మీద కనికరం చూపవలసి ఉండలేదా?
  rationale: The revision changes only the mercy-verb collocation for natural modern Telugu. It preserves the source’s rebuking question, obligation, repeated mercy vocabulary, comparison, and ‘fellow slave’ sense.
