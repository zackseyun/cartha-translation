id: MAT.18.33
reference: Matthew 18:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow servant[a], as I also had mercy on you?
translation:
  language: te
  text: నేను నీ మీద కనికరం చూపినట్లే, నువ్వు కూడా నీ తోటి దాసుని మీద కనికరం చూపవలసి ఉండలేదా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: కనికరించవలసి ఉండలేదా?
  rationale: ἔδει తెలిపే నైతిక బాధ్యతను, గద్దింపు ధ్వనిగల అలంకారప్రశ్న రూపంలో సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: రాజు ముందుగా చూపిన కనికరానికి ప్రతిస్పందనగా దాసుడు అలాగే చేయవలసిన సమాంతర భావాన్ని నిలుపుతుంది.
- source_word: ἐλεῆσαι / ἠλέησα
  choice: కనికరించు / కనికరించాను
  rationale: రెండు గ్రీకు క్రియారూపాల్లోని పదపునరుక్తిని తెలుగులోనూ ఒకే క్రియతో నిలిపి, కేవలం జాలిపడటం కంటే దయతో వ్యవహరించే భావాన్ని అందిస్తుంది.
- source_word: τὸν σύνδουλόν σου
  choice: నీ తోటి దాసుని
  rationale: σύν- సూచించే ఒకే యజమాని కింద ఉన్న సహస్థితిని ‘తోటి’ తెలియజేస్తుంది; ఉపమానంలోని ఆధీన స్థితిని ‘దాసుడు’ నిలుపుతుంది.
- source_word: ὡς κἀγὼ
  choice: నేను ... చేసినట్లే
  rationale: ὡς తెలిపే పోలికను సహజంగా వ్యక్తపరుస్తుంది; గ్రీకులోని καί భావం తెలుగు వాక్యంలోని ‘కూడా’ మరియు సమాంతర నిర్మాణం ద్వారా స్పష్టమవుతుంది.
theological_decisions:
- issue: σύνδουλος లోని δοῦλος పదకుటుంబాన్ని ఎలా అనువదించాలి
  choice: తోటి దాసుడు
  alternative: తోటి సేవకుడు
  rationale: రాజు, అప్పు, అతని అధికారానికి లోబడినవారు అనే ఉపమాన సందర్భంలో ఆధీనత ప్రధానంగా ఉంది. అందువల్ల ‘దాసుడు’ మూలపదంలోని బంధిత/అధీన స్థితిని మృదువుపరచకుండా నిలుపుతుంది; ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని గద్దింపు ధ్వనిగల ప్రశ్నను, కనికరానికి సంబంధించిన పదపునరుక్తిని నిలిపింది.
