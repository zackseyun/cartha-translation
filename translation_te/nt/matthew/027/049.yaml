id: MAT.27.49
reference: Matthew 27:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ λοιποὶ ⸀ἔλεγον· Ἄφες ἴδωμεν εἰ ἔρχεται Ἠλίας σώσων ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: te
  text: అయితే మిగిలినవారు[a], “ఆయన్ని అలాగే వదిలేయి[b]. ఏలీయా ఆయన్ని రక్షించడానికి వస్తున్నాడో లేదో చూద్దాం” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇతరులు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వదిలేయి; ఏలీయా ఆయన్ని రక్షించడానికి వస్తాడేమో చూద్దాం.’ గ్రీకులో ‘వస్తున్నాడు’ అనే వర్తమాన కాల రూపం, ‘వస్తున్నాడో లేదో’ అనే పరోక్ష ప్రశ్నలో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: అయితే మిగిలినవారు
  rationale: δέ సూచించే వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది; λοιποί అనేది ముందుగా మాట్లాడిన వ్యక్తి లేదా వ్యక్తులకు భిన్నంగా అక్కడున్న మిగిలినవారిని సూచిస్తుంది.
- source_word: ἔλεγον
  choice: అన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగిన లేదా పునరావృతమైన మాటను సూచించగలిగినా, ఈ కథన సందర్భంలో సహజమైన తెలుగు వాడుకగా ‘అన్నారు’ సరిపోతుంది; అవసరానికి మించి పునరావృత భావాన్ని చేర్చదు.
- source_word: Ἄφες
  choice: ఆయన్ని అలాగే వదిలేయి
  rationale: ఇది ఏకవచన ఆజ్ఞారూపం. కేవలం ‘వదిలేయి’ అని కాకుండా, సందర్భంలో సూచితమైన యేసును కర్మగా స్పష్టం చేస్తూ, జోక్యం చేసుకోకుండా ఉండమనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἴδωμεν
  choice: చూద్దాం
  rationale: ఇది ప్రథమ పురుష బహువచన ప్రేరణార్థక subjunctive; ‘చూద్దాం’ దాని ప్రత్యక్షమైన, సహజమైన తెలుగు సమానం.
- source_word: εἰ ἔρχεται
  choice: వస్తున్నాడో లేదో
  rationale: εἰ పరోక్ష ప్రశ్నను ప్రవేశపెడుతుంది; ‘వస్తున్నాడో లేదో’ అనిశ్చితిని కాపాడుతుంది. వర్తమాన కాలంలోని ἔρχεται దృశ్యంలోని తక్షణ భావాన్ని ‘వస్తున్నాడు’ ద్వారా నిలుపుతుంది.
- source_word: Ἠλίας
  choice: ఏలీయా
  rationale: ప్రవక్త పేరుకు తెలుగులో స్థిరపడిన బైబిలు రూపం.
- source_word: σώσων αὐτόν
  choice: ఆయన్ని రక్షించడానికి
  rationale: భవిష్యత్ కృదంతమైన σώσων, ἔρχεταιతో కలిసి ఉద్దేశాన్ని తెలియజేస్తుంది. ‘రక్షించడానికి’ తక్షణ శారీరక విమోచన భావాన్నీ, σῴζωతో ఉన్న పదసంబంధాన్నీ కాపాడుతుంది.
theological_decisions:
- issue: సిలువ సందర్భంలో σῴζω పదానికి ఉండగల దైవశాస్త్రీయ ప్రతిధ్వని
  choice: ఆయన్ని రక్షించడానికి
  alternative: ఆయన్ని కాపాడడానికి / విడిపించడానికి
  rationale: మాట్లాడుతున్నవారు సిలువ మరణం నుంచి కనిపించే విధంగా విడిపించడం గురించే మాట్లాడుతున్నారు; నిత్యరక్షణపై సిద్ధాంత ప్రకటన చేయడం లేదు. అయినా ‘రక్షించడానికి’ అనేది σῴζωకు సాధారణ సమానం కావడంతో పాటు శ్రమకథనంలోని వ్యంగ్య ప్రతిధ్వనిని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. యేసును సూచించే సర్వనామానికి గౌరవార్థక రూపమైన ‘ఆయన్ని’ వాడబడింది; మూలంలోని అనిశ్చితి, తక్షణత్వం అలాగే నిలుపబడ్డాయి.
