translation:
  language: te
  text: ప్రభువు నాకు[b] ఆదేశించినట్లే[a], వారు ఆ నాణేలను కుమ్మరి పొలం కోసం ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆదేశించిన’కు బదులుగా ‘ఆజ్ఞాపించిన’ లేదా ‘నిర్దేశించిన’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ ప్రవచన ఉల్లేఖనం/సూచనలో మత్తయి, కథన సందర్భానికి అనుగుణంగా మార్చకుండా, ప్రథమ పురుషంలోని ‘నాకు’ అనే పదాన్ని నిలుపుతున్నాడు.
    reason: cross_reference
lexical_decisions:
- source_word: ἔδωκαν
  choice: ఇచ్చారు
  rationale: δίδωμι క్రియ యొక్క సాధారణ అర్థమైన ‘ఇచ్చారు’ను నిలుపుతుంది; ‘చెల్లించారు’ అనేది సందర్భానుసారమైన మరింత వివరణాత్మక అనువాదం.
- source_word: αὐτὰ
  choice: ఆ నాణేలను
  rationale: నపుంసక బహువచన సర్వనామం ముందున్న వెండి నాణేలను సూచిస్తుంది. తెలుగు వాక్యంలో సూచన స్పష్టంగా ఉండేందుకు నామవాచకాన్ని పునరుక్తి చేశాం.
- source_word: εἰς τὸν ἀγρὸν
  choice: పొలం కోసం
  rationale: కొనుగోలు/ధన వినియోగ సందర్భంలో εἰς ఉద్దేశాన్ని సూచిస్తుంది; ‘పొలంలోకి’ అనే అక్షరార్థం ఇక్కడ సహజం కాదు.
- source_word: τοῦ κεραμέως
  choice: కుమ్మరి
  rationale: κεραμεύς యొక్క షష్ఠీ రూపాన్ని తెలుగులో సహజమైన సంబంధపూర్వక సమాసంగా ‘కుమ్మరి పొలం’ అని ఇచ్చాం.
- source_word: καθὰ
  choice: అట్లే
  rationale: ముందుగా ఇచ్చిన ఆదేశానికి జరిగిన కార్యం సరిగ్గా అనుగుణంగా ఉందనే తులనాత్మక భావాన్ని తెలియజేస్తుంది.
- source_word: συνέταξέν
  choice: ఆదేశించిన
  rationale: συντάσσωలోని అధికారపూర్వక నిర్దేశ భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘ఆజ్ఞాపించిన’ కూడా సాధ్యమే.
- source_word: μοι
  choice: నాకు
  rationale: గ్రీకులోని ప్రథమ పురుష దత్తి సర్వనామాన్ని ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: κύριοςకు సందర్భానుకూలమైన, స్థిరమైన తెలుగు దైవసంబోధన.
theological_decisions:
- issue: ప్రవచన ఉల్లేఖనంలో వక్తను సూచించే ప్రథమ పురుష రూపం
  choice: గ్రీకులో ఉన్న ‘నాకు’ అనే రూపాన్ని యథాతథంగా నిలుపడం
  alternative: కథన సందర్భానికి సరిపడేలా ప్రథమ పురుషాన్ని తొలగించడం లేదా మార్చడం
  rationale: మూలపాఠంలో μοι (‘నాకు’) స్పష్టంగా ఉంది. దాన్ని సవరించడం మత్తయి ఉపయోగించిన ఉల్లేఖనం/సూచనలోని నిజమైన ఉద్రిక్తతను అనువాదంలోనే పరిష్కరించినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని ప్రథమ పురుష సూచనను నిలిపి, సందర్భం వల్ల అవసరమైన ‘నాణేలను’ అనే స్పష్టీకరణను మాత్రమే చేసింది.
