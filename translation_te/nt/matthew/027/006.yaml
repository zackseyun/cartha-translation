id: MAT.27.6
reference: Matthew 27:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: te
  text: అయితే ప్రధాన యాజకులు[a] ఆ వెండి నాణేలను తీసుకొని, “వీటిని దేవాలయ ఖజానాలో[b] వేయడం ధర్మశాస్త్రం ప్రకారం అనుమతించబడదు, ఎందుకంటే ఇవి రక్తపు ధర[c]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ప్రధాన యాజకులు” అంటే యాజకులలో ఉన్నతాధికారులు.
    reason: cultural_clarification
  - marker: b
    text: గ్రీకులో “కొర్బాను” (Corban); ఇది దేవాలయ ఖజానాను లేదా పవిత్ర నిధులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “రక్తధనం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: యాజక అధికారులలో అగ్రస్థానంలో ఉన్నవారిని సూచించే సువార్తల సాధారణ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: λαβόντες
  choice: తీసుకొని
  rationale: ప్రధాన క్రియకు ముందు లేదా దానితో ముడిపడిన చర్యను సహజంగా తెలియజేస్తూ, గ్రీకు ఏఒరిస్ట్ కృదంతాన్ని అతిగా క్రమబద్ధీకరించదు.
- source_word: τὰ ἀργύρια
  choice: ఆ వెండి నాణేలను
  rationale: ముందటి సందర్భంలో ప్రస్తావించిన వెండి చెల్లింపును సూచిస్తుంది; నిర్దిష్ట నాణెం రకాన్ని ఊహించకుండా దాని ధనరూప అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: Οὐκ ἔξεστιν
  choice: ధర్మశాస్త్రం ప్రకారం సమ్మతం కాదు
  rationale: ఇక్కడి నిషేధం సాధారణ అనుమతి కంటే మతపరమైన-న్యాయపరమైన సమ్మతికి సంబంధించినదని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: βαλεῖν
  choice: వేయడం
  rationale: βάλλω యొక్క ప్రాథమిక ‘విసరడం’ భావాన్ని ఈ ఖజానా సందర్భంలో అనవసరంగా బలపరచకుండా, డబ్బును అందులో ఉంచడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κορβανᾶν
  choice: దేవాలయ ఖజానా
  rationale: ఆ పదం సూచించే పవిత్ర దేవాలయ నిధిని సాధారణ పాఠకునికి నేరుగా అర్థమయ్యేలా అనువదిస్తుంది.
- source_word: ἐπεὶ
  choice: కాబట్టి
  rationale: నిషేధానికి కారణాన్ని తెలుగులో సహజమైన కారణార్థక నిర్మాణంతో కలుపుతుంది.
- source_word: τιμὴ αἵματός
  choice: రక్తపు వెల
  rationale: గ్రీకు పదబంధంలోని ‘రక్తం’ మరియు ‘వెల’ అనే రెండు అంశాలను కాపాడి, ‘రక్తధనం’ అనే మరింత నుడికారాత్మక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
theological_decisions:
- issue: κορβανᾶν పదాన్ని లిప్యంతరీకరించాలా, దాని అర్థాన్ని అనువదించాలా
  choice: దేవాలయ ఖజానా
  alternative: కొర్బాను; పవిత్ర నిధి
  rationale: ఈ సందర్భంలో పదం దేవాలయానికి చెందిన పవిత్ర నిధిని సూచిస్తుంది. అర్థానువాదం ఆధునిక పాఠకునికి స్పష్టంగా ఉంటుంది; మూలపదాన్ని పాదటిప్పణి భద్రపరుస్తుంది.
- issue: τιμὴ αἵματός యొక్క రూపక తీవ్రతను ఎలా నిలుపుకోవాలి
  choice: రక్తపు వెల
  alternative: రక్తధనం; రక్తపాతానికి చెల్లించిన వెల
  rationale: ‘రక్తపు వెల’ మూలంలోని సంక్షిప్తతను, ఉద్దేశపూర్వక నైతిక ఉద్రిక్తతను నిలుపుతుంది; ఎవరి రక్తం లేదా ఏ కార్యానికి చెల్లింపో అనువాదంలో అదనంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మతపరమైన-న్యాయపరమైన భావాన్ని ‘ధర్మశాస్త్రం ప్రకారం సమ్మతం కాదు’ అని స్పష్టం చేసి, మూలంలోని వ్యంగ్యభరిత నైతిక ఉద్రిక్తతను వ్యాఖ్యానంతో పరిష్కరించలేదు.
