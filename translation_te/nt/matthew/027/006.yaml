revisions:
- from: అయితే ప్రధాన యాజకులు[a] ఆ వెండి నాణేలను తీసుకొని, “ఇది రక్తపు వెల[b] కాబట్టి వీటిని దేవాలయ ఖజానాలో వేయడం ధర్మశాస్త్రం ప్రకారం సమ్మతం కాదు” అన్నారు.
  to: అయితే ప్రధాన యాజకులు[a] ఆ వెండి నాణేలను తీసుకొని, “వీటిని దేవాలయ ఖజానాలో[b] వేయడం ధర్మశాస్త్రం ప్రకారం అనుమతించబడదు, ఎందుకంటే ఇవి రక్తపు ధర[c]” అన్నారు.
  rationale: The revision replaces an unnatural lexical choice, restores the source-order of the reason clause, and places a Corban note at the treasury term. It retains the concise, deliberately non-specific expression “రక్తపు ధర” and does not identify whose blood or specify the nature of the payment beyond the Greek.
  reviewer_model: gpt-5.6-terra
