  to: అక్కడ చాలామంది స్త్రీలు దూరం నుంచి చూస్తూ ఉన్నారు.[a] వారు గలిలయ నుంచి యేసును అనుసరించినవారు, ఆయనకు సేవ చేస్తూ ఉన్నారు.[b]
