id: MAT.27.55
reference: Matthew 27:55
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: te
  text: అక్కడ చాలామంది స్త్రీలు దూరం నుంచి చూస్తూ ఉన్నారు.[a] వారు గలిలయ నుంచి యేసును అనుసరించినవారు, ఆయనకు సేవ చేస్తూ ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దూరం నుంచి గమనిస్తూ ఉన్నారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆయనకు పరిచర్య చేస్తూ ఉన్నారు.” ఇక్కడి గ్రీకు క్రియ ఆచరణాత్మక సేవను లేదా సహాయాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: అక్కడ ... ఉన్నారు
  rationale: Ἦσαν ... ἐκεῖ అనే ఉనికి-స్థల భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో తెలిపింది. δέ స్వల్ప అనుసంధాన పదం కాబట్టి సందర్భంలో ప్రత్యేక విరోధార్థక పదాన్ని చేర్చలేదు.
- source_word: γυναῖκες πολλαὶ
  choice: చాలామంది స్త్రీలు
  rationale: సంఖ్యా భావాన్నీ, స్త్రీలనే నిర్దిష్ట సూచననూ స్పష్టంగా నిలుపుతుంది.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: దూరం నుంచి చూస్తూ ఉన్నారు
  rationale: దూరంలో ఉండి కొనసాగింపుగా గమనిస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αἵτινες
  choice: వీరు ... చేసినవారు
  rationale: ముందు పేర్కొన్న స్త్రీలను వారి గత అనుసరణ, సేవల ద్వారా గుర్తించే సంబంధవాచక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας
  choice: గలిలయ నుంచి యేసును వెంబడించి
  rationale: గలిలయను ఆరంభ స్థలంగా ఉంచి, ప్రస్తుత సిలువ దృశ్యానికి ముందే జరిగిన అనుసరణను సూచిస్తుంది.
- source_word: διακονοῦσαι αὐτῷ
  choice: ఆయనకు సేవ చేసినవారు
  rationale: διακονέωలోని విస్తృతమైన ఆచరణాత్మక సేవ లేదా సహాయ భావాన్ని నిలుపుతూ, దానిని అధికారిక మతపరమైన పదవిగా పరిమితం చేయదు.
theological_decisions:
- issue: స్త్రీల పాత్రకు సంబంధించి διακονοῦσαι అనువాదం
  choice: ఆయనకు సేవ చేసినవారు
  alternative: ఆయనకు పరిచర్య చేసినవారు
  rationale: ‘సేవ’ ఆచరణాత్మక సహాయం, ఆదరణ వంటి విస్తృత భావాలను అనుమతిస్తుంది; గృహసేవకు మాత్రమే గానీ, అధికారిక సంఘ పరిచర్యకు మాత్రమే గానీ అర్థాన్ని పరిమితం చేయదు.
- issue: గలిలయ నుంచి అనుసరించిన చర్యకూ ప్రస్తుత దృశ్యానికీ మధ్య కాల సంబంధం
  choice: గలిలయ నుంచి యేసును వెంబడించి
  alternative: గలిలయ నుంచి యేసును వెంబడిస్తూ వచ్చి
  rationale: ప్రస్తుత సిలువ దృశ్యానికి ముందు జరిగిన అనుసరణను సూచిస్తూనే, మూలంలో స్పష్టంగా లేని ప్రయాణ విధానాన్ని అతిగా విపులీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘పరిచర్య’ కంటే సాధారణ పాఠకులకు స్పష్టమైన ‘సేవ’ను ప్రధాన పాఠ్యంలో ఎంచుకుని, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
