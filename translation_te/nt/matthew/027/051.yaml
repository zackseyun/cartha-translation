id: MAT.27.51
reference: Matthew 27:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: te
  text: ఇదిగో, దేవాలయపు తెర[a] పైనుంచి కిందివరకు రెండుగా చినిగిపోయింది; భూమి కంపించింది, బండలు చీలిపోయాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆలయ పరిశుద్ధస్థలపు తెర.’ ఇక్కడి గ్రీకు పదబంధం ఆలయంలోని అంతర్గత పరిశుద్ధస్థలపు తెరను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: ఆకస్మికంగా సంభవించిన విషయంపై దృష్టి నిలిపే గంభీరమైన కథన సూచకంగా సహజమైన ఆధునిక తెలుగు పదాన్ని వాడాం.
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: దేవాలయపు తెర
  rationale: καταπέτασμα అనేది ఆలయంలోని వేలాడే తెరను సూచిస్తుంది; ναός ఇక్కడ ప్రత్యేకంగా పరిశుద్ధస్థలాన్ని సూచించగలిగినా, తెలుగులో స్పష్టంగా, సహజంగా ఉండేందుకు ‘దేవాలయపు తెర’ అని ఇచ్చి, మరింత నిర్దిష్టమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐσχίσθη
  choice: చినిగిపోయింది
  rationale: బట్టతో చేసిన తెరకు సహజంగా సరిపోయే క్రియ; గ్రీకు కర్మణి రూపాన్ని అనుసరించి దాన్ని చింపిన కర్తను పేర్కొనలేదు.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο
  choice: పైనుంచి కిందివరకు రెండుగా
  rationale: చీలిక దిశను, తెర రెండు భాగాలైన విషయాన్ని సహజమైన తెలుగు క్రమంలో స్పష్టంగా నిలుపుతుంది.
- source_word: ἡ γῆ ἐσείσθη
  choice: భూమి కంపించింది
  rationale: విశాలమైన ‘భూమి’ అనే భావాన్ని నిలుపుతూ, తెలుగులో సహజమైన కర్తరి వాక్యనిర్మాణాన్ని ఉపయోగించాం.
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: బండలు చీలిపోయాయి
  rationale: భూకంప సందర్భంలో πέτραι సూచించే పెద్ద రాతి గుట్టలు లేదా బండరాళ్లకు ‘బండలు’ సహజం; σχίζω భావాన్ని ‘చీలిపోయాయి’ నిలుపుతుంది.
theological_decisions:
- issue: దేవాలయపు తెర చినగడం యొక్క అర్థం
  choice: సంఘటనను మాత్రమే నేరుగా వర్ణించడం
  alternative: దేవుని సన్నిధికి మార్గం తెరవబడిందని లేదా దేవాలయ వ్యవస్థపై తీర్పు వచ్చిందని వాక్యంలోనే వివరించడం
  rationale: ఈ వచనం సంఘటనను, దానితో కూడిన సూచనలను తెలుపుతుంది గాని వాటి theological అర్థాన్ని స్వయంగా వివరించదు. అందువల్ల అనువాదంలో ఏ నిర్దిష్ట వ్యాఖ్యానాన్నీ చేర్చలేదు.
- issue: చింపిన కర్త
  choice: కర్తను పేర్కొనని ‘చినిగిపోయింది’ అనే రూపం
  alternative: ‘దేవుడు చింపాడు’ అని స్పష్టీకరించడం
  rationale: గ్రీకు పాఠంలో క్రియ కర్మణి రూపంలో ఉంది; కార్యసాధకుడు ప్రత్యక్షంగా పేర్కొనబడలేదు. దైవ కర్మణి అనే సాధ్యమైన అవగాహనను తిరస్కరించకుండానే, దానిని వాక్యంలో బహిర్గతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కథన శైలిని పాటించాం. గ్రీకు వాక్యంలోని వరుస సంఘటనలను సెమికోలన్, కామాతో అనుసంధానించి దాని వేగాన్ని నిలిపాం.
