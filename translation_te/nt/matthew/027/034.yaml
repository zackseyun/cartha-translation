source:
  edition: SBLGNT
  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: te
  text: వారు ఆయనకు పిత్తరసం కలిపిన ద్రాక్షామద్యం తాగడానికి ఇచ్చారు[a]. కానీ ఆయన దానిని రుచి చూసిన తర్వాత తాగడానికి ఇష్టపడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పిత్తరసం’ అని అనువదించిన గ్రీకు పదం χολή విస్తృతంగా చేదైన పదార్థాన్ని కూడా సూచించవచ్చు. మత్తయి ‘పిత్తరసం’ అనే పదాన్ని వాడగా, సంబంధిత కథనమైన మార్కు 15:23లో బోళం ప్రస్తావించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: వారు ఆయనకు ... తాగడానికి ఇచ్చారు
  rationale: δίδωμι అనే క్రియకు నేరమైన అర్థం ‘ఇచ్చారు’; దత్తివాచక సర్వనామం αὐτῷను ‘ఆయనకు’ అని, πιεῖνను ఉద్దేశాన్ని తెలిపే ‘తాగడానికి’ అని సహజమైన తెలుగులో ఇచ్చాం.
- source_word: οἶνον
  choice: ద్రాక్షారసం
  rationale: οἶνος అంటే ద్రాక్షతో చేసిన మద్యపానీయం. ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉండేందుకు ‘ద్రాక్షారసం’ ఎంచుకున్నాం; దీనిని సాధారణ ‘పానీయం’గా అస్పష్టం చేయలేదు.
- source_word: μετὰ χολῆς μεμιγμένον
  choice: చేదు పదార్థం కలిపిన
  rationale: χολή పిత్తరసాన్ని లేదా విస్తృతంగా చేదైన పదార్థాన్ని సూచించగలదు. తెలుగులో ‘గాల్’ అనే అపరిచిత పదాన్ని దిగుమతి చేయకుండా, మూలంలోని నిజమైన అర్థవ్యాప్తిని ‘చేదు పదార్థం’గా ప్రధాన పాఠ్యంలో ఉంచాం; μεμιγμένονను ‘కలిపిన’గా అనువదించాం.
- source_word: καὶ γευσάμενος
  choice: అయితే ఆయన దాన్ని రుచి చూసిన తర్వాత
  rationale: γευσάμενος అంటే ‘రుచి చూసిన తర్వాత/రుచి చూసి’. తరువాతి నిరాకరణతో ఉన్న కథన విరుద్ధతను సహజ తెలుగులో చూపేందుకు καίను ‘అయితే’గా ఇచ్చాం.
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: తాగడానికి ఇష్టపడలేదు
  rationale: θέλωలోని సంకల్పం లేదా ఇష్టానికి సంబంధించిన భావాన్ని కాపాడుతుంది. ‘తిరస్కరించాడు’ అనేది సాధ్యమైన సందర్భార్థమైనా, మూలక్రియ కంటే బలంగా ఉండవచ్చు.
theological_decisions:
- issue: శ్రమానుభవ కథనంలో χολή అర్థం మరియు కీర్తనాత్మక ప్రతిధ్వని
  choice: చేదు పదార్థం
  alternative: పిత్తరసం
  rationale: χολή అక్షరార్థంగా పిత్తరసాన్ని, విస్తృతార్థంగా చేదైన పదార్థాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో ‘చేదు పదార్థం’ పానీయంలో కలిపిన దాని స్వభావాన్ని సహజంగా తెలియజేస్తూ అర్థాన్ని అతిగా నిర్దిష్టం చేయదు; పాదటిప్పణి అక్షరార్థ ప్రత్యామ్నాయాన్ని నిలుపుతుంది. మార్కు 15:23లోని బోళాన్ని ఇక్కడికి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘ఆయన’ ద్వారా సందర్భానికి తగిన గౌరవం నిలుపబడింది. మూలంలోని సంకల్పభావాన్ని అతిగా బలపరచకుండా ‘ఇష్టపడలేదు’ అని ఇచ్చాం.
