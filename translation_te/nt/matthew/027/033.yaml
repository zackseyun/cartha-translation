  text: And when they came to a place called Golgotha (which means Place of a Skull),[a]
translation:
  language: te
  text: వారు గొల్గొతా అనే చోటికి వచ్చారు; అంటే, అది “పుర్రె స్థలం” అని పిలువబడే చోటు.[a]
