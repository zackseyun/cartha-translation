translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. స్థలనామాన్ని లిప్యంతరీకరించి, వెంటనే దాని అర్థాన్ని స్పష్టంగా ఇచ్చాం.
