    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: వచ్చారు
  rationale: గ్రీకు భూతకాల కృదంతం ప్రధాన కథనంతో సహజంగా కలిసేలా తెలుగులో సమాపక క్రియగా అనువదించబడింది.
- source_word: τόπον
  choice: చోటికి
  rationale: τόπος అనే సాధారణ పదానికి సందర్భానుకూలమైన సహజ తెలుగు రూపం.
- source_word: λεγόμενον
  choice: అనే
  rationale: పేరు పెట్టబడిన స్థలాన్ని సూచించే గ్రీకు ప్రయోగానికి తెలుగులో సహజమైన రూపం.
- source_word: Γολγοθᾶ
  choice: గొల్గొతా
  rationale: స్థలనామాన్ని అనువదించకుండా తెలుగు లిపిలో లిప్యంతరీకరించాం.
- source_word: ὅ ἐστιν
  choice: దానికి … అని అర్థం
  rationale: ఇది స్థలనామానికి ఇచ్చిన వివరణ అని సాధారణ తెలుగు పాఠకుడికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: Κρανίου Τόπος
  choice: పుర్రె స్థలం
  rationale: క్రానియోన్ అనే పదానికి ‘పుర్రె’, తోపోస్‌కు ‘స్థలం’ అని ఇచ్చి, గ్రీకులో నిర్దిష్ట ఉపపదం లేకపోవడాన్ని అనవసరంగా నిర్దిష్టం చేయలేదు.
- source_word: λεγόμενος
  choice: అని
  rationale: గ్రీకులోని పునరుక్త ‘అని పిలువబడేది’ అనే భావాన్ని తెలుగులో భారంగా కాకుండా అర్థవివరణలో సహజంగా కలిపాం.
