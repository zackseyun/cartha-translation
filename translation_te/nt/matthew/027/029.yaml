source:
  edition: SBLGNT
  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: te
  text: వారు ముళ్లతో ఒక కిరీటం అల్లి, దాన్ని ఆయన తలపై పెట్టారు. ఆయన కుడిచేతిలో ఒక రెల్లుకర్ర ఉంచారు. తరువాత ఆయన ఎదుట మోకరించి, “యూదుల రాజా, నీకు జయం!” అంటూ ఆయనను ఎగతాళి చేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “యూదుల” అనే మాటకు మూలంలోని గ్రీకు పదం “యూదయవాసుల” అనే అర్థాన్ని కూడా ఇవ్వగలదు. ఇక్కడ అది యేసును ఎగతాళి చేస్తూ పలికిన రాజబిరుదులో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλέξαντες στέφανον ἐξ ἀκανθῶν
  choice: ముళ్లతో ఒక కిరీటం అల్లి
  rationale: ‘అల్లి’ అనేది πλέξαντες లోని పెనవేసి తయారుచేసిన చర్యను సహజంగా తెలియజేస్తుంది; రాజరికాన్ని అవహేళనగా అనుకరించే సందర్భంలో στέφανον కు ‘కిరీటం’ సరిపోతుంది.
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: దాన్ని ఆయన తలపై పెట్టారు
  rationale: వస్తువును ఆయన తలపై ఉంచిన ప్రధాన చర్యను సరళమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κάλαμον ἐν τῇ δεξιᾷ αὐτοῦ
  choice: ఆయన కుడిచేతిలో ఒక రెల్లు ఉంచారు
  rationale: κάλαμον ను రాజదండమని వ్యాఖ్యానించకుండా దాని స్పష్టమైన భౌతిక అర్థమైన ‘రెల్లు’గా ఉంచి, సందర్భంలోని నకిలీ రాజలాంఛనాన్ని పాఠకుడు గ్రహించేలా చేస్తుంది.
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: ఆయన ఎదుట మోకరించి
  rationale: నకిలీ రాజవందనంలోని శరీర భంగిమను సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ἐνέπαιξαν αὐτῷ
  choice: ఆయనను ఎగతాళి చేశారు
  rationale: కేవలం సరదా కాకుండా అవమానకరమైన పరిహాసాన్ని సూచించే సహజ తెలుగు ప్రయోగం.
- source_word: Χαῖρε
  choice: నీకు జయం
  rationale: ఈ సందర్భంలో సాధారణ అభివాదం కంటే వ్యంగ్య రాజవందనాన్ని ప్రతిబింబించే తెలుగు నినాదం.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: యూదుల రాజా
  rationale: సంబోధనా రూపాన్ని నిలుపుతూ, శ్రమవృత్తాంతంలోని ప్రసిద్ధ రాజబిరుదుకు సహజమైన తెలుగు రూపాన్ని ఇస్తుంది.
theological_decisions:
- issue: వ్యంగ్య రాజవందనంలోని ఘనతను, వ్యతిరేకార్థాన్ని నిలుపడం
  choice: “యూదుల రాజా, నీకు జయం!”
  alternative: “యూదుల రాజా, వందనం!”
  rationale: Χαῖρε సాధారణ అభివాదంగా ఉండగలిగినా, ఇక్కడ సైనికులు రాజుకు చేసే జయధ్వనిని నటిస్తూ ఎగతాళి చేస్తున్నారు. ‘నీకు జయం’ ఆ రాజసంబంధ వ్యంగ్యాన్ని స్పష్టంగా ఉంచుతుంది.
- issue: Ἰουδαίων యొక్క విస్తృతి
  choice: యూదుల
  alternative: యూదయవాసుల
  rationale: ఈ శ్రమవృత్తాంతపు రాజబిరుదులో పదం విస్తృత జాతి-మత సమూహాన్ని సూచించడం సహజం; కేవలం యూదయ ప్రాంత నివాసులకే పరిమితం చేయదు. అయినా మూలపదానికి ప్రాంతీయ అర్థం సాధ్యమని గమనికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. చిన్న వాక్యాలతో చర్యల క్రమం స్పష్టంగా ఉంచబడింది; ‘రెల్లు’ వంటి స్పష్టమైన వస్తుపదాన్ని వ్యాఖ్యానాత్మకంగా ‘రాజదండం’గా మార్చలేదు.
