revisions:
- from: వారు ముళ్లతో ఒక కిరీటం అల్లి, దాన్ని ఆయన తలపై పెట్టారు. ఆయన కుడిచేతిలో ఒక రెల్లు ఉంచారు. తరువాత ఆయన ఎదుట మోకరించి, “యూదుల రాజా, నీకు జయం!” అంటూ ఆయనను ఎగతాళి చేశారు.[a]
  to: వారు ముళ్లతో ఒక కిరీటం అల్లి, దాన్ని ఆయన తలపై పెట్టారు. ఆయన కుడిచేతిలో ఒక రెల్లుకర్ర ఉంచారు. తరువాత ఆయన ఎదుట మోకరించి, “యూదుల రాజా, నీకు జయం!” అంటూ ఆయనను ఎగతాళి చేశారు.[a]
  rationale: A single lexical adjustment replaces the less natural countable use “ఒక రెల్లు” with “ఒక రెల్లుకర్ర.” The revised wording remains faithful to κάλαμος as a reed and does not add the interpretive term “రాజదండం.” All other wording and the existing footnote are retained because they adequately preserve the Greek sense and the title’s lexical ambiguity.
