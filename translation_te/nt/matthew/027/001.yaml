id: MAT.27.1
reference: Matthew 27:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: te
  text: తెల్లవారినప్పుడు, ప్రధాన యాజకులూ ప్రజల పెద్దలూ అందరూ యేసుకు వ్యతిరేకంగా, ఆయనను చంపడానికి సంప్రదింపులు జరిపారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: తెల్లవారినప్పుడు
  rationale: ఈ జనిటివ్ అబ్సల్యూట్ కాలసంబంధ మార్పును సూచిస్తుంది. ‘తెల్లవారినప్పుడు’ సహజమైన ఆధునిక తెలుగు; δέ ను ప్రత్యేక పదంతో అనువదించకుండానే కథన మార్పులో ప్రతిఫలింపజేసింది.
- source_word: συμβούλιον ἔλαβον
  choice: సంప్రదింపులు జరిపారు
  rationale: ఈ నుడికారం కలిసి ఆలోచించడం లేదా అధికారికంగా సంప్రదించడం అనే భావాన్ని ఇస్తుంది. ‘సంప్రదింపులు జరిపారు’ న్యాయపరమైన సందర్భపు గంభీరతను నిలుపుతూ, గ్రీకులో ఉన్నదానికంటే బలమైన ‘కుట్ర పన్నారు’ అనే భావాన్ని చేర్చదు.
- source_word: πάντες
  choice: అందరూ
  rationale: నాయకత్వ వర్గాల సమగ్ర భాగస్వామ్యాన్ని స్పష్టంగా నిలుపుతుంది. తెలుగులో రెండు వర్గాలకు ‘అందరూ’ చేర్చడం వాక్యాన్ని సహజంగా, పరిధిని స్పష్టంగా చేస్తుంది.
- source_word: οἱ ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: సువార్తలలో యెరూషలేము యాజక నాయకవర్గానికి వాడే ప్రామాణిక తెలుగు పదబంధం; అనేకమంది ఏకైక ప్రధాన యాజక పదవిని ధరించారని తప్పుగా సూచించదు.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: ప్రజల పెద్దలు
  rationale: ఇది ప్రజల అధికారిక నాయకులను సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: యేసుకు వ్యతిరేకంగా
  rationale: ఈ శత్రుత్వపూర్వక సందర్భంలో κατά + జనిటివ్ కేవలం ‘యేసు గురించి’ కాక, ఆయనకు వ్యతిరేకమైన చర్యను సూచిస్తుంది.
- source_word: ὥστε
  choice: అనే ఉద్దేశంతో
  rationale: ఇక్కడ ఇన్ఫినిటివ్‌తో కలిసి ఉద్దేశించిన ఫలితం లేదా లక్ష్యాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో ఉద్దేశాన్ని సహజంగా వెల్లడిస్తుంది.
- source_word: θανατῶσαι αὐτόν
  choice: ఆయనను చంపించాలనే
  rationale: నాయకులు స్వయంగా చంపడం కంటే ఆయన మరణాన్ని సాధించాలనే న్యాయపరమైన చర్య సందర్భానికి ‘చంపించాలి’ సరిపోతుంది; అయితే ‘మరణశిక్ష విధించాలి’ అని ప్రక్రియను మితిమీరి నిర్దిష్టం చేయదు.
theological_decisions:
- issue: యేసుపట్ల నాయకుల చర్య స్వభావం
  choice: వారి సంప్రదింపులు యేసుకు వ్యతిరేకమైనవని, ఆయనను చంపించడమే వాటి ఉద్దేశమని స్పష్టంగా అనువదించడం.
  alternative: ‘యేసు గురించి సంప్రదించారు’ అని బలహీనంగా లేదా ‘యేసుకు వ్యతిరేకంగా కుట్ర పన్నారు’ అని మరింత బలంగా అనువదించడం.
  rationale: κατά శత్రుత్వాన్ని, ὥστε θανατῶσαι ప్రాణాంతక ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తాయి. ‘సంప్రదింపులు జరిపారు’ గ్రీకు పదబంధంలో లేని అదనపు కుట్ర భావాన్ని చేర్చకుండా ఈ రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, న్యాయసభ సందర్భానికి తగిన గంభీరత. మూలంలోని అర్థభేదాలు ప్రధాన వాక్యంలోనే తగినంతగా వ్యక్తమైనందున పాదటిప్పణులు అవసరం లేదు.
