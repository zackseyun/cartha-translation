id: MAT.27.54
reference: Matthew 27:54
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: te
  text: శతాధిపతి, అతనితో కలిసి యేసుకు కాపలా కాస్తున్నవారు భూకంపాన్ని, జరిగిన సంగతులను చూసి ఎంతో భయపడి, “ఈయన నిజంగా దేవుని కుమారుడే!” అన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈయన నిజంగా దేవుని కుమారుడు.” గ్రీకులో θεοῦ υἱός అనే పదబంధానికి నిర్దిష్ట ఉపపదం లేదు; కాబట్టి ఆ రూపం మాత్రమే నిర్దిష్ట అర్థాన్ని తప్పనిసరి చేయదు. అయితే మత్తయి సువార్త సందర్భంలో ప్రధాన పాఠ్యం దాన్ని యేసుకు సంబంధించిన బిరుదుగా అనువదిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: శతాధిపతి
  rationale: రోమా సైన్యంలో సుమారు వందమంది సైనికులకు నాయకత్వం వహించే అధికారిని సూచించే ప్రామాణికమైన, సంక్షిప్తమైన తెలుగు పదం.
- source_word: τηροῦντες τὸν Ἰησοῦν
  choice: యేసుకు కాపలా కాస్తున్నవారు
  rationale: శిక్ష అమలు ప్రదేశంలోని సైనికుల విధిని బట్టి τηρέω ఇక్కడ కేవలం చూడడం కాక కాపలా కాయడాన్ని సూచిస్తుంది.
- source_word: ἰδόντες
  choice: చూసి
  rationale: గ్రీకు భూతకాల క్రియావిశేషణ రూపాన్ని తెలుగులో ప్రధాన క్రియకు ముందు జరిగిన చర్యగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν σεισμὸν
  choice: భూకంపాన్ని
  rationale: σεισμός అనే పదానికి ఈ సందర్భంలో నేరుగా సరిపోయే సాధారణ అర్థం.
- source_word: τὰ γενόμενα
  choice: జరిగిన సంగతులను
  rationale: భూకంపంతో మాత్రమే పరిమితం చేయకుండా, అక్కడ జరిగిన ఇతర సంఘటనలను కూడా కలుపుకునే గ్రీకు బహువచన భావాన్ని నిలుపుతుంది.
- source_word: ἐφοβήθησαν σφόδρα
  choice: ఎంతో భయపడి
  rationale: σφόδρα ఇచ్చే తీవ్రతను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἀληθῶς
  choice: నిజంగా
  rationale: వారి మాటలోని దృఢమైన అంగీకారాన్ని సహజంగా తెలుపుతుంది; వారి అవగాహన పరిమాణాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: θεοῦ υἱὸς
  choice: దేవుని కుమారుడే
  rationale: మత్తయి సువార్త సందర్భంలో ఇది యేసుకు వర్తించే బిరుదుగా గ్రహించడానికి బలమైన ఆధారం ఉంది. ‘ఏ’ అనే నిశ్చయార్థక బలం ఆ అంగీకారాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; గ్రీకులో వ్యాకరణపరంగా సాధ్యమైన అనిశ్చితార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: οὗτος
  choice: ఈయన
  rationale: వక్తలు సిలువపై ఉన్న యేసును నేరుగా సూచిస్తున్న భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: θεοῦ υἱὸς అనే పదబంధాన్ని నిశ్చయార్థక బిరుదుగా అనువదించాలా, అనిశ్చితార్థంగా అనువదించాలా
  choice: దేవుని కుమారుడే
  alternative: దేవుని కుమారుడొకడు
  rationale: గ్రీకులో ఈ పదబంధానికి నిర్దిష్ట ఉపపదం లేకపోయినా, విధేయ నామవాచక నిర్మాణం తప్పనిసరిగా అనిశ్చితార్థాన్ని కోరదు. మత్తయి సువార్తలో ‘దేవుని కుమారుడు’ యేసుకు ముఖ్యమైన బిరుదు కావడం వల్ల ప్రధాన పాఠ్యంలో నిశ్చయార్థక భావం సముచితం. అయినా గ్రీకు రూపంలోని నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన వాక్యనిర్మాణంతో పాటు గంభీరతను నిలిపాం. δέ కోసం మూలంలో లేని ప్రత్యేక కాలసూచక పదాన్ని చేర్చలేదు. సమూహమంతా యేసుకు కాపలా కాస్తున్న భావం స్పష్టంగా ఉండేలా ‘అతనితో కలిసి’ అని అమర్చాం.
