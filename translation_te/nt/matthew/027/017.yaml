id: MAT.27.17
reference: Matthew 27:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: te
  text: కాబట్టి వారు సమకూడిన తర్వాత పిలాతు వారితో, “నేను మీకు ఎవరిని విడుదల చేయాలని మీరు కోరుకుంటున్నారు—యేసు బరబ్బానా[a], లేక మెస్సీయ అని పిలువబడే యేసునా[b]?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘యేసు బరబ్బా’కు బదులుగా కేవలం ‘బరబ్బా’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘క్రీస్తు.’ గ్రీకు పదం χριστός ఇక్కడ ఒక బిరుదుగా వాడబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων
  choice: వారు సమకూడినప్పుడు
  rationale: ఈ కాలసూచక జనిటివ్ అబ్సల్యూట్ నిర్మాణం, పిలాతు మాట్లాడే సమయానికి ప్రజలు కూడి ఉన్నారని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి కథనంతో ఉన్న తార్కిక, కథన సంబంధాన్ని నిలుపుతుంది.
- source_word: Τίνα θέλετε ἀπολύσω ὑμῖν
  choice: నేను మీకు ఎవరిని విడుదల చేయాలని మీరు కోరుకుంటున్నారు
  rationale: ఇద్దరిలో ఒకరిని ఎన్నుకోవాలనే ప్రశ్నను, అలాగే న్యాయ సందర్భంలోని ‘విడుదల చేయడం’ అనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: యేసు బరబ్బా
  rationale: SBLGNT పాఠంలో Ἰησοῦν ఉన్నందున రెండు పేర్లనూ ప్రధాన పాఠంలో ఉంచి, యేసు అనే ఒకే పేరుగల ఇద్దరి మధ్య వ్యత్యాసాన్ని కాపాడింది.
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: మెస్సీయ అని పిలువబడే యేసు
  rationale: λεγόμενον ను తటస్థంగా ‘అని పిలువబడే’ అని ఇచ్చి, χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించింది; అవహేళన భావాన్ని చేర్చలేదు.
theological_decisions:
- issue: χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ χριστός యేసుకు జతచేసిన పేరులా కాక, ‘అని పిలువబడే’ అనే నిర్మాణంలో బిరుదుగా ఉంది. అందువల్ల బిరుదు భావాన్ని ప్రధాన పాఠంలో స్పష్టంగా ఉంచి, సుపరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- issue: బరబ్బా ముందు ‘యేసు’ చేర్చడం
  choice: యేసు బరబ్బా
  alternative: బరబ్బా
  rationale: అందించిన SBLGNT మూలపాఠంలో Ἰησοῦν ఉంది. దాన్ని ప్రధాన పాఠంలో అనుసరించి, లేని ప్రతుల పాఠాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రశ్నలోని ఇద్దరి మధ్య ఎంపికను ‘— ... నా, లేక ... నా?’ నిర్మాణంతో స్పష్టంగా చూపించింది. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
