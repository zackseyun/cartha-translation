id: MAT.27.42
reference: Matthew 27:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: te
  text: “ఇతరులను రక్షించాడు; తనను తాను రక్షించుకోలేడు. ఇతడు ఇశ్రాయేలు రాజు; ఇప్పుడు సిలువ మీద నుంచి దిగిరానీ[a], అప్పుడు మేము ఇతనిపై విశ్వాసముంచుతాం.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇతడు ఇశ్రాయేలు రాజు అయితే, ఇప్పుడు సిలువ మీద నుంచి దిగిరానీ; అప్పుడు మేము ఇతనిపై విశ్వాసముంచుతాం.” కొన్ని అనువాదాలు హేళనలో అంతర్లీనంగా ఉన్న షరతు భావాన్ని స్పష్టంగా వ్యక్తం చేస్తాయి; అయితే ఇక్కడి గ్రీకు పాఠం బిరుదును నేరుగా పేర్కొంటుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄλλους
  choice: ఇతరులను
  rationale: కర్మ విభక్తిలో నామవాచకంగా వాడిన బహువచనాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తూ ‘తనను తాను’ అనే వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἔσωσεν
  choice: రక్షించాడు
  rationale: σῴζω పదంలోని విడిపించడం, కాపాడడం, స్వస్థపరచడం వంటి విస్తృత భావపరిధిని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
- source_word: ἑαυτὸν
  choice: తనను తాను
  rationale: ఇతరులను రక్షించాడనే మాటకు వ్యతిరేకంగా ఉన్న ఆత్మవాచక బలాన్ని స్పష్టంగా చూపుతుంది.
- source_word: οὐ δύναται σῶσαι
  choice: రక్షించుకోలేడు
  rationale: δύναμαι మరియు క్రియానామ రూపం తెలిపే అసమర్థతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఆత్మవాచక కర్మకు అనుగుణంగా ‘రక్షించుకో’ వాడబడింది.
- source_word: βασιλεὺς Ἰσραήλ
  choice: ఇశ్రాయేలు రాజు
  rationale: హేళనగా పలికినప్పటికీ గ్రీకులోని రాజబిరుదును నేరుగా, అదనపు షరతు లేకుండా నిలుపుతుంది.
- source_word: καταβάτω
  choice: దిగిరానీ
  rationale: మూడవ పురుష ఆజ్ఞార్థక సవాలును తెలుగులో సంక్షిప్తమైన అనుమత్యర్థక-ఆజ్ఞార్థక రూపంతో వ్యక్తం చేస్తుంది.
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: హేళనతో కూడిన సవాలులోని తక్షణత్వాన్ని నిలుపుతుంది.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: సిలువ మీద నుంచి
  rationale: మూలంలోని స్థానవియోగ భావాన్ని సహజమైన ఆధునిక తెలుగు ప్రయోగంలో స్పష్టంగా అందిస్తుంది.
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: మేము ఇతనిపై విశ్వాసముంచుతాం
  rationale: ἐπί + కర్మ విభక్తితో వ్యక్తి వైపు మళ్లిన నమ్మకాన్ని ‘ఇతనిపై విశ్వాసముంచడం’గా స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: యేసును గురించి హేళనగా పలికిన రాజబిరుదు
  choice: ఇతడు ఇశ్రాయేలు రాజు
  alternative: ఇతడు ఇశ్రాయేలు రాజు అయితే
  rationale: గ్రీకు పాఠంలో ఇది సంధానరహిత నామవాచక వాక్యం; స్పష్టమైన షరతు లేదు. కాబట్టి ‘అయితే’ అని చేర్చకుండా, హేళనగా నేరుగా పలికిన బిరుదును ప్రధాన పాఠంలో నిలిపి, సాధ్యమైన షరతు భావాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి వాడబడింది. హేళన స్వరాన్ని ‘ఇతడు’, ‘దిగిరానీ’ రూపాలు తెలియజేస్తాయి; మూలంలో లేని షరతును ప్రధాన పాఠంలో చేర్చలేదు.
