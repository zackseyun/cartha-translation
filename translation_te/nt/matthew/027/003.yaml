id: MAT.27.3
reference: Matthew 27:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: te
  text: అప్పుడు, ఆయనను అప్పగించిన యూదా, ఆయన దోషిగా తీర్పు పొందాడని చూసి, విచారపడి, ఆ ముప్పై వెండి నాణేలను ముఖ్య యాజకులకూ పెద్దలకూ తిరిగి ఇచ్చాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: తరువాత జరిగిన సంఘటనను పరిచయం చేసే సహజమైన కాలసూచక పదం.
- source_word: ἰδὼν
  choice: చూసిన
  rationale: గ్రీకు భూతకాల కృదంతంలోని కాలసంబంధాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: Ἰούδας ὁ παραδιδοὺς αὐτόν
  choice: తన చేత అప్పగించబడిన ఆయనను చూసిన యూదా
  rationale: παραδίδωμι యొక్క ప్రాథమిక భావమైన ‘అప్పగించు’ను నిలుపుతూ, యూదా పాత్రను గుర్తిస్తుంది; తెలుగులో వాక్యసంబంధం స్పష్టంగా ఉండేలా కర్మణి నిర్మాణం వాడబడింది.
- source_word: ὅτι κατεκρίθη
  choice: ఆయనకు శిక్ష విధించబడిందని
  rationale: κατακρίνω ఇక్కడ న్యాయపరంగా దోషిగా తీర్చి శిక్ష విధించడాన్ని సూచిస్తుంది; కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: μεταμεληθεὶς
  choice: పశ్చాత్తాపపడి
  rationale: తెలుగులో ఇది చేసిన పనిపై కలిగిన తీవ్రమైన విచారం/పశ్చాత్తాపాన్ని సహజంగా తెలియజేస్తుంది; సంపూర్ణ ఆధ్యాత్మిక మారుమనస్సును తప్పనిసరిగా నిర్ధారించకుండా ఉండేందుకు పాదసూచికలో భావాన్ని పరిమితం చేశాం.
- source_word: ἔστρεψεν
  choice: తిరిగి ఇచ్చాడు
  rationale: డబ్బును సంబంధిత వ్యక్తులకు తిరిగి ఇవ్వడం అనే సందర్భోచిత అర్థాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: ఆ ముప్పై వెండి నాణేలను
  rationale: ἀργύρια వెండి రూపంలోని ధనాన్ని సూచిస్తుంది; ‘వెండి నాణేలు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది, అయితే వస్తువుల ఖచ్చిత రూపంపై మూలంలోని కొంత సాధారణతను పాదసూచికలో నిలిపాం.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: ముఖ్య యాజకులకూ పెద్దలకూ
  rationale: మత్తయి సందర్భంలోని యూదా నాయకత్వ వర్గాలకు సహజమైన, స్థిరమైన తెలుగు పదప్రయోగం.
theological_decisions:
- issue: μεταμεληθεὶς యూదా ప్రతిస్పందనను ఎంత బలంగా సూచిస్తుంది
  choice: పశ్చాత్తాపపడి, పాదసూచికలో ‘చేసినదానికి విచారించి’ అనే పరిమిత భావాన్ని చూపడం
  alternative: మారుమనస్సు పొంది
  rationale: మూలంలోని μεταμέλομαι చేసినదానిపై విచారం లేదా పశ్చాత్తాపాన్ని సూచిస్తుంది; యూదా ఆధ్యాత్మిక స్థితిపై మరింత బలమైన సిద్ధాంత నిర్ణయాన్ని అనువాదం దిగుమతి చేయకూడదు.
- issue: παραδιδοὺς యొక్క నైతిక భావం
  choice: అప్పగించిన
  alternative: ద్రోహం చేసిన
  rationale: ‘ద్రోహం చేసిన’ సందర్భార్థంగా సముచితమే అయినా, ‘అప్పగించిన’ మూలక్రియకు మరింత సమీపంగా ఉండి పాఠకుడు కథనంలోని నైతిక బరువును స్వయంగా గ్రహించేందుకు వీలు కల్పిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథనశైలి. ‘పశ్చాత్తాపపడి’ సాధారణ పాఠకునికి సహజమైనదైనా, దాని సిద్ధాంతపరమైన అతివ్యాఖ్యానాన్ని పాదసూచిక నియంత్రిస్తుంది. ప్రధాన వాక్యంలో రెండు పాదసూచిక గుర్తులూ చేర్చబడ్డాయి.
