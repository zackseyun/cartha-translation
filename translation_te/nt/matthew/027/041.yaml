base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: te
  text: 'అదే విధంగా[a], ప్రధాన యాజకులు కూడా శాస్త్రులతో, పెద్దలతో కలిసి ఆయనను ఎగతాళి చేస్తూ ఇలా చెబుతూ ఉన్నారు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అలాగే, ప్రధాన యాజకులు కూడా శాస్త్రులతో, పెద్దలతో కలిసి ఆయనను ఎగతాళి చేస్తూ ఇలా చెబుతూ ఉన్నారు.’
    reason: ὁμοίως అనే పదానికి సహజమైన మరో తెలుగు రూపాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: ὁμοίως
  choice: అదే విధంగా
  rationale: ముందటి వచనాల్లో జరిగిన ఎగతాళితో ఈ చర్యకు ఉన్న పోలికను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: ఇప్పటికే ప్రస్తావించిన ఎగతాళి చేసినవారికి ప్రధాన యాజకులను అదనంగా చేర్చే భావాన్ని నిలుపుతుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: యాజక వర్గంలోని ప్రముఖ అధికారులను సూచించే స్థిరమైన, సందర్భోచితమైన తెలుగు పదబంధం.
- source_word: ἐμπαίζοντες
  choice: ఆయనను ఎగతాళి చేస్తూ
  rationale: అవహేళనతో కూడిన అపహాస్య చర్యను తెలియజేస్తుంది; సందర్భం ఆధారంగా కర్మ అయిన యేసును ‘ఆయనను’ అని స్పష్టం చేసింది.
- source_word: μετὰ
  choice: తో కలిసి
  rationale: శాస్త్రులు, పెద్దలు కేవలం సమీపంలో ఉన్నారని కాకుండా చర్యలో భాగస్వాములని సూచించే సహవాస భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: γραμματέων
  choice: శాస్త్రులు
  rationale: సువార్తల సందర్భంలో ధర్మశాస్త్ర నిపుణులను సూచించే సంప్రదాయబద్ధమైన, విస్తృతంగా అర్థమయ్యే అనువాదం.
- source_word: πρεσβυτέρων
  choice: పెద్దలు
  rationale: కేవలం వయోవృద్ధులను కాకుండా గుర్తింపు పొందిన యూదా నాయకులను సూచించే సంస్థాగత భావాన్ని సందర్భంలో నిలుపుతుంది.
- source_word: ἔλεγον
  choice: ఇలా అంటూనే ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న లేదా పునరావృతమవుతున్న మాటల భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఎగతాళిలో పాల్గొన్నవారి గుర్తింపు
  choice: ప్రధాన యాజకులు, శాస్త్రులు, పెద్దలు కలిసి యేసును ఎగతాళి చేసినట్లు అనువదించబడింది.
  alternative: ప్రధాన యాజకులు శాస్త్రులు, పెద్దలు ఉన్నచోట యేసును ఎగతాళి చేశారని మాత్రమే అర్థం చేసుకోవచ్చు.
  rationale: μετὰ + షష్ఠీ విభక్తి ఇక్కడ కేవలం సమీపాన్ని కాకుండా చర్యలో సహభాగిత్వాన్ని సహజంగా సూచిస్తుంది; దీనికి మించిన సిద్ధాంతపరమైన వ్యాఖ్యను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కథన శైలి. ‘అంటూనే ఉన్నారు’ ద్వారా గ్రీకు అసంపూర్ణ భూతకాల కొనసాగింపు నిలుపబడింది. తదుపరి ప్రత్యక్ష వాక్యం వచ్చేలా చివరలో ద్విబిందువు ఉంచబడింది.
