  verdict: revise
  source_fidelity: The draft accurately represents ὁμοίως, the additive καί, the associated participation expressed by μετὰ with the scribes and elders, and the mocking participle. However, “అంటూనే ఉన్నారు” more specifically conveys ‘kept on saying’ and can overstate repetition or persistence beyond the imperfect ἔλεγον.
  naturalness: The sentence is clear, idiomatic modern standard Telugu, and the formal narrative register is appropriate. Replacing “అంటూనే ఉన్నారు” with “చెబుతూ ఉన్నారు” preserves the ongoing imperfect sense more neutrally while remaining natural before the following direct speech.
  terminology: “ప్రధాన యాజకులు,” “శాస్త్రులు,” and “పెద్దలు” are appropriate established renderings in this Gospel setting. “ఆయనను ఎగతాళి చేస్తూ” suitably conveys derisive mockery without adding interpretation.
  issues:
  - severity: low
    issue: The rendering of ἔλεγον as “అంటూనే ఉన్నారు” is somewhat over-specific.
    rationale: The Greek imperfect can express ongoing speech, but “-తూనే” readily suggests insistently or repeatedly continuing. “చెబుతూ ఉన్నారు” retains the imperfect’s ongoing aspect without making that additional nuance explicit.
