id: MAT.27.61
reference: Matthew 27:61
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦν δὲ ἐκεῖ ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία καθήμεναι ἀπέναντι τοῦ τάφου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/061.yaml
  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: te
  text: మగ్దల మరియ, మరో మరియ అక్కడ సమాధికి ఎదురుగా కూర్చొని ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν δὲ ἐκεῖ
  choice: అక్కడ ... ఉన్నారు
  rationale: గ్రీకులో క్రియ ఏకవచనంలో ఉన్నా, దాని తరువాత ఇద్దరు సమన్వయ కర్తలు వస్తారు; ఆధునిక తెలుగులో భావానికి అనుగుణంగా గౌరవ/బహువచన క్రియ సహజం. δέ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేక పదం చేర్చకుండా వాక్యప్రవాహంలో వ్యక్తం చేయడం సహజం.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: మగ్దల మరియ
  rationale: ఆమెను మగ్దల ప్రాంతానికి చెందిన మరియగా గుర్తించే స్థిరమైన, సహజమైన తెలుగు రూపం.
- source_word: ἡ ἄλλη Μαρία
  choice: మరో మరియ
  rationale: ముందు పేర్కొన్న మగ్దల మరియకు భిన్నమైన మరియను ἄλλη సూచిస్తుంది; ‘మరో మరియ’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: καθήμεναι
  choice: కూర్చొని
  rationale: వారు అక్కడ ఉన్నప్పుడు వారి భంగిమను తెలిపే వర్తమాన కృదంత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπέναντι τοῦ τάφου
  choice: సమాధికి ఎదురుగా
  rationale: ἀπέναντι తెలిపే ఎదురెదురు స్థానాన్ని ‘ఎదురుగా’ స్పష్టంగా అందిస్తుంది; τάφοςకు ఈ సమాధి సందర్భంలో ‘సమాధి’ సాధారణ తెలుగు పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని స్వల్ప δέ అనుసంధానానికి అసహజమైన ‘ఇప్పుడు’ లేదా బలమైన విరోధార్థక పదం చేర్చలేదు.
