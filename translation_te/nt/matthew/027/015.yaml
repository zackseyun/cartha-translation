  edition: SBLGNT
  text: Κατὰ δὲ ἑορτὴν εἰώθει ὁ ἡγεμὼν ἀπολύειν ἕνα τῷ ὄχλῳ δέσμιον ὃν ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: te
  text: పండుగ సమయంలో, జనసమూహం కోరుకున్న ఒక ఖైదీని జనసమూహానికి విడుదల చేయడం గవర్నరుకు ఆనవాయితీగా ఉండేది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: పండుగ సమయంలో
  rationale: κατά + ద్వితీయా విభక్తి ఇక్కడ కాలార్థకంగా ‘పండుగ సమయంలో’ అని సూచిస్తుంది. δέ స్వల్ప కథన అనుసంధానాన్ని ఇస్తుంది; తెలుగులో ప్రత్యేక పదం చేర్చకుండానే వాక్యప్రవాహం దానిని సహజంగా తెలియజేస్తుంది.
- source_word: εἰώθει
  choice: ఆచారంగా ఉండేది
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో పునరావృతంగా జరిగే అలవాటు లేదా ఆనవాయితీని సూచిస్తుంది; ‘ఆచారంగా ఉండేది’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ ἡγεμὼν
  choice: అధిపతి
  rationale: ఈ సందర్భంలో రోమా పరిపాలనా అధికారిని సూచిస్తుంది. ‘అధిపతి’ ఆధునిక తెలుగు బైబిలు శైలిలో స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: ἀπολύειν
  choice: విడుదల చేయడం
  rationale: నిర్బంధం నుండి విడిచిపెట్టడాన్ని తెలిపే న్యాయసంబంధ సందర్భానికి ‘విడుదల చేయడం’ ఖచ్చితంగా సరిపోతుంది.
- source_word: ἕνα … δέσμιον
  choice: ఒక ఖైదీని
  rationale: ἕνα సంఖ్యను స్పష్టంగా చూపుతుంది; δέσμιος బంధంలో లేదా నిర్బంధంలో ఉన్న వ్యక్తి కాబట్టి ‘ఖైదీ’ సహజమైన సమానార్థకం.
- source_word: τῷ ὄχλῳ
  choice: ప్రజలకు
  rationale: దత్తివిభక్తి విడుదల వల్ల లబ్ధి పొందే లేదా ఎంపిక చేసే సమూహాన్ని సూచిస్తుంది. సందర్భంలో ὄχλος‌ను ‘ప్రజలు’ అని అనడం సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: ὃν ἤθελον
  choice: ప్రజలు కోరుకున్న
  rationale: సంబంధవాచక ఉపవాక్యం ప్రజలు ఎంపిక చేసిన ఖైదీని గుర్తిస్తుంది. ఏ నిర్దిష్ట ఖైదీ అనే విషయాన్ని వాక్యం ముందుగానే నిర్ణయించదు.
