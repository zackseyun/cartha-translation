  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని అలవాటు భావం, ఒక ఖైదీ అనే సంఖ్య, ప్రజల ఎంపిక అన్నీ స్పష్టంగా నిలుపబడ్డాయి.
