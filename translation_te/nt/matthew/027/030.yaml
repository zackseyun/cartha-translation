  text: καὶ ἐμπτύσαντες εἰς αὐτὸν ἔλαβον τὸν κάλαμον καὶ ἔτυπτον εἰς τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/030.yaml
  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: te
  text: వారు ఆయనపై ఉమ్మివేసి, ఆ రెల్లు కర్రను[a] తీసుకుని, ఆయన తలపై కొడుతూనే ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం ‘రెల్లు’ అని లేదా దాని విస్తృతార్థంలో ‘రెల్లులాంటి కర్ర’ అని అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు అపూర్ణ భూతకాల క్రియ పదేపదే లేదా కొనసాగుతూ జరిగిన చర్యను సూచించవచ్చు. మరో విధంగా: ‘ఆయన తలపై పదేపదే కొట్టారు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: ఆయన మీద ఉమ్మివేసి
  rationale: అవమానకరమైన చర్యను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; కృదంత రూపం ప్రధాన క్రియలకు ముందున్న చర్యను సూచిస్తుంది.
- source_word: ἔλαβον
  choice: తీసుకొని
  rationale: λαμβάνω అనే సాధారణ క్రియకు సందర్భానుకూలమైన నేరుగా అర్థం; తరువాతి చర్యతో సహజంగా అనుసంధానిస్తుంది.
- source_word: τὸν κάλαμον
  choice: ఆ రెల్లుకర్రను
  rationale: κάλαμος యొక్క ప్రాథమిక అర్థమైన రెల్లును నిలుపుతూ, ఇక్కడ కొట్టడానికి ఉపయోగించిన కర్రలాంటి వస్తువని తెలుగులో సహజంగా తెలియజేస్తుంది; ముందుగా ప్రస్తావించిన అదే వస్తువును నిర్దిష్టంగా సూచిస్తుంది.
- source_word: ἔτυπτον
  choice: కొడుతూనే ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా పదేపదే జరిగిన చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: ఆయన తల మీద
  rationale: εἰς ఇక్కడ దెబ్బల లక్ష్యాన్ని సూచిస్తుంది; ‘తల మీద’ అనేది స్పష్టమైన, సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: యేసుపై సైనికులు చేసిన అవమానం, హింస చిత్రణ
  choice: చర్యలను తగ్గించకుండా, అదనపు వివరాలు చేర్చకుండా సూటిగా చూపించడం
  alternative: మరింత శబ్దానువాదంగా ‘ఆయన మీద ఉమ్మివేసిన తరువాత... ఆయన తల మీద కొడుతూ ఉండిరి’ అని అనువదించడం
  rationale: మూల వచనంలోని అవమానాన్ని, కొనసాగిన హింసను స్పష్టంగా నిలుపుతూ, పాతకాలపు భాషను లేదా వ్యాఖ్యానాత్మక విస్తరణను నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘రెల్లుకర్ర’ మూలపదపు అర్థాన్నీ, సందర్భంలోని కర్రలాంటి ఉపయోగాన్నీ కలిపి నిలుపుతుంది; ‘కొడుతూనే ఉన్నారు’ క్రియ యొక్క కొనసాగింపు లేదా పునరావృత భావాన్ని తెలియజేస్తుంది.
