revisions:
- from: అయితే అక్కడ నిలబడి ఉన్నవారిలో కొందరు అది విని, “ఇతడు ఏలీయాను పిలుస్తున్నాడు” అని అంటూ ఉన్నారు.[a]
  to: అయితే అక్కడ నిలబడి ఉన్నవారిలో కొందరు అది విని, “ఇతడు ఏలీయాను పిలుస్తున్నాడు” అని చెబుతూ ఉన్నారు.[a]
  rationale: A minimal idiomatic correction replaces the duplicated quotative expression “అని అంటూ ఉన్నారు” with “అని చెబుతూ ఉన్నారు.” The revised wording continues to reflect the Greek imperfect ἔλεγον without adding interpretive content. The footnote marker and its explanatory note remain correctly anchored and semantically suitable.
