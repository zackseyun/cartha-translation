id: MAT.27.47
reference: Matthew 27:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν ἐκεῖ ⸀ἑστηκότων ἀκούσαντες ἔλεγον ὅτι Ἠλίαν φωνεῖ οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/047.yaml
  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: te
  text: అయితే అక్కడ నిలబడి ఉన్నవారిలో కొందరు అది విని, “ఇతడు ఏలీయాను పిలుస్తున్నాడు” అని చెబుతూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మునుపటి వచనంలో యేసు చేసిన కేకను, అక్కడ ఉన్నవారు ఏలీయాను పిలిచినట్టుగా అపార్థం చేసుకొని ఉండవచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: కొందరు
  rationale: అక్కడ ఉన్నవారిలో నిర్దిష్టంగా గుర్తించని కొంతమందిని సహజంగా సూచిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వాక్యానికి ప్రతిస్పందనగా వచ్చే స్వల్ప వ్యత్యాసాన్ని, కథన మలుపును తెలియజేస్తుంది.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: అక్కడ నిలబడి ఉన్నవారిలో
  rationale: సుబంతంగా వాడిన perfect participle‌ను నిలబడిన భంగిమతో సహా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀκούσαντες
  choice: అది విని
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను తెలియజేస్తుంది; ‘అది’ అనేది సందర్భంలోని యేసు కేకను సూచిస్తూ తెలుగులో అవసరమైన పూరకం.
- source_word: ἔλεγον
  choice: అని అంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న లేదా పునరావృతమవుతున్న మాటల భావాన్ని అతిశయింపకుండా వ్యక్తం చేస్తుంది.
- source_word: Ἠλίαν
  choice: ఏలీయాను
  rationale: ప్రవక్త పేరుకు తెలుగులో స్థిరపడిన బైబిలు రూపం; మూలంలోని కర్మ విభక్తిని నిలుపుతుంది.
- source_word: φωνεῖ
  choice: పిలుస్తున్నాడు
  rationale: వర్తమానకాల భావాన్ని సహజంగా ఇస్తుంది; ‘సహాయం కోసం పిలుస్తున్నాడు’ వంటి వివరణను మూలంలో లేనందున చేర్చదు.
- source_word: οὗτος
  choice: ఇతడు
  rationale: దూరనిర్దేశక లేదా కొంత నిరాదరణతో కూడి ఉండగల demonstrative బలాన్ని ‘అతడు’ కంటే స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రక్కన ఉన్నవారి మాట యేసు నిజంగా ఏలీయాను పిలిచాడని నిర్ధారించాలా, లేక వారు అలా భావించారని మాత్రమే చూపాలా
  choice: వారి ప్రత్యక్ష మాటగానే, “ఇతడు ఏలీయాను పిలుస్తున్నాడు” అని అనువదించడం
  alternative: “ఇతడు ఏలీయుని సహాయం కోసం పిలుస్తున్నాడు” లేదా “యేసు ఏలీయాను పిలిచాడు”
  rationale: గ్రీకు వాక్యం వారి అవగాహనను నివేదిస్తుంది; అది సరైనదా తప్పా అనే తీర్పును ప్రధాన పాఠ్యంలో చేర్చకుండా కథనంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సహజమైనప్పటికీ గంభీరమైన కథన శైలి. ‘అంటూ ఉన్నారు’ ద్వారా imperfect aspect‌ను నిలిపి, ‘ఇతడు’ ద్వారా οὗτος యొక్క నిర్దేశక బలాన్ని కాపాడింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
