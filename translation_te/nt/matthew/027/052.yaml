id: MAT.27.52
reference: Matthew 27:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ⸀ἠγέρθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/052.yaml
  text: And the tombs were opened[a], and many bodies of the saints who had fallen asleep were raised,
translation:
  language: te
  text: సమాధులు తెరవబడ్డాయి, మరియు నిద్రించిన[a] పరిశుద్ధుల అనేక శరీరాలు లేపబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నిద్రించిన” అనేది “చనిపోయిన” అనే అర్థంలో సాధారణంగా వాడే రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μνημεῖα
  choice: సమాధులు
  rationale: μνημεῖον ఇక్కడ మృతులను ఉంచే సమాధులను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ఇది సహజమైన పదం.
- source_word: ἀνεῴχθησαν
  choice: తెరవబడ్డాయి
  rationale: భూతకాల కర్మణి రూపాన్ని నేరుగా నిలుపుతుంది; సమాధులు ఎలా తెరుచుకున్నాయో అదనంగా ఊహించదు.
- source_word: πολλὰ σώματα
  choice: అనేక శరీరాలు
  rationale: σῶμα అనే తటస్థ పదానికి సమీపమైన అనువాదం; ‘శవాలు’ అనే మరింత కఠినమైన, వ్యాఖ్యానాత్మక పదాన్ని నివారిస్తుంది.
- source_word: τῶν κεκοιμημένων
  choice: నిద్రించిన
  rationale: మరణాన్ని సూచించే మూలభాషలోని సాధారణ రూపకాన్ని నిలుపుతుంది.
- source_word: ἁγίων
  choice: పరిశుద్ధుల
  rationale: దేవునికి చెందిన పరిశుద్ధ ప్రజలను సూచించే నూతన నిబంధన పదప్రయోగంతో అనుసరణను కాపాడుతుంది; వారి నిర్దిష్ట గుర్తింపును చెప్పదు.
- source_word: ἠγέρθησαν
  choice: లేపబడ్డాయి
  rationale: ἐγείρω యొక్క కర్మణి భావాన్ని నిలుపుతూ, ఈ లేపబడడం యొక్క ఖచ్చిత స్వభావాన్ని ‘పునరుత్థానం పొందాయి’ అని ముందే నిర్ధారించదు.
theological_decisions:
- issue: ἠγέρθησαν సూచించే సంఘటన స్వభావం
  choice: లేపబడ్డాయి
  alternative: పునరుత్థానం పొందాయి
  rationale: క్రియ మృతులలోనుండి లేపబడడాన్ని సూచించగలదు; అయితే తటస్థమైన ‘లేపబడ్డాయి’ మూలపదానికి దగ్గరగా ఉండి, ఈ ఒక్క వచనంలో సంఘటన స్వభావాన్ని వ్యవస్థీకృతంగా నిర్ణయించదు.
translation_notes:
  register: సరళమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. గ్రీకు వాక్యంలోని రెండు సమన్వయ వాక్యభాగాలను తెలుగులో సహజంగా రెండు వాక్యాలుగా ఇచ్చాం. మూలంలోని మరణ-నిద్ర రూపకాన్ని నిలిపి, పాదటిప్పణిలో వివరించాం.
