revisions:
- from: ఎందుకంటే, వారు అసూయతోనే ఆయనను అప్పగించారని అతనికి తెలుసు.[a]
  to: ఎందుకంటే, వారు అసూయ కారణంగా ఆయనను అప్పగించారని అతనికి తెలుసు.[a]
  rationale: The revision removes an unrepresented emphatic nuance while preserving the Greek causal construction, Pilate's knowledge, and the passion-context sense of handing Jesus over. The footnote offers natural alternatives for φθόνος without altering the verse's meaning.
  reviewer_model: gpt-5.6-terra
