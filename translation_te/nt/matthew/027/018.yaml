reference: Matthew 27:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ᾔδει γὰρ ὅτι διὰ φθόνον παρέδωκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/018.yaml
  text: For he knew that they had handed him over because of envy[a].
translation:
  language: te
  text: ఎందుకంటే, వారు అసూయ కారణంగా ఆయనను అప్పగించారని అతనికి తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అసూయతో’; లేదా ‘ఈర్ష్య కారణంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: అతనికి తెలుసు
  rationale: οἶδα ఇక్కడ తెలిసి ఉండటం లేదా గ్రహించి ఉండటాన్ని సూచిస్తుంది. సందర్భంలో కర్త పిలాతు; సహజమైన ఆధునిక తెలుగులో ‘అతనికి తెలుసు’ నేరుగా అర్థాన్ని అందిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందున్న వాక్యానికి వివరణను పరిచయం చేస్తుంది. తెలుగులో ‘ఎందుకంటే’ ఆ వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: ఇక్కడ ὅτι పిలాతుకు తెలిసిన విషయాన్ని పరిచయం చేస్తుంది; అందువల్ల తెలుగు పరోక్ష వాక్య నిర్మాణంలో ‘అని’ తగినది.
- source_word: διὰ φθόνον
  choice: అసూయతోనే
  rationale: అక్యూసేటివ్‌తో διά కారణాన్ని సూచిస్తుంది; φθόνος మరొకరి స్థానం లేదా విజయంపై కలిగే అసూయను సూచిస్తుంది. ‘అసూయతోనే’ ఆ ప్రేరణను సహజంగా తెలియజేస్తూ గ్రీకు వాక్యంలోని కారణ భావానికి స్వల్ప ఉద్ఘాటన ఇస్తుంది.
- source_word: παρέδωκαν
  choice: అప్పగించారని
  rationale: παραδίδωμι ఇక్కడ యేసును పిలాతు అధికారానికి అప్పగించడాన్ని సూచిస్తుంది. ‘అప్పగించారు’ అనేది ‘ద్రోహం చేశారు’ కంటే విస్తృతమైనదీ సందర్భానికి సరిగ్గా సరిపోయేదీ.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: ఇది యేసును సూచించే కర్మవాచక సర్వనామం. గౌరవప్రదమైన సాధారణ తెలుగు వాడుకలో ‘ఆయనను’ తగినది.
theological_decisions:
- issue: యేసును అప్పగించినవారి ప్రేరణ
  choice: వారు యేసును అసూయ కారణంగా అప్పగించారని పిలాతు గ్రహించాడు.
  alternative: వారు ఈర్ష్యతో యేసును అప్పగించారని పిలాతు గ్రహించాడు.
  rationale: φθόνος తెలిపే నైతిక, మానసిక ప్రేరణను ‘అసూయ’ సహజంగా కాపాడుతుంది; వచనం చెప్పనంత విస్తృతమైన ధార్మిక వివరణను ఇందులో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ‘ఎందుకంటే’ ద్వారా ముందున్న సందర్భంతో వివరణాత్మక అనుసంధానం నిలుపబడింది.
