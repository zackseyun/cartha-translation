review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents γάρ as an explanatory connective, ὅτι as the content of Pilate's knowledge, and παρέδωκαν as handing Jesus over. However, ‘అసూయతోనే’ adds the emphatic particle ‘నే’ (‘precisely/indeed/only’), for which the Greek διὰ φθόνον supplies no explicit basis. A plainly causal Telugu expression better reflects διά with the accusative.
  naturalness: The sentence is clear and modern Telugu. Replacing ‘అసూయతోనే’ with ‘అసూయ కారణంగా’ removes the unwarranted emphasis and states the causal relationship naturally. The contextual pronoun ‘అతనికి’ is acceptable, since Pilate is the preceding referent.
  terminology: ‘అసూయ’ is an appropriate rendering of φθόνος. ‘అప్పగించారని’ accurately conveys παραδίδωμι here without importing the narrower sense ‘betrayed.’ ‘ఆయనను’ maintains the intended respectful biblical register.
  issues:
  - severity: low
    issue: The particle ‘నే’ in ‘అసూయతోనే’ introduces emphasis absent from the source.
    rationale: διὰ φθόνον states the cause (‘because of/out of envy’) but does not explicitly intensify or restrict it. ‘అసూయ కారణంగా’ preserves the causal meaning without added emphasis.
  revised_text: ఎందుకంటే, వారు అసూయ కారణంగా ఆయనను అప్పగించారని అతనికి తెలుసు.[a]
  revised_footnotes:
  - marker: a
    text: లేదా ‘అసూయతో’; లేదా ‘ఈర్ష్య కారణంగా.’
    reason: lexical_alternative
  revision_rationale: The revision removes an unrepresented emphatic nuance while preserving the Greek causal construction, Pilate's knowledge, and the passion-context sense of handing Jesus over. The footnote offers natural alternatives for φθόνος without altering the verse's meaning.
