translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. వివరణాత్మక ఉపవాక్యాన్ని డాష్‌ల మధ్య ఉంచి గ్రీకు వాక్య నిర్మాణంలోని స్పష్టీకరణను నిలిపాం; యూదుల కాలపదాన్ని ‘శుక్రవారం’గా సూటిగా నిర్ధారించకుండా ‘సిద్ధపాటు దినం’గా ఉంచాం.
