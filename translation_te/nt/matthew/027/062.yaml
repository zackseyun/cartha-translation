id: MAT.27.62
reference: Matthew 27:62
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον, ἥτις ἐστὶν μετὰ τὴν παρασκευήν, συνήχθησαν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι πρὸς Πιλᾶτον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/062.yaml
  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: te
  text: మరుసటి రోజున[a]—అంటే సిద్ధపాటు దినం తర్వాతి రోజున—ప్రధాన యాజకులు మరియు పరిసయ్యులు పిలాతు దగ్గరకు కూడి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరుసటి రోజున—అంటే సిద్ధపాటు తర్వాతి రోజున.” ఇక్కడి గ్రీకు పదం విశ్రాంతిదినానికి ముందు సిద్ధపడే దినాన్ని సూచించవచ్చు; దాన్ని “శుక్రవారం” అని అనువదించడం మూలపాఠం అవసరపడేదానికంటే ఎక్కువ వ్యాఖ్యానాత్మకంగా ఉంటుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: మరుసటి రోజున
  rationale: ఈ గ్రీకు ప్రయోగం కథనంలోని కాలక్రమాన్ని ముందుకు తీసుకెళ్లి ‘తర్వాతి రోజున’ అనే భావాన్ని ఇస్తుంది. δέ లోని స్వల్ప అనుసంధాన భావాన్ని తెలుగులో ప్రత్యేక పదంతో అతిగా వ్యక్తం చేయకుండా సహజమైన వాక్యప్రవాహంలో ఉంచాం.
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: అంటే సిద్ధపాటు దినం తర్వాతి రోజున
  rationale: ἥτις ఇక్కడ ముందున్న కాలసూచనను వివరిస్తుంది. ‘అంటే’ ఆ వివరణాత్మక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: παρασκευήν
  choice: సిద్ధపాటు దినం
  rationale: ఈ పదం యూదుల సందర్భంలో సాధారణంగా విశ్రాంతిదినానికి ముందు సిద్ధపడే దినాన్ని సూచిస్తుంది. ‘శుక్రవారం’ అని అనువదిస్తే మూలపాఠం కంటే ఎక్కువ నిర్దిష్టతను చేర్చినట్లవుతుంది.
- source_word: συνήχθησαν
  choice: సమావేశమయ్యారు
  rationale: రూపం నిష్క్రియాత్మకమైనప్పటికీ ఇక్కడ ‘కలిసి వచ్చారు/సమావేశమయ్యారు’ అనే అకర్మక భావం ఉంది. ఈ సందర్భంలో ‘సమావేశమయ్యారు’ సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: οἱ ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఇది ప్రధాన యాజకత్వ అధికారుల సమూహాన్ని సూచించే ప్రామాణిక తెలుగు పదబంధం; అనేకమంది ‘మహాయాజకులు’ ఉన్నారనే అపార్థాన్ని నివారిస్తుంది.
- source_word: οἱ Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూదు మతవర్గానికి తెలుగులో స్థిరపడిన రూపం.
- source_word: πρὸς Πιλᾶτον
  choice: పిలాతు వద్ద
  rationale: వ్యక్తిని ఉద్దేశించి కూడివచ్చిన భావాన్ని πρός ఇక్కడ తెలియజేస్తుంది. ‘పిలాతు వద్ద’ అనేది అతని సమక్షంలో సమావేశమైన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: Πιλᾶτον
  choice: పిలాతు
  rationale: Πιλᾶτος అనే వ్యక్తినామానికి తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
