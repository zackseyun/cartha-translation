  source_fidelity: The draft accurately conveys the accusation-question and preserves the passive force of σταυρωθήτω. However, ἔφη is a simple speech introduction ('he said'), not specifically 'he asked'; and the imperfect ἔκραζον is better represented with an explicit continuing/repeated expression.
  naturalness: The revision uses natural modern standard Telugu while retaining the heightened public-demand register. 'మరింతగా కేకలు వేస్తూనే ఉన్నారు' clearly expresses the escalating, ongoing cry.
  terminology: '''చెడు'' suitably represents κακόν, and ''సిలువ వేయబడాలి'' appropriately preserves the Greek passive imperative without supplying an agent.'
  issues:
  - severity: medium
    issue: ‘అని అడిగాడు’ narrows ἔφη.
    rationale: Although the quoted speech is a question, φημί here introduces speech simply. ‘అన్నాడు’ follows the source more closely; a footnote may note ‘అడిగాడు’ as an idiomatic contextual alternative.
  - severity: medium
    issue: ‘కేకలు వేస్తూ ... అన్నారు’ does not clearly retain the imperfect, repeated/durative force of ἔκραζον.
    rationale: The Greek imperfect depicts the crowd continuing or repeatedly crying out. ‘కేకలు వేస్తూనే ఉన్నారు’ makes this aspect explicit and idiomatic.
  - severity: low
    issue: ‘అప్పుడు’ adds a temporal nuance not expressed by the first δέ.
    rationale: Here δέ primarily continues the narrative; beginning directly with ‘అతడు అన్నాడు’ avoids adding a temporal relation while remaining natural.
