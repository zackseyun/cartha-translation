id: MAT.27.23
reference: Matthew 27:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη· Τί γὰρ κακὸν ἐποίησεν; οἱ δὲ περισσῶς ἔκραζον λέγοντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: te
  text: అతడు అన్నాడు[a], “అసలు ఇతడు ఏ చెడు చేశాడు?” అయితే వారు మరింతగా కేకలు వేస్తూనే, “ఇతడు సిలువ వేయబడాలి!”[b] అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'సందర్భానుసారమైన ప్రత్యామ్నాయం: “అతడు అడిగాడు.” గ్రీకులో సాధారణంగా, “అతడు అన్నాడు” అని ఉంది.'
    reason: lexical_alternative
  - marker: b
    text: 'సహజమైన తెలుగు ఆజ్ఞగా: “ఇతడిని సిలువ వేయండి!” గ్రీకులో నిష్క్రియ ఆజ్ఞార్థక రూపం ఉంది; మరింత పదానుసారంగా, “ఇతడు సిలువ వేయబడాలి.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: అని అడిగాడు
  rationale: φημί యొక్క భూతకాల రూపం సాధారణంగా మాటను పరిచయం చేస్తుంది; ఇక్కడ ప్రశ్న ఉన్నందున సహజమైన తెలుగులో ‘అని అడిగాడు’ అని ఇచ్చాం.
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: ఇతడు చేసిన చెడు ఏమిటి?
  rationale: τί ... κακόν అనే ప్రశ్నను సహజంగా ఉంచుతూ, κακόν లోని నైతిక భావాన్ని ‘చెడు’ ద్వారా నిలిపాం; γάρ ఇక్కడ ప్రతివాద ప్రశ్నకు బలం ఇస్తుంది, దాన్ని విడిగా అసహజమైన అనుసంధాన పదంతో అనువదించలేదు.
- source_word: περισσῶς
  choice: ఇంకా ఎక్కువగా
  rationale: గుంపు ప్రతిస్పందన మరింత తీవ్రమైందనే భావాన్ని ఇస్తుంది; కేవలం శబ్దం పెరిగిందని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἔκραζον
  choice: కేకలు వేస్తూ
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను తెలుగు క్రియారూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λέγοντες
  choice: అన్నారు
  rationale: కేకలలో వారు పలికిన మాటను సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంలో తెలిపింది.
- source_word: Σταυρωθήτω
  choice: ఇతడు సిలువ వేయబడాలి
  rationale: మూడవ పురుష ఏకవచన నిష్క్రియ ఆజ్ఞార్థక రూపాన్ని సాధ్యమైనంత స్పష్టంగా నిష్క్రియ రూపంలో నిలిపాం.
- source_word: ὁ δὲ ... οἱ δὲ
  choice: అప్పుడు అతడు ... అయితే వారు
  rationale: మొదటి δέ కథన కొనసాగింపును, రెండవది పిలాతు ప్రశ్నకు గుంపు ప్రతిస్పందనలోని వ్యత్యాసాన్ని సహజ తెలుగులో చూపుతాయి.
theological_decisions:
- issue: సిలువ మరణం కోరిన గుంపు మాటలోని నిష్క్రియ ఆజ్ఞార్థకం
  choice: ఇతడు సిలువ వేయబడాలి
  alternative: ఇతడిని సిలువ వేయండి
  rationale: σταυρωθήτω నిష్క్రియ ఆజ్ఞార్థక రూపం. నిష్క్రియ అనువాదం కార్యనిర్వాహకుడిని మూలపాఠం కంటే స్పష్టంగా చేర్చకుండా, దాని వ్యాకరణ రూపాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే న్యాయవిచారణ సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. ‘సిలువ వేయబడాలి’ కొంత పదానుసారమైన నిర్మాణమైనప్పటికీ, గ్రీకు నిష్క్రియ ఆజ్ఞార్థకాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
