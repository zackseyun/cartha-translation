source:
  edition: SBLGNT
  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: te
  text: వెంటనే వారిలో ఒకడు పరుగెత్తి, ఒక స్పాంజిని తీసుకుని, దాన్ని పుల్లని ద్రాక్షారసంతో[a] నింపి, ఒక రెల్లుకు తగిలించి, ఆయనకు తాగిస్తూ ఉన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “వెనిగర్.” గ్రీకు పదం పుల్లని ద్రాక్షారసాన్ని లేదా ద్రాక్షారసపు వెనిగర్‌ను సూచించవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు క్రియారూపం కొనసాగుతున్న లేదా ప్రయత్నంగా జరుగుతున్న చర్యను సూచించవచ్చు.
    reason: aspectual_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: వెంటనే
  rationale: వెంటనే జరిగిన చర్యను సహజమైన ఆధునిక తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: δραμὼν
  choice: పరుగెత్తి
  rationale: గ్రీకు ఏఓరిస్టు కృదంతాన్ని, తరువాతి చర్యలతో సహజంగా అనుసంధానించే తెలుగు క్రియారూపంగా అనువదిస్తుంది.
- source_word: εἷς ἐξ αὐτῶν
  choice: వారిలో ఒకడు
  rationale: ఆ గుంపులోని ఒక్క వ్యక్తి చర్య చేశాడనే భాగసూచక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: λαβὼν σπόγγον
  choice: ఒక స్పంజిని తీసుకుని
  rationale: చర్యల క్రమాన్ని స్పష్టంగా నిలుపుతూ σπόγγος అనే వస్తువుకు ప్రస్తుత తెలుగులో అర్థమయ్యే పదాన్ని ఉపయోగిస్తుంది.
- source_word: πλήσας τε ὄξους
  choice: దాన్ని పులిసిన ద్రాక్షారసంతో నింపి
  rationale: ὄξος సూచించే పుల్లబడిన ద్రాక్షారసం లేదా ద్రాక్షారసపు వెనిగర్ భావంలో, పానీయమనే సందర్భాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: περιθεὶς καλάμῳ
  choice: ఒక రెల్లుకర్రకు తగిలించి
  rationale: స్పంజిని καλάμος మీద అమర్చిన చర్యను, 'రెల్లు' అనే మూలభావాన్ని నిలుపుతూ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐπότιζεν αὐτόν
  choice: ఆయనకు తాగించాడు
  rationale: ποτίζω యొక్క కారణార్థక భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; అసంపూర్ణ భూతకాలపు కొనసాగుతున్న భావాన్ని పాదటీపీలో నిలుపుతుంది.
theological_decisions:
- issue: యేసుకు ఇచ్చిన పానీయం స్వభావం
  choice: పులిసిన ద్రాక్షారసం
  alternative: వెనిగర్ / ద్రాక్షారసపు వెనిగర్
  rationale: ὄξος పుల్లబడిన ద్రాక్షారసాన్ని లేదా ద్రాక్షారసపు వెనిగర్‌ను సూచించగలదు. ప్రధాన పాఠ్యంలో 'పులిసిన ద్రాక్షారసం' అని ఇవ్వడం దాన్ని ఆధునిక వంట వెనిగర్‌గా తప్పుగా అర్థం చేసుకునే అవకాశాన్ని తగ్గిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటీపీలో ఉంచుతుంది.
- issue: ἐπότιζεν క్రియలోని అసంపూర్ణ భూతకాల భావం
  choice: తాగించాడు
  alternative: తాగిస్తూ ఉన్నాడు
  rationale: సందర్భంలో సహజమైన తెలుగు కథనానికి సంపూర్ణ చర్యారూపాన్ని ప్రధాన పాఠ్యంలో వాడుతూ, గ్రీకు అసంపూర్ణ భూతకాలం సూచించగల కొనసాగుతున్న లేదా ప్రయత్నాత్మక భావాన్ని పాదటీపీలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. చర్యల వరుసను తెలుగు కృదంతాలతో సహజంగా కలిపింది; మూలంలోని పదార్థ సంబంధిత మరియు క్రియాంశ సంబంధిత సందిగ్ధతలను పాదటీపీల్లో నిలిపింది.
