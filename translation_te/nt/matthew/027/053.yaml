source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: te
  text: ఆయన పునరుత్థానం తరువాత సమాధుల నుండి బయటికి వచ్చి, వారు పవిత్ర నగరంలోకి ప్రవేశించి అనేకమందికి కనిపించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో “ఆయన పునరుత్థానం తరువాత” అనే మాటలు “సమాధుల నుండి బయటికి వచ్చి” అనే భాగం తరువాత, “వారు పవిత్ర నగరంలోకి ప్రవేశించారు” అనే ప్రధాన క్రియకు ముందు ఉన్నాయి. కాబట్టి వాటిని బయటికి రావడంతో అనుసంధానించవచ్చు; నగరంలో ప్రవేశించడంతో అనుసంధానించే అవకాశం కూడా ఉంది. “పవిత్ర నగరం” అంటే యెరూషలేము.
    reason: alternative_reading; cross_reference
lexical_decisions:
- source_word: ἐξελθόντες
  choice: బయటికి వచ్చి
  rationale: అనంతర ప్రధాన క్రియతో సహజంగా అనుసంధానమయ్యే పూర్వకాల క్రియాభావాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: μνημείων
  choice: సమాధుల
  rationale: ముందటి వచనంలో తెరుచుకున్న శవపేటిక స్థలాలను సూచించే μνημεῖονకు సందర్భోచితమైన సాధారణ తెలుగు పదం.
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: ఆయన పునరుత్థానం తరువాత
  rationale: μετά + ద్వితీయా విభక్తి కాలార్థకమైన ‘తరువాత’ను ఇస్తుంది; సందర్భంలో αὐτοῦ యేసును సూచిస్తుంది. ‘పునరుత్థానం’ గౌరవప్రదమైన, విస్తృతంగా అర్థమయ్యే పదం.
- source_word: εἰσῆλθον
  choice: ప్రవేశించి
  rationale: సరళ కథనంలోని ‘లోపలికి వెళ్లారు’ అనే భావాన్ని సహజంగా తెలియజేస్తూ తదుపరి సమాపక క్రియతో కలుపుతుంది.
- source_word: τὴν ἁγίαν πόλιν
  choice: పవిత్ర నగరం
  rationale: యెరూషలేమును సూచించే బైబిలీయ విశేషణాన్ని వివరణగా మార్చకుండా నిలుపుతుంది.
- source_word: ἐνεφανίσθησαν
  choice: కనిపించారు
  rationale: ఇతరులకు దృశ్యమయ్యారు లేదా ప్రత్యక్షమయ్యారు అనే మధ్య/కర్మణి భావాన్ని సహజ తెలుగులో ఇస్తుంది.
- source_word: πολλοῖς
  choice: అనేకమందికి
  rationale: వ్యక్తులు ఉద్దేశించబడ్డారని తెలుగులో స్పష్టంగా, గ్రీకు అనిర్దిష్ట బహువచన భావానికి దగ్గరగా తెలియజేస్తుంది.
theological_decisions:
- issue: సమాధుల నుండి బయటికి రావడం మరియు ‘ఆయన పునరుత్థానం తరువాత’ అనే కాలపదబంధం మధ్య సంబంధం
  choice: ‘ఆయన పునరుత్థానం తరువాత సమాధుల నుండి బయటికి వచ్చి’ అని ఉంచి, పునరుత్థానం తరువాత వారు బయటికి వచ్చారనే సహజ వాక్యనిర్మాణాన్ని నిలిపాం.
  alternative: కాలపదబంధాన్ని ప్రధాన క్రియతో కలిపి, వారు ముందే బయటికి వచ్చి యేసు పునరుత్థానం తరువాత నగరంలో ప్రవేశించారని అర్థం చేసుకోవచ్చు.
  rationale: గ్రీకులో కాలపదబంధం సమాధుల నుండి బయటికి రావడాన్ని తెలిపే అసమాపక క్రియ తరువాత, ప్రధాన క్రియకు ముందు ఉంది. అనువాదం ఈ క్రమాన్ని కాపాడుతుంది; అయినా విరామచిహ్నాలు లేని మూల వాక్యంలోని అనుసంధాన సాధ్యతను పాదటిప్పణిలో గుర్తిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి. మూలంలోని పదక్రమం వల్ల కలిగే కాలసంబంధ అస్పష్టతను ప్రధాన పాఠ్యంలో సహజమైన పఠనంతో అందించి, ప్రత్యామ్నాయ అనుసంధానాన్ని పాదటిప్పణిలో నిలిపాం.
