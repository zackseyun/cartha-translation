revisions:
- from: తొమ్మిదవ గంట సమయంలో యేసు బిగ్గరగా కేకవేస్తూ[a], “ఏలీ, ఏలీ, లెమా సబక్తానీ?” అన్నాడు. దాని అర్థం, “నా దేవా, నా దేవా, నన్ను ఎందుకు విడిచిపెట్టావు[b]?”
  to: సుమారు తొమ్మిదవ గంటకు యేసు బిగ్గరగా కేక వేసి[a] ఇలా అన్నాడు, “ఏలీ, ఏలీ, లెమా సబక్తానీ?” అంటే, “నా దేవా, నా దేవా, నన్ను ఎందుకు విడిచిపెట్టావు[b]?”
  rationale: The revision corrects the temporal nuance of περί and replaces an awkward durative Telugu construction with a natural completed cry followed by speech. It retains Matthew’s Semitic cry and explanatory translation, the repeated direct address, and the unsoftened question of abandonment. Footnote anchors remain attached to their respective referents, and the footnote wording is clarified without adding theological interpretation.
