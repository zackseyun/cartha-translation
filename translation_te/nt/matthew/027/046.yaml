id: MAT.27.46
reference: Matthew 27:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: te
  text: సుమారు తొమ్మిదవ గంటకు యేసు బిగ్గరగా కేక వేసి[a] ఇలా అన్నాడు, “ఏలీ, ఏలీ, లెమా సబక్తానీ?” అంటే, “నా దేవా, నా దేవా, నన్ను ఎందుకు విడిచిపెట్టావు[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ మాటలు కీర్తన 22:1ను ప్రతిధ్వనింపజేస్తాయి.
    reason: cross_reference
  - marker: b
    text: గ్రీకులోని క్రియ ఏఓరిస్ట్ భూతకాలంలో ఉంది; దీనిని మరింత సంక్షిప్తంగా ‘నన్ను ఎందుకు విడిచావు?’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: తొమ్మిదవ గంట సమయంలో
  rationale: περί కాలబిందువు విషయంలో ‘సుమారు/సమయంలో’ అనే భావాన్ని ఇస్తుంది. δέ స్వల్ప అనుసంధాన పదం; తెలుగులో అనవసరమైన ‘అప్పుడు’ చేర్చకుండా సహజ వాక్యప్రవాహంలో ఉంచబడింది.
- source_word: ἀνεβόησεν … φωνῇ μεγάλῃ
  choice: బిగ్గరగా కేకవేస్తూ
  rationale: క్రియలోని గట్టిగా మొరపెట్టడం అనే భావాన్నీ, φωνῇ μεγάλῃలోని శబ్ద తీవ్రతనూ సహజమైన ఆధునిక తెలుగులో కలిపి వ్యక్తం చేస్తుంది.
- source_word: λέγων
  choice: అన్నాడు
  rationale: ఈ కృదంతం కేకలో పలికిన మాటలను పరిచయం చేస్తుంది. తెలుగులో ప్రత్యక్ష ఉక్తి తరువాత ‘అన్నాడు’ సహజంగా ఉంటుంది.
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: ఏలీ, ఏలీ, లెమా సబక్తానీ?
  rationale: మత్తయి సెమిటిక్ పలుకును అలాగే ఇచ్చి తరువాత దాని అర్థాన్ని తెలుపుతున్నాడు; అందువల్ల ధ్వన్యంతరీకృత రూపం ప్రధాన పాఠ్యంలో నిలుపబడింది.
- source_word: τοῦτ’ ἔστιν
  choice: దాని అర్థం
  rationale: ముందున్న సెమిటిక్ పలుకుకు అనువాదం లేదా వివరణను పరిచయం చేసే సహజ తెలుగు ప్రయోగం.
- source_word: Θεέ μου θεέ μου
  choice: నా దేవా, నా దేవా
  rationale: సంబోధననూ దాని పునరుక్తినీ యథాతథంగా నిలుపుతుంది; కీర్తన 22:1 ప్రతిధ్వనినీ కాపాడుతుంది.
- source_word: ἱνατί
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే పదానికి సరళమైన, సహజమైన తెలుగు సమానం.
- source_word: ἐγκατέλιπες
  choice: విడిచిపెట్టావు
  rationale: ఈ సందర్భంలో విడిచిపోవడం/త్యజించడం అనే గంభీర భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. గ్రీకు ఏఓరిస్ట్‌ను తెలుగు భూతకాల క్రియతో అనువదించడం వల్ల ఆ చర్య యొక్క వాస్తవికత నిలుస్తుంది; దాని కొనసాగుతున్న ఫలితాన్ని పాఠకుడు సందర్భం నుంచి గ్రహించగలడు.
theological_decisions:
- issue: యేసు మొరకు కీర్తన 22:1తో ఉన్న సంబంధం
  choice: దీనిని నిజమైన విడిచిపెట్టబడిన మొరగా నేరుగా అనువదిస్తూ, కీర్తన పదప్రతిధ్వనిని నిలిపి, దాని లోతైన దైవశాస్త్ర వివరణను అనువాదంలో నిర్ణయించకుండా వదిలివేయడం.
  alternative: దీనిని ప్రధానంగా కీర్తనకు సూచనగా మాత్రమే చూపడం, లేదా విడిచిపెట్టబడిన భావాన్ని మృదువుగా పరామర్శించడం.
  rationale: గ్రీకు పాఠ్యం ఎలాంటి వివరణాత్మక పరిమితి లేకుండా యేసు మొరను ఇస్తుంది. నేరుగా ఉన్న భాషను నిలపడం ద్వారా అనుభవ తీవ్రతనూ కీర్తన ప్రతిధ్వనినీ, వాటి మధ్యనున్న దైవశాస్త్ర ఉద్వేగాన్నీ కాపాడుతుంది.
- issue: సెమిటిక్ మొరను ప్రధాన పాఠ్యంలో ఉంచడం
  choice: ధ్వన్యంతరీకృత సెమిటిక్ మాటలను ప్రధాన పాఠ్యంలో ఉంచి, వెంటనే వాటి అర్థాన్ని ఇవ్వడం.
  alternative: సెమిటిక్ మాటలను తొలగించి వాటి తెలుగు అర్థాన్ని మాత్రమే ఇవ్వడం.
  rationale: మత్తయి స్వయంగా అసలు మొరను నిలిపి తరువాత అనువదిస్తున్నాడు. రెండింటినీ ఉంచడం మూలపాఠ్య నిర్మాణాన్ని, అలాగే చుట్టుపక్కలవారు ‘ఏలీ’ని ఏలీయాకు చేసిన పిలుపుగా అపార్థం చేసుకునే కథన నేపథ్యాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా సిలువ దృశ్యానికి తగిన గంభీరతతో అనువదించబడింది. మూలంలోని సెమిటిక్ పలుకు ధ్వన్యంతరీకరణగా నిలుపబడింది; వివరణాత్మక తెలుగు వెంటనే ఇవ్వబడింది.
