  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ καθήμενοι ἐτήρουν αὐτὸν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/036.yaml
  text: And sitting there[a], they kept watch over him.
translation:
  language: te
  text: వారు అక్కడ కూర్చొని[a] ఆయనకు కాపలా కాస్తూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు అక్కడ కూర్చున్న తర్వాత ఆయనకు కాపలా కాస్తూ ఉన్నారు.’
    reason: కృదంతమైన καθήμενοι ని అనుబంధ పరిస్థితిగా లేదా ముందుగా జరిగిన చర్యగా అర్థం చేసుకునే వ్యాకరణ అవకాశాన్ని చూపుతుంది; మూలపాఠం ఆ కాలసంబంధాన్ని ఖచ్చితంగా నిర్ణయించదు.
lexical_decisions:
- source_word: καὶ
  choice: వారు
  rationale: గ్రీకు καὶ సాధారణ సముచ్చయ అవ్యయం. అయితే ఈ ఒక్క వాక్యంలో సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణం కోసం మునుపటి వాక్యంలోని సైనికులను సూచించే కర్తను స్పష్టంగా వ్యక్తపరచి, ప్రత్యేకంగా ‘మరియు’ అనకుండా కథన కొనసాగింపును నిలిపాం.
- source_word: καθήμενοι
  choice: కూర్చొని
  rationale: κάθημαι వర్తమాన కృదంతం ప్రధాన క్రియతోపాటు జరుగుతున్న స్థితిని సూచిస్తుంది; ‘కూర్చొని’ సహజంగా ఆ అనుబంధ పరిస్థితిని తెలియజేస్తుంది. ‘కూర్చున్న తర్వాత’ అని అనువదిస్తే మూలంలో తప్పనిసరిగా లేని కాలక్రమ భావం బలపడుతుంది.
- source_word: ἐτήρουν
  choice: కాపలా కాస్తూ ఉన్నారు
  rationale: τηρέω ఇక్కడ గమనిస్తూ కాపాడటం లేదా తప్పించుకోకుండా పర్యవేక్షించడం అనే భావంలో ఉంది. అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను ‘కాస్తూ ఉన్నారు’ వ్యక్తపరుస్తుంది.
- source_word: αὐτὸν
  choice: ఆయనకు
  rationale: సర్వనామం యేసును సూచిస్తుంది. ‘కాపలా కాయడం’ అనే తెలుగు ప్రయోగంలో వ్యక్తి సాధారణంగా సంప్రదాన విభక్తితో వస్తాడు; గౌరవప్రదమైన ‘ఆయనకు’ సహజమైన సమానార్థకం.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: చర్య జరిగిన స్థలాన్ని సూచించే సూటి, సహజమైన తెలుగు స్థలవాచక అవ్యయం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్ని ‘కాస్తూ ఉన్నారు’తో నిలిపి, మూలంలోని కృదంత సంబంధానికి ఉన్న స్వల్ప అస్పష్టతను పాదసూచికలో ఉంచాం.
