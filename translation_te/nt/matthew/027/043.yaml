source:
  edition: SBLGNT
  text: πέποιθεν ἐπὶ τὸν θεόν, ῥυσάσθω ⸀νῦν εἰ θέλει αὐτόν· εἶπεν γὰρ ὅτι Θεοῦ εἰμι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: te
  text: “అతడు దేవునిపై నమ్మకం ఉంచాడు; దేవుడు అతణ్ణి కోరుకుంటే[a], ఇప్పుడు అతణ్ణి రక్షించుగాక. ఎందుకంటే, ‘నేను దేవుని కుమారుణ్ణి’ అని అతడు చెప్పాడు[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనిపట్ల ఆనందిస్తే.” ఈ మాటలు కీర్తన 22:8ను ప్రతిధ్వనింపజేస్తాయి; అక్కడ దేవుని అనుగ్రహం అనే భావం ప్రముఖంగా ఉంటుంది.
    reason: alternative_reading
  - marker: b
    text: ఈ వెక్కిరింపు కీర్తన 22:8ను దగ్గరగా ప్రతిధ్వనింపజేస్తూ, యేసును ఆ కీర్తనలోని నీతిమంతుడైన బాధితునితో అనుసంధానిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: πέποιθεν ἐπὶ τὸν θεόν
  choice: దేవునిపై నమ్మకం పెట్టుకున్నాడు
  rationale: πέποιθεν అనే పరిపూర్ణ కాలరూపం గతంలో ఉంచిన నమ్మకం కొనసాగుతున్న స్థితిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నమ్మకం పెట్టుకున్నాడు’ సహజంగా ఉండి, దేవునిపై ఆధారపడిన భావాన్ని నిలుపుతుంది.
- source_word: ῥυσάσθω νῦν
  choice: ఇప్పుడే ... విడిపించాలి
  rationale: ῥύομαι ప్రమాదం లేదా ఆపద నుంచి విడిపించడాన్ని సూచిస్తుంది; νῦν వెక్కిరింపు సవాలులోని తక్షణత్వాన్ని బలపరుస్తుంది. మూడవ పురుష ఆజ్ఞ యొక్క సవాలు ధ్వనిని ఆధునిక తెలుగులో ‘విడిపించాలి!’ అని అందించాం.
- source_word: εἰ θέλει αὐτόν
  choice: అతణ్ణి కోరుకుంటే
  rationale: θέλω యొక్క ప్రత్యక్ష అర్థం ‘కోరు/ఇష్టపడు’. కీర్తన 22:8 ప్రతిధ్వని వల్ల ‘అతనిపట్ల ఆనందిస్తే/అతనిని ఇష్టపడితే’ అనే అనుబంధ భావం సాధ్యమైనా, ప్రధాన పాఠంలో గ్రీకు పదానికి దగ్గరైన అర్థాన్ని ఉంచాం.
- source_word: Θεοῦ εἰμι υἱός
  choice: నేను దేవుని కుమారుణ్ణి
  rationale: మత్తయి సువార్త సందర్భంలో ఇది సాధారణ దైవసంబంధాన్ని కాక క్రీస్తు సంబంధమైన గుర్తింపు వాదనను సూచిస్తుంది. తెలుగు నిర్మాణం నిర్దిష్టమైన ‘దేవుని కుమారుడు’ అనే బిరుదు బలాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Θεοῦ ... υἱός అనే క్రీస్తు సంబంధమైన వ్యక్తీకరణ
  choice: నేను దేవుని కుమారుణ్ణి
  alternative: నేను దేవుని కుమారుడిని / నేను దేవుని కుమారులలో ఒకణ్ణి
  rationale: గ్రీకులో υἱός ముందు ఉపపదం లేకపోయినా, విధేయ నామవాచక నిర్మాణం మరియు మత్తయి కథన సందర్భం దీన్ని అనిర్దిష్టమైన ‘ఒక కుమారుడు’గా కాక గుర్తింపును తెలిపే బిరుదుగా చూపుతాయి.
- issue: θέλει αὐτόνలోని భావ ఛాయ
  choice: అతణ్ణి కోరుకుంటే
  alternative: అతనిపట్ల ఆనందిస్తే / అతణ్ణి ఇష్టపడితే
  rationale: ప్రధాన పాఠం θέλω యొక్క సాధారణ అర్థాన్ని అనుసరిస్తుంది. కీర్తన 22:8తో ఉన్న సంబంధం వల్ల కలిగే దైవానుగ్రహం లేదా ఆనందం అనే భావాన్ని పాదసూచికలో ఉంచి, అసలులోని భావసాధ్యతను మూసివేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైనప్పటికీ సహజమైన శైలి వాడబడింది. వెక్కిరింపు స్వరాన్ని ఆశ్చర్యార్థకం ద్వారా స్పష్టం చేశాం; ‘అతడు/అతణ్ణి’ రూపాలు మాట్లాడుతున్న ప్రత్యర్థుల స్వరానికి సరిపోతాయి.
