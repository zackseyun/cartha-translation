revisions:
- from: “అతడు దేవునిపై నమ్మకం పెట్టుకున్నాడు. దేవుడు అతణ్ణి కోరుకుంటే[a], ఇప్పుడే అతణ్ణి విడిపించాలి! ఎందుకంటే, ‘నేను దేవుని కుమారుణ్ణి’ అని అతడు చెప్పాడు[b].”
  to: “అతడు దేవునిపై నమ్మకం ఉంచాడు; దేవుడు అతణ్ణి కోరుకుంటే[a], ఇప్పుడు అతణ్ణి రక్షించుగాక. ఎందుకంటే, ‘నేను దేవుని కుమారుణ్ణి’ అని అతడు చెప్పాడు[b].”
  rationale: The revision corrects the imperative force of ῥυσάσθω and makes God—the implied subject—explicit for clarity in Telugu. It retains the Greek perfect’s resulting-state sense, the direct meaning “if he wants him” for θέλει αὐτόν, the immediacy of νῦν, and the contextual title “Son of God.” Footnote anchors and their functions are preserved.
