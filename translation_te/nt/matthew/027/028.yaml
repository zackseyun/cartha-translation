  terminology: “పైవస్త్రం” accurately preserves the broader sense of χλαμύς. “ఎర్రని” is a natural rendering of κοκκίνην; the footnote retains the more specific ‘scarlet’ nuance and notes the garment’s possible cloak-like/military association.
