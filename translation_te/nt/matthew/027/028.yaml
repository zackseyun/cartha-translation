  text: καὶ ἐκδύσαντες αὐτὸν ⸂χλαμύδα κοκκίνην περιέθηκαν αὐτῷ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/028.yaml
  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: te
  text: వారు ఆయన బట్టలు తీసివేసి, ఆయనకు ఎర్రని పైవస్త్రం[a] తొడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్కార్లెట్ రంగు అంగీ.” గ్రీకు పదం బయట ధరించే వస్త్రాన్ని, తరచుగా సైనికులతో సంబంధమున్న పొట్టి అంగీని, సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδύσαντες
  choice: బట్టలు తీసివేసి
  rationale: ἐκδύω అంటే బట్టలు తొలగించడం లేదా విప్పడం. కర్తలు ఆయనే ధరించిన బట్టలను తీసివేశారని తెలుగులో సహజంగా తెలియజేస్తూ, ఈ చర్య ప్రధాన క్రియకు ముందుగా జరిగిందనే సంబంధాన్ని నిలుపుతుంది.
- source_word: χλαμύδα
  choice: అంగరఖా
  rationale: χλαμύς సాధారణంగా సైనికులు లేదా అధికారులతో సంబంధమున్న పొట్టి పైవస్త్రాన్ని సూచిస్తుంది. ‘అంగరఖా’ దీనిని గౌరవప్రదమైన ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; వస్త్ర స్వరూపాన్ని మరీ నిర్దిష్టం చేయకుండా ఉంటుంది.
- source_word: κοκκίνην
  choice: ఎర్రని
  rationale: κόκκινος ప్రకాశవంతమైన ఎరుపు లేదా స్కార్లెట్ రంగును సూచిస్తుంది. సాధారణ ఆధునిక తెలుగు పాఠకులకు ‘ఎర్రని’ స్పష్టంగా, సహజంగా ఉంటుంది; ఖచ్చితమైన వర్ణఛాయను పాదసూచిక వివరిస్తుంది.
- source_word: περιέθηκαν αὐτῷ
  choice: ఆయనకు ... తొడిగారు
  rationale: περιτίθημι దత్తివుతో ఇక్కడ ఒక వస్త్రాన్ని ఎవరికైనా చుట్టడం లేదా వారిపై ఉంచడాన్ని సూచిస్తుంది. వస్త్ర సందర్భంలో ‘తొడిగారు’ సహజమైన తెలుగు ప్రయోగం.
- source_word: καὶ
  choice: వారు
  rationale: క్రమబద్ధ కథనంలో καί కలిపే సంబంధాన్ని చూపుతుంది. ఈ ఒక్క వచనాన్ని తెలుగులో సహజంగా చదివించేందుకు ప్రత్యేకంగా ‘మరియు’ చేర్చకుండా వాక్యక్రమంలో ఆ సంబంధం అంతర్భూతంగా ఉంచబడింది.
theological_decisions:
- issue: ఎగతాళి సందర్భంలో ఉపయోగించిన వస్త్ర స్వరూపం
  choice: ఎర్రని అంగరఖా
  alternative: ఎర్రని పైవస్త్రం; స్కార్లెట్ అంగరఖా
  rationale: ఈ సందర్భం యేసుకు రాజవేషం వేసి ఎగతాళి చేయడాన్ని చిత్రిస్తుంది. χλαμύς యొక్క వస్త్రార్థాన్ని నిలుపుతూ, గ్రీకు పదం స్వయంగా తెలిపేదానికంటే అదనపు రాజసంబంధ భావాన్ని అనువాదం ద్వారా బలవంతంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అంగరఖా’ వస్త్రానికి తగిన నిర్దిష్టతను ఇస్తుంది; ‘ఎర్రని’ సాధారణ పాఠకులకు అందుబాటులో ఉండగా, స్కార్లెట్ వర్ణఛాయను పాదసూచికలో నిలిపాం.
