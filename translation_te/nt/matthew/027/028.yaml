  source_fidelity: 'The sequence of actions is retained: the soldiers remove Jesus’ clothing and then place a scarlet-colored outer garment on him. However, “అంగరఖా” commonly denotes a particular tailored coat-like garment in Telugu and is too culturally and materially specific for χλαμύς, which is more broadly an outer cloak or mantle.'
