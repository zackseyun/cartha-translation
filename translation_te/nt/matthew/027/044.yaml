source:
  edition: SBLGNT
  text: τὸ δ’ αὐτὸ καὶ οἱ λῃσταὶ οἱ συσταυρωθέντες ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: te
  text: అదే విధంగా[a], ఆయనతో పాటు సిలువ వేయబడిన దొంగలు సైతం ఆయనను దూషిస్తూ[b] ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అదే విషయం.’ ఈ గ్రీకు నుడికారం, వారు కూడా ముందుగా చెప్పినవారిలాగే ఆయనతో ప్రవర్తించారని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అవమానిస్తూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: అదే విధంగా
  rationale: ఈ గ్రీకు పదబంధం ఇక్కడ క్రియావిశేషణ భావంలో ఉండి, ఇంతకుముందు వివరించిన ఎగతాళినే సూచిస్తుంది. ‘అదే విధంగా’ అనేది ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ
  choice: సైతం
  rationale: ఇక్కడ καί కేవలం ‘మరియు’ అనే కలుపు భావం కాకుండా, ఆయనతో సిలువ వేయబడిన దొంగలు కూడా ఆ దూషణలో చేరారనే నొక్కిచెప్పే భావాన్ని ఇస్తుంది.
- source_word: λῃσταὶ
  choice: దొంగలు
  rationale: λῃστής దొంగను లేదా దోపిడీదారుణ్ణి సూచించగలదు. రాజకీయ తిరుగుబాటుదారులు అనే నిర్దిష్ట భావాన్ని చేర్చకుండా, సాధారణ పాఠకులకు స్పష్టంగా ఉండే ‘దొంగలు’ ఎంచుకోబడింది.
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: ఆయనతో పాటు సిలువ వేయబడిన
  rationale: ఈ విశేషణార్థక కృదంత పదబంధం యేసుతో కలిసి సిలువ వేయబడినవారిగా ఆ దొంగలను గుర్తిస్తుంది; కర్మణి భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ὠνείδιζον
  choice: దూషిస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతున్న చర్యను సూచిస్తుంది. ‘దూషిస్తూ ఉన్నారు’ ఆ కొనసాగింపు భావాన్నీ, నిందాపూర్వకంగా మాట్లాడిన అర్థాన్నీ అందిస్తుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: ఇది యేసును సూచించే ప్రత్యక్ష కర్మ సర్వనామం. గౌరవప్రదమైన తెలుగు కథన శైలికి అనుగుణంగా ‘ఆయనను’ వాడబడింది.
theological_decisions:
- issue: లూకా వృత్తాంతంలో ఒక నేరస్థుడు భిన్నంగా మాట్లాడిన వివరంతో సమన్వయం చేయాలా?
  choice: మత్తయి వాక్యంలో ఉన్నట్లే బహువచనమైన ‘దొంగలు’ అనే ప్రకటనను ఎలాంటి మృదీకరణ లేకుండా అనువదించడం.
  alternative: సువార్తల మధ్య కనిపించే ఉద్రిక్తతను తగ్గించేందుకు బహువచన భావాన్ని అస్పష్టంగా లేదా ఏకవచనంలా అనువదించడం.
  rationale: గ్రీకు మూలంలో ‘దొంగలు’ అనే బహువచన నామవాచకమూ, దానికి అనుగుణమైన బహువచన క్రియయూ స్పష్టంగా ఉన్నాయి. అందువల్ల ఇతర సువార్త వృత్తాంతంతో సమన్వయం చేయడానికి మత్తయి మాటలను మార్చకుండా వాటి ఉద్రిక్తతను యథాతథంగా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘సైతం’ ద్వారా καί లోని నొక్కిచెప్పే భావం, ‘దూషిస్తూ ఉన్నారు’ ద్వారా అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావం నిలుపబడ్డాయి.
