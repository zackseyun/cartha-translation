  text: τότε ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, τὸν δὲ Ἰησοῦν φραγελλώσας παρέδωκεν ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: te
  text: అప్పుడు అతడు బరబ్బాను వారికి విడుదల చేశాడు. అయితే యేసును కొరడాలతో కొట్టించి[a], సిలువ వేయించడానికి అప్పగించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు క్రియ రోమా పాలనలో అమలైన కొరడా దెబ్బల శిక్షను సూచిస్తుంది; దీనిని “కొరడా దెబ్బలు కొట్టించి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలోని సంఘటనల క్రమాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπέλυσεν
  choice: విడుదల చేశాడు
  rationale: ఖైదీని న్యాయపరంగా విడిచిపెట్టే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: విడుదల వల్ల లబ్ధి పొందిన ప్రజలను సూచించే దత్తివిభక్తి భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: Βαραββᾶν
  choice: బరబ్బాను
  rationale: వ్యక్తి పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: δὲ
  choice: అయితే
  rationale: బరబ్బా విడుదలకు, యేసుకు జరిగిన దానికి మధ్య ఉన్న వ్యత్యాసాన్ని సహజంగా చూపిస్తుంది.
- source_word: Ἰησοῦν
  choice: యేసును
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: φραγελλώσας
  choice: కొరడాలతో కొట్టించి
  rationale: రోమా శిక్షలోని కొరడా దెబ్బలను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది; అసమాపక క్రియారూపం ఈ చర్య అప్పగించడానికి ముందు జరిగిందని చూపిస్తుంది.
- source_word: παρέδωκεν
  choice: అప్పగించాడు
  rationale: ఒక నిర్దిష్ట శిక్ష అమలు కోసం అధికారుల చేతికి అప్పగించే న్యాయపరమైన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἵνα σταυρωθῇ
  choice: సిలువ వేయించడానికి
  rationale: ἵνα మరియు కర్మణి క్రియ వ్యక్తం చేసే ఉద్దేశిత ఫలితాన్ని సహజమైన తెలుగులో చూపిస్తుంది; పిలాతు స్వయంగా సిలువ వేసినట్లు కాక, అది జరిగేలా అప్పగించిన భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు శిక్షలో సంఘటనల క్రమం మరియు కర్తృత్వం
  choice: పిలాతు బరబ్బాను విడుదల చేసి, యేసును కొరడాలతో కొట్టించిన తర్వాత సిలువ వేయించడానికి అప్పగించాడు.
  alternative: యేసును అప్పగించిన తర్వాత కొరడాలతో కొట్టారు.
  rationale: φραγελλώσας అనే భూతకాల అసమాపక క్రియ ప్రధాన క్రియ παρέδωκεν కంటే ముందుగా జరిగిన చర్యను సహజంగా సూచిస్తుంది. రోమా విధానంపై అదనపు వ్యాఖ్యానాన్ని చేర్చకుండా గ్రీకు వాక్యంలోని క్రమాన్ని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. గ్రీకు వాక్యంలోని వ్యత్యాసం, చర్యల క్రమం, న్యాయపరమైన అప్పగింత స్పష్టంగా నిలుపబడ్డాయి. మూల ఆంగ్ల పాఠ్యంలో [a] గుర్తు ‘వారికి’ తర్వాత ఉన్నప్పటికీ, దాని గమనిక φραγελλώσας గురించి కావడంతో తెలుగులో సంబంధిత పదబంధం తర్వాత ఉంచబడింది.
