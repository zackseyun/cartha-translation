id: MAT.27.27
reference: Matthew 27:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: te
  text: అప్పుడు పాలకుని సైనికులు యేసును ప్రేతోరియంలోకి[a] తీసుకువెళ్లి, సైనిక దళమంతటినీ ఆయన చుట్టూ సమకూర్చారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాలకుని ప్రధాన కార్యాలయంలోకి.” గ్రీకు పదం రోమా పాలకుని అధికారిక నివాసాన్ని లేదా సైనిక ప్రధాన కార్యాలయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “సైనిక దళం” అనేది రోమా సైనిక విభాగాన్ని సూచించే పదం; పూర్తి దళంలోని ప్రతి సైనికుడూ అక్కడ ఉన్నాడని ఇది తప్పనిసరిగా అర్థం కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: సంఘటనల క్రమంలో తదుపరి ఘట్టాన్ని సూచించే సహజమైన ఆధునిక తెలుగు అనుసంధానం.
- source_word: οἱ στρατιῶται τοῦ ἡγεμόνος
  choice: అధిపతి సైనికులు
  rationale: రోమా పాలకునితో సైనికుల సంబంధాన్ని సహజమైన తెలుగు ప్రయోగంలో నిలుపుతుంది.
- source_word: ἡγεμόνος
  choice: అధిపతి
  rationale: ఈ సందర్భంలో రోమా ప్రాంతీయ పాలకుని సూచిస్తుంది; మూలపదం కంటే మరీ నిర్దిష్టమైన పరిపాలనా హోదాను అనవసరంగా చేర్చదు.
- source_word: παραλαβόντες
  choice: తీసుకువెళ్లి
  rationale: యేసును తమతో తీసుకొని ప్రేతోరియంలోకి వెళ్లిన భావాన్ని తెలుగు వాక్యక్రమంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εἰς τὸ πραιτώριον
  choice: ప్రేతోరియంలోకి
  rationale: రోమా పరిపాలనా-సైనిక నేపథ్యంలోని చారిత్రక పదాన్ని లిప్యంతరీకరించి నిలిపి, అర్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: συνήγαγον
  choice: సమకూర్చారు
  rationale: ఒకచోటికి కూడగట్టడం అనే క్రియార్థాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἐπ’ αὐτὸν
  choice: ఆయన చుట్టూ
  rationale: ఈ సందర్భంలో సైనికులు యేసు వైపు వచ్చి ఆయనను చుట్టుముట్టి కూడిన దృశ్యానికి అత్యంత సహజమైన అర్థం; సంభావ్య దిశాత్మక భావాన్ని సందర్భానుసారంగా వ్యక్తపరుస్తుంది.
- source_word: ὅλην τὴν σπεῖραν
  choice: సైనిక పటాలమంతటినీ
  rationale: σπεῖρα అనే రోమా సైనిక విభాగాన్ని సాధారణ పాఠకునికి అర్థమయ్యే సైనిక పదంతో అందిస్తూ, ὅλην లోని సమగ్రతను ‘అంతటినీ’ ద్వారా నిలుపుతుంది.
