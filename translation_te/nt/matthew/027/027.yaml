translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. చారిత్రక పదమైన ‘ప్రేతోరియం’ను ప్రధాన పాఠ్యంలో నిలిపి పాదసూచికలో వివరణ ఇచ్చాం; ‘సైనిక పటాలం’ సాధారణ పాఠకునికి అర్థమయ్యేలా రోమా సైనిక భావాన్ని కాపాడుతుంది.
