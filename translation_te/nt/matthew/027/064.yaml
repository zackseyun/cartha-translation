id: MAT.27.64
reference: Matthew 27:64
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: te
  text: కాబట్టి, మూడవ రోజు వరకు సమాధిని భద్రపరచమని ఆజ్ఞాపించండి. లేకపోతే అతని శిష్యులు వచ్చి[a] అతన్ని దొంగిలించి, ‘అతను మృతులలోనుండి లేపబడ్డాడు[b]’ అని ప్రజలకు చెబుతారు. అప్పుడు చివరి మోసం మొదటి మోసం కంటే మరింత చెడ్డదిగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'కొన్ని ప్రతులలో ‘వచ్చి’ తర్వాత ‘రాత్రివేళ’ అని ఉంది: ‘అతని శిష్యులు రాత్రివేళ వచ్చి అతన్ని దొంగిలిస్తారు.’ ఇక్కడ సంక్షిప్త పాఠాన్ని అనుసరించాం.'
    reason: textual_variant
  - marker: b
    text: దీనిని ‘అతను మృతులలోనుండి లేచాడు’ అని కూడా అనువదించవచ్చు. అయితే గ్రీకులో క్రియ కర్మణి ప్రయోగంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κέλευσον
  choice: ఆజ్ఞాపించండి
  rationale: పిలాతు అధికారంతో నిర్ణయాత్మకమైన ఆదేశం ఇవ్వాలని కోరే భూతకాల ఆజ్ఞార్థక క్రియను సహజమైన గౌరవపూర్వక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందు చెప్పిన విషయంనుండి వచ్చే తార్కిక నిర్ధారణను స్పష్టంగా నిలుపుతుంది.
- source_word: ἀσφαλισθῆναι
  choice: భద్రపరచమని
  rationale: సమాధిని సురక్షితంగా చేయడం అనే విస్తృత భావాన్ని నిలుపుతుంది; కాపలా లేదా ముద్ర వేయడం అనే నిర్దిష్ట పద్ధతిని ముందుగానే చేర్చదు.
- source_word: τὸν τάφον
  choice: సమాధిని
  rationale: యేసును ఉంచిన రాతి సమాధి సందర్భానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పదం.
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: మూడవ రోజు వరకు
  rationale: గ్రీకు కాలవ్యవధి వ్యక్తీకరణను సహజంగా, పునరుత్థాన సూచనతో ఉన్న పదబంధాన్ని మార్చకుండా అందిస్తుంది.
- source_word: μήποτε
  choice: లేకపోతే
  rationale: నివారించాలనుకున్న ప్రమాదకర అవకాశాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: ἐλθόντες
  choice: వచ్చి
  rationale: ప్రధాన క్రియలకు ముందు జరిగే భాగధాతు చర్యను సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది; మూలపాఠంలో లేని ‘రాత్రివేళ’ను ప్రధాన వాక్యంలో చేర్చదు.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: అతని శిష్యులు
  rationale: గ్రీకు స్వామ్య నిర్మాణానికి నేరుగా సరిపోయే సహజ తెలుగు రూపం.
- source_word: κλέψωσιν αὐτὸν
  choice: అతన్ని దొంగిలించి
  rationale: గ్రీకులో ఉన్న వ్యక్తిగత సర్వనామాన్నే నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘దేహాన్ని’ లేదా ‘తీసుకుపోయి’ అనే భావాన్ని చేర్చదు.
- source_word: εἴπωσιν τῷ λαῷ
  choice: ప్రజలకు చెబుతారు
  rationale: λαόςను అప్పటి గుంపుగా మాత్రమే పరిమితం చేయకుండా ప్రజలను సాధారణంగా సూచిస్తుంది.
- source_word: Ἠγέρθη
  choice: లేపబడ్డాడు
  rationale: గ్రీకు భూతకాల కర్మణి రూపాన్ని నిలుపుతూ, లేపిన కర్తను మూలపాఠం చెప్పనట్లే తెలుగులోనూ చెప్పకుండా ఉంచుతుంది.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: మృతులలోనుండి
  rationale: పునరుత్థాన సందర్భంలోని బహువచన గ్రీకు వ్యక్తీకరణను సంప్రదాయబద్ధంగానూ స్పష్టంగానూ అందిస్తుంది.
- source_word: ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης
  choice: చివరి మోసం మొదటి మోసం కంటే ఘోరంగా ఉంటుంది
  rationale: రెండు మోసాల మధ్య పోలికను, భవిష్యత్ భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: పునరుత్థాన ప్రకటనలోని కర్మణి ప్రయోగం
  choice: అతను మృతులలోనుండి లేపబడ్డాడు
  alternative: అతను మృతులలోనుండి లేచాడు
  rationale: Ἠγέρθη కర్మణి ప్రయోగంలో ఉంది. ప్రధాన పాఠంలో ‘లేపబడ్డాడు’ అని ఉంచడం ద్వారా దేవుడే లేపినవాడని స్పష్టంగా చేర్చకుండానే, గ్రీకు వాక్యంలోని సూచనాత్మక theological tensionను నిలుపుతుంది.
- issue: ‘మొదటి మోసం’ దేనిని సూచిస్తుందో
  choice: వివరణ చేర్చకుండా ‘మొదటి మోసం’ అని ఉంచడం
  alternative: యేసు పునరుత్థానాన్ని ముందుగా ప్రకటించడమే మొదటి మోసం అని స్పష్టీకరించడం
  rationale: ఈ వచనం ఆ సూచనను స్వయంగా వివరించదు; కాబట్టి వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలోకి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వచనశైలి ఉపయోగించబడింది. అధికారిక విజ్ఞప్తికి ‘ఆజ్ఞాపించండి’ సరిపోతుంది. పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించినా, తర్కక్రమం మరియు చివరి ఫలితభావం యథాతథంగా నిలుపబడ్డాయి.
