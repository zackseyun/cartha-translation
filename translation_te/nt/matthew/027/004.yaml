    issue: ‘నిర్దోషి రక్తాన్ని అప్పగించి’ is semantically stiff and potentially misleading in Telugu.
    rationale: Although it follows the Greek compact idiom formally, Telugu needs a contextual qualifier to communicate that the handing over was treacherous; otherwise the direct object ‘blood’ can be understood too literally.
  - severity: low
