source:
  edition: SBLGNT
  text: λέγων· Ἥμαρτον παραδοὺς αἷμα ⸀ἀθῷον. οἱ δὲ εἶπαν· Τί πρὸς ἡμᾶς; σὺ ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: te
  text: “నిర్దోషి రక్తాన్ని ద్రోహపూర్వకంగా అప్పగించి[a] నేను పాపం చేశాను” అని అతడు అన్నాడు. అయితే వారు, “అది మాకెందుకు? నువ్వే చూసుకో[b]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నిర్దోషి రక్తాన్ని అప్పగించి.” సందర్భంలో ఈ అప్పగింత ద్రోహపూర్వకమైనది.
    reason: lexical_alternative
  - marker: b
    text: 'మరింత అక్షరార్థంగా, “నువ్వే చూసుకుంటావు.” ఇక్కడ ఇది బాధ్యతను అతనిమీదకే నెట్టే నిర్లక్ష్యపూర్వక మాట: “అది నీ బాధ్యత; నువ్వే పరిష్కరించుకో.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: నేను పాపం చేశాను
  rationale: గ్రీకు ఏఓరిస్ట్ రూపాన్ని సహజమైన ఆధునిక తెలుగు భూతకాల ఒప్పుకోలుగా అనువదిస్తుంది; చేసిన కార్యానికి తాను దోషినని ఒప్పుకునే భావం నిలుస్తుంది.
- source_word: παραδοὺς
  choice: అప్పగించి
  rationale: παραδίδωμι యొక్క ప్రాథమిక భావమైన ‘అప్పగించడం’ను నిలుపుతుంది. సందర్భంలో అది ద్రోహపూర్వకమైన అప్పగింత అయినప్పటికీ, ఆ భావాన్ని మూలపదంలో లేనంతగా ప్రధాన వాక్యంలో విస్తరించదు.
- source_word: αἷμα ἀθῷον
  choice: నిర్దోషి రక్తం
  rationale: మూలంలోని సంక్షిప్తమైన న్యాయ-నైతిక నుడికారాన్ని కాపాడుతుంది; ‘యేసు’ లేదా ‘నిర్దోషి వ్యక్తి’ అని స్పష్టీకరించకుండా అసలు వాక్యంలోని పరోక్ష సూచనను నిలుపుతుంది.
- source_word: Τί πρὸς ἡμᾶς;
  choice: అది మాకెందుకు?
  rationale: బాధ్యతను నిరాకరించే గ్రీకు నుడికారానికి సహజమైన, సంక్షిప్తమైన తెలుగు సమానార్థకం.
- source_word: σὺ ὄψῃ
  choice: నువ్వే చూసుకో
  rationale: రూపరీత్యా భవిష్యత్ మధ్యమ పురుష ఏకవచనమైనా, సందర్భంలో ఇది బాధ్యతను అతనిమీదకే నెట్టే కఠినమైన ఆజ్ఞాత్మక నుడికారంగా పనిచేస్తుంది. తెలుగు ఆజ్ఞారూపం ఆ సంభాషణాత్మక శక్తిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘నిర్దోషి రక్తం’ ఎవరిని సూచిస్తుందో స్పష్టంగా చెప్పాలా?
  choice: మూలంలోని ‘నిర్దోషి రక్తం’ అనే పరోక్ష నుడికారాన్నే ఉంచడం
  alternative: ‘ఒక నిర్దోషిని మరణానికి అప్పగించి’ లేదా ‘యేసును అప్పగించి’
  rationale: గ్రీకు పాఠం వ్యక్తి పేరును గానీ ‘మనిషి’ అనే నామవాచకాన్ని గానీ చేర్చదు. సందర్భం సూచించే వ్యక్తిని అనువాదమే స్పష్టీకరించకుండా, న్యాయ-నైతిక భావభారాన్ని మరియు అసలు సంక్షిప్తతను కాపాడుతుంది.
- issue: σὺ ὄψῃ ను భవిష్యత్ వాక్యంగా లేదా ఆజ్ఞాత్మక నుడికారంగా అనువదించాలా?
  choice: ప్రధాన పాఠంలో ‘నువ్వే చూసుకో’
  alternative: ‘నువ్వే చూసుకుంటావు’
  rationale: భవిష్యత్ రూపం నిజమైనదే అయినా, ఈ సందర్భంలో అది నిర్లక్ష్యపూర్వకంగా బాధ్యతను తిరిగి అతనిమీదకు నెట్టే ఆజ్ఞాత్మక ప్రకటన. రూపపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా వ్యాకరణ ఉద్రిక్తతను కూడా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి. ‘అది మాకెందుకు?’ మరియు ‘నువ్వే చూసుకో’ అనే మాటలు యాజకుల నిర్లక్ష్యపూర్వక తిరస్కారాన్ని సాధారణ పాఠకుడికి స్పష్టంగా తెలియజేస్తాయి. ‘నిర్దోషి రక్తం’ అనే బైబిలీయ నుడికారాన్ని వివరణాత్మకంగా విస్తరించకుండా ఉంచాం.
