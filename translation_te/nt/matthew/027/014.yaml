  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: te
  text: ఆయన అతనికి ఒక్క మాటైనా జవాబు చెప్పలేదు[a]. దాంతో అధిపతి ఎంతో ఆశ్చర్యపోయాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక్క మాటతోనైనా ఆయన అతనికి జవాబివ్వలేదు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అధిపతి ఎంతో విస్మయపడ్డాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: జవాబు చెప్పలేదు
  rationale: ἀποκρίνομαι యొక్క భూతకాల రూపం ఇక్కడ ‘జవాబివ్వడం’ అనే సాధారణ అర్థంలో ఉంది. ఆధునిక తెలుగులో ‘జవాబు చెప్పలేదు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: αὐτῷ
  choice: అతనికి
  rationale: ఈ దత్తివిభక్తి సర్వనామం జవాబు ఎవరికివ్వలేదో సూచిస్తుంది; సందర్భంలో అతడు అధిపతి పిలాతు.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: ఒక్క మాటతోనైనా
  rationale: οὐδὲ ἓν అనే బలమైన నిరాకరణను ‘ఒక్క...తోనైనా’ నిలుపుతుంది; ῥῆμαను దాని సాధారణ అర్థమైన ‘మాట’గా అనువదించింది. ఈ పదబంధం ఆయన అసలు ఏ జవాబూ ఇవ్వలేదని నొక్కిచెబుతుంది.
- source_word: ὥστε
  choice: దాంతో
  rationale: ὥστε ఇక్కడ ఫలితాన్ని పరిచయం చేస్తుంది. ‘దాంతో’ ముందున్న మౌనం కారణంగా కలిగిన ప్రతిస్పందనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: θαυμάζειν
  choice: ఆశ్చర్యపోయాడు
  rationale: ఫలిత వాక్యంలో అధిపతి పొందిన విస్మయాన్ని తెలుగులో సహజమైన సమాపక క్రియగా వ్యక్తం చేస్తుంది.
- source_word: ἡγεμόνα
  choice: అధిపతి
  rationale: రోమా పరిపాలనా సందర్భంలో ἡγεμών ప్రాంతాన్ని పాలించే అధికారిని, ఇక్కడ పిలాతును, సూచిస్తుంది. ‘అధిపతి’ గౌరవప్రదమైన మరియు తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన పదం.
- source_word: λίαν
  choice: ఎంతో
  rationale: ఆశ్చర్యం యొక్క అధిక తీవ్రతను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
