  naturalness: The revised wording is fluent, modern standard Telugu and maintains a restrained narrative register. ‘అధిపతి’ is an established, intelligible rendering in this context.
  terminology: ‘అధిపతి’ adequately renders ἡγεμών in the immediate Pilate context without unnecessarily expanding the title. ‘జవాబు చెప్పలేదు’ and ‘ఎంతో ఆశ్చర్యపోయాడు’ faithfully express the verbal sense and intensifier λίαν.
  issues:
  - severity: medium
    issue: ‘అయితే’ introduces an adversative sense.
    rationale: The Greek begins with καί (‘and’), not a contrastive conjunction. In this context, Telugu may omit the connective, but ‘అయితే’ adds a contrast not marked by the source.
