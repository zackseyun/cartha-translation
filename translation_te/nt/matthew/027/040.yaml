id: MAT.27.40
reference: Matthew 27:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: te
  text: “ఓ దేవాలయాన్ని కూల్చి మూడు రోజుల్లో దాన్ని కట్టేవాడా[a], నిన్ను నువ్వే రక్షించుకో! నువ్వు దేవుని కుమారుడివైతే, సిలువ మీద నుంచి దిగు!” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దాన్ని తిరిగి కట్టేవాడా.” గ్రీకు క్రియకు ప్రాథమిక అర్థం “కట్టు”; అయితే ఈ ఎగతాళి మాటల సందర్భం తిరిగి కట్టడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: అని అన్నారు
  rationale: వర్తమాన కృదంతం మునుపటి కథనంతో అనుసంధానమై ఎగతాళి మాటలను పరిచయం చేస్తుంది. తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణం కోసం వాక్యాంతంలో ‘అని అన్నారు’గా ఇచ్చాం.
- source_word: Ὁ καταλύων
  choice: పడగొట్టి ... కట్టేవాడా
  rationale: ఆర్టికల్‌తో ఉన్న కృదంతం ఇక్కడ ప్రత్యక్ష సంబోధనగా పనిచేస్తుంది. ‘పడగొట్టి’ దేవాలయాన్ని ధ్వంసం చేయడాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘కట్టేవాడా’ ఎగతాళి ధోరణిని నిలుపుతుంది.
- source_word: ναός
  choice: దేవాలయం
  rationale: ναός మరింత నిర్దిష్టంగా పవిత్రస్థలాన్ని సూచించగలిగినా, ఈ నిందాత్మక మాటలో మొత్తం దేవాలయాన్ని సూచించే సహజమైన తెలుగు పదం ‘దేవాలయం’.
- source_word: ἐν τρισὶν ἡμέραις
  choice: మూడు రోజుల్లో
  rationale: కాలవ్యవధిని తెలిపే మూలపాఠ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἰκοδομῶν
  choice: దాన్ని కట్టేవాడా
  rationale: గ్రీకు క్రియ ప్రాథమికంగా ‘కట్టు’ అని మాత్రమే చెబుతుంది. ‘దాన్ని’ అనే కర్మ దేవాలయం నుంచి సహజంగా గ్రహించబడుతుంది; ‘తిరిగి కట్టు’ అనే సందర్భానుగత అర్థాన్ని పాఠ్యంలో బలవంతంగా చేర్చలేదు.
- source_word: σῶσον σεαυτόν
  choice: నిన్ను నువ్వే రక్షించుకో
  rationale: ఆజ్ఞార్థక క్రియతో కూడిన ఆత్మవాచక సర్వనామాన్ని నేరుగా, సహజంగా అందిస్తూ ఎగతాళి సవాలును నిలుపుతుంది.
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: నువ్వు దేవుని కుమారుడివైతే
  rationale: షరతుతో కూడిన ఎగతాళిని, క్రీస్తు సంబంధ బిరుదును అదనపు వివరణ లేకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: κατάβηθι
  choice: దిగిరా
  rationale: ఎత్తులో సిలువపై ఉన్న వ్యక్తిని ఉద్దేశించిన ఆజ్ఞకు సహజమైన తెలుగు రూపం; సంబోధనలోని సవాలు, అవమాన ధోరణి ప్రతిఫలిస్తుంది.
- source_word: σταυρός
  choice: సిలువ
  rationale: యేసు శ్రమల కథనంలో స్థిరపడిన, సందర్భోచితమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: ఎగతాళి సందర్భంలో υἱὸς τοῦ θεοῦ అనే క్రీస్తు సంబంధ బిరుదు
  choice: దేవుని కుమారుడు
  alternative: దేవుని పుత్రుడు
  rationale: ‘దేవుని కుమారుడు’ ఆధునిక పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది; ఎగతాళి చేసేవారు యేసు గుర్తింపును సవాలు చేస్తున్నారనే ఉద్రిక్తతను తగ్గించకుండా, బిరుదుకు అదనపు సిద్ధాంతార్థం చేర్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ప్రత్యక్ష సంబోధనలోని ఎగతాళిని ‘కట్టేవాడా,’ ‘రక్షించుకో,’ ‘దిగిరా’ రూపాలతో సహజంగా నిలిపాం.
