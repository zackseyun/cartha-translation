source:
  edition: SBLGNT
  text: Τότε σταυροῦνται σὺν αὐτῷ δύο λῃσταί, εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: te
  text: అప్పుడు ఆయనతో పాటు ఇద్దరు దోపిడీదారులు[a] సిలువ వేయబడ్డారు—ఒకరు ఆయన కుడివైపున, మరొకరు ఎడమవైపున.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బందిపోట్లు.” గ్రీకు పదం హింసాత్మకంగా దోచుకునేవారిని సూచించవచ్చు; కొన్ని సందర్భాల్లో తిరుగుబాటు కార్యకలాపాలతోనూ సంబంధం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనను సూచించే సహజమైన, సంక్షిప్త కాలవాచకం.
- source_word: σταυροῦνται
  choice: సిలువ వేయబడ్డారు
  rationale: వర్తమానకాల కర్మణి రూపం కథన వర్తమానంగా ఉంది; తెలుగులో సహజమైన గతకాల కర్మణి రూపం సంఘటనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: σὺν αὐτῷ
  choice: ఆయనతో పాటు
  rationale: సహచర్యాన్ని సూచించే σύν భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δύο λῃσταί
  choice: ఇద్దరు దోపిడీదారులు
  rationale: λῃστής సాధారణంగా హింసాత్మకంగా దోచుకునే వ్యక్తిని లేదా బందిపోటును సూచిస్తుంది; రాజకీయ తిరుగుబాటుదారులు అని మరీ నిర్దిష్టంగా చెప్పకుండా మూలార్థాన్ని నిలుపుతుంది.
- source_word: εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων
  choice: ఒకరు ఆయన కుడివైపున, మరొకరు ఎడమవైపున
  rationale: మూలంలోని స్థాన సూచనను సహజమైన తెలుగులో అందిస్తుంది; స్పష్టత కోసం మొదటి భాగంలో ‘ఆయన’ను చేర్చడం జరిగింది.
theological_decisions:
- issue: λῃσταί అనే వారి గుర్తింపు
  choice: దోపిడీదారులు
  alternative: బందిపోట్లు; తిరుగుబాటుదారులు
  rationale: ఈ గ్రీకు పదం హింసాత్మక దొంగలను లేదా బందిపోట్లను సూచించవచ్చు; కొన్ని సందర్భాల్లో తిరుగుబాటు కార్యకలాపాలతో సంబంధం ఉండవచ్చు. అయితే ఈ వచనం మాత్రమే వారిని రాజకీయ తిరుగుబాటుదారులుగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సిలువ వేయబడ్డారు’ అనే ప్రామాణిక బైబిలు పదప్రయోగాన్ని కొనసాగిస్తూ, λῃσταίలోని భావ పరిధిని పాదటిప్పణిలో నిలిపాం.
