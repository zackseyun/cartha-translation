  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: te
  text: 'అప్పుడు యిర్మీయా ప్రవక్త ద్వారా పలికిన మాట నెరవేరింది[a]: “వారు ఆ ముప్పై వెండి నాణాలను తీసుకున్నారు, విలువ కట్టబడినవాని ధరను, ఇశ్రాయేలు కుమారులలో కొందరు విలువ కట్టినవాని ధరను[b],”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మత్తయి ఈ ప్రవచన వాక్యాన్ని యిర్మీయా ప్రవక్తకు ఆపాదిస్తున్నాడు. అయితే దీని పదాలు జెకర్యా 11:12–13కు అత్యంత దగ్గరగా ఉన్నాయి. ఇది ప్రవచనాల మిశ్రమ ఉల్లేఖనమని, యిర్మీయా పేరుతో గుర్తించబడిన ప్రవక్తల గ్రంథసమాహారానికి సూచన అని, లేదా పాఠ ప్రసారంలో ఏర్పడిన సమస్య అని వివిధ వ్యాఖ్యాతలు వివరిస్తారు.
    reason: textual_variant
  - marker: b
    text: లేదా, “ఇశ్రాయేలు కుమారుల నుండి.” ఈ గ్రీకు పదబంధం క్లిష్టమైనది; “ఇశ్రాయేలు కుమారులలో కొందరు” అనే అనువాదం దీనిలో ఉండవచ్చని భావించే భాగార్థాన్ని ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలోని సంఘటనల క్రమాన్ని సహజంగా సూచించే సంక్షిప్త కాలవాచకం.
- source_word: ἐπληρώθη
  choice: నెరవేరింది
  rationale: మత్తయి సువార్తలోని ప్రవచన నెరవేర్పు సూత్రాన్ని, గ్రీకు కర్మణి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὸ ῥηθὲν
  choice: పలికిన మాట
  rationale: ముందుగా పలికిన ప్రవచన వాక్యాన్ని సూచించే గ్రీకు కృదంత నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: యిర్మీయా ప్రవక్త ద్వారా
  rationale: διά + షష్ఠీ విభక్తిలోని మధ్యవర్తిత్వం లేదా సాధన భావాన్ని నిలుపుతుంది.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: ఆ ముప్పై వెండి నాణాలు
  rationale: ἀργύρια ఇక్కడ వెండి ధనపు ముక్కలను సూచిస్తుంది; ఆధునిక పాఠకునికి ‘వెండి నాణాలు’ స్పష్టంగా ఉంటుంది.
- source_word: τὴν τιμὴν τοῦ τετιμημένου
  choice: విలువ నిర్ణయించబడినవాని వెల
  rationale: τιμή యొక్క ధర/వెల భావాన్నీ, τετιμημένου లోని కర్మణి మరియు వాణిజ్యసంబంధ వ్యంగ్యాన్నీ నిలుపుతుంది.
- source_word: ὃν ἐτιμήσαντο
  choice: అతనికి నిర్ణయించిన వెల
  rationale: ముందటి τιμή/τιμάω పదబంధంతో ఉన్న ఉద్దేశపూర్వక పునరుక్తిని తెలుగులో ‘విలువ/వెల నిర్ణయించడం’ ద్వారా ప్రతిబింబిస్తుంది.
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: ఇశ్రాయేలు కుమారులలో కొందరు
  rationale: క్లిష్టమైన ἀπό నిర్మాణానికి సాధ్యమైన భాగార్థక భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యక్ష రూపాన్ని పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: వాక్యం జెకర్యా 11:12–13తో అత్యంత సన్నిహితంగా ఉన్నప్పటికీ దాన్ని యిర్మీయాకు ఆపాదించడం
  choice: ప్రధాన పాఠ్యంలో ‘యిర్మీయా ప్రవక్త’ అనే గ్రీకు పాఠాన్ని యథాతథంగా ఉంచడం
  alternative: ‘జెకర్యా’ అని మార్చడం, లేదా ప్రవక్త పేరును తొలగించి సమన్వయం చేయడం
  rationale: SBLGNTలో యిర్మీయా పేరు స్పష్టంగా ఉంది. అనువాదం ఆ చారిత్రక-పాఠ్య ఉద్రిక్తతను సవరించకుండా నిలుపాలి; వివిధ వివరణలను పాదటిప్పణిలో తెలియజేయాలి.
- issue: ἀπὸ υἱῶν Ἰσραήλ అనే క్లిష్టమైన పదబంధం
  choice: భాగార్థకంగా ‘ఇశ్రాయేలు కుమారులలో కొందరు’
  alternative: ‘ఇశ్రాయేలు కుమారుల నుండి’ లేదా ‘ఇశ్రాయేలు కుమారులచేత’
  rationale: గ్రీకు నిర్మాణం అసాధారణంగా ఉండటం వల్ల దాని అర్థాన్ని అతిగా ఖరారు చేయకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో అందించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలి. ‘విలువ నిర్ణయించబడినవాని వెల’ అనే స్వల్పంగా ఘనమైన నిర్మాణం మూలంలోని పునరుక్తి, వాణిజ్యభావం, వ్యంగ్యాన్ని కాపాడేందుకు ఉద్దేశపూర్వకంగా ఉపయోగించబడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
