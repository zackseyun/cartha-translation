  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: te
  text: వారు బయటికి వెళ్తుండగా, కురేనేకు చెందిన సీమోను అనే ఒక వ్యక్తిని కనుగొన్నారు. యేసు సిలువను మోయడానికి వారు అతణ్ణి బలవంతపెట్టారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అధికార బలంతో సేవకు పెట్టారు.’ ఈ గ్రీకు క్రియ అధికారంతో విధించే నిర్బంధ సేవను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξερχόμενοι
  choice: వారు బయటికి వెళ్తుండగా
  rationale: వర్తమాన కృదంతంలోని సమకాలిక కాలభావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; వారు ఎక్కడి నుంచి బయటికి వెళ్తున్నారో మూలపాఠం స్పష్టంగా చెప్పనందున దానిని చేర్చలేదు.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానాన్ని మాత్రమే సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో అదనపు ‘మరియు’ అవసరం లేకుండానే ఆ సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: εὗρον
  choice: వారికి కనిపించాడు
  rationale: ‘కనుగొన్నారు’ అనే యథారూప అనువాదం కంటే, ప్రయాణంలో ఒక వ్యక్తి ఎదురుపడిన సందర్భాన్ని ‘వారికి కనిపించాడు’ సహజంగా తెలియజేస్తుంది; కనుగొనడం అనే మూలభావం నిలుస్తుంది.
- source_word: ἄνθρωπον Κυρηναῖον
  choice: కురేనెకు చెందిన ... ఒక వ్యక్తి
  rationale: Κυρηναῖον తెలిపే భౌగోళిక మూలాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘పట్టణం’ వంటి వివరణను చేర్చదు.
- source_word: ὀνόματι Σίμωνα
  choice: సీమోను అనే
  rationale: పేరును తెలిపే గ్రీకు నుడికారానికి సహజమైన తెలుగు సమానం.
- source_word: τοῦτον
  choice: అతణ్ణి
  rationale: ముందు ప్రస్తావించిన సీమోనును స్పష్టంగా సూచిస్తూ, తెలుగులో భారంగా వినిపించే ‘ఈ వ్యక్తిని’ కంటే సహజంగా ఉంటుంది.
- source_word: ἠγγάρευσαν
  choice: బలవంతపెట్టారు
  rationale: అధికారంతో ఒకరిని నిర్బంధ సేవకు పెట్టే క్రియలోని బలవంతపు భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἵνα ἄρῃ
  choice: మోయడానికి
  rationale: ἵνα తో కూడిన ఉద్దేశ భావాన్ని తెలుగు ప్రయోజనార్థక రూపంలో సహజంగా వ్యక్తం చేస్తుంది; ఈ సందర్భంలో αἴρω అంటే సిలువను మోయడం.
- source_word: τὸν σταυρὸν
  choice: సిలువను
  rationale: σταυρόςకు సంప్రదాయబద్ధమైన, ఖచ్చితమైన తెలుగు సమానం; మూలం ప్రత్యేకంగా ‘అడ్డుదూలం’ అని చెప్పదు.
- source_word: αὐτοῦ
  choice: అతని
  rationale: గ్రీకు సర్వనామాన్ని పేరుతో భర్తీ చేయకుండా నిలుపుతుంది. సందర్భంలో అది యేసును సూచిస్తుంది; తెలుగులో సమీప నామమైన సీమోనును సూచించినట్లు అపార్థం కలగవచ్చు కాబట్టి పాదటిప్పణి ఇచ్చాం.
theological_decisions:
- issue: αὐτοῦ (‘అతని’) ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠంలో ‘అతని’ అనే సర్వనామాన్ని నిలిపి, పాదటిప్పణిలో అది యేసును సూచిస్తుందని తెలిపాం.
  alternative: ‘యేసు సిలువను’ అని ప్రధాన పాఠంలోనే స్పష్టీకరించడం.
  rationale: కథన సందర్భంలో సిలువ యేసుదేనని స్పష్టమైనప్పటికీ, మూలపాఠం పేరుకు బదులుగా సర్వనామాన్ని వాడుతుంది. అందువల్ల మూలరూపాన్ని నిలిపి, తెలుగులో కలగగల తాత్కాలిక సందిగ్ధతను పాదటిప్పణితో నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. మూలంలో లేని ప్రదేశ వివరణలను చేర్చలేదు; సర్వనామ సంబంధిత సందిగ్ధతను ప్రధాన పాఠంలో అతిగా పరిష్కరించకుండా పాదటిప్పణిలో వివరించాం.
