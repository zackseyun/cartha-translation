id: MAT.27.13
reference: Matthew 27:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Πιλᾶτος· Οὐκ ἀκούεις πόσα σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/013.yaml
  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: te
  text: 'అప్పుడు పిలాతు ఆయనతో ఇలా అన్నాడు: “వారు నీకు వ్యతిరేకంగా ఎన్ని విషయాల్లో సాక్ష్యం చెబుతున్నారో నీకు వినిపించడం లేదా?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “వారు నీకు వ్యతిరేకంగా సాక్ష్యమిస్తున్నారు” లేదా “వారు నీకు వ్యతిరేకంగా సాక్ష్యం ఇస్తున్నారు.” గ్రీకు క్రియకు న్యాయస్థానంలో ఒకరికి ప్రతికూలంగా సాక్ష్యమిచ్చే భావం ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనను సూచించే సహజమైన కాలసూచక పదం.
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో ఇది కథన వర్తమాన కాలరూపం; ఆధునిక తెలుగు కథనశైలిలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: మూలంలోని సర్వనామాన్ని నిలుపుతూ, సందర్భంలో యేసును గౌరవప్రదంగా సూచిస్తుంది.
- source_word: ὁ Πιλᾶτος
  choice: పిలాతు
  rationale: వ్యక్తినామానికి తెలుగు వాడుకలో ఉపపదం అవసరం లేదు.
- source_word: Οὐκ ἀκούεις
  choice: నీకు వినిపించడం లేదా?
  rationale: ప్రతికూల ప్రశ్నార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πόσα
  choice: ఎన్ని విషయాల గురించి
  rationale: మూలంలోని నపుంసక బహువచన పరిమాణార్థాన్ని నిలుపుతుంది; ‘ఆరోపణలు’ అని అనువదించడం కంటే తక్కువ వ్యాఖ్యాత్మకం.
- source_word: σου
  choice: నీకు వ్యతిరేకంగా
  rationale: καταμαρτυρέωతో కలిసి సందర్భంలో ప్రతికూల లేదా న్యాయస్థాన సంబంధాన్ని సూచిస్తుంది.
- source_word: καταμαρτυροῦσιν
  choice: సాక్ష్యం చెబుతున్నారు
  rationale: న్యాయపరమైన సాక్ష్యమిచ్చే భావాన్ని నిలుపుతుంది; కేవలం ‘నిందిస్తున్నారు’ లేదా ‘ఆరోపిస్తున్నారు’ అని సంకుచితం చేయదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. గ్రీకు కథన వర్తమానాన్ని తెలుగులో సహజమైన భూతకాలంతో అందించాం; న్యాయపరమైన సాక్ష్య భావాన్ని స్పష్టంగా నిలిపాం.
