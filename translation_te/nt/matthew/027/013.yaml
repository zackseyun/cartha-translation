  to: 'అప్పుడు పిలాతు ఆయనతో ఇలా అన్నాడు: “వారు నీకు వ్యతిరేకంగా ఎన్ని విషయాల్లో సాక్ష్యం చెబుతున్నారో నీకు వినిపించడం లేదా?[a]”'
  rationale: The wording for πόσα is adjusted from “ఎన్ని విషయాల గురించి” to “ఎన్ని విషయాల్లో,” preserving the unspecified plural ‘things/matters’ while making clear that these are points of testimony against Jesus. The historical present is rendered with natural Telugu narrative past tense, as in the draft.
