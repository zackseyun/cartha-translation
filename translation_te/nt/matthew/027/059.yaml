lexical_decisions:
- source_word: λαβὼν
  choice: తీసుకొని
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచించే భూతకాల కృదంతాన్ని తెలుగు కథనశైలికి సహజంగా ‘తీసుకొని’ అని అనువదించాం.
- source_word: σῶμα
  choice: ఆ దేహాన్ని
  rationale: గ్రీకులో స్వామ్యసూచక పదం లేకుండా ‘దేహం’ అని ఉంది. ముందటి సందర్భంలో పేర్కొన్న యేసు దేహమేనని స్పష్టపరచడానికి తెలుగు సహజ ప్రయోగంగా ‘ఆ దేహాన్ని’ వాడాం.
- source_word: ἐνετύλιξεν
  choice: చుట్టాడు
  rationale: ἐντυλίσσω అంటే చుట్టడం లేదా ఆవరించడం; సమాధి సందర్భంలో ‘చుట్టాడు’ సహజమైన, నేరమైన సమానార్థకం.
- source_word: αὐτὸ
  choice: దాన్ని
  rationale: నపుంసకలింగ సర్వనామం σῶμα (‘దేహం’)ను తిరిగి సూచిస్తుంది. తెలుగులోనూ ఆ వ్యాకరణ సంబంధాన్ని ‘దాన్ని’ నిలుపుతుంది.
- source_word: σινδόνι
  choice: నారబట్టలో
  rationale: σινδών నారతో చేసిన వస్త్రాన్ని, ఈ సందర్భంలో మృతదేహాన్ని చుట్టే వస్త్రాన్ని సూచించవచ్చు. ప్రధాన పాఠంలో అధిక నిర్దిష్టతను చేర్చకుండా ‘నారబట్ట’ అని ఇచ్చాం.
- source_word: καθαρᾷ
  choice: శుభ్రమైన
  rationale: ఈ సమాధి సందర్భంలో καθαρόςకు ‘శుభ్రమైన’ అనేది సహజమైన అర్థం; ‘పవిత్రమైన’ అనే ఆచార సంబంధ భావాన్ని అనవసరంగా చేర్చదు.
- source_word: καὶ ... ὁ Ἰωσὴφ
  choice: యోసేపు
  rationale: వచనారంభంలోని καί కథనాన్ని ముందరి వాక్యంతో కలుపుతుంది. తెలుగులో వాక్యసంధి సందర్భం ద్వారా సహజంగా వ్యక్తమవుతుంది కాబట్టి ప్రత్యేకంగా ‘మరియు’ అని పెట్టలేదు.
