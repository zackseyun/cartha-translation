revisions:
- from: 'ఇలా అన్నారు: “అయ్యా, ఆ మోసగాడు ఇంకా బతికి ఉన్నప్పుడు[a], ‘మూడు రోజుల తర్వాత నేను లేస్తాను[b]’ అని చెప్పిన సంగతి మాకు జ్ఞాపకం వచ్చింది.”'
  to: 'ఇలా అన్నారు: “ప్రభువా, ఆ మోసగాడు ఇంకా బతికుండగానే, ‘మూడు రోజుల తర్వాత నేను లేస్తాను’ అని చెప్పాడని మాకు గుర్తుంది.”'
  rationale: The formal address has been strengthened from “అయ్యా” to “ప్రభువా,” and the clause order has been smoothed. Footnote a has been corrected to offer a genuine Telugu word-order alternative without the inaccurate claim about Greek word order. Footnote anchors should be placed on “బతికుండగానే” (a) and “లేస్తాను” (b), respectively.
