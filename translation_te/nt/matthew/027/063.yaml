source:
  edition: SBLGNT
  text: λέγοντες· Κύριε, ἐμνήσθημεν ὅτι ἐκεῖνος ὁ πλάνος εἶπεν ἔτι ζῶν· Μετὰ τρεῖς ἡμέρας ἐγείρομαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/063.yaml
  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: te
  text: 'ఇలా అన్నారు: “ప్రభువా, ఆ మోసగాడు ఇంకా బతికుండగానే, ‘మూడు రోజుల తర్వాత నేను లేస్తాను’ అని చెప్పాడని మాకు గుర్తుంది.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: ఇలా అన్నారు
  rationale: వర్తమాన కృదంతం ముందటి వాక్యంతో అనుసంధానమై మాటల విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో సహజమైన వాక్యప్రవాహం కోసం సమాపక క్రియారూపాన్ని వాడాం.
- source_word: Κύριε
  choice: అయ్యా
  rationale: ఇక్కడ పిలాతును గౌరవంగా సంబోధిస్తున్నారు; ‘అయ్యా’ అనే పదం గౌరవార్థాన్ని సహజంగా తెలియజేస్తుంది, ఈ సందర్భంలో దైవత్వాన్ని అనవసరంగా సూచించదు.
- source_word: ἐμνήσθημεν
  choice: మాకు జ్ఞాపకం వచ్చింది
  rationale: అయోరిస్టు రూపంలోని జ్ఞాపకం రావడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఆ జ్ఞాపకానికి ఇప్పటి సందర్భంలో ఉన్న ప్రాముఖ్యత కూడా నిలుస్తుంది.
- source_word: ἐκεῖνος ὁ πλάνος
  choice: ఆ మోసగాడు
  rationale: ἐκεῖνος లోని దూరంగా ఉంచే భావాన్నీ, πλάνος లోని మోసం చేసి తప్పుదారి పట్టించే వ్యక్తి అనే ప్రతికూల భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἔτι ζῶν
  choice: ఇంకా బతికి ఉన్నప్పుడు
  rationale: అతడు చనిపోకముందు చెప్పిన మాట అని సూచించే కాలసంబంధ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: మూడు రోజుల తర్వాత
  rationale: μετά + ద్వితీయా విభక్తి యొక్క సాధారణ ‘తర్వాత’ భావాన్ని నిలుపుతుంది; ‘మూడవ రోజున’ అని ఇతర వచనాలతో సమన్వయం చేయదు.
- source_word: ἐγείρομαι
  choice: నేను లేస్తాను
  rationale: సందర్భంలో భవిష్యత్తులో జరిగే పునరుత్థానాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది. గ్రీకు రూపం వర్తమాన మధ్యమ/కర్మణి రూపంగా ఉండే అస్పష్టతను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: యేసు పునరుత్థాన సూచనను ఉటంకించిన విధానం
  choice: మూడు రోజుల తర్వాత నేను లేస్తాను
  alternative: మూడు రోజుల తర్వాత నేను లేపబడతాను
  rationale: తెలుగులో కాలసూచక పదబంధంతో ‘లేస్తాను’ అనడం సహజంగా భవిష్యత్తు భావాన్ని ఇస్తుంది. అయితే ἐγείρομαι మధ్యమ లేదా కర్మణి భావాన్ని అనుమతిస్తుంది; అందువల్ల దేవునిచేత లేపబడటం అనే సాధ్యమైన భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ణయించకుండా పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. పిలాతుకు చేసిన సంబోధనలో ‘అయ్యా’ వాడటం ద్వారా గౌరవాన్ని నిలుపుతూ దైవార్థాన్ని మోపలేదు. శత్రుత్వాన్ని తెలిపే ‘ఆ మోసగాడు’ అనే మాటను మృదువుపరచలేదు.
