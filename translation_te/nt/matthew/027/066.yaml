- from: కాబట్టి వారు వెళ్లి, కాపలా దళంతో కలిసి రాతికి ముద్ర వేసి సమాధిని భద్రపరిచారు.[a]
  to: అప్పుడు వారు వెళ్లి, కాపలా దళంతో కలిసి రాయికి ముద్ర వేసి సమాధిని భద్రపరిచారు.[a]
  rationale: The revision limits itself to replacing the overly causal connective “కాబట్టి” with the narratively appropriate “అప్పుడు.” The translation and footnote continue to preserve the ambiguity of μετὰ τῆς κουστωδίας rather than deciding whether it denotes the guard’s accompaniment/presence or its posting as a distinct action.
