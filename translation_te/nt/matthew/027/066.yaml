  text: οἱ δὲ πορευθέντες ἠσφαλίσαντο τὸν τάφον σφραγίσαντες τὸν λίθον μετὰ τῆς κουστωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/066.yaml
  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: te
  text: అప్పుడు వారు వెళ్లి, కాపలా దళంతో కలిసి రాయికి ముద్ర వేసి సమాధిని భద్రపరిచారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాయికి ముద్ర వేసి, కాపలా దళాన్ని నియమించి సమాధిని భద్రపరిచారు.’ గ్రీకు వాక్యం సంక్షిప్తంగా ఉంది; కాపలా దళం ముద్ర వేసే సమయంలో వారితో ఉందని లేదా సమాధికి కాపలా పెట్టారని అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: కాబట్టి వారు వెళ్లి
  rationale: πορευθέντες ప్రధాన క్రియతో అనుబంధంగా ఉన్న కృదంతం; తెలుగులో ‘వెళ్లి’ సహజంగా ఉంటుంది. δέ ఇక్కడ కథన కొనసాగింపును సూచిస్తుంది; ముందటి ఆదేశానికి ఫలితంగా జరిగిన చర్యను ‘కాబట్టి’ స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: ἠσφαλίσαντο
  choice: భద్రపరిచారు
  rationale: ἀσφαλίζω అంటే సురక్షితంగా లేదా చెదరగొట్టలేని విధంగా చేయడం. సందర్భంలో సమాధికి భద్రత కల్పించడాన్ని ‘భద్రపరిచారు’ సహజంగా తెలియజేస్తుంది.
- source_word: τὸν τάφον
  choice: సమాధిని
  rationale: τάφος ఇక్కడ యేసు దేహాన్ని ఉంచిన సమాధి స్థలాన్ని సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘సమాధి’ స్పష్టమైన పదం.
- source_word: σφραγίσαντες
  choice: ముద్ర వేసి
  rationale: రాయిని అధికారికంగా మూసివేసిన చర్యను సూచిస్తుంది. అక్షరార్థమైనప్పటికీ అసహజంగా ఉండే రూపం కంటే ‘ముద్ర వేసి’ సాధారణ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: τὸν λίθον
  choice: రాతికి
  rationale: ఇది సమాధి ద్వారం వద్దనున్న రాయి. మూలంలో లేని ‘ద్వారపు’ వంటి వివరణను చేర్చకుండా ‘రాయి’ అనే సాధారణ పదాన్నే ఉంచింది.
- source_word: μετὰ τῆς κουστωδίας
  choice: కాపలా దళంతో కలిసి
  rationale: κουστωδία ఒక కాపలా బృందం లేదా దళాన్ని సూచించే లాటిన్ మూలపు పదం. μετά + సంబంధ విభక్తి సహవాసాన్ని సూచించగలదు; ‘తో కలిసి’ దళం అక్కడ పాల్గొన్నదనే భావాన్ని ఇస్తూ, వారిని నియమించడం అనే ప్రత్యేక చర్యను ప్రధాన వాక్యంలో చేర్చదు.
theological_decisions:
- issue: సమాధిని భద్రపరచడంలో μετὰ τῆς κουστωδίας యొక్క సంబంధం
  choice: కాపలా దళం తోడుగా లేదా పాల్గొంటూ ఉండగా రాతికి ముద్ర వేసి సమాధిని భద్రపరిచారు.
  alternative: రాతికి ముద్ర వేసి కాపలా దళాన్ని నియమించడం ద్వారా సమాధిని భద్రపరిచారు.
  rationale: గ్రీకు వాక్యభాగం సంక్షిప్తంగా ఉంది; అది కాపలా దళం తోడుగా ఉండడాన్ని సూచించవచ్చు, కానీ దళాన్ని నిలిపారు అనే వేరొక చర్యగా కూడా అర్థం చేసుకోవచ్చు. ప్రధాన అనువాదం సహవాస భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపి మూలంలోని సందిగ్ధతను పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘కాపలా దళం’ సమూహార్థాన్ని స్పష్టంగా ఉంచుతుంది; మూలంలో లేని రోమా లేదా ఆలయ సంబంధ గుర్తింపును చేర్చలేదు.
