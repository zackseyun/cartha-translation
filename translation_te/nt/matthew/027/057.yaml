  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: te
  text: సాయంకాలమైనప్పుడు, అరిమతయకు చెందిన యోసేపు అనే ధనవంతుడు వచ్చాడు; అతడు కూడా యేసుకు శిష్యుడిగా మారినవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతడు కూడా యేసుచేత శిష్యునిగా చేయబడ్డాడు”; లేదా, “అతడు కూడా యేసుకు శిష్యుడై ఉన్నాడు.”
    reason: ἐμαθητεύθη అనే passive క్రియ శిష్యుడిగా మారడం, శిష్యునిగా చేయబడడం, లేదా సందర్భానుసారం శిష్యుడై ఉండడం అనే భావ ఛాయలను అనుమతిస్తుంది.
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: సాయంకాలమైనప్పుడు
  rationale: ఈ genitive absolute కాలసంబంధమైన కథన మార్పును సూచిస్తుంది. ‘సాయంకాలమైనప్పుడు’ అనేది సహజమైన ఆధునిక తెలుగు; δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని సందర్భమే అందిస్తుంది.
- source_word: ἦλθεν
  choice: వచ్చాడు
  rationale: ἔρχομαι యొక్క సాధారణ కథన aorist‌కు నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: ἄνθρωπος πλούσιος
  choice: ధనవంతుడు
  rationale: తెలుగులో ‘ధనవంతుడైన ఒక మనిషి’ కంటే ‘ధనవంతుడు’ సంక్షిప్తంగా, సహజంగా ఉండి పూర్తి భావాన్ని ఇస్తుంది.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: అరిమతయకు చెందిన
  rationale: ἀπό ఇక్కడ Herkunft/స్థల మూలాన్ని సూచిస్తుంది. ‘అరిమతయకు చెందిన’ అనే రూపం తెలుగులో సహజంగా అదే సంబంధాన్ని తెలియజేస్తుంది.
- source_word: τοὔνομα Ἰωσήφ
  choice: యోసేపు అనే
  rationale: పేరును పరిచయం చేసే గ్రీకు ప్రయోగానికి ఇది సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: ὃς καὶ αὐτὸς
  choice: అతడు కూడా
  rationale: καί మరియు αὐτός కలిపి యోసేపు సైతం ఇతరులతో పాటు శిష్యుడని నొక్కిచెబుతాయి. తెలుగులో ‘అతడు కూడా’ ఆ ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: యేసుకు శిష్యుడయ్యాడు
  rationale: μαθητεύω యొక్క passive రూపం శిష్యత్వంలోకి రావడం లేదా శిష్యునిగా చేయబడడం అనే భావాలను అనుమతిస్తుంది. ప్రధాన పాఠంలోని రూపం సహజంగా ఉండి, యోసేపు యేసు శిష్యులలో ఒకడయ్యాడనే ఫలితస్థితిని తెలియజేస్తుంది; passive ఛాయను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: ἐμαθητεύθη అనే passive క్రియకు యేసుతో ఉన్న సంబంధం
  choice: యేసుకు శిష్యుడయ్యాడు
  alternative: యేసు చేత శిష్యునిగా చేయబడ్డాడు; లేదా యేసుకు శిష్యుడై ఉన్నాడు
  rationale: వాక్యం యోసేపును యేసు శిష్యుడిగా గుర్తిస్తుంది; అతడు ఏ విధానంలో శిష్యుడయ్యాడో నిర్దిష్టంగా చెప్పదు. అందువల్ల ప్రధాన పాఠం అతని శిష్యస్థితిని స్పష్టంగా చెబుతూ, క్రియలోని సాధ్యమైన passive భావాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు వాక్యంలోని పొడవైన సంబంధవాక్యాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించడం వల్ల చదవడానికి సహజంగా ఉంది; భావ సంబంధం, ‘అతడు కూడా’ అనే ఉద్ఘాటన యథాతథంగా నిలిచాయి.
