  source_fidelity: గ్రీకు మూలానికి నమ్మకంగా ఉంది. Καθημένου ... αὐτοῦ యొక్క సమకాలీన కొనసాగుతున్న భావం ‘కూర్చుని ఉండగా’లో, βῆμα యొక్క న్యాయసందర్భం ‘న్యాయపీఠం’లో, అలాగే δι’ αὐτόν యొక్క కారణార్థం ‘అతని కారణంగా’లో సరిగ్గా ప్రతిఫలించాయి. Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ అనే జాతీయానికి ‘ఆ నీతిమంతుని విషయంలో నీవేమీ చేయవద్దు’ అనేది సందర్భానుకూలమైన, అర్థాన్ని కాపాడే రూపం.
