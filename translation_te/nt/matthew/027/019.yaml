id: MAT.27.19
reference: Matthew 27:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: te
  text: 'అతడు న్యాయపీఠం మీద కూర్చుని ఉండగా, అతని భార్య అతనికి ఇలా కబురు పంపింది: “ఆ నీతిమంతుని[a] విషయంలో నీవేమీ చేయవద్దు. ఎందుకంటే, అతని కారణంగా ఈ రోజు కలలో నేను ఎంతో బాధపడ్డాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ నిర్దోషి మనిషి.’ గ్రీకు విశేషణానికి ‘నీతిమంతుడు,’ ‘న్యాయవంతుడు’ అనే అర్థాలు ఉన్నాయి; న్యాయవిచారణ సందర్భంలో ‘నిర్దోషి’ అనే భావం కూడా రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: అతడు ... కూర్చుని ఉండగా
  rationale: వర్తమాన అసమాపక క్రియతో ఉన్న genitive absolute, అదే సమయంలో కొనసాగుతున్న పరిస్థితిని సూచిస్తుంది; తెలుగులో ‘కూర్చుని ఉండగా’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: ἐπὶ τοῦ βήματος
  choice: న్యాయపీఠం మీద
  rationale: ఈ న్యాయవిచారణ సందర్భంలో βῆμα అధికారికంగా తీర్పు చెప్పే ఆసనాన్ని సూచిస్తుంది; ‘న్యాయపీఠం’ దాని న్యాయపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπέστειλεν πρὸς αὐτὸν ... λέγουσα
  choice: అతనికి ఇలా కబురు పంపింది
  rationale: మాటల సందేశాన్ని మరొకరి ద్వారా పంపిన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; సందేశ మాధ్యమాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: అతని భార్య
  rationale: సంబంధ సూచన వల్ల γυνή ఇక్కడ సాధారణంగా ‘స్త్రీ’ కాకుండా ‘భార్య’ అనే అర్థంలో ఉంది.
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: ఆ నీతిమంతుని విషయంలో నీవేమీ చేయవద్దు
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్త జాతీయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, అతనికి వ్యతిరేకంగా చర్యలో పాలుపంచుకోవద్దనే హెచ్చరికను నిలుపుతుంది.
- source_word: τῷ δικαίῳ ἐκείνῳ
  choice: ఆ నీతిమంతుని
  rationale: δίκαιος యొక్క ప్రధాన నైతిక భావమైన ‘నీతిమంతుడు’ను నిలుపుతుంది; న్యాయవిచారణ సందర్భంలో సాధ్యమైన ‘నిర్దోషి’ భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: πολλὰ ... ἔπαθον
  choice: నేను ఎంతో బాధపడ్డాను
  rationale: πολλὰ πάσχω అనే ప్రయోగంలోని తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: σήμερον κατ’ ὄναρ
  choice: ఈ రోజు కలలో
  rationale: కాల సూచనను, కలలో అనుభవించిన భావాన్ని నేరుగా మరియు సహజంగా అందిస్తుంది.
- source_word: δι’ αὐτόν
  choice: అతని కారణంగా
  rationale: accusativeతో వచ్చిన διά కారణాన్ని సూచిస్తుంది; ‘అతని కారణంగా’ ఆ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: యేసును సూచించే δίκαιος పదం అనువాదం
  choice: నీతిమంతుడు
  alternative: నిర్దోషి
  rationale: ‘నీతిమంతుడు’ δίκαιος యొక్క నైతిక, ధార్మిక బలాన్ని నిలుపుతుంది; అయితే విచారణ సందర్భంలో ‘నిర్దోషి’ అనే న్యాయపరమైన భావం కూడా సాధ్యమైనందున దాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. న్యాయవిచారణ సందర్భం స్పష్టంగా ఉండేలా ‘న్యాయపీఠం’ వాడబడింది. సంభాషణలోని హెచ్చరికను అతిగా వ్యాఖ్యానించకుండా, గ్రీకు జాతీయానికి సహజ సమానార్థక రూపం ఎంచుకోబడింది.
