  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: te
  text: అతడు పిలాతు దగ్గరకు వెళ్లి యేసు దేహాన్ని కోరాడు. అప్పుడు పిలాతు దానిని అతనికి అప్పగించమని[a] ఆదేశించాడు.
