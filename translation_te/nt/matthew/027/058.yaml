    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: అతడు
  rationale: మునుపటి వచనంలోని అరిమతయియ యోసేపును సూచించే సర్వనామంగా ఆధునిక తెలుగు కథనంలో సహజంగా ఉంది.
- source_word: προσελθὼν
  choice: దగ్గరికి వెళ్లి
  rationale: పిలాతును సమీపించి అతని వద్దకు వెళ్లిన ముందస్తు చర్యను సహజమైన తెలుగు క్రమంలో తెలియజేస్తుంది.
- source_word: ᾐτήσατο
  choice: అడిగాడు
  rationale: తరువాత వచ్చే ‘యేసు దేహాన్ని’ అనే కర్మతో కలిసి, కోరాడు/అభ్యర్థించాడు అనే భావాన్ని సరళంగా వ్యక్తపరుస్తుంది.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: యేసు దేహాన్ని
  rationale: σῶμα యొక్క సాధారణ అర్థమైన ‘దేహం’ను నిలుపుతుంది; సందర్భం మరణించిన దేహమని స్పష్టం చేస్తుంది కాబట్టి ‘శవం’ అని కఠినంగా చేయలేదు.
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి సంఘటనను సూచించే సహజమైన కాలసంధి.
- source_word: ἐκέλευσεν
  choice: ఆదేశించాడు
  rationale: అధికారికంగా ఉత్తర్వు ఇచ్చిన భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀποδοθῆναι
  choice: అప్పగించమని
  rationale: యేసు దేహాన్ని యోసేపు అధీనానికి ఇవ్వాలనే సందర్భోచిత భావాన్ని సహజంగా తెలుపుతుంది; గ్రీకు పదంలోని ఇవ్వడం/అప్పగించడం పరిధిని అతిగా నిర్దిష్టం చేయదు.
