id: MAT.27.65
reference: Matthew 27:65
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτοῖς ὁ Πιλᾶτος· Ἔχετε κουστωδίαν· ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: te
  text: పిలాతు వారితో, “మీకు ఒక కాపలా దళం ఉంది.[a] వెళ్లండి; మీకు తెలిసిన విధంగా దాన్ని భద్రపరచండి.[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక కాపలా దళాన్ని తీసుకోండి”; బహుశా, “మీ సొంత కాపలా దళం మీకు ఉంది.” పిలాతు వారికి కాపలా దళాన్ని ఇస్తున్నాడా, లేక ఇప్పటికే వారికి అందుబాటులో ఉన్న దళాన్నే సూచిస్తున్నాడా అన్న రెండు అర్థాలూ గ్రీకులో సాధ్యమే.
    reason: alternative_reading
  - marker: b
    text: లేదా, “దాన్ని మీకు తెలిసినంతగా భద్రపరచండి.”
    reason: previous_rendering
lexical_decisions:
- source_word: ἔφη
  choice: అన్నాడు
  rationale: φημί అనే సాధారణ కథన వాక్యక్రియకు ఈ సందర్భంలో సహజమైన తెలుగు రూపం.
- source_word: αὐτοῖς
  choice: వారితో
  rationale: పిలాతు మాటలు ఎవరిని ఉద్దేశించాయో తెలిపే దత్తివాచక బహువచన సర్వనామాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἔχετε
  choice: మీకు ... ఉన్నారు
  rationale: వర్తమాన నిర్దేశక రూపంలోని ప్రాథమిక అర్థాన్ని నిలుపుతుంది; ఇది కావలివారిని వారికి అప్పగించడమా, లేక ఇప్పటికే అందుబాటులో ఉన్నారని చెప్పడమా అన్న సందిగ్ధతను పరిష్కరించదు.
- source_word: κουστωδίαν
  choice: కావలివారు
  rationale: లాటిన్ custodia నుంచి వచ్చిన ఈ పదం సమాధిని కాపాడే గార్డు దళాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో వ్యక్తుల బృందాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὑπάγετε
  choice: వెళ్లి
  rationale: వెళ్లమనే ఆజ్ఞను తరువాతి ఆజ్ఞతో సహజంగా కలుపుతుంది.
- source_word: ἀσφαλίσασθε
  choice: దాన్ని భద్రపరచండి
  rationale: సమాధిని సురక్షితంగా చేయమనే మధ్యమ ఆజ్ఞార్థక క్రియ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὡς οἴδατε
  choice: మీకు తెలిసినంతగా
  rationale: వారి జ్ఞానం లేదా సామర్థ్యానికి అనుగుణంగా చేయాలనే భావాన్ని అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
theological_decisions:
- issue: Ἔχετε κουστωδίαν అనేది రోమా కావలివారిని ఇవ్వడమా లేక యూదు నాయకులకు ఇప్పటికే ఉన్న కావలివారిని సూచించడమా
  choice: ప్రధాన పాఠ్యంలో “మీకు కావలివారు ఉన్నారు” అని తటస్థంగా అనువదించడం
  alternative: “కావలివారిని తీసుకువెళ్లండి” లేదా “మీ సొంత కావలివారు మీకు ఉన్నారు”
  rationale: గ్రీకు రూపం అనుమతి లేదా అప్పగింతగా కూడా, ఇప్పటికే అందుబాటులో ఉన్న దళాన్ని సూచించే ప్రకటనగా కూడా అర్థమవుతుంది. చారిత్రక వివాదాన్ని అనువాదంలోనే తీర్చకుండా సందిగ్ధతను పాదసూచికలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే కథన శైలి. “కావలివారు” ద్వారా వ్యక్తుల దళాన్ని సూచించి, “మీకు ... ఉన్నారు” అనే రూపంతో మూలంలోని ముఖ్య సందిగ్ధతను నిలుపుకుంది.
