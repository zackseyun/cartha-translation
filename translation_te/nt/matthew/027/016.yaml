lexical_decisions:
- source_word: εἶχον
  choice: వారికి ... ఉన్నాడు
  rationale: అస్పష్టమైన బహువచన కర్తతో ఉన్న ἔχω క్రియ యొక్క అసంపూర్ణ భూతకాల రూపాన్ని సహజమైన తెలుగులో ఇలా వ్యక్తం చేశాం; ఇది అతడు అధికారుల అదుపులో ఉన్నాడనే భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానకం. తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు దానిని ప్రత్యేకంగా వ్యక్తం చేయలేదు; τότε ద్వారా కాలసంబంధ మార్పు స్పష్టంగానే ఉంది.
- source_word: τότε
  choice: ఆ సమయంలో
  rationale: స్పష్టమైన కాలసూచనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δέσμιον
  choice: ఖైదీ
  rationale: న్యాయపరమైన ఈ సందర్భంలో అదుపులో ఉంచబడిన వ్యక్తిని సూచించే స్పష్టమైన సాధారణ పదం.
- source_word: ἐπίσημον
  choice: అపఖ్యాతి పొందిన
  rationale: పదానికి ‘పేరొందిన/ప్రముఖమైన’ అనే తటస్థ భావం సాధ్యమైనా, ఖైదీని వర్ణించే ఈ సందర్భంలో చెడ్డపేరు పొందినవాడనే భావం ఎక్కువ సంభావ్యమైనది.
- source_word: λεγόμενον
  choice: అని పిలువబడే
  rationale: పేరు లేదా పిలుపును పరిచయం చేసే గ్రీకు కృదంతాన్ని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: Ἰησοῦν Βαραββᾶν
  choice: యేసు బరబ్బా
  rationale: SBLGNT మూలపాఠంలో ఉన్న రెండు పేర్లను ప్రధాన పాఠంలో నేరుగా నిలిపాం.
theological_decisions:
- issue: బరబ్బా పూర్తి పేరుకు సంబంధించిన పాఠాంతరం
  choice: ప్రధాన పాఠంలో ‘యేసు బరబ్బా’ అని చేర్చడం
  alternative: ‘యేసు’ను విడిచిపెట్టి కేవలం ‘బరబ్బా’ అని చదవడం
  rationale: అందించిన SBLGNT మూలపాఠం Ἰησοῦν Βαραββᾶν అని చదువుతుంది. మూలభాషా పాఠానికి ప్రాధాన్యమిస్తూ ‘యేసు’ను ప్రధాన పాఠంలో ఉంచి, అనేక ప్రతుల్లో కనిపించే సంక్షిప్త పాఠాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని అస్పష్ట బహువచన కర్తను ‘వారికి’గా నిలిపి, అది ఎవరిని సూచిస్తుందో అనువాదంలో అదనంగా నిర్ణయించలేదు.
