translation:
  language: te
  text: ఆ సమయంలో వారి వద్ద యేసు బరబ్బా అని పిలువబడే అపఖ్యాతి పొందిన ఒక ఖైదీ ఉన్నాడు.[a]
  philosophy: optimal-equivalence
