  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: te
  text: వారు ఆయనను ఎగతాళి చేసిన తర్వాత, ఆయనకు వేసిన ఆ పైవస్త్రాన్ని విప్పి తీసివేసి, ఆయన సొంత బట్టలు ఆయనకు తొడిగించి, సిలువ వేయడానికి ఆయనను తీసుకుపోయారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: ఎగతాళి చేసిన
  rationale: ఈ క్రియ అవహేళనతో కూడిన క్రూరమైన పరిహాసాన్ని సూచిస్తుంది. ‘ఎగతాళి’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: χλαμύδα
  choice: పైవస్త్రాన్ని
  rationale: χλαμύς సాధారణంగా పైన ధరించే అంగీ లేదా కప్పుకునే వస్త్రాన్ని సూచిస్తుంది. సందర్భంలో ఇది యేసును రాజుగా అపహాస్యం చేయడానికి తొడిగించిన వస్త్రం; ‘పైవస్త్రం’ పదార్థాన్ని మించిపోకుండా దాని స్వభావాన్ని తెలియజేస్తుంది.
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: ఆ పైవస్త్రాన్ని ఆయన మీద నుంచి తీసివేసి
  rationale: ἐκδύω వస్త్రాన్ని విప్పడం లేదా తొలగించడం అనే భావం ఇస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘ఆయన మీద నుంచి తీసివేసి’ చర్యను స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: ఆయన సొంత బట్టలు ఆయనకు తొడిగించి
  rationale: ἐνδύω ఒకరికి వస్త్రాలు తొడిగించడాన్ని సూచిస్తుంది; αὐτοῦ అనే స్వామ్యార్థాన్ని ‘సొంత’ స్పష్టంగా చూపించి, అపహాస్యపు పైవస్త్రంతో వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἱμάτια
  choice: బట్టలు
  rationale: ἱμάτια సాధారణంగా వస్త్రాలు లేదా దుస్తులు అని అర్థం. ‘బట్టలు’ సాధారణ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἀπήγαγον
  choice: తీసుకుపోయారు
  rationale: ἀπάγω కాపలాలో ఒకరిని అక్కడి నుంచి తీసుకెళ్లడం లేదా నడిపించుకొని వెళ్లడం అనే భావాన్ని ఇస్తుంది. ‘తీసుకుపోయారు’ తెలుగులో సహజంగా ఆ సందర్భాన్ని తెలియజేస్తుంది.
- source_word: εἰς τὸ σταυρῶσαι
  choice: సిలువ వేయడానికి
  rationale: εἰς తో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ ఉద్దేశాన్ని సూచిస్తుంది. ‘సిలువ వేయడానికి’ ఆ ప్రయోజనార్థాన్ని నేరుగా తెలియజేస్తుంది.
