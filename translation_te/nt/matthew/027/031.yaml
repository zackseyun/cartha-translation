translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. మూలంలోని వరుస చర్యలు, ఉద్దేశార్థం, అపహాస్యపు తీవ్రత నిలుపబడ్డాయి.
