id: MAT.27.7
reference: Matthew 27:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: te
  text: అప్పుడు వారు సంప్రదించుకొని, వాటితో[a] కుమ్మరివాని పొలాన్ని పరదేశీయుల సమాధి స్థలంగా కొన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ముందరి సందర్భంలో చెప్పిన వెండి నాణేలతో. గ్రీకులో అక్షరార్థంగా ‘వాటినుండి’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον ... λαβόντες
  choice: కలిసి సంప్రదించుకొని
  rationale: ఈ గ్రీకు నుడికారం ‘ఆలోచన/సలహా తీసుకొని’ అనే భావాన్ని ఇస్తుంది. యాజకులు సమష్టిగా చర్చించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: కాబట్టి
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక, ముందరి సంఘటనకు అనుసంధానమైన కథన కొనసాగింపును సూచిస్తుంది.
- source_word: ἠγόρασαν
  choice: కొని
  rationale: ἀγοράζω యొక్క సాధారణ అర్థం ‘కొను’. వాక్యాంతంలోని ఉద్దేశంతో సహజంగా కలపడానికి అసమాపక రూపం వాడబడింది.
- source_word: ἐξ αὐτῶν
  choice: వాటితో[a]
  rationale: గ్రీకులోని నపుంసక బహువచన సర్వనామాన్ని నిలిపి ఉంచుతూ, ముందరి సందర్భంలోని వెండి నాణేలను సూచించేలా సహజంగా అనువదించబడింది.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: కుమ్మరివాని పొలాన్ని
  rationale: సంబంధ విభక్తి పదబంధాన్ని నేరుగా, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: εἰς ταφὴν
  choice: పాతిపెట్టే స్థలంగా
  rationale: εἰς ఇక్కడ ఉద్దేశాన్ని లేదా నిర్దేశిత ఉపయోగాన్ని సూచిస్తుంది; పొలం దేనికోసం కొనబడిందో స్పష్టంగా తెలుపుతుంది.
- source_word: τοῖς ξένοις
  choice: పరదేశులను[b]
  rationale: ξένοις ఇక్కడ స్థానికులు కానివారిని లేదా బయటి ప్రాంతాలవారిని సూచిస్తుంది. ‘పరదేశులు’ గౌరవప్రదమైన, సంక్షిప్తమైన తెలుగు పదం.
theological_decisions:
- issue: ἐξ αὐτῶν లోని αὐτῶν దేనిని సూచిస్తుంది?
  choice: ముందరి సందర్భంలో చెప్పబడిన వెండి నాణేలను సూచించే ‘వాటితో’
  alternative: ‘ఆ డబ్బుతో’ అని స్పష్టంగా విస్తరించడం
  rationale: తక్షణ సందర్భం వెండి నాణేలను స్పష్టంగా సూచిస్తుంది. అయినప్పటికీ మూలంలోని సర్వనామ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, వివరణను పాదసూచికలో ఇవ్వడం మూలానికి దగ్గరగా ఉంటుంది.
- issue: τοῖς ξένοις యొక్క పరిధి
  choice: పరదేశులు—స్థానికులు కానివారు లేదా బయటి ప్రాంతాలవారు
  alternative: అపరిచితులు
  rationale: ఈ సందర్భంలో కేవలం వ్యక్తిగతంగా తెలియని వారికంటే, బయటివారు లేదా స్థానికులు కానివారు అనే భావమే ఎక్కువగా సరిపోతుంది; అయితే సాధ్యమైన విస్తృత అర్థాన్ని పాదసూచికలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని సర్వనామ సూచనను పాఠ్యంలో ఉంచి పాదసూచిక ద్వారా స్పష్టం చేశాం.
