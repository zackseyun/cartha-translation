  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: te
  text: అయితే ప్రధాన యాజకులూ పెద్దలూ బరబ్బాను కోరాలనీ, కానీ యేసును అంతమొందించాలనీ[a] జనసమూహాలను ఒప్పించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసును చంపాలనీ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి కథన పరిణామానికి వ్యతిరేక మలుపును సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: యెరూషలేములోని యాజక నాయకత్వాన్ని సూచించే ప్రామాణిక చారిత్రక పదబంధం.
- source_word: πρεσβύτεροι
  choice: పెద్దలు
  rationale: ఇక్కడ సమాజంలో గుర్తింపు పొందిన యూదు నాయకులను సూచిస్తుంది.
- source_word: ἔπεισαν
  choice: ఒప్పించారు
  rationale: జనసమూహాల నిర్ణయాన్ని ప్రభావితం చేసి ఒక చర్యకు సమ్మతింపజేసిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς ὄχλους
  choice: జనసమూహాలను
  rationale: గ్రీకు మూలంలోని బహువచనాన్ని, గుమికూడిన ప్రజల భావాన్ని నిలుపుతుంది.
- source_word: ἵνα αἰτήσωνται
  choice: కోరాలనీ
  rationale: ఒప్పించడం తరువాత వచ్చే ఉద్దేశం లేదా కోరిన చర్యను తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὸν Βαραββᾶν
  choice: బరబ్బాను
  rationale: వ్యక్తి పేరును తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: τὸν δὲ Ἰησοῦν
  choice: యేసును
  rationale: బరబ్బాను కోరడం, యేసును నాశనం చేయడం అనే రెండు విరుద్ధ ఎంపికలను వాక్య నిర్మాణం స్పష్టంగా చూపుతుంది.
- source_word: ἀπολέσωσιν
  choice: నాశనం చేయాలనీ
  rationale: ‘నశింపజేయడం/అంతమొందించడం’ అనే విస్తృత మూలార్థాన్ని నిలుపుతుంది; ఈ న్యాయసంబంధ సందర్భంలో ‘చంపడం’ అనే స్పష్టమైన భావాన్ని పాదసూచికలో అందించింది.
theological_decisions:
- issue: న్యాయపరమైన మరణశిక్ష సందర్భంలో ἀπολέσωσιν అనువాదం
  choice: యేసును నాశనం చేయాలనీ
  alternative: యేసును చంపాలనీ
  rationale: గ్రీకు క్రియ సాంకేతికంగా ‘మరణశిక్ష విధించడం’ అనే పదం కాకుండా, విస్తృతంగా ‘నశింపజేయడం’ లేదా ‘అంతమొందించడం’ అని అర్థమిస్తుంది. ప్రధాన పాఠం ఆ విస్తృత పదబలాన్ని నిలుపుతూ, సందర్భంలో ఉద్దేశించిన మరణాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని బహువచన ‘జనసమూహాలు’ మరియు బరబ్బా–యేసు మధ్య వ్యత్యాసం నిలుపబడ్డాయి.
