    text: లేదా, ‘చివరి శ్వాస విడిచాడు.’ గ్రీకులో అక్షరార్థంగా ‘ఆత్మను విడిచాడు’ అని ఉంది; ఇది మరణాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: కాని
  rationale: δέ ఇక్కడ కథనాన్ని కొనసాగిస్తూ స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; ముందటి సందర్భంతో అనుసంధానానికి ‘కాని’ సహజంగా సరిపోతుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: పునరావృతిని సూటిగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κράξας
  choice: కేక వేసి
  rationale: κράζω సూచించే బలమైన, గట్టిగానున్న కేకను వ్యక్తపరుస్తూ, గ్రీకు భూతకాల క్రియావిశేషణ సంబంధాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: φωνῇ μεγάλῃ
  choice: బిగ్గరగా
  rationale: శబ్ద తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది; ‘గొప్ప స్వరంతో’ అనేది అతిపదానువాదంగా ఉంటుంది.
- source_word: ἀφῆκεν τὸ πνεῦμα
  choice: తన ప్రాణాన్ని విడిచాడు
  rationale: పదబంధంలోని ‘విడిచాడు’ అనే భావాన్ని నిలుపుతూ, మరణాన్ని సూచించే తెలుగు నుడికారంగా సహజంగా ఉంటుంది. ఇక్కడ πνεῦμαకు ‘ప్రాణం’ అనేది శ్వాస మరియు జీవాత్మ భావాల మధ్యనున్న మూలంలోని విస్తృతిని కొంతవరకు కాపాడుతుంది.
theological_decisions:
- issue: ἀφῆκεν τὸ πνεῦμα అనే మరణ నుడికారపు అనువాదం
  choice: తన ప్రాణాన్ని విడిచాడు
  alternative: చివరి శ్వాస విడిచాడు; తన ఆత్మను విడిచాడు
  rationale: ‘చివరి శ్వాస విడిచాడు’ మరణార్థాన్ని స్పష్టంచేసినా πνεῦμαను కేవలం శ్వాసగా పరిమితం చేయవచ్చు. ‘తన ఆత్మను విడిచాడు’ పదసామ్యాన్ని ఎక్కువగా నిలిపినా ఆధునిక తెలుగులో అసహజంగా లేదా ప్రత్యేక ఆత్మసంబంధ వ్యాఖ్యానంగా వినిపించవచ్చు. ‘తన ప్రాణాన్ని విడిచాడు’ మూల నుడికారపు గంభీరతను, ఉద్దేశపూర్వకంగా కనిపించే ‘విడిచాడు’ రూపాన్ని నిలుపుతూ సహజంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే శిలువ మరణ దృశ్యానికి తగిన గంభీరతతో అనువదించబడింది. ‘కేక వేసి’ మరియు ‘ప్రాణాన్ని విడిచాడు’ సహజమైన తెలుగు ప్రయోగాలు; పాదసూచిక మూలంలోని πνεῦμα పదానికి ఉన్న ‘శ్వాస/ఆత్మ’ సాధ్యతను వెల్లడిస్తుంది.
