source:
  edition: SBLGNT
  text: καὶ ἐπέθηκαν ἐπάνω τῆς κεφαλῆς αὐτοῦ τὴν αἰτίαν αὐτοῦ γεγραμμένην· Οὗτός ἐστιν Ἰησοῦς ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: te
  text: 'వారు ఆయన తలకు పైన ఆయనపై ఉన్న అభియోగాన్ని ఇలా వ్రాసి ఉంచారు: “ఈయనే యేసు, యూదుల రాజు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: ఉంచారు
  rationale: ἐπιτίθημι యొక్క ఈ రూపం ఒక వస్తువును ఒక స్థానంలో పెట్టడాన్ని సూచిస్తుంది. శాసనాన్ని తలపై భాగంలో అమర్చిన చర్యను ‘ఉంచారు’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: ఆయన తలపై
  rationale: ἐπάνω + షష్ఠీ విభక్తి తలకు పైనున్న స్థానాన్ని సూచిస్తుంది. తెలుగులో ‘తలపై’ అంటే తలమీద నేరుగా ఉంచారని తప్పనిసరిగా అర్థం కాదు; పైభాగంలో అనే స్థానార్థాన్ని సహజంగా ఇస్తుంది.
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: ఆయన మీద మోపిన నేరారోపణను
  rationale: ఈ న్యాయసంబంధ సందర్భంలో αἰτία అంటే శిక్షకు ఆధారంగా ప్రకటించిన అభియోగం లేదా నేరారోపణ. ‘నేరారోపణ’ న్యాయపరమైన భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: γεγραμμένην
  choice: ఇలా రాసి
  rationale: γράφω యొక్క పరిపూర్ణ కర్మణి కృదంతం ఆ ఆరోపణ లిఖిత రూపంలో ఉందని చెబుతుంది. తెలుగు వాక్యనిర్మాణంలో ‘ఇలా రాసి ఉంచారు’ సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: Οὗτός ἐστιν
  choice: ఈయనే
  rationale: ప్రదర్శక సర్వనామం మరియు సంధానక్రియను శాసన శైలికి తగిన సంక్షిప్త తెలుగులో ‘ఈయనే’గా ఇచ్చాం. ఇది వ్యక్తిని నేరుగా గుర్తించే బలాన్ని నిలుపుతుంది.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: యూదుల రాజు
  rationale: రాజకీయ-రాజపదవిని నేరుగా తెలియజేసే సహజ తెలుగు రూపం. గ్రీకు నిర్దిష్ట పదబంధానికి తెలుగులో అదనపు నిర్దేశక పదం అవసరం లేదు.
- source_word: Ἰουδαίων
  choice: యూదుల
  rationale: శ్రమకథలోని ఈ రాజపదవి సూత్రంలో Ἰουδαίων సాధారణంగా యూదు ప్రజలను సూచిస్తుంది. అయినా ‘యూదయవాసులు’ అనే ప్రాంతీయ అర్థసంభావ్యతను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: సిలువ శాసనంలోని న్యాయపరమైన పదప్రయోగం
  choice: ఆయన మీద మోపిన నేరారోపణను
  alternative: ఆయన మీద చేసిన ఆరోపణను
  rationale: αἰτία ఇక్కడ సాధారణ విమర్శ కాకుండా మరణశిక్షకు ప్రకటించిన అధికారిక అభియోగాన్ని సూచిస్తుంది. ‘నేరారోపణ’ ఆ న్యాయసంబంధ బలాన్ని కాపాడుతుంది.
- issue: Ἰουδαίων అనే పదం సూచించే సమూహం
  choice: యూదుల
  alternative: యూదయవాసుల
  rationale: ఈ శ్రమకథా శాసనంలో ఇది రోమా రాజకీయ దృష్టిలో యూదు ప్రజల రాజు అనే బిరుదుగా పనిచేస్తుంది. అయితే పదానికి ప్రాంతీయంగా ‘యూదయవాసులు’ అనే అర్థం కూడా సాధ్యమైనందున దానిని పాదసూచికలో పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన కథన శైలి. శాసనంలోని సంక్షిప్తతను ‘ఈయనే యేసు’ ద్వారా నిలిపి, αἰτία యొక్క న్యాయపరమైన భావాన్ని స్పష్టపరిచాం.
