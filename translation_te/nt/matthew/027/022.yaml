id: MAT.27.22
reference: Matthew 27:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: te
  text: పిలాతు వారితో, “అయితే, మెస్సీయ అని పిలువబడే యేసును[a] నేనేమి చేయాలి?” అని అడిగాడు. వారందరూ, “అతడు సిలువ వేయబడాలి!” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు అని పిలువబడే.”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: అయితే ... నేనేమి చేయాలి?
  rationale: οὖν యొక్క నిర్ధారణాత్మక సంధాన భావాన్ని ‘అయితే’ తెలియజేస్తుంది. deliberative aorist subjunctive ποιήσωను సహజమైన తెలుగు ప్రశ్నగా ‘నేనేమి చేయాలి?’ అని అనువదించాం.
- source_word: Ἰησοῦν
  choice: యేసును
  rationale: వ్యక్తి పేరును ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం; వాక్యంలో కర్మవిభక్తిని అనుసరించి ‘యేసును’ అని వాడాం.
- source_word: τὸν λεγόμενον χριστόν
  choice: క్రీస్తు అని పిలువబడే
  rationale: λεγόμενον యొక్క వర్తమాన కర్మణి విశేషణార్థాన్ని ‘అని పిలువబడే’ నిలుపుతుంది. Χριστόςకు తెలుగులో విస్తృతంగా తెలిసిన, గ్రీకు బిరుదుతో సంబంధాన్ని నిలిపే ‘క్రీస్తు’ను ఎంచుకున్నాం.
- source_word: λέγουσιν πάντες
  choice: వారందరూ ... అన్నారు
  rationale: చారిత్రక వర్తమాన కాలాన్ని సహజ తెలుగు కథనశైలిలో భూతకాలంగా ఇచ్చాం; πάντες యొక్క సమష్టి బలాన్ని ‘వారందరూ’ నిలుపుతుంది.
- source_word: Σταυρωθήτω
  choice: అతన్ని సిలువ వేయించాలి!
  rationale: మూడవ పురుష ఏకవచన aorist passive imperative యొక్క ఆజ్ఞాత్మక భావాన్ని సహజ తెలుగులో బలంగా వ్యక్తం చేస్తుంది; యేసు సిలువవేయబడాలని వారు కోరుతున్న భావం నిలుస్తుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: క్రీస్తు
  alternative: మెస్సీయ
  rationale: ఇక్కడ Χριστός యేసుకు బిరుదుగా ఉంది. ఆధునిక తెలుగు బైబిల్ వాడుకలో ‘క్రీస్తు’ సాధారణంగా తెలిసిన రూపం; ‘మెస్సీయ’ దాని యూదీయ అభిషిక్తుని భావాన్ని మరింత ప్రత్యక్షంగా చూపగల ప్రత్యామ్నాయం. మూలంలోని బిరుదు స్వభావాన్ని ‘అని పిలువబడే’ నిర్మాణం స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. గుంపు సమష్టిగా పలికిన తీవ్ర ఆజ్ఞను ఆశ్చర్యార్థక చిహ్నంతో సూచించాం.
