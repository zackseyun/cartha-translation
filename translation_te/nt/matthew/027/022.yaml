- from: పిలాతు వారితో, “అయితే, క్రీస్తు అని పిలువబడే యేసును నేనేమి చేయాలి?” అని అడిగాడు. వారందరూ, “అతన్ని సిలువ వేయించాలి!” అన్నారు.
  to: పిలాతు వారితో, “అయితే, మెస్సీయ అని పిలువబడే యేసును[a] నేనేమి చేయాలి?” అని అడిగాడు. వారందరూ, “అతడు సిలువ వేయబడాలి!” అన్నారు.
