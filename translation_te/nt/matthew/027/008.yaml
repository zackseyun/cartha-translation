  yaml_path: translation/nt/matthew/027/008.yaml
  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: te
  text: అందువల్ల ఆ పొలం నేటివరకు “రక్తపు పొలం” అని పిలువబడుతోంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: అందువల్ల
  rationale: మునుపటి వచనంలో చెప్పిన కొనుగోలు, పేరుపెట్టడానికి వచ్చిన ఫలితాన్ని సహజంగా అనుసంధానిస్తుంది.
- source_word: ἐκλήθη
  choice: పిలువబడుతోంది
  rationale: గ్రీకు రూపం భూతకాల నిష్క్రియార్థకమైనప్పటికీ, ‘నేటివరకు’ అనే కాలవ్యక్తీకరణతో కలిసి గతంలో మొదలై ఇప్పటికీ వాడుకలో ఉన్న పేరును ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: ఆ పొలం
  rationale: ἀγρός అనే పదానికి సాధారణ అర్థమైన ‘పొలం’ను, ἐκεῖνος సూచనార్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: Ἀγρὸς Αἵματος
  choice: రక్తపు పొలం
  rationale: స్థలనామంలోని ἀγρός పదాన్ని పునరావృతం చేస్తూ, αἵματος యొక్క సంబంధార్థాన్ని సహజమైన తెలుగు షష్ఠీ నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: ἕως τῆς σήμερον
  choice: నేటివరకు
  rationale: రచయిత కాలం వరకూ ఆ పేరు వాడుకలో కొనసాగిందనే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
