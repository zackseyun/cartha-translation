translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. స్థలనామాన్ని ఉద్ధరణ చిహ్నాల్లో ఉంచి పేరుగా స్పష్టం చేశాం; మూలంలోని పదపునరుక్తిని ‘పొలం’ ద్వారా నిలిపాం.
