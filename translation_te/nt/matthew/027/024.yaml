id: MAT.27.24
reference: Matthew 27:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: te
  text: అయితే పైలాతు తన ప్రయత్నం ఏమాత్రం ఫలించడం లేదని, పైగా కల్లోలం చెలరేగుతోందని చూసి, నీళ్లు తీసుకుని జనసమూహం ఎదుట తన చేతులు కడిగి, “ఈ రక్తం విషయంలో నేను నిర్దోషిని[a]; మీరే చూసుకోండి[b]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఈ రక్తం నుండి నేను నిర్దోషిని.” ఇది ఒకరి మరణానికి తాను బాధ్యుడు కాదని చెప్పే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మీరే చూస్తారు”; భావం, “దీనికి మీరే బాధ్యత వహించండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: పైలాతు ... చూసి
  rationale: అయోరిస్ట్ పార్టిసిపుల్‌ను సహజమైన తెలుగు పూర్వకాలిక క్రియగా ఇచ్చి, కథనంలోని తదుపరి చర్యకు మార్పును చూపిస్తుంది.
- source_word: οὐδὲν ὠφελεῖ
  choice: తన ప్రయత్నం ఏమాత్రం ఫలించడం లేదని
  rationale: అక్షరార్థంగా ‘ఏమీ ప్రయోజనం కలిగించడం లేదు’; సందర్భంలో పైలాతు చేస్తున్న ప్రయత్నం పనికిరావడం లేదనే అంతర్భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: పైగా అల్లరి చెలరేగుతోందని
  rationale: θόρυβος ప్రజల్లో కలిగే కల్లోలం లేదా అల్లరిని సూచిస్తుంది; γίνεται వల్ల అది మొదలై పెరుగుతున్న భావం వస్తుంది.
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: నీళ్లు తీసుకుని ... తన చేతులు కడుక్కుంటూ
  rationale: ప్రతీకాత్మక చర్యను సహజంగా వ్యక్తపరుస్తుంది; మధ్యమవాచక రూపానికి ‘తన చేతులు’ తగిన ప్రతిఫలనం.
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: జనసమూహం ఎదుట
  rationale: చర్య అందరికీ కనిపించేలా బహిరంగంగా జరిగిందనే స్థలార్థాన్ని కాపాడుతుంది.
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: ఈ రక్తం విషయంలో నేను నిర్దోషిని
  rationale: ‘ఈ రక్తం నుండి నిర్దోషిని’ అనే గ్రీకు నుడికారాన్ని, ఒకరి మరణానికి బాధ్యత లేదని చెప్పుకునే భావంతో తెలుగులో సహజంగా అందిస్తుంది; ‘ఈ మనిషి’ అనే పదాన్ని మూలంలో లేకపోవడంతో చేర్చలేదు.
- source_word: ὑμεῖς ὄψεσθε
  choice: మీరే చూసుకోండి
  rationale: అక్షరార్థం ‘మీరే చూస్తారు’; సందర్భంలో బాధ్యతను వారిపైనే ఉంచే నుడికారార్థాన్ని, ὑμεῖς ఇచ్చే ఉద్ఘాటనతో సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: పైలాతు నిర్దోషిత్వ ప్రకటన
  choice: పైలాతు చేసిన బాధ్యత-నిరాకరణను అతని ప్రత్యక్ష మాటగానే ఉంచడం
  alternative: అతడు నిజంగా నిర్దోషి అని అనువాదమే నిర్ధారించేలా చెప్పడం
  rationale: వాక్యం పైలాతు వాదనను నివేదిస్తుంది; దాని సత్యాసత్యాలపై అనువాదం తీర్పు ఇవ్వదు. అందువల్ల కథనంలోని నైతిక, ధార్మిక ఉద్రిక్తత నిలుస్తుంది.
- issue: ‘ఈ రక్తం’ అనే నుడికారం
  choice: ‘ఈ రక్తం విషయంలో’ అని అనువదించడం
  alternative: ‘ఈ మనిషి రక్తం విషయంలో’ అని సందర్భార్థ పదాన్ని చేర్చడం
  rationale: మూలంలోని τοῦ αἵματος τούτου ను దగ్గరగా కాపాడుతూ, తెలుగులో బాధ్యతకు సంబంధించిన నుడికారంగా అర్థమయ్యేలా చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథన శైలి. ‘జనసమూహం’, ‘నిర్దోషిని’ వంటి పదాలు న్యాయసంబంధ సందర్భానికి తగినవి. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతగా నిలుపుతూ గ్రీకు నుడికారాలకు అవసరమైన స్పష్టతను పాదసూచికల్లో ఇచ్చాం.
