source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς· Τίνα θέλετε ἀπὸ τῶν δύο ἀπολύσω ὑμῖν; οἱ δὲ εἶπαν· ⸀Τὸν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: te
  text: 'కానీ ప్రాంతపాలకుడు వారికి జవాబుగా ఇలా అన్నాడు: “ఈ ఇద్దరిలో ఎవరిని నేను మీకు విడుదల చేయాలని మీరు కోరుకుంటున్నారు?” వారు, “బరబ్బాను” అన్నారు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτοῖς
  choice: అప్పుడు అధిపతి వారికి జవాబిస్తూ ... అని అడిగాడు
  rationale: గ్రీకు భాషలోని participle + finite verb నిర్మాణాన్ని తెలుగులో సహజంగా, ప్రతిస్పందన భావం నిలిచేలా ‘జవాబిస్తూ ... అడిగాడు’ అని ఇచ్చాం. δέను సందర్భంలోని స్వల్ప కథన మార్పును సూచించే ‘అప్పుడు’గా అనువదించాం.
- source_word: ὁ ἡγεμών
  choice: అధిపతి
  rationale: ఈ సందర్భంలో రోమా ప్రాంత పాలకుడైన పిలాతును సూచిస్తుంది. ‘అధిపతి’ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సందర్భోచితమైన పదం.
- source_word: Τίνα ... ἀπὸ τῶν δύο
  choice: ఈ ఇద్దరిలో ఎవరిని
  rationale: ఇప్పటికే పేర్కొన్న ఇద్దరిలో ఒకరిని ఎంచుకోవాలనే ప్రశ్నను తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: θέλετε
  choice: మీరు కోరుకుంటున్నారు
  rationale: ఇక్కడ θέλω కోరిక లేదా ఎంపికను సూచిస్తుంది; ‘కోరుకుంటున్నారు’ మూలంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀπολύσω ὑμῖν
  choice: మీ కోసం విడుదల చేయాలని
  rationale: న్యాయపరమైన సందర్భంలో ἀπολύωకు ‘విడుదల చేయడం’ సరైన అర్థం. ὑμῖνలోని ప్రయోజనార్థక భావాన్ని ‘మీ కోసం’ నిలుపుతుంది.
- source_word: οἱ δὲ εἶπαν
  choice: వారు ... అన్నారు
  rationale: జనసమూహపు ప్రత్యుత్తరాన్ని సరళమైన కథన కొనసాగింపుగా అందిస్తుంది; δέకు తెలుగులో ప్రత్యేక సంధిపదం అవసరం లేదు.
- source_word: Τὸν Βαραββᾶν
  choice: బరబ్బాను
  rationale: వ్యక్తి పేరును తెలుగు లిపిలో ప్రామాణికంగా లిప్యంతరీకరించి, గ్రీకు కర్మకారకాన్ని తెలుగులో ‘ను’తో సూచించాం.
