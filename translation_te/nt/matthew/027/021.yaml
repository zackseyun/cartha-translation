  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణంతో, న్యాయస్థాన సందర్భానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం.
