  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: te
  text: 'వారు ఆయనను కట్టిన తరువాత[a], ఆయనను తీసుకెళ్లి పాలకుడైన పిలాతుకు అప్పగించారు[b].


    [a] లేదా “ఆయనను బంధించి.”


    [b] లేదా “పిలాతు చేతికి ఒప్పగించారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయనను బంధించి.”
    reason: δήσαντεςకు “కట్టిన తరువాత” అనే ప్రధాన అనువాదంతో పాటు “బంధించి” అనే సహజమైన ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
  - marker: b
    text: లేదా “పిలాతు చేతికి ఒప్పగించారు.”
    reason: παρέδωκανలోని మరొకరి అదుపు లేదా అధికారానికి అప్పగించే భావాన్ని మరింత వివరణాత్మకంగా చూపే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: δήσαντες
  choice: కట్టిన తరువాత
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియలకు ముందుగా జరిగిన చర్యను సూచిస్తుంది. “కట్టిన తరువాత” ఆ క్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తూ, దేహాన్ని కట్టివేయడం అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: ἀπήγαγον
  choice: తీసుకెళ్లి
  rationale: ఈ సందర్భంలో ఒకరిని అదుపులో అక్కడి నుంచి తీసుకెళ్లడం అనే భావం ఉంది. “తీసుకెళ్లి” తెలుగులో సహజంగా ఉండి, కస్టడీలో తరలించిన భావాన్ని అతిగా వివరించకుండా తెలియజేస్తుంది.
- source_word: παρέδωκαν
  choice: అప్పగించారు
  rationale: మరొకరి అదుపు లేదా అధికారానికి అప్పగించడం అనే న్యాయపరమైన భావాన్ని ఈ పదం ఇక్కడ కలిగి ఉంది. “అప్పగించారు” ఆధునిక తెలుగులో స్పష్టంగా ఉండి, శ్రమవృత్తాంతంలోని విస్తృతమైన ధార్మిక ప్రతిధ్వనిని అనవసరంగా నిర్దేశించదు.
- source_word: Πιλάτῳ
  choice: పిలాతుకు
  rationale: వ్యక్తి పేరును తెలుగులో ప్రాచుర్యంలో ఉన్న రూపమైన “పిలాతు”గా లిప్యంతరీకరించి, గ్రీకు చతుర్థీ విభక్తిని “-కు”తో వ్యక్తం చేశాం.
- source_word: τῷ ἡγεμόνι
  choice: పాలకుడైన
  rationale: ἡγεμών ఒక పరిపాలనా అధికారిని సూచించే విస్తృత పదం. “పాలకుడు” సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది; “ప్రిఫెక్టు” అని అనడం మూలపదం కంటే చారిత్రక పదవిని మరీ నిర్దిష్టం చేస్తుంది.
- source_word: καὶ δήσαντες αὐτὸν
  choice: వారు ఆయనను కట్టిన తరువాత
  rationale: తెలుగులో కథన ప్రవాహం సహజంగా ఉండేందుకు కర్తను స్పష్టంగా చేర్చి, αὐτόνను గౌరవసూచకమైన “ఆయనను”గా అనువదించాం. ఆరంభ καίను విడిగా “మరియు” అని పెట్టకుండా వాక్యానుసంధానం ద్వారా వ్యక్తం చేశాం.
theological_decisions:
- issue: శ్రమవృత్తాంతంలో παραδίδωμι పదం అనువాదం
  choice: అప్పగించారు
  alternative: పిలాతు చేతికి ఒప్పగించారు
  rationale: తక్షణ సందర్భంలోని న్యాయపరమైన, అధికార బదిలీ భావాన్ని “అప్పగించారు” ప్రధానంగా చూపుతుంది. అదే సమయంలో ఈ క్రియకు శ్రమవృత్తాంతంలో ఉండగల ధార్మిక ప్రతిధ్వనిని తొలగించదు లేదా ఒకే సిద్ధాంతపరమైన అర్థానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. “ఆయన” గౌరవసూచక సర్వనామం; “పాలకుడు” సాధారణ పాఠకులకు అందుబాటులో ఉండే పరిపాలనా పదం. వాక్యక్రమం గ్రీకు మూలంలోని కట్టడం—తీసుకెళ్లడం—అప్పగించడం అనే చర్యల వరుసను నిలుపుతుంది.
