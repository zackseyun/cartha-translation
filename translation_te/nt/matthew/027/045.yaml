  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: te
  text: ఆరవ గంట మొదలుకొని తొమ్మిదవ గంట వరకు దేశమంతటా చీకటి కమ్ముకుంది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఆరవ గంట అంటే సుమారు మధ్యాహ్నం పన్నెండు గంటలు; తొమ్మిదవ గంట అంటే సుమారు మధ్యాహ్నం తర్వాత మూడు గంటలు.
    reason: cultural_note
  - marker: b
    text: లేదా, “భూమి అంతటా.” గ్రీకు పదానికి “దేశం” లేదా “భూమి” అనే రెండు అర్థాలూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: మొదలుకొని
  rationale: ἀπό ఆరంభ సమయాన్ని సూచిస్తుంది. δέ స్వల్ప అనుసంధాన అవ్యయం; తెలుగులో సందర్భ ప్రవాహం సహజంగా ఉండేందుకు దానిని ప్రత్యేక పదంతో వ్యక్తం చేయలేదు.
- source_word: ἕκτης ὥρας
  choice: ఆరవ గంట
  rationale: మూలంలోని కాలగణన పద్ధతిని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ఆధునిక సమయ సమానార్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: σκότος
  choice: చీకటి
  rationale: ఇది పదానికి సహజమైన ప్రాథమిక అర్థం; సంఘటనలోని తీవ్రతను స్పష్టంగా ఉంచుతుంది.
- source_word: ἐγένετο
  choice: కమ్ముకుంది
  rationale: చీకటి ఏర్పడి అంతటా వ్యాపించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: దేశమంతటా
  rationale: γῆ అనే పదానికి ‘దేశం/నేల’ లేదా ‘భూమి’ అనే అర్థాలు సాధ్యమైనవి. సందర్భానికి పరిమితమైన అర్థాన్ని ప్రధాన పాఠ్యంలో తీసుకొని, విస్తృత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: ἕως ὥρας ἐνάτης
  choice: తొమ్మిదవ గంట వరకు
  rationale: మూలంలోని కాలవ్యక్తీకరణను నిలుపుతుంది; ఆధునిక సమయాన్ని పాదసూచికలో అందిస్తుంది.
theological_decisions:
- issue: చీకటి వ్యాపించిన పరిధిలో γῆ పదార్థం
  choice: దేశం
  alternative: భూమి అంతా
  rationale: γῆ పదం రెండు అర్థాలనూ అనుమతిస్తుంది. ‘దేశం’ తక్షణ కథా సందర్భానికి తగిన పరిమిత పఠనం; విశ్వవ్యాప్త భావాన్ని నిరాకరించకుండా ‘భూమి అంతా’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ప్రాచీన కాలగణనను ప్రధాన పాఠ్యంలో ఉంచి పాదసూచికలో వివరించాం; γῆ పదంలోని నిజమైన అర్థసందిగ్ధతను కూడా నిలిపాం.
