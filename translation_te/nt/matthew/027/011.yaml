id: MAT.27.11
reference: Matthew 27:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: te
  text: యేసు అధిపతి ఎదుట నిలబడ్డాడు. అధిపతి ఆయనను, “నీవు యూదుల రాజువా?[a]” అని ప్రశ్నించాడు. అందుకు యేసు, “నీవే అంటున్నావు”[b] అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయవాసుల రాజు.” గ్రీకు పదం విస్తృతంగా యూదులను గానీ, కొన్ని సందర్భాల్లో ప్రత్యేకంగా యూదయవాసులను గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీవు అన్నట్టే,” లేదా “అది నీవు చెప్పినట్టే.” గ్రీకులో యేసు జవాబు సంక్షిప్తంగా, కొంత అసంపూర్ణంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: నిలబడ్డాడు
  rationale: ఈ సందర్భంలో క్రియకు సహజమైన అకర్మక భావాన్ని వ్యక్తం చేస్తుంది. ‘నిలబెట్టబడ్డాడు’ అనడం మూలంలో స్పష్టంగా లేని కారకత్వాన్ని చేర్చుతుంది; ‘నిలబడి ఉన్నాడు’ అనడం క్రియ కొనసాగుతున్న భావాన్ని అతిగా చూపుతుంది.
- source_word: ἔμπροσθεν
  choice: ఎదుట
  rationale: స్థానిక భావంతో పాటు న్యాయవిచారణ సందర్భానికి తగిన గౌరవప్రదమైన, సంక్షిప్తమైన తెలుగు ప్రయోగం.
- source_word: ἡγεμών / ἡγεμόνος
  choice: అధిపతి
  rationale: ఈ సందర్భంలోని రోమా పరిపాలనాధికారిని సూచించడానికి తెలుగులో స్పష్టమైన, గౌరవప్రదమైన పదం. ‘ప్రిఫెక్టు’ అతిగా సాంకేతికం; ‘పాలకుడు’ సాధ్యమైనా మరింత సాధారణార్థకం.
- source_word: ἐπηρώτησεν
  choice: ప్రశ్నించాడు
  rationale: న్యాయవిచారణ వాతావరణంలోని అధికారిక ప్రశ్నను సహజంగా తెలియజేస్తుంది; ‘విచారించాడు’ ప్రశ్నించడం కంటే విస్తృతార్థం కలిగించవచ్చు.
- source_word: βασιλεὺς
  choice: రాజు
  rationale: యేసుపై మోపబడిన రాజకీయ-రాజరిక హోదాను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: τῶν Ἰουδαίων
  choice: యూదుల
  rationale: ఈ శ్రమవృత్తాంత సందర్భంలో ప్రజాసమూహాన్ని సూచించే సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు రూపం. ‘యూదయవాసుల’ అనేది సందర్భానుసారం సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: ἔφη
  choice: అన్నాడు
  rationale: యేసు పలికిన జవాబును సరళంగా పరిచయం చేస్తుంది; ‘జవాబిచ్చాడు’ సందర్భానికి సరిపోయినా మూల క్రియకన్నా కొద్దిగా వివరణాత్మకం.
- source_word: Σὺ λέγεις
  choice: నీవే అంటున్నావు
  rationale: గ్రీకులోని సంక్షిప్తమైన, కొంత అసంపూర్ణంగా వినిపించే జవాబును తెలుగులో సహజంగా ఉంచుతూ, దాన్ని స్పష్టమైన అంగీకారంగా గానీ నిరాకరణగా గానీ మార్చదు.
theological_decisions:
- issue: Σὺ λέγεις అనే యేసు జవాబు యొక్క భావఛాయ
  choice: ‘నీవే అంటున్నావు’ అనే పరోక్షమైన, మితమైన జవాబు
  alternative: ‘నీవు అన్నట్టే’ లేదా ‘అది నీవు చెప్పినట్టే’ అనే మరింత స్పష్టమైన అంగీకారం
  rationale: గ్రీకు వాక్యం ఆరోపణను సూటిగా నిరాకరించదు; అదే సమయంలో అధిపతి ఉపయోగించిన రాజకీయ నిర్వచనాన్ని ఎలాంటి అర్హత లేకుండా యేసే ప్రకటించినట్టూ చేయదు. అందువల్ల మూలంలోని ఉద్రిక్తతను, అస్పష్టతను నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన న్యాయవిచారణ శైలిని పాటించాం. మూలంలో ప్రత్యేకమైన కాలసూచక పదం లేనందున వాక్యం మొదట ‘ఇప్పుడు’ లేదా ‘అప్పుడు’ చేర్చలేదు. అందించిన ఆంగ్ల సంప్రదింపు పాఠ్యంలో పాదసూచికల విషయాలు వాటి గుర్తులతో తారుమారైనట్లు కనిపించినందున, తెలుగు ముసాయిదాలో ‘యూదుల’ దగ్గర పదార్థ ప్రత్యామ్నాయాన్ని [a]గా, యేసు జవాబు దగ్గర భావ ప్రత్యామ్నాయాన్ని [b]గా సరైన స్థానాల్లో ఉంచాం.
