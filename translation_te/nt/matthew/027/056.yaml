  source_fidelity: గ్రీసు పాఠంలోని ἐν αἷς‌కు “వారిలో” మునుపటి వచనంలోని స్త్రీల సమూహాన్ని సహజంగా సూచిస్తుంది. ముగ్గురు/మూడు గుర్తింపు-వర్ణనలు—మగ్దలేనే మరియ, యాకోబు మరియు యోసేపు తల్లి మరియ, జెబెదయి కుమారుల తల్లి—అన్నీ మూలపాఠ క్రమం మరియు సంబంధాలను కచ్చితంగా ప్రతిబింబిస్తున్నాయి.
