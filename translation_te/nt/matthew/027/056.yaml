source:
  edition: SBLGNT
  text: ἐν αἷς ἦν Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ἡ τοῦ Ἰακώβου καὶ ⸀Ἰωσὴφ μήτηρ καὶ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: te
  text: వారిలో మగ్దలేనే మరియ, యాకోబు మరియు యోసేపు[a] తల్లి మరియ, జెబెదయి కుమారుల తల్లి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో ఇక్కడ “యోసే” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: వారిలో
  rationale: మునుపటి వచనంలో పేర్కొన్న స్త్రీల సమూహంలో వీరు ఉన్నారని తెలిపే సహజమైన తెలుగు ప్రయోగం.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: మగ్దలేనే మరియ
  rationale: వ్యక్తి పేరుతోపాటు ఆమెను గుర్తించే ప్రాంతసంబంధమైన బిరుదును తెలుగు బైబిలు నామరూపానికి అనుగుణంగా ఉంచుతుంది.
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: యాకోబు మరియు యోసేపు తల్లి మరియ
  rationale: ఈ మరియను ఆమె కుమారుల ద్వారా గుర్తిస్తున్న గ్రీకు నిర్మాణాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰωσὴφ
  choice: యోసేపు
  rationale: SBLGNT ప్రధాన పాఠంలోని Ἰωσήφ‌కు సాధారణ తెలుగు రూపం; ప్రత్యామ్నాయ పాఠాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: జెబెదయి కుమారుల తల్లి
  rationale: గ్రీకులోని సంబంధార్థక నిర్మాణాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. జాబితా నిర్మాణాన్ని నిలుపుతూ తెలుగు వాక్యక్రమానికి అనుగుణంగా బంధుత్వ సూచనలను పేర్లకు ముందు ఉంచాం.
