revisions:
- from: ప్రధాన యాజకులు, పెద్దలు ఆయన మీద నేరాలు మోపుతున్నప్పుడు, ఆయన ఏమీ జవాబివ్వలేదు.[a]
  to: ప్రధాన యాజకులూ పెద్దలూ ఆయనపై ఆరోపణలు చేస్తున్నప్పుడు, ఆయన ఏమీ జవాబు ఇవ్వలేదు.[a]
  rationale: The revision replaces the overly narrow ‘crimes’ with the source-faithful general term ‘accusations’ and makes the coordinated groups explicit. It otherwise preserves the draft’s accurate temporal, passive, legal-context, and narrative sense, without adding theological interpretation.
  reviewer_model: gpt-5.6-terra
