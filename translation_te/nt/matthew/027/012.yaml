  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: te
  text: ప్రధాన యాజకులూ పెద్దలూ ఆయనపై ఆరోపణలు చేస్తున్నప్పుడు, ఆయన ఏమీ జవాబు ఇవ్వలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన ఎలాంటి జవాబూ ఇవ్వలేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: ఆయన మీద నేరాలు మోపుతున్నప్పుడు
  rationale: ἐν + articular infinitive సమకాలీన చర్యను సూచిస్తుంది. వర్తమాన కర్మణి భావాన్ని సహజమైన ఆధునిక తెలుగులో ఈ రూపం నిలుపుతుంది.
- source_word: κατηγορεῖσθαι
  choice: నేరాలు మోపుతున్న
  rationale: న్యాయసంబంధ సందర్భంలో ఆయనకు వ్యతిరేకంగా ఆరోపణలు చేస్తున్నారనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: ప్రధాన యాజకులు, పెద్దలు
  rationale: సువార్తలలో ἀρχιερεῖς యాజక నాయకవర్గాన్ని సూచిస్తుంది; ‘ప్రధాన యాజకులు’ మరియు ‘పెద్దలు’ ప్రామాణికంగా, సులభంగా అర్థమయ్యే పదాలు.
- source_word: οὐδὲν
  choice: ఏమీ
  rationale: ἀπεκρίνατοకు సంబంధించిన ప్రత్యక్ష కర్మగా ‘ఏమీ’ గ్రీకు వాక్యంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: ἀπεκρίνατο
  choice: జవాబివ్వలేదు
  rationale: οὐδένతో కలిపి ‘ఏమీ జవాబివ్వలేదు’ అనడం గ్రీకు భావాన్ని ప్రత్యక్షంగా, సహజంగా అందిస్తుంది.
- source_word: καὶ
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: తెలుగులో ఈ కథన కొనసాగింపుకు ఆరంభ ‘మరియు’ అవసరం లేదు; దాన్ని చేర్చకపోవడం సంబంధాన్ని మార్చకుండా సహజమైన వాక్యాన్ని ఇస్తుంది.
theological_decisions:
- issue: తనపై నేరాలు మోపినవారి ముందు యేసు మౌనం
  choice: వచనంలో ఉన్న కథన విషయాన్నే—ఆయన ఏమీ జవాబివ్వలేదని—సూటిగా అనువదించడం
  alternative: యెషయా 53ను సూచించే నెరవేర్పు భాషను అనువాదంలో చేర్చడం
  rationale: ఈ వచనం ప్రవచన నెరవేర్పును స్పష్టంగా పేర్కొనదు. అందువల్ల ఆ వేదాంత సంబంధాన్ని అనువాదంలో అదనంగా చేర్చకుండా కథనంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన కథన శైలి. ‘నేరాలు మోపడం’ న్యాయసంబంధ ఆరోపణ భావాన్ని సహజంగా తెలియజేస్తుంది.
