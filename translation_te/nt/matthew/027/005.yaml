  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: te
  text: అతడు ఆ వెండిని దేవాలయ పరిశుద్ధస్థలంలోకి[a] విసిరివేసి, అక్కడి నుంచి వెళ్లిపోయాడు; ఆ తర్వాత వెళ్లి ఉరి వేసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవాలయంలోకి’. ఇక్కడి గ్రీకు పదం సాధారణంగా మొత్తం దేవాలయ ప్రాంగణం కంటే దేవాలయ పరిశుద్ధస్థలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίψας
  choice: విసిరివేసి
  rationale: గ్రీకు ఏఓరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది; తెలుగు సంయుక్త క్రియ సహజంగా చర్యల క్రమాన్ని తెలియజేస్తుంది.
- source_word: τὰ ἀργύρια
  choice: ఆ వెండిని
  rationale: అక్షరార్థంగా ‘వెండి’; సందర్భంలో ముందుగా ప్రస్తావించిన చెల్లింపును సూచిస్తుంది. ‘నాణేలు’ అని మూలంలో లేని పదాన్ని చేర్చలేదు.
- source_word: εἰς τὸν ναὸν
  choice: దేవాలయ పరిశుద్ధస్థలంలో
  rationale: ναός సాధారణంగా మొత్తం దేవాలయ ప్రాంగణాన్ని కాక దేవాలయ అంతర్భాగమైన పరిశుద్ధస్థలాన్ని సూచిస్తుంది; తెలుగులో ఈ ప్రత్యేకతను ప్రధాన పాఠంలో సహజంగా స్పష్టం చేశాం.
- source_word: ἀνεχώρησεν
  choice: అక్కడి నుంచి వెళ్లిపోయాడు
  rationale: క్రియలోని వెళ్లిపోవడం లేదా వెనుదిరగడం అనే భావాన్ని, తరువాతి కదలికతో పూర్తిగా కలిపివేయకుండా సహజ తెలుగులో తెలిపింది.
- source_word: ἀπελθὼν
  choice: ఆ తర్వాత వెళ్లి
  rationale: ἀνεχώρησεν తరువాత వచ్చే ప్రత్యేక గమనక్రియను నిలుపుతూ, తెలుగు కథన శైలిలో సహజమైన కృదంత నిర్మాణాన్ని వాడింది.
- source_word: ἀπήγξατο
  choice: ఉరి వేసుకున్నాడు
  rationale: మధ్యమ వాచ్యం స్వయంగా చేసుకున్న చర్యను సూచిస్తుంది; ఈ సందర్భంలో ఆత్మహత్యార్థకంగా ‘ఉరి వేసుకున్నాడు’ స్పష్టమైన, సహజ తెలుగు రూపం.
theological_decisions:
- issue: ναός అనే పదం మొత్తం దేవాలయాన్ని సూచిస్తుందా, ప్రత్యేకంగా పరిశుద్ధస్థలాన్ని సూచిస్తుందా
  choice: ప్రధాన పాఠంలో ‘దేవాలయ పరిశుద్ధస్థలం’ అని అనువదించి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
  alternative: దేవాలయం
  rationale: ναός కు ఉన్న ప్రత్యేక నిర్మాణార్థాన్ని కాపాడటం మూలానికి మరింత సమీపం; అయితే సాధారణ విస్తృత అర్థాన్ని పాదసూచికలో ఉంచడం ద్వారా నిజమైన పదార్థ పరిధిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. రెండు గమనక్రియల మధ్య ఉన్న స్వల్ప పునరుక్తిని సహజ తెలుగులో నిలిపేందుకు ‘అక్కడి నుంచి వెళ్లిపోయాడు; ఆ తర్వాత వెళ్లి’ అని ఇచ్చాం.
