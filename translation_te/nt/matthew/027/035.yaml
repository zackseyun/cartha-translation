source:
  edition: SBLGNT
  text: σταυρώσαντες δὲ αὐτὸν διεμερίσαντο τὰ ἱμάτια αὐτοῦ βάλλοντες κλῆρον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/035.yaml
  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: te
  text: వారు ఆయనను సిలువ వేసిన తర్వాత[a], చీట్లు వేసి ఆయన వస్త్రాలను పంచుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపనిష్ఠగా: ‘ఆయనను సిలువ వేసినప్పుడు, చీట్లు వేస్తూ ఆయన వస్త్రాలను పంచుకున్నారు.’'
    reason: కాలసంబంధ అఓరిస్ట్ క్రియావిశేషణ రూపాన్ని తెలుగులో వ్యక్తపరచగల ప్రత్యామ్నాయాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: σταυρώσαντες
  choice: సిలువ వేసిన తర్వాత
  rationale: అనంతర కాలాన్ని సూచించే అఓరిస్ట్ క్రియావిశేషణ రూపం, వస్త్రాలను పంచుకోవడానికి ముందు సిలువ వేయడం జరిగిందని తెలియజేస్తుంది. ఈ కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ కథనాన్ని ముందుకు నడిపించే స్వల్ప అనుసంధాన పదం. తెలుగు వాక్యప్రవాహంలో దానిని ప్రత్యేకంగా అనువదించకపోయినా సంబంధం సహజంగా నిలుస్తుంది.
- source_word: διεμερίσαντο
  choice: పంచుకున్నారు
  rationale: వస్త్రాలను తమ మధ్య విభజించుకోవడం అనే స్పష్టమైన సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: ఆయన వస్త్రాలను
  rationale: ἱμάτια అనే పదానికి ఉన్న సాధారణ వస్త్రాలు/దుస్తులు అనే అర్థాన్ని, గంభీరమైనప్పటికీ నేటి పాఠకులకు అర్థమయ్యే భాషలో నిలుపుతుంది; ‘పైవస్త్రాలు’ అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: βάλλοντες κλῆρον
  choice: చీట్లు వేసి
  rationale: చీటి వేయడం ద్వారా వస్త్రాల పంపకం జరిగిందనే సాధనార్థ సంబంధాన్ని సహజమైన తెలుగు ప్రయోగంతో తెలియజేస్తుంది. గ్రీకులో κλῆρον ఏకవచనంలో ఉన్నా, తెలుగు నుడికారంలో ‘చీట్లు వేయడం’ సహజం.
theological_decisions:
- issue: βάλλοντες κλῆρον అనే క్రియావిశేషణ పదబంధానికి διεμερίσαντο అనే ప్రధాన క్రియతో ఉన్న సంబంధం
  choice: చీట్లు వేయడం వస్త్రాలను పంచుకున్న విధానంగా చూపిస్తూ, ‘చీట్లు వేసి ... పంచుకున్నారు’ అని అనువదించాం.
  alternative: ‘ఆయన వస్త్రాలను పంచుకొని, చీటి వేశారు’
  rationale: గ్రీకు క్రియావిశేషణ పదబంధం ప్రధాన క్రియను సహజంగా విశదీకరిస్తూ పంపకం ఎలా జరిగిందో తెలియజేస్తుంది. తెలుగు వాక్యక్రమం ఈ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, శ్రమవృత్తాంతానికి తగిన గౌరవభరితమైన శైలిని నిలిపాం. ‘వస్త్రాలు’ కొద్దిగా గంభీరమైనదైనా ప్రాచీనంగా అనిపించని పదం.
