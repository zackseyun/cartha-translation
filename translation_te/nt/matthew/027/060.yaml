  source_fidelity: 'The draft accurately conveys the placement of Jesus’ body, the new tomb belonging to Joseph, the large stone, and Joseph’s departure. However, “బండలో తొలిపించిన” is a causative expression (“had [it] bored/hewn”) whereas ἐλατόμησεν is active: Joseph himself hewed/cut the tomb from the rock. The revision restores this active sense.'
  naturalness: The revised wording is idiomatic modern standard Telugu and retains a restrained narrative register. “ప్రవేశద్వారం దగ్గరకు” naturally expresses rolling the stone up to the tomb entrance.
  terminology: “సమాధి” appropriately renders μνημεῖον in this burial context. “రాతిలో చెక్కిన” accurately reflects a rock-hewn tomb. The footnote responsibly preserves the lexical alternative of “door.”
