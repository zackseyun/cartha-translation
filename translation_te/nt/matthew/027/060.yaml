id: MAT.27.60
reference: Matthew 27:60
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: te
  text: ఆయన ఆ దేహాన్ని తాను రాతిలో చెక్కిన తన కొత్త సమాధిలో ఉంచాడు. తరువాత సమాధి ప్రవేశద్వారం దగ్గరకు[a] ఒక పెద్ద రాయిని దొర్లించి వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమాధి తలుపు దగ్గరకు.’ గ్రీకు పదం ‘తలుపు’ను లేదా ‘ప్రవేశద్వారం’ను సూచించగలదు; రాతిలో చెక్కిన సమాధి సందర్భంలో స్పష్టత కోసం ‘ప్రవేశద్వారం’ అని అనువదించాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκεν αὐτό
  choice: ఆ దేహాన్ని … ఉంచాడు
  rationale: τίθημι ఇక్కడ యేసు దేహాన్ని సమాధిలో ఉంచడాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో కేవలం ‘దానిని’ అనడం కంటే, పూర్వ సందర్భంలోని దేహాన్ని స్పష్టంగా సూచించే ‘ఆ దేహాన్ని’ సహజంగా ఉంటుంది.
- source_word: ἐν τῷ καινῷ αὐτοῦ μνημείῳ
  choice: తన కొత్త సమాధిలో
  rationale: μνημεῖον ఈ సందర్భంలో బండలో తొలిచిన సమాధిని సూచిస్తుంది; καινός‌ను దాని ప్రత్యక్ష అర్థమైన ‘కొత్త’గా ఉంచాం. ‘తన’ అనే రూపం యోసేపు సొంత సమాధి అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ
  choice: తాను బండలో తొలిపించిన
  rationale: λατομέω బండను తొలిచి లేదా చెక్కి స్థలం చేయడాన్ని సూచిస్తుంది. సమాధిని యోసేపే స్వయంగా శ్రమించి తొలిచాడని తప్పనిసరిగా చెప్పకుండా, అతడు దాన్ని సిద్ధం చేయించాడనే సాధ్యమైన భావాన్నీ నిలిపేందుకు తెలుగు causative రూపం వాడాం.
- source_word: προσκυλίσας λίθον μέγαν
  choice: ఒక పెద్ద రాయిని దొర్లించి
  rationale: Aorist participle ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను తెలుపుతుంది. ‘దొర్లించి’ ఆ క్రమాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; λίθον μέγαν‌కు ‘ఒక పెద్ద రాయి’ నేరమైన అనువాదం.
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: సమాధి ప్రవేశద్వారానికి
  rationale: θύραకు ‘తలుపు’ లేదా ‘ప్రవేశద్వారం’ అనే అర్థాలు ఉండవచ్చు. బండలో తొలిచిన సమాధి సందర్భంలో ఆధునిక పాఠకునికి ‘ప్రవేశద్వారం’ స్పష్టంగా ఉంటుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లిపోయాడు
  rationale: ἀπέρχομαι ఇక్కడ అక్కడి నుంచి వెళ్లడాన్ని సాధారణంగా సూచిస్తుంది; ‘వెళ్లిపోయాడు’ ఆధునిక తెలుగు కథనంలో సహజం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని అనుసరించాం. ‘బండలో తొలిపించిన’ అనే పదబంధం రాతిలో చెక్కి సిద్ధం చేసిన సమాధి స్వరూపాన్ని తెలియజేస్తూ, కర్త స్వయంగా చేశాడా లేక చేయించాడా అనే విషయాన్ని అతిగా నిర్ణయించదు.
