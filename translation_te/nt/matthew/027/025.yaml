source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πᾶς ὁ λαὸς εἶπεν· Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: te
  text: ప్రజలందరూ జవాబిచ్చారు[a], “అతని రక్తం మా మీద, మా పిల్లల మీద ఉండుగాక.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఈ దృశ్యంలో సమకూడిన ప్రజల సమూహం మాట్లాడుతోంది. ఈ మాటలను ప్రతి తరంలోని యూదులందరికీ శాశ్వతమైన అపరాధాన్ని ఆపాదిస్తున్నట్లుగా అర్థం చేసుకోకూడదు.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: జవాబిచ్చారు
  rationale: ἀποκρίνομαι అనే కృదంతం εἶπεν‌తో కలిసి జవాబును పరిచయం చేసే గ్రీకు నుడికారంగా ఉంది. తెలుగులో ‘జవాబిచ్చారు’ అని సహజంగా ఏకీకరించడం భావాన్ని కాపాడుతుంది.
- source_word: πᾶς ὁ λαὸς
  choice: అక్కడున్న ప్రజలందరూ
  rationale: ఈ పదబంధానికి సమూహార్థంగా ‘ప్రజలందరూ’ సరిపోతుంది. ‘అక్కడున్న’ అనేది వాక్యసందర్భంలోని సమకూడిన ప్రజలను సూచించి, దీన్ని అన్ని కాలాల యూదులకు వర్తింపజేసే అపార్థాన్ని తగ్గిస్తుంది; జాతి లేదా తరతరాల భావాన్ని చేర్చదు.
- source_word: Τὸ αἷμα αὐτοῦ
  choice: అతని రక్తం
  rationale: న్యాయసంబంధ సందర్భంలో ఇది అతని మరణానికి సంబంధించిన బాధ్యతను సూచించగలిగినా, మూలంలోని ‘రక్తం’ అనే రూపకాన్ని వివరణాత్మకంగా విస్తరించకుండా ఉంచాం.
- source_word: ἐφ’ ἡμᾶς
  choice: మా మీదా ... ఉండుగాక
  rationale: గ్రీకులో క్రియ లేకపోయినా, పలుకులోని స్వీకార/శాపార్థక బలాన్ని తెలుగులో ‘ఉండుగాక’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: మా పిల్లల మీదా
  rationale: τέκναకు సహజమైన ప్రత్యక్ష అర్థం ‘పిల్లలు.’ ‘సంతతివారు’ అని విస్తరించకుండా, పునరుక్త విభక్తి ద్వారా సమాంతరతను నిలిపాం.
theological_decisions:
- issue: πᾶς ὁ λαὸς‌ను యూదులందరిపై శాశ్వత నేరారోపణగా అపార్థం చేసుకునే అవకాశం
  choice: కథా దృశ్యంలో అక్కడ సమకూడిన ప్రజల సమూహానికే పరిమితమయ్యేలా ‘అక్కడున్న ప్రజలందరూ’ అని అనువదించి, పాదసూచికలో స్పష్టం చేయడం
  alternative: ప్రజలందరూ; జనసమూహమంతా
  rationale: మూలపాఠంలోని సమూహ బలాన్ని తగ్గించకుండా కాపాడాలి; అదే సమయంలో వాక్యం చెప్పని జాతిపరమైన లేదా తరతరాల శాశ్వత అపరాధభావాన్ని అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘ఉండుగాక’ మూలంలోని గంభీరమైన స్వీకార/శాపార్థక ఉచ్చారణను నిలుపుతుంది; పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
