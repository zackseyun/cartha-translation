id: MAT.8.3
reference: Matthew 8:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: te
  text: ఆయన చెయ్యి చాపి అతణ్ణి తాకి, “నాకు ఇష్టమే; శుద్ధుడవు!” అన్నాడు. వెంటనే అతని కుష్ఠరోగం శుద్ధమైంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “కుష్ఠరోగం” అని అనువదించిన గ్రీకు పదం λέπρα. ఇది ఆధునిక హాన్సెన్ వ్యాధినే కాక, మరికొన్ని తీవ్రమైన చర్మవ్యాధులను కూడా సూచించి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: చెయ్యి చాపి
  rationale: ముందుగా జరిగిన స్పష్టమైన శారీరక చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἥψατο αὐτοῦ
  choice: అతణ్ణి తాకి
  rationale: జెనిటివ్ కర్మతో ఉన్న ἅπτομαι ఇక్కడ సాధారణంగా ‘తాకు’ అనే అర్థాన్నే ఇస్తుంది.
- source_word: Θέλω
  choice: నాకు ఇష్టమే
  rationale: మునుపటి విన్నపంలో వ్యక్తమైన యేసు సమ్మతిని ఇది సహజంగా తెలియజేస్తుంది; భవిష్యత్ కాల భావాన్ని అనవసరంగా చేర్చదు.
- source_word: καθαρίσθητι
  choice: శుద్ధుడవు
  rationale: ఆజ్ఞ యొక్క సంక్షిప్త బలాన్ని నిలుపుతూ, శారీరక స్వస్థతతోపాటు శుద్ధి భావాన్ని కూడా కాపాడుతుంది.
- source_word: εὐθέως
  choice: వెంటనే
  rationale: ఫలితం తక్షణమే సంభవించిందనే మత్తయి ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκαθαρίσθη αὐτοῦ ἡ λέπρα
  choice: అతని కుష్ఠరోగం శుద్ధమైంది
  rationale: గ్రీకులో ‘కుష్ఠరోగం’ వ్యాకరణ కర్తగా ఉండడాన్ని, అలాగే καθαρίζω పదంలోని శుద్ధి భాషను నిలుపుతుంది.
- source_word: ἡ λέπρα
  choice: కుష్ఠరోగం
  rationale: బైబిలు వాడుకలో సుపరిచితమైన పదాన్ని ప్రధాన పాఠ్యంలో ఉంచుతుంది; అయితే దాని ప్రాచీన అర్థపరిధి ఆధునిక హాన్సెన్ వ్యాధికన్నా విస్తృతమైనదని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: καθαρίζωలోని శుద్ధి/స్వస్థత భావం
  choice: ఆజ్ఞలోనూ ఫలితంలోనూ ‘శుద్ధి’ భాషను నిలుపడం
  alternative: ‘స్వస్థపరచు/నయమవు’ అని అనువదించడం
  rationale: ఇక్కడి గ్రీకు పదం శారీరక స్వస్థతతోపాటు ఆచారపరమైన శుద్ధి భావాన్నీ మోస్తుంది; కేవలం ‘స్వస్థత’ అని అనడం ఆ భావపరిధిని తగ్గిస్తుంది.
- issue: యేసు సమాధానంలో Θέλω అర్థం
  choice: నాకు ఇష్టమే
  alternative: నేను కోరుతున్నాను / నేను చేస్తాను
  rationale: రోగి అడిగింది యేసు చేయగలడా అన్నది కాక, చేయడానికి ఆయనకు ఇష్టముందా అన్నది; కాబట్టి సమ్మతిని తెలిపే రూపం సందర్భానికి సరిపోతుంది.
- issue: చివరి వాక్యంలో వ్యాకరణ కర్త
  choice: ‘అతని కుష్ఠరోగం’నే కర్తగా ఉంచడం
  alternative: ‘అతడు కుష్ఠరోగం నుంచి శుద్ధుడయ్యాడు’ అని వ్యక్తిని కర్తగా మార్చడం
  rationale: గ్రీకు వాక్య నిర్మాణంలోని అసాధారణమైన కానీ అర్థవంతమైన రూపాన్ని అనవసరంగా సాధారణీకరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘చెయ్యి చాపి’, ‘నాకు ఇష్టమే’ వంటి సహజ రూపాలను వాడుతూ, మూలంలోని శుద్ధి పదజాలాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
