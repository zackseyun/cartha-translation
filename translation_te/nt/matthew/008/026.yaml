id: MAT.8.26
reference: Matthew 8:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: te
  text: ఆయన వారితో, “అల్పవిశ్వాసులారా, మీరెందుకు భయపడుతున్నారు?” అని అన్నాడు. అప్పుడు ఆయన లేచి గాలులను, సముద్రాన్ని గద్దించాడు; గొప్ప ప్రశాంతత ఏర్పడింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: ఇంత భయపడుతున్నారు
  rationale: δειλός ఇక్కడ ప్రమాదం ఎదుట భయపడే స్థితిని సూచిస్తుంది. ఆధునిక తెలుగులో సహజమైన ప్రశ్నారూపం కోసం ‘మీరెందుకు ఇంత భయపడుతున్నారు?’ అని అనువదించాం; ‘పిరికివారు’ అనే వ్యక్తిత్వనిందను అనవసరంగా బలపరచలేదు.
- source_word: ὀλιγόπιστοι
  choice: అల్పవిశ్వాసులారా
  rationale: యేసు సంబోధనలోని ‘తక్కువ విశ్వాసం గలవారు’ అనే భావాన్ని సంక్షిప్తంగా, గంభీరంగా నిలుపుతుంది.
- source_word: ἐπετίμησεν
  choice: గద్దించాడు
  rationale: తీవ్రంగా మందలించడం లేదా అదుపుచేయమని ఆజ్ఞాపించడం అనే మూలపద భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γαλήνη μεγάλη
  choice: గొప్ప ప్రశాంతత
  rationale: తుఫాను అనంతరం సముద్రం పూర్తిగా నెమ్మదించిన స్థితిని, μεγάλη ఇచ్చే తీవ్రతతో సహా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ὀλιγόπιστοι అనే సంబోధనలో విశ్వాస పరిమాణం మరియు శిష్యుల భయం మధ్య సంబంధం
  choice: ‘అల్పవిశ్వాసులారా’ అని నేరుగా నిలుపడం
  alternative: ‘విశ్వాసం తక్కువగా ఉన్నవారలారా’
  rationale: మూలంలోని మందలింపు స్వరాన్ని, విశ్వాసం పూర్తిగా లేనిదని కాక తక్కువగా ఉందనే సూక్ష్మభేదాన్ని కాపాడుతుంది.
- issue: సృష్టిపై యేసు అధికారాన్ని సూచించే ἐπετίμησεν
  choice: ‘గద్దించాడు’
  alternative: ‘ఆజ్ఞాపించాడు’
  rationale: మూలపాఠం ఉపయోగించిన మందలింపు క్రియను నిలుపుతూ, అది ఎలా కార్యసిద్ధి చెందిందో అదనపు వివరణతో నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సహజమైన వాక్యనిర్మాణం, అయితే సంబోధనలోని గంభీరత మరియు కథనంలోని తీవ్రత నిలుపబడ్డాయి. మూలంలోని τότε ను ‘అప్పుడు’గా, ఫలిత క్రమాన్ని సహజంగా చూపేందుకు చివరి వాక్యంలో ‘వెంటనే’గా వ్యక్తం చేశాం.
