  source_fidelity: The draft accurately conveys the rebuke, the address to those of little faith, Jesus' rising, his rebuke of the winds and sea, and the resulting great calm. However, ‘వెంటనే’ (“immediately”) adds a temporal detail not present in the Greek.
  naturalness: The Telugu is clear and modern. Removing ‘ఇంత’ and ‘వెంటనే’ produces a more direct rendering without losing natural flow.
  terminology: ‘అల్పవిశ్వాసులారా’ appropriately represents ὀλιγόπιστοι, and ‘గద్దించాడు’ suitably preserves the rebuking force of ἐπετίμησεν without adding doctrinal interpretation. ‘గొప్ప ప్రశాంతత’ adequately conveys γαλήνη μεγάλη.
  issues:
  - severity: low
    issue: ‘వెంటనే’ adds an unstated temporal element.
    rationale: The source says that a great calm came about after Jesus rebuked the winds and sea, but does not explicitly say ‘immediately.’
  - severity: low
    issue: ‘ఇంత’ slightly heightens the question.
    rationale: δειλοί asks why they are fearful; ‘ఇంత’ (“so/this much”) is not expressed in the Greek and is unnecessary in Telugu.
