id: MAT.8.17
reference: Matthew 8:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: te
  text: 'ప్రవక్తయైన యెషయా ద్వారా చెప్పబడిన మాట నెరవేరునట్లు జరిగింది: “ఆయనే మన బలహీనతలను తీసుకున్నాడు[a]; మన రోగాలను మోశాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అస్వస్థతలను.” గ్రీకు పదం బలహీనతలు, అస్వస్థతలు లేదా అనారోగ్యాలను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “భరించాడు.” ఈ పదం యెషయా 53:4తో ఉన్న సంబంధాన్ని, అలాగే ‘మోయడం’ అనే భావాన్ని నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: నెరవేరేలా ఇలా జరిగింది
  rationale: మత్తయి ఉపయోగించే నెరవేర్పు సూత్రంలోని ఉద్దేశం/ఫలితం భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου
  choice: ప్రవక్తయైన యెషయా ద్వారా చెప్పబడిన మాట
  rationale: διά + షష్ఠీ విభక్తి సూచించే మాధ్యమత్వాన్ని ‘ద్వారా’ నిలుపుతుంది; ప్రవక్త ద్వారా పలికిన మాట అనే భావం స్పష్టంగా ఉంటుంది.
- source_word: Αὐτὸς
  choice: ఆయనే
  rationale: గ్రీకు సర్వనామంలోని ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: ἀσθενείας
  choice: బలహీనతలను
  rationale: ఈ పదానికి బలహీనతలు, అస్వస్థతలు, అనారోగ్యాలు అనే విస్తృత భావపరిధి ఉంది; ప్రధాన పాఠంలో దాని విస్తృతతను నిలిపి, సందర్భానుగుణ వైద్యార్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ἔλαβεν
  choice: తీసుకున్నాడు
  rationale: λαμβάνω యొక్క ప్రత్యక్ష భావాన్ని నిలుపుతుంది; ‘తొలగించాడు’ అని అర్థాన్ని విస్తరించదు.
- source_word: νόσους
  choice: రోగాలను
  rationale: శారీరక వ్యాధిని సూచించే νόσος కు ఖచ్చితమైన, సహజమైన తెలుగు పదం.
- source_word: ἐβάστασεν
  choice: మోశాడు
  rationale: భారం మోయడం అనే βαστάζω భావాన్ని, యెషయా 53తో ఉన్న ప్రతిధ్వనిని తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: యెషయా 53:4 ఉల్లేఖనాన్ని మత్తయి స్వస్థపరిచే పరిచర్యకు అన్వయించడం
  choice: ‘బలహీనతలు’ మరియు ‘రోగాలు’ అని శారీరక బాధ సందర్భానికి సరిపోయేలా, అయినా భావపరిధిని కుదించకుండా అనువదించడం
  alternative: ‘అస్వస్థతలు’ మరియు ‘వ్యాధులు’ అని మరింత వైద్యపరంగా అనువదించడం
  rationale: సమీప సందర్భం యేసు చేసిన స్వస్థతలను సూచిస్తుంది. అయితే ఈ వచనం ఒంటరిగా ఒక నిర్దిష్ట ప్రాయశ్చిత్త సిద్ధాంతాన్ని నిర్ణయించేలా అనువదించకుండా, యెషయా ఉల్లేఖనంలోని విస్తృత theological tension ను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘ఆయనే’ ద్వారా ఉద్ఘాటన, ‘ద్వారా’ ద్వారా ప్రవక్త మాధ్యమత్వం నిలుపబడ్డాయి.
