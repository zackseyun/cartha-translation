id: MAT.8.13
reference: Matthew 8:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: te
  text: యేసు శతాధిపతితో, “వెళ్లు; నీవు నమ్మినట్లే నీకు జరుగుగాక” అని చెప్పాడు. ఆ గంటలో సేవకుడు[a] స్వస్థపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బాలుడు” లేదా “పిల్లవాడు.” గ్రీకు పదమైన παῖς సేవకుణ్ణి గానీ, చిన్న వయసు వ్యక్తిని గానీ సూచించవచ్చు. ఈ సందర్భంలో శతాధిపతి ఆధీనంలోని వ్యక్తికి “సేవకుడు” అనే అర్థం బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: శతాధిపతితో
  rationale: దాదాపు వందమంది సైనికులకు అధికారి అయిన రోమా సైనిక పదవిని నిర్దిష్టంగా సూచించే, తెలుగు బైబిలు సందర్భంలో సుపరిచితమైన పదం.
- source_word: Ὕπαγε
  choice: వెళ్లు
  rationale: వెళ్లమనే ఆజ్ఞను అదనపు భావం చేర్చకుండా సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὡς ἐπίστευσας
  choice: నీవు నమ్మినట్లే
  rationale: πίστευσας అనే క్రియారూపంలోని వ్యక్తిగత నమ్మకాన్ని నామవాచకంగా మార్చకుండా నిలుపుతుంది.
- source_word: γενηθήτω σοι
  choice: నీకు జరుగుగాక
  rationale: γίνομαι యొక్క ఆజ్ఞార్థక, అనుమతార్థక బలాన్ని నిలుపుతూ, గంభీరమైన మరియు అర్థమయ్యే తెలుగు ప్రయోగాన్ని అందిస్తుంది.
- source_word: παῖς
  choice: సేవకుడు
  rationale: ఈ శతాధిపతి ఆధీనంలోని వ్యక్తిని సూచించే సందర్భంలో ‘సేవకుడు’ ఉత్తమంగా సరిపోతుంది; యువకుడు లేదా పిల్లవాడు అనే అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: ἰάθη
  choice: స్వస్థపడ్డాడు
  rationale: ἰάομαι యొక్క కర్మణి భావమైన స్వస్థత పొందడాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: అదే గంటలో
  rationale: మూలంలోని కాలవ్యక్తీకరణను నిలుపుతూ, సందర్భంలోని తక్షణత్వాన్ని ‘అదే’ ద్వారా సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: πιστεύω పదంలోని నమ్మకం/విశ్వాసం భావం
  choice: నమ్మినట్లే
  alternative: విశ్వసించినట్లే
  rationale: మూలంలోని క్రియారూపాన్ని అలాగే ఉంచి, శతాధిపతి చేసిన వ్యక్తిగత నమ్మకాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది; దీనిని ‘నీ విశ్వాసం ప్రకారం’ అనే నామవాచక నిర్మాణంగా మార్చి వ్యాఖ్యానించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘జరుగుగాక’ సాధారణ సంభాషణకంటే కొద్దిగా గంభీరమైనదైనా, గ్రీకు ఆజ్ఞార్థక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది. పాదసూచిక గుర్తును దాని విషయమైన ‘సేవకుడు’ పదం దగ్గర ఉంచాం.
