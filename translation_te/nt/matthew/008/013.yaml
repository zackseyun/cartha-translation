  naturalness: The Telugu is clear, modern, and suitably dignified. “వెళ్లు” and “నీకు జరుగుగాక” are natural in this concise declarative setting. “ఆ గంటలో” is also more idiomatic and contextually precise than “అదే గంటలో.”
  terminology: “శతాధిపతి” is an established and appropriate equivalent for ἑκατοντάρχης. “సేవకుడు” appropriately renders παῖς in context, while the footnote correctly retains the possible youthful-reference senses. “స్వస్థపడ్డాడు” is a natural Telugu expression for being healed.
