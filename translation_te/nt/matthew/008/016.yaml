reference: Matthew 8:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: te
  text: సాయంకాలమైనప్పుడు, దయ్యాలు పట్టిన అనేకమందిని[a] ఆయన దగ్గరికి తీసుకొచ్చారు. ఆయన మాటతో ఆత్మలను వెళ్లగొట్టి, అనారోగ్యంతో ఉన్న వారందరినీ స్వస్థపరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దయ్యాల ప్రభావానికి గురైన అనేకమందిని.’ గ్రీకు కృదంతం దయ్యాల ప్రభావం లేదా ఆధీనంలో ఉన్నవారిని సూచిస్తుంది; ‘దయ్యాలు పట్టిన’ అనేది తెలుగులో వాడుకలో ఉన్న సంక్షిప్త ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: సాయంకాలమైనప్పుడు
  rationale: కాలాన్ని సూచించే genitive absolute నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: προσήνεγκαν αὐτῷ
  choice: ఆయన దగ్గరికి తీసుకొచ్చారు
  rationale: ఇక్కడ προσφέρω ప్రజలను యేసు దగ్గరికి తీసుకురావడాన్ని సూచిస్తుంది; ఈ ప్రయోగం సహజంగానూ మూలార్థానికి సమీపంగానూ ఉంది.
- source_word: δαιμονιζομένους πολλούς
  choice: దయ్యాలు పట్టిన అనేకమందిని
  rationale: దయ్యాల ప్రభావం లేదా ఆధీనంలో ఉన్నవారిని సూచించే గ్రీకు participle‌కు ఇది తెలుగులో సంక్షిప్తమైన, సంప్రదాయబద్ధమైన ప్రయోగం; దాని భావపరిధిని పాదసూచికలో తెలియజేస్తుంది.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: ఆ ఆత్మలను వెళ్లగొట్టి
  rationale: ἐκβάλλω బలవంతంగా బయటకు పంపడాన్ని సూచిస్తుంది. సందర్భం అవి దుష్టాత్మలని స్పష్టం చేసినా, గ్రీకులోని ‘ఆత్మలు’ అనే ప్రత్యక్ష పదాన్ని నిలుపుతుంది.
- source_word: λόγῳ
  choice: ఒక్క మాటతో
  rationale: సాధనార్థక dative‌ను సహజంగా వ్యక్తం చేస్తూ, కేవలం ఒక మాట ద్వారానే జరిగిన కార్యంలోని అధికారాన్ని చూపుతుంది; మూలంలో లేని ‘తన’ అనే పదాన్ని చేర్చదు.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: అనారోగ్యంతో ఉన్న వారందరినీ
  rationale: κακῶς ἔχειν అనే గ్రీకు నుడికారం అనారోగ్యంగా ఉండడాన్ని సూచిస్తుంది; స్వస్థపరిచే సందర్భానికి ఇది స్పష్టంగా సరిపోతుంది.
- source_word: ἐθεράπευσεν
  choice: స్వస్థపరిచాడు
  rationale: సువార్తలలో θεραπεύω సూచించే స్వస్థత కార్యానికి గౌరవప్రదమైన, సాధారణ తెలుగు పదం.
theological_decisions:
- issue: δαιμονιζομένους మరియు τὰ πνεύματα సూచించే స్థితి
  choice: ‘దయ్యాలు పట్టిన’ మరియు ‘ఆ ఆత్మలు’ అని అనువదించి, వచనం చెప్పే దయ్యాల బాధను వాస్తవమైనదిగా నిలుపడం
  alternative: ‘దయ్యాల ప్రభావానికి గురైనవారు’ లేదా కేవలం మానసిక అనారోగ్యంగా వ్యాఖ్యానించడం
  rationale: వచనం ఆత్మలను వెళ్లగొట్టడాన్నీ, అనారోగ్యంతో ఉన్నవారిని స్వస్థపరచడాన్నీ వేర్వేరు కార్యాలుగా పేర్కొంటుంది. అందువల్ల దాని స్వంత వర్గీకరణను మనస్తత్వశాస్త్ర పరంగా మార్చకుండా నిలుపుతుంది; participle భావపరిధిని పాదసూచిక సంరక్షిస్తుంది.
- issue: λόγῳ యొక్క సాధనార్థక భావం
  choice: ‘ఒక్క మాటతో’
  alternative: ‘తన మాటతో’ లేదా ‘మాట్లాడడం ద్వారా’
  rationale: యేసు ఆజ్ఞాధికారాన్ని కథనం చూపిన మేరకు మాత్రమే వ్యక్తం చేస్తుంది; మూలంలో స్పష్టంగా లేని స్వామ్యసూచకాన్ని లేదా అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఒక్క మాటతో’ యేసు కార్యంలోని తక్షణ అధికారాన్ని సహజంగా తెలియజేస్తుంది. అందించిన ఆంగ్ల పాఠ్యంలో [a] గుర్తు కాలవాచక పదబంధం తరువాత ఉన్నప్పటికీ, పాదసూచిక δαιμονιζομένους గురించినది కాబట్టి తెలుగు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం తరువాత ఉంచబడింది.
