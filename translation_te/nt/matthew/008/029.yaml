id: MAT.8.29
reference: Matthew 8:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: te
  text: ఇదిగో, వారు బిగ్గరగా కేకలు వేస్తూ, “దేవుని కుమారుడా, మాకూ నీకూ ఏమిటి సంబంధం?[a] నిర్ణయించిన సమయానికి ముందే మమ్మల్ని యాతన పెట్టడానికి ఇక్కడికి వచ్చావా?[b]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాతో నీకేం పని?” ఇంకా అక్షరార్థంగా, “మాకూ నీకూ ఏమి సంబంధం?”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సమయానికి ముందే.” ఇక్కడి గ్రీకు పదం నిర్ణయించబడిన సమయాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: ఇదిగో
  rationale: ఆకస్మిక పరిణామంపై పాఠకుని దృష్టిని నిలిపే గ్రీకు సంభాషణా సూచకాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: ἔκραξαν λέγοντες
  choice: వారు బిగ్గరగా కేకలు వేస్తూ … అన్నారు
  rationale: κράζω లోని గట్టిగా అరచే భావాన్ని ‘బిగ్గరగా కేకలు’ తెలియజేస్తుంది; λέγοντες ను తెలుగు వాక్యనిర్మాణానికి సహజంగా ‘అన్నారు’తో వ్యక్తం చేసింది.
- source_word: Τί ἡμῖν καὶ σοί
  choice: నీకూ మాకూ ఏమిటి?
  rationale: దూరీకరణ లేదా ప్రతిఘటనను తెలిపే సెమిటిక్-గ్రీకు నుడికారాన్ని సంక్షిప్తంగా నిలుపుతూ, దాని అస్పష్టతను అతిగా వివరణాత్మకంగా పరిష్కరించదు.
- source_word: υἱὲ τοῦ θεοῦ
  choice: దేవుని కుమారుడా
  rationale: యేసును నేరుగా సంబోధించే క్రీస్తుసంబంధ బిరుదును సరళంగా, యథార్థంగా అనువదిస్తుంది.
- source_word: ἦλθες ὧδε
  choice: ఇక్కడికి వచ్చావా?
  rationale: స్థలార్థకమైన ὧδε ను ‘ఇక్కడికి’గా స్పష్టంగా నిలుపుతూ, అఒరిస్టు ప్రశ్నను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: πρὸ καιροῦ
  choice: నిర్ణయించిన సమయానికి ముందే
  rationale: καιρός కేవలం సాధారణ కాలాన్ని కాక నియమిత లేదా తగిన సమయాన్ని సూచించగలదనే భావాన్ని నిలుపుతుంది; ‘ముందే’ ప్రశ్నలోని అకాల భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: βασανίσαι
  choice: బాధించడానికి
  rationale: తీర్పుతో ముడిపడిన తీవ్రమైన యాతన భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది; శారీరక హింసకే పరిమితం చేయదు.
- source_word: ἡμᾶς
  choice: మమ్మల్ని
  rationale: మాట్లాడుతున్న దయ్యాలను సూచించే బహువచన కర్మరూపాన్ని నేరుగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: దయ్యాలు యేసు గుర్తింపును ప్రకటించడం
  choice: దేవుని కుమారుడా
  alternative: దేవుని పుత్రుడా
  rationale: మూలపాఠంలోని ఉన్నత క్రీస్తుసంబంధ బిరుదును తగ్గించకుండా నిలుపుతుంది; ‘కుమారుడు’ ఆధునిక సాధారణ తెలుగులో మరింత సహజం.
- issue: καιρός లోని అంత్యకాల సంబంధ సూచన
  choice: నిర్ణయించిన సమయానికి ముందే
  alternative: సమయానికి ముందే
  rationale: తీర్పుకు ఒక నిర్ణీత సమయం ఉందనే సూచనను నిలుపుతుంది; అయితే దాన్ని ఎవరు నిర్ణయించారో లేదా ఆ తీర్పు వివరాలేమిటో పాఠ్యంలో చేర్చదు.
- issue: Τί ἡμῖν καὶ σοί అనే నుడికారంలోని సంబంధ విరోధం
  choice: నీకూ మాకూ ఏమిటి?
  alternative: మాతో నీకేం పని?
  rationale: మూలంలోని పరస్పర సంబంధ నిర్మాణాన్ని, దాని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది; ప్రత్యామ్నాయం భావాన్ని సహజంగా చెబుతుందిగానీ యేసు ఉద్దేశంపై కొంత ఎక్కువ నిర్దిష్టతను కలిగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన గ్రంథశైలితో రూపొందించబడింది. ‘ఇదిగో’ మూలంలోని దృష్టి ఆకర్షణను నిలుపుతుంది. సంభాషణలో సహజత్వం కోసం గ్రీకు participial నిర్మాణం తెలుగు ప్రత్యక్షోక్తి క్రమంలో అమర్చబడింది.
