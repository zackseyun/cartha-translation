- from: దయ్యాలు ఆయనను వేడుకుంటూనే[a], “నీవు మమ్మల్ని వెళ్లగొడితే, ఆ పందుల మందలోకి మమ్మల్ని పంపు” అని అన్నాయి.
  to: 'దుష్టాత్మలు ఆయనను పదేపదే వేడుకుంటూ ఇలా చెప్పాయి: “నీవు మమ్మల్ని వెళ్లగొడితే, ఆ పందుల మందలోకి మమ్మల్ని పంపు.”'
  rationale: The revision removes an awkward duplicated speech formula, more naturally expresses the imperfect παρεκάλουν, and replaces a potentially ambiguous term for δαίμονες with a clear modern-standard Telugu equivalent. The conditional force, expulsion language, imperative request, and herd-of-pigs reference remain unchanged. The existing footnote anchor should be placed after 'పదేపదే వేడుకుంటూ' in typesetting.
