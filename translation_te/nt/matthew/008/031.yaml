reference: Matthew 8:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: te
  text: 'దుష్టాత్మలు ఆయనను పదేపదే వేడుకుంటూ ఇలా చెప్పాయి: “నీవు మమ్మల్ని వెళ్లగొడితే, ఆ పందుల మందలోకి మమ్మల్ని పంపు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δαίμονες
  choice: దయ్యాలు
  rationale: వ్యక్తిత్వం గల దుష్టాత్మలను సూచించే ఈ సందర్భంలో, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, స్పష్టంగా అర్థమయ్యే పదం.
- source_word: παρεκάλουν
  choice: వేడుకుంటూనే
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా పదేపదే జరిగిన వేడుకోలును ఈ రూపం తెలియజేస్తుంది.
- source_word: λέγοντες
  choice: అని అన్నాయి
  rationale: తెలుగు ప్రత్యక్ష సంభాషణ నిర్మాణంలో సహజంగా ఉండేలా గ్రీకు వర్తమాన కృదంతాన్ని ప్రధాన వాక్యంతో కలిపి అనువదించాం.
- source_word: Εἰ
  choice: నీవు ... అయితే
  rationale: మాట్లాడేవారి దృష్టిలోని షరతును యథాతథంగా నిలుపుతుంది; ‘నీవు ... కాబట్టి’ అని నిశ్చయార్థాన్ని చేర్చదు.
- source_word: ἐκβάλλεις
  choice: వెళ్లగొడితే
  rationale: ఈ భూతవైద్య సందర్భంలో బలవంతంగా బయటకు పంపడాన్ని సహజ తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπόστειλον
  choice: పంపు
  rationale: తక్షణ చర్యను కోరే ఏకవచన ఆజ్ఞార్థక రూపాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: ἀγέλην
  choice: మంద
  rationale: జంతువుల సమూహానికి సాధారణమైన, సందర్భోచిత తెలుగు పదం.
- source_word: χοίρων
  choice: పందుల
  rationale: మూలంలోని సాధారణ జంతు నామానికి సమకాలీన, స్పష్టమైన తెలుగు సమానం.
- source_word: οἱ δὲ
  choice: దయ్యాలు
  rationale: δέ సూచించే కథన కొనసాగింపును తెలుగు వాక్యప్రవాహంలో ప్రత్యేక సంధాయకం లేకుండానే సహజంగా వ్యక్తం చేయవచ్చు.
theological_decisions:
- issue: దుష్టాత్మల చిత్రణ
  choice: దయ్యాలు
  alternative: దుష్టాత్మలు
  rationale: వచనం యేసుతో మాట్లాడే వ్యక్తిత్వం గల అతీంద్రియ దుష్ట సత్త్వాలను చూపుతుంది. ‘దయ్యాలు’ ఆ వాదనను తగ్గించకుండా, అదనపు సిద్ధాంత వివరణను చేర్చకుండా నిలుపుతుంది.
- issue: షరతుతో కూడిన మాట
  choice: నీవు మమ్మల్ని వెళ్లగొడితే
  alternative: నీవు మమ్మల్ని వెళ్లగొడుతున్నావు కాబట్టి
  rationale: Εἰ లోని నిజమైన షరతు భావాన్ని కాపాడి, అది ‘కాబట్టి’ అనే నిశ్చయార్థమని ముందే తీర్మానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని కొనసాగుతున్న వేడుకోలు, షరతు భావం, దయ్యాల వ్యక్తిగత సంభాషణ అన్నీ నిలుపబడ్డాయి.
