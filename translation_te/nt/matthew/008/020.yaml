  source_fidelity: మూల గ్రీకు వాక్యంలోని సమాంతర నిర్మాణం, నక్కల నివాసస్థలాలు మరియు ఆకాశపు పక్షుల గూళ్ల మధ్య వ్యత్యాసం, అలాగే ‘తల వాల్చడానికి చోటు లేదు’ అనే నిరాకరణాత్మక భావం విశ్వసనీయంగా ప్రతిఫలించాయి. λέγει అనే చారిత్రక వర్తమానాన్ని తెలుగులో సహజ కథన గతకాలమైన ‘అన్నాడు’గా చేయడం అర్థనష్టాన్ని కలిగించదు.
  naturalness: వాక్యం ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, ప్రవాహంగా ఉంది. ‘నక్కలకు బొరియలు ఉన్నాయి; ఆకాశ పక్షులకు గూళ్లు ఉన్నాయి’ అనే సమాంతరత మరియు ‘కానీ’తో వచ్చే చివరి విరుద్ధత సహజంగా వినిపిస్తున్నాయి.
  terminology: ‘మనుష్యకుమారుడు’ యేసు స్వీయ-సూచక బిరుదుగా స్థిరమైన, తగిన తెలుగు రూపం. ఇది మూలపదబంధంలోని బిరుదు స్వభావాన్నీ, దాని ఉద్దేశపూర్వక విస్తృతార్థాన్నీ కాపాడుతుంది. ‘బొరియలు,’ ‘గూళ్లు,’ ‘తల వాల్చడానికి’ అనే పదాలు సందర్భానుకూలంగా ఉన్నాయి. పాదటిప్పణి గుర్తులు అన్నీ సరైన పదబంధాలకు జతచేయబడ్డాయి.
