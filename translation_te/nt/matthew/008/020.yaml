id: MAT.8.20
reference: Matthew 8:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: te
  text: 'యేసు అతనితో ఇలా అన్నాడు: “నక్కలకు బొరియలు[a] ఉన్నాయి; ఆకాశ పక్షులకు[b] గూళ్లు[c] ఉన్నాయి. కానీ మనుష్యకుమారునికి[d] తల వాల్చడానికి చోటు లేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రంధ్రాలు.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “ఆకాశంలోని పక్షులు”; సంప్రదాయంగా “గాలి పక్షులు” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: c
    text: లేదా “విశ్రాంతి స్థలాలు,” “ఆశ్రయాలు.”
    reason: lexical_alternative
  - marker: d
    text: “మనుష్యకుమారుడు” అనేది యేసు తనను తాను సూచించడానికి ఉపయోగించిన బిరుదు; కొందరు దీన్ని “మానవుడు” అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో ఇది కథన వర్తమాన కాలంలో ఉన్నప్పటికీ, తెలుగు కథన శైలిలో గతకాల రూపం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἀλώπεκες
  choice: నక్కలు
  rationale: బహువచన నామవాచకానికి నేరమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: φωλεούς
  choice: బొరియలు
  rationale: నక్కలు నివసించే నేలలోని గుహలు లేదా రంధ్రాలను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: ఆకాశ పక్షులు
  rationale: మూలంలోని ‘ఆకాశానికి చెందిన పక్షులు’ అనే భావచిత్రాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: κατασκηνώσεις
  choice: గూళ్లు
  rationale: ఈ పదం ఆశ్రయాలు లేదా నివాస స్థలాలను సూచించగలదు; పక్షుల సందర్భంలో ‘గూళ్లు’ అత్యంత సహజమైన తెలుగు పదం.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు తనను తాను సూచించడానికి వాడిన స్థిరమైన బిరుదును అనువదిస్తూ, దాని లేఖన సంబంధమైన మరియు ధార్మిక ప్రతిధ్వనులను నిలుపుతుంది.
- source_word: οὐκ ἔχει ποῦ
  choice: చోటు లేదు
  rationale: గ్రీకు నిరాకరణతో కూడిన ‘ఎక్కడ’ అనే నిర్మాణాన్ని సహజమైన తెలుగులో ‘చోటు లేదు’గా వ్యక్తపరుస్తుంది.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: తల వాల్చడానికి
  rationale: తలను కిందికి ఆనించి విశ్రాంతి తీసుకోవడం అనే స్పష్టమైన మూలభావాన్ని తెలుగు నుడికారంలో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: యేసు స్వీయ సూచన ὁ υἱὸς τοῦ ἀνθρώπου అనువాదం
  choice: మనుష్యకుమారుడు
  alternative: మానవుడు
  rationale: ‘మనుష్యకుమారుడు’ అనే రూపం పదబంధాన్ని బిరుదుగా నిలుపుతూ, దానియేలు 7తో ఉండవచ్చని భావించే ప్రతిధ్వనితో సహా మూలంలోని బహుస్థాయి అర్థాన్ని కాపాడుతుంది. ‘మానవుడు’ అని అనువదిస్తే ఆ ప్రతిధ్వని తగ్గి, ఒక వ్యాఖ్యానాన్ని ముందుగానే నిర్ణయించినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. సమాంతర నిర్మాణాన్ని నిలుపుతూ, చివరి వ్యత్యాసాన్ని ‘కానీ’తో స్పష్టంచేశారు. సంప్రదాయ ధార్మిక బిరుదైన ‘మనుష్యకుమారుడు’ను వ్యాఖ్యానాత్మకంగా సరళీకరించకుండా ఉంచారు.
