id: MAT.8.18
reference: Matthew 8:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: te
  text: యేసు తన చుట్టూ ఉన్న అనేక జనసమూహాలను చూసి, అవతలి ఒడ్డుకు వెళ్లమని ఆదేశించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: చూసి
  rationale: A natural Telugu participial construction that accurately preserves the circumstantial force of the aorist participle.
- source_word: πολλοὺς ὄχλους
  choice: అనేక జనసమూహాలు
  rationale: Preserves both the plurality and the sense of numerous crowds without flattening the expression to a singular crowd.
- source_word: περὶ αὐτόν
  choice: తన చుట్టూ
  rationale: Idiomatic modern Telugu for people gathered around Jesus.
- source_word: ἐκέλευσεν
  choice: ఆదేశించాడు
  rationale: Conveys the authoritative sense of giving an order, without adding an unstated recipient.
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: అవతలి ఒడ్డుకు వెళ్లమని
  rationale: In this lake-crossing context, τὸ πέραν naturally denotes the opposite shore; వెళ్లమని preserves the infinitival content of the command.
theological_decisions:
- issue: Unexpressed subject of ἀπελθεῖν
  choice: వెళ్లమని ఆదేశించాడు
  alternative: శిష్యులను అవతలి ఒడ్డుకు వెళ్లమని ఆదేశించాడు
  rationale: The Greek does not explicitly identify those commanded, so the translation avoids supplying 'the disciples' and preserves the source's implicitness.
translation_notes:
  register: Modern standard Telugu in a dignified but readily understandable narrative register. The connective δέ is represented by smooth clause sequencing rather than an unnecessary overt discourse marker.
