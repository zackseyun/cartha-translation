id: MAT.8.34
reference: Matthew 8:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: te
  text: ఇదిగో, నగరమంతా యేసును కలవడానికి బయటకు వెళ్లింది. వారు ఆయనను చూసినప్పుడు, ఆయన తమ ప్రాంతం[a] నుండి వెళ్లిపోవాలని వేడుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమ భూభాగం’; మరింత అక్షరార్థంగా, ‘తమ సరిహద్దుల నుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో పాఠకుని దృష్టిని ఆకర్షించే ఉద్ఘాటనను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πᾶσα ἡ πόλις
  choice: పట్టణమంతా
  rationale: పట్టణంలోని ప్రజలను సమష్టిగా సూచించే గ్రీకు ప్రయోగాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రతి వ్యక్తీ తప్పనిసరిగా వచ్చాడనే అతిశయార్థాన్ని బలవంతంగా చేర్చదు.
- source_word: ἐξῆλθεν
  choice: బయలుదేరి వచ్చింది
  rationale: పట్టణం నుండి బయటకు వచ్చి యేసు వైపు సాగిన కదలికను, తెలుగు కథన దృష్టికోణానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: εἰς ὑπάντησιν
  choice: కలుసుకోవడానికి
  rationale: ఎవరినైనా ఎదుర్కొని కలుసుకోవడానికి వెళ్లడం అనే గ్రీకు నుడికారపు ఉద్దేశాన్ని సహజంగా అందిస్తుంది.
- source_word: Ἰησοῦ
  choice: యేసు
  rationale: తెలుగులో స్థిరపడిన ప్రామాణిక వ్యక్తినామ రూపం.
- source_word: ἰδόντες αὐτὸν
  choice: వారు ఆయనను చూసినప్పుడు
  rationale: కర్తను సమష్టి పట్టణ ప్రజలుగా స్పష్టం చేస్తూ, ఏకకాల/క్రమ సంబంధాన్ని సహజమైన కాలవాచక ఉపవాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: παρεκάλεσαν
  choice: వేడుకున్నారు
  rationale: సాధారణంగా అడగడం కంటే బలమైన, earnest entreaty భావాన్ని అతిశయించకుండా తెలియజేస్తుంది.
- source_word: ὅπως μεταβῇ
  choice: వెళ్లిపోవాలని
  rationale: వారి వేడుకోలు యొక్క విషయాన్ని సహజమైన తెలుగు పరోక్ష వాక్య నిర్మాణంలో తెలియజేస్తుంది.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: తమ ప్రాంతం నుండి
  rationale: ὅρια అనే పదం అక్షరార్థంగా సరిహద్దులను సూచించినా, ఇక్కడ వారి అధీనంలోని భూభాగం లేదా ప్రాంతాన్ని సూచిస్తుంది; ప్రధాన పాఠ్యంలో ‘ప్రాంతం’ సందర్భానుకూలంగా సహజంగా ఉంటుంది.
theological_decisions:
- issue: పట్టణ ప్రజలు యేసును వెళ్లిపోవాలని వేడుకోవడానికి కారణం
  choice: వారి ఉద్దేశానికి కారణం చెప్పకుండా, యేసును తమ ప్రాంతం నుండి వెళ్లిపోవాలని వారు వేడుకున్నారని మాత్రమే అనువదించడం.
  alternative: యేసు శక్తికి భయపడటం, పందుల నష్టంపై కోపపడటం, లేదా జరిగిన సంఘటనవల్ల సాధారణ కలవరానికి గురికావడం.
  rationale: గ్రీకు పాఠ్యం వారి చర్యను తెలియజేస్తుంది గాని దానికి కారణాన్ని స్పష్టంగా చెప్పదు. అందువల్ల కథనంలోని మరియు theological tensionను వ్యాఖ్యానంతో పరిష్కరించకుండా అలాగే ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని దృష్టి-ఆకర్షణ సూచకాన్ని నిలుపుతుంది. గ్రీకులో ‘పట్టణం’ ఏకవచనంగా ఉండి, తరువాత ప్రజలను ఉద్దేశిస్తూ బహువచన భావం రావడాన్ని తెలుగులో ‘పట్టణమంతా… వారు’ అనే సహజ సమష్టి నిర్మాణంతో ప్రతిబింబించాం. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘ప్రాంతం’ పదానికే జతచేయబడింది.
