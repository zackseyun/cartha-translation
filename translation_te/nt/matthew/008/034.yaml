revisions:
- from: ఇదిగో, పట్టణమంతా యేసును కలుసుకోవడానికి బయలుదేరి వచ్చింది. వారు ఆయనను చూసినప్పుడు, తమ ప్రాంతం[a] నుండి వెళ్లిపోవాలని ఆయనను వేడుకున్నారు.
  to: ఇదిగో, నగరమంతా యేసును కలవడానికి బయటకు వెళ్లింది. వారు ఆయనను చూసినప్పుడు, ఆయన తమ ప్రాంతం[a] నుండి వెళ్లిపోవాలని వేడుకున్నారు.
