review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the narrative marker ἰδού, the collective sense of πᾶσα ἡ πόλις, the movement out to meet Jesus, and the earnest request that he leave their area. The motive remains appropriately unstated. A small syntactic revision makes the object and content of the request unambiguous in Telugu.
  naturalness: ‘వారు ఆయనను చూసినప్పుడు’ is natural, but ‘తమ ప్రాంతం నుండి వెళ్లిపోవాలని ఆయనను వేడుకున్నారు’ has a mildly awkward word order and can momentarily obscure that Jesus is the one requested to leave. ‘వారు ఆయన తమ ప్రాంతం నుండి వెళ్లిపోవాలని వేడుకున్నారు’ is smoother and unambiguous. ‘నగరమంతా’ also more directly matches the stated ‘whole city’ while retaining the Greek collective idiom.
  terminology: ‘ఇదిగో,’ ‘నగరమంతా,’ ‘యేసు,’ ‘వేడుకున్నారు,’ and ‘ప్రాంతం’ are suitable modern-standard Telugu choices. The footnote correctly preserves the alternatives ‘భూభాగం’ and, more literally, ‘సరిహద్దులు.’
  issues:
  - severity: low
    issue: Word order in the plea clause is mildly awkward.
    rationale: In the draft, ‘వెళ్లిపోవాలని ఆయనను వేడుకున్నారు’ places the infinitival content before its personal object. Reordering it clarifies directly that they begged Jesus himself to leave.
  - severity: low
    issue: ‘పట్టణం’ is slightly less aligned with the English audit trail’s ‘city.’
    rationale: Although πόλις can denote either a town or city depending on context, ‘నగరం’ is the closer default equivalent here and reads naturally in the narrative.
  revised_text: ఇదిగో, నగరమంతా యేసును కలవడానికి బయటకు వెళ్లింది. వారు ఆయనను చూసినప్పుడు, ఆయన తమ ప్రాంతం[a] నుండి వెళ్లిపోవాలని వేడుకున్నారు.
  revised_footnotes:
