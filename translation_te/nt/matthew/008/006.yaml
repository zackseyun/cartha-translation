id: MAT.8.6
reference: Matthew 8:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: te
  text: 'ఇలా అన్నాడు: “ప్రభూ, నా సేవకుడు[a] పక్షవాతంతో ఇంట్లో పడి ఉన్నాడు; అతడు తీవ్రమైన బాధ అనుభవిస్తున్నాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా బాలుడు” లేదా “నా బిడ్డ.” గ్రీకు పదం సేవకుణ్ణి లేదా బాలుణ్ణి/బిడ్డను సూచించవచ్చు; శతాధిపతి సందర్భంలో “సేవకుడు” బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తీవ్రంగా యాతనపడుతున్నాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: ఇలా అన్నాడు
  rationale: గ్రీకు వర్తమాన కృదంతం మునుపటి వాక్యంతో చర్యను అనుసంధానిస్తుంది. తెలుగులో సహజమైన కథన ప్రవాహం కోసం దాన్ని ‘ఇలా అన్నాడు’ అని వ్యక్త క్రియగా అనువదించాం; ‘అంటూ’ అనే అక్షరానుసార రూపం ఈ వచనం విడిగా చదివినప్పుడు అసంపూర్ణంగా అనిపించవచ్చు.
- source_word: Κύριε
  choice: ప్రభూ
  rationale: ఇది గౌరవపూర్వక సంబోధనగానూ, మరింత ఉన్నతమైన గుర్తింపుగానూ అర్థమయ్యే వీలును ఉంచుతుంది. ‘అయ్యా’ ఆ భావపరిధిని అనవసరంగా కుదించవచ్చు.
- source_word: ὁ παῖς μου
  choice: నా సేవకుడు
  rationale: παῖς అనే పదానికి సేవకుడు, బాలుడు, బిడ్డ అనే అర్థాలు ఉండవచ్చు. శతాధిపతి సందర్భంలో ‘సేవకుడు’ బాగా సరిపోతుంది; అసలు పదంలోని సందిగ్ధతను పాదసూచికలో ఉంచాం.
- source_word: βέβληται
  choice: పడి ఉన్నాడు
  rationale: βάλλω యొక్క పరిపూర్ణ కర్మణి రూపం ఏర్పడిన స్థితిని సూచిస్తుంది. ఇక్కడ ‘పడి ఉన్నాడు’ అనేది అతి అక్షరానువాదం కాకుండా ఆ ఫలితస్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν τῇ οἰκίᾳ
  choice: ఇంట్లో
  rationale: ఈ సందర్భంలో స్థానాన్ని సహజంగా, స్పష్టంగా తెలియజేసే ఆధునిక తెలుగు రూపం.
- source_word: παραλυτικός
  choice: పక్షవాతంతో
  rationale: వ్యక్తిని ఒక వ్యాధిపేరుతో నామీకరించకుండా, అతని స్థితిని సమకాలీన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: δεινῶς βασανιζόμενος
  choice: తీవ్రమైన బాధ అనుభవిస్తున్నాడు
  rationale: ఈ పదబంధం తీవ్రమైన వేదన లేదా హింసను సూచిస్తుంది. స్వస్థపరిచే ఈ సందర్భంలో ‘తీవ్రమైన బాధ అనుభవిస్తున్నాడు’ సహజంగా అర్థాన్ని అందిస్తుంది; బలమైన అక్షరానుసార ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: యేసును సంబోధించినప్పుడు Κύριε పదం యొక్క భావబలం
  choice: ప్రభూ
  alternative: అయ్యా
  rationale: ఈ సంబోధన కేవలం మర్యాదను సూచించవచ్చు లేదా యేసును మరింత ఉన్నతంగా గుర్తించడాన్ని సూచించవచ్చు. ‘ప్రభూ’ ఈ రెండు అవకాశాలను పూర్తిగా మూసివేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని భావతీవ్రతను నిలుపుతూ, అసహజమైన అక్షరానువాదాన్ని నివారించాం.
