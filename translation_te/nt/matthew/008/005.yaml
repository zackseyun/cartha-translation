  text: ⸂Εἰσελθόντος δὲ αὐτοῦ⸃ εἰς Καφαρναοὺμ προσῆλθεν αὐτῷ ἑκατόνταρχος παρακαλῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/005.yaml
  text: When he entered Capernaum[a], a centurion came to him, pleading with him[b],
translation:
  language: te
  text: ఆయన కపెర్నహూములో ప్రవేశించినప్పుడు, ఒక శతాధిపతి[a] ఆయన దగ్గరికి వచ్చి, ఆయనను వేడుకుంటూ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, సాధారణంగా సుమారు వందమంది సైనికులకు అధిపతిగా ఉండే సైనిక అధికారి.
    reason: historical_clarification
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: ఆయన … ప్రవేశించినప్పుడు
  rationale: అయోరిస్ట్ కృదంతంతో ఉన్న జనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అనువదించింది. ఇది ‘ప్రవేశించిన తర్వాత’ అని క్రమాన్ని అతిగా నిర్దిష్టం చేయకుండా మూలంలోని సంబంధాన్ని నిలుపుతుంది.
- source_word: εἰς Καφαρναοὺμ
  choice: కపెర్నహూములో
  rationale: స్థలనామాన్ని తెలుగులో స్థిరపడిన లిప్యంతరీకరణతో ఇచ్చింది; ‘ప్రవేశించు’తో ‘లో’ సహజంగా సరిపోతుంది.
- source_word: προσῆλθεν αὐτῷ
  choice: ఆయన దగ్గరికి వచ్చి
  rationale: προσέρχομαι అనే క్రియలోని ‘దగ్గరికి రావడం/సమీపించడం’ భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἑκατόνταρχος
  choice: శతాధిపతి
  rationale: నిర్దిష్ట సైనిక హోదాను కాపాడే సంప్రదాయబద్ధమైన, సంక్షిప్తమైన తెలుగు పదం. సాధారణ పాఠకుని కోసం వివరణను పాదసూచికలో ఇచ్చింది.
- source_word: παρακαλῶν αὐτὸν
  choice: ఆయనను వేడుకుంటూ
  rationale: తదుపరి వచనంలో వచ్చే విజ్ఞప్తిని పరిచయం చేసే earnest entreaty భావాన్ని ‘వేడుకుంటూ’ సహజంగా తెలియజేస్తుంది; కృదంత రూపం కొనసాగుతున్న వాక్య నిర్మాణాన్ని కూడా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలిని ఉపయోగించింది. వాక్యం తదుపరి వచనంలో కొనసాగుతుందనే మూల నిర్మాణాన్ని చివరి కామాతో సూచించింది.
