revisions:
- from: యేసు పేతురు ఇంటికి వచ్చినప్పుడు, పేతురు అత్త పడుకొని జ్వరంతో ఉండడం చూశాడు.
  to: యేసు పేతురు ఇంటికి వచ్చినప్పుడు, పడుకొని జ్వరంతో ఉన్న పేతురు అత్తను చూశాడు.
  rationale: The revision retains every source-level element while making Peter’s mother-in-law the explicit direct object of “చూశాడు.” It keeps “పడుకొని” without adding ‘in bed’ and renders πυρέσσουσαν plainly as “జ్వరంతో ఉన్న.”
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:31:06Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies Peter as the referent of αὐτοῦ and preserves the temporal sense of ἐλθών, the location, and the two concurrent conditions of the woman. However, the construction “పడుకొని జ్వరంతో ఉండడం చూశాడు” treats the conditions as a nominalized event rather than directly presenting Peter’s mother-in-law as the object Jesus saw. A relative-participial construction more closely reflects the Greek accusative participles.
  naturalness: The draft is understandable, but “పడుకొని జ్వరంతో ఉండడం చూశాడు” is less idiomatic in modern Telugu narrative prose. “పడుకొని జ్వరంతో ఉన్న పేతురు అత్తను చూశాడు” is smoother and unambiguously makes her the person Jesus saw.
  terminology: “పేతురు అత్త” is a clear, natural designation for Peter’s mother-in-law and correctly avoids an ambiguous pronoun. “జ్వరంతో ఉన్న” is direct and does not add the interpretive notion of suffering. No theological terminology issue is present.
  issues:
  - severity: low
    issue: Awkward object construction
    rationale: “పేతురు అత్త పడుకొని జ్వరంతో ఉండడం చూశాడు” nominalizes her condition. The Greek directly says that Jesus saw the woman, qualified by the participles ‘lying’ and ‘feverish.’ Recasting the phrase with “అత్తను చూశాడు” is more natural and structurally closer.
  revised_text: యేసు పేతురు ఇంటికి వచ్చినప్పుడు, పడుకొని జ్వరంతో ఉన్న పేతురు అత్తను చూశాడు.
  revised_footnotes: []
  revision_rationale: The revision retains every source-level element while making Peter’s mother-in-law the explicit direct object of “చూశాడు.” It keeps “పడుకొని” without adding ‘in bed’ and renders πυρέσσουσαν plainly as “జ్వరంతో ఉన్న.”
