id: MAT.8.14
reference: Matthew 8:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: te
  text: యేసు పేతురు ఇంటికి వచ్చినప్పుడు, పడుకొని జ్వరంతో ఉన్న పేతురు అత్తను చూశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: వచ్చినప్పుడు
  rationale: కాలసంబంధమైన పూర్వక్రియను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘వచ్చిన తరువాత’ అనే భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: οἰκίαν Πέτρου
  choice: పేతురు ఇంటికి
  rationale: స్వామ్యసంబంధాన్ని సహజంగా వ్యక్తం చేస్తూ οἰκία యొక్క ‘ఇల్లు’ భావాన్ని నిలుపుతుంది.
- source_word: πενθερὰν αὐτοῦ
  choice: పేతురు అత్త
  rationale: πενθερά అంటే అత్త, ప్రత్యేకంగా భార్య తల్లి. తెలుగులో ‘అతని అత్త’ అంటే సమీపంలోని యేసును సూచించినట్లు అపార్థం కావచ్చు కాబట్టి పేతురు పేరును మళ్లీ ఉపయోగించడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: βεβλημένην
  choice: పడుకొని
  rationale: అనారోగ్య సందర్భంలో ఆమె పడి ఉన్న స్థితిని తెలియజేస్తుంది; మూలంలో లేని ‘మంచం మీద’ అనే వివరాన్ని చేర్చదు.
- source_word: πυρέσσουσαν
  choice: జ్వరంతో ఉండడం
  rationale: కొనసాగుతున్న జ్వరస్థితిని నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘బాధపడుతూ’ వంటి అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
theological_decisions:
- issue: πενθερὰν αὐτοῦ లో αὐτοῦ ఎవరిని సూచిస్తుంది?
  choice: ఆమెను పేతురు అత్తగా స్పష్టంగా పేర్కొనడం
  alternative: ‘అతని అత్త’ అని అనువదించడం
  rationale: వాక్యనిర్మాణం మరియు సందర్భం ప్రకారం సర్వనామం పేతురునే సూచిస్తుంది. తెలుగులో అస్పష్టత వల్ల అది యేసును సూచించినట్లు అనిపించకుండా పేరును పునరుక్తి చేశాం; దీనినుంచి అదనపు సిద్ధాంతపరమైన నిర్ధారణలు చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథనశైలిలో అనువదించబడింది. మూలంలో స్పష్టంగా లేని ‘మంచం మీద’ అనే వివరాన్ని చేర్చలేదు.
