id: MAT.8.2
reference: Matthew 8:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: te
  text: ఇదిగో, కుష్ఠవ్యాధి ఉన్న ఒక వ్యక్తి ఆయన దగ్గరికి వచ్చి, ఆయన ఎదుట సాష్టాంగపడి[a], “ప్రభువా, నీకు ఇష్టమైతే నన్ను శుద్ధి చేయగలవు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయనను ఆరాధించి”; గ్రీకు క్రియ సందర్భానుసారం సాష్టాంగ నమస్కారం చేయడం, గౌరవ నివాళి అర్పించడం, లేదా ఆరాధించడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో పాఠకుని దృష్టిని హఠాత్తుగా సంఘటనవైపు మళ్లించే గ్రీకు అవ్యయపు బలాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: λεπρὸς
  choice: కుష్ఠవ్యాధి ఉన్న ఒక వ్యక్తి
  rationale: వ్యాధిగ్రస్తుడిని వ్యాధితోనే గుర్తించకుండా, substantival adjective సూచించే వ్యక్తిని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సంప్రదాయ వ్యాధి పదమైన ‘కుష్ఠవ్యాధి’ని నిలుపుతుంది.
- source_word: προσελθὼν
  choice: ఆయన దగ్గరికి వచ్చి
  rationale: యేసువైపు సమీపించడాన్ని స్పష్టంగా, సహజమైన తెలుగు కథన శైలిలో వ్యక్తం చేస్తుంది.
- source_word: προσεκύνει
  choice: ఆయనకు సాష్టాంగపడి
  rationale: శరీరంతో వంగి గౌరవం చూపే చర్యను సూచిస్తూ, అది ఆరాధనా లేక నివాళియా అనే భావాన్ని ప్రధాన పాఠంలో అతిగా నిర్ణయించదు.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: గౌరవపూర్వక సంబోధనతోపాటు క్రీస్తుసంబంధమైన భావసాధ్యతను కూడా నిలుపుతుంది.
- source_word: ἐὰν θέλῃς
  choice: నీకు ఇష్టమైతే
  rationale: యేసు సంకల్పాన్ని ఉద్దేశించిన షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δύνασαί
  choice: చేయగలవు
  rationale: సామర్థ్యం లేదా శక్తిని నేరుగా తెలియజేస్తుంది.
- source_word: καθαρίσαι
  choice: నన్ను శుద్ధి చేయ
  rationale: కేవలం స్వస్థపరచడం మాత్రమే కాక, కుష్ఠవ్యాధితో ముడిపడిన శారీరక మరియు ఆచారపరమైన శుద్ధి భావాలను నిలుపుతుంది.
theological_decisions:
- issue: యేసు పట్ల προσκυνέω అనే క్రియ యొక్క భావం
  choice: ఆయనకు సాష్టాంగపడి
  alternative: ఆయనను ఆరాధించి
  rationale: ఈ క్రియ సందర్భానుసారం సాష్టాంగ నమస్కారం, గౌరవ నివాళి, లేదా ఆరాధనను సూచించవచ్చు. ప్రధాన పాఠం స్పష్టమైన శారీరక గౌరవ చర్యను తెలియజేస్తూ, పూర్తి ఆరాధనా భావాన్ని ముందుగానే ఖరారు చేయదు; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే కథన శైలి. ‘సాష్టాంగపడి’ కొద్దిగా ఉన్నత శైలికి చెందినదైనా, శరీరంతో వంగి గౌరవం చూపే చర్యను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
