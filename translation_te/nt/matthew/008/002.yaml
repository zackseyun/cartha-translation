revisions:
- from: ఇదిగో, కుష్ఠవ్యాధి ఉన్న ఒక వ్యక్తి ఆయన దగ్గరికి వచ్చి, ఆయనకు సాష్టాంగపడి[a], “ప్రభువా, నీకు ఇష్టమైతే నన్ను శుద్ధి చేయగలవు” అన్నాడు.
  to: ఇదిగో, కుష్ఠవ్యాధి ఉన్న ఒక వ్యక్తి ఆయన దగ్గరికి వచ్చి, ఆయన ఎదుట సాష్టాంగపడి[a], “ప్రభువా, నీకు ఇష్టమైతే నన్ను శుద్ధి చేయగలవు” అన్నాడు.
  rationale: The sole revision replaces the less natural dative construction with ‘ఆయన ఎదుట,’ preserving the Greek sense of bowing/prostrating before Jesus and retaining the lexical ambiguity through the existing footnote.
