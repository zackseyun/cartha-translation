review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the attention marker, the man's approach, the reverential act, the address ‘Lord,’ the conditional appeal to Jesus’ will, and Jesus’ ability to cleanse. ‘శుద్ధి చేయగలవు’ appropriately retains the cleansing sense rather than reducing it to healing.
  naturalness: The wording is generally modern and clear. However, ‘ఆయనకు సాష్టాంగపడి’ is less idiomatic than locating the bodily act ‘ఆయన ఎదుట’ (before him).
  terminology: ‘కుష్ఠవ్యాధి ఉన్న ఒక వ్యక్తి,’ ‘ప్రభువా,’ and ‘శుద్ధి చేయ’ are suitable. ‘సాష్టాంగపడి’ conveys a bodily act of profound reverence without requiring the main text to decide whether προσκυνέω here specifically means worship.
  issues:
  - severity: low
    issue: Idiomatic expression of the reverential action
    rationale: In Telugu, ‘ఆయన ఎదుట సాష్టాంగపడి’ naturally expresses prostrating/bowing before someone. ‘ఆయనకు సాష్టాంగపడి’ is understandable but less idiomatic.
