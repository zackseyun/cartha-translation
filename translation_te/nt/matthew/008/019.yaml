source:
  edition: SBLGNT
  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: te
  text: 'ఒక శాస్త్రి ఆయన దగ్గరికి వచ్చి ఆయనతో ఇలా అన్నాడు: “బోధకుడా, నీవు ఎక్కడికి వెళ్లినా[a] నేను నిన్ను అనుసరిస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీవు ఎక్కడికి వెళ్లిపోతున్నా” అని కూడా అనువదించవచ్చు. గ్రీకు క్రియ మరింత నిర్దిష్టంగా వెళ్లిపోవడం లేదా బయలుదేరడం అనే అర్థాన్ని ఇవ్వగలదు; ఇక్కడ అది సహజంగా “వెళ్లడం” అనే భావంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: దగ్గరికి వచ్చి
  rationale: యేసువైపు వచ్చి సమీపించిన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἷς
  choice: ఒక
  rationale: ఒక నిర్దిష్ట వ్యక్తిని పరిచయం చేసే గ్రీకు సంఖ్యావాచక ప్రయోగాన్ని నిలుపుతుంది.
- source_word: γραμματεὺς
  choice: శాస్త్రి
  rationale: సువార్తల సందర్భంలో ధర్మశాస్త్ర ప్రతులను రాసి, అధ్యయనం చేసి, బోధించే వర్గానికి సంప్రదాయబద్ధంగా స్పష్టమైన తెలుగు పదం.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: సంబోధనను అనువదిస్తూ, ‘ప్రభువు’ వంటి అధిక క్రీస్తుతాత్త్విక భావాన్ని గానీ ‘రబ్బీ’ అనే లిప్యంతరీకరణను గానీ చేర్చదు.
- source_word: ἀκολουθήσω
  choice: నేను నిన్ను అనుసరిస్తాను
  rationale: భవిష్యత్ రూపంలో వ్యక్తమైన దృఢ ఉద్దేశాన్ని, అలాగే శిష్యత్వ సంబంధమైన అంతర్భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ὅπου ἐὰν
  choice: ఎక్కడికి ... అయినా
  rationale: గమ్యం నిర్దిష్టం కాని, అన్ని చోట్లకూ వర్తించే ‘wherever’ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπέρχῃ
  choice: వెళ్లినా
  rationale: సందర్భంలో సాధారణ గమనాన్ని సూచించే సహజ తెలుగు రూపం; ‘వెళ్లిపోవడం’ అనే మరింత నిర్దిష్ట భావసాధ్యతను పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: యేసుకు సంబోధనగా διδάσκαλος అనువాదం
  choice: బోధకుడా
  alternative: గురువా / రబ్బీ
  rationale: మూలపదంలోని బోధించే వ్యక్తి అనే అర్థాన్ని నేరుగా అందిస్తుంది; మూలంలో స్పష్టంగా లేని ఉన్నత బిరుదు లేదా ప్రత్యేక యూద సంబోధనను దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి. ప్రత్యక్ష సంభాషణలో ఏకవచన ‘నీవు’ వాడి మూలంలోని ఏకవచనాన్ని నిలిపింది. పాదసూచిక గుర్తు ప్రధాన వాక్యాంతంలో ఉంచబడింది.
