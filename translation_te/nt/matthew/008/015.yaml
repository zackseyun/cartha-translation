revisions:
- from: ఆయన ఆమె చేతిని తాకాడు; జ్వరం ఆమెను విడిచిపోయింది. ఆమె లేచి ఆయనకు సేవ చేయడం మొదలుపెట్టింది.[a]
  to: ఆయన ఆమె చేతిని తాకాడు; జ్వరం ఆమెను విడిచిపోయింది. ఆమె లేచి ఆయనకు సేవ చేసింది.[a]
  rationale: The revision removes the non-required ‘began’ from the main text in order to preserve the Greek imperfect’s genuine aspectual flexibility. The footnote retains the possible inceptive interpretation without presenting it as certain.
