id: MAT.8.15
reference: Matthew 8:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: te
  text: ఆయన ఆమె చేతిని తాకాడు; జ్వరం ఆమెను విడిచిపోయింది. ఆమె లేచి ఆయనకు సేవ చేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనకు సేవ చేయడం మొదలుపెట్టింది.” గ్రీకు అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న చర్యను వర్ణించవచ్చు; అది కొన్ని సందర్భాల్లో చర్య ఆరంభమైన భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο τῆς χειρὸς αὐτῆς
  choice: ఆమె చేతిని తాకాడు
  rationale: ἅπτομαι ఇక్కడ శారీరకంగా తాకడాన్ని సూచిస్తుంది; గ్రీకు షష్ఠీ విభక్తి నిర్మాణాన్ని సహజమైన తెలుగు కర్మ నిర్మాణంగా అనువదించాం.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: జ్వరం ఆమెను విడిచిపోయింది
  rationale: మూలంలోని ‘జ్వరం ఆమెను విడిచింది’ అనే వ్యక్తీకరణను సహజమైన తెలుగులోనూ నిలిపి ఉంచుతుంది; వ్యాధి నయమైందని వివరణాత్మకంగా విస్తరించదు.
- source_word: ἠγέρθη
  choice: ఆమె లేచి
  rationale: ఈ స్వస్థత కథనంలో క్రియ సాధారణంగా మంచం నుండి లేవడాన్ని సూచిస్తుంది; పునరుత్థాన భావాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: διηκόνει αὐτῷ
  choice: ఆయనకు సేవ చేయడం మొదలుపెట్టింది
  rationale: διακονέω ఇక్కడ పరిచర్య చేయడం లేదా సేవ చేయడం అనే అర్థంలో ఉంది. అసంపూర్ణ భూతకాల రూపానికి సాధ్యమైన ఆరంభ-కొనసాగింపు భావాన్ని ప్రధాన పాఠంలో సహజంగా వ్యక్తం చేశాం; సాధారణ కొనసాగింపు భావాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ἠγέρθη అనే క్రియకు పునరుత్థాన సంబంధమైన భావం ఆపాదించే అవకాశం
  choice: ఆమె లేచి
  alternative: ఆమె లేపబడింది
  rationale: తక్షణ సందర్భం జ్వరం తగ్గిన తరువాత ఆమె లేచిన సాధారణ చర్యను వర్ణిస్తుంది. అందువల్ల ఇక్కడ అవసరం లేని పునరుత్థాన సూచనను చేర్చలేదు.
- issue: διηκόνει అనే అసంపూర్ణ భూతకాల క్రియలో ఆరంభ భావమా, కొనసాగింపు భావమా అనే సందిగ్ధత
  choice: సేవ చేయడం మొదలుపెట్టింది
  alternative: సేవ చేసింది
  rationale: గ్రీకు అసంపూర్ణ భూతకాలం చర్య మొదలై కొనసాగినట్లు సూచించగలదు; అయితే అది కేవలం కొనసాగుతున్న చర్యను కూడా వర్ణించవచ్చు. ఈ నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని వరుస చర్యలను సెమికోలన్ మరియు వాక్య విభజనతో స్పష్టంగా చూపించాం; మూలంలో లేని ‘వెంటనే’ వంటి పదాలను చేర్చలేదు.
