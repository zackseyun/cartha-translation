id: MAT.8.22
reference: Matthew 8:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: te
  text: 'కాని యేసు అతనితో ఇలా అంటాడు: “నన్ను అనుసరించు; చనిపోయినవారే తమ చనిపోయినవారిని పాతిపెట్టుకోనివ్వు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: కాని
  rationale: ముందటి అభ్యర్థనకు యేసు ఇచ్చిన సరిదిద్దే ప్రతిస్పందనలోని స్వల్ప వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: λέγει
  choice: అంటాడు
  rationale: గ్రీకు చారిత్రక వర్తమాన కాలాన్ని నిలిపి, కథనంలోని సజీవతను ప్రతిబింబిస్తుంది.
- source_word: Ἀκολούθει μοι
  choice: నన్ను అనుసరించు
  rationale: ఇది శిష్యత్వానికి సంబంధించిన నేరుగా ఇచ్చిన ఆజ్ఞ; ఆధునిక తెలుగులో సహజంగానూ మూలానికి నమ్మకంగానూ ఉంది.
- source_word: ἄφες
  choice: పాతిపెట్టనివ్వు
  rationale: తెలుగులో తరువాతి క్రియతో కలిపిన అనుమతార్థక నిర్మాణం సహజంగా ఉంటుంది; ఇతరుల పని వారికే వదిలివేయాలనే భావాన్ని తెలియజేస్తుంది.
- source_word: νεκρούς ... νεκρούς
  choice: చనిపోయినవారు ... చనిపోయినవారిని
  rationale: రెండు చోట్లా ఒకే పదాన్ని ఉపయోగించి మూలంలోని ఉద్దేశపూర్వక పదప్రయోగాన్ని, అర్థపరమైన ఉద్రిక్తతను కాపాడుతుంది.
- source_word: θάψαι
  choice: పాతిపెట్టు
  rationale: మృతదేహాన్ని సమాధి చేయడాన్ని తెలిపే స్పష్టమైన, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: తమ చనిపోయినవారిని
  rationale: ἑαυτῶν లోని ఆత్మవాచక స్వాధీన భావాన్ని ‘తమ’ సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: యేసు మాటలో ‘చనిపోయినవారు’ అనే పదానికి అర్థం
  choice: ప్రధాన పాఠ్యంలో రెండు సందర్భాల్లోనూ ‘చనిపోయినవారు’ అనే ఒకే వ్యక్తీకరణను ఉంచడం
  alternative: మొదటి సందర్భాన్ని ‘ఆధ్యాత్మికంగా చనిపోయినవారు’ అని స్పష్టీకరించడం
  rationale: గ్రీకు పాఠ్యం రెండు చోట్లా అదే పదాన్ని వాడుతుంది. మొదటి వాడుక రూపకాలంకారంగా ఉండవచ్చుగానీ, ప్రధాన పాఠ్యంలో ‘ఆధ్యాత్మికంగా’ అని చేర్చడం మూలంలోని ఉద్దేశపూర్వక పదప్రయోగాన్ని, theological tensionను ముందుగానే పరిష్కరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘అంటాడు’ ద్వారా మూలంలోని చారిత్రక వర్తమానాన్ని నిలిపాం. పునరుక్తిని తొలగించకుండా యేసు మాటలోని కఠినతను, పదప్రయోగాన్ని కాపాడాం.
