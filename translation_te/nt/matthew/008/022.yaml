revisions:
- from: 'కాని యేసు అతనితో ఇలా అంటాడు: “నన్ను అనుసరించు; చనిపోయినవారు తమ చనిపోయినవారిని పాతిపెట్టనివ్వు.[a]”'
  to: 'కాని యేసు అతనితో ఇలా అంటాడు: “నన్ను అనుసరించు; చనిపోయినవారే తమ చనిపోయినవారిని పాతిపెట్టుకోనివ్వు.”'
  rationale: 'The revision replaces the unnatural permissive form with idiomatic modern Telugu while retaining the Greek wordplay: both occurrences remain “చనిపోయినవారు,” and the footnote, not the main text, notes the commonly understood metaphorical sense of the first occurrence. The historical present and the reflexive emphasis (“తమ”) are retained.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:31:13Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the historical present (λέγει), the direct discipleship imperative, the repeated νεκρούς, and the emphatic possessive sense of ἑαυτῶν. However, “పాతిపెట్టనివ్వు” is awkwardly formed and is less direct than the Greek imperative ἄφες; a standard Telugu permissive construction is needed.
  naturalness: “చనిపోయినవారు తమ చనిపోయినవారిని పాతిపెట్టనివ్వు” is understandable, but the repeated verb form is not idiomatic modern standard Telugu. “చనిపోయినవారే తమ చనిపోయినవారిని పాతిపెట్టుకోనివ్వు” is natural and retains the command to leave the matter to them.
  terminology: “అనుసరించు,” “చనిపోయినవారు,” and “పాతిపెట్టు” are appropriate modern standard Telugu terms. The added emphatic particle “-ఏ” reflects the force of leaving the task to that group, without defining the first occurrence of “dead.”
  issues:
  - severity: medium
    issue: The main-text construction “పాతిపెట్టనివ్వు” is grammatically and idiomatically deficient.
    rationale: For an imperative meaning “let/leave them to bury,” Telugu normally uses a construction such as “పాతిపెట్టుకోనివ్వు.” This safely conveys ἄφες + infinitive without changing the deliberate ambiguity of “the dead.”
  - severity: low
    issue: The footnote says “పాతిపెట్టవచ్చు” (“may/can bury”), which weakens the contextual sense of the saying.
    rationale: The note should describe the likely metaphorical-literal contrast without implying mere possibility. “పాతిపెడతారు” is clearer and more faithful to the explanatory intent.
  revised_text: 'కాని యేసు అతనితో ఇలా అంటాడు: “నన్ను అనుసరించు; చనిపోయినవారే తమ చనిపోయినవారిని పాతిపెట్టుకోనివ్వు.”'
  revised_footnotes:
  - marker: a
    text: 'మొదటి ‘చనిపోయినవారు’ అనే మాటను తరచుగా రూపకంగా అర్థం చేసుకుంటారు: ఆధ్యాత్మికంగా స్పందించనివారు భౌతికంగా చనిపోయినవారిని పాతిపెడతారు.'
    reason: alternative_reading
  revision_rationale: 'The revision replaces the unnatural permissive form with idiomatic modern Telugu while retaining the Greek wordplay: both occurrences remain “చనిపోయినవారు,” and the footnote, not the main text, notes the commonly understood metaphorical sense of the first occurrence. The historical present and the reflexive emphasis (“తమ”) are retained.'
