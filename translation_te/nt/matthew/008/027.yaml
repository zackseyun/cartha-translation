id: MAT.8.27
reference: Matthew 8:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: te
  text: 'ఆ మనుషులు ఆశ్చర్యపడి ఇలా అన్నారు: “గాలులు, సముద్రం కూడా ఈయన మాట వింటున్నాయంటే, ఈయన ఎలాంటివాడు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: ఆ మనుషులు
  rationale: ἄνθρωποι ఇక్కడ పడవలో ఉన్న పురుషులను సూచిస్తుంది. తెలుగు కథనంలో ‘ఆ మనుషులు’ మూలంలోని నిర్దిష్ట సమూహాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἐθαύμασαν
  choice: ఆశ్చర్యపడి
  rationale: క్రియ సూచించే విస్మయ స్పందనను ఆధునిక, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λέγοντες
  choice: అన్నారు
  rationale: గ్రీకు వర్తమాన కృదంతాన్ని తెలుగు కథనశైలికి సహజంగా ప్రత్యక్ష వాక్యం తరువాత వచ్చే ‘అన్నారు’గా మార్చింది.
- source_word: Ποταπός ἐστιν οὗτος
  choice: ఈయన ఎలాంటివాడు?
  rationale: ποταπός వ్యక్తి ఎటువంటి వాడో, ఏ స్వభావం లేదా రకం కలవాడో అడుగుతుంది. ‘ఎలాంటివాడు?’ ఆ ఆశ్చర్యభరిత ప్రశ్నను సహజంగా నిలుపుతుంది.
- source_word: ὅτι
  choice: …వింటున్నాయే
  rationale: ὅτι పరిచయం చేసే ఆశ్చర్యానికి ఆధారమైన విషయాన్ని తెలుగులో ప్రత్యేక ‘అని/ఎందుకంటే’ పదం లేకుండా, వివరణాత్మక రెండవ ప్రశ్నగా మరియు ‘-యే’ ఉద్ఘాటనతో సహజంగా వ్యక్తం చేసింది.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: గాలులు, సముద్రం కూడా
  rationale: పునరుక్త καί కలిగించే విస్తృతిని, ఆశ్చర్యాన్ని ‘కూడా’ ద్వారా తెలియజేస్తుంది; గ్రీకులోని బహువచన ‘గాలులు’ మరియు ఏకవచన ‘సముద్రం’ నిలుపబడ్డాయి.
- source_word: αὐτῷ ὑπακούουσιν
  choice: ఈయన మాట వింటున్నాయి
  rationale: ὑπακούω యొక్క ‘విధేయంగా వినడం/లోబడడం’ భావాన్ని తెలుగు వాడుకలో వ్యక్తిగత అధికారానికి స్పందనగా ‘మాట వినడం’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: శిష్యుల ప్రశ్నలోని క్రీస్తుసంబంధ సూచన
  choice: సృష్టిపై యేసుకున్న అసాధారణ అధికారాన్ని సూచించే ప్రశ్నను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపడం.
  alternative: ‘ఈయన నిజంగా ఎవరు?’ వంటి పదాలతో దైవత్వ నిర్ధారణను స్పష్టంగా చేర్చడం, లేదా దీనిని కేవలం అద్భుతంపై ఆశ్చర్యంగా తగ్గించడం.
  rationale: మూలవాక్యం యేసు స్వరూపం గురించి ఉద్వేగభరితమైన ప్రశ్నను లేవనెత్తుతుంది కానీ సమాధానాన్ని ఇక్కడ ప్రత్యక్షంగా ఇవ్వదు. అనువాదం ఆ క్రీస్తుసంబంధ ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి. ప్రత్యక్ష వాక్యంలో ఆశ్చర్యాన్ని సహజంగా వినిపించేందుకు రెండు అనుసంధానిత ప్రశ్నలు మరియు ‘కూడా…వింటున్నాయే’ నిర్మాణం ఉపయోగించబడింది.
