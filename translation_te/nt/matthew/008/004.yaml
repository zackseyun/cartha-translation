id: MAT.8.4
reference: Matthew 8:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: te
  text: 'మత్తయి 8:4


    యేసు అతనితో, “చూడు, ఎవరికీ చెప్పవద్దు. అయితే వెళ్లి, నిన్ను నీవు యాజకునికి చూపించు; మోషే ఆజ్ఞాపించిన కానుకను[a] వారికి సాక్ష్యంగా[b] అర్పించు” అని చెప్పాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ ఆజ్ఞ కుష్ఠరోగం నుండి శుద్ధి పొందిన వ్యక్తి పాటించవలసిన మోషే ధర్మశాస్త్ర విధానాన్ని సూచిస్తుంది; లేవీయకాండము 14 చూడండి.
    reason: cross_reference
  - marker: b
    text: ‘వారికి సాక్ష్యంగా’ అనే మాట యాజకుల ముందు చూపే రుజువును సూచించవచ్చు; నమ్మని వారికి వ్యతిరేక సాక్ష్యమని కూడా కొందరు అర్థం చేసుకుంటారు. మూలవాక్యం ఎవరిని ఉద్దేశిస్తుందో స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅρα
  choice: చూడు
  rationale: ఇక్కడ ఈ ఆజ్ఞాపదం చూడమనే అక్షరార్థంలో కాక, తరువాతి నిషేధాన్ని గట్టిగా హెచ్చరించే సంభాషణాత్మక ప్రయోగం. ‘చూడు’ ఆ హెచ్చరిక బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: μηδενὶ εἴπῃς
  choice: ఎవరికీ చెప్పవద్దు
  rationale: μηδενί అనే పరోక్ష కర్మను, నిషేధార్థక నిర్మాణాన్ని సంక్షిప్తంగా, స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: ἀλλὰ ὕπαγε
  choice: అయితే వెళ్లి
  rationale: ἀλλά చూపే వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది; ὕπαγεకు సహజమైన ఆజ్ఞారూపం ‘వెళ్లి’.
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: నిన్ను నీవు యాజకునికి చూపించు
  rationale: ఆత్మవాచక నిర్మాణాన్ని నిలుపుతూ, శుద్ధి పొందిన వ్యక్తిని యాజకుడు పరిశీలించే మోషే ధర్మశాస్త్ర నేపథ్యాన్ని అనవసరంగా విపులీకరించదు.
- source_word: τῷ ἱερεῖ
  choice: యాజకునికి
  rationale: నిర్దిష్ట ఉపపదం ఈ విధికి సంబంధించిన తగిన యాజక అధికారిని సూచిస్తుంది. తెలుగు సందర్భంలో ‘యాజకునికి’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: προσένεγκον τὸ δῶρον
  choice: కానుకను … అర్పించు
  rationale: δῶρον యొక్క ‘కానుక’ భావాన్నీ, προσένεγκον యొక్క ఆరాధనా సంబంధమైన సమర్పణ భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: మోషే ఆజ్ఞాపించిన
  rationale: ప్రక్రియను మోషే నిర్దేశించిన అధికారపూర్వక ఆజ్ఞగా నేరుగా తెలియజేస్తుంది.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: వారికి సాక్ష్యంగా
  rationale: εἰς యొక్క ఉద్దేశం/ఫలిత భావాన్ని సహజంగా తెలియజేస్తూ, μαρτύριον అనుకూల సాక్ష్యమా లేక వ్యతిరేక సాక్ష్యమా, αὐτοῖς ఎవరిని సూచిస్తుందా అన్న విషయాలను నిర్ధారించకుండా ఉంచుతుంది.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: యేసు అతనితో … అని చెప్పాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమాన కాలాన్ని తెలుగు కథన శైలికి సహజమైన భూతకాలంలో అందిస్తుంది; మాట్లాడిన వ్యక్తి, వినిన వ్యక్తి రెండింటినీ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘వారికి సాక్ష్యంగా’ అనే మాటలోని సూచన మరియు సాక్ష్యం యొక్క స్వభావం
  choice: ‘వారికి సాక్ష్యంగా’ అని అస్పష్టతను అలాగే నిలుపడం
  alternative: ‘యాజకులకు రుజువుగా’ లేదా ‘వారికి వ్యతిరేక సాక్ష్యంగా’ అని స్పష్టీకరించడం
  rationale: αὐτοῖς అనే సర్వనామం ఎవరిని సూచిస్తుందో వాక్యం స్పష్టంగా చెప్పదు; μαρτύριον కూడా సాక్ష్యం/రుజువు అనే విస్తృత భావం కలిగివుంది. అందువల్ల యాజకులు, ప్రజలు లేదా నాయకులు అని నిర్దిష్టం చేయకుండా, అది అనుకూల రుజువా లేక అవిశ్వాసానికి వ్యతిరేక సాక్ష్యమా అన్నదీ నిర్ణయించకుండా మూలంలోని ఉద్వేగాన్ని నిలుపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘కానుకను అర్పించు’ ఆరాధనా సందర్భాన్ని సహజంగా తెలియజేస్తుంది; ‘వారికి’ అనే సర్వనామాన్ని విపులీకరించకుండా మూలంలోని అస్పష్టతను కాపాడాం.
