  source_fidelity: 'The Telugu accurately represents all major elements of the Greek: Jesus'' warning not to tell anyone, the contrasting command to go and show himself to the priest, the offering prescribed by Moses, and the deliberately open-ended phrase “వారికి సాక్ష్యంగా” for εἰς μαρτύριον αὐτοῖς. The referent of “వారికి” is not unnecessarily specified.'
