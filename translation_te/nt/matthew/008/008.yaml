revisions:
- from: శతాధిపతి అందుకు ఇలా అన్నాడు:[a] “ప్రభువా, నీవు నా ఇంటి కప్పు కిందికి రావడానికి నేను అర్హుణ్ణి కాను. ఒక్క మాట మాత్రం చెప్పు;[b] అప్పుడు నా సేవకుడు[c] స్వస్థత పొందుతాడు.”
  to: శతాధిపతి జవాబుగా ఇలా అన్నాడు:[a] “ప్రభువా, నీవు నా ఇంటి కప్పుకింద ప్రవేశించడానికి నేను అర్హుణ్ణి కాను. కేవలం ఒక మాట చెప్పు;[b] నా సేవకుడు[c] స్వస్థత పొందుతాడు.”
