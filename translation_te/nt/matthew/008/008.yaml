id: MAT.8.8
reference: Matthew 8:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: te
  text: శతాధిపతి జవాబుగా ఇలా అన్నాడు:[a] “ప్రభువా, నీవు నా ఇంటి కప్పుకింద ప్రవేశించడానికి నేను అర్హుణ్ణి కాను. కేవలం ఒక మాట చెప్పు;[b] నా సేవకుడు[c] స్వస్థత పొందుతాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “జవాబుగా” అనే భావాన్ని తెలిపే మాటలు లేవు.
    reason: textual_variant
  - marker: b
    text: లేదా “మాటతోనే చెప్పు.” గ్రీకులో అక్షరార్థంగా “మాటతో చెప్పు” అనే నిర్మాణం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “బాలుడు,” “పిల్లవాడు.” గ్రీకు పదం సందర్భాన్ని బట్టి పిల్లవాణ్ణి, యువకుణ్ణి లేదా సేవకుణ్ణి సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ⸂καὶ ἀποκριθεὶς⸃ … ἔφη
  choice: అందుకు ఇలా అన్నాడు
  rationale: ἀποκριθείς మరియు ἔφη కలసి సంభాషణలో ప్రతిస్పందనను పరిచయం చేసే గ్రీకు నిర్మాణం. తెలుగులో ‘జవాబిచ్చి అన్నాడు’ అనే అనవసర పునరుక్తిని నివారిస్తూ ప్రతిస్పందన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἑκατόνταρχος
  choice: శతాధిపతి
  rationale: సుమారు వందమంది సైనికులకు అధికారి అనే పదార్థాన్ని తెలిపే స్థిరమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: గౌరవపూర్వక సంబోధనను, అలాగే యేసును ఉద్దేశించినప్పుడు ఉండగల క్రీస్తు సంబంధమైన భావగాంభీర్యాన్ని అతిశయింపకుండా నిలుపుతుంది.
- source_word: οὐκ εἰμὶ ἱκανός
  choice: నేను అర్హుణ్ణి కాను
  rationale: ఇక్కడ ἱκανός కేవలం సామర్థ్యాన్ని కాక, తన ఇంటికి యేసును ఆహ్వానించేందుకు తాను తగినవాడిని కాదనే వినయభావాన్ని సూచిస్తుంది.
- source_word: ὑπὸ τὴν στέγην
  choice: నా ఇంటి కప్పు కిందికి
  rationale: ‘నా ఇంటికి’ అని సరళీకరించకుండా గ్రీకులోని స్పష్టమైన ‘కప్పు కింద’ అనే గృహరూపకాన్ని నిలుపుతుంది; ‘ఇంటి’ అనే పదం తెలుగులో భావాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: ἀλλὰ μόνον εἰπὲ λόγῳ
  choice: ఒక్క మాట మాత్రం చెప్పు
  rationale: μόνον యొక్క పరిమితి భావాన్ని ‘మాత్రం’తో, λόγῳ యొక్క ‘మాట’ భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ἰαθήσεται
  choice: స్వస్థత పొందుతాడు
  rationale: భవిష్యత్ నిష్క్రియార్థాన్ని తెలుగులో సహజంగా, కర్తను ప్రత్యేకంగా చేర్చకుండా తెలియజేస్తుంది.
- source_word: παῖς
  choice: సేవకుడు
  rationale: ఈ కథా సందర్భం మరియు శతాధిపతి గృహంలోని సంబంధం ‘సేవకుడు’ అనే అర్థానికి మద్దతిస్తాయి; అయితే ‘బాలుడు/పిల్లవాడు’ అనే పదార్థసాధ్యతను పాదసూచికలో నిలుపుతున్నాం.
theological_decisions:
- issue: యేసును సంబోధించే κύριος పదం
  choice: ప్రభువా
  alternative: అయ్యా; యజమానీ
  rationale: ‘ప్రభువా’ గౌరవ సంబోధనను సహజంగా తెలిపి, ఈ సందర్భంలో ఉండగల క్రీస్తు సంబంధమైన ప్రతిధ్వనిని తొలగించదు; అదే సమయంలో సంబోధన ఒక్కటే పూర్తి దైవ ప్రకటన అని బలవంతంగా నిర్ణయించదు.
- issue: παῖς పదం సూచించే సంబంధం
  choice: సేవకుడు
  alternative: బాలుడు; పిల్లవాడు
  rationale: శతాధిపతి సామాజిక సందర్భంలో ‘సేవకుడు’ ప్రధాన అర్థంగా సరిపోతుంది. అయినా గ్రీకు పదానికి వయస్సు లేదా కుటుంబ సంబంధాన్ని సూచించే విస్తృత అర్థం ఉన్నందున ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తున్నాం.
- issue: ‘స్వస్థత పొందుతాడు’లో స్వస్థపరిచే కర్త
  choice: కర్తను ప్రత్యేకంగా పేర్కొనలేదు
  alternative: నీవు అతణ్ణి స్వస్థపరుస్తావు
  rationale: గ్రీకు ἰαθήσεται నిష్క్రియ రూపంలో ఉంది; స్వస్థపరిచే కర్తను వాక్యం స్పష్టంగా పేర్కొనదు. కాబట్టి యేసు అధికారాన్ని సందర్భం సూచించినా, అనువాదంలో లేని కర్తను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘శతాధిపతి,’ ‘ప్రభువా,’ ‘స్వస్థత’ వంటి స్థిరమైన బైబిలు పదాలు సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణంలో ఉంచబడ్డాయి. గ్రీకు గృహరూపకం మరియు παῖς పదంలోని నిజమైన సందిగ్ధత నిలుపబడ్డాయి.
