review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the contrast (δέ), the idiomatic but deliberately formal ‘sons of the kingdom,’ future passive forcible exclusion, ‘outer darkness,’ and the location-first force of ἐκεῖ. It does not import ‘hell’ or a fuller doctrine of punishment.
  naturalness: ‘పళ్లు కొరకడమూ’ is understandable, but ‘పళ్లు కొరుకుట’ is the more established and idiomatic Telugu rendering for the fixed expression ‘gnashing of teeth.’ ‘రోదన’ also better sustains the solemn register of κλαυθμός than the more everyday ‘ఏడుపు.’
  terminology: ‘రాజ్యపు కుమారులు,’ ‘బయటి చీకటి,’ and ‘త్రోసివేయబడతారు’ are suitable, source-close modern-standard Telugu choices. The note properly explains that ‘కుమారులు’ is an idiom and should not be reduced to biological sonship.
  issues:
  - severity: low
    issue: The rendering of βρυγμὸς τῶν ὀδόντων is slightly less idiomatic.
    rationale: ‘పళ్లు కొరకడమూ’ can be understood, but ‘పళ్లు కొరుకుట’ is the conventional, natural Telugu collocation for gnashing teeth and retains the vivid bodily image.
  - severity: low
    issue: The register of κλαυθμός can be made more solemn.
    rationale: ‘రోదన’ naturally conveys lamentation in this judgment context while avoiding an intensified interpretation such as loud wailing.
