id: MAT.8.12
reference: Matthew 8:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: te
  text: అయితే రాజ్యపు కుమారులు[a] బయటి చీకటిలోకి త్రోసివేయబడతారు. అక్కడ రోదన, పళ్లు కొరుకుట ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “రాజ్యపు కుమారులు.” ఇది రాజ్యానికి హక్కుగల వారిగా లేదా దానిలో ఉండవలసిన వారిగా భావించబడినవారిని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ τῆς βασιλείας
  choice: అయితే రాజ్యపు కుమారులు
  rationale: δέ ముందున్న వాక్యంతో ఉన్న వ్యత్యాసాన్ని చూపుతుంది. ‘రాజ్యపు కుమారులు’ అనే సమీప అనువాదం గ్రీకు నుడికారాన్నీ, రాజ్యానికి చెందుతారని భావించబడినవారే వెలివేయబడుతున్న వ్యంగ్యభరిత మలుపునీ నిలుపుతుంది.
- source_word: ἐκβληθήσονται
  choice: త్రోసివేయబడతారు
  rationale: భవిష్యత్ కర్మణి రూపంలోని బలవంతపు వెలివేత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: బయటి చీకటి
  rationale: స్థలానికి వెలుపల ఉన్న చీకటి అనే మత్తయి వాడే తీర్పు చిత్రణను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: κλαυθμὸς
  choice: ఏడుపు
  rationale: దుఃఖభరిత రోదనను అతిశయింపకుండా సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: పళ్లు కొరకడం
  rationale: గ్రీకు స్థిర పదబంధంలోని శారీరక చిత్రణను సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: గ్రీకు వాక్యారంభంలోని స్థల ప్రాధాన్యాన్ని తెలుగులోనూ వాక్యారంభంలో నిలుపుతుంది.
theological_decisions:
- issue: తీర్పు మరియు వెలివేత చిత్రణ
  choice: ‘బయటి చీకటిలోకి త్రోసివేయబడతారు’ అనే మూల చిత్రణను యథాతథంగా ఉంచడం
  alternative: ‘నరకానికి పంపబడతారు’ లేదా ‘నిత్యశిక్ష పొందుతారు’ అని వివరణాత్మకంగా మార్చడం
  rationale: ఈ వాక్యం తీవ్రమైన అంత్యకాల వెలివేతను, వేదనను చిత్రిస్తుంది; అయితే ఇక్కడ గ్రీకు పాఠం ‘నరకం’ అనే నిర్దిష్ట పదాన్ని వాడదు. అందువల్ల మూలంలోని చిత్రణను సిద్ధాంతపరంగా విస్తరించకుండా నిలుపుతున్నాం.
- issue: υἱοὶ అనే పురుషలింగ నుడికారం
  choice: ‘కుమారులు’ అని అనువదించడం; దాని నుడికారార్థాన్ని పాదసూచికలో తెలపడం
  alternative: ప్రధాన పాఠంలోనే ‘పిల్లలు,’ ‘వారసులు,’ లేదా ‘రాజ్యానికి చెందాల్సినవారు’ అని ఇవ్వడం
  rationale: ‘కుమారులు’ గ్రీకు రూపాన్నీ దాని ఒడంబడిక/వారసత్వ నుడికారాన్నీ కాపాడుతుంది; పాదసూచిక ఇది కేవలం జీవశాస్త్రీయ పుత్రత్వానికే పరిమితం కాదని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి వాడబడింది. ‘అక్కడ’ను రెండవ వాక్యం ఆరంభంలో ఉంచి ἐκεῖ యొక్క స్థల ప్రాధాన్యాన్ని కాపాడాం; తీర్పు చిత్రణను సిద్ధాంతపరమైన వివరణగా విస్తరించలేదు.
