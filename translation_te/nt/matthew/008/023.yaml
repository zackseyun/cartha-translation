id: MAT.8.23
reference: Matthew 8:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: te
  text: ఆయన పడవ ఎక్కగా[a], ఆయన శిష్యులు ఆయనను అనుసరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన పడవ ఎక్కినప్పుడు”; మరింత స్పష్టమైన కాలక్రమ భావంతో, “ఆయన పడవ ఎక్కిన తరువాత.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντι
  choice: ఎక్కగా
  rationale: అయోరిస్ట్ క్రియావిశేషణ రూపం ప్రధాన క్రియకు సంబంధించిన కాలసంబంధాన్ని తెలియజేస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘ఎక్కగా’ సహజంగా ఉండి, ‘ఎక్కినప్పుడు/ఎక్కిన తరువాత’ అనే భావపరిధిని అతిగా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: πλοῖον
  choice: పడవ
  rationale: గలిలయ సముద్రపు సందర్భంలో ‘పడవ’ సహజమైన ఆధునిక తెలుగు పదం. గ్రీకులో నిర్దిష్ట ఉపపదం లేదు; తెలుగులో ఉపపదాల వ్యవస్థ లేకపోవడం వల్ల ‘ఒక’ లేదా ‘ఆ’ అని అనవసరంగా చేర్చలేదు.
- source_word: ἠκολούθησαν
  choice: అనుసరించారు
  rationale: ఈ పదం ఇక్కడ భౌతికంగా ఆయన వెంట వెళ్లడాన్ని సూచిస్తూనే, మత్తయి సువార్తలోని శిష్యత్వ భావఛాయను కూడా కలిగి ఉండవచ్చు. ‘అనుసరించారు’ ఈ రెండింటినీ విస్తరించి వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: μαθηταὶ
  choice: శిష్యులు
  rationale: యేసును అనుసరించేవారిని సూచించే సువార్తల ప్రామాణిక పదప్రయోగానికి ‘శిష్యులు’ సహజమైన, స్థిరపడిన తెలుగు సమానం.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: ఆయన ... ఆయనను ... ఆయన
  rationale: సందర్భంలో ఈ సర్వనామాలన్నీ యేసునే సూచిస్తాయి. గౌరవప్రదమైన ఆధునిక తెలుగు వాడుకకు అనుగుణంగా ‘ఆయన’ రూపాలను ఉపయోగించాం.
theological_decisions:
- issue: ἀκολουθέωలో ఉండగల శిష్యత్వ భావఛాయ
  choice: అనుసరించారు
  alternative: ఆయన వెంట వెళ్లారు
  rationale: వాక్యం ప్రత్యక్షంగా పడవలో ఆయన వెంట వెళ్లడాన్ని వర్ణిస్తుంది; అయితే క్రియలో ఉండగల విస్తృత శిష్యత్వ భావాన్ని ‘అనుసరించారు’ నిలుపుతుంది. ‘ఆయన శిష్యులయ్యారు’ అని అనువదించడం సందర్భం చెప్పినదానికంటే ఎక్కువ భావాన్ని చేర్చుతుంది.
translation_notes:
  register: సరళమైన, ఆధునిక, గౌరవప్రదమైన తెలుగు. ‘పడవ ఎక్కడం’ సహజ తెలుగు ప్రయోగం; గ్రీకు మూలంలోని ఉపపద రాహిత్యాన్ని తెలుగులో కృత్రిమంగా ‘ఒక’ లేదా ‘ఆ’ చేర్చకుండా ఉంచాం.
