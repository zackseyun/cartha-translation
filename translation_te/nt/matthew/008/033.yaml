id: MAT.8.33
reference: Matthew 8:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: te
  text: అప్పుడు మందను మేపుతున్నవారు పారిపోయారు. వారు పట్టణంలోకి వెళ్లి, అన్నిటినీ, దయ్యాలు పట్టినవారికి సంబంధించిన సంగతులను కూడా తెలియజేశారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భానుసారంగా, “దయ్యాలు పట్టినవారికి జరిగినది కూడా.” మూలభాషలో అక్షరార్థంగా, “దయ్యాలు పట్టినవారికి సంబంధించిన సంగతులు కూడా.”
    reason: τὰ τῶν δαιμονιζομένων అనే పదబంధం ‘వారికి సంబంధించిన సంగతులు’ అని విస్తృతంగా చెబుతుంది; సందర్భంలో అది వారికి జరిగిన విషయాలను సూచించవచ్చు.
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: అప్పుడు మందను మేపుతున్నవారు
  rationale: βόσκοντες అంటే మేపుతున్న లేదా పోషిస్తున్నవారు. సందర్భంలో ఇది పందుల మందను చూసుకునేవారిని సూచిస్తుంది. δέ కథనంలోని తదుపరి పరిణామాన్ని సూచించేలా ‘అప్పుడు’గా అనువదించబడింది.
- source_word: ἔφυγον
  choice: పారిపోయారు
  rationale: φεύγω ఇక్కడ భయంతో అక్కడి నుంచి పారిపోవడాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: వారు పట్టణంలోకి వెళ్లి
  rationale: ఆరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది. ‘పట్టణంలోకి’ అనేది εἰς యొక్క దిశార్థాన్ని నిలుపుతుంది.
- source_word: ἀπήγγειλαν πάντα
  choice: జరిగినదంతా ... తెలియజేశారు
  rationale: ἀπαγγέλλω అంటే జరిగిన విషయాన్ని నివేదించడం లేదా తెలియజేయడం; πάντα దాని సమగ్రతను సూచిస్తుంది. సహజ తెలుగు వాక్యనిర్మాణం కోసం ‘జరిగినదంతా’ ఉపయోగించబడింది.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: దయ్యాలు పట్టినవారికి జరిగినది కూడా
  rationale: ఈ గ్రీకు పదబంధం అక్షరార్థంగా ‘దయ్యాలు పట్టినవారికి సంబంధించిన సంగతులు కూడా’ అని ఉంటుంది. సందర్భంలో వారికి జరిగిన పరిణామాన్ని సూచించేలా సహజ తెలుగులో అనువదించబడింది; మూలంలోని సంక్షిప్తతను పాదసూచికలో చూపించాం.
- source_word: δαιμονιζομένων
  choice: దయ్యాలు పట్టినవారు
  rationale: ఈ రూపం దయ్యాల ఆధీనంలో బాధపడుతున్నవారిని సూచిస్తుంది. ‘దయ్యాలు పట్టినవారు’ సాధారణ తెలుగు పాఠకులకు స్పష్టంగా ఉండి, మూలపదం చెప్పనంత అదనపు సిద్ధాంతపరమైన వివరణను జోడించదు.
theological_decisions:
- issue: δαιμονιζομένων అనే పదంలో దయ్యాల ప్రభావాన్ని ఎలా వ్యక్తపరచాలి
  choice: దయ్యాలు పట్టినవారు
  alternative: దయ్యాల చేత బాధించబడినవారు
  rationale: సందర్భం నిజమైన దయ్యాల ఆధీనాన్ని వర్ణిస్తుంది. ‘దయ్యాలు పట్టినవారు’ నేరుగా, సుపరిచితంగా ఉంది; అయితే ఆ ఆధీనం స్వరూపం గురించి మూలపాఠం చేయని సూక్ష్మ సిద్ధాంత భేదాలను ఇది చేర్చదు.
- issue: τὰ τῶν δαιμονιζομένων అనే సంక్షిప్త పదబంధం యొక్క భావం
  choice: దయ్యాలు పట్టినవారికి జరిగినది కూడా
  alternative: దయ్యాలు పట్టినవారికి సంబంధించిన సంగతులు కూడా
  rationale: సందర్భానుసారంగా ప్రధాన పాఠంలో సహజమైన భావాన్ని ఇచ్చాం. గ్రీకు పదబంధం ‘జరిగినది’ అని స్పష్టంగా చెప్పకుండా సంబంధాన్ని మాత్రమే సూచిస్తున్నందున, మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన కథన శైలి. పొడవైన గ్రీకు వాక్యాన్ని సహజ తెలుగు కోసం రెండు వాక్యాలుగా విభజించాం; అర్థక్రమం యథాతథంగా ఉంచాం.
