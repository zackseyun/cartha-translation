revisions:
- from: అప్పుడు మందను మేపుతున్నవారు పారిపోయారు. వారు పట్టణంలోకి వెళ్లి, జరిగినదంతా, దయ్యాలు పట్టినవారికి జరిగినది కూడా తెలియజేశారు.[a]
  to: అప్పుడు మందను మేపుతున్నవారు పారిపోయారు. వారు పట్టణంలోకి వెళ్లి, అన్నిటినీ, దయ్యాలు పట్టినవారికి సంబంధించిన సంగతులను కూడా తెలియజేశారు.[a]
  rationale: The revision preserves the Greek coordination, the comprehensive force of πάντα, and the concise ambiguity of τὰ τῶν δαιμονιζομένων. It retains the established Telugu term for demonic affliction while placing the context-specific ‘what happened to them’ interpretation in the footnote.
  reviewer_model: gpt-5.6-terra
