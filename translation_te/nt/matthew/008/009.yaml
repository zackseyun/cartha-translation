id: MAT.8.9
reference: Matthew 8:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: te
  text: ఎందుకంటే నేను కూడా అధికారానికి లోబడిన మనిషినే; నా ఆధీనంలో సైనికులు ఉన్నారు. నేను ఇతనితో, ‘వెళ్లు’ అని చెబుతాను, అతడు వెళ్తాడు; మరొకనితో, ‘రా’ అని చెబుతాను, అతడు వస్తాడు; నా సేవకునితో[a], ‘ఇది చేయి’ అని చెబుతాను, అతడు చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “బానిస” (గ్రీకు: దౌలోస్).'
    reason: δοῦλος అనే గ్రీకు పదానికి ఈ సందర్భంలో ‘సేవకుడు’ లేదా ‘బానిస’ అనే అర్థాలు సాధ్యమైనందున ప్రత్యామ్నాయాన్ని సూచించడం.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ఎందుకంటే
  rationale: శతాధిపతి తన మాటకు వివరణాత్మక ఆధారాన్ని ఇస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐγὼ ἄνθρωπός εἰμι
  choice: నేను కూడా ... మనిషినే
  rationale: ἐγώ లోని స్వల్ప ఉద్ఘాటనను ‘నేను’తో, καί లోని పోలికను ‘కూడా’తో, వాక్యంలోని నొక్కిచెప్పే స్వరాన్ని ‘మనిషినే’తో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπὸ ἐξουσίαν
  choice: అధికారానికి లోబడిన
  rationale: అధికార శ్రేణిలో మరొకరి ఆజ్ఞకు లోబడి ఉండే సైనిక భావాన్ని స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది; అధికారం ఎవరిదో మూలపాఠం చెప్పనందున దాన్ని చేర్చలేదు.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: నా కింద సైనికులు ఉన్నారు
  rationale: శతాధిపతి తాను అధికారానికి లోబడినవాడే అయినా తన కింద సైనికులు ఉన్నారనే సమాంతర అధికార నిర్మాణాన్ని సహజ తెలుగులో తెలుపుతుంది.
- source_word: λέγω τούτῳ ... καὶ ἄλλῳ
  choice: నేను ఇతనితో ... మరొకనితో ... చెబితే
  rationale: τούτῳ యొక్క సూచనాత్మక భావాన్ని ‘ఇతనితో’ నిలుపుతూ, ఆజ్ఞకు వెంటనే కలిగే ప్రతిస్పందనను తెలుగులో సహజమైన షరతు-ఫలిత నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: Πορεύθητι / Ἔρχου / Ποίησον τοῦτο
  choice: వెళ్లు / రా / ఇది చేయి
  rationale: మూడు ప్రత్యక్ష ఆజ్ఞలను సరళంగా, సమాంతరంగా, మూలపాఠంలోని సంక్షిప్తతతో అనువదిస్తుంది.
- source_word: δοῦλος
  choice: సేవకుడు
  rationale: ఈ సందర్భంలో ప్రధానాంశం గృహసభ్యుని చట్టపరమైన స్థితికన్నా శతాధిపతి ఆజ్ఞాధికారమే. అందువల్ల చదవడానికి సహజమైన ‘సేవకుడు’ను ప్రధాన పాఠంలో ఉంచి, బానిసత్వాన్ని స్పష్టపరిచే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: δοῦλος పదంలోని సేవకత్వం/బానిసత్వం భావం
  choice: సేవకుడు
  alternative: బానిస
  rationale: గ్రీకు పదం సామాజిక అధీనతను సూచించగలదు; అయితే ఇక్కడ వాక్య తాత్పర్యం శతాధిపతి అధికారానికి లోబడినవారి విధేయత. ‘సేవకుడు’ సందర్భానికి సహజంగా సరిపోతుంది, కాగా ‘బానిస’ అనే బలమైన సామాజిక అర్థాన్ని పాదసూచికలో నిలిపాం.
- issue: ὑπὸ ἐξουσίαν లో అధికార మూలం
  choice: అధికారానికి లోబడిన
  alternative: ఒకరి అధికారానికి లోబడిన
  rationale: మూలపాఠం ఆ అధికారాన్ని కలిగిన వ్యక్తిని నిర్దిష్టంగా పేర్కొనదు. అందువల్ల అస్పష్టతను అలాగే ఉంచి, సైనిక అధికార శ్రేణి భావాన్ని మాత్రమే వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ఆజ్ఞలు సంక్షిప్తంగా ఉంచబడ్డాయి; ‘అతడు’ రూపం వాక్య గాంభీర్యాన్ని కాపాడుతుంది. పాదసూచిక గుర్తు సంబంధిత ‘సేవకునితో’ పదం వెంటనే ఉంచబడింది.
