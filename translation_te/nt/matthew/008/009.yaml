revisions:
- from: ఎందుకంటే నేను కూడా అధికారానికి లోబడిన మనిషినే; నా కింద సైనికులు ఉన్నారు. నేను ఇతనితో, ‘వెళ్లు’ అని చెబితే అతడు వెళ్తాడు; మరొకనితో, ‘రా’ అని చెబితే అతడు వస్తాడు; నా సేవకునితో[a], ‘ఇది చేయి’ అని చెబితే అతడు చేస్తాడు.
  to: ఎందుకంటే నేను కూడా అధికారానికి లోబడిన మనిషినే; నా ఆధీనంలో సైనికులు ఉన్నారు. నేను ఇతనితో, ‘వెళ్లు’ అని చెబుతాను, అతడు వెళ్తాడు; మరొకనితో, ‘రా’ అని చెబుతాను, అతడు వస్తాడు; నా సేవకునితో[a], ‘ఇది చేయి’ అని చెబుతాను, అతడు చేస్తాడు.
  rationale: 'The revision retains the draft''s faithful terminology and register while making two limited improvements: it represents the Greek''s direct coordinated command-response clauses without conditional recasting, and it uses “నా ఆధీనంలో” to state the military authority relationship more precisely. The δοῦλος footnote remains anchored to “సేవకునితో” and retains the source''s lexical ambiguity.'
