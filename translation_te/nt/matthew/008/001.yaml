  text: ⸂Καταβάντος δὲ αὐτοῦ⸃ ἀπὸ τοῦ ὄρους ἠκολούθησαν αὐτῷ ὄχλοι πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: te
  text: ఆయన కొండనుండి దిగివచ్చినప్పుడు, పెద్ద జనసమూహాలు ఆయనను అనుసరించాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనేక జనసమూహాలు ఆయనను అనుసరించాయి.” గ్రీకులో అక్షరార్థంగా “జనసమూహాలు అనేకం” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: ఆయన దిగివచ్చినప్పుడు
  rationale: ఈ కర్తరి షష్ఠీ ప్రయోగంలోని భూతకాల కృదంతాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అనువదించాం. δέ ఇక్కడ స్వల్ప అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేకంగా ‘అప్పుడు/మరియు’ చేర్చకుండానే వాక్యప్రవాహంలో అది వ్యక్తమవుతుంది.
- source_word: ἀπὸ τοῦ ὄρους
  choice: కొండ
  rationale: ὄρος అంటే ‘కొండ’ లేదా ‘పర్వతం.’ ముందటి కథనంలోని ప్రదేశాన్ని సూచించే ఈ సందర్భంలో సాధారణ పాఠకులకు సహజంగా ఉండే ‘కొండ’ను ఎంచుకున్నాం.
- source_word: ἠκολούθησαν
  choice: అనుసరించాయి
  rationale: ἀκολουθέω ఇక్కడ ఒకరి వెంట వెళ్లడాన్ని సూచిస్తుంది. ‘అనుసరించాయి’ సువార్త కథనానికి తగిన, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: αὐτῷ
  choice: ఆయనను
  rationale: ἀκολουθέωతో వచ్చిన దత్తి విభక్తి సర్వనామాన్ని తెలుగు క్రియాప్రయోగానికి అనుగుణంగా కర్మరూపంలో ఇచ్చాం.
- source_word: ὄχλοι πολλοί
  choice: పెద్ద జనసమూహాలు
  rationale: πολλοί అనేక సమూహాలనో, పెద్ద సంఖ్యలో ప్రజలనో సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన ‘పెద్ద జనసమూహాలు’ను ఉంచి, మరింత రూపానుసారమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. ‘ఆయన’ ద్వారా సందర్భానికి తగిన గౌరవాన్ని నిలిపాం; గ్రీకు బహువచనమైన ὄχλοι భావాన్ని ‘జనసమూహాలు’తో కాపాడాం.
