id: MAT.8.28
reference: Matthew 8:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: te
  text: ఆయన అవతలి ఒడ్డుకు, గదరేనీయుల[a] ప్రాంతానికి వచ్చినప్పుడు, సమాధులలోనుంచి బయటికి వస్తున్న దయ్యాలు పట్టిన ఇద్దరు మనుషులు ఆయనకు ఎదురయ్యారు. వారు చాలా ఉగ్రులుగా ఉండడంతో[b], ఆ దారిలో ఎవ్వరూ వెళ్లలేకపోయేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “గదరేనీయులు”కు బదులుగా “గెర్గెసేనీయులు” లేదా “గెరసేనీయులు” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: “వారు అత్యంత ప్రమాదకరులుగా ఉండేవారు” లేదా “వారు చాలా క్రూరులుగా ఉండేవారు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: ఆయన ... వచ్చినప్పుడు
  rationale: కర్తరి షష్ఠీ స్వతంత్ర ప్రయోగాన్ని తెలుగులో సహజమైన కాలవాచక ఉపవాక్యంగా అనువదించింది.
- source_word: τὸ πέραν
  choice: అవతలి ఒడ్డు
  rationale: సందర్భంలో సరస్సు అవతలి వైపును సూచిస్తుంది; తెలుగులో ‘అవతలి ఒడ్డు’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: గదరేనీయుల ప్రాంతం
  rationale: χώραకు ‘ప్రాంతం’ సహజ సమానార్థకం; ప్రధాన పాఠంలోని Γαδαρηνῶν స్థలనామ రూపాన్ని అనుసరించింది.
- source_word: δύο δαιμονιζόμενοι
  choice: దయ్యాలు పట్టిన ఇద్దరు మనుషులు
  rationale: దయ్యాల ఆధీనంలో ఉన్న స్థితిని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; గ్రీకులోని పుంలింగ బహువచన సూచనను ‘మనుషులు’తో వ్యక్తం చేసింది.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: సమాధులలోనుంచి బయటికి వస్తున్న
  rationale: వారు పాతిపెట్టే స్థలాల నుంచి బయటికి వస్తున్న దృశ్యాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: χαλεποὶ λίαν
  choice: ఎంత భయంకరంగా ఉండేవారంటే
  rationale: χαλεπός ఇక్కడ ప్రమాదకరమైన, భీకరమైన స్వభావాన్ని సూచిస్తుంది; ‘భయంకరంగా’ అనేది కేవలం శారీరక హింసకే పరిమితం చేయకుండా భావాన్ని నిలుపుతుంది. λίαν–ὥστε తీవ్రత-ఫలిత సంబంధాన్ని ‘ఎంత...అంటే’ నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης
  choice: ఆ దారిలో ఎవ్వరూ వెళ్లలేకపోయేవారు
  rationale: ὥστε ఫలితాన్ని, ἰσχύειν ఇక్కడ సామర్థ్యాన్ని, διάతో కూడిన ὁδός ప్రయాణ మార్గాన్ని సంక్షిప్తంగా సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: దయ్యాల ప్రభావాన్ని సూచించే భాష
  choice: దయ్యాలు పట్టిన
  alternative: దయ్యాల ఆధీనంలో ఉన్న
  rationale: δαιμονιζόμενοι నిజమైన దయ్య సంబంధిత ఆధీనాన్ని సూచిస్తుంది. ‘దయ్యాలు పట్టిన’ అనేది సామాన్య పాఠకులకు స్పష్టమైన స్థిర తెలుగు ప్రయోగం; గ్రీకు పదం చెప్పేదానికంటే సాంకేతికమైన సిద్ధాంతాన్ని అదనంగా మోపదు.
- issue: స్థలనామానికి సంబంధించిన పాఠాంతరాలు
  choice: గదరేనీయులు
  alternative: గెర్గెసేనీయులు లేదా గెరసేనీయులు
  rationale: SBLGNT ప్రధాన పాఠం Γαδαρηνῶν అని చదువుతుంది కాబట్టి ప్రధాన వాక్యంలో దానినే అనుసరించింది; ఇతర ప్రాచీన ప్రతుల పాఠాలను పాదటిప్పణిలో ఉంచింది.
- issue: χαλεποί యొక్క భావ పరిధి
  choice: భయంకరంగా
  alternative: చాలా క్రూరంగా / అత్యంత ప్రమాదకరంగా
  rationale: ఈ పదం క్రూరత్వం లేదా ప్రమాదకరత రెండింటినీ సూచించగలదు. సందర్భంలోని మార్గం దాటలేని ఫలితాన్ని నిలుపుతూ, నిర్దిష్టంగా శారీరక హింస మాత్రమే అని నిర్ణయించకుండా ‘భయంకరంగా’ ఎంచుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే వచనానికి తగిన గౌరవప్రదమైన శైలి. ప్రధాన వాక్యాన్ని అతిగా పొడిగించకుండా రెండు వాక్యాలుగా విభజించింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
