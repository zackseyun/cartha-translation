id: MAT.8.24
reference: Matthew 8:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: te
  text: ఇదిగో, సముద్రంలో భారీ తుఫాను[a] చెలరేగింది; దానివల్ల పడవ అలలచేత కప్పబడేంతగా ఉంది[b]. అయితే ఆయన మాత్రం నిద్రపోతూ ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘తుఫాను’గా అనువదించిన గ్రీకు పదం సాధారణంగా ‘కంపనం’ లేదా ‘భూకంపం’ అని కూడా అర్థమవుతుంది; ఈ సముద్ర సందర్భంలో అది తీవ్రమైన తుఫానును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అలలచేత కప్పబడుతోంది.’
    reason: previous_rendering
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: సంఘటన అకస్మాత్తుగా, సజీవంగా పాఠకుని దృష్టికి వస్తున్నదనే గ్రీకు సంభాషణ సూచకపు బలాన్ని నిలుపుతుంది.
- source_word: σεισμὸς μέγας
  choice: గొప్ప తుఫాను
  rationale: σεισμός సాధారణంగా ‘కంపనం’ లేదా ‘భూకంపం’ అని అర్థమవగలిగినా, ఇక్కడ సముద్రం, పడవ, అలలు అనే సందర్భం సముద్రంలో ఏర్పడిన తీవ్రమైన కల్లోలాన్ని సూచిస్తుంది. ‘గొప్ప తుఫాను’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ἐγένετο
  choice: చెలరేగింది
  rationale: తుఫాను మొదలై తీవ్రంగా ఏర్పడటాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῇ θαλάσσῃ
  choice: సముద్రంలో
  rationale: గ్రీకు మూలంలోని ‘సముద్రం’ అనే పదాన్ని నిలుపుతూ సంఘటన జరిగిన ప్రదేశాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὥστε
  choice: దాంతో
  rationale: తుఫాను వల్ల కలిగిన ఫలితాన్ని స్పష్టంగా, సహజంగా అనుసంధానిస్తుంది.
- source_word: τὸ πλοῖον
  choice: పడవను
  rationale: గలిలయ సముద్ర సందర్భంలో πλοῖονకు ‘పడవ’ సహజమైన, తగిన సమానార్థకం.
- source_word: καλύπτεσθαι ὑπὸ τῶν κυμάτων
  choice: అలలు పడవను ముంచెత్తుతున్నాయి
  rationale: అలలు పడవను నిరంతరం కప్పివేస్తున్న దృశ్యాన్ని, గ్రీకు వర్తమాన నిష్క్రియార్థక భావాన్ని, తెలుగులో సజీవంగా మరియు సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτὸς δὲ
  choice: అయితే ఆయన మాత్రం
  rationale: చుట్టూ ఉన్న కల్లోలానికీ ఆయన చేస్తున్న పనికీ మధ్య గ్రీకులోని స్పష్టమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐκάθευδεν
  choice: నిద్రపోతూ ఉన్నాడు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల రూపం సూచించే కొనసాగుతున్న గత చర్యను వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: σεισμός సూచించే సంఘటన స్వభావం
  choice: సముద్ర సందర్భానికి అనుగుణంగా ‘తుఫాను’ అని అనువదించడం
  alternative: ‘భూకంపం’ లేదా ‘గొప్ప కంపనం’ అని మరింత అక్షరార్థంగా అనువదించడం
  rationale: ఇది సిద్ధాంతపరమైన నిర్ణయం కాదు; సందర్భాధారిత పదార్థ నిర్ణయం. సముద్రం, పడవ, అలలు అనే సమీప సందర్భం నీటిమీద తీవ్రమైన తుఫాను లేదా కల్లోలాన్ని సూచిస్తుంది. అయితే గ్రీకు పదానికి ఉన్న అక్షరార్థ పరిధిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవభరితమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ మూలంలోని దృష్టి ఆకర్షణను నిలుపుతుంది; ‘ఆయన మాత్రం’ తుఫాను కల్లోలానికీ యేసు నిద్రకీ మధ్య వ్యత్యాసాన్ని అతిశయింపకుండా స్పష్టం చేస్తుంది.
