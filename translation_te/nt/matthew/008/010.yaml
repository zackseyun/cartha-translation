id: MAT.8.10
reference: Matthew 8:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: te
  text: 'యేసు అది విని ఆశ్చర్యపోయి, తనను వెంబడిస్తున్నవారితో, “నేను మీతో నిశ్చయంగా చెబుతున్నాను: ఇశ్రాయేలులో ఎవరిలోనూ ఇంత గొప్ప విశ్వాసాన్ని నేను కనుగొనలేదు[a]” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇశ్రాయేలులో ఇంత గొప్ప విశ్వాసం ఉన్నవారెవరినీ నేను కనుగొనలేదు.”
    reason: మూలంలోని παρ’ οὐδενὶ నిర్మాణాన్ని తెలుగులో వ్యక్తికేంద్రంగా కూడా సహజంగా నిర్మించవచ్చు; అర్థంలో గణనీయమైన మార్పు లేదు.
lexical_decisions:
- source_word: ἀκούσας
  choice: అది విని
  rationale: భూతకాల కృదంతం ప్రధాన క్రియకు సందర్భాన్ని పరిచయం చేస్తుంది. ‘అది’ అనేది శతాధిపతి అంతకుముందు పలికిన మాటలను సూచించే సందర్భపూరణ.
- source_word: ἐθαύμασεν
  choice: ఆశ్చర్యపోయి
  rationale: యేసు ఆ మాటలకు ఆశ్చర్యం వ్యక్తం చేసిన కథన బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: తనను వెంబడిస్తున్నవారితో
  rationale: ఆ సమయంలో యేసు వెంట వస్తున్న ప్రజలను సూచిస్తుంది; స్థిరమైన అధికారిక బృందం అనే భావాన్ని అనవసరంగా కలిగించదు.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిశ్చయంగా చెబుతున్నాను
  rationale: యేసు ఉపయోగించిన గంభీరమైన ధృవీకరణ సూత్రంలోని నొక్కిచెప్పే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: παρ’ οὐδενὶ
  choice: ఎవరిలోనూ
  rationale: παρά దత్తివిభక్తితో ఇక్కడ ‘ఏ వ్యక్తి విషయంలోనూ/ఏ వ్యక్తిలోనూ’ అనే సహచర్య భావాన్ని ఇస్తుంది.
- source_word: τοσαύτην πίστιν
  choice: ఇంత గొప్ప విశ్వాసాన్ని
  rationale: τοσαύτην విశ్వాస పరిమాణం లేదా విశిష్టతను బలంగా సూచిస్తుంది; ‘ఇంత గొప్ప’ ఆ బలాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν τῷ Ἰσραὴλ
  choice: ఇశ్రాయేలులో
  rationale: ఇశ్రాయేలు ప్రజల మధ్య అనే స్థలాత్మక, సామూహిక భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: εὗρον
  choice: కనుగొనలేదు
  rationale: గ్రీకు భూతకాల క్రియను నేరుగా ప్రతిబింబిస్తూ, యేసు ఇప్పటివరకు ఎదుర్కొన్న వారిలో అలాంటి విశ్వాసం కనిపించలేదనే భావాన్ని ఇస్తుంది.
theological_decisions:
- issue: πίστις పదానికి అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం
  rationale: ఇక్కడ శతాధిపతి యేసు అధికారంపై ఉంచిన నమ్మకాన్ని సూచించినా, πίστιςకు విస్తృతమైన మరియు స్థిరమైన వేదాంతార్థాన్ని నిలుపడానికి ‘విశ్వాసం’ అనుకూలం.
- issue: యేసు ఆశ్చర్యపడ్డాడనే వాక్యాన్ని నిలుపడం
  choice: ఆశ్చర్యపోయి
  alternative: మెచ్చుకొని
  rationale: ἐθαύμασεν స్పష్టంగా ఆశ్చర్యాన్ని తెలియజేస్తుంది. యేసు స్వభావం గురించి ముందస్తు వేదాంత నిర్ణయంతో దాన్ని కేవలం ప్రశంసగా మార్చకుండా మూలంలోని ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘వెంబడిస్తున్నవారు’ తక్షణ కథన సందర్భాన్ని, ‘నిశ్చయంగా చెబుతున్నాను’ Ἀμὴν సూత్రంలోని గంభీరతను నిలుపుతాయి.
