id: MAT.8.25
reference: Matthew 8:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: te
  text: వారు ఆయన దగ్గరకు వచ్చి ఆయనను నిద్రలేపి, “ప్రభువా, మమ్మల్ని రక్షించు[a]! మేము నశించిపోతున్నాం!” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మమ్మల్ని కాపాడు” అని కూడా అనువదించవచ్చు. గ్రీకు σῶσον అనే ఆజ్ఞార్థక క్రియ తక్షణ ప్రమాదం నుంచి విడిపించడాన్నీ, విస్తృతమైన అర్థంలో ‘రక్షించడాన్నీ’ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: ఆయన దగ్గరకు వచ్చి
  rationale: యేసు వైపు వచ్చి, ఆ తరువాత ఆయనను నిద్రలేపిన కార్యక్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. ‘ఆయన దగ్గరకు’ అనేది సందర్భంలో స్పష్టమైన గమ్యాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἤγειραν
  choice: ఆయనను నిద్రలేపి
  rationale: ἐγείρω ఇక్కడ నిద్రలో ఉన్న వ్యక్తిని మేల్కొలపడం అనే స్పష్టమైన భావంలో ఉంది. ‘లేపి’ మాత్రమే అన్నప్పుడు ఇతర అర్థాలు రావచ్చు కాబట్టి ‘నిద్రలేపి’ సందర్భాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: λέγοντες
  choice: అన్నారు
  rationale: వారి మాటలను పరిచయం చేసే వర్తమాన కృదంతాన్ని తెలుగు వాక్య నిర్మాణానికి సహజంగా చివరలో సమాపక క్రియగా ఇచ్చింది; ‘కేకలు వేస్తూ’ వంటి మూలంలో లేని భావోద్వేగ వివరాన్ని చేర్చలేదు.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριος యొక్క సంబోధన రూపాన్ని గౌరవపూర్వకమైన, క్రైస్తవ సందర్భంలో సుపరిచితమైన తెలుగు బిరుదుగా నిలుపుతుంది; కేవలం ‘బోధకుడా’ లేదా ‘యజమానీ’ అనే పరిమిత భావానికి తగ్గించదు.
- source_word: σῶσον
  choice: మమ్మల్ని రక్షించు
  rationale: σῴζω యొక్క ఆజ్ఞార్థక రూపం ఇక్కడ తక్షణ ప్రమాదం నుంచి కాపాడమనే వేడుకోలు. గ్రీకులో కర్మ ప్రత్యక్షంగా లేకపోయినా, తరువాతి ‘మేము’ మరియు సందర్భం దానిని స్పష్టం చేస్తున్నందున తెలుగులో ‘మమ్మల్ని’ సహజంగా వ్యక్తం చేయబడింది.
- source_word: ἀπολλύμεθα
  choice: మేము నశించిపోతున్నాం
  rationale: వర్తమాన కాల రూపంలోని సమీపిస్తున్న వినాశనం లేదా మరణపు తీవ్రతను నిలుపుతుంది. ‘చనిపోతున్నాం’ కంటే మూలపద విస్తృతిని కాపాడుతూ, ఆధునిక పాఠకులకు కూడా అర్థమయ్యే రూపం.
theological_decisions:
- issue: యేసును సంబోధించే κύριος బిరుదు
  choice: ప్రభువా
  alternative: యజమానీ
  rationale: ఈ సంబోధన గౌరవపూర్వక పిలుపు నుంచి మరింత లోతైన క్రీస్తు సంబంధ అర్థం వరకు భావాన్ని మోయగలదు. ‘ప్రభువా’ ఆ విస్తృతిని నిలుపుతుంది; దానిని కేవలం కార్యసంబంధమైన ‘యజమానీ’గా పరిమితం చేయదు.
- issue: σῶσον లో అంతర్లీనంగా ఉన్న కర్మను తెలుగులో వ్యక్తం చేయడం
  choice: మమ్మల్ని రక్షించు
  alternative: రక్షించు
  rationale: మూలంలోని ఆజ్ఞార్థక క్రియకు కర్మ ప్రత్యక్షంగా లేకపోయినా, ἀπολλύμεθα లోని మొదటి పురుష బహువచనం మరియు పరిస్థితి ‘మమ్మల్ని’ అని స్పష్టం చేస్తాయి. తెలుగులో దాన్ని వ్యక్తం చేయడం సహజత కోసం; కొత్త సిద్ధాంతార్థాన్ని చేర్చడం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా వాక్యం రూపొందించబడింది. ‘నిద్రలేపి’ సందర్భాన్ని స్పష్టం చేస్తుంది; ‘నశించిపోతున్నాం’ మూలంలోని తీవ్రతను మరియు కొనసాగుతున్న ప్రమాద భావాన్ని నిలుపుతుంది.
