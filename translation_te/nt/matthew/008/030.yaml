lexical_decisions:
- source_word: ἦν δὲ
  choice: ఉంది
  rationale: ἦν ఉనికిని సూచిస్తుంది; δέ కథనాన్ని స్వల్పంగా ముందుకు నడిపే అనుసంధానం. తెలుగులో ప్రత్యేక అనుసంధాన పదం లేకుండానే సహజ వాక్యప్రవాహంలో దీని బలం వ్యక్తమవుతుంది.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: వారికి కొంత దూరంలో
  rationale: ఈ పదబంధం వారి నుండి ఉన్న స్థలదూరాన్ని సూచిస్తుంది. ‘కొంత దూరంలో’ సహజమైన ఆధునిక తెలుగు; ‘చాలా దూరంలో’ అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀγέλη
  choice: మంద
  rationale: జంతువుల సమూహానికి ‘మంద’ సహజమైన, సాధారణ తెలుగు పదం.
- source_word: χοίρων
  choice: పందులున్న
  rationale: χοῖροςను ఆధునిక తెలుగులో స్పష్టంగా ‘పంది’ అని అనువదించాం; సమూహ నిర్మాణానికి తగినట్లుగా ‘పందులున్న’ అని వాడాం.
- source_word: πολλῶν
  choice: చాలా పందులున్న
  rationale: πολλῶν నేరుగా పందుల అధిక సంఖ్యను విశేషిస్తుంది. ‘చాలా పందులున్న ఒక మంద’ ఆ సంఖ్యాభావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: βοσκομένη
  choice: మేస్తూ
  rationale: వర్తమాన కృదంతం మంద ఆ సమయంలో ఆహారం తింటూ ఉన్నదని సూచిస్తుంది. జంతువులకు ‘మేస్తూ’ సహజంగా ఉంటుంది; కాపరులు మేపుతున్నారనే అదనపు భావాన్ని చేర్చదు.
