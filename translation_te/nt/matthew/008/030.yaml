translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. మూలంలోని పదక్రమాన్ని కఠినంగా అనుసరించకుండా, స్థల సూచనను ముందుంచి సహజ తెలుగు వాక్యనిర్మాణం పాటించాం.
