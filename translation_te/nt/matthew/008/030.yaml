  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: te
  text: వారినుండి చాలా దూరంగా అనేక పందుల మంద మేస్తూ ఉంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారినుండి కొంత దూరంలో.’
