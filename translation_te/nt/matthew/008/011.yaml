id: MAT.8.11
reference: Matthew 8:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: te
  text: 'అయితే నేను మీతో చెబుతున్నాను: తూర్పు నుండీ పడమర నుండీ చాలామంది వచ్చి, పరలోక రాజ్యంలో అబ్రాహాము, ఇస్సాకు, యాకోబులతో కలిసి విందు భోజనానికి కూర్చుంటారు[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘ఆనుకొని కూర్చుంటారు.’ ప్రాచీన కాలంలో విందు భోజనం చేసేవారు బల్ల దగ్గర ఆనుకొని కూర్చునేవారు.
    reason: cultural_note
  - marker: b
    text: ‘తూర్పు నుండీ పడమర నుండీ’ అనేది దూర ప్రాంతాల నుండి, ఇశ్రాయేలుకు వెలుపలి ప్రాంతాల నుండి కూడా ప్రజలు రావడాన్ని సూచించే అవకాశం ఉంది.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: అయితే నేను మీతో చెబుతున్నాను
  rationale: δέ ముందున్న మాటతో స్వల్ప వ్యత్యాసాన్ని లేదా తదుపరి అంశానికి మలుపును సూచిస్తుంది. ‘అయితే’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πολλοὶ
  choice: అనేకులు
  rationale: ఈ విశేషణం నామవాచకార్థంలో ‘చాలామంది’ అని వాడబడింది. ‘అనేకులు’ సంక్షిప్తంగా, గౌరవప్రదమైన శైలిలో ఆ అర్థాన్ని ఇస్తుంది.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: తూర్పు నుండీ పడమర నుండీ
  rationale: గ్రీకు బహువచన రూపాలు దిక్కులను, వాటి వైపున ఉన్న విస్తార ప్రాంతాలను సూచించే నుడికారాలు. తెలుగు ప్రయోగం భౌగోళిక విస్తృతిని సహజంగా నిలుపుతుంది.
- source_word: ἥξουσιν
  choice: వచ్చి
  rationale: భవిష్యత్ భావం ప్రధాన క్రియ అయిన ‘కూర్చుంటారు’లో స్పష్టంగా ఉంది; తెలుగు వాక్యనిర్మాణంలో ‘వచ్చి ... కూర్చుంటారు’ సహజంగా ‘వస్తారు, కూర్చుంటారు’ అనే భవిష్యత్ క్రమాన్ని తెలియజేస్తుంది.
- source_word: ἀνακλιθήσονται
  choice: విందులో భోజనానికి కూర్చుంటారు
  rationale: ప్రాచీన భోజనాచారంలో బల్ల దగ్గర ఆనుకొని భోజనం చేయడాన్ని ఈ క్రియ సూచిస్తుంది. ఆధునిక తెలుగు పాఠకునికి అర్థమయ్యేలా విందు సందర్భాన్ని స్పష్టం చేస్తూ, భోజన సహవాస చిత్రాన్ని నిలుపుతుంది.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: అబ్రాహాము, ఇస్సాకు, యాకోబులతో కలిసి
  rationale: μετά సహవాసాన్ని సూచిస్తుంది; ఇక్కడ అది విందులో వారితో కలిసి ఉండడాన్ని తెలియజేస్తుంది. పేర్లు స్థిరపడిన తెలుగు బైబిలు రూపాల్లో ఇవ్వబడ్డాయి.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: పరలోక రాజ్యంలో
  rationale: ఇది మత్తయి సువార్తలో ప్రత్యేకంగా కనిపించే స్థిరమైన పదబంధం. ‘పరలోక రాజ్యం’ సహజమైన, విస్తృతంగా అర్థమయ్యే తెలుగు రూపం; గ్రీకులోని రాజ్య ఏకవచనాన్ని నిలుపుతుంది.
theological_decisions:
- issue: విందు చిత్రం మరియు అంత్యకాల సహవాసం
  choice: ‘విందులో భోజనానికి కూర్చుంటారు’ అని భోజన చిత్రాన్ని నిలుపడం
  alternative: ‘వారితో కలిసి ఉంటారు’ లేదా కేవలం ‘కూర్చుంటారు’
  rationale: ἀνακλιθήσονται కేవలం ఒక చోట ఉండడాన్ని కాక, భోజనానికి ఆనుకొని కూర్చోవడాన్ని సూచిస్తుంది. అనవసర సిద్ధాంత వివరణను చేర్చకుండా విందు సహవాస భావాన్ని అనువాదం నిలుపుతుంది.
- issue: తూర్పు, పడమరల నుండి వచ్చే ‘అనేకులు’ ఎవరు అనే పరిధి
  choice: గ్రీకు మూలంలోని భౌగోళిక పదాలను మాత్రమే ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘అనేకమంది అన్యజనులు’ అని స్పష్టీకరించడం
  rationale: సందర్భం ఇశ్రాయేలుకు వెలుపలివారి చేర్పును బలంగా సూచించినా, మూలపాఠ్యం నేరుగా ‘అన్యజనులు’ అని చెప్పదు. అందువల్ల అంతర్లీన భావాన్ని సిద్ధాంతపరంగా విస్తరించకుండా ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకునికి స్పష్టంగా ఉండేలా, అయినా గౌరవప్రదమైన బైబిలు శైలిలో రూపొందించబడింది. ప్రాచీన ఆనుకొని భోజనం చేసే ఆచారాన్ని ప్రధాన పాఠ్యంలో సహజమైన ‘భోజనానికి కూర్చుంటారు’గా ఇచ్చి, అక్షరార్థాన్ని పాదటిప్పణిలో వివరించాం.
