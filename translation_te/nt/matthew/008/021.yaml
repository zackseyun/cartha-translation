id: MAT.8.21
reference: Matthew 8:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: te
  text: అప్పుడు శిష్యుల్లో మరొకడు ఆయనతో, “ప్రభువా, నేను ముందుగా వెళ్లి నా తండ్రిని పాతిపెట్టుకోవడానికి నన్ను అనుమతించండి[a][b],” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను వెళ్లనివ్వండి” లేదా “నాకు అనుమతి ఇవ్వండి.”
    reason: lexical_alternative
  - marker: b
    text: ఈ విన్నపం వెంటనే చేయవలసిన అంత్యక్రియను సూచించవచ్చు; లేదా తండ్రి చనిపోయేంతవరకు కుమారునిగా తన కర్తవ్యాన్ని నిర్వర్తించడాన్ని విస్తృతంగా సూచించవచ్చు. గ్రీకు పాఠ్యం దీనిని స్పష్టంగా చెప్పదు.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: అప్పుడు శిష్యుల్లో మరొకడు
  rationale: ἕτερος మరొక వ్యక్తిని సూచిస్తుంది; τῶν μαθητῶν అతడు శిష్యుల సమూహానికి చెందినవాడని తెలియజేస్తుంది. δέను కథనం ముందుకు సాగే మృదువైన అనుసంధానంగా ‘అప్పుడు’ అని అనువదించాం.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: గౌరవపూర్వక ప్రత్యక్ష సంబోధనను, అలాగే ఈ పదానికి ఉండగల ధార్మిక ప్రాధాన్యాన్ని కాపాడే సాధారణ తెలుగు రూపం.
- source_word: ἐπίτρεψόν μοι
  choice: నాకు అనుమతి ఇవ్వండి
  rationale: ఇది అనుమతి కోరే ఆజ్ఞార్థక విన్నపం. ‘నాకు అనుమతి ఇవ్వండి’ ఆధునిక తెలుగులో సహజంగా, గౌరవపూర్వకంగా ఉంటుంది.
- source_word: πρῶτον
  choice: మొదట
  rationale: చర్యల క్రమంలో ముందుగా చేయదలచిన పనిని నేరుగా సూచిస్తుంది.
- source_word: ἀπελθεῖν καὶ θάψαι
  choice: వెళ్లి … పాతిపెట్టడానికి
  rationale: రెండు అనుసంధానిత క్రియలను సహజమైన తెలుగు క్రియాక్రమంలో వ్యక్తపరుస్తూ, అక్కడి నుంచి వెళ్లే భావాన్ని మరియు పాతిపెట్టే చర్యను నిలుపుతుంది.
- source_word: τὸν πατέρα μου
  choice: నా తండ్రిని
  rationale: మూలంలోని కర్మపదబంధానికి నేరమైన, సహజమైన తెలుగు అనువాదం.
theological_decisions:
- issue: తండ్రిని పాతిపెట్టాలనే విన్నపం యొక్క కాలసంబంధ అర్థం
  choice: తండ్రిని పాతిపెట్టడానికి వెళ్లేందుకు అనుమతి కోరినట్టుగా మాత్రమే ప్రధాన పాఠ్యంలో అనువదించాం; తండ్రి అప్పటికే చనిపోయాడా అనే విషయాన్ని నిర్ధారించలేదు.
  alternative: ఇది వెంటనే జరగవలసిన అంత్యక్రియను సూచించవచ్చు; లేదా తండ్రి చనిపోయేంతవరకు ఇంటివద్ద ఉండి కుమారుని బాధ్యత నెరవేర్చడాన్ని విస్తృతంగా సూచించవచ్చు.
  rationale: గ్రీకు వాక్యం ఈ రెండు అవకాశాల్లో దేనినీ స్పష్టంగా నిర్ణయించదు. అందువల్ల ప్రధాన పాఠ్యం అస్పష్టతను కాపాడుతుంది; వివరణను పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘ప్రభువా’ మరియు ‘అనుమతి ఇవ్వండి’ విన్నపంలోని గౌరవ స్వరాన్ని నిలుపుతాయి; వివాదాస్పద సాంస్కృతిక అర్థాన్ని ప్రధాన పాఠ్యంలోకి చేర్చలేదు.
