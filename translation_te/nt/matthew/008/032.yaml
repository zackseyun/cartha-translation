id: MAT.8.32
reference: Matthew 8:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: te
  text: ఆయన ఆ దయ్యాలతో, “వెళ్లండి” అన్నాడు. అవి బయటికి వచ్చి పందుల్లోకి[a] వెళ్లాయి. ఇదిగో, మందంతా నిటారైన వాలుదారి గుండా కిందికి సముద్రంలోకి దూసుకుపోయి, నీళ్లలో చనిపోయాయి.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సూకరాల్లోకి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘నీళ్లలో మునిగి చనిపోయాయి.’ గ్రీకు మూలపాఠం మరింత అక్షరార్థంగా ‘నీళ్లలో చనిపోయాయి’ అని చెబుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: వెళ్లండి
  rationale: యేసు ఇచ్చిన సంక్షిప్త ఆజ్ఞను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: αὐτοῖς / οἱ δὲ
  choice: వాటితో / అవి
  rationale: గ్రీకులో దయ్యాలను సూచించే సర్వనామాలే ఉన్నాయి. పేరును మళ్లీ చేర్చకుండా ఆ సర్వనామ సంబంధాన్ని తెలుగులో నిలుపుతుంది.
- source_word: ἐξελθόντες ἀπῆλθον εἰς τοὺς χοίρους
  choice: బయటికి వచ్చి పందుల్లోకి వెళ్లాయి
  rationale: మొదట బయటికి రావడం, ఆపై పందుల్లోకి వెళ్లడం అనే వరుస కదలికలను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: తరువాతి అకస్మాత్తైన దృశ్యంపై పాఠకుని దృష్టిని ఆకర్షించే గ్రీకు సంభాషణ సూచకపు ఉజ్జ్వలతను నిలుపుతుంది.
- source_word: πᾶσα ἡ ἀγέλη
  choice: మంద అంతా
  rationale: మొత్తం మందను సూచించే సహజమైన తెలుగు సమష్టి ప్రయోగం.
- source_word: ὥρμησεν
  choice: దూసుకుపోయి
  rationale: ఆకస్మికమైన, వేగవంతమైన, బలమైన కదలికను అతిగా వ్యాఖ్యానించకుండా వ్యక్తం చేస్తుంది.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: నిటారైన వాలు మీదుగా
  rationale: κρημνός సూచించగల తీవ్రమైన వాలు లేదా అంచు భావాన్ని ఒకే విధమైన భౌగోళిక రూపానికి పరిమితం చేయకుండా అందిస్తుంది.
- source_word: τὴν θάλασσαν
  choice: సముద్రంలోకి
  rationale: గ్రీకు θάλασσα యొక్క ప్రత్యక్ష అర్థాన్ని నిలుపుతుంది; భౌగోళిక వివరణగా ‘సరస్సు’ అని మార్చదు.
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: నీళ్లలో చనిపోయింది
  rationale: ‘నీళ్లలో చనిపోయాయి’ అనే మూలపాఠపు వాక్యార్థాన్ని నిలుపుతూ, ‘మంద’ అనే సమష్టి నామానికి అనుగుణంగా ఏకవచన క్రియను వాడుతుంది.
theological_decisions:
- issue: మంద మరణించిన విధానాన్ని ఎంత స్పష్టంగా పేర్కొనాలి
  choice: నీళ్లలో చనిపోయింది
  alternative: నీళ్లలో మునిగి చనిపోయింది
  rationale: సందర్భం మునిగి మరణించడాన్ని బలంగా సూచించినా, గ్రీకు పాఠం నేరుగా ‘నీళ్లలో చనిపోయాయి’ అని మాత్రమే చెబుతుంది. అందువల్ల ప్రధాన పాఠంలో అదనపు కారణాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఇదిగో’ ద్వారా మూలపాఠంలోని దృశ్యాత్మక ఉద్ఘాటన నిలుపబడింది. ‘సముద్రం’ అనే మూలపాఠ పదాన్ని భౌగోళికంగా ‘సరస్సు’ అని వివరణాత్మకంగా మార్చలేదు.
