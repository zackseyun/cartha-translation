id: MAT.8.7
reference: Matthew 8:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει ⸀αὐτῷ· Ἐγὼ ἐλθὼν θεραπεύσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: te
  text: అప్పుడు ఆయన అతనితో[a], “నేను వచ్చి అతన్ని స్వస్థపరుస్తాను” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను వచ్చి అతన్ని స్వస్థపరచాలా?” సందర్భాన్ని బట్టి కొందరు యేసు మాటలను ప్రశ్నగా గ్రహిస్తారు; అయితే గ్రీకు వాక్యనిర్మాణం సహజంగా ప్రకటనను సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: సాధారణ కథన అనుసంధానాన్ని తెలుగులో సహజంగా చూపుతుంది; ఇక్కడ బలమైన కారణార్థాన్ని చేర్చదు.
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో ఇది కథన వర్తమాన కాలమైనా, ఆధునిక తెలుగు కథనంలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: αὐτῷ
  choice: అతనితో
  rationale: λέγει తరువాతి దత్తివాచక పరోక్ష కర్మను తెలుగులో సహజమైన ‘అతనితో’గా వ్యక్తపరుస్తుంది.
- source_word: Ἐγὼ
  choice: నేను
  rationale: వ్యక్తమైన సర్వనామాన్ని నిలుపుతుంది; అవసరానికి మించిన ‘నేనే’ అనే బలాన్ని చేర్చదు.
- source_word: ἐλθὼν
  choice: వచ్చి
  rationale: ప్రధాన క్రియకు ముందున్న అనుబంధ చర్యను సహజంగా, క్రమాన్ని నిలుపుతూ తెలియజేస్తుంది.
- source_word: θεραπεύσω
  choice: స్వస్థపరుస్తాను
  rationale: రోగిని బాగుచేయడం అనే సందర్భార్థాన్ని గౌరవప్రదమైన, సాధారణ బైబిలు తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: αὐτόν
  choice: అతన్ని
  rationale: అనారోగ్యంతో ఉన్న సేవకుణ్ణి సూచించే ప్రత్యక్ష కర్మను సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: ఈ మాటను ప్రకటనగా అనువదించాలా, ప్రశ్నగా అనువదించాలా
  choice: 'ప్రకటన: “నేను వచ్చి అతన్ని స్వస్థపరుస్తాను.”'
  alternative: 'ప్రశ్న: “నేను వచ్చి అతన్ని స్వస్థపరచాలా?”'
  rationale: గ్రీకు పాఠ్యంలో ప్రశ్నార్థక అవ్యయం లేదు; పదనిర్మాణం సహజంగా ప్రకటనగానే చదవబడుతుంది. సందర్భాన్ని బట్టి కొందరు దీనిని ప్రశ్నగా గ్రహించినప్పటికీ, ఆ సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచడం మూలపాఠ్య ప్రాధాన్యాన్నీ నిజమైన వ్యాఖ్యాన భేదాన్నీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు కథన వర్తమానాన్ని తెలుగులో సహజమైన భూతకాలంతో అందించాం; ప్రత్యామ్నాయ ప్రశ్నార్థక పఠనాన్ని పాదటిప్పణిలో భద్రపరచాం.
