source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: te
  text: 'వారు వెళ్లిపోతుండగా, యేసు యోహాను గురించి జనసమూహాలతో ఇలా మాట్లాడడం మొదలుపెట్టాడు: “మీరు ఏమి చూడడానికి అరణ్యంలోకి వెళ్లారు? గాలికి ఊగుతున్న రెల్లునా?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గాలికి ఊగుతున్న రెల్లు అస్థిరతను లేదా మాటిమాటికి వైఖరి మార్చడాన్ని సూచించవచ్చు. యోహాను అలాంటి వ్యక్తి కాదనే సమాధానాన్ని యేసు ప్రశ్న ఆశిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: వారు వెళ్లిపోతుండగా
  rationale: ఇది సమకాలీనంగా జరుగుతున్న చర్యను తెలిపే genitive absolute. ముందున్న సందర్భంలో వీరు యోహాను శిష్యులు; తెలుగులో సహజంగా ఉండేందుకు ‘వారు’ అని ఉంచి, మూలంలో లేని వివరణను ప్రధాన వాక్యంలో చేర్చలేదు.
- source_word: ἤρξατο ... λέγειν
  choice: మాట్లాడడం మొదలుపెట్టాడు
  rationale: ἄρχομαι + infinitive నిర్మాణంలోని ‘మొదలుపెట్టాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῖς ὄχλοις
  choice: జనసమూహాలతో
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ, ప్రసంగ సందర్భానికి తగిన సహజ తెలుగు రూపం.
- source_word: περὶ Ἰωάννου
  choice: యోహాను గురించి
  rationale: περί + genitive ఇక్కడ చర్చావిషయాన్ని సూచిస్తుంది.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: మీరు ఏమి చూడడానికి అరణ్యంలోకి వెళ్లారు?
  rationale: τίని ‘ఏమి’గా నిలిపి, ‘ఎందుకు’గా మార్చలేదు. θεάομαιలోని ఉద్దేశపూర్వకంగా చూడడం అనే భావాన్ని తెలుగులో సహజమైన ‘చూడడానికి’ ద్వారా తెలిపింది.
- source_word: κάλαμον
  choice: రెల్లునా
  rationale: κάλαμοςకు ఈ దృశ్యంలో ‘రెల్లు’ సరైన సాధారణ అర్థం; ప్రశ్నార్థక ప్రత్యయం అలంకారిక ప్రశ్నను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: గాలికి ఊగుతున్న
  rationale: వర్తమాన కర్మణి participle సూచించే కొనసాగుతున్న కదలికను ‘ఊగుతున్న’ సహజంగా నిలుపుతుంది; గాలి కారణమని ‘గాలికి’ తెలియజేస్తుంది.
theological_decisions:
- issue: Τούτων (‘వీరు/వారు’) ఎవరిని సూచిస్తుంది
  choice: ప్రధాన వచనంలో ‘వారు’ అని అనువదించడం
  alternative: ‘యోహాను శిష్యులు’ అని స్పష్టీకరించడం
  rationale: ముందరి సందర్భం యోహాను శిష్యులను గుర్తిస్తుంది. అయితే మూలంలోని సూచనాత్మక సర్వనామాన్ని మించి ప్రధాన వచనంలో పేరు చేర్చకుండా, కథన సంబంధాన్ని అలాగే ఉంచడం సముచితం.
- issue: గాలికి ఊగుతున్న రెల్లు అనే రూపకం
  choice: రూపకాన్ని వివరణ లేకుండా ప్రధాన వచనంలో నిలుపడం; సూచిత భావాన్ని పాదసూచికలో పేర్కొనడం
  alternative: ‘అస్థిరమైన వ్యక్తి’ అని భావానువాదం చేయడం
  rationale: యేసు వేసిన అలంకారిక ప్రశ్నలోని దృశ్యరూపం మరియు పరోక్షమైన మూల్యాంకనం రెండింటినీ నిలుపుతుంది; యోహాను గురించి ప్రతికూల సమాధానమే ఆశించబడుతున్నా, దానిని వచనంలో ప్రత్యక్ష ప్రకటనగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అరణ్యం,’ ‘జనసమూహాలు,’ ‘రెల్లు’ వంటి సాధారణంగా అర్థమయ్యే పదాలను ఉపయోగించాం. మూలంలోని అలంకారిక ప్రశ్నను మరియు దాని సూచిత ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
