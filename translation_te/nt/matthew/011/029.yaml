revisions:
- from: నా కాడిని మీ మీద వేసుకొని, నా దగ్గర నేర్చుకోండి. ఎందుకంటే నేను సాత్వికుణ్ణి[a], హృదయంలో వినయంగలవాణ్ణి; అప్పుడు మీ ప్రాణాలకు విశ్రాంతి దొరుకుతుంది.
  to: నా కాడిని మీపై ఎత్తుకొని, నా నుండి నేర్చుకోండి. ఎందుకంటే నేను మృదుస్వభావిని[a], హృదయంలో వినయంగలవాణ్ణి; అప్పుడు మీ ప్రాణాలకు విశ్రాంతిని పొందుతారు.
  rationale: The revision directly renders learning ‘from’ Jesus, uses a primary Telugu term that better matches πραΰς, and makes the hearers’ future finding of rest explicit. It preserves the yoke metaphor, inward humility, and the traditional scriptural expression ‘ప్రాణాలకు విశ్రాంతి.’ The lexical-alternative footnote remains anchored to the relevant term.
  reviewer_model: gpt-5.6-terra
