review_pass:
  verdict: revise
  source_fidelity: The draft retains the central yoke metaphor and the promised rest, but “నా దగ్గర నేర్చుకోండి” can mean learning at Jesus’ location rather than learning from him, and “సాత్వికుణ్ణి” commonly carries moral/spiritual-purity associations beyond πραΰς. The future promise is more directly represented when the hearers explicitly ‘find’ or ‘obtain’ rest.
  naturalness: The current Telugu is generally understandable, but “మృదుస్వభావిని” is a more natural and semantically focused rendering for Jesus’ gentleness than “సాత్వికుణ్ణి.” “మీ ప్రాణాలకు విశ్రాంతిని పొందుతారు” clearly and naturally preserves the second-person future construction.
  terminology: ‘కాడి,’ ‘హృదయం,’ ‘వినయంగలవాణ్ణి,’ ‘ప్రాణాలు,’ and ‘విశ్రాంతి’ appropriately preserve the biblical imagery and register. The alternative ‘సాత్వికుణ్ణి’ may be retained in a footnote, but should not be the main rendering of πραΰς.
  issues:
  - severity: medium
    issue: “నా దగ్గర నేర్చుకోండి” is less precise for μάθετε ἀπ’ ἐμοῦ.
    rationale: ‘నా దగ్గర’ may primarily express location (‘at/near me’). ‘నా నుండి నేర్చుకోండి’ directly conveys learning from Jesus as the source and teacher.
  - severity: medium
    issue: “సాత్వికుణ్ణి” is not the best primary equivalent for πραΰς.
    rationale: In modern Telugu it can suggest sattvic moral or spiritual qualities, not specifically gentleness/non-harshness. ‘మృదుస్వభావిని’ more directly conveys the source sense without implying weakness.
  - severity: low
    issue: “విశ్రాంతి దొరుకుతుంది” leaves the future subject impersonal.
    rationale: The Greek explicitly promises that the hearers will find rest. ‘మీ ప్రాణాలకు విశ్రాంతిని పొందుతారు’ retains this personal future promise.
  revised_text: నా కాడిని మీపై ఎత్తుకొని, నా నుండి నేర్చుకోండి. ఎందుకంటే నేను మృదుస్వభావిని[a], హృదయంలో వినయంగలవాణ్ణి; అప్పుడు మీ ప్రాణాలకు విశ్రాంతిని పొందుతారు.
