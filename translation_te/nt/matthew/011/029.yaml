id: MAT.11.29
reference: Matthew 11:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: te
  text: నా కాడిని మీపై ఎత్తుకొని, నా నుండి నేర్చుకోండి. ఎందుకంటే నేను మృదుస్వభావిని[a], హృదయంలో వినయంగలవాణ్ణి; అప్పుడు మీ ప్రాణాలకు విశ్రాంతిని పొందుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సాత్వికుణ్ణి.”
    reason: πραΰςకు సందర్భానుసారంగా ‘సాత్వికుడు’ అనే ప్రత్యామ్నాయం ఉండవచ్చు; అయితే ప్రధాన పాఠంలోని ‘మృదుస్వభావి’ కఠినత్వం లేని సౌమ్యతను మరింత నేరుగా వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: నా కాడిని మీ మీద వేసుకొని
  rationale: కాడిని స్వీకరించి దాని కిందికి రావడం అనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది. ‘కాడి’ అనే స్పష్టమైన బింబాన్ని వ్యాఖ్యానంగా మార్చలేదు.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: నా దగ్గర నేర్చుకోండి
  rationale: యేసు నుండి నేర్చుకోవాలనే ఆజ్ఞను సహజమైన తెలుగులో తెలియజేస్తుంది; బోధనతో పాటు శిష్యరిక భావాన్నీ అనుమతిస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: యేసు దగ్గర నేర్చుకోవడానికి ఆయన స్వభావమే కారణమని తెలిపే వివరణాత్మక సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: πραΰς
  choice: సాత్వికుణ్ణి
  rationale: కఠినత్వం లేని మృదుత్వం, అదుపులో ఉన్న వినయం అనే సానుకూల భావాన్ని గౌరవప్రదమైన తెలుగు పదంతో వ్యక్తం చేస్తుంది.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: హృదయంలో వినయంగలవాణ్ణి
  rationale: ταπεινόςను ‘వినయం’గా, τῇ καρδίᾳను అంతరంగ స్వభావ సూచనగా రెండింటినీ స్పష్టంగా నిలుపుతుంది.
- source_word: εὑρήσετε ἀνάπαυσιν
  choice: విశ్రాంతి దొరుకుతుంది
  rationale: భవిష్యత్ వాగ్దానాన్ని సహజమైన తెలుగులో అందిస్తూ, లేఖనాల్లోని ‘విశ్రాంతి’ ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: మీ ప్రాణాలకు
  rationale: ψυχήని కేవలం శరీరానికి భిన్నమైన ‘ఆత్మ’గా సంకుచితం చేయకుండా, వ్యక్తి అంతరంగ జీవితం సహా సంపూర్ణ ప్రాణాన్ని సూచించే సంప్రదాయబద్ధమైన తెలుగు వ్యక్తీకరణను వాడుతుంది.
theological_decisions:
- issue: πραΰς καὶ ταπεινὸς τῇ καρδίᾳలో యేసు తన స్వభావాన్ని వర్ణించుకోవడం
  choice: నేను సాత్వికుణ్ణి, హృదయంలో వినయంగలవాణ్ణి
  alternative: నేను మృదుస్వభావిని, హృదయంలో దీనుణ్ణి
  rationale: ప్రధాన పాఠం యేసు మృదుత్వాన్నీ అంతరంగ వినయాన్నీ సమతుల్యంగా కాపాడుతుంది. ‘దీనుడు’ అనే ప్రత్యామ్నాయం పేదరికం లేదా దుస్థితి అనే అనవసర భావాన్ని కలిగించవచ్చు; అందువల్ల దానిని ప్రధాన పాఠంలో పెట్టలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖనోచిత గౌరవాన్ని నిలుపుతూ అనువదించబడింది. ‘కాడి,’ ‘హృదయం,’ ‘ప్రాణాలు,’ ‘విశ్రాంతి’ అనే మూల రూపకాలు, ప్రతిధ్వనులు నిలుపబడ్డాయి.
