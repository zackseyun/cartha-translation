id: MAT.11.17
reference: Matthew 11:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: te
  text: 'వారు ఇలా అంటారు: “మేము మీ కోసం వేణువు వాయించాం[a], కానీ మీరు నాట్యం చేయలేదు; మేము విలపించాం[b], కానీ మీరు రొమ్ములు బాదుకోలేదు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేము మీకు వేణువు వాయించాం.” గ్రీకు క్రియ ప్రత్యేకంగా వేణువు లేదా గొట్టపు వాయిద్యం వాయించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మేము శోకగీతం పాడాం” లేదా “మేము అంత్యక్రియల విలాపం చేశాం.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “మీరు మిమ్మల్ని మీరు కొట్టుకోలేదు.” రొమ్ములు బాదుకోవడం వంటి చర్యలు అప్పటి శోకాన్ని వ్యక్తం చేసే ఆచారాలు.
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: వారు ఇలా అంటారు
  rationale: వర్తమాన కాలంలోని గ్రీకు క్రియ ఉదాహరణలోని పిల్లల మాటను సజీవంగా పరిచయం చేస్తుంది; తెలుగు సాధారణ వర్తమాన కాలం దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ηὐλήσαμεν
  choice: మేము మీ కోసం వేణువు వాయించాం
  rationale: αὐλέω సాధారణంగా సంగీతం చేయడాన్ని కాకుండా వేణువు లేదా గొట్టపు వాయిద్యం వాయించడాన్ని ప్రత్యేకంగా సూచిస్తుంది. ‘మీ కోసం’ అనేది ὑμῖν‌లోని ఉద్దేశిత ప్రదర్శన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὠρχήσασθε
  choice: మీరు నాట్యం చేయలేదు
  rationale: ఈ మధ్యమ రూపానికి ఇక్కడ ప్రత్యేకమైన ఆత్మార్థక భావాన్ని చేర్చాల్సిన అవసరం లేదు; తెలుగులో ‘నాట్యం చేయడం’ సహజమైన సమానార్థకం.
- source_word: ἐθρηνήσαμεν
  choice: మేము శోకగీతం పాడాం
  rationale: θρηνέω శోకవిలాపాన్ని, ముఖ్యంగా మరణసంబంధమైన విలాపాన్ని సూచిస్తుంది. ‘శోకగీతం పాడాం’ మొదటి భాగంలోని సంగీత ప్రదర్శనతో ఉన్న సమాంతరతను నిలుపుతుంది.
- source_word: ἐκόψασθε
  choice: మీరు శోకంతో రొమ్ము కొట్టుకోలేదు
  rationale: κόπτω మధ్యమ రూపం ఇక్కడ దుఃఖంలో తనను తాను, ప్రత్యేకంగా రొమ్మును, కొట్టుకునే శోకాచారాన్ని సూచిస్తుంది. ప్రత్యక్ష శరీరచర్యను ఉంచడం మూలపాఠంలోని సాంస్కృతిక చిత్రాన్ని కాపాడుతుంది.
