  to: 'వారు ఇలా అంటారు: “మేము మీ కోసం వేణువు వాయించాం[a], కానీ మీరు నాట్యం చేయలేదు; మేము విలపించాం[b], కానీ మీరు రొమ్ములు బాదుకోలేదు[c].”'
