translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. పిల్లల ఆటలోని ఆనందకరమైన వేణువుకు, శోకగీతానికి మధ్య ఉన్న వ్యత్యాసం మరియు రెండు పాదాల సమాంతర నిర్మాణం నిలుపబడ్డాయి.
