review_pass:
  verdict: revise
  source_fidelity: The verse’s two-part complaint and its contrasts are retained. However, ἐθρηνήσαμεν primarily means “we lamented/wailed”; rendering it as singing a dirge is a plausible contextual interpretation but is more specific than the Greek verb itself. ἐκόψασθε denotes striking oneself in mourning; “రొమ్ములు బాదుకోలేదు” gives the customary Telugu idiom while retaining the concrete mourning gesture.
  naturalness: The draft is generally clear and modern. “రొమ్ము కొట్టుకోలేదు” is less idiomatic in Telugu than the customary plural expression “రొమ్ములు బాదుకోలేదు.”
  terminology: “వేణువు వాయించాం” and “నాట్యం చేయలేదు” are suitable modern-standard Telugu renderings. “విలపించాం” is the more source-close rendering for θρηνέω; the dirge/song nuance is retained in a footnote.
  issues:
  - severity: low
    issue: The main rendering “మేము శోకగీతం పాడాం” is more specific than ἐθρηνήσαμεν.
    rationale: The Greek verb denotes lamenting and need not intrinsically state that a song was sung. The funeral-dirge sense is contextually possible and can be noted.
  - severity: low
    issue: “రొమ్ము కొట్టుకోలేదు” is not the most natural Telugu idiom for the mourning gesture.
    rationale: “రొమ్ములు బాదుకోవడం” is idiomatic and communicates the reflexive striking action naturally.
  revised_text: 'వారు ఇలా అంటారు: “మేము మీ కోసం వేణువు వాయించాం[a], కానీ మీరు నాట్యం చేయలేదు; మేము విలపించాం[b], కానీ మీరు రొమ్ములు బాదుకోలేదు[c].”'
