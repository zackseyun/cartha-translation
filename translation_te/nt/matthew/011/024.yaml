id: MAT.11.24
reference: Matthew 11:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: te
  text: 'అయితే నేను నీతో చెబుతున్నాను: తీర్పు దినాన నీకంటే సొదొమ ప్రాంతానికి మరింత భరించదగినదిగా ఉంటుంది[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరింత సహించదగినదిగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: అయితే
  rationale: ముందటి ప్రకటనకు బలమైన వ్యతిరేకతను, తదుపరి గంభీరమైన మాటకు మార్పును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను నీతో చెబుతున్నాను
  rationale: గ్రీకులోని ప్రత్యక్ష సంబోధన సూత్రాన్ని సహజంగా నిలుపుతుంది; సందర్భంలో సంబోధించబడుతున్న పట్టణాన్ని సూచించే ఏకవచనాన్ని కాపాడుతుంది.
- source_word: γῇ Σοδόμων
  choice: సొదొమ ప్రాంతానికి
  rationale: γῇ అనే ‘దేశం/ప్రాంతం’ భావాన్ని విడిచిపెట్టకుండా, ఆధునిక తెలుగులో స్థలాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: ἀνεκτότερον
  choice: ఎక్కువగా భరించదగినదిగా
  rationale: తులనాత్మక రూపంలోని ‘మరింత భరించదగినది’ అనే భావాన్ని తీర్పు సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔσται
  choice: ఉంటుంది
  rationale: భవిష్యత్ కాలంలోని సాధారణ సంధాన క్రియను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: తీర్పు దినాన
  rationale: తీర్పు జరిగే దినాన్ని సూచించే కాలార్థక పదబంధాన్ని సంక్షిప్తంగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: ἢ σοί
  choice: నీకు కలిగేదానికంటే
  rationale: గ్రీకులోని ఏకవచన ప్రత్యక్ష సంబోధనను నిలుపుతూ, తెలుగులో తులన సహజంగా వినిపించేందుకు సందర్భంలో అంతర్భూతమైన ఫలితాన్ని ‘కలిగేది’ అని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఏకవచన σοί ఎవరిని సూచిస్తుంది
  choice: పట్టణాన్ని వ్యక్తిగా సంబోధిస్తున్నట్లుగా ‘నీకు’ అనే ఏకవచనాన్ని నిలుపుట
  alternative: ‘మీ ప్రజలకు’ అని బహువచనంగా విస్తరించడం
  rationale: గ్రీకు పాఠం ఏకవచనంలో ఉంది; పరిసర సందర్భంలోని పట్టణానికి చేయబడిన ప్రవచనాత్మక ప్రత్యక్ష సంబోధనను వ్యాఖ్యానాత్మకంగా విస్తరించకుండా కాపాడుతుంది.
- issue: తీర్పులో భరించదగినది ఏమిటన్న అంతర్భూత భావం
  choice: ‘నీకు కలిగేది… సొదొమ ప్రాంతానికి కలిగేది’ అని కనిష్ఠంగా పూరించడం
  alternative: ‘శిక్ష’ లేదా ‘గతి’ అని స్పష్టంగా పేర్కొనడం
  rationale: గ్రీకు పాఠంలో ‘శిక్ష’ లేదా ‘గతి’ అనే నామవాచకం లేదు. తెలుగులో వాక్యాన్ని సహజంగా చేయడానికి అవసరమైనంత మాత్రమే పూరించి, తీర్పు స్వరూపాన్ని అదనంగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన ప్రవచన స్వరాన్ని నిలుపుతూ అనువదించబడింది. ఏకవచన సంబోధనను అలాగే ఉంచి, మూలంలో లేని ‘శిక్ష’ వంటి వివరణాత్మక పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
