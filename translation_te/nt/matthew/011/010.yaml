id: MAT.11.10
reference: Matthew 11:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: te
  text: 'ఈయన గురించే ఇలా వ్రాయబడి ఉంది: “ఇదిగో, నేను నా దూతను నీ ముఖం ముందు[a] పంపుతున్నాను; అతడు నీ మార్గాన్ని నీ ముందు సిద్ధం చేస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సహజంగా, “నీకు ముందుగా.” గ్రీకు పాఠం లేఖన ఉల్లేఖనంలోని “నీ ముఖం ముందు” అనే స్పష్టమైన చిత్రణను నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός
  choice: ఈయన
  rationale: గుర్తింపును నొక్కిచెప్పే సూచక సర్వనామం. యోహానును గౌరవపూర్వకంగా సూచిస్తూ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది.
- source_word: περὶ οὗ
  choice: ఈయన గురించే
  rationale: περί + షష్ఠీ విభక్తి ఇచ్చే ‘ఎవరి గురించి’ అనే భావాన్ని, గ్రీకులోని ఉద్ఘాటనతో సహా సహజంగా తెలియజేస్తుంది.
- source_word: γέγραπται
  choice: వ్రాయబడి ఉంది
  rationale: లేఖన ఉల్లేఖనానికి వాడిన perfect passive రూపంలోని ఫలితస్థితి భావాన్ని నిలుపుతుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే ప్రవచనాత్మక ఉల్లేఖన సూత్రాన్ని గంభీరమైనప్పటికీ సులభమైన తెలుగులో అందిస్తుంది.
- source_word: ἀποστέλλω
  choice: పంపుతున్నాను
  rationale: వర్తమాన రూపంలోని సజీవతను, సందర్భంలోని సమీప భవిష్యత్తు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἄγγελόν
  choice: దూతను
  rationale: ἄγγελος యొక్క ‘సందేశం తీసుకువెళ్లేవాడు/దూత’ అనే అర్థాన్ని సంక్షిప్తంగా అందిస్తుంది; ఈ సందర్భంలో బాప్తిస్మమిచ్చే యోహాను అనే మానవ దూతను సూచిస్తుంది.
- source_word: πρὸ προσώπου σου
  choice: నీ ముఖానికి ముందుగా
  rationale: ‘నీ ముఖం ముందు’ అనే స్పష్టమైన గ్రీకు చిత్రణను, లేఖన ఉల్లేఖనంలోని నిర్మాణాన్ని నిలుపుతుంది.
- source_word: κατασκευάσει
  choice: సిద్ధం చేస్తాడు
  rationale: మార్గాన్ని ముందుగా తయారుచేయడం అనే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὴν ὁδόν σου
  choice: నీ మార్గాన్ని
  rationale: ὁδός లోని ప్రత్యక్షమైన దారి భావాన్నీ, రూపకాలంకార భావాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: ἔμπροσθέν σου
  choice: నీ ముందు
  rationale: ‘నీ ఎదుట/నీ ముందు’ అనే స్థానార్థాన్ని గంభీరమైన, సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: లేఖన ఉల్లేఖనంలో పునరుక్తంగా వచ్చిన రెండు స్థాన సూచక పదబంధాలు
  choice: ‘నీ ముఖానికి ముందుగా’ మరియు ‘నీ ముందు’ అనే రెండింటినీ ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: రెండింటినీ కలిపి ‘నీకు ముందుగా’ వంటి ఒక్క పదబంధంగా సరళీకరించడం
  rationale: గ్రీకు పాఠ్యంలో πρὸ προσώπου σου, ἔμπροσθέν σου అనే రెండు వేర్వేరు పదబంధాలు ఉన్నాయి. వాటిని రెండింటినీ ఉంచడం ఉల్లేఖనంలోని రూపాన్ని, ఉద్ఘాటనను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన లేఖన శైలి. ‘నీ ముఖానికి ముందుగా’ ఉద్దేశపూర్వకంగా కొంత సాక్షాత్కార చిత్రణను నిలుపుతుంది; దాని సహజ తెలుగు ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చబడింది.
