review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the Father’s handing over of ‘all things,’ the exclusive reciprocal knowledge of Father and Son, and the Son’s volitional revealing of the Father. However, ‘ఎరిగి ఉండరు’ is a stative/perfect-like formulation that does not naturally represent the Greek present ἐπιγινώσκει, and the final exception phrase is syntactically awkward in Telugu.
  naturalness: The repeated ‘తప్ప’ construction in the second clause, especially ‘ఎవరికి ... వారు తప్ప,’ is difficult to process. Recasting it as ‘కుమారుడు ఎవరికైతే ... బయలుపరచాలని కోరుకుంటాడో వారికి తప్ప’ gives a clear and natural modern-standard Telugu parallel.
  terminology: ‘తండ్రి,’ ‘కుమారుడు,’ ‘అప్పగించాడు,’ and ‘బయలుపరచు’ are appropriate. ‘తెలిసికొనరు’ is more idiomatic modern standard Telugu than ‘ఎరిగి ఉండరు’ while retaining the relational/cognitive sense without imposing ‘fully’ as an explicit intensifier.
  issues:
  - severity: medium
    issue: ‘ఎరిగి ఉండరు’ does not naturally render the present-tense knowledge assertion.
    rationale: The Greek has present ἐπιγινώσκει in both clauses. ‘ఎరుగరు’/‘తెలిసికొనరు’ better expresses the ongoing general assertion; ‘ఎరిగి ఉండరు’ can suggest a completed state of having come to know.
  - severity: medium
    issue: The final exception phrase is grammatically and rhetorically cumbersome.
    rationale: ‘కుమారుడు ఎవరికి తండ్రిని బయలుపరచాలని కోరుకుంటాడో వారు తప్ప’ mismatches the dative sense (‘to whom’) and creates a confusing double use of ‘తప్ప.’
  revised_text: సమస్తమూ నా తండ్రి నాకు అప్పగించాడు. తండ్రి తప్ప కుమారుణ్ణి ఎవరూ తెలిసికొనరు; అలాగే కుమారుడు తప్ప, కుమారుడు ఎవరికైతే తండ్రిని బయలుపరచాలని కోరుకుంటాడో వారికి తప్ప, తండ్రిని ఎవరూ తెలిసికొనరు.
  revised_footnotes: []
  revision_rationale: 'The revision preserves the Greek’s balanced exclusions and the implied object of ‘reveal’ (the Father), while using present-tense, modern Telugu wording and an unambiguous dative construction for ‘to whom.’ No Telugu footnotes are needed for this verse: the English audit trail’s lexical notes are not cleanly anchored and should not be transferred as though they were source-required notes.'
