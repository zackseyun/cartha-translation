id: MAT.11.27
reference: Matthew 11:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: te
  text: సమస్తమూ నా తండ్రి నాకు అప్పగించాడు. తండ్రి తప్ప కుమారుణ్ణి ఎవరూ తెలిసికొనరు; అలాగే కుమారుడు తప్ప, కుమారుడు ఎవరికైతే తండ్రిని బయలుపరచాలని కోరుకుంటాడో వారికి తప్ప, తండ్రిని ఎవరూ తెలిసికొనరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα
  choice: సమస్తమూ
  rationale: నపుంసక బహువచన రూపంలోని సమగ్ర పరిధిని సహజమైన, గంభీరమైన తెలుగులో తెలియజేస్తుంది; పరిధిని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: παρεδόθη
  choice: అప్పగించాడు
  rationale: గ్రీకులోని దైవకర్తృక భావాన్ని తెలుగులో సహజమైన కర్తరి వాక్యంగా మార్చి, తండ్రి నుండి కుమారునికి జరిగిన అప్పగింతను స్పష్టంగా ఉంచుతుంది.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: నా తండ్రి
  rationale: ప్రత్యేకమైన సంబంధపూర్వక దైవ బిరుదును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπιγινώσκει
  choice: ఎరిగి ఉండరు
  rationale: ఇక్కడ సందర్భం ప్రత్యేకమైన, లోతైన పరస్పర జ్ఞానాన్ని సూచించినా, మూలపదం తప్పనిసరిగా ‘పూర్తిగా’ అనే స్పష్టమైన తీవ్రతను జోడించదు. ‘ఎరిగి ఉండరు’ సాధారణ పరిచయానికి మించిన సంబంధజ్ఞానాన్ని సూచిస్తూ అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: τὸν υἱὸν
  choice: కుమారుణ్ణి
  rationale: తండ్రితో పరస్పర సంబంధంలో ఉన్న క్రీస్తుసంబంధ బిరుదును తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: నిషేధ వాక్యంలోని మినహాయింపును సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: కుమారుడు ఎవరికి తండ్రిని బయలుపరచాలని కోరుకుంటాడో వారు
  rationale: βούλομαι లోని సంకల్పం/ఇష్టం భావాన్ని ‘కోరుకుంటాడు’ ద్వారా నిలుపుతూ, వెల్లడికి కుమారుడే చొరవ తీసుకుంటాడనే భావాన్ని కాపాడుతుంది. అర్థస్పష్టత కోసం ἀποκαλύψαι యొక్క అంతర్భూత కర్మను ‘తండ్రిని’గా వ్యక్తపరచింది.
- source_word: ἀποκαλύψαι
  choice: బయలుపరచాలని
  rationale: దైవిక వెల్లడిని సూచించే స్థిరమైన, అర్థవంతమైన తెలుగు పదం; ‘తెలియజేయడం’ కంటే ఆవిష్కరణ భావాన్ని బలంగా నిలుపుతుంది.
theological_decisions:
- issue: ἐπιγινώσκω క్రియలో తీవ్రత
  choice: ‘ఎరిగి ఉండరు’ అని అనువదించడం
  alternative: ‘పూర్తిగా ఎరుగరు’ లేదా ‘తెలుసుకోరు’
  rationale: సందర్భం తండ్రి-కుమారుల ప్రత్యేక పరస్పర జ్ఞానాన్ని బలంగా సూచిస్తుంది. అయితే ἐπιγινώσκω అనే సంయుక్త క్రియ ప్రతి సందర్భంలోనూ ‘పూర్తిగా’ అనే తీవ్రతను తప్పనిసరిగా సంకేతం చేయదు. అందువల్ల ప్రత్యేకతను వాక్య నిర్మాణమే మోయనిచ్చి, అదనపు తీవ్రతను పాఠ్యంలో చేర్చలేదు.
- issue: βούληται లో కుమారుని సంకల్పం
  choice: ‘బయలుపరచాలని కోరుకుంటాడో’
  alternative: ‘బయలుపరచాలని నిర్ణయించుకుంటాడో’ లేదా ‘బయలుపరచడానికి ఇష్టపడతాడో’
  rationale: కుమారుని నిజమైన సంకల్పాన్నీ, వెల్లడిలో ఆయన చొరవనూ నిలుపుతుంది; అదే సమయంలో ఏ ప్రత్యేక మతశాఖ సిద్ధాంత భాషనూ దిగుమతి చేయదు.
- issue: వెల్లడి చేయబడే కర్మ
  choice: ‘తండ్రిని’ అని స్పష్టంగా పేర్కొనడం
  alternative: సందర్భం ద్వారా మాత్రమే అర్థమయ్యేలా కర్మను వదలివేయడం
  rationale: గ్రీకులో కర్మ సందర్భం నుండి గ్రహించబడుతుంది; దాని సూచ్యం తండ్రే. తెలుగులో అర్థం వెంటనే స్పష్టమయ్యేందుకు పేరును పునరుక్తి చేయడం అవసరమైన సహజీకరణ.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి అర్థమయ్యే శైలి. ‘ఎరుగుట’ రూపం సాధారణ ‘తెలుసుకోవడం’ కంటే సంబంధపూర్వక జ్ఞాన ఛాయను ఇస్తుంది; అతిగా ప్రాచీనంగా కాకుండా ఉండేందుకు వాక్య నిర్మాణం సరళంగా ఉంచబడింది. తెలుగు లిపిలో బిరుదులకు పెద్ద అక్షర భేదం లేకపోవడంతో ‘తండ్రి’, ‘కుమారుడు’ అనే సందర్భపూర్వక బిరుదులే ఉపయోగించబడ్డాయి.
