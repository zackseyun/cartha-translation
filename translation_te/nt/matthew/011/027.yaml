revisions:
- from: సమస్తమూ నా తండ్రి నాకు అప్పగించాడు. తండ్రి తప్ప కుమారుణ్ణి ఎవరూ ఎరిగి ఉండరు; అలాగే కుమారుడు తప్ప, కుమారుడు ఎవరికి తండ్రిని బయలుపరచాలని కోరుకుంటాడో వారు తప్ప, తండ్రిని ఎవరూ ఎరిగి ఉండరు.
  to: సమస్తమూ నా తండ్రి నాకు అప్పగించాడు. తండ్రి తప్ప కుమారుణ్ణి ఎవరూ తెలిసికొనరు; అలాగే కుమారుడు తప్ప, కుమారుడు ఎవరికైతే తండ్రిని బయలుపరచాలని కోరుకుంటాడో వారికి తప్ప, తండ్రిని ఎవరూ తెలిసికొనరు.
