id: MAT.11.25
reference: Matthew 11:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: te
  text: 'ఆ సమయంలో యేసు జవాబుగా ఇలా అన్నాడు: “తండ్రీ, ఆకాశానికీ భూమికీ ప్రభువా, నిన్ను స్తుతిస్తున్నాను[a], ఎందుకంటే నీవు ఈ సంగతులను జ్ఞానులకూ వివేకులకూ దాచిపెట్టి, చిన్నపిల్లలకు[b] వాటిని వెల్లడించావు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీకు కృతజ్ఞతలు తెలుపుతున్నాను.” గ్రీకు క్రియ స్తుతిని, కృతజ్ఞతను, లేదా బహిరంగ అంగీకారాన్ని వ్యక్తం చేయగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “శిశువులకు.” ఇక్కడ ఈ మాట వినయంగా లేదా బాలసహజ స్వీకారశీలతతో ఉన్నవారిని రూపకంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: ఆ సమయంలో
  rationale: కాలసూచనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, సందర్భానికి మించిన తక్షణత్వాన్ని చేర్చదు.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: ఇలా అన్నాడు
  rationale: ఇది సెమిటిక్ ప్రభావం గల గ్రీకు కథన సూత్రం. ఇక్కడ ప్రత్యక్ష ప్రశ్న లేనందున ‘జవాబిస్తూ అన్నాడు’ అనేది తెలుగులో అసహజంగా లేదా తప్పుదోవ పట్టించేలా ఉంటుంది; ‘ఇలా అన్నాడు’ దాని సంభాషణాత్మక కార్యాన్ని సహజంగా అందిస్తుంది.
- source_word: Ἐξομολογοῦμαί σοι
  choice: నిన్ను స్తుతిస్తున్నాను
  rationale: ఈ సందర్భంలో క్రియ బహిరంగ అంగీకారంతో కూడిన స్తుతి లేదా కృతజ్ఞతను సూచించగలదు. పాపాన్ని ఒప్పుకోవడం అనే అపార్థాన్ని నివారిస్తూ స్తుతి స్వరాన్ని నిలుపుతుంది; ‘నీకు కృతజ్ఞతలు తెలుపుతున్నాను’ కూడా సాధ్యమైన అర్థం.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: తండ్రీ, ఆకాశానికీ భూమికీ ప్రభువా
  rationale: రెండు సంబోధనలను, దేవుని సార్వభౌమాధికార భావాన్ని సహజమైన తెలుగు విభక్తులతో నిలుపుతుంది.
- source_word: ὅτι
  choice: వెల్లడించినందుకు
  rationale: స్తుతికి కారణాన్ని తెలిపే గ్రీకు సంబంధాన్ని తెలుగులో కారణార్థక నిర్మాణంతో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἔκρυψας
  choice: దాచిపెట్టి
  rationale: దేవుడే కర్తగా ఉన్న ప్రత్యక్ష సకర్మక భావాన్ని మృదువుపరచకుండా నిలుపుతుంది.
- source_word: ταῦτα ... αὐτά
  choice: ఈ సంగతులను ... వాటిని
  rationale: సందర్భంలోని విషయాలు లేదా వాస్తవాలు ఏమిటన్న సూచనాత్మక విస్తృతిని అలాగే ఉంచుతుంది.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: జ్ఞానులకూ వివేకులకూ
  rationale: σοφῶν మరియు συνετῶν మధ్య ఉన్న జ్ఞానం, గ్రహణశక్తి/వివేచన అనే జత భావాలను సంక్షిప్తంగా నిలుపుతుంది. తెలుగు ‘దాచు’ క్రియతో సహజంగా వచ్చే సంప్రదాన విభక్తి మూలంలోని ἀπό సంబంధాన్ని సందర్భానుసారంగా అందిస్తుంది.
- source_word: ἀπεκάλυψας
  choice: వెల్లడించిన
  rationale: దైవికంగా మరుగులో ఉన్నదాన్ని తెలియజేయడం అనే ἀποκαλύπτω యొక్క సాధారణ భావాన్ని కాపాడుతుంది.
- source_word: νηπίοις
  choice: చిన్నపిల్లలకు
  rationale: పదంలోని బాల్య చిత్రాన్ని నిలుపుతూ, ‘శిశువులు’ అనే మరింత కఠిన అక్షరార్థం కలిగించే పరిమితిని నివారిస్తుంది; సందర్భంలో రూపకాలంకార భావం ఉండవచ్చు.
theological_decisions:
- issue: దాచడంలోను వెల్లడించడంలోను దేవుని ప్రత్యక్ష క్రియాశీలత
  choice: ‘దాచిపెట్టి ... వెల్లడించిన’ అని తండ్రికే ప్రత్యక్షంగా ఆపాదించడం
  alternative: ‘దాగి ఉండనిచ్చి’ వంటి అనుమతార్థక భాషతో మృదువుపరచడం
  rationale: గ్రీకులో దేవుడు కర్తగా ఉన్న ప్రత్యక్ష కర్తరి క్రియలు ఉన్నాయి. ముందస్తు నిర్ణయం లేదా న్యాయతీర్పుగా కఠినపరచడం వంటి విస్తృత సిద్ధాంతాన్ని చేర్చకుండా, వాక్యంలోని తాత్త్విక ఉద్వేగాన్ని నిలుపుతుంది.
- issue: νηπίοις యొక్క భావం
  choice: ‘చిన్నపిల్లలకు’ అని రూపక చిత్రాన్ని నిలుపడం
  alternative: అక్షరార్థంగా ‘శిశువులకు’ లేదా వివరణాత్మకంగా ‘వినయస్థులకు’
  rationale: సందర్భం బాలసహజ స్వీకారశీలతను సూచించవచ్చుగానీ, మూలం ‘వినయస్థులు’ అనే అమూర్త వర్గాన్ని నేరుగా చెప్పదు. అందువల్ల చిత్రాన్ని అనువదించి వ్యాఖ్యానాన్ని పాదసూచికకు పరిమితం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఆకాశానికీ భూమికీ ప్రభువా’ అనే సంబోధన బైబిలు గంభీరతను నిలుపుతుంది. పాదసూచిక గుర్తులు [a], [b] ప్రధాన పాఠ్యంలో సంబంధిత భావాల అనంతరం ఉంచబడ్డాయి.
