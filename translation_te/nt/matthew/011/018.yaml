- from: ఎందుకంటే యోహాను తినకుండానూ తాగకుండానూ వచ్చాడు; వారు, “అతనికి దయ్యం ఉంది[a]” అంటున్నారు.
  to: 'ఎందుకంటే యోహాను తినడమూ తాగడమూ చేయకుండా వచ్చాడు; వారు ఇలా అంటున్నారు: “అతనిలో దయ్యం ఉంది[a].”'
  rationale: The revision preserves every source-level element and the English audit trail while improving modern Telugu idiom. ‘తినడమూ తాగడమూ చేయకుండా’ retains the paired negated participial description without adding unstated dietary details. The revised accusation remains reported speech, not a narrator’s affirmation; its footnote retains both the literal Greek wording and the idiomatic alternative.
