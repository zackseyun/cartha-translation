id: MAT.11.18
reference: Matthew 11:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: te
  text: 'ఎందుకంటే యోహాను తినడమూ తాగడమూ చేయకుండా వచ్చాడు; వారు ఇలా అంటున్నారు: “అతనిలో దయ్యం ఉంది[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతనికి దయ్యం పట్టింది.” గ్రీకులో అక్షరార్థంగా, “అతనికి దయ్యం ఉంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: వచ్చాడు
  rationale: ἔρχομαι యొక్క భూతకాల రూపం ఇక్కడ యోహాను ప్రజల మధ్యకు రావడాన్ని సూచిస్తుంది; ‘వచ్చాడు’ సహజంగానూ మూలానికి దగ్గరగానూ ఉంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందరి వాక్యానికి ఈ వాక్యం వివరణను ఇస్తున్న సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἰωάννης
  choice: యోహాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం; సందర్భంలో బాప్తిస్మమిచ్చే యోహానును సూచిస్తుంది.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: తినకుండానూ తాగకుండానూ
  rationale: μήτε...μήτε అనే జత నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది. ఈ వచనంలో లేని ‘రొట్టె,’ ‘ద్రాక్షారసం’ వంటి వివరాలను చేర్చదు; యోహాను పాటించిన విరక్త జీవనరీతిని సంక్షిప్తంగానే ఉంచుతుంది.
- source_word: καὶ λέγουσιν
  choice: వారు … అంటున్నారు
  rationale: λέγουσιν లోని వర్తమానకాల, సాధారణీకరణ భావాన్ని ‘అంటున్నారు’ నిలుపుతుంది. కర్తను మరింత నిర్దిష్టంగా చేయకుండా గ్రీకులోని ‘వారు’ అనే అనిర్దిష్ట సూచనను కాపాడుతుంది; తెలుగు వాక్యనిర్మాణం కోసం ఉద్ధరణ చుట్టూ సహజంగా అమర్చబడింది.
- source_word: Δαιμόνιον ἔχει
  choice: అతనికి దయ్యం ఉంది
  rationale: గ్రీకు వ్యక్తీకరణను సమీపంగా ప్రతిబింబిస్తూ, ఇది యోహానుపై ఇతరులు చేసిన ఆరోపణ అని స్పష్టంగా ఉంచుతుంది. δαιμόνιον ను διάβολος తో కలపకుండా ‘దయ్యం’గా అనువదించింది.
theological_decisions:
- issue: δαιμόνιον ἔχει అనే ఆరోపణను ఎలా వ్యక్తపరచాలి
  choice: అతనికి దయ్యం ఉంది
  alternative: అతనికి దయ్యం పట్టింది
  rationale: మూలంలోని ‘దయ్యాన్ని కలిగి ఉన్నాడు’ అనే నిర్మాణానికి ప్రధాన పాఠం దగ్గరగా ఉంటుంది. ఇది రచయిత నిర్ధారణ కాదు, యోహానుపై ‘వారు’ చేసిన ఆరోపణ అనే భేదాన్ని ఉద్ధరణ స్పష్టంగా కాపాడుతుంది; మరింత వ్యాఖ్యానాత్మకమైన సహజ తెలుగు రూపాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘తినకుండానూ తాగకుండానూ’ అనే జత రూపం మూలంలోని సంక్షిప్తతను నిలుపుతుంది; విరామచిహ్నాలు ఉద్ధరించిన ఆరోపణను కథకుని స్వరంనుంచి వేరు చేస్తాయి.
