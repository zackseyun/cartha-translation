  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: te
  text: 'యేసు వారికి జవాబిచ్చాడు[a]: “మీరు వెళ్లి, మీరు వింటున్నదీ చూస్తున్నదీ యోహానుకు తెలియజేయండి:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “యేసు వారికి జవాబిచ్చి ఇలా అన్నాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: వాక్యారంభంలోని καί కథన కొనసాగింపును సూచిస్తుంది. ఆధునిక తెలుగులో ఇక్కడ ప్రత్యేకంగా ‘మరియు’ అని పెట్టడం అసహజంగా ఉండేందున, వాక్యక్రమం ద్వారానే కొనసాగింపు భావాన్ని వ్యక్తం చేశాం.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: వారికి జవాబిచ్చాడు
  rationale: గ్రీకు కథనంలోని ‘జవాబిచ్చి ... అన్నాడు’ అనే సంయుక్త ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది; మాటల పరిచయం తరువాతి ప్రత్యక్ష ఉద్ధరణ ద్వారా స్పష్టంగా ఉంది.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: తెలుగులో స్థిరపడిన పేరురూపాన్ని ఉపయోగించాం; గ్రీకు నిర్దిష్ట ఉపపదాన్ని పేరుతో విడిగా అనువదించాల్సిన అవసరం లేదు.
- source_word: Πορευθέντες
  choice: మీరు వెళ్లి
  rationale: ఆజ్ఞకు అనుబంధంగా ఉన్న ఈ కృదంతం వరుస చర్యతో కూడిన ఆజ్ఞార్థాన్ని ఇస్తుంది. ‘వెళ్లి ... తెలియజేయండి’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: ἀπαγγείλατε
  choice: తెలియజేయండి
  rationale: చూసినదీ విన్నదీ తిరిగి యోహానుకు నివేదించాలనే భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: Ἰωάννῃ
  choice: యోహానుకు
  rationale: దత్తి విభక్తిలో ఉన్న పరోక్ష కర్మను తెలుగులో ‘-కు’తో వ్యక్తం చేశాం; ‘యోహాను’ స్థిరపడిన తెలుగు పేరురూపం.
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: వింటున్నవాటినీ చూస్తున్నవాటినీ
  rationale: వర్తమానకాల క్రియలు వారి ప్రస్తుత అనుభవాన్ని సూచిస్తాయి. జతచేసిన ‘-నీ ... -నీ’ రూపం రెండు పరిశీలన మార్గాలనూ సమానంగా ఉంచుతుంది.
theological_decisions:
- issue: ἀποκριθεὶς ... εἶπεν అనే కథన సూత్రప్రయోగం
  choice: యేసు వారికి జవాబిచ్చాడు
  alternative: యేసు వారికి జవాబిచ్చి ఇలా అన్నాడు
  rationale: ఇది సిద్ధాంత సంబంధమైనది కాక శైలీ సంబంధమైన నిర్ణయం. సంక్షిప్త రూపం సహజమైన ఆధునిక తెలుగును ఇస్తుంది; పూర్తి గ్రీకు నిర్మాణాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలరూపం కూడా కనిపించేలా చేశాం.
