  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కానీ సులభంగా అర్థమయ్యే శైలిని అనుసరించాం. ప్రత్యక్ష ఆజ్ఞలో బహువచన గౌరవ/సమూహ రూపమైన ‘వెళ్లి ... తెలియజేయండి’ వాడాం.
