  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: te
  text: మీరు దీన్ని అంగీకరించడానికి సిద్ధంగా ఉంటే[a], రాబోవలసిన ఏలీయా ఇతడే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘మీరు దీన్ని స్వీకరించడానికి సిద్ధంగా ఉంటే.’'
    reason: lexical_alternative
  - marker: b
    text: అంటే, బాప్తిస్మమిచ్చే యోహాను వాగ్దానం చేయబడిన రాబోవలసిన ఏలీయాగా గుర్తించబడుతున్నాడు. మలాకీ 4:5; మత్తయి 17:10–13 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ εἰ θέλετε δέξασθαι
  choice: మీరు దీన్ని అంగీకరించడానికి సిద్ధంగా ఉంటే
  rationale: θέλετε + δέξασθαι కేవలం కోరికను కాక, స్వీకరించడానికి లేదా అంగీకరించడానికి ఉన్న సమ్మతిని సూచిస్తుంది. గ్రీకులో కర్మ స్పష్టంగా లేకపోయినా, తెలుగులో సహజత కోసం సందర్భసూచకమైన ‘దీన్ని’ చేర్చబడింది.
- source_word: αὐτός
  choice: ఇతడే
  rationale: ఇది బాప్తిస్మమిచ్చే యోహానును సూచిస్తుంది. ‘ఇతడే’ సహజమైన తెలుగులో సర్వనామంలోని సాధ్యమైన ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἐστιν Ἠλίας
  choice: ఏలీయా
  rationale: గ్రీకు వాక్యం యోహానును ఏలీయాగా నేరుగా గుర్తిస్తుంది; దాన్ని ‘ఏలీయావంటివాడు’ లేదా ‘ఏలీయా పాత్రను నెరవేర్చేవాడు’ అని సడలించలేదు.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: రాబోవలసిన
  rationale: భవిష్యద్వాణిలో ఎదురుచూసిన వ్యక్తి అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది; తక్షణ సమీప భవిష్యత్తు అని అనవసరంగా నిర్ధారించదు.
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఈ వచనాన్ని స్వతంత్రంగా చదివినప్పుడు ప్రారంభ ‘మరియు’ ఆధునిక తెలుగులో కృత్రిమంగా ఉంటుంది; ముందరి సందర్భంతో అనుసంధానం షరతు వాక్య నిర్మాణంలోనే సహజంగా కొనసాగుతుంది.
theological_decisions:
- issue: బాప్తిస్మమిచ్చే యోహాను ఏలీయా అనే గుర్తింపు
  choice: ‘రాబోవలసిన ఏలీయా ఇతడే’ అని నేరుగా అనువదించడం
  alternative: ‘ఇతడు ఏలీయా పాత్రను నెరవేర్చేవాడు’ లేదా ‘ఇతడు ఏలీయావంటివాడు’
  rationale: αὐτός ἐστιν Ἠλίας అనే గ్రీకు నేరుగా గుర్తింపును ప్రకటిస్తుంది; అదే సమయంలో ‘మీరు... సిద్ధంగా ఉంటే’ అనే షరతుతో శ్రోతల స్వీకారాన్ని ప్రస్తావిస్తుంది. ఈ గుర్తింపు ఇతర వచనాలతో ఎలా సమన్వయమవుతుందో అనువాదంలోనే పరిష్కరించకుండా, మూలంలోని ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘అంగీకరించడానికి సిద్ధంగా ఉంటే’ సమ్మతి/స్వీకార భావాన్ని అందిస్తుంది. ‘ఇతడే’ గుర్తింపు బలాన్ని నిలుపుతుంది; పాదసూచికలు [a], [b] ప్రధాన పాఠ్యంలో రెండూ ఉంచబడ్డాయి.
