  edition: SBLGNT
  text: πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: te
  text: ఎందుకంటే ప్రవక్తలందరూ, ధర్మశాస్త్రమూ యోహాను వరకు[a] ప్రవచించాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యోహాను దాకా,” లేదా “యోహాను కాలం వరకు.” ఈ మాట యోహానును ప్రవచన సాక్ష్యపు పరాకాష్ఠగా చూపవచ్చు; లేదా ఆ సాక్ష్యం మారే సరిహద్దుగా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: అందరూ
  rationale: οἱ προφῆταιతో కలిసి ప్రవక్తల సమూహమంతటినీ సూచిస్తుంది; తెలుగులో ‘ప్రవక్తలందరూ’ సహజమైన సమష్టి ప్రయోగం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న మాటకు వివరణ లేదా ఆధారం అందించే అనుసంధాన బలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οἱ προφῆται
  choice: ప్రవక్తలు
  rationale: దేవుని తరఫున ప్రవచనాత్మకంగా మాట్లాడినవారికి ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: ὁ νόμος
  choice: ధర్మశాస్త్రం
  rationale: సాధారణ నియమాన్ని కాక, ఇశ్రాయేలు లేఖన సంపుటిలోని తోరా/మోషే ధర్మశాస్త్రాన్ని సూచించే స్థిరమైన తెలుగు బైబిలు పదం.
- source_word: ἕως Ἰωάννου
  choice: యోహాను వరకు
  rationale: కాలపరమైన హద్దును సంక్షిప్తంగా తెలియజేస్తూ, యోహాను ప్రవచన సాక్ష్యానికి పరాకాష్ఠనా లేక మార్పును సూచించే సరిహద్దా అనే అస్పష్టతను నిలుపుతుంది.
- source_word: ἐπροφήτευσαν
  choice: ప్రవచించాయి
  rationale: గ్రీకు క్రియ యొక్క ప్రత్యక్ష భావాన్ని నిలుపుతుంది. ‘ప్రవక్తలందరూ, ధర్మశాస్త్రం’ అనే సంయుక్త కర్తలో చివరి పదమైన నపుంసక ఏకవచన ‘ధర్మశాస్త్రం’కు అనుగుణంగా తెలుగు క్రియను వాడినా, అది రెండింటికీ వర్తిస్తుంది; ధర్మశాస్త్రానికీ ప్రవచన సాక్ష్యాన్ని ఆపాదించే వ్యక్తీకరణను కాపాడుతుంది.
theological_decisions:
- issue: ὁ νόμος సాధారణ చట్టాన్ని సూచిస్తుందా, లేఖన సంపుటిగా తోరాను సూచిస్తుందా
  choice: ధర్మశాస్త్రం
  alternative: చట్టం / నియమం
  rationale: ‘ప్రవక్తలు మరియు ధర్మశాస్త్రం’ అనే జోడింపు ఇశ్రాయేలు లేఖన సాక్ష్యాన్ని సూచిస్తుంది. ‘ధర్మశాస్త్రం’ ఈ గ్రంథసంబంధ భావాన్ని అదనపు సిద్ధాంతాన్ని చేర్చకుండా తెలియజేస్తుంది.
- issue: ἕως Ἰωάννουలో యోహాను ప్రవచన యుగంలో చేర్చబడ్డాడా, లేక దాని అంత్యసరిహద్దుగా మాత్రమే ఉన్నాడా
  choice: యోహాను వరకు
  alternative: యోహాను కాలం వరకు / యోహాను దాకా
  rationale: మూల గ్రీకు ఈ వ్యాఖ్యాన ప్రశ్నను పూర్తిగా పరిష్కరించదు. ‘యోహాను వరకు’ కాలహద్దును నిలుపుతూ, యోహాను పరాకాష్ఠనా లేక మార్పు సరిహద్దా అనే theological tension‌ను బలవంతంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘ధర్మశాస్త్రం’ అనే స్థిరమైన లేఖనపదాన్ని ఉంచి, మూలంలోని వ్యక్తీకరణను మరియు ‘యోహాను వరకు’ అనే ఉద్దేశపూర్వక అస్పష్టతను కాపాడింది.
