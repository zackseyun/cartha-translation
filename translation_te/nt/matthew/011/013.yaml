    reason: alternative_reading
  revision_rationale: The revision removes the potentially emphatic additive ‘కూడా’ and uses ‘ధర్మశాస్త్రమూ’ to convey the Greek coordination, ‘the prophets and the Law.’ It preserves the personification in ‘ప్రవచించాయి,’ the recognized-scriptural sense of ‘ధర్మశాస్త్రం,’ and the unresolved scope of ‘until John.’ The footnote is retained with a minor idiomatic refinement only.
