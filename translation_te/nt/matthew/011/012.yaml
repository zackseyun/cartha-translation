id: MAT.11.12
reference: Matthew 11:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: te
  text: అయితే బాప్తిస్మమిచ్చే యోహాను రోజులనుంచి ఇప్పటివరకు[a] పరలోక రాజ్యం హింసకు గురవుతోంది; హింసాత్ములు దాన్ని బలవంతంగా చేజిక్కించుకుంటున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోక రాజ్యం బలంగా ముందుకు సాగుతోంది; బలప్రయోగం చేసేవారు దాన్ని చేజిక్కించుకుంటున్నారు.” “హింసకు గురవుతోంది” అని అనువదించిన గ్రీకు క్రియను మధ్యమ భావంలో కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: అయితే … రోజులనుంచి
  rationale: ἀπό సూచించే ఆరంభ బిందువును ‘నుంచి’ తెలియజేస్తుంది; δέ లోని స్వల్ప సంధి లేదా వ్యత్యాస భావాన్ని ‘అయితే’ సహజంగా అందిస్తుంది.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: బాప్తిస్మమిచ్చే యోహాను రోజులు
  rationale: ‘రోజులు’ అనే గ్రీకు కాలసూచక నుడికారాన్ని నిలుపుతూ, ὁ βαπτιστήςను ఆధునిక పాఠకులకు స్పష్టమైన క్రియాత్మక రూపంలో అందిస్తుంది.
- source_word: ἕως ἄρτι
  choice: ఇప్పటివరకు
  rationale: యోహాను రోజులనుంచి యేసు మాట్లాడుతున్న ప్రస్తుత క్షణం వరకు కొనసాగిన కాలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి సువార్తకు ప్రత్యేకమైన ఈ పదబంధాన్ని తెలుగులో స్థిరపడిన, సహజమైన రూపంలో అందిస్తుంది; రాజ్యం లేదా పరిపాలన అనే భావవ్యాప్తిని అనవసరంగా కుదించదు.
- source_word: βιάζεται
  choice: హింసకు గురవుతోంది
  rationale: మధ్యమ/కర్మణి రూపంలోని ప్రసిద్ధ ద్వంద్వార్థంలో ప్రధాన పాఠం కర్మణి భావాన్ని స్వీకరిస్తుంది. తరువాత వచ్చే హింసాత్ములు దాన్ని చేజిక్కించుకోవడం అనే వాక్యభాగంతో ఇది సహజంగా సరిపోతుంది; మధ్యమ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: βιασταὶ
  choice: హింసాత్ములైన మనుషులు
  rationale: బలప్రయోగం లేదా హింస చేసే వ్యక్తులను సూచించే నామవాచక భావాన్ని, అలాగే గ్రీకు పురుషలింగ బహువచన రూపాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: ἁρπάζουσιν αὐτήν
  choice: దాన్ని బలవంతంగా చేజిక్కించుకుంటున్నారు
  rationale: ἁρπάζωలోని బలవంతంగా పట్టుకోవడం లేదా లాక్కోవడం అనే తీవ్ర భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: రాజ్యానికి సంబంధించి βιάζεται అర్థం
  choice: 'ప్రధాన పాఠంలో కర్మణి భావం: ‘పరలోక రాజ్యం హింసకు గురవుతోంది’'
  alternative: 'మధ్యమ/అకర్మక భావం: ‘పరలోక రాజ్యం బలంగా ముందుకు సాగుతోంది’'
  rationale: గ్రీకు రూపం నిజమైన వ్యాఖ్యాన ద్వంద్వార్థాన్ని కలిగి ఉంది. వెంటనే వచ్చే ‘హింసాత్ములైన మనుషులు దాన్ని బలవంతంగా చేజిక్కించుకుంటున్నారు’ అనే మాటలతో కర్మణి భావం బాగా సరిపోతుంది; అయినా మధ్యమ భావానికి కూడా బలమైన భాషాపరమైన ఆధారం ఉన్నందున దాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్య గాంభీర్యం మరియు మూలంలోని వ్యాఖ్యాన ద్వంద్వార్థం నిలిచేలా రూపొందించబడింది.
