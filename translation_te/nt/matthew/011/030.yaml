id: MAT.11.30
reference: Matthew 11:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ ζυγός μου χρηστὸς καὶ τὸ φορτίον μου ἐλαφρόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: te
  text: ఎందుకంటే నా కాడి మేలైనది[a], నా భారం తేలికైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనుకూలమైనది” లేదా “సులభమైనది.”
    reason: χρηστός పదంలో ఉన్న హితకరమైన, అనుకూలమైన, సులభమైన అనే సందర్భానుగుణ భావసాధ్యతలను సూచించడానికి.
lexical_decisions:
- source_word: ζυγός
  choice: కాడి
  rationale: యేసు శిష్యత్వానికి సంబంధించిన అధికారమూ బాధ్యతనూ సూచించే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: χρηστός
  choice: దయగలది
  rationale: ఈ పదానికి ‘సులభమైనది’ అనే భావం ఉండగలిగినా, ప్రధానంగా దయ, మేలు, అనుకూలత అనే గుణాన్ని తెలియజేస్తుంది; కాబట్టి ‘kind’ అనే సవరించిన సంప్రదింపుల పాఠానికీ దగ్గరగా ఉంటుంది.
- source_word: φορτίον
  choice: భారం
  rationale: మోయవలసిన బరువు లేదా అప్పగించబడిన బాధ్యత అనే మూలార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐλαφρόν
  choice: తేలికైనది
  rationale: భారంగా లేకపోవడాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: χρηστόςను సౌలభ్యంగా అర్థం చేసుకోవాలా, దయగల గుణంగా అర్థం చేసుకోవాలా
  choice: దయగలది
  alternative: సులభమైనది / అనుకూలమైనది
  rationale: ‘సులభమైనది’ అని మాత్రమే అనువదిస్తే శిష్యత్వానికి కష్టమే ఉండదనే భావం రావచ్చు. ‘దయగలది’ యేసు కాడి స్వభావాన్ని తెలిపి, మూలపదంలోని నైతిక-సంబంధ భావాన్ని కాపాడుతుంది; అయితే ఇతర అర్థసాధ్యతను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; మూలంలోని కాడి-భారం రూపకాన్ని అలాగే ఉంచి, సంక్షిప్తమైన మరియు గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది.
