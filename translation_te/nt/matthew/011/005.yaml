id: MAT.11.5
reference: Matthew 11:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: te
  text: గుడ్డివారు చూపు పొందుతున్నారు, కుంటివారు నడుస్తున్నారు; కుష్ఠరోగులు శుద్ధులవుతున్నారు, చెవిటివారు వింటున్నారు; మృతులు లేపబడుతున్నారు, పేదవారికి శుభవార్త ప్రకటించబడుతోంది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “పేదవారికి సువార్త బోధించబడుతోంది.” గ్రీకు క్రియ కర్మణి రూపంలో ఉంది: పేదవారు శుభవార్తను అందుకునేవారు.'
    reason: lexical_alternative
  - marker: b
    text: ఈ జాబితా యెషయా 35:5–6; 61:1లను ప్రతిధ్వనింపజేస్తూ, మెస్సీయ కార్యంతో ముడిపడిన సూచనలను చూపిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: τυφλοὶ
  choice: గుడ్డివారు
  rationale: నామవాచకంగా వాడిన విశేషణాన్ని వ్యక్తుల వర్గంగా సహజమైన, సంక్షిప్తమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀναβλέπουσιν
  choice: చూపు పొందుతున్నారు
  rationale: స్వస్థపరిచే సందర్భంలో కేవలం ‘పైకి చూడడం’ కాక చూపు కలగడం లేదా తిరిగి రావడం అనే అర్థాన్ని తెలియజేస్తుంది; చూపు ఇంతకు ముందు ఉందో లేదో అనవసరంగా నిర్ణయించదు.
- source_word: χωλοὶ
  choice: కుంటివారు
  rationale: సరిగా నడవలేని వారిని సూచించే గ్రీకు పదానికి సంక్షిప్తమైన, సాధారణ తెలుగు సమానం.
- source_word: περιπατοῦσιν
  choice: నడుస్తున్నారు
  rationale: గ్రీకు వర్తమాన కాలాన్నీ, అద్భుత కార్యాల జాబితాలోని సూటి శైలినీ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: λεπροὶ
  choice: కుష్ఠరోగులు
  rationale: ప్రాచీన వ్యాధి వర్గాలు ఆధునిక వైద్య నిర్ధారణలతో పూర్తిగా సమానం కాకపోయినా, సువార్తల సందర్భంలో సంప్రదాయంగా గుర్తించబడే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: καθαρίζονται
  choice: శుద్ధులవుతున్నారు
  rationale: ‘స్వస్థపడుతున్నారు’ కంటే శారీరక పునరుద్ధరణతోపాటు శుద్ధతకు సంబంధించిన భావాన్ని కూడా నిలుపుతుంది.
- source_word: κωφοὶ
  choice: చెవిటివారు
  rationale: κωφός చెవిటి లేదా మూగ అనే అర్థాలు కలిగి ఉండవచ్చు; అయితే ‘వింటున్నారు’ అనే క్రియతో జతకావడం వల్ల ఇక్కడ చెవిటివారే ఉద్దేశం.
- source_word: ἀκούουσιν
  choice: వింటున్నారు
  rationale: పునరుద్ధరించబడిన సామర్థ్యాన్ని సూటిగా తెలిపి గ్రీకు వర్తమాన రూపానికి సరిపోతుంది.
- source_word: νεκροὶ
  choice: మృతులు
  rationale: చనిపోయిన వ్యక్తులను సూచించే నామవాచక విశేషణానికి గంభీరమైన, సహజమైన తెలుగు రూపం.
- source_word: ἐγείρονται
  choice: లేపబడుతున్నారు
  rationale: కర్త ఎవరో వచనంలో చేర్చకుండా గ్రీకు కర్మణి రూపాన్నీ, మృతులపై జరిగే కార్యాన్నీ నిలుపుతుంది.
- source_word: πτωχοὶ
  choice: పేదవారు
  rationale: ఆర్థికంగా, సామాజికంగా పేదవారనే ప్రాథమిక అర్థాన్నీ యెషయా గ్రంథంలోని ప్రతిధ్వనినీ అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: εὐαγγελίζονται
  choice: పేదవారికి శుభవార్త ప్రకటించబడుతోంది
  rationale: గ్రీకు కర్మణి భావంలో పేదవారు శుభవార్తను అందుకునేవారని స్పష్టపరుస్తుంది; తరువాతి కాలపు సాంకేతిక సంఘ పదజాలాన్ని ప్రధాన వచనంలోకి దిగుమతి చేయదు.
theological_decisions:
- issue: εὐαγγελίζονται అనే పదంలోని శుభవార్త భావం మరియు కర్మణి రూపం
  choice: పేదవారికి శుభవార్త ప్రకటించబడుతోంది
  alternative: పేదవారికి సువార్త బోధించబడుతోంది
  rationale: ‘శుభవార్త’ అనే క్రియా మూలభావాన్ని, దానిని పేదవారు స్వీకరించేవారనే కర్మణి సంబంధాన్ని కాపాడుతుంది; ‘సువార్త’ను తరువాతి సాంకేతిక సంఘపదంగా మాత్రమే సంకుచితం చేయదు.
- issue: అద్భుతాల జాబితా మెస్సీయ కార్యానికి సాక్ష్యంగా ఉండడం
  choice: యెషయా నెరవేర్పు అని ప్రధాన వచనంలో అదనంగా చెప్పకుండా కార్యాలను యథాతథంగా ఉంచడం
  alternative: ‘యెషయా ప్రవచనం నెరవేరేలా’ అని వచనంలో చేర్చడం
  rationale: ఈ జాబితా యెషయా 35:5–6; 61:1లను బలంగా ప్రతిధ్వనింపజేస్తుంది; అయినా గ్రీకు వచనం ఇక్కడ నెరవేర్పు అనే వ్యాఖ్యను ప్రత్యక్షంగా చేర్చదు.
- issue: νεκροὶ ἐγείρονταιలో కార్యసాధకుని గుర్తింపు
  choice: మృతులు లేపబడుతున్నారు
  alternative: దేవుడు మృతులను లేపుతున్నాడు
  rationale: సందర్భం దైవిక కార్యాన్ని సూచించినా, గ్రీకు కర్మణి రూపంలో కార్యసాధకుడు ప్రత్యక్షంగా పేర్కొనబడలేదు; అందువల్ల అనువాదం అతన్ని వచనంలో అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యానికి తగిన గౌరవప్రదమైన గంభీరతతో అనువదించబడింది. వరుస కార్యాలను స్పష్టంగా విభజించేందుకు అర్ధవిరామాలు వాడబడ్డాయి. వ్యక్తులను హేళన చేసే తీవ్ర పదజాలాన్ని నివారిస్తూ, మూలంలోని సంక్షిప్త వర్గసూచక నిర్మాణం సాధ్యమైనంతవరకు నిలుపబడింది.
