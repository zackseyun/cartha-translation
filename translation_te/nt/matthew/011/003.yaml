  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: te
  text: 'ఆయనతో ఇలా అన్నాడు: “రాబోవువాడు[a] నువ్వేనా? లేక మేము మరొకరి కోసం ఎదురుచూడాలా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వస్తున్నవాడు,” “రానున్నవాడు.” ఈ గ్రీకు పదబంధం మెస్సీయను సూచించే బిరుదుగా ఉపయోగించబడవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: ఆయనతో ఇలా అన్నాడు
  rationale: εἶπεν అంటే ‘అన్నాడు’; αὐτῷ అంటే ‘ఆయనతో.’ తెలుగు కథన ప్రవాహంలో ప్రత్యక్ష మాటను సహజంగా పరిచయం చేయడానికి ‘ఇలా’ చేర్చబడింది.
- source_word: Σὺ εἶ
  choice: నువ్వేనా
  rationale: ప్రశ్నార్థక నిర్మాణంతో పాటు స్పష్టంగా ఉన్న σύ యొక్క ఉద్ఘాటనను తెలుగు ‘-ఏ’ సహజంగా తెలియజేస్తుంది.
- source_word: ὁ ἐρχόμενος
  choice: రాబోవువాడు
  rationale: ఆర్టికల్‌తో ఉన్న వర్తమాన కృదంతం వ్యక్తిని సూచిస్తూ, సందర్భంలో ఎదురుచూస్తున్న మెస్సీయ సంబంధమైన బిరుదుగా పనిచేయగలదు. ‘రాబోవువాడు’ ఆ బిరుదు భావాన్ని కాపాడుతూ, నేరుగా ‘మెస్సీయ’ అని అతివ్యాఖ్యానం చేయదు.
- source_word: ἢ
  choice: లేక
  rationale: ప్రత్యామ్నాయ ప్రశ్నను పరిచయం చేసే సహజమైన తెలుగు విభాజక అవ్యయం.
- source_word: ἕτερον
  choice: మరొకరి
  rationale: ‘మరొక వ్యక్తి’ లేదా ‘వేరొకరు’ అనే భావాన్ని సందర్భానికి తగిన సహజమైన వ్యక్తివాచక రూపంలో వ్యక్తం చేస్తుంది.
- source_word: προσδοκῶμεν
  choice: మేము … ఎదురుచూడాలా
  rationale: ఈ ఆలోచనాత్మక ప్రశ్నలో ‘ఎదురుచూస్తూ ఆశించాలా’ అనే భావాన్ని సహజంగా తెలియజేస్తుంది; తెలుగు ప్రశ్నలో ‘-ఆలా’ రూపం ‘should we expect’ అనే ఉద్దేశాన్ని అందిస్తుంది.
theological_decisions:
- issue: ὁ ἐρχόμενος యొక్క మెస్సీయ సంబంధమైన/బిరుదు భావం
  choice: రాబోవువాడు
  alternative: రాబోతున్నవాడు; రావలసినవాడు
  rationale: యోహాను అడిగిన ప్రశ్న ఎదురుచూస్తున్న విమోచక వ్యక్తి యేసేనా అనే దానిపై ఉంది. గ్రీకు పదబంధం సాధారణంగా ‘వస్తున్న వ్యక్తి’ అని కూడా అర్థమివ్వగలదు. అందువల్ల ప్రధాన పాఠ్యంలో ‘మెస్సీయ’ అని స్పష్టీకరించకుండా, బిరుదు భావాన్నీ పదబంధంలోని సహజ అస్పష్టతనూ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ‘నువ్వేనా’ ద్వారా మూలంలోని స్పష్టమైన σύ ఉద్ఘాటన నిలిచింది; ‘రాబోవువాడు’ బిరుదు భావాన్ని కాపాడినా, పాఠ్యంలోనే ‘మెస్సీయ’ అని వ్యాఖ్యానించదు.
