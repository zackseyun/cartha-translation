id: MAT.11.15
reference: Matthew 11:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: te
  text: చెవులు గలవాడు[a] వినాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెవులు ఉన్నవారెవరైనా వినాలి.” గ్రీకులో ఏ వ్యక్తినైనా సూచించే ఏకవచన ప్రయోగం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: గలవాడు
  rationale: నిర్దేశక పదంతో కూడిన వర్తమాన కృదంతం నామవాచకంగా పనిచేసి, ఈ లక్షణం గల ఏ వ్యక్తినైనా ఏకవచనంలో సూచిస్తుంది. ‘గలవాడు’ ఆ ఏకవచన సాధారణ ప్రయోగాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ὦτα
  choice: చెవులు
  rationale: గ్రీకు పదం బహువచనంలో ఉంది. ‘చెవులు’ దాని రూపాన్నీ, శ్రద్ధగా గ్రహించాలనే నుడికారార్థాన్నీ నిలుపుతుంది.
- source_word: ἀκουέτω
  choice: వినాలి
  rationale: ఇది మూడవ పురుష ఏకవచన వర్తమాన ఆజ్ఞార్థక రూపం. ఆధునిక ప్రామాణిక తెలుగులో ‘వినాలి’ ఆ పిలుపును సహజంగా తెలియజేస్తుంది; సందర్భంలో ఇది కేవలం శబ్దం వినడమే కాక, శ్రద్ధగా విని గ్రహించడాన్ని కూడా సూచించగలదు.
theological_decisions:
- issue: ఏకవచన సాధారణ పురుషవాచక ప్రయోగం
  choice: చెవులు గలవాడు వినాలి.
  alternative: చెవులు ఉన్నవారెవరైనా వినాలి.
  rationale: గ్రీకులో రూపం పురుష ఏకవచనమైనా భావం సాధారణంగా ఏ వ్యక్తికైనా వర్తిస్తుంది. ప్రధాన పాఠం మూలంలోని ఏకవచన రూపాన్ని నిలుపుతుంది; ప్రత్యామ్నాయం దాని సాధారణ పరిధిని స్పష్టం చేస్తుంది.
- issue: ‘వినడం’లోని విస్తృత భావం
  choice: వినాలి
  alternative: శ్రద్ధగా వినాలి
  rationale: మూలంలో సాధారణ ‘విను’ అనే క్రియే ఉంది; సందర్భం దానికి గ్రహించి స్పందించే భావాన్ని ఇవ్వగలదు. ప్రధాన పాఠంలో ఆ భావాన్ని వివరణాత్మక పదంతో సంకుచితం చేయకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గంభీరంగా అనువదించబడింది. ‘వినుగాక’ మూల ఆజ్ఞార్థక రూపానికి సన్నిహితమైనప్పటికీ నేటి సాధారణ వాడుకలో సాహిత్యాత్మకంగా లేదా ప్రాచీనంగా వినిపించవచ్చు; అందువల్ల ‘వినాలి’ ఎంచుకోబడింది.
