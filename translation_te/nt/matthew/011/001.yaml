id: MAT.11.1
reference: Matthew 11:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: te
  text: యేసు తన పన్నెండు మంది శిష్యులకు ఆదేశాలు ఇవ్వడం ముగించిన తరువాత[a], అక్కడి నుండి వారి పట్టణాల్లో[b] బోధించడానికి, ప్రకటించడానికి వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన పన్నెండు మంది శిష్యులకు ఆజ్ఞాపించడం ముగించిన తరువాత.”
    reason: lexical_alternative
  - marker: b
    text: “వారి పట్టణాలు” అనే గ్రీకు పదబంధం ఎవరిని సూచిస్తుందో స్పష్టంగా లేదు. అది శిష్యుల పట్టణాలను లేదా సాధారణంగా ఆ ప్రాంత ప్రజల పట్టణాలను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: '... తరువాత'
  rationale: మత్తయి వాడే ఈ కథన సంధి పదబంధం ఇక్కడ కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘... తరువాత’ అని అనువదించడం సంఘటనల క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది; గ్రీకు పదబంధాన్ని అక్షరార్థంగా ‘అప్పుడు ఇలా జరిగింది’ అనడం తెలుగులో కృత్రిమంగా ఉంటుంది.
- source_word: ἐτέλεσεν
  choice: ముగించిన
  rationale: తదుపరి ప్రధాన చర్యకు ముందే ఆదేశాలు ఇవ్వడం పూర్తయిందని సందర్భం సూచిస్తుంది.
- source_word: διατάσσων
  choice: ఆదేశాలు ఇవ్వడం
  rationale: ఈ క్రియ అధికారపూర్వకంగా నిర్దేశించడం లేదా ఆజ్ఞాపించడం అనే భావాన్ని కలిగి ఉంది. ‘ఆదేశాలు ఇవ్వడం’ సహజంగా ఉండి ఆ అధికార భావాన్ని నిలుపుతుంది; ‘ఉపదేశించడం’ అనే ఎంపిక బోధనతో కలిసిపోయే అవకాశం ఉంది.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: తన పన్నెండు మంది శిష్యులకు
  rationale: μαθηταίకు సువార్తల సందర్భంలో స్థిరమైన, సహజమైన తెలుగు పదం ‘శిష్యులు’; సంఖ్యను స్పష్టంగా నిలిపాం.
- source_word: μετέβη ἐκεῖθεν
  choice: అక్కడి నుండి వెళ్లి
  rationale: ఒక స్థలం నుండి మరొకదానికి కదలడాన్ని సహజమైన తెలుగు కథన శైలిలో వ్యక్తపరుస్తుంది.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: బోధిస్తూ ప్రకటించసాగాడు
  rationale: ఆర్టిక్యులర్ ఇన్ఫినిటివ్ ప్రయోజనాన్ని సూచిస్తుంది. తెలుగులో ‘వెళ్లి ... సాగాడు’ అనే నిర్మాణం ఉద్దేశంతో కూడిన తదుపరి కార్యాన్ని సహజంగా తెలియజేస్తుంది; బోధించడం, బహిరంగంగా ప్రకటించడం అనే రెండు వేర్వేరు క్రియలను నిలుపుతుంది.
- source_word: κηρύσσειν
  choice: ప్రకటించడం
  rationale: κηρύσσωలోని బహిరంగ ప్రకటన భావాన్ని ‘ప్రకటించడం’ నేరుగా అందిస్తుంది; కేవలం మతపరమైన సాంకేతిక పదంగా పరిమితం చేయదు.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: వారి పట్టణాల్లో
  rationale: πόλις సందర్భానుసారంగా నగరం లేదా పట్టణం కావచ్చు; గలిలయ ప్రాంతంలోని జనావాసాలకు ‘పట్టణాలు’ సహజం. αὐτῶν యొక్క పూర్వపదం స్పష్టంగా లేకపోవడంతో ‘వారి’ అనే అస్పష్టతను అనువాదంలో నిలిపాం.
theological_decisions:
- issue: ἐν ταῖς πόλεσιν αὐτῶνలో αὐτῶν ఎవరిని సూచిస్తుంది?
  choice: ‘వారి పట్టణాల్లో’ అని అస్పష్టతను నిలుపడం
  alternative: ‘శిష్యుల పట్టణాల్లో’ లేదా ‘ఆ ప్రాంతపు పట్టణాల్లో’ అని సూచనను నిర్దిష్టం చేయడం
  rationale: గ్రీకు సర్వనామం ఎవరిని సూచిస్తుందో వాక్యం స్పష్టంగా చెప్పదు. అది పన్నెండు మంది శిష్యులను సూచించవచ్చు లేదా చుట్టుపక్కల ప్రజల పట్టణాలను సాధారణంగా సూచించవచ్చు. అనువాదం ఈ వ్యాఖ్యాన సమస్యను మౌనంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథన శైలి వాడబడింది. ‘ఆదేశాలు’ అధికార భావాన్ని, ‘బోధిస్తూ ప్రకటించసాగాడు’ రెండు గ్రీకు క్రియల భేదాన్ని నిలుపుతాయి. మూలంలోని సర్వనామ అస్పష్టత ప్రధాన పాఠ్యంలోనూ పాదసూచికలోనూ సంరక్షించబడింది.
