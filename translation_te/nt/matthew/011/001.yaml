revisions:
- from: యేసు తన పన్నెండు మంది శిష్యులకు ఆదేశాలు ఇవ్వడం ముగించిన తరువాత[a], అక్కడి నుండి వెళ్లి వారి పట్టణాల్లో[b] బోధిస్తూ ప్రకటించసాగాడు.
  to: యేసు తన పన్నెండు మంది శిష్యులకు ఆదేశాలు ఇవ్వడం ముగించిన తరువాత[a], అక్కడి నుండి వారి పట్టణాల్లో[b] బోధించడానికి, ప్రకటించడానికి వెళ్లాడు.
  rationale: 'The revision preserves the source’s sequence and purpose construction: after finishing his instructions, Jesus departed from there in order to teach and proclaim. It avoids adding the inceptive/progressive sense of “ప్రకటించసాగాడు,” retains the distinction between teaching and proclaiming, and preserves the ambiguous referent of αὐτῶν through “వారి” and its footnote.'
