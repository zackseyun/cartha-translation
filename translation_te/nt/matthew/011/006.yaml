  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: te
  text: మరియు నన్నుబట్టి తొట్రుపడని వ్యక్తి ధన్యుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నన్నుబట్టి అభ్యంతరపడని వ్యక్తి’ / ‘నా కారణంగా తొట్రుపడని వ్యక్తి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: —
  rationale: ఈ వాక్యం ముందున్న సందర్భంతో అనుసంధానమై ఉన్నప్పటికీ, తెలుగులో స్వతంత్ర వచనంగా సహజంగా వినిపించేందుకు ‘మరియు’ను స్పష్టంగా చేర్చలేదు; అనుసంధానం వాక్యప్రవాహంలోనే నిలుస్తుంది.
- source_word: μακάριος
  choice: ధన్యుడు
  rationale: ‘సంతోషంగా ఉన్నవాడు’ అనే భావానికే పరిమితం కాకుండా, యేసు ప్రకటించే దైవానుగ్రహ స్థితిని తెలిపే బైబిలు సంబంధమైన గంభీరతను ‘ధన్యుడు’ నిలుపుతుంది.
- source_word: ὃς ἐὰν μὴ
  choice: తొట్రుపడని వ్యక్తి
  rationale: నిర్దిష్టం కాని ఏ వ్యక్తికైనా వర్తించే షరతును సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; మూలంలోని ఏకవచన భావాన్ని కూడా నిలుపుతుంది.
- source_word: σκανδαλισθῇ
  choice: అభ్యంతరపడి తొట్రుపడని
  rationale: క్రియలోని ‘తొట్రుపడడం’ అనే రూపకాన్ని నిలుపుతూ, ఈ సందర్భంలో యేసును బట్టి అభ్యంతరపడడం అనే భావాన్ని కూడా సహజంగా తెలియజేస్తుంది. కేవలం భావోద్వేగపరమైన ‘నొచ్చుకోవడం’గా అర్థాన్ని కుదించదు.
- source_word: ἐν ἐμοί
  choice: నన్నుబట్టి
  rationale: యేసు ఆ తొట్రుపాటుకు కారణం లేదా సందర్భం అవుతున్నాడనే సంబంధాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; ‘నాలో’ అనే అక్షరార్థ రూపం ఇక్కడ అసహజంగా, అస్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: σκανδαλισθῇ యొక్క బలాన్ని యేసుతో సంబంధంలో తగ్గించకుండా చూపడం
  choice: ‘అభ్యంతరపడి తొట్రుపడని’ అని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘నన్నుబట్టి అభ్యంతరపడని’ / ‘నా కారణంగా తొట్రుపడని’
  rationale: ఈ మాట యేసు మరియు ఆయన కార్యాల కారణంగా అభ్యంతరపడి విశ్వాసంలో తొట్రుపడకపోవడాన్ని సూచిస్తుంది. ‘తొట్రుపడడం’ అనే రూపకాన్ని నిలుపుతూ, ‘అభ్యంతరపడడం’ అనే సందర్భార్థాన్ని జతచేయడం ద్వారా రెండు భావాల మధ్య ఉన్న ఉద్దేశపూర్వక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే యేసు పలికిన ధన్యతా ప్రకటనకు తగిన గౌరవగంభీరతతో రూపొందించబడింది. ‘వ్యక్తి’ లింగసమావేషకంగా ఉపయోగించబడింది.
