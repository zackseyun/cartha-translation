    text: లేదా, ‘నన్నుబట్టి అభ్యంతరపడని వ్యక్తి’ / ‘నా కారణంగా తొట్రుపడని వ్యక్తి.’
    reason: lexical_alternative
  revision_rationale: The revision restores the explicit conjunction, retains “ధన్యుడు,” and renders σκανδαλισθῇ with the single stumbling metaphor in the main text. The contextual sense of taking offense remains available in the footnote without adding an unstated sequence or narrowing the expression to emotional offense.
