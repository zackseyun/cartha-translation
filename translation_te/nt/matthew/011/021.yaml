id: MAT.11.21
reference: Matthew 11:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: te
  text: కొరాజీన్, నీకు అయ్యో! బేత్సయిదా, నీకు అయ్యో! మీ మధ్య జరిగిన శక్తివంతమైన కార్యాలు తూరు, సీదోనులలో జరిగి ఉంటే, అక్కడి ప్రజలు ఎప్పుడో గోనెపట్టతోను బూడిదతోను పశ్చాత్తాపపడి ఉండేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “శక్తివంతమైన కార్యాలు” అనే పదాన్ని “అద్భుతాలు” లేదా “శక్తి కార్యాలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: నీకు శ్రమ!
  rationale: తీర్పును ప్రకటించే ప్రవక్తీయ తీవ్రతతో పాటు విచార ఛాయను కూడా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Χοραζίν
  choice: కొరాజీనా
  rationale: స్థలనామాన్ని తెలుగులో లిప్యంతరీకరించి, ప్రత్యక్ష సంబోధనకు సహజమైన రూపం ఇచ్చాం.
- source_word: Βηθσαϊδά
  choice: బేత్సయిదా
  rationale: స్థలనామాన్ని సాధారణ తెలుగు బైబిలు వాడుకకు దగ్గరగా లిప్యంతరీకరించాం; రూపమే సంబోధనకు సహజంగా సరిపోతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఈ శ్రమ ప్రకటనకు కారణాన్ని పరిచయం చేసే సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: αἱ δυνάμεις
  choice: శక్తికార్యాలు
  rationale: దైవిక శక్తి వ్యక్తమైన కార్యాలు అనే మూలపద భావాన్ని నిలుపుతుంది; కేవలం ఆధునిక వర్గపదమైన ‘అద్భుతాలు’కు పరిమితం చేయదు.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: పట్టణాల ప్రజల మధ్య ఆ కార్యాలు జరిగాయని తెలియజేస్తుంది; వారి అంతరంగంలో జరిగాయనే అపార్థాన్ని నివారిస్తుంది.
- source_word: εἰ ... ἂν ... μετενόησαν
  choice: జరిగి ఉంటే ... పశ్చాత్తాపపడి ఉండేవారు
  rationale: గ్రీకు వాక్యంలోని వాస్తవానికి విరుద్ధమైన షరతు నిర్మాణాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: πάλαι
  choice: ఎప్పుడో
  rationale: ప్రస్తుతానికి చాలా ముందే ఆ స్పందన వచ్చి ఉండేదనే కాలభావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: గోనెపట్ట కట్టుకొని బూడిదలో కూర్చుని
  rationale: పశ్చాత్తాపం, దుఃఖానికి సంబంధించిన ప్రాచీన దృశ్యాన్ని స్పష్టమైన తెలుగులో చూపిస్తుంది; ‘కూర్చుని’ అనేది ఆ ఆచారాన్ని సహజంగా వ్యక్తం చేసే సందర్భానుగుణ విస్తరణ.
theological_decisions:
- issue: తూరు, సీదోనులతో యేసు చేసిన పోలిక స్వభావం
  choice: యేసు శక్తికార్యాలను చూసినా పశ్చాత్తాపపడని పట్టణాలకు ఎక్కువ బాధ్యత ఉందని తెలిపే నిజమైన ప్రతివాస్తవిక పోలికగా ఉంచాం.
  alternative: నిజమైన తులనాత్మక తీర్పు లేని కేవలం అలంకారిక అతిశయోక్తిగా భావించడం.
  rationale: మూలవాక్యం ప్రతివాస్తవిక షరతుతో కొరాజీను, బేత్సయిదాల అపరాధాన్ని తీవ్రపరుస్తుంది. దానికి మించిన సిద్ధాంత నిర్ధారణను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రవక్తీయ శైలిని ఉపయోగించాం. పట్టణాలను ఏకవచనంగా సంబోధించే గ్రీకు రూపాన్ని ‘నీకు’తో, తరువాత ప్రజలను సూచించే బహువచనాన్ని ‘మీ మధ్య’తో నిలిపాం.
