source:
  edition: SBLGNT
  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: te
  text: కష్టపడుతూ భారాలతో నలిగిపోయిన మీరందరూ నా దగ్గరకు రండి; నేను మీకు విశ్రాంతి ఇస్తాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను మిమ్మల్ని సేదదీరుస్తాను.” ఇక్కడి గ్రీకు క్రియ విశ్రాంతి కలిగించడం లేదా సేదదీర్చడం అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: నా దగ్గరికి రండి
  rationale: ఆహ్వానాన్ని తెలిపే Δεῦτε మరియు వ్యక్తివైపు కదలికను తెలిపే πρός με భావాలను సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: πάντες
  choice: మీరందరూ
  rationale: ఆహ్వానం అందరికీ వర్తిస్తుందనే సమగ్రతను స్పష్టంగా నిలుపుతుంది; గ్రీకులోని బహువచన భావాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: οἱ κοπιῶντες
  choice: కష్టపడి అలసిపోయి
  rationale: κοπιάωలో శ్రమించడం మరియు దాని వల్ల అలసిపోవడం అనే అనుసంధాన భావాలు ఉన్నాయి. ఈ సందర్భంలో రెండింటినీ సహజంగా అందిస్తుంది.
- source_word: πεφορτισμένοι
  choice: భారాలు మోస్తున్న
  rationale: పర్ఫెక్ట్ పాసివ్ పార్టిసిపల్ సూచించే—భారం మోపబడి, దాని కింద కొనసాగుతున్న—స్థితిని సహజ తెలుగులో తెలియజేస్తుంది; భారం ఏమిటో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: κἀγὼ
  choice: నేను
  rationale: వాగ్దానం చేసే వ్యక్తిగా యేసును స్పష్టంగా ఉంచుతుంది. తెలుగు వాక్య నిర్మాణంలో విరామచిహ్నం తరువాత ‘నేను’ తగిన స్వల్ప ఉద్ఘాటనను ఇస్తుంది; గ్రీకు καίని తప్పనిసరిగా ‘మరియు’గా పెట్టడం అసహజంగా ఉంటుంది.
- source_word: ἀναπαύσω ὑμᾶς
  choice: మీకు విశ్రాంతి ఇస్తాను
  rationale: కారణార్థకమైన ‘విశ్రాంతి కలిగిస్తాను/ఇస్తాను’ భావాన్ని సహజంగా వ్యక్తం చేస్తూ, శారీరక, మానసిక, ఆధ్యాత్మిక లేదా అంత్యకాల సంబంధమైన ఒకే అర్థానికి పరిమితం చేయదు.
theological_decisions:
- issue: ἀναπαύσω వాగ్దానం చేసే విశ్రాంతి స్వభావం
  choice: ‘మీకు విశ్రాంతి ఇస్తాను’ అని విస్తృతంగా అనువదించడం
  alternative: ‘మిమ్మల్ని సేదదీరుస్తాను’
  rationale: ఈ వచనంలో విశ్రాంతి స్వభావం ఒక్క విధంగా నిర్వచించబడలేదు. విస్తృతమైన పదప్రయోగం మూలంలోని భావసంపదను, theological tensionను నిలుపుతుంది.
- issue: భారాల స్వభావం
  choice: ‘భారాలు’ అని మాత్రమే ఉంచడం
  alternative: ‘పాపభారాలు’ లేదా ‘ధర్మశాస్త్రపు భారాలు’
  rationale: πεφορτισμένοι భారంతో నలిగిన స్థితిని తెలియజేస్తుంది గాని ఈ వచనంలో ఆ భారాన్ని పాపం, ధర్మశాస్త్రం, జీవన కష్టాలు మొదలైన వాటిలో ఏదో ఒకటిగా స్పష్టంగా గుర్తించదు. కాబట్టి సిద్ధాంతపరమైన నిర్దిష్టీకరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో రూపొందించబడింది. ‘సొమ్మసిల్లిన,’ ‘భారాక్రాంతులైన’ వంటి సాహిత్యపరమైన లేదా తక్కువ ప్రాచుర్యంలోని రూపాలకు బదులుగా సహజమైన మాటలను వాడాం. ప్రధాన వాక్యంలోని అర్థప్రవాహాన్ని కాపాడుతూ ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
