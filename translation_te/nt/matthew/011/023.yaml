review_pass:
  verdict: revise
  source_fidelity: The rhetorical question and the contrary-to-fact condition are conveyed well. However, rendering ᾅδης as “పాతాళం” introduces Telugu/Indic underworld associations beyond the Greek term and weakens the source’s lexical distinction from Gehenna. Retaining a transliteration is safer.
  naturalness: The verse is generally fluent. “శక్తివంతమైన కార్యాలు” is more idiomatic and readily understood than the compressed coinage “శక్తికార్యాలు.” Explicitly repeating “సొదొమ” removes a slightly vague antecedent in “అది.”
  terminology: Use “హాదేసు” in the text, with “మృతుల లోకం” as the explanatory alternative in the footnote. This preserves the distinct Greek term without importing the final-punishment sense of “నరకం” or the more specific cultural imagery of “పాతాళం.”
  issues:
  - severity: medium
    issue: “పాతాళం” for ᾅδης
    rationale: “పాతాళం” may evoke an Indic mythological netherworld and is not a neutral equivalent for Greek ᾅδης. The source and English audit deliberately distinguish Hades from Gehenna; transliteration best preserves that distinction.
  - severity: low
    issue: “శక్తికార్యాలు” is somewhat compressed
    rationale: Although understandable, “శక్తివంతమైన కార్యాలు” is more natural modern Telugu while retaining δυνάμεις as deeds characterized by power.
  - severity: low
    issue: “అది” has a less explicit antecedent
    rationale: The Greek singular verb refers to Sodom as the city. Repeating “సొదొమ” makes this referent clear in Telugu without adding meaning.
  revised_text: కపెర్నహూమా, నీవు పరలోకం వరకు హెచ్చింపబడతావా? హాదేసుకు[a] దిగిపోతావు. ఎందుకంటే, నీలో జరిగిన శక్తివంతమైన కార్యాలు సొదొమలో జరిగి ఉంటే, సొదొమ ఈ రోజు వరకు నిలిచి ఉండేది.
