id: MAT.11.23
reference: Matthew 11:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: te
  text: కపెర్నహూమా, నీవు పరలోకం వరకు హెచ్చింపబడతావా? హాదేసుకు[a] దిగిపోతావు. ఎందుకంటే, నీలో జరిగిన శక్తివంతమైన కార్యాలు సొదొమలో జరిగి ఉంటే, సొదొమ ఈ రోజు వరకు నిలిచి ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మృతుల లోకానికి.’ గ్రీకులో ‘హాదేసు’; ఇది గెహెన్నా కాదు.
    reason: ᾅδηςకు వివరణాత్మక ప్రత్యామ్నాయాన్ని ఇచ్చి, దానిని గెహెన్నాతో కలపకుండా స్పష్టం చేయడం.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: కపెర్నహూము
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన స్థలనామ రూపాన్ని ఉంచి, సంబోధనలో ‘కపెర్నహూమా’గా ప్రయోగించాం.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: నీవు పరలోకం వరకు హెచ్చించబడతావా?
  rationale: μήతో కూడిన భవిష్యత్ కర్మణి క్రియను ప్రతికూల సమాధానాన్ని సూచించే అలంకార ప్రశ్నగా తీసుకున్నాం. ‘హెచ్చించబడతావా’ స్థాయి, ఘనత భావాన్ని; ‘పరలోకం వరకు’ మూలంలోని దిశాత్మక రూపకాన్ని నిలుపుతుంది.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: పాతాళానికి దిగిపోతావు
  rationale: καταβαίνωకు సహజమైన ‘దిగిపోవు’ను వాడాం. ᾅδηςను తుది శిక్షాస్థలాన్ని సూచించే పదాలతో కలపకుండా, మృతుల లోకాన్ని సూచించే సంప్రదాయ తెలుగు పదం ‘పాతాళం’తో అనువదించాం; ప్రత్యామ్నాయ వివరణను పాదసూచికలో ఇచ్చాం.
- source_word: δυνάμεις
  choice: శక్తికార్యాలు
  rationale: యేసు చేసిన శక్తిమంతమైన కార్యాలనే సందర్భార్థాన్ని, కేవలం ఆధునిక అర్థంలోని ‘అద్భుతాలు’కు పరిమితం చేయకుండా వ్యక్తపరుస్తుంది.
- source_word: γενόμεναι ἐν σοί
  choice: నీలో జరిగిన
  rationale: పట్టణాన్ని ప్రత్యక్షంగా సంబోధిస్తున్న మూలంలోని ἐν σοί అనే స్థానార్థక వ్యక్తీకరణను సహజ తెలుగులో నిలిపాం.
- source_word: ἐγενήθησαν
  choice: జరిగి ఉంటే
  rationale: వాస్తవానికి విరుద్ధమైన షరతును తెలుగులో సహజంగా తెలియజేస్తూ, γίνομαι యొక్క విస్తృతమైన ‘జరుగు’ భావాన్ని కాపాడుతుంది.
- source_word: ἔμεινεν ἂν
  choice: అది నిలిచి ఉండేది
  rationale: సొదొమ పట్టణాన్ని ఏకవచనంగా సూచిస్తూ, ἄνతో ఉన్న అవాస్తవ ఫలిత వాక్యాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: μέχρι τῆς σήμερον
  choice: ఈ రోజు వరకు
  rationale: మూలంలోని కాలపరిమితిని నేరుగా, ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ᾅδης పదం అనువాదం
  choice: పాతాళం
  alternative: మృతుల లోకం; హేడేసు; నరకం
  rationale: ᾅδηςను ‘నరకం’గా అనువదిస్తే గెహెన్నా వంటి తుది తీర్పు పదాలతో అనవసరంగా కలిసిపోయే ప్రమాదం ఉంది. ‘పాతాళం’ తెలుగు పాఠకులకు మృతుల లోకం/అధోలోకం అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది; దాని పరిమితిని పాదసూచిక స్పష్టం చేస్తుంది.
- issue: μήతో కూడిన వాక్య నిర్మాణం
  choice: ప్రతికూల సమాధానాన్ని సూచించే అలంకార ప్రశ్న
  alternative: ‘నీవు పరలోకం వరకు హెచ్చించబడవు’ అనే నేర నిరాకరణ
  rationale: గ్రీకు వాక్య నిర్మాణంలోని ప్రశ్నాత్మకతను, దానిలో అంతర్లీనమైన ప్రతికూల నిరీక్షణను రెండింటినీ నిలిపేందుకు ప్రశ్న రూపాన్నే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. పట్టణాన్ని ప్రత్యక్షంగా సంబోధించే కవితాత్మక తీర్పు స్వరాన్ని నిలిపాం; ‘శక్తికార్యాలు’ వంటి పదంతో మూలంలోని కార్యం-శక్తి ద్వంద్వ భావాన్ని కాపాడాం.
