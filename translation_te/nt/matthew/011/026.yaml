source:
  edition: SBLGNT
  text: ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: te
  text: అవును[a], తండ్రీ, ఎందుకంటే ఇలా జరగడం నీ దృష్టిలో ప్రీతికరమైంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిజమే, తండ్రీ, ఎందుకంటే ఇలా ఉండడం నీ దృష్టిలో ప్రీతికరమైంది”; లేదా, “ఎందుకంటే ఇది నీ సంతోషమే.”
    reason: ναίకు ‘నిజమే’ అనే బలమైన సమ్మతి భావాన్ని, అలాగే οὕτως εὐδοκία ἐγένετοకు ‘ఇలా ఉండడం నీ దృష్టిలో ప్రీతికరమైంది’ మరియు ‘నీ సంతోషమే’ అనే సాధ్యమైన ప్రత్యామ్నాయ రూపాలను సూచిస్తుంది.
lexical_decisions:
- source_word: ναί
  choice: అవును
  rationale: ప్రార్థనలో తండ్రి చేసిన కార్యానికి తెలిపే అంగీకారాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: ὁ πατήρ
  choice: తండ్రీ
  rationale: రూపంలో కర్తలా ఉన్నప్పటికీ ఇక్కడ ఇది ప్రత్యక్ష సంబోధన. ‘తండ్రీ’ గౌరవప్రదమైన, సహజమైన తెలుగు సంబోధన.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న అంగీకారానికి కారణాన్ని పరిచయం చేసే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὕτως
  choice: ఇలా
  rationale: మునుపటి వచనంలో చెప్పిన దాచడం, బయలుపరచడం జరిగిన విధానాన్ని వెనక్కి సూచిస్తుంది.
- source_word: εὐδοκία ἐγένετο
  choice: జరగడం … ఇష్టమైంది
  rationale: ఈ గ్రీకు ప్రయోగం తండ్రికి ఆ విధమైన కార్యం ప్రీతికరంగా లేదా ఆమోదయోగ్యంగా ఉందనే భావాన్ని ఇస్తుంది. తెలుగులో సహజంగా ఉండేందుకు క్రియాత్మక నిర్మాణంగా అనువదించబడింది.
- source_word: ἔμπροσθέν σου
  choice: నీ దృష్టికి
  rationale: అక్షరార్థంగా ‘నీ ఎదుట’; ఇక్కడ ‘నీ దృష్టిలో’ లేదా ‘నీ సమక్షంలో’ అనే మూల్యాంకన భావం ఉంది. ‘నీ దృష్టికి’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: εὐδοκίαను దేవుని నిర్ణయం లేదా సంకల్పంగా స్పష్టీకరించాలా, లేక ఆయనకు ప్రీతికరమైనదిగా అనువదించాలా
  choice: నీ దృష్టికి ఇష్టమైంది
  alternative: నీ సదిష్టం ప్రకారమే జరిగింది
  rationale: మూలపాఠం తండ్రి కార్యం ఆయనకు ప్రీతికరమైందని చెబుతుంది; దానిని నిర్దిష్టమైన శాశ్వత నిర్ణయం లేదా ఆజ్ఞగా బలపరచదు. అందువల్ల దైవ సంకల్పం గురించి ఉన్న విస్తృత వేదాంత ప్రశ్నను అనువాదం ముందుగానే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనకు తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘సదిష్టం’ వంటి అరుదైన మతపరమైన పదాన్ని ప్రధాన పాఠంలో నివారించి, మూలంలోని ప్రీతి/ఆమోద భావాన్ని ‘ఇష్టమైంది’తో సహజంగా వ్యక్తపరిచాం.
