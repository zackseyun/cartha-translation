  register: సహజమైన ఆధునిక ప్రామాణిక తెలుగు; యేసు అడిగిన వరుస అలంకారిక ప్రశ్నల బలాన్ని నిలుపుతూ, ‘మెత్తని వస్త్రాలు’ అనే మూలంలోని పునరుక్తిని కాపాడింది.
