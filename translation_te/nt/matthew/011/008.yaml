id: MAT.11.8
reference: Matthew 11:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: te
  text: అయితే మీరు ఏమి చూడడానికి బయలుదేరి వెళ్లారు? మెత్తని వస్త్రాలు ధరించిన మనిషిని చూడడానికా? ఇదిగో, మెత్తని వస్త్రాలు ధరించేవారు రాజుల ఇళ్లలో[a] ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజభవనాల్లో.” గ్రీకులో అక్షరార్థంగా “రాజుల ఇళ్లలో” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: మునుపటి ప్రశ్నకు కొనసాగింపుగా వచ్చే వ్యతిరేక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: మీరు ఏమి చూడడానికి బయలుదేరి వెళ్లారు?
  rationale: τί అనే ‘ఏమి’ ప్రశ్నార్థక భావాన్నీ, ἐξήλθατε ἰδεῖν అనే ఉద్దేశార్థక నిర్మాణాన్నీ నిలుపుతుంది.
- source_word: ἄνθρωπον
  choice: మనిషిననా?
  rationale: ఏకవచన పురుష వ్యక్తిని సూచిస్తూ, బాప్తిస్మమిచ్చే యోహాను గురించిన తక్షణ సందర్భానికి సరిపోతుంది.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: మెత్తని వస్త్రాలు ధరించిన
  rationale: μαλακοῖς యొక్క ప్రత్యక్ష అర్థమైన ‘మెత్తని’ని, ἠμφιεσμένον యొక్క ‘ధరించిన’ భావాన్ని కాపాడుతుంది; సందర్భం సున్నితమైన లేదా విలాసవంతమైన దుస్తుల సూచనను అందిస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే గ్రీకు అవ్యయపు వాక్చాతుర్య బలాన్ని గౌరవప్రదమైన, ప్రస్తుత తెలుగులో నిలుపుతుంది.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: మెత్తని వస్త్రాలు ధరించేవారు
  rationale: φοροῦντες లోని అలవాటుగా ధరించే భావాన్ని తెలియజేస్తూ, μαλακὰ పదానికి ముందున్న పదబంధంతో ఏకరూపతను ఉంచుతుంది.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: రాజుల ఇళ్లలో ఉంటారు
  rationale: గ్రీకులోని బహువచన ‘రాజుల ఇళ్లు’ అనే రూపాన్ని కాపాడుతుంది; ‘రాజభవనాల్లో’ అనేది సహజమైన భావానువాద ప్రత్యామ్నాయం.
