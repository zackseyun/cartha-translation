id: MAT.11.19
reference: Matthew 11:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: te
  text: మనుష్యకుమారుడు తింటూ తాగుతూ వచ్చాడు, వారు, ‘ఇదిగో, తిండిపోతు, తాగుబోతు, పన్ను వసూలు చేసేవారికీ పాపులకూ స్నేహితుడు!’ అంటున్నారు. జ్ఞానం తన కార్యాలవల్ల[b] సమర్థించబడింది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జ్ఞానం తన క్రియలవల్ల సరైనదని రుజువైంది.”
    reason: lexical_alternative
  - marker: b
    text: 'కొన్ని ప్రాచీన ప్రతుల్లో “కార్యాలు”కు బదులుగా “పిల్లలు” అని ఉంది: “జ్ఞానం తన పిల్లలవల్ల సమర్థించబడింది.”'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు తనను గురించి ఉపయోగించిన స్థిరమైన బైబిలీయ బిరుదును, దాని సెమీయ నేపథ్యాన్నీ దైవశాస్త్రీయ ప్రతిధ్వనినీ వివరణతో పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: ἐσθίων καὶ πίνων
  choice: తింటూ తాగుతూ
  rationale: యోహాను జీవనరీతితో ఉన్న వ్యత్యాసాన్ని అతిశయోక్తి లేకుండా, సాధారణ కార్యకలాపాలుగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: బహిరంగ నిందలోని చూపించే, ఆశ్చర్యార్థక బలాన్ని ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: φάγος
  choice: తిండిపోతు
  rationale: తిండి విషయంలో మితిమీరినవాడని చేసే అవమానకర ఆరోపణను సంక్షిప్తంగా, వాడుక తెలుగులో అందిస్తుంది.
- source_word: οἰνοπότης
  choice: తాగుబోతు
  rationale: ఇది తటస్థంగా ద్రాక్షారసం తాగేవాడని కాక, మితిమీరి తాగేవాడని చేసే నింద; ‘తాగుబోతు’ ఆ దూషణ స్వరాన్ని నిలుపుతుంది.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: పన్ను వసూలు చేసేవారికీ పాపులకూ స్నేహితుడు
  rationale: మూలంలోని సంబంధ నిర్మాణాన్ని, ఆ కాలపు సామాజిక-మతపరమైన ముద్రలను స్పష్టంగా, సహజంగా ఉంచుతుంది.
- source_word: ἐδικαιώθη
  choice: సమర్థించబడింది
  rationale: ఇక్కడ ‘సరైనదని రుజువైంది/నిరూపితమైంది’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూనే మూలంలోని కర్మణి రూపాన్ని నిలుపుతుంది.
- source_word: ἡ σοφία
  choice: జ్ఞానం
  rationale: జ్ఞానాన్ని వ్యక్తీకరించి చెప్పే రూపాన్ని వివరణాత్మకంగా యేసుతోనో దేవుని ప్రణాళికతోనో సమీకరించకుండా నిలుపుతుంది.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: తన కార్యాలవల్ల
  rationale: SBLGNT లోని ‘కార్యాలు’ అనే పాఠాన్ని అనుసరించి, జ్ఞానం ఉత్పత్తి చేసే ఫలితాల ద్వారా అది సమర్థించబడుతుందనే భావాన్ని తెలుపుతుంది.
theological_decisions:
- issue: చివరి వాక్యభాగంలోని ‘జ్ఞానం’ అర్థం
  choice: ‘జ్ఞానం’ అనే వ్యక్తీకృత పదాన్నే ఉంచడం
  alternative: దానిని యేసు, దేవుని రక్షణ జ్ఞానం, లేదా దేవుని ప్రణాళిక అని స్పష్టంగా గుర్తించడం
  rationale: మూలపాఠం ఈ గుర్తింపును ప్రత్యక్షంగా నిర్ధారించదు; కాబట్టి దాని సాహిత్య, దైవశాస్త్రీయ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
- issue: చివరి వాక్యభాగపు పాఠాంతరం
  choice: ప్రధాన పాఠంలో SBLGNT లోని ἔργων (‘కార్యాలు’) అనుసరించడం
  alternative: τέκνων (‘పిల్లలు’) అనే పాఠాంతరం
  rationale: అందించిన మూలపాఠం ‘కార్యాలు’ అని చదువుతుంది; అయితే ప్రాచీన ప్రతుల్లో కనిపించే ప్రసిద్ధ ‘పిల్లలు’ పాఠాంతరాన్ని పాదసూచికలో భద్రపరచడం అవసరం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ఆరోపణల్లోని పదునును ‘తిండిపోతు, తాగుబోతు’ ద్వారా నిలిపి, చివరి సామెతసదృశ వాక్యంలో ఉన్న వ్యక్తీకరణను వ్యాఖ్యానంతో విప్పలేదు.
