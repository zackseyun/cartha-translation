source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: te
  text: యోహాను చెరసాలలో ఉండి, మెస్సీయ[a] కార్యాల గురించి విని, తన శిష్యుల ద్వారా కబురు పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.”
    reason: Χριστός అనే బిరుదుకు సంప్రదాయ ప్రత్యామ్నాయ రూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది కథనంలోని స్వల్ప మార్పును సూచిస్తుంది; తెలుగులో వాక్య నిర్మాణమే ఆ మార్పును సహజంగా తెలియజేస్తుంది. ‘అప్పుడు’ అని పెడితే మూలంలో లేని స్పష్టమైన కాలక్రమ భావం చేరవచ్చు.
- source_word: ἀκούσας
  choice: విని
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది; తెలుగులో ‘విని’ సహజంగా, సంక్షిప్తంగా అదే సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: చెరసాలలో ఉన్నప్పుడు
  rationale: యోహాను నిర్బంధంలో ఉన్న సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టం చేస్తుంది.
- source_word: τὰ ἔργα
  choice: చేస్తున్న కార్యాలు
  rationale: ‘కార్యాలు’ ἔργα యొక్క విస్తృత భావాన్ని నిలుపుతుంది; సందర్భంలో అవి యోహాను విన్న మెస్సీయ కార్యాచరణను సూచిస్తాయి.
- source_word: τοῦ χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός వ్యక్తిపేరులా కాక అభిషిక్తుని బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ దాని యూద నేపథ్యాన్ని, బిరుదు స్వభావాన్ని నిలుపుతుంది.
- source_word: πέμψας
  choice: కబురు పంపాడు
  rationale: పంపిన సందేశపు విషయం తదుపరి వచనంలో వస్తుంది; తెలుగులో ‘కబురు పంపాడు’ అనేది వ్యక్తుల ద్వారా ప్రశ్నను పంపించిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: తన శిష్యుల ద్వారా
  rationale: διά + షష్ఠీ విభక్తి మధ్యవర్తిత్వాన్ని సూచిస్తుంది; ‘ద్వారా’ ఆ భావాన్ని సూటిగా నిలుపుతుంది.
theological_decisions:
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో పదం బిరుదుగా ఉండి, యేసు చేసిన మెస్సీయ సంబంధ కార్యాలను సూచిస్తుంది. సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని కృదంత నిర్మాణాన్ని తెలుగు సహాయక వాక్య నిర్మాణంగా మార్చి, కథన ప్రవాహాన్ని కాపాడాం.
