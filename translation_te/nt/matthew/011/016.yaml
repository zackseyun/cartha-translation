id: MAT.11.16
reference: Matthew 11:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: te
  text: 'అయితే, ఈ తరాన్ని దేనితో పోల్చాలి? ఇది సంత ప్రాంగణాల్లో[a] కూర్చొని, మిగతావారిని ఉద్దేశించి పిలుస్తున్న పిల్లల్లా ఉంది:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సంత కూడళ్లలో.’ గ్రీకు పదం ప్రజలు కూడే బహిరంగ మార్కెట్ ప్రదేశాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι ... ὁμοιώσω
  choice: దేనితో పోల్చాలి?
  rationale: దత్తివ విభక్తిలోని ప్రశ్నార్థక పదం పోలికకు ప్రమాణాన్ని సూచిస్తుంది. భవిష్యత్ సూచక క్రియ ఇక్కడ అలంకారికంగా ఆలోచనాత్మక ప్రశ్నను వ్యక్తం చేస్తుంది; సహజ తెలుగు వాడుకలో ‘దేనితో పోల్చాలి?’ దాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: δέ స్వల్పమైన మార్పు లేదా వ్యత్యాసాన్ని సూచిస్తుంది. ‘అయితే’ సందర్భంలోని అలంకారిక మలుపును అతిగా బలపరచకుండా తెలియజేస్తుంది.
- source_word: τὴν γενεὰν ταύτην
  choice: ఈ తరాన్ని
  rationale: γενεά ఇక్కడ యేసు సమకాలికుల తరాన్ని సమష్టిగా సూచిస్తుంది. ‘ఈ తరం’ ఆధునిక తెలుగులో సహజమైన, స్థిరమైన అనువాదం.
- source_word: ὁμοία ἐστὶν παιδίοις
  choice: ఇది ... పిల్లల్లా ఉంది
  rationale: సాధారణ సాదృశ్యాన్ని సహజ తెలుగులో తెలియజేస్తూ, παιδίοις‌ను అనవసరంగా ‘చిన్న పిల్లలు’ అని పరిమితం చేయలేదు.
- source_word: καθημένοις ἐν ταῖς ἀγοραῖς
  choice: సంత ప్రాంగణాల్లో కూర్చొని
  rationale: ἀγορά కేవలం కొనుగోలు దుకాణాలను కాక, ప్రజలు కూడే బహిరంగ మార్కెట్ ప్రదేశం లేదా కూడలిని సూచిస్తుంది. ‘సంత ప్రాంగణాలు’ ఆ సామాజిక, బహిరంగ స్థల భావాన్ని అందిస్తుంది.
- source_word: ἃ προσφωνοῦντα
  choice: పిలుస్తున్న
  rationale: προσφωνέω శబ్దంగా సంబోధించడం లేదా పిలవడం అనే భావాన్ని ఇస్తుంది. ‘పిలుస్తున్న’ దృశ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τοῖς ἑτέροις
  choice: మిగతావారిని
  rationale: గ్రీకు పాఠం నేరుగా ‘ఇతరులు/మిగతావారు’ అని మాత్రమే చెబుతుంది. తెలుగు క్రియావ్యవస్థకు అనుగుణంగా కర్మరూపం వాడుతూ, వారు ఇతర పిల్లలేనని ప్రధాన పాఠంలో స్పష్టీకరించలేదు.
