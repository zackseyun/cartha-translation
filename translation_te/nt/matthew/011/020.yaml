    text: 'లేదా ‘అద్భుతాలు’ లేదా ‘శక్తి కార్యాలు’ (గ్రీకు: దునామైస్).'
    reason: lexical_alternative
  revision_rationale: 'The revision removes the scope ambiguity around ‘most,’ uses a natural Telugu expression for deeds of power, and retains all source relationships: Jesus’ deeds, their occurrence in the cities, the cities’ failure to repent, and his ensuing reproach. The footnote marker remains attached to the source-related expression ‘శక్తివంతమైన కార్యాలు.’'
