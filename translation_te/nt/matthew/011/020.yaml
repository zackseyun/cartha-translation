id: MAT.11.20
reference: Matthew 11:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: te
  text: అప్పుడు ఆయన చేసిన అత్యధిక శక్తివంతమైన కార్యాలు జరిగిన పట్టణాలు పశ్చాత్తాపపడలేదు కాబట్టి, ఆయన వాటిని నిందించడం మొదలుపెట్టాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: కథనంలో తదుపరి ఘట్టాన్ని సూచించే సహజమైన కాలసూచకం.
- source_word: ἤρξατο ὀνειδίζειν
  choice: నిందించడం మొదలుపెట్టాడు
  rationale: ἤρξατο యొక్క ఆరంభ భావాన్ని నిలుపుతూ, ὀνειδίζειν లోని గద్దింపు కలిగిన నిందార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὰς πόλεις ἐν αἷς
  choice: పట్టణాలు
  rationale: πόλις ఇక్కడ గలిలయ ప్రాంతంలోని నివాస కేంద్రాలను సూచిస్తుంది; తెలుగులో ‘పట్టణాలు’ సహజంగా సరిపోతుంది. సంబంధవాచక నిర్మాణాన్ని ‘తాను ... చేసిన పట్టణాలు’గా సహజీకరించాం.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: తాను అత్యధికంగా శక్తికార్యాలు చేసిన
  rationale: తెలుగులో కర్తృవాచ్య నిర్మాణం సహజంగా ఉండటంతో పాటు αὐτοῦ ను యేసు చేసిన కార్యాలుగా స్పష్టం చేస్తుంది. πλεῖσται యొక్క అత్యధిక సంఖ్య/పరిమాణ భావాన్ని ‘అత్యధికంగా’ నిలుపుతుంది.
- source_word: δυνάμεις
  choice: శక్తికార్యాలు
  rationale: ఈ సందర్భంలో అద్భుతమైన శక్తి ప్రదర్శనలైన కార్యాలను సూచిస్తుంది; ‘శక్తికార్యాలు’ మూలపదంలోని శక్తి భావాన్ని నిలుపుతుంది.
- source_word: ὅτι οὐ μετενόησαν
  choice: పశ్చాత్తాపపడలేదు కాబట్టి
  rationale: ὅτι కారణాన్ని తెలియజేస్తుంది. μετανοέω యొక్క నైతిక-ఆధ్యాత్మిక ప్రతిస్పందన భావాన్ని ‘పశ్చాత్తాపపడడం’ ఖచ్చితంగా, సుపరిచితంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: δυνάμεις ను అద్భుతాల సందర్భంలో అనువదించడం
  choice: శక్తికార్యాలు
  alternative: అద్భుతాలు; శక్తివంతమైన కార్యాలు
  rationale: ‘శక్తికార్యాలు’ గ్రీకు పదంలోని శక్తి భావాన్ని కాపాడుతూ, దానిని కేవలం ఒక సాంకేతిక వర్గపదానికి పరిమితం చేయదు; పాదసూచికలో సహజమైన ప్రత్యామ్నాయాలను ఇస్తుంది.
- issue: μετενόησαν యొక్క అర్థం
  choice: పశ్చాత్తాపపడలేదు
  alternative: మనస్సు మార్చుకోలేదు; తిరిగి రాలేదు
  rationale: ఇక్కడ యేసు కార్యాలకు తగిన నైతిక-ఆధ్యాత్మిక స్పందన లేకపోవడాన్ని సూచిస్తుంది. ‘పశ్చాత్తాపపడలేదు’ మూలంలోని theological weight ను ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ జోడించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే గంభీరమైన బైబిలు శైలిని నిలుపుకుంది. మూలంలోని కారణ సంబంధం మరియు కార్యాల శక్తి భావం స్పష్టంగా ఉంచబడ్డాయి.
