id: MAT.11.9
reference: Matthew 11:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: te
  text: కానీ మీరు ఏమి చూడడానికి బయటకు వెళ్లారు? ఒక ప్రవక్తనా? అవును, నేను మీకు చెబుతున్నాను—ప్రవక్తకంటే మించినవాణ్ణి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో మరింత అక్షరార్థంగా ‘ప్రవక్తకంటే ఎక్కువ’ అని ఉంది.
    reason: ముఖ్య పాఠంలోని సహజమైన వ్యక్తివాచక తెలుగు రూపం వెనుక ఉన్న గ్రీకు పోలిక నిర్మాణాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందున్న అలంకారిక ప్రశ్నల వరుసతో వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: τί ἐξήλθατε
  choice: మీరు ఏమి చూడడానికి బయలుదేరి వెళ్లారు?
  rationale: τί ఇక్కడ ‘ఎందుకు’ కంటే ‘ఏమి’ అనే ప్రశ్నార్థక భావాన్ని ఇస్తుంది; తరువాతి ἰδεῖν ఉద్దేశార్థక క్రియతో కలిసి వారు చూడడానికి వెళ్లిన వ్యక్తిని గురించి అడుగుతుంది.
- source_word: ἰδεῖν
  choice: చూడడానికి
  rationale: ἐξήλθατε తరువాత ఉద్దేశాన్ని తెలిపే అనిశ్చిత క్రియారూపాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: προφήτην
  choice: ఒక ప్రవక్తనా?
  rationale: నిర్దేశక పదం లేని ఏకవచన నామవాచకాన్ని ప్రశ్నలో సహజమైన అనిర్దిష్ట రూపంగా అందిస్తుంది.
- source_word: ναί
  choice: అవును
  rationale: ముందటి ప్రశ్నకు నేరుగా ఇచ్చిన ధృవీకరణను స్పష్టంగా నిలుపుతుంది.
- source_word: λέγω ὑμῖν
  choice: మీతో చెబుతున్నాను
  rationale: సాధారణ ప్రజలకు అర్థమయ్యే గౌరవప్రదమైన ఆధునిక తెలుగు ప్రయోగం; యేసు మాటలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: καὶ περισσότερον προφήτου
  choice: ప్రవక్తకంటే మించినవాణ్ణి
  rationale: προφήτου అనే షష్ఠీ విభక్తితో περισσότερον తెలిపే పోలికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. సందర్భం వ్యక్తిని సూచిస్తున్నందున ‘వాణ్ణి’ అవసరమైన తెలుగు రూపాన్ని అందిస్తుంది; అతడు ఏ విధంగా మించినవాడో మాత్రం వివరించదు.
theological_decisions:
- issue: యోహాను ప్రవక్తకంటే ఉన్నతుడని యేసు చెప్పిన మాటలోని భావం
  choice: ప్రవక్తకంటే మించినవాణ్ణి
  alternative: సాధారణ ప్రవక్తకంటే గొప్పవాణ్ణి
  rationale: మూలపాఠం యోహానును ప్రవక్త అనే స్థాయికి మించినవాడిగా చూపుతుంది, కానీ ఈ వాక్యభాగంలో అతడు ఏ విధంగా మించినవాడో చెప్పదు. ‘సాధారణ’ వంటి వివరణను చేర్చకుండా ఆ భావ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన వాక్యశైలితో రూపొందించబడింది. ప్రశ్నల లయను నిలుపుతూ చివరి వాక్యభాగానికి దీర్ఘ విరామచిహ్నంతో ఉద్ఘాటన ఇచ్చాం.
