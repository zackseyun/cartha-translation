id: MAT.11.11
reference: Matthew 11:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: te
  text: 'నేను మీతో నిశ్చయంగా చెబుతున్నాను: స్త్రీల ద్వారా జన్మించినవారిలో[a] బాప్తిస్మమిచ్చే యోహానుకంటే గొప్పవాడు ఎవరూ ఉద్భవించలేదు[b]. అయినా పరలోక రాజ్యంలో అతి చిన్నవాడు[c] అతని కంటే గొప్పవాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘స్త్రీల ద్వారా జన్మించినవారు’ అనేది మానవులను సూచించే సెమిటిక్ నుడికారం.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘లేచాడు’ / ‘లేపబడ్డాడు.’ గ్రీకు క్రియకు ‘లేవడం’ లేదా ‘లేపబడడం’ అనే భావాలు ఉండవచ్చు; ఇక్కడ అది పునరుత్థానాన్ని కాక, చరిత్రలో ఒక వ్యక్తి ఆవిర్భవించడాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘చిన్నవాడు’ / ‘తక్కువవాడు.’ గ్రీకులో తులనాత్మక రూపం ఉంది; ఇక్కడ రాజ్యంలో అత్యల్ప స్థానం లేదా హోదా గలవాడనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిశ్చయంగా చెబుతున్నాను
  rationale: యేసు పలికే గంభీరమైన, అధికారపూర్వక ప్రకటన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. ‘ఆమేన్’ అని లిప్యంతరీకరించడం కంటే భావం సాధారణ పాఠకునికి వెంటనే స్పష్టమవుతుంది.
- source_word: οὐκ ἐγήγερται
  choice: ఉద్భవించలేదు
  rationale: ἐγείρω క్రియ యొక్క ‘లేచాడు/ఉద్భవించాడు’ అనే భావాన్ని నిలుపుతూ, ఇక్కడ పునరుత్థానాన్ని సూచిస్తున్నట్టుగా కాక చరిత్రలో ఒక వ్యక్తి ఆవిర్భవించడాన్ని తెలియజేస్తుంది.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: స్త్రీలకు పుట్టినవారిలో
  rationale: మానవులందరినీ సూచించే సెమిటిక్ నుడికారాన్ని వివరణాత్మకంగా మార్చకుండా దాని బైబిలు రూపాన్ని నిలుపుతుంది.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: బాప్తిస్మమిచ్చే యోహాను
  rationale: βαπτιστήςను కేవలం బిరుదుగా లిప్యంతరీకరించకుండా, యోహాను చేసే కార్యాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὁ δὲ μικρότερος
  choice: అయినా ... అతి చిన్నవాడు
  rationale: δὲ యొక్క వ్యతిరేకతను ‘అయినా’ తెలియజేస్తుంది. μικρότερος రూపానికి తులనాత్మక భావం ఉన్నప్పటికీ, సందర్భంలో రాజ్యంలో అత్యల్ప స్థానం లేదా హోదా గల వ్యక్తిని ‘అతి చిన్నవాడు’ సహజంగా సూచిస్తుంది.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: పరలోక రాజ్యంలో
  rationale: మత్తయి సువార్తలోని స్థిరమైన పదబంధాన్ని ఆధునిక తెలుగులో సుపరిచితమైన విధంగా అందిస్తుంది.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: అతని కంటే గొప్పవాడు
  rationale: యోహానుతో చేసిన ప్రత్యక్ష తులనను స్పష్టంగా నిలుపుతుంది; ‘గొప్ప’ అనేది స్థానం, ప్రాముఖ్యత మొదలైన వాటి విషయంలో మూలంలోని ఉద్దేశపూర్వక విస్తృతతను కాపాడుతుంది.
theological_decisions:
- issue: యోహాను గొప్పతనంతో పరలోక రాజ్యంలో అతి చిన్నవాని గొప్పతనానికి ఉన్న సంబంధం
  choice: రాజ్యంలో అతి చిన్నవాడు యోహాను కంటే గొప్పవాడనే విరుద్ధాభాస తులనను వివరణ జోడించకుండా యథాతథంగా ఉంచడం
  alternative: ఇది పాత నిబంధన–కొత్త నిబంధన కాలాల మధ్య వ్యత్యాసమని లేదా వ్యక్తిగత పవిత్రతకు బదులు రక్షణ చరిత్రలోని స్థానాన్ని సూచిస్తుందని అనువాదంలోనే వివరించడం
  rationale: వచనం ఈ తులనకు కారణాన్ని చెప్పదు. ఏ ప్రత్యేక సిద్ధాంత వివరణనూ చేర్చకుండా మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘ఉద్భవించలేదు’ కొంత ఉన్నత శైలికి చెందిన పదమైనా మూల క్రియలోని భావాన్ని కాపాడుతుంది; దాని ప్రత్యామ్నాయాలను పాదటిప్పణి వివరిస్తుంది. ‘ఎవడూ’ వంటి సందర్భానుకూల పురుషవాచక రూపం కంటే ‘గొప్పవాడెవడూ’ నిర్మాణం యోహానుతో తులనను సంక్షిప్తంగా ఉంచుతుంది.
