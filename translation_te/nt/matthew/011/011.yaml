    rationale: మూలంలో పురుష-నిర్దిష్ట సర్వనామం లేదు. ‘ఎవరూ’ ఆధునిక తెలుగులో సహజంగా ఉండి, సాధారణ మానవ సమూహాన్ని సూచిస్తుంది.
