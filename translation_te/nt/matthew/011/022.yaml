revisions:
- from: 'అయితే నేను మీతో చెబుతున్నాను: తీర్పు దినాన మీకంటే తూరు, సీదోనులకే ఎక్కువ భరించదగినదిగా[a] ఉంటుంది.'
  to: 'అయితే నేను మీతో చెబుతున్నాను: తీర్పు దినాన మీకంటే తూరు, సీదోనులకు మరింత భరించదగినదిగా ఉంటుంది.[a]'
  rationale: The revision corrects the place-name/dative construction, removes unsupported emphasis, and improves the comparative expression. It deliberately retains the impersonal wording and does not introduce an explicit noun such as “punishment,” since the Greek does not state one.
