id: MAT.11.22
reference: Matthew 11:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: te
  text: 'అయితే నేను మీతో చెబుతున్నాను: తీర్పు దినాన మీకంటే తూరు, సీదోనులకు మరింత భరించదగినదిగా ఉంటుంది.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరింత సహించదగినదిగా.’
    reason: ἀνεκτότερον అనే పదానికి సమీపమైన మరో సహజ తెలుగు అనువాదాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: πλὴν
  choice: అయితే
  rationale: ముందున్న ఖండనతో బలమైన వ్యత్యాసాన్ని చూపుతుంది; ఆధునిక తెలుగులో సహజంగా, గంభీరంగా ఉంటుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: యేసు నేరుగా, గంభీరంగా సంబోధిస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: తూరు, సీదోనులకే
  rationale: తులనాత్మక విశేషణంతో వచ్చిన దత్తివిభక్తి, తీర్పును ఎదుర్కొనే పక్షాలను సూచిస్తుంది. ‘కే’ తులనలోని వ్యత్యాసాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ἀνεκτότερον
  choice: ఎక్కువ భరించదగినదిగా
  rationale: భరించగల స్థాయిని సూచించే తులనాత్మక భావాన్ని కాపాడుతుంది; తీర్పు తీవ్రతను మించి మరే ప్రత్యేక శిక్షా సిద్ధాంతాన్నీ చేర్చదు.
- source_word: ἔσται
  choice: ఉంటుంది
  rationale: భవిష్యత్ కాలంలోని అస్థిత్వ/అనుసంధాన క్రియను సరళంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: తీర్పు దినాన
  rationale: భవిష్యత్తులోని న్యాయతీర్పు సందర్భాన్ని సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: ἢ ὑμῖν
  choice: మీకంటే
  rationale: సంబోధించబడిన బహువచన పక్షంతో చేసే తులనను సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: రాబోయే తీర్పు స్వభావం
  choice: తీర్పు దినాన
  alternative: ఒక తీర్పు దినాన
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం లేకపోయినా, మత్తయి సందర్భంలో ఇది గుర్తించబడిన భవిష్యత్ తీర్పు దినాన్ని సూచిస్తుంది. అదనపు సిద్ధాంత వివరాలు చేర్చకుండా ఆ భావాన్ని నిలుపుతుంది.
- issue: తూరు, సీదోనులతో పోలికలో సూచిత అంశం
  choice: అవ్యక్త నిర్మాణాన్ని నిలుపుతూ ‘ఎక్కువ భరించదగినదిగా ఉంటుంది’
  alternative: వారి శిక్ష ఎక్కువ భరించదగినదిగా ఉంటుంది
  rationale: మూలపాఠం ‘శిక్ష’ అనే నామవాచకాన్ని స్పష్టంగా చెప్పదు. అందువల్ల దానిని చేర్చకుండా, తీర్పు తీవ్రతలోని తులనను మాత్రమే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా ఉండి, న్యాయతీర్పు సందర్భానికి తగిన గంభీరతను కాపాడింది. ‘తూరు, సీదోనులు’ అని పట్టణాలను వ్యక్తీకరించడం మూలంలోని సంక్షిప్త దత్తివిభక్తి నిర్మాణాన్ని నిలుపుతుంది.
