revisions:
- from: వారిని అగ్ని కొలిమిలో[a] పడవేస్తారు. అక్కడ ఏడుపు, పండ్లు కొరకడం ఉంటాయి.
  to: వారిని అగ్ని కొలిమిలోకి[a] విసిరివేస్తారు. అక్కడ ఏడుపూ పళ్లు కొరకడమూ ఉంటుంది.
  rationale: The revision corrects the erroneous word for “teeth” (పండ్లు → పళ్లు), retains the Greek judgment imagery without interpretive expansion, and adds the natural Telugu directional suffix for εἰς. “విసిరివేస్తారు” clearly conveys the force of βαλοῦσιν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:34:15Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the future judgment action, the referent “them,” the concrete image of the furnace, and the Matthean formula of weeping and gnashing. However, “పండ్లు” means “fruits,” not “teeth,” and thus materially mistranslates τῶν ὀδόντων. The destination suffix “-లోకి” also more accurately represents εἰς (“into”).
  naturalness: “అగ్ని కొలిమిలోకి” is clear and suitably solemn. “ఏడుపూ పళ్లు కొరకడమూ ఉంటుంది” is modern, intelligible Telugu and preserves the conventional physical idiom without an explanatory paraphrase.
  terminology: “అగ్ని కొలిమి” faithfully reflects κάμινος τοῦ πυρός; the footnote appropriately supplies the idiomatic alternative “మండే కొలిమి.” “పళ్లు కొరకడం” correctly denotes gnashing of teeth; “పండ్లు కొరకడం” denotes biting fruits and must be corrected.
  issues:
  - severity: high
    issue: “పండ్లు కొరకడం” is used for “gnashing of teeth.”
    rationale: పండ్లు means fruits in modern standard Telugu. The Greek τῶν ὀδόντων means “of the teeth”; Telugu requires “పళ్లు.”
  - severity: low
    issue: The directional force of εἰς is not represented explicitly.
    rationale: Adding “-లోకి” to “కొలిమి” naturally conveys “into the furnace.”
  revised_text: వారిని అగ్ని కొలిమిలోకి[a] విసిరివేస్తారు. అక్కడ ఏడుపూ పళ్లు కొరకడమూ ఉంటుంది.
  revised_footnotes:
  - marker: a
    text: లేదా, మరింత నుడికారంగా, “మండే కొలిమిలోకి.” గ్రీకులో అక్షరార్థంగా “అగ్ని కొలిమిలోకి” అని ఉంది.
    reason: lexical_alternative
  revision_rationale: The revision corrects the erroneous word for “teeth” (పండ్లు → పళ్లు), retains the Greek judgment imagery without interpretive expansion, and adds the natural Telugu directional suffix for εἰς. “విసిరివేస్తారు” clearly conveys the force of βαλοῦσιν.
