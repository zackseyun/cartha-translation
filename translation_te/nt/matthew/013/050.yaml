id: MAT.13.50
reference: Matthew 13:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: te
  text: వారిని అగ్ని కొలిమిలోకి[a] విసిరివేస్తారు. అక్కడ ఏడుపూ పళ్లు కొరకడమూ ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత నుడికారంగా, “మండే కొలిమిలోకి.” గ్రీకులో అక్షరార్థంగా “అగ్ని కొలిమిలోకి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσιν
  choice: పడవేస్తారు
  rationale: భవిష్యత్ క్రియలోని బలవంతంగా విసిరివేయడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: αὐτοὺς
  choice: వారిని
  rationale: ముందటి సందర్భంలోని దుష్టులను సూచించే పుంలింగ బహువచన సర్వనామానికి సహజమైన తెలుగు రూపం.
- source_word: κάμινον τοῦ πυρός
  choice: అగ్ని కొలిమిలో
  rationale: గ్రీకు పదబంధంలోని ‘అగ్ని’ మరియు ‘కొలిమి’ అనే స్పష్టమైన తీర్పు చిత్రణను నిలుపుతూ, తెలుగులో సహజమైన సంబంధాన్ని ఇస్తుంది.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: స్థలాన్ని నేరుగా, సహజంగా సూచిస్తూ గ్రీకు అవ్యయానికి సరిపోతుంది.
- source_word: ἔσται
  choice: ఉంటాయి
  rationale: తదుపరి రెండు నామపదాలకు అనుగుణంగా భవిష్యత్ ఉనికిని సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ὁ κλαυθμὸς
  choice: ఏడుపు
  rationale: విలాపంతో కూడిన రోదనను అతిశయింపకుండా, సామాన్యులకు అర్థమయ్యే ఆధునిక పదంతో తెలియజేస్తుంది.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: పండ్లు కొరకడం
  rationale: పళ్లను బిగించి కొరకడం లేదా రాపాడించడం అనే గ్రీకు స్థిరపదబంధపు స్పష్టమైన శారీరక చిత్రణను సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: అంత్యకాల తీర్పు చిత్రణను ఎలా అనువదించాలి
  choice: ‘అగ్ని కొలిమి,’ ‘ఏడుపు,’ ‘పండ్లు కొరకడం’ అనే స్పష్టమైన చిత్రణను యథాతథంగా నిలుపడం
  alternative: ‘మండే కొలిమి’ అని మరింత నుడికారంగా అనువదించడం లేదా బాధను వివరిస్తూ భావానువాదం చేయడం
  rationale: ఈ వాక్యం తీర్పును గంభీరమైన రూపకాలతో తెలియజేస్తుంది. వాటి భావాన్ని మృదువుచేయకుండా, వాటి theological implications ను అదనంగా వివరించకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మత్తయిలో పునరావృతమయ్యే తీర్పు పదబంధపు స్పష్టతను నిలిపింది.
