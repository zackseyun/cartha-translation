base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: te
  text: 'ఆయన జవాబుగా ఇలా అన్నాడు: “మంచి విత్తనం విత్తేవాడు మనుష్యకుమారుడు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మానవుడు.” గ్రీకులోని “మనుష్యకుమారుడు” అనే బిరుదు దానియేలు 7ను ప్రతిధ్వనిస్తుంది; సువార్తల్లో స్థిరపడిన దాని రూపాన్ని, దైవశాస్త్ర సంబంధమైన భావసంపదను నిలుపడానికి ప్రధాన పాఠంలో సంప్రదాయ అనువాదాన్ని ఉంచాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ఆయన జవాబుగా ఇలా అన్నాడు
  rationale: గ్రీకులోని కృదంతం, సమాపక క్రియ కలిసి జవాబును పరిచయం చేస్తున్నాయి. తెలుగులో పదేపదే ‘జవాబిస్తూ అన్నాడు’ అనకుండా, సహజంగా మరియు పూర్తి భావంతో ఈ విధంగా కలిపి అనువదించాం.
- source_word: Ὁ σπείρων
  choice: విత్తేవాడు
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతం, ఆ వ్యక్తిని అతడు చేసే పని ద్వారా గుర్తిస్తుంది. ‘విత్తేవాడు’ ఈ సాధారణ/కొనసాగే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὸ καλὸν σπέρμα
  choice: మంచి విత్తనం
  rationale: καλός ఇక్కడ అందమైనది అనే అర్థం కంటే మంచి, తగిన గుణం గలది అనే అర్థాన్ని ఇస్తుంది. ఏకవచన సమూహార్థకమైన ‘విత్తనం’ను అలాగే ఉంచాం.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: సువార్తల్లో యేసు తనను సూచించడానికి ఉపయోగించే స్థిరమైన బిరుదు ఇది; దానియేలు 7తో ఉన్న ప్రతిధ్వనిని, క్రైస్తవశాస్త్ర సంబంధమైన ప్రాధాన్యాన్ని ఈ సంప్రదాయ తెలుగు రూపం నిలుపుతుంది.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే క్రైస్తవశాస్త్ర బిరుదు అనువాదం
  choice: మనుష్యకుమారుడు
  alternative: మానవుడు / మానవ కుమారుడు
  rationale: ఇది కేవలం సాధారణ మానవుణ్ణి సూచించే మాటగా కాక, సువార్తల్లో స్థిరంగా కనిపించే బిరుదుగా, దానియేలు 7 నేపథ్యంతో వాడబడింది. ‘మనుష్యకుమారుడు’ ఆ అంతర్గ్రంథ సంబంధాన్ని, బిరుదు స్వభావాన్ని వ్యాఖ్యానంతో కుదించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే సహజమైన వాక్యనిర్మాణంతో పాటు, బైబిలు బిరుదుకు తగిన గంభీరతను నిలుపుతుంది.
