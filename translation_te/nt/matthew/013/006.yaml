  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: te
  text: కాని సూర్యుడు ఉదయించగానే అది ఎండ వేడికి మాడిపోయింది; వేరు లేకపోవడంతో ఎండిపోయింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వాడిపోయింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: కాని సూర్యుడు ఉదయించగానే
  rationale: ఈ genitive absolute కాలసంబంధ పరిస్థితిని తెలియజేస్తుంది. δέ లోని స్వల్ప వ్యతిరేకతను ‘కాని’ నిలుపుతుంది; ‘ఉదయించగానే’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: ἐκαυματίσθη
  choice: ఎండ వేడికి మాడిపోయింది
  rationale: καυματίζω యొక్క కర్మణి రూపం తీవ్రమైన వేడివల్ల కాలిపోవడం లేదా మాడిపోవడాన్ని సూచిస్తుంది. మొక్కల సందర్భంలో ‘ఎండ వేడికి మాడిపోయింది’ కారణాన్ని సహజంగా స్పష్టం చేస్తుంది.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: లేకపోవడంతో
  rationale: διά + articular infinitive కారణాన్ని వ్యక్తపరుస్తుంది. తెలుగులో ‘లేకపోవడంతో’ అదే కారణసంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ῥίζαν
  choice: వేరు
  rationale: గ్రీకు మూలంలో ఏకవచనం ఉంది; మొక్కకు పాతుకునే వేరు లేకపోవడాన్ని తెలుగులో ‘వేరు’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐξηράνθη
  choice: ఎండిపోయింది
  rationale: ξηραίνω మొక్కల సందర్భంలో ఎండిపోవడం లేదా వాడిపోవడం అనే భావం కలిగి ఉంది. ‘ఎండిపోయింది’ మూలపదానికి నేరుగా సరిపోతూ ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
