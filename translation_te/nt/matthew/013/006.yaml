translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన వ్యవసాయ చిత్రణను ఉపయోగించాం. ఆంగ్ల సంప్రదింపు పాఠంలో [a] గుర్తు ‘సూర్యుడు ఉదయించాడు’ అన్న భాగానికి కనిపించినా, ఇచ్చిన ప్రత్యామ్నాయం ἐξηράνθηకు సంబంధించినది కనుక మూలభాష ఆధారంగా గుర్తును ‘ఎండిపోయింది’ తరువాత ఉంచాం.
