id: MAT.13.34
reference: Matthew 13:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: te
  text: యేసు ఈ సంగతులన్నిటినీ జనసమూహాలకు ఉపమానాల ద్వారా చెప్పాడు; ఉపమానం లేకుండా ఆయన వారికి ఏమీ చెప్పేవాడు కాదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉపమానం లేకుండా ఆయన వారికి ఏమీ చెప్పలేదు.” గ్రీకులోని అసంపూర్ణ భూతకాల క్రియను అలవాటుగా జరిగిన చర్యగానో, సాధారణ భూతకాలంగానో అర్థం చేసుకోవచ్చు.
    reason: వ్యాకరణ ప్రత్యామ్నాయం
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: ఈ సంగతులన్నిటినీ
  rationale: సూచనార్థకమైన Ταῦτα భావాన్నీ, πάντα యొక్క సమగ్రతనూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐλάλησεν
  choice: చెప్పాడు
  rationale: ఇక్కడి ఏకకాల భూతరూపం యేసు చేసిన బోధనను సమగ్రంగా సంక్షిప్తీకరిస్తుంది; తెలుగులో ‘చెప్పాడు’ సహజంగా ఉంటుంది.
- source_word: ἐν παραβολαῖς
  choice: ఉపమానాల ద్వారా
  rationale: ἐν ఇక్కడ విధానం లేదా మాధ్యమాన్ని సూచిస్తుంది; ‘ద్వారా’ ఆధునిక తెలుగులో ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τοῖς ὄχλοις
  choice: జనసమూహాలకు
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక పదప్రయోగం.
- source_word: χωρὶς παραβολῆς
  choice: ఉపమానం లేకుండా
  rationale: χωρίς యొక్క ‘లేకుండా’ భావాన్నీ, παραβολῆς ఏకవచనాన్నీ కాపాడుతుంది.
- source_word: οὐδὲν ἐλάλει
  choice: ఏమీ చెప్పేవాడు కాదు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని అలవాటుగా లేదా ఆ సందర్భంలో నిరంతరంగా జరిగిన చర్య భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: ముందు పేర్కొన్న జనసమూహాలను తిరిగి సూచించే సర్వనామాన్ని సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: రెండవ వాక్యభాగంలోని ἐλάλει అసంపూర్ణ భూతకాల రూపం
  choice: యేసు ఆ సందర్భంలో జనసమూహాలకు ఉపమానం లేకుండా ఏమీ చెప్పడం ఆయన పద్ధతి కాదనే customary భావాన్ని ‘చెప్పేవాడు కాదు’తో నిలిపాం.
  alternative: ‘ఏమీ చెప్పలేదు’ అని సాధారణ భూతకాలంగా అనువదించవచ్చు.
  rationale: గ్రీకు రూపం కొనసాగుతున్న లేదా అలవాటైన చర్యను సూచించగలదు. సందర్భం యేసు బహిరంగ బోధనా విధానాన్ని నొక్కి చెబుతున్నందున, తెలుగులో customary past సహజంగానూ మూలానికి సన్నిహితంగానూ ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం. ‘ఉపమానం’ అనే పరిచిత బైబిలు పదాన్ని ఉపయోగించాం; గ్రీకు బహువచనమైన ‘జనసమూహాలు’ను నిలిపాం.
