  text: καὶ ἐλάλησεν αὐτοῖς πολλὰ ἐν παραβολαῖς λέγων· Ἰδοὺ ἐξῆλθεν ὁ σπείρων τοῦ σπείρειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/003.yaml
  text: 'And he spoke many things to them in parables, saying: “Look, the sower went out to sow.”'
translation:
  language: te
  text: 'ఆయన ఉపమానాల ద్వారా వారికి అనేక విషయాలు చెబుతూ ఇలా అన్నాడు: “ఇదిగో, విత్తేవాడు విత్తడానికి బయలుదేరాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παραβολαῖς
  choice: ఉపమానాల ద్వారా
  rationale: గ్రీకు పదబంధం యేసు బోధించిన విధానాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండేలా ‘ద్వారా’తో అనువదించబడింది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని ఆకర్షించే గ్రీకు సూచన పదంలోని బలాన్ని, గౌరవప్రదమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: ὁ σπείρων
  choice: విత్తేవాడు
  rationale: వర్తమాన కృదంతం ఇక్కడ వ్యక్తిని నామవాచకంగా సూచిస్తోంది; ‘విత్తేవాడు’ ఆ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐξῆλθεν ... τοῦ σπείρειν
  choice: విత్తడానికి బయలుదేరాడు
  rationale: గ్రీకులోని బయలుదేరడం మరియు దాని ఉద్దేశం రెండింటినీ స్పష్టంగా, సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని దృష్టి-ఆహ్వానాన్ని ‘ఇదిగో’తో నిలిపి ఉంచింది.
