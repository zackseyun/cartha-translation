id: MAT.13.41
reference: Matthew 13:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: te
  text: మనుష్యకుమారుడు తన దూతలను పంపుతాడు; వారు ఆయన రాజ్యం నుండి పాపానికి కారణమయ్యే సమస్తాన్నీ[a], అధర్మాన్ని ఆచరించేవారినీ[b] ఏరి పోగుచేస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తొట్రుపాట్లన్నిటినీ.” గ్రీకు పదం పాపానికి కారణమయ్యేవాటిని లేదా విశ్వాసం నుండి తొలగిపోవడానికి కారణమయ్యేవాటిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అధర్మం చేసేవారిని.” ఇక్కడి పదప్రయోగం ధర్మాన్ని ధిక్కరించే నిరంతరమైన, లక్షణాత్మక ప్రవర్తనను నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: పంపుతాడు
  rationale: భవిష్యత్ కార్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; దూతలను నియోగించి పంపడం సందర్భం వల్ల స్పష్టమవుతుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: మత్తయిలో యేసు ఉపయోగించే స్థిరమైన బిరుదును, దానియేలు గ్రంథంతో ఉన్న అంతర్గ్రంథ సంబంధాన్ని కాపాడుతుంది.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: తన దూతలను
  rationale: తీర్పుకు సంబంధించిన ఈ సందర్భంలో ἄγγελοι పరలోక దూతలను సూచిస్తుంది. కర్తతో సంబంధాన్ని తెలుగులో సహజంగా చూపేందుకు ‘తన’ వాడబడింది.
- source_word: συλλέξουσιν ἐκ
  choice: రాజ్యంలోనుండి ... ఏరి పోగుచేస్తారు
  rationale: ἐκ సూచించే లోపలినుండి వేరు చేయడాన్నీ, συλλέγωలోని సమకూర్చే భావాన్నీ, పంటకోత రూపకాన్నీ కలిపి వ్యక్తం చేస్తుంది.
- source_word: πάντα τὰ σκάνδαλα
  choice: పాపంలో పడేలా చేసేవాటన్నిటినీ
  rationale: σκάνδαλα ఇతరులు పాపంలో పడటానికి లేదా విశ్వాసం విడిచిపెట్టటానికి కారణమయ్యే వ్యక్తులు, ప్రభావాలు, లేదా విషయాలను సూచించగలదు. తెలుగు పదబంధం దాని క్రియాశీల భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: అధర్మాన్ని ఆచరించేవారిని
  rationale: వర్తమాన కృదంతం సూచించే నిరంతర లేదా అలవాటైన ప్రవర్తనను ‘ఆచరించేవారు’ తెలియజేస్తుంది; ἀνομία యొక్క నైతిక-దైవశాస్త్రీయ భావాన్ని ‘అధర్మం’ సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే బిరుదు
  choice: మనుష్యకుమారుడు
  alternative: మానవుడు
  rationale: సాంప్రదాయిక బిరుదు యేసు స్వీయ-సూచననూ దానియేలు 7తో సంభావ్య సంబంధాన్నీ కాపాడుతుంది; ప్రత్యామ్నాయం ఆ బిరుదు ప్రత్యేకతను బలహీనపరుస్తుంది.
- issue: σκάνδαλα యొక్క పరిధి
  choice: పాపంలో పడేలా చేసేవాటన్నిటినీ
  alternative: తొట్రుపాటులన్నిటినీ
  rationale: మూలపదం కేవలం మనస్తాపాలను కాక, పాపానికి లేదా పతనానికి కారణమయ్యే వ్యక్తులు, ప్రభావాలు, విషయాలను కలుపుకోగలదు. ప్రధాన పాఠం ఈ విస్తృత కారణార్థాన్ని స్పష్టం చేస్తుంది.
- issue: ἀνομίαలోని ప్రవర్తనా భావం
  choice: అధర్మాన్ని ఆచరించేవారు
  alternative: అధర్మం చేసేవారు
  rationale: ‘ఆచరించేవారు’ అనేది ఒక్కో విడి చర్యకన్నా కొనసాగుతున్న, లక్షణాత్మక తిరుగుబాటు ప్రవర్తనను సూచిస్తుంది; అయితే వ్యక్తుల అంతిమ ఉద్దేశాలపై అదనపు తీర్పును చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘మనుష్యకుమారుడు,’ ‘దూతలు,’ ‘అధర్మం’ వంటి సుపరిచిత బైబిలు పదాలను నిలుపుతూ, క్లిష్టమైన σκάνδαλα భావాన్ని సాధారణ పాఠకుడికి స్పష్టమైన పదబంధంతో అందించింది. మూలంలోని ఒకే వాక్య నిర్మాణాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించడం అర్థస్పష్టత కోసం మాత్రమే; భావసంబంధం యథాతథంగా ఉంది.
