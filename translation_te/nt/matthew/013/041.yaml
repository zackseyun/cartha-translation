review_pass:
  verdict: revise
  source_fidelity: The verse correctly retains the future action, the titular expression ‘మనుష్యకుమారుడు,’ the angels, removal ‘from/out of’ his kingdom, and the habitual force of ‘అధర్మాన్ని ఆచరించేవారు.’ However, ‘పాపంలో పడేలా చేసేవాటన్నిటినీ’ unnecessarily narrows σκάνδαλα to occasions of sin and, by ‘వాట,’ can sound limited to impersonal objects, whereas the source term has the broader sense of stumbling-causes.
  naturalness: The draft is generally clear and idiomatic. ‘ఏరి పోగుచేస్తారు’ suits the harvest imagery. A semicolon better preserves the Greek’s close connection between sending the angels and their gathering work while remaining natural Telugu.
  terminology: ‘మనుష్యకుమారుడు,’ ‘దూతలు,’ and ‘అధర్మం’ are appropriate established biblical terms in modern standard Telugu. ‘పాపానికి కారణమయ్యే సమస్తం’ is a natural, inclusive rendering for σκάνδαλα; the footnote preserves the more literal alternative.
  issues:
  - severity: medium
    issue: The main rendering of σκάνδαλα is too narrow and potentially excludes personal causes.
    rationale: ‘పాపంలో పడేలా చేసేవాటన్నిటినీ’ specifies sin rather than the broader stumbling/falling sense and ‘వాట’ tends to refer to things. The Greek can denote all that causes stumbling, without restricting the referent in this way.
  revised_text: మనుష్యకుమారుడు తన దూతలను పంపుతాడు; వారు ఆయన రాజ్యం నుండి పాపానికి కారణమయ్యే సమస్తాన్నీ[a], అధర్మాన్ని ఆచరించేవారినీ[b] ఏరి పోగుచేస్తారు.
