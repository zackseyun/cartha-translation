revisions:
- from: మనుష్యకుమారుడు తన దూతలను పంపుతాడు. వారు ఆయన రాజ్యంలోనుండి పాపంలో పడేలా చేసేవాటన్నిటినీ[a], అధర్మాన్ని ఆచరించేవారినీ[b] ఏరి పోగుచేస్తారు.
