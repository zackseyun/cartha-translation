  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: te
  text: వారి అవిశ్వాసం వల్ల ఆయన అక్కడ అనేక శక్తికార్యాలు[a] చేయలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అనేక అద్భుతాలు’ లేదా ‘అనేక శక్తి కార్యాలు.’ గ్రీకు పదం శక్తిని ప్రదర్శించే కార్యాలను సూచిస్తుంది; ఈ సందర్భంలో అది అద్భుత కార్యాలను సూచిస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: చేయలేదు
  rationale: ποιέω అనే విస్తృతార్థక క్రియకు ఈ పదబంధంలో ‘చేయు’ సహజమైన సమానం. οὐκ క్రియను నిరాకరిస్తుంది. వాక్యారంభంలోని καί కథన కొనసాగింపును సూచిస్తుంది; తెలుగులో ప్రత్యేక సంధానపదం లేకుండానే ఆ కొనసాగింపు సహజంగా వ్యక్తమవుతుంది.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: యేసు ఉన్న స్వస్థలాన్ని సూచించే సూటి స్థలవాచక క్రియావిశేషణం.
- source_word: δυνάμεις πολλὰς
  choice: అనేక శక్తికార్యాలు
  rationale: సువార్తలలో δύναμις శక్తి ప్రత్యక్షమయ్యే కార్యాలను, ఈ సందర్భంలో అద్భుత కార్యాలను, సూచిస్తుంది. ‘శక్తికార్యాలు’ మూలపదంలోని శక్తి భావాన్ని నిలుపుతుంది; πολλὰς‌ను ‘అనేక’గా అనువదించాం.
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: వారి అవిశ్వాసం వల్ల
  rationale: Accusativeతో వచ్చిన διά ఇక్కడ కారణాన్ని తెలియజేస్తుంది. ἀπιστίαలోని ప్రతికూల భావాన్ని ‘అవిశ్వాసం’ నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఈ వాక్యం యేసు అద్భుతాలు చేయలేకపోయాడని చెబుతుందా, లేక చేయలేదని మాత్రమే చెబుతుందా?
  choice: ఆయన ‘చేయలేదు’ అని అనువదించాం.
  alternative: ఆయన ‘చేయలేకపోయాడు’ అని అనువదించడం.
  rationale: గ్రీకు పాఠంలో οὐκ ἐποίησεν అంటే ‘చేయలేదు’; అసమర్థతను తెలిపే క్రియ లేదు. కాబట్టి మత్తయి చెప్పినదానికంటే బలమైన అసమర్థత భావాన్ని చేర్చకుండా, కార్యం జరగలేదనే స్థాయిలోనే అనువాదం ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. ‘శక్తికార్యాలు’ మూలంలోని శక్తి భావాన్ని కాపాడుతూ, పాదసూచికలో మరింత సాధారణమైన ‘అద్భుతాలు’ అనే ప్రత్యామ్నాయం ఇవ్వబడింది.
