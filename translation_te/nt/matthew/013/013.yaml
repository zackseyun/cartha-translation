id: MAT.13.13
reference: Matthew 13:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: te
  text: అందుకే నేను వారికి ఉపమానాల ద్వారా మాట్లాడుతున్నాను; ఎందుకంటే వారు చూస్తూనే చూడరు, వింటూనే వినరు, అర్థం చేసుకోరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందుకే
  rationale: యేసు ఉపమానాల ద్వారా మాట్లాడటానికి గల కారణాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు పదబంధంలోని కారణార్థాన్ని నిలుపుతుంది.
- source_word: ἐν παραβολαῖς
  choice: ఉపమానాల ద్వారా
  rationale: మాట్లాడే విధానాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. ‘ఉపమానాలలో’ అనే మరింత రూపసామ్య అనువాదం కంటే ఇది స్పష్టంగా ఉంటుంది.
- source_word: αὐτοῖς λαλῶ
  choice: నేను వారికి … మాట్లాడుతున్నాను
  rationale: దత్తివ సర్వనామాన్ని ‘వారికి’గా, వర్తమాన క్రియను సందర్భానికి తగిన కొనసాగుతున్న వర్తమాన రూపంలో అందిస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: తరువాతి వాక్యభాగం కారణాన్ని ఇస్తున్నదనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: βλέποντες οὐ βλέπουσιν
  choice: వారు చూస్తూనే చూడరు
  rationale: అదే ధాతువును రెండుసార్లు ఉపయోగించిన గ్రీకు విరోధాభాసాన్ని కాపాడుతూ, తెలుగులో సహజమైన ‘-తూనే’ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: వింటూనే వినరు
  rationale: ముందటి భాగానికి సమాంతరంగా గ్రీకు పునరుక్తి మరియు విరోధాభాసాన్ని నిలుపుతుంది.
- source_word: οὐδὲ συνίουσιν
  choice: అర్థం చేసుకోరు
  rationale: చూసినదీ విన్నదీ యొక్క భావాన్ని గ్రహించకపోవడాన్ని సాధారణ పాఠకులకు స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: βλέποντες మరియు ἀκούοντες అనే వర్తమాన కృదంతాల భావబలం
  choice: ‘చూస్తూనే’, ‘వింటూనే’ అని అనువదించి విరోధాభాసాన్ని నిలిపాం
  alternative: ‘చూస్తున్నప్పటికీ’, ‘వింటున్నప్పటికీ’ అని స్పష్టమైన concessive భావంతో అనువదించడం; లేదా ‘చూస్తూ’, ‘వింటూ’ అని మరింత రూపసామ్యంగా అనువదించడం
  rationale: గ్రీకు కృదంతాలు స్వయంగా concessive సంబంధాన్ని పూర్తిగా నిర్దేశించవు. ‘-తూనే’ రూపం సందర్భంలోని వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది గాని, శారీరక గ్రహణం మరియు అంతర్గత గ్రహింపు గురించి వివరణను అనువాదంలో అతిగా నిర్ణయించదు.
- issue: συνίουσιν యొక్క సందర్భార్థం
  choice: ‘అర్థం చేసుకోరు’
  alternative: ‘గ్రహించరు’
  rationale: వినబడినదాని లేదా చూడబడినదాని భావాన్ని పట్టుకోకపోవడాన్ని సూచిస్తుంది. ‘అర్థం చేసుకోరు’ స్పష్టంగా ఉండి, పాఠ్యంలో లేని ప్రత్యేక సిద్ధాంతపరమైన వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభమైనప్పటికీ గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని కారణ సంబంధం, సమాంతర నిర్మాణం, విరోధాభాసం కాపాడబడ్డాయి.
