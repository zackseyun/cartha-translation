id: MAT.13.33
reference: Matthew 13:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: te
  text: 'ఆయన వారికి మరొక ఉపమానం చెప్పాడు: “పరలోక రాజ్యం పులియబెట్టే ముద్దవంటిది[a]; ఒక స్త్రీ దానిని తీసుకొని మూడు కొలతల పిండిలో[b] దాచిపెట్టింది[c], పిండి అంతా పులిసే వరకు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈస్ట్.” గ్రీకు పదం పిండిని పులియబెట్టే పదార్థాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “మూడు సాతుల పిండి”; ఇది చాలా పెద్ద పరిమాణం.
    reason: cultural_note
  - marker: c
    text: “కలిపింది” లేదా “కలగలిపింది” అని కూడా అనువదించవచ్చు; గ్రీకులో అక్షరార్థంగా “లోపల దాచిపెట్టింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: ఆయన వారికి మరొక ఉపమానం చెప్పాడు
  rationale: అదనంగా చెప్పిన ఉపమానం అనే భావాన్ని సహజమైన తెలుగు కథన శైలిలో వ్యక్తం చేస్తుంది.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి సువార్తలోని ఈ స్థిరమైన యూదీయ ప్రయోగాన్ని ఆధునిక తెలుగు పాఠకులకు సుపరిచితమైన రూపంలో అందిస్తుంది; గ్రీకు బహువచనాన్ని కృత్రిమంగా అనుకరించదు.
- source_word: ζύμῃ
  choice: పులిసిన పిండి
  rationale: పిండిని పులియబెట్టడానికి ఉపయోగించే ζύμη అనే పులియబెట్టే పదార్థాన్ని గృహవంట సందర్భానికి తగిన సహజ తెలుగు పదబంధంతో సూచిస్తుంది.
- source_word: ἐνέκρυψεν εἰς
  choice: పిండిలో దాచిపెట్టింది
  rationale: ἐγκρύπτω యొక్క ‘లోపల దాచు’ అనే స్పష్టమైన పదార్థాన్ని నిలుపుతుంది; ‘కలిపింది’ అనే వివరణాత్మక భావాన్ని ప్రధాన పాఠ్యంలోకి తీసుకురాదు.
- source_word: ἀλεύρου σάτα τρία
  choice: మూడు కొలతల పిండి
  rationale: σάτα అనే ప్రాచీన పరిమాణాన్ని అస్పష్టమైన లిప్యంతరీకరణతో కాక చదవడానికి సులభమైన విధంగా ఇస్తూ, ఖచ్చితమైన సాంస్కృతిక వివరాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: అదంతా పులిసే వరకు
  rationale: గ్రీకు నిష్క్రియ క్రియారూపం మరియు ὅλον సూచించే మొత్తం పరిమాణాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: రాజ్య ఉపమానంలో ζύμη యొక్క సానుకూల లేదా ప్రతికూల భావం
  choice: ‘పులిసిన పిండి’ అని విలువనిర్ణయం లేకుండా అనువదించడం
  alternative: ఇతర బైబిల్ సందర్భాల ఆధారంగా దీన్ని చెడుకు చిహ్నంగా లేదా ఈ సందర్భంలో తప్పనిసరిగా మేలుకు చిహ్నంగా వివరిస్తూ అనువదించడం
  rationale: ఈ వచనంలోని పోలిక దాగి ఉండి మొత్తం పిండిని వ్యాపించే పులియబెట్టే పదార్థంపై ఆధారపడుతుంది. అనువాదం దాని నైతిక లేదా సిద్ధాంతపరమైన విలువను ముందుగానే నిర్ణయించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘పరలోక రాజ్యం’ అనే సుపరిచిత బైబిలు ప్రయోగం నిలుపబడింది; ప్రాచీన కొలత మరియు వంటకు సంబంధించిన ప్రత్యామ్నాయ పదాలు పాదసూచికల్లో వివరించబడ్డాయి.
