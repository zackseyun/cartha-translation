  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί, ὥστε αὐτὸν ⸀εἰς πλοῖον ἐμβάντα καθῆσθαι, καὶ πᾶς ὁ ὄχλος ἐπὶ τὸν αἰγιαλὸν εἱστήκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: te
  text: ఆయన దగ్గరకు అనేక జనసమూహాలు చేరాయి. దాంతో ఆయన ఒక పడవలోకి ఎక్కి కూర్చున్నాడు[a]; జనమంతా ఒడ్డున[b] నిలబడి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పడవలోకి ప్రవేశించి కూర్చున్నాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తీరంలో” లేదా “సముద్రతీరాన.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτὸν
  choice: ఆయన దగ్గరికి … చేరుకున్నాయి
  rationale: కర్తరహిత రూపాన్ని తెలుగులో సహజమైన అకర్మక భావంతో అనువదించాం; πρός సూచించే ఆయనవైపు కదలికను ‘దగ్గరికి’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὄχλοι πολλοί
  choice: పెద్ద జనసమూహాలు
  rationale: బహువచనమైన ὄχλοιను నిలుపుతూ, πολλοί సందర్భంలో జనసమూహాల విస్తారాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὥστε
  choice: అందువల్ల
  rationale: తరువాతి చర్య ముందటి పరిస్థితి వల్ల కలిగిన ఫలితమని స్పష్టంగా చూపిస్తుంది.
- source_word: εἰς πλοῖον ἐμβάντα καθῆσθαι
  choice: ఒక పడవ ఎక్కి కూర్చున్నాడు
  rationale: పడవలో ప్రవేశించి కూర్చోవడాన్ని ఆధునిక తెలుగులో సహజమైన క్రమబద్ధ చర్యగా తెలియజేస్తుంది.
- source_word: πᾶς ὁ ὄχλος
  choice: జనమంతా
  rationale: ముందు పేర్కొన్న అనేక జనసమూహాలను ఇక్కడ ఒక సమష్టిగా సూచించే గ్రీకు ఏకవచన భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: ఒడ్డున
  rationale: αἰγιαλός సూచించే నీటి అంచు లేదా తీరాన్ని నిర్దిష్టతను అతిగా పెంచకుండా తెలియజేసే సాధారణ తెలుగు పదం.
- source_word: εἱστήκει
  choice: నిలబడి ఉన్నారు
  rationale: గుంపు అక్కడ నిలిచి ఉన్న దృశ్యస్థితిని గ్రీకు క్రియ యొక్క కొనసాగుతున్న భావానికి అనుగుణంగా వ్యక్తం చేస్తుంది.
