translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘జనమంతా … ఉన్నారు’ అనే భావానుసార బహువచన ప్రయోగం తెలుగులో సహజంగా ఉంది.
