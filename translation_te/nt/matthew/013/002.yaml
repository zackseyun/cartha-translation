    text: లేదా, “పడవలోకి ప్రవేశించి కూర్చున్నాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తీరంలో” లేదా “సముద్రతీరాన.”
    reason: lexical_alternative
  revision_rationale: The revision makes the result relationship of ὥστε more precise in natural Telugu and renders πολλοί as «అనేక» while retaining the plural «జనసమూహాలు». It preserves the source's collective shift to «జనమంతా», the boat-and-sitting sequence, and the shore imagery. Footnote anchors remain attached to the relevant expressions.
