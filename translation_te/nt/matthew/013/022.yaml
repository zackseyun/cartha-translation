id: MAT.13.22
reference: Matthew 13:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: te
  text: ముళ్ల మధ్య విత్తబడినవాడు వాక్యాన్ని వినేవాడే; అయితే ఈ యుగపు చింత[a], సంపద యొక్క మోసపూరితత్వం[b] ఆ వాక్యాన్ని ఉక్కిరిబిక్కిరి చేస్తాయి; దాంతో అతడు ఫలంలేనివాడవుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ లోకపు చింతలు.’ గ్రీకులో మరింత అక్షరార్థంగా ‘ఈ యుగపు చింత’ అని ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ధనసంపద యొక్క మోసం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: ముళ్ల మధ్య విత్తబడినవాడు
  rationale: గ్రీకు వాక్యంలోని పుంలింగ ఏకవచన కృదంతం ఉపమాన వివరణలో వ్యక్తిని సూచిస్తుంది. ‘ముళ్ల మధ్య’ సహజమైన తెలుగు ప్రయోగం; విత్తనం ముళ్లలో పడిన దృశ్యాన్ని నిలుపుతుంది.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: అతడు వాక్యాన్ని వినేవాడు
  rationale: వర్తమాన కృదంతాన్ని తెలుగులో సహజమైన సంబంధార్థక నిర్మాణంగా ఇచ్చాం. λόγοςను ఈ సందర్భంలో ప్రకటించబడిన సందేశాన్ని సూచించే ‘వాక్యం’గా ఉంచాం.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: ఈ యుగపు చింత
  rationale: μέριμναలోని ఆందోళనతో కూడిన శ్రద్ధ లేదా చింత అనే ప్రతికూల భావాన్ని ‘చింత’ తెలియజేస్తుంది. αἰώνకు భౌతిక ప్రపంచం కంటే కాలపరమైన ‘యుగం’ మరింత సన్నిహితమైన అర్థం.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: సంపద మోసం
  rationale: ఈ గ్రీకు షష్ఠీ నిర్మాణం సంపదలోని మోసపూరిత స్వభావాన్ని సూచిస్తుంది. ‘సంపద మోసం’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: συμπνίγει
  choice: ఉక్కిరిబిక్కిరి చేస్తాయి
  rationale: ఈ క్రియ చుట్టుముట్టి ఊపిరాడకుండా చేయడం లేదా అణచివేయడం అనే బలమైన చిత్రాన్ని కలిగి ఉంది. ముళ్లు మొక్కను కమ్మి పెరగనివ్వని వ్యవసాయ రూపకాన్ని ‘ఉక్కిరిబిక్కిరి చేస్తాయి’ నిలుపుతుంది.
- source_word: ἄκαρπος γίνεται
  choice: అతడు ఫలించనివాడవుతాడు
  rationale: వివరణలో ప్రధాన సూచన వాక్యాన్ని వినే వ్యక్తికే కాబట్టి పుంలింగ వ్యక్తిగత రూపాన్ని నిలిపాం. ఇది వాక్యమే ఫలించదనే అపార్థాన్ని నివారిస్తుంది.
theological_decisions:
- issue: αἰών పదం అనువాదం
  choice: ఈ యుగం
  alternative: ఈ లోకం
  rationale: αἰών ప్రధానంగా ఒక యుగాన్ని లేదా కాలవ్యవస్థను సూచిస్తుంది. ‘ఈ యుగం’ కొత్త నిబంధనలో కనిపించే కాలపరమైన, నైతిక వ్యత్యాసాన్ని నిలుపుతుంది; సందర్భానుసారంగా సాధ్యమైన ‘ఈ లోకం’ను పాదసూచికలో ఇచ్చాం.
- issue: ఉపమాన వివరణలో వ్యక్తిగత లేదా వస్తుగత సూచన
  choice: అతడు ఫలించనివాడవుతాడు
  alternative: అది ఫలించకుండా పోతుంది / వాక్యం ఫలించకుండా పోతుంది
  rationale: విత్తబడిన దాని రూపకంతో వాక్యం మొదలైనా, యేసు దానిని ‘వాక్యాన్ని వినేవాడు’గా వివరిస్తున్నాడు. చివరి భాగాన్ని వ్యక్తిగతంగా అనువదించడం ఆ వివరణాత్మక మార్పును నిలుపుతుంది; వాక్యంలోనే అంతర్గత వైఫల్యం ఉందనే భావాన్ని కలిగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘వాక్యం,’ ‘యుగం,’ ‘ఫలించనివాడు’ వంటి కీలక రూపక, ధార్మిక పదాలను నిలుపుతూ, కఠినమైన అక్షరానువాద నిర్మాణాలను నివారించాం.
