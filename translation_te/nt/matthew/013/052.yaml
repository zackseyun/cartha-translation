id: MAT.13.52
reference: Matthew 13:52
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: te
  text: ఆయన వారితో, “అందువల్ల పరలోక రాజ్యం కోసం శిక్షణ పొందిన[a] ప్రతి శాస్త్రి, తన నిధి[c] నుండి కొత్తవాటినీ పాతవాటినీ బయటికి తీసే గృహాధిపతి[b]లా ఉన్నాడు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరలోక రాజ్యానికి శిష్యుడిగా చేయబడిన.” గ్రీకు పదం శిష్యునిగా చేయబడటం అనే భావంతో పాటు బోధించబడటం లేదా శిక్షణ పొందటం అనే భావాన్నీ ఇవ్వగలదు.
    reason: alternative_reading
  - marker: b
    text: లేదా “ఇంటి పెద్ద,” “ఇంటి యజమాని.”
    reason: lexical_alternative
  - marker: c
    text: “నిధి” అనే పదం విలువైన వస్తువులను దాచిపెట్టే భాండాగారం లేదా నిల్వగది అనే భావాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: అందువల్ల
  rationale: ముందటి సంభాషణతో ఉన్న తార్కిక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πᾶς γραμματεὺς
  choice: ప్రతి శాస్త్రి
  rationale: γραμματεύς అనే పదానికి నేరుగా సరిపడే పదాన్ని ఉంచుతూ, ధర్మశాస్త్ర నిపుణుడు అనే సందర్భార్థాన్ని అతిగా విప్పి చెప్పకుండా కాపాడుతుంది.
- source_word: μαθητευθεὶς τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: పరలోక రాజ్యం కోసం శిక్షణ పొందిన
  rationale: నిష్క్రియ రూపంలోని శిక్షణ/శిష్యత్వ భావాన్ని, అసాధారణమైన దత్తివ విభక్తి సూచించే సంబంధం లేదా దిశను సహజంగా వ్యక్తం చేస్తుంది; ‘శిష్యుడిగా చేయబడిన’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: ఇంటి యజమాని
  rationale: ఇల్లు లేదా కుటుంబ వ్యవహారాలపై అధికారం కలిగిన వ్యక్తి అనే రూపకాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκβάλλει
  choice: బయటికి తీసే
  rationale: ఇక్కడ బలవంతంగా విసరడం కాక, నిల్వలో ఉన్న వాటిని వెలికి తేవడం భావం సందర్భానికి సరిపోతుంది.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: తన నిధి నుండి
  rationale: θησαυρός లోని విలువైన సంపద అనే భావాన్ని కాపాడుతుంది; భాండాగారం లేదా నిల్వగది అనే సాధ్యమైన స్థలార్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: καινὰ καὶ παλαιά
  choice: కొత్తవాటినీ పాతవాటినీ
  rationale: గ్రీకు మూలంలోని క్రమాన్ని, నామవాచకం లేని నపుంసక బహువచన రూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: μαθητευθεὶς అనే పదానికి శిక్షణ మరియు శిష్యత్వం మధ్య ఉన్న భావ పరిధి
  choice: పరలోక రాజ్యం కోసం శిక్షణ పొందిన శాస్త్రి
  alternative: పరలోక రాజ్యానికి శిష్యుడిగా చేయబడిన శాస్త్రి
  rationale: ప్రధాన పాఠం రూపుదిద్దబడటం/బోధించబడటం అనే విస్తృత భావాన్ని చదవదగిన రీతిలో ఇస్తుంది; రాజ్యంలోకి మారుమనస్సు పొందడం మాత్రమే అని పరిమితం చేయకుండా శిష్యత్వ భావాన్ని పాదసూచికలో కాపాడుతుంది.
- issue: οἰκοδεσπότης సూచించే సామాజిక పాత్ర
  choice: ఇంటి యజమాని
  alternative: ఇంటి పెద్ద; గృహాధిపతి
  rationale: రూపకంలోని గృహ నిర్వహణాధికారాన్ని తెలియజేస్తూ, తరువాతి కాలపు సామాజిక లేదా సిద్ధాంతపరమైన భావాలను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘శాస్త్రి’ మూలపదానికి దగ్గరగా ఉండగా, ‘ఇంటి యజమాని’ మరియు ‘బయటికి తీసే’ రూపకాన్ని సహజంగా ఉంచుతాయి. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వద్ద ప్రధాన పాఠంలో చేర్చబడ్డాయి.
