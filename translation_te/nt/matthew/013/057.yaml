id: MAT.13.57
reference: Matthew 13:57
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: te
  text: వారు ఆయన పట్ల అభ్యంతరపడ్డారు.[a] అయితే యేసు వారితో, “ప్రవక్త తన స్వస్థలంలోను తన ఇంటివారి మధ్యను తప్ప మరెక్కడా అగౌరవానికి గురికాడు” అని అన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ఆయనవల్ల అభ్యంతరానికి గురయ్యారు”; అక్షరార్థంగా, “వారు ఆయనలో తడబడ్డారు.”
    reason: lexical_alternative
  - marker: b
    text: “స్వస్థలం” అనే మాటకు “సొంత ఊరు,” “స్థానిక ప్రాంతం,” లేదా “మాతృభూమి” అనే అర్థాలు ఉండవచ్చు. “తన ఇంటివారి మధ్య”ను “తన సొంత ఇంటిలో” అని కూడా అనువదించవచ్చు; గ్రీకు పదం ఇల్లును గానీ, ఇంటివారిని లేదా కుటుంబ వర్గాన్ని గానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: ఆయనను బట్టి అభ్యంతరపడ్డారు
  rationale: ఇక్కడ క్రియాపదబంధం అక్షరార్థమైన తడబడటాన్ని కాకుండా యేసు విషయమై అభ్యంతరం చెంది ఆయనను అంగీకరించకపోవడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం సంబంధాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: అయితే యేసు వారితో ... అన్నాడు
  rationale: δέ వారి అభ్యంతరానికి యేసు మాటకు మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ ఆ సంభాషణ మలుపును సహజంగా చూపిస్తుంది.
- source_word: προφήτης
  choice: ప్రవక్త
  rationale: మూలంలోని సాధారణ, గుర్తించదగిన ధార్మిక పదానికి నేరమైన ప్రామాణిక తెలుగు సమానం.
- source_word: ἄτιμος
  choice: గౌరవం లేనివాడు
  rationale: గౌరవం–అగౌరవం భావాన్ని నిలుపుతూ, οὐκ ... εἰ μὴ అనే సామెతసదృశ వాక్య నిర్మాణాన్ని తెలుగులో సాధ్యమైనంతవరకు కాపాడుతుంది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: ఇక్కడ మినహాయింపును సూచించే సహజమైన తెలుగు సమానం.
- source_word: πατρίδι
  choice: తన సొంత ఊరిలో
  rationale: కథా సందర్భంలో ఇది విస్తృత దేశం కంటే వ్యక్తి పెరిగిన స్వస్థలాన్ని సూచిస్తుంది; ‘సొంత ఊరు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: οἰκίᾳ αὐτοῦ
  choice: తన సొంత ఇంటివారి మధ్య
  rationale: οἰκία ఇల్లు అనే కట్టడాన్నీ, ఇంటివారు/కుటుంబ వర్గాన్నీ సూచించగలదు. సందర్భంలోని సామాజిక వలయాన్ని ప్రధాన పాఠం సహజంగా వ్యక్తం చేస్తూ, పదంలోని సందిగ్ధతను పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: యేసు చెప్పిన సామెత వర్తించే పరిధి
  choice: ప్రవక్తకు తన స్వస్థలం, ఇంటివారి వలయంలో గౌరవం లేకపోవడం గురించిన సాధారణ సామెతగా అనువదించడం
  alternative: ప్రత్యేకంగా కుటుంబ సభ్యుల అవిశ్వాసాన్ని నొక్కిచెప్పే వ్యాఖ్యానాత్మక అనువాదం
  rationale: మూలం యేసు ప్రస్తుత పరిస్థితికి అన్వయించిన సామెతను నివేదిస్తుంది. అందువల్ల స్థానిక తిరస్కారం, గౌరవం అనే భావాలను నిలుపుతూ, యేసు తిరస్కరణపై మూలంలో లేని విస్తృత సిద్ధాంతార్థాన్ని జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని సామెతసదృశ ప్రతికూల-మినహాయింపు నిర్మాణాన్ని నిలిపి, ప్రధాన పాఠాన్ని సహజంగా ఉంచాం. పాదసూచిక గుర్తులు ప్రధాన పాఠంలో [a], [b]గా చేర్చబడ్డాయి.
