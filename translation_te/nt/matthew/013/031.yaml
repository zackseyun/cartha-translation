id: MAT.13.31
reference: Matthew 13:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: te
  text: 'ఆయన వారికి మరొక ఉపమానాన్ని చెప్పాడు: “పరలోక రాజ్యం ఒక ఆవగింజను పోలి ఉంది. ఒక మనిషి దాన్ని తీసుకొని తన పొలంలో విత్తాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: చెప్పాడు
  rationale: παρατίθημι ఇక్కడ ఉపమానాన్ని శ్రోతల ముందుంచడం లేదా వారికి వినిపించడం అనే భావంలో ఉంది. తెలుగులో ‘ఉపమానాన్ని చెప్పాడు’ సహజంగా ఉండి సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: παραβολὴν
  choice: ఉపమానం
  rationale: సమానార్థక కథ ద్వారా బోధించే సువార్తల సాహిత్య ప్రక్రియకు ‘ఉపమానం’ ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: Ὁμοία ἐστὶν
  choice: పోలి ఉంది
  rationale: పోలికను పరిచయం చేసే గ్రీకు సూత్రానికి ఇది సహజమైన తెలుగు సమానార్థకం; రాజ్యం కేవలం గింజతోనే సమానం అని అతిగా కుదించకుండా పోలిక స్వభావాన్ని నిలుపుతుంది.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి ప్రత్యేకంగా వాడే ఈ పదబంధానికి ఇది స్థిరమైన తెలుగు రూపం. ‘రాజ్యం’ అనే పదం పాలన, రాజ్య పరిధి అనే రెండు భావాలకు చోటిస్తుంది.
- source_word: κόκκῳ σινάπεως
  choice: ఒక ఆవగింజ
  rationale: κόκκος గింజను సూచిస్తుంది; σίναπι కి తెలుగు బైబిలు వాడుకలో ‘ఆవ’ సుపరిచితం. కలిపిన ‘ఆవగింజ’ సహజంగా వినిపిస్తుంది.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: ఒక మనిషి దాన్ని తీసుకొని
  rationale: ἄνθρωπος లోని ఏకవచన వ్యక్తిని ‘ఒక మనిషి’గా ఉంచి, λαβών అనే పూర్వకాల క్రియను సహజమైన తెలుగు క్రమంలో ‘తీసుకొని’గా అనువదించింది.
- source_word: ἔσπειρεν
  choice: విత్తాడు
  rationale: σπείρω విత్తనాన్ని విత్తడాన్ని నిర్దిష్టంగా సూచిస్తుంది; ‘నాటాడు’ కంటే ‘విత్తాడు’ మూలపదానికి కచ్చితమైనది.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: తన పొలంలో
  rationale: ἀγρός వ్యవసాయ పొలాన్ని సూచిస్తుంది. కర్తను తిరిగి సూచించే αὐτοῦ ను తెలుగులో సహజంగా ‘తన’ అని అనువదించింది.
theological_decisions:
- issue: మత్తయి వాడిన βασιλεία τῶν οὐρανῶν పదబంధం
  choice: పరలోక రాజ్యం
  alternative: పరలోక పాలన
  rationale: ‘పరలోక రాజ్యం’ మత్తయి పదప్రయోగాన్ని గుర్తించదగిన విధంగా నిలుపుతూ, దాని భావాన్ని కేవలం పాలనా చర్యకే పరిమితం చేయదు. దేవుని రాజ్యాధికారం మరియు రాజ్య పరిధి రెండింటికీ అవకాశం ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని రెండు భాగాలను తెలుగులో సహజమైన చిన్న వాక్యాలుగా విభజించాం; అసలు భావ సంబంధం యథాతథంగా ఉంది.
