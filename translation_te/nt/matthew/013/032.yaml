id: MAT.13.32
reference: Matthew 13:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: te
  text: అది విత్తనాలన్నిటికంటే చిన్నదే; కానీ అది పెరిగినప్పుడు తోట మొక్కలన్నిటికంటే పెద్దదై ఒక చెట్టుగా మారుతుంది.[b] అందువల్ల ఆకాశ పక్షులు[a] వచ్చి దాని కొమ్మల్లో గూళ్లు కట్టుకుంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆకాశ పక్షులు’ అనే పదబంధాన్ని ‘ఆకాశంలోని పక్షులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కొమ్మల్లో పక్షులు నివసించే ఈ చిత్రం గొప్ప రాజ్యాన్ని చెట్టుగా వర్ణించే పాత నిబంధన భాగాలను—ఉదాహరణకు యెహెజ్కేలు 17:23; దానియేలు 4:12—ప్రతిధ్వనింపజేయవచ్చు. అయితే ఈ వచనం ఆ సంకేతార్థాన్ని స్పష్టంగా చెప్పదు.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον ... πάντων τῶν σπερμάτων
  choice: విత్తనాలన్నిటికంటే చిన్నదే
  rationale: గ్రీకు తులనాత్మక రూపమైన ‘చిన్నది’ని నిలుపుతూ, πάντων తో ఉన్న పోలికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μέν ... δέ
  choice: చిన్నదే; కానీ
  rationale: చిన్న ఆరంభానికి, పెద్ద పరిణామానికి మధ్య ఉన్న స్పష్టమైన వ్యత్యాసాన్ని సహజంగా చూపిస్తుంది.
- source_word: ὅταν ... αὐξηθῇ
  choice: అది పెరిగినప్పుడు
  rationale: ఎదుగుదల పూర్తయిన తరువాతి ఫలితాన్ని సూచించే గ్రీకు నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: μεῖζον τῶν λαχάνων
  choice: తోట మొక్కలన్నిటికంటే పెద్దదై
  rationale: λάχανα అనే పదం సాగుచేసే తోట మొక్కలను విస్తృతంగా సూచిస్తుంది; ‘కూరగాయలు’ అని సంకుచితం చేయకుండా భావాన్ని నిలుపుతుంది.
- source_word: γίνεται δένδρον
  choice: ఒక చెట్టుగా మారుతుంది
  rationale: గ్రీకు వాక్యంలోని సూటి, సజీవ చిత్రాన్ని ‘చెట్టులా’ అని మృదువుచేయకుండా అలాగే ఉంచుతుంది.
- source_word: ὥστε ἐλθεῖν
  choice: అందువల్ల ... వచ్చి
  rationale: ὥστε తో వ్యక్తమైన ఫలిత సంబంధాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: ఆకాశ పక్షులు
  rationale: οὐρανός ఇక్కడ ఆకాశాన్ని సూచిస్తుంది; ఈ పదబంధం గ్రీకుకు దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంటుంది.
- source_word: κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ
  choice: దాని కొమ్మల్లో గూళ్లు కట్టుకుంటాయి
  rationale: పక్షులు కొమ్మల్లో నివాసం ఏర్పరచుకోవడాన్ని సందర్భానుకూలమైన, స్పష్టమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: గొప్ప చెట్టు కొమ్మల్లో పక్షులు నివసించే పాత నిబంధన చిత్రణకు సంభావ్య సూచన
  choice: చిత్రాన్ని ప్రధాన వాక్యంలో యథాతథంగా ఉంచి, దాని సంకేతార్థాన్ని నిర్ధారించలేదు.
  alternative: పక్షులు దేవుని రాజ్యంలో ఆశ్రయం పొందే జనాంగాలను లేదా ప్రజలను సూచిస్తాయని ప్రధాన వాక్యంలో వివరించడం.
  rationale: యెహెజ్కేలు 17:23; దానియేలు 4:12 వంటి వచనాల ప్రతిధ్వని ఉండవచ్చు; అయితే ఈ వచనం సంకేతార్థాన్ని స్పష్టంగా చెప్పదు. కాబట్టి వ్యాఖ్యానాన్ని అనువాదంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘తోట మొక్కలు’ అనే విస్తృత పదబంధం వాడబడింది; వాక్యంలోని చిన్న ఆరంభం–పెద్ద పరిణామం వ్యత్యాసం నిలుపబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
