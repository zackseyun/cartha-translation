id: MAT.13.28
reference: Matthew 13:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: te
  text: ఆయన వారితో, “ఒక శత్రువు ఇది చేశాడు” అన్నాడు. అప్పుడు దాసులు[a] ఆయనతో, “అయితే మేము వెళ్లి వాటిని ఏరాలని మీరు కోరుతున్నారా?” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సేవకులు.” గ్రీకు పదం δοῦλοι సందర్భాన్ని బట్టి “దాసులు” లేదా “సేవకులు” అని అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: అన్నాడు
  rationale: కథనంలోని ప్రత్యక్ష సంభాషణకు సహజమైన, సూటియైన తెలుగు క్రియ.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: ఒక శత్రువు
  rationale: ἄνθρωπος ప్రత్యర్థిని ఒక వ్యక్తిగా సూచిస్తుంది; తెలుగులో ‘ఒక శత్రువు’ అనడం భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τοῦτο ἐποίησεν
  choice: ఇది ... చేసిన పని
  rationale: గ్రీకు ఏరిస్ట్ తెలిపే పూర్తయిన చర్యను, τοῦτο యొక్క సూచనార్థాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: δοῦλοι
  choice: దాసులు
  rationale: యజమానికి లోబడిన వారి సామాజిక స్థితిని ‘దాసులు’ స్పష్టంగా నిలుపుతుంది; సందర్భానికి సాధ్యమైన ‘సేవకులు’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: Θέλεις
  choice: అనుకుంటున్నావా
  rationale: ఇక్కడ θέλω యజమాని సంకల్పం లేదా కోరికను అడుగుతోంది; ‘అనుకుంటున్నావా’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: οὖν
  choice: అయితే
  rationale: ముందటి వివరణను బట్టి దాసులు ప్రతిపాదిస్తున్న తదుపరి చర్యను సూచిస్తుంది.
- source_word: ἀπελθόντες
  choice: మేము వెళ్లి
  rationale: ప్రధాన క్రియకు ముందు జరిగే చర్యల క్రమాన్ని సహజమైన తెలుగు సంయుక్త క్రియారూపంలో అందిస్తుంది.
- source_word: συλλέξωμεν
  choice: ఏరివేయాలని
  rationale: కలుపు మొక్కలను కూడదీసి తొలగించాలనే వ్యవసాయ సందర్భాన్ని తెలియజేస్తుంది; తరువాతి వచనంలోని వేరుతో పీకివేయడం అనే భావాన్ని ముందుగానే అనవసరంగా చేర్చదు.
- source_word: αὐτά
  choice: వాటిని
  rationale: మునుపటి సందర్భంలో పేర్కొన్న కలుపు మొక్కలను సూచించే నపుంసక బహువచన సర్వనామానికి సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: ఉపమాన సందర్భంలో δοῦλοι అనువాదం
  choice: దాసులు
  alternative: సేవకులు
  rationale: యజమానితో ఉన్న ఆధీన సంబంధాన్ని ‘దాసులు’ స్పష్టంగా నిలుపుతుంది. అయితే ఈ వ్యవసాయ ఉపమాన సందర్భంలో ‘సేవకులు’ కూడా సాధ్యమైన అర్థం కాబట్టి దానిని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ఏరివేయడం’ అనే పదం గ్రీకు συλλέγω యొక్క కూడదీసే భావాన్ని నిలుపుతూ, తరువాతి వచనంలో వచ్చే వేరుతో పీకివేయడాన్ని ముందుగానే స్పష్టీకరించకుండా ఉంటుంది.
