revisions:
- from: ఆయన వారితో, “ఇది ఒక శత్రువు చేసిన పని” అన్నాడు. అప్పుడు దాసులు[a] ఆయనతో, “అయితే మేము వెళ్లి వాటిని ఏరివేయాలని అనుకుంటున్నావా?” అన్నారు.
  to: ఆయన వారితో, “ఒక శత్రువు ఇది చేశాడు” అన్నాడు. అప్పుడు దాసులు[a] ఆయనతో, “అయితే మేము వెళ్లి వాటిని ఏరాలని మీరు కోరుతున్నారా?” అన్నారు.
  rationale: 'The revision preserves the completed hostile action and the individual enemy while using a direct Telugu rendering. It replaces a potentially over-specific verb for συλλέξωμεν with “ఏరాలని” (“to gather”) and expresses θέλεις as the master''s respectful, direct wish: “మీరు కోరుతున్నారా?” The footnote marker and lexical alternative remain correctly anchored.'
