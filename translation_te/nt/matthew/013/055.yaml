id: MAT.13.55
reference: Matthew 13:55
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: te
  text: “ఇతడు వడ్రంగి కొడుకు కాడా? ఇతని తల్లిని మరియ అని పిలుస్తారు కదా? ఇతని సోదరులు[a] యాకోబు, యోసేపు[b], సీమోను, యూదా కాదా?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బంధువులు,” “దగ్గరి బంధువులు.” గ్రీకు పదం సాధారణంగా “సోదరులు” అని అర్థమిస్తుంది; అయితే ఈ సందర్భంలో కొందరు దాన్ని విస్తృత కుటుంబ సంబంధాన్ని సూచించేదిగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో “యోసేపు”కు బదులు “యోసే” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: వడ్రంగి
  rationale: τέκτων అనేది కలపతో లేదా నిర్మాణ పనులతో పనిచేసే నైపుణ్యంగల పనివాణ్ణి సూచించగలదు. ఈ సందర్భంలో ‘వడ్రంగి’ సహజమైన, విస్తృతంగా అర్థమయ్యే సంప్రదాయ తెలుగు పదం.
- source_word: υἱός
  choice: కుమారుడు
  rationale: ఇక్కడ ప్రత్యక్ష కుటుంబ సంబంధమే ఉద్దేశించబడింది; అందువల్ల ‘కుమారుడు’ స్పష్టమైన సమానార్థకం.
- source_word: λέγεται Μαριὰμ
  choice: తల్లి పేరు మరియ
  rationale: గ్రీకు నిష్క్రియ ప్రయోగం అక్షరార్థంగా ‘మరియ అని పిలువబడుతుంది’ అయినా, ఆధునిక తెలుగులో వ్యక్తి పేరు చెప్పే సహజమైన రూపం ‘పేరు మరియ’.
- source_word: ἀδελφοὶ
  choice: సోదరులు
  rationale: పదానికి సాధారణమైన ప్రత్యక్ష అర్థం ‘సోదరులు’. కుటుంబ సంబంధం గురించిన తరువాతి సిద్ధాంత వివాదాన్ని ప్రధాన పాఠ్యంలో పరిష్కరించకుండా, విస్తృతార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: Ἰάκωβος
  choice: యాకోబు
  rationale: గ్రీకు పేరుకు మూలరూపాన్ని ప్రతిబింబించే, తెలుగు బైబిలు వాడుకలో సుపరిచితమైన రూపం.
- source_word: Ἰωσὴφ
  choice: యోసేపు
  rationale: SBLGNT ప్రధాన పాఠంలోని Ἰωσήφకు తెలుగు సంప్రదాయ రూపం; ప్రత్యామ్నాయ పాఠాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: Σίμων
  choice: సీమోను
  rationale: తెలుగు నూతన నిబంధన వాడుకలో స్థిరపడిన పేరురూపం.
- source_word: Ἰούδας
  choice: యూదా
  rationale: గ్రీకు Ἰούδας పేరుకు తెలుగు బైబిలు వాడుకలో సహజమైన రూపం; ఈ సందర్భంలో మరొక వ్యక్తితో గందరగోళం రాకుండా మూలపేరును అలాగే నిలుపుతుంది.
- source_word: οὐχ ... ;
  choice: కాడా? ... కదా?
  rationale: οὐχ ప్రవేశపెట్టే ప్రశ్నలు సమ్మతికరమైన జవాబును ఆశించే అలంకారిక ప్రశ్నలు. తెలుగులో ‘కాడా/కదా’ ఆ భావాన్ని సహజంగా తెలియజేస్తాయి.
theological_decisions:
- issue: ἀδελφοὶ αὐτοῦ ద్వారా యేసుతో సూచించబడిన కుటుంబ సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘ఇతని సోదరులు’
  alternative: ‘ఇతని బంధువులు’ లేదా ‘ఇతని దగ్గరి బంధువులు’
  rationale: ἀδελφοί యొక్క సాధారణ అర్థం ‘సోదరులు’. వీరు సహోదరులా లేక విస్తృత కుటుంబ బంధువులా అనే సిద్ధాంతపరమైన ప్రశ్నను అనువాదం తేల్చకూడదు. అందువల్ల సాధారణ పదార్థాన్ని ప్రధాన పాఠ్యంలో ఉంచి, సాధ్యమైన విస్తృతార్థాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. అలంకారిక ప్రశ్నల సంభాషణాత్మక బలాన్ని ‘కాడా/కదా’తో నిలిపాం. రెండవ గ్రీకు ప్రశ్నలోని తల్లి మరియు సోదరుల వివరాలను తెలుగులో ఒకే ప్రశ్న పరిధిలో సహజంగా అమర్చాం.
