id: MAT.13.40
reference: Matthew 13:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: te
  text: కాబట్టి, కలుపు మొక్కలు[a] ఏరబడి అగ్నిలో కాల్చబడినట్లే, యుగం ముగింపులో అలాగే జరుగుతుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయంగా “గురుగులు.” ఇక్కడి గ్రీకు పదం హానికరమైన కలుపు మొక్కలను, బహుశా డార్నెల్ అనే మొక్కను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, సంప్రదాయంగా “లోకాంతంలో.” గ్రీకులో అక్షరార్థంగా “యుగం యొక్క ముగింపులో.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: కాబట్టి, ...ట్లే
  rationale: οὖν యొక్క నిర్ధారణాత్మక సంబంధాన్ని ‘కాబట్టి’తో, ὥσπερ యొక్క పోలికను ‘...ట్లే’తో వ్యక్తం చేసి, ముందున్న వివరణతో తార్కిక అనుసంధానాన్ని నిలుపుతుంది.
- source_word: συλλέγεται
  choice: ఏరబడి
  rationale: వ్యవసాయ సందర్భంలో కలుపు మొక్కలను తొలగించడానికి పోగుచేయడాన్ని సహజంగా సూచిస్తుంది; గ్రీకు క్రియలోని కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: τὰ ζιζάνια
  choice: గురుగులు
  rationale: ఇది పంట మధ్య పెరిగే హానికరమైన, డార్నెల్ కావచ్చని భావించే కలుపు మొక్కలను సూచిస్తుంది. సందర్భానుసారమైన తెలుగు పదాన్ని వాడి, విస్తృతమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: πυρὶ καίεται
  choice: అగ్నితో కాల్చబడినట్లే
  rationale: πυρίలోని సాధనార్థక భావాన్నీ, καίω యొక్క సాధారణ ‘కాల్చు’ అర్థాన్నీ స్పష్టంగా నిలుపుతుంది.
- source_word: οὕτως ἔσται
  choice: కూడా అలాగే జరుగుతుంది
  rationale: పోలికను పూర్తి చేస్తూ భవిష్యత్ సంఘటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: యుగాంతంలో
  rationale: సమాసరూపమైన ఈ తెలుగు పదం συντέλεια యొక్క ముగింపు/పరిపూర్తి భావాన్నీ, αἰών యొక్క కాలసంబంధమైన ‘యుగం’ భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: ἐν τῇ συντελείᾳ τοῦ αἰῶνος అనే అంత్యకాల పదబంధం
  choice: యుగాంతంలో
  alternative: లోకాంతంలో
  rationale: αἰών ప్రధానంగా కాలయుగాన్ని సూచిస్తుంది; భౌతిక ప్రపంచాన్ని సూచించేలా అర్థాన్ని కుదించకుండా ‘యుగాంతం’ మూలంలోని కాలసంబంధ భావాన్ని కాపాడుతుంది. నిర్దిష్ట అంత్యకాల సిద్ధాంతాన్ని ఇందులో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘అగ్ని,’ ‘యుగాంతం’ వంటి బైబిలు సందర్భానికి పరిచితమైన పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
