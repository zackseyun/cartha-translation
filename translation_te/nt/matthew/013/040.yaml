  verdict: revise
  source_fidelity: The draft preserves the comparison, passive gathering/burning imagery, future result, and the temporal sense of τοῦ αἰῶνος. However, “గురుగులు” is not sufficiently transparent for modern standard Telugu as the main rendering of ζιζάνια, and “యుగాంతం” is less explicit than the source’s ‘end/consummation of the age.’
  naturalness: The sentence structure is generally natural, but “కూడా అలాగే జరుగుతుంది” adds an unnecessary ‘also’ and is less direct than the Greek comparison. Using a clear main-text term for the weeds improves accessibility.
  terminology: Render ζιζάνια as “కలుపు మొక్కలు” in the text, while retaining “గురుగులు” as a traditional alternative in the footnote. Render ἐν τῇ συντελείᾳ τοῦ αἰῶνος as “యుగం ముగింపులో” to preserve both ‘age’ and ‘end.’
  issues:
  - severity: medium
    issue: Main-text rendering “గురుగులు” is opaque in modern standard Telugu.
    rationale: Although it may function as a traditional equivalent for tares, it is not readily understood by many contemporary readers. The Greek denotes harmful weeds; “కలుపు మొక్కలు” is clear and does not over-specify the plant.
  - severity: low
    issue: “యుగాంతంలో” compresses the phrase ‘at the end of the age.’
    rationale: The compound is understandable, but “యుగం ముగింపులో” more transparently represents the genitive phrase τοῦ αἰῶνος and the culmination sense of συντέλεια.
  - severity: low
    issue: “కూడా” is not represented in the Greek.
    rationale: The comparison is fully conveyed by “అలాగే”; removing “కూడా” avoids a small addition.
  revised_text: కాబట్టి, కలుపు మొక్కలు[a] ఏరబడి అగ్నిలో కాల్చబడినట్లే, యుగం ముగింపులో అలాగే జరుగుతుంది.[b]
