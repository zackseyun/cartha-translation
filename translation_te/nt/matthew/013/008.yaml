translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే వ్యవసాయ పదజాలం. మూలంలోని వ్యత్యాసం, విత్తనం పడటం, భిన్న దిగుబడులు నిలుపబడ్డాయి.
