id: MAT.13.8
reference: Matthew 13:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὴν γῆν τὴν καλὴν καὶ ἐδίδου καρπόν, ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: te
  text: అయితే మరికొన్ని విత్తనాలు మంచి నేలపై పడి ఫలించాయి—కొన్ని వంద రెట్లు, కొన్ని అరవై రెట్లు, మరికొన్ని ముప్పై రెట్లు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλα
  choice: మరికొన్ని విత్తనాలు
  rationale: నపుంసక బహువచన విశేషణం పూర్వ సందర్భంలోని విత్తనాలను సూచిస్తూ నామవాచకంగా వాడబడింది; తెలుగులో భావస్పష్టత కోసం ‘విత్తనాలు’ చేర్చబడింది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందు చెప్పిన ఫలించని నేలలతో ఉన్న వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἔπεσεν
  choice: పడి
  rationale: గ్రీకు క్రియ యొక్క ప్రత్యక్ష భావమైన ‘పడటం’ను నిలుపుతుంది; సందర్భం విత్తడం గురించినదైనా ‘విత్తబడడం’ అని మార్చలేదు.
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: మంచి నేలపై
  rationale: వ్యవసాయ సందర్భంలో γῆకి ‘నేల’ సహజమైనది; καλὴν ఇక్కడ పంటకు అనుకూలమైన మంచి నేలను సూచిస్తుంది.
- source_word: ἐδίδου καρπόν
  choice: ఫలించాయి
  rationale: తెలుగులో విత్తనాలు పంట దిగుబడి ఇవ్వడాన్ని సహజంగా తెలిపే సంక్షిప్త ప్రయోగం; గ్రీకు అసంపూర్ణ భూతకాల రూపంలోని కొనసాగిన/పునరావృత ఫలదాయకతను సందర్భం మోస్తుంది.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: కొన్ని వంద రెట్లు, కొన్ని అరవై రెట్లు, మరికొన్ని ముప్పై రెట్లు
  rationale: గ్రీకు విభజనాత్మక నిర్మాణాన్ని సహజమైన తెలుగు ‘కొన్ని... కొన్ని... మరికొన్ని’తో ప్రతిబింబిస్తుంది; ప్రతి సంఖ్య దిగుబడి గుణకాన్ని సూచిస్తున్నందున ‘రెట్లు’ను స్పష్టంగా ఉంచింది.
