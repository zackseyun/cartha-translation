  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: te
  text: అతడు విత్తుతూ ఉండగా, కొన్ని విత్తనాలు[a] దారి పక్కన పడ్డాయి. పక్షులు వచ్చి వాటిని తినివేశాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, “కొన్ని దారి పక్కన పడ్డాయి”; సందర్భంలోని విత్తనాలను సూచిస్తూ “విత్తనాలు” అనే మాట చేర్చబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: అతడు విత్తుతూ ఉండగా
  rationale: ἐν తో కూడిన articular infinitive సమకాలీన క్రియను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కాలసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἃ μὲν
  choice: కొన్ని విత్తనాలు
  rationale: గ్రీకులో అక్షరార్థంగా ‘కొన్ని (వస్తువులు)’ అని ఉన్నా, సందర్భంలో అవి విత్తేవాడు చల్లిన విత్తనాలని స్పష్టంగా ఉంది; తెలుగులో భావం సహజంగా ఉండేందుకు నామవాచకాన్ని చేర్చాం.
- source_word: ἔπεσεν
  choice: పడ్డాయి
  rationale: కథనంలోని aorist క్రియను తెలుగులో సాధారణ భూతకాలంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρὰ τὴν ὁδόν
  choice: దారి పక్కన
  rationale: παρά + accusative ఇక్కడ దారికి పక్కనున్న స్థానాన్ని సూచిస్తుంది; వ్యవసాయ సందర్భంలో ‘దారి’ సహజమైన ఎంపిక.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: పక్షులు వచ్చి
  rationale: aorist participle సూచించే వరుస చర్యను తెలుగులో ‘వచ్చి’ అనే సంయుక్త క్రియారూపం సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘ఆకాశ పక్షులు’ అనే మాటను చేర్చలేదు.
- source_word: κατέφαγεν
  choice: మింగివేశాయి
  rationale: κατεσθίωలోని పూర్తిగా తినివేయడం అనే బలమైన భావాన్ని ‘మింగివేశాయి’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: αὐτά
  choice: వాటిని
  rationale: ఈ సర్వనామం పడిన విత్తనాలను సూచిస్తుంది; తెలుగులో ‘వాటిని’ సరిపోతుంది.
