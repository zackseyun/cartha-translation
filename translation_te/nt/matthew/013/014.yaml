id: MAT.13.14
reference: Matthew 13:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: te
  text: 'వారిలో యెషయా ప్రవచనం నెరవేరుతోంది: అది ఇలా చెబుతోంది: “మీరు వింటూనే వింటారు[a], అయినా ఎంతమాత్రమూ అర్థం చేసుకోరు; చూస్తూనే చూస్తారు, అయినా ఎంతమాత్రమూ గ్రహించరు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “వినికిడితో మీరు వింటారు … చూస్తూ మీరు చూస్తారు.” ఇది గ్రీకు ద్వారా ఉటంకించబడిన హీబ్రూ శైలిలోని బలవాచక పునరుక్తి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: నెరవేరుతోంది
  rationale: వర్తమానకాల కర్మణి రూపాన్ని సహజమైన తెలుగులో చూపిస్తూ, ప్రవచనం వారి విషయంలో నెరవేరుతున్నదనే భావాన్ని నిలుపుతుంది; ‘పూర్తిగా నెరవేరుతోంది’ అని మూలంలోకన్నా బలమైన భావాన్ని చేర్చదు.
- source_word: αὐτοῖς
  choice: వారి విషయంలో
  rationale: ఈ దత్తివిభక్తి ప్రవచనం ఆ ప్రజల సందర్భంలో నెరవేరుతోందని సూచిస్తుంది. ‘వారిలో’ కంటే ‘వారి విషయంలో’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: προφητεία Ἠσαΐου ἡ λέγουσα
  choice: యెషయా చెప్పిన ఈ ప్రవచనం
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని తెలుగులో సహజమైన కృదంత నిర్మాణంగా వ్యక్తం చేస్తుంది; తరువాత వచ్చే ఉల్లేఖనాన్ని ‘ఈ ప్రవచనం’ స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: Ἀκοῇ ἀκούσετε
  choice: మీరు వినడం మాత్రం వింటారు
  rationale: గ్రీకులోని సెమీయ శైలిగల ఒకే ధాతువు పునరుక్తిని తెలుగులో అర్థమయ్యే రీతిలో నిలుపుతూ, నిజంగా వినడం జరిగినా అవగాహన కలగదనే వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: οὐ μὴ συνῆτε
  choice: కానీ ఎంతమాత్రమూ అర్థం చేసుకోరు
  rationale: οὐ μή అనే బలమైన నిషేధాన్ని ‘ఎంతమాత్రమూ’ ద్వారా వ్యక్తం చేస్తుంది. వ్యత్యాసాన్ని సహజ తెలుగులో చూపడానికి καίని ఇక్కడ ‘కానీ’గా అనువదించింది.
- source_word: βλέποντες βλέψετε
  choice: చూడడం మాత్రం చూస్తారు
  rationale: మొదటి అర్ధవాక్యంతో సమాంతరతను, βλέπω పదపు పునరుక్తిని సహజమైన తెలుగు నుడికారంలో నిలుపుతుంది.
- source_word: οὐ μὴ ἴδητε
  choice: కానీ ఎంతమాత్రమూ గ్రహించరు
  rationale: ముందున్న భౌతిక ‘చూడడం’తో భేదాన్ని చూపుతూ ἴδητεకు సందర్భానుగుణమైన అంతర్గత గ్రహింపు భావాన్ని ఇస్తుంది; బలమైన నిషేధాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: ప్రవచనం నెరవేరే స్వభావం
  choice: యెషయా ప్రవచనం ఈ ప్రజల విషయంలో నెరవేరుతోందని మాత్రమే పేర్కొనడం
  alternative: ఇది కేవలం ఒక పోలిక అని లేదా పూర్తిగా, అంతిమంగా నెరవేరిందని స్పష్టీకరించడం
  rationale: వాక్యం చెప్పే నెరవేర్పు భావాన్ని నిలుపుతూ, కఠినపరచడం, ముందే నిర్ణయించడం లేదా కేవలం నమూనాత్మక పోలిక అనే ఏ ప్రత్యేక సిద్ధాంత వివరణనూ అనువాదంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ఉల్లేఖనంలోని సమాంతర పునరుక్తిని సహజత్వం కోల్పోకుండా నిలిపింది.
