id: MAT.13.54
reference: Matthew 13:54
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: te
  text: ఆయన తన స్వస్థలానికి వచ్చి, వారి సమాజమందిరంలో వారికి బోధిస్తూ ఉన్నాడు. దాంతో వారు ఆశ్చర్యపడి, “ఇతనికి ఈ జ్ఞానం, ఈ శక్తులు[a] ఎక్కడి నుంచి వచ్చాయి?” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శక్తివంతమైన కార్యాలు”; అంటే శక్తి వ్యక్తమయ్యే కార్యాలు, తరచుగా అద్భుతాలుగా అర్థం చేసుకోబడతాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: స్వస్థలం
  rationale: ఈ కథన సందర్భంలో యేసు పెరిగి, స్థానికులకు తెలిసిన ఊరును సూచిస్తుంది; దేశం లేదా విస్తృత మాతృభూమి అనే భావం కాదు.
- source_word: ἐδίδασκεν
  choice: బోధిస్తూ ఉన్నాడు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగుతున్న క్రియను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కొనసాగింపు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: συναγωγῇ
  choice: సమాజ మందిరం
  rationale: ఈ యూదు సందర్భంలో కూడుకునే సంస్థనూ స్థలాన్నీ సూచించే, ఆధునిక తెలుగు బైబిలు వాడుకలో స్పష్టమైన పదబంధం.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: దాంతో వారు ఆశ్చర్యపడి ... అన్నారు
  rationale: ὥστε తెలిపే ఫలిత సంబంధాన్ని ‘దాంతో’ సహజంగా చూపుతుంది; గ్రీకు క్రియారూపాలను తెలుగులో సులభమైన పరిమిత క్రియలుగా వ్యక్తం చేసింది.
- source_word: Πόθεν
  choice: ఎక్కడి నుంచి వచ్చాయి
  rationale: జ్ఞానం, శక్తికార్యాల మూలం ఏమిటని ప్రశ్నించే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τούτῳ
  choice: ఇతనికి
  rationale: ‘ఈ వ్యక్తికి’ అనే సూచనతో పాటు జనుల మాటల్లోని కొంత దూరంగా చూసే స్వరాన్ని కూడా సంక్షిప్తంగా నిలుపుతుంది.
- source_word: σοφία
  choice: జ్ఞానం
  rationale: అసాధారణమైన అవగాహనను, బోధనా సామర్థ్యాన్ని సూచించే సాధారణమైన మరియు స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: δυνάμεις
  choice: శక్తికార్యాలు
  rationale: పదంలోని ‘శక్తి’ భావాన్ని నిలుపుతూ, సందర్భంలో అది శక్తి వ్యక్తమయ్యే కార్యాలను సూచిస్తోందని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘అద్భుతాలు’ అని నేరుగా వ్యాఖ్యానించదు.
theological_decisions:
- issue: యేసు చేసిన అసాధారణ కార్యాలను సూచించే δυνάμεις పదానికి అనువాదం
  choice: శక్తికార్యాలు
  alternative: అద్భుతాలు
  rationale: ఈ రూపం దైవిక శక్తి వ్యక్తమయ్యే కార్యాలనే మూలపద భావాన్ని కాపాడుతుంది. అదే సమయంలో వాటిని వెంటనే ఒక సాంకేతిక అద్భుతాల వర్గంగా మాత్రమే నిర్వచించకుండా మూలంలోని స్వల్ప విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘వారి సమాజ మందిరం’ మూలంలోని ‘వారి’ అనే సంబంధాన్ని నిలుపుతుంది; ప్రశ్నలోని ‘ఇతనికి’ జనుల ఆశ్చర్యంతో కూడిన కొంత దూరపు స్వరాన్ని కాపాడుతుంది.
