revisions:
- from: ఆయన తన స్వస్థలానికి వచ్చి, వారి సమాజ మందిరంలో వారికి బోధిస్తూ ఉన్నాడు. దాంతో వారు ఆశ్చర్యపడి, “ఇతనికి ఈ జ్ఞానం, ఈ శక్తికార్యాలు[a] ఎక్కడి నుంచి వచ్చాయి?” అన్నారు.
  to: ఆయన తన స్వస్థలానికి వచ్చి, వారి సమాజమందిరంలో వారికి బోధిస్తూ ఉన్నాడు. దాంతో వారు ఆశ్చర్యపడి, “ఇతనికి ఈ జ్ఞానం, ఈ శక్తులు[a] ఎక్కడి నుంచి వచ్చాయి?” అని అన్నారు.
  rationale: The revision retains the draft’s appropriate imperfect sense in “బోధిస్తూ ఉన్నాడు” and its result clause, while replacing the less idiomatic “శక్తికార్యాలు” with “శక్తులు.” This more closely reflects δυνάμεις and preserves the source’s deliberate lexical openness. The footnote gives the contextual alternative without making “అద్భుతాలు” the main-text interpretation.
