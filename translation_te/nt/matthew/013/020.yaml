source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: te
  text: రాతినేలలో విత్తబడినవాడి విషయానికొస్తే,[a] ఇతడు వాక్యాన్ని విని, వెంటనే ఆనందంతో దానిని స్వీకరించేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: ‘రాతిప్రదేశాల్లో విత్తబడినవాడు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: రాతినేలలో విత్తబడినవాడి విషయానికొస్తే
  rationale: δέను స్వల్ప విషయమార్పుగా చూపుతూ, గ్రీకులోని సంక్షిప్త రూపకాన్ని అలాగే ఉంచుతుంది. విత్తబడినది విత్తనమా, దాని ద్వారా సూచించబడిన వ్యక్తియా అనే ఉద్దేశపూర్వక ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- source_word: πετρώδη
  choice: రాతినేల
  rationale: రాళ్లు ఎక్కువగా ఉండి మట్టి లోతు తక్కువగా ఉన్న భూమిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; వ్యవసాయ రూపకాన్ని కాపాడుతుంది.
- source_word: σπαρείς
  choice: విత్తబడినవాడు
  rationale: అరిస్ట్ కర్మణి కృదంత భావాన్ని నిలుపుతూ, గ్రీకు పుంలింగ ఏకవచన substantival నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οὗτός ἐστιν
  choice: ఇతడు
  rationale: గ్రీకు గుర్తింపు వాక్యాన్ని సరళంగా ఉంచి, ‘సూచిస్తున్నాడు’ వంటి వ్యాఖ్యాత్మక విస్తరణను నివారిస్తుంది.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: వాక్యాన్ని విని … స్వీకరించేవాడు
  rationale: వర్తమాన కృదంత నిర్మాణాన్ని తెలుగులో సహజమైన సంబంధార్థక క్రియారూపంతో అందిస్తుంది. λόγοςకు ‘వాక్యం’ అని అనువదించడం మత్తయిలోని అంశసంబంధ ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: ప్రతిస్పందనలోని తక్షణత్వాన్ని స్పష్టమైన ప్రామాణిక తెలుగులో తెలియజేస్తుంది.
- source_word: μετὰ χαρᾶς
  choice: ఆనందంతో
  rationale: χαρά అనే నామవాచక భావాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉంటుంది.
- source_word: λαμβάνων αὐτόν
  choice: దానిని స్వీకరించేవాడు
  rationale: λαμβάνωలోని స్వీకరించడం/అంగీకరించడం అనే భావానికి ‘స్వీకరించు’ సరిపోతుంది; ‘దానిని’ అనేది ముందున్న ‘వాక్యం’ను స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: ఉపమాన వివరణలో ‘విత్తబడినవాడు’ ఎవరిని సూచిస్తున్నాడనే ప్రశ్న
  choice: ‘రాతినేలలో విత్తబడినవాడు’ అని రూపకాన్ని సంక్షిప్తంగానే ఉంచి, తరువాతి భాగం అతడిని వాక్యం వినే వ్యక్తిగా గుర్తించనివ్వడం.
  alternative: ‘రాతినేలలో విత్తబడిన విత్తనం వాక్యాన్ని వినే వ్యక్తిని సూచిస్తుంది’ అని వివరణాత్మకంగా విస్తరించడం.
  rationale: గ్రీకు పాఠం విత్తబడినదానిని మరియు దాని ద్వారా సూచించబడిన వ్యక్తిని ఒకే సంక్షిప్త నిర్మాణంలో ఉంచుతుంది. అనువాదం ఆ రూపక ఉద్రిక్తతను సిద్ధాంతాత్మకంగా లేదా వ్యాఖ్యాత్మకంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరంగా ఉంది. ‘వాక్యం,’ ‘స్వీకరించు’ వంటి పదాలు మూలపాఠపు ధార్మిక ప్రతిధ్వనిని అతిగా వ్యాఖ్యానించకుండా కాపాడుతున్నాయి.
