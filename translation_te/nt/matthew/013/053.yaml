  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: te
  text: యేసు ఈ ఉపమానాలు చెప్పడం ముగించినప్పుడు, ఆయన అక్కడి నుండి వెళ్లిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “యేసు ఈ ఉపమానాలను ముగించినప్పుడు ఇలా జరిగింది—ఆయన అక్కడి నుండి వెళ్లిపోయాడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: ముగించినప్పుడు
  rationale: καὶ ἐγένετο ఇక్కడ కథనాన్ని ముందుకు నడిపించే సంధి ప్రయోగం; దానిని విడిగా ‘ఇలా జరిగింది’ అని అనువదిస్తే తెలుగులో అనవసరమైన బరువు వస్తుంది. ὅτε సూచించే కాలసంబంధాన్ని ‘అప్పుడు’ నిర్మాణం సహజంగా తెలియజేస్తుంది.
- source_word: ἐτέλεσεν
  choice: చెప్పడం ముగించినప్పుడు
  rationale: τελέω అంటే పూర్తి చేయడం లేదా ముగించడం. ఉపమానాల సందర్భంలో తెలుగులో ‘ఉపమానాలు చెప్పడం ముగించాడు’ అనడం సహజంగా ఉండి, చర్య పూర్తయిన తరువాతి క్రమాన్ని స్పష్టం చేస్తుంది.
- source_word: τὰς παραβολὰς ταύτας
  choice: ఈ ఉపమానాలు
  rationale: παραβολήకి స్థిరమైన తెలుగు బైబిలు పదం ‘ఉపమానం’; ταύτας వెంటనే ముందు చెప్పబడిన ఉపమానాలను సూచిస్తుంది.
- source_word: μετῆρεν
  choice: వెళ్లిపోయాడు
  rationale: μεταίρω ఒక స్థలం నుండి కదలి వెళ్లడాన్ని సూచిస్తుంది. ‘వెళ్లిపోయాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలో లేని ప్రయాణ విధానాన్ని జోడించదు.
- source_word: ἐκεῖθεν
  choice: అక్కడి నుండి
  rationale: ἐκεῖθεν స్థలాన్ని సూచించే ‘అక్కడి నుండి’ అనే భావాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘చెప్పడం’ను చేర్చడం ద్వారా ఉపమానాలను ‘ముగించడం’ అనే గ్రీకు ప్రయోగం తెలుగులో స్పష్టంగా వినిపిస్తుంది; పాదసూచికలో καὶ ἐγένετο యొక్క అక్షరార్థ నిర్మాణం నిలుపబడింది.
