id: MAT.13.11
reference: Matthew 13:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: te
  text: 'ఆయన వారికి ఇలా జవాబిచ్చాడు: “పరలోక రాజ్య మర్మాలను[a] తెలుసుకోవడం మీకు అనుగ్రహించబడింది[b]; కాని వారికి అనుగ్రహించబడలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరలోక రాజ్య రహస్యాలను.”
    reason: lexical_alternative
  - marker: b
    text: “అనుగ్రహించబడింది” అనే కర్మణి రూపం దాతను స్పష్టంగా పేర్కొనదు; ఈ జ్ఞానాన్ని దేవుడే అనుగ్రహిస్తాడనే భావం ఇందులో అంతర్లీనంగా ఉంది.
    reason: implicit_divine_agent
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ఇలా జవాబిచ్చాడు
  rationale: ఈ కృదంతం-క్రియ కలయికకు సహజమైన తెలుగు రూపం; ‘జవాబిచ్చి చెప్పాడు’ అనే అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: ὑμῖν δέδοται
  choice: మీకు అనుగ్రహించబడింది
  rationale: దాతను పేర్కొనని గ్రీకు కర్మణి ప్రయోగాన్ని నిలుపుతూ, ఇది సాధారణంగా చేతికిచ్చే వస్తువు కాక జ్ఞానానికి లభించిన అనుమతి/వరమని సహజంగా తెలియజేస్తుంది.
- source_word: γνῶναι
  choice: తెలుసుకోవడం
  rationale: γινώσκω యొక్క ప్రాథమిక భావమైన ‘తెలుసుకోవడం’ను నిలుపుతుంది; ‘గ్రహించడం’ అని వ్యాఖ్యానాత్మకంగా కుదించదు.
- source_word: τὰ μυστήρια
  choice: మర్మాలను
  rationale: ఇంతకుముందు మరుగై ఇప్పుడు బయలుపరచబడే దైవిక సత్యాల భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: పరలోక రాజ్య
  rationale: మత్తయి సువార్తలోని స్థిరమైన భావప్రయోగానికి సహజమైన తెలుగు సమానం; గ్రీకులోని బహువచన ‘ఆకాశాలు’ను తెలుగులో అసహజంగా ప్రతిరూపించదు.
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: కాని వారికి అనుగ్రహించబడలేదు
  rationale: శిష్యులతో అవతలి వర్గాన్ని స్పష్టంగా విరుద్ధపరుస్తూ, ముందటి కర్మణి నిర్మాణానికి సమాంతరతను కాపాడుతుంది.
theological_decisions:
- issue: δέδοται అనే కర్మణి ప్రయోగంలో అంతర్లీన దాత
  choice: దేవుని పేరు చేర్చకుండా ‘అనుగ్రహించబడింది’ అనే కర్మణి రూపాన్ని ఉంచడం
  alternative: ‘దేవుడు మీకు అనుగ్రహించాడు’
  rationale: దాత దేవుడనే భావం సందర్భంలో బలంగా ఉన్నప్పటికీ, మూలపాఠం ఆయనను స్పష్టంగా పేర్కొనదు; కాబట్టి అసలు వాక్యంలోని అంతర్లీనతను, theological tension‌ను నిలుపుతుంది.
- issue: μυστήρια యొక్క రాజ్యసంబంధ భావం
  choice: మర్మాలు
  alternative: రహస్యాలు
  rationale: ‘మర్మాలు’ అనేది కేవలం గోప్య సమాచారం అనే భావానికి పరిమితం కాకుండా, దైవికంగా బయలుపరచబడే సత్యాల భావాన్ని కాపాడుతుంది.
- issue: ὅτι యొక్క వాక్యసంబంధ పని
  choice: తెలుగులో ప్రత్యేకంగా ‘ఎందుకంటే’ చేర్చకుండా ప్రత్యక్ష సమాధానంగా వ్యక్తీకరించడం
  alternative: ‘ఎందుకంటే ...’
  rationale: ఇక్కడ ὅτι సమాధానపు విషయాన్ని లేదా కారణాన్ని పరిచయం చేయగలదు. తెలుగు ప్రత్యక్ష సంభాషణలో దాన్ని విడిగా అనువదించకపోవడం సహజంగా ఉండి, కారణార్థాన్ని బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘తెలియుటకు ఇవ్వబడింది’ వంటి పదశః కానీ అసహజమైన నిర్మాణం బదులు ‘తెలుసుకోవడం ... అనుగ్రహించబడింది’ వాడబడింది. రెండు కర్మణి భాగాల సమాంతరతను కాపాడాం.
