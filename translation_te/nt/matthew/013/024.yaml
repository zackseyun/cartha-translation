id: MAT.13.24
reference: Matthew 13:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: te
  text: 'ఆయన వారికి మరొక ఉపమానాన్ని చెప్పాడు: “పరలోక రాజ్యం తన పొలంలో మంచి విత్తనం విత్తిన ఒక మనిషిలా ఉంది.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: మరొక ఉపమానాన్ని
  rationale: ἄλλην వరుసలో అదనంగా చెప్పిన ఉపమానాన్ని సూచిస్తుంది; ‘మరొక ఉపమానం’ ఆధునిక తెలుగులో సహజంగా కథన ప్రవాహాన్ని నిలుపుతుంది.
- source_word: παρέθηκεν αὐτοῖς
  choice: వారి ముందు ... ఉంచుతూ
  rationale: παρατίθημι లోని ‘ముందుంచడం/సమర్పించడం’ అనే రూపకాన్ని నిలుపుతూ, బోధను వారికి పరిచయం చేసిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λέγων
  choice: ఇలా చెప్పాడు
  rationale: గ్రీకు వర్తమాన కృదంతాన్ని తెలుగు కథన వాక్య నిర్మాణానికి అనుగుణంగా ప్రధాన క్రియతో కలిపి అనువదించడం సహజం.
- source_word: Ὡμοιώθη
  choice: పోల్చబడింది
  rationale: అరిస్ట్ కర్మణి రూపాన్ని నిలుపుతుంది; అదే సమయంలో ఇది ఉపమానాన్ని ప్రవేశపెట్టే సూత్రప్రాయ ప్రయోగమని పాఠకుడు గ్రహించగలడు.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి సువార్తలోని ప్రత్యేక పదబంధానికి తెలుగులో స్థిరమైన, సహజమైన సమానార్థకం; దేవుని పరిపాలన భావాన్ని అనవసరంగా విస్తరించదు.
- source_word: ἀνθρώπῳ
  choice: ఒక మనిషితో
  rationale: ఉపమానంలోని వ్యక్తి పురుషుడని సందర్భం సూచిస్తుంది; దత్తి విభక్తిని పోలికకు తగిన ‘తో’ ద్వారా వ్యక్తం చేసింది.
- source_word: σπείραντι
  choice: విత్తిన
  rationale: పూర్తయిన విత్తే చర్యను మనిషిని విశేషించే సహజ తెలుగు కృదంతంగా అందిస్తుంది.
- source_word: καλὸν σπέρμα
  choice: మంచి విత్తనం
  rationale: καλός ఇక్కడ నాణ్యమైన లేదా మేలైన విత్తనాన్ని సూచిస్తుంది; తరువాత వచ్చే కలుపుతో ఉన్న వ్యత్యాసాన్ని సిద్ధం చేస్తుంది.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: తన పొలంలో
  rationale: αὐτοῦ ను ఉపమానంలోని మనిషికే అన్వయిస్తూ, ἀγρός ను సాధారణ వ్యవసాయ పదమైన ‘పొలం’తో అనువదిస్తుంది.
theological_decisions:
- issue: మత్తయి ఉపయోగించే రాజ్య సూత్రపదం
  choice: పరలోక రాజ్యం
  alternative: పరలోకాల రాజ్యం
  rationale: గ్రీకులో οὐρανῶν బహువచనమైనా, ఈ మత్తయి పదబంధానికి ‘పరలోక రాజ్యం’ తెలుగులో సహజమైన, స్థిరమైన రూపం; భావంలో కొత్త సిద్ధాంతపరమైన వివరణను చేర్చదు.
- issue: Ὡμοιώθη అనే కర్మణి క్రియ బలం
  choice: ఒక మనిషితో పోల్చబడింది
  alternative: ఒక మనిషిలా ఉంది
  rationale: ఎంచుకున్న రూపం గ్రీకు కర్మణి క్రియను కనిపించేలా ఉంచుతుంది. అయితే ఇది ఉపమాన ప్రవేశ సూత్రం కావడంతో సహజమైన స్థితివాచక అనువాదం కూడా సాధ్యమే; ఆ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘వారి ముందు ... ఉంచుతూ’ మూలంలోని రూపకాన్ని నిలుపుతుంది; ‘పోల్చబడింది’ గ్రీకు రూపానికి సన్నిహితంగా ఉండగా, మరింత సహజమైన ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
