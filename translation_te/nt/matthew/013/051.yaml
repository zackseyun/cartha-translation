  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: te
  text: “ఈ సంగతులన్నీ మీరు అర్థం చేసుకున్నారా?[a]” వారు ఆయనకు, “అవును” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ సంగతులన్నీ మీకు అర్థమవుతున్నాయా?”
    reason: Συνήκατε అనే ఆరిస్ట్ రూపాన్ని సందర్భానుసారం ప్రస్తుత అవగాహనను అడిగే ప్రశ్నగా కూడా సహజంగా వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: Συνήκατε
  choice: మీరు అర్థం చేసుకున్నారా?
  rationale: ప్రశ్నలోని అనిశ్చిత భూతకాల క్రియ ఇప్పటివరకు వారు గ్రహించారా అనే భావాన్ని ఇస్తుంది. అందువల్ల వర్తమానకాలంలోని ‘మీకు అర్థమవుతోందా?’ కంటే ‘అర్థం చేసుకున్నారా?’ మూలంలోని కాలదృష్టిని మెరుగ్గా నిలుపుతుంది.
- source_word: ταῦτα πάντα
  choice: ఈ సంగతులన్నీ
  rationale: తటస్థలింగ బహువచన సర్వనామం, ‘అన్నీ’ అనే భావాన్ని స్పష్టంగా ఉంచుతూ, ముందు చెప్పిన బోధలు మరియు ఉపమానాలను సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: λέγουσιν αὐτῷ
  choice: వారు ఆయనతో ... అన్నారు
  rationale: గ్రీకులో చారిత్రక వర్తమాన రూపం ఉన్నప్పటికీ, తెలుగు కథనశైలిలో భూతకాలం సహజం. αὐτῷ లోని పరోక్ష కర్మను ‘ఆయనతో’ అని నిలిపాం.
- source_word: Ναί
  choice: అవును
  rationale: మూలంలో కేవలం సమ్మతిని తెలిపే పదమే ఉంది; గౌరవసూచక బిరుదు ఏదీ లేదు.
theological_decisions:
- issue: శిష్యుల జవాబుకు గౌరవసూచక బిరుదును చేర్చాలా?
  choice: ‘అవును’ అనే సరళమైన జవాబునే ఉంచడం.
  alternative: ‘అవును, ప్రభువా.’
  rationale: SBLGNT పాఠంలో ναί మాత్రమే ఉంది. మూలంలో లేని భక్తిపూర్వక లేదా సిద్ధాంతపరమైన భావాన్ని చేర్చకుండా ఉండేందుకు ఏ బిరుదునూ జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త ప్రశ్న-జవాబు నిర్మాణాన్ని నిలిపి, స్పష్టత కోసం అవసరం లేని వక్త-సూచక పదాలను చేర్చలేదు.
