translation:
  language: te
  text: ఎవరికైతే చెవులు ఉన్నాయో వారు వినాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా: “చెవులు ఉన్నవాడు వినాలి.”'
    reason: మూల గ్రీకులోని సాధారణ పుంలింగ ఏకవచన, ప్రతినిధి రూపాన్ని సూచించడానికి
lexical_decisions:
- source_word: ὁ ἔχων
  choice: ఉన్నవాడు
  rationale: నిర్దేశక పదంతో కూడిన వర్తమాన కృదంతం ఇక్కడ నామవాచకంగా పనిచేసి సాధారణంగా ఏ వ్యక్తినైనా సూచిస్తుంది. ‘ఉన్నవాడు’ గ్రీకు ఏకవచన రూపాన్నీ ప్రతినిధి భావాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὦτα
  choice: చెవులు
  rationale: గ్రీకులో ఇది బహువచనం. ‘చెవులు’ మూలంలోని వచనాన్ని, సందర్భంలోని నానుడిని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἀκουέτω
  choice: వినాలి
  rationale: ఇది వర్తమాన కాల, కర్తరి ప్రయోగ, మూడవ పురుష ఏకవచన ఆజ్ఞార్థకం. ‘వినాలి’ ఆధునిక తెలుగులో ఉపదేశాత్మక ఆజ్ఞను సహజంగా తెలియజేస్తుంది; ఇక్కడ కేవలం శబ్దం వినడమే కాక శ్రద్ధగా గ్రహించి స్వీకరించాలనే భావం సందర్భం ద్వారా వస్తుంది.
theological_decisions:
- issue: సాధారణ వ్యక్తిని సూచించే పుంలింగ ఏకవచనం
  choice: చెవులు ఉన్నవాడు వినాలి.
  alternative: చెవులు ఉన్నవారు వినాలి.
  rationale: గ్రీకు వ్యాకరణ రూపం పుంలింగ ఏకవచనమైనప్పటికీ అది సాధారణంగా ఏ వ్యక్తినైనా సూచిస్తుంది. ప్రధాన పాఠం మూలంలోని ఏకవచన ప్రతినిధి రూపాన్ని కాపాడుతుంది; ప్రత్యామ్నాయం తెలుగులో మరింత సమ్మిళితంగా లేదా గౌరవార్థకంగా వినిపించినా వ్యాకరణ వచనాన్ని బహువచనంగా మారుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన ఉపదేశ శైలి. ‘వినుగాక’ వంటి ప్రాచీన రూపాన్ని నివారించి, సాధారణ పాఠకులకు సహజమైన ‘వినాలి’ని ఉపయోగించాం.
