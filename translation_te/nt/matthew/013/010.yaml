  source_fidelity: 'గ్రీకు వచనంలోని క్రమం, ప్రశ్నార్థక స్వరం, మరియు ముఖ్య భావాలు సరిగా ప్రతిఫలించాయి: శిష్యులు ముందుగా దగ్గరికి వచ్చి, తరువాత ఆయనను ప్రశ్నించారు. ‘అప్పుడు’ కథన-ప్రవాహాన్ని సహజంగా అందిస్తుంది; ‘ఉపమానాల ద్వారా’ ἐν παραβολαῖς యొక్క మాధ్యమ/రీతి భావాన్ని తగినంతగా తెలియజేస్తుంది. ‘వారితో మాట్లాడుతున్నారు’ ఆధునిక తెలుగులో సహజమైన సంభాషణ-ప్రయోగం; ఇక్కడ అది గ్రీకులోని αὐτοῖς సూచించే శ్రోతలను సందర్భానుసారంగా సరిగా సూచిస్తుంది.'
  naturalness: వాక్యం ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది. యేసుకు గౌరవార్థక క్రియారూపమైన ‘మాట్లాడుతున్నారు’ సముచితమైనది. ప్రత్యక్ష ప్రశ్నను ‘అని అడిగారు’తో ముగించడం కూడా సులభంగా చదవదగినది.
  terminology: ‘శిష్యులు,’ ‘ఉపమానాలు,’ మరియు గౌరవార్థక సంభోదన/క్రియారూపాలు స్థిరమైన, అర్థవంతమైన పదప్రయోగాలు. ‘ఉపమానాల ద్వారా’ అనేది ‘ఉపమానాలలో’కు సాధ్యమైన ప్రత్యామ్నాయం అయినప్పటికీ, అర్థాన్ని మార్చదు; ఆధునిక వాడుకలో స్పష్టంగా ఉంది. పాదసూచికలోని ‘సమీపించి’ ప్రత్యామ్నాయం προσελθόντες యొక్క భావాన్ని సముచితంగా వివరిస్తుంది.
