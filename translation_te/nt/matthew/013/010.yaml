translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన వాక్యనిర్మాణం వాడబడింది. యేసును సంబోధించేటప్పుడు తెలుగు సంప్రదాయానికి అనుగుణంగా గౌరవార్థక బహువచన క్రియారూపాలు వాడబడ్డాయి; ఇవి గ్రీకు వచనంలోని సంఖ్యను మార్చే ఉద్దేశంతో కావు.
