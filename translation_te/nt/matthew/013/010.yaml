id: MAT.13.10
reference: Matthew 13:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ μαθηταὶ εἶπαν αὐτῷ· Διὰ τί ἐν παραβολαῖς λαλεῖς αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: te
  text: అప్పుడు శిష్యులు ఆయన దగ్గరికి వచ్చి[a], “మీరు వారితో ఉపమానాల ద్వారా ఎందుకు మాట్లాడుతున్నారు?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సమీపించి’; గ్రీకు క్రియారూపం, శిష్యులు మాట్లాడకముందు యేసు దగ్గరికి వచ్చారని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: అప్పుడు
  rationale: καί కథనాన్ని ముందుకు నడిపిస్తోంది; ఈ సందర్భంలో సహజమైన తెలుగు కథన ప్రవాహానికి ‘అప్పుడు’ సరిపోతుంది.
- source_word: προσελθόντες
  choice: దగ్గరికి వచ్చి
  rationale: προσέρχομαι యేసు వైపు సమీపించి, ఆ తరువాత మాట్లాడిన క్రమాన్ని సూచిస్తుంది; ‘దగ్గరికి వచ్చి’ ఆ కదలికను సహజంగా తెలియజేస్తుంది.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులు
  rationale: నిర్దిష్ట ఆర్టికల్ సందర్భంలో ఇప్పటికే తెలిసిన శిష్యుల సమూహాన్ని సూచిస్తుంది; గ్రీకులో లేని ‘ఆయన శిష్యులు’ అనే స్వామ్యపదాన్ని చేర్చలేదు.
- source_word: εἶπαν αὐτῷ
  choice: అని అడిగారు
  rationale: అక్షరార్థంగా ‘ఆయనతో అన్నారు’ అయినా, వెంటనే ప్రత్యక్ష ప్రశ్న వస్తున్నందున ఆధునిక తెలుగులో ‘అని అడిగారు’ సహజంగా అదే సంభాషణ కార్యాన్ని తెలియజేస్తుంది.
- source_word: Διὰ τί
  choice: ఎందుకు
  rationale: కారణాన్ని అడిగే సాధారణ ప్రశ్నార్థక ప్రయోగానికి సహజమైన తెలుగు సమానం.
- source_word: ἐν παραβολαῖς
  choice: ఉపమానాల ద్వారా
  rationale: ἐν ఇక్కడ మాటల మాధ్యమం లేదా విధానాన్ని సూచిస్తుంది; ‘ఉపమానాల ద్వారా’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: λαλεῖς
  choice: మాట్లాడుతున్నారు
  rationale: వర్తమానకాల రెండవ పురుష ఏకవచన క్రియను గౌరవార్థక ఆధునిక తెలుగు రూపంలో అందించింది.
- source_word: αὐτοῖς
  choice: వారితో
  rationale: సంబోధించబడుతున్న ప్రజలను సూచించే దత్తివును తెలుగులో సహజమైన ‘వారితో’గా అనువదించింది.
