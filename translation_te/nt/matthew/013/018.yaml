translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘విత్తినవాని ఉపమానం’ అనే నిర్మాణం మూలంలోని జనిటివ్ సంబంధాన్ని అనవసరంగా ‘గురించిన’ అని విప్పకుండా నిలుపుతుంది.
