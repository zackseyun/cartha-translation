  text: You[a], then, hear the parable of the one who sowed.
translation:
  language: te
  text: కాబట్టి మీరు విత్తినవాని ఉపమానం వినండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: మీరు
  rationale: గ్రీకులో సర్వనామం స్పష్టంగా, కొంత ఉద్ఘాటనతో ఉంది. తెలుగులో ‘మీరు’ అని ఉంచడం ద్వారా బహువచన సంబోధనను, సందర్భంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి మాటల నుంచి వచ్చే నిర్ధారణాత్మక లేదా సంధాన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀκούσατε
  choice: వినండి
  rationale: ఇది రెండవ పురుష బహువచన ఆజ్ఞార్థకం. ‘వినండి’ ఆ ఆజ్ఞను నేరుగా నిలుపుతుంది; ‘అర్థం చేసుకోండి’ అని అనడం మూలపదం కంటే ఎక్కువ భావాన్ని చేర్చుతుంది.
- source_word: παραβολὴν
  choice: ఉపమానం
  rationale: సువార్తల బోధనా సందర్భంలో παραβολήకు స్థిరమైన, అర్థవంతమైన తెలుగు పదం.
- source_word: τοῦ σπείραντος
  choice: విత్తినవాని
  rationale: ఆర్టికల్‌తో ఉన్న భూతకాల క్రియావిశేషణ రూపాన్ని ‘విత్తినవాడు’ అనే స్థిర బిరుదుగా మార్చకుండా, ‘విత్తిన వ్యక్తి’ అనే దాని ప్రత్యక్ష భావానికి దగ్గరగా అందిస్తుంది.
