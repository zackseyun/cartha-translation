revisions:
- from: పొలం లోకం. మంచి విత్తనం రాజ్యానికి చెందినవారు[a]. కలుపు మొక్కలు దుష్టునికి చెందినవారు[b].
  to: పొలం అంటే లోకం; మంచి విత్తనం అంటే రాజ్యపు కుమారులు[a]; కలుపు మొక్కలు అంటే దుష్టుని కుమారులు.
  rationale: The revision restores the Greek’s repeated “sons” terminology in the main text, preserves the personal reference to the evil one as “దుష్టుడు,” and uses clear parallel Telugu clauses. The darnel note is retained as a lexical alternative; it should be anchored to “కలుపు మొక్కలు” when the text is typeset (కలుపు మొక్కలు[b]).
