id: MAT.13.38
reference: Matthew 13:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: te
  text: పొలం అంటే లోకం; మంచి విత్తనం అంటే రాజ్యపు కుమారులు[a]; కలుపు మొక్కలు అంటే దుష్టుని కుమారులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కుమారులు” ఇక్కడ సంబంధాన్ని, చెందినతనాన్ని సూచించే నుడికారం; రాజ్యానికి చెందినవారు అనే భావం.
    reason: cultural_note
lexical_decisions:
- source_word: ἀγρός
  choice: పొలం
  rationale: వ్యవసాయ ఉపమానానికి సహజమైన, సాధారణ తెలుగు పదం.
- source_word: κόσμος
  choice: లోకం
  rationale: విత్తడం జరిగే విస్తృత పరిధిని సూచించే κόσμοςకు మత్తయి సందర్భంలో సహజమైన అనువాదం.
- source_word: καλὸν σπέρμα
  choice: మంచి విత్తనం
  rationale: వ్యవసాయ రూపకాన్ని, కలుపుతో ఉన్న వ్యత్యాసాన్ని నేరుగా నిలుపుతుంది.
- source_word: οἱ υἱοὶ τῆς βασιλείας
  choice: రాజ్యానికి చెందినవారు
  rationale: ‘రాజ్యపు కుమారులు’ అనే సంబంధవాచక నుడికారంలోని సభ్యత్వం/చెందిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఇది పురుషులకు మాత్రమే పరిమితం కాదు.
- source_word: ζιζάνια
  choice: కలుపు మొక్కలు
  rationale: ζιζάνιαకు సులభంగా అర్థమయ్యే సాధారణ పదం; నిర్దిష్టంగా డార్నెల్ అనే మొక్క కావచ్చనే విషయాన్ని పాదసూచికలో ఉంచవచ్చు.
- source_word: οἱ υἱοὶ τοῦ πονηροῦ
  choice: దుష్టునికి చెందినవారు
  rationale: వ్యక్తిగతమైన ‘దుష్టుడు’ అనే భావాన్ని, సంబంధం/చెందికను సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: τοῦ πονηροῦ వ్యక్తిని సూచిస్తుందా, లేక అమూర్తమైన దుష్టత్వాన్నా?
  choice: దుష్టునికి చెందినవారు
  alternative: దుష్టత్వానికి చెందినవారు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న పుంలింగ ఏకవచన రూపం ఈ సందర్భంలో వ్యక్తిగత ప్రత్యర్థిని సూచించడానికే బలంగా అనుకూలిస్తుంది; గ్రీకు చెప్పినదానికంటే ముందుకు వెళ్లి అతనికి మరొక పేరు పెట్టలేదు.
- issue: οἱ υἱοὶ అనే నుడికారాన్ని పదశః ‘కుమారులు’గా ఉంచాలా?
  choice: చెందినవారు
  alternative: కుమారులు
  rationale: ఇక్కడ ‘కుమారులు’ జీవశాస్త్రీయ లింగాన్ని కాక సంబంధం, స్వభావం, సభ్యత్వాన్ని తెలిపే నుడికారం. సహజ తెలుగులో ‘చెందినవారు’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది; పాదసూచిక మూల నుడికారాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గంభీరంగా రూపొందించబడింది. గ్రీకులోని మూడు సమాంతర వివరణలను మూడు చిన్న వాక్యాలుగా ఉంచి స్పష్టతను పెంచాం. ‘రాజ్యం’ అనే మత్తయి గ్రంథంలోని ప్రధాన పదాన్ని నిలిపి, సంబంధవాచక ‘కుమారులు’ నుడికారాన్ని సాధారణ పాఠకునికి సహజంగా ‘చెందినవారు’గా వ్యక్తం చేశాం.
