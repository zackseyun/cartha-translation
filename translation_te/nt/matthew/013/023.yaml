source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: te
  text: 'అయితే మంచి నేలపై విత్తబడినవాడు ఇతడే: వాక్యాన్ని విని అర్థం చేసుకొనేవాడు. అతడు నిజంగానే ఫలించి దిగుబడి ఇస్తాడు—ఒక సందర్భంలో నూరు, మరొక సందర్భంలో అరవై, ఇంకొక సందర్భంలో ముప్పై.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ఒకటి నూరు, ఒకటి అరవై, ఒకటి ముప్పై.’ ఇవి పంట దిగుబడిలోని భిన్న పరిమాణాలను సూచిస్తాయి; గ్రీకులో ‘రెట్లు/అంతలు’ అనే పదం లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: మంచి నేలపై
  rationale: వ్యవసాయ సందర్భంలో γῆ అనేది విత్తనాన్ని స్వీకరించే నేలను సూచిస్తుంది. καλὴν ఇక్కడ నైతిక మంచితనం కంటే విత్తనానికి అనుకూలమైన, ఫలవంతమైన స్థితిని సూచిస్తుంది; ‘మంచి నేల’ సహజంగా ఉండి ఉపమాన చిత్రాన్ని నిలుపుతుంది.
- source_word: σπαρείς
  choice: విత్తబడినవాడు
  rationale: ఇది కర్తరి అర్థం లేని భూతకాల నిష్పన్న కృదంతం; గ్రీకు వాక్యంలో విత్తనంతో సూచించబడే వ్యక్తిని పురుషలింగ రూపంలో పేర్కొంటుంది. తెలుగు రూపం విత్తనపు ఉపమానాన్ని, వ్యక్తితో దాని గుర్తింపును రెండింటినీ నిలుపుతుంది.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: వాక్యాన్ని విని … చేసుకునేవాడు
  rationale: వర్తమాన కృదంతం ఆ వ్యక్తికి లక్షణమైన స్పందనను సూచిస్తుంది. λόγος ను ‘వాక్యం’గా అనువదించడం సువార్త సంబంధిత పదప్రయోగాన్ని కాపాడుతూ సాధారణ పాఠకునికీ అర్థమయ్యేలా ఉంటుంది.
- source_word: συνιείς
  choice: అర్థం చేసుకునేవాడు
  rationale: సందేశాన్ని కేవలం వినడమే కాక దాని భావాన్ని గ్రహించడాన్ని συνίημι సూచిస్తుంది. తెలుగు వాక్యంలో దాని కర్మ ‘వాక్యాన్ని’తో సహజంగా పంచుకోబడింది.
- source_word: δὴ
  choice: నిజంగా
  rationale: δή ఇచ్చే ఉద్ఘాటనను అతిగా బలపరచకుండా స్పష్టంగా తెలియజేస్తుంది.
- source_word: καρποφορεῖ καὶ ποιεῖ
  choice: ఫలించి దిగుబడి ఇస్తాడు
  rationale: καρποφορεῖ లోని ఫలించే చిత్రాన్ని, ποιεῖ సందర్భానుసారంగా సూచించే ఉత్పత్తి లేదా పంట దిగుబడిని రెండు వేరు క్రియలతో నిలుపుతుంది.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: ఒకడు నూరంతలు, మరొకడు అరవై అంతలు, ఇంకొకడు ముప్పై అంతలు
  rationale: విభిన్న వ్యక్తులు లేదా సందర్భాల్లో వచ్చే భిన్న దిగుబడులను పంపిణీ నిర్మాణంతో స్పష్టపరుస్తుంది. గ్రీకులో ‘రెట్లు/అంతలు’ అనే పదం ప్రత్యక్షంగా లేకపోయినా వ్యవసాయ సందర్భంలో సంఖ్యలు దిగుబడి నిష్పత్తులను సూచిస్తాయి; తెలుగులో భావం అసంపూర్ణంగా కాకుండా ఉండేందుకు ‘అంతలు’ ఉపయోగించబడింది.
theological_decisions:
- issue: వాక్యానికి స్పందించే స్వభావం
  choice: మంచి నేలతో సూచించబడినవాడు విని, అర్థం చేసుకొని, భిన్న పరిమాణాల్లో ఫలిస్తాడని వచనం చెప్పిన మేరకే అనువదించడం.
  alternative: ఇక్కడ నిలకడ, నిజమైన మారుమనస్సు లేదా పునర్జన్మకు రుజువు అని స్పష్టంగా వ్యాఖ్యానించడం.
  rationale: గ్రీకు పాఠం వినడం, అర్థం చేసుకోవడం, ఫలించడం అనే అంశాలను చెబుతుంది; తరువాతి సిద్ధాంత వర్గీకరణలను ప్రత్యక్షంగా పేర్కొనదు. అందువల్ల అనువాదం ఏ సంప్రదాయానికీ ప్రత్యేకమైన నిర్ధారణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘వాక్యం,’ ‘ఫలించడం’ వంటి బైబిలు సంబంధిత పదాలను సహజ వ్యవసాయ భాషైన ‘నేల,’ ‘దిగుబడి’తో కలిపి, ఉపమానాన్ని స్పష్టంగా ఉంచాం.
