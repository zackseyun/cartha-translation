revisions:
- from: అయితే మంచి నేలపై విత్తబడినవాడు వాక్యాన్ని విని అర్థం చేసుకునేవాడు. అతడు నిజంగా ఫలించి దిగుబడి ఇస్తాడు—ఒకడు నూరంతలు, మరొకడు అరవై అంతలు, ఇంకొకడు ముప్పై అంతలు.[a]
  to: 'అయితే మంచి నేలపై విత్తబడినవాడు ఇతడే: వాక్యాన్ని విని అర్థం చేసుకొనేవాడు. అతడు నిజంగానే ఫలించి దిగుబడి ఇస్తాడు—ఒక సందర్భంలో నూరు, మరొక సందర్భంలో అరవై, ఇంకొక సందర్భంలో ముప్పై.[a]'
