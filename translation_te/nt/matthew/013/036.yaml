translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. యేసును ఉద్దేశించిన ఆజ్ఞార్థక విజ్ఞప్తిలో ‘వివరించండి’ అనే మర్యాదా బహువచనాన్ని ఉపయోగించాం. ప్రధాన పాఠం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉంచి, ζιζάνια యొక్క ప్రత్యేక అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
