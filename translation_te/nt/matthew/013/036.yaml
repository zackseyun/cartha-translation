id: MAT.13.36
reference: Matthew 13:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: te
  text: అప్పుడు ఆయన జనసమూహాలను విడిచిపెట్టి ఇంట్లోకి వెళ్లాడు. ఆయన శిష్యులు ఆయన దగ్గరకు వచ్చి, “పొలంలోని కలుపు మొక్కల[a] ఉపమానాన్ని మాకు వివరించండి” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కలుపు మొక్కలు” అని అనువదించిన గ్రీకు పదం, గోధుమలను పోలి ఉండే డార్నెల్ అనే ఒక ప్రత్యేక కలుపు మొక్కను సూచించవచ్చు.
    reason: ζιζάνια పదానికి సాధ్యమైన మరింత నిర్దిష్ట వృక్షశాస్త్ర అర్థాన్ని, ప్రధాన పాఠంలో అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: తర్వాత జరిగిన సంఘటనను పరిచయం చేసే సహజమైన కాలసూచక పదం.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: జనసమూహాలను విడిచిపెట్టి
  rationale: పూర్వకాలిక క్రియను సహజమైన తెలుగు సంయుక్త క్రియతో వ్యక్తపరుస్తూ, బహువచనమైన ὄχλους భావాన్ని నిలుపుతుంది.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: ఇంట్లోకి వెళ్లాడు
  rationale: బయటి ప్రదేశం నుంచి ఇంటి లోపలికి జరిగిన కదలికను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; గ్రీకు నిర్దిష్ట ఉపపదాన్ని తెలుగులో సందర్భానుగుణంగా ప్రత్యేక పదంతో చూపనవసరం లేదు.
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు ఆయన దగ్గరకు వచ్చి
  rationale: προσέρχομαι లోని సమీపించడం అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; కర్తను స్పష్టంగా ఉంచుతుంది.
- source_word: Διασάφησον ἡμῖν
  choice: మాకు వివరించండి
  rationale: స్పష్టం చేసి తెలియజేయమనే ఆజ్ఞార్థక విజ్ఞప్తిని గౌరవపూర్వకమైన ఆధునిక తెలుగు రూపంలో అందిస్తుంది.
- source_word: τὴν παραβολὴν
  choice: ఉపమానాన్ని
  rationale: సువార్తల సందర్భంలో παραβολήకు స్థిరంగా, విస్తృతంగా అర్థమయ్యే తెలుగు సమానార్థకం.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: పొలంలోని కలుపు మొక్కల
  rationale: గ్రీకు సంబంధవిభక్తి నిర్మాణాన్ని తెలుగులో సహజమైన స్థానసంబంధ నిర్మాణంగా మార్చుతుంది; ζιζάνιαను సాధారణ పాఠకులకు అర్థమయ్యేలా ‘కలుపు మొక్కలు’గా ఇస్తుంది.
