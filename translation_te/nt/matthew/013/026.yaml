id: MAT.13.26
reference: Matthew 13:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: te
  text: కాని పంట మొలకెత్తి గింజలు కాసినప్పుడు, అప్పుడు కలుపు మొక్కలు కూడా కనిపించాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గోధుమలను పోలిన కలుపు”; ఇది డార్నెల్ అనే ఒక నిర్దిష్ట కలుపు జాతి అయి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: అయితే ... అప్పుడు
  rationale: ὅτε కాలసంబంధాన్ని సూచిస్తుంది; δέ స్వల్ప మలుపు లేదా వ్యత్యాసాన్ని తెలియజేస్తుంది. తెలుగులో సహజమైన వాక్యనిర్మాణం కోసం కాలార్థాన్ని '-నప్పుడు'తో, అనుసంధానాన్ని 'అయితే'తో వ్యక్తపరిచాం.
- source_word: ἐβλάστησεν ὁ χόρτος
  choice: పంట మొలిచి
  rationale: χόρτος ఇక్కడ సాధారణ గడ్డి కాక, పొలంలో పెరుగుతున్న పంటను సూచిస్తుంది; ἐβλάστησεν మొలకెత్తడాన్ని తెలియజేస్తుంది.
- source_word: καρπὸν ἐποίησεν
  choice: గింజలు కాసినప్పుడు
  rationale: అక్షరార్థంగా 'ఫలాన్ని చేసింది' అయినా, గోధుమపంట సందర్భంలో దిగుబడి గింజలుగా ఏర్పడటమే భావం. 'గింజలు కాయడం' ఆధునిక తెలుగులో సహజమైన వ్యవసాయ ప్రయోగం.
- source_word: τότε ἐφάνη
  choice: కనిపించాయి
  rationale: τότε సూచించే కాలక్రమం ముందున్న '-నప్పుడు' నిర్మాణంలో వ్యక్తమవుతుంది; ἐφάνη అంటే అప్పటికి ప్రత్యక్షంగా కనిపించడం లేదా గుర్తుపడటం.
- source_word: καὶ τὰ ζιζάνια
  choice: కలుపు మొక్కలు కూడా
  rationale: ζιζάνια పంట మధ్య పెరిగే హానికరమైన కలుపును సూచిస్తుంది; καί యొక్క అదనపు భావాన్ని 'కూడా' తెలియజేస్తుంది. ఖచ్చితమైన మొక్కజాతి అనిశ్చితిని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ζιζάνια అనే మొక్క యొక్క నిర్దిష్ట గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో సాధారణంగా 'కలుపు మొక్కలు'
  alternative: గోధుమలను పోలిన డార్నెల్ అనే నిర్దిష్ట కలుపు జాతి
  rationale: గ్రీకు పదం పంట మధ్య పెరిగే కలుపును సూచించినా, దాని ఖచ్చితమైన వృక్షశాస్త్రీయ గుర్తింపు నిశ్చితం కాదు. ఉపమానంలోని భావాన్ని సులభంగా తెలియజేస్తూనే ఆ అనిశ్చితిని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వ్యవసాయ సందర్భానికి సహజంగా ఉండే 'పంట మొలిచి', 'గింజలు కాసినప్పుడు', 'కలుపు మొక్కలు' అనే పదబంధాలు వాడబడ్డాయి. పాఠ్యం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే మూలంలోని వృక్షశాస్త్రీయ అనిశ్చితి నిలిచేలా రూపొందించబడింది.
