id: MAT.13.47
reference: Matthew 13:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: te
  text: మళ్లీ, పరలోక రాజ్యం సముద్రంలో వేయబడి ప్రతి రకం నుండి పోగుచేసే[a] లాగుడు వల[b] లాంటిది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ప్రతి రకం నుండి పోగుచేసే’; చేపలు అనే పదం చేపల వేట దృశ్యం వల్ల అంతర్నిహితంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వల’; గ్రీకు పదం మరింత నిర్దిష్టంగా నీటిలో విస్తరించి లాగే పెద్ద వలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: మళ్లీ
  rationale: ఇది వరుసలో మరో ఉపమానాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: ὁμοία ἐστὶν
  choice: లాంటిది
  rationale: మత్తయి సువార్తలోని పోలిక సూత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి వాడిన ప్రత్యేక పదబంధాన్ని దేవుని రాజ్యం అని మార్చకుండా, తెలుగులో సుపరిచితమైన రూపంలో నిలుపుతుంది.
- source_word: σαγήνῃ
  choice: లాగుడు వల
  rationale: సాధారణ వలకన్నా, నీటిలో విస్తరించి లాగే పెద్ద వల అనే నిర్దిష్ట భావాన్ని తెలియజేస్తుంది.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: సముద్రంలో వేయబడి
  rationale: కర్మణి ప్రయోగాన్ని, అలాగే θάλασσα అనే మూలపాఠంలోని ‘సముద్రం’ పదాన్ని నిలుపుతుంది.
- source_word: ἐκ παντὸς γένους συναγαγούσῃ
  choice: అన్ని రకాలవాటినీ పోగుచేసిన
  rationale: చేపలు అనే కర్మ మూలపాఠంలో స్పష్టంగా లేకపోవడంతో దానిని నేరుగా చేర్చలేదు; అయితే తెలుగులో వాక్యం సహజంగా ఉండేందుకు తటస్థమైన ‘వాటిని’ వాడి, మూలంలోని అన్ని రకాల భావాన్ని నిలిపింది.
theological_decisions:
- issue: ‘పరలోక రాజ్యం’ అనే మాట యొక్క భావం
  choice: మత్తయి వాడిన ‘పరలోక రాజ్యం’ అనే రూపాన్నే నిలుపడం
  alternative: దేవుని రాజ్యం; పరలోక పరిపాలన
  rationale: మూలపాఠంలోని మత్తయి ప్రత్యేక పదప్రయోగాన్ని మరో సమానార్థక దైవశాస్త్రీయ రూపంతో భర్తీ చేయకుండా కాపాడుతుంది.
- issue: ‘ప్రతి రకం’ దేనిని సూచిస్తుందనే అంశం
  choice: ప్రధాన పాఠంలో చేపలు అని స్పష్టీకరించకుండా ‘అన్ని రకాలవాటినీ’ అని ఉంచడం
  alternative: అన్ని రకాల చేపలను
  rationale: చేపల వేట దృశ్యంలో చేపలు ఉద్దేశించబడ్డాయని స్పష్టమే అయినా, గ్రీకు పాఠం ఆ నామవాచకాన్ని ప్రత్యక్షంగా చెప్పదు; కాబట్టి ఆ స్వల్ప అంతర్నిహితత్వాన్ని నిలిపి, పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. ‘లాగుడు వల’ నిర్దిష్టమైనదే అయినా సందర్భంలో సులభంగా గ్రహించగల పదం; వాక్య నిర్మాణం మూలంలోని పోలికను, కర్మణి భావాన్ని నిలుపుతూ సహజంగా ఉంచబడింది.
