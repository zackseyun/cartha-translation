id: MAT.13.19
reference: Matthew 13:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: te
  text: ఎవరైనా రాజ్య వాక్యాన్ని విని దాన్ని అర్థం చేసుకోనప్పుడు, దుష్టుడు[a] వచ్చి అతని హృదయంలో విత్తబడినదాన్ని లాక్కుపోతాడు. దారి పక్కన విత్తబడినవాడు[b] ఇతడే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దుర్మార్గుడు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘బాట వెంబడి విత్తబడినవాడు’ లేదా ‘బాట పక్కన విత్తబడినవాడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: ఎవరైనా … విని
  rationale: ఈ గ్రీకు నిర్మాణంలోని సాధారణ, ప్రతి వ్యక్తికీ వర్తించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὸν λόγον τῆς βασιλείας
  choice: రాజ్య వాక్యాన్ని
  rationale: λόγοςలోని ‘వాక్యం/సందేశం’ భావాన్ని, అలాగే ఉపమానంలో విత్తనం–వాక్యం మధ్య ఉన్న రూపక సంబంధాన్ని నిలుపుతుంది; గ్రీకు సంబంధవిభక్తిలోని సంక్షిప్తతను అనవసరంగా వివరిస్తూ విస్తరించదు.
- source_word: μὴ συνιέντος
  choice: దాన్ని అర్థం చేసుకోనప్పుడు
  rationale: సందేశం యొక్క అర్థాన్ని గ్రహించకపోవడాన్ని సహజంగా తెలియజేస్తుంది; ‘దాన్ని’ అనేది ముందున్న రాజ్య వాక్యాన్ని సూచిస్తుంది.
- source_word: ὁ πονηρὸς
  choice: దుష్టుడు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ఈ విశేషణాన్ని సందర్భానుసారం వ్యక్తిగత దుష్ట ప్రతినిధిగా చూపుతుంది; అతడు వచ్చి వాక్యాన్ని లాక్కుపోతున్న క్రియాశీల పాత్రకు ఇది సరిపోతుంది.
- source_word: ἁρπάζει
  choice: లాక్కుపోతాడు
  rationale: ἁρπάζωలోని ఆకస్మికమైన, బలవంతపు తీసివేత భావాన్ని సజీవంగా నిలుపుతుంది.
- source_word: τὸ ἐσπαρμένον
  choice: విత్తబడినదాన్ని
  rationale: నపుంసకలింగ సంపూర్ణ కర్మణి కృదంతాన్ని పదార్థీకృత రూపంలో చూపుతూ, విత్తబడిన ‘వాక్యం’తో సంబంధాన్ని నిలుపుతుంది.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: అతని హృదయంలో
  rationale: మూలంలోని ఏకవచన పురుషలింగ సర్వనామాన్నీ, బైబిలు మానవశాస్త్ర సంబంధమైన ‘హృదయం’ అనే పదాన్నీ నేరుగా నిలుపుతుంది.
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: దారి పక్కన విత్తబడినవాడు
  rationale: విత్తబడిన విత్తనంతో వినేవాణ్ణి రూపకాలంకారంగా ఏకం చేసే మూలవాక్యంలోని ఉద్దేశపూర్వక భావబదలాయింపును సరిచేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: ὁ πονηρὸς యొక్క గుర్తింపు
  choice: వ్యక్తిగత దుష్ట ప్రతినిధి (‘దుష్టుడు’)
  alternative: అమూర్తమైన దుష్టత్వం (‘చెడు’)
  rationale: వచ్చి, విత్తబడినదాన్ని లాక్కుపోయే క్రియాశీల పాత్రను సందర్భం వ్యక్తిగా సూచిస్తుంది; అయితే వాక్యంలో లేనంతగా అతని గుర్తింపును మరింత నిర్దిష్టం చేయలేదు.
- issue: αὐτοῦలోని లింగ సూచన
  choice: ‘అతని హృదయంలో’
  alternative: ‘వారి హృదయంలో’ లేదా ‘హృదయంలో’
  rationale: గ్రీకులోని ఏకవచన పురుషలింగ రూపాన్ని నిలుపుతుంది; వాక్యారంభంలోని ‘ఎవరైనా’ దాని సాధారణ వర్తింపును స్పష్టం చేస్తుంది.
- issue: వినేవాడు మరియు విత్తబడినది మధ్య రూపక గుర్తింపు
  choice: ‘విత్తబడినవాడు ఇతడే’ అని మూలంలోని ఉద్రిక్తతను నిలపడం
  alternative: ‘దారి పక్క నేలవంటివాడు ఇతడే’ అని రూపకాన్ని వివరణాత్మకంగా సవరించడం
  rationale: గ్రీకు వాక్యం వ్యక్తినే ‘విత్తబడినవాడు’గా పేర్కొంటుంది. దానిని సులభతరం చేస్తే యేసు వివరణలోని విత్తనం–నేల–వినేవాడు సంబంధాన్ని అనవసరంగా పరిష్కరించినట్టవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘రాజ్య వాక్యం,’ ‘హృదయం,’ ‘విత్తబడినవాడు’ వంటి పదాలు మూలంలోని బైబిలు రూపకాలను నిలుపుతాయి; ‘లాక్కుపోతాడు’ క్రియ దృశ్యానికి తగిన సజీవతను ఇస్తుంది. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
