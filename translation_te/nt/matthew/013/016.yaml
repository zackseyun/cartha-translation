id: MAT.13.16
reference: Matthew 13:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: te
  text: కానీ మీ కళ్లు చూస్తున్నందుకు, మీ చెవులు వింటున్నందుకు ధన్యమైనవి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వచనాల్లో చూడని, వినని వారితో శిష్యులను వ్యత్యాసపరుస్తుంది; ఆధునిక తెలుగులో సహజమైన వ్యతిరేక సంధానపదం.
- source_word: μακάριοι
  choice: ధన్యమైనవి
  rationale: కేవలం మనోభావపరమైన సంతోషం కాక, దేవుని అనుగ్రహం పొందిన శుభస్థితిని సూచించే బైబిలు ప్రయోగాన్ని నిలుపుతుంది.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: మీ కళ్లు
  rationale: గ్రీకు స్వామ్య నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో వ్యక్తపరుస్తుంది.
- source_word: ὅτι βλέπουσιν
  choice: చూసే
  rationale: కళ్లు ధన్యమైనవిగా చెప్పడానికి అవి చూడడమే కారణమని తెలుగు సంబంధకృదంత నిర్మాణం సహజంగా తెలియజేస్తుంది; మూలంలోని సరళమైన దృశ్యక్రియను నిలుపుతుంది.
- source_word: τὰ ὦτα ὑμῶν
  choice: మీ చెవులు
  rationale: మొదటి భాగానికి సమాంతరంగా, స్వామ్యాన్ని సహజమైన తెలుగు రూపంలో అందిస్తుంది.
- source_word: ὅτι ἀκούουσιν
  choice: వినే
  rationale: మూలంలోని శ్రవణక్రియను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతూ కారణార్థాన్ని సహజమైన తెలుగు నిర్మాణంలో తెలియజేస్తుంది.
theological_decisions:
- issue: చూడడం, వినడం ఆధ్యాత్మిక క్రియలని అనువాదంలో స్పష్టంగా చేర్చాలా?
  choice: “చూసే,” “వినే” అనే అక్షరార్థ ఇంద్రియ భాషనే ఉంచడం.
  alternative: “గ్రహించే,” “అర్థం చేసుకునే” అని అనువదించడం.
  rationale: సందర్భంలో ఆధ్యాత్మిక గ్రహింపు అంతర్లీనంగా ఉన్నా, ఈ వచనం స్వయంగా కళ్లు చూడడం, చెవులు వినడం అనే భాషనే వాడుతుంది. సందర్భమే లోతైన భావాన్ని తెలియజేయనివ్వడం మూలంలోని ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది.
- issue: ὅτι యొక్క కారణార్థాన్ని ప్రత్యేక కారణవాచక పదంతో వ్యక్తపరచాలా?
  choice: తెలుగు సంబంధకృదంతాలైన “చూసే,” “వినే” ద్వారా కారణ సంబంధాన్ని సహజంగా వ్యక్తపరచడం.
  alternative: “ఎందుకంటే అవి చూస్తున్నాయి ... ఎందుకంటే అవి వింటున్నాయి” అని స్పష్టంగా అనువదించడం.
  rationale: రెండూ కారణార్థాన్నే అందిస్తాయి. ఎంపిక చేసిన రూపం ఆధునిక తెలుగులో మరింత సహజంగా ఉండి, గ్రీకు సమాంతరతను సంక్షిప్తంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ధన్యవచన శైలికి తగిన గౌరవప్రదమైన “ధన్యమైనవి” అనే పదాన్ని ఉపయోగించాం. రెండు భాగాల సమాంతరతను “చూసే మీ కళ్లూ, వినే మీ చెవులూ” ద్వారా నిలిపాం.
