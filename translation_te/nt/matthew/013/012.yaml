id: MAT.13.12
reference: Matthew 13:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: te
  text: ఎందుకంటే, ఎవరికైతే ఉందో, అతనికి ఇవ్వబడుతుంది, అతనికి సమృద్ధి కలుగుతుంది; కాని ఎవరికైతే లేదో, అతనికి ఉన్నది కూడా అతని నుండి తీసివేయబడుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅστις
  choice: ఉన్నవానికి / లేనివాని
  rationale: ఈ అనిశ్చిత సంబంధ సర్వనామం సాధారణంగా వర్తించే సూత్రాన్ని తెలియజేస్తుంది. తెలుగులో ‘ఎవరైతే’ అని రెండుసార్లు విస్తరించకుండా, ‘ఉన్నవానికి … లేనివాని’ అనే సహజమైన ఏకవచన నిర్మాణం దాని సాధారణ, ప్రతినిధి భావాన్ని నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే అనుసంధాన బలాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔχει / οὐκ ἔχει
  choice: ఉన్నవానికి / లేనివాని
  rationale: గ్రీకులో ఉన్నట్లే దేనిని కలిగి ఉన్నాడో చెప్పకుండా వదిలి, వాక్యంలోని విస్తృత ప్రయోజనాన్ని కాపాడుతుంది.
- source_word: δοθήσεται αὐτῷ
  choice: ఇవ్వబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతుంది. గ్రీకులో ప్రత్యక్షంగా లేని ‘మరింత’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు; స్వీకర్త భావం ‘ఉన్నవానికి’లోనే వ్యక్తమవుతుంది.
- source_word: περισσευθήσεται
  choice: అతనికి సమృద్ధి కలుగుతుంది
  rationale: ఫలితంగా సమృద్ధిగా ఉండే స్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘అతడు విస్తరిస్తాడు’ వంటి అసహజమైన అక్షరానువాదాన్ని నివారిస్తుంది.
- source_word: δὲ
  choice: కాని
  rationale: ఉన్నవాడు, లేనివాడు అనే రెండు భాగాల మధ్య స్పష్టమైన వ్యత్యాసాన్ని చూపుతుంది.
- source_word: καὶ ὃ ἔχει
  choice: అతనికి ఉన్నది కూడా
  rationale: ఇక్కడ καί ఉత్కర్షార్థకంగా ఉంది; ‘కూడా’ అనేది ‘ఉన్నది సైతం’ తీసివేయబడే విరోధాభాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: అతనికి ఉన్నది కూడా తీసివేయబడుతుంది
  rationale: αἴρω యొక్క భవిష్యత్ కర్మణి భావాన్నీ, ἀπό సూచించే వేరుచేయడం లేదా తొలగించడం అనే భావాన్నీ స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘కలిగి ఉండడం’ మరియు ‘ఇవ్వబడడం’ యొక్క అంతర్లీన కర్మ
  choice: దేనిని కలిగి ఉన్నాడో, ఏమి ఇవ్వబడుతుందో ప్రధాన పాఠ్యంలో పేర్కొనలేదు.
  alternative: దీనిని అవగాహన, స్వీకార మనస్సు, విశ్వాసం లేదా రాజ్య రహస్యాల జ్ఞానం అని స్పష్టీకరించడం.
  rationale: సందర్భం యేసు బోధనను గ్రహించడం మరియు పరలోక రాజ్య రహస్యాలకు సంబంధించినదైనా, గ్రీకు వాక్యం కర్మను చెప్పదు. అందువల్ల దాని ఉద్దేశపూర్వక విస్తృతతను అనువాదం నిలుపుతుంది.
- issue: ఏకవచన ప్రతినిధి వ్యక్తి
  choice: ‘ఉన్నవానికి … అతనికి … లేనివాని’ అనే ఏకవచన సాధారణ నిర్మాణాన్ని వాడింది.
  alternative: ‘ఎవరికి ఉంటాయో వారికి’ వంటి బహువచన లేదా లింగతటస్థ పునర్నిర్మాణం.
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ ఏకవచనం ఒక సాధారణ ప్రతినిధిగా పనిచేస్తుంది. తెలుగు ఏకవచన నిర్మాణం ఆ రూపాన్నీ సాధారణ వర్తింపునీ రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన సామెతసదృశ వాక్య నిర్మాణం వాడబడింది. ‘ఎవనికి’ వంటి పాత రూపాలను నివారించి, మూలంలోని ఏకవచన సాధారణ భావం మరియు కర్మణి నిర్మాణాలు నిలుపబడ్డాయి.
