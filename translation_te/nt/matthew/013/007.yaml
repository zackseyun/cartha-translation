  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: te
  text: మరికొన్ని విత్తనాలు ముళ్లపొదల మధ్య పడ్డాయి; ఆ ముళ్లపొదలు పెరిగి వాటిని ఉక్కిరిబిక్కిరి చేశాయి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλα
  choice: మరికొన్ని విత్తనాలు
  rationale: నపుంసక బహువచన విశేషణం ఇక్కడ నామవాచకంగా వాడబడింది; ముందున్న సందర్భం ప్రకారం సూచించబడిన ‘విత్తనాలు’ను తెలుగులో సహజమైన స్పష్టత కోసం చేర్చాం.
- source_word: δὲ
  choice: ;
  rationale: δέ కథనంలోని తదుపరి అంశాన్ని స్వల్పంగా అనుసంధానిస్తుంది. తెలుగు వాక్యప్రవాహంలో ‘మరి’ మరియు విరామచిహ్నం ద్వారా ఈ సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: ἔπεσεν
  choice: పడ్డాయి
  rationale: πίπτω అనే క్రియకు నేరమైన అర్థం ‘పడటం’; సందర్భాన్ని బట్టి ‘విత్తబడ్డాయి’ అని మార్చకుండా మూలంలోని చిత్రణను నిలిపాం.
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: ముళ్లపొదల మధ్య
  rationale: ἐπί + ద్వితీయా విభక్తి అక్షరార్థంగా ‘మీద’ అయినప్పటికీ, వ్యవసాయ సందర్భంలో విత్తనాలు ముళ్ల మొక్కలున్న చోట పడటాన్ని తెలుగులో ‘మధ్య’ అనడం సహజం.
- source_word: ἀκάνθας / ἄκανθαι
  choice: ముళ్లపొదలు
  rationale: ἄκανθα ముళ్ల మొక్కలను సూచిస్తుంది. ‘ముళ్లు’ కంటే ‘ముళ్లపొదలు’ పెరిగి విత్తనాలను అణచివేసే మొక్కల చిత్రాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀνέβησαν
  choice: పెరిగి
  rationale: ἀναβαίνω ఇక్కడ మొక్కలు పైకి రావడం లేదా పెరగడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘పెరిగి’ సహజంగా ఉంటుంది.
- source_word: ἔπνιξαν
  choice: అణచివేశాయి
  rationale: πνίγω యొక్క ‘ఉక్కిరిబిక్కిరి చేయడం/గొంతు నులిమివేయడం’ అనే బలమైన రూపకాన్ని, మొక్కల పెరుగుదలను నిరోధించే వ్యవసాయ సందర్భంలో ‘అణచివేశాయి’ సహజంగా అందిస్తుంది.
- source_word: αὐτά
  choice: వాటిని
  rationale: నపుంసక బహువచన సర్వనామాన్ని తెలుగులో బహువచన సూచనగా ‘వాటిని’తో నిలిపాం; అది సందర్భంలోని విత్తనాలు లేదా వాటి నుంచి మొలిచిన మొక్కలను సూచించే మూలంలోని స్వల్ప అస్పష్టతను కాపాడుతుంది.
