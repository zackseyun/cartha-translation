translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలిని వాడాం. గ్రీకులో ఏకవచన క్రియ ఉన్నప్పటికీ, నపుంసక బహువచన కర్తతో గ్రీకులో అది సహజం; తెలుగులో ‘విత్తనాలు… పడ్డాయి… మొలిచాయి’ అని బహువచన సర్దుబాటు చేశాం.
