id: MAT.13.5
reference: Matthew 13:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: te
  text: మరికొన్ని విత్తనాలు రాతినేలపై[a] పడ్డాయి. అక్కడ మట్టి ఎక్కువగా లేదు; మట్టికి లోతు లేకపోవడంతో అవి వెంటనే మొలిచాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘రాతి ప్రదేశాలపై’; కింద రాతిపొర ఉండి, దానిపై మట్టి పలుచగా ఉన్న నేలను ఈ మాట సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: మరికొన్ని విత్తనాలు
  rationale: నపుంసక బహువచన విశేషణం ముందటి వచనంలోని విత్తనాలను సూచిస్తుంది; తెలుగులో భావస్పష్టత కోసం ‘విత్తనాలు’ను చేర్చి, పంపిణీ సంబంధమైన వ్యత్యాసాన్ని ‘మరికొన్ని’తో నిలిపాం.
- source_word: ἔπεσεν
  choice: పడ్డాయి
  rationale: మూలంలోని సాధారణ ‘పడటం’ అనే చిత్రణను నిలిపాం; ‘విత్తబడ్డాయి’ అనడం మూలపదానికి మించిన వివరణ అవుతుంది.
- source_word: ἐπὶ τὰ πετρώδη
  choice: రాతినేలపై
  rationale: ఈ పదబంధం రాళ్లు కనబడే నేలను మాత్రమే కాక, కింద రాతిపొర ఉండి పైమట్టి తక్కువగా ఉన్న ప్రదేశాలను సూచించగలదు. సహజమైన ఆధునిక తెలుగు కోసం ‘రాతినేలపై’ ఎంచుకున్నాం; వివరాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: అక్కడ మట్టి ఎక్కువగా లేకపోవడంతో
  rationale: వ్యవసాయ సందర్భంలో γῆకు ‘మట్టి’ సహజం. గ్రీకు వాక్యంలోని పరిస్థితిని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ εὐθέως
  choice: వెంటనే
  rationale: εὐθέωςలోని తక్షణత్వాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐξανέτειλεν
  choice: మొలిచాయి
  rationale: విత్తనాలు నేలలోనుంచి పైకి రావడాన్ని తెలుగులో సహజంగా సూచించే వ్యవసాయ పదం.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: మట్టి లోతుగా లేనందువల్ల
  rationale: διάతో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ తెలిపే కారణాన్ని నిలిపి, βάθος γῆς అనే ‘మట్టి లోతు’ చిత్రణను సహజమైన తెలుగులో వ్యక్తం చేశాం.
