revisions:
- from: అయితే అతడు, “వద్దు; కలుపు మొక్కలను[a] ఏరుతుండగా వాటితో పాటు గోధుమలను కూడా వేళ్లతో సహా పీకివేస్తారేమో” అన్నాడు.
  to: 'కానీ అతడు ఇలా అన్నాడు: “వద్దు; కలుపు మొక్కలను[a] ఏరుతుండగా, వాటితో పాటు గోధుమలను కూడా వేర్లతో సహా పీకివేస్తారేమో.”'
  rationale: The revision corrects the root-related sense of ἐκριζώσητε, retains the warning’s possible outcome with “పీకివేస్తారేమో,” and revises the lexical note to preserve uncertainty concerning the botanical referent.
  reviewer_model: gpt-5.6-terra
