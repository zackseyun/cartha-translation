id: MAT.13.29
reference: Matthew 13:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δέ ⸀φησιν· Οὔ, μήποτε συλλέγοντες τὰ ζιζάνια ἐκριζώσητε ἅμα αὐτοῖς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: te
  text: 'కానీ అతడు ఇలా అన్నాడు: “వద్దు; కలుపు మొక్కలను[a] ఏరుతుండగా, వాటితో పాటు గోధుమలను కూడా వేర్లతో సహా పీకివేస్తారేమో.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయ అనువాదంలో “తారెస్”; బహుశా తొలిదశల్లో గోధుమలను పోలి కనిపించే డార్నెల్ అనే కలుపుమొక్క.
    reason: lexical_alternative
lexical_decisions:
- source_word: φησιν
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథనశైలిలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: Οὔ
  choice: వద్దు
  rationale: పనివారు ప్రతిపాదించిన చర్యను యజమాని నేరుగా నిరాకరిస్తున్న సందర్భంలో ‘వద్దు’ సహజమైన తెలుగు ప్రతిస్పందన.
- source_word: μήποτε
  choice: పీకివేస్తారేమో
  rationale: జరగకూడని సంభావ్య పరిణామంపై హెచ్చరికను ‘ఏమో’ రూపం సహజంగా తెలియజేస్తుంది.
- source_word: συλλέγοντες
  choice: ఏరుతుండగా
  rationale: కలుపును పోగుచేసే చర్య జరుగుతున్నప్పుడే గోధుమలు పీకివేయబడే ప్రమాదాన్ని సమకాలిక క్రియారూపంగా వ్యక్తం చేస్తుంది.
- source_word: ζιζάνια
  choice: కలుపు మొక్కలు
  rationale: సాధారణ ఆధునిక పాఠకులకు స్పష్టమైన పదబంధం; గోధుమను పోలే డార్నెల్ అనే మరింత నిర్దిష్ట అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐκριζώσητε
  choice: వేళ్లతో సహా పీకివేస్తారు
  rationale: మొక్కను కేవలం కోయడం కాకుండా వేరుతో పెకలించడమే గ్రీకు క్రియ భావం.
- source_word: ἅμα αὐτοῖς
  choice: వాటితో పాటు
  rationale: కలుపుతో కలిపి గోధుమలు కూడా తొలగించబడే ప్రమాదాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: σῖτον
  choice: గోధుమలు
  rationale: ఈ వ్యవసాయ సందర్భంలో సాధారణ ధాన్యం కంటే గోధుమ పంటనే సూచించడం సముచితం.
theological_decisions:
- issue: ప్రసిద్ధ ఉపమానంలో ζιζάνια పదం అనువాదం
  choice: కలుపు మొక్కలు
  alternative: గోధుమలవలె కనిపించే విషకలుపు (డార్నెల్)
  rationale: ఈ పదం సిద్ధాంతపరమైన వివాదాన్ని నిర్ణయించదు. ప్రధాన పాఠ్యంలో సులభంగా అర్థమయ్యే సాధారణ పదాన్ని వాడి, వృక్షశాస్త్రపరంగా మరింత నిర్దిష్టమైన అవకాశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. సంభాషణ నేరుగా, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా ఉంది; మూలంలోని హెచ్చరికాత్మక సంభావ్యతను ‘ఏమో’ రూపంతో నిలిపాం.
