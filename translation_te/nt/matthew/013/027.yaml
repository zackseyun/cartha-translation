revisions:
- from: అప్పుడు ఇంటి యజమాని దాసులు అతని దగ్గరికి వచ్చి, “ప్రభువా, నువ్వు నీ పొలంలో మంచి విత్తనం విత్తావు కదా? మరి దానిలో కలుపు మొక్కలు[a] ఎక్కడి నుంచి వచ్చాయి?” అని అడిగారు.
  to: అప్పుడు ఇంటి యజమాని దాసులు అతని దగ్గరికి వచ్చి, “ప్రభువా, మీరు మీ పొలంలో మంచి విత్తనం విత్తారు కదా? మరి దానిలో కలుపు మొక్కలు[a] ఎక్కడి నుంచి వచ్చాయి?” అని అడిగారు.
  rationale: ప్రధాన వాక్యార్థాన్ని మార్చకుండా, గౌరవసంబోధనకు తగిన ఏకవచన గౌరవప్రయోగాన్ని ఉపయోగించాం. ζιζάνια పాదటిప్పణి నుండి మూలపదం నిర్ధారించని ‘విషపు’ అనే అదనపు వాదనను తొలగించి, గోధుమను తొలిదశలో పోలి కనిపించే డార్నెల్ అనే సంభావ్యతను మాత్రమే నిలిపాం. పాదటిప్పణి గుర్తు కలుపు మొక్కలు అనే పదం వద్దనే ఉంచబడింది.
