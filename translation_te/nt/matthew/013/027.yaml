id: MAT.13.27
reference: Matthew 13:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: te
  text: అప్పుడు ఇంటి యజమాని దాసులు అతని దగ్గరికి వచ్చి, “ప్రభువా, మీరు మీ పొలంలో మంచి విత్తనం విత్తారు కదా? మరి దానిలో కలుపు మొక్కలు[a] ఎక్కడి నుంచి వచ్చాయి?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గోధుమలను తొలిదశలో పోలి కనిపించే డార్నెల్ అనే కలుపు.”
    reason: ζιζάνιαకు సాధారణ ‘కలుపు మొక్కలు’ కంటే నిర్దిష్టమైన డార్నెల్ అర్థం ఉండవచ్చని సూచిస్తుంది; మూలంలో లేని ‘విషపు’ అనే విశేషణాన్ని జోడించదు.
lexical_decisions:
- source_word: προσελθόντες
  choice: అతని దగ్గరికి వచ్చి
  rationale: యజమాని వైపు చేరుకొని, ఆ తరువాత మాట్లాడిన అనుబంధ క్రియను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δοῦλοι
  choice: దాసులు
  rationale: యజమాని అధికారానికి లోబడిన బానిస స్థితిని పూర్తిగా మృదువుచేయకుండా, గౌరవప్రదమైన ఆధునిక బైబిలు తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἰκοδεσπότου
  choice: ఇంటి యజమాని
  rationale: ఇంటిమీద అధికారం గల యజమాని అనే మూలపద భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριοςకు ప్రాజెక్టు సాధారణ సమానార్థకాన్ని నిలుపుతూ, ఈ సందర్భంలో యజమానిని గౌరవంగా సంబోధించే భావాన్ని ఇస్తుంది.
- source_word: οὐχὶ
  choice: విత్తావు కదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే గ్రీకు ప్రశ్న బలాన్ని సహజమైన తెలుగు ప్రశ్నాంతంతో వ్యక్తం చేస్తుంది.
- source_word: καλὸν σπέρμα
  choice: మంచి విత్తనం
  rationale: వ్యవసాయ సందర్భంలోని సాధారణ, స్పష్టమైన అర్థాన్ని నేరుగా అందిస్తుంది.
- source_word: ἔσπειρας
  choice: విత్తావు
  rationale: విత్తనాన్ని చల్లడం అనే σπείρω యొక్క నిర్దిష్ట వ్యవసాయ భావాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: నీ పొలంలో
  rationale: రెండవ పురుష ఏకవచన స్వామ్యాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πόθεν οὖν
  choice: మరి ... ఎక్కడి నుంచి
  rationale: πόθεν సూచించే మూలాన్ని, οὖν సూచించే నిర్గమన సంబంధాన్ని సహజమైన తెలుగు వాక్యక్రమంలో నిలుపుతుంది.
- source_word: ἔχει ζιζάνια
  choice: దానిలో కలుపు మొక్కలు ... వచ్చాయి
  rationale: గ్రీకు వాక్యం పొలంలో కలుపు ఉండటాన్ని ప్రశ్నించినా, తెలుగు భాషలో దాని మూలాన్ని అడిగే సహజ రూపం ‘ఎక్కడి నుంచి వచ్చాయి?’; ‘దానిలో’ పొలంతో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: ζιζάνια
  choice: కలుపు మొక్కలు
  rationale: సాధారణ పాఠకులకు స్పష్టమైన ప్రధాన పాఠ్య రూపం; గోధుమను పోలిన డార్నెల్ అనే మరింత నిర్దిష్ట సాధ్యతను పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: ఉపమానంలోని δοῦλοι పద ప్రయోగం
  choice: దాసులు
  alternative: సేవకులు; బానిసలు
  rationale: ‘సేవకులు’ బంధిత సామాజిక స్థితిని మృదువుచేయవచ్చు; ‘బానిసలు’ మరింత ప్రత్యక్షమైనా ఈ గౌరవప్రద కథన శైలిలో ‘దాసులు’ అధికార సంబంధాన్ని నిలుపుతూ సహజంగా ఉంటుంది.
- issue: κύριε సంబోధన
  choice: ప్రభువా
  alternative: యజమానీ; అయ్యా
  rationale: ఈ సంభాషణలో అది ఇంటి యజమానికి గౌరవ సంబోధన; ప్రత్యక్ష క్రీస్తుశాస్త్రీయ వాదన చేయకుండా κύριος యొక్క సాధారణ అనువాదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘నువ్వు’ ఏకవచన మూలరూపాన్ని నిలుపుతుంది; ‘కదా?’ సానుకూల సమాధానాన్ని ఆశించే ప్రశ్నను సహజంగా వ్యక్తం చేస్తుంది. పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదం వెంట ఉంచబడింది.
