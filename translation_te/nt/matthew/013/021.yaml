id: MAT.13.21
reference: Matthew 13:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: te
  text: అయితే అతనిలో వేరు లేదు; అతడు కొంతకాలమే నిలిచేవాడు. వాక్యం కారణంగా పీడన గానీ హింస గానీ వచ్చినప్పుడు, వెంటనే తొట్రిల్లిపోతాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెనుదిరుగుతాడు” లేదా “అభ్యంతరపడతాడు.” గ్రీకు క్రియకు “తొట్రిల్లడం,” “వెనుదిరగడం,” లేదా “అభ్యంతరపడడం” అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτῷ
  choice: అతనిలో వేరు
  rationale: విత్తనాల ఉపమానానికి చెందిన ‘వేరు’ అనే వ్యవసాయ రూపకాన్ని అలాగే ఉంచి, ἐν ἑαυτῷ యొక్క అంతర్గత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πρόσκαιρός
  choice: కొంతకాలం మాత్రమే నిలిచి ఉంటాడు
  rationale: ‘తాత్కాలికుడు’ అనే అసహజమైన వ్యక్తివర్ణనకు బదులుగా, పరిమిత కాలం మాత్రమే కొనసాగడాన్ని సహజంగా తెలియజేస్తుంది; సందర్భంలోని నిలకడలేమిని మితంగా సూచిస్తుంది.
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: కష్టం గానీ హింస గానీ కలిగినప్పుడు
  rationale: గ్రీకు genitive absolute నిర్మాణాన్ని కాలార్థక ఉపవాక్యంగా సహజంగా అనువదించింది. θλῖψις లోని ఒత్తిడి/బాధ భావానికి ‘కష్టం’, διωγμός కు ‘హింస’ స్పష్టమైన ఆధునిక సమానార్థకాలు.
- source_word: διὰ τὸν λόγον
  choice: వాక్యం కారణంగా
  rationale: λόγος కు ‘వాక్యం’ అని అనువదించడం ఈ ఉపమానంలోని ప్రకటిత సందేశంతో ఉన్న పదబంధ సంబంధాన్ని కాపాడుతుంది; διά యొక్క కారణార్థాన్ని ‘కారణంగా’ స్పష్టంగా అందిస్తుంది.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: ప్రతికూల పరిస్థితి ఎదురైన వెంటనే కలిగే ప్రతిస్పందనను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σκανδαλίζεται
  choice: తొట్రిల్లిపోతాడు
  rationale: గ్రీకు క్రియలోని తొట్రిల్లేలా చేయబడటం, వెనుదిరగటం, అభ్యంతరపడటం అనే విస్తృత భావాన్ని పూర్తిగా ఒకే సిద్ధాంతపరమైన అర్థానికి పరిమితం చేయకుండా రూపకంగా కాపాడుతుంది.
- source_word: δὲ ... ἀλλὰ
  choice: అయితే ...;
  rationale: మునుపటి వాక్యంతో ఉన్న వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది; రెండో δέ ను కొత్త వాక్యంలో ప్రత్యేకంగా అనువదించకుండా సహజ తెలుగు ప్రవాహంలో సంబంధాన్ని నిలిపింది.
theological_decisions:
- issue: శిష్యత్వ సందర్భంలో σκανδαλίζεται యొక్క అర్థం
  choice: తొట్రిల్లిపోతాడు
  alternative: వెనుదిరుగుతాడు; అభ్యంతరపడతాడు
  rationale: ఒత్తిడి వచ్చినప్పుడు వ్యక్తి నిలకడ కోల్పోవడాన్ని ‘తొట్రిల్లిపోతాడు’ తెలియజేస్తుంది. ఇది ‘విశ్వాసాన్ని పూర్తిగా విడిచిపెడతాడు’ అని సిద్ధాంతపరంగా ముందే నిర్ణయించకుండా, గ్రీకు పదంలోని విస్తృతతను నిలుపుతుంది; ఇతర భావఛాయలు పాదసూచికలో ఇవ్వబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. వ్యవసాయ రూపకం కాపాడబడింది; అసహజమైన అక్షరానువాదాన్ని నివారించేందుకు πρόσκαιρός ను కాలపరిమితి మరియు నిలకడ భావంతో సహజంగా వ్యక్తం చేసింది.
