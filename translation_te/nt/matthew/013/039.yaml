id: MAT.13.39
reference: Matthew 13:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: te
  text: వాటిని విత్తిన శత్రువు అపవాది; కోత యుగాంతం[a]; కోత కోసేవారు దేవదూతలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యుగ పరిపూర్తి”; సంప్రదాయంగా “లోకాంతం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: శత్రువు
  rationale: వ్యక్తిగతంగా ఎదిరించే వానిని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: ὁ σπείρας
  choice: విత్తిన
  rationale: పూర్తయిన విత్తే చర్యను తెలిపే భూతకాల కృదంతాన్ని, ఉపమానంలోని వ్యవసాయ చిత్రణను నిలుపుతూ అందిస్తుంది.
- source_word: αὐτά
  choice: వాటిని
  rationale: ముందు ప్రస్తావించిన కలుపు మొక్కలను సహజంగా వెనుకకు సూచిస్తుంది.
- source_word: διάβολος
  choice: అపవాది
  rationale: తెలుగు బైబిలు వాడుకలో వ్యక్తిగత దుష్టునికి స్థిరమైన పేరుగా ఉంది; పదానికి సంబంధించిన అపనిందకుడు అనే భావాన్ని కూడా నిలుపుతుంది.
- source_word: θερισμὸς
  choice: కోత
  rationale: వ్యవసాయ రూపకానికి సరళమైన, సాధారణ తెలుగు నామవాచకం.
- source_word: συντέλεια αἰῶνός
  choice: యుగాంతం
  rationale: αἰών యొక్క కాలసంబంధమైన ‘యుగం’ భావాన్ని నిలుపుతూ, ప్రపంచ పదార్థ నిర్మూలన అనే అవసరం లేని భావాన్ని దిగుమతి చేయదు; συντέλεια సూచించే ముగింపు/పరిపూర్తిని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: θερισταὶ
  choice: కోత కోసేవారు
  rationale: పంటను కోసే వ్యక్తులను ఆధునిక పాఠకులకు వెంటనే అర్థమయ్యే సహజమైన పదబంధంతో సూచిస్తుంది.
- source_word: ἄγγελοί
  choice: దేవదూతలు
  rationale: అంత్యకాల సందర్భంలో మానవ సందేశకులు కాక పరలోక జీవులే ఉద్దేశించబడ్డారని స్పష్టం చేస్తుంది.
- source_word: δὲ
  choice: అల్పవిరామం/అర్ధవిరామంతో భావప్రగతి
  rationale: పునరావృత δέ వివరణలో తదుపరి అంశాలను ప్రవేశపెడుతుంది; తెలుగులో ప్రతిసారి సంధానపదం పెట్టకుండా విరామచిహ్నాలతో సహజంగా అందించబడింది.
theological_decisions:
- issue: συντέλεια αἰῶνός అనే అంత్యకాల పదబంధంలో αἰών అనువాదం
  choice: యుగాంతం
  alternative: యుగ పరిపూర్తి; లోకాంతం
  rationale: ‘యుగం’ మూలంలోని కాలసంబంధ భావాన్ని కాపాడుతుంది. ‘లోకాంతం’ సృష్టి లేదా భౌతిక ప్రపంచ వినాశనమనే అదనపు భావాన్ని కలిగించవచ్చు. συντέλεια లోని పరిపూర్తి ఛాయను పాదసూచికలో ఉంచి నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. మూడు సమాంతర వివరణ వాక్యభాగాలను అర్ధవిరామాలతో కలిపి గ్రీకు వాక్య నిర్మాణంలోని సంక్షిప్తతను నిలిపాం.
