  source_fidelity: గ్రీసు మూలంలోని కాలసూచక నిర్మాణం (ἐν δὲ τῷ καθεύδειν), 'మనుషులు' అనే బహువచన కర్త (τοὺς ἀνθρώπους), యజమానికి చెందిన శత్రువు, గోధుమల మధ్య కలుపును విత్తడం, ఆపై వెళ్లిపోవడం—అన్నీ నమ్మకంగా ప్రతిబింబించబడ్డాయి. 'కలుపు విత్తనాలు చల్లి' అనేది ζιζάνιαను విత్తే చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; అనవసరమైన వృక్షశాస్త్ర నిర్దిష్టతను జోడించదు.
