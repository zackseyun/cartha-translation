translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. మూలవాక్య క్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ సహజమైన తెలుగు ప్రవాహాన్ని ప్రాధాన్యపరిచాం.
