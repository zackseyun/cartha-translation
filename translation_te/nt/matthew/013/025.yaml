source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: te
  text: అయితే మనుషులు నిద్రపోతున్నప్పుడు, అతని శత్రువు వచ్చి గోధుమల మధ్య కలుపు విత్తనాలు చల్లి వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: మనుషులు
  rationale: ఇది పొలంలో ఉన్నవారిని సాధారణంగా సూచిస్తుంది; లింగాన్ని అనవసరంగా ప్రత్యేకించకుండా మూలపదంలోని బహువచన భావాన్ని నిలుపుతుంది.
- source_word: ἐπέσπειρεν
  choice: విత్తనాలు చల్లి
  rationale: గోధుమలు ఇప్పటికే విత్తిన పొలంలో శత్రువు అదనంగా కలుపు విత్తిన చర్యను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ζιζάνια
  choice: కలుపు విత్తనాలు
  rationale: ζιζάνια అనేది గోధుమల మధ్య పెరిగే హానికరమైన కలుపును సూచిస్తుంది; ఈ సందర్భంలో విత్తే చర్యతో 'విత్తనాలు' అని చెప్పడం స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: గోధుమల మధ్య
  rationale: మూలంలోని స్థల సంబంధాన్ని సంక్షిప్తంగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లిపోయాడు
  rationale: శత్రువు పని ముగించుకొని అక్కడి నుంచి వెళ్లిన భావాన్ని సహజంగా అందిస్తుంది.
