id: MAT.13.17
reference: Matthew 13:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: te
  text: 'ఎందుకంటే, నేను మీతో నిశ్చయంగా చెబుతున్నాను: అనేకమంది ప్రవక్తలూ నీతిమంతులూ[a] మీరు చూస్తున్నవాటిని చూడాలని ఎంతో ఆశపడ్డారు, కానీ చూడలేదు; మీరు వింటున్నవాటిని వినాలని ఆశపడ్డారు, కానీ వినలేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీతిమంతులైనవారు.’ గ్రీకులో ‘నీతిమంతులు’ అనే అర్థాన్నిచ్చే విశేషణం నామవాచకంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: నిశ్చయంగా
  rationale: సినాప్టిక్ సువార్తల్లోని గంభీరమైన ధృవీకరణ సూత్రం యొక్క బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; లిప్యంతరీకరణకన్నా అర్థాన్ని స్పష్టం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న మాటకు ఈ వాక్యం వివరణాత్మక ఆధారాన్ని ఇస్తున్న సంబంధాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో ... చెబుతున్నాను
  rationale: గ్రీకు వాక్యసూత్రంలోని ప్రత్యక్షతను కాపాడుతూ తెలుగులో సహజంగా ఉంది.
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: అనేకమంది ప్రవక్తలూ నీతిమంతులూ
  rationale: రెండు సమాంతర సమూహాలను స్పష్టంగా ఉంచుతుంది. δίκαιοι నామవాచకార్థంలో వాడిన విశేషణం; ‘నీతిమంతులు’ ఆధునిక తెలుగులో అదే విధంగా సహజంగా పనిచేస్తుంది.
- source_word: ἐπεθύμησαν
  choice: ఎంతో ఆశపడ్డారు
  rationale: ఈ సందర్భంలోని బలమైన, సానుకూలమైన కోరికను తెలియజేస్తుంది; సాధారణ ‘కోరుకున్నారు’ కంటే తీవ్రతను మెరుగ్గా నిలుపుతుంది.
- source_word: ἃ βλέπετε ... ἃ ἀκούετε
  choice: మీరు చూస్తున్నవాటిని ... మీరు వింటున్నవాటిని
  rationale: గ్రీకులో వస్తువులు ప్రత్యేకంగా నిర్దేశించబడకుండా సంబంధవాచక ఉపవాక్యాలుగా ఉన్నందున అదే అనిర్దిష్టతను నిలుపుతుంది; వర్తమాన క్రియల భావాన్నీ ప్రతిబింబిస్తుంది.
- source_word: οὐκ εἶδαν ... οὐκ ἤκουσαν
  choice: చూడలేదు ... వినలేదు
  rationale: వారు కోరుకున్న అనుభవం వారికి కలగలేదనే చారిత్రక వాస్తవాన్ని సంక్షిప్తంగా, సమాంతరంగా తెలియజేస్తుంది.
theological_decisions:
- issue: δίκαιοι యొక్క పరిధి
  choice: ‘నీతిమంతులు’ అని ప్రవక్తలతోపాటు వేరొక విస్తృత వర్గంగా అనువదించడం
  alternative: ‘నీతిమంతులైనవారు’ అని విస్తరించడం
  rationale: గ్రీకులో ఇది నామవాచకార్థక బహువచన విశేషణం. తెలుగు ‘నీతిమంతులు’ వ్యక్తుల వర్గాన్ని సహజంగా సూచిస్తుంది; వారిని ప్రవక్తలకే పరిమితం చేయదు.
- issue: చూసినవి, విన్నవి ఏమిటన్న గుర్తింపు
  choice: ‘మీరు చూస్తున్నవాటిని’, ‘మీరు వింటున్నవాటిని’ అని వస్తువులను సూచించకుండా ఉంచడం
  alternative: ‘మెస్సీయను’ లేదా ‘రాజ్య రహస్యాలను’ అని వివరణాత్మకంగా చేర్చడం
  rationale: సందర్భం యేసు పరిచర్యలోని రాజ్య ప్రత్యక్షతను సూచించినా, ఈ వచనం వాటిని పేరుపెట్టి చెప్పదు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక విస్తృతతను, ధార్మిక ఉద్వేగాన్ని అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని రెండు సమాంతర భాగాలు, బలమైన కోరిక, అలాగే చూసినవి–విన్నవి ఏమిటన్న అనిర్దిష్టత నిలుపబడ్డాయి.
