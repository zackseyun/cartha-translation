id: MAT.13.48
reference: Matthew 13:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: te
  text: వల నిండినప్పుడు, వారు దాన్ని ఒడ్డుకు లాగి, కూర్చొని, మంచి చేపలను పాత్రల్లో[a] సేకరించారు; పనికిరాని చేపలను[b] బయటికి విసిరివేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పెట్టుకునే పాత్రల్లో.’ గ్రీకు పదం సాధారణంగా పాత్రలను సూచిస్తుంది; అవి తప్పనిసరిగా బుట్టలు కావు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కుళ్లిన చేపలను,’ ‘చెడిపోయిన చేపలను.’ గ్రీకు పదానికి కుళ్లిన, చెడిపోయిన, లేదా పనికిరాని అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν
  choice: అది / దాన్ని
  rationale: మునుపటి వచనంలోని వలను సూచించే సంబంధసర్వనామాన్ని తెలుగులో సహజమైన సర్వనామంతో పునఃప్రస్తావించాం.
- source_word: ἐπληρώθη
  choice: నిండినప్పుడు
  rationale: వల చేపలతో నిండిన సందర్భాన్ని సూచించే aorist passive భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλόν
  choice: ఒడ్డుకు లాగి
  rationale: నీటిలోని వలను పైకి తీసి ఒడ్డుకు చేర్చిన చర్యను సంక్షిప్తంగా, స్పష్టంగా తెలుపుతుంది; αἰγιαλόςను ఇసుక తీరం అని అతిగా నిర్దిష్టం చేయదు.
- source_word: καθίσαντες
  choice: కూర్చొని
  rationale: వరుసగా జరిగిన తదుపరి చర్యను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: συνέλεξαν τὰ καλὰ
  choice: మంచివాటిని ... పోగుచేశారు
  rationale: τὰ καλὰలో ‘చేపలు’ అనే నామవాచకం గ్రీకులో వ్యక్తంగా లేకపోవడంతో, సందర్భం ద్వారా అర్థమయ్యే ‘వాటిని’ను ఉంచి మూలంలోని సంక్షిప్తతను కాపాడాం.
- source_word: εἰς ἄγγη
  choice: పాత్రల్లో
  rationale: ἄγγη అనేది సాధారణంగా వస్తువులు పెట్టే పాత్రలను సూచిస్తుంది; ‘బుట్టలు’ అని పరిమితం చేయలేదు.
- source_word: τὰ δὲ σαπρά
  choice: పనికిరానివాటిని
  rationale: σαπρόςకు కుళ్లిన, చెడిపోయిన, విలువలేని అనే అర్థవ్యాప్తి ఉంది. చేపల వర్గీకరణ సందర్భంలో ‘పనికిరానివి’ ఆ విస్తృత మూలభావాన్ని సహజంగా నిలుపుతుంది; ‘కుళ్లినవి’ కూడా సాధ్యమే.
- source_word: ἔξω ἔβαλον
  choice: బయట పారవేశారు
  rationale: బయటకు విసరడం మరియు తిరస్కరించడం అనే చర్యబలాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని వర్గీకరణ దృశ్యానికి వ్యాఖ్యానాత్మక అర్థం జోడించాలా
  choice: చేపల వేట, వర్గీకరణ దృశ్యాన్నే స్పష్టంగా అనువదించడం
  alternative: తుదితీర్పును ముందుగానే సూచించే వ్యాఖ్యానాత్మక పదాలను వచనంలో చేర్చడం
  rationale: ఈ వచనం ఉపమాన దృశ్యాన్ని మాత్రమే వివరిస్తుంది; దాని తీర్పుసంబంధ వివరణ తరువాతి వచనాల్లో వస్తుంది. కాబట్టి అనువాదంలో ఆ వివరణను ముందుగానే చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. గ్రీకు participlesను సహజమైన వరుస క్రియలుగా మార్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
