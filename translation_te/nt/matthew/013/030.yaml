id: MAT.13.30
reference: Matthew 13:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: te
  text: కోతకాలం వరకు ఆ రెండింటినీ కలిసి పెరగనివ్వండి. కోతకాలంలో నేను పంట కోసేవారికి, ‘మొదట కలుపుమొక్కలను[a] పోగుచేసి, కాల్చివేయడానికి వాటిని కట్టలుగా కట్టండి; గోధుమలను మాత్రం నా ధాన్యాగారంలో చేర్చండి’ అని చెబుతాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలోని పదం గోధుమలను పోలి పెరిగే ‘డార్నెల్’ అనే హానికరమైన కలుపుమొక్కలను సూచించవచ్చు; సంప్రదాయంగా ‘గురుగులు’ అని అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε συναυξάνεσθαι ἀμφότερα
  choice: ఆ రెండింటినీ కలిసి పెరగనివ్వండి
  rationale: ἄφετε ఇక్కడ అనుమతిని తెలిపే ఆజ్ఞ; συναυξάνεσθαι లోని ‘కలిసి పెరగడం’ అనే భావాన్ని, ἀμφότερα లోని రెండు వర్గాల సూచనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: కోతకాలం వరకు
  rationale: ఉపమానంలోని నిర్దిష్టమైన కోత సమయాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: కోతకాలంలో
  rationale: καιρός సూచించే తగిన లేదా నిర్ణీత సమయ భావాన్ని సందర్భానుకూలంగా అందిస్తుంది.
- source_word: τοῖς θερισταῖς
  choice: పంట కోసేవారితో
  rationale: వ్యవసాయ సందర్భాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: Συλλέξατε πρῶτον τὰ ζιζάνια
  choice: మొదట కలుపుమొక్కలను పోగుచేసి
  rationale: πρῶτον తెలిపే క్రమాన్ని నిలుపుతూ, ζιζάνιαను పాఠ్యంలో సులభంగా అర్థమయ్యే విస్తృత పదంతో అనువదిస్తుంది; నిర్దిష్ట వృక్షసూచనను పాదసూచికలో ఉంచుతుంది.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: వాటిని కట్టలుగా కట్టండి
  rationale: εἰς δέσμας లోని కట్టలుగా ఏర్పరచే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: కాల్చివేయడానికి
  rationale: గ్రీకు ప్రయోజనార్థక నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఉపమానానికి మించిన వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: τὸν δὲ σῖτον συναγάγετε εἰς τὴν ἀποθήκην μου
  choice: గోధుమలను మాత్రం నా ధాన్యాగారంలో చేర్చండి
  rationale: δὲ చూపే వ్యత్యాసాన్ని ‘మాత్రం’ ద్వారా తెలియజేస్తూ, ἀποθήκηను ధాన్యం నిల్వచేసే స్థలంగా సందర్భోచితంగా అనువదిస్తుంది.
theological_decisions:
- issue: చివరి వేర్పాటును సూచించే ఉపమాన చిత్రం
  choice: వ్యవసాయ ఉపమానాన్ని మాత్రమే పాఠ్యంలో నిలుపడం
  alternative: ఈ వాక్యంలోనే అంతిమ తీర్పు లేదా సంపూర్ణ నాశనం అనే భావాన్ని స్పష్టంగా చేర్చడం
  rationale: ఉపమానానికి సంబంధించిన వివరణ అధ్యాయంలో తరువాత వస్తుంది. అందువల్ల యేసు చెప్పిన వ్యవసాయ చిత్రాన్ని ముందుగానే సిద్ధాంతపరంగా విప్పకుండా, దాని ఉద్రిక్తతను యథాతథంగా ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ప్రత్యక్ష వాక్యశైలిని ఉపయోగించాం. వ్యవసాయ పదచిత్రాన్ని సహజంగా ఉంచుతూ, అరుదైన వృక్షపేరును ప్రధాన పాఠ్యానికి బదులుగా పాదసూచికలో వివరించాం.
