id: MAT.13.35
reference: Matthew 13:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: te
  text: 'ప్రవక్త ద్వారా చెప్పబడినది నెరవేరునట్లు:


    “నేను ఉపమానాలతో నా నోరు విప్పుతాను;

    పునాది వేయబడినప్పటి నుండి దాచబడిన సంగతులను పలుకుతాను.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “లోకానికి పునాది వేయబడినప్పటి నుండి” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: నెరవేరేలా జరిగింది
  rationale: ఉద్దేశం/ఫలితాన్ని సూచించే ὅπως మరియు నిష్క్రియార్థక πληρωθῇ భావాన్ని సహజమైన తెలుగు నెరవేర్పు సూత్రంగా వ్యక్తం చేస్తుంది. సందర్భంలోని యేసు చర్యలను సూచించేందుకు ‘ఇది ... జరిగింది’ అని వాక్యాన్ని సంపూర్ణం చేసింది.
- source_word: τὸ ῥηθὲν διὰ τοῦ προφήτου
  choice: ప్రవక్త ద్వారా చెప్పబడిన మాట
  rationale: διά + షష్ఠీ విభక్తి సూచించే మధ్యవర్తిత్వాన్ని ‘ద్వారా’ నిలుపుతుంది; articular participle ను తెలుగులో సహజంగా ‘చెప్పబడిన మాట’గా అందిస్తుంది.
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: నేను ఉపమానాలతో నా నోరు తెరుస్తాను
  rationale: ఉద్ధరణలోని కవితాత్మక ‘నా నోరు తెరుస్తాను’ రూపకాన్ని నిలుపుతూ, ἐν παραβολαῖς ను సహజమైన ‘ఉపమానాలతో’గా అనువదిస్తుంది.
- source_word: ἐρεύξομαι
  choice: పలుకుతాను
  rationale: మాటలను వెలువరించడం అనే మూలభావాన్ని గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన తెలుగులో తెలియజేస్తుంది; ‘వెల్లడిస్తాను’ కంటే క్రియ యొక్క వాచిక స్వభావాన్ని నేరుగా ఉంచుతుంది.
- source_word: κεκρυμμένα
  choice: దాచబడిన సంగతులు
  rationale: పూర్త నిష్క్రియ కృదంతంలోని దాచబడి ఉన్న స్థితిని నిలుపుతుంది; వ్యాఖ్యానాత్మకమైన ‘రహస్యాలు’ అనే పదాన్ని నివారిస్తుంది.
- source_word: ἀπὸ καταβολῆς
  choice: పునాది వేయబడినప్పటి నుండి
  rationale: ఇచ్చిన SBLGNT పాఠంలో κόσμου (‘లోకము యొక్క’) లేదు. అందువల్ల లేని పదాన్ని ప్రధాన పాఠంలో చేర్చకుండా, καταβολή యొక్క స్థాపన/పునాది వేయడం అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఉద్ధరణను చెప్పిన ప్రవక్త గుర్తింపు
  choice: ప్రవక్త ద్వారా
  alternative: ఆసాపు ప్రవక్త ద్వారా
  rationale: ఇచ్చిన గ్రీకు పాఠం τοῦ προφήτου అని మాత్రమే చెబుతుంది. కీర్తన 78:2 నేపథ్యాన్ని ఆధారంగా చేసుకొని పేరును చేర్చకుండా మూలపాఠంలోని అనిర్దిష్టతను నిలుపుతుంది.
- issue: ἀπὸ καταβολῆς అనే కాలసూచక పదబంధపు విస్తృతి
  choice: పునాది వేయబడినప్పటి నుండి
  alternative: లోకానికి పునాది వేయబడినప్పటి నుండి
  rationale: SBLGNT ప్రధాన పాఠంలో κόσμου లేదు. కాబట్టి ప్రధాన అనువాదం దానిని చేర్చదు; విస్తృతమైన పాఠాంతరాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; మత్తయి నెరవేర్పు సూత్రానికి తగిన గంభీరతతో, ఉద్ధరణలోని కవితాత్మక సమాంతర నిర్మాణాన్ని నిలిపింది. ‘ఉపమానాలు’, ‘ప్రవక్త’, ‘నెరవేరేలా’ వంటి సాధారణ బైబిలు పదజాలాన్ని స్పష్టంగా ఉపయోగించింది.
