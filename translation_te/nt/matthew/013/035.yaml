revisions:
- from: 'ఇది ప్రవక్త ద్వారా చెప్పబడిన మాట నెరవేరేలా జరిగింది:


    “నేను ఉపమానాలతో నా నోరు తెరుస్తాను;

    పునాది వేయబడినప్పటి నుండి దాచబడిన సంగతులను పలుకుతాను.”[a]'
  to: 'ప్రవక్త ద్వారా చెప్పబడినది నెరవేరునట్లు:


    “నేను ఉపమానాలతో నా నోరు విప్పుతాను;

    పునాది వేయబడినప్పటి నుండి దాచబడిన సంగతులను పలుకుతాను.”[a]'
