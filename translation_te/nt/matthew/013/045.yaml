id: MAT.13.45
reference: Matthew 13:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: te
  text: మళ్లీ, పరలోక రాజ్యం మంచి ముత్యాలను వెదుకుతున్న ఒక వర్తకునితో[a] పోలి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “వర్తకుడైన ఒక మనిషితో.”
    reason: ἀνθρώπῳ ἐμπόρῳ లో ‘మనిషి’ మరియు ‘వర్తకుడు’ అనే రెండు పదాలు ఉన్నాయని చూపించే పదప్రయోగ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: Πάλιν
  choice: మళ్లీ
  rationale: రాజ్యాన్ని గురించిన ఉపమానాల వరుసలో మరో పోలికను పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండి వాక్యప్రవాహాన్ని నిలుపుతుంది.
- source_word: ὁμοία ἐστὶν
  choice: పోలి ఉంది
  rationale: ఉపమాన పోలికను స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి సువార్తలోని ఈ ప్రత్యేక పదబంధానికి తెలుగులో స్థిరపడిన, సహజమైన రూపం; బహువచనమైన ‘ఆకాశాలు’ అనే అక్షరానువాదం ఇక్కడ అసహజంగా ఉంటుంది.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: ఒక వర్తకునితో
  rationale: దత్తి విభక్తిలోని పదబంధం పోలికకు తక్షణ అంశంగా వర్తకుణ్ణి చూపుతుంది. ἔμπορος అతడు మనిషేనని ఇప్పటికే సూచిస్తున్నందున ‘ఒక మనిషి, ఒక వర్తకుడు’ అని పునరుక్తి చేయలేదు.
- source_word: ζητοῦντι
  choice: వెదుకుతున్న
  rationale: వర్తకుని కొనసాగుతున్న కార్యాన్ని వర్తమాన కృదంత భావంతో నిలుపుతుంది.
- source_word: καλοὺς μαργαρίτας
  choice: మంచి ముత్యాలను
  rationale: καλός ఇక్కడ కేవలం అందాన్ని కాక నాణ్యతను సూచిస్తుంది; ‘మంచి ముత్యాలు’ సాధారణ పాఠకులకు సహజంగా, మూలానికి సమీపంగా ఉంటుంది.
theological_decisions:
- issue: ఉపమాన సూత్రంలో పోలిక పరిధి
  choice: రాజ్యం తక్షణంగా వర్తకునితో పోల్చబడినట్లు అనువదించడం
  alternative: మంచి ముత్యాలను వెదికే వర్తకుడు ఉన్న మొత్తం పరిస్థితితో రాజ్యాన్ని పోల్చడం
  rationale: ὁμοία ἐστὶν ... ἀνθρώπῳ ἐμπόρῳ అనే గ్రీకు నిర్మాణం వర్తకుణ్ణే తక్షణ పోలికాంశంగా చూపుతుంది. అయితే ఉపమానం యొక్క విస్తృత భావం తదుపరి వచనంలో వికసిస్తుంది; అందువల్ల ఇక్కడ దాన్ని అదనంగా నిర్వచించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘వర్తకుడు’ వాణిజ్య సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; వాక్య నిర్మాణం మూలంలోని పోలికను కాపాడుతుంది.
