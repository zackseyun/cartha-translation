  naturalness: The Telugu is clear, modern, and suitably dignified. ‘నీతిమంతులు,’ ‘తమ తండ్రి రాజ్యంలో,’ and ‘సూర్యునిలా ప్రకాశిస్తారు’ are idiomatic and readily understandable. The closing formulation is a natural formal Telugu biblical-style summons.
