id: MAT.13.43
reference: Matthew 13:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: te
  text: అప్పుడు నీతిమంతులు తమ తండ్రి రాజ్యంలో సూర్యునిలా ప్రకాశిస్తారు.[a] చెవులు గలవాడు వినాలి![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెలుగును వెదజల్లుతారు.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ఇది అక్షరార్థంగా, “చెవులు గలవాడు వినాలి” అనే ఏకవచన పిలుపు; ఇది ప్రతి ఒక్కరూ శ్రద్ధగా ఆలకించాలనే భావంతో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: ముందటి ఉపమాన వివరణలో చెప్పిన అంత్యకాల క్రమాన్ని సహజంగా సూచిస్తుంది.
- source_word: οἱ δίκαιοι
  choice: నీతిమంతులు
  rationale: నీతిమంతులుగా పరిగణించబడినవారిని సూచించే నామవాచక ప్రయోగాన్ని తెలుగు బైబిలు శైలిలో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκλάμψουσιν
  choice: ప్రకాశిస్తారు
  rationale: ‘వెలుగును వెదజల్లుతారు/ప్రకాశిస్తారు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; వెలుగు బయటికి ప్రసరించే భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὡς ὁ ἥλιος
  choice: సూర్యునిలా
  rationale: ὡς తెలిపే పోలికను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν
  choice: తమ తండ్రి రాజ్యంలో
  rationale: ‘వారి తండ్రి రాజ్యంలో’ అనే మూలార్థాన్ని తెలుగులో కర్తతో సహజంగా అన్వయించే ‘తమ’ ద్వారా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘పరలోక’ అనే పదాన్ని చేర్చదు.
- source_word: ὁ ἔχων ὦτα
  choice: చెవులు గలవాడు
  rationale: ఏకవచన ప్రతినిధి పిలుపును, మూలంలోని పుంలింగ రూపాన్ని నిలుపుతూ గంభీరమైన సహజ తెలుగు ప్రయోగాన్ని ఇస్తుంది.
- source_word: ἀκουέτω
  choice: వినాలి
  rationale: మూడవ పురుష ఏకవచన ఆజ్ఞార్థక భావాన్ని తెలుగులో సహజమైన విధ్యర్థక రూపంతో తెలియజేస్తుంది; ఇది కేవలం శబ్దం వినడం కాక శ్రద్ధగా ఆలకించి గ్రహించాలనే పిలుపును సందర్భానుసారంగా మోస్తుంది.
theological_decisions:
- issue: ముగింపు హెచ్చరికలో ప్రతినిధి పుంలింగ ఏకవచనం
  choice: ‘చెవులు గలవాడు వినాలి’ అని ఏకవచన పుంలింగ రూపాన్ని నిలుపడం
  alternative: ‘చెవులు గలవారు వినాలి’ లేదా ‘చెవులున్న ప్రతి ఒక్కరూ వినాలి’
  rationale: గ్రీకు వాక్యం పుంలింగ ఏకవచనంలో ఉండి అందరికీ వర్తించే ప్రతినిధి పిలుపుగా పనిచేస్తుంది. బహువచనంగా మార్చకుండా మూలరూపం మరియు సాధారణ వర్తింపును రెండింటినీ నిలుపుతుంది.
- issue: βασιλεία యొక్క భావం
  choice: ‘రాజ్యం’
  alternative: ‘పాలన’
  rationale: ‘తమ తండ్రి రాజ్యంలో’ అనే స్థానార్థక నిర్మాణంలో ‘రాజ్యం’ సహజంగా సరిపోతుంది; అదే సమయంలో దేవుని రాజపాలన భావాన్ని నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘నీతిమంతులు,’ ‘రాజ్యం’ వంటి విస్తృతంగా అర్థమయ్యే బైబిలు పదజాలాన్ని ఉపయోగించి, మూలంలోని అంత్యకాల దృశ్యాన్ని మరియు గంభీర పిలుపును నిలిపాం.
