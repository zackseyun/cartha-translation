id: MAT.13.56
reference: Matthew 13:56
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: te
  text: అతని అక్కచెల్లెళ్లందరూ మన మధ్యనే ఉన్నారు కదా? అయితే ఈ మనిషికి ఇవన్నీ ఎక్కడి నుంచి వచ్చాయి?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్త్రీ బంధువులు.” ఇక్కడి గ్రీకు పదానికి సాధారణంగా “అక్కచెల్లెళ్లు” అనే అర్థమే వస్తుంది; అయితే తరువాతి సిద్ధాంతపరమైన చర్చల దృష్ట్యా కొందరు దీనిని మరింత విస్తృతమైన బంధుత్వార్థంలో అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: అక్కచెల్లెళ్లు
  rationale: సందర్భంలో కుటుంబ సంబంధాన్ని సూచించే సాధారణ అర్థమే సహజం. ఈ తెలుగు పదం వయస్సును నిర్ణయించకుండా సొంత అక్కలు లేదా చెల్లెళ్లను సమగ్రంగా సూచిస్తుంది.
- source_word: οὐχὶ πᾶσαι
  choice: అందరూ ... ఉన్నారు కదా?
  rationale: οὐχί ఆశించే సమాధానం అవుననే భావమున్న అలంకార ప్రశ్నను తెలుగులో సహజంగా చూపిస్తుంది; πᾶσαι యొక్క సంపూర్ణతను ‘అందరూ’ నిలుపుతుంది.
- source_word: πρὸς ἡμᾶς
  choice: మన మధ్యనే
  rationale: వారు అదే సమాజంలో తమతో ఉన్నారనే అనుబంధం, సాన్నిధ్యాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘నే’ వక్తల స్థానిక పరిచయాన్ని నొక్కిచెబుతుంది.
- source_word: πόθεν
  choice: ఎక్కడి నుంచి
  rationale: జ్ఞానం, అద్భుత కార్యాలు మొదలైన వాటి మూలం ఏమిటనే ప్రశ్నను నేరుగా నిలుపుతుంది.
- source_word: οὖν
  choice: అలాంటప్పుడు
  rationale: ముందు పేర్కొన్న కుటుంబ పరిచయం నుంచి జనులు తీసుకుంటున్న నిర్ధారణాత్మక మలుపును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τούτῳ
  choice: ఈయనకు
  rationale: దత్తివ విభక్తి భావాన్ని నిలుపుతూ యేసును సూచించే నిర్దేశక పదాన్ని సహజంగా అందిస్తుంది. ‘ఇతనికి’ కంటే ‘ఈయనకు’ ఆధునిక గౌరవప్రద బైబిలు శైలికి అనుకూలం; మూలంలోని సంభావ్య తక్కువచూపు సందర్భం నుంచే గ్రహించబడుతుంది.
- source_word: ταῦτα πάντα
  choice: ఇవన్నీ
  rationale: ముందు సందర్భంలో చెప్పిన జ్ఞానం, శక్తికార్యాలను సమగ్రంగా సూచించే గ్రీకు బహువచనాన్ని సంక్షిప్తంగా, సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: యేసు అక్కచెల్లెళ్ల ప్రస్తావన స్వభావం
  choice: ἀδελφαὶ అనే పదాన్ని దాని సాధారణ కుటుంబార్థంలో ‘అక్కచెల్లెళ్లు’ అని అనువదించడం
  alternative: స్త్రీ బంధువులు / దాయాదులు
  rationale: గ్రీకు పదానికి ఈ సందర్భంలో సహజమైన అర్థం ‘అక్కచెల్లెళ్లు.’ తరువాతి సిద్ధాంత చర్చల ఆధారంగా విస్తృత బంధుత్వార్థాన్ని ప్రధాన పాఠ్యంలో పెట్టడం మూలపాఠం చెప్పినదానికంటే ఎక్కువగా నిర్ణయిస్తుంది. ప్రత్యామ్నాయ వ్యాఖ్యానాన్ని పాదటిప్పణిలో మాత్రమే సూచించడం పాఠ్యంలోని ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నా నిర్మాణం వాడబడింది. ‘ఉన్నారు కదా?’ అలంకార ప్రశ్నకు ఆశించే సమ్మతిని తెలియజేస్తుంది. ‘అలాంటప్పుడు’ జనుల తార్కిక అనుమానాన్ని స్పష్టంగా కలుపుతుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో పొందుపరచబడింది.
