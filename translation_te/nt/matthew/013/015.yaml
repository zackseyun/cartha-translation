id: MAT.13.15
reference: Matthew 13:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: te
  text: 'ఎందుకంటే ఈ ప్రజల హృదయం మొద్దుబారిపోయింది;

    వారు చెవులతో కష్టంగా విన్నారు[a],

    తమ కళ్లతో చూడకుండా,

    చెవులతో వినకుండా,

    హృదయంతో గ్రహించి తిరిగి రాకుండా,

    నేను వారిని స్వస్థపరచకుండునట్లు

    తమ కళ్లను మూసుకున్నారు.[c][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, “వారు చెవులతో భారంగా విన్నారు”; అంటే వారు కష్టంగా లేదా మందంగా విన్నారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “తిరుగకుండా” లేదా “తిరిగి వెళ్లకుండా.”
    reason: lexical_alternative
  - marker: c
    text: యెషయా 6:9–10 నుండి ఉదహరించబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: మొద్దుబారిపోయింది
  rationale: పదశః ‘మందంగా/లావుగా అయింది’ అనే భావం ఉన్నా, ‘హృదయం’తో కలిసినప్పుడు గ్రహణశక్తి కోల్పోయి స్పందించని స్థితిని సూచిస్తుంది. ‘మొద్దుబారిపోయింది’ ఆధునిక తెలుగులో ఈ రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: καρδία
  choice: హృదయం
  rationale: అంతరంగం, అవగాహన, మనోవైఖరి అనే బైబిలీయ భావాలను మోసే సాధారణ సమానార్థకం; ఇదే వాక్యంలో హృదయంతో గ్రహించడమనే సంబంధాన్ని కూడా నిలుపుతుంది.
- source_word: βαρέως ἤκουσαν
  choice: చెవులతో కష్టంగా విన్నారు
  rationale: βαρέως పదశః ‘భారంగా’ అని ఉన్నా, వినికిడికి సంబంధించి వినడానికి కష్టపడటం లేదా మందంగా వినడాన్ని సూచిస్తుంది. కాలరూపాన్ని గౌరవిస్తూ ‘విన్నారు’ అని అనువదించబడింది.
- source_word: ἐκάμμυσαν
  choice: మూసుకున్నారు
  rationale: ప్రజలే ఉద్దేశపూర్వకంగా చేసిన క్రియను సూచించే కర్తరి రూపాన్ని నిలుపుతుంది.
- source_word: συνῶσιν
  choice: గ్రహించి
  rationale: కేవలం సమాచారం తెలుసుకోవడం కాక, అంతరార్థాన్ని అవగాహన చేసుకోవడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπιστρέψωσιν
  choice: తిరిగి వస్తారేమో
  rationale: ‘తిరుగు/తిరిగి రా’ అనే దిశాత్మక భావాన్ని నిలుపుతూ, ‘మతం మారడం’ వంటి తరువాతి పారిభాషిక భావాన్ని రుద్దదు.
- source_word: ἰάσομαι
  choice: నేను వారిని స్వస్థపరుస్తానేమో
  rationale: కర్త దేవుడేనని, స్వస్థపరచబడేవారు ప్రజలేనని స్పష్టంగా ఉంచుతుంది. μήποτεతో మొదలైన తెలుగు వాక్యనిర్మాణంలో సహజత్వం కోసం సంభావ్య రూపం వాడబడినా, గ్రీకు పదం స్వతహాగా భవిష్యత్ రూపమని నిర్ణయ గమనికలో గుర్తించబడింది.
theological_decisions:
- issue: μήποτεతో కూడిన న్యాయతీర్పు/కఠినపరచడం వాక్యంలో దైవ తీర్పు మరియు మానవ బాధ్యత మధ్య ఉన్న ఉద్రిక్తత
  choice: వారు ... తిరిగి వస్తారేమో, నేను వారిని స్వస్థపరుస్తానేమోనని అలా చేశారు
  alternative: లేకపోతే వారు ... తిరిగి వస్తారు; అప్పుడు నేను వారిని స్వస్థపరుస్తాను
  rationale: కళ్లను మూసుకున్నది ప్రజలేననే క్రియాశీల బాధ్యతను నిలుపుతూ, μήποτεలోని ‘అలా జరగకూడదనే’ ఉపరితల భావాన్ని మృదువుగా తొలగించకుండా ఉంచుతుంది. అదే సమయంలో ఈ కఠిన వాక్యాన్ని కేవలం సాధారణ ఫలితవాక్యంగా మార్చి దాని దైవన్యాయ ఉద్రిక్తతను పరిష్కరించదు. అయితే ἰάσομαι స్వతంత్రంగా భవిష్యత్ రూపం (‘నేను స్వస్థపరుస్తాను’) అనే అంశం గమనించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. మూలంలోని కన్నులు–చెవులు–హృదయం అనే సమాంతర నిర్మాణం, ప్రజల క్రియాశీల బాధ్యత, మరియు చివరి స్వస్థపరచే దైవ వాగ్దానం సాధ్యమైనంతవరకు నిలుపబడ్డాయి. కవితాత్మక ఉద్ధరణను పంక్తులుగా అమర్చడం ద్వారా మూలంలోని లయ, వరుస స్పష్టమవుతాయి.
