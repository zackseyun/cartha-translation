revisions:
- from: 'అలాగే ఈ యుగసమాప్తిలో జరుగుతుంది: దేవదూతలు బయలుదేరి, నీతిమంతుల మధ్య నుండి దుష్టులను వేరు చేస్తారు.[a]'
  to: 'యుగసమాప్తిలో కూడా అలాగే జరుగుతుంది: దేవదూతలు బయలుదేరి, నీతిమంతుల మధ్య నుండి దుష్టులను వేరు చేస్తారు.[a]'
  rationale: The revision removes the added demonstrative “ఈ,” preserves the inferential force of οὕτως with “కూడా అలాగే,” and retains the source distinction between “age” and “world.” The footnote gives a direct alternative for συντέλεια while preserving the lexical clarification.
