id: MAT.13.49
reference: Matthew 13:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: te
  text: 'యుగసమాప్తిలో కూడా అలాగే జరుగుతుంది: దేవదూతలు బయలుదేరి, నీతిమంతుల మధ్య నుండి దుష్టులను వేరు చేస్తారు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుగపు పరిపూర్తిలో.” గ్రీకులో “యుగం” (αἰών) అని ఉంది, “ప్రపంచం” అని కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: అలాగే
  rationale: ఉపమానంలోని దృశ్యం అంత్యకాలంలో ఏ విధంగా నెరవేరుతుందో తెలిపే అనుసంధాన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔσται
  choice: జరుగుతుంది
  rationale: సాధారణ భవిష్యత్ భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; గ్రీకులోని సంక్షిప్త వాక్య నిర్మాణాన్ని అనవసరంగా విస్తరించదు.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: ఈ యుగసమాప్తిలో
  rationale: συντέλεια లోని ముగింపు/పరిపూర్తి భావాన్ని ‘సమాప్తి’ నిలుపుతుంది; αἰών భౌతిక ప్రపంచాన్ని కాక యుగాన్ని సూచిస్తుంది. సందర్భార్థం కోసం తెలుగులో సహజమైన ‘ఈ’ వాడబడింది.
- source_word: ἐξελεύσονται
  choice: బయలుదేరి
  rationale: దేవదూతలు కార్యం చేయడానికి వెలువడతారనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ ἄγγελοι
  choice: దేవదూతలు
  rationale: అంతిమ తీర్పు సందర్భంలో ఇది మానవ సందేశకులను కాక పరలోక దూతలను సూచిస్తుంది.
- source_word: ἀφοριοῦσιν
  choice: వేరు చేస్తారు
  rationale: ఒక మిశ్రమ సమూహం మధ్య నుండి ఒక వర్గాన్ని ప్రత్యేకంగా విడదీయడమనే క్రియార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τοὺς πονηροὺς
  choice: దుష్టులను
  rationale: నామవాచకంగా వాడిన విశేషణం నైతికంగా చెడ్డ వ్యక్తులను సూచిస్తుంది; ‘దుష్టులు’ ఆధునిక గౌరవప్రద బైబిలు శైలిలో స్పష్టంగా ఉంటుంది.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: నీతిమంతుల మధ్య నుండి
  rationale: దుష్టులు నీతిమంతులతో కలిసివున్న సమూహం మధ్య నుండే వేరు చేయబడతారనే ἐκ μέσου భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: అంత్యకాల వాక్యంలో αἰών అర్థం
  choice: యుగం
  alternative: లోకం/ప్రపంచం
  rationale: αἰών ఇక్కడ ప్రస్తుత యుగం లేదా వ్యవస్థను సూచిస్తుంది; భౌతిక సృష్టి నాశనమవుతుందని పదబంధంలో లేని భావాన్ని ‘ప్రపంచం’ ద్వారా చేర్చకూడదు.
- issue: ἄγγελοι ఎవరిని సూచిస్తుంది
  choice: పరలోక దేవదూతలు
  alternative: మానవ సందేశకులు
  rationale: యేసు వివరించే అంతిమ తీర్పు సందర్భం ప్రకారం ఇక్కడ పరలోక దూతలే ఉద్దేశించబడ్డారు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘యుగసమాప్తి’ మూలంలోని ముగింపు మరియు పరిపూర్తి భావాలను సంక్షిప్తంగా నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
