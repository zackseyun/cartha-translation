id: MAT.13.1
reference: Matthew 13:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελθὼν ὁ Ἰησοῦς ⸀τῆς οἰκίας ἐκάθητο παρὰ τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: te
  text: ఆ రోజున యేసు ఇంటి నుండి బయటకు వెళ్లి సముద్రం పక్కన కూర్చున్నాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అదే రోజున.” ముందటి సందర్భంతో కొనసాగింపును ఈ మాటలు నొక్కిచెబుతున్నాయని గ్రహిస్తే ఇలా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “సముద్రం దగ్గర.” గ్రీకు ప్రయోగం సముద్రానికి సమీపంలో ఉన్న స్థానాన్ని సూచిస్తుంది; తీరరేఖ నుండి ఖచ్చితమైన దూరాన్ని చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: ఆ రోజున
  rationale: సహజమైన ఆధునిక తెలుగు కాలసూచన; గ్రీకు వాక్యంలో ‘అదే’ అని స్పష్టంగా లేకపోవడం వల్ల దాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: ἐξελθὼν ... τῆς οἰκίας
  choice: ఇంటి నుండి బయటకు వెళ్లి
  rationale: ముందుగా జరిగిన అనుబంధ క్రియను తెలుగులో సహజమైన సమాపక క్రియతో వ్యక్తం చేస్తూ, బయలుదేరిన స్థలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐκάθητο
  choice: కూర్చున్నాడు
  rationale: ఇక్కడి imperfect రూపం నేపథ్య దృశ్యాన్ని సూచించగలిగినా, తెలుగులో ఈ సందర్భంలో ‘కూర్చున్నాడు’ సహజంగా ఉండి క్రియను అతిగా వ్యాఖ్యానించదు.
- source_word: παρὰ τὴν θάλασσαν
  choice: సముద్రం పక్కన
  rationale: παρά + accusative సూచించే సముద్రానికి సమీపమైన స్థానాన్ని సహజంగా తెలుపుతుంది; తీరానికి ఎంత దగ్గరగా ఉన్నాడో నిర్దిష్టం చేయదు.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
