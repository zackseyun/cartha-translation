translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘గృహము,’ ‘సముద్రతీరమున’ వంటి పాత లేదా అతిగా సాహిత్య రూపాలను నివారించాం; మూలంలోని కాలసూచన, క్రియాక్రమం, స్థలసంబంధ అస్పష్టతను కాపాడాం.
