id: MAT.13.44
reference: Matthew 13:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: te
  text: పరలోక రాజ్యం ఒక పొలంలో దాచబడి ఉన్న నిధి వంటిది.[a] ఒక మనిషి ఆ నిధిని కనుగొని దాచాడు. అతడు ఆనందంతో[b] వెళ్లి, తనకున్నదంతా అమ్మి, ఆ పొలాన్ని కొంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోక రాజ్యం పొలంలో దాచబడి ఉన్న నిధి వంటిది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన ఆనందం వల్ల అతడు వెళ్లి, తనకున్నదంతా అమ్మి, ఆ పొలాన్ని కొంటాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: పోలి ఉంది
  rationale: ఉపమానాన్ని స్పష్టంగా నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వినిపించే రూపం.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి సువార్తలోని స్థిరమైన భావవ్యక్తీకరణను కాపాడుతుంది; βασιλείαలోని రాజ్యం/పాలన అనే భావవిస్తృతిని అనవసరంగా ఒకే అర్థానికి పరిమితం చేయదు.
- source_word: θησαυρῷ
  choice: నిధిని
  rationale: ఉపమానంలో విలువైన, దాచబడిన సంపదను సూచించడానికి సాధారణ పాఠకులకు సహజమైన పదం.
- source_word: κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: ఒక పొలంలో దాచబడి ఉన్న
  rationale: పర్ఫెక్ట్ పాసివ్ పార్టిసిపిల్ సూచించే కొనసాగుతున్న దాచబడిన స్థితిని ‘దాచబడి ఉన్న’గా నిలుపుతుంది; ఉపమాన పరిచయంలో ἀγρόςను సహజంగా అనిర్దిష్టమైన ‘ఒక పొలం’గా ఇస్తుంది.
- source_word: ὃν εὑρὼν ἄνθρωπος
  choice: ఒక మనిషి దాన్ని కనుగొని
  rationale: θησαυρόςకు తిరిగి సూచనగా ‘దాన్ని’ను స్పష్టంగా ఉంచి, పురుష ఏకవచన కథాపాత్రను ‘ఒక మనిషి’గా కాపాడుతుంది.
- source_word: ἔκρυψεν
  choice: మళ్లీ దాచిపెట్టాడు
  rationale: ఆ మనిషి నిధిని కనుగొన్న తరువాత దాచాడనే కథా క్రమాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘మళ్లీ’ మూలంలోని క్రియకు సందర్భానుగుణంగా అంతర్లీనమైన పునర్దాచే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: ఆనందంతో
  rationale: అతని ఆనందభావాన్నీ, అది తరువాతి చర్యకు ప్రేరణ కావడాన్నీ సహజమైన సంక్షిప్త రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ὑπάγει
  choice: అతడు వెళ్లి
  rationale: వర్తమానకాలంలోని సజీవ కథన క్రమాన్ని తెలుగులో సహజమైన అనుసంధాన క్రియతో అందిస్తుంది; ‘వెళ్లిపోతాడు’ అనే బలమైన భావాన్ని తప్పనిసరిగా రుద్దదు.
- source_word: πωλεῖ πάντα ὅσα ἔχει
  choice: తనకున్నదంతా అమ్మి
  rationale: πάντα ὅσα ἔχειలోని సంపూర్ణతను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: ఆ పొలాన్ని కొంటాడు
  rationale: ἐκεῖνον సూచించే నిర్దిష్టమైన, నిధి ఉన్న అదే పొలాన్ని ‘ఆ పొలం’గా స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: ἄνθρωπος పదంలోని లింగ సూచన
  choice: ఒక మనిషి
  alternative: ఒక వ్యక్తి
  rationale: ఇక్కడ పురుష ఏకవచన కథాపాత్ర ఉంది. ప్రతినిధి స్వభావాన్ని కోల్పోకుండా మూలంలోని వ్యాకరణ లింగాన్ని నిలుపుతుంది.
- issue: βασιλεία యొక్క భావవిస్తృతి
  choice: రాజ్యం
  alternative: పాలన
  rationale: ఈ పదం రాజ్యాన్నీ రాజపాలననూ సూచించగలదు. ఉపమాన సూత్రంలో స్థిరమైన ‘రాజ్యం’ను వాడటం ద్వారా ఏ ఒక్క వ్యవస్థాత్మక వ్యాఖ్యానాన్నీ వచనంపై రుద్దకుండా భావవిస్తృతిని తెరిచి ఉంచుతుంది.
- issue: నిధిని తిరిగి దాచిన చర్య
  choice: మళ్లీ దాచిపెట్టాడు
  alternative: దాచాడు
  rationale: కథలో కనుగొన్న తరువాత జరిగిన చర్యను స్పష్టపరుస్తుంది; ఆ చర్య యొక్క నైతికతపై వచనం చేయని తీర్పును అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. వర్తమానకాల కథన సజీవతను ‘కొంటాడు’తో నిలిపి, అనుసంధాన క్రియల ద్వారా వాక్యప్రవాహాన్ని సహజంగా ఉంచింది. మూలంలోని కారణార్థం మరియు భావస్థితి మధ్య ఉన్న స్వల్ప విస్తృతిని ప్రధాన పాఠం, పాదసూచిక రెండింటిలో కాపాడింది.
