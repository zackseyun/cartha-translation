id: MAT.13.42
reference: Matthew 13:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: te
  text: వారిని అగ్ని కొలిమిలో పడవేస్తారు. అక్కడ ఏడుపూ పళ్లు కొరుక్కోవడమూ ఉంటుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαλοῦσιν
  choice: పడవేస్తారు
  rationale: భవిష్యత్ కాలంలోని క్రియాశీల రూపాన్ని, బలవంతంగా విసిరివేయడం అనే భావంతో సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: αὐτούς
  choice: వారిని
  rationale: ముందటి వచనంలో పేర్కొన్న వ్యక్తులను సూచించే బహువచన కర్మ సర్వనామాన్ని సహజంగా నిలుపుతుంది.
- source_word: κάμινον τοῦ πυρός
  choice: అగ్ని కొలిమి
  rationale: గ్రీకు షష్ఠీ నిర్మాణంలోని స్పష్టమైన అగ్ని-తీర్పు చిత్రాన్ని నిలుపుతూ, తెలుగులో సహజమైన నామసమాసంగా అందిస్తుంది.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: ఇప్పుడే పేర్కొన్న అగ్ని కొలిమి అనే స్థలాన్ని నేరుగా సూచించే స్థానార్థాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: κλαυθμός
  choice: ఏడుపు
  rationale: దుఃఖం, వేదనతో కూడిన రోదనను అతిగా తీవ్రతరం చేయకుండా సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: పండ్లు కొరుక్కోవడం
  rationale: పళ్లను బిగించి రాపడం అనే గ్రీకు నుడికారాన్ని, తెలుగులో స్థిరపడిన మరియు అర్థమయ్యే రూపంలో వ్యక్తపరుస్తుంది; అది దుఃఖమా కోపమా అని సంకుచితం చేయదు.
- source_word: καὶ
  choice: మరియు అనే భావం వాక్యప్రవాహంలో అంతర్లీనంగా ఉంది
  rationale: ఈ వచనం ముందటి వాక్యంతో కొనసాగుతున్నప్పటికీ, తెలుగులో స్వతంత్ర వాక్యారంభంలో ‘మరియు’ ఉంచడం కృత్రిమంగా ఉండేందున సహజ వాక్యప్రవాహానికి అనుగుణంగా విడిచిపెట్టబడింది.
theological_decisions:
- issue: అగ్ని కొలిమి అనే తీర్పు చిత్రం
  choice: మూలంలోని స్పష్టమైన రూపకాన్ని ‘అగ్ని కొలిమి’గా యథాతథంగా నిలుపడం
  alternative: దీనిని ‘నరకాగ్ని’గా సిద్ధాంతపరంగా వివరించడం లేదా చిత్ర తీవ్రతను తగ్గించడం
  rationale: మూలపాఠం తీర్పును బలమైన చిత్రంగా చెబుతుంది గాని, తరువాతి సిద్ధాంత పదజాలంతో దానిని నిర్వచించదు.
- issue: ఏడుపు మరియు పండ్లు కొరుక్కోవడం యొక్క భావం
  choice: వేదనతో కూడిన మత్తయి సువార్తలోని స్థిర అభివ్యక్తిని భావపరంగా తెరిచి ఉంచడం
  alternative: పండ్లు కొరుక్కోవడాన్ని కేవలం కోపంగా లేదా మొత్తం పదబంధాన్ని కేవలం దుఃఖంగా వ్యాఖ్యానించడం
  rationale: ఈ నుడికారం దుఃఖం, వేదన, ఆగ్రహం వంటి ఛాయలను కలిగి ఉండవచ్చు; అనువాదం వాటిలో ఒక్కదానికే పరిమితం చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే తీర్పు చిత్రంలోని గంభీరతను తగ్గించకుండా రూపొందించబడింది. ‘కొరుక్కోవడం’ పాత శైలిలోని ‘కొరుకుట’ కంటే సహజమైన ఆధునిక రూపం.
