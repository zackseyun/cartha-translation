  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో గౌరవప్రదమైన కథన శైలిని పాటించాం. గ్రీకు వాక్యంలోని వరుస చర్యలను తెలుగు అసమాపక క్రియలతో సహజంగా నిలిపాం.
