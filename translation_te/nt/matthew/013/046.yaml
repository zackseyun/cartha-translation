id: MAT.13.46
reference: Matthew 13:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: te
  text: అతడు గొప్ప విలువగల ఒక ముత్యాన్ని[a] కనుగొని, వెళ్లి, తనకున్నదంతా అమ్మి, దాన్ని కొన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విలువైన ఒక ముత్యాన్ని.’
    reason: πολύτιμον అనే పదాన్ని ‘గొప్ప విలువగల’ అని లేదా సంక్షిప్తంగా ‘విలువైన’ అని అనువదించవచ్చు.
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: కనుగొని
  rationale: వర్తకుడు ముత్యాన్ని కనుగొనడం తరువాతి ప్రధాన క్రియలకు ముందుగా జరిగిన చర్య అని అసమాపక క్రియ సహజంగా తెలియజేస్తుంది. δέ ఇక్కడ బలమైన వ్యతిరేక భావం కాక స్వల్ప అనుసంధానం మాత్రమే; తెలుగు వాక్యప్రవాహంలో దానికి ప్రత్యేక పదం అవసరం లేదు.
- source_word: ἕνα
  choice: ఒక
  rationale: గ్రీకులోని సంఖ్యావాచకాన్ని నిలుపుతూ, అసాధారణ విలువగల ఏకైక ముత్యంపై దృష్టి నిలిపింది.
- source_word: πολύτιμον
  choice: గొప్ప విలువగల
  rationale: ముత్యానికి అత్యధిక విలువ ఉందనే భావాన్ని స్పష్టంగా, అతిశయోక్తి లేకుండా అందిస్తుంది.
- source_word: μαργαρίτην
  choice: ముత్యాన్ని
  rationale: ఇది మూలపదానికి ప్రామాణికమైన, సందర్భానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: ἀπελθὼν
  choice: వెళ్లి
  rationale: చర్యల వరుసను సంక్షిప్తంగా, సహజమైన తెలుగు శైలిలో చూపిస్తుంది.
- source_word: πέπρακεν
  choice: అమ్మి
  rationale: గ్రీకు పరిపూర్ణకాల రూపం సూచించే పూర్తయిన చర్యను ఈ కథన వరుసలో తెలుగు అసమాపక క్రియ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πάντα ὅσα εἶχεν
  choice: తనకున్నదంతా
  rationale: πάντα తెలిపే సంపూర్ణతను నిలుపుతూ, తెలుగు వాడుకలో సహజంగా ఉంది.
- source_word: ἠγόρασεν
  choice: కొన్నాడు
  rationale: సాధారణ, స్పష్టమైన తెలుగు పదం; కొనుగోలు చర్యను నేరుగా తెలియజేస్తుంది.
- source_word: αὐτόν
  choice: దాన్ని
  rationale: గ్రీకులో వ్యాకరణపరంగా పుంలింగ రూపమైనా, అది నిర్జీవ వస్తువైన ముత్యాన్నే సూచిస్తుంది; అందువల్ల తెలుగులో ‘దాన్ని’ సహజం.
