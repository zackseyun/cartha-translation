  source_fidelity: 'గ్రీకు వాక్యంలోని చర్యల క్రమం సమగ్రంగా నిలిచింది: ముత్యాన్ని కనుగొనడం, వెళ్లడం, తనకున్నదంతా అమ్మడం, దానిని కొనడం. ἕνα లోని ‘ఒక’ను, πολύτιμον లోని అసాధారణ విలువను ‘గొప్ప విలువగల’ ద్వారా, πάντα ὅσα εἶχεν లోని సంపూర్ణతను ‘తనకున్నదంతా’ ద్వారా సరిగ్గా అందించారు. αὐτόνకు ‘దాన్ని’ అనేది ముత్యాన్ని సూచించే సహజ తెలుగు ప్రయోగం.'
