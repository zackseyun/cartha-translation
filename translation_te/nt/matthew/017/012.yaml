  source_fidelity: 'ప్రధాన భావం గ్రీకు మూలానికి విశ్వసనీయంగా ఉంది: ఏలీయా ఇప్పటికే వచ్చాడనే ప్రకటన, అతన్ని గుర్తించకపోవడం, అతనిపట్ల తమ ఇష్టానుసారం ప్రవర్తించడం, అలాగే మనుష్య కుమారునికి వారి ద్వారా రాబోయే బాధ అనే పోలిక అన్నీ నిలిచాయి. అయితే “అతనికి చేశారు” తెలుగులో అతని కోసం ఏదైనా చేశారనే అర్థానికీ అవకాశం ఇస్తుంది; ἐποίησαν ἐν αὐτῷ యొక్క అతనిపట్ల/అతనితో చేసిన చర్యను స్పష్టంగా చేయడం అవసరం.'
