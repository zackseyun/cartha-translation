id: MAT.17.12
reference: Matthew 17:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: te
  text: 'కాని నేను మీతో చెబుతున్నాను: ఏలీయా ఇప్పటికే వచ్చాడు; వారు అతన్ని గుర్తించలేదు[a], కానీ అతనితో తమకు నచ్చినదంతా చేశారు[b]. అదే విధంగా మనుష్య కుమారుడు కూడా వారి చేతులవల్ల బాధపడబోతున్నాడు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు అతన్ని తెలుసుకోలేదు’ లేదా ‘అతన్ని అంగీకరించలేదు.’ గ్రీకు పదం అతను ఎవరో లేదా అతని పాత్ర ఏమిటో సరిగా గుర్తించకపోవడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘తమకు ఇష్టమైన విధంగా అతనితో వ్యవహరించారు.’ గ్రీకు ప్రయోగం అతనిపట్ల వారు తమ ఇష్టానుసారం వ్యవహరించారని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘బాధపడనున్నాడు.’ గ్రీకు పదబంధం ఆ బాధ రాబోతోందని, అది సమీపించి ఉందని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: కాని నేను మీతో చెబుతున్నాను
  rationale: δέ ముందున్న నిరీక్షణకు వ్యతిరేకమైన మలుపును సూచిస్తుంది; λέγω ... ὑμῖνను సహజమైన ఆధునిక తెలుగులో ప్రత్యక్ష ప్రకటనగా అందించాం.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: ఏలీయా ఇప్పటికే వచ్చాడు
  rationale: ἤδηతో కూడిన aorist ἦλθεν పూర్తయిన రాకను, సందర్భంలో దాని ప్రస్తుత ప్రాముఖ్యతను తెలియజేస్తుంది.
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: వారు అతన్ని గుర్తించలేదు
  rationale: సందర్భంలో ἐπιγινώσκω కేవలం పరిచయం లేకపోవడం కంటే అతని గుర్తింపు లేదా పాత్రను సరిగా గ్రహించకపోవడాన్ని సూచిస్తుంది.
- source_word: ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: తమకు నచ్చినదంతా అతనికి చేశారు
  rationale: ποιέω ἐν అనే గ్రీకు ప్రయోగాన్ని పదశః కాకుండా, అతనిపట్ల తమ ఇష్టానుసారం వ్యవహరించిన భావం స్పష్టంగా వచ్చేలా సహజమైన తెలుగులో ఇచ్చాం.
- source_word: οὕτως καὶ
  choice: అదే విధంగా ... కూడా
  rationale: ఏలీయాకు జరిగినదానికీ మనుష్య కుమారునికి జరగబోయేదానికీ ఉన్న పోలికను స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: ఈ బిరుదుకు స్థిరపడిన తెలుగు రూపాన్ని ఉపయోగించి దాని గ్రంథసంబంధ ప్రతిధ్వనిని కాపాడాం.
- source_word: μέλλει πάσχειν
  choice: బాధ అనుభవించబోతున్నాడు
  rationale: μέλλω + infinitive రాబోయే లేదా సమీపిస్తున్న క్రియను సూచిస్తుంది; గ్రీకులో లేని బలమైన విధి లేదా అనివార్యత భావాన్ని చేర్చలేదు.
- source_word: ὑπ’ αὐτῶν
  choice: వారి చేతుల్లో
  rationale: ὑπό + genitive హానికర చర్యకు వారే కర్తలని సూచిస్తుంది; ‘వారి చేతుల్లో’ అనే తెలుగు ప్రయోగం ఆ hostile agencyని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఏలీయా రాకకు సంబంధించిన గుర్తింపు
  choice: వచనంలో ఉన్నట్లుగానే ‘ఏలీయా’ అని ఉంచి, యోహాను బాప్తిస్మమిచ్చువాడని ప్రధాన పాఠ్యంలో చేర్చలేదు.
  alternative: ఈ ఏలీయా యోహాను బాప్తిస్మమిచ్చువాడని వివరణాత్మకంగా చేర్చడం.
  rationale: తక్షణ సందర్భం ఆ గుర్తింపును వివరిస్తుంది; అయితే ఈ వచనం స్వయంగా ఏలీయా అని మాత్రమే చెబుతుంది. కాబట్టి సందర్భం పరిష్కరించాల్సిన అంశాన్ని అనువాదం ముందుగానే పరిష్కరించదు.
- issue: మనుష్య కుమారుని బాధలో μέλλει యొక్క బలం
  choice: సమీపిస్తున్న భవిష్యత్తును సూచించే ‘బాధ అనుభవించబోతున్నాడు’ అని అనువదించాం.
  alternative: ‘బాధ అనుభవించవలసి ఉంది’ లేదా ‘బాధ అనుభవించడం విధిగా నిర్ణయించబడింది.’
  rationale: ఈ వాక్యభాగం రాబోయే బాధను చెబుతుంది; కానీ ఇక్కడే దైవిక అనివార్యతను స్పష్టంగా ప్రకటించదు. అందువల్ల మూలపాఠ్యాన్ని మించిన సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. మూలంలోని వ్యతిరేక మలుపు, ఏలీయా–మనుష్య కుమారుడు పోలిక, రాబోయే బాధ భావం నిలుపబడ్డాయి. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
