reference: Matthew 17:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: te
  text: 'ఆయన ఇంకా మాట్లాడుతుండగానే, ఇదిగో,[a] ప్రకాశవంతమైన మేఘం వారిని కమ్ముకుంది.[b] ఇదిగో, ఆ మేఘంలోనుంచి ఒక స్వరం ఇలా పలికింది: “ఈయనే నా ప్రియ కుమారుడు; ఈయనపట్ల నేను సంతోషిస్తున్నాను. ఈయన మాట వినండి.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో ‘ఇదిగో’ అనే శ్రద్ధను ఆకర్షించే సూచకపదం ఈ వచనంలో రెండుసార్లు వస్తుంది; దృశ్యంలోని నాటకీయతను ఇది పెంచుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘కమ్ముకుంది’ అనే పదప్రయోగం దేవుని ప్రత్యక్ష సన్నిధితో ముడిపడిన బైబిలు దైవదర్శన భాషను ప్రతిధ్వనింపజేయవచ్చు.
    reason: cross_reference
  - marker: c
    text: లేదా ‘ఈయన చెప్పేది ఆలకించండి.’ గ్రీకు ఆజ్ఞారూపం వినడమే కాక శ్రద్ధచూపి పాటించాలనే భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: ఆయన ఇంకా మాట్లాడుతుండగానే
  rationale: ఈ genitive absolute సమకాలీన చర్యను, ἔτι వల్ల ఆయన మాట పూర్తికాకముందే జరిగిన అంతరాయాన్ని సూచిస్తుంది. ‘మాట్లాడుతుండగానే’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: దృశ్యంపై శ్రద్ధను ఆకర్షించి నాటకీయతను పెంచే సూచకపదం. మూలంలో రెండుసార్లు ఉన్నందున అనువాదంలోనూ రెండుసార్లు ఉంచబడింది.
- source_word: νεφέλη φωτεινὴ
  choice: ప్రకాశవంతమైన మేఘం
  rationale: φωτεινή అనే పదంలోని వెలుగు/ప్రకాశ భావాన్ని సూటిగా తెలియజేస్తుంది; దాని సంకేతార్థాన్ని ప్రధాన వాక్యంలో విస్తరించదు.
- source_word: ἐπεσκίασεν
  choice: కమ్ముకుంది
  rationale: మేఘం వారిమీద వ్యాపించి వారిని ఆవరించిన దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సాధ్యమైన దైవసన్నిధి ప్రతిధ్వనిని పాదసూచికలో సూచిస్తుంది.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: ఆ మేఘంలోనుంచి ఒక స్వరం ఇలా పలికింది
  rationale: గ్రీకు participle‌ను తెలుగులో సహజమైన సమాపక క్రియగా మార్చి, స్వరం మేఘం లోపలినుంచి వచ్చిందనే భావాన్ని కాపాడుతుంది.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: నా ప్రియ కుమారుడు
  rationale: కుమారుని సంబంధాన్ని, ἀγαπητόςలోని ప్రేమ భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ᾧ εὐδόκησα
  choice: ఈయనపట్ల నేను సంతోషిస్తున్నాను
  rationale: దైవ ప్రకటనలోని అనుకూలత, ఆనందం అనే సంబంధాత్మక భావాన్ని సహజ తెలుగులో అందిస్తుంది. గ్రీకు aorist‌ను తెలుగు సందర్భంలో సహజమైన వర్తమాన ప్రకటనగా వ్యక్తం చేస్తుంది.
- source_word: ἀκούετε αὐτοῦ
  choice: ఈయన మాట వినండి
  rationale: కేవలం శబ్దాన్ని వినడమే కాక ఆయన చెప్పేదాన్ని శ్రద్ధగా ఆలకించి అనుసరించాలనే imperative బలాన్ని వ్యక్తం చేస్తుంది; ‘లోబడండి’ అని అతిగా వ్యాఖ్యానించదు.
theological_decisions:
- issue: యేసును గురించిన దైవ ప్రకటన
  choice: ఈయనే నా ప్రియ కుమారుడు; ఈయనపట్ల నేను సంతోషిస్తున్నాను
  alternative: ఈయనే నా కుమారుడు, ప్రియుడు; ఈయనలో నేను ఆనందించాను
  rationale: యేసును కుమారునిగా నేరుగా గుర్తిస్తూ, ప్రేమ మరియు దైవ అనుకూలతను నిలుపుతుంది; మూలంలో లేని అనంతర సిద్ధాంత పదజాలాన్ని చేర్చదు.
- issue: ἀκούετε αὐτοῦ ఆజ్ఞలోని భావం
  choice: ఈయన మాట వినండి
  alternative: ఈయన చెప్పేది ఆలకించండి
  rationale: ఈ ఆజ్ఞలో వినడంతోపాటు శ్రద్ధచూపి పాటించాలనే భావం ఉండవచ్చు. ఎంచుకున్న రూపం ఆ బలాన్ని సూచిస్తుంది గాని దాన్ని ‘లోబడండి’గా పూర్తిగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ఇదిగో’ కొంత ఉన్నత శైలికి చెందినదైనా సాధారణ పాఠకులకు అర్థమయ్యేది; మూలంలోని నాటకీయ పునరుక్తిని కాపాడేందుకు రెండుసార్లు ఉంచాం. సంభాషణలో ‘ఈయనే’ అనే రూపం ప్రత్యక్ష గుర్తింపును బలంగా, సహజంగా తెలియజేస్తుంది.
