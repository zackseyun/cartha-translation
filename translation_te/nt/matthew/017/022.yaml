id: MAT.17.22
reference: Matthew 17:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: te
  text: వారు గలిలయలో కూడి ఉన్నప్పుడు[a], యేసు వారితో, “మనుష్యకుమారుడు మనుష్యుల చేతుల్లోకి అప్పగించబడబోతున్నాడు,” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కలిసి ఉన్నప్పుడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: కూడి ఉన్నప్పుడు
  rationale: ఈ సమూహవాచక వర్తమాన కృదంతం వారు ఒకచోట చేరడం లేదా కలిసి ఉండడం అనే భావాన్ని ఇస్తుంది. ‘కూడి ఉన్నప్పుడు’ ఆ సామూహిక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; సాధ్యమైన మరో భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: δὲ
  choice: ఉన్నప్పుడు అనే ఉపవాక్య నిర్మాణంలో అంతర్లీనంగా వ్యక్తీకరించబడింది
  rationale: δέ ఇక్కడ ముందున్న కథనంతో పరిస్థితిని అనుసంధానిస్తుంది. తెలుగులో ప్రత్యేకంగా ‘అయితే’ అని చేర్చడం కంటే కాలార్థక ఉపవాక్యమే సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: గలిలయలో
  rationale: స్థలాన్ని నేరుగా, సహజంగా సూచించే అనువాదం.
- source_word: εἶπεν αὐτοῖς
  choice: యేసు వారితో … అని చెప్పాడు
  rationale: తెలుగు ప్రత్యక్ష వాక్య నిర్మాణానికి అనుగుణంగా క్రియను ఉద్ధరణ తర్వాత ఉంచి, మూలంలోని ‘వారితో చెప్పాడు’ అనే భావాన్ని స్పష్టంగా నిలిపింది.
- source_word: Μέλλει
  choice: బోతున్నాడు
  rationale: త్వరలో జరగనున్న చర్యను సూచించే μέλλω భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; విధిగా నిర్ణయించబడినది అనే అదనపు భావాన్ని రుద్దదు.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు తనను గురించి ఉపయోగించిన స్థిరమైన బిరుదును, దాని గ్రంథాంతర మరియు వేదాంత ప్రతిధ్వనులతో సహా నిలుపుతుంది.
- source_word: παραδίδοσθαι
  choice: అప్పగించబడబోతున్నాడు
  rationale: మూలంలోని కర్మణి ప్రయోగాన్ని నిలుపుతూ, ‘అప్పగించబడడం/చేతికి ఇవ్వబడడం’ అనే విస్తృత భావాన్ని ఇస్తుంది. దాన్ని కేవలం ‘ద్రోహం చేయబడడం’గా సంకుచితం చేయదు.
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: మనుష్యుల చేతుల్లోకి
  rationale: మూలంలోని ‘చేతుల్లోకి’ అనే రూపకాన్ని నిలుపుతుంది; అలాగే ‘మనుష్యకుమారుడు—మనుష్యులు’ అనే ఉద్దేశపూర్వక పదసంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే బిరుదు
  choice: మనుష్యకుమారుడు
  alternative: మానవ కుమారుడు
  rationale: సువార్తలలోని స్థిరమైన స్వీయసూచనను, దాని దానియేలు గ్రంథ సంబంధమైన ప్రతిధ్వనిని ‘మనుష్యకుమారుడు’ మెరుగుగా నిలుపుతుంది.
- issue: παραδίδοσθαι యొక్క భావపరిధి
  choice: అప్పగించబడబోతున్నాడు
  alternative: ద్రోహం చేయబడబోతున్నాడు
  rationale: మూలపదం అప్పగించడం, అధికారానికి చేతికివ్వడం, సందర్భానుసారం ద్రోహం చేయడం వంటి భావాలను కలిగి ఉండగలదు. ప్రధాన పాఠం దాని విస్తృతతను, కర్మణి రూపాన్ని నిలుపుతుంది; ద్రోహి ఎవరో లేదా అంతిమ కార్యసాధకుడు ఎవరో ఈ వాక్యమే నిర్ణయించినట్లు అనువదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణాన్ని ఉపయోగించాం. భాష సాధారణ పాఠకులకు సులభంగా ఉండేలా చూసినా, ‘మనుష్యకుమారుడు,’ ‘చేతుల్లోకి,’ కర్మణి రూపం వంటి మూలంలోని ముఖ్యమైన రూపక, వేదాంత లక్షణాలను నిలిపాం.
