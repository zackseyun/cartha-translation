id: MAT.17.21
reference: Matthew 17:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ τὸ γένος οὐκ ἐκπορεύεται εἰ μὴ ἐν προσευχῇ καὶ νηστείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: te
  text: అయితే[a] ఈ రకమైనది ప్రార్థనతోను ఉపవాసంతోను తప్ప బయటికి రాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం అత్యంత ప్రాచీన గ్రీకు ప్రతుల్లో (నాలుగో శతాబ్దానికి చెందిన సీనైటికస్, వాటికానస్ ప్రతులు సహా), అలాగే ప్రాచీన సిరియాక్, కాప్టిక్ అనువాదాల్లో లేదు. అయితే బైజాంటైన్ అధికసంఖ్యాక ప్రతుల సంప్రదాయంలో, లాటిన్ సంప్రదాయంలో, సిరియాక్ ప్రతుల్లో అధిక భాగంలో ఉంది. మార్కు 9:29తో సరిపోల్చడానికి తరువాతి నకలుదారులు దీనిని చేర్చి ఉండవచ్చు.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: రకం
  rationale: ఈ సందర్భంలో ఇది దయ్యాల వర్గాన్ని లేదా విధాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఈ రకం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: ἐκπορεύεται
  choice: బయటికి రాదు
  rationale: పీడితునిలోనుంచి దయ్యం నిష్క్రమించడాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: ప్రార్థన, ఉపవాసం మాత్రమే మినహాయింపు లేదా అవసరమైన సాధనమని తెలిపే గ్రీకు ప్రత్యేకార్థాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν προσευχῇ καὶ νηστείᾳ
  choice: ప్రార్థన, ఉపవాసం వల్ల
  rationale: ἐν ఇక్కడ సాధనార్థకంగా ఉంది; ‘వల్ల’ అనేది ప్రార్థన, ఉపవాసం ద్వారా మాత్రమే అది బయటికి వస్తుందనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఈ రకం’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో సూచ్యార్థాన్ని నిర్దిష్టంగా చెప్పకుండా ‘ఈ రకం’గా ఉంచడం
  alternative: ‘ఈ రకమైన దయ్యం’ అని స్పష్టీకరించడం
  rationale: గ్రీకు పాఠ్యంలో γένος మాత్రమే ఉంది; సందర్భం దయ్యాన్ని సూచించినప్పటికీ, మూలంలోని సంక్షిప్తతను మరియు కొంత సూచ్యార్థాన్ని నిలుపుకోవడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. వచనం మూలంలో ఉన్నందున ప్రధాన పాఠ్యంలో ఉంచి, దాని పాఠాంతర స్థితిని [a] పాదటిప్పణిలో స్పష్టంగా తెలిపాం.
