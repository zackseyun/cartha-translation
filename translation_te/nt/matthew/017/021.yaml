  to: అయితే[a] ఈ రకమైనది ప్రార్థనతోను ఉపవాసంతోను తప్ప బయటికి రాదు.
  rationale: The revision changes the causal-sounding “వల్ల” to an instrumental/sphere-preserving formulation, “ప్రార్థనతోను ఉపవాసంతోను తప్ప.” It also makes the elliptical subject idiomatic Telugu with “ఈ రకమైనది,” without adding “demon” to the main text. The supplied textual-critical footnote remains unchanged and correctly anchored.
