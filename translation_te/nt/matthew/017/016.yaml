source:
  edition: SBLGNT
  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: te
  text: నేను అతన్ని నీ శిష్యుల దగ్గరకు తీసుకొని వచ్చాను; వారు అతన్ని స్వస్థపరచలేకపోయారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκα
  choice: దగ్గరికి తీసుకొచ్చాను
  rationale: προσφέρω యొక్క ఈ రూపం ఇక్కడ ఒక వ్యక్తిని మరొకరి దగ్గరికి తీసుకురావడాన్ని సూచిస్తుంది. ‘దగ్గరికి తీసుకొచ్చాను’ అనేది దత్తివాచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: μαθηταῖς σου
  choice: నీ శిష్యుల
  rationale: సువార్తల సందర్భంలో μαθητής ఒక బోధకుని వద్ద నేర్చుకుంటూ ఆయనను అనుసరించే నిబద్ధ అనుచరుణ్ని సూచిస్తుంది; ‘శిష్యులు’ ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
- source_word: οὐκ ἠδυνήθησαν
  choice: లేకపోయారు
  rationale: δύναμαι సామర్థ్యాన్ని సూచిస్తుంది. θεραπεῦσαιతో కలిపి ‘స్వస్థపరచలేకపోయారు’ అనడం తెలుగులో సహజంగా ఉండి, వారి అసమర్థతను మాత్రమే తెలియజేస్తుంది.
- source_word: θεραπεῦσαι
  choice: స్వస్థపరచ
  rationale: ఈ సందర్భంలో θεραπεύω బాధిత బాలుణ్ని బాగుచేయడం లేదా స్వస్థపరచడం అనే అర్థం ఇస్తుంది. ‘స్వస్థపరచడం’ గౌరవప్రదమైన, సువార్తల స్వస్థత సందర్భాలకు తగిన పదం.
- source_word: καὶ ... καὶ
  choice: …; కానీ
  rationale: మొదటి καίను తెలుగు వాక్యారంభంలో విడిగా అనువదించకపోవడం సహజం. రెండవ καί వ్యాకరణపరంగా సమన్వయకారకమే అయినా, తీసుకొచ్చిన ఉద్దేశం నెరవేరకపోవడాన్ని తెలుగులో సహజంగా తెలిపేందుకు సందర్భానుసారంగా ‘కానీ’ వాడబడింది.
- source_word: αὐτόν
  choice: అతన్ని
  rationale: ఈ సర్వనామం ముందున్న బాధిత కుమారుడు లేదా బాలుణ్ని సూచిస్తుంది; ‘అతన్ని’ ప్రత్యక్షమైన తెలుగు సమానం.
theological_decisions:
- issue: శిష్యుల వైఫల్య స్వభావం
  choice: వారు అతన్ని స్వస్థపరచలేకపోయారని మాత్రమే అనువదించడం
  alternative: వారు దయ్యాన్ని వెళ్లగొట్టలేకపోయారని లేదా అవిశ్వాసం వల్ల విఫలమయ్యారని ఈ వచనంలోనే స్పష్టీకరించడం
  rationale: ఈ వచనం వారి అసమర్థతకు కారణాన్ని చెప్పకుండా, వారు అతన్ని స్వస్థపరచలేకపోయారని మాత్రమే చెబుతుంది. చుట్టుపక్కల వచనాల వివరణను ఇక్కడికి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘నీ’ అనేది ఏకవచన సంబోధనను నిలుపుతుంది. మూలంలోని రెండుసార్ల αὐτόνను ‘అతన్ని’ అని పునరావృతం చేసి సూచనను స్పష్టంగా ఉంచాం.
