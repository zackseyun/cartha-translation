    issue: Gender-neutral rendering of ἄνθρωπος
    rationale: Although “వ్యక్తి” can be natural Telugu, this context concerns a particular man (as the following context confirms), and “మనిషి” better retains the source’s masculine referent without overtranslation.
  - severity: low
    issue: Compressed expression for kneeling
    rationale: “మోకాళ్లూని” is understandable, but “మోకాళ్లపై వంగి” is more transparent and idiomatic in modern standard Telugu while preserving γονυπετῶν.
  revised_text: వారు జనసమూహం దగ్గరకు వచ్చినప్పుడు, ఒక మనిషి ఆయన దగ్గరకు వచ్చి, ఆయన ఎదుట మోకాళ్లపై వంగి,
