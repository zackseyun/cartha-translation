  naturalness: The sentence is natural modern standard Telugu. “మోకాళ్లపై వంగి” is a clear, idiomatic rendering of the kneeling posture and avoids the slightly compressed form “మోకాళ్లూని.”
  terminology: “జనసమూహం,” “ఆయన,” and “మోకాళ్లపై వంగి” fit the narrative’s respectful register. No doctrinal sense beyond the bodily act of kneeling is added.
  issues:
