id: MAT.17.14
reference: Matthew 17:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸀ἐλθόντων πρὸς τὸν ὄχλον προσῆλθεν αὐτῷ ἄνθρωπος γονυπετῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/014.yaml
  text: And when they came to the crowd[a], a man came up to him, kneeling before him[b],
translation:
  language: te
  text: వారు జనసమూహం దగ్గరకు వచ్చినప్పుడు, ఒక మనిషి ఆయన దగ్గరకు వచ్చి, ఆయన ఎదుట మోకాళ్లపై వంగి,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: —
  rationale: తెలుగులో ఈ వాక్యారంభంలో ప్రత్యేకంగా ‘మరియు’ అని పెట్టకుండా కథన ప్రవాహాన్ని సహజంగా కొనసాగించడం ఉత్తమం.
- source_word: ἐλθόντων
  choice: వారు ... వచ్చినప్పుడు
  rationale: సందర్భం ద్వారా తెలిసే బహువచన కర్తతో కూడిన genitive absolute యొక్క కాలార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: πρὸς τὸν ὄχλον
  choice: జనసమూహం దగ్గరికి
  rationale: πρός యొక్క గమనదిశను, ὄχλος యొక్క సమూహార్థాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: προσῆλθεν αὐτῷ
  choice: ఆయన దగ్గరికి వచ్చి
  rationale: ఆ వ్యక్తి యేసును సమీపించిన భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἄνθρωπος
  choice: ఒక వ్యక్తి
  rationale: ఇక్కడ ఒక నిర్దిష్ట మనిషిని సూచిస్తుంది; ‘వ్యక్తి’ ఆధునిక తెలుగులో సహజం, సందర్భంలో అతడు పురుషుడని తరువాతి వచనాల ద్వారా స్పష్టమవుతుంది.
- source_word: γονυπετῶν αὐτὸν
  choice: ఆయన ఎదుట మోకాళ్లూని
  rationale: యేసు ఎదుట మోకాళ్లపై వంగిన శారీరక చర్యను సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: γονυπετῶν సూచించే చర్యలో ఆరాధన భావాన్ని చేర్చాలా
  choice: ఆయన ఎదుట మోకాళ్లూని
  alternative: ఆయనను ఆరాధిస్తూ
  rationale: మూలపదం శారీరకంగా మోకాళ్లపై వంగడాన్ని స్పష్టంగా చెబుతుంది; దానిని తప్పనిసరిగా ఆరాధనగా వ్యాఖ్యానించకుండా మూలంలోని భావవిస్తృతిని నిలుపుతుంది.
- issue: ἄνθρωπος యొక్క లింగ సూచన
  choice: ఒక వ్యక్తి
  alternative: ఒక మనిషి / ఒక పురుషుడు
  rationale: ἄνθρωπος సందర్భంలోని వ్యక్తిని సూచిస్తుంది. తెలుగు ‘వ్యక్తి’ సహజంగా ఉండి, అవసరానికి మించిన లింగ ఉద్ఘాటనను చేయదు; అయినా నిర్దిష్ట వ్యక్తి అనే భావం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన కథన శైలి, అదే సమయంలో గౌరవప్రదమైన సంబోధన. వచనం తరువాతి మాటతో కొనసాగుతున్నందున చివర కామా ఉంచబడింది.
