  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: te
  text: ఇదిగో, మోషే, ఏలీయా ఆయనతో మాట్లాడుతుండగా వారికి కనిపించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిచేత చూడబడ్డారు.’ గ్రీకు క్రియ రూపపరంగా కర్మణి ప్రయోగంలో ఉంది; అయితే తెలుగులో ‘వారికి కనిపించారు’ అనేది మరింత సహజమైన అనువాదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: ఆకస్మికంగా జరిగిన దృశ్యంపై పాఠకుని దృష్టిని మళ్లించే గ్రీకు సంభాషణ సూచక పదం యొక్క బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὤφθη
  choice: కనిపించి
  rationale: ὁράω క్రియ యొక్క భూతకాల కర్మణి రూపం ఇక్కడ దృశ్యంగా ప్రత్యక్షమవడాన్ని సూచిస్తుంది. ‘కనిపించి’ అనేది తెలుగులో సహజంగా ఉండి, ‘వారిచేత చూడబడి’ అనే అసహజ పదశః రూపాన్ని నివారిస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: ఈ దృశ్యాన్ని చూసిన సాక్షులను సూచించే దత్తి విభక్తిని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: Μωϋσῆς
  choice: మోషే
  rationale: ఈ వ్యక్తినామానికి ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపం.
- source_word: Ἠλίας
  choice: ఏలీయా
  rationale: ఈ వ్యక్తినామానికి ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపం.
- source_word: συλλαλοῦντες
  choice: మాట్లాడుతున్నారు
  rationale: ఒకరితో ఒకరు సంభాషించడాన్ని సూచించే వర్తమాన కృదంత భావాన్ని సహజమైన తెలుగు కథన శైలిలో వ్యక్తపరుస్తుంది.
- source_word: μετ’ αὐτοῦ
  choice: ఆయనతో
  rationale: μετά + షష్ఠీ విభక్తి సూచించే సహవాసాన్ని నేరుగా తెలుపుతుంది; సందర్భంలో ఇది యేసును సూచిస్తుంది, అయినా మూలంలోని సర్వనామాన్ని పేరుతో భర్తీ చేయదు.
theological_decisions:
- issue: αὐτοῦ సూచించే వ్యక్తి
  choice: ‘ఆయన’ అనేది యేసును సూచిస్తుంది
  alternative: సర్వనామం స్థానంలో ‘యేసుతో’ అని స్పష్టీకరించడం
  rationale: రూపాంతర దృశ్యపు సమీప సందర్భంలో యేసే స్పష్టమైన సూచితుడు. అయినా మూలపాఠంలోని సర్వనామ రూపాన్ని నిలుపుతూ ‘ఆయనతో’ అని అనువదించబడింది.
- issue: మోషే, ఏలీయా కనిపించిన సంఘటన స్వరూపం
  choice: వారు శిష్యులకు దృశ్యంగా కనిపించారు
  alternative: వారు వారిచేత చూడబడ్డారు
  rationale: వచనం వారి కనిపించడాన్ని కథన వాస్తవంగా తెలియజేస్తుంది; వారి ప్రత్యక్షత ఏ విధంగా సంభవించిందనే అదనపు సిద్ధాంత వివరణను అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, బైబిలు కథనానికి తగిన గౌరవభరిత శైలిలోనూ ఉంది. ‘ఇదిగో’ ద్వారా మూలంలోని ఆకస్మిక దృష్టి-ఆహ్వానాన్ని నిలిపింది; సర్వనామం మరియు కనిపించిన సంఘటన విషయంలో మూలంలోని పరిమితిని దాటి సిద్ధాంత వివరణ చేర్చలేదు.
