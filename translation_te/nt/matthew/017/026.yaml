id: MAT.17.26
reference: Matthew 17:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: te
  text: 'అతడు, “పరాయివారి నుండి,” అని చెప్పినప్పుడు[a], యేసు అతనితో ఇలా అన్నాడు: “అయితే కుమారులు స్వేచ్ఛగలవారు.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని గ్రీకు ప్రతులలో “అతడు చెప్పినప్పుడు” అనే పదబంధం లేదు. “పరాయివారు” అంటే ఇక్కడ రాజు సొంత ఇంటివారు లేదా కుమారులు కానివారు; “ఇతరులు” అని కూడా అనువదించవచ్చు.
    reason: textual_variant; lexical_alternative
  - marker: b
    text: లేదా “కుమారులకు మినహాయింపు ఉంది.” గ్రీకులో అక్షరార్థంగా “కుమారులు స్వేచ్ఛగలవారు” అని ఉంది; ఈ సందర్భంలో అది పన్ను చెల్లించే బాధ్యత నుండి మినహాయింపును సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: అతడు ... అని చెప్పినప్పుడు
  rationale: జనిటివ్ అబ్సల్యూట్ నిర్మాణంలోని కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; δέ సూచించే స్వల్ప కథన మార్పును ప్రత్యేక పదంతో అతిగా అనువదించదు.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: పరాయివారి దగ్గర నుంచి
  rationale: రాజు సొంత కుమారులకు భిన్నంగా, అతని ఇంటివారు కానివారిని సూచించే సంబంధపరమైన వ్యత్యాసాన్ని కాపాడుతుంది; ‘విదేశీయులు’ అనడం వల్ల జాతి లేదా దేశసంబంధ భావం అనవసరంగా బలపడవచ్చు.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: యేసు అతనితో ... అన్నాడు
  rationale: φημί యొక్క సాధారణ కథన వాడుకను సహజంగా, మూలానికి సమీపంగా అందిస్తుంది.
- source_word: Ἄρα γε
  choice: అయితే
  rationale: పేతురు ఇచ్చిన జవాబు నుంచి యేసు తీసుకున్న నిర్ధారణను సహజమైన తెలుగు సంభాషణా శైలిలో సూచిస్తుంది.
- source_word: ἐλεύθεροί
  choice: స్వతంత్రులే
  rationale: మూలంలోని ‘స్వతంత్రులు/స్వేచ్ఛగలవారు’ అనే విస్తృత పదబలాన్ని నిలుపుతూ, సందర్భంలో పన్ను చెల్లించే బాధ్యత నుంచి మినహాయింపు ఉన్నదనే భావాన్ని పాఠకుడు గ్రహించేలా చేస్తుంది.
- source_word: οἱ υἱοί
  choice: కుమారులు
  rationale: గ్రీకు మూలంలోని స్పష్టమైన పుంలింగ బహువచనాన్ని, రాజు కుమారులు–పరాయివారు అనే గృహ/చట్టపరమైన వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: రాజు ఇంటివారిని ప్రతినిధిగా సూచించగల సందర్భంలో οἱ υἱοί అనువాదం
  choice: కుమారులు
  alternative: పిల్లలు
  rationale: మూలపాఠం పుంలింగ బహువచనమైన υἱοί అనే పదాన్ని వాడుతుంది; తక్షణ ఉపమానం రాజు కుమారులు పన్ను చెల్లించాలా అనే విషయమే. అందువల్ల వచనాన్ని విస్తరించకుండా కుమారత్వపు భావాన్ని నిలుపుతుంది.
- issue: ἐλεύθεροί అనే పదంలోని స్వేచ్ఛ మరియు పన్ను మినహాయింపు మధ్య సంబంధం
  choice: స్వతంత్రులే
  alternative: పన్ను నుంచి మినహాయింపుపొందినవారే
  rationale: సందర్భం పన్ను బాధ్యతను సూచించినప్పటికీ, మూలపదం కేవలం సాంకేతిక పన్ను మినహాయింపుకన్నా విస్తృతమైన ‘స్వతంత్రులు’ అనే భావాన్ని కలిగి ఉంది. ఆ భావవిస్తృతిని పాఠ్యంలో నిలిపి, సందర్భార్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పరాయివారు’ ద్వారా ఇంటివారు–బయటివారు అనే సంబంధపరమైన వ్యత్యాసం, ‘కుమారులు’ ద్వారా మూలంలోని లింగం మరియు కుమారత్వ భావం, ‘స్వతంత్రులే’ ద్వారా మూలపద విస్తృతి నిలుపబడ్డాయి.
