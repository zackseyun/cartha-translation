source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “మీ అల్పవిశ్వాసం వల్ల.[a] నిజంగా నేను మీతో చెబుతున్నాను: మీకు ఆవగింజంత విశ్వాసం ఉంటే,[b] మీరు ఈ కొండతో, ‘ఇక్కడి నుంచి అక్కడికి వెళ్లు’ అని చెబుతారు; అది వెళ్తుంది. మీకు అసాధ్యమైనది ఏదీ ఉండదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీ విశ్వాసం తక్కువగా ఉండటం వల్ల’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం సంపూర్ణ అవిశ్వాసాన్ని కాక, తక్కువగా లేదా లోపభూయిష్టంగా ఉన్న విశ్వాసాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆవగింజవలె విశ్వాసం ఉంటే.’ ఈ పోలిక చాలా చిన్నదైన దానిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథనశైలిలో భూతకాల రూపం సహజంగా ఉండి అదే సంఘటనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: మీ అల్పవిశ్వాసం వల్లనే
  rationale: ὀλιγοπιστία సంపూర్ణ అవిశ్వాసాన్ని కాక, కొరవడిన లేదా తక్కువైన విశ్వాసాన్ని సూచిస్తుంది; ‘అల్పవిశ్వాసం’ ఆ భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: ἀμὴν
  choice: నిజంగా
  rationale: యేసు గంభీరంగా, నిశ్చయంగా చెప్పే మాటను పరిచయం చేసే ఈ పదానికి ఆధునిక తెలుగులో ‘నిజంగా’ సహజమైన సమానార్థకం.
- source_word: πίστιν
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో దేవుని శక్తిపై నమ్మకాన్ని సూచిస్తుంది; ‘విశ్వాసం’ theological specificityని అతిగా పరిమితం చేయకుండా సాధారణంగా అర్థమయ్యే రూపం.
- source_word: ὡς κόκκον σινάπεως
  choice: ఆవగింజంత
  rationale: చాలా చిన్నదైన ఆవగింజతో చేసిన పోలికను సహజమైన తెలుగు పరిమాణప్రయోగంతో అందిస్తుంది.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: ఇక్కడి నుంచి అక్కడికి వెళ్లు
  rationale: కొండను నేరుగా ఉద్దేశించిన ఆజ్ఞను సరళంగా, సజీవంగా వ్యక్తపరుస్తుంది.
- source_word: μεταβήσεται
  choice: అది వెళ్తుంది
  rationale: భవిష్యత్ మధ్యమ రూపం ఇక్కడ అకర్మక భావంలో కొండ తానే స్థానం మారుతుందని సూచిస్తుంది.
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: మీకు అసాధ్యమైనది ఏదీ ఉండదు
  rationale: గ్రీకు నుడికారంలోని సంబంధార్థాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: అద్భుత కార్యాల సందర్భంలో πίστις భావం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఇక్కడ శిష్యులకు దేవుని శక్తిపై ఉన్న కొరవడిన నమ్మకమే సందర్భం; రక్షణకు సంబంధించిన ఒక ప్రత్యేక సిద్ధాంతార్థాన్నిగానీ, ‘విశ్వసనీయత’ అనే గుణాన్నిగానీ వాక్యంలోకి దిగుమతి చేయకుండా ‘విశ్వాసం’ అని ఉంచబడింది.
- issue: కొండను కదిలించడం అనే మాట యొక్క పరిధి
  choice: మూలంలోని బలమైన రూపకల్పనను యథాతథంగా ఉంచడం
  alternative: కేవలం కష్టాలను అధిగమించడం అని వివరణాత్మకంగా మార్చడం
  rationale: వాక్యం నిజమైన కొండను ఉద్దేశించిన భాషను ఉపయోగిస్తుంది; అది అక్షరార్థమా, అతిశయోక్తియా, రూపకమా అనే theological tensionను అనువాదంలో ముందుగానే తీర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే యేసు మాటలకు తగిన గంభీరతను నిలుపుకుంది. ప్రారంభంలోని δέను బలమైన విరోధార్థక ‘కాని’గా కాక, సంభాషణకు ప్రతిస్పందనను చూపే ‘అందుకు’గా అనువదించింది.
