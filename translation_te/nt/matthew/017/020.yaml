- from: 'అందుకు ఆయన వారితో, “మీ అల్పవిశ్వాసం వల్లనే.[a] నేను మీతో నిజంగా చెబుతున్నాను: మీకు ఆవగింజంత విశ్వాసం ఉంటే,[b] మీరు ఈ కొండతో, ‘ఇక్కడి నుంచి అక్కడికి వెళ్లు’ అని చెబుతారు; అది వెళ్తుంది. మీకు అసాధ్యమైనది ఏదీ ఉండదు” అన్నాడు.'
