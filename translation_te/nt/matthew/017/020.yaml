review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the key Greek elements: deficient rather than absent faith (ὀλιγοπιστία), the mustard-seed comparison, the command to the mountain, its consequent movement, and the idiom that nothing will be impossible for the disciples. The past-tense narrative verb is an acceptable natural Telugu rendering of the Greek historical present.'
  naturalness: The opening construction “అందుకు ఆయన వారితో, … అన్నాడు” is slightly incomplete and awkward in modern standard Telugu because the quoted speech is inserted between a postposition phrase and its governing verb. Recasting it with “ఇలా అన్నాడు:” produces clear, idiomatic narration. “నిజంగా నేను మీతో చెబుతున్నాను” is also more natural Telugu word order for the solemn formula.
  terminology: “అల్పవిశ్వాసం,” “విశ్వాసం,” “ఆవగింజంత,” and “అసాధ్యమైనది” are accurate, clear, and suitably dignified. The explanatory footnotes preserve the lexical distinction from complete unbelief without imposing a theological interpretation.
  issues:
  - severity: low
    issue: Awkward opening syntax
    rationale: “అందుకు ఆయన వారితో, … అన్నాడు” separates “వారితో” from “అన్నాడు” by the entire quotation. “ఆయన వారితో ఇలా అన్నాడు:” is idiomatic and preserves the narrative response without making δέ an overly adversative ‘కాని’.
  - severity: low
    issue: Footnote a’s alternative can be clearer
    rationale: “విశ్వాసం కొరవడినందువల్లనే” may sound like faith is wholly absent. “మీ విశ్వాసం తక్కువగా ఉండటం వల్ల” more directly communicates the Greek sense of insufficient/small faith.
  revised_text: 'ఆయన వారితో ఇలా అన్నాడు: “మీ అల్పవిశ్వాసం వల్ల.[a] నిజంగా నేను మీతో చెబుతున్నాను: మీకు ఆవగింజంత విశ్వాసం ఉంటే,[b] మీరు ఈ కొండతో, ‘ఇక్కడి నుంచి అక్కడికి వెళ్లు’ అని చెబుతారు; అది వెళ్తుంది. మీకు అసాధ్యమైనది ఏదీ ఉండదు.”'
