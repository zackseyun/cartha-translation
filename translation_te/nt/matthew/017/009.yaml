id: MAT.17.9
reference: Matthew 17:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: te
  text: 'వారు కొండనుండి దిగివస్తుండగా, యేసు వారికి ఇలా ఆజ్ఞాపించాడు: “మనుష్యకుమారుడు మృతులలోనుండి[b] లేపబడే వరకు ఈ దర్శనాన్ని[a] ఎవరికీ చెప్పకండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు చూసినదాన్ని.” గ్రీకులో “దర్శనం” అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: మరింత అక్షరార్థంగా, “చనిపోయినవారి మధ్యనుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: వారు కొండ మీదనుంచి దిగుతుండగా
  rationale: జెనిటివ్ అబ్సల్యూట్‌లోని వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలంలో కొనసాగుతున్న చర్యను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: యేసు వారికి ఇలా ఆజ్ఞాపించాడు
  rationale: ἐνετείλατο లోని బలమైన ఆదేశ భావాన్ని ‘ఆజ్ఞాపించాడు’ నిలుపుతుంది; λέγων ను తెలుగులో సహజమైన ప్రత్యక్ష వాక్య పరిచయం ‘ఇలా’ ద్వారా వ్యక్తం చేశాం.
- source_word: Μηδενὶ εἴπητε
  choice: ఎవరికీ చెప్పకండి
  rationale: నిషేధ ఆజ్ఞను సహజమైన, గౌరవసూచక బహువచన తెలుగు రూపంలో స్పష్టంగా అందిస్తుంది.
- source_word: τὸ ὅραμα
  choice: ఈ దర్శనాన్ని
  rationale: ὅραμα లోని దర్శనాత్మక లేదా ప్రకటనాత్మక ఛాయను ‘దర్శనం’ నిలుపుతుంది; సందర్భంలో ఇప్పుడే జరిగిన దృశ్యాన్ని సూచించేందుకు తెలుగు సహజత్వం కోసం ‘ఈ’ వాడాం.
- source_word: ἕως οὗ
  choice: వరకు
  rationale: ఆ నిషేధం అమలులో ఉండే కాలపరిమితిని సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు వాడిన ఈ ప్రత్యేక స్వీయపదవిని పారాఫ్రేజ్ చేయకుండా, దాని దానియేలు గ్రంథ సంబంధిత మరియు దైవశాస్త్రీయ ప్రతిధ్వనులను నిలుపుతుంది.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: ἐκ యొక్క ‘మధ్యనుండి/లోనుండి’ భావాన్ని, బహువచన νεκρῶν ను సన్నిహితంగా ప్రతిబింబిస్తుంది; తెలుగులోనూ అర్థవంతంగా ఉంటుంది.
- source_word: ἐγερθῇ
  choice: లేపబడే
  rationale: అయోరిస్ట్ పాసివ్ సబ్జంక్టివ్‌లోని కర్మణి ప్రయోగాన్ని నిలుపుతూ, కార్యసాధకుడు ఎవరో వాక్యంలో అదనంగా పేర్కొనదు.
theological_decisions:
- issue: పునరుత్థాన క్రియలో కర్మణి ప్రయోగం
  choice: లేపబడే
  alternative: తిరిగి లేచే
  rationale: గ్రీకు ἐγερθῇ కర్మణి రూపంలో ఉంది. ‘లేపబడే’ ఆ వ్యాకరణ రూపాన్ని, సూచిత దైవకార్య భావాన్ని నిలుపుతుంది; అయితే కార్యసాధకుడిని మూలం కంటే స్పష్టంగా చేర్చదు.
- issue: ὅραμα యొక్క దర్శనాత్మక భావం
  choice: ఈ దర్శనాన్ని
  alternative: మీరు చూసినదాన్ని
  rationale: ‘దర్శనం’ మూలపదంలోని ప్రకటనాత్మక ఛాయను నిలుపుతుంది. ‘మీరు చూసినదాన్ని’ సహజమైన ప్రత్యామ్నాయం అయినా ఆ ఛాయను కొంత తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించాం. ‘మనుష్యకుమారుడు,’ ‘దర్శనం,’ ‘లేపబడే’ వంటి పదాలు మూలంలోని ప్రత్యేక దైవశాస్త్రీయ మరియు వ్యాకరణ లక్షణాలను నిలుపుతాయి. ఆంగ్ల సంప్రదింపు పాఠంలో పాదసూచిక గుర్తులు వాటి విషయాలకు సరిపోని స్థానాల్లో కనిపించినందున, తెలుగులో [a] ను ‘దర్శనం’ వద్ద, [b] ను ‘మృతులలోనుండి’ వద్ద ఉంచాం.
