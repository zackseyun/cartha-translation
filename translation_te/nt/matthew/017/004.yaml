id: MAT.17.4
reference: Matthew 17:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: te
  text: అప్పుడు పేతురు యేసుతో, “ప్రభువా, మనం ఇక్కడ ఉండడం మంచిది. నీకు ఇష్టమైతే, ఇక్కడ మూడు గుడారాలు[a] వేస్తాను—నీకు ఒకటి, మోషేకు ఒకటి, ఏలీయాకు ఒకటి” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పర్ణశాలలు,” “తాత్కాలిక ఆశ్రయాలు.” గ్రీకు పదం తాత్కాలిక నివాస నిర్మాణాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν
  choice: అప్పుడు పేతురు … అన్నాడు
  rationale: గ్రీకు భాషలోని ‘జవాబిచ్చి చెప్పాడు’ అనే కథన సూత్రాన్ని తెలుగులో సహజమైన మాటల పరిచయంగా అందించింది. δὲ ఇక్కడ వ్యతిరేకతకన్నా కథన పురోగతిని సూచిస్తుంది.
- source_word: τῷ Ἰησοῦ
  choice: యేసుతో
  rationale: మాట ఎవరిని ఉద్దేశించి చెప్పబడిందో సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: గౌరవపూర్వక సంబోధనను, అలాగే ఈ బిరుదులో ఉండగల దైవశాస్త్రీయ ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: మనం ఇక్కడ ఉండడం మంచిది
  rationale: గ్రీకు infinitival నిర్మాణ భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰ θέλεις
  choice: నీకు ఇష్టమైతే
  rationale: θέλω సూచించే కోరిక లేదా సమ్మతిని గౌరవపూర్వకంగా, సహజంగా అందిస్తుంది.
- source_word: ποιήσω
  choice: వేస్తాను
  rationale: తాత్కాలిక గుడారాలను నిర్మించడం లేదా ఏర్పాటు చేయడం అనే సందర్భంలో ‘గుడారాలు వేయడం’ సహజమైన తెలుగు ప్రయోగం; ఏకవచన కర్తను అనుసరించి పేతురే చేస్తానని చెప్పిన భావాన్ని నిలుపుతుంది.
- source_word: σκηνάς
  choice: గుడారాలు
  rationale: σκηνή యొక్క గుడారం లేదా తాత్కాలిక నివాసం అనే ప్రాథమిక అర్థాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది; పండుగ సంబంధమైన భావాన్ని ప్రధాన పాఠ్యంలో నిర్బంధంగా చేర్చదు.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: నీకు ఒకటి, మోషేకు ఒకటి, ఏలీయాకు ఒకటి
  rationale: గ్రీకులో μίαν పదం మూడుసార్లు రావడం వల్ల కలిగే పంపిణీ ప్రాధాన్యాన్ని ‘ఒకటి’ అనే పదాన్ని పునరావృతం చేసి నిలుపుతుంది.
theological_decisions:
- issue: యేసును ఉద్దేశించిన κύριος బిరుదు
  choice: ప్రభువా
  alternative: బోధకుడా / యజమానీ
  rationale: ‘ప్రభువు’ గౌరవార్థాన్ని మాత్రమే కాకుండా సాధ్యమైన దైవశాస్త్రీయ బరువును కూడా నిలుపుతుంది; సందర్భం అనుమతించే అర్థాన్ని కేవలం మర్యాదా సంబోధనగా కుదించదు.
- issue: రూపాంతర సందర్భంలో σκηνάς అర్థం
  choice: గుడారాలు
  alternative: పర్ణశాలలు / తాత్కాలిక ఆశ్రయాలు
  rationale: వాక్యం ఈ నిర్మాణాలను పర్ణశాలల పండుగతో స్పష్టంగా సమీకరించదు. అందువల్ల ప్రధాన పాఠ్యంలో తటస్థమైన పదాన్ని వాడి, ఇతర సాధ్యమైన అర్థాలను పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ. గ్రీకు వాక్యంలోని ‘ఇక్కడ’ పునరుక్తిని రెండుచోట్లా నిలిపి, ప్రతి వ్యక్తికి ‘ఒకటి’ అనే పంపిణీ ప్రాధాన్యాన్ని కాపాడింది.
