source:
  edition: SBLGNT
  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: te
  text: ఆయన వారి ఎదుట రూపాంతరం చెందాడు[a]. ఆయన ముఖం సూర్యునిలా ప్రకాశించింది; ఆయన వస్త్రాలు వెలుగులా తెల్లగా అయ్యాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన రూపం మారింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: μετεμορφώθη
  choice: రూపాంతరం చెందాడు
  rationale: μεταμορφόομαι యొక్క భూతకాల కర్మణి రూపం. కనిపించే విధంగా రూపం మారిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కర్మణి భావాన్ని తెలుగులో సహజంగా ఉండే అకర్మక నిర్మాణంతో వ్యక్తం చేసింది.
- source_word: ἔμπροσθεν αὐτῶν
  choice: వారి ఎదుట
  rationale: సంఘటన శిష్యుల సమక్షంలో జరిగిందనే స్థల/సమక్ష భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἔλαμψεν
  choice: ప్రకాశించింది
  rationale: λάμπω తెలిపే వెలిగే లేదా కాంతిని ప్రసరించే భావానికి సహజమైన ప్రత్యక్ష సమానం.
- source_word: πρόσωπον
  choice: ముఖం
  rationale: ఇక్కడ యేసు భౌతిక ముఖాన్నే సూచిస్తుంది.
- source_word: ὡς ὁ ἥλιος
  choice: సూర్యునిలా
  rationale: ὡς తెలిపే స్పష్టమైన ఉపమానాన్ని కాపాడుతుంది.
- source_word: ἱμάτια
  choice: వస్త్రాలు
  rationale: దుస్తులను సూచించే సాధారణ పదం; సందర్భానికి తగిన గౌరవభరితమైన ఆధునిక తెలుగు.
- source_word: ἐγένετο λευκὰ
  choice: తెల్లగా అయ్యాయి
  rationale: స్థితిలో వచ్చిన మార్పును నేరుగా తెలియజేస్తుంది; మూలంలో లేని అదనపు తీవ్రతను చేర్చదు.
- source_word: ὡς τὸ φῶς
  choice: వెలుగులా
  rationale: φῶς‌తో చేసిన ఉపమానాన్ని విశేషణంగా కుదించకుండా నిలుపుతుంది; తెలుగులో సహజంగా ఉంటుంది.
theological_decisions:
- issue: రూపాంతర సంఘటనకు వాడిన పదం
  choice: రూపాంతరం చెందాడు
  alternative: రూపం మారింది
  rationale: కనిపించే మహిమాపూర్వక మార్పును సూచిస్తూ, మూలంలోని విస్తృత పదార్థాన్ని నిలుపుతుంది; సంఘటన గురించి మూలం చెప్పనిదేదీ సిద్ధాంతపరంగా జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా వాక్య గౌరవాన్ని నిలుపుతూ అనువదించబడింది. గ్రీకు వాక్యంలోని వరుస ‘మరియు’లను తెలుగులో సహజమైన వాక్య విభజన, అర్ధవిరామంతో అందించింది.
