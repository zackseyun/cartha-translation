  source_fidelity: 'గ్రీకు మూలవాక్యంలోని ప్రధాన అంశాలన్నీ విశ్వసనీయంగా ప్రతిఫలించాయి: యేసు వారి సమక్షంలో రూపాంతరం చెందడం, ముఖం సూర్యునివలె ప్రకాశించడం, వస్త్రాలు వెలుగువలె తెల్లగా కావడం. ‘రూపాంతరం చెందాడు’ అనేది μετεμορφώθη యొక్క కనిపించే మార్పు భావాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది; తెలుగులో గ్రీకు కర్మణి రూపాన్ని యాంత్రికంగా అనుకరించకపోవడం సహజం. ‘వెలుగులా తెల్లగా అయ్యాయి’ ἐγένετο λευκὰ ὡς τὸ φῶς లోని స్థితిమార్పును, ఉపమానాన్ని రెండింటినీ కాపాడుతుంది.'
  naturalness: వాక్యం ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంది. అర్థవిరామంతో రెండవ భాగాన్ని వేరుచేయడం గ్రీకు వరుస సంధులను తెలుగు శైలికి తగినట్లుగా అందిస్తుంది. ‘వారి ఎదుట,’ ‘సూర్యునిలా,’ ‘వెలుగులా’ అన్న ప్రయోగాలు సహజమైనవి.
  terminology: ‘రూపాంతరం,’ ‘ముఖం,’ ‘వస్త్రాలు,’ ‘ప్రకాశించింది’ అనే పదాలు సందర్భానికి, రిజిస్టర్‌కు తగినవి. ‘రూపాంతరం’ చారిత్రకంగా పరిచితమైన పదమైనప్పటికీ, మూలం కంటే ఎక్కువ సిద్ధాంతార్థాన్ని జోడించదు. ప్రత్యామ్నాయ పాదటిప్పణి ‘ఆయన రూపం మారింది’ అర్థపరంగా సముచితమైన విస్తృత ప్రత్యామ్నాయాన్ని ఇస్తుంది.
