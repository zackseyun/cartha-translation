id: MAT.17.18
reference: Matthew 17:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: te
  text: యేసు దానిని గద్దించాడు. అప్పుడు ఆ దయ్యం అతనిలో నుంచి బయటికి వచ్చింది; ఆ బాలుడు ఆ సమయం నుంచే[a] స్వస్థత పొందాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆ క్షణం నుంచే.’ అక్షరార్థంగా, ‘ఆ గంట నుంచే.’
    reason: ὥρα అనే పదం ‘గంట’ అని అక్షరార్థంగా ఉన్నప్పటికీ, ఈ సందర్భంలో ‘సమయం’ లేదా ‘క్షణం’ అనే భావంలో కూడా అర్థం కావచ్చు.
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: గద్దించాడు
  rationale: ఈ క్రియలో కఠినంగా మందలించడం, అధికారంతో అదుపుచేయడం అనే భావం ఉంది. దయ్యాన్ని వెళ్లగొట్టే సందర్భంలో ‘గద్దించాడు’ సహజంగా ఉండి, మూలంలోని బలాన్ని కాపాడుతుంది.
- source_word: αὐτῷ
  choice: దానిని
  rationale: గ్రీకు సర్వనామం సందర్భానుసారంగా బాలుణ్ణి లేదా దయ్యాన్ని సూచించగలదు. వెంటనే దయ్యం అతనిలో నుంచి బయటికి వచ్చిందని చెప్పడం వల్ల, ఇక్కడ దయ్యమే ఉద్దేశమని సందర్భం బలంగా సూచిస్తుంది. తెలుగులో దయ్యాన్ని సూచించడానికి ‘దానిని’ సహజం.
- source_word: τὸ δαιμόνιον
  choice: ఆ దయ్యం
  rationale: δαιμόνιονకు నేరుగా, సాధారణ పాఠకులకు అర్థమయ్యే సమానార్థకం ‘దయ్యం’. ‘అపవిత్రాత్మ’ అనే పదబంధం ఈ వచనంలో లేని మాటను చేర్చుతుంది.
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: అతనిలో నుంచి బయటికి వచ్చింది
  rationale: ఇది దయ్యం పట్టిన వ్యక్తి నుంచి దయ్యం నిష్క్రమించడాన్ని స్పష్టంగా తెలిపే వాక్యప్రయోగం. మూలంలోని దృశ్యమయమైన భావాన్ని కాపాడుతుంది.
- source_word: ἐθεραπεύθη
  choice: స్వస్థత పొందాడు
  rationale: క్రియ యొక్క కర్మణి రూపం బాలుడు స్వస్థపరచబడ్డ ఫలితాన్ని సూచిస్తుంది. ‘స్వస్థత పొందాడు’ ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: ὁ παῖς
  choice: ఆ బాలుడు
  rationale: παῖς అనే పదానికి బిడ్డ, బాలుడు, సేవకుడు అనే అర్థాలు ఉండవచ్చు. సమీప సందర్భంలో తండ్రి కుమారుని గురించి ఉన్నందున ‘ఆ బాలుడు’ తగినది.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: ఆ సమయం నుంచే
  rationale: ὥρα అక్షరార్థంగా ‘గంట’ అయినప్పటికీ, ఇక్కడ ఒక నిర్దిష్ట సమయబిందువును సూచించగలదు. ‘ఆ సమయం నుంచే’ మూలార్థాన్ని కాపాడుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది; తక్షణత్వాన్ని తెలిపే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: యేసు గద్దించినది ఎవరిని అనే αὐτῷ సర్వనామపు సూచన
  choice: దయ్యాన్ని—‘దానిని’
  alternative: బాలుణ్ణి
  rationale: గ్రీకు రూపం వ్యాకరణపరంగా రెండు సూచనలకు అవకాశం ఇచ్చినా, తదుపరి వాక్యంలో ‘దయ్యం అతనిలో నుంచి బయటికి వచ్చింది’ అని ఉండటం యేసు దయ్యాన్నే గద్దించాడనే పఠనాన్ని బలంగా సమర్థిస్తుంది. బాలుణ్ణి గద్దించాడనే భావాన్ని అనవసరంగా కలిగించకుండా సందర్భానుసారమైన పఠనం ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. చిన్న చిన్న వాక్యాలతో సంఘటనల క్రమం స్పష్టంగా ఉంచబడింది; మూలంలోని ‘దయ్యం’, ‘బాలుడు’, ‘స్వస్థత’ అనే భేదాలు నిలుపబడ్డాయి.
