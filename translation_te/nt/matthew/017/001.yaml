id: MAT.17.1
reference: Matthew 17:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: te
  text: ఆరు రోజుల తర్వాత యేసు పేతురును, యాకోబును, అతని సోదరుడైన యోహానును తనతో పాటు తీసుకుంటాడు; వారిని ఒక ఎత్తైన కొండపైకి విడిగా తీసుకువెళ్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఏకాంతంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: ఆరు రోజుల తర్వాత
  rationale: μετά + accusative ఇక్కడ కాలానంతర భావాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆరు రోజుల తర్వాత’ సహజంగా ఉండి, ముందటి సంఘటనతో కథన సంబంధాన్ని నిలుపుతుంది.
- source_word: παραλαμβάνει
  choice: తన వెంట తీసుకొని
  rationale: παραλαμβάνω అంటే తనతోపాటు లేదా తన వెంట తీసుకువెళ్లడం. ‘తన వెంట తీసుకొని’ అనే రూపం కేవలం ‘తీసుకొని’ కంటే మూలంలోని సహవాస భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: పేతురును, యాకోబును, ... యోహానును
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తి పేర్ల రూపాలను ఉపయోగించాం.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: అతని సోదరుడైన
  rationale: ఈ పదబంధం అత్యంత సహజంగా యోహాను యాకోబు సోదరుడని గుర్తిస్తుంది. ‘అతని’ అని ఉంచడం ద్వారా గ్రీకు సర్వనామ రూపాన్ని అతిగా విప్పకుండా నిలుపుతుంది.
- source_word: ἀναφέρει
  choice: కొండ మీదికి తీసుకెళ్తాడు
  rationale: ἀναφέρω ఇక్కడ పైకి తీసుకెళ్లడం అనే భావాన్ని ఇస్తుంది. గమ్యాన్ని సూచించే ‘మీదికి’తో కలిపి ఇది తెలుగులో సహజంగా ఉంటుంది.
- source_word: εἰς ὄρος ὑψηλὸν
  choice: ఒక ఎత్తైన కొండ మీదికి
  rationale: εἰς కదలిక యొక్క గమ్యాన్ని సూచిస్తుంది; ‘కొండ మీదికి’ ఆరోహణను, గమ్యాన్ని రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: κατ’ ἰδίαν
  choice: వారిని మాత్రమే
  rationale: ఈ సందర్భంలో ఆ ముగ్గురు శిష్యులను ఇతరుల నుంచి వేరుగా తీసుకెళ్లాడనే భావం ఉంది. ‘వారిని మాత్రమే’ సాధారణ ఆధునిక తెలుగులో ఆ ప్రత్యేకతను స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సువార్త కథనంలోని చారిత్రక వర్తమాన కాల క్రియలు
  choice: ‘తీసుకెళ్తాడు’ అనే వర్తమాన కథన రూపాన్ని నిలుపడం
  alternative: ‘తీసుకెళ్లాడు’ అనే భూతకాల రూపానికి మార్చడం
  rationale: గ్రీకులో παραλαμβάνει, ἀναφέρει రెండూ కథనానికి సజీవతనిచ్చే వర్తమాన కాలంలో ఉన్నాయి. తెలుగు కథనంలో చివరి పరిమిత క్రియను వర్తమానంలో ఉంచడం ద్వారా ఆ ప్రభావాన్ని సహజంగా నిలుపవచ్చు.
- issue: τὸν ἀδελφὸν αὐτοῦ లో బంధుత్వ సూచన
  choice: ‘అతని సోదరుడైన యోహాను’ అని, సర్వనామాన్ని నిలుపడం
  alternative: ‘యాకోబు సోదరుడైన యోహాను’ అని సూచ్యనామాన్ని స్పష్టం చేయడం
  rationale: సందర్భంలో ‘అతని’ అనేది యాకోబును సూచించడం అత్యంత సహజం. అయినా మూలంలో ఉన్న సర్వనామాన్ని పేరుతో భర్తీ చేయకుండా ఉంచడం ద్వారా దాని వ్యాకరణ రూపాన్ని, స్వల్ప అనుసంధాన అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సోదరుడు’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; ‘ఎత్తైన కొండ’ మూలంలోని సాధారణ భౌగోళిక పదజాలాన్ని అతిశయింపజేయదు. ప్రధాన వాక్యంలో ఒక్క పరిమిత క్రియతో గ్రీకు వాక్య ప్రవాహాన్ని తెలుగులో సులభంగా చదవగల రూపంలో నిలిపాం.
