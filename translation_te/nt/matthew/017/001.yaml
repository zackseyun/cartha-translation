revisions:
- from: ఆరు రోజుల తర్వాత యేసు పేతురును, యాకోబును, అతని సోదరుడైన యోహానును తన వెంట తీసుకొని, వారిని మాత్రమే ఒక ఎత్తైన కొండ మీదికి తీసుకెళ్తాడు.[a]
  to: ఆరు రోజుల తర్వాత యేసు పేతురును, యాకోబును, అతని సోదరుడైన యోహానును తనతో పాటు తీసుకుంటాడు; వారిని ఒక ఎత్తైన కొండపైకి విడిగా తీసుకువెళ్తాడు.[a]
  rationale: The revision preserves the historical-present verbs as coordinate Telugu finite verbs and replaces the potentially restrictive ‘వారిని మాత్రమే’ with ‘విడిగా,’ which better represents the source phrase’s sense of privacy/separation. The pronoun in ‘అతని సోదరుడైన యోహాను’ remains unexpanded, retaining the source wording and its slight syntactic ambiguity.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:22Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the six-day interval, the three named disciples, the ascent to a high mountain, and the historical-present narrative. However, ‘వారిని మాత్రమే’ (“only them”) shifts κατ’ ἰδίαν toward an exclusive-object emphasis rather than its primary sense of being apart/in private. The two Greek narrative verbs are also better represented as two finite Telugu verbs.
  naturalness: The wording is generally modern and clear. Using ‘తనతో పాటు తీసుకుంటాడు’ and then ‘తీసుకువెళ్తాడు’ gives a more natural, balanced Telugu narrative sentence and avoids making the first action merely subordinate.
  terminology: The established Telugu biblical forms పేతురు, యాకోబు, and యోహాను are appropriate. ‘సోదరుడైన’ is clear and preserves the Greek pronoun without needlessly resolving it as ‘యాకోబు సోదరుడు.’ ‘విడిగా’ naturally conveys the contextual sense of κατ’ ἰδίαν without importing a stronger claim than the Greek.
  issues:
  - severity: medium
    issue: ‘వారిని మాత్రమే’ for κατ’ ἰδίαν
    rationale: This can mean “only them” and focuses on whom Jesus selected. κατ’ ἰδίαν primarily denotes being apart, privately, or by themselves. ‘విడిగా’ better retains that adverbial sense.
  - severity: low
    issue: The first historical-present verb is rendered as a participle
    rationale: ‘తన వెంట తీసుకొని’ is understandable, but παραλαμβάνει and ἀναφέρει are coordinate present verbs. Two finite verbs more directly preserve the source’s narrative movement and vivid present.
  - severity: low
    issue: The current footnote gives a full-clause alternative rather than a focused alternative for the anchored expression
    rationale: A concise alternative for ‘విడిగా’ is clearer and accurately identifies the lexical range of κατ’ ἰδίαν.
  revised_text: ఆరు రోజుల తర్వాత యేసు పేతురును, యాకోబును, అతని సోదరుడైన యోహానును తనతో పాటు తీసుకుంటాడు; వారిని ఒక ఎత్తైన కొండపైకి విడిగా తీసుకువెళ్తాడు.[a]
  revised_footnotes:
  - marker: a
    text: లేదా, ‘ఏకాంతంగా.’
    reason: lexical_alternative
  revision_rationale: The revision preserves the historical-present verbs as coordinate Telugu finite verbs and replaces the potentially restrictive ‘వారిని మాత్రమే’ with ‘విడిగా,’ which better represents the source phrase’s sense of privacy/separation. The pronoun in ‘అతని సోదరుడైన యోహాను’ remains unexpanded, retaining the source wording and its slight syntactic ambiguity.
