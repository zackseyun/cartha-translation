id: MAT.17.17
reference: Matthew 17:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: te
  text: 'అప్పుడు యేసు ఇలా జవాబిచ్చాడు: “విశ్వాసంలేని[a], వక్రమైన[b] తరమా! నేను ఎంతకాలం మీతో ఉంటాను? ఎంతకాలం మిమ్మల్ని సహిస్తాను? అతణ్ణి ఇక్కడికి నా దగ్గరకు తీసుకురండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నమ్మని.” గ్రీకు పదం “విశ్వాసంలేని” లేదా “నమ్మని/విశ్వాసంగా లేని” అనే భావాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దారి తప్పిన,” “చెడిపోయిన.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: అప్పుడు యేసు ఇలా జవాబిచ్చాడు
  rationale: ἀποκριθείς ... εἶπεν అనే గ్రీకు జవాబు-చెప్పుట ప్రయోగాన్ని సహజమైన తెలుగులో ‘ఇలా జవాబిచ్చాడు’గా ఇచ్చాం; δέ ఇక్కడ కథన మార్పును సూచించేందున ‘అప్పుడు’ అనుకూలం.
- source_word: Ὦ γενεὰ
  choice: తరమా!
  rationale: Ὦ యొక్క భావోద్వేగ సంబోధనను ప్రత్యేకంగా ‘ఓ’ అని యాంత్రికంగా ఉంచకుండా, తెలుగు సంబోధన ప్రత్యయం ‘-మా’ మరియు ఆశ్చర్యార్థక చిహ్నంతో తెలిపాం; γενεάకు ‘తరం’ మూలార్థాన్ని, ప్రవచనాత్మక ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ἄπιστος
  choice: విశ్వాసంలేని
  rationale: సందర్భంలో శిష్యుల విశ్వాసలోపం ప్రధానంగా ఉండటంతో ‘విశ్వాసంలేని’ సహజంగా, నేరుగా ఉంది; అయితే ‘నమ్మకంలేని’ అనే భావసాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: διεστραμμένη
  choice: వక్రమైన
  rationale: διαστρέφω యొక్క వక్రీకరించబడిన లేదా దారి తప్పిన స్థితిని ‘వక్రమైన’ సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది; అతిగా ఆధునిక లైంగిక ఛాయ కలిగే పదాలను నివారిస్తుంది.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: నేను ఎంతకాలం మీతో ఉంటాను?
  rationale: భవిష్యత్ క్రియను, వాక్యంలోని అలంకారప్రశ్నను నేరుగా నిలిపే సహజ తెలుగు రూపం.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: ఎంతకాలం మిమ్మల్ని సహిస్తాను?
  rationale: ἀνέχομαιలోని భరించడం లేదా ఓర్చుకోవడం అనే భావాన్ని గంభీరమైన, సహజమైన తెలుగులో ‘సహిస్తాను’గా ఇచ్చాం.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: అతణ్ణి ఇక్కడికి, నా దగ్గరకు తీసుకురండి
  rationale: φέρετε ఆజ్ఞను ‘తీసుకురండి’గా, μοι మరియు ὧδε రెండింటినీ ‘ఇక్కడికి, నా దగ్గరకు’గా స్పష్టంగా ప్రతిబింబించాం; αὐτόν సందర్భంలోని బాలుణ్ణి సూచిస్తుంది.
theological_decisions:
- issue: ἄπιστος అనే విశేషణం విశ్వాసలేమా లేక నమ్మకద్రోహమా
  choice: విశ్వాసంలేని
  alternative: నమ్మకంలేని / విశ్వాసరహితమైన
  rationale: తక్షణ సందర్భం విశ్వాసలోపం చుట్టూ ఉన్నందున ప్రధాన పాఠంలో ‘విశ్వాసంలేని’ ఎంచుకున్నాం. అయినా గ్రీకు పదానికి ‘నమ్మకంలేని’ అనే విస్తృత భావం కూడా ఉండటంతో దాన్ని పాదసూచికలో ఇచ్చి ఉద్రిక్తతను నిలిపాం.
- issue: διεστραμμένη యొక్క నైతిక తీవ్రత
  choice: వక్రమైన
  alternative: దారి తప్పిన / చెడిపోయిన
  rationale: ‘వక్రమైన’ మూలంలోని twisted/distorted భావాన్ని నిలుపుతుంది; ‘చెడిపోయిన’ అనడం వల్ల పూర్తిగా నైతిక పతనం అనే నిర్ణయాన్ని అదనంగా చేర్చకుండా ఉంటుంది.
- issue: యేసు ప్రశ్నల్లో వ్యక్తమయ్యే సహనం మరియు గద్దింపు
  choice: నేను ఎంతకాలం మీతో ఉంటాను? ఎంతకాలం మిమ్మల్ని సహిస్తాను?
  alternative: నేను ఇంకెంతకాలం మీతో ఉండాలి? ఇంకెంతకాలం మిమ్మల్ని భరించాలి?
  rationale: గ్రీకులోని భవిష్యత్ ప్రశ్నారూపాన్ని నిలిపి, ‘ఉండాలి’ వంటి విధ్యర్థక వ్యాఖ్యానాన్ని చేర్చలేదు. పునరుక్తి ద్వారా గద్దింపు తీవ్రత అలాగే ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన శైలి. సంబోధనలో ‘తరమా’ సహజ తెలుగు ధ్వనిని ఇస్తుంది. అలంకారప్రశ్నల సమాంతర నిర్మాణం మరియు గద్దింపు స్వరం నిలుపబడ్డాయి.
