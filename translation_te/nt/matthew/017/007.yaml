id: MAT.17.7
reference: Matthew 17:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: te
  text: యేసు వారి దగ్గరకు వచ్చి, వారిని తాకి, “లేవండి; భయపడకండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθεν
  choice: దగ్గరకు వచ్చి
  rationale: προσέρχομαι ఇక్కడ శిష్యుల వైపు వచ్చి వారిని సమీపించడాన్ని సూచిస్తుంది. ‘దగ్గరకు వచ్చి’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి ఆ కదలికను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἁψάμενος αὐτῶν
  choice: వారిని తాకి
  rationale: ἅπτω అనే క్రియ షష్ఠీ విభక్తితో ‘తాకు’ అనే అర్థం ఇస్తుంది. గ్రీకు మూలంలో లేని ‘చేయి వేశాడు’ వంటి వివరాన్ని చేర్చకుండా, కృదంత చర్యను తెలుగులో సహజమైన వరుస క్రియగా అందించాం.
- source_word: εἶπεν
  choice: అని చెప్పాడు
  rationale: λέγωకు ఇక్కడ సాధారణమైన ‘చెప్పాడు’ సరిపోతుంది; సంభాషణను సహజ తెలుగులో కలుపుతుంది.
- source_word: Ἐγέρθητε
  choice: లేవండి
  rationale: ఇంతకుముందు నేలపై పడిపోయిన శిష్యులు పైకి లేవాలనే ఆజ్ఞ ఇది. ‘లేవండి’ సహజంగా ఉండి, వారు తప్పనిసరిగా నిలబడాలనే అదనపు భావాన్ని రుద్దదు.
- source_word: μὴ φοβεῖσθε
  choice: భయపడకండి
  rationale: φοβέομαι యొక్క సహజ తెలుగు సమానం ‘భయపడు.’ వర్తమాన ఆజ్ఞారూపాన్ని తప్పనిసరిగా ‘ఇక భయపడడం మానండి’ అని విస్తరించకుండా సరళమైన నిషేధ ఆజ్ఞగా అనువదించాం.
- source_word: καὶ
  choice: వరుస క్రియల అనుసంధానం; ఆజ్ఞల మధ్య ‘;’
  rationale: పునరావృతమైన καί చర్యలను, ఆజ్ఞలను వరుసగా కలుపుతుంది. తెలుగులో ప్రతి చోటా ‘మరియు’ అనడం కృత్రిమంగా ఉంటుంది కాబట్టి, వరుస కృదంత నిర్మాణం మరియు విరామచిహ్నంతో అదే ప్రవాహాన్ని సహజంగా నిలిపాం.
theological_decisions:
- issue: యేసు ఇచ్చిన ధైర్యపరిచే ఆజ్ఞలో అదనపు ఆధ్యాత్మిక లేదా మ pastoral భావాన్ని చేర్చకపోవడం
  choice: “లేవండి; భయపడకండి”
  alternative: “లేచి నిలబడండి; ఇక భయాన్ని విడిచిపెట్టండి”
  rationale: మూలవాక్యం శారీరకంగా లేవమనే ఆజ్ఞను, భయపడవద్దనే ధైర్యవచనాన్ని మాత్రమే నేరుగా చెబుతుంది. ఎలాంటి సిద్ధాంతాత్మక విస్తరణ లేకుండా ఆ రెండు అంశాలను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథనశైలి. ‘సమీపించి’ కంటే ‘దగ్గరకు వచ్చి’ సహజంగా ఉంది. ఈ వాక్యంలో అర్థపరంగా అవసరమైన ప్రచురణ-పాదటిప్పణులు లేవు.
