  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: te
  text: 'ఆయన జవాబిచ్చి ఇలా అన్నాడు: “ఏలీయా నిజంగా వస్తాడు[a]; సమస్తాన్నీ పునరుద్ధరిస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలపాఠంలోని ‘వస్తున్నాడు/వస్తాడు’ అనే వర్తమానకాల క్రియకు ఇక్కడ భవిష్యదర్థం ఉంది. అందువల్ల, ‘ఏలీయా నిజంగా వస్తున్నాడు; సమస్తాన్నీ పునరుద్ధరిస్తాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: జవాబిస్తూ ... అని చెప్పాడు
  rationale: గ్రీకులోని కృదంతం + సమాపక క్రియ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, మాట ముందున్న ప్రశ్నకు జవాబని స్పష్టంగా ఉంచుతుంది.
- source_word: Ἠλίας
  choice: ఏలీయా
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: μέν
  choice: తప్పక
  rationale: తదుపరి వచనంలో వచ్చే వ్యత్యాసానికి ముందుమాటగా ఉన్న నొక్కిచెప్పే భావాన్ని సహజంగా తెలియజేస్తుంది; దీనిని కఠినమైన ‘ఒకవైపు’ నిర్మాణంగా మార్చదు.
- source_word: ἔρχεται
  choice: వస్తాడు
  rationale: రూపంలో వర్తమాన కాలమైనా, సందర్భంలో భవిష్యదర్థం ఉంది. తెలుగు సాధారణ భవిష్యత్ రూపం ఈ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἀποκαταστήσει
  choice: పునరుద్ధరిస్తాడు
  rationale: భవిష్యత్ కార్యాన్ని నేరుగా తెలియజేస్తూ, పునఃస్థాపన స్వభావాన్ని అనవసరంగా నిర్దిష్టపరచదు.
- source_word: πάντα
  choice: సమస్తాన్నీ
  rationale: నపుంసక బహువచనంలోని విస్తృత, సమగ్ర పరిధిని కాపాడుతుంది; పాఠ్యంలో పేర్కొనని అంశాలను చేర్చదు.
theological_decisions:
- issue: ఏలీయా చేసే పునరుద్ధరణ స్వభావం మరియు పరిధి
  choice: ‘సమస్తాన్నీ పునరుద్ధరిస్తాడు’ అని విస్తృతంగానే అనువదించడం
  alternative: ‘అన్నిటినీ చక్కబెడతాడు’ లేదా పునరుద్ధరణను ఆధ్యాత్మిక, సామాజిక, అంత్యకాల సంబంధమైన ఒక నిర్దిష్ట అర్థానికి పరిమితం చేయడం
  rationale: ఈ వచనం పునరుద్ధరణ పరిధిని సమగ్రంగా చెబుతుంది గాని దాని ఖచ్చిత స్వభావాన్ని నిర్వచించదు. విస్తృత పదబంధం మూలంలోని ధార్మిక ఉద్వేగం, అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘సమస్తాన్నీ పునరుద్ధరిస్తాడు’ అనే పదబంధం మూలంలోని గంభీరతను, విస్తృత పరిధిని నిలుపుతుంది.
