id: MAT.17.25
reference: Matthew 17:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: te
  text: 'అతడు, “అవును,” అన్నాడు. అతడు ఇంట్లోకి వచ్చినప్పుడు, యేసు అతనితో ముందుగానే ఇలా అన్నాడు: “సీమోనూ, నీకేమనిపిస్తుంది? భూమిపై రాజులు సుంకాలు లేదా తలపన్ను[a] ఎవరి దగ్గర వసూలు చేస్తారు? తమ సొంత కుమారుల దగ్గరా, ఇతరుల దగ్గరా[b]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సుంకాలు లేదా కప్పం.” గ్రీకులో τέλη అంటే సుంకాలు లేదా పరోక్ష పన్నులు; κῆνσον అంటే వ్యక్తిపై విధించే తలపన్ను లేదా కప్పం.
    reason: lexical_alternative
  - marker: b
    text: లేదా “పరుల దగ్గరా?” గ్రీకు ἀλλοτρίων అనే పదం తమ సొంత కుటుంబానికి చెందని బయటి వారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: అవును
  rationale: సాధారణ అంగీకార జవాబును సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: అతడు ఇంట్లోకి వచ్చినప్పుడు
  rationale: కర్త పేతురు అని సందర్భం సూచిస్తుంది; గ్రీకు క్రియావిశేషణ రూపాన్ని తెలుగులో స్పష్టమైన కాలవాచక ఉపవాక్యంగా అందించింది.
- source_word: προέφθασεν αὐτὸν
  choice: యేసే ముందుగా అతనితో ఇలా అన్నాడు
  rationale: పేతురు మాట్లాడకముందే యేసు మాట ప్రారంభించాడనే భావాన్ని సహజంగా తెలియజేస్తుంది; ‘యేసే’ ముందుగా చొరవ తీసుకున్నాడనే నొక్కును ఇస్తుంది.
- source_word: Τί σοι δοκεῖ
  choice: నీకేమనిపిస్తుంది?
  rationale: సీమోను అభిప్రాయాన్ని అడిగే గ్రీకు నుడికారానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: భూమిపై రాజులు
  rationale: γῆ యొక్క విస్తృత భావాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉంది.
- source_word: τέλη
  choice: సుంకాలు
  rationale: పరోక్ష పన్నులు, సరిహద్దు లేదా వాణిజ్య సుంకాలు అనే భావాన్ని తెలియజేసి, తరువాతి κῆνσον నుండి భేదాన్ని ఉంచుతుంది.
- source_word: κῆνσον
  choice: తలపన్ను
  rationale: వ్యక్తిపై విధించే పన్ను అనే నిర్దిష్ట భావాన్ని తెలియజేస్తూ τέληతో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: υἱῶν αὐτῶν
  choice: తమ సొంత కుమారులు
  rationale: కుమారులు అనే నిర్దిష్ట కుటుంబ భాషను, అలాగే రాజు కుటుంబానికీ బయటి వారికీ మధ్య ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἀλλοτρίων
  choice: ఇతరులు
  rationale: తమ కుటుంబానికి చెందని బయటి వారిని సూచిస్తుంది; ‘సొంత కుమారులు’తో ఉన్న వ్యత్యాసం వల్ల అర్థం స్పష్టమవుతుంది.
theological_decisions:
- issue: యేసు ఉపమానంలోని ‘కుమారులు’ అనే మాట వల్ల కలిగే సంభావ్య దైవశాస్త్రీయ సూచన
  choice: ప్రధాన పాఠ్యంలో ‘తమ సొంత కుమారులు’ అనే కుటుంబ భాషను యథాతథంగా నిలుపడం
  alternative: తమ పిల్లలు; తమ ప్రజలు
  rationale: తక్షణ ఉపమానంలో రాజు సొంత కుటుంబానికి పన్ను మినహాయింపు ఉండడమే అంశం; తరువాతి వచనంలో వెల్లడయ్యే కుమారునికి సంబంధించిన సూచనను ఇక్కడే విస్తరించి వ్యాఖ్యానించకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలి ఉపయోగించబడింది. ‘సీమోనూ’ అనే సంబోధన సహజమైన తెలుగు రూపం. పన్నుల రెండు వర్గాల మధ్య గ్రీకు మూలంలోని భేదం ‘సుంకాలు’ మరియు ‘తలపన్ను’ ద్వారా నిలుపబడింది; కుటుంబ సంబంధమైన ‘కుమారులు’ అనే పదం ఉద్దేశపూర్వకంగా సాధారణీకరించబడలేదు.
