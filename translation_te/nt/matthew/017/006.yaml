  text: καὶ ἀκούσαντες οἱ μαθηταὶ ἔπεσαν ἐπὶ πρόσωπον αὐτῶν καὶ ἐφοβήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/006.yaml
  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: te
  text: శిష్యులు అది విన్నప్పుడు[a], ముఖాలు నేలకు ఆనించి పడ్డారు[b]; వారు ఎంతో[c] భయపడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విని’; గ్రీకులో భూతకాల అసమాపక క్రియారూపం ఉంది. దాన్ని ‘విన్నప్పుడు’ లేదా మరింత అక్షరార్థంగా ‘విని’ అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘తమ ముఖం మీద పడ్డారు.’ బహువచన కర్తతో సహజమైన తెలుగులో ‘ముఖాలు నేలకు ఆనించి పడ్డారు’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: c
    text: అంటే, వారు తీవ్రమైన భయానికి లోనయ్యారు; ‘ఎంతో’ అనే మాట σφόδρα అనే క్రియావిశేషణాన్ని అనువదిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: అది విన్నప్పుడు
  rationale: కాలసంబంధ అర్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. గ్రీకులో కర్మ స్పష్టంగా లేకపోయినా, ముందరి వచనంలోని స్వరాన్ని సందర్భానుసారంగా సూచించడానికి ‘అది’ వాడబడింది.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులు
  rationale: సువార్తలలో μαθηταίకు ప్రామాణికమైన, సహజమైన తెలుగు పదం; ఇక్కడ యేసు శిష్యులనే సూచిస్తుంది.
- source_word: ἔπεσαν ἐπὶ πρόσωπον αὐτῶν
  choice: ముఖాలు నేలకు ఆనించి పడ్డారు
  rationale: వారి శరీర భంగిమను స్పష్టంగా, సహజంగా తెలియజేస్తుంది. ‘సాష్టాంగపడ్డారు’ అని అనువదిస్తే ఆరాధన అనే భావాన్ని మూలపాఠం కంటే స్పష్టంగా చేర్చే అవకాశం ఉంది.
- source_word: ἐφοβήθησαν
  choice: భయపడ్డారు
  rationale: వారి భావోద్వేగ ప్రతిస్పందనను సరళమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; క్రియకు లేని అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: σφόδρα
  choice: ఎంతో
  rationale: భయం తీవ్రంగా ఉందని తెలిపే σφόδρα అనే క్రియావిశేషణాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దైవిక స్వరం విన్న శిష్యుల ప్రతిస్పందన స్వభావం
  choice: శరీరాన్ని నేలకు వంచిన భంగిమనూ తీవ్రమైన భయాన్నీ మాత్రమే స్పష్టంగా తెలిపి, దానిని ఆరాధనగా గానీ భీతిగా గానీ ప్రత్యేకంగా నిర్వచించలేదు.
  alternative: దీనిని ప్రధానంగా భక్తిపూర్వక ఆరాధనగా లేదా దైవ ప్రత్యక్షత ఎదుట కలిగిన భీతిగా అనువదించడం.
  rationale: గ్రీకు పాఠం వారి భంగిమను, భయాన్ని నివేదిస్తుంది; ఆ ప్రతిస్పందనకు నిర్దిష్టమైన వేదాంతపరమైన పేరు పెట్టదు. అందువల్ల మూలంలోని భావ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా వృత్తాంతానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. వాక్యప్రవాహం కోసం రెండు ప్రధాన క్రియల మధ్య అర్ధవిరామం వాడబడింది.
