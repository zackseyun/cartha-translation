id: MAT.17.24
reference: Matthew 17:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: te
  text: వారు కపెర్నహూముకు వచ్చినప్పుడు, రెండు ద్రాక్మాల పన్ను[a] వసూలు చేసేవారు[b] పేతురు దగ్గరకు వచ్చి, “మీ గురువు రెండు ద్రాక్మాల పన్ను చెల్లించరా?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘రెండు ద్రాక్మాలు’; అంటే రెండు ద్రాక్మాల దేవాలయ పన్ను.
    reason: cultural_note
  - marker: b
    text: లేదా ‘రెండు ద్రాక్మాల పన్ను వసూలుదారులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: వారు ... వచ్చినప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్ తెలిపే కాలసంబంధ పరిస్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. δέ ఇక్కడ స్వల్ప కథన మార్పును సూచిస్తున్నందున ప్రత్యేక సంధానపదాన్ని బలవంతంగా చేర్చలేదు.
- source_word: Καφαρναοὺμ
  choice: కపెర్నహూము
  rationale: గ్రీకు స్థలనామాన్ని తెలుగులో ప్రాచుర్యంలో ఉన్న రూపానికి దగ్గరగా లిప్యంతరీకరించింది.
- source_word: προσῆλθον
  choice: దగ్గరకు వచ్చి
  rationale: పేతురును సమీపించిన కదలికను సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: రెండు ద్రాక్మాల పన్ను వసూలు చేసేవారు
  rationale: కర్తలను వారి పనిని బట్టి గుర్తించే గ్రీకు కృదంత పదబంధాన్ని సహజమైన తెలుగులో అందిస్తుంది. సందర్భంలో λαμβάνοντες అంటే పన్నును స్వీకరించడం లేదా వసూలు చేయడం.
- source_word: δίδραχμα
  choice: రెండు ద్రాక్మాల పన్ను
  rationale: δίδραχμον అనేది రెండు ద్రాక్మాల విలువగల మొత్తం. సందర్భం చెల్లించవలసిన దేవాలయ పన్ను గురించి కాబట్టి, మొత్తాన్ని మరియు దాని పన్ను స్వభావాన్ని రెండింటినీ స్పష్టం చేసింది.
- source_word: τῷ Πέτρῳ
  choice: పేతురు దగ్గరకు
  rationale: సమీపించే క్రియతో కూడిన దత్తివును సహజమైన తెలుగు ప్రయోగంలో అందించింది.
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: మీ గురువు
  rationale: διδάσκαλος యొక్క బోధించే వ్యక్తి అనే అర్థాన్ని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది; ‘యజమాని’ వంటి అధికారం-కేంద్రీకృత అర్థాన్ని అనవసరంగా చేర్చదు.
- source_word: οὐ τελεῖ
  choice: చెల్లించరా?
  rationale: పన్ను బాధ్యతను నెరవేర్చడం అనే సందర్భార్థానికి ‘చెల్లించు’ సరిపోతుంది. గ్రీకు ప్రతికూల ప్రశ్న సాధారణంగా సానుకూల సమాధానాన్ని ఆశించినా, ఆ భావాన్ని వ్యాఖ్యానంగా మార్చకుండా ప్రతికూల ప్రశ్న రూపాన్నే నిలిపింది.
theological_decisions:
- issue: δίδραχμα అనేది నాణేలను మాత్రమే సూచిస్తుందా, లేక పన్ను చెల్లింపునా?
  choice: ప్రధాన వచనంలో ‘రెండు ద్రాక్మాల పన్ను’
  alternative: ‘రెండు ద్రాక్మాలు’ లేదా ‘దిద్రాక్మా నాణేలు’
  rationale: తక్షణ సందర్భం యేసు ఆ నిర్దిష్ట చెల్లింపును చేస్తాడా అనే ప్రశ్న. అందువల్ల ‘పన్ను’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది; ఇది సిద్ధాంతపరమైన అదనపు వివరణ కాదు.
- issue: οὐ τελεῖ అనే ప్రతికూల ప్రశ్నలోని భావసూచన
  choice: ‘చెల్లించరా?’ అనే ప్రతికూల ప్రశ్నను నిలుపుకోవడం
  alternative: ‘చెల్లిస్తారు కదా?’ లేదా ‘చెల్లిస్తారా?’
  rationale: గ్రీకు ప్రశ్న సానుకూల సమాధానాన్ని ఆశించి ఉండవచ్చు; అయినా దాని వ్యావహారిక సూక్ష్మతను ఖచ్చితంగా నిర్ణయించి పాఠ్యంలో చేర్చకుండా అసలు ప్రశ్నలోని ఉద్వేగాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ద్రాక్మా’ అనే చారిత్రక నాణెం పేరును నిలిపి, అపరిచితమైన సందర్భాన్ని ‘పన్ను’ మరియు పాదటిప్పణి ద్వారా స్పష్టం చేసింది. రెండు పాదటిప్పణి గుర్తులు సంబంధిత పదబంధంలో వరుసగా ఉంచబడ్డాయి.
