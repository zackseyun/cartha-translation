id: MAT.17.27
reference: Matthew 17:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: te
  text: అయితే మనం వారికి అభ్యంతరం కలగకుండా ఉండేందుకు[a], సముద్రానికి వెళ్లి గాలం వేయి. మొదట పైకి వచ్చే చేపను తీసుకో. దాని నోరు తెరిచినప్పుడు నీకు ఒక స్తాతేరు నాణెం[b] దొరుకుతుంది. దాన్ని తీసుకుని నా కోసమూ నీ కోసమూ వారికి ఇవ్వు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని తడబడేలా చేయకుండా” లేదా “వారికి అభ్యంతరం కలిగించకుండా.”
    reason: lexical_alternative
  - marker: b
    text: స్తాతేరు సుమారు నాలుగు ద్రాఖ్మాల విలువగల నాణెం; ఇద్దరి ఆలయపు పన్ను చెల్లించడానికి అది సరిపోయేది.
    reason: cultural_note
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: వారికి అభ్యంతరం కలిగించకుండా ఉండేందుకు
  rationale: ఈ సందర్భంలో ఆలయపు పన్ను వసూలు చేసేవారు నైతికంగా పాపంలో పడేలా చేయడం కంటే, వారికి అనవసరమైన అభ్యంతరం లేదా ఆటంకం కలిగించకపోవడమే ప్రధాన భావం. సహజమైన తెలుగు కోసం ఈ రూపాన్ని ఎంచుకుని, పదంలోని విస్తృత భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: θάλασσαν
  choice: సముద్రానికి
  rationale: ఇది గలిలయ సముద్రం అనే సరస్సును సూచించినప్పటికీ, గ్రీకు మూలంలోని ‘సముద్రం’ అనే పదాన్ని నిలిపాం.
- source_word: ἄγκιστρον
  choice: గాలం
  rationale: చేప పట్టే కొక్కెాన్ని సూచించే సహజమైన తెలుగు పదం; ‘గాలం వేయి’ సందర్భానుకూలమైన వాడుక.
- source_word: ἀναβάντα πρῶτον ἰχθὺν
  choice: మొదట పైకి వచ్చే చేపను
  rationale: నీటిలోనుంచి మొదట పైకి వచ్చే చేప అనే క్రమాన్ని సహజంగా, మూలానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: ἆρον
  choice: పట్టుకో
  rationale: చేప పైకి వచ్చిన తరువాత దాన్ని తీసుకోవాలనే ఆజ్ఞను ఈ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: στατῆρα
  choice: ఒక స్తాతేరు నాణెం
  rationale: గ్రీకులో పేర్కొన్న నిర్దిష్ట నాణెం పేరును లిప్యంతరీకరించి నిలిపి, దాని విలువను పాదసూచికలో వివరించాం.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: నా కోసమూ నీ కోసమూ
  rationale: ఆ నాణెం ఇద్దరి తరఫున చెల్లించబడుతుందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘బదులుగా’ అని అనువదించి అనవసరమైన ప్రత్యామ్నాయ భావాన్ని బలపరచలేదు.
- source_word: πορευθεὶς
  choice: వెళ్లి
  rationale: తదుపరి ఆజ్ఞకు ముందున్న అనుబంధ చర్యను సహజమైన తెలుగు క్రియారూపంతో తెలిపాం.
- source_word: δὸς αὐτοῖς
  choice: వారికి ఇవ్వు
  rationale: ముందు ప్రస్తావించిన నాణెాన్ని వారికి ఇవ్వాలనే సూటి ఆజ్ఞను నిలిపాం; చెల్లింపు భావం సందర్భం ద్వారా స్పష్టమవుతుంది.
theological_decisions:
- issue: ఆలయపు పన్ను చెల్లింపుతో సంబంధించి σκανδαλίζω భావం
  choice: వారికి అనవసరమైన అభ్యంతరం కలిగించకుండా ఉండేందుకు యేసు చెల్లించమని చెబుతున్నాడు.
  alternative: యేసు పూర్తిగా పన్నుకు బద్ధుడైనందువల్ల చెల్లిస్తున్నాడు; లేదా ఈ చెల్లింపుకు నైతిక ప్రాముఖ్యత లేక, ఇది కేవలం అద్భుత ప్రదర్శన మాత్రమే.
  rationale: మత్తయి 17:24–26లో కుమారులు స్వతంత్రులని చెప్పిన తరువాత, ఈ వాక్యం ‘అయితే’ అంటూ ఆ స్వేచ్ఛను రద్దు చేయకుండా ఆచరణాత్మక రాయితీని జోడిస్తుంది. అనువాదం ఈ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించాం. చిన్న ఆజ్ఞ వాక్యాలతో మూలంలోని చర్యల క్రమాన్ని స్పష్టంగా ఉంచాం. ‘స్తాతేరు’ అనే చారిత్రక నాణెం పేరును ప్రధాన పాఠ్యంలో నిలిపి, పాఠకుడికి అవసరమైన విలువ వివరణను పాదసూచికలో ఇచ్చాం.
