  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: te
  text: వారు ఆయనను చంపుతారు; మూడవ రోజున ఆయన లేపబడతాడు[a]. వారు ఎంతో దుఃఖించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “ఆయన లేస్తాడు.” గ్రీకు క్రియ కర్మణి రూపంలో ఉంది: “ఆయన లేపబడతాడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν
  choice: చంపుతారు
  rationale: భవిష్యత్ క్రియారూపంలోని ‘చంపుతారు’ మూలపదానికి నేరమైన, సహజమైన తెలుగు సమానం. ‘మరణశిక్ష విధిస్తారు’ అని అనువదిస్తే మూలంలో లేని న్యాయపరమైన భావం చేరుతుంది.
- source_word: αὐτόν
  choice: ఆయనను
  rationale: మునుపటి వచనంలోని మనుష్యకుమారుని సూచించే కర్మప్రత్యయం. యేసును సూచిస్తున్నందున గౌరవార్థక ఏకవచనం వాడబడింది.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: మూడవ రోజున
  rationale: కాలాన్ని సూచించే దత్తి విభక్తి ప్రయోగాన్ని సంక్షిప్తంగా, సహజంగా ప్రతిబింబిస్తుంది; మూలంలో లేని ‘ఆ తర్వాత’ అనే వివరణను చేర్చదు.
- source_word: ἐγερθήσεται
  choice: లేపబడతాడు
  rationale: భవిష్యత్ కర్మణి క్రియారూపాన్ని నిలుపుతుంది. ‘లేస్తాడు’ సహజమైన ప్రత్యామ్నాయమైనా, అది గ్రీకులోని కర్మణి రూపాన్ని స్పష్టంగా చూపదు.
- source_word: ἐλυπήθησαν σφόδρα
  choice: ఎంతో దుఃఖించారు
  rationale: ἐλυπήθησαν తెలిపే దుఃఖాన్ని, σφόδρα ఇచ్చే తీవ్రతను ఆధునిక తెలుగులో సహజంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ ... καὶ ... καὶ
  choice: ; ... . వారు
  rationale: గ్రీకు వాక్యాల వరుస సంబంధాన్ని తెలుగులో సహజమైన విరామచిహ్నాలు, వాక్యక్రమంతో అందించింది. ప్రతి καίకి యాంత్రికంగా ‘మరియు’ పెట్టడం ఆధునిక తెలుగులో అసహజంగా ఉంటుంది.
theological_decisions:
- issue: పునరుత్థాన సూచనలో కర్మణి లేదా కర్తరి రూపం
  choice: ఆయన లేపబడతాడు
  alternative: ఆయన లేస్తాడు
  rationale: ἐγερθήσεται భవిష్యత్ కర్మణి రూపం. కర్మణి రూపాన్ని నిలపడం దేవుని కార్యాన్ని సూచించగల మూలభాషా నుడికారాన్ని సంరక్షిస్తుంది; అయితే కర్తరి భావంలోని సహజ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చి అసలైన అనువాద సాధ్యతను దాచలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. పునరుత్థాన క్రియలోని గ్రీకు కర్మణి రూపాన్ని ఉద్దేశపూర్వకంగా నిలిపి, మరింత సహజమైన కర్తరి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
