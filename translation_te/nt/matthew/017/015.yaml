  terminology: “ప్రభువా,” “కరుణించు,” and “కుమారుణ్ణి” are appropriate. The lexical footnote responsibly identifies the literal moon-related idiom and preserves “మూర్ఛవ్యాధితో ఉన్నాడు” as an alternative without asserting a medical diagnosis in the main text.
