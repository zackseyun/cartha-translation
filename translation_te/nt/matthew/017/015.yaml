  to: 'అని చెప్పాడు: “ప్రభువా, నా కుమారుణ్ణి కరుణించు. అతనికి మూర్ఛలు వస్తాయి[a], అతడు తీవ్రంగా బాధపడుతున్నాడు; అతడు తరచూ అగ్నిలోనూ, తరచూ నీటిలోనూ పడిపోతాడు.”'
