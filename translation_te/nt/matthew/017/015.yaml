id: MAT.17.15
reference: Matthew 17:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: te
  text: 'అని చెప్పాడు: “ప్రభువా, నా కుమారుణ్ణి కరుణించు. అతనికి మూర్ఛలు వస్తాయి[a], అతడు తీవ్రంగా బాధపడుతున్నాడు; అతడు తరచూ అగ్నిలోనూ, తరచూ నీటిలోనూ పడిపోతాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మూర్ఛవ్యాధితో ఉన్నాడు”; అక్షరార్థంగా, “చంద్రగ్రస్తుడై ఉన్నాడు.” ఈ గ్రీకు పదం మూర్ఛసదృశ స్థితిని సూచించే ప్రాచీన నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును గౌరవంగా సంబోధించే κύριος పదానికి సహజమైన, సంప్రదాయబద్ధమైన తెలుగు సంబోధన.
- source_word: ἐλέησόν
  choice: కరుణించు
  rationale: కరుణతో సహాయం చేయమనే గంభీరమైన విజ్ఞాపనను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μου τὸν υἱόν
  choice: నా కుమారుణ్ణి
  rationale: υἱός ప్రత్యేకంగా కుమారుణ్ణి సూచిస్తుంది; సాధారణమైన ‘బిడ్డ’ కంటే మూలపదాన్ని స్పష్టంగా అనుసరిస్తుంది.
- source_word: σεληνιάζεται
  choice: మూర్ఛలు వస్తున్నాయి
  rationale: చంద్రునితో ముడిపడిన ప్రాచీన నుడికారాన్ని అక్షరార్థంగా కాకుండా కనిపించే మూర్ఛసదృశ లక్షణంగా తెలియజేస్తుంది; ఆధునిక వైద్య నిర్ధారణను రుద్దదు.
- source_word: κακῶς πάσχει
  choice: తీవ్రంగా బాధపడుతున్నాడు
  rationale: κακῶς పదంలోని తీవ్రతను, πάσχει సూచించే బాధను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πολλάκις
  choice: తరచూ
  rationale: పునరావృతంగా జరిగే క్రియను సహజంగా సూచిస్తుంది; గ్రీకులో రెండుసార్లు వచ్చిన పదాన్ని తెలుగులోనూ రెండుసార్లు ఉంచారు.
- source_word: πίπτει εἰς τὸ πῦρ
  choice: మంటల్లో పడిపోతున్నాడు
  rationale: అగ్నిలో పడటాన్ని సాధారణ పాఠకుడికి స్పష్టమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς τὸ ὕδωρ
  choice: నీళ్లలో పడిపోతున్నాడు
  rationale: అగ్నితో ఉన్న సమాంతర నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: καὶ λέγων
  choice: ఇలా అన్నాడు
  rationale: మునుపటి వాక్యంతో అనుసంధానమైన గ్రీకు వర్తమాన కృదంతాన్ని తెలుగు కథనశైలికి సహజమైన సమాపక క్రియగా అందిస్తుంది.
theological_decisions:
- issue: స్వస్థత/దయ్యం వెళ్లగొట్టే సందర్భంలో σεληνιάζεται అనువాదం
  choice: మూర్ఛలు వస్తున్నాయి
  alternative: మూర్ఛవ్యాధి ఉంది; చంద్రగ్రస్తుడై ఉన్నాడు
  rationale: ఇది తండ్రి చెప్పిన బాలుడి స్థితి; ఆధునిక వైద్య నిర్ధారణ కాదు. లక్షణాన్ని మాత్రమే తెలిపే అనువాదం ప్రాచీన చంద్రకారణ భావనను సమర్థించదు, అలాగే ఈ వచనం స్వయంగా చెప్పని వైద్య లేదా ఆధ్యాత్మిక కారణాన్ని నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే ప్రార్థనాత్మక సంబోధనలో గౌరవం మరియు గంభీరత నిలిచేలా రూపొందించబడింది.
