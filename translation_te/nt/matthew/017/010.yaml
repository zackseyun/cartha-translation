id: MAT.17.10
reference: Matthew 17:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: te
  text: 'శిష్యులు ఆయనను ఇలా అడిగారు: “అయితే, ఏలీయా ముందుగా రావాలని శాస్త్రులు ఎందుకు చెబుతున్నారు?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: అడిగారు
  rationale: ఇక్కడ ఈ క్రియ ప్రత్యక్ష ప్రశ్నను పరిచయం చేస్తుంది. ‘అడిగారు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: μαθηταὶ
  choice: శిష్యులు
  rationale: నిర్దిష్ట ఉపదేశితుల సమూహాన్ని సూచిస్తుంది. మూలంలో లేని ‘ఆయన శిష్యులు’ అనే స్వామ్యార్థాన్ని చేర్చలేదు.
- source_word: λέγοντες
  choice: ఇలా
  rationale: ప్రశ్నలోని మాటలను పరిచయం చేసే గ్రీకు కృదంతాన్ని తెలుగులో సహజంగా ‘ఇలా అడిగారు’ అని వ్యక్తం చేశాం.
- source_word: Τί οὖν
  choice: అయితే ... ఎందుకు
  rationale: λέγουσιν ὅτιతో కూడిన ఈ సందర్భంలో τί కారణాన్ని అడుగుతోంది; οὖν యొక్క అనుసంధాన భావాన్ని ‘అయితే’ నిలుపుతుంది.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: సువార్తల సందర్భంలో ధర్మశాస్త్రాన్ని ప్రతిలిపి చేసి బోధించే వర్గానికి స్థిరపడిన, సంక్షిప్తమైన తెలుగు పదం.
- source_word: λέγουσιν ὅτι
  choice: అని ... చెబుతున్నారు
  rationale: ὅτι పరిచయం చేసే విషయవాక్యాన్ని తెలుగులో సహజమైన ఉద్ధరణ నిర్మాణంతో అందిస్తుంది; వర్తమాన కాల భావాన్ని నిలుపుతుంది.
- source_word: Ἠλίαν
  choice: ఏలీయా
  rationale: తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: δεῖ ἐλθεῖν
  choice: రావాలి
  rationale: δεῖ వ్యక్తం చేసే అవసరతను సహజంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: πρῶτον
  choice: ముందుగా
  rationale: సంఘటనల క్రమంలో ఇతరులకంటే లేదా మరొక సంఘటనకంటే ముందు రావడాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఏలీయా రాకను గురించి శాస్త్రుల బోధపై శిష్యుల ప్రశ్నలోని భావం
  choice: శాస్త్రుల మాటను సమర్థిస్తున్నారా, సవాలు చేస్తున్నారా, లేక వివరణ కోరుతున్నారా అనేది ముందుగానే నిర్ణయించకుండా ప్రశ్నగానే అనువదించాం.
  alternative: శాస్త్రులపై సందేహాన్ని సూచించేలా లేదా మలాకీ ప్రవచన నేపథ్యాన్ని ఈ వచనంలోనే వివరించేలా అనువదించడం.
  rationale: తదుపరి వచనాల్లో వచ్చే యేసు సమాధానాన్ని ఈ వచనంలోకి దిగుమతి చేయకుండా, మూలంలోని దైవశాస్త్రీయ ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. గ్రీకు పదక్రమాన్ని బలవంతంగా అనుసరించకుండా దాని అర్థం, అనుసంధానం, అవసరత భావాలను నిలిపాం.
