source:
  edition: SBLGNT
  text: τότε συνῆκαν οἱ μαθηταὶ ὅτι περὶ Ἰωάννου τοῦ βαπτιστοῦ εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: te
  text: అప్పుడు, ఆయన వారితో బాప్తిస్మం ఇచ్చే యోహాను[a] గురించి చెప్పాడని శిష్యులు గ్రహించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బాప్తిస్మదాత యోహాను.”
    reason: βαπτιστής అనే బిరుదుకు సంక్షిప్త ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: వారు గ్రహించిన క్షణాన్ని సూచించే సహజమైన, సంక్షిప్తమైన కథన అనుసంధానం.
- source_word: συνῆκαν
  choice: గ్రహించారు
  rationale: సందేశంలోని భావాన్ని అర్థం చేసుకున్నారనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులు
  rationale: సువార్తల సందర్భంలో యేసు అనుచరులను సూచించే స్థిరమైన, సుపరిచితమైన పదం.
- source_word: ὅτι
  choice: అని
  rationale: శిష్యులు గ్రహించిన విషయాన్ని పరిచయం చేస్తుంది; కారణార్థాన్ని సూచించదు.
- source_word: περὶ
  choice: గురించి
  rationale: ఇక్కడ షష్ఠీ విభక్తితో వచ్చిన περί మాట యొక్క విషయాన్ని సూచిస్తుంది.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: బాప్తిస్మమిచ్చే యోహాను
  rationale: βαπτιστής అనే కార్యసూచక బిరుదును పారదర్శకంగా, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; సంప్రదాయ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: εἶπεν αὐτοῖς
  choice: తమతో చెప్పాడు
  rationale: గ్రీకు వాక్యంలోని మాట్లాడే క్రియను సహజంగా అందిస్తుంది; తెలుగు సందర్భంలో ముందుగా జరిగిన మాటను ప్రత్యేక కాలరూపంతో చూపాల్సిన అవసరం లేదు. αὐτοῖςను కర్తకు తిరిగి సూచించకుండా ‘తమతో’గా అందిస్తుంది.
theological_decisions:
- issue: తక్షణ సందర్భంలో ఏలీయా రూపానికి సంబంధించిన గుర్తింపు
  choice: యేసు బాప్తిస్మమిచ్చే యోహాను గురించి మాట్లాడాడని శిష్యులు గ్రహించినట్లు నేరుగా పేర్కొనడం.
  alternative: ఏలీయా యోహానుగా అక్షరార్థంగా అవతరించాడని వివరణను జోడించడం.
  rationale: ఈ వచనం శిష్యుల గ్రహింపును మాత్రమే స్పష్టంగా చెబుతుంది; ఆ గుర్తింపు స్వరూపాన్ని మరింత సిద్ధాంతీకరించదు. కాబట్టి వచనం చెప్పిన దానికంటే ఎక్కువగా విపులీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలి. మూలంలోని సరళమైన వాక్య నిర్మాణం, స్పష్టమైన సూచన నిలుపబడ్డాయి.
