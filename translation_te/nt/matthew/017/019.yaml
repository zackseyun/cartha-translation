source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: te
  text: అప్పుడు శిష్యులు యేసు దగ్గరకు ఏకాంతంగా వచ్చి, “మేము దానిని[a] ఎందుకు వెళ్లగొట్టలేకపోయాం?” అని అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ సర్వనామం దయ్యాన్ని కాక బాలుణ్ణి సూచిస్తుందని తీసుకుంటే, “అతన్ని.”
    reason: గ్రీకు నపుంసక సర్వనామం αὐτό సందర్భానుసారం దయ్యాన్నిగానీ బాలుణ్ణిగానీ సూచించే అవకాశం ఉంది.
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: తదుపరి సంఘటనను పరిచయం చేసే సహజమైన కాలసూచక పదం.
- source_word: προσελθόντες
  choice: దగ్గరికి వచ్చి
  rationale: προσέρχομαι అనే క్రియలోని సమీపించడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులు
  rationale: సువార్తల సందర్భంలో μαθηταίకు స్థిరమైన, సహజమైన తెలుగు పదం.
- source_word: τῷ Ἰησοῦ
  choice: యేసు దగ్గరికి
  rationale: προσέρχομαιతో వచ్చిన దత్తి విభక్తి సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: κατ’ ἰδίαν
  choice: ఏకాంతంగా
  rationale: ఇతరులకు దూరంగా, వ్యక్తిగతంగా మాట్లాడిన భావాన్ని సంక్షిప్తంగా మరియు గౌరవప్రదంగా అందిస్తుంది.
- source_word: εἶπον
  choice: అని అన్నారు
  rationale: మాట ప్రశ్న రూపంలో ఉన్నప్పటికీ మూలంలోని సాధారణ ‘చెప్పారు/అన్నారు’ అనే క్రియను నిలుపుతుంది.
- source_word: Διὰ τί
  choice: ఎందుకు
  rationale: కారణాన్ని అడిగే సహజమైన ఆధునిక తెలుగు ప్రశ్నార్థక రూపం.
- source_word: ἡμεῖς
  choice: మేము
  rationale: మూలంలో స్పష్టంగా ఉన్న కర్త సర్వనామాన్ని నిలుపుతుంది; ‘మేమే’ లేదా ‘మేము మాత్రం’ అని అవసరానికి మించిన ఉద్ఘాటన చేయదు.
- source_word: οὐκ ἠδυνήθημεν
  choice: వెళ్లగొట్టలేకపోయాం
  rationale: గత సందర్భంలోని అసమర్థతను సహజమైన తెలుగు సంయుక్త క్రియారూపంలో వ్యక్తపరుస్తుంది.
- source_word: ἐκβαλεῖν
  choice: వెళ్లగొట్టడం
  rationale: దయ్యాన్ని బలవంతంగా బయటకు పంపే సువార్తల సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: αὐτό
  choice: దాన్ని
  rationale: సందర్భంలో ఎక్కువగా దయ్యాన్ని సూచిస్తుందని భావించవచ్చు; అయితే గ్రీకు నపుంసక సర్వనామం బాలుణ్ణి కూడా సూచించగల అస్పష్టతను పాదటిప్పణిలో నమోదు చేశాం.
theological_decisions:
- issue: భూతవిమోచన సందర్భంలో αὐτό సూచించే వ్యక్తి లేదా వస్తువు
  choice: దయ్యాన్ని సూచిస్తున్నట్లు ‘దాన్ని’ అని అనువదించడం
  alternative: బాలుణ్ణి సూచిస్తున్నట్లు ‘అతన్ని’ అని అనువదించడం
  rationale: తక్షణ సందర్భంలో శిష్యుల వైఫల్యం దయ్యాన్ని వెళ్లగొట్టలేకపోవడమే; అయినా గ్రీకులో దయ్యానికి వాడిన δαιμόνιον, బాలునికి వాడిన παιδίον రెండూ నపుంసక లింగ పదాలు కావడంతో αὐτό రెండింటిలో దేనినైనా సూచించవచ్చు. అందువల్ల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఏకాంతంగా’ మూలంలోని వ్యక్తిగత సందర్భాన్ని నిలుపుతుంది; ప్రశ్న అయినప్పటికీ εἶπονను ‘అని అన్నారు’గా అనువదించి మూల క్రియను అనవసరంగా ప్రత్యేకీకరించలేదు.
