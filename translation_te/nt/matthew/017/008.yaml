review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that, after raising their eyes, the disciples saw nobody other than Jesus. However, “కన్నులెత్తి చూసినప్పుడు” redundantly introduces ‘looked,’ and “యేసు ఒక్కడిని” should be the emphatic object form “యేసు ఒక్కడినే.”
  naturalness: The proposed revision uses the natural narrative idiom “కన్నులెత్తి చూడగా” and a clear Telugu negative-exception construction.
  terminology: “యేసు” is standard Telugu usage. “ఒక్కడినే … తప్ప మరెవరినీ చూడలేదు” represents the Greek cumulative exclusivity (εἰ μὴ + αὐτὸν + μόνον) without treating αὐτόν as a reflexive ‘himself.’
  issues:
  - severity: medium
    issue: Emphatic object form is incomplete
    rationale: In “యేసు ఒక్కడిని తప్ప,” the emphatic exclusivity represented by αὐτὸν … μόνον is more naturally and accurately expressed as “యేసు ఒక్కడినే తప్ప.”
  - severity: low
    issue: Participial wording is somewhat redundant
    rationale: “కన్నులెత్తి చూసినప్పుడు” supplies an additional ‘looked’ action before the main verb ‘saw.’ “కన్నులెత్తి చూడగా” is a more idiomatic rendering of the participial sequence.
  revised_text: వారు కన్నులెత్తి చూడగా, యేసు ఒక్కడినే[a] తప్ప మరెవరినీ చూడలేదు.
  revised_footnotes:
  - marker: a
    text: గ్రీకులో యేసు పేరుకు ముందు ఉద్ఘాటనాత్మక సర్వనామం, చివర ‘మాత్రమే/ఒక్కడే’ అనే పదం ఉన్నాయి. అందువల్ల యేసును తప్ప మరెవ్వరూ కనిపించలేదనే ప్రత్యేకత బలంగా వ్యక్తమవుతుంది.
    reason: lexical_alternative
