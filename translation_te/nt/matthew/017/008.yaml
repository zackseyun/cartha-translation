source:
  edition: SBLGNT
  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: te
  text: వారు కన్నులెత్తి చూడగా, యేసు ఒక్కడినే[a] తప్ప మరెవరినీ చూడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో యేసు పేరుకు ముందు ఉద్ఘాటనాత్మక సర్వనామం, చివర ‘మాత్రమే/ఒక్కడే’ అనే పదం ఉన్నాయి. అందువల్ల యేసును తప్ప మరెవ్వరూ కనిపించలేదనే ప్రత్యేకత బలంగా వ్యక్తమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάραντες
  choice: కన్నులెత్తి చూసినప్పుడు
  rationale: ఆరిస్ట్ క్రియావిశేషణ రూపం ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది. తెలుగు సహజ ప్రయోగంలో ‘కన్నులెత్తి చూసినప్పుడు’ అని చెప్పడం ఆ క్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ కథనాన్ని స్వల్పంగా కొనసాగించే అనుసంధాన పదం. తెలుగు వాక్యప్రవాహంలో దానికోసం ‘మరియు’ లేదా ‘అయితే’ చేర్చడం అవసరం లేదు; ‘అయితే’ అనవసరమైన వ్యతిరేక భావాన్ని కలిగించవచ్చు.
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: కన్నులు
  rationale: గ్రీకు భాషలోని శరీరాంగాన్ని సూచించే స్పష్టమైన పదప్రయోగాన్ని నిలుపుతూ, తెలుగు నుడికారమైన ‘కన్నులెత్తి’లో స్వామ్యభావం సహజంగానే వ్యక్తమవుతుంది.
- source_word: εἶδον
  choice: చూడలేదు
  rationale: ὁράω యొక్క సాధారణ దృశ్యార్థాన్ని నిలుపుతుంది. οὐδένα అనే నిషేధాత్మక కర్మతో కలిసి తెలుగులో సహజంగా నిషేధ క్రియారూపం వాడబడింది.
- source_word: οὐδένα
  choice: మరెవరినీ
  rationale: εἰ μὴ తరువాత పేర్కొన్న మినహాయింపుతో కలిపి, ‘మరెవరినీ ... లేదు’ అనేది స్పష్టమైన, సహజమైన తెలుగు నిర్మాణం.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: నిషేధ వాక్యం తరువాత εἰ μὴ ఇక్కడ మినహాయింపును సూచిస్తుంది; ‘తప్ప’ దానికి నేరమైన తెలుగు సమానం.
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: యేసు ఒక్కడిని
  rationale: Ἰησοῦν అనే పేరును సాధారణ తెలుగు రూపంలో ఇస్తూ, αὐτόν మరియు μόνον కలిగించే బలమైన ప్రత్యేకతను ‘ఒక్కడిని’ ద్వారా సహజంగా వ్యక్తం చేసింది.
theological_decisions:
- issue: దర్శనం ముగిసిన తరువాత కనిపించిన ఏకైక వ్యక్తిగా యేసుపై ఉన్న బలమైన దృష్టి
  choice: ‘యేసు ఒక్కడిని తప్ప మరెవరినీ’ అని ప్రత్యేకతను నిలుపడం
  alternative: ‘యేసును తప్ప మరెవరినీ’ లేదా ‘యేసును మాత్రమే చూశారు’
  rationale: గ్రీకు పాఠం εἰ μὴ + αὐτόν + μόνον అనే సమీకృత నిర్మాణంతో యేసు మాత్రమే కనిపించాడని బలంగా చెబుతుంది. ‘ఒక్కడిని’ ఆ బలాన్ని నిలుపుతుంది; అదే సమయంలో మోషే, ఏలీయా ఇక కనిపించలేదనే కథనార్థానికి మించిన సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ‘కన్నులెత్తి చూసినప్పుడు’ అనే నుడికారాన్ని ఉపయోగించాం. వాక్యం సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గ్రీకు పాఠంలోని ప్రత్యేక ఉద్ఘాటన తగ్గకుండా రూపొందించబడింది.
