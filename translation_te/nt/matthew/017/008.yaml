revisions:
- from: వారు కన్నులెత్తి చూసినప్పుడు, యేసు ఒక్కడిని తప్ప[a] మరెవరినీ చూడలేదు.
  to: వారు కన్నులెత్తి చూడగా, యేసు ఒక్కడినే[a] తప్ప మరెవరినీ చూడలేదు.
  rationale: The revision corrects the Telugu emphatic case form and renders the Greek participial construction more naturally. It retains the source text’s strong exclusivity while avoiding an unnatural reflexive interpretation of αὐτόν.
