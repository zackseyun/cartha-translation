id: MAT.19.10
reference: Matthew 19:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: te
  text: 'ఆయన శిష్యులు ఆయనతో ఇలా అన్నారు: “భర్తకు భార్యతో ఉన్న పరిస్థితి[a] ఇలాంటిదైతే, పెళ్లి చేసుకోవడం ప్రయోజనకరం కాదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భర్తకు భార్యతో ఉన్న విషయం.” గ్రీకు పదబంధం సంక్షిప్తంగా ఉంది; ‘పరిస్థితి’కి బదులుగా ‘విషయం’ లేదా ‘స్థితి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ οἱ μαθηταί
  choice: ఆయన శిష్యులు ఆయనతో ... అన్నారు
  rationale: కథనంలోని గ్రీకు వర్తమాన కాలాన్ని తెలుగులో సహజమైన భూతకాల కథనంగా ఇచ్చాం; μαθηταίకు సువార్తల్లో స్థిరపడిన ‘శిష్యులు’ వాడాం.
- source_word: Εἰ οὕτως ἐστὶν
  choice: ఇలాంటిదైతే
  rationale: ముందు చెప్పిన బోధను సూచిస్తూ ఉన్న οὕτως యొక్క షరతు భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ αἰτία
  choice: పరిస్థితి
  rationale: ఇక్కడ αἰτία కచ్చితంగా ‘కారణం’ అని కాక, విషయం లేదా స్థితిగతులు అనే విస్తృత భావంలో ఉంది; ‘పరిస్థితి’ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: τοῦ ἀνθρώπου μετὰ τῆς γυναικός
  choice: భార్యతో భర్తకున్న
  rationale: వివాహ సందర్భంలో ἄνθρωπος పురుషుణ్ణి, γυνή భార్యను సూచిస్తున్నాయి. తెలుగు వాక్యంలో సంబంధాన్ని స్పష్టంగా, సహజంగా చెప్పడానికి ‘భర్త’ మరియు ‘భార్య’ వాడాం.
- source_word: οὐ συμφέρει
  choice: ప్రయోజనకరం కాదు
  rationale: συμφέρειలోని ప్రయోజనం లేదా మేలు అనే భావాన్ని నేరుగా నిలుపుతుంది; ‘మంచిది కాదు’ కంటే మూలపదానికి సమీపంగా ఉంది.
- source_word: γαμῆσαι
  choice: పెళ్లి చేసుకోవడం
  rationale: ‘వివాహం చేసుకోవడం’ కంటే సాధారణ పాఠకులకు సహజంగా ఉండి, ఆధునిక ప్రమాణ తెలుగులో గౌరవప్రదంగానే ఉంటుంది.
theological_decisions:
- issue: ἀνθρώπου ... γυναικός లో లింగసూచక భాష
  choice: భార్యతో భర్తకున్న
  alternative: ఒక వ్యక్తికి తన జీవిత భాగస్వామితో ఉన్న
  rationale: తక్షణ సందర్భం పురుషుడు–భార్య వివాహ సంబంధం గురించి మాట్లాడుతుంది. మూలంలోని లింగసూచనను తటస్థీకరించకుండా నిలిపాం.
- issue: శిష్యుల మాటలోని విలువనిర్ణయం
  choice: పెళ్లి చేసుకోవడం ప్రయోజనకరం కాదు
  alternative: పెళ్లి చేసుకోకపోవడమే మంచిది
  rationale: ప్రత్యామ్నాయం మూలంలోని ప్రతికూల ప్రయోజన భావాన్ని సానుకూల సలహాగా మార్చి మరింత వ్యాఖ్యానిస్తుంది. ఎంచుకున్న రూపం శిష్యుల మాటలోని ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. పాదసూచిక గుర్తును సంబంధిత వాక్యం ముగింపులో ఉంచాం.
