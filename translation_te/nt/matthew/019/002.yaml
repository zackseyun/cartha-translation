translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, కథన శైలికి తగిన గౌరవప్రదమైన భాష. మూలంలోని సరళమైన వరుస చర్యలను సహజ తెలుగు వాక్యనిర్మాణంలో నిలిపాం.
