  text: Τίμα τὸν πατέρα καὶ τὴν μητέρα, καὶ Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: te
  text: “నీ తండ్రినీ తల్లినీ గౌరవించు;[a] నిన్ను నీవు ప్రేమించుకున్నట్లే నీ పొరుగువానిని ప్రేమించు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'రూపానికి మరింత దగ్గరగా: “నీ తండ్రినీ తల్లినీ గౌరవించు; నిన్ను నీవు ప్రేమించుకున్నట్లే నీ పొరుగువానిని ప్రేమిస్తావు.”'
    reason: గ్రీకులో మొదటి క్రియ ఆజ్ఞార్థక రూపంలో ఉండగా, రెండవది తోరా ఆజ్ఞా శైలిలోని భవిష్యత్ సూచనార్థక రూపంలో ఉంది.
lexical_decisions:
- source_word: Τίμα
  choice: గౌరవించు
  rationale: ఇది కేవలం మనసులోని ఆదరాన్ని కాక, తల్లిదండ్రులకు ఇవ్వవలసిన తగిన గౌరవాన్ని సూచించే ఆజ్ఞ; పది ఆజ్ఞల ప్రతిధ్వనిని కూడా నిలుపుతుంది.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: నీ తండ్రిని, తల్లిని
  rationale: గ్రీకులో స్వామ్యసర్వనామం లేకపోయినా, పది ఆజ్ఞల సందర్భంలో ప్రత్యక్ష సంబోధన భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేయడానికి “నీ” ఉపయోగించబడింది.
- source_word: Ἀγαπήσεις
  choice: ప్రేమించు
  rationale: తోరా ఆజ్ఞను ఉటంకించడంలో గ్రీకు భవిష్యత్ సూచనార్థక రూపాన్ని వాడింది. ఈ ఆజ్ఞల జాబితాలో తెలుగులో ఆజ్ఞార్థక రూపం సహజంగా ఉండి, ఆజ్ఞాబలాన్ని స్పష్టంగా నిలుపుతుంది; రూపపరంగా దగ్గరైన పఠనం పాదసూచికలో ఇవ్వబడింది.
- source_word: τὸν πλησίον σου
  choice: నీ పొరుగువానిని
  rationale: ఈ నైతిక సందర్భంలో πλησίον అనేది కేవలం దగ్గరలో నివసించే వ్యక్తినే కాక, మన సంబంధ పరిధిలోని తోటి వ్యక్తిని సూచిస్తుంది; “పొరుగువాడు” స్థిరపడిన బైబిలు పదప్రయోగం.
- source_word: ὡς σεαυτόν
  choice: నిన్ను నీవు ప్రేమించుకున్నట్లే
  rationale: గ్రీకు పోలికలో “ప్రేమించు” అనే క్రియ అధ్యాహారంగా ఉంది. తెలుగులో అర్థం సహజంగా, స్పష్టంగా ఉండేందుకు దాన్ని వ్యక్తం చేస్తూ పోలికను యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: ఉటంకించిన ఆజ్ఞలలో ఆజ్ఞార్థక రూపం మరియు భవిష్యత్ సూచనార్థక రూపం
  choice: 'ప్రధాన పాఠ్యంలో రెండు క్రియలనూ ప్రత్యక్ష ఆజ్ఞలుగా ఇవ్వడం: “గౌరవించు … ప్రేమించు.”'
  alternative: “నీ తండ్రిని, తల్లిని గౌరవించు; నిన్ను నీవు ప్రేమించుకున్నట్లే నీ పొరుగువానిని ప్రేమిస్తావు.”
  rationale: గ్రీకు పాఠ్యం Τίμα అనే ఆజ్ఞార్థక రూపంతో Ἀγαπήσεις అనే భవిష్యత్ సూచనార్థక రూపాన్ని కలిపి వాడుతుంది; రెండవది తోరా ఆజ్ఞా శైలికి చెందినది. ఆధునిక తెలుగులో “ప్రేమిస్తావు” అనేది ఆజ్ఞకన్నా ముందస్తు ప్రకటనలా వినిపించే అవకాశం ఉన్నందున ప్రధాన పాఠ్యంలో ఆజ్ఞార్థకం వాడబడింది. అయితే మూలంలోని రూపభేదం పాదసూచికలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ప్రత్యక్ష ఆజ్ఞా శైలి ఉపయోగించబడింది. “పొరుగువాడు” స్థిరపడిన బైబిలు పదప్రయోగం కావడంతో నిలుపబడింది.
