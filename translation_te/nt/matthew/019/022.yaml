id: MAT.19.22
reference: Matthew 19:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: te
  text: అయితే ఆ యువకుడు ఆ మాట విని దుఃఖిస్తూ వెళ్లిపోయాడు; ఎందుకంటే అతనికి చాలా ఆస్తిపాస్తులు ఉండేవి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: విని
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది; తెలుగులో ‘విని’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి యేసు మాటకు యువకుని ప్రతికూల స్పందనను చూపే స్వల్ప వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: νεανίσκος
  choice: యువకుడు
  rationale: గ్రీకు పదం ‘యువకుడు’ అనే అర్థమే ఇస్తుంది; సమాంతర వృత్తాంతం నుంచి ‘అధికారి’ అనే గుర్తింపును చేర్చలేదు.
- source_word: τὸν λόγον
  choice: ఆ మాట
  rationale: ఇక్కడ λόγος యేసు అంతకుముందు పలికిన మాటను సూచిస్తుంది; ‘ఆ మాట’ ఆధునిక తెలుగులో సహజంగా, సందర్భానికి స్పష్టంగా ఉంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లిపోయాడు
  rationale: అక్కడి నుంచి వెళ్లిపోవడాన్ని తెలిపే సాధారణ కథన క్రియకు ఇది సహజమైన తెలుగు రూపం.
- source_word: λυπούμενος
  choice: దుఃఖిస్తూ
  rationale: వర్తమాన కృదంతం అతడు వెళ్లేటప్పుడు కొనసాగుతున్న దుఃఖస్థితిని లేదా విధానాన్ని తెలియజేస్తుంది.
- source_word: ἦν γὰρ ἔχων
  choice: ఎందుకంటే అతనికి ... ఉండేవి
  rationale: కొనసాగుతున్న స్వాధీనస్థితిని సూచించే పరిభాషాత్మక ఇంపర్ఫెక్ట్‌ను సహజ తెలుగులో కారణవాక్యంగా వ్యక్తం చేసింది.
- source_word: κτήματα πολλά
  choice: చాలా ఆస్తిపాస్తులు
  rationale: κτήματα సొత్తు లేదా ఆస్తులను, πολλά వాటి అధిక పరిమాణాన్ని సూచిస్తాయి; ‘చాలా ఆస్తిపాస్తులు’ సాధారణ పాఠకుడికి సహజంగా రెండింటినీ అందిస్తుంది.
theological_decisions:
- issue: సమాంతర వృత్తాంతం ఆధారంగా ‘అధికారి’ అనే గుర్తింపును చేర్చాలా
  choice: νεανίσκος‌ను కేవలం ‘యువకుడు’గా అనువదించడం
  alternative: యువ అధికారి
  rationale: మత్తయి వచనం అతణ్ణి యువకుడిగానే పేర్కొంటుంది. ‘అధికారి’ అని చేర్చడం లూకా వృత్తాంతంతో సమన్వయం చేయడమే అవుతుంది; మూలపాఠాన్ని నేరుగా అనువదించడం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గౌరవప్రదమైన కథన శైలి. మూలంలోని చర్యల క్రమం, దుఃఖం కొనసాగుతున్న భావం, ఆస్తుల అధిక పరిమాణం నిలుపబడ్డాయి.
