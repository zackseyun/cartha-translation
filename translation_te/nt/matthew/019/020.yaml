  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: te
  text: ఆ యువకుడు ఆయనతో ఇలా అన్నాడు, “ఇవన్నీ నేను పాటించాను[a]. నాకు ఇంకా ఏ లోటు ఉంది[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇవన్నీ నేను గైకొన్నాను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “నేను ఇంకా ఏ విషయంలో వెనుకబడి ఉన్నాను?”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకు కథన వర్తమాన కాలాన్ని ఆధునిక తెలుగు కథనంలో సహజమైన భూతకాలంతో వ్యక్తపరచడం జరిగింది; సంఘటన క్రమం స్పష్టంగా ఉంటుంది.
- source_word: αὐτῷ
  choice: ఆయనతో
  rationale: ‘అతనితో’ అనే భావాన్ని సందర్భంలోని యేసుకు గౌరవసూచకంగా, తెలుగులో సహజంగా ‘ఆయనతో’ అని ఇచ్చాం.
- source_word: ὁ νεανίσκος
  choice: ఆ యువకుడు
  rationale: νεανίσκος అంటే యువకుడు; ఈ వచనంలో లేని ‘అధికారి’ వంటి వివరాన్ని చేర్చలేదు.
- source_word: Πάντα ταῦτα
  choice: ఇవన్నీ
  rationale: ఇంతకుముందు పేర్కొన్న ఆజ్ఞలన్నిటినీ సూచించే సంక్షిప్తమైన, సహజమైన తెలుగు రూపం.
- source_word: ἐφύλαξα
  choice: నేను పాటించాను
  rationale: ఆజ్ఞలను φυλάσσω చేయడం అంటే వాటిని పాటించడం లేదా గైకొనడం; ఆధునిక సాధారణ తెలుగులో ‘పాటించాను’ స్పష్టంగా ఉంటుంది.
- source_word: τί ἔτι ὑστερῶ
  choice: నాకు ఇంకా ఏమి కొదువగా ఉంది?
  rationale: ὑστερέω లోని కొదువ లేదా లోపం అనే భావాన్ని నిలుపుతూ, ప్రశ్నను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఆజ్ఞలను పాటించాననే యువకుని స్వీయ అంచనా
  choice: యువకుని వాదనను అనుకూలతగానీ వ్యంగ్యంగానీ సూచించకుండా నేరుగా అందించడం
  alternative: అతని మాట పొరపాటు లేదా అతిశయోక్తి అని అనువాదంలోనే సూచించడం
  rationale: గ్రీకు వాక్యం అతని మాటను సూటిగా నమోదు చేస్తుంది; దాని నిజానిజాలపై తీర్పును పరిసర కథనానికే వదిలివేయాలి.
- issue: ὑστερῶ యొక్క భావవ్యాప్తి
  choice: ‘కొదువగా ఉంది’
  alternative: ‘ఏ విషయంలో వెనుకబడి ఉన్నాను?’ లేదా ‘నాలో ఇంకా ఏమి లోపించింది?’
  rationale: ఈ పదానికి ‘కొదువ కలిగి ఉండడం’ మరియు ‘వెనుకబడడం’ అనే రెండింటి ఛాయలున్నాయి; ప్రధాన పాఠం లోపం అనే సహజ భావాన్ని ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘గైకొన్నాను’ కంటే ప్రస్తుత వాడుకలో సహజమైన ‘పాటించాను’ ప్రధాన పాఠంలో వాడబడింది; మూలంలోని భావ ఛాయలు పాదటిప్పణుల్లో నిలుపబడ్డాయి.
