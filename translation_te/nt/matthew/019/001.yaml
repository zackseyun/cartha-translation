  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: te
  text: యేసు ఈ మాటలు చెప్పడం ముగించినప్పుడు, ఆయన గలిలయను విడిచి, యొర్దాను నదికి అవతల ఉన్న యూదయ ప్రాంతానికి వచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యొర్దాను నదిని దాటి యూదయ ప్రాంతానికి.”
    reason: పέραν τοῦ Ἰορδάνου ను యూదయ ప్రాంతపు భౌగోళిక స్థానాన్ని సూచించేదిగా కాక, యొర్దాను దాటడాన్ని సూచించే ప్రయాణ-సంబంధ ప్రత్యామ్నాయంగా అర్థం చేసుకోవచ్చు.
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: —
  rationale: మత్తయి వాడే ఈ కథన సంధిని తెలుగులో ప్రత్యేకంగా అనువదిస్తే అసహజంగా ఉంటుంది; కాలవాచక ఉపవాక్యంతోనే తదుపరి సంఘటనకు సహజంగా మార్పు చూపబడింది.
- source_word: ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους
  choice: యేసు ఈ మాటలు చెప్పడం ముగించినప్పుడు
  rationale: ముందటి బోధ పూర్తయిన తర్వాతి చర్యను సూచిస్తుంది. λόγους ను సందర్భానుసారంగా ‘మాటలు’ అని అనువదించి, తెలుగులో సహజత్వం కోసం ‘చెప్పడం’ చేర్చబడింది.
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: ఆయన గలిలయను విడిచి
  rationale: ప్రదేశం నుంచి బయలుదేరడాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας
  choice: యూదయ ప్రాంతానికి వచ్చాడు
  rationale: ὅρια ఇక్కడ సరిహద్దు రేఖకన్నా భూభాగం లేదా ప్రాంతాన్ని సూచిస్తుంది; ‘ప్రాంతం’ ప్రయాణ సందర్భంలో స్పష్టంగా ఉంటుంది.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: యొర్దాను నదికి అవతల ఉన్న
  rationale: πέραν యొక్క ‘అవతల/ఆవలి వైపు’ అనే భౌగోళిక భావాన్ని స్పష్టంగా నిలుపుతుంది; తెలుగు పాఠకులకు యొర్దాను ఒక నది అని తెలియజేయడానికి ‘నది’ చేర్చబడింది.
