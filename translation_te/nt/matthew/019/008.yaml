  revised_text: 'ఆయన వారితో ఇలా అన్నాడు: “మీ హృదయకాఠిన్యాన్ని బట్టి మోషే మీ భార్యలకు విడాకులివ్వడానికి[a] మిమ్మల్ని అనుమతించాడు; అయితే ఆరంభం నుండి అలా లేదు.”'
