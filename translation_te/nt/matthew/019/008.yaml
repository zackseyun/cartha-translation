id: MAT.19.8
reference: Matthew 19:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అన్నాడు: “మీ హృదయకాఠిన్యాన్ని బట్టి మోషే మీ భార్యలకు విడాకులివ్వడానికి[a] మిమ్మల్ని అనుమతించాడు; అయితే ఆరంభం నుండి అలా లేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ భార్యలను పంపివేయడానికి”; ఈ సందర్భంలో దీని అర్థం విడాకులివ్వడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, ఆధునిక తెలుగు కథన శైలిలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: మీ హృదయకాఠిన్యాన్ని బట్టి
  rationale: πρός ఇక్కడ కారణం లేదా పరిస్థితిని సూచిస్తుంది. ఈ రూపం కారణార్థాన్ని స్పష్టంగా తెలుపుతూ బైబిలీయ ‘హృదయకాఠిన్యం’ అనే చిత్రణను నిలుపుతుంది.
- source_word: ἐπέτρεψεν
  choice: అనుమతించాడు
  rationale: ఇది ఆజ్ఞాపించడాన్ని లేదా సమర్థించడాన్ని కాకుండా అనుమతి ఇవ్వడాన్ని సూచిస్తుంది.
- source_word: ἀπολῦσαι
  choice: విడాకులు ఇవ్వడానికి
  rationale: వివాహ సందర్భంలో ఈ క్రియ సాధారణంగా పంపివేయడం కాకుండా వివాహ బంధాన్ని రద్దు చేయడాన్ని సూచిస్తుంది.
- source_word: τὰς γυναῖκας ὑμῶν
  choice: మీ భార్యలకు
  rationale: సందర్భం వివాహం, విడాకుల గురించి కాబట్టి γυνή ఇక్కడ ‘భార్య’ అనే అర్థంలో ఉంది.
- source_word: ἀπ’ ἀρχῆς
  choice: ఆరంభం నుండి
  rationale: ఇది సృష్టి ఆరంభానికి ఉన్న సందర్భోచిత సూచనను విస్తరించకుండా సహజంగా నిలుపుతుంది.
- source_word: οὐ γέγονεν οὕτως
  choice: అలా లేదు
  rationale: γέγονεν సూచించే కొనసాగుతున్న స్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘దేవుని రూపకల్పన’ వంటి వివరణను పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: మోషే చర్యను ఆజ్ఞగా, రాయితీగా, లేక అనుమతిగా చూపాలా
  choice: మోషే ... అనుమతించాడు
  alternative: మోషే ... ఆజ్ఞాపించాడు
  rationale: ἐπέτρεψεν అనుమతిని సూచిస్తుంది, ఆజ్ఞను కాదు. యేసు వాదనలో ఇది మానవ హృదయకాఠిన్యాన్ని బట్టి ఇచ్చిన అనుమతి.
- issue: సృష్టి ఆరంభానికి యేసు చేసిన సూచనను మరింత స్పష్టీకరించాలా
  choice: అయితే ఆరంభం నుండి అలా లేదు
  alternative: అయితే సృష్టి ఆరంభంలో దేవుని ఉద్దేశం అది కాదు
  rationale: ఎంచుకున్న రూపం గ్రీకు పాఠ్యంలోని సంక్షిప్తతను, సందర్భానుసారమైన సూచనను నిలుపుతుంది; పాఠ్యంలో వ్యాఖ్యానాత్మక విస్తరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన-బోధనా శైలి. ‘హృదయకాఠిన్యం’ బైబిలీయ రూపకాన్ని నిలుపుతుంది; ‘విడాకులు ఇవ్వడం’ సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
