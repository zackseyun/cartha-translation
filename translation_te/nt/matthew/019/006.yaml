id: MAT.19.6
reference: Matthew 19:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: te
  text: కాబట్టి వారు ఇక ఇద్దరు కాదు; ఒకే శరీరం. అందువల్ల దేవుడు జతపరచినదాన్ని ఏ మనిషీ విడదీయకూడదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి వాక్యంలో ఇద్దరూ ఒకే శరీరమవుతారనే మాట నుంచి వచ్చే ఫలితాన్ని సహజంగా సూచిస్తుంది.
- source_word: οὐκέτι εἰσὶν δύο
  choice: వారు ఇక ఇద్దరు కాదు
  rationale: కాలసంబంధమైన నిరాకరణను, ‘ఒకే శరీరం’తో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: σὰρξ μία
  choice: ఒకే శరీరం
  rationale: ఆదికాండంలోని వివాహ భాషను ప్రతిధ్వనింపజేస్తూ, తెలుగులో స్థిరమైన బైబిలు నుడికారాన్ని నిలుపుతుంది.
- source_word: ὃ οὖν
  choice: అందువల్ల … దాన్ని
  rationale: οὖν యొక్క నిర్ధారణాత్మక భావాన్ని ‘అందువల్ల’ తెలియజేస్తుంది; నపుంసక సంబంధ సర్వనామం సూచించే కలయికను ‘దాన్ని’ సహజంగా తిరిగి సూచిస్తుంది.
- source_word: συνέζευξεν
  choice: జతపరచిన
  rationale: కలిపి ఒకటిగా చేసిన చర్యను వివాహ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని యోకు రూపకాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: ἄνθρωπος
  choice: ఏ మనిషీ
  rationale: ఏ మానవుడైనా అనే సాధారణ, సమగ్ర భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: μὴ χωριζέτω
  choice: విడదీయకూడదు
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞలోని నిషేధ బలాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: వివాహ ఐక్యతకు సంబంధించిన σὰρξ μία అనే ఆదికాండ ప్రతిధ్వని
  choice: ఒకే శరీరం
  alternative: ఒకే దేహం
  rationale: మూలంలోని రూపకాన్ని, ఆదికాండంతో ఉన్న అంతర్గ్రంథ సంబంధాన్ని కాపాడుతుంది; అదనపు సిద్ధాంత వివరణను చేర్చదు.
- issue: ἄνθρωπος యొక్క సాధారణ మానవార్థం
  choice: ఏ మనిషీ
  alternative: మనిషి
  rationale: గ్రీకు ఏకవచన రూపాన్ని గౌరవిస్తూ, నిషేధం ఏ మానవునికైనా వర్తిస్తుందని తెలుగు సందర్భంలో అపార్థం లేకుండా తెలియజేస్తుంది.
- issue: దేవుడు ఏర్పరచిన వివాహ కలయికను విడదీయరాదనే నిషేధం
  choice: దేవుడు జతపరచినదాన్ని ఏ మనిషీ విడదీయకూడదు
  alternative: దేవుడు జతపరచినదాన్ని మనిషి వేరుచేయకూడదు
  rationale: కర్త, కర్మ, నిషేధం అన్నిటినీ మూలానికి దగ్గరగా, సహజమైన ఆధునిక తెలుగులో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన బైబిలు శైలి. వాక్యం మూలంలోని ఫలిత–నిర్ధారణ క్రమాన్ని, ‘ఇద్దరు/ఒకే శరీరం’ వ్యత్యాసాన్ని నిలుపుతుంది.
