id: MAT.19.26
reference: Matthew 19:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: te
  text: 'అయితే యేసు వారివైపు చూసి వారితో ఇలా అన్నాడు: “మనుషులకు[a] ఇది అసాధ్యం; కానీ దేవునికి అన్నీ సాధ్యమే.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనుషుల విషయంలో ఇది అసాధ్యం.”
    reason: παρὰ ἀνθρώποις అనే పదబంధం సంబంధం లేదా పరిధి అనే భావంతో కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: ἐμβλέψας
  choice: వారివైపు చూసి
  rationale: ఎవరినైనా ఉద్దేశించి దృష్టి నిలపడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘తేరి చూసి’ అని అనవసరంగా తీవ్రతను పెంచదు.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి సందర్భానికి స్వల్ప వ్యత్యాసంతో కూడిన కొనసాగింపును సూచిస్తుంది.
- source_word: εἶπεν αὐτοῖς
  choice: వారితో ఇలా అన్నాడు
  rationale: గ్రీకులో స్పష్టంగా ఉన్న αὐτοῖςను నిలుపుతూ, తరువాత వచ్చే ప్రత్యక్ష వాక్యాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: παρὰ ἀνθρώποις
  choice: మనుషులకు
  rationale: παρά + సంప్రదాన విభక్తి సూచించే పరిధి లేదా సంబంధాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది. ఇక్కడ ἄνθρωποις మానవులందరినీ సాధారణంగా సూచిస్తుంది.
- source_word: τοῦτο
  choice: ఇది
  rationale: ముందు ప్రస్తావించిన విషయాన్ని సూచించే నిర్దేశక సర్వనామానికి నేరమైన, సహజమైన సమానం.
- source_word: ἀδύνατόν ἐστιν
  choice: అసాధ్యం
  rationale: గ్రీకు విధేయ విశేషణ భావాన్ని తెలుగులో స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: παρὰ δὲ θεῷ
  choice: కానీ దేవునికి
  rationale: మొదటి παρά నిర్మాణంతో ఉన్న వాక్య సమతూకాన్ని కాపాడుతూ, మనుషులు–దేవుడు అనే వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: πάντα δυνατά
  choice: అన్నీ సాధ్యమే
  rationale: πάντα యొక్క సమగ్ర బహువచన భావాన్నీ, δυνατά యొక్క సాధ్యత భావాన్నీ సహజమైన తెలుగు నానుడి రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: ἀνθρώποις అనే సాధారణ మానవ సూచనను అనువదించడం
  choice: మనుషులకు
  alternative: మానవులకు / మనుషుల విషయంలో
  rationale: గ్రీకు రూపం వ్యాకరణపరంగా పుంలింగ బహువచనమైనా, సందర్భంలో అది స్త్రీపురుష భేదం లేకుండా మానవులందరినీ సూచిస్తుంది. ‘మనుషులకు’ ఆధునిక తెలుగులో సహజంగానూ సమగ్రంగానూ ఉంది; పాఠం చెప్పేదానికంటే ప్రత్యేక సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన మరియు సంక్షిప్తమైన శైలి ఉపయోగించబడింది. గ్రీకు వాక్యంలో ఉన్న మనుషులు–దేవుడు అనే సమాంతర వ్యత్యాసం నిలుపబడింది.
