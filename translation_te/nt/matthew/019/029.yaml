id: MAT.19.29
reference: Matthew 19:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: te
  text: నా నామం కోసం ఇళ్లనైనా, అన్నదమ్ములనైనా, అక్కచెల్లెళ్లనైనా, తండ్రినైనా, తల్లినైనా, భార్యనైనా, పిల్లలనైనా, పొలాలనైనా విడిచిపెట్టిన ప్రతి ఒక్కరూ వంద రెట్లు[a] పొందుతారు, నిత్యజీవాన్ని వారసత్వంగా పొందుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నూరంతలు.”
    reason: ‘వంద రెట్లు’కు సంప్రదాయ బైబిలు-శైలి ప్రత్యామ్నాయాన్ని అందిస్తుంది.
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: ప్రతి ఒక్కరూ
  rationale: ఈ పదబంధంలోని విభజనాత్మకమైన, సార్వత్రికమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀφῆκεν
  choice: విడిచిపెట్టిన
  rationale: శిష్యత్వం నిమిత్తం సంబంధాలు లేదా ఆస్తులను వెనుక విడిచివేయడాన్ని సూచిస్తుంది; ‘త్యజించిన’ కంటే తక్కువ వ్యాఖ్యానభారం కలిగి ఉంది.
- source_word: οἰκίας
  choice: ఇళ్లను
  rationale: పొలాలతోపాటు పేర్కొన్న స్థిరాస్తి/గృహ వనరుల concrete భావాన్ని నిలుపుతుంది.
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: అన్నదమ్ములు / అక్కచెల్లెళ్లు
  rationale: గ్రీకులో వేర్వేరుగా ఉన్న పురుష, స్త్రీ సహోదర పదాలను తెలుగులో సహజమైన బంధుత్వ పదాలతో వేరు చేస్తుంది.
- source_word: γυναῖκα
  choice: భార్యను
  rationale: కుటుంబ సంబంధాల జాబితాలో ‘స్త్రీ’ అనే సాధారణ అర్థం కంటే దాంపత్య సంబంధమే సందర్భానుకూలం.
- source_word: ἀγρούς
  choice: పొలాలను
  rationale: వ్యవసాయ భూములనే స్పష్టమైన ఆర్థిక/ఆస్తి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: నా నామం కోసం
  rationale: యేసు వ్యక్తి, అధికారం, గుర్తింపుపట్ల నిబద్ధతను సూచించే ‘నామం’ అనే మూలపాఠ రూపకాన్ని నిలుపుతుంది.
- source_word: ἑκατονταπλασίονα
  choice: నూరంతలు
  rationale: పరిమాణాత్మకమైన ‘వంద రెట్లు’ భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది; ఇది తిరిగి పొందే వస్తువులను ఒక్కొక్కటిగా నిర్దిష్టం చేయదు.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: నిత్యజీవాన్ని వారసత్వంగా పొందుతారు
  rationale: κληρονομέω లోని వారసత్వ భావాన్ని నిలుపుతూ, వాగ్దాన స్వరాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: γυνή పదాన్ని శిష్యత్వం కోసం విడిచే కుటుంబ సంబంధాల జాబితాలో అనువదించడం
  choice: భార్య
  alternative: స్త్రీ
  rationale: సందర్భం కుటుంబ సభ్యులు, గృహాలు, పొలాల జాబితా కాబట్టి దాంపత్య సంబంధం ఉద్దేశించబడింది; సాధారణంగా స్త్రీలను విడిచిపెట్టాలనే భావం రాకుండా ఉంటుంది.
- issue: ἕνεκεν τοῦ ὀνόματός μου లోని ‘నామం’ రూపకం
  choice: నా నామం కోసం
  alternative: నా కోసం / నా కారణంగా
  rationale: మూలంలోని నామ-భాషను, దానిలోని వ్యక్తి, అధికారం, ప్రకటిత గుర్తింపు సంబంధమైన తాత్త్విక బరువును తొలగించకుండా నిలుపుతుంది.
- issue: ἑκατονταπλασίονα వాగ్దానం
  choice: నూరంతలు
  alternative: వంద రెట్లు ఎక్కువగా
  rationale: మూలంలోని బలమైన పరిమాణ భావాన్ని నిలుపుతుంది; ప్రతిఫల స్వరూపం లేదా కాలాన్ని అనువాదంలో అదనంగా నిర్వచించదు.
- issue: κληρονομήσει లోని వారసత్వ భావం
  choice: వారసత్వంగా పొందుతారు
  alternative: పొందుతారు
  rationale: నిత్యజీవం కేవలం సంపాదనగా కాక వాగ్దానిత వారసత్వంగా చిత్రించబడిన మూలపాఠ భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. జాబితాలో పునరావృతమయ్యే ‘నైనా’ మూలంలోని ἢ (‘లేదా’) నిర్మాణాన్ని సహజంగా ప్రతిబింబిస్తుంది. ప్రధాన క్రియలు బహువచన గౌరవ/సార్వత్రిక సరిపోలికతో ఉన్నాయి.
