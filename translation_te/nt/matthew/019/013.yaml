id: MAT.19.13
reference: Matthew 19:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: te
  text: అప్పుడు ఆయన వారిమీద చేతులు ఉంచి ప్రార్థించాలనే ఉద్దేశంతో పిల్లలను ఆయన దగ్గరకు తీసుకువచ్చారు. అయితే శిష్యులు వారిని గద్దించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారిని’ అనేది పిల్లలను గానీ, పిల్లలను తీసుకువచ్చినవారిని గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: కథనంలోని సంఘటనల క్రమాన్ని సహజంగా సూచిస్తుంది.
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: కొందరు పిల్లలను ఆయన దగ్గరికి తీసుకొచ్చారు
  rationale: గ్రీకు కర్మణి రూపాన్ని తెలుగులో సహజమైన కర్తరి వాక్యంగా మార్చింది; తెలియని తీసుకొచ్చినవారిని ‘కొందరు’ అని సూచిస్తూ పిల్లలపై ప్రధాన దృష్టిని నిలుపుతుంది.
- source_word: ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: ఆయన వారిమీద చేతులు ఉంచి
  rationale: ఉద్దేశార్థాన్ని తరువాతి ‘ప్రార్థించాలని’తో కలిపి తెలుగులో సహజంగా వ్యక్తం చేస్తూ, బహువచనమైన ‘చేతులు’ను నిలుపుతుంది.
- source_word: καὶ προσεύξηται
  choice: ప్రార్థించాలని
  rationale: గ్రీకులో ప్రార్థనకు కర్మ స్పష్టంగా లేదు; అందువల్ల ‘వారికోసం’ వంటి అదనపు భావాన్ని చేర్చలేదు.
- source_word: οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς
  choice: అయితే శిష్యులు వారిని గద్దించారు
  rationale: δέలోని వ్యతిరేకతను ‘అయితే’ తెలియజేస్తుంది; ἐπιτιμάω యొక్క మందలింపు భావాన్ని ‘గద్దించారు’ సహజంగా అందిస్తుంది; ‘వారిని’ మూలంలోని అనిశ్చిత సూచనను నిలుపుతుంది.
theological_decisions:
- issue: చివరి αὐτοῖς ఎవరిని సూచిస్తుంది?
  choice: వారిని
  alternative: పిల్లలను; లేదా పిల్లలను తీసుకొచ్చినవారిని
  rationale: గ్రీకు సర్వనామం ఈ రెండు వర్గాల్లో దేనినైనా సూచించవచ్చు. ప్రధాన వాక్యంలో ‘వారిని’ అని ఉంచి ఆ నిజమైన సందిగ్ధతను పరిష్కరించకుండా నిలిపి, పాదసూచికలో వివరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. కర్మణి నిర్మాణాన్ని యాంత్రికంగా అనుసరించకుండా స్పష్టమైన తెలుగు వాక్యాలుగా తీర్చిదిద్దినా, ప్రార్థనకు కర్మను జోడించలేదు; చివరి సర్వనామంలోని సందిగ్ధతను పాదసూచికతో నిలిపాం.
