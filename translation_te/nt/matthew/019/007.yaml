id: MAT.19.7
reference: Matthew 19:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: te
  text: వారు ఆయనను, “అయితే విడాకుల పత్రం ఇచ్చి, ఆమెను పంపివేయాలని[a] మోషే ఎందుకు ఆజ్ఞాపించాడు?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెకు విడాకులు ఇవ్వాలని.” గ్రీకు క్రియకు “పంపివేయడం” అనే అర్థం ఉంది; ఈ సందర్భంలో అది భార్యకు విడాకులు ఇవ్వడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: వారు ఆయనతో … అని అడిగారు
  rationale: గ్రీకు కథనంలోని చారిత్రక వర్తమాన కాలాన్ని సహజమైన తెలుగు కథనరీతిలో భూతకాలంగా ఇచ్చాం; ప్రత్యక్ష ప్రశ్నను పరిచయం చేస్తున్నందున ‘అన్నారు’ కంటే ‘అడిగారు’ సహజంగా ఉంది.
- source_word: Τί οὖν
  choice: అయితే … ఎందుకు
  rationale: ముందటి మాటకు అభ్యంతరంగా వచ్చే ప్రశ్న యొక్క తార్కిక బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐνετείλατο
  choice: ఆజ్ఞాపించాడు
  rationale: మూలపదం ఆజ్ఞను సూచిస్తుంది. తదుపరి వచనంలోని యేసు సవరణను ముందుగానే చేర్చకుండా ప్రశ్నించినవారి వాదనను యథాతథంగా ఉంచుతుంది.
- source_word: δοῦναι βιβλίον ἀποστασίου
  choice: విడాకుల పత్రం ఇచ్చి
  rationale: ద్వితీయోపదేశకాండం 24:1 నేపథ్యంలోని చట్టబద్ధమైన లిఖిత పత్రాన్ని స్పష్టంగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: ఆమెను పంపివేయాలని
  rationale: ἀπολύω యొక్క ప్రాథమిక ‘పంపివేయడం’ భావాన్ని నిలుపుతూ, ముందున్న ‘విడాకుల పత్రం’ ద్వారా ఈ సందర్భంలోని విడాకుల అర్థం స్పష్టమవుతుంది.
theological_decisions:
- issue: ప్రశ్నించినవారి మాటను తదుపరి వచనంలోని యేసు సవరణతో ముందుగానే సమన్వయపరచాలా?
  choice: ‘ఆజ్ఞాపించాడు’ అని ఉంచడం
  alternative: ‘అనుమతించాడు’ లేదా ‘వీలు కల్పించాడు’
  rationale: ఇక్కడ గ్రీకు పాఠం స్పష్టంగా ‘ఆజ్ఞాపించాడు’ అని చెబుతుంది. మోషే ఇచ్చిన అనుమతి గురించి యేసు చేసే భేదాన్ని ఈ వచనంలోకి ముందుగానే దిగుమతి చేయకూడదు.
- issue: ἀπολῦσαι అనే క్రియను నేరుగా ‘విడాకులు ఇవ్వడం’గా స్పష్టీకరించాలా?
  choice: ప్రధాన పాఠంలో ‘పంపివేయడం’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘ఆమెకు విడాకులు ఇవ్వడం’
  rationale: మూలంలోని పదబంధాన్ని నిలుపుతుంది; అదే సమయంలో ‘విడాకుల పత్రం’ అనే సమీప పదబంధం చట్టపరమైన సందర్భాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన కథనశైలి. ‘విడాకుల పత్రం’ చట్టపరమైన భావాన్ని సహజంగా తెలియజేస్తుంది. మూలంలో లేని ‘మనకు’ వంటి పదం చేర్చలేదు. పాదసూచిక గుర్తు ప్రధాన పాఠంలో సంబంధిత వాక్యాంతంలో ఉంచబడింది.
