id: MAT.19.21
reference: Matthew 19:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: te
  text: యేసు అతనితో, “నీవు సంపూర్ణుడిగా[a] ఉండాలని కోరుకుంటే, వెళ్లి నీ ఆస్తులను అమ్మి పేదలకు ఇవ్వు; అప్పుడు పరలోకంలో నీకు నిధి ఉంటుంది. రా, నన్ను అనుసరించు” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిపూర్ణుడిగా” లేదా “పరిపక్వుడిగా.” గ్రీకు పదానికి “పరిపూర్ణుడు,” “సంపూర్ణుడు,” లేదా “పరిపక్వుడు” అనే అర్థాలు ఉండవచ్చు.
    reason: τέλειος యొక్క సందర్భానుసారమైన ప్రత్యామ్నాయ అర్థాలను నిలుపుతూ, గమనికను సంబంధిత పదానికే జతచేస్తుంది.
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: యేసు అతనితో ... అని అన్నాడు
  rationale: సాధారణ కథన శైలిని సహజమైన తెలుగు ప్రత్యక్ష సంభాషణ నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: τέλειος
  choice: సంపూర్ణుడు
  rationale: ఈ పదంలోని సంపూర్ణత, పూర్తితనం అనే భావాలను నిలుపుతూ, కేవలం పరిపక్వతగా లేదా పాపరహితత్వమనే సిద్ధాంతార్థంగా పరిమితం చేయదు.
- source_word: ὕπαγε πώλησόν σου τὰ ὑπάρχοντα
  choice: వెళ్లి నీ ఆస్తులను అమ్మి
  rationale: ఆజ్ఞల క్రమాన్ని, వ్యక్తికి చెందిన భౌతిక సంపదను స్పష్టంగా మరియు సహజంగా తెలియజేస్తుంది.
- source_word: δὸς πτωχοῖς
  choice: పేదలకు ఇవ్వు
  rationale: గ్రీకు విశేషణం నామవాచకార్థంలో ఉన్నందున పేద ప్రజలను సూచించే సహజ తెలుగు రూపం.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: పరలోకంలో నీకు నిధి ఉంటుంది
  rationale: గ్రీకులోని బహువచన ‘ఆకాశాలలో’ అనే రూపాన్ని తెలుగు బైబిలు సందర్భానికి సహజమైన ‘పరలోకంలో’గా వ్యక్తం చేస్తూ భావాన్ని నిలుపుతుంది.
- source_word: δεῦρο ἀκολούθει μοι
  choice: ఆ తరువాత వచ్చి నన్ను అనుసరించు
  rationale: రమ్మనే పిలుపును, ముందు చెప్పిన కార్యాల తరువాతి క్రమాన్ని, శిష్యత్వ భాషను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: τέλειος అనే పదం శిష్యత్వ సందర్భంలో సూచించే భావం
  choice: సంపూర్ణుడు
  alternative: పరిపూర్ణుడు; పరిపక్వుడు
  rationale: ‘సంపూర్ణుడు’ అనేది సంపూర్ణ అంకితభావం లేదా పూర్తితనం అనే సందర్భార్థాన్ని ఉంచుతుంది; అదే సమయంలో దానిని పాపరహిత నైతిక పరిపూర్ణతగానో కేవలం వయోజన పరిపక్వతగానో నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ఆజ్ఞల నేరుతనాన్ని నిలుపుతూ, అసహజమైన గ్రీకు వాక్యక్రమాన్ని అనుకరించలేదు.
