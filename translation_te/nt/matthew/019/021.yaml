review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the commands to go, sell possessions, give to the poor, and follow Jesus. ‘సంపూర్ణుడు’ suitably retains the broad sense of τέλειος without forcing either sinless perfection or mere maturity. Revising ‘సంపూర్ణుడివి కావాలని’ to ‘సంపూర్ణుడిగా ఉండాలని’ more directly represents εἶναι (‘to be’).
  naturalness: The draft is generally natural modern standard Telugu. ‘రా, నన్ను అనుసరించు’ is a more direct and idiomatic rendering of δεῦρο ἀκολούθει μοι than ‘ఆ తరువాత వచ్చి నన్ను అనుసరించు’; the sequence is adequately conveyed by the preceding commands and need not be made explicit.
  terminology: ‘పరలోకం’ and ‘నిధి’ are established, accessible biblical Telugu terms. ‘సంపూర్ణుడు’ is retained and supplied with a properly placed lexical note to preserve the viable nuances of τέλειος.
  issues:
  - severity: low
    issue: The infinitival expression is slightly unnatural and less exact.
    rationale: ‘నీవు సంపూర్ణుడివి కావాలని’ can be understood, but ‘నీవు సంపూర్ణుడిగా ఉండాలని’ naturally expresses ‘if you want to be τέλειος.’
  - severity: low
    issue: The final summons is somewhat over-paraphrased.
    rationale: ‘ఆ తరువాత వచ్చి’ adds an explicit temporal formulation not stated by δεῦρο. ‘రా, నన్ను అనుసరించు’ preserves the direct summons and the imperative force.
  revised_text: యేసు అతనితో, “నీవు సంపూర్ణుడిగా[a] ఉండాలని కోరుకుంటే, వెళ్లి నీ ఆస్తులను అమ్మి పేదలకు ఇవ్వు; అప్పుడు పరలోకంలో నీకు నిధి ఉంటుంది. రా, నన్ను అనుసరించు” అని అన్నాడు.
