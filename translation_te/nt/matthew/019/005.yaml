id: MAT.19.5
reference: Matthew 19:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: te
  text: 'ఆయన ఇలా చెప్పాడు: “ఈ కారణంగా పురుషుడు తన తండ్రిని, తల్లిని విడిచిపెట్టి తన భార్యతో ఏకమవుతాడు[a]; వారిద్దరూ ఒకే శరీరమవుతారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తన భార్యతో కలుస్తాడు,” లేదా “తన భార్యను అంటిపెట్టుకొని ఉంటాడు.” గ్రీకు క్రియ సన్నిహితమైన అనుబంధాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: ఈ కారణంగా
  rationale: కారణాన్ని సూచించే గ్రీకు పదబంధంలోని భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: καταλείψει
  choice: విడిచిపెట్టి
  rationale: తండ్రి తల్లిని విడిచిపోవడాన్ని సూచించే భవిష్యత్ క్రియను, తరువాతి క్రియతో సహజంగా అనుసంధానించే తెలుగు రూపం.
- source_word: ἄνθρωπος
  choice: పురుషుడు
  rationale: భార్యతో జతగా పేర్కొన్న వివాహ సందర్భంలో ఈ పుంలింగ ఏకవచనం పురుష భాగస్వామినే సూచిస్తుంది.
- source_word: κολληθήσεται
  choice: కలిసివుంటాడు
  rationale: సన్నిహితంగా జతచేయబడటం లేదా అంటిపెట్టుకొని ఉండటం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; కేవలం శారీరక చర్యగా పరిమితం చేయదు.
- source_word: γυναικὶ αὐτοῦ
  choice: తన భార్యతో
  rationale: వివాహ సందర్భంలో γυνή అంటే ‘భార్య’; తెలుగు క్రియానిర్మాణానికి అనుగుణంగా ‘తో’ విభక్తి వాడబడింది.
- source_word: οἱ δύο
  choice: వారిద్దరూ
  rationale: గ్రీకులో స్పష్టంగా ఉన్న ‘ఆ ఇద్దరు’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: εἰς σάρκα μίαν
  choice: ఒకే శరీరంగా అవుతారు
  rationale: εἰς సూచించే ఫలితస్థితిని ‘అవుతారు’ ద్వారా, σάρξ యొక్క వివాహ ఐక్యత భావాన్ని ‘ఒకే శరీరం’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: వివాహ ఉల్లేఖనంలోని లింగనిర్దిష్ట భాష
  choice: పురుషుడు ... తన భార్య
  alternative: వ్యక్తి ... తన జీవిత భాగస్వామి
  rationale: ఆదికాండపు ఈ వివాహ ఉల్లేఖనంలో పురుషుడు, అతని భార్య అనే నిర్దిష్ట జతనే మూలపాఠం పేర్కొంటుంది; అందువల్ల లింగతటస్థంగా మార్చలేదు.
- issue: వివాహ ఐక్యతను తెలిపే నుడికారం
  choice: వారిద్దరూ ఒకే శరీరంగా అవుతారు
  alternative: వారిద్దరూ ఒకే శరీరంగా ఉంటారు
  rationale: ἔσονται ... εἰς లోని ఫలితంగా ఏర్పడే ఐక్యతను ‘అవుతారు’ మెరుగ్గా తెలియజేస్తుంది; దాని సంబంధాత్మక, ధార్మిక గంభీరతను విపులీకరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ఆదికాండపు ఉల్లేఖనానికి తగిన గంభీరతను నిలుపుతూ, పాతకాలపు క్రియారూపాలను నివారించాం.
