revisions:
- from: “ఈ కారణంగా పురుషుడు తన తండ్రిని, తల్లిని విడిచిపెట్టి తన భార్యతో కలిసివుంటాడు[a]; వారిద్దరూ ఒకే శరీరంగా అవుతారు” అని ఆయన చెప్పాడు.
  to: 'ఆయన ఇలా చెప్పాడు: “ఈ కారణంగా పురుషుడు తన తండ్రిని, తల్లిని విడిచిపెట్టి తన భార్యతో ఏకమవుతాడు[a]; వారిద్దరూ ఒకే శరీరమవుతారు?”'
  rationale: The principal correction replaces a potentially cohabitative reading with wording that expresses the close marital union denoted by κολληθήσεται. The final wording also streamlines the Telugu expression for ‘one flesh’ and restores the source’s rhetorical-question punctuation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:46Z'
review_pass:
  verdict: revise
  source_fidelity: The rendering preserves the causal formula, the male-specific marital pairing, the explicit ‘two,’ and the ‘one flesh’ idiom. However, ‘తన భార్యతో కలిసివుంటాడు’ commonly suggests simply living together and is durative; it does not adequately convey κολληθήσεται, close marital joining/attachment. The source punctuation also presents this citation within Jesus’ rhetorical question, which should be retained.
  naturalness: The revised wording is natural modern standard Telugu and keeps the biblical-marital register without archaic phrasing. ‘ఒకే శరీరమవుతారు’ is more idiomatic and compact than ‘ఒకే శరీరంగా అవుతారు.’
  terminology: ‘పురుషుడు ... తన భార్య’ accurately reflects the gendered wording of the Genesis citation. ‘తన భార్యతో ఏకమవుతాడు’ appropriately renders the marital-union sense of κολληθήσεται without reducing it to cohabitation or imposing a doctrinal explanation.
  issues:
  - severity: medium
    issue: ‘కలిసివుంటాడు’ for κολληθήσεται
    rationale: In current Telugu this can mean ‘will live together,’ whereas the Greek verb denotes being closely joined/attached. ‘తన భార్యతో ఏకమవుతాడు’ better preserves the marital-union sense.
  - severity: low
    issue: Question punctuation absent
    rationale: The SBLGNT punctuates the cited words as part of the preceding rhetorical question. Retaining the question mark better reflects the source discourse.
  revised_text: 'ఆయన ఇలా చెప్పాడు: “ఈ కారణంగా పురుషుడు తన తండ్రిని, తల్లిని విడిచిపెట్టి తన భార్యతో ఏకమవుతాడు[a]; వారిద్దరూ ఒకే శరీరమవుతారు?”'
  revised_footnotes:
