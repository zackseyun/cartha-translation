- from: 'అయితే ఆయన వారితో ఇలా అన్నాడు: “ఈ మాటను[a] అందరూ స్వీకరించలేరు; అది ఎవరికి ఇవ్వబడిందో వారు మాత్రమే స్వీకరించగలరు.[b]”'
  to: 'అయితే ఆయన వారితో ఇలా అన్నాడు: “ఈ మాటను[a] అందరూ స్వీకరించలేరు; కానీ ఎవరికి ఇవ్వబడిందో వారు మాత్రమే స్వీకరించగలరు.[b]”'
  rationale: The sole revision removes the demonstrative pronoun “అది,” which could make the given thing explicitly the saying itself. The Greek passive leaves both the giver and, in this elliptical construction, the precise nature of what is granted unstated. The revised Telugu preserves that ambiguity, the passive form, and the restrictive contrast.
