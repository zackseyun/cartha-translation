id: MAT.19.11
reference: Matthew 19:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: te
  text: 'అయితే ఆయన వారితో ఇలా అన్నాడు: “ఈ మాటను[a] అందరూ స్వీకరించలేరు; కానీ ఎవరికి ఇవ్వబడిందో వారు మాత్రమే స్వీకరించగలరు.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఈ మాటను” అనే పదబంధాన్ని “ఈ వాక్యాన్ని” లేదా “ఈ బోధను” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “ఇవ్వబడింది” అనే కర్మణి రూపంలో ఇచ్చేవారు ఎవరో గ్రీకు పాఠ్యం స్పష్టంగా చెప్పదు; దేవుడే ఇచ్చేవాడని భావం ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: అన్నాడు
  rationale: కథన పరిచయంలో λέγω యొక్క సాధారణ భూతకాల రూపానికి సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: Οὐ πάντες
  choice: అందరూ … లేరు
  rationale: నిరాకరణతో కూడిన సార్వత్రిక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఎవరూ స్వీకరించలేరనే అర్థం రాకుండా కాపాడుతుంది.
- source_word: χωροῦσι
  choice: స్వీకరించలేరు / స్వీకరించగలరు
  rationale: χωρέω యొక్క మూలభావం ‘స్థలం కల్పించు’; λόγοςతో వచ్చిన ఈ సందర్భంలో ఒక మాటకు మనసులో చోటిచ్చి దాన్ని స్వీకరించడాన్ని సూచిస్తుంది. ‘స్వీకరించు’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὸν λόγον τοῦτον
  choice: ఈ మాటను
  rationale: λόγος ఇక్కడ ముందుగా చెప్పబడిన మాట లేదా బోధను సూచిస్తుంది. ‘ఈ మాట’ మూలంలోని ఏకవచనాన్ని, సందర్భ సంబంధాన్ని నిలుపుతుంది.
- source_word: ἀλλ’ οἷς
  choice: ఎవరికి … వారే
  rationale: వ్యతిరేకతతో పాటు పరిమితిని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: δέδοται
  choice: ఇవ్వబడిందో
  rationale: δίδωμι యొక్క సంపూర్ణ కర్మణి రూపాన్ని నిలుపుతూ, ఇచ్చినవారు ఎవరో మూలంలో చెప్పబడని విషయాన్ని తెలుగులోనూ పేర్కొనదు.
theological_decisions:
- issue: δέδοται అనే కర్మణి క్రియలో ఇచ్చేవారు ఎవరు?
  choice: ఇచ్చేవారిని ప్రధాన పాఠ్యంలో పేర్కొనకుండా ‘ఇవ్వబడిందో’ అనే కర్మణి రూపాన్ని నిలుపడం.
  alternative: ‘దేవుడు ఎవరికి ఇచ్చాడో’ అని స్పష్టంగా చెప్పడం.
  rationale: సందర్భంలో దేవుడే ఇచ్చేవాడని భావించవచ్చు; అయినా గ్రీకు మూలపాఠ్యం కర్తను స్పష్టంగా పేర్కొనదు. కాబట్టి ఆ అంతర్లీన దైవకర్మణి భావాన్ని పరిష్కరించకుండా నిలుపుతున్నాం.
- issue: ఇవ్వబడినది మాటనా, దాన్ని స్వీకరించే సామర్థ్యమా?
  choice: ‘అది … ఇవ్వబడిందో’ అని మూలంలోని సూచనాత్మక అస్పష్టతను నిలుపడం.
  alternative: ‘దాన్ని స్వీకరించే సామర్థ్యం ఎవరికి ఇవ్వబడిందో’ అని వివరణాత్మకంగా చెప్పడం.
  rationale: సందర్భం స్వీకరించే సామర్థ్యం లేదా అనుగ్రహాన్ని సూచించవచ్చు; అయితే మూలపాఠ్యం దానిని ప్రత్యేక నామవాచకంతో వివరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘స్వీకరించు’ ద్వారా χωρέω యొక్క సందర్భార్థం సహజంగా వ్యక్తమవుతుంది; కర్మణి నిర్మాణం మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
