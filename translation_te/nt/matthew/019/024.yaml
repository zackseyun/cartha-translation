id: MAT.19.24
reference: Matthew 19:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: te
  text: 'మళ్లీ మీతో చెబుతున్నాను: ధనవంతుడు దేవుని రాజ్యంలో ప్రవేశించడం కంటే ఒంటె సూది కన్ను గుండా వెళ్లడం సులభం.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఒంటె’కు బదులు ‘తాడు’ అని కొందరు ప్రతిపాదించారు; అయితే ఇక్కడి గ్రీకు పాఠంలో ‘ఒంటె’ అనే ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: మళ్లీ మీతో చెబుతున్నాను
  rationale: πάλιν పునరుక్తిని సూచిస్తుంది; δέ ఇక్కడ స్వల్ప అనుసంధాన పదం కాబట్టి తెలుగులో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు. λέγω ὑμῖν అనే ప్రత్యక్ష సంబోధన సూత్రానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: εὐκοπώτερόν ἐστιν
  choice: సులభం
  rationale: రెండు క్రియలను పోల్చే తులనాత్మక భావాన్ని తెలుగులో ‘కంటే ... సులభం’ అనే సహజ నిర్మాణం స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: κάμηλον
  choice: ఒంటె
  rationale: గ్రీకు పాఠంలోని κάμηλον అంటే ‘ఒంటె’; ‘తాడు’ అనే ప్రతిపాదనను మూలపాఠం సమర్థించదు.
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: సూది బెజ్జం గుండా
  rationale: ఇది కుట్టు సూదిలోని రంధ్రాన్ని సూచిస్తుంది. ‘సూది బెజ్జం’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అర్థమయ్యే పదబంధం.
- source_word: εἰσελθεῖν
  choice: గుండా వెళ్లడం / ప్రవేశించడం
  rationale: మొదటి సందర్భంలో సూది రంధ్రం గుండా కదలికకు ‘వెళ్లడం’, రెండవ సందర్భంలో రాజ్యంలోకి చేరడాన్ని సూచించేందుకు ‘ప్రవేశించడం’ వాడటం తెలుగు ప్రయోగానికి సహజం; రెండింటికీ మూలంలో ఒకే infinitive ఉంది.
- source_word: ἢ πλούσιον
  choice: ధనవంతుడు ... కంటే
  rationale: πλούσιον ఏకవచన ధనిక వ్యక్తిని సూచిస్తుంది. తెలుగులో ‘ధనవంతుడు’ గ్రీకు వ్యాకరణ రూపాన్నీ సామెతలోని ప్రతినిధి వ్యక్తినీ నిలుపుతుంది.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యంలో ప్రవేశించడం
  rationale: కేంద్ర భావమైన ‘దేవుని రాజ్యం’ను యథాతథంగా ఉంచి, εἰς సూచించే లోనికి ప్రవేశించే భావాన్ని ‘రాజ్యంలో ప్రవేశించడం’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఒంటె–సూది బెజ్జం దృశ్యానికి అర్థం
  choice: చిత్రంలోని ఉద్దేశపూర్వకమైన తీవ్రమైన అసాధ్యతను మృదువుపరచకుండా నిలుపడం
  alternative: దీనిని యెరూషలేములోని ‘సూది ద్వారం’గా వివరించడం లేదా ‘ఒంటె’కు బదులు ‘తాడు’గా చదవడం
  rationale: గ్రీకు పాఠం స్పష్టంగా ఒంటెను, కుట్టు సూది రంధ్రాన్ని పేర్కొంటుంది. కాబట్టి నిర్దిష్ట ద్వారానికి సంబంధించిన రూపకాలంకారాన్ని చేర్చకుండా, వాక్యంలోని బలమైన అతిశయోక్తినీ తరువాతి సందర్భంలో పరిష్కరించబడే వేదాంత ఉద్రిక్తతనూ నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గంభీరతను నిలుపుతూ అనువదించబడింది. ‘సూది బెజ్జం’ స్థానికంగా సహజమైన పదబంధం. మూలంలోని పోలిక క్రమాన్ని తెలుగులో సహజంగా ఉండే విధంగా మార్చినా భావబలం, అతిశయోక్తి యథాతథంగా ఉన్నాయి.
