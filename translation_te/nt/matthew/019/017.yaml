id: MAT.19.17
reference: Matthew 19:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: te
  text: 'ఆయన అతనితో ఇలా అన్నాడు[a]: “మంచి గురించి నన్నెందుకు అడుగుతున్నావు? మంచివాడు ఒక్కడే[b]. అయితే నీవు జీవంలో ప్రవేశించాలని కోరుకుంటే, ఆజ్ఞలను పాటించు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లోను సమాంతర వృత్తాంతాల్లోను, “నన్ను మంచివాడని ఎందుకు అంటున్నావు? దేవుడు ఒక్కడే తప్ప మంచివాడు ఎవడూ లేడు” అని ఉంది. అయితే మత్తయి గ్రంథానికి సంబంధించిన SBLGNT పాఠంలో, “మంచి గురించి నన్నెందుకు అడుగుతున్నావు? మంచివాడు ఒక్కడే” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: మూలభాషలో ఈ మాటను మరింత అక్షరార్థంగా, “ఒక్కడే ఆ మంచివాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: మంచి గురించి నన్నెందుకు అడుగుతున్నావు?
  rationale: τοῦ ἀγαθοῦ ఇక్కడ నపుంసక ఏకవచన రూపంలో ఉండి ‘మంచి’ అనే విషయాన్ని సూచిస్తుంది. మార్కు, లూకా సమాంతర వాక్యాలకు అనుగుణంగా మార్చకుండా మత్తయి గ్రీకు వాక్యనిర్మాణాన్ని అనుసరిస్తుంది.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: మంచివాడు ఒక్కడే
  rationale: ὁ ἀγαθός వ్యక్తిని సూచించే విశేషణప్రయోగం. ‘మంచివాడు ఒక్కడే’ అనేది గ్రీకు వాక్యంలోని ఉద్దేశపూర్వక సంక్షిప్తతను నిలుపుతూ సహజమైన ఆధునిక తెలుగులో ఉంటుంది.
- source_word: εἰ δὲ θέλεις
  choice: అయితే నీవు … కోరుకుంటే
  rationale: θέλω కోరిక లేదా ఉద్దేశాన్ని తెలియజేస్తుంది. δέ ఇక్కడ స్వల్పమైన మలుపును సూచిస్తుండటంతో ‘అయితే’ సహజంగా సరిపోతుంది.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: జీవంలో ప్రవేశించాలని
  rationale: εἰς తాలూకు ప్రవేశ భావాన్ని నిలుపుతుంది. ఈ వాక్యభాగంలో ‘నిత్యజీవం’ అని ప్రత్యక్షంగా లేకపోవడంతో దానిని అనువాదంలో చేర్చలేదు.
- source_word: τήρησον τὰς ἐντολάς
  choice: ఆజ్ఞలను పాటించు
  rationale: ఆజ్ఞల సందర్భంలో τηρέω అంటే వాటిని ఆచరించడం లేదా పాటించడం. ‘ఆజ్ఞలను పాటించు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
theological_decisions:
- issue: యేసు మాటకు దేవుని మంచితనంతోను క్రీస్తుతత్వంతోను ఉన్న సంబంధం
  choice: మత్తయి పాఠం ప్రకారం ‘మంచి గురించి’ అనే ప్రశ్నను, ‘మంచివాడు ఒక్కడే’ అనే జవాబును యథాతథంగా అనువదించడం
  alternative: మార్కు, లూకా సమాంతర వాక్యాలకు అనుగుణంగా ‘నన్ను మంచివాడని ఎందుకు అంటున్నావు? దేవుడు ఒక్కడే తప్ప మంచివాడు ఎవడూ లేడు’ అని అనువదించడం
  rationale: SBLGNTలోని మత్తయి పాఠం మార్కు, లూకా రూపం కంటే భిన్నంగా ఉంది. యేసు మంచితనాన్ని నిరాకరిస్తున్నట్టు భావాన్ని జోడించకుండా, అదే సమయంలో క్రీస్తుతత్వ సంబంధమైన తీర్మానాన్ని అనువాదంలో బలవంతంగా చేర్చకుండా, మత్తయి గ్రీకు పదాలను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘జీవంలో ప్రవేశించడం,’ ‘ఆజ్ఞలను పాటించడం’ వంటి బైబిలు భావవ్యక్తీకరణలను స్పష్టతతో నిలిపాం. అందించిన ఆంగ్ల సంప్రదింపు పాఠంలో [b] సూచిక ‘life’ తరువాత కనిపించినా, దాని పాదటిప్పణి εἷς ἐστιν ὁ ἀγαθός గురించినందున మూలానికి అనుగుణంగా [b]ను ‘మంచివాడు ఒక్కడే’ తరువాత ఉంచాం.
