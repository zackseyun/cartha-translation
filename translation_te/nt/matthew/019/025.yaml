id: MAT.19.25
reference: Matthew 19:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: te
  text: శిష్యులు అది విని ఎంతో ఆశ్చర్యపోయి, “అయితే ఎవరు రక్షణ పొందగలరు?” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: అది విని
  rationale: భూతకాల అసమాపక క్రియ ప్రధాన చర్యకు ముందున్న సందర్భాన్ని సూచిస్తుంది. మునుపటి యేసు మాటను సహజమైన తెలుగులో ‘అది’ సూచిస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: δέ ఇక్కడ కథన కొనసాగింపును లేదా స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; ‘అది విని’ అనే నిర్మాణమే తెలుగులో మార్పును సహజంగా తెలియజేస్తుంది.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులు
  rationale: యేసు శిష్యులను సూచించే ప్రామాణికమైన, సహజమైన సువార్త పదప్రయోగం.
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: ఎంతో ఆశ్చర్యపడి
  rationale: ἐξεπλήσσοντο వ్యక్తం చేసే తీవ్రమైన దిగ్భ్రాంతిని σφόδρα మరింత బలపరుస్తుంది; ఈ తెలుగు ప్రయోగం ఆ తీవ్రతను సహజంగా నిలుపుతుంది.
- source_word: λέγοντες
  choice: అని అడిగారు
  rationale: మాటల విషయము ప్రశ్న కావడంతో, తెలుగులో సహజ కథనరీతికి అనుగుణంగా అసమాపక రూపాన్ని ప్రశ్నను తెలిపే సమాపక క్రియగా ఇచ్చాం.
- source_word: Τίς ἄρα
  choice: అయితే ఎవరు
  rationale: ἄρα ముందటి మాటనుంచి తీసుకున్న ఆశ్చర్యభరిత నిర్ధారణను సూచిస్తుంది; ‘అయితే’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: δύναται σωθῆναι
  choice: రక్షణ పొందగలరు
  rationale: సామర్థ్యాన్ని సూచించే δύναταιను ‘గలరు’తో, దైవక్రియను సూచించే నిష్క్రియార్థక σωθῆναιను సహజ తెలుగు ప్రయోగమైన ‘రక్షణ పొంద’తో వ్యక్తం చేశాం.
theological_decisions:
- issue: ఈ సందర్భంలో σωθῆναι అర్థం
  choice: రక్షణ పొందగలరు
  alternative: విడిపించబడగలరు / కాపాడబడగలరు
  rationale: సమీప సందర్భంలో దేవుని రాజ్యంలో ప్రవేశించడం, ధనవంతునికి కలిగే కష్టం చర్చలో ఉన్నాయి. అందువల్ల ఇది కేవలం తాత్కాలిక ప్రమాదం నుంచి కాపాడబడటాన్ని కాక సంపూర్ణ రక్షణను సూచిస్తుంది; అయితే రక్షణ విధానాన్ని అనువాదం ప్రత్యేకంగా నిర్వచించదు.
- issue: σωθῆναιలోని నిష్క్రియ భావం
  choice: రక్షణ పొందగలరు
  alternative: తమను తాము రక్షించుకోగలరు
  rationale: మూలంలోని నిష్క్రియ రూపాన్ని నిలుపుతూ, మనుషులు తమను తాము రక్షించుకుంటారని అనువాదం చేర్చకుండా నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, సువార్త కథనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని ఆశ్చర్య తీవ్రతను ‘ఎంతో ఆశ్చర్యపడి’తో నిలిపాం.
