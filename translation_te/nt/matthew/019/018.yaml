id: MAT.19.18
reference: Matthew 19:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: te
  text: 'అతడు ఆయనను, “ఏవి?” అని అడిగాడు. యేసు ఇలా అన్నాడు: “హత్య చేయకూడదు; వ్యభిచారం చేయకూడదు; దొంగతనం చేయకూడదు; అబద్ధ సాక్ష్యం చెప్పకూడదు,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: ఏవి?
  rationale: స్త్రీలింగ బహువచన ప్రశ్నార్థక పదం సందర్భంలోని ఆజ్ఞలను సూచిస్తుంది; తెలుగులో సహజమైన సంక్షిప్త ప్రశ్నగా ఇచ్చాం.
- source_word: Οὐ φονεύσεις
  choice: హత్య చేయకూడదు
  rationale: φονεύω అన్యాయంగా మనిషిని చంపడాన్ని సూచిస్తుంది; సాధారణమైన ‘చంపకూడదు’ కంటే ‘హత్య చేయకూడదు’ మూలపద పరిధిని స్పష్టంగా నిలుపుతుంది.
- source_word: Οὐ μοιχεύσεις
  choice: వ్యభిచారం చేయకూడదు
  rationale: వివాహ విశ్వాసఘాతాన్ని సూచించే μοιχεύωకు ఆధునిక ప్రామాణిక తెలుగు సమానం.
- source_word: Οὐ κλέψεις
  choice: దొంగతనం చేయకూడదు
  rationale: κλέπτω యొక్క నిషేధార్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: అబద్ధ సాక్ష్యం చెప్పకూడదు
  rationale: న్యాయసంబంధమైన లేదా వ్యక్తిగత సాక్ష్యంలో అసత్యంగా సాక్ష్యమివ్వడాన్ని సూచించే సంయుక్త క్రియ యొక్క భావాన్ని నిలుపుతుంది.
- source_word: Τὸ
  choice: 'ఇలా అన్నాడు:'
  rationale: గ్రీకు నపుంసక ఏకవచన ఆర్టికల్ ఇక్కడ తరువాతి ఆజ్ఞల ఉల్లేఖనాన్ని పరిచయం చేస్తుంది. దానిని అసహజంగా పదక్షరానువాదం చేయకుండా, తెలుగు పరిచయ నిర్మాణం మరియు ద్విబిందువుతో దాని వాక్యనిర్మాణ పాత్రను తెలిపాం.
theological_decisions:
- issue: φονεύωను సాధారణ చంపడంగా లేదా హత్యగా అనువదించడం
  choice: హత్య చేయకూడదు
  alternative: చంపకూడదు
  rationale: ఈ క్రియ సాధారణంగా హత్యను సూచిస్తుంది; యుద్ధం, ఆత్మరక్షణ, జంతువులను చంపడం వంటి ఇతర ప్రశ్నలను ఈ వచనంలోనే ముందుగా తీర్మానించకుండా మూలార్థాన్ని పరిమితంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. గ్రీకులోని చారిత్రక వర్తమాన కాలాన్ని తెలుగులో సహజమైన భూతకాల కథనంగా ఇచ్చాం. చివరి కామా తరువాతి వచనంలో ఆజ్ఞల జాబితా కొనసాగుతుందని సూచిస్తుంది.
