id: MAT.19.14
reference: Matthew 19:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: te
  text: అయితే యేసు, “పిల్లలను నా దగ్గరికి రానివ్వండి; నా దగ్గరికి రాకుండా వారిని అడ్డుకోకండి. ఎందుకంటే పరలోక రాజ్యం ఇలాంటివారిదే[a]” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇలాంటివారు” అనేది అక్కడున్న పిల్లలను మాత్రమే కాక, అలాంటి తరహాకు చెందిన వారిని కూడా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφετε
  choice: రానివ్వండి
  rationale: ἀφίημι ఇక్కడ విడిచిపెట్టడం అనే అర్థంలో కాక, అనుమతించమనే ఆజ్ఞగా వాడబడింది. ‘రానివ్వండి’ ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఉంది.
- source_word: τὰ παιδία
  choice: పిల్లలను
  rationale: παιδία చిన్న వయసు పిల్లలను సూచించగలిగినా, ఈ వాక్యంలో ‘పిల్లలు’ అనే విస్తృతమైన పదమే అవసరానికి మించిన వయోపరిమితిని చేర్చకుండా మూలార్థాన్ని అందిస్తుంది.
- source_word: μὴ κωλύετε
  choice: అడ్డుకోకండి
  rationale: κωλύω అంటే అడ్డుకోవడం, నిరోధించడం లేదా ఆపడం. ‘అడ్డుకోకండి’ తరువాతి కార్యాన్ని సహజంగా అనుసంధానిస్తూ గ్రీకు ఆజ్ఞ యొక్క సాధారణ బలాన్ని నిలుపుతుంది.
- source_word: αὐτὰ ἐλθεῖν πρός με
  choice: వారిని నా దగ్గరికి రానివ్వండి
  rationale: πρός με వ్యక్తిగతంగా యేసు దగ్గరికి రావడాన్ని సూచిస్తుంది. తెలుగులో ‘నా దగ్గరికి’ అనేది సహజమైన, స్పష్టమైన వ్యక్తీకరణ.
- source_word: τῶν γὰρ τοιούτων
  choice: ఎందుకంటే ... ఇలాంటివారికి
  rationale: τοιούτων అక్కడున్న పిల్లలను మాత్రమే కాక, వారు ప్రతినిధ్యం వహించే తరహాకు చెందిన వారిని కూడా సూచించగలదు. ‘ఇలాంటివారు’ ఆ రెండు అవకాశాలను నిర్వచించకుండా నిలుపుతుంది.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: ఇది మత్తయి సువార్తలో ప్రత్యేకంగా కనిపించే స్థిరమైన పదబంధం. ‘పరలోక రాజ్యం’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజమైనదీ, మూలానికి నమ్మకమైనదీ.
- source_word: ἐστὶν
  choice: చెందుతుంది
  rationale: గ్రీకులోని εἰμίతో కూడిన సంబంధార్థక షష్ఠీ విభక్తిని తెలుగులో కేవలం ‘ఉంది’ అని అనడం అసహజం. ‘చెందుతుంది’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది; మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: యేసు అక్కడున్న పిల్లలను మాత్రమే సూచిస్తున్నాడా, లేక వారిలాంటి స్థితి లేదా లక్షణం గల వారినీ సూచిస్తున్నాడా?
  choice: τοιούτωνను ‘ఇలాంటివారు’ అని అనువదించి, తక్షణ సందర్భంలోని పిల్లలనూ విస్తృత ప్రతినిధి భావాన్నీ నిలుపడం.
  alternative: ‘ఈ పిల్లలకు’ అని పరిమితం చేయడం లేదా ‘పిల్లలవంటివారికి’ అని వివరణాత్మకంగా నిర్దిష్టీకరించడం.
  rationale: గ్రీకు పదం అక్కడున్న పిల్లలకు మించిన ఒక తరహాను సూచించగలదు, కాని ఆ తరహాను నిర్వచించే లక్షణం ఏమిటో ఈ వాక్యం చెప్పదు. ‘ఇలాంటివారు’ ఆ ఉద్దేశపూర్వక విస్తృతతను, వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన ప్రత్యక్ష సంభాషణ శైలిని వాడాం. ‘రానివ్వండి,’ ‘అడ్డుకోకండి’ అనే రూపాలు ఆజ్ఞను సహజంగా వ్యక్తం చేస్తాయి; ‘ఇలాంటివారు’ మూలంలోని విస్తృతతను కాపాడుతుంది.
