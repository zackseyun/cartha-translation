    text: “ఇలాంటివారు” అనేది అక్కడున్న పిల్లలను మాత్రమే కాక, అలాంటి తరహాకు చెందిన వారిని కూడా సూచించవచ్చు.
    reason: alternative_reading
  revision_rationale: The revision explicitly states that the prohibited hindrance concerns the children’s coming to Jesus and uses an idiomatic possessive form for the final Greek clause. Since the revised main text itself now closely represents the former “more literal” wording, that lexical-alternative footnote has been removed. The ambiguity of τοιούτων is retained without defining the quality represented by the children.
