revisions:
- from: అయితే యేసు, “పిల్లలను నా దగ్గరికి రానివ్వండి; వారిని అడ్డుకోకండి. ఎందుకంటే పరలోక రాజ్యం ఇలాంటివారికి[a] చెందుతుంది[b]” అని అన్నాడు.
  to: అయితే యేసు, “పిల్లలను నా దగ్గరికి రానివ్వండి; నా దగ్గరికి రాకుండా వారిని అడ్డుకోకండి. ఎందుకంటే పరలోక రాజ్యం ఇలాంటివారిదే[a]” అని అన్నాడు.
  rationale: The revision explicitly states that the prohibited hindrance concerns the children’s coming to Jesus and uses an idiomatic possessive form for the final Greek clause. Since the revised main text itself now closely represents the former “more literal” wording, that lexical-alternative footnote has been removed. The ambiguity of τοιούτων is retained without defining the quality represented by the children.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:46Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ permission for the children to come and the representative force of τοιούτων. However, the δεύτε clause μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με explicitly forbids hindering them from coming to Jesus; the draft’s “వారిని అడ్డుకోకండి” can be read more generally and leaves that infinitival action unexpressed in the prohibition itself.
  naturalness: The wording is modern and readily understandable. Repeating “నా దగ్గరికి రాకుండా” in the negative command is natural Telugu and makes the source relationship explicit without undue heaviness.
  terminology: “పిల్లలు,” “పరలోక రాజ్యం,” and “ఇలాంటివారు” are appropriate. “ఇలాంటివారికి చెందుతుంది” is understandable, but “ఇలాంటివారిదే” more directly and idiomatically renders the possessive/genitive sense of τῶν τοιούτων ἐστίν while retaining the ambiguity about whom “such” includes.
  issues:
  - severity: medium
    issue: The action governed by κωλύετε is not explicit in the negative command.
    rationale: Greek says not merely “do not hinder them,” but “do not hinder them from coming to me.” Adding “నా దగ్గరికి రాకుండా” preserves this syntactic and semantic link.
  - severity: low
    issue: The main rendering of the final clause uses “చెందుతుంది,” while the Greek has a present copular possessive construction.
    rationale: “ఇలాంటివారిదే పరలోక రాజ్యం” is a more direct, idiomatic Telugu representation of “for of such is the kingdom of heaven.” The prior literal-alternative footnote must therefore be revised so that it remains a genuine alternative.
  revised_text: అయితే యేసు, “పిల్లలను నా దగ్గరికి రానివ్వండి; నా దగ్గరికి రాకుండా వారిని అడ్డుకోకండి. ఎందుకంటే పరలోక రాజ్యం ఇలాంటివారిదే[a]” అని అన్నాడు.
  revised_footnotes:
