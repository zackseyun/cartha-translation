revisions:
- from: ఎందుకంటే, తల్లి గర్భం నుంచే ఆ విధంగా పుట్టిన నపుంసకులు ఉన్నారు; మనుషులు నపుంసకులుగా చేసినవారు ఉన్నారు; పరలోక రాజ్యం కోసం తమను తాము నపుంసకులుగా చేసుకున్నవారు కూడా ఉన్నారు.[a] దీన్ని అంగీకరించగలవాడు అంగీకరించాలి.[b]
  to: ఎందుకంటే తల్లి గర్భం నుంచే ఆ విధంగా పుట్టిన నపుంసకులు ఉన్నారు; మనుష్యులచేత నపుంసకులుగా చేయబడినవారు ఉన్నారు; పరలోక రాజ్యం కోసం తమను తాము నపుంసకులుగా చేసుకున్నవారు కూడా ఉన్నారు.[a] దీన్ని అంగీకరించగలవాడు అంగీకరించాలి.[b]
  rationale: 'సురక్షితమైన స్వల్ప సవరణ మాత్రమే అవసరం: రెండవ వర్గాన్ని నిష్క్రియార్థకంగా చేయడం ద్వారా గ్రీకు ὑπὸ τῶν ἀνθρώπων యొక్క భావాన్ని స్పష్టంగా, సహజంగా తెలియజేశాం. మిగతా పాఠ్యం మూలానికీ ఆధునిక ప్రామాణిక తెలుగు వాడుకకీ తగినట్లే ఉంది. మూడవ వర్గంలోని అక్షరార్థ–రూపకార్థ సందిగ్ధతను పరిష్కరించకుండా అలాగే ఉంచాం; పాదటిప్పణి గుర్తులు సరైన చోట్ల ఉన్నాయి.'
