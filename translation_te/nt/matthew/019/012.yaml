id: MAT.19.12
reference: Matthew 19:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: te
  text: ఎందుకంటే తల్లి గర్భం నుంచే ఆ విధంగా పుట్టిన నపుంసకులు ఉన్నారు; మనుష్యులచేత నపుంసకులుగా చేయబడినవారు ఉన్నారు; పరలోక రాజ్యం కోసం తమను తాము నపుంసకులుగా చేసుకున్నవారు కూడా ఉన్నారు.[a] దీన్ని అంగీకరించగలవాడు అంగీకరించాలి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తమను తాము వృషణచ్ఛేదనం చేసుకున్నవారు’ అని కూడా అనువదించవచ్చు; అనేకమంది వ్యాఖ్యాతలు దీనిని పరలోక రాజ్యం కోసం వివాహాన్ని విడిచిపెట్టి బ్రహ్మచర్యాన్ని ఎంచుకోవడాన్ని సూచించే రూపకంగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘దీన్ని స్వీకరించగలవాడు స్వీకరించాలి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: నపుంసకులు
  rationale: గ్రీకు పదానికి సాధారణంగా ఉన్న అర్థాన్ని నిలుపుతూ, మూడు వర్గాల్లోనూ పదపునరుక్తిని కాపాడుతుంది; ‘బ్రహ్మచారులు’ అని అనువదించి మూడవ వర్గానికి సంబంధించిన వ్యాఖ్యానాన్ని మూలపాఠ్యంలోనే చేర్చదు.
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: తల్లి గర్భం నుంచే ఆ విధంగా పుట్టిన
  rationale: మూలంలోని స్పష్టమైన గర్భసంబంధ ప్రయోగాన్నీ, οὕτως అనే వెనుకసూచననూ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: మనుషులు నపుంసకులుగా చేసినవారు
  rationale: నామవాచకం–క్రియ మధ్యనున్న పదసంబంధాన్ని కాపాడుతూ, శారీరక ప్రక్రియకే అనువాదాన్ని అనవసరంగా పరిమితం చేయదు.
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: తమను తాము నపుంసకులుగా చేసుకున్నవారు
  rationale: గ్రీకు వాక్యంలోని ఉద్దేశపూర్వకమైన, కఠినమైన పదప్రయోగాన్ని నేరుగా నిలుపుతుంది; ఇది అక్షరార్థమా, అతిశయోక్తా, లేక వివాహత్యాగానికి రూపకమా అనే ప్రశ్నను అనువాదంలోనే పరిష్కరించదు.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: పరలోక రాజ్యం కోసం
  rationale: διά + accusative తెలిపే ఉద్దేశం లేదా ప్రేరణను సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: దీన్ని అంగీకరించగలవాడు అంగీకరించాలి
  rationale: χωρέω యొక్క సందర్భానుసారమైన ‘కఠినమైన బోధకు చోటివ్వడం/దాన్ని స్వీకరించడం’ అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తూ ఆజ్ఞార్థక బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: εὐνούχισαν ἑαυτοὺς అక్షరార్థమా లేక రూపకార్థమా
  choice: ప్రధాన పాఠ్యంలో ‘తమను తాము నపుంసకులుగా చేసుకున్నవారు’ అనే ప్రత్యక్ష పదరూపాన్ని నిలుపడం
  alternative: ‘తమను తాము వృషణచ్ఛేదనం చేసుకున్నవారు’ లేదా ‘వివాహాన్ని విడిచిపెట్టి బ్రహ్మచర్యాన్ని ఎంచుకున్నవారు’
  rationale: ఈ మాట అక్షరార్థమా, అతిశయోక్తా, లేక దేవుని రాజ్యం కోసం స్వచ్ఛంద బ్రహ్మచర్యాన్ని సూచించే రూపకమా అని వచనం స్వయంగా వివరించదు. అందువల్ల భావసందిగ్ధతను ప్రధాన పాఠ్యంలో కాపాడి, వ్యాఖ్యాన అవకాశాన్ని పాదటిప్పణిలో తెలియజేశారు.
- issue: ὁ δυνάμενος χωρεῖν χωρείτω యొక్క భావం
  choice: ‘దీన్ని అంగీకరించగలవాడు అంగీకరించాలి’
  alternative: ‘దీన్ని స్వీకరించగలవాడు స్వీకరించాలి’ లేదా ‘దీనికి చోటివ్వగలవాడు చోటివ్వాలి’
  rationale: ఇక్కడ χωρέω కేవలం భౌతికంగా చోటు కల్పించడం కాదు; కఠినమైన మాటను గ్రహించి స్వీకరించడం అనే సందర్భార్థం ఉంది. ‘అంగీకరించాలి’ సాధారణ పాఠకునికి సహజంగా ఉండగా, మరింత పదానుసారమైన ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి ఉపయోగించబడింది. ‘నపుంసకులు’ అనే స్థిరమైన పదాన్ని మూడు వర్గాల్లోనూ కొనసాగించి గ్రీకు పదపునరుక్తిని నిలిపారు. మూడవ వర్గానికి సంబంధించిన అక్షరార్థ–రూపకార్థ ఉద్రిక్తతను అనువాదంలో పరిష్కరించకుండా పాదటిప్పణిలో వివరించారు.
