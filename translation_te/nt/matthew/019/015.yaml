  text: And after laying his hands on them[a], he went on from there.
translation:
  language: te
  text: ఆయన వారి మీద చేతులు ఉంచిన తర్వాత[a] అక్కడి నుంచి వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి మీద చేతులు ఉంచి, ఆయన అక్కడి నుంచి వెళ్లిపోయాడు.’
    reason: పార్టిసిపుల్‌ను చర్యల క్రమాన్ని సూచించే మరో సహజమైన తెలుగు నిర్మాణంలో అనువదించవచ్చు.
lexical_decisions:
- source_word: ἐπιθεὶς
  choice: ఉంచిన తర్వాత
  rationale: ఇది ἐπιτίθημι అనే క్రియ యొక్క ఏఓరిస్ట్ పార్టిసిపుల్; ప్రధాన క్రియకు ముందు జరిగిన చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: వారి మీద చేతులు
  rationale: చేతులు ఉంచడం అనే స్పష్టమైన శారీరక చర్యను నిలుపుతుంది. గ్రీకులోని దత్తివాచకమైన αὐτοῖς భావాన్ని ‘వారి మీద’ సహజంగా వ్యక్తపరుస్తుంది; తెలుగులో కర్తను బట్టి అవి ఆయన చేతులేనని స్పష్టంగా ఉండటంతో ‘తన’ను ప్రత్యేకంగా చేర్చలేదు.
- source_word: ἐπορεύθη
  choice: వెళ్లిపోయాడు
  rationale: πορεύομαι ఇక్కడ ఒక స్థలం నుంచి వెళ్లడాన్ని సూచిస్తుంది. ‘వెళ్లిపోయాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, అనవసరమైన గంభీర శైలిని నివారిస్తుంది.
- source_word: ἐκεῖθεν
  choice: అక్కడి నుంచి
  rationale: స్థలాన్ని సూచించే ఈ క్రియావిశేషణానికి స్పష్టమైన, సహజమైన తెలుగు సమానం.
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్యక్రమంలో వ్యక్తీకరించబడింది
  rationale: గ్రీకులో ఇది ముందటి కథనానికి సాధారణ అనుసంధానం. తెలుగులో ‘తర్వాత’తో చర్యల క్రమం ఇప్పటికే సహజంగా వ్యక్తమవుతున్నందున మొదట ‘మరియు’ చేర్చడం కృత్రిమంగా వినిపిస్తుంది.
theological_decisions:
- issue: యేసు చేతులు ఉంచిన చర్య స్వభావం
  choice: ‘వారి మీద చేతులు ఉంచిన’ అనే స్పష్టమైన చర్యనే ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘వారిని ఆశీర్వదించిన తర్వాత’ అని భావానువాదం చేయడం
  rationale: సందర్భం ఆశీర్వాదాన్ని సూచించినా, గ్రీకు పాఠ్యం ప్రత్యక్షంగా చేతులు ఉంచిన చర్యనే చెబుతుంది. అందువల్ల ఆశీర్వాదం, సంస్కారం లేదా అభిషేకం వంటి ప్రత్యేక అర్థాన్ని పాఠ్యంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే కథన శైలి. మూలంలోని సంక్షిప్తతను, చర్యల క్రమాన్ని కాపాడింది.
