id: MAT.19.27
reference: Matthew 19:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: te
  text: 'అప్పుడు పేతురు ఆయనకు జవాబిస్తూ ఇలా అన్నాడు: “ఇదిగో, మేము అన్నిటినీ విడిచిపెట్టి నిన్ను అనుసరించాము; అయితే మాకు ఏమి ఉంటుంది?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షిస్తూ పేతురు తన మాటను బలంగా ముందుంచే భావాన్ని సహజమైన తెలుగు ప్రయోగంతో నిలుపుతుంది.
- source_word: ἀφήκαμεν πάντα
  choice: మేము అన్నిటినీ విడిచిపెట్టి
  rationale: వారు సమస్తాన్ని వదిలినట్లు చెప్పే మూలపాఠ భావాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἠκολουθήσαμέν σοι
  choice: నిన్ను అనుసరించాము
  rationale: శిష్యునిగా వెంబడించడం అనే భావాన్ని సందర్భానుకూలంగా తెలియజేస్తుంది.
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: కాబట్టి మాకు ఏమి లభిస్తుంది?
  rationale: ἄρα యొక్క నిర్ధారణాత్మక ‘కాబట్టి’ భావాన్ని, ἡμῖνతో కూడిన ἔσται యొక్క ‘మాకు ఏమి ఉంటుంది/దక్కుతుంది’ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: పేతురు ఆశించిన ప్రతిఫలం స్వరూపం
  choice: మాకు ఏమి లభిస్తుంది?
  alternative: మాకు ఏమి ఉంటుంది?
  rationale: ప్రశ్నలో ప్రతిఫల నిరీక్షణ ఉన్నప్పటికీ అది భౌతికమా ఆధ్యాత్మికమా అని వచనం నిర్ణయించదు; ‘లభిస్తుంది’ ఆ అనిశ్చితిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే సంభాషణ శైలి. గ్రీకు participle ‘ἀποκριθείς’ను తెలుగులో సహజంగా ‘అని అడిగాడు’ అనే ముగింపు క్రియలో సమన్వయపరిచాం.
