id: MAT.19.23
reference: Matthew 19:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: te
  text: 'అప్పుడు యేసు తన శిష్యులతో, “నేను మీతో నిజంగా[a] చెబుతున్నాను: ధనవంతుడు పరలోక రాజ్యంలో ప్రవేశించడం కష్టం” అన్నాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆమేన్, నేను మీతో చెబుతున్నాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అప్పుడు
  rationale: కథనంలోని తదుపరి మలుపును సహజంగా సూచిస్తుంది; అనుసంధాన భావాన్ని విడిచిపెట్టదు.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: తన శిష్యులతో
  rationale: αὐτοῦలోని సంబంధ భావాన్ని నిలుపుతూ, తెలుగులో ‘చెప్పాడు’తో సహజంగా వచ్చే సంభాషణ నిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: యేసు పలికే గంభీరమైన ధృవీకరణ సూత్రంలోని బలాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πλούσιος
  choice: ధనవంతుడు
  rationale: ఏకవచన పుంలింగంలో నామవాచకంగా వాడిన విశేషణాన్ని సంక్షిప్తంగా, నేరుగా అనువదిస్తుంది.
- source_word: δυσκόλως
  choice: ప్రవేశించడం కష్టం
  rationale: గ్రీకు క్రియావిశేషణంలోని కష్టసాధ్యత భావాన్ని తెలుగులో సహజమైన నిర్మాణంతో వ్యక్తం చేస్తుంది; అసాధ్యమని ముందుగానే అతిశయింపదు.
- source_word: εἰσελεύσεται
  choice: ప్రవేశించడం
  rationale: భవిష్యత్ క్రియ generic sayingలో తెలిపే పరిణామాన్ని తెలుగులో సహజమైన క్రియానామ నిర్మాణంతో అందిస్తుంది.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి సువార్తలోని స్థిరమైన భావవ్యక్తీకరణకు తెలుగులో సుపరిచితమైన రూపం; రాజ్య భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: πλούσιος అనే పుంలింగ ఏకవచన నామవాచక విశేషణం
  choice: ధనవంతుడు
  alternative: ధనిక వ్యక్తి
  rationale: మూలంలోని వ్యాకరణ రూపాన్ని, ఒక ప్రతినిధి వ్యక్తిని సూచించే ఏకవచనాన్ని నిలుపుతుంది; అనవసరంగా లింగతటస్థం చేయదు.
- issue: Ἀμὴν అనే యేసు ధృవీకరణ సూత్రం
  choice: నిజంగా
  alternative: ఆమేన్
  rationale: సూత్రంలోని గంభీరతను సాధారణ ఆధునిక తెలుగు పాఠకుడికి వెంటనే అర్థమయ్యేలా తెలియజేస్తుంది; మూల రూపాన్ని పాదసూచికలో అందిస్తుంది.
- issue: δυσκόλως యొక్క బలం
  choice: ప్రవేశించడం కష్టం
  alternative: ప్రవేశించడం దాదాపు అసాధ్యం
  rationale: ఈ వచనం చెప్పే కష్టసాధ్యతను మాత్రమే వ్యక్తం చేసి, తరువాతి వచనం అభివృద్ధి చేసే అసాధ్యతా ఉద్రిక్తతను ఇక్కడే ముందుగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పరలోక రాజ్యం’ అనే సుపరిచిత మత్తయి పదబంధం నిలుపబడింది; వాక్యంలోని గంభీరతను భారమైన లేదా పాతకాలపు భాష లేకుండా వ్యక్తం చేసింది.
