  text: But many who are first will be last[a], and the last first.
translation:
  language: te
  text: అయితే, మొదటివారైన అనేకులు చివరివారవుతారు[a]; చివరివారు మొదటివారవుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “అయితే అనేకులు మొదటివారు చివరివారవుతారు, చివరివారు మొదటివారవుతారు.” గ్రీకు వాక్యం ప్రత్యేకంగా సంక్షిప్తంగా, సామెతలా ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: అనేకులు
  rationale: ఈ విశేషణం నామవాచకంగా పనిచేస్తూ, ఎవరో ప్రత్యేకంగా నిర్దేశించకుండా విస్తృతమైన మానవ సమూహాన్ని సూచిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి చర్చతో ఉన్న స్వల్ప వ్యత్యాసాన్ని లేదా మలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἔσονται
  choice: అవుతారు
  rationale: భవిష్యత్ కాలాన్ని సహజంగా వ్యక్తపరుస్తూ, ఇక్కడ స్థానం లేదా స్థితిలో కలిగే తారుమారును సూచిస్తుంది.
- source_word: πρῶτοι
  choice: మొదటివారు
  rationale: కాలక్రమం కంటే స్థానం లేదా హోదాను సూచించే విస్తృత భావాన్ని నిలుపుతూ, సామెతసదృశమైన విరుద్ధ సమాంతరతను కాపాడుతుంది.
- source_word: ἔσχατοι
  choice: చివరివారు
  rationale: πρῶτοι అనే పదానికి నేరుగా విరుద్ధంగా స్థానం లేదా క్రమంలోని చివరను సూచిస్తుంది; ‘అల్పులు’ వంటి వ్యాఖ్యానాత్మక పరిమితిని చేర్చదు.
- source_word: πρῶτοι ἔσχατοι
  choice: మొదటివారిగా ఉన్న అనేకులు చివరివారవుతారు
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్త విధేయ నిర్మాణాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తపరుస్తూ ‘మొదటి—చివరి’ విరుద్ధతను నిలుపుతుంది.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: చివరివారు మొదటివారవుతారు
  rationale: గ్రీకులో రెండవ భాగంలో క్రియ లోపించినా మొదటి భాగం నుంచి అర్థమవుతుంది. తెలుగులో క్రియను పునరుక్తి చేయడం స్పష్టతనూ సామెతసదృశ సమతుల్యతనూ ఇస్తుంది.
theological_decisions:
- issue: స్థానాల తారుమారు అనే వాక్యం యొక్క పరిధి
  choice: రక్షణ, ప్రతిఫలం, సామాజిక హోదా లేదా అంత్యకాలపు స్థానం అని ప్రత్యేకంగా నిర్ణయించకుండా, స్థానం లేదా క్రమం తారుమారయ్యే సాధారణ వాక్యంగా ఉంచడం
  alternative: దేవుని రాజ్యంలో ప్రవేశం గురించిన మాటగా మాత్రమే, శిష్యుల ప్రతిఫలాల గురించిన మాటగా మాత్రమే, లేదా సాధారణ సామాజిక తారుమారుగా మాత్రమే అనువదించడం
  rationale: ఈ వచనం తారుమారును ప్రకటిస్తుంది గాని దాని ఖచ్చితమైన పరిధిని స్వయంగా నిర్వచించదు. అందువల్ల మూలంలోని భావవిస్తృతినీ వేదాంతపరమైన ఉద్వేగాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ప్రధాన వాక్యంలో స్పష్టత కోసం రెండు భాగాల్లోనూ క్రియను వ్యక్తం చేశాం; పాదటిప్పణిలో మూల గ్రీకు సంక్షిప్తతను చూపించాం.
