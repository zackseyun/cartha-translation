  source_fidelity: 'The Telugu faithfully represents the Greek sequence and sense: Καὶ ἰδού is conveyed by “ఇదిగో,” εἷς remains the nonspecific masculine “ఒకడు,” and the approach precedes the question. “అడిగాడు” is contextually appropriate for εἶπεν because the direct speech is a question. “నిత్యజీవం పొందడానికి” idiomatically conveys the ἵνα-purpose clause and σχῶ in this context without adding a merit-based theological conclusion.'
  naturalness: The wording is natural modern standard Telugu and retains a dignified biblical narrative register. “బోధకుడా” is a clear, natural vocative, and “నేను ఏ మంచి పని చేయాలి?” is idiomatic Telugu.
  terminology: “నిత్యజీవం” is established and suitable for ζωὴν αἰώνιον. “మంచి పని” is a sound contextual rendering of τί ἀγαθὸν with ποιήσω; the footnote appropriately preserves the broader possible sense. The footnote marker is correctly attached to the relevant expression in the Telugu text.
