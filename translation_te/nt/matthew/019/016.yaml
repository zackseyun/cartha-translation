id: MAT.19.16
reference: Matthew 19:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: te
  text: ఇదిగో, ఒకడు ఆయన దగ్గరికి వచ్చి, “బోధకుడా, నిత్యజీవం పొందడానికి నేను ఏ మంచి పని చేయాలి?[a]” అని అడిగాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను మంచిదేమి చేయాలి?” గ్రీకు పదబంధం ‘మంచి పని’ని లేదా మరింత సాధారణంగా ‘మంచిదేదో’ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: ఇదిగో
  rationale: καί కథన అనుసంధానాన్ని, ἰδού దృష్టిని ఆకర్షించే శక్తిని తెలుగులో సహజంగా కలిపి వ్యక్తం చేస్తుంది; ప్రత్యేకంగా ‘మరియు’ చేర్చడం ఇక్కడ భారంగా ఉంటుంది.
- source_word: εἷς
  choice: ఒకడు
  rationale: గ్రీకు పాఠం ఈ వచనంలో వ్యక్తిని ఇంకా ధనవంతుడిగా లేదా యువకుడిగా పేర్కొనదు. ‘ఒకడు’ ఆ అనిర్దిష్టతను నిలుపుతుంది.
- source_word: προσελθὼν αὐτῷ εἶπεν
  choice: ఆయన దగ్గరికి వచ్చి … అని అడిగాడు
  rationale: అతడు ముందుగా సమీపించి తరువాత ప్రశ్నించిన క్రమాన్ని సహజమైన తెలుగు క్రియాక్రమంతో వ్యక్తం చేస్తుంది. ప్రశ్నాత్మక ప్రత్యక్ష వాక్యం కావడంతో εἶπεν‌ను ‘అడిగాడు’గా అనువదించడం సందర్భానుకూలం.
- source_word: Διδάσκαλε
  choice: బోధకుడా
  rationale: బోధించే వ్యక్తిని సూచించే సాధారణ గౌరవసంబోధన; ‘ప్రభువా’ వంటి అదనపు క్రీస్తుశాస్త్రీయ భావాన్ని చేర్చదు.
- source_word: τί ἀγαθὸν ποιήσω
  choice: నేను ఏ మంచి పని చేయాలి?
  rationale: τί ἀγαθόν యొక్క ‘మంచిదేదో/మంచి పని’ అనే విస్తృతిని తెలుగులో అర్థవంతంగా వ్యక్తం చేస్తుంది; ποιήσω అనే ఆలోచనాత్మక ప్రశ్నకు ‘చేయాలి’ సహజంగా సరిపోతుంది.
- source_word: ἵνα σχῶ
  choice: పొందడానికి
  rationale: ఉద్దేశాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది. σχῶ యొక్క మూలార్థం ‘కలిగి ఉండడం’ అయినప్పటికీ, నిత్యజీవం సందర్భంలో ‘పొందడం’ సహజమైన భావవ్యక్తీకరణ.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవం
  rationale: స్థిరపడిన, స్పష్టమైన తెలుగు పదబంధం; కాలపరమైన నిరంతరత్వంతో పాటు నూతన నిబంధనలోని జీవ భావనను తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: వచ్చిన వ్యక్తి గుర్తింపు
  choice: ఒకడు
  alternative: ఒక మనిషి; ధనవంతుడైన యువకుడు
  rationale: ఈ వచనంలోని εἷς కంటే తరువాతి సందర్భం లేదా సమాంతర వృత్తాంతాల వివరాలను ముందుగానే చేర్చలేదు.
- issue: కార్యం మరియు నిత్యజీవం మధ్య ప్రశ్నలోని సంబంధం
  choice: నిత్యజీవం పొందడానికి నేను ఏ మంచి పని చేయాలి?
  alternative: నిత్యజీవాన్ని సంపాదించుకోవడానికి నేను ఏ సత్కార్యం చేయాలి?
  rationale: ఆ వ్యక్తి అడిగిన క్రియాకేంద్రీకృత ప్రశ్నను అలాగే ఉంచుతూ, ‘సంపాదించుకోవడం’ లేదా పుణ్యఫలం వంటి సిద్ధాంతాత్మక భావాలను అదనంగా చేర్చదు.
- issue: τί ἀγαθόν యొక్క భావవిస్తృతి
  choice: మంచి పని
  alternative: మంచిదేదో
  rationale: ποιήσωతో కలిసినప్పుడు ‘మంచి పని’ సహజ తెలుగు; అయినా గ్రీకులో ‘మంచి విషయం/పని’ అనే స్వల్ప విస్తృతి ఉన్నందున దానిని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు కథన శైలిలో అనువదించబడింది. ‘ఇదిగో’ కథన సజీవతను నిలుపుతుంది; ‘బోధకుడా’ మూల సంబోధనను సిద్ధాంతాత్మక విస్తరణ లేకుండా అందిస్తుంది.
