id: MAT.19.9
reference: Matthew 19:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: te
  text: 'అయితే నేను మీతో చెప్పేది ఏమిటంటే: లైంగిక అనైతికత కారణంగా తప్ప[a], తన భార్యకు విడాకులు ఇచ్చి మరొక స్త్రీని పెళ్లి చేసుకునేవాడు వ్యభిచారం చేస్తాడు; విడాకులు పొందిన స్త్రీని పెళ్లి చేసుకునేవాడు కూడా వ్యభిచారం చేస్తాడు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లైంగిక అనైతికత అనే ఆధారంపై తప్ప.’ గ్రీకు పదబంధాన్ని మరింత సంకుచితంగా ‘వివాహానికి వెలుపలి లైంగిక సంబంధం’ అని కూడా అనువదించవచ్చు; కొందరు దాన్ని ‘లైంగిక అవిశ్వాసం’ అని అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో, ‘విడాకులు పొందిన స్త్రీని పెళ్లి చేసుకునేవాడు కూడా వ్యభిచారం చేస్తాడు’ అనే చివరి వాక్యభాగం లేదు.
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: అయితే నేను మీతో చెప్పేది ఏమిటంటే
  rationale: δέ సందర్భంలో ముందటి చర్చతో స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; λέγω ... ὑμῖν యేసు నేరుగా, అధికారంతో చెప్పడాన్ని సహజ తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: ὃς ἂν
  choice: ఎవడైనా ... వాడు / చేసుకునేవాడు
  rationale: సాపేక్ష సర్వనామం ἄνతో కలిసి సాధారణంగా ఎవరైనా వర్తించే అనిర్దిష్ట షరతును సూచిస్తుంది; తెలుగులో సహజమైన సాధారణ వ్యక్తి నిర్మాణంతో వ్యక్తమైంది.
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: తన భార్యకు విడాకులు ఇచ్చి
  rationale: వివాహ సందర్భంలో ἀπολύω సాధారణంగా పంపివేయడం కాక చట్టబద్ధమైన లేదా సంబంధపరమైన విడాకులను సూచిస్తుంది; γυνή ఇక్కడ భార్య అనే అర్థంలో ఉంది.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: లైంగిక అనైతికత కారణంగా తప్ప
  rationale: ἐπί దానికి కారణం లేదా ఆధారాన్ని సూచిస్తుంది; πορνείαను కేవలం వ్యభిచారానికే పరిమితం చేయకుండా దాని విస్తృత లైంగిక నైతిక ఉల్లంఘన భావాన్ని నిలుపుతుంది.
- source_word: γαμήσῃ ἄλλην
  choice: మరొక స్త్రీని పెళ్లి చేసుకునేవాడు
  rationale: ἄλλην స్త్రీలింగంగా ఉండి ‘మరొక స్త్రీ’ని సూచిస్తుంది; తెలుగులో స్పష్టత కోసం ‘స్త్రీని’ వ్యక్తంగా చేర్చబడింది.
- source_word: μοιχᾶται
  choice: వ్యభిచారం చేస్తున్నాడు
  rationale: వర్తమాన క్రియారూపంలోని చర్య భావాన్ని సహజంగా తెలియజేస్తూ, వివాహ నిబద్ధతను ఉల్లంఘించే వ్యభిచారాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: విడాకులు పొందిన స్త్రీని పెళ్లి చేసుకునేవాడు కూడా వ్యభిచారం చేస్తున్నాడు
  rationale: నిర్దేశకంతో కూడిన కృదంత నిర్మాణం సాధారణంగా వర్తించే వ్యక్తిని సూచిస్తుంది; ἀπολελυμένην పరిపూర్ణ కర్మణి కృదంతంగా విడాకులు పొందిన స్త్రీ స్థితిని తెలియజేస్తుంది.
theological_decisions:
- issue: మినహాయింపు వాక్యంలో πορνεία అర్థం
  choice: లైంగిక అనైతికత
  alternative: వ్యభిచారం; వివాహేతర లైంగిక సంబంధం; లైంగిక అవిశ్వాసం
  rationale: πορνεία పదానికి μοιχεία కంటే విస్తృతమైన అర్థపరిధి ఉంది. విస్తృత అనువాదం వచనాన్ని ఒక నిర్దిష్ట సంఘపరమైన వివాహ-విడాకుల సిద్ధాంతానికి పరిమితం చేయకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: చివరి వాక్యభాగం καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται చేర్పు
  choice: ప్రధాన పాఠ్యంలో చేర్చి పాఠాంతరాన్ని పాదటిప్పణిలో సూచించడం
  alternative: కొన్ని ప్రాచీన ప్రతుల ఆధారంగా వదలివేయడం
  rationale: అందించిన SBLGNT పాఠ్యంలో ఈ భాగం పాఠాంతర సంకేతాలతో ఉన్నందున అనువాదంలో ఉంచబడింది; దాని ప్రతుల అనిశ్చితి పాదటిప్పణిలో పారదర్శకంగా నమోదు చేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్య గాంభీర్యాన్ని నిలుపుతూ అనువదించబడింది. ‘విడాకులు’, ‘లైంగిక అనైతికత’, ‘వ్యభిచారం’ వంటి ప్రస్తుత, స్పష్టమైన పదాలు వాడబడ్డాయి; మూలంలోని పురుషుని గురించిన నిర్దిష్ట ఉదాహరణను లింగ-తటస్థంగా మార్చలేదు.
