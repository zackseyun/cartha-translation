review_pass:
  verdict: revise
  source_fidelity: The draft preserves all principal source elements, including the future enthronement of the followers, twelve thrones, and judgment of Israel’s twelve tribes. However, its word order makes “పునర్నవీకరణలో” most readily modify the Son of Man’s sitting rather than the disciples’ promised sitting. In Greek, ἐν τῇ παλιγγενεσίᾳ belongs with the main promise to those who followed Jesus, with the ὅταν clause specifying the occasion.
  naturalness: The language is broadly natural modern standard Telugu. Reordering the temporal and participial clauses makes the sentence easier to follow and more clearly expresses the future force of καθήσεσθε.
  terminology: “మనుష్యకుమారుడు,” “పునర్నవీకరణ,” “సింహాసనం,” “గోత్రాలు,” and “తీర్పు తీర్చడం” are suitable. “తన మహిమగల సింహాసనం” is a natural Telugu rendering of “the throne of his glory.”
  issues:
  - severity: medium
    issue: Ambiguous attachment of “పునర్నవీకరణలో”
    rationale: The current order, “నన్ను అనుసరించిన మీరు, పునర్నవీకరణలో మనుష్యకుమారుడు ... కూర్చున్నప్పుడు,” can read as though the renewal qualifies only the Son of Man’s sitting. The Greek locates the followers’ enthronement in the renewal, while the following temporal clause marks when the Son of Man sits.
  - severity: low
    issue: The emphatic/additive force of καὶ ὑμεῖς is not explicit
    rationale: Adding “కూడా” naturally represents the Greek “and you also” without overstating the emphasis.
