id: MAT.19.28
reference: Matthew 19:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: te
  text: 'యేసు వారితో ఇలా అన్నాడు: “నేను మీతో నిజంగా చెబుతున్నాను: పునర్నవీకరణలో[a], మనుష్యకుమారుడు తన మహిమగల సింహాసనం మీద కూర్చున్నప్పుడు, నన్ను అనుసరించిన మీరు కూడా పన్నెండు సింహాసనాల మీద కూర్చొని ఇశ్రాయేలు పన్నెండు గోత్రాలకు తీర్పు తీరుస్తారు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పునర్జననంలో,” “కొత్త లోకంలో,” లేదా “నూతన సృష్టిలో” అని కూడా అనువదించవచ్చు. ఇక్కడ ఇది బహుశా వ్యక్తిగత పునర్జన్మను కాక, మనుష్యకుమారుని పరిపాలనతో సంబంధం ఉన్న భవిష్యత్ పునర్నవీకరణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “తీర్పు తీర్చడం” అనే మాటకు ఇక్కడ పాలించడం లేదా పరిపాలనా అధికారం వినియోగించడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: నిజంగా
  rationale: గంభీరమైన, అధికారపూర్వకమైన ప్రకటనను పరిచయం చేసే పదం; ఆధునిక తెలుగులో సహజంగా దాని బలాన్ని తెలియజేస్తుంది.
- source_word: ἀκολουθήσαντές μοι
  choice: నన్ను అనుసరించిన మీరు
  rationale: సంబోధించబడుతున్న వారిని యేసును అనుసరించినవారిగా గుర్తిస్తూ, ‘నన్ను’ అనే వ్యక్తిగత సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: παλιγγενεσίᾳ
  choice: పునర్నవీకరణలో
  rationale: పునర్జననం లేదా పునరుద్ధరణ అనే భావవ్యాప్తిని నిలుపుతూ, ఈ సందర్భంలోని భవిష్యత్ నూతనీకరణను సూచిస్తుంది; వ్యక్తిగత ఆత్మీయ పునర్జన్మగా మాత్రమే పరిమితం చేయదు.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: ఈ బిరుదుకు స్థిరమైన తెలుగు రూపం; దాని దానియేలు గ్రంథ సంబంధిత, మెస్సీయార్థ ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: తన మహిమగల సింహాసనం మీద
  rationale: తెలుగులో సహజంగా ఉండి, సింహాసనానికి సంబంధించిన మహిమను స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: మీరు ... కూర్చుని
  rationale: మనుష్యకుమారుని సింహాసనాసీనతతో పాటు శిష్యులకూ కలిగే భవిష్యత్ స్థానాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- source_word: κρίνοντες
  choice: తీర్పు తీరుస్తారు
  rationale: క్రియ యొక్క ప్రాథమిక న్యాయనిర్ణయ భావాన్ని నిలుపుతుంది; పాలించడం అనే విస్తృత భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చదు.
- source_word: φυλὰς τοῦ Ἰσραήλ
  choice: ఇశ్రాయేలు పన్నెండు గోత్రాలు
  rationale: ఇశ్రాయేలు ప్రజల సంప్రదాయ గోత్ర విభజనను ఖచ్చితంగా, సుపరిచితంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఈ సందర్భంలో παλιγγενεσία అర్థం
  choice: మనుష్యకుమారుని సింహాసనాసీనతతో సంబంధం ఉన్న భవిష్యత్ పునర్నవీకరణ
  alternative: వ్యక్తిగత పునర్జన్మ; కొత్త యుగం; కొత్త లోకం
  rationale: తక్షణ సందర్భం వ్యక్తిగత మారుమనస్సు గురించి కాక, భవిష్యత్ సింహాసనాసీనత మరియు తీర్పు గురించి ఉంది. అయితే నిర్దిష్ట అంత్యకాల పద్ధతిని పాఠ్యంలో చేర్చకుండా భావవ్యాప్తిని నిలుపుతుంది.
- issue: κρίνοντες యొక్క భావ పరిధి
  choice: తీర్పు తీర్చడం
  alternative: పాలించడం లేదా పరిపాలించడం
  rationale: గ్రీకు పదం సందర్భంలో పాలనా అధికారాన్ని కూడా సూచించవచ్చు; అయినప్పటికీ దాని ప్రత్యక్ష న్యాయనిర్ణయ భావాన్ని ప్రధాన పాఠ్యం ఉంచి, విస్తృత భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని గంభీరతను నిలుపుతూ అతిగా సంస్కృతీకృతమైన లేదా సంఘపరమైన ప్రత్యేక పదజాలాన్ని నివారించాం. రెండు పాదసూచిక గుర్తులూ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
