id: MAT.19.3
reference: Matthew 19:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: te
  text: పరిసయ్యులు ఆయన దగ్గరకు వచ్చి, ఆయనను పరీక్షిస్తూ, “ఏ కారణం చేతనైనా ఒక పురుషుడు తన భార్యకు విడాకులు ఇవ్వడం అనుమతించబడిందా?” అని అడిగారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఏ ఆధారం మీదనైనా” లేదా “ప్రతి కారణం చేత” అని కూడా అనువదించవచ్చు. గ్రీకు పదబంధం విడాకులకు అనుమతించదగిన ఆధారాల గురించి విస్తృతమైన న్యాయప్రశ్నను ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: దగ్గరకు వచ్చి
  rationale: ఒకరి వైపు వచ్చి సమీపించడమనే దిశాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πειράζοντες
  choice: పరీక్షిస్తూ
  rationale: పరీక్షించడం లేదా చిక్కులో పెట్టాలని ప్రయత్నించడం అనే భావాలకు వీలిస్తుంది; శత్రుత్వ ఉద్దేశాన్ని అతిగా స్పష్టీకరించకుండా సందర్భానికే వదిలేస్తుంది.
- source_word: ἔξεστιν
  choice: ధర్మశాస్త్రం ప్రకారం సమ్మతమేనా
  rationale: ఇది సాధారణ అనుమతి గురించి కాక, ధార్మిక-న్యాయపరమైన చర్చలో ఏది అనుమతించబడిందనే ప్రశ్న అని స్పష్టం చేస్తుంది.
- source_word: ἀνθρώπῳ
  choice: ఒక పురుషుడు
  rationale: తరువాత వచ్చే ‘తన భార్య’ అనే మాటతో సూచిత వ్యక్తి భర్త అని స్పష్టమవుతుంది; మూలంలోని పుంలింగ ఏకవచనాన్ని కాపాడుతుంది.
- source_word: ἀπολῦσαι
  choice: విడాకులు ఇవ్వడం
  rationale: వివాహ సందర్భంలో ‘పంపివేయడం’ అనే అక్షరార్థం కంటే న్యాయపరమైన విడాకుల భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: γυναῖκα αὐτοῦ
  choice: తన భార్యకు
  rationale: వివాహం, విడాకుల సందర్భంలో γυνή అంటే భార్య; αὐτοῦ యొక్క స్వామ్య సంబంధాన్ని ‘తన’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: ఏ కారణం చేతనైనా
  rationale: విడాకులకు అనుమతించదగిన కారణాల పరిధి ఎంత విస్తృతమనే ప్రశ్నను, దానిని ముందుగానే పరిష్కరించకుండా, కాపాడుతుంది.
theological_decisions:
- issue: విడాకుల గురించి మొదటి శతాబ్దపు ధార్మిక-న్యాయ చర్చను తరువాతి మతశాఖల సిద్ధాంతంతో పరిమితం చేయకుండా అనువదించడం
  choice: ఏ కారణం చేతనైనా ఒక పురుషుడు తన భార్యకు విడాకులు ఇవ్వడం ధర్మశాస్త్రం ప్రకారం సమ్మతమేనా?
  alternative: ఏ కారణం మీదనైనా ఒక భర్త తన భార్యను పంపివేయడం అనుమతించబడిందా?
  rationale: వచనం యేసు సమాధానాన్ని ఇంకా ఇవ్వకుండా ఒక విస్తృత న్యాయప్రశ్నను మాత్రమే ఉంచుతుంది. ఎంపిక చేసిన రూపం ప్రశ్నలోని విస్తృతిని, ధర్మశాస్త్ర సంబంధిత స్వరూపాన్ని కాపాడుతుంది; ఏ ప్రత్యేక విడాకుల సిద్ధాంతాన్నీ ముందుగానే చొప్పించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ధర్మశాస్త్రం ప్రకారం సమ్మతమేనా’ అనే రూపం ἔξεστιν యొక్క న్యాయ-ధార్మిక సందర్భాన్ని సాధారణ పాఠకునికి స్పష్టంగా ఉంచుతుంది.
