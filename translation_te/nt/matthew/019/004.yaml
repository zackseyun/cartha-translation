  source_fidelity: మూల గ్రీకుకు విశ్వసనీయంగా ఉంది. ἀποκριθεὶς εἶπεν ను సహజంగా సంక్షిప్తం చేసింది; Οὐκ ἀνέγνωτε లోని ప్రశ్నాత్మక సవాలు నిలిచింది. ‘ఆదినుండి’ సృష్టించినవాడితో సహజంగా అనుసంధానమవుతుంది. κτίσας మరియు ἐποίησεν మధ్యనున్న భేదం ‘సృష్టించినవాడు’/‘చేశాడు’ ద్వారా కాపాడబడింది; αὐτούς కూడా ‘వారిని’గా ప్రతిఫలించింది.
