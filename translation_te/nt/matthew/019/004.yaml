source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: te
  text: 'ఆయన జవాబుగా ఇలా అన్నాడు: “ఆదినుండి వారిని సృష్టించినవాడు[a] వారిని మగవారిగాను ఆడవారిగాను చేశాడని మీరు చదవలేదా?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సృష్టికర్త.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: ఆయన జవాబుగా ఇలా అన్నాడు
  rationale: కృదంతం + సమాపక క్రియతో ఉన్న గ్రీకు ప్రయోగాన్ని తెలుగులో సహజంగా, దాని జవాబు భావాన్ని నిలుపుతూ వ్యక్తం చేస్తుంది.
- source_word: Οὐκ ἀνέγνωτε
  choice: మీరు చదవలేదా?
  rationale: లేఖన పరిజ్ఞానాన్ని ప్రశ్నించే గ్రీకు ప్రశ్నార్థక ప్రయోగానికి ఇది సహజమైన తెలుగు రూపం; గ్రీకులోని సవాలు చేసే ధ్వనిని నిలుపుతుంది.
- source_word: ὅτι
  choice: అని
  rationale: వారు చదివి ఉండవలసిన విషయాన్ని పరిచయం చేసే ὅτιకి తెలుగు పరోక్ష వాక్యంలో సహజమైన రూపం.
- source_word: ὁ κτίσας
  choice: సృష్టించినవాడు
  rationale: గ్రీకు నామీకృత కృదంతాన్ని బిరుదుగా మార్చకుండా పారదర్శకంగా అనువదిస్తుంది.
- source_word: ἀπ’ ἀρχῆς
  choice: ఆదినుండి
  rationale: ఆదికాండంలోని సృష్టి భాషను ప్రతిధ్వనింపజేస్తూ, ఈ పదబంధం ‘సృష్టించినవాడు’ అనే భావంతో అనుసంధానమయ్యేలా ఉంచుతుంది.
- source_word: ἄρσεν καὶ θῆλυ
  choice: మగవారిగాను ఆడవారిగాను
  rationale: గ్రీకులోని లింగజతను, ఆదికాండం 1:27కు ఉన్న సూచనను స్పష్టంగా నిలుపుతూ ఆధునిక తెలుగులో గౌరవప్రదంగా ఉంటుంది.
- source_word: ἐποίησεν αὐτούς
  choice: వారిని … చేశాడు
  rationale: κτίσαςను ‘సృష్టించినవాడు’గా అనువదించినందున, వేరైన ποιέω క్రియను ‘చేశాడు’గా ఇచ్చి గ్రీకులోని రెండు క్రియల తేడాను నిలుపుతుంది.
theological_decisions:
- issue: ఆదికాండం 1:27కు సంబంధించిన సృష్టి ప్రకటన
  choice: మగవారిగాను ఆడవారిగాను
  alternative: పురుషునిగాను స్త్రీగాను
  rationale: మూలంలోని ἄρσεν καὶ θῆλυ అనే సృష్టి సంబంధ జతను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది; వచనం చెప్పేదానికంటే అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణంతో, లేఖనోచితమైన గౌరవభావాన్ని నిలుపుకుంది. ‘ఆదినుండి’ని ‘సృష్టించినవాడు’కు దగ్గరగా ఉంచి గ్రీకు పదబంధ సంబంధాన్ని కాపాడింది.
