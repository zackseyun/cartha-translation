id: MAT.21.28
reference: Matthew 21:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: te
  text: “అయితే మీకేమనిపిస్తుంది? ఒక మనిషికి ఇద్దరు పిల్లలు[a] ఉన్నారు. అతడు మొదటి బిడ్డ దగ్గరకు వెళ్లి, ‘బిడ్డా, నువ్వు ఈ రోజు ద్రాక్షతోటలో పని చేయి’ అన్నాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇద్దరు కుమారులు.” అయితే ఇక్కడి గ్రీకు పదం (τέκνα) నిర్దిష్టంగా కుమారులను మాత్రమే కాక “పిల్లలను” సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: అయితే మీకేమనిపిస్తుంది?
  rationale: δὲ యొక్క స్వల్ప అనుసంధాన భావాన్ని ‘అయితే’ తెలియజేస్తుంది; δοκεῖ అనే శ్రోతల అభిప్రాయాన్ని అడిగే ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో ‘మీకేమనిపిస్తుంది?’గా అందిస్తుంది.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: ఉపమాన కథలోని పురుష గృహస్థుణ్ణి సూచించే సహజమైన, మూలానికి సరిపడే రూపం.
- source_word: τέκνα δύο
  choice: ఇద్దరు పిల్లలు
  rationale: τέκνα అనేది లింగాన్ని నిర్దిష్టంగా చెప్పని ‘పిల్లలు’ అనే విస్తృత పదం; సంప్రదాయంగా వాడే ‘కుమారులు’ కంటే మూలపద పరిధిని కాపాడుతుంది.
- source_word: προσελθὼν τῷ πρώτῳ
  choice: మొదటి బిడ్డ దగ్గరకు వెళ్లి
  rationale: కృదంతంలోని వరుస చర్యను సహజమైన తెలుగు కథన శైలిలో తెలియజేస్తూ, ‘మొదటివాని’ అనే లింగసూచక రూపాన్ని నివారిస్తుంది.
- source_word: Τέκνον
  choice: బిడ్డా
  rationale: τέκνον యొక్క విస్తృత కుటుంబార్థాన్ని, తండ్రి నేరుగా సంబోధిస్తున్న ఆప్యాయ స్వరాన్ని సహజంగా నిలుపుతుంది; మూలంలో లేని ‘నా’ అనే స్వామ్యార్థాన్ని చేర్చదు.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: నువ్వు ఈ రోజు ... పని చేయి
  rationale: ఆజ్ఞార్థక క్రియలను స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది; సందర్భానికి అవసరమైన కర్తను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: ద్రాక్షతోటలో
  rationale: ἐν యొక్క స్థలార్థాన్ని, ἀμπελών యొక్క వ్యవసాయ చిత్రణను నేరుగా కాపాడుతుంది.
theological_decisions:
- issue: τέκνα/τέκνον పదాలను సంప్రదాయానుసారం ‘కుమారులు/కుమారుడా’గా సంకుచితం చేయాలా?
  choice: పిల్లలు / బిడ్డా
  alternative: కుమారులు / కుమారుడా
  rationale: ఈ వచనంలోని గ్రీకు τέκνα, τέκνον పదాలు υἱοί/υἱέ కంటే విస్తృతమైనవి. కాబట్టి ఉపమానాన్ని ముందుగానే పురుష సంతానానికి పరిమితం చేయకుండా మూలంలోని విస్తృత పదార్థాన్ని నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే ఉపమాన కథకు తగిన గౌరవప్రదమైన శైలిలో అనువదించబడింది. ప్రత్యక్ష సంభాషణలో సహజమైన ‘బిడ్డా’ మరియు ‘నువ్వు’ రూపాలు వాడబడ్డాయి.
