    text: లేదా, “తమకు ఆజ్ఞాపించినట్లే.” గ్రీకు క్రియ ఆజ్ఞ ఇవ్వడం లేదా దిశానిర్దేశాలు ఇవ్వడం అనే భావాలను వ్యక్తం చేయగలదు; ఇక్కడి సందర్భంలో “ఆదేశించిన” అనేది అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: వెళ్లి
  rationale: ఇది ప్రధాన క్రియకు ముందు జరిగిన కదలికను తెలిపే భూతకాల క్రియావిశేషణ రూపం; తెలుగు కథనంలో ‘వెళ్లి’ సహజంగా ఆ క్రమాన్ని వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: కాబట్టి
  rationale: మునుపటి వచనాల్లో యేసు ఇచ్చిన ఆదేశాలకు శిష్యుల స్పందనను అనుసంధానించే కథన కొనసాగింపుగా ఇక్కడ ‘కాబట్టి’ సహజంగా సరిపోతుంది.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులు
  rationale: సువార్తల సందర్భంలో యేసును అనుసరించే μαθηταίకు స్థిరమైన, సహజమైన తెలుగు పదం.
- source_word: ποιήσαντες
  choice: చేశారు
  rationale: καθὼς ఉపవాక్యంతో కలిసి ‘సూచించినట్టే చేశారు’ అనే సహజమైన తెలుగు నిర్మాణాన్ని ఇస్తుంది.
- source_word: καθὼς
  choice: సూచించినట్టే
  rationale: యేసు చెప్పినదానికి అనుగుణంగా వారు పూర్తిగా వ్యవహరించారనే సరిపోలికను ‘-ట్టే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: συνέταξεν
  choice: సూచించిన
  rationale: సందర్భంలో యేసు ముందుగా ఇచ్చిన నిర్దిష్ట దిశానిర్దేశాలను సూచిస్తుంది; గ్రీకు క్రియకు ‘ఆజ్ఞాపించిన’ అనే బలమైన భావం కూడా సాధ్యమైనందున దానిని పాదసూచికలో ఉంచాం.
- source_word: αὐτοῖς
  choice: తమకు
  rationale: వాక్యంలోని శిష్యులనే తిరిగి సూచించే పరోక్ష కర్మను తెలుగులో సహజంగా ‘తమకు’ అని వ్యక్తం చేశాం.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: వ్యక్తినామానికి ముందు ఉన్న గ్రీకు నిర్దిష్ట ఉపపదాన్ని తెలుగులో విడిగా అనువదించాల్సిన అవసరం లేదు.
