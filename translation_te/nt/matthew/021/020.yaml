  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని పాటించాం. గ్రీకు వాక్యంలోని ఆశ్చర్యభావాన్ని ప్రశ్న నిర్మాణం ద్వారా సహజంగా నిలిపాం; మూలంలో లేని సిద్ధాంతార్థాన్ని చేర్చలేదు.
