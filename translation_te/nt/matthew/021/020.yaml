source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: te
  text: శిష్యులు అది చూసి ఆశ్చర్యపడి, “అంజూరపు చెట్టు వెంటనే ఎలా ఎండిపోయింది?” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: అది చూసి
  rationale: ఆరిస్ట్ కృదంతాన్ని సహజమైన తెలుగు పూర్వకాలిక క్రియారూపంగా అనువదించాం. గ్రీకులో కర్మ స్పష్టంగా లేకపోయినా, ముందున్న సందర్భంలోని చెట్టు ఎండిపోయిన సంగతిని సూచించడానికి ‘అది’ చేర్చాం.
- source_word: ἐθαύμασαν
  choice: ఆశ్చర్యపడి
  rationale: θαυμάζω ఇక్కడ విస్మయం లేదా ఆశ్చర్యాన్ని సూచిస్తుంది; ‘ఆశ్చర్యపడి’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది.
- source_word: λέγοντες
  choice: అన్నారు
  rationale: తెలుగులో ప్రత్యక్ష వాక్యంతో ‘అన్నారు’ అనడం సహజమైనందున గ్రీకు కృదంతాన్ని ప్రధాన వాక్య క్రియగా వ్యక్తం చేశాం.
- source_word: Πῶς
  choice: ఎలా
  rationale: జరిగిన విధానాన్ని ప్రశ్నించే గ్రీకు ప్రశ్నార్థక పదానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: παραχρῆμα
  choice: వెంటనే
  rationale: ‘తక్షణమే/అప్పటికప్పుడే’ అనే కాలార్థాన్ని స్పష్టంగా నిలుపుతూ, సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండే పదాన్ని ఎంచుకున్నాం.
- source_word: ἐξηράνθη
  choice: ఎండిపోయింది
  rationale: చెట్టు వాడి ఎండిపోవడాన్ని తెలుగులో సహజంగా తెలిపే రూపం; గ్రీకు ఆరిస్ట్ పాసివ్‌కు సందర్భానుగుణ ఫలిత స్థితిని వ్యక్తం చేస్తుంది.
- source_word: ἡ συκῆ
  choice: అంజూరపు చెట్టు
  rationale: συκῆ అనే నిర్దిష్ట వృక్షనామాన్ని ఆధునిక తెలుగులో సాధారణంగా అర్థమయ్యే విధంగా అనువదించాం.
