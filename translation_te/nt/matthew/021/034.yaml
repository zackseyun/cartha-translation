source:
  edition: SBLGNT
  text: ὅτε δὲ ἤγγισεν ὁ καιρὸς τῶν καρπῶν, ἀπέστειλεν τοὺς δούλους αὐτοῦ πρὸς τοὺς γεωργοὺς λαβεῖν τοὺς καρποὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: te
  text: అయితే పండ్ల కాలం సమీపించినప్పుడు, తన పండ్లను తీసుకోవడానికి అతడు తన సేవకులను[a] కౌలు రైతుల[b] దగ్గరకు పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన బానిసలను.’ గ్రీకు పదం δοῦλος సేవకుడినిగానీ బానిసనిగానీ సూచించవచ్చు; ఇక్కడ వారు యజమాని తరఫున పంపబడినవారనే పాత్రకు ప్రాధాన్యం ఇచ్చి ‘సేవకులు’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘రైతులు,’ ‘కౌలుదారులు,’ లేదా ‘ద్రాక్షతోటను సాగుచేసేవారు.’ గ్రీకు పదం γεωργός సాగుచేసేవాడిని సూచిస్తుంది; ఈ ఉపమానంలో వారు మరొకరి ద్రాక్షతోటను కౌలుకు తీసుకుని సాగుచేస్తున్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: అయితే ... సమీపించినప్పుడు
  rationale: ὅτε తెలిపే కాలసంబంధాన్ని ‘అప్పుడు’ భావంతో ఉన్న ‘-ినప్పుడు’ నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది; δέ లోని స్వల్ప కథన మలుపును ‘అయితే’ నిలుపుతుంది.
- source_word: ἤγγισεν
  choice: సమీపించినప్పుడు
  rationale: ἐγγίζω అంటే ‘దగ్గరకు రావడం/సమీపించడం’; పండ్ల కాలం ఇంకా ఆరంభం కాకముందే దగ్గరపడిందనే భావాన్ని ఇది నిలుపుతుంది.
- source_word: ὁ καιρὸς τῶν καρπῶν
  choice: పండ్ల కాలం
  rationale: వ్యవసాయ సందర్భంలో καιρός తగిన కాలాన్ని, τῶν καρπῶν ఆ కాలం పండ్లకు సంబంధించినదని సూచిస్తాయి; ‘పండ్ల కాలం’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: ἀπέστειλεν
  choice: పంపాడు
  rationale: సాధారణ కథన సందర్భంలో ‘పంపాడు’ సహజమైన సమానార్థకం.
- source_word: τοὺς δούλους αὐτοῦ
  choice: తన సేవకులను
  rationale: δοῦλος సేవకుడు లేదా బానిసను సూచించగలదు. ఇక్కడ యజమాని తరఫున పంపబడిన ప్రతినిధుల పాత్ర ముందుంటుంది కాబట్టి ‘సేవకులు’ ఎంచుకుని, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: πρὸς τοὺς γεωργοὺς
  choice: కౌలు రైతుల దగ్గరకు
  rationale: γεωργός సాగుచేసేవాడిని సూచిస్తుంది; ఉపమాన సందర్భంలో వారు మరొకరి ద్రాక్షతోటను సాగుచేసే కౌలుదారులు కాబట్టి ‘కౌలు రైతులు’ వారి పాత్రను స్పష్టం చేస్తుంది.
- source_word: λαβεῖν
  choice: తీసుకోవడానికి
  rationale: λαμβάνω యొక్క విస్తృతమైన ‘తీసుకోవడం/పొందడం’ భావాన్ని నిలుపుతుంది; ‘వసూలు చేయడం’ కంటే ఇది మూలపదానికి దగ్గరగా ఉండి, సందర్భంలో యజమానికి చెందిన దిగుబడిని పొందడాన్ని సూచిస్తుంది.
- source_word: τοὺς καρποὺς αὐτοῦ
  choice: తన పండ్లను
  rationale: బహువచన καρπούς ను ‘పండ్లు’గా, αὐτοῦ ను ‘తన’గా ప్రత్యక్షంగా నిలిపాం; ద్రాక్షతోట సందర్భంలోని సజీవ వ్యవసాయ రూపకాన్ని కాపాడాం.
