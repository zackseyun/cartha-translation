id: MAT.21.46
reference: Matthew 21:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: te
  text: ఆయనను పట్టుకోవాలని వారు ప్రయత్నిస్తున్నప్పటికీ, జనసమూహాలకు భయపడ్డారు; ఎందుకంటే ప్రజలు ఆయనను ఒక ప్రవక్తగా భావించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: ప్రయత్నిస్తున్నప్పటికీ
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న ప్రయత్నాన్ని సూచిస్తుంది; ప్రధాన క్రియతో ఉన్న వ్యతిరేక భావసంబంధాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘ప్రయత్నిస్తున్నప్పటికీ’ అని అనువదించాం.
- source_word: κρατῆσαι
  choice: పట్టుకోవాలని
  rationale: ఈ శత్రుత్వపూరిత సందర్భంలో యేసును బలవంతంగా అదుపులోకి తీసుకోవడం భావం. ‘పట్టుకోవడం’ సహజమైన తెలుగు పదం; ఇది చర్యను స్పష్టంగా ఉంచి, ఆధునిక న్యాయపరమైన ‘అరెస్టు’ అనే భావాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: ἐφοβήθησαν
  choice: భయపడ్డారు
  rationale: సాధారణ భూతకాల భావాన్ని సహజ తెలుగులో నేరుగా వ్యక్తపరుస్తుంది; ఆరంభార్థాన్ని అదనంగా చేర్చదు.
- source_word: τοὺς ὄχλους
  choice: జనసమూహాలకు
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, కూడివున్న ప్రజలను సూచించే ఆధునిక ప్రామాణిక తెలుగు రూపం.
- source_word: ἐπεὶ
  choice: ఎందుకంటే
  rationale: వారు జనసమూహాలకు భయపడటానికి కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: ప్రజలు ఆయనను ఒక ప్రవక్తగా భావించారు
  rationale: ‘ఒకరిని ఏదోగా ఎంచడం/భావించడం’ అనే గ్రీకు నుడికారాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది. క్రియకు అంతర్నిహిత కర్త జనసమూహాలే కావడంతో ‘ప్రజలు’ అని స్పష్టం చేశాం.
- source_word: προφήτην
  choice: ఒక ప్రవక్తగా
  rationale: ఇక్కడ నిర్దిష్ట ఉపపదం లేని నామవాచకం యేసును ప్రవక్తల వర్గానికి చెందినవానిగా ప్రజలు భావించారని సూచిస్తుంది; ఆయన సంపూర్ణ వ్యక్తిత్వంపై అదనపు నిర్ణయం చేయదు.
theological_decisions:
- issue: ప్రజలు యేసును προφήτηνగా భావించారనే వాక్యాన్ని, ఆయన గురించి మరింత క్రీస్తుతత్వ నిర్ణయాన్ని చేర్చకుండా ఎలా అనువదించాలి
  choice: ప్రజలు ఆయనను ఒక ప్రవక్తగా భావించారు
  alternative: ప్రజలు ఆయనను ప్రవక్తగా ఎంచారు / ప్రవక్తగా పరిగణించారు
  rationale: ఇది ప్రజల దృష్టికోణాన్ని నివేదిస్తుంది గాని యేసు వ్యక్తిత్వానికి సంపూర్ణ నిర్వచనం ఇవ్వదు. ‘ఒక ప్రవక్తగా భావించారు’ అనే రూపం ఆయన కేవలం ప్రవక్త మాత్రమే అని సూచించకుండా కథనంలోని అంచనాను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వ్యతిరేక సంబంధాన్ని ‘అప్పటికీ’తో, కారణ సంబంధాన్ని ‘ఎందుకంటే’తో స్పష్టంగా చూపించాం. అవసరం లేని పాదసూచికలను చేర్చలేదు.
