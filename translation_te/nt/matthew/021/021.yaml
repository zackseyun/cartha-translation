  to: 'అయితే యేసు వారికి జవాబిస్తూ ఇలా చెప్పాడు: “నేను మీతో నిజంగా చెబుతున్నాను: మీకు విశ్వాసం ఉండి, మీరు సందేహించకుండా ఉంటే[a], అంజూరపు చెట్టుకు జరిగినదాన్ని మీరు చేయడమే కాదు; ఈ కొండతో, ‘పైకెత్తబడి సముద్రంలో పడవేయబడిపో’ అని చెప్పినా, అది జరుగుతుంది.”'
  rationale: The revision removes an unnecessary temporal implication from δέ, improves the idiomatic Telugu form of the two passive commands to the mountain, and refines the lexical-alternative footnote. It retains the source’s ellipsis concerning the fig tree and does not resolve the saying’s vivid imagery into either a literalistic or merely metaphorical interpretation.
