review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ response, faith, the prohibition against doubting, the fig-tree comparison, the demonstrative “this mountain,” and the future assurance. However, the passive imperatives addressed to the mountain are expressed somewhat awkwardly in Telugu and can be rendered more clearly while retaining the Greek passive imagery.
  naturalness: The overall register is modern and readable. “అప్పుడు” gives δέ a stronger temporal sense than necessary, and “పైకి లేపబడి” is less idiomatic than “పైకెత్తబడి” in this direct command.
  terminology: “విశ్వాసం” is appropriate for πίστις in this context. “సందేహించకుండా” appropriately renders διακριθῆτε; the footnote preserves the relevant alternatives without imposing an interpretation.
  issues:
  - severity: low
    issue: δὲ is rendered as “అప్పుడు.”
    rationale: Although possible in narrative Telugu, “అప్పుడు” primarily marks time. The Greek δέ here more naturally marks a mild transition; “అయితే” reflects this without adding a temporal sequence.
  - severity: medium
    issue: The command to the mountain, “పైకి లేపబడి సముద్రంలో పడవేయబడు,” is awkward Telugu.
    rationale: The Greek has two passive imperatives. “పైకెత్తబడి సముద్రంలో పడవేయబడిపో” is more idiomatic as a command while preserving both passive forms and the physical imagery.
  - severity: low
    issue: The footnote’s phrase “మనసులో చీలిక లేకుండా” is understandable but not the most natural expression of the lexical alternative.
    rationale: “మనసు రెండుగా చీలకుండా” more directly and naturally communicates the sense of being divided in mind.
  revised_text: 'అయితే యేసు వారికి జవాబిస్తూ ఇలా చెప్పాడు: “నేను మీతో నిజంగా చెబుతున్నాను: మీకు విశ్వాసం ఉండి, మీరు సందేహించకుండా ఉంటే[a], అంజూరపు చెట్టుకు జరిగినదాన్ని మీరు చేయడమే కాదు; ఈ కొండతో, ‘పైకెత్తబడి సముద్రంలో పడవేయబడిపో’ అని చెప్పినా, అది జరుగుతుంది.”'
