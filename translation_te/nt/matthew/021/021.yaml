id: MAT.21.21
reference: Matthew 21:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: te
  text: 'అయితే యేసు వారికి జవాబిస్తూ ఇలా చెప్పాడు: “నేను మీతో నిజంగా చెబుతున్నాను: మీకు విశ్వాసం ఉండి, మీరు సందేహించకుండా ఉంటే[a], అంజూరపు చెట్టుకు జరిగినదాన్ని మీరు చేయడమే కాదు; ఈ కొండతో, ‘పైకెత్తబడి సముద్రంలో పడవేయబడిపో’ అని చెప్పినా, అది జరుగుతుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఊగిసలాడకుండా ఉంటే,” లేదా “మనసు రెండుగా చీలకుండా ఉంటే.”
    reason: διακριθῆτε అనే పదం సందేహించడంతో పాటు అంతరంగ ఊగిసలాట లేదా మనసు విభజితమైన స్థితిని కూడా సూచించగలదు.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: అప్పుడు యేసు వారికి ఇలా జవాబిచ్చాడు
  rationale: కృదంతంతో కూడిన గ్రీకు ప్రతిస్పందన సూత్రాన్ని సహజమైన ఆధునిక తెలుగు కథనంగా అందిస్తుంది; δέ ఇక్కడ స్వల్ప కథన మలుపును సూచిస్తుంది.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: యేసు పలికే గంభీరమైన, అధికారపూర్వక ధృవీకరణను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐὰν ἔχητε πίστιν
  choice: మీకు విశ్వాసం ఉండి
  rationale: ఇక్కడ πίστις దేవునిపై నమ్మకంతో కూడిన విశ్వాసాన్ని సూచిస్తుంది; ‘విశ్వాసం’ సాధారణంగా అర్థమయ్యే స్థిరమైన తెలుగు పదం.
- source_word: μὴ διακριθῆτε
  choice: మీరు సందేహించకుండా ఉంటే
  rationale: ఈ సందర్భంలో διακρίνω అంతరంగ సందేహం లేదా ఊగిసలాట భావాన్ని ఇస్తుంది; ప్రధాన పాఠంలో స్పష్టమైన అర్థాన్ని ఇచ్చి, ఇతర సాధ్య భావాలను పాదసూచికలో ఉంచాం.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: అంజూరపు చెట్టుకు జరిగినదాన్ని మీరు చేయడమే కాదు
  rationale: గ్రీకులోని సంక్షిప్త, అధ్యాహార వాక్యనిర్మాణం ముందరి సందర్భంలో చెట్టుకు జరిగిన సంఘటనను సూచిస్తుంది; దానిని అతివ్యాఖ్యానం చేయకుండా తెలుగులో స్పష్టం చేస్తుంది.
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: ఈ కొండతో ... అని చెప్పినా
  rationale: κἄν ఇచ్చే ‘అంతకంటే గొప్ప ఉదాహరణ అయినా’ అనే ఉద్ధరణ బలాన్ని ‘చెప్పినా’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది; demonstrative ను ‘ఈ’గా నిలుపుతుంది.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: పైకి లేపబడి సముద్రంలో పడవేయబడు
  rationale: రెండు గ్రీకు కర్మణి ఆజ్ఞారూపాలనూ, వాటి భౌతిక చిత్రణనూ తెలుగులో కర్మణి రూపంతో నిలుపుతుంది.
- source_word: γενήσεται
  choice: అది జరుగుతుంది
  rationale: γίνομαι భవిష్యత్ రూపం సూచించే సంఘటన నెరవేరడాన్ని సరళమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: అద్భుత కార్యానికి సంబంధించిన మాటలో πίστις అర్థం
  choice: విశ్వాసం
  alternative: నమ్మకం; నమ్మకత్వం
  rationale: ఈ సందర్భంలో ఇది వ్యక్తి లక్షణమైన నమ్మకత్వం కంటే దేవునిపై ఆధారపడే విశ్వాసాన్ని సూచిస్తుంది.
- issue: కొండను సముద్రంలో పడవేయడం అనే మాట స్వభావం
  choice: దాని బలమైన చిత్రాత్మక మాటను యథాతథంగా నిలుపడం
  alternative: కేవలం అక్షరార్థ అద్భుత వాగ్దానంగా పరిమితం చేయడం; కేవలం కష్టాలను అధిగమించే రూపకంగా మార్చడం
  rationale: మూలపాఠం ఉద్దేశపూర్వకంగా బలమైన చిత్రణను ఉపయోగిస్తుంది. అనువాదం దానిని ఒకే వ్యాఖ్యానానికి కుదించకుండా నిజమైన వ్యాఖ్యాన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే యేసు పలుకులోని గంభీరతను మరియు కొండ గురించిన బలమైన చిత్రణను నిలుపుతూ రూపొందించబడింది.
