reference: Matthew 21:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: te
  text: వారు యేసుకు జవాబుగా, “మాకు తెలియదు” అన్నారు. అప్పుడు ఆయన వారితో, “నేనూ ఏ అధికారంతో ఈ పనులు చేస్తున్నానో మీకు చెప్పను” అన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: జవాబిస్తూ
  rationale: వారి ప్రతిస్పందనను పరిచయం చేసే గ్రీకు క్రియావిశేషణ రూపాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Οὐκ οἴδαμεν
  choice: మాకు తెలియదు
  rationale: తెలుగులో జ్ఞానం లేదని చెప్పే సహజమైన, నేరుగా ఉన్న రూపం; గ్రీకు బహువచన వక్తలను సందర్భం స్పష్టపరుస్తుంది.
- source_word: ἔφη
  choice: అన్నారు
  rationale: భారరహితమైన సాధారణ ఉక్తి క్రియ; యేసుకు గౌరవార్థక ఏకవచన ప్రయోగాన్ని అనుసరిస్తుంది.
- source_word: καὶ αὐτός / Οὐδὲ ἐγὼ
  choice: ఆయన కూడా / నేను కూడా
  rationale: వారు చెప్పనందుకు ప్రతిగా యేసు కూడా చెప్పననే పరస్పర ప్రతిస్పందనను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: మీకు చెప్పను
  rationale: వర్తమాన రూపమైన λέγω ఇక్కడ సమాచారం వెల్లడించడానికి నిరాకరించే సందర్భోచిత భావాన్ని కలిగి ఉంది; తెలుగులో నిషేధ భవిష్యదర్థ రూపం సహజం.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ఏ అధికారంతో
  rationale: చర్యకు ఆధారమైన హక్కు లేదా అధికారాన్ని ప్రశ్నించే భావాన్ని సహజంగా, న్యాయసంబంధ బలంతో తెలియజేస్తుంది.
- source_word: ταῦτα ποιῶ
  choice: ఇవి చేస్తున్నానో
  rationale: ταῦτα యొక్క బహువచనాన్ని ‘ఇవి’గా నిలిపి, సందర్భంలోని యేసు చర్యలను సూచిస్తుంది; వర్తమాన చర్య భావాన్ని ‘చేస్తున్నాను’ ద్వారా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసు జవాబులో ἐξουσία స్వభావం
  choice: అధికారం
  alternative: హక్కు; శక్తి
  rationale: నాయకులు యేసు కార్యసామర్థ్యాన్ని కాక, ఆయన చర్యల చెల్లుబాటు మరియు వాటి ఆధారాన్ని ప్రశ్నిస్తున్నారు. ‘అధికారం’ ఈ న్యాయసంబంధమైన, దైవశాస్త్ర సంబంధమైన విస్తృతిని అనవసరంగా సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, సంభాషణకు తగిన గౌరవప్రదమైన శైలి. ‘అయితే’ గ్రీకులోని పరస్పర ప్రతిస్పందనను తెలుగులో సహజంగా కలుపుతుంది; కొత్త కారణార్థాన్ని చేర్చదు.
