id: MAT.21.9
reference: Matthew 21:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: te
  text: 'ఆయనకు ముందుగా వెళ్తున్నవారూ, ఆయనను అనుసరిస్తున్నవారూ అయిన జనసమూహాలు ఇలా కేకలు వేస్తూ ఉన్నాయి: “దావీదు కుమారునికి హోసన్నా![a][b] ప్రభువు నామంలో వచ్చేవాడు ధన్యుడు![c] అత్యున్నత స్థలాల్లో హోసన్నా!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “హోసన్నా” అనేది హెబ్రీ మూలం నుంచి వచ్చిన జయధ్వని. దాని మూల భావం “దయచేసి రక్షించు” లేదా “ఇప్పుడే రక్షించు” అనేదానికి దగ్గరగా ఉంటుంది; ఇక్కడ అది స్తుతి జయధ్వనిగా కూడా పనిచేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “దావీదు కుమారుడు” అనేది రాజసంబంధమైన మెస్సీయ బిరుదు.
    reason: cultural_note
  - marker: c
    text: ఈ మాట కీర్తన 118:26ను ప్రతిధ్వనిస్తుంది. ఆ కీర్తన హెబ్రీ పాఠంలో “ప్రభువు” అనేది దైవనామమైన యహ్వేను సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ὄχλοι
  choice: జనసమూహాలు
  rationale: గుమికూడిన అనేకమందిని సూచించే సహజమైన ఆధునిక తెలుగు పదం; ‘జనులు’ కంటే గ్రీకు బహువచనంలోని సమూహ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: οἱ προάγοντες αὐτὸν καὶ οἱ ἀκολουθοῦντες
  choice: ఆయనకు ముందుగా వెళ్తున్న జనసమూహాలూ, ఆయన వెనుక వస్తున్నవారూ
  rationale: ఊరేగింపులో యేసుకు ముందు వెళ్లేవారినీ వెనుక అనుసరించేవారినీ స్పష్టంగా చూపుతుంది; మొదటి వర్గం ఆయనను అధికారికంగా నడిపించిందనే అదనపు భావాన్ని కలిగించదు.
- source_word: ἔκραζον λέγοντες
  choice: ఇలా కేకలు వేస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న చర్యను ‘వేస్తూ ఉన్నారు’ నిలుపుతుంది; తరువాతి ప్రత్యక్ష వాక్యాన్ని ‘ఇలా’ సహజంగా పరిచయం చేస్తుంది.
- source_word: Ὡσαννά
  choice: హోసన్నా
  rationale: ఇక్కడ ఇది మూలంగా రక్షణకోరే పదమైనప్పటికీ ఆరాధనా జయధ్వనిగా పనిచేస్తుంది. అందువల్ల ప్రధాన పాఠంలో లిప్యంతరీకరించి, మూలార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: τῷ υἱῷ Δαυίδ
  choice: దావీదు కుమారునికి
  rationale: గ్రీకు దత్తివిభక్తిని సహజంగా ‘-నికి’తో వ్యక్తం చేస్తూ, రాజసంబంధమైన మెస్సీయ బిరుదును వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: వచ్చేవాడు ధన్యుడు
  rationale: గ్రీకు విశేషణార్థక కృదంతంలోని ఏకవచన వ్యక్తి సూచనను కాపాడుతూ తెలుగులో సహజమైన స్తుతి వాక్యంగా ఉంటుంది.
- source_word: ἐν ὀνόματι κυρίου
  choice: ప్రభువు నామంలో
  rationale: మూలంలోని ‘నామంలో’ అనే రూపాన్ని, దానిలోని ప్రతినిధిత్వం లేదా అధికార భావాన్ని వ్యాఖ్యానించి పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: ἐν τοῖς ὑψίστοις
  choice: సర్వోన్నత స్థలాల్లో
  rationale: అత్యున్నత పరలోక ప్రాంతాలను సూచించే అవకాశాన్ని నిలుపుతూ, ‘పరలోకాల్లో’ అని మూలం కంటే ఎక్కువగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: τῷ υἱῷ Δαυίδ లోని రాజసంబంధమైన మెస్సీయ బిరుదు
  choice: ‘దావీదు కుమారుడు’ అనే బిరుదునే ప్రధాన పాఠంలో ఉంచడం
  alternative: ‘మెస్సీయకు’ అని వివరణాత్మకంగా అనువదించడం
  rationale: ఈ బిరుదుకు మెస్సీయ సంబంధమైన ప్రాముఖ్యత ఉన్నప్పటికీ, గ్రీకు పాఠం నేరుగా ‘దావీదు కుమారుడు’ అంటుంది. ఆ చారిత్రక, వేదాంతపరమైన రూపాన్ని అనువాదం నిలుపుతుంది.
- issue: Ὡσαννά యొక్క అభ్యర్థన మరియు స్తుతి భావాలు
  choice: ప్రధాన పాఠంలో ‘హోసన్నా’ అని ఉంచి, మూల విజ్ఞాపన భావాన్ని పాదసూచికలో చెప్పడం
  alternative: ‘దయచేసి రక్షించు’ లేదా ‘ఇప్పుడే రక్షించు’ అని ప్రధాన పాఠంలో అనువదించడం
  rationale: ఈ సందర్భంలో పదం కేవలం సహాయం కోసం విజ్ఞాపన కాకుండా స్తుతితో కూడిన జయధ్వనిగా పనిచేస్తుంది. లిప్యంతరీకరణ ఈ రెండు పొరల మధ్యనున్న ఉద్వేగాన్ని కాపాడుతుంది.
- issue: కీర్తన ఉల్లేఖనంలోని κυρίου
  choice: గ్రీకు పదానికి అనుగుణంగా ‘ప్రభువు’ అని అనువదించడం
  alternative: ‘యహ్వే’ అని ప్రధాన పాఠంలో పెట్టడం
  rationale: మత్తయి గ్రీకు పాఠం κυρίου అని ఉంది; అయితే ఇది కీర్తన 118:26లోని దైవనామ నేపథ్యాన్ని ప్రతిధ్వనిస్తుంది. ప్రధాన పాఠం గ్రీకును అనుసరిస్తూ, ఆ నేపథ్యాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘నామంలో’, ‘ధన్యుడు’, ‘హోసన్నా’ వంటి పదాలు వాక్యంలోని వేదగ్రంథీయ ప్రతిధ్వనిని నిలుపుతాయి; పాతకాలపు క్రియారూపాలు, అతిగా సంస్కృతీకృతమైన పదబంధాలు నివారించబడ్డాయి.
