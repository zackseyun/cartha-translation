- from: 'ఆయనకు ముందుగా వెళ్తున్న జనసమూహాలూ, ఆయన వెనుక వస్తున్నవారూ ఇలా కేకలు వేస్తూ ఉన్నారు: “దావీదు కుమారునికి హోసన్నా![a][b] ప్రభువు నామంలో వచ్చేవాడు ధన్యుడు![c] సర్వోన్నత స్థలాల్లో హోసన్నా!”'
  to: 'ఆయనకు ముందుగా వెళ్తున్నవారూ, ఆయనను అనుసరిస్తున్నవారూ అయిన జనసమూహాలు ఇలా కేకలు వేస్తూ ఉన్నాయి: “దావీదు కుమారునికి హోసన్నా![a][b] ప్రభువు నామంలో వచ్చేవాడు ధన్యుడు![c] అత్యున్నత స్థలాల్లో హోసన్నా!”'
  rationale: ముఖ్య సవరణ గ్రీకులోని రెండు భాగస్వామక వర్గాలకూ ‘జనసమూహాలు’ వర్తిస్తుందని స్పష్టంగా చూపుతుంది. ‘వెనుక వస్తున్నవారు’ స్థానంలో ‘ఆయనను అనుసరిస్తున్నవారు’ పెట్టడం ἀκολουθοῦντες యొక్క వ్యక్తిగత అనుసరణ భావాన్ని నేరుగా నిలుపుతుంది. ‘సర్వోన్నత స్థలాల్లో’ను ‘అత్యున్నత స్థలాల్లో’గా మార్చడం ఆధునిక సహజత్వాన్ని పెంచుతుంది; మూలంలోని స్థలసూచక బహువచనాన్ని, దాని ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది. పాదసూచిక c హెబ్రీ కీర్తనలోని యహ్వే మరియు మత్తయి గ్రీకులోని κύριος మధ్య సంబంధాన్ని మరింత ఖచ్చితంగా వివరిస్తుంది.
