  source_fidelity: 'ప్రధాన భావం గ్రీకు పాఠానికి విశ్వసనీయంగా ఉంది: ముందుకు వెళ్లే, వెనుక అనుసరించే గుంపులు నిరంతరంగా బిగ్గరగా పలకడం; ‘హోసన్నా,’ దావీదు కుమారుడు, ప్రభువు నామంలో వచ్చేవాడు, అత్యున్నత స్థలాలు అన్న అంశాలన్నీ నిలిచాయి. అయితే మొదటి భాగంలో ‘జనసమూహాలూ’ అన్నది ముందుకు వెళ్లేవారికే వ్యాకరణపరంగా పరిమితమవుతున్నట్టు ఉంది; గ్రీకులో రెండు వర్గాలూ గుంపులే. దాన్ని స్పష్టంగా సవరించాం.'
  naturalness: సవరించిన వాక్యం ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, ఊరేగింపు సందర్భానికి తగిన గౌరవప్రదమైన శైలిలో ఉంది. ‘అనుసరిస్తున్నవారూ అయిన జనసమూహాలు’ రెండు గుంపుల సంబంధాన్ని స్పష్టపరుస్తుంది. ‘అత్యున్నత స్థలాల్లో’ గ్రీకు బహువచనాన్ని అనవసరంగా ‘పరలోకాలు’గా నిర్దిష్టం చేయకుండా ఉంచుతుంది.
  terminology: ‘హోసన్నా,’ ‘దావీదు కుమారుడు,’ ‘ప్రభువు,’ ‘నామంలో,’ ‘ధన్యుడు’ అనే సంప్రదాయబద్ధమైన, అర్థవంతమైన పదాలను నిలిపాం. పాదసూచికలో ‘యహ్వే’ని ప్రధాన పాఠంలో ప్రవేశపెట్టకుండా కీర్తన నేపథ్యాన్ని మాత్రమే వివరించాం.
