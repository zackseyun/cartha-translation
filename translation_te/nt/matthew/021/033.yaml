id: MAT.21.33
reference: Matthew 21:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: te
  text: “మరొక ఉపమానం వినండి. ఒక భూయజమాని ఉండేవాడు. అతడు ఒక ద్రాక్షతోటను నాటి, దాని చుట్టూ కంచె వేసి[a], అందులో ద్రాక్ష గానుగను తవ్వి, ఒక బురుజు కట్టాడు[b]. ఆ తోటను కౌలు రైతులకు కౌలుకు ఇచ్చి[c], వెళ్లిపోయాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దాని చుట్టూ ముళ్లకంచె వేశాడు.” గ్రీకు పదం కంచె, ముళ్లకంచె లేదా మరొక రకమైన ఆవరణ అడ్డంకిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ద్రాక్షతోటను నాటడం, దాని చుట్టూ కంచె వేయడం, ద్రాక్ష గానుగను తవ్వడం, బురుజు కట్టడం అనే చిత్రణ యెషయా 5:1–2ను ప్రతిధ్వనింపజేస్తుంది.
    reason: cross_reference
  - marker: c
    text: లేదా “ఆ తోటను రైతులకు అద్దెకిచ్చి.” ఈ మాట తోటను సాగుచేసే రైతులకు కౌలుకు అప్పగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: మరొక ఉపమానం వినండి
  rationale: బహువచన ఆజ్ఞారూపమైన ἀκούσατεను సహజమైన ప్రత్యక్ష ఆజ్ఞగా “వినండి” అని, παραβολήను యేసు బోధనా సందర్భానికి ప్రామాణికమైన “ఉపమానం” అని అనువదించాం.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: ఒక భూయజమాని ఉండేవాడు
  rationale: οἰκοδεσπότης ఇంటి లేదా ఆస్తి యజమానిని సూచిస్తుంది. ద్రాక్షతోటను కౌలుకిచ్చే ఈ వ్యవసాయ సందర్భంలో “భూయజమాని” పాత్రను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: ఒక ద్రాక్షతోటను నాటి
  rationale: φυτεύω అనే ‘నాటు’ భావాన్ని, ἀμπελών అనే ‘ద్రాక్షతోట’ భావాన్ని మూర్తమైన వ్యవసాయ చిత్రణతో నిలిపాం.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: దాని చుట్టూ కంచె వేసి
  rationale: φραγμός కంచె, ముళ్లకంచె లేదా మరొక రకమైన చుట్టుగోడను సూచించవచ్చు. “కంచె” పదార్థాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా సాధారణ భావాన్ని అందిస్తుంది.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: అందులో ద్రాక్ష గానుగను తవ్వి
  rationale: ὀρύσσω ‘తవ్వు’ అని, ληνός ద్రాక్షను తొక్కి రసం తీసే గానుగ లేదా ద్రాక్షరసపు తొట్టిని సూచిస్తుంది. “ద్రాక్ష గానుగ” వ్యవసాయ సందర్భాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: ᾠκοδόμησεν πύργον
  choice: ఒక బురుజు కట్టాడు
  rationale: πύργος అంటే బురుజు లేదా గోపురం. అది సాధారణంగా కాపలాకు ఉపయోగపడినా గ్రీకు మూలం ఆ పనిని స్పష్టంగా చెప్పదు; అందువల్ల “కాపలా బురుజు” అని విస్తరించలేదు.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: ఆ తోటను కౌలు రైతులకు కౌలుకిచ్చి
  rationale: మధ్యమ ప్రయోగంలోని ἐκδίδωμι కౌలుకు ఇవ్వడాన్ని సూచిస్తుంది; γεωργοί ఇక్కడ కేవలం పనివారు కాక, తోటను సాగుచేసే కౌలుదారులు. ఈ ఆర్థిక సంబంధాన్ని “కౌలు రైతులకు కౌలుకిచ్చి” స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπεδήμησεν
  choice: వేరే ప్రాంతానికి వెళ్లిపోయాడు
  rationale: ἀποδημέω తన నివాస ప్రాంతం నుంచి దూరంగా వెళ్లడాన్ని సూచిస్తుంది. “వేరే ప్రాంతానికి వెళ్లిపోయాడు” గమ్యదేశాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ఆ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: యెషయా 5:1–2లోని ద్రాక్షతోట చిత్రణతో అంతర్గ్రంథ సంబంధం
  choice: వ్యవసాయ చిత్రణను ప్రధాన పాఠ్యంలో యథాతథంగా ఉంచి, యెషయాతో ఉన్న ప్రతిధ్వనిని పాదసూచికలో తెలిపాం.
  alternative: ‘ముళ్లకంచె’ వంటి సంప్రదాయ పదాలతో యెషయా ప్రతిధ్వనిని ప్రధాన పాఠ్యంలో మరింత బలపరచడం.
  rationale: మత్తయి వాక్యం యెషయా 5ను బలంగా ప్రతిధ్వనింపజేస్తుంది. అయినా ఆ సంబంధాన్ని వ్యాఖ్యానంగా ప్రధాన పాఠ్యంలో చేర్చకుండా, మూలంలోని మూర్తమైన చిత్రణను కాపాడటం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. “భూయజమాని,” “కౌలు రైతులు,” “కౌలుకిచ్చి” అనే పదాలు పాత్రల మధ్యనున్న వ్యవసాయ-ఆర్థిక సంబంధాన్ని సహజంగా తెలియజేస్తాయి; “బురుజు” మూలంలోని πύργοςను దాని పనిని ఊహించి జోడించకుండా నిలుపుతుంది.
