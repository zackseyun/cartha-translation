source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: te
  text: అయితే, ‘మానవుల నుండి’[a] అని చెబితే, జనసమూహానికి భయపడుతున్నాం; ఎందుకంటే అందరూ యోహానును ప్రవక్తగా భావిస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మానవుల నుండి వచ్చినది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: అయితే, … అని చెబితే
  rationale: ἐὰν తో కూడిన aorist subjunctive ఒక సాధ్యమైన షరతును సూచిస్తుంది. ఈ తెలుగు రూపం ఆ షరతు భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: Ἐξ ἀνθρώπων
  choice: మనుషుల నుండి
  rationale: మునుపటి వచనంలోని ‘పరలోకం నుండి’ అనే దానికి విరుద్ధంగా, ఇది మానవ మూలాన్ని సూచిస్తుంది. ‘మనుషులు’ ఇక్కడ పురుషులను మాత్రమే కాకుండా మానవులను సాధారణంగా సూచిస్తుంది.
- source_word: φοβούμεθα τὸν ὄχλον
  choice: జనసమూహానికి భయపడుతున్నాం
  rationale: వర్తమానకాల క్రియలోని తక్షణ భయాన్ని, ὄχλος సూచించే సమకూడిన ప్రజలను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: πάντες
  choice: అందరూ
  rationale: జనసమూహంలోని వారందరినీ సమగ్రంగా సూచించే సహజమైన తెలుగు రూపం.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: యోహానును ప్రవక్తగా భావిస్తున్నారు
  rationale: ἔχω + object + ὡς + predicate అనే ప్రయోగం ఒకరిని ఒక విధంగా పరిగణించడాన్ని సూచిస్తుంది; ‘భావిస్తున్నారు’ ఆ మూల్యాంకన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: Ἰωάννην
  choice: యోహాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన పేరురూపం.
theological_decisions:
- issue: ‘పరలోకం నుండి’—‘మనుషుల నుండి’ అనే మూలవ్యత్యాసం
  choice: మనుషుల నుండి
  alternative: మానవ మూలమైనది
  rationale: ప్రధాన పాఠం గ్రీకు వాక్యంలోని సంక్షిప్తమైన మూలవ్యత్యాసాన్ని నిలుపుతుంది; పాదసూచిక భావాన్ని మరింత స్పష్టంగా చెప్పే ప్రత్యామ్నాయాన్ని అందిస్తుంది.
- issue: యోహాను గురించి జనసమూహపు అభిప్రాయ బలం
  choice: అందరూ యోహానును ప్రవక్తగా భావిస్తున్నారు
  alternative: అందరూ యోహానును ప్రవక్తగా పరిగణిస్తున్నారు
  rationale: ఇది జనసమూహపు అభిప్రాయాన్ని నివేదిస్తుంది; దానిని విస్తరించి అదనపు సిద్ధాంత నిర్ణయంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. మూలంలోని షరతు, మానవ–దైవిక మూలవ్యత్యాసం, జనసమూహపు అభిప్రాయం యథాతథంగా నిలుపబడ్డాయి.
