id: MAT.21.29
reference: Matthew 21:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Οὐ θέλω· ὕστερον δὲ μεταμεληθεὶς⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: te
  text: అతడు జవాబుగా, “నాకు ఇష్టం లేదు” అన్నాడు. కానీ తరువాత మనసు మార్చుకొని[a] వెళ్లాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చేసినదానికి విచారించి” లేదా “తన నిర్ణయాన్ని మార్చుకొని.” గ్రీకు కృదంతం, తన వైఖరిని మార్చుకునేలా చేసిన విచార భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: జవాబిచ్చాడు
  rationale: గ్రీకు కథనంలో సాధారణంగా వచ్చే కృదంత-క్రియా నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో ఒకే క్రియగా వ్యక్తం చేస్తుంది; అర్థనష్టం లేదు.
- source_word: Οὐ θέλω
  choice: నాకు ఇష్టం లేదు
  rationale: θέλω ఇక్కడ కోరిక లేదా సుముఖతను సూచిస్తుంది. ‘నేను వెళ్లను’ కంటే ఈ రూపం కుమారుని వ్యక్తిగత అయిష్టతను నేరుగా తెలియజేస్తూ, గ్రీకులోని భావాన్ని అతిగా బలపరచదు.
- source_word: ὕστερον
  choice: తర్వాత
  rationale: తరువాత జరిగిన చర్యను తెలిపే సహజమైన, సంక్షిప్తమైన కాలవాచకం.
- source_word: μεταμεληθεὶς
  choice: మనసు మార్చుకొని
  rationale: μεταμέλομαι పశ్చాత్తాపం లేదా విచారం కలిసిన మనోమార్పును సూచించగలదు. ఇక్కడ నిరాకరణ నుంచి విధేయతకు మారడమే కథనంలో ప్రధానంగా కనిపిస్తున్నందున, ప్రత్యేకమైన మతపరమైన అర్థాన్ని రుద్దకుండా ఆ మార్పును ఈ పదబంధం తెలియజేస్తుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లాడు
  rationale: సందర్భంలో కోరిన పని చేయడానికి వెళ్లడాన్ని సూచిస్తుంది. ‘వెళ్లాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, సందర్భానికి సరిపోతుంది.
theological_decisions:
- issue: ఉపమాన సందర్భంలో μεταμεληθεὶς పదం అనువాదం
  choice: మనసు మార్చుకొని
  alternative: పశ్చాత్తాపపడి; విచారించి; మనసు మెత్తబడి
  rationale: వచనం నిరాకరణ నుంచి కార్యరూపమైన విధేయతకు వచ్చిన మార్పును వర్ణిస్తుంది. ‘పశ్చాత్తాపపడి’ అని మాత్రమే అనువదిస్తే మూలపదం అవసరంగా నిర్దేశించని బలమైన మతపరమైన భావాన్ని చేర్చే అవకాశం ఉంది. ‘మనసు మార్చుకొని’ ప్రవర్తనలోని మలుపును నిలిపి ఉంచుతూ, దానిలో ఉండగల విచార భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. కుమారుని మాటను సరళంగా, నేరుగా ఉంచాం; గ్రీకు కృదంత నిర్మాణాలను తెలుగు వాక్యప్రవాహానికి అనుగుణంగా మార్చాం.
