id: MAT.21.30
reference: Matthew 21:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: te
  text: తరువాత అతడు రెండవ కుమారుని దగ్గరికి వెళ్లి అదే విధంగా చెప్పాడు. అతడు, “నేనే వెళ్తాను[a], అయ్యా[b]” అని జవాబిచ్చాడు; కానీ వెళ్లలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో అక్షరార్థంగా “నేను” అని మాత్రమే ఉంది; సందర్భంలో అది “నేను వెళ్తాను” అనే సంక్షిప్త జవాబు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదాన్ని “ప్రభువా” లేదా “యజమానీ” అని కూడా అనువదించవచ్చు. ఇక్కడ అది మానవ తండ్రిని గౌరవంగా సంబోధించడానికి వాడబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: προσελθὼν δὲ
  choice: తరువాత అతడు ... దగ్గరికి వెళ్లి
  rationale: కృదంతంతో కూడిన ఈ స్వల్ప అనుసంధానాన్ని తెలుగు కథన క్రమానికి సహజంగా మార్చి, తండ్రి రెండవ కుమారుని సమీపించిన భావాన్ని నిలిపింది.
- source_word: τῷ δευτέρῳ
  choice: రెండవ కుమారుని
  rationale: గ్రీకులో ‘రెండవవాని’ అని మాత్రమే ఉన్నా, ముందరి సందర్భంలో సూచితమైన ‘కుమారుడు’ అనే నామవాచకాన్ని తెలుగులో స్పష్టత కోసం చేర్చింది.
- source_word: ὡσαύτως
  choice: అదే మాట
  rationale: రెండవ కుమారునికీ ముందటి ఆజ్ఞనే చెప్పాడనే సందర్భార్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀποκριθεὶς εἶπεν
  choice: జవాబిచ్చాడు
  rationale: ‘జవాబిస్తూ చెప్పాడు’ అనే గ్రీకు నిర్మాణాన్ని పునరుక్తి లేకుండా సహజమైన తెలుగులో తెలిపింది.
- source_word: Ἐγώ
  choice: నేను వెళ్తాను
  rationale: మూలంలో నొక్కిచెప్పబడిన ‘నేను’ మాత్రమే ఉంది; అది ఆజ్ఞకు ఇచ్చిన సంక్షిప్త సమ్మతి. తెలుగులో ఉద్దేశించిన క్రియను చేర్చడం అర్థాన్ని స్పష్టం చేస్తుంది; పాదసూచిక మూలంలోని సంక్షిప్త రూపాన్ని తెలియజేస్తుంది.
- source_word: κύριε
  choice: అయ్యా
  rationale: ఇక్కడ మానవ తండ్రిని గౌరవంగా సంబోధిస్తున్నందున, దైవ సంబంధమైన భావాన్ని అనవసరంగా రప్పించకుండా గౌరవాన్ని తెలిపే సహజ తెలుగు సంబోధనను ఎంచుకుంది.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: కానీ వెళ్లలేదు
  rationale: గ్రీకులో καί ఉన్నప్పటికీ, మాటకూ పనికీ మధ్యనున్న వ్యత్యాసాన్ని తెలుగులో సహజంగా చూపడానికి వ్యతిరేకార్థక అనుసంధానం వాడింది.
theological_decisions:
- issue: తండ్రిని సంబోధించే κύριε పదం
  choice: అయ్యా
  alternative: ప్రభువా / యజమానీ
  rationale: ఈ ఉపమానంలో కుమారుడు తన మానవ తండ్రిని గౌరవంగా సంబోధిస్తున్నాడు. ‘ప్రభువా’ అనడం సందర్భం కోరని దైవిక లేదా క్రీస్తుసంబంధ భావాన్ని కలిగించవచ్చు; ‘యజమానీ’ కుటుంబ సంబంధానికి అసహజంగా ఉంటుంది. ‘అయ్యా’ గౌరవాన్ని నిలిపి సందర్భానికి సరిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అయ్యా’ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవ సంబోధన; ‘కానీ’ ఉపమానంలోని మాట–చర్య వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
