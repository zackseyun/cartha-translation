id: MAT.21.15
reference: Matthew 21:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: te
  text: కాని ముఖ్య యాజకులు, శాస్త్రులు ఆయన చేసిన అద్భుతమైన కార్యాలను, దేవాలయ ప్రాంగణంలో[a] “దావీదు కుమారునికి హోసన్నా!”[b] అని బిగ్గరగా ఇలా అంటున్న పిల్లలను చూసి ఆగ్రహించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడి గ్రీకు పదం ἱερόν అంతర్గర్భాలయాన్ని మాత్రమే కాక దేవాలయ సముదాయాన్ని లేదా దాని ప్రాంగణాలను సూచిస్తుంది.
    reason: cultural_note
  - marker: b
    text: “హోసన్నా” అనేది హెబ్రీ మూలం గల జయధ్వని. దాని అర్థం “దయచేసి రక్షించు” లేదా “ఇప్పుడే రక్షించు” అనేదానికి సమీపంగా ఉంటుంది; అయితే అప్పటికి అది స్తుతి జయధ్వనిగానూ వాడుకలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: చూసి
  rationale: అనంతర క్రియకు పరిస్థితిని తెలిపే aorist participleను తెలుగులో సహజమైన పూర్వకాలిక క్రియారూపంతో అందిస్తుంది.
- source_word: δὲ
  choice: కాని
  rationale: ముందటి దృశ్యానికి విరుద్ధంగా మతాధికారుల ప్రతిస్పందనను సూచించే స్వల్ప వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἀρχιερεῖς
  choice: ముఖ్య యాజకులు
  rationale: ఒక్క ప్రధాన యాజకుడిని కాక, యాజక నాయకులను సూచించే బహువచనానికి తగిన ప్రామాణిక రూపం.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: ధర్మశాస్త్రాన్ని నకలు చేసి బోధించే నిపుణులను సూచించే స్థిరమైన బైబిలు పదం; వివరణాత్మక విస్తరణను నివారిస్తుంది.
- source_word: τὰ θαυμάσια
  choice: అద్భుతమైన కార్యాలు
  rationale: ఆశ్చర్యకరమైన పనులను విస్తృతంగా సూచిస్తుంది; వాటిని కేవలం ‘అద్భుతాలు’ అనే సాంకేతిక వర్గానికే పరిమితం చేయదు.
- source_word: ἐποίησεν
  choice: చేసిన
  rationale: సాధారణ aorist క్రియను సరళంగా అనువదిస్తూ τὰ θαυμάσιαతో సహజమైన తెలుగు పదబంధాన్ని ఏర్పరుస్తుంది.
- source_word: παῖδας
  choice: పిల్లలు
  rationale: ఈ సందర్భంలో సేవకులు అనే అర్థం అసంభవం; లింగాన్ని అనవసరంగా పరిమితం చేయకుండా వయస్సు భావాన్ని అందిస్తుంది.
- source_word: κράζοντας
  choice: కేకలు వేస్తున్న
  rationale: వైరభావాన్ని తప్పనిసరిగా సూచించకుండా, బహిరంగంగా బిగ్గరగా పలికిన జయధ్వనిని తెలియజేస్తుంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయ ప్రాంగణంలో
  rationale: ἱερόν అంతర్గర్భాలయాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది; ‘ప్రాంగణంలో’ అనేది సందర్భాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: λέγοντας
  choice: అని
  rationale: తెలుగులో ప్రత్యక్ష ఉల్లేఖనాన్ని కేకలు వేయడమనే క్రియతో సహజంగా కలుపుతుంది; ప్రత్యేకంగా ‘చెబుతూ’ అనడం పునరుక్తి అవుతుంది.
- source_word: Ὡσαννὰ
  choice: హోసన్నా
  rationale: గ్రీకులోనూ ధ్వన్యంతరీకరించబడిన ఆరాధనా జయధ్వని. రక్షణకోసం వేడుకొనే మూలార్థాన్నీ, స్తుతి జయధ్వని ప్రయోగాన్నీ ఒకదానితో మరొకటి భర్తీ చేయకుండా నిలుపుతుంది.
- source_word: τῷ υἱῷ Δαυίδ
  choice: దావీదు కుమారునికి
  rationale: దత్తి విభక్తిని సహజంగా అందిస్తూ, మత్తయిలోని మెస్సీయ బిరుదును అక్షరార్థంగా నిలుపుతుంది.
- source_word: ἠγανάκτησαν
  choice: ఆగ్రహించారు
  rationale: తీవ్రమైన అసంతృప్తి, కోపాన్ని సూచించే ప్రధాన క్రియకు సహజమైన ఆధునిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: ‘దావీదు కుమారుడు’ అనే బిరుదు యొక్క మెస్సీయ ప్రాముఖ్యత
  choice: దావీదు కుమారునికి
  alternative: దావీదు వారసునికి
  rationale: మూలంలోని కుటుంబ సంబంధ పదబంధాన్ని, మత్తయి కథనంలో దాని గుర్తించదగిన మెస్సీయ బిరుదు స్వరూపాన్ని యథాతథంగా నిలుపుతుంది; ‘వారసుడు’ అనేది వివరణాత్మకంగా భావాన్ని సంకుచితం చేస్తుంది.
- issue: Ὡσαννά యొక్క వేడుకోలు మరియు స్తుతి భావాలు
  choice: హోసన్నా
  alternative: దయచేసి రక్షించు / ఇప్పుడే రక్షించు
  rationale: ఈ పదం రక్షణ వేడుకోలులో మూలం కలిగి ఉన్నప్పటికీ ఇక్కడ స్థిరమైన స్తుతి జయధ్వనిగా కూడా పనిచేస్తుంది. ధ్వన్యంతరీకరణ ఈ ఉద్దేశపూర్వక భావ ఉద్రిక్తతను నిలుపుతుంది; అర్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘ముఖ్య యాజకులు’, ‘శాస్త్రులు’, ‘దావీదు కుమారుడు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలిపి, ἱερόν యొక్క విస్తృత స్థలార్థాన్ని ‘దేవాలయ ప్రాంగణం’తో స్పష్టం చేశాం. రెండు పాదటిప్పణి సూచికలూ ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
