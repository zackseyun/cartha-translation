  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: te
  text: అయితే ఆ కౌలు రైతులు కుమారుణ్ణి చూసి, తమలో తాము, ‘ఇతనే వారసుడు. రండి, ఇతణ్ణి చంపి ఇతని వారసత్వాన్ని మనం సొంతం చేసుకుందాం[a]’ అని చెప్పుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత నేరుగా, ‘ఇతని వారసత్వాన్ని మనం పొందుదాం’; ఈ సందర్భంలో దాన్ని బలవంతంగా తమ సొంతం చేసుకోవడమే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: కౌలు రైతులు
  rationale: ద్రాక్షతోట యజమాని దగ్గర తోటను కౌలుకు తీసుకొని సాగుచేసే వారి సామాజిక పాత్రను సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: ἰδόντες
  choice: చూసి
  rationale: అయోరిస్ట్ పార్టిసిపుల్‌ను సహజమైన తెలుగు క్రమబోధక క్రియగా ఇచ్చి, చూడటం తరువాత మాట్లాడటం జరిగిందని తెలియజేస్తుంది.
- source_word: τὸν υἱόν
  choice: కుమారుణ్ణి
  rationale: గ్రీకులో స్పష్టమైన స్వామ్యసూచక పదం లేదు; అందువల్ల సందర్భంలో సంబంధం స్పష్టంగా ఉన్నప్పటికీ ‘యజమాని కుమారుడు’ అని విస్తరించకుండా మూలంలోని సరళతను నిలుపుతుంది.
- source_word: ἐν ἑαυτοῖς
  choice: తమలో తాము
  rationale: వారు తమ గుంపులో పరస్పరం మాట్లాడుకున్నారనే బహువచన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κληρονόμος
  choice: వారసుడు
  rationale: చట్టపరమైన వారసత్వ భావానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, సూటి సమానార్థకం.
- source_word: δεῦτε
  choice: రండి
  rationale: తరువాతి చర్యకు కలిసి రావాలని ప్రేరేపించే ఆహ్వానాత్మక ప్రయోగాన్ని గౌరవ బహువచనంగా కాక, సమూహ సంబోధనగా సహజంగా అందిస్తుంది.
- source_word: ἀποκτείνωμεν
  choice: చంపి
  rationale: ‘మనము చంపుదాం’ అనే ప్రేరణార్థక భావం తరువాతి ‘సొంతం చేసుకుందాం’తో కలిసి తెలుగులో సహజంగా ప్రవహించేలా సంయుక్త క్రియగా ఇవ్వబడింది; ‘హత్య చేద్దాం’ కంటే మూలానికి తక్కువ వ్యాఖ్యాత్మకం.
- source_word: σχῶμεν
  choice: సొంతం చేసుకుందాం
  rationale: ἔχω యొక్క ప్రాథమిక భావం ‘కలిగి ఉండటం’; ఈ సందర్భంలో వారసుణ్ణి చంపి వారసత్వాన్ని తమ అధీనంలోకి తెచ్చుకోవాలనే ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది. మూలంలోని అక్షరార్థానికి పాదసూచిక చోటు కల్పిస్తుంది.
- source_word: κληρονομίαν αὐτοῦ
  choice: ఇతని వారసత్వాన్ని
  rationale: κληρονομία యొక్క నేరుగా వచ్చే ‘వారసత్వం’ భావాన్నీ, αὐτοῦలోని స్వామ్యసంబంధాన్నీ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ఉపమానంలోని కుమారుని సూచన
  choice: ‘కుమారుడు’ అనే కథాస్థాయి పదాన్నే ఉంచడం
  alternative: కుమారుడు యేసును సూచిస్తున్నాడని అనువాదంలోనే స్పష్టం చేయడం
  rationale: మత్తయి కథనంలో క్రీస్తు సంబంధిత సూచన స్పష్టమైనప్పటికీ, ఈ వచనం ఉపమాన కథాస్థాయిలోనే మాట్లాడుతుంది. గుర్తింపును అనువాదంలో చేర్చకుండా ఉండటం మూలంలోని వేదాంతపరమైన ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘కౌలు రైతులు’ సందర్భంలోని సామాజిక పాత్రను స్పష్టం చేస్తుంది; ‘ఇతనే’, ‘రండి’ వంటి పదాలు సంభాషణకు సహజమైన తక్షణత్వాన్ని ఇస్తాయి.
