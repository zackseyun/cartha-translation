source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: te
  text: వారు యెరూషలేముకు సమీపించి, ఒలీవ కొండ దగ్గర ఉన్న బేత్ఫగేకు వచ్చిన వేళ, యేసు ఇద్దరు శిష్యులను పంపాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισαν
  choice: సమీపించి
  rationale: ἐγγίζω అనే క్రియ ఇక్కడ ఒక ప్రదేశానికి దగ్గరగా రావడాన్ని సూచిస్తుంది; ‘సమీపించి’ సహజంగానూ సంక్షిప్తంగానూ ఆ కదలికను తెలియజేస్తుంది.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ప్రదేశనామ రూపం.
- source_word: ἦλθον
  choice: వచ్చినప్పుడు
  rationale: ἔρχομαι యొక్క సాధారణ అర్థమైన ‘వచ్చుట’ను నిలుపుతూ, ὅτεతో కలిసి కాలసంబంధ ఉపవాక్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Βηθφαγὴ
  choice: బేత్ఫగే
  rationale: గ్రీకు ప్రదేశనామానికి దగ్గరగా ఉన్న తెలుగు లిప్యంతరీకరణ.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: ఒలీవ కొండ దగ్గర ఉన్న
  rationale: ఈ పదబంధం బేత్ఫగేను ఒలీవ కొండతో భౌగోళికంగా అనుసంధానిస్తుంది. తెలుగులో వరుసగా రెండు ‘కు’ గమ్యపదబంధాలు కలిగించే అస్పష్టతను నివారిస్తూ స్థానసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τότε
  choice: —
  rationale: గ్రీకులోని ‘అప్పుడు’ అనే కథన మార్పు భావం తెలుగులో ‘వచ్చినప్పుడు ... పంపాడు’ అనే నిర్మాణంలో సహజంగా అంతర్లీనమైంది; వేరుగా చేరిస్తే అనవసర పునరుక్తి కలుగుతుంది.
- source_word: ἀπέστειλεν
  choice: పంపాడు
  rationale: ఒక పనిమీద వారిని పంపించాడనే సాధారణ కథనార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: δύο μαθητὰς
  choice: ఇద్దరు శిష్యులను
  rationale: వ్యక్తులను లెక్కించేందుకు ‘ఇద్దరు’ సహజమైన తెలుగు రూపం; μαθητήςకు సువార్తల సందర్భంలో ‘శిష్యుడు’ ప్రామాణికమైన పదం.
theological_decisions:
- issue: యేసు పేరు రావడానికి ముందు ఉన్న బహువచన క్రియల కర్త
  choice: ‘వారు’ అని మాత్రమే పేర్కొని, గ్రీకు పాఠంలో యేసు పేరు వచ్చిన చోటనే ‘యేసు’ అని పేర్కొనడం.
  alternative: ‘యేసు, ఆయన శిష్యులు’ అని కర్తను విస్తరించడం.
  rationale: సందర్భంలో ప్రయాణిస్తున్న సమూహం స్పష్టమైనప్పటికీ, ఈ వచనం వారిని ‘యేసు, ఆయన శిష్యులు’ అని ప్రత్యక్షంగా పేర్కొనదు. మూలంలోని కథన సంక్షిప్తతను కాపాడేందుకు అదనపు గుర్తింపును చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా సహజమైన కాలసంబంధ వాక్యనిర్మాణం వాడబడింది. ప్రదేశనామాలకు గౌరవప్రదమైన, తెలుగు బైబిలు సంప్రదాయానికి పరిచితమైన రూపాలు ఎంచుకోబడ్డాయి.
