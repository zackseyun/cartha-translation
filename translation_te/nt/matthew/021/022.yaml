  source_fidelity: The draft correctly represents the comprehensive indefinite expression πάντα ὅσα ἂν, prayer as the setting of the request, the contemporaneous participle πιστεύοντες without turning it into an explicit conditional clause, and the future promise λήμψεσθε.
