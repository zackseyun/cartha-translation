  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: te
  text: మీరు ప్రార్థనలో విశ్వసిస్తూ[b] ఏది అడిగినా[a], అదంతా పొందుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు అడిగేదంతా” లేదా “మీరు అడిగే ప్రతిదీ.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నమ్మకం ఉంచుతూ”; గ్రీకు కృదంతం ప్రార్థిస్తూ అడిగే సమయంలోనే విశ్వసించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ὅσα
  choice: ఏవి అడిగినా, అవన్నీ
  rationale: πᾶς + ὅσος కలయికలోని సమగ్ర, అనిర్దిష్ట భావాన్ని సహజమైన తెలుగులో ‘ఏవి...అవన్నీ’ అనే పరస్పర సంబంధ నిర్మాణం స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἂν αἰτήσητε
  choice: అడిగినా
  rationale: ἄν తో కూడిన aorist subjunctive అనిర్దిష్ట సంబంధ వాక్యాన్ని ఏర్పరుస్తుంది. తెలుగు ‘అడిగినా’ ఈ ‘ఏది అడిగినా’ భావాన్ని సహజంగా తెలియజేస్తుంది; ఊహార్థాన్ని అనవసరంగా బలపరచదు.
- source_word: ἐν τῇ προσευχῇ
  choice: ప్రార్థనలో
  rationale: దత్తివ విభక్తి పదబంధాన్ని నామవాచక రూపంలోనే ఉంచుతూ, ‘ప్రార్థన సందర్భంలో’ అనే అర్థాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: πιστεύοντες
  choice: నమ్ముతూ
  rationale: వర్తమాన కృదంతం అడగడంతో సమకాలీనంగా ఉన్న నమ్మకాన్ని సూచిస్తుంది. ‘నమ్ముతూ’ గ్రీకు వాక్యనిర్మాణాన్ని కాపాడుతుంది; దానిని స్పష్టమైన షరతుగా మార్చదు.
- source_word: λήμψεσθε
  choice: పొందుతారు
  rationale: భవిష్యత్‌కాలంలోని λαμβάνωకు గౌరవప్రదమైన, సహజమైన తెలుగు సమానం ‘పొందుతారు’; మధ్యమ ప్రయోగానికి ఇక్కడ ప్రత్యేక అదనపు పదం అవసరం లేదు.
theological_decisions:
- issue: విశ్వాసానికి, జవాబు పొందే ప్రార్థనకు మధ్య సంబంధం
  choice: నమ్ముతూ
  alternative: మీరు నమ్మితే
  rationale: గ్రీకులో స్పష్టమైన షరతు వాక్యం కాకుండా కృదంతం ఉంది. అందువల్ల ప్రార్థనతో నమ్మకాన్ని అనుసంధానిస్తూనే, జవాబు పొందే విధానం లేదా పరిధి గురించి వాక్యం చెప్పనిదాన్ని అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని సమగ్ర పరిధిని ‘ఏవి...అవన్నీ’తో, ప్రార్థనతో సమకాలీనమైన విశ్వాసాన్ని ‘నమ్ముతూ’తో కాపాడాం.
