id: MAT.21.16
reference: Matthew 21:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: te
  text: వారు ఆయనతో, “వీరు చెప్పేది నీకు వినిపిస్తోందా?” అన్నారు. యేసు వారితో, “అవును. ‘పసిపిల్లల నోటినుండి, పాలుతాగే శిశువుల నోటినుండి నీవు స్తుతిని సిద్ధపరిచావు’[a] అని మీరు ఎన్నడూ చదవలేదా?” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యేసు కీర్తన 8:2ను గ్రీకు లేఖన సంప్రదాయం ప్రకారం ఉటంకిస్తున్నాడు. హెబ్రూ పాఠాన్ని సాధారణంగా, “పసిపిల్లల, పాలుతాగే శిశువుల నోటినుండి నీవు బలాన్ని స్థాపించావు” అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: నీకు వినిపిస్తోందా?
  rationale: వర్తమానకాలంలోని ప్రత్యక్ష ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, యేసును సవాలు చేస్తున్న ధోరణిని నిలుపుతుంది.
- source_word: τί οὗτοι λέγουσιν
  choice: వీరు చెప్పేది
  rationale: οὗτοι అనే సూచనను ‘వీరు’గా నిలుపుతూ, గ్రీకులో లేని నామవాచకాన్ని చేర్చలేదు; λέγουσιν యొక్క కొనసాగుతున్న చర్య తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగులో యథాతథంగా ఉంచితే అసహజంగా ఉండవచ్చు; కథన ప్రవాహానికి సహజమైన భూతకాల రూపాన్ని ఎంచుకున్నాం.
- source_word: Ναί
  choice: అవును
  rationale: సరళమైన అంగీకారానికి నేరుగా సరిపోయే ఆధునిక తెలుగు పదం.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: మీరు ఎన్నడూ చదవలేదా?
  rationale: లేఖన పరిజ్ఞానాన్ని ప్రశ్నించే గద్దింపు స్వరమున్న అలంకారిక ప్రశ్నను స్పష్టంగా నిలుపుతుంది.
- source_word: Ἐκ στόματος
  choice: నోటినుండి
  rationale: మూలంలోని దృశ్యరూపాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది; రెండు వర్గాలకు సంబంధించి పదబంధాన్ని పునరావృతం చేయడం తెలుగులో స్పష్టతనిస్తుంది.
- source_word: νηπίων
  choice: పసిపిల్లలు
  rationale: చాలా చిన్న పిల్లలను సూచిస్తుంది; తరువాతి θηλαζόντωνతో ఉన్న భేదాన్ని పూర్తిగా కలిపివేయదు.
- source_word: θηλαζόντων
  choice: పాలుతాగే శిశువులు
  rationale: పాలు తాగే వయసులోని శిశువులనే గ్రీకు కృదంతం సూచిస్తున్నందున, పురాతన లేదా అసహజ పదజాలం లేకుండా భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: κατηρτίσω
  choice: సిద్ధపరిచావు
  rationale: మత్తయి ఉటంకించిన గ్రీకు పాఠంలోని ‘సిద్ధం చేయడం/ఏర్పరచడం’ అనే భావాన్ని ప్రతిబింబిస్తుంది; హెబ్రూ పాఠంలోని ‘స్థాపించావు’తో కలిపివేయదు.
- source_word: αἶνον
  choice: స్తుతి
  rationale: అమూర్త నామవాచకమైన ‘praise’కు సహజమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: కీర్తన 8:2 ఉటంకింపు రూపం
  choice: మత్తయి గ్రీకు పాఠంలోని ‘నీవు స్తుతిని సిద్ధపరిచావు’ అనే రూపాన్ని ప్రధాన పాఠంలో ఉంచడం
  alternative: హెబ్రూ ఆధారిత ‘నీవు బలాన్ని స్థాపించావు’ అనే రూపం
  rationale: మత్తయి యేసు మాటలను గ్రీకు లేఖన సంప్రదాయం ప్రకారం అందిస్తున్నాడు. కాబట్టి ప్రధాన పాఠాన్ని హెబ్రూ రూపానికి సమన్వయపరచకుండా, మత్తయి ఇచ్చిన మాటలనే అనువదించాం; పాఠకులకు తెలిసి ఉండగల భిన్న రూపాన్ని పాదటీపులో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని, గౌరవప్రదమైన లేఖన భాషను ఉపయోగించాం. ‘వీరు’ అనే రూపం మూలంలోని సూచనను నిలుపుతుంది; గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగు కథన సహజత్వం కోసం భూతకాలంగా అనువదించాం. పాదటీపు గుర్తును అది వివరిస్తున్న కీర్తన ఉటంకింపుకు వెంటనే ఉంచాం.
