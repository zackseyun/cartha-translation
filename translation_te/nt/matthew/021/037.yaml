source:
  edition: SBLGNT
  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: te
  text: కాని తరువాత అతడు, “వారు నా కుమారుణ్ణి గౌరవిస్తారు” అని చెప్పి, తన కుమారుణ్ణి వారి దగ్గరకు పంపించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు నా కుమారుణ్ణి పట్ల మన్నన చూపుతారు.” గ్రీకు క్రియ గౌరవం లేదా మన్నన చూపడాన్ని సూచించగలదు; ఇతర సందర్భాల్లో “సిగ్గుపడతారు” అనే అర్థం కూడా రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: తరువాత
  rationale: కాలక్రమంలో ముందటి సేవకులను పంపిన చర్యల తరువాత జరిగినదని సహజంగా తెలియజేస్తుంది; ‘చివరికి’ అనే మూలంలో లేని బలమైన భావాన్ని చేర్చదు.
- source_word: δὲ
  choice: కాని
  rationale: సేవకులను పంపడం నుంచి కుమారుణ్ణి పంపే కథన మలుపును, స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: ἀπέστειλεν
  choice: పంపించాడు
  rationale: ἀποστέλλω అనే సాధారణ పంపే చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సాంకేతిక అపొస్తలత్వ భావాన్ని చేర్చదు.
- source_word: πρὸς αὐτοὺς
  choice: వారి దగ్గరికి
  rationale: వ్యక్తుల వైపు పంపడాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: తన కుమారుణ్ణి
  rationale: కర్తతో కుమారుని సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; ‘సొంత’ వంటి అదనపు ఉద్ఘాటనను చేర్చదు.
- source_word: λέγων
  choice: అని చెప్పుకొని
  rationale: పంపిన వ్యక్తి పలికిన లేదా తనలో అనుకున్న మాటను తెలుగులో సహజంగా పరిచయం చేస్తుంది; సందర్భం నిర్దిష్టంగా అంతరంగ ఆలోచనకే పరిమితం చేయనందున ఆ అస్పష్టతను కొంత నిలుపుతుంది.
- source_word: Ἐντραπήσονται
  choice: గౌరవిస్తారు
  rationale: ప్రత్యక్ష కర్మతో వచ్చిన ἐντρέπω ఇక్కడ గౌరవం లేదా మన్నన చూపడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘గౌరవిస్తారు’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: τὸν υἱόν μου
  choice: నా కుమారుణ్ణి
  rationale: మాట్లాడేవానికి కుమారునితో ఉన్న వ్యక్తిగత సంబంధాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: ఉపమానంలోని కుమారుని క్రీస్తు సంబంధ సూచనను అతిగా వ్యాఖ్యానించకుండా అనువదించడం
  choice: తన కుమారుణ్ణి / నా కుమారుణ్ణి
  alternative: తన ప్రియ కుమారుణ్ణి / కుమారుడైన క్రీస్తును
  rationale: ఈ ఉపమానం యేసును సూచించినప్పటికీ, ఈ వచనంలో సాధారణ υἱός మాత్రమే ఉంది; ‘ప్రియ’ అనే విశేషణం లేదా వివరణాత్మక క్రీస్తు బిరుదు లేదు. కాబట్టి కథన రూపాన్ని కాపాడుతూ దాని క్రీస్తు సంబంధ భావం సందర్భం నుంచే వెలువడేలా చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘కుమారుడు’ అనే సాధారణ బంధపదాన్ని ఉంచి, మూలంలో లేని బిరుదులు లేదా మతశాఖాపరమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
