id: MAT.21.41
reference: Matthew 21:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: te
  text: 'వారు ఆయనతో ఇలా అన్నారు: “ఆ దుష్టులను ఆయన దారుణంగా నాశనం చేస్తాడు[a]. ద్రాక్షతోటను ఇతర రైతులకు కౌలుకు ఇస్తాడు[b]. వారు తగిన కాలాల్లో దాని ఫలాలను ఆయనకు ఇస్తారు[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూల గ్రీకులో ‘దుష్టులు’ అనే విశేషణం, ‘దుష్టంగా/చెడ్డ రీతిలో’ అనే అదే మూలానికి చెందిన క్రియావిశేషణం కలిసి తీర్పు తీవ్రతను నొక్కిచెబుతున్నాయి. మరింత అక్షరార్థంగా: “ఆ చెడ్డవారిని చెడ్డ రీతిలో నాశనం చేస్తాడు.”'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ద్రాక్షతోటను ఇతర సాగుదారులకు అద్దెకు ఇస్తాడు.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “వారు తగిన సమయాల్లో ఆయనకు రావలసిన పంటను చెల్లిస్తారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: వారు ఆయనతో … అన్నారు
  rationale: వర్తమాన రూపం గ్రీకు కథనంలో చారిత్రక వర్తమానంగా పనిచేస్తుంది; ఆధునిక తెలుగు కథన ప్రవాహానికి భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: Κακοὺς κακῶς
  choice: ఆ దుష్టులను … దారుణంగా
  rationale: ఒకే మూలానికి చెందిన విశేషణం–క్రియావిశేషణం ద్వారా గ్రీకులో తీర్పు తీవ్రతను బలపరిచారు. తెలుగులో సహజమైన ‘దుష్టులను … దారుణంగా’ ఆ నైతిక నిందను, తీవ్రతను తెలియజేస్తుంది; మూలంలోని పదప్రయోగాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: ἀπολέσει
  choice: నాశనం చేస్తాడు
  rationale: తీర్పు నిర్ణయాత్మకమైనదని తెలియజేస్తూనే, అది జరిగే నిర్దిష్ట విధానాన్ని అనవసరంగా నిర్ణయించని విస్తృత పదం.
- source_word: τὸν ἀμπελῶνα
  choice: ద్రాక్షతోటను
  rationale: ἀμπελώνకు సాధారణమైన, వ్యవసాయ దృశ్యాన్ని నిలుపుకునే తెలుగు పదం.
- source_word: ἐκδώσεται
  choice: కౌలుకు ఇస్తాడు
  rationale: ఈ వ్యవసాయ సందర్భంలో ఆస్తిని ఇతరులకు కౌలుగా ఇవ్వడమే భావం; ఆధునిక తెలుగులో ఇది స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἄλλοις γεωργοῖς
  choice: ఇతర కౌలు రైతులకు
  rationale: γεωργοί సాగుచేసే రైతులను సూచిస్తుంది; కౌలు ఏర్పాటును సందర్భానుగుణంగా స్పష్టంచేస్తూ వారి వ్యవసాయ పాత్రను కూడా నిలుపుతుంది.
- source_word: οἵτινες
  choice: వారు
  rationale: ఆశించిన ఫలాలను ఇచ్చే రైతులే వీరని తెలిపే సంబంధార్థాన్ని తెలుగులో కొత్త వాక్యంలోని సర్వనామం సహజంగా మోస్తుంది.
- source_word: ἀποδώσουσιν αὐτῷ
  choice: ఆయనకు ఇస్తారు
  rationale: తిరిగి ఇవ్వడం లేదా రావలసినదాన్ని చెల్లించడం అనే భావాన్ని సందర్భం అందిస్తుంది; ‘ఇస్తారు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: τοὺς καρποὺς
  choice: దాని ఫలాలను
  rationale: అక్షరార్థ వ్యవసాయ చిత్రాన్ని, ఆశించబడిన ఫలితాల రూపక ప్రతిధ్వనిని రెండింటినీ నిలుపుతుంది.
- source_word: ἐν τοῖς καιροῖς αὐτῶν
  choice: వాటి కాలాల్లో
  rationale: ఫలాలకు సంబంధించిన తగిన లేదా నియమిత కాలాలు అనే భావాన్ని వ్యవసాయ దృశ్యంతో సహా నిలుపుతుంది.
theological_decisions:
- issue: కౌలుదారులపై తీర్పు తీవ్రత మరియు స్వరూపం
  choice: ఆ దుష్టులను ఆయన దారుణంగా నాశనం చేస్తాడు
  alternative: ఆ చెడ్డవారిని ఆయన చెడ్డ రీతిలో నాశనం చేస్తాడు
  rationale: గ్రీకు వాక్యం సాంకేతికమైన సిద్ధాంత పదాన్ని వాడకుండా పదప్రయోగం ద్వారా తీర్పును తీవ్రపరుస్తుంది. అనువాదం ఆ తీవ్రతను నిలుపుతూ, శిక్ష జరిగే ఖచ్చితమైన విధానంపై మూలం చెప్పనిదాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ప్రత్యక్ష సంభాషణ సహజంగా ప్రవహించేందుకు గ్రీకు దీర్ఘ వాక్యాన్ని మూడు తెలుగు వాక్యాలుగా విభజించాం; భావ సంబంధాలు యథాతథంగా ఉన్నాయి.
