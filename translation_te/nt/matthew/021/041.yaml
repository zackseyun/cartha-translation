  to: 'వారు ఆయనతో ఇలా అన్నారు: “ఆ దుష్టులను ఆయన దారుణంగా నాశనం చేస్తాడు[a]. ద్రాక్షతోటను ఇతర రైతులకు కౌలుకు ఇస్తాడు[b]. వారు తగిన కాలాల్లో దాని ఫలాలను ఆయనకు ఇస్తారు[c].”'
