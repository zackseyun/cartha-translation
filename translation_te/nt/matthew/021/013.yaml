id: MAT.21.13
reference: Matthew 21:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అంటున్నాడు: “ఇలా రాయబడి ఉంది: ‘నా ఇల్లు ప్రార్థన మందిరం అని పిలవబడుతుంది.’[a] కాని మీరు దాన్ని దోపిడీదారుల గుహగా చేస్తున్నారు.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ మాట యెషయా 56:7 నుండి తీసుకోబడింది.
    reason: cross_reference
  - marker: b
    text: “దోపిడీదారులు” అనే గ్రీకు పదాన్ని “బందిపోట్లు” అని కూడా అనువదించవచ్చు; అది హింసాత్మకంగా దోచుకునేవారిని సూచించగలదు. “దోపిడీదారుల గుహ” అనే మాట యిర్మీయా 7:11ను సూచిస్తుంది.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: λέγει
  choice: అంటున్నాడు
  rationale: గ్రీకు వర్తమానకాల చారిత్రక ప్రయోగంలోని కథన సజీవతను నిలుపుతుంది; తెలుగులో సహజంగా ఉండేందుకు ‘ఇలా’ చేర్చబడింది.
- source_word: Γέγραπται
  choice: ఇలా రాయబడి ఉంది
  rationale: పూర్త భూతకర్మణి రూపం సూచించే, రాయబడిన వాక్యం ఇప్పటికీ ప్రామాణికంగా నిలిచి ఉందనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: Ὁ οἶκός μου
  choice: నా ఇల్లు
  rationale: ‘దేవాలయం’ అని వివరణాత్మకంగా సంకుచితం చేయకుండా, మూలంలోని ‘ఇల్లు’ అనే రూపకాన్ని మరియు లేఖన ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: οἶκος προσευχῆς
  choice: ప్రార్థన మందిరం
  rationale: అక్షరార్థంగా ‘ప్రార్థన ఇల్లు’ కంటే ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండి, ప్రార్థనకు అంకితమైన స్థలమనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: κληθήσεται
  choice: అని పిలవబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నేరుగా నిలుపుతుంది.
- source_word: ποιεῖτε
  choice: చేస్తున్నారు
  rationale: వర్తమానకాలంలో కొనసాగుతున్న చర్యను చూపిస్తూ, మూల క్రియకు దగ్గరగా ఉంటుంది.
- source_word: σπήλαιον
  choice: గుహ
  rationale: దోపిడీదారులు దాక్కునే స్థలాన్ని సూచించే మూల రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: λῃστῶν
  choice: దోపిడీదారుల
  rationale: దొంగతనం మాత్రమే కాక బలవంతపు దోపిడీ లేదా బందిపోటుతనాన్ని కూడా సూచించగల గ్రీకు పదపు విస్తృతిని తెలుగులో సముచితంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పాత నిబంధన ఉల్లేఖనం మరియు సూచన
  choice: యెషయా 56:7లోని ‘నా ఇల్లు... ప్రార్థన మందిరం’ మరియు యిర్మీయా 7:11లోని ‘దోపిడీదారుల గుహ’ అనే ప్రతిధ్వనులు గుర్తుపట్టేలా ఉంచడం
  alternative: రెండు లేఖన సంబంధాలు కనిపించకుండా మరింత స్వేచ్ఛగా సమకాలీన వాక్యంగా అనువదించడం
  rationale: యేసు పలికిన మాట రెండు ప్రవక్తల గ్రంథాల భాషను కలుపుతుంది; ఆ అంతర్గ్రంథ సంబంధాన్ని నిలపడం వాక్యపు ప్రవచనాత్మక మరియు ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది.
- issue: λῃστῶν యొక్క అర్థ పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘దోపిడీదారులు’; ప్రత్యామ్నాయంగా ‘బందిపోట్లు’ అని పాదటిప్పణిలో ఇవ్వడం
  alternative: కేవలం ‘దొంగలు’ అని అనువదించడం
  rationale: గ్రీకు పదం సాధారణ దొంగలతో పాటు హింసాత్మక బందిపోట్లను కూడా సూచించగలదు; ప్రధాన పాఠ్యం సహజంగా ఉండగా నిజమైన పదార్థ సందిగ్ధతను పాదటిప్పణి నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు చారిత్రక వర్తమానాన్ని ‘అంటున్నాడు’గా నిలిపి, లేఖన ఉల్లేఖనాల గుర్తింపును కాపాడే పదబంధాలు ఎంచుకోబడ్డాయి.
