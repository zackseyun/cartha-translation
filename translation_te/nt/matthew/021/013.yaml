  source_fidelity: The Telugu accurately represents the Greek historical present (λέγει), the scriptural formula Γέγραπται, the future passive κληθήσεται, the ongoing force of ποιεῖτε, and the image σπήλαιον λῃστῶν. It preserves both the Isaiah 56:7 citation and the Jeremiah 7:11 allusion without importing interpretation.
  naturalness: The wording is natural, clear modern standard Telugu with an appropriately respectful narrative register. “ప్రార్థన మందిరం” and “దోపిడీదారుల గుహ” are idiomatic and retain the recognizable scriptural cadence. “ఆయన వారితో ఇలా అంటున్నాడు” is a defensible rendering of Matthew’s historical present.
  terminology: “నా ఇల్లు” appropriately retains οἶκος rather than interpretively substituting “దేవాలయం.” “దోపిడీదారులు,” with “బందిపోట్లు” supplied as a footnoted alternative, responsibly reflects the semantic range of λῃστῶν. The footnotes accurately identify the Isaiah source, Jeremiah allusion, and lexical alternative.
