  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: te
  text: ఆయన వారిని విడిచిపెట్టి, నగరం నుండి బయటకు బయలుదేరి బేతనియకు వెళ్లి, అక్కడ రాత్రి బస చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అక్కడ రాత్రి గడిపాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλιπὼν αὐτοὺς
  choice: వారిని విడిచిపెట్టి
  rationale: అయోరిస్టు కృదంతం ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది. ‘వారిని విడిచిపెట్టి’ అనేది సహజమైన ఆధునిక తెలుగు; ‘వారు’ సమీప సందర్భంలోని వ్యక్తులను వ్యాఖ్యానభారం లేకుండా సూచిస్తుంది.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: నగరం వెలుపల ... వెళ్లి
  rationale: ἐξῆλθεν మరియు ἔξω కలిసి నగరం నుంచి బయటకు వెళ్లడాన్ని బలంగా వ్యక్తం చేస్తున్నాయి. బేతనియ గమ్యస్థానంతో కలిపి ఈ నిర్మాణం తెలుగులో సహజంగా ఉంటుంది.
- source_word: πόλεως
  choice: నగరం
  rationale: సందర్భంలో ఇది యెరూషలేమును సూచిస్తుంది; πόλιςకు ‘నగరం’ ప్రామాణికమైన, సహజమైన అనువాదం.
- source_word: εἰς Βηθανίαν
  choice: బేతనియకు
  rationale: స్థల నామంతో εἰς దిశ లేదా గమ్యాన్ని సూచిస్తుంది; తెలుగులో దత్తివిభక్తి సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ηὐλίσθη ἐκεῖ
  choice: అక్కడ రాత్రి బస చేశాడు
  rationale: αὐλίζομαι ఇక్కడ రాత్రి గడపడం లేదా బస చేయడం అనే అర్థం ఇస్తుంది. ‘రాత్రి బస చేశాడు’ కాలసూచనను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని క్రమాన్ని సాధ్యమైనంతవరకు నిలుపుతూ తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా మార్చబడింది.
