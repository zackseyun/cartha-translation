revisions:
- from: ఆయన వారిని విడిచిపెట్టి, నగరం వెలుపల ఉన్న బేతనియకు వెళ్లి, అక్కడ రాత్రి బస చేశాడు.[a]
  to: ఆయన వారిని విడిచిపెట్టి, నగరం నుండి బయటకు బయలుదేరి బేతనియకు వెళ్లి, అక్కడ రాత్రి బస చేశాడు.[a]
  rationale: The revision preserves the aorist participial sequence (‘leaving them’) and clearly renders the reinforced movement out of the city before the destination, Bethany. The rendering of ηὐλίσθη remains a natural modern Telugu equivalent, with its lexical alternative retained in the footnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:41:10Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders leaving the people, Bethany, and lodging overnight. However, “నగరం వెలుపల ఉన్న బేతనియకు” syntactically describes Bethany as being outside the city, rather than clearly expressing Jesus’ movement out from the city, which is the force of ἐξῆλθεν ἔξω τῆς πόλεως.
  naturalness: The Telugu is generally modern and readable. Recasting the middle phrase as movement from/out of the city removes the unintended attachment and remains idiomatic.
  terminology: “బేతనియ” is an appropriate established Telugu form for Bethany. “రాత్రి బస చేశాడు” naturally conveys ηὐλίσθη without adding theological or historical interpretation.
  issues:
  - severity: medium
    issue: The phrase “నగరం వెలుపల ఉన్న బేతనియకు” modifies Bethany as ‘Bethany that is outside the city.’
    rationale: The Greek says that he went out/outside the city, with Bethany as his destination. The revision makes this directional sequence explicit and avoids treating ‘outside the city’ merely as a geographical descriptor of Bethany.
  revised_text: ఆయన వారిని విడిచిపెట్టి, నగరం నుండి బయటకు బయలుదేరి బేతనియకు వెళ్లి, అక్కడ రాత్రి బస చేశాడు.[a]
  revised_footnotes:
  - marker: a
    text: లేదా “అక్కడ రాత్రి గడిపాడు.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the aorist participial sequence (‘leaving them’) and clearly renders the reinforced movement out of the city before the destination, Bethany. The rendering of ηὐλίσθη remains a natural modern Telugu equivalent, with its lexical alternative retained in the footnote.
