  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: te
  text: దేవాలయ ప్రాంగణంలో[a] చూపులేనివారు, కుంటివారు ఆయన దగ్గరికి వచ్చారు; ఆయన వారిని స్వస్థపరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు ἱερόν అనే పదం అంతర్గత పరిశుద్ధస్థలాన్ని ప్రత్యేకంగా సూచించదు; దేవాలయ సముదాయాన్ని లేదా దాని ప్రాంగణాలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: ఆయన దగ్గరికి వచ్చారు
  rationale: προσέρχομαι దత్తివ విభక్తిలోని αὐτῷతో కలిసి ఒకరి దగ్గరికి రావడం లేదా సమీపించడం అనే భావాన్ని ఇస్తుంది. ‘ఆయన దగ్గరికి వచ్చారు’ ఆధునిక తెలుగులో సహజంగా ఉండి దిశను స్పష్టంగా తెలియజేస్తుంది.
- source_word: τυφλοὶ
  choice: చూపులేనివారు
  rationale: ఇది వ్యక్తులను సూచించే నామవాచక ప్రయోగంలోని బహువచన విశేషణం. ‘చూపులేనివారు’ గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: χωλοὶ
  choice: కుంటివారు
  rationale: నడవడంలో శారీరక వైకల్యం ఉన్న వ్యక్తులను సూచించే నామవాచక ప్రయోగంలోని బహువచన విశేషణం. ‘కుంటివారు’ సంక్షిప్తంగా, మూలపదానికి దగ్గరగా ఉంది.
- source_word: ἐν τῷ ἱερῷ
  choice: దేవాలయ ప్రాంగణంలో
  rationale: ἱερόν సాధారణంగా అంతర్గత పరిశుద్ధస్థలాన్ని మాత్రమే కాకుండా మొత్తం దేవాలయ సముదాయాన్ని లేదా ఆవరణలను సూచిస్తుంది. ‘దేవాలయ ప్రాంగణంలో’ ఆ స్థలార్థాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐθεράπευσεν
  choice: స్వస్థపరిచాడు
  rationale: సువార్తలలో θεραπεύω రోగం లేదా వైకల్యం నుంచి స్వస్థత కలిగించడాన్ని సూచిస్తుంది. ‘స్వస్థపరిచాడు’ గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే తెలుగు పదం.
theological_decisions:
- issue: ἱερόν సూచించే స్వస్థపరిచిన స్థలం
  choice: యేసు వారిని దేవాలయ సముదాయంలోని ప్రాంగణంలో స్వస్థపరిచాడు.
  alternative: యేసు వారిని దేవాలయంలో స్వస్థపరిచాడు.
  rationale: మూలంలోని ἱερόν విస్తృత దేవాలయ సముదాయాన్ని సూచిస్తుంది; అది అంతర్గత పరిశుద్ధస్థలమైన ναός అని భావింపజేయకూడదు. ప్రధాన పాఠ్యంలో ‘దేవాలయ ప్రాంగణంలో’ అని ఇవ్వడం ఈ వ్యత్యాసాన్ని సహజంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వ్యక్తులను వైకల్యంతో మాత్రమే నిర్వచించే కఠిన ప్రయోగాన్ని తగ్గించేందుకు τυφλοὶకు ‘చూపులేనివారు’ వాడబడింది; χωλοὶకు మూలార్థాన్ని సంక్షిప్తంగా నిలుపుతూ ‘కుంటివారు’ వాడబడింది. Καί వాక్యారంభంలో కథన కొనసాగింపును సూచించేందుకే ‘అప్పుడు’గా అనువదించబడింది.
