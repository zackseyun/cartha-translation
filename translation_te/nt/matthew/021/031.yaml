- from: '“ఆ ఇద్దరిలో ఎవరు తండ్రి కోరినది చేశారు?” వారు, “మొదటివాడు” అన్నారు. యేసు వారితో ఇలా అన్నాడు: “నేను మీతో నిజంగా చెబుతున్నాను: పన్ను వసూలు చేసేవారు, వేశ్యలు మీకంటే ముందుగా దేవుని రాజ్యంలోకి వెళ్తున్నారు.[a]”'
  to: '“ఆ ఇద్దరిలో తండ్రి చిత్తాన్ని నెరవేర్చినవాడు ఎవరు?” వారు, “మొదటివాడు” అన్నారు. యేసు వారితో ఇలా అన్నాడు: “నేను మీతో నిజంగా చెబుతున్నాను: పన్ను వసూలు చేసేవారు, వేశ్యలు మీకంటే ముందుగా దేవుని రాజ్యంలోకి వెళ్తున్నారు.[a]”'
  rationale: The revision corrects the singular grammatical reference in the opening question and uses a more precise, idiomatic Telugu rendering of “did the will of the father.” The rendering of προάγουσιν remains deliberately non-exclusive, and the footnote continues to preserve the viable “entering before you” interpretation without overstating the Greek.
