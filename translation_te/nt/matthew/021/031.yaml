id: MAT.21.31
reference: Matthew 21:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: te
  text: '“ఆ ఇద్దరిలో తండ్రి చిత్తాన్ని నెరవేర్చినవాడు ఎవరు?” వారు, “మొదటివాడు” అన్నారు. యేసు వారితో ఇలా అన్నాడు: “నేను మీతో నిజంగా చెబుతున్నాను: పన్ను వసూలు చేసేవారు, వేశ్యలు మీకంటే ముందుగా దేవుని రాజ్యంలోకి వెళ్తున్నారు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకంటే ముందుగా దేవుని రాజ్యంలో ప్రవేశిస్తున్నారు.” గ్రీకు పాఠంలో “మీకంటే ముందుగా వెళ్తున్నారు” అనే భావం ఉంది; ఇది వారు ముందుగా ప్రవేశిస్తున్నారని నొక్కిచెబుతుంది గాని, మీకు ప్రవేశం అసలే ఉండదని తప్పనిసరిగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: ఆ ఇద్దరిలో ఎవరు
  rationale: ἐκ యొక్క విభాగార్థాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన ప్రశ్నారూపాన్ని ఉపయోగిస్తుంది.
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: తండ్రి కోరినది చేశారు
  rationale: ποιέω యొక్క ‘చేయడం’ అనే స్పష్టమైన భావాన్నీ, θέλημα యొక్క సంకల్పం/కోరిక భావాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది; ఇక్కడ ‘తండ్రి’ ఉపమానంలోని తండ్రినే సూచిస్తుంది.
- source_word: Ὁ πρῶτος
  choice: మొదటివాడు
  rationale: గ్రీకు మూలంలోని సంక్షిప్త సమాధానాన్ని తెలుగులో సహజంగా, స్పష్టంగా అందిస్తుంది.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: యేసు పలికే గంభీరమైన ధృవీకరణ సూత్రం యొక్క బలాన్ని సాధారణ ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τελῶναι
  choice: పన్ను వసూలు చేసేవారు
  rationale: సువార్తల కాలంలోని సామాజికంగా తిరస్కరించబడిన పన్ను వసూలుదారులను స్పష్టంగా సూచించే ప్రస్తుత తెలుగు రూపం.
- source_word: πόρναι
  choice: వేశ్యలు
  rationale: మూలపదంలోని నిర్దిష్ట అర్థాన్ని సంక్షిప్తంగా, అస్పష్టత లేకుండా అందిస్తుంది.
- source_word: προάγουσιν ὑμᾶς
  choice: మీకంటే ముందుగా ... వెళ్తున్నారు
  rationale: ప్రస్తుతకాల భావాన్నీ, ఇతరులకంటే ముందుగా సాగుతున్నారనే προάγω రూపకాన్నీ నిలుపుతుంది; ఎదుటివారు చివరికి పూర్తిగా వెలివేయబడతారని అదనంగా నిర్ధారించదు.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: దేవుని రాజ్యంలోకి
  rationale: εἰς తెలిపే దిశను, ‘దేవుని రాజ్యం’ అనే పూర్తి భావప్రయోగాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దేవుని రాజ్యంలో ప్రవేశించడానికి సంబంధించి προάγουσιν ὑμᾶς యొక్క భావబలం
  choice: మీకంటే ముందుగా దేవుని రాజ్యంలోకి వెళ్తున్నారు
  alternative: మీకంటే ముందుగా దేవుని రాజ్యంలో ప్రవేశిస్తున్నారు
  rationale: προάγω ప్రధానంగా ‘ముందుగా వెళ్లడం’ అని సూచిస్తుంది. ఎంపిక చేసిన అనువాదం ప్రాధాన్యక్రమం మరియు హెచ్చరికను నిలుపుతూ, మతనాయకులు అంతిమంగా తప్పక వెలివేయబడతారనే మరింత బలమైన నిర్ధారణను వాక్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘చిత్తం’ వంటి అధిక మతపరమైన పదానికి బదులుగా సందర్భానుకూలమైన ‘కోరినది’ ఎంచుకోబడింది; గంభీరతను మాత్రం యేసు ప్రవేశవాక్యంలో నిలుపుకున్నాం.
