id: MAT.21.4
reference: Matthew 21:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοῦτο ⸀δὲ γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: te
  text: 'ప్రవక్త ద్వారా చెప్పబడిన మాట నెరవేరేలా ఇదంతా జరిగింది[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రవక్త చేత.’ గ్రీకులో అక్షరార్థంగా ‘ప్రవక్త ద్వారా’ అని ఉంది; ఇది ప్రవక్త మధ్యవర్తిగా పలికిన మాటను నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο
  choice: ఇదంతా
  rationale: వెంటనే ముందున్న చర్యల సముదాయాన్ని ఏక సంఘటనగా సూచించే నపుంసక ఏకవచన సర్వనామం; తెలుగులో ‘ఇదంతా’ సందర్భాన్ని సహజంగా సమగ్రపరుస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్ప అనుసంధాన సూచకం మాత్రమే. తెలుగులో వాక్యక్రమమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది; ‘అయితే’ అని పెడితే లేని వ్యతిరేక భావం కలగవచ్చు.
- source_word: γέγονεν
  choice: జరిగింది
  rationale: సంఘటన జరిగినదని తెలిపే సహజమైన ఆధునిక తెలుగు రూపం; గ్రీకు పరిపూర్ణ కాలంలోని సందర్భానుగుణ ఫలితభావాన్ని అతిగా వివరించదు.
- source_word: ἵνα πληρωθῇ
  choice: నెరవేరేలా
  rationale: ἵναతో వచ్చిన కర్మణి ప్రయోగాన్ని ఉద్దేశం/ఫలితం రెండింటికీ చోటు ఉండే సహజ తెలుగు నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: τὸ ῥηθὲν
  choice: చెప్పబడిన మాట
  rationale: నామవాచకంగా పనిచేసే కర్మణి అసమాపక క్రియను స్పష్టమైన, సహజమైన తెలుగు పదబంధంగా అందిస్తుంది.
- source_word: διὰ τοῦ προφήτου
  choice: ప్రవక్త ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సూచించే మధ్యవర్తిత్వాన్ని నిలుపుతుంది; ప్రవక్త ద్వారా సందేశం పలుకబడిందనే భావాన్ని తెలియజేస్తుంది.
- source_word: λέγοντος
  choice: తరువాత వచ్చే ఉద్ధరణను పరిచయం చేసే ద్విబిందువులో వ్యక్తీకరించబడింది
  rationale: తెలుగులో ‘చెబుతూ’ అని అక్షరానువాదం చేయడం అసహజంగా ఉంటుంది. వెంటనే వచ్చే ప్రవచన వాక్యాన్ని ద్విబిందువు సహజంగా పరిచయం చేస్తుంది.
theological_decisions:
- issue: ప్రవచన నెరవేర్పు మరియు ప్రవక్త మధ్యవర్తిత్వం
  choice: ‘ప్రవక్త ద్వారా చెప్పబడిన మాట’
  alternative: ‘ప్రవక్త చేత చెప్పబడిన మాట’
  rationale: గ్రీకు పాఠం ప్రవక్తను కేవలం మాటల మూలంగా చూపకుండా, అతని ద్వారా పలుకబడిన ముందరి వాక్యాన్ని సూచిస్తుంది. ‘ద్వారా’ ఈ మధ్యవర్తిత్వ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: ἵνα నిర్మాణంలోని ఉద్దేశం–ఫలితం సంబంధం
  choice: ‘నెరవేరేలా’
  alternative: ‘నెరవేరడానికి’
  rationale: ‘నెరవేరేలా’ దైవ ఉద్దేశాన్ని పూర్తిగా తొలగించకుండా, నిర్మాణంలో ఉండే ఫలిత ఛాయను కూడా అనవసరంగా మూసివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి వాడబడింది. ఉద్ధరణ తరువాతి వచనంలో కొనసాగుతుందనే విషయాన్ని ద్విబిందువు సూచిస్తుంది.
