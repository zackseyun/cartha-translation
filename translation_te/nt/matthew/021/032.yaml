  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: te
  text: ఎందుకంటే యోహాను నీతి మార్గంలో[a] మీ వద్దకు వచ్చాడు; కానీ మీరు అతని మాట నమ్మలేదు. అయితే పన్ను వసూలు చేసేవారూ వేశ్యలూ అతని మాట నమ్మారు. మీరు అది చూసిన తర్వాత కూడా, తర్వాత మనసు మార్చుకుని అతనిని నమ్మలేదు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీతియుక్తమైన విధానంలో,” లేదా “నీతి అనే మార్గంలో.” ఈ గ్రీకు పదబంధం యోహాను జీవించిన లేదా సేవ చేసిన విధానాన్నో, అతడు ప్రకటించిన నీతి మార్గాన్నో సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతనిని విశ్వసించేలా.” ఇక్కడి గ్రీకు క్రియ ఒక వ్యక్తి మాటను నమ్మడం లేదా ఆ వ్యక్తిని విశ్వసించడం అనే భావాలను కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “తర్వాత మనసు మార్చుకుని అతనిని నమ్మలేదు.” ఇక్కడ వాడిన గ్రీకు క్రియ సాధారణంగా ‘పశ్చాత్తాపపడడం’ కోసం వాడే μετανοέω కాదు; μεταμέλομαι మరింత ప్రత్యేకంగా మనసు మార్చుకోవడం లేదా జరిగినదాని గురించి విచారపడడం సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: ఎందుకంటే ... వచ్చాడు
  rationale: γάρ ముందున్న గద్దింపుకు కారణాన్ని వివరిస్తుంది; తెలుగు వాక్యంలో ‘ఎందుకంటే’ ఈ తార్కిక సంబంధాన్ని సహజంగా తెలియజేస్తుంది. ἦλθεν‌కు ‘వచ్చాడు’ సహజమైన భూతకాల రూపం.
- source_word: Ἰωάννης πρὸς ὑμᾶς
  choice: యోహాను మీ దగ్గరికి
  rationale: πρός + ద్వితీయా విభక్తి శ్రోతలవైపు రావడాన్ని సూచిస్తుంది. ‘మీ దగ్గరికి’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని దిశాభావాన్ని నిలుపుతుంది.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: నీతి మార్గంలో
  rationale: ὁδός అనే మార్గ రూపకాన్ని నిలుపుతూ, δικαιοσύνη యొక్క నైతికంగా దేవునికి అనుగుణమైన భావాన్ని ‘నీతి’ తెలియజేస్తుంది. ఈ పదబంధం యోహాను జీవన/సేవా విధానాన్నో అతడు ప్రకటించిన మార్గాన్నో సూచించగల అస్పష్టతను నిలుపుతుంది.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: మీరు అతని మాట నమ్మలేదు
  rationale: πιστεύω + దత్తివిభక్తి ఒక వ్యక్తిని లేదా అతని సాక్ష్యాన్ని నమ్మడాన్ని సూచిస్తుంది. తెలుగులో కేవలం ‘అతన్ని నమ్మలేదు’ కంటే ‘అతని మాట నమ్మలేదు’ సందర్భానుసారంగా సహజం; ‘అతనిలో విశ్వాసముంచలేదు’ అనే మరింత సిద్ధాంతపరమైన భావాన్ని చేర్చదు.
- source_word: οἱ δὲ τελῶναι καὶ αἱ πόρναι
  choice: కానీ పన్ను వసూలు చేసేవారూ వేశ్యలూ
  rationale: τελῶναιకు సామాన్య పాఠకులకు స్పష్టమైన వృత్తి వివరణను, πόρναιకు నేరుగా అర్థమయ్యే ప్రామాణిక పదాన్ని ఉపయోగించింది; δέలోని వ్యత్యాసాన్ని ‘కానీ’ చూపిస్తుంది.
- source_word: ἐπίστευσαν αὐτῷ
  choice: అతని మాట నమ్మారు
  rationale: ముందటి πιστεύω ప్రయోగంతో సమాంతరతను, నాయకులు మరియు అంచులకు నెట్టబడిన వారి స్పందనల మధ్య వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἰδόντες
  choice: అది చూసిన తర్వాత
  rationale: భూతకాల కృదంతంలోని కాలసంబంధాన్ని తెలియజేస్తుంది. ‘అది’ అనేది పన్ను వసూలు చేసేవారు, వేశ్యలు యోహాను మాట నమ్మిన విషయాన్ని సూచించే సహజమైన తెలుగు పూరణ.
- source_word: οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ
  choice: చూసిన తర్వాత కూడా, అతని మాట నమ్మేలా మీ మనసు మార్చుకోలేదు
  rationale: οὐδέలోని ‘కూడా కాదు’ బలాన్ని ‘కూడా’ తెలియజేస్తుంది. μεταμέλομαιను సాధారణ μετανοέωతో కలపకుండా ‘మనసు మార్చుకోలేదు’గా అనువదించింది; τοῦ πιστεῦσαι ఫలితం/ఉద్దేశ సంబంధాన్ని ‘నమ్మేలా’ సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: δικαιοσύνη యొక్క అనువాదం
  choice: నీతి
  alternative: న్యాయం; నీతియుక్తమైన విధానం
  rationale: ఈ సందర్భంలో యోహాను సేవ దేవుని చిత్తానికి అనుగుణంగా ఉందనే నైతిక-ఆధ్యాత్మిక భావం ప్రధానమైనది. ‘నీతి మార్గం’ మూలంలోని స్థిరమైన మార్గ రూపకాన్ని కూడా కాపాడుతుంది.
- issue: πιστεύω + αὐτῷ యొక్క భావం
  choice: అతని మాట నమ్మడం
  alternative: అతన్ని విశ్వసించడం; అతనిలో విశ్వాసముంచడం
  rationale: ఇక్కడ యోహాను సందేశానికి ఇచ్చిన స్పందనే ముందుభాగంలో ఉంది. ‘అతని మాట నమ్మడం’ వ్యక్తి/సాక్ష్యంపై నమ్మకాన్ని తెలియజేస్తూ, మూలంలో స్పష్టంగా లేని మరింత అభివృద్ధి చెందిన సిద్ధాంతార్థాన్ని రుద్దదు.
- issue: μετεμελήθητε యొక్క అనువాదం
  choice: మీ మనసు మార్చుకోలేదు
  alternative: పశ్చాత్తాపపడలేదు; విచారపడలేదు
  rationale: μεταμέλομαι మనసు మార్చుకోవడం లేదా పశ్చాత్తాపభావం చెందడం అనే పరిధి కలిగినది; ఇది సాధారణంగా ‘పశ్చాత్తాపపడు’ అని అనువదించే μετανοέω కాదు. ప్రధాన పాఠం పదభేదాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ భావం పాదసూచికలో ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘నీతి మార్గం’ అనే బైబిలీయ రూపకాన్ని నిలిపి, ‘అతని మాట నమ్మారు’ అనే సహజ ప్రయోగంతో πιστεύω + దత్తివిభక్తిని అందించింది. ‘వేశ్యలు’ మూలపదంలోని నేరమైన సామాజిక-నైతిక బలాన్ని తగ్గించకుండా తెలిపే ప్రామాణిక పదం. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తు [a], [b], [c]గా పొందుపరచబడింది.
