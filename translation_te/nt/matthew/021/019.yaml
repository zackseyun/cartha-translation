id: MAT.21.19
reference: Matthew 21:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: te
  text: ఆయన దారి పక్కన ఉన్న ఒక అంజూరపు చెట్టును చూసి, దాని దగ్గరికి వెళ్లాడు. దానిమీద ఆకులు తప్ప మరేమీ ఆయన కనుగొనలేదు. అప్పుడు ఆయన దానితో, “ఇక ఎన్నటికీ నీ నుండి పండు పుట్టకూడదు” అన్నాడు.[a] వెంటనే ఆ అంజూరపు చెట్టు ఎండిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సహజంగా: “ఇక ఎన్నటికీ నీకు పండు కాయకూడదు.”'
    reason: మూలంలోని ‘నీ నుండి పండు పుట్టడం’ అనే చిత్రాన్ని ప్రధాన పాఠ్యం దగ్గరగా అనుసరిస్తుంది; అడుగుసూచన సాధారణ తెలుగు ప్రత్యామ్నాయాన్ని ఇస్తుంది.
lexical_decisions:
- source_word: συκῆν μίαν
  choice: ఒక అంజూరపు చెట్టు
  rationale: μίαν ఇక్కడ ఒక నిర్దిష్ట చెట్టును పరిచయం చేస్తుంది; ‘ఒక’ అనేది సహజమైన తెలుగులో ఆ భావాన్ని నిలుపుతుంది.
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: దారి పక్కన ఉన్న
  rationale: స్థిరంగా ఉన్న చెట్టు స్థానాన్ని సూచిస్తున్నందున ‘దారి పక్కన’ సహజమైన స్థానార్థక అనువాదం; ‘దారిమీద’ అని అనవసరంగా సూచించదు.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: దాని దగ్గరికి వెళ్లాడు
  rationale: చెట్టు వైపు సమీపించడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον
  choice: దానిమీద ఆకులు తప్ప మరేమీ ఆయనకు కనిపించలేదు
  rationale: εὗρεν యొక్క మూలార్థం ‘కనుగొన్నాడు’; ఈ దృశ్యంలో తెలుగు వాడుకలో ‘కనిపించలేదు’ సహజంగా ఉంటుంది. ‘ఆకులు తప్ప మరేమీ’ μόνον యొక్క ప్రత్యేకతను నిలుపుతుంది.
- source_word: λέγει αὐτῇ
  choice: ఆయన దానితో ... అన్నాడు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు కథనశైలికి తగిన భూతకాలంగా అందించింది; చెట్టును నేరుగా ఉద్దేశించిన మాటను నిలుపుతుంది.
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: ఇక ఎన్నటికీ నీ నుండి పండు పుట్టకూడదు
  rationale: Μηκέτι యొక్క ‘ఇకపై కాదు’ భావాన్నీ, εἰς τὸν αἰῶνα యొక్క శాశ్వత నిరాకరణనూ ‘ఇక ఎన్నటికీ’ నిలుపుతుంది. ἐκ σοῦ ... γένηται అనే మూలచిత్రాన్ని ‘నీ నుండి ... పుట్టకూడదు’ ప్రతిబింబిస్తుంది.
- source_word: ἐξηράνθη παραχρῆμα
  choice: వెంటనే ... ఎండిపోయింది
  rationale: παραχρῆμα యొక్క తక్షణత్వాన్ని ‘వెంటనే’ స్పష్టంగా తెలుపుతుంది; చెట్టు విషయంలో ἐξηράνθηకి ‘ఎండిపోయింది’ సహజమైన తెలుగు.
theological_decisions:
- issue: అంజూరపు చెట్టుకు యేసు పలికిన మాట యొక్క స్వభావం
  choice: ‘ఇక ఎన్నటికీ నీ నుండి పండు పుట్టకూడదు’ అనే నిషేధాత్మక/శాపోక్తి రూపం
  alternative: ‘ఇక ఎన్నటికీ నీ నుండి పండు పుట్టదు’ అనే ముందస్తు ప్రకటన రూపం
  rationale: Μηκέτιతో కూడిన γένηται ఉపసంభావనార్థక క్రియారూపం కేవలం భవిష్యద్వాణిగా కాక, ఫలం ఇక పుట్టకూడదనే గంభీరమైన ఉక్తిని వ్యక్తం చేస్తుంది. ప్రతీకాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. ‘అంజూరపు చెట్టు’ అనే విస్తృతంగా అర్థమయ్యే పదాన్ని వాడి, మూలంలోని గంభీరమైన శాపోక్తినీ దాని అస్పష్టతనూ కాపాడింది.
