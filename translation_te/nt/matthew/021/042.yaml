id: MAT.21.42
reference: Matthew 21:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: te
  text: 'యేసు వారితో ఇలా అన్నాడు: “లేఖనాల్లో మీరు ఎన్నడూ చదవలేదా? ‘కట్టేవారు తిరస్కరించిన రాయి—అదే మూలరాయి[a] అయింది. ఇది ప్రభువు నుంచే కలిగింది[b]; ఇది మన కళ్లకు అద్భుతంగా ఉంది’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మూలకు శిరస్సు.” “పైభాగపు ముగింపు రాయి” అనే అర్థం కూడా సాధ్యమే.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో, “ప్రభువు నుంచి”; ఈ ఉద్ధరణకు హెబ్రీ మూలపాఠంలో “యెహోవా నుంచి” (YHWH) అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγει
  choice: అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథనశైలిలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: మీరు ఎన్నడూ చదవలేదా?
  rationale: తీవ్రమైన అలంకారిక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: γραφαῖς
  choice: లేఖనాల్లో
  rationale: ఇక్కడ ఇశ్రాయేలు పవిత్ర గ్రంథాలను సూచిస్తుంది; ‘లేఖనాలు’ స్థిరమైన, గౌరవప్రదమైన పదం.
- source_word: ἀπεδοκίμασαν
  choice: తిరస్కరించిన
  rationale: పరిశీలించి పనికిరాదని తోసివేసిన భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: οἱ οἰκοδομοῦντες
  choice: కట్టేవారు
  rationale: నామవాచకంగా వాడిన కృదంతాన్ని సులభంగా అర్థమయ్యే తెలుగులో అందిస్తుంది.
- source_word: οὗτος
  choice: అదే
  rationale: ముందు చెప్పిన రాయిపైన గ్రీకు నిర్దేశక సర్వనామం ఉంచిన ఉద్ఘాటనను కాపాడుతుంది.
- source_word: ἐγενήθη εἰς
  choice: అయింది
  rationale: కొత్త స్థానం లేదా హోదాలోకి వచ్చిన ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κεφαλὴν γωνίας
  choice: మూలకు ప్రధాన రాయి
  rationale: ‘మూలకు శిరస్సు’ అనే అక్షరార్థాన్ని కఠినంగా అనుసరించకుండా, నిర్మాణ రూపకాన్నీ రాయి ప్రాధాన్యాన్నీ నిలుపుతుంది; ఖచ్చితమైన నిర్మాణ స్థానం సందిగ్ధంగా ఉన్నందున ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: παρὰ κυρίου
  choice: ప్రభువు నుంచే
  rationale: παρά + షష్ఠీ విభక్తి తెలిపే మూలం/ఆవిర్భావ భావాన్ని నిలుపుతుంది; ‘ఏ’ ఉద్ఘాటన వాక్య సహజత్వాన్ని బలపరుస్తుంది.
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: మన కళ్లకు అద్భుతంగా ఉంది
  rationale: మూలంలోని దృష్టి-సంబంధిత నుడికారాన్ని, ఉద్ధృత వాక్య గాంభీర్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: కీర్తన ఉద్ధరణలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: గ్రీకు పాఠంలో κυρίου ఉంది కాబట్టి ప్రధాన పాఠంలో ‘ప్రభువు’ వాడబడింది. ఉద్ధరించిన హెబ్రీ మూలంలో దైవనామం YHWH ఉన్న విషయాన్ని పాదసూచికలో పారదర్శకంగా తెలిపాం.
- issue: రాయి రూపకానికి మెస్సీయ సంబంధిత అన్వయం
  choice: రూపకాన్ని వివరణాత్మక విస్తరణ లేకుండా నిలుపడం
  alternative: ప్రధాన పాఠంలో రాయిని మెస్సీయగా స్పష్టంగా గుర్తించడం
  rationale: సందర్భంలో యేసు ఈ వాక్యాన్ని తనకు అన్వయిస్తున్నప్పటికీ, ఈ వచనంలోని ఉద్ధరణ స్వయంగా ఆ వివరణను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. కీర్తన ఉద్ధరణ గాంభీర్యం నిలిచేలా ‘లేఖనాలు,’ ‘ప్రభువు,’ ‘అద్భుతం’ వంటి పదాలు ఎంచుకున్నాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలతో సరిపోతాయి.
