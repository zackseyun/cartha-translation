id: MAT.21.7
reference: Matthew 21:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: te
  text: వారు ఆ గాడిదను, గాడిదపిల్లను తీసుకొచ్చి, వాటిమీద తమ పైవస్త్రాలు వేశారు. ఆయన వాటిమీద కూర్చున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత నిర్దిష్టంగా, ‘ఆ జంతువులమీద వేసిన పైవస్త్రాలపై ఆయన కూర్చున్నాడు.’
    reason: చివరి బహువచన సర్వనామం జంతువులను కాక వాటిమీద వేసిన పైవస్త్రాలను సూచించే అవకాశం ఉంది.
lexical_decisions:
- source_word: ἤγαγον
  choice: తీసుకొచ్చి
  rationale: ἄγω ఇక్కడ జంతువులను యేసు దగ్గరకు తీసుకురావడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘తీసుకొచ్చి’ సహజంగా, సందర్భానికి తగినట్లుగా ఉంది.
- source_word: τὴν ὄνον
  choice: ఆ గాడిదను
  rationale: ὄνος అంటే గాడిద; గ్రీకు స్త్రీలింగ నిర్దేశక పదం ఈ జంతువు ఆడదని సూచించగలిగినా, తెలుగులో ‘గాడిద’ సహజంగా ఉంటుంది. ముందటి సందర్భంలో తెలిసిన జంతువు కావడంతో ‘ఆ’ వాడబడింది.
- source_word: τὸν πῶλον
  choice: గాడిదపిల్లను
  rationale: πῶλος సాధారణంగా చిన్న వయసు జంతువును సూచిస్తుంది; ఇక్కడ సందర్భం గాడిద కాబట్టి ‘గాడిదపిల్ల’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: వాటిమీద తమ పైవస్త్రాలు వేశారు
  rationale: ἱμάτια ఇక్కడ బయట ధరించే వస్త్రాలను సూచిస్తుంది. ‘పైవస్త్రాలు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది; అవి శిష్యుల వస్త్రాలని సందర్భం తెలియజేస్తున్నందున ‘తమ’ చేర్చబడింది.
- source_word: αὐτῶν
  choice: వాటిమీద
  rationale: మొదటి బహువచన సర్వనామం వెంటనే ప్రస్తావించిన రెండు జంతువులను సహజంగా సూచిస్తుంది.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: ఆయన వాటిమీద కూర్చున్నాడు
  rationale: గ్రీకులోని బహువచన సర్వనామాన్ని అలాగే నిలిపి, అది జంతువులను సూచిస్తుందా లేక వాటిమీద వేసిన పైవస్త్రాలను సూచిస్తుందా అనే అస్పష్టతను ప్రధాన పాఠ్యంలో పరిష్కరించకుండా ఉంచింది.
theological_decisions:
- issue: καὶ ἐπεκάθισεν ἐπάνω αὐτῶν లో చివరి αὐτῶν దేనిని సూచిస్తుంది?
  choice: ‘ఆయన వాటిమీద కూర్చున్నాడు’ అని బహువచనాన్ని నిలిపి అనువదించడం
  alternative: ‘ఆయన ఆ పైవస్త్రాలమీద కూర్చున్నాడు’ లేదా ‘ఆయన ఒక జంతువుమీద కూర్చున్నాడు’
  rationale: ఇది ప్రధానంగా వాక్యనిర్మాణ, కథన సంబంధమైన అస్పష్టత. మూలపాఠ్యంలోని బహువచనాన్ని ప్రధాన పాఠ్యంలో నిలిపి, పైవస్త్రాలనే సూచించే సాధ్యమైన భావాన్ని అధస్సూచికలో తెలిపింది; తద్వారా అనువాదం అస్పష్టతను అనవసరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని చివరి బహువచన సర్వనామపు అస్పష్టతను ప్రధాన పాఠ్యంలో నిలిపి, ప్రత్యామ్నాయ అవగాహనను అధస్సూచికలో ఇచ్చాం.
