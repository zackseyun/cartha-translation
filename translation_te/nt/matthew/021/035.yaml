id: MAT.21.35
reference: Matthew 21:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his servants; one they beat[a], another they killed, and another they stoned.
translation:
  language: te
  text: ఆ కౌలు రైతులు అతని దాసులను[a] పట్టుకొని, వారిలో ఒకరిని కొట్టారు, మరొకరిని చంపారు, ఇంకొకరిని రాళ్లతో కొట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సేవకులను.” గ్రీకు పదమైన దూలూస్ (doulous) సందర్భాన్ని బట్టి “దాసులు” లేదా “సేవకులు” అని అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: కౌలు రైతులు
  rationale: ద్రాక్షతోట యజమాని భూమిని కౌలుకు తీసుకొని సాగుచేసే వారిని సందర్భం సూచిస్తుంది; ‘కౌలు రైతులు’ వ్యవసాయ పనినీ కౌలు సంబంధాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: λαβόντες
  choice: పట్టుకొని
  rationale: హింసాత్మక చర్యలకు ముందుగా వారిని తమ అదుపులోకి తీసుకున్న భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘బంధించి’ అని అనువదిస్తే మూలంలో లేని వివరాన్ని చేర్చినట్లవుతుంది.
- source_word: δούλους
  choice: దాసులను
  rationale: యజమానికి అధీనులై అతని ప్రతినిధులుగా పంపబడిన వారి స్థితిని ‘దాసులు’ ప్రతిబింబిస్తుంది; సందర్భానుసారం ‘సేవకులు’ అనే అర్థం కూడా సాధ్యమైనందున దానిని పాదసూచికలో ఉంచాం.
- source_word: ἔδειραν
  choice: కొట్టారు
  rationale: కొట్టడం లేదా తీవ్రంగా దెబ్బలు తీయడం అనే సాధారణ భావాన్ని సహజంగా అందిస్తుంది; ఏ ప్రత్యేక శిక్షా పద్ధతినీ అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἀπέκτειναν
  choice: చంపారు
  rationale: క్రియ యొక్క ప్రత్యక్ష అర్థాన్ని సరళంగా ఇస్తుంది; ‘హత్య చేశారు’ అన్న పదబంధం మూల క్రియలో ప్రత్యేకంగా వ్యక్తం కాని న్యాయపరమైన ఛాయను జోడించవచ్చు.
- source_word: ἐλιθοβόλησαν
  choice: రాళ్లతో కొట్టారు
  rationale: రాళ్లు విసిరి దాడి చేయడాన్ని స్పష్టంగా తెలుపుతుంది; ఈ వాక్యంలో ఆ వ్యక్తి తప్పక చనిపోయాడని మూలపాఠం ప్రత్యేకంగా చెప్పనందున ‘రాళ్లతో కొట్టి చంపారు’ అని విస్తరించలేదు.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: వారిలో ఒకరిని ... మరొకరిని ... ఇంకొకరిని
  rationale: వేర్వేరు దాసులకు వేర్వేరు విధాలుగా చేసినదాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఉపమాన కథలో δοῦλος పదాన్ని అనువదించడం
  choice: దాసులు
  alternative: సేవకులు
  rationale: ఇక్కడ వీరు యజమానికి అధీనులై అతని అధికారంతో పంపబడినవారు. అందువల్ల ‘దాసులు’ మూలపదంలోని అధీన స్థితిని నిలుపుతుంది; అయితే ‘సేవకులు’ కూడా సందర్భపరంగా సాధ్యమైన అర్థం కాబట్టి పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘కౌలు రైతులు’ కౌలు సంబంధాన్ని స్పష్టం చేస్తుంది; సమాంతర క్రియల నిర్మాణం మూలంలోని వరుసను నిలుపుతుంది.
