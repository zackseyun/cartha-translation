  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: te
  text: 'అయితే యేసు వారికి ఇలా జవాబిచ్చాడు: “నేనూ మిమ్మల్ని ఒక ప్రశ్న[a] అడుగుతాను. దానికి మీరు నాకు జవాబు చెబితే, నేను ఏ అధికారంతో ఇవి చేస్తున్నానో నేనూ మీకు చెబుతాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక విషయం”; మరింత అక్షరార్థంగా “ఒక మాట.” గ్రీకు λόγον ἕνα అనే పదబంధం ఒక ప్రశ్నను లేదా చర్చలోని విషయాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: అయితే యేసు వారికి ఇలా జవాబిచ్చాడు
  rationale: ἀποκριθεὶς మరియు εἶπεν కలసి కథనంలో సహజమైన జవాబు పలుకును సూచిస్తాయి. తెలుగులో అనవసర పునరుక్తి లేకుండా స్పందన భావాన్ని నిలుపుతుంది; δέ ఇక్కడ స్వల్ప వ్యతిరేకత లేదా సంభాషణలో మలుపును సూచిస్తుంది.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: నేనూ మిమ్మల్ని ... అడుగుతాను
  rationale: ἐρωτάω ఇక్కడ ప్రతిప్రశ్న అడగడాన్ని సూచిస్తుంది. κἀγώలోని పరస్పర ప్రతిస్పందన భావాన్ని “నేనూ” సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λόγον ἕνα
  choice: ఒక ప్రశ్న
  rationale: λόγος అక్షరార్థంగా “మాట” లేదా “విషయం” కావచ్చు; ఈ ప్రశ్నోత్తర సందర్భంలో “ఒక ప్రశ్న” సాధారణ పాఠకునికి ఉద్దేశాన్ని అత్యంత స్పష్టంగా తెలియజేస్తుంది. మూలంలోని ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: దానికి మీరు నాకు జవాబు చెబితే
  rationale: λέγω యొక్క ప్రాథమిక భావం “చెప్పడం”; ఇక్కడ అడిగిన ప్రశ్నకు సమాధానం ఇవ్వడం సందర్భార్థం. షరతును తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: నేనూ మీకు చెబుతాను
  rationale: ముందున్న κἀγώతో సమాంతరంగా పరస్పర ఒప్పంద భావాన్ని నిలుపుతూ, సహజమైన తెలుగు వాక్యనిర్మాణాన్ని ఇస్తుంది.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: ఏ అధికారంతో
  rationale: ἐν ఇక్కడ కార్యానికి ఆధారమైన లేదా దానిని అనుమతించే అధికారాన్ని సూచిస్తుంది; “ఏ అధికారంతో” తెలుగు వాడుకలో సహజంగా, ఖచ్చితంగా ఉంది.
- source_word: ταῦτα ποιῶ
  choice: ఇవి చేస్తున్నానో
  rationale: ταῦτα బహువచనాన్ని “ఇవి” నిలుపుతుంది. వర్తమాన క్రియ ఆయన వివాదంలో ఉన్న కార్యాలను చేస్తున్నాడనే భావాన్ని తెలియజేస్తుంది.
