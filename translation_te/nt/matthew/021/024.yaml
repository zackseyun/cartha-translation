  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని ఉపయోగించాం. మూలంలోని పరస్పర “నేనూ ... నేనూ” నిర్మాణాన్ని నిలిపి, గ్రీకు వాక్యాన్ని తెలుగులో సులభంగా గ్రహించగల రెండు వాక్యాలుగా అమర్చాం.
