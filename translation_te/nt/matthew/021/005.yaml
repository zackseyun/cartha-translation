id: MAT.21.5
reference: Matthew 21:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: te
  text: '“సీయోను కుమార్తెతో ఇలా చెప్పండి:


    ‘ఇదిగో, నీ రాజు నీ దగ్గరికి వస్తున్నాడు;


    ఆయన సౌమ్యుడు[a],


    గాడిద మీదను, భారవాహక జంతువు పిల్లయైన గాడిదపిల్ల మీదను ఎక్కి ఉన్నాడు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సౌమ్యుడు’ అని అనువదించిన గ్రీకు పదానికి ‘వినయవంతుడు,’ ‘మృదుస్వభావి,’ లేదా ‘దీనుడు’ అనే భావాలు కూడా ఉండవచ్చు. ఇది జెకర్యా 9:9ను ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἴπατε
  choice: ఇలా చెప్పండి
  rationale: బహువచన ఆజ్ఞారూపాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; తరువాత వచ్చే ప్రవచన వాక్యాన్ని పరిచయం చేయడానికి ‘ఇలా’ తోడ్పడుతుంది.
- source_word: τῇ θυγατρὶ Σιών
  choice: సీయోను కుమార్తెతో
  rationale: సీయోనును ఒక కుమార్తెగా వ్యక్తీకరించే ప్రవచన రూపకాన్ని ‘సీయోను ప్రజలు’ అని సారాంశపరచకుండా యథాతథంగా నిలుపుతుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే గ్రీకు సూచనార్థక పదానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: ὁ βασιλεύς σου
  choice: నీ రాజు
  rationale: ద్వితీయ పురుష ఏకవచన స్వామ్యాన్ని, రాజసంబంధమైన భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἔρχεταί σοι
  choice: నీ దగ్గరికి వస్తున్నాడు
  rationale: రాజు ప్రస్తుతం సమీపిస్తున్నాడనే సజీవమైన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πραῢς
  choice: సౌమ్యుడు
  rationale: బలవంతం చేయని మృదుత్వం, శాంతస్వభావం అనే భావాన్ని ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘వినయవంతుడు’ అనే భావసంభావ్యతను పాదసూచికలో ఉంచాం.
- source_word: ἐπιβεβηκὼς
  choice: ఎక్కి వస్తున్నాడు
  rationale: వాహనంపై ఎక్కి ఉన్న స్థితినీ, వస్తున్న చర్యతో దాని సహజ అనుసంధానాన్నీ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπὶ ὄνον
  choice: గాడిద మీద
  rationale: మూలంలోని మొదటి జంతు పదబంధాన్ని సూటిగా నిలుపుతుంది.
- source_word: πῶλον
  choice: గాడిదపిల్ల
  rationale: πῶλος ఒక చిన్న వయసు జంతువును సూచిస్తుంది; సందర్భం మరియు వెంట వచ్చే వివరణ దానిని గాడిదపిల్లగా స్పష్టం చేస్తాయి.
- source_word: υἱὸν ὑποζυγίου
  choice: బరువులు మోసే జంతువు పిల్లయైన
  rationale: సెమిటిక్ శైలిలోని ‘భారవాహక జంతువు కుమారుడు’ అనే నిర్మాణాన్ని పదశః కఠినంగా కాకుండా, దాని వర్గం మరియు సంతాన భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: జెకర్యా 9:9 ప్రవచన ప్రతిధ్వనిలో πραῢς అర్థం
  choice: సౌమ్యుడు
  alternative: వినయవంతుడు / దీనుడు
  rationale: మత్తయి గ్రీకు పదం సౌమ్యత, వినయం, దీనత్వం వంటి పరస్పరం మిళితమైన భావాలను కలిగివుంది. ప్రధాన పాఠంలో రాజు యొక్క సౌమ్య స్వభావాన్ని తెలిపి, ఇతర సాధ్యమైన భావాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: గాడిద మరియు గాడిదపిల్లకు సంబంధించిన ద్వంద్వ ప్రవచన పదబంధం
  choice: ‘గాడిద మీద, అలాగే ... గాడిదపిల్ల మీద’ అనే రెండు అనుసంధానిత పదబంధాలనూ నిలుపడం
  alternative: రెండు పదబంధాలూ ఒకే జంతువును సూచిస్తున్నట్లు కలిపి అనువదించడం
  rationale: మత్తయి గ్రీకు పాఠంలో ἐπὶ ὄνον καὶ ἐπὶ πῶλον అనే ద్వంద్వ నిర్మాణం స్పష్టంగా ఉంది. అది ఒకే జంతువుకు సమాంతర వివరణా లేక రెండు జంతువుల సూచనా అనే వ్యాఖ్యానాన్ని అనువాదం ముందుగానే తీర్మానించకుండా మూల నిర్మాణాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ప్రవచన శైలి వాడబడింది. ‘సీయోను కుమార్తె’ అనే కవితాత్మక వ్యక్తీకరణను నిలిపి, భారవాహక జంతువు వివరణను సహజమైన తెలుగులో ఇచ్చాం.
