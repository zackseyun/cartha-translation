id: MAT.21.12
reference: Matthew 21:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: te
  text: యేసు దేవాలయ ప్రాంగణంలోకి ప్రవేశించి,[a] అక్కడ అమ్మేవారినీ కొనేవారినీ అందరినీ వెళ్లగొట్టాడు. డబ్బు మార్చేవారి బల్లలను, పావురాలు అమ్మేవారి ఆసనాలను తలకిందులు చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవాలయం’ లేదా ‘దేవాలయ ఆవరణలు’; గ్రీకు పదం ప్రత్యేకంగా అంతరాలయాన్ని కాకుండా విస్తృత దేవాలయ సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερόν
  choice: దేవాలయ ప్రాంగణం
  rationale: ఈ పదం అంతరాలయాన్ని ప్రత్యేకంగా సూచించే ναός కాకుండా, ఆవరణలతో కూడిన విస్తృత దేవాలయ సముదాయాన్ని సూచిస్తుంది. వ్యాపార కార్యకలాపాలు జరిగిన ప్రదేశాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేయడానికి ఈ పదబంధం అనుకూలం.
- source_word: ἐξέβαλεν
  choice: వెళ్లగొట్టాడు
  rationale: బలంగా బయటకు పంపించిన నిర్ణయాత్మక చర్యను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: πάντας
  choice: వారందరినీ
  rationale: అక్కడ అమ్మడం, కొనడం చేస్తున్నవారిని సూచించే గ్రీకు పదబంధపు సంపూర్ణ పరిధిని స్పష్టంగా నిలుపుతుంది.
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: అమ్ముతూ కొనుగోలు చేస్తున్న వారందరినీ
  rationale: వర్తమాన కృదంతాలు సూచించే కొనసాగుతున్న వ్యాపార చర్యను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τράπεζας
  choice: బల్లలను
  rationale: సందర్భానికి తగిన సాధారణ అర్థాన్ని నిలుపుతూ, డబ్బు మార్చే పనికి ఉపయోగించిన బల్లలను స్పష్టంగా సూచిస్తుంది.
- source_word: κολλυβιστῶν
  choice: డబ్బు మార్చేవారి
  rationale: నాణేలు లేదా కరెన్సీ మార్చే వ్యక్తులను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: κατέστρεψεν
  choice: తలకిందులు చేశాడు
  rationale: ఇక్కడ సామగ్రిని తిరగవేసిన చర్యను స్పష్టంగా, సజీవంగా తెలియజేస్తుంది; పూర్తిగా ధ్వంసం చేశాడనే అతిశయార్థాన్ని నివారిస్తుంది.
- source_word: καθέδρας
  choice: ఆసనాలను
  rationale: కూర్చునే పీఠాలు లేదా కుర్చీలను సూచించే మూలపదానికి గౌరవప్రదమైన, విస్తృత తెలుగు సమానార్థకం.
- source_word: περιστεράς
  choice: పావురాలు
  rationale: బలి సందర్భంలో ఈ పదానికి సహజమైన, స్థిరపడిన తెలుగు సమానార్థకం.
theological_decisions:
- issue: ἱερόν అనే పదం సూచించే ప్రదేశ పరిధి
  choice: యేసు అంతరాలయంలోకి కాకుండా విస్తృత దేవాలయ ప్రాంగణంలోకి ప్రవేశించాడు.
  alternative: ప్రదేశాన్ని నిర్దిష్టం చేయకుండా కేవలం ‘దేవాలయం’ అని అనువదించడం.
  rationale: గ్రీకు ἱερόν విస్తృత దేవాలయ సముదాయాన్ని సూచిస్తుంది; ‘దేవాలయ ప్రాంగణం’ అనే అనువాదం చారిత్రక, స్థల సంబంధ భేదాన్ని కాపాడుతూ యేసు పరిశుద్ధస్థలంలోకి ప్రవేశించాడనే అనవసర భావాన్ని కలిగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. ‘అక్కడ’ అనే పదం దేవాలయ ప్రాంగణాన్ని అనవసరంగా పునరావృతం చేయకుండా మూలంలోని స్థల సూచనను నిలుపుతుంది.
