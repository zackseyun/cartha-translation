id: MAT.21.44
reference: Matthew 21:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: te
  text: “ఈ రాయి మీద పడేవాడు ముక్కలైపోతాడు; అయితే ఈ రాయి ఎవరి మీద పడుతుందో, వాణ్ణి అది నలిపివేస్తుంది.[a]”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత సజీవంగా, “వాణ్ణి పొడిపొడిగా చేస్తుంది” లేదా “వాణ్ణి ధాన్యపు పొట్టులా చెదరగొడుతుంది.”
    reason: lexical_alternative
  - marker: b
    text: మత్తయి సువార్తలోని కొన్ని ప్రాచీన ప్రతుల్లో ఈ వచనం లేదు; అయితే దీనికి సమాంతరమైన వాక్యం లూకా 20:18లో ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: పడేవాడు
  rationale: నామవాచకంగా పనిచేసే కర్తరి కృదంతం సాధారణంగా ఏ వ్యక్తినైనా సూచిస్తుంది. ‘పడేవాడు’ ఏకవచనాన్ని, సామెతలాంటి వాక్యబలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: ఈ రాయి మీద
  rationale: ఇది నేరమైన స్థలార్థ అనువాదం. ముందు వచనంలోని λίθος రూపకంతో సంబంధం నిలవడానికి ‘రాయి’ అనే స్పష్టమైన పదాన్ని ఉంచాం.
- source_word: συνθλασθήσεται
  choice: ముక్కలైపోతాడు
  rationale: భవిష్యత్ కర్మణి రూపం ఆ వ్యక్తి తీవ్రంగా విరిగిపోవడాన్ని సూచిస్తుంది. రెండో క్రియ λικμήσει యొక్క మరింత బలమైన నలిపివేత భావంతో తేడా నిలిచేలా ఈ పదబంధాన్ని ఎంచుకున్నాం.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: అయితే ఈ రాయి ఎవరి మీద పడుతుందో
  rationale: ఇక్కడ దెబ్బ తగిలే దిశ తారుమారై, రాయే పడే కర్త అవుతుంది. తెలుగు వాక్యంలో కర్త స్పష్టంగా ఉండటానికి సందర్భంలో ఉన్న ‘ఈ రాయి’ని పునరుక్తి చేశాం; ‘ఎవరి మీద ... పడుతుందో’ అనిర్దిష్ట సంబంధార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: λικμήσει
  choice: నలిపివేస్తుంది
  rationale: ఈ క్రియ పూర్తిగా చూర్ణం చేయడం లేదా పొట్టులా చెదరగొట్టడం వంటి బలమైన భావాన్ని కలిగి ఉండవచ్చు. ‘నలిపివేస్తుంది’ ఆధునిక తెలుగులో స్పష్టంగా, బలంగా ఉండి మొదటి క్రియతో తేడాను కాపాడుతుంది; మరింత సజీవమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: αὐτόν
  choice: వాణ్ణి
  rationale: గ్రీకు పదం పుంలింగ ఏకవచనం; అది సాధారణంగా సూచించిన వ్యక్తిని తిరిగి ప్రస్తావిస్తుంది. ‘వాణ్ణి’ ఆ ఏకవచన సంబంధాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: రాయి రూపకం మరియు తీర్పు దృశ్యం
  choice: రాయి అనే స్పష్టమైన రూపకాన్ని, విరిగిపోవడం–నలిపివేయబడడం అనే రెండు దశల తీవ్రతను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపడం
  alternative: ప్రధాన వాక్యంలోనే రాయిని యేసు లేదా మెస్సీయ అని స్పష్టీకరించడం; రెండు క్రియలనూ ఒకే సాధారణ నాశనార్థంగా మార్చడం
  rationale: చుట్టుపక్కల సందర్భం రాయి ఎవరిని సూచిస్తుందో తెలియజేస్తున్నప్పటికీ, ఈ వచనం స్వయంగా సామెతలాంటి రూపకంలో మాట్లాడుతుంది. కాబట్టి రూపకాన్ని వివరించి నిర్ణయించకుండా, దాని తీర్పు తీవ్రతను యథాతథంగా ఉంచాం.
- issue: సాధారణార్థక పుంలింగ ఏకవచనం
  choice: ὁ πεσὼν మరియు αὐτόνలకు ‘పడేవాడు’, ‘వాణ్ణి’ అనే ఏకవచన పుంలింగ రూపాలు వాడడం
  alternative: ‘పడేవారు’, ‘వారిని’ వంటి బహువచనం లేదా ‘ఆ వ్యక్తిని’ వంటి లింగనిరపేక్ష వివరణ వాడడం
  rationale: మూల గ్రీకు సాధారణ సందర్భంలోనూ పుంలింగ ఏకవచన నిర్మాణాన్ని ఉపయోగిస్తుంది. తెలుగు సహజత్వాన్ని కాపాడుతూనే ఆ వ్యాకరణ, ప్రతినిధి బలాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘ముక్కలైపోతాడు’ మరియు ‘నలిపివేస్తుంది’ ద్వారా రెండు గ్రీకు క్రియల మధ్య ఉన్న తీవ్రతాభేదాన్ని నిలిపాం. మొత్తం వచనానికి సంబంధించిన ప్రతుల భేదాన్ని ముగింపులో [b]తో సూచించాం.
