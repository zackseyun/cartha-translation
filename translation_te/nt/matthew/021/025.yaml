id: MAT.21.25
reference: Matthew 21:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: te
  text: '“యోహాను ఇచ్చిన బాప్తిస్మం ఎక్కడి నుండి వచ్చింది? పరలోకం నుండి వచ్చిందా[a], లేక మనుషుల నుండి వచ్చిందా[b]?” వారు తమలో తాము ఇలా చర్చించుకున్నారు: “మనం ‘పరలోకం నుండి’ అని చెబితే, ‘అలాంటప్పుడు మీరు అతణ్ణి ఎందుకు నమ్మలేదు?’ అని ఆయన మనతో అంటాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని నుండి”; గ్రీకులో అక్షరార్థంగా “పరలోకం నుండి.” ఇది దైవ మూలాన్ని లేదా దేవుని అధికారాన్ని గౌరవపూర్వకంగా సూచించే మాట.
    reason: lexical_alternative
  - marker: b
    text: “మనుషుల నుండి” అంటే కేవలం మానవ మూలం లేదా మానవ అధికారం నుండి అని భావం; ఇది “పరలోకం నుండి” అన్న దానికి వ్యతిరేకంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: బాప్తిస్మం
  rationale: ఇది జరుగుతున్న క్రియను మాత్రమే కాక, యోహాను నిర్వహించిన బాప్తిస్మ ఆచారాన్ని లేదా సేవను సూచిస్తుంది. ‘బాప్తిస్మం’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన, స్పష్టమైన పదం.
- source_word: τὸ Ἰωάννου
  choice: యోహాను ఇచ్చిన
  rationale: గ్రీకు సంబంధవిభక్తి బాప్తిస్మాన్ని యోహానుతో అనుసంధానిస్తుంది. తెలుగులో ‘యోహాను ఇచ్చిన బాప్తిస్మం’ అనడం అది యోహాను పొందిన బాప్తిస్మం కాదని, ఆయన నిర్వహించిన బాప్తిస్మమని సహజంగా తెలియజేస్తుంది.
- source_word: πόθεν ἦν
  choice: ఎక్కడి నుండి వచ్చింది
  rationale: πόθεν మూలం లేదా ఆరంభాన్ని ప్రశ్నిస్తుంది. తెలుగులో ‘ఎక్కడి నుండి వచ్చింది?’ అనేది ఆ భావాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξ οὐρανοῦ
  choice: పరలోకం నుండి
  rationale: మూలంలోని ‘ఆకాశం/పరలోకం నుండి’ అనే గౌరవసూచక దైవసంబంధ వ్యక్తీకరణను అలాగే ఉంచి, దానిని ప్రధాన పాఠ్యంలో నేరుగా ‘దేవుని నుండి’గా వ్యాఖ్యానించలేదు.
- source_word: ἐξ ἀνθρώπων
  choice: మనుషుల నుండి
  rationale: ἀνθρώπων ఇక్కడ పురుషులను మాత్రమే కాక మానవ మూలాన్ని సూచిస్తుంది. ‘మనుషుల నుండి’ అనేది పరలోక మూలానికి వ్యతిరేకంగా ఉన్న మానవ మూలాన్ని లింగసమగ్రంగా తెలియజేస్తుంది.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: తమలో తాము ఇలా చర్చించుకున్నారు
  rationale: ఈ పదబంధం వారి పరస్పర తర్కవితర్కంతో కూడిన ఆలోచనను సూచిస్తుంది. ‘చర్చించుకున్నారు’ అనే రూపం అంతర్గత విచారణతో పాటు పరస్పర సంభాషణ భావాన్నీ ఇస్తుంది.
- source_word: Ἐὰν εἴπωμεν
  choice: మనం … అని చెబితే
  rationale: గ్రీకు షరతును ఆధునిక తెలుగులో సహజమైన షరతు వాక్యంగా అందిస్తుంది.
- source_word: ἐρεῖ ἡμῖν
  choice: ఆయన మనతో అంటాడు
  rationale: ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసే λέγω భావాన్ని నిలుపుతూ, యేసును సూచించేందుకు సందర్భోచిత గౌరవ ఏకవచనాన్ని ఉపయోగించింది.
- source_word: Διὰ τί οὖν
  choice: అలాంటప్పుడు … ఎందుకు
  rationale: οὖν ముందున్న ఊహాత్మక జవాబు నుండి వచ్చే తార్కిక పరిణామాన్ని చూపుతుంది. ‘అలాంటప్పుడు’ ఆ వాదనాత్మక బలాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: మీరు అతణ్ణి ఎందుకు నమ్మలేదు
  rationale: దత్తివుతో వచ్చిన πιστεύω ఇక్కడ యోహాను చెప్పిన మాటను, అధికారాన్ని నమ్మడాన్ని సూచిస్తుంది. ‘అతణ్ణి నమ్మలేదు’ వ్యక్తిని నమ్మే భావాన్ని నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ‘పరలోకం నుండి’ అనే మాట యొక్క దైవసంబంధ భావం
  choice: ప్రధాన పాఠ్యంలో ‘పరలోకం నుండి’ అని నిలుపడం
  alternative: దేవుని నుండి
  rationale: ఈ మాట దైవ మూలం లేదా దైవ అధికారాన్ని గౌరవపూర్వకంగా సూచిస్తుంది. అయినా గ్రీకు రూపకాన్ని అలాగే ఉంచడం ద్వారా మూలపాఠ్యపు వ్యక్తీకరణను కాపాడి, వివరణను పాదసూచికలో ఇచ్చాం.
- issue: ἀνθρώπων యొక్క లింగవ్యాప్తి
  choice: మనుషుల నుండి
  alternative: మనుష్యుల చేత / ప్రజల నుండి
  rationale: ఇక్కడ వ్యత్యాసం పురుషులు-స్త్రీల మధ్య కాదు; దైవ మూలం మరియు కేవలం మానవ మూలం మధ్య ఉంది. అందువల్ల లింగసమగ్ర పదాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని ఉపయోగించాం. ప్రశ్నలోని సంక్షిప్త వాదనాత్మక బలాన్ని నిలిపాం. యేసుకు ‘ఆయన’, యోహానుకు సందర్భానికి తగిన ‘అతణ్ణి’ వాడటం ద్వారా తెలుగులో సహజమైన సూచనభేదం కల్పించాం. పాదసూచిక గుర్తులను అవి వివరిస్తున్న పదబంధాల వెంటనే ఉంచాం.
