source:
  edition: SBLGNT
  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: te
  text: ఆయన యెరూషలేములో ప్రవేశించినప్పుడు, పట్టణమంతా కలవరపడింది[a], “ఈయన ఎవరు?” అని అడిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కదిలిపోయింది.” గ్రీకు క్రియ భౌతికంగా కదలడాన్ని లేదా ఇక్కడిలా ప్రజల కలవరాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: ఆయన … ప్రవేశించినప్పుడు
  rationale: గ్రీకు జనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అనువదిస్తుంది; ప్రవేశం జరిగిన సమయాన్నే సూచిస్తుంది.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ లిప్యంతరీకరణను అనుసరిస్తుంది.
- source_word: ἐσείσθη
  choice: కలవరపడి
  rationale: ఈ సందర్భంలో క్రియ భౌతికంగా కంపించడంకంటే యేసు రాకతో పట్టణ ప్రజల్లో ఏర్పడిన తీవ్ర ఉద్వేగం, కలకలం అనే రూపకాలంకార భావాన్ని తెలియజేస్తుంది.
- source_word: πᾶσα ἡ πόλις
  choice: పట్టణమంతా
  rationale: పట్టణంలోని ప్రజలందరినీ సమష్టిగా సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: λέγουσα
  choice: అని అడిగింది
  rationale: మూలంలో అక్షరార్థంగా ‘అంటూ’ అనే భావం ఉన్నా, వెంట వచ్చే మాట ప్రశ్న కావడంతో తెలుగులో ‘అని అడిగింది’ సహజంగా ఉంది; ‘పట్టణం’ అనే సమష్టి ఏకవచన రూపాన్ని నిలుపుతుంది.
- source_word: Τίς ἐστιν οὗτος;
  choice: ఈయన ఎవరు?
  rationale: ‘మనిషి’ వంటి మూలంలో లేని పదాన్ని చేర్చకుండా గ్రీకు ప్రశ్నను నేరుగా, గౌరవసూచకంగా అందిస్తుంది.
theological_decisions:
- issue: పట్టణ ప్రతిస్పందనలో ἐσείσθη క్రియకు రూపకాలంకార లేదా అక్షరార్థ భావం
  choice: ప్రధాన పాఠ్యంలో ‘కలవరపడి’ అని రూపకాలంకార భావంతో అనువదించడం.
  alternative: ‘కదిలిపోయింది’ లేదా ‘కంపించింది.’
  rationale: ఈ వాక్యం భూకంపాన్ని కాక యేసు ప్రవేశానికి పట్టణ ప్రజల సమష్టి ప్రతిస్పందనను వర్ణిస్తుంది. ‘కలవరపడి’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘కదిలిపోయింది’ అనే సాధ్యమైన రూపక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా మూల క్రియలోని చిత్రణను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘పట్టణమంతా … అడిగింది’ అనే సమష్టి ఏకవచన వ్యక్తీకరణ మూలంలోని నగర వ్యక్తీకరణను నిలుపుతుంది. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘కలవరపడి’ పదం వెంట ఉంచాం.
