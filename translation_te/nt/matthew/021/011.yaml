id: MAT.21.11
reference: Matthew 21:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: te
  text: 'జనసమూహాలు ఇలా చెబుతూ ఉన్నాయి: “ఈయన గలిలయలోని నజరేతు నుండి వచ్చిన ఆ ప్రవక్త[a] యేసు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక ప్రవక్త.” గ్రీకులో అక్షరార్థంగా “ఆ ప్రవక్త” అని ఉంది; జనసమూహం యేసును గుర్తించబడిన ప్రవక్తగా పేర్కొన్నట్లు ఇది సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: జనసమూహాలు
  rationale: ὄχλοι బహువచనం కాబట్టి ‘జనసమూహాలు’ అని అనువదించాం. δέ ఇక్కడ స్వల్ప కథన అనుసంధానాన్ని ఇస్తుంది; తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు దాన్ని ప్రత్యేక పదంతో బలవంతంగా వ్యక్తం చేయలేదు.
- source_word: ἔλεγον
  choice: చెబుతూ ఉన్నాయి
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పలుమార్లు జరిగిన మాటను సూచించగలదు; ‘చెబుతూ ఉన్నాయి’ ఆ కోణాన్ని సహజంగా నిలుపుతుంది.
- source_word: Οὗτός ἐστιν
  choice: ఈయన
  rationale: గుర్తింపును తెలిపే ఈ వాక్యంలో తెలుగు నామవాచక వాక్యానికి ‘ఉన్నాడు’ అవసరం లేదు; గౌరవప్రదమైన ‘ఈయన’ వ్యక్తిని స్పష్టంగా సూచిస్తుంది.
- source_word: ὁ προφήτης
  choice: ఆ ప్రవక్త
  rationale: గ్రీకులో ఉన్న నిర్దిష్ట ఉపపదాన్ని, గుర్తించబడిన లేదా నిరీక్షించబడిన ప్రవక్త అనే సంభావ్యతను నిలుపుతూ ‘ఆ ప్రవక్త’గా వ్యక్తం చేశాం.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: వ్యక్తినామాన్ని ప్రామాణిక తెలుగు రూపంలో లిప్యంతరీకరించాం.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: గలిలయలోని నజరేతు నుండి వచ్చిన
  rationale: యేసు మూలస్థలాన్ని తెలిపే పదబంధాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తూ, నజరేతు గలిలయలో ఉందనే భౌగోళిక సంబంధాన్ని నిలిపాం.
theological_decisions:
- issue: ὁ προφήτηςను నిర్దిష్టంగా అనువదించాలా, అనిర్దిష్టంగా అనువదించాలా
  choice: ఆ ప్రవక్త
  alternative: ఒక ప్రవక్త
  rationale: గ్రీకు పాఠంలో నిర్దిష్ట ఉపపదం ఉంది. ఇది జనసమూహం యేసును గుర్తింపుపొందిన ప్రవక్తగా లేదా నిరీక్షిత ప్రవక్తగా పేర్కొనడాన్ని సూచించవచ్చు. ఆ భావసంభావ్యతను స్పష్టీకరించి పరిష్కరించకుండా ప్రధాన పాఠంలో నిలిపి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలిని వాడాం. గ్రీకు అసంపూర్ణ భూతకాల భావాన్ని ‘చెబుతూ ఉన్నాయి’తో, ὁ προφήτηςలోని నిర్దిష్టతను ‘ఆ ప్రవక్త’తో నిలిపాం.
