  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: te
  text: వారు అతన్ని పట్టుకొని, ద్రాక్షతోట బయటికి విసిరివేసి[a], చంపారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ద్రాక్షతోట బయటికి గెంటివేసి.”
    reason: ἐκβάλλω అనే గ్రీకు క్రియకు సందర్భానుకూలమైన మరో సహజ తెలుగు అనువాదాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: λαβόντες (λαμβάνω)
  choice: పట్టుకొని
  rationale: ఇది తరువాతి క్రియలకు ముందు జరిగిన చర్యను సహజమైన తెలుగు కృదంత రూపంలో తెలియజేస్తుంది. సందర్భంలో వ్యక్తిని అదుపులోకి తీసుకోవడం సూచితమైనప్పటికీ, మూలపదంలో లేని అదనపు హింసాత్మక భావాన్ని ‘బలవంతంగా పట్టుకొని’ వంటి పదాలతో చేర్చలేదు.
- source_word: ἐξέβαλον (ἐκβάλλω)
  choice: బయటికి విసిరివేసి
  rationale: ἔξω τοῦ ἀμπελῶνοςతో కలిసి ఇది ద్రాక్షతోట నుంచి భౌతికంగా బయటకు పంపడాన్ని సూచిస్తుంది. ‘విసిరివేసి’ మూలంలోని బలమైన తొలగింపు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘గెంటివేసి’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: ద్రాక్షతోట బయటికి
  rationale: ఇది ద్రాక్షతోట లోపలి నుంచి వెలుపలికి జరిగిన కదలికను నేరుగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀμπελῶνος (ἀμπελών)
  choice: ద్రాక్షతోట
  rationale: ఉపమాన సందర్భంలో vineyard అనే అర్థానికి ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
- source_word: ἀπέκτειναν (ἀποκτείνω)
  choice: చంపారు
  rationale: మూలంలోని ‘చంపడం’ అనే ప్రత్యక్ష అర్థాన్ని సరళంగా నిలుపుతుంది. ‘హత్య చేశారు’ నైతిక/న్యాయపరమైన భావాన్ని మరింత స్పష్టంగా చేర్చవచ్చు కాబట్టి దాన్ని ఉపయోగించలేదు.
theological_decisions:
- issue: సమాంతర సువార్త కథనాలతో పోల్చినప్పుడు బయటికి విసరడం, చంపడం అనే చర్యల క్రమం
  choice: మొదట అతన్ని ద్రాక్షతోట బయటికి విసిరివేసి, తరువాత చంపారని అనువదించడం.
  alternative: మార్కు లేదా లూకాలోని సమాంతర కథనాలకు సరిపోల్చేందుకు, మొదట చంపి తరువాత బయటికి విసిరారని సూచించడం.
  rationale: మత్తయిలోని గ్రీకు క్రియాక్రమం స్పష్టంగా λαβόντες … ἐξέβαλον … καὶ ἀπέκτειναν అని ఉంది. అందువల్ల సమాంతర కథనాలతో సమన్వయం చేయకుండా మత్తయి ఇచ్చిన క్రమాన్నే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన కథన శైలిని వాడాం. ‘పట్టుకొని … విసిరివేసి … చంపారు’ అనే వరుస క్రియారూపాలు గ్రీకు వాక్యంలోని చర్యల క్రమాన్ని స్పష్టంగా నిలుపుతాయి.
