id: MAT.21.2
reference: Matthew 21:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: te
  text: 'వారితో ఇలా అన్నాడు: “మీకు ఎదురుగా ఉన్న[a] గ్రామంలోకి వెళ్లండి. వెంటనే అక్కడ కట్టివేయబడి ఉన్న ఒక గాడిదను, దానితోపాటు ఉన్న ఒక గాడిద పిల్లను[b] మీరు కనుగొంటారు. వాటిని విప్పి నా దగ్గరికి తీసుకురండి.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మీకు ఎదురుగా ఉన్న” అనే మాటను “మీ ఎదుట ఉన్న” లేదా సందర్భానుసారంగా “మీకు అవతల ఉన్న” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం సాధారణంగా చిన్న వయసు జంతువును సూచిస్తుంది; ఇక్కడ సందర్భం ప్రకారం అది గాడిద పిల్ల.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో “విప్పి”కి సంబంధించిన పదం కృదంత రూపంలో, “తీసుకురండి” ఆజ్ఞార్థక రూపంలో ఉంది. తెలుగులో ఈ క్రమాన్ని “వాటిని విప్పి, నా దగ్గరికి తీసుకురండి” అని సహజంగా వ్యక్తపరుస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: వారితో ఇలా అన్నాడు
  rationale: తెలుగు కథనంలో మాటలను పరిచయం చేయడానికి సహజమైన రూపం; గ్రీకు వర్తమాన కృదంతాన్ని సందర్భానుసారంగా సమాపక క్రియగా వ్యక్తం చేస్తుంది.
- source_word: Πορεύεσθε
  choice: వెళ్లండి
  rationale: ఆజ్ఞార్థక సందర్భంలో సహజమైన, స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: κώμην
  choice: గ్రామం
  rationale: κώμη నగరం కంటే చిన్న నివాస స్థలాన్ని సూచిస్తుంది; ‘గ్రామం’ సాధారణమైన సరైన సమానం.
- source_word: κατέναντι ὑμῶν
  choice: మీకు ఎదురుగా ఉన్న
  rationale: శిష్యులకు ఎదురుగా లేదా వారి ఎదుట ఉన్న ప్రదేశమనే స్థల సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘అవతల’ అనే భావసంభావ్యతను పాదసూచికలో ఉంచాం.
- source_word: εὐθέως
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా జరిగే చర్యను తెలిపే εὐθέως యొక్క కాలబలాన్ని నిలుపుతుంది.
- source_word: ὄνον δεδεμένην
  choice: కట్టివేయబడి ఉన్న ఒక గాడిదను
  rationale: పరిపూర్ణ కర్మణి కృదంతం సూచించే, అప్పటికే కట్టి ఉన్న స్థితిని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πῶλον
  choice: ఒక గాడిద పిల్లను
  rationale: πῶλος సాధారణంగా చిన్న వయసు జంతువును సూచించినా, ఇక్కడ ముందున్న గాడిద మరియు దానితో ఉన్న సంబంధం వల్ల గాడిద పిల్ల అని సందర్భం స్పష్టం చేస్తుంది.
- source_word: μετ’ αὐτῆς
  choice: దానితోపాటు ఉన్న
  rationale: ఆ పిల్ల గాడిదతో కలిసి ఉందనే సంబంధాన్ని సహజమైన తెలుగు ప్రయోగంతో నిలుపుతుంది; తెలుగు జంతువుకు తప్పనిసరిగా లింగసూచక సర్వనామం అవసరం లేదు.
- source_word: λύσαντες
  choice: వాటిని విప్పి
  rationale: గ్రీకు కృదంతం తరువాతి ఆజ్ఞకు ముందు జరిగే చర్యను సూచిస్తుంది; తెలుగు అసమాపక క్రియ ఈ క్రమాన్ని సహజంగా, దగ్గరగా ప్రతిబింబిస్తుంది.
- source_word: ἀγάγετέ μοι
  choice: నా దగ్గరికి తీసుకురండి
  rationale: రెండు జంతువులను యేసు వద్దకు తీసుకురావాలనే బహువచన ఆజ్ఞను స్పష్టంగా తెలియజేస్తుంది.
