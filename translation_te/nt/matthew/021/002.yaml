translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘వెళ్లండి,’ ‘తీసుకురండి’ వంటి బహువచన ఆజ్ఞారూపాలు శిష్యుల సమూహాన్ని ఉద్దేశించిన గ్రీకు రూపాలను నిలుపుతున్నాయి. మూలంలోని చర్యల క్రమాన్ని ‘విప్పి ... తీసుకురండి’ అనే సహజ తెలుగు నిర్మాణంతో కాపాడాం.
