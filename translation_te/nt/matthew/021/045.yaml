source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: te
  text: ప్రధాన యాజకులు, పరిసయ్యులు ఆయన ఉపమానాలు విన్నప్పుడు, ఆయన తమ గురించి[a] చెబుతున్నాడని గ్రహించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమను ఉద్దేశించి చెబుతున్నాడని.’ ఆ ఉపమానాలు తమను ఉద్దేశించినవని వారు గుర్తించారు. కొన్ని అనువాదాలు భావాన్ని మరింత వ్యాఖ్యానాత్మకంగా ‘తమకు వ్యతిరేకంగా’ అని అనువదిస్తాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: విన్నప్పుడు
  rationale: ప్రధాన క్రియకు ముందున్న భూతకాల అసమాపక క్రియను సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా వ్యక్తపరుస్తుంది.
- source_word: ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఇది ఒకే కాలంలో అనేకమంది మహాయాజకులు ఉన్నారని కాక, సీనియర్ యాజక నాయకత్వాన్ని సూచించే ప్రామాణిక పదబంధం.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూదు మతవర్గానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: παραβολὰς
  choice: ఉపమానాలు
  rationale: యేసు చెప్పిన రూపకాలతో కూడిన కథలు, బోధనలను సూచించే స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: ἔγνωσαν
  choice: గ్రహించారు
  rationale: ఇక్కడ γινώσκω వారు అప్పుడే గుర్తించి అర్థం చేసుకున్న భావాన్ని తెలియజేస్తుంది; ‘గ్రహించారు’ ఆ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: περὶ αὐτῶν
  choice: తమ గురించే
  rationale: περί + షష్ఠీ విభక్తి యొక్క ప్రాథమిక భావం ‘గురించి/సంబంధించి.’ ‘తమ’ కర్తతో అన్వయాన్ని స్పష్టం చేస్తుంది; ‘గురించే’ వారు తమను సూచిస్తున్నాడని గుర్తించిన సందర్భబలాన్ని సహజంగా చూపుతుంది, కాని ‘వ్యతిరేకంగా’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: λέγει
  choice: చెబుతున్నాడని
  rationale: వర్తమానకాల రూపాన్ని పరోక్ష వాక్యంలో సహజ తెలుగు కొనసాగుతున్న క్రియారూపంగా అందిస్తుంది.
theological_decisions:
- issue: యేసు చెప్పిన ఉపమానాలు నాయకులను ఖండిస్తున్నాయని అనువాదంలో స్పష్టంగా చేర్చాలా
  choice: ఆయన తమ గురించే చెబుతున్నాడని
  alternative: ఆయన తమకు వ్యతిరేకంగా చెబుతున్నాడని
  rationale: గ్రీకు περὶ αὐτῶν నేరుగా ‘వారి గురించి’ అని చెబుతుంది. సందర్భంలో విమర్శ ఉన్నప్పటికీ, ‘వ్యతిరేకంగా’ అనేది మూలపదం స్పష్టంగా చెప్పేదానికంటే బలమైన వ్యాఖ్యానం; అందువల్ల ప్రధాన పాఠంలో ఆ భావాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘విన్నప్పుడు … గ్రహించారు’ అనే నిర్మాణం గ్రీకు క్రియల క్రమాన్ని స్పష్టంగా ఉంచుతుంది; ‘తమ గురించే’ మూలంలోని సూచనను కాపాడుతూ అనవసరమైన ఖండనార్థాన్ని ప్రధాన పాఠంలో చేర్చదు.
