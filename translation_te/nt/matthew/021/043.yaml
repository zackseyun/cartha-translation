source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: te
  text: 'అందుచేత నేను మీతో చెబుతున్నాను: దేవుని రాజ్యం మీ నుండి తీసివేయబడి, దాని ఫలాలను ఇచ్చే ఒక జాతికి[a] ఇవ్వబడుతుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఒక ప్రజాసమూహానికి.’ గ్రీకు ἔθνει అనే పదం జాతిని, ప్రజలను లేదా ప్రజాసమూహాన్ని సూచించగలదు. ఇక్కడ అది ఫలాలను ఇచ్చే లక్షణం గల ఒక సమూహాన్ని సూచిస్తుంది; ఆ సమూహం ఎవరో మరింత నిర్దిష్టంగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందుచేత
  rationale: ముందున్న ఉపమానం, లేఖన ఉల్లేఖనం నుంచి వచ్చే నిర్ధారణను సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: వ్యక్తిగత సంబోధనను నిలుపుతూ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రత్యక్ష వాక్యప్రయోగం.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: మీ దగ్గర నుంచి తీసివేయబడి
  rationale: భవిష్యత్ కర్మణి రూపాన్నీ, ప్రస్తుత స్వాధీనుల నుంచి వేరుచేయబడే భావాన్నీ నిలుపుతుంది.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: దేవుని రాజ్యం
  rationale: దేవుని పరిపాలన, రాజ్య పరిధి అనే రెండు భావసాధ్యతలను కుదించకుండా ఉంచే స్థిరమైన తెలుగు పదబంధం.
- source_word: δοθήσεται
  choice: ఇవ్వబడుతుంది
  rationale: గ్రీకు భవిష్యత్ కర్మణి రూపాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἔθνει
  choice: ఒక జనానికి
  rationale: ἔθνος ఇక్కడ ఫలసంపాదనచేత గుర్తింపబడే సమూహాన్ని సూచిస్తుంది. ‘జనం’ అనేది దానిని తప్పనిసరిగా రాజకీయ దేశంగా గానీ, అన్యజనులుగా గానీ సంకుచితం చేయదు.
- source_word: ποιοῦντι τοὺς καρποὺς αὐτῆς
  choice: దాని ఫలాలను ఫలించే
  rationale: వర్తమాన కృదంతం తెలిపే కొనసాగుతున్న లక్షణాన్ని, బహువచన ‘ఫలాలు’ను, αὐτῆς దేవుని రాజ్యాన్ని సూచించే సహజ సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἔθνει సూచించే సమూహం
  choice: ప్రధాన పాఠ్యంలో ‘ఒక జనం’ అని సాధారణ సమూహపదంతో అనువదించడం
  alternative: సంఘం; అన్యజనులు; యేసు శిష్యులతో కూడిన నూతనీకరించబడిన దేవుని ప్రజలు
  rationale: గ్రీకు వాక్యం ఫలసంపాదనచేత గుర్తింపబడే సమూహాన్ని చెబుతుంది; అది ఏ తరువాతి వేదాంత గుర్తింపునూ స్పష్టంగా నిర్దేశించదు. అందువల్ల వ్యాఖ్యానాన్ని అనువాదంలోకి దిగుమతి చేయలేదు.
- issue: ἡ βασιλεία τοῦ θεοῦ అర్థపరిధి
  choice: ‘దేవుని రాజ్యం’గా నిలుపడం
  alternative: దేవుని పరిపాలన; దేవుని ప్రజలుగా ఉండే ఆధిక్యతలు
  rationale: ‘రాజ్యం’ అనే మూలపదంలోని పరిపాలన మరియు రాజ్యపరిధి భావాలను కుదించకుండా, తీర్పు స్వరూపాన్ని అతిగా వివరించకుండా ఉంచుతుంది.
- issue: αὐτῆς యొక్క పూర్వపదం
  choice: ‘దాని’ అనే సర్వనామం ద్వారా దేవుని రాజ్యాన్ని సూచించే నిర్మాణాన్ని నిలుపడం
  alternative: ఆ జనపు ఫలాలు
  rationale: స్త్రీలింగ αὐτῆς సమీపంలోని స్త్రీలింగ βασιλείαను సహజంగా సూచిస్తుంది; అందుచేత ఫలాలు రాజ్యానికి చెందినవిగా పాఠ్యంలో నిలిచాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘ఫలాలను ఫలించే’ అనే రూపం మూలంలోని ఫలరూపకాన్ని, బహువచనాన్ని కాపాడుతుంది.
