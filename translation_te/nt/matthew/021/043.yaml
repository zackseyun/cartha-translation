- from: 'అందుచేత నేను మీతో చెబుతున్నాను: దేవుని రాజ్యం మీ దగ్గర నుంచి తీసివేయబడి, దాని ఫలాలను ఫలించే ఒక జనానికి[a] ఇవ్వబడుతుంది.'
  to: 'అందుచేత నేను మీతో చెబుతున్నాను: దేవుని రాజ్యం మీ నుండి తీసివేయబడి, దాని ఫలాలను ఇచ్చే ఒక జాతికి[a] ఇవ్వబడుతుంది.'
  rationale: The revision corrects an unnatural fruit-metaphor expression, uses a more idiomatic relational phrase for removal from the addressees, and refines the lexical footnote. It retains the Greek future passives, the plural ‘fruits,’ the pronoun’s reference to the kingdom, and the text’s noncommittal presentation of the recipient group.
