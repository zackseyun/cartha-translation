review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the inferential force, direct address, future passive removal and bestowal, the kingdom-of-God wording, and the deliberately open corporate sense of ἔθνει. However, ‘ఫలాలను ఫలించే’ is not an idiomatic or semantically precise Telugu rendering of ποιοῦντι τοὺς καρποὺς; it redundantly treats ‘fruits’ as the object of ‘bear fruit.’
  naturalness: ‘మీ నుండి’ is more natural and less spatially concrete than ‘మీ దగ్గర నుంచి’ in this judicial-transfer context. ‘దాని ఫలాలను ఇచ్చే’ is an established, clear Telugu metaphor corresponding to ‘producing its fruits.’
  terminology: ‘దేవుని రాజ్యం’ appropriately preserves βασιλεία τοῦ θεοῦ. ‘ఒక జాతి’ is a natural singular corporate rendering of ἔθνει, while the footnote preserves the viable ‘people-group’ sense without identifying the recipient with a particular later theological community.
  issues:
  - severity: medium
    issue: అసహజమైన ‘ఫలాలను ఫలించే’ ప్రయోగం
    rationale: Greek ποιεῖν τοὺς καρπούς means ‘produce/bear its fruits.’ In Telugu, ‘ఫలాలను ఫలించు’ is redundant and unnatural; ‘ఫలాలను ఇచ్చే’ conveys the metaphor and the plural object naturally.
  - severity: low
    issue: ‘మీ దగ్గర నుంచి’లో స్థలసూచక ఛాయ
    rationale: ἀφ’ ὑμῶν denotes removal from the present addressees. ‘మీ నుండి’ expresses this relationship more idiomatically in formal modern Telugu.
  - severity: low
    issue: Footnote alternative ‘ఒక దేశానికి’ is narrower than needed
    rationale: While ἔθνος can mean nation, the note should foreground the equally viable corporate sense ‘people-group’ and avoid suggesting a modern territorial state.
  revised_text: 'అందుచేత నేను మీతో చెబుతున్నాను: దేవుని రాజ్యం మీ నుండి తీసివేయబడి, దాని ఫలాలను ఇచ్చే ఒక జాతికి[a] ఇవ్వబడుతుంది.'
