  edition: SBLGNT
  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: te
  text: ఉదయాన్నే ఆయన పట్టణానికి తిరిగి వెళ్తుండగా, ఆయనకు ఆకలి వేసింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: ఉదయాన్నే
  rationale: రోజులోని తొలి భాగాన్ని సూచించే క్రియావిశేషణం. ‘ఉదయాన్నే’ ఆధునిక తెలుగులో సహజంగా ఉండి, కేవలం ‘ఉదయం’ కంటే వేళ ముందుగానే ఉన్నదనే భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథన కొనసాగింపును సూచించే స్వల్ప అనుసంధానకం. తెలుగులో వాక్యక్రమమే ఆ కొనసాగింపును సహజంగా తెలియజేస్తుంది; ‘అయితే’ లేదా ‘ఇప్పుడు’ చేరిస్తే మూలంలో లేని బలం రావచ్చు.
- source_word: ἐπανάγων
  choice: తిరిగి వెళ్తుండగా
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలీనంగా జరుగుతున్న ప్రయాణాన్ని తెలుపుతుంది. ‘తిరిగి వెళ్తుండగా’ ఆ కొనసాగుతున్న చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὴν πόλιν
  choice: పట్టణానికి
  rationale: εἰς ఇక్కడ పట్టణం వైపు కదలికను సూచిస్తుంది. ‘పట్టణానికి’ గమ్యాన్ని స్పష్టంగా తెలుపుతూ, అప్పటికే పట్టణంలో ప్రవేశించాడని అనవసరంగా సూచించదు.
- source_word: ἐπείνασεν
  choice: ఆయనకు ఆకలి వేసింది
  rationale: ఈ ఆఓరిస్ట్ రూపంలోని సంఘటనాత్మక భావాన్ని ఆధునిక తెలుగులో ‘ఆకలి వేసింది’ సహజంగా వ్యక్తం చేస్తుంది; ఇది కేవలం కొనసాగుతున్న స్థితిని తెలిపే ‘ఆకలిగా ఉన్నాడు’ కంటే తగినది.
theological_decisions:
- issue: యేసు ఆకలిని అనుభవించడంలోని క్రీస్తుశాస్త్ర సంబంధిత భావం
  choice: ఆయన నిజంగా ఆకలిని అనుభవించినట్లు వాక్యాన్ని సూటిగా అనువదించడం
  alternative: ఆకలిని రూపకార్థంగా లేదా కేవలం కనిపించిన అనుభవంగా మార్చి చెప్పడం
  rationale: కథనం యేసు పొందిన నిజమైన మానవ ఆకలిని నేరుగా తెలియజేస్తుంది. అదనపు సిద్ధాంత వివరణను చేర్చకుండా అదే భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని స్వల్ప అనుసంధానకమైన δέ కోసం కృత్రిమమైన ప్రారంభ పదాన్ని చేర్చలేదు.
