id: MAT.21.3
reference: Matthew 21:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: te
  text: ఎవరైనా మీతో ఏమైనా చెప్పితే, మీరు, “ప్రభువుకు అవి అవసరం” అని చెప్పాలి. వెంటనే అతడు వాటిని పంపిస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అతడు” అనేది సందర్భంలో జంతువుల గురించి ప్రశ్నించిన వ్యక్తిని, అనగా వాటి యజమానిని, సూచించవచ్చు; అతడు వాటిని వెంటనే పంపిస్తాడు. ప్రత్యామ్నాయంగా, ఇది “ప్రభువు వాటిని వెంటనే పంపిస్తాడు” అని కూడా అర్థం కావచ్చు.
    reason: referential_ambiguity
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ τι
  choice: ఎవరైనా మీతో ఏమైనా అంటే
  rationale: అనిర్దిష్ట షరతును, అలాగే ఏ విధమైన మాట లేదా అభ్యంతరమైనా ఉండవచ్చనే విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐρεῖτε
  choice: మీరు ... అని చెప్పాలి
  rationale: భవిష్యత్ సూచనకు ఉన్న ఆదేశాత్మక బలాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ὁ κύριος
  choice: ప్రభువు
  rationale: κύριος అనే పదంలోని అధికారార్థాన్నీ, సందర్భంలో యేసును సూచించే సంభావ్య బిరుదు భావాన్నీ నిలుపుతుంది; కేవలం ‘యజమాని’ అని పరిమితం చేయదు.
- source_word: αὐτῶν χρείαν ἔχει
  choice: అవి అవసరం
  rationale: రెండు జంతువులను సూచించే బహువచన సర్వనామాన్ని స్పష్టంగా ఉంచుతూ, గ్రీకు నుడికారాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: εὐθὺς
  choice: వెంటనే
  rationale: ఆలస్యం లేకుండా జరిగే చర్యను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀποστελεῖ αὐτούς
  choice: అతడు వాటిని పంపిస్తాడు
  rationale: క్రియలోని సాధారణ ‘పంపు’ భావాన్ని నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘తిరిగి’ లేదా ‘విడిచిపెట్టు’ అనే భావాలను చేర్చదు.
theological_decisions:
- issue: Ὁ κύριος అనే పదం ఎవరిని, ఏ అధికారాన్ని సూచిస్తుంది
  choice: ప్రభువు
  alternative: యజమాని
  rationale: సందర్భంలో ఇది యేసు తనను తాను అధికారంతో సూచించడమై ఉండవచ్చు; అదే సమయంలో పదానికి సాధారణ ‘యజమాని’ అర్థం కూడా సాధ్యమే. ప్రధాన పాఠంలో ‘ప్రభువు’ ఉంచడం క్రైస్తవ బిరుదు సంభావ్యతను కోల్పోకుండా చేస్తుంది.
- issue: ἀποστελεῖ అనే క్రియకు కర్త ఎవరు
  choice: జంతువుల విషయమై మాట్లాడిన వ్యక్తి వాటిని వెంటనే పంపిస్తాడు
  alternative: ప్రభువు వాటిని వెంటనే తిరిగి పంపిస్తాడు
  rationale: వ్యాకరణపరంగా సమీప సందర్భంలోని అభ్యంతరం చెప్పిన వ్యక్తే సహజమైన కర్త. ‘తిరిగి’ అనే భావం ఈ వాక్యంలో ప్రత్యక్షంగా లేదు; అందువల్ల దాన్ని పాఠంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘చెప్పాలి’ ఆదేశాత్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది. ప్రధాన పాఠంలోని ప్రతి పాదటిప్పణి గుర్తు [a] రూపంలో చేర్చబడింది.
