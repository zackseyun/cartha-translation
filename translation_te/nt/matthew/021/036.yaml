id: MAT.21.36
reference: Matthew 21:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: te
  text: మళ్లీ అతడు మొదటివారికంటే ఎక్కువమంది ఇతర సేవకులను[a] పంపాడు; వారిపట్ల కూడా వారు అలాగే చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇతర దాసులను.’ గ్రీకు పదం δοῦλος (దూలొస్) సందర్భాన్ని బట్టి ‘సేవకుడు’ లేదా ‘దాసుడు’ అని అర్థమివ్వవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: మళ్లీ
  rationale: పునరావృతమైన చర్యను సూచించే సహజమైన ఆధునిక తెలుగు కథన పదం.
- source_word: ἀπέστειλεν
  choice: పంపాడు
  rationale: ἀποστέλλω యొక్క సాధారణ కథనార్థాన్ని సరళంగా, ఖచ్చితంగా తెలియజేస్తుంది.
- source_word: ἄλλους δούλους
  choice: ఇతర సేవకులను
  rationale: ఈ ఉపమాన సందర్భంలో యజమాని పంపిన ప్రతినిధుల పాత్ర ప్రధానంగా ఉంది; δοῦλος‌లోని ‘దాసులు’ అనే ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలుపుతున్నాం.
- source_word: πλείονας τῶν πρώτων
  choice: మొదటివారికంటే ఎక్కువమంది
  rationale: తరువాత పంపబడిన బృందం మొదటి బృందం కంటే సంఖ్యలో పెద్దదని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: వారిపట్ల కూడా వారు అలాగే చేశారు
  rationale: మునుపటి వచనంలో జరిగిన దుర్వ్యవహారాన్ని సందర్భం ద్వారా గ్రహించేలా మూలంలోని సంక్షిప్తతను, అన్వయార్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఉపమానంలో δοῦλος పదానికి అనువాదం
  choice: సేవకులు
  alternative: దాసులు
  rationale: ఇక్కడ వారి చట్టపరమైన బానిస స్థితికంటే యజమాని పంపిన సేవకులు/ప్రతినిధులు అనే కథనపాత్ర ముందుంటుంది. అయినా గ్రీకు పదంలోని ‘దాసులు’ అనే నిజమైన భావసాధ్యతను పాదసూచికలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘వారిపట్ల కూడా వారు అలాగే చేశారు’ అనే రూపం మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను కాపాడుతూ, మునుపటి వచనంతో అనుసంధానిస్తుంది.
