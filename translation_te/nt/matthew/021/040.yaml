id: MAT.21.40
reference: Matthew 21:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: te
  text: కాబట్టి, ద్రాక్షతోట యజమాని వచ్చినప్పుడు, ఆ రైతులను ఏమి చేస్తాడు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రైతులు’ అని ఉన్న గ్రీకు పదానికి సాధారణంగా ‘సాగుచేసేవారు’ అనే అర్థం. ఈ ఉపమాన సందర్భంలో వారు ద్రాక్షతోటను కౌలుకు తీసుకున్న రైతులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: వచ్చినప్పుడు
  rationale: ఉపవాక్యంలోని సంభావ్య భవిష్యత్ సందర్భాన్ని తెలుగులో సహజంగా తెలిపే రూపం; పునరావృత భావమిచ్చే ‘వచ్చినప్పుడల్లా’ కంటే సందర్భానికి సరిపోతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న ఉపమాన కథనం నుంచి యేసు అడిగే నిర్ధారణాత్మక ప్రశ్నకు ఉన్న తార్కిక సంబంధాన్ని నిలుపుతుంది.
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: ద్రాక్షతోట యజమాని
  rationale: ఇక్కడ κύριος దైవిక బిరుదుగా కాక, ఉపమానంలోని ద్రాక్షతోటకు అధికారి/సొంతదారు అనే భావంలో ఉంది.
- source_word: ἀμπελῶνος
  choice: ద్రాక్షతోట
  rationale: ἀμπελώνకు వ్యవసాయ సందర్భంలో ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: τί ποιήσει τοῖς γεωργοῖς ἐκείνοις
  choice: ఆ రైతులను ఏమి చేస్తాడు?
  rationale: భవిష్యత్ ప్రశ్నను, దత్తివిభక్తి ద్వారా ఆ రైతులపైకి దిశచూపే చర్యను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: γεωργοῖς
  choice: రైతులను
  rationale: γεωργός ప్రాథమికంగా రైతు లేదా సాగుచేసేవాడు. కథా సందర్భంలో వారు కౌలు రైతులైనా, ఆ ప్రత్యేకత పదంలోనే స్పష్టంగా లేదు.
- source_word: ἐκείνοις
  choice: ఆ
  rationale: గ్రీకు నిర్దేశక సర్వనామంలోని నిర్దిష్టతను, స్వల్ప దూరసూచనను సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ఉపమాన సందర్భంలో κύριος అనువాదం
  choice: యజమాని
  alternative: ప్రభువు / అధిపతి
  rationale: ఇక్కడ పదం ద్రాక్షతోట సొంతదారుని సూచిస్తుంది; ‘ప్రభువు’ అని అనువదిస్తే ఈ వాక్యంలో ప్రత్యక్షంగా లేని దైవిక లేదా క్రీస్తుసంబంధ బిరుదు భావం ముందుకు రావచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం. మూలంలోని తార్కిక ‘కాబట్టి,’ కాలసూచక ఉపవాక్యం, నిర్దేశక ‘ఆ’ నిలుపబడ్డాయి. ప్రధాన పాఠంలో ‘యజమాని’ స్పష్టంగా ఉన్నందున దానికి ప్రత్యేక పాదసూచిక అవసరం లేదు; సందర్భం వల్ల వచ్చే ‘కౌలు రైతులు’ భావాన్ని మాత్రమే పాదసూచికలో వివరించాం.
