    reason: lexical_alternative
  revision_rationale: No safe correction is needed. The draft faithfully represents the Greek and is natural in modern standard Telugu. The existing footnote is correctly anchored and distinguishes the lexical meaning from the tenancy implication supplied by the broader parable context.
