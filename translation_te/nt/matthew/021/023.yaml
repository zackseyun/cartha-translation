  naturalness: The Telugu is fluent, modern, and appropriately respectful in narrative style. ‘బోధిస్తూ ఉండగా’ naturally represents the contemporaneous participle, and the direct questions are clear and idiomatic.
  terminology: ‘ప్రధాన యాజకులు,’ ‘ప్రజల పెద్దలు,’ and ‘అధికారం’ are accurate, natural choices. ‘అధికారం’ preserves the authorization-focused force of ἐξουσία without imposing a doctrinal interpretation.
