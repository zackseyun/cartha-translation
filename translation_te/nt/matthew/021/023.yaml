id: MAT.21.23
reference: Matthew 21:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: te
  text: ఆయన దేవాలయ ప్రాంగణంలోకి[a] వచ్చి బోధిస్తూ ఉండగా, ప్రధాన యాజకులూ ప్రజల పెద్దలూ ఆయన దగ్గరకు వచ్చి, “నీవు ఏ అధికారంతో ఇవి చేస్తున్నావు? ఈ అధికారాన్ని నీకు ఎవరు ఇచ్చారు?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులోని ἱερόν అనే పదం దేవాలయపు లోపలి పరిశుద్ధ స్థలాన్ని మాత్రమే కాక, దాని ప్రాంగణాలు సహా మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: ఆయన … వచ్చి … ఉండగా
  rationale: జెనిటివ్ అబ్సల్యూట్‌లోని కాలసంబంధ భావాన్ని సహజమైన తెలుగు ఉపవాక్య నిర్మాణంతో వ్యక్తపరుస్తుంది; చర్యల క్రమాన్ని అనవసరంగా కచ్చితీకరించదు.
- source_word: ἱερὸν
  choice: దేవాలయ ప్రాంగణం
  rationale: ἱερόν అనేది లోపలి పరిశుద్ధ స్థలాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది. ‘దేవాలయ ప్రాంగణం’ ఈ సందర్భంలోని బహిరంగ బోధనా స్థలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: προσῆλθον αὐτῷ
  choice: ఆయన దగ్గరకు వచ్చి
  rationale: భౌతికంగా సమీపించడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: διδάσκοντι
  choice: బోధిస్తూ ఉండగా
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలీనమైన చర్యను సూచిస్తుంది; ‘ఉండగా’ ఆ కాలసంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οἱ ἀρχιερεῖς
  choice: ప్రధాన యాజకులు
  rationale: ఇది అనేకమంది ప్రధాన యాజక పదవిదారులను కాదు, నాయకత్వ స్థానాల్లో ఉన్న యాజక అధికారులను సూచిస్తుంది.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: ప్రజల పెద్దలు
  rationale: యూదు ప్రజలలో గుర్తింపు పొందిన సామాజిక నాయకులను సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: ఏ అధికారంతో
  rationale: యేసు చేస్తున్న కార్యాలకు చట్టబద్ధమైన లేదా గుర్తింపు పొందిన ఆధారం ఏమిటనే సవాలును సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ταῦτα ποιεῖς
  choice: ఇవి చేస్తున్నావు
  rationale: ప్రస్తుత సందర్భంలో కొనసాగుతున్న కార్యాలను సూచించే గ్రీకు వర్తమాన కాల భావాన్ని నిలుపుతుంది.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: ఈ అధికారాన్ని నీకు ఎవరు ఇచ్చారు?
  rationale: అధికారాన్ని అప్పగించిన నిర్దిష్ట చర్యను సహజమైన తెలుగు భూతకాల రూపంలో తెలియజేస్తుంది.
theological_decisions:
- issue: నాయకుల ప్రశ్నలో ἐξουσία భావం
  choice: అధికారం
  alternative: హక్కు; శక్తి
  rationale: ఈ సందర్భం కేవలం సామర్థ్యం లేదా బలాన్ని గురించి కాక, యేసు బోధించడానికి మరియు ఈ కార్యాలు చేయడానికి ఉన్న అధికారిక ఆధారాన్ని ప్రశ్నిస్తుంది. ‘అధికారం’ సంస్థాగత, దైవసంబంధ సూచనల రెండింటినీ ముందుగానే తీర్మానించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ప్రత్యక్ష ప్రశ్నలోని సవాలు నిలిచేలా ‘నీవు’ రూపాన్ని వాడినా, అనవసరంగా అవమానకరమైన మాటతీరు చేర్చలేదు.
