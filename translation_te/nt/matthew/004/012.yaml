  source_fidelity: ‘యోహాను అప్పగించబడ్డాడని’ correctly preserves the passive and the lexical breadth of παρεδόθη without prematurely restricting it to arrest. ‘విన్నప్పుడు’ naturally conveys the temporal aorist participle Ἀκούσας, and ‘గలిలయకు’ accurately renders the directional εἰς τὴν Γαλιλαίαν. The implicit subject is appropriately made explicit by the honorific ‘ఆయన.’ ‘వెళ్లిపోయాడు’ is a natural rendering of ἀνεχώρησεν; while it is slightly less marked than ‘withdrew,’ it does not introduce an unwarranted motive or implication of return.
