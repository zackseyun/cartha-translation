  terminology: ‘యోహాను’ and ‘గలిలయ’ follow established Telugu biblical name forms. ‘అప్పగించబడ్డాడు’ is the preferable main-text equivalent for παραδίδωμι in this verse. The footnote’s ‘బంధించబడ్డాడని’ suitably supplies the contextual, narrower alternative.
