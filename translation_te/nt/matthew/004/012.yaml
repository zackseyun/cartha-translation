  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: te
  text: యోహాను అప్పగించబడ్డాడని[a] విన్నప్పుడు, ఆయన గలిలయకు వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ సందర్భంలో మరింత నిర్దిష్టంగా, ‘బంధించబడ్డాడని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας
  choice: విన్నప్పుడు
  rationale: ἀκούω అనే క్రియ యొక్క భూతకాల అసమాపక రూపం ప్రధాన క్రియకు ముందున్న సందర్భాన్ని సూచిస్తుంది. ‘విన్నప్పుడు’ అనేది ఆ కాలసంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక స్వల్ప కథన మార్పును సూచిస్తుంది. తెలుగులో వాక్యప్రవాహమే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘అయితే’ లేదా ‘ఇప్పుడు’ చేరిస్తే మూలంలో లేని బలమైన భావం కలగవచ్చు.
- source_word: Ἰωάννης
  choice: యోహాను
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: παρεδόθη
  choice: అప్పగించబడ్డాడని
  rationale: παραδίδωμι క్రియ యొక్క విస్తృతమైన ‘అప్పగించు/చేతికి ఒప్పగించు’ భావాన్ని నిలుపుతుంది. సందర్భంలో బంధించడం ఉద్దేశించబడవచ్చుగానీ, ప్రధాన పాఠంలో అర్థాన్ని దానికే పరిమితం చేయదు.
- source_word: ἀνεχώρησεν
  choice: వెళ్లిపోయాడు
  rationale: సంఘటనకు ప్రతిస్పందనగా అక్కడి నుంచి వెళ్లిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. ‘వెనుదిరిగాడు’ అంటే ముందున్న చోటికి తిరిగి వెళ్లాడనే అనవసర భావం రావచ్చు; ‘పారిపోయాడు’ భయాన్ని అతిగా సూచిస్తుంది.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: గలిలయకు
  rationale: εἰς యొక్క దిశాసూచక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యోహానుకు సంబంధించి παραδίδωμι పదం అనువాదం
  choice: అప్పగించబడ్డాడని
  alternative: బంధించబడ్డాడని
  rationale: గ్రీకు క్రియ సాంకేతికంగా ‘బంధించు’ అనే అర్థానికంటే విస్తృతమైనది; మత్తయి రచనలో ‘అప్పగించబడడం’ అనే ప్రతిధ్వనిని కూడా కలిగి ఉండగలదు. ప్రధాన పాఠం ఆ విస్తృతిని కాపాడుతుంది; సందర్భానికి అనుగుణమైన నిర్దిష్ట అర్థాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు; గౌరవార్థక ‘ఆయన’ ద్వారా సందర్భంలో గ్రహించబడే యేసు అనే కర్తను స్పష్టం చేసింది. వాక్యాన్ని అనవసరమైన కథన సంధిపదంతో ప్రారంభించలేదు.
