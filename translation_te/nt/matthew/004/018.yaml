id: MAT.4.18
reference: Matthew 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: te
  text: యేసు గలిలయ సముద్రం ఒడ్డున నడుస్తూ ఉండగా, పేతురు అని పిలువబడే సీమోను, అతని సోదరుడు అంద్రెయ అనే ఇద్దరు సోదరులు సముద్రంలోకి వల[a] విసురుతుండగా చూశాడు; ఎందుకంటే వారు జాలరులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకు పదం చేపలు పట్టడానికి విసిరే వలని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: యేసు గలిలయ సముద్రం ఒడ్డున నడుస్తూ ఉండగా
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలీనంగా కొనసాగుతున్న చర్యను సూచిస్తుంది. παρά + ద్వితీయా విభక్తి ఇక్కడ సముద్రం పక్కగా/ఒడ్డున కదలడాన్ని తెలియజేస్తుంది. తెలుగులో కర్తను స్పష్టంచేయడానికి సందర్భానుసారంగా ‘యేసు’ను చేర్చడం సహజం.
- source_word: εἶδεν δύο ἀδελφούς
  choice: ఆ ఇద్దరు సోదరులను—చూశాడు
  rationale: εἶδεν సాధారణ కథన భూతకాలంలో ‘చూశాడు’; ἀδελφούς ఇక్కడ పేర్లతో గుర్తించబడిన ఇద్దరు మగ సహోదరులను సూచిస్తుంది.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: పేతురు అని పిలువబడే సీమోనును
  rationale: λεγόμενον అనే కర్మణి కృదంతాన్ని సహజమైన తెలుగు సంబంధ వాక్యంతో అందించాం; వ్యక్తి పేర్లను సంప్రదాయ తెలుగు రూపాల్లో లిప్యంతరీకరించాం.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: అతని సోదరుడు అంద్రెయను
  rationale: అప్పోసిషనల్ పదబంధం అంద్రెయను సీమోను సోదరునిగా గుర్తిస్తుంది. తెలుగు వాక్య నిర్మాణంలో సంబంధం స్పష్టంగా ఉండే క్రమాన్ని వాడాం.
- source_word: βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν
  choice: వారు సముద్రంలో వల[a] వేస్తున్నారు
  rationale: వర్తమాన కృదంతం వారిని చూసినప్పుడు కొనసాగుతున్న చర్యను సూచిస్తుంది. ἀμφίβληστρον విసిరి చేపలు పట్టే ప్రత్యేక వల; ప్రధాన పాఠ్యంలో సహజమైన ‘వల’, పాదసూచికలో నిర్దిష్ట అర్థం ఇచ్చాం.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: ఎందుకంటే వారు జాలరులు
  rationale: γάρ ముందున్న చర్యకు వివరణాత్మక కారణాన్ని ఇస్తుంది. ἁλιεῖςకు ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన వృత్తిపదం ‘జాలరులు’.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘గలిలయ సముద్రం’ అనే స్థలనామాన్ని నిలిపి ఉంచాం; అది భౌగోళికంగా సరస్సు అయినప్పటికీ మూలపాఠంలోని θάλασσα మరియు సంప్రదాయ స్థలనామానికి అనుగుణంగా ‘సముద్రం’ వాడాం.
