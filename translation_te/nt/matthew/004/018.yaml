revisions:
- from: యేసు గలిలయ సముద్రం ఒడ్డున నడుస్తూ ఉండగా, పేతురు అని పిలువబడే సీమోనును, అతని సోదరుడు అంద్రెయను—ఆ ఇద్దరు సోదరులను—చూశాడు. వారు సముద్రంలో వల[a] వేస్తున్నారు; ఎందుకంటే వారు జాలరులు.
  to: యేసు గలిలయ సముద్రం ఒడ్డున నడుస్తూ ఉండగా, పేతురు అని పిలువబడే సీమోను, అతని సోదరుడు అంద్రెయ అనే ఇద్దరు సోదరులు సముద్రంలోకి వల[a] విసురుతుండగా చూశాడు; ఎందుకంటే వారు జాలరులు.
  rationale: The revision preserves the Greek participial scene-setting and the two named brothers as a single object of “saw,” while using natural Telugu syntax. It also renders εἰς with “సముద్రంలోకి” and retains a lexical footnote for the specific kind of fishing net.
