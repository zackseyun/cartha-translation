id: MAT.4.11
reference: Matthew 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: te
  text: అప్పుడు అపవాది ఆయనను విడిచిపోయాడు. ఇదిగో, దేవదూతలు వచ్చి ఆయనకు సేవ చేస్తూ ఉండేవారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవదూతలు వచ్చి ఆయనకు సేవ చేశారు.” గ్రీకు క్రియను “సేవ చేశారు” అని కూడా అనువదించవచ్చు; దాని భూతకాల అసంపూర్ణ రూపం చర్య కొనసాగుతూ ఉందనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలోని సంఘటనల క్రమాన్ని సహజంగా సూచించే కాలవాచక అనుసంధానం.
- source_word: ἀφίησιν
  choice: విడిచిపోయాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు కథనశైలిలో భూతకాలంగా ఇచ్చాం; సందర్భంలో అపవాది యేసును విడిచి వెళ్లిపోవడమే భావం.
- source_word: αὐτὸν
  choice: ఆయనను
  rationale: ఇది యేసును సూచించే కర్మ సర్వనామం; గౌరవార్థక రూపం తెలుగు వాడుకకు సహజం.
- source_word: ὁ διάβολος
  choice: అపవాది
  rationale: ఈ శోధన వృత్తాంతంలో సాతానుకు వాడిన వ్యక్తిగత బిరుదును, మూలపదంలోని అపనింద వేయువాడు అనే భావాన్ని నిలుపుతూ తెలుగులో స్థిరపడిన రూపంతో ఇచ్చాం.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: అనూహ్యమైన తదుపరి దృశ్యంపై పాఠకుని దృష్టిని నిలిపే మూలపాఠంలోని సజీవ సంభాషణ సూచకాన్ని నిలిపాం.
- source_word: ἄγγελοι
  choice: దేవదూతలు
  rationale: ఈ సందర్భంలో మానవ సందేశవాహకులు కాక పరలోక సంబంధమైన దూతలే ఉద్దేశించబడ్డారు.
- source_word: προσῆλθον
  choice: వచ్చి
  rationale: వారు యేసు దగ్గరకు వచ్చారనే భావాన్ని సంక్షిప్తమైన, సహజమైన తెలుగు క్రియతో ఇచ్చాం.
- source_word: διηκόνουν
  choice: సేవ చేస్తూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న చర్యను తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది; ‘సేవ చేశారు’ అనే సరళ రూపం కూడా సాధ్యమే.
- source_word: αὐτῷ
  choice: ఆయనకు
  rationale: దేవదూతల సేవను పొందిన వ్యక్తి యేసే అని దత్తివాచక భావాన్ని స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: διάβολος అనే పదాన్ని సాతాను వ్యక్తిగత బిరుదుగా అనువదించడం
  choice: అపవాది
  alternative: సాతాను; అపనిందకుడు
  rationale: ‘అపవాది’ మూలపద భావాన్ని, ఈ సందర్భంలోని వ్యక్తిగత బిరుదును రెండింటినీ నిలుపుతుంది. ‘సాతాను’ అని మార్చడం మూలంలో ఉన్న వేరొక బిరుదును ప్రత్యామ్నాయంగా పెట్టినట్లవుతుంది; ‘అపనిందకుడు’ సాధారణ వివరణలా వినిపించి కథనంలోని నిర్దిష్ట వ్యక్తిని సూచించే స్పష్టతను తగ్గించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించాం. ‘ఇదిగో’ అనే పదం మూలంలోని దృష్టి ఆకర్షణను నిలుపుతుంది; ‘సేవ చేస్తూ ఉన్నారు’ కొనసాగుతున్న చర్యను సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
