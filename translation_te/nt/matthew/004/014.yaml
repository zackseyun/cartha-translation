  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: te
  text: 'యెషయా ప్రవక్త ద్వారా ఇలా చెప్పబడినది నెరవేరునట్లు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: నెరవేరేలా
  rationale: ఈ సందర్భంలో ఉద్దేశం/ఫలితం రెండింటికీ చోటిచ్చే సహజమైన తెలుగు ప్రయోగం; మత్తయి వాడిన నెరవేర్పు సూత్రాన్ని తరువాతి క్రియతో కలిపి స్పష్టంగా ఉంచుతుంది.
- source_word: πληρωθῇ
  choice: నెరవేరేలా
  rationale: ఆరిస్ట్ పాసివ్ సబ్జంక్టివ్ భావాన్ని తెలుగు సందర్భంలో సహజంగా వ్యక్తం చేస్తూ, లేఖన నెరవేర్పు అనే మత్తయి ప్రత్యేక పదప్రయోగాన్ని కాపాడుతుంది.
- source_word: τὸ ῥηθὲν
  choice: చెప్పబడినది
  rationale: ఆర్టికల్‌తో substantival‌గా వాడిన పాసివ్ పార్టిసిపిల్‌ను సంక్షిప్తంగా, దాని కర్మణి భావాన్ని నిలుపుతూ అనువదిస్తుంది.
- source_word: διὰ
  choice: ద్వారా
  rationale: యెషయా మధ్యవర్తిగా పలికిన ప్రవచన వాక్యమనే agency/instrumentality భావాన్ని నిలుపుతుంది.
- source_word: Ἠσαΐου
  choice: యెషయా
  rationale: తెలుగు బైబిలు సంప్రదాయంలో విస్తృతంగా గుర్తించబడే ప్రవక్త పేరురూపం.
- source_word: τοῦ προφήτου
  choice: ప్రవక్త
  rationale: యెషయా పాత్రను స్పష్టంగా ఉంచే appositional designation.
- source_word: λέγοντος
  choice: ఇలా
  rationale: తరువాత వచ్చే ప్రత్యక్ష ఉద్ధరణను సహజమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది; ద్విబిందువు ఉద్ధరణ ఆరంభాన్ని సూచిస్తుంది.
theological_decisions:
- issue: మత్తయిలోని లేఖన నెరవేర్పు సూత్రం
  choice: ‘నెరవేరేలా’ అని అనువదించి నెరవేర్పు భావాన్ని స్పష్టంగా నిలిపాం.
  alternative: ‘నిజమయ్యేలా’ లేదా ‘జరిగేలా’
  rationale: ‘నెరవేరు’ అనే పదం ప్రవచన వాక్యం మరియు తరువాతి సంఘటన మధ్య మత్తయి చూపే సంబంధాన్ని కాపాడుతుంది; దాని theological అర్థాన్ని పాఠ్యానికి మించి విస్తరించదు.
- issue: ἵνα వాక్యభాగంలోని ఉద్దేశం/ఫలితం సంబంధం
  choice: ‘నెరవేరేలా ఇలా జరిగింది’
  alternative: ‘నెరవేరుటకు’
  rationale: గ్రీకు ἵνα నిర్మాణంలో ఉద్దేశం మరియు ఫలితం మధ్య ఉన్న సాధ్యమైన ఉద్వేగాన్ని పూర్తిగా ఒకే వైపుకు తేల్చకుండా, తెలుగులో సహజమైన అనుసంధానాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగానూ సాధారణ పాఠకులకు సులభంగానూ ఉంది. ఈ వచనం ముందరి సంఘటనకు అనుసంధానమై ఉండటంతో గ్రీకులో అంతర్లీనంగా ఉన్న ప్రధాన వాక్యాన్ని ‘ఇలా జరిగింది’ అని సంక్షిప్తంగా పూరించాం. ‘చెప్పబడినది’ కర్మణి రూపాన్ని, ‘ద్వారా’ ప్రవక్త మధ్యవర్తిత్వాన్ని నిలుపుతాయి.
