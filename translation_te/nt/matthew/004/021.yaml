id: MAT.4.21
reference: Matthew 4:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: te
  text: ఆయన అక్కడి నుంచి ముందుకు వెళ్లి, మరో ఇద్దరు సోదరులైన జెబెదయి కుమారుడు యాకోబును, అతని సోదరుడు యోహానును చూశాడు. వారు తమ తండ్రి జెబెదయితో కలిసి పడవలో తమ వలలను బాగుచేస్తూ ఉన్నారు. ఆయన వారిని పిలిచాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: అక్కడి నుంచి ముందుకు వెళ్లి
  rationale: ప్రొబైనో క్రియలోని ముందుకు సాగడం అనే భావాన్ని, ἐκεῖθεν సూచించే మునుపటి స్థలం నుంచి కదలడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἶδεν
  choice: చూశాడు
  rationale: ὁράω క్రియ యొక్క సాధారణ కథనార్థాన్ని ఎలాంటి అదనపు భావతీవ్రత లేకుండా నిలుపుతుంది.
- source_word: ἄλλους δύο ἀδελφούς
  choice: మరో ఇద్దరు సహోదరులను
  rationale: ఇంతకు ముందు ప్రస్తావించిన ఇద్దరికి అదనంగా వీరు మరో ఇద్దరు అన్న భావాన్ని ἄλλους స్పష్టంగా సూచిస్తుంది; ‘సహోదరులు’ గౌరవప్రదమైన, సులభంగా అర్థమయ్యే పదం.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: జెబెదయి కుమారుడైన యాకోబు
  rationale: గ్రీకు జననసంబంధ షష్ఠీ విభక్తి ఇక్కడ తండ్రి-కొడుకు సంబంధాన్ని సూచిస్తుంది; తెలుగులో దాన్ని స్పష్టంగా వ్యక్తం చేయడం సహజం.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: అతని సహోదరుడు యోహాను
  rationale: αὐτοῦ సమీప పూర్వపదమైన యాకోబును సూచిస్తుంది; యోహాను యాకోబు సహోదరుడని తెలుగులో స్పష్టంగా తెలుపుతుంది.
- source_word: ἐν τῷ πλοίῳ
  choice: పడవలో
  rationale: గలిలయ చేపల వేట సందర్భంలో πλοῖον పెద్ద ఓడ కంటే చేపల పడవను సూచిస్తుంది.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: తమ తండ్రి జెబెదయితో కలిసి
  rationale: μετά సహవాసాన్ని సూచిస్తుంది; ‘తో కలిసి’ అనే రూపం ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: తమ వలలను బాగుచేసుకుంటున్నారు
  rationale: చేపల వేట సందర్భంలో καταρτίζω వలలను తిరిగి పనికివచ్చే స్థితికి తేవడాన్ని సూచిస్తుంది; ‘బాగుచేసుకోవడం’ మరమ్మతు చేయడం/సిద్ధం చేయడం రెండింటి సందర్భోచిత పరిధిని సహజంగా అందిస్తుంది.
- source_word: ἐκάλεσεν αὐτούς
  choice: ఆయన వారిని పిలిచాడు
  rationale: καλέω యొక్క సరళ రూపాన్ని నిలుపుతూ, ఈ వాక్యంలో లేని ‘తనను వెంబడించమని’ వంటి వివరణను చేర్చదు.
theological_decisions:
- issue: ἐκάλεσενలో శిష్యత్వ పిలుపు అంతర్భావం
  choice: ‘ఆయన వారిని పిలిచాడు’ అనే సరళ రూపాన్ని ఉంచడం
  alternative: ‘తనను వెంబడించమని వారిని పిలిచాడు’
  rationale: సమీప సందర్భం ఇది శిష్యత్వానికి పిలుపని తెలియజేస్తుంది; అయితే ఈ వచనం స్వయంగా పిలుపు ఉద్దేశాన్ని విస్తరించి చెప్పదు. అందువల్ల మూలంలోని సంక్షిప్తతను నిలుపుతాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో ఉంది. గ్రీకు వాక్యంలోని దీర్ఘ నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం; సంఘటనల క్రమం మరియు సంబంధాలు యథాతథంగా ఉన్నాయి.
