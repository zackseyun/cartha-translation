id: MAT.4.15
reference: Matthew 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: te
  text: 'జెబూలూను దేశం, నఫ్తాలి దేశం,

    సముద్ర మార్గం, యొర్దాను అవతల,

    అన్యజనుల గలిలయ[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జనముల గలిలయ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γῆ / γῆ
  choice: దేశం
  rationale: ఇక్కడ భూమి లేదా నేల అనే సాధారణ అర్థం కాకుండా, జెబూలూను మరియు నఫ్తాలితో సంబంధమున్న భౌగోళిక ప్రాంతాన్ని సూచిస్తుంది. రెండు సందర్భాల్లోనూ ఒకే పదాన్ని వాడి గ్రీకు సమాంతర నిర్మాణాన్ని నిలిపాం.
- source_word: Ζαβουλὼν
  choice: జెబూలూను
  rationale: తెలుగు బైబిలు వాడుకలో గుర్తించదగిన గోత్ర/ప్రాంత నామరూపం.
- source_word: Νεφθαλίμ
  choice: నఫ్తాలి
  rationale: తెలుగులో స్థిరపడిన గోత్ర/ప్రాంత నామరూపం.
- source_word: ὁδὸν θαλάσσης
  choice: సముద్ర మార్గం
  rationale: తెలుగులో సహజంగా ఉండడంతో పాటు, ఇది ఒక ప్రసిద్ధ రహదారినో సముద్రానికి సంబంధించిన ప్రాంతాన్నో సూచించగల మూలంలోని సంక్షిప్తతను, అస్పష్టతను కాపాడుతుంది.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: యొర్దాను అవతల
  rationale: ఏ దిశనుంచి చూస్తున్నారో అదనంగా నిర్ణయించకుండా మూలంలోని భౌగోళిక ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Γαλιλαία
  choice: గలిలయ
  rationale: ఈ ప్రాంతానికి తెలుగులో విస్తృతంగా గుర్తించబడే పేరు.
- source_word: τῶν ἐθνῶν
  choice: అన్యజనుల
  rationale: మత్తయి సందర్భంలో ఈ పదం యూదేతర ప్రజలను సూచించే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘జనముల’ అనే విస్తృతమైన అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: యెషయా ఉల్లేఖనంలో τῶν ἐθνῶν అనువాదం
  choice: అన్యజనుల
  alternative: జనముల
  rationale: మత్తయి సందర్భంలో ఈ పదబంధం యూదేతర జనాభాతో గలిలయకు ఉన్న సంబంధాన్ని ముందుకు తెస్తుంది. అయితే గ్రీకు పదానికి ‘జనములు’ అనే విస్తృత అర్థం కూడా సాధ్యమే కాబట్టి దాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రవచన ఉల్లేఖనానికి తగిన గంభీరతతో సంక్షిప్త భౌగోళిక జాబితా రూపాన్ని నిలిపాం. వచనం తదుపరి వాక్యంలో కొనసాగుతుందని చూపేందుకు చివర దీర్ఘ విరామచిహ్నాన్ని ఉంచాం.
