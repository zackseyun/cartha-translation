id: MAT.4.16
reference: Matthew 4:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: te
  text: చీకటిలో కూర్చున్న ప్రజలు గొప్ప వెలుగును చూశారు; మరణపు ప్రాంతంలోను నీడలోను కూర్చున్నవారికి వెలుగు ఉదయించింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαὸς
  choice: ప్రజలు
  rationale: ఒక సమష్టి మానవ సమూహాన్ని సహజంగా సూచిస్తుంది; ‘జాతి’ అనడం ఇక్కడ అనవసరంగా రాజకీయ లేదా వంశపరమైన భావాన్ని కలిగించవచ్చు.
- source_word: καθήμενος / καθημένοις
  choice: కూర్చున్న / కూర్చున్నవారు
  rationale: మూలంలోని ‘కూర్చుండుట’ అనే సజీవ దృశ్యాన్ని, యెషయా ప్రతిధ్వనిని, రెండు భాగాల సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: σκοτίᾳ
  choice: చీకటి
  rationale: పదానికి సాధారణమైన సమానార్థకం; దాన్ని కేవలం నైతిక, ఆత్మీయ లేదా పరిస్థితిజన్య చీకటిగా పరిమితం చేయదు.
- source_word: φῶς εἶδεν μέγα
  choice: గొప్ప వెలుగును చూశారు
  rationale: గ్రీకు పదక్రమంలోని భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతూ, అద్భుతమైన వెలుగు ప్రత్యక్షమైన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: χώρᾳ
  choice: ప్రాంతం
  rationale: ఆధునిక దేశరాజ్య భావాన్ని రేకెత్తించకుండా భౌగోళిక పరిధిని సహజంగా సూచిస్తుంది.
- source_word: σκιᾷ θανάτου
  choice: మరణపు నీడ
  rationale: గ్రీకులో θανάτου (‘మరణం’) స్పష్టంగా ఉన్నందున దాన్ని నిలుపుతుంది; పరిచితమైన బైబిలు రూపకాన్నీ కాపాడుతుంది.
- source_word: ἀνέτειλεν
  choice: ఉదయించింది
  rationale: వెలుగు పైకి రావడం లేదా తెల్లవారడం అనే దృశ్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτοῖς
  choice: వారిపై
  rationale: ‘వెలుగు ఉదయించింది’ అనే తెలుగు ప్రయోగంతో సహజంగా సరిపోతూ, వెలుగు అందుకున్నవారిని స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: చీకటి–వెలుగు రూపకాల స్వభావం
  choice: చీకటి, వెలుగు అనే రూపకాలను నిర్దిష్టంగా వ్యాఖ్యానించకుండా యథాతథంగా నిలుపడం
  alternative: చీకటిని పాపం లేదా అన్యజనుల అజ్ఞానం అని, వెలుగును మెస్సీయ రక్షణ ప్రకటన అని అనువాదంలోనే స్పష్టీకరించడం
  rationale: ఈ యెషయా ప్రతిధ్వనిలో రూపకాలకు సమృద్ధమైన ధార్మిక భావం ఉన్నా, ఈ వాక్యభాగంలోని గ్రీకు వాటిని ఒకే నిర్దిష్ట అర్థానికి పరిమితం చేయదు.
- issue: ἐν χώρᾳ καὶ σκιᾷ θανάτου నిర్మాణం
  choice: ‘మరణపు నీడ కమ్మిన ప్రాంతంలో’ అని సహజ తెలుగులో సంబంధాన్ని వ్యక్తం చేయడం
  alternative: ‘మరణపు ప్రాంతంలోను నీడలోను’ అని καὶ ను రెండు వేర్వేరు స్థానాలుగా కఠినంగా చూపడం
  rationale: ఇక్కడ καὶ హెన్డియాడిస్ లేదా సన్నిహిత సంయుక్త వర్ణనలా పనిచేయవచ్చు. ఎంచుకున్న రూపం సహజంగా ఉండి ‘ప్రాంతం’ మరియు ‘మరణపు నీడ’ రెండింటినీ నిలుపుతుంది; వాటిని ఖచ్చితంగా రెండు వేర్వేరు ప్రదేశాలుగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన ప్రవచనాత్మక లయను నిలుపుతూ అనువదించబడింది. మూలంలోని ‘కూర్చున్న’ అనే పునరుక్తి మరియు చీకటి–వెలుగు సమాంతర దృశ్యం సంరక్షించబడ్డాయి.
