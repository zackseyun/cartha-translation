id: MAT.4.19
reference: Matthew 4:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: te
  text: ఆయన వారితో, “నా వెనుక రండి; నేను మిమ్మల్ని మనుషులను పట్టే జాలరులుగా చేస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకు కథనంలో ఇది చారిత్రక వర్తమాన కాలం. ఆధునిక తెలుగు కథనశైలిలో సహజంగా ఉండేందుకు భూతకాలంతో అనువదించాం; సంఘటన యొక్క అర్థం మారదు.
- source_word: Δεῦτε
  choice: రండి
  rationale: ఇది పిలుపునిచ్చే ఆజ్ఞార్థక రూపం. బహువచన గౌరవ/సంబోధనకు సహజమైన తెలుగు రూపం ‘రండి’.
- source_word: ὀπίσω μου
  choice: నా వెనుక
  rationale: ‘నా వెనుక/నా తరువాత’ అనే మూల రూపకాన్ని నిలుపుతూ, శిష్యులుగా అనుసరించాలనే భావాన్ని సందర్భం తెలియజేసేలా చేసింది.
- source_word: ποιήσω
  choice: నేను మిమ్మల్ని … చేస్తాను
  rationale: యేసు వారిని మారుస్తానని చేసే భవిష్యత్ వాగ్దానాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: ἁλιεῖς
  choice: జాలరులుగా
  rationale: చేపలు పట్టేవారిని సూచించే సహజమైన, వృత్తిసంబంధ తెలుగు పదం; రూపకాన్ని నిలుపుతుంది.
- source_word: ἀνθρώπων
  choice: మనుషులను
  rationale: ἄνθρωπος ఇక్కడ పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది. తెలుగు ‘మనుషులు’ ఈ సమగ్ర అర్థాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἁλιεῖς ἀνθρώπων అనే రూపకంలోని లింగం మరియు అర్థం
  choice: మనుషులను పట్టే జాలరులు
  alternative: మనుష్యులను సంపాదించే జాలరులు; పురుషులను పట్టే జాలరులు
  rationale: ἀνθρώπων ఇక్కడ మానవులను సాధారణంగా సూచిస్తుంది; ‘పురుషులు’ అని అనువదిస్తే గ్రీకు భావాన్ని అనవసరంగా మగవారికే పరిమితం చేస్తుంది. ‘పట్టే’ అనే పదం చేపల వేట రూపకంలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని ‘రండి’ మరియు ‘నా వెనుక’ అనే రెండు అంశాలను విడిగా నిలిపి, చేపలు పట్టే వృత్తి నుంచి మనుషుల పట్ల శిష్యసేవకు మారే రూపకాన్ని స్పష్టంగా ఉంచాం.
