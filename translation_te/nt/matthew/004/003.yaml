- from: అప్పుడు శోధించేవాడు ఆయన దగ్గరకు వచ్చి, “నీవు దేవుని కుమారుడవైతే[a], ఈ రాళ్లు రొట్టెలుగా మారాలని చెప్పు[b]” అన్నాడు.
  to: 'శోధించేవాడు ఆయన దగ్గరకు వచ్చి, ఆయనతో ఇలా అన్నాడు: “నీవు దేవుని కుమారుడవైతే[a], ఈ రాళ్లు రొట్టెలుగా[b] మారాలని చెప్పు.”'
  rationale: The revision removes an unsupported temporal adverb, explicitly retains the recipient of the speech, and moves footnote b to the word it explains. It preserves the Greek conditional ambiguity and all other lexical and theological decisions of the draft.
