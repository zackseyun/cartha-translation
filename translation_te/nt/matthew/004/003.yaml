  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: te
  text: 'శోధించేవాడు ఆయన దగ్గరకు వచ్చి, ఆయనతో ఇలా అన్నాడు: “నీవు దేవుని కుమారుడవైతే[a], ఈ రాళ్లు రొట్టెలుగా[b] మారాలని చెప్పు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీవు దేవుని కుమారుడవు కాబట్టి’ అని కూడా భావించవచ్చు. గ్రీకు షరతు ఇక్కడ సాధారణ సందేహం కంటే సవాలుగా పనిచేయవచ్చు.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో ‘రొట్టెలు’ బహువచనంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: దగ్గరకు వచ్చి
  rationale: యేసువైపు సమీపించిన కదలికను సహజమైన తెలుగులో తెలియజేస్తుంది; ప్రధాన క్రియకు ముందున్న భూతకాల కృదంతపు సంబంధాన్ని నిలుపుతుంది.
- source_word: ὁ πειράζων
  choice: శోధించేవాడు
  rationale: ఇక్కడ పరీక్షించడం మాత్రమే కాక పాపానికి ప్రలోభపెట్టే ప్రతికూల సందర్భం ఉంది. తెలుగు బైబిలు వాడుకలో ‘శోధించేవాడు’ సహజంగా ఉండి, కృదంతపు భావాన్ని కూడా నిలుపుతుంది.
- source_word: εἶπεν αὐτῷ
  choice: ఆయనతో ... అన్నాడు
  rationale: λέγωతో పరోక్ష కర్మను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: Εἰ
  choice: అయితే
  rationale: గ్రీకు షరతు రూపాన్ని నిలుపుతూ, అది సందేహమా సవాలా అన్న విషయాన్ని తీర్మానించదు.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: మత్తయి సందర్భంలో ఇది యేసును ప్రత్యేకంగా గుర్తించే బిరుదు; అనిశ్చితార్థకంగా ‘ఒక కుమారుడు’ అని అనువదించకూడదు.
- source_word: εἰπὲ ἵνα
  choice: మారాలని చెప్పు
  rationale: ఆజ్ఞారూప λέγω తరువాతి ἵνα వాక్యభాగాన్ని తెలుగులో సహజమైన ఉద్దేశ్య/విషయ నిర్మాణంతో అందిస్తుంది; మూలంలో స్పష్టంగా లేని బలమైన ‘ఆజ్ఞాపించు’ను చేర్చదు.
- source_word: οἱ λίθοι οὗτοι
  choice: ఈ రాళ్లు
  rationale: సూచక పదపు ఉద్ఘాటనను నిలుపుతుంది; λίθοςకు ఈ సందర్భంలో ‘రాళ్లు’ సహజమైన తెలుగు.
- source_word: ἄρτοι
  choice: రొట్టెలు
  rationale: గ్రీకులోని బహువచనాన్ని తెలుగులో సహజంగా నేరుగా నిలుపుతుంది.
- source_word: γένωνται
  choice: మారాలని
  rationale: γίνομαι యొక్క ‘అవడం/మారడం’ భావాన్ని సందర్భానుగుణంగా స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: Εἰ υἱὸς εἶ τοῦ θεοῦ అనే షరతు వాక్యపు భావబలం
  choice: ‘నీవు దేవుని కుమారుడవైతే’ అని షరతు రూపంలో అనువదించడం
  alternative: ‘నీవు దేవుని కుమారుడవు కాబట్టి’ లేదా ‘నీవు నిజంగా దేవుని కుమారుడవైతే’
  rationale: గ్రీకు షరతు సాధారణ సందేహాన్ని కాక సవాలును కూడా సూచించవచ్చు. ప్రధాన పాఠం ఉద్దేశాన్ని అతిగా నిర్ణయించకుండా అసలు రూపంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: υἱὸς τοῦ θεοῦ అనే క్రీస్తు సంబంధిత బిరుదు
  choice: ‘దేవుని కుమారుడు’
  alternative: ‘దేవుని ఒక కుమారుడు’
  rationale: నామవాచకానికి గ్రీకులో ఉపపదం లేకపోయినా, εἰμίతో ఉన్న విధేయ నిర్మాణం మరియు మత్తయి సందర్భం దీన్ని యేసుకు సంబంధించిన నిర్దిష్ట బిరుదుగా చూపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. యేసును సూచించడానికి ‘ఆయన’ వాడబడింది. ‘శోధించేవాడు’ సంప్రదాయ బైబిలు పదసంపదతో అనుసంధానాన్ని ఉంచినా వాక్య నిర్మాణం సహజంగా ఉంది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
