id: MAT.4.4
reference: Matthew 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: te
  text: 'అయితే ఆయన ఇలా జవాబిచ్చాడు: “ఇలా రాయబడి ఉంది: ‘మనిషి[a] రొట్టెవల్ల మాత్రమే[b] జీవించడు; దేవుని నోటి ద్వారా వెలువడే ప్రతి మాటవల్ల జీవిస్తాడు.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మనిషి” ఇక్కడ ఒక నిర్దిష్ట పురుషుణ్ని కాదు; మానవులందరినీ సాధారణంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “రొట్టెమీద మాత్రమే.” గ్రీకులోని ప్రయోగం జీవనాధారాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: జవాబిచ్చాడు
  rationale: ‘జవాబిచ్చి అన్నాడు’ అనే మూలభాషా కథన ప్రయోగంలోని భావాన్ని పునరుక్తి లేకుండా సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Γέγραπται
  choice: ఇలా రాయబడి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే పరిపూర్ణ కర్మణి రూపాన్ని, అది రాయబడి ఇప్పటికీ నిలిచి ఉందనే భావంతో అందిస్తుంది.
- source_word: ἄρτῳ μόνῳ
  choice: రొట్టెవల్ల మాత్రమే
  rationale: ἄρτος యొక్క ప్రత్యక్ష అర్థమైన ‘రొట్టె’ను నిలుపుతూ, ἐπίతో కూడిన దత్తి విభక్తి ఆధారాన్ని తెలుగులో సహజంగా ‘వల్ల’తో వ్యక్తం చేస్తుంది.
- source_word: ζήσεται
  choice: జీవించడు … జీవిస్తాడు
  rationale: గ్రీకు భవిష్యత్ రూపాన్ని తెలుగు సాధారణ సత్యోక్తికి సహజమైన వర్తమాన రూపంలో ఇచ్చింది; రెండో భాగంలో గ్రీకులో అధ్యాహారంగా ఉన్న క్రియను తెలుగులో స్పష్టతకోసం పునరుద్ధరించింది.
- source_word: ὁ ἄνθρωπος
  choice: మనిషి
  rationale: ఇది ఒక నిర్దిష్ట పురుషుణ్ని కాక మానవుని సాధారణంగా సూచించే ప్రతినిధి ఏకవచనం; ‘మనిషి’ తెలుగులో సహజంగా ఆ సామాన్య భావాన్ని మోస్తుంది.
- source_word: παντὶ ῥήματι
  choice: ప్రతి మాటవల్ల
  rationale: ῥῆμα ఇక్కడ దేవుడు పలికేదాన్ని సూచిస్తుంది; ‘ప్రతి మాట’ సాధారణ పాఠకునికి సహజంగా, సూటిగా ఉంటుంది.
- source_word: ἐκπορευομένῳ
  choice: వెలువడే
  rationale: దేవుని నోటి ద్వారా బయటకు వచ్చే పలుకును సూచించే గమన చిత్రాన్ని సహజమైన తెలుగు సంబంధకృదంతంతో నిలుపుతుంది.
- source_word: διὰ στόματος θεοῦ
  choice: దేవుని నోటి ద్వారా
  rationale: διά + షష్ఠీ యొక్క ‘ద్వారా/గుండా’ భావాన్ని నేరుగా నిలుపుతూ, దేవుని పలుకు నోటి ద్వారా వెలువడే మూలంలోని రూపకాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ὁ ἄνθρωπος అనే ప్రతినిధి పుంలింగ ఏకవచనం
  choice: మనిషి
  alternative: మానవుడు / ఒక వ్యక్తి / మానవజాతి
  rationale: వాక్యం సమస్త మానవ జీవితం గురించి సాధారణ సత్యాన్ని చెబుతుంది. ‘మనిషి’ వ్యక్తిగత ఏకవచన రూపాన్నీ, విస్తృత మానవార్థాన్నీ రెండింటినీ కాపాడుతుంది.
- issue: Γέγραπταιలో లేఖన ఉల్లేఖన సూత్రం
  choice: ఇలా రాయబడి ఉంది
  alternative: ఇలా వ్రాయబడి ఉన్నది / లేఖనంలో ఉంది
  rationale: మూలంలోని కర్మణి పరిపూర్ణ రూపాన్ని నిలుపుతుంది; ‘లేఖనంలో’ అని మూలంలో లేని నామవాచకాన్ని చేర్చదు.
- issue: διὰ στόματος θεοῦ యొక్క సంబంధం
  choice: దేవుని నోటి ద్వారా వెలువడే
  alternative: దేవుని నోటినుండి వెలువడే
  rationale: ‘నుండి’ మరింత సహజంగా అనిపించినా, SBLGNTలోని διά + షష్ఠీకి దగ్గరగా ‘ద్వారా’ను ఉంచి, దేవుని పలుకుబడి నోటి మార్గంగా వెలువడే చిత్రాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకునికి స్పష్టంగా ఉండే వాక్యనిర్మాణం. మూలంలోని ‘దేవుని నోటి ద్వారా’ అనే రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపింది.
