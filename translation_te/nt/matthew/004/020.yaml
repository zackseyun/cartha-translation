  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: te
  text: వారు వెంటనే వలలను విడిచిపెట్టి ఆయనను అనుసరించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: వారు
  rationale: δέ ఇక్కడ కథనాన్ని ముందుకు నడిపించే స్వల్ప అనుసంధానక అవ్యయం. తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని చేర్చకుండా వాక్యాన్ని ప్రారంభించడం సహజం; ‘వారు’తో కొనసాగింపు స్పష్టంగా ఉంటుంది.
- source_word: εὐθέως
  choice: వెంటనే
  rationale: వారి స్పందనలోని తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀφέντες
  choice: విడిచిపెట్టి
  rationale: అఒరిస్టు కృదంతం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది. ‘విడిచిపెట్టి’ ఆ క్రమాన్ని సహజంగా నిలుపుతుంది; ‘త్యజించి’ అనవసరంగా బలమైన భావాన్ని కలిగించవచ్చు.
- source_word: τὰ δίκτυα
  choice: వలలను
  rationale: సందర్భంలో ఇవి చేపలు పట్టే వలలు అని స్పష్టంగా ఉంది. మూలంలోని నిర్దిష్ట పదబంధాన్ని అనవసర వివరణ లేకుండా సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἠκολούθησαν αὐτῷ
  choice: ఆయనను అనుసరించారు
  rationale: ఇది ఆయన వెనుక వెళ్లడమనే భౌతిక చర్యతోపాటు శిష్యత్వ సంబంధాన్ని కూడా సూచించగలదు. ‘అనుసరించారు’ ఈ రెండు భావస్థరాలను నిలుపుతుంది.
theological_decisions:
- issue: ἠκολούθησαν αὐτῷ లోని శిష్యత్వ భావం
  choice: ఆయనను అనుసరించారు
  alternative: ఆయన వెంట వెళ్లారు
  rationale: ‘అనుసరించారు’ కథనంలోని భౌతికంగా వెంబడించే భావాన్నీ, సువార్త సందర్భంలోని శిష్యత్వ భావాన్నీ ఒకదానికే పరిమితం చేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన బైబిలు కథన శైలిని నిలుపుతూ అనువదించబడింది.
