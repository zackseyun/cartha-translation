source:
  edition: SBLGNT
  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: te
  text: వారు వెంటనే[a] పడవను, తమ తండ్రిని విడిచిపెట్టి ఆయనను అనుసరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తక్షణమే.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: వారు
  rationale: δέ ఇక్కడ కథనాన్ని ముందుకు నడిపించే స్వల్ప అనుసంధానక పదం. తెలుగులో ప్రత్యేకంగా ‘మరియు’ అని చేర్చకుండా వాక్యాన్ని ‘వారు’తో ప్రారంభించడం సహజంగా ఉండి, అనవసరమైన వ్యతిరేక భావాన్ని కలిగించదు.
- source_word: εὐθέως
  choice: వెంటనే
  rationale: ఈ పదం ఆలస్యం లేని తక్షణ స్పందనను సూచిస్తుంది. ‘వెంటనే’ ఆధునిక తెలుగులో సహజంగా ఉండి కథనంలోని అత్యవసరతను నిలుపుతుంది.
- source_word: ἀφέντες
  choice: విడిచిపెట్టి
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది. ‘విడిచిపెట్టి’ వారు మొదట పడవను, తండ్రిని వదలి, ఆపై అనుసరించారనే క్రమాన్ని సహజంగా వ్యక్తం చేస్తుంది; శాశ్వత పరిత్యాగాన్ని అతిగా సూచించదు.
- source_word: τὸ πλοῖον
  choice: పడవను
  rationale: చేపలు పట్టే సందర్భంలో πλοῖονకు ‘పడవ’ సాధారణమైన, సందర్భోచితమైన తెలుగు పదం.
- source_word: τὸν πατέρα αὐτῶν
  choice: తమ తండ్రిని
  rationale: కర్తలైన సోదరులతో సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా చూపేందుకు ‘తమ తండ్రిని’ ఎంచుకున్నాం.
- source_word: ἠκολούθησαν αὐτῷ
  choice: ఆయనను అనుసరించారు
  rationale: ἀκολουθέω ఇక్కడ భౌతికంగా వెంట వెళ్లడం, శిష్యులుగా అనుసరించడం అనే రెండు ఛాయలనూ కలిగి ఉంది. ‘అనుసరించారు’ ఈ రెండింటినీ నిలుపుతుంది; యేసును సూచించేందుకు గౌరవప్రదమైన ‘ఆయనను’ వాడాం.
- source_word: οἱ
  choice: వారు
  rationale: ఈ ఆర్టికల్ ముందుగా ప్రస్తావించిన ఇద్దరు సోదరులను సూచిస్తూ నామవాచకంగా పనిచేస్తుంది. తెలుగులో ‘వారు’ సహజమైన స్పష్టీకరణ.
theological_decisions:
- issue: శిష్యత్వ స్పందన మరియు కుటుంబం నుండి విడిపోవడం
  choice: వారు వెంటనే పడవను, తమ తండ్రిని విడిచిపెట్టి యేసును అనుసరించిన నిర్ణయాత్మక చర్యగా అనువదించాం.
  alternative: వారు తమ తండ్రిని శాశ్వతంగా పరిత్యజించారు; లేదా కేవలం కొద్దిసేపు పక్కకు వెళ్లారు.
  rationale: మూలపాఠం తక్షణమైన, నిర్ణయాత్మక స్పందనను నొక్కిచెబుతుంది. అయితే ἀφέντες అనే పదం శాశ్వత పరిత్యాగాన్ని తప్పనిసరిగా నిర్ధారించదు. అందువల్ల అతిశయార్థం చేర్చకుండా ‘విడిచిపెట్టి’ అని అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. గ్రీకు కృదంత నిర్మాణంలోని చర్యల క్రమాన్ని ‘విడిచిపెట్టి … అనుసరించారు’ ద్వారా నిలిపి, వాక్యాన్ని సాధారణ పాఠకులకు సులభంగా ఉంచాం.
