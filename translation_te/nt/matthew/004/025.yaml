id: MAT.4.25
reference: Matthew 4:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: te
  text: గలిలయ, దెకపొలి, యెరూషలేము, యూదయ, యొర్దాను అవతల నుండి పెద్ద జనసమూహాలు ఆయనను అనుసరించాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యొర్దాను నదికి ఆవలి వైపు నుండి.”
    reason: పేరాన్ తూ ఇయోర్దానూ అనే పదబంధంలోని ప్రత్యామ్నాయ స్థలవ్యక్తీకరణను చూపుతుంది.
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: అనుసరించాయి
  rationale: ἀκολουθέω యొక్క కథన సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; భౌతికంగా వెంబడించడాన్ని సూచిస్తూనే, శిష్యత్వ నిబద్ధతను అతిగా నిర్ధారించదు.
- source_word: ὄχλοι πολλοὶ
  choice: గొప్ప జనసమూహాలు
  rationale: అనేక ప్రాంతాల నుంచి వచ్చిన పెద్ద సంఖ్యలోని జనసమూహాలను సహజంగా తెలియజేస్తుంది.
- source_word: ἀπὸ
  choice: నుండీ
  rationale: జనసమూహాలు వచ్చిన మూల ప్రాంతాలను సూచించే ప్రామాణిక తెలుగు రూపం; జాబితా అంతటినీ నియంత్రించే గ్రీకు విభక్తి సంబంధాన్ని తెలుగులో స్పష్టంగా చేసింది.
- source_word: Γαλιλαίας
  choice: గలిలయ
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన ప్రాంతనామం.
- source_word: Δεκαπόλεως
  choice: దెకపొలి
  rationale: పది పట్టణాల ప్రాంతాన్ని సూచించే చారిత్రక నామానికి తెలుగు లిప్యంతరీకరణ.
- source_word: Ἱεροσολύμων
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో సుపరిచితమైన నగరనామం.
- source_word: Ἰουδαίας
  choice: యూదయ ప్రాంతాలు
  rationale: భౌగోళిక ప్రాంతమని పాఠకునికి స్పష్టమయ్యేలా ‘ప్రాంతాలు’ అనే పదాన్ని జాబితాలో భాగస్వామ్యంగా వాడింది.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: యొర్దాను అవతలి ప్రాంతం నుండీ
  rationale: యొర్దాను నదికి అవతల ఉన్న ప్రాంతాన్ని సూచించే స్థలార్థాన్ని సహజంగా నిలుపుతుంది; దృష్టికోణంపై ఆధారపడే ‘అవతలి’ భావాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: καὶ ... καὶ ... καὶ
  choice: కామాలతో కూడిన జాబితా, చివరి అంశానికి ‘నుండీ’
  rationale: తెలుగులో వరుసగా ‘మరియు’ అనడం కృత్రిమంగా ఉండేందున సహజ జాబితా నిర్మాణాన్ని వాడి, ప్రాంతాల సమగ్ర విస్తృతిని నిలిపింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. స్థలనామాలకు తెలుగు బైబిలు సంప్రదాయంలో సుపరిచిత రూపాలు వాడబడ్డాయి; ‘దెకపొలి’ వంటి తక్కువ పరిచయమైన చారిత్రక నామాన్ని అనువదించకుండా లిప్యంతరీకరించాం.
