revisions:
- from: గలిలయ, దెకపొలి, యెరూషలేము, యూదయ ప్రాంతాల నుండీ, యొర్దాను అవతలి ప్రాంతం నుండీ[a] గొప్ప జనసమూహాలు ఆయనను అనుసరించాయి.
  to: గలిలయ, దెకపొలి, యెరూషలేము, యూదయ, యొర్దాను అవతల నుండి పెద్ద జనసమూహాలు ఆయనను అనుసరించాయి.[a]
  rationale: The revision removes the unsupported plural expansion “ప్రాంతాలు,” uses a more idiomatic expression for large crowds, and renders the final geographic phrase directly while preserving the English audit trail’s noted alternative. The source’s single ἀπό governing the whole list is naturally represented by placing “నుండి” with the final item in the Telugu list.
