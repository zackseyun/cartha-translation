source:
  edition: SBLGNT
  text: καὶ ⸀εἶπεν αὐτῷ· Ταῦτά ⸂σοι πάντα⸃ δώσω, ἐὰν πεσὼν προσκυνήσῃς μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: te
  text: అప్పుడు అతడు ఆయనతో, “నువ్వు సాష్టాంగపడి నాకు ఆరాధన చేస్తే[a], వీటన్నిటినీ నీకు ఇస్తాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నాకు సాష్టాంగ నమస్కారం చేస్తే,” లేదా “నాకు వంగి నమస్కరిస్తే.” గ్రీకు క్రియ సాష్టాంగ నమస్కారాన్ని లేదా గౌరవప్రణామాన్ని సూచించగలదు; అయితే ఇక్కడి సందర్భం “ఆరాధన” భావానికే ఎక్కువగా అనుకూలిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: కథన ప్రవాహంలో ఈ సంధి తదుపరి మాటను పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఉంది, అయితే గ్రీకులోని సాధారణ అనుసంధాన భావాన్ని మించిపోయే బలమైన కాలసూచనను జోడించదు.
- source_word: εἶπεν αὐτῷ
  choice: అతడు ఆయనతో … అన్నాడు
  rationale: మూలంలో సర్వనామాలే ఉన్నాయి. తెలుగు గౌరవప్రయోగాన్ని అనుసరించి యేసును సూచించే αὐτῷకు ‘ఆయనతో’, మాట్లాడుతున్న శోధకునికి ‘అతడు’ వాడి, పేర్లను చేర్చలేదు.
- source_word: Ταῦτά … πάντα
  choice: వీటన్నిటినీ
  rationale: నపుంసక బహువచన నిర్దేశకంతో కూడిన సమగ్రతను సహజమైన తెలుగు సమాసరూపంలో నిలిపింది; ఇది ముందటి వచనంలోని రాజ్యాలనూ వాటి వైభవాన్నీ సూచిస్తుంది.
- source_word: σοι … δώσω
  choice: నీకు ఇస్తాను
  rationale: దత్తివ విభక్తి మరియు భవిష్యత్ క్రియను తెలుగులో నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐὰν
  choice: చేస్తే
  rationale: షరతును తెలుగులో సహజమైన క్రియాంత రూపంతో తెలియజేస్తుంది.
- source_word: πεσὼν
  choice: సాష్టాంగపడి
  rationale: కిందపడుతూ నమస్కరించే స్పష్టమైన శారీరక చర్యను సంక్షిప్తంగా తెలియజేస్తుంది. ‘పడిపోయి’ అనేది ప్రమాదవశాత్తు పడిన భావాన్ని కలిగించవచ్చు; ఇక్కడ ఉద్దేశపూర్వకంగా నేలవంగే భావం అవసరం.
- source_word: προσκυνήσῃς μοι
  choice: నాకు ఆరాధన చేస్తే
  rationale: తదుపరి వచనంలో దేవునికే ఆరాధన చేయాలనే ప్రత్యుత్తరం ఉన్నందున, ఈ సందర్భంలో మతపరమైన గంభీరతను ‘ఆరాధన’ సరిగ్గా అందిస్తుంది; క్రియకు ఉన్న విస్తృత నమస్కార/గౌరవార్థ పరిధిని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: శోధకుడు యేసును కోరిన προσκυνέω చర్యను ఎలా అనువదించాలి
  choice: నాకు ఆరాధన చేస్తే
  alternative: నాకు సాష్టాంగ నమస్కారం చేస్తే; నాకు విధేయతతో వంగి నమస్కరిస్తే
  rationale: ఈ శోధన సందర్భం మరియు వెంటనే వచ్చే దేవునికే ఆరాధన చేయాలనే సమాధానం మతపరమైన ఆరాధన భావాన్ని ముందుకు తెస్తాయి. అయినా గ్రీకు క్రియ కేవలం సాష్టాంగ నమస్కారం లేదా గౌరవప్రణామాన్ని కూడా సూచించగలదనే నిజమైన పదార్థ విస్తృతిని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: 'ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. యేసుకు ‘ఆయన/నువ్వు’ రూపాలు వాడబడ్డాయి: కథకుని సూచనలో గౌరవం నిలిచి, ప్రత్యక్ష సంభాషణలో సహజమైన ఏకవచన సంబోధన ఉంది. ‘సాష్టాంగపడి’ శారీరక చర్యను స్పష్టపరుస్తుంది; ‘ఆరాధన’ సందర్భంలోని మతపరమైన బరువును నిలుపుతుంది.'
