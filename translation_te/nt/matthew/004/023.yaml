id: MAT.4.23
reference: Matthew 4:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: te
  text: ఆయన గలిలయ అంతటా తిరుగుతూ, వారి సమాజమందిరాల్లో బోధిస్తూ, రాజ్య సువార్తను[a] ప్రకటిస్తూ, ప్రజల మధ్య ప్రతి వ్యాధినీ ప్రతి అనారోగ్యాన్నీ స్వస్థపరుస్తూ ఉండేవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాజ్యపు శుభవార్తను.’
    reason: ‘సువార్త’కు పారదర్శకమైన పదప్రయోగ ప్రత్యామ్నాయం; τῆς βασιλείαςలోని సంబంధాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
lexical_decisions:
- source_word: περιῆγεν
  choice: అంతటా తిరుగుతూ
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే నిరంతర సంచారాన్ని, ప్రాంతమంతటా తిరిగిన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: గలిలయ అంతటా
  rationale: చలన క్రియతో కలిసిన ఈ పదబంధం గలిలయ ప్రాంతమంతటినీ సూచిస్తుంది; ‘అంతటా’ ఆ విస్తృతిని సహజంగా తెలియజేస్తుంది.
- source_word: διδάσκων
  choice: బోధిస్తూ
  rationale: ప్రధాన క్రియతో ఏకకాలంలో సాగిన కార్యాన్ని తెలుగు అసమాపక క్రియ సహజంగా చూపుతుంది.
- source_word: συναγωγαῖς αὐτῶν
  choice: వారి సమాజమందిరాల్లో
  rationale: యూదుల కూడిక స్థలాలు లేదా ఆరాధనా భవనాలను సూచించే συναγωγήకు తెలుగులో స్థిరపడిన, అర్థవంతమైన పదం; αὐτῶνలోని స్వామ్య భావాన్ని ‘వారి’ నిలుపుతుంది.
- source_word: κηρύσσων
  choice: ప్రకటిస్తూ
  rationale: బహిరంగంగా అధికారపూర్వకంగా తెలియజేయడం అనే κηρύσσω భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: రాజ్య సువార్తను
  rationale: εὐαγγέλιον యొక్క శుభవార్త భావాన్ని వాడుకలో ఉన్న ‘సువార్త’తో అందిస్తూ, τῆς βασιλείαςలోని సంబంధాన్ని సంక్షిప్తంగా, దాని విస్తృత అర్థాన్ని అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: θεραπεύων
  choice: స్వస్థపరిచాడు
  rationale: ఇక్కడ θεραπεύω నిజమైన స్వస్థత కలిగించడాన్ని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో సమాంతర అసమాపక క్రియల శ్రేణికి ముగింపుగా సమాపక క్రియ సహజంగా ఉంటుంది.
- source_word: πᾶσαν νόσον
  choice: ప్రతి వ్యాధినీ
  rationale: νόσοςకు ‘వ్యాధి’ సరైన సాధారణ వైద్యార్థాన్ని ఇస్తూ, తరువాతి μαλακίαతో భేదాన్ని ఉంచుతుంది.
- source_word: πᾶσαν μαλακίαν
  choice: ప్రతి అనారోగ్యాన్నీ
  rationale: μαλακία ఇక్కడ బలహీనత, అస్వస్థత లేదా అనారోగ్యాన్ని సూచించగలదు. ‘అనారోగ్యం’ సందర్భానికి సహజంగా ఉండి, ‘వ్యాధి’తో కలిసి సమగ్రతను తెలియజేస్తుంది.
- source_word: ἐν τῷ λαῷ
  choice: ప్రజల్లోని
  rationale: స్వస్థపరచబడిన వ్యాధులు ప్రజల మధ్య ఉన్నాయని సహజమైన తెలుగులో తెలియజేస్తుంది; ఈ సందర్భంలో λαόςకు అనవసరమైన సాంకేతిక ధార్మిక భావాన్ని జోడించదు.
theological_decisions:
- issue: εὐαγγέλιον τῆς βασιλείας పదబంధం
  choice: రాజ్య సువార్తను
  alternative: రాజ్యానికి సంబంధించిన శుభవార్తను
  rationale: ‘రాజ్య సువార్త’ మూలంలోని సంక్షిప్త సంబంధాన్ని నిలుపుతుంది; ఆ వార్త రాజ్యానికి సంబంధించినదా, రాజ్య స్వభావం గలదా అనే జనిటివ్ విస్తృతిని అనవసరంగా కుదించదు. మరింత వివరణాత్మక రూపాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: πᾶσαν νόσον καὶ πᾶσαν μαλακίανలో స్వస్థపరచడం యొక్క పరిధి
  choice: ప్రతి వ్యాధినీ ప్రతి అనారోగ్యాన్నీ
  alternative: అన్ని రకాల వ్యాధులనూ అనారోగ్యాలనూ
  rationale: రెండుసార్లు వచ్చిన πᾶσανను ‘ప్రతి’ అని రెండుసార్లు నిలిపి మూలంలోని ఉద్ఘాటిత సమగ్రతను కాపాడుతుంది; వచనం చెప్పేదానికంటే ఎక్కువ సిద్ధాంతపరమైన నిర్ధారణను జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘సమాజమందిరం,’ ‘సువార్త,’ ‘స్వస్థపరచడం’ వంటి పరిచిత బైబిలు పదాలను ఉంచినా, వాక్య నిర్మాణం సహజమైన ఆధునిక తెలుగులో ఉంది. పాదటిప్పణి గుర్తు అది వివరిస్తున్న ‘రాజ్య సువార్తను’ అన్న పదబంధం వెంట ఉంచబడింది.
