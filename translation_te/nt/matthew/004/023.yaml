    text: లేదా, ‘రాజ్యపు శుభవార్తను.’
    reason: ‘సువార్త’కు పారదర్శకమైన పదప్రయోగ ప్రత్యామ్నాయం; τῆς βασιλείαςలోని సంబంధాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
  revision_rationale: The revision changes only the verbal aspect necessary to reflect the Greek imperfect and contemporaneous participles, and it refines the footnote to preserve the source genitive’s breadth. All principal lexical choices and the emphatic repeated “ప్రతి” are retained.
