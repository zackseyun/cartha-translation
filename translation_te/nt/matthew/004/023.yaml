revisions:
- from: ఆయన గలిలయ అంతటా తిరుగుతూ, వారి సమాజమందిరాల్లో బోధిస్తూ, రాజ్య సువార్తను[a] ప్రకటిస్తూ, ప్రజల్లోని ప్రతి వ్యాధినీ ప్రతి అనారోగ్యాన్నీ స్వస్థపరిచాడు.
