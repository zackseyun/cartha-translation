id: MAT.4.8
reference: Matthew 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: te
  text: మళ్లీ అపవాది ఆయనను చాలా ఎత్తైన ఒక కొండపైకి తీసుకెళ్లి, లోకంలోని రాజ్యాలన్నిటినీ, వాటి మహిమను[a] ఆయనకు చూపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటి వైభవాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: మళ్లీ
  rationale: శోధనల క్రమంలో చర్య పునరావృతమవుతున్నదని సహజంగా, సంక్షిప్తంగా సూచిస్తుంది.
- source_word: παραλαμβάνει
  choice: తీసుకెళ్లి
  rationale: తోడుగా తీసుకొని ఒక ప్రదేశానికి నడిపించే భావాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో తెలియజేస్తుంది. గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు కథన శైలికి తగిన భూతకాలంలో ఇచ్చాం.
- source_word: ὁ διάβολος
  choice: అపవాది
  rationale: διάβολος అనే గుర్తింపును సూచించే బైబిలు పదాన్ని నిలుపుతూ, ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యే ప్రామాణిక రూపాన్ని ఉపయోగిస్తుంది.
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: చాలా ఎత్తైన ఒక కొండపైకి
  rationale: గమనదిశను, λίαν ఇచ్చే తీవ్రతను సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: δείκνυσιν
  choice: చూపించాడు
  rationale: మూలంలోని సాధారణ చూపించే క్రియను అదనపు తీవ్రత చేర్చకుండా తెలియజేస్తుంది.
- source_word: πάσας τὰς βασιλείας
  choice: రాజ్యాలన్నిటినీ
  rationale: πᾶς‌తో కూడిన బహువచన సంపూర్ణతను, βασιλεία యొక్క రాజకీయ-రాజరిక భావాన్ని కాపాడుతుంది.
- source_word: τοῦ κόσμου
  choice: లోకంలోని
  rationale: κόσμος‌ను ఈ సందర్భంలో ప్రపంచమంతటినీ సూచించే సహజమైన తెలుగు పదంతో అందిస్తుంది.
- source_word: τὴν δόξαν αὐτῶν
  choice: వాటి మహిమను
  rationale: δόξα యొక్క ప్రధాన పదసంబంధాన్ని నిలుపుతుంది; ఈ సందర్భంలో కనిపించే వైభవం అనే భావాన్ని పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తుంది.
theological_decisions:
- issue: శోధన కథనంలోని కొండ దృశ్యం స్వభావం
  choice: అపవాది యేసును చాలా ఎత్తైన కొండపైకి తీసుకెళ్లి రాజ్యాలన్నిటినీ చూపించినట్లు కథనం చెప్పిన విధంగానే అనువదించడం.
  alternative: దీనిని కేవలం భౌగోళిక దృశ్యంగా లేదా దర్శనాత్మకమైన/అతీంద్రియ ప్రకటనగా స్పష్టీకరించడం.
  rationale: గ్రీకు వాక్యం ఆ చూపింపు ఎలా సాధ్యమైందో వివరించదు. కాబట్టి అనువాదం ఒక నిర్దిష్ట వివరణను చేర్చకుండా మూలంలోని ఉద్దేశపూర్వక అనిర్ణీతతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు చారిత్రక వర్తమాన క్రియలను తెలుగు కథనానికి సహజమైన భూతకాల రూపాల్లో అందించాం; వాక్య ప్రవాహం కోసం సముచ్చయ క్రియారూపాన్ని ఉపయోగించాం.
