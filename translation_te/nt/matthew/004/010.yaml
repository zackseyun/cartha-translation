id: MAT.4.10
reference: Matthew 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: te
  text: 'అప్పుడు యేసు అతనితో ఇలా అన్నాడు: “సాతానా, వెళ్లిపో! ఎందుకంటే, ‘నీ దేవుడైన ప్రభువును ఆరాధించాలి[a]; ఆయనను మాత్రమే సేవించాలి[b]’ అని రాసి ఉంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీ దేవుడైన ప్రభువుకు సాష్టాంగపడి నమస్కరించాలి.” గ్రీకు క్రియ భక్తితో వంగడం లేదా సాష్టాంగపడడం అనే అర్థాన్ని మరింత అక్షరార్థంగా సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “సేవించాలి” అని అనువదించిన క్రియ దేవునికి అర్పించే పవిత్రమైన లేదా ఆరాధనాపరమైన సేవను ప్రత్యేకంగా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథన క్రమంలో తదుపరి ఘట్టాన్ని సహజంగా సూచిస్తుంది.
- source_word: λέγει
  choice: ఇలా అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగులో సహజమైన భూతకాల కథనశైలిలో అందిస్తుంది; ‘ఇలా’ ప్రత్యక్ష వాక్యాన్ని సులభంగా పరిచయం చేస్తుంది.
- source_word: Ὕπαγε
  choice: వెళ్లిపో
  rationale: దూరంగా వెళ్లమనే బలమైన ఆజ్ఞను ఆధునిక, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Σατανᾶ
  choice: సాతానా
  rationale: సంబోధన విభక్తిని తెలుగులో సహజంగా చూపిస్తూ ప్రామాణిక నామరూపాన్ని నిలుపుతుంది.
- source_word: γέγραπται
  choice: రాసి ఉంది
  rationale: లేఖన ఉద్ధరణను పరిచయం చేసే గ్రీకు సంపూర్ణ కర్మణి సూత్రాన్ని సహజంగా, దాని కొనసాగుతున్న అధికార భావంతో అందిస్తుంది.
- source_word: Κύριον τὸν θεόν σου
  choice: నీ దేవుడైన ప్రభువును
  rationale: ‘ప్రభువు’ మరియు ‘నీ దేవుడు’ ఒకే వ్యక్తిని సూచించే సమానాధికార సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: προσκυνήσεις
  choice: ఆరాధించాలి
  rationale: దేవునికి ఉద్దేశించిన సందర్భంలో భక్తిపూర్వక నమస్కారం/సాష్టాంగపడటం అనే మూలచిత్రంతో కూడిన ఆరాధన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: αὐτῷ μόνῳ
  choice: ఆయనను మాత్రమే
  rationale: సేవ పొందవలసిన వ్యక్తి దేవుడు మాత్రమే అనే ప్రత్యేకతను స్పష్టంగా నిలుపుతుంది.
- source_word: λατρεύσεις
  choice: సేవించాలి
  rationale: προσκυνήσειςతో భేదాన్ని నిలుపుతూ దేవునికి అర్పించే భక్తి లేదా ఆరాధనా సేవ భావాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: προσκυνέω మరియు λατρεύω అనే రెండు క్రియల మధ్య భేదం
  choice: మొదటిదాన్ని ‘ఆరాధించాలి,’ రెండవదాన్ని ‘సేవించాలి’ అని వేర్వేరుగా అనువదించడం
  alternative: మొదటిదాన్ని ‘సాష్టాంగపడి నమస్కరించాలి’ అని, లేదా రెండింటినీ ఆరాధన పదజాలంతో అనువదించడం
  rationale: మూలంలో సంబంధితమైనప్పటికీ వేర్వేరు రెండు క్రియలు ఉన్నాయి. వాటి భేదాన్ని నిలపడం ద్వారా దేవునికే భక్తిపూర్వక ఆరాధనతో పాటు అంకిత సేవ కూడా చెందాలనే వాక్యబలాన్ని సమతుల్యంగా కాపాడుతుంది.
- issue: μόνῳ సూచించే ప్రత్యేకత
  choice: ‘ఆయనను మాత్రమే సేవించాలి’
  alternative: ‘ఆయనకే సేవ చేయాలి’
  rationale: రెండూ సాధ్యమే; ఎంచుకున్న రూపం ‘మాత్రమే’ దేవునినే ప్రత్యేకంగా నిర్దేశిస్తుందని స్పష్టంగా చూపిస్తుంది, ఇతరులందరినీ మినహాయించే భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. లేఖన ఉద్ధరణకు తగిన గంభీరతను ఉంచుతూ పాతకాలపు లేదా అతిగా సంస్కృతీకృత పదజాలాన్ని నివారించాం. ‘అన్నాడు’ తెలుగు కథనంలో సహజత్వం కోసం వాడబడింది; గ్రీకు చారిత్రక వర్తమానం అర్థపరంగా మార్చబడలేదు.
