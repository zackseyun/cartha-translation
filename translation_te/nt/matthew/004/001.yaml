id: MAT.4.1
reference: Matthew 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: te
  text: అప్పుడు యేసు అపవాది చేత ప్రలోభపెట్టబడటానికి[a] ఆత్మ చేత అరణ్యంలోకి నడిపించబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరీక్షించబడటానికి”; గ్రీకు క్రియకు “ప్రలోభపెట్టు,” “పరీక్షించు” అనే రెండు అర్థాలూ ఉండవచ్చు. అయితే ఇక్కడి తక్షణ సందర్భం “ప్రలోభపెట్టబడటానికి” అనే అర్థానికే ఎక్కువగా అనుకూలిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: తరువాతి సంఘటనను క్రమంలో పరిచయం చేసే సహజమైన ఆధునిక తెలుగు కాలసూచకం.
- source_word: ἀνήχθη
  choice: నడిపించబడ్డాడు
  rationale: గ్రీకు క్రియలోని కర్మణి రూపాన్ని, ఆత్మ యేసును నడిపించిన భావాన్ని కాపాడుతుంది. ‘పైకి’ అనే దిశార్థాన్ని తెలుగులో చేర్చడం ఈ సందర్భంలో అసహజంగా ఉండి, భౌగోళిక వివరాన్ని అతిగా నిర్దిష్టం చేయవచ్చు.
- source_word: εἰς τὴν ἔρημον
  choice: అరణ్యంలోకి
  rationale: ἔρημος సూచించే జనావాసం లేని నిర్జన ప్రాంతాన్ని సహజంగా, భూభాగ స్వరూపాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: ఆత్మ చేత
  rationale: ముందటి బాప్తిస్మ సందర్భంలోని దేవుని ఆత్మను సూచిస్తుంది; మూలంలో లేని ‘పరిశుద్ధ’ అనే విశేషణాన్ని జోడించకుండా నిర్దిష్ట భావాన్ని నిలుపుతుంది.
- source_word: πειρασθῆναι
  choice: ప్రలోభపెట్టబడటానికి
  rationale: అపవాది కర్తగా ఉండటం, తరువాతి కథనంలో చెడువైపు ఆకర్షించే ప్రయత్నాలు ఉండటం వల్ల ఈ సందర్భంలో ‘ప్రలోభపెట్టడం’ ప్రధాన భావం. ‘పరీక్షించడం’ అనే విస్తృత అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: అపవాది చేత
  rationale: διάβολος ఇక్కడ వ్యక్తిగత విరోధికి వాడిన బిరుదు; ‘అపవాది’ తెలుగు బైబిలు శైలిలో స్థిరమైనదిగా ఉండి, దూషకుడు/నిందకుడు అనే పదార్థంతోనూ సంబంధాన్ని ఉంచుతుంది.
theological_decisions:
- issue: τοῦ πνεύματος ఎవరిని సూచిస్తుంది
  choice: దేవుని ఆత్మను సూచించే ‘ఆత్మ’
  alternative: ఒక ఆత్మ; యేసు మానవాత్మ
  rationale: వెంటనే ముందున్న బాప్తిస్మ కథనంలో యేసు మీదికి దిగిన ఆత్మే ఇక్కడ సహజమైన పూర్వసూచన. అయితే మూలపాఠంలో లేని ‘పరిశుద్ధ’ అనే పదాన్ని ప్రధాన వాక్యంలో చేర్చలేదు.
- issue: πειρασθῆναι యొక్క ప్రలోభం/పరీక్ష అర్థాలు
  choice: ప్రలోభపెట్టబడటానికి
  alternative: పరీక్షించబడటానికి
  rationale: అపవాది అనే కర్త మరియు తరువాతి సంఘటనలు ప్రలోభం అనే సందర్భార్థానికి ప్రాధాన్యం ఇస్తాయి; అయినా గ్రీకు క్రియలోని పరీక్ష భావాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘అరణ్యం,’ ‘ఆత్మ,’ ‘అపవాది’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచుతూ వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం.
