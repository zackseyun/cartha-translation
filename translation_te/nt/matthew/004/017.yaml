revisions:
- from: అప్పటి నుంచి యేసు ప్రకటిస్తూ, “పశ్చాత్తాపపడండి; పరలోక రాజ్యం సమీపించింది[a]” అని చెప్పడం మొదలుపెట్టాడు.
  to: 'అప్పటి నుంచి యేసు ఇలా ప్రకటించడం మొదలుపెట్టాడు: “పశ్చాత్తాపపడండి; పరలోక రాజ్యం సమీపానికి వచ్చింది[a].”'
  rationale: The revision uses a natural Telugu quotation-introducing construction to convey Jesus’ beginning proclamation and its stated content, without artificially duplicating Greek infinitival syntax. It also makes the completed-and-continuing force of ἤγγικεν clearer. The footnote is retained and adjusted so its alternatives correspond cleanly to the revised rendering.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:29:49Z'
review_pass:
  verdict: revise
  source_fidelity: The temporal transition and imperative are conveyed accurately. However, “ప్రకటిస్తూ … అని చెప్పడం మొదలుపెట్టాడు” makes proclaiming an accompanying action to beginning to speak, rather than naturally representing Jesus’ beginning public proclamation with the quoted words as its content. Rendering ἤγγικεν as “సమీపానికి వచ్చింది” more clearly conveys arrival into nearness while allowing its present relevance.
  naturalness: The draft is generally clear, but the paired verbal construction is somewhat heavy and syntactically misaligned. “ఇలా ప్రకటించడం మొదలుపెట్టాడు:” is idiomatic modern standard Telugu and introduces the proclamation naturally.
  terminology: “పశ్చాత్తాపపడండి” and “పరలోక రాజ్యం” are established, understandable, and suitably weighty equivalents. They preserve Matthew’s characteristic expression without forcing a sectarian interpretation.
  issues:
  - severity: medium
    issue: The construction for κηρύσσειν καὶ λέγειν is syntactically skewed.
    rationale: “ప్రకటిస్తూ … అని చెప్పడం మొదలుపెట్టాడు” chiefly says that he began speaking while proclaiming. The Greek presents the commencement of proclamation and speech; in this quotation context Telugu can represent the second verb by “ఇలా” plus a direct quotation while retaining proclamation as the action begun.
  - severity: low
    issue: “సమీపించింది” can be read simply as an approach event.
    rationale: “సమీపానికి వచ్చింది” more explicitly expresses the perfect’s sense that the kingdom has come into nearness, without claiming more than the Greek states.
  revised_text: 'అప్పటి నుంచి యేసు ఇలా ప్రకటించడం మొదలుపెట్టాడు: “పశ్చాత్తాపపడండి; పరలోక రాజ్యం సమీపానికి వచ్చింది[a].”'
