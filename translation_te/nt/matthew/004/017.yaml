id: MAT.4.17
reference: Matthew 4:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: te
  text: 'అప్పటి నుంచి యేసు ఇలా ప్రకటించడం మొదలుపెట్టాడు: “పశ్చాత్తాపపడండి; పరలోక రాజ్యం సమీపానికి వచ్చింది[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దగ్గరికి వచ్చింది,” “సమీపంలో ఉంది.” గ్రీకు పర్ఫెక్ట్ క్రియ రాజ్యం దగ్గరికి వచ్చిందనీ, ఆ సమీపత్వం కొనసాగుతోందనీ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: అప్పటి నుంచి
  rationale: కథనంలో ఒక ముఖ్యమైన మలుపును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది; ఆ సమయం నుంచి కొనసాగిన కార్యాన్ని కూడా తెలియజేస్తుంది.
- source_word: ἤρξατο
  choice: మొదలుపెట్టాడు
  rationale: పూరక క్రియలతో వచ్చిన ἄρχομαι యొక్క సాధారణ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: κηρύσσειν καὶ λέγειν
  choice: ప్రకటిస్తూ … అని చెప్పడం
  rationale: రెండు గ్రీకు క్రియల భావాన్ని నిలుపుతూ, రెండవది ప్రకటనలోని మాటలను పరిచయం చేస్తున్న సంబంధాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో చూపిస్తుంది.
- source_word: Μετανοεῖτε
  choice: పశ్చాత్తాపపడండి
  rationale: కేవలం అభిప్రాయాన్ని మార్చుకోవడం కాకుండా, మనస్సు మరియు జీవితం దేవుని వైపు తిరగాలనే ఆజ్ఞ యొక్క నైతిక, ఆధ్యాత్మిక బరువును మోసే స్థిరమైన తెలుగు పదం.
- source_word: ἤγγικεν
  choice: సమీపించింది
  rationale: గ్రీకు పర్ఫెక్ట్ క్రియలోని—దగ్గరకు వచ్చి ఇప్పుడు సమీపంలో ఉన్న—భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: βασιλεία
  choice: రాజ్యం
  rationale: రాజ్యపాలన లేదా రాజ్యపరిధి రెండింటికీ అవకాశం ఉంచే, పరిచితమైన మరియు సందర్భోచితమైన తెలుగు సమానార్థకం.
- source_word: τῶν οὐρανῶν
  choice: పరలోక
  rationale: గ్రీకులో బహువచనం ఉన్నప్పటికీ, మత్తయి వాడే ప్రత్యేకమైన భావవ్యక్తీకరణను సహజమైన తెలుగు బైబిల్ భాషలో అందిస్తుంది.
theological_decisions:
- issue: βασιλεία τῶν οὐρανῶν యొక్క అనువాదం
  choice: పరలోక రాజ్యం
  alternative: ఆకాశాల రాజ్యం; పరలోకపు పరిపాలన
  rationale: మత్తయి ప్రత్యేకంగా వాడే వ్యక్తీకరణను గుర్తించదగిన సహజ తెలుగులో నిలుపుతుంది; దానిని కేవలం స్థలంగా గానీ, కేవలం అమూర్త పరిపాలనగా గానీ పరిమితం చేయదు.
- issue: Μετανοεῖτε యొక్క ఆజ్ఞార్థక బలం
  choice: పశ్చాత్తాపపడండి
  alternative: మనస్సు మార్చుకోండి; తిరిగి రండి
  rationale: బౌద్ధిక అభిప్రాయ మార్పుకే పరిమితం కాకుండా, నైతిక మరియు ఆధ్యాత్మిక మలుపును సూచిస్తుంది; ఏ ప్రత్యేక మతశాఖ వ్యాఖ్యానాన్నీ చేర్చదు.
- issue: ἤγγικεν యొక్క కాలాంశం
  choice: సమీపించింది
  alternative: దగ్గరకు వచ్చింది; సమీపంగా ఉంది
  rationale: రాజ్యం దగ్గరకు వచ్చిన సంఘటనతో పాటు దాని సమీపత్వం కొనసాగుతోందనే గ్రీకు పర్ఫెక్ట్ భావానికి అవకాశం ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరమైన వాక్యశైలి. గ్రీకు క్రియల సంబంధాన్ని తెలుగులో సహజంగా చూపించడానికి “ప్రకటిస్తూ … అని చెప్పడం” అనే నిర్మాణం వాడబడింది.
