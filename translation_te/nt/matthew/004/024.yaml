id: MAT.4.24
reference: Matthew 4:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: te
  text: 'ఆయన గురించిన వార్త సిరియామంతటా వ్యాపించింది. రకరకాల వ్యాధులతోను బాధలతోను బాధపడుతున్న రోగులందరినీ—దయ్యాల పీడలో ఉన్నవారిని[a], మూర్ఛలు వచ్చేవారిని[b], పక్షవాతంతో ఉన్నవారిని—ఆయన దగ్గరికి తీసుకొచ్చారు. ఆయన వారిని స్వస్థపరిచాడు.


    [a] లేదా, “దయ్యాలు పట్టినవారిని.”


    [b] మూలభాషలోని పదానికి అక్షరార్థం “చంద్రుని ప్రభావానికి లోనైనవారు”; సాంప్రదాయకంగా దీనిని “మూర్ఛవ్యాధిగలవారు” అని అనువదిస్తారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దయ్యాలు పట్టినవారిని.”
    reason: δαιμονιζομένους కు సాధ్యమైన బలమైన సాంప్రదాయక అనువాదాన్ని భద్రపరచడం.
  - marker: b
    text: మూలభాషలోని పదానికి అక్షరార్థం “చంద్రుని ప్రభావానికి లోనైనవారు”; సాంప్రదాయకంగా దీనిని “మూర్ఛవ్యాధిగలవారు” అని అనువదిస్తారు.
    reason: σεληνιαζομένους పదంలోని చంద్రసంబంధ అక్షరార్థాన్ని, సాంప్రదాయక వైద్యసూచనను పాఠకునికి తెలియజేయడం.
lexical_decisions:
- source_word: ἀκοὴ
  choice: వార్త
  rationale: ఇక్కడ ఈ పదం వినికిడి శక్తిని కాక, యేసు గురించి ప్రజల్లో వ్యాపించిన సమాచారాన్ని సూచిస్తుంది.
- source_word: ἀπῆλθεν
  choice: వ్యాపించింది
  rationale: గ్రీకులోని చలన రూపకాన్ని సహజమైన ఆధునిక తెలుగులో వార్త విస్తరించడంగా వ్యక్తపరుస్తుంది.
- source_word: Συρίαν
  choice: సిరియా దేశం
  rationale: ప్రాంతనామాన్ని తెలుగు పాఠకులకు స్పష్టంగా గుర్తించదగిన రూపంలో ఇస్తుంది.
- source_word: κακῶς ἔχοντας
  choice: రోగులందరినీ
  rationale: ఈ గ్రీకు నుడికారం అనారోగ్యంతో ఉన్నవారిని సూచిస్తుంది.
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: రకరకాల వ్యాధులు, తీవ్రమైన వేదనలు పట్టిపీడిస్తున్న
  rationale: ποικίλαις లోని వైవిధ్యాన్ని, βασάνοις లోని తీవ్రమైన బాధను, συνεχομένους లోని పట్టిపీడించే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: δαιμονιζομένους
  choice: దయ్యాల పీడలో ఉన్నవారిని
  rationale: దయ్యాల సంబంధమైన నిజమైన బాధను నిలుపుతూ, గ్రీకు పదం తప్పనిసరిగా నిర్దేశించని సన్నని సాంకేతిక స్వాధీనత భావాన్ని ప్రధాన పాఠ్యంలో రుద్దదు.
- source_word: σεληνιαζομένους
  choice: మూర్ఛలు వచ్చేవారిని
  rationale: ఆధునిక పాఠకులకు లక్షణాన్ని స్పష్టంగా తెలియజేస్తుంది; పదంలోని చంద్రునితో సంబంధమైన అక్షరార్థాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- source_word: παραλυτικούς
  choice: పక్షవాతంతో ఉన్నవారిని
  rationale: కదలిక కోల్పోయిన లేదా పక్షవాత స్థితిలో ఉన్న వ్యక్తులను సూచించే సాధారణ, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: ἐθεράπευσεν
  choice: స్వస్థపరిచాడు
  rationale: యేసు చేసిన స్వస్థత కార్యాన్ని తెలిపే సహజమైన, స్థిరమైన తెలుగు బైబిలు పదప్రయోగం.
theological_decisions:
- issue: δαιμονιζομένους అనే పదంలో దయ్యాల ప్రభావం లేదా స్వాధీనత యొక్క స్థాయి
  choice: దయ్యాల పీడలో ఉన్నవారు
  alternative: దయ్యాలు పట్టినవారు
  rationale: అతీంద్రియ సంబంధాన్ని తొలగించకుండా ఉంచుతుంది; అదే సమయంలో గ్రీకు రూపం కన్నా కఠినమైన ఆధునిక సాంకేతిక వర్గీకరణను విధించదు. బలమైన సాంప్రదాయక రూపం పాదసూచికలో ఇవ్వబడింది.
- issue: σεληνιαζομένους లోని చంద్రసంబంధ పదవ్యుత్పత్తి మరియు సూచిత వ్యాధి
  choice: మూర్ఛలు వచ్చేవారు
  alternative: చంద్రుని ప్రభావానికి లోనైనవారు; మూర్ఛవ్యాధిగలవారు
  rationale: ప్రాచీన కారణ వివరణను అనువాదం ద్వారా సమర్థించకుండా, సందర్భంలో కనిపించే బాధను సాధారణ పాఠకునికి అర్థమయ్యేలా తెలుపుతుంది; అక్షరార్థం, సాంప్రదాయక అనువాదం పాదసూచికలో నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. పొడవైన గ్రీకు జాబితిని డ్యాష్‌లతో స్పష్టపరచి, ప్రతి బాధిత వర్గాన్ని సమాంతరంగా ఉంచింది. “వేదనలు” తీవ్ర బాధను తెలియజేస్తుంది; “దయ్యాల పీడ” అతీంద్రియ సూచనను తొలగించదు.
