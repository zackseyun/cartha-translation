id: MAT.4.5
reference: Matthew 4:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: te
  text: అప్పుడు అపవాది ఆయనను పవిత్ర నగరంలోకి తీసుకెళ్లి, దేవాలయ ప్రాంగణపు శిఖరంపై[b] నిలబెట్టాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, యెరూషలేము.
    reason: cross_reference
  - marker: b
    text: లేదా, ‘దేవాలయ ప్రాంగణపు రెక్కపై’; గ్రీకు పదం దేవాలయ సముదాయంలోని బయటకు పొడుచుకొచ్చిన అంచును లేదా అత్యున్నత స్థలాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: కథనంలో తదుపరి సంఘటనను సూచించే సహజమైన కాలక్రమ అవ్యయం.
- source_word: παραλαμβάνει
  choice: తీసుకెళ్లి
  rationale: ఇది కథన వర్తమాన కాలరూపమైనా, ఆధునిక తెలుగు కథనశైలిలో భూతకాలంతో సహజంగా వ్యక్తమవుతుంది; వెంట తీసుకొని ఒక ప్రదేశానికి వెళ్లడం అనే భావాన్ని ఇస్తుంది.
- source_word: ὁ διάβολος
  choice: అపవాది
  rationale: ఇక్కడ διάβολος సాతానుకు వ్యక్తిగత బిరుదుగా వాడబడింది; ‘అపవాది’ తెలుగు బైబిలు వాడుకలో స్థిరపడిన, మూలార్థాన్ని నిలిపే పదం.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: పవిత్ర నగరంలోకి
  rationale: εἰς సూచించే లోనికి గమనాన్ని నిలుపుతూ, నగరానికి ఉన్న గౌరవసూచక వర్ణనను యథాతథంగా ఉంచుతుంది.
- source_word: ἔστησεν
  choice: నిలబెట్టాడు
  rationale: 'ἵστημι ఇక్కడ సకర్మక causative అర్థంలో ఉంది: అపవాది ఆయనను ఒక చోట నిలిచేలా చేశాడు.'
- source_word: ἐπὶ τὸ πτερύγιον
  choice: శిఖరంపై
  rationale: πτερύγιον అక్షరార్థంగా చిన్న రెక్క లేదా బయటకు పొడుచుకొచ్చిన అంచును సూచించవచ్చు; ఇక్కడ ఎత్తైన నిర్మాణ భాగం అనే సంభావ్య భావాన్ని సహజంగా తెలియజేస్తుంది, అయితే ఖచ్చితమైన నిర్మాణ సూచనను పాదటిప్పణి భద్రపరుస్తుంది.
- source_word: τοῦ ἱεροῦ
  choice: దేవాలయ ప్రాంగణపు
  rationale: ἱερόν అంతర్గత పరిశుద్ధస్థలాన్ని మాత్రమే కాక మొత్తం దేవాలయ సముదాయాన్ని సూచిస్తుంది; ‘ప్రాంగణం’ ఆ విస్తృత భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ‘పవిత్ర నగరం’ గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘పవిత్ర నగరం’ అని ఉంచడం
  alternative: యెరూషలేము
  rationale: మూలపాఠ్యం నగరపు పేరుకు బదులు గౌరవసూచక వర్ణనను ఉపయోగిస్తుంది. దానిని ప్రధాన పాఠ్యంలో నిలిపి, గుర్తింపును పాదటిప్పణిలో తెలియజేయడం మూలానికి నిబద్ధంగా ఉంటుంది.
- issue: πτερύγιον τοῦ ἱεροῦ యొక్క నిర్మాణార్థం
  choice: దేవాలయ ప్రాంగణపు శిఖరం
  alternative: దేవాలయ ప్రాంగణపు రెక్క; దేవాలయ సముదాయంలోని బయటకు పొడుచుకొచ్చిన అంచు; అత్యున్నత స్థలం
  rationale: ఖచ్చితమైన నిర్మాణ భాగం అనిశ్చితంగా ఉంది. చదవడానికి సహజమైన ‘శిఖరం’ను ప్రధాన పాఠ్యంలో ఉంచి, ఇతర సంభావ్య అర్థాలను పాదటిప్పణిలో ఇవ్వడం అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. గ్రీకు కథన వర్తమానాన్ని తెలుగు సహజ కథనరీతికి అనుగుణంగా భూతకాలంలో ఇచ్చాం. పాదటిప్పణి గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
