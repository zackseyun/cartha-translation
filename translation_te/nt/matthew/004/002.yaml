  text: καὶ νηστεύσας ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα ὕστερον ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: te
  text: నలభై రోజులు, నలభై రాత్రులు ఉపవాసం ఉన్న తర్వాత ఆయనకు ఆకలి వేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నలభై రోజులు, నలభై రాత్రులు ఉపవాసం ఉండి, తరువాత ఆయనకు ఆకలి వేసింది.”
    reason: కృదంతమైన νηστεύσας మరియు తదనంతర కాలాన్ని సూచించే ὕστερον‌ను మరింత ప్రత్యక్షంగా చూపించే వాక్య నిర్మాణ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: νηστεύσας
  choice: ఉపవాసం ఉన్న తర్వాత
  rationale: Aorist participle indicates action antecedent to the main verb. ఈ తెలుగు రూపం ఆ కాలసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: నలభై పగళ్లు, నలభై రాత్రులు
  rationale: The accusative phrase expresses duration. “పగళ్లు… రాత్రులు” మూలంలోని విడి పదాలను నిలుపుతూ సహజమైన తెలుగు కాలవ్యవధిని తెలియజేస్తుంది.
- source_word: ὕστερον
  choice: తర్వాత
  rationale: This marks the hunger as subsequent to the fast. “తర్వాత” is current, natural Telugu and combines smoothly with the participial idea.
- source_word: ἐπείνασεν
  choice: ఆయనకు ఆకలి వేసింది
  rationale: This naturally communicates the onset/resulting experience of hunger in modern Telugu without archaic diction.
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: The connective continues the narrative, but an initial “మరియు” would sound wooden in Telugu. Narrative continuity is adequately carried by the sentence order and context.
theological_decisions:
- issue: ఉపవాసం తర్వాత యేసు అనుభవించిన నిజమైన మానవ ఆకలి
  choice: ఆయనకు ఆకలి వేసింది
  alternative: ఆయన ఆకలిగొన్నారు
  rationale: ఎంచుకున్న రూపం నిజమైన ఆకలిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; అయితే వచనం చెప్పినదానికంటే ఎక్కువ సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు సహజంగా ఉండే “ఉపవాసం ఉన్న” మరియు “ఆకలి వేసింది” అనే రూపాలు వాడబడ్డాయి. భాష గౌరవప్రదంగా ఉంది, కానీ ప్రాచీన లేదా కృత్రిమ పదజాలాన్ని నివారించింది.
