- from: నలభై పగళ్లు, నలభై రాత్రులు ఉపవాసం ఉన్న తర్వాత ఆయనకు ఆకలి వేసింది.[a]
  to: నలభై రోజులు, నలభై రాత్రులు ఉపవాసం ఉన్న తర్వాత ఆయనకు ఆకలి వేసింది.[a]
  rationale: కాలవ్యవధిని సూచించే “పగళ్లు” స్థానంలో “రోజులు” ఉంచబడింది. దీనివల్ల మూలంలోని “నలభై రోజులు, నలభై రాత్రులు” అనే సమాంతర కాలప్రయోగం ఆధునిక సహజ తెలుగు ద్వారా మరింత కచ్చితంగా వ్యక్తమవుతుంది. మిగిలిన వాక్యనిర్మాణం మూలార్థాన్నీ, గౌరవప్రదమైన సహజ రిజిస్టర్‌నీ కాపాడుతుంది.
