  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: te
  text: ఆయన నజరాను[a] విడిచిపెట్టి వచ్చి, సముద్రతీరాన జెబూలూను, నఫ్తాలి ప్రాంతాల్లో ఉన్న కపెర్నహూములో నివాసం ఏర్పరచుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
