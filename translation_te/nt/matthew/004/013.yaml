    text: 'గ్రీకు: ‘నజరా’; అనేక ఆంగ్ల అనువాదాల్లో ‘నజరేతు’ అని ఉంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: విడిచిపెట్టి
  rationale: అనంతర ప్రధాన క్రియకు ముందుగా జరిగిన నజరా నుండి బయలుదేరడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Ναζαρὰ
  choice: నజరా
  rationale: ఈ వచనంలోని గ్రీకు రూపం Ναζαράను నేరుగా ప్రతిబింబిస్తుంది; సుపరిచితమైన ‘నజరేతు’ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἐλθὼν
  choice: వచ్చి
  rationale: అసలు భాషలోని క్రియాక్రమాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: κατῴκησεν
  choice: నివాసమున్నాడు
  rationale: కేవలం తాత్కాలికంగా ఉండడం కాకుండా అక్కడ నివాసం ఏర్పరచుకున్న భావాన్ని తెలియజేస్తుంది.
- source_word: Καφαρναοὺμ
  choice: కపెర్నహూము
  rationale: తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే స్థలనామ రూపం.
- source_word: τὴν παραθαλασσίαν
  choice: సముద్రతీరాన
  rationale: కపెర్నహూము సముద్రం పక్కన ఉన్నదనే భౌగోళిక వివరణను సహజంగా అందిస్తుంది.
- source_word: ἐν ὁρίοις
  choice: ప్రాంతాల్లో
  rationale: ὅρια ఇక్కడ సరిహద్దులు, భూభాగాలు లేదా ప్రాంతాలు అనే విస్తృత భౌగోళిక భావాన్ని కలిగి ఉంది; ‘ప్రాంతాల్లో’ ఆ భావాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: Ζαβουλὼν
  choice: జెబూలూను
  rationale: తెలుగులో గుర్తించదగిన సంప్రదాయ నామరూపం.
- source_word: Νεφθαλίμ
  choice: నఫ్తాలి
  rationale: తెలుగులో గుర్తించదగిన సంప్రదాయ నామరూపం.
