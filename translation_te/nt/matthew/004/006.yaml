id: MAT.4.6
reference: Matthew 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: te
  text: 'అతడు ఆయనతో ఇలా అన్నాడు: “నీవు దేవుని కుమారుడివైతే, కిందికి దూకు[a]. ఎందుకంటే ఇలా రాసి ఉంది:


    ‘ఆయన నిన్ను గురించి తన దూతలకు ఆజ్ఞాపిస్తాడు,’


    ‘నీ పాదం రాయికి తగలకుండా వారు నిన్ను తమ చేతుల మీద ఎత్తుకుంటారు[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “నిన్ను నీవే కిందికి పడవేసుకో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారు నిన్ను తమ చేతుల మీద మోస్తారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: అన్నాడు
  rationale: కథనంలో గ్రీకు వర్తమాన కాలం చారిత్రక వర్తమానంగా పనిచేస్తోంది; ఆధునిక తెలుగు కథనంలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: Εἰ
  choice: నీవు ... అయితే
  rationale: ఇది సవాలు చేసే షరతును వ్యక్తం చేస్తుంది; అది నిజమని ముందుగానే అంగీకరించకుండా పరీక్షించే ధోరణిని నిలుపుతుంది.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: మత్తయి సందర్భంలో ఇది సాధారణ వర్గాన్ని కాక క్రీస్తును సూచించే బిరుదుగా పనిచేస్తుంది; తెలుగు నామవాచక నిర్మాణం అదనపు నిర్దిష్ట ఉపపదం లేకుండానే ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: βάλε σεαυτὸν κάτω
  choice: కిందికి దూకు
  rationale: ప్రతిబింబార్థం తెలుగులో క్రియలోనే సహజంగా వ్యక్తమవుతుంది; ఎత్తైన స్థలం నుంచి తనంతట తాను కిందికి వెళ్లే ఆజ్ఞను స్పష్టంగా అందిస్తుంది.
- source_word: γέγραπται
  choice: రాసి ఉంది
  rationale: పూర్త భూతకర్మణి రూపంలోని, ఇప్పటికీ వర్తించే లిఖిత అధికార భావాన్ని సహజమైన తెలుగు ప్రయోగంతో నిలుపుతుంది.
- source_word: ἐντελεῖται
  choice: ఆజ్ఞాపిస్తాడు
  rationale: దూతలకు ఇవ్వబడే అధికారపూర్వక ఆదేశాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: περὶ σοῦ
  choice: నిన్ను గురించి
  rationale: περί + షష్ఠీ విభక్తి యొక్క ‘గురించి/సంబంధించి’ అనే భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπὶ χειρῶν
  choice: తమ చేతులపై
  rationale: దూతల చేతులపై ఆధారంగా మోయబడే చిత్రాన్ని గ్రీకు ఉపసర్గకు సమీపంగా నిలుపుతుంది.
- source_word: ἀροῦσίν σε
  choice: నిన్ను ... ఎత్తుకుంటారు
  rationale: αἴρω ఇక్కడ ఎత్తి ఆదరించడం లేదా మోయడం అనే భావం ఇస్తుంది; ‘ఎత్తుకుంటారు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: μήποτε προσκόψῃς πρὸς λίθον
  choice: నీ పాదం రాయికి తగలకుండా
  rationale: నివారణార్థక μήποτεను తెలుగు నిషేధ-ప్రయోజన నిర్మాణంతో వ్యక్తం చేసి, పాదం రాయికి కొట్టుకునే నిర్దిష్ట చిత్రాన్ని నిలుపుతుంది.
- source_word: τὸν πόδα σου
  choice: నీ పాదం
  rationale: గ్రీకులోని ఏకవచనాన్ని తెలుగులోనూ ఏకవచనంగానే ఉంచుతుంది.
theological_decisions:
- issue: శోధకుని సవాలులో ‘దేవుని కుమారుడు’ అనే పదబంధపు క్రీస్తుసంబంధిత బలం
  choice: ‘దేవుని కుమారుడు’ అనే బిరుదుగా అనువదించడం
  alternative: ‘దేవుని కుమారుల్లో ఒకడు’ అనే సాధారణ వర్గార్థం ఇవ్వడం
  rationale: మత్తయి కథన సందర్భంలో ఈ పదబంధం యేసు గుర్తింపును సవాలు చేసే నిర్దిష్ట బిరుదు; మూలపాఠాన్ని మించి సిద్ధాంత వివరణను చేర్చకుండా ఆ బలాన్ని నిలుపుతుంది.
- issue: అపవాది కీర్తనను ఉదహరించడం
  choice: వక్త చేసిన లేఖన ఉల్లేఖనాన్ని వివరణ లేదా సవరణ లేకుండా ప్రధాన పాఠంలో ఉంచడం
  alternative: ఉల్లేఖనానికి వ్యాఖ్యాత్మక హెచ్చరికను ప్రధాన పాఠంలో చేర్చడం
  rationale: వాక్యం శోధకుడు లేఖనాన్ని ఉటంకిస్తున్నాడనే ఉద్విగ్నతను ఉద్దేశపూర్వకంగా ఉంచుతుంది; అనువాదం దానిని ముందుగానే పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. యేసును సూచించడానికి ‘ఆయన’ వాడినా, మూలంలోని వక్తను పేరుతో గుర్తించకుండా ‘అతడు’ అని ఉంచి ఈ వాక్యంలోని సర్వనామ నిర్మాణాన్ని కాపాడాం. కీర్తన ఉల్లేఖనాన్ని కవితాత్మక పంక్తులుగా అమర్చాం.
