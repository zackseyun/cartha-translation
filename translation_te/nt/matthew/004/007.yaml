- from: 'యేసు అతనితో ఇలా అన్నాడు: “మరోవైపు, ‘నీ దేవుడైన ప్రభువును పరీక్షించకూడదు’ అని రాసి ఉంది.”[a][b]'
  to: 'యేసు అతనితో ఇలా అన్నాడు: “మళ్లీ ఇలా రాసి ఉంది: ‘నీ దేవుడైన ప్రభువును పరీక్షకు పెట్టకూడదు[a].’”[b]'
