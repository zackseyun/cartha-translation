id: MAT.4.7
reference: Matthew 4:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: te
  text: 'యేసు అతనితో ఇలా అన్నాడు: “మళ్లీ ఇలా రాసి ఉంది: ‘నీ దేవుడైన ప్రభువును పరీక్షకు పెట్టకూడదు[a].’”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరీక్షించకూడదు.” గ్రీకు క్రియ ἐκπειράζωను “పరీక్షించు” లేదా “పరీక్షకు పెట్టు” అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇది ద్వితీయోపదేశకాండము 6:16 నుండి చేసిన ఉటంకింపు. గ్రీకులోని “ప్రభువు” అనే పదం, దైవనామాన్ని సెప్టువజింట్ అనువదించిన విధానాన్ని ప్రతిబింబిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: యేసు అతనితో ఇలా అన్నాడు
  rationale: సాధారణ వాక్యప్రవేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని పరోక్ష కర్మను ‘అతనితో’గా నిలుపుతుంది.
- source_word: Πάλιν
  choice: మరోవైపు
  rationale: ఇక్కడ యేసు శోధకుడు ఉటంకించిన వాక్యానికి ప్రతిగా మరో లేఖన వాక్యాన్ని ఉటంకిస్తున్నాడు. ‘మరోవైపు’ ఈ ప్రతివాద సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘మళ్లీ’ కూడా సాధ్యమే.
- source_word: γέγραπται
  choice: రాసి ఉంది
  rationale: పరిపూర్ణ కర్మణి రూపం గతంలో రాయబడి ఇప్పటికీ ప్రమాణంగా నిలిచిన లేఖనాన్ని సూచిస్తుంది; ‘రాసి ఉంది’ తెలుగులో సహజమైన ఉటంకింపు సూత్రం.
- source_word: Οὐκ ἐκπειράσεις
  choice: పరీక్షించకూడదు
  rationale: భవిష్యత్ సూచక రూపం ఇక్కడ నిషేధాజ్ఞగా పనిచేస్తుంది. ἐκπειράζωలోని పరీక్షకు పెట్టడం అనే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: κύριον τὸν θεόν σου
  choice: నీ దేవుడైన ప్రభువును
  rationale: κύριοςను ‘ప్రభువు’గా, appositional τὸν θεόν σουను సహజమైన తెలుగు సంబంధ నిర్మాణమైన ‘నీ దేవుడైన’గా అనువదిస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలు దేవుణ్ణి సూచించే లేఖన ఉటంకింపులో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: తక్షణ మూలపాఠం గ్రీకు κύριοςను కలిగి ఉంది; అందువల్ల ప్రధాన పాఠంలో దైవనామాన్ని తిరిగి నిర్మించకుండా ‘ప్రభువు’గా ఉంచాం. సెప్టువజింటు నేపథ్యాన్ని పాదసూచికలో తెలిపాం.
- issue: Πάλιν యొక్క వాదనాత్మక భావం
  choice: మరోవైపు
  alternative: మళ్లీ
  rationale: ఈ సందర్భంలో పదం కేవలం పునరావృతాన్ని మాత్రమే కాక, ముందు ఉటంకింపుకు ప్రతిగా మరో లేఖనాన్ని ప్రవేశపెడుతుంది. అయినప్పటికీ ‘మళ్లీ’ అనే సరళ అర్థం సాధ్యమే కాబట్టి పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే లేఖన ఉటంకింపుకు తగిన గంభీరతతో రూపొందించబడింది. పాదసూచిక గుర్తులు రెండూ ప్రధాన పాఠంలో ఉన్నాయి.
