review_pass:
  verdict: revise
  source_fidelity: The rhetorical question and the metaphor of ζύμη are retained. However, ‘పులిసిన పిండిని గూర్చి జాగ్రత్తగా ఉండండి’ can mean ‘be careful about leaven’ rather than the protective warning expressed by προσέχετε ἀπό. ‘పులిసిన పిండి విషయంలో జాగ్రత్తగా ఉండండి’ more naturally conveys the intended warning without unpacking the metaphor.
  naturalness: The revised wording is idiomatic modern standard Telugu. ‘కాని’ provides a natural mild contrast for δέ, and ‘విషయంలో జాగ్రత్తగా ఉండండి’ is clearer than ‘గూర్చి జాగ్రత్తగా ఉండండి’ in this warning context.
  terminology: ‘పరిసయ్యులు,’ ‘సద్దూకయ్యులు,’ and ‘పులిసిన పిండి’ appropriately preserve established names and the source metaphor. The footnote rightly identifies the metaphor without importing ‘teaching’ into the main text.
  issues:
