id: MAT.16.11
reference: Matthew 16:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πῶς οὐ νοεῖτε ὅτι οὐ περὶ ⸀ἄρτων εἶπον ὑμῖν; ⸂προσέχετε δὲ⸃ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: te
  text: “నేను మీతో రొట్టెల గురించి మాట్లాడలేదని మీరు ఎలా గ్రహించలేకపోతున్నారు? కాని పరిసయ్యుల, సద్దూకయ్యుల పులిసిన పిండి విషయంలో జాగ్రత్తగా ఉండండి[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిసయ్యుల, సద్దూకయ్యుల పులిసిన పిండి పట్ల అప్రమత్తంగా ఉండండి.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘పులిసిన పిండి’ ఒక రూపకం; తరువాతి వచనంలో అది పరిసయ్యుల, సద్దూకయ్యుల బోధ అని వివరించబడింది.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: మీరు ఎలా గ్రహించలేకపోతున్నారు?
  rationale: πῶς తో కూడిన నిరాకరణ, νοέω ఇక్కడ శిష్యులు భావాన్ని గ్రహించకపోవడాన్ని గద్దించే ప్రశ్నగా ఉంది. ‘గ్రహించలేకపోతున్నారు’ సహజమైన ఆధునిక తెలుగు రూపం; ప్రశ్నలోని మందలింపు బలాన్ని నిలుపుతుంది.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: నేను మీతో రొట్టెల గురించి మాట్లాడలేదని
  rationale: ἄρτων వ్యాకరణపరంగా బహువచనమైనా, సందర్భంలో తెలుగు ‘రొట్టెలు’ సహజంగా ఉంటుంది. εἶπον ὑμῖν ను ‘మీతో ... మాట్లాడలేదు’గా ఇవ్వడం నేరుగా, స్పష్టంగా ఉంది.
- source_word: προσέχετε δὲ
  choice: అయితే ... జాగ్రత్తగా ఉండండి
  rationale: δέ స్వల్ప వ్యత్యాసం లేదా మార్పును సూచిస్తుంది; ‘అయితే’ సరిదిద్దే మలుపును చూపుతుంది. προσέχετε హెచ్చరికతో కూడిన ఆజ్ఞ కాబట్టి ‘జాగ్రత్తగా ఉండండి’ సహజమైన ఎంపిక.
- source_word: ἀπὸ τῆς ζύμης
  choice: పులిసిన పిండిని గూర్చి
  rationale: προσέχετε ... ἀπό నిర్మాణం దేనినుండి కాపాడుకోవాలో సూచిస్తుంది. ζύμη యొక్క రూపకాన్ని ముందుగానే ‘బోధ’గా విప్పకుండా, తెలుగులో అర్థమయ్యే ‘పులిసిన పిండి’గా నిలుపుతుంది.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: పరిసయ్యుల, సద్దూకయ్యుల
  rationale: ఈ యూదు వర్గాలకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణలను ఉపయోగిస్తుంది. సంబంధార్థక షష్ఠీని తెలుగు యొక్క ‘-ల’ రూపం సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘పులిసిన పిండి’ రూపకార్థం
  choice: ప్రధాన పాఠ్యంలో రూపకాన్ని ‘పులిసిన పిండి’గానే ఉంచడం
  alternative: ‘పరిసయ్యుల, సద్దూకయ్యుల బోధ విషయంలో జాగ్రత్తగా ఉండండి’
  rationale: తదుపరి వచనం ఈ రూపకాన్ని వారి బోధగా వివరిస్తుంది; ప్రస్తుత వచనం మాత్రం ζύμη అనే రూపకాన్నే ఉపయోగిస్తుంది. దానిని ఇక్కడే విప్పడం మూలంలోని క్రమాన్ని ముందుగానే పరిష్కరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పులిసిన పిండి’ రూపకాన్ని నిలిపి, దాని వివరణను పాదసూచికలో ఇచ్చాం; ‘జాగ్రత్తగా ఉండండి’ హెచ్చరికాత్మక ఆజ్ఞను సహజంగా వ్యక్తం చేస్తుంది.
