    rationale: ‘గూర్చి’ normally means ‘about/concerning’; the Greek construction is a warning to guard oneself from the leaven. Recasting it as ‘పులిసిన పిండి విషయంలో జాగ్రత్తగా ఉండండి’ retains the metaphor while making the warning function clear.
