revisions:
- from: “నేను మీతో రొట్టెల గురించి మాట్లాడలేదని మీరు ఎలా గ్రహించలేకపోతున్నారు? అయితే పరిసయ్యుల, సద్దూకయ్యుల పులిసిన పిండిని గూర్చి జాగ్రత్తగా ఉండండి[a][b].”
  to: “నేను మీతో రొట్టెల గురించి మాట్లాడలేదని మీరు ఎలా గ్రహించలేకపోతున్నారు? కాని పరిసయ్యుల, సద్దూకయ్యుల పులిసిన పిండి విషయంలో జాగ్రత్తగా ఉండండి[a][b].”
  rationale: The revision corrects the Telugu expression of the Greek warning construction προσέχετε ἀπό, while preserving the rhetorical rebuke, the contrast, and the unexpanded metaphor. Footnote a is adjusted so that it remains a genuine lexical alternative rather than duplicating the revised main-text phrasing.
