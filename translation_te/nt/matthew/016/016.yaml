id: MAT.16.16
reference: Matthew 16:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: te
  text: 'సీమోను పేతురు ప్రత్యుత్తరమిచ్చి ఇలా అన్నాడు: “నీవే మెస్సీయ[a], సజీవుడైన దేవుని కుమారుడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.” గ్రీకు Χριστός (క్రిస్టోస్) ఒక బిరుదు; దానికి “అభిషిక్తుడు” అనే భావం ఉంది. ఇక్కడ యూదుల మెస్సీయ నిరీక్షణ నేపథ్యాన్ని నిలుపడానికి “మెస్సీయ” అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν
  choice: అప్పుడు ... జవాబిస్తూ ... అన్నాడు
  rationale: గ్రీకు వాక్యంలోని స్పందనాత్మక కథన ప్రవాహాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ἀποκριθεὶς మరియు εἶπεν రెండింటినీ యాంత్రికంగా పునరుక్తి చేయకుండా వాటి సంయుక్త భావాన్ని నిలుపుతుంది.
- source_word: Σίμων Πέτρος
  choice: సీమోను పేతురు
  rationale: వ్యక్తిపేర్లకు ప్రామాణిక తెలుగు బైబిలు లిప్యంతరీకరణను అనుసరిస్తుంది.
- source_word: Σὺ εἶ
  choice: నీవే ... వు
  rationale: గ్రీకులో స్పష్టంగా ఉంచిన Σὺ యొక్క ఉద్ఘాటనను తెలుగు ‘నీవే’ సహజంగా నిలుపుతుంది.
- source_word: ὁ χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός వ్యక్తిపేరుగా కాక అభిషిక్త రాజును సూచించే బిరుదుగా ఉంది; ‘మెస్సీయ’ యూదుల నిరీక్షణ నేపథ్యాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ὁ υἱὸς
  choice: కుమారుడు
  rationale: నిర్దిష్టమైన పుత్రత్వ బిరుదును సందర్భంలోని సమాంతర నిర్మాణంతో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: సజీవుడైన దేవుని
  rationale: వర్తమాన కృదంతమైన ζῶντος యొక్క ‘జీవించే/సజీవుడైన’ భావాన్ని దేవునికి సంబంధించిన గుణవాచకంగా సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: Χριστόςను బిరుదుగా లేదా పేరులాంటి రూపంగా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: పేతురు ఒప్పుకోలులో Χριστός స్పష్టంగా మెస్సీయ బిరుదుగా పనిచేస్తుంది. ప్రధాన పాఠంలో బిరుదు భావాన్ని చూపుతూ, సంప్రదాయ లిప్యంతరీకరణను పాదసూచికలో ఉంచాం.
- issue: ‘దేవుని కుమారుడు’ అనే పదబంధపు భావవ్యాప్తి
  choice: సజీవుడైన దేవుని కుమారుడు
  alternative: వివరణాత్మక సిద్ధాంత విస్తరణ
  rationale: గ్రీకు పాఠంలోని ఒప్పుకోలు మరియు బిరుదు రూపాన్ని యథాతథంగా నిలుపుతూ, దాని అర్థాన్ని తరువాతి సిద్ధాంత పదజాలంతో విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ఒప్పుకోలు వాక్యానికి తగిన గంభీరతతో. ‘నీవే’ ద్వారా మూలంలోని ఉద్ఘాటనను నిలిపాం; ‘సజీవుడైన దేవుడు’ సహజమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
