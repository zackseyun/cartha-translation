revisions:
- from: అప్పుడు సీమోను పేతురు జవాబిస్తూ, “నీవే మెస్సీయవు[a], సజీవుడైన దేవుని కుమారుడవు” అన్నాడు.
  to: 'సీమోను పేతురు ప్రత్యుత్తరమిచ్చి ఇలా అన్నాడు: “నీవే మెస్సీయ[a], సజీవుడైన దేవుని కుమారుడు.”'
  rationale: The revision removes the unsupported temporal adverb, uses an idiomatic Telugu equivalent for the Greek response formula, retains the emphatic confession and its titular terms, and corrects the footnote’s conventional Telugu alternative.
