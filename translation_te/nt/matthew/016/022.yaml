id: MAT.16.22
reference: Matthew 16:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: te
  text: 'పేతురు ఆయనను పక్కకు తీసుకెళ్లి, ఆయనను గద్దించడం మొదలుపెట్టి ఇలా అన్నాడు: “ప్రభువా, అలా మీకు కాకూడదు![a] ఇది మీకు ఎన్నటికీ జరగదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువా, దేవుడు మిమ్మల్ని కరుణించుగాక!” లేదా, “ప్రభువా, అది మీకు దూరంగా ఉండుగాక!” గ్రీకు మాట సంక్షిప్తమైన నానుడి; అక్షరార్థంగా ‘మీకు అనుగ్రహం/కరుణ కలుగుగాక’ అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος
  choice: ఆయనను పక్కకు తీసుకెళ్లి
  rationale: ఈ మధ్యమ ప్రయోగం పేతురు యేసును తనవైపు తీసుకొని, ఇతరులకు దూరంగా వ్యక్తిగతంగా మాట్లాడిన భావాన్ని సందర్భంలో సూచిస్తుంది.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: గద్దించడం మొదలుపెట్టాడు
  rationale: ἤρξατο + infinitive ప్రారంభ భావాన్ని ఇస్తుంది; ἐπιτιμάω లోని తీవ్రంగా మందలించే భావాన్ని ‘గద్దించడం’ సహజంగా తెలియజేస్తుంది.
- source_word: Ἵλεώς σοι
  choice: మీకు అలాంటిది కలగకూడదు
  rationale: ఇది అక్షరార్థానికి పరిమితం కాని, కరుణ లేదా అనుకూలతను సూచించే సంక్షిప్త గ్రీకు నానుడి. సందర్భంలో పేతురు యేసు చెప్పిన బాధలు ఆయనకు సంభవించకూడదని బలంగా అభ్యంతరం చెబుతున్నాడు. దేవుడు అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా ఆ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: κύριε
  choice: ప్రభువా
  rationale: సంబోధనను, గౌరవాన్ని, సువార్తలోని క్రీస్తు సంబంధిత ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: ఇది మీకు ఎన్నటికీ జరగదు
  rationale: οὐ μή మరియు భవిష్యత్ క్రియ కలిసిన బలమైన నిరాకరణను ‘ఎన్నటికీ జరగదు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పేతురు పలికిన Ἵλεώς σοι అనే సంక్షిప్త నానుడిని అదనపు దైవశాస్త్ర భావం చేర్చకుండా అనువదించడం
  choice: ప్రభువా, మీకు అలాంటిది కలగకూడదు!
  alternative: ప్రభువా, దేవుడు మిమ్మల్ని కరుణించుగాక! / ప్రభువా, అలా ఎన్నటికీ కాకూడదు!
  rationale: గ్రీకులో ‘దేవుడు’ స్పష్టంగా లేకపోయినా, ఈ నానుడి దైవానుగ్రహం లేదా అపాయం తొలగిపోవాలనే భావాన్ని కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యం పేతురు అభ్యంతరాన్ని సహజంగా తెలియజేస్తుంది; నిజమైన నానుడి అస్పష్టతను పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. యేసును సూచించేటప్పుడు ‘ఆయన’, ‘మీకు’ అనే గౌరవ రూపాలు ఉపయోగించబడ్డాయి; పేతురు మాటల తీవ్రతను ‘గద్దించడం’, ‘ఎన్నటికీ’ నిలుపుతున్నాయి.
