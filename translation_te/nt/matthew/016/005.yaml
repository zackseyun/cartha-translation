  text: Καὶ ἐλθόντες οἱ ⸀μαθηταὶ εἰς τὸ πέραν ἐπελάθοντο ἄρτους λαβεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/005.yaml
  text: And when the disciples came to the other side[a], they had forgotten to take bread.
translation:
  language: te
  text: శిష్యులు అవతలి ఒడ్డుకు చేరుకున్నప్పుడు, రొట్టెలు తీసుకురావడం మరిచిపోయారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: చేరుకున్నప్పుడు
  rationale: అనంతరకాల కృదంతాన్ని ప్రధాన క్రియతో కాలసంబంధంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులు
  rationale: సువార్తల సందర్భంలో యేసు శిష్యులను సూచించే స్థిరమైన, సహజమైన తెలుగు పదం.
- source_word: εἰς τὸ πέραν
  choice: అవతలి ఒడ్డుకు
  rationale: సరస్సు అవతలి వైపుకు చేరడాన్ని సందర్భానుసారంగా స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐπελάθοντο
  choice: మరిచిపోయారు
  rationale: ἐπιλανθάνομαι యొక్క ప్రాథమిక అర్థమైన ‘మరిచిపోవడం’ను నేరుగా తెలియజేస్తుంది; తెలుగు క్రియారూపమే ముందుగా జరిగిన మరిచిపోవడాన్ని సందర్భంలో సహజంగా మోస్తుంది.
- source_word: ἄρτους
  choice: రొట్టెలు
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, తీసుకెళ్లే ఆహారపు రొట్టెలను సహజంగా సూచిస్తుంది.
- source_word: λαβεῖν
  choice: తీసుకురావడం
  rationale: ప్రయాణ సందర్భంలో తమతో పాటు రొట్టెలను తీసుకురావడమనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని బహువచనమైన ἄρτους‌ను ‘రొట్టెలు’గా నిలుపుకున్నందున పాదటిప్పణి అవసరం లేదు.
