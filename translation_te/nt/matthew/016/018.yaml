  to: 'నేను కూడా నీకు చెబుతున్నాను: నీవు పేతురు; ఈ బండమీద[a] నేను నా సంఘాన్ని కడతాను. మృతుల లోకపు ద్వారాలు[b] దానిపై పైచేయి సాధించవు.'
