id: MAT.16.18
reference: Matthew 16:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: te
  text: 'నేను కూడా నీకు చెబుతున్నాను: నీవు పేతురు; ఈ బండమీద[a] నేను నా సంఘాన్ని కడతాను. మృతుల లోకపు ద్వారాలు[b] దానిపై పైచేయి సాధించవు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘పేతురు’ (Πέτρος), ‘బండ’ (πέτρα) అనే పదాల మధ్య పదప్రయోగం ఉంది. ‘ఈ బండ’ పేతురునే, పేతురు చేసిన విశ్వాస ఒప్పుకోలును, లేదా ఆ ఒప్పుకోలు చేసిన ప్రతినిధి అపొస్తలుడిగా పేతురునే సూచిస్తుందని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: b
    text: 'గ్రీకు: ‘హేడేసు’; అంటే మృతుల లోకం. సంప్రదాయంగా ‘నరకం’ అని అనువదించారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: నేను కూడా
  rationale: κἀγώలోని ఉద్ఘాటనను ‘కూడా’ నిలుపుతుంది; δέ సూచించే కొనసాగింపు లేదా స్వల్ప ప్రతిస్పందన భావం తెలుగు వాక్యప్రవాహంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: σοι λέγω
  choice: నీతో చెబుతున్నాను
  rationale: ప్రత్యక్షంగా పేతురుతో పలుకుతున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: Πέτρος
  choice: పేతురు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం; గ్రీకులోని Πέτρος–πέτρα పదప్రయోగం తెలుగులో నేరుగా నిలవనందున దానిని పాదసూచికలో తెలియజేశాం.
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: ఈ బండమీద
  rationale: ἐπίతో కూడిన దత్తివిభక్తి భావాన్ని ‘మీద’ సహజంగా తెలియజేస్తుంది; ταύτῃలోని నిర్దేశక బలాన్ని ‘ఈ’ నిలుపుతుంది. ‘బండ’ నిర్మాణ రూపకానికి తగిన దృఢమైన ఆధారాన్ని సూచిస్తుంది.
- source_word: οἰκοδομήσω
  choice: కడతాను
  rationale: οἰκοδομέωలోని నిర్మాణ రూపకాన్ని ‘స్థాపిస్తాను’ అని సారాంశపరచకుండా నేరుగా నిలుపుతుంది.
- source_word: μου τὴν ἐκκλησίαν
  choice: నా సంఘాన్ని
  rationale: ఇక్కడ ἐκκλησία యేసుకు చెందిన సమాజాన్ని సూచిస్తుంది. ‘సంఘం’ ఆధునిక తెలుగులో సహజంగా ఉండి, స్వామ్యార్థకమైన μουను ‘నా’గా స్పష్టంగా నిలుపుతుంది.
- source_word: πύλαι ᾅδου
  choice: మృతుల లోకపు ద్వారాలు
  rationale: ᾅδηςను అంతిమ శిక్షాస్థలమైన ‘నరకం’తో సమానం చేయకుండా, మృతుల లోకంగా అర్థవంతంగా అనువదిస్తుంది; ‘ద్వారాలు’ అనే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: దానిపై పైచేయి సాధించవు
  rationale: κατισχύωలోని జయించడం, అధిగమించడం, బలవంతంగా పైచేయి పొందడం అనే ప్రత్యర్థిత్వ భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; αὐτῆς సంఘాన్ని సూచిస్తుంది.
theological_decisions:
- issue: ‘ఈ బండ’ (ταύτῃ τῇ πέτρᾳ) దేనిని సూచిస్తుంది?
  choice: అనువాదంలో ‘ఈ బండ’ అని మాత్రమే ఉంచి, దాని నిర్దిష్ట సూచనను నిర్ణయించలేదు.
  alternative: అది పేతురునే, పేతురు చేసిన ఒప్పుకోలునే, లేదా ఒప్పుకోలు చేసిన ప్రతినిధి అపొస్తలుడిగా పేతురునే సూచిస్తుందని ప్రత్యేకంగా పేర్కొనడం.
  rationale: గ్రీకు పాఠం Πέτρος మరియు πέτρα మధ్య ఉద్దేశపూర్వక పదప్రయోగాన్ని కలిగి ఉన్నా, వివాదాస్పదమైన సూచనను వాక్యం తానే పూర్తిగా పరిష్కరించదు. అందువల్ల అనువాదం ఆ theological tensionను నిలుపుతుంది.
- issue: ᾅδης పదానికి అనువాదం
  choice: మృతుల లోకం
  alternative: హేడేసు; పాతాళం; నరకం
  rationale: ఈ సందర్భంలో ᾅδης మృతుల లోకాన్ని సూచిస్తుంది; ‘నరకం’ అనడం అంతిమ శిక్షకు సంబంధించిన తరువాతి భావాలను అనవసరంగా దిగుమతి చేయవచ్చు. ‘మృతుల లోకం’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. ‘కడతాను’ మరియు ‘ద్వారాలు’ ద్వారా మూలంలోని నిర్మాణం, కోట/మృతుల లోకం రూపకాలను నిలిపాం. వివాదాస్పదమైన ‘ఈ బండ’ సూచనను ప్రధాన పాఠంలో పరిష్కరించకుండా పాదసూచికలో ప్రధాన వ్యాఖ్యాన అవకాశాలను సమతుల్యంగా ఇచ్చాం.
