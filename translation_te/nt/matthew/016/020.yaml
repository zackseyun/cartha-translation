id: MAT.16.20
reference: Matthew 16:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: te
  text: అప్పుడు ఆయనే మెస్సీయ[a] అని ఎవరికీ చెప్పవద్దని శిష్యులకు ఆయన కఠినంగా ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు.’ గ్రీకు Χριστός ఇక్కడ ఒక బిరుదు; దాని భావాన్ని నిలుపడానికి ఇక్కడ ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలోని సంఘటనల క్రమాన్ని సహజంగా సూచించే సంక్షిప్త కాలవాచకం.
- source_word: διεστείλατο
  choice: గట్టిగా ఆజ్ఞాపించాడు
  rationale: ఇక్కడ ఈ క్రియ బలమైన నిర్దేశాన్ని సూచిస్తుంది. ‘గట్టిగా ఆజ్ఞాపించాడు’ అనేది హెచ్చరికలోని ప్రమాద భావాన్ని అనవసరంగా చేర్చకుండా ఆ బలాన్ని నిలుపుతుంది.
- source_word: τοῖς μαθηταῖς
  choice: శిష్యులకు
  rationale: యేసును అనుసరించే, సందర్భంలో ఇప్పటికే తెలిసిన సమూహాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేక నిర్దేశక పదం అవసరం లేదు.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: ఎవరికీ చెప్పవద్దని
  rationale: ἵνα సహిత సంభావనార్థక క్రియ ఆజ్ఞలోని విషయాన్ని తెలియజేస్తుంది; ఈ తెలుగు నిర్మాణం నిషేధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὅτι αὐτός ἐστιν
  choice: తానే … అని
  rationale: స్పష్టంగా ఉన్న αὐτόςను తెలుగులో ‘తానే’గా ఉంచడం వాక్యంలోని కర్తను స్పష్టం చేస్తుంది; సందర్భానికి మించిన సిద్ధాంతపరమైన ఉద్ఘాటనను జోడించదు.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ వ్యక్తినామంగా కాక అభిషిక్తుడనే భావమున్న గుర్తింపు పొందిన బిరుదుగా వాడబడింది; ‘మెస్సీయ’ ఆ బిరుదు యొక్క యూదీయ నేపథ్యాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός పేరు మాదిరిగా కాక బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ దాని అభిషిక్తుడనే బిరుదు భావాన్ని స్పష్టంగా కాపాడుతుంది; విస్తృతంగా పరిచితమైన ‘క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కథన శైలి. గ్రీకు వాక్యంలోని బలమైన ఆజ్ఞను ‘గట్టిగా ఆజ్ఞాపించాడు’గా, మెస్సీయ బిరుదును పాదసూచికతో సహా స్పష్టంగా అందించాం.
