- from: అప్పుడు తానే మెస్సీయ[a] అని ఎవరికీ చెప్పవద్దని శిష్యులకు ఆయన గట్టిగా ఆజ్ఞాపించాడు.
  to: అప్పుడు ఆయనే మెస్సీయ[a] అని ఎవరికీ చెప్పవద్దని శిష్యులకు ఆయన కఠినంగా ఆజ్ఞాపించాడు.
