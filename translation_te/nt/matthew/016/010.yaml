translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, యేసు అడిగిన అలంకారిక ప్రశ్న కొనసాగింపుగా సహజమైన వాక్యనిర్మాణం వాడబడింది. ‘గంపలు’కు ‘పెద్ద’ను జోడించి σπυρίς మరియు κόφινος మధ్య ఉన్న పదభేదం కాపాడబడింది.
