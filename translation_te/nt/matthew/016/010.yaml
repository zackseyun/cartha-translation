  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: te
  text: నాలుగు వేలమందికి పంచిన ఏడు రొట్టెల సంగతి[a], మీరు ఎన్ని పెద్ద గంపలు తీసుకున్నారో కూడా మీకు గుర్తులేదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూలభాషకు మరింత అక్షరార్థంగా: ‘నాలుగు వేలమందికి చెందిన ఏడు రొట్టెల సంగతి.’'
    reason: τῶν τετρακισχιλίων అనే సంబంధవిభక్తిని అక్షరార్థంగా ‘నాలుగు వేలమందికి చెందిన’ అని కూడా అనువదించవచ్చు; ప్రధాన పాఠం సందర్భంలో ఉద్దేశించిన ఆహారం పంచిన సంఘటనను సహజంగా వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: οὐδὲ
  choice: కూడా ... లేదా?
  rationale: ముందటి వాక్యంలో మొదలైన ప్రశ్నల వరుసను కొనసాగించే οὐδὲ భావాన్ని తెలుగులో సహజంగా వాక్యాంతంలోని ‘కూడా ... లేదా?’ ద్వారా వ్యక్తం చేశాం.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: ఏడు రొట్టెల సంగతి
  rationale: ఆహారం పంచిన సందర్భంలో ἄρτοι అనేది లెక్కించగల రొట్టెలను సూచిస్తుంది; ముందటి వచనంలోని ‘గుర్తు’ అనే భావంతో సహజంగా అనుసంధానించడానికి ‘సంగతి’ చేర్చబడింది.
- source_word: τῶν τετρακισχιλίων
  choice: నాలుగు వేలమందికి పంచిన
  rationale: ఈ సంబంధవిభక్తి నాలుగు వేలమందికి ఆహారం పెట్టిన సంఘటనతో రొట్టెల సంబంధాన్ని సూచిస్తుంది. ‘పంచిన’ అనేది సందర్భంలో అంతర్లీనమైన సంబంధాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: πόσας
  choice: ఎన్ని
  rationale: σπυρίδας‌ను విశేషించే ప్రశ్నార్థక పదానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: σπυρίδας
  choice: పెద్ద గంపలు
  rationale: σπυρίς సాధారణంగా κόφινος కంటే పెద్ద గంపను సూచిస్తుంది; సువార్త వృత్తాంతంలోని పదభేదాన్ని నిలుపుకోవడానికి ‘పెద్ద’ అని పేర్కొన్నాం.
- source_word: ἐλάβετε
  choice: తీసుకున్నారో
  rationale: మిగిలిన వాటిని గంపల్లో సేకరించిన సందర్భంలో ‘తీసుకున్నారు’ మూల క్రియ యొక్క విస్తృత భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
