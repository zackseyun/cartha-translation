  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: te
  text: '“నిజంగా నేను మీతో చెబుతున్నాను: ఇక్కడ నిలబడి ఉన్నవారిలో కొందరు తన రాజ్యంలో[c] వస్తున్న మనుష్యకుమారుణ్ణి[b] చూసేవరకు మరణాన్ని ఎంతమాత్రమూ రుచిచూడరు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ఇక్కడ బలమైన నిరాకరణ ఉంది; ‘ఎట్టి పరిస్థితుల్లోనూ మరణాన్ని రుచిచూడరు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘తన రాజ్యంలో వస్తున్న మనుష్యకుమారుడు’ అనే పదబంధం రూపాంతరం, పునరుత్థానం లేదా ఉన్నతీకరణ, యెరూషలేముపై తీర్పు, లేదా అంత్యకాల రాకను సూచించవచ్చు; వాక్యం ఏ సంఘటనను ఉద్దేశించిందో స్పష్టంగా చెప్పదు.
    reason: alternative_reading
  - marker: c
    text: ‘తన పాలనలో’ లేదా ‘తన రాజాధికారంతో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: నిజంగా
  rationale: అధికారపూర్వకమైన గంభీర ధృవీకరణను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; అనవసరమైన లిప్యంతరీకరణను నివారిస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను, వర్తమాన వాక్యసూత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: ఇక్కడ నిలబడి ఉన్నవారిలో కొందరు
  rationale: గ్రీకులోని భాగసూచక భావాన్ని ‘వారిలో కొందరు’ అని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: మరణాన్ని ఎంతమాత్రమూ రుచిచూడరు
  rationale: ‘మరణాన్ని రుచిచూడడం’ అనే స్పష్టమైన బైబిలు రూపకాన్ని ఉంచుతూ, οὐ μή లోని బలమైన నిరాకరణను ‘ఎంతమాత్రమూ ... చూడరు’ ద్వారా తెలియజేస్తుంది.
- source_word: ἕως ἂν ἴδωσιν
  choice: చూసేవరకు
  rationale: భవిష్యత్తులో సంభవించే దర్శనాన్ని సూచించే కాలార్థక నిర్మాణానికి సంక్షిప్తమైన సహజ తెలుగు సమానం.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు ఉపయోగించిన స్థిరమైన స్వీయ సంబోధనను వివరణగా మార్చకుండా, దాని బైబిలు మరియు అంత్యకాల ప్రతిధ్వనులతో సహా నిలుపుతుంది.
- source_word: ἐρχόμενον
  choice: వస్తుండడం
  rationale: ‘చూడడం’కు కర్మపూరకంగా ఉన్న వర్తమాన కృదంత భావాన్ని నిలుపుతుంది; మూలంలో లేని ‘శక్తితో’ వంటి భావాన్ని చేర్చదు.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: తన రాజ్యంలో
  rationale: βασιλεία లోని రాజ్యం/పాలన భావవిస్తృతిని పూర్తిగా ఒకే అర్థానికి పరిమితం చేయకుండా, ప్రధాన అపోకలిప్టిక్ చిత్రణను నిలుపుతుంది.
theological_decisions:
- issue: ‘మనుష్యకుమారుడు తన రాజ్యంలో వస్తుండడం’ సూచించే సంఘటన
  choice: ఏ ప్రత్యేక సంఘటననూ అనువాదంలో గుర్తించకుండా మూలపదబంధాన్ని సూటిగా ఉంచడం
  alternative: రూపాంతరం, పునరుత్థానం/మహిమపరచబడడం, పెంతెకొస్తు, యెరూషలేముపై తీర్పు, లేదా అంత్యకాల రాక అని నిర్దిష్టీకరించడం
  rationale: గ్రీకు వాక్యం ఏ సంఘటనను ఉద్దేశించిందో స్పష్టంగా చెప్పదు. కాబట్టి వివాదాస్పదమైన దైవశాస్త్ర సంబంధ ఉద్రిక్తతను అనువాదమే పరిష్కరించకుండా ఉంచాలి.
- issue: βασιλεία యొక్క భావం
  choice: రాజ్యం
  alternative: పాలన లేదా రాజాధికారం
  rationale: ‘రాజ్యం’ మూలంలోని చిత్రాత్మకతను, కీలక పదసంబంధాన్ని నిలుపుతుంది; అయితే ‘పాలన’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మరణాన్ని రుచిచూడడం’ అనే మూల రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది. దీర్ఘమైన చివరి పదబంధాన్ని స్పష్టంగా చదవడానికి డాష్‌లతో పునరుద్ఘాటనగా అమర్చాం.
