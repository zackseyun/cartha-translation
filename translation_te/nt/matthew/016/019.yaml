  to: పరలోక రాజ్యపు తాళంచెవులను నీకు ఇస్తాను.[a] నీవు భూమిమీద దేనిని బంధిస్తావో అది పరలోకంలో అప్పటికే బంధించబడి ఉంటుంది;[b][c] నీవు భూమిమీద దేనిని విప్పుతావో అది పరలోకంలో అప్పటికే విప్పబడి ఉంటుంది.
