id: MAT.16.19
reference: Matthew 16:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: te
  text: పరలోక రాజ్యపు తాళంచెవులను నీకు ఇస్తాను.[a] నీవు భూమిమీద దేనిని బంధిస్తావో అది పరలోకంలో అప్పటికే బంధించబడి ఉంటుంది;[b][c] నీవు భూమిమీద దేనిని విప్పుతావో అది పరలోకంలో అప్పటికే విప్పబడి ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “పరలోకాల రాజ్యం.” మత్తయి ఈ పదబంధాన్ని తరచుగా ఉపయోగిస్తాడు.
    reason: lexical_alternative
  - marker: b
    text: “బంధించు,” “విప్పు” అనే మాటలకు నిషేధించడం, అనుమతించడం లేదా బాధ్యతలను విధించడం, తొలగించడం అనే భావాలు కూడా ఉండవచ్చు. అయితే అనువాదం గ్రీకు రూపకాన్నే నిలుపుతుంది.
    reason: cultural_note
  - marker: c
    text: సంప్రదాయ అనువాదాల్లో తరచుగా “బంధించబడుతుంది ... విప్పబడుతుంది” అని ఉంటుంది. అయితే గ్రీకు నిర్మాణం పూర్తయిన చర్య ఫలితంగా ఉండే స్థితిని సూచిస్తుంది; అందువల్ల “అప్పటికే బంధించబడి ఉంటుంది ... అప్పటికే విప్పబడి ఉంటుంది” అనే అనువాదం దాని కాలసూక్ష్మతను ప్రతిబింబిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: δώσω σοι
  choice: నీకు ఇస్తాను
  rationale: భవిష్యత్ వాగ్దానాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; దత్తివాచక పరోక్ష కర్మను ‘నీకు’గా స్పష్టంగా ఉంచుతుంది.
- source_word: κλεῖδας
  choice: తాళంచెవులను
  rationale: మూలంలోని బహువచన రూపకాన్ని వ్యాఖ్యానించి పరిమితం చేయకుండా యథాతథంగా నిలుపుతుంది.
- source_word: βασιλείας τῶν οὐρανῶν
  choice: పరలోక రాజ్యపు
  rationale: మత్తయి తరచుగా వాడే పదబంధానికి సహజమైన ప్రామాణిక తెలుగు రూపం; గ్రీకులోని అక్షరార్థ బహువచనాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: ὃ ἐὰν
  choice: దేనిని ... వో
  rationale: రెండు వాక్యభాగాల్లోని అనిర్దిష్ట సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు జతనిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: δήσῃς
  choice: బంధిస్తావో
  rationale: ‘కట్టు/బంధించు’ అనే మూల రూపకాన్ని, దాని అధికార లేదా న్యాయ సంబంధ ప్రతిధ్వనులను అతిగా వివరించకుండా కాపాడుతుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిమీద
  rationale: పరలోకంతో ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἔσται δεδεμένον
  choice: బంధించబడి ఉంటుంది
  rationale: εἰμί భవిష్యత్ రూపం మరియు పరిపూర్ణ కర్మణి కృదంతం సూచించే, పూర్తయిన చర్య ఫలితంగా కొనసాగుతున్న స్థితిని తెలుగులో సహజంగా ప్రతిబింబిస్తుంది; కాల సంబంధ సూక్ష్మతను పాదసూచికలో వివరిస్తుంది.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: పరలోకంలో
  rationale: గ్రీకు బహువచనానికి సందర్భానుగుణమైన, సాధారణ ఆధునిక తెలుగు రూపం.
- source_word: λύσῃς
  choice: విప్పుతావో
  rationale: ‘బంధించు’కు సహజమైన వ్యతిరేక జతగా ఉండి మూల రూపకాన్ని నిలుపుతుంది; ‘అనుమతించు’ అని ముందుగానే వ్యాఖ్యానించదు.
- source_word: ἔσται λελυμένον
  choice: విప్పబడి ఉంటుంది
  rationale: ముందటి వాక్యభాగానికి సమాంతరంగా, పూర్తయిన చర్య ఫలిత స్థితిని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: బంధించడం–విప్పడం సూత్రంలోని కాలాంశం మరియు దాని ధార్మిక సూచన
  choice: ‘బంధించబడి ఉంటుంది / విప్పబడి ఉంటుంది’ అని అనువదించి, గ్రీకు పరిపూర్ణ కర్మణి నిర్మాణాన్ని పాదసూచికలో స్పష్టం చేయడం
  alternative: ‘బంధించబడుతుంది / విప్పబడుతుంది’ లేదా మరింత స్పష్టంగా ‘అప్పటికే బంధించబడి ఉంటుంది / అప్పటికే విప్పబడి ఉంటుంది’
  rationale: గ్రీకు ἔσται + పరిపూర్ణ కర్మణి కృదంతం పూర్తయిన చర్య ఫలితంగా ఉండే భవిష్యత్ స్థితిని సూచించగలదు. ప్రధాన పాఠంలో సహజతను కాపాడుతూ, భూలోక చర్య పరలోక నిర్ణయాన్ని ప్రారంభిస్తుందా లేక దానికి అనుగుణంగా ఉంటుందా అనే ధార్మిక ప్రశ్నను అనువాదమే తీర్మానించకుండా పాదసూచికలో వ్యాకరణ సూక్ష్మతను తెలియజేస్తుంది.
- issue: ‘పరలోక రాజ్యపు తాళంచెవులు’ అనే రూపకం యొక్క అర్థం
  choice: ‘తాళంచెవులు’ అనే రూపకాన్ని వ్యాఖ్యానించకుండా నిలుపడం
  alternative: ‘ప్రవేశాన్ని అనుమతించే లేదా నిరాకరించే అధికారం’ లేదా ‘నిర్వహణాధికారం’
  rationale: ఈ రూపకం అధికారాన్ని సూచించినప్పటికీ, నిర్దిష్ట సంఘపాలనా లేదా మతశాఖాపరమైన వ్యవస్థను వచనంలోకి చేర్చకుండా మూలంలోని చిత్రాన్ని కాపాడుతుంది.
- issue: ‘బంధించు’ మరియు ‘విప్పు’ పదాల సాధ్యమైన అధికార సంబంధ అర్థం
  choice: ప్రధాన పాఠంలో రూపకభాషనే ఉంచడం
  alternative: ‘నిషేధించు / అనుమతించు’ లేదా ‘బాధ్యత విధించు / తొలగించు’
  rationale: ఈ క్రియలు యూదు బోధనా లేదా న్యాయ సందర్భంలో నిషేధించడం–అనుమతించడం వంటి భావాలను కలిగి ఉండవచ్చు; అయితే సందర్భం అన్ని సూక్ష్మార్థాలను ఒకదానికే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. యేసు పేతురుతో ఏకవచనంలో మాట్లాడుతున్నందున ‘నీకు/నీవు’ వాడబడింది. ‘తాళంచెవులు,’ ‘బంధించు,’ ‘విప్పు’ అనే మూల రూపకాలు వ్యాఖ్యానాత్మక విస్తరణ లేకుండా కాపాడబడ్డాయి.
