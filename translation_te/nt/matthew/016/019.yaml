review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the singular address, the keys metaphor, the Matthean ‘kingdom of heaven’ expression, and the bind/loose parallelism. However, ‘బంధించబడి ఉంటుంది / విప్పబడి ఉంటుంది’ can simply be heard as a future passive state and does not adequately convey the prior-completed force of ἔσται + perfect passive participle. Adding ‘అప్పటికే’ safely represents the future-perfect sense reflected in the English audit trail.
  naturalness: The Telugu is otherwise clear and modern. ‘పరలోకంలో అప్పటికే బంధించబడి ఉంటుంది’ and its parallel are natural enough in this elevated biblical register and make the temporal relationship explicit without awkward periphrasis.
  terminology: ‘పరలోక రాజ్యపు తాళంచెవులు,’ ‘బంధించు,’ and ‘విప్పు’ appropriately retain the source metaphors. The footnotes properly note the literal plural ‘heavens’ and possible juridical senses without imposing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: The main text does not explicitly express the prior-completed aspect of ἔσται δεδεμένον / ἔσται λελυμένον.
    rationale: The Greek future of ‘be’ with perfect passive participles is most directly represented here as ‘will already have been bound/loosed.’ The current wording can be read like the traditional simple future passive. Adding ‘అప్పటికే’ aligns the Telugu main text with the source-oriented English POB decision.
  revised_text: పరలోక రాజ్యపు తాళంచెవులను నీకు ఇస్తాను.[a] నీవు భూమిమీద దేనిని బంధిస్తావో అది పరలోకంలో అప్పటికే బంధించబడి ఉంటుంది;[b][c] నీవు భూమిమీద దేనిని విప్పుతావో అది పరలోకంలో అప్పటికే విప్పబడి ఉంటుంది.
