id: MAT.16.12
reference: Matthew 16:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: te
  text: అప్పుడు ఆయన రొట్టెల పులిసిన పిండి విషయంలో జాగ్రత్తగా ఉండమని చెప్పలేదని, కానీ పరిసయ్యుల, సద్దూకయ్యుల బోధ విషయంలో జాగ్రత్తగా ఉండమని చెప్పాడని వారు గ్రహించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: శిష్యులు యేసు మాటల అర్థాన్ని గ్రహించిన సమయాన్ని సహజంగా సూచిస్తుంది.
- source_word: συνῆκαν
  choice: గ్రహించారు
  rationale: సందర్భంలో ముందుగా అర్థం కాని మాటను చివరకు అర్థం చేసుకున్న భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὐκ εἶπεν
  choice: చెప్పలేదని
  rationale: తెలుగు పరోక్ష వాక్య నిర్మాణంలో సహజంగా ఉండి, గతంలో పలికిన హెచ్చరికను సూచిస్తుంది.
- source_word: προσέχειν
  choice: జాగ్రత్తపడమని
  rationale: హెచ్చరిక సందర్భంలో అప్రమత్తంగా ఉండాలనే భావాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τῆς ζύμης
  choice: పులిసిన పిండి గురించి
  rationale: ζύμη అనే పులియబెట్టే పిండిని సూచించే రూపకాన్ని నిలుపుతుంది; προσέχειν ἀπό నిర్మాణం తెలుగులో సహజంగా ‘గురించి జాగ్రత్తపడు’గా వ్యక్తమవుతుంది.
- source_word: τῶν ἄρτων
  choice: రొట్టెల
  rationale: గ్రీకు బహువచనాన్ని తెలుగులో సహజంగా నిలుపుతూ, ఇది అక్షరార్థమైన రొట్టెల సందర్భమని తెలియజేస్తుంది.
- source_word: ἀλλὰ
  choice: …కాదని, …గురించి చెప్పాడని
  rationale: గ్రీకు వ్యతిరేక నిర్మాణాన్ని తెలుగులో సహజమైన ‘కాదు—అది’ భావంతో అందిస్తుంది.
- source_word: διδαχῆς
  choice: బోధించే బోధ
  rationale: మొదటి పదం సమూహాలు బోధించే చర్యను స్పష్టం చేస్తే, రెండవది διδαχή యొక్క విషయార్థమైన ‘బోధ’ను నేరుగా నిలుపుతుంది.
- source_word: Φαρισαίων
  choice: పరిసయ్యులూ
  rationale: తెలుగులో స్థిరపడిన బైబిలు సమూహనామ రూపాన్ని ఉపయోగిస్తుంది.
- source_word: Σαδδουκαίων
  choice: సద్దూకయ్యులూ
  rationale: తెలుగులో స్థిరపడిన బైబిలు సమూహనామ రూపాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: ‘పులిసిన పిండి’ రూపకార్థం
  choice: వాక్యం స్వయంగా ఇచ్చిన వివరణ మేరకు దాన్ని పరిసయ్యులూ సద్దూకయ్యులూ బోధించే బోధతో అనుసంధానించడం
  alternative: ప్రధాన పాఠ్యంలోనే దాన్ని ‘కపటత్వం,’ ‘చెడు బోధ,’ లేదా ‘భ్రష్ట బోధ’ అని విస్తరించడం
  rationale: ఈ వాక్యం రూపకాన్ని ‘బోధ’గా వివరిస్తుంది గాని, ఆ బోధ యొక్క నైతిక స్వభావాన్ని మరింత నిర్దిష్టంగా పేర్కొనదు. అందువల్ల అదనపు సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను కాపాడే శైలి. గ్రీకు బహువచనమైన τῶν ἄρτωνను ప్రధాన పాఠ్యంలోనే ‘రొట్టెల’గా నిలిపి, పాదటిప్పణిలో పదబద్ధ నిర్మాణాన్ని స్పష్టం చేశాం.
