revisions:
- from: అప్పుడు వారు, రొట్టెల పులిసిన పిండిని[a] గురించి జాగ్రత్తపడమని ఆయన చెప్పలేదని, పరిసయ్యులూ సద్దూకయ్యులూ బోధించే బోధ గురించి చెప్పాడని గ్రహించారు.
  to: అప్పుడు ఆయన రొట్టెల పులిసిన పిండి విషయంలో జాగ్రత్తగా ఉండమని చెప్పలేదని, కానీ పరిసయ్యుల, సద్దూకయ్యుల బోధ విషయంలో జాగ్రత్తగా ఉండమని చెప్పాడని వారు గ్రహించారు.
  rationale: The revision preserves the Greek temporal progression, the explicit contrast, and the warning force of προσέχειν on both sides of the contrast. It removes the redundant “బోధించే బోధ” while retaining the source’s ambiguity about the particular character of the teaching. The footnote continues to document that the Greek noun for bread/loaves is plural.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the contrast between literal leaven associated with bread/loaves and the teaching of the Pharisees and Sadducees. However, it does not explicitly carry the warning sense of προσέχειν through the second half, and “బోధించే బోధ” redundantly expands the single Greek noun διδαχή.
  naturalness: “పరిసయ్యులూ సద్దూకయ్యులూ బోధించే బోధ” is awkward and unnecessarily repetitive in modern standard Telugu. Repeating “జాగ్రత్తగా ఉండమని” across the contrasted objects makes the ellipsis explicit and produces a clear, natural sentence.
  terminology: “పులిసిన పిండి” suitably retains the biblical metaphor for ζύμη, while “బోధ” is an accurate, non-sectarian rendering of διδαχή. The established forms “పరిసయ్యులు” and “సద్దూకయ్యులు” are appropriate.
  issues:
  - severity: medium
    issue: The warning predicate is not retained in the contrasting clause.
    rationale: The Greek contrast is between being on guard against literal leaven and being on guard against the groups’ teaching. The draft’s “బోధ గురించి చెప్పాడని” can sound as though Jesus merely spoke about their teaching, rather than warning the disciples to beware of it.
  - severity: medium
    issue: “బోధించే బోధ” is redundant and adds an unnecessary verbal formulation.
    rationale: διδαχῆς is simply “teaching.” The genitives “of the Pharisees and Sadducees” already identify whose teaching is meant; “బోధించే” is not required by the source and is stylistically cumbersome.
  revised_text: అప్పుడు ఆయన రొట్టెల పులిసిన పిండి విషయంలో జాగ్రత్తగా ఉండమని చెప్పలేదని, కానీ పరిసయ్యుల, సద్దూకయ్యుల బోధ విషయంలో జాగ్రత్తగా ఉండమని చెప్పాడని వారు గ్రహించారు.
  revised_footnotes:
  - marker: a
    text: గ్రీకులో ఇక్కడ “రొట్టెలు” అనే పదం బహువచనంలో ఉంది; పదబద్ధంగా, “రొట్టెల పులిసిన పిండి.”
    reason: lexical_alternative
  revision_rationale: The revision preserves the Greek temporal progression, the explicit contrast, and the warning force of προσέχειν on both sides of the contrast. It removes the redundant “బోధించే బోధ” while retaining the source’s ambiguity about the particular character of the teaching. The footnote continues to document that the Greek noun for bread/loaves is plural.
