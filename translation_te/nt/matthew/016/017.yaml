reference: Matthew 16:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: te
  text: 'యేసు అతనికి జవాబుగా ఇలా అన్నాడు: “సీమోను బర్‌యోనా,[a] నీవు ధన్యుడివి! ఎందుకంటే ఈ సంగతిని నీకు మాంసమూ రక్తమూ[b] బయలుపరచలేదు; కానీ పరలోకంలో ఉన్న నా తండ్రి బయలుపరచాడు.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే ‘యోనా కుమారుడైన సీమోను.’ గ్రీకు పాఠం అరమాయిక్ పితృనామ రూపమైన ‘బర్‌యోనా’ను నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘మాంసమూ రక్తమూ’; ఇది మనుషులను లేదా కేవలం మానవ మూలాన్ని సూచించే నుడికారం.
    reason: cultural_note
  - marker: c
    text: గ్రీకులో అక్షరార్థంగా ‘ఆకాశాలలో’ (బహువచనం); తెలుగులో సహజమైన గౌరవప్రద ప్రయోగంగా ‘పరలోకంలో’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: అప్పుడు యేసు అతనితో ఇలా అన్నాడు
  rationale: కృదంతం–సమాపక క్రియలతో ఉన్న ‘జవాబిచ్చి చెప్పాడు’ అనే సెమిటిక్ ప్రభావిత నిర్మాణాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. సందర్భం ఇది ప్రతిస్పందన అని స్పష్టం చేస్తుంది; δέ కథన కొనసాగింపుగా ‘అప్పుడు’ అని ఇవ్వబడింది.
- source_word: Μακάριος
  choice: ధన్యుడివి
  rationale: ‘సంతోషంగా ఉన్నావు’ అనే మానసిక భావానికే పరిమితం కాకుండా, యేసు ప్రకటిస్తున్న దైవానుగ్రహ స్థితిని తెలియజేస్తుంది.
- source_word: Σίμων Βαριωνᾶ
  choice: సీమోను బర్‌యోనా
  rationale: గ్రీకు పాఠంలో నిలుపబడిన అరమాయిక్ పితృనామ రూపాన్ని లిప్యంతరీకరించి సంరక్షిస్తుంది; దాని అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న ధన్యత్వ ప్రకటనకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: σὰρξ καὶ αἷμα
  choice: మాంసమూ రక్తమూ
  rationale: మానవులను లేదా కేవలం మానవ మూలాన్ని సూచించే మూలభాషా నుడికారాన్ని యథాశక్తి నిలుపుతుంది.
- source_word: ἀπεκάλυψέν σοι
  choice: ఈ సంగతిని నీకు బయలుపరచింది
  rationale: ముందటి వచనంలోని పేతురు ఒప్పుకోలును సూచించే అవ్యక్త కర్మను తెలుగులో సహజత కోసం ‘ఈ సంగతిని’ అని స్పష్టం చేసింది; ‘బయలుపరచింది’ దైవిక ప్రకటన భావాన్ని నిలుపుతుంది.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: కాదు; ... నా తండ్రే
  rationale: మానవ మూలానికీ తండ్రి నుండి వచ్చిన ప్రకటనకూ మధ్యనున్న బలమైన వ్యత్యాసాన్ని ‘కాదు’ మరియు నిశ్చయార్థక ‘ఏ’తో వ్యక్తం చేస్తుంది.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: పరలోకంలో ఉన్న
  rationale: గ్రీకులో బహువచనం ఉన్నప్పటికీ, ఆధునిక ప్రామాణిక తెలుగులో సహజమైన గౌరవప్రద ప్రయోగం ‘పరలోకంలో’.
theological_decisions:
- issue: పేతురు ఒప్పుకోలుకు మూలం
  choice: ‘మాంసమూ రక్తమూ’ అనే విస్తృత నుడికారాన్ని నిలిపి, అది మానవ మూలం నుండి కాక తండ్రి బయలుపరచడం వల్ల వచ్చిందని అనువదించడం
  alternative: దీనిని ప్రత్యేకంగా పేతురు సొంత మానవ తర్కం లేదా ఒక మానవ బోధకుని బోధ అని పరిమితం చేయడం
  rationale: వాక్యం మానవ మూలాన్ని దైవిక బయలుపరచడంతో వ్యత్యాసపరుస్తుంది; అయితే ఏ ఒక్క మానవ మార్గాన్ని ప్రత్యేకంగా నిర్దేశించదు. అందుచేత అనువాదం ఆ విస్తృతతనూ వేదాంతపరమైన ఉద్వేగాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘బర్‌యోనా,’ ‘మాంసమూ రక్తమూ’ వంటి మూలపాఠ విశిష్టతలను ప్రధాన పాఠంలో నిలిపి, అవసరమైన వివరణలను పాదసూచికల్లో ఇచ్చాం.
