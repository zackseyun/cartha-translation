id: MAT.16.21
reference: Matthew 16:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: te
  text: అప్పటి నుండి యేసు, తాను యెరూషలేముకు వెళ్లి, పెద్దలు, ప్రధాన యాజకులు, ధర్మశాస్త్ర పండితుల చేత ఎన్నో బాధలు అనుభవించి[a][b], చంపబడి, మూడవ రోజున లేపబడవలసి ఉందని తన శిష్యులకు తెలియజేయడం మొదలుపెట్టాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎంతో బాధ అనుభవించి.” గ్రీకులో అక్షరార్థంగా “అనేక విషయాలు అనుభవించి” అని ఉంది; ఇది వివిధ రకాల బాధలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పెద్దలు, ప్రధాన యాజకులు, ధర్మశాస్త్ర పండితుల చేతుల్లో ఎన్నో బాధలు అనుభవించి.”
    reason: alternative_reading
  - marker: c
    text: 'లేదా, “లేవవలసి.” గ్రీకు రూపం కర్మణి ప్రయోగంలో ఉంది: “లేపబడవలసి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: అప్పటి నుండి
  rationale: కథనంలో ఒక కొత్త మలుపు మొదలవుతున్నదని సూచించే కాలార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἤρξατο δεικνύειν
  choice: తెలియజేయడం మొదలుపెట్టాడు
  rationale: ‘చూపించడం మొదలుపెట్టాడు’ కంటే తెలుగులో సహజంగా ఉండి, విషయాన్ని శిష్యులకు స్పష్టం చేయడం అనే సందర్భార్థాన్ని వ్యక్తం చేస్తుంది.
- source_word: δεῖ
  choice: వలసి ఉంది
  rationale: ఈ సంఘటనలు తప్పనిసరిగా జరగాలనే బలాన్ని నిలుపుతుంది; ఆ అవసరానికి మూలం దేవుని నిర్ణయమా, లేఖన నెరవేర్పా, మరేదైనా అనేదాన్ని వాక్యంలో అదనంగా నిర్ణయించదు.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: యెరూషలేముకు వెళ్లి
  rationale: గమ్యస్థానం వైపు ప్రయాణాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πολλὰ παθεῖν
  choice: ఎన్నో బాధలు అనుభవించి
  rationale: గ్రీకు బహువచనం సూచించే విభిన్న బాధలను తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: πρεσβυτέρων
  choice: పెద్దలు
  rationale: ఆ కాలపు యూదా నాయకత్వ వర్గాన్ని సూచించే స్థిరమైన, సులభంగా అర్థమయ్యే పదం.
- source_word: ἀρχιερέων
  choice: ప్రధాన యాజకులు
  rationale: ఒకేసారి అనేకమంది మహాయాజకులు ఉన్నారనే భావం రాకుండా, యాజక నాయకవర్గాన్ని సరిగ్గా సూచిస్తుంది.
- source_word: γραμματέων
  choice: ధర్మశాస్త్ర పండితులు
  rationale: వారి లేఖన/ధర్మశాస్త్ర నైపుణ్యాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘శాస్త్రులు’ కంటే పారదర్శకంగా ఉంటుంది.
- source_word: ἀποκτανθῆναι
  choice: చంపబడి
  rationale: గ్రీకు కర్మణి రూపాన్ని సంక్షిప్తంగా, నేరుగా నిలుపుతుంది.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: మూడవ రోజున లేపబడవలసి
  rationale: కాల సూచనతో పాటు గ్రీకు కర్మణి రూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: δεῖ సూచించే తప్పనిసరితనానికి మూలం
  choice: ‘వలసి ఉంది’ అని మాత్రమే అనువదించడం
  alternative: దేవుని నిర్ణయం ప్రకారం జరగాలి అని విస్తరించడం
  rationale: గ్రీకు వాక్యం తప్పనిసరితనాన్ని బలంగా చెబుతుంది గాని, ఈ ఉపవాక్యంలో దాని మూలాన్ని ప్రత్యేకంగా వివరించదు.
- issue: ἐγερθῆναι యొక్క కర్మణి ప్రయోగం
  choice: లేపబడవలసి
  alternative: లేవవలసి
  rationale: మూలంలోని కర్మణి రూపాన్ని కాపాడి, యేసును ఎవరు లేపుతారు అనే విషయాన్ని ఈ వాక్యానికి మించి వివరణాత్మకంగా చేర్చకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ధర్మశాస్త్ర పండితులు’ సాధారణ పాఠకులకు ‘γραμματεῖς’ పాత్రను స్పష్టంగా చేస్తుంది. మూలంలోని దీర్ఘ సమన్వయ నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగు పఠన సౌలభ్యం కోసం కృదంత వరుసను ఉపయోగించాం.
