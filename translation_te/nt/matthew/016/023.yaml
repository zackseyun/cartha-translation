revisions:
- from: అయితే ఆయన వెనక్కి తిరిగి పేతురుతో, “నా వెనక్కి పో, సాతానా![a] నీవు నాకు అడ్డంకిగా ఉన్నావు. ఎందుకంటే నీవు దేవునికి సంబంధించిన వాటిమీద మనసు పెట్టడం లేదు; మనుషులకు సంబంధించిన వాటిమీదనే మనసు పెడుతున్నావు[b]” అని అన్నాడు.
  to: 'అయితే ఆయన వెనక్కి తిరిగి పేతురుతో ఇలా అన్నాడు: “నా వెనుకకు పో, సాతానా![a] నీవు నాకు అడ్డంకివి. ఎందుకంటే నీవు దేవునికి సంబంధించిన వాటిపై కాదు, మనుషులకు సంబంధించిన వాటిపై మనసు పెడుతున్నావు.”[b]'
  rationale: The revision clarifies the spatial command without resolving its interpretive force, makes the God/human contrast match the single Greek verb more closely, and limits the footnote to a lexical clarification rather than an interpretive expansion.
