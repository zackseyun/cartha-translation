review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the turning, the direct address “Satan,” the spatial sense of ὀπίσω μου, and the broad contrast between what is of God and what is human. However, the mixed construction “మనసు పెట్టడం లేదు ... మనసు పెడుతున్నావు” is less faithful to the Greek’s single contrastive φρονεῖς clause and is stylistically uneven.
  naturalness: “నా వెనక్కి పో” can be heard as ‘go backward’ in modern Telugu. “నా వెనుకకు పో” more clearly conveys the required spatial sense, ‘go behind me.’ The revised final clause is more idiomatic and compact.
  terminology: “సాతానా,” “అడ్డంకి,” and the broad paired expressions for τὰ τοῦ θεοῦ / τὰ τῶν ἀνθρώπων are appropriate. The explanatory note should not add ‘merely’ or narrow the phrase to a particular kind of human concern, since the Greek remains broad.
  issues:
  - severity: medium
    issue: 'The final contrast uses inconsistent verbal forms: “మనసు పెట్టడం లేదు ... మనసు పెడుతున్నావు.”'
    rationale: 'The Greek has one negated verb governing a contrast: ‘you do not set your mind on the things of God, but on human things.’ Telugu can express this naturally as ‘Xపై కాదు, Yపై మనసు పెడుతున్నావు.’'
  - severity: low
    issue: “నా వెనక్కి పో” may suggest moving backward rather than taking a position behind Jesus.
    rationale: “నా వెనుకకు పో” better preserves the spatial force of ὀπίσω μου while retaining the rebuke’s ambiguity and discipleship resonance.
  - severity: low
    issue: Footnote b adds “కేవలం” and specifies ‘human perspective or concerns.’
    rationale: Those explanations are possible interpretations, but τὰ τῶν ἀνθρώπων is broad. A literal lexical note preserves that breadth.
