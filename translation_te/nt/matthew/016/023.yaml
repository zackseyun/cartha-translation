id: MAT.16.23
reference: Matthew 16:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: te
  text: 'అయితే ఆయన వెనక్కి తిరిగి పేతురుతో ఇలా అన్నాడు: “నా వెనుకకు పో, సాతానా![a] నీవు నాకు అడ్డంకివి. ఎందుకంటే నీవు దేవునికి సంబంధించిన వాటిపై కాదు, మనుషులకు సంబంధించిన వాటిపై మనసు పెడుతున్నావు.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా వెనుకకు పో’ అనే గ్రీకు మాటను సంప్రదాయంగా ‘నా వెనకకు పో, సాతానా!’ అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మనుషుల విషయాలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: వెనక్కి తిరిగి
  rationale: ఈ సందర్భంలో శరీరాన్ని పేతురు వైపు తిప్పడాన్ని సూచించే క్రియారూపం. ‘వెనక్కి తిరిగి’ సహజమైన తెలుగులో ఆ కదలికను స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ὕπαγε ὀπίσω μου
  choice: నా వెనక్కి పో
  rationale: ὕπαγε లోని ‘పో’ అనే ఆజ్ఞను, ὀπίσω μου లోని స్థలసంబంధమైన ‘నా వెనుక’ భావాన్ని రెండింటినీ నిలుపుతుంది. ఈ మాటలో తిరస్కారంతోపాటు యేసు వెనుక ఉండవలసిన స్థానాన్ని సూచించే అవకాశాన్ని కూడా అనువాదం మూసివేయదు.
- source_word: Σατανᾶ
  choice: సాతానా
  rationale: ఇది సంబోధనా రూపం. ‘విరోధీ’ అని అర్థవివరణ చేయకుండా, మూలంలోని పదునును మరియు సాతాను అనే గుర్తింపుతో ఉన్న గ్రంథసంబంధ ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: σκάνδαλον
  choice: అడ్డంకి
  rationale: ఒకరు ముందుకు సాగకుండా అడ్డుపడే దానిని సూచించే రూపకాన్ని ఆధునిక పాఠకులకు సహజంగా అందిస్తుంది. ‘తొట్రుపాటు’ అనేది తెలుగులో ఇక్కడ అస్పష్టంగా ఉండవచ్చు.
- source_word: ἐμοῦ
  choice: నాకు
  rationale: σκάνδαλον తో కలిసి, అడ్డంకి ఎవరికి ఏర్పడుతుందో తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: φρονεῖς
  choice: మనసు పెట్టడం / మనసు పెడుతున్నావు
  rationale: ఇది కేవలం ఒక ఆలోచనను కాక, వ్యక్తి దృష్టి, వైఖరి, ఆసక్తి ఏవైపు ఉన్నాయో సూచిస్తుంది. పునరుక్తి ద్వారా దేవునికి సంబంధించినవి—మనుషులకు సంబంధించినవి అనే వ్యతిరేకత నిలుస్తుంది.
- source_word: τὰ τοῦ θεοῦ
  choice: దేవునికి సంబంధించిన వాటి
  rationale: మూలంలోని విస్తృతమైన, కొంత నిర్దిష్టీకరించని భావాన్ని కాపాడుతుంది; ‘దేవుని సంకల్పం’ లేదా ‘దేవుని ప్రయోజనాలు’ అని ఒకే అర్థానికి పరిమితం చేయదు.
- source_word: τὰ τῶν ἀνθρώπων
  choice: మనుషులకు సంబంధించిన వాటి
  rationale: ἀνθρώπων ఇక్కడ మానవాళిని సాధారణంగా సూచిస్తుంది. ‘మనుషులు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సామూహిక పదం; దేవునికి సంబంధించిన వాటితో ఉన్న సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పేతురును ‘సాతానా’ అని సంబోధించడం యొక్క భావం
  choice: ‘సాతానా’ అనే ప్రత్యక్ష సంబోధనను యథాతథంగా ఉంచడం
  alternative: ‘విరోధీ’ అని సాధారణ అర్థంలో అనువదించడం; లేదా పేతురు ద్వారా పనిచేస్తున్న సాతానునే యేసు ఉద్దేశించాడని స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యం పేతురుకు చేసిన గద్దింపును స్పష్టంగా ఇస్తుంది; అయితే పేతురే సాతాను అని గుర్తిస్తున్నాడా, అతడు సాతాను తరహా విరోధక పాత్ర పోషిస్తున్నాడా, లేక అతని ద్వారా సాతాను ప్రలోభం వస్తోందా అన్నది వివరించదు. అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: ὀπίσω μου అనే మాటలోని స్థలార్థం మరియు శిష్యత్వ ప్రతిధ్వని
  choice: ‘నా వెనక్కి పో’ అని అనువదించడం
  alternative: ‘నా దగ్గరనుండి వెళ్లిపో’ అని కేవలం తొలగిపోవాలనే భావంగా అనువదించడం
  rationale: ‘నా వెనుక’ అనే మూల స్థలార్థాన్ని కాపాడటం వల్ల గద్దింపు యొక్క బలమూ, యేసును ముందుండనిచ్చి శిష్యుడు వెనుక నడవాలనే సందర్భసంబంధ ప్రతిధ్వనియు రెండూ సాధ్యంగా ఉంటాయి.
- issue: τὰ τοῦ θεοῦ మరియు τὰ τῶν ἀνθρώπων యొక్క విస్తృతి
  choice: ‘దేవునికి సంబంధించినవి’ మరియు ‘మనుషులకు సంబంధించినవి’ అనే సమాంతర, విస్తృత పదబంధాలు
  alternative: ‘దేవుని ప్రయోజనాలు’ మరియు ‘మానవ చింతలు’ అని వివరణాత్మకంగా కుదించడం
  rationale: మూలం నిర్దిష్టంగా ‘సంకల్పాలు,’ ‘ప్రయోజనాలు,’ లేదా ‘చింతలు’ అని చెప్పదు. విస్తృత పదబంధాలు సందర్భంలోని భావాన్ని నిలుపుతూ అనవసరమైన సిద్ధాంత వివరణను చేర్చవు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. గద్దింపు యొక్క తీవ్రతను తగ్గించలేదు. ‘అడ్డంకి’ సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఎంచుకోగా, దేవుని విషయాలు—మనుషుల విషయాలు అనే మూల వ్యతిరేకతను సమాంతర నిర్మాణంతో నిలిపాం.
