id: MAT.16.13
reference: Matthew 16:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: te
  text: 'యేసు ఫిలిప్పీ కైసరయ ప్రాంతానికి వచ్చినప్పుడు, తన శిష్యులను ఇలా అడిగాడు: “మనుష్యకుమారుడు[a] ఎవరని ప్రజలు చెబుతున్నారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మనుష్యకుమారుడు” అనేది యేసు తనను తాను సూచించుకోవడానికి విశేషంగా ఉపయోగించిన మాట. దీనిని “మానవ కుమారుడు” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: వచ్చినప్పుడు
  rationale: అనంతర క్రియను నేపథ్యంగా ఉంచే aorist participle భావాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంతో తెలిపింది. δέ యొక్క స్వల్ప దృశ్యమార్పు సందర్భంలోనే వ్యక్తమవుతుంది కాబట్టి ప్రత్యేకంగా ‘అప్పుడు’ లేదా ‘అయితే’ చేర్చలేదు.
- source_word: εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου
  choice: ఫిలిప్పు కైసరయ ప్రాంతానికి
  rationale: μέρη ఇక్కడ అక్షరార్థమైన ‘భాగాలు’ కాక పరిసర ప్రాంతాన్ని సూచిస్తుంది. స్థలాన్ని ఇతర కైసరయ పట్టణాలనుంచి వేరుచేసేలా గ్రీకు నామబంధాన్ని సహజ తెలుగులో ‘ఫిలిప్పు కైసరయ’గా ఇచ్చింది.
- source_word: ἠρώτα
  choice: అడిగాడు
  rationale: గ్రీకు imperfect క్రియకు కొనసాగుతున్న లేదా ప్రారంభమైన చర్య ఛాయ ఉండవచ్చు. అయితే తెలుగులో ‘అడుగుతూ ఉన్నాడు’ ఈ ఒక్క ప్రత్యక్ష ప్రశ్న సందర్భంలో అసహజంగా వినిపించేందున కథనానికి సహజమైన భూతకాల రూపాన్ని ఎంచుకుంది.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: తన శిష్యులను
  rationale: μαθηταίకు సువార్తల సందర్భంలో స్థిరమైన, స్పష్టమైన తెలుగు పదం ‘శిష్యులు’; reflexive భావానికి ‘తన’ సహజంగా సరిపోతుంది.
- source_word: λέγων
  choice: ఇలా
  rationale: ప్రత్యక్ష ప్రశ్నను పరిచయం చేసే గ్రీకు participleను తెలుగులో పదేపదే ‘అంటూ’ అని పెట్టకుండా, ‘ఇలా అడిగాడు’ అనే సహజ నిర్మాణంలో సమ్మిళితం చేసింది.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι
  choice: ఎవరని ప్రజలు చెబుతున్నారు
  rationale: ἄνθρωποι ఇక్కడ పురుషులను మాత్రమే కాక సాధారణంగా ప్రజలను సూచిస్తుంది. గ్రీకు indirect-discourse నిర్మాణాన్ని సహజ తెలుగు ప్రశ్నారూపంలో అందించింది.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు స్వీయసూచనగా ఉపయోగించే స్థిరమైన బిరుదును, దానియేలు 7తో ఉండగల అంతర్గ్రంథ సంబంధాన్ని మరియు దాని ఉద్దేశపూర్వక భావవిస్తృతిని కాపాడే సంప్రదాయ తెలుగు రూపం.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే స్వీయసూచన అనువాదం
  choice: మనుష్యకుమారుడు
  alternative: మానవ కుమారుడు / మానవుడు
  rationale: ఈ మాట సాధారణ మానవత్వాన్ని సూచించగలిగినా, సువార్తల్లో యేసు ప్రత్యేక స్వీయసూచనగా మరియు దానియేలు 7 ప్రతిధ్వనులతో కనిపిస్తుంది. ‘మనుష్యకుమారుడు’ ఆ అంతర్గ్రంథ సంబంధాన్నీ, బిరుదు మరియు సాధారణ వ్యక్తీకరణ మధ్యనున్న భావ ఉద్రిక్తతనూ ముందుగానే పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన శైలిని ఉపయోగించింది. ‘ఫిలిప్పు కైసరయ’ మరియు ‘మనుష్యకుమారుడు’ వంటి స్థిరమైన బైబిలు పదబంధాలను నిలుపుతూ, పాతకాలపు విభక్తి రూపాలు మరియు అనవసర పదేపదే అనువాదాన్ని నివారించింది.
