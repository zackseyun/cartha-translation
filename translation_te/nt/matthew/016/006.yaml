id: MAT.16.6
reference: Matthew 16:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: te
  text: అయితే యేసు వారితో, “జాగ్రత్తగా ఉండండి; పరిసయ్యుల, సద్దూకయ్యుల పులియబెట్టే పదార్థం నుండి అప్రమత్తంగా ఉండండి” అని చెప్పాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి సందర్భంతో స్వల్ప వ్యత్యాసాన్ని లేదా కథన మలుపును సూచిస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ దీనిని సహజంగా తెలియజేస్తుంది.
- source_word: εἶπεν αὐτοῖς
  choice: వారితో … అని చెప్పాడు
  rationale: λέγω క్రియను, పరోక్ష కర్మను తెలుగులో సహజంగానూ మూలానికి పారదర్శకంగానూ వ్యక్తం చేస్తుంది.
- source_word: Ὁρᾶτε
  choice: జాగ్రత్తగా చూసుకోండి
  rationale: ఇక్కడ ὁράω ఆజ్ఞారూపం కేవలం చూడడాన్ని కాక హెచ్చరికతో మెలకువగా ఉండడాన్ని సూచిస్తుంది.
- source_word: προσέχετε
  choice: అప్రమత్తంగా ఉండండి
  rationale: మొదటి ఆజ్ఞను బలపరిచే రెండవ హెచ్చరిక; రెండు ఆజ్ఞల అలంకారాత్మక పునరుక్తిని నిలుపుతుంది.
- source_word: ἀπὸ
  choice: విషయంలో
  rationale: హెచ్చరించడం లేదా కాపాడుకోవడం అనే భావంతో వచ్చిన ἀπόను తెలుగులో సహజంగా ‘విషయంలో … అప్రమత్తంగా ఉండండి’ అని వ్యక్తం చేయవచ్చు.
- source_word: ζύμης
  choice: పులిసిన పిండి
  rationale: రొట్టె పిండిని పులియజేసే పాత పిండిని సూచించే రూపకాన్ని నిలుపుతుంది; ‘బోధ’ లేదా ‘ప్రభావం’ అని ముందుగానే విప్పి చెప్పదు.
- source_word: Φαρισαίων
  choice: పరిసయ్యుల
  rationale: ఈ యూదు మతవర్గం పేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: Σαδδουκαίων
  choice: సద్దూకయ్యుల
  rationale: ఈ యూదు మతవర్గం పేరుకు తెలుగులో స్థిరపడిన రూపం.
theological_decisions:
- issue: ‘పులిసిన పిండి’ అనే రూపక భావం
  choice: ముఖ్య వాక్యంలో రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: ‘బోధ’ లేదా ‘ప్రభావం’ అని నేరుగా అనువదించడం
  rationale: తరువాతి సందర్భంలో యేసు ఈ రూపకాన్ని వారి బోధతో సంబంధపెట్టి వివరిస్తాడు; అయితే ఈ వచనంలో ζύμη అనే రూపక పదమే ఉంది. దానిని ఇక్కడే విప్పి చెప్పడం మూలంలోని క్రమాన్ని, ఉద్దేశపూర్వక అస్పష్టతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభమైన శైలి. గ్రీకులోని రెండు హెచ్చరికాత్మక ఆజ్ఞలను ‘జాగ్రత్తగా చూసుకోండి, అప్రమత్తంగా ఉండండి’ అని నిలుపుతూ, రూపకాన్ని ప్రధాన వాక్యంలో వివరణతో భర్తీ చేయలేదు.
