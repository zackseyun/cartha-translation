  source_fidelity: మూల గ్రీకులోని ద్వంద్వ హెచ్చరికను, అలాగే ζύμη అనే రూపకాన్ని ప్రధాన వాక్యంలో నిలుపడం అవసరం. ముసాయిదాలోని ‘పులిసిన పిండి’ సాధారణంగా పులియబెట్టబడిన పిండినే సూచించగలదు; ఇక్కడ హెచ్చరికకు గురయ్యే ‘పులియబెట్టే పదార్థం/పులుపు’ అనే భావాన్ని తక్కువ స్పష్టంగా చేస్తుంది. ‘విషయంలో’ కూడా ἀπόతో కూడిన దూరంగా ఉండమనే హెచ్చరికను బలహీనపరుస్తుంది.
