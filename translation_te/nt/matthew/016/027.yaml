id: MAT.16.27
reference: Matthew 16:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: te
  text: ఎందుకంటే మనుష్యకుమారుడు తన తండ్రి మహిమలో తన దూతలతో రాబోతున్నాడు[a]; అప్పుడు ఆయన ప్రతి ఒక్కరికి వారి క్రియను బట్టి తిరిగి చెల్లిస్తాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వస్తాడు’ లేదా ‘రావడానికి సిద్ధంగా ఉన్నాడు.’ గ్రీకులో ‘రాబోతున్నాడు’ అనే భావం ఉంది; అది రాక ఆసన్నంగా లేదా సంభవించబోయేదిగా ఉందని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రతి ఒక్కరు చేసినదానిని బట్టి వారికి తిరిగి చెల్లిస్తాడు.’ గ్రీకులో ‘క్రియ/చర్య’ ఏకవచనంలో ఉంది; అది ప్రతి వ్యక్తి ప్రవర్తనను పంపిణీ భావంతో సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει
  choice: త్వరలో రాబోతున్నాడు
  rationale: μέλλω + infinitiveలోని సమీపత లేదా ఆసన్నత భావాన్ని సాధారణ భవిష్యత్తుగా చదును చేయకుండా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని తెలిపే γάρ యొక్క వివరణాత్మక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: ఈ స్వీయ-సంబోధనకు స్థిరపడిన తెలుగు రూపం; దాని దానియేలు గ్రంథ సంబంధ ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: తన తండ్రి మహిమలో
  rationale: ἐν సూచించే పరిధి లేదా ప్రత్యక్షీకరణ భావాన్ని ‘మహిమలో’ అని, సంబంధాన్ని ‘తన తండ్రి’ అని సహజంగా నిలుపుతుంది.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: తన దూతలతో కలిసి
  rationale: μετά + genitiveలోని సహవాస భావాన్నీ, αὐτοῦలోని స్వామ్య సంబంధాన్నీ స్పష్టంగా తెలుపుతుంది.
- source_word: ἀποδώσει
  choice: ప్రతిఫలం ఇస్తాడు
  rationale: తీర్పు సందర్భంలో తగినదాన్ని తిరిగి ఇవ్వడం లేదా చెల్లించడం అనే న్యాయపరమైన భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ఇది కేవలం సానుకూల బహుమానానికే పరిమితం కాదు.
- source_word: ἑκάστῳ
  choice: ప్రతి ఒక్కరికి
  rationale: దత్తివిభక్తి ఏకవచనంలోని వ్యక్తిగత, పంపిణీ భావాన్ని నిలుపుతుంది.
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: వారి వారి క్రియ ప్రకారం
  rationale: πρᾶξις యొక్క ఏకవచన రూపాన్ని ‘క్రియ’గా నిలుపుతూ, ἑκάστῳతో ఉన్న పంపిణీ సంబంధాన్ని తెలుగులో సహజమైన ‘వారి వారి’ ద్వారా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: మనుష్యకుమారుని రాక విషయంలో μέλλει యొక్క అంత్యకాల సమీపత భావం
  choice: ‘త్వరలో రాబోతున్నాడు’ అని సమీపత భావాన్ని నిలుపడం
  alternative: ‘వస్తాడు’ లేదా ‘రాబోతున్నాడు’
  rationale: మూలంలో μέλλω + infinitive ఆసన్నత భావాన్ని జోడిస్తుంది. కాలనిర్ణయానికి సంబంధించిన వేదాంత ఉద్రిక్తతను అనువాదంలో తొలగించకుండా ఉంచడం సముచితం.
- issue: క్రియ ప్రకారం తీర్పు మరియు ప్రతిఫలం
  choice: ‘ప్రతి ఒక్కరికి వారి వారి క్రియ ప్రకారం ప్రతిఫలం ఇస్తాడు’
  alternative: ‘ప్రతి ఒక్కరు చేసినదాని ప్రకారం వారికి తిరిగి చెల్లిస్తాడు’
  rationale: వాక్యం వ్యక్తిగత క్రియను బట్టి తగిన ప్రతిఫలం ఇవ్వబడుతుందని చెబుతుంది. విస్తృతమైన సిద్ధాంత వ్యవస్థను ఇందులోకి చేర్చకుండా, న్యాయపరమైన పరస్పర ఫలిత భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు సులభంగా ఉండేలా రూపొందించబడింది. ‘మనుష్యకుమారుడు,’ ‘మహిమ,’ ‘క్రియ’ వంటి బైబిలు పరంగా గుర్తించదగిన పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సహజీకరించాం. మూలంలోని సమీపత భావం మరియు క్రియ ప్రకారమైన తీర్పు రెండింటినీ సిద్ధాంతపరంగా మృదువుచేయకుండా నిలుపుకున్నాం.
