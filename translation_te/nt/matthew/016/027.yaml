review_pass:
  verdict: revise
  source_fidelity: '‘త్వరలో’ is stronger than μέλλει + infinitive necessarily requires: the construction conveys impending/intended future action, but does not itself specify a short interval. ‘రాబోతున్నాడు’ retains the marked prospective/imminent force without adding that temporal precision. ‘తిరిగి చెల్లిస్తాడు’ more directly conveys ἀποδώσει as rendering what is due in a judgment setting.'
  naturalness: The revised wording is fluent modern standard Telugu. ‘వారి క్రియను బట్టి’ naturally expresses the distributive relation of ‘each one’ to the singular Greek πρᾶξις.
  terminology: ‘మనుష్యకుమారుడు,’ ‘మహిమ,’ and ‘దూతలు’ are appropriate established biblical terminology. ‘తిరిగి చెల్లిస్తాడు’ avoids making the recompense sound exclusively like a positive reward, as ‘ప్రతిఫలం ఇస్తాడు’ can do.
  issues:
  - severity: medium
    issue: ‘త్వరలో’ adds a specifically short-time sense.
    rationale: μέλλει + infinitive marks an impending/prospective action, but the Greek wording does not lexically state ‘soon.’ Telugu ‘రాబోతున్నాడు’ adequately preserves the marked force without this added temporal specification.
  - severity: low
    issue: ‘ప్రతిఫలం ఇస్తాడు’ can be heard primarily as positive reward.
    rationale: In this judgment context, ἀποδώσει denotes rendering what is due and can encompass adverse as well as favorable recompense. ‘తిరిగి చెల్లిస్తాడు’ is more semantically neutral and judicial.
  revised_text: ఎందుకంటే మనుష్యకుమారుడు తన తండ్రి మహిమలో తన దూతలతో రాబోతున్నాడు[a]; అప్పుడు ఆయన ప్రతి ఒక్కరికి వారి క్రియను బట్టి తిరిగి చెల్లిస్తాడు[b].
