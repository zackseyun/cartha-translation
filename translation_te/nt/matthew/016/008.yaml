id: MAT.16.8
reference: Matthew 16:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: te
  text: అయితే యేసు అది గ్రహించి, “అల్పవిశ్వాసులారా, రొట్టెలు తీసుకురాలేదని మీలో మీరు ఎందుకు చర్చించుకుంటున్నారు?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: అది గ్రహించి
  rationale: గినోస్కో అనే క్రియ యొక్క భూతకాల క్రియావిశేషణ రూపం, యేసు మాట్లాడకముందే వారి చర్చను గ్రహించాడని సూచిస్తుంది. గ్రీకులో కర్మ స్పష్టంగా లేకపోయినా సందర్భాన్ని బట్టి ‘అది’ సహజంగా పూరించబడింది.
- source_word: δὲ
  choice: అయితే
  rationale: కథనంలో స్వల్ప వ్యత్యాసాన్ని, తదుపరి మలుపును సూచిస్తుంది.
- source_word: εἶπεν
  choice: అని అడిగాడు
  rationale: మూలపదానికి సాధారణ అర్థం ‘చెప్పాడు’; ఇక్కడ ప్రత్యక్ష వాక్యం ప్రశ్న కావడంతో ఆధునిక తెలుగులో ‘అడిగాడు’ సహజంగా ఉంటుంది, వాక్యకార్యాన్ని యథార్థంగా తెలియజేస్తుంది.
- source_word: Τί
  choice: ఎందుకు
  rationale: διαλογίζεσθε మరియు ὅτι ఉపవాక్యంతో కూడిన ఈ ప్రయోగంలో చర్చకు కారణం ఏమిటని అడుగుతోంది.
- source_word: διαλογίζεσθε
  choice: చర్చించుకుంటున్నారు
  rationale: శిష్యులు పరస్పరం ఆలోచనలు పంచుకుంటూ మాట్లాడుతున్న సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν ἑαυτοῖς
  choice: మీలో మీరు
  rationale: ఈ పదబంధానికి ‘మీ అంతరంగంలో’ లేదా ‘మీ మధ్య’ అనే విస్తృతి ఉంది; ఇక్కడ పరస్పర చర్చ సందర్భానికి ‘మీలో మీరు’ సరిపోతూ, కొంత మూలభాషా విస్తృతినీ నిలుపుతుంది.
- source_word: ὀλιγόπιστοι
  choice: అల్పవిశ్వాసులారా
  rationale: శిష్యుల విశ్వాసం తక్కువగా ఉందన్న ప్రత్యక్ష సంబోధనాత్మక మందలింపును సంక్షిప్తంగా, గౌరవప్రదమైన బైబిలు శైలిలో నిలుపుతుంది.
- source_word: ὅτι
  choice: రొట్టెలు తీసుకురాలేదని
  rationale: వారు చర్చిస్తున్న విషయాన్ని తెలిపే ఉపవాక్యంగా తెలుగులో ‘అని’ సహజమైన అనుసంధానం.
- source_word: ἄρτους
  choice: రొట్టెలు
  rationale: గ్రీకు బహువచనమైన ‘రొట్టెలు/రొట్టె ముద్దలు’ అనే భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: οὐκ ἐλάβετε
  choice: తీసుకురాలేదు
  rationale: λαμβάνω ప్రాథమికంగా ‘తీసుకోవడం/పొందడం’; ప్రయాణ సందర్భంలో తమతో రొట్టెలు తీసుకురాకపోవడమే ఉద్దేశం. ‘తీసుకురాలేదు’ ఆ సందర్భార్థాన్ని స్పష్టంగా, మూలానికి సమీపంగా అందిస్తుంది.
theological_decisions:
- issue: ὀλιγόπιστοι అనే యేసు మందలింపు యొక్క బలం
  choice: ‘అల్పవిశ్వాసులారా’ అని, శిష్యుల తక్కువ విశ్వాసాన్ని నేరుగా మందలించే సంబోధనగా అనువదించడం
  alternative: విశ్వాసాన్ని ప్రస్తావించకుండా కేవలం వారి అపార్థాన్ని సూచించే మృదువైన అనువాదం
  rationale: ఈ పదం ప్రస్తుత పరిస్థితిలో వారి తగినంత కాని విశ్వాసం లేదా నమ్మకాన్ని నేరుగా విమర్శిస్తుంది. దానిని విస్తృత సిద్ధాంత ప్రకటనగా మార్చకుండా మూలంలోని ఆధ్యాత్మిక ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘అల్పవిశ్వాసులారా’ ద్వారా మత్తయి సువార్తలోని ప్రత్యేక మందలింపు ధ్వని మరియు గంభీరత నిలుపబడ్డాయి. ఈ వచనానికి తెలుగు ప్రధాన పాఠంలో అవసరమైన పాదటిప్పణి లేదు; ‘తీసుకురాలేదు’ అనేది οὐκ ἐλάβετε యొక్క సందర్భానుగుణ ప్రత్యక్ష అర్థాన్ని అందిస్తుంది.
