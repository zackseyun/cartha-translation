id: MAT.16.2
reference: Matthew 16:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· ⸂Ὀψίας γενομένης λέγετε· Εὐδία, πυρράζει γὰρ ὁ οὐρανός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/002.yaml
  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: te
  text: 'కాని ఆయన జవాబిచ్చి వారితో ఇలా అన్నాడు: “సాయంకాలం అయినప్పుడు, ‘వాతావరణం బాగుంటుంది; ఎందుకంటే ఆకాశం[a] ఎర్రగా ఉంది’ అని మీరు అంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘స్వర్గం.’ గ్రీకు పదానికి ‘ఆకాశం,’ ‘స్వర్గం’ అనే రెండు అర్థాలు ఉండవచ్చు; అయితే ఇక్కడ వాతావరణానికి సంబంధించిన మాట కాబట్టి ‘ఆకాశం’ అనే అర్థమే సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: జవాబిస్తూ ఇలా అన్నాడు
  rationale: గ్రీకు భాషలోని సాధారణ జవాబు-ప్రసంగ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; జవాబిచ్చిన భావాన్నీ, చెప్పిన క్రియనూ నిలుపుతుంది.
- source_word: Ὀψίας γενομένης
  choice: సాయంకాలమైనప్పుడు
  rationale: కాలాన్ని సూచించే genitive absolute నిర్మాణాన్ని సహజంగా, స్పష్టంగా అనువదిస్తుంది.
- source_word: λέγετε
  choice: మీరు అంటారు
  rationale: వర్తమాన కాలం ఇక్కడ అలవాటుగా లేదా సాధారణంగా చెప్పే మాటను సూచిస్తుంది.
- source_word: Εὐδία
  choice: వాతావరణం బాగుంటుంది
  rationale: అనుకూలమైన, నిర్మలమైన వాతావరణాన్ని సూచించే మాటను సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది.
- source_word: πυρράζει
  choice: ఎర్రగా ఉంది
  rationale: ఆకాశం ఎర్రని రూపంలో కనిపించడాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: οὐρανός
  choice: ఆకాశం
  rationale: వాతావరణ సూచన సందర్భంలో ఇది కనిపించే ఆకాశాన్ని సూచిస్తుంది; తెలుగు ‘ఆకాశం’ సందర్భానికి సహజమైన ఎంపిక.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. వాతావరణ సామెత సహజంగా వినిపించేలా క్రియాత్మక వాక్యంగా రూపొందించబడింది.
