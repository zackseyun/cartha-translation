- from: 'కాని ఆయన వారికి జవాబిస్తూ ఇలా అన్నాడు: “సాయంకాలమైనప్పుడు, ‘వాతావరణం బాగుంటుంది; ఎందుకంటే ఆకాశం[a] ఎర్రగా ఉంది’ అని మీరు అంటారు.'
  to: 'కాని ఆయన జవాబిచ్చి వారితో ఇలా అన్నాడు: “సాయంకాలం అయినప్పుడు, ‘వాతావరణం బాగుంటుంది; ఎందుకంటే ఆకాశం[a] ఎర్రగా ఉంది’ అని మీరు అంటారు.”'
