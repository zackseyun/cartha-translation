id: MAT.16.14
reference: Matthew 16:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “కొందరు బాప్తిస్మమిచ్చే యోహాను అని, మరికొందరు ఏలీయా అని, ఇంకా కొందరు యిర్మీయా అని లేదా ప్రవక్తల్లో ఒకరని అంటున్నారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: వారు ఇలా అన్నారు
  rationale: δέ ఇక్కడ కథన ప్రవాహాన్ని కొనసాగిస్తుంది; తెలుగులో ప్రత్యేక సంధాయకాన్ని చేర్చకుండానే సహజంగా ఉంటుంది. εἶπαν కు ‘అన్నారు’ సరళమైన సమానార్థకం.
- source_word: Οἱ μὲν
  choice: కొందరు ... అని ... అంటున్నారు
  rationale: μέν తరువాతి ἄλλοι/ἕτεροι పదాలతో కలిసి వేర్వేరు గుంపుల అభిప్రాయాలను వరుసగా చూపుతుంది. ముందరి ప్రశ్నలోని విషయాన్ని సందర్భం ద్వారా గ్రహించేలా ఉంచినా, తెలుగు వాక్య నిర్మాణం కోసం చివర ‘అంటున్నారు’ను ఉంచడం సహజం.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: బాప్తిస్మమిచ్చే యోహాను
  rationale: βαπτιστής వ్యక్తి చేసే కార్యాన్ని సూచిస్తుంది. ‘బాప్తిస్మమిచ్చే’ అనేది ఆధునిక పాఠకులకు స్పష్టంగా ఉండి, ఒక ప్రత్యేక బిరుదుకంటే మూలపద భావాన్ని ప్రత్యక్షంగా తెలియజేస్తుంది.
- source_word: ἄλλοι δὲ
  choice: మరికొందరు
  rationale: వేరొక గుంపును సహజమైన తెలుగు పంపిణీ నిర్మాణంలో సూచిస్తుంది; δέ యొక్క స్వల్ప భేదాన్ని ‘మరి’ తగినంతగా వ్యక్తం చేస్తుంది.
- source_word: Ἠλίαν
  choice: ఏలీయా
  rationale: తెలుగు బైబిలు వాడుకలో విస్తృతంగా గుర్తించబడే ప్రవక్త పేరు.
- source_word: ἕτεροι δὲ
  choice: ఇంకా కొందరు
  rationale: జాబితాలో మరో గుంపును సూచించే ἕτεροι భావాన్ని ‘ఇంకా కొందరు’ సహజంగా తెలియజేస్తుంది.
- source_word: Ἰερεμίαν
  choice: యిర్మీయా
  rationale: తెలుగు బైబిలు సంప్రదాయంలో విస్తృతంగా గుర్తించబడే పేరు.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: లేదా ప్రవక్తల్లో ఒకరు
  rationale: ἤ లోని ప్రత్యామ్నాయ భావాన్ని ‘లేదా’గా, ἕνα τῶν προφητῶν ను అదనంగా ‘ఇతర’ అనే పదం చేర్చకుండా మూలానికి దగ్గరగా అనువదిస్తుంది.
theological_decisions:
- issue: గుర్తింపులలో అంతర్లీనంగా ఉన్న కర్త/విషయం
  choice: ‘నీవు’ అనే పదాన్ని చేర్చకుండా, ముందరి ప్రశ్నపై ఆధారపడే మూలంలోని సంక్షిప్త నిర్మాణాన్ని నిలిపివేయడం
  alternative: ‘నీవు బాప్తిస్మమిచ్చే యోహానువని కొందరు...’ అని స్పష్టంగా చెప్పడం
  rationale: గ్రీకు వాక్యంలో గుర్తింపులు సంక్షిప్తంగా జాబితా చేయబడ్డాయి; ‘నీవు’ అనేది సందర్భం ద్వారా అర్థమవుతుంది. దాన్ని ప్రధాన పాఠ్యంలో చేర్చడం సరైన వివరణే అయినా మూలంలో ప్రత్యక్షంగా లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు సులభంగా ఉండే కథన శైలి. మూలంలోని సంక్షిప్తతను కాపాడుతూ తెలుగు వాక్య నిర్మాణం సహజంగా ఉండేందుకు నివేదన క్రియను జాబితా చివర ఉంచాం.
