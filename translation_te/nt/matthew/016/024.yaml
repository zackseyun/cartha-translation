review_pass:
  verdict: approve
  source_fidelity: 'The Telugu accurately represents all major elements of the Greek: Τότε (''అప్పుడు''), Jesus'' address to his disciples, the open conditional (''ఎవరైనా ... కోరుకుంటే''), the distinct expressions ''come after me'' (''నా వెనుక రావాలని'') and ''follow me'' (''నన్ను అనుసరించాలి''), self-denial, and taking up one''s own cross. The singular personal forms are appropriately retained after the inclusive ''ఎవరైనా.'''
  naturalness: The wording is fluent modern standard Telugu and maintains the solemn, direct register of Jesus' instruction. 'తనను తాను నిరాకరించుకొని' and 'తన సిలువను ఎత్తుకొని' are idiomatic enough in this biblical register. The use of 'అనుసరించాలి' naturally conveys the third-person imperative in Telugu.
  terminology: ‘శిష్యులు,’ ‘సిలువ,’ and ‘అనుసరించు’ are established, clear Telugu biblical terms. ‘తనను తాను నిరాకరించుకోవడం’ preserves the intentionally broad force of ἀπαρνησάσθω ἑαυτόν without importing a narrower theological explanation.
