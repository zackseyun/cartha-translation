id: MAT.16.24
reference: Matthew 16:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: te
  text: 'అప్పుడు యేసు తన శిష్యులతో ఇలా అన్నాడు: “ఎవరైనా నా వెనుక రావాలని కోరుకుంటే, అతడు తనను తాను నిరాకరించుకొని, తన సిలువను ఎత్తుకొని నన్ను అనుసరించాలి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: తర్వాతి మాటను ముందున్న సందర్భంతో కాలక్రమంగా అనుసంధానించే సహజమైన తెలుగు ప్రయోగం.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: తన శిష్యులతో
  rationale: μαθηταί సూచించే గురువు వద్ద నేర్చుకుంటూ ఆయనను అనుసరించేవారి సంబంధాన్ని ‘శిష్యులు’ ఖచ్చితంగా, స్థిరంగా తెలియజేస్తుంది.
- source_word: Εἴ τις θέλει
  choice: ఎవరైనా … కోరుకుంటే
  rationale: τις యొక్క అనిర్దిష్ట, సార్వత్రిక పరిధినీ θέλω యొక్క సంకల్పార్థాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: నా వెనుక రావాలని
  rationale: శిష్యత్వాన్ని సూచించే మూల రూపకాన్ని నిలుపుతూ, తరువాత వచ్చే ἀκολουθείτω అనే ‘అనుసరించు’ క్రియతో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: తనను తాను నిరాకరించుకొని
  rationale: ἀπαρνέομαι యొక్క బలమైన స్వీయ-నిరాకరణ భావాన్ని నేరుగా నిలుపుతుంది; అఓరిస్ట్ ఆజ్ఞలోని నిర్ణయాత్మకతను సందర్భం తెలియజేస్తుంది.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: తన సిలువను ఎత్తుకొని
  rationale: αἴρω యొక్క ఎత్తుకొని మోయడానికి సిద్ధపడే భావాన్ని, వ్యక్తిగతంగా తనకు సంబంధించిన సిలువ అనే మూలపాఠ భావాన్ని కాపాడుతుంది.
- source_word: ἀκολουθείτω μοι
  choice: నన్ను అనుసరించాలి
  rationale: మూడవ పురుష ఆజ్ఞను సహజమైన తెలుగులో తెలియజేస్తుంది; వర్తమాన ఆజ్ఞలోని కొనసాగుతున్న అనుసరణ భావం శిష్యత్వ సందర్భంలో నిలుస్తుంది.
theological_decisions:
- issue: ఏకవచన పురుషలింగ వ్యాకరణ రూపాల ప్రతినిధ్య పరిధి
  choice: ‘ఎవరైనా’ అనే సమగ్ర పరిధిని ఉంచి, తరువాత ‘అతడు/తన’ అనే ఏకవచన రూపాలను వాడటం
  alternative: అన్ని తరువాతి రూపాలను లింగనిరపేక్ష బహువచనంగా మార్చడం
  rationale: గ్రీకులో τις సార్వత్రికంగా ఎవరినైనా సూచించినా, ఆజ్ఞలు మరియు ἑαυτόν/αὐτοῦ ఏకవచన పురుషలింగ రూపాల్లో ఉన్నాయి. తెలుగు అనువాదం ఈ వ్యాకరణ ఏకవచనాన్ని నిలుపుతూ ‘ఎవరైనా’ ద్వారా బోధ యొక్క సార్వత్రిక వర్తింపును స్పష్టం చేస్తుంది.
- issue: ‘తనను తాను నిరాకరించుకోవడం’ యొక్క అర్థాన్ని వివరణాత్మకంగా విస్తరించాలా
  choice: మూలపాఠంలోని సంక్షిప్తమైన, ఉద్విగ్నమైన మాటను యథాతథంగా ఉంచడం
  alternative: ‘తన కోరికలను విడిచిపెట్టాలి’ లేదా ‘తన హక్కులను త్యజించాలి’ అని అర్థాన్ని నిర్దిష్టీకరించడం
  rationale: ἀπαρνησάσθω ἑαυτόν విస్తృతమైన మరియు సవాలుతో కూడిన భావాన్ని కలిగి ఉంది. ఒక నిర్దిష్ట ఆధ్యాత్మిక వ్యాఖ్యానానికి పరిమితం చేయకుండా అసలు వాక్యంలోని ధార్మిక ఉద్వేగాన్ని కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే యేసు ఆజ్ఞ యొక్క గంభీరతను నిలుపుతూ రూపొందించబడింది. మూలపాఠంలోని ‘నా వెనుక రావడం’ మరియు ‘నన్ను అనుసరించడం’ అనే వేర్వేరు వ్యక్తీకరణలు రెండూ కాపాడబడ్డాయి.
