  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: te
  text: వారు తమలో తాము, “మనం రొట్టెలు తీసుకురాలేదు[a]” అని చర్చించుకుంటున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మనం రొట్టెలు వెంట తీసుకోలేదు.”
    reason: λαμβάνω అనే క్రియను ఈ ప్రయాణ సందర్భంలో ‘వెంట తీసుకోవడం’ అని కూడా అనువదించవచ్చు.
lexical_decisions:
- source_word: οἱ δὲ
  choice: అప్పుడు వారు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక కథన కొనసాగింపును సూచిస్తుంది; ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: διελογίζοντο
  choice: చర్చించుకున్నారు
  rationale: అసంపూర్ణ భూతకాల మధ్యమ రూపం వారి మధ్య కొనసాగిన ఆలోచనాత్మక సంభాషణను సూచిస్తుంది; ‘చర్చించుకున్నారు’ దీనిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν ἑαυτοῖς
  choice: తమలో తాము
  rationale: ఇది ఇతరులతో బహిరంగంగా కాక వారి సొంత గుంపులో జరిగిన చర్చను సూచిస్తుంది.
- source_word: λέγοντες
  choice: అని
  rationale: తెలుగులో ప్రత్యక్ష వాక్యంలోని విషయాన్ని ప్రధాన క్రియతో సహజంగా కలపడానికి ‘అని’ సరిపోతుంది.
- source_word: Ἄρτους
  choice: రొట్టెలు
  rationale: గ్రీకులోని బహువచనాన్ని నిలుపుతూ, ప్రయాణానికి ఆహారంగా తీసుకెళ్లే రొట్టెలను స్పష్టంగా సూచిస్తుంది.
- source_word: οὐκ ἐλάβομεν
  choice: తీసుకురాలేదు
  rationale: ప్రయాణ సందర్భంలో λαμβάνω అంటే వెంట తీసుకోవడం; గమ్యస్థాన దృష్టితో తెలుగులో ‘తీసుకురాలేదు’ సహజమైన సమానార్థక ప్రయోగం.
theological_decisions:
- issue: ὅτι యొక్క వాక్య సంబంధం
  choice: ప్రత్యక్ష మాటను ‘అని’తో మాత్రమే పరిచయం చేయడం
  alternative: ‘అందుకే’ లేదా ‘ఎందుకంటే’ అని కారణార్థాన్ని స్పష్టంగా చేర్చడం
  rationale: గ్రీకు వాక్యంలో ὅτι వారి చర్చలో చెప్పిన విషయాన్ని పరిచయం చేయగలదు. ‘దానికి కారణం’ వంటి అంతర్లీన భావాన్ని పాఠ్యంలో చేర్చకుండా మూలంలోని సంక్షిప్తతను, సందర్భపరమైన సందిగ్ధతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘మనం’ శిష్యులు తమను ఒక సమూహంగా ఉద్దేశించుకున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
