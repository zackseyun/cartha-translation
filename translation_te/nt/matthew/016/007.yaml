  revision_rationale: The revision removes the unwarranted temporal addition «అప్పుడు» and changes the completed expression «చర్చించుకున్నారు» to the ongoing «చర్చించుకుంటున్నారు» to represent διελογίζοντο faithfully. The wording for bread and the lexical-alternative footnote are retained.
