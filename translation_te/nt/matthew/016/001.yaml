id: MAT.16.1
reference: Matthew 16:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: te
  text: పరిసయ్యులు, సద్దూకయ్యులు ఆయన దగ్గరకు వచ్చి, ఆయనను పరీక్షిస్తూ[a], ఆకాశం నుండి ఒక సూచనను తమకు చూపించమని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయనను శోధిస్తూ’; లేదా ‘ఆయనను చిక్కులో పెట్టడానికి ప్రయత్నిస్తూ.’
    reason: πειράζοντες అనే పదానికి సందర్భానుసారంగా సాధ్యమైన ప్రత్యామ్నాయ భావాలను చూపించడానికి.
lexical_decisions:
- source_word: προσελθόντες
  choice: ఆయన దగ్గరకు వచ్చి
  rationale: ఈ భూతకాల అసమాపక క్రియ ప్రధాన క్రియకు ముందు వారు యేసును సమీపించినట్లు సూచిస్తుంది. ఆధునిక తెలుగులో ‘దగ్గరకు వచ్చి’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూద మతవర్గానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: Σαδδουκαῖοι
  choice: సద్దూకయ్యులు
  rationale: ఈ యూద మతవర్గానికి తెలుగులో సాధారణంగా గుర్తించదగిన లిప్యంతరీకరణ.
- source_word: πειράζοντες
  choice: పరీక్షిస్తూ
  rationale: సందర్భంలోని ప్రతికూల ఉద్దేశాన్ని సూచిస్తూనే, ‘చిక్కులో పెట్టడానికి’ వంటి మరింత వ్యాఖ్యానాత్మక భావాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా మూలపదంలోని పరీక్షించే భావాన్ని నిలుపుతుంది.
- source_word: ἐπηρώτησαν
  choice: అడిగారు
  rationale: వారు చేసిన అభ్యర్థనను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: σημεῖον
  choice: ఒక సూచనను
  rationale: సందర్భంలో అద్భుత సూచన భావం ఉండవచ్చుగానీ, గ్రీకు పదం నేరుగా ‘సూచన’ అని మాత్రమే చెబుతుంది; అందువల్ల అదనపు వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: ఆకాశం నుండి
  rationale: సూచన యొక్క మూలాన్ని తెలిపే గ్రీకు పదబంధానికి సహజమైన తెలుగు అనువాదం.
- source_word: ἐπιδεῖξαι
  choice: చూపించమని
  rationale: వారు ఆయనను ఏమి చేయమని అడిగారో తెలుగులో సహజమైన పరోక్ష వాక్య నిర్మాణంతో తెలియజేస్తుంది.
theological_decisions:
- issue: పరిసయ్యులు, సద్దూకయ్యులు చేసిన అభ్యర్థనలోని విరోధపూరిత ఉద్దేశం
  choice: πειράζοντες అనే పదాన్ని ‘పరీక్షిస్తూ’ అని అనువదించడం
  alternative: ‘శోధిస్తూ’ లేదా ‘చిక్కులో పెట్టడానికి ప్రయత్నిస్తూ’
  rationale: వారి చర్య తటస్థమైనది కాదని పాఠ్యం సూచిస్తుంది. అయితే ‘చిక్కులో పెట్టడానికి ప్రయత్నిస్తూ’ అనేది ఉద్దేశాన్ని మరింత స్పష్టంగా వ్యాఖ్యానిస్తుంది. ‘పరీక్షిస్తూ’ అనే రూపం మూలపద భావాన్ని, దానిలోని ఉద్రిక్తతను రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని క్రమాన్ని తెలుగు సహజ వాక్య నిర్మాణానికి అనుగుణంగా మార్చినా, చర్యల క్రమాన్ని మరియు భావ ఉద్రిక్తతను నిలిపాం.
