id: MAT.16.9
reference: Matthew 16:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: te
  text: మీరు ఇంకా అర్థం చేసుకోలేదా? ఐదువేల మందికి పంచిన ఆ ఐదు రొట్టెలను, ఎన్ని గంపలు ఎత్తుకొన్నారో కూడా మీకు జ్ఞాపకం లేదా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὔπω
  choice: ఇంకా ... లేదా
  rationale: కాలసంబంధమైన ‘ఇప్పటికీ కాదు/ఇంకా కాదు’ అనే భావాన్ని యేసు ప్రశ్నలో సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: νοεῖτε
  choice: గ్రహించలేదా
  rationale: గత సంఘటనల ప్రాముఖ్యతను మానసికంగా అర్థం చేసుకోవడాన్ని సూచిస్తుంది; ‘గ్రహించు’ ఈ సందర్భంలో సహజంగా ఉంది.
- source_word: οὐδὲ μνημονεύετε
  choice: కూడా జ్ఞాపకం చేసుకోవడం లేదా
  rationale: మొదటి ప్రతికూల ప్రశ్నకు రెండో ప్రతికూల భావాన్ని కలుపుతూ, గత అద్భుతాన్ని గుర్తుచేసుకోవడాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς πέντε ἄρτους τῶν πεντακισχιλίων
  choice: ఐదువేల మందికి పంచిన ఆ ఐదు రొట్టెలను
  rationale: జనసమూహానికి ఆహారం పంచిన సందర్భాన్ని తెలుగులో సహజంగా స్పష్టం చేస్తుంది; ‘ఆ’ గతంలో తెలిసిన సంఘటనను సూచిస్తుంది.
- source_word: πόσους κοφίνους
  choice: ఎన్ని గంపలు
  rationale: κόφινος సూచించే ఆహారం సేకరించే గంపల స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది.
- source_word: ἐλάβετε
  choice: తీసుకున్నారో
  rationale: λαμβάνω యొక్క ప్రాథమిక ‘తీసుకొను’ భావాన్ని నిలుపుతుంది; ఈ సందర్భంలో మిగిలిన ముక్కలతో నిండిన గంపలను ఎత్తుకోవడం లేదా సేకరించుకోవడం రెండింటికీ తగినంత విస్తృతంగా ఉంటుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యేసు గద్దింపు స్వరాన్ని ప్రశ్నారూపంలో నిలుపుతూ, సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే గౌరవప్రదమైన భాషను ఉపయోగించింది.
