id: MAT.16.25
reference: Matthew 16:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: te
  text: ఎందుకంటే, ఎవరైతే తమ ప్రాణాన్ని[a] కాపాడుకోవాలని కోరుకుంటారో వారు దాన్ని పోగొట్టుకుంటారు; కాని నా నిమిత్తం ఎవరైతే తమ ప్రాణాన్ని పోగొట్టుకుంటారో వారు దాన్ని కనుగొంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనమంతటా ‘ప్రాణం’ అనే పదానికి ‘ఆత్మ’ లేదా ‘స్వయం’ అనే అర్థం కూడా ఉండవచ్చు. గ్రీకు పదమైన psychē సందర్భానుసారంగా ‘ప్రాణం,’ ‘స్వయం,’ లేదా ‘ఆత్మ’ అని అర్థమిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: ఎందుకంటే, ఎవరైతే ... కాని ... ఎవరైతే
  rationale: ἐὰν/ἂνతో కూడిన సంబంధవాచక నిర్మాణం సాధారణంగా వర్తించే షరతును సూచిస్తుంది; ఆధునిక తెలుగులో ‘ఎవరైతే ... వారు’ సహజంగా ఆ భావాన్ని అందిస్తుంది. γάρను ముందున్న వాక్యంతో సంబంధం చూపేందుకు ‘ఎందుకంటే’గా, δέను రెండు భాగాల మధ్య వ్యత్యాసం చూపేందుకు ‘కాని’గా అనువదించాం.
- source_word: θέλῃ
  choice: కాపాడుకోవాలని కోరుకుంటారో
  rationale: θέλω సంకల్పం లేదా కోరికను సూచిస్తుంది. ‘కోరుకోవడం’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి, వ్యక్తి ఉద్దేశాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ψυχὴν
  choice: ప్రాణం
  rationale: ఈ శిష్యత్వ సందర్భంలో ψυχή ఒక వ్యక్తి ప్రాణం లేదా జీవాన్ని సూచిస్తుంది; కేవలం శరీరానికి భిన్నమైన ‘ఆత్మ’ అనే అర్థానికి పరిమితం కాదు. కాపాడుకోవడం, పోగొట్టుకోవడం, కనుగొనడం అనే క్రియలతో ‘ప్రాణం’ సహజంగా సరిపోతుంది. పదంలోని విస్తృత అర్థపరిధిని పాదసూచికలో ఉంచాం.
- source_word: σῶσαι
  choice: కాపాడుకోవాలని
  rationale: σῴζω ఇక్కడ తన ప్రాణాన్ని రక్షించుకోవడం లేదా నిలుపుకోవడం అనే భావంలో ఉంది. ఆత్మనేపథ్య భావాన్ని తెలుగులో సహజంగా చూపేందుకు ‘కాపాడుకోవడం’ వాడాం.
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: పోగొట్టుకుంటారు / పోగొట్టుకుంటారో
  rationale: ఈ సందర్భంలో ἀπόλλυμι నాశనం చేయడం కంటే ప్రాణాన్ని కోల్పోవడం అనే భావాన్ని ఇస్తుంది. ‘పోగొట్టుకోవడం’ రెండు భాగాల్లోని ఉద్దేశపూర్వక విరోధాభాసాన్ని నిలుపుతుంది; మొదటి భాగంలోని భవిష్యత్ ఫలితాన్ని తెలుగు సాధారణ వర్తమాన-భవిష్యత్ రూపం సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: ἕνεκεν ἐμοῦ
  choice: నా నిమిత్తం
  rationale: ἕνεκεν ἐμοῦ కారణం లేదా వ్యక్తిగత నిబద్ధతను సూచిస్తుంది. ‘నా నిమిత్తం’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉండి యేసు కారణంగా ప్రాణాన్ని పోగొట్టుకోవడం అనే భావాన్ని నిలుపుతుంది.
- source_word: εὑρήσει
  choice: కనుగొంటారు
  rationale: εὑρίσκωకు నేర అర్థం ‘కనుగొను.’ ‘పొందుతారు’ అనే వివరణాత్మక విస్తరణకు బదులు ‘కనుగొంటారు’ మూలంలోని విరోధాభాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: αὐτοῦ / αὐτήν
  choice: తమ / దాన్ని
  rationale: గ్రీకులోని ఏకవచన పుంలింగ రూపాలు సాధారణ మానవ ప్రతినిధిగా ఉన్నాయి. తెలుగులో సహజమైన, లింగభేదం లేని ‘ఎవరైతే ... వారు’ నిర్మాణానికి అనుగుణంగా ‘తమ’ వాడి, ప్రాణాన్ని తిరిగి సూచించేందుకు ‘దాన్ని’ వాడాం.
theological_decisions:
- issue: శిష్యత్వపు విరోధాభాసంలో ψυχή అనువాదం
  choice: ప్రాణం
  alternative: ఆత్మ; జీవితం; స్వయం
  rationale: యేసును అనుసరించడం, మరణాన్ని ఎదుర్కోవడం అనే సందర్భంలో ψυχήను కాపాడడం, పోగొట్టుకోవడం, కనుగొనడం జరుగుతుంది. ‘ప్రాణం’ ఈ విరోధాభాసాన్ని సహజంగా నిలుపుతూ, పదాన్ని కేవలం అమూర్తమైన ఆత్మకు పరిమితం చేయదు. అయినా ‘ఆత్మ’ అనే సాంప్రదాయ, వేదాంతపరంగా ప్రాముఖ్యమైన ప్రత్యామ్నాయాన్ని తొలగించకుండా పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే ‘ఎవరైతే ... వారు’ నిర్మాణాన్ని వాడాం. ఇది గ్రీకులోని సాధారణంగా వర్తించే ఏకవచన పుంలింగ రూపాన్ని లింగభేదం లేకుండా తెలియజేస్తుంది. ‘కనుగొంటారు’ కొద్దిగా ఉద్దేశపూర్వకంగా అసాధారణంగా వినిపించినా, మూలంలోని కాపాడడం–పోగొట్టుకోవడం–కనుగొనడం అనే విరోధాభాసాన్ని నిలుపుతుంది.
