id: MAT.16.26
reference: Matthew 16:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: te
  text: ఎందుకంటే, ఒక మనిషి లోకమంతటినీ సంపాదించుకొని తన ప్రాణాన్ని పోగొట్టుకుంటే, అతనికి ఏమి ప్రయోజనం? లేదా ఒక మనిషి తన ప్రాణానికి బదులుగా ఏమి ఇస్తాడు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనంలో ‘ప్రాణం’ అని వచ్చిన రెండు చోట్లా ‘ఆత్మ’ అని కూడా అనువదించవచ్చు. గ్రీకు ψυχή అనే పదం సందర్భాన్ని బట్టి ‘జీవితం,’ ‘స్వయం,’ లేదా ‘ఆత్మ’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: ఎందుకంటే … ఏమి
  rationale: γάρ ముందున్న బోధతో వివరణాత్మక సంబంధాన్ని చూపుతుంది; τί అలంకారిక ప్రశ్నను ప్రవేశపెడుతుంది. ఈ తెలుగు నిర్మాణం రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: ὠφεληθήσεται
  choice: అతనికి ఏమి ప్రయోజనం
  rationale: గ్రీకు క్రియలోని ప్రయోజనం పొందడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; అక్షరానువాదపు కృత్రిమ కర్మణి నిర్మాణాన్ని నివారిస్తుంది.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: వ్యాకరణపరంగా ఏకవచన పుంలింగంలో ఉండి సాధారణ ప్రతినిధిగా ఉపయోగించిన పదానికి దగ్గరైన సహజ తెలుగు రూపం.
- source_word: τὸν κόσμον ὅλον
  choice: లోకమంతటినీ
  rationale: κόσμος మరియు ὅλον కలిపి సూచించే సంపూర్ణతను సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: κερδήσῃ
  choice: సంపాదించుకొని
  rationale: లాభం లేదా సంపాదన అనే వాణిజ్య రూపకాన్ని నిలుపుతూ, తరువాతి నష్టంతో ఉన్న వ్యతిరేకతను స్పష్టంగా చేస్తుంది.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: తన ప్రాణాన్ని
  rationale: ψυχή ఇక్కడ వ్యక్తి జీవితం/స్వయం యొక్క అత్యున్నత విలువను సూచించగలదు. ‘ప్రాణం’ జీవితం అనే భావాన్ని సహజంగా అందిస్తూనే, ‘ఆత్మ’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: ζημιωθῇ
  choice: పోగొట్టుకుంటే
  rationale: నష్టపోవడం లేదా కోల్పోవడం అనే కర్మణి భావాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, లోకాన్ని సంపాదించడానికీ ప్రాణాన్ని కోల్పోవడానికీ మధ్య వ్యతిరేకతను కాపాడుతుంది.
- source_word: ἀντάλλαγμα
  choice: బదులుగా
  rationale: ప్రతిగా ఇచ్చే వస్తువు లేదా మార్పిడి అనే భావాన్ని అతిగా ‘విమోచన వెల’గా వ్యాఖ్యానించకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: δώσει
  choice: ఇస్తాడు
  rationale: భవిష్యత్ సూచనతో ఉన్న రెండవ అలంకారిక ప్రశ్నను సరళమైన తెలుగు క్రియతో నిలుపుతుంది.
theological_decisions:
- issue: అంతిమ నష్టాన్ని తెలిపే సందర్భంలో ψυχή అనువాదం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: ఈ సందర్భంలో ψυχήను శరీరానికి భిన్నమైన అభౌతిక ఆత్మ అనే సాంకేతిక అర్థానికే పరిమితం చేయాల్సిన అవసరం లేదు; అది వ్యక్తి జీవితం లేదా స్వయాన్ని సంపూర్ణంగా సూచించవచ్చు. ‘ప్రాణం’ ఆ విస్తృతిని ప్రధాన పాఠ్యంలో కాపాడుతుంది; సంప్రదాయబద్ధమైన, సాధ్యమైన ‘ఆత్మ’ పఠనాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన అలంకారిక ప్రశ్నల రూపం వాడబడింది. వాణిజ్య రూపకం మరియు ψυχή పదంలోని ఉద్దేశపూర్వక అర్థవిస్తృతి రెండూ నిలుపబడ్డాయి.
