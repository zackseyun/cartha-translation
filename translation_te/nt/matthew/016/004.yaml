review_pass:
  verdict: revise
  source_fidelity: The draft conveys the core sense, including the exception for Jonah and Jesus’ departure. However, it adds ‘ఈ’ (‘this’), which is not expressed in the Greek, and ‘అయితే’ introduces a contrast not present in the coordinate καί. The phrasing for σημεῖον is also needlessly interpretive and awkward.
  naturalness: ‘సూచక క్రియ’ is not idiomatic modern standard Telugu for a requested validating sign; ‘సూచన’ is clearer and more natural in this context. The revised sentence follows Telugu flow while retaining the concise force of the Greek.
  terminology: ‘తరం,’ ‘దుష్టమైన,’ and ‘వ్యభిచారిణియైన’ accurately preserve the Greek wording and metaphor. ‘సూచన’ renders σημεῖον without adding ‘miraculous.’ ‘యోనా సూచన’ preserves the deliberately unexplained genitive expression. Footnote anchors are relocated to the words they actually explain.
  issues:
  - severity: medium
    issue: ‘ఈ తరం’ adds ‘this.’
    rationale: Γενεὰ has no demonstrative in this verse. Telugu can express the referent naturally without adding a demonstrative.
  - severity: medium
    issue: ‘అయితే’ introduces an unwarranted adversative relation.
    rationale: The Greek uses καί (‘and’), joining the clauses; the second clause states the response to the request but is not marked with ‘however.’
  - severity: medium
    issue: ‘సూచక క్రియ’ is awkward and over-specifies σημεῖον as an action.
    rationale: σημεῖον means ‘sign’; although the context concerns a validating wonder, the noun itself does not explicitly say ‘act.’ ‘సూచన’ is a more natural, non-overinterpreting Telugu equivalent.
  - severity: low
    issue: Footnote anchors do not correspond to their stated subjects.
    rationale: The lexical note about ‘adulterous’ should be anchored there, and the cross-reference about Jonah’s sign should be anchored at ‘యోనా సూచన,’ not at Jesus’ departure.
  revised_text: దుష్టమైన, వ్యభిచారిణియైన[a] తరం ఒక సూచనను కోరుతోంది; యోనా సూచన[b] తప్ప దానికి మరే సూచన ఇవ్వబడదు. ఆయన వారిని విడిచిపెట్టి వెళ్లిపోయాడు.
