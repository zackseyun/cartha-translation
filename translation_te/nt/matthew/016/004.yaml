revisions:
- from: దుష్టమైన, వ్యభిచారిణియైన ఈ తరం ఒక సూచక క్రియను[a] వెదుకుతోంది. అయితే యోనా సూచక క్రియ తప్ప మరే సూచక క్రియా దీనికి ఇవ్వబడదు. తరువాత ఆయన వారిని విడిచిపెట్టి వెళ్లిపోయాడు.[b]
  to: దుష్టమైన, వ్యభిచారిణియైన[a] తరం ఒక సూచనను కోరుతోంది; యోనా సూచన[b] తప్ప దానికి మరే సూచన ఇవ్వబడదు. ఆయన వారిని విడిచిపెట్టి వెళ్లిపోయాడు.
