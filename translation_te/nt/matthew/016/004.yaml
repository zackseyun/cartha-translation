id: MAT.16.4
reference: Matthew 16:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: te
  text: దుష్టమైన, వ్యభిచారిణియైన[a] తరం ఒక సూచనను కోరుతోంది; యోనా సూచన[b] తప్ప దానికి మరే సూచన ఇవ్వబడదు. ఆయన వారిని విడిచిపెట్టి వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విశ్వాసఘాతుకమైన తరం.’ గ్రీకు పదం అక్షరార్థంగా ‘వ్యభిచారిణి’ అని చెబుతుంది; ఇది దేవునిపట్ల నిబంధన విశ్వాసఘాతుకతను వర్ణించే ప్రవక్తల భాషను ప్రతిధ్వనింపజేసే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘యోనా సూచన’ను మత్తయి 12:39–40లో యోనా మూడు పగళ్లు, మూడు రాత్రులు ఉండడంతో పోల్చి, ఆ నమూనాను మనుష్యకుమారునికి వర్తింపజేస్తూ వివరించారు.
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: తరం
  rationale: మత్తయి సందర్భంలో ప్రస్తుతం జీవిస్తున్న అవిశ్వాసుల సమూహాన్ని సూచించే γενεάకు ‘తరం’ సహజమైన, నేరమైన సమానం.
- source_word: πονηρὰ
  choice: దుష్టమైన
  rationale: నైతిక చెడును తెలిపే πονηρά భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: μοιχαλὶς
  choice: వ్యభిచారిణియైన
  rationale: గ్రీకులోని స్త్రీలింగ వ్యభిచార రూపకాన్ని, దాని ప్రవచనాత్మక నిబంధన-ద్రోహ సూచనను వ్యాఖ్యానంతో కుదించకుండా నిలుపుతుంది.
- source_word: σημεῖον
  choice: సూచక క్రియ
  rationale: ధ్రువీకరణగా కోరబడిన అసాధారణ కార్యం అనే సందర్భార్థాన్ని సహజ తెలుగులో అందిస్తూ, కేవలం ‘అద్భుతం’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἐπιζητεῖ
  choice: వెదుకుతోంది
  rationale: తీవ్రంగా వెదకడం లేదా కోరడం అనే క్రియార్థాన్ని నేరుగా ఇస్తుంది; శత్రుత్వాన్ని క్రియలో అదనంగా చొప్పించదు.
- source_word: δοθήσεται
  choice: ఇవ్వబడదు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నేరుగా నిలుపుతుంది.
- source_word: αὐτῇ
  choice: దీనికి
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం ‘తరం’ను తిరిగి సూచిస్తోంది; తెలుగులో ‘దీనికి’ సహజంగా ఉంది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: ఒక్క మినహాయింపును స్పష్టంగా తెలిపే సహజ తెలుగు ప్రయోగం.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: యోనా సూచక క్రియ
  rationale: యోనాతో సంబంధమున్న సూచక క్రియ అనే మూలపాఠంలోని సంక్షిప్తతను, వ్యాఖ్యానానికి తెరచి ఉన్న భావాన్ని కాపాడుతుంది.
- source_word: καταλιπὼν
  choice: వారిని విడిచిపెట్టి
  rationale: అనంతర ప్రధాన చర్యకు ముందు జరిగిన విడిచిపోవడాన్ని సహజ తెలుగు క్రియాసముచ్చయంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లిపోయాడు
  rationale: అక్కడి నుంచి ఆయన నిష్క్రమించిన కదలికను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘వ్యభిచారిణియైన తరం’ అనే మాట యొక్క భావం
  choice: ప్రధాన పాఠంలో వ్యభిచార రూపకాన్ని నిలుపుతూ ‘వ్యభిచారిణియైన’ అని అనువదించడం.
  alternative: ‘విశ్వాసఘాతుకమైన తరం’ లేదా ‘నమ్మకద్రోహ తరం’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం.
  rationale: ఈ పదం ప్రవక్తల గ్రంథాల్లో దేవునిపట్ల నిబంధన విశ్వాసఘాతుకతను ప్రతిధ్వనింపజేయవచ్చు; అయినా మూలపాఠం వ్యభిచార రూపకాన్నే ఉపయోగిస్తోంది. అందువల్ల దాని కఠినతను, భావ ఉద్రిక్తతను నిలుపాలి.
- issue: ‘యోనా సూచక క్రియ’ యొక్క భావం
  choice: ప్రధాన పాఠంలో సంక్షిప్త పదబంధాన్నే ఉంచి, వివరణను పాదసూచికకు పరిమితం చేయడం.
  alternative: యేసు మరణం, సమాధిలో ఉండడం, పునరుత్థానం అని ప్రధాన పాఠంలోనే వివరించడం.
  rationale: మత్తయి 12:39–40 ఈ పోలికను వివరిస్తుంది; కానీ ఈ వచనం స్వయంగా దానిని విప్పి చెప్పదు. కాబట్టి ఈ వచనంలోని సంక్షిప్తతను, అంతర్లీన సూచనను కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సూచక క్రియ’ అనే పదబంధం σημεῖονలోని ధ్రువీకరణాత్మక కార్య భావాన్ని అందిస్తుంది. గ్రీకు వాక్యంలోని తీవ్రతను నిలుపుతూ, తెలుగులో అసహజమైన స్త్రీలింగ సర్వనామ అనుసరణను నివారించాం.
