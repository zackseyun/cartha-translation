  - severity: medium
    issue: “కాలాల సూచనలు” may be heard as signs relating to seasons.
    rationale: The immediate context concerns weather, while καιρῶν refers to significant times or occasions; “సమయాల” better preserves this contrast without imposing an eschatological interpretation.
  - severity: low
