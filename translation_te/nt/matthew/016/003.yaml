id: MAT.16.3
reference: Matthew 16:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: te
  text: 'ఉదయాన, ‘ఆకాశం ఎర్రగా, మబ్బుగా ఉంది కాబట్టి ఈ రోజు చెడు వాతావరణం ఉంటుంది’ అని మీరు అంటారు. ఆకాశం కనిపించే తీరును[a] వివేచించడం మీకు తెలుసు; కానీ సమయాల సూచనలను[b] వివేచించలేరు.[c]


    [a] అక్షరార్థంగా, “ఆకాశపు ముఖాన్ని.”


    [b] “సమయాల సూచనలు” అనేది ప్రస్తుత సమయానికి ఉన్న ఆధ్యాత్మిక ప్రాముఖ్యతను, యేసు చేసిన మెస్సీయకు సంబంధించిన కార్యాలతో సహా, సూచిస్తుండవచ్చు.


    [c] కొన్ని ప్రాచీన ప్రతుల్లో ఈ మాటలు లేవు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆకాశపు ముఖాన్ని.”
    reason: lexical_alternative
  - marker: b
    text: “సమయాల సూచనలు” అనేది ప్రస్తుత సమయానికి ఉన్న ఆధ్యాత్మిక ప్రాముఖ్యతను, యేసు చేసిన మెస్సీయకు సంబంధించిన కార్యాలతో సహా, సూచిస్తుండవచ్చు.
    reason: alternative_reading
  - marker: c
    text: కొన్ని ప్రాచీన ప్రతుల్లో ఈ మాటలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: πρωΐ
  choice: ఉదయాన్నేమో
  rationale: ఇది కాలాన్ని తెలిపే క్రియావిశేషణం. ముందు వచనంలోని సాయంకాలపు మాటకు καὶ ద్వారా ఏర్పడే వ్యత్యాసాన్ని సహజమైన తెలుగులో చూపుతుంది.
- source_word: χειμών
  choice: తుఫాను వాతావరణం
  rationale: ఇక్కడ ఇది ‘చలికాలం’ను కాకుండా తుఫానుతో కూడిన చెడు వాతావరణాన్ని సూచిస్తుంది.
- source_word: πυρράζει
  choice: ఎర్రబారి
  rationale: ఆకాశం ఎర్రని రూపు దాల్చడాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని రంగు సూచనను అతిశయింపజేయదు.
- source_word: στυγνάζων
  choice: మబ్బుపట్టి ఉంది
  rationale: వాతావరణ సందర్భంలో ఆకాశం దిగులుగా లేదా చీకటిగా కనిపించడాన్ని సాధారణ పాఠకుడికి స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πρόσωπον τοῦ οὐρανοῦ
  choice: ఆకాశం కనిపించే తీరు
  rationale: πρόσωπον అక్షరార్థం ‘ముఖం’; ఈ నుడికారంలో ఆకాశపు కనబడే రూపాన్ని సూచిస్తుంది. అక్షరార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: γινώσκετε διακρίνειν
  choice: వివేచించడం మీకు తెలుసు
  rationale: తెలుసుకోవడం మరియు అర్థాన్ని గుర్తించి నిర్ణయించడం అనే రెండు భావాలను నిలుపుతుంది.
- source_word: σημεῖα
  choice: సూచనలు
  rationale: గుర్తించదగిన ఆధారాలు లేదా సంకేతాలు అనే భావాన్ని ఇస్తుంది; మత్తయి సందర్భంలోని బయల్పాటు భావానికి కూడా చోటు ఉంచుతుంది.
- source_word: καιρῶν
  choice: కాలాల
  rationale: వాతావరణ ఋతువులను కాకుండా ప్రత్యేక ప్రాముఖ్యతగల సమయాలను సూచిస్తుంది; మెస్సీయ లేదా అంత్యకాల భావానికే పరిమితం చేయదు.
- source_word: οὐ δύνασθε
  choice: వివేచించలేరు
  rationale: మూలంలోని అసమర్థత భావాన్ని సంక్షిప్తంగా, ముందు ఖండంతో స్పష్టమైన వ్యత్యాసంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: “కాలాల సూచనలు” అనే పదబంధం యొక్క పరిధి
  choice: దీనిని విస్తృతంగానే ఉంచి, ప్రస్తుత సమయపు ఆధ్యాత్మిక ప్రాముఖ్యతను సూచించే అవకాశాన్ని పాదసూచికలో తెలిపాం.
  alternative: “మెస్సీయ కాలపు సూచనలు” లేదా “అంత్యకాల సూచనలు” అని నిర్దిష్టీకరించడం.
  rationale: గ్రీకు పదబంధం యేసు కార్యాల మెస్సీయ ప్రాముఖ్యతను, బహుశా అంత్యకాల సంబంధిత భావాన్ని కూడా కలిగి ఉండవచ్చు; అయితే వచనం స్వయంగా ఒక్క వివరణకే దానిని పరిమితం చేయదు.
- issue: వచనపు పాఠ్యస్థితి
  choice: ప్రధాన పాఠ్యంలో వచనాన్ని అనువదించి, కొన్ని ప్రాచీన ప్రతుల్లో అది లేదని పాదసూచికలో తెలిపాం.
  alternative: వచనాన్ని ప్రధాన పాఠ్యం నుండి పూర్తిగా తొలగించడం.
  rationale: SBLGNT ఈ భాగానికి పాఠ్యసందేహ సూచన ఇస్తుంది. అందువల్ల పాఠ్యభేదాన్ని దాచకుండా, పాఠకుడికి సంక్షిప్తంగా తెలియజేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాతావరణ పదజాలాన్ని ఉపయోగించాం. మాటల్లోని సామెతసదృశ సంక్షిప్తతను సాధ్యమైనంత నిలుపుతూ, తెలుగులో అర్థం పూర్తయ్యేందుకు ‘ఉంటుంది’, ‘అంటారు’ చేర్చాం. సంబోధనలో గౌరవ/బహువచన రూపాన్ని వాడాం.
