  text: He says to them[a], “But who do you say that I am?”
translation:
  language: te
  text: 'ఆయన వారితో ఇలా అంటున్నాడు: “అయితే మీరు నన్ను ఎవరని చెబుతున్నారు?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపానుసారంగా: “అయితే మీరు నన్ను ఎవరుగా ఉండాలని చెబుతున్నారు?” గ్రీకులో అక్కూసేటివ్-ఇన్ఫినిటివ్ నిర్మాణం ఉంది (అక్షరార్థంగా, “నన్ను ఎవరుగా ఉండాలని”); తెలుగులో దాన్ని సహజంగా “నన్ను ఎవరని” అని వ్యక్తం చేశాం.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: అని అడిగాడు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని సహజమైన తెలుగు కథన శైలిలో భూతకాలంగా వ్యక్తం చేశాం. λέγει అక్షరార్థంగా ‘చెబుతున్నాడు’ అయినా, ఇక్కడ ప్రశ్నను పరిచయం చేస్తున్నందున ‘అడిగాడు’ సందర్భోచితం.
- source_word: αὐτοῖς
  choice: వారితో
  rationale: మాట ఎవరిని ఉద్దేశించిందో తెలిపే బహువచన దత్తివాచక సర్వనామాన్ని సహజ తెలుగులో ‘వారితో’గా ఇచ్చాం.
- source_word: Ὑμεῖς
  choice: మీరు
  rationale: గ్రీకులో స్పష్టంగా ఉన్న బహువచన సర్వనామం నొక్కిచెప్పబడింది; తెలుగులో ‘మీరు’ను క్రియకు ముందు ఉంచడం ద్వారా ఆ ప్రాధాన్యాన్ని సహజంగా నిలిపాం.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వచనంలోని ఇతరుల అభిప్రాయాలకు శిష్యుల అభిప్రాయాన్ని వ్యతిరేకంగా నిలిపే భావాన్ని ‘అయితే’ సహజంగా తెలియజేస్తుంది.
- source_word: τίνα
  choice: ఎవరినని
  rationale: అక్కూసేటివ్ ప్రశ్నార్థక సర్వనామం; తెలుగు పరోక్ష వాక్య నిర్మాణంలో ‘ఎవరినని’ సహజ సమానార్థకం.
- source_word: με
  choice: నేను
  rationale: గ్రీకులో ఇది εἶναι అనే క్రియారూపానికి అక్కూసేటివ్ కర్త. తెలుగులో పరోక్ష ప్రశ్నను సహజంగా పునర్నిర్మించేటప్పుడు ‘నేను’ అవుతుంది.
- source_word: λέγετε
  choice: చెబుతున్నారు
  rationale: వర్తమానకాల, ద్వితీయ పురుష బహువచన రూపాన్ని గౌరవ/బహువచన వర్తమాన రూపంతో ప్రతిబింబించాం.
- source_word: εἶναι
  choice: అని
  rationale: గ్రీకు అక్కూసేటివ్-ఇన్ఫినిటివ్ నిర్మాణంలోని ‘ఉండుట’ భావం తెలుగులో ‘నేను ఎవరినని’ అనే సహజ పరోక్ష వాక్య నిర్మాణంలో అంతర్భవిస్తుంది.
theological_decisions:
- issue: శిష్యుల స్వంత అభిప్రాయంపై ఉన్న నొక్కు
  choice: “అయితే నేను ఎవరినని మీరు చెబుతున్నారు?”
  alternative: “మరి మీరు, నేను ఎవరినని చెబుతున్నారు?”
  rationale: ఈ వాక్యం ప్రజల అభిప్రాయం నుండి శిష్యుల స్వంత అంచనాకు మలుపు తిప్పుతుంది. ఎంపిక చేసిన రూపం ఆ వ్యత్యాసాన్ని నిలుపుతూ, తదుపరి వచనంలోని ఒప్పుకోలును ముందుగానే చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని వ్యత్యాసం మరియు బహువచన ‘మీరు’పై నొక్కును నిలిపి, గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు కథనానికి సహజమైన భూతకాల పరిచయంతో అందించాం.
