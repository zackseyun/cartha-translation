  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: te
  text: సాత్వికులు[a] ధన్యులు; ఎందుకంటే వారే భూమిని[b] వారసత్వంగా పొందుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మృదుస్వభావులు’ లేదా ‘వినయవంతులు’; ఇక్కడ భావం బలహీనత కాదు, వినయంతో కూడిన మృదుత్వం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దేశాన్ని’; ఈ మాట బహుశా కీర్తన 37:11ను ప్రతిధ్వనిస్తుంది. అక్కడి వాగ్దానాన్ని ఒడంబడికతో సంబంధమైన దేశం అనే అర్థంలోనూ, మరింత విస్తృతమైన అర్థంలోనూ గ్రహించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: ధన్యులు
  rationale: దేవుని అనుగ్రహం వల్ల కలిగే మేలైన స్థితిని సూచించే, ధన్యతల సందర్భానికి సహజమైన ప్రామాణిక తెలుగు పదం; కేవలం భావోద్వేగపరమైన ‘సంతోషులు’ కంటే మూలార్థాన్ని మెరుగుగా నిలుపుతుంది.
- source_word: οἱ πραεῖς
  choice: సాత్వికులు
  rationale: ప్రాసంగికంగా బలహీనతను కాక, వినయంతో కూడిన మృదుత్వాన్ని సూచిస్తుంది. విశేషణం నామవాచకార్థంలో ఉన్నందున ‘సాత్వికులు’ అని అనువదించబడింది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న ధన్యతా ప్రకటనకు కారణాన్ని స్పష్టమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది.
- source_word: αὐτοὶ
  choice: వారే
  rationale: గ్రీకు సర్వనామంలోని ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: κληρονομήσουσι
  choice: వారసత్వంగా పొందుతారు
  rationale: κληρονομέω లోని వారసత్వ భావాన్ని స్పష్టంగా నిలుపుతూ, వాగ్దానపు భాషతో ఉన్న అనుబంధాన్ని కాపాడుతుంది.
- source_word: τὴν γῆν
  choice: భూమిని
  rationale: γῆ యొక్క విస్తృతమైన ‘భూమి’ అర్థాన్ని ప్రధాన పాఠ్యంలో ఇస్తుంది; ‘దేశం’ లేదా ‘దేశభూమి’ అనే నిబంధనాత్మక అర్థసంభావ్యతను పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: τὴν γῆν యొక్క పరిధి
  choice: భూమిని
  alternative: దేశాన్ని / దేశభూమిని
  rationale: γῆ విశ్వవ్యాప్తమైన ‘భూమి’నూ, నిర్దిష్టమైన ‘దేశం/దేశభూమి’నూ సూచించగలదు. ప్రధాన పాఠ్యంలో విస్తృత అర్థాన్ని ఉంచి, కీర్తన 37:11 ప్రతిధ్వనిలోని నిబంధనాత్మక దేశభూమి భావాన్ని పాదసూచిక ద్వారా కాపాడాం.
- issue: πραεῖς లోని స్వభావార్థం
  choice: సాత్వికులు
  alternative: మృదుస్వభావులు / వినయవంతులు
  rationale: ఈ పదం బలహీనత లేదా పిరికితనాన్ని సూచించదు; వినయంతో నియంత్రితమైన మృదుత్వాన్ని సూచిస్తుంది. ఒకే లక్షణానికి పరిమితం చేయకుండా ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంక్షిప్తమైన ధన్యతా వాక్యశైలిని మరియు గంభీరతను నిలిపాం. ‘వారే’ ద్వారా αὐτοὶ ఉద్ఘాటనను సహజంగా వ్యక్తం చేశాం; అసలులోని γῆ అర్థవిస్తృతిని ప్రధాన పాఠ్యం–పాదసూచిక కలయికతో భద్రపరిచాం.
