id: MAT.5.13
reference: Matthew 5:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: te
  text: మీరే భూమికి ఉప్పు. అయితే ఉప్పు తన ఉప్పదనాన్ని కోల్పోతే, దానిని దేనితో ఉప్పగా చేస్తారు? అది బయట పారవేయబడి, మనుషుల చేత[a] తొక్కబడడానికి తప్ప ఇక దేనికీ పనికిరాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రజల చేత’; గ్రీకు పదం ఇక్కడ సాధారణంగా మానవులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: మీరే
  rationale: గ్రీకులో స్పష్టంగా ఉన్న సర్వనామపు నొక్కిచెప్పే భావాన్ని తెలుగులో సహజమైన ‘మీరే’ తెలియజేస్తుంది.
- source_word: τὸ ἅλας τῆς γῆς
  choice: భూమికి ఉప్పు
  rationale: γῆ ఇక్కడ విస్తృతంగా ‘భూమి/లోకం’ అనే భావాన్ని ఇస్తుంది; ‘భూమికి ఉప్పు’ రూపకం యొక్క సంక్షిప్తతను నిలుపుతుంది.
- source_word: μωρανθῇ
  choice: తన ఉప్పదనాన్ని కోల్పోతే
  rationale: ఈ క్రియకు మూలంగా ‘మూర్ఖమవడం’ అనే సంబంధం ఉన్నా, ఉప్పు సందర్భంలో రుచిని లేదా ఉప్పదనాన్ని కోల్పోవడమే భావం. ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: ἐν τίνι ἁλισθήσεται;
  choice: దానిని దేనితో ఉప్పగా చేస్తారు?
  rationale: భవిష్యత్ కర్మణి రూపంలోని సాధనార్థక ప్రశ్నను తెలుగులో సహజమైన అనిర్దిష్ట కర్త ప్రయోగంతో అందిస్తుంది; ఉప్పును తిరిగి ఉప్పగా చేయలేమనే ఉద్వేగాన్ని ముందుగానే వివరణగా మార్చదు.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: ఇక దేనికీ పనికిరాదు
  rationale: ఇక్కడ ἰσχύει బలం కంటే ఉపయోగం లేదా పనికివచ్చే స్థితిని సూచిస్తుంది.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: బయట పారవేయబడి ... తప్ప
  rationale: ἔξω యొక్క స్థలార్థాన్ని ‘బయట’ నిలుపుతూ, విసర్జించబడటాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καταπατεῖσθαι
  choice: తొక్కబడడానికి
  rationale: పాదాల కింద త్రొక్కబడే దృశ్యాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: మనుషుల చేత
  rationale: ἄνθρωποι ఇక్కడ పురుషులను మాత్రమే కాక సాధారణంగా మానవులను సూచిస్తుంది; ‘మనుషులు’ మూలపదానికి దగ్గరగా ఉండి తెలుగులో సాధారణ మానవార్థాన్ని ఇస్తుంది.
theological_decisions:
- issue: ὑπὸ τῶν ἀνθρώπων లో సాధారణ మానవార్థం
  choice: మనుషుల చేత
  alternative: ప్రజల చేత
  rationale: సందర్భంలో ఇది పురుషులకు మాత్రమే పరిమితం కాదు. ‘మనుషులు’ మూలంలోని మానవవాచక పదాన్ని నిలుపుతుంది; సమగ్ర సాధారణార్థాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. రూపకాన్ని వివరణాత్మకంగా విప్పకుండా, గ్రీకు ప్రశ్నలోని అసాధ్యతా ఉద్వేగం మరియు కర్మణి భావం నిలుపబడ్డాయి.
