  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: te
  text: “ధర్మశాస్త్రాన్ని గానీ ప్రవక్తలను గానీ రద్దు చేయడానికి నేను వచ్చానని అనుకోవద్దు. రద్దు చేయడానికి నేను రాలేదు; కాని నెరవేర్చడానికి[b] వచ్చాను.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నేను వచ్చాను’ అనే రెండు సందర్భాలనూ ‘నేను వచ్చియున్నాను’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘నెరవేర్చడం’ అనే మాటను ‘పూర్తి చేయడం’ లేదా ‘సంపూర్ణంగా వ్యక్తం చేయడం’ అనే భావాల్లో కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: అనుకోవద్దు
  rationale: μήతో కూడిన aorist subjunctive ఇక్కడ నిషేధాన్ని వ్యక్తం చేస్తుంది. ‘అనుకోవద్దు’ ఆధునిక తెలుగులో సహజంగా, నేరుగా ఆ బలాన్ని తెలియజేస్తుంది.
- source_word: ἦλθον
  choice: నేను వచ్చాను / నేను రాలేదు
  rationale: గ్రీకు aorist రూపాన్ని సహజమైన తెలుగు భూతకాలంతో వ్యక్తం చేశాం. రెండో సందర్భంలో గ్రీకు వాక్యంలోని నిరాకరణను తెలుగులో సహజంగా ‘నేను రాలేదు’ అని కూర్చాం.
- source_word: καταλῦσαι
  choice: రద్దు చేయడానికి
  rationale: ధర్మశాస్త్రం, ప్రవక్తలు అనే సందర్భంలో ఇది భౌతికంగా నాశనం చేయడం కాకుండా, చెల్లకుండా చేయడం లేదా పక్కన పెట్టడం అనే భావాన్ని సూచిస్తుంది; ‘రద్దు చేయడం’ ఆ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: τὸν νόμον
  choice: ధర్మశాస్త్రాన్ని
  rationale: ఇది సాధారణ చట్టాన్ని కాకుండా తోరా/మోషే ధర్మశాస్త్రాన్ని సూచించే స్థిరమైన, సులభంగా గుర్తించదగిన తెలుగు పదం.
- source_word: τοὺς προφήτας
  choice: ప్రవక్తలను
  rationale: మూలంలోని ‘ప్రవక్తలు’ అనే సంక్షిప్త శాస్త్రసూచనను అలాగే ఉంచి, ‘గ్రంథాలు’ వంటి వివరణాత్మక పదాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: ἀλλὰ πληρῶσαι
  choice: నెరవేర్చడానికే
  rationale: ‘నెరవేర్చడం’ ఉద్దేశించిన సంపూర్ణతకు తీసుకురావడం, పూర్తిగా వ్యక్తం చేయడం వంటి πληρόω పదంలోని విస్తృత భావపరిధిని కుదించకుండా నిలుపుతుంది. ‘-కే’ ἀλλά ద్వారా వచ్చే వ్యత్యాసాన్ని సహజ తెలుగులో బలపరుస్తుంది.
theological_decisions:
- issue: ధర్మశాస్త్రం లేదా ప్రవక్తలతో యేసు సంబంధాన్ని πληρῶσαι ఎలా వివరిస్తుందనేది
  choice: ‘నెరవేర్చడం’ అనే విస్తృత పదాన్ని ఉంచడం
  alternative: పూర్తి చేయడం; సంపూర్ణ వ్యక్తీకరణకు తీసుకురావడం; స్థిరపరచడం
  rationale: ఈ పదానికి వివిధ సంప్రదాయాల్లో భిన్నమైన theological వివరణలు ఉన్నాయి. ప్రధాన పాఠ్యం వాటిలో ఒక్కదానినే నిర్ణయించకుండా మూలంలోని భావవిస్తృతిని, ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘గానీ…గానీ’ జంట మూలంలోని ‘లేదా’ భావాన్ని సహజంగా అందిస్తుంది. ‘రాలేదు; … వచ్చాను’ అనే సమతుల్య నిర్మాణం గ్రీకు వాక్యంలోని పునరుక్తి మరియు వ్యత్యాసాన్ని నిలుపుతుంది.
