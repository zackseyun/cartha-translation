id: MAT.5.48
reference: Matthew 5:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: te
  text: కాబట్టి, మీ పరలోక తండ్రి పరిపూర్ణుడిగా ఉన్నట్లే మీరూ పరిపూర్ణులుగా[a] ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సంపూర్ణులుగా,’ ‘సమగ్రులుగా,’ ‘పరిణతి చెందినవారిగా.’ గ్రీకు τέλειος అనే పదం పరిపూర్ణతతో పాటు సంపూర్ణత, సమగ్రత లేదా పరిణతిని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: ఉండాలి
  rationale: ఇది రూపంలో భవిష్యత్ సూచక క్రియ అయినా, ఈ సందర్భంలో ఆజ్ఞాత్మకమైన లేదా ప్రబోధాత్మకమైన బలంతో వాడబడింది. ఆధునిక తెలుగులో ‘ఉండాలి’ ఆ భావాన్ని సహజంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి వచనాల్లో శత్రువులను ప్రేమించాలన్న బోధన నుంచి తీసుకున్న నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: ὑμεῖς
  choice: మీరూ
  rationale: గ్రీకులోని స్పష్టమైన సర్వనామానికి ఉన్న ఉద్ఘాటనను, తండ్రితో చేసే పోలికలో ‘మీరూ’ సహజంగా నిలుపుతుంది.
- source_word: τέλειοι / τέλειός
  choice: పరిపూర్ణులుగా / పరిపూర్ణుడై
  rationale: τέλειος పదంలోని ‘పరిపూర్ణత’ అనే ప్రత్యక్ష భావాన్ని, అలాగే శిష్యులు మరియు తండ్రి మధ్య ఉన్న పదపునరావృత పోలికను నిలుపుతుంది. ‘సంపూర్ణమైన,’ ‘సమగ్రమైన,’ ‘పరిణతి చెందిన’ అనే భావసాధ్యతలను పాదసూచికలో ఇచ్చాం.
- source_word: ὡς
  choice: ఉన్నట్లే
  rationale: తండ్రి పరిపూర్ణతను శిష్యులకు ప్రమాణంగా చూపే పోలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: మీ పరలోక తండ్రి
  rationale: స్వామ్య సంబంధాన్నీ, οὐράνιος అనే విశేషణాన్నీ సంక్షిప్తంగా, తెలుగు క్రైస్తవ వాడుకలో సుపరిచితమైన రీతిలో నిలుపుతుంది.
theological_decisions:
- issue: నైతిక ప్రబోధంలో τέλειος పదం యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘పరిపూర్ణులు’ అని అనువదించి, దాని విస్తృత భావపరిధిని పాదసూచికలో పేర్కొనడం
  alternative: సంపూర్ణులు; సమగ్రులు; పరిణతి చెందినవారు
  rationale: ఈ పదం తక్షణ సందర్భంలో పక్షపాతం లేని, సంపూర్ణమైన ప్రేమను సూచించగలదు; అయినా మూలపాఠ్యంలోని తీవ్రమైన నైతిక పిలుపును తగ్గించకుండా ‘పరిపూర్ణులు’ అనే ప్రత్యక్ష అనువాదాన్ని ఉంచాం. ఇది దేవునితో తాత్త్విక సమానత్వాన్ని ప్రకటిస్తుందని గానీ, కేవలం సాధారణ పరిపక్వతకే పరిమితమని గానీ అనువాదంలో ముందే తీర్మానించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే వాక్యనిర్మాణం వాడబడింది. ‘మీరూ’ ద్వారా మూలంలోని ఉద్ఘాటనను అతిశయింపజేయకుండా వ్యక్తం చేశాం; τέλειος పదపునరావృతాన్ని రెండు చోట్ల ‘పరిపూర్ణ-’ రూపంతో నిలిపాం.
