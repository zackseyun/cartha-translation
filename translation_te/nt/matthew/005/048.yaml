- from: కాబట్టి, మీ పరలోక తండ్రి పరిపూర్ణుడై ఉన్నట్లే మీరూ పరిపూర్ణులుగా[a] ఉండాలి.
  to: కాబట్టి, మీ పరలోక తండ్రి పరిపూర్ణుడిగా ఉన్నట్లే మీరూ పరిపూర్ణులుగా[a] ఉండాలి.
