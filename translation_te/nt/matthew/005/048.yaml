review_pass:
  verdict: revise
  source_fidelity: The draft faithfully represents the inferential οὖν (‘కాబట్టి’), the emphatic second-person reference (‘మీరూ’), the exhortative force of the future Ἔσεσθε (‘ఉండాలి’), and the repeated τέλειος terminology. ‘మీ పరలోక తండ్రి’ is an established and suitable rendering of ‘your heavenly Father.’
  naturalness: The verse is clear and appropriately formal in modern standard Telugu. A small adjustment from ‘పరిపూర్ణుడై ఉన్నట్లే’ to ‘పరిపూర్ణుడిగా ఉన్నట్లే’ avoids a possible nuance that the Father has become perfect, while preserving the intended present comparison more directly.
  terminology: ‘పరిపూర్ణులు/పరిపూర్ణుడు’ suitably maintains the Greek repetition and the traditional direct sense of τέλειος. The footnote responsibly gives ‘సంపూర్ణ,’ ‘సమగ్ర,’ and ‘పరిణతి’ as semantic alternatives without forcing one interpretation.
  issues:
  - severity: low
    issue: The phrase ‘పరిపూర్ణుడై ఉన్నట్లే’ can be read as using a completed/becoming form.
    rationale: Although understandable idiomatically, ‘పరిపూర్ణుడిగా ఉన్నట్లే’ more unambiguously expresses the Greek present predicate, ‘is perfect.’
  revised_text: కాబట్టి, మీ పరలోక తండ్రి పరిపూర్ణుడిగా ఉన్నట్లే మీరూ పరిపూర్ణులుగా[a] ఉండాలి.
