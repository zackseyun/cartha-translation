id: MAT.5.30
reference: Matthew 5:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: te
  text: నీ కుడిచెయ్యి నిన్ను తొట్రుపడేలా చేస్తే[a], దాన్ని నరికివేసి పారవేయి. ఎందుకంటే, నీ అవయవాల్లో ఒకటి నశించిపోవడం నీ శరీరమంతా గెహెన్నాలోకి వెళ్లడం[b] కంటే నీకు మేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పాపం చేయడానికి కారణమైతే.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘తొట్రుపడేలా చేస్తే’ అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నరకం.’ ‘గెహెన్నా’ అనేది హిన్నోము లోయ పేరుతో సంబంధమున్న గ్రీకు పదం; ఇక్కడ అది అంత్యకాల న్యాయతీర్పు సందర్భంలో వాడబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: నీ కుడి చెయ్యి
  rationale: తెలుగులో సహజమైన శరీరాంగ సూచన; మూలంలోని నిర్దిష్టతను, ముందరి వచనంతో ఉన్న అలంకార సమాంతరతను కాపాడుతుంది.
- source_word: σκανδαλίζει
  choice: నీకు తొట్రుపాటు కలిగిస్తే
  rationale: పడిపోవడానికి లేదా పాపంలో పడడానికి కారణమవడం అనే గ్రీకు రూపకాన్ని నేరుగా ‘పాపం చేయిస్తే’ అని కుదించకుండా నిలుపుతుంది; భావాన్ని [a] పాదసూచిక వివరిస్తుంది.
- source_word: ἔκκοψον
  choice: దాన్ని నరికివేసి
  rationale: చెయ్యిని పూర్తిగా తొలగించాలనే నిర్ణయాత్మక ఆజ్ఞ యొక్క తీవ్రతను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: βάλε ἀπὸ σοῦ
  choice: నీ నుండి పారవేయి
  rationale: తన దగ్గరనుంచి బలంగా తొలగించి తిరస్కరించడమనే మూలభావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: συμφέρει γάρ σοι
  choice: ఎందుకంటే ... నీకు మేలు
  rationale: ఆర్థిక లాభం కాకుండా పోలికలోని శ్రేయస్సు లేదా ప్రయోజనం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα ἀπόληται
  choice: నశించిపోవడం
  rationale: ఒక శరీరభాగం కోల్పోవడం లేదా నాశనం కావడం అనే గంభీర భావాన్ని నిలుపుతుంది.
- source_word: ἓν τῶν μελῶν σου
  choice: నీ అవయవాల్లో ఒకటి
  rationale: μέλος అనే పదాన్ని ‘కాలు/చెయ్యి’ వంటి అవయవాలకే పరిమితం చేయకుండా శరీరంలోని ఏ భాగానికైనా వర్తించేలా అనువదిస్తుంది.
- source_word: ὅλον τὸ σῶμά σου
  choice: నీ శరీరమంతా
  rationale: ఒక అవయవానికీ మొత్తం శరీరానికీ మధ్య ఉన్న వ్యత్యాసాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: గెహెన్నాలోకి వెళ్లడం
  rationale: ἀπέλθῃలోని ‘వెళ్లడం’ అనే క్రియను కాపాడుతూ, γέεννα అనే చారిత్రక-న్యాయతీర్పు పదాన్ని సాధారణ ‘నరకం’గా పూర్తిగా విలీనం చేయకుండా లిప్యంతరీకరిస్తుంది.
theological_decisions:
- issue: γέεννα పదం అనువాదం
  choice: గెహెన్నా
  alternative: నరకం
  rationale: ఈ గ్రీకు పదం హిన్నోము లోయ నేపథ్యంతో అంత్యకాల న్యాయతీర్పును సూచిస్తుంది. ‘గెహెన్నా’ అని ఉంచడం మూలపదపు చారిత్రక, ధార్మిక ప్రత్యేకతను కాపాడుతుంది; సాధారణ పాఠకుని కోసం ‘నరకం’ అనే సందర్భార్థాన్ని పాదసూచికలో ఇస్తుంది.
- issue: σκανδαλίζειలోని రూపకం
  choice: తొట్రుపాటు కలిగిస్తే
  alternative: పాపం చేయడానికి కారణమైతే
  rationale: మూలంలోని తొట్రుపడే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సందర్భంలో అది పాపంలో పడటాన్ని సూచిస్తుందని పాదసూచికలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలి. ‘చెయ్యి’ సహజ వాడుక కోసం, ‘అవయవాలు’ మూలంలోని విస్తృత శరీరభాగ భావం కోసం వాడబడ్డాయి. మూలంలోని అతిశయోక్తి తీవ్రతను మృదువుచేయలేదు.
