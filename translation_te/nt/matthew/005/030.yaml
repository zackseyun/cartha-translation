review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the major source-text elements: the right hand, the stumbling metaphor, decisive cutting off and disposal, the comparative benefit, one bodily member, the whole body, and going into Gehenna. The proposed revision makes σκανδαλίζει more idiomatic while retaining its metaphorical force, and it relocates the Gehenna note marker to the word it explains.'
  naturalness: ‘నీకు తొట్రుపాటు కలిగిస్తే’ is understandable but less natural and can suggest causing inconvenience rather than causing the person to stumble. ‘నిన్ను తొట్రుపడేలా చేస్తే’ is clear, modern standard Telugu. ‘పారవేయి’ naturally conveys disposal; adding ‘నీ నుండి’ is unnecessary in Telugu here.
  terminology: ‘కుడిచెయ్యి,’ ‘అవయవాలు,’ and the transliteration ‘గెహెన్నా’ are suitable. The Gehenna footnote should not identify the term flatly as a place or equate it definitively with ‘నరకం’; it should describe its Valley of Hinnom background and judgment association while presenting ‘నరకం’ as an alternative rendering.
  issues:
  - severity: medium
    issue: The wording for σκανδαλίζει is somewhat unnatural and potentially imprecise.
    rationale: ‘తొట్రుపాటు కలిగించు’ may denote causing trouble or inconvenience. The Greek directly says ‘causes you to stumble’; ‘నిన్ను తొట్రుపడేలా చేస్తే’ expresses that metaphor naturally and preserves the interpretive openness.
  - severity: medium
    issue: Footnote [b] is anchored after ‘మేలు’ rather than after ‘గెహెన్నాలోకి వెళ్లడం.’
    rationale: The note explains γέεννα, so its anchor should immediately follow the Telugu rendering of that term.
  - severity: medium
    issue: The Gehenna footnote is overly definitive in calling it an eschatological judgment ‘place,’ equating it with hell.
    rationale: The source uses γέεννα, whose historical background and judgment usage should be retained without imposing a more specific doctrinal formulation. ‘నరకం’ can be offered as an alternative translation.
  revised_text: నీ కుడిచెయ్యి నిన్ను తొట్రుపడేలా చేస్తే[a], దాన్ని నరికివేసి పారవేయి. ఎందుకంటే, నీ అవయవాల్లో ఒకటి నశించిపోవడం నీ శరీరమంతా గెహెన్నాలోకి వెళ్లడం[b] కంటే నీకు మేలు.
