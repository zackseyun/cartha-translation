- from: నీ కుడి చెయ్యి నీకు తొట్రుపాటు కలిగిస్తే[a], దాన్ని నరికివేసి నీ నుండి పారవేయి. ఎందుకంటే, నీ అవయవాల్లో ఒకటి నశించిపోవడం, నీ శరీరమంతా గెహెన్నాలోకి వెళ్లడం కంటే నీకు మేలు[b].
  to: నీ కుడిచెయ్యి నిన్ను తొట్రుపడేలా చేస్తే[a], దాన్ని నరికివేసి పారవేయి. ఎందుకంటే, నీ అవయవాల్లో ఒకటి నశించిపోవడం నీ శరీరమంతా గెహెన్నాలోకి వెళ్లడం[b] కంటే నీకు మేలు.
  rationale: The revision improves modern Telugu idiom for the stumbling metaphor, keeps the direct force of the imperatives and comparison, places the Gehenna note at its proper anchor, and revises that note to preserve the historical and theological specificity of γέεννα without a doctrinally overdetermined gloss.
