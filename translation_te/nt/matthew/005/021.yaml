  to: “పూర్వకాలపు వారికి[a], ‘హత్య చేయకూడదు[b]; ఎవరైనా హత్య చేస్తే, అతడు న్యాయవిచారణకు బాధ్యుడవుతాడు[c]’ అని చెప్పబడిందని మీరు విన్నారు.”
