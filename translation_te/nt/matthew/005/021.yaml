source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: te
  text: “పూర్వకాలపు వారికి[a], ‘హత్య చేయకూడదు[b]; ఎవరైనా హత్య చేస్తే, అతడు న్యాయవిచారణకు బాధ్యుడవుతాడు[c]’ అని చెప్పబడిందని మీరు విన్నారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పూర్వం జీవించిన వారికి.”
    reason: lexical_alternative
  - marker: b
    text: సాంప్రదాయకంగా, “చంపకూడదు.” అయితే ఇక్కడి గ్రీకు క్రియ ప్రత్యేకంగా “హత్య చేయడం” అనే అర్థాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “తీర్పుకు జవాబుదారుడవుతాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: మీరు విన్నారు
  rationale: ఈ బోధనా సూత్రంలో గ్రీకు ఏఓరిస్టు, శ్రోతలు గతంలో విని స్వీకరించిన బోధను సూచిస్తుంది. తెలుగులో సాధారణ భూతకాల రూపం సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: ἐρρέθη
  choice: చెప్పబడిందని
  rationale: కర్తను పేర్కొనని గ్రీకు కర్మణి రూపాన్ని కర్మణి ప్రయోగంగానే ఉంచి, చెప్పినవారు ఎవరో అనువాదంలో అదనంగా నిర్ణయించలేదు.
- source_word: τοῖς ἀρχαίοις
  choice: పూర్వకాలపు వారికి
  rationale: దత్తి విభక్తిలోని ఈ పదబంధం పూర్వకాలంలో జీవించిన ప్రజలను, వారికి చెప్పబడిన మాటను సూచిస్తుంది. ‘పూర్వీకులు’ అనే కుటుంబ లేదా వంశ సంబంధ భావాన్ని అనవసరంగా చేర్చకుండా ఈ రూపం విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: Οὐ φονεύσεις
  choice: హత్య చేయకూడదు
  rationale: φονεύω సాధారణంగా ప్రాణం తీయడాన్ని కాక, హత్య చేయడాన్ని ప్రత్యేకంగా సూచిస్తుంది. ఆధునిక తెలుగులో ఆ తేడాను ‘హత్య చేయడం’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: హత్య చేసేవాడు
  rationale: ἄν తో కూడిన ఏఓరిస్టు సబ్జంక్టివ్ అనిర్దిష్టమైన సాధారణ షరతును వ్యక్తం చేస్తుంది. ‘హత్య చేసేవాడు’ తెలుగులో సహజమైన సాధారణీకరణ.
- source_word: ἔνοχος ἔσται τῇ κρίσει
  choice: తీర్పుకు లోనవుతాడు
  rationale: ἔνοχος మరియు దత్తి విభక్తి కలయిక న్యాయపరమైన బాధ్యత లేదా తీర్పుకు పాత్రతను సూచిస్తుంది. తీర్పు దైవికమా, మానవ న్యాయస్థానానిదా అనే విషయాన్ని ఈ అనువాదం ముందుగానే నిర్ణయించదు.
theological_decisions:
- issue: ఆరవ ఆజ్ఞలోని φονεύω అర్థం
  choice: హత్య చేయకూడదు
  alternative: చంపకూడదు
  rationale: φονεύω అనేది అన్ని రకాల ప్రాణహరణాన్ని సూచించే సాధారణ పదం కంటే సంకుచితంగా హత్యను సూచిస్తుంది. అందువల్ల గ్రీకు మూలంలో లేని, ప్రతి విధమైన చంపడాన్నీ నిషేధించే భావాన్ని అనువాదం చేర్చదు.
- issue: τῇ κρίσει సూచించే తీర్పు స్వరూపం
  choice: తీర్పుకు లోనవుతాడు
  alternative: న్యాయస్థానానికి జవాబుదారుడవుతాడు
  rationale: κρίσις న్యాయపరమైన తీర్పును లేదా తీర్పు చెప్పే ప్రక్రియను సూచించగలదు. నిర్దిష్ట మానవ న్యాయసభ అని నిర్ణయించకుండా మూలంలోని విస్తృతతను ప్రధాన పాఠం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. గ్రీకు వాక్యంలోని ఒకే ఉటంకింపులో ఆజ్ఞను మరియు దాని న్యాయపరమైన పరిణామాన్ని సెమికోలన్‌తో కలిపి ఉంచాం. ‘పూర్వకాలపు వారు,’ ‘హత్య,’ ‘తీర్పు’ వంటి పదాలు సహజతతో పాటు మూలంలోని అర్థ పరిధిని కాపాడుతాయి.
