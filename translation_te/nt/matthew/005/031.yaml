  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐρρέθη ⸀δέ· Ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ, δότω αὐτῇ ἀποστάσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: te
  text: '“ఇంకా ఇలా చెప్పబడింది: ‘ఎవరైనా తన భార్యకు విడాకులు ఇస్తే, ఆమెకు విడాకుల పత్రం ఇవ్వాలి.’”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “తన భార్యను పంపివేస్తే, ఆమెకు విడాకుల పత్రం ఇవ్వాలి.” గ్రీకు క్రియకు “పంపివేయడం” అనే అర్థం ఉండవచ్చు; అయితే ఇక్కడి వివాహసంబంధ న్యాయ సందర్భంలో అది విడాకులు ఇవ్వడాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη
  choice: ఇలా చెప్పబడింది
  rationale: మత్తయి సువార్తలో బోధను ఉటంకిస్తూ పరిచయం చేసే కర్మణి ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δέ
  choice: ఇంకా
  rationale: ఇక్కడ δέ కొత్తదైనా సంబంధిత బోధాంశానికి మార్పును సూచిస్తుంది. తెలుగులో ‘ఇంకా’ సహజంగా ఆ మార్పును తెలియజేస్తుంది; అవసరానికి మించిన వ్యతిరేక భావాన్ని చేర్చదు.
- source_word: Ὃς ἂν
  choice: ఎవడైనా
  rationale: అనిర్దిష్ట సాధారణ షరతును సంక్షిప్తంగా వ్యక్తం చేస్తుంది; మూలంలోని పురుష సూచనను నిలుపుతుంది.
- source_word: ἀπολύσῃ
  choice: విడాకులు ఇస్తే
  rationale: ἀπολύω సాధారణంగా ‘పంపివేయు’ అని కూడా అర్థమవుతుంది; అయితే భార్య మరియు ἀποστάσιον ఉన్న ఈ న్యాయపరమైన వివాహ సందర్భంలో విడాకులనే సూచిస్తుంది.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: తన భార్యకు
  rationale: వివాహ సందర్భంలో γυνή అంటే ‘భార్య’; αὐτοῦ సంబంధాన్ని తెలుగులో సహజంగా ‘తన’ ద్వారా వ్యక్తం చేశాం.
- source_word: δότω
  choice: ఇవ్వాలి
  rationale: మూడవ పురుష ఆజ్ఞార్థక రూపంలోని విధిని ఆధునిక తెలుగులో సహజమైన న్యాయనియమ శైలిలో తెలియజేస్తుంది.
- source_word: αὐτῇ
  choice: ఆమెకు
  rationale: పత్రాన్ని స్వీకరించే పరోక్ష కర్మను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀποστάσιον
  choice: విడాకుల పత్రం
  rationale: వివాహ రద్దును ధ్రువీకరించే లిఖితపూర్వక న్యాయపత్రం అనే అర్థాన్ని స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: మోషే ధర్మశాస్త్రంలోని విడాకుల ఏర్పాటుతో యేసు మాటల సంబంధం
  choice: ఈ వాక్యాన్ని ఒక న్యాయపరమైన ఉటంకింపుగా మాత్రమే అనువదించి, యేసు దానిని ఆమోదిస్తున్నాడా తిరస్కరిస్తున్నాడా అనే భావాన్ని ఈ వచనంలో చేర్చలేదు.
  alternative: దీనిని విడాకుల విధానాన్ని యేసు సమర్థించే ప్రత్యక్ష ఆజ్ఞగా లేదా కేవలం ప్రాచుర్యంలో ఉన్న బోధ వివరణగా అనువదించడం.
  rationale: తదుపరి వచనంలో యేసు స్పందించబోయే పూర్వపు సూత్రాన్ని ఇది పరిచయం చేస్తుంది. అందువల్ల విస్తృతమైన విడాకుల నైతిక ప్రశ్నను ఇక్కడే పరిష్కరించకుండా మూలంలోని ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన న్యాయ-ఉటంకింపు శైలి. మూలంలోని కర్మణి పరిచయ సూత్రాన్ని నిలుపుతూ, ‘విడాకుల పత్రం’ ద్వారా లిఖితపూర్వక పత్ర భావాన్ని స్పష్టం చేశాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
