id: MAT.5.35
reference: Matthew 5:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: te
  text: భూమి మీదగానీ ప్రమాణం చేయవద్దు[a], ఎందుకంటే అది ఆయన పాదాలకు పాదపీఠం; యెరూషలేము మీదగానీ ప్రమాణం చేయవద్దు[b], ఎందుకంటే అది మహా రాజు నగరం[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: యెషయా 66:1లోని “భూమి నా పాదాలకు పాదపీఠం” అనే మాటకు సూచన.
    reason: cross_reference
  - marker: b
    text: అక్షరార్థంగా, “యెరూషలేము వైపుగా/లోనికి.” గ్రీకులో ఇక్కడ εἰς ఉంది; అయితే ప్రమాణ భాషలో ఇది “యెరూషలేము మీద” అనే భావంలో వాడబడింది.
    reason: lexical_alternative
  - marker: c
    text: కీర్తన 48:2లో యెరూషలేము “మహా రాజు నగరం” అని పిలవబడిన మాటకు సూచన.
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: కూడా ... వద్దు
  rationale: ముందటి వాక్యంలో మొదలైన నిషేధాల వరుసను సహజమైన ఆధునిక తెలుగులో కొనసాగిస్తుంది.
- source_word: ἐν τῇ γῇ
  choice: భూమి తోడని ... ఒట్టు
  rationale: ἐν ఇక్కడ ప్రమాణ భాషలో ‘దేనిమీద/దేనితోడు ఒట్టు పెట్టడం’ అనే భావాన్ని ఇస్తుంది; ‘భూమి తోడని’ ఆ ప్రమాణ సూత్రాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: γῇ
  choice: భూమి
  rationale: ఆకాశం, యెరూషలేముతో ఉన్న వ్యత్యాసంలో ఇది ఒక ప్రత్యేక దేశాన్ని కాక భూమిని సూచిస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: నిషేధానికి కారణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑποπόδιόν
  choice: పాదపీఠం
  rationale: పాదాలను ఉంచే పీఠం అనే మూలార్థాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది; లేఖన ప్రతిధ్వనినీ కాపాడుతుంది.
- source_word: τῶν ποδῶν αὐτοῦ
  choice: ఆయన పాదాలకు
  rationale: తెలుగులో సహజమైన సంబంధ నిర్మాణం; αὐτοῦ సూచించే వ్యక్తిని పేరుపెట్టి మూలంలో లేనిదాన్ని చేర్చదు.
- source_word: εἰς Ἱεροσόλυμα
  choice: యెరూషలేము తోడని ... ఒట్టు
  rationale: εἰς సాధారణంగా దిశను సూచించినా, ఇక్కడ సమాంతర ప్రమాణ సూత్రంలో ‘యెరూషలేము తోడు’ అనే అర్థం సహజం. గ్రీకు ఉపసర్గ వైవిధ్యాన్ని పాదసూచికలో నమోదు చేశాం.
- source_word: πόλις
  choice: నగరం
  rationale: పట్టణ ప్రాధాన్యాన్ని తెలిపే సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: τοῦ μεγάλου βασιλέως
  choice: మహారాజు నగరం
  rationale: ‘గొప్ప రాజు’ కంటే ‘మహారాజు’ తెలుగు లేఖన శైలిలో సహజంగా ఉండి, కీర్తన 48:2 ప్రతిధ్వనిని నిలుపుతుంది.
theological_decisions:
- issue: ‘ఆయన’ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ‘ఆయన’ అని మాత్రమే ఉంచి, సందర్భం ద్వారా దేవుణ్ణి సూచించనివ్వడం
  alternative: ‘దేవుని పాదాలకు’ అని స్పష్టీకరించడం
  rationale: గ్రీకు αὐτοῦ దేవుని పేరును ప్రత్యక్షంగా చెప్పదు. సందర్భం మరియు యెషయా 66:1 ప్రతిధ్వని దేవుణ్ణి సూచిస్తున్నా, అనువాదంలో మూలం కంటే ఎక్కువ స్పష్టీకరణ చేయలేదు.
- issue: ‘మహారాజు’ ఎవరిని సూచిస్తుంది?
  choice: బిరుదును మాత్రమే ఉంచడం
  alternative: ‘దేవుడనే మహారాజు’ అని వివరణ జోడించడం
  rationale: మూలపాఠం τοῦ μεγάλου βασιλέως అని మాత్రమే చెబుతుంది; కీర్తన ప్రతిధ్వని సూచించే దైవిక భావాన్ని వివరణతో బలవంతంగా నిర్ధారించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ప్రమాణ సూత్రానికి ‘తోడని ఒట్టు పెట్టుకోవడం’ వాడి సమాంతర నిర్మాణాన్ని కాపాడాం. ‘ఆయన,’ ‘మహారాజు’ అనే సూచనలను మూలపాఠం మేరకు పరోక్షంగానే ఉంచాం.
