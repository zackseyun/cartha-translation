review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the coordinated prohibition, the oath formula involving one's own head, the causal clause, and the contrast of making even one hair white or black. However, “చేయగల శక్తి నీకు లేదు” adds an explicit noun (“power/strength”) not present in the Greek and is less direct than the incapacity expressed by οὐ δύνασαι.
  naturalness: “నీ తల తోడు అని” is understandable oath language, but “నీ తలతో కూడా ప్రమాణం చేయవద్దు” is more neutral, modern-standard, and closer to the Greek construction. “ఒక్క వెంట్రుకను ... చేయలేవు” is concise and natural Telugu.
  terminology: “ప్రమాణం చేయవద్దు” appropriately renders ὀμόσῃς. “తెల్లగా గానీ నల్లగా గానీ” faithfully retains the two color alternatives without interpretation.
  issues:
  - severity: low
    issue: The phrase “చేయగల శక్తి నీకు లేదు” is an unnecessarily expanded rendering of οὐ δύνασαι.
    rationale: The Greek states inability directly (“you cannot/are not able”), without introducing a separate noun for power or strength. The direct Telugu form is both more faithful and more idiomatic.
  - severity: low
    issue: “నీ తల తోడు అని” is more culturally specific than necessary.
    rationale: Although intelligible, it can evoke a particular Telugu oath idiom. “నీ తలతో ... ప్రమాణం” directly and neutrally represents swearing by one’s head.
  revised_text: నీ తలతో కూడా ప్రమాణం చేయవద్దు; ఎందుకంటే ఒక్క వెంట్రుకను తెల్లగా గానీ నల్లగా గానీ చేయలేవు.[a]
