id: MAT.5.36
reference: Matthew 5:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: te
  text: నీ తలతో కూడా ప్రమాణం చేయవద్దు; ఎందుకంటే ఒక్క వెంట్రుకను తెల్లగా గానీ నల్లగా గానీ చేయలేవు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే ఒక్క వెంట్రుకనైనా తెల్లగా లేదా నల్లగా చేయలేవు.”
    reason: ‘μίαν τρίχα’లోని ఉద్ఘాటనను ‘ఒక్క వెంట్రుకనైనా’గా వ్యక్తపరిచే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: μήτε
  choice: కూడా ... చేయవద్దు
  rationale: ముందటి నిషేధాల పరంపరను కొనసాగించే సమన్వయ నిషేధం; ఆధునిక తెలుగులో ‘కూడా ... చేయవద్దు’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: నీ తల తోడు అని
  rationale: ὀμόσῃςతో కలిసి ప్రమాణంలో తలను సాక్షిగా లేదా పూచీగా పిలిచే భావం ఉంది; తెలుగు ప్రమాణ వాడుకలో ‘తల తోడు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ὀμόσῃς
  choice: ప్రమాణం చేయవద్దు
  rationale: μήτεతో వచ్చిన aorist subjunctive నిషేధార్థకం; ‘ప్రమాణం చేయవద్దు’ నేరుగా, గౌరవప్రదంగా ఉంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: నిషేధానికి కారణాన్ని పరిచయం చేసే causal forceను స్పష్టంగా నిలుపుతుంది.
- source_word: οὐ δύνασαι
  choice: చేయగల శక్తి నీకు లేదు
  rationale: మానవ అసమర్థతను నొక్కిచెప్పే δύνασαι భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది; సాధారణ ‘చేయలేవు’ కంటే మూలంలోని సామర్థ్య భావాన్ని కొద్దిగా స్పష్టపరుస్తుంది.
- source_word: μίαν τρίχα
  choice: ఒక్క వెంట్రుకనైనా
  rationale: μίαν యొక్క ‘ఒక్కటి కూడా’ అనే ఉద్ఘాటనను తెలుగు ‘-నైనా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λευκὴν ... ἢ μέλαιναν
  choice: తెల్లగా గానీ నల్లగా గానీ
  rationale: మూలంలోని రెండు ప్రాథమిక వర్ణపదాల స్పష్టమైన వ్యత్యాసాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: ποιῆσαι
  choice: చేయగల
  rationale: ఇక్కడ ποιέω ఒక వెంట్రుకను నిర్దిష్ట వర్ణంలో ఉండేలా చేయడాన్ని సూచిస్తుంది; ‘చేయు’ మూలానికి దగ్గరగా, తెలుగులో సహజంగా ఉంది.
theological_decisions:
- issue: ప్రమాణం చేయడంపై నిషేధ స్వభావం
  choice: ఈ వాక్యాన్ని ఒకరి తల తోడు అని ప్రమాణం చేయడంపై నేర నిషేధంగా అనువదించాం.
  alternative: అన్ని సందర్భాల్లోని ప్రతి ప్రమాణాన్నీ నిషేధించే సంపూర్ణ సిద్ధాంత ప్రకటనగా విస్తరించడం; లేదా మోసపూరిత ప్రమాణ సూత్రాలను మాత్రమే ఖండిస్తున్నట్లు కుదించడం.
  rationale: ఈ వచనం ప్రత్యేకంగా తల తోడు అని ప్రమాణం చేయడాన్ని ప్రస్తావించి, మనిషి అసమర్థతను కారణంగా చెబుతుంది. విస్తృత సిద్ధాంత వివాదాన్ని అనువాదంలో ముందే తీర్చకుండా యేసు మాటల పరిధి మరియు ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే బోధనాత్మక గాంభీర్యాన్ని నిలుపుతూ అనువదించబడింది. ‘తల తోడు’ తెలుగు ప్రమాణ వాడుకకు సహజమైన రూపం; విస్తృత ప్రమాణ సిద్ధాంతాన్ని వచనంలోకి చేర్చలేదు.
