  revision_rationale: The revision uses a direct, modern-standard Telugu oath expression and renders the Greek statement of human inability without adding “శక్తి.” It retains the prohibition’s coordinated force through “కూడా,” preserves the singular hair and white/black contrast, and does not resolve broader questions about oath-taking.
