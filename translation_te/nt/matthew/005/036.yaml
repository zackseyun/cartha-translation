revisions:
- from: నీ తల తోడు అని కూడా ప్రమాణం చేయవద్దు; ఎందుకంటే ఒక్క వెంట్రుకనైనా తెల్లగా గానీ నల్లగా గానీ చేయగల శక్తి నీకు లేదు.[a]
  to: నీ తలతో కూడా ప్రమాణం చేయవద్దు; ఎందుకంటే ఒక్క వెంట్రుకను తెల్లగా గానీ నల్లగా గానీ చేయలేవు.[a]
  rationale: The revision uses a direct, modern-standard Telugu oath expression and renders the Greek statement of human inability without adding “శక్తి.” It retains the prohibition’s coordinated force through “కూడా,” preserves the singular hair and white/black contrast, and does not resolve broader questions about oath-taking.
  reviewer_model: gpt-5.6-terra
