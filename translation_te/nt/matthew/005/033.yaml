id: MAT.5.33
reference: Matthew 5:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: te
  text: “మరల, పూర్వకాలపు వారికి, ‘అబద్ధ ప్రమాణం చేయకూడదు[a]; ప్రభువుకు నీవు చేసిన ప్రమాణాలను నెరవేర్చాలి[b]’ అని చెప్పబడిందని మీరు విన్నారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చేసిన ప్రమాణాన్ని ఉల్లంఘించకూడదు”; ఈ క్రియ అబద్ధంగా ప్రమాణం చేయడాన్నీ, చేసిన ప్రమాణాన్ని భంగం చేయడాన్నీ సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “యెహోవాకు”; ఇది పాత నిబంధన నేపథ్యంలోని దేవుని నిబంధన నామాన్ని ప్రతిబింబిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: మరల
  rationale: ముందున్న ఉపదేశాల వరుసలో మరో ఉదాహరణను పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉండి, ‘మళ్లీ/ఇంకా’ అనే ప్రసంగ పురోగతిని నిలుపుతుంది.
- source_word: ἠκούσατε
  choice: మీరు విన్నారు
  rationale: ఈ మత్తయి సూత్రప్రాయ వాక్య నిర్మాణంలో గ్రీకు ఏఓరిస్టును తెలుగులో సహజమైన భూతకాల రూపంతో వ్యక్తం చేస్తుంది.
- source_word: ἐρρέθη
  choice: చెప్పబడిందని
  rationale: చెప్పిన వ్యక్తిని నిర్దిష్టంగా పేర్కొనకుండా గ్రీకు కర్మణి రూపాన్ని నిలుపుతుంది.
- source_word: τοῖς ἀρχαίοις
  choice: పూర్వకాలపు వారికి
  rationale: వృద్ధులను కాక, గత తరాల ప్రజలను సూచించే చారిత్రక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Οὐκ ἐπιορκήσεις
  choice: అబద్ధ ప్రమాణం చేయకూడదు
  rationale: ἐπιορκέωలోని అబద్ధంగా ప్రమాణం చేయడం అనే ప్రధాన భావాన్ని న్యాయస్థానానికి మాత్రమే పరిమితమైన సాంకేతిక పదజాలం లేకుండా తెలియజేస్తుంది; ప్రమాణాన్ని ఉల్లంఘించడం అనే భావసాధ్యతను పాదసూచికలో ఉంచింది.
- source_word: ἀποδώσεις
  choice: నెరవేర్చాలి
  rationale: ఇక్కడ ప్రమాణం ద్వారా స్వీకరించిన బాధ్యతను కార్యరూపంలో పూర్తి చేయడం అనే సందర్భోచిత అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῷ κυρίῳ
  choice: ప్రభువుకు
  rationale: గ్రీకు κύριοςను నేరుగా ప్రతిబింబిస్తూ, ఈ సందర్భంలో దేవుడే ఉద్దేశితుడని గౌరవప్రదమైన తెలుగు రూపంలో తెలియజేస్తుంది.
- source_word: τοὺς ὅρκους σου
  choice: నీవు చేసిన ప్రమాణాలను
  rationale: ὅρκος అనే ‘ప్రమాణం’ భావాన్ని కాపాడుతూ, తెలుగులో ‘నెరవేర్చాలి’తో సహజంగా కలిసే నిర్మాణాన్ని ఇస్తుంది; గ్రీకు ఏకవచన సంబోధనను ‘నీవు’గా నిలుపుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలు లేఖనాల నేపథ్యమున్న మాటలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: గ్రీకు పాఠంలో κυρίῳ ఉంది; అందువల్ల ప్రధాన పాఠంలో ‘ప్రభువు’ అని ఉంచడం మూలరూపాన్ని గౌరవిస్తుంది. పాత నిబంధనలోని నిబంధన నామ నేపథ్యాన్ని ‘యెహోవా’ అనే ప్రత్యామ్నాయంతో పాదసూచికలో తెలియజేస్తుంది.
- issue: ἐπιορκέω క్రియ యొక్క భావపరిధి
  choice: అబద్ధ ప్రమాణం చేయడం
  alternative: చేసిన ప్రమాణాన్ని ఉల్లంఘించడం
  rationale: ఈ క్రియ అబద్ధంగా ప్రమాణం చేయడాన్నీ, ప్రమాణాన్ని భంగం చేయడాన్నీ సూచించగలదు. ప్రధాన పాఠంలో విస్తృతమైన సాధారణ భావాన్ని ఉంచి, మరొక నిజమైన భావసాధ్యతను పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన శైలిని ఉపయోగించింది. ప్రధాన వాక్యంలో ‘మీరు’ అనే శ్రోతల బహువచనాన్ని, ఉటంకించిన ఆజ్ఞలోని గ్రీకు రెండవ పురుష ఏకవచనాన్ని ‘నీవు’గా వేరు చేసి నిలుపుకుంది. మూలంలోని కర్మణి నిర్మాణాన్నీ, ప్రమాణాలకు సంబంధించిన న్యాయ-లేఖన శైలినీ అతిగా ప్రాచీన పదజాలం లేకుండా సంరక్షించింది.
