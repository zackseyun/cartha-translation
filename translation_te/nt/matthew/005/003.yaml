  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: te
  text: “ఆత్మలో పేదలైనవారు[a] ధన్యులు[b]; ఎందుకంటే పరలోక రాజ్యం[c] వారిది.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆత్మలో పేదలైనవారు” అనే మాటను “ఆధ్యాత్మికంగా పేదవారు” లేదా “తమ ఆధ్యాత్మిక అవసరాన్ని గుర్తించేవారు” అని కూడా అర్థం చేసుకోవచ్చు. గ్రీకు పదబంధంలోని అర్థవిస్తృతిని సంకుచితం చేయకుండా ప్రధాన పాఠ్యంలో దాని రూపాన్ని నిలిపాం.
    reason: alternative_reading
  - marker: b
    text: “ధన్యులు” అనే గ్రీకు మాటకు “సంతోషించదగినవారు” లేదా “మేలైన స్థితిలో ఉన్నవారు” అనే భావం కూడా ఉంది; ఇది కేవలం సంతోష భావనను కాక, దైవానుగ్రహం వల్ల కలిగిన ఆశించదగిన స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా “ఆకాశముల రాజ్యం”; ఇది మత్తయి సువార్తలో తరచుగా కనిపించే ప్రత్యేకమైన ప్రయోగం. తెలుగులో సాధారణంగా “పరలోక రాజ్యం” అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: ధన్యులు
  rationale: దైవానుగ్రహం పొందిన, ఆశించదగిన స్థితిని సూచించే స్థిరమైన తెలుగు పదం; కేవలం భావోద్వేగమైన సంతోషానికి పరిమితం కాదు.
- source_word: οἱ πτωχοὶ
  choice: పేదవారు
  rationale: నిరుపేద స్థితిని సూచించే substantival adjective భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘భిక్షుకులు’ అనడం మరీ సంకుచితం.
- source_word: τῷ πνεύματι
  choice: ఆత్మలో
  rationale: గ్రీకు దత్తివిభక్తి ప్రయోగంలోని సంక్షిప్తతను, అర్థవిస్తృతిని నిలుపుతుంది; దీనిని పరిశుద్ధాత్మకు నిర్దిష్టంగా అన్వయించదు.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఈ ఆశీర్వచనానికి కారణాన్ని స్పష్టమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది.
- source_word: αὐτῶν ἐστιν
  choice: వారిది
  rationale: గ్రీకులోని వర్తమాన స్వాధీన భావాన్ని సహజంగా, సంక్షిప్తంగా తెలుపుతుంది.
- source_word: ἡ βασιλεία
  choice: రాజ్యం
  rationale: రాజ్యపాలన, రాజ్యక్షేత్రం అనే రెండు భావాలకు చోటిచ్చే సుపరిచితమైన అనువాదం.
- source_word: τῶν οὐρανῶν
  choice: పరలోక
  rationale: మత్తయి సువార్తకు ప్రత్యేకమైన ‘ఆకాశముల రాజ్యం’ అనే గ్రీకు బహువచన ప్రయోగానికి సహజమైన సంప్రదాయ తెలుగు రూపం.
theological_decisions:
- issue: ‘ఆత్మలో పేదవారు’ అనే పదబంధం అర్థం
  choice: వివరణాత్మక విస్తరణ లేకుండా ‘ఆత్మలో పేదవారు’ అని ఉంచడం.
  alternative: ఆధ్యాత్మికంగా పేదవారు; తమ ఆధ్యాత్మిక అవసరాన్ని గుర్తించేవారు; వినయస్థులు.
  rationale: గ్రీకు పదబంధం ఉద్దేశపూర్వకంగా అర్థవిస్తృతి కలిగి ఉంది. ప్రధాన పాఠ్యంలో వివరణ చేరిస్తే మూలం తెరిచి ఉంచిన వ్యాఖ్యానాన్ని అనవసరంగా సంకుచితం చేస్తుంది.
- issue: రాజ్యం వారి సొత్తు కావడంలోని కాలభావం
  choice: ἐστιν అనే వర్తమాన కాలాన్ని ‘వారిది’గా నిలుపడం.
  alternative: వారిదవుతుంది; వారికి లభిస్తుంది.
  rationale: మూలపాఠం భవిష్యత్తు బహుమతిని మాత్రమే కాక ప్రస్తుత స్వాధీనాన్ని కూడా ప్రకటిస్తుంది; అందువల్ల దానిని భవిష్యత్తు కాలంగా మార్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆశీర్వచన శైలి. గ్రీకు పదక్రమాన్ని బలవంతంగా అనుసరించకుండా, ‘ఆత్మలో పేదవారు’ అనే కీలకమైన సందిగ్ధతను మాత్రం నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
