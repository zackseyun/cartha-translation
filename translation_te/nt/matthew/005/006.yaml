revisions:
- from: నీతి[a] కోసం ఆకలిదప్పులు గలవారు ధన్యులు; ఎందుకంటే వారు తృప్తిపరచబడతారు.
  to: నీతి[a] కొరకు ఆకలితోను దాహంతోను ఉన్నవారు ధన్యులు; ఎందుకంటే వారు తృప్తి పొందుతారు.
  rationale: The revision improves modern Telugu idiom while preserving the source’s declarative beatitude, continuing hunger-and-thirst image, broad δικαιοσύνη terminology, causal clause, and future promise. The more natural Telugu expression of the final result avoids making the implicit agent explicit and therefore does not impose a theological interpretation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:29:51Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the beatitude declaration, the object of hunger and thirst, the explanatory ὅτι clause, and the future outcome. However, “తృప్తిపరచబడతారు” is an unnecessarily stiff and non-idiomatic Telugu passive. The Greek future passive can be represented naturally as “తృప్తి పొందుతారు” without supplying an explicit agent; this retains the promised fullness while avoiding an unnatural construction.
  naturalness: “ఆకలిదప్పులు గలవారు” is understandable, but “ఆకలితోను దాహంతోను ఉన్నవారు” is clearer, more idiomatic modern standard Telugu, and directly maintains both elements of the Greek image. “నీతి కొరకు” is a natural formal-register equivalent of “for righteousness.”
  terminology: “ధన్యులు” appropriately conveys μακάριοι in this beatitude register. “నీతి” is a suitable main-text rendering for δικαιοσύνη, while the footnote responsibly preserves “న్యాయం” as a viable alternative. The footnote’s final phrase is made more idiomatic as “దేవుని దృష్టిలో సరైనదాన్ని.”
  issues:
  - severity: medium
    issue: Awkward passive in the final clause
    rationale: “తృప్తిపరచబడతారు” is grammatically analyzable but sounds mechanical in modern Telugu. “తృప్తి పొందుతారు” is idiomatic and does not overidentify the unstated agent of the Greek passive.
  - severity: low
    issue: Less direct hunger/thirst expression
    rationale: “ఆకలిదప్పులు గలవారు” is comprehensible, but “ఆకలితోను దాహంతోను ఉన్నవారు” more directly and naturally expresses the paired participles πεινῶντες καὶ διψῶντες.
  revised_text: నీతి[a] కొరకు ఆకలితోను దాహంతోను ఉన్నవారు ధన్యులు; ఎందుకంటే వారు తృప్తి పొందుతారు.
  revised_footnotes:
