id: MAT.5.6
reference: Matthew 5:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: te
  text: నీతి[a] కొరకు ఆకలితోను దాహంతోను ఉన్నవారు ధన్యులు; ఎందుకంటే వారు తృప్తి పొందుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “న్యాయం.” గ్రీకు పదం నీతి, న్యాయం, లేదా దేవుని దృష్టిలో సరైనదాన్ని సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: ధన్యులు
  rationale: ఆనందమనే మానసిక స్థితికన్నా దేవుని అనుగ్రహానికి పాత్రులని ప్రకటించే ఆశీర్వచన భావాన్ని ‘ధన్యులు’ సహజంగా నిలుపుతుంది.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: ఆకలిదప్పులు గలవారు
  rationale: వర్తమాన కృదంతాలు సూచించే కొనసాగుతున్న తీవ్రమైన వాంఛను తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ఆకలి–దప్పుల రూపకాన్ని నిలుపుతుంది.
- source_word: τὴν δικαιοσύνην
  choice: నీతి కోసం
  rationale: δικαιοσύνη వ్యక్తిగత సదాచారం, దేవుని ఎదుట సరైన స్థితి, న్యాయం అనే విస్తృత భావాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠంలో సుపరిచితమైన ‘నీతి’ని ఉంచి, ‘న్యాయం’ను పాదసూచికలో కాపాడాం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న ధన్యతా ప్రకటనకు కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: αὐτοὶ
  choice: వారు
  rationale: గ్రీకు సర్వనామంలోని ఉద్ఘాటనను తెలుగు వాక్య నిర్మాణంలో సహజంగా ఉంచుతుంది; ‘వారే’ అంటే అవసరానికి మించిన వ్యతిరేక ఉద్ఘాటన కలగవచ్చు.
- source_word: χορτασθήσονται
  choice: తృప్తిపరచబడతారు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ ఆకలి–దప్పులకు సంపూర్ణ తృప్తి కలుగుతుందనే భావాన్ని తెలియజేస్తుంది; కార్యసాధకుడిని గ్రీకు పాఠంలాగే పేర్కొనదు.
theological_decisions:
- issue: δικαιοσύνη యొక్క అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ సందర్భంలో ఈ పదం వ్యక్తిగత నైతికతకు మాత్రమే పరిమితం కాకుండా దేవుని ఎదుట సరైనది, సామాజిక న్యాయం అనే భావాలనూ కలిగి ఉండవచ్చు. అందువల్ల ప్రధాన పాఠంలో ‘నీతి’ని ఉంచి, నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: χορτασθήσονται లోని కర్మణి ప్రయోగం
  choice: తృప్తిపరచబడతారు
  alternative: తృప్తి పొందుతారు
  rationale: గ్రీకు దైవ కర్మణి ప్రయోగం దేవుడే తృప్తిపరచేవాడని సూచించవచ్చు, కానీ వాక్యంలో ఆయన పేరు ప్రత్యక్షంగా లేదు. కర్మణి రూపాన్ని నిలుపడం ద్వారా ఆ సూచనను అతిగా స్పష్టం చేయకుండా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన ఆశీర్వచన శైలి. ‘ఆకలిదప్పులు’ రూపకాన్ని సంక్షిప్తంగా నిలిపి, గ్రీకు పాఠంలోని కారణ సంబంధం మరియు కర్మణి భావాన్ని కాపాడాం.
