id: MAT.5.20
reference: Matthew 5:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: te
  text: 'ఎందుకంటే, నేను మీతో చెబుతున్నాను: మీ నీతి శాస్త్రుల, పరిసయ్యుల నీతికంటే ఎక్కువగా ఉండకపోతే, మీరు పరలోక రాజ్యంలో ఎంతమాత్రమూ ప్రవేశించరు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీతి’కి బదులుగా ‘న్యాయం’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం ఈ రెండు భావాలను సూచించగలదు; మత్తయి 5 సందర్భంలో ‘నీతి’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ఎందుకంటే, నేను మీతో చెబుతున్నాను
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’ తెలియజేస్తుంది; λέγω ὑμῖν లోని ప్రత్యక్ష సంబోధనను సహజమైన ఆధునిక తెలుగులో ‘నేను మీతో చెబుతున్నాను’గా ఉంచాం.
- source_word: ἐὰν μὴ
  choice: మించకపోతే
  rationale: ప్రతికూల అవసర షరతును తెలుగులో సహజంగా క్రియతో కలిపిన ‘-కపోతే’ రూపం వ్యక్తం చేస్తుంది.
- source_word: περισσεύσῃ … πλεῖον
  choice: మించకపోతే
  rationale: ఇక్కడ περισσεύω మరియు πλεῖον కలిసి పోలికలో అధికంగా ఉండడాన్ని సూచిస్తున్నాయి; ‘మించు’ సంక్షిప్తంగా, స్పష్టంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: మీ నీతి
  rationale: δικαιοσύνη ఇక్కడ దేవుని చిత్తానికి అనుగుణమైన సత్ప్రవర్తనను ప్రధానంగా సూచిస్తుంది. ‘నీతి’ తెలుగు బైబిలు పరిభాషలో స్థిరమైనదిగా ఉండి, న్యాయం అనే భావసాధ్యతను కూడా పూర్తిగా తొలగించదు.
- source_word: τῶν γραμματέων καὶ Φαρισαίων
  choice: శాస్త్రుల, పరిసయ్యుల నీతిని
  rationale: గ్రీకులో పోలికకు అవసరమైన ‘వారి నీతి’ భావం అంతర్భూతంగా ఉంది. తెలుగులో పోలిక ఎవరితో కాక వారి నీతితోనని స్పష్టం చేయడానికి ‘నీతి’ని పునరుక్తి చేశాం.
- source_word: γραμματέων
  choice: శాస్త్రుల
  rationale: యూదుల ధర్మశాస్త్రంలో నిపుణులైన γραμματεῖς‌కు ‘శాస్త్రులు’ సంప్రదాయబద్ధమైన, సంక్షిప్త తెలుగు పదం; ‘ధర్మశాస్త్ర బోధకులు’ మరింత వివరణాత్మకం.
- source_word: Φαρισαίων
  choice: పరిసయ్యుల
  rationale: చారిత్రక మతవర్గ నామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: οὐ μὴ εἰσέλθητε
  choice: ఎంతమాత్రమూ ప్రవేశించరు
  rationale: οὐ μή యొక్క బలమైన నిరాకరణను ‘ఎంతమాత్రమూ … ప్రవేశించరు’ సహజంగా, దృఢంగా వ్యక్తం చేస్తుంది.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: పరలోక రాజ్యంలో
  rationale: మత్తయి ప్రత్యేకంగా ఉపయోగించే ఈ పదబంధానికి ‘పరలోక రాజ్యం’ సహజమైన, స్థిరమైన తెలుగు సమానం; εἰς కారణంగా స్థానసూచక ‘రాజ్యంలో’ వాడాం.
theological_decisions:
- issue: δικαιοσύνη యొక్క భావపరిధి
  choice: నీతి
  alternative: న్యాయం
  rationale: మత్తయి 5లో ఈ పదం దేవుని చిత్తానికి అనుగుణమైన జీవితం, ప్రవర్తన అనే విస్తృత భావంలో ఉంది. ‘నీతి’ సందర్భానికి బాగా సరిపోతుంది; ‘న్యాయం’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో గుర్తించాం.
- issue: శాస్త్రులు, పరిసయ్యులతో పోలిక యొక్క లక్ష్యం
  choice: మీ నీతి వారి నీతిని మించాలి అనే పోలికను స్పష్టం చేయడం
  alternative: మీరు శాస్త్రులను, పరిసయ్యులను మించాలి అని వ్యక్తుల మధ్య పోలికగా అనిపించే నిర్మాణం
  rationale: గ్రీకు వాక్యనిర్మాణంలో పోల్చబడేది నీతి పరిమాణం లేదా గుణమే. అందువల్ల తెలుగులో ‘శాస్త్రుల, పరిసయ్యుల నీతిని’ అని స్పష్టం చేశాం; అయితే అది ఏ విధంగా మించాలో వచనం చెప్పని కారణంగా అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘శాస్త్రులు,’ ‘పరిసయ్యులు,’ ‘పరలోక రాజ్యం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలిపి, వాక్యాన్ని అనవసరంగా ప్రాచీనీకరించలేదు.
