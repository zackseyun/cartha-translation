review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the explanatory γάρ, the necessary negative condition, the comparison of the listeners’ righteousness with that of the scribes and Pharisees, the emphatic οὐ μή negation, and entry into the kingdom of heaven. The comparison needs a clearer Telugu linker so that the intended comparison of righteousness—not persons—is immediately clear.
  naturalness: The present wording, “మీ నీతి శాస్త్రుల, పరిసయ్యుల నీతిని మించకపోతే,” is understandable but syntactically compressed and somewhat awkward in modern standard Telugu. Using “నీతికంటే ఎక్కువగా ఉండకపోతే” is smoother and makes the comparative relation explicit.
  terminology: ‘నీతి,’ ‘శాస్త్రులు,’ ‘పరిసయ్యులు,’ and ‘పరలోక రాజ్యం’ are suitable established Telugu biblical terms. The footnote appropriately preserves ‘న్యాయం’ as a lexical alternative without forcing it into the verse.
  issues:
  - severity: medium
    issue: The comparative construction is insufficiently explicit.
    rationale: Greek πλεῖον compares the listeners’ δικαιοσύνη with that of the scribes and Pharisees. The draft’s accusative-style “నీతిని మించకపోతే” can be read correctly, but “నీతికంటే ఎక్కువగా ఉండకపోతే” is more natural and unambiguously expresses the intended comparison in contemporary Telugu.
