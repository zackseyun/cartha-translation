base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: te
  text: “‘కంటికి కన్ను, పంటికి పన్ను’ అని చెప్పబడిందని మీరు విన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “కన్ను స్థానంలో కన్ను, పన్ను స్థానంలో పన్ను.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: మీరు విన్నారు
  rationale: ఈ మత్తయి సూత్రప్రాయ పరిచయంలోని aorist క్రియ, శ్రోతలు స్వీకరించిన బోధను సూచిస్తుంది; ఆధునిక తెలుగులో ‘మీరు విన్నారు’ సహజంగా, ఖచ్చితంగా ఉంది.
- source_word: ὅτι
  choice: అని
  rationale: విన్న విషయాన్ని పరిచయం చేసే గ్రీకు సంధానార్థాన్ని తెలుగులో సహజమైన ఉద్ధరణ సూచకమైన ‘అని’ తెలియజేస్తుంది.
- source_word: ἐρρέθη
  choice: చెప్పబడింది
  rationale: λέγω యొక్క కర్మణి రూపాన్ని అలాగే ఉంచి, ఎవరు చెప్పారో వాక్యంలో పేర్కొనని భావాన్ని కాపాడుతుంది.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: కంటికి కన్ను
  rationale: ἀντί సూచించే ప్రతిఫల/సమాన ప్రతిస్థాపన భావాన్ని తెలుగులో స్థిరపడిన, సంక్షిప్త న్యాయసూత్ర రూపంలో వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: —
  rationale: రెండు సమాంతర న్యాయసూత్ర భాగాలను తెలుగులో విరామచిహ్నంతో సహజంగా కలిపాం; భావ సంబంధం మారదు.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: పంటికి పన్ను
  rationale: మొదటి భాగానికి సమాంతరంగా, ἀντί యొక్క సమాన ప్రతిఫల భావాన్ని సహజమైన తెలుగు న్యాయసూత్ర రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: యేసు ఉటంకించిన ప్రతీకార-పరిమితి న్యాయసూత్రాన్ని ఎలా అనువదించాలి
  choice: కంటికి కన్ను, పంటికి పన్ను
  alternative: కన్ను స్థానంలో కన్ను, పన్ను స్థానంలో పన్ను
  rationale: స్థిరపడిన తెలుగు రూపం గ్రీకు న్యాయసూత్రంలోని సమతుల్య ప్రతిఫల భావాన్ని కాపాడుతుంది. అది అక్షరార్థ ప్రతీకారమా, అనుపాత న్యాయమా అనే వ్యాఖ్యానాన్ని ఈ వచనంలోనే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. ఉటంకించిన న్యాయసూత్రానికి గుర్తుపట్టదగిన తెలుగు రూపాన్ని వాడుతూ, కర్మణి ప్రయోగాన్ని మరియు మూలంలోని వ్యాఖ్యాన ఉద్రిక్తతను కాపాడాం.
