revisions:
- from: అలాగే, మనుషులు దీపం వెలిగించి దానిని కొలపాత్ర[a] కింద పెట్టరు; దీపస్తంభం మీద పెడతారు. అప్పుడు అది ఇంట్లో ఉన్న వారందరికీ వెలుగిస్తుంది.[b]
  to: అలాగే, ఎవరూ దీపాన్ని వెలిగించి దానిని కొలతపాత్ర[a] కింద పెట్టరు; కానీ దీపస్తంభం మీద పెడతారు, అది ఇంట్లో ఉన్న వారందరికీ వెలుగునిస్తుంది.[b]
  rationale: The revision supplies the negative generic force required by οὐδέ without overtranslating it, retains the concrete measuring-container image of μόδιος, and uses more idiomatic Telugu for the lamp’s illumination. It also preserves the two existing footnote anchors and their intended alternatives.
