id: MAT.5.15
reference: Matthew 5:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: te
  text: అలాగే, ఎవరూ దీపాన్ని వెలిగించి దానిని కొలతపాత్ర[a] కింద పెట్టరు; కానీ దీపస్తంభం మీద పెడతారు, అది ఇంట్లో ఉన్న వారందరికీ వెలుగునిస్తుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొలిచే బుట్ట.” గ్రీకు పదం పొడి పదార్థాల కొలతను, ఆ కొలతకు ఉపయోగించే పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అది ఇంట్లో ఉన్న వారందరికోసం ప్రకాశిస్తుంది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: అలాగే ... పెట్టరు
  rationale: ముందున్న ఉపమానంతో అనుసంధానమై మరో ప్రతికూల ఉదాహరణను పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ‘అలాగే’ ఈ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: καίουσιν λύχνον
  choice: దీపం వెలిగించి
  rationale: λύχνος ఇక్కడ సాక్షాత్తు నూనెదీపాన్ని సూచిస్తుంది; καίωతో కలిసినప్పుడు ‘దీపం వెలిగించు’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον
  choice: దానిని కొలపాత్ర కింద పెట్టరు
  rationale: μόδιος పొడి పదార్థాలను కొలిచే కొలతను, ఆ కొలతకు ఉపయోగించే పాత్రను సూచిస్తుంది. ‘కొలపాత్ర’ మూల చిత్రాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: దీపస్తంభం మీద పెడతారు
  rationale: λυχνία దీపాన్ని ఉంచే ఆధారాన్ని సూచిస్తుంది; ‘దీపస్తంభం’ స్పష్టమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం.
- source_word: λάμπει
  choice: వెలుగిస్తుంది
  rationale: λάμπω అక్షరార్థంగా ‘ప్రకాశిస్తుంది’; ఇక్కడ దత్తివాచకమైన πᾶσινతో దీపం ఇతరులకు వెలుగు అందించే ఫలితం ప్రధానంగా ఉంది. ‘వెలుగిస్తుంది’ దానిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: ఇంట్లో ఉన్న వారందరికీ
  rationale: స్థలార్థకమైన ‘ఇంట్లో’ను, πᾶσιν యొక్క సమగ్ర పరిధిని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: గ్రీకులో స్పష్టంగా చెప్పని సాధారణ బహువచన కర్త
  choice: మనుషులు
  alternative: ఎవరూ / వారు
  rationale: గ్రీకు బహువచన క్రియలు సామాన్య మానవ ఆచారాన్ని సూచిస్తున్నాయి. ‘మనుషులు’ సామెతలాంటి సాధారణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; అస్పష్టమైన ‘వారు’ను నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలోని సాధారణ బహువచన భావాన్ని ‘మనుషులు’తో స్పష్టం చేసి, μόδιος యొక్క కొలతపాత్ర చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
