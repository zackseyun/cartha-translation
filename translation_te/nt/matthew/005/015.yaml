review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the lamp, the measuring-container image, the lampstand, and illumination of all those in the house. However, “అలాగే” by itself does not adequately carry the negative connective force of οὐδέ (“nor/neither”), and “వెలుగిస్తుంది” is less idiomatic here than “వెలుగునిస్తుంది.”
  naturalness: The wording is generally clear in modern standard Telugu. A single connected sentence and the idiomatic “వెలుగునిస్తుంది” better reflect both Telugu usage and the Greek progression.
  terminology: “కొలతపాత్ర” appropriately preserves μόδιος as a measuring vessel without importing the traditional but less accessible “bushel.” “దీపస్తంభం” is a suitable rendering of λυχνία. The footnotes are correctly anchored and retain the lexical alternatives.
  issues:
  - severity: medium
    issue: The opening connective is underrepresented.
    rationale: Greek οὐδέ introduces a further negative example. “అలాగే” means “likewise/similarly,” but does not itself express the negative connective force. “అలాగే, ఎవరూ ... పెట్టరు” naturally conveys the generic negative in Telugu.
  - severity: low
    issue: “వెలుగిస్తుంది” is less natural for a lamp's effect.
    rationale: For λάμπει with πᾶσιν, “వెలుగునిస్తుంది” is idiomatic modern Telugu and expresses that the lamp gives light to everyone in the house.
  revised_text: అలాగే, ఎవరూ దీపాన్ని వెలిగించి దానిని కొలతపాత్ర[a] కింద పెట్టరు; కానీ దీపస్తంభం మీద పెడతారు, అది ఇంట్లో ఉన్న వారందరికీ వెలుగునిస్తుంది.[b]
