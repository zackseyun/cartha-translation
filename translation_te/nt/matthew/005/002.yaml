  text: 'And he opened his mouth and taught them[a], saying:'
translation:
  language: te
  text: 'ఆయన తన నోరు తెరిచి, వారికి ఇలా బోధిస్తూ ఉన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: —
  rationale: గ్రీకు καί ముందటి వాక్యంతో సాధారణ అనుసంధానం చేస్తుంది. అయితే తెలుగు వచనారంభంలో ‘మరియు’ అని పెట్టడం అసహజంగా ఉండేందున భావాన్ని వాక్యక్రమంలోనే ఉంచి ప్రత్యేక పదంగా అనువదించలేదు.
- source_word: ἀνοίξας
  choice: తెరిచి
  rationale: అయోరిస్ట్ కృదంతంలోని ముందుగా జరిగిన చర్యను సహజమైన తెలుగు సంయుక్త క్రియారూపంతో వ్యక్తం చేస్తుంది; ‘మాట్లాడడం మొదలుపెట్టి’ అని మార్చకుండా మూలంలోని గంభీరమైన నుడికారాన్ని నిలుపుతుంది.
- source_word: τὸ στόμα αὐτοῦ
  choice: తన నోరు
  rationale: మూలంలోని ‘ఆయన నోరు’ అనే భావాన్ని తెలుగు కర్తకు అనుగుణమైన ప్రతిబింబ సర్వనామంతో సహజంగా వ్యక్తం చేసి, ప్రసంగాన్ని పరిచయం చేసే నుడికారాన్ని నిలుపుతుంది.
- source_word: ἐδίδασκεν
  choice: బోధిస్తూ
  rationale: అసంపూర్ణ భూతకాల క్రియలోని కొనసాగుతున్న చర్యాభావాన్ని నిలుపుతుంది; సందర్భం చెప్పనంతగా ‘బోధించడం మొదలుపెట్టాడు’ అనే ఆరంభార్థాన్ని చేర్చదు.
- source_word: αὐτοὺς
  choice: వారికి
  rationale: సర్వనామ సూచనను సందర్భానికే వదిలి, ఈ వచనంలో లేని ‘శిష్యులు’ లేదా ‘ప్రజలు’ అనే గుర్తింపును చేర్చదు. తెలుగు వాడుకలో ‘బోధించు’తో సంప్రదాన విభక్తి సహజం.
- source_word: λέγων
  choice: ఇలా అన్నాడు
  rationale: తరువాత వచ్చే బోధన విషయాన్ని పరిచయం చేసే కృదంతాన్ని సహజమైన తెలుగు ప్రత్యక్షోక్తి సూత్రంతో అందిస్తుంది.
