revisions:
- from: ఆయన తన నోరు తెరిచి వారికి బోధిస్తూ ఇలా అన్నాడు:[a]
  to: 'ఆయన తన నోరు తెరిచి, వారికి ఇలా బోధిస్తూ ఉన్నాడు:'
  rationale: 'The revised text preserves the Greek participial sequence and the imperfective force of ἐδίδασκεν: “తెరిచి” renders ἀνοίξας, “బోధిస్తూ ఉన్నాడు” represents the ongoing past teaching, and “ఇలా” naturally introduces the words that follow for λέγων. The connective καί is left implicit, as is normal in Telugu sentence opening. The unnecessary footnote is removed.'
