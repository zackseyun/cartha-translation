translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘నోరు తెరిచి’ అనే మూల నుడికారాన్ని తొలగించకుండా నిలిపి, గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావాన్ని ‘బోధిస్తూ’ ద్వారా వ్యక్తం చేసింది.
