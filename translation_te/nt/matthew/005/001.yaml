id: MAT.5.1
reference: Matthew 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: te
  text: జనసమూహాలను చూసి[a] ఆయన కొండ ఎక్కాడు[b]. ఆయన కూర్చున్నప్పుడు[c], ఆయన శిష్యులు ఆయన దగ్గరికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన జనసమూహాలను చూసినప్పుడు, కొండ ఎక్కాడు.”
    reason: క్రియావిశేషణ రూపమైన Ἰδὼν యొక్క కాలసంబంధాన్ని తెలుగులో మరో సహజ విధంగా వ్యక్తం చేయవచ్చు.
  - marker: b
    text: లేదా, “కొండపైకి వెళ్లాడు.”
    reason: ἀνέβη εἰς τὸ ὄρος పైకి కదలడాన్ని సూచిస్తుంది; సందర్భానుసారం ఎక్కడం లేదా కొండపైకి వెళ్లడం అని అనువదించవచ్చు.
  - marker: c
    text: లేదా, “ఆయన కూర్చున్న తర్వాత.”
    reason: గ్రీకులో genitive absolute నిర్మాణం ఉంది; అది కాలపరమైన సంబంధాన్ని ‘అప్పుడు’ లేదా ‘తర్వాత’ అనే భావాలతో వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: Ἰδὼν
  choice: చూసి
  rationale: ὁράω అనే క్రియ యొక్క భూతకాల క్రియావిశేషణ రూపం ప్రధాన క్రియకు పరిస్థితిని తెలియజేస్తుంది. ‘చూసి’ సహజమైన తెలుగులో ఆ అనుబంధాన్ని నిలుపుతుంది; ఖచ్చితమైన కాలక్రమాన్ని అనవసరంగా బలపరచదు.
- source_word: δὲ
  choice: ప్రత్యేక పదంతో అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్పమైన అనుసంధాన లేదా కథన మార్పు సూచకం. ‘అయితే’ లేదా ‘కాని’ అని అనువదిస్తే మూలంలో లేని విరోధ భావం పెరుగుతుంది.
- source_word: τοὺς ὄχλους
  choice: జనసమూహాలను
  rationale: ὄχλους బహువచనం; గుమికూడిన ప్రజా సమూహాలను సూచిస్తుంది. ‘జనసమూహాలను’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి బహువచన భావాన్ని కాపాడుతుంది.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: కొండ ఎక్కాడు
  rationale: ఈ పదబంధం కొండ వైపు పైకి వెళ్లడాన్ని సూచిస్తుంది. ‘కొండ ఎక్కాడు’ సంక్షిప్తంగా, సహజంగా ఉంది; గ్రీకు నిర్దిష్ట ఆర్టికల్ తెలుగు వాడుకలో తప్పనిసరిగా ప్రత్యేక నిర్దేశక పదంతో వ్యక్తం కావాల్సిన అవసరం లేదు.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: ఆయన కూర్చున్నప్పుడు
  rationale: ఈ genitive absolute నిర్మాణం తదుపరి చర్యకు కాలపరమైన లేదా సందర్భపరమైన సంబంధాన్ని తెలియజేస్తుంది. ‘కూర్చున్నప్పుడు’ ఆ సంబంధాన్ని సహజంగా అందిస్తుంది; ‘కూర్చున్న తర్వాత’ అన్నంత కఠినమైన క్రమాన్ని విధించదు.
- source_word: προσῆλθαν αὐτῷ
  choice: ఆయన దగ్గరికి వచ్చారు
  rationale: προσέρχομαι అంటే దగ్గరికి రావడం లేదా సమీపించడం. ఈ కథన సందర్భంలో ‘దగ్గరికి వచ్చారు’ సాధారణమైన, స్పష్టమైన తెలుగు.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు
  rationale: μαθηταί గురువును అనుసరించి నేర్చుకునే శిష్యులను సూచిస్తుంది. ‘శిష్యులు’ సువార్త సందర్భంలో స్థిరమైన, అర్థవంతమైన పదం.
theological_decisions:
- issue: τὸ ὄρος లోని నిర్దిష్ట ఆర్టికల్‌ను తెలుగులో వ్యక్తీకరించడం
  choice: కొండ
  alternative: ఆ కొండ
  rationale: గ్రీకులో ఆర్టికల్ ఉన్నప్పటికీ, తెలుగులో ‘ఆ కొండ’ అంటే ముందే గుర్తించబడిన నిర్దిష్ట కొండ అనే భావం అధికంగా రావచ్చు. ‘కొండ’ మూల స్థలవివరణను కాపాడుతూ అనవసరమైన గుర్తింపును జోడించదు.
- issue: καθίσαντος αὐτοῦ యొక్క కథన కాలసంబంధం
  choice: ఆయన కూర్చున్నప్పుడు
  alternative: ఆయన కూర్చున్న తర్వాత
  rationale: నిర్మాణం కాలపరమైన పరిస్థితిని సూచిస్తుంది గాని తప్పనిసరిగా కఠినమైన అనంతర క్రమాన్ని మాత్రమే సూచించదు. ఎంపిక చేసిన రూపం ఈ అస్పష్టతను నిలుపుతుంది; కూర్చొని బోధించడం గురించి అదనపు ఆచార లేదా సిద్ధాంత భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆయన’ రూపం యేసును గౌరవపూర్వకంగా సూచిస్తుంది. వాక్యాన్ని రెండు భాగాలుగా విభజించడం తెలుగు పఠన ప్రవాహాన్ని మెరుగుపరుస్తుంది; మూలంలోని సంబంధం నిలిచి ఉంటుంది.
