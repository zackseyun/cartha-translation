  terminology: ‘జనసమూహాలు’ faithfully reflects the plural ὄχλοι, and ‘శిష్యులు’ is the established, accurate rendering of μαθηταί. The respectful pronoun ‘ఆయన’ suits the stated register. Rendering τὸ ὄρος as ‘కొండ’ is idiomatic Telugu and does not overidentify the location.
