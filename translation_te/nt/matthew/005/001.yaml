  source_fidelity: 'The Telugu accurately represents the Greek sequence: Jesus sees the plural crowds, goes up the mountain, sits down, and his disciples come to him. ‘చూసి’ preserves the participial circumstantial relation without imposing a stricter temporal sense, and ‘ఆయన కూర్చున్నప్పుడు’ appropriately renders the genitive absolute.'
