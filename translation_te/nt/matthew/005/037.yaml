id: MAT.5.37
reference: Matthew 5:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: te
  text: అయితే మీ మాట, “అవునంటే అవును, కాదంటే కాదు” అని ఉండాలి. వీటికి మించినది దుష్టుని నుండి[a] వస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చెడు నుండి.” గ్రీకు τοῦ πονηροῦ అనే పదబంధాన్ని వ్యక్తిగతంగా “దుష్టుని నుండి” అనీ, వ్యక్తిరహితంగా “చెడు నుండి” అనీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: ఉండాలి
  rationale: εἰμί క్రియ యొక్క మూడవ పురుష వర్తమాన ఆజ్ఞార్థక రూపం. తెలుగులో ఉపదేశాత్మక ఆజ్ఞను సహజంగా, గౌరవప్రదంగా తెలియజేయడానికి ‘ఉండాలి’ సరిపోతుంది.
- source_word: λόγος
  choice: మాట
  rationale: ఇక్కడ λόγος సాధారణ సంభాషణలో వ్యక్తి చెప్పే మాటను సూచిస్తుంది. ‘మాట’ సంక్షిప్తమైన సామెతల స్వరాన్ని నిలుపుతుంది.
- source_word: ναὶ ναί, οὒ οὔ
  choice: “అవును” అంటే అవుననే, “కాదు” అంటే కాదనే
  rationale: గ్రీకులోని పునరుక్తిని తెలుగులో యాంత్రికంగా ‘అవును, అవును; కాదు, కాదు’ అనకుండా, దాని దృఢత్వాన్ని మరియు లయను సహజమైన తెలుగు నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: περισσὸν
  choice: మించినది
  rationale: నామవాచకంగా వాడిన ఈ విశేషణం, ఇప్పుడే చెప్పిన సరళమైన అవును/కాదు మాటకు అదనంగా ఉన్నదాన్ని సూచిస్తుంది.
- source_word: τούτων
  choice: వీటికి
  rationale: నపుంసక బహువచన సర్వనామం ముందున్న రెండు సమాధానాలను తిరిగి సూచిస్తుంది; తెలుగులో ‘వీటికి’ ఆ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἐκ
  choice: నుండి
  rationale: ఈ విభక్త్యర్థక అవ్యయం మూలాన్ని లేదా ఉద్భవాన్ని సూచిస్తుంది; ‘నుండి’ దాని ప్రత్యక్ష తెలుగు సమానం.
- source_word: τοῦ πονηροῦ
  choice: దుష్టుని
  rationale: వ్యాసంతో ఉన్న ఈ గ్రీకు పదబంధం ‘దుష్టుడు’ లేదా ‘చెడు’ అనే రెండు అర్థాలకు వీలిస్తుంది. మత్తయిలో వ్యక్తిగతంగా దుష్టుణ్ణి సూచించే వాడుకను దృష్టిలో ఉంచుకొని ప్రధాన పాఠంలో ‘దుష్టుని’ ఎంచుకొని, మరో సాధ్యార్థాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: τοῦ πονηροῦ వ్యక్తిని (‘దుష్టుడు’) సూచిస్తుందా, లేక వ్యక్తిరహితమైన ‘చెడు’ను సూచిస్తుందా?
  choice: దుష్టుని నుండి
  alternative: చెడు నుండి
  rationale: గ్రీకు వ్యాకరణం రెండు అర్థాలకూ వీలిస్తుంది. మత్తయి సువార్తలో ὁ πονηρός వ్యక్తిగత దుష్టుణ్ణి సూచించే సందర్భాలు ఉన్నందున ప్రధాన పాఠంలో ఆ అర్థాన్ని తీసుకున్నాం; అయితే నిజమైన భాషాత్మక, వేదాంతపరమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సంక్షిప్తంగా, ఉపదేశాత్మక గంభీరతతో రూపొందించబడింది. గ్రీకు పునరుక్తి భావాన్ని తెలుగు వాడుకకు అనుగుణంగా ‘అంటే ... అనే’ నిర్మాణంలో నిలిపాం.
