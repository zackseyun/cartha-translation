  edition: SBLGNT
  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: te
  text: శాంతిని నెలకొల్పేవారు ధన్యులు; ఎందుకంటే వారు దేవుని కుమారులు[a] అని పిలువబడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని పిల్లలు.’ గ్రీకులో అక్షరార్థంగా ‘దేవుని కుమారులు’ అని ఉంది; ఇక్కడ పుంలింగ బహువచన పుత్రత్వ భాష ప్రతినిధి భావంతో వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: ధన్యులు
  rationale: ఇది కేవలం వ్యక్తిగత సంతోషాన్ని కాక, దేవుని అనుగ్రహం పొందిన గౌరవనీయ స్థితిని సూచించే ధన్యవాక్యాల సహజమైన తెలుగు పదం.
- source_word: εἰρηνοποιοί
  choice: శాంతిని నెలకొల్పేవారు
  rationale: శాంతిని ఇష్టపడేవారిని మాత్రమే కాక, దాన్ని క్రియాశీలంగా కలిగించే వారిని సూచించే సమాసపదంలోని కర్తృత్వ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ధన్యతకు కారణాన్ని పరిచయం చేసే గ్రీకు సంధానపదంలోని కారణార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὐτοὶ
  choice: వారు
  rationale: గ్రీకులో సర్వనామానికి ఉద్ఘాటన ఉన్నప్పటికీ, ఈ ధన్యవాక్య నిర్మాణంలో తెలుగు ‘వారు’ సహజంగా ఆ సూచనను మోస్తుంది; ‘వారే’ అనడం అవసరానికి మించిన ప్రత్యేక వ్యత్యాసాన్ని సూచించవచ్చు.
- source_word: υἱοὶ θεοῦ
  choice: దేవుని కుమారులు
  rationale: మూలంలోని పుంలింగ బహువచన పుత్రత్వ భాషను, దానితో ముడిపడి ఉండగల సంబంధం మరియు హోదా భావాలను నిలుపుతుంది; ప్రతినిధి/సమావేషక ప్రయోగాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: κληθήσονται
  choice: అని పిలువబడతారు
  rationale: καλέω యొక్క భవిష్యత్ కర్మణి రూపాన్ని నేరుగా నిలుపుతూ, కేవలం మనుషుల గుర్తింపుగా పరిమితం చేయకుండా ప్రకటిత నామకరణ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: υἱοὶ θεοῦలోని లింగసూచక పుత్రత్వ భాష
  choice: దేవుని కుమారులు
  alternative: దేవుని పిల్లలు
  rationale: గ్రీకు మూలం అక్షరార్థంగా ‘దేవుని కుమారులు’ అని ఉన్నందున ప్రధాన పాఠంలో ఆ రూపాన్ని నిలిపాం. ఇది ప్రతినిధి శక్తితో అందరినీ ఉద్దేశించగలదని పాదసూచికలో తెలియజేయడం ద్వారా సమావేషక అర్థాన్ని కోల్పోకుండా మూలంలోని పుత్రత్వ భాషను సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ధన్యవాక్య శైలి. ‘శాంతిని నెలకొల్పేవారు’ అనే రూపం క్రియాశీల శాంతి సాధనను స్పష్టం చేస్తుంది; వాక్య నిర్మాణం మూలంలోని కారణ సంబంధాన్ని కాపాడుతుంది.
