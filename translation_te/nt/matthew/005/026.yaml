source:
  edition: SBLGNT
  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: te
  text: 'నేను నీతో నిజంగా చెబుతున్నాను: చివరి క్వాడ్రాన్స్‌[a] చెల్లించేవరకు నీవు అక్కడి నుండి ఎంతమాత్రమూ బయటికి రాలేవు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: క్వాడ్రాన్స్‌ చాలా తక్కువ విలువైన ఒక రోమన్ నాణెం.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν λέγω σοι
  choice: నేను నీతో నిజంగా చెప్తున్నాను
  rationale: సినాప్టిక్ సువార్తల్లోని గంభీరమైన ధృవీకరణ సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ఒక్క ἀμήν మాత్రమే ఉన్నందున రెట్టింపు చేయలేదు.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: ఎంతమాత్రమూ బయటికి రాలేవు
  rationale: οὐ μήతో కూడిన బలమైన నిరాకరణను స్పష్టంగా నిలుపుతూ, నిర్బంధ సందర్భానికి సరిపోయే సహజ తెలుగు ప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: ἐκεῖθεν
  choice: అక్కడి నుండి
  rationale: ఆ స్థలం నుండి దూరంగా కదలడాన్ని సూచించే మూలపద భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἕως ἂν ἀποδῷς
  choice: చెల్లించేదాకా
  rationale: ముందున్న స్థితి ముగియడానికి సంపూర్ణ చెల్లింపు షరతుగా ఉండే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: τὸν ἔσχατον κοδράντην
  choice: చివరి క్వాడ్రాన్స్‌
  rationale: ἔσχατος యొక్క ‘చివరి’ భావాన్ని, కొద్రాంతేస్ సూచించే నిర్దిష్ట రోమా నాణెం పేరును నిలుపుతుంది; దాని సాంస్కృతిక అర్థాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: ఈ మాటను అంతిమ తీర్పు, శుద్ధీకరణ లేదా కేవలం న్యాయపరమైన చెరసాల దృశ్యంగా నిర్ధారించాలా?
  choice: అప్పు పూర్తిగా చెల్లించేవరకు విడుదల ఉండదనే ప్రత్యక్ష నిర్బంధ దృశ్యాన్ని మాత్రమే అనువాదం నిలుపుతుంది.
  alternative: దైవిక తీర్పుకు రూపకం; అంత్యకాల సూచనలుగల సమాధాన బోధ; శుద్ధీకరణను సూచించే వాక్యం.
  rationale: గ్రీకు వాక్యం విస్తృత సిద్ధాంతార్థాన్ని స్పష్టంగా నిర్ణయించదు. అందువల్ల పాఠ్యంలో లేని మతపరమైన నిర్ధారణను చేర్చకుండా దాని ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే ఏకవచన ప్రత్యక్ష సంబోధన వాడబడింది. మూలంలోని బలమైన నిరాకరణను ‘ఎంతమాత్రమూ’ ద్వారా నిలిపాం; నిర్దిష్ట నాణెం పేరును లిప్యంతరీకరించి పాదసూచికలో వివరించాం.
