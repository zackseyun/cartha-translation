id: MAT.5.39
reference: Matthew 5:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: te
  text: కాని నేను మీతో చెప్పేది ఏమిటంటే, దుష్టుణ్ణి ఎదిరించవద్దు.[a] బదులుగా, ఎవరైనా నీ కుడి చెంపపై కొడితే, అతనివైపు మరో చెంపను కూడా తిప్పు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, “చెడును ఎదిరించవద్దు”; మరో సాధ్యత: “దుష్టుని ఎదిరించవద్దు.”'
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “ఇతరదానినీ అతనివైపు తిప్పు”; సందర్భం ప్రకారం ‘మరో చెంప’ అని అర్థం.
    reason: source_clarity
lexical_decisions:
- source_word: μὴ ἀντιστῆναι
  choice: ఎదిరించవద్దు
  rationale: ἀνθίστημι యొక్క ‘ఎదురుగా నిలుచు, ప్రతిఘటించు’ అనే ప్రత్యక్ష భావాన్ని నిలుపుతుంది; దీనిని కేవలం ప్రతీకారం తీర్చుకోవడానికో న్యాయపరమైన ప్రతిఘటనకో పరిమితం చేయదు.
- source_word: τῷ πονηρῷ
  choice: దుష్టుణ్ణి
  rationale: వ్యాకరణపరంగా ఇది ‘చెడును,’ ‘దుష్టుణ్ణి,’ లేదా ‘దుష్టుడైన వానిని’ సూచించవచ్చు. వెంటనే వచ్చే వ్యక్తిగత ఉదాహరణ మానవ దుష్కర్తను ప్రధాన పాఠంలో ఉంచడానికి మద్దతిస్తుంది.
- source_word: ῥαπίζει
  choice: కొడితే
  rationale: ῥαπίζω చేతితో చెంపపై కొట్టడాన్ని, ముఖ్యంగా అవమానకరమైన దెబ్బను సూచిస్తుంది. తెలుగులో ‘చెంపపై కొట్టు’ సహజంగా ఉండి ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: నీ కుడి చెంపపై
  rationale: σιαγών ‘దవడ’ లేదా ‘చెంప’ అని అర్థమవుతుంది; కొట్టే సందర్భంలో ‘చెంప’ సహజమైన తెలుగు ప్రయోగం.
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: అతనికి మరో చెంపను కూడా తిప్పు
  rationale: στρέφω యొక్క ‘తిప్పు’ అనే భావాన్ని నేరుగా నిలుపుతూ, సందర్భం వల్ల అర్థమయ్యే ‘చెంప’ను తెలుగులో స్పష్టంగా పునరుక్తి చేస్తుంది.
- source_word: ὅστις
  choice: ఎవరైనా
  rationale: ఈ షరతుతో కూడిన అనిర్దిష్ట నిర్మాణంలో ‘ఎవరైనా ... కొడితే’ సహజమైన ఆధునిక తెలుగు.
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: కాని నేను మీతో చెప్పేది ఏమిటంటే
  rationale: δέ యొక్క వ్యత్యాసాన్ని ‘కాని’తో నిలుపుతూ, యేసు అధికారపూర్వకంగా చెప్పే మాటను సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: τῷ πονηρῷ యొక్క అర్థం
  choice: 'వ్యక్తిని సూచించే సాధారణ భావం: ‘దుష్టుణ్ణి’'
  alternative: 'నైరూప్య భావం: ‘చెడును’; వ్యక్తిగత నిర్దిష్ట భావం: ‘దుష్టుడిని/దుష్టుని’'
  rationale: ఈ పదబంధం నిజంగా సందిగ్ధమైనది. అయితే వెంటనే వచ్చే చెంపపై కొట్టే వ్యక్తి ఉదాహరణ మానవ దుష్కర్త అనే భావానికి సందర్భపరంగా బలం ఇస్తుంది. ఇతర అవకాశాలను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ఏకవచన సంబోధనను ‘నీ’తో నిలిపి, ప్రధాన వాక్యంలోని బహువచన ‘మీతో’ను కూడా మూలానికి అనుగుణంగా ఉంచాం.
