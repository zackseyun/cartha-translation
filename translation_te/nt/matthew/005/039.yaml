  to: కాని నేను మీతో చెప్పేది ఏమిటంటే, దుష్టుణ్ణి ఎదిరించవద్దు.[a] బదులుగా, ఎవరైనా నీ కుడి చెంపపై కొడితే, అతనివైపు మరో చెంపను కూడా తిప్పు.[b]
