id: MAT.5.24
reference: Matthew 5:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: te
  text: నీ కానుకను అక్కడే బలిపీఠం ఎదుట వదిలి వెళ్లి, మొదట నీ సహోదరునితో[a] సయోధ్యపడు; ఆ తరువాత వచ్చి నీ కానుకను అర్పించు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరుడు’ అని అనువదించిన గ్రీకు పదం పుంలింగ ఏకవచనంలో ఉంది; ఈ సందర్భంలో సయోధ్య సూత్రం మరింత విస్తృతంగా కూడా వర్తించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες
  choice: ఉంచి
  rationale: ఇక్కడ ἀφίημι అంటే కానుకను ఆ స్థలంలోనే వదలి వెళ్లడం. తెలుగులో ‘ఉంచి’ అనేది ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: కానుకను అర్పించే స్థలానికి సంబంధించిన మూలపాఠంలోని ప్రదేశ సూచనను నిలుపుతుంది.
- source_word: τὸ δῶρόν σου
  choice: నీ కానుకను
  rationale: δῶρον దేవునికి తెచ్చే కానుక లేదా అర్పణను సూచిస్తుంది. బలిపీఠం అనే సందర్భంలో ‘కానుక’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: బలిపీఠం ఎదుట
  rationale: మూలపాఠంలోని స్థల సంబంధాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὕπαγε
  choice: వెళ్లి
  rationale: ఆజ్ఞార్థక కదలికను తెలుపుతూ, తరువాతి ఆజ్ఞతో సహజమైన వాక్యక్రమంలో కలుస్తుంది.
- source_word: πρῶτον
  choice: మొదట
  rationale: కానుక అర్పించడానికి ముందు సయోధ్యకు ఇవ్వబడిన ప్రాధాన్యాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: διαλλάγηθι
  choice: సయోధ్యపడు
  rationale: సంబంధం తిరిగి సరిచేయబడే భావాన్ని తెలియజేస్తుంది. ‘సయోధ్యపడు’ పరస్పర సంబంధాన్ని సహజంగా వ్యక్తం చేస్తూ, ఎవరిది తప్పు అనే అంశాన్ని అదనంగా నిర్ణయించదు.
- source_word: τῷ ἀδελφῷ σου
  choice: నీ సహోదరునితో
  rationale: దత్తి విభక్తితో ఉన్న సంబంధాన్ని తెలుగులో సహజంగా ‘తో’ ద్వారా వ్యక్తం చేసింది; ἀδελφός యొక్క పుంలింగ ఏకవచన రూపాన్ని ‘సహోదరుడు’ నిలుపుతుంది.
- source_word: τότε
  choice: ఆ తరువాత
  rationale: సయోధ్య అనంతరం కానుక అర్పించాలనే కాలక్రమాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐλθὼν
  choice: వచ్చి
  rationale: ప్రధాన ఆజ్ఞకు ముందు జరిగే చర్యను తెలుగు క్రియావిశేషణ రూపంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πρόσφερε
  choice: అర్పించు
  rationale: బలిపీఠం వద్ద దేవునికి కానుక సమర్పించే ఆరాధనా సందర్భానికి ‘అర్పించు’ సరైన ప్రామాణిక పదం.
theological_decisions:
- issue: ἀδελφός పదం వ్యక్తిగత నైతిక సంబంధంలో ఎవరిని సూచిస్తుంది
  choice: సహోదరుడు
  alternative: సహోదరుడు లేదా సహోదరి; తోటి విశ్వాసి
  rationale: గ్రీకు పదం పుంలింగ ఏకవచనంలో ఉన్నందున ప్రధాన పాఠంలో ఆ రూపాన్ని నిలిపాం. అయితే ఈ సందర్భంలోని సయోధ్య సూత్రం కేవలం మగ సహోదరునికే పరిమితమని నిర్ణయించకుండా విస్తృత అన్వయాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. ‘బలిపీఠం,’ ‘కానుక,’ ‘అర్పించు’ వంటి ఆరాధనా పదాలను సాధారణ పాఠకులకు అర్థమయ్యే సంప్రదాయ రూపాల్లో ఉంచి, ‘సయోధ్యపడు’ ద్వారా సంబంధ పునరుద్ధరణ భావాన్ని కాపాడాం.
