review_pass:
  verdict: revise
  source_fidelity: 'The first clause should retain the genitive relation in τοῦ κόσμου more closely: ‘లోకపు వెలుగు’ is preferable to ‘లోకానికి వెలుగు,’ which can suggest ‘light for/to the world.’ In the second clause, ‘దాగి ఉండలేదు’ is past/perfective in form and does not clearly convey οὐ δύναται (‘cannot’). A generic impossibility is naturally expressed by ‘దాగి ఉండదు.’'
  naturalness: The revision remains concise, dignified, and natural in modern standard Telugu. ‘కొండపై ఉన్న పట్టణం దాగి ఉండదు’ reads proverbially and idiomatically.
  terminology: ‘వెలుగు’ appropriately preserves the metaphor, ‘లోకపు’ represents the source genitive without interpretive expansion, and ‘పట్టణం’ is an appropriate rendering of πόλις. ‘కొండపై’ is a natural contextual rendering of ἐπάνω ὄρους; a footnote records the more literal ‘పర్వతం’ and ‘నెలకొని ఉన్న’ alternatives.
  issues:
  - severity: medium
    issue: ‘లోకానికి వెలుగు’ can imply a dative/purposive relationship.
    rationale: The Greek has τοῦ κόσμου, ‘of the world.’ Telugu ‘లోకపు వెలుగు’ more directly preserves this relation without adding a ‘for the world’ nuance.
  - severity: high
    issue: ‘దాగి ఉండలేదు’ does not represent the present, modal impossibility of οὐ δύναται κρυβῆναι.
    rationale: It is naturally read as a past statement (‘was not/has not remained hidden’). ‘దాగి ఉండదు’ idiomatically conveys the general impossibility intended by the saying.
  revised_text: మీరే లోకపు వెలుగు. కొండపై ఉన్న[a] పట్టణం దాగి ఉండదు.
