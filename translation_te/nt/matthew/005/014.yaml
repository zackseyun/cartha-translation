revisions:
- from: మీరే లోకానికి వెలుగు. కొండ మీద ఉన్న పట్టణం దాగి ఉండలేదు.
  to: మీరే లోకపు వెలుగు. కొండపై ఉన్న[a] పట్టణం దాగి ఉండదు.
  rationale: The revision corrects the genitive relation in the first clause and the modal/aspectual sense of the second clause. It preserves the explicit emphasis of Ὑμεῖς with ‘మీరే,’ the direct metaphor, and the visible elevated-city image. The footnote is anchored to the location-and-position phrase to document the literal lexical alternative without burdening the main text.
