id: MAT.5.14
reference: Matthew 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: te
  text: మీరే లోకపు వెలుగు. కొండపై ఉన్న[a] పట్టణం దాగి ఉండదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “పర్వతంపై నెలకొని ఉన్న పట్టణం దాగి ఉండదు.”
    reason: ἐπάνω ὄρους κειμένηకు ‘కొండపై ఉన్న’ అనేది సహజమైన ప్రధాన పాఠం; ‘పర్వతంపై నెలకొని ఉన్న’ అక్షరార్థానికి దగ్గరైన ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: Ὑμεῖς
  choice: మీరే
  rationale: గ్రీకులో కర్త సర్వనామం స్పష్టంగా, ఉద్ఘాటనతో ఉంది. తెలుగు క్రియలోనే పురుషవాచకం తెలిసినా, ‘మీరే’ ఆ ఉద్ఘాటనను సహజంగా నిలుపుతుంది; ఇది బహువచన గౌరవ/సమూహ సంబోధనకూ సరిపోతుంది.
- source_word: τὸ φῶς
  choice: వెలుగు
  rationale: ‘వెలుగు’ ఆధునిక తెలుగులో సహజమైనదీ, రూపకాన్ని నేరుగా నిలుపుకునేదీ. తెలుగులో నిర్దిష్ట ఉపపదం లేకపోవడంతో గ్రీకు article‌ను వేరుగా అనువదించాల్సిన అవసరం లేదు.
- source_word: τοῦ κόσμου
  choice: లోకానికి
  rationale: గ్రీకు genitive సంబంధాన్ని తెలుగులో ‘లోకానికి వెలుగు’ అని చెప్పడం సహజం. ఇది ‘లోకం కొరకు’ అనే ఉద్దేశార్థ వివరణను బలవంతంగా చేర్చకుండా, లోకంతో వెలుగుకు ఉన్న సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: οὐ δύναται
  choice: ఉండలేదు
  rationale: సామర్థ్యలేమి లేదా అసాధ్యతను తెలుగు వాక్యప్రయోగంలో ‘దాగి ఉండలేదు’ సహజంగా తెలియజేస్తుంది.
- source_word: πόλις
  choice: పట్టణం
  rationale: πόλιςకు ‘పట్టణం’ సాధారణ, విస్తృతంగా అర్థమయ్యే తెలుగు సమానం; ‘నగరం’ కూడా సాధ్యమే కానీ అది పెద్ద ఆధునిక నగరాన్ని ఎక్కువగా సూచించవచ్చు.
- source_word: κρυβῆναι
  choice: దాగి ఉండడం
  rationale: Passive infinitive భావాన్ని సందర్భానుసారంగా ‘దాగి ఉండలేదు’ అని సహజ తెలుగులో అందించాం; ‘మరుగుపరచబడదు’ అనేది అనవసరంగా బాహ్య కార్యసాధకుడిని సూచించవచ్చు.
- source_word: ἐπάνω ὄρους
  choice: కొండ మీద
  rationale: ὄρος కొండ లేదా పర్వతం అనే రెండింటినీ సూచించగలదు. కనిపించే ఎత్తైన ప్రదేశంలోని పట్టణం అనే సామెతసదృశ చిత్రానికి ‘కొండ మీద’ సహజంగా సరిపోతుంది.
- source_word: κειμένη
  choice: ఉన్న
  rationale: అక్షరార్థంగా ‘పడి ఉన్న/నెలకొని ఉన్న’ అనే స్థితిని సూచిస్తుంది. పట్టణానికి సంబంధించి ‘ఉన్న’ సరళంగా, సహజంగా అదే స్థానార్థాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: శిష్యులను లోకపు వెలుగుగా నేరుగా గుర్తించే రూపకం
  choice: ‘మీరే లోకానికి వెలుగు’ అనే ప్రత్యక్ష రూపకాన్ని నిలిపాం.
  alternative: ‘మీరు లోకం కోసం వెలుగుగా ఉన్నారు’
  rationale: మూలంలోని గుర్తింపు రూపకాన్ని వివరణాత్మక ఉద్దేశార్థంగా మార్చకుండా ఉంచాం. ‘మీరే’ గ్రీకు Ὑμεῖςలోని ఉద్ఘాటనను కూడా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వచనం. మూలంలోని రెండు సంక్షిప్త ప్రకటనలు, ప్రత్యక్ష రూపకం, కొండమీది పట్టణం అనే దృశ్యరూపం నిలుపబడ్డాయి. ఆంగ్ల POBలోని [a] గమనిక వాస్తవానికి రెండవ వాక్యంలోని పదప్రయోగానికి సంబంధించినదిగా కనిపించినా, తెలుగు ప్రధాన పాఠం ‘కొండ మీద ఉన్న’ అని మూలార్థాన్ని సహజంగానే అందిస్తున్నందున ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
