review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the purposive force of ὅπως with γένησθε ('కావడానికి'), the explicit masculine filial term υἱοὶ ('కుమారులు'), God's possessive 'his sun,' and the two balanced moral pairs. However, it omits the explicit explanatory conjunction ὅτι ('because'), and its progressive verbs ('ఉదయింపజేస్తున్నాడు,' 'కురిపిస్తున్నాడు') can suggest a presently ongoing event rather than the Greek generic/habitual statement.
  naturalness: The word order is workable, but adding 'ఎందుకంటే' makes the logic clear and natural. Simple present habitual forms are more idiomatic here than progressive forms. 'మీ తండ్రికి కుమారులు' is a natural Telugu relational construction.
  terminology: ‘కుమారులు’ appropriately preserves υἱοὶ, with a footnote offering ‘పిల్లలు.’ ‘పరలోకాల్లో’ reflects the Greek plural without requiring an interpretive expansion. ‘నీతిమంతులు/అనీతిమంతులు’ preserves the established moral contrast of δικαίους/ἀδίκους.
  issues:
  - severity: medium
    issue: The explicit conjunction ὅτι is not represented.
    rationale: The source gives the Father's indiscriminate beneficence as the explanatory ground for the purpose clause. Telugu should state this with ‘ఎందుకంటే’ (or an equivalent).
  - severity: low
    issue: The verbs are rendered as progressive present forms.
    rationale: ἀνατέλλει and βρέχει are generic presents in this maxim. Telugu simple present forms better convey habitual divine action without narrowing it to an action occurring at the moment.
