id: MAT.5.45
reference: Matthew 5:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: te
  text: మీరు పరలోకాల్లో ఉన్న మీ తండ్రికి కుమారులు కావడానికి, ఎందుకంటే ఆయన చెడ్డవారిపైనా మంచివారిపైనా తన సూర్యుణ్ణి ఉదయింపజేస్తాడు, నీతిమంతులపైనా అనీతిమంతులపైనా వర్షం కురిపిస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పిల్లలు’ అని కూడా అనువదించవచ్చు. గ్రీకులో అక్షరార్థంగా ‘కుమారులు’ ఉంది; మూలంలోని తండ్రి–కుమారుల సంబంధ భాషను నిలుపడానికి ప్రధాన పాఠంలో అదే ఉంచబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: కావడానికి
  rationale: ఉద్దేశం లేదా ఫలితాన్ని సూచించే ὅπως భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γένησθε
  choice: కావడానికి
  rationale: γίνομαι యొక్క ‘అవడం/కావడం’ అనే చలనాత్మక భావాన్ని నిలుపుతుంది; స్థిరమైన ‘ఉండడం’గా మార్చదు.
- source_word: υἱοὶ
  choice: కుమారులు
  rationale: గ్రీకు మూలంలోని స్పష్టమైన పుంలింగ బహువచనాన్నీ, తండ్రి–కుమారుల సంబంధ భాషనూ నిలుపుతుంది; సందర్భంలో ఇది శిష్యులందరినీ ప్రతినిధిగా ఉద్దేశించగలదు.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: మీ తండ్రికి
  rationale: తెలుగులో ‘తండ్రికి కుమారులు’ అనే సహజ సంబంధ నిర్మాణంతో గ్రీకు షష్ఠీ విభక్తి భావాన్ని తెలియజేస్తుంది.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: పరలోకాల్లో ఉన్న
  rationale: οὐρανοῖς బహువచన రూపాన్ని కనిపించేలా ఉంచుతూ మత్తయి ప్రయోగంలోని దేవుని పరలోక నివాస భావాన్ని అందిస్తుంది.
- source_word: ὅτι
  choice: ఆయన ... కురిపిస్తున్నాడు
  rationale: తెలుగు వాక్య నిర్మాణంలో తరువాతి కార్యాలే ముందటి ఉద్దేశానికి వివరణాత్మక ఆధారంగా సహజంగా నిలుస్తాయి; ‘ఎందుకంటే’ చేర్చకుండానే సంబంధం స్పష్టంగా ఉంటుంది.
- source_word: τὸν ἥλιον αὐτοῦ
  choice: తన సూర్యుణ్ణి
  rationale: αὐτοῦలోని స్వామ్య భావాన్ని స్పష్టంగా నిలుపుతూ, తెలుగు కర్తకు అనుగుణంగా ‘తన’ను వాడుతుంది.
- source_word: ἀνατέλλει
  choice: ఉదయింపజేస్తున్నాడు
  rationale: సూర్యుణ్ణి కర్మగా తీసుకున్న క్రియలోని కారణార్థక భావాన్నీ దేవుని క్రియాశీలతనూ నిలుపుతుంది.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: చెడ్డవారిమీద, మంచివారిమీద
  rationale: నామవాచకాలుగా పనిచేసే విశేషణాలను తెలుగులో వ్యక్తులను సూచించే సహజ రూపాలతో, మూలంలోని సమతూకంతో అందిస్తుంది.
- source_word: βρέχει
  choice: వర్షం కురిపిస్తున్నాడు
  rationale: దేవుడే కర్తగా ఉన్నాడని సహజ తెలుగులో స్పష్టపరుస్తూ βρέχει అర్థాన్ని అందిస్తుంది.
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: నీతిమంతులమీద, అనీతిమంతులమీద
  rationale: δίκαιος/ἄδικος అనే స్థిర నైతిక వ్యత్యాసాన్ని సాధారణ బైబిలు తెలుగులో కచ్చితంగా నిలుపుతుంది.
theological_decisions:
- issue: లింగసూచక కుమారత్వ భాష
  choice: మీ తండ్రికి కుమారులు
  alternative: మీ తండ్రి పిల్లలు
  rationale: మూలంలో τέκνα కాక υἱοὶ ఉంది. ‘కుమారులు’ మూలంలోని కుమారత్వ రూపకాన్ని నిలుపుతుంది; దాని సందర్భోచిత ప్రతినిధి పరిధిని అనవసరంగా కుదించదు.
- issue: γένησθε మరియు దేవుని కుమారత్వం
  choice: కుమారులు కావడానికి
  alternative: కుమారులుగా ఉండడానికి / కుమారులని వెల్లడికావడానికి
  rationale: ‘కావడం’ గ్రీకు క్రియ యొక్క సహజ బలాన్ని నిలుపుతుంది. అయితే మానవ కార్యాల వల్ల రక్షణాత్మక దత్తత ఏర్పడుతుందనే సిద్ధాంతాన్ని అనువాదం అదనంగా చేర్చదు; సందర్భం తండ్రి స్వభావాన్ని అనుకరించడంపై ఉంది.
- issue: దేవుని సమాన ఉపకారం
  choice: చెడ్డవారిమీద, మంచివారిమీద ... నీతిమంతులమీద, అనీతిమంతులమీద
  alternative: కేవలం దేవునికి విధేయులైన వారిపై ఉపకారం
  rationale: వచనం దేవుని సూర్యకాంతి, వర్షం నైతికంగా భిన్నమైన రెండు వర్గాలకూ అందుతాయని స్పష్టంగా చెబుతుంది; ఆ ఉద్రిక్తతను యథాతథంగా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పరలోకాల్లో’ మూలంలోని బహువచనాన్ని నిలుపుతుంది. సమాంతర జంటల లయను కాపాడటానికి ‘చెడ్డవారిమీద, మంచివారిమీద’ మరియు ‘నీతిమంతులమీద, అనీతిమంతులమీద’ అనే నిర్మాణం వాడబడింది.
