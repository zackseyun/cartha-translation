id: MAT.5.23
reference: Matthew 5:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: te
  text: కాబట్టి, నీవు నీ కానుకను బలిపీఠం మీద అర్పిస్తున్నప్పుడు, అక్కడ నీ సహోదరునికి నీ మీద ఏదైనా అభ్యంతరం ఉందని నీకు గుర్తుకు వస్తే,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీ సహోదరునికి’ అని మూల గ్రీకు పాఠం పుంలింగ ఏకవచనంలో చెబుతుంది; సందర్భంలో ఇది సహోదరిని కూడా ప్రాతినిధ్యంగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: కాబట్టి ... వస్తే
  rationale: οὖν ముందున్న బోధన నుంచి వచ్చే నిర్ధారణను ‘కాబట్టి’తో, ἐὰν షరతును వాక్యాంతంలోని ‘వస్తే’తో సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: προσφέρῃς τὸ δῶρόν σου
  choice: నీవు నీ కానుకను ... అర్పిస్తూ ఉన్నప్పుడు
  rationale: προσφέρῃς అర్పణ సందర్భంలోని సమర్పణ క్రియను సూచిస్తుంది; వర్తమాన కాలపు సజీవ దృశ్యాన్ని ‘అర్పిస్తూ ఉన్నప్పుడు’ తెలియజేస్తుంది. δῶρον యొక్క సాధారణ భావాన్ని ‘కానుక’ కాపాడుతుంది.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: బలిపీఠం మీద
  rationale: ἐπί + accusative అర్పణను బలిపీఠం మీద ఉంచే దిశాత్మక భావాన్ని అనుమతిస్తుంది; ‘మీద’ మూలంలోని స్థాన సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: κἀκεῖ μνησθῇς
  choice: అక్కడ ... గుర్తుకు వస్తే
  rationale: κἀκεῖ లోని స్థల ప్రాధాన్యాన్ని ‘అక్కడ’ నిలుపుతుంది. μνησθῇς ను తెలుగులో సహజంగా ‘గుర్తుకు వస్తే’ అని ఇచ్చి, జ్ఞాపకం స్వయంగా వచ్చిందా లేక ప్రేరేపించబడిందా అన్నది నిర్ణయించదు.
- source_word: ὁ ἀδελφός σου
  choice: నీ సహోదరునికి
  rationale: మూలపాఠంలోని పుంలింగ ఏకవచన బంధుత్వ పదాన్ని అలాగే ప్రతిబింబిస్తుంది; సందర్భంలో అది ప్రాతినిధ్యార్థంగా ఉండవచ్చనే విషయాన్ని పాదటిప్పణిలో సూచిస్తుంది.
- source_word: ἔχει τι κατὰ σοῦ
  choice: నీ మీద ఏదో ఉంది
  rationale: ‘నీకు వ్యతిరేకంగా ఏదో కలిగి ఉండడం’ అనే గ్రీకు నుడికారాన్ని సహజంగా తెలుగులో అందిస్తూ, τι లోని ఉద్దేశపూర్వక అనిర్దిష్టతను ‘ఏదో’తో కాపాడుతుంది; ‘ఫిర్యాదు’ లేదా ‘అభ్యంతరం’ అని మరీ నిర్దిష్టం చేయదు.
theological_decisions:
- issue: ἀδελφός అనే లింగసూచక బంధుత్వ పదం
  choice: నీ సహోదరునికి
  alternative: నీ సహోదరునికిగాని సహోదరికిగాని / తోటి విశ్వాసికి
  rationale: గ్రీకు పదం పుంలింగ ఏకవచనంలో ఉంది. ప్రధాన పాఠంలో దాని రూపాన్ని నిలిపి, సందర్భంలో స్త్రీని కూడా ప్రాతినిధ్యంగా కలుపుకోవచ్చనే అవకాశాన్ని పాదటిప్పణిలో తెలియజేయడం మూలానికి నిష్ఠగా ఉంటుంది.
- issue: ἔχει τι κατὰ σοῦ యొక్క అభియోగ స్వభావం
  choice: నీ మీద ఏదో ఉంది
  alternative: నీ మీద ఏదైనా అభ్యంతరం ఉంది
  rationale: మూలంలోని τι అనిర్దిష్టంగా ఉంది. ‘అభ్యంతరం’ అని నిర్దిష్టపరచకుండా ఉంచడం వల్ల తప్పు ఎవరిది, విషయం ఎంత తీవ్రమైనది వంటి అంశాలను అనువాదం ముందుగానే తీర్మానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. వాక్యం తరువాతి వచనంలో పూర్తయ్యే షరతు వాక్యమని చూపేందుకు చివర కామా ఉంచబడింది.
