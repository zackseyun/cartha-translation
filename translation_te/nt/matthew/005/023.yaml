review_pass:
  verdict: revise
  source_fidelity: The conditional and inferential force, ongoing offering scenario, altar location, spatial ‘there,’ and masculine singular ‘brother’ are retained. However, ‘నీ సహోదరునికి నీ మీద ఏదో ఉంది’ is not idiomatic Telugu for ἔχει τι κατὰ σοῦ and can sound like an unspecified thing is physically or generally ‘on’ the brother. The Greek idiom denotes that the brother has some complaint or objection against the hearer, while leaving its content unspecified.
  naturalness: The sentence is otherwise clear and appropriately formal-modern. Replacing the literalized idiom with ‘నీ మీద ఏదైనా అభ్యంతరం ఉందని’ gives natural Telugu while retaining the indefinite force of τι.
  terminology: ‘కానుక,’ ‘బలిపీఠం,’ and ‘సహోదరుడు’ are suitable in this sacrificial and ethical context. The gender note appropriately identifies the masculine singular Greek term without expanding the main text.
  issues:
  - severity: medium
    issue: Literalized Telugu rendering of ἔχει τι κατὰ σοῦ
    rationale: ‘నీ సహోదరునికి నీ మీద ఏదో ఉంది’ does not naturally communicate that the brother holds an unspecified grievance against the addressee. ‘నీ మీద ఏదైనా అభ్యంతరం ఉంది’ accurately conveys the idiom and preserves its intentional indefiniteness.
  revised_text: కాబట్టి, నీవు నీ కానుకను బలిపీఠం మీద అర్పిస్తున్నప్పుడు, అక్కడ నీ సహోదరునికి నీ మీద ఏదైనా అభ్యంతరం ఉందని నీకు గుర్తుకు వస్తే,[a]
