id: MAT.5.40
reference: Matthew 5:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: te
  text: మరియు నీపై న్యాయస్థానంలో దావా వేసి నీ లోపలి వస్త్రాన్ని తీసుకోవాలని కోరుకునేవానికి, నీ పైవస్త్రాన్ని కూడా ఇచ్చివేయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “లోపలి వస్త్రం” శరీరానికి దగ్గరగా ధరించేది; “పైవస్త్రం” దాని పైన ధరించేది.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: కోరేవానికి
  rationale: వర్తమానకాల కృదంతం సాధారణంగా అలాంటి ఉద్దేశం గల వ్యక్తిని సూచిస్తుంది; ‘కోరేవానికి’ సహజంగా ఉండి θέλω లోని సంకల్ప భావాన్ని నిలుపుతుంది.
- source_word: σοι κριθῆναι
  choice: నీతో న్యాయస్థానంలో వ్యాజ్యమాడి
  rationale: క్రియాపదం అక్షరార్థంగా న్యాయవిచారణకు వెళ్లడాన్ని సూచిస్తుంది; వస్త్రాన్ని తీసుకోవాలనే సందర్భంలో ఇది న్యాయపరమైన దావాను తెలియజేస్తుంది.
- source_word: χιτῶνά
  choice: లోపలి వస్త్రం
  rationale: χιτών శరీరానికి దగ్గరగా ధరించే వస్త్రం; ఆధునిక తెలుగు పాఠకునికి చారిత్రక వస్త్రభేదాన్ని స్పష్టంగా తెలియజేయడానికి వివరణాత్మక సమానార్థకం వాడబడింది.
- source_word: λαβεῖν
  choice: తీసుకోవాలని
  rationale: న్యాయపరమైన సందర్భంలో వస్తువును స్వాధీనం చేసుకోవడం అనే సాధారణ భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἄφες
  choice: ఇచ్చివేయి
  rationale: ἀφίημι ఇక్కడ ఎదుటివానికి దానిని వదలివేయడం లేదా పొందనివ్వడం అనే ఆజ్ఞార్థక భావం కలిగి ఉంది; ‘ఇచ్చివేయి’ ఆ తీవ్రమైన ఆజ్ఞను సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἱμάτιον
  choice: పైవస్త్రం
  rationale: ἱμάτιον χιτών పైన ధరించే బయటి వస్త్రం; ‘పైవస్త్రం’ లోపలి వస్త్రంతో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: καὶ ... καὶ
  choice: మరియు సంబంధం ... కూడా
  rationale: మొదటి καί ముందున్న ఉపదేశంతో ఈ వాక్యాన్ని కలుపుతుంది; తెలుగులో వాక్యారంభ సంధి సందర్భానుసారంగా అంతర్లీనంగా ఉండగా, రెండవ καί ‘కూడా’గా వ్యక్తమై అదనపు త్యాగాన్ని నొక్కిచెబుతుంది.
theological_decisions:
- issue: న్యాయవివాదంలో యేసు ఆజ్ఞ యొక్క నైతిక తీవ్రత
  choice: ప్రతీకారం తీర్చుకోకుండా, తన హక్కును కూడా విడిచిపెట్టే తీవ్రమైన ఉదారతకు ప్రత్యక్ష ఆజ్ఞగా అనువదించడం
  alternative: హక్కులను వదులుకోవాలనే సాధారణ సూత్రంగా సడలించి అనువదించడం
  rationale: ἄφες అనే ఆజ్ఞార్థక రూపం, నిర్దిష్ట వస్త్రాల దృశ్యం కలిసి ఉపదేశపు పదునును నిలుపుతున్నాయి. దానిని రూపకంగా మాత్రమే మార్చకుండా, ఏ ప్రత్యేక సిద్ధాంత వ్యవస్థను చేర్చకుండా అనువాదం ఆ తీవ్రతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే పదజాలం. ‘వ్యాజ్యమాడి’ న్యాయపరమైన సందర్భాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; వస్త్రాల చారిత్రక భేదం ప్రధాన వాక్యంలోనే స్పష్టమై, పాదసూచికలో ధృవీకరించబడింది.
