id: MAT.5.25
reference: Matthew 5:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: te
  text: నీ ప్రత్యర్థిపట్ల త్వరగా అనుకూలంగా ఉండు[a], దారిలో నీవు అతనితో ఉన్నప్పుడే; లేకపోతే నీ ప్రత్యర్థి నిన్ను న్యాయాధిపతికి అప్పగిస్తాడు, న్యాయాధిపతి నిన్ను అధికారికి అప్పగిస్తాడు, అప్పుడు నిన్ను చెరసాలలో వేయబడతావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ న్యాయపరమైన సందర్భంలో మరింత భావానువాదంగా, “నీ ప్రత్యర్థితో త్వరగా రాజీ కుదుర్చుకో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: సఖ్యంగా ఉండు
  rationale: ‘అనుకూల భావంతో ఉండడం’ అనే εὐνοέω మూలభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది. న్యాయపరమైన రాజీని ప్రధాన పాఠ్యంలోనే స్పష్టంగా చేర్చకుండా, సందర్భంలో ఉన్న సూచనను నిలుపుతుంది.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: ప్రత్యర్థి
  rationale: న్యాయాధిపతి, అధికారి, చెరసాల అనే పదాలు దీనికి న్యాయపరమైన సందర్భాన్ని ఇస్తాయి. ‘ప్రత్యర్థి’ విస్తృత మూలార్థాన్ని కాపాడుతూ తెలుగులో సహజంగా ఉంది; ‘నిందారోపణ చేసేవాడు’ అనడం మూలంలో లేని క్రిమినల్ ఆరోపణ భావాన్ని బలపరచవచ్చు.
- source_word: ταχὺ
  choice: త్వరగా
  rationale: ఆజ్ఞలోని అత్యవసరతను నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: దారిలో నీవు అతనితో ఉన్నప్పుడే
  rationale: న్యాయస్థానానికి వెళ్తున్నారనే భావాన్ని వివరణగా చేర్చకుండా, కలిసి దారిలో ఉన్నారనే స్పష్టమైన చిత్రణను నిలుపుతుంది.
- source_word: μήποτέ
  choice: లేకపోతే … వేయబడవచ్చు
  rationale: హెచ్చరికలోని సంభావ్యతను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఫలితం తప్పనిసరిగా జరుగుతుందని అతిగా నిర్ధారించదు.
- source_word: παραδῷ
  choice: అప్పగించి
  rationale: న్యాయపరమైన అధికార బదిలీని స్పష్టంగా తెలిపే సహజమైన తెలుగు పదం.
- source_word: κριτῇ / κριτὴς
  choice: న్యాయాధిపతి
  rationale: న్యాయ సందర్భంలో κριτήςకు స్పష్టమైన, గౌరవప్రదమైన ప్రామాణిక తెలుగు సమానం.
- source_word: ὑπηρέτῃ
  choice: అధికారి
  rationale: న్యాయాధిపతి ఆదేశాన్ని అమలు చేసే అధీన అధికారిని సూచిస్తుంది. ‘న్యాయస్థాన అధికారి’ అని విస్తరించకుండా మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: εἰς φυλακὴν
  choice: చెరసాలలో
  rationale: φυλακή యొక్క నిర్బంధ స్థల భావాన్ని గంభీరమైన, సాధారణంగా అర్థమయ్యే తెలుగులో తెలియజేస్తుంది.
- source_word: βληθήσῃ
  choice: వేయబడవచ్చు
  rationale: βάλλωలోని బలమైన ‘వేయడం’ భావాన్ని నిలుపుతూ, μήποτεతో వచ్చిన హెచ్చరిక సంభావ్యతను కూడా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆరంభ ఆజ్ఞను న్యాయపరమైన రాజీగా స్పష్టీకరించాలా, లేక అనుకూల వైఖరి అనే పదార్థాన్ని నిలుపాలా
  choice: ప్రధాన పాఠ్యంలో ‘సఖ్యంగా ఉండు’ అని ఉంచడం
  alternative: ‘త్వరగా రాజీ కుదుర్చుకో’
  rationale: న్యాయపరమైన సందర్భం రాజీ భావాన్ని బలంగా సూచించినా, εὐνοέω నేరుగా అనుకూల వైఖరిని సూచిస్తుంది. కాబట్టి ప్రధాన పాఠ్యం ఆ పదార్థాన్ని నిలుపుతుంది; సందర్భానుకూలమైన రాజీ అర్థాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘సఖ్యంగా ఉండు’ మూలంలోని అనుకూల వైఖరిని కాపాడుతుంది; ‘రాజీ కుదుర్చుకో’ అనే సందర్భానుకూల న్యాయార్థం పాదసూచికకు పరిమితం చేయబడింది.
