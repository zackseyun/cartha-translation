review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the legal sequence and the concrete ‘on the way’ setting. However, ‘అలా చేయి’ is an added second command not present in Greek, and ‘వేయబడవచ్చు’ weakens the warning’s future consequence; βληθήσῃ is better represented by a future passive, ‘వేయబడతావు.’
  naturalness: The proposed revision is idiomatic modern standard Telugu and retains a sober legal register. ‘నీ ప్రత్యర్థిపట్ల అనుకూలంగా ఉండు’ conveys favorable disposition without making the settlement interpretation the main-text wording.
  terminology: ‘ప్రత్యర్థి,’ ‘న్యాయాధిపతి,’ ‘అధికారి,’ and ‘చెరసాల’ appropriately convey the legal progression. The alternative ‘రాజీ కుదుర్చుకో’ remains suitably confined to the footnote as a contextual rendering.
  issues:
  - severity: medium
    issue: 'Added wording: ‘అలా చేయి’'
    rationale: The Greek contains one opening imperative followed by its temporal qualification; it does not add a separate command equivalent to ‘do so.’
  - severity: medium
    issue: ‘వేయబడవచ్చు’ makes the final result merely possible
    rationale: μήποτε introduces the warning (‘lest’), but the apodosis uses the future passive βληθήσῃ. Telugu should retain the warned-of future consequence rather than soften it to ‘may be thrown.’
  - severity: low
    issue: ‘సఖ్యంగా ఉండు’ can suggest friendship more strongly than favorable disposition
    rationale: εὐνοῶν denotes being favorably disposed. ‘అనుకూలంగా ఉండు’ is more semantically precise while still natural in the legal context.
  revised_text: నీ ప్రత్యర్థిపట్ల త్వరగా అనుకూలంగా ఉండు[a], దారిలో నీవు అతనితో ఉన్నప్పుడే; లేకపోతే నీ ప్రత్యర్థి నిన్ను న్యాయాధిపతికి అప్పగిస్తాడు, న్యాయాధిపతి నిన్ను అధికారికి అప్పగిస్తాడు, అప్పుడు నిన్ను చెరసాలలో వేయబడతావు.
