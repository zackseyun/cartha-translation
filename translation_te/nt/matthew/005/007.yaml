translation:
  language: te
  text: కనికరం గలవారు ధన్యులు; ఎందుకంటే వారే కనికరం పొందుతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారిపై కనికరం చూపబడుతుంది.’ గ్రీకులో ఇది భవిష్యత్‌కాల కర్మణి క్రియ.
    reason: కర్మణి రూపాన్ని మరింత ప్రత్యక్షంగా చూపే అనువాద ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: μακάριοι
  choice: ధన్యులు
  rationale: ఇది కేవలం మనసులో కలిగే సంతోషాన్ని కాక, దేవుని అనుగ్రహంలో ఉన్న శ్రేయోస్థితిని సూచించే ధన్యవచన పదం. తెలుగులో స్థిరపడిన, గంభీరమైన ‘ధన్యులు’ ఆ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: οἱ ἐλεήμονες
  choice: కనికరంగలవారు
  rationale: ఆర్టికల్‌తో వచ్చిన విశేషణం వ్యక్తులను సూచిస్తోంది. ‘కనికరంగలవారు’ సంక్షిప్తంగా, సహజంగా ఉండటమే కాక, తరువాతి ἐλεηθήσονται తో ఉన్న కనికర భావపు పదసంబంధాన్ని నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ధన్యులని చెప్పడానికి కారణాన్ని పరిచయం చేసే స్పష్టమైన ఆధునిక తెలుగు అనుసంధాన పదం.
- source_word: αὐτοὶ
  choice: వారే
  rationale: గ్రీకు సర్వనామంలోని ఉద్ఘాటనను నిలుపుతూ, కనికరం చూపేవారికి మరియు దాన్ని పొందేవారికి మధ్య ఉన్న అనురూపతను వ్యక్తం చేస్తుంది.
- source_word: ἐλεηθήσονται
  choice: కనికరం పొందుతారు
  rationale: భవిష్యత్‌కాల కర్మణి రూపంలోని వాగ్దానాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కనికరం చూపే కర్తను పేర్కొనదు, అలాగే ముందు పదంతో భావపరమైన పునరుక్తిని నిలుపుతుంది.
theological_decisions:
- issue: వాగ్దానం చేసిన కనికరాన్ని చూపే కర్త ఎవరు?
  choice: కర్తను పేర్కొనకుండా ‘కనికరం పొందుతారు’ అని అనువదించడం
  alternative: ‘దేవుడు వారిపై కనికరం చూపుతాడు’ లేదా ‘ఇతరులు వారిపై కనికరం చూపుతారు’
  rationale: సందర్భంలో దేవుడే కర్త అనే భావం బలంగా సూచించబడవచ్చు; అయినా గ్రీకు కర్మణి క్రియ కర్తను స్పష్టంగా పేర్కొనదు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా ధన్యవచనానికి తగిన సంక్షిప్తత, గంభీరత నిలుపబడ్డాయి. ‘కనికరం’ అనే పదాన్ని రెండు భాగాల్లోనూ ఉంచి గ్రీకు మూలంలోని పదప్రతిధ్వనిని కాపాడాం.
