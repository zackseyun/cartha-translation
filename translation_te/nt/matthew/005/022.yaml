revisions:
- from: 'అయితే నేను మీతో చెబుతున్నాను: తన సహోదరునిపై కోపపడే ప్రతి వ్యక్తి తీర్పుకు పాత్రుడవుతాడు.[a] తన సహోదరుణ్ణి ‘రాకా’[b] అని అనేవాడు మహాసభ[c] ఎదుట జవాబుదారుడవుతాడు. ‘మూర్ఖుడా!’ అని అనేవాడు అగ్నిగల గెహెన్నాకు[e] పాత్రుడవుతాడు.[d]'
  to: 'అయితే నేను మీతో చెబుతున్నాను: తన సహోదరుని మీద కోపపడే ప్రతి వ్యక్తి[d] తీర్పుకు జవాబుదారుడవుతాడు.[a] తన సహోదరుణ్ణి ‘రాకా’[b] అని అనేవాడు సభకు జవాబుదారుడవుతాడు.[c] ‘మూర్ఖుడా!’ అని అనేవాడు అగ్ని గెహెన్నాకు[e] జవాబుదారుడవుతాడు.'
  rationale: The revision corrects the misplaced gender-note anchor, avoids making συνέδριον a definite ‘high council’ in the main text, and improves Telugu idiom and legal parallelism without changing the source sense or resolving disputed referential detail beyond the source and audit trail.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:30:25Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the three escalating warnings, retains the absence of ‘without cause’ from the SBLGNT main text, transliterates Ῥακά and γέεννα, and does not add a recipient to the final insult. However, ‘మహాసభ’ is more specific/elevated than συνέδριον (‘council’), and the legal-liability formulation should be more uniform.
  naturalness: The Telugu is generally clear and modern. ‘అగ్నిగల గెహెన్నా’ is less idiomatic than ‘అగ్ని గెహెన్నా,’ and ‘సభకు జవాబుదారుడవుతాడు’ is more direct than ‘మహాసభ ఎదుట జవాబుదారుడవుతాడు.’
  terminology: ‘గెహెన్నా,’ ‘రాకా,’ and ‘మూర్ఖుడా’ are appropriate. ‘సభ’ retains the generality of συνέδριον, while the Sanhedrin identification remains properly confined to a note. The representative-use note for ‘సహోదరుడు’ must be anchored to that word rather than to Gehenna.
  issues:
  - severity: medium
    issue: The [d] footnote anchor is attached after ‘గెహెన్నాకు,’ although its note explains ‘సహోదరుడు.’
    rationale: Footnote anchors must occur at the word or phrase they explain. Its present placement misleadingly associates the gender note with the final clause.
  - severity: low
    issue: ‘మహాసభ’ over-specifies συνέδριον.
    rationale: The Greek term can mean ‘council’; whether it specifically denotes the Sanhedrin is appropriately presented as an alternative in the footnote, not embedded in the main text.
  - severity: low
    issue: The liability wording and Gehenna phrase can be made more idiomatic and parallel.
    rationale: Using ‘జవాబుదారుడవుతాడు’ throughout preserves ἔνοχος ἔσται and the verse’s legal escalation; ‘అగ్ని గెహెన్నా’ naturally expresses ‘Gehenna of fire.’
  revised_text: 'అయితే నేను మీతో చెబుతున్నాను: తన సహోదరుని మీద కోపపడే ప్రతి వ్యక్తి[d] తీర్పుకు జవాబుదారుడవుతాడు.[a] తన సహోదరుణ్ణి ‘రాకా’[b] అని అనేవాడు సభకు జవాబుదారుడవుతాడు.[c] ‘మూర్ఖుడా!’ అని అనేవాడు అగ్ని గెహెన్నాకు[e] జవాబుదారుడవుతాడు.'
