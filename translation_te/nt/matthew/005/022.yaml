id: MAT.5.22
reference: Matthew 5:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: te
  text: 'అయితే నేను మీతో చెబుతున్నాను: తన సహోదరుని మీద కోపపడే ప్రతి వ్యక్తి[d] తీర్పుకు జవాబుదారుడవుతాడు.[a] తన సహోదరుణ్ణి ‘రాకా’[b] అని అనేవాడు సభకు జవాబుదారుడవుతాడు.[c] ‘మూర్ఖుడా!’ అని అనేవాడు అగ్ని గెహెన్నాకు[e] జవాబుదారుడవుతాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘తన సహోదరుని మీద కారణం లేకుండా కోపపడే’ అని ఉంది. అత్యంత ప్రాచీనమైన, బలమైన సాక్ష్యాలున్న పాఠంలో ‘కారణం లేకుండా’ అనే మాటలు లేవు.
    reason: textual_variant
  - marker: b
    text: ‘రాకా’ అనేది అరామీయ భాషలోని అవమానకరమైన మాట; సుమారుగా ‘బుర్రలేనివాడా’ లేదా ‘పనికిరానివాడా’ అనే భావం.
    reason: cultural_note
  - marker: c
    text: లేదా ‘సన్హెద్రిన్’; ఇది యూదుల పాలక న్యాయమండలి.
    reason: alternative_reading
  - marker: d
    text: ‘సహోదరుడు’ అని అనువదించిన గ్రీకు పదం పుంలింగ ఏకవచనంలో ఉంది; అయితే ఇక్కడ అది విస్తృత ప్రతినిధి భావంలో ఉపయోగించబడింది, కేవలం మగ తోబుట్టువులకే ఈ బోధ పరిమితం కాదు.
    reason: lexical_alternative
  - marker: e
    text: లేదా ‘అగ్ని నరకం.’ ‘గెహెన్నా’ అనేది యేసు ఉపయోగించిన నిర్దిష్ట పదాన్ని నిలుపుతుంది; అది తీర్పుతో ముడిపడిన హిన్నోము లోయ చిత్రణ నుంచి వచ్చింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: అయితే నేను మీతో చెబుతున్నాను
  rationale: δέ సూచించే వ్యత్యాసాన్ని ‘అయితే’తో, ἐγώ యొక్క ఉద్ఘాటనను స్పష్టమైన ‘నేను’తో నిలుపుతూ సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణాన్ని వాడింది.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: కోపపడే ప్రతి వ్యక్తి
  rationale: వర్తమాన కృదంతంలోని సాధారణ, సూత్రప్రాయ భావాన్ని నిలుపుతుంది; కోపం మొదలయ్యే క్షణమా లేక కొనసాగుతున్న స్థితియా అని అనవసరంగా నిర్ధారించదు.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: తన సహోదరునిపై / తన సహోదరుణ్ణి
  rationale: ἀδελφός యొక్క పుంలింగ ఏకవచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపింది; దాని విస్తృత ప్రతినిధి ప్రయోగాన్ని పాదసూచికలో తెలిపింది.
- source_word: ἔνοχος ἔσται
  choice: పాత్రుడవుతాడు / జవాబుదారుడవుతాడు
  rationale: శిక్షాత్మక న్యాయపరమైన బాధ్యతను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది. సభ ఎదుట అనే నిర్మాణంలో ‘జవాబుదారుడు’ మరింత సహజం; మిగిలిన చోట్ల ‘పాత్రుడు’ సమాంతర హెచ్చరికను నిలుపుతుంది.
- source_word: τῇ κρίσει
  choice: తీర్పుకు
  rationale: ఇది స్థానిక న్యాయస్థానాన్నే సూచిస్తుందని నిర్ధారించకుండా, తీర్పు లేదా న్యాయవిచారణ అనే మూలంలోని విస్తృత న్యాయార్థాన్ని కాపాడుతుంది.
- source_word: Ῥακά
  choice: రాకా
  rationale: గ్రీకు పాఠ్యంలో భద్రపరచబడిన అరామీయ దూషణను లిప్యంతరీకరించి, దాని సుమారు అర్థాన్ని పాదసూచికలో వివరించింది.
- source_word: τῷ συνεδρίῳ
  choice: మహాసభ ఎదుట
  rationale: సాధారణ చిన్న సభకన్నా ఉన్నత న్యాయమండలి భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; ఇది సన్హెద్రిన్ అనే సాంకేతిక నామమే కావచ్చనే అవకాశాన్ని పాదసూచికలో ఉంచింది.
- source_word: Μωρέ
  choice: మూర్ఖుడా!
  rationale: సంబోధనలోని ప్రత్యక్ష అవమానాన్ని తెలుగు సంబోధన రూపంతో నిలుపుతుంది; ఆధునిక వైద్య లేదా మేధో వర్గీకరణను సూచించే పదాలను నివారిస్తుంది.
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: అగ్నిగల గెహెన్నాకు
  rationale: γέεννα అనే నిర్దిష్ట చారిత్రక-న్యాయతీర్పు పదాన్ని నిలుపుతూ, τοῦ πυρός లోని అగ్ని చిత్రణను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: γέεννα అనువాదం
  choice: గెహెన్నా
  alternative: నరకం / అగ్ని నరకం
  rationale: యేసు ఉపయోగించిన హిన్నోము లోయ నేపథ్యమున్న నిర్దిష్ట పదాన్ని కాపాడుతుంది; తరువాతి కాలపు ‘నరకం’ భావాలన్నిటినీ పాఠ్యంలోకి దిగుమతి చేయకుండా తీర్పు హెచ్చరికను యథాతథంగా ఉంచుతుంది.
- issue: ἀδελφός యొక్క లింగం మరియు పరిధి
  choice: సహోదరుడు
  alternative: సహోదరుడు లేదా సహోదరి / తోటి వ్యక్తి
  rationale: మూలంలోని పుంలింగ ఏకవచనాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; అయితే ఇది పురుష సహోదరులకు మాత్రమే పరిమితం కాదనే ప్రతినిధి ప్రయోగాన్ని పాదసూచికలో వివరిస్తుంది.
- issue: κρίσις యొక్క సూచన
  choice: తీర్పు
  alternative: న్యాయస్థానం
  rationale: పదం న్యాయవిచారణను లేదా న్యాయస్థాన తీర్పును సూచించగల అస్పష్టతను కాపాడుతుంది; నిర్దిష్ట స్థానిక కోర్టుగా మౌనంగా నిర్ణయించదు.
- issue: కోపానికి కారణం అనే పాఠాంతరం
  choice: ‘కారణం లేకుండా’ అనే మాటలను ప్రధాన పాఠ్యంలో చేర్చలేదు
  alternative: కారణం లేకుండా కోపపడే
  rationale: అత్యంత ప్రాచీనమైన మరియు బలమైన సాక్ష్యమున్న పాఠం ఆ పదాలను విడిచిపెడుతుంది; వేరే పాఠాంతరాన్ని పాదసూచికలో నమోదు చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. న్యాయపరమైన తీవ్రతను నిలుపుతూ అతిగా సంస్కృతీకృతమైన నిర్మాణాలను నివారించింది. ‘రాకా,’ ‘గెహెన్నా’ వంటి మూలసంస్కృతి పదాలను పాఠ్యంలో ఉంచి పాదసూచికల్లో వివరించింది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
