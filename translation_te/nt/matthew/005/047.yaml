id: MAT.5.47
reference: Matthew 5:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: te
  text: మరి మీరు మీ సోదరులకు[a] మాత్రమే అభివాదం చేస్తే, మీరు చేస్తున్న విశేషమేమిటి?[b] అన్యజనులు[c] కూడా అలాగే చేస్తారు కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సోదర సోదరీమణులకు’; గ్రీకులో ‘సోదరులు’ అని ఉంది, అయితే ఇక్కడ అది ఒకరి సొంత సమూహంలోని వారిని విస్తృతంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీరు ఎక్కువగా చేస్తున్నదేమిటి?’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అన్యమతస్థులు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: అభివాదం చేస్తే
  rationale: ఈ క్రియ పలకరించడం లేదా వందనం చేయడం అనే సామాజిక చర్యను సూచిస్తుంది. ‘అభివాదం చేయడం’ గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగు ప్రయోగం; ఆతిథ్యం అనే అదనపు భావాన్ని చేర్చదు.
- source_word: ἀδελφοὺς
  choice: సోదరులకు
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం. ‘సోదరులు’ ఆ రూపాన్ని నిలుపుతుంది; సందర్భంలో అది సొంత సమూహంలోని వారిని విస్తృతంగా సూచించే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: μόνον
  choice: మాత్రమే
  rationale: అభివాదాన్ని ఒక పరిమిత వర్గానికే కట్టిపడేసే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τί περισσὸν ποιεῖτε
  choice: మీరు చేస్తున్న విశేషమేమిటి?
  rationale: περισσόν సాధారణాన్ని మించినది, ప్రత్యేకమైనది అనే భావాన్ని ఇస్తుంది. ఈ తెలుగు ప్రశ్న మూలంలోని సంక్షిప్తమైన వాక్చాతుర్యాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐθνικοὶ
  choice: అన్యజనులు
  rationale: యూదేతరులను సూచించే ఈ పదానికి ‘అన్యజనులు’ ప్రత్యక్షమైన, సందర్భోచితమైన బైబిలు తెలుగు పదం. ‘అన్యమతస్థులు’ అని అనువదిస్తే మూలంలో తప్పనిసరిగా లేని మతపరమైన తీర్పు బలపడవచ్చు.
- source_word: τὸ αὐτὸ
  choice: అలాగే
  rationale: ‘అదే పని’ అనే భావాన్ని తెలుగు వాక్యంలో సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నైతిక బోధలో ἀδελφοὺς పదపు పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘సోదరులు’ అని ఉంచడం
  alternative: ‘సోదర సోదరీమణులు’ లేదా ‘మీ సొంతవారు’
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది సొంత సమూహంలోని వారిని విస్తృతంగా సూచించవచ్చనే నిజమైన సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
- issue: ἐθνικοὶ పదార్థం
  choice: అన్యజనులు
  alternative: అన్యమతస్థులు
  rationale: ఈ సందర్భంలో పదం ప్రధానంగా యూదేతరులను సూచిస్తుంది. ‘అన్యజనులు’ జాతి-సమాజ వ్యత్యాసాన్ని నిలుపుతుంది; ‘అన్యమతస్థులు’ మూలం కంటే బలమైన మతపరమైన వ్యాఖ్యానాన్ని చేర్చవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. చివరి οὐχὶ ప్రశ్న ఆశించే సమ్మతిని తెలుగులో సహజంగా తెలియజేయడానికి ‘చేస్తారు కదా?’ అని అనువదించాం.
