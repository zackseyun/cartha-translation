id: MAT.5.46
reference: Matthew 5:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: te
  text: ఎందుకంటే, మిమ్మల్ని ప్రేమించేవారినే మీరు ప్రేమిస్తే, మీకు ఏ ప్రతిఫలం[a] ఉంది? పన్ను వసూలు చేసేవారు కూడా అదే[b] చేస్తారు కదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు ఏ వేతనం ఉంది?” గ్రీకు పదానికి “వేతనం” లేదా “ప్రతిఫలం” అనే అర్థాలు ఉండవచ్చు; ఇక్కడ అది యేసు బోధ సందర్భంలోని ప్రతిఫలాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో “అదే” అనే పదాలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: ఎందుకంటే, ... ప్రేమిస్తే
  rationale: γάρ ముందటి బోధతో కారణ సంబంధాన్ని చూపుతుంది; ἐάν షరతును సూచిస్తుంది. ఈ రెండింటినీ సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀγαπήσητε / τοὺς ἀγαπῶντας ὑμᾶς
  choice: మిమ్మల్ని ప్రేమించేవారిని మీరు ప్రేమిస్తే
  rationale: ఒకే గ్రీకు మూలపదంతో వచ్చిన ‘ప్రేమ’ పునరుక్తిని నిలుపుతూ, సాధారణ షరతును సహజంగా తెలియజేస్తుంది.
- source_word: τίνα μισθὸν ἔχετε
  choice: మీకు ఏ ప్రతిఫలం ఉంటుంది?
  rationale: μισθός అనే పదానికి ‘వేతనం’ లేదా ‘ప్రతిఫలం’ అనే అర్థాలు ఉండవచ్చు. కొండమీది ప్రసంగంలోని నైతిక సందర్భంలో ‘ప్రతిఫలం’ సహజంగా ఉండి, ప్రతిఫలార్హత గురించి అదనపు సిద్ధాంతాన్ని చేర్చదు.
- source_word: οὐχὶ καὶ
  choice: కూడా ... కదా?
  rationale: οὐχί సానుకూల సమాధానాన్ని ఆశించే అలంకార ప్రశ్నను ఏర్పరుస్తుంది; καί యొక్క ఉద్ఘాటన భావాన్ని ‘కూడా’ తెలియజేస్తుంది.
- source_word: οἱ τελῶναι
  choice: పన్ను వసూలు చేసేవారు
  rationale: రోమా పాలనలో పన్నులు లేదా సుంకాలు వసూలు చేసిన సామాజిక వర్గాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలియజేసే సాధారణ పదబంధం.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: అలాగే చేస్తారు
  rationale: అదే క్రియను చేయడాన్ని సంక్షిప్తంగా, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: యేసు నైతిక బోధలో μισθός యొక్క భావం
  choice: ప్రతిఫలం
  alternative: వేతనం
  rationale: ఈ సందర్భంలో పరస్పర ప్రేమకే పరిమితమైన ప్రవర్తనకు దేవుని దగ్గర ప్రత్యేక ప్రతిఫలం లేదనే ప్రశ్నార్థక భావం ఉంది. ‘ప్రతిఫలం’ ఆ భావాన్ని నిలుపుతుంది; యాంత్రికమైన పుణ్యార్జన సిద్ధాంతాన్ని దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. అలంకార ప్రశ్న యొక్క సానుకూల నిరీక్షణను ‘చేస్తారు కదా?’ ద్వారా సహజంగా నిలిపాం. మూలపాఠంలోని ప్రేమ అనే పద పునరుక్తిని ఉద్దేశపూర్వకంగా కాపాడాం.
