revisions:
- from: సంతోషించండి, ఎంతో ఆనందించండి. ఎందుకంటే పరలోకాల్లో[a] మీ ప్రతిఫలం గొప్పది; మీకంటే ముందు ఉన్న ప్రవక్తలను కూడా వారు ఇలాగే హింసించారు.
  to: సంతోషించండి, ఎంతో ఆనందించండి; ఎందుకంటే పరలోకంలో[a] మీ ప్రతిఫలం గొప్పది. ఈ విధంగానే వారు మీకంటే ముందు ఉన్న ప్రవక్తలను హింసించారు.
  rationale: The revision removes the nonessential additive «కూడా», adopts idiomatic Telugu singular «పరలోకంలో» while retaining the Greek plural in a precise footnote, and keeps the causal/comparative force explicit in «ఈ విధంగానే». No theological interpretation is imposed.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:29:54Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two imperatives, the greatness of the reward, persecution, and the historical precedence of the prophets. However, «కూడా» (“also/too”) is not explicitly represented by the Greek and is unnecessary because οὕτως already supplies the comparison. The Greek plural ἐν τοῖς οὐρανοῖς need not be reproduced as a potentially misleading Telugu plural; idiomatic singular «పరలోకంలో» conveys the referent without making a doctrinal claim.
  naturalness: The Telugu is generally clear and modern. «పరలోకంలో మీ ప్రతిఫలం గొప్పది» is more idiomatic than «పరలోకాల్లో». Removing «కూడా» makes the final clause more direct and closer to the source.
  terminology: «ప్రతిఫలం» is appropriate for μισθός in this context. «సంతోషించండి, ఎంతో ఆనందించండి» adequately retains the paired and intensified calls to joy. «ప్రవక్తలు» and «హింసించారు» are standard, suitable terms.
  issues:
  - severity: low
    issue: Unwarranted additive «కూడా» in the final clause
    rationale: The Greek says “for thus/in this way they persecuted the prophets before you.” The comparative relationship is already expressed by «ఇలాగే»; «కూడా» adds an explicit “also/too” not required by the text.
  - severity: low
    issue: «పరలోకాల్లో» is less natural Telugu and may overstate the lexical plural
    rationale: Matthew’s plural οὐρανοῖς commonly reflects Semitic-influenced idiom. Natural Telugu singular «పరలోకంలో» communicates the intended heavenly sphere; a footnote can preserve the formal plural observation without suggesting multiple distinct heavens.
  - severity: low
    issue: Footnote’s “అక్షరార్థంగా ‘ఆకాశాల్లో’” is imprecise in this context
    rationale: Although οὐρανοί can denote skies/heavens lexically, the contextual referent is the heavenly sphere. The note should identify the Greek plural directly and give the formal alternative «పరలోకాల్లో».
  revised_text: సంతోషించండి, ఎంతో ఆనందించండి; ఎందుకంటే పరలోకంలో[a] మీ ప్రతిఫలం గొప్పది. ఈ విధంగానే వారు మీకంటే ముందు ఉన్న ప్రవక్తలను హింసించారు.
