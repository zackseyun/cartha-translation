id: MAT.5.12
reference: Matthew 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: te
  text: సంతోషించండి, ఎంతో ఆనందించండి; ఎందుకంటే పరలోకంలో[a] మీ ప్రతిఫలం గొప్పది. ఈ విధంగానే వారు మీకంటే ముందు ఉన్న ప్రవక్తలను హింసించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో ఇక్కడ బహువచన రూపం ఉంది: ‘పరలోకాల్లో.’ మత్తయి తరచుగా ఈ బహువచనాన్ని వాడతాడు; తెలుగులో ‘పరలోకంలో’ అనేది సహజమైన ప్రయోగం.'
    reason: మూల గ్రీకులోని బహువచన రూపాన్ని తెలియజేస్తూనే, సందర్భానుకూలమైన సహజ తెలుగు ఏకవచనాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: χαίρετε
  choice: సంతోషించండి
  rationale: వర్తమానకాల బహువచన ఆజ్ఞను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀγαλλιᾶσθε
  choice: ఎంతో ఆనందించండి
  rationale: ముందున్న χαίρετε కంటే ఉప్పొంగే ఆనందాన్ని సూచించే తీవ్రతను సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: μισθὸς
  choice: ప్రతిఫలం
  rationale: పదానికి ‘జీతం’ అనే అర్థం ఉండగలిగినా, హింసను సహించినవారికి దేవుడు ఇచ్చే ఫలితం అనే సందర్భంలో ‘ప్రతిఫలం’ సహజంగా సరిపోతుంది; వాణిజ్య లావాదేవీ భావాన్ని రుద్దదు.
- source_word: πολὺς
  choice: గొప్పది
  rationale: ప్రతిఫలం యొక్క పరిమాణం లేదా ప్రాముఖ్యతను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: పరలోకాల్లో
  rationale: గ్రీకు బహువచన రూపాన్ని నిలుపుతూ, దేవుని పరలోక పరిధిని ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: οὕτως
  choice: ఇలాగే
  rationale: శిష్యులు ఎదుర్కొనే హింసను పూర్వ ప్రవక్తలు ఎదుర్కొన్న విధానంతో పోల్చే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐδίωξαν
  choice: హింసించారు
  rationale: ఈ సందర్భంలో διώκω శత్రుత్వపూర్వకమైన పీడనను సూచిస్తుంది; కేవలం వెంబడించడం కాదు.
- source_word: τοὺς προφήτας τοὺς πρὸ ὑμῶν
  choice: మీకంటే ముందు ఉన్న ప్రవక్తలను
  rationale: శ్రోతలకు చారిత్రకంగా ముందున్న ప్రవక్తలను సూచించే గ్రీకు విశేషణ నిర్మాణాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ἐν τοῖς οὐρανοῖςలోని బహువచనం
  choice: పరలోకాల్లో
  alternative: పరలోకంలో
  rationale: మత్తయి వాడిన బహువచనాన్ని పాఠ్యంలో కనిపించేలా ఉంచడం మూలభాషకు సమీపంగా ఉంటుంది. ఇది వేర్వేరు పరలోకాలపై సిద్ధాంత నిర్ణయం కాదు; సెమిటిక్ ప్రభావం గల గ్రీకు వాడుకను ప్రతిబింబించే భాషాపరమైన ఎంపిక.
- issue: ప్రతిఫలం యొక్క స్వరూపం
  choice: ప్రతిఫలం
  alternative: జీతం
  rationale: μισθόςకు రెండు భావాలూ సాధ్యమైనప్పటికీ, ఈ సందర్భంలో దేవుని ప్రతిఫలాన్ని వ్యాపారపరమైన సంపాదనగా నిర్ణయించకుండా ఉండేందుకు ‘ప్రతిఫలం’ ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన వచనశైలి. రెండు ఆనంద ఆజ్ఞల మధ్య తీవ్రత వ్యత్యాసం నిలుపబడింది. చివరి వాక్యంలో ‘కూడా’ పోలికను సహజంగా చూపుతుంది; గ్రీకు γάρ ఇచ్చే వివరణాత్మక సంబంధం సందర్భంలో స్పష్టంగా ఉంది.
