revisions:
- from: కాని నేను మీతో చెప్పేది ఏమిటంటే, అసలు ఒట్టు పెట్టుకోవద్దు; ఆకాశం తోడని ఒట్టు పెట్టుకోవద్దు, ఎందుకంటే అది దేవుని సింహాసనం;
  to: 'కాని నేను మీతో చెబుతున్నాను: అసలు ఎలాంటి ప్రమాణమూ చేయవద్దు; ఆకాశం మీద కూడా ప్రమాణం చేయవద్దు, ఎందుకంటే అది దేవుని సింహాసనం;'
  rationale: 'The revision more closely follows the Greek structure: Jesus’ emphatic contrasting statement, the unqualified prohibition (μὴ ὀμόσαι ὅλως), then the first specific prohibition (μήτε ἐν τῷ οὐρανῷ), followed by its reason. It uses natural modern standard Telugu and does not introduce doctrinal qualifications.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:29:54Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the overall prohibition and reason, but its repeated imperative and the idiom ‘ఆకాశం తోడని ఒట్టు పెట్టుకోవద్దు’ are less direct equivalents of μήτε ἐν τῷ οὐρανῷ (‘nor by heaven’).
  naturalness: ‘ఒట్టు పెట్టుకోవద్దు’ is understandable, but ‘ప్రమాణం చేయవద్దు’ is more natural and suitably formal in this context. ‘ఆకాశం మీద ప్రమాణం చేయవద్దు’ is a clear modern Telugu rendering of swearing by heaven.
  terminology: ‘దేవుని సింహాసనం’ accurately renders θρόνος ... τοῦ θεοῦ. ‘ప్రమాణం’ appropriately renders ὀμόσαι without adding an interpretive limitation.
  issues:
  - severity: medium
    issue: The rendering of μήτε ἐν τῷ οὐρανῷ is imprecise and stylistically awkward.
    rationale: ‘ఆకాశం తోడని’ can communicate calling heaven as witness, but ‘ఆకాశం మీద’ more directly represents the conventional ‘swear by heaven’ construction and preserves the explicit correlative ‘nor.’
  - severity: low
    issue: The phrase ‘ఒట్టు పెట్టుకోవద్దు’ is repeated where the Greek has one governing infinitive followed by a ‘nor by heaven’ qualification.
    rationale: Using ‘ప్రమాణం చేయవద్దు; ఆకాశం మీద కూడా చేయవద్దు’ retains the intended sequence more naturally in Telugu.
  revised_text: 'కాని నేను మీతో చెబుతున్నాను: అసలు ఎలాంటి ప్రమాణమూ చేయవద్దు; ఆకాశం మీద కూడా ప్రమాణం చేయవద్దు, ఎందుకంటే అది దేవుని సింహాసనం;'
  revised_footnotes: []
  revision_rationale: 'The revision more closely follows the Greek structure: Jesus’ emphatic contrasting statement, the unqualified prohibition (μὴ ὀμόσαι ὅλως), then the first specific prohibition (μήτε ἐν τῷ οὐρανῷ), followed by its reason. It uses natural modern standard Telugu and does not introduce doctrinal qualifications.'
