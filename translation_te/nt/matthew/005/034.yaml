id: MAT.5.34
reference: Matthew 5:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: te
  text: 'కాని నేను మీతో చెబుతున్నాను: అసలు ఎలాంటి ప్రమాణమూ చేయవద్దు; ఆకాశం మీద కూడా ప్రమాణం చేయవద్దు, ఎందుకంటే అది దేవుని సింహాసనం;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: కాని నేను మీతో చెప్పేది ఏమిటంటే
  rationale: ἐγώపై ఉన్న ఉద్ఘాటనను, δέ సూచించే వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μὴ ὀμόσαι ὅλως
  choice: అసలు ఒట్టు పెట్టుకోవద్దు
  rationale: ὀμόσαι అంటే ప్రమాణం/ఒట్టు చేయడం; ὅλως ఇచ్చే సంపూర్ణ నిషేధ బలాన్ని ‘అసలు’ స్పష్టంగా అందిస్తుంది.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: ఆకాశం తోడని ఒట్టు పెట్టుకోవద్దు
  rationale: ἐν ఇక్కడ ఒట్టు దేనిని ఆధారంగా లేదా సాక్షిగా చేసుకుంటారో సూచిస్తుంది; తెలుగులో ‘ఆకాశం తోడని’ సహజమైన ప్రమాణ సూత్రం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: తర్వాతి వాక్యం ఆకాశం తోడని ఒట్టు పెట్టకూడదనే ఆజ్ఞకు కారణాన్ని ఇస్తుంది.
- source_word: θρόνος ἐστὶν τοῦ θεοῦ
  choice: అది దేవుని సింహాసనం
  rationale: గ్రీకు సంబంధ నిర్మాణాన్ని స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
theological_decisions:
- issue: μὴ ὀμόσαι ὅλως యొక్క పరిధి
  choice: ‘అసలు ఒట్టు పెట్టుకోవద్దు’ అని సంపూర్ణ నిషేధంలా అనువదించడం
  alternative: ‘తప్పుడు ఒట్టు పెట్టుకోవద్దు’ లేదా ‘సాధారణ సంభాషణలో ఒట్టు పెట్టుకోవద్దు’
  rationale: ఈ వాక్యంలోని గ్రీకు పదాలు ఎలాంటి పరిమితినీ స్పష్టంగా ఇవ్వవు; వ్యాఖ్యానాత్మక మినహాయింపును అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి సులభంగా అర్థమయ్యే శైలి. ఈ ఒక్క వచనం తరువాతి సమాంతర నిషేధాలతో కొనసాగుతుంది కాబట్టి సెమీకోలన్ నిలుపబడింది.
