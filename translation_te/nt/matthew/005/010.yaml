id: MAT.5.10
reference: Matthew 5:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: te
  text: నీతి కారణంగా[a] హింసించబడినవారు ధన్యులు; పరలోక రాజ్యం వారిదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయం కారణంగా.” గ్రీకు పదం నైతిక నీతి, న్యాయం, దేవునితో నిబంధనకు అనుగుణమైన జీవితం అనే భావాలను మోయగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: ధన్యులు
  rationale: ఆత్మానుభూతిని మాత్రమే సూచించే ‘సంతోషులు’ కంటే, దేవుని అనుగ్రహపూర్వక ప్రకటనను తెలియజేసే సంప్రదాయబద్ధమైన, సహజమైన తెలుగు పదం.
- source_word: οἱ δεδιωγμένοι
  choice: హింసించబడినవారు
  rationale: నిశ్చయార్థక ఉపపదంతో కూడిన పరిపూర్ణ కర్మణి కృదంతం ఒక వర్గాన్ని సూచిస్తుంది; ఈ రూపం వారు అనుభవించిన హింస ఫలితంగా ఉన్న స్థితిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἕνεκεν
  choice: బట్టి
  rationale: కారణాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘నిమిత్తం’ కూడా సాధ్యమే కాని మరింత గ్రాంథికంగా ఉంటుంది.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: దేవుని చిత్తానికి అనుగుణమైన సరైన స్థితి, ప్రవర్తన అనే విస్తృత భావాన్ని మోసే సహజమైన తెలుగు సమానం; ‘న్యాయం’ అనే భావఛాయను పాదసూచికలో ఉంచాం.
- source_word: ὅτι
  choice: ;
  rationale: గ్రీకు పదం ధన్యవచనానికి కారణాన్ని పరిచయం చేస్తుంది. తెలుగులో రెండవ వాక్యభాగం వివరణాత్మక కారణంగా సహజంగా చదవబడేలా అర్ధవిరామం ఉపయోగించబడింది.
- source_word: αὐτῶν
  choice: వారిదే
  rationale: స్వామ్యాన్ని సహజంగా వ్యక్తపరుస్తూ, గ్రీకు వాక్యంలో ఉన్న ముందుస్థాన ప్రాధాన్యాన్ని ‘-ఏ’ నిశ్చయార్థకం ద్వారా నిలుపుతుంది.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి సువార్తకు ప్రత్యేకమైన ఈ పదబంధంలో దేవుని పరలోక పాలన/రాజ్యాన్ని ఆధునిక తెలుగు పాఠకులకు సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: δικαιοσύνη పదం యొక్క అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ సందర్భంలో దేవుని చిత్తానికి అనుగుణంగా జీవించడం వల్ల కలిగే హింస ప్రధాన భావం. అయితే గ్రీకు పదం న్యాయం అనే సామాజిక, నిబంధనాత్మక భావఛాయను కూడా మోయగలదు కాబట్టి దాన్ని పాదసూచికలో సంరక్షించాం.
- issue: పరలోక రాజ్యం యొక్క స్వామ్యం
  choice: పరలోక రాజ్యం వారిదే
  alternative: పరలోక రాజ్యం వారికి చెందుతుంది
  rationale: ἐστιν వర్తమాన కాలాన్ని, αὐτῶν కు ఉన్న ప్రాధాన్యాన్ని ‘వారిదే’ స్పష్టంగా నిలుపుతుంది; ఇది కేవలం భవిష్యత్తు వాగ్దానంగా మారకుండా చూస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా ఉండే ధన్యవచన శైలి. ‘ధన్యులు’ మరియు ‘పరలోక రాజ్యం’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచి, మిగతా నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా తీర్చిదిద్దాం.
