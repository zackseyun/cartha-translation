id: MAT.5.28
reference: Matthew 5:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: te
  text: కానీ నేను మీతో చెప్పేది ఏమిటంటే, ఆమెను కోరుకోవాలనే ఉద్దేశంతో ఒక స్త్రీని చూసే ప్రతి ఒక్కరూ[a] అప్పటికే తన హృదయంలో ఆమెతో వ్యభిచారం చేశాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు γυνή అనే పదానికి సందర్భానుసారం ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థం రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “ఆమెను కామంతో ఆశించడానికి ఒక స్త్రీని చూసే ప్రతి ఒక్కరూ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: కానీ నేను మీతో చెప్పేది ఏమిటంటే
  rationale: δέ తెలిపే వ్యత్యాసాన్ని ‘కానీ’తో, ἐγώలోని ప్రాధాన్యాన్ని స్పష్టమైన ‘నేను’తో నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన ప్రత్యక్ష ప్రకటనగా అనువదించబడింది.
- source_word: πᾶς ὁ βλέπων
  choice: చూసే ప్రతి ఒక్కరూ
  rationale: ఈ నిర్మాణంలోని సార్వత్రిక, సాధారణ వర్తింపును లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా వ్యక్తపరుస్తుంది.
- source_word: γυναῖκα
  choice: ఒక స్త్రీని
  rationale: γυνή సందర్భానుసారం ‘స్త్రీ’ లేదా ‘భార్య’ అని అర్థమవుతుంది. ఇక్కడ గ్రీకు పాఠం వైవాహిక స్థితిని స్పష్టంగా పేర్కొననందున విస్తృతమైన ‘స్త్రీ’ ప్రధాన పాఠంలో ఉంచబడింది.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: ఆమెను కోరుకోవాలనే ఉద్దేశంతో
  rationale: πρὸς + articular infinitive తెలిపే ఉద్దేశపూర్వక దిశను ‘ఉద్దేశంతో’ స్పష్టంగా నిలుపుతుంది. ‘కోరుకోవడం’ ἐπιθυμέω యొక్క విస్తృత అర్థాన్ని కాపాడుతుంది; వ్యభిచార సందర్భం ఇది అక్రమ లైంగిక కోరిక అని తెలియజేస్తుంది.
- source_word: ἤδη
  choice: అప్పటికే
  rationale: బాహ్య కార్యం జరగకముందే అంతరంగంలో నైతిక ఉల్లంఘన సంభవించిందనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐμοίχευσεν αὐτὴν
  choice: ఆమెతో వ్యభిచారం చేశాడు
  rationale: μοιχεύω యొక్క అర్థాన్ని తెలుగులో స్థిరమైన, సహజమైన నైతిక పదబంధంతో తెలియజేస్తుంది; αὐτήνతో ఉన్న సంబంధాన్ని ‘ఆమెతో’ వ్యక్తపరుస్తుంది.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: తన హృదయంలో
  rationale: καρδία సూచించే ఆలోచన, సంకల్పం, కోరికల అంతరంగ కేంద్రాన్ని బైబిలు వాడుకకు అనుగుణంగా ‘హృదయం’తో నిలుపుతుంది.
theological_decisions:
- issue: γυνήను ‘స్త్రీ’గా అనువదించాలా, ‘భార్య’గా అనువదించాలా
  choice: స్త్రీ
  alternative: భార్య
  rationale: గ్రీకు పదానికి రెండు అర్థాలూ సాధ్యమైనప్పటికీ, ఈ సాధారణ నైతిక వాక్యంలో వైవాహిక స్థితి వ్యాకరణపరంగా నిర్దిష్టం కాలేదు. ‘స్త్రీ’ మూలపాఠంలోని విస్తృతిని కాపాడుతుంది; ‘వ్యభిచారం’ అనే సందర్భం వాక్యంలోని లైంగిక-నైతిక తీవ్రతను నిలుపుతుంది.
- issue: ἐπιθυμέωను విస్తృతమైన ‘కోరుకోవడం’తోనా, మరింత నిర్దిష్టమైన ‘కామంతో ఆశించడం’తోనా అనువదించాలి
  choice: కోరుకోవడం
  alternative: కామంతో ఆశించడం / మోహపడడం
  rationale: క్రియ స్వతహాగా లైంగిక కామానికే పరిమితం కాదు; అయితే ఈ సందర్భంలో అది అక్రమ లైంగిక కోరికను సూచిస్తుంది. ప్రధాన పాఠం పదార్థ విస్తృతిని నిలుపగా, సందర్భం నైతిక స్వభావాన్ని స్పష్టం చేస్తుంది; నిర్దిష్ట ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- issue: πρὸς τὸ + infinitiveలోని ఉద్దేశ భావాన్ని స్పష్టంగా చూపాలా
  choice: ‘ఉద్దేశంతో’ అని స్పష్టంగా చూపడం
  alternative: ‘కోరుకుంటూ చూసే’ అని ఫలితమో సమకాలీన స్థితియోలా అనువదించడం
  rationale: ఈ నిర్మాణం కేవలం గమనించిన దృష్టిని కాక, కోరికను లక్ష్యంగా చేసుకున్న ఉద్దేశపూర్వక చూపును సూచిస్తుంది. అందువల్ల మూలంలోని నైతిక కేంద్రీకరణను అతిశయించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి ఉపయోగించబడింది. ‘కోరుకోవాలనే ఉద్దేశంతో’ కొద్దిగా ఆచారబద్ధంగా ఉన్నా, మూలంలోని ఉద్దేశార్థాన్ని స్పష్టంగా కాపాడుతుంది. ‘హృదయంలో’ అనే బైబిలు రూపకం యథాతథంగా నిలుపబడింది.
