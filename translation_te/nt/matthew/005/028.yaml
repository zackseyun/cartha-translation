revisions:
- from: కానీ నేను మీతో చెప్పేది ఏమిటంటే, ఒక స్త్రీని ఆమెను కోరుకోవాలనే ఉద్దేశంతో చూసే ప్రతి ఒక్కరూ[a][b] అప్పటికే తన హృదయంలో ఆమెతో వ్యభిచారం చేశాడు.
  to: కానీ నేను మీతో చెప్పేది ఏమిటంటే, ఆమెను కోరుకోవాలనే ఉద్దేశంతో ఒక స్త్రీని చూసే ప్రతి ఒక్కరూ[a] అప్పటికే తన హృదయంలో ఆమెతో వ్యభిచారం చేశాడు.[b]
  rationale: 'ప్రధాన పాఠంలోని అర్థాన్ని మార్చకుండా పదక్రమాన్ని కొద్దిగా మెరుగుపరిచాం: ‘ఆమెను కోరుకోవాలనే ఉద్దేశంతో’ అనే ఉద్దేశ పదబంధం ఇప్పుడు ‘ఒక స్త్రీని చూసే’ క్రియతో మరింత సన్నిహితంగా ఉంది. పాదసూచిక గుర్తులను వాటి సంబంధిత అంశాలకు అనుగుణంగా ఉంచి, bలోని ప్రత్యామ్నాయాన్ని సహజమైన ఆధునిక తెలుగులో సవరించాం.'
