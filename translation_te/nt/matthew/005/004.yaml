  verdict: revise
  source_fidelity: The draft accurately preserves the beatitude form, the causal relation introduced by ὅτι, and the future passive sense of παρακληθήσονται. However, οἱ πενθοῦντες more specifically denotes people who mourn or lament; the main-text term దుఃఖించేవారు can extend to general sadness and is somewhat broader than the Greek.
  naturalness: The sentence is clear, idiomatic modern standard Telugu, and suitably concise and dignified. శోకించేవారు is equally natural in this elevated beatitude register and more precise here.
  terminology: ధన్యులు appropriately retains the established beatitude formula. ఓదార్చబడతారు naturally conveys the future passive without supplying an agent. Replacing the main-text term with శోకించేవారు better represents πενθοῦντες, while retaining దుఃఖించేవారు as the lexical alternative preserves the intended breadth.
