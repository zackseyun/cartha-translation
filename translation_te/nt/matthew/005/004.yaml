id: MAT.5.4
reference: Matthew 5:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: te
  text: శోకించేవారు[a] ధన్యులు; ఎందుకంటే వారు ఓదార్చబడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దుఃఖించేవారు.’ గ్రీకు పదం విస్తృతార్థకమైనది; శోకానికి కారణం ఏమిటో అది పేర్కొనదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: ధన్యులు
  rationale: ఈ ధన్యవచన సూత్రంలోని దేవుని అనుగ్రహం మరియు ఆమోదాన్ని సూచించే భావాన్ని నిలుపుతుంది; కేవలం భావోద్వేగ స్థితిని సూచించే ‘సంతోషులు’ కంటే సందర్భానికి తగినది.
- source_word: οἱ πενθοῦντες
  choice: దుఃఖించేవారు
  rationale: నిర్దిష్ట కారణాన్ని చేర్చకుండా, నష్టం, బాధ, పాపం లేదా ఇతర కారణాల వల్ల కలిగే శోకాన్ని విస్తృతంగా సూచిస్తుంది; గ్రీకు వర్తమాన కృదంతంలోని కొనసాగుతున్న స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఈ ధన్యతకు కారణాన్ని పరిచయం చేసే గ్రీకు సంధానపదపు కారణార్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὐτοὶ
  choice: వారు
  rationale: గ్రీకులో స్వల్ప ఉద్ఘాటన ఉన్నప్పటికీ, తెలుగులో ‘వారే’ అని పెంచడం అవసరం లేదు; వాక్య నిర్మాణమే తగిన ఉద్ఘాటనను ఇస్తుంది.
- source_word: παρακληθήσονται
  choice: ఓదార్చబడతారు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, ఆదరణ లేదా ఓదార్పు పొందడాన్ని సహజంగా వ్యక్తం చేస్తుంది; ఓదార్చేవారు ఎవరో మూలపాఠం ప్రత్యక్షంగా చెప్పకపోవడాన్ని కూడా కాపాడుతుంది.
theological_decisions:
- issue: ఈ ధన్యవచనంలోని దుఃఖం యొక్క పరిధి
  choice: దుఃఖానికి కారణాన్ని నిర్దిష్టం చేయకుండా ‘దుఃఖించేవారు’ అని విస్తృతంగా అనువదించడం.
  alternative: పాపం గురించి దుఃఖించేవారు; సాధారణంగా శోకించేవారు; ఇశ్రాయేలు స్థితి గురించి విలపించేవారు.
  rationale: గ్రీకు మూలపాఠం దుఃఖానికి కారణాన్ని పేర్కొనదు. విస్తృతమైన అనువాదం వ్యక్తిగత నష్టం, పాపం, అణచివేత లేదా రాబోయే దేవుని కార్యం కోసం ఎదురుచూపు వంటి వివిధ సందర్భాలను అనుమతిస్తూ, ఒక నిర్దిష్ట వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గంభీరమైన ధన్యవచన శైలి. ‘ధన్యులు’ అనే స్థిరమైన బైబిలు పదాన్ని ఉంచి, మిగిలిన వాక్యాన్ని సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా రూపొందించాం.
