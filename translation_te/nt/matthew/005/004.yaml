    issue: Main-text wording for οἱ πενθοῦντες is less specific than the Greek.
    rationale: దుఃఖించేవారు may refer broadly to being sad or distressed, whereas πενθέω conventionally refers to mourning, grieving, or lamenting. శోకించేవారు preserves the source's mourning sense without specifying its cause.
  revised_text: శోకించేవారు[a] ధన్యులు; ఎందుకంటే వారు ఓదార్చబడతారు.
