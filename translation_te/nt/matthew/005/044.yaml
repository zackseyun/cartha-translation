id: MAT.5.44
reference: Matthew 5:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: te
  text: 'కాని నేను మీతో చెబుతున్నాను: మీ శత్రువులను ప్రేమించండి; మిమ్మల్ని హింసించేవారి కోసం ప్రార్థించండి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిమ్మల్ని హింసించేవారి తరఫున ప్రార్థించండి.”
    reason: ὑπέρ అనే పదం ‘కోసం’ అనే భావంతోపాటు ‘తరఫున’ లేదా ‘పక్షంగా’ అనే ప్రాతినిధ్య భావాన్ని కూడా వ్యక్తం చేయగలదు.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: కాని నేను మీతో చెబుతున్నాను
  rationale: δέ సూచించే వ్యత్యాసాన్ని ‘కాని’ నిలుపుతుంది; ἐγώలోని ఉద్ఘాటనను ‘నేను’ స్పష్టంగా వ్యక్తం చేస్తుంది. ‘మీతో చెబుతున్నాను’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండి λέγω యొక్క వర్తమాన వాక్యబలాన్ని కాపాడుతుంది.
- source_word: ἀγαπᾶτε
  choice: ప్రేమించండి
  rationale: ఆజ్ఞార్థక భావాన్ని నేరుగా, గౌరవబహువచన రూపంలో తెలియజేస్తుంది. వర్తమాన ఆజ్ఞలో ఉండగల నిరంతరతను ప్రత్యేక పదాలతో అతిగా వివరించకుండా సహజంగా ఉంచుతుంది.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: మీ శత్రువులను
  rationale: సంబంధపరమైన వైరాన్ని తగ్గించకుండా గ్రీకు పదబంధాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: προσεύχεσθε
  choice: ప్రార్థించండి
  rationale: ప్రార్థించమనే ఆజ్ఞను ఆధునిక తెలుగులో ప్రామాణికంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ὑπὲρ
  choice: కోసం
  rationale: ఈ సందర్భంలో ఇతరుల మేలు దృష్టిలో ఉంచుకొని వారి నిమిత్తం ప్రార్థించడాన్ని ‘కోసం’ సహజంగా తెలియజేస్తుంది. ‘తరఫున’ అనే మరింత స్పష్టమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: మిమ్మల్ని హింసించేవారి
  rationale: నామవాచకంగా వాడిన వర్తమాన కృదంతంలోని కొనసాగుతున్న శత్రుత్వ చర్యను క్రియాత్మక రూపంలో నిలుపుతుంది; కేవలం ‘హింసకులు’ అని సంక్షిప్తం చేయదు.
theological_decisions:
- issue: శత్రువుల పట్ల ఆజ్ఞ యొక్క పరిధి
  choice: శత్రువులను ప్రేమించమని, హింసించేవారి కోసం ప్రార్థించమని ఉన్న రెండు ఆజ్ఞలను అదనపు వివరణ లేకుండా నేరుగా అనువదించాం.
  alternative: ‘ప్రేమ’ను కేవలం మేలుచేసే చర్యగా పరిమితం చేయడం లేదా ప్రార్థనను ఆశీర్వాదం, మారుమనస్సు వంటి నిర్దిష్ట ఫలితానికి విస్తరించడం.
  rationale: గ్రీకు వాక్యం ఆజ్ఞల నైతిక బలాన్ని స్పష్టంగా తెలియజేస్తుంది గాని వాటి ఆచరణాత్మక పరిధినంతటినీ ఈ వచనంలో నిర్వచించదు. అందువల్ల అనువాదం ఆ వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే యేసు బోధకు తగిన గంభీరతతో రూపొందించబడింది. గౌరవబహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి.
