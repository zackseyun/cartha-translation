id: MAT.5.11
reference: Matthew 5:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: te
  text: నా కారణంగా వారు మిమ్మల్ని దూషించి, హింసించి, మీకు వ్యతిరేకంగా అన్ని రకాల చెడు మాటలను అబద్ధంగా చెప్పినప్పుడు మీరు ధన్యులు[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దూషించి’కి ప్రత్యామ్నాయంగా ‘నిందించి’ అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీకు వ్యతిరేకంగా అన్ని రకాల చెడు మాటలు చెప్పినప్పుడు.”
    reason: lexical_alternative
  - marker: c
    text: ‘నా కారణంగా’కి ప్రత్యామ్నాయంగా ‘నా నిమిత్తం’ అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: మీరు ధన్యులు
  rationale: కొండమీది ప్రసంగంలోని ధన్యత ప్రకటన సూత్రాన్ని, దాని ఆధ్యాత్మిక గంభీరతను నిలుపుతుంది; ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది.
- source_word: ὅταν
  choice: చెప్పినప్పుడు
  rationale: తరువాతి క్రియలన్నిటినీ ఆవరించే సాధారణ భవిష్యత్ సందర్భాన్ని తెలుగులో సహజమైన ‘-నప్పుడు’ నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: ὀνειδίσωσιν
  choice: మిమ్మల్ని దూషించి
  rationale: నిందాపూర్వకమైన మాటలతో అవమానించడాన్ని స్పష్టంగా తెలియజేస్తుంది; కేవలం విమర్శించడం అనే బలహీన అర్థానికి పరిమితం చేయదు.
- source_word: διώξωσιν
  choice: హింసించి
  rationale: యేసుతో సంబంధం కారణంగా ఎదురయ్యే శత్రుత్వపూర్వక పీడనను సూచిస్తుంది; దానిని కేవలం శారీరక దాడికే పరిమితం చేయదు.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: మీకు వ్యతిరేకంగా అన్నిరకాల చెడ్డ మాటలను ... చెప్పినప్పుడు
  rationale: πᾶν πονηρόν యొక్క విస్తృత, సమగ్ర భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; κατά యొక్క ప్రతికూల దిశను ‘మీకు వ్యతిరేకంగా’ నిలుపుతుంది.
- source_word: ψευδόμενοι
  choice: అబద్ధంగా
  rationale: చెడ్డ మాటలు వాస్తవం కావని, అవి అసత్య ఆరోపణలని క్రియావిశేషణ రూపంలో సహజంగా స్పష్టం చేస్తుంది.
- source_word: ἕνεκεν ἐμοῦ
  choice: నా కారణంగా
  rationale: వ్యతిరేకతకు కారణం యేసేనని నేరుగా తెలియజేస్తుంది; ఆయనపట్ల అనుబంధం కారణమనే భావాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: వ్యతిరేకత స్వభావం
  choice: యేసు కారణంగా ఎదురయ్యే దూషణ, విస్తృతమైన హింస, అసత్యమైన చెడు ఆరోపణలు అనే మూడు అంశాలను వేర్వేరుగా నిలుపడం.
  alternative: ‘హింస’ను కేవలం శారీరక దాడిగా లేదా మొత్తం వాక్యాన్ని కేవలం అపవాదుగా పరిమితం చేయడం.
  rationale: మూలంలోని సమన్వయ క్రియలు మాటల దూషణ, పీడన, అసత్య ఆరోపణలను కలిపి విస్తృతమైన శత్రుత్వాన్ని సూచిస్తాయి; వాక్యం పేర్కొనని నిర్దిష్ట రూపానికి అనువాదం దానిని కుదించదు.
- issue: ధన్యతకు సందర్భం
  choice: ‘మీరు ధన్యులు’ అనే ప్రకటనను బాధ స్వయంగా మేలైనదన్న భావంగా కాకుండా, యేసు కారణంగా ఆ బాధను ఎదుర్కొనే సందర్భానికి అనుసంధానించడం.
  alternative: ఏ కారణంతోనైనా ఎదురయ్యే అవమానం లేదా బాధ అంతటినీ ఈ ధన్యతలో చేర్చడం.
  rationale: ἕνεκεν ἐμοῦ ధన్యత ప్రకటనకు నిర్ణాయక కారణాన్ని ఇస్తుంది; అనువాదం ఆ పరిమితిని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళమైన వాక్య నిర్మాణం, అయితే ధన్యత ప్రకటనకు తగిన గౌరవప్రదమైన శైలి. ‘దూషించి,’ ‘హింసించి,’ ‘అబద్ధంగా’ వంటి పదాలు మూలంలోని మూడు విధాల వ్యతిరేకతను స్పష్టంగా వేరు చేస్తాయి.
