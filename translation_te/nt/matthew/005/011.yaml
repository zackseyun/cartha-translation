  source_fidelity: 'The three coordinated forms of hostility are retained: verbal insult, persecution, and false evil speech. The causal phrase is moved forward so that its scope over all three actions is clear in Telugu. “హింసించి” adequately conveys persecution in this context without specifying a particular form of mistreatment.'
