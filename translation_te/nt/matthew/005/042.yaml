id: MAT.5.42
reference: Matthew 5:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: te
  text: నిన్ను అడిగేవానికి ఇవ్వు; నీ దగ్గర అప్పు తీసుకోవాలనుకునేవానికి ముఖం తిప్పకు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτοῦντί
  choice: అడిగేవానికి
  rationale: వర్తమానకాల కృదంతం నిర్దిష్ట వ్యక్తిని కాక, సాధారణంగా అడిగే వ్యక్తిని సూచిస్తుంది. ‘అడిగేవానికి’ ఈ సాధారణ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δός
  choice: ఇవ్వు
  rationale: δίδωμι క్రియ యొక్క ఏకవచన ఆజ్ఞారూపం. అదనపు విధిబలాన్ని చేర్చకుండా నేరుగా ఉన్న ఆజ్ఞను ‘ఇవ్వు’ తెలియజేస్తుంది.
- source_word: θέλοντα
  choice: తీసుకోవాలనుకునేవానికి
  rationale: θέλω యొక్క ‘కోరడం/అనుకోవడం’ అనే భావాన్ని, δανίσασθαιతో కలిపి తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀπὸ σοῦ
  choice: నీ దగ్గర
  rationale: అప్పు తీసుకునే సందర్భంలో మూలాన్ని సూచించే ἀπόను ‘నీ దగ్గర’ అని చెప్పడం ఆధునిక తెలుగులో ‘నీ నుండి’ కంటే సహజంగా ఉంటుంది.
- source_word: δανίσασθαι
  choice: అప్పు తీసుకోవడానికి
  rationale: మధ్యమ వాచక అనంతక్రియ ఇక్కడ అప్పుగా తీసుకోవడాన్ని సూచిస్తుంది. మూలంలో వస్తువు లేదా డబ్బు ప్రత్యేకంగా చెప్పబడలేదు కాబట్టి ‘డబ్బు’ను చేర్చలేదు.
- source_word: μὴ ἀποστραφῇς
  choice: ముఖం తిప్పకు
  rationale: ἀποστρέφωలోని ‘వెనక్కి/దూరంగా తిరగడం’ అనే రూపక చిత్రాన్ని సహజమైన తెలుగు నుడికారంతో నిలుపుతూ, నిషేధాత్మక ఆజ్ఞను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు ఇచ్చిన నైతిక ఆజ్ఞ యొక్క పరిధి, బలం
  choice: మూలంలోని సాధారణతను పరిమితం చేయకుండా రెండు నేర ఆజ్ఞలుగా అనువదించడం.
  alternative: ‘యోగ్యుడైనవానికి మాత్రమే ఇవ్వు’ వంటి అర్హతను చేర్చడం లేదా ‘నిరాకరించకు’ అని పూర్తిగా భావానువాదం చేయడం.
  rationale: గ్రీకు వాక్యం అడిగేవారికి లేదా అప్పు కోరేవారికి అదనపు అర్హతలను పేర్కొనదు. అందువల్ల వ్యాఖ్యానాత్మక పరిమితులను చేర్చకుండా ఆజ్ఞ యొక్క ఉద్వేగాన్ని, సాధారణ పరిధిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలి. ‘ముఖం తిప్పకు’ మూలంలోని రూపకాన్ని సహజంగా నిలుపుతుంది. మూలంలో నిర్దిష్ట వస్తువు లేకపోవడంతో ‘డబ్బు’ చేర్చలేదు.
