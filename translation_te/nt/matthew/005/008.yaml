review_pass:
  verdict: revise
  source_fidelity: The draft preserves the beatitude structure, the causal ὅτι clause, the emphatic αὐτοί ('వారే'), and the unexpanded future promise that the pure will see God. However, 'పవిత్రులైనవారు' can more readily mean 'holy people' than καθαροί ('pure/clean') and thus is not the closest lexical rendering here.
  naturalness: The sentence is clear and suitably dignified in modern standard Telugu. Replacing 'పవిత్రులైనవారు' with 'శుద్ధులైనవారు' improves semantic precision while remaining natural. The revised footnote wording also removes an unclear pronoun reference.
  terminology: Use 'శుద్ధులైనవారు' for καθαροί in this inward moral context. Retain 'హృదయంలో,' 'ధన్యులు,' 'దేవుణ్ణి,' and 'చూస్తారు.' No doctrinal expansion of 'will see God' is warranted.
  issues:
  - severity: medium
    issue: ‘పవిత్రులైనవారు’ for καθαροί
    rationale: In Telugu, పవిత్రులు commonly denotes those who are holy/sacred, whereas καθαροί here directly denotes purity or cleanness with respect to the heart. ‘హృదయంలో శుద్ధులైనవారు’ preserves the source wording and inward focus more closely without making the expression ritualistic.
  - severity: low
    issue: Footnote b has a slightly unclear antecedent in ‘దాని భవిష్యత్ పరిపూర్ణత’
    rationale: ‘దాని’ could be read as referring ambiguously. Naming the promised access/presence more explicitly makes the note natural without changing its intentionally noncommittal interpretive scope.
  revised_text: హృదయంలో శుద్ధులైనవారు[a] ధన్యులు, ఎందుకంటే వారే దేవుణ్ణి చూస్తారు.[b]
