revisions:
- from: హృదయంలో పవిత్రులైనవారు[a] ధన్యులు, ఎందుకంటే వారే దేవుణ్ణి చూస్తారు.[b]
  to: హృదయంలో శుద్ధులైనవారు[a] ధన్యులు, ఎందుకంటే వారే దేవుణ్ణి చూస్తారు.[b]
  rationale: 'The revision distinguishes purity (καθαροί) from holiness more accurately in Telugu, while retaining the Greek syntax and emphasis: blessedness, inward purity, causal promise, emphatic recipients, and direct vision of God. The footnote continues to acknowledge possible dimensions of the promise without identifying the translation itself with any one theological interpretation.'
