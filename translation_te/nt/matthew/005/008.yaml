  text: μακάριοι οἱ καθαροὶ τῇ καρδίᾳ, ὅτι αὐτοὶ τὸν θεὸν ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: te
  text: హృదయంలో శుద్ధులైనవారు[a] ధన్యులు, ఎందుకంటే వారే దేవుణ్ణి చూస్తారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘హృదయ శుద్ధిగలవారు.’
    reason: lexical_alternative
  - marker: b
    text: ‘దేవుణ్ణి చూస్తారు’ అనే వాగ్దానం దేవుని సన్నిధికి ప్రత్యక్ష ప్రవేశాన్ని, భవిష్యత్తులో ఆ ప్రవేశం సంపూర్ణంగా నెరవేరడాన్ని కూడా, సూచించవచ్చు; అనువాదం దాని అర్థాన్ని ఒకే వివరణకు పరిమితం చేయకుండా అసలు పదప్రయోగాన్ని నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: ధన్యులు
  rationale: దేవుని అనుగ్రహం పొందిన ప్రశంసనీయమైన స్థితిని తెలిపే ధన్యతవాక్యానికి ‘ధన్యులు’ సహజమైన, గంభీరమైన తెలుగు రూపం; ఇది కేవలం భావోద్వేగపరమైన సంతోషానికి పరిమితం కాదు.
- source_word: καθαροὶ
  choice: పవిత్రులైనవారు
  rationale: ఈ సందర్భంలోని అంతరంగ నైతిక స్వచ్ఛతను ‘పవిత్రులు’ సహజంగా తెలియజేస్తుంది. ‘శుద్ధమైనవారు’ కూడా సాధ్యమే గాని, అది కొన్ని సందర్భాల్లో ఆచారపరమైన శుద్ధతను సూచించవచ్చు.
- source_word: τῇ καρδίᾳ
  choice: హృదయంలో
  rationale: దత్తి విభక్తి ఇక్కడ పవిత్రత ఏ విషయంలో నిజమో సూచిస్తుంది. ‘హృదయంలో’ అనేది భావోద్వేగాలను మాత్రమే కాకుండా అంతరంగ వ్యక్తిత్వాన్ని సూచిస్తూ గ్రీకు భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ధన్యులని చెప్పడానికి ఆధారాన్ని లేదా కారణాన్ని స్పష్టమైన ఆధునిక తెలుగులో పరిచయం చేస్తుంది.
- source_word: αὐτοὶ
  choice: వారే
  rationale: గ్రీకులోని సర్వనామ ఉద్ఘాటనను నిలుపుతూ, ఈ వాగ్దానం పొందేది ఈ వ్యక్తులేనని ‘వారే’ స్పష్టం చేస్తుంది.
- source_word: τὸν θεὸν
  choice: దేవుణ్ణి
  rationale: ὄψονται అనే క్రియకు ప్రత్యక్ష కర్మగా ఉన్న పదాన్ని సహజమైన తెలుగు కర్మరూపంలో అనువదించింది.
- source_word: ὄψονται
  choice: చూస్తారు
  rationale: ὁράω క్రియ భవిష్యత్తు రూపంలోని నేరమైన వాగ్దానాన్ని సహజ తెలుగులో నిలుపుతుంది; దాని భావాన్ని అనుభవించడం లేదా అంత్యకాల దర్శనం అని అనువాదంలోనే పరిమితం చేయదు.
theological_decisions:
- issue: ‘దేవుణ్ణి చూస్తారు’ అనే వాగ్దానం యొక్క భావం
  choice: ‘దేవుణ్ణి చూస్తారు’ అనే నేరమైన పదప్రయోగాన్ని అలాగే నిలిపాం.
  alternative: ‘దేవుని సన్నిధిని అనుభవిస్తారు’ లేదా ‘అంత్యకాలంలో దేవుణ్ణి దర్శిస్తారు.’
  rationale: గ్రీకు వాక్యం సంక్షిప్తంగా ఉండి, దేవుని సన్నిధికి ప్రత్యక్ష ప్రవేశం మరియు దాని భవిష్యత్ పరిపూర్ణత వంటి భావాలకు అవకాశం ఇస్తుంది. అనువాదం వాటిలో ఒకదానికే అర్థాన్ని పరిమితం చేయకుండా అసలు వాక్యంలోని దైవశాస్త్ర సంబంధమైన విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే ధన్యతవాక్యానికి తగిన గంభీరతతో రూపొందించబడింది. ‘హృదయంలో పవిత్రులైనవారు’ అనే నిర్మాణం మూలంలోని అంతరంగ దృష్టిని స్పష్టంగా నిలుపుతుంది.
