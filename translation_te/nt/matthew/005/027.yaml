  text: You have heard that it was said[a], ‘You shall not commit adultery.’
translation:
  language: te
  text: “వ్యభిచారం చేయకూడదు” అని చెప్పబడిందని మీరు విన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “చెప్పబడిందని మీరు విన్నారు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: మీరు విన్నారు
  rationale: గ్రీకు ఏఓరిస్ట్ క్రియను తెలుగులో సహజమైన భూతకాల రూపంతో అనువదించాం; ఇది ప్రజలు ముందుగా విని స్వీకరించిన ఆజ్ఞను సూచిస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: విన్న విషయాన్ని పరిచయం చేసే గ్రీకు అనుబంధకానికి తెలుగులో సహజమైన ఉద్ధరణ సూచక రూపం ‘అని’.
- source_word: ἐρρέθη
  choice: చెప్పబడిన మాటను
  rationale: గ్రీకు కర్మణి రూపంలోని ‘చెప్పబడింది’ అనే భావాన్ని నిలుపుతూ, ‘విన్నారు’తో సహజంగా కలిసే తెలుగు నిర్మాణాన్ని వాడాం.
- source_word: Οὐ μοιχεύσεις
  choice: వ్యభిచారం చేయకూడదు
  rationale: భవిష్యత్ సూచక రూపంలో వ్యక్తమైన నిషేధాజ్ఞను, దశాజ్ఞల ఆజ్ఞారూప ధ్వనిని నిలుపుతూ ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: దశాజ్ఞల ఉల్లేఖనంతో సంబంధం
  choice: ‘వ్యభిచారం చేయకూడదు’ అనే ఆజ్ఞారూపం
  alternative: ‘వ్యభిచారం చేయవద్దు’
  rationale: యేసు దశాజ్ఞలలోని నిషేధాన్ని ఉటంకిస్తున్నందున, నియమాత్మక ఆజ్ఞ ధ్వనిని ‘చేయకూడదు’ రూపం స్పష్టంగా నిలుపుతుంది; అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగాను, దశాజ్ఞల ఉల్లేఖనానికి తగిన గంభీరతతోనూ రూపొందించబడింది.
