id: MAT.5.29
reference: Matthew 5:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: te
  text: అయితే నీ కుడి కన్ను నిన్ను తడబడేలా చేస్తే[a], దాన్ని పీకి నీ నుండి దూరంగా పారవేయి. ఎందుకంటే నీ శరీరమంతా గెహెన్నాలో[b] పడవేయబడడం కంటే నీ అవయవాల్లో ఒకటి నశించిపోవడం నీకు మేలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నీవు పాపం చేసేలా చేస్తే.”'
    reason: lexical_alternative
  - marker: b
    text: ‘గెహెన్నా’ అనేది హిన్నోము లోయ పేరుకు గ్రీకు రూపం; సంప్రదాయంగా దీన్ని “నరకం” అని అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: నీవు తడబడేలా చేస్తే
  rationale: గ్రీకు క్రియలోని తడబడటం లేదా పడిపోవడం అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భంలో ఇది పాపానికి దారితీయడాన్ని సూచిస్తుందని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: ἔξελε
  choice: దాన్ని పీకి
  rationale: కంటిని తొలగించాలనే ఆజ్ఞలో ఉన్న తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: βάλε ἀπὸ σοῦ
  choice: నీ నుండి దూరంగా పారవేయి
  rationale: βάλε లోని బలమైన ‘వేయి’ భావాన్నీ, ἀπὸ σοῦ లోని తన నుండి వేరుచేసే భావాన్నీ నిలుపుతుంది.
- source_word: συμφέρει
  choice: నీకు మేలు
  rationale: లాభదాయకం లేదా ప్రయోజనకరం అనే భావాన్ని ఈ తులనాత్మక సందర్భంలో సహజంగా అందిస్తుంది.
- source_word: ἀπόληται
  choice: నశించిపోవడం
  rationale: ఒక శరీర అవయవాన్ని కోల్పోవడంలోని గంభీరతను నిలుపుతూ, అంతకుమించిన తాత్త్విక అర్థాన్ని బలవంతంగా చేర్చదు.
- source_word: ἓν τῶν μελῶν σου
  choice: నీ అవయవాల్లో ఒకటి
  rationale: μέλος ఇక్కడ శరీరంలోని ఒక భాగాన్ని సూచిస్తుంది; కన్నుకూ వర్తించే సహజమైన తెలుగు పదం ‘అవయవం.’
- source_word: βληθῇ
  choice: పడవేయబడడం
  rationale: βάλλω యొక్క కర్మణి రూపంలోని బలమైన ‘విసరబడటం/పడవేయబడటం’ భావాన్ని నిలుపుతుంది.
- source_word: γέενναν
  choice: గెహెన్నా
  rationale: యేసు ఉపయోగించిన ప్రత్యేక స్థలనామ సంబంధిత పదాన్ని అలాగే ఉంచి, దాన్ని సాధారణ వేదాంత పదమైన ‘నరకం’గా ముందుగానే సమతలం చేయకుండా ఉంటుంది.
- source_word: ὁ δεξιὸς
  choice: కుడి
  rationale: మూలపాఠ్యంలో స్పష్టంగా ఉన్న కుడి కన్ను అనే వివరాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాక్యంతో కొనసాగింపునూ స్వల్ప వ్యత్యాసాన్నీ సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: γέεννα పదం అనువాదం
  choice: గెహెన్నా
  alternative: నరకం
  rationale: మూలంలోని ప్రత్యేక పదాన్ని నిలిపి, దానికి తరువాతి కాలంలో ఏర్పడిన విస్తృత వేదాంత అనుబంధాలను ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చదు; సంప్రదాయ అనువాదాన్ని పాదసూచికలో ఇస్తుంది.
- issue: σκανδαλίζω లోని రూపక భావం
  choice: నీవు తడబడేలా చేస్తే
  alternative: నీవు పాపం చేసేలా చేస్తే
  rationale: గ్రీకులోని తడబడటం అనే రూపక ఉద్వేగాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భానుసార అర్థమైన పాపం చేయించడాన్ని పాదసూచికలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి ఉపయోగించబడింది. ఆజ్ఞల తీవ్రతను ‘పీకి,’ ‘దూరంగా పారవేయి’ అనే సహజ పదాలతో నిలిపి, మూలంలోని రూపకాన్నీ గెహెన్నా అనే ప్రత్యేక పదాన్నీ వివరణాత్మక పాదసూచికలతో సంరక్షించాం.
