  source_fidelity: 'The draft retains all principal source elements: the right eye, the stumbling metaphor, the two forceful imperatives, separation from oneself, the comparison of one bodily member with the whole body, and Gehenna. The passive force of βληθῇ is retained. A small wording revision makes the Telugu expression of σκανδαλίζει more idiomatic without reducing its metaphorical sense.'
