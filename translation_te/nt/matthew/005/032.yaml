id: MAT.5.32
reference: Matthew 5:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: te
  text: 'కానీ నేను మీతో చెబుతున్నాను: లైంగిక దుర్నీతి విషయంలో తప్ప తన భార్యకు విడాకులు ఇచ్చే ప్రతివాడూ ఆమె వ్యభిచారం చేసేలా చేస్తాడు[b]; విడాకులు పొందిన స్త్రీని పెళ్లి చేసుకునేవాడు వ్యభిచారం చేస్తాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, మరింత అక్షరార్థంగా, ‘ఆమె వ్యభిచారిణి అయ్యేలా చేస్తాడు.’ గ్రీకు అనంతరూపం కర్మణి రూపంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: విడాకులు ఇచ్చే / విడాకులు పొందిన స్త్రీ
  rationale: వివాహ సందర్భంలో ἀπολύω సాధారణంగా ‘పంపివేయడం’ అనే విస్తృత అర్థంకంటే వివాహ బంధాన్ని రద్దుచేయడం, అంటే విడాకులు ఇవ్వడం అనే అర్థాన్ని ఇస్తుంది. రెండు రూపాల్లోనూ అదే న్యాయ-వివాహ భావాన్ని సహజమైన తెలుగులో నిలిపింది.
- source_word: γυναῖκα
  choice: భార్య
  rationale: γυνή అనే పదానికి ‘స్త్రీ’ లేదా ‘భార్య’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ αὐτοῦ అనే స్వామ్య సూచన, విడాకుల సందర్భం కారణంగా ‘భార్య’ సరైన ఎంపిక.
- source_word: παρεκτὸς λόγου πορνείας
  choice: లైంగిక దుర్నీతి కారణంగా తప్ప
  rationale: παρεκτός మినహాయింపును సూచిస్తుంది; λόγου ఇక్కడ కారణం లేదా విషయం అనే భావంలో ఉంది. πορνεία అనేది ఒకే నిర్దిష్ట చర్యకు పరిమితం కాని, అక్రమ లైంగిక ప్రవర్తనను సూచించే విస్తృత పదం. అందువల్ల ‘లైంగిక దుర్నీతి’ దాని విస్తృతిని సహజంగా నిలుపుతుంది.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: ఆమె వ్యభిచారం చేసేలా చేస్తున్నాడు
  rationale: ποιέω + infinitive నిర్మాణం ఒకరు ఏదైనా చేయడానికి లేదా ఒక స్థితికి రావడానికి కారణమవడం అనే భావాన్ని ఇస్తుంది. μοιχευθῆναι రూపపరంగా కర్మణి ప్రయోగంలో ఉన్నప్పటికీ, ప్రధాన వాక్యంలో సహజమైన తెలుగు కోసం కారణార్థక నిర్మాణాన్ని వాడి, కర్మణి/ఫలితార్థక సూక్ష్మతను పాదసూచికలో నిలిపాం.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: పెళ్లి చేసుకునేవాడు
  rationale: ἐάνతో కూడిన సంబంధవాచక ఉపవాక్యం నిర్దిష్టం కాని సాధారణ షరతును తెలుపుతుంది. ‘పెళ్లి చేసుకునేవాడు’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: μοιχᾶται
  choice: వ్యభిచారం చేస్తున్నాడు
  rationale: ఈ వర్తమాన రూపానికి తెలుగులో సహజమైన క్రియారూపం ‘వ్యభిచారం చేస్తున్నాడు.’ గ్రీకు వాచ్యభేదాన్ని తెలుగులో కృత్రిమంగా ప్రతిబింబించకుండా కార్య భావాన్ని స్పష్టంగా తెలిపింది.
- source_word: πᾶς ὁ ἀπολύων
  choice: విడాకులు ఇచ్చే ప్రతివాడూ
  rationale: పుంలింగ ఏకవచన కృదంత నిర్మాణం సాధారణ నియమాన్ని తెలుపుతుంది. ‘ప్రతివాడూ’ దాని సమగ్రతను తెలియజేస్తుంది; ‘తన భార్య’ అనే పదబంధం వాక్యంలోని పురుష-నిర్దిష్ట సామాజిక సందర్భాన్ని నిలుపుతుంది.
theological_decisions:
- issue: παρεκτὸς λόγου πορνείας అనే మినహాయింపు ఉపవాక్యపు భావం
  choice: ‘లైంగిక దుర్నీతి కారణంగా తప్ప’ అని నిజమైన మినహాయింపుగా అనువదించడం
  alternative: ‘లైంగిక దుర్నీతి అని పిలువబడే విషయం తప్ప’ లేదా ‘చట్టవిరుద్ధమైన వివాహం విషయంలో తప్ప’
  rationale: గ్రీకు వాక్యం స్పష్టంగా మినహాయింపు నిర్మాణాన్ని కలిగి ఉంది. అయితే πορνεία యొక్క ఖచ్చితమైన పరిధిని మూలపాఠం చెప్పినదానికంటే సంకుచితం చేయలేదు; అందువల్ల వివిధ క్రైస్తవ వ్యాఖ్యానాల మధ్యనున్న ఉద్రిక్తతను అనువాదం తీర్చివేయదు.
- issue: ποιεῖ తరువాత μοιχευθῆναι యొక్క కర్మణి/ఫలితార్థక బలం
  choice: ప్రధాన వాక్యంలో ‘ఆమె వ్యభిచారం చేసేలా చేస్తున్నాడు’ అనే సహజ కారణార్థక తెలుగు వాడి, రూపపరమైన కర్మణి సూక్ష్మతను పాదసూచికలో తెలియజేయడం
  alternative: ‘ఆమెను వ్యభిచారిణిగా చేస్తున్నాడు’ లేదా ‘ఆమె వ్యభిచారానికి గురయ్యేలా చేస్తున్నాడు’
  rationale: గ్రీకు infinitive రూపపరంగా కర్మణి ప్రయోగంలో ఉంది. అది క్రియాశీల భావాన్నా, ఫలితంగా వ్యభిచారిణి కావడాన్నా, లేక ఆమెపై వ్యభిచారం జరగడాన్నా సూచిస్తుందనే విషయంలో వ్యాఖ్యాన భేదం ఉంది. సహజమైన ప్రధాన పాఠంతో పాటు ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ఈ అనిశ్చితిని అతిగా పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘విడాకులు,’ ‘లైంగిక దుర్నీతి,’ ‘వ్యభిచారం’ వంటి ప్రస్తుత వాడుకలోని స్పష్టమైన పదాలను ఎంచుకున్నాం. మూలంలోని కారణార్థక నిర్మాణం సహజంగా ఉండేలా చేయబడింది; దాని కర్మణి సూక్ష్మత పాదసూచికలో భద్రపరచబడింది.
