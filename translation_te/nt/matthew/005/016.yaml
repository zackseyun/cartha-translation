id: MAT.5.16
reference: Matthew 5:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: te
  text: అలాగే, ప్రజల ఎదుట మీ వెలుగు ప్రకాశించనివ్వండి; వారు మీ మంచి పనులను చూసి, పరలోకాల్లో ఉన్న మీ తండ్రిని మహిమపరచేలా చేయండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోకంలో ఉన్న.’ గ్రీకు మూలంలో ‘పరలోకాలు’ అనే బహువచనం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: అలాగే
  rationale: ముందటి దీపం–వెలుగు ఉపమానంతో ఈ ఆజ్ఞకు ఉన్న సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది.
- source_word: λαμψάτω
  choice: ప్రకాశించనివ్వండి
  rationale: మూడవ పురుష ఏకవచన ఆజ్ఞారూపంలోని బలాన్ని నిలుపుతూ, ‘మీ వెలుగు’ అనే కర్తతో సహజంగా సరిపోతుంది.
- source_word: τὸ φῶς ὑμῶν
  choice: మీ వెలుగు
  rationale: గ్రీకులోని ఏకవచన రూపాన్నీ, శిష్యుల సమష్టి సాక్ష్యాన్ని సూచించే భావాన్నీ నిలుపుతుంది.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: మనుష్యుల ఎదుట / వారి ఎదుట
  rationale: ἄνθρωποι ఇక్కడ పురుషులను మాత్రమే కాక సాధారణంగా మానవులను సూచిస్తుంది. మొదటి ప్రస్తావనలో ‘మనుష్యులు,’ తరువాత సహజత్వం కోసం ‘వారి’ అని వాడబడింది.
- source_word: ὅπως
  choice: మహిమపరచేలా
  rationale: తరువాతి క్రియలతో కలిసి ఉద్దేశాన్ని తెలిపే గ్రీకు నిర్మాణాన్ని తెలుగులో సహజమైన ప్రయోజనార్థక నిర్మాణంగా అందిస్తుంది.
- source_word: ἴδωσιν
  choice: చూసి
  rationale: మంచి పనులను చూడడం మహిమపరచడానికి దారితీసే చర్యగా తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: τὰ καλὰ ἔργα
  choice: మీ మంచి పనులు
  rationale: καλά యొక్క నైతికంగా మంచి, ప్రశంసనీయమైన కార్యాలు అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δοξάσωσιν
  choice: మహిమపరచేలా
  rationale: దేవునికి మహిమ చెల్లించడం అనే δοξάζω యొక్క బలమైన ఆధ్యాత్మిక భావాన్ని నిలుపుతుంది.
- source_word: τὸν πατέρα ὑμῶν
  choice: మీ తండ్రిని
  rationale: మత్తయి సువార్తలో ముఖ్యమైన తండ్రి–శిష్యుల సంబంధ భాషను నేరుగా నిలుపుతుంది.
- source_word: τὸν ἐν τοῖς οὐρανοῖς
  choice: పరలోకాల్లో ఉన్న
  rationale: గ్రీకులోని బహువచన οὐρανοῖς‌ను తెలుగులో అర్థమయ్యే విధంగా బహువచనంలో నిలుపుతుంది.
theological_decisions:
- issue: ἀνθρώπων యొక్క సాధారణ మానవార్థం
  choice: మనుష్యులు
  alternative: ప్రజలు / ఇతరులు
  rationale: ఈ సందర్భంలో పదం పురుషులకు మాత్రమే పరిమితం కాదు. ‘మనుష్యులు’ మూలపదానికి దగ్గరగా ఉండి, తెలుగులో స్త్రీపురుషులందరినీ సహజంగా సూచిస్తుంది.
- issue: ὅπως తెలిపే ఉద్దేశం మరియు ఫలితం మధ్య సంబంధం
  choice: మహిమపరచేలా
  alternative: అప్పుడు వారు ... మహిమపరుస్తారు
  rationale: శిష్యుల మంచి పనుల లక్ష్యం వారికే కీర్తి రావడం కాదు; వాటిని చూసేవారు తండ్రిని మహిమపరచాలనే ఉద్దేశాన్ని ఈ నిర్మాణం స్పష్టంగా నిలుపుతుంది.
- issue: οὐρανοῖς యొక్క బహువచనం
  choice: పరలోకాల్లో
  alternative: పరలోకంలో
  rationale: మూల గ్రీకు బహువచనాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సుపరిచితమైన ఏకవచన తెలుగు రూపాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఉద్దేశాన్ని తెలిపే ὅπως నిర్మాణం సహజంగా ఉండేందుకు ప్రయోజన వాక్యభాగాన్ని ముందుకు తెచ్చాం; గ్రీకు బహువచనమైన ‘పరలోకాలు’ను నిలిపాం.
