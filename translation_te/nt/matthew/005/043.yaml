source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη· Ἀγαπήσεις τὸν πλησίον σου καὶ μισήσεις τὸν ἐχθρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: te
  text: “‘నీ పొరుగువానిని ప్రేమించాలి; నీ శత్రువును ద్వేషించాలి’ అని చెప్పబడిందని మీరు విన్నారు.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మొదటి వాక్యభాగం లేవీయకాండము 19:18ను ప్రతిధ్వనిస్తుంది. రెండో వాక్యభాగం, ‘నీ శత్రువును ద్వేషించాలి,’ పాత నిబంధనలోని ప్రత్యక్ష ఉల్లేఖనం కాదు; యేసు సరిదిద్దుతున్న ప్రజల మధ్య ప్రాచుర్యంలో ఉన్న బోధను అది ప్రతిబింబిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: మీరు విన్నారు
  rationale: బోధను ఇంతకుముందు విన్న విషయంగా సూచించే గ్రీకు ఏకకాల భూతరూపాన్ని, తెలుగులో సహజంగా మరియు మత్తయిలోని పునరావృత బోధనా సూత్రానికి తగినట్లుగా అనువదిస్తుంది.
- source_word: ἐρρέθη
  choice: చెప్పబడిన మాటను
  rationale: ఎవరు చెప్పారో నిర్దిష్టంగా పేర్కొనకుండా గ్రీకులోని కర్మణి ప్రయోగాన్ని నిలుపుతుంది; పూర్తి తెలుగు వాక్యంలో సహజంగా ఉండేందుకు నామీకృత నిర్మాణాన్ని ఉపయోగిస్తుంది.
- source_word: Ἀγαπήσεις
  choice: ప్రేమించాలి
  rationale: ఇక్కడ భవిష్యత్ రూపం ఆజ్ఞార్థక బలంతో ఉంది; ఆధునిక తెలుగులో ‘ప్రేమించాలి’ ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὸν πλησίον σου
  choice: నీ పొరుగువాణ్ణి
  rationale: లేవీయకాండము 19:18 నేపథ్యంలోని నైతిక సందర్భంలో πλησίονకు స్థిరమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: μισήσεις
  choice: ద్వేషించాలి
  rationale: ఉల్లేఖించిన బోధలోని ఆజ్ఞార్థక భవిష్యత్ బలాన్ని మొదటి క్రియకు సమాంతరంగా కాపాడుతుంది.
- source_word: τὸν ἐχθρόν σου
  choice: నీ శత్రువును
  rationale: ἐχθρόςకు ఈ విరుద్ధ నైతిక సందర్భంలో నేరమైన, సాధారణ తెలుగు సమానార్థకం.
theological_decisions:
- issue: ‘నీ శత్రువును ద్వేషించాలి’ అనే వాక్యభాగపు స్థితి
  choice: యేసు తన శ్రోతలు విన్నారని చెప్పిన ఒకే బోధలో భాగంగా ప్రధాన పాఠ్యంలో ఉంచడం; అది నేరుగా పాత నిబంధన ఉల్లేఖనం అని సూచించకపోవడం.
  alternative: మొత్తం వాక్యమంతా సమానంగా లేఖన ఉల్లేఖనమే అన్నట్లు చూపడం; లేదా రెండో భాగాన్ని ప్రధాన పాఠ్యంలోనే పారంపర్య వ్యాఖ్యగా గుర్తించడం.
  rationale: గ్రీకు పాఠ్యం రెండు భాగాలనూ ‘చెప్పబడిన మాట’ అనే ఒకే నివేదిత వాక్యంగా ఇస్తుంది. అయితే రెండో భాగం పాత నిబంధనలోని ప్రత్యక్ష ఆజ్ఞ కాదు. అందువల్ల పాఠ్యం ఆ నివేదిత బోధ యొక్క ఐక్యతను నిలుపుతూ, పాదటిప్పణి దాని నేపథ్యాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన బోధనా శైలి ఉపయోగించబడింది. ‘చెప్పబడిన మాటను’ అనే నిర్మాణం గ్రీకు కర్మణి ప్రయోగాన్ని అతిగా కఠినంగా కాకుండా నిలుపుతుంది; ఉల్లేఖనంలోని రెండు ఆజ్ఞలకు సమాంతరంగా ‘ప్రేమించాలి / ద్వేషించాలి’ వాడబడింది.
