id: MAT.5.19
reference: Matthew 5:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: te
  text: కాబట్టి, ఈ ఆజ్ఞలలో అత్యల్పమైన ఒక్కదానినైనా సడలించి[a], అలాగే చేయాలని ఇతరులకు బోధించే వ్యక్తి పరలోక రాజ్యంలో అతి చిన్నవాడని పిలువబడతాడు; అయితే వాటిని ఆచరించి, వాటినే బోధించే అటువంటి వాడు పరలోక రాజ్యంలో గొప్పవాడని పిలువబడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పక్కన పెట్టి’ లేదా ‘ఉల్లంఘించి.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘విప్పడం’ అని అర్థం; ఇక్కడ అది ఒక ఆజ్ఞ యొక్క బంధక శక్తిని బలహీనపరచడం లేదా అది తప్పనిసరి కాదన్నట్లు చూడడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వచనంలోని ధర్మశాస్త్ర స్థిరత్వం నుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది.
- source_word: λύσῃ
  choice: సడలించి
  rationale: λύω అనే క్రియలోని ‘విప్పడం/సడలించడం’ అనే రూపక భావాన్ని నిలుపుతూ, ఇక్కడ ఆజ్ఞ యొక్క బంధక శక్తిని బలహీనపరచడం లేదా దాన్ని తప్పనిసరి కానిదిగా చూడడం అనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: ఈ అతి చిన్న ఆజ్ఞల్లో ఒక్కదానినైనా
  rationale: ఆజ్ఞలలో ప్రాముఖ్యత పరంగా అత్యల్పంగా భావించబడే ఒక్క ఆజ్ఞను కూడా సూచించే గ్రీకు నిర్మాణాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: అలాగే చేయాలని ఇతరులకు బోధించే
  rationale: οὕτως ముందున్న ‘ఆజ్ఞను సడలించడం’ వైపు తిరిగి సూచిస్తుంది. ἀνθρώπους ఇక్కడ మానవులను సాధారణంగా సూచిస్తున్నందున ‘ఇతరులకు’ అనేది లింగభేదం లేకుండా సహజంగా అర్థాన్ని అందిస్తుంది.
- source_word: ἐλάχιστος κληθήσεται
  choice: అతి చిన్నవాడని పిలువబడతాడు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నేరుగా నిలుపుతూ, రాజ్యంలో తులనాత్మక స్థితిని తెలిపే ‘least’ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: పరలోక రాజ్యంలో
  rationale: మత్తయి సువార్తలోని స్థిరమైన పదబంధానికి తెలుగులో పరిచితమైన, సహజమైన సమానార్థకం.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: వాటిని ఆచరించి బోధించే
  rationale: ఆజ్ఞలను చేయడం అనే భావాన్ని తెలుగులో సహజంగా ‘ఆచరించడం’గా వ్యక్తం చేస్తూ, చేయడం మరియు బోధించడం రెండింటినీ నిలుపుతుంది.
- source_word: οὗτος μέγας κληθήσεται
  choice: వ్యక్తి ... గొప్పవాడని పిలువబడతాడు
  rationale: మొదటి వ్యక్తితో స్పష్టమైన వ్యత్యాసాన్ని ఉంచి, μέγας ను అతిశయార్థం చేర్చకుండా ‘గొప్పవాడు’గా అనువదిస్తుంది.
theological_decisions:
- issue: పరలోక రాజ్యంలో ‘అతి చిన్నవాడు/గొప్పవాడు’ అనే స్థితి
  choice: రాజ్యంలో తులనాత్మక స్థితిగా వాక్యాన్ని యథాతథంగా ఉంచడం
  alternative: ‘అతి చిన్నవాడు’ అంటే రాజ్యం నుంచి వెలివేయబడినవాడని లేదా ‘గొప్పవాడు’ అంటే నిర్దిష్ట ప్రతిఫల హోదా పొందినవాడని వివరించడం
  rationale: గ్రీకు వాక్యం వ్యక్తి రాజ్యంలో ‘అతి చిన్నవాడని’ లేదా ‘గొప్పవాడని’ పిలువబడతాడని మాత్రమే చెబుతుంది. రక్షణ, బహుమానం లేదా హోదా గురించి వచనం స్పష్టంగా చెప్పని సిద్ధాంతాన్ని అనువాదంలో చేర్చలేదు.
- issue: τοὺς ἀνθρώπους యొక్క సాధారణ మానవ సూచన
  choice: ఇతరులకు
  alternative: పురుషులకు / మనుష్యులకు
  rationale: ఈ బహువచనం పురుషులను మాత్రమే కాక ప్రజలను సాధారణంగా సూచిస్తుంది. ‘ఇతరులకు’ అనేది సందర్భంలోని బోధన గ్రహీతలను సహజంగా, సమగ్రంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. రెండు విరుద్ధ షరతులను సమాంతరంగా ఉంచి, మూలంలోని న్యాయపరమైన గంభీరతను మరియు రాజ్యంలో ‘అతి చిన్నవాడు/గొప్పవాడు’ అనే పరిష్కరించని ధార్మిక ఉద్రిక్తతను నిలుపుకుంది.
