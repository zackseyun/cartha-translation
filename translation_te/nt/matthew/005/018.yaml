id: MAT.5.18
reference: Matthew 5:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: te
  text: 'ఎందుకంటే నేను మీతో నిశ్చయంగా చెబుతున్నాను: ఆకాశమూ భూమీ గతించిపోయే వరకు, అన్నీ జరిగే వరకు, ధర్మశాస్త్రం నుండి ఒక్క అయోటా అక్షరంగానీ[a], ఒక్క చిన్న గీతగానీ[b] ఎంతమాత్రమూ గతించిపోదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఒక్క చిన్న అక్షరంగానీ.” ‘అయోటా’ గ్రీకు వర్ణమాలలోని అతి చిన్న అక్షరం.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “ఒక్క చిన్న రాతగుర్తుగానీ”; అంటే అక్షరాలను వేరుచూపే అతి సూక్ష్మమైన గీత లేదా కొమ్ము.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: నిశ్చయంగా
  rationale: యేసు అధికారపూర్వకంగా చెప్పబోయే మాటకు గంభీరమైన ధృవీకరణగా ఉన్న పదబలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందరి వాక్యానికి ఈ మాట ఇచ్చే వివరణాత్మక ఆధారసంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో ... చెబుతున్నాను
  rationale: మూలంలోని ప్రత్యక్షమైన, అధికారపూర్వకమైన పలుకుబడిని తెలుగులో గౌరవప్రదంగా ఉంచుతుంది.
- source_word: ἕως ἂν παρέλθῃ
  choice: గతించిపోయే వరకు
  rationale: భవిష్యత్తులో సంభవించే హద్దును సూచిస్తూ, ఆకాశం మరియు భూమి సందర్భంలో παρέρχομαι పదానికి తగిన భావాన్ని ఇస్తుంది.
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: ఆకాశమూ భూమీ
  rationale: మూలంలోని విశ్వవ్యాప్త జంటను సహజమైన తెలుగు సముచ్చయంలో నిలుపుతుంది.
- source_word: ἰῶτα ἓν
  choice: ఒక్క అయోటా అక్షరం
  rationale: మూలం పేరుపెట్టి చెప్పిన అతి చిన్న గ్రీకు అక్షరాన్ని అలాగే నిలుపుతూ, తెలుగు పాఠకునికి అది అక్షరమని స్పష్టం చేస్తుంది.
- source_word: μία κεραία
  choice: ఒక్క చిన్న గీత
  rationale: అక్షరాన్ని భేదపరిచే అతి సూక్ష్మమైన రాతగుర్తు లేదా కొమ్మువంటి గీత అనే దృశ్యాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: οὐ μὴ παρέλθῃ
  choice: ఎంతమాత్రమూ గతించిపోదు
  rationale: οὐ μή అనే బలమైన నిరాకరణను సహజమైన కానీ దృఢమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τοῦ νόμου
  choice: ధర్మశాస్త్రం నుండి
  rationale: సందర్భంలో దేవుని లిఖిత ధర్మోపదేశాన్ని సూచించే νόμος భావాన్ని ఉంచుతుంది; దానిని కేవలం సాధారణ న్యాయనియమంగా తగ్గించదు.
- source_word: ἕως ἂν πάντα γένηται
  choice: అన్నీ జరిగే వరకు
  rationale: γίνομαι పదంలోని ‘సంభవించడం/జరగడం’ అనే విస్తృత భావాన్ని కాపాడి, దానిని ఒక నిర్దిష్ట నెరవేర్పు సిద్ధాంతానికి పరిమితం చేయదు.
theological_decisions:
- issue: νόμος అనే పదం సూచించే పరిధి
  choice: ధర్మశాస్త్రం
  alternative: ప్రత్యేకంగా తోరా/మోషే పంచగ్రంథాలు; లేదా సందర్భ విస్తరణలో పాత నిబంధన గ్రంథమంతా
  rationale: మత్తయి 5:17–19లో ‘ధర్మశాస్త్రము మరియు ప్రవక్తలు’ అనే లేఖన సందర్భం ఉంది. అయినా గ్రీకు పదం చెప్పినదానికంటే పరిధిని ప్రధాన పాఠ్యంలో మరింత సంకుచితం చేయకుండా ‘ధర్మశాస్త్రం’ అని ఉంచబడింది.
- issue: πάντα γένηται యొక్క భావబలం
  choice: అన్నీ జరిగే వరకు
  alternative: అన్నీ నెరవేరే వరకు; సమస్తం సంభవించే వరకు
  rationale: ఈ పదబంధం జరగడాన్నీ, ఉద్దేశించినది కార్యరూపం దాల్చడాన్నీ సూచించగలదు. ఒకే అంత్యకాల లేదా నెరవేర్పు వివరణను రుద్దకుండా ప్రధాన పాఠ్యం విస్తృత భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- issue: ధర్మశాస్త్రంలోని అతి చిన్న భాగమూ గతించదనే మాట యొక్క బలం
  choice: ఎంతమాత్రమూ గతించిపోదు
  alternative: ఎట్టి పరిస్థితిలోనూ గతించిపోదు
  rationale: οὐ μή అనే ద్విగుణ బలమైన నిరాకరణను తగ్గించకుండా, అదే సమయంలో ధర్మశాస్త్రం ఎలా వర్తిస్తుందనే తరువాతి వ్యాఖ్యాన ప్రశ్నను అనువాదంలో ముందుగానే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సాధారణ పాఠకునికి అర్థమయ్యే శైలి వాడబడింది. ‘అయోటా’ అనే మూలపద ప్రత్యేకతను నిలుపుతూ ‘అక్షరం’ జోడించి అర్థాన్ని స్పష్టం చేశాం. రెండు ἕως ἄν ఉపవాక్యాలనూ విడివిడిగా కాపాడేందుకు విరామచిహ్నాలు ఉపయోగించబడ్డాయి; అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
