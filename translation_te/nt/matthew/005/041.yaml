  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: te
  text: ఎవరైనా నిన్ను ఒక మైలు వెళ్లమని బలవంతం చేస్తే[a], అతనితో రెండు మైళ్లు వెళ్లు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నిన్ను నిర్బంధ సేవకు నియమిస్తే” అని కూడా అనువదించవచ్చు. ఈ క్రియ అధికారంతో ఒకరిని నిర్బంధ సేవకు తీసుకోవడాన్ని సూచించగలదు; రోమా కాలంలోని బలవంతపు సేవ ఇక్కడ నేపథ్యంగా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “ఒక మైలు ... రెండు”; రెండవ చోట “మైళ్లు” అనే మాట అధ్యాహారంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: ఎవరైనా
  rationale: సాధారణంగా వర్తించే అనిర్దిష్ట సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀγγαρεύσει
  choice: బలవంతంగా తీసుకువెళ్తే
  rationale: అధికారిక నిర్బంధ సేవకు సంబంధించిన క్రియలోని బలవంతపు భావాన్ని, దూరం వెళ్లే సందర్భంతో కలిపి స్పష్టంగా తెలియజేస్తుంది.
- source_word: μίλιον ἕν
  choice: ఒక మైలు దూరం
  rationale: రోమా మైలును సూచించే మూలపదంలోని నిర్దిష్ట దూరాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: ὕπαγε
  choice: వెళ్లు
  rationale: ముందుకు వెళ్లమనే ఏకవచన ఆజ్ఞను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μετ’ αὐτοῦ
  choice: అతనితో
  rationale: సహవాసం లేదా తోడుగా వెళ్లడాన్ని నేరుగా వ్యక్తం చేస్తుంది; వ్యక్తి ఎవరో మూలవాక్యం ప్రత్యేకంగా చెప్పదు.
- source_word: δύο
  choice: రెండు మైళ్లు
  rationale: గ్రీకులో రెండవసారి ‘మైళ్లు’ అనే నామవాచకం అధ్యాహారంగా ఉంది; ఆధునిక తెలుగులో స్పష్టత, సహజత్వం కోసం దాన్ని పూరించాం.
theological_decisions:
- issue: అధికార బలవంతపు సేవకు సంబంధించిన చారిత్రక నేపథ్యం
  choice: ప్రధాన పాఠ్యంలో బలవంతాన్ని చూపిస్తూ, రోమా సైనికుడని ప్రత్యేకంగా చెప్పలేదు.
  alternative: రోమా సైనికుడు బలవంతంగా సేవ చేయించడాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా పేర్కొనడం.
  rationale: ἀγγαρεύσει అనే క్రియ, ‘మైలు’ అనే కొలత రోమా అధికారుల నిర్బంధ సేవను గుర్తుచేసినా, మూలపాఠ్యం సైనికుడిని ప్రత్యక్షంగా పేర్కొనదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘బలవంతంగా తీసుకువెళ్తే’ అనేది నిర్బంధ భావాన్ని స్పష్టంగా ఉంచుతుంది; చారిత్రకంగా సాధ్యమైన రోమా సైనిక సందర్భాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా పాదసూచికలో తెలిపాం.
