id: MAT.2.13
reference: Matthew 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: te
  text: 'వారు వెళ్లిపోయిన తరువాత, ఇదిగో, ప్రభువు దూత ఒకడు[a] యోసేపుకు కలలో కనిపించి ఇలా అన్నాడు: “లేచి, బిడ్డనూ అతని తల్లినీ వెంట తీసుకొని ఐగుప్తుకు పారిపో. నేను నీకు చెప్పే వరకు అక్కడే ఉండు. ఎందుకంటే హేరోదు బిడ్డను చంపివేయడానికి[c] వెదకబోతున్నాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, ‘ప్రభువు దూత.’ గ్రీకులో ‘దూత’కు నిర్దిష్ట ఉపపదం లేదు; అయినా కొందరు దీనిని సుపరిచితమైన బైబిలు పదబంధంగా నిర్దిష్ట భావంలో గ్రహించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: 'గ్రీకు మాట సమీప భవిష్యత్తులో చేయనున్న ఉద్దేశాన్ని సూచిస్తుంది: ‘వెదకబోతున్నాడు.’'
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘అతనిని నాశనం చేయడానికి’; ఇక్కడ అది అతనిని చంపడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: వారు వెళ్లిపోయిన తరువాత
  rationale: ఈ genitive absolute ముందుగా పూర్తయిన చర్యను సూచిస్తుంది. సందర్భంలో ‘వారు’ అనేది జ్ఞానులను సూచిస్తుంది; తెలుగు వాక్యంలో కాలక్రమం సహజంగా నిలిచింది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: మత్తయి వాడిన ఆకస్మికమైన కథన సూచికను నిలుపుతూ, దైవిక జోక్యంపై పాఠకుని దృష్టిని కేంద్రీకరిస్తుంది.
- source_word: ἄγγελος κυρίου
  choice: ప్రభువు దూత ఒకడు
  rationale: గ్రీకులో article లేని నిర్మాణాన్ని అనిర్దిష్టంగా వ్యక్తం చేస్తుంది; κύριος అనే బిరుదును ‘ప్రభువు’గా అనువదించింది.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: యోసేపుకు కలలో కనిపించి
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథన శైలిలో భూతకాల భావం సహజం. κατ’ ὄναρ అనే నుడికారాన్ని ‘కలలో’గా అందించింది.
- source_word: Ἐγερθεὶς παράλαβε
  choice: లేచి ... వెంట తీసుకొని
  rationale: ఆజ్ఞల వరుసలో participle ఆజ్ఞార్థక బలాన్ని కలిగి ఉంది; παράλαβεలోని ‘తనతో తీసుకెళ్లడం’ అనే భావాన్ని ‘వెంట తీసుకొని’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: బాలుణ్ణీ అతని తల్లినీ
  rationale: పిల్లవాడినీ అతని తల్లినీ వేర్వేరుగా పేర్కొనే మూలవాక్య నిర్మాణాన్ని, సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: ఐగుప్తుకు పారిపో
  rationale: φεῦγεలో ఉన్న ప్రమాదం, అత్యవసరత రెండింటినీ ‘పారిపో’ తెలియజేస్తుంది.
- source_word: ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι
  choice: నేను నీతో చెప్పే వరకు అక్కడే ఉండు
  rationale: ‘అక్కడ ఉండిపోవడం’ అనే కొనసాగింపు భావాన్నీ, భవిష్యత్తులో నిర్ణయించబడే కాలపరిమితినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μέλλει ... ζητεῖν
  choice: వెదకబోతున్నాడు
  rationale: μέλλει సమీప భవిష్యత్తులో చేయనున్న ఉద్దేశాన్ని సూచిస్తుంది; ‘వెదకబోతున్నాడు’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: చంపివేయడానికి
  rationale: ἀπόλλυμι ప్రాథమికంగా ‘నాశనం చేయడం’ అయినా, ఇక్కడ బాలుని మరణానికి కారణమవ్వడమే సందర్భార్థం. స్పష్టమైన తెలుగు కోసం ‘చంపివేయడానికి’ ఎంచుకుంది; మరింత అక్షరార్థ రూపం పాదసూచికలో ఉంది.
theological_decisions:
- issue: ἄγγελος κυρίουలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ బైబిలు సందర్భంలో κύριος దేవునికి వాడిన బిరుదు; ‘ప్రభువు’ సాధారణమైన, గౌరవప్రదమైన అనువాదం. ఇది దూత స్వరూపంపై అదనపు సిద్ధాంత నిర్ణయాన్ని రుద్దదు.
- issue: article లేని ἄγγελος κυρίου యొక్క నిర్దిష్టత
  choice: ప్రభువు దూత ఒకడు
  alternative: ప్రభువు దూత
  rationale: గ్రీకు article లేకపోవడాన్ని అనిర్దిష్టంగా చూపింది; అయితే ఈ ప్రసిద్ధ బైబిలు పదబంధాన్ని కొందరు నిర్దిష్టంగా గ్రహించగల అవకాశాన్ని పాదసూచికలో ఉంచింది.
- issue: ἀπολέσαι యొక్క సందర్భార్థం
  choice: చంపివేయడానికి
  alternative: నాశనం చేయడానికి
  rationale: సందర్భంలో హేరోదు ఉద్దేశం బాలుని ప్రాణం తీయడం. అయినా గ్రీకు పదంలోని విస్తృతమైన ‘నాశనం’ భావాన్ని పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన కథన శైలిని వాడింది. ‘ఇదిగో’ అనే కొద్దిగా సాహిత్యరూపమైన పదాన్ని మూలంలోని కథన ఉద్ఘాటన కోసం నిలిపింది. ఆజ్ఞలను నేరుగా, అత్యవసరత కోల్పోకుండా అనువదించింది.
