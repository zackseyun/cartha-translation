id: MAT.2.15
reference: Matthew 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: te
  text: 'హేరోదు మరణించే వరకు ఆయన అక్కడ ఉన్నాడు. ప్రవక్త ద్వారా ప్రభువు చెప్పిన ఈ మాట నెరవేరడానికి ఇలా జరిగింది: “ఈజిప్టు నుండి నా కుమారుణ్ణి పిలిచాను.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హోషేయా 11:1 చూడండి. అక్కడ ఈ మాట మొదట దేవుని కుమారునిగా పేర్కొనబడిన ఇశ్రాయేలును సూచిస్తుంది; ఇక్కడ మత్తయి ఈ లేఖనం యేసులో నెరవేరిందని చూపిస్తున్నాడు.
    reason: cross_reference
lexical_decisions:
- source_word: ἦν ἐκεῖ
  choice: ఆయన అక్కడే ఉన్నాడు
  rationale: గ్రీకు అసంపూర్ణ భూతకాల రూపంలోని సరళమైన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; సందర్భం సూచించే ‘ఉండిపోయాడు’ అనే విస్తరణను అనవసరంగా చేర్చదు.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: హేరోదు చనిపోయేంతవరకు
  rationale: τελευτή ఇక్కడ జీవితం ముగియడం, అంటే మరణం, అనే భావంలో ఉంది. నామవాచక నిర్మాణాన్ని యథాతథంగా అనుకరించకుండా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα πληρωθῇ
  choice: నెరవేరడానికి ఇలా జరిగింది
  rationale: ἵναతో కూడిన కర్మణి రూపంలోని ఉద్దేశ్య/ఫలిత భావాన్ని నిలుపుతూ, తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉంచుతుంది.
- source_word: τὸ ῥηθὲν
  choice: చెప్పిన మాట
  rationale: ఆర్టికల్‌తో ఉన్న కర్మణి కృదంతాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; పలికిన విషయాన్నే సూచిస్తుంది.
- source_word: ὑπὸ κυρίου
  choice: ప్రభువు చెప్పిన
  rationale: ప్రభువును ప్రవచన వాక్యానికి మూల వక్తగా గుర్తిస్తుంది; గ్రీకులో లేని ‘దేవుడు’ అనే పదాన్ని జోడించదు.
- source_word: διὰ τοῦ προφήτου
  choice: ప్రవక్త ద్వారా
  rationale: 'διά + షష్ఠీ విభక్తి సూచించే మధ్యవర్తిత్వాన్ని నిలుపుతుంది: ప్రభువు మూల వక్త, ప్రవక్త మానవ మాధ్యమం.'
- source_word: λέγοντος
  choice: అని
  rationale: ఉద్ధరణను పరిచయం చేసే గ్రీకు కృదంతాన్ని ఆధునిక తెలుగులో సహజమైన ఉద్ధరణ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: Ἐξ Αἰγύπτου
  choice: ఈజిప్టు నుండి
  rationale: ἐξ యొక్క మూలస్థాన భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; తెలుగులో ‘నుండి’నే సాధారణ ప్రయోగం.
- source_word: ἐκάλεσα
  choice: పిలిచాను
  rationale: καλέω యొక్క విస్తృతమైన ‘పిలుచు’ భావాన్ని, హోషేయా ప్రతిధ్వనిని నిలుపుతుంది; ‘రప్పించాను’ అని అర్థాన్ని కుదించదు.
- source_word: τὸν υἱόν μου
  choice: నా కుమారుణ్ణి
  rationale: υἱόςలోని నిర్దిష్ట పుత్ర సంబంధాన్ని నిలుపుతుంది; ‘బిడ్డ’ అనే సాధారణ పదం కంటే ఉద్ధరణలోని దైవశాస్త్రీయ అనుసంధానాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: హోషేయా 11:1 ఉద్ధరణ మరియు నెరవేర్పు సూత్రం
  choice: యేసు ఈజిప్టు నుండి తిరిగి రావడాన్ని ప్రవక్త ద్వారా ప్రభువు చెప్పిన మాట నెరవేరడంగా మత్తయి ప్రతిపాదిస్తున్నాడనే వాదనను అనువాదం నిలుపుతుంది.
  alternative: ఇది కేవలం ప్రత్యక్ష భవిష్యద్వాణి అని చెప్పడం; లేదా ఇశ్రాయేలు కుమారత్వాన్ని మెస్సీయ తిరిగి అనుభవించిన ప్రతిరూప నెరవేర్పు అని వచనంలోనే వివరించడం.
  rationale: మత్తయి నెరవేర్పును స్పష్టంగా ప్రకటిస్తున్నాడు; అయితే అది ఎలా నెరవేరిందనే సిద్ధాంతాన్ని మూలపాఠం ఈ వాక్యంలో వివరించదు. అందువల్ల నిజమైన దైవశాస్త్రీయ ఉద్రిక్తతను పరిష్కరించకుండా ఉంచాం.
- issue: κύριος యొక్క అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా; ప్రభువైన దేవుడు
  rationale: గ్రీకు పాఠంలో κυρίου మాత్రమే ఉంది. ‘ప్రభువు’ దానిని నేరుగా ప్రతిబింబిస్తుంది; మూలంలో లేని ప్రత్యేక దైవనామాన్ని లేదా ‘దేవుడు’ అనే పదాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఆయన’ అనే సర్వనామం ముందరి సందర్భంలోని యేసును సూచిస్తూ గౌరవ వాడుకను పాటిస్తుంది. ఉద్ధరణను ముందుకు తెచ్చి తెలుగు వాక్యప్రవాహాన్ని సహజంగా చేశాం; ప్రభువు మూల వక్త, ప్రవక్త మాధ్యమం అనే భేదం అలాగే నిలిచింది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోతుంది.
