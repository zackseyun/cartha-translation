id: MAT.2.23
reference: Matthew 2:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: te
  text: ప్రవక్తల ద్వారా చెప్పబడినది, “అతడు నజరేయుడు[a] అని పిలువబడతాడు,” నెరవేరునట్లు అతడు వచ్చి నజరేతు అనే పట్టణంలో నివసించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నజోరేయుడు.” “అతడు నజరేయుడు అని పిలువబడతాడు” అనే మాటకు ఖచ్చితమైన ప్రవచన నేపథ్యం ఏమిటనేది వివాదాస్పదం. మత్తయి ఒక నిర్దిష్ట వచనాన్ని ఉటంకించకుండా, ప్రవక్తలలో కనిపించే ఇతివృత్తాలను సంక్షిప్తంగా చెప్పి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: వచ్చి
  rationale: ప్రధాన క్రియకు ముందున్న భూతకాల క్రియాభావాన్ని సహజమైన తెలుగు క్రమంలో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: κατῴκησεν
  choice: నివసించాడు
  rationale: κατοικέω సూచించే నివాసం ఏర్పరచుకొని ఉండడాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘స్థిరపడ్డాడు’ అనవసరంగా శాశ్వతత్వాన్ని బలపరచవచ్చు.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: నజరేతు అనే పట్టణంలో
  rationale: κατοικέωతో కూడిన εἰς‌ను తెలుగు వాడుకకు అనుగుణంగా స్థానార్థకంగా అనువదించాం. πόλις‌కు సందర్భోచితంగా ‘పట్టణం’ సహజంగా ఉంది.
- source_word: ὅπως πληρωθῇ
  choice: నెరవేరేలా ఇది జరిగింది
  rationale: మత్తయి నెరవేర్పు సూత్రంలోని ఉద్దేశం/ఫలితం భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది; ‘ఇది జరిగింది’ అనేది వాక్య సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: τὸ ῥηθὲν
  choice: చెప్పబడిన ... మాట
  rationale: గ్రీకు articular participle భావాన్ని సహజమైన తెలుగు నామవాచక నిర్మాణంతో అందిస్తుంది.
- source_word: διὰ τῶν προφητῶν
  choice: ప్రవక్తల ద్వారా
  rationale: διά + genitive లోని మధ్యవర్తిత్వం లేదా సాధన భావాన్ని, అలాగే ‘ప్రవక్తలు’ అనే బహువచనాన్ని కాపాడుతుంది.
- source_word: Ναζωραῖος
  choice: నజరేయుడు
  rationale: ఈ సందర్భంలో నజరేతుతో సంబంధమున్న వ్యక్తి అనే designation‌ను తెలుగులో స్థిరమైన, అర్థవంతమైన రూపంలో ఇస్తుంది; రూపసామ్యాన్ని ఎక్కువగా నిలిపే ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
- source_word: κληθήσεται
  choice: అని పిలువబడతాడు
  rationale: καλέω యొక్క భవిష్యత్ కర్మణి రూపాన్ని, ప్రవచన శైలిని నిలుపుతుంది.
theological_decisions:
- issue: ఒకే పాత నిబంధన వచనంతో సరిగ్గా సరిపోని నెరవేర్పు ఉల్లేఖనం
  choice: ప్రధాన పాఠ్యంలో ఏ ప్రత్యేక ప్రవచన మూలాన్నీ గుర్తించకుండా, ‘ప్రవక్తల ద్వారా’ అనే బహువచనాన్ని యథాతథంగా ఉంచడం
  alternative: యెషయా 11:1లోని ‘చిగురు’కు పదక్రీడగా చూడడం; మెస్సీయ తృణీకరణపై ప్రవక్తల సమగ్ర ఇతివృత్తంగా చూడడం
  rationale: గ్రీకు పాఠ్యం ప్రవక్తలను బహువచనంలో పేర్కొంటుంది; అందువల్ల నిర్ధారణకు అందని ఒకే మూలాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చకుండా మత్తయి మాటలలోని విస్తృతతను కాపాడాం.
- issue: Ναζωραῖος అర్థం
  choice: నజరేయుడు
  alternative: నజోరేయుడు; నాజీరు వ్రతస్థుడు
  rationale: సందర్భంలో ఇది నజరేతుతో సంబంధమున్న designation. నాజీరు వ్రతస్థుడనే అర్థం వేరే గ్రీకు పదానికి సంబంధించినది కాబట్టి స్వీకరించలేదు. రూపాత్మక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ప్రవచన నెరవేర్పు సూత్రానికి తగిన గౌరవప్రదమైన శైలిని నిలుపుతూ అనువదించబడింది. ప్రధాన పాఠ్యంలో ఉన్న [a] గుర్తు పాదటిప్పణితో సరిపోతుంది.
