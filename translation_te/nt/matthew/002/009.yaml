id: MAT.2.9
reference: Matthew 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: te
  text: వారు రాజు మాట విన్న తరువాత బయలుదేరారు. ఇదిగో, వారు తూర్పున[a] చూసిన నక్షత్రం వారికి ముందుగా వెళ్తూ, బాలుడు ఉన్న చోటు పైన వచ్చి నిలిచింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నక్షత్రం ఉదయించినప్పుడు.” ఈ గ్రీకు పదబంధం తూర్పు ప్రాంతాన్ని లేదా దిశను సూచించవచ్చు; నక్షత్రం ఉదయించడాన్ని కూడా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: రాజు మాట విని
  rationale: ἀκούωతో వచ్చిన వ్యక్తిని సూచించే షష్ఠీ విభక్తిని తెలుగులో సహజంగా ‘రాజు మాట విని’ అని వ్యక్తం చేశాం; ఈ వచనంలో లేని ‘హేరోదు’ అనే పేరును చేర్చలేదు.
- source_word: ἐπορεύθησαν
  choice: బయలుదేరారు
  rationale: రాజును విన్న తరువాత వారు అక్కడి నుంచి ప్రయాణం కొనసాగించిన కథన కదలికను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: అకస్మాత్తుగా కనిపించిన విషయంపై పాఠకుని దృష్టిని నిలిపే గ్రీకు కథన సూచికను నిలుపుతుంది.
- source_word: ἀστήρ
  choice: నక్షత్రం
  rationale: సందర్భానికి సరిపోయే సాధారణ ప్రత్యక్ష అర్థం.
- source_word: ὃν εἶδον
  choice: వారు ... చూసిన
  rationale: ముందుగా చూసిన అదే నక్షత్రాన్ని సూచించే సంబంధ వాక్యాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἐν τῇ ἀνατολῇ
  choice: తూర్పున
  rationale: ఈ పదబంధానికి తూర్పు ప్రాంతం లేదా దిశ అనే అర్థం ఉండవచ్చు; నక్షత్రం ఉదయించిన వేళ అనే ఖగోళార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: προῆγεν αὐτούς
  choice: వారికి ముందుగా సాగుతూ
  rationale: నక్షత్రం వారి ముందుగా వెళ్లిన దృశ్యాన్ని నిలుపుతూ, అది వారిని ఎలా నడిపించిందనే విధానాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: వచ్చి ... నిలిచింది
  rationale: మొదట చేరడం, తరువాత నిలవడం అనే గ్రీకు క్రియాక్రమాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో కాపాడుతుంది.
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: బాలుడు ఉన్న చోటికి వచ్చి దాని పైన
  rationale: నక్షత్రం బాలుడు ఉన్న స్థలానికి పైన నిలిచిందనే స్థాన సంబంధాన్ని స్పష్టంగా, అతివ్యాఖ్యానం లేకుండా తెలియజేస్తుంది.
- source_word: τὸ παιδίον
  choice: బాలుడు
  rationale: παιδίονకు సందర్భానుకూలమైన సరళమైన తెలుగు పదం; మూలంలో లేని అదనపు వయస్సు సూచనను చేర్చదు.
theological_decisions:
- issue: నక్షత్ర కథనంలో ἐν τῇ ἀνατολῇ అర్థం
  choice: తూర్పున
  alternative: అది ఉదయించినప్పుడు / దాని ఉదయాన్ని
  rationale: గ్రీకు పదబంధం భౌగోళికంగా ‘తూర్పున’ అని గానీ, ఖగోళ పరంగా నక్షత్రం ‘ఉదయించినప్పుడు’ అని గానీ అర్థమవుతుంది. ప్రధాన పాఠ్యంలో సుపరిచితమైన భౌగోళిక అర్థాన్ని ఉంచి, నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘ఇదిగో’ అనే దృష్టి ఆకర్షణ సూచికను మూలంలోని కథన సజీవత కోసం నిలిపాం.
