translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు వాక్యంలోని చర్యల క్రమం—లేవడం, బిడ్డను మరియు తల్లిని వెంటబెట్టుకోవడం, రాత్రివేళ బయలుదేరడం—కాపాడబడింది. సంప్రదింపుల ఆంగ్ల పాఠ్యంలో [a] గుర్తు తప్పుగా ‘got up’ తరువాత ఉన్నప్పటికీ, దాని గమనిక ‘to Egypt’ అనే ప్రత్యామ్నాయానికి సంబంధించినందున తెలుగు పాఠ్యంలో సంబంధిత గమ్యస్థాన వాక్యభాగం తరువాత ఉంచబడింది.
