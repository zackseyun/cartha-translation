id: MAT.2.14
reference: Matthew 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: te
  text: అతడు లేచి, రాత్రివేళ ఆ చిన్నబిడ్డను, అతని తల్లిని వెంటబెట్టుకొని ఐగుప్తుకు బయలుదేరాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఐగుప్తు దేశానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అతడు
  rationale: δέ కథనాన్ని స్వల్ప అనుసంధానంతో ముందుకు నడిపిస్తుంది. తెలుగులో ప్రత్యేకంగా ‘అప్పుడు’ లేదా ‘కాబట్టి’ చేర్చకుండానే వరుస చర్యల ద్వారా ఈ అనుసంధానం సహజంగా వ్యక్తమవుతుంది.
- source_word: ἐγερθεὶς
  choice: లేచి
  rationale: అయోరిస్ట్ కృదంతం యోసేపు వెంటనే చేసిన ముందరి చర్యను సూచిస్తుంది; ‘లేచి’ ఆధునిక తెలుగులో సహజమైన కథన ప్రయోగం.
- source_word: παρέλαβε
  choice: వెంటబెట్టుకొని
  rationale: ఇక్కడ παραλαμβάνω తనతోపాటు వ్యక్తులను తీసుకువెళ్లడాన్ని సూచిస్తుంది. ‘వెంటబెట్టుకొని’ అనే పదం కేవలం స్వీకరించడం కాక, తనతో తీసుకెళ్లడం అనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: τὸ παιδίον
  choice: ఆ చిన్నబిడ్డను
  rationale: παιδίον చిన్న వయస్సు గల బిడ్డను సూచిస్తుంది. మునుపు ప్రస్తావించిన నిర్దిష్ట బిడ్డ కాబట్టి ‘ఆ చిన్నబిడ్డను’ సహజంగా ఉంది.
- source_word: τὴν μητέρα αὐτοῦ
  choice: అతని తల్లిని
  rationale: αὐτοῦ సమీపంలోని παιδίον‌ను సూచిస్తుంది; అందువల్ల ఆమె యోసేపు తల్లి కాదు, బిడ్డ తల్లి అనే సంబంధం నిలుస్తుంది.
- source_word: νυκτὸς
  choice: రాత్రివేళ
  rationale: కాలాన్ని సూచించే జనిటివ్ రూపం చర్య రాత్రి సమయంలో జరిగిందని తెలియజేస్తుంది; ‘రాత్రివేళ’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: ἀνεχώρησεν
  choice: బయలుదేరాడు
  rationale: ἀναχωρέω ఇక్కడ ప్రమాదం కారణంగా మరొక ప్రాంతానికి వెళ్లిపోవడాన్ని సూచిస్తుంది. ‘బయలుదేరాడు’ గమ్యస్థానానికి ప్రయాణం మొదలుపెట్టిన భావాన్ని సహజంగా తెలియజేస్తూ, ఉద్దేశాన్ని అతిగా వ్యాఖ్యానించదు.
- source_word: εἰς Αἴγυπτον
  choice: ఐగుప్తుకు
  rationale: εἰς గమ్యస్థానం వైపు కదలికను సూచిస్తుంది. ‘ఐగుప్తుకు’ మూలంలోని దిశార్థాన్ని సరళంగా కాపాడుతుంది.
