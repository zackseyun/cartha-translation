translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. అరుదైన చారిత్రక పదమైన “మాగులు”ను ప్రధాన పాఠ్యంలో ఉంచి, సాధారణ పాఠకుల కోసం పాదసూచికలో వివరణ ఇచ్చాం.
