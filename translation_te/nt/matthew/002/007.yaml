id: MAT.2.7
reference: Matthew 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης λάθρᾳ καλέσας τοὺς μάγους ἠκρίβωσεν παρ’ αὐτῶν τὸν χρόνον τοῦ φαινομένου ἀστέρος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/007.yaml
  text: Then Herod secretly summoned the magi and determined from them the time when the star had appeared,[a]
translation:
  language: te
  text: అప్పుడు హేరోదు మాగులను[a] రహస్యంగా పిలిపించి, నక్షత్రం కనిపించిన సమయాన్ని వారి దగ్గర కచ్చితంగా తెలుసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జ్ఞానులను.” గ్రీకు పదమైన μάγοι (మాగోయి) ప్రత్యేకంగా తూర్పు ప్రాంతాలకు చెందిన విద్యావంతులైన జ్యోతిష పండితులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: తదుపరి సంఘటనను కథన క్రమంలో ప్రవేశపెట్టే సహజమైన కాలసూచక పదం.
- source_word: Ἡρῴδης
  choice: హేరోదు
  rationale: వ్యక్తి పేరును అనువదించకుండా, తెలుగులో స్థిరపడిన బైబిలు రూపానికి అనుగుణంగా లిప్యంతరీకరించబడింది.
- source_word: λάθρᾳ
  choice: రహస్యంగా
  rationale: హేరోదు చేసిన పని ఇతరులకు తెలియకుండా, గోప్యంగా జరిగిందనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: καλέσας
  choice: పిలిపించి
  rationale: ఆజ్ఞాపూర్వకంగా తన దగ్గరకు రప్పించాడనే సందర్భోచిత భావాన్ని ఇస్తూ, గ్రీకు భూతకాల అసమాపక క్రియను సహజమైన తెలుగు క్రియాక్రమంగా వ్యక్తపరుస్తుంది.
- source_word: τοὺς μάγους
  choice: మాగులను
  rationale: μάγοι అనే చారిత్రక-సాంస్కృతిక పదాన్ని నేరుగా లిప్యంతరీకరించి, తరువాతి సంప్రదాయ చిత్రణలను ప్రధాన పాఠ్యంలోకి చేర్చకుండా ఉంచుతుంది; అర్థస్పష్టత కోసం పాదసూచిక ఇవ్వబడింది.
- source_word: ἠκρίβωσεν
  choice: కచ్చితంగా తెలుసుకున్నాడు
  rationale: వివరంగా విచారించి ఖచ్చితమైన సమాచారం సంపాదించాడనే క్రియాభావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: παρ’ αὐτῶν
  choice: వారి దగ్గర
  rationale: παρά + షష్ఠీ సూచించే సమాచార మూలాన్ని సహజమైన తెలుగు వాడుకలో వ్యక్తపరుస్తుంది.
- source_word: τὸν χρόνον
  choice: సమయాన్ని
  rationale: విచారణకు సంబంధించిన నిర్దిష్ట కాలాన్ని సరళంగా సూచిస్తుంది; ఖచ్చితత్వ భావం ముందున్న క్రియలో వ్యక్తమైంది.
- source_word: τοῦ φαινομένου ἀστέρος
  choice: నక్షత్రం కనిపించిన
  rationale: గ్రీకు షష్ఠీ కృదంత పదబంధాన్ని సహజమైన తెలుగు కాలార్థక ఉపవాక్యంగా అందిస్తుంది; నక్షత్రం ప్రత్యక్షమైన సందర్భాన్ని సూచిస్తూ, అవసరానికి మించి దాని స్వభావాన్ని నిర్ధారించదు.
