revisions:
- from: “రామాలో ఒక స్వరం వినిపించింది—ఏడుపు, తీవ్రమైన విలాపం[a]. రాహేలు తన పిల్లల కోసం ఏడుస్తోంది; వారు ఇక లేరు[c] కాబట్టి ఆమె ఓదార్పు పొందడానికి ఇష్టపడలేదు[b].”
  to: “రామాలో ఒక స్వరం వినిపించింది—ఏడుపు మరియు గొప్ప విలాపం[a]. రాహేలు తన పిల్లల కోసం ఏడుస్తూ ఉంది; వారు ఇక లేరు[c] కాబట్టి ఆమె ఓదార్చబడటానికి ఇష్టపడలేదు[b].”
  rationale: 'The revision makes two minor improvements in source correspondence and idiomatic Telugu: it uses ‘గొప్ప’ for πολύς and a direct passive (‘ఓదార్చబడటానికి’) for παρακληθῆναι. It retains the quotation’s personified Rachel, does not explain her symbolism, and preserves the Greek ambiguity in ‘వారు ఇక లేరు.’'
  reviewer_model: gpt-5.6-terra
