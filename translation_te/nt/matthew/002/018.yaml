id: MAT.2.18
reference: Matthew 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: te
  text: “రామాలో ఒక స్వరం వినిపించింది—ఏడుపు మరియు గొప్ప విలాపం[a]. రాహేలు తన పిల్లల కోసం ఏడుస్తూ ఉంది; వారు ఇక లేరు[c] కాబట్టి ఆమె ఓదార్చబడటానికి ఇష్టపడలేదు[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏడుపు, ఎంతో విలాపం.”
    reason: πολύς ను ‘ఎంతో’ అని పరిమాణాన్ని/తీవ్రతను సూచించే విధంగా కూడా అనువదించవచ్చు.
  - marker: b
    text: లేదా, “ఓదార్చబడటానికి ఆమె ఒప్పుకోలేదు.”
    reason: οὐκ ἤθελεν ను సందర్భానుసారంగా మరింత బలంగా ‘ఒప్పుకోలేదు’ అని కూడా తెలుగులో వ్యక్తీకరించవచ్చు.
  - marker: c
    text: అక్షరార్థంగా, “వారు లేరు.”
    reason: గ్రీకు ὅτι οὐκ εἰσίν యొక్క సంక్షిప్తమైన అక్షరార్థాన్ని చూపుతుంది.
lexical_decisions:
- source_word: Φωνὴ
  choice: ఒక స్వరం
  rationale: φωνή ఇక్కడ వ్యక్తిగతమైన, ప్రవచనాత్మకమైన ధ్వనిని సూచిస్తుంది; ‘స్వరం’ తెలుగు పాఠకులకు సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: ἐν Ῥαμὰ
  choice: రామాలో
  rationale: ἐν స్థలాన్ని సూచిస్తుంది; ‘రామా’ అనే స్థలనామాన్ని లిప్యంతరీకరించి తెలుగు విభక్తితో సహజంగా అందించాం.
- source_word: ἠκούσθη
  choice: వినిపించింది
  rationale: అయోరిస్ట్ కర్మణి రూపంలోని భావాన్ని తెలుగులో సహజమైన అకర్మక ప్రయోగంతో తెలిపి, ఎవరు విన్నారో గ్రీకు వాక్యం చెప్పని విధానాన్ని కాపాడాం.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: ఏడుపు, తీవ్రమైన విలాపం
  rationale: κλαυθμός వినిపించే ఏడుపును, ὀδυρμός దుఃఖవిలాపాన్ని సూచిస్తాయి; πολύς తీవ్రతను తెలియజేస్తుంది. ‘తీవ్రమైన’ అనేది ఆధునిక తెలుగులో సహజంగా ఆ బలాన్ని అందిస్తుంది.
- source_word: Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς
  choice: రాహేలు తన పిల్లల కోసం ఏడుస్తోంది
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న చర్యను చూపుతుంది. తెలుగు ప్రయోగంలో దుఃఖానికి కారణమైన వారిని ‘కోసం’తో చెప్పడం సహజం; τέκνα లింగనిర్దిష్టం కానందున ‘పిల్లలు’ అని అనువదించాం.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: ఓదార్పు పొందడానికి ఇష్టపడలేదు
  rationale: θέλω యొక్క ‘ఇష్టపడు/సుముఖంగా ఉండు’ భావాన్ని, παρακληθῆναι యొక్క కర్మణి ఓదార్పు భావాన్ని నిలుపుతూ, ‘నిరాకరించింది’ అనే కొద్దిగా బలమైన అర్థాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: ὅτι οὐκ εἰσίν
  choice: వారు ఇక లేరు
  rationale: అక్షరార్థంగా ‘వారు లేరు’ అయిన ఈ సంక్షిప్త గ్రీకు వ్యక్తీకరణ నష్టాన్ని సూచిస్తుంది. ‘ఇక లేరు’ దాని గంభీరతను నిలుపుతూ ‘చనిపోయారు’ అని స్పష్టీకరించి భావాన్ని అతిగా నిర్ణయించదు.
theological_decisions:
- issue: ఉల్లేఖనంలో రాహేలు స్వరూపం
  choice: రాహేలును ప్రవచనాత్మకమైన మాతృమూర్తిగా పేరుతోనే ఉంచడం; ప్రతీకను ప్రధాన పాఠ్యంలో వివరించకపోవడం
  alternative: రాహేలు ఇశ్రాయేలు తల్లులందరికీ నేరుగా ప్రతీక అని పాఠ్యంలోనే వివరించడం
  rationale: గ్రీకు పాఠ్యం యిర్మీయా ఉల్లేఖనంలోని రాహేలును నేరుగా ప్రస్తావిస్తుంది; ఆమె ప్రతీకాత్మక పాత్రను అనువాదంలో పరిష్కరించడం మూలంలో లేని వ్యాఖ్యానాన్ని చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచన-విలాప ధోరణిని నిలిపాం. వాక్య నిర్మాణం సాధారణ పాఠకులకు సులభంగా ఉండేలా చేసినప్పటికీ, రాహేలు ఎవరికీ ప్రతీకో లేదా పిల్లలు ఏ విధంగా ‘లేరో’ ప్రధాన పాఠ్యంలో వ్యాఖ్యానించలేదు.
