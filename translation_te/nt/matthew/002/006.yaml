source:
  edition: SBLGNT
  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: te
  text: '“యూదా దేశపు బేత్లెహేమా,

    నీవు యూదా పాలకులలో ఎంతమాత్రమూ అతి చిన్నదానివి కావు;

    ఎందుకంటే నీలోనుండి ఒక పాలకుడు వస్తాడు[a];

    ఆయన నా ప్రజలైన ఇశ్రాయేలును కాపరిగా కాస్తాడు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బయలుదేరి వస్తాడు”; మరింత అక్షరార్థంగా, “బయటికి వెళ్తాడు.”
    reason: lexical_alternative
  - marker: b
    text: “కాపరిగా కాస్తాడు” అనే మాటకు “పాలిస్తాడు” అనే భావం కూడా ఉండవచ్చు; ఇది కాపరి సంరక్షణతోపాటు రాజపాలనా నాయకత్వాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: దేశంలోని
  rationale: ఇక్కడ γῆ యూదాతో సంబంధమున్న భూభాగాన్ని సూచిస్తుంది. ‘యూదా దేశంలోని బేత్లెహేము’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి భౌగోళిక భావాన్ని నిలుపుతుంది.
- source_word: οὐδαμῶς
  choice: ఎంతమాత్రమూ ... కావు
  rationale: ఈ పదంలోని బలమైన నిరాకరణను సాధారణ ‘కాదు’ కంటే స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐλαχίστη
  choice: అతి చిన్నదానివి
  rationale: పరిమాణంతోపాటు హోదా లేదా ప్రాముఖ్యతలో అత్యల్పమనే భావాన్ని సందర్భానుసారంగా నిలుపుతుంది.
- source_word: ἡγεμόσιν
  choice: పాలకులలో
  rationale: గ్రీకు పాఠంలోని పాలనా భావాన్ని నిలుపుతూ, ‘అధిపతులు’ లేదా ‘రాజులు’ వంటి మరింత నిర్దిష్ట పదవిని రుద్దదు.
- source_word: ἐξελεύσεται
  choice: వస్తాడు
  rationale: బేత్లెహేము నుండి ఆ పాలకుడు ఉద్భవించి రావడాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘బయలుదేరి వస్తాడు’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: ἡγούμενος
  choice: ఒక పాలకుడు
  rationale: నామవాచకంగా వాడిన ఈ కృదంతం రాబోయే వ్యక్తి నాయకత్వ, పాలనా పాత్రను సూచిస్తుంది.
- source_word: ποιμανεῖ
  choice: కాపరిగా నడిపిస్తాడు
  rationale: ποιμαίνωలోని కాపరి రూపకాన్ని నిలుపుతూ, ప్రజలను పాలించి నడిపించే భావాన్ని కూడా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: నా ప్రజలైన ఇశ్రాయేలును
  rationale: ఇశ్రాయేలు దేవుని ప్రజలని తెలిపే అన్వయ సంబంధాన్ని స్పష్టంగా, అదనపు సిద్ధాంతార్థం చేర్చకుండా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: రాబోయే వ్యక్తి విషయంలో రాజపాలనా భావం మరియు కాపరి భావం
  choice: ἡγούμενοςను ‘పాలకుడు’గా, ποιμανεῖను ‘కాపరిగా నడిపిస్తాడు’గా అనువదించి రెండు భావాలనూ నిలుపడం.
  alternative: రెండు పదాలనూ కేవలం రాజకీయ భాషలో (‘నాయకుడు’ / ‘పాలిస్తాడు’) లేదా కేవలం కాపరి భాషలో అనువదించడం.
  rationale: వచనం పాలనను, కాపరి సంరక్షణను కలిపి చూపుతుంది. రెండింటినీ నిలపడం ద్వారా రాజత్వం లేదా సంరక్షణ అనే ఒక్క కోణానికే భావాన్ని పరిమితం చేయకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన కావ్యాత్మక ఉటంకణ శైలిని ఉపయోగించాం. సంబోధనను సహజంగా చేయడానికి ‘యూదా దేశంలోని బేత్లెహేమా’ అని ఇచ్చాం. గ్రీకు వాక్యంలో స్థలమైన బేత్లెహేమును ‘పాలకులతో’ పోల్చే అసాధారణతను వ్యాఖ్యానించి సవరించకుండా అలాగే నిలిపాం.
