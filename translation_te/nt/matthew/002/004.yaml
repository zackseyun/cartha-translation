id: MAT.2.4
reference: Matthew 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: te
  text: ప్రధాన యాజకులనూ ప్రజల ధర్మశాస్త్ర పండితులనూ అందరినీ సమకూర్చి, మెస్సీయ[a] ఎక్కడ పుట్టనున్నాడో హేరోదు వారిని అడుగుతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.” “క్రీస్తు” అనేది గ్రీకులో “మెస్సీయ”కు సమానమైన బిరుదు; రెండింటి అర్థం “అభిషిక్తుడు.”
    reason: Χριστόςకు ప్రత్యామ్నాయ రూపాన్ని తెలియజేస్తూ, అది మెస్సీయకు గ్రీకు సమానమైన బిరుదని స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: συναγαγὼν
  choice: సమకూర్చి
  rationale: అనంతర ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచించే aorist participle భావాన్ని సహజమైన తెలుగు క్రియావిశేషణ రూపంలో తెలియజేస్తుంది.
- source_word: πάντας τοὺς ἀρχιερεῖς
  choice: ప్రధాన యాజకులందరినీ
  rationale: πάντας యొక్క సమగ్రతను నిలుపుతూ, ἀρχιερεῖς ను అనేకమంది మహాయాజకులుగా కాక యాజక నాయకత్వంగా స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: γραμματεῖς τοῦ λαοῦ
  choice: ప్రజల … ధర్మశాస్త్ర పండితులను
  rationale: ‘శాస్త్రులు’ అనే సంప్రదాయ పదం కేవలం ప్రతులు రాసేవారనే అపార్థం కలిగించవచ్చు; యూదుల ధర్మశాస్త్రంలో నిపుణులైన వారి పాత్రను ఈ పదబంధం ఆధునిక పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπυνθάνετο παρ’ αὐτῶν
  choice: వారిని విచారిస్తూ ఉన్నాడు
  rationale: imperfect క్రియలోని కొనసాగుతున్న విచారణ భావాన్ని నిలుపుతుంది; παρά భావం తెలుగు ‘వారిని విచారించు’ నిర్మాణంలో సహజంగా ఇమిడుతుంది.
- source_word: ὁ χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ పదం యూదులు ఎదురుచూస్తున్న అభిషిక్త పాలకుని బిరుదుగా ఉంది; సందర్భానికి సుపరిచితమైన ‘మెస్సీయ’ దీనిని వ్యక్తం చేస్తుంది.
- source_word: γεννᾶται
  choice: పుట్టవలసి ఉందో
  rationale: ప్రవచనపరంగా ఆశించబడుతున్న జన్మస్థలాన్ని గూర్చిన పరోక్ష ప్రశ్నలో వర్తమాన passive కు ఉన్న నిర్దేశిత/అపేక్షిత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు; అభిషిక్తుడు
  rationale: హేరోదు ప్రశ్న యూదుల ప్రవచనాల్లో ఎదురుచూసిన అభిషిక్త రాజును గూర్చినది. ‘మెస్సీయ’ ఆ సందర్భాన్ని కాపాడుతుంది; పాదసూచిక సమానమైన గ్రీకు బిరుదును, దాని అర్థాన్ని వివరిస్తుంది.
- issue: γεννᾶται లోని కాలం మరియు నిరీక్షణ
  choice: పుట్టవలసి ఉందో
  alternative: పుడతాడో; పుట్టనున్నాడో
  rationale: ప్రశ్న కేవలం భవిష్యత్ సంఘటన సమయాన్ని కాక, ప్రవచనం ప్రకారం నిర్దేశితమైన జన్మస్థలాన్ని అడుగుతోంది. అయితే మూలంలోని వర్తమాన రూపాన్ని సిద్ధాంతపరంగా అతిగా విస్తరించకుండా సంక్షిప్తంగా ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ముందు వచనంలో పేర్కొన్న కర్తను స్పష్టంగా ఉంచేందుకు తెలుగులో ‘హేరోదు’ను పునరుద్ఘాటించాం; ఇది కొత్త సమాచారం కాదు. ‘ధర్మశాస్త్ర పండితులు’ సాధారణ పాఠకునికి పాత్రను స్పష్టం చేస్తుంది.
