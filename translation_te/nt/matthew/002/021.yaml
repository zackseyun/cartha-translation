- from: అతడు లేచి, ఆ బిడ్డను, అతని తల్లిని వెంటబెట్టుకొని ఇశ్రాయేలు దేశంలో ప్రవేశించాడు.
  to: అప్పుడు అతడు లేచి, ఆ బిడ్డను, ఆ బిడ్డ తల్లిని వెంట తీసుకొని, ఇశ్రాయేలు దేశంలోకి ప్రవేశించాడు.
