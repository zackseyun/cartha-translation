translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని వరుస చర్యలు ‘లేచి ... వెంటబెట్టుకొని ... ప్రవేశించాడు’ అనే సహజ తెలుగు నిర్మాణంలో నిలుపబడ్డాయి.
