id: MAT.2.21
reference: Matthew 2:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: te
  text: అప్పుడు అతడు లేచి, ఆ బిడ్డను, ఆ బిడ్డ తల్లిని వెంట తీసుకొని, ఇశ్రాయేలు దేశంలోకి ప్రవేశించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథనంలోని తదుపరి ఘట్టాన్ని సూచిస్తుంది. ఆధునిక తెలుగు కథనంలో ‘అప్పుడు’ ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది; అయితే వరుస క్రియల ప్రవాహంలో అది అంతర్భావంగా ఉండడంతో ప్రధాన వాక్యంలో ప్రత్యేకంగా ఉంచలేదు.
- source_word: ἐγερθεὶς
  choice: లేచి
  rationale: సందర్భంలో ఈ కృదంతం అకర్మకంగా ‘లేచి’ అనే అర్థం ఇస్తుంది; తరువాతి చర్యకు ముందున్న వరుస చర్యను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρέλαβε
  choice: వెంటబెట్టుకొని
  rationale: παραλαμβάνω ఇక్కడ తనతో పాటు తీసుకువెళ్లడాన్ని సూచిస్తుంది. ‘వెంటబెట్టుకొని’ అనే పదం కేవలం స్వీకరించడం కాక ప్రయాణంలో తోడుగా తీసుకెళ్లడం అనే భావాన్ని స్పష్టంగా, సహజంగా ఇస్తుంది.
- source_word: τὸ παιδίον
  choice: ఆ బిడ్డను
  rationale: పూర్వసందర్భంలో ఇప్పటికే ప్రస్తావించబడిన నిర్దిష్ట బిడ్డను సూచించే గ్రీకు నిర్దిష్ట ఉపపదానికి ‘ఆ’ సహజమైన తెలుగు సూచన; παιδίον‌కు ‘బిడ్డ’ సాధారణ, సులభమైన సమానార్థకం.
- source_word: τὴν μητέρα αὐτοῦ
  choice: అతని తల్లిని
  rationale: αὐτοῦ అత్యంత సహజంగా బిడ్డను సూచిస్తుంది. ‘అతని తల్లి’ గ్రీకు సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: εἰσῆλθεν
  choice: ప్రవేశించాడు
  rationale: εἰσέρχομαι యొక్క ‘లోనికి వెళ్లాడు/ప్రవేశించాడు’ భావాన్ని ‘ప్రవేశించాడు’ గౌరవప్రదమైన ఆధునిక శైలిలో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: εἰς γῆν Ἰσραήλ
  choice: ఇశ్రాయేలు దేశంలో
  rationale: ఈ పదబంధం భౌగోళిక-జాతీయ భావంలో ‘ఇశ్రాయేలు దేశం’ను సూచిస్తుంది. εἰς‌తో కూడిన గమ్యభావం తెలుగులో ‘దేశంలో ప్రవేశించాడు’ అనే నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
