id: MAT.2.2
reference: Matthew 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: te
  text: “యూదుల రాజుగా పుట్టినవాడు ఎక్కడ ఉన్నాడు? ఎందుకంటే మేము తూర్పున[a] ఆయన నక్షత్రాన్ని చూశాము, ఆయనకు నమస్కరించడానికి[b] వచ్చాము” అని వారు అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన నక్షత్రం ఉదయించినప్పుడు.” గ్రీకు పదబంధం “తూర్పున” అని గానీ, నక్షత్రం ఉదయించడాన్ని సూచించేలా గానీ అర్థం కావచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఆయనను ఆరాధించడానికి.” గ్రీకు క్రియ సందర్భాన్ని బట్టి రాజుకు గౌరవం చెల్లించడం లేదా ఆరాధించడం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: అని అడిగారు
  rationale: ఈ వర్తమాన కృదంతం వారి మాటలను పరిచయం చేస్తుంది. మాటల విషయం ప్రశ్నగా ఉన్నందున, తెలుగులో ‘అని అడిగారు’ సహజంగా ఉండి గ్రీకు సందర్భార్థాన్ని సరిగ్గా తెలియజేస్తుంది.
- source_word: Ποῦ ἐστιν
  choice: ఎక్కడ ఉన్నాడు?
  rationale: ఇది నేరుగా వేసిన స్థానసంబంధ ప్రశ్న; అదనపు భావాన్ని చేర్చకుండా సహజమైన తెలుగు రూపం.
- source_word: ὁ τεχθεὶς
  choice: పుట్టినవాడు
  rationale: నామవాచకంగా పనిచేసే భూతకాల కర్మణి కృదంతాన్ని సంక్షిప్తంగా ప్రతిబింబిస్తుంది; ‘నవజాతుడు’ అని చెప్పి శిశుదశను ప్రత్యేకంగా నొక్కిచెప్పదు.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: యూదుల రాజు
  rationale: రాజకీయ, మెస్సీయ సంబంధమైన బిరుదును సహజమైన తెలుగు షష్ఠీ నిర్మాణంలో నిలుపుతుంది.
- source_word: εἴδομεν γὰρ
  choice: మేము … చూశాము
  rationale: γάρ వారి ప్రశ్నకు కారణాన్ని ఇస్తుంది; తెలుగులో తరువాత వచ్చే ‘వచ్చాము’తో కలిసిన వాక్య సంబంధం కారణాన్ని సహజంగా స్పష్టం చేస్తుంది. εἴδομενను సాధారణ భూతకాలంగా అనువదించాం.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: ఆయన నక్షత్రాన్ని
  rationale: స్వామ్య సంబంధాన్ని నేరుగా తెలియజేస్తుంది; ఆ ఖగోళ సూచన స్వరూపం ఏమిటో అదనంగా నిర్ణయించదు.
- source_word: ἐν τῇ ἀνατολῇ
  choice: తూర్పున
  rationale: ἀνατολήకు ‘తూర్పు’ లేదా నక్షత్రం ‘ఉదయించడం’ అనే అర్థాలు ఉండవచ్చు. ప్రధాన పాఠ్యంలో సంప్రదాయబద్ధమైన, సందర్భోచితమైన ‘తూర్పున’ ఉంచి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἤλθομεν
  choice: వచ్చాము
  rationale: వారు ఇప్పుడు అక్కడికి చేరుకొని మాట్లాడుతున్న సందర్భంలో, గ్రీకు ఏఓరిస్టును తెలుగులో సహజమైన భూతకాల రూపంతో వ్యక్తం చేస్తుంది.
- source_word: προσκυνῆσαι αὐτῷ
  choice: ఆయనకు సాష్టాంగ నమస్కారం చేయడానికి
  rationale: προσκυνέωలో రాజుకు శరీరాన్ని వంచి గౌరవం చెల్లించడం నుండి ఆరాధన వరకు అర్థవ్యాప్తి ఉంది. ‘సాష్టాంగ నమస్కారం’ భౌతికంగా వంగి గౌరవించే చర్యను నిలుపుతూ, అది కేవలం మర్యాదేనా లేక ఆరాధనా అనే అంశాన్ని ముందుగానే పూర్తిగా తేల్చదు.
theological_decisions:
- issue: బాలుడైన యేసుకు సంబంధించి προσκυνῆσαι యొక్క అర్థం
  choice: ఆయనకు సాష్టాంగ నమస్కారం చేయడానికి
  alternative: ఆయనను ఆరాధించడానికి
  rationale: సందర్భంలో వారు ‘యూదుల రాజు’ను వెదుకుతున్నారు కాబట్టి రాజుకు చెల్లించే గౌరవం తక్షణ భావచట్రం. అయితే ఈ గ్రీకు క్రియ ఆరాధనను కూడా సూచించగలదు. ప్రధాన అనువాదం ఆ అర్థవ్యాప్తిని మూసివేయకుండా ఉంచుతుంది; పాదసూచిక స్పష్టమైన ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘సాష్టాంగ నమస్కారం’ కొంత సాంప్రదాయికమైనప్పటికీ, προσκυνέωలోని శరీరాన్ని వంచే చర్యను ‘గౌరవం చెల్లించడం’ కంటే స్పష్టంగా నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
