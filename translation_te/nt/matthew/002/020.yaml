id: MAT.2.20
reference: Matthew 2:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: te
  text: 'ఇలా అన్నాడు: “లేచి, బాలుణ్ణీ అతని తల్లినీ వెంటబెట్టుకొని ఇశ్రాయేలు దేశానికి వెళ్లు. ఎందుకంటే బాలుని ప్రాణం తీయాలని చూసినవారు చనిపోయారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: ఇలా అన్నాడు
  rationale: మునుపటి వాక్యంతో అనుసంధానమైన వర్తమాన కృదంతం. తెలుగులో సహజంగా ప్రత్యక్ష వాక్యాన్ని పరిచయం చేయడానికి పరిమిత క్రియారూపం వాడబడింది.
- source_word: Ἐγερθείς
  choice: లేచి
  rationale: ఆజ్ఞకు ముందున్న గ్రీకు కృదంత నిర్మాణాన్ని సహజమైన తెలుగు అనుక్రమ క్రియారూపంతో వ్యక్తం చేస్తుంది.
- source_word: παράλαβε
  choice: వెంటబెట్టుకొని
  rationale: ఇక్కడ παραλαμβάνω అంటే వారిని తనతో తీసుకువెళ్లడం; ‘వెంటబెట్టుకొని’ ఆ సహచర్య భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸ παιδίον
  choice: బాలుణ్ణి
  rationale: παιδίον చిన్న వయసున్న బిడ్డను సూచిస్తుంది; ‘బాలుడు’ గౌరవప్రదమైన, సహజమైన ఆధునిక తెలుగు పదం.
- source_word: τὴν μητέρα αὐτοῦ
  choice: అతని తల్లిని
  rationale: గ్రీకు స్వామ్యసర్వనామాన్ని నేరుగా, స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: πορεύου
  choice: వెళ్లు
  rationale: గమనం చేయమనే సరళ ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς γῆν Ἰσραήλ
  choice: ఇశ్రాయేలు దేశానికి
  rationale: γῆ యొక్క భూభాగ భావాన్ని నిలుపుతూ గమ్యాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τεθνήκασιν
  choice: చనిపోయారు
  rationale: గ్రీకు పర్ఫెక్ట్ మరణం సంభవించి దాని ఫలితస్థితి కొనసాగుతోందని సూచిస్తుంది; సందర్భంలో ‘చనిపోయారు’ సహజంగా రెండింటినీ అందిస్తుంది.
- source_word: οἱ ζητοῦντες
  choice: తీయాలని చూసినవారు
  rationale: ζητέω యొక్క ప్రయత్న భావాన్ని, గతంలో కొనసాగిన ప్రాణహరణ ఉద్దేశాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: బాలుని ప్రాణం
  rationale: ఈ ప్రాణాపాయ సందర్భంలో ψυχή అంటే అమూర్తమైన ‘ఆత్మ’ కాదు, జీవితం లేదా ప్రాణం.
theological_decisions:
- issue: ప్రాణాపాయ సందర్భంలో ψυχή అనువాదం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: ‘ఒకరి ψυχήను వెదకడం’ అనే ప్రయోగం ఇక్కడ అతణ్ణి చంపడానికి ప్రయత్నించడాన్ని సూచిస్తుంది. ‘ఆత్మ’ అనడం సందర్భంలో లేని తాత్త్విక భావాన్ని చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సామాన్య పాఠకులకు సులభంగా ఉండే కథన శైలి. ప్రత్యక్ష వాక్యంలోని ఏకవచన ఆజ్ఞారూపాలు నిలుపబడ్డాయి.
