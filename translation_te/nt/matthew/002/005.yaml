id: MAT.2.5
reference: Matthew 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: te
  text: 'వారు ఆయనతో ఇలా అన్నారు: “యూదయలోని బేత్లెహేములో, ఎందుకంటే ప్రవక్త ద్వారా ఇలా రాయబడి ఉంది:”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: అందుకు వారు
  rationale: ముందటి వచనంలోని ప్రధాన యాజకులు, శాస్త్రులను సూచించే substantival article‌ను ‘వారు’గా, δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని సందర్భానుసారంగా ‘అందుకు’గా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἶπαν αὐτῷ
  choice: ఆయనతో ... అన్నారు
  rationale: λέγω + dative యొక్క సాధారణ ‘అతనితో చెప్పారు’ భావాన్ని తెలుగు ప్రత్యక్ష వాక్య నిర్మాణానికి సహజంగా అందిస్తుంది.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: యూదయలోని బేత్లెహేములో
  rationale: ἐν యొక్క స్థలార్థాన్నీ, τῆς Ἰουδαίας ఏ బేత్లెహేమో నిర్దిష్టం చేసే సంబంధాన్నీ స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὕτως γὰρ
  choice: ఎందుకంటే ... ఇలా
  rationale: γάρ సమాధానానికి కారణాన్ని పరిచయం చేస్తుంది; οὕτως తరువాత వచ్చే ప్రవచన వాక్యాన్ని ముందుగా సూచిస్తుంది. తెలుగు పదక్రమంలో విడదీసిన ఈ రూపం రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: γέγραπται
  choice: రాయబడి ఉంది
  rationale: perfect passive‌ను, అలాగే కొనసాగుతున్న ప్రామాణిక స్థితిని సూచించే లేఖన-ఉల్లేఖన సూత్రాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διὰ τοῦ προφήτου
  choice: ప్రవక్త ద్వారా
  rationale: διά + genitive‌లోని మధ్యవర్తిత్వం లేదా సాధన భావాన్ని ‘ద్వారా’ నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రవక్త మధ్యవర్తిత్వ సూత్రం
  choice: ప్రవక్త ద్వారా
  alternative: ప్రవక్త చేత
  rationale: ‘ద్వారా’ అనేది ప్రవక్తను సందేశం అందిన మానవ మధ్యవర్తిగా చూపే గ్రీకు నిర్మాణాన్ని నిలుపుతుంది; దేవుడు అంతిమ మూలమని పాఠ్యంలో లేని పదాలతో విస్తరించదు.
- issue: γέγραπται యొక్క సంపూర్ణ నిష్క్రియ రూపం
  choice: రాయబడి ఉంది
  alternative: రాయబడింది
  rationale: గతంలో రాయబడి ఇప్పటికీ ప్రామాణికంగా ఉన్న స్థితిని సూచించే perfect భావాన్ని నిలుపుతుంది; కేవలం గత సంఘటనగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన ‘ఆయనతో’ వాడకం. గ్రీకు మధ్యబిందువు సూచించే స్పష్టమైన విరామాన్ని ‘బేత్లెహేములో’ తరువాత పూర్ణవిరామంతో చూపించి, సమాధానాన్ని దాని లేఖనాధార వివరణనుంచి వేరు చేశాం. వచనం తదుపరి ఉల్లేఖనానికి దారితీసేందున చివర ద్విబిందువు ఉంచాం.
