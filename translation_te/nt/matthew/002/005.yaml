revisions:
- from: అందుకు వారు ఆయనతో, “యూదయలోని బేత్లెహేములో. ఎందుకంటే ప్రవక్త ద్వారా ఇలా రాయబడి ఉంది:” అన్నారు.
  to: 'వారు ఆయనతో ఇలా అన్నారు: “యూదయలోని బేత్లెహేములో, ఎందుకంటే ప్రవక్త ద్వారా ఇలా రాయబడి ఉంది:”'
  rationale: The revision improves the natural Telugu framing of direct speech and avoids overstating δέ. It retains the continuous answer-and-scriptural-grounding relation, the location’s identifying genitive, the perfect-passive citation formula, and the forward reference to the quotation that continues in the next verse.
  reviewer_model: gpt-5.6-terra
