id: MAT.2.1
reference: Matthew 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: te
  text: హేరోదు రాజు కాలంలో యూదయలోని బేత్లెహేములో యేసు జన్మించిన తరువాత, ఇదిగో, తూర్పు ప్రాంతాల నుండి జ్ఞానులు[a] యెరూషలేముకు వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మాగీలు.’ ఈ గ్రీకు పదం తూర్పు ప్రాంతాలకు చెందిన విద్యావంతులను సూచిస్తుంది; వారు బహుశా జ్యోతిషంతో లేదా రాజదర్బారు పాండిత్యంతో సంబంధం కలవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: యేసు జన్మించిన తరువాత
  rationale: ఈ genitive absolute ప్రధాన క్రియకు ముందుగా జరిగిన నేపథ్య సంఘటనను సూచిస్తుంది. ‘జన్మించిన తరువాత’ ఆ కాలసంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; δέ ఇక్కడ స్వల్ప కథన సంధిగా ఉండటంతో ప్రత్యేక పదంతో అనువదించలేదు.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: యూదయలోని బేత్లెహేము
  rationale: ఈ ప్రయోగం బేత్లెహేమును యూదయ ప్రాంతంలో ఉన్న పట్టణంగా గుర్తిస్తుంది; ‘యూదయలోని’ ఆధునిక తెలుగులో సహజంగా ఉండి, ఇతర బేత్లెహేముల నుండి దీనిని వేరు చేస్తుంది.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: హేరోదు రాజు కాలంలో
  rationale: చారిత్రక కాలాన్ని సూచించే గ్రీకు నుడికారాన్ని స్పష్టమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది; హేరోదు రాజుగా ఉన్న కాలమనే భావాన్ని కాపాడుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: తరువాతి సంఘటనపై పాఠకుని దృష్టిని ఆకర్షించే గుర్తింపబడిన కథన సూచకంగా ‘ఇదిగో’ పనిచేస్తుంది; మూలంలోని ఉద్ఘాటనను సమతలపరచదు.
- source_word: μάγοι
  choice: జ్ఞానులు
  rationale: తూర్పు దేశాలకు చెందిన విద్యావంతులు, జ్యోతిష సంబంధిత లేదా రాజాస్థాన జ్ఞానంతో అనుబంధం గలవారిని సూచించే పదం. ‘జ్ఞానులు’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతుంది; సాంకేతిక ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: ἀπὸ ἀνατολῶν
  choice: తూర్పు ప్రాంతాల నుండి
  rationale: గ్రీకులోని బహువచన రూపం తూర్పున ఉన్న ప్రాంతాలను సూచించగలదు. ‘తూర్పు ప్రాంతాల నుండి’ ఆ విస్తృత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: యెరూషలేముకు వచ్చారు
  rationale: క్రియ ఒక గమ్యస్థానానికి వచ్చి చేరడాన్ని సూచిస్తుంది. తెలుగులో ‘యెరూషలేముకు వచ్చారు’ గమనం మరియు చేరికను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: μάγοι అనే పదాన్ని తరువాతి సంప్రదాయ వివరాలు కలపకుండా అనువదించడం
  choice: జ్ఞానులు
  alternative: మాగీలు
  rationale: మూలపదం వారి సంఖ్యను గానీ, వారు రాజులని గానీ చెప్పదు. ‘జ్ఞానులు’ వారి విద్యావంతమైన పాత్రను తెలియజేస్తూ తరువాత ఏర్పడిన కథన వివరాలను చేర్చదు; ‘మాగీలు’ అనే సాంకేతిక రూపాన్ని పారదర్శకత కోసం పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే కథన గాంభీర్యాన్ని నిలుపుతూ రూపొందించబడింది. మూలంలోని ἰδοὺ ఉద్ఘాటనను ‘ఇదిగో’తో ఉంచాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘జ్ఞానులు’ పదానికే జతచేశాం.
