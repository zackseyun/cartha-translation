id: MAT.2.12
reference: Matthew 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: te
  text: హేరోదు వద్దకు తిరిగి వెళ్లవద్దని కలలో హెచ్చరించబడిన వారు[a], వేరొక మార్గం గుండా[b] తమ దేశానికి వెళ్లిపోయారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దైవికంగా హెచ్చరించబడిన వారు.’ గ్రీకులోని నిష్క్రియ రూపం దైవిక మూలం గల హెచ్చరికను సూచించవచ్చు; అయితే ఈ వచనంలో దేవుడు స్పష్టంగా పేర్కొనబడలేదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వేరొక దారిలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: హెచ్చరిక పొందినందున
  rationale: ఈ దైవిక నిష్క్రియ ప్రయోగం సందర్భంలో దేవుని నుంచి వచ్చిన హెచ్చరికను సూచిస్తుంది; అయితే మూలవాక్యం దేవుణ్ణి కర్తగా స్పష్టంగా పేర్కొననందున ప్రధాన పాఠ్యంలో ఆయన పేరును చేర్చలేదు.
- source_word: κατ’ ὄναρ
  choice: కలలో
  rationale: మత్తయి వాడే ఈ ప్రయోగానికి సహజమైన, స్పష్టమైన ఆధునిక తెలుగు రూపం.
- source_word: μὴ ἀνακάμψαι
  choice: తిరిగి వెళ్లవద్దని
  rationale: μήతో కూడిన అనిశ్చిత క్రియ హెచ్చరికలోని విషయాన్ని తెలియజేస్తుంది; ప్రయాణ సందర్భంలో ఈ రూపం సహజంగా ఉంది.
- source_word: πρὸς Ἡρῴδην
  choice: హేరోదు దగ్గరకు
  rationale: πρός ఇక్కడ ఒక వ్యక్తి వద్దకు వెళ్లడాన్ని సూచిస్తుంది; తెలుగులో ‘దగ్గరకు’ సహజమైన గమ్యప్రయోగం.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: వేరొక మార్గంలో
  rationale: ప్రయాణానికి ఎంచుకున్న భిన్నమైన దారిని సూచిస్తుంది; ‘మార్గంలో’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: ἀνεχώρησαν
  choice: తిరిగి వెళ్లిపోయారు
  rationale: ఇక్కడ వారు అక్కడి నుంచి బయలుదేరి తమ స్వదేశానికి వెళ్లిన భావం ఉంది; తెలుగు కథనంలో ‘వెళ్లిపోయారు’ సహజంగా ఆ నిష్క్రమణను వ్యక్తం చేస్తుంది.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: తమ దేశానికి
  rationale: χώρα ఇక్కడ వారు తిరిగి చేరే స్వదేశాన్ని సూచిస్తుంది; ‘తమ దేశానికి’ సంక్షిప్తంగా, స్పష్టంగా ఉంది.
theological_decisions:
- issue: హెచ్చరికకు సూచితమైన దైవిక మూలం
  choice: ప్రధాన పాఠ్యంలో ‘హెచ్చరిక పొందినందున’ అని నిష్క్రియ రూపాన్ని ఉంచడం
  alternative: ‘దేవుని హెచ్చరిక పొందినందున’ లేదా ‘దైవికంగా హెచ్చరించబడినందున’
  rationale: సందర్భం హెచ్చరిక దేవుని నుంచి వచ్చిందని బలంగా సూచించినా, గ్రీకు వాక్యం దేవుణ్ణి స్పష్టంగా పేర్కొనదు. కాబట్టి సూచనను నిలిపి, స్పష్టీకరణను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథనశైలి. ‘హెచ్చరిక పొందినందున’ మూలంలోని కృదంత సంబంధాన్ని కారణార్థకంగా సహజీకరిస్తుంది; ‘తమ దేశానికి’ స్వదేశ గమ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
