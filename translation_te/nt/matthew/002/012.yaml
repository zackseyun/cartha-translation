revisions:
- from: హేరోదు దగ్గరకు తిరిగి వెళ్లవద్దని కలలో హెచ్చరిక పొందినందున[a], వారు వేరొక మార్గంలో[b] తమ దేశానికి తిరిగి వెళ్లిపోయారు.
  to: హేరోదు వద్దకు తిరిగి వెళ్లవద్దని కలలో హెచ్చరించబడిన వారు[a], వేరొక మార్గం గుండా[b] తమ దేశానికి వెళ్లిపోయారు.
  rationale: The revision keeps every source element while replacing an added causal relationship with a participial clause, preserving the Greek passive and its implied divine agency. It also uses a more idiomatic route expression and avoids making the final departure explicitly a return beyond what the verse states.
