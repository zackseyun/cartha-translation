id: MAT.2.16
reference: Matthew 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: te
  text: అప్పుడు హేరోదు, మాగులు[b] తనను మోసగించారని[a] గ్రహించి, మిక్కిలి కోపపడ్డాడు. అతడు మనుషులను పంపి, బేత్లెహేములోను దాని చుట్టుపక్కల ప్రాంతాలన్నిటిలోను ఉన్న రెండేళ్ల వయసున్న, అంతకంటే చిన్న వయసున్న బాలురందరినీ, మాగుల దగ్గర కచ్చితంగా తెలుసుకున్న కాలాన్ని బట్టి, చంపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, “తనను ఎగతాళి చేశారని.”
    reason: lexical_alternative
  - marker: b
    text: సంప్రదాయంగా, “జ్ఞానులు.” గ్రీకు పదం మాగులు; ఇది తూర్పుదేశపు జ్యోతిష-పండితులను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: తదుపరి సంఘటనను సూచించే సహజమైన కాలసంబంధక పదం.
- source_word: ἰδὼν ὅτι
  choice: గ్రహించి
  rationale: ఇక్కడ భౌతికంగా చూడడం కంటే ఒక విషయం నిజమని హేరోదు తెలుసుకోవడమే భావం; ఆధునిక తెలుగులో ‘గ్రహించి’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἐνεπαίχθη
  choice: తనను మోసగించారని
  rationale: మాగులు తిరిగి రాకపోవడం ద్వారా హేరోదును వెర్రివాడిని చేసిన సందర్భార్థాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది; ‘ఎగతాళి చేశారని’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: μάγων
  choice: మాగులు
  rationale: తూర్పుదేశపు జ్యోతిష-పండితులను సూచించే గ్రీకు సాంస్కృతిక పదాన్ని ప్రతిబింబిస్తుంది; కేవలం ‘జ్ఞానులు’ అని అనువదించడం వల్ల దాని చారిత్రక ప్రత్యేకత తగ్గుతుంది.
- source_word: ἐθυμώθη λίαν
  choice: మిక్కిలి కోపపడ్డాడు
  rationale: కోపం కలగడాన్ని మరియు λίαν ఇచ్చే తీవ్రతను సరళంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: ἀποστείλας ἀνεῖλεν
  choice: మనుషులను పంపి ... చంపించాడు
  rationale: హేరోదు ప్రతినిధులను పంపి వారి ద్వారా హత్య చేయించిన సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, పంపడం మరియు చంపడం అనే రెండు క్రియలనూ నిలుపుతుంది.
- source_word: πάντας τοὺς παῖδας
  choice: బాలురందరినీ
  rationale: ఈ సందర్భంలో లక్ష్యంగా ఉన్న మగపిల్లలను స్పష్టంగా సూచిస్తుంది.
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: బేత్లెహేములోను దాని చుట్టుపక్కల ప్రాంతాలన్నిటిలోను
  rationale: ὅρια ఇక్కడ సరిహద్దు రేఖలకంటే పట్టణ పరిసర ప్రాంతాలను సూచిస్తుంది.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: రెండేళ్ల వయసు, అంతకంటే తక్కువ వయసుగల
  rationale: రెండేళ్ల వయసును కూడా కలుపుకొనే గరిష్ఠ వయోపరిమితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν
  choice: కచ్చితంగా తెలుసుకున్న కాలాన్ని బట్టి
  rationale: కాలాన్ని జాగ్రత్తగా నిర్ధారించుకొని దాని ప్రకారం చర్య తీసుకున్నాడనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: μάγοι పదానికి అనువాదం
  choice: మాగులు
  alternative: జ్ఞానులు
  rationale: ‘మాగులు’ అనేది సందర్శకుల తూర్పుదేశపు జ్యోతిష-పండిత నేపథ్యాన్ని నిలుపుతుంది; తరువాతి సంప్రదాయ చిత్రణలను వచనంలోకి చేర్చదు.
- issue: ἐνεπαίχθη పదానికి అనువాదం
  choice: మోసగించారని
  alternative: ఎగతాళి చేశారని
  rationale: ఈ సందర్భంలో వారు తిరిగి రాకపోవడం వల్ల హేరోదు తాను మోసపోయినట్లు గ్రహించిన భావం ప్రధానంగా ఉంది. గ్రీకు పదంలోని ‘ఎగతాళి’ అనే అక్షరార్థ ఛాయను పాదసూచికలో భద్రపరచాం.
- issue: హేరోదు హత్యలోని కార్యసాధకత్వం
  choice: మనుషులను పంపి ... చంపించాడు
  alternative: పంపి ... చంపాడు
  rationale: ἀποστείλας హేరోదు ప్రతినిధులను పంపినట్లు సూచిస్తుంది; తెలుగు ప్రయోజక రూపం హత్య అతని ఆజ్ఞతో వారి ద్వారా జరిగిందని స్పష్టం చేస్తుంది, అతని బాధ్యతను తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి పాటించబడింది. మూలంలోని సంఘటనల క్రమం, హేరోదు ఆగ్రహ తీవ్రత, ప్రతినిధులను పంపడం, వయోపరిమితి సమగ్రంగా నిలుపబడ్డాయి. పాదసూచిక గుర్తులు సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
