  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: te
  text: వారు ఆ నక్షత్రాన్ని చూసినప్పుడు అత్యంత గొప్ప ఆనందంతో సంతోషించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, ‘వారు అత్యంత గొప్ప ఆనందంతో సంతోషించారు’; ఇది బలమైన ఉద్ఘాటనతో కూడిన ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: చూసినప్పుడు
  rationale: ὁράω యొక్క భూతకాలిక కృదంతం ప్రధాన క్రియకు సందర్భకాలాన్ని సూచిస్తుంది; ‘చూసినప్పుడు’ ఆధునిక తెలుగులో సహజంగా ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానకం మాత్రమే; తెలుగు వాక్యప్రవాహంలో ఉపవాక్య నిర్మాణమే ఆ అనుసంధానాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν ἀστέρα
  choice: ఆ నక్షత్రాన్ని
  rationale: ἀστήρ అంటే ‘నక్షత్రం’; నిర్దిష్ట ఉపపదం, ముందే ప్రస్తావించిన ప్రత్యేక నక్షత్రాన్ని సూచిస్తున్నందున ‘ఆ’ వాడబడింది.
- source_word: ἐχάρησαν
  choice: సంతోషించారు
  rationale: χαίρω యొక్క ఈ రూపం అర్థపరంగా కర్తరి భావంలో ఉంది; ‘సంతోషించారు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉండి క్రియాబలాన్ని నిలుపుతుంది.
- source_word: χαρὰν μεγάλην
  choice: గొప్ప ఆనందంతో
  rationale: సజాతీయ కర్మ నిర్మాణం క్రియను బలపరుస్తుంది; తెలుగులో ‘గొప్ప ఆనందంతో’ సహజమైన సమానార్థక నిర్మాణం.
- source_word: σφόδρα
  choice: పట్టలేనంత
  rationale: σφόδρα మొత్తం ఆనందవ్యక్తీకరణను అత్యంత బలంగా చేస్తుంది; ‘పట్టలేనంత’ ఆ తీవ్రతను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
