translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని χαίρω/χαρά సజాతీయ పునరుక్తిని ‘ఆనందంతో సంతోషించారు’ ద్వారా కొంతవరకు నిలిపి, σφόδρα యొక్క బలాన్ని ‘పట్టలేనంత’తో వ్యక్తం చేసింది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
