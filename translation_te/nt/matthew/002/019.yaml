  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: te
  text: అయితే హేరోదు చనిపోయిన తర్వాత, ఇదిగో, ఐగుప్తులో ఉన్న యోసేపుకు ప్రభువుకు చెందిన ఒక దూత[a] కలలో కనిపిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువు దూత.” గ్రీకులో “దూత”కు నిర్దిష్ట ఉపపదం లేదు. తెలుగులో నిర్దిష్ట/అనిర్దిష్ట ఉపపదాల వ్యవస్థ లేకపోయినా, “ప్రభువు దూత” అనేది సంప్రదాయంగా వినిపించే రూపం.
    reason: గ్రీకు పాఠంలో ἄγγελος అనిర్దిష్టంగా ఉండడాన్ని సూచిస్తూ, తెలుగులో సాధ్యమైన సంప్రదాయ ప్రత్యామ్నాయ ప్రయోగాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: Τελευτήσαντος … τοῦ Ἡρῴδου
  choice: హేరోదు చనిపోయిన తర్వాత
  rationale: కర్తతో కూడిన ఈ aorist genitive absolute కాలసంబంధాన్ని సూచిస్తుంది; ‘చనిపోయిన తర్వాత’ మూలంలోని ముందుగా జరిగిన చర్యను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ఇది కథనంలోని మార్పును, ముందటి సంఘటనతో ఉన్న స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ ఆ సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: పాఠకుని దృష్టిని ఆకర్షించే సజీవమైన కథన సూచకాన్ని గంభీరత కోల్పోకుండా వ్యక్తం చేస్తుంది.
- source_word: ἄγγελος κυρίου
  choice: ప్రభువు దూత ఒకడు
  rationale: ἄγγελος ముందు నిర్దిష్ట ఉపపదం లేదు. తెలుగులో article వ్యవస్థ లేకపోవడం వల్ల ‘ఒకడు’ చేర్చి అనిర్దిష్ట భావాన్ని స్పష్టం చేశాం; κύριοςను సాంప్రదాయబద్ధమైన, సహజమైన ‘ప్రభువు’గా అనువదించాం.
- source_word: φαίνεται
  choice: కనిపిస్తాడు
  rationale: గ్రీకులోని వర్తమానకాల కథన రూపాన్ని నిలుపుతూ సంఘటనకు సజీవతనిచ్చే వర్తమాన రూపాన్ని వాడాం.
- source_word: κατ’ ὄναρ
  choice: కలలో
  rationale: దర్శనం కల ద్వారా కలిగిందని తెలిపే మత్తయి వాడుకకు ఇది సహజమైన తెలుగు సమానార్థకం.
- source_word: τῷ Ἰωσὴφ
  choice: యోసేపుకు
  rationale: దత్తివిభక్తి ఇక్కడ దూత ఎవరికీ కనిపించాడో సూచిస్తుంది; ‘యోసేపు’ స్థిరపడిన తెలుగు బైబిలు నామరూపం.
- source_word: ἐν Αἰγύπτῳ
  choice: ఐగుప్తులో
  rationale: కల వచ్చినప్పుడు యోసేపు ఉన్న స్థలాన్ని తెలిపే సరళమైన స్థానవాచక ప్రయోగం.
theological_decisions:
- issue: ἄγγελος κυρίουలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ దైవసంబంధ సందర్భంలో κύριοςకు ‘ప్రభువు’ సహజమైనదీ, గౌరవార్థకమైనదీ; ‘యజమాని’ ఇక్కడ ఉద్దేశించిన దైవ బిరుదును తగినట్లు తెలియజేయదు.
- issue: ἄγγελος ముందు article లేకపోవడం
  choice: ప్రభువు దూత ఒకడు
  alternative: ప్రభువు దూత
  rationale: గ్రీకు పాఠం ఒక నిర్దిష్ట, ప్రత్యేక దూతనే తప్పనిసరిగా గుర్తించదు. తెలుగులో articles లేనందున ‘ఒకడు’తో ఆ అనిర్దిష్టతను ప్రధాన పాఠంలో నిలిపాం; సంప్రదాయంగా వినిపించే నిర్దిష్ట భావాన్ని పాదటిప్పణిలో పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘ఇదిగో’ మూలంలోని సాహిత్య దృష్టి-ఆకర్షక శక్తిని నిలుపుతుంది; ‘కనిపిస్తాడు’ గ్రీకు historical present యొక్క సజీవతను కాపాడుతుంది.
