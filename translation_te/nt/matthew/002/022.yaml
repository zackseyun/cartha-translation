id: MAT.2.22
reference: Matthew 2:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: te
  text: అయితే, అర్కెలావు తన తండ్రి హేరోదు స్థానంలో యూదయను రాజుగా పాలిస్తున్నాడని విని, అతడు అక్కడికి వెళ్లడానికి భయపడ్డాడు. కలలో హెచ్చరిక పొందిన తరువాత[a], గలిలయ ప్రాంతాలకు వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆదేశం పొందిన తరువాత’; ఈ క్రియ సాధారణంగా దేవుని నుండి వచ్చిన హెచ్చరికను లేదా ఆదేశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: విని
  rationale: ప్రధాన క్రియకు ముందు జరిగిన పరిస్థితిని తెలిపే భూతకాల అసమాపక క్రియ. తెలుగులో ‘విని’ సహజంగా ఉండి దాని కాలసంబంధాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి ఉద్దేశానికి ఎదురైన కొత్త ఆటంకాన్ని సూచించే కథన మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: యూదయను రాజుగా పాలిస్తున్నాడు
  rationale: βασιλεύω లోని రాజరిక భావాన్ని ‘రాజుగా పాలిస్తున్నాడు’ స్పష్టంగా నిలుపుతుంది; షష్ఠీ విభక్తి పాలనకు లోబడిన ప్రాంతాన్ని సూచిస్తుంది.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: తన తండ్రి హేరోదు స్థానంలో
  rationale: ἀντί ఇక్కడ ఒకరి స్థానాన్ని మరొకరు చేపట్టడం లేదా వారసత్వంగా పాలనకు రావడం అనే భావాన్ని ఇస్తుంది; ‘స్థానంలో’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: అతడు అక్కడికి వెళ్లడానికి భయపడ్డాడు
  rationale: భయానికి కారణమైన కార్యాన్ని తెలుగులో సహజమైన క్రియారూపంతో తెలియజేస్తుంది; గ్రీకులో అంతర్లీనంగా ఉన్న కర్తను స్పష్టత కోసం ‘అతడు’గా పేర్కొంది.
- source_word: χρηματισθεὶς
  choice: హెచ్చరిక పొందిన తరువాత
  rationale: దైవిక హెచ్చరిక లేదా ఆదేశాన్ని సూచించగల కర్మణి రూపాన్ని నిలుపుతూ, గ్రీకు వాక్యంలో చెప్పని కర్తను ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: κατ’ ὄναρ
  choice: కలలో
  rationale: నిద్రలో లభించిన ప్రకటనాత్మక హెచ్చరికను సూచించే మత్తయి వాడుకకు ఇది సహజమైన తెలుగు రూపం.
- source_word: ἀνεχώρησεν
  choice: వెళ్లిపోయాడు
  rationale: ప్రమాదం లేదా పరిస్థితి కారణంగా అక్కడి నుండి మరో ప్రాంతానికి వెళ్లిన భావాన్ని సందర్భంలో సహజంగా తెలియజేస్తుంది; అక్షరార్థమైన ‘వెనుదిరిగాడు’ ఇక్కడ గమ్యస్థానంతో అసహజంగా ఉంటుంది.
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: గలిలయ ప్రాంతాలకు
  rationale: μέρη అనే బహువచనాన్ని ‘ప్రాంతాలకు’గా నిలుపుతూ, ఒక నిర్దిష్ట బిందువుకన్నా విస్తృత భూభాగాన్ని సూచిస్తుంది.
theological_decisions:
- issue: χρηματισθείςలో హెచ్చరిక ఇచ్చిన దైవిక కర్తను స్పష్టంగా చేర్చాలా
  choice: ప్రధాన పాఠ్యంలో ‘హెచ్చరిక పొందిన తరువాత’ అని కర్మణి రూపాన్ని ఉంచి, ‘దేవుని చేత’ అని చేర్చలేదు.
  alternative: ‘దేవుని చేత హెచ్చరించబడిన తరువాత’ లేదా ‘దైవిక ఆదేశం పొందిన తరువాత’
  rationale: మత్తయిలో ఈ క్రియ సాధారణంగా దైవిక సమాచారాన్ని సూచించినప్పటికీ, ఈ వాక్యంలో కర్తను గ్రీకు పాఠ్యం ప్రత్యక్షంగా పేర్కొనదు. అందువల్ల అంతర్లీన దైవిక భావాన్ని పాదసూచికలో తెలియజేసి, ప్రధాన పాఠ్యంలో ఉన్న అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘రాజుగా పాలిస్తున్నాడు’ రాజరిక భావాన్ని నిలుపుతుంది; హెచ్చరిక ఇచ్చిన కర్త విషయంలో మూలపాఠ్యంలోని అంతర్లీనతను కాపాడాం.
