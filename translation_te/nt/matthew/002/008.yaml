id: MAT.2.8
reference: Matthew 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: te
  text: 'వారిని బేత్లెహేముకు పంపిన తరువాత ఆయన ఇలా అన్నాడు: “మీరు వెళ్లి ఆ బిడ్డను గురించి జాగ్రత్తగా విచారించండి. ఆయన దొరికినప్పుడు నాకు తెలియజేయండి; నేనూ వచ్చి ఆయనకు నమస్కరించడానికి.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయనను ఆరాధించడానికి” లేదా “ఆయనకు ప్రణామం చేయడానికి.” గ్రీకు క్రియ దేవుని ఆరాధించడాన్ని గానీ, రాజు వంటి వ్యక్తి ఎదుట వంగి గౌరవం చూపడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: పంపిస్తూ
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియతో సన్నిహితంగా ఉన్న చర్యను సూచిస్తుంది. తెలుగులో ‘పంపిస్తూ ఇలా అన్నాడు’ సహజంగా ఉండి, పంపడం మరియు ఆదేశించడం మధ్య సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: Πορευθέντες
  choice: మీరు వెళ్లి
  rationale: ఇది ἐξετάσατεతో కలిసి ఆజ్ఞార్థకంగా పనిచేస్తుంది; ‘మీరు వెళ్లి … విచారించండి’ ఆధునిక తెలుగులో సహజమైన ఆజ్ఞారూపం.
- source_word: ἐξετάσατε ἀκριβῶς
  choice: జాగ్రత్తగా విచారించండి
  rationale: ఈ క్రియా-క్రియావిశేషణ సముచ్చయం కచ్చితమైన, శ్రద్ధగల విచారణను సూచిస్తుంది. ‘వెదకండి’ కంటే ‘విచారించండి’ సమాచారం సేకరించి ఆచూకీ కనుగొనే భావాన్ని బాగా నిలుపుతుంది.
- source_word: περὶ τοῦ παιδίου
  choice: ఆ బిడ్డ గురించి
  rationale: περί యొక్క ‘గురించి/సంబంధించి’ అనే భావాన్ని నేరుగా నిలుపుతూ, విచారణ యొక్క విషయాన్ని సహజంగా తెలుపుతుంది.
- source_word: παιδίου
  choice: బిడ్డ
  rationale: παιδίον చిన్నవయస్కుడైన బిడ్డను సూచిస్తుంది; కథన సందర్భంలో ‘బిడ్డ’ సహజమైన, సులభమైన తెలుగు పదం.
- source_word: ἐπὰν δὲ εὕρητε
  choice: ఆయన దొరికినప్పుడు
  rationale: ἐπάν అనిశ్చితమైన భవిష్యత్ సందర్భాన్ని సూచించినా, ఈ ఆదేశంలో ‘దొరికినప్పుడు’ సహజంగా ఉంది; అది కనుగొనడం ఇప్పటికే జరిగిపోయిందని చెప్పదు.
- source_word: ἀπαγγείλατέ μοι
  choice: నాకు తెలియజేయండి
  rationale: తిరిగి సమాచారం అందించాలనే ἀπαγγέλλω భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὅπως
  choice: అప్పుడు
  rationale: తెలుగు వాక్యనిర్మాణంలో ముందున్న షరతుకు అనుసంధానించి, హేరోదు ప్రకటించిన ఉద్దేశాన్ని సహజంగా పరిచయం చేస్తుంది; తరువాతి క్రియలో ఉద్దేశ భావం సందర్భం ద్వారా నిలుస్తుంది.
- source_word: κἀγὼ
  choice: నేను కూడా
  rationale: హేరోదు జ్ఞానుల ఉద్దేశంలో తానూ భాగమని నటిస్తున్న భావాన్ని κἀγώలోని ‘కూడా’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: వచ్చి ఆయనకు సాష్టాంగపడతాను
  rationale: కృదంతం మరియు ప్రధాన క్రియను తెలుగులో సహజమైన వరుస చర్యలుగా అందిస్తుంది. ‘సాష్టాంగపడటం’ రాజసంబంధ గౌరవం లేదా ఆరాధన రెండింటికీ వీలున్న శరీరభంగిమను సూచించి, మూలపదంలోని అర్థవిస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: బాలుడైన యేసుకు సంబంధించి προσκυνήσω αὐτῷ అనువాదం
  choice: ఆయనకు సాష్టాంగపడతాను
  alternative: ఆయనను ఆరాధిస్తాను; ఆయనకు ప్రణామం చేస్తాను
  rationale: προσκυνέω దేవుని ఆరాధించడాన్నీ, రాజు వంటి ఉన్నత వ్యక్తి ఎదుట వంగి గౌరవం చూపడాన్నీ సూచించగలదు. హేరోదు మాటలు మోసపూరితమైనవి; ఈ వాక్యంలో పదానికి ఏ భావం ప్రధానమో అనువాదంలోనే ఖరారు చేయకుండా ‘సాష్టాంగపడతాను’ అనే విస్తృతార్థక రూపాన్ని ఎంచుకుని, ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవభరితమైన కథనశైలి. బాలుడిని సూచించే సర్వనామాల్లో ‘ఆయన’ వాడి తెలుగు క్రైస్తవ పఠన సంప్రదాయానికి అనుగుణమైన గౌరవాన్ని ఉంచాం; మూల గ్రీకులోని వ్యాకరణ లింగం దీనిని బలవంతం చేయదు.
