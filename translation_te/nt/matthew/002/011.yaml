- from: వారు ఆ ఇంటిలోకి వచ్చి, తన తల్లి మరియతో ఉన్న బాలుణ్ణి చూశారు. అప్పుడు వారు నేలపై పడి ఆయనకు ప్రణామం చేశారు[a]. తరువాత తమ నిధులను తెరిచి, బంగారం, సాంబ్రాణి, బోళం అనే కానుకలను ఆయనకు అర్పించారు.
