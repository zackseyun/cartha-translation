id: MAT.2.11
reference: Matthew 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: te
  text: వారు ఆ ఇంటిలోకి వచ్చి, తల్లి మరియతో ఉన్న బిడ్డను చూశారు. వారు నేలపై పడి ఆయనకు నమస్కరించారు[a]. తరువాత తమ నిధులను తెరిచి, బంగారం, సాంబ్రాణి, బోళం అనే కానుకలను ఆయనకు అర్పించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను ఆరాధించారు.’ గ్రీకు క్రియ సందర్భానుసారం ఆరాధనను లేదా భక్తిపూర్వకమైన ప్రణామాన్ని సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίαν
  choice: ఇల్లు
  rationale: οἰκία ఒక నివాస గృహాన్ని సూచిస్తుంది. ‘ఇల్లు’ ఇక్కడి నిర్దిష్ట స్థలాన్ని సహజంగా, అదనపు భావాన్ని చేర్చకుండా తెలియజేస్తుంది.
- source_word: παιδίον
  choice: బాలుడు
  rationale: παιδίον చిన్న పిల్లవాణ్ణి సూచిస్తుంది. సందర్భంలో పురుష శిశువే అయినప్పటికీ వయస్సును అతిగా నిర్దిష్టం చేయకుండా ‘బాలుడు’ సహజంగా ఉంటుంది.
- source_word: πεσόντες
  choice: నేలపై పడి
  rationale: ఈ భూతకాల కృదంతం ప్రధాన క్రియకు ముందు జరిగిన శారీరక చర్యను చిత్రిస్తుంది. ‘నేలపై పడి’ ఆ భంగిమను స్పష్టంగా ఉంచుతుంది.
- source_word: προσεκύνησαν
  choice: ప్రణామం చేశారు
  rationale: προσκυνέω సందర్భానుసారం ఆరాధనను లేదా అత్యంత భక్తిపూర్వక గౌరవప్రదర్శనను సూచించగలదు. ‘ప్రణామం చేశారు’ రాజోచిత గౌరవం మరియు ఆరాధన మధ్యనున్న భావవిస్తృతిని ప్రధాన పాఠంలో పూర్తిగా కుదించదు.
- source_word: θησαυρούς
  choice: నిధులు
  rationale: θησαυρός నిధిని లేదా నిధి ఉంచే భాండాగారాన్ని సూచించగలదు. ‘నిధులు’ మూలంలోని విస్తృతిని నిలుపుతుంది; ‘నిధిపెట్టెలు’ అని చెప్పడం మూలం కంటే మరింత నిర్దిష్టం అవుతుంది.
- source_word: προσήνεγκαν ... δῶρα
  choice: కానుకలను ... అర్పించారు
  rationale: προσφέρω ఇక్కడ సమర్పించడం లేదా అందించడం అనే భావంలో, δῶρα కానుకలను సూచిస్తుంది. ‘కానుకలను అర్పించారు’ ఈ గంభీరమైన కానుక సమర్పణను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λίβανον
  choice: సాంబ్రాణి
  rationale: λίβανος ఇక్కడ సుగంధభరితమైన frankincense గుగ్గిలాన్ని సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు ‘సాంబ్రాణి’ సహజంగా అర్థమయ్యే సమీప పదం.
- source_word: σμύρναν
  choice: బోళం
  rationale: σμύρνα myrrh అనే సుగంధ జిగురును సూచిస్తుంది. ‘బోళం’ దానికి ప్రాచుర్యంలో ఉన్న తెలుగు బైబిలు పదం.
theological_decisions:
- issue: బాలుడైన యేసు పట్ల προσκυνέω క్రియ యొక్క భావం
  choice: ప్రణామం చేశారు
  alternative: ఆయనను ఆరాధించారు
  rationale: ఈ క్రియ రాజుకు చేసే భక్తిపూర్వక ప్రణామాన్ని గానీ, దేవునికి చేసే ఆరాధనను గానీ సందర్భానుసారం సూచించగలదు. తక్షణ కథన సందర్భం రాజశిశువుకు అర్పించిన అత్యున్నత గౌరవాన్ని చూపుతుంది; యేసును ఆరాధించడం అనే బలమైన భావమూ సాధ్యమే. అందువల్ల ప్రధాన పాఠం ఈ ఉద్రిక్తతను నిలుపుతూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలోని వరుస చర్యలను తెలుగులో సహజంగా వినిపించేందుకు వాక్యాలుగా విభజించాం. పాదసూచిక గుర్తును సంబంధిత προσκυνέω అనువాదం తరువాత ఉంచాం.
