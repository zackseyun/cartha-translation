  text: τότε ἐπληρώθη τὸ ῥηθὲν ⸀διὰ Ἰερεμίου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/017.yaml
  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: te
  text: 'అప్పుడు యిర్మీయా ప్రవక్త ద్వారా చెప్పబడినది నెరవేరింది; ఆయన ఇలా చెప్పాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: మత్తయి కథనంలోని సంఘటనల క్రమాన్ని సహజంగా సూచించే కాలవాచక క్రియావిశేషణం.
- source_word: ἐπληρώθη
  choice: నెరవేరింది
  rationale: πληρόω యొక్క భూతకాల కర్మణి రూపాన్ని, మత్తయి ఉపయోగించే ప్రవచన-నెరవేర్పు భావాన్ని విస్తరించకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: τὸ ῥηθὲν
  choice: చెప్పబడిన మాట
  rationale: నామవాచకంగా పనిచేసే కర్మణి అసమాపక క్రియారూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διὰ Ἰερεμίου
  choice: యిర్మీయా ... ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సూచించే మధ్యవర్తిత్వాన్ని నిలుపుతూ, ప్రవచన వాక్యం యిర్మీయా ద్వారా పలకబడిందని తెలియజేస్తుంది.
- source_word: τοῦ προφήτου
  choice: ప్రవక్త
  rationale: యిర్మీయా పాత్రను తెలిపే అన్వయపదాన్ని సంక్షిప్తంగా, సహజంగా అనువదిస్తుంది.
- source_word: λέγοντος
  choice: ఇలా
  rationale: తరువాతి వచనంలో వచ్చే ప్రత్యక్ష ఉద్ధరణకు ముందుమాటగా పనిచేసే అసమాపక క్రియ భావాన్ని తెలుగులో సహజంగా సూచిస్తుంది; ‘ఇలా చెప్పబడిన’ అనే నిర్మాణం దాని ముందుచూపు సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: మత్తయి ఉపయోగించే ప్రవచన నెరవేర్పు సూత్రవాక్యం
  choice: ‘నెరవేరింది’ అనే స్పష్టమైన నెరవేర్పు భాషను ఉంచడం
  alternative: ‘జరిగింది’ లేదా ‘నెరవేర్చడానికి జరిగింది’
  rationale: ఈ సంఘటనను ప్రవక్త ద్వారా పలికిన వాక్యపు నెరవేర్పుగా మత్తయి ఉద్దేశపూర్వకంగా చిత్రిస్తున్నాడు. మూలంలోని వాదనను తగ్గించకుండా, దానికి లేని ఉద్దేశార్థాన్ని కూడా చేర్చకుండా అనువాదం దాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా ప్రవచన ఉద్ధరణకు తగిన గౌరవప్రదమైన శైలిలో ఉంది. తరువాతి వచనంలోని ఉద్ధరణను పరిచయం చేయడానికి చివర ద్విబిందువు ఉంచబడింది.
