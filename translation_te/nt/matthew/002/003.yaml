id: MAT.2.3
reference: Matthew 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: te
  text: హేరోదు రాజు ఇది విని కలవరపడ్డాడు[a]; అతనితోపాటు యెరూషలేమంతా[b] కలవరపడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కలత చెందాడు.’
    reason: lexical_alternative
  - marker: b
    text: ‘యెరూషలేమంతా’ అనే మాటలో నగరపేరు అక్కడి నివాసులను సూచిస్తుంది; నగరంలో వ్యాపించిన కలవరాన్ని సాధారణీకరించి లేదా అతిశయోక్తిగా చెప్పి ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: ఇది విని
  rationale: ఆఓరిస్ట్ కృదంతం ఇక్కడ కాలసంబంధ భావాన్ని ఇస్తుంది. సమీప సందర్భంలోని జ్ఞానుల సమాచారం దీనికి సూచిత కర్మ కాబట్టి, సహజమైన తెలుగులో ‘ఇది విని’ అని వ్యక్తం చేయబడింది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ స్వల్పమైన సంధానాన్ని లేదా కథన మార్పును సూచిస్తుంది. తెలుగులో కృదంత నిర్మాణమైన ‘విని’ ఆ అనుసంధానాన్ని సహజంగానే తెలియజేస్తుంది.
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: హేరోదు రాజు
  rationale: తెలుగు వాక్యరీతికి సహజంగా ఉండేలా పేరుకు తరువాత బిరుదును ఉంచుతూ, βασιλεύς యొక్క భావాన్ని నిలిపింది.
- source_word: ἐταράχθη
  choice: కలవరపడ్డాడు … కలవరపడింది
  rationale: ταράσσω ఇక్కడ అంతరంగ కలత లేదా భయాందోళనను సూచిస్తుంది. ‘కలవరపడు’ భావతీవ్రతను అతిగా నిర్దిష్టం చేయకుండా సహజంగా వ్యక్తం చేస్తుంది. గ్రీకులో ఒకే క్రియ రెండు కర్తలకు వర్తించినా, తెలుగు లింగవచన అన్వయానికి క్రియను రెండుసార్లు వ్యక్తం చేయడం స్పష్టంగా ఉంటుంది.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: యెరూషలేమంతా
  rationale: నగరపేరు దాని నివాసులను సమష్టిగా సూచించే గ్రీకు అలంకార ప్రయోగాన్ని నిలిపి, ‘ప్రజలు’ అని మూలంలో లేని పదాన్ని ప్రధాన వచనంలో చేర్చలేదు.
- source_word: μετ’ αὐτοῦ
  choice: అతనితోపాటు
  rationale: హేరోదు కలవరానికి యెరూషలేము కలవరాన్ని అనుసంధానించే μετά యొక్క సహచర్య భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: πᾶσα Ἱεροσόλυμα యొక్క పరిధి
  choice: నగరాన్ని దాని నివాసులకు సమష్టి సూచనగా ఉంచడం
  alternative: యెరూషలేములోని అనేకులు; లేదా ముఖ్యంగా నగర నాయకత్వ వర్గాలు
  rationale: గ్రీకు వచనం నగరమంతటినీ పేరుపెట్టి మాట్లాడుతుంది. దాన్ని నాయకులకు మాత్రమే పరిమితం చేయకుండా, ప్రతి వ్యక్తినీ తప్పనిసరిగా సూచిస్తుందని కూడా నిర్ణయించకుండా, మూలంలోని సాధారణీకరణ లేదా అతిశయోక్తి అవకాశాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘యెరూషలేమంతా’ అనే సంక్షిప్త రూపం మూలంలోని నగర-నివాసుల రూపక ప్రయోగాన్ని నిలుపుతుంది; రెండు కర్తల లింగవచన భేదం వల్ల క్రియను తెలుగులో పునరుక్తం చేసి స్పష్టత కల్పించబడింది.
