id: MAT.7.21
reference: Matthew 7:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: te
  text: “ప్రభువా, ప్రభువా” అని నాతో చెప్పే ప్రతి ఒక్కరూ పరలోక రాజ్యంలో[a] ప్రవేశిస్తారని కాదు; కానీ పరలోకంలో[b] ఉన్న నా తండ్రి చిత్తాన్ని చేసేవాడే ప్రవేశిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఆకాశాల రాజ్యంలో.” మత్తయి ఈ ప్రయోగాన్ని తరచుగా ఉపయోగిస్తాడు; ఇతర సందర్భాల్లో దీనికి సమానంగా “దేవుని రాజ్యం” అనే ప్రయోగం కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “ఆకాశాలలో” అని బహువచనంలో ఉంది; తెలుగులో సహజంగా “పరలోకంలో” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: నాతో చెప్పేవారందరూ ... ప్రవేశించరు
  rationale: Οὐ πᾶς అనే పాక్షిక నిరాకరణను ‘అందరూ ... ప్రవేశించరు’ అని సహజమైన తెలుగులో వ్యక్తం చేసింది; ఇది ‘ఎవరూ ప్రవేశించరు’ అనే సంపూర్ణ నిరాకరణ కాదు. వర్తమాన కృదంతం సాధారణంగా అలా చెప్పేవారిని సూచిస్తుంది.
- source_word: Κύριε κύριε
  choice: ప్రభువా, ప్రభువా
  rationale: κύριοςకు స్థిరమైన, గౌరవప్రదమైన తెలుగు సమానార్థకంగా ‘ప్రభువు’ను తీసుకొని, బలమైన సంబోధనను చూపే పునరుక్తిని యథాతథంగా ఉంచింది.
- source_word: εἰσελεύσεται
  choice: ప్రవేశించరు / ప్రవేశిస్తాడు
  rationale: భవిష్యత్ క్రియను సహజంగా ‘ప్రవేశించు’తో అనువదించింది. గ్రీకులో రెండో భాగంలో క్రియ అధ్యాహారంగా ఉన్నా, తెలుగులో విరుద్ధతను స్పష్టంగా, సహజంగా చేయడానికి దానిని మళ్లీ వ్యక్తం చేసింది.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: పరలోక రాజ్యంలో
  rationale: మత్తయి వాడే τῶν οὐρανῶν అనే బహువచన నుడికారానికి ఆధునిక తెలుగులో సహజమైన ‘పరలోక’ను, βασιλείαకు ‘రాజ్యం’ను ఉపయోగించింది; మూలంలోని బహువచన రూపాన్ని పాదసూచికలో తెలిపింది.
- source_word: ἀλλ’ ὁ ποιῶν
  choice: నెరవేర్చేవాడే
  rationale: ఆర్టికల్‌తో ఉన్న వర్తమాన కృదంతపు ఏకవచన విరుద్ధతను ‘వాడే’ ద్వారా నిలిపింది. ‘ఏ’ నొక్కిచెప్పే భావం మాటలు చెప్పేవారికి, తండ్రి చిత్తం చేసేవానికి మధ్య ఉన్న వ్యత్యాసాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: నా తండ్రి చిత్తాన్ని
  rationale: θέλημαను ఈ నైతిక-దైవశాస్త్రీయ సందర్భంలో ‘చిత్తం’గా అనువదించడం ద్వారా తండ్రి సంకల్పం లేదా ఆదేశం అనే భావాన్ని సిద్ధాంతపరంగా విస్తరించకుండా నిలిపింది.
- source_word: τοῦ ἐν τοῖς οὐρανοῖς
  choice: పరలోకంలో ఉన్న
  rationale: ఈ విశేషణాత్మక పదబంధం ‘నా తండ్రి’ని సవరిస్తుంది. గ్రీకు బహువచనాన్ని తెలుగులో సహజమైన ఏకవచన నుడికారంగా ఇచ్చి, రూపభేదాన్ని పాదసూచికలో పేర్కొంది.
theological_decisions:
- issue: ప్రభువా అని నోటితో పిలవడం, తండ్రి చిత్తం చేయడం, రాజ్యంలో ప్రవేశించడం మధ్య సంబంధం
  choice: ఈ వాక్యంలో ఉన్నట్లుగానే కేవలం సంబోధించడాన్ని తండ్రి చిత్తాన్ని ఆచరించడంతో విరుద్ధంగా ఉంచడం
  alternative: దీనిని క్రియల మూలంగా నీతిమంతులవడం అనే పూర్తి సిద్ధాంతంగా చేయడం, లేదా నోటితో ఒప్పుకోవడమే సరిపోతుందని అర్థం చేయడం
  rationale: గ్రీకు పాఠం చెప్పడానికి, చేయడానికి మధ్య స్పష్టమైన వ్యత్యాసం చూపుతుంది; అయితే రక్షణకు సంబంధించిన సమగ్ర సిద్ధాంత వ్యవస్థను ఈ ఒక్క వాక్యంలో వివరించదు. అందువల్ల హెచ్చరికను, దైవశాస్త్రీయ ఉద్రిక్తతను అలాగే ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘ప్రభువా’ మరియు ‘చిత్తం’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచినా, వాక్య నిర్మాణాన్ని సహజంగా చేసింది. సెమికోలన్‌కు బదులుగా రెండు వాక్యాలు వాడటం వల్ల హెచ్చరికలోని విరుద్ధత స్పష్టంగా వినిపిస్తుంది.
