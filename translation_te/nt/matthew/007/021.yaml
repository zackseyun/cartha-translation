review_pass:
  verdict: revise
  source_fidelity: The core contrast and future outcome are conveyed, and the supplied second-clause verb appropriately makes explicit what Greek leaves understood. However, ‘చెప్పేవారందరూ ... ప్రవేశించరు’ can naturally be heard as a total negation (‘none will enter’), whereas Οὐ πᾶς requires ‘not everyone.’ The revision makes the partial negation unambiguous.
  naturalness: The revised wording is fluent modern standard Telugu. ‘ప్రవేశిస్తారని కాదు’ is a natural and clear way to express ‘not everyone will enter,’ while retaining the formal biblical register.
  terminology: ‘ప్రభువా,’ ‘పరలోక రాజ్యం,’ ‘చిత్తం,’ and ‘ప్రవేశిస్తాడు’ are appropriate, established Telugu renderings. ‘చిత్తాన్ని చేసేవాడే’ directly reflects ποιῶν τὸ θέλημα without adding theological interpretation.
  issues:
  - severity: medium
    issue: The first clause can be read as complete rather than partial negation.
    rationale: In Telugu, ‘...వారందరూ ... ప్రవేశించరు’ may imply that no member of the group enters. Greek Οὐ πᾶς means ‘not everyone,’ so the translation should explicitly deny universality rather than state a potentially universal negative.
  revised_text: “ప్రభువా, ప్రభువా” అని నాతో చెప్పే ప్రతి ఒక్కరూ పరలోక రాజ్యంలో[a] ప్రవేశిస్తారని కాదు; కానీ పరలోకంలో[b] ఉన్న నా తండ్రి చిత్తాన్ని చేసేవాడే ప్రవేశిస్తాడు.
