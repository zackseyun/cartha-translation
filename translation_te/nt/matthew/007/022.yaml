id: MAT.7.22
reference: Matthew 7:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: te
  text: ఆ రోజున చాలామంది నాతో, ‘ప్రభువా, ప్రభువా, మేము నీ నామంలో ప్రవచించలేదా? నీ నామంలో దయ్యాలను వెళ్లగొట్టలేదా? నీ నామంలో ఎన్నో అద్భుత కార్యాలు[a] చేయలేదా?’ అని చెబుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎన్నో అద్భుతాలు చేశాము’; ఇంకా అక్షరార్థంగా, ‘ఎన్నో శక్తి కార్యాలు చేశాము.’ ఇక్కడి గ్రీకు పదం అక్షరార్థంగా ‘శక్తులు’ అని సూచిస్తుంది; సువార్తల్లో అది తరచుగా అద్భుత కార్యాలకు వాడబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: ఈ విశేషణం ఇక్కడ నామవాచకంగా వాడబడింది. ‘చాలామంది’ అనేది అదనంగా ‘ప్రజలు’ అని చేర్చకుండా సహజమైన తెలుగు అర్థాన్ని ఇస్తుంది.
- source_word: ἐροῦσίν μοι
  choice: నాతో ... అని అంటారు
  rationale: భవిష్యత్ కాలంలోని λέγωతో దత్తివిభక్తి సర్వనామం ఉంది. తెలుగులో ప్రత్యక్ష వాక్యంతో ‘నాతో ... అని అంటారు’ సహజమైన, ప్రత్యక్షమైన రూపం.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ఆ రోజున
  rationale: ఇది సహజమైన తెలుగు కాలసూచక ప్రయోగం. సందర్భంలోని అంత్యకాల భావాన్ని నిలుపుతూ, మూలంలో లేని ‘తీర్పు దినం’ అనే వివరణను ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: Κύριε κύριε
  choice: ప్రభువా, ప్రభువా
  rationale: సంబోధన పునరుక్తి విజ్ఞాపనలోని తీవ్రతను నిలుపుతుంది. κύριοςకు ‘ప్రభువు’ సాధారణమైనదీ, క్రీస్తు సంబంధిత బరువును కోల్పోనిదీ అయిన అనువాదం.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: మేము ... ప్రవచించలేదా?
  rationale: οὐతో ఉన్న ప్రశ్న సమ్మతిసూచక జవాబును ఆశిస్తుంది. ‘ప్రవచించు’ προφητεύωకు స్థిరమైన, స్పష్టమైన తెలుగు సమానం.
- source_word: τῷ σῷ ὀνόματι
  choice: నీ నామంలో
  rationale: ఒకరి నామాధికారంలో లేదా ఆ నామాన్ని ఆశ్రయించి చేయడాన్ని సూచించే సహజమైన గౌరవప్రద ప్రయోగం. గ్రీకులో మూడుసార్లు ఉన్న పునరుక్తిని తెలుగులోనూ నిలిపాం.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: దయ్యాలను వెళ్లగొట్టలేదా?
  rationale: ἐκβάλλω ఇక్కడ దయ్యాలను బయటికి పంపడాన్ని సూచిస్తుంది. ‘వెళ్లగొట్టు’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: ఎన్నో అద్భుత కార్యాలు చేయలేదా?
  rationale: సువార్తల సందర్భంలో δύναμις శక్తి వ్యక్తమయ్యే అద్భుత కార్యాన్ని సూచించగలదు. ‘అద్భుత కార్యాలు’ సాధారణ పాఠకులకు సహజంగా అర్థమవుతుంది; ‘చేశాము’ ἐποιήσαμενను నేరుగా ప్రతిబింబిస్తుంది. ‘శక్తి కార్యాలు’ అనే మరింత అక్షరార్థ రూపాన్ని పాదటిప్పణి సూచిస్తుంది.
theological_decisions:
- issue: యేసును నేరుగా సంబోధించేటప్పుడు κύριος అనువాదం
  choice: ప్రభువా
  alternative: బోధకుడా / యజమానీ
  rationale: ‘ప్రభువా’ అనే అనువాదం పదంలోని సాధారణ అధికార భావాన్నీ, క్రీస్తు సంబంధిత ప్రాధాన్యాన్నీ నిలుపుతుంది; పాఠ్యం చెప్పినదానికంటే ఎక్కువ సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: ‘ఆ రోజు’ అనే మాటలోని అంత్యకాల భావం
  choice: ఆ రోజున
  alternative: తీర్పు రోజున
  rationale: సందర్భం తుదితీర్పును సూచించినప్పటికీ, గ్రీకు పాఠ్యం ‘ఆ రోజు’ అని మాత్రమే చెబుతుంది. అందువల్ల సూచిత భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టీకరించి ఉద్రిక్తతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజతతో కూడిన గౌరవప్రద శైలిని ఉపయోగించాం. ‘నీ నామంలో’ అనే మూడు పునరుక్తులను మూలంలోని వాక్చాతుర్య బలం కోసం నిలిపాం. పాదటిప్పణి గుర్తు అది వివరిస్తున్న ‘అద్భుత కార్యాలు’ దగ్గరే ఉంచాం.
