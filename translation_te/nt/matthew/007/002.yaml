review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the explanatory γάρ, the two parallel ἐν ᾧ constructions, the judgment/measure wordplay, and the agent-unspecified future passives. The correlatives ‘ఏ ... అదే’ properly convey the reciprocal correspondence without naming the judge or measurer.
  naturalness: ‘మీకు కొలవబడుతుంది’ is formally understandable but is incomplete and awkward in modern Telugu, since Telugu normally expresses measuring something out to a recipient as ‘కొలిచి ఇవ్వబడుతుంది.’ The revision retains the Greek passive and unspecified agent while using idiomatic Telugu.
  terminology: ‘తీర్పు’ and ‘కొలత’ are suitable modern-standard terms. ‘తీర్పు తీరుస్తారు / తీర్పు తీర్చబడుతుంది’ is a conventional judicial collocation and preserves the deliberate repetition sufficiently well. The footnote correctly distinguishes the implied reciprocal sense from an explicit Greek word for ‘back.’
  issues:
  - severity: low
    issue: The final passive expression ‘మీకు కొలవబడుతుంది’ is not idiomatic enough in modern Telugu.
    rationale: The Greek leaves the thing measured implicit, but Telugu naturally supplies the distributive idiom ‘కొలిచి ఇవ్వబడుతుంది’ when a measure is applied to a recipient. This does not identify the agent or add ‘back’ to the main text.
  revised_text: ఎందుకంటే, మీరు ఏ తీర్పుతో తీర్పు తీరుస్తారో, అదే తీర్పుతో మీకు తీర్పు తీర్చబడుతుంది; మీరు ఏ కొలతతో కొలుస్తారో, అదే కొలతతో మీకు కొలిచి ఇవ్వబడుతుంది.[a]
