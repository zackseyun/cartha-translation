id: MAT.7.2
reference: Matthew 7:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: te
  text: ఎందుకంటే, మీరు ఏ తీర్పుతో తీర్పు తీరుస్తారో, అదే తీర్పుతో మీకు తీర్పు తీర్చబడుతుంది; మీరు ఏ కొలతతో కొలుస్తారో, అదే కొలతతో మీకు కొలిచి ఇవ్వబడుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అదే కొలతతో మీకు తిరిగి కొలిచి ఇవ్వబడుతుంది.” పరస్పర ప్రతిఫల భావం సూచితమైనప్పటికీ, “తిరిగి” అనే పదం గ్రీకు పాఠ్యంలో స్పష్టంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι / κρίνετε / κριθήσεσθε
  choice: తీర్పుతో / తీర్పు తీరుస్తారో / తీర్పు తీర్చబడుతుంది
  rationale: గ్రీకులోని నామవాచకం–క్రియ పదబంధ సంబంధాన్ని, పరస్పరతను తెలుగులో ఒకే పదమూలంతో నిలిపి ఉంచుతుంది. ‘ఖండించడం’ అని అనువదిస్తే మూలంలోని విస్తృతమైన ‘తీర్పు చేయడం’ భావం అనవసరంగా సంకుచితమవుతుంది.
- source_word: μέτρῳ / μετρεῖτε / μετρηθήσεται
  choice: కొలతతో / కొలుస్తారో / కొలవబడుతుంది
  rationale: మూలంలోని నామవాచకం–క్రియ పదప్రయోగాన్ని, సామెతలాంటి సమాంతర నిర్మాణాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: ఏ ... తో ... అదే ... తో
  rationale: ఈ దత్తివిభక్తి నిర్మాణం సాధనం లేదా ప్రమాణాన్ని సూచిస్తుంది. ‘ఏ…తో… అదే…తో’ అనే నిర్మాణం దాని ప్రమాణార్థాన్నీ రెండు వాక్యభాగాల సమాంతరతనూ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: మునుపటి వచనంలోని ఆజ్ఞకు ఈ మాట కారణం లేదా వివరణగా ఉందని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μετρηθήσεται ὑμῖν
  choice: మీకు కొలవబడుతుంది
  rationale: కర్తను పేర్కొనని గ్రీకు కర్మణి ప్రయోగాన్నీ ὑμῖν యొక్క ‘మీకు’ భావాన్నీ నిలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘తిరిగి’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: పరస్పర తీర్పును అమలు చేసే కర్త ఎవరు?
  choice: కర్మణి ప్రయోగంతో కర్తను పేర్కొనకుండా ఉంచడం
  alternative: ‘దేవుడు అదే తీర్పుతో మీకు తీర్పు తీరుస్తాడు’ లేదా ‘ఇతరులు అలాగే మీకు తీర్పు తీరుస్తారు’
  rationale: κριθήσεσθε, μετρηθήσεται అనే కర్మణి రూపాలు తీర్పు తీర్చే లేదా కొలిచే కర్తను స్పష్టంగా పేర్కొనవు. కాబట్టి ఇది దేవుని తీర్పా, మానవ పరస్పర ప్రతిస్పందనా అనే వ్యాఖ్యాన అవకాశాన్ని అనువాదం ముందుగానే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘తీర్పు’ మరియు ‘కొలత’ పదమూలాల పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి, వాక్యంలోని సామెతసదృశ సమాంతరతను కాపాడాం.
