- from: ఎందుకంటే, మీరు ఏ తీర్పుతో తీర్పు తీరుస్తారో, అదే తీర్పుతో మీకు తీర్పు తీర్చబడుతుంది; మీరు ఏ కొలతతో కొలుస్తారో, అదే కొలతతో మీకు కొలవబడుతుంది.[a]
  to: ఎందుకంటే, మీరు ఏ తీర్పుతో తీర్పు తీరుస్తారో, అదే తీర్పుతో మీకు తీర్పు తీర్చబడుతుంది; మీరు ఏ కొలతతో కొలుస్తారో, అదే కొలతతో మీకు కొలిచి ఇవ్వబడుతుంది.[a]
  rationale: Only the second passive clause has been adjusted for idiomatic modern Telugu. ‘కొలిచి ఇవ్వబడుతుంది’ conveys that the measure is applied or dealt out to the hearers, while retaining an unstated agent and leaving ‘తిరిగి’ outside the main text. All parallelism, lexical emphasis, and interpretive openness are retained.
