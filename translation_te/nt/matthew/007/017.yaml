    text: ‘అలాగే’ అనే మాటను ‘ఈ విధంగా’ లేదా ‘కాబట్టి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కుళ్లిన’ అని అనువదించిన గ్రీకు పదానికి ‘చెడిపోయిన,’ ‘పనికిరాని,’ లేదా ‘చెడ్డ’ అనే అర్థాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
  - marker: c
    text: ‘చెడ్డ పండ్లు’ అనే మాటను ‘హానికరమైన పండ్లు’ లేదా నైతిక భావాన్ని ముందుకు తెస్తూ ‘దుష్టమైన పండ్లు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: అలాగే
  rationale: ముందున్న ఉపమానంతో ఈ సాధారణ సత్యాన్ని అనుసంధానించే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘ఈ విధంగా’ అనే భావమూ దీనిలో ఉంది.
- source_word: πᾶν δένδρον
  choice: ప్రతి ... చెట్టు
  rationale: ఏకవచన నామవాచకంతో ఉన్న πᾶν యొక్క పంపిణీ భావాన్ని, అంటే ఒక్కో చెట్టుకూ వర్తించే సామెతసదృశమైన సాధారణీకరణను, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀγαθὸν
  choice: మంచి
  rationale: చెట్టు యొక్క సానుకూల గుణాన్ని విస్తృతంగా సూచిస్తుంది; వ్యవసాయ ఉపమానాన్ని అలాగే ఉంచి, దాని నైతిక అన్వయాన్ని సందర్భానికే వదిలేస్తుంది.
- source_word: καρποὺς καλοὺς
  choice: మంచి పండ్లు
  rationale: καλός ఇక్కడ నాణ్యతలో మంచివైన పండ్లను సూచిస్తుంది. ‘మంచి పండ్లు’ సహజమైన తెలుగు, అలాగే ἀγαθός–καλός మధ్య ఉన్న స్వల్ప పదభేదాన్ని కృత్రిమంగా అతిశయింపజేయదు.
- source_word: ποιεῖ
  choice: కాస్తుంది
  rationale: ποιέω యొక్క మూలార్థం ‘చేస్తుంది/ఉత్పత్తి చేస్తుంది’; అయితే చెట్టు పండ్ల సందర్భంలో ‘పండ్లు కాస్తుంది’ అనేది సహజమైన తెలుగు ప్రయోగం.
- source_word: τὸ δὲ
  choice: కానీ
  rationale: δέ ఇక్కడ రెండు రకాల చెట్ల మధ్య స్పష్టమైన వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: σαπρὸν
  choice: కుళ్లిన
  rationale: σαπρός యొక్క చెడిపోయిన, కుళ్లిన, పనికిరాని అనే బలమైన భావాన్ని చెట్టు ఉపమానంలో సజీవంగా నిలుపుతుంది.
- source_word: καρποὺς πονηροὺς
  choice: చెడ్డ పండ్లు
  rationale: πονηρόςకు ‘చెడ్డ,’ ‘దుష్ట,’ ‘హానికరమైన’ అనే భావాలు ఉండవచ్చు. వ్యవసాయ ఉపమానంలో ‘చెడ్డ పండ్లు’ సహజంగా ఉండి, సందర్భంలోని నైతిక సూచనను కూడా మూసివేయదు.
theological_decisions:
- issue: ఉపమానంలోని వ్యవసాయ భావం మరియు నైతిక భావం
  choice: చెట్టు–పండ్ల ఉపమానాన్ని నేరుగా ఉంచి, దాని నైతిక అన్వయాన్ని అనువాదంలో స్పష్టీకరించలేదు.
  alternative: ‘నీతి ఫలాలు,’ ‘దుష్ట క్రియలు’ వంటి వివరణాత్మక పదాలతో నైతిక భావాన్ని నేరుగా చెప్పడం.
  rationale: గ్రీకు వాక్యం స్వయంగా ఉపమానాన్నే చెబుతుంది; అబద్ధ ప్రవక్తల గురించిన సందర్భం దాని నైతిక బలాన్ని అందిస్తుంది. అందువల్ల అనువాదం ఆ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: ἀγαθός మరియు καλός రెండింటి తెలుగు రూపం
  choice: రెండింటికీ సందర్భానుగుణంగా ‘మంచి’ వాడబడింది.
  alternative: ‘మంచి చెట్టు శ్రేష్ఠమైన/చక్కని పండ్లు’ అని పదభేదాన్ని బలవంతంగా చూపడం.
  rationale: గ్రీకులో పదాలు వేరైనా, ఈ సామెతసదృశ వాక్యంలో రెండూ సానుకూల నాణ్యతను సూచిస్తాయి. తెలుగులో కృత్రిమమైన భేదం కల్పించడం మూలంలోని ఉద్దేశాన్ని మించి అర్థభేదాన్ని సూచించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘పండ్లు కాస్తుంది’ అనే సహజ వ్యవసాయ ప్రయోగం ఉపయోగించబడింది; వాక్యంలోని సామెతసదృశ సమాంతర నిర్మాణం నిలుపబడింది.
