translation:
  language: te
  text: కాబట్టే[a] వారి ఫలాలను బట్టి మీరు వారిని గుర్తిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అందువల్లనే, వారి ఫలాల ద్వారా మీరు వారిని తెలుసుకుంటారు.’
    reason: ἄρα γε యొక్క నిర్ధారణాత్మక స్వల్ప ఉద్ఘాటనను, ἀπόకు ‘ద్వారా’ అనే సాధ్యమైన ప్రయోగాన్ని, ἐπιγνώσεσθεకు ‘తెలుసుకుంటారు’ అనే అక్షరార్థానికి దగ్గరైన ప్రత్యామ్నాయాన్ని చూపుతుంది.
lexical_decisions:
- source_word: ἄρα γε
  choice: కాబట్టి
  rationale: ఈ పదబంధం స్వల్ప ఉద్ఘాటనతో ముందున్న విషయానికి ముగింపు నిర్ణయాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో ‘కాబట్టి’ ఆ తార్కిక ముగింపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ
  choice: బట్టి
  rationale: ఇక్కడ ఈ విభక్తి ప్రయోగం గుర్తింపుకు ఆధారాన్ని సూచిస్తుంది. ‘ఫలాలను బట్టి’ అనేది తెలుగులో సహజమైన ప్రయోగం.
- source_word: καρπῶν
  choice: ఫలాలను
  rationale: గ్రీకు మూలంలోని బహువచనాన్ని, అలాగే సందర్భంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: αὐτῶν
  choice: వారి
  rationale: ఈ సంబంధవాచక సర్వనామం ‘ఫలాలు’ ఎవరివో తెలియజేస్తుంది.
- source_word: ἐπιγνώσεσθε
  choice: మీరు ... గుర్తిస్తారు
  rationale: భవిష్యత్తు కాలంలోని ఈ క్రియ, కనిపించే ఆధారాన్ని బట్టి వారు ఎలాంటివారో గుర్తించడాన్ని సూచిస్తుంది.
- source_word: αὐτούς
  choice: వారిని
  rationale: ముందు ప్రస్తావించిన వ్యక్తులను సూచించే కర్మరూప సర్వనామానికి సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: మనుషులను అంచనా వేయడంలో ‘ఫలాలు’ అనే రూపకం
  choice: ‘ఫలాలు’ అనే రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: వారి క్రియలు; వారి వల్ల కలిగే ఫలితాలు
  rationale: వచనం కనిపించే పరిణామాల ఆధారంగా వివేచించడాన్ని సూచించినా, మూలపాఠం ‘ఫలాలు’ అనే రూపకాన్నే వాడుతుంది. దాన్ని నిలుపడం సమీప సందర్భంతో అనుసంధానాన్ని కాపాడి, అర్థాన్ని అనవసరంగా సంకుచితం చేయకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. ‘ఫలాలు’ అనే బైబిలీయ రూపకాన్ని నిలిపి, ‘బట్టి’ ద్వారా గుర్తింపుకు ఆధారమనే భావాన్ని స్పష్టంగా తెలిపింది.
