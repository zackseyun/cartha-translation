- from: వర్షం కురిసింది; నదులు[a] పొంగివచ్చాయి; గాలులు వీచి ఆ ఇంటిని ఢీకొట్టాయి. అప్పుడు అది కూలిపోయింది; దాని పతనం ఘోరంగా ఉంది.
  to: వర్షం కురిసింది, నదులు[a] వచ్చాయి, గాలులు వీచి ఆ ఇంటిని ఢీకొట్టాయి; అది పడిపోయింది, దాని పతనం ఘోరమైనది.
