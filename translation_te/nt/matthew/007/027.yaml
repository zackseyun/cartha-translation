id: MAT.7.27
reference: Matthew 7:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: te
  text: వర్షం కురిసింది, నదులు[a] వచ్చాయి, గాలులు వీచి ఆ ఇంటిని ఢీకొట్టాయి; అది పడిపోయింది, దాని పతనం ఘోరమైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వరదలు.” గ్రీకు పదానికి అక్షరార్థంగా “నదులు” అని అర్థం; ఈ సందర్భంలో అది వరదనీటిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: వర్షం కురిసింది
  rationale: గ్రీకులో అక్షరార్థంగా వర్షం ‘దిగివచ్చింది’; సహజమైన ఆధునిక తెలుగులో వర్షానికి ‘కురిసింది’ అని చెప్పడం అదే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἦλθον οἱ ποταμοί
  choice: నదులు పొంగివచ్చాయి
  rationale: ποταμοί అనే పదానికి ప్రాథమిక అర్థం ‘నదులు.’ తుఫాను సందర్భంలో వాటి ఉద్ధృతిని తెలుగులో సహజంగా తెలియజేయడానికి ‘పొంగివచ్చాయి’ అని అనువదించబడింది; ‘వరదలు’ అనేది సాధ్యమైన సందర్భార్థం కాబట్టి పాదసూచికలో ఉంచబడింది.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: గాలులు వీచి
  rationale: మూలంలోని సాధారణ క్రియను సహజమైన తెలుగు వాక్యనిర్మాణంలో నేరుగా ప్రతిబింబిస్తుంది.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: ఆ ఇంటిని ఢీకొట్టాయి
  rationale: ఇక్కడ προσκόπτω తగలడం లేదా బలంగా ఢీకొట్టడం అనే భావంలో ఉంది. ‘ఢీకొట్టాయి’ తుఫాను బలాన్ని తెలుపుతూ మూలానికి సమీపంగా ఉంటుంది.
- source_word: ἔπεσεν
  choice: అది కూలిపోయింది
  rationale: అక్షరార్థం ‘పడిపోయింది’; అయితే ఇంటి సందర్భంలో ‘కూలిపోయింది’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: దాని పతనం ఘోరంగా ఉంది
  rationale: πτῶσις అనే ‘పడిపోవడం/పతనం’ నామవాచక రూపాన్ని నిలుపుతూ μεγάλη సూచించే తీవ్రతను ‘ఘోరంగా’ తెలియజేస్తుంది; తీర్పు గురించి మూలంలో లేని వివరణను జోడించదు.
theological_decisions:
- issue: ఉపమాన ముగింపులోని వినాశన తీవ్రత
  choice: దాని పతనం ఘోరంగా ఉంది
  alternative: దాని కూలిపోవడం చాలా గొప్పది
  rationale: మూలం ఇంటి పతనం గొప్పదని లేదా తీవ్రంగా ఉందని మాత్రమే చెబుతుంది. అనువాదం హెచ్చరిక బలాన్ని నిలుపుతుంది గాని దానిని స్పష్టమైన అంత్యకాల తీర్పుగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు స్పష్టంగా ఉండే గంభీరమైన శైలి. వరుసగా వచ్చే καί పదాల కథన లయను అర్ధవిరామాలతో నిలుపుతూ, తెలుగులో అసహజమైన పునరుక్తిని నివారించాం.
