    issue: ‘పొంగివచ్చాయి’ expands οἱ ποταμοὶ ἦλθον.
    rationale: The Greek says that the rivers came; while flooding is evoked by context, ‘surged/overflowed’ specifies an aspect not expressed by the verb. The footnote already supplies ‘floods’ as the contextual alternative.
  - severity: low
    issue: ‘అప్పుడు’ has no direct counterpart in the Greek.
    rationale: The source continues directly from the winds striking the house to its falling. Removing the added transition better preserves the compact narrative sequence.
  - severity: low
    issue: ‘దాని పతనం ఘోరంగా ఉంది’ uses a present-style predication after past events.
    rationale: A nominal predicate, ‘దాని పతనం ఘోరమైనది,’ reads naturally in Telugu while better representing the Greek concluding description.
  revised_text: వర్షం కురిసింది, నదులు[a] వచ్చాయి, గాలులు వీచి ఆ ఇంటిని ఢీకొట్టాయి; అది పడిపోయింది, దాని పతనం ఘోరమైనది.
