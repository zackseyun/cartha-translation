  source_fidelity: ‘ఎందుకంటే’ γάρ యొక్క వివరణాత్మక సంబంధాన్ని నిలుపుతుంది. ‘బోధిస్తూ ఉన్నాడు’ ἦν διδάσκων అనే పరిభాషాత్మక అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న చర్యను సహజంగా వ్యక్తం చేస్తుంది. ‘వారికి’ తెలుగులో బోధనకు సహజమైన దత్తివ ప్రయోగం కాగా αὐτούς యొక్క సూచనను కాపాడుతుంది. ‘అధికారమున్నవానిలా’ ὡς ἐξουσίαν ἔχων అనే పోలికను, ‘వారి శాస్త్రులలా కాదు’ καὶ οὐχ ὡς οἱ γραμματεῖς αὐτῶν అనే వ్యత్యాసాన్ని విశ్వసనీయంగా అందిస్తుంది.
