  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: te
  text: ఎందుకంటే ఆయన వారికి అధికారమున్నవానిలా బోధిస్తూ ఉన్నాడు[a]; వారి శాస్త్రులలా కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత సహజంగా: ‘అధికారంతో బోధిస్తూ ఉన్నాడు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: ఎందుకంటే … బోధిస్తూ ఉన్నాడు
  rationale: ἦν + వర్తమాన కృదంతం కలిగిన పరిభాషాత్మక అసంపూర్ణ భూతకాల నిర్మాణం, గతంలో కొనసాగుతున్న బోధనను సూచిస్తుంది. γάρ మునుపటి వాక్యంలో జనసమూహాల ఆశ్చర్యానికి కారణాన్ని వివరిస్తుంది.
- source_word: αὐτούς
  choice: వారికి
  rationale: ఇది జనసమూహాలను లేదా శ్రోతలను సూచిస్తుంది; తెలుగులో ‘బోధించు’తో సహజంగా చతుర్థీ విభక్తి వాడబడుతుంది.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: అధికారమున్నవానిలా
  rationale: ἐξουσία అనేది అధికారం, హక్కు లేదా అధికారబలం అనే భావాన్ని కలిగి ఉంది. ఈ రూపం గ్రీకు పోలికను, అలాగే బోధించే వ్యక్తిలో అధికారం ఉందనే అంశాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: καὶ οὐχ ὡς
  choice: …లా కాదు
  rationale: గ్రీకులోని స్పష్టమైన పోలికనూ వ్యత్యాసాన్నీ సహజమైన తెలుగు నిర్మాణంలో నిలుపుతుంది.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: వారి శాస్త్రులు
  rationale: γραμματεῖς ఇక్కడ ధర్మశాస్త్రంలో నిపుణులైన శాస్త్రులను సూచిస్తుంది. αὐτῶνను ‘వారి’గా నిలుపుతూ, ప్రజలకు తెలిసిన వారి మతబోధకులతో ఉన్న పోలికను వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యేసు బోధనలోని అధికారం స్వభావం
  choice: ‘అధికారమున్నవానిలా’ అని వర్ణనాత్మక పోలికగా అనువదించడం.
  alternative: దైవిక అధికారం అని స్పష్టంగా విస్తరించడం, లేదా కేవలం ఆత్మవిశ్వాసంతో బోధించాడని పరిమితం చేయడం.
  rationale: ఈ వాక్యం యేసు అధికారాన్ని నిజమైనదిగా చూపించి శాస్త్రులతో వ్యత్యాసపరుస్తుంది; అయితే ఆ అధికారానికి పూర్తి వేదాంతపరమైన ఆధారం ఏమిటో ఇక్కడ స్వయంగా వివరించదు. అందువల్ల వచనంలోని వాదననూ ఉద్వేగాన్నీ అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘శాస్త్రులు’ అనే సాంప్రదాయ బైబిలు పదం సందర్భంలోని ధర్మశాస్త్ర నిపుణులను సంక్షిప్తంగా సూచిస్తుంది; పాదసూచిక గ్రీకు నిర్మాణానికి మరింత సహజమైన తెలుగు ప్రత్యామ్నాయాన్ని అందిస్తుంది.
