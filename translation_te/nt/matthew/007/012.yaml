id: MAT.7.12
reference: Matthew 7:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: te
  text: కాబట్టి, ప్రతి విషయంలో, ఇతరులు మీకు ఏది చేయాలని మీరు కోరుకుంటారో, మీరు కూడా వారికి అలాగే చేయండి; ఎందుకంటే ధర్మశాస్త్రమూ ప్రవక్తలూ ఇదే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα ... ὅσα ἐὰν
  choice: ఏమి ... కోరుకుంటారో
  rationale: Πάντα ὅσα అనే సమగ్ర సంబంధవాచక నిర్మాణం సందర్భంలో ‘ఏమి ... కోరుకుంటారో’ అనే సహజ తెలుగు రూపంలో విశాల పరిధిని తెలియజేస్తుంది; ‘అన్నిటిలో’ అని విడిగా ఉంచితే తెలుగులో వాక్యం బరువుగా మారుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న బోధనతో ఈ ఆజ్ఞకు ఉన్న తార్కిక అనుసంధానాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οἱ ἄνθρωποι
  choice: ఇతరులు
  rationale: ఇక్కడ ἄνθρωποι పురుషులను మాత్రమే కాక సాధారణంగా ఇతర మనుషులను సూచిస్తుంది. పరస్పర సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘ఇతరులు’ ఎంచుకున్నాం.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: అలాగే మీరు కూడా వారికి చేయండి
  rationale: οὕτως καὶ యొక్క పరస్పర సమాంతరతను, ποιεῖτε అనే ఆజ్ఞార్థక బలాన్ని సహజంగా నిలుపుతుంది.
- source_word: οὗτος γάρ ἐστιν
  choice: ఎందుకంటే ... ఇదే
  rationale: γάρ ఇచ్చే వివరణాత్మక కారణ సంబంధాన్నీ, οὗτος ἐστιν ఇచ్చే సంక్షిప్త సమీకరణాన్నీ తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: ὁ νόμος καὶ οἱ προφῆται
  choice: ధర్మశాస్త్రమూ ప్రవక్తలూ
  rationale: యూదుల లేఖన సంప్రదాయాన్ని సూచించే స్థిరమైన సమగ్ర పదబంధాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: ἄνθρωποι యొక్క సాధారణ లింగార్థం
  choice: ఇతరులు
  alternative: మనుషులు / పురుషులు
  rationale: సూత్రం మానవ సంబంధాలన్నిటికీ వర్తిస్తుంది; పురుషులకు మాత్రమే పరిమితం చేసే భావాన్ని నివారిస్తూ మూలంలోని సాధారణ అర్థాన్ని కాపాడుతుంది.
- issue: ‘ధర్మశాస్త్రమూ ప్రవక్తలూ’ అనే పదబంధపు పరిధి
  choice: లేఖనాల సమగ్ర సూచనగా పదబంధాన్ని యథాతథంగా నిలుపడం
  alternative: లేఖనాల నైతిక బోధ అంతా ఇదే అని వివరణాత్మకంగా అనువదించడం
  rationale: మత్తయి సువార్తలోని స్థిరమైన యూదు లేఖన సూత్రాన్ని నిలుపుతూ, దాని పరిధిని అనువాదంలోనే సంకుచితం చేయకుండా లేదా విస్తరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్యానికి తగిన గంభీరతతో రూపొందించబడింది. ‘అన్నిటిలో’ అనే ఆంగ్ల నిర్మాణానుసరణకు బదులు తెలుగు సంబంధవాచక వాక్య నిర్మాణం వాడబడింది.
