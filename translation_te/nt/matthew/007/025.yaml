review_pass:
  verdict: revise
  source_fidelity: The sequence of rain, rivers, winds, impact on the house, and the house's not falling is retained. However, the Greek pluperfect passive τεθεμελίωτο describes a foundation already laid before the storm; the draft's ‘వేయబడి ఉంది’ chiefly expresses a present resulting state and weakens that prior-state nuance.
  naturalness: The Telugu is clear and modern. ‘ఆ ఇంటిని ఢీకొట్టాయి’ is understandable, but ‘ఆ ఇంటిమీద పడ్డాయి’ more directly and naturally represents προσέπεσαν in this storm image without suggesting a literal collision.
  terminology: ‘నదులు,’ ‘పునాది,’ and ‘బండ’ are suitable. ‘బండ మీద’ preserves πέτρα without importing an interpretation such as ‘bedrock.’
  issues:
  - severity: low
    issue: The prior completed-state force of τεθεμελίωτο is underrepresented.
    rationale: ‘దాని పునాది బండ మీద వేయబడి ఉంది’ is grammatical, but ‘ఉండేది’ better conveys that the foundation had already been laid when the storm came.
  - severity: low
    issue: ‘ఢీకొట్టాయి’ is somewhat more concrete than προσέπεσαν.
    rationale: The Greek can mean fell upon/against; ‘ఆ ఇంటిమీద పడ్డాయి’ is a close, idiomatic Telugu rendering and leaves the force of the storm in the context.
  revised_text: వాన కురిసింది, నదులు వచ్చాయి[a], గాలులు వీచి ఆ ఇంటిమీద పడ్డాయి[b]. అయినా అది పడిపోలేదు, ఎందుకంటే దానికి బండ మీద పునాది వేయబడి ఉండేది.
