id: MAT.7.25
reference: Matthew 7:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: te
  text: వాన కురిసింది, నదులు వచ్చాయి[a], గాలులు వీచి ఆ ఇంటిమీద పడ్డాయి[b]. అయినా అది పడిపోలేదు, ఎందుకంటే దానికి బండ మీద పునాది వేయబడి ఉండేది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వరదలు వచ్చాయి.’ గ్రీకు పదానికి మరింత అక్షరార్థం ‘నదులు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆ ఇంటిని ఢీకొట్టాయి’ లేదా ‘దానిని బలంగా తాకాయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: వాన కురిసింది
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘వాన కిందికి వచ్చింది’ అని ఉన్నా, వాన కిందికి రావడాన్ని ఆధునిక తెలుగులో సహజంగా ‘వాన కురిసింది’ అని చెబుతారు.
- source_word: οἱ ποταμοί
  choice: నదులు
  rationale: ποταμοί యొక్క సాధారణ అర్థం ‘నదులు.’ తుఫాను సందర్భంలో ‘వరదలు’ అని అర్థం చేసుకునే అవకాశం ఉన్నందున దానిని పాదసూచికలో ఉంచాం.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: గాలులు వీచి
  rationale: గాలులు వీచడాన్ని సూచించే గ్రీకు వాక్యానికి సహజమైన, నేరమైన తెలుగు రూపం.
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: ఆ ఇంటిని ఢీకొట్టాయి
  rationale: προσπίπτω అక్షరార్థంగా ‘మీద పడడం/ఎదురుగా పడడం’ అనే భావాన్ని ఇస్తుంది; తుఫాను సందర్భంలో గాలులు ఇంటిపై బలంగా తాకిన భావాన్ని ‘ఢీకొట్టాయి’ సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ ἔπεσεν
  choice: అది పడిపోలేదు
  rationale: ‘కూలిపోలేదు’ కంటే గ్రీకు ἔπεσεν‌కు దగ్గరగా ఉండి, ఇంటి గురించి తెలుగులోనూ అర్థమయ్యే నేరమైన రూపం.
- source_word: τεθεμελίωτο
  choice: దాని పునాది ... వేయబడి ఉంది
  rationale: పూర్వమే పూర్తయి కొనసాగుతున్న స్థితిని సూచించే గ్రీకు ప్లూపర్‌ఫెక్ట్ పాసివ్ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τὴν πέτραν
  choice: బండ మీద
  rationale: πέτρα ఇక్కడ దృఢమైన రాతిబండను సూచిస్తుంది. మూలపాఠం చెప్పనిదాన్ని జోడించకుండా ఉపమాన చిత్రాన్ని అలాగే ఉంచుతుంది.
theological_decisions:
- issue: పునాదికి సంబంధించిన ఉపమాన చిత్రం
  choice: బండ మీద
  alternative: రాతినేల మీద
  rationale: ఈ వచనం బండను ప్రత్యేకంగా ఎవరికైనా లేదా ఏ సిద్ధాంతానికైనా సమానం చేయదు. కాబట్టి ఉపమానంలోని చిత్రాన్ని మాత్రమే నిలిపి, దాని తాత్త్విక గుర్తింపును వివరణ ద్వారా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని వరుస ‘మరియు’ అనుసంధానాలను తెలుగులో విరామచిహ్నాలు, సహజ క్రియాసంబంధంతో అందించాం; భావక్రమం మాత్రం నిలిపాం.
