id: MAT.7.26
reference: Matthew 7:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: te
  text: నా ఈ మాటలను విని వాటిని ఆచరించని ప్రతి ఒక్కరూ, తన ఇంటిని ఇసుక మీద కట్టిన బుద్ధిహీనుడైన మనిషిలా ఉంటారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బుద్ధిహీనుడైన వ్యక్తిలా.” గ్రీకులో పోలిక పురుషలింగ ఏకవచనంలో ఉంది; అయితే ఇది సాధారణంగా ప్రతి ఒక్కరికీ వర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: విని ... ప్రతి ఒక్కరూ
  rationale: వర్తమానకాల కృదంతం సాధారణంగా ప్రతి వ్యక్తినీ సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘విని ... ప్రతి ఒక్కరూ’ సహజంగా ఉండి ఆ సమగ్ర భావాన్ని నిలుపుతుంది.
- source_word: μου τοὺς λόγους τούτους
  choice: నా ఈ మాటలు
  rationale: ‘నా’ అనే స్వామ్యాన్ని, ‘ఈ’ అనే నిర్దేశక ప్రాధాన్యాన్ని రెండింటినీ సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: μὴ ποιῶν αὐτούς
  choice: వాటి ప్రకారం చేయని
  rationale: గ్రీకులో అక్షరార్థంగా ‘వాటిని చేయని’ అని ఉన్నా, తెలుగులో మాటలను ఆచరించడమనే భావాన్ని ‘వాటి ప్రకారం చేయని’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది; క్రియాత్మక విధేయత భావం నిలుస్తుంది.
- source_word: ὁμοιωθήσεται
  choice: లా ఉంటారు
  rationale: భవిష్యత్ కర్మణి పోలికను తెలుగులో సహజమైన పోలిక నిర్మాణంతో వ్యక్తం చేస్తుంది. సందర్భంలోని ఫలితభావాన్ని ఇది తెలియజేస్తుంది.
- source_word: ἀνδρὶ μωρῷ
  choice: బుద్ధిహీనుడైన మనిషి
  rationale: ἀνήρ లోని పురుష ఏకవచన పోలికను ‘మనిషి’తో నిలుపుతూ, μωρός ను గౌరవప్రదమైన ఆధునిక పదమైన ‘బుద్ధిహీనుడు’గా అనువదించింది.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: తన ఇల్లు కట్టుకున్న
  rationale: ఇల్లు ఆ వ్యక్తికే చెందినదని తెలిపే αὐτοῦ భావాన్ని తెలుగులో సహజమైన ఆత్మార్థక ‘తన’తో వ్యక్తం చేసింది; ᾠκοδόμησεν కు సాధారణమైన ‘కట్టుకున్న’ సరిపోతుంది.
- source_word: ἐπὶ τὴν ἄμμον
  choice: ఇసుక మీద
  rationale: పునాది ఉంచిన స్థలాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పోలికలో పురుషలింగ ప్రతినిధి భాష
  choice: బుద్ధిహీనుడైన మనిషి
  alternative: బుద్ధిహీనుడైన వ్యక్తి
  rationale: గ్రీకు ἀνδρί ప్రత్యేకంగా పురుష ఏకవచన నామవాచకం. అందువల్ల పోలికలోని రూపాన్ని పురుషలింగంలో నిలిపాం; అయితే వాక్యారంభంలోని ‘ప్రతి ఒక్కరూ’ ద్వారా దాని అన్వయం అందరికీ సంబంధించినదని స్పష్టమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గంభీరతను నిలుపుతూ అనువదించబడింది. గ్రీకు పదక్రమాన్ని యాంత్రికంగా అనుసరించకుండా తెలుగు సహజ వాక్యక్రమాన్ని ఉపయోగించింది.
