review_pass:
  verdict: revise
  source_fidelity: The draft conveys the central comparison accurately. However, ‘కట్టుకున్న’ can suggest building/acquiring something for oneself, whereas ᾠκοδόμησεν simply means ‘built’; ‘కట్టిన’ is more direct. ‘వాటి ప్రకారం చేయని’ is understandable but adds ‘according to,’ while ‘ఆచరించని’ naturally expresses doing/putting Jesus’ words into practice.
  naturalness: The sentence is clear modern Telugu. Reordering the relative clause slightly and using ‘ఆచరించని’ yields a smoother, more idiomatic formulation without losing the Greek structure.
  terminology: ‘బుద్ధిహీనుడైన మనిషి’ appropriately retains the masculine singular ἀνδρὶ μωρῷ in the representative comparison. ‘ఇల్లు’ and ‘ఇసుక మీద’ are appropriate for the building image.
  issues:
  - severity: low
    issue: ‘కట్టుకున్న’ is not the most exact rendering of ᾠκοδόμησεν.
    rationale: The Greek says that the foolish man built his house; it does not emphasize that he built it for himself. ‘తన ఇంటిని ... కట్టిన’ preserves both the possessive and the straightforward building action.
  - severity: low
    issue: ‘వాటి ప్రకారం చేయని’ slightly expands μὴ ποιῶν αὐτούς.
    rationale: The phrase is a valid interpretive explanation, but ‘వాటిని ఆచరించని’ is more concise and keeps the focus on acting on/obeying the words themselves.
  revised_text: నా ఈ మాటలను విని వాటిని ఆచరించని ప్రతి ఒక్కరూ, తన ఇంటిని ఇసుక మీద కట్టిన బుద్ధిహీనుడైన మనిషిలా ఉంటారు.[a]
