- from: నా ఈ మాటలు విని, వాటి ప్రకారం చేయని ప్రతి ఒక్కరూ ఇసుక మీద తన ఇల్లు కట్టుకున్న బుద్ధిహీనుడైన మనిషిలా ఉంటారు.[a]
  to: నా ఈ మాటలను విని వాటిని ఆచరించని ప్రతి ఒక్కరూ, తన ఇంటిని ఇసుక మీద కట్టిన బుద్ధిహీనుడైన మనిషిలా ఉంటారు.[a]
  rationale: The revision removes a minor reflexive nuance from ‘కట్టుకున్న’ and replaces an expanded expression for doing the words with idiomatic ‘ఆచరించని.’ It retains the Greek’s demonstrative possessive (‘నా ఈ మాటలు’), generic opening, future comparison, masculine representative noun, and house-on-sand imagery. The footnote remains correctly anchored and accurately explains the lexical alternative.
