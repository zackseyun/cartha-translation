revisions:
- from: 'ఇలా జరిగింది[b]: యేసు ఈ మాటలు[a] చెప్పడం ముగించినప్పుడు, జనసమూహాలు ఆయన బోధకు ఆశ్చర్యపోతూ ఉన్నారు.'
  to: 'యేసు ఈ మాటలు[a] చెప్పడం ముగించినప్పుడు ఇలా జరిగింది[b]: జనసమూహాలు ఆయన బోధకు విస్మయపడ్డారు.'
  rationale: The revision retains the Greek narrative formula, the temporal clause, the plural ‘crowds,’ and the causal/objective relation to Jesus’ teaching. It improves Telugu syntax by placing ‘ఇలా జరిగింది’ after the temporal clause and uses an idiomatic past verb that conveys the strong collective reaction without overtranslating the Greek imperfect.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:31:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Jesus finishing the preceding words, the plural crowds, and their response to his teaching. However, the imperfect ἐξεπλήσσοντο need not be rendered by the cumbersome progressive ‘ఆశ్చర్యపోతూ ఉన్నారు’; a simple past naturally expresses the collective ongoing/imperfect reaction in Telugu. The narrative formula is better positioned with its temporal clause.
  naturalness: '‘ఇలా జరిగింది: యేసు ... ముగించినప్పుడు’ is syntactically awkward, because the explanatory ‘ఇలా జరిగింది’ precedes the event it introduces. ‘యేసు ... ముగించినప్పుడు ఇలా జరిగింది: ...’ is clearer and retains the source’s narrative-transition formula. ‘విస్మయపడ్డారు’ is a natural, suitably elevated modern-standard rendering of the strong verb ἐξεπλήσσοντο.'
  terminology: ‘యేసు,’ ‘ఈ మాటలు,’ ‘జనసమూహాలు,’ and ‘ఆయన బోధ’ are appropriate. ‘ఈ ఉక్తులు’ remains a valid lexical alternative. No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: Awkward ordering of the narrative formula
    rationale: 'The opening ‘ఇలా జరిగింది: యేసు ఈ మాటలు చెప్పడం ముగించినప్పుడు’ does not flow naturally in Telugu. Moving the formula after the temporal clause preserves Καὶ ἐγένετο ... ὅτε while making the clause structure clear.'
  - severity: low
    issue: Overly literal progressive response verb
    rationale: ‘ఆశ్చర్యపోతూ ఉన్నారు’ is possible but stilted here. The Greek imperfect portrays the crowds’ reaction without requiring a Telugu progressive construction; ‘విస్మయపడ్డారు’ is idiomatic and retains the verb’s strong sense.
  - severity: low
    issue: Footnote b does not state a clear alternative rendering
    rationale: Its current wording explains the construction but gives an incomplete alternative. It should identify the narrative formula and provide a concrete Telugu alternative.
  revised_text: 'యేసు ఈ మాటలు[a] చెప్పడం ముగించినప్పుడు ఇలా జరిగింది[b]: జనసమూహాలు ఆయన బోధకు విస్మయపడ్డారు.'
  revised_footnotes:
  - marker: a
    text: లేదా, ‘ఈ ఉక్తులు.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో కథనాన్ని కొనసాగించే సూత్రప్రయోగం; లేదా, ‘అప్పుడు జరిగింది.’
    reason: lexical_alternative
  revision_rationale: The revision retains the Greek narrative formula, the temporal clause, the plural ‘crowds,’ and the causal/objective relation to Jesus’ teaching. It improves Telugu syntax by placing ‘ఇలా జరిగింది’ after the temporal clause and uses an idiomatic past verb that conveys the strong collective reaction without overtranslating the Greek imperfect.
