id: MAT.7.28
reference: Matthew 7:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: te
  text: 'యేసు ఈ మాటలు[a] చెప్పడం ముగించినప్పుడు ఇలా జరిగింది[b]: జనసమూహాలు ఆయన బోధకు విస్మయపడ్డారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ ఉక్తులు.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో కథనాన్ని కొనసాగించే సూత్రప్రయోగం; లేదా, ‘అప్పుడు జరిగింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: ఇలా జరిగింది
  rationale: కథనం కొనసాగుతూ కొత్త దశకు మారుతున్నదని సూచించే గ్రీకు సూత్రప్రయోగాన్ని స్పష్టంగా నిలుపుతుంది; పాతకాలపు కృత్రిమ శైలిని తప్పిస్తుంది.
- source_word: ὅτε
  choice: ముగించినప్పుడు
  rationale: ముందున్న కథన సూత్రప్రయోగంతో కలిసి కాలసంబంధ ఉపవాక్యాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘అప్పుడు’ని అనవసరంగా రెండుసార్లు వాడకుండా సహజంగా ఉంటుంది.
- source_word: ἐτέλεσεν
  choice: చెప్పడం ముగించినప్పుడు
  rationale: యేసు తన ప్రసంగాన్ని పూర్తిచేసిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది. ‘మాటలు ముగించినప్పుడు’ కంటే ఆధునిక తెలుగులో ఇది సహజంగా ఉంటుంది.
- source_word: τοὺς λόγους τούτους
  choice: ఈ మాటలు
  rationale: λόγοι అనే పదంలోని ‘మాటలు/ఉక్తులు’ అర్థవిస్తృతిని సాధ్యమైనంత నేరుగా నిలుపుతూ, ముందున్న బోధను సూచిస్తుంది.
- source_word: ἐξεπλήσσοντο
  choice: ఆశ్చర్యపోతూ ఉన్నారు
  rationale: అపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా సమూహ స్పందనను నిలుపుతూ, క్రియ తీవ్రతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἱ ὄχλοι
  choice: జనసమూహాలు
  rationale: గ్రీకులోని బహువచనాన్ని నిలుపుతుంది; ‘జనసమూహం’ అనే ఏకవచనం మూలపాఠంలోని సంఖ్యను చదును చేస్తుంది.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: ఆయన బోధకు
  rationale: వారి ఆశ్చర్యానికి ఆధారం లేదా సందర్భం యేసు బోధేనని తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు ముగించిన మాటల సూచన
  choice: ఈ మాటలు
  alternative: ఈ ఉక్తులు; ఈ ప్రసంగం
  rationale: ఇది వెంటనే ముందున్న యేసు బోధను సూచిస్తుంది. మూలపాఠంలో లేని ‘కొండమీది ప్రసంగం’ వంటి తరువాతి శీర్షికను చేర్చకుండా, λόγοι యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది.
- issue: జనసమూహాల స్పందన యొక్క కాలభావం
  choice: ఆశ్చర్యపోతూ ఉన్నారు
  alternative: ఆశ్చర్యపోయారు
  rationale: ἐξεπλήσσοντο లోని అపూర్ణ భూతకాల రూపం వారి స్పందన కొనసాగుతున్నదనే ఛాయను కలిగిస్తుంది; దాన్ని కేవలం ఒక క్షణిక సంఘటనగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఇలా జరిగింది’ అనే రూపం గ్రీకు కథన సూత్రాన్ని నిలుపుతుంది; ప్రధాన వాక్యంలోని కొనసాగుతున్న స్పందనను ‘ఆశ్చర్యపోతూ ఉన్నారు’ ద్వారా వ్యక్తం చేసింది.
