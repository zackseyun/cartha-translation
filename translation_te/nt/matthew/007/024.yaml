id: MAT.7.24
reference: Matthew 7:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: te
  text: “కాబట్టి, నా ఈ మాటలు విని వాటిని ఆచరించే ప్రతి ఒక్కరూ బండపై తన ఇల్లు కట్టుకున్న వివేకవంతుడైన మనిషిలా ఉంటారు[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వివేకవంతుడైన మనిషితో పోల్చబడతారు” లేదా “వివేకవంతుడైన మనిషితో సమానంగా పరిగణించబడతారు.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “వివేకవంతుడైన పురుషుడు”; మూల వాక్యంలోని పోలిక వ్యాకరణపరంగా పురుషలింగంలో ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: కాబట్టి ... ప్రతి ఒక్కరూ
  rationale: οὖν ముందున్న బోధననుంచి వచ్చే నిర్ధారణను సూచిస్తుంది; Πᾶς ... ὅστις ప్రతి వ్యక్తికీ వర్తించే సాధారణ భావాన్ని ఇస్తుంది.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: నా ఈ మాటలు విని
  rationale: λόγους ను నేరుగా, సహజంగా ‘మాటలు’ అని అనువదించాం; μου అనే స్వామ్యార్థాన్ని ‘నా’ నిలుపుతుంది.
- source_word: καὶ ποιεῖ αὐτούς
  choice: వాటిని ఆచరించే
  rationale: ఇక్కడ ποιεῖ విన్న మాటలను చేయడం, ఆచరణలో పెట్టడం అనే భావంలో ఉంది. ‘వాటిని ఆచరించే’ అనేది తెలుగు వాడుకలో సహజంగా ఉండి గ్రీకు వాక్యంలోని ప్రత్యక్షతను నిలుపుతుంది.
- source_word: ὁμοιωθήσεται
  choice: మనిషిలా ఉంటారు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని తెలుగులో సహజమైన పోలికగా వ్యక్తం చేశాం; ‘పోల్చబడతారు’ అనే మరింత రూపసన్నిహిత అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἀνδρὶ φρονίμῳ
  choice: వివేకవంతుడైన మనిషి
  rationale: ἀνήρ ఇక్కడ పురుషుణ్ణి సూచిస్తుంది; φρόνιμος సందర్భానుసారం జ్ఞానంతో, ముందుచూపుతో వ్యవహరించే వ్యక్తిని సూచించేందున ‘వివేకవంతుడు’ సరిపోతుంది.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: తన ఇల్లు కట్టుకున్న
  rationale: అదే వ్యక్తిని తిరిగి సూచించే αὐτοῦ భావాన్ని తెలుగులో సహజంగా ‘తన’ అని తెలిపాం; οἰκία కు నిర్మాణ రూపకాన్ని నిలిపే ‘ఇల్లు’ వాడాం.
- source_word: ἐπὶ τὴν πέτραν
  choice: బండపై
  rationale: πέτρα గట్టి సహజ శిలను సూచిస్తుంది. ‘బండపై’ మూలంలోని నిర్మాణ చిత్రాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: పోలికలో పురుషలింగ ప్రతినిధి పదం
  choice: వివేకవంతుడైన మనిషి
  alternative: వివేకవంతుడైన వ్యక్తి
  rationale: గ్రీకులో ἀνδρί ప్రత్యేకంగా పురుషుణ్ణి సూచిస్తుంది. అందువల్ల పోలికలోని పురుషలింగాన్ని నిలిపాం; అయితే వాక్యపు విస్తృత వర్తింపును ‘ప్రతి ఒక్కరూ’ స్పష్టంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘ఆచరించే’ వినడం–చేయడం మధ్య ఉన్న ప్రధాన వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది; ‘బండపై’ రూపకాన్ని సంక్షిప్తంగా ఉంచుతుంది.
