review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two prohibitions, the undefined metaphors, the plural ‘pearls,’ the pigs’ trampling of the pearls, and their subsequent turning to tear the hearers. However, ‘అలా చేస్తే’ is a more neutral ‘if you do so’ conditional; μήποτε is better represented by an explicit warning such as ‘లేకపోతే’ (‘lest/otherwise’).
  naturalness: The Telugu is generally modern and clear. Joining the prohibitions with ‘అలాగే’ gives the coordinated Greek negatives a smoother, more natural flow. ‘తొక్కి’ is sufficient for καταπατήσουσιν when ‘తమ కాళ్ల కింద’ already expresses the underfoot imagery; ‘తొక్కివేసి’ can suggest disposal or annihilation beyond the verb’s core sense.
  terminology: ‘పవిత్రమైనది,’ ‘కుక్కలు,’ ‘ముత్యాలు,’ and ‘పందులు’ are appropriate modern-standard Telugu renderings and preserve the source’s deliberately uninterpreted imagery. The footnotes are appropriately restrained; the alternate wording in note c is retained as a natural expression of the violent tearing image.
  issues:
  - severity: low
    issue: The warning particle μήποτε is rendered as ‘అలా చేస్తే.’
    rationale: This expresses a condition but does not fully carry the preventive warning force of μήποτε. ‘లేకపోతే’ naturally conveys ‘lest/otherwise’ without making the outcome certain.
  - severity: low
    issue: ‘తొక్కివేసి’ may slightly overstate καταπατέω.
    rationale: With ‘తమ కాళ్ల కింద’ retained, plain ‘తొక్కి’ conveys trampling underfoot without adding a possible nuance of throwing away or utterly destroying.
  revised_text: పవిత్రమైనదాన్ని కుక్కలకు ఇవ్వకండి[a]; అలాగే మీ ముత్యాలను పందుల ముందు వేయకండి[b]. లేకపోతే, అవి వాటిని తమ కాళ్ల కింద తొక్కి, తిరిగి మిమ్మల్ని చీల్చివేయవచ్చు[c].
