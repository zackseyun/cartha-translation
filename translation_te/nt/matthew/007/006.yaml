id: MAT.7.6
reference: Matthew 7:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: te
  text: పవిత్రమైనదాన్ని కుక్కలకు ఇవ్వకండి[a]; అలాగే మీ ముత్యాలను పందుల ముందు వేయకండి[b]. లేకపోతే, అవి వాటిని తమ కాళ్ల కింద తొక్కి, తిరిగి మిమ్మల్ని చీల్చివేయవచ్చు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పవిత్ర వస్తువును” లేదా “పవిత్రమైన దానిని.” గ్రీకు పదబంధం విస్తృతార్థకమైనది; అది ప్రతిష్ఠించబడిన లేదా పవిత్రమైన దేనినైనా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'సాంప్రదాయికంగా: “మీ ముత్యాలను పందుల ముందు పారవేయకండి.”'
    reason: lexical_alternative
  - marker: c
    text: లేదా “మిమ్మల్ని ముక్కలుగా చీల్చివేయవచ్చు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: పవిత్రమైనదాన్ని
  rationale: నపుంసక ఏకవచన విశేషణం నామవాచకంగా వాడబడింది. దాని నిర్దిష్ట సూచనను నిర్ణయించకుండా, సాధారణమైన ‘పవిత్రమైనది’ అనే భావాన్ని నిలుపుతుంది.
- source_word: τοῖς κυσίν
  choice: కుక్కలకు
  rationale: మూలంలోని బలమైన రూపకాన్ని మెత్తబరచకుండా సహజమైన తెలుగు బహువచనంగా అనువదించబడింది.
- source_word: βάλητε
  choice: వేయకండి
  rationale: βάλλωకు ఈ సందర్భంలో ‘వేయు’ సహజమైన ఆధునిక తెలుగు; ‘విసరు’ కంటే వాక్యలయానికి అనుకూలంగా ఉండి చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: మీ ముత్యాలను
  rationale: మూలంలోని బహువచనాన్నీ, ద్వితీయ పురుష స్వామ్యాన్నీ నేరుగా నిలుపుతుంది.
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: పందుల ముందు
  rationale: చిత్రాత్మక రూపకాన్ని యథాతథంగా, ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: μήποτε
  choice: అలా చేస్తే … వచ్చు
  rationale: μήποτε తెలిపే హెచ్చరికాత్మక ప్రతికూల సంభావ్యతను తెలుగులో సహజమైన షరతు-సంభావ్యత నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: అవి వాటిని తమ కాళ్ల కింద తొక్కివేసి
  rationale: అవి అనే కర్త పందులను, వాటిని అనే కర్మ ముత్యాలను సూచించేలా గ్రీకు సర్వనామ భేదాన్ని తెలుగులో నిలుపుతుంది; ‘కాళ్ల కింద’ మూలంలోని స్పష్టమైన పాదసూచనను కాపాడుతుంది.
- source_word: στραφέντες
  choice: ఆపై మీ మీదికి తిరిగి
  rationale: ముందటి తొక్కడానికి తరువాత జరిగే శత్రుత్వ చర్యను సహజంగా చూపుతుంది; ‘మీ మీదికి’ అనేది దాడి దిశను తెలుగులో స్పష్టం చేస్తుంది, కానీ కొత్త వ్యాఖ్యానాన్ని జోడించదు.
- source_word: ῥήξωσιν ὑμᾶς
  choice: మిమ్మల్ని చీల్చివేయవచ్చు
  rationale: ῥήγνυμι యొక్క హింసాత్మకంగా చీల్చే భావాన్ని నిలుపుతుంది; ద్వితీయ పురుష బహువచనాన్ని ‘మిమ్మల్ని’గా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘పవిత్రమైనది,’ ‘కుక్కలు,’ ‘ముత్యాలు,’ ‘పందులు’ అనే రూపకాల వ్యాఖ్యానం
  choice: రూపకాలను వివరణాత్మక విస్తరణ లేకుండా నిలుపడం
  alternative: ‘పవిత్రమైనది/ముత్యాలు’ను రాజ్యసందేశం లేదా పవిత్ర బోధగా, ‘కుక్కలు/పందులు’ను దుష్టులు లేదా సువార్తకు విరోధులుగా స్పష్టంగా గుర్తించడం
  rationale: వచనం ఈ రూపకాల సూచనలను ఖచ్చితంగా నిర్వచించదు. ఒక నిర్దిష్ట సిద్ధాంతపరమైన అర్థాన్ని అనువాదంలో చేర్చకుండా మూలంలోని ఉద్దేశపూర్వక విస్తృతతను, ఉద్రిక్తతను కాపాడాం.
- issue: μήποτε యొక్క హెచ్చరిక స్వరూపం
  choice: ‘అలా చేస్తే … వచ్చు’ అనే సంభావ్యతతో వ్యక్తం చేయడం
  alternative: ఖచ్చిత ఫలితంలా ‘లేకపోతే అవి … చేస్తాయి’ అని అనువదించడం
  rationale: గ్రీకు μήποτε భయపడవలసిన లేదా నివారించవలసిన ఫలితాన్ని పరిచయం చేస్తుంది. తెలుగు సంభావ్యతా రూపం హెచ్చరికను నిలుపుతూ దానిని అవసరమైన ఖచ్చిత ఫలితంగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవబహువచన ఆజ్ఞారూపాలు (‘ఇవ్వకండి,’ ‘వేయకండి’) వాడబడ్డాయి. భాష సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, రూపకాల తీవ్రతను తగ్గించకుండా రూపొందించబడింది. రెండు గ్రీకు నిషేధాలను తెలుగులో రెండు వాక్యాలుగా విభజించడం ద్వారా స్పష్టత పెంచబడింది; తరువాతి హెచ్చరిక వాటి ఫలితంగా అనుసంధానించబడింది.
