revisions:
- from: పవిత్రమైనదాన్ని కుక్కలకు ఇవ్వకండి[a]. మీ ముత్యాలను పందుల ముందు వేయకండి[b]. అలా చేస్తే, అవి వాటిని తమ కాళ్ల కింద తొక్కివేసి, ఆపై మీ మీదికి తిరిగి మిమ్మల్ని చీల్చివేయవచ్చు[c].
  to: పవిత్రమైనదాన్ని కుక్కలకు ఇవ్వకండి[a]; అలాగే మీ ముత్యాలను పందుల ముందు వేయకండి[b]. లేకపోతే, అవి వాటిని తమ కాళ్ల కింద తొక్కి, తిరిగి మిమ్మల్ని చీల్చివేయవచ్చు[c].
  rationale: The revision more directly represents μήποτε as a warning (‘లేకపోతే’), smooths the coordination of the two prohibitions, and uses ‘తొక్కి’ to preserve the exact trampling image without added force. It retains the source’s ambiguity about all four metaphors and preserves every existing footnote anchor.
