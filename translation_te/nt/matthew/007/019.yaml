id: MAT.7.19
reference: Matthew 7:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: te
  text: మంచి ఫలాన్ని ఇవ్వని ప్రతి చెట్టూ నరికివేయబడి అగ్నిలోకి వేయబడుతుంది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మంచి ఫలాన్ని కాయని.’
    reason: lexical_alternative
  - marker: b
    text: ‘అగ్ని’ తీర్పుకు ప్రతీక. ఇక్కడ ప్రధానంగా తాత్కాలిక తీర్పునా, అంత్యకాల తీర్పునా, లేక రెండింటినీ సూచిస్తున్నదా అనే విషయాన్ని ఈ వాక్యం మరింత ఖచ్చితంగా చెప్పదు.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: ప్రతి చెట్టూ
  rationale: ఏకవచన నామవాచకంతో ఉన్న πᾶν ఒక్కొక్క చెట్టును విడివిడిగా సూచిస్తుంది. ‘ప్రతి చెట్టూ’ తెలుగు భాషలో సహజంగా ఉండి, సామెతలాంటి వాక్యబలాన్ని నిలుపుతుంది.
- source_word: μὴ ποιοῦν
  choice: ఫలించని
  rationale: వర్తమాన కృదంతం చెట్టు యొక్క నిరంతర లేదా లక్షణాత్మక క్రియను సూచిస్తుంది. పండ్ల సందర్భంలో ‘ఫలించు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం; ποιέω యొక్క అక్షరార్థమైన ‘చేయు’ కంటే ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: καρπὸν καλὸν
  choice: మంచి ఫలం
  rationale: καλός ఇక్కడ మంచి, యోగ్యమైన, సత్ఫలితాన్ని సూచిస్తుంది. ‘మంచి ఫలం’ సందర్భంలోని నైతిక మూల్యాంకనాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐκκόπτεται
  choice: నరికివేయబడి
  rationale: ఈ వర్తమాన కర్మణి రూపం అటువంటి చెట్టుకు సాధారణంగా జరిగేదాన్ని తెలియజేస్తుంది. మొత్తం చెట్టును తొలగించే భావానికి ‘నరికివేయబడి’ సహజమైన సమానార్థకం.
- source_word: εἰς πῦρ βάλλεται
  choice: అగ్నిలో వేయబడుతుంది
  rationale: βάλλεται కర్మణి రూపం; εἰς అగ్నిలోనికి కదలికను సూచిస్తుంది. గ్రీకులో πῦρ నిర్దిష్ట ఉపపదం లేకుండా ఉన్నందున, ‘ఆ అగ్ని’ అని నిర్దిష్టం చేయకుండా ‘అగ్నిలో’ అని అనువదించడం మూలానికి సమీపంగా ఉంటుంది.
theological_decisions:
- issue: అగ్ని సూచించే తీర్పు స్వరూపం
  choice: చెట్టును నరికి అగ్నిలో వేయడం అనే తీర్పు చిత్రాన్ని అలాగే ఉంచి, అగ్ని యొక్క ఖచ్చితమైన సూచనను నిర్దేశించలేదు.
  alternative: దీనిని కేవలం తాత్కాలిక తీర్పుగా, అంత్యకాల తీర్పుగా, లేదా నరకంగా స్పష్టీకరించడం.
  rationale: వాక్యం తీర్పు హెచ్చరికను స్పష్టంగా ఇస్తుంది; అయితే దాని కాలం లేదా ఖచ్చితమైన స్వరూపాన్ని ఈ వాక్యమే నిర్దేశించదు. అందువల్ల అనువాదం ఆ దైవశాస్త్రీయ ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్య నిర్మాణం ఉపయోగించబడింది. ‘ఫలించని’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతూ చెట్టు–ఫలం రూపకాన్ని నిలుపుతుంది; కర్మణి రూపాలు గ్రీకు నిర్మాణాన్ని సంరక్షిస్తాయి.
