revisions:
- from: మంచి ఫలం ఫలించని ప్రతి చెట్టూ నరికివేయబడి, అగ్నిలో వేయబడుతుంది.[a][b]
  to: మంచి ఫలాన్ని ఇవ్వని ప్రతి చెట్టూ నరికివేయబడి అగ్నిలోకి వేయబడుతుంది.[a][b]
  rationale: The revision improves contemporary Telugu idiom for a tree’s fruit-bearing while preserving the ongoing/characteristic force of μὴ ποιοῦν. It also changes ‘అగ్నిలో’ to ‘అగ్నిలోకి’ to reflect εἰς πῦρ’s directional sense. The revised alternative footnote is distinct from the main rendering and idiomatic in the tree-and-fruit metaphor. No doctrinal specification has been added.
