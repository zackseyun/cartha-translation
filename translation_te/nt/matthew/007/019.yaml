review_pass:
  verdict: revise
  source_fidelity: The draft preserves the distributive scope ('every tree'), the characteristic negative participle, the evaluative 'good fruit,' and the two passive judgment actions. However, εἰς πῦρ is more precisely represented by Telugu directional 'అగ్నిలోకి' rather than locative 'అగ్నిలో.'
  naturalness: ‘మంచి ఫలం ఫలించని’ is understandable but somewhat repetitive and literary in modern standard Telugu. ‘మంచి ఫలాన్ని ఇవ్వని’ is clearer and idiomatic for a tree while retaining the source sense of producing/bearing fruit. The passive sequence remains appropriately formal and natural.
  terminology: ‘మంచి ఫలం,’ ‘నరికివేయబడి,’ and ‘అగ్ని’ preserve the agricultural and judgment imagery without defining the fire as hell or assigning a particular timing. The judgment footnote appropriately retains that interpretive openness.
  issues:
  - severity: low
    issue: The current wording uses locative ‘అగ్నిలో’ for Greek εἰς πῦρ.
    rationale: The Greek preposition εἰς expresses movement into the fire. ‘అగ్నిలోకి’ conveys this direction more accurately.
  - severity: low
    issue: ‘మంచి ఫలం ఫలించని’ is stylistically repetitive.
    rationale: ‘ఫలించు’ can work, but ‘మంచి ఫలాన్ని ఇవ్వని’ is more idiomatic modern Telugu and directly conveys the tree’s failure to produce/bear the required fruit.
  revised_text: మంచి ఫలాన్ని ఇవ్వని ప్రతి చెట్టూ నరికివేయబడి అగ్నిలోకి వేయబడుతుంది.[a][b]
