id: MAT.7.15
reference: Matthew 7:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: te
  text: “అబద్ధ ప్రవక్తల పట్ల జాగ్రత్తగా ఉండండి.[a] వారు గొర్రెల దుస్తులు ధరించి[b] మీ దగ్గరికి వస్తారు; కానీ లోపల వారు కబళించే తోడేళ్లు.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అబద్ధ ప్రవక్తల విషయంలో అప్రమత్తంగా ఉండండి.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “గొర్రెల దుస్తుల్లో.”
    reason: lexical_alternative
  - marker: c
    text: ἅρπαγες అనే పదానికి “దోచుకునే,” “పట్టుకొని లాక్కునే” అనే భావాలు కూడా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: విషయంలో జాగ్రత్తగా ఉండండి
  rationale: వర్తమాన ఆజ్ఞారూపం నిరంతర అప్రమత్తతను కోరుతుంది; ἀπό ఇక్కడ ఎవరిపట్ల జాగ్రత్తగా ఉండాలో సూచిస్తుంది. ఈ తెలుగు ప్రయోగం హెచ్చరిక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ψευδοπροφητῶν
  choice: అబద్ధ ప్రవక్తలు
  rationale: ప్రవక్తలమని చెప్పుకుంటూ అసత్యంగా మాట్లాడేవారిని సూచించే స్థిరమైన, సులభంగా అర్థమయ్యే తెలుగు పదబంధం.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: వారు … మీ దగ్గరికి వస్తారు
  rationale: వారి స్వభావాన్ని వివరించే సంబంధ వాక్యాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో అందిస్తుంది; వర్తమాన కాల భావాన్ని నిలుపుతుంది.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: గొర్రెల వేషంలో
  rationale: అక్షరార్థంగా ‘గొర్రెల దుస్తుల్లో’; బాహ్యంగా హానిలేనివారిలా కనిపించడాన్ని తెలిపే రూపకాన్ని సహజమైన తెలుగులో ‘వేషంలో’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἔσωθεν δέ
  choice: కాని లోపల
  rationale: బాహ్య రూపానికీ అంతర్గత వాస్తవానికీ మధ్య ఉన్న బలమైన వ్యత్యాసాన్ని నేరుగా నిలుపుతుంది.
- source_word: λύκοι ἅρπαγες
  choice: కబళించే తోడేళ్లు
  rationale: ἅρπαγεςలోని పట్టుకొని లాక్కునే, దోచే, నాశనం చేసే మృగస్వభావాన్ని ‘కబళించే’ అనే సజీవమైన తెలుగు పదం వ్యక్తం చేస్తుంది; తోడేళ్ల రూపకాన్ని యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: మోసపూరిత ఆధ్యాత్మిక నాయకుల గురించి హెచ్చరిక స్వరూపం
  choice: కపటమైన బాహ్య రూపానికీ విధ్వంసకరమైన అంతర్గత స్వభావానికీ మధ్య వ్యత్యాసాన్ని నేరుగా అనువదించడం
  alternative: ఈ హెచ్చరికను తరువాతి కాలంలోని ఏదైనా నిర్దిష్ట మతసంస్థకు లేదా సిద్ధాంతపరమైన వర్గానికి పరిమితం చేయడం
  rationale: గ్రీకు పాఠం అబద్ధ ప్రవక్తలను వారి మోసపూరిత రూపం, కబళించే స్వభావం ద్వారా గుర్తిస్తుంది; అది స్పష్టంగా చెప్పని తరువాతి సంఘ లేదా సంప్రదాయ వర్గాలను అనువాదంలో చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే హెచ్చరికలోని గంభీరతను మరియు గొర్రెలు–తోడేళ్ల రూపకంలోని తీవ్ర వ్యత్యాసాన్ని నిలుపుతూ రూపొందించబడింది.
