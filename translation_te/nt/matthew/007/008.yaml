source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: te
  text: ఎందుకంటే అడిగే ప్రతి ఒక్కరూ పొందుతారు; వెదికేవారు కనుగొంటారు; తట్టేవారికి తెరవబడుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తట్టేవారికి అది తెరవబడుతుంది.” గ్రీకు పాఠ్యంలో “తలుపు” అని స్పష్టంగా లేదు; తట్టడం అనే రూపకం ద్వారా అది సూచితమవుతోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: ప్రతి ఒక్కరూ
  rationale: ఆర్టికల్‌తో కూడిన కృదంతానికి వర్తించే సార్వత్రిక పరిధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలోని ప్రోత్సాహానికి ఈ వాక్యం ఇచ్చే వివరణాత్మక కారణసంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ αἰτῶν
  choice: అడిగే
  rationale: ఆర్టికల్‌తో కూడిన వర్తమాన కృదంతం సూచించే సాధారణంగా లేదా కొనసాగుతూ అడిగే వ్యక్తిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λαμβάνει
  choice: పొందుతారు
  rationale: λαμβάνω యొక్క సాధారణ అర్థాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో ఇస్తుంది; వాక్యంలోని సాధారణ సత్యానికి అనుగుణంగా ఉంది.
- source_word: ὁ ζητῶν
  choice: వెదికేవారు
  rationale: రెండవ సమాంతర భాగంలోని వ్యక్తివాచక కృదంత నిర్మాణాన్ని, లయను నిలుపుతుంది.
- source_word: εὑρίσκει
  choice: కనుగొంటారు
  rationale: సందర్భానికి తగిన సూటి అర్థం; అడగడం–వెదకడం–తట్టడం అనే స్మరణీయ సమాంతరతను కాపాడుతుంది.
- source_word: τῷ κρούοντι
  choice: తట్టేవారికి
  rationale: దత్తి విభక్తి భావాన్ని సహజమైన తెలుగు ‘-కి’ రూపంలో చూపి, తరువాతి కర్మణి క్రియతో నేరుగా అనుసంధానిస్తుంది.
- source_word: ἀνοιγήσεται
  choice: తెరవబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, గ్రీకులో స్పష్టంగా లేని ‘తలుపు’ అనే కర్తను ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: వాగ్దానపు పరిధి మరియు బలం
  choice: సార్వత్రిక పదాలతో చెప్పబడిన సాధారణ హామీగా అనువదించడం
  alternative: ప్రతి ప్రత్యేక అభ్యర్థన అడిగినట్టుగానే తప్పక నెరవేరుతుందని గానీ, ఇది కొన్ని ఆధ్యాత్మిక అభ్యర్థనలకే పరిమితమని గానీ అనువాదంలో నిర్ణయించడం
  rationale: మూలవాక్యం ‘ప్రతి ఒక్కరూ’ అనే విస్తృత భాషను ఉపయోగిస్తుంది. సందర్భానికి అతీతమైన సంపూర్ణ హామీని లేదా పాఠ్యంలో లేని పరిమితిని అనువాదం దిగుమతి చేయకుండా, అసలు వాక్యంలోని వ్యాఖ్యానాత్మక ఉద్రిక్తతను నిలుపుతుంది.
- issue: తెరవబడే దాని గుర్తింపు
  choice: కర్తను పేర్కొనకుండా ‘తెరవబడుతుంది’ అని ఉంచడం
  alternative: ‘తలుపు తెరవబడుతుంది’ అని స్పష్టీకరించడం
  rationale: తట్టడం అనే రూపకం తలుపును సూచించినా, గ్రీకు పాఠ్యంలో ‘తలుపు’ అనే పదం లేదు. అందువల్ల దానిని ప్రధాన పాఠ్యంలో చేర్చకుండా నిజమైన అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూడు సమాంతర క్రియాభాగాల లయను నిలుపుతూ, గ్రీకు పాఠ్యంలో లేని ‘తలుపు’ను ప్రధాన వాక్యంలో చేర్చలేదు. బహువచన గౌరవ/సామాన్య రూపాలు తెలుగులో లింగనిరపేక్ష సాధారణ వాక్యానికి అనుకూలంగా ఉపయోగించబడ్డాయి.
