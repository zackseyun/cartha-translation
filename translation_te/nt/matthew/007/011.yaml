id: MAT.7.11
reference: Matthew 7:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: te
  text: కాబట్టి, మీరు చెడ్డవారై ఉండి కూడా మీ పిల్లలకు మంచి బహుమతులు ఇవ్వడం తెలిసి ఉంటే, ఆకాశాలలో ఉన్న మీ తండ్రి ఆయనను అడిగేవారికి మంచి విషయాలను ఇంకెంత ఎక్కువగా ఇస్తాడు!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηροὶ ὄντες
  choice: చెడ్డవారై ఉండి కూడా
  rationale: గ్రీకు కృదంత నిర్మాణంలోని వివరణాత్మక భావంతో పాటు సందర్భంలోని concessive భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; దీనిని ‘పాపులు’ వంటి విస్తృత సిద్ధాంత పదంగా మార్చదు.
- source_word: οἴδατε ... διδόναι
  choice: ఇవ్వడం తెలిసినవారైతే
  rationale: ఇది కేవలం జ్ఞానాన్ని కాక, ఇవ్వగల ప్రాయోగిక అవగాహనను సూచిస్తుంది; తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉంటుంది.
- source_word: δόματα ἀγαθὰ
  choice: మంచి బహుమతులు
  rationale: δόματα అనే నామవాచకాన్ని ‘బహుమతులు’గా, దానిని విశేషించే ἀγαθὰను ‘మంచి’గా నేరుగా ప్రతిబింబిస్తుంది.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: మీ పిల్లలకు
  rationale: τέκνα లింగ సమావేషక పదం; ‘పిల్లలు’ ఆధునిక తెలుగులో సహజంగా కుమారులు, కుమార్తెలు ఇద్దరినీ సూచిస్తుంది.
- source_word: πόσῳ μᾶλλον
  choice: ఇంకెంత ఎక్కువగా
  rationale: తక్కువదానినుంచి ఎక్కువదానికి చేసే వాదనను తెలుగులో స్పష్టమైన తులనాత్మక ప్రయోగంతో వ్యక్తపరుస్తుంది.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: పరలోకాలలో ఉన్న మీ తండ్రి
  rationale: πατήρను ‘తండ్రి’గా ఉంచి, బహువచన τοῖς οὐρανοῖςను ‘పరలోకాలలో’గా ప్రతిబింబిస్తుంది; విశేషణ రూపమైన ‘పరలోకపు తండ్రి’గా మార్చదు.
- source_word: δώσει ἀγαθὰ
  choice: మంచి వాటిని ... ఇస్తాడు
  rationale: రెండో భాగంలో δόματα పునరుక్తం కాలేదు; నామవాచకంగా వాడిన ἀγαθὰను ‘మంచి వాటిని’గా అనువదించడం వల్ల ‘బహుమతులు’ అనే పదాన్ని అనవసరంగా చేర్చడం జరగదు.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: తనను అడిగేవారికి
  rationale: వర్తమాన కృదంతం సూచించే సాధారణ వర్గాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; αὐτόνకు ‘తనను’ అనే అన్వయస్పష్ట రూపం వాడబడింది.
theological_decisions:
- issue: ‘మీరు చెడ్డవారై ఉండి’ అనే మానవ స్వభావ వర్ణన యొక్క బలం
  choice: చెడ్డవారై ఉండి కూడా
  alternative: పాపులై ఉన్నా / లోపాలున్నవారైనా
  rationale: యేసు పలికిన ప్రత్యక్షమైన ‘చెడ్డవారు’ అనే వర్ణనను మృదువుచేయకుండా నిలుపుతుంది; అదే సమయంలో సంపూర్ణ మానవ పతనం వంటి విస్తృత సిద్ధాంత వివరణను వచనంలో చేర్చదు.
- issue: ὁ ἐν τοῖς οὐρανοῖςలోని బహువచన రూపం
  choice: పరలోకాలలో ఉన్న మీ తండ్రి
  alternative: పరలోకంలో ఉన్న మీ తండ్రి / మీ పరలోకపు తండ్రి
  rationale: గ్రీకులోని బహువచన స్థానవాచక నిర్మాణాన్ని పారదర్శకంగా నిలుపుతుంది; సంప్రదాయ ఏకవచన రూపానికి అనుగుణంగా మూలాన్ని సమతలీకరించదు.
- issue: రెండో ఉపవాక్యంలో ἀγαθὰకు δόματαను పూరించడం
  choice: మంచి వాటిని
  alternative: మంచి బహుమతులను
  rationale: మూల గ్రీకులో రెండోసారి ‘బహుమతులు’ అనే నామవాచకం లేదు. అందువల్ల భావసామ్యాన్ని ఉంచుతూ పదాన్ని పునఃచేర్చకుండా మూల నిర్మాణ భేదాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని షరతు–తులన నిర్మాణాన్ని సహజమైన తెలుగు క్రమంలో ఉంచి, చివర ఆశ్చర్యార్థక స్వరం ద్వారా πόσῳ μᾶλλον యొక్క వాక్చాతుర్య బలాన్ని తెలిపింది.
