  yaml_path: translation/nt/matthew/007/001.yaml
  text: Do not judge[a], so that you may not be judged.
translation:
  language: te
  text: తీర్పు తీర్చకండి[a]; మీరు తీర్పు తీర్చబడకుండునట్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఖండించకండి; మీరు ఖండించబడకుండునట్లు.” గ్రీకు క్రియ కొన్ని సందర్భాల్లో ‘ఖండించడం’ అనే అర్థాన్ని ఇవ్వగలదు; అయితే ‘తీర్పు తీర్చడం’ విస్తృతమైన అర్థాన్ని ఇస్తుంది, అలాగే ఈ వచనంలోని పదపునరుక్తిని నిలుపుతుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: తీర్చకండి
  rationale: వర్తమాన ఆజ్ఞార్థక క్రియతో కలిసి Μὴ నిషేధాన్ని తెలియజేస్తుంది. తెలుగులో క్రియకు ‘-కండి’ జోడించడం గౌరవప్రదమైన బహువచన నిషేధాజ్ఞను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κρίνετε
  choice: తీర్పు తీర్చకండి
  rationale: κρίνω అనే క్రియకు తీర్పు చెప్పడం, మదింపు చేయడం, ఖండించడం వంటి విస్తృత అర్థపరిధి ఉంది. ‘తీర్పు తీర్చడం’ ఆ విస్తృతిని నిలుపుతూ, రెండవ ఉపవాక్యంలోని అదే క్రియతో ఉన్న పదపునరుక్తిని కూడా కాపాడుతుంది.
- source_word: ἵνα
  choice: తద్వారా
  rationale: ἵνα తరువాతి సంభావనార్థక క్రియతో కలిసి ఉద్దేశం లేదా ఫలిత సంబంధాన్ని సూచిస్తుంది. ‘తద్వారా’ రెండు ఉపవాక్యాల మధ్య ఆ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: μὴ
  choice: తీర్చబడదు
  rationale: రెండవ Μὴ నిషేధాన్ని తెలుగులో నిషేధాత్మక క్రియారూపమైన ‘-బడదు’ ద్వారా వ్యక్తం చేశాం.
- source_word: κριθῆτε
  choice: మీపై తీర్పు తీర్చబడదు
  rationale: ఇది κρίνω యొక్క కర్మణి సంభావనార్థక రూపం. మొదటి ఉపవాక్యంతో పదసంబంధం, వాక్యంలోని అలంకార సమతుల్యత నిలిచేలా అదే ‘తీర్పు తీర్చు’ మూలపదబంధాన్ని కర్మణి రూపంలో వాడాం. తెలుగులో తీర్పు ఎవరి విషయంలోనో సహజంగా చెప్పడానికి ‘మీపై’ చేర్చాం.
theological_decisions:
- issue: యేసు నిషేధంలో κρίνω యొక్క పరిధి
  choice: అర్థాన్ని ‘ఖండించడం’కు మాత్రమే పరిమితం చేయకుండా విస్తృతమైన ‘తీర్పు తీర్చడం’ను ఉంచడం.
  alternative: ఖండించకండి; తద్వారా మీరూ ఖండించబడరు.
  rationale: ఈ నిషేధం ఏ విధమైన తీర్పును ఉద్దేశిస్తుందో 7:2–5 సమీప సందర్భం మరింత స్పష్టం చేస్తుంది; అయితే ఈ వచనం ఒక్కటే నైతిక వివేచనకు సంబంధించిన అన్ని హద్దులను పేర్కొనదు. విస్తృత పదాన్ని ఉంచడం వల్ల సందర్భమే దాని పరిధిని నిర్వచించగలదు; అనువాదం ఒక సంకుచిత సిద్ధాంతార్థాన్ని ముందుగానే రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాన్ని వాడాం. ‘తీర్పు తీర్చడం’ కొంత గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే, బైబిలు సందర్భానికి తగిన పదబంధం. మొదటి మరియు రెండవ ఉపవాక్యాల్లో ఒకే మూలపదబంధాన్ని ఉంచి గ్రీకు వాక్యంలోని సమతుల్యతను కాపాడాం.
