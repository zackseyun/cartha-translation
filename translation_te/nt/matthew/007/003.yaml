id: MAT.7.3
reference: Matthew 7:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: te
  text: నీ సోదరుని[b] కంటిలో ఉన్న నలుసును[a] ఎందుకు చూస్తావు, కానీ నీ సొంత కంటిలో ఉన్న దూలాన్ని[c] గమనించవు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నలుసు’ (κάρφος) అనే పదాన్ని ‘చిన్న పుడక,’ ‘గడ్డిపోచ,’ లేదా ‘పొట్టు ముక్క’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘సోదరుడు’; మూలపాఠంలోని పుంలింగ ఏకవచనం ఇక్కడ నిలుపబడింది.
    reason: lexical_alternative
  - marker: c
    text: ‘దూలం’ (δοκός) అనే పదాన్ని ‘పెద్ద కొయ్య’ లేదా ‘చెక్క దిమ్మె’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: ఎందుకు
  rationale: βλέπειςతో కూడిన ఈ ప్రశ్నలో τί అక్షరార్థమైన ‘ఏమి’ కంటే ‘ఎందుకు’ అనే ప్రశ్నార్థక భావాన్ని ఇస్తుంది.
- source_word: δὲ
  choice: అయితే / కానీ
  rationale: మొదటి δέ ముందటి బోధతో అనుసంధానించే స్వల్ప మలుపును, రెండవ δέ రెండు కంటి చిత్రాల మధ్య వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: βλέπεις
  choice: చూస్తావు
  rationale: కంటికి సంబంధించిన ప్రత్యక్ష చిత్రాన్ని నిలుపుతూ, κατανοεῖςతో ఉన్న పదభేదాన్ని కూడా కాపాడుతుంది.
- source_word: κάρφος
  choice: నలుసు
  rationale: కంటిలో పడగల చిన్న పొడి ముక్క లేదా రేణువు అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, భారీ దూలంతో ఉన్న అతిశయోక్తి వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἀδελφοῦ
  choice: సోదరుని
  rationale: మూలంలోని పుంలింగ ఏకవచన బంధుత్వ పదాన్ని అనవసరంగా లింగతటస్థం చేయకుండా నిలుపుతుంది.
- source_word: σῷ
  choice: నీ సొంత
  rationale: నీ సోదరుని కన్నుకు విరుద్ధంగా నీకే చెందిన కన్ను అనే ఉద్ఘాటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δοκόν
  choice: దూలాన్ని
  rationale: δοκός భవన నిర్మాణంలో ఉపయోగించే పెద్ద చెక్క దూలాన్ని సూచిస్తుంది; చిన్న నలుసుతో ఉన్న ఉద్దేశపూర్వక అతిశయోక్తిని స్పష్టంగా ఉంచుతుంది.
- source_word: οὐ κατανοεῖς
  choice: గమనించవు
  rationale: కేవలం చూడడం కంటే శ్రద్ధగా గుర్తించడం అనే భావాన్ని ఇస్తూ βλέπειςతో ఉన్న వ్యంగ్యభరిత వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ὀφθαλμῷ
  choice: కంటిలో
  rationale: ఈ దృశ్యరూపకంలో ὀφθαλμόςకు సహజమైన ప్రామాణిక తెలుగు సమానం.
theological_decisions:
- issue: ἀδελφοῦ అనే లింగసూచక బంధుత్వ పదం
  choice: సోదరుని
  alternative: సోదరుని లేదా సోదరిని; తోటి విశ్వాసి
  rationale: ఈ మాట విస్తృతంగా వర్తించినప్పటికీ, గ్రీకు మూలం పుంలింగ ఏకవచనాన్ని వాడుతుంది. అందువల్ల వివరణాత్మకంగా విస్తరించకుండా మూల రూపాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే ప్రశ్నారూపాన్ని ఉపయోగించాం. ‘నలుసు—దూలం’ జంట మూలంలోని చిన్నది–అతి పెద్దది అనే హాస్యాత్మక అతిశయోక్తిని స్పష్టంగా వినిపిస్తుంది; ‘చూస్తావు—గమనించవు’ జంట గ్రీకు క్రియల మధ్య భేదాన్ని నిలుపుతుంది.
