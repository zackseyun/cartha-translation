source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: te
  text: ఇరుకు ద్వారం గుండా ప్రవేశించండి. ఎందుకంటే ద్వారం వెడల్పుగా ఉంటుంది, నాశనానికి[a] నడిపించే దారి విశాలంగా ఉంటుంది; ఆ ద్వారం గుండా ప్రవేశించేవారు అనేకులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వినాశానికి,’ ‘పాడైపోవడానికి.’ గ్రీకు పదం ἀπώλεια నాశనం, వినాశం లేదా పాడైపోవడం అనే భావాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: ప్రవేశించండి
  rationale: రెండవ పురుష బహువచన ఆజ్ఞను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు రూపంలో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: διὰ τῆς στενῆς πύλης
  choice: ఇరుకు ద్వారం గుండా
  rationale: διά + షష్ఠీ విభక్తి సూచించే ‘గుండా’ అనే చలన భావాన్ని నిలుపుతుంది; στενόςకు ‘ఇరుకు’ సహజమైన స్థలార్థక సమానం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణం లేదా వివరణను పరిచయం చేసే గ్రీకు సంధానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πλατεῖα ἡ πύλη
  choice: ద్వారం వెడల్పుగా
  rationale: πλατύς యొక్క స్థలార్థాన్ని సహజమైన తెలుగులో ఇస్తూ, ఇరుకు ద్వారంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: దారి విశాలంగా
  rationale: εὐρύχωροςలోని వెడల్పైన లేదా విస్తారమైన భావాన్ని ‘విశాలంగా’ సహజంగా వ్యక్తపరుస్తుంది; ὁδόςకు ‘దారి’ రూపకాన్నీ సాధారణ వాడుకనూ కాపాడుతుంది.
- source_word: ἡ ἀπάγουσα
  choice: నడిపించే
  rationale: దారి ఒక గమ్యానికి తీసుకువెళ్తుందనే వర్తమాన కృదంత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τὴν ἀπώλειαν
  choice: నాశనానికి
  rationale: ἀπώλεια సూచించే వినాశకరమైన అంతాన్ని గంభీరంగా తెలియజేస్తుంది; దాని పూర్తి సిద్ధాంతార్థాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: దాని గుండా ప్రవేశించేవారు అనేకులు
  rationale: ‘అనేకులు’ అనే గ్రీకు ఉద్ఘాటనను నిలుపుతూ, αὐτῆςను సర్వనామంతో ప్రతిబింబిస్తుంది. గ్రీకులో స్త్రీలింగ సర్వనామం ‘ద్వారం’ వైపు సూచిస్తుంది; తెలుగులో నామవాచకాన్ని మళ్లీ చేర్చకుండా మూల నిర్మాణాన్ని సాధ్యమైనంతవరకు కాపాడుతుంది.
theological_decisions:
- issue: ἀπώλεια అనే పదం సూచించే అంతం
  choice: నాశనం
  alternative: పాడైపోవడం; వినాశం
  rationale: వాక్యం హెచ్చరించే ఘోరమైన అంతాన్ని ఇది స్పష్టంగా తెలియజేస్తుంది; అయితే ఆ అంతం యొక్క సంపూర్ణ సిద్ధాంత స్వరూపాన్ని పాఠ్యం చెప్పినదానికంటే ఎక్కువగా నిర్వచించదు.
- issue: చివరి αὐτῆς సర్వనామం యొక్క పూర్వపదం
  choice: దాని గుండా
  alternative: ఆ ద్వారం గుండా
  rationale: గ్రీకు వ్యాకరణంలో స్త్రీలింగ αὐτῆς స్త్రీలింగ πύλη (‘ద్వారం’)తో సరిపోతుంది. అయినప్పటికీ మూలంలో నామవాచకం పునరుక్తి కాలేదు కాబట్టి తెలుగు ప్రధాన పాఠ్యంలో సర్వనామాన్నే ఉంచి, అనవసర వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినప్పటికీ యేసు హెచ్చరికకు తగిన గంభీరతతో రూపొందించబడింది. ‘ఇరుకు—వెడల్పు/విశాలం’ అనే వ్యత్యాసం స్పష్టంగా నిలుపబడింది.
