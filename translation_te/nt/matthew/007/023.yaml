revisions:
- from: 'అప్పుడు నేను వారికి బహిరంగంగా ఇలా ప్రకటిస్తాను: ‘నేను మిమ్మల్ని ఎన్నడూ ఎరుగను[a]. నా దగ్గర నుండి వెళ్లిపోండి—అక్రమం చేసేవారలారా![b]’'
  to: 'అప్పుడు నేను వారికి బహిరంగంగా ఇలా ప్రకటిస్తాను: ‘నేను మిమ్మల్ని ఎన్నడూ ఎరుగలేదు[a]. నా దగ్గర నుండి వెళ్లిపోండి—అక్రమాన్ని ఆచరించేవారలారా![b]’'
  rationale: The revision corrects the source-relevant past reference in ‘I never knew you’ while retaining the biblical relational wording and its intended ambiguity. It also refines the final characterization to express habitual lawless practice. The declaration, dismissal, solemn register, and footnote anchors are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:30:59Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse's sequence, judicial declaration, emphatic ‘never,’ dismissal command, and the characterization of the addressees by lawless conduct. However, ‘ఎన్నడూ ఎరుగను’ is grammatically present-oriented and does not adequately represent ἔγνων (‘I knew’) with Οὐδέποτε. ‘ఎన్నడూ ఎరుగలేదు’ correctly retains the completed/past reference without resolving its relational nuance.
  naturalness: The register is generally clear and suitably solemn. ‘ఎరుగలేదు’ remains understandable biblical-register Telugu, while being more grammatically natural in this context. ‘అక్రమాన్ని ఆచరించేవారలారా’ more clearly expresses characteristic practice than the less specific ‘అక్రమం చేసేవారలారా.’
  terminology: ‘బహిరంగంగా ప్రకటిస్తాను’ suitably renders the formal force of ὁμολογήσω, though ‘బహిరంగంగా’ is interpretive rather than strictly required. ‘అక్రమం’ retains the moral-legal sense of ἀνομία better than the footnoted broader alternatives. No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: The main text renders ἔγνων as ‘ఎరుగను.’
    rationale: With ‘ఎన్నడూ,’ this means ‘I never know/do not ever know’ in Telugu rather than the Greek aorist assertion, ‘I never knew you.’ Revising to ‘ఎరుగలేదు’ preserves the source tense/aspect and the relational idiom.
  - severity: low
    issue: ‘అక్రమం చేసేవారలారా’ is somewhat less precise for οἱ ἐργαζόμενοι τὴν ἀνομίαν.
    rationale: The Greek participle identifies people characterized by doing/practising lawlessness. ‘అక్రమాన్ని ఆచరించేవారలారా’ conveys this ongoing, characteristic conduct more naturally and precisely.
  revised_text: 'అప్పుడు నేను వారికి బహిరంగంగా ఇలా ప్రకటిస్తాను: ‘నేను మిమ్మల్ని ఎన్నడూ ఎరుగలేదు[a]. నా దగ్గర నుండి వెళ్లిపోండి—అక్రమాన్ని ఆచరించేవారలారా![b]’'
