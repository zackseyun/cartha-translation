id: MAT.7.23
reference: Matthew 7:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: te
  text: 'అప్పుడు నేను వారికి బహిరంగంగా ఇలా ప్రకటిస్తాను: ‘నేను మిమ్మల్ని ఎన్నడూ ఎరుగలేదు[a]. నా దగ్గర నుండి వెళ్లిపోండి—అక్రమాన్ని ఆచరించేవారలారా![b]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను మిమ్మల్ని ఎన్నడూ గుర్తించలేదు/అంగీకరించలేదు.’ ఇక్కడ ‘ఎరుగుట’ అనేది కేవలం ఎవరో తెలిసి ఉండడాన్ని కాక సంబంధపూర్వక గుర్తింపును కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దుష్టత్వం చేసేవారలారా!’ / ‘అన్యాయం చేసేవారలారా!’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: అప్పుడు
  rationale: ముందటి సందర్భంతో అనుసంధానమైన కాలక్రమాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. వాక్యారంభంలోని καίని విడిగా ‘మరియు’ అని అనువదించకపోయినా అనుసంధానం నిలుస్తుంది.
- source_word: ὁμολογήσω
  choice: బహిరంగంగా ప్రకటిస్తాను
  rationale: ఇక్కడ తప్పును ఒప్పుకోవడం కాదు; అందరి ఎదుట స్పష్టంగా ప్రకటించడం అనే న్యాయతీర్పు సంబంధమైన భావం ఉంది.
- source_word: Οὐδέποτε
  choice: ఎన్నడూ
  rationale: ఏ కాలంలోనూ కాదు అనే సంపూర్ణ, బలమైన నిరాకరణను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἔγνων
  choice: ఎరుగను
  rationale: కేవలం సమాచారం తెలిసి ఉండడం కంటే సంబంధపూర్వకంగా తెలుసుకోవడం లేదా గుర్తించడం అనే విస్తృత భావాన్ని ఉంచుతుంది. గ్రీకు భూతకాల రూపం తెలుగులో ‘ఎన్నడూ ఎరుగను’ అనే సహజ నుడికారంతో వ్యక్తమవుతుంది.
- source_word: ἀποχωρεῖτε ἀπ’ ἐμοῦ
  choice: నా దగ్గర నుండి వెళ్లిపోండి
  rationale: తిరస్కరించి దూరం పంపే ఆజ్ఞను ఆధునిక, గంభీరమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: οἱ ἐργαζόμενοι
  choice: చేసేవారలారా
  rationale: సంబోధనలో ఉన్న వారిని వారి నిరంతర లేదా లక్షణాత్మక ప్రవర్తన ఆధారంగా గుర్తిస్తుంది.
- source_word: τὴν ἀνομίαν
  choice: అక్రమం
  rationale: ధర్మానికి లేదా దేవుని నియమానికి విరుద్ధంగా ప్రవర్తించడం అనే నైతిక-న్యాయ భావాన్ని ‘దుష్టత్వం’ వంటి మరింత సాధారణ పదం కంటే దగ్గరగా నిలుపుతుంది.
theological_decisions:
- issue: ‘నేను మిమ్మల్ని ఎన్నడూ ఎరుగను’ అనే మాట భావం
  choice: సంబంధపూర్వకమైన ‘ఎరుగను’ అనే నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
  alternative: ‘నేను మిమ్మల్ని ఎన్నడూ అంగీకరించలేదు’ లేదా ‘మీరు ఎన్నడూ నా వారు కాదు.’
  rationale: మూలపాఠం సంబంధపూర్వక జ్ఞానాన్ని నేరుగా చెబుతుంది. దాన్ని ఆమోదం లేదా రక్షణ స్థితి గురించిన సిద్ధాంత వివరణగా మార్చితే పాఠ్యంలో ఉన్న ఉద్దేశపూర్వక భావ ఉద్రిక్తత తొలగిపోతుంది.
- issue: ἀνομία యొక్క నైతిక-న్యాయ బలం
  choice: ‘అక్రమం’ అని అనువదించాం.
  alternative: ‘దుష్టత్వం’ లేదా ‘అన్యాయం.’
  rationale: ఇది సాధారణ చెడుతనాన్ని మాత్రమే కాక నియమం లేదా ధర్మానికి విరుద్ధమైన ప్రవర్తనను సూచిస్తుంది; అయితే ఏ ప్రత్యేక మతశాఖ సిద్ధాంతాన్నీ ఇందులో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన తీర్పు స్వరాన్ని ఉంచాం. ‘ఎరుగను’ బైబిలు నుడికారాన్ని నిలిపినా సాధారణ పాఠకుడికి అర్థమయ్యే పదమే. ‘వెళ్లిపోండి’ సహజమైన ఆధునిక ఆజ్ఞ; ‘అక్రమం చేసేవారలారా’ మూలంలోని ప్రత్యక్ష సంబోధనను నిలుపుతుంది.
