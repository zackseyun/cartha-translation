id: MAT.7.16
reference: Matthew 7:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: te
  text: వారి ఫలాలను బట్టి మీరు వారిని గుర్తుపడతారు.[a] ముళ్లపొదల నుండి ద్రాక్షపండ్లను గానీ, ముళ్లకలుపు మొక్కల నుండి అంజూరపు పండ్లను గానీ ఏరుతారా?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి ఫలాలను బట్టి మీరు వారిని తెలుసుకుంటారు.’
    reason: ἐπιγνώσεσθε అనే పదానికి ‘గుర్తుపడతారు,’ ‘తెలుసుకుంటారు’ అనే రెండూ సందర్భోచితమైన అనువాదాలు.
  - marker: b
    text: ఈ ప్రశ్నకు ‘ఏరరు’ అనే ప్రతికూల సమాధానమే ఆశించబడుతోంది.
    reason: μήτι ప్రతికూల సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్నను సూచిస్తుంది.
lexical_decisions:
- source_word: καρπῶν
  choice: ఫలాలను
  rationale: గ్రీకులోని బహువచనాన్ని నిలుపుతూ, క్రియలు లేదా ఫలితాలు అని వివరణాత్మకంగా మార్చకుండా వ్యవసాయ రూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: ἐπιγνώσεσθε
  choice: గుర్తుపడతారు
  rationale: గమనించగల ఆధారాన్ని బట్టి ఎవరో తెలుసుకోవడం లేదా గుర్తించడం అనే సందర్భార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘పూర్తిగా తెలుసుకుంటారు’ అనే అతిశయార్థాన్ని జోడించదు.
- source_word: μήτι
  choice: కోస్తారా?
  rationale: ప్రతికూల సమాధానాన్ని ఆశించే గ్రీకు ప్రశ్నను తెలుగులో సహజమైన అలంకారిక ప్రశ్నగా అందిస్తుంది.
- source_word: συλλέγουσιν
  choice: కోస్తారా
  rationale: పంట లేదా పండ్లను సేకరించే సందర్భంలో సహజంగా ఉండి వ్యవసాయ దృశ్యాన్ని నిలుపుతుంది.
- source_word: ἀκανθῶν
  choice: ముళ్లపొదల నుంచి
  rationale: ముళ్లు లేదా ముళ్లపొదలు అనే విస్తృత మొక్కల భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: σταφυλὰς
  choice: ద్రాక్షపండ్లను
  rationale: గ్రీకు బహువచనానికి సాధారణమైన స్పష్టమైన తెలుగు సమానం.
- source_word: τριβόλων
  choice: ముళ్ల కలుపుమొక్కల నుంచి
  rationale: ముళ్లుగల హానికరమైన అడవి లేదా కలుపు మొక్కను సూచిస్తూ, ముందున్న ముళ్లపొదలతో ఉన్న సమాంతరతనూ స్వల్ప భేదాన్నీ కాపాడుతుంది.
- source_word: σῦκα
  choice: అంజూర పండ్లను
  rationale: సాధారణ ఆధునిక తెలుగులో సులభంగా అర్థమయ్యే పదబంధం; మూలంలోని బహువచనాన్ని నిలుపుతుంది.
- source_word: αὐτῶν / αὐτούς
  choice: వారి / వారిని
  rationale: సందర్భంలో చెప్పబడిన వ్యక్తులనే సూచించే వ్యక్తివాచక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: మనుషులను వివేచించడంలో ‘ఫలాలు’ అనే రూపకార్థం
  choice: ‘ఫలాలు’ అనే రూపకాన్ని నిలుపడం
  alternative: ‘వారి పనులను బట్టి’ లేదా ‘వారు కలిగించే ఫలితాలను బట్టి’ అని వివరణాత్మకంగా అనువదించడం
  rationale: యేసు ఉపయోగించిన వ్యవసాయ రూపకం క్రియలు, స్వభావం, బోధ ఫలితాలు వంటి భావాలకు తెరవబడి ఉంది. దానిని ఒకే వివరణకు పరిమితం చేయకుండా మూలంలోని అర్థవిస్తృతిని, ధార్మిక ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. వ్యవసాయ రూపకాన్ని, గ్రీకు వాక్యంలోని సమాంతర నిర్మాణాన్ని కాపాడుతూ ‘ముళ్లపొదలు’ మరియు ‘ముళ్ల కలుపుమొక్కలు’ మధ్య ఉన్న స్వల్ప పదభేదాన్ని చూపించాం.
