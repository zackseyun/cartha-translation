id: MAT.7.5
reference: Matthew 7:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: te
  text: కపటివాడా! మొదట నీ కంటిలోనుండి దూలాన్ని[a] తీసివేయి. అప్పుడు నీ సోదరుని కంటిలోనుండి నలుసును[b] తీసివేయడానికి నీకు స్పష్టంగా కనిపిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దూలం’కు ‘కొయ్యదుంగ’ లేదా ‘పలక’ అని కూడా అనువదించవచ్చు (δοκός).
    reason: lexical_alternative
  - marker: b
    text: ‘నలుసు’కు ‘చెక్కపేడు’ లేదా ‘ఎండుగడ్డి ముక్క’ అని కూడా అనువదించవచ్చు (κάρφος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: వేషధారీ!
  rationale: ఏకవచన సంబోధనలోని తీవ్రమైన మందలింపును సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἔκβαλε
  choice: తీసివేయి
  rationale: కంటిలో ఉన్న అడ్డంకిని బయటకు తీయాలనే రూపకానికి సహజంగా సరిపడే ఆజ్ఞారూపం.
- source_word: πρῶτον
  choice: మొదట
  rationale: చర్యల క్రమంలో ముందుగా చేయవలసినదాన్ని నేరుగా సూచిస్తుంది.
- source_word: δοκόν
  choice: దూలాన్ని
  rationale: δοκός సూచించే పెద్ద నిర్మాణపు కొయ్యను తెలియజేసి, చిన్న నలుసుతో ఉన్న అతిశయోక్తి వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ὀφθαλμοῦ
  choice: కంటిలోనుండి
  rationale: శరీర సంబంధ రూపకాన్ని తెలుగులో సహజమైన విభక్తి నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: διαβλέψεις
  choice: నీకు స్పష్టంగా కనిపిస్తుంది
  rationale: διαβλέπω లోని స్పష్టంగా చూడడం అనే బలమైన భావాన్ని సాధారణ ‘కనిపిస్తుంది’ కంటే పూర్తిగా వ్యక్తపరుస్తుంది.
- source_word: ἐκβαλεῖν
  choice: తీసివేయడానికి
  rationale: ముందటి ἔκβαλεతో పదప్రయోగ ఏకరూపతను కాపాడుతూ ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κάρφος
  choice: నలుసును
  rationale: కంటిలో పడే చిన్న పొడి కణం లేదా సన్నని ముక్కను సూచించే సహజ తెలుగు పదం; దూలంతో వ్యత్యాసం స్పష్టంగా ఉంటుంది.
- source_word: ἀδελφοῦ
  choice: సోదరుని
  rationale: గ్రీకులోని పుంలింగ ఏకవచన బంధుత్వ పదాన్ని అనవసరంగా లింగతటస్థం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: ἀδελφοῦ అనే లింగసూచక సంబంధపదం
  choice: సోదరుని
  alternative: తోటి వ్యక్తి యొక్క / పొరుగువాని
  rationale: మూల గ్రీకు పుంలింగ ఏకవచనంగా ఉంది. ‘సోదరుడు’ అనే పదం సమాజంలోని పరస్పర నైతిక బాధ్యత సందర్భాన్నీ నిలుపుతుంది; సందర్భం బలవంతం చేయనందున దాన్ని లింగతటస్థంగా మార్చలేదు.
- issue: διαβλέψεις ἐκβαλεῖν లో స్పష్టంగా చూడడం మరియు తొలగించడం మధ్య సంబంధం
  choice: తీసివేయడానికి నీకు స్పష్టంగా కనిపిస్తుంది
  alternative: తీసివేయగలిగేలా నీకు స్పష్టంగా కనిపిస్తుంది
  rationale: ‘చేయగలగడం’ అనే సామర్థ్యభావాన్ని మూలంలోకంటే స్పష్టంగా చేర్చకుండా, గ్రీకు అనంతరూపం కలిగిన ఉద్దేశ/ఫలిత సంబంధంలోని స్వల్ప అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘వేషధారీ!’ మందలింపు తీవ్రతను నిలుపుతుంది. ‘దూలం—నలుసు’ జంట మూలంలోని అతిశయోక్తి పరిమాణ వ్యత్యాసాన్ని సహజంగా వ్యక్తపరుస్తుంది. సంప్రదింపుల ఆంగ్ల పాఠ్యంలో పాదసూచిక గుర్తులు వాటి పదాల వద్ద లేకపోవడంతో, విషయానుసారంగా [a]ను ‘దూలం’ వద్ద, [b]ను ‘నలుసు’ వద్ద ఉంచాం.
