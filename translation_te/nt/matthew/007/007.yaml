review_pass:
  verdict: revise
  source_fidelity: The three imperatives and the two future passives are represented well. However, εὑρήσετε is a future active, second-person plural ('you will find'); the draft's 'మీకు దొరుకుతుంది' is an impersonal/experiential construction ('it will be found/obtained by you') and weakens the explicitly active subject.
  naturalness: The register, plural-respectful imperatives, and three-part rhythm are natural modern standard Telugu. 'మీరు కనుగొంటారు' is also natural here and better matches the Greek clause structure.
  terminology: '''అడగండి,'' ''వెదకండి,'' and ''తట్టండి'' are suitable. The passive forms ''ఇవ్వబడుతుంది'' and ''తెరవబడుతుంది'' appropriately leave the implied agent unstated. The aspect footnote accurately presents an allowed, not mandatory, ongoing nuance.'
  issues:
  - severity: medium
    issue: The rendering of εὑρήσετε as 'మీకు దొరుకుతుంది' does not retain its active second-person form.
    rationale: Greek εὑρήσετε means 'you will find.' Although 'దొరుకుతుంది' can be idiomatic in Telugu, it shifts the clause to an impersonal result and does not explicitly present the seekers as the finders. 'మీరు కనుగొంటారు' preserves the source's active construction without adding an object.
  revised_text: అడగండి[a], మీకు ఇవ్వబడుతుంది; వెదకండి, మీరు కనుగొంటారు; తట్టండి, మీకు తెరవబడుతుంది.
