id: MAT.7.7
reference: Matthew 7:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: te
  text: అడగండి[a], మీకు ఇవ్వబడుతుంది; వెదకండి, మీరు కనుగొంటారు; తట్టండి, మీకు తెరవబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులోని వర్తమానకాల ఆజ్ఞారూపాలకు కొనసాగింపు భావం కూడా ఉండవచ్చు: “అడుగుతూనే ఉండండి ... వెదుకుతూనే ఉండండి ... తడుతూనే ఉండండి.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: అడగండి
  rationale: వర్తమానకాల క్రియాజ్ఞ, బహువచనం. ‘అడగండి’ సహజమైన ఆధునిక తెలుగు ఆజ్ఞారూపం; కొనసాగిస్తూ అడగడం అనే సంభావ్య భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: δοθήσεται
  choice: ఇవ్వబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతుంది; ఇచ్చేవారు ఎవరో మూలంలోలాగే చెప్పకుండా ఉంచుతుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: దత్తి విభక్తి సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ζητεῖτε
  choice: వెదకండి
  rationale: ఆజ్ఞార్థాన్ని, అక్షరార్థం మరియు అలంకారార్థం రెండింటికీ సరిపోయే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: εὑρήσετε
  choice: మీకు దొరుకుతుంది
  rationale: భవిష్యత్ ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘కనుగొంటారు’ కంటే ఈ సమాంతర వాక్యనిర్మాణంలో సాధారణ పాఠకులకు మరింత సహజం.
- source_word: κρούετε
  choice: తట్టండి
  rationale: తలుపు తట్టడాన్ని సూచించే సహజమైన తెలుగు ఆజ్ఞారూపం.
- source_word: ἀνοιγήσεται
  choice: మీకు తెరవబడుతుంది
  rationale: గ్రీకు భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతుంది; ‘తెరుచుకుంటుంది’ అని మార్చి అకర్మక భావం కలిగించదు.
- source_word: καὶ
  choice: ;
  rationale: ప్రతి ఆజ్ఞకు దాని వాగ్దానాన్ని అనుసంధానించే సంబంధాన్ని తెలుగు వాక్యప్రవాహం, విరామచిహ్నాల ద్వారా సహజంగా వ్యక్తం చేస్తూ మూడు సమాంతర భాగాల లయను నిలుపుతుంది.
theological_decisions:
- issue: మూడు వర్తమానకాల క్రియాజ్ఞల కాలాంశం
  choice: ప్రధాన పాఠ్యంలో ‘అడగండి, వెదకండి, తట్టండి’ అనే సరళ ఆజ్ఞారూపాలు
  alternative: ‘అడుగుతూనే ఉండండి, వెదుకుతూనే ఉండండి, తడుతూనే ఉండండి’ అని కొనసాగింపు భావాన్ని స్పష్టంగా చెప్పడం
  rationale: గ్రీకు వర్తమాన క్రియాజ్ఞలు కొనసాగింపు భావాన్ని అనుమతిస్తాయి; అయితే అవి తప్పనిసరిగా ఆ భావాన్ని విస్తరించి అనువదించాల్సిన అవసరం లేదు. సహజమైన ప్రధాన పాఠ్యాన్ని ఉంచి, నిజమైన కాలాంశ ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- issue: కర్మణి క్రియలలో కార్యనిర్వాహకుడు
  choice: ‘ఇవ్వబడుతుంది’, ‘తెరవబడుతుంది’ అంటూ ఇచ్చేవారిని లేదా తెరిచేవారిని పేర్కొనకుండా ఉంచడం
  alternative: ‘దేవుడు మీకు ఇస్తాడు’, ‘దేవుడు మీకు తెరుస్తాడు’ అని కార్యనిర్వాహకుడిని స్పష్టీకరించడం
  rationale: సందర్భంలో దేవుడు సూచితుడై ఉండవచ్చు; అయినా గ్రీకు పాఠ్యం కర్మణి రూపంలో కార్యనిర్వాహకుడిని పేరుపెట్టదు. అనువాదం ఆ సూచనను సిద్ధాంతపరంగా విప్పి చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవ/బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. మూడు సమాంతర ఆజ్ఞలు మరియు వాటి వాగ్దానాల లయను కాపాడుతూ, కర్మణి నిర్మాణాలను సాధ్యమైనంత సహజంగా నిలిపాం.
