id: MAT.7.4
reference: Matthew 7:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: te
  text: లేదా, నీ సహోదరునితో[a], ‘నీ కంటిలోనుండి నలుసును[b] నేను తీసివేయనివ్వు’ అని నీవు ఎలా చెబుతావు? ఇదిగో, నీ కంటిలో దూలం[c] ఉంది!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరుడు’ అని ఉన్న గ్రీకు పదం పుంలింగ ఏకవచనం; ఇక్కడ అది తోటి శిష్యుణ్ణి ప్రతినిధ్యార్థంలో సూచిస్తూ ఉండవచ్చు.
    reason: cultural_note
  - marker: b
    text: ‘నలుసు’కు ‘చిన్న పుల్లముక్క’ లేదా ‘చెక్కపేడు’ అని కూడా అనువదించవచ్చు; గ్రీకు పదం చిన్న పొడి పదార్థపు ముక్కను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘దూలం’కు ‘పెద్ద కలపదిమ్మె’ అని కూడా అనువదించవచ్చు; గ్రీకు పదం నిర్మాణంలో ఉపయోగించే పెద్ద కలప ముక్కను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: లేదా
  rationale: యేసు వాదనలో తదుపరి ప్రశ్నార్థక ప్రత్యామ్నాయాన్ని సహజంగా పరిచయం చేస్తుంది.
- source_word: πῶς ἐρεῖς
  choice: నీవెలా అంటావు?
  rationale: భవిష్యత్ సూచనతో కూడిన గ్రీకు ప్రశ్నలోని సవాలు, అసంభవత భావాలను తెలుగులో సహజమైన ప్రశ్నారూపంలో నిలుపుతుంది.
- source_word: τῷ ἀδελφῷ σου
  choice: నీ సహోదరునితో
  rationale: ἀδελφός అనే పుంలింగ ఏకవచన రూపాన్ని ఖచ్చితంగా నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా ఉంటుంది.
- source_word: Ἄφες ἐκβάλω
  choice: నేను తీసివేయనీ
  rationale: అనుమతి కోరే గ్రీకు ప్రయోగాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, కంటిలోనుంచి దేనినైనా తొలగించే సందర్భార్థాన్ని కాపాడుతుంది.
- source_word: τὸ κάρφος
  choice: నలుసు
  rationale: చిన్న పొడి ముక్క లేదా సూక్ష్మ కణం అనే విస్తృత భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; ‘పుల్లముక్క’ కంటే తక్కువ నిర్దిష్టమైనది.
- source_word: καὶ ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే ἰδού యొక్క సంభాషణాత్మక బలాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: ἡ δοκὸς
  choice: దూలం
  rationale: పెద్ద నిర్మాణ కలపదిమ్మెను సూచించే δοκόςకు ఖచ్చితమైన తెలుగు పదం; నలుసుతో ఉద్దేశపూర్వకమైన అతిశయ వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: నీ కంటిలోనే ఉంది
  rationale: స్థానార్థాన్ని నేరుగా తెలియజేస్తూ, సందర్భంలోని వ్యత్యాస బలాన్ని ‘నే’ ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀδελφῷ యొక్క లింగ సూచన
  choice: సహోదరుడు
  alternative: తోటి విశ్వాసి / సహోదరుడు లేదా సహోదరి
  rationale: మూలపాఠం పుంలింగ ఏకవచనంలో ఒక ఊహాత్మక వ్యక్తిని ఉద్దేశిస్తుంది. ప్రధాన పాఠంలో దాని రూపాన్ని నిలిపి, ప్రతినిధ్య ప్రయోగం అయ్యే అవకాశాన్ని పాదసూచికలో తెలుపుతుంది.
- issue: κάρφος / δοκός అతిశయ వ్యత్యాసం
  choice: నలుసు / దూలం
  alternative: పుల్లముక్క / కలపదిమ్మె
  rationale: యేసు ఉపయోగించిన అత్యల్ప వస్తువు–అతి పెద్ద కలప భాగం అనే ఉద్దేశపూర్వక వ్యత్యాసాన్ని సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో ఉంది. ప్రశ్నార్థక సవాలు, ‘ఇదిగో’ అనే శ్రద్ధాకర్షణ, నలుసు–దూలం అతిశయ వ్యత్యాసం నిలుపబడ్డాయి.
