review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the lexical contrasts of ἀγαθός/πονηρός, σαπρός, and καλός, and its tree-and-fruit imagery is clear. However, ‘కాయలేదు’ is a simple past negative (‘did not bear’) rather than the categorical inability expressed by οὐ δύναται ... ποιεῖν (‘cannot bear/produce’).
  naturalness: ‘పండ్లను కాయడం సాధ్యం కాదు’ is modern, natural standard Telugu and unambiguously conveys impossibility. The paired clauses retain the concise, balanced force of the Greek.
  terminology: ‘మంచి చెట్టు,’ ‘చెడ్డ పండ్లు,’ ‘కుళ్లిన చెట్టు,’ and ‘మంచి పండ్లు’ are appropriate. The lexical-alternative footnotes are retained with their existing anchors.
  issues:
  - severity: high
    issue: The finite form ‘కాయలేదు’ is past-tense negation, not inability.
    rationale: οὐ δύναται governs the infinitive ποιεῖν and states that a good tree is not able to produce bad fruit. A past-tense rendering changes the categorical proverbial assertion into a report of a past event.
  revised_text: మంచి[a] చెట్టు చెడ్డ[b] పండ్లను కాయడం సాధ్యం కాదు; కుళ్లిన[c] చెట్టు మంచి పండ్లను కాయడం కూడా సాధ్యం కాదు.
