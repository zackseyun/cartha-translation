revisions:
- from: మంచి[a] చెట్టు చెడ్డ[b] పండ్లు కాయలేదు; అలాగే కుళ్లిన[c] చెట్టు మంచి పండ్లు కాయలేదు.
  to: మంచి[a] చెట్టు చెడ్డ[b] పండ్లను కాయడం సాధ్యం కాదు; కుళ్లిన[c] చెట్టు మంచి పండ్లను కాయడం కూడా సాధ్యం కాదు.
  rationale: The revision changes both occurrences of the past negative ‘కాయలేదు’ to ‘కాయడం సాధ్యం కాదు,’ explicitly preserving the Greek’s categorical inability. ‘కూడా’ naturally renders the parallel negative force of οὐδέ without adding meaning. No textual ambiguity or theological interpretation has been introduced.
