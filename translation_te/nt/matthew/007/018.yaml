id: MAT.7.18
reference: Matthew 7:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: te
  text: మంచి[a] చెట్టు చెడ్డ[b] పండ్లను కాయడం సాధ్యం కాదు; కుళ్లిన[c] చెట్టు మంచి పండ్లను కాయడం కూడా సాధ్యం కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆరోగ్యమైన చెట్టు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దుష్టమైన పండ్లు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘చెడిపోయిన చెట్టు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: మంచి చెట్టు
  rationale: ἀγαθός యొక్క సాధారణ మూల్యాంకన భావాన్ని ‘మంచి’ సహజంగా నిలుపుతుంది; ‘ఆరోగ్యమైన’ అని అనువదిస్తే రూపకాన్ని శారీరక స్థితికి పరిమితం చేసే అవకాశం ఉంది.
- source_word: οὐ δύναται ... ποιεῖν
  choice: కాయలేదు
  rationale: చెట్టుకు పండ్లు ఉత్పత్తి కావడాన్ని తెలుగులో ‘పండ్లు కాయడం’ అని సహజంగా అంటారు. నిషేధ సామర్థ్యరూపమైన ‘కాయలేదు’ గ్రీకు వాక్యంలోని అసాధ్యతను తెలియజేస్తుంది.
- source_word: καρποὺς πονηρούς
  choice: చెడ్డ పండ్లు
  rationale: πονηρός ఇక్కడ చెడు గుణం లేదా ఫలితాన్ని సూచిస్తుంది. ‘చెడ్డ’ అనేది పండ్ల రూపకానికి సహజంగా సరిపోతూ, ‘దుష్టమైన’ కంటే విస్తృతమైన మూల్యాంకన భావాన్ని కాపాడుతుంది.
- source_word: οὐδέ
  choice: అలాగే ... లేదు
  rationale: రెండో సమాంతర నిషేధాన్ని తెలుగులో సహజంగా కలుపుతూ రెండు వాక్యభాగాల సమతూకాన్ని నిలుపుతుంది.
- source_word: δένδρον σαπρόν
  choice: కుళ్లిన చెట్టు
  rationale: σαπρός లోని కుళ్లు లేదా చెడిపోవడం అనే స్పష్టమైన చిత్రాన్ని ‘కుళ్లిన’ నిలుపుతుంది; కేవలం ‘చెడ్డ చెట్టు’ అనడం కంటే ఇది మూలపదానికి దగ్గరగా ఉంటుంది.
- source_word: καρποὺς καλούς
  choice: మంచి పండ్లు
  rationale: καλός ఇక్కడ మంచి నాణ్యతగల పండ్లను సూచిస్తుంది. ‘మంచి పండ్లు’ మొదటి వాక్యంలోని ‘చెడ్డ పండ్లు’తో స్పష్టమైన వ్యతిరేక సమాంతరాన్ని ఏర్పరుస్తుంది.
theological_decisions:
- issue: రూపకంలోని అసాధ్యత స్వభావం
  choice: రెండు వాక్యభాగాల్లోనూ ‘కాయలేదు’ అనే నిర్దిష్ట అసామర్థ్య ప్రకటనను ఉంచడం
  alternative: ‘సాధారణంగా కాయదు’ లేదా ‘కాయకూడదు’
  rationale: δύναται అనే గ్రీకు క్రియ ఇక్కడ కేవలం అరుదుగా జరుగుతుందని గానీ, జరగకూడదని గానీ కాక సామర్థ్యలేమిని స్పష్టంగా చెబుతుంది. రూపకం దాటి అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చకుండా ఆ బలాన్ని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు సహజంగా అర్థమయ్యేలా ‘పండ్లు కాయడం’ అనే సాధారణ ప్రయోగాన్ని వాడాం. వాక్యంలోని గంభీరమైన సమాంతర నిర్మాణం, నిర్దిష్ట అసాధ్యత, మంచి–చెడు వ్యతిరేకత నిలుపబడ్డాయి.
