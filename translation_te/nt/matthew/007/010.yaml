  source_fidelity: The draft preserves the fish/snake contrast and rhetorical interrogative form, but it incorrectly makes the same person both ask for the fish and receive the snake. In the Greek, as established by the immediately preceding context, the son asks and the father gives; αὐτῷ refers back to the son.
  naturalness: The wording is otherwise modern and clear. Supplying the relational referents makes the Telugu sentence coherent and natural without adding interpretive content beyond what the immediate context requires.
  terminology: ‘చేప’ and ‘పాము’ are appropriate modern-standard Telugu equivalents for ἰχθύς and ὄφις. ‘సర్పం’ remains a valid, more literary lexical alternative.
  issues:
  - severity: high
    issue: Pronoun-role ambiguity reverses or obscures the participants.
    rationale: ‘అతడు చేప అడిగితే—అతనికి పాము ఇస్తాడా?’ naturally reads as though the man who asks for fish is also the one to whom a snake is given. The context and Greek construction distinguish the son who asks from the father who gives.
  revised_text: లేదా, అతని కుమారుడు చేప అడిగితే—అతడు అతనికి పాము[a] ఇస్తాడా?
