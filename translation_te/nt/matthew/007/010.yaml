  rationale: The revision explicitly identifies the son as the requester and the father as the giver, resolving a serious ambiguity created by Telugu third-person pronouns. It retains the source’s paired-example connector, fish/snake contrast, rhetorical question expecting a negative answer, and emphatic dash.
