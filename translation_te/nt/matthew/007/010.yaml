id: MAT.7.10
reference: Matthew 7:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: te
  text: లేదా, అతని కుమారుడు చేప అడిగితే—అతడు అతనికి పాము[a] ఇస్తాడా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సర్పం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ καὶ
  choice: లేదా
  rationale: ముందటి ఉదాహరణకు జతగా రెండవ అలంకారిక ప్రశ్నను ప్రవేశపెడుతుంది; καί భావాన్ని తెలుగులో విడిగా చేర్చకపోయినా సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: ἰχθὺν
  choice: చేప
  rationale: ఇంటి ఆహార సందర్భంలో సాధారణమైన ‘చేప’ అనే అర్థమే సరిపోతుంది.
- source_word: αἰτήσει
  choice: అడిగితే
  rationale: గ్రీకులో భవిష్యత్ సూచక రూపం ఉన్నప్పటికీ ఇది సాధారణ ఊహాత్మక సందర్భం; తెలుగులో షరతును తెలిపే ‘అడిగితే’ సహజంగా అదే భావాన్ని అందిస్తుంది.
- source_word: μὴ
  choice: ఇస్తాడా?
  rationale: μή ప్రతికూల సమాధానాన్ని ఆశించే ప్రశ్నను సూచిస్తుంది. తెలుగు సందర్భంలో సాధారణ ప్రశ్నారూపమే ‘ఇవ్వడు’ అనే ఆశించిన సమాధానాన్ని అలంకారికంగా స్పష్టం చేస్తుంది.
- source_word: ὄφιν
  choice: పాము
  rationale: ఆధునిక సాధారణ తెలుగులో జంతువును సూచించే సహజ పదం; ‘సర్పం’ సాధ్యమైనప్పటికీ మరింత సాహిత్యోచితంగా వినిపిస్తుంది.
- source_word: ἐπιδώσει
  choice: ఇస్తాడా
  rationale: ఈ సందర్భంలో క్రియకు ‘ఇవ్వడం/అందించడం’ అనే సాధారణ భావం ఉంది; ‘ఇస్తాడా’ స్పష్టమైన సహజ సమానార్థకం.
- source_word: αὐτῷ
  choice: అతనికి
  rationale: దత్తివాచక పరోక్ష కర్మను తెలుగులో సహజంగా ‘అతనికి’ అని వ్యక్తం చేస్తుంది; మూలంలోని సర్వనామ సూచనను అలాగే ఉంచుతుంది.
theological_decisions:
- issue: ప్రతికూల సమాధానాన్ని ఆశించే అలంకారిక ప్రశ్న
  choice: ‘అతనికి పాము ఇస్తాడా?’ అనే ప్రశ్నారూపాన్ని నిలుపుకోవడం
  alternative: ‘అతనికి పాము ఇవ్వడు’ అనే సాధారణ ప్రకటనగా మార్చడం
  rationale: μή ఉన్న ప్రత్యక్ష ప్రశ్న ‘లేదు’ అనే సమాధానాన్ని ఆశిస్తుంది. ప్రశ్నారూపాన్ని నిలుపుకోవడం ద్వారా పరిసర వాదనలోని అలంకారిక బలం చెదరకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. గ్రీకు వాక్యంలోని పదునైన అలంకారిక విరామాన్ని దీర్ఘ విరామచిహ్నంతో నిలిపి, మూలంలో ఉన్న సర్వనామ సూచనను స్పష్టీకరణ పేరుతో విస్తరించలేదు.
