id: MAT.7.9
reference: Matthew 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: te
  text: లేదా మీలో ఏ మనిషైనా[a], తన కుమారుడు రొట్టె అడిగితే అతనికి రాయి ఇస్తాడా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మనిషి’ అనే పదం ఇక్కడ ప్రతినిధి అర్థంలో ఉంది; భావం ‘మీలో ఎవరైనా’ అని.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: లేదా
  rationale: ముందటి వాక్యంలోని బోధను కొనసాగిస్తూ మరో అలంకారిక ప్రశ్నను పరిచయం చేస్తుంది.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: మీలో ఏ మనిషైనా
  rationale: గ్రీకు భాగసూచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, ἄνθρωπος అనే ప్రతినిధి ఏకవచనాన్ని నిలుపుతుంది.
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ
  choice: తన కుమారుడు ... అడిగితే
  rationale: గ్రీకులోని సంబంధ వాక్యాన్ని తెలుగులో సహజమైన షరతు నిర్మాణంగా మార్చింది. αἰτήσει భవిష్యత్ సూచక రూపమైనా, ఇక్కడ సాధారణ ఊహాత్మక పరిస్థితిని సూచిస్తున్నందున ‘అడిగితే’ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἄρτον
  choice: రొట్టె
  rationale: ప్రాథమిక అర్థాన్ని, రాయితో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని నిలుపుతుంది; ‘ఆహారం’ అనడం మూలానికంటే విస్తృతం.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: అతనికి రాయి ఇస్తాడా?
  rationale: μή ఈ ప్రశ్నకు ‘లేదు’ అనే సమాధానం ఆశించబడుతున్నదని సూచిస్తుంది. తెలుగులో అలంకారిక ప్రశ్న స్వయంగా ఆ ప్రతికూల నిరీక్షణను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: లింగసూచక ప్రతినిధి భాష
  choice: మీలో ఏ మనిషైనా
  alternative: మీలో ఎవరైనా
  rationale: ἄνθρωπος ఇక్కడ ఒక పురుషుణ్ణి ప్రతినిధిగా చూపే ఏకవచన నిర్మాణంలో ఉంది. ‘మనిషి’ మూలంలోని రూపాన్ని నిలుపుతుండగా, పాదసూచిక అది ప్రతినిధి ప్రయోగమని వివరిస్తుంది.
- issue: అలంకారిక ప్రశ్నలో ప్రతికూల నిరీక్షణ
  choice: అతనికి రాయి ఇస్తాడా?
  alternative: అతనికి రాయి ఇవ్వడు కదా?
  rationale: μή వల్ల ఆశించబడే ‘లేదు’ అనే సమాధానాన్ని మరీ స్పష్టీకరించకుండా, మూలంలోని ప్రశ్నారూపం మరియు దాని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. గ్రీకు సంబంధ వాక్యాన్ని సహజ తెలుగు షరతు నిర్మాణంగా ఇచ్చి, అలంకారిక ప్రశ్నను అలాగే నిలిపింది.
