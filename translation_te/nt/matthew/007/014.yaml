id: MAT.7.14
reference: Matthew 7:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: te
  text: ఎందుకంటే ద్వారం ఇరుకైనది, జీవానికి నడిపించే మార్గం కష్టమైనది; ఆ మార్గాన్ని కనుగొనేవారు కొద్దిమందే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: ఇరుకైనది
  rationale: ద్వారం యొక్క సంకుచితత్వాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: τεθλιμμένη
  choice: కష్టమైనది
  rationale: పదం సూచించే నొక్కబడిన లేదా ఇబ్బందికరమైన మార్గ భావాన్ని సందర్భానుగుణంగా సహజంగా వ్యక్తపరుస్తుంది; కేవలం భౌతిక వెడల్పుకే పరిమితం చేయదు.
- source_word: ἀπάγουσα εἰς τὴν ζωήν
  choice: జీవానికి నడిపించే
  rationale: మార్గం జీవం వైపు తీసుకెళ్తుందనే గ్రీకు నిర్మాణాన్ని స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: ὀλίγοι ... οἱ εὑρίσκοντες αὐτήν
  choice: దాన్ని కనుగొనేవారు కొద్దిమందే
  rationale: ‘దాన్ని’ అనే సర్వనామంతో మార్గాన్ని సూచిస్తూ, కనుగొనేవారి కొద్దితనంపై మూలంలోని బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘జీవం’ యొక్క స్వరూపం
  choice: జీవానికి
  alternative: నిత్యజీవానికి
  rationale: మూలంలో ζωή మాత్రమే ఉంది; ‘నిత్య’ అని చేర్చి భావాన్ని సిద్ధాంతపరంగా విస్తరించకుండా మూలంలోని సంక్షిప్తతను కాపాడింది.
- issue: τεθλιμμένη యొక్క భావవ్యాప్తి
  choice: మార్గం కష్టమైనది
  alternative: మార్గం ఇరుకైనది / సంకుచితమైనది
  rationale: ఈ రూపం ఒత్తిడి, ఇబ్బంది, కఠినత అనే భావాలను కలిగి ఉండగలదు. సందర్భంలో ద్వారానికి ఇప్పటికే ‘ఇరుకు’ వాడినందున, మార్గం అనుసరించడంలోని కష్టాన్ని తెలియజేసే రూపాన్ని ఎంచుకుంది; భౌతిక సంకుచితత్వాన్ని మాత్రమే నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన, గంభీరమైన వాక్య నిర్మాణం. ప్రారంభంలోని ὅτι ను సందర్భానుసారంగా ‘ఎందుకంటే’గా ఉంచి, మూలంలోని కారణసంబంధాన్ని నిలిపింది.
