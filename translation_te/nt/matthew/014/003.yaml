revisions:
- from: ఎందుకంటే హేరోదు యోహానును పట్టుకొని[a], బంధించి, తన సోదరుడైన ఫిలిప్పు భార్య హేరోదియ కారణంగా చెరసాలలో వేయించాడు.
  to: ఎందుకంటే హేరోదు యోహానును పట్టుకొని[a], బంధించి, తన సోదరుడైన ఫిలిప్పు భార్య హేరోదియ కారణంగా అతనిని చెరసాలలో ఉంచాడు.
  rationale: A limited revision replaces an unintended Telugu causative with a direct active expression corresponding to the Greek main verb and explicitly carries forward John as its object. No historical, moral, or theological inference beyond the verse has been added.
  reviewer_model: gpt-5.6-terra
