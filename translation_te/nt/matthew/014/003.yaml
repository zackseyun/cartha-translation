id: MAT.14.3
reference: Matthew 14:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: te
  text: ఎందుకంటే హేరోదు యోహానును పట్టుకొని[a], బంధించి, తన సోదరుడైన ఫిలిప్పు భార్య హేరోదియ కారణంగా అతనిని చెరసాలలో ఉంచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యోహానును అదుపులోకి తీసుకొని’.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని లేదా వివరణను అనుసంధానించే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: κρατήσας
  choice: పట్టుకొని
  rationale: క్రియ యొక్క ‘పట్టుకోవడం/అదుపులోకి తీసుకోవడం’ అనే ప్రాథమిక భావాన్ని నిలుపుతూ, తరువాతి బంధనము మరియు చెరసాల సందర్భంలో అరెస్టు భావాన్నీ సహజంగా తెలియజేస్తుంది.
- source_word: ἔδησεν
  choice: బంధించి
  rationale: ఎలా బంధించాడో అనవసరంగా నిర్దిష్టం చేయకుండా δέω యొక్క ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: చెరసాలలో వేయించాడు
  rationale: నిర్బంధంలో ఉంచడాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలిపే సహజ తెలుగు ప్రయోగం.
- source_word: διὰ Ἡρῳδιάδα
  choice: హేరోదియ కారణంగా
  rationale: διά + accusative ఇక్కడ సూచించే కారణార్థాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: γυναῖκα
  choice: భార్య
  rationale: ఈ సంబంధసూచక నిర్మాణంలో γυνή అనే పదానికి సందర్భోచితమైన అర్థం ‘భార్య’.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: తన సోదరుడైన ఫిలిప్పు భార్య
  rationale: ఫిలిప్పు హేరోదు సోదరుడని స్పష్టంగా తెలియజేస్తూ గ్రీకు సంబంధాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
theological_decisions:
- issue: ఫిలిప్పుతో హేరోదియకు ఉన్న సంబంధం గురించిన చారిత్రక-నైతిక చిత్రణ
  choice: ‘తన సోదరుడైన ఫిలిప్పు భార్య హేరోదియ’ అని తటస్థంగా గుర్తించడం
  alternative: ‘తన సోదరుడు ఫిలిప్పు భార్యను తీసుకున్న హేరోదు’ వంటి వివరణాత్మక రూపం
  rationale: ఈ వచనం హేరోదియను ఫిలిప్పు భార్యగా మాత్రమే గుర్తిస్తుంది; ఆ సంబంధం అక్రమమనే స్పష్టమైన తీర్పు తరువాతి వచనంలో వస్తుంది. అందువల్ల ఇక్కడ ముందుగానే ఆ తీర్పును చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘చెరసాల’ బైబిలు సందర్భానికి తగినదిగా ఉండి ఇప్పటికీ స్పష్టమైన పదం. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోలుతుంది.
