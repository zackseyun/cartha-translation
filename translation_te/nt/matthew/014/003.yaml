review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the explanatory γάρ, Herod’s seizure and binding of John, the causal force of διά, and Herodias’s identification as Philip, Herod’s brother’s wife. However, ‘చెరసాలలో వేయించాడు’ is causative (‘had [someone] put [him] in prison’) and does not directly represent ἀπέθετο, for which Herod himself is the subject. The explicit object is also best retained in the final action.
  naturalness: The wording is generally clear and modern. Replacing the causative prison expression with ‘అతనిని చెరసాలలో ఉంచాడు’ is idiomatic, direct, and natural in standard Telugu.
  terminology: ‘హేరోదు,’ ‘యోహాను,’ ‘ఫిలిప్పు,’ ‘హేరోదియ,’ ‘బంధించి,’ and ‘చెరసాల’ are appropriate biblical-register terms. ‘తన సోదరుడైన ఫిలిప్పు భార్య హేరోదియ’ correctly identifies Philip as Herod’s brother without adding the following verse’s moral judgment.
  issues:
  - severity: medium
    issue: ‘చెరసాలలో వేయించాడు’ is causative and leaves the direct action semantically indirect.
    rationale: Greek ἀπέθετο has Herod as the agent who placed John in prison. Telugu ‘వేయించాడు’ normally means that he caused another person to put him there. ‘అతనిని చెరసాలలో ఉంచాడు’ directly preserves the source sense and restores the object.
  revised_text: ఎందుకంటే హేరోదు యోహానును పట్టుకొని[a], బంధించి, తన సోదరుడైన ఫిలిప్పు భార్య హేరోదియ కారణంగా అతనిని చెరసాలలో ఉంచాడు.
  revised_footnotes:
  - marker: a
    text: లేదా, ‘యోహానును అదుపులోకి తీసుకొని’.
    reason: lexical_alternative
  revision_rationale: A limited revision replaces an unintended Telugu causative with a direct active expression corresponding to the Greek main verb and explicitly carries forward John as its object. No historical, moral, or theological inference beyond the verse has been added.
