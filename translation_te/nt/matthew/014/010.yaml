  text: And he sent and beheaded John in the prison[a].
translation:
  language: te
  text: అతడు పంపి, చెరసాలలో యోహాను తలను నరికించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: “పంపి, అతడు చెరసాలలో యోహాను తలను నరికించాడు.” గ్రీకులో భూతకాల కృదంతం తరువాత ప్రధాన క్రియ వస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: అతడు
  rationale: Greek καί continues the narrative, but a separate Telugu verse naturally resumes the subject with “అతడు”; an explicit “మరియు” would sound less natural here.
- source_word: πέμψας
  choice: మనుషులను పంపి
  rationale: The aorist participle indicates that Herod dispatched agents before the beheading. Supplying the implicit human object makes the mediated action clear in natural Telugu without specifying their identity.
- source_word: ἀπεκεφάλισεν
  choice: తల నరికించాడు
  rationale: ἀποκεφαλίζω specifically denotes beheading. Telugu causative “నరికించాడు” preserves the Greek attribution of the act to Herod while naturally indicating that he caused others to carry it out.
- source_word: τὸν Ἰωάννην
  choice: యోహాను
  rationale: The verse gives only the proper name; the immediate context identifies him, so “బాప్తిస్మమిచ్చు యోహాను” is not added.
- source_word: ἐν τῇ φυλακῇ
  choice: చెరసాలలో ఉన్న
  rationale: The locative phrase states that John was in the prison when he was beheaded. Attaching it naturally to John avoids suggesting that Herod himself entered the prison.
theological_decisions: []
translation_notes:
  register: Modern standard Telugu with a dignified narrative register. “చెరసాల” is widely intelligible and slightly more formal than “జైలు.” The causative verb communicates agency through dispatched subordinates while retaining Herod’s responsibility.
