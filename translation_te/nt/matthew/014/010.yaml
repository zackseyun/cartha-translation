  rationale: The revision removes the unstated object “మనుషులను” and keeps the prison phrase directly connected with the beheading. The causative “నరికించాడు” is retained because it naturally expresses the ruler's responsible agency in Telugu while preserving the Greek's attribution of the act to him. The footnote accurately reflects the participle-plus-main-verb construction.
