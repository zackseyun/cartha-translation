translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘హేరోదియ కుమార్తె’ అని మాత్రమే ఉంచి, మూలపాఠంలో లేని పేరును చేర్చలేదు. వాక్యాంత విరామాన్ని తెలుగులో సంపూర్ణ వాక్యానికి తగినట్లుగా ఉంచాం.
