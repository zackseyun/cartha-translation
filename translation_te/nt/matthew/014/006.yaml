id: MAT.14.6
reference: Matthew 14:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: te
  text: అయితే హేరోదు పుట్టినరోజు వేడుక జరిగినప్పుడు[a], హేరోదియ కుమార్తె మధ్యలో నాట్యం చేసి హేరోదును మెప్పించింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “హేరోదు పుట్టినరోజు వచ్చినప్పుడు”; లేదా, “హేరోదు పుట్టినరోజు విందులో.” గ్రీకు పదబంధం హేరోదు పుట్టినరోజు జరుపుకున్న సందర్భాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మధ్యలో.” ఆమె అక్కడ కూడినవారి మధ్య నాట్యం చేసిందని ఈ పదబంధం సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: పుట్టినరోజు వేడుక వచ్చినప్పుడు
  rationale: γενέσια పుట్టినరోజు ఆచరణ లేదా వేడుక సందర్భాన్ని సూచిస్తుంది; γενομένοις‌తో కలిసి కాలసూచక నిర్మాణంగా ఉంది. ‘పుట్టినరోజు వేడుక వచ్చినప్పుడు’ అనే రూపం కేవలం తేదీని కాక ఆ సందర్భాన్ని కూడా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ఇది కథనాన్ని ముందుకు తీసుకెళ్లే స్వల్ప వ్యత్యాసం లేదా మలుపును సూచిస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: హేరోదియ కుమార్తె
  rationale: గ్రీకు పాఠంలోని సంబంధాన్ని సూటిగా తెలియజేస్తుంది; కుమార్తెకు సంప్రదాయంగా ఇచ్చే పేరును పాఠంలో లేనందున చేర్చలేదు.
- source_word: ὠρχήσατο
  choice: నాట్యం చేసి
  rationale: క్రియకు సాధారణ అర్థం ‘నాట్యం చేసింది’; తెలుగులో తదుపరి క్రియతో సహజంగా అనుసంధానించడానికి ‘నాట్యం చేసి’ అని ఇచ్చాం.
- source_word: ἐν τῷ μέσῳ
  choice: సభ మధ్యలో
  rationale: అక్షరార్థం ‘మధ్యలో’; సందర్భం సమకూడిన వారి మధ్య జరిగిన నాట్యాన్ని సూచిస్తున్నందున ‘సభ మధ్యలో’ సహజమైన సందర్భోచిత అనువాదం. వ్యాఖ్యాన పరిమితిని పాదసూచికలో తెలిపాం.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: హేరోదును మెప్పించింది
  rationale: ἀρέσκω దత్తివిభక్తితో ‘ఎవరినైనా మెప్పించు’ అనే అర్థం ఇస్తుంది; ఈ తెలుగు రూపం సహజంగా, అదనపు భావం చేర్చకుండా మూలార్థాన్ని అందిస్తుంది.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: హేరోదు
  rationale: వ్యక్తి పేరుకు ఆధునిక ప్రామాణిక తెలుగు లిప్యంతరీకరణను ఉపయోగించాం.
