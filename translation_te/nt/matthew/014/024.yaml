  - severity: low
    issue: “భూమి నుండి” is literal but slightly less idiomatic than “తీరం నుండి” in this immediate boating context.
    rationale: γῆ literally denotes land, yet here it contrasts with the water and naturally refers to the shore. Using “తీరం” in the text with a note preserving “land” maintains both clarity and source transparency.
