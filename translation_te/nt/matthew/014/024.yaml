  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: te
  text: అయితే అప్పటికే పడవ తీరం నుండి అనేక స్టేడియాల[a][b] దూరంలో ఉంది; అలలచేత కొట్టబడుతోంది[c], ఎందుకంటే గాలి దానికి ఎదురుగా వీస్తోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘భూమి నుండి.’ గ్రీకు మూలంలో అక్షరార్థంగా ‘భూమి నుండి’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: స్టేడియం అనేది ప్రాచీన దూర ప్రమాణం; ఒక స్టేడియం సుమారు 185 మీటర్లు.
    reason: cultural_note
  - marker: c
    text: లేదా ‘అలల తాకిడికి గురవుతోంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: πλοῖον
  choice: పడవ
  rationale: గలిలయ సరస్సు సందర్భంలో సాధారణ ఆధునిక తెలుగులో ‘పడవ’ సహజంగా ఉండి, నౌక పరిమాణాన్ని అతిశయింపజేయదు.
- source_word: ἤδη
  choice: అప్పటికే
  rationale: కథనంలోని ఈ సమయానికే పరిస్థితి ఏర్పడిపోయిందనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: σταδίους πολλοὺς
  choice: అనేక స్టేడియాల
  rationale: మూలంలోని ప్రాచీన దూర ప్రమాణాన్ని సాధారణీకరించకుండా నిలుపుతుంది; దాని పరిమాణాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: ἀπὸ τῆς γῆς
  choice: భూమి నుండి
  rationale: γῆ యొక్క ప్రాథమిక భావాన్ని నిలుపుతూ నీటికి విరుద్ధమైన భూభాగాన్ని సూచిస్తుంది; సందర్భానుసారమైన ‘ఒడ్డు నుండి’ ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: ἀπεῖχεν
  choice: దూరంలో ఉండి
  rationale: స్థల దూరాన్ని తెలుగులో సహజమైన నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: βασανιζόμενον
  choice: అలల దెబ్బలకు అల్లాడుతోంది
  rationale: పడవపై అలలు కలిగిస్తున్న తీవ్ర ఒత్తిడి, నిరంతర తాకిడిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మానసిక ‘వేదన’ భావాన్ని అనవసరంగా రుద్దదు.
- source_word: ὑπὸ τῶν κυμάτων
  choice: అలల దెబ్బలకు
  rationale: κύματαను ‘అలలు’గా అనువదించి, అవే పడవ అల్లాడటానికి కారణమని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐναντίος
  choice: దానికి ఎదురుగా
  rationale: గాలి పడవ ప్రయాణ దిశకు వ్యతిరేకంగా ఉందనే సందర్భార్థాన్ని స్పష్టం చేస్తుంది; ‘దానికి’ అనేది సందర్భం ఆధారంగా సరఫరా చేసిన సర్వనామం.
- source_word: δὲ
  choice: అయితే
  rationale: యేసు భూమిపై ఉన్న దృశ్యం నుండి కష్టంలో ఉన్న పడవ వైపు వచ్చే స్వల్ప కథన వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: అలల వల్ల పడవ అల్లాడటానికి గాలి ఎదురుగా ఉండటమే వివరణ అని స్పష్టంగా కలుపుతుంది.
