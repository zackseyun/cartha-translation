source:
  edition: SBLGNT
  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: te
  text: ఆమె తన తల్లి ప్రేరేపణతో, “బాప్తిస్మమిచ్చే యోహాను[a] తలను ఇక్కడే పళ్లెంపై నాకు ఇవ్వండి” అని చెప్పింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సంప్రదాయంగా, “బాప్తిస్మమిచ్చు యోహాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: ప్రేరేపణతో
  rationale: తల్లి ముందుగా ఆమెను ఈ కోరిక అడిగేలా ప్రభావితం చేసిందనే కర్మణి భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘ఆదేశించగా’ అని అనువదించి అధికారిక ఉపదేశాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: తన తల్లి
  rationale: ὑπό సహిత షష్ఠీ విభక్తి కర్మణి ప్రయోగంలో వ్యక్తిగత కర్తను సూచిస్తుంది; ‘తన తల్లి ప్రేరేపణతో’ అనే నిర్మాణం ఆ భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: Δός μοι
  choice: నాకు ఇవ్వండి
  rationale: ఆజ్ఞార్థక క్రియను ప్రత్యక్షమైన అభ్యర్థన-ఆజ్ఞగా అనువదించింది. రాజును ఉద్దేశించిన సందర్భానికి తగిన గౌరవ బహువచనం సహజమైన తెలుగు వాడుక.
- source_word: φησίν
  choice: అని చెప్పింది
  rationale: గ్రీకులోని చారిత్రక వర్తమాన కాలాన్ని తెలుగులో సహజ కథన శైలికి అనుగుణంగా భూతకాలంలో అందించింది; సంఘటన క్రమం మారదు.
- source_word: ὧδε
  choice: ఇక్కడే
  rationale: స్థలాన్ని సూచించే ‘ఇక్కడ’ అనే భావంతో పాటు సందర్భంలోని తక్షణతను ‘-ఏ’ నొక్కిచెప్పే ప్రత్యయం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ πίνακι
  choice: ఒక పళ్లెంలో పెట్టి
  rationale: విందు సందర్భంలో πίναξ భోజనం వడ్డించే పళ్లెం/పెద్ద పళ్లెాన్ని సూచిస్తుంది. ‘పళ్లెంలో పెట్టి’ అనేది తెలుగులో తలను పళ్లెం మీద సమర్పించాలనే అర్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὴν κεφαλὴν
  choice: తలను
  rationale: మూలంలోని భయానకమైన నిర్దిష్టతను తగ్గించకుండా నేరుగా అనువదిస్తుంది.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: బాప్తిస్మమిచ్చే యోహాను
  rationale: βαπτιστής అనే కర్తృవాచక బిరుదు యోహాను చేసిన కార్యాన్ని వివరిస్తుంది. ‘బాప్తిస్మమిచ్చే’ ఆ వివరణాత్మక భావాన్ని ఆధునిక తెలుగులో పారదర్శకంగా ఉంచుతుంది.
theological_decisions:
- issue: యోహాను బిరుదైన βαπτιστής అనువాదం
  choice: బాప్తిస్మమిచ్చే యోహాను
  alternative: బాప్తిస్మమిచ్చు యోహాను
  rationale: ఈ బిరుదును కేవలం సంప్రదాయ నామరూపంలా కాక, యోహాను చేసే కార్యాన్ని తెలిపే కర్తృవాచక పదంగా అనువదించింది. ప్రధాన పాఠంలో ఆధునిక సహజ రూపం ఉండగా, సుపరిచితమైన సంప్రదాయ రూపాన్ని పాదసూచికలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే కథన శైలి. రాజును ఉద్దేశించిన మాటలో సహజమైన గౌరవార్థక ‘ఇవ్వండి’ వాడబడింది. మూలంలోని తల్లి ప్రభావం, ‘ఇక్కడే’ అనే నొక్కింపు, తలను పళ్లెంలో కోరిన కఠినమైన చిత్రణ అన్నీ నిలుపబడ్డాయి.
