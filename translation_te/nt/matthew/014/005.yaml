  to: అతన్ని చంపాలని కోరుకుంటూ[a], అతడు జనసమూహానికి భయపడ్డాడు, ఎందుకంటే వారు అతన్ని ప్రవక్తగా భావించేవారు[b].
  rationale: The revision retains the Greek participial construction in the text rather than requiring a concessive relation not explicitly marked by θέλων. It preserves the causal connection in one Telugu sentence and represents εἶχον with a natural imperfective expression. The concessive contextual reading remains available in footnote a.
