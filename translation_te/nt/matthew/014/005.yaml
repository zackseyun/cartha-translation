    rationale: The Greek participle does not itself mark concession. The context supports a concessive understanding, but the translation should preserve the participle’s broader relation in the main text and place the concessive reading in a footnote.
  - severity: low
    issue: “భావించారు” underrepresents the imperfect εἶχον.
    rationale: The imperfect idiom depicts the crowd’s continuing view of him. “భావించేవారు” communicates this naturally without adding interpretation.
