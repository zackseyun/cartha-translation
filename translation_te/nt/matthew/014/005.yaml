reference: Matthew 14:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: te
  text: అతన్ని చంపాలని కోరుకుంటూ[a], అతడు జనసమూహానికి భయపడ్డాడు, ఎందుకంటే వారు అతన్ని ప్రవక్తగా భావించేవారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భానుసారంగా, “అతన్ని చంపాలని కోరుకున్నప్పటికీ.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారు అతన్ని ప్రవక్త అని పరిగణించేవారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: కోరుకున్నా
  rationale: 'గ్రీకు వర్తమాన అసమాపక క్రియ సందర్భంలో ప్రధాన క్రియతో విరుద్ధ సంబంధాన్ని సూచిస్తోంది: అతనికి చంపాలనే కోరిక ఉన్నప్పటికీ జనసమూహానికి భయపడ్డాడు. సహజమైన తెలుగులో ఈ సంబంధాన్ని ‘కోరుకున్నా’ స్పష్టంగా తెలియజేస్తుంది.'
- source_word: ἀποκτεῖναι
  choice: చంపాలని
  rationale: ఈ క్రియకు నేరుగా ‘చంపడం’ లేదా ‘మరణశిక్ష విధించడం’ అనే అర్థం ఉంది. ‘హత్య చేయాలని’ అనడం మూలపదంలో స్పష్టంగా లేని అదనపు నైతిక భావాన్ని చేర్చవచ్చు.
- source_word: ἐφοβήθη
  choice: భయపడ్డాడు
  rationale: φοβέομαι క్రియకు ఇక్కడ సాధారణ అర్థం ‘భయపడడం’. ఆధునిక ప్రామాణిక తెలుగులో ఇది సహజమైన కథన ప్రయోగం.
- source_word: τὸν ὄχλον
  choice: జనసమూహానికి
  rationale: ὄχλος అంటే ఒకచోట చేరిన ప్రజల సమూహం. ‘జనసమూహం’ మూలార్థాన్ని స్పష్టంగా ఉంచుతుంది; తెలుగు వాడుకలో ‘భయపడు’ క్రియతో సంప్రదాన విభక్తి సహజం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఇక్కడ ὅτι అతడు జనసమూహానికి భయపడడానికి కారణాన్ని పరిచయం చేస్తోంది.
- source_word: ὡς προφήτην
  choice: ప్రవక్తగా
  rationale: ὡς మరియు విధేయ ద్వితీయావిభక్తి కలయిక, ప్రజలు అతన్ని ఏ హోదాలో భావించారో సూచిస్తుంది. ‘ప్రవక్తగా’ ఈ నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτὸν εἶχον
  choice: వారు అతన్ని … భావించారు
  rationale: ἔχω ఇక్కడ విధేయ ద్వితీయావిభక్తితో కలిసి ‘ఒకరిగా పరిగణించడం/భావించడం’ అనే నానుడి అర్థంలో ఉంది.
theological_decisions:
- issue: గ్రీకు కథనంలో కర్త, కర్మ పేర్లు చెప్పకుండా సర్వనామాలతో ఉండడం
  choice: పాఠ్యంలో పేర్లు చేర్చకుండా ‘అతన్ని’, ‘భయపడ్డాడు’ అనే రూపాలను ఉంచడం
  alternative: ‘హేరోదు యోహానును చంపాలని కోరుకున్నా…’ అని పేర్లను స్పష్టంగా చేర్చడం
  rationale: తక్షణ సందర్భం వ్యక్తులను గుర్తించడానికి సరిపోతుంది; పేర్లు చేర్చడం అర్థాన్ని స్పష్టం చేసినా గ్రీకు మూలం కంటే ఎక్కువ సమాచారాన్ని ఈ వచనంలో ప్రవేశపెడుతుంది.
- issue: θέλων అనే అసమాపక క్రియ ప్రధాన క్రియతో కలిగిన భావసంబంధం
  choice: సందర్భానుసారమైన విరుద్ధ భావంతో ‘కోరుకున్నా’ అని అనువదించడం
  alternative: నిర్ణయించకుండా మరింత అక్షరార్థంగా ‘కోరుకుంటూ’ అని అనువదించడం
  rationale: గ్రీకు అసమాపక క్రియ స్వయంగా విరుద్ధ సూచక అవ్యయాన్ని కలిగి లేకపోయినా, చంపాలనే కోరికకు జనసమూహ భయం అడ్డుగా నిలిచిందని సందర్భం సూచిస్తుంది. ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలంలోని వ్యాకరణ విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథనశైలి. గ్రీకు మూలంలోని సర్వనామాలను అలాగే నిలిపి, సందర్భం అందించే వ్యక్తుల పేర్లను పాఠ్యంలో అదనంగా చేర్చలేదు.
