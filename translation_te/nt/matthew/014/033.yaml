id: MAT.14.33
reference: Matthew 14:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ἐν τῷ ⸀πλοίῳ προσεκύνησαν αὐτῷ λέγοντες· Ἀληθῶς θεοῦ υἱὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: te
  text: అప్పుడు పడవలో ఉన్నవారు ఆయనను ఆరాధించి[a], “నిజంగా నీవు దేవుని కుమారుడివి[b]” అని చెప్పుతూ ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆయనకు సాష్టాంగపడ్డారు” లేదా “ఆయనకు భక్తితో నమస్కరించారు.” గ్రీకు క్రియ మోకరించడం లేదా సాష్టాంగపడడం ద్వారా వ్యక్తమయ్యే గౌరవాన్ని, ఆరాధనను సూచించగలదు; ఇక్కడి సందర్భం “ఆరాధించారు” అనే భావానికి మద్దతిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దేవుని కుమారుడు.” గ్రీకులో “దేవుడు” అనే పదానికి నిర్దిష్ట ఉపపదం లేకపోయినా, ఈ సందర్భంలో ఈ పదబంధం “ఒక దేవుని కుమారుడు” అనే అర్థం కాకుండా బిరుదుగా పనిచేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: అప్పుడు ... ఉన్నవారు
  rationale: δέ ఇక్కడ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది; ‘అప్పుడు’ సహజమైన తెలుగు కథన ప్రవాహాన్ని ఇస్తుంది. οἱ అనేది పడవలో ఉన్నవారిని సూచించే నామవాచక ప్రయోగం.
- source_word: ἐν τῷ πλοίῳ
  choice: పడవలో
  rationale: πλοῖον సాధారణంగా ‘పడవ’; ἐν ఇక్కడ స్థలాన్ని సూచిస్తుంది.
- source_word: προσεκύνησαν αὐτῷ
  choice: ఆయనకు సాష్టాంగపడి
  rationale: προσκυνέω మోకరించడం, సాష్టాంగపడడం, భక్తితో నమస్కరించడం లేదా ఆరాధించడం అనే భావాలను కలిగి ఉండగలదు. ‘సాష్టాంగపడి’ శరీర భంగిమతో వ్యక్తమైన గాఢ భక్తిగౌరవాన్ని సహజంగా తెలియజేస్తూ, పదంలోని నిజమైన భావవిస్తృతిని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: λέγοντες
  choice: అని అన్నారు
  rationale: గ్రీకు వర్తమాన కృదంతాన్ని తెలుగులో సహజమైన ప్రత్యక్ష వాక్య నిర్మాణంగా మార్చడం జరిగింది.
- source_word: Ἀληθῶς
  choice: నిజంగా
  rationale: గంభీరమైన ధృవీకరణను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: θεοῦ υἱὸς
  choice: దేవుని కుమారుడు
  rationale: గ్రీకులో θεοῦ ముందు ఉపపదం లేకపోయినా, ఈ సందర్భంలో ఇది అనిశ్చితమైన ‘ఒక దేవుని కుమారుడు’ అనే అర్థం కాకుండా బిరుదుగా పనిచేస్తుంది. తెలుగులో ‘దేవుని కుమారుడు’ సహజమైన స్థిర బిరుదు.
- source_word: εἶ
  choice: నీవు ... కుమారుడివి
  rationale: రెండవ పురుష ఏకవచనాన్ని, ప్రత్యక్ష సంబోధనకు తగిన గౌరవభరితమైన కానీ సహజమైన తెలుగు రూపంలో తెలిపింది.
theological_decisions:
- issue: యేసు పట్ల προσκυνέω యొక్క భావం
  choice: ‘ఆయనకు సాష్టాంగపడి’ అని అనువదించి, ‘ఆయనను ఆరాధించారు’ అనే సందర్భోచిత భావాన్ని పాదటిప్పణిలో ఇచ్చాం.
  alternative: ఆయనను ఆరాధించారు; ఆయనకు భక్తితో నమస్కరించారు
  rationale: సముద్రంపై యేసు చూపిన అధికారానంతరం వచ్చే ఒప్పుకోలు సందర్భంలో ఆరాధన భావం బలంగా ఉంది. అయితే మూల క్రియ శరీర భంగిమ ద్వారా గౌరవం లేదా ఆరాధన రెండింటినీ సూచించగలదు; అందువల్ల ప్రధాన పాఠం దృశ్య చర్యను నిలుపుతూ పాదటిప్పణి దాని ఆరాధనా భావాన్ని తెలియజేస్తుంది.
- issue: θεοῦ υἱὸς యొక్క నిర్దిష్టత
  choice: ‘దేవుని కుమారుడు’ అనే బిరుదుగా అనువదించాం.
  alternative: దేవుని కుమారుల్లో ఒకడు; ఒక దేవుని కుమారుడు
  rationale: ఉపపదం లేని గ్రీకు నిర్మాణం తప్పనిసరిగా అనిశ్చితార్థాన్ని ఇవ్వదు. మత్తయి సందర్భంలో ఇది క్రీస్తును గురించిన గుర్తింపు బిరుదుగా పనిచేస్తుంది; తెలుగు రూపం స్వయంగా ఇంగ్లీషు వంటి నిర్దిష్ట ఉపపదాన్ని కోరదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా ఒప్పుకోలు యొక్క గంభీరతను నిలిపే శైలి. ‘సాష్టాంగపడి’ కొంత ఉన్నతమైన పదమైనప్పటికీ విస్తృతంగా అర్థమయ్యేది; దాని భావవిస్తృతిని పాదటిప్పణి స్పష్టం చేస్తుంది.
