- from: ఆయన వస్త్రపు అంచును[a] మాత్రమే తాకనివ్వమని వారు ఆయనను వేడుకుంటూ ఉన్నారు. దాన్ని తాకిన వారందరూ పూర్తిగా స్వస్థత పొందారు.[b]
  to: ఆయన వస్త్రపు అంచును[a] మాత్రమే తాకడానికి అనుమతించమని వారు ఆయనను వేడుకుంటూ ఉన్నారు. దాన్ని తాకిన వారందరూ స్వస్థులయ్యారు.[b]
  rationale: The revision removes the unsupported intensifier “పూర్తిగా,” makes the request-for-permission construction more explicit and natural, and clarifies the lexical alternatives for κράσπεδον. Footnote anchors remain present and correctly matched to their notes.
