source:
  edition: SBLGNT
  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: te
  text: ఆయన వస్త్రపు అంచును[a] మాత్రమే తాకడానికి అనుమతించమని వారు ఆయనను వేడుకుంటూ ఉన్నారు. దాన్ని తాకిన వారందరూ స్వస్థులయ్యారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అలంకారపు అంచును” లేదా “జూలును”; గ్రీకు పదం వస్త్రపు అంచును, అలంకారపు అంచును, లేదా అంచున ఉన్న జూలును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “బాగుపడ్డారు”; గ్రీకు క్రియకు “కాపాడబడ్డారు” లేదా “రక్షించబడ్డారు” అనే విస్తృత అర్థం కూడా ఉండవచ్చు, అయితే ఇక్కడ సందర్భం శారీరక స్వస్థతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: వేడుకుంటూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగిన లేదా పదేపదే చేసిన విన్నపాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం ఆ నిరంతర వేడుకోలును సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα μόνον ἅψωνται
  choice: మాత్రమే తాకనివ్వమని
  rationale: ἵνα + విధ్యర్థక రూపం వారి విన్నపంలోని విషయాన్ని తెలియజేస్తుంది; μόνον కేవలం తాకడమే చాలన్న భావాన్ని నొక్కి చెబుతుంది.
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: ఆయన వస్త్రపు అంచును
  rationale: κράσπεδον వస్త్రపు అంచు, అంచునున్న జూలు లేదా కుచ్చును సూచించవచ్చు. ప్రధాన పాఠంలో సహజమైన విస్తృత పదమైన ‘అంచు’ను ఉంచి, మరింత నిర్దిష్ట అవకాశాన్ని పాదటిప్పణిలో కాపాడాం.
- source_word: ὅσοι ἥψαντο
  choice: దాన్ని తాకిన వారందరూ
  rationale: ὅσοι యొక్క సమగ్ర-పరిమాణ భావాన్ని ‘వారందరూ’ తెలియజేస్తుంది; ‘దాన్ని’ అనే సర్వనామం ముందున్న వస్త్రపు అంచును సహజంగా సూచిస్తుంది.
- source_word: διεσώθησαν
  choice: పూర్తిగా స్వస్థత పొందారు
  rationale: διασῴζω ఇక్కడ శారీరక రోగాల సందర్భంలో కాపాడబడి సంపూర్ణంగా బాగుపడటాన్ని సూచిస్తుంది. ‘పూర్తిగా స్వస్థత పొందారు’ అనే రూపం సాధారణ ‘స్వస్థపడ్డారు’ కంటే δια- ఉపసర్గలోని సమగ్రతను కొంత ప్రతిబింబిస్తూ, సందర్భానుసారమైన అర్థాన్ని ఇస్తుంది.
theological_decisions:
- issue: స్వస్థపరచే అద్భుత సందర్భంలో διεσώθησαν అర్థం
  choice: శారీరకంగా పూర్తిగా స్వస్థత పొందారు
  alternative: రక్షించబడ్డారు / కాపాడబడ్డారు
  rationale: ఈ క్రియకు విస్తృతంగా రక్షించడం లేదా కాపాడడం అనే అర్థం ఉండగలిగినా, తక్షణ సందర్భం శారీరక రోగుల స్వస్థత. అందువల్ల ప్రధాన పాఠంలో శారీరక స్వస్థతను స్పష్టం చేసి, క్రియ యొక్క విస్తృత అర్థ పరిధిని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వేడుకుంటూ ఉన్నారు’ కొనసాగిన విన్నపాన్ని, ‘వస్త్రపు అంచు’ మూలపదంలోని విస్తృతతను, ‘పూర్తిగా స్వస్థత పొందారు’ సందర్భానుసారమైన ఫలితాన్ని తెలియజేస్తాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
