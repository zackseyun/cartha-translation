  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: te
  text: తిన్నవారిలో దాదాపు ఐదువేల మంది పురుషులు ఉన్నారు; స్త్రీలను, పిల్లలను లెక్కలో చేర్చలేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్త్రీలు, పిల్లలు అదనంగా.”
    reason: χωρίς యొక్క “విడిగా/అదనంగా, లెక్కలో చేరకుండా” అనే భావానికి సంక్షిప్త ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: తిన్నవారు
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతం భోజనంలో పాలుపంచుకున్నవారిని సూచిస్తుంది. తెలుగులో ‘తిన్నవారు’ సహజంగా ఉండి, క్రియాంశాన్ని అతిగా నిర్దిష్టం చేయదు; δέ యొక్క స్వల్ప కథన అనుసంధానాన్ని సందర్భమే తెలియజేస్తుంది.
- source_word: ἦσαν
  choice: ఉన్నారు
  rationale: εἰμί యొక్క అసంపూర్ణ భూతకాల రూపం ఇక్కడ సంఖ్యను తెలిపే సాధారణ సంధాన క్రియ. తెలుగు వాక్య నిర్మాణంలో భావం సహజంగా వ్యక్తమయ్యేలా ‘ఉన్నారు’ అనేది అంతర్భూతంగా ఉంది.
- source_word: ἄνδρες
  choice: పురుషులు
  rationale: ἀνήρ ఇక్కడ సాధారణంగా ప్రజలను కాక, ప్రత్యేకంగా పురుషులను సూచిస్తుంది; స్త్రీలు, పిల్లలు విడిగా ప్రస్తావించబడటం దీనిని బలపరుస్తుంది.
- source_word: ὡσεὶ
  choice: దాదాపు
  rationale: ὡσεί సంఖ్య సుమారుగా ఉందని సూచిస్తుంది; ‘దాదాపు’ ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానం.
- source_word: πεντακισχίλιοι
  choice: ఐదువేల మంది
  rationale: పురుషుల సంఖ్యను తెలిపే సూటి సంఖ్యారూపం; వ్యక్తుల లెక్కకు తెలుగు వర్గసూచకమైన ‘మంది’ని ఉపయోగించడం సహజం.
- source_word: χωρὶς
  choice: కాకుండా
  rationale: జననవిభక్తితో వచ్చిన χωρίς పేర్కొన్న వర్గాలు లెక్కలో చేర్చబడలేదని సూచిస్తుంది. ‘కాకుండా’ ఈ మినహాయింపు భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: γυναικῶν
  choice: స్త్రీలు
  rationale: ఇక్కడ γυνήకి భార్యలు అనే సంబంధార్థం అవసరం లేదు; జనసమూహంలోని స్త్రీలను సూచిస్తుంది.
- source_word: παιδίων
  choice: పిల్లలు
  rationale: παιδίον అంటే పిల్లవాడు లేదా బిడ్డ; వయస్సును అనవసరంగా కుదించకుండా ‘పిల్లలు’ సహజమైన బహువచనం.
theological_decisions:
- issue: మిశ్రమ జనసమూహంలో లెక్కించబడిన లింగ-నిర్దిష్ట వర్గం
  choice: ἄνδρες ను ‘పురుషులు’గా అనువదించి, స్త్రీలు మరియు పిల్లలు ఆ సంఖ్యలో లేరని స్పష్టంగా ఉంచడం.
  alternative: ‘ప్రజలు’ లేదా ‘వ్యక్తులు’ అని అనువదించడం.
  rationale: గ్రీకు పాఠం పురుషులను ప్రత్యేకంగా లెక్కించి, స్త్రీలను మరియు పిల్లలను వేరుగా పేర్కొంటుంది. ‘ప్రజలు’ అని అనువదిస్తే మూలంలోని లింగ-నిర్దిష్ట వివరమూ చారిత్రక లెక్కింపు విధానమూ కనుమరుగవుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. సంఖ్యకు ‘మంది’ వాడి సహజత్వాన్ని నిలిపి, మూలంలోని పురుషులు/స్త్రీలు/పిల్లలు అనే భేదాన్ని యథాతథంగా ఉంచింది.
