revisions:
- from: వెంటనే యేసు చెయ్యి చాపి అతణ్ణి పట్టుకొని, “కొద్దివిశ్వాసమున్నవాడా, నీవెందుకు సందేహించావు[a]?” అని అతనితో అన్నాడు.
  to: 'వెంటనే యేసు తన చెయ్యి చాపి అతణ్ణి పట్టుకున్నాడు; అతనితో ఇలా అన్నాడు: “అల్పవిశ్వాసీ, నీవెందుకు సందేహించావు[a]?”'
  rationale: The revision clarifies the sequence of Jesus’ action and speech without adding interpretive content. It also replaces an awkwardly formed vocative with a natural, established equivalent for Ὀλιγόπιστε. The lexical ambiguity of ἐδίστασας remains explicitly preserved in the footnote.
  reviewer_model: gpt-5.6-terra
