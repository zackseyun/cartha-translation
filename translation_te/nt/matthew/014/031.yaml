id: MAT.14.31
reference: Matthew 14:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: te
  text: 'వెంటనే యేసు తన చెయ్యి చాపి అతణ్ణి పట్టుకున్నాడు; అతనితో ఇలా అన్నాడు: “అల్పవిశ్వాసీ, నీవెందుకు సందేహించావు[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకు తడబడ్డావు?” ఈ గ్రీకు క్రియ సందేహంతో పాటు సంకోచం లేదా ఊగిసలాటను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: వెంటనే
  rationale: చర్య తక్షణమే జరిగినదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్ప కొనసాగింపు లేదా వ్యత్యాసాన్ని సూచించే అనుసంధాన పదం. తెలుగులో ‘వెంటనే యేసు’ అనే క్రమమే మార్పును సహజంగా తెలియజేస్తుంది.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: చెయ్యి చాపి
  rationale: మూలంలోని స్పష్టమైన చర్యనూ, తదుపరి చర్యకు ముందున్న క్రమాన్నీ సహజంగా నిలుపుతుంది.
- source_word: ἐπελάβετο αὐτοῦ
  choice: అతణ్ణి పట్టుకొని
  rationale: అతనిని అందుకొని గట్టిగా పట్టుకున్న భావాన్ని అతిగా వివరించకుండా వ్యక్తం చేస్తుంది.
- source_word: λέγει αὐτῷ
  choice: అతనితో అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగు కథనంలో సహజమైన భూతకాలంతో అనువదించింది.
- source_word: Ὀλιγόπιστε
  choice: కొద్దివిశ్వాసమున్నవాడా
  rationale: పూర్తిగా విశ్వాసంలేనివాడని కాక, విశ్వాసం తక్కువగా ఉన్నవాడని ఉద్దేశించిన సంబోధనను స్పష్టంగా నిలుపుతుంది.
- source_word: εἰς τί
  choice: ఎందుకు
  rationale: ఈ సందర్భంలో ప్రశ్నార్థక పదబంధానికి సహజమైన తెలుగు సమానం.
- source_word: ἐδίστασας
  choice: సందేహించావు
  rationale: క్రియలోని సందేహ భావాన్ని స్పష్టంగా అందిస్తుంది; తడబాటు లేదా ఊగిసలాట అనే సమీప భావాన్ని పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: Ὀλιγόπιστε అనే సంబోధనలో πίστις భావం
  choice: కొద్దివిశ్వాసమున్నవాడా
  alternative: అల్పవిశ్వాసీ
  rationale: ఈ మాట పేతురుకు విశ్వాసమే లేదని చెప్పదు; అతని విశ్వాసం లోపభూయిష్టంగా లేదా తక్కువగా ఉందని మందలిస్తుంది. ‘కొద్దివిశ్వాసమున్నవాడా’ అనే రూపం ఆ భేదాన్ని సాధారణ పాఠకునికి స్పష్టంగా ఉంచుతుంది.
- issue: ἐδίστασας లో సందేహం మరియు తడబాటు మధ్య భావవ్యాప్తి
  choice: సందేహించావు
  alternative: తడబడ్డావు
  rationale: ప్రధాన పాఠంలో పరిచితమైన ‘సందేహించావు’ను వాడి, మూలక్రియ సూచించగల సంకోచం లేదా ఊగిసలాట భావాన్ని పాదసూచికలో ఇచ్చింది; తద్వారా నిజమైన అర్థసందిగ్ధతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలిని ఉపయోగించింది. ‘చెయ్యి చాపి’, ‘పట్టుకొని’ వంటి సాధారణ పదాలతో మూలంలోని చర్యల క్రమాన్ని స్పష్టంగా ఉంచింది; ‘కొద్దివిశ్వాసమున్నవాడా’ అనే సంబోధన అర్థాన్ని సులభంగా గ్రహించేటట్లు చేస్తుంది.
