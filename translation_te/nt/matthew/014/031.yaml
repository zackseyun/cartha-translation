review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the immediate action, Jesus’ extending of his hand, his taking hold of Peter, the rebuke concerning limited faith, and the question about doubting. The footnote appropriately preserves the semantic range of ἐδίστασας. A small syntactic revision makes the two finite actions in the Greek clearer in Telugu.
  naturalness: The participial chain in the draft is understandable, but “చెయ్యి చాపి అతణ్ణి పట్టుకొని, … అని అతనితో అన్నాడు” can sound compressed and makes the action sequence less crisp. Separating Jesus’ taking hold from his speech is more natural modern Telugu. “అల్పవిశ్వాసీ” is a concise, established Telugu biblical vocative and reads more naturally than the fused “కొద్దివిశ్వాసమున్నవాడా.”
  terminology: '“అల్పవిశ్వాసీ” preserves the contrast intended by Ὀλιγόπιστε: deficient or small faith, not total absence of faith. “సందేహించావు” is a suitable principal rendering for ἐδίστασας, while the note supplies “తడబడ్డావు” and explains the possible nuance of hesitation/wavering.'
  issues:
  - severity: low
    issue: Compressed participial construction
    rationale: The draft’s linked participles are grammatically possible, but two finite clauses better reflect the distinct narrative actions and are smoother in modern standard Telugu.
  - severity: low
    issue: Awkward compound vocative
    rationale: “కొద్దివిశ్వాసమున్నవాడా” is intelligible but stylistically cumbersome. “అల్పవిశ్వాసీ” is idiomatic in the biblical register while retaining the source meaning.
  revised_text: 'వెంటనే యేసు తన చెయ్యి చాపి అతణ్ణి పట్టుకున్నాడు; అతనితో ఇలా అన్నాడు: “అల్పవిశ్వాసీ, నీవెందుకు సందేహించావు[a]?”'
