id: MAT.14.25
reference: Matthew 14:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: te
  text: రాత్రి నాలుగవ జాములో[b] ఆయన సముద్రం మీద నడుస్తూ వారి దగ్గరకు వచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొందరు ఈ మాటను ‘సముద్రం ఒడ్డున నడుస్తూ’ అని అర్థం చేసుకున్నారు; అయితే సందర్భం ఆయన నీటి మీదనే నడిచాడనే అర్థాన్ని బలంగా సమర్థిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: ‘రాత్రి నాలుగవ జాము’ అంటే రోమా కాలవిభజన ప్రకారం రాత్రి చివరి కాపలా సమయం—సుమారు తెల్లవారుజామున 3 గంటల నుంచి 6 గంటల వరకు.
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: రాత్రి నాలుగవ జామలో
  rationale: కాలాన్ని సూచించే దత్తివిభక్తి పదబంధం. ‘జాము’ చారిత్రక రాత్రి కాపలా విభజనను సహజమైన తెలుగులో నిలుపుతుంది; దాని సుమారు సమయాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ కథనాన్ని స్వల్పంగా ముందుకు నడిపే అనుసంధానం. తెలుగు వాక్యప్రవాహంలో దానిని ప్రత్యేకంగా ‘మరియు’ అని పెట్టకపోయినా సంబంధం స్పష్టంగానే ఉంటుంది.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: వారి దగ్గరికి వచ్చాడు
  rationale: πρός తో కూడిన ἦλθεν వారి వైపు కదలి వారిని చేరుకోవడాన్ని సూచిస్తుంది. ‘వారి దగ్గరికి వచ్చాడు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: περιπατῶν
  choice: నడుస్తూ
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలికమైన చర్యను తెలియజేస్తుంది; ‘నడుస్తూ’ దానిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: సముద్రం మీద
  rationale: ఈ సందర్భంలో ἐπί మరియు περιπατῶν నీటి ఉపరితలంపై కదలికను సూచిస్తున్నాయి. θάλασσα యొక్క రూపాన్ని నిలుపుతూ ‘సముద్రం’ అని అనువదించబడింది.
theological_decisions:
- issue: యేసు నీటిపై నడిచిన అద్భుత వర్ణన
  choice: సముద్రం మీద నడుస్తూ
  alternative: సముద్రం ఒడ్డున నడుస్తూ
  rationale: వ్యాకరణం, వెంటనే ఉన్న కథాసందర్భం రెండూ నీటి ఉపరితలంపై నడకనే బలంగా సూచిస్తాయి. అనువాదం అద్భుత స్వభావాన్ని తగ్గించదు, అలాగే మూలానికి మించిన వివరాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘జాము’ చారిత్రక భావాన్ని నిలుపుతుంది; అపరిచితతను పాదసూచిక తొలగిస్తుంది. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
