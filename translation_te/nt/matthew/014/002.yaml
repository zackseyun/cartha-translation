id: MAT.14.2
reference: Matthew 14:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: te
  text: 'అతడు తన సేవకులతో ఇలా అన్నాడు: “ఇతడు బాప్తిస్మమిచ్చే యోహాను. అతడు మృతులలోనుండి లేపబడ్డాడు. అందుకే ఈ శక్తులు[a] అతనిలో పనిచేస్తున్నాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ అద్భుత శక్తులు.” మరింత భావానువాదంగా, “అందుకే అతని ద్వారా అద్భుతాలు జరుగుతున్నాయి.” గ్రీకులో “శక్తులు” అని ఉంది; ఇది అద్భుత కార్యాలలో వ్యక్తమయ్యే అసాధారణ శక్తులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παισὶν
  choice: సేవకులతో
  rationale: παῖς అనే పదానికి సందర్భానుసారం పిల్లవాడు, సేవకుడు, పరిచారకుడు అనే అర్థాలు ఉండవచ్చు. ఇక్కడ హేరోదు తన ఇంటివారిలో లేదా ఆస్థాన పరివారంలో ఉన్నవారితో మాట్లాడుతున్నందున ‘సేవకులతో’ సహజంగా సరిపోతుంది; వారి హోదాను అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ὁ βαπτιστής
  choice: బాప్తిస్మమిచ్చే
  rationale: గ్రీకు బిరుదు యోహాను చేసే బాప్తిస్మ కార్యాన్ని సూచిస్తుంది. ఆధునిక పాఠకులకు అర్థమయ్యేలా, సంప్రదాయ గౌరవాన్ని నిలుపుతూ క్రియాత్మక రూపం వాడబడింది.
- source_word: ἠγέρθη
  choice: లేపబడ్డాడు
  rationale: ἐγείρω యొక్క కర్తరి కాని, భూతకాల రూపంలోని భావాన్ని నిలుపుతుంది. ‘లేచాడు’ అని అనువదించి స్వయంగా లేచినట్లు సూచించకుండా మూలంలోని కర్మణి ప్రయోగాన్ని కాపాడుతుంది.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: మృతులలోనుండి
  rationale: చనిపోయినవారి మధ్యనుండి లేపబడిన భావాన్ని సహజమైన, శాస్త్రగ్రంథ సందర్భానికి తగిన తెలుగులో అందిస్తుంది.
- source_word: διὰ τοῦτο
  choice: అందుకే
  rationale: ముందు చెప్పిన లేపబడటాన్ని తరువాతి శక్తుల కార్యానికి కారణంగా హేరోదు భావిస్తున్న అనుసంధానాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: αἱ δυνάμεις
  choice: ఈ శక్తులు
  rationale: δύναμεις అనే బహువచన నామవాచకాన్ని ‘అద్భుతాలు’ అనే ఫలితకార్యాలుగా పూర్తిగా మార్చకుండా, అసాధారణ కార్యాలలో వ్యక్తమయ్యే శక్తుల భావాన్ని నిలుపుతుంది. సందర్భాన్ని సూచించేందుకు ‘ఈ’ వాడబడింది.
- source_word: ἐνεργοῦσιν
  choice: పనిచేస్తున్నాయి
  rationale: శక్తులు క్రియాశీలంగా, ప్రభావవంతంగా ఉన్నాయనే కొనసాగుతున్న కార్యభావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν αὐτῷ
  choice: అతనిలో
  rationale: ἐν యొక్క ప్రత్యక్ష స్థానార్థాన్ని నిలుపుతుంది. ‘అతని ద్వారా’ అనేది సాధ్యమైన సందర్భార్థమైనా, మూలం కంటే ఎక్కువ వ్యాఖ్యానాత్మకం.
theological_decisions:
- issue: యోహాను తిరిగి వచ్చిన విధానం
  choice: అతడు మృతులలోనుండి లేపబడ్డాడు
  alternative: అతడు మృతులలోనుండి లేచాడు
  rationale: గ్రీకులో కర్మణి ప్రయోగం ఉంది. ఎవరు లేపారో వాక్యం స్పష్టంగా చెప్పకపోయినా, యోహాను తనను తానే లేపుకున్నాడనే భావం రాకుండా వ్యాకరణాన్ని కాపాడుతుంది. ఇది హేరోదు చెప్పిన మాట మాత్రమేననే కథన సందర్భాన్నీ మార్చదు.
- issue: δυνάμεις యొక్క సందర్భార్థం
  choice: ఈ శక్తులు అతనిలో పనిచేస్తున్నాయి
  alternative: ఈ అద్భుత శక్తులు అతనిలో పనిచేస్తున్నాయి; అద్భుతాలు అతని ద్వారా జరుగుతున్నాయి
  rationale: ఈ పదం అద్భుత కార్యాలలో వ్యక్తమయ్యే శక్తులను సూచించినప్పటికీ, ప్రధాన పాఠ్యంలో ‘శక్తులు’ అని ఉంచడం మూలంలోని రూపాన్ని, కొంత అర్థవిస్తృతిని నిలుపుతుంది. ‘అతని ద్వారా అద్భుతాలు’ అనేది స్పష్టీకరణ అయినా మరింత వ్యాఖ్యానాత్మకం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘బాప్తిస్మమిచ్చే యోహాను’ పాఠకులకు బిరుదు యొక్క కార్యార్థాన్ని స్పష్టపరుస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం తరువాత ఉంచబడింది.
