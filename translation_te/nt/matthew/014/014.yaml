id: MAT.14.14
reference: Matthew 14:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: te
  text: ఆయన ఒడ్డుకు దిగినప్పుడు[a], పెద్ద జనసమూహాన్ని చూశాడు. వారిపై కనికరం కలిగి[b], వారిలోని రోగులను స్వస్థపరిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘బయటికి వచ్చినప్పుడు’ లేదా ‘బయటికి వచ్చి.’ ఈ సందర్భంలో ఇది పడవ నుండి ఒడ్డుకు దిగడాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారిని చూసి కనికరంతో కదిలిపోయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: ఒడ్డుకు దిగినప్పుడు
  rationale: ఈ కృదంతానికి అక్షరార్థంగా ‘బయటికి వచ్చి’ అనే భావం ఉంది. అయితే పడవలో వచ్చిన సందర్భంలో, ఆయన ఒడ్డుకు దిగడాన్ని సూచించే సహజమైన తెలుగు వాక్యరూపం సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: εἶδεν
  choice: చూశాడు
  rationale: ὁράω క్రియ యొక్క సాధారణ భూతకాల భావాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: πολὺν ὄχλον
  choice: పెద్ద జనసమూహాన్ని
  rationale: πολύς యొక్క పరిమాణ భావాన్నీ, ὄχλος యొక్క సమూహ భావాన్నీ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: వారిపై కనికరం కలిగి
  rationale: σπλαγχνίζομαι సూచించే లోతైన దయను అతిశయోక్తి లేకుండా, గౌరవప్రదమైన సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐθεράπευσεν
  choice: స్వస్థపరిచాడు
  rationale: ఈ సందర్భంలో θεραπεύω శారీరక రోగాలను బాగుచేయడాన్ని సూచిస్తుంది; ‘స్వస్థపరిచాడు’ బైబిలు సందర్భానికి తగిన, సులభంగా అర్థమయ్యే రూపం.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: వారిలోని రోగులను
  rationale: సమూహానికి చెందిన అనారోగ్యులనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది. ‘వారి రోగులను’ అనే అతి సంక్షిప్త రూపం తెలుగులో వారు ఇతరులకు చెందినవారన్న అపార్థానికి దారితీయవచ్చు.
theological_decisions:
- issue: యేసు భావోద్వేగ స్పందనను వ్యక్తం చేయడం
  choice: వారిపై కనికరం కలిగి
  alternative: వారిని చూసి కనికరంతో కదిలిపోయి
  rationale: మూలపాఠం యేసు లోతైన కనికరాన్ని ఆయన చేసిన స్వస్థత కార్యంతో అనుసంధానిస్తుంది. ఎంచుకున్న రూపం ఆ దయాభావాన్ని నిలుపుతూ, మూలంలో లేని భావోద్వేగ తీవ్రతను అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, గౌరవప్రదమైన కథనశైలిని వాడాం. గ్రీకు వాక్యంలోని వరుస చర్యలను తెలుగులో సహజంగా చదవడానికి రెండు వాక్యాలుగా అమర్చాం; భావ సంబంధాన్ని మార్చలేదు.
