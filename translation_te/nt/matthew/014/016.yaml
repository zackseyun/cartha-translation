id: MAT.14.16
reference: Matthew 14:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: te
  text: అయితే యేసు వారితో, “వారు వెళ్లిపోవాల్సిన అవసరం లేదు; మీరే వారికి తినడానికి ఏదైనా ఇవ్వండి” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: శిష్యులు జనాన్ని పంపివేయాలని చెప్పిన మాటకు యేసు ఇచ్చిన జవాబులోని స్వల్ప వ్యతిరేకతను సహజంగా తెలియజేస్తుంది.
- source_word: εἶπεν αὐτοῖς
  choice: వారితో ... అన్నాడు
  rationale: తెలుగు కథన శైలిలో మాటను పరిచయం చేసే సహజమైన నిర్మాణం; αὐτοῖς అనే పరోక్ష కర్మను స్పష్టంగా నిలుపుతుంది.
- source_word: Οὐ χρείαν ἔχουσιν ἀπελθεῖν
  choice: వారు వెళ్లిపోవాల్సిన అవసరం లేదు
  rationale: χρείαν ἔχουσιν అనే అవసర భావాన్నీ, ἀπελθεῖν అనే అక్కడి నుంచి వెళ్లిపోవడాన్నీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δότε αὐτοῖς ... φαγεῖν
  choice: వారికి తినడానికి ఏదైనా ఇవ్వండి
  rationale: గ్రీకు భాషలోని ‘తినడానికి ఇవ్వండి’ అనే నిర్మాణాన్ని తెలుగులో సహజం చేయడానికి సందర్భంలో అంతర్లీనంగా ఉన్న ఆహార వస్తువును ‘ఏదైనా’గా వ్యక్తం చేస్తుంది.
- source_word: ὑμεῖς
  choice: మీరే
  rationale: గ్రీకులో ప్రత్యేకంగా ఉంచిన సర్వనామంలోని కర్తృత్వ ఉద్ఘాటనను సంక్షిప్తంగా, సహజంగా కాపాడుతుంది.
theological_decisions:
- issue: యేసు ఆజ్ఞలో శిష్యుల పాత్రపై ఉద్ఘాటన
  choice: ὑμεῖς ను ‘మీరే’ అని అనువదించడం
  alternative: కేవలం ‘మీరు’ అని అనువదించడం
  rationale: శిష్యులే ఆ జనానికి ఆహారం ఇవ్వాలని యేసు నేరుగా ఉద్ఘాటించిన భావాన్ని నిలుపుతుంది; దానికి మించిన సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అదే సమయంలో గౌరవప్రదమైన కథన శైలి. సంభాషణలో బహువచన ఆజ్ఞకు గౌరవ/సాధారణ రూపమైన ‘ఇవ్వండి’ వాడబడింది.
