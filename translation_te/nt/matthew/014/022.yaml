id: MAT.14.22
reference: Matthew 14:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: te
  text: వెంటనే ఆయన శిష్యులను పడవ ఎక్కి, తాను జనసమూహాలను పంపివేసేంతవరకు తనకంటే ముందుగా అవతలి ఒడ్డుకు వెళ్లమని బలవంతం చేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: వెంటనే
  rationale: కథనంలో చర్య ఆలస్యం లేకుండా జరిగిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἠνάγκασεν
  choice: బలవంతం చేశాడు
  rationale: శిష్యులు అలా చేయాలని యేసు గట్టిగా పట్టుబడి చేయించిన భావాన్ని నిలుపుతుంది; మూలంలో లేని శారీరక హింసను ప్రత్యేకంగా చేర్చదు.
- source_word: τοὺς μαθητάς
  choice: శిష్యులను
  rationale: సందర్భంలో ఇప్పటికే తెలిసిన శిష్యుల సమూహాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేక నిర్దేశక పదం అవసరం లేదు.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: పడవ ఎక్కి
  rationale: పడవలోకి ప్రవేశించడం లేదా దానిని ఎక్కడం అనే భావానికి సహజమైన తెలుగు ప్రయోగం.
- source_word: πλοῖον
  choice: పడవ
  rationale: సందర్భంలో నిర్దిష్ట పడవ ఉద్దేశించబడినా, తెలుగులో నామవాచకానికి నిర్దిష్ట ఉపపదం అవసరం లేదు.
- source_word: προάγειν αὐτόν
  choice: తనకంటే ముందుగా ... వెళ్లమని
  rationale: శిష్యులు యేసుకంటే ముందుగా బయలుదేరి వెళ్లాలనే మూల భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὸ πέραν
  choice: అవతలి ఒడ్డుకు
  rationale: నీటి ఆవలి వైపును సూచించే ఈ గ్రీకు ప్రయోగానికి సందర్భోచితమైన స్పష్టమైన తెలుగు సమానం.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: పంపివేసేంతవరకు
  rationale: ప్రధాన చర్యకు భవిష్యత్తులో ముగింపు బిందువుగా జనసమూహాలను పంపివేయడాన్ని చూపే గ్రీకు నిర్మాణాన్ని నిలుపుతుంది.
- source_word: τοὺς ὄχλους
  choice: జనసమూహాలను
  rationale: గ్రీకులోని బహువచనాన్ని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా మరియు సులభంగా అర్థమయ్యే రూపం.
