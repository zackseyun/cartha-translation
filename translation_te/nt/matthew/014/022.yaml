  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని చర్యల క్రమం, ἠνάγκασεν యొక్క బలమైన భావం, προάγειν αὐτόν లోని ‘ఆయనకంటే ముందుగా’ అనే సంబంధం నిలుపబడ్డాయి.
