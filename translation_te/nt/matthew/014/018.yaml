  footnotes:
  - marker: a
    text: అంటే, మునుపటి వచనంలో ప్రస్తావించిన రొట్టెలను, చేపలను.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: శిష్యుల అభ్యంతరానికి యేసు ఇచ్చిన ప్రతిస్పందనను సూచించే స్వల్ప వ్యత్యాస సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἶπεν
  choice: అన్నాడు
  rationale: ఆరిస్ట్ రూపంలోని λέγωకు సరళమైన, సహజమైన తెలుగు సమానం; క్రియలో లేని అదనపు ఆజ్ఞార్థ ఛాయను చేర్చదు.
- source_word: Φέρετέ
  choice: తీసుకురండి
  rationale: రెండవ పురుష బహువచన వర్తమాన ఆజ్ఞార్థాన్ని గౌరవపూర్వకమైన, సహజమైన తెలుగు ఆజ్ఞగా వ్యక్తం చేస్తుంది.
- source_word: μοι
  choice: నా దగ్గరకు
  rationale: దత్తివాచక సర్వనామం సూచించే వ్యక్తిగత గమ్యాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὧδε
  choice: ఇక్కడికి
  rationale: స్థలాన్ని సూచించే ὧδε అర్థాన్ని గమనదిశకు అనుగుణమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: αὐτούς
  choice: వాటిని
  rationale: మునుపటి వచనంలో చెప్పిన రొట్టెలను, చేపలను సమష్టిగా సూచిస్తుంది; ప్రధాన పాఠ్యంలో అనవసర పునరుక్తి లేకుండా గ్రీకు సర్వనామ సూచనను కాపాడుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘ఇక్కడికి, నా దగ్గరకు’ అనే క్రమం ὧδε మరియు μοι రెండింటినీ స్పష్టంగా నిలుపుతుంది; విరామచిహ్నం వాటి సన్నిహిత భావాన్ని సహజంగా చూపుతుంది.
