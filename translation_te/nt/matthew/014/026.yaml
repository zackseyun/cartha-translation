id: MAT.14.26
reference: Matthew 14:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: te
  text: అయితే శిష్యులు ఆయన సముద్రం మీద నడుస్తుండడం చూసి భయభ్రాంతులై, “అది ఒక దెయ్యం![a]” అని అన్నారు. భయంతో కేకలు వేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రేతరూపం,” “భూతాకారం.”
    reason: φάντασμα అనేది భయంకరంగా కనిపించిన ప్రత్యక్ష రూపాన్ని, ప్రేతరూపాన్ని లేదా భూతాకారాన్ని సూచించవచ్చు; ‘దెయ్యం’ శిష్యుల భయభ్రాంతి కలిగిన అభిప్రాయాన్ని సులభంగా వ్యక్తం చేస్తుంది.
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వాక్యంతో స్వల్ప కథన వ్యత్యాసాన్ని చూపుతూ, శిష్యుల అకస్మాత్తు ప్రతిస్పందనను సహజంగా పరిచయం చేస్తుంది.
- source_word: μαθηταὶ
  choice: శిష్యులు
  rationale: నిర్దిష్ట ఉపదేశపదం సందర్భంలో యేసు శిష్యులనే సూచిస్తుంది; తెలుగులో అదనపు నిర్దేశక పదం అవసరం లేదు.
- source_word: ἰδόντες αὐτὸν
  choice: ఆయన ... నడుస్తుండడం చూసి
  rationale: అయోరిస్ట్ కృదంతాన్ని సహజమైన తెలుగు కాలసంబంధ నిర్మాణంతో అందిస్తూ, చూసిన తరువాత వచ్చిన ప్రతిస్పందనను నిలుపుతుంది.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: సముద్రం మీద నడుస్తుండడం
  rationale: ἐπί మరియు షష్ఠీ విభక్తి ఇక్కడ సముద్రపు ఉపరితలంపై నడకను సూచిస్తాయి; మూలంలోని ‘సముద్రం’ అనే పదాన్ని నిలుపుతుంది.
- source_word: ἐταράχθησαν
  choice: కలవరపడి
  rationale: ταράσσω సూచించే అంతరంగిక అల్లకల్లోలం లేదా తీవ్ర కలతను తెలుపుతుంది; తరువాతి భయకేక ఆ తీవ్రతను స్పష్టం చేస్తుంది.
- source_word: λέγοντες
  choice: అని అన్నారు
  rationale: వారి ప్రతిస్పందనలో భాగంగా పలికిన మాటను సహజమైన తెలుగు ప్రత్యక్ష వాక్య నిర్మాణంతో పరిచయం చేస్తుంది.
- source_word: Φάντασμά ἐστιν
  choice: అది ఒక దయ్యం!
  rationale: φάντασμα భయంకరంగా కనిపించిన అతీంద్రియ ఆకారాన్ని సూచిస్తుంది. సాధారణ ఆధునిక తెలుగులో ‘దయ్యం’ వెంటనే అర్థమవుతుంది; ఇది శిష్యుల భ్రమను మాత్రమే నివేదిస్తుంది.
- source_word: ἀπὸ τοῦ φόβου
  choice: భయంతో
  rationale: ἀπό ఇక్కడ కారణాన్ని లేదా మూలాన్ని సూచిస్తుంది; ‘భయంతో’ సంక్షిప్తమైన, సహజమైన తెలుగు ప్రయోగం.
- source_word: ἔκραξαν
  choice: కేకలు వేశారు
  rationale: κράζω బిగ్గరగా అరవడాన్ని సూచిస్తుంది; భయసందర్భంలో ‘కేకలు వేశారు’ తగిన తీవ్రతను తెలియజేస్తుంది.
theological_decisions:
- issue: శిష్యులు పలికిన φάντασμα స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘దయ్యం’
  alternative: ‘ప్రేతరూపం’ లేదా ‘భూతాకారం’
  rationale: ఈ వాక్యం ఆత్మల ఉనికి గురించి సిద్ధాంతపరమైన ప్రకటన చేయదు; భయపడిన శిష్యులు యేసును ఏమని పొరబడ్డారో మాత్రమే చెబుతుంది. ‘దయ్యం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, పాదటిప్పణి మూలపదంలోని ‘కనిపించిన ఆకారం’ అనే విస్తృత భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆయన’ ద్వారా యేసుకు సందర్భానుకూల గౌరవం చూపబడింది. ప్రధాన పాఠ్యం సాధారణ పాఠకులకు సులభంగా ఉండేలా ఉండగా, పాదటిప్పణి φάντασμα యొక్క పదార్థ పరిధిని నిలుపుతుంది.
