id: MAT.14.27
reference: Matthew 14:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: te
  text: 'అయితే వెంటనే యేసు వారితో ఇలా అన్నాడు: “ధైర్యంగా ఉండండి; నేనే[a]; భయపడకండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా అక్షరార్థంగా, “నేను ఉన్నాను.” ఇక్కడ గ్రీకు పదబంధం సాధారణ స్వీయ గుర్తింపుగా పనిచేయవచ్చు; అయితే కొందరికి ఇందులో దేవుని స్వీయ ప్రకటనకు సాధ్యమైన ప్రతిధ్వని వినిపిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: వెంటనే
  rationale: కాలపరమైన తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వాక్యంలో శిష్యుల భయానికి, ఇప్పుడు యేసు ఇచ్చిన ధైర్యానికి మధ్య ఉన్న స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: ἐλάλησεν ... λέγων
  choice: వారితో ... అని చెప్పాడు
  rationale: గ్రీకు వాక్య నిర్మాణంలోని మాటలాడటం మరియు ప్రత్యక్ష ఉక్తిని తెలుగులో పునరుక్తి లేకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτοῖς
  choice: వారితో
  rationale: యేసు తన శిష్యులను ఉద్దేశించి మాట్లాడినట్లు సహజమైన తెలుగు ప్రయోగంతో తెలియజేస్తుంది.
- source_word: Θαρσεῖτε
  choice: ధైర్యంగా ఉండండి
  rationale: బహువచన ఆజ్ఞలోని ప్రోత్సాహక స్వరాన్ని స్పష్టమైన, సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἐγώ εἰμι
  choice: నేనే
  rationale: ఈ సందర్భంలో భయపడుతున్న శిష్యులకు యేసు తనను తాను గుర్తుచేసే సహజమైన తెలుగు రూపం; గ్రీకులోని అక్షరార్థ రూపం మరియు సాధ్యమైన లోతైన ప్రతిధ్వని పాదసూచికలో నిలుపబడింది.
- source_word: μὴ φοβεῖσθε
  choice: భయపడకండి
  rationale: నిషేధాత్మక బహువచన ఆజ్ఞను సహజంగా తెలుపుతుంది; భయం అప్పటికే మొదలైందని అతిగా నిర్దిష్టపరచదు.
theological_decisions:
- issue: ἐγώ εἰμι అనేది సాధారణ స్వీయ గుర్తింపా, లేక దైవిక స్వీయ ప్రకటనకు సాధ్యమైన ప్రతిధ్వనియా
  choice: ప్రధాన పాఠంలో సందర్భానుకూలమైన స్వీయ గుర్తింపుగా “నేనే”
  alternative: మరింత అక్షరార్థంగా “నేను ఉన్నాను”
  rationale: తక్షణ కథన సందర్భంలో యేసు భయపడుతున్న శిష్యులకు తనను తాను గుర్తుచేస్తున్నాడు. అయినప్పటికీ గ్రీకు పదబంధంలోని సాధ్యమైన దైవిక ప్రతిధ్వనిని తొలగించకుండా పాదసూచికలో అక్షరార్థ రూపాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. “ధైర్యంగా ఉండండి” మరియు “భయపడకండి” బహువచన సంబోధనను నిలుపుతాయి; ప్రధాన పాఠం సులభంగా అర్థమయ్యేలా ఉండగా పాదసూచిక మూలంలోని ఉద్దేశపూర్వక theological ambiguityని సంరక్షిస్తుంది.
