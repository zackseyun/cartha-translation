    issue: The expression 'పేతురు ఆయనతో ... అన్నాడు' is syntactically and idiomatically awkward.
    rationale: In Telugu, 'ఆయనతో అన్నాడు' suggests speaking with him rather than answering him. Ἀποκριθεὶς ... εἶπεν is better represented as 'ఆయనకు ఇలా జవాబిచ్చాడు,' which explicitly conveys Peter's response.
  revised_text: 'అందుకు పేతురు ఆయనకు ఇలా జవాబిచ్చాడు: “ప్రభువా, నీవే అయితే, నీళ్లపై[a] నీ దగ్గరకు రమ్మని నాకు ఆజ్ఞాపించు.”'
