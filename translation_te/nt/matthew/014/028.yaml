id: MAT.14.28
reference: Matthew 14:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: te
  text: 'అందుకు పేతురు ఆయనకు ఇలా జవాబిచ్చాడు: “ప్రభువా, నీవే అయితే, నీళ్లపై[a] నీ దగ్గరకు రమ్మని నాకు ఆజ్ఞాపించు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీటిపై.” గ్రీకు మూలంలో “నీళ్లపై” అని బహువచనం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: అందుకు పేతురు ఆయనతో ... అన్నాడు
  rationale: δέతో కూడిన ఈ సాధారణ కథన సూత్రాన్ని ఆధునిక తెలుగులో సహజంగా ‘అందుకు’ అని అనుసంధానించాం. αὐτῷను ‘ఆయనతో’ అని వ్యక్తం చేసి, εἶπενను ‘అన్నాడు’గా ఉంచడం తెలుగు సంభాషణా నిర్మాణానికి తగినది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును నేరుగా సంబోధించే గౌరవార్థక పదంగా, అలాగే సాధ్యమైన క్రీస్తుసంబంధమైన భావభారాన్ని తగ్గించకుండా ‘ప్రభువా’ అని అనువదించాం.
- source_word: εἰ σὺ εἶ
  choice: నీవే అయితే
  rationale: సందర్భంలో కనిపిస్తున్న వ్యక్తి నిజంగా యేసేనా అనే గుర్తింపును సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: κέλευσόν με
  choice: నాకు ఆజ్ఞాపించు
  rationale: κελεύωలోని అధికారపూర్వక ఆదేశ భావాన్ని ‘ఆజ్ఞాపించు’ స్పష్టంగా నిలుపుతుంది.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: నీ దగ్గరకు రమ్మని
  rationale: πρὸς σέ వ్యక్తివైపు కదలికను సూచిస్తుంది; పేతురు దృష్టికోణం నుంచి ‘నీ దగ్గరకు రమ్మని’ సహజంగా ఉంది.
- source_word: ἐπὶ τὰ ὕδατα
  choice: నీళ్లపై
  rationale: గ్రీకు బహువచనాన్ని ప్రతిబింబిస్తూ, తెలుగులో సహజమైన ‘నీళ్లపై’ని ఎంచుకున్నాం. మూలంలో లేని ‘నడిచి’ అనే క్రియను చేర్చలేదు.
theological_decisions:
- issue: యేసును κύριε అని సంబోధించడంలోని భావబలం
  choice: ప్రభువా
  alternative: బోధకుడా / అయ్యా
  rationale: ఇది కేవలం మర్యాదపూర్వక సంబోధన మాత్రమే అని పరిమితం చేయకుండా, మత్తయి సందర్భంలో ఉండగల క్రీస్తుసంబంధమైన భావభారాన్ని కూడా అతిశయింపకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా ఉండేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని నిలుపుతూ అనువదించబడింది. మూలపాఠంలోని సంక్షిప్తతను కాపాడేందుకు ‘నడిచి’ వంటి సందర్భానుగతమైనప్పటికీ స్పష్టంగా లేని పదాన్ని చేర్చలేదు.
