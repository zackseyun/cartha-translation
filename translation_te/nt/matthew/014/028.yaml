  verdict: revise
  source_fidelity: The draft accurately conveys Peter's address, the conditional identification ('if it is you'), the authoritative imperative, movement toward Jesus, and the plural sense of ἐπὶ τὰ ὕδατα. However, 'పేతురు ఆయనతో ... అన్నాడు' is not a natural or precise rendering of ἀποκριθεὶς ... εἶπεν ('Peter answered him/answered and said').
  naturalness: Replace the awkward 'ఆయనతో ... అన్నాడు' with the standard, natural Telugu narrative expression 'ఆయనకు ఇలా జవాబిచ్చాడు.' The revised sentence remains modern standard Telugu while retaining a suitably dignified biblical register.
  terminology: '''ప్రభువా'' appropriately renders Κύριε and preserves its possible theological force without interpretation. ''ఆజ్ఞాపించు'' suitably conveys κελεύω. ''నీళ్లపై'' is idiomatic Telugu and preserves the Greek plural; the footnote accurately records the singular alternative.'
  issues:
