id: MAT.14.32
reference: Matthew 14:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: te
  text: వారు పడవలోకి ఎక్కినప్పుడు[a], గాలి ఆగిపోయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత అక్షరార్థంగా, ‘వారు పడవలోకి ఎక్కిన తరువాత.’
    reason: కాలవాచక షష్ఠీ స్వతంత్ర నిర్మాణానికి సాధ్యమైన మరింత అక్షరార్థ అనువాదాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: ἀναβάντων αὐτῶν
  choice: వారు పడవలోకి ఎక్కినప్పుడు
  rationale: కర్తరి షష్ఠీ స్వతంత్ర నిర్మాణాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అనువదించాం. ἀναβαίνω అక్షరార్థంగా ‘పైకి ఎక్కు’ అయినా, εἰς τὸ πλοῖονతో ఉన్న ఈ సందర్భంలో ‘పడవలోకి ఎక్కు’ సహజంగా ఉంటుంది.
- source_word: πλοῖον
  choice: పడవ
  rationale: గలిలయ సముద్రంలో శిష్యులు ఉపయోగించిన జాలరుల పడవను సూచించడానికి ఆధునిక తెలుగులో ‘పడవ’ సహజమైన పదం; ‘ఓడ’ అనేది అవసరానికి మించిన పెద్ద నౌక భావాన్ని కలిగించవచ్చు.
- source_word: ἐκόπασεν
  choice: ఆగిపోయింది
  rationale: κοπάζω గాలి లేదా తుపాను ఆగిపోవడం, అణగిపోవడం అనే భావాన్ని ఇస్తుంది. ఏకకాలిక కథన చర్యను ‘ఆగిపోయింది’ నేరుగా, సహజంగా తెలియజేస్తుంది; క్రమంగా ప్రశాంతమైందనే అదనపు భావాన్ని చేర్చదు.
- source_word: ὁ ἄνεμος
  choice: గాలి
  rationale: నిర్దిష్ట కథన సందర్భంలోని గాలిని తెలుగులో సహజంగా ‘గాలి’ అని వ్యక్తం చేశాం.
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ καί కథనాన్ని కొనసాగించే సంధాయకం. తెలుగు వాక్యక్రమంలో కాలవాచక ఉపవాక్యాన్ని నేరుగా ప్రారంభించడం సహజం; ‘మరియు’ అని ఉంచితే అసహజంగా ఉంటుంది, ‘అప్పుడు’ అని పెడితే వాక్యంలో ఇప్పటికే ఉన్న కాలసంబంధాన్ని అనవసరంగా పునరుక్తి చేస్తుంది.
theological_decisions:
- issue: ప్రకృతిపై యేసు అధికారాన్ని సూచించే కథనార్థం
  choice: వారు పడవలోకి ఎక్కినప్పుడు గాలి ఆగిపోయిందనే సంఘటనను మాత్రమే నేరుగా అనువదించాం.
  alternative: ఈ సంఘటనను అద్భుతమని లేదా యేసు అధికారానికి ప్రత్యక్ష ప్రదర్శనగా వివరిస్తూ పదాలను చేర్చడం.
  rationale: సందర్భంలో theological significance స్పష్టంగా ఉన్నా, గ్రీకు వాక్యం సంఘటనను మాత్రమే చెబుతుంది. కారణాన్ని లేదా వివరణను అదనంగా చేర్చకుండా కథనంలోని ఉద్దేశపూర్వక సంక్షిప్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘పడవలోకి ఎక్కినప్పుడు’ మరియు ‘గాలి ఆగిపోయింది’ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే రూపాలు.
