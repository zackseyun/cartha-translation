translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ἀνήρ యొక్క లింగ-నిర్దిష్టతను ‘పురుషులు’గా నిలిపి, గ్రీకులో అంతర్లీనంగా ఉన్న పంపబడిన విషయాన్ని ప్రధాన పాఠంలో సహజత్వం కోసం ‘కబురు’గా వ్యక్తపరచి పాదటిప్పణిలో స్పష్టం చేశాం.
