    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες
  choice: గుర్తుపట్టి
  rationale: ఇక్కడ క్రియారూపం యేసును చూసి గుర్తించడాన్ని సూచిస్తుంది; విస్తృతమైన సంబంధపూర్వక ‘తెలుసుకోవడం’ అనే భావం కాదు.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: ఆ ప్రాంతంలోని పురుషులు
  rationale: ἀνήρ ప్రత్యేకంగా పురుషులను సూచిస్తుంది; τόπος ఇక్కడ యేసు చేరిన ప్రాంతాన్ని సూచిస్తుంది.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: చుట్టుపక్కల ప్రాంతమంతటికీ కబురు పంపించారు
  rationale: గ్రీకులో ‘పంపించారు’ అనే క్రియకు కర్మ చెప్పబడలేదు. తెలుగులో సహజంగా భావం అందేందుకు ‘కబురు’ను స్పష్టం చేసి, మూలంలోని లోపార్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: προσήνεγκαν αὐτῷ
  choice: ఆయన దగ్గరికి తీసుకొచ్చారు
  rationale: ఈ సందర్భంలో προσφέρω వ్యక్తులను యేసు దగ్గరికి తీసుకురావడాన్ని సూచిస్తుంది; బలిగా అర్పించడం అనే భావం లేదు.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: అనారోగ్యంతో ఉన్న వారందరినీ
  rationale: κακῶς ἔχειν అనేది అనారోగ్యంగా లేదా అస్వస్థంగా ఉండటాన్ని తెలిపే గ్రీకు నానుడి.
