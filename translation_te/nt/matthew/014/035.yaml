  text: And when the men of that place recognized him[a], they sent into that whole surrounding region and brought to him all who were sick[b],
translation:
  language: te
  text: ఆ ప్రాంతంలోని పురుషులు ఆయనను గుర్తుపట్టి, చుట్టుపక్కల ఉన్న ఆ ప్రాంతమంతటికీ పంపించారు[a]. అనారోగ్యంతో ఉన్న వారందరినీ ఆయన దగ్గరికి తీసుకొచ్చారు[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకు పాఠంలో ‘పంపించారు’ అనే క్రియకు కర్మ స్పష్టంగా లేదు. ‘చుట్టుపక్కల ఉన్న ఆ ప్రాంతమంతటికీ పంపించారు’ అని అక్షరార్థంగా అనువదించవచ్చు. పంపింది కబురునా, కబురు చెప్పే మనుషులనా అనేది సందర్భం ద్వారా అర్థమవుతుంది.
    reason: lexical_alternative
  - marker: b
