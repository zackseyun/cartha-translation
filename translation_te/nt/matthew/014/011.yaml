translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథనశైలి వాడబడింది. గ్రీకులోని కర్మణి రూపాలను తెలుగులో కృతకంగా వినిపించే ‘తీసుకురాబడింది/ఇవ్వబడింది’ రూపాల బదులు సహజమైన అనిర్దిష్ట కర్త బహువచనంతో అందించాం. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘పళ్లెంలో’ అన్న పదం వెంట ఉంచాం.
