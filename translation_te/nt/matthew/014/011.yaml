id: MAT.14.11
reference: Matthew 14:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: te
  text: అతని తలను ఒక పళ్లెంలో[a] తీసుకొచ్చి ఆ అమ్మాయికి ఇచ్చారు. ఆమె దానిని తన తల్లి దగ్గరకు తీసుకెళ్లింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఒక తట్టలో.’ గ్రీకు పదం πίναξ వడ్డించడానికి ఉపయోగించే పళ్లెం లేదా తట్టను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: తీసుకొచ్చి
  rationale: φέρω అనే క్రియ యొక్క భూతకాల కర్మణి రూపం. తెలుగు కథనశైలిలో కర్మణి భావాన్ని సహజమైన అనిర్దిష్ట కర్త బహువచనంతో వ్యక్తం చేస్తూ, తరువాతి క్రియతో అనుసంధానించడానికి ‘తీసుకొచ్చి’ ఎంచుకున్నాం.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: అతని తలను
  rationale: మూలంలోని స్పష్టమైన, కఠినమైన చిత్రణను మృదువుచేయకుండా నేరుగా అనువదిస్తుంది.
- source_word: ἐπὶ πίνακι
  choice: ఒక పళ్లెంలో
  rationale: πίναξ ఇక్కడ వడ్డించడానికి ఉపయోగించే పెద్ద పళ్లెం లేదా తట్టను సూచిస్తుంది. ఆధునిక తెలుగులో ‘పళ్లెం’ సహజంగా, స్పష్టంగా ఉంటుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἐδόθη
  choice: ఇచ్చారు
  rationale: δίδωμι యొక్క భూతకాల కర్మణి రూపం. తెలుగులో ‘ఇవ్వబడింది’ కంటే అనిర్దిష్ట కర్తతో ‘ఇచ్చారు’ కథనానికి సహజంగా ఉండి, ఎవరు ఇచ్చారో మూలం చెప్పకపోవడాన్ని అలాగే ఉంచుతుంది.
- source_word: τῷ κορασίῳ
  choice: ఆ అమ్మాయికి
  rationale: κοράσιον అంటే అమ్మాయి లేదా చిన్న వయసుగల అమ్మాయి. సందర్భంలో ‘ఆ అమ్మాయి’ సహజంగా ఉండి, మూలంలో లేని నిర్దిష్ట వయస్సును చేర్చదు.
- source_word: ἤνεγκεν
  choice: తీసుకెళ్లింది
  rationale: అమ్మాయి పళ్లెంలోని తలను తన తల్లి దగ్గరకు తీసుకెళ్లిన దిశను తెలుగులో సహజంగా తెలియజేస్తుంది. స్పష్టత కోసం ‘దానిని’ అనే కర్మను సరఫరా చేశాం.
- source_word: τῇ μητρὶ αὐτῆς
  choice: తన తల్లి దగ్గరకు
  rationale: αὐτῆς అమ్మాయి తల్లినే సూచిస్తుంది. వాక్యకర్త అమ్మాయే కాబట్టి ఆధునిక తెలుగులో ‘తన తల్లి’ అనడం సహజంగా, సందిగ్ధత లేకుండా ఉంటుంది.
