translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘ఆయన’ ద్వారా సందర్భంలోని యేసును గౌరవసూచకంగా సూచించాం. మూలంలోని వరుస ఏకాంత సూచనలను తొలగించకుండా నిలిపాం.
