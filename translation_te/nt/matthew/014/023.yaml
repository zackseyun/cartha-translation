id: MAT.14.23
reference: Matthew 14:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: te
  text: జనసమూహాలను పంపివేసిన తర్వాత, ఆయన ప్రార్థించడానికి ఒంటరిగా[a] కొండపైకి వెళ్లాడు. సాయంకాలమైనప్పుడు ఆయన అక్కడ ఒంటరిగా ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏకాంతంగా.”
    reason: κατ’ ἰδίαν అనే పదబంధం ‘తానొక్కడే’ అనే భావంతో పాటు ‘ప్రత్యేకంగా, ఏకాంతంగా’ అనే భావాన్నీ ఇవ్వగలదు.
lexical_decisions:
- source_word: ἀπολύσας
  choice: పంపివేసిన తర్వాత
  rationale: ప్రధాన క్రియకు ముందే జరిగిన చర్యను సూచించే భూతకాల కృదంతాన్ని సహజమైన తెలుగు కాలవాచక నిర్మాణంతో వ్యక్తం చేస్తుంది; జనసమూహాలను అక్కడి నుంచి పంపడం అనే సందర్భార్థాన్ని కాపాడుతుంది.
- source_word: τοὺς ὄχλους
  choice: జనసమూహాలను
  rationale: గ్రీకులోని బహువచనాన్ని నిలుపుతూ, గుమికూడిన ప్రజల సమూహాలను ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: కొండపైకి వెళ్లాడు
  rationale: కొండవైపు పైకి సాగిన కదలికను సహజమైన తెలుగులో తెలియజేస్తుంది; ‘అధిరోహించాడు’ వంటి అసహజమైన ఉన్నత శైలిని నివారిస్తుంది.
- source_word: κατ’ ἰδίαν
  choice: ఒంటరిగా
  rationale: ఇతరులకు దూరంగా తానొక్కడే వెళ్లాడనే సందర్భార్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది. ‘ఏకాంతంగా’ అనే ‘ప్రత్యేకంగా/ప్రైవేటుగా’ భావాన్ని సూచించే ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: προσεύξασθαι
  choice: ప్రార్థించడానికి
  rationale: కొండపైకి వెళ్లడంలోని ఉద్దేశాన్ని తెలిపే గ్రీకు క్రియారూపాన్ని తెలుగు ప్రయోజనార్థక నిర్మాణంతో నేరుగా అందిస్తుంది.
- source_word: ὀψίας δὲ γενομένης
  choice: సాయంకాలమైనప్పుడు
  rationale: కాలసంబంధ నేపథ్యాన్ని తెలిపే genitive absolute నిర్మాణాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అనువదిస్తుంది.
- source_word: μόνος ἦν ἐκεῖ
  choice: ఆయన అక్కడ ఒంటరిగా ఉన్నాడు
  rationale: స్థలాన్ని మరియు ఆయన ఏకాంత స్థితిని రెండింటినీ నిలుపుతుంది; మొదటి ‘ఒంటరిగా’తో ఉన్న పునరుక్తి మూలపాఠంలో κατ’ ἰδίαν మరియు μόνος ద్వారా వచ్చిన ఉద్దేశపూర్వక భావాన్ని ప్రతిబింబిస్తుంది.
