source:
  edition: SBLGNT
  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: te
  text: రాజు దుఃఖించినప్పటికీ, తాను చేసిన ప్రమాణాల కారణంగాను, తనతో భోజనం చేస్తున్నవారి[a] కారణంగాను, దాన్ని[b] ఇవ్వమని ఆజ్ఞాపించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తనతో బల్లవద్ద ఆనుకొని ఉన్నవారి.’ ఆ కాలంలో భోజనం చేసేటప్పుడు బల్లవద్ద ఆనుకొని ఉండే ఆచారాన్ని గ్రీకు పదం ప్రతిబింబిస్తుంది.
    reason: cultural_note
  - marker: b
    text: ‘ఇవ్వబడాలి’ అనేదానికి కర్మ ఏమిటో గ్రీకు వాక్యం స్పష్టంగా చెప్పదు; ముందరి సందర్భంలో కోరినదే ఇక్కడ ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: దుఃఖించినప్పటికీ
  rationale: ఈ భూతకాల కర్మణి కృదంతం రాజు దుఃఖానికి లోనయ్యాడని తెలియజేస్తుంది. తరువాత అతడు ఆజ్ఞ ఇచ్చిన చర్యతో ఈ దుఃఖం విరుద్ధంగా ఉన్నందున, సందర్భంలోని concessive భావాన్ని ‘దుఃఖించినప్పటికీ’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὁ βασιλεὺς
  choice: రాజు
  rationale: βασιλεύςకు నేరమైన, సందర్భోచితమైన ఆధునిక తెలుగు పదం ‘రాజు’.
- source_word: διὰ τοὺς ὅρκους
  choice: తాను చేసిన ప్రమాణాల కారణంగా
  rationale: διά + accusative కారణాన్ని సూచిస్తుంది; ὅρκους ప్రమాణాలను సూచిస్తుంది. అవి రాజు చేసిన ప్రమాణాలేనని ముందరి సందర్భం స్పష్టం చేస్తుంది కాబట్టి ‘తాను చేసిన’ అని సహజంగా వ్యక్తపరచబడింది.
- source_word: τοὺς συνανακειμένους
  choice: తనతో భోజనం చేస్తున్నవారు
  rationale: ఈ కృదంతం అతనితో కలిసి భోజనానికి బల్లవద్ద ఆనుకొని ఉన్నవారిని సూచిస్తుంది. ‘తనతో భోజనం చేస్తున్నవారు’ ప్రాచీన భోజన భంగిమను ప్రధాన వాక్యంలో అనవసరంగా ముందుకు తేవకుండా సామాజిక సందర్భాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐκέλευσεν
  choice: ఆజ్ఞాపించాడు
  rationale: κελεύωలోని అధికారపూర్వకంగా ఆదేశించే భావాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన కథన శైలిలో అందిస్తుంది.
- source_word: δοθῆναι
  choice: దాన్ని ఇవ్వమని
  rationale: గ్రీకులో ఇది ‘ఇవ్వబడుటకు’ అనే కర్మణి infinitive; ఇవ్వవలసినది వాక్యంలో స్పష్టంగా చెప్పబడలేదు. తెలుగులో సహజమైన ‘దాన్ని ఇవ్వమని’ ఆ సూచిత విషయాన్ని వివరించి చెప్పకుండా అలాగే ఉంచుతుంది.
