  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ⸂αὐτῷ ὁ Ἰωάννης⸃· Οὐκ ἔξεστίν σοι ἔχειν αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: te
  text: 'ఎందుకంటే యోహాను అతనికి ఇలా చెబుతూ ఉండేవాడు: “ఆమెను ఉంచుకోవడం నీకు ధర్మసమ్మతం కాదు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమెను ఉంచుకోవడానికి నీకు అనుమతి లేదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: చెబుతూ ఉండేవాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ కొనసాగుతూ లేదా పదేపదే జరిగిన మాటను సూచిస్తుంది; తెలుగు ప్రయోగం ఆ దురేటివ్ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి సందర్భానికి కారణాత్మక వివరణను అందించే సంధానార్థాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: αὐτῷ
  choice: అతనితో
  rationale: λέγωతో వచ్చిన దత్తివాచక సర్వనామాన్ని తెలుగులో సహజమైన పరోక్ష కర్మగా అందిస్తుంది.
- source_word: ὁ Ἰωάννης
  choice: యోహాను
  rationale: మూలపాఠంలో ఉన్న పేరును మాత్రమే ఉంచుతుంది; సందర్భం అతడు బాప్తిస్మమిచ్చే యోహాను అని ఇప్పటికే గుర్తిస్తుంది.
- source_word: Οὐκ ἔξεστίν
  choice: ధర్మసమ్మతం కాదు
  rationale: ἔξεστιν‌లోని అనుమతి మరియు ధర్మశాస్త్రబద్ధత అనే నైతిక-చట్టపరమైన భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: σοι
  choice: నీకు
  rationale: వ్యక్తిని సూచించే దత్తివాచకాన్ని తెలుగు వాక్యనిర్మాణంలో నేరుగా నిలుపుతుంది.
- source_word: ἔχειν
  choice: ఉంచుకోవడం
  rationale: స్త్రీతో కొనసాగుతున్న దాంపత్య/సహచర్య సంబంధాన్ని సందర్భానుసారంగా సూచిస్తూ, ‘కలిగి ఉండడం’ అనే అసహజ పదప్రయోగాన్ని నివారిస్తుంది; సంబంధ స్వరూపాన్ని పాఠంలో అదనంగా నిర్వచించదు.
- source_word: αὐτήν
  choice: ఆమెను
  rationale: హెరోదియను సూచించే స్త్రీలింగ సర్వనామాన్ని నేరుగా అనువదిస్తుంది.
theological_decisions:
- issue: యోహాను చేసిన మందలింపు స్వభావం
  choice: “ధర్మసమ్మతం కాదు” అనే నైతిక-చట్టపరమైన నిషేధం
  alternative: “అనుమతి లేదు” లేదా “సరైంది కాదు”
  rationale: ἔξεστιν కేవలం సాధారణ సముచితతకన్నా అనుమతి లేదా ధర్మబద్ధతను సూచిస్తుంది. ‘ధర్మసమ్మతం కాదు’ ఆ పదునైన భావాన్ని నిలుపుతుంది; ఏ ప్రత్యేక ధార్మిక సంప్రదాయం యొక్క వివరణనూ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే బైబిల్ వచనానికి తగిన గౌరవప్రదమైన శైలిలో ఉంది. అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావం, γάρ యొక్క వివరణాత్మక సంబంధం, ἔξεστιν యొక్క ధర్మబద్ధత/అనుమతి భావం నిలుపబడ్డాయి.
