  source_fidelity: The imperfect ἔλεγεν is correctly represented as ongoing/repeated speech, and γάρ is retained as an explanatory connective. The prohibition and its moral-legal force are also preserved. However, αὐτῷ is more idiomatically rendered with అతనికి in this speech context than with అతనితో.
