translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. యేసును ఉద్దేశించిన ఆజ్ఞకు తెలుగు గౌరవార్థక బహువచన రూపం వాడాం. ఆంగ్ల consultation layerలో పాదటిప్పణి గుర్తులు వాటి భావాలకు సరిపోని స్థానాల్లో కనిపించినందున, మూల గ్రీకు ఆధారంగా [a]ను ἔρημος వద్దకు, [b]ను ἡ ὥρα ἤδη παρῆλθεν వద్దకు అమర్చాం.
