id: MAT.14.15
reference: Matthew 14:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: te
  text: సాయంకాలమైనప్పుడు శిష్యులు ఆయన దగ్గరకు వచ్చి, “ఈ ప్రదేశం నిర్జనమైనది[a], ఇప్పటికే చాలా ఆలస్యమైంది[b]. జనసమూహాలు గ్రామాలకు వెళ్లి తమ కోసం ఆహారం కొనుక్కునేందుకు వారిని పంపివేయండి” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఇది జనావాసాలు లేని ప్రదేశం.”
    reason: lexical_alternative
  - marker: b
    text: పదశః, “సమయం ఇప్పటికే దాటిపోయింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: సాయంకాలమైనప్పుడు
  rationale: ఈ genitive absolute కాలసంబంధమైన కథన మార్పును సూచిస్తుంది. ‘సాయంకాలమైనప్పుడు’ సహజమైన ఆధునిక తెలుగు; δέ యొక్క స్వల్ప కథన అనుసంధానాన్ని ప్రత్యేక పదంతో బలవంతంగా చూపించలేదు.
- source_word: προσῆλθον αὐτῷ
  choice: ఆయన దగ్గరకు వచ్చి
  rationale: προσέρχομαι ఇక్కడ ‘దగ్గరకు రావడం/సమీపించడం’ అనే సాధారణ అర్థంలో ఉంది. ఈ సందర్భంలో ఈ రూపం సహజంగా ఉంటుంది.
- source_word: οἱ μαθηταὶ
  choice: శిష్యులు
  rationale: గ్రీకు definite article సందర్భంలో ఇప్పటికే తెలిసిన శిష్యుల సమూహాన్ని సూచిస్తుంది. తెలుగులో అదనంగా ‘ఆయన శిష్యులు’ అని చేర్చకుండా సందర్భమే నిర్దిష్టతను తెలియజేస్తుంది.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: ఇది జనసంచారం లేని ప్రదేశం
  rationale: ἔρημος ఇక్కడ సమీప జనావాసం లేదా జనసంచారం లేని ప్రాంతాన్ని సూచిస్తుంది. ‘ఎడారి’ అనే భౌగోళిక భావాన్ని అనవసరంగా కలిగించకుండా ఈ అనువాదం సందర్భార్థాన్ని అందిస్తుంది.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: ఇప్పటికే ఆలస్యమైంది
  rationale: పదశః ‘గడియ/సమయం ఇప్పటికే దాటిపోయింది’; సందర్భంలో రోజు బాగా గడిచిపోయి ఆలస్యమైందనే నుడికారార్థం ఉంది. ప్రధాన పాఠ్యంలో సహజమైన తెలుగు వాడి, పదశః రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: జనసమూహాలను పంపించివేయండి
  rationale: ἀπολύω ఇక్కడ వారిని అక్కడి నుంచి వెళ్లనివ్వడం లేదా పంపివేయడం అనే అర్థంలో ఉంది. గౌరవార్థక ఆజ్ఞారూపం తెలుగు సంభాషణకు తగినది.
- source_word: ἵνα ἀπελθόντες εἰς τὰς κώμας
  choice: వారు గ్రామాలకు వెళ్లి
  rationale: ἵνα clause ఉద్దేశాన్ని, దానిలోని participle ముందుగా వెళ్లడాన్ని సూచిస్తాయి. తరువాతి ‘కొనుక్కోవాలి’తో కలిపి తెలుగులో ఉద్దేశం సహజంగా వ్యక్తమవుతుంది.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: తమ కోసం ఆహారం కొనుక్కోవాలి
  rationale: βρώματα సాధారణంగా ఆహారాన్ని సూచిస్తుంది; ἑαυτοῖς లోని reflexive భావాన్ని ‘తమ కోసం’ స్పష్టంగా నిలుపుతుంది.
