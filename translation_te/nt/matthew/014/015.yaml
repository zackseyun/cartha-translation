revisions:
- from: సాయంకాలమైనప్పుడు శిష్యులు ఆయన దగ్గరకు వచ్చి, “ఇది జనసంచారం లేని ప్రదేశం[a]; ఇప్పటికే ఆలస్యమైంది[b]. జనసమూహాలను పంపించివేయండి. వారు గ్రామాలకు వెళ్లి తమ కోసం ఆహారం కొనుక్కోవాలి” అన్నారు.
