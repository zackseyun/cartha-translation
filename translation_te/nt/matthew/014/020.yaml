id: MAT.14.20
reference: Matthew 14:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: te
  text: వారందరూ తిని తృప్తి చెందారు. మిగిలిన ముక్కలతో[a] నిండిన పన్నెండు గంపలను వారు ఎత్తుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిగిలిన విరిగిన ముక్కలతో.” గ్రీకు పదం భోజనం తర్వాత మిగిలిన విరిగిన ముక్కలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: తిని
  rationale: కథన క్రమంలో జరిగిన సాధారణ భూతకాల క్రియను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πάντες
  choice: వారందరూ
  rationale: జనసమూహంలోని ప్రతి ఒక్కరినీ సూచించే గ్రీకు పదం యొక్క సమగ్ర భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐχορτάσθησαν
  choice: తృప్తి చెందారు
  rationale: కడుపు నిండేంతగా తిన్నారనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; అద్భుతానికి అదనపు వ్యాఖ్యానాన్ని జోడించదు.
- source_word: ἦραν
  choice: పోగుచేయగా
  rationale: మిగిలిన ముక్కలను ఎత్తి సేకరించిన సందర్భోచిత భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὸ περισσεῦον
  choice: మిగిలిపోయిన
  rationale: అవసరానికి మించి మిగిలినదాన్ని సూచించే కృదంత భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: τῶν κλασμάτων
  choice: ముక్కలను
  rationale: విరిచిన లేదా విరిగిన ఆహారపు ముక్కలను సూచిస్తుంది; సందర్భంలో ఇవి రొట్టె ముక్కలు అయినప్పటికీ మూలపాఠంలో లేని ‘రొట్టె’ను ప్రధాన వచనంలో చేర్చలేదు.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: పన్నెండు గంపలు నిండాయి
  rationale: ‘పన్నెండు నిండు గంపలు’ అనే పరిమాణ భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో అందిస్తుంది.
theological_decisions:
- issue: అద్భుత భోజనం తరువాత అందరూ పూర్తిగా తృప్తిపడినట్లు తెలిపే సాధారణ భాష
  choice: తృప్తి చెందారు
  alternative: కడుపు నిండింది
  rationale: గ్రీకు క్రియలోని పూర్తిగా భుజించి తృప్తిపడిన భావాన్ని నిలుపుతూ, సంఘటనకు మూలపాఠంలో లేని వేదాంత వ్యాఖ్యానాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘గంపలు’ సాధారణ పాఠకులకు సహజమైన పదం; వాక్య క్రమం గ్రీకు భావ సంబంధాన్ని నిలుపుతూ తెలుగులో సులభంగా చదవబడేలా రూపొందించబడింది.
