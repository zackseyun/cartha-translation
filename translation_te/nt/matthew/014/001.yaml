id: MAT.14.1
reference: Matthew 14:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἤκουσεν Ἡρῴδης ὁ τετραάρχης τὴν ἀκοὴν Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/001.yaml
  text: At that time Herod the tetrarch heard the report about Jesus,[a]
translation:
  language: te
  text: ఆ సమయంలో చతుర్థాంశ పాలకుడైన హేరోదు యేసును గురించిన వార్త విన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యేసును గురించిన సమాచారం.’
    reason: ἀκοή అనే పదం ఇక్కడ ‘వార్త’ లేదా ‘సమాచారం’ అనే సమీపార్థాలను కలిగి ఉండవచ్చు.
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: ఆ సమయంలో
  rationale: గ్రీకు పదబంధం కాలాన్ని సూచించే సహజమైన నుడికారం; ఆధునిక తెలుగులో ‘ఆ సమయంలో’ సహజంగా ఉండి మూలార్థాన్ని నిలుపుతుంది.
- source_word: ἤκουσεν
  choice: విన్నాడు
  rationale: ἀκούω క్రియకు ఇక్కడ నేరమైన అర్థం ‘విన్నాడు’; ‘తెలుసుకున్నాడు’ వంటి భావానువాదం కంటే ఇది మూలానికి దగ్గరగా ఉంది.
- source_word: Ἡρῴδης
  choice: హేరోదు
  rationale: వ్యక్తి పేరుకు తెలుగులో స్థిరపడిన బైబిలు రూపాన్ని ఉపయోగించాం.
- source_word: ὁ τετραάρχης
  choice: చతుర్థాంశ పాలకుడైన
  rationale: ఇది రోమా పరిపాలనలోని నిర్దిష్టమైన రాజకీయ పదవి. సాధారణ ‘రాజు’ అని అనకుండా, పదవి యొక్క చారిత్రక ప్రత్యేకతను నిలుపుతూ తెలుగులో అర్థమయ్యేలా అనువదించాం.
- source_word: τὴν ἀκοὴν
  choice: వార్త
  rationale: ఇక్కడ ἀκοή వినికిడి శక్తిని కాక, వినబడిన సమాచారం లేదా వార్తను సూచిస్తుంది. ‘వార్త’ ఆధునిక తెలుగులో సహజమైన ఎంపిక.
- source_word: Ἰησοῦ
  choice: యేసును గురించిన
  rationale: ἀκοή తరువాతి షష్ఠీ విభక్తి వార్త యొక్క విషయాన్ని సూచిస్తుంది; తెలుగులో ‘యేసును గురించిన’ అని సహజంగా వ్యక్తమవుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. ‘చతుర్థాంశ పాలకుడు’ అనే చారిత్రక పదవికి పాఠకులకు కొంత అపరిచితత్వం ఉండవచ్చుగాని, ‘రాజు’ వంటి అస్పష్టమైన పదంతో దాని ప్రత్యేకతను చెరపకుండా ఉంచాం.
