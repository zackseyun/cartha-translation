id: MAT.14.30
reference: Matthew 14:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: te
  text: అయితే బలమైన గాలిని[a] చూసి అతడు భయపడ్డాడు. మునిగిపోవడం మొదలవగానే, “ప్రభువా, నన్ను రక్షించు[b]!” అని కేక వేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భీకరమైన గాలిని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నన్ను కాపాడు.” ఇక్కడి గ్రీకు క్రియ తక్షణ ప్రమాదం నుంచి కాపాడడాన్నీ, మరింత విస్తృతమైన అర్థంలో రక్షించడాన్నీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων
  choice: చూసి
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలీనమైన గ్రహింపును సూచిస్తుంది; తెలుగులో ‘చూసి’ సహజంగా ఆ అనుసంధానాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: పేతురు అంతకుముందు నీటిమీద నడిచిన దృశ్యానికి ఇప్పుడు వచ్చే విరుద్ధ మలుపును సూచిస్తుంది.
- source_word: ἄνεμον ἰσχυρόν
  choice: బలమైన గాలిని
  rationale: ἰσχυρός నేరుగా ἄνεμοςను విశేషిస్తుంది. ‘బలమైన గాలి’ స్పష్టమైన, సహజమైన తెలుగు; తీవ్రతను అతిశయింపజేయదు.
- source_word: ἐφοβήθη
  choice: భయపడ్డాడు
  rationale: భయం కలిగిన క్షణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: మునిగిపోవడం మొదలవగానే
  rationale: అతడు ఇంకా పూర్తిగా మునిగిపోలేదు; మునిగే ప్రక్రియ మొదలైనదనే గ్రీకు భావాన్ని నిలుపుతుంది.
- source_word: ἔκραξεν λέγων
  choice: అని కేక వేశాడు
  rationale: అత్యవసరమైన బిగ్గర మొరను సహజమైన తెలుగు ప్రత్యక్షోక్తి నిర్మాణంలో అందిస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: యేసును నేరుగా సంబోధించే κύριεకు గౌరవాన్నీ క్రీస్తుసంబంధమైన భావబరువునీ నిలిపే ప్రామాణిక తెలుగు రూపం.
- source_word: σῶσόν με
  choice: నన్ను రక్షించు
  rationale: తక్షణ ప్రమాదం నుంచి విడిపించమనే మొరను స్పష్టంగా తెలిపి, σῴζωకు ఉన్న విస్తృతమైన ‘రక్షించు’ భావాన్ని కూడా నిలుపుతుంది.
theological_decisions:
- issue: యేసును నేరుగా సంబోధించిన κύριε అనువాదం
  choice: ప్రభువా
  alternative: బోధకుడా / యజమానీ
  rationale: ‘ప్రభువా’ అనే రూపం సంబోధనలోని గౌరవాన్నీ మత్తయి సువార్తలో ఉండే క్రీస్తుసంబంధమైన భావబరువునీ నిలుపుతుంది; పాఠం చెప్పేదానికంటే ఎక్కువ సిద్ధాంతాన్ని జోడించదు.
- issue: తక్షణ శారీరక ప్రమాదంలో σῴζω అనువాదం
  choice: నన్ను రక్షించు
  alternative: నన్ను కాపాడు
  rationale: సందర్భం నీటిలో మునిగే తక్షణ ప్రమాదమే అయినా, ‘రక్షించు’ ఆ భౌతిక భావాన్ని సహజంగా తెలిపడంతో పాటు గ్రీకు క్రియకు ఉన్న విస్తృత భావసామర్థ్యాన్ని అనవసరంగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. గ్రీకు కృదంతాలన్నిటినీ యాంత్రికంగా అనుకరించకుండా, వాటి కాలసంబంధం మరియు చర్యల క్రమాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలిపాం.
