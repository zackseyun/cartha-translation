reference: Matthew 14:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅθεν μετὰ ὅρκου ὡμολόγησεν αὐτῇ δοῦναι ὃ ⸀ἐὰν αἰτήσηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/007.yaml
  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: te
  text: అందుచేత ఆమె ఏది అడిగినా ఇస్తానని అతడు ప్రమాణం చేసి వాగ్దానం చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆమె ఏది అడిగితే అది.’ గ్రీకు పదబంధం (ὃ ἐὰν αἰτήσηται) ముందుగా నిర్దిష్టం కాని, భవిష్యత్తులో చేయగల అభ్యర్థనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: అందుచేత
  rationale: ముందటి సంఘటన ఫలితంగా ఈ వాగ్దానం చేసినట్లు సూచించే కారణార్థక/ఫలితార్థక అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μετὰ ὅρκου
  choice: ప్రమాణం చేసి
  rationale: వాగ్దానం ప్రమాణపూర్వకంగా చేయబడిందనే భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὡμολόγησεν
  choice: వాగ్దానం చేశాడు
  rationale: ఈ సందర్భంలో ఈ క్రియ బహిరంగమైన లేదా దృఢమైన అంగీకారాన్ని సూచిస్తుంది; ‘వాగ్దానం చేశాడు’ సందర్భానికి సరిపోతుంది.
- source_word: αὐτῇ
  choice: ఆమె
  rationale: ఇది ఆ అమ్మాయిని సూచించే పరోక్ష కర్మ. తెలుగులో ‘ఆమె ... ఇస్తానని’ అనే నిర్మాణం ద్వారా సంబంధం సహజంగా వ్యక్తమవుతుంది.
- source_word: δοῦναι
  choice: ఇస్తానని
  rationale: వాగ్దానంలోని విషయాన్ని తెలిపే క్రియారూపంగా, తెలుగు ప్రత్యక్ష వాగ్దాన నిర్మాణంలో సహజంగా ఉంది.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: ఏది అడిగినా
  rationale: ἐάνతో కూడిన సంభావనార్థక క్రియ ఉన్న అనిర్దిష్ట సంబంధ వాక్యభాగం; భవిష్యత్తులో ఆమె కోరబోయేది ముందుగా నిర్దిష్టం కాదనే తెరచిన భావాన్ని నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘ప్రమాణం చేసి వాగ్దానం చేశాడు’ అనే రూపం గ్రీకులోని ప్రమాణంతో కూడిన దృఢ వాగ్దానాన్ని స్పష్టంగా ఉంచుతుంది; ‘ఏది అడిగినా’ అనిర్దిష్టమైన భవిష్యత్ అభ్యర్థన భావాన్ని కాపాడుతుంది.
