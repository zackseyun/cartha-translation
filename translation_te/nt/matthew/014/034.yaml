  text: And after crossing over[a], they came to the land of Gennesaret.
translation:
  language: te
  text: వారు అవతలికి దాటిన తర్వాత, గెన్నెసరెతు ప్రాంతంలోని నేలకు చేరుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు గెన్నెసరెతు ప్రాంతంలోని నేల మీదికి వచ్చారు.’ గ్రీకులో ‘నేల మీదికి’ మరియు ‘గెన్నెసరెతులోనికి’ అనే భావాలు కలిసి ఉన్నాయి; ఇది గెన్నెసరెతు ప్రాంతంలోని నేలకు, సందర్భానుసారంగా ఒడ్డుకు, చేరడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπεράσαντες
  choice: అవతలికి దాటిన తర్వాత
  rationale: అనంతర క్రియకంటే ముందుగా పూర్తయిన చర్యను సూచించే భూతకాల అసమాపక క్రియారూపం. ‘అవతలికి దాటి’ అనే జలప్రయాణ భావాన్ని నిలుపుతూ, ప్రయాణ సాధనాన్ని అనవసరంగా పేర్కొనదు.
- source_word: ἦλθον
  choice: చేరుకున్నారు
  rationale: ἔρχομαι క్రియకు ఇక్కడ గమ్యస్థానాన్ని సూచించే పదబంధం తోడై ఉన్నందున, ఆధునిక తెలుగులో ‘చేరుకున్నారు’ సహజంగా రాక మరియు గమ్యప్రాప్తి రెండింటినీ తెలియజేస్తుంది.
- source_word: ἐπὶ τὴν γῆν
  choice: భూభాగానికి
  rationale: అక్షరార్థంగా ‘నేల/భూమి మీదికి’. పడవ ప్రయాణ సందర్భంలో నీటినుంచి నేలవైపు చేరడాన్ని తెలియజేస్తుంది; ‘ఒడ్డు’ అని అనువదిస్తే సందర్భార్థం స్పష్టమవుతుంది గాని γῆ కంటే కొంత ఎక్కువ వ్యాఖ్యానం చేరుతుంది.
- source_word: εἰς Γεννησαρέτ
  choice: గెన్నెసరెతు ప్రాంతంలోని
  rationale: ἐπὶ τὴν γῆν మరియు εἰς Γεννησαρέτ కలిసి గెన్నెసరెతు ప్రాంతపు నేల/భూభాగానికి చేరడాన్ని వ్యక్తం చేస్తున్నాయి. ‘ప్రాంతంలోని’ అనేది అసహజమైన పదబంధాన్ని తెలుగులో సహజంగా చేస్తూనే ప్రాదేశిక భావాన్ని నిలుపుతుంది.
- source_word: Γεννησαρέτ
  choice: గెన్నెసరెతు
  rationale: స్థలనామాన్ని గ్రీకు ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో లిప్యంతరీకరించాం.
