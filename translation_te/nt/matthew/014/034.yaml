    issue: ‘భూభాగానికి’ is an awkward and somewhat over-broad rendering of ἐπὶ τὴν γῆν in this context.
    rationale: It can denote a landmass rather than arrival on land from the water. ‘నేలకు’ is direct, modern, and preserves the Greek’s broader ‘land’ wording; the footnote can note ‘shore’ as contextual sense.
