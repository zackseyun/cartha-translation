  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. ‘భూభాగం’ మూలంలోని γῆ భావాన్ని నిలుపుతుంది; మరింత సందర్భానుకూలమైన ‘ఒడ్డు’ భావాన్ని పాదసూచిక వివరిస్తుంది.
