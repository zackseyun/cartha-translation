id: MAT.14.19
reference: Matthew 14:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: te
  text: ఆయన జనసమూహాలను గడ్డిమీద కూర్చోమని ఆదేశించి, ఆ ఐదు రొట్టెలను, ఆ రెండు చేపలను తీసుకున్నాడు. ఆకాశం వైపు కన్నులెత్తి చూసి, ఆశీర్వదించాడు[a]. తర్వాత రొట్టెలను విరిచి శిష్యులకు ఇచ్చాడు; శిష్యులు వాటిని జనసమూహాలకు ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవునికి ఆశీర్వాదం పలికాడు’ / ‘ఆశీర్వాద ప్రార్థన చేశాడు.’ గ్రీకు మూలంలో ‘ఆశీర్వదించాడు’ అనే క్రియకు కర్మ స్పష్టంగా చెప్పబడలేదు.
    reason: కర్మలేని εὐλόγησεν అనే పదానికి ఉన్న ప్రత్యామ్నాయ అర్థసాధ్యతను కాపాడడం.
lexical_decisions:
- source_word: κελεύσας
  choice: ఆదేశించి
  rationale: ఇది సాధారణ సూచనకన్నా బలమైన ఆజ్ఞ లేదా నిర్దేశాన్ని సూచిస్తుంది; అసమాపక క్రియారూపం ప్రధాన చర్యకు ముందున్న క్రమాన్ని సహజంగా చూపుతుంది.
- source_word: τοὺς ὄχλους
  choice: జనసమూహాలను
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది.
- source_word: ἀνακλιθῆναι
  choice: కూర్చోమని
  rationale: మూలపదానికి భోజనానికి వాలికూర్చోవడం అనే భావం ఉన్నా, ఆధునిక తెలుగు సందర్భంలో ‘గడ్డిమీద కూర్చోమని’ సహజంగా ఉండి చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τοῦ χόρτου
  choice: గడ్డిమీద
  rationale: మత్తయి వచనంలోని సాధారణ ‘గడ్డి’ అనే వివరాన్నే ఇస్తుంది; ‘పచ్చని’ వంటి అదనపు విశేషణాన్ని చేర్చదు.
- source_word: τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας
  choice: ఆ ఐదు రొట్టెలను, రెండు చేపలను
  rationale: ἄρτοι ఇక్కడ రొట్టెలను, ἰχθύες చేపలను సూచిస్తాయి; సంఖ్యలను మరియు మొదటి నామవాచకంతో ఉన్న నిర్దిష్టతను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: ఆకాశం వైపు కన్నులెత్తి చూసి
  rationale: పైకి చూడడం అనే క్రియాభావాన్ని స్పష్టంగా ఉంచుతూ తెలుగు కథనశైలిలో సహజంగా ఉంది.
- source_word: εὐλόγησεν
  choice: ఆశీర్వదించాడు
  rationale: గ్రీకులో కర్మ తెలుపబడలేదు. తెలుగులోనూ కర్మను చేర్చకుండా ఉంచడం ద్వారా మూలంలోని సందిగ్ధత నిలుస్తుంది.
- source_word: κλάσας
  choice: రొట్టెలను విరిచి
  rationale: విరిచినవి రొట్టెలేనని సందర్భం సూచిస్తుంది; తెలుగులో అవసరమైన స్పష్టత కోసం కర్మను పునరుక్తం చేస్తుంది.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους· οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: శిష్యులకు ఇచ్చాడు; శిష్యులు వాటిని జనసమూహాలకు ఇచ్చారు
  rationale: మొదటి భాగంలోని ఇవ్వడం అనే క్రియను రెండవ భాగంలో గ్రీకు వదిలేసినా అది అంతర్నిహితంగా ఉంది; తెలుగులో పూర్తి క్రియను ఉంచడం అర్థాన్ని సహజంగా, స్పష్టంగా చేస్తుంది.
theological_decisions:
- issue: εὐλόγησεν అనే క్రియకు కర్మ ఏమిటి?
  choice: కర్మను పేర్కొనకుండా ‘ఆశీర్వదించాడు’ అని అనువదించడం
  alternative: ‘దేవుణ్ణి స్తుతించాడు’ లేదా ‘ఆశీర్వాద ప్రార్థన చేశాడు’; మరొక సాధ్యతగా రొట్టెలను, చేపలను ఆశీర్వదించాడు
  rationale: మూల గ్రీకులో ప్రత్యక్ష కర్మ లేదు. ఆహారంపై దేవుణ్ణి స్తుతించడం అనే యూదుల భోజన ఆచారం సూచితమై ఉండవచ్చు; సమీప సందర్భం ఆహారాన్ని కూడా సాధ్యమైన కర్మగా భావించే వీలు ఇస్తుంది. ప్రధాన పాఠ్యంలో కర్మను చేర్చకపోవడం ఈ నిజమైన సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే కథనశైలి. పొడవైన గ్రీకు వాక్యాన్ని స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం. ‘వాలికూర్చోవడం’ అనే అక్షరార్థ రూపం అసహజంగా ఉండటంతో ‘కూర్చోమని’ వాడాం. మూలంలోని ఆశీర్వాద క్రియకు కర్మను ప్రధాన పాఠ్యంలో కావాలనే చేర్చలేదు.
