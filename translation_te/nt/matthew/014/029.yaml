id: MAT.14.29
reference: Matthew 14:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: te
  text: ఆయన, “రా” అన్నాడు. అప్పుడు పేతురు పడవ దిగి, నీళ్ల మీద నడిచి, యేసు వైపు వచ్చాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యేసు దగ్గరకు వచ్చాడు’ అని కూడా అనువదించవచ్చు. గ్రీకు పదబంధం యేసు దిశగా కదలడాన్ని నొక్కిచెబుతుంది; ఆయన దగ్గరకు చేరుకున్నాడని తప్పనిసరిగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθέ
  choice: రా
  rationale: ἔρχομαι పదానికి చెందిన ఏకవచన ఆజ్ఞారూపం. యేసు పేతురును నేరుగా పిలిచిన సంక్షిప్త ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో ‘రా’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: పడవ దిగి
  rationale: ఈ భూతకాల అసమాపక క్రియ ముందుగా జరిగిన చర్యను సూచిస్తుంది. ‘పడవ దిగి’ అనేది చర్యల క్రమాన్ని సహజంగా ఉంచుతుంది; πλοῖονకు ఈ గలిలయ సందర్భంలో ‘పడవ’ తగిన పదం.
- source_word: περιεπάτησεν
  choice: నడిచి
  rationale: ఇక్కడ περιπατέω సాధారణంగా నడవడాన్ని సూచిస్తుంది. తరువాతి క్రియతో సహజంగా కలిపేందుకు ‘నడిచి’ అని ఇచ్చినా, పేతురు నీళ్ల మీద నడిచాడనే ప్రత్యేక చర్య స్పష్టంగానే ఉంటుంది.
- source_word: ἐπὶ τὰ ὕδατα
  choice: నీళ్ల మీద
  rationale: ἐπίతో కూడిన ఈ పదబంధం నీటి ఉపరితలంపై కదలడాన్ని సూచిస్తుంది. ఆధునిక సాధారణ తెలుగులో ‘నీళ్ల మీద’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: యేసు వైపు వచ్చాడు
  rationale: πρός యేసు దిశగా జరిగిన కదలికను సూచిస్తుంది. ‘యేసు వైపు’ అనేది ఆయన దగ్గరకు చేరుకున్నాడని తప్పనిసరిగా నిర్ధారించకుండా ఆ దిశార్థాన్ని కాపాడుతుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథనంలోని తదుపరి స్పందనను పరిచయం చేస్తుంది. తెలుగులో ‘అప్పుడు’ కథన ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పేతురు యేసు దిశగా కదలడాన్ని వర్ణించడం
  choice: యేసు వైపు వచ్చాడు
  alternative: యేసు దగ్గరకు వచ్చాడు
  rationale: గ్రీకు πρός ప్రధానంగా యేసు దిశగా కదలడాన్ని తెలియజేస్తుంది; పేతురు ఆయన దగ్గరకు పూర్తిగా చేరుకున్నాడని ఈ వాక్యభాగమే నిర్ధారించదు. అందువల్ల కథనంలోని ఉద్విగ్నతను ముందుగానే పరిష్కరించకుండా ‘వైపు’ అని అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా సంక్షిప్తమైనప్పటికీ గౌరవప్రదమైన కథన శైలిని వాడాం. యేసు మాటలోని నేర ఆజ్ఞకు సందర్భానుగుణంగా ‘రా’ ఉంచాం; నీటికి సహజ తెలుగు రూపమైన ‘నీళ్లు’ వాడాం.
