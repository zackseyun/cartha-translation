  terminology: “పడవ,” “నీళ్ల మీద,” “పేతురు,” and “యేసు” are suitable and consistent choices. The respectful narrative reference “ఆయన” is appropriate, while the direct command “రా” correctly retains the Greek singular imperative's immediacy. The footnote is clear and accurately explains the viable alternative without imposing an endpoint on the Greek.
