  text: οἱ δὲ λέγουσιν αὐτῷ· Οὐκ ἔχομεν ὧδε εἰ μὴ πέντε ἄρτους καὶ δύο ἰχθύας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/017.yaml
  text: But they said to him[a], “We have nothing here except five loaves and two fish.”
translation:
  language: te
  text: 'అయితే వారు ఆయనతో ఇలా అన్నారు: “ఇక్కడ మా దగ్గర ఐదు రొట్టెలు, రెండు చేపలు తప్ప మరేమీ లేవు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: అందుకు వారు
  rationale: δέ ఇక్కడ యేసు ముందుగా ఇచ్చిన ఆదేశానికి శిష్యుల జవాబును స్వల్ప వ్యత్యాసంతో అనుసంధానిస్తుంది. ఆధునిక తెలుగు కథనంలో ‘అందుకు వారు’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: λέγουσιν αὐτῷ
  choice: ఆయనతో … అన్నారు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథన శైలిలో భూతకాలమైన ‘అన్నారు’ సహజంగా ఉంటుంది; αὐτῷను ‘ఆయనతో’గా వ్యక్తం చేశాం.
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: ఇక్కడ మా దగ్గర … తప్ప మరేమీ లేవు
  rationale: నిషేధ వాక్యం తరువాత εἰ μήకు ‘తప్ప’ అనే మినహాయింపు భావం ఉంది. ‘మా దగ్గర’ కలిపి తెలుగులో స్వాధీన భావాన్ని సహజంగా వ్యక్తం చేస్తూ, ὧδεలోని ‘ఇక్కడ’ అనే స్థల సూచనను నిలుపుతుంది.
- source_word: πέντε ἄρτους
  choice: ఐదు రొట్టెలు
  rationale: ἄρτος ఇక్కడ లెక్కించగల రొట్టెలను సూచిస్తుంది; ‘ఐదు రొట్టెలు’ సాధారణమైన, సందర్భోచితమైన తెలుగు రూపం.
- source_word: δύο ἰχθύας
  choice: రెండు చేపలు
  rationale: ἰχθύαςకు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానం ‘చేపలు’.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. మూలంలోని మినహాయింపు నిర్మాణం ‘తప్ప మరేమీ లేవు’గా సహజంగా నిలుపబడింది; వివరణాత్మక పాదసూచిక అవసరం లేదు.
