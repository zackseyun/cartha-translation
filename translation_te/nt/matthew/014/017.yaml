revisions:
- from: అందుకు వారు ఆయనతో, “ఇక్కడ మా దగ్గర ఐదు రొట్టెలు, రెండు చేపలు తప్ప మరేమీ లేవు” అన్నారు.
  to: 'అయితే వారు ఆయనతో ఇలా అన్నారు: “ఇక్కడ మా దగ్గర ఐదు రొట్టెలు, రెండు చేపలు తప్ప మరేమీ లేవు.”'
  rationale: Replaced the causally stronger ‘అందుకు’ with ‘అయితే’ to reflect δέ more closely, and used the natural Telugu direct-speech form ‘ఆయనతో ఇలా అన్నారు.’ The negation-plus-exception construction and all source details are retained.
