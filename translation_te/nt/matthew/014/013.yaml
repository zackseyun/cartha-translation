id: MAT.14.13
reference: Matthew 14:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: te
  text: యేసు అది విని, అక్కడి నుంచి పడవలో ఒక నిర్జన ప్రదేశానికి[a] ఏకాంతంగా వెళ్లిపోయాడు. అయితే జనసమూహాలు ఈ విషయం విని, పట్టణాల[b] నుంచి కాలినడకన ఆయన వెంట వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘జనావాసం లేని ప్రదేశానికి’ లేదా ‘ఏకాంత ప్రదేశానికి’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం ఒంటరిగా ఉన్న లేదా జనావాసం లేని ప్రాంతాన్ని సూచిస్తుంది; అది తప్పనిసరిగా ఇసుక ఎడారి అని కాదు.
    reason: lexical_alternative
  - marker: b
    text: ‘నగరాల నుంచి’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం సందర్భాన్ని బట్టి పట్టణాలను లేదా నగరాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: యేసు అది విని
  rationale: వర్తమాన కథన సందర్భంలో aorist participle‌ను కాలసంబంధంగా సహజమైన తెలుగులో అందించింది. δέ ఇక్కడ బలమైన వ్యతిరేకతకన్నా కథన పురోగతిని సూచిస్తుంది. ‘అది’ అనేది ముందు సందర్భంలో ఆయన విన్న వార్తను సహజంగా సూచిస్తుంది; ఆ వార్త స్వరూపాన్ని ఈ వాక్యమే మరింత నిర్దిష్టం చేయదు.
- source_word: ἀνεχώρησεν
  choice: వెళ్లిపోయాడు
  rationale: ఇక్కడి చర్య పరిస్థితికి ప్రతిస్పందనగా అక్కడి నుంచి తొలగి వెళ్లడాన్ని సూచిస్తుంది. ‘వెళ్లిపోయాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, భయంతో పారిపోయాడనే లేదా మరేదైనా నిర్దిష్ట ఉద్దేశాన్ని జోడించదు.
- source_word: ἐκεῖθεν
  choice: అక్కడి నుంచి
  rationale: స్థలాన్ని సూచించే ఈ క్రియావిశేషణానికి నేరుగా, సహజంగా సరిపడే తెలుగు రూపం.
- source_word: ἐν πλοίῳ
  choice: పడవలో
  rationale: ప్రయాణ సాధనాన్ని స్పష్టంగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς ἔρημον τόπον
  choice: ఒక నిర్జన ప్రదేశానికి
  rationale: ἔρημος ఇక్కడ జనావాసం లేని లేదా ఏకాంతమైన ప్రాంతాన్ని సూచిస్తుంది; ఇసుక ఎడారిని తప్పనిసరిగా సూచించదు. ‘నిర్జన ప్రదేశం’ ఈ భావాన్ని భౌగోళికంగా అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
- source_word: κατ’ ἰδίαν
  choice: ఒంటరిగా
  rationale: ఇతరుల నుంచి వేరుగా, ఏకాంతంగా ఉండాలనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀκούσαντες
  choice: ఈ విషయం విని
  rationale: aorist participle‌ను కాలసంబంధంగా అందించింది. తెలుగులో వాక్యం సహజంగా ఉండేందుకు సందర్భంలో తెలిసిన విషయాన్ని ‘ఈ విషయం’గా సూచించింది; మూలపాఠం వారు విన్న సమాచారం ఏమిటో ఈ వాక్యంలో స్పష్టంగా చెప్పదు.
- source_word: οἱ ὄχλοι
  choice: జనసమూహాలు
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సులభంగా అర్థమయ్యే రూపం.
- source_word: ἠκολούθησαν αὐτῷ
  choice: ఆయనను వెంబడించాయి
  rationale: ఇక్కడ భౌతికంగా ఆయన వెళ్లిన దారిలో వెళ్లడమే ప్రధాన భావం; శిష్యత్వానికి సంబంధించిన అదనపు వేదాంతార్థాన్ని జోడించదు.
- source_word: πεζῇ
  choice: కాలినడకన
  rationale: పడవ ప్రయాణానికి భిన్నంగా నేలమీద నడిచి వెళ్లడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπὸ τῶν πόλεων
  choice: పట్టణాల నుంచి
  rationale: πόλις సందర్భానుసారం పట్టణం లేదా నగరం కావచ్చు. గలిలయ సందర్భంలో ‘పట్టణాలు’ సహజమైన ఎంపిక; విస్తృత అర్థసాధ్యతను పాదసూచిక తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు వెళ్లిపోవడానికి గల ఉద్దేశం
  choice: కేవలం ఆయన అక్కడి నుంచి వెళ్లిపోయాడని తటస్థంగా అనువదించడం
  alternative: భద్రత కోసం వెనుదిరిగాడు; దుఃఖించడానికి లేదా ప్రార్థించడానికి ఏకాంతానికి వెళ్లాడు; సాధారణ ప్రయాణంగా బయలుదేరాడు
  rationale: ఆయన వార్త విన్న తర్వాత ఏకాంత ప్రదేశానికి వెళ్లాడని వాక్యం చెబుతుంది; అయితే ఆయన ఉద్దేశాన్ని స్పష్టంగా నిర్వచించదు. అందువల్ల అనువాదం సాధ్యమైన వివరణల్లో దేనినీ పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథన శైలి. ‘ఒంటరిగా’, ‘నిర్జన ప్రదేశం’, ‘కాలినడకన’ వంటి సహజ పదబంధాలతో మూలంలోని చర్యల క్రమం మరియు స్థలభావం నిలుపబడ్డాయి. పాదసూచిక గుర్తులు సంబంధిత పదాల వెంట ఉంచబడ్డాయి.
