- from: యేసు అది విని, అక్కడి నుంచి పడవలో ఒంటరిగా ఒక నిర్జన ప్రదేశానికి[a] వెళ్లిపోయాడు. అయితే జనసమూహాలు ఈ విషయం విని, పట్టణాల నుంచి[b] కాలినడకన ఆయనను వెంబడించాయి.
