id: MAT.14.12
reference: Matthew 14:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: te
  text: అతని శిష్యులు వచ్చి, మృతదేహాన్ని[a] తీసుకొని అతన్ని సమాధి చేశారు. ఆ తర్వాత వారు వెళ్లి యేసుకు ఈ విషయం తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం చనిపోయిన వ్యక్తి శరీరాన్ని, అంటే ‘శవాన్ని,’ సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: వచ్చి
  rationale: సందర్భంలో శిష్యులు అక్కడికి చేరి చేసిన తదుపరి చర్యను సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది; ‘దగ్గరకు వచ్చి’ కూడా సాధ్యమే కానీ అవసరానికి మించిన స్పష్టీకరణ అవుతుంది.
- source_word: μαθηταὶ αὐτοῦ
  choice: అతని శిష్యులు
  rationale: μαθηταί లోని నేర్చుకునే-అనుసరించే సంబంధాన్ని ‘శిష్యులు’ నిలుపుతుంది. సమీప సందర్భం ప్రకారం ‘అతని’ అనేది బాప్తిస్మమిచ్చే యోహానును సూచిస్తుంది; గ్రీకు వాక్యంలోని సర్వనామ రూపాన్ని అలాగే ఉంచాం.
- source_word: ἦραν
  choice: తీసుకెళ్లి
  rationale: αἴρω కి ఎత్తడం/తీసుకోవడం అనే భావం ఉంది. సమాధి చేయడానికి మృతదేహాన్ని అక్కడి నుంచి తీసుకెళ్లిన సందర్భంలో ఈ తెలుగు ప్రయోగం సహజంగా ఉంది; అయితే గ్రీకులో లేని గమ్యస్థానాన్ని జోడించదు.
- source_word: πτῶμα
  choice: మృతదేహాన్ని
  rationale: πτῶμα స్పష్టంగా చనిపోయిన శరీరాన్ని సూచిస్తుంది. ‘మృతదేహం’ ఆధునిక తెలుగులో ఖచ్చితమైనదీ, గౌరవప్రదమైనదీ; ‘శవం’ అనే ప్రత్యామ్నాయం మరింత సంక్షిప్తమైనా కొంత కఠినంగా వినిపించవచ్చు.
- source_word: ἔθαψαν αὐτόν
  choice: అతన్ని సమాధి చేశారు
  rationale: θάπτω యొక్క నేరమైన భావాన్ని తెలుగులో గౌరవప్రదంగా, సహజంగా వ్యక్తపరుస్తుంది. ‘సమాధిలో ఉంచారు’ అని అనడం ఈ వచనంలో లేని వివరాన్ని చేర్చవచ్చు.
- source_word: ἐλθόντες
  choice: ఆ తర్వాత వారు వెళ్లి
  rationale: తదుపరి క్రమచర్యను సూచించే పార్టిసిపిల్‌ను సహజమైన తెలుగు కథన క్రమంగా మార్చింది. వారు యేసు దగ్గరకు వెళ్లారనే గమనం సందర్భానుగుణంగా వ్యక్తమవుతుంది.
- source_word: ἀπήγγειλαν
  choice: ఈ విషయం తెలియజేశారు
  rationale: ἀπαγγέλλω అంటే నివేదించడం లేదా తెలియజేయడం. గ్రీకులో నివేదిక విషయము ప్రత్యక్ష కర్మగా లేకపోయినా, సందర్భంలో యోహాను మరణం మరియు సమాధి విషయం స్పష్టంగా ఉంది; ‘ఈ విషయం’ తెలుగు వాక్యాన్ని సహజంగా చేస్తుంది.
- source_word: τῷ Ἰησοῦ
  choice: యేసుకు
  rationale: Ἰησοῦς పేరుకు ప్రామాణిక ఆధునిక తెలుగు రూపం ‘యేసు’; చతుర్థీ భావాన్ని ‘యేసుకు’ సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ‘అతని శిష్యులు’ ఎవరిని సూచిస్తారు?
  choice: బాప్తిస్మమిచ్చే యోహాను శిష్యులు
  alternative: యేసు శిష్యులు
  rationale: తక్షణ సందర్భం యోహాను మరణాన్ని వివరిస్తున్నందున αὐτοῦ సహజంగా యోహానును సూచిస్తుంది. అయినప్పటికీ మూలంలోని సర్వనామాన్ని విప్పి పేరును చేర్చకుండా ‘అతని శిష్యులు’ అని ఉంచడం ద్వారా మూల నిర్మాణాన్ని, సందర్భాధారిత సూచనను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘మృతదేహం’ ఖచ్చితత్వాన్ని, సున్నితమైన స్వరాన్ని సమతుల్యం చేస్తుంది. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోతుంది.
