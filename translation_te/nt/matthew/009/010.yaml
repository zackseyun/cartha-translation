revisions:
- from: ఆయన ఆ ఇంట్లో భోజనానికి బల్ల దగ్గర వాలివుండగా[a], ఇదిగో, చాలామంది పన్ను వసూలుదారులు, పాపులు వచ్చి యేసుతో, ఆయన శిష్యులతో కలిసి భోజనానికి వాలారు.[b]
  to: ఆయన ఆ ఇంట్లో[b] భోజన బల్ల వద్ద వాలి ఉండగా[a], ఇదిగో, చాలామంది పన్ను వసూలుదారులు, పాపులు వచ్చి యేసుతోను ఆయన శిష్యులతోను కలిసి భోజన బల్ల వద్ద వాలి ఉన్నారు.
