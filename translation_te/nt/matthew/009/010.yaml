id: MAT.9.10
reference: Matthew 9:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: te
  text: ఆయన ఆ ఇంట్లో[b] భోజన బల్ల వద్ద వాలి ఉండగా[a], ఇదిగో, చాలామంది పన్ను వసూలుదారులు, పాపులు వచ్చి యేసుతోను ఆయన శిష్యులతోను కలిసి భోజన బల్ల వద్ద వాలి ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత సహజంగా, “ఆయన ఆ ఇంట్లో భోజనం చేస్తుండగా” అని అనువదించవచ్చు. గ్రీకు మూలం అప్పటి ఆచారం ప్రకారం భోజన బల్ల దగ్గర వాలి ఉండడాన్ని ప్రత్యేకంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పాఠం ఆ ఇల్లు ఎవరిదో ఈ వచనంలో స్పష్టంగా చెప్పదు.
    reason: ambiguity
lexical_decisions:
- source_word: ἐγένετο
  choice: ఆయన ... వాలివుండగా
  rationale: καὶ ἐγένετο అనే కథన సంధిని తెలుగులో సహజమైన కాలసూచక ఉపవాక్యంగా వ్యక్తం చేశాం; ‘అప్పుడు ఇలా జరిగింది’ అని భారంగా అనువదించలేదు.
- source_word: ἀνακειμένου
  choice: భోజనానికి బల్ల దగ్గర వాలివుండగా
  rationale: భోజన సందర్భంలో ἀνάκειμαι భోజన బల్ల దగ్గర వాలి ఉండడాన్ని సూచిస్తుంది. ప్రాచీన భోజన భంగిమను నిలుపుతూ, సందర్భం ఆధునిక పాఠకులకు స్పష్టమయ్యేలా ‘భోజనానికి’ చేర్చాం.
- source_word: ἐν τῇ οἰκίᾳ
  choice: ఆ ఇంట్లో
  rationale: గ్రీకు పాఠంలోని నిర్దిష్ట గృహ సూచనను నిలిపాం; అది ఎవరి ఇల్లో వచనం స్పష్టంగా చెప్పనందున యజమానిని పేర్కొనలేదు.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: తరువాతి దృశ్యంపై దృష్టి ఆకర్షించే గ్రీకు కథన సూచికకు సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: τελῶναι
  choice: పన్ను వసూలుదారులు
  rationale: సువార్తల సందర్భంలో పన్నులు వసూలు చేసే వర్గాన్ని ఆధునిక పాఠకులకు స్పష్టంగా తెలిపే పదబంధం.
- source_word: ἁμαρτωλοὶ
  choice: పాపులు
  rationale: విశేషణం ఇక్కడ నామవాచకార్థంలో సామాజిక-మతపరమైన వర్గీకరణగా వాడబడింది; ఆ తీక్షణతను తగ్గించకుండా నిలిపాం.
- source_word: ἐλθόντες
  choice: వచ్చి
  rationale: గ్రీకు ఏఓరిస్ట్ కృదంతంలోని ముందరి చర్యను సహజమైన తెలుగు కృదంత రూపంతో వ్యక్తం చేశాం.
- source_word: συνανέκειντο
  choice: కలిసి భోజనానికి వాలారు
  rationale: συν- ఉపసర్గలోని సహవాస భావాన్నీ, భోజన సందర్భంలోని వాలి ఉండే భంగిమనూ రెండింటినీ నిలిపాం.
- source_word: τῷ Ἰησοῦ
  choice: యేసుతో
  rationale: పేరుకు ప్రామాణిక తెలుగు బైబిలు రూపాన్ని వాడాం.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ఆయన శిష్యులతో
  rationale: μαθηταίలోని గురు-శిష్య సంబంధాన్ని సహజంగా, స్థిరంగా తెలియజేసే తెలుగు పదాన్ని ఎంచుకున్నాం.
theological_decisions:
- issue: భోజన భంగిమ మరియు సహపంక్తి భావం
  choice: ‘భోజనానికి ... వాలి’ అనే భాషను నిలిపాం.
  alternative: ‘భోజనం చేస్తుండగా/చేశారు’
  rationale: మూలంలోని భోజన భంగిమతో పాటు యేసుతో కలిసి భోజనం చేసిన సహవాస దృశ్యాన్ని కూడా కనిపించేలా ఉంచుతుంది; అదనపు సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: ‘ఆ ఇల్లు’ ఎవరిది అనే గుర్తింపు
  choice: ప్రధాన పాఠంలో ఇంటి యజమానిని పేర్కొనలేదు.
  alternative: ‘మత్తయి ఇంట్లో’ లేదా ‘ఆయన ఇంట్లో’
  rationale: ἐν τῇ οἰκίᾳ కేవలం ‘ఆ ఇంట్లో’ అని చెబుతుంది. సమీప సందర్భం ద్వారా ఒక గుర్తింపు ఊహించగలిగినా, ఈ వచనం స్వయంగా దాన్ని స్పష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘బల్ల దగ్గర వాలి’ అనే రూపం ప్రాచీన భోజన భంగిమను తెలియజేస్తుంది; అసహజమైన పదానువాదాన్ని నివారించేందుకు ‘భోజనానికి’ అనే సందర్భస్పష్టీకరణ వాడబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
