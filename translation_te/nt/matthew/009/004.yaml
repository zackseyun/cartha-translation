review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Jesus' awareness of their inward thoughts, the question for motive, the evil character of what is being thought, and the heart metaphor. However, Greek εἶπεν is more precisely rendered by “అన్నాడు” than “అడిగాడు”; the interrogative itself already conveys the question.
  naturalness: “ఆలోచనలు చేస్తున్నారు” is understandable but less idiomatic in this context. “చెడు ఆలోచనలు చేసుకుంటున్నారు” is natural modern Telugu for entertaining/thinking evil thoughts. “తెలిసి” is also more current standard Telugu than the somewhat literary “ఎరిగి.”
  terminology: “హృదయాల్లో” appropriately retains καρδίαις rather than reducing it to “మనస్సుల్లో.” “చెడు ఆలోచనలు” is a contextually justified Telugu expression for substantival πονηρά, without adding a doctrinal interpretation. The footnote remains a legitimate lexical alternative for εἰδώς.
  issues:
  - severity: medium
    issue: The final reporting verb is rendered “అడిగాడు.”
    rationale: The source says “he said” (εἶπεν), not specifically “he asked.” Although the quoted words are a question, “అన్నాడు” follows the source more closely.
  - severity: low
    issue: “ఆలోచనలు చేస్తున్నారు” is somewhat unnatural Telugu collocation.
    rationale: Using “చేసుకుంటున్నారు” gives a more idiomatic expression for inwardly entertaining thoughts while retaining the present, ongoing sense of ἐνθυμεῖσθε.
  - severity: low
    issue: “ఎరిగి” is literary relative to the requested modern standard register.
    rationale: “తెలిసి” naturally conveys Jesus' knowledge in contemporary Telugu and does not specify how that knowledge was obtained.
  revised_text: యేసు వారి ఆలోచనలు తెలిసి[a], “మీ హృదయాల్లో చెడు ఆలోచనలు ఎందుకు చేసుకుంటున్నారు?” అని అన్నాడు.
  revised_footnotes:
  - marker: a
    text: లేదా, “వారి ఆలోచనలను గ్రహించి.”
    reason: lexical_alternative
  revision_rationale: The revision retains every essential source-level element but replaces the less natural collocation for thinking, uses a modern-standard expression for knowing, and renders εἶπεν as “అన్నాడు” rather than adding the more specific sense “asked.”
