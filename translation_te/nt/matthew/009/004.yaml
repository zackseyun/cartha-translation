revisions:
- from: యేసు వారి ఆలోచనలను ఎరిగి[a], “మీ హృదయాల్లో చెడు ఆలోచనలు ఎందుకు చేస్తున్నారు?” అని అడిగాడు.
  to: యేసు వారి ఆలోచనలు తెలిసి[a], “మీ హృదయాల్లో చెడు ఆలోచనలు ఎందుకు చేసుకుంటున్నారు?” అని అన్నాడు.
  rationale: The revision retains every essential source-level element but replaces the less natural collocation for thinking, uses a modern-standard expression for knowing, and renders εἶπεν as “అన్నాడు” rather than adding the more specific sense “asked.”
  reviewer_model: gpt-5.6-terra
