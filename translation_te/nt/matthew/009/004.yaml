id: MAT.9.4
reference: Matthew 9:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: te
  text: యేసు వారి ఆలోచనలు తెలిసి[a], “మీ హృదయాల్లో చెడు ఆలోచనలు ఎందుకు చేసుకుంటున్నారు?” అని అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి ఆలోచనలను గ్రహించి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: ఎరిగి
  rationale: ఈ భూతకాల కృదంతం యేసుకు వారి అంతరంగ ఆలోచనలు తెలిసినట్లు తెలియజేస్తుంది. ‘ఎరిగి’ అనేది సంక్షిప్తంగా, గౌరవప్రదంగా ఉండి జ్ఞానం అనే భావాన్ని కాపాడుతుంది; సందర్భంలో గ్రహించడం అనే ఛాయ కూడా సాధ్యమే.
- source_word: ἐνθυμήσεις
  choice: ఆలోచనలను
  rationale: ఈ నామవాచకం అంతరంగ తలంపులు లేదా విచారణలను సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆలోచనలు’ సహజంగా ఉంది.
- source_word: Ἱνατί
  choice: ఎందుకు
  rationale: కారణాన్ని లేదా ఉద్దేశాన్ని ప్రశ్నించే ఈ పదానికి ‘ఎందుకు’ స్పష్టమైన సహజ సమానం.
- source_word: ἐνθυμεῖσθε
  choice: ఆలోచనలు చేస్తున్నారు
  rationale: వర్తమాన కాలంలోని అంతరంగ ఆలోచనా ప్రక్రియను తెలియజేస్తుంది. ముందు వచ్చిన ἐνθυμήσειςతో పదసంబంధాన్ని తెలుగులోనూ నిలుపుతుంది.
- source_word: πονηρὰ
  choice: చెడు ఆలోచనలు
  rationale: నపుంసక బహువచన విశేషణం నామవాచకార్థంలో వాడబడింది. తెలుగులో కేవలం ‘చెడు’ అని చెప్పడం అసహజం కావడంతో, సందర్భం స్పష్టంగా సూచించే ‘ఆలోచనలు’ను జోడించడం భావాన్ని అతిగా విస్తరించకుండా సహజతనిస్తుంది.
- source_word: καρδίαις
  choice: హృదయాల్లో
  rationale: καρδία ఇక్కడ ఆలోచన, ఉద్దేశం సహా అంతరంగ వ్యక్తిని సూచిస్తుంది. ‘హృదయాలు’ అనే మూలరూపకాన్ని నిలుపుతూ దాన్ని కేవలం ‘మనస్సులు’గా పరిమితం చేయదు.
theological_decisions:
- issue: యేసుకు పలకని అంతరంగ ఆలోచనలు తెలిసినట్లు చెప్పడం
  choice: యేసు వారి ఆలోచనలను ఎరిగి
  alternative: యేసు వారి ఆలోచనలను గ్రహించి
  rationale: వాక్యం యేసుకు వారి అంతరంగ ఆలోచనలు తెలిసినట్లు నేరుగా చెబుతుంది. ‘ఎరిగి’ ఆ వాదనను నిలుపుతుంది; అయితే అది ఎలా తెలిసిందనే క్రీస్తుశాస్త్ర సంబంధ వివరణను అనువాదంలో అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం. ‘హృదయాల్లో’ ద్వారా మూలంలోని అంతరంగ-హృదయ రూపకం నిలుపబడింది. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత క్రియారూపం వెంట ఉంచబడింది.
