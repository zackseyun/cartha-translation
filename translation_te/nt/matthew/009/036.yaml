id: MAT.9.36
reference: Matthew 9:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: te
  text: ఆయన జనసమూహాలను చూసి, వారు వేధింపులకు గురై, పడద్రోయబడినవారై[a] కాపరిలేని గొర్రెల్లా ఉన్నందున వారిపట్ల కనికరపడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వేధింపులకు గురై, నిస్సహాయులుగా” అని కూడా అనువదించవచ్చు. గ్రీకు పదాలు వారు తీవ్రంగా నలిగిపోయి, తమను తాము కాపాడుకోలేని స్థితిలో ఉన్నారని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ τοὺς ὄχλους
  choice: ఆయన జనసమూహాలను చూసినప్పుడు
  rationale: అనుసంధానార్థకమైన δέను తెలుగులో ప్రత్యేక పదంతో బలవంతంగా చూపకుండా, వాక్యప్రవాహంలో సహజంగా ఉంచాం. ఏకకాలిక/కాలసంబంధ అర్థమున్న aorist participle Ἰδὼνను ‘చూసినప్పుడు’గా అనువదించాం.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: వారిపై కనికరపడ్డాడు
  rationale: ఈ క్రియ లోతైన అంతరంగ కరుణను సూచిస్తుంది. ‘కనికరపడ్డాడు’ ఆధునిక, గౌరవప్రద తెలుగు వాడుకలో ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ὅτι ἦσαν
  choice: ఉన్నందువల్ల
  rationale: ὅτι యేసు కనికరానికి కారణాన్ని తెలియజేస్తుంది; తెలుగు వాక్య నిర్మాణంలో ‘ఉన్నందువల్ల’ కారణ సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἐσκυλμένοι
  choice: వేధింపులకు గురై
  rationale: σκύλλω రూపం వేధించబడటం, బాధించబడటం, దుర్వ్యవహారంతో నలిగిపోవటం వంటి భావాలను కలిగి ఉంది. కర్తలెవరో మూలంలో చెప్పనందున కర్మణి భావాన్ని నిలిపాం.
- source_word: καὶ ἐρριμμένοι
  choice: నేలకూలినవారిగా
  rationale: ῥίπτω యొక్క perfect passive participle ‘విసిరివేయబడిన/పడగొట్టబడిన’ దృశ్యాన్ని ఇస్తుంది. ‘నేలకూలినవారిగా’ ఆ బలమైన చిత్రాన్ని కాపాడుతూ సహజంగా ఉంటుంది; ‘నిస్సహాయులు’ అనే వ్యాఖ్యానాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలో పెట్టలేదు.
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: కాపరిలేని గొర్రెల్లా
  rationale: పోలికను సంక్షిప్తమైన, సహజమైన తెలుగు రూపంలో అందిస్తూ నాయకత్వం, సంరక్షణ లేని గొర్రెల రూపకాన్ని యథాతథంగా నిలిపాం.
theological_decisions:
- issue: యేసు కనికరాన్ని తెలిపే పదబంధం
  choice: వారిపై కనికరపడ్డాడు
  alternative: వారిపట్ల కనికరంతో కదిలిపోయాడు
  rationale: మూలక్రియలో లోతైన కరుణ ఉన్నప్పటికీ శారీరక అంతరంగాల గ్రీకు నుడికారాన్ని కృత్రిమంగా ప్రతిబింబించలేదు. ఎంపిక చేసిన రూపం భావబలాన్ని కాపాడి, ప్రత్యేక సిద్ధాంత వ్యాఖ్యానాన్ని చేర్చదు.
- issue: జనసమూహాల స్థితి
  choice: వేధింపులకు గురై, నేలకూలినవారిగా
  alternative: అలసిపోయి, నిస్సహాయులుగా
  rationale: రెండు కర్మణి participles‌లోని వేధించబడిన, పడగొట్టబడిన చిత్రాన్ని ప్రధాన పాఠ్యంలో నిలిపాం. ‘నిస్సహాయులు’ సాధ్యమైన సందర్భార్థమే అయినా, రెండవ పదంలోని ప్రత్యక్ష రూపకాన్ని తగ్గిస్తుంది; అందువల్ల దాన్ని పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రద శైలిని వాడాం. ‘జనసమూహాలు,’ ‘కనికరపడ్డాడు,’ ‘కాపరి’ వంటి విస్తృతంగా అర్థమయ్యే పదాలను ఎంచుకున్నాం; మూలంలోని కర్మణి భావం మరియు గొర్రెల రూపకాన్ని కాపాడాం.
