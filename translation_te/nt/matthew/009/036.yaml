revisions:
- from: ఆయన జనసమూహాలను చూసినప్పుడు, వారు కాపరిలేని గొర్రెల్లా వేధింపులకు గురై, నేలకూలినవారిగా ఉన్నందువల్ల వారిపై కనికరపడ్డాడు.[a]
  to: ఆయన జనసమూహాలను చూసి, వారు వేధింపులకు గురై, పడద్రోయబడినవారై[a] కాపరిలేని గొర్రెల్లా ఉన్నందున వారిపట్ల కనికరపడ్డాడు.
  rationale: The revision retains the draft’s meaning and register while more directly representing the passive, cast-down imagery of ἐρριμμένοι. It also moves the footnote anchor to the phrase for which the lexical alternative is supplied.
