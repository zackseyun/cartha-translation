source:
  edition: SBLGNT
  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: te
  text: అయితే వారు బయటికి వెళ్లిన తర్వాత, ఆ ప్రాంతమంతటా[a] ఆయన గురించి ప్రచారం చేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ దేశమంతటా.” గ్రీకు γῆ అనే పదానికి “భూమి,” “దేశం,” లేదా “ప్రాంతం” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలో యేసు ఇచ్చిన హెచ్చరికకు విరుద్ధంగా జరిగిన కథన మలుపును మృదువైన వ్యత్యాసంతో సూచిస్తుంది.
- source_word: ἐξελθόντες
  choice: వారు బయటికి వెళ్లిన తర్వాత
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది; ఈ రూపం కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: διεφήμισαν
  choice: ప్రచారం చేశారు
  rationale: వార్తను విస్తృతంగా వ్యాపింపజేయడం లేదా ఒకరి గురించి అందరికీ తెలియజేయడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτὸν
  choice: ఆయన గురించి
  rationale: గ్రీకులో నేర కర్మగా ఉన్నప్పటికీ, ‘ప్రచారం చేశారు’ అనే తెలుగు ప్రయోగంతో వ్యక్తిని గురించి వార్త వ్యాపింపజేశారనే సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: ఆ ప్రాంతమంతటా[a]
  rationale: స్థానిక భౌగోళిక పరిధిని సూచించే సందర్భంలో ‘ప్రాంతం’ సహజంగా సరిపోతుంది; ‘అంతటా’ మొత్తం పరిధిలో వ్యాపించిందనే భావాన్ని అందిస్తుంది. γῆ యొక్క ‘దేశం/భూమి’ అనే ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: γῆ సూచించే భౌగోళిక పరిధి
  choice: ప్రాంతం
  alternative: దేశం / భూమి
  rationale: ఈ సందర్భం యేసు గురించి వార్త స్థానిక పరిసరాల్లో వ్యాపించడాన్ని వర్ణిస్తుంది. ‘ప్రాంతం’ పరిధిని అతిశయింపకుండా సందర్భానికి సరిపోతుంది; గ్రీకు పదంలోని నిజమైన అర్థవిస్తృతిని పాదటిప్పణి కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘అయితే’ వ్యత్యాసాన్ని, ‘వెళ్లిన తర్వాత’ చర్యల కాలక్రమాన్ని స్పష్టంగా ఉంచుతాయి.
