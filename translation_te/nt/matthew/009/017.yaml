id: MAT.9.17
reference: Matthew 9:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: te
  text: 'అలాగే, కొత్త ద్రాక్షారసాన్ని పాత తోలు తిత్తుల్లో పోయరు. అలా పోస్తే, తోలు తిత్తులు చిట్లిపోతాయి, ద్రాక్షారసం కారిపోతుంది, తిత్తులు పాడైపోతాయి. దానికి బదులు, కొత్త ద్రాక్షారసాన్ని కొత్త తోలు తిత్తుల్లో[a] పోస్తారు; అప్పుడు రెండూ కాపాడబడతాయి.


    [a] గ్రీకులో ద్రాక్షారసం విషయంలో కాలపరంగా “కొత్తది” అనే అర్థమిచ్చే νέος అనే పదం, తోలు తిత్తుల విషయంలో కొత్తవి లేదా తాజా స్థితిలో ఉన్నవి అనే అర్థమిచ్చే καινός అనే వేరొక పదం వాడబడ్డాయి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ద్రాక్షారసం విషయంలో కాలపరంగా “కొత్తది” అనే అర్థమిచ్చే νέος అనే పదం, తోలు తిత్తుల విషయంలో కొత్తవి లేదా తాజా స్థితిలో ఉన్నవి అనే అర్థమిచ్చే καινός అనే వేరొక పదం వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: అలాగే ... పోయరు
  rationale: మునుపటి ఉపమానానికి అనుసంధానమైన మరో ప్రతికూల ఉదాహరణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: βάλλουσιν
  choice: పోస్తారు / పోయరు
  rationale: ద్రవాన్ని తోలు తిత్తుల్లో ఉంచడాన్ని తెలుగులో సహజంగా ‘పోయడం’ అంటారు; ‘వేయడం’ కంటే సందర్భానికి ఇది తగినది.
- source_word: οἶνον νέον
  choice: కొత్త ద్రాక్షారసం
  rationale: తాజాగా తయారైన ద్రాక్షారసాన్ని సూచించే సూటియైన, సాధారణ తెలుగు పదబంధం.
- source_word: ἀσκοὺς
  choice: తోలు తిత్తులు
  rationale: ద్రాక్షారసాన్ని నిల్వ చేయడానికి ఉపయోగించిన జంతుచర్మపు సంచులను చారిత్రకంగా స్పష్టంగా సూచిస్తుంది.
- source_word: παλαιούς
  choice: పాత
  rationale: వయస్సు మరియు స్థితి పరంగా καινός‌కు ఉన్న వ్యత్యాసాన్ని సూటిగా నిలుపుతుంది.
- source_word: εἰ δὲ μή γε
  choice: అలా పోస్తే
  rationale: ఆ పని చేస్తే కలిగే ప్రతికూల పరిణామాన్ని సహజమైన తెలుగు షరతు నిర్మాణంతో తెలియజేస్తుంది.
- source_word: ῥήγνυνται
  choice: చిట్లిపోతాయి
  rationale: ఒత్తిడివల్ల తోలుతో చేసిన తిత్తులు తెరుచుకోవడాన్ని ‘చిట్లిపోవడం’ స్పష్టంగా, సందర్భోచితంగా తెలియజేస్తుంది.
- source_word: ἐκχεῖται
  choice: కారిపోతుంది
  rationale: తిత్తులు చిట్లినప్పుడు ద్రాక్షారసం అనుకోకుండా బయటికి పోయి నష్టమవడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀπόλλυνται
  choice: పాడైపోతాయి
  rationale: తోలు తిత్తులు ఇక ఉపయోగపడని స్థితికి చేరడాన్ని సందర్భానికి సరిపోయేలా తెలియజేస్తుంది.
- source_word: ἀλλὰ
  choice: దానికి బదులు
  rationale: ముందు చెప్పిన తప్పుడు పద్ధతికి విరుద్ధమైన సరైన పద్ధతిని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: καινούς
  choice: కొత్త
  rationale: తెలుగులో తోలు తిత్తుల విషయంలో సహజమైన పదం ‘కొత్త’; νέος‌తో గ్రీకు పదభేదాన్ని పాదసూచికలో స్పష్టం చేయడం ద్వారా మూలంలోని సూక్ష్మభేదాన్ని కాపాడుతుంది.
- source_word: ἀμφότεροι συντηροῦνται
  choice: రెండూ భద్రంగా ఉంటాయి
  rationale: ద్రాక్షారసం, తోలు తిత్తులు రెండూ నష్టం కాకుండా నిలిచి ఉంటాయనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఒకే వచనంలో νέος, καινός మధ్య భేదం
  choice: ప్రధాన పాఠంలో రెండింటికీ సహజమైన ‘కొత్త’ అనే పదాన్ని వాడి, గ్రీకు పదభేదాన్ని [a] పాదసూచికలో వివరించడం
  alternative: ద్రాక్షారసానికి ‘కొత్త’, తోలు తిత్తులకు ‘తాజా’ అని అనువదించడం
  rationale: ‘తాజా తోలు తిత్తులు’ ఆధునిక తెలుగులో అసహజంగా, తప్పుదోవ పట్టించేలా వినిపించవచ్చు. రెండు గ్రీకు విశేషణాల మధ్య నిజమైన సూక్ష్మభేదాన్ని పాదసూచిక స్పష్టంగా కాపాడుతుంది; అదే సమయంలో ప్రధాన పాఠం సహజంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. పురాతన పాత్రను స్పష్టంగా చూపడానికి ‘తోలు తిత్తులు’ వాడబడింది. మూలంలోని వరుస పరిణామాలు మరియు చివరి వ్యత్యాసం నిలుపబడ్డాయి.
