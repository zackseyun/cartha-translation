id: MAT.9.11
reference: Matthew 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: te
  text: 'ఫరిసయ్యులు అది చూసి[a], ఆయన శిష్యులను ఇలా అడుగుతూ ఉన్నారు: “మీ బోధకుడు సుంకరులతో, పాపులతో కలిసి ఎందుకు భోజనం చేస్తున్నాడు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత రూపానుగుణంగా, “ఫరిసయ్యులు చూసి, ఆయన శిష్యులను ఇలా అడుగుతూ ఉన్నారు…” అని అనువదించవచ్చు. గ్రీకులో ‘చూసిన’ దాని కర్మ స్పష్టంగా చెప్పబడలేదు; సందర్భంలో అది భోజన దృశ్యాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: అది చూసి
  rationale: అరిస్టు కృదంతాన్ని సహజమైన తెలుగు పూర్వకాలిక క్రియగా అనువదించాం. గ్రీకులో కర్మ స్పష్టంగా లేకపోయినా, సందర్భంలోని భోజన దృశ్యాన్ని సూచించేందుకు ‘అది’ చేర్చాం; ఈ విషయాన్ని పాదసూచికలో తెలిపాం.
- source_word: ἔλεγον
  choice: అని అడుగుతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న భావాన్ని నిలుపుతూ, ప్రశ్నాత్మక ప్రత్యక్ష వాక్యానికి సహజమైన తెలుగు ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: μαθηταῖς
  choice: శిష్యులతో
  rationale: బోధకుడు–శిష్యుడు సంబంధాన్ని నిలిపే, సువార్తల సందర్భంలో స్థిరంగా వాడే సహజ తెలుగు పదం.
- source_word: Διὰ τί
  choice: ఎందుకు
  rationale: కారణాన్ని అడిగే గ్రీకు ప్రయోగానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానం.
- source_word: τελωνῶν
  choice: సుంకరులతో
  rationale: రోమా కాలపు సుంకం లేదా పన్ను వసూలుదారులను సూచించే సంప్రదాయబద్ధమైనప్పటికీ సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: ἁμαρτωλῶν
  choice: పాపులతో
  rationale: నైతికంగా, సామాజికంగా ముద్ర వేయబడిన వర్గాన్ని సూచించే గ్రీకు పదానికి నేరుగా సరిపడే అనువాదం.
- source_word: ἐσθίει
  choice: భోజనం చేస్తున్నాడు
  rationale: ప్రత్యక్ష ప్రశ్నలోని వర్తమాన క్రియను సహజ తెలుగు కొనసాగుతున్న వర్తమాన రూపంలో అందించాం; కలిసి తినే సందర్భాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: διδάσκαλος
  choice: బోధకుడు
  rationale: διδάσκαλος అనే బిరుదు యొక్క సాధారణ అర్థాన్ని అనువదిస్తూ, గురువు–శిష్యుల బోధనా సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: ‘చూసి’ అనే క్రియకు కర్మను స్పష్టంగా చేర్చాలా
  choice: ప్రధాన పాఠ్యంలో ‘అది’ అని చేర్చి, పాదసూచికలో గ్రీకు నిర్మాణాన్ని వివరించడం
  alternative: “ఫరిసయ్యులు చూసి...” అని కర్మను తెలుగులోనూ వ్యక్తం చేయకుండా ఉంచడం
  rationale: గ్రీకు కృదంతం చూసిన దాని కర్మను అంతర్లీనంగా ఉంచి, సందర్భంలోని భోజన దృశ్యాన్ని సూచిస్తుంది. తెలుగులో ‘అది’ సహజమైన స్పష్టత ఇస్తుంది; పాదసూచిక మూలంలోని అంతర్లీనతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సుంకరులు,’ ‘పాపులు,’ ‘శిష్యులు’ వంటి సుపరిచిత బైబిలు పదజాలాన్ని నిలిపి, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా ఉంచాం.
