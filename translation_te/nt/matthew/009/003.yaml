id: MAT.9.3
reference: Matthew 9:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: te
  text: మరియు ఇదిగో, శాస్త్రులలో కొందరు తమలో తాము, “ఇతడు దేవదూషణ చేస్తున్నాడు” అని అనుకున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తమలో తాము చెప్పుకున్నారు.” గ్రీకు పదబంధం అంతరంగ ఆలోచనను గానీ, గోప్యంగా పరస్పరం మాట్లాడుకోవడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: అప్పుడు
  rationale: కథన ప్రవాహంలో సాధారణ అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἰδού
  choice: ఇదిగో
  rationale: శ్రోత దృష్టిని మళ్లించే గ్రీకు సంభాషణ సూచిక బలాన్ని నిలుపుతుంది.
- source_word: τινες τῶν γραμματέων
  choice: శాస్త్రులలో కొందరు
  rationale: అనిర్దిష్ట ఉపసమూహాన్ని తెలుపుతూ, సువార్త సందర్భంలో γραμματεῖςకు సంప్రదాయబద్ధమైనప్పటికీ అర్థవంతమైన పదాన్ని వాడుతుంది.
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: తమలో తాము … అని అనుకున్నారు
  rationale: అక్షరార్థంగా ‘తమలో చెప్పారు’ అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ఇది అంతరంగ ఆలోచన కావచ్చనే సందర్భ సూచనను అందిస్తుంది; వ్యక్తుల మధ్య గోప్య సంభాషణ సాధ్యతను పాదసూచికలో ఉంచుతుంది.
- source_word: Οὗτος
  choice: ఇతడు
  rationale: సూచనాత్మక బలాన్ని, సందర్భంలోని స్వల్ప నిరాదరణ ధ్వనిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: βλασφημεῖ
  choice: దేవదూషణ చేస్తున్నాడు
  rationale: దేవుని అవమానించే మాట పలుకుతున్నాడనే ఆరోపణను ఆధునిక తెలుగులో స్పష్టంగా, కొనసాగుతున్న చర్యగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసుపై శాస్త్రులు చేసిన βλασφημεῖ అనే ఆరోపణ
  choice: ఇతడు దేవదూషణ చేస్తున్నాడు
  alternative: ఇతడు దూషిస్తున్నాడు
  rationale: ‘దేవదూషణ’ ఆరోపణ యొక్క మతపరమైన బలాన్ని స్పష్టంగా నిలుపుతుంది; శాస్త్రుల ఆరోపణ సరైందా కాదా అన్న కథన ఉద్రిక్తతను అనువాదం ముందుగానే పరిష్కరించదు.
- issue: ἐν ἑαυτοῖς అంతరంగ ఆలోచనా, పరస్పర గోప్య సంభాషణా
  choice: ప్రధాన పాఠ్యంలో ‘తమలో తాము … అనుకున్నారు’
  alternative: ‘తమలో తాము చెప్పుకున్నారు’
  rationale: తక్షణ సందర్భంలో అంతరంగ deliberation సహజంగా ఉన్నా, గ్రీకు పదబంధంలోని నిజమైన సందిగ్ధతను పాదసూచిక ద్వారా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. ‘శాస్త్రులు,’ ‘దేవదూషణ’ వంటి స్థిర బైబిలు పదాలను సందర్భ స్పష్టత కోసం నిలిపింది.
