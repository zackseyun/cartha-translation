  terminology: “శాస్త్రులు” is an established rendering for γραμματεῖς, and “దేవదూషణ చేస్తున్నాడు” accurately expresses the scribes’ accusation of blasphemy without deciding its validity. “ఇతడు” suitably retains the pointed demonstrative force.
