revisions:
- from: ఆయన పడవ ఎక్కిన తర్వాత, అవతలి ఒడ్డుకు దాటి తన సొంత పట్టణానికి[a] వచ్చాడు.
  to: పడవ ఎక్కి దాటి, ఆయన తన సొంత పట్టణానికి[a] వచ్చాడు.
  rationale: The revision replaces the unnatural ‘అవతలి ఒడ్డుకు దాటి’ with the idiomatic ‘దాటి.’ Since the preceding phrase specifies travel by boat, the crossing sense of διεπέρασεν remains clear. No city name is added to the main text, preserving the Greek wording and its narrative-level referential openness.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:31:30Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the aorist participle ἐμβάς as prior boat-entry, πλοῖον as ‘పడవ,’ and ἰδίαν πόλιν without identifying the city in the main text. However, ‘అవతలి ఒడ్డుకు దాటి’ is not idiomatic Telugu and syntactically makes the crossing expression less clear than the Greek διεπέρασεν.
  naturalness: ‘పడవ ఎక్కి దాటి’ is concise, natural modern Telugu narrative wording for crossing by boat. It retains the sequential action without the awkward construction ‘ఒడ్డుకు దాటి.’
  terminology: ‘తన సొంత పట్టణానికి’ appropriately preserves the possessive/associative force of ἰδίαν πόλιν. The footnote appropriately offers ‘స్వస్థలం’ only as an alternative and does not assert Capernaum as the text’s explicit wording.
  issues:
  - severity: medium
    issue: అవతలి ఒడ్డుకు దాటి
    rationale: In standard Telugu, one normally ‘crosses’ a body of water or goes ‘to the other shore’; ‘to the other shore crossing’ is awkward. The phrase should be recast without adding a location not explicitly supplied by the Greek.
  revised_text: పడవ ఎక్కి దాటి, ఆయన తన సొంత పట్టణానికి[a] వచ్చాడు.
