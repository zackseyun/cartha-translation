id: MAT.9.1
reference: Matthew 9:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: te
  text: పడవ ఎక్కి దాటి, ఆయన తన సొంత పట్టణానికి[a] వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన స్వస్థలానికి.” గ్రీకులో అక్షరార్థంగా “తన సొంత పట్టణానికి” అని ఉంది. కథనంలోని ఈ దశలో ఆయనతో సంబంధమున్న పట్టణాన్ని—బహుశా కపెర్నహూమును—ఇది సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβὰς
  choice: పడవ ఎక్కిన తర్వాత
  rationale: ἐμβαίνω క్రియ యొక్క భూతకాల కృదంత రూపం ప్రధాన క్రియలకు ముందుగా జరిగిన చర్యను సూచిస్తుంది; ఈ కాలక్రమాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా చూపిస్తుంది.
- source_word: πλοῖον
  choice: పడవ
  rationale: గలిలయ సముద్ర సందర్భంలో సాధారణ జలయానాన్ని సూచించే సహజమైన పదం; ‘ఓడ’ కంటే పరిమాణానికి, సందర్భానికి తగినది.
- source_word: διεπέρασεν
  choice: అవతలి ఒడ్డుకు దాటి
  rationale: διαπεράωలో ఒక వైపు నుంచి మరో వైపుకు, ముఖ్యంగా నీటిమీదుగా దాటడం అనే దిశాభావం ఉంది; తెలుగులో ‘అవతలి ఒడ్డుకు’ దానిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἦλθεν
  choice: వచ్చాడు
  rationale: ἔρχομαι యొక్క ప్రాథమిక భావాన్ని, కథకుని దృష్టికోణాన్ని సూటిగా నిలుపుతుంది.
- source_word: ἰδίαν πόλιν
  choice: తన సొంత పట్టణానికి
  rationale: ἴδιοςలోని వ్యక్తిగత అనుబంధం లేదా చెందినదనే భావాన్ని నిలుపుతూ, ఆ పట్టణాన్ని ప్రధాన పాఠ్యంలో నిర్దిష్టంగా గుర్తించదు.
- source_word: Καὶ ... καὶ
  choice: తర్వాత ... దాటి
  rationale: గ్రీకు καίలతో అనుసంధానించిన వరుస చర్యలను తెలుగులో సహజమైన కాలక్రమంగా అందిస్తుంది; ప్రతి καίని యాంత్రికంగా ‘మరియు’ అని అనువదించకుండా కథన ప్రవాహాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ‘తన సొంత పట్టణం’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో పట్టణం పేరును చెప్పకుండా ‘తన సొంత పట్టణం’ అని తటస్థంగా ఉంచడం.
  alternative: మత్తయి కథన సందర్భాన్ని బట్టి దానిని కపెర్నహూము అని ప్రధాన పాఠ్యంలో పేర్కొనడం, లేదా ‘స్వస్థలం’ అని అనువదించడం.
  rationale: గ్రీకు మూలపాఠ్యం పట్టణం పేరును చెప్పదు. సందర్భం కపెర్నహూమును బలంగా సూచించినా, అనువాదం ఆ గుర్తింపును పాఠ్యంలో చేర్చకుండా మూలంలోని అనిశ్చితిని నిలుపుతుంది; ‘స్వస్థలం’ జన్మస్థలం అనే అదనపు భావాన్ని కలిగించవచ్చు.
translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. ‘అవతలి ఒడ్డుకు దాటి’ జలమార్గంలో ఒక వైపు నుంచి మరో వైపుకు వెళ్లిన భావాన్ని సహజంగా తెలియజేస్తుంది. గౌరవార్థక బహువచనం కాకుండా తెలుగు బైబిల్ కథనానికి సహజమైన ఏకవచన పురుష రూపం వాడబడింది.
