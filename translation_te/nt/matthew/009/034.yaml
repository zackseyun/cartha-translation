revisions:
- from: కాని పరిసయ్యులు, “ఇతడు దయ్యాల అధిపతి శక్తితోనే దయ్యాలను వెళ్లగొడుతున్నాడు” అని అంటూ ఉండేవారు.
  to: 'కాని పరిసయ్యులు ఇలా చెప్పేవారు: “అతడు దయ్యాల అధిపతి ద్వారా దయ్యాలను వెళ్లగొడుతున్నాడు.”'
  rationale: The revision removes added ‘power’ and exclusive emphasis, renders the instrumental construction directly, and improves the Telugu expression of the imperfect ἔλεγον. It preserves the Pharisees’ accusation as reported speech and retains the repeated ‘demons’ terminology in the source.
  reviewer_model: gpt-5.6-terra
