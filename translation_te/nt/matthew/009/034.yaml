id: MAT.9.34
reference: Matthew 9:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: te
  text: 'కాని పరిసయ్యులు ఇలా చెప్పేవారు: “అతడు దయ్యాల అధిపతి ద్వారా దయ్యాలను వెళ్లగొడుతున్నాడు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: కాని
  rationale: ముందటి వచనంలోని ప్రజల ఆశ్చర్యానికి భిన్నంగా పరిసయ్యుల విరోధపూర్వక స్పందనను సూచించే వ్యతిరేక మలుపును సహజంగా తెలియజేస్తుంది.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూదు మతవర్గానికి ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన ప్రామాణిక రూపం.
- source_word: ἔλεγον
  choice: అని అంటూ ఉండేవారు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న లేదా పునరావృతమైన మాటను నిలుపుతుంది.
- source_word: Ἐν τῷ ἄρχοντι
  choice: అధిపతి శక్తితోనే
  rationale: ἐν + చతుర్థీ ఇక్కడ సాధనం లేదా అధికార మూలాన్ని సూచిస్తుంది. తెలుగులో ‘శక్తితో’ సహజంగా ఉండి, యేసు దయ్యాల అధిపతి నుంచి శక్తి పొందుతున్నాడనే ఆరోపణను స్పష్టం చేస్తుంది; ‘నే’ ఆరోపణలోని నొక్కిచెప్పడాన్ని సహజంగా అందిస్తుంది.
- source_word: ἄρχοντι
  choice: అధిపతి
  rationale: పాలించే లేదా అధికారమున్న నేత అనే భావాన్ని గౌరవప్రదమైన, ప్రస్తుత తెలుగులో తెలియజేస్తుంది; ‘రాజకుమారుడు’ అనే వంశపారంపర్య భావాన్ని అనవసరంగా కలిగించదు.
- source_word: τῶν δαιμονίων / τὰ δαιμόνια
  choice: దయ్యాల / దయ్యాలను
  rationale: δαιμόνιαకు ప్రత్యక్షమైన, సాధారణ పాఠకులకు స్పష్టమైన తెలుగు సమానార్థకం; ‘దుష్టాత్మలు’ అని మార్చి మూలపద భేదాన్ని చెరపదు.
- source_word: ἐκβάλλει
  choice: వెళ్లగొడుతున్నాడు
  rationale: భూతవైద్య సందర్భంలో బలవంతంగా బయటకు పంపడం అనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; వర్తమాన క్రియను నిలుపుతుంది.
theological_decisions:
- issue: దయ్యాలను వెళ్లగొట్టే శక్తి మూలంపై పరిసయ్యుల ఆరోపణ
  choice: దయ్యాల అధిపతి శక్తితోనే
  alternative: దయ్యాల అధిపతి ద్వారా
  rationale: వాక్యం పరిసయ్యుల ఆరోపణను మాత్రమే నివేదిస్తుంది; దానిని వక్త వ్యాఖ్యగా మార్చదు. సాధనార్థక ἐνను ‘శక్తితో’గా వ్యక్తం చేయడం, యేసు చర్యకు దయ్యాల అధిపతే శక్తి మూలమని వారు ఆరోపిస్తున్న భావాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- issue: δαιμόνια పదానికి అనువాదం
  choice: దయ్యాలు
  alternative: దుష్టాత్మలు
  rationale: మూలంలో πνεύματα కాక δαιμόνια ఉంది. అందువల్ల ప్రత్యేక పదాన్ని నిలిపి, వాక్యంలోని అలౌకిక ఆరోపణను మృదువుపరచకుండా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గంభీరత కోల్పోకుండా రూపొందించబడింది. అసంపూర్ణ భూతకాల భావాన్ని ‘అంటూ ఉండేవారు’తో నిలిపింది. మూలంలో పాఠాంతర లేదా తప్పనిసరి వివరణాత్మక గమనిక అవసరం లేకపోవడంతో పాదటిప్పణి చేర్చలేదు.
