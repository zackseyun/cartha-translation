id: MAT.9.20
reference: Matthew 9:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: te
  text: ఇదిగో, పన్నెండేళ్లుగా రక్తస్రావంతో బాధపడుతున్న ఒక స్త్రీ ఆయన వెనుకనుండి వచ్చి, ఆయన వస్త్రపు అంచును[a][b] తాకింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జాలరు” లేదా “కుచ్చు.” గ్రీకు పదం వస్త్రపు అంచును లేదా అంచున ఉండే జాలరు వంటి కుచ్చును సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇశ్రాయేలు ధర్మశాస్త్రంలో వస్త్రాల అంచులకు కుచ్చులు కట్టుకోవడం గురించిన నేపథ్యం కోసం సంఖ్యాకాండం 15:38; ద్వితీయోపదేశకాండం 22:12 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: ఇదిగో
  rationale: ἰδούలోని దృష్టిని ఆకర్షించే, కథనానికి సజీవతను ఇచ్చే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది. Καί ఇక్కడ కథనాన్ని కొనసాగించే సంధానపదం; ప్రత్యేకంగా ‘మరియు’ అని అనువదిస్తే తెలుగు వాక్యం కృత్రిమంగా వినిపిస్తుంది.
- source_word: γυνὴ
  choice: ఒక స్త్రీ
  rationale: మొదటిసారి పరిచయమవుతున్న నిర్దిష్టీకరించని వ్యక్తిని సహజంగా సూచిస్తుంది.
- source_word: αἱμορροοῦσα
  choice: రక్తస్రావంతో బాధపడుతున్న
  rationale: కొనసాగుతున్న రక్తస్రావ స్థితిని తెలియజేస్తుంది. ‘రక్తస్రావమవుతున్న’ కంటే దీర్ఘకాలిక శారీరక బాధను సాధారణ పాఠకునికి సహజంగా వ్యక్తం చేస్తుంది; ఆకస్మిక తీవ్రమైన రక్తస్రావమని అతిశయింపదు.
- source_word: δώδεκα ἔτη
  choice: పన్నెండేళ్లుగా
  rationale: కాలవ్యాప్తిని సూచించే గ్రీకు accusative భావాన్ని సహజమైన తెలుగు కాలప్రయోగంతో తెలియజేస్తుంది.
- source_word: προσελθοῦσα ὄπισθεν
  choice: ఆయన వెనుకనుంచి దగ్గరకు వచ్చి
  rationale: ఆమె యేసును వెనుకవైపు నుంచి సమీపించిందనే కదలికను స్పష్టంగా నిలుపుతుంది.
- source_word: ἥψατο
  choice: తాకింది
  rationale: ఈ సందర్భంలో ἅπτω యొక్క మధ్యమ రూపానికి తగిన సాధారణ అర్థం; పట్టుకుంది లేదా గట్టిగా అందుకుంది అనే అధిక భావాన్ని చేర్చదు.
- source_word: τοῦ κρασπέδου
  choice: అంచును
  rationale: κράσπεδον వస్త్రపు అంచు, అంచున ఉన్న జాలరు లేదా కుచ్చును సూచించగలదు. ప్రధాన పాఠ్యంలో ‘అంచు’ సహజంగా ఉండి, పదాన్ని ఒకే సాంస్కృతిక పునర్నిర్మాణానికి పరిమితం చేయదు; ఇతర అవకాశాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ఆయన వస్త్రపు
  rationale: ἱμάτιονకు ‘వస్త్రం’ విస్తృతమైన, ఖచ్చితమైన సమానార్థకం; ‘అంగీ’ లేదా ‘పైవస్త్రం’ అని మూలం కంటే ఎక్కువ నిర్దిష్టతను చేర్చదు.
theological_decisions:
- issue: κράσπεδον అనే పదానికి యూదుల వస్త్రపు కుచ్చులు లేదా జాలరుతో ఉండగల ధర్మశాస్త్ర నేపథ్యం
  choice: ప్రధాన పాఠ్యంలో సాధారణంగా ‘అంచు’ అని అనువదించడం
  alternative: ఇశ్రాయేలు ధర్మశాస్త్రంలోని వస్త్రపు కుచ్చుల నేపథ్యాన్ని ముందుకు తెచ్చేలా ‘కుచ్చు’ అని, లేదా కేవలం వస్త్రపు దిగువ భాగాన్ని సూచించేలా ‘కొంగు’ అని అనువదించడం
  rationale: ఈ పదం యూదుల వస్త్రపు అంచున ఉండే కుచ్చును సూచించే అవకాశం ఉన్నా, ఈ వాక్యం ఆ ప్రతీకార్థాన్ని స్వయంగా వివరించదు. ‘అంచు’ పదార్థ పరిధిని తెరిచి ఉంచుతుంది; సాధ్యమైన సాంస్కృతిక నేపథ్యాన్ని పాదసూచికలు భద్రపరుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘ఇదిగో’ మూలంలోని ఆకస్మిక దృష్టి ఆకర్షణను నిలుపుతుంది. వైద్యస్థితికి ‘రక్తస్రావం’ స్పష్టమైన ప్రస్తుత వాడుక; ‘అంచు’ సహజంగా ఉండి మూలపదంలోని సాంస్కృతిక సందిగ్ధతను పాదసూచికలతో కాపాడుతుంది.
