id: MAT.9.33
reference: Matthew 9:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: te
  text: దయ్యాన్ని వెళ్లగొట్టిన తర్వాత, మూగవాడు[అ] మాట్లాడాడు. జనసమూహాలు ఆశ్చర్యపడి, “ఇశ్రాయేలులో ఇలాంటిది ఎన్నడూ కనిపించలేదు” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: అ
    text: లేదా, “చెవిటివాడు.” గ్రీకు పదం చెవిటివాడు లేదా మూగవాడు అనే అర్థాన్ని ఇవ్వగలదు; ఇక్కడ అతడు మాట్లాడాడనే సందర్భం వల్ల “మూగవాడు” అనే అర్థం అనుకూలంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: వెళ్లగొట్టినప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్‌లోని ఏఓరిస్ట్ పాసివ్ పార్టిసిపుల్ ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘వెళ్లగొట్టినప్పుడు’ ఆ కాలసంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δαιμονίου
  choice: దయ్యాన్ని
  rationale: సువార్తలలో భూతవిమోచన సందర్భంలో δαιμόνιον‌కు ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, నిర్దిష్టమైన సమానం ‘దయ్యం’.
- source_word: ἐλάλησεν
  choice: మాట్లాడాడు
  rationale: λαλέω ఏఓరిస్ట్‌కు సాధారణ క్రియారూపమే సరిపోతుంది; ‘మాట్లాడడం మొదలుపెట్టాడు’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని ఆరంభ భావం చేరుతుంది.
- source_word: ὁ κωφός
  choice: మూగవాడు
  rationale: κωφός చెవిటివాడని లేదా మూగవాడని సూచించగలిగినా, వెంటనే ‘మాట్లాడాడు’ అని ఉండడం వల్ల ఇక్కడ మాటలాడలేని స్థితికే ప్రాధాన్యం స్పష్టమవుతుంది.
- source_word: ἐθαύμασαν
  choice: ఆశ్చర్యపడి
  rationale: ఈ క్రియ జనసమూహాల విస్మయాన్ని సూచిస్తుంది. ‘ఆశ్చర్యపడి’ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాతి ‘అన్నారు’తో సులభంగా అనుసంధానమవుతుంది.
- source_word: οἱ ὄχλοι
  choice: జనసమూహాలు
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా మరియు సహజంగా ఉంది.
- source_word: Οὐδέποτε
  choice: ఎన్నడూ
  rationale: ‘ఎప్పుడూ కాదు/ఎన్నడూ లేదు’ అనే సంపూర్ణ నిరాకరణ భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐφάνη
  choice: కనిపించలేదు
  rationale: φαίνω పాసివ్ రూపం ఇక్కడ ‘కనిపించడం/చూడబడడం’ అనే భావాన్ని ఇస్తుంది. తెలుగు వాడుకలో ‘ఇలాంటిది కనిపించలేదు’ అనేది సహజంగా ఉండి, మూలంలోని ప్రత్యక్షత భావాన్ని కాపాడుతుంది.
- source_word: οὕτως
  choice: ఇలాంటిది
  rationale: ఇప్పుడే జరిగిన సంఘటనలాంటి దానిని సూచించే οὕτως భావాన్ని తెలుగు ఉక్తిలో సహజంగా వ్యక్తపరుస్తుంది; ‘ఇలా’ అనే క్రియావిశేషణ రూపం కంటే ఇక్కడ ‘ఇలాంటిది’ సంపూర్ణ వాక్యాన్ని ఇస్తుంది.
- source_word: ἐν τῷ Ἰσραήλ
  choice: ఇశ్రాయేలులో
  rationale: ప్రజల మధ్యగానీ, ఇశ్రాయేలు పరిధిలోగానీ అనే మూలంలోని విస్తృత భావాన్ని అనవసరంగా పరిమితం చేయకుండా ఉంచుతుంది.
theological_decisions:
- issue: స్వస్థత/భూతవిమోచన సందర్భంలో κωφός పదార్థ పరిధి
  choice: ‘మూగవాడు’ అని అనువదించడం
  alternative: ‘చెవిటివాడు’
  rationale: ఈ గ్రీకు పదానికి రెండు అర్థాలు సాధ్యమైనా, అతడు ‘మాట్లాడాడు’ అనే తక్షణ ఫలితం మాటలాడలేని స్థితినే సందర్భం ప్రధానంగా చూపుతున్నదని సూచిస్తుంది. అందువల్ల సందర్భం నిర్ధారించని మరొక వైకల్యాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ అనువదించబడింది. ‘దయ్యం’, ‘మూగవాడు’, ‘జనసమూహాలు’ వంటి పదాలు మూలార్థానికి దగ్గరగా ఉండడంతో పాటు సహజ తెలుగు వినియోగానికి అనుగుణంగా ఉన్నాయి.
