id: MAT.9.35
reference: Matthew 9:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: te
  text: యేసు పట్టణాలన్నిటిలోనూ గ్రామాలన్నిటిలోనూ తిరుగుతూ, వారి సమాజమందిరాల్లో బోధిస్తూ, రాజ్య శుభవార్తను[a] ప్రకటిస్తూ, ప్రతి వ్యాధినీ ప్రతి అనారోగ్యాన్నీ[b] స్వస్థపరుస్తూ వచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాజ్య సువార్తను.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రతి వ్యాధినీ ప్రతి బలహీనతనూ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: περιῆγεν
  choice: తిరుగుతూ వచ్చాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ సూచించే కొనసాగుతున్న సంచార కార్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πόλεις πάσας καὶ τὰς κώμας
  choice: పట్టణాలన్నిటిలోనూ గ్రామాలన్నిటిలోనూ
  rationale: పెద్ద జనావాసాలు, చిన్న జనావాసాలు అనే మూలభాషలోని భేదాన్ని నిలుపుతూ, πάσας యొక్క సమగ్రతను రెండు పదాలకూ స్పష్టంగా వర్తింపజేస్తుంది.
- source_word: διδάσκων
  choice: బోధిస్తూ
  rationale: ప్రధాన క్రియతో పాటు కొనసాగుతున్న కార్యాన్ని కృదంత రూపంలో నిలుపుతుంది.
- source_word: συναγωγαῖς αὐτῶν
  choice: వారి సమాజమందిరాల్లో
  rationale: చారిత్రక యూదు ఆరాధనా-సమావేశ స్థలాన్ని సూచించే ప్రామాణిక తెలుగు పదాన్ని వాడి, αὐτῶνను ‘వారి’గా నిలుపుతుంది.
- source_word: κηρύσσων
  choice: ప్రకటిస్తూ
  rationale: బహిరంగంగా అధికారపూర్వకంగా తెలియజేయడం అనే κηρύσσω భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: రాజ్య శుభవార్తను
  rationale: εὐαγγέλιον యొక్క అర్థాన్ని పారదర్శకంగా తెలియజేస్తూ, ‘రాజ్య’ అనే సంబంధపదంలోని సంక్షిప్తతను, సాధ్యమైన భావవిస్తృతిని నిలుపుతుంది.
- source_word: θεραπεύων
  choice: స్వస్థపరుస్తూ
  rationale: సువార్తలలోని స్వస్థత కార్యానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: πᾶσαν νόσον
  choice: ప్రతి వ్యాధినీ
  rationale: νόσοςను స్పష్టంగా ‘వ్యాధి’గా అనువదించి, పునరుక్త πᾶσανను ‘ప్రతి’తో నిలుపుతుంది.
- source_word: πᾶσαν μαλακίαν
  choice: ప్రతి అనారోగ్యాన్నీ
  rationale: μαλακία యొక్క అనారోగ్యం/దౌర్బల్యం భావపరిధిలో సాధారణ పాఠకులకు స్పష్టమైన పదాన్ని ఎంచుకుంది; ‘బలహీనత’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపింది.
theological_decisions:
- issue: εὐαγγέλιον పదం యొక్క అనువాదం
  choice: శుభవార్త
  alternative: సువార్త
  rationale: సాంప్రదాయ మతపరమైన పదానికే పరిమితం కాకుండా మూలపదార్థాన్ని ఆధునిక పాఠకునికి నేరుగా తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- issue: πᾶσαν νόσον καὶ πᾶσαν μαλακίανలో స్వస్థపరిచే కార్యపు పరిధి
  choice: ప్రతి వ్యాధినీ ప్రతి అనారోగ్యాన్నీ
  alternative: ప్రతి వ్యాధినీ ప్రతి బలహీనతనూ
  rationale: రెండుసార్లు వచ్చిన πᾶσανను నిలిపి వాక్యంలోని సమగ్ర పరిధిని తగ్గించకుండా వ్యక్తం చేస్తుంది; ఇది సిద్ధాంతపరమైన విస్తరణ కాకుండా మూలవాక్య నిర్మాణాన్ని అనుసరించిన ఎంపిక.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘తిరుగుతూ ... బోధిస్తూ ... ప్రకటిస్తూ ... స్వస్థపరుస్తూ వచ్చాడు’ అనే నిర్మాణం గ్రీకు అసంపూర్ణ భూతకాలం మరియు సమన్వయ కృదంతాల కొనసాగుతున్న భావాన్ని నిలుపుతుంది. మతపరమైన చారిత్రక సందర్భం కోసం ‘సమాజమందిరాలు’ను నిలిపి, సాధారణ పాఠకునికి అర్థమయ్యే పదజాలాన్ని ఎంచుకుంది.
