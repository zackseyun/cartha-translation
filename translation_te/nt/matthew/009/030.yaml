id: MAT.9.30
reference: Matthew 9:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: te
  text: వారి కళ్లు తెరుచుకున్నాయి. యేసు వారిని కఠినంగా హెచ్చరించి[a], “ఈ సంగతి ఎవరికీ తెలియకుండా చూసుకోండి” అన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కఠినంగా హెచ్చరించి” అని అనువదించిన గ్రీకు క్రియ బలమైన భావోద్వేగంతో కూడిన కఠినమైన ఆదేశం లేదా హెచ్చరికను సూచించగలదు; “కఠినంగా ఆజ్ఞాపించి” లేదా “తీవ్రంగా మందలించి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మూలంలో అక్షరార్థంగా, “ఎవరికీ తెలియకుండా చూసుకోండి.” “ఈ సంగతి” అనే కర్మ సందర్భంలోని స్వస్థతను బట్టి చేర్చబడింది.
    reason: implicit_object
lexical_decisions:
- source_word: ἠνεῴχθησαν
  choice: తెరుచుకున్నాయి
  rationale: ἀνοίγω క్రియ యొక్క భూతకాల కర్మణి రూపం. చూపు తిరిగి వచ్చిందని కర్తను ప్రత్యేకంగా చేర్చకుండా సహజమైన తెలుగు వాడుకలో తెలియజేస్తుంది.
- source_word: οἱ ὀφθαλμοί
  choice: వారి కళ్లు
  rationale: గ్రీకులోని స్వామ్య సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἐνεβριμήθη
  choice: గట్టిగా హెచ్చరిస్తూ
  rationale: ఈ క్రియలో బలమైన భావోద్వేగంతో కూడిన కఠినమైన ఆదేశం ఉంది. తరువాత వచ్చే నిషేధానికి అనుగుణంగా ‘గట్టిగా హెచ్చరించాడు’ అనే భావం స్పష్టంగా ఉంటుంది.
- source_word: λέγων
  choice: అన్నాడు
  rationale: ప్రధాన క్రియతో సమకాలికమైన కృదంతాన్ని తెలుగు వాక్య నిర్మాణానికి సహజంగా ప్రత్యక్ష ఉక్తి తరువాత ‘అన్నాడు’గా అమర్చాం.
- source_word: Ὁρᾶτε
  choice: చూసుకోండి
  rationale: ఇది అక్షరార్థంగా చూడడాన్ని కాకుండా జాగ్రత్తగా నిర్ధారించుకోవాలనే ఆజ్ఞను సూచిస్తుంది.
- source_word: μηδεὶς γινωσκέτω
  choice: ఎవరికీ తెలియకుండా
  rationale: μηδείς తో ఉన్న మూడవ పురుష ఆజ్ఞార్థక రూపం నిషేధాన్ని వ్యక్తం చేస్తుంది. తెలుగులో ‘ఎవరికీ తెలియకుండా చూసుకోండి’ అనేది సహజంగా ఆ ఆజ్ఞ బలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: స్వస్థత తరువాత యేసు ఇచ్చిన ఆజ్ఞ యొక్క తీవ్రత
  choice: యేసు బలమైన నిషేధం విధించినట్లు అనువదించడం
  alternative: యేసు వారిని గద్దించాడు / కఠినంగా ఆజ్ఞాపించాడు
  rationale: వాక్యం ఆజ్ఞలోని బలాన్ని చూపుతుంది గాని దాని వెనుక ఉద్దేశాన్ని వివరించదు. అందువల్ల కారణాన్ని ఊహించకుండా ఆ తీవ్రతను మాత్రమే నిలిపాం.
- issue: γινωσκέτω క్రియకు వ్యక్తంగా లేని కర్మ
  choice: ‘ఈ సంగతి’ అని సందర్భం నుండి స్పష్టం చేయడం
  alternative: ‘ఎవరికీ తెలియనివ్వకండి’ అని కర్మను పేర్కొనకుండా ఉంచడం
  rationale: గ్రీకులో కర్మ వ్యక్తంగా లేదు; సందర్భంలో అది స్వస్థత జరిగిన సంగతిని సూచిస్తుంది. సహజమైన తెలుగుకోసం ‘ఈ సంగతి’ చేర్చినా, అది మూలంలో అంతర్లీనమై ఉందని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువదించాం. గ్రీకు వాక్యంలోని వరుస ‘మరియు’లను యాంత్రికంగా పునరావృతం చేయకుండా ‘అప్పుడు’తో సహజ ప్రవాహం కల్పించాం. ఆజ్ఞ వెనుక యేసు ఉద్దేశం గురించి ఎలాంటి సిద్ధాంతపరమైన వివరణను చేర్చలేదు.
