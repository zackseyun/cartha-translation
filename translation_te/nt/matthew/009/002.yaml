id: MAT.9.2
reference: Matthew 9:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: te
  text: 'ఇదిగో, వారు మంచంపై పడుకొని ఉన్న ఒక పక్షవాత రోగిని ఆయన దగ్గరకు తీసుకువస్తుండగా, యేసు వారి విశ్వాసాన్ని[a] చూసి ఆ పక్షవాత రోగితో ఇలా అన్నాడు: “ధైర్యంగా ఉండు, బిడ్డా! నీ పాపాలు క్షమించబడ్డాయి[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వారి’ అనే బహువచనం పక్షవాత రోగిని మరియు అతన్ని తీసుకొచ్చినవారిని సూచించవచ్చు; లేదా తీసుకొచ్చినవారినే ఒక సమూహంగా సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: మూలభాషలో వర్తమాన కాల కర్మణి రూపం ఉంది; దీన్ని ‘నీ పాపాలు క్షమించబడుతున్నాయి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: మత్తయి కథనంలోని శ్రద్ధను ఆకర్షించే సజీవ సంభాషణ సూచకాన్ని సహజమైన తెలుగు పదంతో నిలుపుతుంది.
- source_word: προσέφερον
  choice: తీసుకొచ్చారు
  rationale: προσφέρω యొక్క ‘దగ్గరికి తీసుకురావడం’ అనే మూలభావాన్ని సందర్భానుసారంగా సహజమైన తెలుగు కథన భూతకాలంలో వ్యక్తం చేస్తుంది; గ్రీకు అసంపూర్ణ భూతకాల రూపాన్ని కృత్రిమంగా దీర్ఘక్రియగా చేయదు.
- source_word: παραλυτικὸν
  choice: ఒక పక్షవాత రోగిని
  rationale: విశేషణం నామవాచకంగా వాడబడిన భావాన్ని ఆధునిక పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: మంచం మీద పడి ఉన్న
  rationale: వ్యక్తి ఉన్న స్థితిని సహజంగా తెలుపుతుంది; κλίνηని అనిశ్చితంగా ‘చాప’ అని పరిమితం చేయకుండా ‘మంచం’గా అనువదిస్తుంది.
- source_word: πίστιν
  choice: విశ్వాసాన్ని
  rationale: πίστιςకు సాధారణమైన సమానార్థకాన్ని వాడుతూ, క్రియలో వ్యక్తమైన నమ్మకాన్ని కూడా సందర్భం ద్వారా నిలుపుతుంది.
- source_word: Θάρσει
  choice: ధైర్యంగా ఉండు
  rationale: ఆదరణతో కూడిన ఆజ్ఞార్థక భరోసాను నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τέκνον
  choice: బిడ్డా
  rationale: లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా, ఆప్యాయమైన సంబోధనను నిలుపుతుంది.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: నీ పాపాలు క్షమించబడ్డాయి
  rationale: తెలుగులో సహజమైన క్షమాపణ ప్రకటనగా ఉంటుంది; కర్తను పేర్కొనని గ్రీకు కర్మణి ప్రయోగాన్ని అలాగే ఉంచుతుంది.
- source_word: ἁμαρτίαι
  choice: పాపాలు
  rationale: బహువచనంలోని నిర్దిష్ట అపరాధాల భావాన్ని ప్రామాణికమైన తెలుగు పదంతో నిలుపుతుంది.
theological_decisions:
- issue: τὴν πίστιν αὐτῶνలోని బహువచన సూచన
  choice: ‘వారి విశ్వాసం’ అని అనువదించి, విశ్వాసం గల సమూహం ఎవరో ప్రధాన పాఠంలో నిర్ధారించలేదు.
  alternative: అది మోసుకొచ్చిన వారి విశ్వాసాన్ని మాత్రమే, లేదా రోగితో సహా అందరి విశ్వాసాన్ని సూచిస్తుందని స్పష్టీకరించడం.
  rationale: αὐτῶν బహువచనం ఒకరికంటే ఎక్కువ మందిని సూచిస్తుంది; అయితే పక్షవాత రోగి అందులో ఉన్నాడా లేదా అనే విషయాన్ని గ్రీకు వాక్యం తేల్చదు.
- issue: యేసు చేసిన క్షమాపణ ప్రకటనలో కార్యనిర్వాహకుడు
  choice: ‘క్షమించబడ్డాయి’ అనే కర్మణి రూపంతో కార్యనిర్వాహకుణ్ణి పేర్కొనలేదు.
  alternative: ‘దేవుడు నీ పాపాలను క్షమించాడు’ లేదా ‘నేను నీ పాపాలను క్షమిస్తున్నాను’ అని కార్యనిర్వాహకుణ్ణి స్పష్టంగా చేర్చడం.
  rationale: గ్రీకు కర్మణి రూపం కార్యనిర్వాహకుణ్ణి చెప్పకుండా క్షమాపణను ప్రకటిస్తుంది. అనువాదం కథనంలోని యేసు అధికారాన్ని చెరపకుండా, మూలంలోని ఈ ఉద్దేశపూర్వక అనిర్దిష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘బిడ్డా’ ఆప్యాయతను, ‘ధైర్యంగా ఉండు’ భరోసాను నిలుపుతాయి. మూలపాఠంలోని బహువచన సూచన మరియు కర్మణి ప్రయోగంలోని వేదాంతపరమైన అనిర్దిష్టతలను పరిష్కరించకుండా ఉంచాం.
