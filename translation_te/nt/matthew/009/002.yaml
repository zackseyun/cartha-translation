revisions:
- from: ఇదిగో, వారు మంచం మీద పడి ఉన్న ఒక పక్షవాత రోగిని ఆయన దగ్గరికి తీసుకొచ్చారు. యేసు వారి విశ్వాసాన్ని[a] చూసి ఆ పక్షవాత రోగితో, “ధైర్యంగా ఉండు, బిడ్డా! నీ పాపాలు క్షమించబడ్డాయి[b]” అన్నాడు.
