id: MAT.9.25
reference: Matthew 9:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: te
  text: అయితే జనసమూహాన్ని బయటకు పంపిన తర్వాత, ఆయన లోపలికి వెళ్లి ఆమె చెయ్యి పట్టుకున్నాడు; ఆ బాలిక లేచింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ బాలిక లేపబడింది.” గ్రీకు క్రియారూపాన్ని ఈ విధంగానూ అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: అయితే … తర్వాత
  rationale: ὅτε కాలసంబంధాన్ని సూచిస్తుంది; δέ స్వల్ప కథన మలుపును సూచిస్తుంది. సహజమైన తెలుగు వాక్యనిర్మాణంలో రెండింటినీ కలిపి ఇలా వ్యక్తపరచడం స్పష్టంగా ఉంటుంది.
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: జనసమూహాన్ని బయటకు పంపిన
  rationale: ἐξεβλήθη కర్మణి ప్రయోగం. ఈ సందర్భంలో బలవంతంగా వెళ్లగొట్టారనే అతిశయార్థం రాకుండా, వారిని బయటకు పంపించిన భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰσελθὼν
  choice: లోపలికి వెళ్లి
  rationale: కథనంలో ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచించే aorist participleను సహజమైన తెలుగు సంయుక్త క్రియగా అనువదించాం.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: ఆమె చెయ్యి పట్టుకున్నాడు
  rationale: κρατέω + genitive ఇక్కడ చెయ్యిని పట్టుకోవడం అనే అర్థం ఇస్తుంది. ఇది మూలంలోని చర్యను సరళంగా, సహజంగా తెలుపుతుంది.
- source_word: ἠγέρθη
  choice: లేచింది
  rationale: ఈ కర్మణి రూపం సందర్భంలో అకర్మక ఫలితార్థంతో కూడా అర్థమవుతుంది. ‘లేచింది’ సహజమైన తెలుగు; అయితే ‘లేపబడింది’ అనే కర్మణి భావసాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: τὸ κοράσιον
  choice: ఆ బాలిక
  rationale: κοράσιον చిన్న వయసున్న అమ్మాయిని సూచిస్తుంది. ‘బాలిక’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన పదం.
theological_decisions:
- issue: జీవానికి తిరిగి వచ్చిన సందర్భంలో ἠγέρθη అనువాదం
  choice: లేచింది
  alternative: లేపబడింది
  rationale: గ్రీకు కర్మణి రూపాన్ని తెలుగులో సహజంగా అకర్మకంగా చెప్పవచ్చు; అయినా దేవుని లేదా యేసును క్రియాకర్తగా సూచించే కర్మణి పఠనం కూడా సాధ్యమే. ప్రధాన పాఠం ఏజెన్సీని అతిగా నిర్దిష్టం చేయకుండా, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి. పాదసూచిక గుర్తును అది వివరిస్తున్న ‘లేచింది’ తర్వాత ఉంచాం.
