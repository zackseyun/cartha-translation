id: MAT.9.29
reference: Matthew 9:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: te
  text: అప్పుడు ఆయన వారి కళ్లను తాకి, “మీ విశ్వాసం[a] ప్రకారం మీకు జరుగుగాక” అని ఇలా అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ నమ్మకం ప్రకారం మీకు జరుగుగాక.” గ్రీకు పదమైన పిస్టిస్‌ను “నమ్మకం” అని, కొన్ని సందర్భాల్లో “విశ్వసనీయత” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథనంలో తరువాత జరిగిన చర్యను సూచించే సహజమైన కాలసూచక పదం.
- source_word: ἥψατο
  choice: తాకి
  rationale: ఈ సందర్భంలో ἅπτομαι శారీరకంగా తాకడాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహానికి అనుగుణంగా సమాపక క్రియారూపం వాడబడింది.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: వారి కళ్లను
  rationale: ἅπτομαι తరువాత గ్రీకులో వచ్చిన షష్ఠీ విభక్తిని సహజమైన తెలుగులో కర్మరూపంగా అనువదించాం.
- source_word: λέγων
  choice: అని అన్నాడు
  rationale: ప్రధాన చర్యతో సమకాలీనమైన గ్రీకు కృదంతాన్ని సహజమైన తెలుగు ప్రత్యక్షోక్తి నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: Κατὰ
  choice: ప్రకారం
  rationale: κατά ఇక్కడ అనురూపత లేదా కొలత భావాన్ని ఇస్తుంది; బలమైన కారణార్థాన్ని చేర్చకుండా ఆ భావాన్ని నిలుపుతుంది.
- source_word: τὴν πίστιν ὑμῶν
  choice: మీ విశ్వాసం
  rationale: πίστις కు ప్రామాణికమైన తెలుగు సమానార్థకం; ఈ సందర్భంలో యేసు స్వస్థపరచగలడనే వారి నమ్మకాన్ని సూచిస్తుంది.
- source_word: γενηθήτω
  choice: జరుగుగాక
  rationale: γίνομαι యొక్క ఆజ్ఞార్థక భావాన్ని గంభీరమైన, సహజమైన తెలుగు ఆశీర్వచన/ప్రకటన రూపంలో నిలుపుతుంది; కార్యానికి స్పష్టంగా చెప్పని కర్తను జోడించదు.
- source_word: ὑμῖν
  choice: మీకు
  rationale: స్వస్థత పొందేవారిని సూచించే దత్తివార్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: స్వస్థపరిచే ప్రకటనలో πίστις అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ప్రధాన పాఠంలో ‘విశ్వాసం’ ప్రామాణికమైనదీ, ఈ సందర్భానికి తగినదీ. సందర్భం యేసు స్వస్థపరచగలడనే అంధుల నమ్మకాన్ని సూచించినా, గ్రీకు పదానికి ఉన్న విస్తృత భావపరిధిని పాదటిప్పణిలో ఉంచాం.
- issue: γενηθήτω యొక్క భావం
  choice: జరుగుగాక
  alternative: చేయబడుగాక; సంభవించుగాక
  rationale: ఇది అంధుల విశ్వాసానికి అనుగుణంగా ఫలితం కలగాలని చేసే ప్రభావవంతమైన ప్రకటన. ‘జరుగుగాక’ ఆజ్ఞార్థక బలాన్ని నిలుపుతూ, గ్రీకు వాక్యం స్పష్టంగా చెప్పని కార్యసాధకుడిని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథనశైలిని, యేసు పలుకులో గంభీరతను కలిపాం. ‘జరుగుగాక’ సాధారణ సంభాషణకంటే కొద్దిగా ఉన్నతమైన రూపమైనా, ఆజ్ఞాత్మక-ప్రకటనాత్మక గ్రీకు భావానికి తగినది. పాదటిప్పణి గుర్తు సంబంధిత వాక్యం చివర ఉంచబడింది.
