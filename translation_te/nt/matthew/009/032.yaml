id: MAT.9.32
reference: Matthew 9:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Αὐτῶν δὲ ἐξερχομένων ἰδοὺ προσήνεγκαν αὐτῷ ⸀ἄνθρωπον κωφὸν δαιμονιζόμενον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: te
  text: వారు బయటికి వెళ్తుండగా, ఇదిగో, దయ్యం పట్టిన మూగవాడిని[a][b] ఆయన దగ్గరికి తీసుకొచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చెవిటివాడిని.” గ్రీకు పదం సందర్భాన్ని బట్టి “మూగ” లేదా “చెవిటి” అని అర్థం ఇవ్వగలదు. తరువాతి వచనంలో అతడు మాట్లాడాడని చెప్పడం ఇక్కడ “మూగ” అనే అనువాదానికి మద్దతిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “దయ్యం వశంలో ఉన్న మూగవాడిని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: వారు బయటికి వెళ్తుండగా
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణంలోని సమకాలిక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; δέ ఇక్కడ ప్రధానంగా దృశ్యమార్పును సూచిస్తున్నందున ప్రత్యేక సంధానపదం అవసరం లేదు.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా ఎదురయ్యే విషయంపై దృష్టి నిలిపే ἰδού పద ప్రభావాన్ని సహజంగా నిలుపుతుంది.
- source_word: προσήνεγκαν αὐτῷ
  choice: ఆయన దగ్గరికి తీసుకొచ్చారు
  rationale: వ్యక్తిని యేసు సమక్షానికి తీసుకురావడం అనే సందర్భార్థాన్ని, αὐτῷను స్పష్టంగా ప్రతిబింబిస్తూ, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἄνθρωπον
  choice: వాడిని
  rationale: κωφόνతో కలిసి ‘మూగవాడిని’ అనే సహజ తెలుగు వ్యక్తివాచక రూపంగా వస్తుంది; సందర్భంలో పురుషుణ్ణి సూచిస్తుంది.
- source_word: κωφὸν
  choice: మూగవాడిని
  rationale: κωφός అనేది చెవిటితనాన్ని లేదా మూగతనాన్ని సూచించగలదు; తరువాతి వచనంలో అతడు మాట్లాడాడని ఉండటం వల్ల ఇక్కడ ‘మూగ’ సందర్భోచితం.
- source_word: δαιμονιζόμενον
  choice: దయ్యం పట్టిన
  rationale: దయ్య సంబంధమైన బాధలో ఉన్నాడనే సువార్త కథనార్థాన్ని సాధారణ ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; ఆ స్థితి స్వభావంపై అదనపు సిద్ధాంత వివరణను చేర్చదు.
theological_decisions:
- issue: దయ్య సంబంధమైన బాధను తెలిపే భాష
  choice: దయ్యం పట్టిన
  alternative: దయ్యం వశంలో ఉన్న
  rationale: δαιμονιζόμενονను నిజమైన దయ్య సంబంధమైన బాధగా సూటిగా అనువదిస్తుంది. అదే సమయంలో దయ్యం ప్రభావం లేదా ఆధీనత యొక్క ఖచ్చితమైన విధానాన్ని మూలపాఠం చెప్పినదానికంటే ఎక్కువగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. ‘ఇదిగో’ ద్వారా మూలంలోని దృష్టి ఆకర్షణ నిలుపబడింది; ‘దయ్యం పట్టిన’ అనేది విస్తృతంగా అర్థమయ్యే సహజ ప్రయోగం.
