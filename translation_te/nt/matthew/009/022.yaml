id: MAT.9.22
reference: Matthew 9:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: te
  text: అయితే యేసు తిరిగి ఆమెను చూసి, “ధైర్యంగా ఉండు, కుమార్తె; నీ విశ్వాసం[a] నిన్ను రక్షించింది[b]” అని చెప్పాడు. ఆ స్త్రీ ఆ సమయం నుండి స్వస్థపడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విశ్వాసం’ అనే మాటను ఇక్కడ ‘నమ్మకం’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘నిన్ను స్వస్థపరచింది’ లేదా ‘నిన్ను బాగుచేసింది’ అని కూడా అనువదించవచ్చు. గ్రీకు క్రియకు రక్షించడం, స్వస్థపరచడం, బాగుచేయడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: ఆమెవైపు తిరిగి
  rationale: ఈ కర్తరి అర్థంలో వాడిన భూతకృదంతం యేసు ఆమెను గమనించేలా తిరిగిన చర్యను సూచిస్తుంది. ‘ఆమెవైపు’ అనేది తెలుగులో సహజమైన సంబంధాన్ని తెలియజేస్తుంది; తిరిగిన ఖచ్చిత దిశను అతిగా నిర్దేశించదు.
- source_word: ἰδὼν αὐτὴν
  choice: ఆమెను చూసి
  rationale: తెలుగులో వరుసగా జరిగిన చర్యలను సహజంగా తెలిపే క్రియావిశేషణ రూపం; గ్రీకు కృదంత ప్రవాహాన్ని నిలుపుతుంది.
- source_word: Θάρσει
  choice: ధైర్యంగా ఉండు
  rationale: θαρσέω ఆజ్ఞారూపం ధైర్యం కలిగి ఉండమనే ప్రోత్సాహాన్ని ఇస్తుంది. ఈ రూపం ఆధునిక తెలుగులో ప్రత్యక్షంగా, సహజంగా ఉంటుంది.
- source_word: θύγατερ
  choice: కుమార్తె
  rationale: ఆప్యాయమైన కుటుంబ సంబోధనను అదనపు విశేషణం చేర్చకుండా నిలుపుతుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో యేసుపై ఉంచిన నమ్మకాన్ని సూచిస్తుంది. ‘విశ్వాసం’ మూలపదపు సాధారణమైన, విస్తృతమైన అర్థాన్ని నిలుపుతుంది; ‘నమ్మకం’ సాధ్యమైన భావఛాయగా పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: σέσωκέν σε
  choice: నిన్ను రక్షించింది
  rationale: σῴζω యొక్క సంపూర్ణ భూతరూపం కలిగించే నిలకడైన ఫలితాన్ని ‘రక్షించింది’ వ్యక్తం చేస్తుంది. ఈ క్రియకు రక్షించడం, స్వస్థపరచడం అనే అర్థవిస్తృతి ఉన్నందున, యేసు మాటల్లో విస్తృత భావాన్ని నిలిపి ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἐσώθη
  choice: స్వస్థపడింది
  rationale: ఇక్కడ కథన సందర్భం స్త్రీ శారీరక స్వస్థతను స్పష్టంగా సూచిస్తుంది. అదే σῴζω క్రియ అయినప్పటికీ, కథన ఫలితాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘స్వస్థపడింది’ వాడబడింది.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: ఆ సమయం నుంచే
  rationale: నిర్దిష్ట సమయం మొదలైన వెంటనే ఫలితం కొనసాగిందనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘ఆ గడియ నుండి’ అనే పదశః రూపంలోని పురాతన శైలిని నివారిస్తుంది.
- source_word: γυνή
  choice: ఆ స్త్రీ
  rationale: ముందుగా ప్రస్తావించబడిన స్త్రీని తిరిగి సూచించే సాధారణ, స్పష్టమైన తెలుగు రూపం.
theological_decisions:
- issue: πίστις యొక్క అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం
  rationale: ఈ సందర్భంలో వ్యక్తిగత నమ్మకం ప్రధాన భావఛాయ అయినప్పటికీ, ‘విశ్వాసం’ గ్రీకు పదపు విస్తృతమైన ధార్మిక మరియు సంబంధాత్మక పరిధిని నిలుపుతుంది. ‘నమ్మకం’ను పాదటిప్పణిలో ఉంచడం ద్వారా ఆ సందర్భార్థాన్ని కూడా సంరక్షించాం.
- issue: యేసు మాటల్లోను కథన ముగింపులోను σῴζω అనువాదం
  choice: యేసు మాటల్లో ‘రక్షించింది’; కథన ఫలితంలో ‘స్వస్థపడింది’
  alternative: రెండు చోట్లా ‘స్వస్థపరచింది/స్వస్థపడింది’ లేదా ‘బాగుచేసింది/బాగుపడింది’
  rationale: పునరావృతమైన σῴζω శారీరక స్వస్థతతోపాటు విస్తృతమైన రక్షణ భావాన్ని మోస్తుంది. యేసు మాటల్లో ‘రక్షించింది’ అని ఉంచడం ఆ విస్తృతిని కాపాడుతుంది; కథన ముగింపులో ‘స్వస్థపడింది’ తక్షణ శారీరక ఫలితాన్ని స్పష్టం చేస్తుంది. ఇలా మూలంలోని భావ ఉద్రిక్తతను ఏకార్థంగా కుదించకుండా నిలుపుతాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు కృదంతాల వరుసను ‘తిరిగి, ... చూసి’గా సహజీకరించాం. ‘కుమార్తె’ సంబోధనలోని ఆప్యాయతను నిలుపుతుంది. ‘ఆ సమయం నుంచే’ మూలంలోని కాల సూచనను సహజంగా వ్యక్తం చేస్తుంది.
