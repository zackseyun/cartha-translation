revisions:
- from: అయితే యేసు ఆమెవైపు తిరిగి, ఆమెను చూసి, “ధైర్యంగా ఉండు, కుమార్తె; నీ విశ్వాసం[a] నిన్ను రక్షించింది[b]” అని చెప్పాడు. ఆ సమయం నుంచే ఆ స్త్రీ స్వస్థపడింది.
  to: అయితే యేసు తిరిగి ఆమెను చూసి, “ధైర్యంగా ఉండు, కుమార్తె; నీ విశ్వాసం[a] నిన్ను రక్షించింది[b]” అని చెప్పాడు. ఆ స్త్రీ ఆ సమయం నుండి స్వస్థపడింది.
  rationale: The revision removes two small additions of nuance while retaining the draft’s sound rendering of the Greek participial sequence, direct address, faith terminology, and the deliberate save/heal resonance of σῴζω. Footnote anchors remain correctly attached and the complete footnote set is preserved.
