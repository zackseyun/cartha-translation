id: MAT.9.18
reference: Matthew 9:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: te
  text: ఆయన వారితో ఈ సంగతులు చెబుతుండగా, ఇదిగో, ఒక అధికారి వచ్చి ఆయన ఎదుట వంగి నమస్కరించి, “నా కుమార్తె ఇప్పుడే చనిపోయింది. కానీ మీరు వచ్చి ఆమెపై మీ చెయ్యి ఉంచండి; ఆమె బ్రతుకుతుంది” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా ప్రవేశించే వ్యక్తిపై పాఠకుని దృష్టిని నిలిపే గ్రీకు సూచనను సహజమైన తెలుగు కథన రూపంలో నిలుపుతుంది.
- source_word: ἄρχων
  choice: అధికారి
  rationale: ఏ రకమైన పాలకుడు లేదా సభాధికారి అనే వివరాన్ని మత్తయి ఇక్కడ చెప్పలేదు; అందువల్ల సాధారణ పదాన్ని ఎంచుకున్నాం.
- source_word: προσεκύνει
  choice: సాష్టాంగపడి
  rationale: అతడు యేసు ఎదుట గౌరవంతో నేలకు వంగిన చర్యను వ్యక్తపరుస్తుంది; ఈ సందర్భంలో ఆ పదం తప్పనిసరిగా ఆరాధననే సూచిస్తుందని ముందే నిర్ణయించదు.
- source_word: ἄρτι ἐτελεύτησεν
  choice: ఇప్పుడే చనిపోయింది
  rationale: ἄρτι యొక్క తక్షణ కాలభావాన్ని, ἐτελεύτησεν తెలిపే మరణాన్ని సూటిగా అందిస్తుంది.
- source_word: ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν
  choice: ఆమె మీద మీ చెయ్యి ఉంచండి
  rationale: మూలంలోని ఏకవచన ‘చెయ్యి’ని, భౌతిక చర్యను నేరుగా నిలుపుతుంది.
- source_word: ζήσεται
  choice: బ్రతుకుతుంది
  rationale: భవిష్యత్ కాలంలోని నిశ్చయభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: προσεκύνει అనే క్రియలో గౌరవం మరియు ఆరాధన మధ్య భావపరిధి
  choice: సాష్టాంగపడి
  alternative: ఆయనను ఆరాధించి
  rationale: అధికారి చేసిన శరీరభంగిమను స్పష్టంగా చూపుతూ, అతని చర్యకు సంబంధించిన పూర్తి దైవశాస్త్రీయ అర్థాన్ని అనువాదమే తేల్చివేయకుండా అసలు పదంలోని భావపరిధిని కాపాడుతుంది.
- issue: అధికారి మాటల్లో కుమార్తె తిరిగి బ్రతుకుతుందనే నిశ్చయం
  choice: అప్పుడు ఆమె బ్రతుకుతుంది
  alternative: ఆమె బ్రతకవచ్చు
  rationale: గ్రీకు భవిష్యత్ రూపం ζήσεται వ్యక్తపరచే నిశ్చయాన్ని బలహీనపరచకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన సంభాషణ కోసం ‘మీరు/మీ’ రూపాలు వాడబడ్డాయి. వాక్యం కథనశైలిలో సహజంగా ఉండేలా చేసినప్పటికీ, మూలంలోని క్రమం, ‘ఇదిగో’ అనే దృష్టి సూచకం, అధికారి చేసిన వినతి, అతని నిశ్చయం అన్నీ నిలుపబడ్డాయి.
