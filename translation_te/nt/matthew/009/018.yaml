  terminology: ‘అధికారి’ అనేది ἄρχωνకు తగిన సాధారణ పదం; సందర్భం ఏ ప్రత్యేక అధికార పదవినీ చెప్పదు. ‘ఇదిగో,’ ἰδοὺ యొక్క కథన దృష్టి-సూచనను నిలుపుతుంది. ‘బ్రతుకుతుంది’ ζήσεταιలోని నిశ్చయాత్మక భవిష్యత్ భావాన్ని కాపాడుతుంది.
