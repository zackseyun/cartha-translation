id: MAT.9.13
reference: Matthew 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: te
  text: “అయితే మీరు వెళ్లి, ‘నేను కోరేది కనికరాన్నే, బలిని కాదు’ అనే మాటకు అర్థమేమిటో నేర్చుకోండి.[a][b] ఎందుకంటే నేను నీతిమంతులను[c] పిలవడానికి రాలేదు గాని, పాపులను పిలవడానికి వచ్చాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదశః: “వెళ్లి, ఇది ఏమిటో నేర్చుకోండి.”'
    reason: lexical_alternative
  - marker: b
    text: ఇది హోషేయా 6:6 నుండి తీసుకున్న ఉల్లేఖనం.
    reason: cross_reference
  - marker: c
    text: బహుశా “తాము నీతిమంతులమని భావించేవారిని” అని భావం కావచ్చు; గ్రీకు పాఠ్యంలో కేవలం “నీతిమంతులను” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: మీరు వెళ్లి
  rationale: తరువాతి ఆజ్ఞార్థక క్రియతో కలిసి ఇది ‘వెళ్లి నేర్చుకోండి’ అనే సహజమైన ఆజ్ఞను ఇస్తుంది; కృదంత రూపాన్ని కృత్రిమంగా అనువదించకుండా దాని బలాన్ని నిలుపుతుంది.
- source_word: μάθετε
  choice: నేర్చుకోండి
  rationale: వాక్యార్థాన్ని గ్రహించమని చెప్పే ఆజ్ఞతో పాటు సందర్భంలోని మందలింపు ధోరణినీ నిలుపుతుంది.
- source_word: τί ἐστιν
  choice: అర్థమేమిటో
  rationale: పదశః ‘ఇది ఏమిటో’ అని ఉన్నప్పటికీ, ఇక్కడ లేఖన ఉల్లేఖన భావాన్ని గ్రహించడమే ఉద్దేశం; ఆధునిక తెలుగులో ఇది సహజంగా ఉంటుంది.
- source_word: Ἔλεος
  choice: కనికరం
  rationale: ἔλεος లోని దయాపూర్వక ప్రవర్తన భావాన్ని సహజమైన తెలుగు పదంతో వ్యక్తం చేస్తుంది; హోషేయా ఉల్లేఖనంలోని నైతిక, నిబంధనాత్మక ప్రతిధ్వనులను అనవసరంగా విస్తరించదు.
- source_word: θέλω
  choice: నేను కోరేది
  rationale: దైవిక సంకల్పం లేదా అభిలాషను గౌరవప్రదమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: θυσίαν
  choice: బలి
  rationale: ప్రవచన ఉల్లేఖనంలోని ఏకవచన θυσίανకు నేరమైన, సాంప్రదాయిక తెలుగు సమానార్థకం.
- source_word: ἦλθον
  choice: నేను ... రాలేదు ... వచ్చాను
  rationale: యేసు తన కార్యోద్దేశాన్ని గురించి చెప్పే సాధారణ భూతకాల భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; రెండవ భాగంలోని ‘వచ్చాను’ గ్రీకులో అధ్యాహారంగా ఉన్న భావాన్ని స్పష్టం చేస్తుంది.
- source_word: καλέσαι
  choice: పిలవడానికి
  rationale: ఆహ్వానం, పిలుపు, సమన్లు అనే సాధ్యమైన భావవ్యాప్తిని అనవసరంగా కుదించకుండా ఉంచుతుంది.
- source_word: δικαίους
  choice: నీతిమంతులను
  rationale: నామవాచకంగా వాడిన విశేషణాన్ని అదే వర్గార్థంతో అనువదిస్తుంది; నిజంగా నీతిమంతులా, తమను తాము అలా భావించేవారా అనే ప్రశ్నను ప్రధాన పాఠ్యంలో పరిష్కరించదు.
- source_word: ἁμαρτωλούς
  choice: పాపులను
  rationale: పదంలోని నైతిక వర్గార్థాన్ని, ‘నీతిమంతులు’తో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: హోషేయా 6:6 ఉల్లేఖనం మరియు బలి పట్ల దాని వైఖరి
  choice: ‘నేను కోరేది కనికరాన్నే, బలిని కాదు’ అని ప్రవచనాత్మక వ్యత్యాసాన్ని యథాతథంగా నిలుపడం.
  alternative: దేవుడు అన్ని బలులనూ సంపూర్ణంగా తిరస్కరిస్తున్నాడని విస్తరించి చెప్పడం, లేదా దీన్ని ఈ సందర్భంలోని స్వల్ప ప్రాధాన్యంగా మాత్రమే మృదువుగా మార్చడం.
  rationale: గ్రీకు పాఠ్యం కనికరం, బలి మధ్య హోషేయాలోని బలమైన వ్యత్యాసాన్ని పునరుత్పత్తి చేస్తుంది. అది ప్రతి విధమైన బలిని రద్దు చేస్తోందని గానీ, కేవలం స్వల్ప అభిరుచిని చెబుతోందని గానీ అనువాదం నిర్ణయించకూడదు.
- issue: ‘నీతిమంతులు’ ఎవరనే సూచన
  choice: గ్రీకులో ఉన్నట్లే ‘నీతిమంతులను’ అని అనువదించి, ఉద్దేశించిన వర్గాన్ని వ్యాఖ్యానంతో మార్చకుండా ఉంచడం.
  alternative: ‘తాము నీతిమంతులమని భావించేవారు’ లేదా ‘స్వనీతిపరులు’ అని ప్రధాన పాఠ్యంలో చెప్పడం.
  rationale: సందర్భం వ్యంగ్యార్థాన్ని సూచించే అవకాశం ఉన్నా, δικαίους స్వయంగా ఆ వివరణను స్పష్టంగా చెప్పదు. అందువల్ల అసలైన సందిగ్ధతను ప్రధాన పాఠ్యంలో నిలిపి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘అయితే మీరు వెళ్లి ... నేర్చుకోండి’ అనే నిర్మాణం మందలింపుతో కూడిన ఆజ్ఞను నిలుపుతుంది. లేఖన ఉల్లేఖనానికి కొద్దిగా ఉన్నతమైన గంభీరతను ఉంచినా, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలమే ఎంచుకోబడింది.
