id: MAT.9.21
reference: Matthew 9:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: te
  text: 'ఎందుకంటే ఆమె తనలో తాను ఇలా అనుకుంటూ ఉంది: “నేను ఆయన వస్త్రాన్ని తాకితే చాలు, రక్షించబడతాను[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్వస్థపడతాను,” “బాగుపడతాను.” గ్రీకులో “రక్షించబడతాను” అని ఉంది; సందర్భాన్ని బట్టి అదే క్రియ స్వస్థత పొందడాన్ని కూడా సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: అనుకుంటూ ఉంది
  rationale: అసంపూర్ణ భూతకాల రూపం కొనసాగుతున్న లేదా పదేపదే జరిగిన అంతరంగ మాటను సూచిస్తుంది; తెలుగులో ‘అనుకుంటూ ఉంది’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: చుట్టుపక్కల కథనానికి వివరణ ఇచ్చే సంబంధాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో చూపుతుంది.
- source_word: ἐν ἑαυτῇ
  choice: తనలో తాను
  rationale: అంతరంగంగా తనతో తాను చెప్పుకోవడం లేదా ఆలోచించడం అనే భావాన్ని తెలిపే సహజ తెలుగు నుడికారం.
- source_word: Ἐὰν μόνον
  choice: తాకితే చాలు
  rationale: ‘మాత్రమే’ అనే కనిష్ఠ షరతుతో కూడిన బలమైన దృష్టిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἅψωμαι
  choice: తాకితే
  rationale: ἐάνతో వచ్చిన సంభావ్యార్థక రూపం భవిష్యత్ ఫలితానికి షరతును తెలుపుతుంది; ఇక్కడ క్రియకు ‘పట్టుకోవడం’ కంటే ‘తాకడం’ సరైన అర్థం.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: ఆయన వస్త్రాన్ని
  rationale: ἱμάτιον పైవస్త్రాన్ని సూచించగలిగినా, ‘వస్త్రం’ అనవసరంగా ప్రత్యేకీకరించకుండా మూలపద పరిధిని నిలుపుతుంది.
- source_word: σωθήσομαι
  choice: రక్షించబడతాను
  rationale: σῴζω ఇక్కడ శారీరక స్వస్థతను సందర్భానుసారంగా సూచించినప్పటికీ, ‘రక్షించు’ అనే విస్తృత అర్థపరిధి, సాధ్యమైన వేదాంత ప్రతిధ్వని మూలంలో ఉన్నాయి; ప్రధాన పాఠంలో వాటిని నిలిపి, స్వస్థత భావాన్ని పాదసూచికలో తెలిపాం.
theological_decisions:
- issue: స్వస్థత సందర్భంలో σωθήσομαι అనువాదం
  choice: రక్షించబడతాను
  alternative: స్వస్థపడతాను; బాగుపడతాను
  rationale: తక్షణ సందర్భం శారీరక స్వస్థత గురించినదే. అయినా గ్రీకు పాఠం కేవలం వైద్యార్థానికే పరిమితమైన క్రియను కాక σῴζωను వాడుతుంది. ‘రక్షించబడతాను’ అని ఉంచడం మూలంలోని విస్తృత భావాన్ని, వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడుతుంది; సందర్భార్థం పాదసూచికలో స్పష్టం అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘ఆయన’ గౌరవసూచకంగా వాడబడింది; ‘తాకితే చాలు’ మూలంలోని షరతు మరియు దృష్టిని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
