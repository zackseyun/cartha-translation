id: MAT.9.12
reference: Matthew 9:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: te
  text: అయితే ఆయన అది విని, “ఆరోగ్యంగా ఉన్నవారికి[a] వైద్యుని అవసరం లేదు; కానీ అనారోగ్యంతో ఉన్నవారికి అవసరం ఉంది” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలపదానికి అక్షరార్థం “బలంగా ఉన్నవారు.” ఇక్కడ అది ఆరోగ్యంగా ఉన్నవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: ఆయన అది విని
  rationale: భూతకాల కృదంతం ప్రధాన క్రియకు ముందున్న చర్యను సూచిస్తుంది. వినబడిన విషయం ముందరి సందర్భం ద్వారా స్పష్టమవుతుంది కాబట్టి సహజమైన తెలుగులో ‘అది’ చేర్చబడింది.
- source_word: δὲ
  choice: అయితే
  rationale: δέ ఇక్కడ స్వల్ప వ్యత్యాసంతో ప్రతిస్పందనకు మార్పును సూచిస్తుంది; ‘అయితే’ ఆధునిక తెలుగులో ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἶπεν
  choice: అని చెప్పాడు
  rationale: సాధారణ వాక్కు క్రియను నేరుగా అనువదిస్తుంది; మూలంలో స్పష్టంగా లేని ‘జవాబిచ్చాడు’ అనే భావాన్ని చేర్చదు.
- source_word: οἱ ἰσχύοντες
  choice: ఆరోగ్యంగా ఉన్నవారు
  rationale: ἰσχύω ప్రాథమికంగా బలంగా ఉండడాన్ని సూచించినా, వైద్యుడు మరియు అనారోగ్యంతో ఉన్నవారు అనే ప్రత్యక్ష వైద్యసంబంధ వ్యత్యాసంలో ఆరోగ్యంగా ఉన్నవారనే సందర్భార్థం సహజమైనది. ప్రాథమిక పదార్థం పాదసూచికలో నిలుపబడింది.
- source_word: ἰατροῦ
  choice: వైద్యుని
  rationale: ἰατρόςకు నేరమైన, గౌరవప్రదమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: οἱ κακῶς ἔχοντες
  choice: అనారోగ్యంతో ఉన్నవారు
  rationale: κακῶς ἔχω అనే నుడికారం ఈ వైద్య సందర్భంలో అనారోగ్యంగా ఉండడం అనే అర్థాన్ని ఇస్తుంది.
- source_word: Οὐ χρείαν ἔχουσιν … ἀλλὰ
  choice: అవసరం లేదు; … వారికే అవసరం
  rationale: గ్రీకు వాక్యంలో రెండవ భాగంలో క్రియ భావం అధ్యాహారంగా ఉంది. తెలుగులో దానిని ‘అవసరం’ అని పునరుద్ధరించడం స్పష్టతనిస్తుంది; ‘వారికే’ వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సామెతలోని వైద్యార్థం మరియు ఆధ్యాత్మిక అన్వయం
  choice: ప్రధాన పాఠ్యంలో మాటను వైద్య రూపకంగానే ఉంచడం
  alternative: ‘పాపులకు ఆధ్యాత్మిక స్వస్థత అవసరం’ అని వివరణాత్మకంగా అనువదించడం
  rationale: సందర్భం ఈ మాటను పాపులతో యేసు సహవాసానికి అన్వయించినా, ఈ వచనంలోని గ్రీకు పదాలు వైద్యసంబంధ సామెతనే చెబుతున్నాయి. ఆధ్యాత్మిక అన్వయాన్ని అనువాదంలో చేర్చకుండా సందర్భమే తెలియజేయనివ్వడం మూలంలోని భావతీవ్రతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘వైద్యుడు’ సామెత యొక్క వైద్య రూపాన్ని నిలుపుతుంది; అనవసరమైన మతపరమైన వివరణ ప్రధాన పాఠ్యంలో చేర్చబడలేదు.
