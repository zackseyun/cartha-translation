  to: అయితే ఆయన అది విని, “ఆరోగ్యంగా ఉన్నవారికి[a] వైద్యుని అవసరం లేదు; కానీ అనారోగ్యంతో ఉన్నవారికి అవసరం ఉంది” అని చెప్పాడు.
