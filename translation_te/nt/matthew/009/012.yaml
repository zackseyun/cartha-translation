review_pass:
  verdict: revise
  source_fidelity: 'The medical contrast is accurately retained: ἰσχύοντες is appropriately rendered contextually as “ఆరోగ్యంగా ఉన్నవారు,” and κακῶς ἔχοντες as “అనారోగ్యంతో ఉన్నవారు.” “అది విని” naturally supplies the participle’s contextual object. However, “వారికే” can add an exclusive/emphatic sense (“only for them”) that is not explicitly present in the Greek contrast marked by ἀλλά.'
  naturalness: The Telugu is modern, clear, and suitably dignified. Recasting the final clause with “కానీ … అవసరం ఉంది” gives a more natural balanced proverb and avoids the potentially overemphatic dative suffix -కే.
  terminology: “వైద్యుడు” is an apt standard equivalent for ἰατρός. The footnote responsibly preserves the basic lexical sense “strong,” while correctly identifying the medical-contextual meaning. No theological interpretation is introduced.
  issues:
  - severity: low
    issue: The expression “అనారోగ్యంతో ఉన్నవారికే” may imply exclusivity.
    rationale: The Greek says “but those who are sick,” contrasting the two groups without an explicit equivalent of Telugu emphatic/exclusive -కే. “కానీ అనారోగ్యంతో ఉన్నవారికి అవసరం ఉంది” retains the contrast without strengthening it.
  revised_text: అయితే ఆయన అది విని, “ఆరోగ్యంగా ఉన్నవారికి[a] వైద్యుని అవసరం లేదు; కానీ అనారోగ్యంతో ఉన్నవారికి అవసరం ఉంది” అని చెప్పాడు.
