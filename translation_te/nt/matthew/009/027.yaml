id: MAT.9.27
reference: Matthew 9:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: te
  text: 'యేసు అక్కడినుండి వెళ్తుండగా, ఇద్దరు అంధులు ఆయనను అనుసరించారు; వారు బిగ్గరగా కేకలు వేస్తూ ఇలా అన్నారు: “దావీదు కుమారుడా,[a] మమ్మల్ని కరుణించు!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దావీదు కుమారుడు” అనేది రాజవంశీయ-మెస్సీయ బిరుదు; దావీదు వంశానికి వాగ్దానం చేయబడిన వారసునిగా ఇది యేసును గుర్తిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν τῷ Ἰησοῦ
  choice: యేసు అక్కడి నుండి వెళ్తుండగా
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలీనంగా జరుగుతున్న కదలికను సూచిస్తుంది. ఈ రూపం యేసు ఆ స్థలం నుండి ముందుకు వెళ్తున్న కథన ప్రవాహాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἠκολούθησαν αὐτῷ
  choice: ఆయనను వెంబడిస్తూ
  rationale: ఇక్కడ ἀκολουθέω భౌతికంగా వెనుక వెళ్లడాన్ని సూచిస్తుంది. ప్రధాన క్రియతో పాటు కొనసాగుతున్న వారి మొరను సహజంగా కలపడానికి తెలుగు కృదంత రూపం వాడబడింది.
- source_word: δύο τυφλοὶ
  choice: ఇద్దరు గుడ్డివారు
  rationale: పుంలింగ బహువచన విశేషణంలో అంతర్లీనంగా ఉన్న మనుషులను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో సాధారణంగా అర్థమయ్యే పదబంధం.
- source_word: κράζοντες καὶ λέγοντες
  choice: అని బిగ్గరగా కేకలు వేశారు
  rationale: κράζωలోని గట్టిగా, అత్యవసరంగా మొరపెట్టుకునే భావాన్ని ‘బిగ్గరగా కేకలు వేశారు’ తెలియజేస్తుంది. λέγοντες యొక్క మాటను ప్రత్యక్ష ఉల్లేఖనంతో సహజ తెలుగు వాక్య నిర్మాణంలో కలిపింది.
- source_word: Ἐλέησον ἡμᾶς
  choice: మమ్మల్ని కరుణించు
  rationale: కరుణతో చర్య తీసుకోవాలనే ప్రత్యక్ష ఏకవచన ఆజ్ఞార్థక విజ్ఞప్తిని సంక్షిప్తంగా, గౌరవభరితంగా వ్యక్తం చేస్తుంది.
- source_word: υἱὲ Δαυίδ
  choice: దావీదు కుమారుడా
  rationale: గ్రీకులోని ప్రత్యక్ష సంబోధనను నిలుపుతూ, మత్తయి సువార్తలోని రాజవంశీయ-మెస్సీయ బిరుదును వివరణాత్మక పదాలు చేర్చకుండా యథాతథంగా కాపాడుతుంది.
theological_decisions:
- issue: ‘దావీదు కుమారుడు’ అనే బిరుదు యొక్క మెస్సీయ ప్రాముఖ్యత
  choice: ప్రధాన పాఠ్యంలో ‘దావీదు కుమారుడా’ అనే సాంప్రదాయ బిరుదును నిలుపడం
  alternative: ‘దావీదు వంశంలో వచ్చిన మెస్సీయా’ అని వివరణాత్మకంగా అనువదించడం
  rationale: మూల గ్రీకు వివరణను జోడించకుండా బిరుదునే ఉపయోగిస్తుంది. కాబట్టి ప్రధాన పాఠ్యం ఆ బిరుదును నిలుపుతుంది; దాని రాజవంశీయ-మెస్సీయ భావాన్ని పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన కథన శైలి. మొరలోని అత్యవసరతను ‘బిగ్గరగా కేకలు వేశారు’ ద్వారా, మెస్సీయ బిరుదును సంప్రదాయ సంబోధన రూపంలో నిలిపాం.
