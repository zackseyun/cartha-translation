review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves τότε (‘అప్పుడు’), the historical present λέγει (‘అంటాడు’), the explicit possessive in τοῖς μαθηταῖς αὐτοῦ, and the harvest/worker contrast. However, ‘శిష్యులతో ఇలా అంటాడు’ shifts the addressee construction from ‘says to his disciples’ toward ‘says with his disciples’; ‘తన శిష్యులతో అంటాడు’ can also be understood as ‘speaks together with his disciples.’
  naturalness: ‘తన శిష్యులతో ఇలా అంటాడు’ is understandable, but ‘తన శిష్యులతో ఇలా చెప్పాడు/అంటాడు’ is less precise in Telugu for direct address. ‘తన శిష్యులతో ఇలా అన్నాడు’ is natural but loses the historical present. ‘తన శిష్యులతో ఇలా అంటాడు’ remains potentially ambiguous. ‘తన శిష్యులతో ఇలా చెబుతాడు’ has the same issue. The most idiomatic unambiguous rendering is ‘తన శిష్యులతో ఇలా అన్నాడు,’ but this does not preserve the narrative present. A safer present-tense construction is ‘తన శిష్యులకు ఇలా అంటాడు.’
  terminology: ‘కోత’ suitably retains θερισμός and its agricultural metaphor. ‘విస్తారంగా ఉంది’ is semantically possible but somewhat less idiomatic with ‘కోత’; ‘సమృద్ధిగా ఉంది’ or ‘ఎక్కువగా ఉంది’ is more natural. ‘పనివారు’ adequately renders ἐργάται, though ‘కోత పనివారు’ could over-specify what the metaphor itself leaves implicit. No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: Addressee construction
    rationale: Greek τοῖς μαθηταῖς αὐτοῦ marks indirect object (‘to his disciples’). Telugu ‘తన శిష్యులతో’ normally means ‘with his disciples’ and may imply joint action rather than directed speech. Use ‘తన శిష్యులకు’ to preserve the source relation unambiguously.
  - severity: low
    issue: Collocation with ‘కోత’
    rationale: ‘కోత విస్తారంగా ఉంది’ is intelligible, but ‘కోత సమృద్ధిగా ఉంది’ is a more idiomatic modern Telugu expression for an abundant harvest while preserving πολύς.
  revised_text: 'అప్పుడు ఆయన తన శిష్యులకు ఇలా అంటాడు[a]: “కోత సమృద్ధిగా ఉంది, కాని పనివారు కొద్దిమందే ఉన్నారు.”'
