  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: te
  text: 'అప్పుడు ఆయన తన శిష్యులకు ఇలా అంటాడు[a]: “కోత సమృద్ధిగా ఉంది, కాని పనివారు కొద్దిమందే ఉన్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకులో ఇక్కడ కథన వర్తమాన కాలం ఉంది: “అంటాడు.” సందర్భానుసారంగా దీనిని “అన్నాడు” అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథన క్రమంలో తదుపరి సందర్భాన్ని సహజంగా సూచించే సంక్షిప్త తెలుగు సమానార్థకం.
- source_word: λέγει
  choice: అంటాడు
  rationale: గ్రీకు మూలంలోని కథన వర్తమాన కాలాన్ని నిలుపుతూ, వాక్యానికి ఉన్న సజీవతను తెలుగులో కూడా వ్యక్తం చేస్తుంది.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: తన శిష్యులతో
  rationale: αὐτοῦలోని స్వామ్య భావాన్ని ‘తన’ ద్వారా స్పష్టంగా నిలుపుతుంది; λέγειతో తెలుగు వాడుకలో ‘శిష్యులతో’ సహజంగా ఉంటుంది.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: '... కాని ...'
  rationale: μέν...δέ నిర్మాణంలోని ప్రధాన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: θερισμός
  choice: కోత
  rationale: వ్యవసాయ రూపకాన్ని వివరణగా మార్చకుండా నేరుగా నిలుపుతుంది.
- source_word: πολύς
  choice: విస్తారంగా ఉంది
  rationale: కోత పరిమాణం గొప్పదని తెలిపే భావాన్ని గౌరవప్రదమైన, స్పష్టమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐργάται
  choice: పనివారు
  rationale: పంట కోతలో శ్రమించేవారిని సూచించే సాధారణ, ఆధునిక, లింగనిరపేక్ష పదం.
- source_word: ὀλίγοι
  choice: కొద్దిమందే ఉన్నారు
  rationale: కోత విస్తారతకు వ్యతిరేకంగా పనివారి తక్కువ సంఖ్యను ‘ఏ’ నొక్కుతో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: కోత రూపకంలోని సూచన
  choice: వ్యవసాయ రూపకాన్ని అనువాదంలో యథాతథంగా ఉంచడం
  alternative: కోత అనేది పరిచర్యకు సిద్ధంగా ఉన్న ప్రజలను సూచిస్తుందని వాక్యంలోనే వివరించడం
  rationale: ఈ వచనం రూపకాన్ని మాత్రమే చెబుతుంది; దాని సూచనను ప్రధాన పాఠ్యంలో విప్పి చెప్పడం మూలంలో లేని వ్యాఖ్యానాన్ని చేర్చినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలి. మూలంలోని కథన వర్తమాన కాలం మరియు వ్యవసాయ రూపకం రెండూ నిలుపబడ్డాయి.
