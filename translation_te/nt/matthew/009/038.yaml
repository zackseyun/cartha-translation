  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: te
  text: కాబట్టి తన పంటలోకి పనివారిని పంపించమని పంట యజమానిని వేడుకోండి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బయటకు నెట్టివేసి పంపమని’ అని కూడా అనువదించవచ్చు; గ్రీకు క్రియ సాధారణ ‘పంపడం’ కంటే బలమైనది. అయితే ఇక్కడ పంటలో పని చేయడానికి పనివారిని పంపడాన్నే సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: వేడుకోండి
  rationale: ఈ ఆజ్ఞ ప్రార్థనాపూర్వకంగా, తీవ్రంగా అభ్యర్థించడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వేడుకోండి’ ఆ ఆర్తిని సహజంగా తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి వాక్యంలో పంట విస్తారంగా ఉండి పనివారు కొద్దిమందే ఉన్నారనే మాటనుంచి వచ్చే నిర్ధారణను స్పష్టంగా కలుపుతుంది.
- source_word: τοῦ κυρίου τοῦ θερισμοῦ
  choice: పంట యజమానిని
  rationale: κύριος ఇక్కడ పంటపై అధికారం కలిగినవానిని సూచిస్తుంది. తెలుగులో ‘పంట యజమాని’ సహజమైన రూపం; దేవుడు, తండ్రి లేదా యేసు అని వాక్యం చెప్పని గుర్తింపును ఇందులో చేర్చలేదు.
- source_word: ὅπως
  choice: …మని
  rationale: వేడుకోబడుతున్న విషయాన్ని తెలుగులో సహజంగా పరిచయం చేసే నిర్మాణం.
- source_word: ἐκβάλῃ
  choice: పంపించమని
  rationale: సందర్భంలో పనివారిని పంటలోకి నియోగించి పంపడం భావం. గ్రీకు క్రియలో సాధారణ ‘పంపు’ కంటే బలమైన ఛాయ ఉన్నందున దానిని పాదసూచికలో తెలిపాం.
- source_word: ἐργάτας
  choice: పనివారిని
  rationale: పంట పనిలో పాల్గొనేవారిని సూచించే, సాధారణ ఆధునిక తెలుగు పదం.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: తన పంటలోకి
  rationale: εἰς సూచించే లోనికి కదలికను, αὐτοῦ సూచించే స్వామ్యాన్ని నిలుపుతుంది; మూలంలో లేని ‘పొలం’ అనే పదాన్ని చేర్చదు.
theological_decisions:
- issue: ‘పంట యజమాని’ ఎవరు?
  choice: వాక్యంలో ఉన్నట్లే ‘పంట యజమాని’ అని అనిర్దిష్టంగా ఉంచడం.
  alternative: తండ్రి అని లేదా యేసు అని ప్రత్యేకంగా గుర్తించడం.
  rationale: ఈ వాక్యం ఆ బిరుదు ఎవరిని సూచిస్తుందో ప్రత్యేకంగా చెప్పదు. ఒక నిర్దిష్ట గుర్తింపును అనువాదంలో చేర్చకుండా మూలంలోని భావపరమైన విస్తృతిని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. వ్యవసాయ రూపకాన్ని యథాతథంగా ఉంచి, అనవసరమైన వివరణాత్మక పదాలను ప్రధాన పాఠ్యంలో చేర్చలేదు.
