  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. మూలంలోని బహువచన ‘జనసమూహాలు,’ ‘భయం,’ ‘అధికారం,’ ‘మనుషులకు’ అనే కీలక భావాలను నిలిపాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలకు సరిపోతాయి.
