id: MAT.9.8
reference: Matthew 9:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: te
  text: జనసమూహాలు అది చూసినప్పుడు భయపడి[a], మనుషులకు[b] ఇలాంటి అధికారం ఇచ్చిన దేవుణ్ణి మహిమపరిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విస్మయభయంతో నిండిపోయి.” గ్రీకు క్రియకు మరింత అక్షరార్థంగా “భయపడ్డారు” అని అర్థం; ఇక్కడ ఆ భయంలో భక్తిపూర్వక విస్మయం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రజలకు” లేదా “మానవులకు.” గ్రీకులో “మనుషులకు”; ఇది సాధారణంగా మానవులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: అది చూసినప్పుడు
  rationale: ὁράω యొక్క భూతకాల కృదంతాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా అనువదించాం. సందర్భంలో సూచితమైన స్వస్థత/పాపక్షమాపణ సంఘటనను ‘అది’ సూచిస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ కథనంలోని మలుపును సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘చూసినప్పుడు’ అనే మార్పే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘అయితే’ చేరిస్తే అవసరానికి మించిన వ్యతిరేక భావం కలగవచ్చు.
- source_word: οἱ ὄχλοι
  choice: జనసమూహాలు
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉండే పదాన్ని ఎంచుకున్నాం.
- source_word: ἐφοβήθησαν
  choice: భయపడి
  rationale: φοβέομαι యొక్క ప్రత్యక్ష అర్థమైన భయాన్ని నిలిపాం. సందర్భంలో భక్తిపూర్వక విస్మయం కూడా ఉండవచ్చనే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐδόξασαν
  choice: మహిమపరిచారు
  rationale: δοξάζω యొక్క ధార్మిక ప్రాధాన్యాన్ని, పదసంబంధ స్థిరత్వాన్ని కాపాడే సహజ తెలుగు రూపం.
- source_word: τὸν θεὸν
  choice: దేవుణ్ణి
  rationale: ἐδόξασαν క్రియకు ప్రత్యక్ష కర్మగా ఉన్న పదానికి ప్రామాణిక తెలుగు అనువాదం.
- source_word: τὸν δόντα
  choice: ఇచ్చిన
  rationale: దేవుణ్ణి విశేషించే గ్రీకు కృదంతాన్ని తెలుగులో సహజమైన సంబంధార్థక కృదంతంగా అందించాం; ఇవ్వడం జనసమూహాల స్పందనకు ముందే జరిగినదని సందర్భం తెలియజేస్తుంది.
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: ἐξουσία కేవలం శక్తిని కాక హక్కు లేదా అధికారాన్ని సూచిస్తుంది; పాపాలను క్షమించే యేసు అధికారమనే సందర్భానికి ఇది తగినది.
- source_word: τοιαύτην
  choice: ఇలాంటి
  rationale: అప్పుడే వారు చూసిన విధమైన అధికారాన్ని సూచించే τοιαύτην భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοῖς ἀνθρώποις
  choice: మనుషులకు
  rationale: ἄνθρωποι ఇక్కడ మానవులను సాధారణంగా సూచించగలదు. తెలుగు ‘మనుషులు’ మూలంలోని మానవ వర్గ సూచనను సహజంగా నిలుపుతుంది; యేసులో కనిపించిన అధికారాన్ని జనసమూహాలు ‘మనుషులకు’ ఇచ్చినదిగా వర్ణించే కథన ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచాం.
theological_decisions:
- issue: జనసమూహాల స్పందనను భయమా, భక్తిపూర్వక విస్మయమా అని అనువదించడం
  choice: భయపడి
  alternative: విస్మయభయంతో నిండిపోయి
  rationale: గ్రీకు క్రియకు ప్రాథమిక అర్థం ‘భయపడడం.’ సందర్భంలో భక్తిపూర్వక విస్మయం కలిసివుండవచ్చు గాని, ప్రధాన పాఠంలో దాన్ని మాత్రమే ఎంచుకుని భావోద్వేగ ఉద్వేగాన్ని తగ్గించలేదు.
- issue: τοῖς ἀνθρώποις ఎవరిని సూచిస్తుంది
  choice: మనుషులకు
  alternative: మానవులకు / ప్రజలకు
  rationale: గ్రీకు బహువచనం మానవులను సమష్టిగా సూచించగలదు. దీనిని యేసుకు మాత్రమే పరిమితం చేయక, జనసమూహాలు పలికిన విస్తృత రూపాన్నే నిలిపాం; అదే సమయంలో ఇది ప్రతి మనిషికి సమాన అధికారం ఇచ్చిందనే సిద్ధాంతార్థాన్ని అనువాదంలో చేర్చలేదు.
