id: MAT.9.23
reference: Matthew 9:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: te
  text: యేసు ఆ అధికారి[a] ఇంటికి వచ్చి, పిల్లనగ్రోవులు వాయించేవారినీ[b], గోల చేస్తున్న[c] జనసమూహాన్నీ చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పాలకుడు’; సమాంతర వృత్తాంతాలతో పోలిస్తే, ‘సమాజమందిరపు అధికారి.’ అయితే మత్తయి ఇక్కడ సాధారణంగా ‘అధికారి’ అని మాత్రమే అంటాడు.
    reason: alternative_reading
  - marker: b
    text: అంటే, అంత్యక్రియల సందర్భంలో ఆచారం ప్రకారం పిల్లనగ్రోవులు వాయించేవారితో సహా వృత్తిపరమైన విలాపకులు అప్పటికే అక్కడ ఉన్నారు.
    reason: cultural_note
  - marker: c
    text: లేదా ‘కలకలంలో ఉన్న.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: వచ్చి
  rationale: భూతకాల అసమాపక క్రియగా ప్రధాన క్రియకు ముందున్న సంఘటనను సహజమైన తెలుగు కథనశైలిలో తెలియజేస్తుంది.
- source_word: οἰκίαν
  choice: ఇంటికి
  rationale: ఇక్కడ οἰκία సాధారణంగా నివాస గృహాన్ని సూచిస్తుంది; ‘ఇల్లు’ యొక్క విభక్తి రూపమైన ‘ఇంటికి’ సహజంగా ఉంది.
- source_word: ἄρχοντος
  choice: అధికారి
  rationale: ἄρχων అనే విస్తృత పదాన్ని సమాజంలో అధికార స్థానంలో ఉన్న వ్యక్తిగా తెలియజేస్తుంది; సమాంతర వృత్తాంతాల ఆధారంగా ‘సమాజమందిరపు అధికారి’ అని ప్రత్యేకీకరించదు.
- source_word: ἰδὼν
  choice: చూశాడు
  rationale: సాధారణ కథన సందర్భంలో ప్రత్యక్షంగా చూడడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: αὐλητὰς
  choice: పిల్లనగ్రోవులు వాయించేవారిని
  rationale: αὐλός వాయిద్యకారులను ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా సూచిస్తుంది; అంత్యక్రియల సందర్భాన్ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చదు.
- source_word: ὄχλον
  choice: జనసమూహాన్ని
  rationale: ὄχλοςకు గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ప్రామాణిక తెలుగు సమానార్థకం.
- source_word: θορυβούμενον
  choice: గోల చేస్తున్న
  rationale: శబ్దంతో కూడిన కలకలం చేస్తున్న స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది; దుఃఖభావాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: ఇంటి యజమాని/నివాసి గుర్తింపు
  choice: అధికారి
  alternative: పాలకుడు; సమాజమందిరపు అధికారి
  rationale: మత్తయి ఇక్కడ ἄρχων అనే సాధారణ పదమే వాడాడు. సమాంతర వృత్తాంతాల సమాచారాన్ని ప్రధాన పాఠ్యంలోకి తీసుకురాకుండా మూలంలోని విస్తృత సూచనను నిలుపుకుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన కథన వాక్య నిర్మాణం వాడబడింది. ‘అధికారి’ మూలంలోని విస్తృతతను కాపాడుతుంది; సాంస్కృతిక నేపథ్యాన్ని ప్రధాన పాఠ్యంలో కలపకుండా పాదసూచికలో ఇచ్చాం.
