review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the rhetorical negative question, the temporal contrast, the bridegroom image, the passive force of ἀπαρθῇ, and the future fasting. However, “పెండ్లివారి సహచరులు” can mean attendants of the wedding party generally and does not clearly identify the idiom’s referents as the bridegroom’s companions.
  naturalness: The Telugu is generally modern and fluent. Replacing the ambiguous possessive phrase with “పెండ్లికుమారుని సహచరులు” is clearer and more idiomatic in this context. “వారి దగ్గరనుంచి” is understandable, though “వారినుండి” is more compact and standard in the revised sentence.
  terminology: “పెండ్లికుమారుడు,” “దుఃఖించగలరా,” and “ఉపవాసం ఉంటారు” are suitable. The footnote should clarify that the literal idiom refers to those associated with the bridegroom/wedding celebration, without asserting a narrower social role than the Greek requires.
  issues:
