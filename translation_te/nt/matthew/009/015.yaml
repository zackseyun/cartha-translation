    rationale: υἱοὶ τοῦ νυμφῶνος is an idiom for those belonging to the wedding celebration, particularly the bridegroom’s companions. “పెండ్లివారు” can be heard as the wedding party or even the marrying couple/families, obscuring the relationship signaled by the source idiom.
