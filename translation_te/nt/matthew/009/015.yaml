id: MAT.9.15
reference: Matthew 9:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: te
  text: 'యేసు వారితో ఇలా అన్నాడు: “పెండ్లికుమారుడు తమతో ఉన్నంతకాలం పెండ్లికుమారుని సహచరులు[a] దుఃఖించగలరా? అయితే పెండ్లికుమారుడు వారినుండి తీసివేయబడే[b] రోజులు వస్తాయి; అప్పుడు వారు ఉపవాసం ఉంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “పెండ్లి గది కుమారులు”; ఇది పెండ్లికుమారునితో మరియు పెండ్లి వేడుకతో సంబంధమున్నవారిని సూచించే నుడికారం.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వారినుండి తొలగించబడే.” కర్మణి ప్రయోగం సాధారణంగా వెళ్లిపోవడం కంటే బలవంతపు తొలగింపును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: పెండ్లివారి సహచరులు
  rationale: అక్షరార్థంగా ‘పెండ్లి గది కుమారులు’ అనే సెమిటిక్ నుడికారం. ఆధునిక తెలుగు పాఠకులకు అర్థమయ్యేలా, పెండ్లికుమారునితో కలిసి వేడుకలో పాలుపంచుకునే సహచరులను సూచించే సహజమైన రూపాన్ని ఎంచుకున్నాం.
- source_word: πενθεῖν
  choice: దుఃఖించగలరా
  rationale: మరణం లేదా వియోగ సందర్భంలోని శోకాన్ని సూచించే క్రియ; ఉపవాసంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది. μή ఉన్న ప్రశ్న ఆశించే ప్రతికూల సమాధానాన్ని తెలుగులో సహజమైన అలంకారిక ప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: ἐφ’ ὅσον
  choice: ఉన్నంతకాలం
  rationale: కాలవ్యాప్తిని స్పష్టంగా, సహజంగా తెలిపే తెలుగు ప్రయోగం.
- source_word: νυμφίος
  choice: పెండ్లికుమారుడు
  rationale: వివాహ రూపకాన్ని, దాని సంభావ్య ధార్మిక ప్రతిధ్వనిని వివరణతో విస్తరించకుండా నిలుపుతుంది.
- source_word: ἀπαρθῇ
  choice: తీసివేయబడే
  rationale: సాధారణంగా వెళ్లిపోవడం కంటే వేరొకరి చర్యవల్ల తొలగింపబడే భావాన్ని గ్రీకు కర్మణి రూపానికి అనుగుణంగా నిలుపుతుంది.
- source_word: νηστεύσουσιν
  choice: ఉపవాసం ఉంటారు
  rationale: భవిష్యత్ క్రియను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: అయితే ... రోజులు వస్తాయి
  rationale: δέ లోని స్వల్ప వ్యత్యాసాన్ని ‘అయితే’తో, భవిష్యత్ కాల నుడికారాన్ని ‘రోజులు వస్తాయి’తో నిలుపుతుంది.
theological_decisions:
- issue: పెండ్లికుమారుని రూపకంలోని సంభావ్య క్రీస్తుసంబంధ అర్థం
  choice: ‘పెండ్లికుమారుడు’ అనే రూపకాన్ని అలాగే ఉంచడం
  alternative: యేసే మెస్సీయయైన పెండ్లికుమారుడు అని అనువాదంలోనే వివరణాత్మకంగా చేర్చడం
  rationale: వచనం స్వయంగా రూపకాన్ని ఉపయోగిస్తుంది; దాని ధార్మిక ప్రాముఖ్యతను పాఠకుడు గ్రహించగలడు. అయితే అనువాదం మూలపాఠానికి మించిన గుర్తింపును స్పష్టంగా చేర్చకూడదు.
- issue: ἀπαρθῇ సూచించే తొలగింపు స్వభావం
  choice: ‘తీసివేయబడే’ అనే కర్మణి రూపాన్ని నిలుపడం
  alternative: ‘వెళ్లిపోయే’ అని సాధారణ వియోగంగా అనువదించడం
  rationale: గ్రీకు పదం సాధారణ నిష్క్రమణకన్నా తొలగింపబడటాన్ని సూచించవచ్చు; ఇది యేసు మరణాన్ని ముందుగా సూచించే అవకాశాన్ని వివరణాత్మకంగా ఖరారు చేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా వివాహ రూపకానికి తగిన గౌరవప్రదమైన శైలిని నిలిపాం. ‘పెండ్లి’ రూపం సాహిత్య-బైబిలు వినియోగంలో సహజంగా ఉండి, ‘వివాహం’ కంటే రూపక సంయోగాల్లో సులభంగా ప్రవహిస్తుంది.
