id: MAT.9.9
reference: Matthew 9:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: te
  text: యేసు అక్కడి నుండి వెళ్తుండగా, పన్ను వసూలు చేసే స్థలంలో కూర్చున్న మత్తయి అనే ఒక మనిషిని చూశాడు. ఆయన అతనితో, “నన్ను అనుసరించు” అని అన్నాడు.[a] అతడు లేచి ఆయనను అనుసరించాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ఇక్కడ “అంటాడు” అనే వర్తమానకాల రూపం ఉంది; కథనానికి సజీవతను ఇవ్వడానికి దాన్ని ఉపయోగించారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అతడు లేచి, ఆయనను అనుసరించాడు.” గ్రీకులో ‘లేచి’ అనే పదం ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων … ἐκεῖθεν
  choice: అక్కడి నుండి వెళ్తూ
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న కదలికను, ἐκεῖθεν సూచించే బయలుదేరిన స్థలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἄνθρωπον
  choice: ఒక మనిషిని
  rationale: ఇక్కడ నిర్దిష్టమైన పురుషుణ్ని సూచిస్తున్నప్పటికీ, మూలంలోని సాధారణ నామవాచకానికి నేరుగా సరిపోతూ మత్తయిని పరిచయం చేస్తుంది.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: సుంకం వసూలు చేసే చోట కూర్చున్న
  rationale: τελώνιον అనేది సుంకం లేదా పన్ను వసూలు చేసే స్థలాన్ని సూచిస్తుంది. ఆధునిక పాఠకులకు స్పష్టంగా ఉండేందుకు సంస్థాగత భావం గల ‘కార్యాలయం’ కంటే ఈ వివరణాత్మక రూపం ఎంచుకోబడింది.
- source_word: Μαθθαῖον λεγόμενον
  choice: మత్తయి అనే
  rationale: అతడు ఏ పేరుతో పిలువబడుతున్నాడో సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λέγει αὐτῷ
  choice: ఆయన అతనితో … అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగు కథనంలో సహజమైన భూతకాలంతో అందించాం; మూలంలోని వర్తమాన రూపాన్ని పాదసూచికలో తెలియజేశాం.
- source_word: Ἀκολούθει μοι
  choice: నన్ను వెంబడించు
  rationale: యేసుతో కలిసి నడవడం, ఆయన శిష్యుడిగా అనుసరించడం అనే రెండు భావసంభావ్యతలను అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: ἀναστὰς
  choice: లేచి
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన తక్షణ ప్రతిస్పందనను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἠκολούθησεν αὐτῷ
  choice: యేసును వెంబడించాడు
  rationale: తెలుగులో వరుసగా వచ్చే సర్వనామాల వల్ల కలిగే అయోమయాన్ని నివారించేందుకు αὐτῷ యొక్క స్పష్టమైన సూచ్యుడైన యేసు పేరును వాడాం; అనుసరించడం అనే ప్రత్యక్ష చర్యతో పాటు శిష్యత్వ సూచనను కూడా నిలుపుతుంది.
theological_decisions:
- issue: మత్తయికి యేసు ఇచ్చిన పిలుపు స్వరూపం
  choice: ‘నన్ను వెంబడించు’ అని సరళంగా అనువదించడం
  alternative: ‘నా శిష్యుడివి అవు’ లేదా ‘నాతో చేరి రా’
  rationale: ఈ సందర్భం శిష్యత్వపు పిలుపును సూచించినా, మూలపాఠం చెప్పినదానికంటే ఎక్కువగా సాంకేతిక లేదా వివరణాత్మక పదాలను చేర్చకుండా ఆ భావాన్ని ఆజ్ఞలోనే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. యేసును సూచించేటప్పుడు గౌరవార్థక ‘ఆయన’ను, మత్తయిని సూచించేటప్పుడు ‘అతడు/అతనితో’ను వాడాం. చివరి వాక్యంలో సర్వనామ సూచన స్పష్టత కోసం ‘యేసును’ అని పేరును పునరుక్తి చేశాం.
