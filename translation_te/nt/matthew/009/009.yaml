revisions:
- from: యేసు అక్కడి నుండి వెళ్తూ, సుంకం వసూలు చేసే చోట కూర్చున్న మత్తయి అనే ఒక మనిషిని చూశాడు. ఆయన అతనితో, “నన్ను వెంబడించు” అని అన్నాడు.[a] అతడు లేచి యేసును వెంబడించాడు.[b]
