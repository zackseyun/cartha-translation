translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘మాసిక’ వస్త్రానికి వేసే patch అనే అర్థంలో ఖచ్చితమైన తెలుగు పదం; అపరిచితమయ్యే అవకాశాన్ని పరిసరంలోని ‘బట్టతో చేసిన’ అనే పదబంధం తగ్గిస్తుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
