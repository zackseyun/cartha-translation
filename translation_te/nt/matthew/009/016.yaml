id: MAT.9.16
reference: Matthew 9:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: te
  text: అయితే, ఇంకా కుదించని బట్టతో చేసిన అతుకును పాత వస్త్రానికి ఎవరూ వేయరు.[a] ఎందుకంటే ఆ అతుకు పాత వస్త్రం నుండి లాగిపోతుంది; అప్పుడు చిరుగు మరింత పెద్దదవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇంకా దట్టపరచని బట్టతో చేసిన అతుకును.” గ్రీకు పదం ఇంకా పూర్తి ప్రక్రియకు లోనుకాని బట్టను సూచిస్తుంది; అది తరువాత కుదిగి పాత వస్త్రంపై ఒత్తిడి కలిగించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: అయితే ... ఎవరూ
  rationale: δὲ సూచించే స్వల్ప వ్యత్యాసం/మార్పును ‘అయితే’ తెలియజేస్తుంది; οὐδεὶς యొక్క సార్వత్రిక నిషేధార్థాన్ని ‘ఎవరూ’ సహజంగా అందిస్తుంది.
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: మాసికను ... వేయరు
  rationale: ἐπιβάλλει అక్షరార్థంగా ‘పై ఉంచు/అమర్చు’; కుట్టడం సందర్భంలో సూచితమైనా క్రియలో స్పష్టంగా లేదు. ‘మాసికను వేయడం’ ఆధునిక తెలుగులో సహజమైన ప్రయోగం.
- source_word: ῥάκους ἀγνάφου
  choice: ముడి బట్టతో చేసిన
  rationale: ἄγναφος ఇంకా నూలుబట్టను దట్టపరిచే/కుదించే ప్రక్రియకు లోనుకాని వస్త్రాన్ని సూచిస్తుంది. ‘ముడి బట్ట’ సాధారణ పాఠకునికి దాని ప్రాయోగిక భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; సూక్ష్మార్థం పాదసూచికలో ఉంచబడింది.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: పాత వస్త్రానికి
  rationale: ἱμάτιον ఇక్కడ సాధారణ వస్త్రాన్ని సూచిస్తుంది; ‘వస్త్రం’ గౌరవప్రదమైన, విస్తృతార్థక తెలుగు పదం.
- source_word: αἴρει ... ἀπὸ τοῦ ἱματίου
  choice: వస్త్రాన్ని లాగివేస్తుంది
  rationale: ఈ సందర్భంలో αἴρει వేరుచేసే లాగుడును సూచిస్తుంది. ‘లాగివేస్తుంది’ ఆ చర్యను తెలియజేస్తూ, గ్రీకు క్రియలో లేని కుట్టు విధానాన్ని అదనంగా చేర్చదు.
- source_word: τὸ πλήρωμα αὐτοῦ
  choice: ఆ మాసిక
  rationale: అక్షరార్థంగా ‘దాని నింపుడు/పూరక భాగం’; ఈ దృష్టాంతంలో అది వస్త్రంలోని చినుగును నింపే మాసికనే సూచిస్తుంది. స్పష్టత కోసం సూచ్యార్థాన్ని పునరుక్తి చేశాం.
- source_word: χεῖρον σχίσμα γίνεται
  choice: చినుగు ఇంకా పెద్దదవుతుంది
  rationale: χείρον తులనాత్మకమైన ‘మరింత చెడు’ భావాన్ని, σχίσμα చీలిక/చినుగును సూచిస్తాయి. తెలుగు వస్త్ర సందర్భంలో ‘చినుగు ఇంకా పెద్దదవుతుంది’ సహజంగా ఫలితాన్ని వ్యక్తం చేస్తుంది.
