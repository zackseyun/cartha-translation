- from: అయితే, ముడి బట్టతో చేసిన మాసికను పాత వస్త్రానికి ఎవరూ వేయరు.[a] ఎందుకంటే ఆ మాసిక వస్త్రాన్ని లాగివేస్తుంది; అప్పుడు చినుగు ఇంకా పెద్దదవుతుంది.
  to: అయితే, ఇంకా కుదించని బట్టతో చేసిన అతుకును పాత వస్త్రానికి ఎవరూ వేయరు.[a] ఎందుకంటే ఆ అతుకు పాత వస్త్రం నుండి లాగిపోతుంది; అప్పుడు చిరుగు మరింత పెద్దదవుతుంది.
