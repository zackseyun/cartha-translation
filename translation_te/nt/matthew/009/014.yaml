id: MAT.9.14
reference: Matthew 9:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: te
  text: అప్పుడు యోహాను శిష్యులు యేసు దగ్గరికి వచ్చి, “మేమూ పరిసయ్యులూ తరచుగా[a] ఉపవాసం ఉంటాము; కానీ నీ శిష్యులు ఎందుకు ఉపవాసం ఉండరు?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎక్కువగా’ లేదా ‘చాలాసార్లు’ అని కూడా అనువదించవచ్చు; ‘ఉపవాసం ఉండడం’తో కలిసి వచ్చిన గ్రీకు πολλά తరచుగా చేసే ఆచరణను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: తరువాతి సంఘటనను క్రమంలో పరిచయం చేసే సహజమైన కాలసూచక పదం.
- source_word: προσέρχονται αὐτῷ
  choice: యేసు దగ్గరికి వచ్చి
  rationale: προσέρχομαιలోని సమీపించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలోని సూచ్య వ్యక్తిని స్పష్టత కోసం ‘యేసు’గా పేర్కొంది.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: యోహాను శిష్యులు
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని సహజమైన తెలుగు పదక్రమంలో అందిస్తుంది.
- source_word: λέγοντες
  choice: అని అడిగారు
  rationale: వారు పలికిన మాట ప్రశ్న కావడంతో, తెలుగు కథన శైలిలో ‘అని అడిగారు’ సహజంగా ఉంటుంది.
- source_word: Διὰ τί
  choice: ఎందుకు
  rationale: కారణాన్ని ప్రశ్నించే గ్రీకు పదబంధానికి నేరమైన, సాధారణ తెలుగు సమానం.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: మేమూ పరిసయ్యులూ
  rationale: ప్రథమ పురుష బహువచనంలోని ఉద్ఘాటనను, రెండు వర్గాల జతను నిలుపుతుంది.
- source_word: νηστεύομεν
  choice: ఉపవాసం ఉంటాము
  rationale: మతపరమైన ఆహార విరమణను సూచించే ప్రామాణిక, సులభంగా అర్థమయ్యే తెలుగు ప్రయోగం.
- source_word: πολλά
  choice: తరచుగా
  rationale: νηστεύωతో క్రియావిశేషణంగా వచ్చిన πολλά ఉపవాస ఆచరణ పునరావృతిని సూచిస్తుంది; ‘తరచుగా’ ఆధునిక తెలుగులో సహజం.
- source_word: οἱ δὲ μαθηταί σου
  choice: కానీ నీ శిష్యులు
  rationale: δέ తెలిపే వ్యత్యాసాన్ని ‘కానీ’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ νηστεύουσιν
  choice: ఉపవాసం ఉండరు
  rationale: ఒకే సందర్భంలో జరుగుతున్న చర్యకన్నా సాధారణ ఆచరణ లేమిని సూచించే వర్తమాన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఉపవాసం గురించిన ప్రశ్న స్వరూపం
  choice: ఇది సాధారణ మతాచరణల మధ్య పోలికగా అనువదించబడింది.
  alternative: యేసు శిష్యులు విధిగా చేయవలసినదాన్ని నిర్లక్ష్యం చేస్తున్నారనే బలమైన నిందగా లేదా ఒకే ప్రత్యేక ఉపవాస సందర్భానికి సంబంధించిన ప్రశ్నగా అనువదించడం.
  rationale: వర్తమానకాల క్రియలతో పాటు πολλά సాధారణంగా పునరావృతమయ్యే ఆచరణను సూచిస్తున్నాయి. అనువాదం ప్రశ్నలోని ఉద్రిక్తతను నిలుపుతూ, పాఠ్యంలో లేని సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన కథన శైలి వాడబడింది. సంభాషణలో ‘నీ’ అనేది మూలంలోని ఏకవచన δεύτερο పురుష రూపాన్ని సహజంగా నిలుపుతుంది.
