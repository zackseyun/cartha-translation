id: MAT.9.6
reference: Matthew 9:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: te
  text: '“అయితే, భూమిమీద పాపాలను క్షమించే అధికారం మనుష్యకుమారునికి[a] ఉందని మీరు తెలుసుకునేలా—” అప్పుడు ఆయన పక్షవాతంతో ఉన్న వ్యక్తితో ఇలా అన్నాడు: “లేచి, నీ పడకను[b] ఎత్తుకొని నీ ఇంటికి వెళ్లు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మనుష్యకుమారుడు’ అనేది యేసు తనను గురించి ఉపయోగించిన బిరుదు. దీనిని ‘మానవ కుమారుడు’ అని కూడా అనువదించవచ్చు; ఈ బిరుదు దానియేలు 7ను ప్రతిధ్వనింపజేయవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పరుపు.’ గ్రీకు పదం మంచం, పడక లేదా నిద్రించడానికి ఉపయోగించే పరుపును సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: అయితే ... మీరు తెలుసుకునేలా
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసం లేదా మలుపును ‘అయితే’ తెలియజేస్తుంది; ἵνα యొక్క ఉద్దేశ భావాన్ని ‘తెలుసుకునేలా’ నిలుపుతుంది. గ్రీకు వాక్యంలో మాట మధ్యలో ఆగి కార్యానికి మారే నిర్మాణాన్ని డాష్‌తో భద్రపరిచాం.
- source_word: ἐξουσίαν ἔχει
  choice: అధికారం ... ఉంది
  rationale: ఇక్కడ ἐξουσία కేవలం సామర్థ్యాన్ని కాక, పాపాలను క్షమించే హక్కుతో కూడిన అధికారాన్ని సూచిస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు తనను గురించి వాడిన స్థిరమైన బిరుదును, దానియేలు 7తో ఉండగల ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిమీద
  rationale: ఈ సందర్భంలో భౌమ పరిధిని సహజంగా, సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: ἀφιέναι ἁμαρτίας
  choice: పాపాలను క్షమించే
  rationale: ఈ సందర్భంలో ἀφίημι అంటే పాపాలను క్షమించడం లేదా మన్నించడం; తెలుగులో ‘క్షమించడం’ స్పష్టమైన సాధారణ ప్రయోగం.
- source_word: τότε λέγει
  choice: అప్పుడు ఆయన ... అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథనంలో సహజమైన భూతకాలాన్ని వాడాం; τότε యొక్క క్రమసూచనను ‘అప్పుడు’ నిలుపుతుంది.
- source_word: τῷ παραλυτικῷ
  choice: పక్షవాతం వచ్చినవానితో
  rationale: విశేషణం నామవాచకంగా వాడబడింది. వ్యక్తిని వ్యాధితోనే పేరుపెట్టకుండా, ఆధునిక తెలుగులో సహజంగా అర్థమయ్యే రూపం ఎంచుకున్నాం.
- source_word: Ἐγερθεὶς
  choice: లేచి
  rationale: రూపరీత్యా భూతకృదంతమైనా, వరుస ఆజ్ఞలలో ఇది ఆజ్ఞార్థక బలంతో ఉంది; ‘లేచి’ తెలుగులో ఆ బలాన్ని సహజంగా ఇస్తుంది.
- source_word: ἆρόν
  choice: ఎత్తుకొని
  rationale: పడకను పైకెత్తి వెంట తీసుకెళ్లే చర్యను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κλίνην
  choice: పడకను
  rationale: κλίνη మంచం, పరుపు లేదా నిద్రించే పీటను సూచించగల విస్తృత పదం; ‘పడక’ నిర్దిష్ట రూపాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: ὕπαγε
  choice: వెళ్లు
  rationale: సూటిగా ఉన్న ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εἰς τὸν οἶκόν σου
  choice: నీ ఇంటికి
  rationale: οἶκος యొక్క ఇల్లు/నివాసస్థలం భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే క్రీస్తుసంబంధ బిరుదు
  choice: మనుష్యకుమారుడు
  alternative: మానవుడు / మానవ కుమారుడు
  rationale: సాంప్రదాయ బిరుదును ఉంచడం ద్వారా యేసు స్వీయసూచనను, దానియేలు 7తో ఉండగల సంబంధాన్ని వివరణాత్మకంగా కుదించకుండా భద్రపరుస్తుంది.
- issue: పాపక్షమాపణలో ἐξουσία స్వభావం
  choice: అధికారం
  alternative: శక్తి / హక్కు
  rationale: వాక్యం కేవలం అద్భుతం చేయగల సామర్థ్యాన్ని కాక, పాపాలను క్షమించే చెల్లుబాటు గల అధికారాన్ని ప్రకటిస్తుంది; ‘అధికారం’ ఈ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. గ్రీకు వాక్యంలో యేసు మాట మధ్యలో ఆగి కథకుడు చర్యను తెలిపే నిర్మాణాన్ని డాష్‌తో నిలిపాం. బిరుదు సంప్రదాయ రూపంలో ఉంచబడింది; వ్యాధిగ్రస్త వ్యక్తికి అవమానకరంగా వినిపించని సహజ పదబంధం వాడబడింది.
