translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వార్త బయలుదేరింది’ అనే కఠిన అక్షరానువాదం బదులు, మూలంలోని వార్త ముందుకు వెళ్లే భావాన్ని ‘వ్యాపించింది’తో వ్యక్తపరిచాం; γῆలోని అర్థవిస్తృతిని పాదసూచికలో నిలిపాం.
