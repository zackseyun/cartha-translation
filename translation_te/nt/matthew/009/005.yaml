- from: ఎందుకంటే, ‘నీ పాపాలు క్షమించబడ్డాయి’[a] అని చెప్పడం సులభమా? లేక ‘లేచి నడువు’ అని చెప్పడం సులభమా?
  to: ఎందుకంటే, ‘నీ పాపాలు క్షమించబడ్డాయి’[a] అని చెప్పడమా, లేక ‘లేచి నడువు’ అని చెప్పడమా—ఏది సులభం?
