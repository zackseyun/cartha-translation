id: MAT.9.5
reference: Matthew 9:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: te
  text: ఎందుకంటే, ‘నీ పాపాలు క్షమించబడ్డాయి’[a] అని చెప్పడమా, లేక ‘లేచి నడువు’ అని చెప్పడమా—ఏది సులభం?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీ పాపాలు క్షమించబడి ఉన్నాయి.’ గ్రీకు వర్తమాన కర్మణి రూపాన్ని ఫలితస్థితిని సూచించేదిగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: ఎందుకంటే, ... చెప్పడం సులభమా? లేక ... చెప్పడం సులభమా?
  rationale: τίతో కూడిన తులనాత్మక రూపం రెండు ప్రత్యామ్నాయాల్లో ఏది సులభమో అడుగుతుంది. γάρ ముందరి వాక్యంతో ఉన్న వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’ ద్వారా నిలుపుతుంది.
- source_word: εἰπεῖν
  choice: చెప్పడం
  rationale: రెండు భాగాల్లోనూ సాధారణంగా మాట పలకడాన్నే సూచిస్తుంది; ఒకే పదప్రయోగం స్పష్టతను కాపాడుతుంది.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: నీ పాపాలు క్షమించబడ్డాయి
  rationale: ἀφίενταί వర్తమాన కర్మణి రూపం; సందర్భంలో క్షమించబడిన ఫలితస్థితిని తెలుగులో సహజంగా ‘క్షమించబడ్డాయి’ అని వ్యక్తపరచవచ్చు.
- source_word: ἁμαρτίαι
  choice: పాపాలు
  rationale: ఇది సాధారణమైన, సందర్భానికి తగిన సమానార్థకం; అప్పుల రూపకాన్ని అనవసరంగా చేర్చదు.
- source_word: Ἔγειρε
  choice: లేచి
  rationale: స్వస్థపరిచే సందర్భంలో శారీరకంగా లేవమనే ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ περιπάτει
  choice: నడువు
  rationale: లేచిన తరువాత నడవమనే కొనసాగింపు ఆజ్ఞను సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: σου
  choice: నీ
  rationale: రెండవ పురుష ఏకవచన సంబోధనను తెలుగులో స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: యేసు ప్రకటించిన పాపక్షమాపణ కాలార్థం
  choice: నీ పాపాలు క్షమించబడ్డాయి
  alternative: నీ పాపాలు క్షమించబడి ఉన్నాయి
  rationale: గ్రీకు వర్తమాన కర్మణి రూపం ఫలితస్థితి భావాన్ని అనుమతిస్తుంది. ‘క్షమించబడ్డాయి’ సహజంగా ఉండి, క్షమాపణ సమయంపై పాఠ్యంలో లేని అదనపు సిద్ధాంత నిర్ధారణను రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. రెండు ప్రత్యామ్నాయాల సమాంతర నిర్మాణం స్పష్టంగా ఉంచబడింది; ఏకవచన సంబోధన ‘నీ’ ద్వారా నిలుపబడింది.
