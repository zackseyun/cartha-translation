translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; సాధారణ పాఠకులకు సహజంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు కథన శైలిని నిలబెట్టాం. గ్రీకు వాక్యంలోని రెండు καὶ పదాలను తెలుగులో సహజ కథన క్రమం కోసం వరుసగా ‘అప్పుడు’, ‘కూడా’గా వ్యక్తం చేశాం.
