  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: te
  text: యేసు లేచి అతని వెంట వెళ్లాడు; ఆయన శిష్యులు కూడా అతని వెంట వెళ్లారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: లేచి
  rationale: ఇక్కడ ఈ క్రియారూపం యేసు కూర్చున్న స్థితి నుంచి లేచి తదుపరి చర్యకు పూనుకున్నట్లు తెలియజేస్తుంది. కథన ప్రవాహంలో ‘లేచి’ సహజంగానూ సంక్షిప్తంగానూ ఉంది.
- source_word: ἠκολούθει
  choice: అతని వెంట వెళ్లాడు
  rationale: ἀκολουθέω అనే క్రియలో ఒకరి వెనుక వెళ్లడం అనే భావం ఉంది. ఈ సందర్భంలో ‘వెంట వెళ్లాడు’ సహజమైన తెలుగు; అపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న చర్యను అతిగా వ్యక్తం చేయకుండా సంఘటనను స్పష్టంగా తెలియజేస్తుంది.
- source_word: αὐτῷ
  choice: అతని
  rationale: ఈ దత్తివాచక సర్వనామం మునుపటి వచనంలోని అధికారిని సూచిస్తుంది; తెలుగులో ‘అతని వెంట’ అని సహజంగా వస్తుంది.
- source_word: μαθηταὶ
  choice: శిష్యులు
  rationale: సువార్తలలో గురువు-శిష్య సంబంధాన్ని సూచించే μαθηταί పదానికి ‘శిష్యులు’ ప్రమాణబద్ధమైన, సందర్భోచితమైన అనువాదం.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: ఆయన శిష్యులు కూడా వెళ్లారు
  rationale: గ్రీకులో రెండవ ఖండంలో క్రియ పునరుక్తి కాలేదు; తెలుగులో అర్థస్పష్టత కోసం ‘వెళ్లారు’ను పూరించాం. ‘ఆయన’ యేసును సూచిస్తుందని మర్యాదపూర్వకంగా, స్పష్టంగా తెలియజేస్తుంది.
