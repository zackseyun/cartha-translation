source:
  edition: SBLGNT
  text: ⸀ἔλεγεν· Ἀναχωρεῖτε, οὐ γὰρ ἀπέθανεν τὸ κοράσιον ἀλλὰ καθεύδει· καὶ κατεγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: te
  text: ఆయన, “వెళ్లిపోండి; ఎందుకంటే ఆ బాలిక చనిపోలేదు, కానీ నిద్రపోతోంది” అని చెబుతూ ఉన్నాడు. వారు ఆయనను ఎగతాళిగా నవ్వుతూ ఉన్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు ఆయనను ఎగతాళి చేశారు.” గ్రీకు క్రియ ఒకరిని అపహాస్యంగా చూసి నవ్వడాన్ని లేదా ఎగతాళి చేయడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: చెబుతూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపం ఆ సందర్భంలో కొనసాగుతున్న లేదా పదేపదే పలికిన మాటను సూచించగలదు; తెలుగు సహజత్వాన్ని కాపాడుతూ ఆ కాలాంశాన్ని ఈ రూపం తెలియజేస్తుంది.
- source_word: Ἀναχωρεῖτε
  choice: వెళ్లిపోండి
  rationale: బహువచన ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా, తగిన దృఢతతో వ్యక్తపరుస్తుంది.
- source_word: οὐ γὰρ ἀπέθανεν
  choice: చనిపోలేదు
  rationale: γάρ ఆజ్ఞకు కారణాన్ని ఇస్తున్నప్పటికీ, తెలుగులో రెండు వాక్యాలను వరుసగా ఉంచడం ద్వారా ఆ కారణ సంబంధం సహజంగా స్పష్టమవుతుంది. ἀπέθανεν మరణాన్ని ఒక సంఘటనగా సూచిస్తుంది.
- source_word: τὸ κοράσιον
  choice: ఆ బాలిక
  rationale: κοράσιον చిన్న వయసుగల అమ్మాయిని సూచిస్తుంది; ‘బాలిక’ గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగు పదం. ఈ వచనం చెప్పని అదనపు వయోభారాన్ని ‘చిన్న బాలిక’ ద్వారా చేర్చలేదు.
- source_word: ἀλλὰ καθεύδει
  choice: నిద్రపోతోంది
  rationale: ప్రస్తుత చర్య లేదా స్థితిని సహజంగా వ్యక్తపరుస్తూ, మరణం–నిద్ర మధ్య మూలపాఠంలోని ఉద్దేశపూర్వక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: κατεγέλων αὐτοῦ
  choice: ఆయనను చూసి ఎగతాళిగా నవ్వారు
  rationale: ఈ క్రియలో ఒకరిని చూసి అపహాస్యంగా నవ్వడం అనే భావం ఉంది. ఎంపిక చేసిన పదబంధం నవ్వు అనే మూల చిత్రాన్నీ, దానిలోని ఎగతాళినీ రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: బాలిక ‘చనిపోలేదు; నిద్రపోతోంది’ అని యేసు చెప్పడం
  choice: ‘నిద్రపోతోంది’ అనే రూపకాన్ని వివరణ జోడించకుండా యథాతథంగా నిలుపడం
  alternative: ‘కేవలం నిద్రపోతోంది’ అని అనువదించడం లేదా ‘నిద్ర’ మరణానికి రూపకమని ప్రధాన వాక్యంలో వివరించడం
  rationale: మూలవాక్యం ఈ మాటను ఉద్దేశపూర్వకమైన కథన, దైవశాస్త్ర ఉద్రిక్తతతో ఉంచుతుంది. అది రూపకమా, కనిపించే స్థితిని బట్టి అన్న మాటా, త్వరలో జరిగే పునరుద్ధరణను ముందుగానే ప్రకటించే మాటా అనే విషయాన్ని అనువాదం స్వయంగా నిర్ణయించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే, గౌరవప్రదమైన కథనశైలి వాడబడింది. ‘చెబుతూ ఉన్నాడు’ ద్వారా గ్రీకు అసంపూర్ణ భూతకాల కాలాంశాన్ని నిలిపినా, మిగతా వాక్య నిర్మాణాన్ని సంక్షిప్తంగా ఉంచి సహజత్వాన్ని కాపాడాం. పాదసూచిక గుర్తును సంబంధిత ఎగతాళి-నవ్వు పదబంధం వద్ద ఉంచాం.
