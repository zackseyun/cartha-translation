  to: ఆయన, “వెళ్లిపోండి; ఎందుకంటే ఆ బాలిక చనిపోలేదు, కానీ నిద్రపోతోంది” అని చెబుతూ ఉన్నాడు. వారు ఆయనను ఎగతాళిగా నవ్వుతూ ఉన్నారు.[a]
  rationale: The revision explicitly translates γάρ with ‘ఎందుకంటే,’ retains ἀλλά with ‘కానీ,’ and uses a durative form for κατεγέλων. It removes the unneeded addition ‘చూసి’ while retaining the lexical alternative in the footnote and the unexpanded ‘sleeping’ metaphor.
