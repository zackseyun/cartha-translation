  source_fidelity: 'మూలగ్రీకు భావం సమగ్రంగా సరిగ్గా ఉంది: ఇంటిలోనికి వెళ్లడం, గుడ్డివారు యేసునొద్దకు రావడం, ఆయన చేయగలడనే నిర్దిష్ట నమ్మకాన్ని ప్రశ్నించడం, వారి సమ్మతి అన్నీ నిలిచాయి. చారిత్రక వర్తమానాలను తెలుగు కథనానికి సహజమైన భూతకాలంలో ఇవ్వడం సమంజసం.'
