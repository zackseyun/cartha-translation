id: MAT.9.28
reference: Matthew 9:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: te
  text: ఆయన ఇంట్లోకి వెళ్లినప్పుడు, ఆ గుడ్డివారు ఆయన దగ్గరకు వచ్చారు. అప్పుడు యేసు వారితో, “నేను ఇది చేయగలనని మీరు నమ్ముతున్నారా?” అని అడిగాడు. వారు, “అవును, ప్రభువా[a]” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయ్యా.” గ్రీకు పదం κύριε మర్యాదపూర్వక సంబోధనగా కూడా వాడబడవచ్చు; “ప్రభువా” అనే అనువాదం యేసు అధికారాన్ని గుర్తించే భావసాధ్యతను కూడా నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: ఆయన ఇంట్లోకి వెళ్లినప్పుడు
  rationale: కాలసూచక భూతకాల కృదంతాన్ని సహజమైన తెలుగు ఉపవాక్యంగా ఇచ్చి, εἰς సూచించే లోపలికి వెళ్లడాన్ని స్పష్టంగా నిలిపింది.
- source_word: προσῆλθον αὐτῷ
  choice: ఆయన దగ్గరకు వచ్చారు
  rationale: προσέρχομαι ఇక్కడ ఒకరి వద్దకు రావడం లేదా సమీపించడాన్ని సూచిస్తుంది; ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: οἱ τυφλοί
  choice: ఆ గుడ్డివారు
  rationale: విశేషణం నామవాచకంగా వాడబడింది; ముందటి సందర్భంలోని ఇద్దరు పురుషులను సూచించేందుకు గౌరవ బహువచనంతో సహజంగా అనువదించబడింది.
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι;
  choice: నేను ఇది చేయగలనని మీరు నమ్ముతున్నారా?
  rationale: πιστεύετεను ‘నమ్ముతున్నారా,’ δύναμαιను సామర్థ్యాన్ని తెలిపే ‘చేయగలను’గా నేరుగా, సహజంగా అందించింది.
- source_word: Ναί
  choice: అవును
  rationale: సాధారణ సమ్మతిని తెలిపే గ్రీకు పదానికి నేరమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: κύριε
  choice: ప్రభువా
  rationale: κύριε గౌరవ సంబోధనగా ఉండగలిగినా, యేసు అధికారాన్ని గుర్తించే భావసాధ్యతను కోల్పోకుండా ‘ప్రభువా’గా అనువదించబడింది.
- source_word: λέγει / λέγουσιν
  choice: అడిగాడు / అన్నారు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగు కథనంలో సహజమైన భూతకాలంతో అందించింది; λέγει సందర్భంలో ప్రశ్నను పరిచయం చేస్తున్నందున ‘అడిగాడు’ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసును ఉద్దేశించిన κύριε సంబోధన
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ఈ పదం కేవలం మర్యాదపూర్వక సంబోధనగా కూడా అర్థమవుతుంది. అయితే ‘ప్రభువా’ అనేది దాని సాధారణ ప్రధాన అర్థాన్ని, అలాగే యేసు అధికారాన్ని గుర్తించే అవకాశాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో చూపింది.
- issue: ‘నమ్మడం’ యొక్క లక్ష్యం
  choice: యేసు ఇది చేయగలడనే నమ్మకం
  alternative: సాధారణంగా విశ్వాసం కలిగి ఉండడం
  rationale: ὅτι అనే ఉపవాక్యం నమ్మకంలోని నిర్దిష్ట విషయాన్ని—యేసు ‘ఇది’ చేయగల సామర్థ్యాన్ని—స్పష్టంగా పేర్కొంటుంది; దానిని విస్తరించి సిద్ధాంతపరమైన సాధారణ ప్రకటనగా మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. గ్రీకు చారిత్రక వర్తమానం తెలుగు కథనంలో సహజంగా వినిపించే భూతకాలంగా ఇవ్వబడింది. ‘గుడ్డివారు’ అనే రూపం సందర్భంలోని వ్యక్తులను గౌరవంగా సూచిస్తుంది.
