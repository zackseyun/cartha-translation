  text: అతడు లేచి తన ఇంటికి వెళ్లిపోయాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన ఇంటికి వెళ్లాడు.’
    reason: ἀπῆλθενకు ‘వెళ్లిపోయాడు’ అనే నిష్క్రమణ భావంతో కూడిన అనువాదంతో పాటు, సరళమైన ‘వెళ్లాడు’ కూడా సాధ్యమైన పదప్రయోగం.
lexical_decisions:
- source_word: καὶ
  choice: అతడు
  rationale: తెలుగు కథన ప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ అని అనువదించడం అసహజంగా ఉంటుంది; తరువాతి కర్తను స్పష్టంగా వ్యక్తం చేస్తూ సరళమైన అనుసంధానాన్ని సందర్భమే తెలియజేస్తుంది.
- source_word: ἐγερθεὶς
  choice: లేచి
  rationale: అనంతర క్రియకు ముందు జరిగిన చర్యను సహజమైన తెలుగు అసమాపక క్రియతో వ్యక్తం చేస్తుంది; ఇక్కడి అకర్మక భావాన్ని కాపాడుతుంది.
- source_word: ἀπῆλθεν
  choice: వెళ్లిపోయాడు
  rationale: ἀπέρχομαιలోని అక్కడి నుంచి వెళ్లిన భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: తన ఇంటికి
  rationale: కర్త సొంత నివాసాన్ని సూచించే αὐτοῦను తెలుగులో సహజంగా ‘తన’తో, గమ్యాన్ని ‘ఇంటికి’తో వ్యక్తం చేస్తుంది.
