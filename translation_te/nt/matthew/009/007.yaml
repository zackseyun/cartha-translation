translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని చర్యల క్రమాన్ని ‘లేచి… వెళ్లిపోయాడు’గా సహజంగా నిలిపింది.
