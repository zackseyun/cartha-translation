id: MAT.1.1
reference: Matthew 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Βίβλος γενέσεως Ἰησοῦ χριστοῦ υἱοῦ Δαυὶδ υἱοῦ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/001.yaml
  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: te
  text: దావీదు కుమారుడైన, అబ్రాహాము కుమారుడైన యేసు మెస్సీయ[b] యొక్క వంశావళి[a] గ్రంథం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మూలవృత్తాంతం,’ లేదా ‘జనన వృత్తాంతం.’ ఇక్కడి గ్రీకు పదం ‘మూలం/ఆవిర్భావం’ అనే విస్తృత భావాన్ని కూడా ఇవ్వగలదు; అయితే తరువాత వచ్చే వంశపరంపరకు ‘వంశావళి’ బాగా సరిపోతుంది.
    reason: alternative_reading
  - marker: b
    text: 'సంప్రదాయ తెలుగు రూపం: ‘యేసు క్రీస్తు.’ ఇక్కడ ‘మెస్సీయ’ అనేది గ్రీకు బిరుదైన Χριστόςకు అనువాదం.'
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: గ్రంథం
  rationale: ఇది పుస్తకం, గ్రంథం లేదా లిఖిత వృత్తాంతాన్ని సూచించగలదు. శీర్షికగా ఉన్న ఈ వాక్యంలో ‘గ్రంథం’ సంక్షిప్తమైన, గంభీరమైన తెలుగు ప్రయోగం.
- source_word: γενέσεως
  choice: వంశావళి
  rationale: ఈ పదానికి మూలం, జననం, వంశావళి అనే అర్థాలు ఉండవచ్చు. వెంటనే వంశపరంపర ఇవ్వబడుతున్నందున ప్రధాన పాఠ్యంలో ‘వంశావళి’ సందర్భానికి అత్యంత సముచితం; విస్తృత అర్థాలను పాదసూచికలో ఉంచాం.
- source_word: Ἰησοῦ
  choice: యేసు
  rationale: తెలుగులో స్థిరపడిన ప్రామాణిక నామరూపం.
- source_word: χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός యేసు యొక్క బిరుదుగా పనిచేస్తూ ‘అభిషిక్తుడు’ అనే యూదుల రాజసంబంధ నేపథ్యాన్ని సూచిస్తుంది. అందువల్ల పేరులో భాగంలా వినిపించే ‘క్రీస్తు’ కంటే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో వాడాం.
- source_word: υἱοῦ Δαυὶδ
  choice: దావీదు కుమారుడు
  rationale: ‘కుమారుడు’ ఇక్కడ వంశస్థుడనే విస్తృత భావాన్ని కలిగి ఉన్నా, ఈ పదబంధాన్ని యథాతథంగా ఉంచడం దాని వంశపరమైన, రాజసంబంధమైన బలాన్ని కాపాడుతుంది.
- source_word: υἱοῦ Ἀβραάμ
  choice: అబ్రాహాము కుమారుడు
  rationale: ఇది ప్రత్యక్ష కుమారత్వం కాక వంశసంబంధాన్ని సూచిస్తుంది. అయినప్పటికీ ‘కుమారుడు’ అనే మూలరూపాన్ని నిలుపుకోవడం వంశావళి శైలిని, నిబంధనసంబంధ అనుసంధానాన్ని కాపాడుతుంది.
theological_decisions:
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వాక్యంలో పదం బిరుదుగా యేసు యొక్క మెస్సీయ గుర్తింపును పరిచయం చేస్తుంది. సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో తెలిపాం.
- issue: γενέσεως అనే శీర్షిక పదం యొక్క భావం
  choice: వంశావళి
  alternative: మూలం; జననం
  rationale: తదుపరి భాగంలో వంశపరంపర ఉన్నందున ‘వంశావళి’ ప్రధాన సందర్భానికి సరిపోతుంది. అయితే ‘మూలం/ఆవిర్భావం’ మరియు ‘జననం’ అనే విస్తృత ప్రతిధ్వనులను తొలగించకుండా పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన శీర్షికశైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని రెండు ‘కుమారుడు’ పదబంధాలను సహజమైన తెలుగు విశేషణ నిర్మాణంలో ముందుకు తెచ్చి, వాటి వంశపరమైన మరియు మెస్సీయ సంబంధ బలాన్ని నిలిపాం. తెలుగులో నిర్దిష్ట ఉపపదం లేనందున ‘యేసు మెస్సీయ’ సహజంగా బిరుదు భావాన్నే ఇస్తుంది.
