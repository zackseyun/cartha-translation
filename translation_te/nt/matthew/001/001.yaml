  to: దావీదు కుమారుడైన, అబ్రాహాము కుమారుడైన యేసు మెస్సీయ[b] యొక్క వంశావళి[a] గ్రంథం.
  rationale: 'The revision is stylistic only: it clarifies the two repeated genealogical descriptors and the relation of ‘వంశావళి గ్రంథం’ to Jesus the Messiah. It does not alter the source meaning, the title sense of Χριστός, or the lexical ambiguity of γενέσεως.'
