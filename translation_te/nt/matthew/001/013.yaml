id: MAT.1.13
reference: Matthew 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: te
  text: జెరుబ్బాబెలు అబీయూదును కన్నాడు[a]. అబీయూదు ఎల్యాకీమును కన్నాడు. ఎల్యాకీము అజోరును కన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అబీయూదుకు తండ్రి అయ్యాడు.” బైబిలు వంశావళుల్లో ఈ క్రియ తరాల వరుసను సంక్షిప్తంగా కూడా తెలియజేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: జెరుబ్బాబెలు
  rationale: తెలుగు బైబిలు వాడుకలో గుర్తించదగిన రూపాన్ని అనుసరించి వ్యక్తి పేరును లిప్యంతరీకరించాం.
- source_word: δέ
  choice: వేరుగా పదంతో అనువదించలేదు
  rationale: ఈ వంశావళిలో δέ బలమైన వ్యతిరేకతను కాక, జాబితాను ముందుకు నడిపే స్వల్ప అనుసంధానాన్ని సూచిస్తుంది. తెలుగు వాక్యక్రమం, పునరావృత నిర్మాణం ఆ ప్రవాహాన్ని సహజంగా తెలియజేస్తాయి.
- source_word: ἐγέννησεν
  choice: కన్నాడు
  rationale: వంశావళిలో పురుషుని ద్వారా కొనసాగిన సంతాన సంబంధాన్ని తెలిపే సంక్షిప్తమైన, సహజమైన తెలుగు రూపం. ఇది పాతకాలపు లేదా కృత్రిమమైన పదప్రయోగాన్ని నివారిస్తూ గ్రీకు సూత్రబద్ధ పునరావృతాన్ని నిలుపుతుంది.
- source_word: Ἀβιούδ
  choice: అబీయూదు
  rationale: గ్రీకు పేరుకు దగ్గరగా ఉండి, తెలుగులో సహజంగా చదవగల లిప్యంతరీకరణ.
- source_word: Ἐλιακίμ
  choice: ఎల్యాకీము
  rationale: గ్రీకు ఉచ్చారణను తగినంతగా ప్రతిబింబించే, తెలుగు బైబిలు పాఠకులకు పరిచితమైన లిప్యంతరీకరణ.
- source_word: Ἀζώρ
  choice: అజోరు
  rationale: గ్రీకు వ్యక్తి పేరును తెలుగు ధ్వని వ్యవస్థకు అనుగుణంగా లిప్యంతరీకరించాం.
theological_decisions:
- issue: వంశావళిలో γεννάω అనే క్రియ తరాల సంక్షిప్తీకరణకు అవకాశం ఉంచడం
  choice: కన్నాడు
  alternative: తండ్రి అయ్యాడు; పూర్వికుడు అయ్యాడు
  rationale: ‘కన్నాడు’ గ్రీకు వంశావళి సూత్రానికి నేరుగా, సహజంగా సరిపోతుంది. అయితే బైబిలు వంశావళులు కొన్నిసార్లు మధ్య తరాలను సంక్షిప్తం చేయగలవు; అందువల్ల ఈ పదాన్ని ప్రతి సందర్భంలోనూ తప్పనిసరిగా ప్రత్యక్ష తండ్రి-కొడుకు సంబంధమనే సాంకేతిక నిర్ధారణగా తీసుకోరాదని పాదసూచిక తెలియజేస్తుంది. ‘పూర్వికుడు అయ్యాడు’ అని ప్రధాన పాఠంలో పెట్టడం గ్రీకు పదబంధం కంటే ఎక్కువగా అర్థాన్ని విప్పుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు మూలంలోని మూడు సమాంతర వంశావళి వాక్యాల పునరావృతాన్ని నిలిపి, బలమైన వ్యతిరేకత లేని δέలను ప్రత్యేక అనుసంధాన పదాలతో భారంగా చేయలేదు.
