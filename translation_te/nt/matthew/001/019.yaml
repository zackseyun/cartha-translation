  to: ఆమె భర్త యోసేపు[a] నీతిమంతుడు. అతడు ఆమెను బహిరంగంగా అవమానించడానికి[b] ఇష్టపడక, ఆమెకు రహస్యంగా విడాకులు ఇవ్వాలని[c] నిర్ణయించుకున్నాడు.
  rationale: ప్రధాన అనువాదానికి మార్పు అవసరం లేదు. పాదసూచిక aలో మాత్రమే వ్యాకరణపరంగా, వాడుకపరంగా అసహజమైన ప్రత్యామ్నాయాన్ని ‘ఆమె నిశ్చితార్థుడు’గా సవరించాం. దీనివల్ల మూలంలోని ἀνήρకు సందర్భానుసారమైన ప్రత్యామ్నాయం, అలాగే ఆంగ్ల audit trailలోని ‘her betrothed,’ రెండూ సరిగ్గా ప్రతిఫలిస్తాయి.
