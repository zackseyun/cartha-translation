id: MAT.1.19
reference: Matthew 1:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: te
  text: ఆమె భర్త యోసేపు[a] నీతిమంతుడు. అతడు ఆమెను బహిరంగంగా అవమానించడానికి[b] ఇష్టపడక, ఆమెకు రహస్యంగా విడాకులు ఇవ్వాలని[c] నిర్ణయించుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమె నిశ్చితార్థుడు.” గ్రీకులో “ఆమె పురుషుడు/భర్త” అని ఉంది; ఇది యూదుల నిశ్చితార్థానికి ఉన్న చట్టబద్ధమైన బలాన్ని ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఆమెను అందరి ముందు అపకీర్తిపాలు చేయడానికి,” “ఆమెను ఒక ఉదాహరణగా నిలపడానికి.”
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “ఆమెను రహస్యంగా పంపివేయాలని.” ఈ సందర్భంలో ఇది నిశ్చితార్థ బంధాన్ని అధికారికంగా రద్దు చేయడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: ఆమె భర్త
  rationale: ἀνήρ సంబంధ సందర్భంలో ‘భర్త’ అని అర్థమవుతుంది. యూదుల నిశ్చితార్థం చట్టబద్ధమైన బంధం కావడం, దాన్ని రద్దు చేయడానికి ἀπολῦσαι వాడటం వల్ల ‘భర్త’ సహజమైనది; బంధం ఇంకా నిశ్చితార్థ దశలో ఉందన్న అంశాన్ని పాదసూచికలో ఉంచాం.
- source_word: δίκαιος
  choice: నీతిమంతుడు
  rationale: ఈ పదం దేవుని ఎదుట, ప్రవర్తనలో యోసేపు యొక్క నైతిక న్యాయస్వభావాన్ని సూచిస్తుంది. ‘నీతిమంతుడు’ దాని బైబిలు సంబంధ ప్రతిధ్వనిని కాపాడుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: δειγματίσαι
  choice: బహిరంగంగా అవమానించడానికి
  rationale: δειγματίζω ఒకరిని అందరి ఎదుట ప్రదర్శించి అపకీర్తికి గురిచేయడం అనే భావాన్ని కలిగిస్తుంది. ఈ అనువాదం బహిరంగ అవమాన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐβουλήθη
  choice: నిర్ణయించుకున్నాడు
  rationale: βούλομαι ఆలోచించి ఏర్పరచుకున్న ఉద్దేశాన్ని లేదా సంకల్పాన్ని సూచిస్తుంది. ‘నిర్ణయించుకున్నాడు’ కథన సందర్భంలో స్పష్టంగా, సహజంగా ఉంది.
- source_word: λάθρᾳ
  choice: రహస్యంగా
  rationale: λάθρᾳ ఇతరులకు తెలియకుండా, గోప్యంగా చేయడాన్ని సూచిస్తుంది. ‘రహస్యంగా’ మూలపద భావాన్ని నేరుగా అందిస్తుంది.
- source_word: ἀπολῦσαι
  choice: విడాకులు ఇవ్వాలని
  rationale: ఈ యూదుల నిశ్చితార్థ సందర్భంలో ἀπολύω చట్టబద్ధమైన బంధాన్ని అధికారికంగా రద్దు చేయడాన్ని సూచిస్తుంది. ‘విడాకులు ఇవ్వడం’ ఆధునిక పాఠకునికి ఆ న్యాయపరమైన బలాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ
  choice: తెలుగులో ప్రత్యేక సంధాన పదం లేకుండా వాక్యప్రవాహంలో వ్యక్తీకరించబడింది
  rationale: δὲ ఇక్కడ కథనాన్ని ముందుకు నడిపే స్వల్ప సంధాయకం. తెలుగులో ప్రత్యేకంగా ‘అయితే’ చేరిస్తే అవసరానికి మించిన వ్యతిరేక భావం రావచ్చు; వాక్యక్రమమే సంబంధాన్ని సహజంగా చూపుతుంది.
- source_word: ὢν καὶ μὴ θέλων
  choice: నీతిమంతుడు. అతడు ... ఇష్టపడక
  rationale: గ్రీకు కృదంత నిర్మాణాన్ని తెలుగులో రెండు సహజ వాక్యాలుగా మలిచాం. యోసేపు నీతిమంతుడన్న నేపథ్యాన్ని, అవమానించడానికి ఇష్టపడలేదన్న కారణ సంబంధాన్ని వ్యాఖ్యానాత్మకంగా మరింత నిర్దిష్టం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: యోసేపును δίκαιος అని వర్ణించడం
  choice: ‘నీతిమంతుడు’ అని అనువదించి, అది కఠినమైన ధర్మశాస్త్ర ఆచరణనా, కనికరమా, లేక రెండూనా అని నిర్దిష్టీకరించలేదు.
  alternative: ‘న్యాయవంతుడు’ అని అనువదించడం లేదా అతని కనికరాన్ని వివరించే వ్యాఖ్యానాత్మక రూపం
  rationale: గ్రీకు పాఠం యోసేపును δίκαιος అని చెప్పి, మరియను బహిరంగంగా అవమానించడానికి అతడు ఇష్టపడలేదని కలిపి చెబుతుంది. నైతిక న్యాయం మరియు కనికరపూర్వక సంయమనం మధ్య ఉన్న భావ ఉద్రిక్తతను అనువాదం పరిష్కరించకుండా కాపాడుతుంది.
- issue: యోసేపు, మరియల చట్టబద్ధమైన సంబంధ స్థితి
  choice: ప్రధాన పాఠంలో ‘భర్త’, ‘విడాకులు’ అని వాడాం.
  alternative: ‘నిశ్చితార్థం చేసుకున్నవాడు’, ‘నిశ్చితార్థాన్ని రద్దు చేయడం’ లేదా మరింత అక్షరార్థంగా ‘ఆమె పురుషుడు’, ‘ఆమెను పంపివేయడం’
  rationale: గ్రీకు పదప్రయోగం, మొదటి శతాబ్దపు యూదుల నిశ్చితార్థ సందర్భం ఈ బంధం చట్టబద్ధమైనదనీ, దాన్ని అధికారికంగా రద్దు చేయాల్సి వచ్చేదనీ సూచిస్తాయి. ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. గ్రీకు కృదంతాలతో కూడిన దీర్ఘ వాక్యాన్ని తెలుగు పఠన సౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం. ‘నీతిమంతుడు’ అనే బైబిలు-నైతిక పదాన్ని నిలుపుతూ, నిశ్చితార్థ బంధపు చట్టబద్ధతను ఆధునిక పాఠకునికి ‘భర్త’, ‘విడాకులు’ ద్వారా స్పష్టం చేశాం.
