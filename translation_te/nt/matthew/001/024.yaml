- source_word: προσέταξεν
  choice: ఆజ్ఞాపించిన
  rationale: అధికారపూర్వకమైన నిర్దేశాన్ని సూచించే క్రియాబలాన్ని కాపాడుతుంది.
- source_word: ὁ ἄγγελος κυρίου
  choice: ప్రభువు దూత
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని సహజమైన తెలుగు బైబిలు శైలిలో వ్యక్తపరుస్తుంది; κύριος ను ‘ప్రభువు’గా అనువదిస్తుంది.
- source_word: παρέλαβεν
  choice: తన దగ్గరకు చేర్చుకున్నాడు
  rationale: ఒకరిని తనతో ఉండేందుకు స్వీకరించడం లేదా తన ఇంటిలోకి తీసుకోవడం అనే సాధ్యమైన సందర్భార్థాన్ని సహజంగా తెలియజేస్తూ, ఇతర భావఛాయలను పాదసూచికలో ఉంచుతుంది.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: తన భార్యను
  rationale: ఈ సందర్భంలోని చట్టబద్ధమైన వివాహ సంబంధాన్ని γυνή సూచిస్తుంది; శారీరక దాంపత్య సంబంధం అప్పటికే జరిగిందని ఇది అదనంగా చెప్పదు.
theological_decisions:
- issue: దాంపత్య సంపూర్ణతకు ముందున్న సందర్భంలో γυνή అనువాదం
  choice: తన భార్యను
  alternative: ఆ స్త్రీని
  rationale: ముందరి వచనాలు నిశ్చితార్థ పరిస్థితిని, తరువాతి వచనం ఇంకా శారీరక దాంపత్య సంబంధం లేదని చూపినప్పటికీ, మత్తయి ఆమెను చట్టబద్ధమైన వివాహ సంబంధంలో పేర్కొంటున్నాడు. ‘భార్య’ అనేది ఆ సామాజిక-చట్టబద్ధ సందర్భాన్ని కాపాడుతుంది.
- issue: ἄγγελος κυρίου లో κύριος అనువాదం
  choice: ప్రభువు దూత
  alternative: యెహోవా దూత
  rationale: గ్రీకు పాఠంలో ఉన్న κύριος ను నేరుగా ‘ప్రభువు’గా అందించడం ద్వారా పాఠంలోని రూపాన్ని కాపాడి, హెబ్రీ దైవనామాన్ని అనువాదంలో అదనంగా ప్రవేశపెట్టదు.
