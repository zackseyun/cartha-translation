  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: te
  text: అప్పుడు యోసేపు నిద్రనుండి మేల్కొని, ప్రభువు దూత తనకు ఆజ్ఞాపించినట్లే చేసి, తన భార్యను తన దగ్గరకు చేర్చుకున్నాడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన భార్యను స్వీకరించాడు,’ లేదా ‘తన భార్యను తన ఇంటికి తీసుకువచ్చాడు.’ గ్రీకు క్రియ ఒకరిని తనతో ఉండేందుకు లేదా తన ఇంటిలోకి తీసుకోవడం అనే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς ἀπὸ τοῦ ὕπνου
  choice: నిద్రనుండి మేల్కొని
  rationale: నిద్ర నుంచి లేవడాన్ని సూచించే గ్రీకు కృదంత ప్రయోగాన్ని సహజమైన తెలుగు క్రమంతో వ్యక్తపరుస్తుంది.
- source_word: δὲ
