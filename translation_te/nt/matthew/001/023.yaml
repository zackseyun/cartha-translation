id: MAT.1.23
reference: Matthew 1:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: te
  text: ఇదిగో, కన్య[a] గర్భం ధరించి ఒక కుమారుణ్ణి కంటుంది. వారు[b] ఆయనకు “ఇమ్మానుయేలు”[c] అని పేరు పెడతారు—దాన్ని అనువదిస్తే, “దేవుడు మనతో ఉన్నాడు” అని అర్థం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యువతి’ అని కూడా అనువదించవచ్చు. అయితే మత్తయి సందర్భంలో గ్రీకు παρθένος అనే పదం, దాని చుట్టూ ఉన్న జనన వృత్తాంతం ‘కన్య’ అనే అర్థాన్నే బలపరుస్తాయి.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా ‘వారు పేరు పెడతారు’; ఇది కర్తను నిర్దిష్టంగా చెప్పని బహువచన ప్రయోగం.
    reason: lexical_alternative
  - marker: c
    text: ఈ పేరును ‘ఎమ్మానుయేలు’ అని కూడా లిప్యంతరీకరించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: ప్రవచన ఉల్లేఖనంలో శ్రోత దృష్టిని ఆకర్షించే గ్రీకు సంభాషణా సూచకపు బలాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: ἡ παρθένος
  choice: కన్య
  rationale: మత్తయి జనన వృత్తాంతపు సందర్భంలో παρθένος కన్యను సూచిస్తుంది; యెషయా 7:14 సెప్టువజింట్ ఉల్లేఖనాన్ని కూడా ప్రతిబింబిస్తుంది. విస్తృత యెషయా చర్చలోని ‘యువతి’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: ἐν γαστρὶ ἕξει
  choice: గర్భం ధరించి
  rationale: అక్షరార్థంగా ‘గర్భంలో కలిగి ఉంటుంది’ అనే గ్రీకు నుడికారానికి సహజమైన తెలుగు సమానార్థకం; తరువాతి ప్రసవ క్రియతో సులభంగా కలుస్తుంది.
- source_word: τέξεται υἱόν
  choice: ఒక కుమారుణ్ణి కంటుంది
  rationale: ప్రసవాన్ని తెలిపే క్రియను సంక్షిప్తమైన, సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తూ కుమారుడు అనే అర్థాన్ని నేరుగా నిలుపుతుంది.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: వారు ఆయనకు … అని పేరు పెడతారు
  rationale: మూడవ పురుష బహువచన క్రియలో కర్త ఎవరో నిర్దిష్టంగా చెప్పని గ్రీకు నిర్మాణాన్ని ‘వారు’ ద్వారా నిలుపుతూ, తెలుగులో సహజమైన పేరుపెట్టే ప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: Ἐμμανουήλ
  choice: ఇమ్మానుయేలు
  rationale: పేరుకు వెనుకనున్న హెబ్రీ రూపానికి, వెంటనే ఇవ్వబడిన ‘దేవుడు మనతో ఉన్నాడు’ అనే వివరణకు అనుగుణమైన ప్రాచుర్యమైన తెలుగు లిప్యంతరీకరణ.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: దాన్ని అనువదిస్తే … అని అర్థం
  rationale: పేరును పాఠకునికి అనువదించి వివరిస్తున్న గ్రీకు కృదంత నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: దేవుడు మనతో ఉన్నాడు
  rationale: పేరు యొక్క వివరణను వ్యాఖ్యానాత్మక విస్తరణ లేకుండా స్పష్టంగా, నేరుగా అందిస్తుంది.
theological_decisions:
- issue: కన్య గర్భధారణకు కేంద్రంగా ఉన్న వచనంలో παρθένος అనువాదం
  choice: కన్య
  alternative: యువతి
  rationale: మత్తయి 1లోని అసాధారణ గర్భధారణ సందర్భం, అలాగే ఇక్కడ వాడిన గ్రీకు పదం యొక్క సాధారణ అర్థం, ప్రధాన పాఠంలో ‘కన్య’ను సమర్థిస్తాయి. యెషయా 7:14కు సంబంధించిన విస్తృత పదార్థ చర్చను నిర్లక్ష్యం చేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలియజేశారు.
- issue: ‘ఇమ్మానుయేలు’ అనే పేరుకు ఇచ్చిన వివరణ యొక్క బలం
  choice: ‘దేవుడు మనతో ఉన్నాడు’ అని మాత్రమే అనువదించడం
  alternative: అవతారం గురించి విస్తృత సిద్ధాంత వివరణను చేర్చడం
  rationale: వచనం స్వయంగా ఇచ్చే పేరర్థాన్ని దాని సంపూర్ణ దైవశాస్త్రీయ బలంతో నిలుపుతూ, పాఠంలో లేని సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఉపయోగిస్తూ, ‘ఇదిగో’ ద్వారా ప్రవచన ఉల్లేఖనపు గంభీరతను నిలిపింది. పేరు, దాని అనువాదం స్పష్టంగా కనిపించేందుకు ఉద్ధరణ చిహ్నాలు మరియు దీర్ఘ విరామచిహ్నం వాడబడ్డాయి.
