id: MAT.1.2
reference: Matthew 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: te
  text: అబ్రాహాము ఇస్సాకుకు తండ్రి అయ్యాడు[a]; ఇస్సాకు యాకోబుకు తండ్రి అయ్యాడు; యాకోబు యూదాకు, అతని సోదరులకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కన్నాడు.” గ్రీకు క్రియ వంశావళి సందర్భంలో పురుషుని పితృత్వాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో γεννάω పురుషుని పితృత్వాన్ని లేదా వంశ సంబంధాన్ని సూచిస్తుంది. ‘తండ్రి అయ్యాడు’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉండి, ఈ సంబంధాన్ని ‘కన్నాడు’ కంటే తక్కువ అస్పష్టతతో తెలియజేస్తుంది; ఇది ప్రతి సందర్భంలోనూ తప్పనిసరిగా ప్రత్యక్ష తరాన్నే నిర్ధారించదు.
- source_word: δὲ
  choice: వేరుగా పదంతో అనువదించకుండా పునరుక్త వాక్య నిర్మాణంతో అనుసంధానం
  rationale: ఇక్కడ δέ విరోధాన్ని కాక వంశావళిలో తదుపరి మెట్టును సూచించే స్వల్ప అనుసంధానకం. తెలుగు వరుస వాక్య నిర్మాణం ఆ ప్రవాహాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰούδαν
  choice: యూదా
  rationale: ఇక్కడ సూచించబడినవాడు యాకోబు కుమారుడైన పితృపురుషుడు యూదా; నూతన నిబంధన కాలంలోని యూదాసు కాదు.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: అతని సోదరులు
  rationale: పదం ఇక్కడ యూదా యొక్క పురుష సహోదరులను, అంటే యాకోబు ఇతర కుమారులను సూచిస్తుంది. ‘సోదరులు’ లింగం మరియు సందర్భం రెండింటినీ కచ్చితంగా నిలుపుతుంది.
- source_word: Ἀβραὰμ / Ἰσαὰκ / Ἰακώβ
  choice: అబ్రాహాము / ఇస్సాకు / యాకోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన, పాఠకులకు సుపరిచితమైన వ్యక్తినామ రూపాలను ఉపయోగించాం.
theological_decisions:
- issue: వంశావళి క్రియ యొక్క అనువాదం
  choice: ‘తండ్రి అయ్యాడు’ అని వరుసగా ఉపయోగించడం
  alternative: ‘కన్నాడు’ లేదా ‘జన్మనిచ్చాడు’ అని అనువదించడం
  rationale: ఈ రూపం గ్రీకు క్రియలోని పితృవంశ భావాన్ని నిలుపుతూ, జీవశాస్త్రీయ ప్రక్రియపై అనవసరమైన దృష్టిని పెట్టదు. అలాగే వంశావళిలో తరాలు సంక్షిప్తమై ఉండే అవకాశాన్ని అనువాదమే ముందుగా తీర్చివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వంశావళి శైలి. పదే పదే వచ్చే గ్రీకు క్రియకు ఒకే తెలుగు రూపాన్ని ఉంచి నిర్మాణ సమాంతరతను కాపాడాం; δέను బలమైన విరోధార్థక పదంతో అనువదించలేదు.
