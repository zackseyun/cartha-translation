  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: te
  text: సొలొమోను రెహబాముకు తండ్రి అయ్యాడు; రెహబాము అబీయాకు తండ్రి అయ్యాడు; అబీయా ఆసాపుకు[a] తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “ఆసా” అని ఉంది. ఇది 1 రాజులు 15 మరియు 2 దినవృత్తాంతాలు 14–16లో పేర్కొన్న యూదా రాజు పేరుతో సరిపోతుంది; ఇక్కడ అనుసరించిన గ్రీకు పాఠంలో “ఆసాపు” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: కన్నాడు
  rationale: వంశావళిలో పురుష పూర్వికుని ద్వారా సంతాన సంబంధాన్ని తెలిపే సహజమైన, సంక్షిప్తమైన తెలుగు ప్రయోగం. ఇది ప్రతి తరం నేరుగా తండ్రి-కొడుకు సంబంధమే అని అవసరానికి మించి నిర్ధారించదు.
- source_word: δὲ
  choice: వాక్య విభజనలో అంతర్లీన అనుసంధానం
  rationale: ఇక్కడ δέ వ్యతిరేకార్థకం కాకుండా వంశక్రమాన్ని కొనసాగించే స్వల్ప అనుసంధాన పదం. తెలుగులో పునరావృతమైన ‘మరియు’ కంటే అర్ధవిరామాలతో క్రమాన్ని సహజంగా తెలియజేశాం.
- source_word: Σολομών
  choice: సొలొమోను
  rationale: తెలుగు బైబిలు పాఠకులకు గుర్తుపట్టదగిన ప్రామాణిక నామరూపం.
- source_word: Ῥοβοάμ
  choice: రెహబాము
  rationale: తెలుగులో పాత నిబంధన నామంతో అనుసంధానం నిలుపుతూ ఉపయోగించిన గుర్తుపట్టదగిన రూపం.
- source_word: Ἀβιά
  choice: అబీయా
  rationale: గ్రీకు రూపాన్ని గౌరవిస్తూ, పాత నిబంధన రాజు పేరుతో పాఠకులకు ఉన్న అనుసంధానాన్ని నిలిపే తెలుగు రూపం.
- source_word: Ἀσάφ
  choice: ఆసాపు
  rationale: అందించిన SBLGNT పాఠంలో ఉన్న Ἀσάφను సమన్వయపరచకుండా ప్రధాన పాఠంలో ప్రతిబింబించే తెలుగు నామరూపం.
theological_decisions:
- issue: మత్తయి వంశావళిని పాత నిబంధన రాజుల జాబితాతో సమన్వయపరచడానికి Ἀσάφను ‘ఆసా’గా అనువదించాలా?
  choice: ప్రధాన పాఠంలో ‘ఆసాపు’ను ఉంచడం
  alternative: ‘ఆసా’ అని చదవడం
  rationale: అందించిన గ్రీకు మూలపాఠం Ἀσάφ అని చదువుతుంది. కాబట్టి దాన్ని మౌనంగా ‘ఆసా’గా మార్చకుండా ప్రధాన పాఠంలో నిలిపి, ప్రతులలోని ప్రత్యామ్నాయ పాఠాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన సంక్షిప్త, గంభీర శైలి. పేర్లను తెలుగు బైబిలు పాఠకులకు గుర్తుపట్టదగిన రూపాల్లో ఇచ్చి, మూలపాఠంలోని పాఠాంతర ఉద్రిక్తతను పాదసూచిక ద్వారా పారదర్శకంగా నిలిపాం.
