id: MAT.1.10
reference: Matthew 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: te
  text: హిజ్కియా మనష్షేకు తండ్రి అయ్యాడు; మనష్షే ఆమోసుకు[a] తండ్రి అయ్యాడు; ఆమోసు యోషీయాకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని అనువాదాలు 2 రాజులు 21లోని యూదా రాజు పేరుతో సమన్వయం చేస్తూ ఇక్కడ “ఆమోను” అని ఇస్తాయి. మత్తయి గ్రీకు పాఠంలో “ఆమోసు” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో ఈ క్రియ పురుషుని ద్వారా కలిగిన సంతాన సంబంధాన్ని సూచిస్తుంది. ‘తండ్రి అయ్యాడు’ అనేది ‘కన్నాడు’ కంటే సహజమైన ఆధునిక తెలుగు; అదే సమయంలో వంశ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Ἑζεκίας
  choice: హిజ్కియా
  rationale: యూదా రాజుకు తెలుగులో ప్రాచుర్యంలో ఉన్న బైబిలు నామరూపం.
- source_word: Μανασσῆς
  choice: మనష్షే
  rationale: తెలుగు బైబిలు వాడుకలో గుర్తించదగిన ప్రామాణిక నామరూపం.
- source_word: Ἀμώς
  choice: ఆమోసు
  rationale: SBLGNTలో ఉన్న Ἀμώς అనే గ్రీకు రూపాన్ని నేరుగా ప్రతిబింబిస్తుంది; పాత నిబంధన రాజు పేరుతో సమన్వయం చేయడానికి ‘ఆమోను’గా మార్చలేదు.
- source_word: Ἰωσίας
  choice: యోషీయా
  rationale: తెలుగు బైబిలు సంప్రదాయంలో గుర్తించదగిన ప్రామాణిక నామరూపం.
- source_word: δέ
  choice: ;
  rationale: పునరావృతమయ్యే వంశావళి వరుసలో δέ జాబితాను ముందుకు నడిపే సాధారణ అనుసంధానం. తెలుగులో ప్రతి సారి ‘మరియు’ అని పెట్టకుండా విరామచిహ్నంతో సహజంగా వ్యక్తీకరించబడింది.
theological_decisions:
- issue: మత్తయి గ్రీకు పాఠంలోని పేరుకూ పాత నిబంధనలోని యూదా రాజు పేరుకూ ఉన్న భేదం
  choice: ప్రధాన పాఠంలో గ్రీకు మూలంలోని ‘ఆమోసు’ అనే పేరును అనుసరించడం
  alternative: 2 రాజులు 21లోని రాజు పేరుతో సమన్వయం చేసి ‘ఆమోను’ అని వాడడం
  rationale: మూలభాషా పాఠానికి ప్రాధాన్యం ఇస్తూ, SBLGNTలోని Ἀμώς రూపాన్ని ప్రధాన పాఠంలో నిలిపాం. చారిత్రక వంశావళితో కనిపించే ఉద్రిక్తతను మౌనంగా తొలగించకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. వంశావళి పునరుక్తిని నిలుపుతూ, సహజమైన తెలుగు ప్రవాహం కోసం ఉపవాక్యాలను అర్ధవిరామాలతో కలిపాం.
