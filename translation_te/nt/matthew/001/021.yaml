  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప అనుసంధాన అవ్యయం; తెలుగులో వాక్యప్రవాహం సహజంగా ఉండేందుకు విరామంతో దాని పని వ్యక్తమవుతుంది.
- source_word: υἱὸν
