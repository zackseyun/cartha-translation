theological_decisions:
- issue: యేసు చేసే రక్షణ కార్యానికి సంబంధించి αὐτός ఉద్ఘాటన
  choice: ‘ఆయనే … రక్షిస్తాడు’ అని ఉద్ఘాటనను నిలిపాం
  alternative: ‘ఆయన … రక్షిస్తాడు’
  rationale: గ్రీకులో వ్యక్తంగా ఉన్న కర్త సర్వనామం శిశువే రక్షించే వ్యక్తి అని ముందుకు తెస్తుంది; ‘ఆయనే’ అదనపు సిద్ధాంత వివరణ లేకుండా ఆ బలాన్ని తెలుగులో తెలియజేస్తుంది.
- issue: ‘తన ప్రజలు’ అనే పదబంధపు పరిధి
  choice: ‘తన ప్రజలను’ అని మాత్రమే అనువదించాం
  alternative: ‘తన ప్రజలైన ఇశ్రాయేలీయులను’ లేదా ‘తనకు చెందిన ప్రజలందరినీ’
  rationale: సమీప సందర్భానికి యూద, నిబంధనా నేపథ్యం ఉన్నా, ఈ వచనం ఆ పరిధిని మరింత నిర్వచించదు. అందువల్ల అసలు వాక్యంలోని వ్యాఖ్యాన విస్తృతిని నిలిపాం.
