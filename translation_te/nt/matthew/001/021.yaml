  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: te
  text: ఆమె ఒక కుమారుణ్ణి కంటుంది. నీవు ఆయనకు యేసు[a] అని పేరు పెట్టాలి; ఎందుకంటే ఆయనే తన ప్రజలను వారి పాపాల నుండి రక్షిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యేసు’ అనేది హెబ్రీ/అరమాయిక్ ‘యేషువ’ (యెహోషువ) అనే పేరుకు అనుగుణమైన గ్రీకు రూపం. ఆ పేరు ‘యెహోవా రక్షిస్తాడు’ అనే భావంతో సంబంధం కలిగి ఉంది; ‘రక్షిస్తాడు’ అనే మత్తయి వివరణ ఈ పదప్రయోగాన్ని ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: కంటుంది
  rationale: ప్రసవ సందర్భంలో భవిష్యత్ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
