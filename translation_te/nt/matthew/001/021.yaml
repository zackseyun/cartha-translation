- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: నీవు ఆయనకు … అని పేరు పెట్టాలి
  rationale: గ్రీకు నామకరణ సూత్రంలోని రెండవ పురుష ఏకవచనాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజంగా ఆజ్ఞాత్మక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: Ἰησοῦν
  choice: యేసు
  rationale: కొత్త నిబంధనలో ఈ వ్యక్తి పేరుకు ప్రామాణికమైన తెలుగు రూపం.
- source_word: αὐτὸς
  choice: ఆయనే
  rationale: వ్యక్తమైన కర్త సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘ఆయనే’ సహజంగా నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: పేరు పెట్టడానికి తరువాత వచ్చే కారణాన్ని స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: σώσει
  choice: రక్షిస్తాడు
  rationale: పాపాల నుండి విడిపించే భావాన్ని ఈ సందర్భంలో నేరుగా, సముచితంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν λαὸν αὐτοῦ
  choice: తన ప్రజలను
  rationale: యేసుతో ప్రజలకు ఉన్న సంబంధాన్ని నిలుపుతుంది; వారు ఎవరనే పరిధిని అనువాదంలో అదనంగా కుదించదు లేదా విస్తరించదు.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: వారి పాపాల నుండి
