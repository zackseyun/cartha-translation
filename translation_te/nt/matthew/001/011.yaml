revisions:
- from: యోషీయా బబులోనుకు చెరగా తరలించబడిన కాలంలో యెకొన్యాను, అతని సహోదరులను కనెను.[a]
  to: యోషీయా బబులోనుకు చెరగా తీసుకుపోబడిన సమయంలో యెకొన్యాకు, అతని సహోదరులకు తండ్రియయ్యాడు.[a]
  rationale: The revision replaces a maternally marked verb with a natural Telugu expression for male genealogical descent. It also slightly streamlines the deportation phrase while preserving the source’s temporal sense, the destination Babylon, and the coercive nuance. The footnote remains correctly anchored and preserves the lexical alternative without resolving historical or genealogical questions beyond the Greek text.
