id: MAT.1.11
reference: Matthew 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: te
  text: యోషీయా బబులోనుకు చెరగా తీసుకుపోబడిన సమయంలో యెకొన్యాకు, అతని సహోదరులకు తండ్రియయ్యాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బబులోను చెర కాలంలో.” గ్రీకు పదం బలవంతపు స్థలాంతరణను లేదా చెరను సూచించగలదు; ప్రధాన పాఠ్యం బలవంతంగా తరలించిన సంఘటనను స్పష్టం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: కనెను
  rationale: వంశావళిలో పురుషుని ద్వారా వచ్చిన వంశసంబంధాన్ని తెలిపే సంక్షిప్త సూత్రప్రయోగం. ఆధునిక పాఠకునికి అర్థమయ్యేలా ఉండి, మూలంలోని genealogical formulaను విస్తరించకుండా నిలుపుతుంది.
- source_word: Ἰεχονίαν
  choice: యెకొన్యాను
  rationale: గ్రీకు పేరుకు దగ్గరగా ఉండే, తెలుగులో గుర్తించదగిన లిప్యంతరీకరణ; వాక్యంలో కర్మవిభక్తి ప్రకారం రూపాంతరం చేయబడింది.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: అతని సహోదరులను
  rationale: మూలంలోని పుంలింగ బహువచనాన్ని స్పష్టంగా నిలుపుతుంది; లింగనిరపేక్షమైన విస్తృత పదం వాడలేదు.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: బబులోనుకు చెరగా తరలించబడిన కాలంలో
  rationale: μετοικεσίαలోని బలవంతపు స్థలాంతరణ భావాన్ని ‘చెరగా తరలించబడిన’ అని తెలియజేస్తూ, ἐπί + genitive యొక్క కాలసూచక భావాన్ని ‘కాలంలో’తో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది వంశావళిని కొనసాగించే స్వల్ప అనుసంధాన పదం. తెలుగులో ప్రత్యేక సమానార్థక పదం చేర్చకపోయినా భావనష్టం లేదు; వాక్యం మరింత సహజంగా ఉంటుంది.
theological_decisions:
- issue: మత్తయి వంశావళిలో తరాల సంక్షిప్తీకరణ
  choice: గ్రీకు పాఠ్యంలో ఉన్న వంశసంబంధ ప్రకటనను యథాతథంగా ‘కనెను’ అని అనువదించడం
  alternative: ప్రతి సంబంధాన్నీ తక్షణ జీవశాస్త్రీయ పితృత్వంగా వివరించడం లేదా మధ్య తరాలను అనువాదంలో చేర్చడం
  rationale: γεννάω వంశపరమైన పూర్వీకత్వాన్ని కూడా సూచించగలిగినా, మూలం ఇక్కడ సంబంధాన్ని వివరించి పరిష్కరించదు. అందువల్ల చారిత్రక సమన్వయాన్ని ప్రధాన పాఠ్యంలోకి చేర్చకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; వంశావళికి తగిన సంక్షిప్త, గౌరవప్రద శైలి. ‘కనెను’ కొంత సాంప్రదాయ వర్ణం కలిగినా సామాన్య పాఠకునికి స్పష్టంగా ఉండి వంశావళి సూత్రాన్ని సహజంగా నిలుపుతుంది.
