id: MAT.1.15
reference: Matthew 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: te
  text: ఎలీయూదు ఎలియాజరుకు తండ్రి అయ్యాడు; ఎలియాజరు మత్తానుకు తండ్రి అయ్యాడు; మత్తాను యాకోబుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: ఎలీయూదు
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగులో సహజంగా పలికేలా లిప్యంతరీకరించాం.
- source_word: δὲ
  choice: వాక్య విభజనలో అంతర్లీనంగా చూపబడింది
  rationale: వంశావళిలో ఇది స్వల్ప అనుసంధాన పదం. ప్రతి ఖండంలో ‘మరియు’ అని ఉంచడం తెలుగు ప్రవాహానికి కృత్రిమంగా ఉండేందున అర్థాన్ని వరుస నిర్మాణం, అర్ధవిరామ చిహ్నాల ద్వారా నిలిపాం.
- source_word: ἐγέννησεν
  choice: కన్నాడు
  rationale: వంశావళి సందర్భంలో తండ్రి ద్వారా సంతానోత్పత్తి లేదా వంశపరంపరను సూచిస్తుంది. ‘కన్నాడు’ సంక్షిప్తమైన, సంప్రదాయబద్ధమైన తెలుగు ప్రయోగం; ఇది తప్పనిసరిగా ప్రతి తరమూ నేరుగా తదుపరి తరమేనని అదనంగా నిర్ణయించదు.
- source_word: τὸν
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: గ్రీకు నిర్దేశక పదం ఇక్కడ వ్యక్తినామాన్ని కర్మగా గుర్తిస్తుంది; తెలుగులో వ్యక్తినామం ముందు దానికి సమానమైన పదం అవసరం లేదు. కర్మవిభక్తి ‘ను’ ద్వారా వాక్యసంబంధం వ్యక్తమైంది.
- source_word: Ἐλεάζαρ
  choice: ఎలియాజరు
  rationale: గ్రీకు రూపాన్ని ఆధారంగా చేసుకొని, తెలుగులో చదవడానికి అనుకూలంగా లిప్యంతరీకరించాం.
- source_word: Ματθάν
  choice: మత్తాను
  rationale: గ్రీకు వ్యక్తినామంలోని దీర్ఘ చివరి అచ్చును ప్రతిబింబించేలా తెలుగు లిప్యంతరీకరణను ఎంచుకున్నాం.
- source_word: Ἰακώβ
  choice: యాకోబు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన, గ్రీకు Ἰακώβను గుర్తించదగిన రూపంలో అందించే పేరు.
theological_decisions:
- issue: వంశావళిలో ἐγέννησεν సూచించే సంబంధం
  choice: ‘కన్నాడు’ అని అనువదించి మూలంలోని పితృవంశ సంబంధాన్ని నిలిపాం.
  alternative: ‘తండ్రి అయ్యాడు’ లేదా ‘వంశంలో పుట్టాడు’
  rationale: మూలపాఠం పురుష కర్తతో γεννάωను ఉపయోగిస్తుంది. ‘కన్నాడు’ ఆ సంబంధాన్ని సంక్షిప్తంగా కాపాడుతుంది; వంశావళిలో మధ్య తరాలు ఉన్నాయా లేవా అనే ప్రశ్నను అనువాదంలోనే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక పాఠకులకు అర్థమయ్యే, గంభీరమైన వంశావళి శైలి. పునరుక్త నిర్మాణాన్ని మూలపాఠానికి అనుగుణంగా ఉంచి, తెలుగు ప్రవాహం కోసం ఖండాలను అర్ధవిరామాలతో కలిపాం.
