revisions:
- from: ఎలీయూదు ఎలియాజరును కన్నాడు; ఎలియాజరు మత్తానును కన్నాడు; మత్తాను యాకోబును కన్నాడు.
  to: ఎలీయూదు ఎలియాజరుకు తండ్రి అయ్యాడు; ఎలియాజరు మత్తానుకు తండ్రి అయ్యాడు; మత్తాను యాకోబుకు తండ్రి అయ్యాడు.
  rationale: The revision retains each name, the three-part sequence, and the mild connective progression while replacing an archaic/ambiguous verb with an idiomatic modern Telugu expression that explicitly marks the paternal relationship intended by the Greek genealogy.
  reviewer_model: gpt-5.6-terra
