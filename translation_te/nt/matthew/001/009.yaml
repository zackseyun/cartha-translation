source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: te
  text: ఉజ్జియా యోతాముకు తండ్రి అయ్యాడు[a]; యోతాము ఆహాజుకు తండ్రి అయ్యాడు; ఆహాజు హిజ్కియాకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు ἐγέννησεν అనే పదాన్ని సంప్రదాయంగా ‘కనెను’ అని అనువదిస్తారు; ఈ వంశావళిలో అదే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా చెప్పడానికి ‘తండ్రి అయ్యాడు’ అని వాడాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: ఉజ్జియా
  rationale: గ్రీకు పేరుకు వెనుక ఉన్న పాత నిబంధన యూదా రాజు పేరును అనుసరించే, తెలుగులో సుపరిచితమైన బైబిలు రూపం.
- source_word: δὲ
  choice: వాక్యంలోని సమాంతర ఉపవాక్యాలను విరామచిహ్నాలతో అనుసంధానించడం
  rationale: ఈ వంశావళి వరుసలో δέ స్వల్ప అనుసంధానకంగా పనిచేస్తుంది. ప్రతి సారి ప్రత్యేకంగా ‘మరియు’ అని పెట్టడం కంటే తెలుగు సహజ ప్రవాహంలో అర్ధవిరామాలు దాని వరుసబద్ధతను స్పష్టంగా చూపిస్తాయి.
- source_word: ἐγέννησεν
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళిలోని పితృసంబంధాన్ని ఆధునిక పాఠకులకు స్పష్టంగా, సహజంగా తెలియజేస్తుంది; పాతకాలపు ‘కనెను’ రూపం కంటే ప్రస్తుత ప్రామాణిక తెలుగులో సులభంగా అర్థమవుతుంది.
- source_word: Ἰωαθάμ
  choice: యోతాము
  rationale: పాత నిబంధనలోని యూదా రాజుకు తెలుగులో సుపరిచితమైన బైబిలు పేరు.
- source_word: Ἀχάζ
  choice: ఆహాజు
  rationale: పాత నిబంధన రాజు పేరుకు తెలుగులో స్థిరపడిన బైబిలు రూపం.
- source_word: Ἑζεκίαν
  choice: హిజ్కియా
  rationale: పాత నిబంధనలోని యూదా రాజుకు తెలుగులో సుపరిచితమైన బైబిలు పేరు.
theological_decisions:
- issue: γεννάω పదం సూచించే వంశావళి సంబంధం
  choice: ‘తండ్రి అయ్యాడు’ అని ప్రత్యక్ష పితృవంశ సంబంధంగా అనువదించడం
  alternative: ‘పూర్వీకుడు అయ్యాడు’ లేదా ‘వంశంలో పుట్టాడు’
  rationale: మత్తయి వంశావళి ఒకే సూత్రాన్ని పునరావృతం చేస్తూ పితృవంశ పరంపరను నేరుగా చెబుతుంది. బైబిలు వంశావళుల్లో తరాలు సంక్షిప్తం కావచ్చు గానీ, ఈ వచనంలో లేని విస్తృత ‘పూర్వీకుడు’ అనే భావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వంశావళి శైలి. పునరావృత నిర్మాణాన్ని నిలుపుతూ, పురాతన క్రియారూపాన్ని నివారించాం.
