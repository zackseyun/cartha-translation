  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: te
  text: యెస్సయి రాజైన దావీదుకు తండ్రి అయ్యాడు. దావీదు ఊరియా భార్య ద్వారా[a] సొలొమోనుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా, ‘ఊరియాకు చెందిన [స్త్రీ] నుండి’ అని ఉంది; అంటే, ‘ఊరియా భార్య ద్వారా.’ మత్తయి ఇక్కడ బత్షెబ పేరును చెప్పలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: కనెను
  rationale: వంశావళి సందర్భంలో పురుషుడు సంతానానికి తండ్రి కావడాన్ని తెలిపే γεννάω భావాన్ని సంక్షిప్తంగా, తెలుగు బైబిలు వంశావళి శైలికి తగిన గౌరవప్రదమైన రూపంలో వ్యక్తం చేస్తుంది.
- source_word: τὸν Δαυὶδ τὸν βασιλέα
  choice: రాజైన దావీదును
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న βασιλέα దావీదు రాజస్థానాన్ని ప్రత్యేకంగా ఉద్ఘాటిస్తుంది; ‘రాజైన దావీదు’ తెలుగులో సహజంగా అదే గుర్తింపును నిలుపుతుంది.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: ఊరియా భార్యవలన
  rationale: గ్రీకులో ‘ఊరియాకు చెందిన [స్త్రీ] నుండి’ అనే సంక్షిప్త ప్రయోగం ఉంది. ‘ఊరియా భార్యవలన’ ఆ భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, మత్తయి ఆమె పేరును చెప్పకుండా ఊరియాతో ఉన్న సంబంధం ద్వారా గుర్తించిన విధానాన్ని నిలుపుతుంది.
- source_word: Ἰεσσαὶ
  choice: యెస్సయి
  rationale: తెలుగులో స్థిరపడిన బైబిలు పేరురూపం.
- source_word: Δαυὶδ
  choice: దావీదు
  rationale: తెలుగులో స్థిరపడిన బైబిలు పేరురూపం.
- source_word: Σολομῶνα
  choice: సొలొమోను
  rationale: తెలుగులో స్థిరపడిన బైబిలు పేరురూపం.
- source_word: Οὐρίου
  choice: ఊరియా
  rationale: తెలుగులో స్థిరపడిన బైబిలు పేరురూపం.
- source_word: δέ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ వంశావళి క్రమాన్ని స్వల్పంగా అనుసంధానిస్తుంది. తెలుగులో వాక్యక్రమమే ఆ సంబంధాన్ని స్పష్టంగా చూపుతుంది; ప్రతి చోట ‘మరియు’ చేర్చడం అసహజంగా ఉంటుంది.
theological_decisions:
- issue: బత్షెబను మత్తయి పరోక్షంగా సూచించడం
  choice: ఆమె పేరును చేర్చకుండా ‘ఊరియా భార్యవలన’ అని ఉంచడం
  alternative: ‘బత్షెబవలన’ లేదా ‘మునుపు ఊరియా భార్యగా ఉన్న ఆమెవలన’
  rationale: మూల గ్రీకు స్త్రీని ఊరియాతో ఉన్న సంబంధం ద్వారా ఉద్దేశపూర్వకంగా గుర్తిస్తుంది. ఆమె పేరును చేర్చకపోవడం 2 సమూయేలు కథనానికి సంబంధించిన సాహిత్య, నైతిక ప్రతిధ్వనిని నిలుపుతుంది; ‘మునుపు’ అనే భావం మూలంలో స్పష్టంగా లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన గౌరవశైలిని ఉపయోగించాం. పేర్లకు తెలుగు బైబిలు సంప్రదాయంలో విస్తృతంగా తెలిసిన రూపాలను తీసుకున్నాం; మూలంలోని పరోక్ష సూచనను పాదసూచికతో స్పష్టం చేశాం.
