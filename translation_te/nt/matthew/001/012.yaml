id: MAT.1.12
reference: Matthew 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: te
  text: బబులోనుకు జరిగిన బలవంతపు తరలింపు తరువాత[a], యెకొన్యా షయల్తీయేలుకు తండ్రి అయ్యాడు; షయల్తీయేలు జెరుబ్బాబెలుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బబులోను ప్రవాసం తరువాత.” ఇక్కడి గ్రీకు పదం బలవంతంగా ప్రవాసానికి తరలించబడిన సంఘటనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: తరువాత
  rationale: μετάతో కూడిన ద్వితీయా విభక్తి కాలక్రమంలో ‘తరువాత’ అనే అర్థాన్ని ఇస్తుంది. δέ స్వల్ప అనుసంధాన పదం కాబట్టి సహజమైన తెలుగు వాక్యంలో ప్రత్యేకంగా అనువదించలేదు.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: బబులోనుకు బలవంతంగా తరలించబడిన
  rationale: μετοικεσία ప్రజలను వారి దేశం నుంచి బలవంతంగా తరలించి ప్రవాసంలో ఉంచిన చారిత్రక సంఘటనను సూచిస్తుంది. ఈ రూపం గమ్యస్థానాన్నీ బలవంతపు స్వభావాన్నీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἰεχονίας
  choice: యెకొన్యా
  rationale: గ్రీకు పేరుకు దగ్గరగా ఉండి, తెలుగు బైబిలు పాఠకులకు గుర్తుపట్టదగిన రూపాన్ని ఉపయోగించాం.
- source_word: ἐγέννησεν
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో γεννάω పురుష వంశక్రమాన్ని సూచిస్తుంది. ‘తండ్రి అయ్యాడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, ప్రతి సంబంధం తప్పనిసరిగా తక్షణ జీవసంబంధ పితృత్వమేనని అతిగా నిర్దేశించదు.
- source_word: Σαλαθιήλ
  choice: షయల్తీయేలు
  rationale: హీబ్రూ నేపథ్యానికి దగ్గరగా, తెలుగులో పలకడానికి అనువుగా ఉన్న సుపరిచిత బైబిలు నామరూపం.
- source_word: δὲ
  choice: ;
  rationale: రెండవ వంశావళి సంబంధాన్ని మొదటిదానికి జోడించే స్వల్ప అనుసంధానాన్ని తెలుగులో అర్ధవిరామంతో సహజంగా వ్యక్తం చేశాం.
- source_word: Ζοροβαβέλ
  choice: జెరుబ్బాబెలు
  rationale: మూల నామానికి దగ్గరగా ఉండే, తెలుగు బైబిలు సంప్రదాయంలో గుర్తుపట్టదగిన రూపం.
theological_decisions:
- issue: వంశావళిలో γεννάω అర్థం
  choice: ‘తండ్రి అయ్యాడు’ అని అనువదించి పురుష వంశక్రమాన్ని తెలియజేయడం
  alternative: ‘కన్నాడు’ లేదా ‘జన్మనిచ్చాడు’
  rationale: మత్తయి వంశావళి సంప్రదాయ పూర్వీకత్వ భాషను ఉపయోగిస్తుంది; అది ప్రతి దశలో తక్షణ జీవసంబంధ పితృత్వాన్ని తప్పనిసరిగా నిర్ధారించదు. ‘తండ్రి అయ్యాడు’ ఈ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. వంశావళి పునరుక్తిని ఉద్దేశపూర్వకంగా నిలిపి ఉంచాం.
