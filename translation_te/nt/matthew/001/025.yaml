id: MAT.1.25
reference: Matthew 1:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: te
  text: ఆమె ఒక కుమారునికి జన్మనిచ్చేవరకు అతడు ఆమెను ఎరుగలేదు.[a][b] అతడు ఆ బిడ్డకు యేసు అని పేరు పెట్టాడు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత స్పష్టంగా: ‘అతడు ఆమెతో దాంపత్య సంబంధం కలిగి ఉండలేదు.’ గ్రీకులో ‘ఆమెను ఎరుగలేదు’ అని ఉండి, ‘ఎరుగుట’ అనే మాట సౌమ్యోక్తిగా వాడబడింది.'
    reason: lexical_alternative
  - marker: b
    text: ‘జన్మనిచ్చేవరకు’ అనే మాట యేసు పుట్టేంతవరకు నిజంగా ఉన్న పరిస్థితిని సూచిస్తుంది; ఆ తరువాత ఏమి జరిగిందో ఈ మాట ఒక్కటే నిర్ణయించదు.
    reason: alternative_reading
  - marker: c
    text: 'మూలనిర్మాణానికి మరింత దగ్గరగా: ‘అతడు అతని పేరు యేసు అని పిలిచాడు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: ఎరుగలేదు
  rationale: ఈ సందర్భంలో గ్రీకు ‘తెలుసుకొను/ఎరుగుట’ అనే క్రియ దాంపత్య శారీరక సంబంధానికి సౌమ్యోక్తిగా వాడబడింది. ‘ఎరుగలేదు’ మూలంలోని సౌమ్యోక్తిని నిలుపుతుంది; స్పష్టమైన అర్థాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: ἕως οὗ
  choice: కనేవరకు
  rationale: ఈ కాలసూచక పదబంధం కుమారుని జననం వరకు ఉన్న పరిస్థితిని తెలియజేస్తుంది; ఆ తరువాత ఏమి జరిగిందో అది స్వతహాగా నిర్ణయించదు.
- source_word: ἔτεκεν
  choice: కనెను
  rationale: τίκτω అనే క్రియకు సహజమైన ఆధునిక తెలుగు ప్రయోగం; వాక్యంలో ‘కుమారుణ్ణి కనేవరకు’గా అమర్చబడింది.
- source_word: υἱόν
  choice: ఒక కుమారుణ్ణి
  rationale: గ్రీకు మూలంలో నిర్దిష్ట ఉపపదం లేనందున ‘ఒక కుమారుణ్ణి’ అని ఇవ్వడం సహజం; మూలంలో లేని ప్రత్యేక ఉద్ఘాటనను చేర్చదు.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: అతడు ఆ బిడ్డకు యేసు అని పేరు పెట్టాడు
  rationale: గ్రీకు-సెమిటిక్ నిర్మాణం అక్షరార్థంగా ‘అతని పేరు యేసు అని పిలిచాడు.’ ఆధునిక తెలుగులో అర్థవంతంగా, సహజంగా ఉండేందుకు ‘పేరు పెట్టాడు’ అని అనువదించబడింది; మరింత మూలనిర్మాణసన్నిహిత రూపం పాదటిప్పణిలో ఉంది.
- source_word: Ἰησοῦν
  choice: యేసు
  rationale: కొత్త నిబంధనలో ఈ వ్యక్తినామానికి స్థిరపడిన ప్రామాణిక తెలుగు రూపం ‘యేసు’.
theological_decisions:
- issue: ‘కనేవరకు’ అనే మాట మరియ తరువాత కూడా కన్యగానే ఉండిందా అనే ప్రశ్నకు ఇచ్చే సూచన
  choice: ἕως οὗను ‘కనేవరకు’ అని మాత్రమే అనువదించి, తరువాత దాంపత్య సంబంధాలు ఏర్పడ్డాయని గానీ ఏర్పడలేదని గానీ సూచించలేదు.
  alternative: కొందరు దీని నుండి తరువాత సాధారణ దాంపత్య సంబంధాలు మొదలయ్యాయని ఊహిస్తారు; మరికొందరు ఈ పదబంధం తరువాతి పరిస్థితిలో మార్పును సూచించదని భావిస్తారు.
  rationale: గ్రీకు కాలసూచక పదబంధం యేసు జననం వరకు నిజమైన విషయాన్ని మాత్రమే స్పష్టంగా చెబుతుంది. తరువాత ఏమి జరిగిందనే ప్రశ్నను ఈ పదబంధం ఒక్కటే తేల్చదు; అందువల్ల అనువాదం ఆ వేదాంతపరమైన ఉద్రిక్తతను అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఎరుగలేదు’ కొంత శాస్త్రగ్రంథ శైలిని కలిగివున్నా, మూలంలోని ఉద్దేశపూర్వక సౌమ్యోక్తిని కాపాడుతుంది; దాని భావం పాదటిప్పణిలో స్పష్టీకరించబడింది. రెండో వాక్యంలో సహజమైన తెలుగు కోసం ‘ఆ బిడ్డకు ... పేరు పెట్టాడు’ ఉపయోగించబడింది.
