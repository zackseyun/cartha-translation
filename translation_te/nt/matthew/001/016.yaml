id: MAT.1.16
reference: Matthew 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: te
  text: యాకోబు మరియ భర్తయైన యోసేపుకు తండ్రి అయ్యాడు; మరియ నుండి మెస్సీయ అని పిలువబడే యేసు జన్మించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్య కొనసాగింపులో చూపడం
  rationale: ఇక్కడ δέ వంశావళిని స్వల్పంగా ముందుకు నడిపే సంధాయకం. తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చడం అసహజంగా ఉండవచ్చు; వాక్యక్రమమే దాని కొనసాగింపు భావాన్ని అందిస్తుంది.
- source_word: ἐγέννησεν
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళిలోని పురుష వంశసంబంధాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘కనెను’ అనే పాత ప్రయోగంలోని అస్పష్టతను నివారిస్తుంది.
- source_word: τὸν ἄνδρα Μαρίας
  choice: మరియ భర్తయైన
  rationale: మరియతో యోసేపుకున్న వైవాహిక సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐξ ἧς
  choice: ఆ మరియ నుండి
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం ప్రత్యేకంగా మరియనే సూచిస్తుంది. ‘ఆ మరియ’ ఆ సూచనను స్పష్టం చేస్తూ, ἐκ లోని ‘నుండి’ భావాన్ని నిలుపుతుంది.
- source_word: ἐγεννήθη
  choice: జన్మించాడు
  rationale: క్రియాశీల పురుష-వంశ సూత్రం నుండి యేసు జననం గురించి చెప్పే కర్మణి రూపానికి వచ్చిన మార్పును సహజ తెలుగులో నిలుపుతుంది.
- source_word: ὁ λεγόμενος
  choice: అని పిలువబడే
  rationale: యేసుకు సాధారణంగా వర్తింపజేసే బిరుదును నేరుగా గుర్తించే గ్రీకు ప్రయోగాన్ని ప్రతిబింబిస్తుంది.
- source_word: χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ χριστός పేరు వలె కాక బిరుదుగా, ‘అని పిలువబడే’ అనే గుర్తింపు సూత్రంలో వాడబడింది; అందువల్ల దాని అభిషిక్త-రాజు భావాన్ని తెలిపే ‘మెస్సీయ’ అనువైనది.
theological_decisions:
- issue: χριστός అనే క్రీస్తుసంబంధ బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ὁ λεγόμενος χριστός లో χριστός స్పష్టంగా బిరుదుగా పనిచేస్తుంది. అందువల్ల దానిని పేరు రూపంగా లిప్యంతరీకరించకుండా బిరుదు భావంతో అనువదించాం.
- issue: యోసేపు వంశసంబంధం నుండి యేసు జననానికి మారే వాక్య నిర్మాణం
  choice: యాకోబు యోసేపుకు తండ్రి అయ్యాడని, యేసు మరియ నుండి జన్మించాడని వేర్వేరు నిర్మాణాలతో చెప్పడం
  alternative: యోసేపే యేసుకు తండ్రి అయ్యాడనేలా ఒకే వంశావళి సూత్రాన్ని కొనసాగించడం
  rationale: గ్రీకులో యాకోబు–యోసేపు సంబంధానికి క్రియాశీల ἐγέννησεν ఉండగా, యేసు విషయంలో స్త్రీలింగ ἐξ ἧς తో కర్మణి ἐγεννήθη ఉంది. అనువాదం ఈ ఉద్దేశపూర్వక మార్పును అదనపు సిద్ధాంత వివరణ లేకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభమైన శైలి. ‘కనెను’ వంటి ప్రాచీన వంశావళి పదబంధం బదులు ‘తండ్రి అయ్యాడు’ వాడబడింది. రెండవ భాగంలో ‘మెస్సీయ అని పిలువబడే యేసు’ అని ఉంచడం ద్వారా గ్రీకులో యేసు పేరుతో బిరుదుకున్న సన్నిహిత అనుబంధం నిలుపబడింది.
