id: MAT.1.17
reference: Matthew 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: te
  text: కాబట్టి, అబ్రాహాము నుండి దావీదు వరకు ఉన్న తరాలన్నీ పద్నాలుగు తరాలు; దావీదు నుండి బబులోనుకు చెరగా తరలించబడిన కాలం వరకు పద్నాలుగు తరాలు; బబులోనుకు చెరగా తరలించబడిన కాలం నుండి మెస్సీయ[a] వరకు పద్నాలుగు తరాలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.” గ్రీకు పదమైన χριστός అంటే “అభిషిక్తుడు”; ఇక్కడ అది బిరుదుగా వాడబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: కాబట్టి ... ఉన్న తరాలన్నీ
  rationale: οὖν యొక్క సంగ్రహాత్మక భావాన్ని ‘కాబట్టి’ తెలియజేస్తుంది; Πᾶσαι αἱ γενεαὶ లోని సమగ్రతను ‘తరాలన్నీ’ స్పష్టంగా నిలుపుతుంది.
- source_word: ἀπὸ ... ἕως
  choice: నుండి ... వరకు
  rationale: వంశావళిలోని రెండు హద్దుల మధ్య కాలవ్యాప్తిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γενεαὶ δεκατέσσαρες
  choice: పద్నాలుగు తరాలు
  rationale: మూడు భాగాల్లోనూ పునరావృతమయ్యే గ్రీకు పదబంధపు సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: బబులోనుకు చెరగా తరలించబడిన కాలం
  rationale: μετοικεσία బలవంతపు తరలింపు లేదా దేశబహిష్కరణ సంఘటనను సూచిస్తుంది. ‘చెరగా తరలించబడిన’ అనేది గమ్యస్థానమైన బబులోనును, తరలింపు భావాన్ని రెండింటినీ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ χριστός వ్యక్తిపేరుగా కాక, వంశావళి చేరుకునే అభిషిక్తుడనే బిరుదుగా పనిచేస్తుంది; అందువల్ల అర్థాన్ని తెలిపే ‘మెస్సీయ’ను వాడాం.
- source_word: Ἀβραὰμ / Δαυὶδ / Βαβυλῶνος
  choice: అబ్రాహాము / దావీదు / బబులోను
  rationale: ఆధునిక తెలుగు బైబిలు వాడుకలో సుపరిచితమైన నామరూపాలను అనుసరిస్తుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న τοῦ χριστοῦ ఇక్కడ వంశావళి యొక్క మెస్సీయ సంబంధమైన ముగింపును సూచిస్తుంది. ‘మెస్సీయ’ బిరుదు భావాన్ని వెల్లడిస్తుంది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. గ్రీకులోని మూడు సమాంతర కాలవిభాగాలను అర్ధవిరామాలతో నిలిపి, అనవసర క్రియాపద పునరావృతిని నివారించాం.
