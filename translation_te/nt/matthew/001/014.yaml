id: MAT.1.14
reference: Matthew 1:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: te
  text: అజోరు సాదోకుకు తండ్రి అయ్యాడు; సాదోకు అఖీముకు తండ్రి అయ్యాడు; అఖీము ఎలీయూదుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: అజోరు
  rationale: గ్రీకు వ్యక్తినామాన్ని ఆధునిక తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: δέ
  choice: ; (వాక్య నిర్మాణంలో అనుసంధానం)
  rationale: వంశావళిలో ఇది వరుసగా వచ్చే అంశాలను కలిపే సాధారణ అనుసంధాన పదం. తెలుగులో ప్రతి సారి ‘మరియు’ అని పెట్టకుండా అర్ధవిరామాలతో సహజమైన వరుసను నిలిపాం.
- source_word: ἐγέννησεν
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో పురుషుని ద్వారా జననం లేదా వంశ సంబంధాన్ని సూచిస్తుంది. ప్రాచీనంగా వినిపించే ‘కన్నాడు’ కంటే ‘తండ్రి అయ్యాడు’ ఆధునికంగా, గౌరవప్రదంగా ఉండి, మూలంలోని సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸν
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: గ్రీకులో వ్యక్తినామాన్ని ప్రత్యక్ష కర్మగా సూచించే విభక్త్యర్థక ఉపపదం; తెలుగులో దాని పని ‘-కు’ విభక్తి మరియు వాక్య నిర్మాణం ద్వారా వ్యక్తమవుతుంది.
- source_word: Σαδώκ
  choice: సాదోకు
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగు ధ్వని విధానానికి తగినట్లు లిప్యంతరీకరించాం.
- source_word: Ἀχίμ
  choice: ఆకీము
  rationale: గ్రీకు వ్యక్తినామంలోని దీర్ఘ అచ్చులు, ఘర్ష ధ్వనికి సమీపమైన తెలుగు రూపంతో లిప్యంతరీకరించాం.
- source_word: Ἐλιούδ
  choice: ఎలీయూదు
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగు ధ్వని విధానానికి తగినట్లు లిప్యంతరీకరించాం.
theological_decisions:
- issue: ἐγέννησεν ప్రత్యక్ష తండ్రితనాన్నే సూచిస్తుందా, లేక విస్తృత వంశ సంబంధాన్నీ అనుమతిస్తుందా?
  choice: తండ్రి అయ్యాడు
  alternative: కన్నాడు / పుట్టించాడు
  rationale: మూలంలోని వంశావళి సూత్రాన్ని నేరుగా ఉంచుతూ, ప్రతి సంబంధం తప్పనిసరిగా తక్షణ జీవశాస్త్రీయ తండ్రితనమేనని అదనంగా నిర్ధారించకుండా ఉండే సహజ తెలుగు రూపాన్ని ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వంశావళికి తగిన సంక్షిప్తమైన మరియు గౌరవప్రదమైన శైలి. పేర్లకు తెలుగు వాక్యంలో సహజంగా విభక్తి ప్రత్యయాలు జోడించబడ్డాయి.
