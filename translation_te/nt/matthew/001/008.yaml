id: MAT.1.8
reference: Matthew 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: te
  text: ఆసాఫు యెహోషాపాతును కన్నాడు[a]. యెహోషాపాతు యోరామును కన్నాడు. యోరాము ఉజ్జియాను కన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “ఆసాఫు”కు బదులుగా “ఆసా” అని ఉంది; పాత నిబంధన వంశావళిలో పేర్కొన్న యూదా రాజు పేరు కూడా “ఆసా.”
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: ఆసాఫు
  rationale: SBLGNT ప్రధాన పాఠంలోని Ἀσὰφ రూపాన్ని పేరుగా లిప్యంతరీకరించాం; పాత నిబంధన వంశావళికి అనుగుణంగా ‘ఆసా’ అని నిశ్శబ్దంగా మార్చలేదు.
- source_word: δὲ
  choice: వాక్య విభజన ద్వారా మృదు అనుసంధానం
  rationale: వంశావళిలో δέ విరోధార్థకం కాదు; తెలుగులో ప్రతి సంబంధాన్ని చిన్న వాక్యంగా చెప్పడం సహజంగా ఉండి, క్రమాన్నీ నిలుపుతుంది.
- source_word: ἐγέννησεν
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళిలోని పితృసంబంధాన్ని ఆధునిక సాధారణ తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘కన్నాడు’ కంటే పురుష కర్తకు సహజంగా, ‘జన్మనిచ్చాడు’ కంటే తక్కువ కృత్రిమంగా ఉంటుంది.
- source_word: Ἰωσαφάτ
  choice: యెహోషాపాతు
  rationale: పాత నిబంధనలోని రాజు పేరుతో గుర్తించదగిన, తెలుగులో ప్రాచుర్యంలో ఉన్న రూపం.
- source_word: Ἰωράμ
  choice: యోరాము
  rationale: గ్రీకు Ἰωράμ రూపానికి సమీపమైన, తెలుగులో సహజమైన లిప్యంతరీకరణ.
- source_word: Ὀζίαν
  choice: ఉజ్జియా
  rationale: యూదా రాజుకు తెలుగులో గుర్తించదగిన పాత నిబంధన పేరు; గ్రీకు విభక్తి అంత్యాన్ని అనుసరించకుండా పేరుమూల రూపాన్ని వాడాం.
theological_decisions:
- issue: పునరావృతమయ్యే δὲ మరియు ἐγέννησεν గల వంశక్రమాన్ని ఎలా అందించాలి
  choice: ప్రతి తండ్రి–కుమారుని సంబంధాన్ని ప్రత్యేక చిన్న వాక్యంగా పునరావృతం చేయడం
  alternative: అన్ని సంబంధాలను ఒకే వాక్యంలో అనుసంధానించడం
  rationale: ఇది సిద్ధాంత నిర్ణయం కాదు. చిన్న వాక్యాలు ఆధునిక తెలుగులో స్పష్టంగా ఉండి, మూలంలోని ప్రతి వంశసంబంధాన్ని పూర్తిగా నిలుపుతాయి.
- issue: Ἀσὰφ అనే పాఠాన్ని ఆశించబడే ‘ఆసా’ పేరుతో సమన్వయపరచాలా
  choice: ప్రధాన పాఠంలో ‘ఆసాఫు’ ఉంచి, ‘ఆసా’ పాఠభేదాన్ని పాదసూచికలో ఇవ్వడం
  alternative: పాత నిబంధన వంశావళికి అనుగుణంగా ప్రధాన పాఠంలోనే ‘ఆసా’ అని పెట్టడం
  rationale: మూలభాషా పాఠానికి ప్రాధాన్యం ఇస్తూ SBLGNTలో ఉన్న పేరునే ప్రధాన పాఠంలో ఉంచాం. చారిత్రక వంశావళితో ఉన్న ఉద్రిక్తతను తొలగించకుండా పాఠకునికి పాదసూచికలో వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదంగా మరియు సంక్షిప్తంగా ఉంది. వంశావళి పునరుక్తిని స్పష్టత కోసం నిలిపి, పాఠభేదాన్ని ప్రధాన పాఠంలో సమన్వయపరచకుండా పాదసూచికలో తెలిపాం.
