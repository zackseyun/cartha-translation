  terminology: 'The royal names are recognizable and consistent: యెహోషాపాతు, యోరాము, and ఉజ్జియా. “ఆసాఫు” accurately represents the Greek main-text form. The textual-variant note correctly identifies “ఆసా” and its connection with the Judean king in the Old Testament genealogy.'
