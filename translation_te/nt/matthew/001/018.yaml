id: MAT.1.18
reference: Matthew 1:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: te
  text: 'యేసు మెస్సీయ యొక్క జననం ఈ విధంగా జరిగింది: ఆయన తల్లి మరియకు యోసేపుతో వివాహ నిశ్చయం జరిగినప్పుడు[b], వారు కలవకముందే[c], ఆమె పరిశుద్ధాత్మ వలన గర్భవతిగా ఉన్నట్లు తెలిసింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ఇక్కడ ‘వివాహ నిశ్చయం’ అనేది ఆధునిక నిశ్చితార్థం కంటే మరింత బద్ధమైన, చట్టబద్ధంగా గుర్తించబడిన వివాహ ఒప్పందాన్ని సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: ‘వారు కలవకముందే’ అనే మాట దాంపత్య సంయోగం ఇంకా జరగకముందు అనే భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: జననం
  rationale: ఈ సందర్భంలో ఈ పదం యేసు జననానికి సంబంధించిన ఆరంభాన్ని సూచిస్తుంది. ‘జననం’ సహజమైన ఆధునిక తెలుగు రూపం; ‘ఆవిర్భావం/మూలం’ అనే విస్తృత భావం సందర్భంలో ఉన్నప్పటికీ దానిని అనవసరంగా ముందుకు తేవదు.
- source_word: Ἰησοῦ χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది. అందువల్ల దాని భావాన్ని నిలుపుతూ ‘మెస్సీయ’ అని అనువదించబడింది; ‘క్రీస్తు’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: οὕτως ἦν
  choice: ఈ విధంగా జరిగింది
  rationale: సంభవించిన ఘటన ఏ విధంగా జరిగిందో పరిచయం చేసే గ్రీకు ప్రయోగాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μνηστευθείσης
  choice: వివాహ నిశ్చయం జరిగిన తర్వాత
  rationale: ఇది సాధారణ ఆధునిక నిశ్చితార్థం కంటే చట్టపరంగా మరింత బద్ధమైన వివాహ ఒప్పందాన్ని సూచిస్తుంది. ప్రధాన వాక్యంలో సహజమైన పదబంధాన్ని ఉపయోగించి, దాని సాంస్కృతిక బలం పాదసూచికలో వివరించబడింది.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: వారు కలిసి ఉండకముందే
  rationale: గ్రీకు మర్యాదాపూర్వక ప్రయోగంలోని ఉద్దేశపూర్వక విస్తృతతను కాపాడుతుంది. ఇది కలిసి కాపురం చేయడాన్ని సూచించగలదు; దాంపత్య సంయోగ భావం కూడా ఉండవచ్చని పాదసూచిక తెలియజేస్తుంది.
- source_word: εὑρέθη
  choice: ఉన్నట్లు తెలిసింది
  rationale: గ్రీకు నిష్క్రియారూపంలోని ‘తెలియవచ్చింది/కనుగొనబడింది’ అనే భావాన్ని అసహజమైన పదశః తెలుగు లేకుండా సహజంగా అందిస్తుంది.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: గర్భవతిగా ఉన్నట్లు
  rationale: ‘గర్భంలో కలిగి ఉండటం’ అనే గ్రీకు నుడికారానికి ఆధునిక తెలుగులో సహజమైన సమానార్థక రూపం.
- source_word: ἐκ πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మ మూలంగా
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవాన్ని ‘మూలంగా’ స్పష్టంగా తెలియజేస్తుంది; సందర్భంలో ఇది దేవుని పరిశుద్ధాత్మను సూచిస్తుంది.
theological_decisions:
- issue: Χριστός పదం అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ కథన పరిచయంలో ఇది పేరులోని స్థిర భాగంలా కాక బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ దాని అర్థాన్ని స్పష్టంగా నిలుపుతుంది; సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఉంచడం ద్వారా ప్రత్యామ్నాయాన్ని దాచలేదు.
- issue: πνεύματος ἁγίου యొక్క సూచన
  choice: పరిశుద్ధాత్మ
  alternative: పరిశుద్ధమైన ఆత్మ
  rationale: మత్తయి జనన కథనం సందర్భంలో ఈ అనిర్దిష్ట ఉపపదం లేని గ్రీకు పదబంధం ఏదో ఒక ఆత్మను కాక దేవుని పరిశుద్ధాత్మను సూచిస్తుంది. గ్రీకులో ఉపపదం లేకపోవడం దానిని అనిర్దిష్టంగా చేయదు.
- issue: συνελθεῖν యొక్క దాంపత్య భావం
  choice: కలిసి ఉండటం
  alternative: దాంపత్యంగా కలవటం
  rationale: ఈ గ్రీకు ప్రయోగం కలిసి కాపురం చేయడం మరియు దాంపత్య సంయోగం రెండింటి వైపూ సూచించగలదు. ప్రధాన పాఠంలో దాని మర్యాదాపూర్వక అస్పష్టతను నిలిపి, సాధ్యమైన ప్రత్యేక భావాన్ని పాదసూచికలో పేర్కొనబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ‘వివాహ నిశ్చయం’ సాధారణ పాఠకునికి అర్థమయ్యేలా ఉండగా దాని ప్రాచీన చట్టపరమైన బలం పాదసూచికలో నిలుపబడింది. ‘కలిసి ఉండకముందే’ గ్రీకు మర్యాదాపూర్వక అస్పష్టతను అతిగా నిర్దిష్టం చేయకుండా కాపాడుతుంది.
