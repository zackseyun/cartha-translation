id: MAT.1.5
reference: Matthew 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σαλμὼν δὲ ἐγέννησεν τὸν ⸂Βόες ἐκ τῆς Ῥαχάβ, Βόες⸃ δὲ ἐγέννησεν τὸν ⸂Ἰωβὴδ ἐκ τῆς Ῥούθ, Ἰωβὴδ⸃ δὲ ἐγέννησεν τὸν Ἰεσσαί,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/005.yaml
  text: Salmon fathered Boaz by Rahab[a], and Boaz fathered Obed by Ruth, and Obed fathered Jesse,
translation:
  language: te
  text: శల్మోను రాహాబు ద్వారా బోయజుకు తండ్రయ్యాడు[a], బోయజు రూతు ద్వారా ఓబేదుకు తండ్రయ్యాడు[a], ఓబేదు యెష్షయికి తండ్రయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రాహాబు నుండి,’ ‘రూతు నుండి’ అని కూడా అనువదించవచ్చు. గ్రీకు పాఠంలో ప్రతి తల్లి పేరుతో ἐκ (‘నుండి’) వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: తండ్రి అయ్యాడు
  rationale: ఈ వంశావళిలో పురుషుని ద్వారా కొనసాగిన వంశసంబంధాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘కనెను’ కంటే ‘తండ్రి అయ్యాడు’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἐκ
  choice: ద్వారా
  rationale: తల్లి పేరుతో వచ్చిన ἐκ ఆమె ద్వారా కలిగిన సంతానమని సూచిస్తుంది. ‘ద్వారా’ అనే పదం తల్లి ప్రస్తావనను స్పష్టంగా ఉంచుతూ సహజమైన తెలుగు ప్రయోగాన్ని ఇస్తుంది; మూలార్థంలోని ‘నుండి’ భావాన్ని పాదసూచికలో నిలిపాం.
- source_word: δὲ
  choice: వేర్వేరు వాక్యాలుగా సహజ అనుసంధానం
  rationale: ఇక్కడ δέ వ్యతిరేకార్థకం కాదు; వంశావళిలో తదుపరి తరాన్ని కలిపే స్వల్ప సంధాయకం. తెలుగులో వరుస చిన్న వాక్యాలే ఈ అనుసంధానాన్ని సహజంగా తెలియజేస్తాయి; ప్రతిసారి ‘మరియు’ చేర్చడం కృత్రిమంగా ఉంటుంది.
- source_word: Σαλμὼν
  choice: శల్మోను
  rationale: తెలుగు బైబిలు వాడుకలో గుర్తింపుపొందిన పేరురూపం.
- source_word: Βόες
  choice: బోయజు
  rationale: పాత నిబంధనలోని అదే వ్యక్తితో గుర్తింపు, గ్రంథాంతర కొనసాగింపు నిలిచే ప్రామాణిక తెలుగు పేరురూపం.
- source_word: Ῥαχάβ
  choice: రాహాబు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితమైన పేరురూపం.
- source_word: Ἰωβὴδ
  choice: ఓబేదు
  rationale: పాత నిబంధనలోని అదే పేరుతో గ్రంథాంతర కొనసాగింపును నిలిపే ప్రామాణిక తెలుగు రూపం.
- source_word: Ῥούθ
  choice: రూతు
  rationale: పాత నిబంధన గ్రంథం మరియు వ్యక్తితో అనుసంధానాన్ని నిలిపే సుపరిచిత తెలుగు పేరురూపం.
- source_word: Ἰεσσαί
  choice: యెష్షయి
  rationale: తెలుగు బైబిలు వాడుకలో దావీదు తండ్రిగా గుర్తింపుపొందిన ప్రామాణిక పేరురూపం.
theological_decisions:
- issue: వంశావళి సూత్రంలో తల్లుల స్పష్టమైన ప్రస్తావన
  choice: ‘రాహాబు ద్వారా’, ‘రూతు ద్వారా’ అని తల్లుల పేర్లను స్పష్టంగా ఉంచుతూ, ‘తండ్రి అయ్యాడు’ అనే పితృవంశ సూత్రాన్ని కొనసాగించడం.
  alternative: కేవలం ‘బోయజుకు తండ్రి అయ్యాడు’ అని తల్లుల ప్రస్తావనను వదలడం; లేదా మరింత పదానువాదంగా ‘రాహాబు నుండి’ అని రాయడం.
  rationale: గ్రీకు పాఠం ἐκ తో తల్లులను ప్రత్యేకంగా పేర్కొంటుంది. అనువాదం ఆ విశేషాన్ని తగ్గించకూడదు; అదే సమయంలో వంశావళిలోని పితృపరంపరను కూడా స్పష్టంగా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండేలా ‘కనెను’ అనే పాతకాలపు వంశావళి ప్రయోగానికి బదులుగా ‘తండ్రి అయ్యాడు’ వాడబడింది. పేర్లు తెలుగు బైబిలు పాఠకులకు సుపరిచితమైన రూపాల్లో ఇవ్వబడ్డాయి.
