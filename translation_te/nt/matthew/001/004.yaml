id: MAT.1.4
reference: Matthew 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀρὰμ δὲ ἐγέννησεν τὸν Ἀμιναδάβ, Ἀμιναδὰβ δὲ ἐγέννησεν τὸν Ναασσών, Ναασσὼν δὲ ἐγέννησεν τὸν Σαλμών,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: te
  text: అరాము[a] అమ్మీనాదాబుకు తండ్రి అయ్యాడు; అమ్మీనాదాబు నయస్సోనుకు తండ్రి అయ్యాడు; నయస్సోను సల్మోనుకు తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాము.’ గ్రీకు పాఠంలో ‘అరాము’ (Ἀράμ) అని ఉంది; హీబ్రూ వంశావళిలోని నామరూపాన్ని అనుసరించి అనేక అనువాదాలు ‘రాము’ అని ఇస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: అరాము
  rationale: గ్రీకు రూపమైన Ἀράμ‌ను నేరుగా ప్రతిబింబించేలా వ్యక్తి పేరును లిప్యంతరీకరించాం. హీబ్రూ వంశావళి రూపానికి అనుగుణమైన ‘రాము’ను పాదసూచికలో ఉంచాం.
- source_word: δὲ
  choice: వాక్యఖండాల వరుస ద్వారా వ్యక్తీకరణ
  rationale: ఇక్కడ δέ విరోధాన్ని కాకుండా వంశావళి క్రమాన్ని ముందుకు నడిపే అనుసంధానకంగా పనిచేస్తుంది. తెలుగులో ప్రతి ఖండంలో ‘మరియు’ అని పునరావృతం చేయకుండా అర్థాన్ని సహజమైన వరుస నిర్మాణంతో తెలిపాం.
- source_word: ἐγέννησεν
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో పురుష వంశసంబంధాన్ని తెలిపే γεννάωకు ఇది స్పష్టమైన, ఆధునిక తెలుగు ప్రయోగం. పాతకాలపు ‘కనెను’ కంటే సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: Ἀμιναδάβ
  choice: అమ్మీనాదాబు
  rationale: గ్రీకు వ్యక్తి పేరులోని ధ్వనులను తెలుగులో గుర్తించదగిన రీతిలో లిప్యంతరీకరించాం.
- source_word: Ναασσών
  choice: నయస్సోను
  rationale: తెలుగు బైబిలు సంప్రదాయంలో గుర్తించదగిన నామరూపాన్ని ఉపయోగించాం; ఇది సంబంధిత హీబ్రూ పేరుతోనూ అనుసంధానాన్ని నిలుపుతుంది.
- source_word: Σαλμών
  choice: శల్మోను
  rationale: గ్రీకు పేరును తెలుగు ధ్వని, బైబిలు నామసంప్రదాయాలకు సహజంగా ఉండే రూపంలో ఇచ్చాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వంశావళి శైలి. పునరావృత గ్రీకు నిర్మాణాన్ని నిలుపుతూ, తెలుగు ప్రవాహం కోసం ఖండాలను అర్ధవిరామాలతో అనుసంధానించాం.
