id: MAT.1.3
reference: Matthew 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: te
  text: యూదా తామారు ద్వారా పెరెసు, జెరహులకు తండ్రి అయ్యాడు. పెరెసు హెస్రోనుకు తండ్రి అయ్యాడు; హెస్రోను అరాముకు[a] తండ్రి అయ్యాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ఆంగ్ల అనువాదాలు, ఇతర వంశావళులలోని పేరు రూపాన్ని అనుసరించి, ఇక్కడ “రాము” అని ఇస్తాయి; ఇక్కడి గ్రీకు పాఠంలో “అరాము” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: యూదా
  rationale: ఇక్కడ పితరుడైన యూదాను సూచిస్తుంది; కొత్త నిబంధనలోని ‘యూదా/యూదాసు’ అనే ఇతర వ్యక్తులతో గందరగోళం రాకుండా, పాత నిబంధనలో స్థిరపడిన తెలుగు రూపాన్ని అనుసరించాం.
- source_word: δὲ
  choice: వాక్య విభజన మరియు ‘;’ ద్వారా క్రమసంబంధం
  rationale: ఇక్కడ δέ వ్యతిరేకతను కాక వంశావళిలోని తదుపరి దశను సూచించే స్వల్ప అనుసంధాన పదం. సహజమైన తెలుగులో ప్రతిసారీ ప్రత్యేక పదంగా అనువదించకుండా వాక్య నిర్మాణంలో వ్యక్తపరిచాం.
- source_word: ἐγέννησεν
  choice: తండ్రి అయ్యాడు
  rationale: వంశావళి సందర్భంలో పురుషుని జనకత్వాన్ని తెలిపే సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగు ప్రయోగం; ‘కన్నాడు’కంటే లింగపరంగా స్పష్టమైనది, ‘జన్మనిచ్చాడు’కంటే సహజమైనది.
- source_word: Φαρὲς
  choice: పెరెసు
  rationale: హీబ్రూ פֶּרֶץ పేరుకు అనుగుణంగా, పాత నిబంధనతో పేరుల కొనసాగింపును నిలుపుకునే తెలుగు లిప్యంతరీకరణ.
- source_word: Ζάρα
  choice: జెరహు
  rationale: హీబ్రూ זֶרַח పేరుకు అనుగుణంగా, పాత నిబంధనలోని వ్యక్తితో గుర్తింపు కొనసాగించే రూపం.
- source_word: ἐκ τῆς Θαμάρ
  choice: తామారు ద్వారా
  rationale: ἐκ తల్లి ద్వారా వచ్చిన సంతాన సంబంధాన్ని సూచిస్తుంది. ‘ద్వారా’ ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; మూలంలోని తల్లి ప్రస్తావనను నిలుపుతుంది.
- source_word: Θαμάρ
  choice: తామారు
  rationale: పేరు యొక్క గ్రీకు రూపానికి, దాని హీబ్రూ నేపథ్యానికి అనుగుణమైన తెలుగు లిప్యంతరీకరణ.
- source_word: Ἑσρώμ
  choice: హెస్రోను
  rationale: హీబ్రూ חֶצְרוֹן పేరుతో వేదగ్రంథాంతర కొనసాగింపును నిలుపుకునే తెలుగు రూపం.
- source_word: Ἀράμ
  choice: అరాము
  rationale: ఇచ్చిన SBLGNT గ్రీకు పాఠం Ἀράμను నేరుగా అనుసరించాం; ఇతర వంశావళులలో కనిపించే ‘రాము’తో మౌనంగా సమన్వయపరచలేదు.
theological_decisions:
- issue: చివరి పేరును పాత నిబంధనలో సాధారణంగా కనిపించే రూపంతో సమన్వయపరచాలా?
  choice: అరాము
  alternative: రాము
  rationale: మూలభాషా పాఠానికి ప్రాధాన్యం ఇచ్చి, ఇక్కడ ఉన్న గ్రీకు Ἀράμను ప్రధాన పాఠంలో ప్రతిబింబించాం. పాఠకులు ఇతర వంశావళుల కారణంగా ఆశించగల ‘రాము’ రూపాన్ని పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన వంశావళి శైలి. పేర్లకు పాత నిబంధనతో కొనసాగింపును సాధ్యమైనంతగా నిలిపి, Ἀράμ విషయంలో మాత్రం ఇచ్చిన గ్రీకు పాఠాన్ని నేరుగా అనుసరించాం.
