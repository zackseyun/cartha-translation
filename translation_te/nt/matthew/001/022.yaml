  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: te
  text: 'ఇదంతా ప్రభువు ప్రవక్త ద్వారా పలికించినది నెరవేరేలా జరిగింది[a]. ప్రవక్త ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ సంగతంతా జరిగింది.” గ్రీకు పదబంధం τοῦτο δὲ ὅλον ఇప్పుడే వివరించిన సంఘటనల సంపూర్ణతను నొక్కిచెబుతుంది.
    reason: పదప్రయోగ ప్రత్యామ్నాయం మరియు సమగ్రతపై గ్రీకు నొక్కును వివరించడం
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: ఇదంతా
  rationale: τοῦτο సూచిస్తున్న మునుపటి సంఘటనలన్నిటినీ ὅλον సమగ్రంగా నొక్కిచెబుతుంది. δέ ఇక్కడ బలమైన వ్యతిరేకతకన్నా కథన కొనసాగింపును సూచిస్తుంది; తెలుగులో అదనపు కాలసూచక పదం లేకుండానే సహజంగా వ్యక్తమవుతుంది.
- source_word: γέγονεν
  choice: జరిగింది
  rationale: γίνομαι పరిపూర్ణ కాలరూపం తెలిపే సంఘటనను ఆధునిక తెలుగు కథనశైలిలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἵνα πληρωθῇ
  choice: నెరవేరేలా
  rationale: ἵναతో వచ్చిన కర్మణి ప్రయోగంలోని సంభావనార్థక రూపాన్ని నిలుపుతూ, దైవ ఉద్దేశం మరియు సంభవించిన ఫలితం రెండింటి మధ్య ఉన్న భావసాంద్రతను అతిగా నిర్ణయించకుండా ఉంచుతుంది.
- source_word: τὸ ῥηθὲν
  choice: చెప్పిన మాట
  rationale: నామవాచకంగా వాడిన కర్మణి భూతకృదంతాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, ప్రవచన వాక్యాన్ని సూచిస్తుంది.
- source_word: ὑπὸ κυρίου
  choice: ప్రభువు ... చెప్పిన
  rationale: ὑπόతో ఉన్న కర్తృత్వాన్ని ప్రభువే ఆ మాటకు మూలవక్తగా ఉండేలా వ్యక్తపరుస్తుంది; గ్రీకులో లేని ‘దేవుడు’ అనే పదాన్ని చేర్చదు.
- source_word: διὰ τοῦ προφήτου
  choice: ప్రవక్త ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే మధ్యవర్తిత్వాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: λέγοντος
  choice: ప్రవక్త ఇలా అన్నాడు
  rationale: తదుపరి వచనంలోని ఉద్ధరణను పరిచయం చేసే కృదంతాన్ని తెలుగులో అసహజంగా వేలాడే నిర్మాణంగా కాకుండా సంపూర్ణ వాక్యంగా అందిస్తుంది; వ్యాకరణపరంగా ఇది ప్రవక్తను సూచిస్తుంది.
theological_decisions:
- issue: ప్రవచన ప్రేరణలో కర్తృత్వం
  choice: ప్రభువు మూలవక్త, ప్రవక్త మధ్యవర్తి అనే భేదాన్ని ‘ప్రభువు ప్రవక్త ద్వారా చెప్పిన’ అని నిలుపుట
  alternative: ప్రభువు నుండి ప్రవక్త చెప్పిన
  rationale: గ్రీకు పాఠం ప్రభువుకు ὑπόను, ప్రవక్తకు διάను వాడి వారి పాత్రలను వేరు చేస్తుంది. అనువాదం ఆ భేదాన్ని సిద్ధాంతపరంగా విస్తరించకుండా కాపాడుతుంది.
- issue: నెరవేర్పు సూత్రంలోని ఉద్దేశం–ఫలితం సంబంధం
  choice: నెరవేరేలా
  alternative: నెరవేరడానికి; దాంతో నెరవేరింది
  rationale: ἵνα + సంభావనార్థక రూపం ఉద్దేశాన్ని లేదా ఫలితాన్ని, కొన్నిసార్లు రెండింటి సాంద్రతను సూచించగలదు. ‘నెరవేరేలా’ ఆ భావాన్ని ఏకపక్షంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే శైలి. ‘ప్రవక్త ఇలా అన్నాడు’ అనేది తదుపరి ఉద్ధరణకు సహజమైన తెలుగు పరిచయం; మూలంలోని ప్రభువు–ప్రవక్త కర్తృత్వ భేదం ముందరి వాక్యంలో నిలిచింది.
