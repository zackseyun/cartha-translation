id: MAT.1.20
reference: Matthew 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: te
  text: 'అతడు ఈ విషయాల గురించి ఆలోచిస్తూ ఉండగా, ఇదిగో, ప్రభువు దూత ఒకడు కలలో అతనికి కనిపించి ఇలా అన్నాడు: “దావీదు కుమారుడైన యోసేపూ, నీ భార్య మరియను స్వీకరించడానికి భయపడకు.[a] ఎందుకంటే ఆమెలో గర్భం దాల్చినది పరిశుద్ధాత్మ వలన కలిగింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీ భార్య మరియను నీ ఇంటికి తీసుకురావడానికి.” ఇక్కడి గ్రీకు మాట ఆమెను వివాహబంధంలో తన ఇంటికి స్వీకరించడాన్ని సూచిస్తుంది.
    reason: παραλαμβάνω యొక్క సందర్భానుసార వైవాహిక భావాన్ని వివరిస్తూనే, ప్రధాన పాఠంలో మూలానికి మరింత సమీపమైన ‘స్వీకరించడానికి’ అనే పదాన్ని ఉంచుట.
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: ఆలోచిస్తూ ఉండగా
  rationale: యోసేపు తనలో తాను కొనసాగిస్తున్న ఆలోచనను సూచిస్తుంది; అతడు అప్పటికే తుది నిర్ణయం తీసుకున్నాడని చెప్పదు.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా దృష్టిని ఆకర్షించే మూలభాషా సూచకాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: ἄγγελος κυρίου
  choice: ప్రభువు దూత ఒకడు
  rationale: ἄγγελος ముందు నిర్దిష్ట ఉపపదం లేనందున ఒక దూత అని తెలియజేస్తుంది; పాత నిబంధనలోని ప్రత్యేకమైన ‘ప్రభువు దూత’ గుర్తింపును అనవసరంగా రుద్దదు.
- source_word: κατ’ ὄναρ ἐφάνη
  choice: కలలో అతనికి కనిపించి
  rationale: కలలో జరిగిన దైవిక ప్రత్యక్షతను సహజమైన తెలుగు కథనశైలిలో వ్యక్తపరుస్తుంది.
- source_word: υἱὸς Δαυίδ
  choice: దావీదు కుమారుడైన
  rationale: యోసేపు దావీదు వంశానికి చెందినవాడనే భావాన్ని, దానితో ముడిపడిన మెస్సీయ సంబంధిత ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: μὴ φοβηθῇς
  choice: భయపడకు
  rationale: నిషేధార్థాన్ని మరియు భయభావాన్ని సంక్షిప్తమైన సహజ తెలుగులో అందిస్తుంది.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: నీ భార్య మరియను నీ ఇంటికి తీసుకురావడానికి
  rationale: మరియ ఇప్పటికే సందర్భానుసారం అతని భార్యగా పరిగణించబడుతున్నదనే τὴν γυναῖκά σου భావాన్ని నిలుపుతూ, παραλαμβάνω ఇక్కడ ఆమెను వివాహ గృహంలోకి స్వీకరించడాన్ని సూచిస్తుందని స్పష్టం చేస్తుంది.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: ఆమెలో పుట్టినది
  rationale: నపుంసక ఏకవచన substantival participle యొక్క అస్పష్టతను నిలుపుతుంది; ‘శిశువు’ అని మూలంలో లేని నామవాచకాన్ని చేర్చదు. తెలుగు ‘పుట్టినది’ గర్భంలో ఉద్భవించినదనే భావంలో ఇక్కడ వాడబడింది.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: పరిశుద్ధాత్మ మూలంగా కలిగినది
  rationale: ἐκ సూచించే మూలం లేదా ఉద్భవాన్ని స్పష్టంగా తెలియజేస్తూ, పరిశుద్ధాత్మను కేవలం శక్తిగా మార్చకుండా వ్యక్తిగత దైవిక సూచనను నిలుపుతుంది.
theological_decisions:
- issue: ἄγγελος κυρίου లో κυρίου యొక్క అర్థం
  choice: ప్రభువు
  alternative: యెహోవా / యాహ్వే
  rationale: గ్రీకు κύριος ను నేరుగా ‘ప్రభువు’గా అనువదించడం సరైనది; ఈ సందర్భంలో పాత నిబంధన దైవనామాన్ని ప్రత్యక్షంగా చేర్చడం మూలపాఠం చెప్పినదానికంటే ఎక్కువ నిర్ణయిస్తుంది.
- issue: πνεύματός ... ἁγίου యొక్క సూచన
  choice: పరిశుద్ధాత్మ
  alternative: పరిశుద్ధమైన ఒక ఆత్మ / పరిశుద్ధాత్మ శక్తి
  rationale: మత్తయి జనన కథనంలో ఇది దైవిక పరిశుద్ధాత్మను సూచిస్తుంది; దానిని అనిర్దిష్టమైన ఆత్మగా గానీ, కేవలం నిర్జీవ శక్తిగా గానీ అనువదించలేదు.
- issue: మరియ యొక్క వైవాహిక స్థితి
  choice: నీ భార్య మరియ
  alternative: మరియను నీ భార్యగా
  rationale: τὴν γυναῖκά σου అక్షరార్థంగా ‘నీ భార్య’ అని చెబుతుంది. ‘నీ భార్యగా’ అనడం ఆమె స్థితి ఇప్పుడు మారబోతున్నదనే భావాన్ని కలిగించవచ్చు; ప్రధాన పాఠం ఆ అదనపు నిర్ణయాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన బైబిలు కథనశైలి ఉపయోగించబడింది. ‘ఇదిగో’ అనే కొద్దిగా ఉన్నతమైన కథన సూచకం మూలంలోని ἰδοὺ బలాన్ని నిలుపుతుంది. ప్రత్యక్ష సంభాషణలో ‘యోసేపూ’ సహజ సంబోధనగా వాడబడింది.
