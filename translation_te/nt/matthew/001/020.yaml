revisions:
- from: 'అతడు ఈ విషయాల గురించి ఆలోచిస్తూ ఉండగా, ఇదిగో, ప్రభువు దూత ఒకడు కలలో అతనికి కనిపించి ఇలా అన్నాడు: “దావీదు కుమారుడైన యోసేపూ, నీ భార్య మరియను నీ ఇంటికి తీసుకురావడానికి భయపడకు.[a] ఎందుకంటే ఆమెలో పుట్టినది పరిశుద్ధాత్మ మూలంగా కలిగినది.”'
  to: 'అతడు ఈ విషయాల గురించి ఆలోచిస్తూ ఉండగా, ఇదిగో, ప్రభువు దూత ఒకడు కలలో అతనికి కనిపించి ఇలా అన్నాడు: “దావీదు కుమారుడైన యోసేపూ, నీ భార్య మరియను స్వీకరించడానికి భయపడకు.[a] ఎందుకంటే ఆమెలో గర్భం దాల్చినది పరిశుద్ధాత్మ వలన కలిగింది.”'
  rationale: The revision removes an unstated domestic-location detail from the main text and corrects the potentially postnatal sense of ‘పుట్టినది.’ It preserves the verse’s syntax, marital designation, and the Holy Spirit as the source of the conception, without adding doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
