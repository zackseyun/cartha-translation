id: MAT.23.20
reference: Matthew 23:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: te
  text: కాబట్టి, బలిపీఠం మీద ప్రమాణం చేసేవాడు, దానిమీదా దానిపై ఉన్న సమస్తం మీదా ప్రమాణం చేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిమీద ఉన్నవాటన్నిటి మీదా.” గ్రీకులోని పదబంధం ఒకే కానుకను మాత్రమే కాదు, బలిపీఠంపై ఉంచబడిన సమస్తాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: కాబట్టి, ... ఒట్టు పెట్టుకునేవాడు
  rationale: οὖν ముందటి వాదననుంచి వచ్చే నిర్ధారణను సూచిస్తుంది. ఆర్టికల్‌తో ఉన్న భూతకాల కృదంతం ఇక్కడ సాధారణంగా ఎవరైనా అలా చేసే వ్యక్తిని సూచిస్తుంది; తెలుగులో సహజమైన సాధారణ వర్తమాన రూపంతో అనువదించాం.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: బలిపీఠం మీద
  rationale: ὀμνύωతో కూడిన ἐν ప్రమాణానికి ఆధారమైన దానిని సూచిస్తుంది. తెలుగులో ‘బలిపీఠం మీద ఒట్టు పెట్టుకోవడం’ సహజమైన ప్రమాణ ప్రయోగం.
- source_word: ὀμνύει
  choice: ఒట్టు పెట్టుకుంటున్నాడు
  rationale: ఇది సాధారణ సత్యాన్ని తెలిపే వర్తమాన భావం. ముందున్న క్రియతో పదపునరుక్తిని నిలుపుతూ సహజ తెలుగులో ఇచ్చాం.
- source_word: ἐν αὐτῷ
  choice: దాని మీదా
  rationale: αὐτῷ బలిపీఠాన్నే తిరిగి సూచిస్తుంది; ప్రమాణ సందర్భంలోని ἐνను ‘మీద’గా అనువదించాం.
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: దానిపై ఉన్న వాటన్నిటి మీదా
  rationale: πᾶσι τοῖς ἐπάνω αὐτοῦ అనేది బలిపీఠంపై ఉన్న సమస్తాన్ని విస్తృతంగా సూచిస్తుంది. ‘కానుకలు’ అని సంకుచితం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలిపాం.
theological_decisions:
- issue: బలిపీఠంపై ఉన్న వాటన్నిటి నిర్దిష్ట సూచన
  choice: బలిపీఠంపై ఉన్న సమస్తాన్ని సాధారణంగా సూచించడం
  alternative: దానిపై ఉన్న అర్పణలన్నీ
  rationale: ముందటి వచనాల్లో కానుక ప్రస్తావన ఉన్నప్పటికీ, ఈ వచనంలోని గ్రీకు పదబంధం మరింత విస్తృతమైనది. అందువల్ల అనువాదంలో దానిని ‘అర్పణలు’ లేదా ‘కానుకలు’ అని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా ‘ఒట్టు పెట్టుకోవడం’ అనే సహజ ప్రయోగాన్ని వాడాం. ‘బలిపీఠం’ గౌరవప్రదమైన, విస్తృతంగా అర్థమయ్యే బైబిలు పదం. మూలంలో వేరే పాఠాంతరం లేదా తప్పనిసరిగా వివరించాల్సిన అస్పష్టత లేనందున పాదటిప్పణి చేర్చలేదు.
