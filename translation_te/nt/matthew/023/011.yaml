  text: ὁ δὲ μείζων ὑμῶν ἔσται ὑμῶν διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: te
  text: అయితే, మీలో గొప్పవాడు మీ సేవకుడిగా ఉంటాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘మీలో మరింత గొప్పవాడు మీ సేవకుడిగా ఉంటాడు.’ గ్రీకులోని తులనాత్మక రూపం ఇక్కడ సమూహంలో అత్యున్నత స్థానంలో ఉన్న వ్యక్తిని సూచించే విధంగా వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న హోదా, బిరుదుల ఆకాంక్షకు విరుద్ధంగా యేసు చెప్పే స్థితి-తారుమారును సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: μείζων
  choice: గొప్పవాడు
  rationale: గ్రీకు తులనాత్మక రూపం ఈ సందర్భంలో సమూహంలో అత్యున్నత స్థానం గలవాడనే భావంలో వాడబడింది; తెలుగు ‘గొప్పవాడు’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὑμῶν (మొదటిది)
  choice: మీలో
  rationale: సమూహంలోని ఒకరిని సూచించే partitive genitive భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔσται
  choice: అయి ఉంటాడు
  rationale: భవిష్యత్ భావాన్ని నిలుపుతూ, గొప్పవాడిగా ఉండేవాని లక్షణం సేవకుడిగా ఉండటమేనని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ὑμῶν (రెండవది)
  choice: మీకు
  rationale: διάκονος‌తో ఉన్న సంబంధాన్ని తెలుగులో ‘మీకు సేవకుడు’ అని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διάκονος
  choice: సేవకుడు
  rationale: ఇక్కడ సంఘపదవి కాదు, ఇతరులకు సేవ చేసే వ్యక్తి ఉద్దేశించబడ్డాడు; ‘సేవకుడు’ ecclesiastical అర్థాన్ని దిగుమతి చేయకుండా సందర్భాన్ని కాపాడుతుంది.
theological_decisions:
- issue: గొప్పతనం మరియు సేవకు సంబంధించిన స్థితి-తారుమారు
  choice: ‘మీలో గొప్పవాడు మీకు సేవకుడై ఉంటాడు’ అని అనువదించడం
  alternative: ‘మీలో మరింత గొప్పవాడు మీ పరిచారకుడై ఉంటాడు’
  rationale: నిజమైన గొప్పతనం సేవలో వ్యక్తమవుతుందనే నైతిక, సామాజిక తారుమారును పదవి-సంబంధిత తరువాతి అర్థాలు చేర్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే బోధనలోని గంభీరతను మరియు స్థితి-తారుమారును నిలుపుతూ అనువదించబడింది.
