revisions:
- from: అయితే, మీలో గొప్పవాడు మీకు సేవకుడై ఉంటాడు.[a]
  to: అయితే, మీలో గొప్పవాడు మీ సేవకుడిగా ఉంటాడు.[a]
  rationale: The revision replaces the less idiomatic ‘సేవకుడై ఉంటాడు’ with ‘సేవకుడిగా ఉంటాడు’ to represent the Greek future naturally and directly. It also uses the standard relational phrase ‘మీ సేవకుడు.’ The comparative nuance of μείζων is retained in the footnote without requiring an unnatural comparative in the main text.
  reviewer_model: gpt-5.6-terra
