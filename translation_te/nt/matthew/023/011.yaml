review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast (δέ), the idiomatic superlative force of μείζων in this context, the two distinct functions of ὑμῶν, and διάκονος as a non-technical servant. However, ‘సేవకుడై ఉంటాడు’ can suggest a resultant/perfective state and is less direct than the Greek future ἔσται.
  naturalness: ‘మీలో గొప్పవాడు మీ సేవకుడిగా ఉంటాడు’ is more idiomatic modern standard Telugu and clearly expresses the future predication, while retaining the concise, weighty form of the saying.
  terminology: ‘సేవకుడు’ is appropriate here. It avoids importing the later ecclesial-office sense that ‘డీకన్’ or, potentially, ‘పరిచారకుడు’ could evoke.
  issues:
  - severity: low
    issue: Future expression ‘సేవకుడై ఉంటాడు’ is slightly awkward and potentially aspectually imprecise.
    rationale: The Greek ἔσται is a straightforward future copula. ‘సేవకుడిగా ఉంటాడు’ is natural Telugu and more directly corresponds to ‘will be your servant.’
  - severity: low
    issue: The relational genitive is more naturally expressed as ‘మీ సేవకుడు’ than ‘మీకు సేవకుడు.’
    rationale: Both can be understood, but ‘మీ సేవకుడిగా’ is the usual Telugu possessive/relational construction and closely reflects the second ὑμῶν.
  revised_text: అయితే, మీలో గొప్పవాడు మీ సేవకుడిగా ఉంటాడు.[a]
  revised_footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘మీలో మరింత గొప్పవాడు మీ సేవకుడిగా ఉంటాడు.’ గ్రీకులోని తులనాత్మక రూపం ఇక్కడ సమూహంలో అత్యున్నత స్థానంలో ఉన్న వ్యక్తిని సూచించే విధంగా వాడబడింది.
    reason: lexical_alternative
