id: MAT.23.12
reference: Matthew 23:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: te
  text: కాని తనను తాను ఉన్నతపరచుకునే వ్యక్తి తగ్గించబడతాడు[a]; తనను తాను తగ్గించుకునే వ్యక్తి ఉన్నతపరచబడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో పుంలింగ ఏకవచన రూపాలు వాడబడ్డాయి; అయితే ఇది ఏ వ్యక్తికైనా వర్తించే సాధారణ సూత్రం.
    reason: cultural_note
lexical_decisions:
- source_word: ὅστις
  choice: వ్యక్తి
  rationale: రెండు ఉపవాక్యాల్లో సాధారణంగా ఎవరినైనా సూచించే అనిర్దిష్ట సంబంధ సర్వనామం; ‘...వ్యక్తి’ అనే నిర్మాణం ఆధునిక తెలుగులో సహజంగా సామాన్య సూత్రాన్ని తెలియజేస్తుంది.
- source_word: δὲ
  choice: కాని
  rationale: ముందున్న సందర్భంతో స్వల్ప వ్యతిరేకతను సూచిస్తుంది.
- source_word: ὑψώσει ἑαυτὸν
  choice: తనను తాను ఉన్నతపరచుకునే
  rationale: స్వయంగా తన స్థాయిని లేదా గౌరవాన్ని పెంచుకోవడాన్ని సూచించే క్రియాత్మక, ఆత్మార్థక భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ταπεινωθήσεται
  choice: తగ్గించబడతాడు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని, కర్తను పేర్కొనకుండా, అలాగే ‘ఉన్నతపరచు/తగ్గించు’ అనే సమాంతర విరుద్ధతను నిలుపుతుంది.
- source_word: καὶ
  choice: ;
  rationale: గ్రీకు καὶ రెండు సమాంతర ఉపవాక్యాలను కలుపుతుంది; తెలుగులో అర్థస్పష్టతతో గంభీరమైన సామెతసదృశ సమతౌల్యాన్ని చూపేందుకు అర్ధవిరామం సహజంగా పనిచేస్తుంది.
- source_word: ταπεινώσει ἑαυτὸν
  choice: తనను తాను తగ్గించుకునే
  rationale: స్వచ్ఛందంగా తనను తగ్గించుకోవడం అనే ఆత్మార్థక క్రియను ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: ὑψωθήσεται
  choice: ఉన్నతపరచబడతాడు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని, పేర్కొనని కార్యసాధకుడిని, మొదటి ఉపవాక్యంలోని ὑψόωతో ఉన్న పదసంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: కర్మణి క్రియల కార్యసాధకుడు
  choice: కర్మణి రూపాలను ఉంచి కార్యసాధకుడిని పేర్కొనలేదు
  alternative: ‘దేవుడు అతణ్ణి తగ్గిస్తాడు/ఉన్నతపరుస్తాడు’ అని కర్తరి రూపంలో అనువదించడం
  rationale: గ్రీకు పాఠం కార్యసాధకుడిని స్పష్టంగా పేర్కొనదు. కర్మణి రూపం అంతర్లీన దైవ కార్యసాధకత్వానికి అవకాశం ఇస్తూనే పాఠంలోని ఉద్దేశపూర్వక అనిర్దిష్టతను కాపాడుతుంది.
- issue: వ్యాకరణ లింగం మరియు సాధారణ అన్వయం
  choice: తెలుగు పుంలింగ ఏకవచన క్రియారూపాన్ని ఉపయోగించి, అది ప్రతి వ్యక్తికీ వర్తించే సాధారణ సూత్రమని పాదసూచికలో తెలిపాం
  alternative: బహువచన లేదా పూర్తిగా లింగనిరపేక్ష నిర్మాణం ఉపయోగించడం
  rationale: గ్రీకు పుంలింగ ఏకవచన రూపంలో సాధారణ ప్రతినిధి భావాన్ని వ్యక్తం చేస్తుంది. తెలుగు రూపం మూల నిర్మాణాన్ని ప్రతిబింబిస్తుండగా పాదసూచిక దాని సమగ్ర అన్వయాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సామెతసదృశ శైలి. ‘ఉన్నతపరచు/తగ్గించు’ అనే సమాంతర పదజాలం మూలంలోని గౌరవం–అణకువ తారుమారును స్పష్టంగా ఉంచుతుంది; కర్మణి రూపాలు కార్యసాధకుడిని అనవసరంగా నిర్దిష్టం చేయవు.
