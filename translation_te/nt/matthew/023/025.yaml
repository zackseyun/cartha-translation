review_pass:
  verdict: revise
  source_fidelity: The vessel imagery and the plural reference in “వాటి లోపల ... నిండివున్నాయి” accurately reflect ἔσωθεν δὲ γέμουσιν, without prematurely identifying the vessels’ interior as the leaders’ hearts. “దోపిడీ” appropriately preserves the force of ἁρπαγή as exploitative taking. “అదుపులేని భోగాసక్తి,” however, narrows ἀκρασία toward desire for pleasure; the Greek more broadly denotes lack of self-control or undisciplined excess.
  naturalness: The sentence is clear and idiomatic in modern standard Telugu. “కపటులారా” is a more direct and established rendering for the moral-religious denunciation ὑποκριταί than “వేషధారులారా,” which can suggest merely someone in costume or disguise.
  terminology: “శాస్త్రులు,” “పరిసయ్యులు,” “గిన్నె,” and “పళ్లెం” are suitable. Revising ὑποκριταί to “కపటులు” and ἀκρασία to “అదుపులేనితనం” improves semantic precision while retaining a forceful, contemporary register.
  issues:
  - severity: medium
    issue: “అదుపులేని భోగాసక్తి” is overly specific for ἀκρασία.
    rationale: ἀκρασία refers broadly to lack of self-mastery/undisciplined excess, not necessarily specifically to pleasure-seeking desire. “అదుపులేనితనం” preserves the wider lexical sense.
  - severity: low
    issue: “వేషధారులారా” is less precise than “కపటులారా” for ὑποκριταί.
    rationale: In this prophetic moral context, “కపటులు” directly conveys hypocrisy; “వేషధారులు” may evoke outward disguise more than moral-religious pretense.
