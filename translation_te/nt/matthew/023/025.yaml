id: MAT.23.25
reference: Matthew 23:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: te
  text: “శాస్త్రులారా, పరిసయ్యులారా, కపటులారా, మీకు అయ్యో! మీరు గిన్నె, పళ్లెం వెలుపలి భాగాన్ని శుభ్రం చేస్తారు; కానీ వాటి లోపల దోపిడీతో, అదుపులేనితనంతో నిండివున్నాయి.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “దోపిడీ”కి “లాక్కోవడం” లేదా “బలవంతపు వసూలు” అనే భావాలు కూడా ఉండవచ్చు; “అదుపులేనితనం”ను “స్వీయనిగ్రహం లేకపోవడం” లేదా “అతిశయం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: మీకు అయ్యో!
  rationale: ప్రవచనాత్మక ఖండన, తీర్పు హెచ్చరికల బలాన్ని నిలుపుతూ తెలుగులో సహజమైన బైబిలీయ వ్యక్తీకరణను ఉపయోగిస్తుంది.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: సువార్తల సందర్భంలో ధర్మశాస్త్ర నిపుణులను సూచించే స్థిరమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూద మతవర్గానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణ.
- source_word: ὑποκριταί
  choice: వేషధారులు
  rationale: మతపరమైన నటన, అంతరంగానికి విరుద్ధమైన బాహ్య ప్రదర్శన అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καθαρίζετε τὸ ἔξωθεν
  choice: వెలుపలి భాగాన్ని శుభ్రం చేస్తారు
  rationale: క్రియ యొక్క వర్తమాన భావాన్ని, వెలుపల–లోపల వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ποτηρίου καὶ τῆς παροψίδος
  choice: గిన్నె, పళ్లెం
  rationale: ποτήριονకు గిన్నె, సాధారణ భోజన పాత్రను సూచించే παροψίςకు పళ్లెం సహజమైన తెలుగు సమానార్థాలు.
- source_word: ἔσωθεν δὲ γέμουσιν
  choice: కానీ వాటి లోపల ... నిండివున్నాయి
  rationale: γέμουσιν బహువచనాన్ని అనుసరించి రెండు పాత్రలనే వ్యాకరణపరమైన కర్తలుగా ఉంచి మూలంలోని రూపకాన్ని విప్పకుండా కాపాడుతుంది.
- source_word: ἁρπαγῆς
  choice: దోపిడీ
  rationale: ఈ పదంలోని బలవంతంగా లాక్కోవడం, దోచుకోవడం, దోపిడీ స్వభావం వంటి బలమైన భావాన్ని ‘లోభం’ కంటే ప్రత్యక్షంగా నిలుపుతుంది.
- source_word: ἀκρασίας
  choice: అదుపులేని భోగాసక్తి
  rationale: స్వీయనిగ్రహం లేక కోరికలకు లోబడే అతిశయ స్వభావాన్ని నైతిక ఖండన సందర్భంలో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: లోపలి అపవిత్రతకు రూపకంలోని ప్రత్యక్ష సూచన
  choice: ‘వాటి లోపల’ అని గిన్నె, పళ్లెం రూపకాన్నే కొనసాగించడం
  alternative: ‘మీ లోపల’ అని నాయకుల అంతరంగాన్ని ప్రత్యక్షంగా పేర్కొనడం
  rationale: గ్రీకు వాక్యంలో బహువచన క్రియ పాత్రలను వ్యాకరణపరంగా సూచిస్తుంది. నాయకుల అంతరంగమే రూపకార్థమైనప్పటికీ, దానిని అనువాదంలో విప్పి చెప్పకుండా మూలంలోని చిత్రణను, ఉద్రిక్తతను నిలుపుతుంది.
- issue: ἁρπαγή యొక్క నైతిక భావం
  choice: దోపిడీ
  alternative: లోభం
  rationale: ‘లోభం’ అంతరంగ కోరికను మాత్రమే బలంగా సూచించవచ్చు; ‘దోపిడీ’ ఇతరుల నుంచి అన్యాయంగా లాక్కోవడం లేదా దోచుకోవడం అనే మూలపదంలోని కార్యాత్మక, దోపిడీ పరమైన తీవ్రతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచనాత్మక ఖండన శైలిని ఉంచాం. ‘మీకు అయ్యో’ అనే స్థిరమైన బైబిలీయ ప్రయోగం సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండగా మూలంలోని తీర్పు స్వరాన్ని నిలుపుతుంది. వాక్య నిర్మాణం సహజంగా ఉండేందుకు సంబోధనను ముందుంచాం.
