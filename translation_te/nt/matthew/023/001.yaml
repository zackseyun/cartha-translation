translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు సులభంగా ఉండే కథనశైలి. తరువాతి వచనంలోని ప్రత్యక్ష ప్రసంగానికి దారితీయడానికి చివర ద్విబిందువు వాడబడింది.
