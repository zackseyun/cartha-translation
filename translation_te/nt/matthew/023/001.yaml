- from: 'అప్పుడు యేసు జనసమూహాలతో, తన శిష్యులతో ఇలా మాట్లాడాడు:'
  to: 'అప్పుడు యేసు జనసమూహాలను, తన శిష్యులను ఉద్దేశించి మాట్లాడాడు:'
