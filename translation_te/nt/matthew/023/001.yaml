  yaml_path: translation/nt/matthew/023/001.yaml
  text: Then Jesus spoke to the crowds and to his disciples,
translation:
  language: te
  text: 'అప్పుడు యేసు జనసమూహాలను, తన శిష్యులను ఉద్దేశించి మాట్లాడాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: కథన క్రమాన్ని సూచించే కాలవాచక క్రియావిశేషణానికి సహజమైన, సంక్షిప్తమైన తెలుగు సమానార్థకం.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: గ్రీకు కథనశైలిలో వ్యక్తి పేరుతో వచ్చే ఉపపదాన్ని తెలుగులో ప్రత్యేకంగా అనువదించాల్సిన అవసరం లేదు.
- source_word: ἐλάλησεν
  choice: ఇలా మాట్లాడాడు
  rationale: λαλέω యొక్క సాధారణ అర్థమైన ‘మాట్లాడు’ను నిలుపుతుంది; తరువాత వచ్చే ప్రత్యక్ష ప్రసంగాన్ని సహజంగా పరిచయం చేయడానికి ‘ఇలా’ చేర్చబడింది.
- source_word: τοῖς ὄχλοις
  choice: జనసమూహాలతో
  rationale: బహువచన రూపాన్ని నిలుపుతూ, సాధారణ ఆధునిక తెలుగులో గుమికూడిన ప్రజల సమూహాలను సూచిస్తుంది.
- source_word: καὶ
  choice: -తో,
  rationale: రెండు శ్రోతల వర్గాలను సమన్వయంగా కలుపుతుంది; తెలుగులో సహజ వాక్యనిర్మాణం కోసం రెండవ వర్గంతో ‘తో’ భావం పునరుక్తమవుతుంది.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: తన శిష్యులతో
  rationale: αὐτοῦ యొక్క స్వామ్యసంబంధాన్ని తెలుగులో కర్తను తిరిగి సూచించే సహజమైన ‘తన’తో, μαθηταῖς‌ను స్థిరమైన ‘శిష్యులు’ పదంతో వ్యక్తం చేస్తుంది.
