review_pass:
  verdict: revise
  source_fidelity: The draft preserves the direct singular address, imperative, priority of inner cleaning, concrete cup-and-dish imagery, and resultant outer cleanliness. However, the final clause leaves the exterior unanchored to the vessels, whereas αὐτοῦ explicitly relates the outside to the cup/dish image. A plural possessive is the natural Telugu way to express the sense when both vessels have been named.
  naturalness: The wording is generally modern and clear. Combining the coordinated vessels before ‘inside parts’ is more idiomatic Telugu than repeating ‘లోపలి భాగాన్ని,’ and ‘వాటి వెలుపలి భాగాలు’ makes the closing image clear without explanatory paraphrase.
  terminology: ‘పరిసయ్యా,’ ‘గిన్నె,’ ‘పళ్లెం,’ and ‘శుభ్రం చేయి’ are appropriate modern-standard Telugu choices. The lexical footnote appropriately preserves the range of παροψίς.
  issues:
  - severity: low
    issue: The final phrase ‘వెలుపలి భాగం కూడా’ does not explicitly connect the outside with the cup and dish.
    rationale: The Greek includes αὐτοῦ (‘of it/its’), and the Telugu can naturally make the relationship explicit as ‘వాటి వెలుపలి భాగాలు కూడా,’ since two vessels are mentioned.
  revised_text: గుడ్డి పరిసయ్యా, గిన్నె, పళ్లెం[a] లోపలి భాగాలను మొదట శుభ్రం చేయి; అప్పుడు వాటి వెలుపలి భాగాలు కూడా శుభ్రమవుతాయి.
