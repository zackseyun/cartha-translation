source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: te
  text: గుడ్డి పరిసయ్యా, గిన్నె, పళ్లెం[a] లోపలి భాగాలను మొదట శుభ్రం చేయి; అప్పుడు వాటి వెలుపలి భాగాలు కూడా శుభ్రమవుతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వడ్డించే గిన్నె,’ ‘పాత్ర,’ లేదా ‘పెద్ద పళ్లెం’; గ్రీకు పదం παροψίς ఆహారం పెట్టే లేదా వడ్డించే పాత్రను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: గుడ్డి పరిసయ్యా
  rationale: రెండు పదాలూ ఏకవచన సంబోధనలు. గ్రీకు పదక్రమాన్ని, ఆత్మీయ అంధత్వాన్ని సూచించే గట్టి రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: καθάρισον
  choice: శుభ్రం చేయి
  rationale: నిర్ణయాత్మక చర్యను ఆజ్ఞాపించే ఏరిస్ట్ ఇంపెరేటివ్ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; పాత్రల రూపకాన్నీ నిలుపుతుంది.
- source_word: πρῶτον
  choice: మొదట
  rationale: లోపలి శుభ్రతకు ఉన్న క్రమపరమైన, తార్కిక ప్రాధాన్యాన్ని స్పష్టంగా చూపుతుంది.
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: గిన్నె లోపలి భాగాన్ని
  rationale: ποτήριον అనే త్రాగే పాత్రకు సాధారణ తెలుగు పదాన్ని వాడుతూ, substantivized ἐντόςను ‘లోపలి భాగం’గా స్పష్టంగా అందిస్తుంది.
- source_word: καὶ τῆς παροψίδος
  choice: పళ్లెం లోపలి భాగాన్ని
  rationale: παροψίς ఆహారం పెట్టే లేదా వడ్డించే పాత్రను సూచిస్తుంది. ‘పళ్లెం’ సహజమైన తెలుగు సమానార్థకం; ఖచ్చితమైన ఆకారాన్ని మూలం నిర్దేశించనందున ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఇస్తుంది.
- source_word: ἵνα γένηται καὶ τὸ ἐκτὸς αὐτοῦ καθαρόν
  choice: అప్పుడు వెలుపలి భాగం కూడా శుభ్రమవుతుంది
  rationale: γένηται యొక్క ఫలితాత్మక ‘శుభ్రమవుతుంది’ భావాన్నీ, καί యొక్క ‘కూడా’ భావాన్నీ నిలుపుతుంది. రెండు పాత్రలు ప్రస్తావించబడినా αὐτοῦ ఏకవచనంగా ఉండటంతో, తెలుగులో అసహజమైన లేదా వివరణాత్మక సర్వనామాన్ని చేర్చకుండా ‘వెలుపలి భాగం’ అని అనువదించబడింది.
theological_decisions:
- issue: పాత్రల ప్రత్యక్ష చిత్రం లేదా నైతిక భావాన్ని బహిర్గతం చేయడం
  choice: గిన్నె, పళ్లెం లోపల-వెలుపల శుభ్రం చేసే ప్రత్యక్ష చిత్రాన్నే ప్రధాన వాక్యంలో ఉంచడం
  alternative: ‘ముందుగా నీ అంతరంగాన్ని శుద్ధి చేసుకో; అప్పుడు నీ బాహ్య జీవితం కూడా పవిత్రమవుతుంది’ వంటి వివరణాత్మక అనువాదం
  rationale: యేసు చెప్పిన మాట నైతిక ఉద్దేశాన్ని పాత్రల రూపకం ద్వారా తెలియజేస్తుంది. భావాన్ని నేరుగా విప్పి చెప్పడం గ్రీకు పాఠాన్ని మించి వెళ్లి దాని అలంకారిక బలాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘గుడ్డి పరిసయ్యా’ అనే సంబోధన మూలంలోని గట్టి మందలింపును తగ్గించకుండా ఉంచుతుంది. వాక్యంలోని రూపకాన్ని వివరించి చెప్పకుండా పాఠకుడు గ్రహించేలా నిలుపుతుంది.
