review_pass:
  verdict: revise
  source_fidelity: The draft conveys the complete Greek clause sequence and causal relation. However, rendering ὑποκριταί as an adjective attached only to the scribes slightly weakens its force as a coordinate vocative applying to both scribes and Pharisees. The participial form కట్టి also obscures the Greek’s paired present verbs.
  naturalness: The register is appropriately solemn and modern. Using two finite verbs (నిర్మిస్తారు ... అలంకరిస్తారు) is clearer Telugu and better reflects the parallelism. The supplied text also needs a closing quotation mark.
  terminology: శాస్త్రులు, పరిసయ్యులు, సమాధులు, and నీతిమంతులు are suitable established terms. కపటులారా is a more idiomatic and semantically direct equivalent for ὑποκριταί in this denunciatory setting than వేషధారులైన. స్మారక సమాధులు preserves the contextual memorial/tomb nuance of μνημεῖα while distinguishing it from τάφους.
  issues:
  - severity: medium
    issue: ὑποκριταί is rendered as a modifier of only ‘scribes.’
    rationale: In Greek it is a separate vocative alongside ‘scribes’ and ‘Pharisees’; presenting it as a separate Telugu address preserves its scope and rhetorical force.
  - severity: medium
    issue: కట్టి is a participial form for οἰκοδομεῖτε.
    rationale: The Greek has a present finite verb coordinated with κοσμεῖτε. నిర్మిస్తారు ... అలంకరిస్తారు preserves the parallel ongoing/customary actions.
  - severity: low
    issue: The translation has an opening quotation mark without a closing quotation mark.
    rationale: Closing it resolves the punctuation defect.
