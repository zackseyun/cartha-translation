id: MAT.23.29
reference: Matthew 23:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: te
  text: “శాస్త్రులారా, పరిసయ్యులారా, కపటులారా, మీకు అయ్యో! ఎందుకంటే మీరు ప్రవక్తల సమాధులను నిర్మిస్తారు, నీతిమంతుల స్మారక సమాధులను[a] అలంకరిస్తారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్మారక చిహ్నాలను.” గ్రీకు పదం సమాధులను లేదా సమాధులతో సంబంధమున్న స్మారకాలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: మీకు అయ్యో!
  rationale: తీర్పును ప్రకటించే ప్రవచనాత్మక తీవ్రతను నిలుపుతూ, తెలుగులో సహజమైన ఖండనాత్మక ఉద్గారంగా ఉంటుంది.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: యూదుల ధర్మశాస్త్ర నిపుణులను సూచించే స్థిరమైన బైబిలు పదం; కేవలం వ్రాసేవారు అనే అపార్థాన్ని సందర్భం నివారిస్తుంది.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: సమూహనామానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: ὑποκριταί
  choice: వేషధారులు
  rationale: మతపరమైన నటన, కపట ప్రవర్తన అనే సందర్భార్థాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: అయ్యో అనే తీర్పు ప్రకటనకు కారణాన్ని పరిచయం చేసే causal forceను స్పష్టంగా ఉంచుతుంది.
- source_word: οἰκοδομεῖτε
  choice: కట్టి
  rationale: నిర్మించడం అనే మౌలిక అర్థాన్ని నిలుపుతుంది; పునర్నిర్మిస్తారు అని మూలంలో లేని భావాన్ని జోడించదు.
- source_word: τάφους
  choice: సమాధులను
  rationale: నిర్మిత శవస్థలాలకు సహజమైన తెలుగు పదం; οἰκοδομεῖτεతో సరిగ్గా సరిపోతుంది.
- source_word: κοσμεῖτε
  choice: అలంకరిస్తారు
  rationale: అందంగా తీర్చిదిద్దడం లేదా అలంకారాలు చేయడం అనే అర్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μνημεῖα
  choice: స్మారక సమాధులను
  rationale: ఈ పదం సమాధినీ, స్మారక చిహ్నాన్నీ సూచించగలదు. ముందున్న τάφουςతో భేదాన్ని కొంత నిలుపుతూ, అంత్యక్రియల సందర్భాన్ని కూడా కాపాడుతుంది.
- source_word: δικαίων
  choice: నీతిమంతుల
  rationale: వ్యక్తులను సూచించే substantival adjectiveను సంక్షిప్తంగా అనువదిస్తూ, నైతిక-దైవిక వర్గార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: δικαίων యొక్క భావం
  choice: నీతిమంతుల
  alternative: న్యాయవంతుల
  rationale: ఇక్కడ ఇశ్రాయేలు గతంలోని దేవునికి నమ్మకమైన, సత్ప్రవర్తనగల వ్యక్తులు ఉద్దేశింపబడుతున్నారు. ‘నీతిమంతులు’ మూలంలోని నైతిక-దైవిక విస్తృతిని నిలుపుతుంది; ప్రత్యేక సిద్ధాంతవ్యాఖ్యను రుద్దదు.
- issue: ὑποκριταί సంబోధనను వాక్యంతో అనుసంధానించడం
  choice: వేషధారులైన శాస్త్రులారా, పరిసయ్యులారా, మీకు అయ్యో! ఎందుకంటే…
  alternative: శాస్త్రులారా, పరిసయ్యులారా, వేషధారులారా! మీకు అయ్యో, ఎందుకంటే…
  rationale: మూడు సంబోధనల భావాన్ని నిలుపుతూ తెలుగులో సహజమైన పదక్రమాన్ని ఎంచుకుంది. ‘ఎందుకంటే’ తరువాతి క్రియలే తీర్పుకు కారణమని స్పష్టపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచనాత్మక ఖండన శైలిని ఉపయోగించాం. ‘శాస్త్రులు,’ ‘పరిసయ్యులు,’ ‘నీతిమంతులు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచి, వాక్యనిర్మాణాన్ని సాధారణ పాఠకులకు స్పష్టంగా తీర్చిదిద్దాం.
