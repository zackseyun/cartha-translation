revisions:
- from: “వేషధారులైన శాస్త్రులారా, పరిసయ్యులారా, మీకు అయ్యో! ఎందుకంటే మీరు ప్రవక్తల సమాధులను కట్టి, నీతిమంతుల స్మారక సమాధులను[a] అలంకరిస్తారు.
  to: “శాస్త్రులారా, పరిసయ్యులారా, కపటులారా, మీకు అయ్యో! ఎందుకంటే మీరు ప్రవక్తల సమాధులను నిర్మిస్తారు, నీతిమంతుల స్మారక సమాధులను[a] అలంకరిస్తారు.”
  rationale: The revision retains the prophetic denunciation and all source elements, while restoring the coordinate vocative force of ὑποκριταί, the parallel finite verbs οἰκοδομεῖτε and κοσμεῖτε, and complete Telugu punctuation. The footnote remains anchored to μνημεῖα and states its lexical range without forcing a disputed distinction.
