id: MAT.23.35
reference: Matthew 23:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: te
  text: భూమి మీద చిందించబడుతున్న నీతిమంతుల రక్తమంతా మీ మీదికి రావడానికి—నీతిమంతుడైన హేబెలు రక్తం మొదలుకొని, పరిశుద్ధస్థలానికీ బలిపీఠానికీ మధ్య మీరు హత్య చేసిన బరకీయ కుమారుడైన జెకర్యా రక్తం వరకు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπως
  choice: వచ్చేలా
  rationale: ముందటి సందర్భం నుండి ఉద్దేశం లేదా ఫలితాన్ని సూచించే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: మీ మీదికి వచ్చేలా
  rationale: ἐπίతో ఉన్న న్యాయతీర్పు/రక్తాపరాధ భావాన్ని ‘మీ మీదికి’ నిలుపుతూ, subjunctive భావాన్ని ఉద్దేశ-ఫలిత నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: πᾶν αἷμα δίκαιον
  choice: నీతిమంతుల రక్తమంతా
  rationale: గ్రీకులో ‘నీతిమంతమైన రక్తం’ అనే metonymy ఉన్నా, తెలుగులో నీతిమంతుల నిరపరాధ రక్తమంతటినీ సూచించడానికి ఈ రూపం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἐκχυννόμενον
  choice: చిందించబడుతున్న
  rationale: వర్తమాన కర్మణి కృదంత భావాన్ని, రక్తం చిందింపబడుతున్న సజీవ చిత్రాన్ని నిలుపుతుంది.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమి మీద
  rationale: γῆ యొక్క విస్తృత అర్థమైన ‘భూమి’ని ప్రధాన పాఠంలో ఎంచుకుంది; ‘దేశం’ అనే సాధ్యార్థాన్ని పాదటీపులో ఉంచింది.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: నీతిమంతుడైన హేబెలు రక్తం మొదలుకొని
  rationale: ἀπόతో ప్రారంభమయ్యే పరిధిని ‘మొదలుకొని’తో, δίκαιος విశేషణాన్ని హేబెలుకు స్పష్టంగా అన్వయిస్తూ అందిస్తుంది.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: బరకీయ కుమారుడైన జెకర్యా రక్తం వరకు
  rationale: ἀπό...ἕως పరిధి నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతూ, వ్యక్తి పేర్లను తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరిస్తుంది.
- source_word: ὃν ἐφονεύσατε
  choice: మీరు హత్య చేసిన
  rationale: φονεύωలోని సాధారణంగా చంపడం కంటే బలమైన నైతిక ఆరోపణను ‘హత్య’ స్పష్టంగా నిలుపుతుంది.
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: పరిశుద్ధస్థలానికి బలిపీఠానికి మధ్య
  rationale: ναός మొత్తం దేవాలయ ప్రాంగణం కాక దేవాలయ పరిశుద్ధ భవనాన్ని సూచిస్తుందని భేదపరుస్తూ, θυσιαστήριονను ‘బలిపీఠం’గా అనువదిస్తుంది.
theological_decisions:
- issue: ‘బరకీయ కుమారుడైన జెకర్యా’ ఎవరు అనే గుర్తింపు
  choice: గ్రీకు పాఠంలో ఉన్న పేరును యథాతథంగా ఉంచి, ప్రధాన పాఠంలో సమన్వయం చేయలేదు.
  alternative: ఇతనిని ప్రవక్త జెకర్యాగా గుర్తించడం; లేదా 2 దినవృత్తాంతాలు 24:20–22లోని యెహోయాదా కుమారుడు జెకర్యాతో గుర్తించి పేరులోని సమస్యను పాఠాంతరంగా లేదా సంప్రదాయ సమస్యగా చూడడం.
  rationale: మూల గ్రీకు పాఠానికి ప్రాధాన్యం ఇస్తూ చారిత్రక గుర్తింపుపై ఉన్న వివాదాన్ని అనువాదంలో మౌనంగా పరిష్కరించకుండా పాదటీపులో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే న్యాయతీర్పు తీవ్రత, రక్తం చిందించబడుతున్న కృదంత భావం, ‘పరిశుద్ధస్థలం’–‘దేవాలయ ప్రాంగణం’ భేదం నిలుపబడ్డాయి. రెండు పాదటీపు సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
