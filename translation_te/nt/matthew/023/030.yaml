id: MAT.23.30
reference: Matthew 23:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: te
  text: 'మీరు ఇలా అంటారు: “మేము మా పితరుల కాలంలో ఉండి ఉంటే, ప్రవక్తల రక్తం విషయంలో[b] వారితో భాగస్థులమయ్యేవాళ్లం కాదు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వారితో పాలుపంచుకునేవాళ్లం” లేదా “వారితో సహభాగులమయ్యేవాళ్లం” అని కూడా అనువదించవచ్చు. గ్రీకు పదం ఉమ్మడి పాలుపంచుకోవడాన్ని, ఈ సందర్భంలో నేరంలో భాగం వహించడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, ప్రవక్తల రక్తం చిందించడంలో పాలుపంచుకోవడం; తమ పితరుల రక్తాపరాధంలో తాము భాగం వహించేవాళ్లం కాదని వారు చెప్పుకుంటున్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγετε
  choice: మీరు ఇలా అంటారు
  rationale: వర్తమానకాల, ద్వితీయ పురుష బహువచన సంబోధనను సహజమైన తెలుగు ప్రత్యక్ష వాక్య పరిచయంగా అందిస్తుంది.
- source_word: Εἰ ἤμεθα
  choice: మేము ... ఉండి ఉంటే
  rationale: గతకాలానికి సంబంధించిన వాస్తవవిరుద్ధ ఊహను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν
  choice: మా పితరుల కాలంలో
  rationale: కాలసూచక గ్రీకు నుడికారాన్ని స్పష్టంగా అందిస్తూ, πατέρων అనే ‘తండ్రులు/పితరులు’ భావాన్ని నిలుపుతుంది.
- source_word: οὐκ ἂν ἤμεθα
  choice: మయ్యేవాళ్లం కాదు
  rationale: గత వాస్తవవిరుద్ధ షరతులోని ఫలిత వాక్యాన్ని సహజమైన తెలుగు షరతు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: αὐτῶν κοινωνοὶ
  choice: వారితో భాగస్థులు
  rationale: కలిసి పాలుపంచుకోవడం లేదా సహభాగిత వల్ల కలిగే బాధ్యత అనే భావాలను నిలుపుతుంది; ‘సహనేరస్థులు’ అని మరీ స్పష్టీకరించదు.
- source_word: ἐν τῷ αἵματι τῶν προφητῶν
  choice: ప్రవక్తల రక్తం విషయంలో
  rationale: ‘రక్తం’ అనే మూలపాఠంలోని సజీవ రూపకాన్ని ఉంచుతూ, తెలుగులో సంబంధాన్ని సహజంగా తెలియజేస్తుంది; రక్తం చిందించడమనే సందర్భార్థాన్ని పాదసూచికలో వివరిస్తుంది.
theological_decisions:
- issue: κοινωνοὶ ἐν τῷ αἵματι సూచించే సహభాగిత స్థాయి
  choice: ప్రవక్తల రక్తం విషయంలో వారితో భాగస్థులు
  alternative: ప్రవక్తలను చంపడంలో వారికి సహనేరస్థులు
  rationale: మూలంలోని ‘భాగస్థులు’ మరియు ‘రక్తం’ అనే సంబంధాత్మక, సజీవ భాషను నిలుపుతుంది. అదే సమయంలో ఇది ప్రవక్తల హత్యలోని నైతిక బాధ్యతను సూచిస్తుందని పాదసూచిక స్పష్టం చేస్తుంది; ప్రధాన పాఠం మాత్రం భావాన్ని అతిగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన షరతు వాక్య నిర్మాణాన్ని ఉపయోగించాం. ‘పితరులు,’ ‘ప్రవక్తలు,’ ‘రక్తం’ వంటి స్థిరమైన బైబిలు పదాలను నిలుపుతూ, వాక్యాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచాం.
