source:
  edition: SBLGNT
  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: te
  text: మీరు ‘మార్గదర్శకులు’ అని పిలవబడకండి; ఎందుకంటే మీకు మార్గదర్శకుడు ఒక్కడే—మెస్సీయ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్రీస్తు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: పిలవబడకండి
  rationale: ఈ నిషేధం ముందున్న నిషేధాలతో అనుసంధానమై ఉన్నప్పటికీ, స్వతంత్ర వచనంగా సహజమైన తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చాల్సిన అవసరం లేదు.
- source_word: κληθῆτε
  choice: అని పిలవబడకండి
  rationale: καλέω యొక్క కర్మణి రూపం ఇక్కడ ఒక బిరుదుతో పిలవబడటాన్ని సూచిస్తుంది; తెలుగు కర్మణి నిర్మాణం ఆ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: καθηγηταί / καθηγητὴς
  choice: మార్గదర్శకులు / మార్గదర్శకుడు
  rationale: καθηγητής నడిపించే లేదా బోధించే వ్యక్తిని సూచిస్తుంది. ‘మార్గదర్శకుడు’ ఈ రెండు భావాలనూ సహజంగా అందిస్తూ, సమీప సందర్భంలోని διδάσκαλος అనే ‘బోధకుడు’ పదంతో అనవసరంగా కలిసిపోకుండా చేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: నిషేధానికి కారణాన్ని స్పష్టంగా పరిచయం చేసే సహజమైన ఆధునిక తెలుగు అనుసంధానం.
- source_word: ὑμῶν ἐστιν εἷς
  choice: మీకు ... ఒక్కడే
  rationale: గ్రీకు స్వామ్య విధేయ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, ఒకే వ్యక్తి అనే ఉద్ఘాటనను ‘ఒక్కడే’ నిలుపుతుంది.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ యూదుల అభిషిక్త రాజు/విమోచకుని నిరీక్షణతో ఉన్న సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Χριστός పదం బిరుదుగా ఉన్న విధానం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో పదం వ్యక్తిపేరులా కాకుండా ‘అభిషిక్తుడు’ అనే క్రీస్తుసంబంధ బిరుదుగా ఉంది. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని స్పష్టంగా ఉంచుతుంది; పాఠకులకు సుపరిచితమైన ‘క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇస్తుంది.
- issue: καθηγητής మరియు సమీపంలోని διδάσκαλος మధ్య భేదం
  choice: మార్గదర్శకుడు
  alternative: బోధకుడు / ఉపదేశకుడు
  rationale: καθηγητήςలో నడిపించడం, మార్గం చూపించడం అనే భావం ఉంది. ‘మార్గదర్శకుడు’ను ఎంచుకోవడం వల్ల సమీప వచనాల్లోని διδάσκαλοςతో పదభేదం నిలుస్తుంది; అయినా ఆ వ్యక్తి బోధించే పాత్రను ఈ సందర్భం పూర్తిగా నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి. బిరుదుగా పిలవబడటాన్ని చూపేందుకు ఉల్లేఖన గుర్తులు వాడబడ్డాయి; ‘ఒక్కడే’ మూలంలోని ఏకత్వ ఉద్ఘాటనను నిలుపుతుంది.
