id: MAT.23.39
reference: Matthew 23:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: te
  text: 'ఎందుకంటే నేను మీతో చెబుతున్నాను: ఇకనుంచి, ‘ప్రభువు పేరుతో వచ్చేవాడు ధన్యుడు’ అని మీరు చెప్పేంతవరకు[a], మీరు నన్ను ఎంతమాత్రమూ చూడరు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది కీర్తన 118:26 నుండి తీసుకున్న ఉల్లేఖనం/సూచన.
    reason: cross_reference
  - marker: b
    text: గ్రీకులో οὐ μή అనే బలమైన నిరాకరణ ఉంది; ఇక్కడ ‘ఎంతమాత్రమూ చూడరు’ అనే ఉద్ఘాటనను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: ఎందుకంటే, నేను మీతో చెబుతున్నాను
  rationale: γάρ యొక్క ముందున్న విలాపం/తీర్పుతో గల వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’ నిలుపుతుంది; λέγω ... ὑμῖν అనే ప్రత్యక్ష సంబోధనకు ఇది సహజమైన ఆధునిక తెలుగు.
- source_word: οὐ μή
  choice: ఎంతమాత్రమూ చూడరు
  rationale: οὐ μή తో కూడిన బలమైన నిరాకరణను సహజమైన తెలుగులో ‘ఎంతమాత్రమూ ... చూడరు’ అని వ్యక్తం చేశాం; సాధారణ నిరాకరణకంటే దీని ఉద్ఘాటన బలంగా ఉంటుంది.
- source_word: ἴδητε
  choice: చూడరు
  rationale: ὁράω యొక్క సాధారణ దృష్టి భావాన్ని సరళంగా, స్పష్టంగా అందిస్తుంది.
- source_word: ἀπ’ ἄρτι
  choice: ఇకనుంచి
  rationale: ప్రస్తుత క్షణం మొదలుకొని అనే కాలారంభ భావాన్ని సహజమైన సంక్షిప్త తెలుగులో నిలుపుతుంది.
- source_word: ἕως ἂν εἴπητε
  choice: మీరు చెప్పేంతవరకు
  rationale: ἕως ἄν తో subjunctive సూచించే భవిష్యత్ పరిమితి/సంభావ్యతను తెలుగులో అనవసరంగా నిర్దిష్టం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: Εὐλογημένος
  choice: ధన్యుడు
  rationale: కీర్తన ఉల్లేఖనంలోని ఆశీర్వాద ప్రకటనను, దాని లేఖన ప్రతిధ్వనిని నిలుపుతూ తెలిపే స్థిరమైన తెలుగు పదం.
- source_word: ὁ ἐρχόμενος
  choice: వచ్చేవాడు
  rationale: ఆర్టికల్‌తో ఉన్న కృదంతాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సందర్భం చెప్పనిదానికంటే బలమైన బిరుదు భావాన్ని చేర్చదు.
- source_word: ἐν ὀνόματι κυρίου
  choice: ప్రభువు పేరట
  rationale: ‘ప్రభువు పేరు యొక్క అధికారంలో/ప్రాతినిధ్యంలో’ అనే వాక్యబంధాన్ని సహజమైన తెలుగు లేఖన శైలిలో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος కు గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగు సమానార్థకం; ఏ ప్రత్యేక వ్యాఖ్యానాన్ని చేర్చదు.
theological_decisions:
- issue: భవిష్యత్తులో చూడటం మరియు ఒప్పుకోవడం గురించి యేసు ప్రకటన యొక్క ఉద్దేశం
  choice: ఉల్లేఖిత ఆశీర్వాద వాక్యాన్ని వారు పలికేంతవరకు ఆయనను చూడరనే గంభీరమైన ప్రకటనగా ఉంచడం; అది జరిగే ఖచ్చితమైన చారిత్రక లేదా అంత్యకాల సందర్భాన్ని పేర్కొనకపోవడం.
  alternative: దీనిని ప్రత్యేకంగా విజయప్రవేశం, రెండవ రాకడ, లేదా ఇశ్రాయేలు భవిష్యత్ పశ్చాత్తాపం అని అనువాదంలోనే నిర్ణయించడం.
  rationale: గ్రీకు వాక్యం భవిష్యత్ దర్శనానికి ఉల్లేఖిత పలుకును పరిమితిగా ఉంచుతుంది గాని, ఆ సందర్భాన్ని స్పష్టంగా నిర్వచించదు. అందువల్ల అనువాదం ఆ వేదాంతపరమైన ఉద్రిక్తతను తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరమైన లేఖన ధోరణితో రూపొందించబడింది. తెలుగు వాక్యప్రవాహం సహజంగా ఉండేందుకు కాలపరిమితి ఉపవాక్యాన్ని ప్రధాన నిరాకరణకు ముందు ఉంచాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
