revisions:
- from: దేవాలయం మీద ఒట్టు పెట్టుకునే ఎవరైనా, దాని మీదా దానిలో నివసించే ఆయన మీదా ఒట్టు పెట్టుకుంటున్నారు.[a]
  to: దేవాలయం మీద ప్రమాణం చేసే ఎవరైనా, దానిమీదా దానిలో నివసించేవానిమీదా ప్రమాణం చేస్తాడు.[a]
