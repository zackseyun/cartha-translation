  text: καὶ ὁ ὀμόσας ἐν τῷ ναῷ ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ ⸀κατοικοῦντι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: te
  text: దేవాలయం మీద ప్రమాణం చేసే ఎవరైనా, దానిమీదా దానిలో నివసించేవానిమీదా ప్రమాణం చేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూల గ్రీకులో ఇక్కడి పదం అక్షరార్థంగా “లో” అని అర్థమిస్తుంది: “దేవాలయంలో … దానిలో.” అయితే ఈ ప్రమాణ సూత్రంలో అది “మీద ప్రమాణం” అనే భావాన్ని ఇస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: ఒట్టు పెట్టుకునే ఎవరైనా
  rationale: ఆర్టికల్‌తో ఉన్న భూతకాల కృదంతం సాధారణంగా ఎవరినైనా సూచిస్తుంది. ఈ రూపం లింగభేదం చూపకుండా సహజమైన ఆధునిక తెలుగులో ఆ సాధారణ భావాన్ని అందిస్తుంది.
- source_word: ἐν τῷ ναῷ
  choice: దేవాలయం మీద
  rationale: ἐν అనే విభక్త్యర్థక పదానికి సాధారణంగా ‘లో’ అని అర్థమైనా, ఈ సందర్భంలోని ఒట్టు సూత్రంలో ప్రమాణంగా పిలిచే దానిని సూచిస్తూ ‘మీద’ అనే భావం ఇస్తుంది.
- source_word: ναῷ
  choice: దేవాలయం
  rationale: ναός దేవాలయాన్ని, ప్రత్యేకంగా దాని పవిత్ర మందిర భాగాన్ని సూచించగలదు. ఈ సందర్భంలో ‘దేవాలయం’ సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ὀμνύει
  choice: ఒట్టు పెట్టుకుంటున్నారు
  rationale: వర్తమానకాల క్రియ ఇక్కడ ఒక సాధారణ సూత్రాన్ని తెలుపుతుంది. తెలుగులో గౌరవ/లింగతటస్థ బహువచన అన్వయం ‘ఎవరైనా’తో సహజంగా సరిపోతుంది.
- source_word: ἐν αὐτῷ
  choice: దాని మీదా
  rationale: మొదటి ἐν మాదిరిగానే ఇది కూడా ఒట్టు సందర్భంలో ప్రమాణంగా పిలిచే వస్తువును సూచిస్తుంది; ‘దాని’ దేవాలయాన్ని తిరిగి సూచిస్తుంది.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: దానిలో నివసించే ఆయన మీదా
  rationale: వర్తమాన కృదంతం దేవాలయంలో నివసించే వ్యక్తిని, సందర్భానుసారం దేవుణ్ణి, సూచిస్తుంది. ‘ఆయన’ గౌరవాన్ని చూపుతూ దేవుని పేరును మూలపాఠంలో లేనందున ప్రత్యక్షంగా చేర్చదు.
theological_decisions:
- issue: దేవాలయంలో నివసించే వ్యక్తి గుర్తింపు
  choice: ‘దానిలో నివసించే ఆయన’ అని, సందర్భంలో దేవుణ్ణి సూచించేలా అనువదించడం
  alternative: ‘దానిలో నివసించే వ్యక్తి’ లేదా మూలంలో లేని ‘దేవుడు’ అనే పేరును నేరుగా చేర్చడం
  rationale: సందర్భం ఈ వ్యక్తి దేవుడని స్పష్టం చేస్తుంది. అయినా గ్రీకు పాఠం θεός అని నేరుగా చెప్పకుండా కృదంత రూపాన్ని వాడుతుంది; అందువల్ల ‘ఆయన’ ఆ సూచనను నిలుపుతూ మూలంలోని పరోక్షతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వినిపించే ‘మీద ఒట్టు పెట్టుకోవడం’ అనే ప్రయోగాన్ని వాడాం. ‘ఎవరైనా … పెట్టుకుంటున్నారు’ అనే గౌరవ/లింగతటస్థ అన్వయం సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; వాక్యానికి గంభీరతను కూడా నిలుపుతుంది.
