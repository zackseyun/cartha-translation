review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the oath-formula force of both occurrences of ἐν as “మీద” and correctly identifies αὐτόν as referring to the temple. However, “ఒట్టు పెట్టుకునే” is less precise and less idiomatic here than “ప్రమాణం చేసే,” and the finite verb should express the generic singular relation cleanly.
  naturalness: “దేవాలయం మీద ఒట్టు పెట్టుకోవడం” is understandable, but “దేవాలయం మీద ప్రమాణం చేయడం” is more natural in formal modern Telugu biblical register. The present plural “పెట్టుకుంటున్నారు” after “ఎవరైనా” is possible as polite usage but weakens the aphoristic construction; singular “చేస్తాడు” is clearer.
  terminology: Use “ప్రమాణం చేయు” consistently for ὀμνύω in this oath discussion. “నివసించేవానిమీద” retains the Greek substantival participle and leaves the divine referent implicit, without requiring the supplied honorific pronoun “ఆయన.”
  issues:
  - severity: medium
    issue: “ఒట్టు పెట్టుకునే / ఒట్టు పెట్టుకుంటున్నారు” is an imprecise and somewhat colloquial rendering of the oath verb.
    rationale: ὀμνύω means to swear or make an oath. “ప్రమాణం చేయు” is the standard, suitably formal Telugu equivalent and fits the repeated oath construction.
  - severity: low
    issue: The generic construction “ఎవరైనా … పెట్టుకుంటున్నారు” is stylistically uneven.
    rationale: The Greek has a generic substantival participle followed by a present indicative. “ఎవరైనా … చేస్తాడో” gives a natural Telugu generalizing construction.
  - severity: low
    issue: “దానిలో నివసించే ఆయన” adds an honorific pronoun not represented overtly in the Greek participial phrase.
    rationale: The referent is contextually God, but “దానిలో నివసించేవానిమీద” preserves the source’s indirect substantival wording while remaining clear.
  revised_text: దేవాలయం మీద ప్రమాణం చేసే ఎవరైనా, దానిమీదా దానిలో నివసించేవానిమీదా ప్రమాణం చేస్తాడు.[a]
