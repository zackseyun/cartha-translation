review_pass:
  verdict: revise
  source_fidelity: The draft conveys the denunciation, exploitation of widows, long prayers, and comparative punishment. However, “పైకి కనిపించడానికి” weakens πρόφασις, which specifically denotes a pretext or pretence; the revision makes that deceptive function explicit. “తీర్పు” more directly represents κρίμα while the context itself retains its condemnatory force.
  naturalness: The revised wording uses idiomatic modern standard Telugu with a solemn prophetic rebuke. “కపటులారా” is a more direct and natural equivalent for ὑποκριταί than “వేషధారులైన,” and “విధవరాళ్ల ఇళ్లను కబళిస్తారు” preserves the forceful metaphor without sounding unnatural.
  terminology: “శాస్త్రులారా, పరిసయ్యులారా” appropriately retains the conventional biblical designations. “సాకుగా దీర్ఘంగా ప్రార్థిస్తారు” accurately expresses προφάσει μακρὰ προσευχόμενοι. “మరింత తీవ్రమైన తీర్పు” preserves the breadth of κρίμα and does not over-specify the precise nature of the punishment.
  issues:
  - severity: medium
    issue: The phrase “పైకి కనిపించడానికి” does not adequately render προφάσει.
    rationale: The Greek means “as a pretext/for pretence,” not merely “to be seen outwardly.” The translation should explicitly communicate deceptive religious display or a false pretext.
  - severity: low
    issue: “శిక్షావిధి” narrows κρίμα more than necessary.
    rationale: Although the context is clearly adverse, κρίμα literally denotes judgment, verdict, or sentence. “తీర్పు” preserves the source term’s scope while “తీవ్రమైన” communicates the comparative punitive sense.
