- from: “వేషధారులైన శాస్త్రులారా, పరిసయ్యులారా, మీకు అయ్యో![a] ఎందుకంటే మీరు విధవరాళ్ల ఇళ్లను మింగివేస్తూ, పైకి కనిపించడానికి దీర్ఘంగా ప్రార్థనలు చేస్తారు. అందువల్ల మీరు మరింత తీవ్రమైన శిక్షావిధిని పొందుతారు.”
