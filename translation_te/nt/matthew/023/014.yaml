source:
  edition: robinson-pierpont-2005-byzantine
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κατεσθίετε τὰς οἰκίας τῶν χηρῶν, καὶ προφάσει μακρὰ προσευχόμενοι· διὰ τοῦτο λήψεσθε περισσότερον κρίμα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: te
  text: “కపటులైన శాస్త్రులారా, పరిసయ్యులారా, మీకు అయ్యో![a] ఎందుకంటే మీరు విధవరాళ్ల ఇళ్లను కబళిస్తూ, సాకుగా దీర్ఘంగా ప్రార్థిస్తారు. అందువల్ల మీరు మరింత తీవ్రమైన తీర్పును పొందుతారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం అత్యంత ప్రాచీన గ్రీకు ప్రతుల్లో (నాలుగవ శతాబ్దపు సీనైటికస్, వాటికానస్ ప్రతులతో సహా), అలాగే ప్రాచీన కాప్టిక్ అనువాదాల్లో లేదు. అయితే బైజాంటైన్ అధికసంఖ్యాక ప్రతుల సంప్రదాయంలో, ప్రాచీన లాటిన్, వల్గేట్, సిరియాక్ అనువాదాల్లో ఉంది. మార్కు 12:40; లూకా 20:47లోని సమాంతర వాక్యాలకు సరిపోల్చడానికి తరువాతి నకలుదారులు దీన్ని చేర్చి ఉండవచ్చు. ఈ వచనం ఉన్న ప్రతుల్లో కూడా ఇది 13వ వచనానికి ముందా, తరువాతా అనే విషయంలో భేదం ఉంది.
    reason: textual_critical
lexical_decisions:
- source_word: κατεσθίετε
  choice: మింగివేస్తూ
  rationale: ‘తినివేయడం’ అనే బలమైన రూపకాన్ని నిలుపుతూ, రక్షణలేని విధవరాళ్ల ఆస్తిని నిర్దాక్షిణ్యంగా దోచుకొని వారిని ఆర్థికంగా నాశనం చేయడాన్ని సూచిస్తుంది.
- source_word: προφάσει
  choice: పైకి కనిపించడానికి
  rationale: నిజమైన దురుద్దేశాన్ని కప్పిపుచ్చే బాహ్య భక్తి ప్రదర్శన అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: περισσότερον
  choice: మరింత తీవ్రమైన
  rationale: శిక్షావిధి సందర్భంలో పరిమాణం కంటే అధిక తీవ్రతను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: κρίμα
  choice: శిక్షావిధి
  rationale: పదానికి ‘తీర్పు’ అనే విస్తృత అర్థం ఉన్నప్పటికీ, ఈ ప్రతికూల న్యాయసందర్భంలో దోషనిర్ణయంతో కూడిన శిక్ష అనే భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: περισσότερον κρίμα యొక్క స్వరూపం
  choice: మరింత తీవ్రమైన శిక్షావిధి
  alternative: ఎక్కువ తీర్పు
  rationale: పాఠ్యం శిక్ష యొక్క ఖచ్చిత రూపాన్ని వివరించదు; అయితే తులనాత్మకమైన ఎక్కువ తీవ్రతను సూచిస్తుంది. అందువల్ల దానిని నిర్దిష్ట అంత్యకాల సిద్ధాంతంగా విస్తరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవక్తీయ గద్దింపు ధోరణిని నిలిపాం. ‘మీకు అయ్యో’ ద్వారా Οὐαὶ యొక్క తీర్పు-విలాప భావం, ‘మింగివేస్తూ’ ద్వారా మూలంలోని ఉద్దేశపూర్వక బలమైన రూపకం నిలిచాయి.
