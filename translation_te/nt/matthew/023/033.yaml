id: MAT.23.33
reference: Matthew 23:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: te
  text: పాములారా, విషసర్పాల సంతానమా! గెహెన్నా[a] తీర్పు నుండి మీరు ఎలా తప్పించుకుంటారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నరక తీర్పు.” గ్రీకు పదం: “గెహెన్నా.”'
    reason: ‘గెహెన్నా’ అనే మూలపదాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సాధారణంగా తెలిసిన అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: ὄφεις
  choice: పాములారా
  rationale: నేరుగా సంబోధిస్తూ చేసిన తీవ్ర గద్దింపును సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: γεννήματα
  choice: సంతానమా
  rationale: పుట్టినవారు లేదా ఉత్పన్నమైనవారు అనే భావాన్ని చూపుతూ, తరువాతి షష్ఠీ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐχιδνῶν
  choice: విషసర్పాల
  rationale: సాధారణ పాములకన్నా విషపూరితమైన సర్పాలనే నిర్దిష్టమైన, తీవ్రమైన చిత్రాన్ని తెలియజేస్తుంది.
- source_word: πῶς
  choice: ఎలా
  rationale: తప్పించుకునే అవకాశం లేదా మార్గాన్ని సవాలు చేసే అలంకారప్రశ్న స్వభావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: φύγητε
  choice: తప్పించుకుంటారు
  rationale: తీర్పు నుండి పారిపోయి తప్పించుకోవడం అనే ఫలితార్థాన్ని, భవిష్యదర్థ ప్రశ్నను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: κρίσεως
  choice: తీర్పు
  rationale: గ్రీకు పదంలోని న్యాయనిర్ణయ భావాన్ని కాపాడుతుంది; ‘శిక్ష’ లేదా ‘దోషనిర్ణయం’ అని అనువదించి భావాన్ని అనవసరంగా సంకుచితం చేయదు.
- source_word: γεέννης
  choice: గెహెన్నా
  rationale: యూదుల చారిత్రక, అంత్యకాల నేపథ్యమున్న నిర్దిష్ట గ్రీకు పదాన్ని ‘నరకం’గా సమతలీకరించకుండా లిప్యంతరీకరిస్తుంది; సాధారణ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: γέεννα పదం అనువాదం
  choice: గెహెన్నా
  alternative: నరకం
  rationale: మూలభాషలోని నిర్దిష్ట పదాన్నీ దాని యూదు నేపథ్యాన్నీ నిలుపుతుంది; తరువాతి కాలపు ‘నరకం’ అనే పదానికి సంబంధించిన భావాలన్నిటినీ వచనంలోకి దిగుమతి చేయదు.
- issue: κρίσεως యొక్క పరిధి
  choice: తీర్పు
  alternative: దోషనిర్ణయం / శిక్ష
  rationale: దైవిక న్యాయనిర్ణయాన్ని సూచించే విస్తృత పదాన్నే ఉపయోగించి, గ్రీకు పదం ఒంటరిగా తప్పనిసరిగా చెప్పనంతగా ఫలితాన్ని ముందే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన ప్రత్యక్ష గద్దింపు శైలిని ఉపయోగించాం. ‘పాములారా, విషసర్పాల సంతానమా!’ అనే సమాంతర సంబోధనలు మూలంలోని తీవ్రతను నిలుపుతాయి. ‘మీరు ఎలా తప్పించుకుంటారు?’ అనేది భవిష్యదర్థాన్నీ అలంకారప్రశ్నలోని సవాలునీ సహజంగా వ్యక్తం చేస్తుంది.
