id: MAT.23.18
reference: Matthew 23:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: te
  text: మరియు, ‘బలిపీఠం తోడు అని ప్రమాణం చేసేవాడు—అది ఏమీ కాదు[b]; అయితే దానిపై ఉన్న కానుక[a] తోడు అని ప్రమాణం చేసేవాడు బాధ్యత కలిగి ఉంటాడు.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అర్పణ.’ ఈ గ్రీకు పదం దేవాలయంలో దేవునికి సమర్పించే కానుకను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, యేసు ఖండిస్తున్న ఈ బోధ ప్రకారం, బలిపీఠం తోడు అని చేసిన ప్రమాణం ‘లెక్కలోకి రాదు’; కానీ దానిపై ఉన్న కానుక తోడు అని చేసిన ప్రమాణం మాత్రం బంధకమైనదిగా పరిగణించబడుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: καί
  choice: ఇంకా
  rationale: ఖండించబడుతున్న బోధల వరుసలో మరో మాటను కొనసాగింపుగా పరిచయం చేస్తుంది.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: ప్రమాణం చేసేవాడు ... అయితే ... ప్రమాణం చేసేవాడు
  rationale: ὅς + ἄν మరియు aorist subjunctive తెలిపే సాధారణ, అనిర్దిష్ట భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: బలిపీఠం తోడని
  rationale: ప్రమాణ సందర్భంలో ἐν ప్రమాణానికి సాక్షిగా లేదా ఆధారంగా దేనిని పిలుస్తున్నారో సూచిస్తుంది; తెలుగు ప్రమాణ వాడుకలో ‘తోడని’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: θυσιαστήριον
  choice: బలిపీఠం
  rationale: దేవాలయంలోని బలులు అర్పించే పీఠానికి ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
- source_word: οὐδέν ἐστιν
  choice: అది ఏమీ కాదు
  rationale: గ్రీకు వాక్యపు సంక్షిప్తతను నిలుపుతూ, ఆ ప్రమాణానికి విలువ లేదా బంధక శక్తి లేదని వారు చెప్పిన మాటను యథాతథంగా ఉంచుతుంది; వివరణను పాదటిప్పణిలో ఇస్తుంది.
- source_word: ἐν τῷ δώρῳ
  choice: కానుక తోడని
  rationale: δῶρον యొక్క ప్రత్యక్ష అర్థం ‘కానుక’; దేవాలయ సందర్భంలో అది దేవునికి సమర్పించిన అర్పణను సూచించగలదు.
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: దానిపై ఉన్న
  rationale: కానుక బలిపీఠం మీద ఉన్న స్థాన సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలుపుతుంది.
- source_word: ὀφείλει
  choice: బాధ్యుడవుతాడు
  rationale: ప్రమాణం వల్ల కలిగే నైతిక బంధాన్ని తెలియజేస్తూనే, గ్రీకులో చెప్పని కర్మను—ఉదాహరణకు ‘దాన్ని నెరవేర్చడానికి’—ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: ప్రమాణం వల్ల కలిగే బాధ్యతకు సంబంధించిన కర్మ గ్రీకులో వ్యక్తంగా లేకపోవడం
  choice: ‘బాధ్యుడవుతాడు’ అని మాత్రమే అనువదించడం
  alternative: ‘తన ప్రమాణాన్ని నెరవేర్చడానికి బాధ్యుడవుతాడు’ లేదా ‘ఆ ప్రమాణానికి కట్టుబడి ఉంటాడు’
  rationale: ὀφείλει ఏ విషయంలో బాధ్యత ఉందో ఇక్కడ వ్యక్తంగా చెప్పదు. సందర్భం ప్రమాణాన్ని నిలబెట్టుకోవడమే ఉద్దేశమని సూచించినా, కర్మను చేర్చకుండా మూలంలోని సంక్షిప్తతను, అంతర్లీన భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ప్రమాణ వాడుకలో ‘తోడని’ సహజంగా ఉండగా, ‘అది ఏమీ కాదు’ మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను నిలుపుతుంది. ఆంగ్ల సంప్రదింపుపాఠ్యంలో [a] గుర్తు ‘And’ వద్ద కనిపించినా, దాని పాదటిప్పణి δῶρον (‘gift/offering’) గురించినది కాబట్టి తెలుగు ప్రధాన పాఠ్యంలో ‘కానుక’ వద్ద ఉంచబడింది.
