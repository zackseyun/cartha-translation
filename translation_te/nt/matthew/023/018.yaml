- from: ఇంకా, ‘బలిపీఠం తోడని ప్రమాణం చేసేవాడు—అది ఏమీ కాదు[b]; అయితే దానిపై ఉన్న కానుక[a] తోడని ప్రమాణం చేసేవాడు బాధ్యుడవుతాడు.’
