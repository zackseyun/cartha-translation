base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/006.yaml
  text: And they love the places of honor at banquets and the best seats in the synagogues[c][b][a],
translation:
  language: te
  text: విందుల్లో గౌరవస్థానాన్నీ[a][c], సమాజమందిరాల్లో ప్రధాన ఆసనాలనూ[b] వారు ఇష్టపడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భోజనబల్ల దగ్గర ప్రధాన స్థానం.’ ప్రాచీన కాలపు లాంఛనప్రాయ భోజనాల్లో అతిథులు పరుండి భోజనం చేసేవారు; వారిలో అత్యంత గౌరవనీయునికి ప్రత్యేక స్థానం ఉండేది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రధాన ఆసనాలను.’ గ్రీకు పదం అత్యున్నత హోదా లేదా ప్రాధాన్యం గల ఆసనాలను నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: ప్రాచీన మధ్యధరా ప్రాంతపు విందుల్లో అతిథుల స్థానాలు వారి గౌరవస్థాయిని బహిరంగంగా చూపించేవి. కాబట్టి ఇక్కడ సౌకర్యం కంటే ప్రజల ముందు హోదా పొందాలనే కోరిక ప్రధానంగా ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: φιλοῦσι
  choice: ఇష్టపడతారు
  rationale: ఇక్కడ φιλέω బలమైన అభిరుచిని సూచిస్తుంది; ‘ఇష్టపడతారు’ సహజమైన ఆధునిక తెలుగు పదం, అలాగే యేసు విమర్శలోని నైతిక బలాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ స్వల్ప అనుసంధానకంగా ముందున్న వర్ణనను కొనసాగిస్తుంది. తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘మరియు’ చేర్చకపోయినా ఆ కొనసాగింపు సహజంగా వ్యక్తమవుతుంది.
- source_word: τὴν πρωτοκλισίαν
  choice: గౌరవస్థానాన్ని
  rationale: ఈ పదం భోజన సమయంలో అత్యున్నత గౌరవం కలిగిన పరుండే స్థానాన్ని సూచిస్తుంది. ఏకవచనాన్ని నిలుపుతూ, పురాతన భోజనాచారం తెలియని పాఠకునికీ సామాజిక గౌరవ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐν τοῖς δείπνοις
  choice: విందుల్లో
  rationale: δεῖπνον భోజనం లేదా రాత్రి భోజనాన్ని సూచించినా, ఇక్కడ బహిరంగ హోదా ప్రదర్శితమయ్యే సందర్భం కాబట్టి ‘విందుల్లో’ సందర్భోచితంగా ఉంది.
- source_word: τὰς πρωτοκαθεδρίας
  choice: ముఖ్యమైన ఆసనాలను
  rationale: సమాజమందిరంలో అత్యున్నత హోదా లేదా ప్రాధాన్యం గల ఆసనాలను సూచిస్తుంది. ‘ముఖ్యమైన ఆసనాలు’ మూలంలోని స్థాయి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: సమాజమందిరాల్లో
  rationale: యూదుల ఆరాధన, సభా స్థలాలను సూచించే ‘సమాజమందిరాలు’ ఆధునిక ప్రామాణిక తెలుగు బైబిలు వాడుకలో స్పష్టమైన పదం.
