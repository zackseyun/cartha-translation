  verdict: revise
  source_fidelity: The imperative force of πληρώσατε and the metaphor of τὸ μέτρον are retained. However, కూడా (‘also/too’) adds a comparative nuance not explicitly expressed by καὶ. ‘మరి మీరు’ more naturally carries the connective and emphatic shift of καὶ ὑμεῖς in this denunciatory context.
  naturalness: ‘మరి మీరు’ is idiomatic modern-standard Telugu in a rhetorical address. ‘మీ పితరుల కొలతను నింపండి’ deliberately retains the compact, somewhat striking source metaphor; the footnote supplies the contextual sense without making it primary.
  terminology: ‘పితరులు’ suitably preserves the formal biblical register and the source’s paternal/ancestral wording. ‘కొలత’ is an appropriate literal equivalent for μέτρον. The footnote’s ‘పాపాల పూర్తి కొలత’ is appropriately marked as an interpretive alternative.
  issues:
  - severity: low
    issue: ‘కూడా’ for καὶ
    rationale: కూడా normally means ‘also/too’ and can suggest ‘you likewise,’ whereas the Greek connective simply continues the address with an emphatic ‘you.’ ‘మరి మీరు’ preserves the rhetorical transition more closely.
