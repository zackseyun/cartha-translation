  yaml_path: translation/nt/matthew/023/032.yaml
  text: And you[a], fill up the measure of your fathers.
translation:
  language: te
  text: మరి మీరు, మీ పితరుల కొలతను నింపండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ పితరుల పాపాల పూర్తి కొలతను నింపండి.” గ్రీకులో అక్షరార్థంగా “మీ పితరుల కొలతను నింపండి” అని ఉంది. పోగవుతున్న అపరాధం తన పరిమితికి చేరడాన్ని తెలిపే రూపకం ఇది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: కూడా
  rationale: ముందరి వాక్యంతో ఉన్న అనుసంధానాన్ని, ‘మీ పితరులలాగే మీరు కూడా’ అనే సందర్భోచిత కొనసాగింపును సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ὑμεῖς
  choice: మీరు
  rationale: గ్రీకులో స్పష్టంగా ఉన్న కర్త సర్వనామంలోని ఉద్ఘాటనను నిలుపుతుంది; బహువచన సంబోధనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πληρώσατε
  choice: నింపండి
  rationale: ఇది ద్వితీయ పురుష బహువచన ఆజ్ఞార్థక రూపం. ఆజ్ఞ రూపాన్నీ, ఒక కొలత పూర్తిగా నిండే రూపకాన్నీ కాపాడుతుంది.
- source_word: τὸ μέτρον
  choice: కొలతను
  rationale: పరిమితికి చేరేంతగా పోగయ్యే దోషాన్ని సూచించే మూల రూపకాన్ని వ్యాఖ్యానించి మార్చకుండా నిలుపుతుంది.
- source_word: τῶν πατέρων ὑμῶν
  choice: మీ పితరుల
  rationale: ‘మీ పూర్వికుల’ అనే భావం సందర్భంలో ఉన్నప్పటికీ, మూలంలోని ‘తండ్రులు/పితరులు’ అనే పదాన్ని మరియు వంశపారంపర్య కార్యాలపై ఉన్న వాక్చాతుర్య సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యేసు మాట ఆజ్ఞా, లేక ముందుగా చెప్పిన అంచనా వాక్యమా?
  choice: వ్యంగ్యభరితమైన న్యాయతీర్పు ధ్వనిగల ఆజ్ఞగా ‘నింపండి’
  alternative: ‘మీరు నింపుతున్నారు’ లేదా ‘నింపుతారు’ అనే సూచన/అంచనా
  rationale: πληρώσατε వ్యాకరణపరంగా భూతకాలాంశం గల క్రియాశీల ఆజ్ఞార్థక ద్వితీయ పురుష బహువచనం. కాబట్టి ఆజ్ఞ రూపాన్ని నిలుపుతూ, సందర్భంలోని వ్యంగ్యమైన ఖండనను పాఠకుడు గ్రహించేలా ఉద్రిక్తతను పరిష్కరించకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి. ‘పితరులు’ అనే బైబిలు సందర్భానికి తగిన పదాన్ని ఉంచి, అస్పష్టమైన ‘కొలత’ రూపకాన్ని ప్రధాన పాఠ్యంలో కాపాడి, దాని భావాన్ని పాదటిప్పణిలో వివరించాం.
