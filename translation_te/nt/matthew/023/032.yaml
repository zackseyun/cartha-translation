- from: మీరు కూడా మీ పితరుల కొలతను నింపండి.[a]
  to: మరి మీరు, మీ పితరుల కొలతను నింపండి.[a]
  rationale: The sole revision replaces ‘మీరు కూడా’ with ‘మరి మీరు’ to avoid importing an unnecessary ‘also/too’ nuance while retaining the Greek connective and explicit-pronoun emphasis. The main text continues to preserve the imperative and the unexpanded metaphor; the footnote retains the contextual interpretive gloss.
