id: MAT.23.3
reference: Matthew 23:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: te
  text: కాబట్టి వారు మీకు ఏవేవి చెబుతారో అవన్నీ చేయండి మరియు పాటించండి. అయితే వారి క్రియల ప్రకారం చేయకండి[a]. ఎందుకంటే వారు చెబుతారు గాని చేయరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు చేసే విధంగా చేయకండి.”
    reason: κατὰ τὰ ἔργα αὐτῶν అనే పదబంధానికి అర్థాన్ని సహజంగా తెలిపే ప్రత్యామ్నాయ అనువాదం; మూలంలోని ప్రస్తుత ప్రవర్తన భావాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: కాబట్టి ... ఏవేవి ... అవన్నీ
  rationale: οὖν యొక్క నిర్ధారణాత్మక భావాన్ని ‘కాబట్టి’ తెలియజేస్తుంది. πάντα మరియు ὅσα ἐὰν కలిగిన సమగ్ర భావాన్ని సహజమైన తెలుగు జతప్రయోగమైన ‘ఏవేవి ... అవన్నీ’ నిలుపుతుంది.
- source_word: εἴπωσιν ὑμῖν
  choice: వారు మీకు ... చెబుతారో
  rationale: λέγω యొక్క సాధారణ అర్థమైన ‘చెప్పడం’ను నిలుపుతూ, మూలంలో లేని ‘బోధిస్తారో’ లేదా ‘ఆజ్ఞాపిస్తారో’ అనే మరింత నిర్దిష్ట భావాన్ని చేర్చలేదు.
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: చేయండి, పాటించండి
  rationale: ποιέω మరియు τηρέω మధ్య ఉన్న భేదాన్ని వరుసగా ‘చేయండి’, ‘పాటించండి’ అని వ్యక్తం చేసింది. రెండింటినీ ఒకే క్రియగా కుదించలేదు.
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν
  choice: అయితే వారి క్రియల ప్రకారం
  rationale: κατά సూచించే ప్రమాణం లేదా అనుసరణ భావాన్ని ‘ప్రకారం’ నిలుపుతుంది. ἔργα కు ‘క్రియలు’ అని ఇవ్వడం వాక్యంలోని చేయడం అనే కార్యభావంతో సంబంధాన్ని కాపాడుతుంది; మరింత సహజమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: μὴ ποιεῖτε
  choice: చేయకండి
  rationale: నిషేధ ఆజ్ఞను నేరుగా తెలియజేస్తూ, ποιέω వాక్యంలో పునరావృతమవుతున్న శబ్దార్థ సంబంధాన్ని ‘చేయండి/చేయకండి/చేయరు’ ద్వారా నిలుపుతుంది.
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: ఎందుకంటే వారు చెబుతారు గాని చేయరు
  rationale: గ్రీకులోని సంక్షిప్తమైన మాట-చర్య వ్యత్యాసాన్ని, మూలంలో స్పష్టంగా లేని కర్మను చేర్చకుండా, సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: మునుపటి వచనంలో ప్రస్తావించిన శాస్త్రులు, పరిసయ్యుల బోధనా అధికారాన్ని ఈ వచనంలో స్పష్టంగా చేర్చాలా?
  choice: ఈ వచనంలో ఉన్నట్లే కర్తను ‘వారు’గా ఉంచి, ‘బోధించేవన్నీ’ లేదా ‘మోషే పీఠం నుండి చెప్పేవన్నీ’ అని విస్తరించలేదు.
  alternative: ‘వారు మీకు బోధించేవన్నీ’ లేదా ‘మోషే పీఠం నుండి వారు చెప్పేవన్నీ’ అని అనువదించడం.
  rationale: సమీప సందర్భం ‘వారు’ ఎవరనే విషయాన్ని తెలియజేస్తుంది; కానీ ఈ వచనం ఆ వివరాలను మళ్లీ చెప్పదు. అందువల్ల సందర్భాన్ని అనువాదంలో వివరణగా చేర్చి వాక్యంలోని విస్తృతతను పరిమితం చేయలేదు.
- issue: చేయడం సూచించే క్రియల పునరావృతాన్ని శైలికోసం మార్చాలా?
  choice: ‘చేయండి ... చేయకండి ... చేయరు’ అనే పునరావృతాన్ని నిలిపాం.
  alternative: ‘ఆచరించండి ... అనుకరించకండి ... పాటించరు’ వంటి భిన్న క్రియలు వాడడం.
  rationale: ποιέω యొక్క ఉద్దేశపూర్వక పునరావృతం వారి మాటలకు, క్రియలకు మధ్య ఉన్న విరోధాన్ని బలంగా చూపుతుంది. దానిని సున్నితపరచకుండా నిలుపడం వచనంలోని వాక్చాతుర్యాన్నీ, నైతిక ఉద్రిక్తతనూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఆజ్ఞారూపాలను వాడాం. ‘క్రియలు’ కొంత అధికారిక పదమైనా ἔργα యొక్క రూపాన్ని, వాక్యంలోని కార్యభావాన్ని నిలుపుతుంది; దాని సహజ ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చాం.
