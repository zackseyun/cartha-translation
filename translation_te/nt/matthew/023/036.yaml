  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: te
  text: 'నిజంగా నేను మీతో చెబుతున్నాను: ఇవన్నీ ఈ తరంపైకి వస్తాయి.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఈ తరం’ అనే మాటను కొందరు ‘ఈ ప్రజలు’ అని లేదా మరింత విస్తృతంగా అవిశ్వాసుల తరమని కూడా అర్థం చేసుకుంటారు; అయితే గ్రీకు పాఠం అత్యంత ప్రత్యక్షంగా ‘ఈ తరం’ అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: నిజంగా
  rationale: సినాప్టిక్ సువార్తల్లో అధికారపూర్వకమైన గంభీర ప్రకటనను పరిచయం చేసే ἀμήν భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: వర్తమానకాల క్రియను, బహువచన దత్తివ సర్వనామాన్ని గంభీరమైనప్పటికీ సహజమైన తెలుగు వాక్యరీతిలో నిలుపుతుంది.
- source_word: ἥξει
  choice: వస్తాయి
  rationale: ἥκω భవిష్యత్ రూపం ఇక్కడ ముందుగా చెప్పిన పరిణామాలు సంబంధిత వారి మీదికి రావడాన్ని సూచిస్తుంది; బహువచన కర్త అయిన ‘ఇవన్నీ’కి అనుగుణంగా ‘వస్తాయి’ వాడబడింది.
- source_word: ταῦτα πάντα
  choice: ఇవన్నీ
  rationale: గ్రీకు నపుంసక బహువచన సూచక సర్వనామం మరియు πᾶς కలయికను తెలుగులో సహజంగా, సంపూర్ణంగా తెలియజేస్తుంది.
- source_word: ἐπὶ
  choice: మీదికి
  rationale: అక్యూసేటివ్‌తో ఉన్న ἐπί సూచించే ‘పైకి/మీదికి రావడం’ అనే దిశాత్మక భావాన్ని నిలుపుతుంది; ‘వ్యతిరేకంగా’ అని అనువదించడం మూలపాఠాన్ని మించి వ్యాఖ్యానించడం అవుతుంది.
- source_word: γενεὰν ταύτην
  choice: ఈ తరంవారి
  rationale: γενεάకు అత్యంత ప్రత్యక్షమైన ‘తరం’ అనే అర్థాన్ని కాపాడుతూ, వ్యక్తుల మీదికి విషయాలు రావడం తెలుగులో సహజంగా ఉండేందుకు ‘తరంవారి’ అని ఇచ్చింది.
theological_decisions:
- issue: γενεὰν ταύτην (‘ఈ తరం’) దేనిని సూచిస్తుంది?
  choice: ‘ఈ తరంవారి’ అని ప్రత్యక్షంగా అనువదించి, దాని పరిధిని విస్తరించలేదు.
  alternative: అవిశ్వాస లక్షణం గల విస్తృత ప్రజావర్గం; కాలమంతటా యూదు ప్రజలు; ప్రస్తుత యుగం.
  rationale: గ్రీకు పాఠం అత్యంత ప్రత్యక్షంగా ‘ఈ తరం’ అని చెబుతుంది. వివాదాస్పదమైన అంత్యకాల వ్యాఖ్యానాన్ని అనువాదంలోనే నిర్ణయించకుండా, సందర్భం ద్వారా అర్థం చేసుకునేలా మూలంలోని కాలసంబంధ బలాన్ని, వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘నిశ్చయంగా’ కూడా సాధ్యమే, కాని ἀμήν యొక్క సత్యనిర్ధారణ భావానికి ‘నిజంగా’ మరింత సూటిగా ఉంది. ‘ఇవన్నీ’ గ్రీకు బహువచనాన్ని సహజంగా నిలుపుతుంది; అందువల్ల ప్రత్యేక lexical-alternative footnote అవసరం లేదు.
