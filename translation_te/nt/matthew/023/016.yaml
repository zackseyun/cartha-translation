id: MAT.23.16
reference: Matthew 23:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: te
  text: '“అంధ మార్గదర్శకులారా, మీకు అయ్యో! మీరు ఇలా అంటారు: ‘ఎవరైనా దేవాలయం మీద ప్రమాణం చేస్తే, అది ఏమీ కాదు[a]; కానీ ఎవరైనా దేవాలయపు బంగారం మీద ప్రమాణం చేస్తే, ఆ ప్రమాణానికి కట్టుబడి ఉండాలి.’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, అలాంటి ప్రమాణాన్ని బంధనకరమైనదిగా పరిగణించరు.
    reason: మూలంలోని ‘అది ఏమీ కాదు’ అనే సంక్షిప్త ప్రయోగం సందర్భంలో సూచించే భావాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: మీకు అయ్యో!
  rationale: ప్రవక్తల తీర్పు ప్రకటనలోని గంభీరమైన ఖండనను సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: ὁδηγοὶ τυφλοὶ
  choice: అంధ మార్గదర్శకులారా
  rationale: ఇతరులకు దారి చూపేవారే అంధులనే మూల రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: οἱ λέγοντες
  choice: మీరు ఇలా అంటారు
  rationale: సంబోధనకు అనుగుణంగా గ్రీకు విశేషణార్థక కృదంతాన్ని సహజమైన తెలుగు వాక్యంగా అందిస్తుంది.
- source_word: Ὃς ἂν ὀμόσῃ
  choice: ఎవరైనా ... ప్రమాణం చేస్తే
  rationale: ἄνతో కూడిన అనిర్దిష్ట షరతును సహజంగా, కచ్చితంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν τῷ ναῷ
  choice: దేవాలయం తోడు అని
  rationale: ఇక్కడ ἐν ప్రమాణ సూత్రంలో దేనిని సాక్షిగా లేదా ఆధారంగా ఉటంకిస్తున్నారో సూచిస్తుంది; తెలుగు ప్రమాణ వాడుకకు ‘తోడు అని’ సహజం.
- source_word: οὐδέν ἐστιν
  choice: అది ఏమీ కాదు
  rationale: గ్రీకు మాటలోని సంక్షిప్తతనూ, ప్రమాణం బంధనకరం కాదనే సందర్భార్థాన్నీ వ్యాఖ్యానంతో విస్తరించకుండా నిలుపుతుంది.
- source_word: χρυσῷ τοῦ ναοῦ
  choice: దేవాలయపు బంగారం
  rationale: దేవాలయానికీ దాని బంగారానికీ మధ్య ఉద్దేశించిన వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὀφείλει
  choice: అతడు దానికి బద్ధుడు
  rationale: ‘రుణపడి ఉన్నాడు/బాధ్యత కలిగినవాడు’ అనే క్రియార్థాన్ని ప్రమాణ సందర్భంలో సహజంగా తెలుపుతుంది; ‘ప్రమాణానికి’ అని మూలంలో లేని పదాన్ని స్పష్టంగా చేర్చదు.
theological_decisions:
- issue: ప్రమాణానికి సంబంధించిన సంక్షిప్త, అధ్యాహార భాష
  choice: మొదటి భాగంలో ‘అది ఏమీ కాదు’ అనే సంక్షిప్తతను ఉంచి, రెండవ భాగంలో ‘అతడు దానికి బద్ధుడు’ అని ఇవ్వడం
  alternative: ‘ఆ ప్రమాణం చెల్లదు ... ఆ ప్రమాణానికి కట్టుబడి ఉండాలి’ అని రెండు భాగాలనూ వివరణాత్మకంగా విస్తరించడం
  rationale: యేసు విమర్శిస్తున్న ప్రమాణాల సూక్ష్మ భేదాన్ని పాఠకుడు గ్రహించేంత స్పష్టత ఇస్తూనే, οὐδέν ἐστιν మరియు ὀφείλει అనే మూలంలోని అధ్యాహార స్వభావాన్ని పూర్తిగా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఖండన స్వరం ఉంచబడింది. ‘దేవాలయం తోడు అని ప్రమాణం చేయడం’ తెలుగు ప్రమాణ సూత్రానికి సహజంగా ఉండి, మూలంలోని ἐν యొక్క సందర్భార్థాన్ని తెలియజేస్తుంది. ప్రధాన పాఠంలో ఉన్న [a] గుర్తు పాదసూచికతో సరిపోతుంది.
