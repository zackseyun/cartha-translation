id: MAT.23.19
reference: Matthew 23:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: te
  text: గుడ్డివారలారా! మరి ఏది గొప్పది—కానుకా[a], లేక ఆ కానుకను పవిత్రపరిచే[b] బలిపీఠమా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అర్పణ.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పవిత్రమైనదిగా చేసే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοί
  choice: గుడ్డివారలారా
  rationale: సంబోధనలో ఉన్న బహువచన విశేషణాన్ని వ్యక్తులను సూచించే సహజమైన తెలుగు రూపంలో ఉంచింది; 17వ వచనంలోని ‘మూర్ఖులు’ అనే అదనపు నిందను ఇక్కడ చేర్చలేదు.
- source_word: τί γὰρ μεῖζον
  choice: ఏది గొప్పది
  rationale: τί మరియు μεῖζον కలిగిన తులనాత్మక ప్రశ్నను నేరుగా, సహజంగా అందిస్తుంది. γάρ యొక్క వివరణాత్మక సంబంధం సందర్భం ద్వారా స్పష్టమవుతుంది; తెలుగులో ‘ఎందుకంటే ఏది గొప్పది’ అని పెడితే ప్రశ్న అసహజంగా ఉంటుంది.
- source_word: τὸ δῶρον
  choice: కానుక
  rationale: δῶρον యొక్క ప్రాథమిక అర్థాన్ని నిలుపుతుంది; ఆలయ సందర్భంలో ఇది అర్పణను సూచించగలదనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: θυσιαστήριον
  choice: బలిపీఠం
  rationale: ఆరాధన, బలి సందర్భాల్లో θυσιαστήριονకు ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: τὸ ἁγιάζον
  choice: పవిత్రపరిచే
  rationale: వర్తమాన కృదంతం బలిపీఠాన్ని విశేషిస్తున్న నిర్మాణాన్ని, అలాగే ἁγιάζω యొక్క పవిత్రతకు సంబంధించిన భావబలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: బలిపీఠం కానుకను పవిత్రపరచడం అనే ఆరాధనా భావం
  choice: ఆ కానుకను పవిత్రపరిచే బలిపీఠం
  alternative: ఆ కానుకను పవిత్రమైనదిగా చేసే బలిపీఠం
  rationale: బలిపీఠం కానుకకు పవిత్రతను కలిగిస్తుందనే వాక్యంలోని ఆలయ-పవిత్రత తర్కాన్ని వ్యాఖ్యానించి సడలించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో నేరుగా ప్రశ్నించే, గంభీరమైన మందలింపు శైలిని వాడింది. ‘గుడ్డివారలారా’ వ్యక్తిగత సంబోధనను నిలుపుతుంది; ‘కానుక,’ ‘బలిపీఠం,’ ‘పవిత్రపరిచే’ పదాలు ఆలయ సందర్భపు భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తాయి.
