  revision_rationale: The revision uses a natural modern Telugu oath expression, retains the repeated referential structure of the Greek, renders heaven unambiguously as “స్వర్గం,” and preserves the indirect, reverent reference to the one seated on God's throne. The footnote remains properly anchored and offers the lexical alternative for καθημένῳ.
