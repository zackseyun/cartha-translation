revisions:
- from: పరలోకం తోడు అని ఒట్టు పెట్టుకునేవాడు దేవుని సింహాసనం తోడని, దానిపై ఆసీనుడై ఉన్నవాడు తోడని ఒట్టు పెట్టుకుంటున్నాడు.[a]
  to: స్వర్గాన్ని సాక్షిగా ప్రమాణం చేసేవాడు దేవుని సింహాసనాన్ని, దానిపై ఆసీనుడై ఉన్నవానిని సాక్షిగా ప్రమాణం చేస్తాడు.[a]
  rationale: The revision uses a natural modern Telugu oath expression, retains the repeated referential structure of the Greek, renders heaven unambiguously as “స్వర్గం,” and preserves the indirect, reverent reference to the one seated on God's throne. The footnote remains properly anchored and offers the lexical alternative for καθημένῳ.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:43:07Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies heaven, God's throne, and the one seated on it. However, the repeated construction “తోడు అని/తోడని ఒట్టు పెట్టుకొను” is not a clear or idiomatic modern Telugu equivalent for the oath-formula force of ἐν, and “ఒట్టు పెట్టుకుంటున్నాడు” weakens the Greek's general-principle present with an unnecessarily progressive sense.
  naturalness: “పరలోకం తోడు అని ఒట్టు పెట్టుకునేవాడు” is awkward and potentially unclear in modern standard Telugu. “సాక్షిగా ప్రమాణం చేయు” naturally communicates invoking heaven, the throne, and the enthroned one in an oath. “స్వర్గం” is also the usual modern Telugu term here; “పరలోకం” can suggest the afterlife rather than heaven as God's heavenly realm.
  terminology: “దేవుని సింహాసనం” and “దానిపై ఆసీనుడై ఉన్నవాడు” are accurate and suitably reverent. The revision preserves the Greek's indirect designation of God rather than replacing it with a direct name.
  issues:
  - severity: medium
    issue: The rendering of ἐν as “తోడు అని/తోడని” is unclear and non-idiomatic.
    rationale: In this oath context, the preposition means invoking something as the basis/witness of an oath. “సాక్షిగా ప్రమాణం చేయు” conveys this naturally and consistently in Telugu.
  - severity: low
    issue: “పరలోకం” may carry an afterlife sense.
    rationale: Since οὐρανός here denotes heaven in connection with God's throne, “స్వర్గం” more directly conveys the intended referent in modern standard Telugu.
  - severity: low
    issue: The progressive “ఒట్టు పెట్టుకుంటున్నాడు” is less suitable for the generic maxim.
    rationale: A simple present, “ప్రమాణం చేస్తాడు,” better expresses the general truth conveyed by ὀμνύει.
  revised_text: స్వర్గాన్ని సాక్షిగా ప్రమాణం చేసేవాడు దేవుని సింహాసనాన్ని, దానిపై ఆసీనుడై ఉన్నవానిని సాక్షిగా ప్రమాణం చేస్తాడు.[a]
  revised_footnotes:
