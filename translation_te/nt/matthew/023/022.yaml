id: MAT.23.22
reference: Matthew 23:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: te
  text: స్వర్గాన్ని సాక్షిగా ప్రమాణం చేసేవాడు దేవుని సింహాసనాన్ని, దానిపై ఆసీనుడై ఉన్నవానిని సాక్షిగా ప్రమాణం చేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దానిపై కూర్చున్నవానిని.”
    reason: καθήμενος అనే పదానికి మరింత సాధారణమైన తెలుగు పదప్రయోగాన్ని చూపే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: ఒట్టు పెట్టుకునేవాడు
  rationale: ఆర్టికల్‌తో ఉన్న ఏఓరిస్ట్ పార్టిసిపుల్ ఇక్కడ సాధారణ సూత్రాన్ని తెలిపే నామవాచక ప్రయోగం; తెలుగు సహజ వాడుకలో సాధారణ వర్తమాన భావం తగినది.
- source_word: ἐν
  choice: తోడు అని / తోడని
  rationale: ప్రమాణ వాక్యాల్లో ἐν + దత్తివిభక్తి స్థలార్థకమైన ‘లో’ కంటే, దేనిని సాక్షిగా చేసుకొని ఒట్టు పెట్టడాన్ని సూచిస్తుంది; తెలుగు ప్రమాణ వాడుకలో ‘తోడు’ దీనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐρανῷ
  choice: పరలోకం
  rationale: దేవుని సింహాసనంతో వెంటనే అనుసంధానించబడిన ఈ యూద మతసంబంధ సందర్భంలో ఇది కేవలం ఆకాశాన్ని కాక పరలోకాన్ని సూచిస్తుంది.
- source_word: ὀμνύει
  choice: ఒట్టు పెట్టుకుంటున్నాడు
  rationale: వర్తమాన సూచక క్రియ సాధారణంగా జరిగే వాస్తవాన్ని తెలియజేస్తుంది; వాక్యపు ఫలితభావాన్ని తెలుగులో సహజంగా చూపేందుకు కొనసాగుతున్న వర్తమాన రూపం వాడబడింది.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: దేవుని సింహాసనం
  rationale: మూలంలోని సంబంధవిభక్తి నిర్మాణాన్ని స్పష్టంగా, గంభీరంగా నిలుపుతుంది.
- source_word: τῷ καθημένῳ
  choice: ఆసీనుడై ఉన్నవాడు
  rationale: సింహాసనంపై కూర్చొని ఉన్న వ్యక్తిని సూచించే పార్టిసిపుల్‌కు ‘ఆసీనుడై ఉన్నవాడు’ గౌరవప్రదమైన, సహజమైన తెలుగు రూపం.
- source_word: ἐπάνω αὐτοῦ
  choice: దానిపై
  rationale: సర్వనామం ముందున్న సింహాసనాన్ని సూచిస్తుంది; సింహాసనానికి పైన వేరుగా ఉండటం కాక దానిపై ఆసీనుడై ఉండటమే సందర్భార్థం.
theological_decisions:
- issue: ‘దానిపై ఆసీనుడై ఉన్నవాడు’ అనే మాట ఎవరిని సూచిస్తుంది?
  choice: పరలోక సింహాసనంపై ఆసీనుడైన దేవునికి గౌరవసూచక పరోక్ష ప్రస్తావనగా ఉంచడం
  alternative: పేరును నిర్దిష్టం చేయకుండా ‘అక్కడ కూర్చున్నవాడు’ అని అనువదించడం
  rationale: ‘దేవుని సింహాసనం’ అనే సమీప పదబంధం సూచిత వ్యక్తిని స్పష్టం చేస్తుంది. అయినా మూలంలోని పరోక్ష ప్రస్తావనను ‘దేవుడు’ అని నేరుగా మార్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అర్థమయ్యేలా ‘ఒట్టు పెట్టుకోవడం’ వాడబడింది. సింహాసన సందర్భంలోని గంభీరతను నిలుపేందుకు ‘ఆసీనుడై ఉన్నవాడు’ ఎంపిక చేయబడింది; పాదసూచికలో సాధారణ ప్రత్యామ్నాయం ఇవ్వబడింది.
