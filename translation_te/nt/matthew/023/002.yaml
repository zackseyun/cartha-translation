base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/002.yaml
  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: te
  text: 'ఇలా అన్నాడు[a]: “శాస్త్రులు, పరిసయ్యులు మోషే పీఠంపై కూర్చున్నారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “కూర్చున్నారు” అనే గ్రీకు క్రియను “ఆసీనులయ్యారు” లేదా, అధికార స్థానాన్ని స్వీకరించారనే భావంలో, “తామే కూర్చున్నారు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: ఇలా అన్నాడు
  rationale: వర్తమాన కృదంతం మునుపటి వాక్యంతో అనుసంధానమై యేసు మాటలను పరిచయం చేస్తుంది. తెలుగులో సహజమైన వాక్యప్రవాహం కోసం పరిమిత క్రియగా అనువదించబడింది.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: మోషే పీఠంపై
  rationale: ఇది మోషేతో అనుసంధానమైన బోధనా అధికార స్థానాన్ని సూచించే రూపకం. ‘పీఠం’ అధికార స్థాన భావాన్ని సహజంగా తెలియజేస్తుంది; ἐπί యొక్క స్థానార్థాన్ని ‘పై’ నిలుపుతుంది.
- source_word: ἐκάθισαν
  choice: కూర్చున్నారు
  rationale: ఆరిస్ట్ రూపం సందర్భంలో ఒక స్థానాన్ని ఆక్రమించి ఉండడాన్ని సూచించవచ్చు. తెలుగు రూపం భౌతికంగా కూర్చోవడం మరియు అధికార స్థానంలో ఉండడం అనే రెండింటికీ అవకాశం ఉంచుతుంది; మూలంలో స్పష్టంగా లేని ‘తామే’ అనే ప్రతిబింబ భావాన్ని చేర్చదు.
- source_word: οἱ γραμματεῖς
  choice: శాస్త్రులు
  rationale: ధర్మశాస్త్ర ప్రతుల తయారీతో పాటు దాని అధ్యయనం, బోధనలో నిపుణులైన గుర్తింపు పొందిన వర్గానికి తెలుగు బైబిలు వాడుకలో స్థిరమైన పదం.
- source_word: οἱ Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూద మతవర్గానికి ఆధునిక తెలుగు బైబిలు వాడుకలో స్థిరపడిన లిప్యంతరీకరణ.
theological_decisions:
- issue: ἐκάθισαν అధికార స్థానంలో సాధారణంగా ఉండడాన్నా, ఆ స్థానాన్ని తామే స్వీకరించడాన్నా సూచిస్తుందా?
  choice: కూర్చున్నారు
  alternative: తామే కూర్చున్నారు / ఆసీనులయ్యారు
  rationale: గ్రీకు క్రియ ఇక్కడ ‘కూర్చున్నారు’ లేదా ‘స్థానం ఆక్రమించారు’ అనే భావాలను అనుమతిస్తుంది; అయితే ప్రతిబింబ సర్వనామం లేదు. ప్రధాన పాఠం తటస్థ రూపాన్ని ఉంచి, అధికార స్థానాన్ని తామే స్వీకరించారనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మోషే పీఠం’ అనే రూపకం వివరణతో భర్తీ చేయకుండా నిలుపబడింది; వాక్యంలోని అధికార సంబంధమైన సందిగ్ధతను పాదటిప్పణి సంరక్షిస్తుంది.
