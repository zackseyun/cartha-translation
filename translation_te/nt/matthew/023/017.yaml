source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: te
  text: “మూర్ఖులారా, అంధులారా! ఎందుకంటే ఏది గొప్పది—బంగారమా, లేక బంగారాన్ని పవిత్రపరచిన[a] దేవాలయమా[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బంగారాన్ని పవిత్రమైనదిగా చేసిన.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడున్న గ్రీకు పదం దేవాలయ సముదాయమంతటిని కాక, మరింత నిర్దిష్టంగా ఆలయ పరిశుద్ధస్థలాన్ని సూచించగలదు.
    reason: cultural_note
lexical_decisions:
- source_word: μωροὶ
  choice: మూర్ఖులారా
  rationale: సంబోధన బహువచనంలోని గద్దింపును బలంగా, సహజంగా తెలియజేస్తుంది; అనవసరమైన వాడుకభాషా దూషణను చేర్చదు.
- source_word: τυφλοί
  choice: అంధులారా
  rationale: సంబోధన బహువచనాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో నిలుపుతుంది; సందర్భంలోని ఆత్మీయ వివేచనలేమి అనే రూపకార్థాన్ని పరిష్కరించి చెప్పకుండా ఉంచుతుంది.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: ఎందుకంటే ఏది గొప్పది
  rationale: రెండు నిర్దిష్ట ప్రత్యామ్నాయాల మధ్య ప్రశ్నను ‘ఏది’ సహజంగా వ్యక్తపరుస్తుంది; γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’ నిలుపుతుంది.
- source_word: ὁ χρυσὸς
  choice: బంగారం
  rationale: ప్రమాణానికి సంబంధించిన సందర్భంలో చర్చలో ఉన్న నిర్దిష్ట బంగారాన్ని సూచిస్తుంది; తెలుగులో అనవసరమైన నిర్దేశక పదం లేకుండానే ఆ భావం సహజంగా వస్తుంది.
- source_word: ὁ ναὸς
  choice: దేవాలయం
  rationale: సాధారణ పాఠకులకు స్పష్టమైన పదం; ναός యొక్క మరింత నిర్దిష్టమైన ‘ఆలయ పరిశుద్ధస్థలం’ భావాన్ని పాదసూచికలో తెలియజేస్తుంది.
- source_word: ὁ ἁγιάσας
  choice: పవిత్రపరచిన
  rationale: క్రియ యొక్క ఆరిస్ట్ రూపాన్ని, ఆలయం బంగారానికి పవిత్ర హోదా ఇచ్చే ఆరాధనా భావాన్ని నిలుపుతుంది; సాధారణ సత్యంగా వర్తమాన కాలంలో మార్చి వ్యాఖ్యానించదు.
- source_word: τὸν χρυσόν
  choice: బంగారాన్ని
  rationale: గ్రీకులోని స్పష్టమైన కర్మను పునరుక్తి చేసి వాక్యంలోని అలంకార సమాంతరతను నిలుపుతుంది.
theological_decisions:
- issue: ఆలయ సందర్భంలో ἁγιάζω పదానికి అనువాదం
  choice: పవిత్రపరచిన
  alternative: పవిత్రమైనదిగా చేసిన
  rationale: ఆలయంతో సంబంధం వల్ల బంగారానికి కలిగే పవిత్ర హోదాను ఆరాధనా ధ్వనితో వ్యక్తపరుస్తుంది; ఆ ప్రక్రియను సిద్ధాంతపరంగా మరింత వివరించదు.
- issue: ఆరిస్ట్ కృదంతం ὁ ἁγιάσας యొక్క కాలభావం
  choice: గతకాల రూపమైన ‘పవిత్రపరచిన’
  alternative: సాధారణ సత్యాన్ని సూచించే ‘పవిత్రపరచే’
  rationale: మూలంలోని ఆరిస్ట్ రూపాన్ని ప్రత్యక్షంగా నిలుపుతూ, సందర్భంలో సాధారణ సత్యార్థం ఉండగల అవకాశాన్ని తిరస్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గంభీరమైన సంబోధనను వాడాం. ప్రశ్నలోని గద్దింపు, వివరణాత్మక γάρ, పవిత్రతకు సంబంధించిన ఆరాధనా పదజాలం నిలుపబడ్డాయి. పాదసూచిక గుర్తులు రెండూ ప్రధాన పాఠ్యంలో సంబంధిత పదాల వెంట ఉన్నాయి.
