id: MAT.23.23
reference: Matthew 23:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: te
  text: “శాస్త్రులారా, పరిసయ్యులారా, కపటులారా, మీకు అయ్యో! మీరు పుదీనా, సోపు, జీలకర్రలలో పదవ వంతు ఇస్తున్నారు; కానీ ధర్మశాస్త్రంలోని మరింత ముఖ్యమైన విషయాలైన న్యాయాన్ని, కనికరాన్ని, విశ్వాసాన్ని[a] నిర్లక్ష్యం చేశారు. వీటిని చేయవలసింది; వాటినీ నిర్లక్ష్యం చేయకూడదు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వసనీయతను.” గ్రీకు పదానికి విశ్వాసం, నమ్మకం, లేదా విశ్వసనీయత అనే అర్థాలు ఉండవచ్చు; ఈ నైతిక సందర్భంలో చాలామంది దీనిని నిబంధన పట్ల విశ్వసనీయతగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: మీకు అయ్యో
  rationale: ప్రవక్తల తీర్పు ప్రకటనలోని ఖండనాత్మక తీవ్రతను నిలుపుతూ, సహజమైన తెలుగు ప్రయోగాన్ని ఉపయోగించాం.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: సువార్తల సందర్భంలో యూదుల ధర్మశాస్త్ర నిపుణులను సూచించే స్థిరమైన, సంక్షిప్త తెలుగు పదం.
- source_word: ὑποκριταί
  choice: వేషధారులు
  rationale: బాహ్యంగా ఒక విధంగా కనిపిస్తూ వాస్తవానికి మరో విధంగా ఉండే నైతిక కపటత్వాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀποδεκατοῦτε
  choice: పదవ వంతు ఇస్తున్నారు
  rationale: దశమభాగం చెల్లించడమనే నిర్దిష్ట అర్థాన్ని సాధారణ పాఠకులకు నేరుగా తెలియజేస్తుంది.
- source_word: ἡδύοσμον
  choice: పుదీనా
  rationale: ఈ మూలికకు ఆధునిక ప్రామాణిక తెలుగులో సాధారణంగా అర్థమయ్యే పేరు.
- source_word: ἄνηθον
  choice: సోపు
  rationale: డిల్ అనే సుగంధ మూలికకు తెలుగులో వాడుకలో ఉన్న పేరు.
- source_word: κύμινον
  choice: జీలకర్ర
  rationale: క్యూమిన్‌కు సహజమైన ప్రామాణిక తెలుగు పేరు.
- source_word: ἀφήκατε
  choice: నిర్లక్ష్యం చేశారు
  rationale: ఇక్కడ ఉద్దేశించిన ‘పక్కన పెట్టారు/చేయకుండా వదిలేశారు’ అనే నైతిక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: ధర్మశాస్త్రంలోని మరింత ప్రాముఖ్యమైనవి
  rationale: ‘బరువైనవి’ అనే రూపకాన్ని అక్షరార్థంగా అసహజంగా మార్చకుండా, తులనాత్మక ప్రాధాన్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: κρίσιν
  choice: న్యాయం
  rationale: ఈ నైతిక త్రయంలో తీర్పు చెప్పే చర్యకన్నా న్యాయంగా ప్రవర్తించాలనే ధర్మశాస్త్ర ఆదేశాన్ని సూచిస్తుంది.
- source_word: ἔλεος
  choice: కనికరం
  rationale: ఇతరుల పట్ల దయతో, కరుణతో వ్యవహరించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πίστιν
  choice: విశ్వాసం
  rationale: పదంలోని విశ్వాసం/నమ్మకం భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ఈ నైతిక సందర్భంలో సాధ్యమైన ‘నమ్మకత్వం’ భావాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- source_word: ταῦτα ... κἀκεῖνα
  choice: వీటిని ... వాటినీ
  rationale: ముందుగా చెప్పిన న్యాయం, కనికరం, విశ్వాసం చేయవలసినవని, దశమభాగం ఇవ్వడాన్ని కూడా విడిచిపెట్టకూడదని ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: నైతిక త్రయంలో πίστιν పదం అర్థం
  choice: విశ్వాసం
  alternative: నమ్మకత్వం
  rationale: πίστις విశ్వాసం, నమ్మకం, నమ్మకత్వం అనే భావాలను కలిగి ఉండగలదు. ప్రధాన పాఠ్యంలో విస్తృతమైన ‘విశ్వాసం’ ఉంచి, ఈ నైతిక సందర్భంలో సాధ్యమైన నిబద్ధత/నమ్మకత్వ భావాన్ని పాదసూచికలో తెలిపాం.
- issue: దశమభాగం ఇవ్వడం మరియు ధర్మశాస్త్రంలోని ముఖ్య విషయాల మధ్య సంబంధం
  choice: ముఖ్యమైన వాటిని చేయాలి; దశమభాగం ఇవ్వడాన్నీ నిర్లక్ష్యం చేయకూడదు
  alternative: దశమభాగ ఆచారాన్ని పూర్తిగా తిరస్కరించినట్లు అనువదించడం
  rationale: గ్రీకు వాక్యం రెండింటినీ చేయవలసినవిగా పేర్కొంటుంది; అయితే న్యాయం, కనికరం, విశ్వాసానికి అధిక ప్రాముఖ్యత ఇస్తుంది. ఈ ఉద్రిక్తతను పరిష్కరించకుండా అలాగే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రత్యక్ష ఖండన శైలిని ఉపయోగించాం. మూలంలోని వరుస సంబోధనను, నైతిక త్రయాన్ని, ‘వీటిని... వాటినీ’ అనే వ్యత్యాసాన్ని నిలిపాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత ‘విశ్వాసం’ పదానికే జోడించబడింది.
