revisions:
- from: “శాస్త్రులారా, పరిసయ్యులారా, వేషధారులారా, మీకు అయ్యో! మీరు పుదీనా, సోపు, జీలకర్రలలో పదవ వంతు ఇస్తున్నారు; కానీ ధర్మశాస్త్రంలోని మరింత ప్రాముఖ్యమైన వాటిని—న్యాయాన్ని, కనికరాన్ని, విశ్వాసాన్ని[a]—నిర్లక్ష్యం చేశారు. వీటిని మీరు చేయవలసింది; వాటినీ నిర్లక్ష్యం చేయకూడదు.”
  to: “శాస్త్రులారా, పరిసయ్యులారా, కపటులారా, మీకు అయ్యో! మీరు పుదీనా, సోపు, జీలకర్రలలో పదవ వంతు ఇస్తున్నారు; కానీ ధర్మశాస్త్రంలోని మరింత ముఖ్యమైన విషయాలైన న్యాయాన్ని, కనికరాన్ని, విశ్వాసాన్ని[a] నిర్లక్ష్యం చేశారు. వీటిని చేయవలసింది; వాటినీ నిర్లక్ష్యం చేయకూడదు.”
  rationale: The revision makes only safe lexical and stylistic improvements. It retains “విశ్వాసం” for πίστις in the main text, as documented in the English audit trail, and retains the alternative ethical reading in a properly anchored footnote. The final “వీటిని ... వాటినీ” continues to reflect ταῦτα ... κἀκεῖνα, with the immediately preceding weightier matters contrasted with the tithing practice.
