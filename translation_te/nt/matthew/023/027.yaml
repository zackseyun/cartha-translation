id: MAT.23.27
reference: Matthew 23:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: te
  text: మీకు అయ్యో, ధర్మశాస్త్ర పండితులారా, పరిసయ్యులారా, కపటులారా! ఎందుకంటే మీరు సున్నంతో తెల్లగా పూసిన సమాధుల వలె ఉన్నారు[a]; అవి బయటికి అందంగా కనిపిస్తాయి, కాని లోపల చనిపోయినవారి ఎముకలతోను సమస్త అపవిత్రతతోను[b] నిండి ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సున్నం పూసిన సమాధులు.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘అపవిత్రత’ అనే పదం ఆచారపరమైన అపవిత్రతను, నైతిక కలుషితత్వాన్ని—రెండింటినీ సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: మీకు అయ్యో
  rationale: ప్రవక్తల తీర్పు ప్రకటనలోని ఖండనాత్మక బలాన్ని నిలుపుతూ, తెలుగులో సహజమైన హెచ్చరికను వ్యక్తం చేస్తుంది.
- source_word: γραμματεῖς
  choice: ధర్మశాస్త్ర పండితులు
  rationale: యూదుల ధర్మశాస్త్రాన్ని అధ్యయనం చేసి బోధించే వర్గాన్ని ఆధునిక తెలుగు పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘లేఖకులు’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూద మతవర్గానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: ὑποκριταί
  choice: వేషధారులు
  rationale: బయటి మతప్రదర్శనకూ లోపలి వాస్తవానికీ ఉన్న విరుద్ధతను సందర్భానుకూలంగా తెలియజేస్తుంది.
- source_word: παρομοιάζετε
  choice: సమాధుల్లా ఉన్నారు
  rationale: పోలికను నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τάφοις κεκονιαμένοις
  choice: సున్నం పూసిన సమాధులు
  rationale: సమాధులపై సున్నం పూసే నిర్దిష్ట సాంస్కృతిక దృశ్యాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: బయటికి ... కాని లోపల
  rationale: బాహ్య రూపానికీ అంతర్గత వాస్తవానికీ మధ్య ఉన్న బలమైన వ్యత్యాసాన్ని సహజంగా అందిస్తుంది.
- source_word: φαίνονται ὡραῖοι
  choice: అందంగా కనిపిస్తాయి
  rationale: నిజ స్వభావం కాకుండా కంటికి కనిపించే రూపంపైనే గ్రీకు వాక్యం పెట్టిన ఉద్ఘాటనను నిలుపుతుంది.
- source_word: γέμουσιν
  choice: నిండి ఉంటాయి
  rationale: వర్తమాన స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὀστέων νεκρῶν
  choice: చనిపోయినవారి ఎముకలు
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని స్పష్టంగా, సాధారణ తెలుగు వాడుకలో అందిస్తుంది.
- source_word: πάσης ἀκαθαρσίας
  choice: సమస్త అపవిత్రత
  rationale: ఆచారపరమైన అపవిత్రత, నైతిక కలుషితత్వం—రెండింటికీ అవకాశం ఉంచే విస్తృత పదప్రయోగం.
theological_decisions:
- issue: ἀκαθαρσία అనే పదంలో ఆచారపరమైన అపవిత్రత మరియు నైతిక కలుషితత్వం మధ్య సంబంధం
  choice: ‘అపవిత్రత’ అని విస్తృతంగా అనువదించడం
  alternative: ‘ఆచారపరమైన అపవిత్రత’ లేదా ‘నైతిక కలుషితత్వం’ అని ఒక్క అర్థానికే పరిమితం చేయడం
  rationale: సమాధుల దృశ్యం యూదుల ఆచారపరమైన అపవిత్రతను గుర్తుచేస్తుంది; అదే సమయంలో యేసు ఖండన అంతర్గత నైతిక చెడును కూడా సూచిస్తుంది. విస్తృత పదం ఈ ఉద్దేశపూర్వక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా అయినా గంభీరత కోల్పోకుండా రూపొందించబడింది. సంబోధనల పునరుక్తి మూలంలోని ప్రవక్తీయ ఖండన బలాన్ని నిలుపుతుంది. పాదసూచిక గుర్తులను అవి వివరించే పదబంధాల వెంట ఉంచాం.
