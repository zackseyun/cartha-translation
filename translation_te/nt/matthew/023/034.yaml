- from: అందువల్ల, ఇదిగో, నేను మీ దగ్గరికి ప్రవక్తలను, జ్ఞానులను, ధర్మశాస్త్ర పండితులను పంపుతున్నాను. వారిలో కొందరిని మీరు చంపి సిలువ వేస్తారు; మరికొందరిని మీ సమాజమందిరాల్లో కొరడాలతో కొట్టి, ఒక పట్టణం నుండి మరొక పట్టణానికి తరుముతారు.
  to: అందువల్ల, ఇదిగో, నేను మీ దగ్గరికి ప్రవక్తలను, జ్ఞానులను, ధర్మశాస్త్ర పండితులను పంపుతున్నాను. వారిలో కొందరిని మీరు చంపుతారు, సిలువ వేస్తారు; మరికొందరిని మీ సమాజమందిరాల్లో కొరడాలతో కొడతారు, ఒక పట్టణం నుండి మరొక పట్టణానికి తరుముతారు.
  rationale: The revision retains the draft’s accurate vocabulary and modern-standard register, while replacing Telugu sequential participial constructions with coordinated finite verbs. This more closely reflects the Greek coordination and avoids specifying that each action pair necessarily happens to the same people in sequence.
  reviewer_model: gpt-5.6-terra
