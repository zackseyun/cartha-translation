id: MAT.23.34
reference: Matthew 23:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: te
  text: అందువల్ల, ఇదిగో, నేను మీ దగ్గరికి ప్రవక్తలను, జ్ఞానులను, ధర్మశాస్త్ర పండితులను పంపుతున్నాను. వారిలో కొందరిని మీరు చంపుతారు, సిలువ వేస్తారు; మరికొందరిని మీ సమాజమందిరాల్లో కొరడాలతో కొడతారు, ఒక పట్టణం నుండి మరొక పట్టణానికి తరుముతారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందువల్ల
  rationale: ముందున్న సందర్భం నుండి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: యేసు తరువాత చెప్పబోయే మాటపై శ్రద్ధ నిలిపే సూచనను నిలుపుతుంది.
- source_word: ἀποστέλλω πρὸς ὑμᾶς
  choice: నేను మీ దగ్గరికి ... పంపుతున్నాను
  rationale: వర్తమానకాల భావాన్ని, గ్రహీతల వైపు పంపడాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: γραμματεῖς
  choice: ధర్మశాస్త్ర పండితులు
  rationale: ఈ సందర్భంలో యూదుల ధర్మశాస్త్రంలో శిక్షణ పొందిన బోధకులు/పండితులను సూచిస్తుంది; కేవలం ‘లేఖకులు’ అనే అపార్థాన్ని నివారిస్తుంది.
- source_word: μαστιγώσετε
  choice: కొరడాలతో కొట్టి
  rationale: శారీరక శిక్ష అనే నిర్దిష్ట భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: συναγωγαῖς
  choice: సమాజమందిరాల్లో
  rationale: యూదుల ఆరాధనా-సమాజ సమావేశ స్థలాన్ని తెలుగులో స్థిరంగా, అర్థవంతంగా సూచిస్తుంది.
- source_word: διώξετε ἀπὸ πόλεως εἰς πόλιν
  choice: ఒక పట్టణం నుండి మరొక పట్టణానికి తరుముతారు
  rationale: నిరంతర హింసతో చోటుచోటుకు వెంటాడే భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘నేను పంపుతున్నాను’ అని యేసు స్వయంగా పలకడం
  choice: ప్రథమ పురుష కర్తృత్వాన్ని యథాతథంగా నిలుపడం
  alternative: దేవుడు పంపుతున్నాడని వివరణాత్మకంగా మార్చడం
  rationale: గ్రీకు పాఠంలో ἐγὼ ἀποστέλλω స్పష్టంగా ‘నేను పంపుతున్నాను’ అని ఉంది; దాని క్రీస్తుశాస్త్రీయ ఉద్వేగాన్ని అనువాదం పరిష్కరించకూడదు.
- issue: చంపడం మరియు సిలువ వేయడం మధ్య సంబంధం
  choice: ‘కొందరిని మీరు చంపి సిలువ వేస్తారు’
  alternative: ‘కొందరిని చంపుతారు, మరికొందరిని సిలువ వేస్తారు’
  rationale: ఒకే ἐξ αὐτῶν తరువాత రెండు క్రియలు వస్తాయి; పాఠం వాటిని వేర్వేరు గుంపులకు స్పష్టంగా పంచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని వరుస చర్యలు మరియు వాక్య తీవ్రత నిలుపబడ్డాయి.
