id: MAT.23.4
reference: Matthew 23:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: te
  text: వారు బరువైన భారాలను కట్టి ప్రజల భుజాల మీద పెడతారు; కానీ వాటిని తమ వేలితోనైనా కదపడానికి వారే ఇష్టపడరు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: కట్టి
  rationale: భారాలను మోపడానికి సిద్ధం చేస్తూ కట్టే దృశ్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: φορτία βαρέα
  choice: బరువైన భారాలను
  rationale: అక్షరార్థ దృశ్యాన్నీ, అణచివేసే డిమాండ్ల రూపకాలంకార భావాన్నీ నిలుపుతుంది.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: భుజాల మీద పెడతారు
  rationale: ఒక వస్తువును భుజాలపై ఉంచే స్పష్టమైన శారీరక దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τῶν ἀνθρώπων
  choice: ప్రజల
  rationale: ἄνθρωποι ఇక్కడ మానవులను సాధారణంగా సూచిస్తుంది; తెలుగు వాడుకలో ‘ప్రజల’ అనేది లింగపరంగా అనవసరమైన పరిమితి లేకుండా ఆ ప్రతినిధి భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: αὐτοὶ δὲ
  choice: కానీ ... వారే
  rationale: ఇతరులపై వారు మోపేదానికి, తాము చేయడానికి నిరాకరించేదానికి మధ్య ఉన్న బలమైన వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: తమ వేలితోనైనా
  rationale: గ్రీకులోని ఏకవచన ‘వేలు’ను నిలుపుతూ, అతి స్వల్ప ప్రయత్నం కూడా చేయరనే వాక్యబలాన్ని తెలుగులో ‘అయినా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: వాటిని ... కదపడానికి ... ఇష్టపడరు
  rationale: అసమర్థతను కాక ఉద్దేశపూర్వక నిరాకరణను సూచించే θέλω భావాన్ని, అలాగే κινέω యొక్క ‘కదపడం’ అనే ప్రాథమిక అర్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: భారాలు అక్షరార్థమా, రూపకాలంకారమా
  choice: ‘బరువైన భారాలు’ అనే స్పష్టమైన దృశ్యాన్ని ఉంచి, అవి దేనిని సూచిస్తాయో వచనంలో వివరించలేదు.
  alternative: వాటిని ధర్మశాస్త్ర సంబంధమైన డిమాండ్లు లేదా మత నియమాలు అని స్పష్టంగా అనువదించడం.
  rationale: సందర్భంలో శాస్త్రులు, పరిసయ్యులు మోపే అణచివేసే బాధ్యతలు ఉద్దేశించబడినా, గ్రీకు మూలం వాటిని ప్రత్యేకంగా నిర్వచించదు. రూపకాన్ని యథాతథంగా ఉంచడం అనవసరమైన సిద్ధాంత వివరణను చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం. మూలంలోని భుజాలు, వేలు, కదపడం అనే దృశ్య పదాలను నిలిపి, ‘వారే’ మరియు ‘వేలితోనైనా’ ద్వారా వ్యత్యాసం, కనీస ప్రయత్నానికీ నిరాకరణ సహజంగా వ్యక్తమయ్యాయి.
