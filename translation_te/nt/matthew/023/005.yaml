id: MAT.23.5
reference: Matthew 23:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: te
  text: అయితే, వారు తమ పనులన్నిటినీ ప్రజలు చూడడానికే చేస్తారు. ఎందుకంటే, వారు తమ ధర్మశాస్త్ర వాక్యాల పెట్టెలను[a] వెడల్పుగా చేసి, తమ వస్త్రాల కుచ్చులను[b] పెద్దవిగా చేస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇవి ధర్మశాస్త్రంలోని కొన్ని వాక్యాలు ఉంచిన చిన్న తోలు పెట్టెలు. ద్వితీయోపదేశకాండము 6:8 వంటి వాక్యాలకు విధేయతగా కొందరు యూదులు వీటిని చేతికి కట్టుకొని, నుదుటిపై ధరించేవారు.
    reason: cultural_note
  - marker: b
    text: అంటే, వస్త్రాల అంచులకు కట్టిన దారపు కుచ్చులు. సంఖ్యాకాండము 15:38–39 చూడండి.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔργα
  choice: తమ పనులన్నిటినీ
  rationale: ‘వారి క్రియలన్నిటినీ’ కంటే ఆధునిక తెలుగులో సహజంగా ఉండి, వారి కార్యాల సంపూర్ణతను తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న సందర్భంతో వ్యత్యాసాన్ని సహజంగా సూచిస్తుంది.
- source_word: πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: మనుషులు చూడాలనే
  rationale: ఈ నిర్మాణంలోని ఉద్దేశ భావాన్ని స్పష్టంగా నిలుపుతుంది; ἄνθρωποι సాధారణంగా ప్రజలను సూచిస్తుంది, కేవలం పురుషులను కాదు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: తరువాతి ఉదాహరణలు ముందటి ఆరోపణకు వివరణగా వస్తున్నాయని తెలియజేస్తుంది.
- source_word: φυλακτήρια
  choice: ధర్మశాస్త్ర వాక్యాల పెట్టెలు
  rationale: తెలుగులో అపరిచితమైన లిప్యంతరీకరణకు బదులుగా, లేఖన భాగాలు ఉంచి ధరించే చిన్న పెట్టెలను స్పష్టంగా సూచించే వివరణాత్మక పదబంధం; వివరాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: πλατύνουσι
  choice: వెడల్పుగా ... చేసుకుంటారు
  rationale: వాటిని ఉద్దేశపూర్వకంగా వెడల్పు చేయడమనే భౌతిక భావాన్ని నిలుపుతుంది.
- source_word: κράσπεδα
  choice: వస్త్రాల కుచ్చులు
  rationale: ఈ యూదా ఆచార సందర్భంలో వస్త్రాల అంచులకు కట్టిన వేలాడే దారపు కుచ్చులను సూచిస్తుంది; సాధారణ ‘అంచులు’ కంటే నిర్దిష్టంగా ఉంది.
- source_word: μεγαλύνουσι
  choice: పెద్దవిగా చేసుకుంటారు
  rationale: ‘పెద్దగా చేయడం’ అనే మూల భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; మూలంలో స్పష్టంగా లేని ‘పొడిగిస్తారు’ అనే నిర్దిష్టతను చేర్చదు.
theological_decisions:
- issue: యూదుల మతాచార వస్తువులను విమర్శాత్మక అపార్థం లేకుండా అనువదించడం
  choice: వస్తువులను తటస్థంగా ‘ధర్మశాస్త్ర వాక్యాల పెట్టెలు,’ ‘వస్త్రాల కుచ్చులు’ అని పేర్కొని, వాటి నేపథ్యాన్ని పాదసూచికల్లో వివరించడం.
  alternative: φυλακτήρια ను ‘తాయెత్తులు’ అని, κράσπεδα ను కేవలం ‘అంచులు’ అని అనువదించడం.
  rationale: ఈ వాక్యం ఆ వస్తువులను లేదా ఆజ్ఞాపిత ఆచారాన్ని స్వయంగా తప్పుపట్టడం లేదు; ఇతరులకు కనిపించేందుకు వాటిని అతిశయంగా ప్రదర్శించడాన్ని విమర్శిస్తోంది. ‘తాయెత్తులు’ అనడం అనవసరమైన మూఢనమ్మక భావాన్ని దిగుమతి చేయవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. అపరిచిత గ్రీకు పదాన్ని లిప్యంతరీకరించకుండా వివరణాత్మక పదబంధం ఉపయోగించబడింది; మూలంలోని ఉద్దేశ భావం మరియు బాహ్య ప్రదర్శనపై ఉన్న విమర్శ నిలుపబడ్డాయి.
