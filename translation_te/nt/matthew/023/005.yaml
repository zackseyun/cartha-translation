- from: అయితే, వారు తమ పనులన్నిటినీ మనుషులు చూడాలనే చేస్తారు. ఎందుకంటే, వారు తమ ధర్మశాస్త్ర వాక్యాల పెట్టెలను[a] వెడల్పుగా, తమ వస్త్రాల కుచ్చులను[b] పెద్దవిగా చేసుకుంటారు.
