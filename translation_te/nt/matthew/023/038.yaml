  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν ⸀ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/038.yaml
  text: Look[a], your house is left to you desolate.
translation:
  language: te
  text: ఇదిగో, మీ ఇల్లు[a] మీకు నిర్జనంగా విడిచిపెట్టబడుతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ దేవాలయం’; ‘మీ ఇల్లు’ అనే మాట ప్రత్యేకంగా దేవాలయాన్ని సూచించవచ్చు, అయితే గ్రీకు పదబంధం మరింత విస్తృతంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: గంభీరమైన ప్రకటనవైపు దృష్టిని మళ్లించే సహజమైన తెలుగు సూచన పదం; మూలంలోని ఆహ్వానాత్మక బలాన్ని నిలుపుతుంది.
- source_word: ἀφίεται
  choice: విడిచిపెట్టబడుతోంది
  rationale: వర్తమానకాల కర్మణి రూపాన్ని సాధ్యమైనంత స్పష్టంగా నిలుపుతూ, కార్యసాధకుడు ఎవరో అనువాదంలో అదనంగా నిర్ధారించదు.
- source_word: ὑμῖν
  choice: మీకే
  rationale: గ్రీకు దత్తివిభక్తిలోని ‘మీకు/మీ ఆధీనానికే’ అనే భావాన్ని తెలుగులో సహజంగా, కొంత ఉద్ఘాటనతో తెలియజేస్తుంది.
- source_word: ὁ οἶκος ὑμῶν
  choice: మీ ఇల్లు
  rationale: అక్షరార్థంలోని విస్తృత రూపకాన్ని నిలుపుతుంది; ప్రధాన పాఠ్యంలో దానిని దేవాలయంగా, యెరూషలేముగా లేదా ఇశ్రాయేలు గృహంగా సంకుచితం చేయదు.
- source_word: ἔρημος
  choice: పాడుగా
  rationale: విడిచివేయబడిన, నిర్జనమైన స్థితితో పాటు తీర్పు సందర్భంలోని విధ్వంస ఛాయను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘మీ ఇల్లు’ అనే పదబంధం దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘మీ ఇల్లు’ అని విస్తృతంగానే ఉంచడం.
  alternative: ‘మీ దేవాలయం’, ‘యెరూషలేము’ లేదా ‘ఇశ్రాయేలు గృహం’ అని నిర్దిష్టీకరించడం.
  rationale: సందర్భం దేవాలయాన్ని, యెరూషలేమును బలంగా సూచించినప్పటికీ, గ్రీకు పాఠ్యం ‘ఇల్లు’ అనే విస్తృతమైన రూపకాన్నే వాడుతుంది. దాని ఉద్దేశపూర్వక విస్తృతతను, ప్రవచనాత్మక ఉద్వేగాన్ని అనువాదం ముందుగానే పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచనాత్మక ధోరణి. ‘ఇదిగో’ శ్రద్ధను ఆకర్షిస్తుంది; ‘పాడుగా’ సాధారణ పాఠకులకు అర్థమయ్యేలా నిర్జనత, విడిచివేత, తీర్పు భావాలను కలిపి వ్యక్తం చేస్తుంది.
