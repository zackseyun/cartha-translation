- from: ఇదిగో[a], మీ ఇల్లు మీకే పాడుగా విడిచిపెట్టబడుతోంది.
  to: ఇదిగో, మీ ఇల్లు[a] మీకు నిర్జనంగా విడిచిపెట్టబడుతోంది.
