review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents ἰδοὺ, the present passive ἀφίεται, the dative ὑμῖν, and the deliberately broad expression ὁ οἶκος ὑμῶν. However, the footnote marker is attached to ‘ఇదిగో’ (‘Look’) although its note concerns ‘మీ ఇల్లు’ (‘your house’).
  naturalness: ‘మీ ఇల్లు మీకే పాడుగా విడిచిపెట్టబడుతోంది’ is understandable, but ‘పాడుగా’ is somewhat less idiomatic here. ‘నిర్జనంగా’ naturally conveys the desolate/abandoned state, and ‘మీకు’ avoids adding emphatic force not explicit in the Greek.
  terminology: ‘ఇల్లు’ appropriately preserves the source’s broad metaphor and does not prematurely identify it as the temple. The alternative-reference footnote is suitable and should be anchored to ‘ఇల్లు’.
  issues:
  - severity: medium
    issue: Footnote anchor is attached to ‘ఇదిగో’ rather than ‘మీ ఇల్లు’.
    rationale: The footnote discusses the referent of ‘your house,’ not the attention-getter ἰδοὺ. The anchor should immediately follow the phrase it qualifies.
  - severity: low
    issue: ‘మీకే’ adds emphasis, and ‘పాడుగా’ is less natural in this predicate construction.
    rationale: The Greek dative does not require an exclusive/emphatic ‘-కే’; ‘మీకు’ more neutrally represents it. ‘నిర్జనంగా’ is a clear modern equivalent for ἔρημος in this context.
  revised_text: ఇదిగో, మీ ఇల్లు[a] మీకు నిర్జనంగా విడిచిపెట్టబడుతోంది.
