review_pass:
  verdict: revise
  source_fidelity: The draft preserves the verse’s denunciatory force, the addressed groups, the singular masculine reference, Gehenna, and the comparative ‘twice.’ However, ‘మీ మతంలో చేర్చుకోవడానికి’ is somewhat more interpretive than ποιῆσαι ἕνα προσήλυτον (‘to make one proselyte’), and ‘చుట్టివస్తారు’ can suggest merely going around rather than traversing sea and land.
  naturalness: The Telugu is generally clear and suitably solemn. ‘కపటులారా’ is a more idiomatic and established equivalent for ὑποκριταί in this moral-religious context than ‘వేషధారులారా.’ ‘సముద్రాన్నీ నేలనూ దాటి ప్రయాణిస్తారు’ more naturally expresses the extent of travel.
  terminology: ‘శాస్త్రులు,’ ‘పరిసయ్యులు,’ and ‘గెహెన్నా’ are appropriate historical/theological terms. Retaining ‘ప్రోసెలైట్’ in the main text best preserves the specific source term; its meaning should be explained in the footnote.
  issues:
  - severity: medium
    issue: ‘మీ మతంలో చేర్చుకోవడానికి’ is interpretive.
    rationale: A προσήλυτος is specifically a proselyte/convert, but the wording ‘into your religion’ adds an explanatory formulation to the main text. The technical term can be retained and glossed in a footnote.
  - severity: low
    issue: ‘వేషధారులారా’ is less precise for ὑποκριταί.
    rationale: It can evoke literal costume-wearing. ‘కపటులారా’ naturally conveys the intended religious and moral pretense.
  - severity: low
    issue: ‘సముద్రాన్నీ భూమినీ చుట్టివస్తారు’ is potentially imprecise.
    rationale: The Greek merism depicts extensive travel across sea and land; ‘దాటి ప్రయాణిస్తారు’ communicates this without suggesting circumambulation.
  revised_text: “మీకు అయ్యో, శాస్త్రులారా, పరిసయ్యులారా, కపటులారా! ఒక్క ప్రోసెలైట్‌ను చేయడానికి[a] మీరు సముద్రాన్నీ నేలనూ దాటి ప్రయాణిస్తారు. అతడు అలా అయినప్పుడు, అతణ్ణి మీకంటే రెండింతలు గెహెన్నా పుత్రునిగా[b] చేస్తారు.”
