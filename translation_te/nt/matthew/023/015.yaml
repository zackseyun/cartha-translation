revisions:
- from: “వేషధారులైన శాస్త్రులారా, పరిసయ్యులారా, మీకు అయ్యో! ఒక్కరిని మీ మతంలో చేర్చుకోవడానికి[a] మీరు సముద్రాన్నీ భూమినీ చుట్టివస్తారు. అతడు చేరినప్పుడు, అతణ్ణి మీకంటే రెండింతలు గెహెన్నా పుత్రునిగా[b] చేస్తారు.”
  to: “మీకు అయ్యో, శాస్త్రులారా, పరిసయ్యులారా, కపటులారా! ఒక్క ప్రోసెలైట్‌ను చేయడానికి[a] మీరు సముద్రాన్నీ నేలనూ దాటి ప్రయాణిస్తారు. అతడు అలా అయినప్పుడు, అతణ్ణి మీకంటే రెండింతలు గెహెన్నా పుత్రునిగా[b] చేస్తారు.”
  rationale: The revision more closely follows the Greek wording while retaining modern standard Telugu and the verse’s formal prophetic denunciation. It preserves the historical term ‘గెహెన్నా’ and the Semitic ‘son of’ idiom, with the familiar ‘నరకం’ alternative kept in the footnote.
