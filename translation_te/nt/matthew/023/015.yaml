id: MAT.23.15
reference: Matthew 23:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: te
  text: “మీకు అయ్యో, శాస్త్రులారా, పరిసయ్యులారా, కపటులారా! ఒక్క ప్రోసెలైట్‌ను చేయడానికి[a] మీరు సముద్రాన్నీ నేలనూ దాటి ప్రయాణిస్తారు. అతడు అలా అయినప్పుడు, అతణ్ణి మీకంటే రెండింతలు గెహెన్నా పుత్రునిగా[b] చేస్తారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, యూదు మతంలో చేరిన వ్యక్తిని చేయడానికి; లేదా, “ఒక మతమార్పిడిని చేయడానికి.” గ్రీకులో “ఒక ప్రోసెలైట్‌ను చేయడానికి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నరక పుత్రునిగా.” గ్రీకులో “గెహెన్నా పుత్రునిగా.”
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐαὶ
  choice: మీకు అయ్యో
  rationale: ప్రవక్తల ధోరణిలోని తీవ్ర ఖండనను నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యే విధంగా అనువదించబడింది.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: యూదుల ధర్మశాస్త్రాన్ని అధ్యయనం చేసి బోధించే గుర్తింపు పొందిన వర్గానికి వాడుకలో ఉన్న సంక్షిప్త తెలుగు పదం; మరింత వివరణాత్మకమైన ‘ధర్మశాస్త్ర పండితులు’ కంటే మూలపదానికి సమీపంగా ఉంది.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఈ యూదు మతవర్గానికి తెలుగులో స్థిరపడిన లిప్యంతరీకరణ.
- source_word: ὑποκριταί
  choice: వేషధారులు
  rationale: నైతిక-మతపరమైన నటన లేదా కపట ప్రదర్శన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηράν
  choice: సముద్రాన్నీ భూమినీ చుట్టివస్తారు
  rationale: విస్తారంగా ప్రయాణించి చేసే తీవ్ర ప్రయత్నాన్ని తెలియజేస్తూ, సముద్రం-భూమి అనే మూలంలోని సమగ్ర జంటను నిలుపుతుంది.
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: ఒక్కరిని మీ మతంలో చేర్చుకోవడానికి
  rationale: ప్రσήλυτος అనే యూదు మతంలో చేరిన వ్యక్తి భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది; సాంకేతిక ప్రత్యామ్నాయం పాదటీపులో ఇవ్వబడింది.
- source_word: ὅταν γένηται
  choice: అతడు చేరినప్పుడు
  rationale: మతంలో చేరడమే సందర్భంలోని సూచిత భావమని స్పష్టం చేస్తూ, గ్రీకులోని ఏకవచన పుంలింగ సూచనను నిలుపుతుంది.
- source_word: υἱὸν γεέννης
  choice: గెహెన్నా పుత్రునిగా
  rationale: γεέννα అనే చారిత్రక-అంత్యకాల సంబంధ పదాన్నీ, ‘పుత్రుడు’ అనే సెమిటిక్ సంబంధసూచక నుడికారాన్నీ రెండింటినీ సంరక్షిస్తుంది.
- source_word: διπλότερον ὑμῶν
  choice: మీకంటే రెండింతలు
  rationale: మూలంలోని తులనాత్మక భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: γεέννα పదం అనువాదం
  choice: గెహెన్నా
  alternative: నరకం
  rationale: గ్రీకు మూలంలో నిర్దిష్టమైన యూదు చారిత్రక, అంత్యకాల నేపథ్యం గల γεέννα ఉంది. దాన్ని సాధారణీకరించి ‘నరకం’గా మార్చకుండా ప్రధాన పాఠ్యంలో నిలిపి, పరిచితమైన ప్రత్యామ్నాయాన్ని పాదటీపులో ఇచ్చాం.
- issue: υἱὸν γεέννης అనే సెమిటిక్ నుడికారం
  choice: గెహెన్నా పుత్రుడు
  alternative: గెహెన్నాకు పాత్రుడు
  rationale: ‘పుత్రుడు’ అనే మూల రూపకం ఒక వ్యక్తి గెహెన్నాకు చెందినవాడని లేదా దానికి పాత్రుడని సూచిస్తుంది. దాని తీవ్రతను, ఉద్దేశపూర్వక రూపకాన్ని వ్యాఖ్యానాత్మకంగా కుదించకుండా నిలిపాం.
- issue: ప్రσήλυτον తరువాతి పుంలింగ ఏకవచన సూచన
  choice: అతడు … అతణ్ణి
  alternative: ఆ వ్యక్తి … ఆ వ్యక్తిని
  rationale: గ్రీకులోని పుంలింగ ఏకవచన రూపాన్ని సహజమైన తెలుగులో ప్రతిబింబించాం; మూలంలో లేని లింగతటస్థీకరణ చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రత్యక్ష ఖండన ధోరణి పాటించబడింది. ‘శాస్త్రులు,’ ‘పరిసయ్యులు,’ ‘గెహెన్నా’ వంటి చారిత్రక పదాలు నిలుపబడ్డాయి; అరుదైన ‘ప్రోసెలైట్’ ప్రధాన పాఠ్యానికి బదులు పాదటీపులో వివరించబడింది.
