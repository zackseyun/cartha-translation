base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: te
  text: గుడ్డి మార్గదర్శకులారా! దోమను వడగట్టి తీసివేస్తూ[a], కానీ ఒంటెను మింగేస్తున్నారు!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దోమను వడపోసి తొలగిస్తూ.” గ్రీకు క్రియ ద్రవాన్ని వడగట్టి అందులోని కల్మషాన్ని తొలగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδηγοὶ
  choice: మార్గదర్శకులు
  rationale: ఇతరులకు దారి చూపే లేదా వారిని నడిపించే వ్యక్తులను సూచిస్తుంది; రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τυφλοί
  choice: గుడ్డి
  rationale: ఆధ్యాత్మికంగా గ్రహించలేని స్థితిని సూచించే పదునైన రూపక మందలింపును నేరుగా నిలుపుతుంది.
- source_word: διϋλίζοντες
  choice: వడగట్టి తీసివేస్తూ
  rationale: ద్రవంలోని కల్మషాన్ని వడపోసి తొలగించే క్రియను స్పష్టంగా తెలియజేస్తుంది; దోమను జాగ్రత్తగా తొలగించే దృశ్యాన్ని కాపాడుతుంది.
- source_word: τὸν κώνωπα
  choice: దోమను
  rationale: κώνωψ సూచించే అతి చిన్న దోమవంటి పురుగుకు సాధారణ పాఠకులకు వెంటనే అర్థమయ్యే సహజ తెలుగు పదం.
- source_word: τὴν δὲ κάμηλον
  choice: కానీ ఒంటెను
  rationale: δέ లోని వ్యత్యాసాన్ని ‘కానీ’ స్పష్టంగా వ్యక్తం చేసి, అతి చిన్న దోమకూ అతి పెద్ద ఒంటెకూ మధ్యనున్న ఉద్దేశపూర్వక అతిశయోక్తిని నిలుపుతుంది.
- source_word: καταπίνοντες
  choice: మింగేస్తున్నారు
  rationale: పూర్తిగా మింగివేయడాన్ని సజీవంగా వ్యక్తం చేస్తూ, మూలంలోని అసంభవమైన అతిశయోక్తి బలాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ఆచారపరమైన అపవిత్రత చిత్రంలోని రూపక బలం
  choice: దోమను వడగట్టి తొలగించి, ఒంటెను మింగే స్పష్టమైన చిత్రాన్ని యథాతథంగా నిలుపడం
  alternative: చిన్న తప్పులను పట్టించుకుని పెద్ద తప్పులను విస్మరిస్తారని వివరణాత్మకంగా అనువదించడం
  rationale: చిన్న అపవిత్రతను అత్యంత జాగ్రత్తగా నివారిస్తూ, అపారమైన అపవిత్రతను అంగీకరించే అసంబద్ధతలోనే మందలింపు బలం ఉంది. చిత్రాన్ని నిలపడం మూలానికి నమ్మకంగా ఉండి, దాని భావాన్ని ఒక నిర్దిష్ట వ్యాఖ్యానానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో నేరుగా సంబోధించే, పదునైన మందలింపు శైలిని ఉపయోగించాం. ‘మార్గదర్శకులారా’ గౌరవార్థకం కాదు; బహువచన సంబోధనను సహజంగా వ్యక్తం చేస్తుంది. దోమ–ఒంటె వ్యత్యాసంలోని హాస్యాత్మక అతిశయోక్తిని నిలిపాం.
