id: MAT.23.8
reference: Matthew 23:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: te
  text: అయితే మీరు ‘రబ్బీ’ అని పిలువబడవద్దు[a]. ఎందుకంటే మీ బోధకుడు ఒక్కడే; మీరంతా సహోదరులు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రబ్బీ’ అంటే ‘బోధకుడు’ అని అర్థం. ఈ లిప్యంతరీకరణ యూదు నేపథ్యాన్ని కాపాడటంతో పాటు, వాక్యంలో తరువాత వచ్చే ‘బోధకుడు’ అనే పదంతో దీనిని కలిపివేయకుండా ఉంచుతుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘సహోదరులు’ అని అనువదించిన గ్రీకు పదం పుంలింగ బహువచనంలో ఉంది. ఈ సందర్భంలో అది సహశిష్యులందరినీ సమష్టిగా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: పిలిపించుకోవద్దు
  rationale: గ్రీకు నిషేధార్థక కర్మణి రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. బిరుదును స్వీకరించవద్దనే భావం స్పష్టమవుతుంది; అయితే వాక్య పరిధిని మించి సిద్ధాంతపరంగా విస్తరించదు.
- source_word: Ῥαββί
  choice: రబ్బీ
  rationale: గ్రీకు పాఠంలోనే లిప్యంతరీకరించబడిన యూదు బిరుదును అలాగే ఉంచడం చారిత్రక నేపథ్యాన్ని కాపాడుతుంది; దానిని తరువాత వచ్చే διδάσκαλος‌తో ఒకే పదంగా కలిపివేయదు.
- source_word: εἷς
  choice: ఒక్కడే
  rationale: ఏకత్వంపై ఉన్న గ్రీకు ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది. ‘ఒక్కడే’ సందర్భంలో ఉన్న ప్రత్యేకత్వాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ διδάσκαλος
  choice: మీకు బోధకుడు
  rationale: ὑμῶν‌తో ఉన్న సంబంధ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. ‘బోధకుడు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, రబ్బీ అనే చారిత్రక బిరుదుతో పదభేదాన్ని నిలుపుతుంది.
- source_word: πάντες δὲ ὑμεῖς
  choice: మీరంతా
  rationale: శిష్యులందరినీ ఉద్దేశించిన సమష్టి ఉద్ఘాటనను సంక్షిప్తంగా, సహజంగా కాపాడుతుంది.
- source_word: ἀδελφοί
  choice: సహోదరులు
  rationale: పుంలింగ బహువచన రూపాన్నీ కుటుంబ సంబంధ రూపకాన్నీ కాపాడుతుంది. సందర్భంలో ఇది సహశిష్యుల సమూహాన్ని సూచించగలదని పాదటిప్పణిలో తెలియజేస్తుంది.
theological_decisions:
- issue: మానవ గౌరవ బిరుదులన్నిటి వాడకాన్ని యేసు సంపూర్ణంగా నిషేధిస్తున్నాడా, లేక శిష్య సమాజంలోని హోదా ఆకాంక్షను ఉద్దేశిస్తున్నాడా?
  choice: వచనంలోని ప్రత్యక్ష నిషేధాన్ని యథాతథంగా ఉంచి, దాని అన్వయాన్ని విస్తరించలేదు లేదా కుదించలేదు.
  alternative: ‘రబ్బీ’తో పాటు సమానమైన బిరుదులన్నిటినీ ఎల్లప్పుడూ వాడకూడదనే సంపూర్ణ నిషేధంగా భావించడం; లేదా కపటమైన హోదా ఆకాంక్షను మాత్రమే ఖండించినట్లు పరిమితం చేయడం.
  rationale: గ్రీకు పాఠం స్పష్టమైన నిషేధాన్నీ దానికి కారణాన్నీ ఇస్తుంది; కానీ తరువాతి అన్ని అన్వయాలను నిర్దేశించదు. అందువల్ల అనువాదం ఆ సిద్ధాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ‘రబ్బీ’ ద్వారా యూదు చారిత్రక నేపథ్యాన్ని, ‘సహోదరులు’ ద్వారా కుటుంబ రూపకాన్ని నిలుపుకుంది.
