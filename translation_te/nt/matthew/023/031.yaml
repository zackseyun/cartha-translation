- from: కాబట్టి, ప్రవక్తలను హత్య చేసినవారి కుమారులే మీరు అని మీకు మీరే సాక్ష్యమిస్తున్నారు.[a]
  to: కాబట్టి, మీరు ప్రవక్తలను హత్య చేసినవారి కుమారులని మీకు వ్యతిరేకంగా మీరే సాక్ష్యమిస్తున్నారు.[a]
  rationale: 'The revision follows the contextual force adopted in the English POB audit trail: the dative reflexive expression is rendered as self-incriminating testimony in the main text. The footnote preserves the more literal Telugu equivalent and explains its contextual sense. The revised word order is idiomatic and maintains the Greek’s familial and judicial imagery without doctrinal expansion.'
