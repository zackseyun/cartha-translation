review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the inference (ὥστε), the content clause, ‘sons,’ and the identification of the ancestors as those who murdered the prophets. However, the main-text wording ‘మీకు మీరే సాక్ష్యమిస్తున్నారు’ is overly literal and can sound as though they testify merely to themselves, rather than that their testimony implicates them. In this rebuking context, ‘మీకు వ్యతిరేకంగా’ best conveys the force of μαρτυρεῖτε ἑαυτοῖς while retaining the literal alternative in a note.
  naturalness: The revised sentence has more natural Telugu word order and makes the self-incriminating force immediately clear. Removing the unsupported emphatic ‘కుమారులే’ avoids adding emphasis not explicitly marked in the Greek.
  terminology: ‘ప్రవక్తలను,’ ‘హత్య చేసినవారి,’ and ‘కుమారులు’ are accurate, modern-standard Telugu choices. ‘సాక్ష్యమిస్తున్నారు’ appropriately preserves the forensic/register nuance.
  issues:
  - severity: medium
    issue: The main text renders ἑαυτοῖς as ‘మీకు మీరే’ without expressing the contextual self-incriminating sense.
    rationale: Although formally close to the Greek dative, this Telugu wording is ambiguous and less natural in context. The clause means that their own testimony stands against them; this should be explicit in the main text, with the literal wording retained as an alternative.
  - severity: low
    issue: ‘కుమారులే’ adds an emphatic particle not required by the Greek.
    rationale: υἱοί ἐστε identifies them as sons; Telugu ‘కుమారులు’ conveys this without introducing extra emphasis.
  revised_text: కాబట్టి, మీరు ప్రవక్తలను హత్య చేసినవారి కుమారులని మీకు వ్యతిరేకంగా మీరే సాక్ష్యమిస్తున్నారు.[a]
  revised_footnotes:
