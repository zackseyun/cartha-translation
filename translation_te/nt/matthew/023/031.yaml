id: MAT.23.31
reference: Matthew 23:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: te
  text: కాబట్టి, మీరు ప్రవక్తలను హత్య చేసినవారి కుమారులని మీకు వ్యతిరేకంగా మీరే సాక్ష్యమిస్తున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు మీరే సాక్ష్యమిస్తున్నారు.” గ్రీకు మాటను అక్షరార్థంగా ఇలా అనువదించవచ్చు; అయితే ఈ సందర్భంలో వారి సాక్ష్యమే వారికి వ్యతిరేకంగా నిలిచి, వారిని దోషులుగా చూపుతోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μαρτυρεῖτε
  choice: సాక్ష్యమిస్తున్నారు
  rationale: సాక్ష్యం చెప్పడం అనే ప్రాథమిక అర్థాన్ని, సందర్భంలోని న్యాయపరమైన ధ్వనిని నిలుపుతుంది.
- source_word: ἑαυτοῖς
  choice: మీకు మీరే
  rationale: గ్రీకు దత్తివిభక్తి యొక్క అక్షరార్థానికి దగ్గరగా ఉండి, వారి సాక్ష్యం వారినే దోషులుగా చూపుతుందనే సందర్భార్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: ఇది కారణాన్ని కాకుండా సాక్ష్యంలోని విషయాన్ని పరిచయం చేస్తుంది.
- source_word: υἱοί
  choice: కుమారులు
  rationale: పురుష బహువచన కుటుంబ రూపకాన్ని, వంశసంబంధంతో పాటు నైతిక అనుబంధాన్ని కూడా నిలుపుతుంది.
- source_word: τῶν φονευσάντων
  choice: హత్య చేసినవారి
  rationale: ప్రవక్తలను చంపడం అన్యాయమైన, ఉద్దేశపూర్వక చర్య అనే బలమైన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: τοὺς προφήτας
  choice: ప్రవక్తలను
  rationale: దేవుని సందేశకులుగా గుర్తింపబడిన వర్గాన్ని నేరుగా సూచిస్తుంది.
theological_decisions:
- issue: υἱοί అనే పదాన్ని అక్షరార్థంగా ‘కుమారులు’గా ఇవ్వాలా, లేక ‘సంతతి/వారసులు’గా విస్తరించాలా
  choice: కుమారులు
  alternative: సంతతి; వారసులు
  rationale: మూలంలోని కుటుంబ సంబంధ రూపకాన్ని, యేసు ఆరోపణలోని వంశపరమైన మరియు నైతిక ఐక్యత అనే ఉద్వేగాన్ని రెండింటినీ నిలుపుతుంది.
- issue: ἑαυτοῖς ను సందర్భార్థంగా ‘మీకు వ్యతిరేకంగా’ అని స్పష్టీకరించాలా
  choice: ప్రధాన పాఠ్యంలో ‘మీకు మీరే’; పాదసూచికలో దోషారోపణ భావం
  alternative: మీకు వ్యతిరేకంగా మీరే సాక్ష్యమిస్తున్నారు
  rationale: గ్రీకు వాక్య నిర్మాణంలోని నిజమైన అర్థవిస్తృతిని ప్రధాన పాఠ్యంలో కాపాడి, సందర్భంలోని స్వీయదోషారోపణను పాదసూచికలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘కుమారులు,’ ‘సాక్ష్యమిస్తున్నారు,’ ‘హత్య’ అనే పదాలు మూలంలోని కుటుంబ, న్యాయపరమైన, నైతిక తీవ్రతలను నిలుపుతున్నాయి.
