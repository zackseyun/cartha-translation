- from: కాని శాస్త్రులారా, పరిసయ్యులారా, కపటులారా, మీకు అయ్యో! ఎందుకంటే మీరు మనుషుల ఎదుట పరలోక రాజ్యాన్ని[a] మూసివేస్తున్నారు. మీరు ప్రవేశించరు; ప్రవేశిస్తున్నవారిని[b] కూడా ప్రవేశించనివ్వరు.
