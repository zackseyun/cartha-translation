review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the woe, the addressed groups, hypocrisy, the shutting of the kingdom before people, and the twofold denial of entry. However, the opening causal connective “ఎందుకంటే” followed by a full stop weakens the syntactic link of ὅτι to the accusation, and the footnote's wording about “దేవుని రాజ్యం” is less precise than the audit trail.
  naturalness: The address and prophetic register are natural modern Telugu. “ప్రవేశిస్తున్నవారిని కూడా ప్రవేశించనివ్వరు” is understandable and suitably retains the present-participle/process sense, though “తామే” makes the contrast in the Greek more natural and clear. Recasting the first clause with “కాబట్టి” avoids an abrupt sentence break after “ఎందుకంటే.”
  terminology: “శాస్త్రులు,” “పరిసయ్యులు,” “కపటులు,” and “పరలోక రాజ్యం” are appropriate established Telugu renderings. The alternative “ఆకాశాల రాజ్యం” correctly reflects the plural τῶν οὐρανῶν. The revised footnote avoids implying an unqualified equivalence or distinction between Matthew’s expression and “దేవుని రాజ్యం.”
  issues:
  - severity: low
    issue: The causal clause is punctuated as a separate sentence after “ఎందుకంటే.”
    rationale: Greek ὅτι introduces the reason for the woe; Telugu reads more coherently when the accusation is completed with “కాబట్టి” rather than ending immediately after the first causal clause.
  - severity: low
    issue: Footnote a's explanation of the relation to “దేవుని రాజ్యం” is imprecise.
    rationale: The source/audit trail says Matthew regularly uses this expression where other contexts may say “kingdom of God”; the revision states this cautiously without constructing a doctrinal distinction or asserting a simple identity.
  revised_text: అయితే శాస్త్రులారా, పరిసయ్యులారా, కపటులారా, మీకు అయ్యో! మీరు మనుషుల ఎదుట పరలోక రాజ్యాన్ని[a] మూసివేస్తున్నారు కాబట్టి; మీరు తామే ప్రవేశించరు, ప్రవేశిస్తున్నవారిని[b] కూడా ప్రవేశించనివ్వరు.
