  rationale: 'The revision preserves the source’s prophetic denunciation, its kingdom-entry metaphor, and the present-process ambiguity of τοὺς εἰσερχομένους. It makes only safe stylistic and explanatory corrections: the causal relationship is made fluent in Telugu, “తామే” clarifies the contrast implicit in the Greek pronoun, and footnote a is aligned more carefully with the English audit trail.'
