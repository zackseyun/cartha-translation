id: MAT.23.13
reference: Matthew 23:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: te
  text: అయితే శాస్త్రులారా, పరిసయ్యులారా, కపటులారా, మీకు అయ్యో! మీరు మనుషుల ఎదుట పరలోక రాజ్యాన్ని[a] మూసివేస్తున్నారు కాబట్టి; మీరు తామే ప్రవేశించరు, ప్రవేశిస్తున్నవారిని[b] కూడా ప్రవేశించనివ్వరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆకాశాల రాజ్యం.” మత్తయి సువార్తలో తరచుగా వచ్చే ఈ పదబంధం, ఇతర సందర్భాల్లో “దేవుని రాజ్యం” అని కూడా వ్యక్తమయ్యే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రవేశించడానికి ప్రయత్నిస్తున్నవారిని.” గ్రీకు కృదంతం ప్రవేశ ప్రక్రియలో ఉన్నవారినీ, ప్రవేశించడానికి ప్రయత్నిస్తున్నవారినీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: మీకు అయ్యో
  rationale: ప్రవక్తల ఖండనలోని తీర్పు హెచ్చరికను నిలుపుతుంది; కేవలం దుఃఖాన్ని తెలిపే మృదువైన పదంగా మార్చదు.
- source_word: δὲ
  choice: కాని
  rationale: ఈ వరుసలోని కొనసాగింపుతో కూడిన స్వల్ప వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: γραμματεῖς
  choice: శాస్త్రులు
  rationale: సువార్తల యూదా సందర్భంలో ధర్మశాస్త్ర పండితులుగా ఉన్న ఈ వర్గానికి స్థిరపడిన, సంక్షిప్తమైన తెలుగు పదం.
- source_word: Φαρισαῖοι
  choice: పరిసయ్యులు
  rationale: ఆ మతవర్గం పేరుకు తెలుగులో ప్రాచుర్యంలో ఉన్న లిప్యంతరీకరణ.
- source_word: ὑποκριταί
  choice: కపటులు
  rationale: మతపరమైన నటన, అంతరంగం–బాహ్య ప్రవర్తన మధ్య అసత్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κλείετε
  choice: మూసివేస్తున్నారు
  rationale: ప్రవేశాన్ని అడ్డగించే మూసివేత రూపకాన్ని యథాతథంగా ఉంచుతుంది; మూలంలో లేని ‘తలుపు’ను చేర్చదు.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి ప్రత్యేకంగా వాడే పదబంధానికి సహజమైన తెలుగు సమానం; దీనిని వేరొక సిద్ధాంతపరమైన రాజ్యంగా నిర్వచించదు.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: మనుషుల ఎదుట
  rationale: ఇతరుల ముందే ప్రవేశమార్గాన్ని మూసివేసే స్థలాత్మక రూపకాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: εἰσέρχεσθε
  choice: ప్రవేశించరు
  rationale: రాజ్యంలో ప్రవేశించే రూపకాన్ని నేరుగా, అదనపు వివరణ లేకుండా అనువదిస్తుంది.
- source_word: τοὺς εἰσερχομένους
  choice: ప్రవేశిస్తున్నవారిని
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న ప్రక్రియ భావాన్ని కాపాడుతుంది; ప్రయత్నిస్తున్నారని ప్రధాన పాఠంలో ఖచ్చితంగా నిర్ణయించదు.
- source_word: ἀφίετε εἰσελθεῖν
  choice: ప్రవేశించనివ్వరు
  rationale: అనుమతించకపోవడం మరియు ప్రవేశించడం అనే రెండు భావాలనూ సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: βασιλεία τῶν οὐρανῶν అనే మత్తయి పదబంధం
  choice: పరలోక రాజ్యం
  alternative: ఆకాశాల రాజ్యం
  rationale: సహజమైన తెలుగు రూపాన్ని ప్రధాన పాఠంలో ఉంచి, గ్రీకు బహువచన రూపాన్ని పాదటిప్పణిలో తెలియజేస్తుంది; ‘దేవుని రాజ్యం’తో సిద్ధాంతపరమైన భేదాన్ని కల్పించదు.
- issue: τοὺς εἰσερχομένους లోని ప్రక్రియ లేదా ప్రయత్న భావం
  choice: ప్రవేశిస్తున్నవారు
  alternative: ప్రవేశించడానికి ప్రయత్నిస్తున్నవారు
  rationale: గ్రీకు వర్తమాన కృదంతం ప్రవేశ ప్రక్రియలో ఉన్నవారినీ, ప్రవేశాన్ని కోరుతున్నవారినీ సూచించగలదు. ప్రధాన పాఠం తక్కువ వ్యాఖ్యాత్మకమైన రూపాన్ని ఎంచుకుని ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- issue: ἀνθρώπων యొక్క సాధారణ మానవ సూచన
  choice: మనుషులు
  alternative: ప్రజలు
  rationale: ఇక్కడ పదం పురుషులకు మాత్రమే పరిమితం కాదు; తెలుగు ‘మనుషులు’ సమస్త మానవులను సహజంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవక్తీయ ఖండన శైలి. ‘మీకు అయ్యో’ తీర్పుతో కూడిన హెచ్చరికను నిలుపుతుంది. వాక్యంలోని పునరుక్తి భావాన్ని పూర్తిగా తొలగించకుండా, ‘ప్రవేశిస్తున్నవారిని కూడా ప్రవేశించనివ్వరు’ అనే సహజమైన తెలుగు నిర్మాణం వాడబడింది.
