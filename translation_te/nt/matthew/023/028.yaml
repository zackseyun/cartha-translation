  source_fidelity: The Telugu faithfully retains the comparative connection of οὕτως, the outward/inward contrast, apparent righteousness in human sight, and the charge of being full of hypocrisy and lawlessness. “కనిపిస్తారు” appropriately conveys φαίνεσθε without implying genuine righteousness.
  naturalness: The wording is clear, idiomatic modern standard Telugu, with an appropriately grave register. “బయటికి … లోపల” and “మనుష్యుల దృష్టికి” communicate the contrast naturally.
  terminology: “నీతిమంతులు,” “కపటత్వం,” and “ధర్మశాస్త్ర విరోధం” suitably convey the ethical-religious terms in this context. The latter preserves the law-related force of ἀνομία rather than reducing it to generic wrongdoing.
