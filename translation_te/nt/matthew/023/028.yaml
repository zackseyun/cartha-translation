id: MAT.23.28
reference: Matthew 23:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: te
  text: అలాగే, మీరు కూడా బయటికి మనుష్యుల దృష్టికి నీతిమంతులుగా కనిపిస్తారు; కాని లోపల కపటత్వంతోనూ ధర్మశాస్త్ర విరోధంతోనూ నిండివున్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: అలాగే
  rationale: ముందటి వచనంలోని సున్నం పూసిన సమాధుల పోలికను ఈ వచనానికి సహజంగా అనుసంధానిస్తుంది.
- source_word: ἔξωθεν … ἔσωθεν
  choice: బయటికి … లోపల
  rationale: బాహ్య రూపానికి, అంతర్గత వాస్తవానికి మధ్య ఉన్న స్పష్టమైన వ్యత్యాసాన్ని ఆధునిక సహజ తెలుగులో నిలుపుతుంది.
- source_word: φαίνεσθε τοῖς ἀνθρώποις δίκαιοι
  choice: మనుష్యుల దృష్టికి నీతిమంతులుగా కనిపిస్తారు
  rationale: φαίνεσθε సూచించే కనిపించే అభిప్రాయాన్ని మాత్రమే తెలియజేస్తుంది; వారిని నిజంగా నీతిమంతులని నిర్ధారించదు. మనుష్యులు ఇక్కడ స్త్రీపురుషులందరినీ సూచించే సాధారణ పదం.
- source_word: μεστοὶ
  choice: నిండివున్నారు
  rationale: అంతర్గతంగా పూర్తిగా వ్యాపించి ఉన్న స్థితిని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑποκρίσεως
  choice: కపటత్వంతో
  rationale: బయట కనిపించే భక్తికి, లోపలి వాస్తవానికి మధ్యనున్న నైతిక ద్వంద్వాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀνομίας
  choice: ధర్మశాస్త్ర విరోధంతో
  rationale: సాధారణ దుష్టత్వం కంటే, దేవుని ధర్మశాస్త్రానికి విరుద్ధంగా ఉండడమనే ἀνομία యొక్క పదునైన భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: δίκαιοι అనేది నిజమైన నీతిస్థితిని సూచిస్తుందా, లేక మనుష్యులకు కనిపించే స్థితిని మాత్రమే సూచిస్తుందా?
  choice: మనుష్యుల దృష్టికి మాత్రమే నీతిమంతులుగా కనిపించడం
  alternative: నిజంగా నీతిమంతులుగా ఉండడం
  rationale: φαίνεσθε అనే క్రియతో పాటు, లోపల కపటత్వం మరియు ధర్మశాస్త్ర విరోధం నిండివున్నాయనే వ్యత్యాసం బాహ్య అభిప్రాయాన్నే సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా యేసు పలికిన గంభీరమైన ఖండన స్వరాన్ని నిలుపుతూ అనువదించబడింది. ‘మనుష్యుల దృష్టికి’ లింగభేదం లేకుండా మానవ పరిశీలకులందరినీ సూచిస్తుంది; అందువల్ల ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
