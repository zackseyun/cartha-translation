  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ καλεῖσθαι ὑπὸ τῶν ἀνθρώπων· ⸀Ῥαββί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: te
  text: సంతస్థలాల్లో అభివాదాలు పొందడాన్నీ, ప్రజలచేత ‘రబ్బీ’ అని పిలిపించుకోవడాన్నీ ఇష్టపడతారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀσπασμοὺς
  choice: అభివాదాలు పొందడాన్ని
  rationale: సందర్భంలో మతనాయకులు బహిరంగ ప్రదేశాల్లో గౌరవపూర్వక పలకరింపులను కోరుకోవడం భావం; తెలుగులో సహజంగా ఉండేందుకు ‘పొందడం’ను స్పష్టంచేశాం.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: సంత వీధుల్లో
  rationale: ἀγορά బహిరంగ మార్కెట్‌తోపాటు ప్రజలు కూడే ప్రదేశాన్ని సూచిస్తుంది; ‘సంత వీధులు’ సాధారణ పాఠకునికి ఈ సామాజిక సందర్భాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: మనుషులు తమను
  rationale: ἄνθρωποι సాధారణంగా ‘మనుషులు/ప్రజలు’; మూలంలోని పదాన్ని నిలుపుతూ తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా కర్త రూపంలో ఇచ్చాం.
- source_word: Ῥαββί
  choice: రబ్బీ
  rationale: యూదుల గౌరవబోధక బిరుదును అనువదించి సంకుచితం చేయకుండా లిప్యంతరీకరించాం.
theological_decisions:
- issue: ‘రబ్బీ’ అనే బిరుదు యొక్క అర్థపరిధి
  choice: రబ్బీ
  alternative: బోధకుడా / గురువా
  rationale: మూలంలోని చారిత్రక యూదు బిరుదును యథాతథంగా ఉంచడం ద్వారా దాని ప్రత్యేక నేపథ్యాన్ని కాపాడాం; ఒకే తెలుగు సమానార్థంతో భావాన్ని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ఈ వచనం 23:6లో ప్రారంభమైన క్రియాశ్రేణికి కొనసాగింపు కావడంతో, తెలుగులో స్వతంత్రంగా చదివినా అర్థమయ్యేలా ‘ఇష్టపడతారు’ను సందర్భానుసారంగా పునరుద్ధరించాం.
