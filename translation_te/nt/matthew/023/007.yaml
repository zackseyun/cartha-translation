- from: సంత వీధుల్లో అభివాదాలు పొందడాన్నీ, మనుషులు తమను ‘రబ్బీ’ అని పిలవడాన్నీ ఇష్టపడతారు.
  to: సంతస్థలాల్లో అభివాదాలు పొందడాన్నీ, ప్రజలచేత ‘రబ్బీ’ అని పిలిపించుకోవడాన్నీ ఇష్టపడతారు.
  rationale: The revision preserves the source’s coordinated objects and the contextual continuation ‘they love/like,’ while using a broader equivalent for ‘marketplaces’ and an unambiguous Telugu construction for ‘to be called by people.’ No footnote is necessary for the untranslated title ‘రబ్బీ.’
