id: MAT.23.37
reference: Matthew 23:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: te
  text: “యెరూషలేమా, యెరూషలేమా, ప్రవక్తలను చంపే, నీ దగ్గరకు పంపబడినవారిని రాళ్లతో కొట్టే యెరూషలేమా![a] ఆడకోడి[b] తన పిల్లలను తన రెక్కల కిందకు చేర్చుకుంటుందో, అలాగే నీ పిల్లలను చేర్చుకోవాలని నేను ఎన్నిసార్లు కోరుకున్నాను! కాని మీరు ఇష్టపడలేదు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ప్రవక్తలను చంపుతూ, నీ దగ్గరకు పంపబడినవారిని రాళ్లతో కొడుతూ ఉండే యెరూషలేమా” అని కూడా అనువదించవచ్చు.
    reason: మూలంలోని వర్తమాన కృదంతాలు లక్షణాత్మకమైన లేదా కొనసాగుతున్న చర్యను సూచిస్తాయి; తెలుగులో సంబంధార్థక క్రియలతో గానీ కొనసాగుతున్న క్రియారూపాలతో గానీ వ్యక్తం చేయవచ్చు.
  - marker: b
    text: ఇక్కడ “ఆడకోడి”గా అనువదించిన గ్రీకు పదానికి సాధారణంగా “పక్షి” అనే అర్థం కూడా ఉండవచ్చు; అయితే పిల్లలను తన రెక్కల కింద చేర్చే సందర్భం ఆడకోడిని సూచిస్తుంది.
    reason: గ్రీకు పదంలోని విస్తృత నిఘంటు అర్థాన్ని, సందర్భం సూచించే నిర్దిష్ట భావాన్ని రెండింటినీ తెలియజేయడం.
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: యెరూషలేమా, యెరూషలేమా
  rationale: నగరాన్ని నేరుగా సంబోధించే విలాప స్వరాన్ని, పేరులోని పునరుక్తిని నిలుపుతుంది.
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα
  choice: ప్రవక్తలను చంపుతూ ... రాళ్లతో కొడుతూ ఉండే దానా
  rationale: వర్తమాన కృదంతాల ద్వారా వ్యక్తమయ్యే లక్షణాత్మకమైన, కొనసాగుతున్న చర్యను సహజమైన తెలుగు సంబోధనలో తెలియజేస్తుంది.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: నీ దగ్గరకు పంపబడినవారిని
  rationale: పరిపూర్ణ కర్మణి కృదంత భావాన్ని, వ్యక్తిగా చిత్రించబడిన నగరాన్ని సూచించే ఏకవచనాన్ని కాపాడుతుంది.
- source_word: ποσάκις ἠθέλησα
  choice: నేను ఎన్నిసార్లు కోరుకున్నాను
  rationale: విలాప సందర్భంలోని పునరావృతమైన కోరికను సహజంగా తెలియజేస్తుంది; క్రియకు మించిన నిర్ణయాత్మక భావాన్ని జోడించదు.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: నీ పిల్లలను చేర్చుకోవాలని
  rationale: సమకూర్చి తన దగ్గర ఉంచుకునే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ ‘నీ పిల్లలు’ అనే రూపకాన్ని నిలుపుతుంది.
- source_word: ὃν τρόπον ὄρνις ἐπισυνάγει τὰ νοσσία αὐτῆς ὑπὸ τὰς πτέρυγας
  choice: కోడి తన పిల్లలను రెక్కల కిందికి చేర్చుకున్నట్లుగా
  rationale: పిల్లలను రెక్కల కింద చేర్చే మాతృపక్షి దృశ్యాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది; ὄρνις యొక్క విస్తృత అర్థాన్ని పాదసూచికలో పేర్కొంటుంది.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: కాని మీరు ఇష్టపడలేదు
  rationale: మూలంలోని బహువచన క్రియను ‘మీరు’తో స్పష్టంగా చూపించి, యేసు కోరికకు యెరూషలేము ప్రజల నిరాకరణకు మధ్య ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యేసు కోరికకు యెరూషలేము ప్రజల అయిష్టతకు మధ్య ఉన్న వ్యత్యాసం
  choice: ‘కోరుకున్నాను ... మీరు ఇష్టపడలేదు’ అని రెండు వైపుల సంకల్ప భాషను నిలుపడం
  alternative: ‘నేను నిర్ణయించాను’ వంటి బలమైన నిర్ణయాత్మక భాష వాడటం, లేదా దీనిని కేవలం భావోద్వేగమైన వాంఛగా మార్చి చెప్పటం
  rationale: మూలవాక్యం నిజమైన సంకల్ప వ్యత్యాసాన్ని ఉంచుతుంది; దైవ సంకల్పం, మానవ బాధ్యత, లేదా క్రీస్తు స్వరూపం గురించిన విస్తృత సిద్ధాంత వివాదాన్ని అనువాదం స్వయంగా పరిష్కరించకూడదు.
- issue: ‘నీ పిల్లలు’ ఎవరనే గుర్తింపు
  choice: నగరానికి సంబంధించిన ప్రజలను సూచించే ‘నీ పిల్లలు’ అనే రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: ‘నీ ప్రజలు’ లేదా ‘నీ నివాసులు’ అని వివరణాత్మకంగా మార్చడం
  rationale: యెరూషలేమును వ్యక్తిగా చిత్రించే మూలరూపకాన్ని కాపాడుతూ, సూచించబడిన వర్గాన్ని అవసరానికి మించి కుదించదు.
- issue: ఏకవచన నగర సంబోధన నుండి బహువచన నిరాకరణకు మార్పు
  choice: ‘నీ’ అనే ఏకవచనంతో నగరాన్ని, ‘మీరు’ అనే బహువచనంతో దాని ప్రజలను సూచించడం
  alternative: చివరలో కూడా ఏకవచనమైన ‘నీవు ఇష్టపడలేదు’ అని సమపరచడం
  rationale: ἠθελήσατε బహువచనం. ఈ వ్యాకరణ మార్పు నగరం మరియు దాని ప్రజల మధ్య ఉన్న ఉద్దేశపూర్వక భావసంబంధాన్ని వెల్లడిస్తుంది; దాన్ని తొలగించకుండా ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన విలాప స్వరాన్ని ఉంచాం. నగరానికి ఏకవచనమైన ‘నీ’, దాని ప్రజలకు బహువచనమైన ‘మీరు’ వాడి మూలంలోని వ్యాకరణ మార్పును స్పష్టంగా కాపాడాం. ‘చేర్చుకోవాలని’ అనే రూపం రక్షణాత్మకమైన మాతృపక్షి దృశ్యాన్ని సహజంగా అందిస్తుంది.
