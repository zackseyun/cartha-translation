revisions:
- from: “యెరూషలేమా, యెరూషలేమా, ప్రవక్తలను చంపుతూ, నీ దగ్గరకు పంపబడినవారిని రాళ్లతో కొడుతూ ఉండే దానా![a] కోడి[b] తన పిల్లలను రెక్కల కిందికి చేర్చుకున్నట్లుగా, నీ పిల్లలను చేర్చుకోవాలని నేను ఎన్నిసార్లు కోరుకున్నాను! కాని మీరు ఇష్టపడలేదు.”
  to: “యెరూషలేమా, యెరూషలేమా, ప్రవక్తలను చంపే, నీ దగ్గరకు పంపబడినవారిని రాళ్లతో కొట్టే యెరూషలేమా![a] ఆడకోడి[b] తన పిల్లలను తన రెక్కల కిందకు చేర్చుకుంటుందో, అలాగే నీ పిల్లలను చేర్చుకోవాలని నేను ఎన్నిసార్లు కోరుకున్నాను! కాని మీరు ఇష్టపడలేదు.”
  rationale: 'The revision makes only safe linguistic and aspectual improvements: it renders the maternal bird explicitly as ‘ఆడకోడి,’ uses a present-tense Telugu verb for the hen’s characteristic gathering action, and smooths the vocative construction. It retains the source’s imagery, ambiguity where relevant, and singular-to-plural grammatical shift.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:13Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the repeated vocative, the characteristic present participles, the singular personification of Jerusalem followed by the plural refusal, and the volitional contrast. A small revision improves the simile: Greek has a present verb (''gathers''), and ''under her wings'' is better rendered ''తన రెక్కల కిందకు'' rather than ''రెక్కల కిందికి.'''
  naturalness: ‘చంపుతూ ... కొడుతూ ఉండే దానా’ is understandable but somewhat heavy and less idiomatic in a direct lament. ‘ప్రవక్తలను చంపే, ... రాళ్లతో కొట్టే యెరూషలేమా’ is natural modern standard Telugu and retains the characteristic force. ‘ఆడకోడి’ clearly conveys the contextual sense of ὄρνις.
  terminology: ‘యెరూషలేమా,’ ‘ప్రవక్తలు,’ ‘నీ పిల్లలు,’ and the retained contrast ‘కోరుకున్నాను ... ఇష్టపడలేదు’ are appropriate. The wording does not settle theological questions beyond the verse.
  issues:
  - severity: medium
    issue: The simile uses ‘చేర్చుకున్నట్లుగా,’ a completed-action form.
    rationale: 'ἐπισυνάγει is present tense: the comparison is to what a hen characteristically does. ‘చేర్చుకుంటుందో’ preserves this aspect more closely.'
  - severity: low
    issue: ‘రెక్కల కిందికి’ is less precise for the directional expression in the image.
    rationale: ‘తన రెక్కల కిందకు’ naturally expresses gathering the chicks under her wings.
  - severity: low
    issue: ‘దానా’ after the participial description is stylistically awkward in this vocative address.
    rationale: Repeating ‘యెరూషలేమా’ after the descriptive participles is a more natural Telugu construction and preserves the direct address.
  revised_text: “యెరూషలేమా, యెరూషలేమా, ప్రవక్తలను చంపే, నీ దగ్గరకు పంపబడినవారిని రాళ్లతో కొట్టే యెరూషలేమా![a] ఆడకోడి[b] తన పిల్లలను తన రెక్కల కిందకు చేర్చుకుంటుందో, అలాగే నీ పిల్లలను చేర్చుకోవాలని నేను ఎన్నిసార్లు కోరుకున్నాను! కాని మీరు ఇష్టపడలేదు.”
  revised_footnotes:
  - marker: a
    text: “ప్రవక్తలను చంపుతూ, నీ దగ్గరకు పంపబడినవారిని రాళ్లతో కొడుతూ ఉండే యెరూషలేమా” అని కూడా అనువదించవచ్చు.
