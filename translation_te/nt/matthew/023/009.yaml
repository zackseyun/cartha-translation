id: MAT.23.9
reference: Matthew 23:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: te
  text: భూమిమీద ఎవరినీ మీ తండ్రి అని పిలవవద్దు; ఎందుకంటే మీ తండ్రి ఒక్కడే—పరలోకపు తండ్రి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎందుకంటే మీ తండ్రి ఒక్కడే—పరలోకంలో ఉన్నవాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα
  choice: తండ్రి
  rationale: καλέσητεకు ప్రత్యక్ష కర్మగా ఉండి, ఇక్కడ గౌరవబిరుదు లేదా సంబోధనగా వాడిన ‘తండ్రి’ని సూచిస్తుంది; రెండవ వాక్యభాగంలోని πατήρతో సమాంతరతను నిలుపుతుంది.
- source_word: μὴ καλέσητε
  choice: పిలవవద్దు
  rationale: μήతో కూడిన aorist subjunctive నిషేధాజ్ఞను వ్యక్తం చేస్తుంది. ‘పిలవవద్దు’ ఆ ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది.
- source_word: ὑμῶν
  choice: మీ
  rationale: మొదటి సందర్భంలో πατέραతో సహజమైన స్వామ్య సంబంధంగా ‘మీ తండ్రి’ అని అనువదించబడింది; రెండవ సందర్భంలోనూ అదే సంబంధం నిలుపబడింది.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిమీద
  rationale: పరలోక సంబంధమైన తండ్రికి విరుద్ధంగా భౌమిక పరిధి లేదా స్థలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἷς
  choice: ఒక్కడే
  rationale: గ్రీకులోని ‘ఒకడు’ అనే సంఖ్యార్థంతో పాటు సందర్భంలోని ఏకైకత్వాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; ఇది εἷς ... πατήρ అనే విధేయ నిర్మాణానికి తగినది.
- source_word: ὁ πατήρ
  choice: తండ్రి
  rationale: SBLGNTలోని ὑμῶνతో కలిపి ‘మీ తండ్రి’గా ఇచ్చి వ్యక్తిగత సంబంధాన్ని నిలుపుతుంది.
- source_word: ὁ οὐράνιος
  choice: పరలోక సంబంధి
  rationale: ఆర్టికల్‌తో substantivalగా ఉన్న విశేషణపు గుర్తింపును నిలుపుతూ, దానిని ‘పరలోకంలో ఉన్నవాడు’గా స్థలవాచకంగా మాత్రమే పరిమితం చేయకుండా అనువదిస్తుంది.
theological_decisions:
- issue: యేసు ఇచ్చిన నిషేధం యొక్క పరిధి
  choice: భూమిమీద ఎవరినీ ‘మీ తండ్రి’ అని పిలవవద్దనే నేరమైన, కఠినమైన ఆజ్ఞగా ఉంచడం
  alternative: సాధారణ శారీరక తండ్రులతో సహా ‘తండ్రి’ అనే పదం వాడే ప్రతి సందర్భానికీ వర్తించే సంపూర్ణ నిషేధమని విపులీకరించడం; లేదా అతిశయోక్తిగా భావించి ఆజ్ఞను మృదుపరచడం
  rationale: గ్రీకు పాఠ్యం నేరమైన నిషేధాన్ని ఇస్తుంది. అయితే అది సాధారణ కుటుంబ లేదా సామాజిక వాడుకలతో ఎలా సంబంధించాలో అనువాదంలోనే తీర్మానించడం తగదు; అందువల్ల అసలు పాఠ్యంలోని ధార్మిక ఉద్వేగం అలాగే ఉంచబడింది.
- issue: ὁ οὐράνιος యొక్క భావం
  choice: విశేషణాన్ని substantival గుర్తింపుగా ‘పరలోక సంబంధి’ అని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘పరలోక తండ్రి’ లేదా ‘పరలోకంలో ఉన్నవాడు’
  rationale: మూలంలోని గుర్తించదగిన adjectival నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది; ఇతర సహజమైన విశ్లేషణలను పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి. ‘ఎవరినీ’ ద్వారా గ్రీకులో విడిగా లేని మానవ కర్మను సహజంగా వ్యక్తం చేశాం. సెమీకోలన్ రెండు పరస్పర సంబంధిత వాక్యభాగాలను స్పష్టంగా కలుపుతుంది. ప్రధాన పాఠ్యంలోని [a] సూచిక సంబంధిత పదబంధం వెంట ఉంచబడింది.
