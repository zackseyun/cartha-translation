    text: లేదా, “ఎందుకంటే మీ తండ్రి ఒక్కడే—పరలోకంలో ఉన్నవాడు.”
    reason: lexical_alternative
  revision_rationale: The revision replaces the unnatural ‘పరలోక సంబంధి’ with ‘పరలోకపు తండ్రి,’ which naturally expresses the Greek article-adjective identification in Telugu. The wording remains direct and does not settle the scope of the prohibition beyond the source text. The footnote retains the viable locative rendering of ὁ οὐράνιος.
