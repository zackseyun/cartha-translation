review_pass:
  verdict: revise
  source_fidelity: The prohibition, the earthly contrast, the possessive ‘your,’ and the exclusive ‘one’ are conveyed accurately. ‘ఎవరినీ’ is a necessary idiomatic Telugu object and does not introduce a doctrinal limitation. The draft’s ‘పరలోక సంబంధి,’ however, is an unnatural and semantically vague substantival expression in Telugu for ὁ οὐράνιος.
  naturalness: The imperative is clear and appropriately formal. Replacing ‘పరలోక సంబంధి’ with ‘పరలోకపు తండ్రి’ yields natural modern standard Telugu while retaining the Greek identification of the one Father as the heavenly Father.
  terminology: ‘తండ్రి’ appropriately preserves the title language and the parallelism of πατέρα / πατήρ. ‘పరలోకపు తండ్రి’ is an established, intelligible Telugu theological expression and is preferable to the calqued ‘పరలోక సంబంధి.’
  issues:
  - severity: medium
    issue: ‘పరలోక సంబంధి’ is unnatural in this predicative/substantival position.
    rationale: Although intended to reproduce the adjectival force of ὁ οὐράνιος, it reads as an abstract adjective (‘heaven-related’) rather than as a natural identification of the Father. This obscures the clause in contemporary Telugu.
  revised_text: భూమిమీద ఎవరినీ మీ తండ్రి అని పిలవవద్దు; ఎందుకంటే మీ తండ్రి ఒక్కడే—పరలోకపు తండ్రి.[a]
  revised_footnotes:
