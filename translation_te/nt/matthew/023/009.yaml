revisions:
- from: భూమిమీద ఎవరినీ మీ తండ్రి అని పిలవవద్దు; ఎందుకంటే మీ తండ్రి ఒక్కడే—పరలోక సంబంధి.[a]
  to: భూమిమీద ఎవరినీ మీ తండ్రి అని పిలవవద్దు; ఎందుకంటే మీ తండ్రి ఒక్కడే—పరలోకపు తండ్రి.[a]
  rationale: The revision replaces the unnatural ‘పరలోక సంబంధి’ with ‘పరలోకపు తండ్రి,’ which naturally expresses the Greek article-adjective identification in Telugu. The wording remains direct and does not settle the scope of the prohibition beyond the source text. The footnote retains the viable locative rendering of ὁ οὐράνιος.
