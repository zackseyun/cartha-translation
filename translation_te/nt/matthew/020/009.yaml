  text: ⸂καὶ ἐλθόντες⸃ οἱ περὶ τὴν ἑνδεκάτην ὥραν ἔλαβον ἀνὰ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: te
  text: సుమారు పదకొండవ గంట సమయంలో వచ్చినవారు ఒక్కొక్క దేనారం[a] పొందారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దేనారం రోమీయుల వెండి నాణెం; సాధారణంగా అది ఒక కూలివాని ఒక రోజు వేతనంగా పరిగణించబడేది.
    reason: cultural_note
lexical_decisions:
- source_word: ⸂καὶ ἐλθόντες⸃
  choice: వచ్చినవారు
  rationale: ἐλθόντες అనే భూతకాల కృదంతాన్ని సహజమైన తెలుగులో ‘వచ్చినవారు’ అని ఇచ్చాం. καὶ కథన అనుసంధానాన్ని సూచించినా, ఈ ఒక్క వాక్యంలో తెలుగులో ప్రత్యేకంగా ‘మరియు’ చేర్చడం కృత్రిమంగా ఉంటుంది; సంఘటనల వరుస సందర్భం ద్వారానే స్పష్టమవుతుంది.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: పదకొండవ గంట సమయంలో
  rationale: περὶ + కాలవాచక ద్వితీయావిభక్తి ఖచ్చితమైన బిందువుకన్నా సుమారు ఆ సమయాన్ని సూచిస్తుంది. ‘సమయంలో’ అనేది ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలో లేని ‘పనికి కుదిరిన’ అనే మాటను చేర్చలేదు.
- source_word: ἔλαβον
  choice: పొందారు
  rationale: కూలి చెల్లింపు సందర్భంలో ‘పొందారు’ సహజంగా ఉండి, వారు చెల్లింపును స్వీకరించారనే భావాన్ని తెలియజేస్తుంది.
- source_word: ἀνὰ δηνάριον
  choice: ఒక్కొక్కరు ఒక్క దేనారం
  rationale: ἀνά యొక్క పంపిణీ భావాన్ని ‘ఒక్కొక్కరు’ స్పష్టంగా వ్యక్తపరుస్తుంది. δηνάριον అనే చారిత్రక నాణెం పేరును వ్యాఖ్యానించి ‘ఒక రోజు కూలి’గా మార్చకుండా ‘దేనారం’గా ఉంచాం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పదకొండవ గంట’ అనే ప్రాచీన కాలగణనను యథాతథంగా ఉంచి, దాని సుమారు భావాన్ని ‘సమయంలో’ ద్వారా తెలిపాం.
