  verdict: revise
  source_fidelity: The draft accurately represents the addressees, plural command, inclusive emphasis (‘మీరు కూడా’), vineyard, and future promise. However, ‘ఏది న్యాయమో’ can mean ‘what justice is’; the Greek neuter substantive δίκαιον is more directly conveyed by ‘ఏది న్యాయమైనదో’ (‘whatever is just/right’).
  naturalness: The wording is fluent modern standard Telugu. ‘ద్రాక్షతోటలోకి వెళ్లండి’ and ‘మీకు ఇస్తాను’ are natural in this parabolic context.
  terminology: ‘ద్రాక్షతోట’ appropriately renders ἀμπελών. ‘న్యాయమైనది’ preserves the ethical/just sense of δίκαιον without turning δίδωμι into ‘pay.’ The alternatives ‘సరైనది’ and ‘సముచితమైనది’ are suitable in the footnote.
  issues:
  - severity: low
    issue: The main rendering ‘ఏది న్యాయమో’ is slightly semantically imprecise.
    rationale: It may be understood as an inquiry into the definition of justice, whereas ὃ ἐὰν ᾖ δίκαιον means ‘whatever may be right/just.’ Adding ‘-మైనది’ makes the predicative adjective explicit and preserves the source sense.
