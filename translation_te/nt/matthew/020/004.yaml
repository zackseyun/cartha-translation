id: MAT.20.4
reference: Matthew 20:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: te
  text: ఆయన వారితో, “మీరు కూడా ద్రాక్షతోటలోకి వెళ్లండి. ఏది న్యాయమైనదో అది మీకు ఇస్తాను[a]” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఏది సరైనదో” లేదా “ఏది సముచితమైనదో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις
  choice: వారితో
  rationale: ఇంతకు ముందు ప్రస్తావించిన కూలీలను సూచించే దత్తివ బహువచన సర్వనామం; సందర్భంలో ‘వారితో’ సహజంగా ఉంటుంది.
- source_word: εἶπεν
  choice: అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే λέγω యొక్క సాధారణ కథన రూపం.
- source_word: Ὑπάγετε
  choice: వెళ్లండి
  rationale: బహువచన ఆజ్ఞారూపాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ ὑμεῖς
  choice: మీరు కూడా
  rationale: ముందు పంపబడిన వారితో వీరినీ చేర్చే భావాన్నీ, ‘మీరు’పై ఉన్న ఉద్ఘాటననూ నిలుపుతుంది.
- source_word: ἀμπελῶνα
  choice: ద్రాక్షతోట
  rationale: ἀμπελώνకు తెలుగులో సాధారణమైన, స్పష్టమైన సమానార్థకం.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: ఏది న్యాయమో అది
  rationale: ‘ఏది న్యాయమైనదై ఉంటుందో’ అనే అనిశ్చిత సంబంధవాక్య భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; దీనిని కేవలం వ్యక్తిగత ‘సముచితత’గా పరిమితం చేయదు.
- source_word: δώσω ὑμῖν
  choice: మీకు ఇస్తాను
  rationale: సందర్భం కూలి గురించినదైనా, δίδωμι యొక్క ప్రత్యక్ష అర్థమైన ‘ఇస్తాను’ను నిలుపుతుంది; ‘చెల్లిస్తాను’ అని మూలంలో లేని ప్రత్యేకతను చేర్చదు.
theological_decisions:
- issue: కూలి నిర్ణయించే సందర్భంలో δίκαιον అనువాదం
  choice: న్యాయం
  alternative: సరైనది; సముచితమైనది
  rationale: ఈ పదం న్యాయానికి లేదా సరైన నైతిక క్రమానికి అనుగుణమైనదనే భావాన్ని కలిగి ఉంది. ‘న్యాయం’ ఆ నైతిక బలాన్ని నిలుపుతుంది; ‘సముచితం’ లేదా ‘సరైంది’ కూడా సాధ్యమైన అర్థాలే కాబట్టి వాటిని పాదసూచికలో చూపించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. గ్రీకు వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ప్రత్యక్ష సంభాషణకు సహజమైన తెలుగు క్రమం ఎంచుకోబడింది. పాదసూచిక గుర్తును అది వివరిస్తున్న δίκαιον భావానికి సంబంధించిన పదబంధం వద్ద ఉంచాం.
