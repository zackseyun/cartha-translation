id: MAT.20.26
reference: Matthew 20:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: te
  text: మీలో అలా ఉండకూడదు.[a] అయితే మీలో గొప్పవాడిగా కావాలనుకునేవాడు మీ సేవకుడై ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీలో అలా ఉండదు.” గ్రీకులో భవిష్యత్ కాల క్రియ ఉంది; యేసు అనుచరుల మధ్య అది ఎలా ఉండకూడదో ఈ రూపం సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: మీలో అలా ఉండకూడదు
  rationale: గ్రీకు భవిష్యత్ క్రియ ἔσται ఇక్కడ యేసు అనుచరుల సమాజంలో పరిస్థితి ఎలా ఉండాలో నిర్దేశించే భావాన్ని కలిగి ఉంది. సహజమైన ఆధునిక తెలుగులో ‘ఉండకూడదు’ ఆ నియమాత్మక బలాన్ని వ్యక్తం చేస్తుంది; అక్షరార్థ భవిష్యత్ రూపానికి గమనికలో స్థానం ఇచ్చాం.
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: అయితే ... కావాలనుకునేవాడు
  rationale: ὃς ἂν తో కూడిన సంభావ్య విధి క్రియ సాధారణంగా ఎవరినైనా సూచిస్తుంది; తెలుగు క్రియాత్మక ‘కావాలనుకునేవాడు’ ఆ అనిర్దిష్ట, సంకల్పార్థ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: μέγας γενέσθαι
  choice: గొప్పవాడిగా కావాలని
  rationale: γενέσθαι లోని ‘అవడం/కావడం’ అనే ప్రవేశార్థాన్ని నిలుపుతూ, కేవలం ‘గొప్పవాడిగా ఉండాలని’ అని స్థితిగా మార్చలేదు.
- source_word: διάκονος
  choice: సేవకుడు
  rationale: ఈ సందర్భంలో διάκονος సేవచేసే వ్యక్తిని సూచిస్తుంది. ‘డీకన్’ అనడం తరువాతి సంఘ పదవిని అనవసరంగా సూచిస్తుంది; ‘పరిచారకుడు’ కంటే ‘సేవకుడు’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: ὑμῶν
  choice: మీకు
  rationale: ‘మీ సేవకుడు’ అనే స్వామ్యార్థం కంటే, సమూహానికి సేవచేసే సంబంధాన్ని తెలుగులో ‘మీకు సేవకుడు’ సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: యేసు అనుచరుల సమాజంలో గొప్పతనం స్వభావం
  choice: లోకాధికార క్రమానికి విరుద్ధంగా, గొప్పతనాన్ని ఇతరులకు సేవచేయడంతో ముడిపెట్టే నియమంగా అనువదించాం.
  alternative: διάκονος ను సంఘంలోని ‘డీకన్’ పదవిగా అనువదించడం, లేదా సేవకుడు అనే స్పష్టమైన రూపకాన్ని సాధారణ వినయంగా మాత్రమే వివరణాత్మకంగా మార్చడం.
  rationale: చుట్టుపక్కల సందర్భం అన్యజన పాలకుల ఆధిపత్యానికి యేసు శిష్యుల ప్రవర్తనను వ్యతిరేకంగా ఉంచుతుంది. అనువాదం తరువాతి సంఘ నిర్మాణాన్ని దిగుమతి చేయకుండా స్పష్టమైన సేవకుని భాషను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, అయినా గంభీరంగా ఉండే శైలి. వాక్యంలోని నియమాత్మక బలాన్ని సహజ తెలుగులో చూపుతూ, గ్రీకు భవిష్యత్ రూపంలోని నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
