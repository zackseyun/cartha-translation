- from: మొదటివారిగా వచ్చినవారు[a] తాము ఎక్కువ పొందుతామని అనుకున్నారు. అయితే వారిలో ప్రతి ఒక్కరికీ కూడా ఒక దేనారం[b] మాత్రమే లభించింది.
  to: మొదట వచ్చినవారు[a] తాము ఎక్కువగా పొందుతామని అనుకున్నారు; కానీ వారూ ఒక్కొక్కరు ఒక దేనారం[b] పొందారు.
