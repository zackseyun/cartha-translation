translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘అయితే’ మరియు ‘మాత్రమే’ గ్రీకు వాక్యంలో ప్రత్యక్షంగా లేకపోయినా, సమాన చెల్లింపులోని వ్యత్యాసాన్ని తెలుగులో బలపరుస్తాయి; అయితే ‘మాత్రమే’ మూలంలో లేని పరిమితి భావాన్ని కొద్దిగా పెంచుతుంది.
