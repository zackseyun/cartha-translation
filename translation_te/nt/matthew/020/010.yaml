id: MAT.20.10
reference: Matthew 20:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: te
  text: మొదట వచ్చినవారు[a] తాము ఎక్కువగా పొందుతామని అనుకున్నారు; కానీ వారూ ఒక్కొక్కరు ఒక దేనారం[b] పొందారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మొదటివారు’; ఇది ఉపమానంలో మొదట పనికి కుదిరిన కూలీలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: దేనారం సాధారణంగా ఒక కూలీకి ఒక రోజు పనికి ఇచ్చే వేతనం.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: వచ్చినవారు
  rationale: కాలసూచక క్రియావిశేషణ భావాన్ని తెలుగులో సహజంగా ప్రధాన వాక్యంతో కలిపి, వారు చెల్లింపు కోసం వచ్చిన సందర్భాన్ని సూచిస్తుంది.
- source_word: οἱ πρῶτοι
  choice: మొదటివారిగా
  rationale: ఉపమానంలో ముందుగా పనికి కుదిరిన కూలీల గుంపును సూచిస్తుంది; కేవలం హోదా లేదా శ్రేణిని కాదు.
- source_word: ἐνόμισαν
  choice: అనుకున్నారు
  rationale: వారి ఊహ లేదా నిరీక్షణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; నిశ్చయార్థాన్ని అనవసరంగా చేర్చదు.
- source_word: πλεῖον
  choice: ఎక్కువ
  rationale: ఎక్కువ మొత్తంలో కూలి వస్తుందనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λήμψονται
  choice: పొందుతామని
  rationale: గతకాలంలోని ఆలోచనలో ఉన్న భవిష్య నిరీక్షణను తెలుగు పరోక్ష వచనంలో సహజంగా చూపిస్తుంది.
- source_word: τὸ ἀνὰ δηνάριον
  choice: ప్రతి ఒక్కరికీ ఒక దేనారం
  rationale: ἀνά యొక్క పంపిణీ భావాన్ని ‘ప్రతి ఒక్కరికీ’ అని స్పష్టంగా చూపిస్తూ, συμφωνημένη కూలిని సూచించే ఒక దేనారాన్ని నిలుపుతుంది.
- source_word: καὶ αὐτοί
  choice: వారిలో ప్రతి ఒక్కరికీ కూడా
  rationale: ఇతరులకు వచ్చినట్టే వీరికీ అదే మొత్తం వచ్చిందనే ఆశ్చర్యకర సమానత్వాన్ని ‘కూడా’ ద్వారా నిలుపుతుంది.
