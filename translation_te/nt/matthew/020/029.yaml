  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: te
  text: వారు యెరికో నుండి బయలుదేరుతుండగా[a], పెద్ద జనసమూహం ఆయనను అనుసరించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు యెరికో నుండి వెళ్లిపోతుండగా.’
    reason: ἐκπορευομένων అనే పదానికి సందర్భానుకూలమైన మరో అనువాదాన్ని చూపుతుంది.
lexical_decisions:
- source_word: ἐκπορευομένων
  choice: బయలుదేరుతుండగా
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న చర్యను, కాలసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀπὸ Ἰεριχὼ
  choice: యెరికో పట్టణం నుండి
  rationale: ἀπό ఒక ప్రదేశం నుండి దూరంగా కదలడాన్ని సూచిస్తుంది. తెలుగు పాఠకులకు స్థలనామం స్పష్టంగా ఉండేందుకు ‘పట్టణం’ చేర్చబడింది; భావం అతిగా విస్తరించబడలేదు.
- source_word: ἠκολούθησεν
  choice: వెంబడించింది
  rationale: ἀκολουθέω ఇక్కడ ఒకరి వెనుక వెళ్లడం అనే సాధారణ భావాన్ని ఇస్తుంది. ‘వెంబడించింది’ సహజంగా ఆ కదలికను తెలియజేస్తుంది.
- source_word: αὐτῷ
  choice: ఆయనను
  rationale: దత్తివ ఏకవచన సర్వనామం సందర్భంలో యేసును సూచిస్తుంది. గ్రీకులోని బహువచనం నుండి ఏకవచనానికి మార్పును అలాగే నిలుపుతుంది.
- source_word: ὄχλος πολύς
  choice: పెద్ద జనసమూహం
  rationale: జనం సంఖ్యాపరంగా అధికంగా ఉన్నారని స్పష్టంగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: బహువచన కృదంత వాక్యభాగం తరువాత ఉన్న αὐτῷ అనే ఏకవచన సర్వనామం ఎవరిని సూచిస్తుంది
  choice: జనసమూహం యేసును (‘ఆయనను’) వెంబడించింది.
  alternative: జనసమూహం వారందరినీ వెంబడించింది.
  rationale: గ్రీకు పాఠం ‘వారు బయలుదేరుతుండగా’ అనే బహువచనం నుండి ‘ఆయనను వెంబడించింది’ అనే ఏకవచనానికి మారుతుంది. సందర్భంలో యేసే సహజమైన సూచిత వ్యక్తి; ఈ మార్పును అనువాదం సవరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగాను, బైబిలు వచనానికి తగిన గౌరవభావంతోనూ రూపొందించబడింది.
