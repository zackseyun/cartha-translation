id: MAT.20.18
reference: Matthew 20:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: te
  text: “ఇదిగో[a], మనం యెరూషలేముకు ఎక్కి వెళ్తున్నాం. మనుష్యకుమారుడు[c] ముఖ్య యాజకులకు, శాస్త్రులకు అప్పగించబడతాడు[b]. వారు ఆయనకు మరణశిక్ష విధిస్తారు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “చూడండి.”'
    reason: lexical_alternative
  - marker: b
    text: “అప్పగించబడతాడు” అనే క్రియను కొన్ని సందర్భాల్లో “ద్రోహం ద్వారా అప్పగించబడతాడు” అని కూడా అర్థం చేసుకోవచ్చు; ఇక్కడ గ్రీకు పదం విస్తృతంగా ఇతరుల అధికారానికి అప్పగించబడటాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: “మనుష్యకుమారుడు” అనేది యేసు తనను సూచించుకోవడానికి ప్రత్యేకంగా ఉపయోగించిన బిరుదు; ఇది దానియేలు 7:13–14ను ప్రతిధ్వనింపజేయవచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని ఆకర్షించే గ్రీకు సంభాషణ సూచక పదం యొక్క బలాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀναβαίνομεν
  choice: మనం ... ఎక్కి వెళ్తున్నాం
  rationale: వర్తమానకాల ప్రయాణ భావాన్ని సహజంగా తెలియజేస్తూ, యెరూషలేముకు వెళ్లడాన్ని ‘ఎక్కడం’గా చెప్పే భౌగోళిక, సంప్రదాయ భావాన్ని కాపాడుతుంది.
- source_word: Ἱεροσόλυμα
  choice: యెరూషలేము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన స్థలనామ రూపం.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: సువార్తల్లో యేసు తనను సూచించుకోవడానికి ఉపయోగించిన విశిష్ట బిరుదును, దానియేలు 7తో ఉండగల ప్రతిధ్వనిని కాపాడే స్థిరమైన తెలుగు రూపం.
- source_word: παραδοθήσεται
  choice: అప్పగించబడతాడు
  rationale: ఇతరుల అధికారానికి అప్పగించబడే భావాన్ని తెలియజేస్తుంది; ఈ వచనంలోనే దానిని కేవలం ద్రోహానికి పరిమితం చేయదు.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: ముఖ్య యాజకులకు
  rationale: ఒక్క ప్రధాన యాజకుడిని కాక, యాజక నాయకత్వ వర్గాన్ని సూచించే బహువచనానికి సరైన తెలుగు రూపం.
- source_word: γραμματεῦσιν
  choice: శాస్త్రులకు
  rationale: ధర్మశాస్త్ర సంబంధిత లేఖకులు, పండితులు అనే చారిత్రక వర్గాన్ని సూచించే స్థిరమైన తెలుగు బైబిలు పదం.
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: వారు ఆయనకు మరణశిక్ష విధిస్తారు
  rationale: దోషిగా తీర్పు ఇచ్చి మరణాన్ని శిక్షగా నిర్ణయించే న్యాయపరమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే క్రీస్తుసంబంధ బిరుదు
  choice: మనుష్యకుమారుడు
  alternative: మానవ కుమారుడు / మానవుడు
  rationale: సాధారణ మానవునిగా మాత్రమే అర్థాన్ని కుదించకుండా, యేసు స్వీయసూచనగా ఉన్న బిరుదును మరియు దానియేలు 7:13–14తో ఉండగల సంబంధాన్ని నిలుపుతుంది.
- issue: παραδοθήσεται యొక్క భావపరిధి
  choice: అప్పగించబడతాడు
  alternative: ద్రోహం చేయబడతాడు
  rationale: గ్రీకు క్రియ సూచించే విస్తృతమైన ‘ఇతరుల అధికారానికి అప్పగించడం’ అనే భావాన్ని కాపాడుతుంది; ద్రోహి ఎవరో లేదా చర్య ద్రోహమేనని ఈ వచనంలో అవసరానికి మించి నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సంభాషణ శైలిని, వాక్యంలోని గంభీరమైన ప్రవచన స్వరాన్ని సమతుల్యం చేశాం. ‘ఎక్కి వెళ్తున్నాం,’ ‘అప్పగించబడతాడు,’ ‘మరణశిక్ష విధిస్తారు’ వంటి రూపాలు మూలంలోని ప్రయాణ, నిష్క్రియ, న్యాయ భావాలను స్పష్టంగా నిలుపుతాయి.
