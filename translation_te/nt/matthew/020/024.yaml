  source_fidelity: గ్రీకు వాక్యంలోని Καὶ ἀκούσαντες ('విని/విన్నప్పుడు'), οἱ δέκα ('ఆ పదిమంది'), ἠγανάκτησαν ('ఆగ్రహించారు'), మరియు περὶ τῶν δύο ἀδελφῶν ('ఆ ఇద్దరు సోదరుల విషయంలో') భావాలను అనువాదం విశ్వసనీయంగా ప్రతిబింబిస్తుంది. మూలంలో వినబడిన విషయానికి కర్మ ప్రత్యక్షంగా లేకపోయినా, సందర్భానుసారమైన ‘ఆ మాట’ సహజమైన తెలుగు సూచనగా ఉంది; అది అర్థాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
  naturalness: వాక్యం ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా, గౌరవప్రదంగా ఉంది. ‘ఆ ఇద్దరు సోదరుల విషయంలో ఆగ్రహించారు’ అనేది περί యొక్క ‘గురించి/విషయంలో’ సంబంధాన్ని సరిగ్గా నిలుపుతుంది.
  terminology: ‘ఆగ్రహించారు’ అనేది ἠγανάκτησανకు తగిన, సందర్భానుకూలమైన పదం. ‘సోదరులు’ కూడా ἀδελφοίకి సరైన సాధారణ తెలుగు సమానం. ప్రత్యేక మతపరమైన పదజాలం లేదా వివరణాత్మక పాదటిప్పణి అవసరం లేదు.
