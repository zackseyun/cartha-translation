  text: ఆ మాట విన్నప్పుడు, ఆ పదిమంది ఆ ఇద్దరు సోదరుల విషయంలో ఆగ్రహించారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: ఆ మాట విన్నప్పుడు
  rationale: తెలుగులో సహజంగా ఉండేలా, ముందరి సందర్భంలో చెప్పబడిన అభ్యర్థనే వారు విన్నారని సూచిస్తుంది; గ్రీకు మూలంలో కర్మ స్పష్టంగా లేకపోవడం వల్ల దానిని విపులంగా వివరించలేదు.
- source_word: ἠγανάκτησαν
  choice: ఆగ్రహించారు
  rationale: తీవ్రమైన అసంతృప్తి, కోపం అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: περὶ τῶν δύο ἀδελφῶν
  choice: ఆ ఇద్దరు సోదరుల విషయంలో
  rationale: περί యొక్క ‘గురించి/విషయంలో’ భావాన్ని కాపాడుతూ, నేరుగా ‘వారిపై’ అని మార్చి సంబంధాన్ని అతిగా నిర్ధారించదు.
