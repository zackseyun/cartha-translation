id: MAT.20.33
reference: Matthew 20:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Κύριε, ἵνα ⸂ἀνοιγῶσιν οἱ ὀφθαλμοὶ ἡμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/033.yaml
  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: te
  text: 'వారు ఆయనతో ఇలా అన్నారు: “ప్రభువా[a], మా కళ్లు తెరవబడాలి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయ్యా, మా కళ్లు తెరవబడాలి.”
    reason: κύριε అనే పదానికి ఈ సందర్భంలో ‘ప్రభువా’తో పాటు సాధారణ గౌరవ సంబోధన అయిన ‘అయ్యా’ అనే అర్థం కూడా సాధ్యం.
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: వారు ఆయనతో … అన్నారు
  rationale: గ్రీకు చారిత్రక వర్తమానాన్ని తెలుగు కథనశైలికి సహజమైన భూతకాలంలో ఇచ్చి, αὐτῷను ‘ఆయనతో’గా వ్యక్తం చేశాం.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριος సంబోధనలో గౌరవాన్ని, యేసు అధికారాన్ని గుర్తించే సాధ్యమైన భావాన్ని నిలుపుతుంది; సందర్భానుసారం ‘అయ్యా’ అనే భావమూ సాధ్యమే.
- source_word: ἵνα ἀνοιγῶσιν
  choice: తెరవబడాలి
  rationale: ἵναతో కూడిన నిష్క్రియార్థక విధ్యర్థక క్రియ ఇక్కడ వారి కోరికలోని విషయాన్ని తెలియజేస్తుంది; తెలుగు అభ్యర్థనా సందర్భంలో ‘తెరవబడాలి’ సహజంగా ఉండి నిష్క్రియ భావాన్ని నిలుపుతుంది.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: మా కళ్ళు
  rationale: స్వామ్యార్థక ἡμῶνను సహజ తెలుగులో ‘మా’గా, ὀφθαλμοίను ‘కళ్ళు’గా అనువదించాం.
theological_decisions:
- issue: యేసును ఉద్దేశించిన Κύριε సంబోధన
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ‘ప్రభువా’ గౌరవం మరియు అధికార సూచనను నిలుపుతుంది; అయితే ఈ సంబోధన ఒక్కటే పూర్తి క్రీస్తుతాత్త్విక ప్రకటనను నిర్బంధించదు. సాధారణ గౌరవ సంబోధనగా ‘అయ్యా’ కూడా భాషాపరంగా సాధ్యమని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథనశైలి. గ్రీకు నిష్క్రియ నిర్మాణాన్ని నిలుపుతూ అభ్యర్థనను సహజంగా వ్యక్తం చేశాం.
