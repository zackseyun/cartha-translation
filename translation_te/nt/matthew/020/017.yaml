  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: te
  text: 'యేసు యెరూషలేముకు పైకి వెళ్తుండగా, పన్నెండు మంది శిష్యులను ప్రత్యేకంగా పక్కకు తీసుకొని, దారిలో వారితో ఇలా అన్నాడు:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: వెళ్తూ
  rationale: యెరూషలేముకు ప్రయాణించడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది. గ్రీకులోని పైకి వెళ్లే దిశాభావం తెలుగులో నగరానికి వెళ్లడాన్ని సూచించే సాధారణ ప్రయోగంలో తప్పనిసరిగా విడిగా చెప్పనవసరం లేదు.
- source_word: εἰς Ἱεροσόλυμα
  choice: యెరూషలేముకు
  rationale: గమ్యస్థానాన్ని తెలుగులో సహజమైన చతుర్థీ విభక్తితో వ్యక్తపరుస్తుంది; స్థలనామానికి సంప్రదాయబద్ధమైన తెలుగు రూపం వాడబడింది.
- source_word: παρέλαβεν
  choice: పక్కకు తీసుకొని
  rationale: క్రియలోని ‘తనతో తీసుకోవడం’ భావాన్ని κατ’ ἰδίαν సూచించే వేరుపాటు భావంతో కలిపి సహజంగా అందిస్తుంది.
- source_word: τοὺς δώδεκα μαθητὰς
  choice: పన్నెండు మంది శిష్యులను
  rationale: మూలంలో ఉన్న సంఖ్యను, μαθητάς అనే నామవాచకాన్ని రెండింటినీ స్పష్టంగా నిలుపుతుంది; ‘శిష్యులు’ సువార్తల సందర్భంలో స్థిరమైన, అర్థవంతమైన పదం.
- source_word: κατ’ ἰδίαν
  choice: ప్రత్యేకంగా
  rationale: ఇతరుల నుండి వేరుగా, వ్యక్తిగతంగా మాట్లాడేందుకు తీసుకెళ్లిన భావాన్ని ‘పక్కకు’తో కలిసి తెలియజేస్తుంది.
- source_word: ἐν τῇ ὁδῷ
  choice: దారిలో
  rationale: ప్రయాణ సందర్భాన్ని సంక్షిప్తంగా, సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: εἶπεν αὐτοῖς
  choice: వారితో ఇలా అన్నాడు
  rationale: λέγω యొక్క సాధారణ మాటలాడే భావాన్ని నిలుపుతూ, తరువాతి వచనంలో వచ్చే ప్రత్యక్ష వాక్యానికి సహజంగా దారి తీస్తుంది.
