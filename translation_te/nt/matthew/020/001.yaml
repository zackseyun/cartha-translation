revisions:
- from: ఎందుకంటే పరలోక రాజ్యం, తన ద్రాక్షతోటలో పని చేయడానికి కూలివారిని నియమించుకోవాలని తెల్లవారగానే బయలుదేరిన ఒక ఇంటి యజమానితో సమానంగా ఉంది.
  to: ఎందుకంటే పరలోక రాజ్యం ఒక మనిషితో, అంటే తెల్లవారగానే తన ద్రాక్షతోటకు కూలివారిని నియమించుకోవడానికి బయలుదేరిన ఇంటి యజమానితో, సమానంగా ఉంది.
