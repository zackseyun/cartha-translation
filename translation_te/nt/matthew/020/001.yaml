id: MAT.20.1
reference: Matthew 20:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: te
  text: ఎందుకంటే పరలోక రాజ్యం ఒక మనిషితో, అంటే తెల్లవారగానే తన ద్రాక్షతోటకు కూలివారిని నియమించుకోవడానికి బయలుదేరిన ఇంటి యజమానితో, సమానంగా ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి సువార్తలోని స్థిరమైన భావవ్యక్తీకరణను సహజమైన ఆధునిక తెలుగు రూపంలో అందిస్తుంది.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: ఒక ఇంటి యజమానితో
  rationale: ἀνθρώπῳ అనిర్దిష్ట వ్యక్తిని సూచిస్తుంది; οἰκοδεσπότῃ అతని పాత్రను స్పష్టం చేస్తుంది. తెలుగులో ‘ఒక ఇంటి యజమాని’ రెండింటినీ సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἅμα πρωῒ
  choice: తెల్లవారగానే
  rationale: చాలా పొద్దున్నే, ఉదయం ఆరంభంలోనే అనే కాలభావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μισθώσασθαι ἐργάτας
  choice: కూలివారిని నియమించుకోవాలని
  rationale: వేతనానికి పనివారిని తీసుకోవడం అనే సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἀμπελῶνα
  choice: ద్రాక్షతోట
  rationale: మూలపదానికి నేరమైన, సాధారణ తెలుగు సమానార్థకం.
theological_decisions:
- issue: ఉపమాన సంబంధం
  choice: పరలోక రాజ్యం ... ఒక ఇంటి యజమానితో సమానంగా ఉంది
  alternative: పరలోక రాజ్యం ... జరిగిన దానిలా ఉంది
  rationale: గ్రీకు వాక్యం వ్యాకరణరీత్యా రాజ్యాన్ని ఇంటి యజమానితో పోలుస్తుంది; కథ మొత్తంతో పోలికను విస్తరించి మూలంలోని నిర్మాణాన్ని మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మూలంలోని γάρ ను ‘ఎందుకంటే’గా ఉంచి ముందరి సందర్భంతో ఉన్న తార్కిక అనుసంధానాన్ని పరిరక్షించాం.
