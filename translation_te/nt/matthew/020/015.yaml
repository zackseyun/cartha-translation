source:
  edition: SBLGNT
  text: ⸀οὐκ ἔξεστίν μοι ⸂ὃ θέλω ποιῆσαι⸃ ἐν τοῖς ἐμοῖς; ⸀ἢ ὁ ὀφθαλμός σου πονηρός ἐστιν ὅτι ἐγὼ ἀγαθός εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/015.yaml
  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: te
  text: నా సొత్తుతో నాకు ఇష్టమైనది చేసుకునే హక్కు నాకు లేదా? లేదా, నేను మంచివాడిని కాబట్టి నీ కన్ను చెడ్డదా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నేను మంచివాడిని కాబట్టి నీవు అసూయపడుతున్నావా?” ఇక్కడ “నీ కన్ను చెడ్డది” అనే నుడికారం అసూయను లేదా ఇతరునికి మేలు జరగడాన్ని సహించలేని మనస్తత్వాన్ని సూచిస్తుంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: హక్కు నాకు లేదా
  rationale: అనుమతి లేదా న్యాయబద్ధమైన అధికారం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; యజమాని అడిగే అలంకారిక ప్రశ్నలోని హక్కు భావాన్ని నిలుపుతుంది.
- source_word: ὃ θέλω ποιῆσαι
  choice: నాకు ఇష్టమైనది చేసే
  rationale: θέλω సూచించే వ్యక్తిగత సంకల్పాన్ని సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τοῖς ἐμοῖς
  choice: నా సొత్తుతో
  rationale: తనకు చెందిన ఆస్తి లేదా ధనం అనే భావాన్ని ఉపమానంలోని ఆర్థిక సందర్భానికి తగిన విధంగా స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: నీ కన్ను చెడ్డదా
  rationale: అసూయను లేదా ఇతరునికి మేలు జరగడాన్ని సహించలేని భావాన్ని సూచించే మూలభాషా రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; దాని భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: ἀγαθός
  choice: మంచివాడిని
  rationale: ἀγαθός అనే పదానికి నేరమైన అర్థమైన ‘మంచి’ని నిలుపుతుంది; సందర్భంలో దాతృత్వం అంతర్లీనంగా ఉన్నప్పటికీ దానిని ప్రధాన పాఠ్యంలోనే నిర్దిష్టంగా వ్యాఖ్యానించదు.
theological_decisions:
- issue: ὁ ὀφθαλμός σου πονηρός అనే నుడికారాన్ని ప్రధాన పాఠ్యంలో వ్యాఖ్యానించాలా లేదా రూపకంగా నిలుపాలా
  choice: ‘నీ కన్ను చెడ్డదా’ అనే మూల రూపకాన్ని నిలుపడం
  alternative: ‘నీవు అసూయపడుతున్నావా’ లేదా ‘నేను ఉదారుణ్ణి కాబట్టి నీవు అసహనపడుతున్నావా’
  rationale: యజమాని మంచితనానికీ పనివాని ‘చెడ్డ కన్ను’కూ మధ్య ఉన్న మూలపాఠ్య వ్యత్యాసాన్ని, దానిలోని వ్యాఖ్యానాత్మక ఉద్రిక్తతను ఇది కాపాడుతుంది. అర్థం పాఠకునికి అందేందుకు పాదసూచికలో సాధ్యమైన భావాన్ని ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘హక్కు’ అనే పదం ἔξεστίν లోని అనుమతి/న్యాయబద్ధ అధికారం భావాన్ని సులభంగా తెలియజేస్తుంది. మూలంలోని ఏకవచన ‘కన్ను’ రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపి, దాని నుడికారార్థాన్ని పాదసూచికలో వివరించాం.
