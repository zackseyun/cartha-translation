id: MAT.20.19
reference: Matthew 20:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: te
  text: వారు ఆయనను అపహాస్యం చేయడానికి, కొరడాలతో కొట్టడానికి, సిలువ వేయడానికి యూదేతరుల చేతికి అప్పగిస్తారు. మూడవ రోజున ఆయన లేపబడతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన లేస్తారు.” గ్రీకు క్రియ కర్మణి రూపంలో ఉంది (“ఆయన లేపబడతారు”); పునరుత్థానాన్ని సూచించే ఈ సాధారణ ప్రయోగం దేవుని కార్యాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: అప్పగిస్తారు
  rationale: మరొకరి అధికారానికి లేదా అదుపుకు అప్పగించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ద్రోహం చేస్తారు’ అనే మరింత నిర్దిష్ట భావాన్ని అనవసరంగా చేర్చదు.
- source_word: τοῖς ἔθνεσιν
  choice: యూదేతరులకు
  rationale: ఈ యూదా నేపథ్యంలోని శ్రమల ముందస్తు ప్రకటనలో ఇది సాధారణంగా ‘దేశాలు’ అని కాక, యూదులు కానివారిని—ప్రత్యేకంగా వారి అధికారులను—సూచిస్తుంది.
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: అపహాస్యం చేయడానికి
  rationale: εἰς తో కూడిన క్రియానామ రూపం ఉద్దేశం లేదా ఫలితాన్ని తెలియజేస్తుంది; ఈ ఎంపిక ఎగతాళి చేసి అవమానించే భావాన్ని గౌరవప్రదమైన ఆధునిక భాషలో అందిస్తుంది.
- source_word: μαστιγῶσαι
  choice: కొరడాలతో కొట్టడానికి
  rationale: న్యాయశిక్షగా కొరడా దెబ్బలు కొట్టడాన్ని స్పష్టంగా, సామాన్య పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: σταυρῶσαι
  choice: సిలువ వేయడానికి
  rationale: క్రియ యొక్క ప్రత్యక్ష అర్థమైన సిలువ మరణశిక్ష విధించడాన్ని సహజమైన తెలుగు వాడుకలో వ్యక్తం చేస్తుంది; ఉమ్మడి కర్మ ‘ఆయనను’ మొదటనే ఉండటం వల్ల మళ్లీ చేర్చాల్సిన అవసరం లేదు.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: మూడవ రోజున
  rationale: కాలాన్ని సూచించే దత్తివాచక పదబంధానికి సహజమైన తెలుగు రూపం.
- source_word: ἐγερθήσεται
  choice: ఆయన లేపబడతారు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతుంది. పునరుత్థాన సందర్భంలో దేవుని కార్యాన్ని సూచించగల భావాన్ని కాపాడుతూ, కర్తను వాక్యంలో స్పష్టంగా పేర్కొనదు.
theological_decisions:
- issue: పునరుత్థాన క్రియ యొక్క వాచ్యం
  choice: ఆయన లేపబడతారు
  alternative: ఆయన లేస్తారు
  rationale: గ్రీకు మూలంలో భవిష్యత్ కర్మణి రూపం ఉంది. దానిని కర్మణి రూపంగానే అనువదించడం దేవుని కార్యాన్ని సూచించగల సూక్ష్మార్థాన్ని కాపాడుతుంది; అదే సమయంలో ఇతర సందర్భాల్లో క్రీస్తు స్వీయ కార్యసామర్థ్యాన్ని నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, గౌరవప్రదమైన బైబిలు శైలిని పాటించింది. వరుసగా ఉన్న మూడు క్రియలకూ మొదట ఉన్న ‘ఆయనను’ ఉమ్మడి కర్మగా సహజంగా వర్తించేలా నిర్మాణం ఉంచబడింది.
