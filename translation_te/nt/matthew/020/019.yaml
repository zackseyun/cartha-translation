revisions:
- from: ఆయనను అపహాస్యం చేయడానికి, కొరడాలతో కొట్టడానికి, సిలువ వేయడానికి యూదేతరులకు అప్పగిస్తారు. మూడవ రోజున ఆయన లేపబడతారు.[a]
  to: వారు ఆయనను అపహాస్యం చేయడానికి, కొరడాలతో కొట్టడానికి, సిలువ వేయడానికి యూదేతరుల చేతికి అప్పగిస్తారు. మూడవ రోజున ఆయన లేపబడతారు.[a]
  rationale: The revision preserves the Greek syntax and meaning while improving independent readability in Telugu. Most importantly, the footnote marker has been moved to the resurrection verb that it explains. No doctrinal inference beyond the Greek passive has been introduced.
