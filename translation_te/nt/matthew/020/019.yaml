review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the handover, the reference to non-Jewish people/authorities, the three coordinated purposes, and the temporal phrase. It appropriately retains the future passive force of ἐγερθήσεται in “ఆయన లేపబడతారు.”
  naturalness: The Telugu is generally clear and modern. Adding “వారు” preserves the explicit Greek finite subject more transparently in this verse when read independently. “యూదేతరుల చేతికి” is a more idiomatic Telugu expression for handing someone over into others’ custody.
  terminology: “అపహాస్యం చేయడానికి,” “కొరడాలతో కొట్టడానికి,” and “సిలువ వేయడానికి” are suitable modern-standard renderings. “లేపబడతారు” preserves the resurrection passive without specifying the implied agent. The alternative “లేస్తారు” is appropriately identified as an alternative rather than substituted into the text.
  issues:
  - severity: medium
    issue: Footnote marker is attached to “సిలువ వేయడానికి,” although the footnote discusses the resurrection verb “లేపబడతారు.”
    rationale: A footnote anchor should immediately follow the word or phrase it explains. The present placement can wrongly imply that the note concerns crucifixion.
  - severity: low
    issue: The explicit Greek subject of “παραδώσουσιν” is not represented in the Telugu verse as a standalone reading unit.
    rationale: Telugu permits omission of the subject, but “వారు” improves clarity and reflects the source without adding meaning.
  revised_text: వారు ఆయనను అపహాస్యం చేయడానికి, కొరడాలతో కొట్టడానికి, సిలువ వేయడానికి యూదేతరుల చేతికి అప్పగిస్తారు. మూడవ రోజున ఆయన లేపబడతారు.[a]
