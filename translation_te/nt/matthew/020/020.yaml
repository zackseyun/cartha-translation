id: MAT.20.20
reference: Matthew 20:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: te
  text: అప్పుడు జెబెదయి కుమారుల తల్లి తన కుమారులతో కలిసి ఆయన దగ్గరికి వచ్చి, ఆయనకు సాగిలపడి[a], ఆయన దగ్గర ఏదో కోరుతూ ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయనను ఆరాధిస్తూ.” గ్రీకు క్రియ సందర్భాన్ని బట్టి గౌరవంతో సాగిలపడటం, ప్రణామం చేయటం, లేదా ఆరాధించటం అనే అర్థాలను ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: సంఘటనల క్రమంలో తదుపరి ఘటనను పరిచయం చేసే సహజమైన కాలసూచక పదం.
- source_word: προσῆλθεν αὐτῷ
  choice: ఆయన దగ్గరికి వచ్చి
  rationale: ప్రసέρχομαι ఒకరి వద్దకు రావడం లేదా సమీపించడాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం కదలికను సహజంగా తెలియజేస్తుంది.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: జెబెదయి కుమారుల తల్లి
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: తన కుమారులతో కలిసి
  rationale: μετά సహవాసాన్ని సూచిస్తుంది; కర్తను తిరిగి సూచించేందుకు ‘తన’ సహజమైన తెలుగు ప్రయోగం.
- source_word: προσκυνοῦσα
  choice: ఆయనకు సాగిలపడి
  rationale: προσκυνέωలో సాష్టాంగపడటం, భక్తిపూర్వకంగా వంగటం, ఆరాధించటం వంటి భావపరిధి ఉంది. సందర్భంలో విన్నపానికి ముందు చేసిన గౌరవభావపు శారీరక చర్యను ఈ రూపం చూపుతుంది; బలమైన ‘ఆరాధిస్తూ’ భావాన్ని ప్రధాన పాఠ్యంలో నిర్బంధించదు.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: ఆయనను ఏదో అడిగింది
  rationale: αἰτέω అడగడం లేదా అభ్యర్థించడాన్ని, τι నిర్దిష్టంగా చెప్పని ‘ఏదో’ విషయాన్ని సూచిస్తాయి. సహజ తెలుగులో వ్యక్తిని ‘ఆయనను’ అని కర్మగా ఉంచి భావాన్ని అందించింది.
theological_decisions:
- issue: యేసుకు సంబంధించి προσκυνοῦσα పదాన్ని అనువదించడం
  choice: ఆయనకు సాగిలపడి
  alternative: ఆయనను ఆరాధిస్తూ
  rationale: ఈ క్రియ గౌరవంతో సాగిలపడటం లేదా ఆరాధించటం రెండింటినీ సందర్భానుసారంగా సూచించగలదు. ప్రధాన పాఠ్యం శారీరక-గౌరవార్థాన్ని ఉంచి, ఆరాధన అనే సాధ్యమైన భావాన్ని పాదసూచికలో నిలుపుతుంది; తద్వారా వచనం స్వయంగా పరిష్కరించని దైవశాస్త్ర సంబంధ ఉద్వేగాన్ని అనువాదం ముందుగానే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘సాగిలపడి’ సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి మూలపదంలోని శారీరక గౌరవచర్యను నిలుపుతుంది.
