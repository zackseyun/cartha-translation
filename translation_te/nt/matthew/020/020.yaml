revisions:
- from: అప్పుడు జెబెదయి కుమారుల తల్లి తన కుమారులతో కలిసి ఆయన దగ్గరికి వచ్చి, ఆయనకు సాగిలపడి[a], ఆయనను ఏదో అడిగింది.
  to: అప్పుడు జెబెదయి కుమారుల తల్లి తన కుమారులతో కలిసి ఆయన దగ్గరికి వచ్చి, ఆయనకు సాగిలపడి[a], ఆయన దగ్గర ఏదో కోరుతూ ఉంది.
  rationale: The revision changes only the petition clause so that it denotes requesting an unspecified thing from Jesus, rather than merely asking Jesus something. It also uses a participial-continuative Telugu construction to reflect the two Greek participles accompanying her approach. The reverential ambiguity of προσκυνοῦσα and its footnote are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:55Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal sequence, the identity and accompaniment of Zebedee’s sons’ mother, and her reverential posture. However, “ఆయనను ఏదో అడిగింది” changes the Greek construction αἰτοῦσά τι παρ’ αὐτοῦ (‘asking/requesting something from him’) into asking him a question. “ఆయన దగ్గర ఏదో కోరుతూ” better retains both the requested object and its source.
  naturalness: The narrative is clear and natural in modern standard Telugu. Revising the final participial phrase to “ఆయన దగ్గర ఏదో కోరుతూ” is idiomatic and better matches the ongoing accompanying action expressed in Greek.
  terminology: “సాగిలపడి” suitably represents προσκυνοῦσα without deciding between homage and worship. The footnote appropriately preserves the lexical possibility of ‘worshiping.’
  issues:
  - severity: medium
    issue: The phrase “ఆయనను ఏదో అడిగింది” does not clearly express that she was requesting something from him.
    rationale: Greek αἰτέω with τι and παρά + genitive refers to requesting some unspecified thing from a person. In Telugu, “ఎవరినైనా అడగడం” can mean questioning that person; “ఆయన దగ్గర ఏదో కోరుతూ” preserves the request and the ‘from him’ relation.
  revised_text: అప్పుడు జెబెదయి కుమారుల తల్లి తన కుమారులతో కలిసి ఆయన దగ్గరికి వచ్చి, ఆయనకు సాగిలపడి[a], ఆయన దగ్గర ఏదో కోరుతూ ఉంది.
  revised_footnotes:
