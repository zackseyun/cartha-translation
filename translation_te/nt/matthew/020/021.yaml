source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: te
  text: ఆయన ఆమెతో, “నీకు ఏమి కావాలి?” అన్నాడు. ఆమె ఆయనతో, “నా ఈ ఇద్దరు కుమారులు, ఒకడు నీ కుడివైపున, మరొకడు నీ ఎడమవైపున, నీ రాజ్యంలో కూర్చునేలా చెప్పు[a]” అంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలభాషలో అక్షరార్థంగా “చెప్పు”; సందర్భానుసారం దీనిని “ఆజ్ఞాపించు” లేదా “అనుగ్రహించు” అని కూడా అర్థం చేసుకోవచ్చు, అయితే గ్రీకు క్రియ సాధారణంగా “చెప్పు” అనే అర్థమే ఇస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “రాజ్యం” అనే పదాన్ని “పరిపాలన” లేదా “రాజాధికారం” అనే భావంలో కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: నీకు ఏమి కావాలి?
  rationale: θέλω ఇక్కడ ఆమె ఏ అభ్యర్థన చేయదలచిందో నేరుగా అడుగుతుంది. ఈ తెలుగు రూపం సహజంగా, స్పష్టంగా అదే భావాన్ని తెలియజేస్తుంది.
- source_word: Εἰπὲ
  choice: ఆజ్ఞాపించు
  rationale: λέγω అనే క్రియకు అక్షరార్థంగా ‘చెప్పు’ అని అర్థం. అయితే ἵνα ఉపవాక్యంతో కూడిన ఈ అభ్యర్థన సందర్భంలో, కోరిన స్థానాలను నిర్ణయిస్తూ చెప్పమనే భావాన్ని సహజ తెలుగులో ‘ఆజ్ఞాపించు’ తెలియజేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: ἵνα καθίσωσιν
  choice: కూర్చునేలా
  rationale: ఈ ἵνα ఉపవాక్యం అభ్యర్థనలోని విషయాన్ని తెలియజేస్తుంది. ‘కూర్చునేలా’ అనేది అనుమతి లేదా నియామకాన్ని అతిగా వివరించకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: నా ఈ ఇద్దరు కుమారుల్లో
  rationale: οὗτοι అనే సూచనను ‘ఈ’తో, μου అనే వ్యక్తిగత సంబంధాన్ని ‘నా’తో నిలుపుతుంది. తరువాతి ‘ఒకడు... మరొకడు’ నిర్మాణానికి ‘ఇద్దరు కుమారుల్లో’ సహజంగా అనుసంధానమవుతుంది.
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: ఒకడు నీ కుడివైపున, మరొకడు నీ ఎడమవైపున
  rationale: రెండు గ్రీకు స్థానవాచక పదబంధాల సమాంతరతను సహజమైన తెలుగులో నిలుపుతుంది; ఇవి గౌరవ స్థానాలను సూచించినప్పటికీ అనువాదం వాటిని ముందుగానే వివరిస్తూ విస్తరించదు.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: నీ రాజ్యంలో
  rationale: βασιλεία రాజ్యం, పరిపాలన లేదా రాజాధికారం అనే భావాలను కలిగి ఉండవచ్చు. ఈ సందర్భంలో ‘నీ రాజ్యంలో’ సహజంగా ఉండి రాజసంబంధ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యేసు రాజ్యంలో కోరిన కూర్చునే స్థానాల స్వభావం
  choice: ‘నీ రాజ్యంలో’ కుడి, ఎడమ వైపుల కూర్చునే గౌరవ స్థానాల కోసం చేసిన అభ్యర్థనగా స్థలాత్మక, రాజసంబంధ భాషను నిలుపడం
  alternative: దీనిని ప్రత్యేకంగా భౌతిక మెస్సీయ రాజ్యంగా లేదా అంతిమ పరలోక రాజ్యంగా నిర్వచించడం
  rationale: గ్రీకు పాఠ్యం రాజ్యం ఏ దశలో ఉందో పేర్కొనదు. కాబట్టి అనువాదం ఏ ప్రత్యేక అంత్యకాల పద్ధతినీ దిగుమతి చేయకుండా ఆ ఉద్దేశపూర్వక విస్తృతతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. యేసును సూచించేందుకు ‘ఆయన’ వాడబడింది; గ్రీకులోని ఏకవచన ద్వితీయ పురుష సంబోధనను ‘నీ’తో నిలుపుతూ మూలపాఠ్యపు నేరుతనాన్ని కాపాడాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
