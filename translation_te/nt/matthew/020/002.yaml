id: MAT.20.2
reference: Matthew 20:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: te
  text: అతడు పనివారితో రోజుకు ఒక దేనారము[a] చొప్పున ఒప్పందం చేసుకొని, వారిని తన ద్రాక్షతోటలోకి పంపాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: దేనారము సాధారణంగా ఒక కూలీకి ఒక రోజు పనికి ఇచ్చే వేతనం.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: ఒప్పందం చేసుకొని
  rationale: ప్రధాన క్రియకు ముందు జరిగిన అంగీకారాన్ని సూచించే భూతకాల కృదంతాన్ని సహజమైన తెలుగు క్రమంలో వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది స్వల్ప కథన సంధానక పదం; తెలుగు వాక్య ప్రవాహంలో కృదంత నిర్మాణమే సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐργατῶν
  choice: పనివారితో
  rationale: ద్రాక్షతోటలో కూలిపని చేయడానికి నియమించబడిన వారిని ఆధునిక, సాధారణ తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: ἐκ δηναρίου
  choice: ఒక దేనారము చొప్పున
  rationale: ఒప్పుకున్న వేతన పరిమాణాన్ని తెలియజేస్తూ, ప్రాచీన నాణెం పేరును ఆధునిక విలువతో భర్తీ చేయకుండా నిలుపుతుంది.
- source_word: τὴν ἡμέραν
  choice: ఆ రోజుకు
  rationale: ఆ రోజు పనికి నిర్ణయించిన వేతనం అనే కాలవ్యాప్తి భావాన్ని, ‘రోజంతా’ అని మూలానికి మించి నిర్దిష్టం చేయకుండా వ్యక్తపరుస్తుంది.
- source_word: ἀπέστειλεν
  choice: పంపాడు
  rationale: కథన సందర్భంలోని సాధారణ పంపడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀμπελῶνα
  choice: ద్రాక్షతోటలోకి
  rationale: మూలపదానికి ప్రామాణికమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: αὐτοῦ
  choice: తన
  rationale: కర్తయైన యజమానికే ద్రాక్షతోట చెందుతుందని తెలుగులో సహజమైన ఆత్మవాచక స్వామ్యరూపంతో తెలియజేస్తుంది.
