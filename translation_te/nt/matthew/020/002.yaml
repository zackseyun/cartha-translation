  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ప్రాచీన నాణెం పేరును నిలిపి, దాని సాంస్కృతిక అర్థాన్ని పాదసూచికలో వివరించాం.
