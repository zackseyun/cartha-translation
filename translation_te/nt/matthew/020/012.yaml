id: MAT.20.12
reference: Matthew 20:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: te
  text: 'వారు ఇలా అన్నారు: “చివరగా వచ్చిన వీరు ఒక్క గంట పని చేశారు. అయినా, పగటి భారాన్ని, మండే ఎండను భరించిన మాతో వారిని సమానులుగా చేశావు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారిని మాతో సమానంగా చూశావు.”
    reason: ἴσους ... ἐποίησας అనే నిర్మాణాన్ని ‘సమానులుగా చేశావు’ అని నేరుగా లేదా ‘సమానంగా చూశావు’ అని వ్యవహారార్థకంగా అనువదించవచ్చు.
lexical_decisions:
- source_word: λέγοντες
  choice: వారు ఇలా అన్నారు
  rationale: గ్రీకులో ఇది ముందున్న వాక్యంతో అనుసంధానమైన వర్తమాన కృదంతం. తెలుగులో సహజమైన కథన ప్రవాహం కోసం సమాపక క్రియగా అనువదించబడింది.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: చివరగా వచ్చిన వీరు
  rationale: ఉపమానంలో చివరగా పనికి తీసుకోబడినవారిని సూచించే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: μίαν ὥραν ἐποίησαν
  choice: ఒక్క గంట పని చేశారు
  rationale: కాలవ్యవధితో వాడిన ποιέω ఇక్కడ ఆ సమయం పనిచేయడాన్ని సూచిస్తుంది; ఈ రూపం తెలుగులో సహజంగా ఉంది.
- source_word: ἴσους ... ἐποίησας
  choice: మాతో వారిని సమానం చేశావు
  rationale: వారిని తమతో సమాన స్థితిలో ఉంచాడనే ఫిర్యాదును నేరుగా నిలుపుతుంది; సమాన వేతనం అనే భావాన్ని పాఠ్యంలో అదనంగా చేర్చదు.
- source_word: τοῖς βαστάσασι
  choice: భరించిన
  rationale: శారీరక భారాన్ని మోయడం, కష్టాన్ని సహించడం అనే రెండు భావఛాయలనూ సందర్భానుసారంగా కలిగి ఉంది.
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: పగటి భారాన్ని
  rationale: పూర్తి రోజు చేసిన కఠిన శ్రమను సూచించే ‘భారం’ అనే మూల రూపకాన్ని నిలుపుతుంది.
- source_word: τὸν καύσωνα
  choice: మండే ఎండను
  rationale: καύσων సూచించే తీవ్రమైన, కాల్చివేసే వేడిని సాధారణ ఆధునిక తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: న్యాయం, సమానత్వం గురించి పనివారి ఫిర్యాదు
  choice: పనివారి నిరసనను వారి మాటలుగానే నేరుగా అనువదించడం
  alternative: యజమాని తమకు అన్యాయం చేశాడని వివరణాత్మకంగా చెప్పడం
  rationale: ఈ వచనం ఉపమానంలోని పనివారి ఫిర్యాదును నివేదిస్తుంది. దేవుని న్యాయం గురించిన విస్తృత తాత్త్విక అంశాన్ని అనువాదంలో ముందుగానే పరిష్కరించకుండా, మూలంలోని ఉద్వేగం మరియు భావసందిగ్ధత నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. ‘పగటి భారం’ అనే మూల రూపకాన్ని, ‘మండే ఎండ’ అనే తీవ్రతను నిలుపుకుంది.
