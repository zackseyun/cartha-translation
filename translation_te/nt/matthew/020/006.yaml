source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ⸀ἑνδεκάτην ἐξελθὼν εὗρεν ἄλλους ⸀ἑστῶτας, καὶ λέγει αὐτοῖς· Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: te
  text: దాదాపు పదకొండవ గంట సమయంలో[a] అతడు బయటికి వెళ్లి, అక్కడ నిలబడి ఉన్న మరికొందరిని కనుగొన్నాడు. అతడు వారితో, “రోజంతా మీరు ఇక్కడ పనిలేక ఎందుకు నిలబడి ఉన్నారు?” అని అంటాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “దాదాపు పదకొండవ గంట సమయంలో.” పగటి గంటల లెక్క ప్రకారం ఇది సుమారు సాయంత్రం ఐదు గంటల సమయం.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా, “అన్నాడు.” గ్రీకు మూలంలో కథనాన్ని సజీవంగా చెప్పే చారిత్రక వర్తమాన కాలం వాడబడింది: “అంటాడు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: రోజులో దాదాపు పదకొండవ గంటకు
  rationale: περί + ద్వితీయా విభక్తి సుమారు సమయాన్ని సూచిస్తుంది. ‘రోజులో పదకొండవ గంట’ అనే రూపం ఉపమానంలోని ప్రాచీన దినగణనను నిలుపుతుంది.
- source_word: ἐξελθὼν
  choice: అతడు బయటికి వెళ్లి
  rationale: అసమాపక క్రియ ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను సూచిస్తుంది; తెలుగులో ‘వెళ్లి’ సహజంగా ఆ క్రమాన్ని తెలియజేస్తుంది.
- source_word: εὗρεν
  choice: చూశాడు
  rationale: ఈ సందర్భంలో εὑρίσκω అంటే అక్కడ ఉన్నవారిని కనుగొనడం లేదా గమనించడం. ‘చూశాడు’ సహజమైన తెలుగు కథన రూపం.
- source_word: ἄλλους ἑστῶτας
  choice: నిలబడి ఉన్న మరికొందరిని
  rationale: ἄλλους నామవాచకంగా ‘మరికొందరు’ అని, ἑστῶτας కొనసాగుతున్న నిలబడిన స్థితిగా అనువదించబడింది; మూలంలో లేని లింగాన్ని చేర్చలేదు.
- source_word: καὶ λέγει αὐτοῖς
  choice: వారితో … అని అంటాడు
  rationale: λέγει వర్తమానకాలంలో ఉన్న చారిత్రక వర్తమానం. కథనంలోని సజీవతను నిలుపుటకు వర్తమాన రూపం ఉంచబడింది.
- source_word: Τί ὧδε ἑστήκατε
  choice: ఎందుకు … ఇక్కడ … నిలబడి ఉన్నారు?
  rationale: ప్రశ్నలో Τί సహజంగా ‘ఎందుకు’ అనే భావం ఇస్తుంది. ἑστήκατε యొక్క కొనసాగుతున్న స్థితిని ‘నిలబడి ఉన్నారు’ తెలియజేస్తుంది.
- source_word: ὅλην τὴν ἡμέραν ἀργοί
  choice: రోజంతా … పనేమీ చేయకుండా
  rationale: కాలవ్యాప్తిని ‘రోజంతా’ తెలియజేస్తుంది. ἀργοί ఇక్కడ పని చేయని లేదా క్రియారహిత స్థితిని సూచిస్తుంది; ఆధునిక సామాజిక-ఆర్థిక భావమున్న ‘నిరుద్యోగులు’ అనే పదాన్ని నివారించాం.
