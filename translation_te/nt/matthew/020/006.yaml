translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ప్రాచీన కాలసూచనను ప్రధాన పాఠ్యంలో నిలిపి, దాని సుమారు ఆధునిక సమయాన్ని పాదటిప్పణిలో వివరించాం. మూలంలోని చారిత్రక వర్తమానాన్ని ఉద్దేశపూర్వకంగా నిలిపాం.
