id: MAT.20.32
reference: Matthew 20:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: te
  text: యేసు ఆగి, వారిని పిలిచి, “నేను మీకోసం ఏమి చేయాలని మీరు కోరుకుంటున్నారు?” అన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: ఆగి
  rationale: ἵστημι యొక్క భూతకాల కృదంత రూపం ఇక్కడ యేసు తన నడకను నిలిపాడనే కథనార్థాన్ని ఇస్తుంది; ‘ఆగి’ సహజమైన ఆధునిక తెలుగు.
- source_word: ἐφώνησεν
  choice: పిలిచి
  rationale: φωνέω ఇక్కడ వారిని తన దగ్గరకు లేదా తన దృష్టికి పిలవడాన్ని సూచిస్తుంది; ‘పిలిచి’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: αὐτοὺς
  choice: వారిని
  rationale: ముందటి సందర్భంలోని ఇద్దరు గుడ్డివారిని సూచించే బహువచన సర్వనామం.
- source_word: Τί θέλετε
  choice: ఏమి ... కోరుకుంటున్నారు
  rationale: ప్రశ్నార్థక సర్వనామం మరియు θέλω యొక్క సంకల్పం/కోరిక భావాన్ని మర్యాదపూర్వకమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: ποιήσω ὑμῖν
  choice: నేను మీకు ... చేయాలని
  rationale: θέλετε తరువాతి భూతకాల సంభావనార్థక రూపం వారు యేసు ఏమి చేయాలని కోరుతున్నారో తెలియజేస్తుంది; ὑμῖν ఇక్కడ ప్రయోజనార్థక దత్తివిభక్తిగా ‘మీకు’ అని సహజంగా అనువదించబడింది.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: వ్యక్తినామాన్ని ప్రామాణిక తెలుగు రూపంలో ఇచ్చాం; గ్రీకు నిర్దిష్ట ఉపపదాన్ని విడిగా సూచించాల్సిన అవసరం లేదు.
theological_decisions:
- issue: యేసు ప్రశ్న యొక్క స్వరం, భావబలం
  choice: “నేను మీకు ఏమి చేయాలని మీరు కోరుకుంటున్నారు?” అనే నేరమైన, వ్యక్తిగత ఆహ్వాన ప్రశ్న
  alternative: “నేను మీకు ఏమి చేయాలని మీరు ఆశిస్తున్నారు?”
  rationale: మూలపాఠం యేసు వారితో నేరుగా మాట్లాడుతున్నాడని చూపుతుంది. ‘కోరుకుంటున్నారు’ θέλω యొక్క కోరిక/ఇష్టం భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది; ప్రశ్నకు అదనపు సిద్ధాంతార్థాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సహజమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. మూలంలోని కృదంత-ప్రధానక్రియ క్రమాన్ని ‘ఆగి, ... పిలిచి’గా నిలిపి, εἶπεν ను తెలుగులో ప్రశ్నకు సహజమైన ‘అని అడిగాడు’గా వ్యక్తపరిచాం.
