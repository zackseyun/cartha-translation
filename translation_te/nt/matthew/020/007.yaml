- from: వారు అతనితో, “ఎవరూ మమ్మల్ని పనికి పెట్టుకోలేదు కాబట్టి” అన్నారు. అతడు వారితో, “మీరు కూడా ద్రాక్షతోటలోకి వెళ్లండి” అన్నాడు.
  to: 'వారు అతనితో ఇలా అన్నారు: “ఎందుకంటే ఎవరూ మమ్మల్ని కూలికి పెట్టుకోలేదు.” అతడు వారితో ఇలా అన్నాడు: “మీరు కూడా ద్రాక్షతోటలోకి వెళ్లండి.”'
