id: MAT.20.7
reference: Matthew 20:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Ὅτι οὐδεὶς ἡμᾶς ἐμισθώσατο. λέγει αὐτοῖς· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ⸀ἀμπελῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: te
  text: 'వారు అతనితో ఇలా అన్నారు: “ఎందుకంటే ఎవరూ మమ్మల్ని కూలికి పెట్టుకోలేదు.” అతడు వారితో ఇలా అన్నాడు: “మీరు కూడా ద్రాక్షతోటలోకి వెళ్లండి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: అన్నారు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నా, తెలుగు కథన శైలిలో భూతకాలం సహజంగా ఉంటుంది.
- source_word: Ὅτι
  choice: కాబట్టి
  rationale: వారు అక్కడ నిలిచి ఉండటానికి గల కారణాన్ని తెలిపే సమాధానాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: οὐδεὶς
  choice: ఎవరూ
  rationale: నిరాకరణ క్రియతో కలిసి ‘no one’ అనే అర్థాన్ని ప్రామాణిక తెలుగులో స్పష్టంగా ఇస్తుంది.
- source_word: ἡμᾶς ἐμισθώσατο
  choice: మమ్మల్ని పనికి పెట్టుకోలేదు
  rationale: μισθόομαι ఇక్కడ కూలికి నియమించడం అనే భావం కలిగి ఉంది; ‘పనికి పెట్టుకోవడం’ సాధారణ పాఠకులకు సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: λέγει
  choice: అన్నాడు
  rationale: గ్రీకులోని చారిత్రక వర్తమానాన్ని తెలుగు కథన ప్రవాహానికి అనుగుణంగా భూతకాలంలో అందిస్తుంది.
- source_word: Ὑπάγετε
  choice: వెళ్లండి
  rationale: పని జరిగే స్థలానికి వెళ్లమనే ప్రత్యక్ష ఆజ్ఞను గౌరవార్థక బహువచనంలో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καὶ ὑμεῖς
  choice: మీరు కూడా
  rationale: ఇంతకుముందు పంపబడిన వారితో పాటు ఈ గుంపును కూడా చేర్చుతున్న ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἀμπελῶνα
  choice: ద్రాక్షతోట
  rationale: ‘vineyard’కు ప్రామాణికమైన, అందరికీ అర్థమయ్యే తెలుగు పదం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అదే సమయంలో గౌరవప్రదమైన కథన శైలి. గ్రీకు చారిత్రక వర్తమానాలు తెలుగు సహజ కథన ప్రవాహం కోసం భూతకాలంలో ఇవ్వబడ్డాయి.
