id: MAT.20.30
reference: Matthew 20:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: te
  text: ఇదిగో, దారి పక్కన కూర్చున్న ఇద్దరు గుడ్డివారు యేసు అటుగా వెళ్తున్నాడని విని, “ప్రభువా, దావీదు కుమారుడా, మమ్మల్ని కరుణించు!” అని కేకలు వేశారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో పాఠకుని దృష్టిని ఆకర్షించే సూచనార్థక బలాన్ని, మత్తయి వర్ణనలోని సజీవతను నిలుపుతుంది.
- source_word: δύο τυφλοὶ
  choice: ఇద్దరు గుడ్డివారు
  rationale: δύο సంఖ్యను స్పష్టంగా ఉంచుతూ, సందర్భంలోని ఇద్దరు పురుషులను సహజమైన ఆధునిక తెలుగు పదబంధంతో సూచిస్తుంది.
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: దారి పక్కన కూర్చున్న
  rationale: స్థలాన్నీ, కొనసాగుతున్న కూర్చున్న స్థితినీ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: యేసు అటుగా వెళ్తున్నాడని విని
  rationale: అయోరిస్ట్ కృదంతం ప్రధాన క్రియకు ముందున్న సందర్భాన్ని తెలుపుతుంది; παράγει ఇక్కడ వారి దగ్గరగా అటుగా వెళ్లడాన్ని సూచిస్తుంది.
- source_word: ἔκραξαν λέγοντες
  choice: అని కేకలు వేశారు
  rationale: κράζω యొక్క తీవ్రతను నిలుపుతుంది; λέγοντες తెలుగులో ప్రత్యక్ష వాక్యానంతర ‘అని’ ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: గౌరవపూర్వక ప్రత్యక్ష సంబోధనను, దావీదు కుమారుడు అనే బిరుదుతో కలిసి ఉన్న క్రీస్తుసంబంధమైన సాధ్యార్థాన్ని నిలుపుతుంది.
- source_word: ἐλέησον ἡμᾶς
  choice: మమ్మల్ని కనికరించు
  rationale: కరుణతో సహాయం చేయమనే ఆజ్ఞార్థక విజ్ఞప్తిని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: υἱὸς Δαυίδ
  choice: దావీదు కుమారుడా
  rationale: మత్తయిలోని స్థిరమైన మెస్సీయ బిరుదును వంశజుడు అనే వివరణగా విప్పకుండా యథాతథంగా నిలుపుతుంది; తెలుగులో ప్రత్యక్ష సంబోధనకు తగిన రూపం వాడబడింది.
theological_decisions:
- issue: యేసును ఉద్దేశించిన κύριος సంబోధన
  choice: ప్రభువా
  alternative: అయ్యా
  rationale: ‘అయ్యా’ సాధారణ గౌరవ సంబోధనగా మాత్రమే వినిపించవచ్చు. ‘దావీదు కుమారుడా’ అనే మెస్సీయ బిరుదుతో కూడిన సందర్భంలో ‘ప్రభువా’ మూలంలోని గౌరవాన్నీ, సాధ్యమైన క్రీస్తుసంబంధమైన బలాన్నీ అతిగా నిర్ధారించకుండా కాపాడుతుంది.
- issue: υἱὸς Δαυίδ యొక్క మెస్సీయ సంబంధమైన బలం
  choice: దావీదు కుమారుడా
  alternative: దావీదు వంశస్థుడా
  rationale: ‘వంశస్థుడు’ వంశావళి అర్థాన్ని స్పష్టం చేసినా, మత్తయిలో స్థిరపడిన బిరుదు రూపాన్ని పలుచన చేస్తుంది. అక్షరార్థ బిరుదు దాని రాజసంబంధమైన, మెస్సీయ సంబంధమైన ప్రతిధ్వనిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; కథనానికి తగిన సరళమైన కానీ గౌరవప్రదమైన శైలి. ‘ఇదిగో’ కొద్దిగా ఉన్నత శైలిగా వినిపించినా మూలంలోని దృష్టి ఆకర్షణను ఉద్దేశపూర్వకంగా నిలుపుతుంది. మూలంలో లేని వివరణను చేర్చలేదు.
