  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన కథనశైలి. మూలంలోని కాలసంబంధాన్ని స్పష్టపరుస్తూ, imperfect క్రియలోని ప్రారంభ/కొనసాగింపు సాధ్యతను పాదటిప్పణిలో నిలిపింది.
