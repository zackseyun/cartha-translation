  text: λαβόντες δὲ ἐγόγγυζον κατὰ τοῦ οἰκοδεσπότου
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/011.yaml
  text: And after receiving it[a], they began grumbling against the master of the house,
translation:
  language: te
  text: వారు దాన్ని తీసుకున్న తర్వాత[a], ఇంటి యజమానిపై సణుగుకోవడం మొదలుపెట్టారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు తీసుకున్న తర్వాత, భూమి యజమానిపై సణుగుతున్నారు.’ గ్రీకులో ‘తీసుకున్నారు’ అనే క్రియకు కర్మ అవ్యక్తంగా ఉంది; ‘సణుగుతున్నారు’ అనే అనువాదం కొనసాగుతున్న చర్యను తెలియజేస్తుంది.
    reason: λαβόντες లోని అవ్యక్త కర్మను, ἐγόγγυζον యొక్క కొనసాగుతున్న భావాన్ని, మరియు సందర్భానుసారమైన οἰκοδεσπότης కు ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: λαβόντες
  choice: దాన్ని తీసుకున్న తర్వాత
  rationale: అనంతర కాలాన్ని సూచించే aorist participle ప్రధాన క్రియకు ముందు జరిగిన చర్యను తెలియజేస్తుంది. గ్రీకులో కర్మ స్పష్టంగా లేకపోయినా, సందర్భంలోని దేనారాన్ని సూచిస్తూ సహజమైన తెలుగులో ‘దాన్ని’ చేర్చబడింది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానకంగా ఉంది. తెలుగు వాక్యప్రవాహంలో ‘తర్వాత’ ద్వారానే అనుసంధానం సహజంగా వ్యక్తమవుతుంది; అదనంగా ‘మరి’ లేదా ‘అయితే’ చేరిస్తే అవసరానికి మించిన వ్యత్యాస భావం రావచ్చు.
- source_word: ἐγόγγυζον
  choice: సణుగుకోవడం మొదలుపెట్టారు
  rationale: Imperfect రూపం కొనసాగుతున్న లేదా ప్రారంభమైన గత చర్యను సూచించగలదు. చెల్లింపు పొందిన తరువాత అసంతృప్తితో గొణిగిన భావాన్ని ‘సణుగుకోవడం మొదలుపెట్టారు’ సహజంగా తెలియజేస్తుంది.
- source_word: κατὰ
  choice: వ్యతిరేకంగా
  rationale: Genitiveతో κατά ఇక్కడ ఒక వ్యక్తిపైకి మళ్లిన ప్రతికూలత లేదా విరోధాన్ని సూచిస్తుంది.
- source_word: τοῦ οἰκοδεσπότου
  choice: ఇంటి యజమాని
  rationale: οἰκοδεσπότης ఇంటికి లేదా ఆస్తికి అధిపతిని సూచిస్తుంది. ‘ఇంటి యజమాని’ మూలపదంలోని గృహాధిపతి భావాన్ని కాపాడుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
