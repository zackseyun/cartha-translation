    issue: Less idiomatic construction for the target of grumbling
    rationale: ‘ఇంటి యజమానికి వ్యతిరేకంగా సణుగుకోవడం’ is understandable, but ‘ఇంటి యజమానిపై సణుగుకోవడం’ is the customary Telugu construction and still accurately renders κατά with the genitive.
  - severity: medium
    issue: Nonstandard word in footnote
    rationale: ‘భూయజమాని’ is not standard modern Telugu. Replacing it with ‘భూమి యజమాని’ preserves the intended contextual alternative and avoids an unnatural or unclear form.
