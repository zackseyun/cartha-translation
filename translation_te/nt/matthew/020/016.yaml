review_pass:
  verdict: revise
  source_fidelity: The reversal saying and future sense are accurately retained. However, అలాగే more commonly means “likewise/similarly” and is less apt for οὕτως as the inferential conclusion to the parable. కాబట్టి more clearly conveys “So.” The explicit coordination should also be retained in Telugu.
  naturalness: చివరివారు/మొదటివారు and the repeated అవుతారు construction are natural, concise modern-standard Telugu. Using కాబట్టి at the opening and మరియు for the second balanced clause produces a clearer proverbial formulation.
  terminology: The terms చివరివారు and మొదటివారు preserve the Greek ambiguity and rhetorical antithesis without importing a particular interpretation of status, reward, or salvation.
  issues:
  - severity: low
    issue: అలాగే is not the best contextual equivalent for οὕτως.
    rationale: Although it can sometimes introduce a comparison, it ordinarily suggests “likewise.” Here οὕτως concludes the preceding parable with an inferential “So/Therefore.”
  - severity: low
    issue: The footnote anchor is placed at the end although the noted alternative concerns the opening connective.
    rationale: Placing the marker immediately after కాబట్టి makes its lexical scope clear.
  - severity: low
    issue: The Greek καὶ is left unexpressed lexically.
    rationale: A comma can coordinate clauses in Telugu, but మరియు naturally preserves the explicit coordination and the antithetical parallelism.
  revised_text: కాబట్టి[a], చివరివారు మొదటివారవుతారు, మరియు మొదటివారు చివరివారవుతారు.
  revised_footnotes:
  - marker: a
    text: లేదా “ఈ విధంగా, చివరివారు మొదటివారవుతారు, మరియు మొదటివారు చివరివారవుతారు.”
