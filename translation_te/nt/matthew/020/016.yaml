  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: te
  text: కాబట్టి[a], చివరివారు మొదటివారవుతారు, మరియు మొదటివారు చివరివారవుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ విధంగా, చివరివారు మొదటివారవుతారు, మరియు మొదటివారు చివరివారవుతారు.”
    reason: οὕτως అనే పదానికి సందర్భానుసారమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: οὕτως
  choice: అలాగే
  rationale: ఉపమానం నుంచి వచ్చే ముగింపు అన్వయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు పదంలోని ఫలితార్థక/నిర్ణయార్థక బలాన్ని నిలుపుతుంది.
- source_word: ἔσονται
  choice: అవుతారు
  rationale: εἰμί యొక్క భవిష్యత్తు రూపాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ ἔσχατοι
  choice: చివరివారు
  rationale: విశేషణం నామవాచకంగా వాడబడిన గ్రీకు నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది; ‘అల్పులు’ అని అనువదిస్తే విలువ లేదా సామాజిక స్థితిని అనవసరంగా నిర్దిష్టం చేసినట్లవుతుంది.
- source_word: πρῶτοι
  choice: మొదటివారు
  rationale: వ్యతిరేక సమాంతర నిర్మాణాన్ని తెలుగులో స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: καὶ
  choice: —
  rationale: తెలుగు సమాంతర వాక్య నిర్మాణంలో అల్పవిరామంతో సాధారణ సమన్వయం సహజంగా వ్యక్తమవుతుంది; ‘కాని’ అనే గ్రీకులో లేని వ్యతిరేక బలాన్ని చేర్చలేదు.
- source_word: οἱ πρῶτοι
  choice: మొదటివారు
  rationale: ‘చివరివారు’కు సమాంతరంగా నామవాచకార్థంలో ఉన్న విశేషణాన్ని ప్రతిబింబిస్తుంది.
- source_word: ἔσχατοι
  choice: చివరివారు
  rationale: మొదటి భాగంలోని పదజాలాన్ని తిరగదోసే సూత్రవాక్య నిర్మాణాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఈ తారుమారు సూత్రవాక్యం సూచించే పరిధి
  choice: కాలక్రమం, సామాజిక స్థితి, ప్రతిఫలం లేదా రక్షణలో క్రమం అని నిర్దిష్టం చేయకుండా సంక్షిప్తమైన తారుమారు సూత్రవాక్యంగా అనువదించడం.
  alternative: దీనిని సామాజిక తారుమారుగా, శిష్యత్వపు ప్రతిఫలంలోని తారుమారుగా లేదా రక్షణ క్రమానికి సంబంధించిన ప్రకటనగా ప్రత్యేకంగా అర్థం చేసి అనువదించడం.
  rationale: గ్రీకు వాక్యం ‘చివరి/మొదటి’ అనే తారుమారును మాత్రమే చెబుతుంది; దాని పరిధిని అనువాదమే మరింత సంకుచితం చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన సూత్రవాక్య శైలి. గ్రీకు వాక్యంలోని సమాంతర తారుమారును నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉండే పదజాలం వాడబడింది.
