revisions:
- from: అలాగే, చివరివారు మొదటివారవుతారు, మొదటివారు చివరివారవుతారు.[a]
  to: కాబట్టి[a], చివరివారు మొదటివారవుతారు, మరియు మొదటివారు చివరివారవుతారు.
  rationale: The revision renders οὕτως as the parable’s inferential conclusion, preserves the future reversal formula, explicitly represents καὶ, and relocates the lexical footnote marker to the word it qualifies. It does not narrow the saying’s intended scope.
