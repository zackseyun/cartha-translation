id: MAT.20.22
reference: Matthew 20:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ μέλλω ⸀πίνειν; λέγουσιν αὐτῷ· Δυνάμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: te
  text: అయితే యేసు వారికి జవాబిస్తూ, “మీరు ఏమి అడుగుతున్నారో మీకు తెలియదు. నేను తాగబోయే పాత్రను[a] మీరు తాగగలరా?” అని అన్నాడు. వారు ఆయనతో, “తాగగలం” అన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, మరింత స్పష్టంగా, ‘నేను తాగబోయే బాధల పాత్రను.’ గ్రీకు మూలపాఠం ‘పాత్ర’ అనే రూపకాన్నే ఉంచుతుంది. బైబిలులో ఇది ఒకరికి నిర్ణయించబడిన వంతును, ముఖ్యంగా బాధను, సూచించే సాధారణ రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: అయితే యేసు వారికి జవాబిస్తూ ... అన్నాడు
  rationale: δέలోని స్వల్ప వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది. గ్రీకు జవాబు-చెప్పడం అనే ద్వంద్వ కథన సూత్రాన్ని సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో ప్రతిబింబించింది; సందర్భానుసారంగా ‘వారికి’ స్పష్టం చేయబడింది.
- source_word: Οὐκ οἴδατε τί αἰτεῖσθε
  choice: మీరు ఏమి అడుగుతున్నారో మీకు తెలియదు
  rationale: οἴδατε యొక్క ప్రాథమిక ‘తెలుసుకోవడం’ భావాన్ని నిలుపుతూ, αἰτεῖσθεను సహజంగా ‘అడుగుతున్నారు’ అనే భావంతో అనువదించింది.
- source_word: δύνασθε πιεῖν
  choice: మీరు తాగగలరా?
  rationale: సామర్థ్యాన్ని సూచించే δύνασθεను తెలుగులో సహజమైన ‘గలరా’ రూపంతో వ్యక్తం చేసింది.
- source_word: τὸ ποτήριον
  choice: పాత్రను
  rationale: గ్రీకులోని రూపకాన్ని బాధ అని విప్పి చెప్పకుండా నిలుపుతుంది. ‘పాత్ర’ బైబిలు భాషలో గంభీరమైనదిగా, విస్తృతార్థం కలిగినదిగా ఉంది.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: నేను తాగబోయే
  rationale: μέλλωలోని సమీప లేదా ఉద్దేశిత భవిష్యత్ భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λέγουσιν αὐτῷ· Δυνάμεθα
  choice: వారు ఆయనతో, ‘తాగగలం’ అన్నారు
  rationale: చారిత్రక వర్తమానాన్ని తెలుగు కథనానికి సహజమైన భూతకాలంతో అందించింది. ఒంటరిగా ‘గలం’ అనడం అసహజంగా ఉండేందున, ముందున్న క్రియను పునరుక్తి చేసి సామర్థ్య భావాన్ని నిలిపింది.
theological_decisions:
- issue: ‘పాత్ర’ అనే రూపకపు భావం
  choice: ప్రధాన పాఠ్యంలో ‘పాత్ర’ అనే రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: నేను అనుభవించబోయే బాధను / నేను తాగబోయే బాధల పాత్రను
  rationale: ఈ రూపకం యేసు ఎదుర్కోబోయే బాధను సూచించినా, గ్రీకు దానిని నేరుగా విప్పి చెప్పదు. ప్రధాన పాఠ్యంలో దాని బైబిలు ప్రతిధ్వని, ఉద్దేశపూర్వక విస్తృతార్థం నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘పాత్ర’ రూపకం నిలుపబడింది; దాని భావాన్ని పాదసూచిక వివరిస్తుంది. ‘తాగగలం’ అనే సమాధానం తెలుగులో స్పష్టతకోసం క్రియను పునరుక్తి చేస్తుంది.
