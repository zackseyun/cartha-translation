  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ ἀπῆλθον. ⸀πάλιν ἐξελθὼν περὶ ἕκτην καὶ ἐνάτην ὥραν ἐποίησεν ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: te
  text: వారు వెళ్లిపోయారు. అతడు మళ్లీ బయటికి వెళ్లి, దాదాపు ఆరవ, తొమ్మిదవ గంటల సమయంలో కూడా అలాగే చేశాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, యూదుల కాలగణన ప్రకారం మధ్యాహ్నం పన్నెండు గంటల సమయంలోను, మధ్యాహ్నం మూడు గంటల సమయంలోను.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: కాబట్టి వారు వెళ్లారు
  rationale: οἱ మునుపటి వచనంలో యజమాని మాట్లాడిన పనివారిని సూచిస్తుంది; δέ ఇక్కడ కథనాన్ని ముందుకు నడిపే సున్నితమైన అనుసంధానం, సందర్భంలో ‘కాబట్టి’ సహజంగా ఉంటుంది; ἀπῆλθονను ‘వెళ్లారు’ అని సరళంగా అనువదించాం.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: చర్య పునరావృతమైందని నేరుగా తెలియజేస్తుంది.
- source_word: ἐξελθὼν
  choice: బయటికి వెళ్లి
  rationale: అనంతరం జరిగిన ప్రధాన క్రియతో సహజంగా అనుసంధానమయ్యే గ్రీకు ఏఓరిస్ట్ కృదంతాన్ని తెలుగు క్రమసూచక క్రియారూపంతో వ్యక్తం చేస్తుంది; కాలసంబంధాన్ని అతిగా నిర్ధారించదు.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: దాదాపు ఆరవ గంటకూ తొమ్మిదవ గంటకూ
  rationale: περίలోని సుమారు అనే భావాన్ని ‘దాదాపు’ తెలియజేస్తుంది. మూల సంస్కృతిలోని యూదుల గంటల లెక్కను ప్రధాన పాఠ్యంలో నిలిపి, ఆధునిక సమయాలను పాదటిప్పణిలో వివరిస్తుంది.
- source_word: ἐποίησεν ὡσαύτως
  choice: అలాగే చేశాడు
  rationale: ποιέω యొక్క సాధారణ క్రియాభావాన్నీ, ὡσαύτως యొక్క ‘అదే విధంగా’ అనే పోలికనూ సహజమైన, సంక్షిప్తమైన తెలుగు ప్రయోగంలో కలిపి అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని గంటల లెక్కను పాఠ్యంలో నిలిపి, నేటి పాఠకునికి అర్థమయ్యే సమయాలను పాదటిప్పణిలో ఇచ్చాం.
