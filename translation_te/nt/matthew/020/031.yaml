id: MAT.20.31
reference: Matthew 20:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: te
  text: 'కానీ జనసమూహం వారిని మౌనంగా ఉండమని గద్దించింది. అయినా వారు మరింతగా[a] కేకలు వేశారు: “ప్రభువా, మాపై కనికరం చూపు, దావీదు కుమారుడా[b]!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరింత బిగ్గరగా.’ గ్రీకు తులనాత్మక పదం సాధారణంగా పెరిగిన తీవ్రతను (‘మరింతగా’) గానీ, ప్రత్యేకంగా పెరిగిన శబ్దాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘దావీదు కుమారుడు’ అనేది కేవలం వంశాన్ని తెలిపే మాట కాదు; అది మెస్సీయను సూచించే బిరుదు.
    reason: cultural_note
lexical_decisions:
- source_word: ὄχλος
  choice: జనసమూహం
  rationale: కథన సందర్భంలోని ‘గుంపు/సమూహం’ అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐπετίμησεν
  choice: గద్దించింది
  rationale: వారిని ఆపడానికి జనసమూహం చేసిన కఠిన మందలింపును తెలియజేస్తుంది; కేవలం హెచ్చరించింది అనే దానికంటే మూలపద బలాన్ని మెరుగుగా నిలుపుతుంది.
- source_word: ἵνα σιωπήσωσιν
  choice: మౌనంగా ఉండమని
  rationale: వారు మాట్లాడకుండా ఉండాలనే జనసమూహ ఉద్దేశాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μεῖζον
  choice: ఇంకా ఎక్కువగా
  rationale: గ్రీకు తులనాత్మక క్రియావిశేషణం అరుపు తీవ్రతను సాధారణంగా పెంచవచ్చు; దాన్ని తప్పనిసరిగా శబ్దస్థాయికే పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: ἔκραξαν
  choice: కేకలు వేస్తూ
  rationale: κράζωలోని బిగ్గరగా, అత్యవసరంగా మొరపెట్టుకునే భావాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: గౌరవపూర్వక సంబోధనతో పాటు సాధ్యమైన క్రీస్తుసంబంధమైన భావబరువును కూడా నిలుపుతుంది.
- source_word: ἐλέησον ἡμᾶς
  choice: మమ్మల్ని కనికరించు
  rationale: కరుణ చూపమనే ప్రత్యక్ష విన్నపాన్ని సహజమైన, గంభీరమైన తెలుగులో అందిస్తుంది.
- source_word: υἱὸς Δαυίδ
  choice: దావీదు కుమారుడా
  rationale: వంశసూచనను మాత్రమే కాక మత్తయి సువార్తలోని రాజసంబంధమైన మెస్సీయ బిరుదు ప్రతిధ్వనిని కూడా నిలుపుతుంది.
theological_decisions:
- issue: యేసుకు వర్తింపజేసిన υἱὸς Δαυίδ అనే మెస్సీయ బిరుదు
  choice: ప్రధాన పాఠ్యంలో ‘దావీదు కుమారుడా’ అని ఉంచడం
  alternative: దావీదు వంశస్థుడా
  rationale: ఇది కేవలం వంశావళి వివరణ కాదు; మత్తయిలో రాజసంబంధమైన మెస్సీయ బిరుదుగా పనిచేస్తుంది. అక్షరార్థానికి దగ్గరైన రూపం ఆ కథన, దైవశాస్త్ర బలాన్ని నిలుపుతుంది.
- issue: యేసును సంబోధించే Κύριε పదం
  choice: ప్రభువా
  alternative: గురువా / యజమానీ
  rationale: ‘ప్రభువా’ గౌరవ సంబోధనను, అలాగే సందర్భంలో ఉండగల క్రీస్తుసంబంధమైన భావాన్ని రెండింటినీ తెరిచి ఉంచుతుంది; మరింత సంకుచితమైన ప్రత్యామ్నాయాలు ఆ ఉద్వేగాన్ని తగ్గిస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరత కలిగిన కథన శైలిని ఉపయోగించాం. ‘ఇంకా ఎక్కువగా’ అనే రూపం మూలంలోని ఉద్దేశపూర్వక విస్తృతతను కాపాడుతుంది; ‘మరింత బిగ్గరగా’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఇచ్చాం. సంబోధనల సహజత్వం కోసం తెలుగు విభక్తి రూపాలు వాడబడ్డాయి.
