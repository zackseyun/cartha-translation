- from: కానీ జనసమూహం వారిని మౌనంగా ఉండమని గద్దించింది. అయినా వారు ఇంకా ఎక్కువగా[a] కేకలు వేస్తూ, “ప్రభువా, మమ్మల్ని కనికరించు, దావీదు కుమారుడా[b]!” అన్నారు.
