id: MAT.20.13
reference: Matthew 20:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: te
  text: 'అందుకు అతడు వారిలో ఒకనితో ఇలా అన్నాడు: “స్నేహితుడా, నేను నీకు అన్యాయం చేయడం లేదు.[a] నువ్వు ఒక దేనారానికి నాతో ఒప్పుకోలేదా?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను నీ పట్ల అన్యాయంగా ప్రవర్తించడం లేదు.”
    reason: lexical_alternative
  - marker: b
    text: దేనారం ఒక ప్రామాణిక రోమా వెండి నాణెం; సాధారణంగా అది ఒక కూలీకి ఒక రోజు వేతనంగా పరిగణించబడేది.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: అందుకు ... ఇలా అన్నాడు
  rationale: ఈ కృదంతం యజమాని ఇచ్చిన ప్రతిస్పందనను పరిచయం చేస్తుంది. గ్రీకు వాక్యనిర్మాణాన్ని కృత్రిమంగా అనుకరించకుండా, ఆధునిక తెలుగులో సహజంగా ప్రతిస్పందన భావాన్ని తెలియజేస్తుంది.
- source_word: ἑνὶ αὐτῶν
  choice: వారిలో ఒకనితో
  rationale: సమూహంలోని ఒక వ్యక్తిని ఉద్దేశించి మాట్లాడాడనే దత్తివ ఏకవచన, భాగార్థక షష్ఠీ నిర్మాణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἑταῖρε
  choice: స్నేహితుడా
  rationale: సంబోధనను సహజమైన ఆధునిక తెలుగులో అందిస్తుంది. సందర్భంలో ఇది సన్నిహిత ఆప్యాయతకన్నా అదుపుతో కూడిన, కొంత దూరాన్ని సూచించే సంబోధనగా కూడా వినిపించవచ్చు; ఆ స్వరాన్ని మరీ నిర్దిష్టంగా చేయలేదు.
- source_word: οὐκ ἀδικῶ σε
  choice: నేను నీకు అన్యాయం చేయడం లేదు
  rationale: ἀδικέω యొక్క ‘ఒకరి పట్ల అన్యాయంగా ప్రవర్తించు/అన్యాయం చేయు’ అనే అర్థాన్ని, σε అనే వ్యక్తిగత కర్మను, వర్తమానకాల భావాన్ని నిలుపుతుంది.
- source_word: οὐχὶ
  choice: ఒప్పుకోలేదా?
  rationale: అవుననే సమాధానాన్ని ఆశించే అలంకారప్రశ్న స్వభావాన్ని తెలుగు ప్రతికూల ప్రశ్న సహజంగా తెలియజేస్తుంది.
- source_word: δηναρίου
  choice: ఒక దేనారానికి
  rationale: ధరను సూచించే షష్ఠీ ప్రయోగాన్ని ప్రతిబింబిస్తూ, చారిత్రక నాణెం పేరును సాధారణ ‘నాణెం’ లేదా వ్యాఖ్యానాత్మక ‘ఒక రోజు కూలి’గా మార్చకుండా నిలుపుతుంది.
- source_word: συνεφώνησάς μοι
  choice: నాతో ఒప్పుకోలేదా
  rationale: ముందుగా కుదిరిన వేతన అంగీకారాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంభాషణ శైలిని ఉపయోగించాం. ‘దేనారం’ అనే చారిత్రక నాణెం పేరును మూలపాఠానికి అనుగుణంగా ఉంచి, దాని సాంస్కృతిక విలువను పాదటిప్పణిలో వివరించాం.
