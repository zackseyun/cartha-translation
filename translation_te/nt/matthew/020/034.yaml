source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: te
  text: అప్పుడు యేసు కనికరపడి వారి కళ్లను తాకాడు. వెంటనే వారు చూపు పొందారు[a], ఆయనను అనుసరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మళ్లీ చూడగలిగారు.” గ్రీకు క్రియకు ‘చూపు తిరిగి పొందడం’ అనే అర్థం రావచ్చు; మరింత అక్షరార్థంగా అది ‘పైకి చూడడం’ అని కూడా అర్థమివ్వగలదు. అయితే ఈ సందర్భంలో అది చూపు పొందడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: కనికరపడి
  rationale: ఈ కృదంతం లోతైన కనికరాన్ని సూచిస్తుంది. ‘కనికరపడి’ అనేది ఆ భావోద్వేగ బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: అప్పుడు
  rationale: ఇక్కడ δέ కథనాన్ని ముందుకు నడిపించే స్వల్ప అనుసంధాన పదం. ‘అప్పుడు’ సందర్భంలోని చర్యల క్రమాన్ని సహజంగా వ్యక్తం చేస్తుంది; వ్యతిరేకతను అనవసరంగా సూచించదు.
- source_word: ἥψατο
  choice: తాకాడు
  rationale: ఈ స్వస్థపరిచే సందర్భంలో ἅπτομαι శారీరకంగా తాకడాన్ని సూచిస్తుంది.
- source_word: τῶν ὀμμάτων αὐτῶν
  choice: వారి కళ్లను
  rationale: ἅπτομαι తరువాత గ్రీకులో షష్ఠీ విభక్తి వచ్చినా, తెలుగులో సహజంగా ప్రత్యక్ష కర్మ రూపంలో ‘వారి కళ్లను’ అని చెప్పాలి.
- source_word: εὐθέως
  choice: వెంటనే
  rationale: యేసు తాకిన వెంటనే ఫలితం కలిగిందనే తక్షణత్వాన్ని ఈ పదం స్పష్టంగా నిలుపుతుంది.
- source_word: ἀνέβλεψαν
  choice: చూపు పొందారు
  rationale: స్వస్థపరిచే ఈ సందర్భంలో ἀναβλέπω చూపు పొందడం లేదా తిరిగి పొందడం అనే అర్థమిస్తుంది. వారు ఇంతకు ముందు చూడగలిగేవారో లేదో వచనం స్పష్టంగా చెప్పనందున, ‘చూపు పొందారు’ అనేది అనవసరమైన ఊహను చేర్చకుండా అర్థాన్ని తెలియజేస్తుంది.
- source_word: ἠκολούθησαν αὐτῷ
  choice: ఆయనను వెంబడించారు
  rationale: ఇది యేసు వెంట వెళ్లారనే ప్రత్యక్ష అర్థాన్ని సహజంగా తెలియజేస్తుంది; శిష్యత్వపు ప్రతిధ్వని ఉండవచ్చుగానీ, దాని స్వరూపం లేదా కాలవ్యవధిని అనువాదం అదనంగా నిర్వచించదు.
theological_decisions:
- issue: ἀνέβλεψαν సూచించే స్వస్థత స్వభావం
  choice: వారు వెంటనే చూపు పొందారు
  alternative: వారు మళ్లీ చూశారు; వారు పైకి చూశారు
  rationale: అద్భుత స్వస్థత సందర్భంలో εὐθέωςతో కూడిన ἀνέβλεψαν నిజమైన, తక్షణ దృష్టి ప్రాప్తిని సూచిస్తుంది. అయితే ‘తిరిగి’ అనే భావం వారి పూర్వస్థితి గురించి అవసరానికి మించిన నిర్ణయం కావచ్చు కాబట్టి ప్రధాన పాఠ్యంలో దాన్ని చేర్చలేదు.
- issue: ἠκολούθησαν αὐτῷ యొక్క భావ పరిధి
  choice: ఆయనను వెంబడించారు
  alternative: ఆయన శిష్యులయ్యారు
  rationale: వారు యేసును అనుసరించారని మూలపాఠ్యం చెబుతుంది. అది శిష్యత్వాన్ని సూచించవచ్చుగానీ, వారు అధికారికంగా లేదా శాశ్వతంగా శిష్యులయ్యారని ఈ వచనం స్పష్టంగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. చిన్న వాక్యాలు అద్భుతం జరిగిన తక్షణత్వాన్ని స్పష్టంగా ఉంచుతాయి. మూలపాఠ్యంలోని అర్థానికి మించి శిష్యత్వాన్ని నిర్వచించలేదు.
