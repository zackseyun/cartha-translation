revisions:
- from: అప్పుడు యేసు కనికరపడి వారి కళ్లను తాకాడు. వెంటనే వారు చూపు పొందారు[a]; ఆయనను వెంబడించారు.
  to: అప్పుడు యేసు కనికరపడి వారి కళ్లను తాకాడు. వెంటనే వారు చూపు పొందారు[a], ఆయనను అనుసరించారు.
  rationale: The revision replaces the potentially hostile-sounding ‘వెంబడించారు’ with the standard and source-faithful ‘అనుసరించారు,’ and adjusts punctuation to reflect the Greek coordination. The lexical-alternative footnote remains correctly anchored and preserves the relevant semantic range without making the alternative the main reading.
