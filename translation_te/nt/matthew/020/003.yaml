source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: te
  text: అతడు దాదాపు మూడో గంట సమయంలో[a] బయటికి వెళ్లి, సంతలో ఏ పనీ లేకుండా[b] నిలబడి ఉన్న మరికొందరిని చూశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఉదయం దాదాపు తొమ్మిది గంటల సమయంలో.’ ‘మూడో గంట’ అనే మాట సూర్యోదయం నుంచి పగటి గంటలను లెక్కించే యూదుల పద్ధతిని ప్రతిబింబిస్తుంది.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘పని లేనివారిగా.’ గ్రీకు పదం వారు ఆ సమయంలో పని చేయడం లేదని వర్ణిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: బయటికి వెళ్లి
  rationale: అయోరిస్ట్ కృదంతం సూచించే ముందరి చర్యను తెలుగులో సహజమైన క్రమబద్ధ క్రియారూపంతో వ్యక్తపరుస్తుంది.
- source_word: περὶ τρίτην ὥραν
  choice: దాదాపు మూడో గంట సమయంలో
  rationale: మూలంలోని యూదుల కాలగణన పదబంధాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, περὶ యొక్క సుమారు భావాన్ని ‘దాదాపు’తో తెలియజేస్తుంది.
- source_word: εἶδεν
  choice: చూశాడు
  rationale: ὁράω యొక్క సాధారణ కథనార్థాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: ἄλλους
  choice: మరికొందరిని
  rationale: గ్రీకులో విశేషణం నామవాచకంగా వాడబడింది; లింగాన్ని అదనంగా చేర్చకుండా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἑστῶτας
  choice: నిలబడి ఉన్న
  rationale: పర్ఫెక్ట్ కృదంతంలోని స్థితి భావాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
- source_word: ἀγορᾷ
  choice: సంతలో
  rationale: ప్రజలు వ్యాపారం కోసం, దినకూలీలు పని కోసం కూడే బహిరంగ మార్కెట్ ప్రదేశాన్ని సాధారణ ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἀργούς
  choice: ఏ పనీ లేకుండా
  rationale: వారు ఆ సమయంలో పనిచేయకుండా ఉన్న స్థితిని తెలియజేస్తుంది; సోమరితనం లేదా ఆధునిక ఆర్థిక వర్గీకరణను అనవసరంగా ఆపాదించదు.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి వాడబడింది. మూలంలోని కాలవ్యక్తీకరణను ప్రధాన పాఠ్యంలో నిలిపి, దాని ఆధునిక సమానార్థాన్ని పాదటిప్పణిలో ఇచ్చాం; ἀργούς పదాన్ని సోమరితనంగా లేదా ఆధునిక ‘నిరుద్యోగం’ అనే వర్గంగా నిర్ణయించకుండా అనువదించాం.
