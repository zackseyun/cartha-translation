id: MAT.20.25
reference: Matthew 20:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: te
  text: 'అయితే యేసు వారిని తన దగ్గరికి పిలిచి ఇలా అన్నాడు: “అన్యజనాల[a] పాలకులు వారిపై పెత్తనం చేస్తారనీ, వారిలో గొప్పవారు[b] వారిపై అధికారం చెలాయిస్తారనీ మీకు తెలుసు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జనాల” లేదా “దేశాల.”
    reason: ἐθνῶν అనే పదానికి ‘అన్యజనాలు’తో పాటు ‘జనాలు/దేశాలు’ అనే అర్థం కూడా సాధ్యమే.
  - marker: b
    text: లేదా “ప్రముఖులు” లేదా “ఉన్నతాధికారులు.”
    reason: οἱ μεγάλοι సామాజికంగా గొప్పవారిని, ప్రముఖులను లేదా ఉన్నత హోదాలో ఉన్నవారిని సూచించవచ్చు.
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: వారిని తన దగ్గరికి పిలిచి
  rationale: మధ్యమ ప్రయోగంలోని ‘తనవద్దకు పిలుచుకోవడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Οἴδατε
  choice: మీకు తెలుసు
  rationale: రూపరీత్యా పరిపూర్ణ కాలమైనా వర్తమానార్థంలో ఉన్న οἶδαకు ఇది సహజమైన తెలుగు సమానం.
- source_word: ἄρχοντες
  choice: పాలకులు
  rationale: పరిపాలించే లేదా ఏలే వ్యక్తులను సూచించే విస్తృతమైన, స్పష్టమైన పదం.
- source_word: τῶν ἐθνῶν
  choice: అన్యజనాల
  rationale: యూదుల సందర్భంలో ἔθνη సాధారణంగా యూదేతర ప్రజలను సూచిస్తుంది; ‘అన్యజనాలు’ ఆ సందర్భభేదాన్ని నిలుపుతుంది.
- source_word: κατακυριεύουσιν
  choice: పెత్తనం చేస్తారు
  rationale: కేవలం పాలించడం కాకుండా ఆధిపత్య ధోరణితో అణచి ఏలడం అనే ప్రతికూల ఛాయను సహజంగా తెలియజేస్తుంది.
- source_word: οἱ μεγάλοι
  choice: వారిలో గొప్పవారు
  rationale: సామాజికంగా లేదా రాజకీయంగా ప్రముఖులైన వారిని సూచించే substantival adjective భావాన్ని నిలుపుతుంది; ‘వారిలో’ అనేది సందర్భస్పష్టత కోసం ఇచ్చింది.
- source_word: κατεξουσιάζουσιν
  choice: అధికారం చెలాయిస్తారు
  rationale: ఇతరులపై అధికారాన్ని ప్రయోగించడం అనే అర్థాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: αὐτῶν
  choice: వారిపై
  rationale: ఈ సర్వనామం ἐθνῶν ద్వారా సూచించబడిన ప్రజలనే అధికారానికి లోబడినవారిగా తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: యూదుల సందర్భంలోని ἐθνῶν అనువాదం
  choice: అన్యజనాలు
  alternative: దేశాలు / జనాలు
  rationale: ఇక్కడ యేసు తన శిష్యులకు యూదేతర పాలకులలో కనిపించే అధికార విధానాన్ని ఉదాహరణగా చూపుతున్నాడు. ‘అన్యజనాలు’ ఆ సందర్భాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: οἱ μεγάλοι లోని వ్యాకరణపరమైన పుంలింగ బహువచనం
  choice: గొప్పవారు
  alternative: ప్రముఖులు / ఉన్నతాధికారులు
  rationale: మూలంలోని సామాజిక-రాజకీయ ప్రాముఖ్యతను విస్తరించకుండా నిలుపుతూ, తెలుగులో సహజంగా వ్యక్తులను సూచిస్తుంది. అధికారిక హోదా అనే భావాన్ని ప్రధాన పాఠ్యంలో తప్పనిసరిగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘పెత్తనం చేస్తారు’ మొదటి క్రియలోని ప్రతికూల ఆధిపత్య ఛాయను నిలుపుతుంది; సమాంతర రెండో క్రియకు ‘అధికారం చెలాయిస్తారు’ అని ఇచ్చి మూలంలోని పదభేదాన్ని కాపాడాం. ప్రతి పాదటిప్పణి గుర్తు సంబంధిత పదబంధం వెంటనే ఉంచబడింది.
