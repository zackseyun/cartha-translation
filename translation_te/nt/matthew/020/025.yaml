  verdict: approve
  source_fidelity: The Telugu faithfully represents the participial introduction (“calling them to himself”), the present-sense “you know,” rulers of the Gentiles/nations, and both parallel verbs of domineering rule and exercising authority. “పెత్తనం చేస్తారు” suitably conveys the negative force of κατακυριεύουσιν, while “అధికారం చెలాయిస్తారు” accurately renders κατεξουσιάζουσιν without adding interpretation.
  naturalness: The wording is fluent modern standard Telugu with an appropriately respectful biblical register. The paired clauses and repeated “వారిపై” clearly preserve the Greek parallelism.
  terminology: “అన్యజనాల” appropriately retains the Jewish-contextual sense of τῶν ἐθνῶν, and footnote a preserves the viable broader alternatives. “గొప్పవారు” is a natural rendering of οἱ μεγάλοι; footnote b gives legitimate contextual alternatives without making an official rank part of the main text. Footnote markers are correctly anchored.
