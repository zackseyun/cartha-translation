id: MAT.20.8
reference: Matthew 20:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: te
  text: 'సాయంకాలమైనప్పుడు, ద్రాక్షతోట యజమాని తన నిర్వాహకునితో ఇలా అంటాడు: ‘పనివారిని పిలిచి, చివరివారితో మొదలుపెట్టి మొదటివారివరకు వారికి వారి కూలి చెల్లించు.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: ద్రాక్షతోట యజమాని
  rationale: సందర్భంలో κύριος అనేది తోటకు అధికారి లేదా యజమానిని సూచిస్తుంది; ఆధునిక తెలుగులో ‘యజమాని’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: తన పర్యవేక్షకునితో
  rationale: ἐπίτροπος ఇక్కడ యజమాని తరఫున పనులను నిర్వహించే బాధ్యుడిని సూచిస్తుంది; ‘పర్యవేక్షకుడు’ మూలార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా తెలియజేస్తుంది.
- source_word: ἀπόδος αὐτοῖς τὸν μισθόν
  choice: వారికి కూలి చెల్లించు
  rationale: μισθός పనికి ఇచ్చే జీతం లేదా కూలి; దినసరి ద్రాక్షతోట పనివారి సందర్భంలో ‘కూలి’ సహజమైన ఎంపిక.
- source_word: ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: చివర వచ్చినవారితో మొదలుపెట్టి మొదట వచ్చినవారి వరకు
  rationale: ‘చివరివారు/మొదటివారు’ అనే సంక్షిప్త రూపం సాధ్యమైనా, ఉపమానంలోని నియామక క్రమాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేయడానికి ‘వచ్చినవారు’ చేర్చబడింది.
- source_word: λέγει
  choice: అంటాడు
  rationale: గ్రీకు చారిత్రక వర్తమాన కాలాన్ని కాపాడుతూ, కథనానికి సజీవతనిచ్చే వర్తమాన రూపం వాడబడింది.
theological_decisions:
- issue: κύριος అనే పదానికి దైవసంబంధ బిరుదు భావం ఇవ్వాలా
  choice: యజమాని
  alternative: ప్రభువు
  rationale: ఈ ఉపమాన కథనం లోపల ఈ పదం ద్రాక్షతోట యజమానినే ప్రత్యక్షంగా సూచిస్తుంది; ‘ప్రభువు’ అని అనువదించడం అనవసరంగా దైవసంబంధ అర్థాన్ని ముందుకు తెచ్చే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని చారిత్రక వర్తమానమైన λέγειను ‘అంటాడు’గా నిలిపి, ఆజ్ఞార్థక వాక్యాలను నేరుగా ఉంచాం.
