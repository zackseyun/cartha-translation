revisions:
- from: సాయంకాలమైనప్పుడు, ద్రాక్షతోట యజమాని తన పర్యవేక్షకునితో, ‘పనివారిని పిలిచి, చివర వచ్చినవారితో మొదలుపెట్టి మొదట వచ్చినవారి వరకు వారికి కూలి చెల్లించు’ అని అంటాడు.
  to: 'సాయంకాలమైనప్పుడు, ద్రాక్షతోట యజమాని తన నిర్వాహకునితో ఇలా అంటాడు: ‘పనివారిని పిలిచి, చివరివారితో మొదలుపెట్టి మొదటివారివరకు వారికి వారి కూలి చెల్లించు.’'
  rationale: The revision removes the unstated ‘came’ qualification, uses a more semantically fitting term for the estate steward, and makes the speech introduction and wage-payment expression idiomatic in modern standard Telugu. The historical present of λέγει is retained as ‘అంటాడు.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:40:54Z'
review_pass:
  verdict: revise
  source_fidelity: The rendering accurately conveys the vineyard owner, his steward, the command to call the workers, and payment in reverse order. However, ‘చివర వచ్చినవారు/మొదట వచ్చినవారు’ adds the idea of arrival, which is inferred from the wider parable but is not stated in this verse’s Greek; the source simply says ‘the last’ and ‘the first.’
  naturalness: The revised wording is natural modern standard Telugu. ‘తన నిర్వాహకునితో ఇలా అంటాడు’ gives a smooth narrative frame, and ‘వారికి వారి కూలి’ is idiomatic Telugu while retaining the distributive sense of paying each worker.
  terminology: ‘ద్రాక్షతోట యజమాని’ appropriately renders ὁ κύριος τοῦ ἀμπελῶνος in this parable. ‘నిర్వాహకుడు’ is a suitable, natural rendering of ἐπίτροπος in the sense of a steward or estate manager. ‘కూలి’ fittingly represents μισθός in this day-labor context.
  issues:
  - severity: low
    issue: The draft specifies that the ‘last’ and ‘first’ workers were those who ‘came’ last and first.
    rationale: The Greek reads ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων, ‘from the last to the first,’ without an explicit verb of coming or hiring. Although the implication is supplied by the surrounding story, it should not be inserted here.
  - severity: low
    issue: ‘పర్యవేక్షకుడు’ can suggest only a supervisor.
    rationale: ἐπίτροπος more broadly denotes the owner’s steward or manager. ‘నిర్వాహకుడు’ better conveys this role in contemporary Telugu without over-specifying it.
  revised_text: 'సాయంకాలమైనప్పుడు, ద్రాక్షతోట యజమాని తన నిర్వాహకునితో ఇలా అంటాడు: ‘పనివారిని పిలిచి, చివరివారితో మొదలుపెట్టి మొదటివారివరకు వారికి వారి కూలి చెల్లించు.’'
  revised_footnotes: []
