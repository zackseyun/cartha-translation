id: MAT.20.23
reference: Matthew 20:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: te
  text: ఆయన వారితో, “నా గిన్నెను మీరు తప్పక తాగుతారు.[a] అయితే నా కుడివైపునా ఎడమవైపునా కూర్చునే స్థానాలను ఇవ్వడం నా వంతు కాదు;[b] అవి నా తండ్రిచేత ఎవరి కోసం సిద్ధం చేయబడ్డాయో వారికోసమే ఉన్నాయి” అని చెప్పాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘గిన్నె’ అనేది యేసుకు నిర్ణయించబడిన బాధను లేదా గమ్యాన్ని సూచించే రూపకం; ఆయన శిష్యులు కూడా దానిలో పాలుపంచుకుంటారు.
    reason: metaphor_explanation
  - marker: b
    text: అక్షరార్థంగా, “ఇవ్వడం నాది కాదు.”
    reason: literal_rendering
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: ఆయన వారితో ... అని చెప్పాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, ఆధునిక తెలుగు కథనశైలిలో భూతకాల రూపం సహజంగా ఉంటుంది.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: నా గిన్నెలోనిది మీరు తప్పక తాగుతారు
  rationale: ποτήριον అనే ‘గిన్నె’ రూపకాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఉండేందుకు ‘గిన్నెలోనిది తాగడం’ అని వాడాం. μὲν‌తో ప్రారంభమయ్యే నిశ్చయాత్మక వ్యత్యాసాన్ని ‘తప్పక’ తెలియజేస్తుంది.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: నా కుడివైపున, ఎడమవైపున కూర్చునే స్థానాలు
  rationale: యేసు పక్కన ఉన్న గౌరవస్థానాలను సూచించే సంబంధార్థాన్ని స్పష్టమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: ఇవ్వడం నా వంతు కాదు
  rationale: δοῦναι అనే ‘ఇవ్వడం’ భావాన్ని నిలుపుతూ, నిర్ణయాధికారం తన వంతు కాదనే మాటను అదనపు సిద్ధాంత వివరణ లేకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου
  choice: ఆ స్థానాలు ఎవరి కోసం నా తండ్రిచేత సిద్ధం చేయబడ్డాయో వారికే చెందుతాయి
  rationale: గ్రీకులోని సంక్షిప్త నిర్మాణాన్ని తెలుగులో పూర్తి వాక్యంగా చేస్తూ, సిద్ధపరచబడిన గౌరవస్థానాల భావాన్నీ, తండ్రిని కర్తగా చూపే కర్మణి ప్రయోగాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: ఆ స్థానాలను ఇవ్వడం ‘నా వంతు కాదు’ అని యేసు చెప్పడంలోని క్రీస్తు సంబంధిత ఉద్రిక్తత
  choice: ‘ఇవ్వడం నా వంతు కాదు’ అని నేరుగా అనువదించడం
  alternative: ‘తండ్రికి వేరుగా నేను ఇవ్వను’ వంటి వివరణాత్మక పదాలను చేర్చడం
  rationale: మూలపాఠంలోని మాటను తగ్గించకుండా, యేసు అధికారాన్ని సమర్థించేందుకు లేదా పరిమితం చేసేందుకు అనువాదకుడు అదనపు సిద్ధాంత వివరణను చేర్చకుండా పాఠంలోని ఉద్రిక్తతను యథాతథంగా ఉంచుతుంది.
- issue: ‘గిన్నె’ అనే రూపకం యొక్క అర్థం
  choice: ప్రధాన పాఠంలో రూపకాన్ని నిలిపి, పాదసూచికలో దాని సందర్భార్థాన్ని తెలియజేయడం
  alternative: ప్రధాన పాఠంలోనే ‘బాధలు’ అని విప్పి చెప్పడం
  rationale: యేసు ఉపయోగించిన రూపక చిత్రాన్ని కాపాడుతూ, సాధారణ పాఠకునికి దాని భావాన్ని గ్రహించే సహాయం అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘నా వంతు కాదు’ అనే సహజ ప్రయోగం మూలంలోని భావాన్ని నిలుపుతుంది; ‘గిన్నె’ రూపకం ప్రధాన పాఠంలోనే కాపాడబడింది.
