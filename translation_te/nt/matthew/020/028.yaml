id: MAT.20.28
reference: Matthew 20:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: te
  text: ఎలాగైతే మనుష్యకుమారుడు సేవ చేయించుకోవడానికి కాదు, సేవ చేయడానికి మరియు అనేకుల కొరకు విమోచన ధరగా తన ప్రాణాన్ని ఇవ్వడానికి వచ్చాడో, అలాగే మీరు ఉండాలి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ
  choice: అలాగే
  rationale: ముందటి బోధతో ఈ వాక్యాన్ని పోలిక ద్వారా అనుసంధానించే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: యేసు తన గురించి ఉపయోగించిన ఈ బిరుదుకు స్థిరపడిన తెలుగు రూపం; దానియేలు గ్రంథంతో ఉన్న ప్రతిధ్వనిని కూడా కాపాడుతుంది.
- source_word: οὐκ ἦλθεν
  choice: రాలేదు
  rationale: గ్రీకు భూతకాల క్రియను అదనపు స్థల లేదా కాల భావాలు చేర్చకుండా సరళంగా వ్యక్తపరుస్తుంది.
- source_word: διακονηθῆναι
  choice: సేవ చేయించుకోవడానికి
  rationale: కర్మణి భావాన్ని స్పష్టంగా ఉంచుతూ, మతపరమైన ప్రత్యేక పరిభాషకు బదులుగా సాధారణ ఆధునిక తెలుగు వాడుకను అనుసరిస్తుంది.
- source_word: ἀλλὰ διακονῆσαι
  choice: సేవ చేయడానికి
  rationale: ముందటి కర్మణి రూపంతో ఉన్న క్రియాత్మక వ్యత్యాసాన్ని అదే ‘సేవ’ పదంతో నిలుపుతుంది.
- source_word: καὶ δοῦναι
  choice: ఇవ్వడానికి
  rationale: ‘సేవ చేయడానికి’తో సమన్వయమైన క్రియారూపాన్ని నిలుపుతూ, మూలంలో లేని అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: తన ప్రాణాన్ని
  rationale: ఈ సందర్భంలో ψυχή అంటే మరణానికి అప్పగించబడే జీవితం; ‘ఆత్మ’ అని అనువదిస్తే కలిగే దేహాతీత అర్థాన్ని నివారిస్తుంది.
- source_word: λύτρον
  choice: విడుదల మూల్యంగా
  rationale: ఎవరినైనా విడిపించేందుకు చెల్లించే ధర అనే భావాన్ని స్పష్టంగా, ఆధునికంగా తెలుపుతుంది; అతిగా సాంకేతికమైన మతపరమైన పదజాలాన్ని నివారిస్తుంది.
- source_word: ἀντὶ πολλῶν
  choice: అనేకుల కోసం
  rationale: ప్రధాన పాఠంలో సహజమైన తెలుగు ప్రయోగాన్ని ఇస్తుంది. ἀντίలోని ప్రత్యామ్నాయ లేదా ప్రతినిధి భావాన్ని పాదసూచికలో మరింత స్పష్టంగా భద్రపరుస్తుంది.
theological_decisions:
- issue: విడుదల మూల్య వాక్యంలో ἀντί పదం యొక్క భావబలం
  choice: ప్రధాన పాఠంలో ‘అనేకుల కోసం’ అని సహజంగా అనువదించి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో స్పష్టపరచడం
  alternative: అనేకులకు బదులుగా
  rationale: ἀντί మార్పిడి లేదా ఒకరి స్థానంలో మరొకరు అనే భావాన్ని మోయగలదు. ప్రధాన పాఠంలోని సహజత్వాన్ని కాపాడుతూనే, యేసు మరణంలోని ప్రతినిధి లేదా ప్రత్యామ్నాయ భావాన్ని పాదసూచిక ద్వారా అణచివేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘సేవ చేయించుకోవడం/సేవ చేయడం’ అనే సమాంతర నిర్మాణం మూలంలోని వ్యత్యాసాన్ని నిలుపుతుంది. తెలుగు వాక్య సంపూర్ణత కోసం చివర ‘వచ్చాడు’ పునరుక్తమైంది; అది మూలంలోని ἦλθεν క్రియకు సహజమైన అన్వయం.
