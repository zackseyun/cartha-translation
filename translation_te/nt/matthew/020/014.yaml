  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: te
  text: “నీది తీసుకో, వెళ్లు. అయితే నీకు ఇచ్చినంతే ఈ చివరివాడికి కూడా ఇవ్వడం నా ఇష్టం.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἆρον
  choice: తీసుకొని
  rationale: αἴρω యొక్క ఆజ్ఞారూపం ఇక్కడ తనకు చెందినదాన్ని తీసుకెళ్లమనే భావంలో ఉంది; ‘తీసుకొని’ సహజమైన తెలుగులో ఆ ప్రత్యక్ష ఆజ్ఞను నిలుపుతుంది.
- source_word: τὸ σὸν
  choice: నీకు చెందింది
  rationale: మూలంలోని నపుంసక సుబstantive పదబంధం ‘నీది/నీకు చెందినది’ అని మాత్రమే చెబుతుంది. సందర్భం కూలి గురించి అయినా, ‘నీ కూలి’ అని స్పష్టీకరించకుండా మూలంలోని విస్తృతతను కాపాడుతుంది.
- source_word: ὕπαγε
  choice: వెళ్లు
  rationale: ఇది పంపివేసే ఆజ్ఞ. ‘వెళ్లు’ సంక్షిప్తంగా, సహజంగా ఉండి అనవసరమైన కఠిన స్వరాన్ని జోడించదు.
- source_word: θέλω δὲ
  choice: అయితే … నేను కోరుతున్నాను
  rationale: θέλω వక్త సంకల్పాన్ని తెలియజేస్తుంది; δέ స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది. ఈ పదప్రయోగం రెండింటినీ ఆధునిక గౌరవప్రద తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: ఈ చివరివాడికి
  rationale: ἐσχάτῳ అంటే ‘చివరివాడు.’ ఉపమానంలోని పురుష కూలీని సూచించే ఏకవచన పురుష రూపాన్ని ‘వాడికి’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: δοῦναι
  choice: ఇవ్వాలని
  rationale: δίδωμι యొక్క సాధారణ అర్థం ‘ఇవ్వడం.’ సందర్భం చెల్లింపు అయినప్పటికీ, ‘చెల్లించాలని’ అని మరింత నిర్దిష్టం చేయకుండా మూల పదం విస్తృతిని నిలుపుతుంది.
- source_word: ὡς καὶ σοί
  choice: నీకు ఇచ్చినట్టే … కూడా
  rationale: ὡς καὶ σοί సమానంగా ఇవ్వడాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘నీకు ఇచ్చినట్టే … కూడా’ ఆ పోలికను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఏకవచన పురుష వ్యక్తిని సూచించే రూపం
  choice: ఈ చివరివాడికి
  alternative: చివరగా వచ్చిన ఇతనికి
  rationale: గ్రీకు పాఠంలో వ్యక్తిగత పురుష కూలీని సూచించే ఏకవచన పురుష రూపాలు ఉన్నాయి. అందువల్ల లింగాన్ని తటస్థీకరించకుండా, సహజమైన తెలుగు పురుష సూచనను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో నేరుగా పలికే, గౌరవప్రదమైన శైలి. కూలి చెల్లింపు అనే సందర్భాన్ని గౌరవించినప్పటికీ, మూలంలో లేని ‘కూలి’ లేదా ‘చెల్లించు’ వంటి నిర్దిష్ట పదాలను ప్రధాన పాఠంలో చేర్చలేదు.
