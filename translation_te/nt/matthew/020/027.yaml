  terminology: ‘దాసుడు’ is a suitable primary rendering for δοῦλος in this context, conveying subordination more strongly than ‘సేవకుడు.’ The footnote responsibly provides ‘బానిస’ as an alternative and explains the lexical contrast with the preceding verse.
