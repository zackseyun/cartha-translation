  source_fidelity: 'The Telugu accurately represents all major Greek elements: the indefinite conditional sense of ὃς ἂν θέλῃ, communal sense of ἐν ὑμῖν, aspiration to highest standing in εἶναι πρῶτος, future/normative force of ἔσται, and the genitive relationship in ὑμῶν. ‘దాసుడు’ appropriately preserves the stronger force of δοῦλος in contrast with the preceding verse’s διάκονος.'
