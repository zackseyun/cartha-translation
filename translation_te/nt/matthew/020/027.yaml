id: MAT.20.27
reference: Matthew 20:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν εἶναι πρῶτος ⸀ἔσται ὑμῶν δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your servant[a].
translation:
  language: te
  text: మీలో ఎవడు మొదటివాడిగా ఉండాలని కోరుకుంటాడో, వాడు మీ దాసుడిగా ఉంటాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాసుడు’కు ‘బానిస’ అని కూడా అనువదించవచ్చు. ఇక్కడి గ్రీకు పదం δοῦλος (దూలోస్); ఇది మునుపటి వచనంలోని ‘సేవకుడు’ అనే పదం కంటే బలమైనది, సాధారణంగా యజమానికి చెందిన బానిసను లేదా బంధిత సేవకుణ్ణి సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: ఎవడు … కోరుకుంటాడో
  rationale: ἄνతో కూడిన సంబంధవాచక సర్వనామం, subjunctive క్రియ కలిసి సాధారణమైన అనిర్దిష్ట షరతును సూచిస్తున్నాయి. ‘ఎవడు … కోరుకుంటాడో’ అనే రూపం తెలుగులో సహజంగా ఉండి సంకల్ప భావాన్ని నిలుపుతుంది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: సమాజంలో స్థానం లేదా హోదాను సూచించే ఈ సందర్భంలో ‘మీలో’ సహజమైన, సంక్షిప్తమైన అనువాదం.
- source_word: εἶναι πρῶτος
  choice: మొదటివాడిగా ఉండాలని
  rationale: πρῶτος ఇక్కడ క్రమంలో ముందుండడమే కాక అత్యున్నత స్థానం పొందాలనే ఆశను సూచిస్తుంది; ఈ రూపం మూలంలోని ‘ఉండడం’ భావాన్ని నిలుపుతుంది.
- source_word: ἔσται
  choice: ఉంటాడు
  rationale: భవిష్యత్ సూచక క్రియను నేరుగా భవిష్యత్ భావంతో అనువదించాం. సందర్భంలో ఉన్న నియమాత్మక బలాన్ని ‘తప్పక’ అని స్పష్టీకరించి మూలంలోని ఉద్వేగాన్ని తొలగించలేదు.
- source_word: ὑμῶν
  choice: మీ
  rationale: సంబంధాన్ని తెలిపే genitive రూపం; మొదటి స్థానం కోరేవాడు ఇతరులందరికీ లోబడి సేవ చేయాలనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: δοῦλος
  choice: దాసుడు
  rationale: మునుపటి వచనంలోని διάκονος కంటే δοῦλος బలమైన పదం; బంధితత్వం, యజమానికి లోబడిన స్థితి అనే తీవ్రతను ‘దాసుడు’ నిలుపుతుంది.
theological_decisions:
- issue: శిష్యత్వ ఉపదేశంలో δοῦλος అనువాదం
  choice: దాసుడు
  alternative: సేవకుడు
  rationale: యేసు సామాజిక ప్రాధాన్యాకాంక్షకు విరుద్ధంగా సంపూర్ణంగా లోబడి సేవచేసే స్థితిని చూపిస్తున్నాడు. ముందటి వచనంలోని సాధారణ సేవాపదం నుండి ఇక్కడ భాష మరింత తీవ్రంగా మారుతుంది; ‘సేవకుడు’ అని అనువదిస్తే ఆ ఉద్దేశపూర్వక తీవ్రత తగ్గిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘దాసుడు’ పాఠ్య గంభీరతను, δοῦλος పదంలోని బంధితత్వ తీవ్రతను రెండింటినీ నిలుపుతుంది; ‘బానిస’ ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
