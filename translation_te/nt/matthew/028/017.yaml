review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the temporal aorist participle ἰδόντες (“when they saw”), the reverential force of προσεκύνησαν (“worshiped”), the contrastive subset indicated by οἱ δέ (“but some”), and the ambiguity of ἐδίστασαν (“doubted”).
  naturalness: The meaning is clear, but placing the shared subject after the temporal clause makes the Telugu sentence flow more naturally and reduces the slightly repetitive opening “వారు ఆయనను... ఆయనను.”
  terminology: “ఆరాధించారు” is a defensible, natural rendering of προσκυνέω in this resurrection context. “సందేహించారు” preserves the main lexical sense of ἐδίστασαν; the footnote appropriately retains the nuance of hesitation or wavering without equating it with settled unbelief.
  issues:
  - severity: low
    issue: Word order in the opening clause is mildly repetitive.
    rationale: “వారు ఆయనను చూసినప్పుడు ఆయనను ఆరాధించారు” is understandable, but “ఆయనను చూసినప్పుడు, వారు ఆయనను ఆరాధించారు” is smoother modern standard Telugu while preserving the Greek participial temporal relationship.
  - severity: low
    issue: The footnote alternative “ఊగిసలాడారు” can sound physically literal without an explicit mental qualifier.
    rationale: Adding “మనసు ఊగిసలాడారు” makes the intended figurative sense of wavering clearer in Telugu.
  revised_text: ఆయనను చూసినప్పుడు, వారు ఆయనను ఆరాధించారు; అయితే కొందరు సందేహించారు.[a]
