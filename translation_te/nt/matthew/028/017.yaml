revisions:
- from: వారు ఆయనను చూసినప్పుడు ఆయనను ఆరాధించారు; అయితే కొందరు సందేహించారు.[a]
  to: ఆయనను చూసినప్పుడు, వారు ఆయనను ఆరాధించారు; అయితే కొందరు సందేహించారు.[a]
  rationale: The revision makes only stylistic and idiomatic adjustments. It retains the source text’s temporal sequence, contrast between worshipers and those who doubted, and the deliberately unresolved nuance of διστάζω.
