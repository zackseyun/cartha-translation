  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ⸀προσεκύνησαν, οἱ δὲ ἐδίστασαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/017.yaml
  text: And when they saw him[a], they worshiped him, but some doubted.
translation:
  language: te
  text: ఆయనను చూసినప్పుడు, వారు ఆయనను ఆరాధించారు; అయితే కొందరు సందేహించారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తటపటాయించారు’ లేదా ‘మనసు ఊగిసలాడారు.’ గ్రీకు పదం స్థిరమైన అవిశ్వాసం కంటే అనిశ్చితిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: చూసినప్పుడు
  rationale: ὁράω క్రియ యొక్క భూతకాల క్రియావిశేషణ రూపాన్ని ప్రధాన క్రియలతో ఉన్న కాలసంబంధం సహజంగా వెల్లడయ్యేలా అనువదించాం.
- source_word: προσεκύνησαν
  choice: ఆరాధించారు
  rationale: προσκυνέω అంటే సాష్టాంగపడడం, ఘనత చెల్లించడం, లేదా ఆరాధించడం కావచ్చు. పునరుత్థానుడైన యేసు సందర్భంలో ‘ఆరాధించారు’ అనే పదం ఇక్కడి భక్తిపూర్వక భావబలాన్ని తగిన విధంగా తెలియజేస్తుంది.
- source_word: οἱ δὲ
  choice: అయితే కొందరు
  rationale: δέ చూపే వ్యత్యాసాన్ని, ముందు చెప్పిన సమూహంలోని ఒక వర్గాన్ని సూచించే నిర్దిష్ట ఉపపదపు సంక్షిప్త ప్రయోగాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐδίστασαν
  choice: సందేహించారు
  rationale: διστάζω అనేది సందేహించడం, తటపటాయించడం, లేదా మనసు ఊగిసలాడడం అనే భావాలను ఇవ్వగలదు. ప్రధాన పాఠ్యంలో సూటిగా ‘సందేహించారు’ అని ఉంచి, దాని సున్నితమైన ప్రత్యామ్నాయ భావాలను పాదటిప్పణిలో ఇచ్చాం.
theological_decisions:
- issue: పునరుత్థానుడైన యేసు పట్ల προσκυνέω పదపు భావబలం
  choice: ‘ఆరాధించారు’ అని అనువదించడం
  alternative: ‘ఆయనకు సాష్టాంగపడ్డారు’ లేదా ‘ఆయనకు ఘనత చెల్లించారు’
  rationale: మత్తయి సువార్తలోని పునరుత్థాన సందర్భం, క్రియ నేరుగా యేసును లక్ష్యంగా చేసుకోవడం దృష్ట్యా ‘ఆరాధించారు’ అనే అనువాదం గ్రీకు పదం అనుమతించే హద్దుల్లోనే ఆ కార్యపు ధార్మిక భావబలాన్ని ప్రతిబింబిస్తుంది.
- issue: διστάζω పదంలోని అనిశ్చితి స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘సందేహించారు’
  alternative: ‘తటపటాయించారు’ లేదా ‘ఊగిసలాడారు’
  rationale: ఈ పదం స్థిరమైన అవిశ్వాసాన్ని తప్పనిసరిగా సూచించకుండా, క్షణిక అనిశ్చితిని లేదా తటపటాయింపును సూచించవచ్చు. ఆ ఉద్రిక్తతను పరిష్కరించకుండా ప్రధాన పాఠ్యం సంప్రదాయ భావాన్ని ఉంచి, ప్రత్యామ్నాయ ఛాయలను పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘ఆయన’ అనే గౌరవవాచకం యేసును సూచిస్తుంది. పాదటిప్పణి గుర్తును దానికి సంబంధించిన ‘సందేహించారు’ పదం తరువాత ఉంచాం.
