  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ὧδε, ἠγέρθη γὰρ καθὼς εἶπεν· δεῦτε ἴδετε τὸν τόπον ὅπου ⸀ἔκειτο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: te
  text: ఆయన ఇక్కడ లేరు; ఎందుకంటే ఆయన చెప్పినట్లే లేపబడ్డారు[a]. రండి, ఆయన పడుకొని ఉన్న స్థలాన్ని చూడండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లేచారు.” గ్రీకు క్రియ రూపపరంగా నిష్క్రియార్థకంగా, అంటే “లేపబడ్డారు” అని ఉంది; సంప్రదాయ అనువాదాల్లో తరచుగా కర్తరి రూపంలో “లేచారు” అని అనువదిస్తారు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఆయన పడి ఉన్న స్థలాన్ని,” లేదా “ఆయనను ఉంచిన స్థలాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: ఆయన ఇక్కడ లేరు
  rationale: సందర్భంలో సూచించబడుతున్న వ్యక్తి స్పష్టంగా ఉన్నందున సహజమైన తెలుగులో ‘ఆయన’ను చేర్చాం. ὧδεకు ‘ఇక్కడ’ సహజమైన స్థల సూచన.
- source_word: ἠγέρθη
  choice: లేపబడ్డారు
  rationale: ἐγείρω క్రియలోని భూతకాల నిష్క్రియార్థ రూపాన్ని నిలుపుతూ, తెలుగులో యేసుకు తగిన గౌరవ వచనాన్ని ఉపయోగించాం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని తెలిపే γάρ సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: καθὼς εἶπεν
  choice: ఆయన చెప్పినట్లే
  rationale: యేసు ముందుగా చెప్పిన మాటతో జరిగినది సరిగ్గా సరిపోలిందనే καθώς భావాన్ని ‘చెప్పినట్లే’ నిలుపుతుంది.
- source_word: δεῦτε
  choice: రండి
  rationale: ఆహ్వానం లేదా పిలుపును తెలిపే δεῦτεకు గౌరవపూర్వకమైన, సహజమైన తెలుగు ఆజ్ఞారూపం.
- source_word: ἴδετε
  choice: చూడండి
  rationale: వెంటనే పరిశీలించమనే ఆజ్ఞను ఆధునిక, గౌరవపూర్వక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὸν τόπον
  choice: స్థలాన్ని
  rationale: సమాధిలో యేసు ఉన్న నిర్దిష్ట ప్రదేశాన్ని సూచించడానికి ‘స్థలం’ స్పష్టమైన, సాధారణ పదం.
- source_word: ὅπου ἔκειτο
  choice: ఆయన పడుకొని ఉన్న
  rationale: κεῖμαι యొక్క స్థితిని సూచించే ‘పడి/పడుకొని ఉండు’ భావాన్ని నిలుపుతుంది; ఆయనను అక్కడ ఎవరో ఉంచారనే చర్యను ప్రధాన పాఠ్యంలో అదనంగా స్పష్టీకరించదు.
theological_decisions:
- issue: పునరుత్థాన ప్రకటనలో క్రియావాచ్యం మరియు కర్తృత్వం
  choice: లేపబడ్డారు
  alternative: లేచారు
  rationale: ἠγέρθη రూపపరంగా నిష్క్రియార్థకమైనది. ‘లేపబడ్డారు’ అని అనువదించడం మూలంలోని వాచ్యాన్ని, ఆయనపై జరిగిన కార్యం అనే సూక్ష్మభావాన్ని నిలుపుతుంది; కొత్త నిబంధనలో ఇతరచోట్ల యేసు స్వీయ కర్తృత్వం గురించి ఉన్న బోధను ఇది నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని అనుసరించాం. యేసును సూచించే చోట ‘ఆయన’తో పాటు గౌరవ బహువచన క్రియారూపాలు వాడాం. మూలంలోని నిష్క్రియార్థ పునరుత్థాన ప్రకటనను ప్రధాన పాఠ్యంలో నిలిపి, తెలుగులో మరింత సాధారణమైన కర్తరి ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
