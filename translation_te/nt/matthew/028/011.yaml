id: MAT.28.11
reference: Matthew 28:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πορευομένων δὲ αὐτῶν ἰδού τινες τῆς κουστωδίας ἐλθόντες εἰς τὴν πόλιν ἀπήγγειλαν τοῖς ἀρχιερεῦσιν ἅπαντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: te
  text: వారు వెళ్తుండగా[a], ఇదిగో[b], కాపలా దళానికి చెందిన కొందరు పట్టణంలోకి వచ్చి, జరిగినదంతా ప్రధాన యాజకులకు తెలియజేశారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు వెళ్తూ ఉండగా.” గ్రీకులోని స్వతంత్ర షష్ఠీ నిర్మాణం తదుపరి సంఘటనకు కాలపరమైన నేపథ్యాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “ఇదిగో” అనేది గ్రీకు ἰδούకు అనువాదం; కథనంలో అకస్మాత్తుగా జరిగిన లేదా ప్రత్యేకంగా గమనించాల్సిన పరిణామాన్ని ఇది సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: వారు వెళ్తుండగా
  rationale: గ్రీకు genitive absolute తదుపరి సంఘటనకు కాలపరమైన నేపథ్యాన్ని ఏర్పరుస్తుంది. గమ్యస్థానాన్ని అనవసరంగా పేర్కొనకుండా సమకాలీన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἰδού
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా లేదా గమనించదగిన పరిణామాన్ని సూచించే అవధాన సూచకాన్ని నిలుపుతుంది.
- source_word: τινες τῆς κουστωδίας
  choice: కాపలా దళంలో కొందరు
  rationale: κουστωδία సమాధి దగ్గర నియమించబడిన కాపలా బృందాన్ని సూచిస్తుంది; ఈ రూపం కొందరు ఆ దళానికి చెందినవారని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: పట్టణంలోకి వచ్చి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన అనుబంధ చర్యగా ఉన్న aorist participleను సహజమైన తెలుగు క్రమంలో వ్యక్తపరుస్తుంది.
- source_word: ἀπήγγειλαν
  choice: తెలియజేశారు
  rationale: అధికారులకు జరిగిన విషయాన్ని నివేదించే భావాన్ని గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: ముఖ్య యాజకులకు
  rationale: రెండవ దేవాలయ కాలపు యూదా నాయకత్వ సందర్భంలో ἀρχιερεῖςకు స్థిరమైన, స్పష్టమైన తెలుగు పదప్రయోగం.
- source_word: ἅπαντα τὰ γενόμενα
  choice: జరిగినదంతా
  rationale: ἅπαντα సూచించే సంపూర్ణతను, τὰ γενόμενα సూచించే జరిగిన సంఘటనలను సంక్షిప్తంగా మరియు సహజంగా నిలుపుతుంది.
