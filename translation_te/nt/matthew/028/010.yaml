id: MAT.28.10
reference: Matthew 28:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: te
  text: అప్పుడు యేసు వారితో, “భయపడకండి. వెళ్లి, నా సోదరులకు[a] గలిలయకు వెళ్లమని చెప్పండి; అక్కడ వారు నన్ను చూస్తారు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘నా సోదరులు’ అనేది యేసు శిష్యులను సూచిస్తుంది. గ్రీకు పదం పురుష బహువచన రూపంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథన క్రమంలో తరువాత జరిగినదాన్ని సూచించే సహజమైన కాలక్రమ పదం.
- source_word: λέγει αὐταῖς ὁ Ἰησοῦς
  choice: యేసు వారితో … అన్నాడు
  rationale: గ్రీకులో చారిత్రక వర్తమాన కాలం ఉన్నప్పటికీ, తెలుగు కథన శైలిలో భూతకాల రూపం సహజం. స్త్రీలింగ బహువచన సర్వనామానికి సందర్భానుగుణంగా ‘వారితో’ అని అనువదించబడింది.
- source_word: Μὴ φοβεῖσθε
  choice: భయపడకండి
  rationale: నిషేధార్థక ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా, గౌరవ బహువచనంతో వ్యక్తం చేస్తుంది.
- source_word: ὑπάγετε
  choice: వెళ్లి
  rationale: తరువాతి ఆజ్ఞతో సహజంగా అనుసంధానమయ్యే తెలుగు క్రియారూపం; ‘వెళ్లండి, చెప్పండి’ కంటే ప్రవాహవంతంగా ఉంది.
- source_word: ἀπαγγείλατε
  choice: చెప్పండి
  rationale: సందేశాన్ని తెలియజేయడం అనే భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది; ‘నివేదించండి’ ఈ సందర్భంలో అనవసరంగా అధికారికంగా వినిపిస్తుంది.
- source_word: τοῖς ἀδελφοῖς μου
  choice: నా సోదరులకు
  rationale: గ్రీకు పదంలోని పురుష బహువచన కుటుంబ సంబోధనను అలాగే నిలుపుతూ, దాన్ని ప్రధాన పాఠ్యంలో ‘శిష్యులు’గా వివరణాత్మకంగా మార్చలేదు.
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: గలిలయకు వెళ్లమని
  rationale: ἵνα మరియు సంభావనార్థక క్రియ ఇక్కడ తెలియజేయవలసిన ఆజ్ఞలోని విషయాన్ని సూచిస్తాయి; తెలుగులో పరోక్ష ఆజ్ఞకు ‘వెళ్లమని’ సహజమైన రూపం.
- source_word: κἀκεῖ με ὄψονται
  choice: అక్కడ వారు నన్ను చూస్తారు
  rationale: ‘అక్కడ’ స్థలాన్ని స్పష్టంగా సూచిస్తుంది; ὄψονται యొక్క సాధారణ అర్థమైన ‘చూస్తారు’ను నిలిపి, మరింత వ్యాఖ్యానాత్మకమైన ‘కలుసుకుంటారు’ను నివారించింది.
theological_decisions:
- issue: ‘నా సోదరులు’ అనే పదబంధం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో యేసు వాడిన కుటుంబ సంబంధ పదాన్ని ‘నా సోదరులు’గా నిలుపుతూ, సందర్భంలో అది ఆయన శిష్యులను సూచిస్తుందని పాదసూచికలో తెలిపింది.
  alternative: ప్రధాన పాఠ్యంలోనే ‘నా శిష్యులు’ అని అనువదించడం.
  rationale: తక్షణ సందర్భం శిష్యులను సూచించినా, ‘సోదరులు’ అనే మూలపదంలోని కుటుంబ సాన్నిహిత్యాన్ని ‘శిష్యులు’ అని మార్చడం తొలగిస్తుంది. అందువల్ల పదాన్ని నిలిపి, సందర్భార్థాన్ని పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన కథన శైలి వాడబడింది. ఆజ్ఞలు మర్యాదపూర్వక బహువచనంలో ఉన్నాయి. మూలంలోని ‘సోదరులు’ అనే కుటుంబ సంబోధనను వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుకుంది.
