  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου μετὰ φόβου καὶ χαρᾶς μεγάλης ἔδραμον ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: te
  text: వారు సమాధి నుండి త్వరగా బయలుదేరి, భయంతో[a], గొప్ప ఆనందంతో ఆయన శిష్యులకు తెలియజేయడానికి పరుగెత్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “భయభక్తితో.” ఈ సందర్భంలో “భయం” అనే గ్రీకు పదం భక్తిపూర్వక విస్మయం అనే భావాన్ని కూడా కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι
  choice: బయలుదేరి
  rationale: సమాధి నుండి ఆ స్త్రీలు వెళ్లిపోవడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; సందర్భం ద్వారా కర్త స్త్రీలని స్పష్టమవుతుంది.
- source_word: ταχὺ
  choice: త్వరగా
  rationale: వారి చర్యలోని వేగాన్ని, ఆతురతను నేరుగా వ్యక్తం చేస్తుంది.
- source_word: μνημείου
  choice: సమాధి
  rationale: ఈ పునరుత్థాన సందర్భంలో యేసు దేహాన్ని ఉంచిన స్థలాన్ని సూచించే సాధారణ, స్పష్టమైన తెలుగు పదం.
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: భయంతో, గొప్ప ఆనందంతో
  rationale: భయం మరియు గొప్ప ఆనందం ఒకేసారి ఉన్నాయని మూలపాఠం చూపించే భావోద్వేగ ఉద్వేగాన్ని పరిష్కరించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: ἔδραμον
  choice: పరుగెత్తారు
  rationale: τρέχω క్రియలోని స్పష్టమైన శారీరక చర్యను బలహీనపరచకుండా అందిస్తుంది.
- source_word: ἀπαγγεῖλαι
  choice: తెలియజేయడానికి
  rationale: ఇది ఉద్దేశాన్ని తెలిపే క్రియారూపం. గ్రీకులో ప్రత్యక్ష కర్మ లేకపోవడంతో సందేశ విషయాన్ని అనవసరంగా చేర్చకుండా వార్తను చేరవేయడమనే భావాన్ని ఇస్తుంది.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: ఆయన శిష్యులకు
  rationale: μαθηταίకు సువార్తల సందర్భంలో స్థిరమైన తెలుగు సమానార్థకం ‘శిష్యులు’; αὐτοῦను గౌరవప్రదమైన సహజ తెలుగులో ‘ఆయన’గా అందించింది.
theological_decisions:
- issue: స్త్రీల ప్రతిస్పందనలోని భావోద్వేగ ఉద్వేగం
  choice: భయంతో, గొప్ప ఆనందంతో
  alternative: భయభక్తితో, గొప్ప ఆనందంతో
  rationale: φόβος ఇక్కడ భయాన్నీ భక్తిపూర్వక విస్మయాన్నీ సూచించే అవకాశం ఉంది. ప్రధాన పాఠంలో ‘భయం’ను ఉంచడం ద్వారా మూలపాఠంలోని నిజమైన ఉద్వేగం నిలుస్తుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. మూలంలోని చర్యల క్రమం, వేగం, భయం–ఆనందం మధ్య ఉద్వేగం నిలుపబడ్డాయి.
