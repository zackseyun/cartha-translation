- from: ఈ సంగతి అధిపతి చెవిన పడితే[a], మేము అతణ్ణి ఒప్పించి, మీకు ఏ ఇబ్బందీ రాకుండా చూసుకుంటాం.[b]
  to: ఈ సంగతి గవర్నరు చెవిన పడితే[a], మేము ఆయనను ఒప్పించి, మీరు చింతించాల్సిన అవసరం లేకుండా చేస్తాం.[b]
