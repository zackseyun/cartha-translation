  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. ‘చెవిన పడితే,’ ‘ఇబ్బందీ రాకుండా చూసుకుంటాం’ వంటి ప్రయోగాలు సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, గ్రీకు పదబంధాల మరింత పదశః రూపాలను పాదసూచికల్లో భద్రపరిచాం.
