source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: te
  text: ఈ సంగతి గవర్నరు చెవిన పడితే[a], మేము ఆయనను ఒప్పించి, మీరు చింతించాల్సిన అవసరం లేకుండా చేస్తాం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ సంగతి గవర్నరు దృష్టికి వస్తే.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మిమ్మల్ని చింతలేనివారిగా చేస్తాం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ
  choice: చెవిన పడితే
  rationale: ఇక్కడ ἀκούω కర్మణి రూపం ఈ సంగతి అధికారికి తెలిసే భావాన్ని సూచిస్తుంది. ‘చెవిన పడితే’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τοῦ ἡγεμόνος
  choice: అధిపతి చెవిన
  rationale: నివేదిక అధిపతి వినికిడికి లేదా దృష్టికి చేరడమే సందర్భార్థం. ἀκουσθῇతో కలిపి ‘అధిపతి చెవిన పడితే’ సహజంగా ఉంది; ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἡγεμόνος
  choice: అధిపతి
  rationale: ఈ సందర్భంలో ἡγεμών రోమా ప్రాంతీయ పరిపాలకుడైన పిలాతును సూచిస్తుంది. ‘అధిపతి’ గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
- source_word: πείσομεν αὐτόν
  choice: మేము అతణ్ణి ఒప్పించి
  rationale: πείθω యొక్క సాధారణ భావమైన ‘ఒప్పించడం’ను నేరుగా నిలుపుతుంది; అధిపతిని శాంతింపజేయడం అనే సందర్భార్థాన్ని అనవసరంగా ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἀμερίμνους
  choice: ఏ ఇబ్బందీ రాకుండా
  rationale: పదశః ‘చింతలేనివారిగా’ అనే భావం ఉన్నా, ఈ సందర్భంలో సైనికులకు శిక్షాపరమైన ఇబ్బంది రాకుండా చేయడాన్ని సూచిస్తుంది. సహజమైన సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, పదశః రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: ποιήσομεν
  choice: చూసుకుంటాం
  rationale: ποιέωతో కూడిన ఫలితార్థక నిర్మాణాన్ని తెలుగులో సహజంగా ‘రాకుండా చూసుకుంటాం’ అని వ్యక్తం చేశాం.
