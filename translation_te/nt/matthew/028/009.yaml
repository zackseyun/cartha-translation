id: MAT.28.9
reference: Matthew 28:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἰδοὺ Ἰησοῦς ⸀ὑπήντησεν αὐταῖς λέγων· Χαίρετε· αἱ δὲ προσελθοῦσαι ἐκράτησαν αὐτοῦ τοὺς πόδας καὶ προσεκύνησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: te
  text: ఇదిగో, యేసు వారిని కలుసుకొని, “శుభం!”[a] అన్నాడు. వారు ఆయన దగ్గరికి వచ్చి, ఆయన పాదాలను పట్టుకొని, ఆయనను ఆరాధించారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సంతోషించండి!” గ్రీకు పదం రూపరీత్యా బహువచన ఆజ్ఞార్థకం; అయితే ఇక్కడ అది పలకరింపుగా వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఆయనకు నమస్కరించారు” / “ఆయనకు గౌరవం చెల్లించారు.” గ్రీకు క్రియ శరీరాన్ని వంచి నమస్కరించడం లేదా గౌరవం చెల్లించడం అనే అర్థాలను కూడా ఇవ్వగలదు; ఈ పునరుత్థాన సందర్భంలో ‘ఆరాధించారు’ అనే అర్థం కూడా సముచితం.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలో అకస్మాత్తుగా జరిగిన ముఖ్య సంఘటనవైపు పాఠకుని దృష్టిని మళ్లించే సంభాషణ-సూచక బలాన్ని నిలుపుతుంది.
- source_word: ὑπήντησεν
  choice: వారికి ఎదురై
  rationale: యేసు వారి మార్గంలో వారిని కలుసుకున్నాడనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; మూలంలో లేని అదనపు దిశార్థాన్ని చేర్చదు.
- source_word: Χαίρετε
  choice: మీకు శుభం!
  rationale: ఇది రూపరీత్యా బహువచన ఆజ్ఞార్థకమైనా, ఈ సందర్భంలో పలకరింపుగా పనిచేస్తుంది. ‘మీకు శుభం!’ దాని సామాజిక విధినీ, ఆనందం/శుభం అనే పదసంబంధాన్నీ కొంతవరకు నిలుపుతుంది.
- source_word: προσελθοῦσαι
  choice: ఆయన దగ్గరికి వచ్చి
  rationale: తరువాతి రెండు చర్యలకు ముందు వారు యేసును సమీపించిన క్రమాన్ని స్పష్టంగా, సహజంగా చూపుతుంది.
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: ఆయన పాదాలను పట్టుకొని
  rationale: వారు ఆయన పాదాలను నిజంగా పట్టుకున్న శారీరక చర్యను స్పష్టంగా తెలియజేస్తుంది; ‘లాక్కొన్నారు’ వంటి అనవసరమైన కఠిన భావాన్ని నివారిస్తుంది.
- source_word: προσεκύνησαν αὐτῷ
  choice: ఆయనను ఆరాధించారు
  rationale: పునరుత్థాన సందర్భంలో ఈ క్రియకు ఉన్న మతపరమైన బలాన్ని వ్యక్తం చేస్తుంది; అదే సమయంలో ‘సాష్టాంగపడ్డారు/నమస్కరించారు’ అనే అర్థసాధ్యతను పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: పునరుత్థానుడైన యేసు పట్ల προσκυνέω క్రియను అనువదించడం
  choice: ఆయనను ఆరాధించారు
  alternative: ఆయనకు సాష్టాంగపడ్డారు / ఆయనకు ప్రణామం చేశారు
  rationale: προσκυνέω శరీరాన్ని వంచి గౌరవించడం లేదా ఆరాధించడం రెండింటినీ సూచించగలదు. మత్తయి పునరుత్థాన కథన సందర్భంలో ‘ఆరాధించారు’ అనే అర్థం బలంగా ఉంది; అయినా క్రియలోని భంగిమ/గౌరవార్థక సాధ్యతను పాదటిప్పణి ద్వారా సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే కథన గాంభీర్యాన్ని నిలుపుతూ రచించబడింది. ‘ఇదిగో’ మూలంలోని దృష్టి-ఆహ్వానాన్ని ఉంచుతుంది. పలకరింపు కృత్రిమంగా కాకుండా సంక్షిప్తంగా ఉంది; προσκυνέωలోని నిజమైన అర్థవ్యాప్తిని పాదటిప్పణి సంరక్షిస్తుంది.
