revisions:
- from: ఇదిగో, యేసు వారికి ఎదురై, “మీకు శుభం!”[a] అన్నాడు. వారు ఆయన దగ్గరికి వచ్చి, ఆయన పాదాలను పట్టుకొని, ఆయనను ఆరాధించారు.[b]
  to: ఇదిగో, యేసు వారిని కలుసుకొని, “శుభం!”[a] అన్నాడు. వారు ఆయన దగ్గరికి వచ్చి, ఆయన పాదాలను పట్టుకొని, ఆయనను ఆరాధించారు.[b]
  rationale: The revision makes the rendering of ὑπήντησεν more precise and replaces the footnote’s overly specific bodily alternative with idiomatic Telugu that better reflects the semantic range of προσκυνέω. The primary contextual rendering ‘ఆరాధించారు’ is retained in continuity with the audit trail, while the note preserves the source verb’s broader ambiguity.
