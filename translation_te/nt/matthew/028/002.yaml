id: MAT.28.2
reference: Matthew 28:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: te
  text: ఇదిగో, గొప్ప భూకంపం వచ్చింది. ఎందుకంటే ప్రభువు దూత పరలోకం నుండి దిగివచ్చి, దగ్గరకు వచ్చి, రాయిని దొర్లించి దానిమీద కూర్చున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: కథనంలోని ఆకస్మికమైన, గమనార్హమైన సంఘటనవైపు పాఠకుని దృష్టిని మళ్లించే మూలపద బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: σεισμὸς ... μέγας
  choice: గొప్ప భూకంపం
  rationale: μέγας యొక్క తీవ్రతను నేరుగా నిలుపుతూ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది.
- source_word: ἄγγελος κυρίου
  choice: ప్రభువు దూత
  rationale: అనిర్దిష్ట గ్రీకు రూపాన్ని కాపాడుతుంది; 'ప్రభువు' అనేది κυρίου కు సహజమైన బైబిలీయ తెలుగు సమానం.
- source_word: καταβὰς ἐξ οὐρανοῦ
  choice: పరలోకం నుండి దిగివచ్చి
  rationale: దూత కదలిక యొక్క మూలస్థానాన్ని, దిశను స్పష్టంగా మరియు మూలానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: προσελθὼν
  choice: దగ్గరకు వచ్చి
  rationale: ఎవరికి లేదా దేనికి దగ్గరయ్యాడో మూలవాక్యం స్పష్టంగా చెప్పని కారణంగా, కర్మను చేర్చకుండా అసలు అస్పష్టతను నిలుపుతుంది.
- source_word: ἀπεκύλισε τὸν λίθον
  choice: రాయిని దొర్లించి
  rationale: రాయిని దొర్లించి తొలగించిన చర్యను సంక్షిప్తంగా తెలియజేస్తుంది; సందర్భం వల్ల దూరంగా తొలగించడం అర్థమవుతుంది.
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: దానిమీద కూర్చున్నాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న స్థితిని సహజ తెలుగు క్రియతో వ్యక్తపరుస్తుంది; αὐτοῦ సమీపంలోని రాయినే సూచిస్తుంది.
theological_decisions:
- issue: భూకంపం మరియు దూత దిగివచ్చిన చర్య మధ్య కారణ సంబంధం
  choice: “ఎందుకంటే” అని γάρ ను స్పష్టంగా అనువదించడం
  alternative: వాక్యాలను కేవలం వరుస సంఘటనలుగా కలపడం
  rationale: మూలంలోని γάρ భూకంపానికి దూత దిగివచ్చిన విషయాన్ని వివరణగా లేదా కారణంగా అనుసంధానిస్తుంది; ఆ సంబంధాన్ని తొలగించలేదు.
- issue: ἄγγελος κυρίου లో నిర్దిష్టత
  choice: “ప్రభువు దూత”
  alternative: “ప్రభువు యొక్క ఆ దూత” లేదా ప్రత్యేక దైవిక వ్యక్తిత్వంగా విస్తరించడం
  rationale: మూలపాఠం దూతను ప్రత్యేక సిద్ధాంతపరమైన గుర్తింపుతో నిర్ధారించదు; అందువల్ల అలాంటి వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన కథన శైలి. గ్రీకు కృదంతాల వరుసను సహజమైన తెలుగు సంయుక్త క్రియలుగా ఉంచి, సంఘటనల క్రమాన్ని కాపాడాం.
