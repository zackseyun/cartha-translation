source:
  edition: SBLGNT
  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: te
  text: అతనిపట్ల భయంతో కాపలాదారులు వణికి, చనిపోయినవారిలా అయ్యారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘అతనిపట్ల భయం వల్ల కాపలాదారులు కంపించారు.’'
    reason: ἀπό యొక్క కారణార్థాన్నీ, ἐσείσθησανకు ‘కంపించారు’ అనే ప్రత్యామ్నాయాన్నీ చూపించే పదార్థ ప్రత్యామ్నాయం; ‘అతనిపట్ల’ అనేది భయానికి లక్ష్యమైన వ్యక్తిని స్పష్టపరుస్తుంది.
lexical_decisions:
- source_word: ἀπὸ
  choice: తో
  rationale: జనిటివ్‌తో వచ్చిన ἀπό ఇక్కడ ప్రతిచర్యకు కారణాన్ని సూచిస్తుంది. ‘భయంతో’ అనేది ఆ కారణ సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: వాక్యప్రవాహంలో ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ స్వల్ప అనుసంధాన అవ్యయం. తెలుగులో ముందు వాక్యంతో అనుసంధానం సందర్భం ద్వారానే స్పష్టంగా ఉండటంతో ‘మరియు/అయితే’ చేర్చడం కృత్రిమంగా ఉంటుంది.
- source_word: φόβου αὐτοῦ
  choice: అతని పట్ల కలిగిన భయం
  rationale: φόβος యొక్క సాధారణ అర్థమైన ‘భయం’ను నిలుపుతూ, αὐτοῦను భయానికి వ్యక్తిగత లక్ష్యంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది. ‘అతడు’ ముందు వచనంలోని దూతను సూచిస్తుంది.
- source_word: ἐσείσθησαν
  choice: వణికి
  rationale: σείω యొక్క ఈ సందర్భార్థం భయంతో శరీరం కంపించడాన్ని సూచిస్తుంది; ‘వణికి’ ఆధునిక తెలుగులో సహజంగా, సజీవంగా ఉంది.
- source_word: οἱ τηροῦντες
  choice: కాపలాదారులు
  rationale: అక్షరార్థంగా ‘కాపలా కాస్తున్నవారు’; సమాధి వద్ద నియమించబడిన వారిని సందర్భానుసారంగా ‘కాపలాదారులు’ స్పష్టంగా సూచిస్తుంది.
- source_word: ἐγενήθησαν
  choice: అయ్యారు
  rationale: γίνομαι సూచించే స్థితి మార్పును సాధారణ, సహజ తెలుగులో నిలుపుతుంది.
- source_word: ὡς νεκροί
  choice: చనిపోయినవారిలా
  rationale: ὡς పోలికను సూచిస్తుంది, నిజంగా మరణించారని కాదు. ‘చనిపోయినవారిలా’ ఆ ఉపమానాన్ని స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: αὐτοῦ (‘అతని’) యొక్క సూచిత వ్యక్తి
  choice: ముందటి వచనంలో వర్ణించబడిన దూత
  alternative: మొత్తం పరలోక సంఘటన
  rationale: అత్యంత సమీప సందర్భంలో మెరుపువంటి రూపంతో కనిపించిన దూతే వ్యక్తిగత పూర్వపదం. అయినా అనువాదం ‘అతని’ అని ఉంచి మూలంలోని సర్వనామ రూపాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన కథనశైలి. ‘భయంతో’ కారణ సంబంధాన్ని సహజంగా అందిస్తుంది; ‘వణికి’ మరియు ‘అయ్యారు’ మూలంలోని రెండు వరుస చర్యలను నిలుపుతాయి.
