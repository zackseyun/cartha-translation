review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the inferential οὖν, the commissioning force of πορευθέντες with μαθητεύσατε, the universal scope of πάντα τὰ ἔθνη, and the means-participle βαπτίζοντες. It also appropriately retains the directional nuance of εἰς as “నామంలోనికి” and preserves the singular “name.”
  naturalness: “సమస్త జనజాతుల వారిని” is somewhat cumbersome in modern standard Telugu, and the repeated separated possessives in “తండ్రి యొక్క, కుమారుని యొక్క, పరిశుద్ధాత్మ యొక్క” are stilted. A coordinated construction is more natural while retaining the singular noun “నామం.”
  terminology: “శిష్యులుగా చేయండి,” “బాప్తిస్మం ఇస్తూ,” and “పరిశుద్ధాత్మ” are suitable contemporary Christian terminology. “తండ్రి, కుమారుడు, పరిశుద్ధాత్మ యొక్క నామంలోనికి” naturally preserves the three coordinated titles and the one name without adding doctrinal explanation.
  issues:
  - severity: low
    issue: Cumbersome expression for all nations
    rationale: “సమస్త జనజాతుల వారిని” redundantly combines a collective noun with “వారిని.” “అన్ని జనజాతులవారిని” is smoother and retains the referential sense of πάντα τὰ ἔθνη.
  - severity: low
    issue: Stilted repetition of possessive forms
    rationale: The sequence “తండ్రి యొక్క, కుమారుని యొక్క, పరిశుద్ధాత్మ యొక్క” is understandable but unnatural Telugu. Coordinating the titles before a single “యొక్క నామం” is idiomatic and retains the Greek singular ‘name.’
  revised_text: కాబట్టి వెళ్లి అన్ని జనజాతులవారిని శిష్యులుగా చేయండి; తండ్రి, కుమారుడు, పరిశుద్ధాత్మ యొక్క నామంలోనికి[a] వారికి బాప్తిస్మం ఇస్తూ,
