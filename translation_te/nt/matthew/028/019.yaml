revisions:
- from: కాబట్టి మీరు వెళ్లి, సమస్త జనజాతుల వారిని శిష్యులుగా చేయండి; తండ్రి యొక్క, కుమారుని యొక్క, పరిశుద్ధాత్మ యొక్క నామంలోనికి[a] వారికి బాప్తిస్మం ఇస్తూ,
  to: కాబట్టి వెళ్లి అన్ని జనజాతులవారిని శిష్యులుగా చేయండి; తండ్రి, కుమారుడు, పరిశుద్ధాత్మ యొక్క నామంలోనికి[a] వారికి బాప్తిస్మం ఇస్తూ,
