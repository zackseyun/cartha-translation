id: MAT.28.19
reference: Matthew 28:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: te
  text: కాబట్టి వెళ్లి అన్ని జనజాతులవారిని శిష్యులుగా చేయండి; తండ్రి, కుమారుడు, పరిశుద్ధాత్మ యొక్క నామంలోనికి[a] వారికి బాప్తిస్మం ఇస్తూ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నామంలో.’ గ్రీకు మూలంలో అక్షరార్థంగా ‘నామంలోనికి’ అని ఉంది; ఇది సంబంధంలోకి లేదా గుర్తింపులోకి ప్రవేశించడాన్ని నొక్కిచెప్పవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: మీరు వెళ్లి
  rationale: ప్రధాన ఆజ్ఞకు ముందున్న భూతకాల క్రియావిశేషణ రూపం ఇక్కడ ఆజ్ఞాత్మక అనుబంధ భావాన్ని కలిగిస్తుంది. ‘వెళ్లి’ అనేది తెలుగులో సహజంగా ఉండి, పంపబడుతున్న బలాన్ని నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: 18వ వచనంలో యేసు తనకు సమస్త అధికారం ఇవ్వబడిందని ప్రకటించిన దానినుంచి వచ్చే నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: μαθητεύσατε
  choice: శిష్యులుగా చేయండి
  rationale: ఇది కేవలం బోధించడం కాక, ఇతరులను శిష్యులుగా చేయడం అనే కారణార్థక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: πάντα τὰ ἔθνη
  choice: సమస్త జనజాతుల వారిని
  rationale: ἔθνη యొక్క విస్తృత ప్రజా-జాతి పరిధిని చూపుతుంది. ‘అన్యజనులు’ అని అనువదిస్తే ఈ సార్వత్రిక పరిధి అనవసరంగా కుదించబడుతుంది; ‘వారిని’ అనే రూపం తరువాతి αὐτούςతో సహజంగా అనుసంధానమవుతుంది.
- source_word: βαπτίζοντες
  choice: బాప్తిస్మం ఇస్తూ
  rationale: శిష్యులుగా చేయడంలో భాగమైన క్రియను సూచిస్తుంది. బాప్తిస్మ విధానాన్ని ‘ముంచుతూ’ అని నిర్దిష్టం చేయకుండా, స్థిరపడిన క్రైస్తవ పదప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: εἰς τὸ ὄνομα
  choice: నామంలోనికి
  rationale: εἰςలోని ‘లోనికి’ అనే దిశా భావాన్ని నిలుపుతూ, సంబంధంలోకి లేదా గుర్తింపులోకి ప్రవేశించే సాధ్యమైన భావాన్ని అనవసరంగా వివరించకుండా ఉంచుతుంది.
- source_word: τοῦ πατρὸς
  choice: తండ్రి యొక్క
  rationale: త్రిభాగ సూత్రంలో ఇది దైవిక వ్యక్తిగత బిరుదు; తెలుగు వాక్యంలో సంబంధార్థాన్ని స్పష్టంగా చూపుతుంది.
- source_word: τοῦ υἱοῦ
  choice: కుమారుని యొక్క
  rationale: తండ్రి మరియు పరిశుద్ధాత్మతో సమన్వయంగా ఉన్న దైవిక బిరుదుగా అనువదించబడింది.
- source_word: τοῦ ἁγίου πνεύματος
  choice: పరిశుద్ధాత్మ యొక్క
  rationale: ఆధునిక తెలుగు క్రైస్తవ వాడుకలో దైవిక వ్యక్తిని సూచించే సహజమైన, గౌరవప్రదమైన రూపం.
theological_decisions:
- issue: త్రియేక బాప్తిస్మ సూత్రంలో εἰς అనే విభక్త్యర్థక అవ్యయాన్ని అనువదించడం
  choice: నామంలోనికి
  alternative: నామంలో
  rationale: గ్రీకు εἰς సాధారణంగా లోనికి కదలికను సూచిస్తుంది; ఇక్కడ సంబంధం లేదా గుర్తింపులోకి చేర్చబడే భావం ఉండవచ్చు. ‘లోనికి’ ఆ భావసూక్ష్మతను కాపాడుతుంది, అయితే నిర్దిష్టమైన బాప్తిస్మ సిద్ధాంతాన్ని వచనంలోకి చేర్చదు. సహజమైన సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: ఏకవచన ‘నామం’తో తండ్రి, కుమారుడు, పరిశుద్ధాత్మల సమన్వయం
  choice: మూడు దైవిక వ్యక్తిగత బిరుదులను సమాన సమన్వయంతో ఉంచడం
  alternative: వాటిని సాధారణ సంబంధపదాలు లేదా నిర్జీవ శక్తిగా చూపడం
  rationale: ఏకవచన ‘నామం’ తరువాత వచ్చే మూడు సమన్విత సంబంధపదాలను మూలపాఠం ఉన్నట్టుగానే నిలుపుతుంది; దాని కంటే విస్తరించిన సిద్ధాంత వివరణను వచనంలో చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘నామంలోనికి’ సాధారణ సంభాషణలో కొంత అసాధారణంగా వినిపించినా, మూలంలోని εἰς భావాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది; పాదటిప్పణి మరింత సహజమైన ప్రత్యామ్నాయాన్ని ఇస్తుంది. వచనం తరువాతి వాక్యభాగంతో కొనసాగుతున్నందున చివర కామాను ఉంచాం.
