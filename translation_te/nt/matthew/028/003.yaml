base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: te
  text: అతని రూపం మెరుపులా ఉంది[a]; అతని వస్త్రం మంచులా తెల్లగా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘రూపం’కు ‘కనిపించిన తీరు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప కథన అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో దాన్ని ప్రత్యేకంగా పలకకపోయినా వాక్యప్రవాహం సహజంగా ఉంటుంది.
- source_word: εἰδέα
  choice: రూపం
  rationale: కంటికి కనిపించే బాహ్య రూపాన్ని సూచిస్తుంది. ‘రూపం’ సహజమైన ఆధునిక తెలుగు; ‘కనిపించిన తీరు’ కూడా సాధ్యమైన అర్థం.
- source_word: ὡς ἀστραπή
  choice: మెరుపులా
  rationale: ὡς తెలిపే ఉపమానాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἔνδυμα
  choice: వస్త్రం
  rationale: గ్రీకు పదం సాధారణంగా ధరించిన వస్త్రాన్ని సూచిస్తుంది; వస్త్ర రకాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: λευκόν
  choice: తెల్లగా
  rationale: మూలంలోని సాధారణ వర్ణవివరణను అదనపు తీవ్రత చేర్చకుండా వ్యక్తం చేస్తుంది.
- source_word: ὡς χιών
  choice: మంచులా
  rationale: వస్త్రపు తెల్లదనాన్ని మంచుతో పోల్చే రెండవ ఉపమానాన్ని నిలుపుతుంది.
theological_decisions:
- issue: αὐτοῦ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: మునుపటి సందర్భంలోని ప్రభువు దూతను సూచించేలా ‘అతని’ అని ఉంచడం
  alternative: యేసును సూచిస్తున్నట్లు స్పష్టీకరించడం లేదా ‘దూత’ అనే నామవాచకాన్ని చేర్చడం
  rationale: సమీప పూర్వపదం 2వ వచనంలోని ప్రభువు దూత. అయినప్పటికీ మూలంలో నామవాచకాన్ని మళ్లీ చెప్పకుండా సర్వనామమే ఉన్నందున అనువాదం కూడా దానిని అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. రెండు ఉపమానాలను స్పష్టంగా నిలిపి, మూలంలో లేని ప్రకాశ తీవ్రతను లేదా ప్రత్యేక వస్త్ర రకాన్ని చేర్చలేదు.
