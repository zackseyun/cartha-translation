revisions:
- from: ఆ పదకొండు మంది శిష్యులు గలిలయకు, యేసు తమకు నిర్దేశించిన[a] కొండకు వెళ్లారు.
  to: ఆ పదకొండు మంది శిష్యులు గలిలయకు వెళ్లి, యేసు వారికి నిర్దేశించిన[a] కొండకు వెళ్లారు.
