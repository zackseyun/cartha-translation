id: MAT.28.16
reference: Matthew 28:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἱ δὲ ἕνδεκα μαθηταὶ ἐπορεύθησαν εἰς τὴν Γαλιλαίαν εἰς τὸ ὄρος οὗ ἐτάξατο αὐτοῖς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: te
  text: ఆ పదకొండు మంది శిష్యులు గలిలయకు వెళ్లి, యేసు వారికి నిర్దేశించిన[a] కొండకు వెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నియమించిన.’ ఈ గ్రీకు క్రియకు ‘నియమించు,’ ‘నిర్దేశించు,’ లేదా ‘నిర్దిష్టంగా పేర్కొను’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ స్వల్ప కథన సంధానాన్ని సూచిస్తుంది; తెలుగులో సందర్భ ప్రవాహమే దాని పనిని సహజంగా నిర్వహిస్తుంది. ‘అయితే’ అని పెడితే మూలంలో లేనంత వ్యతిరేక భావం కలుగుతుంది.
- source_word: ἕνδεκα μαθηταὶ
  choice: ఆ పదకొండు మంది శిష్యులు
  rationale: μαθηταίకు సువార్తల సందర్భంలో స్థిరమైన, సహజమైన పదం ‘శిష్యులు’; ἕνδεκα యూదా లేని నిర్దిష్ట బృందాన్ని సూచిస్తుంది.
- source_word: ἐπορεύθησαν
  choice: వెళ్లారు
  rationale: ప్రయాణాన్ని తెలిపే సాధారణ కథన సందర్భంలో సరళమైన, సహజమైన తెలుగు క్రియ.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: గలిలయకు
  rationale: ప్రాంతం వైపు కదలికను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τὸ ὄρος
  choice: కొండకు
  rationale: ὄροςకు ‘కొండ’ లేదా ‘పర్వతం’ అనే అర్థాలు ఉండవచ్చు; సాధారణ ఆధునిక తెలుగులో ‘కొండ’ సహజంగా ఉండి, నిర్దిష్ట స్థలాన్ని కూడా స్పష్టంగా సూచిస్తుంది.
- source_word: οὗ ἐτάξατο αὐτοῖς
  choice: యేసు తమకు నిర్దేశించిన[a]
  rationale: ఇది యేసు ముందుగా ఆ సమావేశ స్థలాన్ని వారికి సూచించిన భావాన్ని సహజంగా అందిస్తుంది; τάσσωలోని ‘నియమించు/నిర్ణయించు’ భావసాధ్యతను పాదటిప్పణి కాపాడుతుంది.
- source_word: ὁ Ἰησοῦς
  choice: యేసు
  rationale: వ్యక్తినామానికి ప్రామాణిక తెలుగు రూపం.
theological_decisions:
- issue: యేసు సమావేశ స్థలాన్ని ముందుగా నిర్ణయించిన విధానంలోని అధికార భావం
  choice: ‘నిర్దేశించిన’ అని అనువదించడం
  alternative: ‘నియమించిన’ లేదా ‘ఆదేశించిన’
  rationale: ఈ సందర్భం ప్రధానంగా ముందుగా సూచించబడిన సమావేశ స్థలాన్ని తెలియజేస్తుంది. ‘ఆదేశించిన’ అంటే మూలం కంటే బలమైన ఆజ్ఞాభావం రావచ్చు; ‘నియమించిన’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచడం ద్వారా మూలపదంలోని విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి. గ్రీకు వాక్యంలోని రెండు గమ్యస్థాన సూచనలను—గలిలయ, నిర్దిష్ట కొండ—అలాగే ఉంచి, δέను అనవసరమైన వ్యతిరేక సంధానపదంతో బలపరచలేదు.
