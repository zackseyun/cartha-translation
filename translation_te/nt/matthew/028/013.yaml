id: MAT.28.13
reference: Matthew 28:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγοντες· Εἴπατε ὅτι Οἱ μαθηταὶ αὐτοῦ νυκτὸς ἐλθόντες ἔκλεψαν αὐτὸν ἡμῶν κοιμωμένων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/013.yaml
  text: saying[a], “Say[b], ‘His disciples came by night and stole him while we were sleeping.’”
translation:
  language: te
  text: 'ఇలా అన్నారు: “మీరు ‘అతని శిష్యులు రాత్రివేళ[a] వచ్చి, మేము నిద్రపోతున్నప్పుడు అతన్ని[b] దొంగిలించారు’ అని చెప్పండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రాత్రి సమయంలో.” గ్రీకు νυκτός వారు వచ్చిన సమయాన్ని సూచించే క్రియావిశేషణార్థక షష్ఠీ రూపం.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “అతన్ని” అని ఉంది; “అతని దేహాన్ని” అని కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: ఇలా అన్నారు
  rationale: వర్తమాన కృదంతం తరువాత వచ్చే ఆదేశపు మాటలను పరిచయం చేస్తుంది. తెలుగు కథనశైలిలో ‘ఇలా అన్నారు’ సహజంగా ఆ పనిని నెరవేర్చుతుంది.
- source_word: Εἴπατε
  choice: చెప్పండి
  rationale: ఇది ద్వితీయ పురుష బహువచన ఆజ్ఞార్థకం; ‘చెప్పండి’ దాని ప్రత్యక్ష ఆదేశ బలాన్ని నిలుపుతుంది.
- source_word: ὅτι
  choice: ‘…’ అని
  rationale: ఇది చెప్పవలసిన విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో ప్రత్యక్ష ఉల్లేఖనంతో పాటు ‘అని’ వాడటం సహజం.
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: అతని శిష్యులు
  rationale: గ్రీకు స్వామ్య సంబంధాన్ని సాధారణ, స్పష్టమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: νυκτὸς
  choice: రాత్రివేళ
  rationale: కాలాన్ని సూచించే క్రియావిశేషణార్థక షష్ఠీ రూపం; వారు వచ్చిన సమయాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐλθόντες
  choice: వచ్చి
  rationale: ప్రధాన క్రియకు ముందుగా జరిగిన చర్యను తెలిపే కృదంతాన్ని తెలుగు క్రమసూచక రూపమైన ‘వచ్చి’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἔκλεψαν
  choice: దొంగిలించారు
  rationale: దొంగతనంగా తీసుకెళ్లడాన్ని తెలిపే మూల క్రియకు నేరమైన తెలుగు సమానం.
- source_word: αὐτὸν
  choice: అతన్ని
  rationale: మూలపాఠం యేసును వ్యక్తిగత సర్వనామంతో సూచిస్తుంది; ‘అతని దేహాన్ని’ అని వివరణాత్మకంగా విస్తరించదు.
- source_word: ἡμῶν κοιμωμένων
  choice: మేము నిద్రపోతున్నప్పుడు
  rationale: గ్రీకు genitive absolute నిర్మాణంలోని సమకాలిక పరిస్థితిని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: కల్పిత నివేదికలో αὐτόν అనే సర్వనామం సూచించేది
  choice: ‘అతన్ని’ అనే వ్యక్తిగత సర్వనామాన్ని అలాగే నిలుపడం
  alternative: ‘అతని దేహాన్ని’ అని విస్తరించడం
  rationale: గ్రీకు పాఠంలో వ్యక్తిగత సర్వనామమే ఉంది. ‘దేహాన్ని’ అని చేర్చడం మూలంలో లేని వివరణను ప్రవేశపెడుతుంది; సందర్భం ఎవరిని సూచిస్తుందో స్పష్టంచేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రత్యక్ష ఉల్లేఖన నిర్మాణం వాడబడింది. భాష సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండగా, ఆజ్ఞ స్వరం మరియు మూలపాఠంలోని వ్యక్తిగత సర్వనామం యథాతథంగా నిలుపబడ్డాయి.
