  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: te
  text: త్వరగా వెళ్లి ఆయన శిష్యులకు, ‘ఆయన మృతులలోనుండి లేపబడ్డారు. ఇదిగో, ఆయన మీకంటే ముందుగా గలిలయకు వెళ్తున్నారు; అక్కడ మీరు ఆయనను చూస్తారు’ అని చెప్పండి. ఇదిగో, నేను మీకు చెప్పాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ πορευθεῖσαι
  choice: త్వరగా వెళ్లి
  rationale: గ్రీకు క్రియావిశేషణం ‘త్వరగా’ అనే భావాన్ని, కృదంతం ‘వెళ్లి’ అనే సహజ తెలుగు నిర్మాణాన్ని ఇస్తాయి.
- source_word: Ἠγέρθη ἀπὸ τῶν νεκρῶν
  choice: మృతులలోనుండి లేపబడ్డారు
  rationale: Ἠγέρθη లోని కర్మణి రూపాన్ని నిలుపుతూ, చర్య చేసినవారిని వాక్యంలో స్పష్టంగా చేర్చకుండా గ్రీకు వాక్యంలోని దైవకర్మణి సూచనను కాపాడుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే గ్రీకు సూచన పదానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం; రెండు సందర్భాల్లోనూ పునరావృతిని నిలుపుతుంది.
- source_word: προάγει ὑμᾶς
  choice: ఆయన మీకంటే ముందుగా ... వెళ్తున్నారు
  rationale: యేసు వారి కంటే ముందుగా గలిలయకు వెళ్తున్నారనే స్థలగమన భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκεῖ αὐτὸν ὄψεσθε
  choice: అక్కడ మీరు ఆయనను చూస్తారు
  rationale: స్థల సూచనకూ, భవిష్యత్ దర్శన వాగ్దానానికీ నేరమైన సమానం.
theological_decisions:
- issue: Ἠγέρθη అనే కర్మణి రూపంలో పునరుత్థాన చర్య చేసినవారు ఎవరో వాక్యంలో పేర్కొనబడలేదు.
  choice: లేపబడ్డారు
  alternative: దేవుడు ఆయనను లేపాడు / ఆయన లేచారు
  rationale: మూలంలోని కర్మణి నిర్మాణాన్ని, దానిలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడి, దేవుడు అనే కర్తను చేర్చడం గానీ స్వయంగా లేచారనే భావానికి మార్చడం గానీ చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. యేసును సూచించే క్రియల్లో గౌరవ బహువచనం ఉపయోగించబడింది. మూలంలోని రెండు ἰδοὺ పదాలనూ ‘ఇదిగో’గా నిలిపి వాక్యపు ఉద్ఘాటనను కాపాడాం.
