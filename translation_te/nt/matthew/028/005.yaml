revisions:
- from: 'అప్పుడు దూత ఆ స్త్రీలతో ఇలా అన్నాడు: “మీరు భయపడకండి[a]. సిలువ వేయబడిన యేసును మీరు వెదుకుతున్నారని నాకు తెలుసు[b].”'
  to: 'అయితే దూత జవాబిచ్చి ఆ స్త్రీలతో ఇలా అన్నాడు: “మీరు భయపడకండి[a], ఎందుకంటే సిలువ వేయబడిన యేసును[b] మీరు వెదుకుతున్నారని నాకు తెలుసు.”'
  rationale: The revision preserves the source’s narrative response formula and δέ transition in idiomatic Telugu, explicitly expresses γάρ as the basis for reassurance, and relocates footnote b to its proper lexical anchor. It does not alter the passage’s meaning or resolve the implied contrast of the emphatic ‘మీరు.’
