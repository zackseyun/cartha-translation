id: MAT.28.5
reference: Matthew 28:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν ταῖς γυναιξίν· Μὴ φοβεῖσθε ὑμεῖς, οἶδα γὰρ ὅτι Ἰησοῦν τὸν ἐσταυρωμένον ζητεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: te
  text: 'అయితే దూత జవాబిచ్చి ఆ స్త్రీలతో ఇలా అన్నాడు: “మీరు భయపడకండి[a], ఎందుకంటే సిలువ వేయబడిన యేసును[b] మీరు వెదుకుతున్నారని నాకు తెలుసు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘మీరు’ అనే సర్వనామం స్పష్టంగా ఉండి ఉద్ఘాటనను కలిగిస్తుంది; దూత ఇచ్చిన అభయం ప్రత్యేకంగా ఆ స్త్రీలను ఉద్దేశించింది.
    reason: lexical_alternative
  - marker: b
    text: 'మరింత అక్షరార్థంగా: ‘సిలువ వేయబడినవాడైన యేసును.’ గ్రీకు రూపం సిలువ వేయడం పూర్తయిన కార్యమని, అదే సమయంలో యేసును ఆ విధంగా గుర్తిస్తున్నదని సూచిస్తుంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν
  choice: అప్పుడు దూత ... ఇలా అన్నాడు
  rationale: ἀποκριθείς ... εἶπεν అనే గ్రీకు కథన సూత్రాన్ని తెలుగులో సహజంగా తెలిపేందుకు ‘ఇలా అన్నాడు’ అని అనువదించాం. δέ ఇక్కడ స్వల్ప కథన మలుపును సూచిస్తున్నందున ‘అప్పుడు’ సరిపోతుంది; ‘జవాబిచ్చి అన్నాడు’ అనేది తెలుగులో అనవసర పునరుక్తిగా వినిపిస్తుంది.
- source_word: ταῖς γυναιξίν
  choice: ఆ స్త్రీలతో
  rationale: సందర్భంలో ముందే పేర్కొన్న స్త్రీలను సూచించే నిర్దిష్ట బహువచనానికి సహజమైన తెలుగు రూపం.
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: మీరు భయపడకండి
  rationale: నిషేధాత్మక ఆజ్ఞను సహజమైన గౌరవ బహువచనంలో ఇచ్చి, గ్రీకులో స్పష్టంగా ఉన్న emphatic ὑμεῖς ను ‘మీరు’ ద్వారా నిలిపాం.
- source_word: οἶδα γὰρ ὅτι
  choice: '... అని నాకు తెలుసు'
  rationale: γάρ ఇచ్చే కారణ వివరణ తెలుగులో వాక్యక్రమం మరియు సందర్భం ద్వారా సహజంగా వ్యక్తమవుతుంది; ὅτι పూరకార్థాన్ని ‘అని’ తెలియజేస్తుంది.
- source_word: Ἰησοῦν τὸν ἐσταυρωμένον
  choice: సిలువ వేయబడిన యేసును
  rationale: Perfect passive participle యొక్క పూర్తయిన క్రియ మరియు కొనసాగుతున్న గుర్తింపును తెలుగు భూతకర్మక విశేషణ రూపం సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ζητεῖτε
  choice: మీరు వెదుకుతున్నారు
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న అన్వేషణను తెలుగులో సహజమైన ప్రగతిశీల రూపంతో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ὑμεῖς అనే స్పష్టమైన సర్వనామంలోని ఉద్ఘాటన
  choice: ప్రధాన పాఠంలో ‘మీరు భయపడకండి’ అని ఉంచి, ఉద్ఘాటనను పాదసూచికలో వివరించాం.
  alternative: ‘భయపడకండి’ అని మాత్రమే అనువదించడం.
  rationale: దూత ఇచ్చిన అభయం ప్రత్యేకంగా ఆ స్త్రీలను ఉద్దేశించినదని గ్రీకు సూచిస్తుంది. ఎవరికైనా విరుద్ధంగా వారిని నిలుపుతోందో నిర్ణయించకుండా ఆ ఉద్ఘాటనను కాపాడాం.
- issue: τὸν ἐσταυρωμένον యొక్క కాలాంశం మరియు గుర్తింపు
  choice: ‘సిలువ వేయబడిన యేసు’
  alternative: ‘సిలువ వేయించిన యేసు’ లేదా ‘సిలువ వేయబడినవాడైన యేసు’
  rationale: కర్మకత్వాన్ని, పూర్తయిన సిలువ మరణాన్ని, ఆ సంఘటనతో యేసుకు ఉన్న కొనసాగుతున్న గుర్తింపును సహజమైన తెలుగులో నిలుపుతుంది; అదనపు సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని వాడాం. ‘వెదుకుతున్నారు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి మూలంలోని ζητεῖτε భావాన్ని నిలుపుతుంది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
