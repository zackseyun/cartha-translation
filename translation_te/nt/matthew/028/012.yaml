source:
  edition: SBLGNT
  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: te
  text: వారు పెద్దలతో సమావేశమై, సమాలోచన చేసిన తరువాత, సైనికులకు గణనీయమైన వెండి ధనాన్ని[a] ఇచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పెద్ద మొత్తంలో వెండి నాణాలను.” గ్రీకు పదం వెండి ధనాన్ని లేదా వెండి నాణాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθέντες
  choice: సమావేశమై
  rationale: ఈ భూతకాల కృదంతం వారు కూడివచ్చిన తరువాత జరిగిన చర్యల క్రమాన్ని సూచిస్తుంది. ‘సమావేశమై’ అనేది సహజమైన ఆధునిక తెలుగు.
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: పెద్దలతో
  rationale: μετά జనిటివ్‌తో సహవాసాన్ని సూచిస్తుంది; ఈ నాయకత్వ సందర్భంలో πρεσβύτεροιకు ‘పెద్దలు’ ప్రామాణికమైన అనువాదం.
- source_word: συμβούλιόν τε λαβόντες
  choice: సంప్రదించిన తరువాత
  rationale: ఈ గ్రీకు పదబంధం కలిసి ఆలోచించి నిర్ణయానికి రావడాన్ని సూచిస్తుంది; కేవలం సలహా స్వీకరించడమనే భావం కాదు.
- source_word: ἀργύρια ἱκανὰ
  choice: పెద్ద మొత్తంలో వెండి నాణాలను
  rationale: ἀργύρια వెండి ధనాన్ని లేదా వెండి నాణాలను సూచించగలదు; ἱκανὰ ఇక్కడ గణనీయమైన పరిమాణాన్ని తెలియజేస్తుంది. ఈ రూపం తెలుగులో సహజంగా ఉండి వెండి అనే మూలపద భావాన్ని నిలుపుతుంది.
- source_word: ἔδωκαν
  choice: ఇచ్చారు
  rationale: δίδωμι యొక్క సాధారణ భూతకాల క్రియారూపానికి ఇది నేరమైన, సహజమైన అనువాదం.
- source_word: τοῖς στρατιώταις
  choice: సైనికులకు
  rationale: వారు కాపలాదారులుగా పనిచేసినప్పటికీ στρατιώταις యొక్క ప్రత్యక్ష అర్థం ‘సైనికులు’.
theological_decisions:
- issue: వ్యక్తపరచని కర్తను గుర్తించడం
  choice: ‘వారు’ అనేది ముందు వచనంలోని ప్రధాన యాజకులను సూచిస్తుంది
  alternative: గుర్తింపబడని ఒక సమూహం
  rationale: కృదంతాలు, ప్రధాన క్రియ పుంలింగ బహువచనంలో ఉన్నాయి; మత్తయి 28:11లో క్రియాశీల కర్తలైన ప్రధాన యాజకులే ఇక్కడ కూడా కొనసాగుతున్నారని సందర్భం సూచిస్తుంది. గ్రీకు పాఠం వారిని మళ్లీ పేరుతో పేర్కొననందున అనువాదంలో ‘వారు’ అని ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. కృదంతాల వరుసను సహజ తెలుగు కాలక్రమంగా వ్యక్తపరిచాం; లంచమనే ఉద్దేశాన్ని పాఠ్యంలో అదనంగా చేర్చలేదు.
