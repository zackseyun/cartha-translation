id: MAT.28.18
reference: Matthew 28:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: te
  text: 'యేసు వారి దగ్గరకు వచ్చి వారితో ఇలా అన్నాడు: “పరలోకంలోనూ భూమిమీదనూ ఉన్న సమస్త అధికారం నాకు ఇవ్వబడింది.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθὼν
  choice: వారి దగ్గరకు వచ్చి
  rationale: శిష్యుల వైపు కదలి సమీపించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: వారితో ఇలా అన్నాడు
  rationale: గ్రీకులోని ‘వారితో మాట్లాడి, చెబుతూ’ అనే నిర్మాణాన్ని తెలుగులో పునరుక్తి లేకుండా సహజంగా ప్రత్యక్ష వాక్యాన్ని పరిచయం చేసేలా అందిస్తుంది.
- source_word: Ἐδόθη μοι
  choice: నాకు ఇవ్వబడింది
  rationale: అఓరిస్ట్ కర్మణి రూపాన్ని స్పష్టంగా నిలుపుతూ, అధికారాన్ని స్వీకరించినవాడిగా యేసును చూపుతుంది; సందర్భంలో దాని ప్రస్తుత ఫలితం సహజంగానే గ్రహించబడుతుంది.
- source_word: πᾶσα ἐξουσία
  choice: సమస్త అధికారం
  rationale: ఏకవచన భావవాచక నామంతో πᾶσα సంపూర్ణతను సూచిస్తుంది; ἐξουσία బలం కంటే హక్కుతో కూడిన పాలనా అధికారాన్ని సూచిస్తుంది.
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: పరలోకంలోనూ భూమిమీదనూ
  rationale: రెండు సమస్త రంగాలను జతచేసే గ్రీకు నిర్మాణాన్ని సహజమైన, సమాంతర తెలుగు రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: యేసుకు సార్వత్రిక అధికారం కలిగిన విధానం
  choice: సమస్త అధికారం నాకు ఇవ్వబడింది
  alternative: సమస్త అధికారం నాది
  rationale: గ్రీకు కర్మణి క్రియను తొలగించకుండా, యేసుకు అధికారం ఇవ్వబడినదనే వాక్యంలోని సంబంధాత్మక మరియు దైవశాస్త్ర ఉద్రిక్తతను నిలుపుతుంది.
- issue: ἐξουσία యొక్క భావం
  choice: అధికారం
  alternative: శక్తి
  rationale: ఇక్కడ పదం కేవలం సామర్థ్యం లేదా బలాన్ని కాక, హక్కుతో కూడిన పరిపాలనాధికారాన్ని ప్రధానంగా సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరతను కాపాడే వాక్యనిర్మాణం. మూలంలో నిజమైన ప్రత్యామ్నాయ భావాన్ని అవసరంలేకుండా పాదటిప్పణిగా పెంచలేదు.
