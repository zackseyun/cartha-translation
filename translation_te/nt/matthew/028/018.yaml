  verdict: approve
  source_fidelity: ‘యేసు వారి దగ్గరకు వచ్చి’ accurately represents προσελθὼν, preserving Jesus’ movement toward those present. ‘వారితో ఇలా అన్నాడు’ naturally conveys ἐλάλησεν αὐτοῖς λέγων without unnecessary repetition in Telugu. ‘సమస్త అధికారం నాకు ఇవ్వబడింది’ retains the aorist passive Ἐδόθη μοι and correctly renders πᾶσα ἐξουσία as total authority. ‘పరలోకంలోనూ భూమిమీదనూ’ faithfully represents the paired realms ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς.
  naturalness: The wording is fluent, modern standard Telugu and has an appropriately dignified biblical register. The direct-speech introduction and the paired locative expression are idiomatic.
  terminology: ‘అధికారం’ is the right term for ἐξουσία here, expressing rightful authority rather than mere strength. ‘పరలోకం’ is established, clear Telugu biblical usage. The passive ‘ఇవ్వబడింది’ appropriately avoids adding an explicit giver not stated in this verse.
