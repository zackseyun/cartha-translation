id: MAT.28.1
reference: Matthew 28:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὀψὲ δὲ σαββάτων, τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων, ἦλθεν ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία θεωρῆσαι τὸν τάφον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: te
  text: విశ్రాంతిదినం గడిచిన తర్వాత[a], వారంలోని మొదటి రోజు తెల్లవారుతుండగా, మగ్దలేనా మరియ, ఇతర మరియ సమాధిని చూడడానికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విశ్రాంతిదినం చివర్లో, వారంలోని మొదటి రోజు తెల్లవారుతుండగా.’ ఆరంభంలోని గ్రీకు పదబంధాన్ని ‘విశ్రాంతిదినం గడిచిన తర్వాత’ అని గానీ, ‘విశ్రాంతిదినం చివర్లో’ అని గానీ అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: విశ్రాంతిదినం గడిచిన తర్వాత
  rationale: ὀψέ + షష్ఠీ విభక్తి ఇక్కడ ఒక కాలం గడిచిన తర్వాత అనే అర్థాన్ని ఇవ్వగలదు. σαββάτων రూపరీత్యా బహువచనమైనా, యూద గ్రీకు వాడుకలో ఏకవచన విశ్రాంతిదినాన్ని సూచించగలదు. δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని తెలుగులో ప్రత్యేక పదంతో బలవంతంగా వ్యక్తం చేయలేదు.
- source_word: τῇ ἐπιφωσκούσῃ
  choice: తెల్లవారుతుండగా
  rationale: ఈ సందర్భంలో ἐπιφώσκω పగటి వెలుగు మొదలవడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘తెల్లవారుతుండగా’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: εἰς μίαν σαββάτων
  choice: వారంలోని మొదటి రోజు
  rationale: μίαν σαββάτων అనేది వారంలోని మొదటి రోజును సూచించే సెమిటిక్ శైలి ప్రయోగం. εἰς సూచించే దిశాభావం ‘తెల్లవారుతుండగా’ అనే నిర్మాణంలో సహజంగా అంతర్భవిస్తుంది.
- source_word: ἦλθεν
  choice: వచ్చారు
  rationale: ἔρχομαι యొక్క భూతకాల కథన రూపానికి ‘వచ్చారు’ సరళమైన సమానం. కర్తలు ఇద్దరు కావడం వల్ల తెలుగులో బహువచనం వాడబడింది.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: మగ్దల మరియ
  rationale: స్థలనామంతో గుర్తించబడిన మరియను తెలుగులో స్థిరపడిన, సహజమైన రూపంలో ‘మగ్దల మరియ’గా ఇచ్చాం.
- source_word: ἡ ἄλλη Μαρία
  choice: మరో మరియ
  rationale: ἄλλη అంటే ‘మరొక/ఇతర’; ‘మరో మరియ’ ఆధునిక తెలుగులో సహజంగా ఉండి కథనంలోని వ్యక్తి భేదాన్ని నిలుపుతుంది.
- source_word: θεωρῆσαι
  choice: చూడడానికి
  rationale: θεωρέω ఉద్దేశపూర్వకంగా చూడడం లేదా గమనించడం అనే భావం కలిగిస్తుంది. ‘చూడడానికి’ చర్యను అతిశయింపకుండా ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: τὸν τάφον
  choice: సమాధిని
  rationale: τάφος ఇక్కడ యేసు ఉంచబడిన సమాధి స్థలాన్ని సూచిస్తుంది; ‘సమాధి’ ఆధునిక తెలుగు బైబిలు సందర్భంలో స్పష్టమైన పదం.
theological_decisions:
- issue: పునరుత్థాన కథనం ఆరంభంలోని కాల సూచన
  choice: విశ్రాంతిదినం గడిచిన తర్వాత, వారంలోని మొదటి రోజు తెల్లవారుతున్న సమయంగా అనువదించబడింది.
  alternative: ‘విశ్రాంతిదినం చివర్లో, వారంలోని మొదటి రోజు తెల్లవారుతుండగా’ అని కూడా అర్థం చేసుకోవచ్చు.
  rationale: ὀψὲ σαββάτων అనే గ్రీకు పదబంధం రెండు విధాలుగా అర్థం చేసుకోబడగలదు. ప్రధాన పాఠ్యంలో సందర్భానికి సరిపోయే ‘గడిచిన తర్వాత’ను ఎంచుకుని, నిజమైన భాషాత్మక సందిగ్ధతను పాదసూచికలో నిలిపాం; ఇతర సువార్తలతో కృత్రిమ సమన్వయం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన కథన శైలిలో అనువదించబడింది. గ్రీకు వాక్యంలోని కాలసంబంధ సందిగ్ధతను పాదసూచికతో భద్రపరిచాం.
