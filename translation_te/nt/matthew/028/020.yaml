id: MAT.28.20
reference: Matthew 28:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: te
  text: నేను మీకు ఆజ్ఞాపించినవన్నీ పాటించమని వారికి బోధించండి. ఇదిగో, యుగం ముగింపు వరకు[a] ప్రతి రోజూ నేను మీతో ఉన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యుగ సమాప్తి వరకు.’ సంప్రదాయంగా, ‘లోకాంతం వరకు.’ గ్రీకులోని αἰών అనే పదం ఇక్కడ ప్రత్యేకంగా భౌతిక లోకాన్ని కాక, ఒక యుగాన్ని సూచిస్తుంది.
    reason: సυντέλεια యొక్క సమాప్తి/పరిపూర్ణ ముగింపు భావాన్ని సూచించడానికి, అలాగే αἰώνను ‘లోకం’గా తీసుకునే సంప్రదాయ అనువాదాన్ని వివరిచేందుకు.
lexical_decisions:
- source_word: διδάσκοντες
  choice: బోధిస్తూ
  rationale: వర్తమాన కృదంతం మునుపటి వాక్యంలోని శిష్యులను చేయడం ఎలా కొనసాగాలో తెలియజేస్తుంది; ‘బోధిస్తూ’ దాని నిరంతర ప్రక్రియను సహజంగా నిలుపుతుంది.
- source_word: τηρεῖν
  choice: పాటించమని
  rationale: ఆజ్ఞలను జాగ్రత్తగా కాపాడుతూ ఆచరించడం, విధేయత చూపడం అనే భావాలను సందర్భానుసారంగా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πάντα ὅσα
  choice: ఆజ్ఞాపించినవన్నీ
  rationale: ‘అన్నీ’ అనే సమగ్ర పరిధిని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐνετειλάμην
  choice: నేను మీకు ఆజ్ఞాపించిన
  rationale: యేసు ఇచ్చిన ఉపదేశంలోని అధికారపూర్వక బలాన్ని ‘ఆజ్ఞాపించిన’ స్పష్టంగా నిలుపుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: తరువాతి హామీపై గంభీరంగా దృష్టి నిలిపే గ్రీకు సంభాషణా సూచకానికి సహజమైన తెలుగు సమానం.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: నేను మీతో ఉన్నాను
  rationale: శిష్యులతో యేసు ఉనికిని సూటిగా తెలియజేస్తుంది; కాలపరంగా కొనసాగుతున్న హామీని వర్తమాన రూపంలోనే ఉంచుతుంది.
- source_word: πάσας τὰς ἡμέρας
  choice: ప్రతి రోజూ
  rationale: అక్షరార్థంగా ‘అన్ని రోజులు’; తెలుగులో ‘ప్రతి రోజూ’ సహజంగా ఉండి, రోజు రోజుకూ కొనసాగే ఉనికిని నిలుపుతుంది.
- source_word: συντελείας
  choice: ముగింపు
  rationale: ఒక కాలం తన నిర్ణీత అంతానికి చేరడాన్ని సూచిస్తుంది. ‘ముగింపు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండగా, ‘పరిపూర్ణత’ అనే ప్రత్యామ్నాయ ఛాయను పాదటీపులో నిలిపాం.
- source_word: αἰῶνος
  choice: యుగం
  rationale: ఇక్కడ αἰών భౌతిక ప్రపంచాన్ని కాక ఒక యుగాన్ని లేదా కాలవ్యవస్థను సూచిస్తుంది; అందువల్ల ‘లోకం’ కంటే ‘యుగం’ మూలానికి దగ్గరగా ఉంది.
theological_decisions:
- issue: ἕως τῆς συντελείας τοῦ αἰῶνος అనే కాలసూచక పదబంధం
  choice: ఈ యుగం ముగింపు వరకు
  alternative: 'ఈ యుగం పరిపూర్ణత వరకు; సంప్రదాయ అనువాదం: లోకాంతం వరకు'
  rationale: ఈ పదబంధం భౌతిక లోక నాశనాన్ని ప్రత్యేకంగా చెప్పదు; ప్రస్తుత యుగం నిర్ణీత ముగింపుకు చేరడాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన ‘యుగం ముగింపు’ను ఉంచి, συντέλεια లోని పరిపూర్ణ ముగింపు ఛాయను పాదటీపులో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని కృదంత సంబంధాన్ని ‘బోధిస్తూ’తో, గంభీర దృష్టి సూచకాన్ని ‘ఇదిగో’తో నిలిపాం. ‘ప్రతి రోజూ’ అక్షరార్థంలోని రోజు-రోజుకూ కొనసాగే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
