id: MAT.28.15
reference: Matthew 28:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: te
  text: అయితే వారు ఆ వెండిని తీసుకొని, తమకు ఆదేశించినట్లే చేశారు. ఈ కథనం[a] యూదుల మధ్య నేటి వరకూ వ్యాపించి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ వార్త.’ గ్రీకు λόγος అనే పదానికి సందర్భాన్ని బట్టి ‘మాట,’ ‘వార్త,’ ‘నివేదిక,’ లేదా ‘కథనం’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: తీసుకొని
  rationale: Aorist participle ప్రధాన క్రియకు ముందు జరిగిన చర్యను సూచిస్తుంది. మునుపటి వచనంలో యాజకులు ఇచ్చిన వెండిని వారు తీసుకున్నారనే కథన క్రమాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: τὰ ἀργύρια
  choice: ఆ వెండిని
  rationale: ἀργύρια వెండి లేదా వెండి రూపంలోని ధనాన్ని సూచిస్తుంది. సందర్భం వల్ల నిర్దిష్టతను చూపేందుకు ‘ఆ’ వాడి, గ్రీకు పదంలోని concrete wording‌ను నిలిపాం; ‘వెండి నాణేలు’ అనడం మూలం కంటే మరీ నిర్దిష్టం.
- source_word: ἐποίησαν
  choice: చేశారు
  rationale: ποιέω ఇక్కడ చెప్పినదాన్ని చేయడం లేదా అమలు చేయడం అనే సాధారణ అర్థంలో ఉంది; తదుపరి పదబంధంతో సహజంగా కలుస్తుంది.
- source_word: ὡς ἐδιδάχθησαν
  choice: తమకు ఆదేశించినట్లే
  rationale: διδάσκω passive రూపం ‘బోధించబడడం’ లేదా ‘సూచించబడడం’ అని అర్థమవుతుంది. ఏమి చెప్పాలో వారికి నిర్దేశించిన ఈ సందర్భంలో ‘ఆదేశించినట్లు’ సహజమైనది.
- source_word: διεφημίσθη
  choice: వ్యాపించి ఉంది
  rationale: ఈ క్రియ ఒక వార్త లేదా కథనం విస్తృతంగా ప్రచారమవడాన్ని సూచిస్తుంది. ‘నేటి వరకూ’ అనే కాలవ్యాప్తితో కలిసి, గతంలో మొదలై రచయిత కాలం వరకు కొనసాగిన ప్రభావాన్ని ‘వ్యాపించి ఉంది’ తెలుపుతుంది.
- source_word: ὁ λόγος οὗτος
  choice: ఈ కథనం
  rationale: λόγος కు మాట, నివేదిక, కథనం వంటి అర్థాలు ఉన్నాయి. ఇక్కడ కావలివారు ప్రచారం చేసిన వివరణను సూచించేందుకే ‘కథనం’ ఎంచుకున్నాం; నిజమని లేదా అబద్ధమని పదమే ముందుగా తీర్పు ఇవ్వదు.
- source_word: παρὰ Ἰουδαίοις
  choice: యూదుల మధ్య
  rationale: παρά + dative ఇక్కడ ఒక సమాజం మధ్య లేదా వారి వర్గాల్లో అనే అర్థం ఇస్తుంది. ఇది కథనంలోని ప్రచార పరిధిని మాత్రమే సూచిస్తుంది.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: నేటి వరకూ
  rationale: రచయిత ప్రస్తుత కాలం వరకు కొనసాగిందని తెలిపే సహజమైన తెలుగు కాలవ్యక్తీకరణ.
theological_decisions:
- issue: Ἰουδαίοις అనే పదం విస్తృత యూదు వ్యతిరేక సాధారణీకరణగా వినిపించే అవకాశం
  choice: యూదుల మధ్య
  alternative: యూద ప్రజల మధ్య; యూదయుల మధ్య
  rationale: మూలపదానికి ప్రత్యక్షమైన అర్థాన్ని ఉంచుతూ, వాక్యాన్ని ఆ కథనం ఒక సమాజంలో వ్యాపించిందనే చారిత్రక-కథన పరిమితిలోనే ఉంచాం. ‘యూదయులు’ ఇక్కడ అనవసరంగా భౌగోళిక అర్థాన్ని ముందుకు తెచ్చే అవకాశం ఉంది.
- issue: λόγος యొక్క భావాన్ని నిజం లేదా అబద్ధమని ముందే నిర్ణయించకుండా అనువదించడం
  choice: కథనం
  alternative: వార్త; నివేదిక; మాట
  rationale: సందర్భంలో ఇది కావలివారు చెప్పిన వివరణను సూచిస్తుంది. ‘కథనం’ దాని ప్రసార స్వభావాన్ని తెలుపుతూ, పదం యొక్క నిజాసత్యంపై అనువాదంలో అదనపు తీర్పు చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘వెండి నాణేలు’ అని మూలానికి మించిన నిర్దిష్టతను చేర్చకుండా ‘ఆ వెండి’ అని ఉంచాం. ‘కథనం’ వద్ద [a] గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
