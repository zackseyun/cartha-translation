id: MAT.24.6
reference: Matthew 24:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: te
  text: మీరు యుద్ధాల గురించి, యుద్ధాల వార్తల గురించి వినబోతారు.[a] మీరు కలవరపడకుండా జాగ్రత్తపడండి. ఎందుకంటే ఇవి జరగవలసిందే; అయితే అంతం ఇంకా రాలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యుద్ధాల వదంతుల గురించి.” గ్రీకు పదబంధం వార్తలు, నివేదికలు లేదా వదంతులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μελλήσετε
  choice: వినబోతారు
  rationale: μέλλω యొక్క భవిష్యదర్థక, ఎదురుచూడబడుతున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀκούειν
  choice: గురించి వినబోతారు
  rationale: ఇక్కడ ప్రత్యక్షంగా శబ్దం వినడం కాక, యుద్ధాల సమాచారం అందడం అనే భావం ఉంది.
- source_word: πολέμους
  choice: యుద్ధాలు
  rationale: πόλεμος సాధారణంగా ఒకే పోరాటం కంటే విస్తృతమైన యుద్ధాన్ని సూచిస్తుంది.
- source_word: ἀκοὰς πολέμων
  choice: యుద్ధాల వార్తలు
  rationale: ἀκοή ఇక్కడ విన్న సమాచారం, వార్త, నివేదిక అనే విస్తృత భావాన్ని కలిగి ఉంది; అసత్యమనే భావాన్ని తప్పనిసరిగా సూచించదు.
- source_word: ὁρᾶτε, μὴ θροεῖσθε
  choice: మీరు కలవరపడకుండా చూసుకోండి
  rationale: హెచ్చరికను పరిచయం చేసే ὁρᾶτε భావాన్నీ, భయాందోళనకు గురికాకూడదనే θροεῖσθε భావాన్నీ సహజంగా కలిపి వ్యక్తపరుస్తుంది.
- source_word: δεῖ γὰρ γενέσθαι
  choice: ఎందుకంటే ఇవి జరగడం తప్పనిసరి
  rationale: δεῖ తెలిపే అనివార్యతను స్పష్టంగా ఉంచుతుంది. గ్రీకులో ప్రత్యక్ష కర్త లేకపోయినా, సందర్భంలోని యుద్ధాలు మరియు వాటి వార్తలను సూచించేందుకు తెలుగులో ‘ఇవి’ సహజంగా పూరించబడింది.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: అయితే అంతం ఇంకా రాలేదు
  rationale: τέλος యొక్క విస్తృత అంత్యకాల భావాన్ని నిర్దిష్ట సిద్ధాంత పద్ధతికి పరిమితం చేయకుండా సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: τὸ τέλος యొక్క అంత్యకాల అర్థం
  choice: అంతం
  alternative: అంతిమ పరిసమాప్తి
  rationale: గ్రీకు పదబంధంలాగే అర్థాన్ని విస్తృతంగా ఉంచి, దానిని ఏదైనా ప్రత్యేక సహస్రాబ్ద లేదా శ్రమకాల పద్ధతికి పరిమితం చేయదు.
- issue: δεῖ తెలిపే అనివార్యత
  choice: జరగడం తప్పనిసరి
  alternative: జరగాలి
  rationale: దైవిక ప్రణాళిక అనే నిర్దిష్ట వివరణను వాక్యంలో చేర్చకుండా, మూలంలోని అవసరత లేదా అనివార్యతను మాత్రమే వ్యక్తపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘కలవరపడకుండా చూసుకోండి’ హెచ్చరిక యొక్క బలాన్ని అతిశయింపకుండా నిలుపుతుంది; ‘అంతం’ అనే పదం మూలంలోని ఉద్దేశపూర్వక విస్తృతతను కాపాడుతుంది.
