revisions:
- from: మీరు యుద్ధాల గురించి, యుద్ధాల వార్తల గురించి వినబోతారు.[a] మీరు కలవరపడకుండా చూసుకోండి. ఎందుకంటే ఇవి జరగడం తప్పనిసరి; అయితే అంతం ఇంకా రాలేదు.
  to: మీరు యుద్ధాల గురించి, యుద్ధాల వార్తల గురించి వినబోతారు.[a] మీరు కలవరపడకుండా జాగ్రత్తపడండి. ఎందుకంటే ఇవి జరగవలసిందే; అయితే అంతం ఇంకా రాలేదు.
  rationale: 'Two small idiomatic revisions improve modern Telugu flow: the imperative warning is rendered more naturally, and the necessity clause is made less abstract. The translation continues to distinguish wars from reports of wars, retains the source’s broad eschatological ‘end,’ and preserves the lexical alternative at the same anchor.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:44:14Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prospective force of μελλήσετε, the distinction between wars and reports/news of wars, the warning not to be alarmed, the necessity expressed by δεῖ, and the not-yet character of τὸ τέλος. The contextual plural ‘ఇవి’ is a permissible Telugu clarification of the unstated subject of γενέσθαι and does not impose a theological interpretation.
  naturalness: The verse is generally clear and modern. However, ‘కలవరపడకుండా చూసుకోండి’ is somewhat literal and less idiomatic as an exhortation in modern standard Telugu. ‘కలవరపడకుండా జాగ్రత్తపడండి’ is more natural while retaining the imperative warning. ‘జరగవలసిందే’ is also more idiomatic and direct than the abstract construction ‘జరగడం తప్పనిసరి.’
  terminology: ‘యుద్ధాలు,’ ‘వార్తలు,’ ‘కలవరపడడం,’ and ‘అంతం’ are suitable modern-standard Telugu choices. ‘అంతం’ appropriately preserves the Greek phrase’s breadth. The footnote properly retains ‘వదంతులు’ as a lexical alternative without making it the main reading.
  issues:
  - severity: low
    issue: The warning phrase is slightly literal in Telugu.
    rationale: ‘కలవరపడకుండా చూసుకోండి’ can be understood, but ‘కలవరపడకుండా జాగ్రత్తపడండి’ is a more idiomatic modern Telugu exhortation for ὁρᾶτε, μὴ θροεῖσθε.
  - severity: low
    issue: The necessity clause uses an unnecessarily abstract expression.
    rationale: ‘ఇవి జరగవలసిందే’ communicates δεῖ γενέσθαι naturally and forcefully, without changing the contextual reference or adding a doctrinal explanation.
  revised_text: మీరు యుద్ధాల గురించి, యుద్ధాల వార్తల గురించి వినబోతారు.[a] మీరు కలవరపడకుండా జాగ్రత్తపడండి. ఎందుకంటే ఇవి జరగవలసిందే; అయితే అంతం ఇంకా రాలేదు.
