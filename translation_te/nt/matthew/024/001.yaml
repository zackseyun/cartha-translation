id: MAT.24.1
reference: Matthew 24:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: te
  text: యేసు దేవాలయం నుండి బయటికి వచ్చి వెళ్లిపోతుండగా,[a] ఆయన శిష్యులు దేవాలయ భవనాలను ఆయనకు చూపించడానికి ఆయన దగ్గరికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “దేవాలయం” అని అనువదించిన గ్రీకు పదం ἱερόν; ఇది అంతరాలయాన్ని మాత్రమే కాక దేవాలయ ప్రాంగణ సముదాయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: బయటికి వచ్చి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన అనుబంధ చర్యను సహజమైన తెలుగులో తెలియజేస్తూ, బయటకు రావడం అనే దిశాభావాన్ని నిలుపుతుంది.
- source_word: ἱεροῦ
  choice: దేవాలయం
  rationale: ἱερόν ఇక్కడ అంతరాలయాన్ని మాత్రమే కాక మొత్తం దేవాలయ ప్రాంగణ సముదాయాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యంలో సహజమైన ప్రామాణిక పదాన్ని ఉంచి, విస్తృత అర్థాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
- source_word: ἐπορεύετο
  choice: వెళ్లిపోతుండగా
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న కదలికను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; యేసు అక్కడి నుండి దూరంగా వెళ్తున్న భావాన్నీ నిలుపుతుంది.
- source_word: προσῆλθον
  choice: దగ్గరికి వచ్చారు
  rationale: προσέρχομαιలోని సమీపించడం అనే భావాన్ని స్పష్టమైన, సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ἐπιδεῖξαι
  choice: చూపించడానికి
  rationale: శిష్యులు దగ్గరికి వచ్చిన ఉద్దేశాన్ని తెలిపే గ్రీకు ఉద్దేశార్థక క్రియారూపాన్ని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: οἰκοδομὰς
  choice: భవనాలను
  rationale: దేవాలయ సముదాయంలోని నిర్మిత కట్టడాలను సూచించే సందర్భోచితమైన, సాధారణ తెలుగు పదం.
- source_word: τοῦ ἱεροῦ
  choice: దేవాలయ
  rationale: ఆ భవనాలు దేవాలయ సముదాయానికి చెందినవని తెలిపే సంబంధాన్ని సహజమైన తెలుగు సమాస నిర్మాణంతో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ἱερόν మరియు ναός మధ్య అర్థభేదం
  choice: ప్రధాన పాఠ్యంలో “దేవాలయం”; పాదటిప్పణిలో దేవాలయ ప్రాంగణ సముదాయం అనే వివరణ
  alternative: దేవాలయ ప్రాంగణ సముదాయం
  rationale: మూలంలో ἱερόν మొత్తం దేవాలయ ప్రాంగణాన్ని సూచిస్తుంది, అంతరాలయాన్ని మాత్రమే కాదు. చదవడానికి సహజంగా ఉండే “దేవాలయం”ను ప్రధాన పాఠ్యంలో ఉంచి, మూలపదంలోని విస్తృతిని పాదటిప్పణిలో సంరక్షించడం అనవసరమైన మతశాస్త్ర నిర్ధారణను నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. “వెళ్లిపోతుండగా” కొనసాగుతున్న చర్యను చూపుతుంది; “ఆయన దగ్గరికి” అనే రూపం సూచ్యపురుషుడిని స్పష్టంగా ఉంచుతుంది.
