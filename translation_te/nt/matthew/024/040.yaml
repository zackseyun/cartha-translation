revisions:
- from: అప్పుడు ఇద్దరు పురుషులు పొలంలో ఉంటారు; ఒకడు తీసుకోబడతాడు[a], మరొకడు విడిచిపెట్టబడతాడు.
  to: అప్పుడు ఇద్దరు పురుషులు పొలంలో ఉంటారు; ఒకడు తీసుకోబడతాడు[a], మరొకడు వదిలివేయబడతాడు.
  rationale: The revision retains the source’s concise masculine contrast and the deliberate ambiguity of παραλαμβάνεται, while using a more neutral Telugu rendering for ἀφίεται and smoothing the footnote’s modern-standard Telugu phrasing.
  reviewer_model: gpt-5.6-terra
