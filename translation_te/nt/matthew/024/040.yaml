  text: τότε ⸂δύο ἔσονται⸃ ἐν τῷ ἀγρῷ, ⸀εἷς παραλαμβάνεται καὶ ⸁εἷς ἀφίεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: te
  text: అప్పుడు ఇద్దరు పురుషులు పొలంలో ఉంటారు; ఒకడు తీసుకోబడతాడు[a], మరొకడు వదిలివేయబడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెంట తీసుకోబడతాడు.” ఈ క్రియ ఒక్కటే అతడు రక్షణ కోసం తీసుకోబడుతున్నాడా లేక తీర్పు కోసం తీసుకోబడుతున్నాడా అనేది నిర్దేశించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: ముందున్న అంత్యకాల సందర్భంతో ఈ మాటను అనుసంధానించే కాలసూచక క్రియావిశేషణాన్ని సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: δύο ἔσονται
  choice: ఇద్దరు పురుషులు ఉంటారు
  rationale: గ్రీకులో నేరుగా ‘ఇద్దరు ఉంటారు’ అని ఉన్నప్పటికీ, తరువాతి εἷς … εἷς రూపాలు పుంలింగంలో ఉన్నాయి; తదుపరి వచనంలోని స్త్రీల సమాంతర దృశ్యం కూడా ఇక్కడ పురుషులనే సూచిస్తుంది. తెలుగులో ‘ఇద్దరు పురుషులు’ అనడం ఈ వ్యాకరణ సూచనను స్పష్టం చేస్తుంది.
- source_word: ἐν τῷ ἀγρῷ
  choice: పొలంలో
  rationale: స్థలాన్ని తెలిపే గ్రీకు పదబంధానికి సూటిగా, సహజంగా సరిపోతుంది.
- source_word: εἷς … εἷς
  choice: ఒకడు … మరొకడు
  rationale: పుంలింగ ఏకవచన రూపాన్ని తెలుగులో కచ్చితంగా చూపిస్తూ, ఇద్దరి మధ్య వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παραλαμβάνεται
  choice: తీసుకోబడతాడు
  rationale: భవిష్య సందర్భంలో వాడిన వర్తమాన కర్మణి రూపాన్ని తెలుగులో సహజంగా అందిస్తుంది. తీసుకోవడం రక్షణకో తీర్పుకో అన్నది తేల్చకుండా మూలంలోని సందిగ్ధతను నిలుపుతుంది.
- source_word: ἀφίεται
  choice: విడిచిపెట్టబడతాడు
  rationale: ఈ సందర్భంలో ‘వదిలివేయబడటం’ అనే భావాన్ని వ్యక్తం చేస్తుంది; ‘వెనుక విడిచిపెట్టబడతాడు’ వంటి ఆధునిక అంత్యకాల సిద్ధాంత సంబంధిత అదనపు భావాన్ని చేర్చదు.
theological_decisions:
- issue: παραλαμβάνεται అనే క్రియ రక్షణను సూచిస్తుందా లేక తీర్పును సూచిస్తుందా
  choice: ప్రధాన పాఠ్యంలో తటస్థమైన ‘తీసుకోబడతాడు’ అనే అనువాదాన్ని ఉంచడం
  alternative: ‘తీర్పుకు తీసుకుపోబడతాడు’ లేదా ‘రక్షణ కోసం వెంట తీసుకుపోబడతాడు’
  rationale: నోవహు దినాలతో చేసిన పోలిక సహా సమీప సందర్భాన్ని ఎలా అర్థం చేసుకోవాలనే విషయంలో భిన్న అభిప్రాయాలు ఉన్నాయి. గ్రీకు క్రియ ఒక్కటే తీసుకోవడం రక్షణకో తీర్పుకో నిర్దేశించదు; కాబట్టి అనువాదం ఆ వేదాంత ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
- issue: గ్రీకులోని పుంలింగ సూచనను తెలుగులో స్పష్టం చేయాలా
  choice: ‘ఇద్దరు పురుషులు’ అని అనువదించడం
  alternative: ‘ఇద్దరు’ అని మాత్రమే అనువదించడం
  rationale: δύο అనే సంఖ్యావాచకం స్వతహాగా ‘పురుషులు’ అని చెప్పకపోయినా, εἷς … εἷς అనే పుంలింగ రూపాలు మరియు తదుపరి వచనంలోని స్త్రీల సమాంతర ఉదాహరణ ఇక్కడ పురుషుల దృశ్యాన్ని సూచిస్తున్నాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం ఉపయోగించబడింది. ‘ఒకడు … మరొకడు’ అనే రూపం సంక్షిప్తమైన గ్రీకు వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది; వేదాంతపరంగా భారితమైన పదబంధాలు నివారించబడ్డాయి.
