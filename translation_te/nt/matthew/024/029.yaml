review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the sequence and cosmic imagery overall, but “ఆ రోజుల శ్రమ ముగిసిన వెంటనే” adds the explicit idea that the tribulation has ended. The Greek says “immediately after the tribulation of those days,” without stating it as “when it ended.” The final clause should also avoid the overly locative “ఆకాశమండలాల్లోని,” which can suggest powers situated within heavenly spheres rather than the deliberately broad genitive phrase “powers of the heavens.”
  naturalness: Most of the Telugu is clear and suitably solemn. “ఆ రోజుల శ్రమ తరువాత వెంటనే” is both more source-faithful and natural. “సూర్యుడు చీకటిపడతాడు,” “చంద్రుడు తన వెలుగును ఇవ్వడు,” and “నక్షత్రాలు ఆకాశం నుండి రాలిపోతాయి” are idiomatic modern-standard Telugu.
  terminology: “శ్రమ” appropriately conveys θλῖψις without imposing a doctrinal scheme. “ఆకాశమండలాల శక్తులు” better represents αἱ δυνάμεις τῶν οὐρανῶν while retaining its ambiguity. The note should describe possible referents without deciding among cosmic forces, heavenly bodies, or heavenly powers.
  issues:
  - severity: medium
    issue: The wording “ముగిసిన వెంటనే” adds an explicit completion element.
    rationale: μετὰ τὴν θλῖψιν means “after the tribulation”; although completion may be inferable temporally, it is not lexically stated and should not be added in an optimal-equivalence rendering.
  - severity: low
    issue: “ఆకాశమండలాల్లోని శక్తులు” is more narrowly locative than the Greek genitive phrase.
    rationale: The Greek can denote powers/forces of the heavens and is intentionally broad. “ఆకాశమండలాల శక్తులు” preserves the genitive relation and ambiguity more closely.
  - severity: low
    issue: Footnote a supplies an unnecessary alternative for wording that should simply be corrected in the main text.
    rationale: Once the main text is rendered as “ఆ రోజుల శ్రమ తరువాత వెంటనే,” no footnote is needed; retaining it would foreground an avoidable and less direct formulation.
  revised_text: అయితే, ఆ రోజుల శ్రమ తరువాత వెంటనే, సూర్యుడు చీకటిపడతాడు, చంద్రుడు తన వెలుగును ఇవ్వడు, నక్షత్రాలు ఆకాశం నుండి రాలిపోతాయి, ఆకాశమండలాల శక్తులు కదిలించబడతాయి[b].
  revised_footnotes:
