id: MAT.24.29
reference: Matthew 24:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: te
  text: అయితే, ఆ రోజుల శ్రమ తరువాత వెంటనే, సూర్యుడు చీకటిపడతాడు, చంద్రుడు తన వెలుగును ఇవ్వడు, నక్షత్రాలు ఆకాశం నుండి రాలిపోతాయి, ఆకాశమండలాల శక్తులు కదిలించబడతాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘ఆకాశమండలాల శక్తులు’ అనేది ఖగోళ శక్తులను, ఆకాశ వస్తువులను లేదా పరలోక శక్తులను సూచించవచ్చు; గ్రీకు పదబంధం ఉద్దేశపూర్వకంగా విస్తృతార్థాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: అయితే ... వెంటనే
  rationale: Εὐθέως లోని బలమైన తక్షణ కాలభావాన్ని ‘వెంటనే’ సహజంగా తెలియజేస్తుంది; δὲ సూచించే స్వల్ప వ్యత్యాసంతో కూడిన కొనసాగింపును ‘అయితే’ ప్రతిబింబిస్తుంది.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: ఆ రోజుల శ్రమ ముగిసిన వెంటనే
  rationale: μετά తో కూడిన కాలప్రయోగాన్ని సహజమైన తెలుగులో ‘ముగిసిన వెంటనే’గా వ్యక్తం చేస్తూ, θλῖψις లోని బాధాకరమైన ఒత్తిడి/విపత్తు భావానికి సాధారణ పాఠకులకు స్పష్టమైన ‘శ్రమ’ను ఎంచుకున్నాం.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: సూర్యుడు చీకటిపడతాడు
  rationale: భవిష్యత్ నిష్క్రియార్థాన్ని తెలుగులో సహజంగా వినిపించే అకర్మక రూపం ద్వారా తెలియజేస్తుంది; ప్రవచన గాంభీర్యాన్ని నిలుపుతుంది.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: చంద్రుడు తన వెలుగును ఇవ్వడు
  rationale: మూలంలోని ‘తన వెలుగును ఇవ్వదు’ అనే చిత్రణను దాదాపు నేరుగా, స్పష్టంగా నిలుపుతుంది.
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: నక్షత్రాలు ఆకాశం నుండి రాలిపోతాయి
  rationale: πεσοῦνται యొక్క భవిష్యత్ భావాన్ని, అనేక నక్షత్రాల పతన చిత్రాన్ని సహజమైన తెలుగు ‘రాలిపోతాయి’తో అందిస్తుంది; οὐρανός కు ఈ సందర్భంలో ‘ఆకాశం’ స్పష్టమైన ఎంపిక.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: ఆకాశమండలాల్లోని శక్తులు
  rationale: ‘శక్తులు’ δύναμεις యొక్క విస్తృతార్థాన్ని నిలుపుతుంది; ‘ఆకాశమండలాలు’ οὐρανῶν అనే బహువచనాన్ని సూచిస్తూ, ఖగోళ శక్తులా, పరలోక అధికారాలా అన్నదాన్ని నిర్ణయించదు.
- source_word: σαλευθήσονται
  choice: కదిలించబడతాయి
  rationale: గ్రీకు భవిష్యత్ నిష్క్రియ రూపాన్ని నిలుపుతూ, కుదుపు లేదా అస్థిరత అనే విస్తృత భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: అపోకలిప్టిక్ వాక్యంలో ఖగోళ సూచనల స్వభావం
  choice: చిత్రణను నేరుగా నిలుపుతూ, అది అక్షరార్థ ఖగోళ కల్లోలమా, ప్రవచనాత్మక ప్రతీకా, లేక రెండూ కలిసినదా అని నిర్ణయించలేదు.
  alternative: దీనిని కేవలం అక్షరార్థ ఖగోళ పతనంగా లేదా కేవలం రాజకీయ/న్యాయతీర్పు కల్లోలానికి ప్రతీకగా అనువదించడం.
  rationale: మూలవాక్యం స్థిరమైన ప్రవచనాత్మక-అపోకలిప్టిక్ చిత్రభాషను ఉపయోగిస్తుంది; అనువాదం ఏ ప్రత్యేక అంత్యకాల వ్యవస్థనూ చొప్పించకుండా ఆ ఉద్రిక్తతను కాపాడాలి.
- issue: ‘ఆకాశమండలాల్లోని శక్తులు’ అనే పదబంధం సూచించే అంశాలు
  choice: అర్థాన్ని విస్తృతంగానే ఉంచడం.
  alternative: దీనిని దేవదూతల అధికారాలు, ఖగోళ వస్తువులు, లేదా ప్రకృతి శక్తులు అని నిర్దిష్టీకరించడం.
  rationale: గ్రీకు పదబంధం ఉద్దేశపూర్వకంగా విస్తృతంగా ఉండవచ్చు; ఒకే సూచనను ఖరారు చేయడం మూలంలోని నిజమైన అస్పష్టతను తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రవచన శైలిని ఉపయోగించాం. అరుదైన మతపారిభాషిక పదాలకు బదులుగా సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఎంచుకున్నాం; అయితే అపోకలిప్టిక్ చిత్రణలోని అస్పష్టతను పాదటిప్పణి ద్వారా నిలిపాం.
