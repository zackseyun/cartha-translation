revisions:
- from: అయితే ఆ రోజుల శ్రమ ముగిసిన వెంటనే[a], సూర్యుడు చీకటిపడతాడు, చంద్రుడు తన వెలుగును ఇవ్వడు, నక్షత్రాలు ఆకాశం నుండి రాలిపోతాయి, ఆకాశమండలాల్లోని శక్తులు కదిలించబడతాయి[b].
  to: అయితే, ఆ రోజుల శ్రమ తరువాత వెంటనే, సూర్యుడు చీకటిపడతాడు, చంద్రుడు తన వెలుగును ఇవ్వడు, నక్షత్రాలు ఆకాశం నుండి రాలిపోతాయి, ఆకాశమండలాల శక్తులు కదిలించబడతాయి[b].
  rationale: The revision removes the added assertion that the tribulation has ended, retains the immediate temporal force of Εὐθέως, and renders the final genitive phrase in a way that preserves its apocalyptic breadth. The unnecessary first footnote is removed, while the remaining footnote is retained and adjusted to reflect the source ambiguity without interpretation.
  reviewer_model: gpt-5.6-terra
