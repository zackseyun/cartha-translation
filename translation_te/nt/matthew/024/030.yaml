id: MAT.24.30
reference: Matthew 24:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: te
  text: అప్పుడు మనుష్యకుమారుని చిహ్నం ఆకాశంలో[a] కనిపిస్తుంది. అప్పుడు భూమిమీద ఉన్న గోత్రాలన్నీ[b] విలపిస్తాయి. వారు మనుష్యకుమారుడు శక్తితోను గొప్ప మహిమతోను ఆకాశపు మేఘాలపై వస్తుండడాన్ని[c] చూస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరలోకంలో.’ గ్రీకు పదం οὐρανός సందర్భాన్ని బట్టి ‘ఆకాశం’ లేదా ‘పరలోకం’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేశంలోని గోత్రాలన్నీ.’ గ్రీకు పదం γῆకి ‘భూమి,’ ‘నేల,’ లేదా ‘దేశం’ అనే అర్థాలు ఉండవచ్చు.
    reason: alternative_reading
  - marker: c
    text: ‘ఆకాశపు మేఘాలపై వస్తుండడాన్ని’ అనే మాటలు దానియేలు 7:13ను ప్రతిధ్వనింపజేస్తాయి.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: కనిపిస్తుంది
  rationale: ఈ సందర్భంలో క్రియకు ‘ప్రత్యక్షమవుతుంది/కనిపిస్తుంది’ అనే అకర్మక భావం ఉంది; ‘కనిపిస్తుంది’ ఆధునిక తెలుగులో సహజంగా ఉండి దృశ్య ప్రత్యక్షతను తెలియజేస్తుంది.
- source_word: σημεῖον
  choice: సూచకచిహ్నం
  rationale: ‘చిహ్నం’ అనే ప్రాథమిక భావంతో పాటు అది ఏదో విషయాన్ని సూచిస్తుందనే అర్థాన్ని స్పష్టంగా అందిస్తుంది; ‘శకునం’ అనవసరమైన ప్రతికూల భావాన్ని చేర్చవచ్చు.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుని
  rationale: గ్రీకు షష్ఠీ నిర్మాణాన్ని అలాగే ఉంచి, అది మనుష్య కుమారునికి సంబంధించిన చిహ్నమా లేక ఆయనే చిహ్నమా అనే అస్పష్టతను పరిష్కరించకుండా నిలుపుతుంది.
- source_word: ἐν τῷ οὐρανῷ
  choice: ఆకాశంలో
  rationale: οὐρανός ఇక్కడ కనిపించే స్థలాన్ని సూచిస్తుంది; ‘ఆకాశం’ ఆధునిక తెలుగులో సహజమైన ఎంపిక. ‘పరలోకం’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: κόψονται
  choice: రోదిస్తాయి
  rationale: ఈ మధ్యమ ప్రయోగం దుఃఖించి విలపించడాన్ని సూచిస్తుంది. ‘రోదిస్తాయి’ భావాన్ని సహజంగా అందిస్తుంది; ఛాతీ కొట్టుకోవడం వంటి నిర్దిష్ట హావను ప్రధాన వచనంలో చేర్చదు.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: భూమిమీద ఉన్న గోత్రాలన్నీ
  rationale: φυλή యొక్క ‘గోత్రం’ భావాన్ని నిలుపుతూ, γῆకి ఈ విశ్వవ్యాప్త సందర్భంలో ‘భూమి’ని ఎంచుకుంది. ‘దేశం/నేల’ అనే పరిమిత భావాన్ని పాదసూచికలో సూచించాం.
- source_word: ὄψονται
  choice: చూస్తారు
  rationale: సాధారణ భవిష్యత్ దృశ్యగ్రహణాన్ని ఆధునిక, సూటి తెలుగులో తెలియజేస్తుంది.
- source_word: ἐρχόμενον
  choice: వస్తుండడం
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న చర్య భావాన్ని తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: ఆకాశమేఘాల మీద
  rationale: ἐπί యొక్క స్థలార్థాన్ని నేరుగా నిలుపుతూ దానియేలు 7:13లోని ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: శక్తితో, గొప్ప మహిమతో
  rationale: πολλῆς నేరుగా ‘మహిమ’ను విశేషిస్తుందనే గ్రీకు నిర్మాణాన్ని స్పష్టమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ‘మనుష్య కుమారుని సూచకచిహ్నం’ అనే పదబంధం యొక్క అర్థం
  choice: ‘మనుష్య కుమారుని సూచకచిహ్నం’ అని షష్ఠీ అస్పష్టతను నిలిపాం.
  alternative: ‘మనుష్య కుమారునికి చెందిన సూచకచిహ్నం’ లేదా ‘సూచకచిహ్నమైన మనుష్య కుమారుడు’
  rationale: గ్రీకు నిర్మాణం చిహ్నానికి ఆయనతో ఉన్న ఖచ్చిత సంబంధాన్ని నిర్ణయించదు; అందువల్ల వివాదాస్పద అంత్యకాల వ్యాఖ్యానాన్ని అనువాదంలోనే తీర్మానించలేదు.
- issue: γῆ యొక్క పరిధి
  choice: ప్రధాన వచనంలో ‘భూమి’ అనే విశ్వవ్యాప్త భావాన్ని ఎంచుకున్నాం.
  alternative: ‘దేశం’ లేదా ‘నేల’, ముఖ్యంగా ఇశ్రాయేలు దేశాన్ని సూచించే భావం
  rationale: తక్షణ సందర్భంలోని విశ్వవ్యాప్త, ఆకాశసంబంధ చిత్రణ ‘భూమి’కి మద్దతిస్తుంది; అయితే జెకర్యా 12 నేపథ్యం వల్ల ప్రాంతీయ భావం సాధ్యమే కాబట్టి పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే అపోకలిప్టిక్ గాంభీర్యం మరియు మూలంలోని నిజమైన అస్పష్టతలు నిలుపబడ్డాయి. పాదసూచిక గుర్తులు ప్రధాన వచనంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
