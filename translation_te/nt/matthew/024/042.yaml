id: MAT.24.42
reference: Matthew 24:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: te
  text: కాబట్టి మెలకువగా ఉండండి[a]. ఎందుకంటే మీ ప్రభువు ఏ రోజున[b] వస్తున్నాడో[c] మీకు తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కాపలా కాస్తూ ఉండండి,’ ‘అప్రమత్తంగా ఉండండి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఏ దినాన.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘వస్తాడో,’ ‘రానున్నాడో.’ గ్రీకు పాఠంలో వర్తమాన కాల క్రియారూపం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: మెలకువగా ఉండండి
  rationale: వర్తమాన కాల ఆజ్ఞారూపం బహువచనంలో ఉండి, నిరంతర అప్రమత్తతను కోరుతోంది. ‘మెలకువగా ఉండండి’ అనే పదబంధం మేల్కొని ఉండడమనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న బోధననుంచి వచ్చే నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఆజ్ఞకు కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: οὐκ οἴδατε
  choice: మీకు తెలియదు
  rationale: తెలుసుకోవడం అనే క్రియకు ఉన్న నిషేధార్థాన్ని ఎలాంటి అనవసర విస్తరణ లేకుండా సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: ποίᾳ ἡμέρᾳ
  choice: ఏ రోజున
  rationale: కాలాన్ని సూచించే దత్తివిభక్తి పదబంధాన్ని సహజంగా అనువదిస్తూ, తెలియని నిర్దిష్ట దినం అనే భావాన్ని నిలుపుతుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: అధికార భావాన్నీ, కొత్త నిబంధనలో స్థిరపడిన బిరుదు ప్రయోగాన్నీ నిలుపుతుంది.
- source_word: ὁ κύριος ὑμῶν
  choice: మీ ప్రభువు
  rationale: గ్రీకు నిర్దేశక పదం మరియు స్వామ్య సర్వనామాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἔρχεται
  choice: వస్తున్నాడు
  rationale: అంత్యకాల సందర్భంలో భవిష్యదర్థం ఉన్నప్పటికీ, గ్రీకులోని వర్తమాన కాల రూపం కలిగించే సజీవతను, సమీపత భావాన్ని ‘వస్తున్నాడు’ నిలుపుతుంది.
theological_decisions:
- issue: ἔρχεται అనే వర్తమాన కాల రూపానికి ఉన్న అంత్యకాల భావం
  choice: ‘వస్తున్నాడు’ అని వర్తమాన ప్రగతిశీల రూపంలో అనువదించడం
  alternative: ‘వస్తాడు’ లేదా ‘రానున్నాడు’
  rationale: గ్రీకు పాఠం అంత్యకాల సందర్భంలో వర్తమాన కాల రూపాన్ని ఉపయోగిస్తుంది. ‘వస్తున్నాడు’ దాని సజీవమైన నిరీక్షణను నిలుపుతుంది; అయితే రాక సమయంపై పాఠం చెప్పనిదాన్ని సిద్ధాంతంగా జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘మెలకువగా ఉండండి’ రూపకాన్ని నిలుపుతుంది; ‘మీ ప్రభువు’ మూలపాఠంలోని స్వామ్య సంబంధాన్ని సహజంగా అందిస్తుంది. ప్రతి పాదటిప్పణి గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
