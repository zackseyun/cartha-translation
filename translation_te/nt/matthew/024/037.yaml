revisions:
- from: నోవహు కాలంలో ఎలా జరిగిందో, మనుష్యకుమారుని రాక కూడా అలాగే ఉంటుంది.[a]
  to: ఎందుకంటే, నోవహు దినాలు ఎలా ఉండేవో, మనుష్యకుమారుని రాక కూడా అలాగే ఉంటుంది.[a]
  rationale: The revision retains the Greek correlative comparison (‘just as ... so’) and its future assertion, while avoiding the interpretive shift from Noah’s ‘days’ to unspecified happenings. It also represents γάρ with a natural Telugu connective and refines the footnote’s lexical alternative without imposing a theological conclusion.
