id: MAT.24.37
reference: Matthew 24:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ αἱ ἡμέραι τοῦ Νῶε, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: te
  text: ఎందుకంటే, నోవహు దినాలు ఎలా ఉండేవో, మనుష్యకుమారుని రాక కూడా అలాగే ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఉనికి’. ఇక్కడి గ్రీకు పదం ‘ఉనికి’ లేదా ‘రాక’ అని అర్థమివ్వగలదు; ఈ సందర్భంలో అది మనుష్యకుమారుని భవిష్యత్తు రాకను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ ... οὕτως
  choice: ఎలా ... అలాగే
  rationale: గ్రీకు వాక్యంలోని పరస్పర సంబంధమున్న పోలికను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: γὰρ
  choice: (ప్రత్యేక పదంగా అనువదించలేదు)
  rationale: ఇది ముందరి సందర్భానికి వివరణాత్మక సంబంధాన్ని సూచిస్తుంది. ఒంటరి వచనంగా తెలుగులో ‘ఎందుకంటే’ అని పెట్టడం అసంపూర్ణంగా వినిపిస్తుంది; పోలిక నిర్మాణమే ఆ వివరణాత్మక సంబంధాన్ని సహజంగా మోస్తుంది.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: నోవహు కాలంలో
  rationale: అక్షరార్థంగా ‘నోవహు దినాలు’ సాధ్యమైనా, ఇక్కడ ఉద్దేశించిన కాలపరిస్థితిని ‘నోవహు కాలంలో’ అనేది సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది.
- source_word: Νῶε
  choice: నోవహు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో స్థిరపడిన పేరురూపం.
- source_word: ἔσται
  choice: ఉంటుంది
  rationale: εἰμί భవిష్యత్ రూపాన్ని సరళంగా నిలుపుతుంది; ‘జరుగుతుంది’ అని మార్చి క్రియను అతిగా వ్యాఖ్యానించదు.
- source_word: παρουσία
  choice: రాక
  rationale: ఈ అంత్యకాల సందర్భంలో భవిష్యత్తు ఆగమనాన్ని సహజంగా వ్యక్తం చేస్తుంది; పదానికి ‘సన్నిధి/ఉనికి’ అనే విస్తృత అర్థసాధ్యతను పాదటిప్పణిలో ఉంచాం.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుని
  rationale: దానియేలు గ్రంథంతో ఉన్న ప్రతిధ్వనిని, యేసు వాడిన స్థిరమైన బిరుదును కాపాడే తెలుగు రూపం.
theological_decisions:
- issue: అంత్యకాల వాక్యంలో παρουσία అనువాదం
  choice: రాక
  alternative: సన్నిధి లేదా ఆగమనం
  rationale: సందర్భం మనుష్యకుమారుని భవిష్యత్తు ఆగమనాన్ని సూచిస్తుంది. ‘రాక’ సంఘటనాత్మక భావాన్ని స్పష్టంగా ఇస్తుంది; అయినా గ్రీకు పదంలోని ‘సన్నిధి/ఉనికి’ అర్థసాధ్యతను పాదటిప్పణి ద్వారా దాచకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం. గ్రీకు పోలికలోని ఎలిప్సిస్‌ను ‘ఎలా జరిగిందో’తో పూరించి భావాన్ని స్పష్టం చేశాం.
