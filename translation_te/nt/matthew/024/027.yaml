id: MAT.24.27
reference: Matthew 24:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: te
  text: ఎందుకంటే, మెరుపు తూర్పు నుండి వెలువడి పడమటి వరకు కనిపించినట్లే, మనుష్యకుమారుని రాక కూడా అలా ఉంటుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ఎందుకంటే, ... కనిపించినట్లే
  rationale: γάρ లోని వివరణాత్మక అనుసంధానాన్ని ‘ఎందుకంటే’తో, ὥσπερ లోని పోలికను ‘అట్లే’ నిర్మాణంతో సహజమైన తెలుగులో నిలిపింది.
- source_word: ἡ ἀστραπή
  choice: మెరుపు
  rationale: ఈ ఉపమానంలో సాధారణ వెలుగు కాదు, ఆకాశంలో కనిపించే మెరుపే ఉద్దేశం.
- source_word: ἐξέρχεται
  choice: బయలుదేరి
  rationale: పదానికి ‘వెలుపలికి రావడం/బయలుదేరడం’ అనే భావం ఉంది; మెరుపు ఒక దిశనుండి వెలువడే చిత్రాన్ని ఇది సహజంగా తెలియజేస్తుంది.
- source_word: ἀπὸ ἀνατολῶν
  choice: తూర్పు నుండి
  rationale: దిశల వ్యత్యాసంలో ἀνατολαί తూర్పును సూచిస్తుంది; ఆధునిక తెలుగులో ఇదే స్పష్టమైన రూపం.
- source_word: φαίνεται
  choice: కనిపించిన
  rationale: క్రియలోని దృశ్యమానతను, అందరికీ స్పష్టంగా కనిపించే స్వభావాన్ని అతిశయోక్తి లేకుండా నిలుపుతుంది.
- source_word: ἕως δυσμῶν
  choice: పడమటి వరకు
  rationale: ἕως సూచించే విస్తృతి మరియు δυσμαί సూచించే పడమటి దిశ రెండింటినీ నిలుపుతుంది.
- source_word: οὕτως ἔσται
  choice: కూడా ఉంటుంది
  rationale: ముందున్న ‘కనిపించినట్లే’తో కలిసి పోలికను పూర్తి చేస్తూ, ἔσται లోని భవిష్యత్ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: παρουσία
  choice: రాక
  rationale: ఈ అంత్యకాల సందర్భంలో పదం మనుష్య కుమారుని భవిష్యత్ రాకను సూచిస్తుంది. అయితే దానికి ‘సన్నిధి/ఉనికి’ అనే పదార్థం కూడా సాధ్యమైనందున దానిని పాదటిప్పణిలో ఉంచింది.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: యేసు ఉపయోగించిన బిరుదుకు తెలుగు బైబిల్ సంప్రదాయంలో గుర్తించదగిన రూపాన్ని, దానియేలు 7తో ఉన్న అంతర్గ్రంథ సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: అంత్యకాల వాక్యంలో παρουσία అనువాదం
  choice: రాక
  alternative: సన్నిధి లేదా ఉనికి
  rationale: మెరుపు స్పష్టంగా, విస్తృతంగా కనిపించడంతో పోల్చబడినందున ఇక్కడ సంఘటనాత్మకమైన భవిష్యత్ రాక ప్రధాన భావం. అయినా παρουσία పదంలోని ‘సన్నిధి/ఉనికి’ అనే నిజమైన అర్థసాధ్యతను తొలగించకుండా పాదటిప్పణిలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం వాడబడింది. తూర్పు నుండి పడమటి వరకు కనిపించే మెరుపు అనే బహిరంగ, unmistakable దృశ్యాన్ని సరళంగా నిలిపింది.
