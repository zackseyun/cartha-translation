id: MAT.24.2
reference: Matthew 24:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Οὐ βλέπετε ⸂ταῦτα πάντα⸃; ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: te
  text: 'ఆయన వారికి జవాబుగా ఇలా అన్నాడు: “ఇవన్నీ మీరు చూస్తున్నారు కదా? నేను మీతో నిజంగా చెప్తున్నాను: ఇక్కడ ఒక రాయి కూడా మరో రాయి మీద మిగలదు; అవన్నీ కూల్చివేయబడతాయి.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ధ్వంసం చేయబడతాయి.” గ్రీకు క్రియ కట్టడాన్ని విడదీయడం లేదా కూల్చివేయడం అనే అర్థాలను ఇవ్వగలదు; “కూల్చివేయబడతాయి” అనేది నిర్మాణం పూర్తిగా నేలమట్టమయ్యే దృశ్యాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: జవాబుగా ఇలా అన్నాడు
  rationale: గ్రీకులోని కృదంతం–సమాపక క్రియ కలయిక జవాబు ఇచ్చి మాట్లాడడాన్ని సూచిస్తుంది. తెలుగులో సహజంగా ఉండేలా దాని రెండు భావాలనూ ఈ ప్రయోగం నిలుపుతుంది.
- source_word: Οὐ βλέπετε
  choice: మీరు చూస్తున్నారు కదా?
  rationale: οὐ తో వచ్చిన వర్తమాన సూచనార్థక క్రియ సమ్మతిని ఆశించే అలంకారిక ప్రశ్న. ‘కదా?’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ταῦτα πάντα
  choice: ఇవన్నీ
  rationale: నపుంసక బహువచన సర్వనామం, πᾶς కలయికను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తూ ముందుగా ప్రస్తావించిన ఆలయ కట్టడాలన్నిటినీ సూచిస్తుంది.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెప్తున్నాను
  rationale: యేసు పలికే గంభీరమైన ధృవీకరణ సూత్రంలోని ἀμήν భావాన్ని ‘నిజంగా’ స్పష్టంగా అందిస్తుంది.
- source_word: οὐ μὴ ἀφεθῇ
  choice: ఉండనే ఉండదు
  rationale: οὐ μή తో కూడిన బలమైన నిరాకరణను ‘ఉండనే ఉండదు’ సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ὧδε
  choice: ఇక్కడ
  rationale: తక్షణ సందర్భంలోని ఆలయ ప్రదేశాన్ని సూచించే స్థానవాచక క్రియావిశేషణానికి నేరమైన సమానార్థకం.
- source_word: λίθος ἐπὶ λίθον
  choice: ఒక రాయి మీద మరొక రాయి
  rationale: రాయి మీద రాయి మిగలదనే సంపూర్ణ కూల్చివేత భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καταλυθήσεται
  choice: పడగొట్టబడకుండా
  rationale: కట్టడాన్ని విడదీయడం లేదా కూల్చివేయడం అనే భావాన్ని, రాళ్లు తమ స్థానాలనుంచి పడగొట్టబడే స్పష్టమైన దృశ్యంతో ఈ పదం నిలుపుతుంది.
theological_decisions:
- issue: ఆలయం గురించి యేసు చేసిన ప్రవచనపు పరిధి, బలం
  choice: నిర్మాణం పూర్తిగా కూల్చబడుతుందనే స్పష్టమైన ప్రవచనంగా అనువదించడం
  alternative: దీనిని ప్రధానంగా ప్రతీకాత్మక తీర్పుగా లేదా ఏదైనా నిర్దిష్ట అంత్యకాల వ్యవస్థతో ముడిపెట్టి అనువదించడం
  rationale: రాళ్లు ఒకదానిమీద మరొకటి మిగలకపోవడం అనే భాష ప్రత్యక్షమైన నిర్మాణ సంబంధిత భావాన్ని ఇస్తుంది. వచనం చెప్పనిదాన్ని సిద్ధాంతపరంగా జోడించకుండా ఆ బలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. అలంకారిక ప్రశ్నకు ‘కదా?’ను, బలమైన గ్రీకు నిరాకరణకు ‘ఉండనే ఉండదు’ను వాడాం.
