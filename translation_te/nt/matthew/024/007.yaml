source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: te
  text: ఎందుకంటే, ఒక జనానికి వ్యతిరేకంగా మరొక జనం, ఒక రాజ్యానికి వ్యతిరేకంగా మరొక రాజ్యం లేస్తాయి[a]. వివిధ ప్రాంతాల్లో[b] కరవులు, భూకంపాలు వస్తాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎదురు లేస్తాయి.’ గ్రీకు నుడికారం ప్రజల మధ్య, రాజ్యాల మధ్య శత్రుత్వం చెలరేగడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘చోటుచోట’ లేదా ‘ఒక్కో ప్రాంతంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: లేస్తాయి
  rationale: ఈ సందర్భంలో ἐγείρω రూపం శత్రుత్వంతో ఎదురుగా లేవడాన్ని సూచిస్తుంది. కర్తరి భావంతో అనువదించడం ద్వారా గ్రీకులో స్పష్టంగా చెప్పని దైవిక కారణాన్ని చేర్చకుండా సంఘర్షణ మొదలయ్యే భావాన్ని నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందరి సందర్భానికి వివరణాత్మక సంబంధాన్ని చూపుతుంది; తెలుగులో ‘ఎందుకంటే’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἔθνος
  choice: జనం
  rationale: ఇక్కడ పదం పరస్పరం సంఘర్షించే సామూహిక ప్రజావర్గాన్ని సూచిస్తుంది. ‘జనం’ రాజకీయ దేశానికి మాత్రమే పరిమితం కాకుండా మూలపదంలోని ప్రజా/జాతి విస్తృతిని కాపాడుతుంది.
- source_word: ἐπὶ ἔθνος
  choice: ఒక జనానికి వ్యతిరేకంగా మరొక జనం
  rationale: ἐπί + ద్వితీయా విభక్తి ఇక్కడ శత్రుత్వ దిశను సూచిస్తుంది. ‘ఒక… మరొక…’ నిర్మాణం గ్రీకు పునరుక్తి భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: βασιλεία
  choice: రాజ్యం
  rationale: ఇక్కడ βασιλεία రాజపాలనలోని రాజకీయ రాజ్యాన్ని సూచించి ἔθνοςకు సమాంతరంగా ఉంది; ‘రాజ్యం’ ఆ భావాన్నీ అపోకలిప్టిక్ శైలినీ నిలుపుతుంది.
- source_word: ἔσονται
  choice: వస్తాయి
  rationale: ఉనికిని/సంభవాన్ని తెలిపే ἔσονταιకు, కరవులు మరియు భూకంపాల వంటి ఘటనలతో ‘వస్తాయి’ సహజమైన తెలుగు ప్రయోగం.
- source_word: λιμοὶ
  choice: కరవులు
  rationale: బహువచన λιμοί తీవ్రమైన ఆహార కొరతలను సూచిస్తుంది; ‘కరవులు’ ప్రామాణికమైన, స్పష్టమైన సమానార్థకం.
- source_word: σεισμοὶ
  choice: భూకంపాలు
  rationale: ఈ సందర్భంలో σεισμοί భూమి కంపించే ఘటనలను సూచిస్తుంది; ‘భూకంపాలు’ స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: κατὰ τόπους
  choice: వివిధ ప్రాంతాల్లో
  rationale: ఈ పంపిణీ ప్రయోగం ఒకే చోట కాక అనేక ప్రదేశాల్లో సంభవించడాన్ని సూచిస్తుంది. ‘వివిధ ప్రాంతాల్లో’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అంత్యకాల సంఘర్షణ వాక్యంలో ἔθνος పరిధి
  choice: జనం
  alternative: దేశం / జాతి
  rationale: రాజ్యానికి రాజ్యం అనే సమాంతర నిర్మాణం పెద్ద సామూహిక సంఘర్షణను సూచిస్తుంది. ‘జనం’ మూలపదాన్ని ఆధునిక దేశరాజ్యానికి మాత్రమే పరిమితం చేయదు; అలాగే ప్రత్యేకంగా అన్యజనులు అనే భావాన్నీ చేర్చదు.
- issue: ἐγερθήσεται అనే భవిష్యత్ కర్మణి/మధ్యమ రూపం బలం
  choice: లేస్తాయి
  alternative: లేపబడతాయి / ఎదురు తిరుగుతాయి
  rationale: ఈ నుడికారం సంఘర్షణ చెలరేగడాన్ని తెలుపుతుంది. ‘లేస్తాయి’ అనేది మూలంలో స్పష్టంగా లేని దైవిక కర్తృత్వాన్ని చేర్చకుండా భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి వాడబడింది. గ్రీకు సమాంతర నిర్మాణాన్ని స్పష్టంగా చూపడానికి ‘ఒక… మరొక…’ ఉపయోగించబడింది. సంప్రదింపు ఆంగ్ల పాఠంలో [b] సూచిక ‘kingdom’ తరువాత ఉన్నప్పటికీ, దాని గమనిక κατὰ τόπουςకు సంబంధించినందున మూలభాష ఆధారంగా సూచికను ‘వివిధ ప్రాంతాల్లో’ తరువాత ఉంచాం.
