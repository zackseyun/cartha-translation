  source_fidelity: ‘యేసు వారికి ఇలా జవాబిచ్చాడు’ గ్రీకులోని ἀποκριθεὶς … εἶπεν αὐτοῖς అనే సహజ కథన-సూత్రాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా నమ్మకంగా తెలియజేస్తుంది. ‘ఎవరూ మిమ్మల్ని తప్పుదారి పట్టించకుండా జాగ్రత్తపడండి’ అనేది Βλέπετε μή τις ὑμᾶς πλανήσῃ యొక్క ఆజ్ఞార్థక నివారణ భావాన్ని, బహువచనాన్ని, అలాగే πλανήσῃలోని తప్పుదోవ పట్టించడం/మోసపరచడం అనే విస్తృతిని నిలుపుతుంది.
  naturalness: వాక్యం ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది. ‘ఇలా జవాబిచ్చాడు’ తరువాత ప్రత్యక్ష ఉల్లేఖనం సజావుగా వస్తుంది; ‘జాగ్రత్తపడండి’ హెచ్చరికకు తగిన గౌరవప్రద బహువచన రూపం.
  terminology: ‘తప్పుదారి పట్టించు’ సందర్భానుకూలమైన ప్రధాన ఎంపిక; ఇది కేవలం మేధో మోసానికి పరిమితం కాదు. పాదసూచికలోని ‘మోసగించకుండా’ πλανάωకు సముచితమైన సంక్షిప్త ప్రత్యామ్నాయం. పేర్లు లేదా ప్రత్యేక దైవశాస్త్ర పదాలకు సమస్య లేదు.
