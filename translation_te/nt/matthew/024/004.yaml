source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: te
  text: 'యేసు వారికి ఇలా జవాబిచ్చాడు: “ఎవరూ మిమ్మల్ని తప్పుదారి పట్టించకుండా జాగ్రత్తపడండి.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మోసగించకుండా.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν αὐτοῖς
  choice: వారికి ఇలా జవాబిచ్చాడు
  rationale: గ్రీకులోని జవాబివ్వడం–చెప్పడం అనే సంయుక్త ప్రయోగాన్ని తెలుగులో కృత్రిమ పునరుక్తి లేకుండా సహజమైన ఒకే వాక్యప్రయోగంగా అందిస్తుంది; ‘ఇలా’ తరువాత వచ్చే ప్రత్యక్ష మాటను సహజంగా పరిచయం చేస్తుంది.
- source_word: Βλέπετε
  choice: జాగ్రత్తపడండి
  rationale: ఇక్కడ ఈ వర్తమాన ఆజ్ఞారూపం అక్షరార్థంగా చూడమని కాక, అప్రమత్తంగా ఉండి తరువాత చెప్పినది జరగకుండా చూసుకోవాలని హెచ్చరిస్తుంది.
- source_word: μή τις
  choice: ఎవరూ …కుండా
  rationale: ఆజ్ఞ తరువాత μή మరియు సంభావనార్థక క్రియ కలసి నివారణ భావాన్ని వ్యక్తం చేస్తున్నాయి. తెలుగు నిషేధార్థక నిర్మాణం ఈ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πλανήσῃ
  choice: తప్పుదారి పట్టించకుండా
  rationale: πλανάωలోని మోసపరచడం మరియు సరైన మార్గం నుండి దారి మళ్లించడం అనే విస్తృత భావాలను ఈ ప్రయోగం నిలుపుతుంది.
theological_decisions:
- issue: πλανήσῃ సూచించే హెచ్చరిక స్వభావం
  choice: తప్పుదారి పట్టించకుండా
  alternative: మోసగించకుండా
  rationale: సందర్భంలో ఇది కేవలం బుద్ధిపరమైన మోసానికే పరిమితం కాకుండా, తప్పుడు మార్గదర్శకత్వం వల్ల సరైన మార్గం నుండి తొలగిపోవడాన్ని కూడా సూచించగలదు. ప్రధాన అనువాదం ఆ విస్తృత భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన హెచ్చరిక శైలిని ఉపయోగించాం. బహువచన సంబోధనను ‘మిమ్మల్ని/జాగ్రత్తపడండి’ ద్వారా స్పష్టంగా నిలిపాం.
