id: MAT.24.34
reference: Matthew 24:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: te
  text: '“నేను మీతో నిజంగా చెబుతున్నాను: ఇవన్నీ జరిగేంతవరకు ఈ తరం ఎంతమాత్రమూ గతించదు[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ ప్రజలు,” లేదా “ఈ జాతి.” గ్రీకు పదాన్ని మరింత విస్తృతమైన అర్థంలో గ్రహించవచ్చు; అయితే ఇక్కడ “తరం” అనేది అత్యంత ప్రత్యక్షమైన అనువాదం.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: నిజంగా
  rationale: సమ Synoptic సువార్తల్లోని గంభీరమైన ధృవీకరణ సూత్రానికి సహజమైన ఆధునిక తెలుగు రూపం; ‘ఆమేన్’ అనే లిప్యంతరీకరణకంటే అర్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధనను నిలుపుతూ ఆధునిక తెలుగులో సహజంగా వినిపిస్తుంది.
- source_word: ὅτι
  choice: ':'
  rationale: తెలుగులో ఉద్ధరణ సూత్రం తరువాత ద్విబిందువు పెట్టడం ద్వారా విషయవాక్య ప్రవేశం సహజంగా, స్పష్టంగా వ్యక్తమవుతుంది; ప్రత్యేకంగా ‘అని’ చేర్చాల్సిన అవసరం లేదు.
- source_word: οὐ μὴ παρέλθῃ
  choice: ఎంతమాత్రమూ గతించదు
  rationale: οὐ μή అనే బలమైన నిరాకరణను ‘ఎంతమాత్రమూ ...దు’ ద్వారా స్పష్టంగా నిలుపుతుంది; παρέρχομαι యొక్క ‘గతించు/అంతరించిపోవు’ భావాన్ని సందర్భాన్ని ముందే నిర్ణయించకుండా అందిస్తుంది.
- source_word: ἡ γενεὰ αὕτη
  choice: ఈ తరం
  rationale: γενεάకు ఇక్కడ అత్యంత ప్రత్యక్షమైన సాధారణ అర్థం ‘తరం’; వివాదాస్పదమైన అంత్యకాల వ్యాఖ్యానాన్ని అనువాదంలో పరిష్కరించకుండా ఉంచుతుంది.
- source_word: ἕως ἂν
  choice: జరిగేంతవరకు
  rationale: భవిష్యత్తులో సంభవించే పరిధిని సూచించే ἕως ἂν భావాన్ని సహజమైన తెలుగు కాలపరిమితి నిర్మాణంతో తెలియజేస్తుంది.
- source_word: πάντα ταῦτα
  choice: ఇవన్నీ
  rationale: నపుంసక బహువచనంలోని సమగ్రతను సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: γένηται
  choice: జరిగే
  rationale: సంఘటనలు సంభవించడాన్ని సూచించే γίνομαιకు ఆధునిక తెలుగులో సహజమైన సమానార్థకం.
theological_decisions:
- issue: అంత్యకాల ప్రసంగంలో ἡ γενεὰ αὕτη అనే పదబంధం యొక్క అర్థం
  choice: వ్యాఖ్యాన విస్తరణ లేకుండా ‘ఈ తరం’ అని అనువదించడం.
  alternative: ‘ఈ ప్రజలు’ లేదా ‘ఈ జాతి’
  rationale: ‘ఈ తరం’ గ్రీకు పదబంధానికి అత్యంత ప్రత్యక్షమైన అనువాదం. దీనివల్ల వివాదాస్పదమైన అంత్యకాల కాలక్రమాన్ని లేదా ప్రత్యేక సిద్ధాంత చట్రాన్ని పాఠ్యంలోకి దిగుమతి చేయకుండా అసలు వాక్యంలోని వ్యాఖ్యాన ఉద్రిక్తత నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే యేసు పలికిన గంభీరమైన ధృవీకరణ స్వరాన్ని నిలుపుతూ రూపొందించబడింది. ప్రధాన పాఠ్యంలో ‘ఈ తరం’ ఉంచి, విస్తృతమైన ప్రత్యామ్నాయ అర్థాలను పాదటిప్పణిలో తెలిపింది.
