  source_fidelity: ప్రధాన పాఠ్యం గ్రీకు వాక్యంలోని గంభీర ధృవీకరణ (ἀμὴν), ప్రత్యక్ష సంబోధన, οὐ μὴ యొక్క బలమైన నిరాకరణ, ‘ఈ తరం’ (ἡ γενεὰ αὕτη), మరియు ‘ఇవన్నీ జరిగేంతవరకు’ అనే కాలపరిమితిని విశ్వసనీయంగా అందిస్తోంది. ‘ఇవన్నీ’ πάντα ταῦτα అనే నపుంసక బహువచనాన్ని సహజంగా ప్రతిబింబిస్తుంది.
