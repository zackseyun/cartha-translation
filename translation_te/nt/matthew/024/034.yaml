  terminology: ‘తరం’ అనేది γενεάకు అత్యంత ప్రత్యక్షమైన, సందర్భానికి తగిన పదం. ‘గతించదు’ παρέλθῃకు సందర్భాన్ని ముందుగానే వ్యాఖ్యానించకుండా సరైన సమానార్థకంగా ఉంది. పాదటిప్పణి ‘ప్రజలు’/‘జాతి’ అనే విస్తృత ప్రత్యామ్నాయాలను ప్రధాన పాఠ్యంపై రుద్దకుండా సూచిస్తుంది.
