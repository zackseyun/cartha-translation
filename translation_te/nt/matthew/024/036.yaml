source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: te
  text: “అయితే ఆ రోజు, ఆ గంట గురించి ఎవరికీ తెలియదు—పరలోకంలోని దూతలకైనా, కుమారునికైనా తెలియదు[a]—తండ్రికి మాత్రమే తెలుసు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతులు “కుమారునికైనా తెలియదు” అనే మాటలను వదిలివేస్తాయి. ప్రధాన పాఠ్యం SBLGNT పాఠాన్ని అనుసరిస్తుంది.
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: అయితే … గురించి
  rationale: περί విషయాన్ని పరిచయం చేస్తుంది; δέ ముందున్న మాటతో స్వల్ప వ్యత్యాసాన్ని లేదా విషయమార్పును సూచిస్తుంది. ఆధునిక తెలుగులో ‘అయితే … గురించి’ ఈ రెండు భావాలనూ సహజంగా తెలియజేస్తుంది.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: ఆ రోజు, ఆ గంట
  rationale: ἐκείνης సమన్వయించబడిన కాలపదబంధానికి నిర్దిష్టతను ఇస్తుంది. తెలుగులో రెండు అంశాలకూ ‘ఆ’ను ఉంచడం స్పష్టంగా, సహజంగా ఉంటుంది; గ్రీకు καί ప్రకారం రోజు మరియు గంట రెండూ నిలుపబడ్డాయి.
- source_word: οὐδεὶς οἶδεν
  choice: ఎవరికీ తెలియదు
  rationale: οὐδείς యొక్క సమగ్ర నిరాకరణను, వర్తమానార్థంలో ఉన్న οἶδα భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: పరలోకంలోని దూతలకూ తెలియదు
  rationale: οὐδέ యొక్క చేర్చే నిరాకరణను ‘కూ తెలియదు’ ద్వారా స్పష్టం చేశాం. τῶν οὐρανῶνను పదశః అసహజమైన ‘ఆకాశాల దూతలు’గా కాక, భావానికి తగిన ‘పరలోకంలోని దూతలు’గా అనువదించాం.
- source_word: οὐδὲ ὁ υἱός
  choice: కుమారునికీ తెలియదు
  rationale: ముందటి నిరాకరణతో సమన్వయాన్ని ‘కీ’ చూపిస్తుంది. నిర్దిష్ట బిరుదైన ὁ υἱόςను ‘కుమారుడు’గా నిలిపి, తెలియదనే వాక్యభాగాన్ని తెలుగులో స్పష్టత కోసం పునరుక్తి చేశాం.
- source_word: εἰ μὴ
  choice: మాత్రమే
  rationale: నిరాకరణ వాక్యం తరువాత εἰ μή మినహాయింపును సూచిస్తుంది. తెలుగులో చివరి పదబంధంలోని ‘మాత్రమే’ ఆ మినహాయింపును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ πατὴρ μόνος
  choice: తండ్రికి మాత్రమే తెలుసు
  rationale: μόνος జ్ఞానాన్ని తండ్రికే పరిమితం చేస్తుంది. ‘మాత్రమే’ ఆ ప్రత్యేకతను కాపాడుతుంది; తెలుగులో వాక్యం సంపూర్ణంగా ఉండేందుకు ‘తెలుసు’ను వ్యక్తంగా ఉంచాం.
theological_decisions:
- issue: ‘కుమారునికీ తెలియదు’ అనే మాటలోని క్రీస్తుశాస్త్ర సంబంధ ఉద్రిక్తత
  choice: SBLGNTలో ఉన్న ‘కుమారునికీ తెలియదు’ అనే వాక్యాన్ని ప్రధాన పాఠ్యంలో ఎలాంటి సవరణ లేదా వివరణాత్మక మృదూకరణ లేకుండా ఉంచడం.
  alternative: కొన్ని ప్రతుల ఆధారంగా ఈ మాటను వదలడం, లేదా కుమారుని దైవత్వంతో కనిపించే ఉద్రిక్తతను తగ్గించేలా వ్యాఖ్యానాత్మకంగా మార్చడం.
  rationale: ఇచ్చిన గ్రీకు మూలపాఠ్యంలో οὐδὲ ὁ υἱός ఉంది. అనువాదం ఈ నిజమైన పాఠ్య, వేదాంత ఉద్రిక్తతను పరిష్కరించకుండా యథాతథంగా కాపాడాలి; విస్తృత సిద్ధాంత సమన్వయం అనువాదంలో చొప్పించరాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిని కాపాడుతూ అనువదించబడింది. డాష్‌లతో జాబితా విస్తరణను చూపించి, చివరలో తండ్రికి మాత్రమే తెలిసినదనే ప్రత్యేకతను స్పష్టంగా ఉంచాం.
