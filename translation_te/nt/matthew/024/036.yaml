- from: “అయితే ఆ రోజు, ఆ గంట గురించి ఎవరికీ తెలియదు—పరలోకంలోని దూతలకూ తెలియదు, కుమారునికీ తెలియదు[a]—తండ్రికి మాత్రమే తెలుసు.”
  to: “అయితే ఆ రోజు, ఆ గంట గురించి ఎవరికీ తెలియదు—పరలోకంలోని దూతలకైనా, కుమారునికైనా తెలియదు[a]—తండ్రికి మాత్రమే తెలుసు.”
  rationale: The revision retains the SBLGNT reading, including the unsoftened statement concerning the Son, while restoring the emphatic negative force of οὐδέ (‘not even’) through idiomatic Telugu ‘కైనా’ under negation. The footnote remains anchored to the same phrase and accurately reflects the supplied English audit trail.
