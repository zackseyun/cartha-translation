id: MAT.24.51
reference: Matthew 24:51
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: te
  text: అతన్ని రెండు ముక్కలుగా నరికివేసి[a], కపటులతో పాటు అతని వంతును కేటాయిస్తాడు[b]. అక్కడ ఏడుపు, పళ్లు నూరడం ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, భావానువాదంగా: ‘అతన్ని తీవ్రంగా శిక్షిస్తాడు.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘రెండుగా నరుకుతాడు’ అని అర్థం.'
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా: ‘కపటులతో పాటు అతని భాగాన్ని ఉంచుతాడు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: అతన్ని రెండు ముక్కలుగా నరికి
  rationale: క్రియ యొక్క ప్రత్యక్ష అర్థమైన ‘రెండుగా నరకడం’ను నిలుపుతుంది; తీవ్రమైన శిక్ష అనే రూపకాలంకార వివరణను ప్రధాన పాఠ్యంలో ముందుగానే నిర్ణయించదు.
- source_word: μέρος
  choice: అతని వంతు
  rationale: ‘భాగం/వంతు’ అనే మూల భావాన్ని సహజమైన తెలుగులో నిలుపుతూ, అది స్థలమా గమ్యమా వారసత్వమా అని అతిగా నిర్దిష్టం చేయదు.
- source_word: ὑποκριτῶν
  choice: వేషధారులు
  rationale: బయటికి ఒక విధంగా కనిపిస్తూ నిజానికి వేరుగా ఉండేవారనే భావాన్ని ఆధునిక సాధారణ తెలుగులో తెలియజేస్తుంది; మత్తయిలోని నైతిక భావబలాన్ని నిలుపుతుంది.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: ఇప్పుడే పేర్కొన్న తీర్పు స్థితి లేదా స్థలాన్ని సహజంగా సూచిస్తుంది.
- source_word: κλαυθμὸς
  choice: ఏడుపు
  rationale: మత్తయిలో పునరావృతమయ్యే తీర్పు సూత్రానికి సరళమైన, సహజమైన తెలుగు పదం.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: పండ్లు కొరకడం
  rationale: దంతాలను బిగించి కొరకడం అనే స్పష్టమైన చిత్రాన్ని సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: διχοτομήσει అనే క్రియను రూపకాలంకార శిక్షగా మృదువుగా అనువదించాలా
  choice: ప్రధాన పాఠ్యంలో ‘రెండు ముక్కలుగా నరికి’ అనే స్పష్టమైన చిత్రాన్ని నిలుపడం
  alternative: ‘తీవ్రంగా శిక్షించి’
  rationale: గ్రీకు క్రియ యొక్క ప్రత్యక్ష భావాన్ని కాపాడి, అది అక్షరార్థమా రూపకాలంకారమా అనే ప్రశ్నను అనువాదంలోనే పరిష్కరించకుండా ఉంచుతుంది.
- issue: τὸ μέρος αὐτοῦ ... θήσει తెలిపే గమ్యాన్ని ఎలా వ్యక్తం చేయాలి
  choice: ‘వేషధారులతో పాటు అతని వంతును నిర్ణయిస్తాడు’
  alternative: ‘వేషధారుల మధ్య అతనికి చోటు ఇస్తాడు’
  rationale: న్యాయపరంగా వంతు కేటాయించబడుతున్న భావాన్ని నిలుపుతూ, దానిని కేవలం భౌతిక స్థలంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గంభీరమైన తీర్పు భాషను ఉపయోగించాం. గ్రీకు వాక్యంలోని కఠినమైన దృశ్యాన్ని మృదువుచేయలేదు; సందిగ్ధతలను పాదసూచికల్లో తెలిపాం.
