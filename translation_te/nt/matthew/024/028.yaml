  edition: SBLGNT
  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: te
  text: శవం ఎక్కడ ఉన్నా, అక్కడ రాబందులు[a] పోగవుతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘డేగలు.’ గ్రీకు పదం డేగలను సూచించగలదు; అయితే శవం చుట్టూ పక్షులు పోగయ్యే ఈ దృశ్యానికి ‘రాబందులు’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: ఎక్కడ ఉంటుందో
  rationale: ὅπου + ἐάν + విధ్యర్థక ᾖ అనిశ్చిత స్థలార్థాన్ని వ్యక్తం చేస్తుంది. తెలుగులో ‘ఎక్కడ ఉంటుందో’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: πτῶμα
  choice: శవం
  rationale: πτῶμα పడిపోయిన మృతదేహాన్ని, ముఖ్యంగా శవాన్ని సూచిస్తుంది. ‘శవం’ సంక్షిప్తమైన, స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: συναχθήσονται
  choice: పోగవుతాయి
  rationale: రూపం భవిష్యత్ కర్మణి అయినప్పటికీ, పక్షులు ఒకచోట చేరే భావాన్ని తెలుగులో ‘పోగవుతాయి’ సహజంగా వ్యక్తం చేస్తుంది; కృత్రిమమైన కర్మణి నిర్మాణాన్ని నివారిస్తుంది.
- source_word: ἀετοί
  choice: రాబందులు
  rationale: ἀετός సాధారణంగా గద్దను సూచించగలదు; అయితే శవం చుట్టూ పక్షులు చేరే ఈ సందర్భంలో మృతాహార పక్షులైన ‘రాబందులు’ దృశ్యానికి బాగా సరిపోతుంది. మూలపదంలోని ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: సామెతసదృశమైన దృశ్యానికి అంత్యకాల సంబంధమైన అన్వయం
  choice: శవం మరియు పక్షుల దృశ్యాన్ని నేరుగా అనువదించి, అవి వేటిని సూచిస్తాయో ప్రధాన పాఠ్యంలో నిర్ణయించలేదు.
  alternative: దీనిని అనివార్య తీర్పుగా, మనుష్యకుమారుని రాక స్పష్టతగా, యెరూషలేము నాశనంగా లేదా రోమా సైనిక చిహ్నాలుగా స్పష్టీకరించడం.
  rationale: గ్రీకు వాక్యం శవం లేదా పక్షుల సంకేతార్థాన్ని స్వయంగా గుర్తించదు. కాబట్టి అనువాదం వేదాంతపరమైన ఉద్రిక్తతను, వ్యాఖ్యాన స్వేచ్ఛను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. సామెతసదృశ వాక్య నిర్మాణాన్ని నిలిపి, దాని విస్తృత అంత్యకాల అర్థాన్ని వ్యాఖ్యానాత్మకంగా పరిష్కరించలేదు.
