- from: శవం ఎక్కడ ఉంటుందో, అక్కడ రాబందులు[a] పోగవుతాయి.
  to: శవం ఎక్కడ ఉన్నా, అక్కడ రాబందులు[a] పోగవుతాయి.
  rationale: The revision more directly reflects the indefinite force of ὅπου ἐὰν ᾖ and clarifies the footnoted lexical alternative for ἀετοί. It preserves the image without assigning an eschatological interpretation.
