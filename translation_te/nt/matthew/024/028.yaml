review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys πτῶμα as “శవం” and the future gathering of the birds. However, “ఎక్కడ ఉంటుందో” can sound like an indirect-question or conditional formulation; “ఎక్కడ ఉన్నా” more directly preserves the indefinite-relative force of ὅπου ἐὰν ᾖ (“wherever it may be”).
  naturalness: “శవం ఎక్కడ ఉన్నా, అక్కడ రాబందులు పోగవుతాయి” is concise, idiomatic modern standard Telugu, and retains the proverbial parallelism of the Greek.
  terminology: “రాబందులు” is an appropriate contextual rendering for ἀετοί. The footnote should give the clearer Telugu lexical alternative “డేగలు” for “eagles,” rather than “గద్దలు,” which may be regionally or lexically less precise and can overlap with other birds of prey.
  issues:
  - severity: low
    issue: The location clause is slightly less direct than the Greek indefinite-relative construction.
    rationale: Replacing “ఎక్కడ ఉంటుందో” with “ఎక్కడ ఉన్నా” naturally expresses “wherever [the corpse] may be.”
  - severity: medium
    issue: The footnote’s alternative “గద్దలు” does not clearly communicate the lexical alternative “eagles.”
    rationale: “డేగలు” is a clearer modern Telugu equivalent for “eagles,” while the main-text “రాబందులు” remains contextually appropriate.
  revised_text: శవం ఎక్కడ ఉన్నా, అక్కడ రాబందులు[a] పోగవుతాయి.
