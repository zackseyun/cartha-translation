review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the inferential link (διὰ τοῦτο), the inclusive emphasis ('మీరు కూడా'), the continuing imperative, the causal clause, and the future-oriented present ἔρχεται. 'మనుష్యకుమారుడు' appropriately preserves the established Gospel title 'the Son of Man.' The temporal expression is better rendered idiomatically as 'సమయంలో' rather than the overly literal and less natural 'గంటలో.'
  naturalness: '''మీరు ఊహించని గంటలో'' is understandable but is not idiomatic modern Telugu for an unforeseen time. ''మీరు ఊహించని సమయంలో'' is natural, retains the contextual force of δοκεῖτε, and avoids suggesting merely a particular clock-hour.'
  terminology: Keep 'మనుష్యకుమారుడు' as the conventional literal title. 'సిద్ధంగా ఉండండి' is clear modern standard Telugu and suitably conveys the present imperative without unnecessary interpretive expansion.
  issues:
  - severity: low
    issue: The phrase 'మీరు ఊహించని గంటలో' is awkward in modern Telugu.
    rationale: Telugu normally uses 'సమయంలో' for this temporal idiom. The Greek ὥρᾳ literally denotes an hour, but here it functions as an unspecified time; 'సమయంలో' communicates that sense naturally without material loss.
  revised_text: అందుచేత మీరు కూడా సిద్ధంగా ఉండండి. ఎందుకంటే మీరు ఊహించని సమయంలో మనుష్యకుమారుడు వస్తాడు.[a]
