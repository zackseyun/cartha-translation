id: MAT.24.44
reference: Matthew 24:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: te
  text: అందుచేత మీరు కూడా సిద్ధంగా ఉండండి. ఎందుకంటే మీరు ఊహించని సమయంలో మనుష్యకుమారుడు వస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు అనుకోని సమయంలో.” గ్రీకు క్రియకు “ఆలోచించు,” “అనుకో,” లేదా సందర్భానుసారంగా “ఎదురుచూడు” అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందుచేత
  rationale: ముందున్న హెచ్చరికనుంచి వచ్చే కారణాత్మక నిర్ధారణను సహజమైన, సంక్షిప్తమైన తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ ὑμεῖς
  choice: మీరు కూడా
  rationale: καίతో కూడిన స్పష్ట సర్వనామంలోని చేర్పు, ఉద్ఘాటన రెండింటినీ అతిశయించకుండా నిలుపుతుంది.
- source_word: γίνεσθε ἕτοιμοι
  choice: సిద్ధంగా ఉండండి
  rationale: వర్తమాన బహువచన ఆజ్ఞ సూచించే కొనసాగుతున్న సిద్ధస్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘సిద్ధులు కండి’ కంటే ఇది సాధారణ పాఠకులకు సహజం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఆజ్ఞకు కారణాన్ని పరిచయం చేసే causal భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: మీరు ఊహించని గంటలో
  rationale: కాలసూచక దత్తివును ‘గంటలో’గా, δοκεῖτε యొక్క సందర్భానుగుణ అర్థాన్ని ‘ఊహించు’గా అందిస్తుంది; అయినా ‘అనుకోని’ అనే సమీప ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచుతుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: సువార్తల్లో స్థిరపడిన సూటి బిరుదును, దాని సెమిటిక్ మరియు దానియేలు గ్రంథ నేపథ్య ప్రతిధ్వనులను కాపాడుతుంది.
- source_word: ἔρχεται
  choice: వస్తాడు
  rationale: గ్రీకు వర్తమాన రూపానికి భవిష్యదర్థం ఉన్నందున, తెలుగు సహజ ప్రయోగంలో ‘వస్తాడు’ ఆ రాబోయే ఘటనను సజీవంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే క్రీస్తుసంబంధ బిరుదు అనువాదం
  choice: మనుష్యకుమారుడు
  alternative: మానవ కుమారుడు
  rationale: సాంప్రదాయిక సూటి రూపం బిరుదు స్వరూపాన్ని, దాని దానియేలు గ్రంథ ప్రతిధ్వనిని, సువార్తలలోని స్థిర వినియోగాన్ని కాపాడుతుంది; ప్రత్యామ్నాయం తెలుగులో బిరుదుగా తక్కువ స్థిరత్వం కలది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఆజ్ఞను స్పష్టంగా ఉంచుతూ, క్రీస్తుసంబంధ బిరుదును సంప్రదాయ సూటి రూపంలో నిలిపింది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
