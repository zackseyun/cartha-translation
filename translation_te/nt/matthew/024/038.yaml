id: MAT.24.38
reference: Matthew 24:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: te
  text: ఎలాగైతే జలప్రళయానికి ముందు రోజుల్లో వారు తింటూ తాగుతూ, వివాహం చేసుకుంటూ, వివాహానికి ఇస్తూ[a] ఉండేవారో, నోవహు ఓడలోకి ప్రవేశించిన రోజు వరకు అలాగే ఉండేవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వివాహం చేసుకుంటూ, వివాహానికి ఇవ్వబడుతూ.’ గ్రీకులో γαμοῦντες, γαμίζοντες అనే రెండు వేర్వేరు పదాలు ఉన్నాయి. రెండవది ఇతరులను వివాహానికి ఇవ్వడాన్నిగానీ, వివాహానికి ఇవ్వబడడాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: ఎందుకంటే
  rationale: γάρ యొక్క వివరణాత్మక భావాన్ని సహజమైన తెలుగులో చూపుతుంది; ముందున్న వాక్యంతో పోలికను ఈ వాక్య నిర్మాణం సందర్భానుసారంగా కొనసాగిస్తుంది.
- source_word: ἦσαν ... τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ γαμίζοντες
  choice: వారు తింటూ తాగుతూ, పెళ్లి చేసుకుంటూ, పెళ్లికి ఇచ్చుకుంటూ ఉన్నారు
  rationale: ἦσαν తో కూడిన వర్తమాన కృదంతాలు కొనసాగుతున్న సాధారణ కార్యకలాపాలను సూచిస్తాయి. ‘ఉన్నారు’తో కూడిన తెలుగు నిర్మాణం ఆ కొనసాగింపు భావాన్ని నిలుపుతుంది.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: జలప్రళయానికి ముందున్న రోజుల్లో
  rationale: నోవహు సందర్భంలోని κατακλυσμόςకు ‘జలప్రళయం’ స్పష్టమైన, స్థిరపడిన తెలుగు పదం; కాలసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τρώγοντες καὶ πίνοντες
  choice: తింటూ తాగుతూ
  rationale: మూలంలోని పదాలు సాధారణ కార్యకలాపాలను మాత్రమే తెలుపుతాయి; అతిగా భుజించడం లేదా మద్యాసక్తి వంటి ప్రతికూల భావాన్ని చేర్చలేదు.
- source_word: γαμοῦντες
  choice: పెళ్లి చేసుకుంటూ
  rationale: γαμέω యొక్క ‘వివాహం చేసుకోవడం’ అనే సాధారణ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: γαμίζοντες
  choice: పెళ్లికి ఇచ్చుకుంటూ
  rationale: γαμοῦντεςతో ఉన్న పదభేదాన్ని నిలుపుతూ, ఇతరులను వివాహానికి ఇవ్వడం అనే సాధ్యమైన కర్తృవాచక భావాన్ని చూపుతుంది; వేరొక పాఠార్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: ἄχρι ἧς ἡμέρας
  choice: రోజు వరకు
  rationale: కొనసాగుతున్న కార్యకలాపాలకు ముగింపు బిందువును సూచించే కాలార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: నోవహు ఓడలో ప్రవేశించిన
  rationale: εἰσῆλθεν యొక్క నిర్ణాయక ప్రవేశ చర్యను ‘ప్రవేశించిన’ స్పష్టంగా ఇస్తుంది; నోవహు కథలో κιβωτόςకు ‘ఓడ’ సహజంగా అర్థమయ్యే తెలుగు వాడుక.
theological_decisions:
- issue: తినడం, తాగడం, వివాహం చేసుకోవడం వంటి చర్యలను పాపపూరితమైన అతిశయంగా చూపాలా, లేక తీర్పుకు ముందు కొనసాగిన సాధారణ జీవితంగా చూపాలా
  choice: ప్రత్యక్ష నైతిక నిందను చేర్చకుండా సాధారణ మానవ కార్యకలాపాలుగా అనువదించాం.
  alternative: అతిగా తింటూ తాగుతూ లేదా నిర్లక్ష్యంగా జీవిస్తూ ఉన్నారనే ప్రతికూల భావాన్ని అనువాదంలో చేర్చడం.
  rationale: గ్రీకు కృదంతాలు స్వతహాగా సాధారణ చర్యలనే సూచిస్తాయి; వాటికి నైతిక విశేషణాలు లేవు. సందర్భంలోని ఆకస్మికతను నిలుపుతూ, మూలంలో లేని ఖండనను చేర్చలేదు.
- issue: γαμίζοντες కర్తృవాచకమా లేక కర్మణివాచక భావమా
  choice: ప్రధాన పాఠ్యంలో ‘పెళ్లికి ఇచ్చుకుంటూ’ అని కర్తృవాచక భావాన్ని ఉంచాం.
  alternative: ‘పెళ్లికి ఇవ్వబడుతూ’ అని కర్మణివాచకంగా అనువదించడం.
  rationale: ఈ పదం సందర్భంలో ఇతరులను వివాహానికి ఇవ్వడాన్ని సూచించగలదు; అయితే ‘వివాహానికి ఇవ్వబడడం’ అనే అర్థసాధ్యత కూడా ఉన్నందున దానిని పాదసూచికలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘తింటూ తాగుతూ’ వంటి సహజ పదబంధాలు వాడి, మూలంలోని కొనసాగింపు మరియు సాధారణ జీవన స్వభావాన్ని నిలిపాం. ‘పెళ్లికి ఇచ్చుకుంటూ’ కొద్దిగా సాంప్రదాయ వాసన కలిగినా γαμοῦντες/γαμίζοντες మధ్యనున్న నిజమైన పదభేదాన్ని సంరక్షిస్తుంది.
