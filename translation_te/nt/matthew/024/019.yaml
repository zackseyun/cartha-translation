  source_fidelity: గ్రీకు వచనంలోని οὐαί యొక్క విలాపభరితమైన, రాబోయే కష్టాన్ని సూచించే బలం ‘అయ్యో!’లో బాగా ప్రతిఫలిస్తుంది. ‘ఆ రోజుల్లో’ కాలసూచక పదబంధం కూడా సరైనది. అయితే రెండవ దత్తి-కృదంత పదబంధం (ταῖς θηλαζούσαις) స్త్రీలింగ బహువచనాన్ని స్పష్టంగా కలిగి ఉంది; ముసాయిదాలోని ‘పాలిచ్చేవారికీ’ తెలుగు ప్రయోగంలో లింగ-అనిర్దిష్టంగా వినిపించవచ్చు.
  naturalness: ‘ఆ రోజుల్లో గర్భవతులకూ, పసిబిడ్డలకు పాలిచ్చే స్త్రీలకూ అయ్యో!’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఉంది. ‘స్త్రీలకూ’ రెండవ సమూహానికి మాత్రమే వర్తించి, మూలంలోని స్త్రీలింగ సూచనను అసహజ విస్తరణ లేకుండా తెలియజేస్తుంది.
  terminology: ‘గర్భవతులు’ గ్రీకు నుడికారమైన ἐν γαστρὶ ἔχωకు సరైన ఆధునిక తెలుగు సమానార్థకం. ‘పసిబిడ్డలకు పాలిచ్చే స్త్రీలు’ θηλάζω సూచించే శిశువుకు పాలివ్వడం/స్తన్యపానం చేయడాన్ని సందర్భానుకూలంగా వ్యక్తపరుస్తుంది. ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
