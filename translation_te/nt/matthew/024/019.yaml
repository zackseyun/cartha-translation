  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: te
  text: ఆ రోజుల్లో గర్భవతులకూ, పసిబిడ్డలకు పాలిచ్చే స్త్రీలకూ అయ్యో!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαί
  choice: అయ్యో!
  rationale: రాబోయే తీవ్ర కష్టాన్ని సూచించే విలాపభరిత ప్రవచనాత్మక ఉద్గారాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది ముందున్న హెచ్చరిక నుంచి స్వల్ప మార్పును సూచిస్తుంది; తెలుగు వాక్యక్రమం, సందర్భం ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తాయి. ‘కాని’ అని పెడితే మూలంలో ఉన్నదానికంటే బలమైన వ్యతిరేకత కలగవచ్చు.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: గర్భవతులకు
  rationale: ἐν γαστρὶ ἔχω అనే గ్రీకు నుడికారానికి సహజమైన, సంక్షిప్తమైన ఆధునిక తెలుగు రూపం.
- source_word: ταῖς θηλαζούσαις
  choice: పసిబిడ్డలకు పాలిచ్చేవారికి
  rationale: గ్రీకులో అంతర్లీనంగా ఉన్న శిశువు అనే కర్మను స్పష్టంచేస్తూ, పాలిచ్చే స్థితిలో ఎదురయ్యే కష్టాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: ఆ రోజుల్లో
  rationale: కాలసూచక పదబంధానికి సూటిగా, సహజంగా సరిపోతుంది.
theological_decisions:
- issue: స్త్రీలింగ దత్తి విభక్తి రూపాలు, కృదంతాల నిర్దేశ్యం
  choice: ‘గర్భవతులు’, ‘పసిబిడ్డలకు పాలిచ్చేవారు’ అని స్థితిని ప్రధానంగా చూపించడం
  alternative: ‘గర్భవతి స్త్రీలు’, ‘పసిబిడ్డలకు పాలిచ్చే స్త్రీలు’
  rationale: గ్రీకు రూపాలు స్త్రీలను స్పష్టంగా సూచిస్తాయి. తెలుగులో ‘గర్భవతులు’ అనే పదమే ఆ సూచనను సహజంగా కలిగి ఉంది; ‘పాలిచ్చేవారు’ కూడా సమాంతర నిర్మాణంలో అదే నిర్దేశ్యాన్ని తెలియజేస్తుంది. ‘స్త్రీలు’ అనే నామవాచకాన్ని అదనంగా చేర్చాల్సిన అవసరం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టమైన, గౌరవప్రదమైన, సంక్షిప్త ప్రవచనాత్మక శైలి. మూలంలోని ఒక్క ఉద్గార నిర్మాణాన్ని నిలుపుతూ వాక్యాన్ని ‘అయ్యో!’తో ముగించాం.
