id: MAT.24.50
reference: Matthew 24:50
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that servant will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: te
  text: ఆ బానిసకు[b] యజమాని[a] అతడు ఎదురుచూడని రోజున, అతనికి తెలియని గంటలో వస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రభువు.’ గ్రీకు κύριος పదానికి ‘ప్రభువు’ లేదా ‘యజమాని’ అనే అర్థాలు రావచ్చు; ఇక్కడ అది ఉపమానంలోని మానవ అధిపతిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దాసుడు’ లేదా ‘సేవకుడు.’ గ్రీకు δοῦλος పదం మరొకరి అధికారానికి బద్ధుడైన వ్యక్తిని సూచిస్తుంది; ఈ ఉపమాన సందర్భంలో బానిస స్థితి ప్రత్యేకంగా కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: వస్తాడు
  rationale: ἥκω భవిష్యత్ రూపం రాకను సూచిస్తుంది; యజమాని అనూహ్యంగా తిరిగి వచ్చే ఉపమాన సందర్భంలో ‘వస్తాడు’ సహజంగా ఉంది.
- source_word: κύριος
  choice: యజమాని
  rationale: ఇక్కడ κύριος దేవుని బిరుదుగా నేరుగా వాడబడలేదు; ఉపమానంలోని దాసునిపై అధికారం గల మానవ యజమానిని సూచిస్తుంది.
- source_word: δούλου
  choice: దాసుని
  rationale: δοῦλος స్వేచ్ఛాయుత ఉద్యోగిని కాక, మరొకరి అధికారానికి బద్ధుడైన సేవకుణ్ణి సూచిస్తుంది. ‘దాసుడు’ ఆ సంబంధాన్ని గౌరవప్రదమైన ఆధునిక తెలుగు శైలిలో తెలియజేస్తుంది; ‘బానిస’ అనే మరింత స్పష్టమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἐκείνου
  choice: ఆ
  rationale: ముందు ప్రస్తావించబడిన నిర్దిష్ట దాసుణ్ణి సూచించే నిర్దేశక పదాన్ని సహజమైన తెలుగులో ‘ఆ’గా ఇచ్చాం.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: అతడు ఎదురుచూడని రోజున
  rationale: రోజు నిర్దిష్టంగా తెలియదనే భావాన్ని, అలాగే దాసుడు ఆ రాకను ఆశిస్తూ ఉండడంలేదనే προσδοκάω భావాన్ని నిలుపుతుంది.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: అతనికి తెలియని గంటలో
  rationale: ‘రోజు—గంట’ అనే మూలపాఠంలోని సమాంతర నిర్మాణాన్ని నిలుపుతూ, γινώσκω యొక్క సాధారణ ‘తెలుసు’ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని κύριος పదానికి అనువాదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: విస్తృత సందర్భంలో ఉపమానానికి అంత్యకాల సంబంధమైన సూచన ఉన్నప్పటికీ, ఈ వాక్యంలోని తక్షణ కథా సందర్భం దాసుని మానవ అధిపతిని చూపిస్తుంది. ‘ప్రభువు’ అని మాత్రమే ఇస్తే ప్రత్యక్ష దైవబిరుదు భావాన్ని ముందుగానే నిర్ణయించే ప్రమాదం ఉంది.
- issue: δοῦλος సూచించే సామాజిక స్థితి
  choice: దాసుడు
  alternative: బానిస
  rationale: మూలపదం బద్ధమైన సేవా సంబంధాన్ని సూచిస్తుంది. ప్రధాన పాఠంలో సహజమైన ‘దాసుడు’ను ఉంచి, ఆ స్థితిని మరింత బలంగా తెలిపే ‘బానిస’ను పాదటిప్పణిలో ఇచ్చాం; దీనివల్ల మూలంలోని సామాజిక బలం మరుగుపడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. మూలంలోని ‘రోజు—గంట’ సమాంతరతను, అనూహ్య రాక భావాన్ని నిలిపాం. ‘యజమాని/ప్రభువు’ మరియు ‘దాసుడు/బానిస’ అర్థవిస్తృతిని పాదటిప్పణుల్లో స్పష్టం చేశాం.
