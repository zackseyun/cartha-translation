id: MAT.24.20
reference: Matthew 24:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: te
  text: కాని, మీరు పారిపోవడం చలికాలంలోగానీ సబ్బాతు రోజున[a] గానీ జరగకుండా ప్రార్థించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక సబ్బాతు రోజున.” గ్రీకులో ఇక్కడ నిర్దిష్ట ఉపపదం లేదు.
    reason: మూల గ్రీకులో σαββάτῳకు ఉపపదం లేకపోవడం వల్ల నిర్దిష్టతను ఖరారు చేయకుండా ప్రత్యామ్నాయ అనువాదాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: προσεύχεσθε
  choice: ప్రార్థించండి
  rationale: వర్తమానకాల ఆజ్ఞారూపంలోని రెండవ పురుష బహువచనం. సందర్భంలో నిరంతరతను బలవంతంగా చేర్చకుండా, సహజమైన తెలుగు ఆజ్ఞారూపంగా అనువదించబడింది.
- source_word: δὲ
  choice: కాని
  rationale: ముందున్న హెచ్చరికకు స్వల్ప వ్యత్యాసం లేదా సంభాషణ మలుపును సూచిస్తుంది; ‘కాని’ దీనిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἵνα μὴ γένηται
  choice: జరగకుండా
  rationale: ప్రార్థనలో కోరవలసిన విషయాన్ని తెలిపే ἵνα మరియు సంభావ్యార్థక క్రియను సహజమైన తెలుగు ప్రతికూల ప్రయోజన/విషయ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ἡ φυγὴ ὑμῶν
  choice: మీరు పారిపోవడం
  rationale: φυγή అంటే పారిపోవడం లేదా పలాయనం. విజయవంతమైన తప్పించుకోవడమనే భావాన్ని అదనంగా చేర్చకుండా, సాధారణ పాఠకులకు స్పష్టంగా ఉండే క్రియానామ రూపాన్ని ఎంచుకున్నాం.
- source_word: χειμῶνος
  choice: చలికాలంలో
  rationale: కాలాన్ని సూచించే గ్రీకు షష్ఠీ విభక్తిని సహజమైన తెలుగు కాలప్రయోగంగా ఇచ్చాం.
- source_word: μηδὲ σαββάτῳ
  choice: విశ్రాంతిదినాన గానీ
  rationale: రెండవ ప్రతికూల పరిస్థితిని సమన్వయపరుస్తుంది. σαββάτῳ యూదుల విశ్రాంతిదినాన్ని సూచిస్తుంది; తెలుగు ప్రధాన పాఠంలో నిర్దిష్టతను బలవంతంగా నిర్ణయించకుండా ఉంచాం.
theological_decisions:
- issue: σαββάτῳను నిర్దిష్టమైన ‘ఆ విశ్రాంతిదినం’గా లేదా అనిర్దిష్టమైన ‘ఒక విశ్రాంతిదినం’గా అనువదించడం
  choice: విశ్రాంతిదినాన
  alternative: ఒక విశ్రాంతిదినాన; ఆ విశ్రాంతిదినాన
  rationale: గ్రీకులో నామవాచకానికి ఉపపదం లేదు; అయితే అది తప్పనిసరిగా అనిర్దిష్టమని అర్థం కాదు. తెలుగులో ‘విశ్రాంతిదినాన’ అనే రూపం నిర్దిష్టతను అనవసరంగా ఖరారు చేయకుండా సందర్భార్థాన్ని సహజంగా అందిస్తుంది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘పలాయనం’ కంటే సామాన్యులకు సులభమైన ‘పారిపోవడం’ను ఎంచుకున్నాం; ‘సబ్బాతు’ అనే లిప్యంతరీకరణకు బదులుగా అర్థస్పష్టమైన ‘విశ్రాంతిదినం’ వాడాం.
