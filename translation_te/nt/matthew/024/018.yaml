  text: καὶ ὁ ἐν τῷ ἀγρῷ μὴ ἐπιστρεψάτω ὀπίσω ἆραι ⸂τὸ ἱμάτιον⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: te
  text: పొలంలో ఉన్నవాడు తన పైవస్త్రాన్ని[a] తీసుకోవడానికి వెనక్కి తిరగకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తన వస్త్రాన్ని’ లేదా ‘తన వెలుపలి వస్త్రాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: పొలంలో ఉన్నవాడు
  rationale: వ్యక్తిని సూచించే గ్రీకు విశేషణార్థక నిర్మాణాన్ని ఏ పురుషునికే పరిమితం చేయకుండా, ఏకవచన ప్రతినిధి భావంతో సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: వెనక్కి తిరగకూడదు
  rationale: μήతో కూడిన ఆజ్ఞార్థక క్రియలోని నిషేధాన్ని, ὀπίσωతో కలిసిన ‘వెనక్కి తిరుగు’ అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: ἆραι
  choice: తీసుకోవడానికి
  rationale: వెనక్కి తిరగడంలోని ఉద్దేశాన్ని తెలిపే క్రియారూపాన్ని సహజమైన ప్రయోజనార్థక నిర్మాణంతో అనువదిస్తుంది.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: తన పైవస్త్రాన్ని
  rationale: ἱμάτιον సాధారణంగా వెలుపల ధరించే వస్త్రాన్ని సూచిస్తుంది; ‘పైవస్త్రం’ సందర్భానికి తగిన స్పష్టతనిస్తూ, ‘వస్త్రం’ అనే విస్తృత అర్థాన్నీ పాదసూచికలో నిలుపుతుంది.
theological_decisions:
- issue: వ్యక్తిని సూచించే పుంలింగ ఏకవచన ఆర్టికల్
  choice: పొలంలో ఉన్నవాడు
  alternative: పొలంలో ఉన్న మగవాడు
  rationale: గ్రీకు పుంలింగ రూపం ఈ హెచ్చరికలో ప్రతినిధి/సామాన్య వ్యక్తిని సూచిస్తుంది. తెలుగు ‘ఉన్నవాడు’ ఏకవచన వ్యక్తిగత భావాన్ని సహజంగా నిలుపుతుంది; ‘మగవాడు’ అని అనవసరంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, అత్యవసర హెచ్చరిక ధోరణి నిలుపబడింది. ‘తిరగకూడదు’ నిషేధాత్మక ఆజ్ఞను సహజంగా వ్యక్తపరుస్తుంది.
