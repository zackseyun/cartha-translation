- from: అలాగే మీరు కూడా, ఇవన్నీ జరగడం చూసినప్పుడు, అది సమీపంలోనే, తలుపుల దగ్గరే ఉందని[a] తెలుసుకోండి.
  to: అలాగే మీరు కూడా, ఇవన్నీ చూసినప్పుడు, అది సమీపంలోనే, తలుపుల దగ్గరే ఉందని[a] తెలుసుకోండి.
