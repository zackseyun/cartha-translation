review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the comparison ('అలాగే మీరు కూడా'), the imperative force of γινώσκετε, the implicit subject of ἐγγύς ἐστιν, and the plural imagery of θύραις. However, 'ఇవన్నీ జరగడం' adds the notion of occurrence/events, whereas πάντα ταῦτα is simply 'all these things.' This interpretive addition is avoidable.
  naturalness: The phrasing is generally natural modern standard Telugu. 'అది సమీపంలోనే, తలుపుల దగ్గరే ఉందని' is understandable and suitably retains the idiomatic double expression of nearness.
  terminology: Key terms and register are appropriate. The neutral 'అది' properly avoids deciding the unstated Greek subject; the footnote supplies the personal alternative without imposing it on the main text.
  issues:
  - severity: low
    issue: Interpretive expansion of πάντα ταῦτα
    rationale: The wording 'ఇవన్నీ జరగడం చూసినప్పుడు' changes 'all these things' into 'seeing all these things happen.' Although compatible with context, 'జరగడం' is not expressed in the Greek and needlessly narrows the wording toward events.
  revised_text: అలాగే మీరు కూడా, ఇవన్నీ చూసినప్పుడు, అది సమీపంలోనే, తలుపుల దగ్గరే ఉందని[a] తెలుసుకోండి.
