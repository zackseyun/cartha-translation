id: MAT.24.33
reference: Matthew 24:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: te
  text: అలాగే మీరు కూడా, ఇవన్నీ చూసినప్పుడు, అది సమీపంలోనే, తలుపుల దగ్గరే ఉందని[a] తెలుసుకోండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన సమీపంలోనే, తలుపుల దగ్గరే ఉన్నాడని.” గ్రీకు పాఠంలో కర్త స్పష్టంగా పేర్కొనబడలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: అలాగే మీరు కూడా
  rationale: ముందున్న అంజూరపు చెట్టు ఉపమానంతో పోలికను οὕτως సూచిస్తుంది; καὶ ὑμεῖς శిష్యులను దానికి అనుగుణమైన పరిశీలకులుగా నొక్కిచెబుతుంది.
- source_word: ὅταν ἴδητε
  choice: చూసినప్పుడు
  rationale: ὅταν తో కూడిన aorist subjunctive ఇక్కడ భవిష్యత్తులో సంభవించే సందర్భాన్ని సూచిస్తుంది; తెలుగులో ‘చూసినప్పుడు’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: πάντα ταῦτα
  choice: ఇవన్నీ జరగడం
  rationale: నపుంసక బహువచనంలోని ‘ఇవన్నీ’ని నిలుపుతూ, సందర్భంలో ఇవి సంఘటనలని సహజ తెలుగులో తెలియజేయడానికి ‘జరగడం’ చేర్చబడింది.
- source_word: γινώσκετε
  choice: తెలుసుకోండి
  rationale: ఆజ్ఞార్థక బలాన్ని నిలుపుతూ, ఆధునిక తెలుగులో నేరుగా మరియు సహజంగా ఉంది.
- source_word: ἐγγύς
  choice: సమీపంలోనే
  rationale: అత్యంత దగ్గరగా ఉన్నదనే భావాన్ని ‘సమీపంలోనే’ స్పష్టంగా, గౌరవప్రదమైన శైలిలో వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ θύραις
  choice: తలుపుల దగ్గరే
  rationale: గ్రీకులోని θύραις బహువచనాన్ని నిలుపుతుంది; ఈ నుడికారం అత్యంత సమీపాన్ని సూచిస్తుంది.
- source_word: ἐγγύς ἐστιν
  choice: అది సమీపంలోనే ... ఉంది
  rationale: గ్రీకులో కర్త స్పష్టంగా లేదు. తెలుగు వాక్య నిర్మాణానికి అవసరమైన ‘అది’ని వాడి, వ్యక్తిని సూచించే ‘ఆయన’ ద్వారా సందిగ్ధతను అనవసరంగా పరిష్కరించకుండా ఉంచింది.
theological_decisions:
- issue: ἐγγύς ἐστιν లో అంతర్లీన కర్త
  choice: ‘అది సమీపంలోనే ... ఉంది’ అని తటస్థంగా అనువదించడం
  alternative: ‘ఆయన సమీపంలోనే ... ఉన్నాడు’
  rationale: గ్రీకు పాఠం కర్తను పేర్కొనదు. అది మనుష్యకుమారుని సూచిస్తుందా, రాబోయే సంఘటనలను సూచిస్తుందా, లేక అంతిమ నెరవేర్పును సూచిస్తుందా అన్నది స్పష్టంగా తేల్చకుండా మూలంలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని బహువచన ‘తలుపులు’ మరియు అంతర్లీన కర్త గురించిన సందిగ్ధత నిలుపబడ్డాయి.
