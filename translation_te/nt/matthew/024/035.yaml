  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: te
  text: ఆకాశం, భూమి గతించిపోతాయి; కానీ నా మాటలు ఎంతమాత్రమూ గతించిపోవు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: ఆకాశం, భూమి
  rationale: సృష్టించబడిన ప్రస్తుత లోకవ్యవస్థ మొత్తాన్ని సూచించే జంట పదబంధంగా సహజమైన ఆధునిక తెలుగు రూపం. ఇక్కడ οὐρανός కేవలం కనిపించే ఆకాశానికీ, γῆ ఏదైనా ప్రత్యేక భూభాగానికీ పరిమితం కావు.
- source_word: παρελεύσεται
  choice: గతించిపోతాయి
  rationale: ప్రస్తుత సృష్టి నిలిచిపోకుండా అంతరించిపోతుందనే భావాన్ని గంభీరంగా, అయితే దాని విధానాన్ని అదనంగా వివరించకుండా వ్యక్తం చేస్తుంది. గ్రీకులో సంయుక్త కర్తకు ఏకవచన క్రియ ఉన్నప్పటికీ తెలుగులో సహజంగా బహువచన క్రియ వాడబడింది.
- source_word: δὲ
  choice: కానీ
  rationale: ఆకాశం, భూమి నశ్వరతకూ యేసు మాటల శాశ్వత స్థిరత్వానికీ మధ్య ఉన్న స్పష్టమైన వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: λόγοι
  choice: మాటలు
  rationale: యేసు పలికిన ప్రకటనలు, బోధలను విస్తృతంగా సూచించే నేరమైన, సహజమైన తెలుగు పదం.
- source_word: οὐ μὴ παρέλθωσιν
  choice: ఎంతమాత్రమూ గతించిపోవు
  rationale: οὐ μή అనే బలమైన నిరాకరణను ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; సాధారణ ‘గతించిపోవు’ కంటే నిశ్చయార్థాన్ని బలపరుస్తుంది.
theological_decisions:
- issue: యేసు మాటల స్థిరత్వం గురించి చేసిన ప్రకటన బలం
  choice: సృష్టి గతించిపోవడానికీ యేసు మాటలు ఎంతమాత్రమూ గతించిపోకపోవడానికీ మధ్య ఉన్న బలమైన వ్యత్యాసాన్ని నేరుగా నిలుపుకోవడం
  alternative: యేసు దైవిక అధికారానికి సంబంధించిన సిద్ధాంతపరమైన అర్థాన్ని అనువాదంలోనే మరింత స్పష్టంగా చేర్చడం
  rationale: మూల వాక్యం యేసు మాటల శాశ్వత స్థిరత్వాన్ని గట్టిగా ప్రకటిస్తుంది. దాని సిద్ధాంతపరమైన పరిణామాలను అదనంగా చేర్చకుండా, వాక్యంలో ఉన్న దైవశాస్త్రీయ బరువును అనువాదం నిలుపుకుంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, గంభీరంగా రూపొందించబడింది. మూలంలోని οὐ μή బలాన్ని ప్రధాన పాఠ్యంలోనే ‘ఎంతమాత్రమూ’ ద్వారా తెలిపినందున పాదసూచిక అవసరం లేదు.
