id: MAT.24.32
reference: Matthew 24:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: te
  text: 'అంజూరపు చెట్టు నుండి ఈ ఉపమానాన్ని[a] నేర్చుకోండి: దాని కొమ్మ లేతగా మారి ఆకులు చిగురించగానే[b], వేసవికాలం[c] దగ్గరలో ఉందని మీకు తెలుసు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పాఠం,’ ‘దృష్టాంతం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆకులు మొలకెత్తగానే.’
    reason: lexical_alternative
  - marker: c
    text: θέρος అనే పదం ‘వేసవికాలం’ను, కొన్ని సందర్భాల్లో పంటకోత కాలాన్ని కూడా సూచించగలదు; ఇక్కడ అంజూరపు చెట్టు ఋతుసంబంధ చిత్రణలో ‘వేసవికాలం’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: అంజూరపు చెట్టు నుండి
  rationale: ἀπό + షష్ఠీ విభక్తి నేర్చుకునే మూలాన్ని సూచిస్తుంది. δέ ఇక్కడ స్వల్ప సంధానార్థకం; సందర్భం లేకుండా కృత్రిమంగా ‘ఇప్పుడు’ అని చేర్చకుండా, తెలుగులో సహజమైన వాక్యప్రవాహంలో దాని బలహీన సంధాన భావాన్ని అంతర్లీనంగా ఉంచాం.
- source_word: μάθετε
  choice: నేర్చుకోండి
  rationale: μανθάνω యొక్క భూతకాల ఆజ్ఞార్థక రూపం నేరమైన ఆదేశాన్ని ఇస్తుంది; ‘అర్థం చేసుకోండి’ కంటే ‘నేర్చుకోండి’ మూలపద చర్యను స్పష్టంగా కాపాడుతుంది.
- source_word: τὴν παραβολήν
  choice: ఈ ఉపమానం
  rationale: παραβολή ఇక్కడ అంజూరపు చెట్టు ద్వారా చెప్పే పోలిక లేదా దృష్టాంతం. ‘ఉపమానం’ సువార్తల పదప్రయోగాన్నీ, తరువాతి పోలికనూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὅταν ἤδη
  choice: చిగురించగానే
  rationale: ὅταν సాధారణ కాలసంబంధ పరిస్థితిని, ἤδη ఆ స్థితి మొదలైందనే భావాన్ని ఇస్తాయి. తెలుగులో ‘-గానే’ ఆ లక్షణం కనిపించిన వెంటనే గుర్తించే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: దాని కొమ్మ లేతగా మారి
  rationale: γένηται స్థితిమార్పును సూచిస్తుంది; ἁπαλός కొత్త పెరుగుదలలోని మృదుత్వం లేదా లేతదనాన్ని సూచిస్తుంది. వృక్షసంబంధ సందర్భంలో ‘లేతగా మారి’ సహజమైన తెలుగు.
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: ఆకులు చిగురించగానే
  rationale: ἐκφύῃ మొలకెత్తడం లేదా ఆకులు బయటకు రావడాన్ని సూచిస్తుంది. ‘ఆకులు చిగురించు’ ఆధునిక తెలుగులో సహజమైన వృక్షచిత్రణ.
- source_word: γινώσκετε
  choice: మీకు తెలుసు
  rationale: ఇది వర్తమానకాల ద్వితీయ పురుష బహువచన సూచనార్థక రూపం; కాబట్టి ఆజ్ఞగా కాక, సాధారణంగా తెలిసే విషయంగా అనువదించాం.
- source_word: ἐγγὺς τὸ θέρος
  choice: వేసవికాలం దగ్గరలో ఉంది
  rationale: అంజూరపు చెట్టు ఋతుసూచన సందర్భంలో θέρος ప్రధానంగా ‘వేసవికాలం’ను సూచిస్తుంది; ἐγγύς సమీపత్వాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: అంజూరపు చెట్టు చిత్రానికి సంకేతార్థం
  choice: ఋతువు దగ్గరపడిందని సహజ సూచనల ద్వారా గుర్తించే ఉపమానంగా మాత్రమే అనువదించడం
  alternative: అంజూరపు చెట్టు ఇశ్రాయేలును సంకేతంగా సూచిస్తుందని అనువాదంలోనే స్పష్టం చేయడం
  rationale: ఈ వచనంలోని గ్రీకు పాఠం అంజూరపు చెట్టును గమనించి కాలం సమీపించిందని తెలుసుకునే పోలికను నేరుగా చెబుతుంది; ఇశ్రాయేలుతో ప్రత్యేక సంకేతాత్మక గుర్తింపును ఈ వచనం స్వయంగా ప్రకటించదు. అందువల్ల విస్తృత అంత్యకాల వ్యాఖ్యానాన్ని అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బహువచన ఆజ్ఞార్థకాన్ని ఉపయోగించాం. వృక్షచిత్రణకు సహజమైన ‘లేతగా మారి,’ ‘ఆకులు చిగురించగానే’ అనే పదబంధాలు ఎంచుకున్నాం; మూలంలో లేని సిద్ధాంత వివరణను చేర్చలేదు.
