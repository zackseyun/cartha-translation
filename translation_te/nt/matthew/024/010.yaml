  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: te
  text: అప్పుడు చాలామంది తొట్రుపడతారు[a]; ఒకరినొకరు ద్రోహపూర్వకంగా అప్పగిస్తారు[b], ఒకరినొకరు ద్వేషిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘విశ్వాసం నుండి వైదొలగుతారు’ లేదా ‘మనస్తాపపడతారు.’
    reason: lexical_alternative
  - marker: b
    text: మూలపదానికి అక్షరార్థంగా ‘ఒకరినొకరు అప్పగిస్తారు’; సందర్భంలో ఇది ద్రోహపూరితమైన అప్పగింతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: యేసు ప్రసంగంలో సంఘటనల క్రమాన్ని సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: σκανδαλισθήσονται
  choice: విశ్వాసం నుండి వైదొలగుతారు
  rationale: హింసా సందర్భంలో ఈ క్రియ కేవలం మనస్తాపాన్ని కాక, ఒత్తిడి వల్ల విశ్వాస సంబంధమైన వెనుకడుగు లేదా పతనాన్ని సూచిస్తుంది. మూలంలో ‘విశ్వాసం’ అనే పదం ప్రత్యక్షంగా లేకపోయినా, సందర్భార్థాన్ని సహజమైన తెలుగులో స్పష్టం చేయడానికి ఈ రూపం ఎంచుకోబడింది; పదంలోని ఇతర భావసాధ్యతలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: వ్యక్తులను సూచిస్తూ నామవాచకంగా వాడిన పరిమాణవాచకానికి సహజమైన తెలుగు అనువాదం.
- source_word: ἀλλήλους
  choice: ఒకరినొకరు
  rationale: పరస్పర చర్యను స్పష్టంగా నిలుపుతుంది; రెండు సందర్భాల్లోనూ మూలంలోని పునరుక్తిని కాపాడుతుంది.
- source_word: παραδώσουσιν
  choice: ద్రోహంతో అప్పగిస్తారు
  rationale: παραδίδωμι యొక్క ప్రాథమిక ‘అప్పగించు’ భావాన్నీ, ఈ హింసా సందర్భంలోని ద్రోహ భావాన్నీ కలిపి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μισήσουσιν
  choice: ద్వేషిస్తారు
  rationale: క్రియలోని చురుకైన శత్రుత్వ భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: అప్పుడు ...; ... , ...
  rationale: తెలుగులో అతిగా ‘మరియు’ పునరావృతం చేయకుండా, విరామచిహ్నాలతో సంఘటనల వరుసను మరియు పెరుగుతున్న తీవ్రతను నిలుపుతుంది.
theological_decisions:
- issue: అంత్యకాల హింస సందర్భంలో σκανδαλισθήσονται అర్థం
  choice: విశ్వాసం నుండి వైదొలగుతారు
  alternative: తడబడతారు; అభ్యంతరపడతారు
  rationale: తదుపరి ద్రోహం, ద్వేషం అనే చర్యలతో కలిసి ఇది తీవ్రమైన వెనుకడుగు లేదా విశ్వాస విరమణను సూచిస్తుంది. అయితే ఇది ఏ నిర్దిష్ట అపోస్తాస్య సిద్ధాంతాన్నీ ఖరారు చేయదు; మూలపదంలోని విస్తృత భావాన్ని పాదసూచిక కాపాడుతుంది.
- issue: παραδώσουσιν లో అప్పగింత మరియు ద్రోహం మధ్య సంబంధం
  choice: ద్రోహంతో అప్పగిస్తారు
  alternative: ఒకరినొకరు అప్పగిస్తారు; ఒకరికి ఒకరు ద్రోహం చేస్తారు
  rationale: ఎవరికి అప్పగిస్తారో మూలపాఠం చెప్పదు. అందువల్ల అధికారులను లేదా నిర్దిష్ట శిక్షను చేర్చకుండా, చర్యలోని అప్పగింతను మరియు సందర్భంలోని ద్రోహ స్వభావాన్ని రెండింటినీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలి వాడబడింది. ‘ఒకరినొకరు’ అనే పునరుక్తి మూలంలోని పరస్పరతను, వాక్యంలోని పెరుగుతున్న ఉద్రిక్తతను నిలుపుతుంది.
