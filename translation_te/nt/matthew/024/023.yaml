id: MAT.24.23
reference: Matthew 24:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἐάν τις ὑμῖν εἴπῃ· Ἰδοὺ ὧδε ὁ χριστός, ἤ· Ὧδε, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: te
  text: అప్పుడు ఎవరైనా మీతో, “ఇదిగో, మెస్సీయ[a] ఇక్కడ ఉన్నాడు!” అని గానీ, “ఇక్కడ ఉన్నాడు!”[b] అని గానీ చెబితే, నమ్మవద్దు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “క్రీస్తు.” ‘మెస్సీయ,’ ‘క్రీస్తు’ అనే రెండూ “అభిషిక్తుడు” అనే బిరుదును సూచిస్తాయి.'
    reason: alternative_reading
  - marker: b
    text: 'మూలంలో సంక్షిప్తంగా: “లేదా, ‘ఇక్కడ!’”'
    reason: source_ellipsis
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: ముందున్న అంత్యకాల ప్రసంగంతో ఈ హెచ్చరికకు ఉన్న కాలక్రమ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: ఎవరైనా మీతో … చెబితే
  rationale: నిర్దిష్టం కాని వ్యక్తితో కూడిన షరతును ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షిస్తూ ఒక వ్యక్తిని లేదా స్థలాన్ని చూపించే గ్రీకు పదంలోని సూచనాత్మక బలాన్ని నిలుపుతుంది.
- source_word: ὧδε
  choice: ఇక్కడ
  rationale: రెండు సందర్భాల్లోనూ స్థలాన్ని సూచించే పదానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: నిర్దిష్ట ఉపపదంతో వచ్చిన ఈ పదం ఇక్కడ వ్యక్తిపేరులా కాక, అభిషిక్తుడైన నిరీక్షిత విమోచకుని బిరుదుగా పనిచేస్తోంది.
- source_word: ἤ· Ὧδε
  choice: అనిగాని, “ఇక్కడ ఉన్నాడు!” అనిగాని
  rationale: గ్రీకులో రెండో మాట సంక్షిప్తంగా ఉండి, కర్త మరియు క్రియను పునరుక్తి చేయదు. తెలుగులో అర్థానికి అవసరమైన ‘ఉన్నాడు’ను పూరించి, కర్తను పూరించకుండా ఆ సంక్షిప్తతను కొంతవరకు నిలిపింది.
- source_word: μὴ πιστεύσητε
  choice: నమ్మవద్దు
  rationale: μήతో కూడిన నిషేధార్థక aorist subjunctive‌ను సహజమైన తెలుగు ఆజ్ఞారూపంలో అందిస్తుంది; గ్రీకులో లేని నిర్దిష్ట కర్మను చేర్చదు.
theological_decisions:
- issue: Χριστός పదం అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు / ఆ క్రీస్తు
  rationale: ఈ సందర్భం నిరీక్షిత అభిషిక్తుని గుర్తింపు, స్థానం గురించి చేసే వాదనలను హెచ్చరిస్తోంది. కాబట్టి బిరుదు భావాన్ని ‘మెస్సీయ’ స్పష్టంగా నిలుపుతుంది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఉంచాం.
- issue: రెండో Ὧδεలో లుప్తమైన మాటల పూరణ
  choice: “ఇక్కడ ఉన్నాడు!”
  alternative: “ఇక్కడ!”
  rationale: మూలంలోని సంక్షిప్తతను పూర్తిగా తొలగించకుండా, సాధారణ తెలుగు పాఠకునికి ఉద్దేశించిన వ్యక్తి గురించి చెప్పబడుతోందని అర్థమయ్యేంత మాత్రంగా క్రియను పూరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి వాడబడింది. ‘అనిగాని … అనిగాని’ నిర్మాణం రెండు ప్రత్యామ్నాయ ప్రత్యక్ష వాక్యాలను స్పష్టంగా కలుపుతుంది; మూలంలోని హెచ్చరిక స్వరం ‘నమ్మవద్దు’లో నిలిచింది.
