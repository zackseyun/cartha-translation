revisions:
- from: జలప్రళయం వచ్చి వారందరినీ కొట్టుకుపోయే వరకు వారు గ్రహించలేదు. మనుష్య కుమారుని రాక కూడా అలాగే ఉంటుంది.
  to: జలప్రళయం వచ్చి వారందరినీ కొట్టుకుపోయేదాకా వారికి తెలియలేదు. మనుష్య కుమారుని రాక కూడా అలాగే ఉంటుంది.
