review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the flood's arrival, its removal of everyone, and the comparison with the coming (παρουσία) of the Son of Man. However, the present/future-looking form “కొట్టుకుపోయే వరకు” is less precise for the Greek aorist event ἦρεν (“swept/carried away”). “కొట్టుకుపోయేదాకా” naturally locates the completed event in the past narrative.
  naturalness: The revised first sentence is idiomatic modern standard Telugu. “వారికి తెలియలేదు” is a natural rendering of οὐκ ἔγνωσαν in this context, without requiring an explicit object.
  terminology: “జలప్రళయం,” “మనుష్య కుమారుడు,” and “రాక” are suitable and clear. “రాక” appropriately renders παρουσία here without importing a more technical doctrinal term.
  issues:
  - severity: low
    issue: Aspect in “కొట్టుకుపోయే వరకు”
    rationale: The form can sound prospective (‘until it would sweep them away’), whereas the Greek narrates the flood's completed action. “కొట్టుకుపోయేదాకా” better fits the past event.
  revised_text: జలప్రళయం వచ్చి వారందరినీ కొట్టుకుపోయేదాకా వారికి తెలియలేదు. మనుష్య కుమారుని రాక కూడా అలాగే ఉంటుంది.
  revised_footnotes: []
  revision_rationale: A minimal aspectual and idiomatic adjustment clarifies that the flood actually came and swept all away, while retaining the source's comparison and the draft's established terminology.
