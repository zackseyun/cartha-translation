id: MAT.24.39
reference: Matthew 24:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: te
  text: జలప్రళయం వచ్చి వారందరినీ కొట్టుకుపోయేదాకా వారికి తెలియలేదు. మనుష్య కుమారుని రాక కూడా అలాగే ఉంటుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: వారు గ్రహించలేదు
  rationale: ఇక్కడ γινώσκω కేవలం సమాచారం తెలియకపోవడం కంటే, జరుగబోయేదాన్ని గుర్తించి అర్థం చేసుకోకపోవడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘గ్రహించలేదు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: κατακλυσμός
  choice: జలప్రళయం
  rationale: నోవహు కాలంలోని మహా వరదను సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: ἦρεν ἅπαντας
  choice: వారందరినీ కొట్టుకుపోయే
  rationale: αἴρω అనే పదానికి ‘తీసివేయు/ఎత్తుకొను’ అనే మూలార్థం ఉన్నా, వరద సందర్భంలో ‘కొట్టుకుపోవు’ సహజంగా ఉండి, అకస్మాత్తుగా అందరూ తొలగించబడిన భావాన్ని కాపాడుతుంది.
- source_word: παρουσία
  choice: రాక
  rationale: ఈ సందర్భంలో మనుష్య కుమారుని ప్రత్యక్ష రాకను సూచిస్తుంది; సాధారణ పాఠకులకు ‘రాక’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్య కుమారుడు
  rationale: యేసు ఉపయోగించిన బిరుదుకు సాంప్రదాయబద్ధమైన, మూలరూపాన్ని సన్నిహితంగా నిలుపుకునే తెలుగు అనువాదం.
theological_decisions:
- issue: ἦρεν అనే క్రియ యొక్క భావం
  choice: వరద వారందరినీ ‘కొట్టుకుపోయింది’ అనే విధ్వంసక సందర్భార్థం
  alternative: ‘వారందరినీ తీసుకుపోయింది’
  rationale: ఈ వాక్యంలో తీసుకుపోవడం రక్షణార్థకమా తీర్పార్థకమా అనే అపార్థం రాకుండా, వరదచేత సంభవించిన తీర్పు మరియు నాశనాన్ని సందర్భానుసారంగా తెలియజేస్తుంది.
- issue: καὶ ἡ παρουσία లోని καὶ
  choice: ‘కూడా’ అని స్పష్టంగా అనువదించడం
  alternative: తెలుగులో వదిలివేయడం
  rationale: నోవహు దినాల సంఘటనకు మనుష్య కుమారుని రాకను నేరుగా సమాంతరంగా ఉంచే గ్రీకు వాక్యంలోని బలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. మూలంలోని రెండు సమన్విత భాగాలను తెలుగులో రెండు వాక్యాలుగా ఇచ్చి స్పష్టతను పెంచాం.
