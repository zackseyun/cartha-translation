  text: But the one who endures to the end will be saved[a][b].
translation:
  language: te
  text: కాని చివరివరకు సహించే వ్యక్తే రక్షించబడతాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అంతం వచ్చేవరకు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘విడిపించబడతాడు.’ గ్రీకు పదం విడిపించడాన్నీ లేదా రక్షించడాన్నీ సూచించగలదు; సందర్భం దాని భావాన్ని ఒక అర్థానికే పరిమితం చేయదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... ὑπομείνας
  choice: సహించే వ్యక్తి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న భూతకాల కృదంతం ఇక్కడ నామవాచకంగా పనిచేసి, సహనంతో నిలిచే వ్యక్తిని సూచిస్తుంది. లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: కాని
  rationale: ముందున్న విఫలత, ద్రోహం, ద్వేషం గురించిన హెచ్చరికలకు ఇది స్వల్ప వ్యతిరేకతను సూచిస్తుంది.
- source_word: ὑπομείνας
  choice: సహించే
  rationale: ὑπομένω శ్రమ లేదా ఒత్తిడి కింద నిలిచి సహించడాన్ని సూచిస్తుంది. ‘సహించే’ అనేది సూటిగా, సాధారణ పాఠకులకు సులభంగా ఉంటుంది.
- source_word: εἰς τέλος
  choice: చివరివరకు
  rationale: ఈ పదబంధం ఒక అంతిమ బిందువువరకు కొనసాగడాన్ని సూచిస్తుంది; ‘చివరివరకు’ సహజమైన, సంక్షిప్త తెలుగు రూపం.
- source_word: οὗτος
  choice: వ్యక్తే
  rationale: గ్రీకులోని ఉద్ఘాటనాత్మక, పునర్నిర్దేశక భావాన్ని తెలుగులో ‘ఏ’ ప్రత్యయంతో సహజంగా నిలుపుతుంది.
- source_word: σωθήσεται
  choice: రక్షించబడతాడు
  rationale: σῴζω యొక్క భవిష్యత్ కర్మణి రూపం రక్షణ లేదా విడుదల అనే విస్తృత భావాలను కలిగి ఉండగలదు. ‘రక్షించబడతాడు’ దాని విస్తృతమైన రక్షణార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: అంత్యకాల సహనం సందర్భంలో ‘రక్షించబడతాడు’ అనే మాట పరిధి
  choice: అంతిమ రక్షణనా, కష్టాలనుండి విడిపించడమా, లేక రెండూ కలిసిన భావమా అని నిర్దిష్టం చేయకుండా ‘రక్షించబడతాడు’ అని ఉంచడం
  alternative: ‘విడిపించబడతాడు’ లేదా ‘అంతిమ రక్షణ పొందుతాడు’ అని భావాన్ని ఒక దిశకు పరిమితం చేయడం
  rationale: ఈ వాక్యం రక్షణ యొక్క ఖచ్చితమైన పరిధిని స్పష్టంగా తేల్చదు. అందువల్ల సహనం మరియు రక్షణ మధ్యనున్న వేదాంతపరమైన ఉద్వేగాన్ని ఏ సిద్ధాంతపరమైన నిర్ణయంతోనూ ముందుగానే పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘వ్యక్తే’ ద్వారా లింగనిరపేక్షతతో పాటు οὗτος యొక్క ఉద్ఘాటన నిలుపబడింది; పాదసూచికలు మూలంలోని నిజమైన అర్థవిస్తృతిని కాపాడుతున్నాయి.
