id: MAT.24.49
reference: Matthew 24:49
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἄρξηται τύπτειν τοὺς συνδούλους ⸂αὐτοῦ, ἐσθίῃ δὲ καὶ πίνῃ⸃ μετὰ τῶν μεθυόντων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/049.yaml
  text: and begins to beat his fellow servants[a], and eats and drinks with drunkards[b],
translation:
  language: te
  text: తన తోటి దాసులను[a] కొట్టడం మొదలుపెట్టి, మత్తెక్కేవారితో[b] కలిసి తిని తాగుతూ ఉంటే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన తోటి సేవకులను.’ గ్రీకు పదం అక్షరార్థంగా ఒకే యజమాని కింద ఉన్న ‘తోటి దాసులను’ సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘తాగుబోతులతో.’ గ్రీకు పదం మద్యం తాగి మత్తెక్కే వారిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: కొట్టడం మొదలుపెట్టి
  rationale: ἄρξηταιతో కూడిన infinitive చర్య ఆరంభాన్ని సూచిస్తుంది; τύπτειν సందర్భంలో హింసాత్మకంగా కొట్టడాన్ని తెలియజేస్తుంది.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: తన తోటి దాసులను
  rationale: σύνδουλος ఒకే యజమాని కింద ఉన్న సహదాసుడిని సూచిస్తుంది. ‘తోటి దాసులు’ ఉమ్మడి ఆధీనస్థితిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: కలిసి తిని తాగుతూ ఉంటే
  rationale: వర్తమాన subjunctive రూపాలు కొనసాగుతున్న లేదా అలవాటైన ప్రవర్తనను సూచిస్తాయి; వాక్యం ముందటి షరతు నిర్మాణంతో కొనసాగుతున్నందున ‘ఉంటే’ వాడబడింది.
- source_word: μετὰ τῶν μεθυόντων
  choice: మత్తెక్కేవారితో కలిసి
  rationale: వర్తమాన participle మద్యం వల్ల మత్తెక్కే ప్రవర్తనలో ఉన్నవారిని సూచిస్తుంది; వ్యక్తులను స్థిరమైన ముద్రతో పిలవకుండా క్రియాత్మక భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: —
  rationale: ఇక్కడ δέ స్వల్ప అనుసంధానకంగా ఉంది; తెలుగులో ‘తిని తాగుతూ’ అనే సమన్వయ నిర్మాణమే ప్రవాహాన్ని సహజంగా తెలియజేస్తుంది కాబట్టి ప్రత్యేక పదంగా అనువదించలేదు.
theological_decisions:
- issue: σύνδουλος‌లోని δοῦλος భావం
  choice: తోటి దాసులు
  alternative: తోటి సేవకులు
  rationale: యజమాని గృహానికి చెందిన ఉపమాన సందర్భంలో ఉమ్మడి ఆధీనస్థితి ప్రధానంగా ఉంది. అందువల్ల ‘దాసులు’ గ్రీకు పదంలోని సామాజిక బలాన్ని కాపాడుతుంది; ‘సేవకులు’ కూడా సందర్భానుసారంగా సాధ్యమే.
- issue: μεθυόντων సూచించే వ్యక్తులు
  choice: మత్తెక్కేవారు
  alternative: తాగుబోతులు
  rationale: గ్రీకు participle మత్తులో పడే లేదా మద్యం సేవించి మత్తెక్కే వారిని వర్ణిస్తుంది. ‘మత్తెక్కేవారు’ ఆ క్రియాత్మక అస్పష్టతను కాపాడుతుంది; ‘తాగుబోతులు’ మరింత ముద్రవేసే నామవాచకం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ఉపమానంలోని గంభీర హెచ్చరిక స్వరాన్ని నిలుపుతూ అనువదించబడింది. ఈ వచనం ముందు వచనంలో మొదలైన షరతు వాక్యానికి కొనసాగింపు కావడంతో చివర ‘ఉంటే’ మరియు అల్పవిరామం ఉంచబడ్డాయి.
