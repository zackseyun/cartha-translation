id: MAT.24.17
reference: Matthew 24:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω ἆραι τὰ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: te
  text: ఇంటి మిద్దెపై ఉన్నవాడు తన ఇంట్లోని వస్తువులను తీసుకోవడానికి కిందికి దిగకూడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, సమతలంగా ఉండి ఉపయోగించగల ఇంటి పైకప్పు భాగం.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: ఇంటి మిద్దెపై ఉన్నవాడు
  rationale: గ్రీకు పదబంధం ‘ఇంటి పైకప్పు/మిద్దెపై ఉన్న వ్యక్తి’ అని నామవాచకార్థంలో పనిచేస్తుంది. ‘ఉన్నవాడు’ ప్రతినిధి ఏకవచనాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δώματος
  choice: మిద్దె
  rationale: δώμα ప్రాచీన ఇళ్లలో ఉపయోగించగల సమతల పైకప్పు భాగాన్ని సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘మిద్దె’ ఈ సాంస్కృతిక నిర్మాణ భావాన్ని ‘పైకప్పు’ కంటే స్పష్టంగా తెలియజేస్తుంది.
- source_word: μὴ καταβάτω
  choice: కిందికి దిగకూడదు
  rationale: ఈ నిషేధాత్మక ఆజ్ఞను తెలుగులో అత్యవసరమైన నిర్దేశంగా సహజంగా వ్యక్తం చేస్తుంది; ‘దిగు’ పైభాగం నుంచి కింది భాగానికి కదలికను నిలుపుతుంది.
- source_word: ἆραι
  choice: తీసుకోవడానికి
  rationale: 'αἴρω యొక్క ఇక్కడి క్రియారూపం ఉద్దేశాన్ని తెలియజేస్తుంది: వస్తువులను తీసుకోవాలనే ఉద్దేశంతో దిగడం.'
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: తన ఇంట్లోని వస్తువులను
  rationale: ఈ సంక్షిప్త గ్రీకు నిర్మాణం ఇంటిలోని వస్తువులు లేదా సామగ్రిని సూచిస్తుంది. ‘వస్తువులు’ అనేది ‘సామాను’ కంటే తక్కువ వ్యాఖ్యాత్మకంగా ఉండి, అర్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: οἰκίας
  choice: ఇంటి
  rationale: ఈ సందర్భంలో భవనంగా ఉన్న ఇంటినే సూచిస్తుంది; ‘గృహం’ కంటే ‘ఇల్లు’ ఆధునిక సాధారణ తెలుగులో సహజంగా ఉంటుంది.
- source_word: αὐτοῦ
  choice: తన
  rationale: తెలుగులో కర్త తన స్వంత ఇంటిని సూచిస్తున్నప్పుడు ఆత్మార్థక సర్వనామమైన ‘తన’ సహజమైనది. ఇది గ్రీకులోని ప్రతినిధి పురుష ఏకవచన సంబంధాన్ని సందర్భానుసారంగా నిలుపుతుంది.
theological_decisions:
- issue: ప్రతినిధి పురుష ఏకవచనం
  choice: ‘ఉన్నవాడు … తన’ అనే ఏకవచన నిర్మాణాన్ని నిలుపడం
  alternative: ‘ఉన్నవారు … తమ’ లేదా లింగనిరపేక్ష బహువచనం
  rationale: గ్రీకు వాక్యం ప్రతినిధి పురుష ఏకవచనాన్ని వాడుతుంది; ఇది సిద్ధాంతపరంగా పురుషులకు మాత్రమే వర్తించే ప్రకటన కాదు. తెలుగు సహజత్వంతోపాటు మూలంలోని ఏకవచన రూపాన్ని నిలుపడానికి ‘ఉన్నవాడు … తన’ ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే ఆజ్ఞలోని అత్యవసరతను మరియు ప్రాచీన ఇంటి నిర్మాణ నేపథ్యాన్ని నిలుపుతూ గౌరవప్రదమైన శైలి వాడబడింది.
