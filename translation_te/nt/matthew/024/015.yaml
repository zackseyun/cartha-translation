source:
  edition: SBLGNT
  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: te
  text: కాబట్టి, దానియేలు ప్రవక్త ద్వారా చెప్పబడిన ‘నాశనపు హేయవస్తువు’[b] ఒక పవిత్ర స్థలంలో[a] నిలిచి ఉన్నదాన్ని మీరు చూసినప్పుడు—చదివేవాడు గ్రహించాలి—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సంప్రదాయంగా: “ఆ పవిత్ర స్థలంలో.”'
    reason: alternative_reading
  - marker: b
    text: లేదా “నాశనాన్ని కలిగించే హేయవస్తువు” లేదా “నాశనం చేసే హేయవస్తువు.” ఈ పదబంధం దానియేలు గ్రంథంలోని మాటలను ప్రతిధ్వనింపజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: కాబట్టి, ... చూసినప్పుడు
  rationale: భవిష్యత్ సందర్భాన్ని సూచించే కాలవాచక నిర్మాణాన్నీ, ముందటి మాటలతో ఉన్న తార్కిక సంబంధాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἴδητε
  choice: మీరు చూసినప్పుడు
  rationale: బహువచన సంబోధనతో కూడిన ὁράω క్రియకు సూటి, సహజమైన అనువాదం.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: నాశనాన్ని కలిగించే హేయవస్తువు
  rationale: హేయమైన, అపవిత్రమైన వస్తువు లేదా కార్యాన్ని సూచించే βδέλυγμα భావాన్ని, ἐρημώσεωςతో దాని సంబంధాన్ని తెలుగులో అర్థమయ్యేలా ఇస్తుంది; దానియేలు గ్రంథంతో ఉన్న ప్రతిధ్వనిని ఉద్ధరణ చిహ్నాలు సూచిస్తాయి.
- source_word: τὸ ῥηθὲν
  choice: చెప్పబడిన
  rationale: ప్రవచనంగా పలికిన విషయాన్ని సూచించే నిష్క్రియ భూతకృదంతానికి సూటి రూపం.
- source_word: διὰ Δανιὴλ τοῦ προφήτου
  choice: దానియేలు ప్రవక్త ద్వారా
  rationale: διά + షష్ఠీ విభక్తిలోని మాధ్యమం లేదా ప్రతినిధిత్వ భావాన్ని ‘ద్వారా’ స్పష్టంగా కాపాడుతుంది.
- source_word: ἑστὸς
  choice: నిలిచి ఉండడం
  rationale: ἵστημι యొక్క సంపూర్ణ కృదంతం సూచించే నిలిపివేయబడి/నిలిచి ఉన్న స్థితిని, అది వ్యక్తేనని ముందే నిర్ణయించకుండా వ్యక్తపరుస్తుంది.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: ఒక పవిత్ర స్థలంలో
  rationale: మూలంలో τόπῳకి నిర్దిష్ట ఉపపదం లేకపోవడాన్ని ‘ఒక’తో ప్రతిబింబిస్తూ, ఆలయానికే పరిమితం చేయకుండా అసలు వాక్యంలోని విస్తృతిని నిలుపుతుంది.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: చదివేవాడు గ్రహించాలి
  rationale: పాఠకునికి ఉద్దేశించిన కుండలీకృత హెచ్చరికను సంక్షిప్తంగా, ఆజ్ఞార్థక బలంతో అందిస్తుంది.
theological_decisions:
- issue: τόπῳ ἁγίῳ యొక్క నిర్దిష్టత మరియు ఆలయ-ప్రత్యేక అర్థం
  choice: ఒక పవిత్ర స్థలంలో
  alternative: ఆ పవిత్ర స్థలంలో
  rationale: ఈ మాట ఆలయాన్ని సూచించే అవకాశం ఉన్నా, గ్రీకు పదబంధంలో నిర్దిష్ట ఉపపదం లేదు. అందువల్ల ప్రధాన పాఠం స్థలాన్ని ముందుగానే ఆలయంగా నిర్ధారించదు; సంప్రదాయ నిర్దిష్ట రూపం పాదసూచికలో ఉంచబడింది.
- issue: βδέλυγμα τῆς ἐρημώσεως అనే దానియేలు గ్రంథ పదబంధంలోని సంబంధం
  choice: నాశనాన్ని కలిగించే హేయవస్తువు
  alternative: నాశనపు హేయవస్తువు
  rationale: గ్రీకు షష్ఠీ సంబంధం ‘నాశనానికి దారితీసే’ లేదా ‘నాశనంతో సంబంధమున్న’ భావాలకు వీలు ఇస్తుంది. ప్రధాన పాఠం సహజ తెలుగులో కారణార్థక అవకాశాన్ని చూపుతుంది; మరింత రూపసామ్యమున్న, ఉద్దేశపూర్వకంగా అస్పష్టమైన రూపం పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. దానియేలు గ్రంథపు ప్రత్యేక పదబంధాన్ని ఉద్ధరణ చిహ్నాలతో గుర్తించి, దాని అర్థసంభావనలను పాదసూచికలో నిలిపాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
