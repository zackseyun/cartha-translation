- from: కాబట్టి, దానియేలు ప్రవక్త ద్వారా చెప్పబడిన ‘నాశనాన్ని కలిగించే హేయవస్తువు’[b] ఒక పవిత్ర స్థలంలో నిలిచి ఉండడం మీరు చూసినప్పుడు—చదివేవాడు గ్రహించాలి—[a]
