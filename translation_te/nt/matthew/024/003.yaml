review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the genitive absolute, the private approach of the disciples, the two questions, and the single sign governing both Jesus’ παρουσία and the συντέλεια τοῦ αἰῶνος. However, “ఈ యుగ” adds a demonstrative nuance not expressed by the Greek article; “యుగ” is more exact.
  naturalness: The overall Telugu is clear and modern. In a respectful narrative register referring to Jesus as “ఆయన,” the direct request “మాకు చెప్పు” is stylistically inconsistent; “మాకు చెప్పండి” is the natural respectful form. “విడిగా” more directly conveys κατ’ ἰδίαν (‘apart/private’) than “ఏకాంతంగా,” which can suggest being alone.
  terminology: “రాక” appropriately renders παρουσία in context while the footnote preserves legitimate lexical alternatives. “యుగ సమాప్తి” faithfully avoids importing ‘world’ into αἰών. “ఒలీవల కొండ” is an established and recognizable Telugu biblical place-name.
  issues:
  - severity: low
    issue: The phrase “ఈ యుగ సమాప్తి” includes “ఈ” (‘this’).
    rationale: τοῦ αἰῶνος has a definite article, not an explicit demonstrative. Removing “ఈ” preserves the Greek wording without narrowing it.
  - severity: medium
    issue: The direct address “మాకు చెప్పు” does not match the respectful register used for Jesus elsewhere in the sentence.
    rationale: Modern standard Telugu normally uses the respectful imperative “చెప్పండి” in this setting. This is a register correction, not a change in the Greek’s singular imperative.
  - severity: low
    issue: “ఏకాంతంగా” can imply solitude rather than a private/apart conversation.
    rationale: “విడిగా” naturally communicates that the disciples approached him apart from others, the sense of κατ’ ἰδίαν.
  revised_text: ఆయన ఒలీవల కొండపై కూర్చుని ఉండగా, శిష్యులు విడిగా ఆయన దగ్గరికి వచ్చి, “మాకు చెప్పండి—ఈ సంగతులు ఎప్పుడు జరుగుతాయి? నీ రాకకూ[a] యుగ సమాప్తికీ[b] సూచన ఏమిటి?” అని అడిగారు.
