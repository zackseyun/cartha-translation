id: MAT.24.3
reference: Matthew 24:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: te
  text: ఆయన ఒలీవల కొండపై కూర్చుని ఉండగా, శిష్యులు విడిగా ఆయన దగ్గరికి వచ్చి, “మాకు చెప్పండి—ఈ సంగతులు ఎప్పుడు జరుగుతాయి? నీ రాకకూ[a] యుగ సమాప్తికీ[b] సూచన ఏమిటి?” అని అడిగారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీ రాక” అనే మాటను “నీ సన్నిధి” లేదా “నీ ఆగమనం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “యుగ సమాప్తి” అనే మాటను “యుగ పరిపూర్తి” అని కూడా అనువదించవచ్చు; సాంప్రదాయంగా “లోకాంతం” అని అనువదించారు.
    reason: alternative_reading
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: ఆయన ... కూర్చుని ఉన్నప్పుడు
  rationale: αὐτοῦతో కూడిన genitive absoluteను సహజమైన కాలసూచక ఉపవాక్యంగా అనువదించి, కొనసాగుతున్న క్రియాభావాన్ని నిలిపింది.
- source_word: Ὄρους τῶν Ἐλαιῶν
  choice: ఒలీవల కొండ
  rationale: తెలుగు బైబిలు వాడుకలో గుర్తుపట్టదగిన స్థలనామం; మూలంలోని ‘ఒలీవ చెట్ల కొండ’ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: προσῆλθον αὐτῷ
  choice: ఆయన దగ్గరికి వచ్చి
  rationale: యేసువైపు వచ్చి చేరడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κατ’ ἰδίαν
  choice: ఏకాంతంగా
  rationale: ఇతరులకు వేరుగా, వ్యక్తిగతంగా వచ్చిన భావాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో తెలియజేస్తుంది.
- source_word: Εἰπὸν ἡμῖν
  choice: మాకు చెప్పు
  rationale: ఆజ్ఞార్థక రూపాన్ని తెలుగులో సహజమైన ప్రత్యక్ష అభ్యర్థనగా నిలుపుతుంది.
- source_word: πότε ταῦτα ἔσται
  choice: ఈ సంగతులు ఎప్పుడు జరుగుతాయి?
  rationale: ἔσται యొక్క విస్తృత భవిష్యదర్థాన్ని సందర్భానుసారంగా సహజంగా వ్యక్తం చేస్తూ, ταῦταను ‘ఈ సంగతులు’గా నిలుపుతుంది.
- source_word: σημεῖον
  choice: సూచన
  rationale: రాబోయే ఘటనను తెలియజేసే గుర్తు అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: παρουσίας
  choice: రాక
  rationale: భవిష్యదభిముఖమైన ప్రశ్నలో ‘రాక’ సహజంగా ఉంటుంది; ‘సన్నిధి/ఆగమనం’ అనే పదార్థ విస్తృతిని పాదటిప్పణిలో నిలిపింది.
- source_word: συντελείας
  choice: సమాప్తి
  rationale: ముగింపు మాత్రమే కాక పూర్తి స్థితికి చేరడమనే ఛాయను కొంతవరకు నిలిపే, సహజమైన గౌరవప్రద పదం.
- source_word: αἰῶνος
  choice: యుగ
  rationale: αἰώνను భౌతిక ప్రపంచంగా కాక కాలయుగంగా చూపి, మూలంలో లేని విశ్వనాశన భావాన్ని చేర్చదు.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో παρουσία అనువాదం
  choice: రాక
  alternative: సన్నిధి; ఆగమనం
  rationale: భవిష్యత్తులో యేసు రాకను సూచించే సందర్భబలాన్ని ‘రాక’ స్పష్టంగా అందిస్తుంది; అయితే పదానికి ఉన్న ‘సన్నిధి/ఆగమనం’ పరిధిని పాదటిప్పణిలో ఉంచి సందిగ్ధతను పూర్తిగా తొలగించలేదు.
- issue: συντελείας τοῦ αἰῶνος అనువాదం
  choice: ఈ యుగ సమాప్తి
  alternative: యుగ పరిపూర్తి; సాంప్రదాయంగా లోకాంతం
  rationale: మూలం భౌతిక లోక నాశనాన్ని స్పష్టంగా చెప్పకుండా యుగం పూర్తి కావడాన్ని సూచిస్తుంది. అందువల్ల ‘యుగ సమాప్తి’ని ప్రధాన పాఠంలో ఉంచి, ఇతర వాడుకలను పాదటిప్పణిలో తెలిపింది.
- issue: ఒకే σημεῖονకు παρουσία మరియు συντέλεια రెండింటి సంబంధం
  choice: నీ రాకకూ ఈ యుగ సమాప్తికీ సూచన ఏమిటి?
  alternative: నీ రాకకు సూచన ఏమిటి, యుగ సమాప్తికి సూచన ఏమిటి?
  rationale: గ్రీకులో ఒకే ఏకవచన ‘సూచన’ రెండు సమన్విత పదబంధాలతో సంబంధించబడింది; వాటిని రెండు వేర్వేరు సూచనలుగా విడగొట్టకుండా నిర్మాణాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి ఉపయోగించబడింది. ప్రశ్నలను విడిగా ఉంచడం ద్వారా తెలుగు వాక్యస్పష్టత పెరిగింది; అయితే గ్రీకు మూలంలోని ఒకే ‘సూచన’ రాకకూ యుగ సమాప్తికీ సంబంధించినదనే వ్యాకరణ సంబంధం నిలిపబడింది.
