revisions:
- from: ఆయన ఒలీవల కొండ మీద కూర్చుని ఉన్నప్పుడు, శిష్యులు ఏకాంతంగా ఆయన దగ్గరికి వచ్చి, “మాకు చెప్పు—ఈ సంగతులు ఎప్పుడు జరుగుతాయి? నీ రాకకూ[a] ఈ యుగ సమాప్తికీ[b] సూచన ఏమిటి?” అని అడిగారు.
  to: ఆయన ఒలీవల కొండపై కూర్చుని ఉండగా, శిష్యులు విడిగా ఆయన దగ్గరికి వచ్చి, “మాకు చెప్పండి—ఈ సంగతులు ఎప్పుడు జరుగుతాయి? నీ రాకకూ[a] యుగ సమాప్తికీ[b] సూచన ఏమిటి?” అని అడిగారు.
  rationale: 'The revision makes only safe linguistic and source-fidelity corrections: it uses the respectful Telugu imperative, clarifies the private/apart sense of κατ’ ἰδίαν, and removes the unexpressed demonstrative “ఈ” before “యుగ.” It retains one singular “సూచన” for both coordinated phrases, preserves the established place-name, and keeps lexical alternatives anchored to the relevant terms.'
  reviewer_model: gpt-5.6-terra
