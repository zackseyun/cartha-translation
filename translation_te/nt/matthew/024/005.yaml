id: MAT.24.5
reference: Matthew 24:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: te
  text: ఎందుకంటే చాలామంది నా పేరుతో వచ్చి, ‘నేనే మెస్సీయను[a]’ అని చెప్పి, చాలామందిని తప్పుదారి పట్టిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేనే క్రీస్తును.’ గ్రీకు బిరుదు ὁ χριστός.
    reason: గ్రీకు χριστός బిరుదుకు తెలుగులో వాడుకలో ఉన్న ప్రత్యామ్నాయ రూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: వ్యక్తులను సూచించే పరిమాణవాచకంగా ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న హెచ్చరికకు ఈ మాట కారణం లేదా వివరణ ఇస్తున్న సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐλεύσονται
  choice: వస్తారు
  rationale: ἔρχομαι భవిష్యత్ రూపానికి సందర్భానుగుణమైన సహజ తెలుగు అనువాదం.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: నా పేరుతో
  rationale: యేసు పేరు, గుర్తింపు లేదా అధికారాన్ని ఆధారంగా చేసుకొని రావడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; మూలంలోని సాధ్యమైన భావవిస్తృతిని అతిగా నిర్దిష్టం చేయదు.
- source_word: λέγοντες
  choice: అని చెప్పి
  rationale: వచ్చేవారు చేసే ప్రకటనను ప్రధాన క్రియతో సహజంగా కలుపుతుంది; ‘దావా చేస్తూ’ వంటి వ్యాఖ్యానాత్మక పదాన్ని చేర్చదు.
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: నేనే మెస్సీయను
  rationale: ἐγώ యొక్క ఉద్ఘాటనను ‘నేనే’ నిలుపుతుంది; ఆర్టికల్‌తో ఉన్న χριστός ఇక్కడ వ్యక్తిగత పేరుగా కాక, అభిషిక్తుడైన వాగ్దానపూర్ణ రాజును సూచించే బిరుదుగా ఉంది.
- source_word: πλανήσουσιν
  choice: తప్పుదారి పట్టిస్తారు
  rationale: మోసగించడం మరియు సరైన మార్గం నుంచి దారి మళ్లించడం అనే πλανάω పదంలోని రెండు భావఛాయలను నిలుపుతుంది.
- source_word: πολλοὺς
  choice: చాలామందిని
  rationale: క్రియకు వ్యక్తులను సూచించే కర్మగా సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: అబద్ధ మెస్సీయ దావాలో ὁ χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ వక్తలు తామే వాగ్దానం చేయబడిన అభిషిక్తుడమని ప్రకటిస్తున్నారు; అందువల్ల quasi-name లాగా వినిపించే రూపం కంటే బిరుదు భావాన్ని స్పష్టంగా తెలిపే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో ఉంచాం. సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘నా పేరుతో’ అనే సహజ ప్రయోగం మూలపదబంధంలోని అధికారం/గుర్తింపు సంబంధిత భావవిస్తృతిని తెరిచి ఉంచుతుంది.
