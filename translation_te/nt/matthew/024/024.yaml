id: MAT.24.24
reference: Matthew 24:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: te
  text: ఎందుకంటే అబద్ధ మెస్సీయలు[a], అబద్ధ ప్రవక్తలు ప్రత్యక్షమవుతారు; సాధ్యమైతే[c] ఎన్నుకోబడినవారిని సైతం దారితప్పించడానికి[b] గొప్ప సూచకక్రియలూ అద్భుతాలూ చేస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అబద్ధ క్రీస్తులు.” గ్రీకులో Χριστός అనే బిరుదు ఉంది; ఇక్కడ అది వ్యక్తినామంలా కాక బిరుదుగా ఉన్నందున “మెస్సీయలు” అని అనువదించాం.
    reason: alternative_reading
  - marker: b
    text: లేదా, “మోసగించడానికి.” మూలక్రియకు ఒకరిని దారి తప్పించడం, తప్పుదోవ పట్టించడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “సాధ్యమై ఉంటే.” గ్రీకు పాఠం కేవలం “సాధ్యమైతే” అని చెబుతూ, దాని వేదాంతపరమైన భావాన్ని వివరించకుండా వదిలేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: బయలుదేరి
  rationale: ఇక్కడ ఈ క్రియ వ్యక్తులు రంగంలోకి రావడం లేదా ప్రత్యక్షం కావడం అనే భావంలో ఉంది; పునరుత్థాన భావం రాకుండా సహజమైన తెలుగులో ‘బయలుదేరి’ అని అనువదించాం.
- source_word: ψευδόχριστοι
  choice: అబద్ధ మెస్సీయలు
  rationale: Χριστός ఇక్కడ వ్యక్తినామంలా కాక బిరుదుగా వాడబడింది. అందువల్ల యూదుల మెస్సీయ నిరీక్షణ నేపథ్యాన్ని నిలిపేలా ‘మెస్సీయలు’ అని, ψευδο-ను ‘అబద్ధ’ అని అనువదించాం.
- source_word: ψευδοπροφῆται
  choice: అబద్ధ ప్రవక్తలు
  rationale: సంయుక్త నామవాచకానికి సూటిగా, సాధారణ ఆధునిక తెలుగు రూపం.
- source_word: δώσουσιν
  choice: చేస్తారు
  rationale: అక్షరార్థం ‘ఇస్తారు’ అయినా, సూచకక్రియలు మరియు అద్భుతాలతో కలిసినప్పుడు వాటిని ప్రదర్శించడం లేదా చేయడం అనే నుడికార భావం వస్తుంది; తెలుగులో ‘చేస్తారు’ సహజం.
- source_word: σημεῖα μεγάλα
  choice: గొప్ప సూచకక్రియలు
  rationale: σημεῖαను కేవలం ‘అద్భుతాలు’గా కలిపివేయకుండా, ఏదో అర్థాన్ని సూచించే కార్యాల భావాన్ని ‘సూచకక్రియలు’ నిలుపుతుంది.
- source_word: τέρατα
  choice: అద్భుతాలు
  rationale: చూసేవారిలో ఆశ్చర్యం కలిగించే కార్యాల భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ‘సూచకక్రియలూ అద్భుతాలూ’ అనే జంట కూడా స్పష్టంగా ఉంటుంది.
- source_word: ὥστε πλανῆσαι
  choice: దారితప్పించడానికి
  rationale: ὥστε + infinitiveలో ఉన్న ఉద్దేశం/ఫలితం మధ్య స్వల్ప అనిశ్చితిని తెలుగు ప్రయోజనార్థక రూపం సహజంగా మోయగలదు; πλανάωలోని దారి తప్పించే భావాన్ని కూడా నిలుపుతుంది.
- source_word: εἰ δυνατὸν
  choice: సాధ్యమైతే
  rationale: గ్రీకు పదబంధం సంక్షిప్తంగా ‘సాధ్యమైతే’ అని మాత్రమే చెబుతుంది. అసాధ్యతను ముందుగానే నిర్ధారించే ప్రతికల్పిత భావాన్ని అనువాదంలో చేర్చలేదు.
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: ఎన్నుకోబడినవారిని సైతం
  rationale: καί ఇక్కడ ‘సైతం’ అనే ఉద్ధాటక భావంలో ఉంది. ἐκλεκτούςకు అర్థవంతమైన, సాధారణ తెలుగు రూపంగా ‘ఎన్నుకోబడినవారు’ వాడాం.
theological_decisions:
- issue: ψευδόχριστοιలో Χριστός బిరుదు భావం
  choice: అబద్ధ మెస్సీయలు
  alternative: అబద్ధ క్రీస్తులు
  rationale: ఇక్కడ Χριστός బిరుదుగా ఉంది కాబట్టి ‘మెస్సీయలు’ మూలంలోని యూదీయ మెస్సీయ భావాన్ని స్పష్టంగా నిలుపుతుంది; సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: ఎన్నుకోబడినవారి విషయంలో εἰ δυνατὸν యొక్క భావం
  choice: సాధ్యమైతే
  alternative: సాధ్యమై ఉంటే
  rationale: మూలపాఠం సాధ్యతపై విస్తృత సిద్ధాంత నిర్ణయం చేయకుండా షరతును మాత్రమే ఉంచుతుంది. అందువల్ల ఆ వేదాంత ఉద్రిక్తతను పరిష్కరించకుండా అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘మెస్సీయలు,’ ‘సూచకక్రియలు,’ ‘ఎన్నుకోబడినవారు’ వంటి పదాలు మూలంలోని బిరుదు, సంకేతాత్మక కార్యం, ఎంపిక అనే భావాలను నిలుపుతాయి. పాదటిప్పణి గుర్తులన్నీ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
