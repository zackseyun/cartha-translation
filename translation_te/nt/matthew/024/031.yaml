id: MAT.24.31
reference: Matthew 24:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: te
  text: ఆయన గొప్ప బూరతో[a] తన దూతలను పంపిస్తాడు. వారు నాలుగు గాలుల నుండి[b]—ఆకాశాల ఒక చివర నుండి మరో చివర వరకు[c]—ఆయన ఎంచుకున్నవారిని[d] సమకూరుస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “బిగ్గర బూరతో” లేదా “బూరధ్వనితో.”'
    reason: lexical_alternative
  - marker: b
    text: “నాలుగు గాలులు” అనే మాట అన్ని దిక్కులలోని అత్యంత సుదూర ప్రాంతాలను సూచించే నానుడి.
    reason: cultural_note
  - marker: c
    text: 'గ్రీకు మూలంలో అక్షరార్థంగా: “ఆకాశాల చివరల నుండి వాటి చివరల వరకు”; అంటే ఒక అంచు నుండి మరో అంచు వరకు.'
    reason: lexical_alternative
  - marker: d
    text: 'లేదా: “ఆయన ఎన్నికైనవారిని.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: పంపిస్తాడు
  rationale: భవిష్యత్ క్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; సందర్భంలో దూతలను నియోగించి పంపడం స్పష్టంగా ఉంది.
- source_word: ἀγγέλους
  choice: దూతలను
  rationale: ఈ అంత్యకాల సందర్భంలో మానవ సందేశకులు కాక పరలోక దూతలు ఉద్దేశించబడ్డారు; తెలుగు బైబిలు వాడుకలో ‘దూతలు’ సహజం.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: గొప్ప బూరధ్వనితో
  rationale: σάλπιγξ అనే బూర ప్రతిమను నిలుపుతూ, μεγάλη ధ్వని గొప్పదనాన్ని లేదా బిగ్గరతనాన్ని సూచించగలదనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐπισυνάξουσιν
  choice: సమకూరుస్తారు
  rationale: వేర్వేరు ప్రాంతాల నుండి ఒకచోటికి చేర్చే సమూహీకరణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκλεκτούς
  choice: ఎర్పరచుకున్నవారిని
  rationale: ఎంచుకోబడినవారు అనే మూలార్థాన్ని సహజ తెలుగులో తెలియజేస్తూ, తరువాతి సిద్ధాంత వ్యవస్థను వాక్యంలోకి చొప్పించదు.
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: నాలుగు గాలుల దిక్కుల నుండీ
  rationale: ‘నాలుగు గాలులు’ అనే బైబిలు ప్రతిమను నిలుపుతూ, తెలుగులో ఇది దిక్కులను సూచిస్తుందని అర్థమయ్యేలా ‘దిక్కుల’ను జతచేస్తుంది.
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: ఆకాశాల ఒక చివర నుండి వాటి మరొక చివర వరకు
  rationale: οὐρανῶν అనే బహువచనాన్ని నిలుపుతూ, ఒక అంచు నుండి మరో అంచు వరకూ ఉన్న సంపూర్ణ విస్తృతిని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో ἐκλεκτούς పదం
  choice: ఆయన ఏర్పరచుకున్నవారు
  alternative: ఆయన ఎన్నికైనవారు; ఆయన ఎంచుకున్నవారు
  rationale: ఎవరిని ఏ విధంగా ఎన్నుకున్నారనే తరువాతి సిద్ధాంత వివరణను నిర్దేశించకుండా, దేవునికి చెందిన ఎంపిక భావాన్ని నిలుపుతుంది.
- issue: సమకూర్చబడే పరిధి
  choice: నాలుగు గాలుల దిక్కుల నుండీ—ఆకాశాల ఒక చివర నుండి వాటి మరొక చివర వరకు
  alternative: నాలుగు దిక్కుల నుండి; భూమి నలుమూలల నుండి
  rationale: మూలంలోని విస్తారమైన ఆకాశ సంబంధ ప్రతిమను భౌగోళిక భూమికి మాత్రమే పరిమితం చేయకుండా యథాతథంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘బూర’, ‘దూతలు’, ‘సమకూరుస్తారు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉపయోగించి, గ్రీకు మూలంలోని ఆకాశ సంబంధ విస్తృతి మరియు ‘నాలుగు గాలులు’ అనే ప్రతిమను నిలిపాం.
