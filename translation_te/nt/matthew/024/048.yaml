id: MAT.24.48
reference: Matthew 24:48
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: te
  text: అయితే ఆ దుష్ట సేవకుడు[a] తన హృదయంలో, ‘నా యజమాని[b] ఆలస్యం చేస్తున్నాడు’ అని చెప్పుకుంటే,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దుష్ట బానిస.’ గ్రీకు పదమైన δοῦλος సందర్భాన్ని బట్టి ‘సేవకుడు’ లేదా ‘బానిస’ అని అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా ప్రభువు.’ ఇక్కడ గృహ ఉపమాన సందర్భాన్ని బట్టి ‘యజమాని’ అని అనువదించాం; గ్రీకు పదం κύριος.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: అయితే … చేస్తే
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది; ἐὰνతో కూడిన షరతును వాక్యాంతంలోని ‘చేస్తే’ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: εἴπῃ
  choice: అని చెప్పుకుంటే
  rationale: ఇది షరతుతో కూడిన అంతరంగ స్వగతం. ‘చెప్పుకుంటే’ మూలంలోని ‘చెప్పు’ భావాన్ని, అంతరంగంలో తనకు తాను చెప్పుకునే భావాన్ని రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: ఆ దుష్ట సేవకుడు
  rationale: κακός ఇక్కడ నైతిక దుష్టత్వాన్ని సూచిస్తుంది; ἐκεῖνοςలోని నిర్దేశక బలాన్ని ‘ఆ’ నిలుపుతుంది. గృహ నిర్వహణ సందర్భంలో δοῦλοςకు ‘సేవకుడు’ సహజం; ‘బానిస’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: తన హృదయంలో
  rationale: అంతరంగ ఆలోచనను సూచించే మూల రూపకాన్ని నిలుపుతూ, ఆధునిక తెలుగులో అర్థమయ్యే బైబిలీయ గాంభీర్యాన్ని కాపాడుతుంది.
- source_word: Χρονίζει
  choice: ఆలస్యం చేస్తున్నాడు
  rationale: వర్తమాన కాలంలోని కొనసాగుతున్న ఆలస్య భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μου ὁ κύριος
  choice: నా యజమాని
  rationale: ఈ గృహ ఉపమాన సందర్భంలో κύριος సేవకునిపై అధికారమున్న యజమానిని సూచిస్తుంది. μουను ‘నా’గా సహజ క్రమంలో ఉంచాం; ‘ప్రభువు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నమోదు చేశాం.
theological_decisions:
- issue: గృహ ఉపమాన సందర్భంలో κύριος అనువాదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: తక్షణ కథా సందర్భం సేవకుడు–యజమాని సంబంధం కాబట్టి ‘యజమాని’ స్పష్టంగా ఉంటుంది. విస్తృత ప్రసంగంలో క్రీస్తును సూచించే ఉపమాన సంబంధాన్ని నిరాకరించకుండా, ప్రత్యక్ష పదార్థంలో అనవసరంగా క్రైస్తవ బిరుదును చొప్పించదు.
- issue: ఈ వచనంలో δοῦλος అనువాదం
  choice: సేవకుడు
  alternative: బానిస
  rationale: ఇక్కడ ప్రధానంగా అప్పగించబడిన గృహ బాధ్యత, ప్రవర్తనలపై దృష్టి ఉంది; చట్టపరమైన బానిస స్థితిపై కాదు. అయినా δοῦλοςకు ‘బానిస’ అనే నిజమైన పదార్థం ఉండటంతో దాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే మూలంలోని ‘హృదయంలో’ అనే రూపకాన్ని మరియు ఉపమాన గాంభీర్యాన్ని నిలిపాం. పాదటిప్పణి గుర్తులను అవి సంబంధించిన పదాల వెంట ఉంచాం.
