id: MAT.24.43
reference: Matthew 24:43
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: te
  text: 'అయితే ఇది తెలుసుకోండి: రాత్రి ఏ జామున[a] దొంగ వస్తాడో ఇంటి యజమానికి తెలిసి ఉంటే, అతడు మెలకువగా ఉండేవాడు; తన ఇంటికి కన్నం వేయనిచ్చేవాడు కాదు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఏ కావలి జాములో.” ప్రాచీన కాలంలో రాత్రిని కావలి జాములుగా విభజించేవారు.
    reason: cultural_note
  - marker: b
    text: అక్షరార్థంగా, “తన ఇంటిని తవ్వి లోనికి చొరబడనిచ్చేవాడు కాదు.” ప్రాచీన ఇళ్ల గోడ లేదా పైకప్పుకు కన్నం వేసి దొంగలు లోనికి ప్రవేశించగలిగేవారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: అయితే ఇది తెలుసుకోండి
  rationale: δέ సూచించే భావమలుపును ‘అయితే’ తెలియజేస్తుంది; γινώσκετε యొక్క ప్రత్యక్ష సంబోధనను సహజమైన బహువచన గౌరవ రూపంలో ఉంచింది.
- source_word: οἰκοδεσπότης
  choice: ఇంటి యజమాని
  rationale: ఇంటి లేదా కుటుంబ వ్యవహారాల అధిపతిని సూచించే పదానికి ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, స్పష్టమైన సమానం.
- source_word: ποίᾳ φυλακῇ
  choice: రాత్రి ఏ జామున
  rationale: φυλακή ఇక్కడ రాత్రిని విభజించిన కావలి జామును సూచిస్తుంది. ‘జాము’ కాలవిభాగ భావాన్ని నిలుపుతూ తెలుగు పాఠకులకు సహజంగా ఉంటుంది.
- source_word: ὁ κλέπτης ἔρχεται
  choice: దొంగ వస్తాడో
  rationale: గ్రీకు వర్తమాన రూపాన్ని షరతు వాక్యంలోని తెలిసిన రాక సమయంగా సహజ తెలుగులో అందిస్తుంది; దొంగ అప్పటికే వస్తున్నాడనే అనవసర భావాన్ని రుద్దదు.
- source_word: ἐγρηγόρησεν ἂν
  choice: మెలకువగా ఉండి
  rationale: రాత్రివేళ నిద్రపోకుండా అప్రమత్తంగా ఉండే చిత్రాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἂν εἴασεν
  choice: వేయనిచ్చేవాడు కాదు
  rationale: అనుమతించేవాడు కాదనే ప్రతిఘటనార్థక షరతు భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: తన ఇంటికి కన్నం వేయనిచ్చేవాడు కాదు
  rationale: διορύσσω యొక్క ‘తవ్వి చొరబడడం’ అనే ప్రాచీన గృహనిర్మాణ చిత్రాన్ని ‘కన్నం వేయడం’ సహజ తెలుగు నుడికారంలో నిలుపుతుంది; కేవలం సాధారణ ‘చొరబడడం’ కంటే మూలపద చిత్రానికి దగ్గరగా ఉంటుంది.
theological_decisions:
- issue: ఇంటి అధిపతి చిత్రణ
  choice: ఇంటి యజమాని
  alternative: గృహస్థుడు / ఇంటి అధిపతి
  rationale: ఇది ఉపమానంలోని సాధారణ పాత్ర; ప్రత్యేక సిద్ధాంతపరమైన బిరుదుగా మార్చకుండా, οἰκοδεσπότης సూచించే ఇంటి బాధ్యతగల అధిపతిని స్పష్టంగా తెలియజేస్తుంది.
- issue: దొంగతనానికి సంబంధించిన ప్రాచీన గృహ చిత్రణ
  choice: ఇంటికి కన్నం వేయడం
  alternative: ఇంట్లోకి చొరబడడం
  rationale: మూలంలోని గోడ లేదా పైకప్పును తవ్వి లోనికి ప్రవేశించే చిత్రాన్ని తెలుగులో అర్థవంతంగా నిలుపుతుంది; సాధారణీకరించి సాంస్కృతిక వివరాన్ని కోల్పోకుండా చూస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రత్యక్ష బోధనా శైలిని ఉపయోగించాం. ‘జాము,’ ‘కన్నం వేయడం’ వంటి సాధారణంగా అర్థమయ్యే పదాలు మూలంలోని రాత్రి కావలి మరియు తవ్వి చొరబడే చిత్రాలను నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
