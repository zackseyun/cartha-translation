id: MAT.24.8
reference: Matthew 24:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντα δὲ ταῦτα ἀρχὴ ὠδίνων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/008.yaml
  text: But all these things are the beginning of birth pains[a].
translation:
  language: te
  text: అయితే, ఇవన్నీ ప్రసవ వేదనలకు ఆరంభమే[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రసవ నొప్పులు’ లేదా ‘కాన్పు వేదనలు.’ గ్రీకు పదం, రాబోయే కష్టకాలపు ప్రారంభ దశకు రూపకంగా ప్రసవ వేదనలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: అన్నీ
  rationale: ταῦταతో కలిసి ‘ఇవన్నీ’ అనే సహజమైన సమగ్ర భావాన్ని ఇస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందు పేర్కొన్న సంఘటనల నుంచి యేసు ఇచ్చే మూల్యాంకనానికి ఉన్న స్వల్ప వ్యత్యాసాన్ని, సంధిని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: ταῦτα
  choice: ఇవి
  rationale: ముందు ప్రస్తావించిన సంఘటనలను స్పష్టంగా వెనక్కి సూచిస్తుంది; πάνταతో కలిపి ‘ఇవన్నీ’ అవుతుంది.
- source_word: ἀρχὴ
  choice: ఆరంభమే
  rationale: ఇవి అంతం కాదని, రాబోయే తీవ్ర పరిణామాల ప్రారంభ దశ మాత్రమేనని మూలంలోని predicate భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὠδίνων
  choice: ప్రసవ వేదనలు
  rationale: ప్రసవ సమయంలో కలిగే నొప్పులను సూచించే గ్రీకు రూపకాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ὠδίνων లోని ప్రసవ రూపకం
  choice: ‘ప్రసవ వేదనలు’ అని రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: బాధలు; కష్టాలు; ప్రసవ నొప్పులు
  rationale: ఈ కల్లోలాలు అంతమే కాక, మరింత పెద్ద పరిణామానికి ప్రారంభ దశ అని వాక్యం సూచిస్తుంది. నిర్దిష్ట అంత్యకాల సిద్ధాంతాన్ని చేర్చకుండా మూలంలోని రూపకాన్నీ ఉద్రిక్తతనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలిలో. ‘అయితే’ స్వల్ప వ్యత్యాసాన్ని చూపుతుంది; ‘ఆరంభమే’ ఇవి అంతం కాదనే సందర్భోచిత బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
