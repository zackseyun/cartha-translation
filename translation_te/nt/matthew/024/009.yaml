id: MAT.24.9
reference: Matthew 24:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: te
  text: అప్పుడు వారు మిమ్మల్ని బాధలకు[a] అప్పగించి చంపుతారు. నా పేరు[c] కారణంగా అన్ని దేశాలవారు[b] మిమ్మల్ని ద్వేషిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బాధలకు’ అనే గ్రీకు పదానికి ‘శ్రమకు,’ ‘అణచివేతకు,’ లేదా ‘హింసకు’ అని కూడా అర్థం రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అన్ని దేశాలవారు’ అని ఉన్నచోట ‘అన్ని జనాలు’ అని కూడా అనువదించవచ్చు; ఈ సందర్భంలో ‘యూదేతరులందరూ’ అనే అర్థం వచ్చే అవకాశం తక్కువ.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘నా పేరు కారణంగా.’ అంటే, యేసుపట్ల నిబద్ధత వల్ల, ఆయన పేరు సూచించే దాని కారణంగా.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: యేసు ప్రవచన ప్రసంగంలోని సంఘటనల క్రమాన్ని సూచించే సహజమైన కాలసూచక పదం.
- source_word: παραδώσουσιν ὑμᾶς
  choice: వారు మిమ్మల్ని ... అప్పగించి
  rationale: ఇతరుల అధికారానికి లేదా శత్రువుల చేతికి అప్పగించే భావాన్ని వ్యక్తపరుస్తుంది; ‘ద్రోహం చేస్తారు’ అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: εἰς θλῖψιν
  choice: బాధలకు
  rationale: θλῖψιςలోని బాధ, అణచివేత, హింస, విపత్తు అనే విస్తృత భావపరిధిని సాధ్యమైనంత సహజంగా నిలుపుతుంది; దీనిని ఒక నిర్దిష్ట అంత్యకాల సాంకేతిక పదంగా పరిమితం చేయదు.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: మిమ్మల్ని ... చంపుతారు
  rationale: క్రియ యొక్క సూటి అర్థాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది; ‘హత్య చేస్తారు’ అనే అదనపు నైతిక ఛాయను చేర్చదు.
- source_word: ἔσεσθε μισούμενοι
  choice: మిమ్మల్ని ద్వేషిస్తారు
  rationale: గ్రీకు భవిష్యత్ కర్మణి భావాన్ని తెలుగులో సహజమైన వాక్య నిర్మాణంతో అందిస్తుంది.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: అన్ని జనాలూ
  rationale: ఇక్కడ ἔθνη ప్రపంచవ్యాప్త జనసమూహాలను సూచిస్తుందని తెలియజేస్తుంది; సందర్భం నిర్బంధించని యూదేతరులు అనే సంకుచిత అర్థాన్ని రుద్దదు.
- source_word: διὰ τὸ ὄνομά μου
  choice: నా పేరు కారణంగా
  rationale: διά + accusativeలోని కారణార్థాన్ని స్పష్టంగా వ్యక్తపరుస్తూ, యేసు వ్యక్తిత్వం మరియు ఆయనతో అనుబంధాన్ని సూచించే ‘పేరు’ అనే మూల రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: అంత్యకాల ప్రసంగంలో θλῖψις పదార్థం
  choice: బాధలు
  alternative: హింస; శ్రమ; మహాశ్రమ
  rationale: ఈ సందర్భంలో వ్యక్తిగత హింస మరియు విస్తృత విపత్తు రెండింటి ప్రతిధ్వనులు ఉండవచ్చు. ‘బాధలు’ ఆ ఉద్రిక్తతను నిలుపుతూ ఏదైనా ప్రత్యేక అంత్యకాల పద్ధతిని వచనంలోకి చొప్పించదు.
- issue: ἔθνη పదార్థం
  choice: జనాలు
  alternative: యూదేతరులు; దేశాలు
  rationale: ‘అన్ని’తో కలిసిన ఈ పదబంధం ఇక్కడ విశ్వవ్యాప్త వ్యతిరేకతను సహజంగా సూచిస్తుంది; యూదులు–యూదేతరులు అనే భేదాన్ని సందర్భం కంటే ఎక్కువగా ముందుకు తేవదు.
- issue: ‘నా పేరు’ అనే వ్యక్తీకరణ
  choice: నా పేరు కారణంగా
  alternative: నా నిమిత్తం; నా నామం నిమిత్తం
  rationale: మూలంలోని ‘పేరు’ భావాన్ని తొలగించకుండా ఉంచుతుంది. పాదసూచికలో అది యేసుపట్ల విధేయతను, ఆయన ప్రతినిధ్యం చేసే సమస్తాన్ని సూచిస్తుందని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘అప్పగించి’ మూలంలోని న్యాయ/శత్రు అధికారానికి అప్పగించే భావాన్ని నిలుపుతుంది. ‘నామం’ కంటే సాధారణ పాఠకులకు సహజమైన ‘పేరు’ ఎంచుకున్నప్పటికీ, దాని ధార్మిక విస్తృతిని పాదసూచిక వివరిస్తుంది.
