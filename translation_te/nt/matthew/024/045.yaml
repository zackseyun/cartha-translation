id: MAT.24.45
reference: Matthew 24:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise servant[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: te
  text: “అయితే, తన ఇంటి పరివారంపై యజమాని[b] వారికి తగిన సమయంలో ఆహారం ఇవ్వడానికి నియమించిన నమ్మకమైన, వివేకంగల బానిస[a] ఎవరు?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సేవకుడు.” గ్రీకు పదం సందర్భాన్ని బట్టి “బానిస” లేదా “సేవకుడు” అని అర్థమివ్వగలదు. ఇక్కడ “బానిస” అనే పదం యజమాని అధికారానికి లోబడిన స్థితిని మరింత స్పష్టంగా నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రభువు.” ఇక్కడ ఇంటి నిర్వహణకు సంబంధించిన ఉపమాన సందర్భం ఉన్నందున గ్రీకు పదాన్ని “యజమాని” అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: Τίς ἄρα
  choice: అయితే ... ఎవరు?
  rationale: ἄρα ముందటి బోధన నుంచి వచ్చే కొనసాగింపు లేదా నిర్ధారణ భావాన్ని సూచిస్తుంది; తెలుగులో ప్రశ్నారంభంలోని ‘అయితే’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πιστὸς
  choice: నమ్మకమైన
  rationale: అప్పగించిన బాధ్యతను విశ్వసనీయంగా నిర్వహించే గుణాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δοῦλος
  choice: బానిస
  rationale: యజమాని అధికారానికి లోబడిన వ్యక్తి అనే δοῦλος పదంలోని బలమైన సామాజిక భావాన్ని నిలుపుతుంది; మృదువైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: φρόνιμος
  choice: వివేకంగల
  rationale: కేవలం జ్ఞానం కాక, బాధ్యతను ఆచరణాత్మక వివేకంతో నిర్వహించే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: κατέστησεν
  choice: నియమించిన
  rationale: బాధ్యతగల స్థానంలో ఉంచడం లేదా అధికారాన్ని అప్పగించడం అనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: κύριος
  choice: యజమాని
  rationale: ఇంటి నిర్వహణకు సంబంధించిన ఉపమాన సందర్భంలో సేవకులపై అధికారం గల ఇంటి యజమాని అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: οἰκετείας
  choice: ఇంటివారు
  rationale: ఇంటికి చెందిన సమూహాన్ని, ముఖ్యంగా ఆ ఇంటి పరివారాన్ని సూచిస్తుంది; తరువాతి బహువచన సర్వనామ భావానికి కూడా సరిపోతుంది.
- source_word: τοῦ δοῦναι
  choice: ఇవ్వడానికి
  rationale: నియామకపు ఉద్దేశాన్ని తెలిపే ఆర్టిక్యులర్ ఇన్ఫినిటివ్‌ను తెలుగులో ఉద్దేశార్థక క్రియారూపంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τροφὴν
  choice: ఆహారం
  rationale: పోషణకు కావలసిన భోజనం అనే సాధారణ అర్థాన్ని నిలుపుతూ, ‘రేషన్’ వంటి అవసరానికి మించిన నిర్దిష్టతను చేర్చదు.
- source_word: ἐν καιρῷ
  choice: తగిన సమయంలో
  rationale: సాధారణ కాలసూచనకన్నా సరైన లేదా అనుకూలమైన వేళ అనే καιρός భావాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ఇంటి ఉపమాన సందర్భంలో κύριος పదం అనువాదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: వాక్యపు ఉపరితల దృశ్యం ఇంటి యజమాని తన బానిసకు బాధ్యత అప్పగించడాన్ని వర్ణిస్తుంది. ‘యజమాని’ ఆ సామాజిక సంబంధాన్ని నిలుపుతుంది; విస్తృత సందర్భంలో ప్రభువును సూచించే అన్వయాన్ని నిరాకరించకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రశ్న నిర్మాణాన్ని వాడుతూ, ఉపమానంలోని యజమాని–బానిస సామాజిక సంబంధాన్ని మృదువుచేయకుండా నిలిపాం. వాక్యం సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయినా గంభీరత కోల్పోకుండా రూపొందించాం.
