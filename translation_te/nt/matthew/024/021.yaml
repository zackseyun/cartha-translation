source:
  edition: SBLGNT
  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: te
  text: ఎందుకంటే అప్పుడు మహా శ్రమ[a] కలుగుతుంది. లోకం ఆరంభమైనప్పటి నుండి ఇప్పటివరకు అలాంటిది కలగలేదు; ఇక ఎప్పటికీ కలగదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తీవ్రమైన సంకటం’ లేదా ‘మహా బాధ.’ గ్రీకు పదం తీవ్రమైన కష్టం, ఒత్తిడి లేదా అణచివేతను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: ఎందుకంటే అప్పుడు
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’ ద్వారా, τότε యొక్క కాలసూచనను ‘అప్పుడు’ ద్వారా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: θλῖψις μεγάλη
  choice: మహా శ్రమ
  rationale: θλῖψις సూచించే తీవ్రమైన కష్టం, ఒత్తిడి, బాధ అనే విస్తృత భావాన్ని ‘శ్రమ’ మోస్తుంది; ‘మహా’ μεγάλη యొక్క తీవ్రతను, అలాగే వాక్యభాగానికి ఉన్న అంత్యకాల గంభీరతను సిద్ధాంతపరమైన అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: οἵα
  choice: అలాంటిది
  rationale: ఇక్కడి గుణాత్మక పోలికను సహజమైన తెలుగులో వ్యక్తం చేస్తూ, తరువాతి అపూర్వత ప్రకటనతో స్పష్టంగా అనుసంధానిస్తుంది.
- source_word: γέγονεν
  choice: కలగలేదు
  rationale: γίνομαι యొక్క సంఘటనాత్మక భావాన్ని, గతం నుండి ఇప్పటివరకు అలాంటి శ్రమ సంభవించలేదనే పరిపూర్ణ కాల బలాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: ἀπ’ ἀρχῆς κόσμου
  choice: లోకం ఆరంభమైనప్పటి నుండి
  rationale: κόσμος ను ‘లోకం’గా నేరుగా అనువదించి, స్పష్టంగా లేని ‘సృష్టి’ అనే విస్తరణను చేర్చకుండా కాలపరమైన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἕως τοῦ νῦν
  choice: ఇప్పటివరకు
  rationale: మూలంలోని కాలపరమైన పరిమితిని సంక్షిప్తమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: ఇక ఎప్పటికీ కలగదు
  rationale: οὐ μή లోని బలమైన భవిష్యత్ నిరాకరణను ‘ఎప్పటికీ ... కలగదు’ స్పష్టంగా తెలియజేస్తుంది; ‘ఇక’ గతంతో పోల్చిన భవిష్యత్ భావాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἔσται
  choice: కలుగుతుంది
  rationale: θλῖψις సంభవించబోతున్నదనే అస్తిత్వాత్మక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అంత్యకాల భావభారం గల θλῖψις అనువాదం
  choice: మహా శ్రమ
  alternative: తీవ్రమైన సంకటం / మహా బాధ
  rationale: ‘మహా శ్రమ’ మూలపదంలోని తీవ్రమైన బాధ, ఒత్తిడి అనే భావాన్నీ, సందర్భంలోని గంభీరతనూ కాపాడుతుంది. అదే సమయంలో దాని స్వరూపం లేదా వ్యవధి గురించి ఏ ప్రత్యేక సిద్ధాంతాన్నీ అనువాదంలో చేర్చదు.
- issue: భవిష్యత్తులో పునరావృతం కాదనే బలమైన నిరాకరణ
  choice: ఇక ఎప్పటికీ కలగదు
  alternative: మళ్లీ ఎన్నడూ జరగదు
  rationale: οὐ μή యొక్క ఉద్ఘాటిత భవిష్యత్ నిరాకరణను నిలుపుతూ, ‘మళ్లీ’ అనే భావాన్ని అతిగా ముందుకు తేవకుండా పోలిక యొక్క సహజ సూచనను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే నిర్మాణం ఉపయోగించబడింది. ‘మహా శ్రమ’ సంప్రదాయ అంత్యకాల ప్రతిధ్వనిని నిలుపుతుంది; పాదసూచిక దాని విస్తృత పదార్థ పరిధిని తెలియజేస్తుంది.
