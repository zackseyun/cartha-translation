  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: te
  text: అక్రమం విస్తరించడం వల్ల[a], అనేకుల ప్రేమ చల్లారిపోతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అక్రమం పెరగడం వల్ల.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘చాలామంది యొక్క ప్రేమ చల్లారిపోతుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: విస్తరించడం వల్ల
  rationale: διάతో కూడిన articular infinitive కారణాన్ని సూచిస్తుంది. ‘విస్తరించడం వల్ల’ అనే రూపం కారణార్థాన్నీ, πληθυνθῆναι యొక్క క్రియాత్మక భావాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀνομίαν
  choice: అక్రమం
  rationale: ἀνομία దేవుని ధర్మాన్ని లెక్కచేయకపోవడం లేదా అతిక్రమించడం అనే భావాన్ని సూచిస్తుంది. ‘అక్రమం’ సాధారణ పాఠకులకు సహజంగా ఉండి, విస్తృతమైన ‘దుష్టత్వం’ కంటే మూలంలోని ధర్మవిరుద్ధత భావాన్ని మెరుగ్గా కాపాడుతుంది.
- source_word: ψυγήσεται
  choice: చల్లారిపోతుంది
  rationale: ఇది ప్రేమ లేదా అనురాగం తగ్గిపోవడాన్ని సూచించే రూపకం. ‘చల్లారిపోతుంది’ తెలుగులో సహజంగా ఉండి మూలంలోని చల్లబడే రూపకాన్ని నిలుపుతుంది.
- source_word: ἀγάπη
  choice: ప్రేమ
  rationale: ἀγάπηకి నేరుగా, సాధారణంగా అర్థమయ్యే సముచిత తెలుగు పదం ‘ప్రేమ’.
- source_word: τῶν πολλῶν
  choice: అనేకుల
  rationale: ఈ పదబంధం ఒక నిర్దిష్ట సమూహాన్ని స్పష్టంగా గుర్తించకుండా విస్తృతమైన, అనిర్దిష్ట సంఖ్యను సూచిస్తుంది. ‘అనేకుల’ ఆ అనిశ్చిత పరిధిని నిలుపుతుంది; ‘చాలామంది’ కూడా సాధ్యమైన సహజ ప్రత్యామ్నాయం.
theological_decisions:
- issue: ‘అనేకుల ప్రేమ’ యొక్క పరిధి
  choice: ఇది సమస్త మానవులను, శిష్యులుగా చెప్పుకునేవారిని, లేదా మిశ్రమ సమూహాన్ని సూచిస్తుందో నిర్ధారించకుండా ‘అనేకుల ప్రేమ’గా ఉంచబడింది.
  alternative: విశ్వాసుల మధ్య ప్రేమ చల్లారిపోతుంది / సమాజంలో మానవ ప్రేమ చల్లారిపోతుంది
  rationale: τῶν πολλῶν ఏ సమూహమో స్పష్టంగా చెప్పదు. అందువల్ల అనువాదం ఒక సంకుచితమైన వేదాంత వ్యాఖ్యానాన్ని దిగుమతి చేయకుండా మూలంలోని అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని కారణ సంబంధం, ప్రేమ చల్లబడే రూపకం, మరియు ప్రభావిత సమూహం గురించిన అనిశ్చితి కాపాడబడ్డాయి.
