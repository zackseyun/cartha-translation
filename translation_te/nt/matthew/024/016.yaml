lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: యేసు ప్రసంగంలో సంఘటనల క్రమాన్ని సూచించే కాలవాచక క్రియావిశేషణాన్ని సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: యూదయలో ఉన్నవారు
  rationale: ఉపపదబంధంతో కూడిన నిర్దేశక పదం వ్యక్తులను సూచిస్తోంది; ఈ రూపం తెలుగులో సహజంగా ఉండి, వారి ప్రాంతీయ స్థానాన్ని మాత్రమే తెలియజేస్తుంది.
- source_word: Ἰουδαίᾳ
  choice: యూదయ
  rationale: ఈ భౌగోళిక ప్రాంతానికి ఆధునిక ప్రామాణిక తెలుగులో సుపరిచితమైన పేరు.
- source_word: φευγέτωσαν
  choice: పారిపోవాలి
  rationale: మూడవ పురుష బహువచన వర్తమాన ఆజ్ఞార్థక రూపంలోని అత్యవసర ఆదేశ భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπὶ τὰ ὄρη
  choice: కొండలకు
  rationale: చలనాన్ని సూచించే క్రియతో ἐπί + ద్వితీయా విభక్తి గమ్యస్థానం వైపు కదలికను తెలియజేస్తుంది; ‘కొండలకు’ దానిని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అంత్యకాల హెచ్చరికలో ఆజ్ఞార్థక క్రియ బలం
  choice: అత్యవసరమైన ప్రత్యక్ష ఆదేశంగా ‘పారిపోవాలి’
  alternative: మరింత రూపసామ్యంగా ‘వారు కొండలకు పారిపోవనివ్వండి’ లేదా ‘వారు పారిపోవాలి గాక’
  rationale: ఈ వాక్యం సిద్ధాంతపరమైన కాలక్రమాన్ని నిర్ధారించకుండా ఆచరణాత్మకమైన అత్యవసర సూచన ఇస్తుంది. ‘పారిపోవాలి’ మూలంలోని ఆజ్ఞ బలాన్ని సహజమైన ఆధునిక తెలుగులో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. ‘యూదయ’ భౌగోళిక నామంగా, ‘కొండలు’ ὄρη యొక్క సాధారణ అర్థంగా వాడబడ్డాయి.
