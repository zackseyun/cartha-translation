  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: te
  text: ఇద్దరు స్త్రీలు[a] తిరగలి వద్ద[b] ధాన్యం రుబ్బుతూ ఉంటారు; ఒకరు తీసుకోబడతారు, మరొకరు విడిచిపెట్టబడతారు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు వాక్యంలో ‘రుబ్బుతూ’ అనే కృదంతం స్త్రీలింగ బహువచనంలో ఉంది; కాబట్టి ఇక్కడ చెప్పబడిన ఇద్దరూ స్త్రీలే.
    reason: lexical_alternative
  - marker: b
    text: ‘తిరగలి వద్ద’ అనే మాటను ‘చేతి తిరగలితో’ లేదా ‘తిరగలి రాయితో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు పాఠం కేవలం ‘ఒకరు తీసుకోబడతారు, మరొకరు విడిచిపెట్టబడతారు’ అని చెబుతుంది. తీసుకోబడటం రక్షణకా తీర్పుకా అనేది ఈ వాక్యంలో స్పష్టంగా చెప్పబడలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: ఇద్దరు స్త్రీలు … విసురుతూ ఉంటారు
  rationale: ἀλήθουσαι అనేది స్త్రీలింగ బహువచన వర్తమాన కర్తరి కృదంతం. అందువల్ల తెలుగులో సహజంగా ‘స్త్రీలు’ అనే నామవాచకాన్ని స్పష్టంగా చేర్చాం. సందర్భంలోని భావి దృశ్యాన్ని తెలుగులో ‘ఉంటారు’తో వ్యక్తం చేశాం.
- source_word: ἐν τῷ μύλῳ
  choice: తిరగలి దగ్గర
  rationale: μύλος తిరగలిని, మిల్లును, లేదా దాని రాయిని సూచించవచ్చు. గృహపనికి సంబంధించిన ఈ సందర్భంలో ‘తిరగలి’ సహజంగా ఉండి, యంత్రం స్వరూపాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: μία … μία
  choice: ఒకరు … మరొకరు
  rationale: ఇద్దరు స్త్రీల మధ్య విభజనను ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: παραλαμβάνεται
  choice: తీసుకోబడతారు
  rationale: వర్తమాన కర్మణి రూపాన్ని సాధ్యమైనంత నేరుగా ప్రతిబింబిస్తూ, ఎక్కడికి లేదా ఏ ఉద్దేశంతో తీసుకోబడతారో అనువాదంలో చేర్చలేదు.
- source_word: καὶ
  choice: మరొకరు
  rationale: గ్రీకులోని సాధారణ సమన్వయాన్ని తెలుగులో సహజమైన జంట నిర్మాణమైన ‘ఒకరు … మరొకరు’ ద్వారా తెలిపాం; అదనపు వ్యతిరేక భావాన్ని చేర్చలేదు.
- source_word: ἀφίεται
  choice: విడిచిపెట్టబడతారు
  rationale: కర్మణి భావాన్ని నిలుపుతూ, ‘వెనుక విడిచిపెట్టబడతారు’ లేదా ‘త్యజించబడతారు’ వంటి మరింత వ్యాఖ్యానాత్మకమైన పదాలను నివారించాం.
theological_decisions:
- issue: కృదంతంలో సూచించబడిన స్త్రీలింగ కర్తలను స్పష్టంగా చెప్పాలా?
  choice: ‘స్త్రీలు’ అని స్పష్టంగా అనువదించడం
  alternative: ‘ఇద్దరు తిరగలి దగ్గర విసురుతూ ఉంటారు’
  rationale: ἀλήθουσαι స్త్రీలింగ బహువచనం కాబట్టి, మూలపాఠంలో ఉన్న లింగసూచనను తెలుగులో దాచకుండా తెలిపాం.
- issue: ‘తీసుకోబడటం’ మరియు ‘విడిచిపెట్టబడటం’ రక్షణను లేదా తీర్పును సూచిస్తాయా?
  choice: వాటి అంత్యకాల సంబంధమైన ఫలితాన్ని ప్రధాన పాఠంలో నిర్ణయించకుండా ఉంచడం
  alternative: ఒకరు రక్షణకు తీసుకోబడతారు, మరొకరు తీర్పుకు విడిచిపెట్టబడతారు; లేదా ఒకరు తీర్పుకు తీసుకోబడతారు, మరొకరు కాపాడబడతారు
  rationale: ఈ వాక్యం విభజనను మాత్రమే స్పష్టంగా చెబుతుంది; ఎవరి చర్య రక్షణకు, ఎవరి చర్య తీర్పుకు సంబంధించినదో ఇక్కడ ప్రత్యక్షంగా నిర్ధారించదు. అందువల్ల అసలైన భావసందిగ్ధతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలిలో అనువదించాం. గ్రామీణ గృహపనిని సహజంగా సూచించేందుకు ‘తిరగలి’ మరియు ధాన్యం రుబ్బే అర్థంలోని ‘విసురుతూ’ అనే పదాలను వాడాం. మూలంలోని కర్మణి నిర్మాణాన్నీ వ్యాఖ్యానపరమైన అనిశ్చితినీ నిలిపాం.
