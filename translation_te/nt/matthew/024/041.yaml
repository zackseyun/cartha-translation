- from: ఇద్దరు స్త్రీలు[a] తిరగలి దగ్గర విసురుతూ ఉంటారు[b]; ఒకరు తీసుకోబడతారు, మరొకరు విడిచిపెట్టబడతారు.[c]
  to: ఇద్దరు స్త్రీలు[a] తిరగలి వద్ద[b] ధాన్యం రుబ్బుతూ ఉంటారు; ఒకరు తీసుకోబడతారు, మరొకరు విడిచిపెట్టబడతారు.[c]
  rationale: The sole necessary correction replaces the mistranslation ‘విసురుతూ’ (‘throwing’) with ‘ధాన్యం రుబ్బుతూ’ (‘grinding grain’). The addition of ‘ధాన్యం’ makes the activity natural and unambiguous in Telugu without altering the sense of the Greek. The wording otherwise preserves the feminine subjects, the domestic mill setting, the passive verbs, and the source text’s unresolved theological valence.
