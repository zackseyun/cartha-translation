    issue: ‘విసురుతూ’ is used for ἀλήθουσαι.
    rationale: In standard Telugu, ‘విసరడం’ denotes throwing or scattering, whereas ἀλήθω means grinding. This changes the stated activity and must be corrected to ‘రుబ్బుతూ’ (with ‘ధాన్యం’ supplied for natural clarity).
  revised_text: ఇద్దరు స్త్రీలు[a] తిరగలి వద్ద[b] ధాన్యం రుబ్బుతూ ఉంటారు; ఒకరు తీసుకోబడతారు, మరొకరు విడిచిపెట్టబడతారు.[c]
