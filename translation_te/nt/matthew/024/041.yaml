review_pass:
  verdict: revise
  source_fidelity: The feminine plural participle ἀλήθουσαι is correctly represented by ‘ఇద్దరు స్త్రీలు,’ and the passive, theologically unqualified contrast ‘one is taken … one is left’ is retained. However, ‘విసురుతూ’ means ‘throwing/casting’ in modern Telugu, not grinding grain, and therefore fails to translate ἀλήθουσαι.
  naturalness: ‘తిరగలి వద్ద ధాన్యం రుబ్బుతూ ఉంటారు’ is natural modern standard Telugu for women engaged in grinding at a handmill. The paired construction ‘ఒకరు … మరొకరు …’ is clear and idiomatic.
  terminology: ‘తిరగలి’ suitably renders μύλος without forcing a particular apparatus beyond the domestic grinding context. ‘తీసుకోబడతారు’ and ‘విడిచిపెట్టబడతారు’ preserve the Greek passive forms and do not impose an eschatological interpretation.
  issues:
