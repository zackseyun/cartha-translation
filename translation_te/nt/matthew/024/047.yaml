id: MAT.24.47
reference: Matthew 24:47
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: te
  text: 'నిజంగా నేను మీతో చెబుతున్నాను: అతడు తన ఆస్తులన్నిటికి అతనిని అధికారిగా నియమిస్తాడు.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తనకు ఉన్న సమస్తం.’
    reason: τοῖς ὑπάρχουσιν αὐτοῦ అనే గ్రీకు పదబంధానికి మరింత పదానుసారమైన ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἀμὴν
  choice: నిజంగా
  rationale: యేసు చేసే గంభీరమైన, అధికారపూర్వక ప్రకటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో చెబుతున్నాను
  rationale: గ్రీకు వర్తమాన క్రియను, సంబోధిత బహువచన సర్వనామాన్ని స్పష్టంగా ఉంచుతూ సూత్రబద్ధమైన గంభీరతను నిలుపుతుంది.
- source_word: ὅτι
  choice: ':'
  rationale: తెలుగులో తరువాతి విషయవాక్యాన్ని ద్విబిందువు సహజంగా పరిచయం చేస్తుంది; ప్రత్యేకంగా ‘అని’ చేర్చితే వాక్య నిర్మాణం భారంగా మారుతుంది.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: తన ఆస్తులన్నిటి మీద
  rationale: ἐπίతో కూడిన పదబంధం బాధ్యతా పరిధిపై అధికారాన్ని సూచిస్తుంది; τοῖς ὑπάρχουσιν అనేది అతనికి చెందిన సమస్తాన్ని సూచిస్తుంది.
- source_word: καταστήσει
  choice: నియమిస్తాడు
  rationale: ఈ సందర్భంలో కేవలం ఉంచడం కాక, పర్యవేక్షణ బాధ్యత గల స్థానంలో నియమించడమే భావం.
- source_word: αὐτόν
  choice: అతన్ని
  rationale: ముందటి సందర్భంలోని నమ్మకమైన, వివేకవంతమైన సేవకుణ్ణి సూచించే గ్రీకు పుంలింగ ఏకవచనాన్ని నిలుపుతుంది.
theological_decisions:
- issue: యజమాని ఇచ్చే ప్రతిఫలం లేదా అప్పగించే బాధ్యత స్వరూపం
  choice: ఉపమానంలోని సహజ భావం ప్రకారం యజమాని ఆస్తులన్నిటి మీద సేవకుణ్ణి నియమించడం అని సూటిగా అనువదించాం.
  alternative: దీనిని సంఘాధికారానికి లేదా అంత్యకాల పరలోక ప్రతిఫలానికి నిర్దిష్ట రూపకంగా అనువదించడం.
  rationale: వచనం విస్తృతమైన గృహనిర్వహణ బాధ్యతకు పదోన్నతిని మాత్రమే స్పష్టంగా చెబుతుంది; దాని కంటే ముందుకు వెళ్లే సిద్ధాంతపరమైన నిర్ధారణలను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. ‘ఆస్తులు’ పరిపాలనకు అప్పగించబడే సమస్త సంపదను సంక్షిప్తంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ పదానుసార భావం పాదసూచికలో ఉంది.
