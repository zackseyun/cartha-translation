  revision_rationale: 'This revision retains every source-level element: the solemn ‘ἀμὴν’ declaration, the addressees, the future appointment, the master’s possessions, and the masculine singular servant. It improves Telugu idiom by explicitly expressing the administrative role implicit in καταστήσει ἐπί, while the footnote preserves the lexical alternative ‘all that he has.’'
