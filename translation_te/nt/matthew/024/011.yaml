id: MAT.24.11
reference: Matthew 24:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: te
  text: చాలామంది అబద్ధ ప్రవక్తలు తలెత్తుతారు[b]; వారు చాలామందిని తప్పుదారి పట్టిస్తారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మోసగిస్తారు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “లేపబడతారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: వ్యక్తులను సూచించే పరిమాణవాచకంగా ఇది సహజమైన ఆధునిక తెలుగు; గ్రీకు పదంలోని ‘అనేకులు’ అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ψευδοπροφῆται
  choice: అబద్ధ ప్రవక్తలు
  rationale: తాము ప్రవక్తలమని చెప్పుకున్నా అసత్యమైన లేదా మోసపూరితమైన ప్రవక్తలను సూచించే స్థిరమైన, బైబిలు సందర్భానికి తగిన తెలుగు పదబంధం.
- source_word: ἐγερθήσονται
  choice: తలెత్తుతారు
  rationale: ఈ సందర్భంలో వ్యక్తులు ఉద్భవించడం లేదా రంగంలోకి రావడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; పునరుత్థాన భావాన్ని అనవసరంగా కలిగించదు. గ్రీకు నిష్క్రియ రూపానికి దగ్గరైన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: πλανήσουσιν
  choice: తప్పుదారి పట్టిస్తారు
  rationale: πλανάωలోని దారి తప్పించడం అనే రూపకాన్ని నిలుపుతూ, మోసగించడం లేదా తప్పుదోవ పట్టించడం అనే విస్తృత భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: πολλούς
  choice: చాలామందిని
  rationale: క్రియకు ప్రత్యక్ష కర్మగా ఉన్న ‘అనేకమంది ప్రజలను’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ ... καὶ
  choice: ; వారు
  rationale: గ్రీకులోని రెండు సమన్విత భవిష్యత్ చర్యలను తెలుగులో స్పష్టంగా, సహజంగా కలుపుతుంది; రెండవ క్రియకు కర్తను పునరుద్ఘాటించడం సాధారణ పాఠకుడికి వాక్యాన్ని సులభంగా అర్థమయ్యేలా చేస్తుంది.
theological_decisions:
- issue: πλανήσουσιν సూచించే మోసం యొక్క స్వభావం
  choice: అబద్ధ ప్రవక్తలు చాలామందిని సాధారణంగా తప్పుదారి పట్టిస్తారని చెప్పడం; అది సిద్ధాంతపరమైనదా, నైతికమైనదా, అంత్యకాల సంబంధమైనదా అని నిర్దిష్టం చేయకపోవడం.
  alternative: దీనిని కేవలం సిద్ధాంతపరమైన మోసంగా లేదా కేవలం నైతిక/అంత్యకాల మోసంగా పేర్కొనడం.
  rationale: గ్రీకు క్రియకు విస్తృత పరిధి ఉంది. మూలపాఠం నిర్దిష్టం చేయని మోసపు విధానాన్ని అనువాదం కూడా కుదించకుండా ఉంచుతుంది.
- issue: ἐγερθήσονται యొక్క నిష్క్రియ రూపం
  choice: సందర్భానుసారమైన ‘తలెత్తుతారు’ అనే భావంతో ప్రధాన పాఠంలో అనువదించడం.
  alternative: ‘లేపబడతారు’ అని గ్రీకు నిష్క్రియ రూపాన్ని మరింత ప్రత్యక్షంగా చూపించడం.
  rationale: ‘తలెత్తుతారు’ ఈ సందర్భంలో సహజంగా ఉండి, వారు ప్రత్యక్షమవుతారనే భావాన్ని ఇస్తుంది. ఎవరు వారిని లేపుతారో మూలపాఠం చెప్పదు; అందువల్ల దైవీయ చర్యను అనువాదంలో ఊహించలేదు, నిష్క్రియ ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గంభీరతను నిలుపుతూ అనువదించబడింది. ‘చాలామంది’ సహజ వాడుకను, ‘అబద్ధ ప్రవక్తలు’ బైబిలు పరిభాషను, ‘తప్పుదారి పట్టిస్తారు’ మూలంలోని రూపకాన్ని నిలుపుతాయి.
