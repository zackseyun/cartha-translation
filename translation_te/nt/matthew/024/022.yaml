id: MAT.24.22
reference: Matthew 24:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: te
  text: ఆ రోజులు కుదించబడకపోయి ఉంటే[a], ఏ మనిషీ రక్షించబడేవాడు కాదు; అయితే ఎన్నుకోబడినవారి నిమిత్తం[b] ఆ రోజులు కుదించబడతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తగ్గించబడకపోయి ఉంటే … తగ్గించబడతాయి.” గ్రీకు క్రియకు రోజులను కుదించడం లేదా వాటి వ్యవధిని తగ్గించడం అనే అర్థం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: “ఎన్నుకోబడినవారు” అని అనువదించిన గ్రీకు పదానికి “ఎంపిక చేయబడినవారు” అనే అర్థం ఉంది; ఈ వచనం మాత్రమే వారు ఎవరో మరింతగా నిర్వచించదు.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: కుదించబడకపోయి ఉంటే / కుదించబడతాయి
  rationale: κολοβόω కాలవ్యవధిని తగ్గించడం లేదా మధ్యలోనే ముగించడం అనే భావాన్ని ఇస్తుంది. రోజుల వ్యవధి తగ్గించబడుతుందనే అర్థాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేయడానికి ‘కుదించబడతాయి’ ఎంచుకోబడింది.
- source_word: οὐκ ἂν ἐσώθη
  choice: రక్షించబడేవాడు కాదు
  rationale: ఈ నిర్మాణం వాస్తవానికి విరుద్ధమైన ఫలితాన్ని వ్యక్తం చేస్తుంది. సందర్భంలో ప్రాణాలతో నిలిచి ఉండడం ప్రధాన భావమైనప్పటికీ, σῴζωలోని ‘రక్షించు’ అనే విస్తృత అర్థాన్ని సంకుచితం చేయకుండా ఉంచుతుంది.
- source_word: πᾶσα σάρξ
  choice: ఏ మనిషీ
  rationale: పదశః ‘సమస్త శరీరం’ అయిన ఈ బైబిలు నుడికారం ఇక్కడ మానవాళిని సూచిస్తుంది. నిరాకరణ వాక్యంలో ‘ఏ మనిషీ’ అనేది స్పష్టమైన, సహజమైన తెలుగు; σάρξను ‘పాప స్వభావం’గా తప్పుగా అర్థం చేసుకోనివ్వదు.
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: అయితే ఎన్నుకోబడినవారి నిమిత్తం
  rationale: διά + accusative ఇక్కడ కారణం లేదా ప్రయోజనాన్ని సూచిస్తుంది; ‘నిమిత్తం’ ఆ భావాన్ని నిలుపుతుంది. ἐκλεκτοίకు ‘ఎన్నుకోబడినవారు’ అని అనువదించడం, వారు ఎవరో ఈ వచనం కంటే మించి నిర్ణయించదు.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: ఆ రోజులు
  rationale: గ్రీకు నిర్దేశక పదబంధాన్ని సహజంగా, నేరుగా ప్రతిబింబిస్తుంది.
- source_word: καὶ εἰ μὴ
  choice: కుదించబడకపోయి ఉంటే
  rationale: గ్రీకులోని స్పష్టమైన షరతు నిర్మాణాన్ని తెలుగులో వాస్తవానికి విరుద్ధమైన షరతుగా సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అంత్యకాల ప్రసంగంలో ‘ఎన్నుకోబడినవారు’ ఎవరు?
  choice: ‘ఎన్నుకోబడినవారు’ అనే పదాన్నే వ్యాఖ్యాన విస్తరణ లేకుండా ఉంచడం.
  alternative: దేవుడు ఎన్నుకున్న ప్రజలు / విశ్వాసులు / నమ్మకమైన శేషం
  rationale: ἐκλεκτοί అనే వర్గం ఇక్కడ ప్రస్తావించబడినప్పటికీ, అది ఇశ్రాయేలా, సంఘమా, లేక ఒక శేషమా అనే విషయాన్ని ఈ వచనం స్వయంగా నిర్దేశించదు. అందువల్ల అనువాదం ఆ చర్చను తీర్చివేయదు.
- issue: ఈ సందర్భంలో σῴζω అర్థం
  choice: ‘రక్షించబడేవాడు’ అని అనువదించి, తక్షణ సందర్భంలో ప్రాణరక్షణ భావాన్ని అనుమతించడం.
  alternative: బతికి ఉండేవాడు / ప్రాణాలతో నిలిచేవాడు
  rationale: విపత్తు నుండి ప్రాణాలతో బయటపడడం సందర్భోచిత భావం. అయినప్పటికీ ‘బతికి ఉండడం’ అని మాత్రమే అనువదిస్తే గ్రీకు పదపు విస్తృత భావం అనవసరంగా సంకుచితమవుతుంది; ‘రక్షించబడడం’ భౌతిక లేదా మరింత విస్తృత భావాన్ని ముందుగానే ఖరారు చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘కుదించబడతాయి,’ ‘రక్షించబడేవాడు,’ ‘ఎన్నుకోబడినవారు’ వంటి పదాలు మూలంలోని కాల, రక్షణ, ఎంపిక భావాలను వ్యాఖ్యానాత్మకంగా సంకుచితం చేయకుండా నిలుపుతాయి.
