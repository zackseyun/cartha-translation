  source_fidelity: The main Telugu rendering accurately preserves the counterfactual condition, the passive shortening of the days, the consequence that no person would be saved, and the benefactive force of διὰ ... τοὺς ἐκλεκτούς. ‘ఏ మనిషీ’ is a clear idiomatic rendering of the negated idiom πᾶσα σάρξ and does not introduce the metaphorical sense of ‘flesh.’
