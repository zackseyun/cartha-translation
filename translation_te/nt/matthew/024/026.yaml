id: MAT.24.26
reference: Matthew 24:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: te
  text: కాబట్టి, ఎవరైనా మీతో, ‘ఇదిగో, ఆయన అరణ్యంలో ఉన్నాడు’ అని చెబితే, బయటికి వెళ్లకండి; ‘ఇదిగో, ఆయన లోపలి గదుల్లో ఉన్నాడు’ అని చెబితే, నమ్మకండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అరణ్యం” అనే పదాన్ని “ఎడారి” అని కూడా అనువదించవచ్చు. “లోపలి గదులు” అనే మాటకు “నిల్వ గదులు” లేదా “ఏకాంత గదులు” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν εἴπωσιν ὑμῖν
  choice: కాబట్టి, ఎవరైనా మీతో ... అని చెబితే
  rationale: οὖν ముందున్న హెచ్చరికతో తార్కిక సంబంధాన్ని చూపుతుంది; ἐὰν షరతును సూచిస్తుంది. గ్రీకులోని అనిర్దిష్ట మూడవ పురుష బహువచనాన్ని సహజమైన ఆధునిక తెలుగులో ‘ఎవరైనా’గా వ్యక్తం చేశాం.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే తక్షణ సూచనను, ప్రాచీనంగా అనిపించకుండా, గౌరవప్రదమైన సాధారణ తెలుగులో నిలుపుతుంది.
- source_word: ἐν τῇ ἐρήμῳ
  choice: అరణ్యంలో
  rationale: ἔρημος నిర్జన ప్రదేశం, అరణ్యం, ఎడారి అనే భావాలను కలిగి ఉండవచ్చు. ‘అరణ్యం’ ఇక్కడ విస్తృత భావాన్ని నిలుపుతుంది; ‘ఎడారి’ అనే ప్రత్యామ్నాయం పాదసూచనలో ఇవ్వబడింది.
- source_word: μὴ ἐξέλθητε
  choice: బయటికి వెళ్లకండి
  rationale: μήతో కూడిన aorist subjunctive నిషేధాన్ని నేరుగా వ్యక్తం చేస్తుంది; ἐξέρχομαιలోని బయటికి కదలికను ఈ రూపం నిలుపుతుంది.
- source_word: ἐν τοῖς ταμείοις
  choice: లోపలి గదుల్లో
  rationale: ταμεῖον లోపలి, వ్యక్తిగత లేదా నిల్వ గదిని సూచించగలదు. సందర్భానికి తగిన విస్తృత అర్థాన్ని ‘లోపలి గదులు’ అతిగా రహస్య భావం చేర్చకుండా తెలియజేస్తుంది.
- source_word: μὴ πιστεύσητε
  choice: నమ్మకండి
  rationale: ఇక్కడ πιστεύω చెప్పబడిన వాదనను నమ్మడాన్ని సూచిస్తుంది. తెలుగులో సందర్భం వల్ల కర్మ స్పష్టంగా ఉండటంతో అదనంగా ‘దానిని’ చేర్చలేదు.
theological_decisions:
- issue: ἐστίν యొక్క అంతర్లీన కర్త
  choice: ‘ఆయన ... ఉన్నాడు’ అని మాత్రమే వ్యక్తం చేయడం
  alternative: ‘క్రీస్తు అక్కడ ఉన్నాడు’ లేదా ‘యేసు అక్కడ ఉన్నాడు’
  rationale: సందర్భం కర్తను సూచించినా, ఈ వాక్యభాగంలో గ్రీకు ఆయనకు బిరుదు లేదా పేరు ఇవ్వదు. తెలుగు వ్యాకరణానికి అవసరమైన సర్వనామాన్ని మాత్రమే చేర్చి, నిర్దిష్ట బిరుదుతో భావాన్ని పరిష్కరించలేదు.
- issue: రెండు నివేదికల మధ్య సంబంధం
  choice: గ్రీకులో ఉన్నట్లే సంధానపదం చేర్చకుండా సమాంతరంగా ఉంచడం
  alternative: రెండవ నివేదికకు ముందు ‘లేదా’ చేర్చడం
  rationale: మూలంలో రెండవ Ἰδοὺకు ముందు స్పష్టమైన disjunctive లేదు. విరామచిహ్నంతో సమాంతర నిర్మాణాన్ని చూపించి మూలంలోని సంక్షిప్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదంగా రూపొందించబడింది. రెండు సమాంతర హెచ్చరికలను ఒకే షరతు నిర్మాణంలో ఉంచాం. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
