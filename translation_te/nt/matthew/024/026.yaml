  terminology: ‘అరణ్యం’ suitably renders ἐρήμῳ while preserving ‘ఎడారి’ as a lexical alternative. ‘లోపలి గదులు’ is an accurate, non-overinterpreted rendering of ταμεῖοις; the footnote responsibly notes its possible storeroom/private-room senses. The wording does not impose a theological interpretation.
