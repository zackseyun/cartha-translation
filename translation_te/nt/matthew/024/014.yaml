reference: Matthew 24:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: te
  text: రాజ్యానికి సంబంధించిన ఈ శుభవార్త లోకమంతటా, అన్ని జనాలకు సాక్ష్యంగా ప్రకటించబడుతుంది[a][b][c]. అప్పుడు అంతం వస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రాజ్య సువార్త.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నివాసమున్న లోకమంతటా.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘అన్ని దేశాలకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: ప్రకటించబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపంలోని బహిరంగ ప్రకటన భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘బోధించబడుతుంది’ కంటే గ్రీకు పదంలోని చాటింపు భావానికి దగ్గరగా ఉంది.
- source_word: εὐαγγέλιον
  choice: శుభవార్త
  rationale: ‘మంచి వార్త’ అనే మూలార్థాన్ని పారదర్శకంగా తెలియజేస్తూ, ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా ఉంటుంది.
- source_word: τῆς βασιλείας
  choice: రాజ్యానికి సంబంధించిన
  rationale: షష్ఠీ విభక్తి సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఈ వార్త రాజ్యాన్ని గురించి ఉన్నదనే భావాన్ని తెలియజేస్తుంది, అయితే ‘దేవుని’ అనే పదాన్ని మూలంలో లేనందున చేర్చదు.
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: లోకమంతటా
  rationale: నివాసమున్న ప్రపంచమంతటినీ సూచించే విస్తృత పరిధిని సహజంగా అందిస్తుంది; మొదటి శతాబ్దపు భౌగోళిక పరిధికే పరిమితం చేయదు.
- source_word: εἰς μαρτύριον
  choice: సాక్ష్యంగా
  rationale: ప్రకటన సాక్ష్యంగా పనిచేస్తుందనే ఉద్దేశం లేదా ఫలిత భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; అది అనుకూలమా ప్రతికూలమా అన్నది నిర్ణయించదు.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: అన్ని జనాలకు
  rationale: ἔθνη యొక్క ప్రజాసమూహాలు/జనాలు అనే విస్తృత భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; యూదేతరులకే పరిమితం చేయదు.
- source_word: ἥξει
  choice: వస్తుంది
  rationale: అంత్యకాల సందర్భంలో గ్రీకు ‘వస్తుంది/చేరుతుంది’ అనే భావానికి అత్యంత సహజమైన తెలుగు రూపం.
- source_word: τὸ τέλος
  choice: అంతం
  rationale: మూలంలోని సాధారణమైనప్పటికీ గంభీరమైన ‘ముగింపు’ భావాన్ని నిలుపుతుంది; ‘అంత్యకాలం’ వంటి అదనపు వ్యవస్థీకృత భావనను చేర్చదు.
theological_decisions:
- issue: οἰκουμένη మరియు ἔθνη పదాల పరిధి
  choice: ‘లోకమంతటా, అన్ని జనాలకు’ అని విశ్వవ్యాప్త పరిధిని తెలిపే భాషను వాడటం
  alternative: ‘నివాసమున్న లోకమంతటా, అన్ని దేశాలకు’ అని మరింత రూపానుగుణంగా అనువదించడం
  rationale: వాక్యం ప్రకటన యొక్క విశాల పరిధిని సూచిస్తుంది. రోమా సామ్రాజ్యానికే దాన్ని పరిమితం చేయకుండా, అలాగే నిర్దిష్ట అంత్యకాల లేదా మిషన్ సిద్ధాంతాన్ని చొప్పించకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
- issue: εἰς μαρτύριον లో సాక్ష్యం యొక్క స్వభావం
  choice: ‘సాక్ష్యంగా’ అని తటస్థంగా ఉంచటం
  alternative: ‘వారికి వ్యతిరేక సాక్ష్యంగా’ లేదా ‘వారిని రక్షించే సాక్ష్యంగా’ అని వివరించడం
  rationale: గ్రీకు వాక్యం సాక్ష్యం ఎవరికి అనుకూలమో ప్రతికూలమో స్పష్టంగా నిర్ణయించదు; అందువల్ల ఆ అనిశ్చితిని అనువాదంలో కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘సువార్త’కు బదులుగా ప్రధాన పాఠ్యంలో పారదర్శకమైన ‘శుభవార్త’ను వాడి, సంప్రదాయ పదాన్ని పాదటిప్పణిలో ఇచ్చాం. మూలంలోని కర్మణి నిర్మాణం మరియు అంత్యకాల ఉద్వేగం నిలుపబడ్డాయి.
