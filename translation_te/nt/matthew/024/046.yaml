id: MAT.24.46
reference: Matthew 24:46
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: te
  text: తన ప్రభువు వచ్చి ఇలా చేస్తూ ఉండగా కనుగొనే ఆ దాసుడు ధన్యుడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: ధన్యుడు
  rationale: దేవుని అనుగ్రహం పొందిన సంతోషకరమైన స్థితిని సూచించే సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: δοῦλος
  choice: దాసుడు
  rationale: గృహాధిపతి అధికారానికి లోబడిన వ్యక్తిని సూచించే మూలపద బలాన్ని నిలుపుతుంది; కేవలం వేతన సేవకుడు అనే భావానికి పరిమితం చేయదు.
- source_word: κύριος
  choice: ప్రభువు
  rationale: దాసునిపై అధికారం గల lord అనే సంబంధాన్ని నిలుపుతూ, κύριος పదంలోని గౌరవం మరియు సాధ్యమైన విస్తృత ధ్వనిని కాపాడుతుంది.
- source_word: οὕτως ποιοῦντα
  choice: ఇలా చేస్తూ
  rationale: ముందటి వచనాల్లో ఆజ్ఞాపించిన పనిని అదే విధంగా కొనసాగిస్తూ ఉండడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εὑρήσει
  choice: కనిపించే
  rationale: ప్రభువు వచ్చినప్పుడు దాసుడు ఆ పని చేస్తూ ఉన్నాడని కనుగొనడం అనే భావాన్ని సంక్షిప్తమైన సహజ తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: κύριος పదాన్ని గృహ యజమానిగా మాత్రమే పరిమితం చేయాలా, లేక ‘ప్రభువు’గా ఉంచాలా
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఉపమాన సందర్భంలో గృహాధిపతి భావం ఉన్నప్పటికీ, మూలంలోని κύριος పదానికి ఉన్న ‘lord’ ధ్వనిని ‘ప్రభువు’ నిలుపుతుంది; అదే సమయంలో వాక్యం ఏ ప్రత్యేక సిద్ధాంత గుర్తింపునూ బలవంతంగా విధించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని ముందుంచిన ‘ధన్యుడు’ భావాన్ని తెలుగులో సహజ వాక్యక్రమంలో చివర ఉంచి ప్రధానంగా వినిపించబడింది.
