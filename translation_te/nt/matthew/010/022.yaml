  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: te
  text: నా పేరు కారణంగా అందరూ మిమ్మల్ని ద్వేషిస్తారు.[a] అయితే చివరి వరకు సహించేవాడు[b] రక్షించబడతాడు.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నా పేరు నిమిత్తం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘చివరి వరకు పట్టుదలతో నిలిచేవాడు.’
    reason: lexical_alternative
  - marker: c
    text: సందర్భాన్ని ఎలా అర్థం చేసుకుంటామనే దానిని బట్టి, ‘రక్షించబడతాడు’ అనే మాటను ‘విడిపించబడతాడు’ లేదా ‘కాపాడబడతాడు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: d
    text: 'మూలంలోని బలమైన పునరుద్ఘాటనను మరింత ప్రత్యక్షంగా చూపితే: ‘అయితే చివరి వరకు సహించేవాడు—అతడే రక్షించబడతాడు.’'
    reason: previous_rendering
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: అందరూ మిమ్మల్ని ద్వేషిస్తారు
  rationale: గ్రీకు నిష్క్రియ నిర్మాణాన్ని తెలుగులో సహజమైన కర్తరి వాక్యంగా మార్చినా, ద్వేషించేవారు ‘అందరూ’ అనే సమగ్ర భావం మరియు శిష్యులు దానికి గురవుతారనే అర్థం యథాతథంగా ఉన్నాయి.
- source_word: διὰ τὸ ὄνομά μου
  choice: నా పేరు కారణంగా
  rationale: διά + accusative కారణాన్ని సూచిస్తుంది. ‘పేరు’ యేసు వ్యక్తిత్వం, అధికారం, ఆయనతో అనుబంధం అనే విస్తృత బైబిలు భావాన్ని సంకుచితం చేయకుండా ఉంచుతుంది.
- source_word: ὁ δὲ ὑπομείνας
  choice: అయితే ... సహించేవాడు
  rationale: ὑπομένω హింస మధ్య వెనుదిరగకుండా భరించి నిలవడాన్ని సూచిస్తుంది. ‘సహించేవాడు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, తరువాతి సిద్ధాంత పరిభాషను వాక్యంలోకి తీసుకురాదు.
- source_word: εἰς τέλος
  choice: చివరి వరకు
  rationale: నిర్దిష్ట ముగింపు బిందువు వరకు కొనసాగడాన్ని సహజంగా తెలియజేస్తుంది; ఆ ముగింపు ఏమిటో అనువాదంలో అదనంగా నిర్ణయించదు.
- source_word: οὗτος
  choice: సహించేవాడు ... రక్షించబడతాడు
  rationale: గ్రీకులోని οὗτος ముందున్న భాగస్వామ్య పదబంధాన్ని బలంగా తిరిగి సూచిస్తుంది. తెలుగులో ప్రత్యేకంగా ‘అతడే’ చేర్చకుండా వాక్యాన్ని సహజంగా ఉంచాం; మరింత రూపసామ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: σωθήσεται
  choice: రక్షించబడతాడు
  rationale: σῴζωలోని రక్షణ, విడిపింపు అనే విస్తృత భావాన్ని ‘రక్షించబడతాడు’ నిలుపుతుంది; ఇది కేవలం శారీరక విముక్తి అని గాని, ఒక నిర్దిష్ట సిద్ధాంత నమూనా అని గాని ముందే నిర్ణయించదు.
theological_decisions:
- issue: చివరి వరకు సహించడానికి మరియు రక్షణకు మధ్య సంబంధం
  choice: ‘రక్షించబడతాడు’ అనే విస్తృత పదాన్ని ఉంచడం
  alternative: శారీరకంగా విడిపించబడతాడు; అంతిమ యుగాంత రక్షణ పొందుతాడు; ఒక నిర్దిష్ట perseverance సిద్ధాంతాన్ని బోధిస్తుంది
  rationale: వాక్యం సహించడాన్ని రక్షణతో అనుసంధానిస్తుంది; అయితే రక్షణ స్వరూపం లేదా తరువాతి సిద్ధాంత వివాదాలను స్పష్టంగా పరిష్కరించదు. అందువల్ల మూలంలోని ఉద్దేశపూర్వక విస్తృతత మరియు theological tension నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. నిష్క్రియ గ్రీకు నిర్మాణాన్ని తెలుగులో సహజమైన కర్తరి రూపంగా ఇచ్చాం. ‘నామం’ కంటే సాధారణంగా అర్థమయ్యే ‘పేరు’, ‘అంతం వరకు’ కంటే సహజమైన ‘చివరి వరకు’ ఎంచుకున్నాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధాల వద్ద ఉంచబడ్డాయి.
