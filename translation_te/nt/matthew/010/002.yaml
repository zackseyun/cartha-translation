id: MAT.10.2
reference: Matthew 10:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: te
  text: 'ఆ పన్నెండు మంది అపొస్తలుల పేర్లు ఇవి: మొదటివాడు[a], పేతురు అని పిలువబడే సీమోను, మరియు అతని సహోదరుడు అంద్రెయు; జెబెదయి కుమారుడు యాకోబు, మరియు అతని సహోదరుడు యోహాను,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మొదటివాడు’ అనే మాట కేవలం జాబితాలో మొదటివాడని మాత్రమే కాకుండా, పన్నెండు మందిలో ప్రాముఖ్యత గలవాడని కూడా సూచించే అవకాశం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ పేర్ల జాబితాకు స్వల్ప సంధిని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ఆ మార్పు సహజంగానే వ్యక్తమవుతుంది; ‘ఇప్పుడు’ అని చేరిస్తే మూలంలో లేని కాలార్థం కలగవచ్చు.
- source_word: δώδεκα ἀποστόλων
  choice: పన్నెండు మంది అపొస్తలుల
  rationale: ἀπόστολος యేసు నియమించి పంపిన గుర్తింపు పొందిన సమూహాన్ని సూచిస్తుంది. ‘అపొస్తలుడు’ తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన, సులభంగా గుర్తించగల పదం; ‘మంది’ వ్యక్తులను సహజంగా లెక్కిస్తుంది.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: పేర్లు ఇవి
  rationale: గ్రీకు నిర్దేశక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: πρῶτος
  choice: మొదటివాడు
  rationale: పుంలింగ ఏకవచన విశేషణ రూపాన్ని నిలుపుతూ సీమోనును జాబితాలో మొదటివాడిగా సూచిస్తుంది. అధికారం లేదా హోదాకు సంబంధించిన బలమైన భావాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ὁ λεγόμενος Πέτρος
  choice: పేతురు అని పిలువబడే
  rationale: సీమోనుకు పేతురు అనే పేరు ఉందని తెలిపే గ్రీకు కృదంత నిర్మాణాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: అతని సహోదరుడు
  rationale: రెండు సందర్భాల్లోనూ రక్తసంబంధమైన సోదరత్వాన్ని సూచిస్తుంది; మొదటిది సీమోనును, రెండవది యాకోబును తిరిగి సూచిస్తుంది.
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: జెబెదయి కుమారుడు
  rationale: గ్రీకు సంబంధవాచక షష్ఠీ నిర్మాణంలో అంతర్లీనంగా ఉన్న పితృసంబంధాన్ని తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: సీమోను/పేతురుతో కూడిన πρῶτος పదం భావం
  choice: ప్రధాన పాఠ్యంలో ‘మొదటివాడు’ అని అనువదించి, జాబితా క్రమార్థాన్ని ముందుంచడం
  alternative: పన్నెండు మందిలో ప్రాముఖ్యత లేదా నాయకత్వాన్ని సూచించే ‘ప్రథముడు’ అనే భావం
  rationale: πρῶτος జాబితాలో మొదటి స్థానాన్ని సూచించగలదు; ప్రాముఖ్యతను కూడా సూచించే అవకాశం ఉంది. ఈ వచనం ఒక్కటే అధికార ప్రాధాన్యంపై సిద్ధాంత నిర్ణయాన్ని బలవంతం చేయదు. అందువల్ల ప్రధాన పాఠ్యం సరళమైన అర్థాన్ని ఇస్తూ, ప్రత్యామ్నాయ సూక్ష్మభావాన్ని పాదటిప్పణిలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వ్యక్తుల జాబితా స్పష్టంగా ఉండేందుకు అర్ధవిరామ చిహ్నాలు వాడబడ్డాయి; సంప్రదాయంగా గుర్తించదగిన తెలుగు బైబిల్ వ్యక్తినామ రూపాలు నిలుపబడ్డాయి.
