id: MAT.10.5
reference: Matthew 10:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: te
  text: 'యేసు ఈ పన్నెండుమందిని పంపే ముందు వారికి ఇలా ఆజ్ఞాపించాడు: “అన్యజనుల దారిలోకి వెళ్లవద్దు[a]; సమరయుల ఏ పట్టణంలోనికీ ప్రవేశించవద్దు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అన్యజనుల ప్రాంతం వైపు వెళ్లవద్దు.” గ్రీకు పదబంధం అక్షరార్థంగా దారి లేదా మార్గాన్ని సూచిస్తుంది; అన్యజనుల ప్రాంతం వైపు బయలుదేరడమే భావం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సమరయుల పట్టణంలోకి ప్రవేశించవద్దు.” గ్రీకులో ఏకవచనం ఇక్కడ సాధారణంగా సమరయుల ఏ పట్టణాన్నైనా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: ఈ పన్నెండుమందిని
  rationale: గ్రీకులో ఉన్న నిర్దేశక సర్వనామాన్నీ సంఖ్యనూ నిలుపుతుంది. సందర్భంలో వారు శిష్యులే అయినా, ‘శిష్యులు’ అనే పదం ఈ వాక్యంలో లేదు కాబట్టి చేర్చలేదు.
- source_word: ἀπέστειλεν
  choice: పంపి
  rationale: ఒక నిర్దిష్ట కార్యం కోసం పంపడాన్ని సూచిస్తుంది. తెలుగులో ‘పంపి’ సహజంగా ఉండి, మూలంలో లేని అధికారిక నియామక భావాన్ని అదనంగా చేర్చదు.
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: వారికి ఇలా ఆజ్ఞాపించాడు
  rationale: παραγγέλλωలోని నిర్దేశాత్మక బలాన్ని ‘ఆజ్ఞాపించాడు’ తెలియజేస్తుంది; λέγων ప్రత్యక్ష వాక్యాన్ని పరిచయం చేస్తుంది కాబట్టి ‘ఇలా’ సహజమైన తెలుగు అనుసంధానంగా పనిచేస్తుంది.
- source_word: Εἰς ὁδὸν ἐθνῶν
  choice: అన్యజనుల దారిలోకి
  rationale: ὁδός యొక్క దారి/మార్గం రూపకాన్ని నిలుపుతూ, εἰς యొక్క దిశాత్మక భావాన్ని ‘లోకి’ ద్వారా వ్యక్తం చేస్తుంది. ఈ అసాధారణ గ్రీకు ప్రయోగంలోని కొంత సందిగ్ధతను పాదటిప్పణి వివరిస్తుంది.
- source_word: ἐθνῶν
  choice: అన్యజనుల
  rationale: ఈ యూద మిషన్ సందర్భంలో ἔθνη యూదేతర ప్రజలను సూచిస్తుంది. ‘దేశాలు’ కంటే ‘అన్యజనులు’ సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μὴ ἀπέλθητε
  choice: వెళ్లవద్దు
  rationale: μήతో కూడిన aorist subjunctive నిషేధాన్ని తెలుగులో నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς πόλιν Σαμαριτῶν
  choice: సమరయుల పట్టణంలోకి
  rationale: మూలంలోని ‘సమరయులకు చెందిన పట్టణం’ అనే genitive నిర్మాణాన్ని సహజమైన తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది. πόλις పరిమాణాన్ని అతిశయింపకుండా ‘పట్టణం’గా అనువదించబడింది.
- source_word: μὴ εἰσέλθητε
  choice: ప్రవేశించవద్దు
  rationale: అటువంటి పట్టణంలోకి ప్రవేశించడంపై ఉన్న నిషేధాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: అన్యజనులు, సమరయుల విషయంలోని నిషేధం యొక్క పరిధి మరియు కాలపరిమితి
  choice: ఈ సందర్భంలో పన్నెండుమందికి ఇచ్చిన నిర్దిష్ట మిషన్ ఆజ్ఞగా మాత్రమే అనువదించబడింది; నిషేధ బలం యథాతథంగా ఉంచబడింది.
  alternative: అన్యజనులు లేదా సమరయులు సువార్త నుంచి శాశ్వతంగా మినహాయించబడ్డారని సూచించేలా విస్తరించడం.
  rationale: వచనం ఈ పంపింపుకు సంబంధించిన ఆజ్ఞను నమోదు చేస్తుంది. దాని చారిత్రక పరిధిని వివరించేందుకు అదనపు సిద్ధాంత వాక్యాన్ని చేర్చకుండా, మత్తయి సువార్తలోని విస్తృత ఉద్రిక్తతను అలాగే ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘అన్యజనులు,’ ‘సమరయులు’ వంటి స్థిరమైన బైబిలు పదాలు సాధారణ పాఠకులకు అర్థమయ్యే విధంగా నిలుపబడ్డాయి; మూలంలో లేని ‘శిష్యులు’ వంటి వివరణాత్మక పదాలు చేర్చబడలేదు.
