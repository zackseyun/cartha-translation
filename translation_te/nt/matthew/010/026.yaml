id: MAT.10.26
reference: Matthew 10:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: te
  text: కాబట్టి వారికి భయపడకండి. ఎందుకంటే బయలుపరచబడకుండా కప్పబడి ఉన్నది ఏదీ లేదు; తెలియబడకుండా దాచబడి ఉన్నది ఏదీ లేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὖν φοβηθῆτε αὐτούς
  choice: కాబట్టి వారికి భయపడకండి
  rationale: οὖν యొక్క తార్కిక అనుసంధానాన్ని ‘కాబట్టి’తో, αὐτούς యొక్క బహువచన సూచనను ‘వారికి’తో సహజమైన ఆధునిక తెలుగులో నిలిపాం.
- source_word: κεκαλυμμένον
  choice: కప్పబడినది
  rationale: ఈ perfect passive participle యొక్క ‘కప్పివేయబడిన/మరుగుపరచబడిన’ భావాన్ని, తరువాతి ἀποκαλυφθήσεταιతో ఉన్న పదబంధ సంబంధాన్ని నిలిపేలా అనువదించాం.
- source_word: ἀποκαλυφθήσεται
  choice: బయలుపరచబడకుండా ఉండేలా
  rationale: భవిష్యత్ కర్మణి రూపంలోని ‘బయలుపరచబడుతుంది’ అనే భావాన్ని తెలుగు ‘ఏదీ లేదు’ నిర్మాణంలో సహజంగా వ్యక్తం చేశాం.
- source_word: κρυπτὸν ... γνωσθήσεται
  choice: దాచబడినది ... తెలిసిపోకుండా ఉండేలా
  rationale: κρυπτός యొక్క దాగి ఉన్న భావాన్నీ, γνωσθήσεται యొక్క ‘తెలియబడుతుంది/తెలిసిపోతుంది’ భావాన్నీ స్పష్టంగా వేరు చేసి నిలిపాం.
theological_decisions:
- issue: బయలుపరచేది లేదా తెలిసేలా చేసేది ఎవరో వాక్యంలో స్పష్టంగా చెప్పబడలేదు
  choice: కర్మణి నిర్మాణాన్ని నిలిపాం
  alternative: దేవుడు బయలుపరుస్తాడు / దేవుడు తెలియజేస్తాడు
  rationale: గ్రీకు పాఠం కర్తను పేర్కొనదు; దేవుడే కర్త అని అనువాదంలో చేర్చడం మూలంలోని ఉద్దేశపూర్వక అనిర్దిష్టతను పరిష్కరించినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం. రెండు సమాంతర వాక్యభాగాలనూ స్పష్టంగా ఉంచి, మూలంలోని భావసామ్యాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందించాం.
