revisions:
- from: కాబట్టి వారికి భయపడకండి. ఎందుకంటే బయలుపరచబడకుండా ఉండేలా కప్పబడినది ఏదీ లేదు; తెలిసిపోకుండా ఉండేలా దాచబడినది ఏదీ లేదు.
  to: కాబట్టి వారికి భయపడకండి. ఎందుకంటే బయలుపరచబడకుండా కప్పబడి ఉన్నది ఏదీ లేదు; తెలియబడకుండా దాచబడి ఉన్నది ఏదీ లేదు.
  rationale: The revision removes the unwarranted purposive nuance while preserving the Greek’s two closely parallel clauses, passive ambiguity, and contrast between what is covered/revealed and what is hidden/made known.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:32:17Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the inferential "therefore," the plural object "them," and the paired passive/generalizing structure. However, "ఉండేలా" (“so as to remain”) introduces a purposive nuance not present in the Greek. The future passive force is better conveyed by the negative participial construction without that addition.
  naturalness: The present wording is understandable, but both clauses are unnecessarily heavy because of "ఉండేలా." Removing it gives a more idiomatic and balanced modern Telugu parallelism.
  terminology: '"కప్పబడి" appropriately represents κεκαλυμμένον, distinct from "దాచబడి" for κρυπτόν. "బయలుపరచబడ" and "తెలియబడ" preserve the respective passive expressions without specifying an agent.'
  issues:
  - severity: medium
    issue: The phrase “బయలుపరచబడకుండా ఉండేలా / తెలిసిపోకుండా ఉండేలా” adds purposive wording.
    rationale: The Greek says that no covered or hidden thing will remain unrevealed or unknown; it does not say that it was covered or hidden “so as to” remain so. The added “ఉండేలా” can imply intention or purpose.
  revised_text: కాబట్టి వారికి భయపడకండి. ఎందుకంటే బయలుపరచబడకుండా కప్పబడి ఉన్నది ఏదీ లేదు; తెలియబడకుండా దాచబడి ఉన్నది ఏదీ లేదు.
  revised_footnotes: []
  revision_rationale: The revision removes the unwarranted purposive nuance while preserving the Greek’s two closely parallel clauses, passive ambiguity, and contrast between what is covered/revealed and what is hidden/made known.
