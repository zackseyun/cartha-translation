id: MAT.10.27
reference: Matthew 10:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: te
  text: నేను మీకు చీకటిలో చెప్పేది వెలుగులో చెప్పండి; మీ చెవిలో మీరు వినేది ఇళ్ల మిద్దెలపై ప్రకటించండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: నేను మీతో ... చెప్పేది
  rationale: ὃ అనే సంబంధబోధక సర్వనామాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో ‘చెప్పేది’గా వ్యక్తం చేశాం; λέγω ὑμῖνలోని ప్రత్యక్ష బోధన భావాన్ని ‘మీతో చెప్పేది’ నిలుపుతుంది.
- source_word: ἐν τῇ σκοτίᾳ
  choice: చీకటిలో
  rationale: ‘రహస్యంగా’ అని భావాన్ని మాత్రమే చెప్పకుండా, తరువాతి ‘వెలుగులో’తో ఉన్న స్పష్టమైన రూపక విరోధాన్ని నిలిపింది.
- source_word: εἴπατε ἐν τῷ φωτί
  choice: వెలుగులో చెప్పండి
  rationale: ఆజ్ఞారూపాన్ని సహజమైన తెలుగు బహువచన గౌరవ/సమూహ ఆజ్ఞగా ఇచ్చి, వెలుగు అనే మూల రూపకాన్ని నిలిపింది.
- source_word: ὃ εἰς τὸ οὖς ἀκούετε
  choice: చెవిలో మీరు వినేది
  rationale: గ్రీకు ఏకవచన ‘చెవి’ చిత్రణను సాధ్యమైనంత దగ్గరగా ఉంచుతూ, వ్యక్తిగతంగా లేదా రహస్యంగా అందిన మాట అనే సూచనను వ్యాఖ్యానంగా ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: κηρύξατε
  choice: ప్రకటించండి
  rationale: బహిరంగంగా చాటిచెప్పే దూతసంబంధమైన బలాన్ని తెలియజేస్తుంది; ‘ప్రసంగించండి’ అనే మరింత సంకుచిత మతపరమైన భావాన్ని నివారిస్తుంది.
- source_word: ἐπὶ τῶν δωμάτων
  choice: ఇళ్ల మిద్దెల మీద
  rationale: δῶμα సూచించే పురాతన ఇళ్ల చదునైన పైకప్పులను తెలుగులో సహజంగా ‘మిద్దెలు’ అని తెలిపి, ἐπίలోని ‘మీద’ భావాన్ని నిలిపింది.
theological_decisions:
- issue: చీకటి/వెలుగు, చెవి/మిద్దెలు అనే భాషను రూపకాలుగానే ఉంచాలా, లేక రహస్యంగా/బహిరంగంగా అని విప్పి చెప్పాలా
  choice: ప్రధాన పాఠ్యంలో ‘చీకటిలో ... వెలుగులో ... చెవిలో ... మిద్దెల మీద’ అనే చిత్రణను నిలిపాం.
  alternative: ‘రహస్యంగా ... బహిరంగంగా ... మీకు గుసగుసగా చెప్పింది ... అందరికీ చాటండి’ అని భావానువాదం చేయవచ్చు.
  rationale: యేసు పలుకులోని సజీవమైన విరోధ చిత్రణను, అలాగే వ్యక్తిగతంగా అందిన సందేశాన్ని బహిరంగంగా ప్రకటించాలనే ఉద్వేగాన్ని రెండింటినీ ఇది కాపాడుతుంది; ప్రధాన పాఠ్యం వ్యాఖ్యానంతో భావాన్ని సంకుచితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన ఆజ్ఞారూపాలను ఉపయోగించాం. ‘మిద్దె’ సాధారణ పాఠకునికి అర్థమయ్యే సాంస్కృతికంగా సరిపడే పదం; రూపకాలను ప్రధాన పాఠ్యంలో ఉంచి వాటి అంతర్భావాన్ని పాదసూచికల్లో వివరించాం.
