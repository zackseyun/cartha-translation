  verdict: revise
  source_fidelity: The draft accurately preserves the prohibition, Jesus’ stated coming, peace, the strong contrast, and the concrete image of a sword. ‘భూమి మీదికి’ is possible, but ‘భూమిమీద’ more directly reflects ἐπὶ τὴν γῆν (‘upon/on the earth’) in this saying.
  naturalness: The sentence is clear and modern. Revising ‘భూమి మీదికి’ to ‘భూమిమీద’ is slightly more idiomatic here and avoids an unnecessary directional nuance. The proposed alternative wording in footnote a, ‘వచ్చి ఉన్నానని,’ is not a natural Telugu equivalent in this context.
  terminology: ‘శాంతి’ and ‘ఖడ్గం’ are appropriate standard biblical Telugu terms. Retaining ‘ఖడ్గం’ rather than replacing it with ‘విభేదం’ properly preserves μάχαιρα. The contextual footnote should describe the image without calling the direct Greek wording merely ‘literal.’
  issues:
  - severity: low
    issue: Directional wording for ἐπὶ τὴν γῆν
