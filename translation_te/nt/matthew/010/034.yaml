  - severity: medium
    issue: Footnote a offers an unnatural Telugu alternative
    rationale: ‘వచ్చి ఉన్నానని’ is not idiomatic modern standard Telugu in this construction. Telugu does not naturally preserve the English-style contrast between ‘I came’ and ‘I have come’ here; the note should instead explain the possible completed/present-result nuance of the Greek aorist.
  - severity: low
    issue: Footnote b says ‘అక్షరార్థంగా’
    rationale: μάχαιραν directly means ‘a sword’; this is not merely a literalistic alternative. The note can state this directly while retaining its restrained contextual clarification.
