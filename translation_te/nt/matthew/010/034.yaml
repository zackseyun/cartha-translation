  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: te
  text: “నేను భూమిమీద శాంతిని తీసుకురావడానికి వచ్చానని[a] అనుకోవద్దు. శాంతిని తీసుకురావడానికి కాదు, ఖడ్గాన్ని తీసుకురావడానికే వచ్చాను.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు క్రియారూపం సందర్భానుసారం ‘నేను వచ్చి ఉన్నాను’ అనే పూర్తయిన రాక యొక్క భావాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “ఖడ్గం” అని ఉంది. సందర్భంలో ఈ చిత్రం హింసను ప్రోత్సహించడం కంటే విభేదాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: అనుకోవద్దు
  rationale: μήతో కూడిన aorist subjunctive నిషేధాన్ని తెలియజేస్తుంది. ‘అనుకోవద్దు’ సహజమైన ఆధునిక తెలుగు ప్రయోగం; ఆజ్ఞాత్మక బలాన్ని నిలుపుతుంది.
- source_word: ἦλθον
  choice: వచ్చాను
  rationale: యేసు తన రాక యొక్క ఉద్దేశాన్ని చెప్పే సందర్భంలో గ్రీకు aoristను తెలుగు సంపూర్ణ భూతరూపమైన ‘వచ్చాను’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: βαλεῖν
  choice: తీసుకురావడానికి
  rationale: βάλλω అక్షరార్థంగా ‘వేయడం/విసరడం’ అయినా, శాంతి మరియు ఖడ్గం అనే కర్మలతో ఈ ఉద్దేశార్థక నిర్మాణంలో ‘తీసుకురావడం’ తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: εἰρήνην
  choice: శాంతిని
  rationale: εἰρήνηకు ప్రామాణికమైన, విస్తృతంగా అర్థమయ్యే తెలుగు సమానార్థకం.
- source_word: ἐπὶ τὴν γῆν
  choice: భూమి మీదికి
  rationale: రాకను సూచించే ‘వచ్చాను’తో కలిసి గమ్యభావాన్ని సహజ తెలుగులో తెలిపే రూపం. γῆ యొక్క విస్తృత అర్థమైన ‘భూమి’ని నిలుపుతుంది; ‘దేశం’ అని సంకుచితం చేయదు.
- source_word: ἀλλὰ
  choice: కాదు … -కే
  rationale: οὐκ … ἀλλά నిర్మాణంలోని బలమైన వ్యతిరేకతను తెలుగులో ‘కాదు’ మరియు అవధారణార్థక ‘-కే’ సహజంగా వ్యక్తం చేస్తాయి.
- source_word: μάχαιραν
  choice: ఖడ్గాన్ని
  rationale: μάχαιρα అనే స్పష్టమైన ఆయుధ-చిత్రాన్ని ‘విభేదం’గా వ్యాఖ్యానించి మార్చకుండా నిలుపుతుంది. ‘ఖడ్గం’ గంభీరమైనదైనా సాధారణ పాఠకులకు తెలిసిన బైబిలీయ తెలుగు పదం.
theological_decisions:
- issue: ‘ఖడ్గం’ అనే మాటను ప్రధాన పాఠ్యంలో ‘విభేదం’గా సడలించాలా?
  choice: స్పష్టమైన ‘ఖడ్గం’ చిత్రాన్నే ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: విభేదం
  rationale: గ్రీకు మూలంలో μάχαιραν అని స్పష్టంగా ఉంది. తరువాతి సందర్భం దాని విభజనాత్మక ప్రభావాన్ని వివరిస్తున్నప్పటికీ, ప్రధాన పాఠ్యం రూపకాన్ని ముందుగానే పరిష్కరించకూడదు; దాని theological tensionను నిలుపాలి.
- issue: ఈ వాక్యం హింసను సమర్థిస్తుందని అనిపించే అవకాశాన్ని ఎలా నిర్వహించాలి?
  choice: మూలంలోని ఖడ్గ-చిత్రాన్ని అనువదించి, సందర్భసంబంధ వివరణను పాదటిప్పణిలో ఇవ్వడం
  alternative: ప్రధాన పాఠ్యంలోనే ‘విభేదం’ అని వ్యాఖ్యానించడం
  rationale: అనువాదం మూలచిత్రాన్ని కాపాడాలి; అదే సమయంలో సందర్భం కుటుంబ విభజనను సూచిస్తుందని పాదటిప్పణి స్పష్టం చేయగలదు, హింసను సమర్థించే భావాన్ని అనవసరంగా దిగుమతి చేయకుండా.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యనిర్మాణాన్ని ఉపయోగిస్తూ గంభీరతను నిలిపాం. ‘ఖడ్గం’ కొద్దిగా సాహిత్య/బైబిలీయ పదమైనప్పటికీ మూలంలోని స్పష్టమైన రూపకానికి సరిపోతుంది. రెండు పాదటిప్పణి గుర్తులూ ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
