  text: Φίλιππος καὶ Βαρθολομαῖος, Θωμᾶς καὶ Μαθθαῖος ὁ τελώνης, Ἰάκωβος ὁ τοῦ Ἁλφαίου καὶ ⸀Θαδδαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/003.yaml
  text: Philip and Bartholomew[a], Thomas and Matthew the tax collector, James the son of Alphaeus and Thaddaeus,
translation:
  language: te
  text: ఫిలిప్పు మరియు బర్తొలొమయి[a], తోమా మరియు పన్ను వసూలు చేసే మత్తయి, అల్ఫయి కుమారుడైన యాకోబు మరియు తద్దయి,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ఇక్కడ “లెబ్బయి” అని (లేదా “తద్దయి అని పిలువబడిన లెబ్బయి” అని) ఉంది. లూకా రాసిన అపొస్తలుల జాబితాల్లో దీనికి సరిపోలే స్థానంలో “యాకోబు కుమారుడైన యూదా” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππος
  choice: ఫిలిప్పు
  rationale: కొత్త నిబంధనలో ప్రసిద్ధమైన వ్యక్తి పేరుకు సహజమైన తెలుగు లిప్యంతరీకరణ.
- source_word: Βαρθολομαῖος
  choice: బర్తొలొమయి
  rationale: గ్రీకు వ్యక్తి పేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: Θωμᾶς
  choice: తోమా
  rationale: మూల గ్రీకు పేరుకు సమీపంగా, తెలుగులో సులభంగా పలికే రూపం.
- source_word: Μαθθαῖος
  choice: మత్తయి
  rationale: తెలుగు బైబిలు వాడుకలో గుర్తించదగిన, మూలపేరుకు సమీపమైన రూపం.
- source_word: ὁ τελώνης
  choice: పన్ను వసూలు చేసే
  rationale: పన్నులు లేదా సుంకాలు వసూలు చేసే వ్యక్తిని సూచించే τελώνης భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰάκωβος
  choice: యాకోబు
  rationale: Ἰάκωβος పేరును నేరుగా ప్రతిబింబించే తెలుగు రూపం; ఆంగ్ల సంప్రదాయంలోని ‘James’ రూపాన్ని ఆధారంగా చేసుకోలేదు.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: అల్ఫయి కుమారుడు
  rationale: గ్రీకులో సంక్షిప్తంగా ఉన్న పితృసంబంధాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: Ἁλφαίου
  choice: అల్ఫయి
  rationale: జనిటివ్ రూపంలోని వ్యక్తి పేరుకు సందర్భానుగుణ తెలుగు లిప్యంతరీకరణ.
- source_word: Θαδδαῖος
  choice: తద్దయి
  rationale: SBLGNT ప్రధాన పాఠంలోని పేరును నేరుగా లిప్యంతరీకరించింది; ఇతర పాఠరూపాలను పాదసూచికలో ఉంచింది.
- source_word: καὶ
  choice: జాబితాలో విరామచిహ్నాల ద్వారా సమన్వయం
  rationale: తెలుగు జాబితాలో ప్రతి జంట మధ్య ‘మరియు’ను పునరావృతం చేయడం కంటే కామాలతో అనుసంధానం సహజంగా ఉంటుంది; మూలంలోని సమన్వయ నిర్మాణం భావపరంగా నిలిచింది.
theological_decisions:
- issue: జాబితాలో చివరి అపొస్తలుని గుర్తింపు
  choice: తద్దయి
  alternative: లెబ్బయి; యాకోబు కుమారుడు యూదా
  rationale: ఇచ్చిన SBLGNT పాఠంలో Θαδδαῖος ఉంది కాబట్టి ప్రధాన పాఠం దానినే అనుసరిస్తుంది. వేరే ప్రతులలోని పేరు, లూకా సమాంతర జాబితాలోని భిన్న నిర్దేశం పాదసూచికలో చూపబడ్డాయి; వాటిని ప్రధాన పాఠంతో బలవంతంగా సమన్వయం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన జాబితా శైలి వాడబడింది. వ్యక్తి పేర్లు ఆంగ్ల రూపాలనుంచి కాకుండా గ్రీకు మూలరూపాలకు సమీపంగా లిప్యంతరీకరించబడ్డాయి. ‘పన్ను వసూలు చేసే మత్తయి’ అనే నిర్మాణం గుర్తింపును స్పష్టంగా ఉంచుతుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
