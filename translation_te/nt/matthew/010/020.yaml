id: MAT.10.20
reference: Matthew 10:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: te
  text: ఎందుకంటే మాట్లాడుతున్నది మీరు కాదు; మీలో మాట్లాడుతున్న మీ తండ్రి ఆత్మే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ ద్వారా.” గ్రీకులో అక్షరార్థంగా “మీలో” అని ఉంది; అయితే శిష్యుల ద్వారా పలికే మాటలను కూడా అది సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ఎందుకంటే ... కాదు
  rationale: γάρ ముందున్న హామీకి వివరణను జోడిస్తుంది; ఈ తెలుగు నిర్మాణం దాని వివరణాత్మక భావాన్నీ నిరాకరణనూ సహజంగా తెలియజేస్తుంది.
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: మాట్లాడుతున్నది మీరు కాదు
  rationale: స్పష్టంగా ఉంచిన ὑμεῖς మరియు ‘ఉన్నవారు—మాట్లాడుతున్నవారు’ అనే నిర్మాణం వక్తలెవరో నొక్కిచెబుతాయి. ఈ రూపం ఆ ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀλλὰ
  choice: ; ... ఆత్మే
  rationale: ἀλλά సూచించే బలమైన వ్యత్యాసాన్ని అర్ధవిరామంతోను ‘ఆత్మే’లోని ఏకారంతోను స్పష్టంగా వ్యక్తం చేసింది.
- source_word: τὸ πνεῦμα τοῦ πατρὸς ὑμῶν
  choice: మీ తండ్రి ఆత్మ
  rationale: ఇది శిష్యుల తండ్రికి సంబంధించిన దైవిక ఆత్మను సూచిస్తుంది. మూలంలో లేని ‘పరలోకపు’ వంటి వివరణను చేర్చలేదు.
- source_word: τὸ λαλοῦν
  choice: మాట్లాడుతున్న
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న క్రియను సూచిస్తూ ‘ఆత్మ’నే మాట్లాడే వ్యక్తిగా గుర్తిస్తుంది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: ἐν యొక్క ప్రత్యక్ష అర్థాన్ని నిలిపింది. సందర్భంలో ‘మీ ద్వారా’ అనే సాధనార్థక భావం సూచితమవవచ్చు, కాని దానిని ప్రధాన పాఠ్యంలో ఖరారు చేయలేదు.
theological_decisions:
- issue: ἐν ὑμῖν అనేది అంతర్నివాసాన్ని (‘మీలో’) సూచిస్తుందా, సాధనార్థక క్రియను (‘మీ ద్వారా’) సూచిస్తుందా
  choice: మీలో
  alternative: మీ ద్వారా
  rationale: ἐν యొక్క సాధారణ, ప్రత్యక్ష అర్థం ‘లో.’ సందర్భం శిష్యుల ద్వారా పలికించబడే మాటలను సూచించగలిగినా, మూలపాఠ్యంలోని భావ ఉద్రిక్తతను పరిష్కరించకుండా ప్రధాన పాఠ్యంలో ‘మీలో’ అని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మాట్లాడుతున్నది మీరు కాదు’ అనే రూపం గ్రీకు వాక్యంలోని కర్తపై ఉద్ఘాటనను నిలుపుతుంది; ‘ఆత్మే’ బలమైన వ్యత్యాసాన్ని తెలియజేస్తుంది.
