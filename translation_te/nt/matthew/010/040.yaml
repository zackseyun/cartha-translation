id: MAT.10.40
reference: Matthew 10:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: te
  text: “మిమ్మల్ని స్వీకరించేవాడు నన్ను స్వీకరిస్తాడు[a], నన్ను స్వీకరించేవాడు నన్ను పంపినవాణ్ణి స్వీకరిస్తాడు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆదరించేవాడు/ఆదరిస్తాడు”; ఇక్కడి గ్రీకు క్రియకు, ముఖ్యంగా ఒక సందేశకుణ్ణి స్వీకరించే సందర్భంలో, స్వీకరించడం, అంగీకరించడం, లేదా ఆదరించడం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: స్వీకరించేవాడు
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతానికి ఇది సహజమైన సాధారణ ఏకవచన రూపం; ఎవరైనా అనే విస్తృత భావాన్ని సందర్భంలో అందిస్తుంది.
- source_word: δέχομαι / δέχεται
  choice: స్వీకరించు / స్వీకరిస్తాడు
  rationale: ఒకే క్రియను మూడుసార్లు పునరావృతం చేయడం ద్వారా శిష్యులు, యేసు, ఆయనను పంపినవాడు మధ్య ఏర్పడే ఉద్దేశపూర్వక సంబంధాన్ని నిలుపుతుంది. ఈ సందర్భంలో వ్యక్తిని ఆదరంగా చేర్చుకోవడం, అంగీకరించడం అనే భావాలనూ కలిగి ఉంటుంది.
- source_word: ὑμᾶς
  choice: మిమ్మల్ని
  rationale: ఇది యేసు శిష్యులను ఉద్దేశించిన ద్వితీయ పురుష బహువచన కర్మరూపాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐμέ
  choice: నన్ను
  rationale: యేసును సూచించే ప్రథమ పురుష ఏకవచన కర్మరూపానికి నేరమైన అనువాదం.
- source_word: τὸν ἀποστείλαντά με
  choice: నన్ను పంపినవాణ్ణి
  rationale: ఆర్టికల్‌తో నామవాచకంగా పనిచేసే భూత కృదంతాన్ని సహజమైన తెలుగులో వ్యక్తిగత సూచనను నిలుపుతూ అనువదిస్తుంది; మూలంలో లేని ‘తండ్రి’ అనే పదాన్ని చేర్చదు.
theological_decisions:
- issue: యేసును పంపినవాని గుర్తింపు
  choice: నన్ను పంపినవాణ్ణి
  alternative: నన్ను పంపిన తండ్రిని
  rationale: మత్తయి సందర్భం మరియు విస్తృత వేదాంతం పంపినవాడు తండ్రి అని బలంగా సూచించినా, గ్రీకు వాక్యంలో ‘నన్ను పంపినవాడు’ అని మాత్రమే ఉంది. అందువల్ల అంతర్లీన వేదాంతార్థాన్ని పాఠకుడు గ్రహించేలా ఉంచుతూ, ప్రధాన పాఠ్యంలో ‘తండ్రి’ అని అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండేలా రూపొందించబడింది. మూలంలోని δέχεται అనే క్రియ పునరావృతాన్ని ‘స్వీకరిస్తాడు’గా నిలిపి, వాక్యంలోని ప్రతినిధిత్వ సంబంధాన్ని స్పష్టంగా ఉంచింది.
