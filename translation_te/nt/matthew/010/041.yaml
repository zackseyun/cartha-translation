id: MAT.10.41
reference: Matthew 10:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: te
  text: ఒక ప్రవక్తను ప్రవక్తగా స్వీకరించేవాడు ప్రవక్త ప్రతిఫలాన్ని పొందుతాడు; అలాగే ఒక నీతిమంతుణ్ణి నీతిమంతునిగా స్వీకరించేవాడు నీతిమంతుని ప్రతిఫలాన్ని పొందుతాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: స్వీకరించేవాడు
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతం సాధారణంగా అలాంటి పని చేసే వ్యక్తిని సూచిస్తుంది. ‘స్వీకరించేవాడు’ గ్రీకు నిర్మాణాన్ని, సాధారణ వర్తమాన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: προφήτην
  choice: ఒక ప్రవక్తను
  rationale: ఇది ప్రత్యక్ష కర్మ. ‘ప్రవక్త’ గుర్తింపు పొందిన పాత్రను వివరణాత్మక విస్తరణ లేకుండా సూటిగా తెలియజేస్తుంది.
- source_word: εἰς ὄνομα προφήτου
  choice: ప్రవక్తగా గుర్తించి
  rationale: ఈ గ్రీకు నుడికారం ఆ వ్యక్తి ప్రవక్త అనే గుర్తింపు లేదా హోదా ఆధారంగా అతణ్ణి స్వీకరించడాన్ని సూచిస్తుంది. పదశః రూపం తెలుగులో అపార్థానికి దారితీయవచ్చు కాబట్టి భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా ఇచ్చి, పదశః రూపాన్ని పాదసూచికలో ఉంచాం.
- source_word: μισθὸν προφήτου
  choice: ప్రవక్త ప్రతిఫలాన్ని
  rationale: ఈ సంక్షిప్త తెలుగు సంబంధ నిర్మాణం ‘ప్రవక్తకు లభించే ప్రతిఫలం’ లేదా ‘ప్రవక్తతో సంబంధమున్న ప్రతిఫలం’ అనే గ్రీకు షష్ఠీ విభక్తి సంబంధంలోని సాధ్యమైన భావాలను అనవసరంగా పరిష్కరించకుండా ఉంచుతుంది.
- source_word: λήμψεται
  choice: పొందుతాడు
  rationale: భవిష్యత్ క్రియారూపాన్ని గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగులో సూటిగా వ్యక్తం చేస్తుంది.
- source_word: δίκαιον
  choice: ఒక నీతిమంతుణ్ణి
  rationale: విశేషణం ఇక్కడ పురుష ఏకవచన నామవాచకంగా వాడబడింది. ‘నీతిమంతుడు’ దాని నైతిక-ఆధ్యాత్మిక భావాన్నీ, మూలంలోని పురుష రూపాన్నీ నిలుపుతుంది.
- source_word: εἰς ὄνομα δικαίου
  choice: నీతిమంతునిగా గుర్తించి
  rationale: మొదటి ఉపవాక్యంతో సమాంతరతను నిలుపుతూ, ఆ వ్యక్తిని నీతిమంతుడు అనే గుర్తింపు ఆధారంగా స్వీకరించడం అనే నుడికార భావాన్ని సహజంగా అందిస్తుంది.
- source_word: μισθὸν δικαίου
  choice: నీతిమంతుని ప్రతిఫలాన్ని
  rationale: మొదటి ఉపవాక్యంలోని నిర్మాణానికి సమాంతరంగా ఉండి, షష్ఠీ విభక్తి సంబంధాన్ని అతిగా నిర్ధారించకుండా నిలుపుతుంది.
theological_decisions:
- issue: εἰς ὄνομα + షష్ఠీ విభక్తి అనే నుడికారం
  choice: ప్రధాన పాఠ్యంలో ‘ప్రవక్తగా/నీతిమంతునిగా గుర్తించి’ అని భావాన్ని స్పష్టం చేసి, పదశః ‘పేరులో/పేరున’ అనే రూపాన్ని పాదసూచికలో తెలియజేయడం
  alternative: ‘ప్రవక్త పేరున/నీతిమంతుని పేరున’ లేదా ‘అతడు ప్రవక్త/నీతిమంతుడు కాబట్టి’
  rationale: ఈ మాటలు ఒకరిని అతని గుర్తింపు లేదా హోదా ఆధారంగా స్వీకరించడాన్ని సూచిస్తాయి. తెలుగులో ‘పేరున’ అంటే తరచుగా ‘తరఫున’ అనే భావం వస్తుంది; అందువల్ల అది ఇక్కడ తప్పుదారి పట్టించవచ్చు. ఎవరిని ఏ గుర్తింపుతో స్వీకరిస్తున్నారో ప్రధాన పాఠ్యం స్పష్టం చేస్తుంది; మూలరూపం పాదసూచికలో నిలుస్తుంది.
- issue: δίκαιον / δικαίου లోని పురుష ఏకవచన రూపం
  choice: ‘నీతిమంతుడు/నీతిమంతుని’ అనే పురుష రూపాన్ని ఉంచడం
  alternative: ‘నీతిగల వ్యక్తి’
  rationale: గ్రీకు పదం నామవాచకంగా వాడబడిన పురుష ఏకవచన విశేషణం. తెలుగు పురుష రూపం మూలానికి పారదర్శకంగా ఉండి, ఈ వాక్యంలో ఒక పురుషుని ఉదాహరణగా చెప్పే నిర్మాణాన్ని నిలుపుతుంది.
- issue: μισθὸν προφήτου / μισθὸν δικαίου లో షష్ఠీ విభక్తి భావం
  choice: ‘ప్రవక్త ప్రతిఫలం/నీతిమంతుని ప్రతిఫలం’ అనే సంక్షిప్త సంబంధ నిర్మాణం
  alternative: ‘ప్రవక్తకు/నీతిమంతునికి లభించే ప్రతిఫలం’
  rationale: గ్రీకు నిర్మాణం ఆ ప్రతిఫలం ప్రవక్తకు లేదా నీతిమంతునికి ఇవ్వబడేదా, లేక వారిని స్వీకరించినందుకు తగిన ప్రతిఫలమా అన్న సంబంధాన్ని పూర్తిగా విడమరచదు. ప్రధాన పాఠ్యం ఆ భావపరమైన విస్తృతిని సాధ్యమైనంత వరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. రెండు ఉపవాక్యాల సమాంతర నిర్మాణం ఉద్దేశపూర్వకంగా నిలుపబడింది. ‘పేరున’ అనే పదశః రూపం తెలుగులో ‘తరఫున’ అనే అపార్థాన్ని కలిగించగలదని ప్రధాన పాఠ్యంలో భావానువాదం చేసి, మూలరూపాన్ని పాదసూచికల్లో ఇచ్చాం.
