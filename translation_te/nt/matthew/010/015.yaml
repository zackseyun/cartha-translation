  source_fidelity: The draft accurately represents the solemn assertion, the comparative force of ἀνεκτότερον, the geographic sense of γῇ, the future judgment setting, and the referential ‘that town.’ It appropriately avoids adding an explicit noun such as ‘punishment,’ which the Greek does not supply.
