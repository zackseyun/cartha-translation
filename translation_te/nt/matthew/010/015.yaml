    rationale: ‘సహించదగిన’ is not itself comparative, so ‘ఎక్కువ’ is a less idiomatic and less exact way to convey the Greek comparative. ‘మరింత సహించదగినదిగా’ directly expresses ‘more bearable/tolerable’ and also aligns with footnote a.
