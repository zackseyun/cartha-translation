id: MAT.10.15
reference: Matthew 10:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: te
  text: '“నేను మీతో నిశ్చయంగా చెబుతున్నాను: తీర్పు దినాన ఆ పట్టణానికి[c] కంటే సొదొమ, గొమొర్రాల దేశానికి[b] మరింత సహించదగినదిగా[a] ఉంటుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మరింత భరించదగినదిగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సొదొమ, గొమొర్రాల ప్రాంతానికి.’ గ్రీకు వాచ్యంగా ‘సొదొమ, గొమొర్రాల దేశానికి’ అని ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘నగరానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: నిశ్చయంగా
  rationale: యేసు పలికే గంభీరమైన ధృవీకరణ సూత్రాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది; ‘ఆమేన్’ అనే లిప్యంతరీకరణ కంటే సాధారణ పాఠకునికి అర్థం నేరుగా అందుతుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో ... చెబుతున్నాను
  rationale: గ్రీకు ప్రత్యక్ష సంభాషణ సూత్రానికి దగ్గరగా ఉండి, తెలుగులో సహజంగా వినిపిస్తుంది.
- source_word: ἀνεκτότερον
  choice: ఎక్కువ సహించదగినదిగా
  rationale: ‘మరింత భరించదగినది/సహించదగినది’ అనే తులనాత్మక భావాన్ని నిలుపుతుంది; ఏమి సహించబడుతుందో మూలపాఠం స్పష్టంగా చెప్పనందున ‘శిక్ష’ వంటి పదాన్ని చేర్చలేదు.
- source_word: γῇ
  choice: దేశానికి
  rationale: ఇక్కడ భూమండలాన్ని కాక సొదొమ, గొమొర్రాలతో సంబంధమున్న నేల లేదా ప్రాంతాన్ని సూచిస్తుంది. ‘దేశం’ concrete geographic sense‌ను నిలుపుతుంది.
- source_word: Σοδόμων καὶ Γομόρρων
  choice: సొదొమ, గొమొర్రాల
  rationale: తెలుగు బైబిలు వాడుకకు అనుగుణమైన స్థలనామ రూపాలు; ఇవి ‘దేశం’తో సంబంధం గల షష్ఠీ భావాన్ని ఇస్తాయి.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: తీర్పు దినాన
  rationale: దైవిక తీర్పు జరిగే భవిష్య దినాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది; పాఠం చెప్పినదానికంటే విస్తృతమైన అంత్యకాల సిద్ధాంతాన్ని చేర్చదు.
- source_word: πόλει
  choice: పట్టణానికి
  rationale: πόλις నగరం లేదా పట్టణం అనే రెండింటినీ సూచించగలదు. శిష్యులు సందర్శించే స్థానాల తక్షణ సందర్భంలో ‘పట్టణం’ సహజంగా సరిపోతుంది.
- source_word: ἐκείνῃ
  choice: ఆ
  rationale: యేసు దూతలను తిరస్కరించే ముందుగా ప్రస్తావించిన నిర్దిష్ట పట్టణాన్ని సూచించే భావాన్ని అతిశయింపకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘తీర్పు దినం’ స్వభావం
  choice: భవిష్యత్తులో జరిగే దైవిక తీర్పు దినంగా అనువదించడం, కాని దాని గురించి పాఠం చెప్పినదానికంటే ఎక్కువగా నిర్వచించకపోవడం
  alternative: సాధారణమైన తీర్పు సమయంగా అనువదించడం
  rationale: ἐν ἡμέρᾳ κρίσεως సహజంగా అంత్యకాల దైవిక తీర్పును సూచిస్తుంది. అయినా నిర్దిష్ట సిద్ధాంత వ్యవస్థను అనువాదంలోకి దిగుమతి చేయకుండా ‘తీర్పు దినాన’ అని మాత్రమే ఉంచడం మూలపాఠపు గంభీరతను, పరిమితిని కాపాడుతుంది.
- issue: ఏది ‘ఎక్కువ సహించదగినది’ అనే అపూర్ణ వ్యక్తీకరణ
  choice: ‘శిక్ష’ లేదా ‘గతి’ అనే నామవాచకాన్ని చేర్చకుండా గ్రీకు వాక్యంలోని సంక్షిప్తతను నిలుపడం
  alternative: ‘వారికి కలిగే శిక్ష మరింత సహించదగినదిగా ఉంటుంది’ అని స్పష్టీకరించడం
  rationale: సందర్భం తీర్పు తీవ్రతను సూచించినా, గ్రీకు వాక్యం శిక్షను ప్రత్యక్షంగా నామకరణం చేయదు. కాబట్టి భావాన్ని మౌనంగా విస్తరించకుండా నిజమైన భాషాత్మక ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కాని సాధారణ పాఠకునికి అర్థమయ్యే శైలి. ప్రత్యక్ష సంభాషణ సూత్రాన్ని సహజంగా ఉంచి, తీర్పు తీవ్రతను వివరించేందుకు మూలంలో లేని ‘శిక్ష’ వంటి పదాలను చేర్చలేదు. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠంలో ఉంచబడ్డాయి.
