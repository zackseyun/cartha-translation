  terminology: ‘తీర్పు దినాన,’ ‘పట్టణం,’ and the established place-name forms ‘సొదొమ, గొమొర్రాలు’ are suitable. ‘దేశానికి’ is a viable contextual rendering of γῇ; the footnote usefully supplies ‘ప్రాంతానికి’ as an alternative.
