id: MAT.10.9
reference: Matthew 10:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ κτήσησθε χρυσὸν μηδὲ ἄργυρον μηδὲ χαλκὸν εἰς τὰς ζώνας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: te
  text: మీ నడికట్లలో ఉంచుకోవడానికి బంగారంగానీ, వెండిగానీ, రాగిగానీ[a] సంపాదించుకోవద్దు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కంచుగానీ.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, నడికట్టులో లేదా నడుముకు ధరించే డబ్బు సంచిలో ఉంచుకునే ధనం.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: సంపాదించుకోవద్దు
  rationale: κτάομαι అంటే సంపాదించుకోవడం లేదా సమకూర్చుకోవడం. కేవలం ‘తీసుకెళ్లవద్దు’ అని కాక, ప్రయాణం కోసం ధనం సమకూర్చుకోవద్దనే భావాన్ని మధ్యమ రూపంతో సహా ఇది సహజంగా వ్యక్తం చేస్తుంది.
- source_word: χρυσὸν
  choice: బంగారం
  rationale: ఇది బంగారాన్ని సూచించే సాధారణ పదం; ఈ సందర్భంలో బంగారు ధనం లేదా నాణేలు ఉద్దేశం.
- source_word: ἄργυρον
  choice: వెండి
  rationale: ఇది వెండిని సూచించే సాధారణ పదం; సందర్భంలో వెండి ధనం లేదా నాణేలు ఉద్దేశం.
- source_word: χαλκὸν
  choice: రాగి నాణేలు
  rationale: χαλκός రాగి లేదా కంచును సూచించవచ్చు. బంగారం, వెండితో కూడిన ధన జాబితాలో తక్కువ విలువగల నాణేలనే ఉద్దేశించినందున ‘రాగి నాణేలు’ ఆధునిక పాఠకులకు స్పష్టంగా ఉంటుంది; ‘కంచు నాణేలు’ను పాదసూచికలో నిలిపాం.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: మీ నడికట్లలో పెట్టుకోవడానికి
  rationale: ζώνη నడికట్టు లేదా నడుము పట్టా. అప్పట్లో దానిలో లేదా దానికి అమర్చిన సంచిలో ధనం ఉంచేవారు. εἰς యొక్క దిశాత్మక భావాన్ని సహజమైన తెలుగులో ఈ పదబంధం తెలియజేస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. మూలంలోని బంగారం–వెండి–రాగి క్రమం, పునరుక్త నిషేధ భావం, ధనం సమకూర్చుకోవద్దనే అర్థం నిలిపాం.
