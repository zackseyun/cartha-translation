revisions:
- from: మీ నడికట్లలో పెట్టుకోవడానికి బంగారంగానీ, వెండిగానీ, రాగి నాణేలుగానీ[a] సంపాదించుకోవద్దు.[b]
  to: మీ నడికట్లలో ఉంచుకోవడానికి బంగారంగానీ, వెండిగానీ, రాగిగానీ[a] సంపాదించుకోవద్దు.[b]
  rationale: The revision removes the added, third-item-only word ‘నాణేలు,’ preserving the Greek’s parallel material terms and its contextual ambiguity. The cultural footnote continues to clarify that these terms refer to money carried at the waist. ‘ఉంచుకోవడానికి’ is a natural Telugu expression for the intended placement in belts or waist pouches.
