id: MAT.10.29
reference: Matthew 10:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: te
  text: 'రెండు పిచ్చుకలను ఒక అస్సారియోనుకు[b] అమ్ముతారు కదా? అయినా వాటిలో ఒక్కటి కూడా మీ తండ్రి లేకుండా[a] నేలపై పడదు.


    [a] లేదా, “మీ తండ్రికి అతీతంగా.” ఈ మాట ఆయనకు తెలియకుండా, ఆయన శ్రద్ధకు వెలుపల, లేదా ఆయన చిత్తం లేకుండా అని సూచించవచ్చు; అయితే గ్రీకు మూలపాఠం వీటిలో దేనిని ఉద్దేశిస్తుందో ప్రత్యేకంగా చెప్పదు.


    [b] అస్సారియోను చాలా తక్కువ విలువగల చిన్న రోమా రాగి నాణెం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ తండ్రికి అతీతంగా.” ఈ మాట ఆయనకు తెలియకుండా, ఆయన శ్రద్ధకు వెలుపల, లేదా ఆయన చిత్తం లేకుండా అని సూచించవచ్చు; అయితే గ్రీకు మూలపాఠం వీటిలో దేనిని ఉద్దేశిస్తుందో ప్రత్యేకంగా చెప్పదు.
    reason: alternative_reading
  - marker: b
    text: అస్సారియోను చాలా తక్కువ విలువగల చిన్న రోమా రాగి నాణెం.
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: పిచ్చుకలు
  rationale: ఈ సందర్భంలో ఈ పదం సాధారణంగా పిచ్చుకలను సూచిస్తుంది; మరింత సాధారణమైన ‘చిన్న పక్షులు’ కంటే ఇది సహజమైన, నిర్దిష్టమైన అనువాదం.
- source_word: ἀσσαρίου
  choice: ఒక అస్సారియోనుకు
  rationale: ఇది ఒక నిర్దిష్టమైన చిన్న రోమా నాణెం. ఆధునిక సమాన విలువను ఊహించి పెట్టకుండా చారిత్రక పేరును నిలిపి, దాని విలువను పాదసూచికలో వివరించాం.
- source_word: πωλεῖται
  choice: అమ్ముతారు
  rationale: గ్రీకులోని వర్తమాన కర్మణి భావాన్ని తెలుగులో సహజమైన సాధారణ వాడుకతో తెలిపే రూపం.
- source_word: ἓν ἐξ αὐτῶν
  choice: వాటిలో ఒక్కటి కూడా
  rationale: భాగార్థక గ్రీకు పదబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, సందర్భంలోని ‘ఒక్కటి కూడా కాదు’ అనే బలాన్ని నిలుపుతుంది.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: నేలపై పడదు
  rationale: మూలంలోని ‘నేలపై పడటం’ అనే స్పష్టమైన చిత్రాన్ని నిలుపుతూ, తెలుగులో సాధారణ సత్యాన్ని సహజంగా తెలిపే రూపం.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: మీ తండ్రికి అతీతంగా
  rationale: తండ్రి జ్ఞానం, శ్రద్ధ, అనుమతి లేదా చిత్తం అని ఒకే భావానికి పరిమితం చేయకుండా, ఆయనకు స్వతంత్రంగా ఈ సంఘటన జరగదనే విస్తృత భావాన్ని నిలుపుతుంది. ప్రత్యక్ష ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చాం.
- source_word: οὐχὶ ... ;
  choice: '... కదా?'
  rationale: అవుననే సమాధానాన్ని ఆశించే గ్రీకు అలంకారప్రశ్నను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: అయినా
  rationale: పిచ్చుకల అతి తక్కువ విలువకు, వాటిలో ఒక్కటి కూడా తండ్రికి అతీతంగా పడదనే వాక్యానికి మధ్యనున్న వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ‘మీ తండ్రికి అతీతంగా’ అనే మాటలో దైవ పరిపాలన ఏ విధంగా పనిచేస్తుందనే ప్రశ్న
  choice: ప్రధాన పాఠంలో తండ్రి జ్ఞానం, చిత్తం, అనుమతి లేదా శ్రద్ధలలో ఏ ఒక్కదానికీ అర్థాన్ని పరిమితం చేయకుండా విస్తృతమైన పదబంధాన్ని ఉంచాం.
  alternative: ‘మీ తండ్రికి తెలియకుండా’ లేదా ‘మీ తండ్రి చిత్తం లేకుండా’ అని అనువదించడం.
  rationale: ἄνευ τοῦ πατρὸς ὑμῶν అనే గ్రీకు పదబంధం తండ్రితో సంబంధం లేకుండా సంఘటన జరగదని చెబుతుంది; అయితే ఆ సంబంధం జ్ఞానమా, శ్రద్ధా, అనుమతా, చిత్తమా అనేది స్పష్టంగా నిర్వచించదు. అందువల్ల వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడాం. ‘కదా?’ అలంకారప్రశ్నను సహజంగా ఉంచుతుంది. చారిత్రక నాణెం పేరును లిప్యంతరీకరించి పాదసూచికలో వివరించాం; దైవ పరిపాలనకు సంబంధించిన మూలపాఠపు అస్పష్టతను ప్రధాన పాఠం మరియు పాదసూచికలో కాపాడాం.
