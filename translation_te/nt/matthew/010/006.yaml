revisions:
- from: కాని ఇశ్రాయేలు ఇంటివారిలో తప్పిపోయిన గొర్రెల దగ్గరికే వెళ్లండి.[a]
  to: కాని బదులుగా ఇశ్రాయేలు ఇంటికి చెందిన తప్పిపోయిన గొర్రెల దగ్గరకు వెళ్లండి.
  rationale: The revision retains the Greek metaphor and the biblical corporate expression “house of Israel,” while making the genitive relationship explicit in idiomatic Telugu as “ఇంటికి చెందిన.” It also renders the contrastive redirection of δὲ μᾶλλον with “కాని బదులుగా.” The unsupported footnote alternative has been removed.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:33:27Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the imperative, contrast, lost-sheep metaphor, and Israel reference. However, “ఇశ్రాయేలు ఇంటివారిలో” recasts “house of Israel” as its members and makes the sheep appear to be located among them. The Greek genitive most naturally identifies the lost sheep as belonging to the house of Israel; it does not naturally express sheep lost “from” the house.
  naturalness: “ఇశ్రాయేలు ఇంటికి చెందిన తప్పిపోయిన గొర్రెల దగ్గరకు వెళ్లండి” is clear, modern standard Telugu and retains the corporate biblical expression without the awkward locative implication of “ఇంటివారిలో.” Adding “బదులుగా” explicitly and naturally conveys δὲ μᾶλλον.
  terminology: “తప్పిపోయిన గొర్రెలు” appropriately retains the pastoral metaphor. “ఇశ్రాయేలు ఇంటికి చెందిన” preserves the sense of οἴκου Ἰσραήλ more accurately than “ఇంటివారు,” while remaining comprehensible. No footnote is warranted for a “from the house” construal, since that is not a comparably supported ambiguity in this Greek construction.
  issues:
  - severity: medium
    issue: The main text uses “ఇశ్రాయేలు ఇంటివారిలో” for οἴκου Ἰσραήλ.
    rationale: This means approximately “among the members of Israel’s household,” rather than “of/belonging to the house of Israel.” It weakens the source phrase’s corporate ‘house of Israel’ expression and introduces an unintended locative relation.
  - severity: medium
    issue: The footnote presents “ఇశ్రాయేలు ఇంటి నుండి తప్పిపోయిన” (‘lost from the house of Israel’) as a viable grammatical alternative.
    rationale: The genitive οἴκου Ἰσραήλ modifies “lost sheep” as their identifying affiliation. The Greek does not supply a preposition or syntax that makes separation from the house a translation alternative requiring a footnote.
  - severity: low
    issue: “కాని … దగ్గరికే” leaves μᾶλλον largely to an emphatic suffix.
    rationale: The suffix can work contextually, but “కాని బదులుగా” more directly represents the redirection expressed by δὲ μᾶλλον.
  revised_text: కాని బదులుగా ఇశ్రాయేలు ఇంటికి చెందిన తప్పిపోయిన గొర్రెల దగ్గరకు వెళ్లండి.
  revised_footnotes: []
  revision_rationale: The revision retains the Greek metaphor and the biblical corporate expression “house of Israel,” while making the genitive relationship explicit in idiomatic Telugu as “ఇంటికి చెందిన.” It also renders the contrastive redirection of δὲ μᾶλλον with “కాని బదులుగా.” The unsupported footnote alternative has been removed.
