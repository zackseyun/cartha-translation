id: MAT.10.6
reference: Matthew 10:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πορεύεσθε δὲ μᾶλλον πρὸς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/006.yaml
  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: te
  text: కాని బదులుగా ఇశ్రాయేలు ఇంటికి చెందిన తప్పిపోయిన గొర్రెల దగ్గరకు వెళ్లండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορεύεσθε
  choice: వెళ్లండి
  rationale: రెండవ పురుష బహువచన ఆజ్ఞను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవార్థక బహువచనంతో వ్యక్తపరుస్తుంది.
- source_word: δὲ μᾶλλον
  choice: కాని … దగ్గరికే
  rationale: మునుపటి నిషేధాలకు విరుద్ధంగా గమ్యాన్ని మళ్లించే భావాన్ని ‘కాని’ మరియు ఏవార్థక ‘కే’ సహజంగా తెలియజేస్తాయి.
- source_word: πρὸς
  choice: దగ్గరికి
  rationale: వ్యక్తులవైపు వెళ్లడాన్ని తెలుగులో సహజంగా సూచిస్తుంది; కేవలం భౌగోళిక గమ్యస్థాన భావానికి పరిమితం కాదు.
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: తప్పిపోయిన గొర్రెలు
  rationale: గ్రీకులోని కాపరి సంబంధిత రూపకాన్ని అలాగే నిలుపుతూ, ἀπόλλυμι యొక్క సందర్భోచిత ‘తప్పిపోయిన’ భావాన్ని అందిస్తుంది.
- source_word: οἴκου Ἰσραήλ
  choice: ఇశ్రాయేలు ఇంటివారు
  rationale: ‘ఇల్లు/గృహం’ అనే సామూహిక, ఒడంబడిక సంబంధిత భావాన్ని తెలుగులో అర్థమయ్యే వ్యక్తిసమూహ రూపంలో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలును గొర్రెల రూపకంలో వర్ణించడం
  choice: ‘తప్పిపోయిన గొర్రెలు’ అనే రూపకాన్ని నిలుపుకోవడం
  alternative: ‘దారి తప్పిన ఇశ్రాయేలీయులు’ అని వివరణాత్మకంగా అనువదించడం
  rationale: గ్రీకు మూలంలో రూపకం స్పష్టంగా ఉంది; అది పాత నిబంధనలోని కాపరి-గొర్రెల ప్రతీకలతో ఉన్న సాహిత్య, ధార్మిక సంబంధాన్ని కాపాడుతుంది.
- issue: οἴκου Ἰσραήλ పదబంధంలో సంబంధం
  choice: ప్రధాన పాఠంలో ‘ఇశ్రాయేలు ఇంటివారిలో తప్పిపోయిన గొర్రెలు’
  alternative: ‘ఇశ్రాయేలు ఇంటి నుండి తప్పిపోయిన గొర్రెలు’
  rationale: గ్రీకు షష్ఠీ విభక్తి ‘ఇశ్రాయేలు ఇంటికి చెందిన తప్పిపోయిన గొర్రెలు’ అనే సాధారణ సంబంధాన్నీ, ‘ఇంటి నుండి తప్పిపోయినవి’ అనే సాధ్యమైన భావ ఛాయనూ అనుమతిస్తుంది. ప్రధాన పాఠం సహజమైన సంబంధార్థాన్ని ఇస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి అసలులోని సాధ్యమైన అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. వాక్యంలోని బైబిలీయ గొర్రెల రూపకం నిలుపబడింది; ‘ఇంటివారు’ అనే రూపం ‘ఇశ్రాయేలు గృహం’ కంటే సహజంగా వినిపిస్తూ సామూహిక భావాన్ని కాపాడుతుంది.
