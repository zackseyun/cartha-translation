id: MAT.10.1
reference: Matthew 10:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: te
  text: ఆయన తన పన్నెండు మంది శిష్యులను తన దగ్గరకు పిలిచి, అపవిత్ర ఆత్మలపై వారికి అధికారం ఇచ్చాడు—వాటిని వెళ్లగొట్టడానికీ ప్రతి వ్యాధినీ ప్రతి అస్వస్థతనూ స్వస్థపరచడానికీ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: తన దగ్గరికి పిలిచి
  rationale: మధ్యమవాచక క్రియారూపంలోని ‘తనవద్దకు పిలుచుకోవడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; పూర్వకాలిక కృదంతాన్ని తెలుగు సంయుక్త క్రియ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: తన పన్నెండు మంది శిష్యులను
  rationale: μαθητής కు సువార్తల సందర్భంలో స్థిరమైన ‘శిష్యుడు’ పదాన్ని, αὐτοῦ కు సహజమైన స్వామ్యసూచక ‘తన’ను ఉపయోగించింది.
- source_word: ἔδωκεν
  choice: ఇచ్చాడు
  rationale: δίδωμι యొక్క సరళమైన అర్థాన్ని అదనపు వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- source_word: ἐξουσίαν
  choice: అధికారం
  rationale: కేవలం శక్తి కాకుండా, కార్యం చేయడానికి ఇవ్వబడిన హక్కు లేదా అధికారాన్ని ἐξουσία సూచిస్తుంది.
- source_word: πνευμάτων ἀκαθάρτων
  choice: అపవిత్రాత్మలను … వాటిపై
  rationale: తెలుగులో ‘వాటిపై అధికారం’ అనే నిర్మాణం సహజంగా ఉండేందుకు కర్మను ముందుంచింది; ‘అపవిత్రాత్మలు’ సువార్తల సందర్భానికి స్పష్టమైన పదబంధం.
- source_word: ὥστε ἐκβάλλειν αὐτὰ
  choice: వాటిని వెళ్లగొట్టడానికి
  rationale: ὥστε తో కూడిన క్రియార్థక రూపం ఉద్దేశం లేదా ఫలితం మధ్య స్వల్ప అనిశ్చితిని కలిగి ఉంటుంది; తెలుగు ‘-డానికి’ సందర్భంలో రెండింటికీ అనుకూలంగా ఉండి, ἐκβάλλω యొక్క బలమైన వెలుపలికి పంపే భావాన్ని తెలియజేస్తుంది.
- source_word: θεραπεύειν
  choice: స్వస్థపరచడానికి
  rationale: రోగులను బాగుచేయడం అనే θεραπεύω భావాన్ని గౌరవప్రదమైన, సుపరిచితమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: ప్రతి వ్యాధినీ ప్రతి అనారోగ్యాన్నీ
  rationale: νόσος మరియు μαλακία అనే రెండు సమీపార్థక పదాలను ఒకటిగా కలపకుండా, వాటి పునరుక్తి మరియు సమగ్రతను నిలుపుతుంది.
theological_decisions:
- issue: శిష్యులకు ఇవ్వబడినది అధికారం లేదా శక్తి అనే ప్రశ్న
  choice: అధికారం
  alternative: శక్తి
  rationale: ἐξουσία ఇక్కడ యేసు ఇచ్చిన కార్యాధికారాన్ని ప్రధానంగా సూచిస్తుంది. ‘అధికారం’ మూలపాఠానికి దగ్గరగా ఉండి, కేవలం అంతర్గత శక్తి అనే అర్థానికి పరిమితం చేయదు.
- issue: ὥστε యొక్క ఉద్దేశం/ఫలితం సంబంధం
  choice: ‘-డానికి’ అనే సహజమైన ప్రయోజనార్థక నిర్మాణం
  alternative: ‘దాని ఫలితంగా’
  rationale: గ్రీకు నిర్మాణం ఉద్దేశం మరియు ఫలితం రెండింటి ఛాయను అనుమతిస్తుంది. ‘-డానికి’ అధికారానికి సంబంధించిన కార్యసామర్థ్యాన్ని సహజంగా తెలుపుతూ, స్పష్టంగా ఫలితార్థానికే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ‘వాటిపై వారికి అధికారం ఇచ్చాడు’ అనే సహజ తెలుగు నిర్మాణాన్ని ఉపయోగించింది. రెండు రోగసూచక పదాల మధ్య ఉన్న స్వల్ప భేదాన్ని ప్రధాన పాఠంలోనూ పాదటిప్పణిలోనూ నిలిపింది.
