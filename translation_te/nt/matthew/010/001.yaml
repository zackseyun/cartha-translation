revisions:
- from: ఆయన తన పన్నెండు మంది శిష్యులను తన దగ్గరికి పిలిచి, అపవిత్రాత్మలను వెళ్లగొట్టడానికి, ప్రతి వ్యాధినీ ప్రతి అనారోగ్యాన్నీ స్వస్థపరచడానికి వాటిపై వారికి అధికారం ఇచ్చాడు.[a]
  to: ఆయన తన పన్నెండు మంది శిష్యులను తన దగ్గరకు పిలిచి, అపవిత్ర ఆత్మలపై వారికి అధికారం ఇచ్చాడు—వాటిని వెళ్లగొట్టడానికీ ప్రతి వ్యాధినీ ప్రతి అస్వస్థతనూ స్వస్థపరచడానికీ.
  rationale: The revision restores the source order and scope by linking “authority” directly to “unclean spirits,” while retaining the ὥστε-infinitive nuance with the natural Telugu purpose-capability construction “-డానికీ.” It also preserves the twofold disease expression with a clearer lexical distinction and updates the footnote to match the revised text.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:32:05Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the calling of the twelve, the delegated authority (ἐξουσία), the unclean spirits, expulsion, and the paired healing expression. However, placing “వాటిపై వారికి అధికారం” after “అపవిత్రాత్మలను వెళ్లగొట్టడానికి” produces an awkward delayed antecedent and can obscure the Greek construction, in which the authority is explicitly over the unclean spirits and is given for both stated activities.
  naturalness: “అపవిత్రాత్మలను ... వాటిపై వారికి అధికారం” is structurally cumbersome in modern Telugu. Fronting “అపవిత్ర ఆత్మలపై” and then using “వాటిని” for the following action is clear and idiomatic. “అస్వస్థత” provides a more natural distinct counterpart to “వ్యాధి” than the broad “అనారోగ్యం.”
  terminology: “శిష్యులు,” “అధికారం,” “అపవిత్ర ఆత్మలు,” and “స్వస్థపరచు” are appropriate in a respectful modern Bible register. The footnote correctly preserves the two related Greek disease terms and gives a viable alternative for μαλακία.
  issues:
  - severity: medium
    issue: Delayed and potentially unclear authority construction
    rationale: The draft says, in effect, “to cast out unclean spirits ... he gave them authority over them.” Greek places the authority directly with πνευμάτων ἀκαθάρτων before both infinitives. Reordering makes the relation explicit without adding interpretation.
  - severity: low
    issue: The paired illness term may be more clearly distinguished
    rationale: “అనారోగ్యం” is understandable but broad and overlaps heavily with “వ్యాధి.” “అస్వస్థత” better preserves the related-but-distinct δεύτερος term μαλακία, while the note retains “బలహీనత” as an alternative.
  revised_text: ఆయన తన పన్నెండు మంది శిష్యులను తన దగ్గరకు పిలిచి, అపవిత్ర ఆత్మలపై వారికి అధికారం ఇచ్చాడు—వాటిని వెళ్లగొట్టడానికీ ప్రతి వ్యాధినీ ప్రతి అస్వస్థతనూ స్వస్థపరచడానికీ.
  revised_footnotes:
  - marker: a
    text: ‘ప్రతి వ్యాధి, ప్రతి అస్వస్థత’ అనే జంట గ్రీకులో νόσος, μαλακία అనే రెండు సమీపార్థక పదాలను ప్రతిబింబిస్తుంది; రెండవదాన్ని ‘బలహీనత’ లేదా ‘అనారోగ్యం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  revision_rationale: The revision restores the source order and scope by linking “authority” directly to “unclean spirits,” while retaining the ὥστε-infinitive nuance with the natural Telugu purpose-capability construction “-డానికీ.” It also preserves the twofold disease expression with a clearer lexical distinction and updates the footnote to match the revised text.
