id: MAT.10.10
reference: Matthew 10:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: te
  text: ప్రయాణానికి సంచి గానీ, రెండు అంగీలు గానీ, చెప్పులు గానీ, చేతికర్ర గానీ తీసుకువెళ్లకండి; ఎందుకంటే పనివాడు తన ఆహారాన్ని పొందడానికి అర్హుడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మార్కు 6:8లో చేతికర్ర తీసుకువెళ్లడానికి అనుమతి ఉన్నందున, ఇక్కడ అదనపు చేతికర్రను తీసుకువెళ్లవద్దనే భావమని కొందరు అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: సంచి
  rationale: ప్రయాణంలో ఆహారం లేదా అవసరమైన వస్తువులు మోసుకెళ్లే సంచిని సూచిస్తుంది. వెంటనే వచ్చే ‘ప్రయాణానికి’ అనే పదబంధం దాని సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: εἰς ὁδὸν
  choice: ప్రయాణానికి
  rationale: ప్రయాణంలో వెంట తీసుకెళ్లే వస్తువుల సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δύο χιτῶνας
  choice: రెండు అంగీలు
  rationale: χιτών ప్రాచీన కాలపు శరీరానికి దగ్గరగా ధరించే వస్త్రం. ‘అంగీలు’ చారిత్రక భావాన్ని నిలుపుతూ సాధారణ తెలుగు పాఠకులకు అర్థమవుతుంది.
- source_word: ὑποδήματα
  choice: చెప్పులు
  rationale: ఆ కాలంలో పాదాలకు కట్టుకునే పాదరక్షలను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘చెప్పులు’ సహజంగా ఉంది.
- source_word: ῥάβδον
  choice: చేతికర్ర
  rationale: ఇక్కడ ప్రయాణంలో ఉపయోగించే కర్ర భావం సహజం. మత్తయి వాక్యంలోని నిషేధాన్ని మార్కు 6:8తో సమన్వయపరచకుండా యథాతథంగా ఉంచుతుంది.
- source_word: ἄξιος
  choice: అర్హుడు
  rationale: యోగ్యత లేదా పొందవలసిన హక్కు అనే మూలభావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: ὁ ἐργάτης
  choice: పనివాడు
  rationale: పని చేసే వ్యక్తి అనే సాధారణ భావాన్ని, సంఘపరమైన సాంకేతిక అర్థం చేర్చకుండా, సహజ తెలుగులో అందిస్తుంది.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: తన ఆహారానికి
  rationale: τροφή యొక్క ప్రత్యక్షమైన ‘ఆహారం/పోషణ’ భావాన్ని నిలుపుతుంది; విస్తృతమైన ‘పోషణ ఖర్చు’ లేదా ‘ఆదరణ’ వంటి వ్యాఖ్యాత్మక పదాలను నివారిస్తుంది.
theological_decisions:
- issue: ప్రయాణ సామగ్రి విషయంలో సమాంతర సువార్తలతో కనిపించే భేదం
  choice: మత్తయిలోని ‘చేతికర్ర గానీ తీసుకువెళ్లకండి’ అనే నిషేధాన్ని ప్రధాన పాఠ్యంలో నిలుపుట
  alternative: మార్కు 6:8ను దృష్టిలో ఉంచుకొని ‘అదనపు చేతికర్ర’ అని అర్థం చేసుకోవడం
  rationale: గ్రీకు పాఠ్యం ῥάβδονను నిషేధిత వస్తువుల జాబితాలో స్పష్టంగా ఉంచుతుంది. అందువల్ల సమాంతర వచనంతో బలవంతంగా సమన్వయపరచకుండా పాఠ్యంలోని ఉద్రిక్తతను నిలుపుతూ ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో తెలియజేయడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. జాబితాలో ‘గానీ’ పునరావృతం ద్వారా గ్రీకు μηδέ వరుస నిషేధాల బలం సహజంగా ప్రతిఫలించింది.
