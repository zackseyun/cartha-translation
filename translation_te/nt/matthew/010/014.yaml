id: MAT.10.14
reference: Matthew 10:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: te
  text: మిమ్మల్ని స్వీకరించక, మీ మాటలు వినని వారు ఎవరైనా ఉంటే[a], మీరు ఆ ఇంటి నుంచైనా ఆ పట్టణం నుంచైనా బయటికి వెళ్లేటప్పుడు[c], మీ పాదాల దుమ్మును దులిపివేయండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిమ్మల్ని స్వీకరించక, మీ మాటలు ఆలకించని వారు ఎవరైనా ఉంటే.”
    reason: lexical_alternative
  - marker: b
    text: “పాదాల దుమ్మును దులిపివేయడం” అనేది సందేశాన్ని తిరస్కరించినవారితో సంబంధాన్ని తెంచుకోవడాన్నీ, వారిమీద తీర్పునూ సూచించే సంకేతాత్మక చర్య.
    reason: cultural_note
  - marker: c
    text: లేదా, “ఆ ఇంటి నుంచైనా ఆ నగరం నుంచైనా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: ఎవరైనా ... ఉంటే
  rationale: ఈ అనిర్దిష్ట సంబంధవాచక నిర్మాణంలోని సాధారణమైన షరతు భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δέξηται ὑμᾶς
  choice: మిమ్మల్ని స్వీకరించక
  rationale: సందేశకులను అతిథులుగా చేర్చుకోవడం, వారి సేవను అంగీకరించడం అనే రెండు భావాలకూ అవకాశం ఉంచుతుంది.
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: మీ మాటలు వినని
  rationale: ἀκούω యొక్క వినడం/శ్రద్ధగా ఆలకించడం అనే పరిధిని నిలుపుతూ, విధేయత అనే అదనపు భావాన్ని బలవంతంగా చేర్చదు.
- source_word: ἐξερχόμενοι ἔξω
  choice: బయటికి వెళ్లేటప్పుడు
  rationale: బయటకు వెళ్లే సమయాన చేయవలసిన ప్రధాన ఆజ్ఞతో ఈ కృదంతాన్ని సహజంగా అనుసంధానిస్తుంది.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: ఆ ఇంటి నుంచైనా ఆ పట్టణం నుంచైనా
  rationale: నిర్దిష్టమైన ఇల్లు లేదా నివాసప్రాంతాన్ని సూచించే ἐκείνης భావాన్ని నిలుపుతుంది; πόλις పరిమాణాన్ని అతిశయింపకుండా ‘పట్టణం’గా ఇచ్చింది.
- source_word: ἐκτινάξατε
  choice: దులిపివేయండి
  rationale: అంటుకున్న దుమ్మును బలంగా తొలగించే సంకేతాత్మక చర్యను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: మీ పాదాల దుమ్మును
  rationale: దుమ్ము మరియు పాదాలు అనే మూలపాఠంలోని స్పష్టమైన దృశ్యాన్ని యథాతథంగా నిలుపుతుంది.
theological_decisions:
- issue: సందేశాన్ని తిరస్కరించినవారిపట్ల సంకేతాత్మక తీర్పు చర్య
  choice: ‘మీ పాదాల దుమ్మును దులిపివేయండి’ అనే స్పష్టమైన ఆజ్ఞను ప్రధాన పాఠంలో ఉంచడం
  alternative: సమాంతర వచనాలనుంచి ‘వారికి సాక్ష్యంగా’ అని చేర్చడం లేదా ‘వారిని తీర్పుకు వదిలేయండి’ అని భావానువాదం చేయడం
  rationale: ఈ వచనం చర్యను ఆజ్ఞాపిస్తుంది గాని దాని అర్థాన్ని ప్రత్యక్షంగా వివరించదు. అందువల్ల సమాంతర వచనాల మాటలను దిగుమతి చేయకుండా, వివరణను పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడింది. ‘స్వీకరించు,’ ‘పట్టణం,’ ‘దులిపివేయండి’ వంటి పదాలు మూలపాఠానికి దగ్గరగా ఉంటూనే సహజంగా వినిపిస్తాయి; సంకేతాత్మక చర్యకు సంబంధించిన వివరణను ప్రధాన పాఠంలో కలపలేదు.
