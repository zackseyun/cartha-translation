lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: మీరు … ప్రవేశించేటప్పుడు
  rationale: వర్తమాన కాల కృదంతం బహువచన కర్తలను సూచిస్తూ ప్రధాన ఆజ్ఞతో సమకాలికమైన చర్యను తెలియజేస్తుంది. ఆధునిక తెలుగులో కాలార్థక ఉపవాక్యం సహజంగా ఉంటుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప అనుసంధాన అవ్యయం. తెలుగులో వాక్యప్రవాహం ద్వారా దాని అనుసంధాన భావం సహజంగా వ్యక్తమవుతుంది; ‘కాని’ అని అనువదిస్తే లేని వ్యతిరేకత ఏర్పడుతుంది.
- source_word: οἰκίαν
  choice: ఆ ఇంట్లోకి
  rationale: οἰκία భౌతిక ఇల్లు లేదా ఇంటివారిని సూచించగలదు. ‘ప్రవేశించడం’ అనే సందర్భంలో ‘ఇల్లు’ అనే స్థలార్థమే ప్రధానంగా ఉంటుంది; నిర్దిష్ట ఉపపద భావాన్ని ‘ఆ’ తెలియజేస్తుంది.
- source_word: ἀσπάσασθε
  choice: పలకరించండి
  rationale: ఇది ద్వితీయ పురుష బహువచన ఆజ్ఞ. ‘పలకరించండి’ ఆధునిక తెలుగులో సూటిగా, సహజంగా అభివాదం చేయడాన్ని వ్యక్తం చేస్తుంది.
- source_word: αὐτήν
  choice: దాన్ని
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం οἰκίανను తిరిగి సూచిస్తుంది. తెలుగులో లింగభేదం లేకపోయినా ఏకవచన వస్తు సర్వనామమైన ‘దాన్ని’ మూలంలోని ఇంటినే పలకరించమనే రూపక ప్రయోగాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఇంటినే పలకరించడం అనే రూపక ప్రయోగమా, లేక ఇంటివారిని స్పష్టంగా పలకరించడమా
  choice: ప్రధాన పాఠ్యంలో ‘దాన్ని పలకరించండి’ అని ఇంటిని సూచించే సర్వనామాన్ని నిలిపాం
  alternative: ‘ఆ ఇంటివారిని పలకరించండి’
  rationale: గ్రీకు పాఠ్యంలో αὐτήν అనే ఏకవచన సర్వనామం οἰκίανను నేరుగా సూచిస్తుంది. ఉద్దేశం అక్కడ నివసించేవారే అయి ఉండవచ్చు; అయినా ఆ అర్థాన్ని ప్రధాన పాఠ్యంలో స్పష్టీకరించడం మూలంలోని రూపక విస్తృతిని ముందుగానే పరిష్కరిస్తుంది. అందువల్ల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాన్ని వాడాం. ‘దాన్ని పలకరించండి’ సాధారణ తెలుగులో కొంత అసాధారణంగా వినిపించినా, మూలంలోని ఉద్దేశపూర్వక రూపక ప్రయోగాన్ని నిలుపుతుంది; పాదటిప్పణి సహజమైన సామాజిక అర్థాన్ని వివరిస్తుంది.
