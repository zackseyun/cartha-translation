review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the family relationships, the future sense, and the hostile action of children against parents. However, “చంపిస్తారు” is causative (''will have [someone] kill'') and introduces an agency distinction not expressed by θανατώσουσιν, which is active: ''will put them to death/kill them.'''
  naturalness: The wording is generally clear modern standard Telugu. “తల్లిదండ్రులపై ఎదిరించి లేచి” is more idiomatic and direct than “తల్లిదండ్రులకు విరోధంగా లేచి.”
  terminology: “సోదరుడు,” “బిడ్డ,” “పిల్లలు,” and “తల్లిదండ్రులు” suitably reflect the respective Greek terms. “మరణానికి అప్పగిస్తాడు” appropriately conveys παραδώσει εἰς θάνατον without forcing the narrower sense 'betray.' The lexical footnote is retained but its alternative is made idiomatic.
  issues:
  - severity: medium
    issue: “చంపిస్తారు” is causative.
    rationale: θανατώσουσιν is an active verb meaning 'will put to death' or 'will kill.' Telugu చంపిస్తారు normally means causing another person to kill, an unmarked distinction absent from the Greek.
  - severity: low
    issue: The footnote alternative “మరణానికి పట్టిస్తాడు” is awkward Telugu.
    rationale: “చేతికి అప్పగిస్తాడు” gives a natural alternative expression for handing someone over while retaining the source verb's concrete force.
  revised_text: సోదరుడు తన సోదరుణ్ణి మరణానికి అప్పగిస్తాడు[a]; తండ్రి తన బిడ్డను అప్పగిస్తాడు. పిల్లలు తమ తల్లిదండ్రులపై ఎదిరించి లేచి, వారిని మరణానికి గురిచేస్తారు.
