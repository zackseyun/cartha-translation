revisions:
- from: సోదరుడు సోదరుణ్ణి మరణానికి అప్పగిస్తాడు[a]; తండ్రి తన బిడ్డను అప్పగిస్తాడు. పిల్లలు తల్లిదండ్రులకు విరోధంగా లేచి, వారిని చంపిస్తారు.
  to: సోదరుడు తన సోదరుణ్ణి మరణానికి అప్పగిస్తాడు[a]; తండ్రి తన బిడ్డను అప్పగిస్తాడు. పిల్లలు తమ తల్లిదండ్రులపై ఎదిరించి లేచి, వారిని మరణానికి గురిచేస్తారు.
