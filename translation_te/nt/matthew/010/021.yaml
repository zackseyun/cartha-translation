id: MAT.10.21
reference: Matthew 10:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: te
  text: సోదరుడు తన సోదరుణ్ణి మరణానికి అప్పగిస్తాడు[a]; తండ్రి తన బిడ్డను అప్పగిస్తాడు. పిల్లలు తమ తల్లిదండ్రులపై ఎదిరించి లేచి, వారిని మరణానికి గురిచేస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చేతికి అప్పగిస్తాడు’; ఈ క్రియ ద్రోహపూర్వక సందర్భాల్లో ‘ద్రోహం చేసి అప్పగిస్తాడు’ అనే భావాన్ని కూడా ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: అప్పగిస్తాడు
  rationale: శత్రువుల లేదా అధికారుల చేతికి ఒకరిని అప్పగించడం అనే మూలభావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘ద్రోహం చేస్తాడు’ అని సందర్భార్థాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: సోదరుడు సోదరుణ్ణి
  rationale: మూలంలోని పుంలింగ, ఏకవచన కుటుంబ సంబంధాన్ని యథాతథంగా కాపాడుతుంది.
- source_word: εἰς θάνατον
  choice: మరణానికి
  rationale: అప్పగించడం మరణానికి దారితీసే గమ్యం లేదా ఫలితాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: πατὴρ τέκνον
  choice: తండ్రి తన బిడ్డను
  rationale: τέκνον లింగనిరపేక్షంగా ‘బిడ్డ’ అని అర్థం; తెలుగులో సంబంధాన్ని సహజంగా స్పష్టం చేయడానికి ‘తన’ చేర్చబడింది.
- source_word: ἐπαναστήσονται
  choice: విరోధంగా లేచి
  rationale: ఎదిరించి లేవడం అనే గ్రీకు క్రియ యొక్క సజీవమైన, శత్రుత్వపూరిత భావాన్ని నిలుపుతుంది.
- source_word: τέκνα
  choice: పిల్లలు
  rationale: ఇది కుమారులు, కుమార్తెలు ఇద్దరినీ కలుపుకొనే సహజమైన తెలుగు పదం.
- source_word: ἐπὶ γονεῖς
  choice: తల్లిదండ్రులకు విరోధంగా
  rationale: శత్రుత్వాన్ని సూచించే సందర్భంలో ἐπί యొక్క ‘against’ భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: θανατώσουσιν
  choice: చంపిస్తారు
  rationale: తామే నేరుగా చంపడం మాత్రమే కాక, అధికారుల ద్వారా మరణశిక్షకు గురిచేయడం లేదా మరణానికి కారణమవడం అనే causative భావాన్ని నిలుపుతుంది.
- source_word: αὐτούς
  choice: వారిని
  rationale: సమీప పూర్వపదమైన ‘తల్లిదండ్రులు’నే సూచిస్తూ గ్రీకు వాక్యప్రవాహాన్ని కాపాడుతుంది.
theological_decisions:
- issue: కుటుంబ సంబంధ పదాల్లో లింగం మరియు ప్రతినిధి ఏకవచనం
  choice: ἀδελφόςను ‘సోదరుడు’గా, τέκνα/γονεῖςను విస్తృతార్థకమైన ‘పిల్లలు/తల్లిదండ్రులు’గా అనువదించడం
  alternative: ἀδελφόςను సాధారణ లింగార్థంలో ‘తోబుట్టువు’గా అనువదించడం
  rationale: ἀδελφός ఇక్కడ పుంలింగ ‘సోదరుడు’; τέκνα, γονεῖς మాత్రం లింగపరంగా విస్తృతమైన కుటుంబ పదాలు. ఈ తేడాను అనువాదం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ రూపుదిద్దబడింది. సమాంతర కుటుంబ సంబంధ నిర్మాణం కోసం రెండో ఉపవాక్యంలో ‘అప్పగిస్తాడు’ పునరుక్తి చేయబడింది.
