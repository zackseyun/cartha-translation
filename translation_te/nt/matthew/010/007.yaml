id: MAT.10.7
reference: Matthew 10:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: te
  text: మీరు వెళ్తూ[a], “పరలోక రాజ్యం[b] దగ్గరపడింది[c]” అని ప్రకటించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెళ్తున్నప్పుడు.” గ్రీకు కృదంతం ఈ కార్యం ప్రకటించాలనే ఆజ్ఞతో పాటు జరుగుతుందని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మత్తయి సాధారణంగా “పరలోక రాజ్యం” అంటాడు; ఇతర సువార్తలు అనేక సమాంతర సందర్భాల్లో “దేవుని రాజ్యం” అంటాయి.
    reason: cross_reference
  - marker: c
    text: లేదా, “సమీపించింది” లేదా “దగ్గరగా ఉంది.” గ్రీకు పరిపూర్ణకాల క్రియ సమీపించడం జరిగి, ఆ స్థితి కొనసాగుతోందనే భావాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευόμενοι
  choice: మీరు వెళ్తూ
  rationale: వర్తమానకాల కృదంతం ప్రధాన ఆజ్ఞతో పాటు జరిగే కార్యాన్ని సూచిస్తుంది. ‘మీరు వెళ్తూ’ అనేది ఆ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది ముందున్న ఆదేశాలతో స్వల్ప అనుసంధానాన్ని చూపుతుంది. తెలుగులో వాక్యప్రవాహమే ఆ అనుసంధానాన్ని స్పష్టం చేస్తున్నందున ‘మరియు’ వంటి పదాన్ని చేర్చడం కృత్రిమంగా ఉంటుంది.
- source_word: κηρύσσετε
  choice: ప్రకటించండి
  rationale: బహిరంగంగా, అధికారపూర్వకంగా తెలియజేయాలనే ఆజ్ఞను వ్యక్తం చేస్తుంది. ‘ప్రకటించండి’ సంఘపరమైన ప్రత్యేక అర్థానికి పరిమితం కాకుండా మూలపద భావాన్ని అందిస్తుంది.
- source_word: λέγοντες
  choice: అని
  rationale: ప్రకటనలో చెప్పవలసిన విషయాన్ని పరిచయం చేసే కృదంతం. తెలుగులో ప్రత్యక్ష వాక్యం తరువాత ‘అని ప్రకటించండి’ అనడం సహజంగా ఉండి గ్రీకు నిర్మాణంలోని భావాన్ని పూర్తిగా తెలియజేస్తుంది.
- source_word: Ἤγγικεν
  choice: దగ్గరపడింది
  rationale: గ్రీకు పరిపూర్ణ కాలం సమీపించడం జరిగి, దాని ఫలితం కొనసాగుతోందనే భావాన్ని కలిగిస్తుంది. ‘దగ్గరపడింది’ ఆ సంభవించిన సమీపతను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ βασιλεία
  choice: రాజ్యం
  rationale: రాజ్యపాలన, రాజాధికారం, రాజ్య పరిధి అనే భావ విస్తృతిని తెరిచి ఉంచే స్థిరమైన తెలుగు సమానార్థకం.
- source_word: τῶν οὐρανῶν
  choice: పరలోక
  rationale: మత్తయి ప్రత్యేకంగా ఉపయోగించే ఈ పదబంధాన్ని ‘దేవుని’ అని సమన్వయపరచకుండా నిలుపుతుంది. ఆధునిక తెలుగు బైబిలు భాషలో ‘పరలోక రాజ్యం’ సహజంగా, సులభంగా అర్థమవుతుంది.
theological_decisions:
- issue: ἡ βασιλεία τῶν οὐρανῶν అనే పదబంధం
  choice: పరలోక రాజ్యం
  alternative: దేవుని రాజ్యం; పరలోక పరిపాలన
  rationale: మత్తయి వాడిన ప్రత్యేక పదబంధాన్ని ఇతర సువార్తల సమాంతర వచనాలతో కలిపివేయకుండా కాపాడుతుంది. ‘రాజ్యం’ అనేది పాలన, రాజాధికారం, పరిధి అనే భావాలను ముందుగానే ఒకదానికే పరిమితం చేయదు.
- issue: ἤγγικεν క్రియలోని పరిపూర్ణకాల భావం
  choice: దగ్గరపడింది
  alternative: దగ్గరగా ఉంది; సమీపించింది
  rationale: సమీపించడం సంభవించి దాని ప్రభావం కొనసాగుతోందనే భావాన్ని నిలుపుతుంది; రాజ్యం పూర్తిగా వచ్చేసిందా లేక కేవలం భవిష్యత్తులోనే ఉందా అనే విస్తృతమైన ధార్మిక ప్రశ్నను అనువాదం స్వయంగా తీర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ఆజ్ఞ మరియు రాజ్య ప్రకటనకు తగిన గంభీరతతో రూపొందించబడింది. ‘అని ప్రకటించండి’ ద్వారా κηρύσσετε λέγοντες భావం అనవసర పునరుక్తి లేకుండా నిలుపబడింది.
