- from: ఈ చిన్నవారిలో ఒకరికి, అతడు శిష్యుడు అనే కారణంగా, కేవలం ఒక గిన్నె చల్లని నీళ్లు తాగడానికి ఇచ్చేవాడు ఎవడైనా—నేను మీతో నిజంగా చెబుతున్నాను—అతడు తన ప్రతిఫలాన్ని ఎంతమాత్రమూ కోల్పోడు.[a]
