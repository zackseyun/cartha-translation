id: MAT.10.42
reference: Matthew 10:42
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: te
  text: ఈ చిన్నవారిలో ఒకరికి, అతడు శిష్యుడు కాబట్టి, కేవలం ఒక గిన్నె చల్లని నీళ్లయినా తాగడానికి ఇస్తే—నేను మీతో నిజంగా చెబుతున్నాను—అతడు తన ప్రతిఫలాన్ని ఎంతమాత్రమూ కోల్పోడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘ఈ చిన్నవారు’ అనేది తప్పనిసరిగా పిల్లలను మాత్రమే సూచించదు; సందర్భంలో అల్పులుగా ఎంచబడే యేసు శిష్యులను సూచించే అవకాశం ఉంది. ‘అతడు శిష్యుడు కాబట్టి’ అనే మాటకు మరింత రూపానుసార అనువాదం: ‘శిష్యుని పేరున.’'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς ἂν
  choice: ఎవడైనా
  rationale: సాపేక్ష సర్వనామంతో ἄν కలిసినప్పుడు వచ్చే అనిర్దిష్టమైన, అందరికీ వర్తించే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ποτίσῃ
  choice: తాగడానికి ఇచ్చేవాడు
  rationale: క్రియ యొక్క మూలార్థం ‘త్రాగనివ్వడం/త్రాగడానికి ఇవ్వడం’; సందర్భంలో నీటిని అందించే చర్యను స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: ఈ చిన్నవారిలో ఒకరికి
  rationale: ‘చిన్నవారు’ అనే రూపం పిల్లలకు మాత్రమే పరిమితం చేయకుండా, హీనస్థితిలో లేదా అల్పులుగా ఎంచబడే యేసు అనుచరులనూ సూచించగల మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: ποτήριον ψυχροῦ
  choice: ఒక గిన్నె చల్లని నీళ్లు
  rationale: ψυχροῦతో భావింపబడిన ‘నీరు’ను తెలుగులో సహజంగా వ్యక్తం చేస్తూ, సాధారణమైన చిన్న సేవను చూపిస్తుంది.
- source_word: μόνον
  choice: కేవలం
  rationale: ఇచ్చే కానుక అతి స్వల్పమైనదైనా సరే అనే భావాన్ని మూలంలోని ‘మాత్రమే’ అనే బలంతో నిలుపుతుంది.
- source_word: εἰς ὄνομα μαθητοῦ
  choice: అతడు శిష్యుడు అనే కారణంగా
  rationale: గ్రహీత శిష్యుడనే గుర్తింపు కారణంగా ఆ సేవ చేయబడుతుందనే సందర్భార్థాన్ని తెలుగులో పారదర్శకంగా తెలియజేస్తుంది; గ్రీకు పదబంధంలోని గుర్తింపు-ఆధారిత భావాన్ని కాపాడుతుంది.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: యేసు పలికే గంభీరమైన, అధికారపూర్వక ధృవీకరణ సూత్రాన్ని ఆధునిక గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὐ μὴ ἀπολέσῃ
  choice: ఎంతమాత్రమూ కోల్పోడు
  rationale: οὐ μή అనే బలమైన నిరాకరణను సహజమైన తెలుగులో నిశ్చయంగా వ్యక్తం చేస్తుంది.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: తన ప్రతిఫలాన్ని
  rationale: μισθόςకు ఈ శిష్యత్వ సందర్భంలో ‘ప్రతిఫలం’ సరైన విస్తృత అర్థాన్ని ఇస్తుంది; కేవలం జీతం అనే భావానికి పరిమితం చేయదు.
theological_decisions:
- issue: ‘ఈ చిన్నవారు’ ఎవరిని సూచిస్తారు?
  choice: పిల్లలకు మాత్రమే పరిమితం చేయకుండా ‘ఈ చిన్నవారు’ అని విస్తృతంగా ఉంచడం
  alternative: అక్షరార్థంగా పిల్లలు మాత్రమే; లేదా కొత్త/బలహీన విశ్వాసులు మాత్రమే
  rationale: తక్షణ సందర్భం శిష్యులను స్వీకరించడం గురించి మాట్లాడుతుంది. అందువల్ల అల్పులుగా ఎంచబడే శిష్యులను సూచించే అవకాశం ఉంది; అయినా అనువాదం మూలంలోని విస్తృతతను సంకుచితం చేయదు.
- issue: εἰς ὄνομα μαθητοῦ యొక్క భావం
  choice: ‘అతడు శిష్యుడు అనే కారణంగా’ అని కారణార్థకంగా అనువదించడం
  alternative: ‘శిష్యుని పేరున’ అనే మరింత రూపానుసార అనువాదం
  rationale: ఈ పదబంధం సేవ పొందేవాని శిష్యత్వ గుర్తింపే ఆ చర్యకు ఆధారమని సూచిస్తుంది. తెలుగులో ‘పేరున’ అనేది ప్రతినిధిత్వం లేదా సూత్రోచ్చారణ భావాన్ని అనవసరంగా కలిగించవచ్చు.
- issue: ప్రతిఫల హామీ యొక్క బలం
  choice: ‘ఎంతమాత్రమూ కోల్పోడు’
  alternative: ‘బహుశా కోల్పోడు’ లేదా సాధారణ ‘కోల్పోడు’
  rationale: οὐ μή నిర్మాణంలోని బలమైన, నిశ్చితమైన నిరాకరణను తగ్గించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘నీళ్లు’ సహజ వాడుకను, ‘ప్రతిఫలం’ గ్రంథోచిత గంభీరతను కలిపాయి. మూలంలోని బలమైన హామీ మరియు ‘చిన్నవారు’ అనే పదంలోని ఉద్దేశపూర్వక విస్తృతత నిలుపబడ్డాయి.
