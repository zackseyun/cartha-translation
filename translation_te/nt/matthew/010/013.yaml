  verdict: revise
  source_fidelity: The conditional contrast and the imagery of the disciples’ peace coming upon the house or returning to them are retained. Replacing “సమాధానం” with “శాంతి” more directly represents εἰρήνη and avoids the common modern meaning “answer/response.” “తగినది” conveys ἀξία in this context without implying sinlessness.
  naturalness: The revised wording is natural modern standard Telugu. “దానిమీదికి” retains the directional image of ἐπ’ αὐτήν, while “కానీ” explicitly reflects the δέ contrast.
  terminology: “శాంతి” is the clear modern Telugu equivalent of εἰρήνη here. “తగినది” is idiomatic for a house/household fit to receive the messengers, and the note preserves the intended contextual clarification without making it the main-text rendering.
  issues:
  - severity: medium
    issue: “సమాధానం” is ambiguous in modern Telugu.
    rationale: Although it has traditional biblical use for peace, its dominant ordinary meaning is “answer” or “reply.” In this verse, where peace is said to come and return, “శాంతి” is clearer and more direct for εἰρήνη.
  - severity: low
    issue: The main text does not explicitly express the Greek δέ contrast.
    rationale: Adding “కానీ” makes the paired conditional structure clearer and better reflects μὲν ... δέ.
