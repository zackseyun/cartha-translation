id: MAT.10.13
reference: Matthew 10:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: te
  text: ఆ ఇల్లు తగినదైతే[a], మీ శాంతి దానిమీదికి రావాలి; కానీ అది తగినది కాకపోతే[b], మీ శాంతి మీ దగ్గరికి తిరిగి రావాలి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఇల్లు” అనే గ్రీకు పదం నివాసాన్ని, సందర్భానుసారం ఆ ఇంటివారిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “తగినది” అంటే నైతికంగా పాపరహితమైనది అని కాదు; సందేశకులను, వారు తెచ్చే శాంతిని స్వీకరించడానికి తగినది అనే భావం.
    reason: cultural_note
  - marker: c
    text: లేదా, “మీ శాంతి మీవైపు తిరగాలి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: ఇల్లు
  rationale: గ్రీకు పదానికి నేరమైన, సహజమైన తెలుగు సమానార్థకం. సందర్భంలో అది ఆ ఇంటివారిని కూడా సూచించగలదు; అందుకే ప్రత్యామ్నాయాన్ని పాదటీకలో తెలిపాం.
- source_word: ἀξία
  choice: అర్హమైనది
  rationale: అంగీకరించడానికి తగినది అనే మూల్యాంకన భావాన్ని నిలుపుతుంది; కేవలం నైతిక నిర్దోషిత్వమని గాని, స్పందనశీలత మాత్రమేనని గాని పరిమితం చేయదు.
- source_word: ἐλθάτω
  choice: రావాలి
  rationale: మూడవ పురుష ఆజ్ఞార్థక భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰρήνη
  choice: సమాధానం
  rationale: శాంతి, క్షేమం, ఆశీర్వాదం అనే విస్తృత సెమిటిక్ భావపరిధిని మోసే సంప్రదాయబద్ధమైన తెలుగు బైబిల్ పదం.
- source_word: ἐπ’ αὐτήν
  choice: దానిమీదికి
  rationale: సమాధానం ఇంటిమీదికి రావడం అనే దిశాత్మక రూపకాన్ని నిలుపుతుంది.
- source_word: πρὸς ὑμᾶς
  choice: మీ దగ్గరికి
  rationale: πρός యొక్క దిశాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; తిరిగి అనే క్రియతో కలిసి మూలంలోని భావం స్పష్టమవుతుంది.
- source_word: ἐπιστραφήτω
  choice: తిరిగి రావాలి
  rationale: ఆ సమాధానం అక్కడ నిలవకుండా శిష్యుల దగ్గరికి తిరిగి వస్తుందనే భావాన్ని సహజంగా తెలుపుతుంది; కర్తరి/కర్మణి వివరణను అనవసరంగా నిర్ణయించదు.
- source_word: μὲν ... δὲ
  choice: అయితే ... కాకపోతే
  rationale: రెండు షరతుల మధ్యనున్న వ్యత్యాసాన్ని భారంగా కాకుండా సహజమైన తెలుగు నిర్మాణంలో చూపిస్తుంది.
theological_decisions:
- issue: “మీ సమాధానం” స్వభావం
  choice: శిష్యులతో ముడిపడిన సమాధాన ఆశీర్వాదం ఇంటిమీదికి వచ్చి, తగని పక్షంలో వారి దగ్గరికి తిరిగి వస్తుందనే సజీవ రూపకాన్ని యథాతథంగా ఉంచాం.
  alternative: “మీ సమాధాన వందనం” లేదా “మీరు పలికే సమాధాన ఆశీర్వాదం” అని వివరణాత్మకంగా అనువదించడం.
  rationale: మూలపాఠం దీనిని కేవలం మర్యాదపూర్వక వందనంగా తగ్గించదు; అదే సమయంలో అది ఎలా బదిలీ అవుతుందో సిద్ధాంతపరంగా వివరించదు. అందువల్ల అసలు వచనంలోని ఉద్దేశపూర్వక ఉద్వేగం, రూపకం నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. “సమాధానం” అనే పదం సాధారణ సంభాషణలో ‘జవాబు’ అనే అర్థం కూడా కలిగినప్పటికీ, బైబిల్ సందర్భంలో ‘శాంతి/క్షేమం’ అనే స్థిరమైన ఆధ్యాత్మిక భావాన్ని ఇస్తుంది. పాదటీక సూచికలు సంబంధిత పదబంధాల వెంట క్రమంగా ఉంచబడ్డాయి.
