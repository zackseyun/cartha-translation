  to: ఆ ఇల్లు తగినదైతే[a], మీ శాంతి దానిమీదికి రావాలి; కానీ అది తగినది కాకపోతే[b], మీ శాంతి మీ దగ్గరికి తిరిగి రావాలి[c].
  rationale: The revision removes a significant modern lexical ambiguity by rendering εἰρήνη as “శాంతి.” It also makes the Greek conditional contrast explicit with “కానీ.” The translation continues to preserve the concrete, undeveloped imagery of “your peace,” without reducing it to merely a greeting or supplying a theological mechanism.
