  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: te
  text: కాబట్టి భయపడకండి; మీరు అనేక పిచ్చుకలకంటే ఎంతో విలువైనవారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν φοβεῖσθε
  choice: కాబట్టి భయపడకండి
  rationale: οὖν ముందున్న దేవుని శ్రద్ధ గురించిన వాదన నుండి వచ్చే నిర్ధారణను సూచిస్తుంది; μὴ తో కూడిన వర్తమాన ఆజ్ఞారూపం సహజమైన తెలుగులో నిషేధాజ్ఞగా ‘భయపడకండి’ అని వ్యక్తమవుతుంది.
- source_word: πολλῶν στρουθίων
  choice: అనేక పిచ్చుకలకంటే
  rationale: సమీప సందర్భంలో στρουθίον చిన్న పక్షిని, ప్రత్యేకంగా పిచ్చుకను సూచిస్తుంది; διαφέρετε తో ఈ షష్ఠీ విభక్తి తులనార్థాన్ని ఇస్తుంది.
- source_word: διαφέρετε
  choice: ఎంతో విలువైనవారు
  rationale: ఇక్కడ διαφέρω కేవలం ‘భిన్నంగా ఉండడం’ కాక, విలువ లేదా ప్రాముఖ్యతలో మించడాన్ని సూచిస్తుంది. ‘కంటే ఎంతో విలువైనవారు’ అనే రూపం ఆ తులనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὑμεῖς
  choice: మీరు
  rationale: స్పష్టంగా ఉన్న సర్వనామం పిచ్చుకలతో పోల్చినప్పుడు శిష్యులపై ఉద్ఘాటన పెడుతుంది; తెలుగులో ‘మీరు’ దానిని తగినంతగా నిలుపుతుంది.
theological_decisions:
- issue: యేసు బోధలో మనుషులకూ పిచ్చుకలకూ మధ్య తులనాత్మక విలువ
  choice: మీరు అనేక పిచ్చుకలకంటే ఎంతో విలువైనవారు
  alternative: మీరు అనేక పిచ్చుకలకంటే గొప్పవారు
  rationale: ఈ అనువాదం దేవుడు పక్షులను పట్టించుకోడని సూచించకుండా, శిష్యులపట్ల ఆయనకు ఉన్న మరింత శ్రద్ధను మరియు διαφέρετε లోని తులనాత్మక విలువను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన బహువచన సంబోధన వాడబడింది. వాక్యంలోని కారణ-నిర్ధారణ సంబంధం ‘కాబట్టి’తో స్పష్టంగా నిలుపబడింది.
