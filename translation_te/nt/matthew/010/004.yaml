id: MAT.10.4
reference: Matthew 10:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: te
  text: కనానీయుడైన సీమోను[a], మరియు ఇస్కరియోతు యూదా కూడా—ఆయనను అప్పగించినవాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉత్సాహవాది సీమోను.” ఇక్కడి గ్రీకు పదం “కనానీయుడు”; ఇది అరామిక్/హీబ్రూ మూలమైన బిరుదును ప్రతిబింబిస్తూ, సంప్రదాయంగా “ఉత్సాహవాది” అని అర్థం చేసుకోబడింది.
    reason: lexical_alternative
  - marker: b
    text: యూదా సందర్భంలో “ఆయనకు ద్రోహం చేసినవాడు” అని కూడా అనువదించవచ్చు. గ్రీకు క్రియకు సాధారణంగా “అప్పగించు” అనే అర్థం ఉంది; ఇక్కడ అది ద్రోహపూర్వకంగా అప్పగించడాన్ని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: కనానీయుడు
  rationale: గ్రీకు రూపాన్ని అర్థవ్యాఖ్యగా మార్చకుండా ధ్వన్యనువాదానికి సమీపంగా నిలుపుతుంది. ఇది సాధారణ గ్రీకు పదమైన ζηλωτής కాదు; అరామిక్/హీబ్రూ మూలమైన బిరుదును ప్రతిబింబించే అవకాశం ఉంది. సంప్రదాయ అర్థమైన ‘ఉత్సాహవాది’ని పాదసూచికలో ఉంచాం.
- source_word: Ἰσκαριώτης
  choice: ఇస్కరియోతు
  rationale: వ్యక్తి బిరుదుకు తెలుగులో స్థిరపడిన ధ్వన్యనువాద రూపాన్ని ఉపయోగించాం.
- source_word: παραδοὺς
  choice: అప్పగించినవాడు
  rationale: παραδίδωμι అనే క్రియ యొక్క విస్తృతమైన ‘అప్పగించు’ భావాన్ని ప్రధాన పాఠ్యంలో నిలిపి, గ్రీకు పదంలో స్వతహాగా ఉన్న కొంత తటస్థతను కాపాడాం. యూదా సందర్భంలో ద్రోహార్థం స్పష్టమైనందున ఆ సహజ వ్యాఖ్యానాన్ని పాదసూచికలో తెలిపాం.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: ఇతడే ఆయనను అప్పగించినవాడు
  rationale: ఆర్టికల్‌తో కూడిన కృదంతం యూదాను అతని కార్యం ద్వారా గుర్తిస్తుంది. καί యొక్క గుర్తింపును బలపరిచే భావాన్ని సహజ తెలుగులో ‘ఇతడే’ ద్వారా వ్యక్తం చేశాం.
theological_decisions:
- issue: παραδοὺς ను తటస్థమైన ‘అప్పగించినవాడు’గా అనువదించాలా, సందర్భానుగుణమైన ‘ద్రోహం చేసినవాడు’గా అనువదించాలా
  choice: అప్పగించినవాడు
  alternative: ద్రోహం చేసినవాడు
  rationale: మూల గ్రీకు క్రియ విస్తృతంగా ‘అప్పగించు’ అని అర్థమివ్వగలదు; అందువల్ల ప్రధాన పాఠ్యంలో ఆ పదబంధాన్ని కాపాడటం మూలభాషలోని విస్తృతిని నిలుపుతుంది. మత్తయి కథనంలో యూదా చర్య ద్రోహమేనన్న సందర్భార్థాన్ని పాదసూచిక స్పష్టంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వాక్య నిర్మాణం వాడాం. పేర్లకు పరిచితమైన తెలుగు రూపాలను ఎంచుకుని, మూలంలోని బిరుదు మరియు క్రియకు సంబంధించిన అర్థవిస్తృతిని పాదసూచికలతో పారదర్శకంగా ఉంచాం.
