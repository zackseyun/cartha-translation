- from: కనానీయుడైన సీమోను[a], ఇస్కరియోతు యూదా—ఇతడే ఆయనను అప్పగించినవాడు[b].
  to: కనానీయుడైన సీమోను[a], మరియు ఇస్కరియోతు యూదా కూడా—ఆయనను అప్పగించినవాడు[b].
  rationale: 'The revision retains the draft’s defensible transliterations and its neutral main-text rendering of παραδούς, while restoring both Greek conjunctions: “మరియు” coordinates Judas with Simon, and “కూడా” represents the καί in the attributive participial description. It removes the source-unwarranted emphatic “ఇతడే.” Footnote anchors remain attached to the relevant designation and verb phrase.'
