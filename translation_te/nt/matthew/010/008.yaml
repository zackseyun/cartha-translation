id: MAT.10.8
reference: Matthew 10:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: te
  text: రోగులను స్వస్థపరచండి; చనిపోయినవారిని లేపండి[a]; కుష్ఠరోగులను[b] శుద్ధపరచండి; దయ్యాలను వెళ్లగొట్టండి. ఉచితంగా పొందారు; ఉచితంగానే ఇవ్వండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని గ్రీకు ప్రతుల్లో “చనిపోయినవారిని లేపండి” అనే మాటలు లేవు.
    reason: textual_variant
  - marker: b
    text: ఇక్కడి గ్రీకు పదం ఆధునిక కుష్ఠువ్యాధిని మాత్రమే కాక, బైబిల్ కాలంలో తీవ్రమైన ఇతర చర్మవ్యాధులను కూడా సూచించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας θεραπεύετε
  choice: రోగులను స్వస్థపరచండి
  rationale: ఈ సందర్భంలో ἀσθενέω అనారోగ్యంతో ఉన్నవారిని సూచిస్తుంది; θεραπεύω వారికి స్వస్థత కలిగించడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం సహజంగా ఉండి ఆజ్ఞ యొక్క ప్రత్యక్షతను నిలుపుతుంది.
- source_word: νεκροὺς ἐγείρετε
  choice: చనిపోయినవారిని లేపండి
  rationale: ἐγείρω ఇక్కడ నిద్రలేపడం కాదు, మరణం నుండి లేపడాన్ని సూచిస్తుంది. ‘లేపండి’ మూలపదంలోని రూపకాన్ని, అద్భుత కార్యపు భావాన్ని నిలుపుతుంది.
- source_word: λεπροὺς καθαρίζετε
  choice: కుష్ఠరోగులను శుద్ధపరచండి
  rationale: λεπρός బైబిల్ వాడుకలో ఆధునిక హాన్సెన్ వ్యాధికన్నా విస్తృతమైన తీవ్రమైన చర్మవ్యాధులను సూచించవచ్చు; పరిచితమైన ‘కుష్ఠరోగులు’ అనే పదానికి వివరణాత్మక పాదసూచిక జోడించబడింది. καθαρίζωలో శారీరక స్వస్థతతో పాటు శుద్ధతకు సంబంధించిన భావం ఉన్నందున ‘శుద్ధపరచండి’ ఎంచుకున్నాం.
- source_word: δαιμόνια ἐκβάλλετε
  choice: దయ్యాలను వెళ్లగొట్టండి
  rationale: ἐκβάλλω బలవంతంగా బయటకు పంపడాన్ని సూచిస్తుంది. ‘వెళ్లగొట్టండి’ ఆధునిక తెలుగులో సహజంగా ఉండి భూతోచ్చాటన సందర్భంలోని బలాన్ని తెలియజేస్తుంది.
- source_word: δωρεὰν ἐλάβετε, δωρεὰν δότε
  choice: ఉచితంగా పొందారు; ఉచితంగానే ఇవ్వండి
  rationale: δωρεάν ఇక్కడ ప్రతిఫలం లేదా చెల్లింపు లేకుండా అనే భావాన్ని ఇస్తుంది. రెండు భాగాల్లోనూ ‘ఉచితంగా’ పునరావృతం చేయడం గ్రీకు వాక్యంలోని సమాంతరతను, నొక్కిచెప్పడాన్ని నిలుపుతుంది.
theological_decisions:
- issue: అద్భుత కార్యాలకు సంబంధించిన ఆజ్ఞల పరిధి
  choice: ఈ మిషన్ సందర్భంలో పన్నెండుమందికి ఇచ్చిన ప్రత్యక్ష ఆజ్ఞలుగా యథాతథంగా అనువదించడం
  alternative: వాటిని రూపకాలుగా మార్చడం లేదా తరువాతి సంఘ ఆచారాలకు మాత్రమే పరిమితం చేయడం
  rationale: గ్రీకు పాఠంలో ఇవి స్పష్టమైన బహువచన ఆజ్ఞార్థక క్రియలు. వాటి చారిత్రక, దైవశాస్త్రీయ బలాన్ని తగ్గించకుండా, నేటి అన్వయాన్ని అనువాదంలోనే నిర్ణయించకుండా ఉంచాం.
- issue: καθαρίζετεలో స్వస్థత మరియు శుద్ధత భావాలు
  choice: ‘శుద్ధపరచండి’ అని అనువదించి రెండు భావాలకు చోటివ్వడం
  alternative: ‘స్వస్థపరచండి’ అని కేవలం వైద్య స్వస్థత భావంతో అనువదించడం
  rationale: చర్మవ్యాధిగలవారి విషయంలో καθαρίζω శారీరక స్థితితో పాటు ఆచారపరమైన శుద్ధతను కూడా సూచించగలదు. మూలంలోని ఈ భావసాంద్రతను పరిష్కరించకుండా నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. చిన్న చిన్న సమాంతర ఆజ్ఞలను అర్ధవిరామాలతో వేరు చేసి గ్రీకు జాబితా యొక్క లయను నిలిపాం; చివరి రెండు భాగాల్లో పునరుక్తిని సహజమైన తెలుగులో కాపాడాం.
