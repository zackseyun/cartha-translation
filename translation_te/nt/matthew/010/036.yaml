  yaml_path: translation/nt/matthew/010/036.yaml
  text: And a man's enemies will be those of his own household[a].
translation:
  language: te
  text: ఒక మనిషికి అతని ఇంటివారే శత్రువులవుతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒక వ్యక్తికి తన ఇంటివారే శత్రువులవుతారు.” గ్రీకులోని పుంలింగ ఏకవచనమైన “మనిషి” అనే పదం ఇక్కడ అందరినీ ప్రతినిధిగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: (ప్రత్యేక పదంగా అనువదించలేదు)
  rationale: ఇది ముందున్న వాక్యంతో ఈ ఉపవాక్యాన్ని కలిపే సాధారణ సంధాయకం. ఈ ఒక్క వచనాన్ని సహజమైన తెలుగులో అందించేటప్పుడు వాక్యప్రవాహంలో దాని అనుసంధాన భావం అంతర్లీనంగా ఉంటుంది; ‘మరియు’ అని పెట్టడం కృతకంగా ఉంటుంది.
- source_word: ἐχθροὶ
  choice: శత్రువులు
  rationale: శత్రుత్వంతో ఉండేవారిని సూచించే బహువచన నామవాచక ప్రయోగానికి ఇది సహజమైన, బలాన్ని నిలుపుకునే తెలుగు సమానం.
- source_word: τοῦ ἀνθρώπου
  choice: ఒక మనిషికి
  rationale: గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని తెలుగు స్వాధీన/సంబంధ నిర్మాణంలో సహజంగా చతుర్థీ రూపంతో వ్యక్తం చేశాం. ‘మనిషి’ మూలంలోని ప్రతినిధి ఏకవచన రూపాన్ని నిలుపుతుంది.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: అతని ఇంటివారే
  rationale: οἰκιακοί భవనాన్ని కాక, ఆ ఇంటికి చెందిన వ్యక్తులను సూచిస్తుంది. ‘ఇంటివారు’ కుటుంబం మరియు గృహసభ్యులు రెండింటినీ సహజంగా కలుపుతుంది; ‘-ఏ’ మూల వాక్యంలోని విధేయ గుర్తింపు బలాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀνθρώπου లోని ప్రతినిధి పుంలింగ ఏకవచనం
  choice: ఒక మనిషికి
  alternative: ఒక వ్యక్తికి
  rationale: గ్రీకు పదం ఇక్కడ సాధారణంగా మానవ వ్యక్తిని సూచించగలిగినా, రూపంలో పుంలింగ ఏకవచనంగా ఉన్న సామెతాత్మక వాక్యం. ప్రధాన పాఠం ఆ రూపాన్ని నిలుపుతుంది; అది పురుషులకు మాత్రమే పరిమితమని భావించకూడదని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన సామెతాత్మక నిర్మాణం. ‘ఇంటివారు’ అనే పదం కేవలం భౌతిక ఇంటిని కాక గృహసభ్యులను సూచిస్తుంది.
