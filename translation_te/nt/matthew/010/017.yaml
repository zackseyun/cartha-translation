id: MAT.10.17
reference: Matthew 10:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: te
  text: అయితే మనుషుల[a] పట్ల జాగ్రత్తగా ఉండండి. ఎందుకంటే వారు మిమ్మల్ని న్యాయసభలకు అప్పగిస్తారు; వారి సమాజమందిరాల్లో మిమ్మల్ని కొరడాలతో కొడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పురుషుల’; గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనమైనప్పటికీ, ఇక్కడ సాధారణంగా మనుషులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέχετε
  choice: అప్రమత్తంగా ఉండండి
  rationale: ఈ బహువచన ఆజ్ఞ శత్రుత్వం చూపే వ్యక్తుల వల్ల కలిగే ప్రమాదం గురించి హెచ్చరిస్తుంది. ‘అప్రమత్తంగా ఉండండి’ అనేది జాగ్రత్తపడాలనే బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న ఆదేశం నుంచి హెచ్చరిక వైపు స్వల్పమైన మలుపును సూచిస్తుంది; ‘అయితే’ ఆ భావసంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: మనుషుల విషయంలో
  rationale: προσέχωతో కూడిన ἀπό ప్రమాదం వచ్చే మూలాన్ని సూచిస్తుంది. ఇక్కడ ἄνθρωποι కేవలం పురుషులను కాక, శత్రుత్వం చూపే మనుషులను సాధారణంగా సూచిస్తుంది.
- source_word: παραδώσουσιν
  choice: అప్పగిస్తారు
  rationale: అధికారుల అధీనానికి ఒకరిని అప్పగించడం అనే న్యాయపరమైన భావాన్ని ఇది సహజంగా అందిస్తుంది; ‘ద్రోహం చేస్తారు’ అనడం మూలంలో స్పష్టంగా లేని వ్యక్తిగత ద్రోహ భావాన్ని చేర్చుతుంది.
- source_word: συνέδρια
  choice: న్యాయసభలు
  rationale: ఈ బహువచనం తప్పనిసరిగా యెరూషలేము మహాసభను కాక, స్థానిక పరిపాలనా లేదా న్యాయవిచారణ సభలను సూచిస్తుంది. ‘న్యాయసభలు’ వాటి సందర్భోచిత విధిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: συναγωγαῖς
  choice: సమాజమందిరాలు
  rationale: ఇది యూదుల ఆరాధన, సమావేశం, సామాజిక క్రమశిక్షణకు సంబంధించిన నిర్దిష్ట స్థలాలను సూచిస్తుంది. ‘సమాజమందిరాలు’ తెలుగులో స్థిరపడిన, గౌరవప్రదమైన పదం.
- source_word: αὐτῶν
  choice: వారి
  rationale: ఈ సర్వనామం సమాజమందిరాలతో వారి సంబంధాన్ని లేదా వాటిపై వారి అధీనాన్ని సూచిస్తుంది.
- source_word: μαστιγώσουσιν
  choice: కొరడాలతో కొడతారు
  rationale: ఈ క్రియ కొరడాతో విధించే శారీరక శిక్షను సూచిస్తుంది. ఎంపిక చేసిన పదబంధం ఆ చర్యను ఆధునిక పాఠకులకు స్పష్టంగా, గంభీరంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἀνθρώπων పదంలోని లింగ సూచన
  choice: మనుషులు
  alternative: పురుషులు
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనమైనప్పటికీ, ఈ సందర్భంలో హింసించే మానవ ప్రత్యర్థులను సాధారణంగా సూచిస్తుంది. ‘పురుషులు’ అని అనువదిస్తే మూలపాఠంలో లేని పురుషులకు మాత్రమే పరిమితమైన అర్థం కలగవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం ఉపయోగించబడింది. న్యాయపరమైన సందర్భాన్ని స్పష్టంగా ఉంచుతూ, వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా తీర్చిదిద్దాం. ‘సమాజమందిరాలు’ యూదుల synagogueలకు తెలుగులో స్థిరపడిన పదంగా వాడబడింది.
