revisions:
- from: తన సిలువను ఎత్తుకొని[a] నా వెనుక నడవనివాడు[b] నాకు తగినవాడు కాడు.
  to: తన సిలువను ఎత్తుకొని[a] నా వెనుక నన్ను అనుసరించనివాడు[b] నాకు తగినవాడు కాడు.
  rationale: The revision replaces ‘నడవనివాడు’ with ‘నన్ను అనుసరించనివాడు’ so that ἀκολουθεῖ retains its discipleship/following sense, while ‘నా వెనుక’ continues to represent ὀπίσω μου. The footnote is aligned with the revised wording. The concrete cross image, generic singular reflexive reference, and relational force of ‘worthy of me’ are retained without doctrinal expansion.
