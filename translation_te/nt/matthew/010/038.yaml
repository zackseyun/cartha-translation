  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: te
  text: తన సిలువను ఎత్తుకొని[a] నా వెనుక నన్ను అనుసరించనివాడు[b] నాకు తగినవాడు కాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘తన సిలువ’లోని సర్వనామం వ్యాకరణపరంగా పుంలింగ ఏకవచనంలో ఉంది; అయితే ఇది సాధారణ ప్రతినిధి భావంలో వాడబడింది, అంటే ప్రతి వ్యక్తి తన సొంత సిలువను ఎత్తుకోవాలి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నన్ను అనుసరించనివాడు.’ గ్రీకులో ‘నా వెనుక’ అనే మాట కూడా స్పష్టంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: నడవనివాడు
  rationale: గ్రీకు అనిర్దిష్ట, సాధారణ సంబంధార్థాన్ని తెలుగులో సహజమైన ఏకవచన సాధారణ నిర్మాణంతో వ్యక్తపరుస్తుంది; వాక్యంలోని నిరాకరణతో కలిసి ‘ఎవరైతే ... చేయరో’ అనే భావాన్ని ఇస్తుంది.
- source_word: λαμβάνει
  choice: ఎత్తుకొని
  rationale: σταυρόςతో కలిసినప్పుడు కేవలం తీసుకోవడం కాక, సిలువను తనపై మోసేందుకు స్వీకరించడం అనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: σταυρὸν
  choice: సిలువను
  rationale: రోమా మరణశిక్ష సాధనాన్నీ, మత్తయి సువార్తలోని శిష్యత్వ చిత్రాన్నీ నిలుపుకునే ప్రామాణికమైన, సులభంగా అర్థమయ్యే తెలుగు పదం.
- source_word: αὐτοῦ
  choice: తన
  rationale: కర్తను తిరిగి సూచించే ఏకవచన స్వీయసూచక రూపం; తెలుగులో సహజంగా ఉండి, ప్రతి శిష్యుడు తన సొంత సిలువను ఎత్తుకోవాలనే భావాన్ని కాపాడుతుంది.
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: నా వెనుక నడవనివాడు
  rationale: ἀκολουθεῖతో పాటు ఉన్న ὀπίσω μουను విడిచిపెట్టకుండా, యేసు వెనుక శిష్యుడిగా నడవడం అనే స్పష్టమైన భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἄξιος
  choice: తగినవాడు
  rationale: సంబంధాత్మక మూల్యాంకనాన్ని ఆధునిక తెలుగులో గంభీరంగా, సహజంగా వ్యక్తపరుస్తుంది; ‘యోగ్యుడు’ కంటే సాధారణ పాఠకులకు సులభం.
- source_word: μου ἄξιος
  choice: నాకు తగినవాడు
  rationale: గ్రీకు షష్ఠీ విభక్తితో కూడిన ἄξιος భావాన్ని అనవసర వివరణ లేకుండా నేరుగా కాపాడుతుంది.
theological_decisions:
- issue: సిలువను ఎత్తుకోవడం అనే శిష్యత్వ వాక్యం
  choice: ‘తన సిలువను ఎత్తుకొని’ అనే నిర్దిష్ట చిత్రాన్ని యథాతథంగా నిలుపుకోవడం
  alternative: ‘బాధలను అంగీకరించి’ లేదా ‘తన్ను తాను నిరాకరించి’ అని భావానువాదం చేయడం
  rationale: మూలవాక్యం సిలువ అనే చారిత్రకంగా, దైవశాస్త్రపరంగా బరువైన చిత్రాన్ని ఉపయోగిస్తుంది. దానిని సాధారణ బాధ లేదా ఆత్మనిరాకరణగా మాత్రమే పరిమితం చేయకూడదు.
- issue: αὐτοῦలోని వ్యాకరణపరమైన పుంలింగ ఏకవచనం
  choice: తెలుగులో సహజమైన ఏకవచన స్వీయసూచక పదం ‘తన’ను ఉపయోగించి, సాధారణ ప్రతినిధి భావాన్ని పాదసూచికలో వివరించడం
  alternative: ‘అతని’ లేదా బహువచన లింగతటస్థ రూపాన్ని ఉపయోగించడం
  rationale: ‘తన’ కర్తతో స్పష్టంగా అనుసంధానమై ప్రతి శిష్యుని సొంత సిలువను సూచిస్తుంది. తెలుగు స్వీయసూచక సర్వనామం లింగాన్ని గుర్తించదు; కృత్రిమంగా ‘అతని’ చేర్చడం కంటే ఇది మూలంలోని సాధారణ ఏకవచన భావాన్ని సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ వాక్యపు గంభీరతను నిలుపుకుంది. ‘నా వెనుక నడవడం’ అనే రూపం ὀπίσω μου యొక్క స్పష్టతను కాపాడుతుంది; ‘తగినవాడు’ ἄξιοςకు సరళమైన, గౌరవప్రదమైన సమానార్థకం.
