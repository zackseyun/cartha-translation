  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: te
  text: ఎందుకంటే, ఒక మనిషిని అతని తండ్రికి విరోధంగా, ఒక కుమార్తెను ఆమె తల్లికి విరోధంగా, ఒక కోడలిని[b] ఆమె అత్తకు విరోధంగా నిలబెట్టడానికి[a] నేను వచ్చాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విభజించడానికి.’ గ్రీకు క్రియను అక్షరార్థంగా అలా అనువదించవచ్చు; అయితే తరువాత పునరావృతమయ్యే ‘విరోధంగా’ అనే నిర్మాణం సంబంధాల్లోని వ్యతిరేకతను స్పష్టం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు νύμφη అనే పదానికి కొన్ని సందర్భాల్లో ‘వధువు’ అని అర్థం; ఇక్కడ ‘అత్త’తో జతగా ఉన్నందున ‘కోడలు’ అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: నేను వచ్చాను
  rationale: యేసు రాకను, ఆయన కార్యాన్ని సూచించే భూతకాల క్రియను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను అనుసంధానించే గ్రీకు అవ్యయ బలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: διχάσαι
  choice: విరోధంగా నిలబెట్టడానికి
  rationale: ఈ క్రియకు ‘విభజించుట’ అనే మూలార్థం ఉన్నా, తరువాత మూడుసార్లు వచ్చే κατά + షష్ఠీ విభక్తి సంబంధపరమైన వ్యతిరేకతను స్పష్టం చేస్తుంది.
- source_word: ἄνθρωπον
  choice: ఒక కుమారుణ్ణి
  rationale: పదానికి సాధారణంగా ‘మనిషి/పురుషుడు’ అనే అర్థం ఉంది; ఇక్కడ తండ్రితో ఉన్న కుటుంబ సంబంధం మరియు తరువాతి కుమార్తె–కోడలు జతల సరళి దృష్ట్యా తెలుగులో ‘కుమారుడు’ సహజంగా సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: తన తండ్రికి విరోధంగా
  rationale: κατά + షష్ఠీ విభక్తి ఇక్కడ వ్యతిరేకతను సూచిస్తుంది; ‘తన’ అనేది కర్తకు సంబంధించిన స్వత్వాన్ని తెలుగులో సహజంగా చూపుతుంది.
- source_word: θυγατέρα
  choice: ఒక కుమార్తెను
  rationale: గ్రీకు స్త్రీలింగ ఏకవచన నామవాచకానికి నేరమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: తన తల్లికి విరోధంగా
  rationale: పునరావృతమైన వ్యతిరేకత నిర్మాణాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: νύμφην
  choice: ఒక కోడలిని
  rationale: νύμφη కొన్ని సందర్భాల్లో ‘వధువు’ అని అర్థమవుతుంది; ఇక్కడ πενθεράతో జత చేయబడినందున ‘కోడలు’ అనే బంధుత్వార్థమే సందర్భోచితం.
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: తన అత్తకు విరోధంగా
  rationale: πενθερά అంటే ఈ సందర్భంలో కోడలి అత్త, అంటే భర్త తల్లి; ‘అత్త’ ఆధునిక తెలుగులో సహజమైన బంధుత్వ పదం.
theological_decisions:
- issue: యేసు రాక ఉద్దేశం మరియు కుటుంబ విభేదం
  choice: యేసు రాకవల్ల కుటుంబ సభ్యుల మధ్య తలెత్తే స్పష్టమైన వ్యతిరేకతను వాక్యంలో ఉన్నంత తీవ్రంగా నిలుపడం
  alternative: దీనిని కేవలం ‘విభజించడానికి’ అని చెప్పడం లేదా యేసుపట్ల విశ్వాసం కారణంగా కలిగే హింస అని ప్రధాన వాక్యంలోనే వివరించడం
  rationale: గ్రీకు వాక్యం విభజనను మాత్రమే కాక కుటుంబ సంబంధాల్లో వ్యతిరేకతను కూడా బలంగా చెబుతుంది. అయితే ఆ విరోధాన్ని యేసు అంతిమంగా కోరే మేలుగా వివరించదు. అందువల్ల వాక్యంలోని దైవశాస్త్రీయ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరతను నిలుపుతూ అనువదించబడింది. కుటుంబ సంబంధాల సమాంతర నిర్మాణం మరియు ‘విరోధంగా’ అనే పునరావృతం ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి.
