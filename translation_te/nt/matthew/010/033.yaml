id: MAT.10.33
reference: Matthew 10:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: te
  text: అయితే మనుష్యుల ఎదుట[a] నన్ను ఎవరైతే నిరాకరిస్తారో, పరలోకంలో[b] ఉన్న నా తండ్రి ఎదుట నేనూ వారిని నిరాకరిస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రజల ఎదుట.’ గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనంలో ఉన్నా, ఇక్కడ సాధారణంగా మనుష్యులందరినీ సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘పరలోకాల్లో ఉన్న.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: అయితే ... ఎవరైతే
  rationale: ὅστις మరియు ἄν కలసి సాధారణంగా వర్తించే షరతును తెలియజేస్తాయి; δέ ముందటి వాక్యానికి వ్యతిరేకతను సూచిస్తుంది. ఈ తెలుగు నిర్మాణం ఆ రెండింటినీ సహజంగా నిలుపుతుంది.
- source_word: ἀρνήσηταί ... ἀρνήσομαι
  choice: నిరాకరిస్తారో ... నిరాకరిస్తాను
  rationale: రెండు చోట్లా ఒకే మూలక్రియను ఒకే తెలుగు క్రియతో అనువదించడం ద్వారా పరస్పర ప్రతిస్పందనలోని వాక్య సమాంతరత నిలుస్తుంది.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: మనుష్యుల ఎదుట
  rationale: ἔμπροσθεν ఇక్కడ ‘సమక్షంలో/ఎదుట’ అనే భావం ఇస్తుంది; ἀνθρώπων మానవులను సాధారణంగా సూచిస్తుంది. ‘మనుష్యుల ఎదుట’ మూలానికి దగ్గరగా ఉండి ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: κἀγὼ αὐτὸν
  choice: నేనూ అతణ్ణి
  rationale: κἀγώలోని ‘నేనూ’ అనే బలమైన ప్రతిస్పందనను నిలుపుతూ, αὐτόνలోని ఏకవచన పురుష సూచనను ‘అతణ్ణి’గా ప్రతిబింబిస్తుంది.
- source_word: τοῦ πατρός μου
  choice: నా తండ్రి
  rationale: యేసు ఉపయోగించిన ప్రత్యక్ష పితృసంబంధ సంబోధనను అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: పరలోకంలో ఉన్న
  rationale: గ్రీకులో బహువచన రూపం ఉన్నప్పటికీ, ఆధునిక తెలుగులో దేవుని నివాసాన్ని సూచించడానికి ఏకవచన ‘పరలోకంలో’ సహజమైన వాడుక; అక్షరార్థ బహువచనం పాదటిప్పణిలో ఇవ్వబడింది.
theological_decisions:
- issue: ἀνθρώπων మరియు αὐτόνలోని సాధారణ మానవ సూచన, పురుష ఏకవచన రూపం
  choice: మనుష్యుల ఎదుట ... అతణ్ణి
  alternative: ప్రజల ఎదుట ... ఆ వ్యక్తిని
  rationale: ἀνθρώπων సందర్భంలో సమస్త మనుష్యులను సూచించినా, αὐτόν పురుష ఏకవచన రూపంలో ఉంది. తెలుగు అనువాదం మూలంలోని వ్యాకరణ ఆకృతిని సాధ్యమైనంతవరకు నిలుపుతూ, నియమం అందరికీ వర్తిస్తుందనే భావాన్ని ‘ఎవరైతే’ ద్వారా తెలియజేస్తుంది.
- issue: పరస్పర నిరాకరణ భాష
  choice: నన్ను ... నిరాకరిస్తారో, ... నేనూ అతణ్ణి నిరాకరిస్తాను
  alternative: నన్ను ... ఒప్పుకోరో, ... నేనూ అతణ్ణి ఒప్పుకోను
  rationale: రెండు సందర్భాల్లోనూ ἀρνέομαι అనే ఒకే క్రియ ఉంది. దానిని సానుకూల క్రియకు నిరాకరణగా మార్చకుండా ‘నిరాకరించు’ అని రెండుసార్లూ అనువదించడం గంభీరమైన పరస్పరతను, దాని ధార్మిక ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతతో కూడిన సహజ వాక్య నిర్మాణం వాడబడింది. గౌరవార్థక ‘ఎవరైతే ... నిరాకరిస్తారో’తో పాటు మూలంలోని పురుష ఏకవచన సూచనను ‘అతణ్ణి’గా ఉంచడం వల్ల స్వల్ప సంఖ్యా-రూప భేదం ఉన్నా, ఇది ఆధునిక తెలుగు వాడుకలో సహజంగా అర్థమవుతుంది. ‘నేనూ’ κἀγώలోని ప్రతిస్పందనాత్మక ఉద్ఘాటనను నిలుపుతుంది.
