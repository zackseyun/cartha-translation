  source_fidelity: The draft preserves the adversative connection, the public setting ('before people'), the reciprocal use of ἀρνέομαι, the emphatic 'I also,' and the Father's heavenly location. However, its plural verb with singular masculine resumptive pronoun creates an avoidable grammatical mismatch in Telugu. Since the Greek masculine singular is generic in this conditional statement, Telugu's natural generic plural-correlative form is preferable without narrowing the scope.
