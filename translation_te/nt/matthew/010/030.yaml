lexical_decisions:
- source_word: ὑμῶν
  choice: మీ
  rationale: ఇది బహువచన రెండవ పురుష సంబంధార్థక రూపం; తెలుగులో సహజమైన స్వామ్య సూచనగా ‘మీ’ అని అనువదించాం.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి సందర్భంతో స్వల్ప వ్యత్యాసాన్ని, కొనసాగింపును సూచించే సంధానార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: καὶ
  choice: సైతం
  rationale: పెద్ద విషయాలే కాక తల వెంట్రుకలు కూడా అనే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: తల వెంట్రుకలు
  rationale: ఏ వెంట్రుకలని ఉద్దేశిస్తున్నదో తెలిపే గ్రీకు సంబంధార్థక నిర్మాణానికి సహజమైన తెలుగు రూపం.
- source_word: πᾶσαι
  choice: అన్నీ
  rationale: ప్రతి వెంట్రుకనూ కలుపుకొనే సంపూర్ణతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἠριθμημέναι εἰσίν
  choice: లెక్కించబడి ఉన్నాయి
  rationale: గ్రీకు పరిభాషాత్మక పూర్ణ భూతకర్మణి రూపం పూర్తయిన క్రియ వల్ల కొనసాగుతున్న స్థితిని సూచిస్తుంది; ఈ తెలుగు రూపం ఆ భావాన్ని సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ఈ మాట సూచించే దేవుని జ్ఞానం లేదా సంరక్షణ పరిధి
  choice: తల వెంట్రుకలన్నీ లెక్కించబడి ఉన్నాయనే స్పష్టమైన చిత్రణను మాత్రమే అనువాదంలో ఉంచడం
  alternative: దేవుని శ్రద్ధ లేదా సర్వాధికార పరిపాలనను వివరణాత్మకంగా చేర్చడం
  rationale: మూల వాక్యం నిర్దిష్టమైన చిత్రణను ఇస్తుంది; దాని వేదాంతపరమైన సూచనను సందర్భం నుంచే గ్రహించనిస్తూ, అనువాదంలో అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అదే సమయంలో గౌరవప్రదమైన శైలిలో అనువదించాం. ‘సైతం’ ఉద్ఘాటనను, ‘లెక్కించబడి ఉన్నాయి’ పూర్తయిన క్రియ యొక్క కొనసాగుతున్న ఫలితాన్ని నిలుపుతాయి.
