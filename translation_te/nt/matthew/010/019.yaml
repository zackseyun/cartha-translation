id: MAT.10.19
reference: Matthew 10:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: te
  text: కాని వారు మిమ్మల్ని అప్పగించినప్పుడు[a], ఎలా మాట్లాడాలి లేదా ఏమి మాట్లాడాలి అని ఆందోళనపడకండి. ఎందుకంటే ఆ సమయంలో మీరు ఏమి మాట్లాడాలో మీకు ఇవ్వబడుతుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అప్పగించు’ అంటే ఈ సందర్భంలో అధికారుల చేతికి అప్పగించడం; గ్రీకు వాక్యంలో ‘అధికారులకు’ అని స్పష్టంగా లేదు.
    reason: contextual_clarification
  - marker: b
    text: ‘ఇవ్వబడుతుంది’ అనే కర్మణి ప్రయోగం ఇచ్చేవారు ఎవరో ఇక్కడ చెప్పకుండా ఉంచుతుంది; తరువాతి వచనం తమ ద్వారా మాట్లాడేది తండ్రి ఆత్మ అని తెలియజేస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: కాని ... అప్పుడు
  rationale: ὅταν భవిష్యత్తులో సంభవించే సందర్భాన్ని సూచిస్తుంది; δέ ముందున్న హెచ్చరిక నుంచి స్వల్పమైన మలుపును తెలియజేస్తుంది.
- source_word: παραδῶσιν ὑμᾶς
  choice: వారు మిమ్మల్ని అప్పగించినప్పుడు
  rationale: παραδίδωμι ఇక్కడ శత్రుత్వపూర్వకంగా అధికారుల చేతికి అప్పగించడాన్ని సూచిస్తుంది; ‘అప్పగించు’ సహజంగా ఉండి, ‘ద్రోహం చేయు’ అనే మరింత నిర్దిష్ట భావాన్ని అనవసరంగా చేర్చదు.
- source_word: μὴ μεριμνήσητε
  choice: ఆందోళనపడకండి
  rationale: మెదడును పట్టిపీడించే చింత లేదా ఆత్రుతను ఈ క్రియ సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో ‘ఆందోళనపడకండి’ స్పష్టంగా, సహజంగా ఉంది.
- source_word: πῶς ἢ τί λαλήσητε
  choice: ఎలా మాట్లాడాలి, ఏమి మాట్లాడాలి
  rationale: πῶς మరియు τί వరుసగా మాట్లాడే విధానాన్ని, విషయాన్ని వేరుచేస్తాయి. తెలుగులో సహజమైన జత నిర్మాణం కోసం గ్రీకు ἤ భావాన్ని రెండు సమాంతర ప్రశ్నార్థక పదబంధాలతో వ్యక్తం చేశాం.
- source_word: δοθήσεται
  choice: ఇవ్వబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, ఇచ్చేవారు ఎవరో ఈ వచనంలో స్పష్టంగా పేర్కొనలేదు.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: ఆ సమయంలో
  rationale: అవసరమైన వేళలోనే సహాయం లభిస్తుందనే తక్షణత్వాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τί λαλήσητε
  choice: మీరు ఏమి మాట్లాడాలో
  rationale: λαλέωకు ముందున్న ‘మాట్లాడాలి’తో పదసంబంధాన్ని నిలుపుతూ, పరోక్ష ప్రశ్నను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: δοθήσεταιలో అంతర్లీనంగా ఉన్న దైవ కర్త
  choice: ‘మీకు ఇవ్వబడుతుంది’ అనే కర్మణి ప్రయోగాన్ని నిలుపుకోవడం
  alternative: ‘దేవుడు మీకు ఇస్తాడు’ లేదా ‘ఆత్మ మీకు ఇస్తాడు’
  rationale: ఈ వచనంలోని గ్రీకు వాక్యం ఇచ్చేవారిని పేరుపెట్టి చెప్పదు. తరువాతి వచనం ఆత్మ కార్యాన్ని వివరిస్తుంది; అందువల్ల ఇక్కడ మూలపాఠంలోని నియంత్రిత అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన ధోరణితో రూపొందించబడింది. గ్రీకు వాక్యంలోని విధానం/విషయం భేదం మరియు కర్మణి ప్రయోగంలోని ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి.
