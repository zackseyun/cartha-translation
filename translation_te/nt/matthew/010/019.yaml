revisions:
- from: కాని వారు మిమ్మల్ని అప్పగించినప్పుడు[a], ఎలా మాట్లాడాలి, ఏమి మాట్లాడాలి అని ఆందోళనపడకండి. ఎందుకంటే మీరు ఏమి మాట్లాడాలో ఆ సమయంలో మీకు ఇవ్వబడుతుంది[b].
  to: కాని వారు మిమ్మల్ని అప్పగించినప్పుడు[a], ఎలా మాట్లాడాలి లేదా ఏమి మాట్లాడాలి అని ఆందోళనపడకండి. ఎందుకంటే ఆ సమయంలో మీరు ఏమి మాట్లాడాలో మీకు ఇవ్వబడుతుంది[b].
