review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the future contingency, hostile sense of παραδῶσιν ('hand over'), the prohibition of anxious concern, and the impersonal future passive ('will be given'). However, the comma between ‘ఎలా’ and ‘ఏమి’ can be read as a simple conjunction, whereas πῶς ἢ τί explicitly distinguishes ‘how or what.’ Replacing it with ‘లేదా’ preserves the Greek disjunction.
  naturalness: The Telugu is modern, clear, and appropriately restrained. ‘ఆందోళనపడకండి’ and the passive ‘ఇవ్వబడుతుంది’ are natural in this register. Moving ‘ఆ సమయంలో’ forward slightly improves flow without altering emphasis.
  terminology: ‘అప్పగించినప్పుడు’ is an accurate, non-over-specified rendering of παραδῶσιν. The passive wording properly leaves the giver unnamed. The cross-reference footnote accurately identifies the following verse as speaking of the Spirit of the Father, while not importing that identification into this verse.
  issues:
  - severity: medium
    issue: The disjunctive ἤ is not explicitly represented in the first indirect question.
    rationale: ‘ఎలా మాట్లాడాలి, ఏమి మాట్లాడాలి’ may be understood as ‘how and what to speak.’ The source reads πῶς ἢ τί, ‘how or what’; ‘లేదా’ should be supplied.
  revised_text: కాని వారు మిమ్మల్ని అప్పగించినప్పుడు[a], ఎలా మాట్లాడాలి లేదా ఏమి మాట్లాడాలి అని ఆందోళనపడకండి. ఎందుకంటే ఆ సమయంలో మీరు ఏమి మాట్లాడాలో మీకు ఇవ్వబడుతుంది[b].
