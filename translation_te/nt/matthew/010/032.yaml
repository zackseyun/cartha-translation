id: MAT.10.32
reference: Matthew 10:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: te
  text: కాబట్టి, మనుషుల ఎదుట ఎవరైతే నన్ను ఒప్పుకుంటారో[a], పరలోకంలో ఉన్న నా తండ్రి ఎదుట వారిని నేనూ ఒప్పుకుంటాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘నాలో ఒప్పుకుంటారో’ అని ఉంది; ఇక్కడ దాని భావాన్ని తెలుగులో సహజంగా ‘నన్ను ఒప్పుకుంటారో’ అని ఇచ్చాం.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా ‘వారిలో ఒప్పుకుంటాను’ లేదా ‘వారి విషయంలో ఒప్పుకుంటాను’ అనే నిర్మాణం ఉంది; సందర్భార్థాన్ని తెలుగులో ‘వారిని ఒప్పుకుంటాను’ అని ఇచ్చాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: కాబట్టి, ... ఎవరైతే ... వారిని
  rationale: ఈ గ్రీకు పదబంధం ఎవరినీ మినహాయించని సాధారణ నియమాన్ని తెలియజేస్తుంది. ‘కాబట్టి’ అనే మాట οὖν ద్వారా ముందున్న సందర్భంతో ఏర్పడే నిర్ధారణాత్మక సంబంధాన్ని నిలుపుతుంది.
- source_word: ὁμολογήσει / ὁμολογήσω
  choice: ఒప్పుకుంటారో / ఒప్పుకుంటాను
  rationale: ὁμολογέω ఇక్కడ యేసును ఇతరుల సమక్షంలో బహిరంగంగా అంగీకరించడం లేదా ఆయనతో తన అనుబంధాన్ని ప్రకటించడం అనే భావం ఇస్తుంది. రెండు చోట్లా ఒకే తెలుగు క్రియను వాడడం ద్వారా మూలంలోని పరస్పర సమాంతరత నిలిచింది.
- source_word: ἐν ἐμοὶ / ἐν αὐτῷ
  choice: నన్ను / వారిని
  rationale: ὁμολογέωతో వచ్చిన ἐνను యథాతథంగా ‘నాలో/వారిలో’ అని అనువదిస్తే తెలుగులో అసహజంగా, అస్పష్టంగా ఉంటుంది. వ్యక్తినే ఒప్పుకోవడం అనే సందర్భార్థాన్ని సహజమైన కర్మరూపంలో ఇచ్చి, గ్రీకు నిర్మాణాన్ని పాదసూచికల్లో తెలిపాం.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: మనుషుల ఎదుట
  rationale: ἔμπροσθεν సమక్షాన్ని సూచిస్తుంది; ἀνθρώπων ఇక్కడ మానవులందరినీ సాధారణంగా సూచించే బహువచనం. ‘మనుషుల ఎదుట’ మూలానికి దగ్గరగా ఉండి ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: κἀγώ
  choice: నేనూ
  rationale: κἀγώలోని పరస్పర నొక్కిచెప్పే భావాన్ని తెలుగు ‘నేనూ’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: పరలోకంలో ఉన్న నా తండ్రి
  rationale: గ్రీకులో οὐρανοῖς బహువచనంలో ఉన్నా, ఈ మత్తయి సువార్తలోని స్థిర భావవ్యక్తీకరణను ఆధునిక తెలుగులో సహజంగా ‘పరలోకంలో’ అని ఏకవచన రూపంలో చెప్పవచ్చు.
theological_decisions:
- issue: యేసును బహిరంగంగా ఒప్పుకోవడం, యేసు ఆ వ్యక్తిని తండ్రి ఎదుట ఒప్పుకోవడం
  choice: వచనంలోని పరస్పర వాగ్దానాన్ని నేరుగా అనువదించడం
  alternative: దీనిని ప్రత్యేకంగా అంతిమ తీర్పులో న్యాయస్థాన సంబంధమైన ప్రకటనగా లేదా కేవలం ప్రస్తుత శిష్యత్వానికి సంబంధించిన మాటగా వివరించడం
  rationale: వచనం యేసును మనుషుల ఎదుట ఒప్పుకోవడానికి, యేసు ఆ వ్యక్తిని తండ్రి ఎదుట ఒప్పుకోవడానికి మధ్య సంబంధాన్ని చెబుతుంది. అది ఎప్పుడు లేదా ఏ విధంగా నెరవేరుతుందనే విస్తృత సిద్ధాంత ప్రశ్నను మూలవచనం ఇక్కడ స్పష్టంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘ఎవరైతే ... వారిని’ అనే రూపం మూలంలోని ఏకవచన సాధారణీకరణను తెలుగులో లింగనిరపేక్షంగా, సహజంగా వ్యక్తం చేస్తుంది.
