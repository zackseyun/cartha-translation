  naturalness: The present draft is natural modern Telugu. The revised wording remains clear and idiomatic while allowing the paradox’s intentionally striking wording to stand.
  terminology: “ప్రాణం” is appropriate here for ψυχή, with “జీవితం” and “ఆత్మ” retained as lexical alternatives in a concise footnote. “నా నిమిత్తం” is an established, respectful Telugu biblical expression and accurately renders ἕνεκεν ἐμοῦ.
