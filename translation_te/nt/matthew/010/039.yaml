id: MAT.10.39
reference: Matthew 10:39
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: te
  text: తన ప్రాణాన్ని పొందినవాడు దాన్ని కోల్పోతాడు[a]; నా నిమిత్తం తన ప్రాణాన్ని కోల్పోయినవాడు దాన్ని పొందుతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రాణం’ అనే పదాన్ని రెండు చోట్లా ‘జీవితం’ లేదా ‘ఆత్మ’ అని కూడా అనువదించవచ్చు. గ్రీకు ψυχήకి ఈ అర్థాలు ఉండవచ్చు; ఈ సందర్భంలో ‘ప్రాణం’ లేదా ‘జీవితం’ అనే అర్థం బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: కాపాడుకునేవాడు
  rationale: అక్షరార్థంగా ‘కనుగొనేవాడు’ అయినా, ఇక్కడ తన ప్రాణాన్ని తనకోసం నిలుపుకోవడం లేదా కాపాడుకోవడం అనే సందర్భార్థం ఉంది. సహజమైన తెలుగులో ఈ భావాన్ని స్పష్టంగా తెలియజేస్తూ, తరువాతి ‘పొందుతాడు’తో ఉన్న విరోధాభాసాన్ని నిలుపుతుంది.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: తన ప్రాణాన్ని
  rationale: ψυχή ఇక్కడ శరీరానికి భిన్నమైన అమూర్త ‘ఆత్మ’కన్నా వ్యక్తి ప్రాణం లేదా జీవితం అనే భావంలో ఉంది. ‘ప్రాణం’ ప్రాణాన్ని కాపాడుకోవడం, పోగొట్టుకోవడం అనే శిష్యత్వ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: ἀπολέσει / ὁ ἀπολέσας
  choice: పోగొట్టుకుంటాడు / పోగొట్టుకునేవాడు
  rationale: ἀπόλλυμι ఇక్కడ నాశనం చేయడం కన్నా కోల్పోవడం అనే అర్థాన్ని ఇస్తుంది. ఒకే తెలుగు మూలక్రియను వాడడం వాక్యంలోని ఉద్దేశపూర్వక పునరుక్తిని నిలుపుతుంది.
- source_word: ἕνεκεν ἐμοῦ
  choice: నా నిమిత్తం
  rationale: యేసు కారణంగా లేదా ఆయనపట్ల నిబద్ధత వల్ల అనే భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: εὑρήσει
  choice: పొందుతాడు
  rationale: అక్షరార్థంగా ‘కనుగొంటాడు’. అయితే తన ప్రాణాన్ని ‘కనుగొనడం’ ఆధునిక తెలుగులో అసహజంగా ఉండవచ్చు; ‘పొందుతాడు’ జీవాన్ని చివరికి పొందడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: αὐτοῦ / αὐτήν
  choice: తన / దాన్ని
  rationale: గ్రీకులోని ప్రతినిధి ఏకవచన నిర్మాణాన్ని తెలుగులో సహజమైన లింగనిరపేక్ష ‘తన’తో, దాని నిర్దేశక రూపమైన ‘దాన్ని’తో నిలుపుతుంది.
theological_decisions:
- issue: శిష్యత్వ విరోధాభాసంలో ψυχή అనువాదం
  choice: ప్రాణం
  alternative: జీవితం; ఆత్మ
  rationale: ఈ సందర్భం యేసు నిమిత్తం తన భౌతిక ప్రాణాన్నే కోల్పోవడానికి సిద్ధపడడం గురించి మాట్లాడుతుంది; శరీరం–ఆత్మ విభజనను ప్రధానంగా బోధించడం కాదు. ‘ప్రాణం’ ఆ తీవ్రతను నిలుపుతుంది. అయినా ψυχήకి ‘జీవితం’ లేదా ‘ఆత్మ’ అనే విస్తృత అర్థాలు ఉండగలవని పాదసూచికలో గుర్తించబడింది.
- issue: εὑρίσκω యొక్క పునరావృతానికి తెలుగు రూపం
  choice: మొదటి సందర్భంలో ‘కాపాడుకోవడం’, చివర ‘పొందడం’
  alternative: రెండు సందర్భాల్లోనూ ‘కనుగొనడం’
  rationale: ఒకే గ్రీకు క్రియ వాక్యానికి అలంకార సమతను ఇస్తుంది; కానీ అక్షరార్థ పునరావృతం తెలుగులో అర్థాన్ని మసకబార్చుతుంది. సందర్భానుగుణ పదాలు విరోధాభాసాన్ని సాధారణ పాఠకునికి స్పష్టంగా చేస్తాయి, అయితే గ్రీకు పదప్రయోగ వివరాన్ని పాదసూచికలో భద్రపరుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘నా నిమిత్తం’ బైబిలు గంభీరతను నిలుపుతూ ఇప్పటికీ సులభంగా అర్థమయ్యే ప్రయోగం. ప్రతినిధి వ్యక్తిని సూచించడానికి సహజమైన ‘తన’ వాడబడింది.
