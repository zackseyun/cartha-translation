id: MAT.10.16
reference: Matthew 10:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: te
  text: “ఇదిగో, నేను మిమ్మల్ని తోడేళ్ల మధ్యలో గొర్రెలవలె పంపుతున్నాను. కాబట్టి పాములవలె వివేకులుగా, పావురాలవలె నిష్కపటులుగా ఉండండి.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షించే మూలపదపు బలాన్ని సహజమైన, గంభీరమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀποστέλλω
  choice: పంపుతున్నాను
  rationale: ప్రత్యేక కార్యం కోసం పంపడాన్ని సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν μέσῳ λύκων
  choice: తోడేళ్ల మధ్యకు
  rationale: శిష్యులు ఎదుర్కొనే ప్రమాదకర పరిసరాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; గ్రీకు ἐν μέσῳ యొక్క ‘మధ్యలో’ భావాన్ని గమ్యార్థక క్రియతో ‘మధ్యకు’గా అమర్చింది.
- source_word: φρόνιμοι
  choice: వివేకం గలవారుగా
  rationale: తెలివి, జాగ్రత్త, పరిస్థితిని సరిగ్గా అంచనా వేసే ఆచరణాత్మక వివేకం అనే విస్తృత భావాన్ని ఇస్తుంది.
- source_word: οἱ ὄφεις
  choice: పాములు
  rationale: సాధారణ ఆధునిక తెలుగు పదం; అవసరం లేని ప్రతికూల నైతిక భావాన్ని జోడించదు.
- source_word: ἀκέραιοι
  choice: నిష్కపటులుగా
  rationale: హాని కలిగించని, కల్మషం లేదా మోసం లేని స్వభావాన్ని ఈ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: αἱ περιστεραί
  choice: పావురాలు
  rationale: మూలంలోని ఉపమానాన్ని నేరుగా, సులభంగా నిలుపుతుంది.
theological_decisions:
- issue: పాముల ఉపమానం నైతికంగా ఎలా అర్థమవుతుందనే ఉద్రిక్తత
  choice: “పాములవలె వివేకం గలవారుగా” అని నేరుగా ఉంచడం
  alternative: “పాములవలె చాకచక్యంగా” లేదా “జిత్తులమారులుగా”
  rationale: యేసు మోసాన్ని ఆజ్ఞాపిస్తున్నట్లు వినిపించకుండా φρόνιμοι యొక్క సానుకూల ఆచరణాత్మక వివేకాన్ని నిలుపుతుంది; వెంటనే వచ్చే “నిష్కపటులు”తో ఉన్న సమతుల్యతను కాపాడుతుంది.
- issue: ἀκέραιοι యొక్క భావ పరిధి
  choice: “నిష్కపటులుగా”
  alternative: “హానిచేయనివారుగా” లేదా “కల్మషంలేనివారుగా”
  rationale: పావురాల ఉపమానంతో కలసి మోసం లేని స్వచ్ఛమైన ఉద్దేశాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; నిర్దిష్ట సిద్ధాంతార్థాన్ని బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే యేసు హెచ్చరికలోని గంభీరతను నిలుపుతూ రూపొందించబడింది. ఉపమానాల సమాంతర నిర్మాణం కాపాడబడింది.
