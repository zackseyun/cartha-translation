id: MAT.10.28
reference: Matthew 10:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: te
  text: శరీరాన్ని చంపినా ఆత్మను చంపలేనివారికి భయపడకండి. బదులుగా, ఆత్మనూ శరీరాన్నీ గెహెన్నాలో[a] నాశనం చేయగలవానికి భయపడండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నరకంలో.” గ్రీకు: “గెహెన్నాలో.” ఈ పదం హిన్నోము లోయ పేరు నుంచి వచ్చింది; అంతిమ తీర్పు స్థలాన్ని సూచించడానికి వాడబడింది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: భయపడకండి / భయపడండి
  rationale: గ్రీకులో ఒకే క్రియ వ్యతిరేక వాక్యభాగాల్లో పునరావృతమవుతుంది. తెలుగులోనూ ఒకే మూలక్రియను ఉంచడం ఆ వ్యతిరేకతను, హెచ్చరిక బలాన్ని నిలుపుతుంది.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: చంపేవారికి
  rationale: ఆర్టికల్‌తో ఉన్న వర్తమాన కృదంతం ఒక సాధారణ వర్గాన్ని సూచిస్తుంది. ‘చంపేవారు’ ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఉంటుంది.
- source_word: σῶμα
  choice: శరీరం
  rationale: భౌతిక దేహానికి నేరుగా, సాధారణంగా అర్థమయ్యే సమానార్థకం.
- source_word: ψυχήν
  choice: ఆత్మ
  rationale: ఇక్కడ ψυχή శరీరంతో స్పష్టంగా వ్యత్యాసపరచబడింది. ‘ప్రాణం’ అని అనువదిస్తే కేవలం భౌతిక జీవితం అనే భావం కలగవచ్చు; ‘ఆత్మ’ ఈ సందర్భంలోని శరీరం–ఆత్మ వ్యత్యాసాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: చంపలేనివారు
  rationale: సామర్థ్యం లేకపోవడాన్ని స్పష్టంగా తెలిపి, తెలుగు వాక్యంలో సహజమైన కృదంత రూపాన్ని ఉపయోగిస్తుంది.
- source_word: μᾶλλον
  choice: బదులుగా
  rationale: ‘వారికి కాదు, ఇతనికి భయపడండి’ అనే సరిదిద్దే వ్యతిరేకతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸν δυνάμενον
  choice: చేయగలవానికి
  rationale: గ్రీకు పాఠం ఆ వ్యక్తిని పేరుతో గుర్తించదు. ఈ రూపం ఆ అనిర్దిష్టతను నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: ἀπολέσαι
  choice: నాశనం చేయు
  rationale: తీర్పులో కలిగే తీవ్రమైన వినాశాన్ని తెలియజేస్తుంది; ఆ వినాశం ఎలా జరుగుతుందో అనవసరంగా నిర్దిష్టపరచదు.
- source_word: ἐν γεέννῃ
  choice: గెహెన్నాలో
  rationale: గ్రీకు పదాన్ని లిప్యంతరీకరించడం దాని యూదా నేపథ్యాన్ని నిలుపుతుంది; సుపరిచితమైన వివరణాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: గెహెన్నాలో ఆత్మనూ శరీరాన్నీ నాశనం చేయగలవాని గుర్తింపు
  choice: ప్రధాన పాఠంలో ‘చేయగలవానికి’ అని మాత్రమే ఉంచి, స్పష్టంగా పేరు చెప్పలేదు.
  alternative: దేవునికి; సాతానుకు
  rationale: సందర్భంలో ఇది అంతిమ తీర్పు అధికారం గల దేవుణ్ణి సూచించడం అత్యంత సహజం. అయినా గ్రీకు వాక్యం ఆ పేరును ప్రత్యక్షంగా చెప్పదు; అందువల్ల అనువాదం ఆ గుర్తింపును పాఠంలో చేర్చి ఉద్రిక్తతను పరిష్కరించదు.
- issue: γέεννα అనువాదం
  choice: గెహెన్నా
  alternative: నరకం
  rationale: మూలభాషకు ప్రాధాన్యమిస్తూ ప్రత్యేకమైన యూదా నేపథ్యం గల పదాన్ని ప్రధాన పాఠంలో నిలిపాం. పాఠకులకు సుపరిచితమైన ‘నరకం’ అనే అర్థాన్ని పాదసూచికలో అందించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవబహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. భాష సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా ఉంచబడింది; ‘గెహెన్నా’ వంటి మూలభాషా భావానికి పాదసూచిక వివరణ జోడించబడింది.
