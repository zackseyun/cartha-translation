revisions:
- from: 'అయితే వారు ఈ పట్టణంలో మిమ్మల్ని హింసించినప్పుడల్లా, మరో పట్టణానికి పారిపోండి.[a] ఎందుకంటే నేను మీతో నిశ్చయంగా చెబుతున్నాను: మనుష్యకుమారుడు వచ్చే వరకు మీరు ఇశ్రాయేలు పట్టణాలను తిరిగి ముగించనే ముగించరు.[b][c]'
  to: 'అయితే వారు ఈ పట్టణంలో మిమ్మల్ని హింసించినప్పుడల్లా, మరో పట్టణానికి పారిపోండి.[a] ఎందుకంటే నిశ్చయంగా నేను మీతో చెబుతున్నాను: మనుష్యకుమారుడు వచ్చే వరకు, ఇశ్రాయేలు పట్టణాలన్నిటిలో సంచరించే పనిని మీరు పూర్తి చేయనే చేయరు.[b][c]'
  rationale: 'The revision corrects the sole substantive Telugu problem: ‘తిరిగి’ is removed because it can imply returning rather than traversing. The new phrasing naturally conveys the contextual activity supplied by the English POB rendering (‘finish going through’) and preserves the Greek’s emphatic denial. Footnote b is correspondingly updated. The disputed referent of the Son of Man’s coming remains unresolved in the main text and note.'
