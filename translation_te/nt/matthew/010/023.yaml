id: MAT.10.23
reference: Matthew 10:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: te
  text: 'అయితే వారు ఈ పట్టణంలో మిమ్మల్ని హింసించినప్పుడల్లా, మరో పట్టణానికి పారిపోండి.[a] ఎందుకంటే నిశ్చయంగా నేను మీతో చెబుతున్నాను: మనుష్యకుమారుడు వచ్చే వరకు, ఇశ్రాయేలు పట్టణాలన్నిటిలో సంచరించే పనిని మీరు పూర్తి చేయనే చేయరు.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వేరొక పట్టణానికి పారిపోండి.’ గ్రీకులో అక్షరార్థంగా ‘మరొకదానికి’ అని ఉంది; ముందు వచ్చిన మాటనుబట్టి ‘పట్టణం’ అని అర్థం చేసుకోవాలి.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఇశ్రాయేలు పట్టణాలను మీరు పూర్తి చేయనే చేయరు.’ ‘పట్టణాలన్నిటిలో సంచరించే పనిని పూర్తి చేయడం’ అనే అనువాదం, సందర్భంలో సూచితమైన పట్టణాల గుండా సంచరించే సేవను స్పష్టం చేస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘మనుష్యకుమారుడు వచ్చే వరకు’ అనే మాట ఉద్దేశపూర్వకంగా వివరణకు తెరిచి ఉంచబడింది. ఇది యేసు సమర్థించబడటాన్నా, తీర్పులో ఆయన రావడాన్నా, లేక ఆయన చివరి రాకడనూ సూచిస్తుందా అనే విషయంలో వ్యాఖ్యాతలకు భిన్నాభిప్రాయాలు ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: హింసించినప్పుడల్లా
  rationale: ὅταν యొక్క అనిర్దిష్ట కాలార్థాన్ని, పునరావృతమయ్యే లేదా సంభవించగల సందర్భాన్ని ‘అప్పుడల్లా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διώκωσιν
  choice: హింసించినప్పుడు
  rationale: ఈ మిషన్ సందర్భంలో ఇది కేవలం వెంబడించడం కాక శత్రుత్వపూర్వకమైన హింసను సూచిస్తుంది.
- source_word: πόλει ταύτῃ
  choice: ఈ పట్టణంలో
  rationale: సమీప సూచనార్థకమైన ταύτῃ యొక్క ప్రత్యక్షతను నిలుపుతుంది.
- source_word: φεύγετε
  choice: పారిపోండి
  rationale: హింస ఎదురైనప్పుడు వెంటనే అక్కడి నుంచి వెళ్లిపోవాలనే ఆజ్ఞ యొక్క అత్యవసర బలాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: εἰς τὴν ἑτέραν
  choice: మరో పట్టణానికి
  rationale: ముందటి వాక్యభాగం నుంచి ‘పట్టణం’ అనే నామవాచకం అధ్యాహారంగా ఉంది; ἑτέραν ఇక్కడ మరొక పట్టణాన్ని సూచిస్తుంది.
- source_word: ἀμὴν
  choice: నిశ్చయంగా
  rationale: యేసు గంభీరమైన అధికారపూర్వక ప్రకటనను పరిచయం చేసే సూత్రప్రయోగాన్ని సాధారణ ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὐ μὴ τελέσητε
  choice: ముగించనే ముగించరు
  rationale: οὐ μή లోని బలమైన నిరాకరణను తెలుగు ద్విరుక్తి ద్వారా చూపుతుంది; సందర్భం వల్ల అధ్యాహారమైన పట్టణాల గుండా సంచరించే కార్యాన్ని ‘తిరిగి’ స్పష్టం చేస్తుంది.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: ఇశ్రాయేలు పట్టణాలను
  rationale: ఇశ్రాయేలులోని లేదా ఇశ్రాయేలు ప్రజలకు చెందిన పట్టణాలను సూచించే జనిటివ్ నిర్మాణాన్ని సూటిగా నిలుపుతుంది.
- source_word: ἕως ἂν ἔλθῃ
  choice: వచ్చే వరకు
  rationale: భవిష్యత్తులోని ఒక బిందువు వరకు ముందటి కార్యం పూర్తికాదని తెలిపే కాల నిర్మాణాన్ని సహజంగా అందిస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: తెలుగు బైబిలు భాషలో స్థిరపడిన బిరుదును ఉపయోగిస్తూ దాని పదార్థాన్నీ దానియేలు గ్రంథ సంబంధమైన ధార్మిక ప్రతిధ్వనినీ కాపాడుతుంది.
theological_decisions:
- issue: ‘మనుష్యకుమారుడు వచ్చే వరకు’ అనే మాటకు ఈ సందర్భంలో ఉన్న అర్థం
  choice: ‘మనుష్యకుమారుడు వచ్చే వరకు’ అని నిర్దిష్టీకరించకుండా యథాతథంగా ఉంచడం
  alternative: యెరూషలేముపై తీర్పులో రావడం; పునరుత్థానం లేదా సమర్థనలో రావడం; చివరి రాకడలో రావడం
  rationale: గ్రీకు వాక్యం ఏ సూచనను ఉద్దేశించిందో స్పష్టంగా తేల్చదు. అందువల్ల ఒక ప్రత్యేక అంత్యకాల వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చకుండా అసలు ధార్మిక ఉద్వేగం, సందిగ్ధత నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పారిపోండి’ ఆజ్ఞ యొక్క తీవ్రతను, ‘ముగించనే ముగించరు’ గ్రీకు బలమైన నిరాకరణను నిలుపుతాయి. వివాదాస్పదమైన రాకడ సూచనను ప్రధాన పాఠ్యం పరిష్కరించదు.
