review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the repeated/indefinite circumstance of persecution, the imperative to flee to another city, the emphatic future negation, and the deliberately unspecified coming of the Son of Man. However, ‘తిరిగి ముగించనే ముగించరు’ does not naturally express τελέσητε with the implied traversal of the cities; ‘తిరిగి’ ordinarily means ‘again/back,’ rather than ‘go through.’
  naturalness: Most of the verse is natural modern standard Telugu. Replacing the awkward and misleading ‘తిరిగి ముగించనే ముగించరు’ with ‘పట్టణాలన్నిటిలో సంచరించే పనిని ... పూర్తి చేయనే చేయరు’ gives clear, idiomatic Telugu while retaining the contextual implication made explicit in the English audit trail.
  terminology: ‘హింసించారు/హింసించినప్పుడల్లా,’ ‘పారిపోండి,’ ‘ఇశ్రాయేలు,’ and ‘మనుష్యకుమారుడు’ are suitable. ‘నిశ్చయంగా నేను మీతో చెబుతున్నాను’ appropriately represents the solemn ἀμὴν formula without importing an interpretation of the final clause.
  issues:
  - severity: medium
    issue: ‘తిరిగి ముగించనే ముగించరు’ is inaccurate and unnatural.
    rationale: In modern Telugu, ‘తిరిగి’ normally denotes returning or repetition, not traversing places. The Greek τελέσητε means ‘finish/complete’; in this mission context, the implied activity is going through the cities. The wording should state that activity naturally, without suggesting a return.
