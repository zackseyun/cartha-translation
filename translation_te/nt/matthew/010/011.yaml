id: MAT.10.11
reference: Matthew 10:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: te
  text: మీరు ఏ పట్టణంలోకి గానీ గ్రామంలోకి గానీ ప్రవేశించినా, అందులో యోగ్యుడు[a] ఎవరో విచారించి తెలుసుకోండి[b]. మీరు అక్కడి నుంచి బయలుదేరే వరకు అక్కడే ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘యోగ్యుడు’ అంటే దేవుని అనుగ్రహాన్ని సంపాదించుకున్నవాడు అని తప్పనిసరిగా కాదు; ఈ దూతలను స్వీకరించడానికి తగినవాడు లేదా సుముఖుడైనవాడు అనే భావం కావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆరా తీయండి,’ ‘పరిశీలించండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε
  choice: మీరు ఏ పట్టణంలోకి గానీ గ్రామంలోకి గానీ ప్రవేశించినా
  rationale: εἰς యొక్క దిశార్థాన్ని ‘లోకి’ తెలియజేస్తుంది; ἄνతో కూడిన అనిర్దిష్ట సంబంధవాక్యాన్ని సహజమైన తెలుగు ‘ఏ…గానీ…ప్రవేశించినా’ రూపంలో అందిస్తుంది. πόλις, κώμη మధ్య ఉన్న పెద్ద–చిన్న నివాసప్రాంతాల భేదాన్ని ‘పట్టణం’, ‘గ్రామం’ నిలుపుతాయి.
- source_word: ἐξετάσατε
  choice: విచారించి తెలుసుకోండి
  rationale: ఈ ఆజ్ఞ కేవలం అడగడమే కాక జాగ్రత్తగా ఆరా తీసి నిర్ధారించుకోవడాన్ని సూచిస్తుంది. ‘విచారించి తెలుసుకోండి’ ఆధునిక తెలుగులో సహజంగా ఉండి ఉద్దేశపూర్వక పరిశీలన భావాన్ని నిలుపుతుంది.
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: అందులో యోగ్యుడు ఎవరో
  rationale: ἐν αὐτῇ ముందుగా చెప్పిన పట్టణం లేదా గ్రామాన్ని సూచిస్తుంది. ἄξιοςలోని అర్హత/తగినతనం అనే మూల్యాంకన భావాన్ని ‘యోగ్యుడు’ నిలుపుతుంది; అది ఏ విధమైన యోగ్యతయో ప్రధాన వాక్యంలో అతిగా నిర్వచించదు.
- source_word: κἀκεῖ μείνατε
  choice: అక్కడే ఉండండి
  rationale: κἀκεῖలోని స్థలసూచనను, μείνατεలోని కొనసాగి ఉండాలనే ఆజ్ఞను సంక్షిప్తంగా, సహజంగా అందిస్తుంది. గ్రీకు వాక్యంలో ‘ఇల్లు’ అనే పదం లేనందున దానిని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: ἕως ἂν ἐξέλθητε
  choice: మీరు అక్కడి నుంచి బయలుదేరే వరకు
  rationale: ἕως ἄνతో కూడిన భవిష్యత్ పరిమితిని ‘వరకు’ స్పష్టంగా తెలియజేస్తుంది. ἐξέρχομαι యొక్క బయటకు వెళ్లడం/వీడిపోవడం భావాన్ని ‘బయలుదేరే’ సహజంగా వ్యక్తం చేస్తుంది; ‘అక్కడి నుంచి’ తెలుగులో అవసరమైన స్థలసంబంధ స్పష్టతను ఇస్తుంది.
theological_decisions:
- issue: మిషనరీ సూచనల్లో ἄξιος (‘యోగ్యుడు’) యొక్క భావం
  choice: ప్రధాన పాఠ్యంలో ‘యోగ్యుడు’ అని ఉంచి, సందర్భంలో దూతలను స్వీకరించడానికి తగిన లేదా సుముఖుడైన వ్యక్తి అనే అవకాశాన్ని పాదటిప్పణిలో వివరించడం.
  alternative: దీనిని నేరుగా ‘స్వీకరించడానికి సుముఖుడైనవాడు’ లేదా ‘తగినవాడు’ అని అనువదించడం; లేదా విస్తృత నైతిక అర్హతగా అర్థం చేసుకోవడం.
  rationale: సందర్భం ఆతిథ్యం ఇచ్చే వ్యక్తిని గుర్తించడం గురించినదైనా, ἄξιοςలో మూల్యాంకన విస్తృతి ఉంది. ‘యోగ్యుడు’ ఆ ఉద్వేగాన్ని నిలుపుతుంది; పాదటిప్పణి దీనిని దేవుని అనుగ్రహాన్ని సంపాదించినవాడని అనవసరంగా సిద్ధాంతీకరించకుండా సందర్భోచిత భావాన్ని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘పట్టణం లేదా గ్రామం’ అనే కృత్రిమ నిర్మాణం బదులు ‘ఏ పట్టణంలోకి గానీ గ్రామంలోకి గానీ’ సహజ తెలుగు అనిర్దిష్టతను అందిస్తుంది. మూలంలో లేని ‘అతని ఇంట్లో’ అనే వివరణను చేర్చకుండా ‘అక్కడే’ అని ఉంచి స్థలసూచనలోని స్వల్ప అనిశ్చితిని కాపాడింది.
