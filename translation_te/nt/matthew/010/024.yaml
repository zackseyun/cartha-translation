id: MAT.10.24
reference: Matthew 10:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: te
  text: శిష్యుడు బోధకునికంటే మించినవాడు కాదు; దాసుడు[a] తన యజమానికంటే[b] మించినవాడు కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సేవకుడు’; గ్రీకు δοῦλος సందర్భాన్ని బట్టి దాసుడు లేదా సేవకుడు అని అర్థం కావచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘ప్రభువు’; అయితే ఇక్కడ గ్రీకు κύριος ఈ ఉపమానంలో మానవ యజమానిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: శిష్యుడు
  rationale: సువార్తల సందర్భంలో μαθητής సూచించే బోధకునితో సంబంధం, నేర్చుకోవడం, అనుసరించడం అనే భావాలను ‘శిష్యుడు’ సహజంగా నిలుపుతుంది.
- source_word: ὑπέρ
  choice: మించినవాడు
  rationale: ఇక్కడ accusativeతో వచ్చిన ὑπέρ హోదాలో లేదా గొప్పతనంలో మరొకరిని అధిగమించడాన్ని సూచిస్తుంది; ‘మించినవాడు’ ఈ తులనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διδάσκαλος
  choice: బోధకుడు
  rationale: ‘బోధకుడు’ διδάσκαλος యొక్క సాధారణ అర్థాన్ని స్పష్టంగా ఇస్తూ, తరువాతి యజమాని–దాసుడు జంటతో గందరగోళం కలగనివ్వదు.
- source_word: δοῦλος
  choice: దాసుడు
  rationale: κύριοςతో ఉన్న జంటలో ఆధీనత మరియు యజమాని కిందనున్న సామాజిక స్థితి ప్రధానంగా ఉన్నాయి; ‘దాసుడు’ ఆ బలాన్ని ‘సేవకుడు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: κύριος
  choice: యజమాని
  rationale: ఇక్కడ κύριος దైవిక బిరుదుగా కాక, దాసునిపై అధికారం గల మానవ యజమానిని సూచిస్తుంది; అందువల్ల ‘యజమాని’ సందర్భానుసారంగా స్పష్టమైన పదం.
- source_word: αὐτοῦ
  choice: తన
  rationale: ఈ సర్వనామం దాసునికి చెందిన యజమాని అనే సంబంధాన్ని సూచిస్తుంది; తెలుగులో reflexive ‘తన’ ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οὐδέ
  choice: కాదు;
  rationale: మొదటి ప్రతికూల తులనకు రెండవదాన్ని సమాంతరంగా జతచేస్తుంది; తెలుగులో సెమీకోలన్ తరువాత అదే ‘కాదు’ నిర్మాణాన్ని పునరావృతం చేయడం సహజంగా, స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: దైవికేతర సామాజిక ఉపమానంలో δοῦλος అనువాదం
  choice: దాసుడు
  alternative: సేవకుడు
  rationale: ఈ వాక్యంలో శిష్యుడు–బోధకుడు, దాసుడు–యజమాని అనే హోదా తులనలు ఉన్నాయి. యజమాని కింద బంధితమైన లేదా సంపూర్ణంగా ఆధీనమైన స్థితిని ‘దాసుడు’ బలంగా నిలుపుతుంది; విస్తృత ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: దైవికేతర గృహసంబంధ సందర్భంలో κύριος అనువాదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: κύριος కొన్ని సందర్భాల్లో దైవిక బిరుదైన ‘ప్రభువు’ను సూచించినా, ఇక్కడ δοῦλοςతో జతగా మానవ అధిపతిని సూచిస్తుంది. కాబట్టి ‘యజమాని’ ఉపమానంలోని సామాజిక సంబంధాన్ని అపార్థం లేకుండా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన సమాంతర వాక్యనిర్మాణం వాడబడింది. ‘మించినవాడు’ హోదా/గొప్పతన తులనను సహజంగా తెలియజేస్తుంది. రెండు పాదటిప్పణి సూచికలూ సంబంధిత ప్రధాన పదాల వెంట ఉంచబడ్డాయి.
