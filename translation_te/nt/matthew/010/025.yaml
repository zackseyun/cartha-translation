id: MAT.10.25
reference: Matthew 10:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: te
  text: శిష్యుడు తన గురువులా, బానిస తన యజమానిలా కావడం చాలు. ఇంటి యజమానిని బయెల్జెబూలు[a] అని పిలిచారంటే, అతని ఇంటివారిని ఇంకెంత ఎక్కువగా అలా పిలిచివుంటారు!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బయెల్జెబూబు’; సంప్రదాయంలో సుపరిచితమైన ప్రత్యామ్నాయ రూపం.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρκετὸν
  choice: చాలు
  rationale: సరిపోవడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: μαθητῇ
  choice: శిష్యుడు
  rationale: కేవలం విద్యార్థి అనే అర్థం కాకుండా, గురువును అనుసరించి నేర్చుకునే సంబంధాన్ని నిలుపుతుంది.
- source_word: ἵνα γένηται
  choice: అయితే
  rationale: ἀρκετόν‌తో కలిసిన ఈ నిర్మాణంలోని ‘అలా కావడం సరిపోతుంది’ అనే భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: διδάσκαλος
  choice: బోధకుడు
  rationale: μαθητής‌తో ఉన్న బోధన సంబంధాన్ని స్పష్టంగా చూపిస్తూ, తరువాతి κύριος‌కు వాడిన ‘యజమాని’తో గందరగోళం రానివ్వదు.
- source_word: δοῦλος
  choice: బానిస
  rationale: κύριος‌తో ఉన్న సామాజిక హోదా వ్యత్యాసాన్ని, ఆధీన బంధాన్ని ‘సేవకుడు’ కంటే స్పష్టంగా నిలుపుతుంది.
- source_word: κύριος
  choice: యజమాని
  rationale: ఇక్కడ ప్రత్యక్ష దైవిక బిరుదు కాకుండా బానిస–యజమాని గృహసంబంధ ఉపమానం ఉన్నందున సందర్భోచితంగా ఉంది.
- source_word: οἰκοδεσπότην
  choice: ఇంటి యజమాని
  rationale: ఇంటిపై అధికారం కలిగిన వ్యక్తి అనే సమాసపద భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: Βεελζεβοὺλ
  choice: బయెల్జెబూలు
  rationale: SBLGNTలోని గ్రీకు రూపాన్ని తెలుగులో లిప్యంతరీకరిస్తుంది; సంప్రదాయ ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: ἐπεκάλεσαν
  choice: అని పిలిచారు
  rationale: ఒకరికి అవమానకరమైన పేరు పెట్టి సంబోధించడం అనే సందర్భార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: πόσῳ μᾶλλον
  choice: ఇంకెంతగా
  rationale: తక్కువదాని నుంచి ఎక్కువదానికి తీసుకెళ్లే గ్రీకు తారతమ్య వాదబలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οἰκιακοὺς
  choice: ఇంటివారు
  rationale: బానిసలకే పరిమితం కాకుండా ఆ గృహానికి చెందిన వారందరినీ సూచించే విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: గృహసంబంధ ఉపమానంలో κύριος అనువాదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: δοῦλος‌తో ప్రత్యక్షంగా జతపడిన సామాజిక గృహసంబంధ సందర్భమే ఇక్కడ ప్రధానంగా ఉంది; ‘ప్రభువు’ అని పెడితే మూలవాక్యం ముందుకు తేవని ప్రత్యక్ష క్రీస్తుసంబంధ బిరుదు భావం బలపడవచ్చు.
- issue: δοῦλος అనువాదం
  choice: బానిస
  alternative: సేవకుడు
  rationale: ఈ వాక్యంలో యజమానితో హోదాపరమైన వ్యత్యాసం స్పష్టంగా ఉన్నందున ఆధీన బంధాన్ని తెలిపే ‘బానిస’ను ఎంచుకున్నాం.
- issue: చివరి ఉపవాక్యంలో విడిచిపెట్టబడిన క్రియ
  choice: అలా పిలుస్తారో అని భావానుగుణంగా క్రియను పునరుద్ధరించడం
  alternative: అతని ఇంటివారిని ఇంకెంత ఎక్కువగా!
  rationale: గ్రీకులో క్రియ సందర్భం వల్ల అధ్యాహారంగా ఉంది. తెలుగులో అర్థం సహజంగా పూర్తయ్యేందుకు ‘అలా పిలుస్తారో’ను చేర్చినా, కొత్త కార్యాన్ని ప్రవేశపెట్టకుండా ముందటి క్రియనే పునరుద్ధరించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. సమాంతర నిర్మాణాన్ని మొదటి వాక్యంలో నిలిపి, చివరి గ్రీకు క్రియారహిత ఉపవాక్యాన్ని తెలుగులో అర్థవంతంగా పూర్తి చేశాం. పాదసూచిక గుర్తును అది వివరించే ‘బయెల్జెబూలు’ పదానికే జత చేశాం.
