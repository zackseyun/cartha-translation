id: MAT.10.37
reference: Matthew 10:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: te
  text: తండ్రినిగాని తల్లినిగాని నాకంటే ఎక్కువగా ప్రేమించేవాడు నాకు తగినవాడు కాడు[a]. మరియు కుమారునినిగాని కుమార్తెనిగాని నాకంటే ఎక్కువగా ప్రేమించేవాడు నాకు తగినవాడు కాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నాకంటే పైగా.’ గ్రీకు పదబంధం ὑπὲρ ἐμέ యేసు కంటే మరొకరిని ఎక్కువగా ప్రేమించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: ప్రేమించేవాడు
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతం, ఈ చర్యతో గుర్తించబడే ఎవరినైనా సాధారణ ఏకవచనంలో సూచిస్తుంది. ‘ప్రేమించేవాడు’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: πατέρα ἢ μητέρα
  choice: తండ్రినిగాని తల్లినిగాని
  rationale: గ్రీకులో స్వామ్యసూచక పదం లేదు. తెలుగులో అదనంగా ‘తన’ అని చేర్చకుండా బంధుత్వ పదాలను నేరుగా ఉంచడం మూలానికి సమీపంగా ఉంటుంది; ‘గాని...గాని’ ప్రత్యామ్నాయ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπὲρ ἐμέ
  choice: నాకంటే ఎక్కువగా
  rationale: ఈ తులనాత్మక సందర్భంలో ὑπέρ యేసుకంటే మరొకరికి ఎక్కువ ప్రేమ లేదా ప్రాధాన్యం ఇవ్వడాన్ని సూచిస్తుంది. ‘నాకంటే ఎక్కువగా’ ఈ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: నాకు తగినవాడు కాడు
  rationale: ἄξιος + జనిటివ్ నిర్మాణంలోని యోగ్యత/తగినతనం భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. ‘నాకు పాత్రుడు కాడు’ కంటే ఇది సాధారణ పాఠకులకు స్పష్టంగా ఉండి, శిష్యత్వానికి అనర్హత అనే కఠిన తీర్పును నిలుపుతుంది.
- source_word: καὶ
  choice: రెండవ సమాంతర వాక్యంగా
  rationale: గ్రీకు καὶ రెండు సమాంతర ప్రకటనలను కలుపుతుంది. తెలుగులో వరుసగా రెండు వాక్యాలుగా ఉంచడం సహజ ప్రవాహాన్ని ఇస్తుంది; కలయిక భావం సందర్భంలో స్పష్టంగానే ఉంటుంది.
- source_word: υἱὸν ἢ θυγατέρα
  choice: కుమారునినిగాని కుమార్తెనిగాని
  rationale: మూలంలో లేని స్వామ్యసూచకాన్ని చేర్చకుండా బంధుత్వ పదాలను నేరుగా అనువదిస్తుంది. గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు పదజాలం ఉపయోగించబడింది.
theological_decisions:
- issue: కుటుంబ ప్రేమతో పోల్చినప్పుడు యేసుకు ఇవ్వవలసిన ప్రాధాన్యం
  choice: యేసుకంటే తల్లిదండ్రులను లేదా పిల్లలను ఎక్కువగా ప్రేమించకూడదనే అత్యున్నత విధేయత డిమాండును నేరుగా నిలుపడం
  alternative: కుటుంబాన్ని ద్వేషించాలనే భావంగా విస్తరించడం, లేదా ‘యేసును కూడా అంతే ప్రేమించాలి’ అని డిమాండును మృదువుచేయడం
  rationale: ὑπὲρ ἐμέ స్పష్టమైన తులనాత్మక ప్రాధాన్యాన్ని తెలియజేస్తుంది. వాక్యం కుటుంబ ప్రేమ మంచిది కాదని చెప్పదు; అత్యంత సన్నిహిత కుటుంబ బంధాలకన్నా యేసుకు ప్రథమ స్థానం ఉండాలని చెబుతుంది. కాబట్టి దానిని బలపరచకుండానూ బలహీనపరచకుండానూ అనువదించబడింది.
- issue: οὐκ ἔστιν μου ἄξιος లోని యోగ్యత తీర్పు
  choice: ‘నాకు తగినవాడు కాడు’
  alternative: ‘నాకు చెందినవాడిగా ఉండలేడు’ లేదా ‘నా శిష్యుడు కాడు’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: మూలం ‘యోగ్యుడు/తగినవాడు’ అనే తీర్పును ఇస్తుంది; చెందినతనం లేదా శిష్యత్వాన్ని ప్రత్యక్షంగా చేర్చదు. అందువల్ల మూలంలోని గంభీరతను, కొంత విస్తృతమైన భావపరిధిని అలాగే ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యంలోని గంభీరతను నిలుపుతూ ‘ప్రేమించేవాడు,’ ‘తగినవాడు కాడు’ వంటి సహజమైన పదప్రయోగాలు వాడబడ్డాయి. రెండు సమాంతర భాగాల పునరుక్తి ఉద్దేశపూర్వకంగా నిలుపబడింది.
