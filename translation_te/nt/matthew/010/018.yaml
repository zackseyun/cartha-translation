id: MAT.10.18
reference: Matthew 10:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: te
  text: అంతేకాక, నా కారణంగా మిమ్మల్ని పాలకుల ముందుకూ రాజుల ముందుకూ తీసుకువెళ్తారు; ఇది వారికీ[b], అన్యజనులకూ[a] సాక్ష్యంగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జనాలకూ” లేదా “దేశాలకూ.”
    reason: lexical_alternative
  - marker: b
    text: సందర్భాన్ని బట్టి “వారికి వ్యతిరేకంగా” అని కూడా అర్థం చేసుకోవచ్చు; అయితే గ్రీకు దత్తివిభక్తి స్వయంగా ఆ భావాన్ని స్పష్టంగా చెప్పదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας ... καὶ βασιλεῖς
  choice: పాలకుల ముందుకూ రాజుల ముందుకూ
  rationale: ἀχθήσεσθεతో కూడిన ἐπί + ద్వితీయావిభక్తి, కేవలం వారి వైపుకు తీసుకెళ్లడాన్ని కాక అధికారుల సమక్షంలో హాజరుపరచడాన్ని సూచిస్తుంది. ‘పాలకులు’ ఆధునిక తెలుగులో ἡγεμόναςకు సహజమైన విస్తృత పదం; ‘రాజులు’ βασιλεῖςను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἀχθήσεσθε
  choice: మిమ్మల్ని ... తీసుకువెళ్తారు
  rationale: ఇది ἄγω యొక్క భవిష్యత్ కర్మణి రూపం. న్యాయాధికారుల సమక్షానికి బలవంతంగా హాజరుపరచబడే భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలో స్పష్టంగా లేని హింసను ‘ఈడ్చుకెళ్తారు’ అని చేర్చదు.
- source_word: ἕνεκεν ἐμοῦ
  choice: నా కారణంగా
  rationale: ἕνεκεν + షష్ఠీవిభక్తి కారణాన్ని సూచిస్తుంది. యేసుతో వారి సంబంధమే ఈ పరిణామానికి కారణమని స్పష్టంగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εἰς μαρτύριον
  choice: సాక్ష్యంగా
  rationale: ఈ సందర్భంలో εἰς ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. శిష్యులు అధికారుల ముందు హాజరుకావడం సాక్ష్యంగా పనిచేస్తుందనే నామవాచక భావాన్ని ‘సాక్ష్యంగా’ నిలుపుతుంది.
- source_word: αὐτοῖς
  choice: వారికీ
  rationale: దత్తివిభక్తిలోని ఈ సర్వనామం సహజంగా ముందున్న పాలకులు, రాజులను సూచిస్తుంది. అది వారికి అందే సాక్ష్యమా లేక వారికి వ్యతిరేక సాక్ష్యమా అన్నది గ్రీకు రూపం తేల్చదు; అందువల్ల తటస్థమైన ‘వారికీ’ మూలంలోని సందిగ్ధతను కాపాడుతుంది.
- source_word: τοῖς ἔθνεσιν
  choice: అన్యజనులకూ
  rationale: మత్తయి సందర్భంలో ἔθνη తరచుగా ఇశ్రాయేలేతర ప్రజలను సూచిస్తుంది. ‘అన్యజనులు’ ఆ భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; ‘దేశాలు/జనాలు’ అనే విస్తృత అర్థసాధ్యతను పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: μαρτύριον αὐτοῖς యొక్క భావం
  choice: తటస్థంగా ‘వారికీ ... సాక్ష్యంగా’
  alternative: ‘వారికి వ్యతిరేకంగా సాక్ష్యంగా’
  rationale: αὐτοῖς అనే గ్రీకు దత్తివిభక్తి స్వయంగా ప్రతికూలతను నిర్దేశించదు. తటస్థ అనువాదం, ఈ సాక్ష్యం వారికి సందేశంగా ఉండవచ్చునా లేక వారి తిరస్కారానికి వ్యతిరేక సాక్ష్యంగా నిలవవచ్చునా అనే వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘అంతేకాక’ మూలంలోని καὶ ... δὲ అనుసంధానాన్ని సహజంగా చూపుతుంది. వాక్యాన్ని తెలుగు ప్రవాహం కోసం రెండు ఖండాలుగా అమర్చి, మూలంలోని కారణం, న్యాయసమక్షం, సాక్ష్యం అనే సంబంధాలను నిలిపాం.
