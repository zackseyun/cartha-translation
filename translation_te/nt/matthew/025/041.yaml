revisions:
- from: 'అప్పుడు ఆయన ఎడమవైపున ఉన్నవారితో కూడా ఇలా అంటాడు: “శపించబడినవారలారా,[a] నా దగ్గరనుండి వెళ్లిపోండి. అపవాది కోసం, అతని దూతల కోసం సిద్ధం చేయబడిన నిత్య అగ్నిలోకి వెళ్లండి.”'
  to: 'అప్పుడు ఆయన ఎడమవైపున ఉన్నవారితో కూడా ఇలా చెబుతాడు: “శపించబడినవారలారా,[a] నా నుండి వెళ్లిపోండి; అపవాది కోసమూ అతని దూతల కోసమూ సిద్ధం చేయబడిన నిత్యాగ్నిలోకి వెళ్లండి.”'
  rationale: The revision explicitly reflects the future verb ἐρεῖ, improves the elevated modern Telugu register, and makes the coordinated phrase 'for the devil and his angels' more idiomatic without altering the Greek syntax, referents, or theological scope.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-16T05:45:02Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the judgment sequence, the group at the left, the imperative separation from the speaker, the cursed addressees, entry into the eternal fire, and its preparation for the devil and his angels. A revision is warranted because the Greek future ἐρεῖ is more faithfully represented by an explicit Telugu future, rather than present-tense అంటాడు.
  naturalness: The wording is generally clear, but నా దగ్గరనుండి is comparatively colloquial for this solemn register, and the repeated కోసం construction is less smooth than a coordinated Telugu expression. The revised phrasing is modern standard Telugu while retaining the force of the direct address.
  terminology: నిత్యాగ్ని, అపవాది, and దూతలు appropriately convey αἰώνιον, διάβολος, and ἄγγελοι in this eschatological context. శపించబడినవారలారా preserves the passive participial force and direct address; the footnote supplies the concise alternative శాపగ్రస్తులారా.
  issues:
  - severity: medium
    issue: Explicit future tense is not represented
    rationale: ἐρεῖ is future ('he will say'). Telugu అంటాడు can be contextually future, but చెబుతాడు states the source tense clearly and naturally.
  - severity: low
    issue: Register and coordination can be smoothed
    rationale: నా నుండి is more fitting than the colloquial నా దగ్గరనుండి in this solemn pronouncement, and అపవాది కోసమూ అతని దూతల కోసమూ expresses the two coordinated datives more naturally.
  revised_text: 'అప్పుడు ఆయన ఎడమవైపున ఉన్నవారితో కూడా ఇలా చెబుతాడు: “శపించబడినవారలారా,[a] నా నుండి వెళ్లిపోండి; అపవాది కోసమూ అతని దూతల కోసమూ సిద్ధం చేయబడిన నిత్యాగ్నిలోకి వెళ్లండి.”'
  revised_footnotes:
