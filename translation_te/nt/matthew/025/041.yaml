id: MAT.25.41
reference: Matthew 25:41
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: te
  text: 'అప్పుడు ఆయన ఎడమవైపున ఉన్నవారితో కూడా ఇలా చెబుతాడు: “శపించబడినవారలారా,[a] నా నుండి వెళ్లిపోండి; అపవాది కోసమూ అతని దూతల కోసమూ సిద్ధం చేయబడిన నిత్యాగ్నిలోకి వెళ్లండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “శాపగ్రస్తులారా.”
    reason: οἱ κατηραμένοι అనే కర్మణి సంబోధనకు సంక్షిప్తమైన సహజ తెలుగు ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: తీర్పు దృశ్యంలో సంఘటనల క్రమాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἐρεῖ
  choice: అంటాడు
  rationale: భవిష్యత్ భావం తెలుగు సందర్భంలో సహజంగా వ్యక్తమవుతుంది; మాటకు మూలంలో లేని అదనపు తీవ్రతను చేర్చదు.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: ఎడమవైపున ఉన్నవారితో
  rationale: ముందటి సందర్భంలో రాజుకు ఎడమవైపు నిలిచిన సమూహాన్ని స్పష్టంగా సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: నా దగ్గరనుండి వెళ్లిపోండి
  rationale: వక్త సన్నిధి నుండి తొలగిపోవాలనే ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἱ κατηραμένοι
  choice: శపించబడినవారలారా
  rationale: పరిపూర్ణ కర్మణి కృదంతంలోని భావాన్ని, ప్రత్యక్ష సంబోధనను నిలుపుతుంది.
- source_word: εἰς τὸ πῦρ τὸ αἰώνιον
  choice: నిత్య అగ్నిలోకి
  rationale: εἰς సూచించే లోపలికి గమనాన్ని ‘లోకి’తో, αἰώνιον భావాన్ని ‘నిత్య’తో సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τὸ ἡτοιμασμένον
  choice: సిద్ధం చేయబడిన
  rationale: ముందే సిద్ధపరచబడి ఇప్పుడు ఆ స్థితిలో ఉన్నదనే పరిపూర్ణ కర్మణి భావాన్ని కాపాడుతుంది.
- source_word: τῷ διαβόλῳ
  choice: అపవాది కోసం
  rationale: ఇక్కడ διάβολος సాతానుకు స్థిరమైన వ్యక్తిగత నామవాచకంగా వాడబడింది; ‘అపవాది’ తెలుగు బైబిలు వాడుకలో స్పష్టమైన సమానార్థకం.
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: అతని దూతల కోసం
  rationale: అంత్యకాల తీర్పు సందర్భంలో అపవాదికి చెందిన అతీంద్రియ దూతలను సూచిస్తుంది; మూలంలోని సంబంధాన్ని యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: తీర్పు సందర్భంలో αἰώνιον అనువాదం
  choice: నిత్య
  alternative: యుగసంబంధమైన / యుగకాలం ఉండే
  rationale: ఈ సందర్భంలో సాధారణ కొయినే ప్రయోగం ‘నిత్య’ అనే అర్థాన్నే బలపరుస్తుంది. తీర్పు స్వరూపంపై మూలానికి మించిన సిద్ధాంత వివరణను చేర్చలేదు.
- issue: διάβολος మరియు ἄγγελοι పదాల సూచన
  choice: అపవాది మరియు అతని దూతలు
  alternative: నిందకుడు మరియు అతని సందేశకులు
  rationale: అంత్యకాల తీర్పు సందర్భంలో ఇవి సాతానును, అతనితో సంబంధమున్న అతీంద్రియ ప్రాణులను సూచించే స్థిర ప్రయోగాలు; సాధారణ మానవ సందేశకులుగా అనువదించడం సందర్భాన్ని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రత్యక్ష తీర్పు వాక్యంగా రూపొందించబడింది. ‘నా దగ్గరనుండి వెళ్లిపోండి’ సాధారణ పాఠకులకు సహజంగా ఉండగా, ‘నిత్య అగ్ని,’ ‘అపవాది,’ ‘దూతలు’ అనే పదాలు మూలంలోని ధార్మిక మరియు అంత్యకాల సందర్భాన్ని కాపాడుతాయి.
