id: MAT.25.24
reference: Matthew 25:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: te
  text: 'అప్పుడు ఒక తలాంతు పొందినవాడు కూడా వచ్చి ఇలా అన్నాడు: “ప్రభువా, నీవు కఠినమైన మనిషివని నాకు తెలుసు[a]. నీవు విత్తని చోట కోస్తావు; నీవు చల్లిన చోటు నుంచి కూడబెట్టుకుంటావు[b].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కఠినమైన’కు బదులుగా ‘కఠోరమైన’ అని కూడా అనువదించవచ్చు. గ్రీకు σκληρός అనే పదానికి గట్టి, కఠినమైన, తీవ్రమైన అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నీవు చల్లిన చోటు నుంచి కూడబెట్టుకుంటావు.’ ఇక్కడ ఏమి చల్లాడో గ్రీకు వాక్యంలో స్పష్టంగా చెప్పలేదు; సందర్భం విత్తనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν δὲ καὶ
  choice: అప్పుడు ... కూడా వచ్చి
  rationale: δέ కథనాన్ని ముందుకు నడిపిస్తుండగా, καί ఇతనిని ముందుగా వచ్చిన సేవకులతో కలుపుతుంది. προσελθώνను సహజమైన తెలుగు కథనశైలిలో ‘వచ్చి’ అని అనువదించాం.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: ఒక తలాంతు పొందినవాడు
  rationale: కర్తను అతడు పొందిన దాని ఆధారంగా గుర్తించే గ్రీకు participial నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది. సందర్భంలో ముందే పొందినది స్పష్టంగా ఉన్నందున తెలుగు సహజత్వం కోసం ‘పొందినవాడు’ వాడాం.
- source_word: τάλαντον
  choice: తలాంతు
  rationale: ఇది పురాతన బరువు/ధన ప్రమాణానికి సంబంధించిన మూలపదాన్ని, ఉపమానంలోని పదసంబంధాన్ని కాపాడుతుంది; ‘బంగారు సంచి’ వంటి అతివివరణను నివారిస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: గౌరవపూర్వక ప్రత్యక్ష సంబోధనను సహజమైన తెలుగులో అందిస్తుంది; ఉపమానంలో యజమానిని ఉద్దేశించినప్పటికీ κύριος యొక్క విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: ἔγνων σε ὅτι
  choice: నీవు ... మనిషివని నాకు తెలుసు
  rationale: తెలుగులో సహజమైన పరోక్ష వాక్య నిర్మాణాన్ని వాడుతూ, సేవకుడు యజమాని స్వభావం గురించి చేస్తున్న జ్ఞానదావాను స్పష్టంగా తెలియజేస్తుంది.
- source_word: σκληρὸς
  choice: కఠినమైన
  rationale: ‘గట్టి,’ ‘కఠోరమైన,’ ‘నిర్దయమైన’ వంటి భావాలకు తెరచి ఉన్న σκληρός యొక్క తీవ్రతను అతిగా పెంచకుండా, కాఠిన్య భావాన్ని నిలుపుతుంది.
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: నీవు విత్తని చోట కోస్తావు
  rationale: విత్తడం–కోయడం అనే వ్యవసాయ ప్రతిరూపాన్ని, వర్తమాన స్వభావవర్ణనను కాపాడుతుంది.
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: నీవు చల్లని చోట నుంచి సమకూర్చుకుంటావు
  rationale: συνάγωను ‘సమకూర్చుకుంటావు’గా, διασκορπίζωను కర్మను చేర్చకుండా ‘చల్లని’గా ఇచ్చాం. ὅθενలోని ‘నుంచి’ భావాన్ని స్పష్టంగా నిలిపాం.
theological_decisions:
- issue: ఉపమానంలోని సంబోధనలో κύριος అనువాదం
  choice: ప్రభువా
  alternative: యజమానీ
  rationale: ఇక్కడ సేవకుడు తన యజమానిని సంబోధిస్తున్నా, ‘ప్రభువా’ గౌరవసంబోధనను మరియు κύριος పదంలోని విస్తృత ప్రతిధ్వనిని నిలుపుతుంది; ‘యజమానీ’ సందర్భాన్ని మరింత నిర్దిష్టంగా చేస్తుంది.
- issue: యజమాని స్వభావంపై సేవకుని ఆరోపణ
  choice: సేవకుని మాటగానే ‘కఠినమైన మనిషి’ అని నేరుగా ఉంచడం
  alternative: ‘కఠోరుడు’ లేదా ‘నిర్దయుడు’ అని మరింత వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: ఈ వచనం సేవకుని అభిప్రాయాన్ని నివేదిస్తుంది; దాన్ని అనువాదం సమర్థించకూడదు లేదా మృదువుచేయకూడదు. ‘కఠినమైన’ అనే పదం ఆ వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే కథనశైలి వాడబడింది. వ్యవసాయ రూపకాన్ని నిలుపుతూ, మూలంలో లేని ‘విత్తనం’ అనే కర్మను ప్రధాన పాఠ్యంలో చేర్చలేదు. ప్రత్యక్ష ప్రసంగంలో సహజమైన తెలుగు వాక్యక్రమం కోసం లక్షణవర్ణనను రెండు సమతుల్య వాక్యాలుగా ఇచ్చాం.
