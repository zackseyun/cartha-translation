revisions:
- from: అతని యజమాని[b] అతనితో, “భళా! మంచి, నమ్మకమైన సేవకుడా[a]! కొద్ది వాటిలో నమ్మకంగా ఉన్నావు; అనేక వాటిపై నిన్ను నియమిస్తాను. నీ యజమాని ఆనందంలోకి ప్రవేశించు” అన్నాడు.
  to: అతని యజమాని[b] అతనితో, “బాగా చేశావు! మంచి, నమ్మకమైన సేవకుడా[a]! కొన్ని విషయాలపై నీవు నమ్మకంగా ఉన్నావు; అనేక విషయాలపై నిన్ను నియమిస్తాను. నీ యజమాని ఆనందంలోకి ప్రవేశించు” అన్నాడు.
