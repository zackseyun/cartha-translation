id: MAT.25.21
reference: Matthew 25:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: te
  text: అతని యజమాని[b] అతనితో, “బాగా చేశావు! మంచి, నమ్మకమైన సేవకుడా[a]! కొన్ని విషయాలపై నీవు నమ్మకంగా ఉన్నావు; అనేక విషయాలపై నిన్ను నియమిస్తాను. నీ యజమాని ఆనందంలోకి ప్రవేశించు” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దాసుడా.” గ్రీకు పదం δοῦλος (దూలొస్) సందర్భాన్ని బట్టి సేవకుడిని లేదా దాసుడిని సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: గ్రీకు κύριος (క్యూరియొస్) పదాన్ని “ప్రభువు” అని కూడా అనువదించవచ్చు; అయితే ఈ ఉపమానంలోని సేవకుడు–యజమాని సంబంధానికి “యజమాని” సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను పరిచయం చేసే సాధారణ కథన క్రియగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: κύριος
  choice: యజమాని
  rationale: ఉపమానంలోని సేవకుడు–యజమాని సంబంధాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది; ఇక్కడ నేరుగా క్రీస్తు బిరుదును చేర్చదు.
- source_word: δοῦλε
  choice: సేవకుడా
  rationale: తెలుగులో ఈ ఉపమాన సందర్భానికి సహజంగా ఉండి, యజమాని అనే పదంతో అధీన సంబంధాన్ని నిలుపుతుంది; ‘దాసుడా’ అనే సాధ్యమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: Εὖ
  choice: భళా!
  rationale: ప్రశంసను తెలిపే εὖకు సంక్షిప్తమైన, సహజమైన తెలుగు అభినందన.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: మంచి, నమ్మకమైన
  rationale: రెండు విశేషణాల వేర్వేరు భావాలను, వాటి ప్రశంసాత్మక సమన్వయాన్ని నిలుపుతుంది.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: కొద్ది వాటిలో నమ్మకంగా ఉన్నావు
  rationale: అప్పగించిన పరిమిత బాధ్యతల పరిధిలో విశ్వసనీయతను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: అనేక వాటిపై నిన్ను నియమిస్తాను
  rationale: καθίστημι సూచించే బాధ్యతకు నియామకాన్ని, ὀλίγα–πολλῶν మధ్య సమాంతర వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: ఆనందంలోకి ప్రవేశించు
  rationale: ప్రవేశించడమనే మూల రూపకాన్ని సమతలీకరించకుండా స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ఉపమాన పాత్ర దేవుడు లేదా క్రీస్తును సూచించవచ్చనే నేపథ్యంలో κύριος అనువాదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: తక్షణ కథా సందర్భంలో ఇది సేవకుని యజమానిని సూచిస్తుంది. ‘యజమాని’ కథా స్థాయి సంబంధాన్ని కాపాడుతూ, పాఠ్యం నేరుగా పలకని క్రీస్తు బిరుదును అనువాదంలో ముందుగానే నిర్ణయించదు.
- issue: ఈ సందర్భంలో δοῦλος అనువాదం
  choice: సేవకుడు
  alternative: దాసుడు
  rationale: ‘సేవకుడు’ ఆధునిక తెలుగులో సహజంగా ఉండగా, మూలపదంలోని బంధిత లేదా అధీన స్థితి భావం పూర్తిగా కనిపించకుండా పోవచ్చు; అందుకే ‘దాసుడు’ ప్రత్యామ్నాయాన్ని పాదసూచికలో స్పష్టపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘భళా’ ప్రశంసా స్వరాన్ని సహజంగా అందిస్తుంది. మూలంలోని ‘కొద్ది/అనేక’ సమాంతర నిర్మాణం, ‘ఆనందంలోకి ప్రవేశించు’ అనే రూపకం నిలుపబడ్డాయి.
