review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately reflects the Greek: the master''s speech, the paired commendation, faithfulness in lesser responsibilities, appointment over greater responsibilities, and the imperative to enter the master''s joy are all preserved. A small revision makes the responsibility sense of ἐπὶ ὀλίγα / ἐπὶ πολλῶν more explicit and idiomatic in Telugu.'
  naturalness: The wording is generally clear modern standard Telugu. “భళా!” is intelligible but somewhat literary/dated for the requested modern standard register; “బాగా చేశావు!” is a more natural equivalent for the commendation formula. “కొద్ది వాటిలో” and “అనేక వాటిపై” are understandable but vague; “కొన్ని విషయాలపై” / “అనేక విషయాలపై” reads more naturally in this context.
  terminology: “యజమాని” appropriately renders κύριος within the parable without forcing the title “ప్రభువు.” “సేవకుడు” is suitable for δοῦλος here, with “దాసుడు” retained as a legitimate lexical alternative in the footnote. “నమ్మకమైన” consistently conveys πιστός.
  issues:
  - severity: low
    issue: The expression “భళా!” is more literary than contemporary.
    rationale: It is not incorrect, but “బాగా చేశావు!” is more natural modern Telugu for εὖ in this commendation.
  - severity: low
    issue: “కొద్ది వాటిలో” / “అనేక వాటిపై” are somewhat underspecified and not fully parallel.
    rationale: The Greek contrast concerns entrusted areas of responsibility. “కొన్ని విషయాలపై” and “అనేక విషయాలపై” preserves that contrast with clearer, parallel Telugu phrasing.
