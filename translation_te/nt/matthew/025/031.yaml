id: MAT.25.31
reference: Matthew 25:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: te
  text: అయితే మనుష్యకుమారుడు తన మహిమలో, దేవదూతలందరితో కలిసి వచ్చినప్పుడు, అప్పుడు ఆయన తన మహిమగల సింహాసనంపై కూర్చుంటాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν
  choice: వచ్చినప్పుడు
  rationale: భవిష్యత్తులో జరిగే ఒక నిర్దిష్ట సంఘటనను సూచించే కాలవాచక ఉపవాక్యంగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి మాట నుంచి తదుపరి దృశ్యానికి మార్పును, స్వల్ప వ్యత్యాస భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: మనుష్యకుమారుడు
  rationale: యేసు ఉపయోగించిన స్థిరమైన బిరుదును, దానియేలు గ్రంథంతో ఉన్న అంతర్గ్రంథ సంబంధాన్ని కాపాడుతుంది.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: తన మహిమతో
  rationale: ప్రత్యక్షమయ్యే రాజసిక వైభవం, ఘనత అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ బైబిలు పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: πάντες οἱ ἄγγελοι μετ’ αὐτοῦ
  choice: దేవదూతలందరితో కలిసి
  rationale: గ్రీకులో ఉన్న ‘దేవదూతలందరూ ఆయనతో’ అనే సహవాస భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది; మూలంలో లేని ‘ఆయన దేవదూతలు’ అనే స్వామ్యార్థాన్ని చేర్చదు.
- source_word: τότε
  choice: అప్పుడు
  rationale: రాక తరువాత జరిగే కార్యక్రమాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: καθίσει
  choice: కూర్చుంటాడు
  rationale: భవిష్య కార్యాన్ని తెలుగులో సహజంగా తెలిపే ప్రత్యక్ష రూపం; ‘ఆసీనుడవుతాడు’ కంటే సాధారణ పాఠకులకు సులభం.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: తన మహిమగల సింహాసనం మీద
  rationale: సింహాసనం ఆయన మహిమతో లక్షణీకరించబడిందనే భావాన్ని ఆధునిక తెలుగులో సహజంగా అందిస్తుంది; గ్రీకు షష్ఠీ నిర్మాణానికి దగ్గరైన రూపం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου అనే క్రీస్తు సంబంధిత బిరుదు
  choice: మనుష్యకుమారుడు
  alternative: మానవుడు
  rationale: స్థిరపడిన బైబిలు బిరుదును ఉంచడం ద్వారా దానియేలు 7 నేపథ్యాన్ని, మెస్సీయ మరియు న్యాయాధిపతి సంబంధిత భావభారాన్ని వివరణాత్మకంగా కుదించకుండా కాపాడుతుంది.
- issue: θρόνου δόξης αὐτοῦ అనే షష్ఠీ నిర్మాణం
  choice: తన మహిమగల సింహాసనం
  alternative: తన మహిమ యొక్క సింహాసనం
  rationale: ప్రధాన పాఠంలో సహజమైన ఆధునిక తెలుగు వాడుతూ, మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచి మూలంలోని నిర్మాణం మరియు సాధ్యమైన భావసూక్ష్మతను పారదర్శకంగా కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘మనుష్యకుమారుడు,’ ‘మహిమ,’ ‘సింహాసనం’ వంటి స్థిరమైన బైబిలు పదాలను నిలుపుతూ, అతిగా గ్రాంథికమైన క్రియారూపాలను నివారించింది.
