- from: 'అప్పుడు రాజు తన కుడివైపున ఉన్నవారితో ఇలా అంటాడు: “రండి, నా తండ్రిచేత ఆశీర్వదించబడినవారలారా,[a] లోకానికి పునాది వేయబడినప్పటి నుండి[b] మీ కోసం సిద్ధపరచబడిన రాజ్యాన్ని వారసత్వంగా పొందండి.”'
  to: 'అప్పుడు రాజు తన కుడివైపున ఉన్నవారితో ఇలా చెబుతాడు: “రండి, నా తండ్రిచేత ఆశీర్వదించబడినవారలారా,[a] లోకపు పునాది నుండి[b] మీ కోసం సిద్ధపరచబడిన రాజ్యాన్ని వారసత్వంగా పొందండి.”'
  rationale: భవిష్యత్ క్రియను తెలుగులో స్పష్టంగా చూపడానికి ‘ఇలా అంటాడు’ స్థానంలో ‘ఇలా చెబుతాడు’ వాడబడింది. καταβολῆς κόσμουకు స్థిరమైన, సహజమైన తెలుగు రూపంగా ‘లోకపు పునాది నుండి’ వాడబడింది. పాదసూచికల గుర్తులు వాటి సంబంధిత పదబంధాల వద్దనే ఉంచబడ్డాయి; అర్థంలో లేదా వేదాంతపరమైన సూచనలో మార్పు చేయబడలేదు.
