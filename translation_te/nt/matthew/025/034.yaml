id: MAT.25.34
reference: Matthew 25:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: te
  text: 'అప్పుడు రాజు తన కుడివైపున ఉన్నవారితో ఇలా చెబుతాడు: “రండి, నా తండ్రిచేత ఆశీర్వదించబడినవారలారా,[a] లోకపు పునాది నుండి[b] మీ కోసం సిద్ధపరచబడిన రాజ్యాన్ని వారసత్వంగా పొందండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా తండ్రి ఆశీర్వదించినవారలారా.”
    reason: షష్ఠీ విభక్తి మరియు కర్మణి కృదంతంలోని కర్త/మూల భావాన్ని తెలుగులో వ్యక్తం చేసే ప్రత్యామ్నాయ సహజ రూపం.
  - marker: b
    text: లేదా, “లోకపు పునాది వేయబడిన నాటి నుండి.”
    reason: ἀπόతో వచ్చిన కాలారంభ భావానికి సమానమైన తెలుగు ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: తీర్పు దృశ్యంలోని సంఘటనల క్రమాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἐρεῖ
  choice: ఇలా అంటాడు
  rationale: గ్రీకు భవిష్యత్ క్రియను తెలుగు ప్రవచన వర్ణనలో సహజంగా వినిపించే భవిష్యదర్థ వర్తమాన రూపంతో అందించింది; తరువాతి ప్రత్యక్ష వాక్యాన్ని ‘ఇలా’ స్పష్టంగా పరిచయం చేస్తుంది.
- source_word: ὁ βασιλεὺς
  choice: రాజు
  rationale: సందర్భంలో నిర్దిష్టమైన అంత్యకాల న్యాయాధిపతిని సూచించే బిరుదు; తెలుగులో ప్రత్యేక నామాల మాదిరి పెద్ద అక్షర భేదం లేదు.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: తన కుడివైపున ఉన్నవారితో
  rationale: స్థానాన్ని స్పష్టంగా ఉంచుతూ గ్రీకు ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Δεῦτε
  choice: రండి
  rationale: గంభీరమైన ఆహ్వానాన్ని తెలిపే బహువచన గౌరవపూర్వక ఆజ్ఞారూపం.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: నా తండ్రిచేత ఆశీర్వదించబడినవారలారా
  rationale: పరిపూర్ణ కర్మణి భావాన్ని, ఆశీర్వాదానికి మూలం లేదా కర్త అయిన తండ్రిని, సంబోధన రూపాన్ని నిలుపుతుంది.
- source_word: κληρονομήσατε
  choice: వారసత్వంగా పొందండి
  rationale: సాధారణంగా ‘తీసుకోండి’ అనకుండా, కుటుంబ మరియు ఒడంబడిక సంబంధమైన వారసత్వ భావాన్ని కాపాడుతుంది.
- source_word: τὴν ... βασιλείαν
  choice: రాజ్యాన్ని
  rationale: వారసత్వంగా పొందదగిన, సిద్ధపరచబడిన అంత్యకాల రాజ్య పరిధిని సూచించే సందర్భానికి సరిపోతుంది; ‘పాలన’ అనే సాధ్యమైన భావాన్ని సందర్భం ఇక్కడ తక్కువగా సూచిస్తుంది.
- source_word: ἡτοιμασμένην ὑμῖν
  choice: మీ కోసం సిద్ధపరచబడిన
  rationale: ఇప్పటికే పూర్తయి కొనసాగుతున్న ప్రాసంగికత గల సిద్ధపాటును సహజమైన కర్మణి రూపంలో తెలుపుతుంది.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: లోకానికి పునాది వేయబడినప్పటి నుండి
  rationale: ἀπό యొక్క ‘నుండి’ భావాన్ని, καταβολήలోని పునాది రూపకాన్ని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: τοῦ πατρός μου అనే షష్ఠీ విభక్తి ఆశీర్వాదపు మూలాన్ని లేదా కర్తను ఎలా సూచిస్తుంది
  choice: ‘నా తండ్రిచేత ఆశీర్వదించబడినవారలారా’ అని అనువదించడం
  alternative: ‘నా తండ్రి ఆశీర్వదించినవారలారా’ లేదా మరింత పదశః ‘నా తండ్రికి చెందిన ఆశీర్వదించబడినవారలారా’
  rationale: గ్రీకు షష్ఠీ ఆశీర్వాదం తండ్రి నుండి వచ్చిందని సహజంగా సూచిస్తుంది. కర్మణి రూపం మూలపాఠంలోని భావాన్ని నిలుపుతూ తెలుగులో కర్తను స్పష్టం చేస్తుంది.
- issue: వారసత్వ సందర్భంలో βασιλεία యొక్క అర్థం
  choice: ‘రాజ్యం’
  alternative: ‘పాలన’ లేదా ‘రాజరిక అధికారం’
  rationale: ‘వారసత్వంగా పొందండి’, ‘మీ కోసం సిద్ధపరచబడిన’ అనే మాటలతో కలిసి ఇది వారసత్వంగా లభించే అంత్యకాల రాజ్యాన్ని సూచిస్తుంది; అయినా దేవుని పాలన అనే విస్తృత భావాన్ని నిరాకరించదు.
- issue: ἀπὸ καταβολῆς κόσμου అనే కాలవాచక పదబంధం దేనితో అనుసంధానమవుతుంది
  choice: ‘మీ కోసం సిద్ధపరచబడిన’ అనే పదబంధంతో అనుసంధానించడం
  alternative: మొత్తం ఆహ్వానాన్ని సడలుగా విశేషిస్తున్నదిగా గ్రహించడం
  rationale: సమీప పదమైన ἡτοιμασμένηνతో అనుసంధానం వాక్యనిర్మాణపరంగా అత్యంత సహజం. రాజ్యం లోకానికి పునాది వేయబడినప్పటి నుండి సిద్ధపరచబడిందనే భావాన్ని ఇస్తుంది; దానికంటే విస్తృతమైన సిద్ధాంత వ్యవస్థను వాక్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘వారలారా’ అనే సంబోధన ఆహ్వానపు ఘనతను నిలుపుతుంది; మిగిలిన వాక్య నిర్మాణం అనవసరంగా ప్రాచీనంగా లేకుండా ఉంచబడింది. అన్ని పాదసూచిక గుర్తులు సంబంధిత ప్రధాన పాఠ్య స్థానాల్లో చేర్చబడ్డాయి.
