source:
  edition: SBLGNT
  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: te
  text: కాబట్టి అతని దగ్గరనుండి ఆ తలాంతును తీసుకొని, పది తలాంతులు ఉన్నవానికి ఇవ్వండి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తీసివేయండి.’ గ్రీకు ఆజ్ఞార్థక క్రియను ఈ రెండు విధాలుగా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘తలాంతు’ పెద్ద బరువు ప్రమాణం; దాని ఆధారంగా పెద్ద మొత్తపు ధనాన్ని కూడా ఈ పదం సూచించేది.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: తీసుకొని
  rationale: αἴρω యొక్క ఆజ్ఞార్థక రూపం ఇక్కడ ఒకరి దగ్గరనుండి దానిని తొలగించమనే ప్రత్యక్ష ఆజ్ఞ. ‘తీసుకొని’ సహజమైన తెలుగులో తదుపరి ‘ఇవ్వండి’తో సజావుగా కలుస్తుంది; ‘తీసివేయండి’ కూడా సాధ్యమే.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి తీర్పు ఆధారంగా వచ్చే నిర్ణయాన్ని సూచిస్తుంది. ‘కాబట్టి’ ఆ తార్కిక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀπ’ αὐτοῦ
  choice: అతని దగ్గరనుండి
  rationale: ἀπό + షష్ఠీ విభక్తి వేరుచేయడాన్ని సూచిస్తుంది. ఉపమానంలో ఇప్పుడే ఖండించబడిన వ్యక్తి దగ్గరనుండి తీసుకోవడం అనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὸ τάλαντον
  choice: ఆ తలాంతును
  rationale: τάλαντον పెద్ద బరువు ప్రమాణాన్నీ, దాని ఆధారంగా పెద్ద మొత్తపు ధనాన్నీ సూచించే చారిత్రక పదం. ‘ఆ’ గ్రీకు నిర్దిష్ట ఉపపదాన్ని, ముందుగా ప్రస్తావించిన నిర్దిష్ట తలాంతును సూచిస్తుంది.
- source_word: δότε
  choice: ఇవ్వండి
  rationale: δίδωμι యొక్క ఆజ్ఞార్థక రూపానికి ఇది సాధారణమైన, స్పష్టమైన తెలుగు సమానార్థకం; ఆజ్ఞ బలాన్ని నిలుపుతుంది.
- source_word: τῷ ἔχοντι
  choice: ఉన్నవానికి
  rationale: నామవాచకంగా పనిచేసే గ్రీకు కృదంతాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది; అనవసరంగా ‘వ్యక్తి’ అని చేర్చదు.
- source_word: τὰ δέκα τάλαντα
  choice: పది తలాంతులు
  rationale: కథలో ఇప్పటికే పేర్కొన్న నిర్దిష్ట మొత్తాన్ని సూచిస్తుంది. తెలుగులో సంఖ్యతో కూడిన ఈ నిర్మాణంలో ప్రత్యేక నిర్దేశం సందర్భం ద్వారానే స్పష్టమవుతుంది.
theological_decisions:
- issue: ఉపమాన సందర్భంలో τάλαντον అర్థం
  choice: సహజ సామర్థ్యం అని వ్యాఖ్యానించకుండా, చారిత్రక ధన/బరువు ప్రమాణమైన ‘తలాంతు’గా అనువదించడం.
  alternative: ‘పెద్ద మొత్తపు డబ్బు’ లేదా ‘ధనం’
  rationale: ఈ ఉపమానం అప్పగించబడిన ధనమూ దాని లెక్క అప్పగించడమూ గురించి ఉంది. చారిత్రక పదాన్ని ఉంచడం మూలంలోని సాంస్కృతిక రూపాన్ని కాపాడుతుంది; పాదటిప్పణి దాని అర్థాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని రెండు ఆజ్ఞలను నిలిపి, చారిత్రక పదమైన ‘తలాంతు’కు పాదటిప్పణి ద్వారా వివరణ ఇచ్చాం.
