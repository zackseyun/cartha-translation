source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: te
  text: నేను పరదేశిగా ఉన్నాను, మీరు నన్ను చేర్చుకోలేదు[a]; బట్టలు లేకుండా ఉన్నాను, మీరు నాకు బట్టలు వేయలేదు; నేను అనారోగ్యంతో ఉన్నాను, చెరసాలలో ఉన్నాను, మీరు నన్ను పరామర్శించలేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నన్ను లోపలికి తీసుకోలేదు’ / ‘నన్ను స్వీకరించలేదు.’ గ్రీకు క్రియకు పదశః ‘సమకూర్చడం’ అనే అర్థం ఉన్నా, ఇక్కడ పరదేశిని ఆతిథ్యంతో చేర్చుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘పరామర్శించడం’ అంటే కేవలం మర్యాద కోసం చూసి వెళ్లడం మాత్రమే కాదు; శ్రద్ధ చూపడం, పట్టించుకోవడం అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: పరదేశిగా
  rationale: ఇక్కడ తన ఇంటివారు లేదా సమాజానికి వెలుపల ఉండి ఆదరణ అవసరమైన వ్యక్తిని సూచిస్తుంది. ‘పరదేశి’ ఆ సామాజిక అసురక్షిత స్థితిని సహజంగా తెలియజేస్తుంది; కేవలం జాతిపరమైన ‘విదేశీయుడు’ అనే భావానికి పరిమితం చేయదు.
- source_word: συνηγάγετέ
  choice: చేర్చుకోలేదు
  rationale: συνάγω యొక్క మూలార్థం ‘సమకూర్చడం’; అయితే ξένοςతో కూడిన ఈ సందర్భంలో ఆతిథ్యంతో లోపలికి స్వీకరించడం అనే భావం ఉంది. ‘చేర్చుకోవడం’ స్వీకరణను, ఆశ్రయాన్ని రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: γυμνός
  choice: బట్టలు లేకుండా
  rationale: ఈ పదం పూర్తిగా నగ్నంగా ఉండడాన్నీ, తగిన వస్త్రాలు లేకపోవడాన్నీ సూచించగలదు. వెంటనే వచ్చే ‘బట్టలు వేయడం’ అనే చర్యకు సరిపోయేలా, తెలుగులో స్పష్టమైన సాధారణ ప్రయోగాన్ని ఎంచుకున్నాం.
- source_word: περιεβάλετέ
  choice: బట్టలు వేయలేదు
  rationale: పదశః ‘చుట్టూ వేయడం’ అనే భావం నుంచి వస్త్రాలు ధరింపజేయడం అనే అర్థం వస్తుంది. ‘బట్టలు వేయడం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: ἀσθενής
  choice: అనారోగ్యంతో
  rationale: ఈ విశేషణం సాధారణంగా ‘బలహీనుడు’ అని కూడా అర్థమివ్వగలిగినా, ఇక్కడ కరుణాకార్యాల జాబితాలో శారీరక అనారోగ్యమే అత్యంత సహజమైన భావం.
- source_word: ἐν φυλακῇ
  choice: చెరసాలలో
  rationale: φυλακή ఇక్కడ కాపలా స్థలాన్ని కాక నిర్బంధాన్ని సూచిస్తుంది. ‘చెరసాలలో’ గౌరవప్రదమైన, విస్తృతంగా అర్థమయ్యే తెలుగు రూపం.
- source_word: ἐπεσκέψασθέ
  choice: పరామర్శించలేదు
  rationale: ἐπισκέπτομαι కేవలం సామాజికంగా చూసి వెళ్లడమే కాక, శ్రద్ధతో వెళ్లి పరిస్థితి తెలుసుకోవడం, పట్టించుకోవడం అనే భావాన్ని కలిగి ఉంది. ‘పరామర్శించడం’ ఆ concrete visitను, శ్రద్ధను రెండింటినీ వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐπεσκέψασθέ με లోని కరుణతో కూడిన చర్య భావం
  choice: నన్ను పరామర్శించలేదు
  alternative: నన్ను చూడడానికి రాలేదు / నన్ను పట్టించుకోలేదు
  rationale: ‘పరామర్శించడం’ గ్రీకు పదం సూచించే ప్రత్యక్షంగా వెళ్లి చూడడాన్ని నిలుపుతూ, అది కేవలం మర్యాదపూర్వక సందర్శన కాక శ్రద్ధతో కూడిన చర్య అని కూడా తెలియజేస్తుంది. ‘పట్టించుకోవడం’ మాత్రమే అంటే ప్రత్యక్ష సందర్శన భావం కోల్పోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గంభీరమైన శైలిని ఉపయోగించాం. వరుసగా చెప్పబడిన నిర్లక్ష్య కరుణాకార్యాల లయను అర్ధవిరామాలతో నిలిపాం. మూలంలోని ‘అనారోగ్యంతో, చెరసాలలో’ అనే సంక్షిప్త సమన్వయాన్ని అతిగా విప్పకుండా ఉంచాం.
