review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the sequence of neglected merciful acts and preserves the hospitality nuance of συνηγάγετέ and the caring-visit nuance of ἐπεσκέψασθέ. However, “అనారోగ్యంతో, చెరసాలలో ఉన్నాను” can be read in Telugu as a single combined circumstance—being ill while in prison—whereas the Greek coordinates two circumstances, “sick and in prison.” Repeating “ఉన్నాను” safely preserves the coordinate structure without asserting whether the conditions coincided.
  naturalness: The register is modern, clear, and suitably dignified. “పరామర్శించలేదు” is natural in this context and conveys a concerned visit. The revised third clause is more idiomatic and syntactically unambiguous.
  terminology: “పరదేశిగా” and “చేర్చుకోలేదు” are defensible renderings of ξένος and συνηγάγετέ, with the footnote appropriately supplying the hospitality sense. “బట్టలు లేకుండా” and “బట్టలు వేయలేదు” are natural direct equivalents in modern Telugu. “చెరసాలలో” and “పరామర్శించలేదు” are appropriate formal-register choices.
  issues:
  - severity: medium
    issue: The illness and imprisonment clause is structurally compressed in a way that may imply one combined situation.
    rationale: Greek ἀσθενὴς καὶ ἐν φυλακῇ explicitly coordinates “sick” and “in prison.” In Telugu, “అనారోగ్యంతో, చెరసాలలో ఉన్నాను” can naturally be understood as “I was ill in prison.” Repeating the predicate maintains the source’s twofold coordination and does not decide whether they were simultaneous.
  revised_text: నేను పరదేశిగా ఉన్నాను, మీరు నన్ను చేర్చుకోలేదు[a]; బట్టలు లేకుండా ఉన్నాను, మీరు నాకు బట్టలు వేయలేదు; నేను అనారోగ్యంతో ఉన్నాను, చెరసాలలో ఉన్నాను, మీరు నన్ను పరామర్శించలేదు[b].
