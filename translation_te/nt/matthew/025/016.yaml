id: MAT.25.16
reference: Matthew 25:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: te
  text: ఐదు తలాంతులు[b] పొందినవాడు వెళ్లి, వాటితో పని చేసి[a], మరో ఐదు సంపాదించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వాటిని ఉపయోగించి వ్యాపారం చేశాడు’; గ్రీకు మాట డబ్బును లాభం కోసం క్రియాశీలంగా ఉపయోగించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: తలాంతు అనేది పెద్ద మొత్తాన్ని సూచించే ద్రవ్య ప్రమాణం; ఇక్కడ అది సహజ ప్రతిభను సూచించదు.
    reason: cultural_note
lexical_decisions:
- source_word: πορευθεὶς
  choice: వెళ్లి
  rationale: ముందుగా వెళ్లి, ఆ తరువాత డబ్బును ఉపయోగించిన చర్యల క్రమాన్ని సహజమైన తెలుగు అసమాపక క్రియతో తెలియజేస్తుంది; మూలంలో లేని ‘వెంటనే’ అనే భావాన్ని చేర్చదు.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: ఐదు తలాంతులు పొందినవాడు
  rationale: కర్తను అతడు పొందిన మొత్తాన్ని బట్టి గుర్తించే గ్రీకు కృదంత నిర్మాణాన్ని సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: τάλαντα
  choice: తలాంతులు
  rationale: పారంపరిక మూలపదాన్ని నిలుపుతుంది; ఇది సహజ ప్రతిభను కాక పెద్ద ద్రవ్య ప్రమాణాన్ని సూచిస్తుందని పాదసూచిక వివరిస్తుంది.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: వాటితో పని చేసి
  rationale: డబ్బును లాభం కోసం క్రియాశీలంగా ఉపయోగించాడనే విస్తృత భావాన్ని నిలుపుతుంది; ‘వ్యాపారం చేశాడు’ అని మరీ నిర్దిష్టంగా చేయదు.
- source_word: ἐκέρδησεν
  choice: సంపాదించాడు
  rationale: ఈ ఆర్థిక సందర్భంలో లాభంగా అదనపు మొత్తాన్ని పొందడాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἄλλα πέντε
  choice: మరో ఐదు
  rationale: అసలు మొత్తానికి అదనంగా అంతే మొత్తం వచ్చిందనే సంక్షిప్తమైన సహజ తెలుగు ప్రయోగం.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన కథన శైలి. ‘తలాంతులు’ అనే పరిచిత బైబిలు పదాన్ని ఉంచి, దాని ఆర్థిక అర్థాన్ని పాదసూచికలో స్పష్టం చేశాం.
