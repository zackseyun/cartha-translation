id: MAT.25.33
reference: Matthew 25:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/033.yaml
  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: te
  text: ఆయన గొర్రెలను తన కుడివైపున[b], మేకపిల్లలను[a] ఎడమవైపున నిలబెడతాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మేకలను.’ గ్రీకు పదం ముఖ్యంగా చిన్న మేకలను, అంటే మేకపిల్లలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా ‘తన కుడి వైపు నుండి ... ఎడమ వైపు నుండి’; ఇది కుడి వైపున, ఎడమ వైపున ఉంచడాన్ని తెలిపే ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: నిలబెడతాడు
  rationale: ἵστημι యొక్క భవిష్యత్ కర్తరి రూపం ఇక్కడ రెండు గుంపులను నిర్దిష్ట స్థానాల్లో నిలిచేలా చేయడం అనే సకర్మక భావాన్ని ఇస్తుంది. ‘నిలబెడతాడు’ ఆ దృశ్యాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πρόβατα
  choice: గొర్రెలను
  rationale: πρόβατα సాధారణంగా గొర్రెలను సూచిస్తుంది; ముందు వచనంలో ఇప్పటికే పరిచయమైన గుంపును ఇక్కడ సందర్భమే నిర్దిష్టం చేస్తుంది.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: తన కుడివైపున
  rationale: స్థాననిర్ణయ సందర్భంలో ఈ గ్రీకు ప్రయోగం ‘అతని కుడి వైపున’ అనే భావాన్ని ఇస్తుంది. కర్తనే సూచించే ‘తన’ తెలుగులో సహజంగా ఉంది.
- source_word: ἐρίφια
  choice: మేకపిల్లలను
  rationale: ἐρίφια అనేది ముఖ్యంగా చిన్న లేదా లేత వయసు మేకలను సూచిస్తుంది. ‘మేకపిల్లలు’ మూలపదంలోని వయస్సు ఛాయను కాపాడుతూ తెలుగులో స్పష్టంగా ఉంటుంది; విస్తృతార్థమైన ‘మేకలు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
- source_word: ἐξ εὐωνύμων
  choice: ఎడమవైపున
  rationale: ఈ స్థానసూచక గ్రీకు ప్రయోగం ‘ఎడమ వైపున’ అనే అర్థం ఇస్తుంది. αὐτοῦ రెండోసారి లేకపోయినా, తెలుగులో ముందు వచ్చిన ‘తన’ రెండు సమాంతర స్థానాలకు వర్తిస్తుందని సహజంగా అర్థమవుతుంది.
- source_word: μὲν ... δὲ
  choice: రెండు సమాంతర వాక్యభాగాల అమరిక
  rationale: μὲν ... δὲ రెండు గుంపుల మధ్య వ్యత్యాసాన్ని సూచిస్తుంది. తెలుగులో ‘గొర్రెలను... మేకపిల్లలను...’ అనే సమాంతర అమరికతోనే ఆ వ్యత్యాసం స్పష్టంగా ఉండటంతో అదనంగా ‘అయితే’ చేర్చలేదు.
theological_decisions:
- issue: కుడి, ఎడమ స్థానాలకు ఉన్న ప్రతీకాత్మక భావాన్ని అనువాదంలో విస్తరించాలా
  choice: స్థాననిర్ణయాన్ని మాత్రమే ‘తన కుడివైపున ... ఎడమవైపున’ అని అనువదించడం
  alternative: ‘అనుగ్రహ స్థానం ... అననుగ్రహ స్థానం’ వంటి వివరణాత్మక పదాలను చేర్చడం
  rationale: గ్రీకు వచనం నేరుగా రెండు గుంపుల భౌతిక స్థానాలను మాత్రమే పేర్కొంటుంది. సందర్భంలో వాటికి తీర్పుకు సంబంధించిన విలువ ఉన్నప్పటికీ, దానిని ప్రధాన పాఠ్యంలో విస్తరించడం మూలంలో లేని వ్యాఖ్యానాన్ని చేర్చినట్టవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ తీర్పు దృశ్యానికి తగిన గంభీరతను నిలిపాం. ఒకే క్రియను చివర ఉంచి రెండు గుంపుల సమాంతరతను, వ్యత్యాసాన్ని స్పష్టంగా చూపించాం.
