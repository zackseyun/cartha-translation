id: MAT.25.32
reference: Matthew 25:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: te
  text: సమస్త జనాలు[a] ఆయన ఎదుట సమకూర్చబడతారు; గొర్రెల కాపరి గొర్రెలను మేకల[b] నుండి వేరు చేసినట్లే, ఆయన వారిని పరస్పరం వేరు చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రజలందరూ”; గ్రీకులో అక్షరార్థంగా “సమస్త జనాలు” (πάντα τὰ ἔθνη).
    reason: lexical_alternative
  - marker: b
    text: ἐρίφων అనే గ్రీకు పదం మరింత నిర్దిష్టంగా “మేకపిల్లలు” అని కూడా అర్థమివ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: సమకూర్చబడతాయి
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, సమస్త జనాలు ఆయన ఎదుట కూడదీయబడతారనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కార్యసాధకుడిని వచనం చెప్పనందున చేర్చలేదు.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: ఆయన ఎదుట
  rationale: న్యాయతీర్పు సందర్భానికి తగిన గౌరవప్రదమైన, సహజమైన తెలుగు రూపం.
- source_word: πάντα τὰ ἔθνη
  choice: సమస్త జనాలు
  rationale: ἔθνη అనే పదంలోని ‘జనాలు/ప్రజాసమూహాలు’ అనే విస్తృత అర్థాన్ని నిలుపుతుంది; దానిని కేవలం అన్యజనులకు లేదా ఆధునిక రాజకీయ దేశాలకు పరిమితం చేయదు.
- source_word: ἀφορίσει
  choice: వేరు చేస్తాడు
  rationale: ఒక వర్గాన్ని మరొక వర్గం నుండి విభజించే చర్యను స్పష్టంగా, నేరుగా తెలియజేస్తుంది.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: వారిని ఒకరి నుండి ఒకరిని
  rationale: సమకూర్చబడిన వారిలో పరస్పర విభజన జరుగుతుందనే గ్రీకు నిర్మాణాన్ని సాధ్యమైనంత దగ్గరగా నిలుపుతుంది.
- source_word: ὥσπερ
  choice: చేసినట్లే
  rationale: ఉపమానాన్ని స్పష్టంగా సూచిస్తూ తెలుగు వాక్యప్రవాహంలో సహజంగా సరిపోతుంది.
- source_word: ὁ ποιμὴν
  choice: గొర్రెల కాపరి
  rationale: సాధారణ ఉదాహరణలోని కాపరిని సహజంగా సూచిస్తుంది; తెలుగు సందర్భంలో ‘కాపరి’ ఒక్కటే అస్పష్టంగా ఉండగలందున ‘గొర్రెల’ అని పేర్కొంది.
- source_word: τὰ πρόβατα
  choice: గొర్రెలను
  rationale: సమూహార్థక సాధారణీకరణకు బదులుగా మూలంలోని నిర్దిష్ట జంతు చిత్రాన్ని నిలుపుతుంది.
- source_word: τῶν ἐρίφων
  choice: మేకల నుండి
  rationale: గొర్రెలు–మేకలు అనే స్పష్టమైన వ్యత్యాసాన్ని సహజమైన తెలుగులో ఇస్తుంది; ఈ గ్రీకు పదం ప్రత్యేకంగా మేకపిల్లలను కూడా సూచించగలదనే విషయాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: πάντα τὰ ἔθνη యొక్క పరిధి
  choice: సమస్త జనాలు
  alternative: ప్రజలందరూ; అన్యజనులందరూ
  rationale: అంత్యకాల తీర్పులో ఎవరు చేర్చబడతారనే విషయాన్ని ఒక నిర్దిష్ట సిద్ధాంత పద్ధతికి అనుగుణంగా సంకుచితం చేయకుండా, గ్రీకు పదబంధంలోని విస్తృతిని మరియు నిజమైన అర్థసంభావ్యతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే పదప్రయోగం ఎంచుకోబడింది. కర్మణి నిర్మాణం, న్యాయతీర్పు దృశ్యం, కాపరి ఉపమానం నిలుపబడ్డాయి; అనవసరమైన మతపరమైన వివరణలు చేర్చబడలేదు.
