revisions:
- from: సమస్త జనాలు ఆయన ఎదుట సమకూర్చబడతాయి[a]. గొర్రెల కాపరి గొర్రెలను మేకల[b] నుండి వేరు చేసినట్లే, ఆయన వారిని ఒకరి నుండి ఒకరిని వేరు చేస్తాడు.
  to: సమస్త జనాలు[a] ఆయన ఎదుట సమకూర్చబడతారు; గొర్రెల కాపరి గొర్రెలను మేకల[b] నుండి వేరు చేసినట్లే, ఆయన వారిని పరస్పరం వేరు చేస్తాడు.
