id: MAT.25.18
reference: Matthew 25:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: te
  text: అయితే, ఒక తలాంతు పొందినవాడు వెళ్లి, నేల తవ్వి, తన యజమాని డబ్బును[a] దాచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత అక్షరార్థంగా, “తన యజమాని వెండిని.”
    reason: ἀργύριον అనే పదానికి ‘డబ్బు’తో పాటు ‘వెండి’ అనే అక్షరార్థం కూడా ఉంది.
lexical_decisions:
- source_word: ὁ δὲ
  choice: అయితే, ...వాడు
  rationale: δέ మునుపటి సేవకుల చర్యలకు ఇతని చర్యను వ్యతిరేకంగా చూపిస్తుంది; substantival article భావాన్ని తెలుగులో ‘...వాడు’ నిర్మాణం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ ἓν
  choice: ఒక తలాంతు
  rationale: గ్రీకులో ‘ఒకటి’ అని మాత్రమే ఉన్నా, మత్తయి 25:15 సందర్భంలో అది తలాంతును సూచిస్తుంది; స్పష్టత కోసం సందర్భసిద్ధమైన నామవాచకాన్ని చేర్చాం.
- source_word: λαβὼν
  choice: తీసుకున్నవాడు
  rationale: యజమాని అప్పగించినదాన్ని స్వీకరించిన భావం ఉంది. ‘తీసుకున్నవాడు’ సహజమైన తెలుగు; ప్రధాన చర్యలకు ముందే ఇది జరిగినదని సందర్భం తెలియజేస్తుంది.
- source_word: ἀπελθὼν
  choice: వెళ్లి
  rationale: తరువాతి చర్యలకు ముందు అతడు అక్కడి నుంచి వెళ్లిన క్రమాన్ని సంక్షిప్తమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: ὤρυξεν γῆν
  choice: నేల తవ్వి
  rationale: భూమిలో తవ్వడం అనే గ్రీకు భావాన్ని అదనంగా ‘గొయ్యి’ అని వ్యాఖ్యానించకుండా సహజంగా అందిస్తుంది.
- source_word: ἔκρυψεν
  choice: దాచిపెట్టాడు
  rationale: κρύπτω యొక్క దాచడం అనే భావాన్ని ఈ సందర్భంలో సహజంగా, ఉద్దేశపూర్వక చర్యగా వ్యక్తం చేస్తుంది.
- source_word: τὸ ἀργύριον
  choice: డబ్బును
  rationale: ἀργύριονకు ‘వెండి’ లేదా ‘డబ్బు’ అనే అర్థాలు ఉండవచ్చు. అప్పగించిన ధనం గురించిన ఈ సందర్భంలో ‘డబ్బు’ ఆధునిక పాఠకులకు స్పష్టం; ‘వెండి’ అనే అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: తన యజమాని
  rationale: కథలో κύριος సేవకుని మానవ అధిపతిని సూచిస్తుంది. ‘యజమాని’ ఆ సంబంధాన్ని సహజంగా తెలుపుతూ, ప్రత్యక్ష దైవబిరుదు అనే భావాన్ని అనవసరంగా చేర్చదు.
theological_decisions:
- issue: ఉపమాన కథలో మానవ అధిపతిని సూచించే κύριος అనువాదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: తక్షణ కథా సందర్భంలో ఇది సేవకుని మానవ అధిపతి. ‘యజమాని’ సామాజిక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది; ఉపమానం యొక్క విస్తృత ఆధ్యాత్మిక అన్వయాన్ని నిరాకరించకుండానే వాక్యంలోని ప్రత్యక్ష సూచనను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా మరియు కథన గంభీరత నిలిచేలా రూపొందించబడింది. మూలంలోని క్రియాక్రమం ‘వెళ్లి, నేల తవ్వి, ... దాచిపెట్టాడు’గా నిలుపబడింది. పాదసూచిక గుర్తు సంబంధిత ‘డబ్బును’ పదం వెంట ఉంచబడింది.
