id: MAT.25.20
reference: Matthew 25:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: te
  text: ఐదు తలాంతులు[b] పొందినవాడు ముందుకు వచ్చి, మరో ఐదు తలాంతులు తెచ్చి, “ప్రభువా[a], మీరు నాకు ఐదు తలాంతులు అప్పగించారు; ఇదిగో, నేను మరో ఐదు తలాంతులు సంపాదించాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “యజమానీ.” గ్రీకు: “క్యూరియోస్.”'
    reason: alternative_reading
  - marker: b
    text: తలాంతు అనేది పెద్ద మొత్తాన్ని సూచించే ద్రవ్య ప్రమాణం.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: ముందుకు వచ్చి
  rationale: యజమాని ఎదుట లెక్క అప్పగించడానికి సమీపించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: ఐదు తలాంతులు పొందినవాడు
  rationale: ప్రధాన క్రియకు ముందు అతడు వాటిని పొందిన విషయాన్ని కృదంత నిర్మాణంతో సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని ‘మనిషి’ అనే పదాన్ని చేర్చదు.
- source_word: τάλαντα
  choice: తలాంతులు
  rationale: మూలంలోని పెద్ద ద్రవ్య/బరువు ప్రమాణాన్ని సంప్రదాయబద్ధమైన మూలపద రూపంలో నిలుపుతుంది; దాని సాంస్కృతిక అర్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: προσήνεγκεν
  choice: తెచ్చి
  rationale: అదనంగా సంపాదించిన మొత్తాన్ని యజమాని ఎదుటకు తీసుకురావడాన్ని సూటిగా తెలుపుతుంది; ఆరాధన సంబంధమైన ‘అర్పించాడు’ అనే భావాన్ని నివారిస్తుంది.
- source_word: ἄλλα πέντε τάλαντα
  choice: మరో ఐదు తలాంతులు
  rationale: ముందు ఇచ్చిన మొత్తానికి సమానమైన అదనపు మొత్తాన్ని మూలంలోని పునరుక్తికి దగ్గరగా వ్యక్తం చేస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριος అనే సంబోధనను స్థిరంగా అనువదిస్తూ, ఉపమానంలోని యజమాని భావాన్నీ మత్తయి కథనంలోని విస్తృత ప్రతిధ్వనినీ నిలుపుతుంది.
- source_word: παρέδωκας
  choice: అప్పగించారు
  rationale: ‘చేతికి ఇచ్చారు/అప్పగించారు’ అనే మూలభావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సందర్భంలో బాధ్యతతో ఇచ్చిన భావం కూడా స్పష్టమవుతుంది.
- source_word: ἴδε
  choice: ఇదిగో
  rationale: ఎదుట ఉన్న ఫలితంపై దృష్టి పెట్టించే గ్రీకు అవ్యయానికి సహజమైన తెలుగు సంభాషణా సమానం.
- source_word: ἐκέρδησα
  choice: సంపాదించాను
  rationale: పెట్టుబడితో అదనపు లాభం పొందిన భావాన్ని సహజంగా తెలియజేస్తుంది; వేతనంగా ‘ఆర్జించడం’ అనే భావానికి పరిమితం చేయదు.
theological_decisions:
- issue: ఉపమానంలోని సంబోధనలో κύριος అనువాదం
  choice: ప్రభువా
  alternative: యజమానీ
  rationale: ఈ సందర్భంలో పదం సేవకుని యజమానిని సూచించినప్పటికీ, ‘ప్రభువా’ అనేది మూలపదంతో స్థిరత్వాన్ని, మత్తయి సువార్తలో ఉండగల విస్తృత కథన-దైవశాస్త్రీయ ప్రతిధ్వనిని కాపాడుతుంది; ఈ ఒక్క వచనంలో ఆ ప్రతిధ్వనిని బలవంతంగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. సేవకుడు యజమానిని సంబోధిస్తున్నందున ఏకవచన గ్రీకు రూపాన్ని తెలుగులో గౌరవార్థక ‘మీరు’తో వ్యక్తం చేశాం. పాదటిప్పణి సూచికలను వాటి అసలు విషయాలకు సరిపోయే పదాల దగ్గర ఉంచాం.
