source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀμὴν λέγω ὑμῖν, οὐκ οἶδα ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/012.yaml
  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: te
  text: 'అయితే అతడు జవాబిచ్చాడు: “నిశ్చయంగా నేను మీతో చెబుతున్నాను, నాకు మీరు తెలియరు.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేను మిమ్మల్ని గుర్తుపట్టను.” గ్రీకులో అక్షరార్థంగా “నేను మిమ్మల్ని ఎరుగను”; సందర్భంలో ఇది సంబంధపూర్వకంగా గుర్తించడానికి నిరాకరించడాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: అయితే అతడు వారికి జవాబిచ్చాడు
  rationale: గ్రీకు కృదంతం-క్రియ కలయికను సహజమైన ఆధునిక తెలుగులో ఒకే క్రియగా వ్యక్తం చేశాం. δέ ముందటి విజ్ఞప్తికి ఉన్న వ్యత్యాసాన్ని ‘అయితే’తో సూచిస్తుంది; సందర్భంలోని స్త్రీల సమూహాన్ని బట్టి ‘వారికి’ స్పష్టతనిస్తుంది.
- source_word: Ἀμὴν
  choice: నిశ్చయంగా
  rationale: సువార్తల్లో గంభీరమైన ధృవీకరణగా వచ్చే Ἀμήν భావాన్ని సాధారణ పాఠకులకు పారదర్శకమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: λέγω ὑμῖν
  choice: నేను మీతో ... చెబుతున్నాను
  rationale: ప్రత్యక్ష సంబోధననూ ప్రకటనలోని గంభీరతనూ సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: οὐκ οἶδα
  choice: నాకు తెలియదు
  rationale: οἶδα యొక్క ప్రాథమిక అర్థమైన ‘తెలుసు’ను నిలుపుతూ, సందర్భంలో ఉండగల సంబంధపూర్వక నిరాకరణ లేదా గుర్తించకపోవడం అనే భావాన్ని ప్రధాన పాఠ్యంలో అతిగా నిర్దిష్టం చేయదు.
- source_word: ὑμᾶς
  choice: మీరు ఎవరో
  rationale: తెలుగులో వ్యక్తులను ఉద్దేశించి ‘I do not know you’ అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. ‘మీరు’ సందర్భానుసారం బహువచన సంబోధనగా ఉంటుంది.
theological_decisions:
- issue: ఉపమానంలో ‘నేను మిమ్మల్ని ఎరుగను’ అనే మాట యొక్క బలం
  choice: ‘మీరు ఎవరో నాకు తెలియదు’ అనే సరళమైన, సంబంధపూర్వకంగా బరువైన మాటను ఉంచడం
  alternative: ‘నేను మిమ్మల్ని గుర్తుపట్టను’ లేదా ‘మీతో నాకు ఏ సంబంధమూ లేదు’
  rationale: ఈ మాట సందర్భంలో వెలివేతను, సంబంధపూర్వక నిరాకరణను సూచించగలదు. అయితే రక్షణ గురించి వాక్యానికి మించిన సిద్ధాంత వివరణను ప్రధాన పాఠ్యంలో చేర్చకుండా గ్రీకు పాఠంలోని ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సహజమైనదిగా, గంభీరంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. ప్రత్యక్ష సంభాషణలోని గంభీరతను నిలుపుతూ, పాతకాలపు ‘నిశ్చయముగా/ఎరుగను’ రూపాలను ప్రధాన పాఠ్యంలో నివారించాం.
