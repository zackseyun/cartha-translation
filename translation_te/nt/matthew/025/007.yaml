  text: τότε ἠγέρθησαν πᾶσαι αἱ παρθένοι ἐκεῖναι καὶ ἐκόσμησαν τὰς λαμπάδας ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: te
  text: అప్పుడు ఆ కన్యలందరూ లేచి, తమ దీపాలను సిద్ధం చేసుకున్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దివిటీలను.” గ్రీకు పదం చేతిలో తీసుకెళ్లగల వెలుగు సాధనాన్ని, దీపాన్ని లేదా దివిటీని, సూచించవచ్చు; నూనెను, వాటిని సిద్ధం చేయడాన్ని ప్రస్తావించిన ఈ సందర్భంలో రెండు అర్థాలూ సాధ్యమే.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: కథలో తదుపరి సంఘటనను సూచించే సహజమైన కాలసూచక పదం.
- source_word: ἠγέρθησαν
  choice: లేచి
  rationale: నిద్ర లేదా విశ్రాంతి స్థితి నుంచి లేవడాన్ని సందర్భానుసారంగా సహజంగా తెలియజేస్తుంది; ‘మేల్కొల్పబడ్డారు’ అనే సాధ్యార్థాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: ఆ కన్యలందరూ
  rationale: πᾶσαι, ἐκεῖναι భావాలను సహజమైన తెలుగు పదక్రమంలో ఉంచుతూ, παρθένοι యొక్క నిర్దిష్ట అర్థాన్ని నిలుపుతుంది.
- source_word: ἐκόσμησαν
  choice: సరిచేసుకున్నారు
  rationale: దీపాలను ఉపయోగానికి సిద్ధం చేయడానికి వాటిని క్రమపరచడం అనే సందర్భార్థాన్ని తెలియజేస్తుంది; వత్తులను కత్తిరించారనే వివరాన్ని మూలపాఠం కంటే ఎక్కువగా నిర్దిష్టం చేయదు.
- source_word: λαμπάδας
  choice: దీపాలను
  rationale: నూనె మరియు సిద్ధపరచడం ఉన్న సమీప సందర్భంలో సహజమైన ఎంపిక; ‘కాగడాలు’ కూడా సాధ్యమైనందున పాదసూచికలో ఇచ్చాం.
- source_word: ἑαυτῶν
  choice: తమ
  rationale: కర్తలకే చెందినవని తెలిపే బహువచన ఆత్మవాచక స్వామ్యాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. ‘సరిచేసుకున్నారు’ అనే పదం కొస్మెఓ యొక్క ‘క్రమపరచి సిద్ధం చేయడం’ అనే భావాన్ని నిలుపుతూ, వత్తి కత్తిరించడం వంటి మూలంలో లేని వివరాన్ని చేర్చదు.
