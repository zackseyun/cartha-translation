  verdict: revise
  source_fidelity: The draft accurately represents the sequence (τότε), all of the specified virgins, their rising, the reflexive possession, and the lamp/torch lexical ambiguity. However, “సరిచేసుకున్నారు” commonly suggests repairing or correcting the lamps, whereas ἐκόσμησαν here means arranging/preparing them for use.
  naturalness: The sentence is otherwise natural modern standard Telugu. Replacing “సరిచేసుకున్నారు” with “సిద్ధం చేసుకున్నారు” gives a clearer, idiomatic contextual sense without adding a specific action such as trimming wicks.
  terminology: “కన్యలు,” “దీపాలు,” and “తమ” appropriately preserve the source terms and register. The footnote alternative is more idiomatically expressed as “దివిటీలు” and should describe λαμπάς as a portable light source rather than defining it narrowly as a handheld lamp.
  issues:
  - severity: medium
    issue: “సరిచేసుకున్నారు” for ἐκόσμησαν
    rationale: In contemporary Telugu this can naturally mean ‘repaired/fixed,’ which is not the action denoted here. The Greek conveys putting the lamps in order or making them ready.
  - severity: low
    issue: Footnote wording for the lexical alternative
    rationale: “కాగడాలు” is less precise and less idiomatic in this explanatory context than “దివిటీలు”; the explanation should retain the lexical ambiguity without implying a fixed physical form.
  revised_text: అప్పుడు ఆ కన్యలందరూ లేచి, తమ దీపాలను సిద్ధం చేసుకున్నారు[a].
