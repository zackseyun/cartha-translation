id: MAT.25.6
reference: Matthew 25:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: te
  text: 'అయితే అర్ధరాత్రివేళ ఒక కేక వినిపించింది[a]: “ఇదిగో[b], వరుడు! అతణ్ణి కలుసుకోవడానికి బయటికి రండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒక అరుపు వినిపించింది.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “చూడండి, వరుడు!”
    reason: lexical_alternative
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: అయితే అర్ధరాత్రివేళ
  rationale: μέσης νυκτός కాలాన్ని సూచించే జాతీయ ప్రయోగం; ‘అర్ధరాత్రివేళ’ సహజమైన ఆధునిక తెలుగు. δέ కథనంలో స్వల్ప మలుపు లేదా వ్యత్యాసాన్ని సూచిస్తున్నందున ‘అయితే’గా అనువదించబడింది.
- source_word: κραυγὴ γέγονεν
  choice: ఒక కేక వినిపించింది
  rationale: γέγονεν ఇక్కడ ఒక సంఘటన అకస్మాత్తుగా చోటుచేసుకోవడాన్ని తెలియజేస్తుంది. ‘ఒక కేక వినిపించింది’ అనేది తెలుగులో సహజంగా ఉండి ప్రకటన అకస్మాత్తుగా వినిపించిన భావాన్ని కాపాడుతుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: ἰδού శ్రద్ధను ఆకర్షించే సూచక పదం. ‘ఇదిగో’ ఆధునిక తెలుగులో సహజంగా ఉండి దాని ప్రత్యక్ష సూచనాబలాన్ని నిలుపుతుంది.
- source_word: ὁ νυμφίος
  choice: వరుడు
  rationale: νυμφίος వివాహ సందర్భంలోని bridegroom‌ను సూచిస్తుంది. ‘వరుడు’ సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగు పదం; ఉపమానంలోని వివాహ దృశ్యాన్ని నిలుపుతుంది.
- source_word: ἐξέρχεσθε
  choice: బయటికి రండి
  rationale: ఈ ఆజ్ఞ ‘బయటికి వెళ్లండి/రండి’ అనే అర్థం ఇస్తుంది. పిలుపు వింటున్నవారి దృష్టికోణంలో ‘బయటికి రండి’ సహజమైన ప్రత్యక్ష ఆహ్వానం.
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: అతణ్ణి కలుసుకోవడానికి
  rationale: εἰς ἀπάντησιν అనే జాతీయ ప్రయోగం ఎవరినైనా కలుసుకోవడానికి ఎదురుగా వెళ్లడాన్ని సూచిస్తుంది. ‘అతణ్ణి కలుసుకోవడానికి’ మూల భావాన్ని స్పష్టంగా, అనవసర వివరణ లేకుండా అందిస్తుంది.
theological_decisions:
- issue: ఉపమానంలో νυμφίος సూచించే వ్యక్తి
  choice: వ్యాఖ్యాత్మక బిరుదుగా మార్చకుండా ‘వరుడు’ అని మాత్రమే అనువదించడం
  alternative: ‘వరుడు’ అనే పదాన్ని ప్రత్యేక దైవిక బిరుదుగా చూపడం లేదా ‘క్రీస్తు’ అని స్పష్టీకరించడం
  rationale: మత్తయి సువార్త విస్తృత సందర్భంలో వరుడు యేసును సూచించినా, ఈ వాక్యం ఉపమానంలోని పాత్రగానే అతణ్ణి పేర్కొంటుంది. అనువాదంలోనే ఆ గుర్తింపును స్పష్టీకరించకుండా ఉండడం సాహిత్య స్థాయిని, వ్యాఖ్యానానికి ఉన్న స్థలాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి ఉపయోగించబడింది. ప్రత్యక్ష సంభాషణలో ఆజ్ఞ యొక్క తక్షణతను నిలుపుతూ, పాతకాలపు లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
