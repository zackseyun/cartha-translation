id: MAT.25.14
reference: Matthew 25:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own servants and entrusted his possessions to them.
translation:
  language: te
  text: ఎందుకంటే, ఇది ప్రయాణానికి బయలుదేరిన ఒక మనిషి తన సొంత దాసులను[a] పిలిచి, తన ఆస్తిని వారికి అప్పగించినట్లుగా ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదం దౌలోస్ (δοῦλος) సందర్భాన్ని బట్టి ‘దాసుడు,’ ‘సేవకుడు,’ లేదా ‘బానిస’ అని అర్థమవుతుంది. ఇక్కడ యజమాని అధికారం, అతనికి చెందిన ఆస్తి ప్రధానంగా కనిపిస్తున్నందున ‘దాసులు’ అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: ఎందుకంటే, ఇది ... చేసినట్లుగా ఉంది
  rationale: γὰρ ముందున్న బోధకు వివరణాత్మక సంబంధాన్ని చూపుతుంది; ὥσπερ పోలికను ప్రారంభిస్తుంది. గ్రీకులో అంతర్లీనంగా ఉన్న క్రియను సహజమైన తెలుగు వాక్య నిర్మాణం కోసం ‘ఇది ... చేసినట్లుగా ఉంది’ అని వ్యక్తం చేశాం.
- source_word: ἄνθρωπος
  choice: ఒక మనిషి
  rationale: ఉపమానంలోని నిర్దిష్ట పురుష పాత్రను సూచిస్తుంది; సాధారణ మానవజాతి అనే అర్థం ఇక్కడ లేదు.
- source_word: ἀποδημῶν
  choice: ప్రయాణానికి బయలుదేరుతున్న
  rationale: వేరొక ప్రదేశానికి వెళ్లడాన్ని సూచిస్తుంది; మూలంలో లేని ‘విదేశానికి’ అనే భావాన్ని చేర్చకుండా సహజంగా అనువదిస్తుంది.
- source_word: ἐκάλεσεν
  choice: పిలిచి
  rationale: సందర్భంలో నేరుగా, సహజంగా ‘పిలిచాడు’ అనే అర్థాన్ని ఇస్తుంది; తెలుగు వాక్య ప్రవాహం కోసం సంయుక్త క్రియారూపం వాడాం.
- source_word: τοὺς ἰδίους δούλους
  choice: తన సొంత దాసులను
  rationale: ἰδίους లోని సొంతత్వపు ఉద్ఘాటనను ‘సొంత’ నిలుపుతుంది. δοῦλος లో సేవకత్వంతో పాటు యజమాని అధికారానికి లోబడిన స్థితి ఉంది; ‘దాసులు’ ఈ రెండు భావాలకు మధ్య తగిన తెలుగు పదం.
- source_word: παρέδωκεν
  choice: అప్పగించిన
  rationale: కేవలం చేతికి ఇవ్వడం కాక, బాధ్యతతో ఆస్తిని వారి సంరక్షణకు ఇవ్వడం అనే సందర్భార్థాన్ని తెలియజేస్తుంది.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: తన ఆస్తిని
  rationale: ఆ మనిషికి చెందిన సంపద లేదా ఆస్తిపాస్తులను సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని δοῦλος పదానికి తెలుగు రూపం
  choice: దాసులు
  alternative: సేవకులు; బానిసలు
  rationale: ‘సేవకులు’ అనడం మూలంలోని బంధిత స్థితి మరియు యజమాని అధికారాన్ని కొంత మృదువుపరచవచ్చు; ‘బానిసలు’ ఆ సామాజిక స్థితిని మరింత ప్రత్యక్షంగా చెబుతుంది. ‘దాసులు’ యజమానికి చెందినవారిగా, అతని అధికారానికి లోబడినవారిగా ఉన్న భావాన్ని నిలుపుతూ తెలుగు బైబిలు సందర్భంలో సహజంగా ఉంటుంది. ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని అంతర్లీన పోలికను తెలుగులో పూర్తి వాక్యంగా వ్యక్తం చేశాం; అయితే మూలంలో లేని ప్రయాణ గమ్యం లేదా కాలవ్యవధిని చేర్చలేదు.
