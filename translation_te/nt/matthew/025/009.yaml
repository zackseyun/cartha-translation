- from: 'అయితే వివేకవంతులైనవారు ఇలా జవాబిచ్చారు: “వద్దు; ఒకవేళ మాకూ మీకూ సరిపోకపోవచ్చు.[a] దానికి బదులు అమ్మేవారి దగ్గరికి వెళ్లి మీ కోసం కొనుక్కోండి.”'
  to: 'అయితే వివేకవంతులైనవారు ఇలా జవాబిచ్చారు: “వద్దు; ఒకవేళ మాకూ మీకూ సరిపోకపోవచ్చు.[a] బదులుగా అమ్మేవారి దగ్గరికి వెళ్లి మీ కోసం కొనుక్కోండి.”'
  rationale: 'Only a minor idiomatic correction is needed: replacing “దానికి బదులు” with “బదులుగా” removes an unnecessary ambiguous reference while preserving the contrast expressed by μᾶλλον. The supplied footnote should remain because it responsibly signals the force of the Greek emphatic negation in the cited text.'
