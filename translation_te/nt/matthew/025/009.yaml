id: MAT.25.9
reference: Matthew 25:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: te
  text: 'అయితే వివేకవంతులైనవారు ఇలా జవాబిచ్చారు: “వద్దు; ఒకవేళ మాకూ మీకూ సరిపోకపోవచ్చు.[a] బదులుగా అమ్మేవారి దగ్గరికి వెళ్లి మీ కోసం కొనుక్కోండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “మాకూ మీకూ ఎంతమాత్రమూ సరిపోకుండా పోవచ్చేమో.” గ్రీకులో ‘ఒకవేళ’ భావంతో పాటు బలమైన నిషేధాత్మక నిర్మాణం ఉంది; ఉన్నది అందరికీ సరిపోదేమో అనే గట్టి ఆందోళనను అది వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν δὲ … λέγουσαι
  choice: అయితే … ఇలా జవాబిచ్చారు
  rationale: గ్రీకు వాక్యంలోని ప్రతిస్పందనను సహజమైన ఆధునిక తెలుగు సంభాషణా నిర్మాణంలో వ్యక్తపరుస్తుంది; λέγουσαι భావాన్ని ‘ఇలా’ ద్వారా ప్రసంగ పరిచయంలో కలుపుతుంది.
- source_word: αἱ φρόνιμοι
  choice: వివేకవంతులైనవారు
  rationale: φρόνιμοι అనే స్త్రీలింగ విశేషణం ఇక్కడ నామవాచకంగా వాడబడింది. సందర్భంలో ఎవరో స్పష్టంగా ఉన్నందున ‘కన్యలు’ లేదా ‘యువతులు’ అనే పదాన్ని అదనంగా చేర్చకుండా దాని భావాన్ని నిలుపుతుంది.
- source_word: Μήποτε οὐ μὴ ἀρκέσῃ
  choice: వద్దు; ఒకవేళ … సరిపోకపోవచ్చు
  rationale: పంచడానికి నిరాకరణను ‘వద్దు’ స్పష్టంగా తెలియజేస్తుంది; μήποτε తో కూడిన బలమైన నిషేధాత్మక నిర్మాణం వ్యక్తం చేసే కొరత గురించిన గట్టి ఆందోళనను సహజమైన తెలుగులో ‘ఒకవేళ … సరిపోకపోవచ్చు’గా అందిస్తుంది.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: మాకూ మీకూ
  rationale: రెండు వర్గాలకూ సరిపోవడం అనే దత్తివాచక భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πορεύεσθε μᾶλλον
  choice: దానికి బదులు … వెళ్లి
  rationale: μᾶλλον సూచించే ప్రత్యామ్నాయ చర్యను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: అమ్మేవారి దగ్గరికి
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతాన్ని సహజంగా అనువదిస్తుంది; గ్రీకులో ప్రత్యక్షంగా లేని ‘నూనె’ను చేర్చదు.
- source_word: ἀγοράσατε ἑαυταῖς
  choice: మీ కోసం కొనుక్కోండి
  rationale: ఆజ్ఞార్థక క్రియతో పాటు స్వప్రయోజనాన్ని సూచించే ఆత్మనిర్దేశక దత్తివాచక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘వివేకవంతులైనవారు’ అనే రూపం సందర్భంలోని స్త్రీలను సూచిస్తూ, మూలంలో ఈ వచనంలో లేని నామవాచకాన్ని చేర్చకుండా ఉంటుంది.
