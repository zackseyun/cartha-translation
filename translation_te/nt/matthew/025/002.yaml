translation:
  language: te
  text: వారిలో ఐదుగురు బుద్ధిలేనివారు, ఐదుగురు వివేకవంతులు ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: ఐదుగురు
  rationale: మనుషులను, ప్రత్యేకంగా ముందటి వచనంలోని యువతులను, సూచిస్తున్నందున తెలుగు వ్యక్తివాచక సంఖ్యారూపం ‘ఐదుగురు’ సహజంగా ఉంటుంది; గ్రీకు వాక్యంలోని సమతూకాన్ని నిలుపుతూ రెండుసార్లు వాడబడింది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప అనుసంధానాన్ని సూచిస్తుంది. తెలుగులో వాక్యప్రవాహమే ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది; ‘అయితే’ అని పెడితే అవసరానికి మించిన వ్యతిరేక భావం కలగవచ్చు.
- source_word: ἐξ αὐτῶν
  choice: వారిలో
  rationale: ముందు ప్రస్తావించిన సమూహంలోనివారనే విభాగార్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἦσαν
  choice: నామవాచక వాక్య నిర్మాణంలో అంతర్భూతం
  rationale: గ్రీకులోని భూతకాల సంధానక్రియను తెలుగులో తప్పనిసరిగా ‘ఉండేవారు’ అని వ్యక్తపరచనవసరం లేదు; సందర్భంలోని వర్ణనాత్మక భూతార్థం నిలుస్తుంది.
- source_word: μωραὶ
  choice: బుద్ధిలేనివారు
  rationale: వివేచన లేదా సరైన ముందుచూపు లేని స్వభావాన్ని తెలియజేస్తుంది; ‘మూర్ఖులు’ కంటే ఈ సందర్భంలో కొంత సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: φρόνιμοι
  choice: వివేకులు
  rationale: φρόνιμος లోని వివేకం, జాగ్రత్తతో కూడిన ప్రాయోగిక బుద్ధి అనే భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; వ్యతిరేక జంటను కూడా స్పష్టంగా నిలుపుతుంది.
