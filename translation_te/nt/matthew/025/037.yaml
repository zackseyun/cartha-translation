id: MAT.25.37
reference: Matthew 25:37
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: te
  text: 'అప్పుడు నీతిమంతులు ఆయనకు ఇలా జవాబిస్తారు: “ప్రభువా, మేమెప్పుడు నిన్ను ఆకలితో ఉండగా చూసి ఆహారం ఇచ్చాము? లేదా దాహంతో ఉండగా చూసి నీళ్లు తాగడానికి ఇచ్చాము[a]?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, మరింత సంక్షిప్తంగా, “నీకు తాగడానికి ఇచ్చాము.”
    reason: ἐποτίσαμεν అనే క్రియ ‘తాగడానికి ఇవ్వడం’ అనే అర్థాన్ని సూచిస్తుంది; ప్రధాన పాఠంలోని ‘నీళ్లు’ సహజమైన తెలుగు స్పష్టీకరణ.
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: సంభాషణలో సంఘటనల క్రమాన్ని సహజంగా సూచించే సంక్షిప్త కాలవాచకం.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: ఆయనకు ఇలా జవాబిస్తారు
  rationale: భవిష్యత్ భావాన్ని నిలుపుతూ, దత్తివిభక్తి సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἱ δίκαιοι
  choice: నీతిమంతులు
  rationale: ఇక్కడ విశేషణం నామవాచకంగా వాడబడింది; తీర్పు దృశ్యంలో నీతిమంతులుగా గుర్తించబడినవారిని సూచిస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: గౌరవపూర్వక ప్రత్యక్ష సంబోధనను, అలాగే మత్తయి సందర్భంలోని క్రీస్తు సంబంధిత ప్రతిధ్వనిని అతిశయింపకుండా నిలుపుతుంది.
- source_word: πεινῶντα καὶ ἐθρέψαμεν
  choice: ఆకలితో ఉండగా చూసి ఆహారం పెట్టాము
  rationale: వర్తమాన కృదంత స్థితిని మరియు τρέφω సూచించే ఆహారం అందించే కార్యాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: διψῶντα καὶ ἐποτίσαμεν
  choice: దాహంతో ఉండగా చూసి నీకు తాగడానికి ఇచ్చాము
  rationale: ముందున్న ‘చూసి’ అనే క్రియ రెండవ సమాంతర భాగానికీ వర్తిస్తుందని స్పష్టం చేస్తూ, దాహంగా ఉన్నవారికి తాగడానికి ఇవ్వడం అనే అర్థాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: యేసును ఉద్దేశించిన κύριος సంబోధన
  choice: ప్రభువా
  alternative: బోధకుడా / యజమానీ
  rationale: κύριος అనే పదంలోని గౌరవార్థాన్ని, సందర్భంలోని క్రీస్తు సంబంధిత ప్రాముఖ్యతను కాపాడుతుంది; పాఠ్యంలో లేనిదాన్ని అదనంగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే తీర్పు దృశ్యానికి తగిన గంభీరతతో అనువదించబడింది. గ్రీకులో రెండవ సమాంతర భాగంలో పునరుక్తం కాని ‘చూశాము’ భావాన్ని తెలుగులో స్పష్టత కోసం వ్యక్తం చేశాము.
