revisions:
- from: మరి నిన్ను అనారోగ్యంతో ఉన్నవాడిగా లేదా చెరసాలలో ఉన్నవాడిగా ఎప్పుడు చూసి, నీ దగ్గరికి వచ్చాము?[a]
  to: మరి నీవు అనారోగ్యంగా ఉన్నప్పుడు గానీ చెరసాలలో ఉన్నప్పుడు గానీ మేము నిన్ను ఎప్పుడు చూసి నీ దగ్గరకు వచ్చాము?[a]
  rationale: The revision improves idiomatic Telugu syntax by rendering the participial descriptions as circumstances (“when you were sick or in prison”), while retaining the source’s past-question structure and the transparent rendering of ἤλθομεν πρός σε. The footnote is streamlined and its quotation punctuation is normalized; it continues to distinguish the idiomatic alternative ‘visit you’ from the Greek’s literal ‘come to you.’
