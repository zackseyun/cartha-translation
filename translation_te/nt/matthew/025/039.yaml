source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ⸀ἀσθενοῦντα ἢ ἐν φυλακῇ καὶ ἤλθομεν πρός σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/039.yaml
  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: te
  text: మరి నీవు అనారోగ్యంగా ఉన్నప్పుడు గానీ చెరసాలలో ఉన్నప్పుడు గానీ మేము నిన్ను ఎప్పుడు చూసి నీ దగ్గరకు వచ్చాము?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిన్ను సందర్శించాము.’ గ్రీకులో అక్షరార్థంగా, ‘నీ దగ్గరకు వచ్చాము’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: ఎప్పుడు
  rationale: చర్య జరిగిన సమయాన్ని ప్రశ్నించే సహజమైన తెలుగు ప్రశ్నార్థక క్రియావిశేషణం.
- source_word: δέ
  choice: మరి
  rationale: వరుసగా వచ్చే ప్రశ్నల మధ్య ఉన్న స్వల్ప అనుసంధానాన్ని సహజంగా చూపిస్తుంది; బలమైన వ్యతిరేక భావాన్ని కలిగించదు.
- source_word: εἴδομεν
  choice: చూసి
  rationale: తెలుగు సంయుక్త ప్రశ్న నిర్మాణంలో తరువాతి ἤλθομεν క్రియతో సహజంగా కలుస్తూ, భూతకాల చర్యను సందర్భం ద్వారా స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀσθενοῦντα
  choice: అనారోగ్యంతో ఉన్నవాడిగా
  rationale: సందర్భంలో శారీరక అనారోగ్యాన్ని స్పష్టంగా సూచిస్తుంది; ‘బలహీనుడిగా’ అనడం అవసరానికి మించిన విస్తృతార్థాన్ని ఇస్తుంది.
- source_word: ἐν φυλακῇ
  choice: చెరసాలలో ఉన్నవాడిగా
  rationale: నిర్బంధించబడే స్థలాన్ని గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἤλθομεν πρός σε
  choice: నీ దగ్గరికి వచ్చాము
  rationale: గ్రీకు పదబంధంలోని వ్యక్తివైపు రావడం అనే సరళ భావాన్ని కాపాడుతుంది; ‘నిన్ను సందర్శించాము’ అనే మరింత నిర్దిష్ట వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలోకి తేవదు.
theological_decisions:
- issue: ἤλθομεν πρός σε అనే పదబంధాన్ని ‘నీ దగ్గరికి వచ్చాము’ అని ఇవ్వాలా, ‘నిన్ను సందర్శించాము’ అని ఇవ్వాలా
  choice: నీ దగ్గరికి వచ్చాము
  alternative: నిన్ను సందర్శించాము
  rationale: మూల గ్రీకు ఒక వ్యక్తి దగ్గరికి రావడాన్ని నేరుగా చెబుతుంది; ప్రత్యేకంగా ‘సందర్శించడం’ అనే క్రియను వాడదు. కాబట్టి ప్రధాన పాఠ్యం మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది; సందర్భానుకూల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రత్యక్ష ప్రశ్నగా రూపొందించబడింది. ‘మరి’ వరుస ప్రశ్నల అనుసంధానాన్ని చూపిస్తుంది. ‘చెరసాల’ పదం ‘జైలు’ కంటే కొద్దిగా గంభీరమైన బైబిలు పఠన శైలికి సరిపోతూనే సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
