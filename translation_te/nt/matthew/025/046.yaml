source:
  edition: SBLGNT
  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: te
  text: వీరు నిత్య శిక్షలోకి[a] వెళ్లిపోతారు; నీతిమంతులు మాత్రం నిత్య జీవంలోకి వెళ్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యుగకాలిక శిక్ష’ ... ‘యుగకాలిక జీవం.’ కొన్ని సందర్భాల్లో αἰώνιος అనే గ్రీకు విశేషణం అర్థంపై చర్చ ఉంది. అయితే ఇక్కడ అదే పదం ‘శిక్ష’ను, ‘జీవం’ను రెండింటినీ విశేషిస్తుంది; కాబట్టి ప్రధాన పాఠంలో రెండుచోట్లా ‘నిత్య’ అని అనువదించి సమాంతరతను కాపాడాం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: వెళ్లిపోతారు
  rationale: ἀπέρχομαι యొక్క భవిష్యత్ రూపం వెళ్లిపోవడం లేదా బయలుదేరడాన్ని సూచిస్తుంది. ‘వెళ్లిపోతారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలంలోని గమన భావాన్ని నిలుపుతుంది.
- source_word: οὗτοι
  choice: వీరు
  rationale: ముందు వర్ణించిన సమూహాన్ని సూచించే సర్వనామం. ‘వీరు’ సంక్షిప్తంగా ఉండి, ‘నీతిమంతులు’తో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: κόλασιν
  choice: శిక్షకు
  rationale: ఈ తీర్పు సందర్భంలో κόλασις దండనాత్మక పరిణామాన్ని సూచిస్తుంది. ‘శిక్ష’ సాధారణ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: αἰώνιον
  choice: నిత్య
  rationale: ఒకే విశేషణం ‘శిక్ష’ను, ‘జీవం’ను రెండింటినీ విశేషిస్తున్నందున, రెండు చోట్లా ‘నిత్య’ అని అనువదించి గ్రీకు సమాంతర నిర్మాణాన్ని కాపాడాం.
- source_word: δίκαιοι
  choice: నీతిమంతులు
  rationale: నీతిగలవారిగా గుర్తించబడిన సమూహాన్ని సూచించే నామవాచకార్థక విశేషణం. ‘నీతిమంతులు’ ఆధునిక బైబిలు తెలుగులో సహజమైన, గౌరవప్రదమైన పదం.
- source_word: ζωὴν
  choice: జీవానికి
  rationale: ζωήకు ప్రామాణికమైన తెలుగు సమానార్థకం ‘జీవం’. గమ్యార్థక εἰς కారణంగా ‘జీవానికి’ అని ఇచ్చాం.
- source_word: δὲ
  choice: అయితే
  rationale: రెండు సమూహాల గమ్యాల మధ్య వ్యత్యాసాన్ని సూచిస్తుంది. ‘అయితే’ ఈ విరుద్ధతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: κόλασιν αἰώνιον మరియు ζωὴν αἰώνιον అనే జత పదబంధాల్లో αἰώνιον అనువాదం
  choice: రెండు చోట్లా ‘నిత్య’ అని అనువదించడం
  alternative: ‘యుగకాలిక’ లేదా ‘యుగాంత సంబంధమైన’ అని అనువదించడం
  rationale: అదే గ్రీకు విశేషణం శిక్షకూ జీవానికీ వర్తిస్తుంది. అందువల్ల వాటి కాలవ్యాప్తి లేదా స్వభావాన్ని అనువాదంలో వేరు చేయకుండా సమాంతరతను కాపాడాం. αἰώνιος యొక్క అర్థవ్యాప్తిపై చర్చ ఉన్నందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నమోదు చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని రెండు గమ్యాల సమాంతరతను ‘నిత్య శిక్షకు’ మరియు ‘నిత్య జీవానికి’ ద్వారా నిలుపుతూ, తెలుగులో అవసరమైన క్రియను రెండవ ఉపవాక్యంలో స్పష్టంగా పునరుద్ధరించాం.
