  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: te
  text: ఎందుకంటే నేను ఆకలితో ఉన్నాను, మరియు మీరు నాకు తినడానికి ఏమీ ఇవ్వలేదు[a]; నేను దాహంతో ఉన్నాను, మరియు మీరు నాకు తాగడానికి ఏమీ ఇవ్వలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: ‘మీరు నాకు తినడానికి ఇవ్వలేదు … మీరు నాకు తాగడానికి ఇవ్వలేదు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: నేను ఆకలితో ఉన్నాను
  rationale: ఆకలి అనే గత స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న తీర్పుకు ఈ మాటలు కారణాన్ని తెలియజేస్తున్నాయనే వివరణాత్మక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: మీరు నాకు తినడానికి ఏమీ ఇవ్వలేదు
  rationale: అక్షరార్థ నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, μοι అనే వ్యక్తిగత పరోక్ష కర్మను స్పష్టంగా చూపించే సహజ తెలుగు ప్రయోగం.
- source_word: ἐδίψησα
  choice: నేను దాహంతో ఉన్నాను
  rationale: ἐπείνασα కు సమాంతరంగా, గతంలోని దాహస్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐποτίσατέ με
  choice: మీరు నాకు తాగడానికి ఏమీ ఇవ్వలేదు
  rationale: ఈ సందర్భంలో ποτίζω అంటే తాగడానికి ఇవ్వడం; ఆహారపు వాక్యభాగంతో సమాంతరతను, వ్యక్తిగత నిర్లక్ష్య భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: నిరాకరణతో కూడిన ఆహారపానీయాల అందజేతను ఎలా వ్యక్తం చేయాలి
  choice: ‘మీరు నాకు తినడానికి/తాగడానికి ఏమీ ఇవ్వలేదు’ అని అనువదించడం
  alternative: ‘మీరు నాకు తినడానికి ఇవ్వలేదు; తాగించలేదు’
  rationale: ఇది సిద్ధాంతపరమైన వివాదాన్ని పరిష్కరించదు; తీర్పు సందర్భంలో యేసుకు చూపని వ్యక్తిగత కరుణను సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే తీర్పు ప్రసంగానికి తగిన గంభీరతతో. గ్రీకు వాక్యంలోని రెండు సమాంతర భాగాలను నిలుపుటకు రెండింటిలోనూ ఒకే విధమైన నిర్మాణం వాడబడింది.
