translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. మూలంలోని కారణసూచక అనుసంధానాన్ని, స్త్రీలింగ సూచనకు సంబంధించిన సందర్భాన్ని, అలాగే ‘దీపాలు/కాగడాలు’ అనే నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని నిలుపుకుంది.
