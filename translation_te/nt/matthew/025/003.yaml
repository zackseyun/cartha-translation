source:
  edition: SBLGNT
  text: ⸂αἱ γὰρ⸃ μωραὶ λαβοῦσαι τὰς λαμπάδας αὐτῶν οὐκ ἔλαβον μεθ’ ἑαυτῶν ἔλαιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/003.yaml
  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: te
  text: ఎందుకంటే బుద్ధిలేని కన్యలు తమ దీపాలను[a] తీసుకున్నప్పుడు, తమతో నూనె తీసుకోలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘కాగడాలను’ (గ్రీకు: λαμπάδας).'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో చెప్పిన భేదానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే అనుసంధాన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: μωραὶ
  choice: బుద్ధిలేనివారు
  rationale: స్త్రీలింగ బహువచన విశేషణం ముందున్న కన్యలను సూచిస్తుంది. ఈ వచనంలో ‘కన్యలు’ అని మళ్లీ చేర్చకుండా వారి లక్షణాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: λαβοῦσαι
  choice: తీసుకున్నప్పుడు
  rationale: ప్రధాన క్రియకు ముందున్న ఏఒరిస్ట్ కృదంతంలోని కాలసంబంధ భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: λαμπάδας
  choice: దీపాలను
  rationale: నూనె ప్రస్తావన ఉన్న ఈ సందర్భంలో λαμπάςకు సంప్రదాయబద్ధమైన, సులభంగా అర్థమయ్యే అనువాదం; ‘కాగడాలు’ కూడా సాధ్యమైనందున పాదసూచికలో ఇచ్చింది.
- source_word: οὐκ ἔλαβον
  choice: తీసుకువెళ్లలేదు
  rationale: నూనెను తమ వెంట ఉంచుకోలేదనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, λαβοῦσαι/ἔλαβον మధ్య ఉన్న క్రియాత్మక సమాంతరతను సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: μεθ’ ἑαυτῶν
  choice: తమతో
  rationale: గ్రీకు ఆత్మవాచక పదబంధానికి సంక్షిప్తమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: ἔλαιον
  choice: నూనె
  rationale: దీపాలకు ఉపయోగించే నూనెను సూచించే ప్రత్యక్ష అనువాదం.
