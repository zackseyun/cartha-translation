id: MAT.25.27
reference: Matthew 25:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: te
  text: కాబట్టి నువ్వు నా డబ్బును బ్యాంకర్ల వద్ద జమ చేసి ఉండాల్సింది. నేను వచ్చినప్పుడు, నా సొమ్మును వడ్డీతో సహా తిరిగి పొందేవాణ్ణి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδει
  choice: చేసి ఉండాల్సింది
  rationale: గతంలో చేయవలసిన బాధ్యతను సూచించే అసంపూర్ణ భూతకాల భావాన్ని, మందలింపు ధ్వనితో సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి ఆరోపణనుంచి వచ్చే తార్కిక పరిణామాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: βαλεῖν
  choice: జమ చేసి
  rationale: మూలార్థం ‘పెట్టు’ అయినా, బ్యాంకర్లు మరియు వడ్డీ ప్రస్తావన ఉన్న ఈ ఆర్థిక సందర్భంలో డబ్బును జమ చేయడం అనే భావమే సహజం.
- source_word: τὰ ἀργύριά μου
  choice: నా డబ్బును
  rationale: ἀργύρια అక్షరార్థంగా వెండి లేదా వెండి నాణేలను సూచించగలదు; ఈ వాణిజ్య సందర్భంలో ‘డబ్బు’ దాని కార్యాత్మక భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: τραπεζίταις
  choice: బ్యాంకర్ల దగ్గర
  rationale: వడ్డీ కోసం డబ్బు స్వీకరించే ఆర్థిక మధ్యవర్తులను ఇక్కడ సూచిస్తుంది; ‘డబ్బు మార్పిడివారు’ కంటే ‘బ్యాంకర్లు’ సందర్భానికి సరిపోతుంది.
- source_word: ἐλθὼν ἐγὼ
  choice: అప్పుడు నేను వచ్చి
  rationale: కర్త తిరిగి వచ్చిన తర్వాత డబ్బు పొందే కాలక్రమాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐκομισάμην ἂν
  choice: తిరిగి పొందేవాణ్ణి
  rationale: మధ్యమ ప్రయోగంలోని ‘తనదాన్ని తిరిగి పొందడం’ అనే భావాన్ని, ἄν సూచించే అవాస్తవ గత ఫలితంతో కలిపి వ్యక్తం చేస్తుంది.
- source_word: τὸ ἐμὸν
  choice: నాది
  rationale: యజమానికి చెందిన మూలధనాన్ని సూచించే నామవాచకీకృత స్వామ్య సర్వనామపు సంక్షిప్తతను నిలుపుతుంది.
- source_word: σὺν τόκῳ
  choice: వడ్డీతో సహా
  rationale: τόκος ఇక్కడ డబ్బుపై వచ్చే వడ్డీని తటస్థంగా సూచిస్తుంది; నైతిక తీర్పును అదనంగా చేర్చదు.
theological_decisions:
- issue: ఉపమానంలోని వడ్డీ భాషకు నైతిక లేదా సిద్ధాంతపరమైన అదనపు అర్థం ఇవ్వడం
  choice: ఆర్థిక పదాలను ఉపమాన చిత్రణలోని తటస్థ పదాలుగా నేరుగా అనువదించడం
  alternative: ‘అధిక వడ్డీ’ వంటి పదంతో వడ్డీ తీసుకోవడంపై ప్రతికూల నైతిక తీర్పును సూచించడం
  rationale: ఈ వాక్యం వడ్డీ తీసుకునే అన్ని ఆచారాలను సమర్థించదు లేదా ఖండించదు; అలాంటి తరువాతి సిద్ధాంత చర్చను అనువాదంలోకి దిగుమతి చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. యజమాని సేవకుణ్ణి నేరుగా సంబోధిస్తున్నందున ఏకవచన ‘నువ్వు’ వాడబడింది. ‘బ్యాంకర్లు’, ‘జమ’, ‘వడ్డీ’ పదాలు నేటి పాఠకులకు స్పష్టంగా ఉండటంతో పాటు మూలంలోని ఆర్థిక చిత్రణను కాపాడుతాయి.
