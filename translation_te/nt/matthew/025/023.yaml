id: MAT.25.23
reference: Matthew 25:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: te
  text: 'అతని యజమాని అతనితో ఇలా అన్నాడు: “బాగా చేశావు, మంచి, నమ్మకమైన సేవకుడా![a] కొద్ది వాటి విషయంలో నీవు నమ్మకంగా ఉన్నావు; అనేక వాటి బాధ్యతను నీకు అప్పగిస్తాను. నీ యజమాని ఆనందంలోకి ప్రవేశించు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బానిసా.” గ్రీకు పదమైన δοῦλος సందర్భానుసారంగా సేవకుడిని లేదా బానిసను సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη αὐτῷ
  choice: అతనితో ఇలా అన్నాడు
  rationale: ప్రత్యక్ష సంభాషణను సహజమైన ఆధునిక తెలుగు కథన శైలిలో పరిచయం చేస్తుంది.
- source_word: ὁ κύριος αὐτοῦ / τοῦ κυρίου σου
  choice: అతని యజమాని / నీ యజమాని
  rationale: ఉపమానంలోని మానవ అధిపతిని సూచించే సందర్భంలో ‘యజమాని’ సహజంగా ఉండి, κύριοςను దైవ బిరుదుగా ముందుగానే నిర్ధారించదు.
- source_word: Εὖ
  choice: బాగా చేశావు
  rationale: ప్రశంసను తెలిపే εὖకు తెలుగులో సహజమైన అభినందనాత్మక ప్రయోగం.
- source_word: δοῦλε
  choice: సేవకుడా
  rationale: గృహాధిపతి కింద ఉన్న వ్యక్తిని ఈ సందర్భంలో సహజంగా సూచిస్తుంది; ‘దాసుడా’ అనే బలమైన సామాజిక భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: మంచివాడా, నమ్మకమైన సేవకుడా
  rationale: రెండు సంబోధన విశేషణాల భావాన్ని నిలుపుతూ, πιστόςతో తరువాత వచ్చే పదబంధానికి ‘నమ్మకమైన/నమ్మకంగా’ అనే పదబంధ అనుసంధానాన్ని కాపాడుతుంది.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: కొద్ది వాటి విషయంలో నీవు నమ్మకంగా ఉన్నావు
  rationale: అప్పగించబడిన పరిమిత బాధ్యతల పరిధిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: అనేక వాటికి నిన్ను బాధ్యునిగా నియమిస్తాను
  rationale: καθίστημι ఇక్కడ అధికారంతో బాధ్యతలో ఉంచడాన్ని సూచిస్తుంది; ‘బాధ్యునిగా నియమిస్తాను’ ఆ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: ఆనందంలోకి ప్రవేశించు
  rationale: ‘ప్రవేశించు’ అనే రూపకాన్ని సమతలీకరించకుండా మూలంలోని కదలిక-రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఉపమానంలోని κύριος అనువాదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: కథా స్థాయిలో ఇది సేవకుని మానవ అధిపతిని సూచిస్తుంది. ‘యజమాని’ సందర్భాన్ని స్పష్టంగా ఉంచి, ఉపమానపు దైవార్థాన్ని అనువాదంలో ముందుగానే రుద్దదు.
- issue: δοῦλος అనువాదం
  choice: సేవకుడు
  alternative: దాసుడు
  rationale: ఈ వాక్యంలో ప్రధానంగా నమ్మకమైన బాధ్యత నిర్వహణకు లభించిన ప్రశంసే ముందుకు వస్తుంది. అయినా మూలపదం బానిసను కూడా సూచించగలదనే అర్థవ్యాప్తిని పాదసూచికలో భద్రపరిచింది.
- issue: ‘యజమాని ఆనందంలోకి ప్రవేశించు’ అనే రూపకం
  choice: రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: యజమాని ఆనందంలో పాలుపంచుకో
  rationale: εἴσελθε εἰς అనే ప్రవేశ రూపకాన్ని మూలం వ్యక్తంగా ఉపయోగిస్తుంది; ‘పాలుపంచుకో’ సాధ్యమైన భావవివరణ అయినా రూపకాన్ని సడలిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన కథన-సంభాషణ శైలిలో రూపొందించబడింది. ‘నమ్మకమైన/నమ్మకంగా’ అనే పునరుక్తి మూలంలోని πιστέ/πιστός పదసంబంధాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది.
