id: MAT.25.38
reference: Matthew 25:38
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: te
  text: మరి మేము ఎప్పుడు నిన్ను అపరిచితుడిగా[a] చూసి తమ వద్దకు చేర్చుకున్నాము[b]? లేదా నిన్ను నగ్నంగా[c] చూసి దుస్తులు తొడిగాము?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పరదేశిగా.’ గ్రీకు పదం తెలియని వ్యక్తిని, తన వర్గానికి వెలుపలివాడిని, లేదా పరదేశిని సూచించవచ్చు; ఇక్కడ ఆతిథ్యం అవసరమైన వ్యక్తి అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘కూడగట్టాము’; ఇక్కడ ఒకరిని ఆతిథ్యంతో తమ వద్దకు తీసుకొని స్వీకరించడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘తగిన దుస్తులు లేకుండా.’ గ్రీకు పదం పూర్తిగా నగ్నంగా ఉండడాన్ని గానీ, సరిపడా దుస్తులు లేకపోవడాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: ఎప్పుడు
  rationale: గతంలో ఆ పని ఏ సమయంలో చేశామని ప్రశ్నించే సహజమైన తెలుగు ప్రశ్నార్థక క్రియావిశేషణం.
- source_word: δέ
  choice: మరి
  rationale: ముందటి ప్రశ్నకు కొనసాగింపుగా వచ్చే స్వల్ప అనుసంధానాన్ని సూచిస్తుంది; ఇక్కడ బలమైన వ్యతిరేకార్థం అవసరం లేదు.
- source_word: σε
  choice: నిన్ను
  rationale: ఉపమానంలోని రాజు/మనుష్యకుమారుని సూచించే ద్వితీయ పురుష ఏకవచన కర్మరూపం.
- source_word: εἴδομεν
  choice: చూసి
  rationale: తెలుగులో తరువాతి చర్యతో సహజంగా అనుసంధానమవుతుంది; గ్రీకు భూతకాల భావం ప్రధాన క్రియలైన ‘చేర్చుకున్నాము’, ‘తొడిగాము’ ద్వారా స్పష్టమవుతుంది.
- source_word: ξένον
  choice: అపరిచితుడిగా
  rationale: తెలియని లేదా తన వర్గానికి వెలుపల ఉన్న, ఆతిథ్యం అవసరమైన వ్యక్తి అనే సామాజిక భావాన్ని వ్యక్తం చేస్తుంది; జాతీయతను అనవసరంగా నిర్దేశించదు.
- source_word: συνηγάγομεν
  choice: చేర్చుకున్నాము
  rationale: అక్షరార్థంగా ‘కూడగట్టాము/లోపలికి చేర్చాము’; ఈ ఆతిథ్య సందర్భంలో ఒకరిని స్వీకరించి తమ వద్దకు చేర్చుకోవడం అనే భావాన్ని సహజంగా ఇస్తుంది.
- source_word: ἢ
  choice: లేదా
  rationale: రెండవ పరిస్థితిని మొదటిదానితో అనుసంధానించే సాధారణ వికల్ప సముచ్చయం.
- source_word: γυμνὸν
  choice: బట్టలు లేకుండా
  rationale: పూర్తిగా నగ్నంగా ఉండడం లేదా తగిన బట్టలు లేకపోవడం—రెండింటికీ వీలున్న మూలపద భావాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది.
- source_word: περιεβάλομεν
  choice: బట్టలు తొడిగాము
  rationale: ఒకరికి దుస్తులు వేయడం అనే క్రియను స్పష్టమైన, ప్రస్తుత వాడుక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: తీర్పు ఉపమాన సందర్భంలో ξένος సూచించే ఆతిథ్యార్థం
  choice: అపరిచితుడు
  alternative: పరదేశి / విదేశీయుడు
  rationale: ఈ వాక్యం అవసరంలో ఉన్నవారికి చూపిన దయ, ఆతిథ్యం గురించి చెబుతుంది. ‘అపరిచితుడు’ అనే పదం తెలియని లేదా స్వాగతం లేని వ్యక్తి అనే విస్తృత సామాజిక భావాన్ని కాపాడుతుంది; మూలంలో తప్పనిసరిగా లేని జాతీయ లేదా రాజకీయ గుర్తింపును జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలిలో అనువదించబడింది. ప్రశ్న యొక్క కొనసాగింపును ‘మరి’తో చూపించి, గ్రీకు వాక్యంలోని రెండు దయాకార్యాలను సమాంతరంగా నిలిపింది.
