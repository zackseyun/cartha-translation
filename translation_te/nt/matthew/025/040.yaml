  to: 'రాజు వారికి ఇలా జవాబిస్తాడు: “నిజంగా నేను మీతో చెబుతున్నాను[a], మీరు నా ఈ అతి అల్పులైన సోదరులలో ఒకరికి ఎంత మేరకు చేశారో, నాకు చేశారు.”[b]'
  rationale: మూలంలో లేని ‘అప్పుడు’ను తొలగించి, ἐφ’ ὅσον యొక్క మేర భావాన్ని ‘ఎంత మేరకు’తో ప్రతిబింబించాం. ‘నా ఈ అతి అల్పులైన సోదరులు’ అనే పదక్రమం మూలంలోని ‘these brothers of mine, the least’ భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది. పాదటిప్పణి aలో అక్షరార్థత గురించిన అస్పష్టతను సరిచేశాం. పదబంధం ఎవరిని సూచిస్తుందో ప్రధాన వచనంలో గానీ పాదటిప్పణిలో గానీ నిర్ణయించలేదు.
  reviewer_model: gpt-5.6-terra
