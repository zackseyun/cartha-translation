id: MAT.25.40
reference: Matthew 25:40
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: te
  text: 'రాజు వారికి ఇలా జవాబిస్తాడు: “నిజంగా నేను మీతో చెబుతున్నాను[a], మీరు నా ఈ అతి అల్పులైన సోదరులలో ఒకరికి ఎంత మేరకు చేశారో, నాకు చేశారు.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ప్రత్యామ్నాయంగా, “ఆమేన్, నేను మీతో చెబుతున్నాను.”
    reason: lexical_alternative
  - marker: b
    text: “సోదరులు” అనేది గ్రీకులోని పురుష బహువచన పదానికి అనువాదం. “నా ఈ సోదరులు” అనే మాట యేసు శిష్యులను ప్రత్యేకంగా గానీ, విశ్వాసులను సాధారణంగా గానీ, లేదా మరింత విస్తృతంగా బలహీనులు, అవసరంలో ఉన్నవారిని గానీ సూచించవచ్చు. ఈ అనువాదం ఆ వ్యాఖ్యాన ప్రశ్నను నిర్ణయించకుండా మూలపదబంధాన్ని నిలుపుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἐρεῖ
  choice: ఇలా జవాబిస్తాడు
  rationale: కృదంతం మరియు భవిష్యత్‌కాల క్రియ కలిపి ఇచ్చే ‘జవాబుగా చెబుతాడు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ βασιλεὺς
  choice: రాజు
  rationale: గ్రీకులోని స్పష్టమైన రాజబిరుదును యథాతథంగా నిలుపుతుంది; సందర్భంలో ఇతడు అంత్యకాల న్యాయాధిపతిగా కనిపిస్తాడు.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిజంగా చెబుతున్నాను
  rationale: యేసు వాడే గంభీరమైన ధృవీకరణ సూత్రం యొక్క బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘ఆమేన్’ అనే మరింత అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఇస్తుంది.
- source_word: ἐφ’ ὅσον
  choice: ఏది … అది
  rationale: ఈ సందర్భంలో చేసిన కార్యానికీ దాని గ్రహీతకీ ఉన్న సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; గ్రీకు నిర్మాణంలోని పరిమాణం/మేర భావాన్ని కార్యసంబంధ వాక్యరూపంలో అందిస్తుంది.
- source_word: ἑνὶ τούτων
  choice: నా ఈ సోదరుల్లో ఒకరికి
  rationale: ἑνί లోని వ్యక్తిని ప్రత్యేకించే ‘ఒకరికి’ అనే భావాన్ని, τούτων లోని సూచనను నిలుపుతుంది.
- source_word: τῶν ἀδελφῶν μου
  choice: నా ఈ సోదరుల్లో
  rationale: మూలంలోని పురుష బహువచన బంధుత్వ పదాన్ని లింగనిర్దిష్టంగా అనువదిస్తుంది; అది ఎవరిని సూచిస్తుందో వచనంలో నిర్ణయించదు.
- source_word: τῶν ἐλαχίστων
  choice: అతి అల్పులైన
  rationale: స్థాయి, ప్రాముఖ్యత లేదా సామాజిక అణకువ వంటి భావవ్యాప్తిని ఒకే నిర్దిష్ట అర్థానికి కుదించకుండా గ్రీకు అతిశయోక్తి రూపాన్ని ప్రతిబింబిస్తుంది.
- source_word: ἐμοὶ ἐποιήσατε
  choice: అది నాకు చేశారు
  rationale: సోదరుల్లో ఒకరికి చేసిన కార్యాన్ని రాజుకు చేసిన కార్యంతో గుర్తించే సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: “నా ఈ సోదరులు” ఎవరిని సూచిస్తారు?
  choice: “నా ఈ సోదరులు” అనే మూలపదబంధాన్ని అలాగే నిలిపి, సూచిత వర్గాన్ని నిర్ణయించకుండా ఉంచడం.
  alternative: యేసు శిష్యులు/దూతలు మాత్రమే; విశ్వాసులందరూ; లేదా అవసరంలో ఉన్న బలహీనులందరూ అని స్పష్టీకరించడం.
  rationale: ఈ వచనం స్వయంగా ఆ వ్యాఖ్యాన వివాదాన్ని తేల్చదు. అందువల్ల అనువాదం ఏ ఒక్క సిద్ధాంతపరమైన అర్థాన్నీ చేర్చకుండా మూలంలోని ఉద్రిక్తతను కాపాడుతుంది.
- issue: ἀδελφῶν యొక్క లింగ వ్యక్తీకరణ
  choice: సోదరులు
  alternative: సోదర సోదరీమణులు; తోబుట్టువులు
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పురుష బహువచనం. సూచిత వర్గం వివాదాస్పదమైనందున లింగసమావేష విస్తరణను ప్రధాన వచనంలో చేర్చడం మూలంలో లేని వ్యాఖ్యాన నిర్ణయమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. ప్రత్యక్ష సంభాషణలో రాజు పలికే ధృవీకరణ బలాన్ని, మూలంలోని పునరుక్త సమాంతరతను సాధ్యమైనంతవరకు నిలిపింది.
