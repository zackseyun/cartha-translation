translation:
  language: te
  text: అలాగే, రెండు తలాంతులు ఉన్నవాడు మరో రెండు సంపాదించాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσαύτως
  choice: అలాగే
  rationale: మునుపటి సేవకుడు చేసినదానితో ఈ సేవకుని చర్యను పోలుస్తూ అనుసంధానించే క్రియావిశేషణ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ τὰ δύο
  choice: రెండు తలాంతులు ఉన్నవాడు
  rationale: గ్రీకు మూలంలోని సంక్షిప్త ప్రయోగాన్ని నిలుపుతూ, సందర్భంలో చెప్పబడిన రెండు తలాంతులు గల సేవకుని స్పష్టంగా సూచిస్తుంది; లెక్కింపు ప్రమాణమైన ‘తలాంతులు’ను సందర్భం నుండి అందిస్తుంది.
- source_word: ἐκέρδησεν
  choice: సంపాదించాడు
  rationale: ఆర్థిక సందర్భంలో అదనపు మొత్తాన్ని విజయవంతమైన కార్యకలాపం ద్వారా పొందిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἄλλα δύο
  choice: మరో రెండు
  rationale: అదే రకానికి చెందిన అదనపు రెండింటిని సూచించే గ్రీకు భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సంక్షిప్త వాక్యం. ‘తలాంతులు’ అనే సందర్భపదాన్ని చేర్చడం ద్వారా తెలుగులో అస్పష్టతను తగ్గించాం; గ్రీకు మూలంలో అది ముందటి సందర్భం నుంచి గ్రహించబడుతుంది.
