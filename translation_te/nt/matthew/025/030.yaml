id: MAT.25.30
reference: Matthew 25:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless servant into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: te
  text: ఆ పనికిరాని దాసుణ్ణి[a] వెలుపలి చీకటిలోకి పారవేయండి. అక్కడ ఏడుపు, పళ్లు కొరుక్కోవడం ఉంటాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దాసుడు’ అని అనువదించిన గ్రీకు పదం సేవకుడు లేదా బానిస అని అర్థం కావచ్చు. ఈ ఉపమానంలోని యజమాని–దాసుడి సంబంధాన్ని దృష్టిలో ఉంచుకొని ఇక్కడ ‘దాసుడు’ అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: పనికిరాని
  rationale: యజమాని దృష్టిలో ఉపయోగం లేని వ్యక్తిని సూచించే ఈ విశేషణానికి ‘పనికిరాని’ అనేది సహజమైన ఆధునిక తెలుగు; తీర్పులోని తీవ్రతను కూడా నిలుపుతుంది.
- source_word: δοῦλον
  choice: దాసుణ్ణి
  rationale: ఈ ఉపమానంలోని యజమాని–దాసుడి సామాజిక సంబంధాన్ని ‘దాసుడు’ స్పష్టంగా ప్రతిబింబిస్తుంది; ‘సేవకుడు’ కంటే బంధిత ఆధీనస్థితిని బలంగా తెలియజేస్తుంది.
- source_word: ἐκβάλετε
  choice: పారవేయండి
  rationale: బహువచన ఆజ్ఞలోని బలాన్ని, అకస్మాత్తుగా వెలివేయడాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: σκότος τὸ ἐξώτερον
  choice: వెలుపలి చీకటి
  rationale: మత్తయి సువార్తలోని ప్రత్యేక తీర్పు చిత్రణను వ్యాఖ్యానంతో విస్తరించకుండా, ఆశీర్వాద స్థలానికి వెలుపల ఉండే చీకటిగా నేరుగా నిలుపుతుంది.
- source_word: ἐκεῖ
  choice: అక్కడ
  rationale: ముందు చెప్పిన వెలుపలి చీకటిని సహజంగా, స్పష్టంగా తిరిగి సూచిస్తుంది.
- source_word: κλαυθμὸς
  choice: ఏడుపు
  rationale: దుఃఖాన్ని స్పష్టంగా తెలిపే సాధారణ ఆధునిక తెలుగు పదం; విలాప తీవ్రతను అనవసరంగా అధికం చేయదు.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: పళ్లు కొరకడం
  rationale: వేదన మరియు/లేదా ఆగ్రహాన్ని సూచించగల గ్రీకు నుడికారాన్ని అదే అనిశ్చితితో సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ఉపమానంలోని తీర్పు చిత్రణ స్వభావం
  choice: వెలివేత, చీకటి, ఏడుపు, పళ్లు కొరకడం అనే మూలపాఠ చిత్రణను మాత్రమే నిలుపడం
  alternative: దీనిని నేరుగా నరకం, అంతిమ తీర్పు, లేదా తాత్కాలిక శిక్ష అని అనువాదంలోనే నిర్దిష్టంగా చెప్పడం
  rationale: ఈ మాటలు మత్తయిలో తీర్పును సూచించే స్థిర చిత్రణగా ఉన్నా, ఈ వాక్యం స్వయంగా శిక్ష స్వభావాన్ని మరింత నిర్దిష్టంగా నిర్వచించదు; కాబట్టి దాని ధార్మిక ఉద్వేగాన్నీ వ్యాఖ్యాన స్వేచ్ఛనూ నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలిని ఉపయోగించాం. ‘పారవేయండి’ ఆజ్ఞలోని తీవ్రతను, ‘వెలుపలి చీకటి’ మూలంలోని తీర్పు చిత్రణను నిలుపుతాయి.
