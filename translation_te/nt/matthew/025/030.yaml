review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the forceful plural imperative, the exclusion imagery of ‘the outer darkness,’ and the recurring Matthean expression of weeping and gnashing of teeth. It does not overdefine the judgment imagery.
  naturalness: ‘పారవేయండి’ and ‘వెలుపలి చీకటిలోకి’ are natural and suitably forceful. For βρυγμὸς τῶν ὀδόντων, ‘పళ్లు కొరకడం’ can suggest literally biting one’s teeth; ‘పళ్లు కొరుక్కోవడం’ is the more idiomatic modern Telugu expression for gnashing/grinding one’s teeth.
  terminology: ‘పనికిరాని దాసుడు’ appropriately conveys ἀχρεῖος δοῦλος in this parable setting. The note responsibly retains the possible ‘సేవకుడు’ sense while explaining the contextual choice. No doctrinal interpretation is introduced.
  issues:
  - severity: low
    issue: ‘పళ్లు కొరకడం’ is slightly less idiomatic for the fixed expression ‘gnashing of teeth.’
    rationale: In contemporary Telugu, ‘పళ్లు కొరుక్కోవడం’ more clearly denotes teeth-grinding/gnashing and avoids the possible sense of biting teeth.
  revised_text: ఆ పనికిరాని దాసుణ్ణి[a] వెలుపలి చీకటిలోకి పారవేయండి. అక్కడ ఏడుపు, పళ్లు కొరుక్కోవడం ఉంటాయి.
  revised_footnotes:
