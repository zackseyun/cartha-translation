id: MAT.25.10
reference: Matthew 25:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: te
  text: కాని వారు కొనడానికి వెళ్లి ఉండగా పెళ్లికుమారుడు వచ్చాడు. సిద్ధంగా ఉన్నవారు అతనితో కలిసి పెళ్లి విందులోకి[a] వెళ్లారు; తలుపు మూయబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పెళ్లి వేడుకలోకి” లేదా సరళంగా “పెళ్లికి.” గ్రీకులోని బహువచన పదం పెళ్లి వేడుక మొత్తాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι
  choice: కాని వారు కొనడానికి వెళ్లిన సమయంలో
  rationale: జెనిటివ్ అబ్సల్యూట్ సమకాలీన చర్యను సూచిస్తుంది. ‘వెళ్లిన సమయంలో’ ఆ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ἀγοράσαι ఉద్దేశాన్ని సూచిస్తున్నందున ‘కొనడానికి’ అని, కొనవలసిన వస్తువును ఈ వచనంలో చేర్చకుండా అనువదించాం.
- source_word: ὁ νυμφίος
  choice: పెళ్లికుమారుడు
  rationale: వివాహ సందర్భంలోని వరుణ్ణి సూచించే సహజమైన ఆధునిక తెలుగు పదం; ఉపమానంలోని వివాహ చిత్రణను నిలుపుతుంది.
- source_word: αἱ ἕτοιμοι
  choice: సిద్ధంగా ఉన్నవారు
  rationale: స్త్రీలింగ బహువచన విశేషణం ఇక్కడ నామవాచకంగా వాడబడింది. సందర్భంలో సిద్ధంగా ఉన్న కన్యలను సూచించినా, గ్రీకు వాక్యంలాగే వారిని మళ్లీ స్పష్టంగా పేర్కొనకుండా అనువదించాం.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: అతనితో కలిసి ... వెళ్లారు
  rationale: ‘అతనితో కలిసి వెళ్లారు’ కథన గమనాన్ని సహజంగా వ్యక్తం చేస్తూ, అతనితో పాటు లోపలికి ప్రవేశించిన భావాన్ని గమ్యపదంలోని ‘లోకి’తో స్పష్టం చేస్తుంది.
- source_word: εἰς τοὺς γάμους
  choice: పెళ్లి విందులోకి
  rationale: γάμοι రూపంలో బహువచనమైనా, సందర్భంలో పెళ్లి వేడుక లేదా దానిలోని విందును సూచిస్తుంది. ‘పెళ్లి విందు’ ఆధునిక పాఠకునికి సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἐκλείσθη ἡ θύρα
  choice: తలుపు మూయబడింది
  rationale: గ్రీకులోని కర్మణి ప్రయోగాన్ని నిలుపుతూ, ఎవరు మూశారో అనవసరంగా నిర్దేశించకుండా దృశ్యంలోని అంతిమత్వాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని వివాహ చిత్రణ
  choice: ‘పెళ్లికుమారుడు,’ ‘పెళ్లి విందు’ అనే సాధారణ కథన పదాలను నిలుపడం
  alternative: పెళ్లికుమారుణ్ణి క్రీస్తుగా ప్రధాన పాఠ్యంలోనే వివరణాత్మకంగా గుర్తించడం; లేదా ‘వరుడు,’ ‘పెళ్లి వేడుక’ అని అనువదించడం
  rationale: ఈ వచనం ఉపమానంలోని వివాహ చిత్రణను అందిస్తుంది. దాని క్రీస్తుసంబంధ లేదా ఇతర వేదాంతార్థాన్ని అనువాదంలో బహిర్గతంగా చేర్చకుండా, పాఠ్యం మరియు సందర్భం నుంచే ఆ అర్థం వెలువడేలా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. మూలంలో కొనవలసిన వస్తువు చెప్పబడనందున ప్రధాన పాఠ్యంలో ‘నూనె’ చేర్చలేదు. అందించిన ఆంగ్ల పాఠ్యంలో [a] గుర్తు ‘buy’ తరువాత ఉన్నప్పటికీ, పాదసూచిక విషయం γάμοι (‘పెళ్లి విందు/వేడుక’) గురించినది కాబట్టి తెలుగు ప్రధాన పాఠ్యంలో సంబంధిత పదం తరువాత గుర్తు ఉంచబడింది.
