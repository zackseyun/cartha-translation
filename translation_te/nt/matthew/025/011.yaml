  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: te
  text: 'తర్వాత మిగిలిన కన్యలు[a] కూడా వచ్చి ఇలా అంటారు: ‘ప్రభువా, ప్రభువా,[b] మాకు తెరవండి.[c]’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఇతర కన్యలు.’
    reason: lexical_alternative
  - marker: b
    text: 'లేదా ‘అయ్యా, అయ్యా’ లేదా ‘యజమానీ, యజమానీ.’ గ్రీకు: ‘క్యూరియే, క్యూరియే.’'
    reason: alternative_reading
  - marker: c
    text: గ్రీకులో కేవలం ‘మాకు తెరవండి’ అని ఉంది; సందర్భాన్ని బట్టి ‘తలుపు’ అని అర్థమవుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: తర్వాత
  rationale: కథలో ఆ తరువాత జరిగిన చర్యను సూచించే కాలక్రియావిశేషణం; ఆధునిక తెలుగులో సహజంగా క్రమాన్ని తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప సంధానాన్ని సూచిస్తుంది; ‘తర్వాత’ అనే ప్రారంభమే తెలుగులో ఆ మార్పును సహజంగా తెలియజేస్తుంది.
- source_word: ἔρχονται
  choice: వచ్చి
  rationale: గ్రీకులోని కథన వర్తమానాన్ని తెలుగులో సహజమైన కథన క్రమంగా వ్యక్తం చేస్తూ, తరువాతి ‘అని అన్నారు’తో అనుసంధానిస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: ఈ కన్యలు ఇతరుల తరువాత అదే స్థలానికి చేరిన అదనపు భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: αἱ λοιπαὶ παρθένοι
  choice: మిగిలిన కన్యలు
  rationale: λοιπαί లోని ‘మిగిలిన/ఇతర’ భావాన్ని, παρθένοι లోని ‘కన్యలు’ అనే ప్రత్యక్ష అర్థాన్ని కాపాడుతుంది.
- source_word: λέγουσαι
  choice: ‘…’ అని అన్నారు
  rationale: నేరుగా పలికిన మాటలను ఆధునిక తెలుగు కథన శైలిలో సహజంగా పరిచయం చేస్తుంది.
- source_word: Κύριε κύριε
  choice: ప్రభువా, ప్రభువా
  rationale: గౌరవసంబోధనతో పాటు మత్తయి సువార్తలో ఉండగల దైవశాస్త్రీయ ప్రతిధ్వనిని కూడా నిలుపుతుంది; పునరుక్తి వారి ఆతురతను వ్యక్తం చేస్తుంది.
- source_word: ἄνοιξον ἡμῖν
  choice: మాకు తెరవండి
  rationale: ఏది తెరవాలో గ్రీకు వాక్యంలో స్పష్టంగా చెప్పలేదు; సందర్భంలో తలుపు అర్థమవుతున్నా ప్రధాన పాఠ్యంలో దానిని చేర్చకుండా, అభ్యర్థనను గౌరవపూర్వక ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: నేరుగా సంబోధించేటప్పుడు κύριος పదం అనువాదం
  choice: ప్రభువు
  alternative: అయ్యా / యజమానీ
  rationale: ఈ ఉపమానంలోని సామాజిక గౌరవసంబోధనకూ, మత్తయి రచనలోని విస్తృత దైవశాస్త్రీయ భావానికీ అవకాశం ఉండేలా ‘ప్రభువు’ అనే పదం అసలులోని ఉద్వేగాన్ని పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. ‘తెరవండి’ అనే గౌరవార్థక ఆజ్ఞారూపం సాధారణ పాఠకులకు సహజంగా ఉంటుంది; గ్రీకులో సూచితమైన ‘తలుపు’ ప్రధాన పాఠ్యంలో చేర్చబడలేదు.
