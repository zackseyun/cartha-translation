id: MAT.25.26
reference: Matthew 25:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ· Πονηρὲ δοῦλε καὶ ὀκνηρέ, ᾔδεις ὅτι θερίζω ὅπου οὐκ ἔσπειρα καὶ συνάγω ὅθεν οὐ διεσκόρπισα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: te
  text: 'అయితే అతని యజమాని జవాబుగా అతనితో ఇలా అన్నాడు: “దుష్టుడా, సోమరి దాసుడా![a] నేను విత్తని చోట కోస్తాననీ, నేను చల్లిన చోట కూడబెట్టుకుంటాననీ నీకు తెలుసా?[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దుష్టుడా, సోమరి సేవకుడా!” గ్రీకు పదం δοῦλος సందర్భానుసారంగా ‘దాసుడు’ లేదా ‘సేవకుడు’ అని అర్థమివ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'లేదా, దీనిని ప్రశ్నగా కాక ప్రకటనగా చదవవచ్చు: “నేను విత్తని చోట కోస్తాననీ, నేను చల్లిన చోట కూడబెట్టుకుంటాననీ నీకు తెలుసు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: అయితే ... ఇలా అన్నాడు
  rationale: సాధారణ గ్రీకు కథన సూత్రంలోని జవాబు భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, δέ లోని స్వల్ప వ్యతిరేక మలుపును ‘అయితే’ నిలుపుతుంది.
- source_word: ὁ κύριος αὐτοῦ
  choice: అతని యజమాని
  rationale: ఈ ఉపమానంలోని యజమాని–దాసుడు సంబంధానికి ‘యజమాని’ సరిపోతుంది; ఇక్కడ κύριος నేరుగా క్రీస్తుకు బిరుదుగా వాడబడలేదు.
- source_word: Πονηρὲ
  choice: దుష్టుడా
  rationale: ఇది కేవలం పనితీరు లోపాన్ని కాక నైతిక తప్పును సూచించే గద్దింపు.
- source_word: δοῦλε
  choice: దాసుడా
  rationale: δοῦλος సూచించే ఆధీన సామాజిక స్థితిని ‘దాసుడు’ స్పష్టంగా నిలుపుతుంది; ‘సేవకుడు’ కూడా సందర్భానుసారంగా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: ὀκνηρέ
  choice: సోమరియైన
  rationale: చర్యకు వెనుకాడే బద్ధకాన్ని సూచిస్తూ, ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: ᾔδεις ὅτι
  choice: '...అనీ నీకు తెలుసా?'
  rationale: తెలిసిన విషయాన్ని సూచించే ὅτι భావాన్ని ‘అనీ’ ద్వారా వ్యక్తం చేస్తూ, సందర్భానుసారమైన అలంకార ప్రశ్న పఠనాన్ని నిలుపుతుంది.
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: నేను విత్తని చోట కోస్తాను
  rationale: విత్తడం–కోయడం అనే వ్యవసాయ రూపకాన్ని సంక్షిప్తంగా, నేరుగా నిలుపుతుంది.
- source_word: συνάγω ὅθεν οὐ διεσκόρπισα
  choice: చల్లని చోట సమకూర్చుకుంటాను
  rationale: సమకూర్చుకోవడం అనే συνάγω భావాన్నీ, διασκορπίζω యొక్క ‘చల్లు’ భావాన్నీ అనవసరంగా ‘విత్తనం’ చేర్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: చివరి మాటల వాక్యబలం మరియు విరామచిహ్నం
  choice: యజమాని మాటలను అలంకార ప్రశ్నగా ముగించడం
  alternative: ‘నేను విత్తని చోట కోస్తాననీ, చల్లని చోట సమకూర్చుకుంటాననీ నీకు తెలుసు.’ అని ప్రకటనగా చదవడం
  rationale: గ్రీకు వాక్యానికి ప్రశ్నార్థక చిహ్నం మూలపాఠంలో నిర్ణాయకం కాదు. ముందటి వచనంలో దాసుడు చెప్పిన మాటనే యజమాని అతనికి ఎదురు తిప్పుతున్నట్లు అలంకార ప్రశ్నగా చదవవచ్చు; ప్రకటన పఠనం కూడా సాధ్యమే కాబట్టి పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథనశైలి. వ్యవసాయ రూపకాన్ని సంక్షిప్తంగా నిలిపి, మూలంలో స్పష్టంగా లేని ‘విత్తనం’ అనే కర్మను ప్రధాన వచనంలో చేర్చలేదు. ‘దాసుడు’ సామాజిక ఆధీనతను స్పష్టంగా చూపుతుంది; సాధ్యమైన ‘సేవకుడు’ పాదసూచికలో ఉంది.
