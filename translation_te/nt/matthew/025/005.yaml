  text: χρονίζοντος δὲ τοῦ νυμφίου ἐνύσταξαν πᾶσαι καὶ ἐκάθευδον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: te
  text: అయితే, పెండ్లికుమారుడు రావడం ఆలస్యమవుతుండగా[a], వారందరూ మగతపడి, నిద్రపోతూ ఉన్నారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పెండ్లికుమారుడు రావడానికి చాలా సమయం పడుతుండగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారందరూ నిద్రమత్తుకు లోనై నిద్రపోతూ ఉన్నారు.’ గ్రీకు పాఠం మగతపడడాన్ని (ἐνύσταξαν), నిద్రపోతూ ఉండడాన్ని (ἐκάθευδον) వేర్వేరుగా వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: రావడానికి ఆలస్యమవుతుండగా
  rationale: వరుడు ఆశించిన సమయంకంటే ఆలస్యంగా రావడం లేదా ఎక్కువ సమయం తీసుకోవడం అనే వర్తమాన కృదంత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; అతడు ఉద్దేశపూర్వకంగా ఆలస్యం చేశాడని నిర్ధారించదు.
- source_word: δὲ
  choice: అయితే
  rationale: కథనంలో ఏర్పడిన స్వల్ప వ్యత్యాసాన్ని, తదుపరి పరిణామాన్ని సహజంగా సూచిస్తుంది.
- source_word: νυμφίου
  choice: పెండ్లికుమారుడు
  rationale: వివాహ సందర్భంలోని νυμφίος అనే నిర్దిష్ట రూపకాన్ని గౌరవప్రదమైన, సుపరిచితమైన తెలుగు పదంతో నిలుపుతుంది.
- source_word: ἐνύσταξαν
  choice: మగత వచ్చి
  rationale: పూర్తిగా నిద్రపోవడానికి ముందు నిద్రమత్తు కలిగిన ఆరంభ దశను సూచిస్తూ, తరువాతి ἐκάθευδονతో ఉన్న భేదాన్ని కాపాడుతుంది.
- source_word: πᾶσαι
  choice: వారందరికీ
  rationale: ముందు ప్రస్తావించిన పదిమంది కన్యలందరినీ సూచించే స్త్రీలింగ బహువచన సమగ్రతను సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది.
- source_word: ἐκάθευδον
  choice: నిద్రపోతూ ఉన్నారు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని కొనసాగుతున్న నిద్ర భావాన్ని కాపాడుతుంది; కేవలం నిద్రలోకి జారుకున్న క్షణానికే పరిమితం చేయదు.
theological_decisions:
- issue: పెండ్లికుమారుని ఉపమాన రూపకం
  choice: కథలో ఉన్నట్లే ‘పెండ్లికుమారుడు’ అనే రూపకాన్ని నిలుపుతూ, అతడు ఎవరిని సూచిస్తాడో వచనంలో వివరణగా చేర్చలేదు.
  alternative: ‘వరుడు’ అని సాధారణీకరించడం లేదా క్రీస్తుతో ఉన్న సంబంధాన్ని అనువాదంలోనే స్పష్టంగా పేర్కొనడం.
  rationale: మత్తయి సువార్త విస్తృత సందర్భంలో ఈ రూపకానికి క్రీస్తుసంబంధమైన ప్రతిధ్వని ఉన్నప్పటికీ, ఈ వచనం దానిని ప్రత్యక్షంగా వివరించదు. కాబట్టి అనువాదం కథా రూపకాన్ని మాత్రమే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘మగత వచ్చి’ మరియు ‘నిద్రపోతూ ఉన్నారు’ అనే వరుస పదబంధాలు మూలంలోని రెండు దశలను, అలాగే రెండవ క్రియలోని కొనసాగుతున్న భావాన్ని నిలుపుతాయి.
