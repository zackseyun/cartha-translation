id: MAT.25.22
reference: Matthew 25:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: te
  text: అప్పుడు రెండు తలాంతులు[b] పొందినవాడు కూడా ముందుకు వచ్చి, “ప్రభువా[a], మీరు నాకు రెండు తలాంతులు అప్పగించారు. ఇదిగో, నేను ఇంకా రెండు తలాంతులు సంపాదించాను” అన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యజమానీ.” గ్రీకు పదమైన కూరియోస్ సాధారణంగా “ప్రభువు” అని అనువదించబడుతుంది; ఈ ఉపమానంలో అది యజమానిని గౌరవంగా సంబోధించే పదంగా కూడా వాడబడవచ్చు.
    reason: alternative_reading
  - marker: b
    text: తలాంతు అనేది పెద్ద మొత్తంలో ధనాన్ని సూచించే ప్రమాణం; సహజ ప్రతిభను సూచించే పదం కాదు.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: ముందుకు వచ్చి
  rationale: ప్రభువు దగ్గరకు వచ్చి మాట్లాడే కథన సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ καὶ
  choice: అప్పుడు ... కూడా
  rationale: కథన క్రమంలోని తదుపరి ఘట్టాన్ని, ముందటి సేవకునితో ఉన్న సమాంతరతను రెండింటినీ నిలుపుతుంది.
- source_word: ὁ τὰ δύο τάλαντα
  choice: రెండు తలాంతులు పొందినవాడు
  rationale: గ్రీకులో సందర్భం ద్వారా సూచితమైన వ్యక్తిని, అతనికి అందిన మొత్తంతో స్పష్టంగా గుర్తిస్తుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριος అనే సంబోధనకు సాధారణ సమానార్థకం; ఉపమాన సందర్భంలో యజమానిని గౌరవంగా సంబోధించే భావం కూడా ఉండగలదు.
- source_word: παρέδωκας
  choice: అప్పగించారు
  rationale: ఆస్తిని అతని చేతికి ఇచ్చి బాధ్యత పెట్టిన భావాన్ని, అతిగా వ్యాఖ్యానించకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἴδε
  choice: ఇదిగో
  rationale: ఫలితంపై శ్రద్ధను ఆకర్షించే గ్రీకు ఆజ్ఞార్థక ఉద్ఘాటనను సహజంగా నిలుపుతుంది.
- source_word: ἄλλα δύο τάλαντα
  choice: ఇంకా రెండు తలాంతులు
  rationale: మొదటి మొత్తానికి సమానమైన అదనపు మొత్తాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐκέρδησα
  choice: సంపాదించాను
  rationale: κερδαίνωలోని లాభం పొందడం లేదా ఆర్జించడం అనే భావాన్ని ఈ ఆర్థిక సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τάλαντα
  choice: తలాంతులు
  rationale: పెద్ద బరువు లేదా ధన ప్రమాణాన్ని సూచించే చారిత్రక పదాన్ని నిలుపుతుంది; సహజ ప్రతిభ అనే ఆధునిక భావం కాదని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: ఉపమానంలోని సంబోధనగా κύριος అనువాదం
  choice: ప్రభువా
  alternative: యజమానీ
  rationale: ‘ప్రభువు’ గ్రీకు పదానికి సాధారణ అనువాదం; అదే సమయంలో ఈ ఉపమానంలో యజమానిని గౌరవంగా సంబోధించే సామాజిక భావాన్ని పాదసూచిక ద్వారా తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి వాడబడింది. సేవకుడు యజమానితో మాట్లాడుతున్నందున బహువచన గౌరవ రూపాలు ఉపయోగించబడ్డాయి. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
