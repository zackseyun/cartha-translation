  terminology: ‘పరలోక రాజ్యం,’ ‘కన్యలు,’ ‘దీపాలు,’ ‘వరుడు’ అనే పదాలు స్థిరమైన, అర్థస్పష్టమైన పదప్రయోగాలు. λαμπάδες‌కు ‘దివిటీలు’ అనే ప్రత్యామ్నాయాన్ని ఇవ్వడం సరైనది. పాదటిప్పణి గుర్తులు పాఠంలోని సంబంధిత పదాలకు సక్రమంగా అనుసంధానించబడ్డాయి.
