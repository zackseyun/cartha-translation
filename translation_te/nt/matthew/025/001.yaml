id: MAT.25.1
reference: Matthew 25:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: te
  text: అప్పుడు పరలోక రాజ్యం, తమ దీపాలు[b] తీసుకొని వరునికి ఎదురేగడానికి బయలుదేరిన పదిమంది కన్యలవలె ఉంటుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మూలభాషలోని క్రియ కర్మణి రూపంలో ఉంది: “పదిమంది కన్యలతో పోల్చబడుతుంది” అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: “దివిటీలు” అని కూడా అనువదించవచ్చు. ఈ గ్రీకు పదం ఊరేగింపులో చేతితో పట్టుకునే దీపాన్ని లేదా దివిటీని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: అప్పుడు
  rationale: ముందున్న అంత్యకాల సందర్భంతో ఈ ఉపమానాన్ని కలిపే కాలసూచక పదాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁμοιωθήσεται
  choice: వలె ఉంటుంది
  rationale: గ్రీకులో ఇది భవిష్యత్ కర్మణి రూపమైనా, తెలుగు ఉపమాన శైలిలో ‘వలె ఉంటుంది’ సహజంగా, స్పష్టంగా ఉంటుంది; కర్మణి భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: పరలోక రాజ్యం
  rationale: మత్తయి సువార్తలోని స్థిరమైన పదబంధానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: δέκα παρθένοις
  choice: పదిమంది కన్యలు
  rationale: పెళ్లి సందర్భంలో παρθένος సూచించే అవివాహిత యువతుల భావాన్ని, పదంలోని కన్యత్వ సూచనను కూడా నిలుపుతుంది.
- source_word: τὰς λαμπάδας ἑαυτῶν
  choice: తమ దీపాలు
  rationale: λαμπάς చేతిలో పట్టుకునే దీపాన్నిగానీ దివిటీనిగానీ సూచించవచ్చు. ప్రధాన పాఠంలో సుపరిచితమైన ‘దీపాలు’ వాడి, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἐξῆλθον εἰς ὑπάντησιν
  choice: ఎదురేగడానికి బయలుదేరిన
  rationale: ఒకరిని కలుసుకొని స్వాగతించేందుకు బయటకు వెళ్లే ఊరేగింపు సందర్భాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τοῦ νυμφίου
  choice: వరుడు
  rationale: పెళ్లి సందర్భంలోని νυμφίοςకు ఆధునిక తెలుగులో సహజమైన, స్పష్టమైన సమానార్థకం.
theological_decisions:
- issue: ఉపమానాన్ని పరిచయం చేసే కర్మణి క్రియారూపం
  choice: పరలోక రాజ్యం ... కన్యలవలె ఉంటుంది
  alternative: పరలోక రాజ్యం ... కన్యలతో పోల్చబడుతుంది
  rationale: తెలుగులో కర్మణి రూపం భారంగా వినిపిస్తుంది. ప్రధాన పాఠం పోలికను సహజంగా వ్యక్తం చేస్తూ, మూలంలోని కర్మణి రూపాన్ని పాదటిప్పణిలో వెల్లడిస్తుంది; తద్వారా భావాన్ని సిద్ధాంతపరంగా విస్తరించదు.
- issue: παρθένοις పదం
  choice: కన్యలు
  alternative: అవివాహిత యువతులు
  rationale: ‘కన్యలు’ మూలపదంలోని ప్రత్యేకతను నిలుపుతుంది. విస్తృతమైన ప్రత్యామ్నాయం ఆ పదంలోని కన్యత్వ సూచనను తగ్గించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘ఎదురేగడం’ పెళ్లి ఊరేగింపు సందర్భంలో వరుణ్ణి కలుసుకొని స్వాగతించేందుకు వెళ్లే భావాన్ని తెలియజేస్తుంది.
