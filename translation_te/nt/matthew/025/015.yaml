  source_fidelity: The distributive allocation, the implied final unit, and the criterion of each recipient's individual capacity are accurately represented. ‘తలాంతులు’ correctly retains τάλαντα as historical monetary/weight units rather than modern natural talents. The main rendering follows the supplied English audit trail in connecting εὐθέως with the master's departure, while footnote c appropriately preserves the possible connection with the action beginning in the following verse.
