id: MAT.25.15
reference: Matthew 25:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: te
  text: అతడు ఒకరికి ఐదు తలాంతులు[a], మరొకరికి రెండు, ఇంకొకరికి ఒక తలాంతు ఇచ్చి, ఒక్కొక్కరి సామర్థ్యానికి తగినట్లుగా[b], వెంటనే[c] ప్రయాణానికి వెళ్లిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘తలాంతు’ సహజ ప్రతిభ లేదా నైపుణ్యం కాదు; అది చాలా పెద్ద విలువగల ప్రాచీన బరువు లేదా ధన ప్రమాణం. మరో విధంగా: ‘పెద్ద మొత్తాల డబ్బు.’'
    reason: lexical_alternative
  - marker: b
    text: 'మరింత అక్షరార్థంగా: ‘ప్రతి ఒక్కరికీ తన సొంత సామర్థ్యానికి తగినట్లు.’'
    reason: lexical_alternative
  - marker: c
    text: ‘వెంటనే’ అనే మాటను తరువాతి వచనంతో కలిపి, ‘వెంటనే ఐదు తలాంతులు పొందినవాడు వెళ్లి…’ అని కూడా చదవవచ్చు.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: τάλαντα
  choice: తలాంతులు
  rationale: ఇది సహజ నైపుణ్యాన్ని కాక, పెద్ద మొత్తాన్ని సూచించే ప్రాచీన బరువు/ధన ప్రమాణాన్ని సూచిస్తుంది. చారిత్రక పదాన్ని నిలుపుతూ దాని అర్థాన్ని పాదటీకలో స్పష్టం చేశాం.
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: ఒకనికి ... మరొకనికి ... ఇంకొకనికి
  rationale: వేర్వేరు స్వీకర్తలకు వేర్వేరు మొత్తాలు ఇచ్చిన పంపిణీ భావాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది.
- source_word: ἕν
  choice: ఒకటి
  rationale: ముందు వచ్చిన ‘తలాంతులు’ అనే నామవాచకం ఇక్కడ అధ్యాహారంగా ఉంది; తెలుగులో ‘ఒకటి’ అనడం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: ఒక్కొక్కరి సామర్థ్యానికి తగినట్లు
  rationale: δύναμις ఇక్కడ అద్భుత శక్తిని కాక వ్యక్తిగత సామర్థ్యాన్ని సూచిస్తుంది. ఈ రూపం గ్రీకు వాక్యంలోని పంపిణీ భావాన్నీ ఏకవచన సంబంధాన్నీ సహజంగా అందిస్తుంది.
- source_word: ἀπεδήμησεν
  choice: ప్రయాణమై వెళ్లిపోయాడు
  rationale: ఈ క్రియలో కేవలం వెళ్లడం మాత్రమే కాక, తన నివాస స్థలం విడిచి ప్రయాణంగా దూరంగా వెళ్లడం అనే ఛాయ ఉంది.
- source_word: εὐθέως
  choice: వెంటనే
  rationale: కాలసూచక క్రియావిశేషణానికి సరళమైన ఆధునిక తెలుగు సమానం; ఇది ముందు క్రియతోనా తరువాతి వచనంలోని చర్యతోనా కలుస్తుందనే నిర్మాణాత్మక సందిగ్ధతను పాదటీకలో నిలిపాం.
theological_decisions:
- issue: పంపిణీ వాక్యంలో ఏకవచన స్వీయసూచన
  choice: ఒక్కొక్కరి సామర్థ్యానికి తగినట్లు
  alternative: ప్రతి ఒక్కరికీ తన సొంత సామర్థ్యానికి తగినట్లు
  rationale: గ్రీకులోని ఏకవచన పంపిణీ భావాన్ని నిలుపుతూ, తెలుగులో అనవసరమైన లింగ నిర్దేశం లేకుండా సహజంగా వ్యక్తపరుస్తుంది.
- issue: ఉపమానంలో τάλαντα అర్థం
  choice: ధన ప్రమాణాలుగా ‘తలాంతులు’
  alternative: పెద్ద మొత్తాల డబ్బు
  rationale: సందర్భం అప్పగించిన ఆస్తి మరియు ఆర్థిక నిర్వహణకు సంబంధించినది; ఆధునిక అర్థంలో సహజ ప్రతిభలు అని అపార్థం కాకుండా పాదటీక స్పష్టం చేస్తుంది.
- issue: εὐθέως ఏ చర్యతో సంబంధిస్తుంది
  choice: ఈ వచనంలో యజమాని వెళ్లిపోవడంతో అనుసంధానం
  alternative: తరువాతి వచనంలో ఐదు తలాంతులు పొందినవాని చర్యతో అనుసంధానం
  rationale: ఇచ్చిన వచన విభజన మరియు సంప్రదింపుకై ఇచ్చిన ఆంగ్ల పాఠాన్ని అనుసరించి ప్రధాన పాఠంలో వెళ్లిపోవడంతో కలిపాం; గ్రీకు పదక్రమం అనుమతించే మరో అనుసంధానాన్ని పాదటీకలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘తలాంతులు’ అనే పరిచిత చారిత్రక పదాన్ని ఉంచి దాని ప్రాచీన ఆర్థిక అర్థాన్ని పాదటీకలో వివరించాం. మూలంలోని εὐθέως అనుసంధాన సందిగ్ధతను మౌనంగా పరిష్కరించకుండా ప్రత్యేక పాదటీకలో నిలిపాం.
