revisions:
- from: భయపడి, వెళ్లి నీ తలాంతును[a] నేలలో దాచిపెట్టాను. ఇదిగో, నీది నీకు ఉంది.
  to: భయపడి, వెళ్లి నీ తలాంతును[a] నేలలో దాచిపెట్టాను. ఇదిగో, నీది నీ దగ్గరే ఉంది.
  rationale: The revision retains the draft’s faithful rendering of the Greek participial sequence, concealment in the ground, and the historical term ‘తలాంతు.’ It improves only the final possessive-return idiom and makes the explanatory footnote more direct and natural in modern Telugu.
  reviewer_model: gpt-5.6-terra
