id: MAT.25.25
reference: Matthew 25:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: te
  text: భయపడి, వెళ్లి నీ తలాంతును[a] నేలలో దాచిపెట్టాను. ఇదిగో, నీది నీ దగ్గరే ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తలాంతు’ అనేది సహజ ప్రతిభను సూచించే పదం కాదు; అది అధిక విలువగల ప్రాచీన ధన ప్రమాణం.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: భయపడి
  rationale: కారణాన్ని సూచించే క్రియావిశేషణాత్మక భూతకృదంత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; దీనిని భక్తిపూర్వక భయంగా ప్రత్యేకంగా అర్థం చేయదు.
- source_word: ἀπελθὼν
  choice: వెళ్లి
  rationale: ἔκρυψαకు ముందు జరిగిన చర్యను సంక్షిప్తమైన తెలుగు క్రియాక్రమంలో సహజంగా చూపుతుంది.
- source_word: ἔκρυψα
  choice: దాచిపెట్టాను
  rationale: κρύπτω యొక్క ‘దాచు’ అనే నేర అర్థాన్ని ఇస్తుంది; ‘పాతిపెట్టాను’ అని క్రియలోనే అదనపు భావాన్ని చేర్చకుండా, నేలలో అనే తరువాతి పదబంధమే సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: τὸ τάλαντόν σου
  choice: నీ తలాంతును
  rationale: పెద్ద విలువగల ప్రాచీన బరువు/ధన ప్రమాణానికి వాడిన చారిత్రక పదాన్ని నిలుపుతుంది; సహజ ప్రతిభ అనే ఆధునిక భావం రాకుండా పాదసూచికలో వివరిస్తుంది.
- source_word: ἐν τῇ γῇ
  choice: నేలలో
  rationale: దాచిన స్థలాన్ని సూచించే γῆకు సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: ἴδε
  choice: ఇదిగో
  rationale: శ్రద్ధను ఆకర్షిస్తూ ఎదుట ఉన్నదాన్ని చూపించే గ్రీకు ఉద్గారానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: ἔχεις τὸ σόν
  choice: నీది నీకు ఉంది
  rationale: ‘నీకు చెందినది నీ దగ్గరే ఉంది’ అనే స్వామ్య ఉద్ఘాటనను, మూలంలోని సంక్షిప్తతను సాధ్యమైనంతగా నిలుపుతుంది.
theological_decisions:
- issue: τάλαντον అనే పదం సహజ ప్రతిభను సూచిస్తుందా, ధన ప్రమాణాన్ని సూచిస్తుందా
  choice: ప్రధాన పాఠ్యంలో చారిత్రక పదమైన ‘తలాంతు’ను ఉంచి, అది పెద్ద మొత్తపు ధన విలువగల ప్రమాణమని పాదసూచికలో వివరించడం.
  alternative: పెద్ద మొత్తం డబ్బు
  rationale: ఇక్కడ గ్రీకు పదం సహజ సామర్థ్యాన్ని కాదు, అధిక విలువగల బరువు/ధన ప్రమాణాన్ని సూచిస్తుంది. చారిత్రక రూపాన్ని ఉంచడం ఉపమానంలోని పదప్రయోగాన్ని కాపాడుతుంది; పాదసూచిక ఆధునిక అపార్థాన్ని నివారిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన క్రియాక్రమం, గౌరవప్రదమైన కానీ పాతబడ్డది కాని శైలి ఉపయోగించబడింది. యజమానితో సేవకుడు మాట్లాడే సందర్భానికి తగిన ఏకవచన సంబోధనను నిలుపుకున్నాం.
