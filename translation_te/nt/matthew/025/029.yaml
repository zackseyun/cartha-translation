id: MAT.25.29
reference: Matthew 25:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: te
  text: ఎందుకంటే, కలిగిన ప్రతి ఒక్కరికీ మరింత ఇవ్వబడుతుంది, అతనికి సమృద్ధి కలుగుతుంది; కాని లేనివాని నుండి, అతనికి ఉన్నది కూడా తీసివేయబడుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: ఎందుకంటే, కలిగిన ప్రతి ఒక్కరికీ
  rationale: γάρ ముందున్న మాటకు వివరణాత్మక ఆధారాన్ని ఇస్తుంది; దానిని ‘ఎందుకంటే’ అని సహజంగా అనుసంధానించాం. దత్తివిభక్తిలోని substantival participle మరియు παντί కలిపి పంపిణీ భావంతో ‘కలిగిన ప్రతి ఒక్కరికీ’ అని అనువదించాం.
- source_word: δοθήσεται
  choice: ఇంకా ఇవ్వబడుతుంది
  rationale: δίδωμι యొక్క భవిష్యత్ కర్మణి రూపాన్ని కర్మణి వాక్యంగానే నిలిపాం. సందర్భం సూచించే అదనపు దానిని తెలుపడానికి ‘ఇంకా’ వాడాం.
- source_word: περισσευθήσεται
  choice: అతనికి సమృద్ధిగా కలుగుతుంది
  rationale: περισσεύω ఇక్కడ ఫలితంగా సమృద్ధి కలగడాన్ని సూచిస్తుంది. తెలుగు సహజత్వంతో పాటు surplus/abundance భావాన్ని నిలిపే రూపం ఇది.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: కాని లేనివాని దగ్గరనుండి
  rationale: వ్యతిరేకతను δέ ప్రకారం ‘కాని’తో చూపించాం; ఏది లేదో సందర్భం ద్వారా ఉద్దేశపూర్వకంగా అనిర్దిష్టంగానే ఉండేలా ‘లేనివాడు’ అన్న ప్రతినిధి ఏకవచనాన్ని నిలిపాం.
- source_word: καὶ ὃ ἔχει
  choice: అతనికి ఉన్నది కూడా
  rationale: 'καί ఇక్కడ అధికోక్తి/ఆరోహణ భావంలో ‘కూడా’గా ఉంది: లేనివాడని చెప్పబడిన అతనికి ప్రస్తుతం ఉన్నదే తీసివేయబడే విరోధాభాసాన్ని ఇది నిలుపుతుంది.'
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: అతని దగ్గరనుండి ... తీసివేయబడుతుంది
  rationale: αἴρω యొక్క ‘తీసివేయు’ భావాన్ని, ἀπό సూచించే వేరుచేయడాన్ని, భవిష్యత్ కర్మణి నిర్మాణాన్ని స్పష్టంగా నిలిపాం.
theological_decisions:
- issue: కలిగి ఉండడం/లేకపోవడం దేనిని సూచిస్తుందనే భావం
  choice: వచనంలో వస్తువు లేదా ఆధ్యాత్మిక అర్థాన్ని చేర్చకుండా ‘కలిగిన’ మరియు ‘లేనివాడు’గా అనిర్దిష్టతను నిలుపడం
  alternative: ‘వరాలు/ధనం/విశ్వాసం కలిగినవాడు’ వంటి వివరణాత్మక పదాన్ని చేర్చడం
  rationale: గ్రీకు పాఠం ఇక్కడ కర్మను స్పష్టంగా పేర్కొనదు. ఉపమాన సందర్భం అర్థాన్ని నిర్దేశించగలిగినా, అనువాదంలో ఒకే సిద్ధాంతపరమైన వివరణను బలవంతంగా చేర్చకూడదు.
- issue: వ్యాకరణపరంగా పుంలింగ ఏకవచనమైన సాధారణ సూచన
  choice: ‘ప్రతి ఒక్కరికీ ... అతనికి’ మరియు ‘లేనివాని ... అతనికి’ అనే ప్రతినిధి ఏకవచన నిర్మాణం
  alternative: ‘కలిగినవారికి ... వారికి’ అనే బహువచన నిర్మాణం
  rationale: గ్రీకు పుంలింగ ఏకవచన participial నిర్మాణానికి సాధారణ మానవ సూచన ఉంది. ఆధునిక తెలుగులో అర్థమయ్యేలా, మూలంలోని ఏకవచన తార్కిక సమాంతరతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే, గంభీరమైన వాక్యనిర్మాణం. మూలంలోని వివరణాత్మక γάρ, కర్మణి క్రియలు, ఏకవచన సమాంతరత, మరియు ఉద్దేశపూర్వక అనిర్దిష్టతను కాపాడుతూ సహజ తెలుగు ప్రవాహం కోసం పరిమిత పదక్రమ సర్దుబాటు చేశాం.
