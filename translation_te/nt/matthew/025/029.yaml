revisions:
- from: ఎందుకంటే, కలిగిన ప్రతి ఒక్కరికీ ఇంకా ఇవ్వబడుతుంది; అతనికి సమృద్ధిగా కలుగుతుంది. కాని లేనివాని దగ్గరనుండి, అతనికి ఉన్నది కూడా తీసివేయబడుతుంది.
  to: ఎందుకంటే, కలిగిన ప్రతి ఒక్కరికీ మరింత ఇవ్వబడుతుంది, అతనికి సమృద్ధి కలుగుతుంది; కాని లేనివాని నుండి, అతనికి ఉన్నది కూడా తీసివేయబడుతుంది.
  rationale: 'This light revision retains all source-level ambiguities and the generic singular structure while improving Telugu cohesion and idiom. No footnote is needed: the abundance sense is adequately represented in the text, and no textual or lexical ambiguity requires explanation for this translation.'
