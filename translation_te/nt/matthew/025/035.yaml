id: MAT.25.35
reference: Matthew 25:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: te
  text: ఎందుకంటే నేను ఆకలితో ఉన్నాను, మీరు నాకు తినడానికి ఏదో ఇచ్చారు; నేను దాహంతో ఉన్నాను, మీరు నాకు తాగడానికి ఏదో ఇచ్చారు; నేను పరదేశిగా ఉన్నాను, మీరు నన్ను చేర్చుకున్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు నన్ను ఆతిథ్యంతో స్వీకరించారు.” గ్రీకు క్రియకు అక్షరార్థంగా ‘కూడగట్టారు’ లేదా ‘చేర్చారు’ అనే భావం ఉంది; ఇక్కడ అది పరదేశిని ఆతిథ్యంతో స్వీకరించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: నేను ఆకలితో ఉన్నాను
  rationale: గతంలో అనుభవించిన ఆకలి స్థితిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే అనుసంధాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: మీరు నాకు తినడానికి ఇచ్చారు
  rationale: δίδωμι + దత్తివిభక్తి + క్రియార్థక రూపం కలిగిన నిర్మాణాన్ని సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని నిర్దిష్ట ఆహార పదార్థాన్ని చేర్చదు.
- source_word: ἐδίψησα
  choice: నేను దాహంతో ఉన్నాను
  rationale: దాహాన్ని అనుభవించిన గత స్థితిని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐποτίσατέ με
  choice: మీరు నాకు తాగడానికి ఇచ్చారు
  rationale: పానీయం ఇచ్చారనే సందర్భోచిత భావాన్ని నిలుపుతూ, మూలంలో ప్రత్యేకంగా లేని ‘నీళ్లు’ అనే పదాన్ని చేర్చదు.
- source_word: ξένος
  choice: పరదేశిగా
  rationale: సాధారణ సామాజిక ఆశ్రయం లేదా పరిచయం లేని వ్యక్తి అనే సందర్భార్థాన్ని మోస్తుంది; ఆధునిక చట్టపరమైన వర్గీకరణను అనవసరంగా దిగుమతి చేయదు.
- source_word: συνηγάγετέ με
  choice: మీరు నన్ను ఆదరించి చేర్చుకున్నారు
  rationale: συνάγω యొక్క ‘చేర్చుకోవడం’ అనే మూలభావంతో పాటు, ξένος ఉన్న ఈ సందర్భంలోని ఆతిథ్యపూర్వక స్వీకరణను సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ξένος … συνηγάγετέ με లోని ఆతిథ్య భావం
  choice: ‘నేను పరదేశిగా ఉన్నాను, మీరు నన్ను ఆదరించి చేర్చుకున్నారు’ అని వ్యక్తిగతమైన ఆతిథ్య స్వీకరణగా అనువదించడం.
  alternative: ‘నేను అపరిచితుడిగా ఉన్నాను, మీరు నన్ను స్వీకరించారు’ లేదా ‘నేను పరదేశిగా ఉన్నాను, మీరు నన్ను చేర్చుకున్నారు.’
  rationale: బలహీన స్థితిలో ఉన్న వ్యక్తిని కరుణతో స్వీకరించడమే ఇక్కడి ప్రధాన భావం. ‘ఆదరించి చేర్చుకున్నారు’ అనేది జాతి, పౌరసత్వం లేదా ఆధునిక రాజకీయ వర్గాలను చొప్పించకుండా ఆ నైతిక బలాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన వాక్యనిర్మాణం ఉపయోగించబడింది. సమాంతర ఉపవాక్యాల లయను నిలుపుతూ, మూలంలోని కారణసూచక అనుసంధానాన్ని మరియు ఆతిథ్య భావంలోని స్వల్ప పదార్థ విస్తృతిని కాపాడింది.
