id: MAT.25.36
reference: Matthew 25:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: te
  text: నేను బట్టలు లేనివాడిగా ఉన్నాను, మీరు నాకు బట్టలు తొడిగారు; నేను అనారోగ్యంతో ఉన్నాను, మీరు నన్ను సందర్శించారు[a]; నేను చెరసాలలో ఉన్నాను, మీరు నా దగ్గరికి వచ్చారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నన్ను శ్రద్ధగా చూసుకున్నారు.” గ్రీకు క్రియలో శ్రద్ధతో సందర్శించడం లేదా పట్టించుకోవడం అనే భావం ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: బట్టలు లేనివాడిగా
  rationale: మూలపదం నగ్నత్వాన్ని లేదా దుస్తులు లేకపోవడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ఇది సహజంగా ఉండి, అనవసరమైన లైంగిక లేదా అవమానకర భావఛాయను తగ్గిస్తూ దుస్తుల అవసరాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: περιεβάλετέ
  choice: బట్టలు తొడిగారు
  rationale: περιβάλλω ఇక్కడ ఒకరికి దుస్తులు వేయడాన్ని సూచిస్తుంది. ఈ తెలుగు ప్రయోగం స్పష్టమైన, కార్యరూపమైన దయను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἠσθένησα
  choice: నేను అనారోగ్యంతో ఉన్నాను
  rationale: ἀσθενέω బలహీనతను కూడా సూచించగలిగినా, ఈ సందర్భంలో శారీరక అనారోగ్యం ప్రధాన భావం; ఈ రూపం ఆధునిక ప్రామాణిక తెలుగులో సహజం.
- source_word: ἐπεσκέψασθέ
  choice: పరామర్శించారు
  rationale: ἐπισκέπτομαι సందర్శించడంతో పాటు శ్రద్ధతో వచ్చి చూడటం అనే భావాన్ని కలిగి ఉండగలదు. ‘పరామర్శించారు’ ఆ శ్రద్ధను సహజంగా తెలియజేస్తుంది; పూర్తి సంరక్షణ చేశారని అతిగా విస్తరించదు.
- source_word: φυλακῇ
  choice: చెరసాలలో
  rationale: φυλακή నిర్బంధ స్థలాన్ని సూచిస్తుంది. ‘చెరసాల’ గౌరవప్రదమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: ἤλθατε πρός με
  choice: మీరు నా దగ్గరికి వచ్చారు
  rationale: గ్రీకు వాక్యంలోని సరళమైన ‘నా వద్దకు వచ్చారు’ అనే భావాన్ని అలాగే ఉంచి, ‘సందర్శించారు’ అనే అదనపు అర్థాన్ని దిగుమతి చేయదు.
theological_decisions:
- issue: దయాకార్యాల భాషలో వ్యాఖ్యానాత్మక విస్తరణ స్థాయి
  choice: ‘బట్టలు తొడిగారు,’ ‘పరామర్శించారు,’ ‘నా దగ్గరికి వచ్చారు’ అనే నిర్దిష్ట చర్యలను నిలుపుకోవడం
  alternative: ‘నన్ను చూసుకున్నారు’ లేదా ‘నన్ను సందర్శించడానికి వచ్చారు’ అని విస్తరించడం
  rationale: మూలంలోని ప్రత్యక్ష, స్పష్టమైన దయాకార్యాలను నిలుపుకోవడం వల్ల వాక్యానికి అదనపు సేవా లేదా సంరక్షణ భావాలను బలవంతంగా చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం. మూడు సమాంతర దయాకార్యాల లయను కాపాడింది.
