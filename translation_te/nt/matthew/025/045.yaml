id: MAT.25.45
reference: Matthew 25:45
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: te
  text: 'అప్పుడు ఆయన వారికి ఇలా జవాబిస్తాడు: “నేను మీతో నిశ్చయంగా చెబుతున్నాను[a]: ఈ అత్యల్పులలో ఒక్కరికి[b] మీరు చేయని మేరకు, నాకు కూడా చేయలేదు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత రూపసన్నిహితంగా: “ఆమేన్, నేను మీతో చెబుతున్నాను.”'
    reason: lexical_alternative
  - marker: b
    text: “ఈ అత్యల్పులు” అనేది ప్రత్యేకంగా యేసు శిష్యులను సూచిస్తుందని లేదా మరింత విస్తృతంగా దీనులు, అవసరంలో ఉన్నవారిని సూచిస్తుందని అర్థం చేసుకోవచ్చు; అనువాదం మూలపాఠంలోని పదబంధాన్ని నిర్వచించకుండా ఉంచుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: తీర్పు దృశ్యంలో సంఘటనల క్రమాన్ని సూచించే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: ఆయన వారికి ఇలా జవాబిస్తాడు
  rationale: భవిష్యత్ క్రియార్థాన్ని నిలుపుతూ, గ్రీకు భాషలోని జవాబిచ్చి చెప్పడం అనే నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: నేను మీతో నిశ్చయంగా చెబుతున్నాను
  rationale: యేసు వాడే గంభీరమైన ధృవీకరణ సూత్రంలోని బలాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘ఆమేన్’ అనే మరింత రూపసన్నిహిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: ἐφ’ ὅσον οὐκ ἐποιήσατε
  choice: మీరు చేయనంతవరకు
  rationale: ἐφ’ ὅσον లోని మేర లేదా పరిమాణ సంబంధాన్ని ‘ఎందుకంటే’గా సరళీకరించకుండా నిలుపుతుంది; ముందరి సందర్భంలో చెప్పిన కార్యాలు ఇక్కడ అంతర్లీన కర్మగా ఉన్నాయి.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: వీరిలో అత్యల్పులైన వారిలో ఒక్కరికి
  rationale: ἑνί లోని ఏకవచన ప్రతినిధిత్వాన్ని, ἐλαχίστων లోని అత్యున్నత స్థాయి భావాన్ని నిలుపుతుంది.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: నాకు కూడా చేయలేదు
  rationale: మొదటి నిరాకరణకు అనుసంధానమైన బలమైన ప్రతికూల నిర్ణయాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, యేసుతో నేరమైన గుర్తింపును నిలుపుతుంది.
theological_decisions:
- issue: ‘వీరిలో అత్యల్పులు’ అనే వారి గుర్తింపు
  choice: ఈ పదబంధాన్ని నిర్వచించకుండా యథాతథంగా ఉంచి, వారిలో ఒక్కరికి చేయకపోవడం యేసుకు చేయకపోవడమే అనే నేరమైన గుర్తింపును నిలిపింది.
  alternative: ఈ పదబంధం ప్రత్యేకంగా యేసు శిష్యులు లేదా సందేశకులను సూచిస్తుంది; లేదా మరింత విస్తృతంగా దీనులు, అవసరంలో ఉన్నవారిని సూచిస్తుంది.
  rationale: ఈ వచనం గుర్తింపును స్పష్టంగా ప్రకటించినా, ఆ సమూహం పరిధిపై ఉన్న వ్యాఖ్యాన భేదాన్ని అనువాదంలోనే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘అత్యల్పులు’ మూలంలోని superlative భావాన్ని నిలుపుతుంది. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
