review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the future response, the solemn affirmation, the representative singular (“one”), and the identification of neglect toward the least with neglect toward Jesus. However, “చేయనంతవరకు” normally means “until [you] do not do” and does not express ἐφ’ ὅσον (“insofar as/to the extent that”) accurately.
  naturalness: The revised wording uses idiomatic modern Telugu. “ఈ అత్యల్పులలో ఒక్కరికి” is clearer and less cumbersome than “వీరిలో అత్యల్పులైన వారిలో ఒక్కరికి,” while preserving the Greek phrase’s singular-within-a-plural-group construction.
  terminology: “నిశ్చయంగా చెబుతున్నాను” suitably conveys the emphatic Ἀμὴν λέγω ὑμῖν, with “ఆమేన్” retained as a formal alternative. “అత్యల్పులు” appropriately represents ἐλαχίστων. The interpretively open referent is retained without doctrinal narrowing.
  issues:
  - severity: medium
    issue: The phrase “మీరు చేయనంతవరకు” does not convey ἐφ’ ὅσον.
    rationale: 'In Telugu, “-నంతవరకు” ordinarily has a temporal ‘until’ sense. The Greek construction expresses extent/measure: ‘insofar as’ or ‘to the extent that.’ “చేయని మేరకు” preserves this force.'
  - severity: low
    issue: The phrase for ‘one of these least’ is unnecessarily repetitive.
    rationale: “వీరిలో అత్యల్పులైన వారిలో ఒక్కరికి” is intelligible but heavy. “ఈ అత్యల్పులలో ఒక్కరికి” is natural and retains the singular ‘one’ and plural ‘least.’
  - severity: low
    issue: Footnote b should match the wording in the revised main text.
    rationale: Its quoted phrase should be updated from “వీరిలో అత్యల్పులు” to “ఈ అత్యల్పులు.”
  revised_text: 'అప్పుడు ఆయన వారికి ఇలా జవాబిస్తాడు: “నేను మీతో నిశ్చయంగా చెబుతున్నాను[a]: ఈ అత్యల్పులలో ఒక్కరికి[b] మీరు చేయని మేరకు, నాకు కూడా చేయలేదు.”'
