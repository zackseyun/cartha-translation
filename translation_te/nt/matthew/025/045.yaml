    reason: lexical_alternative
  - marker: b
    text: “ఈ అత్యల్పులు” అనేది ప్రత్యేకంగా యేసు శిష్యులను సూచిస్తుందని లేదా మరింత విస్తృతంగా దీనులు, అవసరంలో ఉన్నవారిని సూచిస్తుందని అర్థం చేసుకోవచ్చు; అనువాదం మూలపాఠంలోని పదబంధాన్ని నిర్వచించకుండా ఉంచుతుంది.
