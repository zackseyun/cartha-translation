revisions:
- from: 'అప్పుడు ఆయన వారికి ఇలా జవాబిస్తాడు: “నేను మీతో నిశ్చయంగా చెబుతున్నాను[a]: వీరిలో అత్యల్పులైన వారిలో ఒక్కరికి మీరు చేయనంతవరకు, నాకు కూడా చేయలేదు.”[b]'
  to: 'అప్పుడు ఆయన వారికి ఇలా జవాబిస్తాడు: “నేను మీతో నిశ్చయంగా చెబుతున్నాను[a]: ఈ అత్యల్పులలో ఒక్కరికి[b] మీరు చేయని మేరకు, నాకు కూడా చేయలేదు.”'
  rationale: The revision corrects the extent expression for ἐφ’ ὅσον, improves the natural Telugu rendering of ἑνὶ τούτων τῶν ἐλαχίστων, and aligns the related footnote with the revised wording. It preserves the source text’s ambiguity concerning the identity of ‘the least.’
  reviewer_model: gpt-5.6-terra
