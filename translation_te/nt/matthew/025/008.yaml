source:
  edition: SBLGNT
  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: te
  text: 'అయితే, బుద్ధిలేని కన్యలు బుద్ధిమంతులైన కన్యలతో ఇలా అన్నారు: “మా దీపాలు[a] ఆరిపోతున్నాయి కాబట్టి, మీ నూనెలో కొంచెం మాకు ఇవ్వండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కాగడాలు.” గ్రీకు పదం λαμπάδες చేతిలో పట్టుకునే మండే వెలుగు సాధనాన్ని సూచించవచ్చు; ఈ దృశ్యాన్ని ఎలా అర్థం చేసుకుంటారనే దానిని బట్టి అనువాదాలు భిన్నంగా ఉంటాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: బుద్ధిలేనివారు
  rationale: ఈ విశేషణం నామవాచకంగా వాడబడి, ఉపమానంలోని సిద్ధపడని కన్యల గుంపును సూచిస్తుంది. φρονίμοιςతో ఉన్న స్పష్టమైన వ్యతిరేకతను ఈ సహజ తెలుగు పదం నిలుపుతుంది.
- source_word: φρονίμοις
  choice: బుద్ధిమంతులతో
  rationale: ఈ సందర్భంలో ఆచరణాత్మక వివేకం, సిద్ధపాటు అనే భావాలు ఉన్నాయి. μωραὶకి సహజమైన వ్యతిరేక పదంగా ఇది సరిపోతుంది.
- source_word: Δότε
  choice: ఇవ్వండి
  rationale: ఇది బహువచన ఆజ్ఞార్థక రూపం; సందర్భంలో నేరుగా చేసిన అభ్యర్థనను మర్యాదాపూర్వక ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: మీ నూనెలో కొంచెం
  rationale: ἐκ + షష్ఠీ విభక్తి వారి నూనె నిల్వలోని కొంత భాగాన్ని సూచిస్తుంది; తెలుగులో భాగార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λαμπάδες
  choice: దీపాలు
  rationale: λαμπάς చేతిలో పట్టుకునే మండే వెలుగు సాధనాన్ని సూచించగలదు. నూనె సందర్భంలో ‘దీపాలు’ సహజంగా ఉంది; ‘కాగడాలు’ కూడా సాధ్యమని పాదటిప్పణిలో నిలుపబడింది.
- source_word: σβέννυνται
  choice: ఆరిపోతున్నాయి
  rationale: వర్తమాన రూపం జ్వాలలు అప్పుడే క్రమంగా ఆరుతున్న ప్రక్రియను సూచిస్తుంది; ఈ తెలుగు రూపం ఆ కొనసాగుతున్న భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: ὅτι
  choice: కాబట్టి
  rationale: వారి అభ్యర్థనకు కారణాన్ని తెలియజేస్తుంది. తెలుగు వాక్య నిర్మాణంలో కారణ వాక్యాంశం ముందుగా రావడం సహజం.
