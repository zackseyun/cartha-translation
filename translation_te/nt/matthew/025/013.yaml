base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: te
  text: కాబట్టి మెలకువగా ఉండండి[a]; ఎందుకంటే ఆ రోజు గానీ, ఆ గంట గానీ మీకు తెలియదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కాపలా కాస్తూ ఉండండి’ లేదా ‘అప్రమత్తంగా ఉండండి.’ గ్రీకు ఆజ్ఞ నిరంతరం జాగ్రత్తగా ఉండాలనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: మెలకువగా ఉండండి
  rationale: వర్తమానకాల ఆజ్ఞారూపం నిరంతర అప్రమత్తతను సూచిస్తుంది. ఈ ఎంపిక ఉపమానంలోని మేల్కొని ఉండే చిత్రాన్ని నిలుపుతూ సహజమైన ఆధునిక తెలుగులో ఉంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న ఉపమానం నుండి వచ్చే నిర్ధారణను సహజంగా సూచిస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఆజ్ఞకు కారణాన్ని పరిచయం చేసే కారణార్థక బలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οὐκ οἴδατε
  choice: మీకు తెలియదు
  rationale: రెండవ పురుష బహువచనంలోని నిరాకరణను తెలుగులో సహజంగా, అదనపు భావం చేర్చకుండా వ్యక్తపరుస్తుంది.
- source_word: τὴν ἡμέραν
  choice: ఆ రోజు
  rationale: గ్రీకు నిర్దిష్ట ఉపపదాన్ని సందర్భానుగుణమైన తెలుగు సూచనార్థక రూపంతో ప్రతిబింబిస్తుంది; ఆ రోజు ఏమిటో వాక్యంలో లేనంతగా వివరించదు.
- source_word: οὐδὲ τὴν ὥραν
  choice: ఆ గంట గానీ
  rationale: మొదటి నిరాకృత అంశంతో సమన్వయమై ‘రోజు గానీ, గంట గానీ’ అనే సహజ తెలుగు నిర్మాణాన్ని ఏర్పరుస్తుంది.
theological_decisions:
- issue: అప్రమత్తతను సూచించే ఆజ్ఞలోని రూపకం
  choice: మెలకువగా ఉండండి
  alternative: కాపలా కాస్తూ ఉండండి; అప్రమత్తంగా ఉండండి
  rationale: ఉపమాన సందర్భంలోని మేల్కొని ఉండే రూపకాన్ని నిలుపుతుంది; దానిని కేవలం నైరూప్యమైన అప్రమత్తతగా మార్చదు, అలాగే ప్రత్యేక అంత్యకాల వ్యవస్థను చేర్చదు.
- issue: ‘ఆ రోజు, ఆ గంట’ యొక్క పరిధి
  choice: వ్యాఖ్యాత్మక విస్తరణ లేకుండా మూలవ్యక్తీకరణను నిలుపడం
  alternative: మనుష్యకుమారుడు వచ్చే రోజు లేదా గంట; నియమిత సమయం
  rationale: విస్తృత సందర్భం రాకడను, తీర్పును సూచించినా, ఈ వాక్యం ‘రోజు’ మరియు ‘గంట’ అని మాత్రమే చెబుతుంది. అందువల్ల మూలంలో స్పష్టంగా లేని వివరణను అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మెలకువగా ఉండండి’ ఉపమాన చిత్రాన్ని నిలుపుతుంది; ‘రోజు గానీ, గంట గానీ’ సమన్విత నిరాకరణను సహజంగా వ్యక్తపరుస్తుంది.
