source:
  edition: SBLGNT
  text: αἱ δὲ φρόνιμοι ἔλαβον ἔλαιον ἐν τοῖς ⸀ἀγγείοις μετὰ τῶν λαμπάδων ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/004.yaml
  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: te
  text: అయితే వివేకవంతులు తమ దీపాలతో[a] పాటు పాత్రల్లో నూనె తీసుకువెళ్లారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దివిటీలతో’; గ్రీకు పదం సందర్భాన్ని బట్టి దీపాలను లేదా దివిటీలను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: వివేకవంతులు
  rationale: ఈ పదం ఆచరణాత్మక జ్ఞానం, వివేకాన్ని సూచిస్తుంది. పరిసర వచనాల్లోని అవివేకులతో ఉన్న వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది; కేవలం ‘సిద్ధంగా ఉన్నవారు’ అని అర్థాన్ని కుదించదు.
- source_word: ἔλαβον
  choice: తీసుకువెళ్లారు
  rationale: ఈ కథన సందర్భంలో తమతో పాటు తీసుకెళ్లడమే భావం; తెలుగులో ‘తీసుకువెళ్లారు’ దానిని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἔλαιον
  choice: నూనె
  rationale: ఈ పదం సాధారణంగా నూనెను, తరచుగా ఒలీవ నూనెను సూచిస్తుంది. మూలంలో లేని ప్రత్యేకతను చేర్చకుండా సాధారణ పదాన్ని ఉంచాం.
- source_word: ἀγγείοις
  choice: పాత్రల్లో
  rationale: ఇది ఆకారం లేదా పదార్థం నిర్దిష్టంగా చెప్పని సాధారణ పాత్రలను సూచిస్తుంది. ‘పాత్రలు’ ఆ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: λαμπάδων
  choice: దీపాలతో
  rationale: λαμπάς దీపం లేదా దివిటీని సూచించగలదు. అదనపు నూనె ప్రస్తావనతో ‘దీపాలు’ సహజంగా సరిపోతుంది; మరో సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἑαυτῶν
  choice: తమ
  rationale: కర్తలకే చెందినవని తెలిపే ప్రతిబింబ సర్వనామ భావాన్ని తెలుగు ‘తమ’ సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: తమ దీపాలతో పాటు
  rationale: μετά సాంగత్యాన్ని సూచిస్తుంది. నూనెను దీపాలకు అదనంగా తమ వెంట తీసుకెళ్లారని ‘తో పాటు’ స్పష్టంగా తెలియజేస్తుంది.
