id: MAT.25.19
reference: Matthew 25:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those servants comes and settles accounts with them.
translation:
  language: te
  text: చాలా కాలం గడిచిన తర్వాత, ఆ దాసుల యజమాని వచ్చి వారితో లెక్కలు తేల్చుకుంటాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆ దాసుల ప్రభువు వచ్చి వారితో లెక్కలు తేల్చుకుంటాడు’ అని కూడా అనువదించవచ్చు. గ్రీకు κύριος అనే పదానికి ‘ప్రభువు’ లేదా ‘యజమాని’ అనే అర్థాలు, δοῦλοι అనే పదానికి ‘దాసులు’ లేదా ‘సేవకులు’ అనే అర్థాలు ఉండవచ్చు. ఈ ఉపమానంలోని గృహసంబంధమైన ఆర్థిక సందర్భాన్ని ప్రధాన పాఠం స్పష్టంగా వ్యక్తం చేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: చాలా కాలం గడిచిన తర్వాత
  rationale: μετά కాలానంతర భావాన్ని సూచిస్తుంది. δέ ఇక్కడ స్వల్ప కథన అనుసంధానకం మాత్రమే; తెలుగులో అదనంగా ‘అయితే’ లేదా ‘ఇప్పుడు’ చేర్చకుండా సహజమైన కథన క్రమాన్ని నిలిపాం.
- source_word: ἔρχεται
  choice: వచ్చి
  rationale: గ్రీకు చారిత్రక వర్తమాన కాలపు సజీవతను తెలుగు వాక్యంలోని ప్రధాన క్రియ ‘తేల్చుకుంటాడు’తో కలిపి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ κύριος
  choice: యజమాని
  rationale: ఈ ఉపమాన సందర్భంలో κύριος దాసులపై అధికారమున్న గృహ/ఆస్తి యజమానిని సూచిస్తుంది; ప్రత్యక్ష దైవబిరుదుగా అనువదించకుండా కథలోని సామాజిక సంబంధాన్ని తెలియజేస్తుంది.
- source_word: τῶν δούλων ἐκείνων
  choice: ఆ దాసుల
  rationale: δοῦλος ఇక్కడ యజమాని ఆధీనంలోని బంధిత స్థితిని సూచిస్తుంది. ‘సేవకులు’ కంటే ‘దాసులు’ మూలంలోని సామాజిక అసమానతను స్పష్టంగా కాపాడుతుంది.
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: వారితో లెక్కలు తేల్చుకుంటాడు
  rationale: ఈ గ్రీకు నుడికారం ఖాతాలను పరిశీలించి లెక్క తేల్చడం లేదా జవాబు కోరడం అనే అర్థం ఇస్తుంది; తెలుగు ఆర్థిక సందర్భంలో ఈ ప్రయోగం సహజంగా ఉంది.
theological_decisions:
- issue: ఉపమానంలో κύριος అనువాదం
  choice: యజమాని
  alternative: ప్రభువు
  rationale: ఈ వాక్యంలో పదం కథలోని దాసుల యజమానిని ప్రత్యక్షంగా సూచిస్తుంది. ‘ప్రభువు’ అనే దైవబిరుదును బలవంతంగా ప్రవేశపెట్టకుండా, ఉపమానపు విస్తృత ధార్మిక సూచనను సందర్భానికే వదిలాం.
- issue: δοῦλος అనువాదం
  choice: దాసులు
  alternative: సేవకులు
  rationale: యజమాని–దాసుల ఆర్థిక సంబంధంలో బంధితత్వం ప్రధానంగా కనిపిస్తుంది; అందువల్ల మృదువైన ‘సేవకులు’ కంటే ‘దాసులు’ మూలార్థాన్ని మెరుగ్గా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కథన శైలి. ‘లెక్కలు తేల్చుకుంటాడు’ ఆర్థిక నుడికారాన్ని స్పష్టంగా అందిస్తుంది; ‘దాసులు’ మూలంలోని బంధిత సామాజిక స్థితిని మృదుపరచదు.
