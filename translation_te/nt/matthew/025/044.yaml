review_pass:
  verdict: revise
  source_fidelity: The draft preserves the future response, the emphatic ‘they too,’ the complete six-part list of needs, and the negative question concerning service. ‘పరదేశిగా’ is acceptable for ξένον in this context, and ‘నీకు సేవ చేయలేదు’ accurately retains the broad practical sense of διακονέω.
  naturalness: The inverted construction—placing the entire quotation before ‘అని జవాబిస్తారు’—is grammatical but less natural and less clear in modern Telugu public reading. Introducing the reply before the direct quotation gives a smoother, standard sentence without changing meaning.
  terminology: ‘ప్రభువా’ appropriately renders Κύριε. ‘వస్త్రహీనుడిగా,’ ‘అనారోగ్యంతో,’ and ‘చెరసాలలో’ are suitable formal-modern renderings. The footnote’s ‘నీ అవసరాలు తీర్చలేదు’ is somewhat narrower than διακονέω, since it can suggest only supplying needs; it should instead offer ‘నిన్ను చూసుకోలేదు’ as a contextual alternative while retaining ‘పరిచర్య.’
  issues:
  - severity: low
    issue: Direct-speech construction is awkwardly inverted.
    rationale: The Greek has ‘will answer, saying,’ and Telugu naturally introduces the answer before the quotation. This revision improves clarity and oral readability.
  - severity: low
    issue: One footnote alternative narrows the verb’s semantic range.
    rationale: ‘నీ అవసరాలు తీర్చలేదు’ can limit the meaning to provision of material needs, whereas διακονέω denotes practical service more broadly.
