id: MAT.25.44
reference: Matthew 25:44
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: te
  text: 'అప్పుడు వారూ ఇలా జవాబిస్తారు: ‘ప్రభువా, మేము నిన్ను ఎప్పుడు ఆకలితోనో దాహంతోనో పరదేశిగానో వస్త్రహీనుడిగానో అనారోగ్యంతోనో చెరసాలలోనో చూసి, నీకు సేవ చేయలేదు[a]?’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నీకు పరిచర్య చేయలేదు” లేదా “నిన్ను చూసుకోలేదు”; గ్రీకు διακονέω అనే పదం ఆచరణాత్మకంగా సేవ చేయడం లేదా పరిచర్య చేయడం అనే భావాలను కలిగి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: అప్పుడు
  rationale: తీర్పు దృశ్యంలోని సంఘటనల క్రమాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἀποκριθήσονται καὶ αὐτοὶ
  choice: వారు కూడా ... జవాబిస్తారు
  rationale: మునుపటి వర్గంలాగే ఈ వర్గమూ స్పందిస్తుందనే καὶ αὐτοὶ యొక్క భావాన్ని నిలుపుతుంది.
- source_word: Κύριε
  choice: ప్రభువా
  rationale: κύριος అనే సంబోధనలోని గౌరవార్థాన్నీ క్రీస్తుసంబంధ ప్రతిధ్వనినీ సహజమైన తెలుగు రూపంలో కాపాడుతుంది.
- source_word: πεινῶντα ἢ διψῶντα
  choice: ఆకలితోనో దాహంతోనో
  rationale: ‘ఆకలిగొన్నవాడిగా, దప్పిగొన్నవాడిగా’ కంటే ఆధునిక తెలుగులో సహజంగా ఉండి, స్థితులను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ξένον
  choice: పరదేశిగా
  rationale: ఆతిథ్యం అవసరమైన బయటి వ్యక్తి అనే సామాజిక భావాన్ని తెలుపుతుంది; జాతి లేదా పౌరసత్వాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: γυμνὸν
  choice: వస్త్రహీనుడిగా
  rationale: γυμνός యొక్క ప్రత్యక్ష బలాన్ని నిలుపుతూ, ప్రజా పఠనానికి తగిన గౌరవప్రదమైన ఆధునిక పదాన్ని ఉపయోగిస్తుంది.
- source_word: ἀσθενῆ
  choice: అనారోగ్యంతో
  rationale: ఈ శారీరక, సామాజిక అవసరాల జాబితాలో ‘బలహీనుడు’ కంటే ‘అనారోగ్యంతో’ సందర్భానికి తగినది.
- source_word: ἐν φυλακῇ
  choice: చెరసాలలో
  rationale: నిర్బంధ స్థితిని స్పష్టంగా, సహజమైన బైబిలు తెలుగు రీతిలో తెలియజేస్తుంది.
- source_word: οὐ διηκονήσαμέν σοι
  choice: నీకు సేవ చేయలేదు
  rationale: διακονέω యొక్క విస్తృతమైన ఆచరణాత్మక సేవ భావాన్ని కాపాడుతుంది; దానిని కేవలం సంఘపరమైన పరిచర్యగా పరిమితం చేయదు.
theological_decisions:
- issue: యేసును ఉద్దేశించిన κύριος బిరుదు
  choice: ప్రభువా
  alternative: యజమానా
  rationale: గౌరవపూర్వక సంబోధనతో పాటు మత్తయి సువార్తలోని క్రీస్తుసంబంధ ప్రతిధ్వనిని నిలుపుతుంది; పాఠ్యం చెప్పినదానికంటే ఎక్కువగా నిర్దిష్టం చేయదు.
- issue: διακονέω యొక్క భావవ్యాప్తి
  choice: నీకు సేవ చేయలేదు
  alternative: నీకు పరిచర్య చేయలేదు / నిన్ను పట్టించుకోలేదు
  rationale: అవసరంలో ఉన్నవారికి చేసిన ఆచరణాత్మక సహాయాన్ని రాజుకు చేసిన సేవగా చూపే పాఠ్య సంబంధాన్ని నిలుపుతుంది. ‘పరిచర్య’ సంఘపరమైన భావానికి కుదించవచ్చు; ‘పట్టించుకోవడం’ క్రియ యొక్క సేవార్థాన్ని బలహీనపరచవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. గ్రీకు ప్రశ్నలోని వరుస స్థితులను ‘-తోనో/-గానో’ రూపాలతో ఒకే లయలో ఉంచి, చివరి ప్రతికూల ప్రశ్నను యథాతథంగా కాపాడాం.
