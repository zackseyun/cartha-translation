  - severity: low
    issue: ‘ఒకరినొకరు ప్రేమించే విషయంలో’ weakens the infinitival direction/purpose expression εἰς τὸ ἀγαπᾶν ἀλλήλους.
    rationale: ‘ఒకరినొకరు ప్రేమించడానికి’ is natural Telugu and more directly reflects the Greek construction without over-resolving its purpose/result nuance.
