source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς φιλαδελφίας οὐ χρείαν ἔχετε γράφειν ὑμῖν, αὐτοὶ γὰρ ὑμεῖς θεοδίδακτοί ἐστε εἰς τὸ ἀγαπᾶν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/009.yaml
  text: Concerning brotherly love, you have no need for anyone to write to you, for you yourselves are taught by God to love one another.
translation:
  language: te
  text: సహోదర ప్రేమ గురించి[a] మీకు ఎవరూ రాయవలసిన అవసరం లేదు[b]. ఎందుకంటే మీరే ఒకరినొకరు ప్రేమించడానికి దేవునిచేత బోధించబడినవారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘సహోదర ప్రేమ’ అంటే మరింత నిర్దిష్టంగా తోటి విశ్వాసులపట్ల కుటుంబ సభ్యులవంటి ప్రేమ.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మీకు రాయవలసిన అవసరం లేదు’; రాసే కర్తను గ్రీకు వాక్యం స్పష్టంగా పేర్కొనదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: సహోదర ప్రేమను గురించి
  rationale: περὶ కొత్త అంశాన్ని పరిచయం చేస్తుంది; δέ స్వల్ప కొనసాగింపుతో అంశమార్పును సూచిస్తుంది. తెలుగులో ప్రత్యేక కాలసూచక పదాన్ని చేర్చకుండా ‘గురించి’ అనే నిర్మాణం సహజంగా ఈ మార్పును తెలియజేస్తుంది.
- source_word: φιλαδελφίας
  choice: సహోదర ప్రేమ
  rationale: విశ్వాసుల సమాజంలో కుటుంబ సభ్యులవంటి అనురాగాన్ని సూచించే పదం. తరువాతి ἀγαπᾶν‌కు వేరుగా ఉన్న గ్రీకు పదప్రయోగాన్ని ‘సహోదర ప్రేమ’ నిలుపుతుంది.
- source_word: οὐ χρείαν ἔχετε γράφειν ὑμῖν
  choice: మీకు ఎవరూ రాయవలసిన అవసరం లేదు
  rationale: γράφειν‌కు కర్త గ్రీకులో స్పష్టంగా లేదు. సహజమైన తెలుగు కోసం ‘ఎవరూ’ అని పూరించబడింది; ‘మేము’ అని మూలంలో లేని నిర్దిష్ట కర్తను చేర్చలేదు.
- source_word: αὐτοὶ γὰρ ὑμεῖς
  choice: ఎందుకంటే ... మీరే
  rationale: γάρ కారణాన్ని పరిచయం చేస్తుంది; αὐτοὶ ὑμεῖς‌లోని ఉద్ఘాటనను ‘మీరే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: θεοδίδακτοί
  choice: దేవునిచేత బోధించబడినవారు
  rationale: దేవుడే బోధకు మూలమూ కర్తయూ అని చూపే అరుదైన విశేషణం. మూలంలోని స్థితిగత భావాన్ని తెలుగులో నిష్క్రియ నిర్మాణంతో నిలిపింది.
- source_word: εἰς τὸ ἀγαπᾶν ἀλλήλους
  choice: ఒకరినొకరు ప్రేమించే విషయంలో
  rationale: ఈ నిర్మాణం దిశ, ఉద్దేశం లేదా సంబంధాన్ని సూచించగలదు. ‘విషయంలో’ అనేది ఏకైక సూక్ష్మార్థాన్ని బలవంతంగా నిర్ణయించకుండా సహజంగా భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: φιλαδελφία మరియు ἀγαπᾶν మధ్య పదభేదం
  choice: మొదటిదాన్ని ‘సహోదర ప్రేమ’, రెండోదాన్ని ‘ప్రేమించడం’గా అనువదించడం
  alternative: రెండింటినీ కేవలం ‘ప్రేమ’ అనే ఒకే పదంతో అనువదించడం
  rationale: పౌలు ఉపయోగించిన కుటుంబసంబంధ అనురాగం మరియు సాధారణ ప్రేమక్రియ మధ్యనున్న పదప్రయోగ భేదాన్ని ఇది నిలుపుతుంది.
- issue: γράφειν‌కు అంతర్భూత కర్త
  choice: ‘ఎవరూ రాయవలసిన’ అని నిర్దిష్టం కాని కర్తను పూరించడం
  alternative: ‘మేము రాయవలసిన’ అని పౌలు మరియు సహపంపినవారిని కర్తగా పేర్కొనడం
  rationale: సందర్భంలో ‘మేము’ సాధ్యమైనప్పటికీ గ్రీకు అనంతక్రియకు కర్త స్పష్టంగా ఇవ్వబడలేదు; అందువల్ల అనవసరంగా నిర్దిష్టం చేయలేదు.
- issue: θεοδίδακτοι యొక్క దైవ కార్యసాధకత్వం
  choice: ‘దేవునిచేత బోధించబడినవారు’
  alternative: ‘దేవుని నుండి నేర్చుకున్నవారు’
  rationale: ప్రత్యామ్నాయం మానవులు నేర్చుకోవడంపై దృష్టి మళ్లించవచ్చు; ఎంపిక చేసిన రూపం దేవుడే బోధించే కర్త అని మూలపదం తెలిపే భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘సహోదర’ అనే కుటుంబ రూపకం సంఘంలోని స్త్రీపురుష విశ్వాసులందరినీ సందర్భానుసారంగా కలుపుకుంటుందని పాదటిప్పణి వివరిస్తుంది. రెండు పాదటిప్పణి గుర్తులూ ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
