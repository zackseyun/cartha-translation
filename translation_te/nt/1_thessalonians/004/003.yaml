id: 1TH.4.3
reference: 1 Thessalonians 4:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν θέλημα τοῦ θεοῦ, ὁ ἁγιασμὸς ὑμῶν, ἀπέχεσθαι ὑμᾶς ἀπὸ τῆς πορνείας,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/003.yaml
  text: 'For this is the will of God: your sanctification—that you abstain from sexual immorality[a][b].'
translation:
  language: te
  text: 'ఎందుకంటే దేవుని చిత్తం ఇదే: మీ పరిశుద్ధీకరణ[a]—మీరు లైంగిక దుర్నీతికి[b] దూరంగా ఉండడం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీ పరిశుద్ధత.’
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు: porneia; అనుమతించబడని లైంగిక ప్రవర్తనను విస్తృతంగా సూచించే పదం. సంప్రదాయంగా ‘జారత్వం.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλημα
  choice: చిత్తం
  rationale: దేవుని అధికారపూర్వకమైన సంకల్పాన్ని తెలిపే సహజమైన, స్థిరపడిన తెలుగు పదం. ‘కోరిక’ ఇక్కడ భావాన్ని బలహీనపరచవచ్చు; ‘ఉద్దేశం’ సందర్భం సూచించేదానికంటే మరింత నిర్ణీతమైన భావాన్ని కలిగించవచ్చు.
- source_word: ὁ ἁγιασμὸς ὑμῶν
  choice: మీ పరిశుద్ధీకరణ
  rationale: ἁγιασμός సూచించే దేవునికి ప్రత్యేకపరచబడిన పరిశుద్ధ స్థితి మరియు పరిశుద్ధ జీవన ప్రక్రియ రెండింటికీ చోటిస్తుంది. వెంట వచ్చే వాక్యభాగం దాని నైతిక ఆచరణను వివరిస్తుంది.
- source_word: ἀπέχεσθαι
  choice: మీరు ... దూరంగా ఉండడం
  rationale: మూలంలోని infinitive, పరిశుద్ధీకరణలో ఏమి ఇమిడి ఉందో వివరిస్తుంది. తెలుగు నామవాచక క్రియారూపం ఆ వివరణాత్మక సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: πορνείας
  choice: లైంగిక దుర్నీతి
  rationale: πορνεία అనుమతించబడని లైంగిక ప్రవర్తనను విస్తృతంగా సూచిస్తుంది. ‘జారత్వం’ వంటి సంప్రదాయ పదం ఆధునిక వాడుకలో పాతదిగా లేదా మరీ సంకుచితంగా అర్థమయ్యే అవకాశం ఉంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ఈ వాక్యం ముందున్న ఉపదేశానికి కారణం లేదా ఆధారం అందిస్తోందనే అనుసంధానాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నైతిక ఉపదేశంలో ἁγιασμός భావం
  choice: ‘పరిశుద్ధీకరణ’ అని అనువదించి, వెంట వచ్చే భాగం దాని నైతిక విషయాన్ని వివరించేలా ఉంచడం.
  alternative: ఫలిత స్థితిని ప్రధానంగా చూపేందుకు ‘పరిశుద్ధత’ అని అనువదించడం.
  rationale: ఈ వాక్యం దేవుని చిత్తాన్ని విశ్వాసుల దేవునికి ప్రత్యేకపరచబడిన నైతిక జీవనంతో, ముఖ్యంగా లైంగిక పవిత్రతతో, అనుసంధానిస్తుంది. ‘పరిశుద్ధీకరణ’ అనే పదం దీనిని కేవలం స్థానపరమైన స్థితిగానో కేవలం క్రమానుగత ప్రక్రియగానో పరిమితం చేయదు.
- issue: πορνεία యొక్క పరిధి
  choice: విస్తృత భావంతో ‘లైంగిక దుర్నీతి’ అని అనువదించడం.
  alternative: ‘జారత్వం’ అని అనువదించడం.
  rationale: గ్రీకు పదం ఒకే రకమైన అనుచిత లైంగిక ప్రవర్తనకు పరిమితం కాదు. అందువల్ల మూలంలో లేని సంకుచితమైన మతపరమైన లేదా సాంస్కృతిక నిర్వచనాన్ని అనువాదం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘పరిశుద్ధీకరణ’ స్థిరపడిన ధార్మిక పదమైనప్పటికీ, దాని నైతిక భావాన్ని వెంటనే వచ్చే సహజమైన వాక్యభాగం స్పష్టం చేస్తుంది. మూలంలోని వివరణాత్మక నిర్మాణాన్ని దీర్ఘ విరామచిహ్నంతో నిలిపాం.
