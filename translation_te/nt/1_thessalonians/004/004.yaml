  terminology: ‘పవిత్రత’ (ἁγιασμός), ‘గౌరవం’ (τιμή) పదాలు ఖచ్చితమైనవి మరియు ఆధునిక ప్రామాణిక తెలుగులో తగినవి. పాదసూచిక σκεῦος/κτᾶσθαι పదబంధానికి ప్రతిపాదితమైన శరీరం మరియు భార్య అనే రెండు ప్రధాన వ్యాఖ్యానాలను ఏదీ బలవంతం చేయకుండా స్పష్టంగా తెలియజేస్తుంది.
