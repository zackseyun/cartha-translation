  source_fidelity: గ్రీకు εἰδέναι ἕκαστον ὑμῶν ... κτᾶσθαι నిర్మాణాన్ని ‘మీలో ప్రతి ఒక్కరూ ... సంపాదించుకోవడం ఎలాగో తెలుసుకోవాలని’ అని సరిగ్గా ప్రతిబింబిస్తుంది. σκεῦος కు ‘పాత్ర,’ κτᾶσθαι కు ‘సంపాదించుకోవడం’ అనువాదాలు ఆంగ్ల POB audit trail లోని ‘acquire’తోనూ సరిపోతాయి. వివాదాస్పద సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా ఉంచింది.
