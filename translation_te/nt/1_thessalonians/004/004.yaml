id: 1TH.4.4
reference: 1 Thessalonians 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰδέναι ἕκαστον ὑμῶν τὸ ἑαυτοῦ σκεῦος κτᾶσθαι ἐν ἁγιασμῷ καὶ τιμῇ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/004.yaml
  text: that each of you know how to acquire his own vessel in holiness and honor,
translation:
  language: te
  text: మీలో ప్రతి ఒక్కరూ తన సొంత పాత్రను[a] పవిత్రతతో, గౌరవంతో సంపాదించుకోవడం ఎలాగో తెలుసుకోవాలని,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పాత్ర’ అనే గ్రీకు పదం ఇక్కడ ఒకరి శరీరాన్ని సూచించవచ్చు; లేదా ఈ పదబంధం భార్యను సంపాదించుకోవడాన్ని సూచించవచ్చు.
    reason: σκεῦος మరియు κτᾶσθαι కలయికకు ఉన్న రెండు ప్రధాన సందర్భార్థాలను పాఠకునికి తెలియజేసి, మూలంలోని అనిశ్చితిని సంరక్షించడం.
lexical_decisions:
- source_word: σκεῦος
  choice: పాత్ర
  rationale: మూలపదానికి సాధారణ అర్థం ‘పాత్ర/ఉపకరణం’. ఈ సందర్భంలో అది ‘శరీరం’ను లేదా ‘భార్య’ను సూచించవచ్చనే నిజమైన అనిశ్చితిని ప్రధాన పాఠ్యంలో తటస్థంగా నిలుపుతుంది.
- source_word: κτᾶσθαι
  choice: సంపాదించుకోవడం
  rationale: ఈ మధ్యమ క్రియకు ‘సంపాదించుకోవడం/తనదిగా చేసుకోవడం’ అనే భావం ఉంది. ‘అదుపులో ఉంచుకోవడం’ అని అనువదిస్తే ‘శరీరం’ అనే వ్యాఖ్యానాన్ని ముందే నిర్ణయించినట్లవుతుంది.
- source_word: ἁγιασμῷ
  choice: పవిత్రతతో
  rationale: దేవునికి ప్రత్యేకింపబడిన పవిత్ర జీవన స్థితి లేదా విధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τιμῇ
  choice: గౌరవంతో
  rationale: τιμήలోని గౌరవం, మర్యాద అనే భావాన్ని సందర్భానుకూలంగా అందిస్తుంది.
theological_decisions:
- issue: ‘తన సొంత పాత్రను సంపాదించుకోవడం’ అనే పదబంధపు అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘పాత్ర’ అనే రూపకాన్ని నిలిపి, వివరణను పాదసూచికలో ఇవ్వడం
  alternative: ‘తన శరీరాన్ని అదుపులో ఉంచుకోవడం’ లేదా ‘తనకు భార్యను సంపాదించుకోవడం’
  rationale: గ్రీకు పదబంధం శరీర నియంత్రణకా, భార్యను పొందడానికా సంబంధించినదో వివాదాస్పదం. ఏ ఒక్క వ్యాఖ్యానాన్నీ పాఠ్యంలో బలవంతంగా స్థిరపరచకుండా మూలంలోని భావసందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఇది 3వ వచనంలో మొదలైన వాక్యనిర్మాణాన్ని కొనసాగించే ఉపవాక్యం కాబట్టి చివర కామా ఉంచబడింది. ‘ఎలాగో తెలుసుకోవాలని’ అనే నిర్మాణం గ్రీకు εἰδέναι ... κτᾶσθαι భావసంబంధాన్ని తెలుగులో స్పష్టంగా చేస్తుంది.
