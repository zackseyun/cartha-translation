id: 1TH.4.15
reference: 1 Thessalonians 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ὑμῖν λέγομεν ἐν λόγῳ κυρίου, ὅτι ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι εἰς τὴν παρουσίαν τοῦ κυρίου οὐ μὴ φθάσωμεν τοὺς κοιμηθέντας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/015.yaml
  text: 'For this we say to you by a word from the Lord: that we who are living[a], who remain until the coming of the Lord[c][b], will certainly not precede those who have fallen asleep.'
translation:
  language: te
  text: 'ఎందుకంటే, ప్రభువు వాక్యం ప్రకారం[a] మేము మీకు ఇలా చెబుతున్నాము: ప్రభువు రాక[b] వరకు జీవించి మిగిలి ఉండే మనం నిద్రించినవారికంటే[c] ఏమాత్రమూ ముందుగా వెళ్లము.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదబంధాన్ని ‘ప్రభువు నుండి వచ్చిన ఒక మాట ఆధారంగా’ అని కూడా అనువదించవచ్చు. ఇది ప్రభువైన యేసు పలికిన మాటనో, ప్రభువు అధికారంతో ఇవ్వబడిన ప్రత్యక్షతనో సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘రాక’కు గ్రీకు పదం παρουσία; దీనిని ‘రాకడ’ లేదా ‘సన్నిధి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘నిద్రించినవారు’ అనేది చనిపోయిన విశ్వాసులను సూచించే రూపకం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν λόγῳ κυρίου
  choice: ప్రభువు నుండి వచ్చిన ఒక మాట ఆధారంగా
  rationale: ἐν అనే పదంలోని ఆధారం/అధికారం భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, ఇది యేసు పలికిన ప్రసిద్ధ వాక్యమా లేక ప్రభువు అధికారంతో వచ్చిన ప్రత్యక్షతా అనే విషయాన్ని నిర్ణయించకుండా ఉంచుతుంది.
- source_word: παρουσίαν
  choice: రాక
  rationale: ఈ అంత్యకాల సందర్భంలో ప్రభువు భవిష్యత్తులో రావడాన్ని సూచిస్తుంది. ‘రాక’ సాధారణ పాఠకులకు సహజంగా ఉండి, సంఘటన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: οἱ ζῶντες οἱ περιλειπόμενοι
  choice: జీవించి మిగిలి ఉండే మనం
  rationale: రెండు వర్తమాన కృదంతాల భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; ‘బతికి బయటపడే’ వంటి అదనపు ప్రమాద/మనుగడ భావాన్ని చేర్చదు.
- source_word: οὐ μὴ φθάσωμεν
  choice: ఎంతమాత్రమూ ముందుగా వెళ్లము
  rationale: οὐ μή లోని బలమైన నిరాకరణను ‘ఎంతమాత్రమూ ...ము’ ద్వారా, φθάνω లోని ముందుగా జరగడం అనే భావాన్ని సహజమైన తెలుగు క్రమవ్యక్తీకరణ ద్వారా అందిస్తుంది.
- source_word: τοὺς κοιμηθέντας
  choice: నిద్రించినవారు
  rationale: మరణించిన విశ్వాసుల గురించి పౌలు ఉపయోగించిన నిద్ర రూపకాన్ని వ్యాఖ్యానాత్మకంగా ‘మృతులు’ అని చదును చేయకుండా నిలుపుతుంది.
- source_word: κύριος / κυρίου
  choice: ప్రభువు
  rationale: ఈ సందర్భంలో యేసును సూచించే κύριος కు ప్రామాణికమైన, గౌరవప్రదమైన తెలుగు పదం.
theological_decisions:
- issue: ‘ప్రభువు మాట’కు పౌలు చేసిన విజ్ఞాపన స్వభావం
  choice: ‘ప్రభువు నుండి వచ్చిన ఒక మాట ఆధారంగా’ అని అనువదించి దాని అధికారాన్ని తెలిపినా, ప్రసార విధానాన్ని నిర్ణయించలేదు.
  alternative: ‘ప్రభువు పలికిన మాట ప్రకారం’ లేదా ‘ప్రభువు ప్రత్యక్షపరచిన మాట ప్రకారం’
  rationale: గ్రీకు పదబంధం ప్రభువు అధికారాన్ని స్థిరపరుస్తుంది; అయితే అది చారిత్రకంగా యేసు పలికిన మాటను ఉటంకించడమా, పౌలుకు వచ్చిన ప్రత్యక్షతా అనేది స్వయంగా నిర్దిష్టం చేయదు.
- issue: κοιμηθέντας లోని నిద్ర రూపకం
  choice: ‘నిద్రించినవారు’ అనే రూపకాన్ని నిలిపింది.
  alternative: ‘చనిపోయినవారు’ అని స్పష్టీకరించడం
  rationale: ఈ పదం నిజమైన మరణాన్ని సూచించినప్పటికీ, పునరుత్థాన నిరీక్షణ నేపథ్యంలో మూలపాఠం ఉంచిన రూపకాన్నీ దాని వేదాంతపరమైన ఉద్వేగాన్నీ అనువాదం కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మనం’ పౌలు తనను మరియు ఉద్దేశిత పాఠకులను కలుపుకొని చెప్పిన ἡμεῖς భావాన్ని నిలుపుతుంది; అది పౌలు తప్పక ప్రభువు రాక వరకు జీవిస్తాడనే సిద్ధాంత నిర్ణయాన్ని అనువాదంలో బలవంతంగా చేర్చదు.
