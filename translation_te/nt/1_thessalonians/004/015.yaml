revisions:
- from: 'ప్రభువు నుండి వచ్చిన ఒక మాట ఆధారంగా[a] మేము మీకు చెప్పేది ఇదే: ప్రభువు రాక[b] వరకు జీవించి మిగిలి ఉండే మనం, నిద్రించినవారికంటే[c] ఎంతమాత్రమూ ముందుగా వెళ్లము.'
  to: 'ఎందుకంటే, ప్రభువు వాక్యం ప్రకారం[a] మేము మీకు ఇలా చెబుతున్నాము: ప్రభువు రాక[b] వరకు జీవించి మిగిలి ఉండే మనం నిద్రించినవారికంటే[c] ఏమాత్రమూ ముందుగా వెళ్లము.'
  rationale: The revision restores the connective force of γάρ and replaces a potentially over-specific rendering of ἐν λόγῳ κυρίου with wording that preserves the source phrase’s ambiguity. It otherwise retains the draft’s faithful lexical choices, footnote anchors, and modern standard Telugu register.
