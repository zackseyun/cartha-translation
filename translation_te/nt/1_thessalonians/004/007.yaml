id: 1TH.4.7
reference: 1 Thessalonians 4:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐκάλεσεν ἡμᾶς ὁ θεὸς ἐπὶ ἀκαθαρσίᾳ ἀλλ’ ἐν ἁγιασμῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/007.yaml
  text: For God did not call us for uncleanness[b][a], but in holiness.
translation:
  language: te
  text: ఎందుకంటే దేవుడు మనలను అపవిత్రత కోసం[a] పిలవలేదు, కానీ పవిత్రతలో[b] పిలిచాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అపవిత్రతలో ఉండడానికి.” గ్రీకు పదం సాధారణ నైతిక అపవిత్రతను సూచించగలదు; ఈ సందర్భంలో ముఖ్యంగా లైంగిక అపవిత్రత భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పవిత్రీకరణలో.” గ్రీకు పదం పవిత్రంగా ఉండే స్థితినీ, పవిత్రీకరణ ప్రక్రియనీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ఈ పదం ముందున్న ఉపదేశానికి కారణాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో వాక్యారంభంలో ‘ఎందుకంటే’ సహజంగా ఆ సంబంధాన్ని చూపుతుంది.
- source_word: ἐκάλεσεν
  choice: పిలిచాడు
  rationale: అయోరిస్ట్ సూచనార్థక క్రియను సాధారణ భూతకాలంగా అనువదించాం. దేవుని పిలుపు అనే బైబిలు పదబంధాన్ని నిలుపుతూ, దానికి ఏదైనా ప్రత్యేక సిద్ధాంత నిర్వచనాన్ని జోడించలేదు.
- source_word: ἐπὶ ἀκαθαρσίᾳ
  choice: అపవిత్రతకు
  rationale: ἐπί + చతుర్థీ ఇక్కడ అపవిత్రతను లక్ష్యంగా లేదా పిలుపుతో ముడిపడిన జీవన పరిధిగా సూచించగలదు. ‘అపవిత్రతకు’ సంక్షిప్తంగా ఉండి గ్రీకు నిర్మాణంలోని ఉద్దేశార్థాన్ని నిలుపుతుంది; సందర్భంలో ఇది ముఖ్యంగా లైంగిక నీతిహీనతతో సంబంధం కలిగి ఉన్నా, పదాన్ని అంతకే పరిమితం చేయదు.
- source_word: ἀκαθαρσίᾳ
  choice: అపవిత్రత
  rationale: ఈ ఎంపిక నైతిక అశుద్ధతను, అలాగే పవిత్రతకు వ్యతిరేకమైన విస్తృత భావాన్ని వ్యక్తం చేస్తుంది. సమీప సందర్భంలో లైంగిక అపవిత్రత ప్రధానంగా ఉన్నప్పటికీ, మూలపదం యొక్క విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: ἐν ἁγιασμῷ
  choice: పవిత్రతలో
  rationale: ἐν అనే విభక్తి సంబంధాన్ని నిలుపుతూ, దేవుని పిలుపు జరిగే లేదా విశ్వాసులు జీవించవలసిన పవిత్ర పరిధిని సహజమైన తెలుగులో తెలియజేస్తుంది. ἁγιασμός స్థితినీ ప్రక్రియనీ సూచించగలదనే సందిగ్ధతను పాదటిప్పణి వివరిస్తుంది.
- source_word: ἁγιασμῷ
  choice: పవిత్రత
  rationale: అపవిత్రతతో ఉన్న ప్రత్యక్ష వ్యత్యాసంలో ‘పవిత్రత’ స్పష్టంగా, సహజంగా ఉంటుంది. అదే సమయంలో పవిత్రపరచబడే ప్రక్రియ అనే సాధ్యమైన అర్థాన్ని పూర్తిగా నిరాకరించకుండా పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: దేవుని ‘పిలుపు’ యొక్క భావం
  choice: విశ్వాసుల పవిత్ర జీవనానికి ఆధారమైన దేవుని నిజమైన పిలుపుగా అనువదించాం; అయితే ఆ పిలుపు ఎలా పనిచేస్తుందో అనే ఏ ప్రత్యేక సంప్రదాయ సిద్ధాంతాన్నీ వాక్యంలో చేర్చలేదు.
  alternative: దీనిని కేవలం సాధారణ ఆహ్వానంగా లేదా సాంకేతిక అర్థంలోని ‘ఫలప్రదమైన పిలుపు’గా స్పష్టీకరించడం.
  rationale: గ్రీకు వాక్యం నైతిక ఉపదేశానికి దేవుని పిలుపునే ఆధారంగా ఉంచుతుంది, కాని ఆ పిలుపు యొక్క విధానాన్ని నిర్వచించదు. అందువల్ల ‘పిలిచాడు’ అనే మూలరూపాన్ని నిలిపాం.
- issue: ἁγιασμός స్థితా, ప్రక్రియా?
  choice: ప్రధాన పాఠ్యంలో ‘పవిత్రత’ అని ఉంచి, జీవన స్థితి లేదా పరిధి భావానికి ప్రాధాన్యం ఇచ్చాం.
  alternative: ‘పవిత్రపరచబడటం’ లేదా ‘పవిత్రీకరణ’ అని ప్రక్రియ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచడం.
  rationale: అపవిత్రతతో ఉన్న వ్యత్యాసం పవిత్ర జీవన స్థితి లేదా పరిధి భావాన్ని బలపరుస్తుంది. అయినా గ్రీకు నామవాచకం ప్రక్రియను కూడా సూచించగలదు కాబట్టి ఆ అర్థాన్ని పాదటిప్పణిలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడాం. ‘అపవిత్రతకు’ మరియు ‘పవిత్రతలో’ అనే భిన్న విభక్తి రూపాలు మూలంలోని ἐπί మరియు ἐν మధ్య తేడాను సాధ్యమైనంతవరకు నిలుపుతాయి. సెమీకోలన్ ప్రతికూల–అనుకూల వ్యత్యాసాన్ని స్పష్టంగా చూపుతుంది.
