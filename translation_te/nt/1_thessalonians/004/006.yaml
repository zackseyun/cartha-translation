review_pass:
  verdict: revise
  source_fidelity: The draft retains the main sense, but ‘హద్దుమీరి తన సహోదరుణ్ణి దోచుకోకూడదు’ can make the first verb modify the act of robbing rather than express the two coordinated Greek infinitives, ‘overstep and exploit.’ A revision makes both actions and their relation to the brother clearer. The Lord’s role as avenger and the prior solemn warning are retained.
  naturalness: ‘దోచుకోవడం’ is strongly associated with literal theft or plunder in contemporary Telugu and is less suitable for the broad, contextually sexual but deliberately non-specific force of πλεονεκτεῖν. ‘అన్యాయంగా ఉపయోగించుకోవడం’ is natural and preserves the broad exploitative sense.
  terminology: ‘సహోదరుడు’ appropriately reflects the masculine singular ἀδελφός, and ‘ప్రభువు’ correctly renders κύριος. ‘ప్రతీకారం తీర్చేవాడు’ adequately conveys ἔκδικος without weakening its judicial force.
  issues:
  - severity: medium
    issue: The two coordinated actions are not clearly distinguished.
    rationale: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν expresses both overstepping and exploiting. The draft’s phrasing can be read as merely ‘plunder after overstepping.’
  - severity: medium
    issue: ‘దోచుకోకూడదు’ over-specifies πλεονεκτεῖν.
    rationale: The Greek can include defrauding or taking advantage, and in this context likely sexual exploitation; it does not specifically denote robbery. A broader Telugu expression better preserves the source ambiguity.
