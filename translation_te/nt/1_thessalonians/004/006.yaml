revisions:
- from: ఈ విషయంలో ఎవరూ హద్దుమీరి తన సహోదరుణ్ణి దోచుకోకూడదు[a]. ఎందుకంటే, వీటన్నిటి విషయంలో ప్రభువు ప్రతీకారం తీర్చేవాడు; మేము ఇంతకుముందే మీతో చెప్పి, గంభీరంగా హెచ్చరించినట్లే.
