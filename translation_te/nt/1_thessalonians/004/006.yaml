id: 1TH.4.6
reference: 1 Thessalonians 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ μὴ ὑπερβαίνειν καὶ πλεονεκτεῖν ἐν τῷ πράγματι τὸν ἀδελφὸν αὐτοῦ, διότι ἔκδικος ⸀κύριος περὶ πάντων τούτων, καθὼς καὶ προείπαμεν ὑμῖν καὶ διεμαρτυράμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/006.yaml
  text: that no one should overstep and exploit his brother in this matter[a], because the Lord is an avenger concerning all these things[b], just as we also told you beforehand and solemnly warned you.
translation:
  language: te
  text: ఈ విషయంలో ఎవరూ తన సహోదరుని హద్దు దాటి, అతనిని అన్యాయంగా ఉపయోగించుకోకూడదు[a]. ఎందుకంటే వీటన్నిటి విషయంలో ప్రభువు ప్రతీకారం తీర్చేవాడు. ఇదే విషయాన్ని మేము మీకు ముందుగానే చెప్పి గంభీరంగా హెచ్చరించాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ వ్యవహారంలో తన సహోదరుని మోసం చేయకూడదు.’ గ్రీకు క్రియకు ఒకరిని అన్యాయంగా ఉపయోగించుకోవడం లేదా అన్యాయంగా లాభం పొందడం అనే భావం ఉంది; కొందరు దీన్ని మరింత సంకుచితంగా మోసం చేయడమని అర్థం చేసుకుంటారు. అయితే సందర్భం ప్రధానంగా లైంగిక తప్పిదాన్ని సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ ὑπερβαίνειν
  choice: ఎవరూ హద్దుమీరి ... కూడదు
  rationale: ఈ క్రియ నైతిక హద్దును దాటడాన్ని సూచిస్తుంది. ‘హద్దుమీరి’ మూలంలోని రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; నిషేధార్థక infinitive భావాన్ని ‘ఎవరూ ... కూడదు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πλεονεκτεῖν
  choice: దోచుకోకూడదు
  rationale: ఇతరుని నష్టపరుస్తూ అన్యాయంగా ప్రయోజనం పొందడం అనే విస్తృత భావాన్ని ‘దోచుకోవడం’ ఇక్కడ వ్యక్తం చేస్తుంది. ఇది కేవలం ఆర్థిక మోసానికి పరిమితం కాకుండా, సందర్భంలోని లైంగిక దుర్వినియోగానికీ సరిపోతుంది.
- source_word: ἐν τῷ πράγματι
  choice: ఈ విషయంలో
  rationale: πρᾶγμα సాధారణ పదమైనప్పటికీ ముందు వచనాల్లోని లైంగిక పవిత్రత బోధను సూచిస్తుంది. ‘ఈ విషయంలో’ ఆ సందర్భసంబంధాన్ని నిలుపుతూ, మూలం కంటే ఎక్కువ నిర్దిష్టతను చేర్చదు.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: తన సహోదరుణ్ణి
  rationale: మూలంలోని పుంలింగ ఏకవచన రూపాన్ని ఖచ్చితంగా ప్రతిబింబిస్తుంది. ‘సహోదరుడు’ ఇక్కడ విశ్వాస సమాజంలోని వ్యక్తిని సూచించే గౌరవప్రదమైన, సహజమైన పదం.
- source_word: ἔκδικος κύριος
  choice: ప్రభువు ప్రతీకారం తీర్చేవాడు
  rationale: ἔκδικος అన్యాయానికి న్యాయమైన ప్రతిఫలం విధించే వ్యక్తిని సూచిస్తుంది. ‘ప్రతీకారం తీర్చేవాడు’ మూలంలోని బలమైన న్యాయతీర్పు భావాన్ని కాపాడుతుంది; κύριοςను ‘ప్రభువు’గా అనువదించాం.
- source_word: περὶ πάντων τούτων
  choice: వీటన్నిటి విషయంలో
  rationale: ముందు ప్రస్తావించిన లైంగిక పాపాలు, వాటివల్ల జరిగే అన్యాయం అన్నిటినీ కలుపుకునే మూలంలోని విస్తృత పరిధిని నిలుపుతుంది.
- source_word: προείπαμεν
  choice: ఇంతకుముందే మీతో చెప్పి
  rationale: వారికి ముందే తెలిపిన విషయమనే కాలసూచనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; తరువాతి బలమైన హెచ్చరిక క్రియతో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: διεμαρτυράμεθα
  choice: గంభీరంగా హెచ్చరించినట్లే
  rationale: ఈ క్రియలోని బలమైన సాక్ష్యప్రకటన లేదా గంభీర హెచ్చరిక భావాన్ని సందర్భానుకూలంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఈ విషయం’ దేనిని సూచిస్తుంది, తప్పిద స్వభావం ఏమిటి?
  choice: 3–5 వచనాల్లోని లైంగిక పవిత్రత బోధనే కొనసాగిస్తూ, ఆ విషయంలో సహవిశ్వాసి హద్దులను అతిక్రమించి అతన్ని దోచుకోవద్దనే హెచ్చరిక.
  alternative: సాధారణ వ్యాపార మోసం లేదా ఇతర వ్యక్తిగత వ్యవహారాల్లో అన్యాయం.
  rationale: తక్షణ సందర్భం పవిత్రీకరణ, లైంగిక దుర్నీతి, పవిత్రతతో శరీరాన్ని అదుపులో ఉంచుకోవడం గురించి ఉంది. అయినా πλεονεκτεῖνకు సాధారణ మోసం అనే అర్థం కూడా సాధ్యమే. అందుచేత ప్రధాన పాఠం సందర్భానికి సరిపోయే విస్తృత పదాన్ని వాడి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: ἀδελφός అనువాదం
  choice: తన సహోదరుణ్ణి
  alternative: సహోదరుణ్ణి లేదా సహోదరిని; తోటి విశ్వాసిని
  rationale: గ్రీకు పదం పుంలింగ ఏకవచనం. ప్రధాన పాఠం ఆ రూపాన్ని నిలుపుతుంది; నైతిక నియమం విశ్వాస సమాజంలో మరింత విస్తృతంగా వర్తించగలదనే విషయాన్ని మూలరూపాన్ని మార్చకుండా అర్థం చేసుకోవచ్చు.
- issue: κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ సందర్భంలో తీర్పు తీర్చే పునరుత్థాన ప్రభువును సూచిస్తుంది. ‘ప్రభువు’ పదం సహజమైన తెలుగు బైబిలు వాడుకను, పదార్థ మరియు ధార్మిక కొనసాగింపును నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని నైతిక తీవ్రతను ‘హద్దుమీరి’, ‘దోచుకోకూడదు’, ‘ప్రతీకారం తీర్చేవాడు’, ‘గంభీరంగా హెచ్చరించినట్లే’ అనే పదబంధాలతో నిలిపాం. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదసూచికతో సరిపోతుంది.
