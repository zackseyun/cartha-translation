  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ πιστεύομεν ὅτι Ἰησοῦς ἀπέθανεν καὶ ἀνέστη, οὕτως καὶ ὁ θεὸς τοὺς κοιμηθέντας διὰ τοῦ Ἰησοῦ ἄξει σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/014.yaml
  text: For if we believe that Jesus died and rose again[b][a], so also God will bring with him those who have fallen asleep through Jesus.
translation:
  language: te
  text: ఎందుకంటే, యేసు చనిపోయి తిరిగి లేచాడని మనం నమ్మితే, అలాగే దేవుడు కూడా యేసు ద్వారా[b] నిద్రించినవారిని[a] ఆయనతో పాటు తీసుకొస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చనిపోయినవారిని.’ ఈ సందర్భంలో విశ్వాసుల మరణాన్ని సూచించడానికి పౌలు ‘నిద్రించడం’ అనే రూపకాన్ని ఉపయోగిస్తున్నాడు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘యేసులో నిద్రించినవారిని.’ ‘యేసు ద్వారా’ (διὰ τοῦ Ἰησοῦ) అనే పదబంధం యేసు మాధ్యమంగా అని గానీ, యేసుతో సన్నిహిత సంబంధంలో అని గానీ అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ఎందుకంటే ... నమ్మితే
  rationale: γάρ యొక్క కారణసూచక భావాన్నీ, εἰ యొక్క షరతునూ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πιστεύομεν
  choice: మనం నమ్మితే
  rationale: యేసు మరణం, పునరుత్థానం గురించిన విశ్వాసుల ఉమ్మడి నమ్మకాన్ని సూచిస్తుంది.
- source_word: Ἰησοῦς ἀπέθανεν καὶ ἀνέστη
  choice: యేసు చనిపోయి తిరిగి లేచాడు
  rationale: రెండు గ్రీకు కర్తరి అఒరిస్ట్ క్రియల సరళమైన సంఘటనార్థాన్ని నిలుపుతుంది; ἀνέστη ను కర్మణి రూపంగా మార్చదు.
- source_word: οὕτως καὶ
  choice: అలాగే ... కూడా
  rationale: యేసు మరణించి లేచిన సంగతికీ, నిద్రించినవారి విషయంలో దేవుడు చేయబోయే కార్యానికీ ఉన్న అనుసంధానాన్ని అతిగా వివరించకుండా చూపుతుంది.
- source_word: τοὺς κοιμηθέντας
  choice: నిద్రించినవారిని
  rationale: మరణానికి పౌలు ఉపయోగించిన నిద్ర రూపకాన్ని తొలగించకుండా నిలుపుతుంది.
- source_word: διὰ τοῦ Ἰησοῦ
  choice: యేసు ద్వారా
  rationale: διά + genitive యొక్క సాధారణ సాధన లేదా మాధ్యమ భావాన్ని అనుసరిస్తూ, వాక్యభాగంలోని నిజమైన అర్థసందిగ్ధతను పాదటిప్పణిలో ఉంచుతుంది.
- source_word: ἄξει σὺν αὐτῷ
  choice: ఆయనతో పాటు తీసుకొస్తాడు
  rationale: ἄξει యొక్క భవిష్యత్ భావాన్నీ, σύν యొక్క సహవాస భావాన్నీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘ఆయన’ సందర్భంలో యేసును సూచిస్తుంది.
theological_decisions:
- issue: κοιμηθέντας అనే మరణ రూపకం
  choice: ప్రధాన పాఠ్యంలో ‘నిద్రించినవారు’ అని రూపకాన్ని నిలుపడం
  alternative: ‘చనిపోయినవారు’
  rationale: నిజమైన మరణాన్నీ భవిష్యత్ పునరుత్థాన నిరీక్షణనూ కలిపి చెప్పే పౌలు రూపకాన్ని నేరుగా ‘చనిపోయినవారు’గా మార్చకుండా కాపాడుతుంది.
- issue: διὰ τοῦ Ἰησοῦ యొక్క సంబంధం మరియు భావం
  choice: ‘యేసు ద్వారా’ అని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘యేసులో’; ‘యేసు కారణంగా’
  rationale: ఈ పదబంధం సాధనం లేదా మాధ్యమం, కారణం, లేక యేసుతో సన్నిహిత సంబంధం అనే భావాల్లో అర్థం కావచ్చు. ఒకే వ్యాఖ్యానాన్ని ఖరారు చేయకుండా ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. ‘నిద్రించినవారు’ అనే బైబిలీయ రూపకాన్ని అలాగే ఉంచి పాదటిప్పణిలో దాని అర్థాన్ని స్పష్టం చేశాం; గ్రీకు పదబంధంలోని సందిగ్ధతను ప్రధాన పాఠ్యంలో పరిష్కరించకుండా ఉంచాం.
