reference: 1 Thessalonians 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Λοιπὸν ⸀οὖν, ἀδελφοί, ἐρωτῶμεν ὑμᾶς καὶ παρακαλοῦμεν ἐν κυρίῳ Ἰησοῦ, ⸀ἵνα καθὼς παρελάβετε παρ’ ἡμῶν τὸ πῶς δεῖ ὑμᾶς περιπατεῖν καὶ ἀρέσκειν θεῷ, ⸂καθὼς καὶ περιπατεῖτε⸃, ἵνα περισσεύητε μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/001.yaml
  text: Finally then[a], brothers, we ask and urge you in the Lord Jesus that, just as you received from us how you ought to walk and to please God, just as you are also walking, you abound more and more.
translation:
  language: te
  text: 'కాబట్టి ఇక, సహోదరులారా[a], ప్రభువైన యేసులో మేము మిమ్మల్ని వేడుకొని ప్రోత్సహిస్తున్నాము: మీరు ఎలా నడుచుకొని దేవుణ్ణి సంతోషపరచాలో మా నుండి స్వీకరించిన ప్రకారం—మీరు అలాగే నడుచుకుంటున్నారు కూడా—మరింతగా వృద్ధి చెందాలని.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహోదర సహోదరీలారా’; గ్రీకులో ‘సహోదరులారా’ అని ఉంది, అయితే పురుష బహువచనం తరచుగా స్త్రీపురుషులు కలిసిన సమూహాన్ని ఉద్దేశిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπὸν οὖν
  choice: చివరిగా కాబట్టి
  rationale: λοιπόν సూచించే ముగింపు దశకు మార్పును, οὖν యొక్క అన్వయార్థాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు పురుష బహువచన సంబోధనను ప్రధాన పాఠ్యంలో నిలుపుతూ, అది మొత్తం విశ్వాస సమాజాన్ని ఉద్దేశించగలదని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: ἐρωτῶμεν ... καὶ παρακαλοῦμεν
  choice: మేము మిమ్మల్ని అడిగి బతిమాలుతున్నది
  rationale: రెండు క్రియలలోని వినతి, గట్టి ప్రోత్సాహం రెండింటినీ సహజమైన తెలుగు జంటప్రయోగంతో వ్యక్తపరుస్తుంది.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: ప్రభువైన యేసులో
  rationale: ἐν యొక్క ‘లో’ భావాన్ని, κύριος అనే క్రీస్తు బిరుదును నిలుపుతుంది; విజ్ఞప్తి జరిగే ఆధ్యాత్మిక పరిధి లేదా అధికారాన్ని బలవంతంగా ఒకే అర్థానికి పరిమితం చేయదు.
- source_word: καθὼς παρελάβετε παρ’ ἡμῶν
  choice: మా దగ్గర స్వీకరించిన ప్రకారం
  rationale: బోధను లేదా సంప్రదాయాన్ని అందుకోవడం అనే παραλαμβάνω భావాన్ని పారదర్శకంగా ఉంచుతుంది.
- source_word: τὸ πῶς δεῖ ὑμᾶς περιπατεῖν
  choice: మీరు ఎలా నడుచుకోవాలో
  rationale: περιπατεῖν లోని నడక రూపకాన్ని తెలుగు ‘నడుచుకోవడం’ ద్వారా సహజంగా, నైతిక జీవనార్థంతో నిలుపుతుంది; δεῖ యొక్క బాధ్యతా భావం ‘-ఆలో’ నిర్మాణంలో వ్యక్తమవుతుంది.
- source_word: καὶ ἀρέσκειν θεῷ
  choice: దేవుణ్ణి ఎలా సంతోషపరచాలో
  rationale: దేవునికి ఇష్టమైన విధంగా జీవించడం అనే ప్రత్యక్ష భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: καθὼς καὶ περιπατεῖτε
  choice: మీరు ఇప్పుడు అలాగే నడుచుకుంటున్నారు కూడా
  rationale: వర్తమాన కాలంలో వారి ప్రస్తుత ప్రవర్తనను మెచ్చుకునే భావాన్ని, καί యొక్క ‘కూడా’ బలాన్ని నిలుపుతుంది.
- source_word: ἵνα περισσεύητε μᾶλλον
  choice: ఇంకా ఇంకా అభివృద్ధి చెందండి
  rationale: ఇప్పటికే ఉన్న మంచి నడవడిలో మరింత వృద్ధి చెందాలనే περισσεύω భావాన్ని సహజమైన తెలుగు ఆజ్ఞార్థ విజ్ఞప్తిగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: థెస్సలొనీక విశ్వాసులకు లింగసూచక సంబోధన
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులారా’; సమూహంలో స్త్రీలు కూడా ఉద్దేశింపబడ్డారని పాదటిప్పణి
  alternative: సహోదర సహోదరీలారా
  rationale: ἀδελφοί వ్యాకరణపరంగా పురుష బహువచనం; సందర్భంలో అది మొత్తం విశ్వాస సమాజాన్ని ఉద్దేశించవచ్చు. మూలరూపాన్ని పాఠ్యంలో నిలిపి, సందర్భ విస్తృతిని పాదటిప్పణిలో స్పష్టం చేయడం రెండు అంశాలనూ కాపాడుతుంది.
- issue: యేసుకు వర్తించిన κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఇక్కడ κύριος యేసుకు సంబంధించిన క్రీస్తు బిరుదు; ‘ప్రభువు’ దాని గౌరవ, అధికార భావాలను సహజంగా నిలుపుతుంది.
- issue: ἐν κυρίῳ Ἰησοῦ యొక్క సంబంధం
  choice: ప్రభువైన యేసులో
  alternative: ప్రభువైన యేసు అధికారంతో
  rationale: ఈ పదబంధం క్రీస్తుతో ఐక్యత అనే పరిధిని లేదా ఆయన అధికారాన్ని సూచించవచ్చు. ‘లో’ అనే రూపం మూలంలోని నిజమైన భావవిస్తృతిని ముందే పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘నడుచుకోవడం’ పౌలు ఉపయోగించిన జీవననడత రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది. దీర్ఘ గ్రీకు వాక్యంలోని ప్రధాన విజ్ఞప్తిని స్పష్టపరచడానికి ద్విబిందువు, మధ్య చొప్పింపును చూపడానికి దీర్ఘ విరామచిహ్నాలు వాడబడ్డాయి.
