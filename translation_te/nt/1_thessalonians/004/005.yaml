    text: 'లేదా, ‘కామవాంఛా ఉద్రేకంలో.’ గ్రీకులో రెండు నామవాచకాలు ఉన్నాయి: ‘ఉద్రేకం/భావోద్వేగం’ మరియు ‘వాంఛ.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐν πάθει ἐπιθυμίας
  choice: కామావేశంతో కాదు
  rationale: ἐν ఇక్కడ ప్రవర్తనా విధానాన్ని సూచిస్తుంది. πάθος మరియు ἐπιθυμία కలిసి సందర్భానుసారంగా అదుపులేని లైంగిక వాంఛను సూచిస్తున్నాయి; ‘కామావేశం’ ఆధునిక తెలుగులో ఆ భావాన్ని సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: καθάπερ καὶ
  choice: లాగా ... కాదు
  rationale: ముందటి నిషేధంతో అనుసంధానమైన పోలికను తెలుగులో సహజంగా వ్యక్తం చేయడానికి నిషేధాన్ని చివర మరలా ఉంచాం. గ్రీకులోని καί భావం పోలిక నిర్మాణంలో అంతర్భూతమవుతుంది.
- source_word: τὰ ἔθνη
  choice: అన్యజనులు
  rationale: పౌలు వాడుకలో ఇది సాధారణంగా యూదేతర జనాలను సూచిస్తుంది. ‘అన్యజనులు’ తెలుగు బైబిలు పరిభాషలో స్థిరమైనదిగా ఉండి, ‘విగ్రహారాధకులు’ అనే అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: τὰ μὴ εἰδότα τὸν θεόν
  choice: దేవుణ్ణి ఎరుగని
  rationale: నిరాకరణతో కూడిన attributive participle దేవుణ్ణి ఎరుగని కొనసాగుతున్న స్థితిని వివరిస్తుంది. ‘ఎరుగని’ గంభీరమైనదైనా సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: πάθει ἐπιθυμίας యొక్క భావం
  choice: కామావేశం
  alternative: కామవాంఛ యొక్క ఉద్రేకం / తీవ్రమైన వాంఛ
  rationale: సమీప సందర్భం లైంగిక పవిత్రతకు సంబంధించినది కాబట్టి ‘కామ’ సముచితం. అయితే రెండు గ్రీకు నామవాచకాల సంబంధాన్ని తెలుగులో సహజత కోసం ఒక సమాస భావంగా ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- issue: ἔθνη అనే పదం సూచించే వర్గం
  choice: అన్యజనులు
  alternative: జనాలు / విగ్రహారాధకులు
  rationale: ఈ సందర్భంలో యూదేతర, దేవుణ్ణి ఎరుగని బయటి ప్రజలను సూచిస్తుంది. ‘అన్యజనులు’ మూలంలోని జాతి-మత వర్గాన్ని కాపాడుతుంది; ‘విగ్రహారాధకులు’ మూలంలో స్పష్టంగా లేని భావాన్ని చేర్చే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఇది ముందటి వాక్యంపై ఆధారపడే వచనభాగం అయినప్పటికీ, పోలికలోని నిషేధం స్పష్టంగా ఉండేందుకు తెలుగులో చివర ‘కాదు’ను పునరుక్తి చేశాం.
