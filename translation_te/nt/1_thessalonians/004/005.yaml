translation:
  language: te
  text: దేవుణ్ణి తెలియని అన్యజనులు కూడా చేసే విధంగా కామవాంఛతో కూడిన ఉద్రేకంలో కాకుండా,[a]
  philosophy: optimal-equivalence
  footnotes:
