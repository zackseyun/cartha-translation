id: 1TH.4.8
reference: 1 Thessalonians 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοιγαροῦν ὁ ἀθετῶν οὐκ ἄνθρωπον ἀθετεῖ ἀλλὰ τὸν θεὸν τὸν ⸀καὶ ⸀διδόντα τὸ πνεῦμα αὐτοῦ τὸ ἅγιον εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/008.yaml
  text: Therefore[a], whoever rejects this rejects not man but God[b], who also gives his Holy Spirit to you.
translation:
  language: te
  text: కాబట్టి, దీనిని తిరస్కరించేవారు మనిషిని కాదు, తన పరిశుద్ధాత్మను కూడా మీకు అనుగ్రహించే దేవుణ్ణే తిరస్కరిస్తారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοιγαροῦν
  choice: కాబట్టి
  rationale: ముందటి ఉపదేశం నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ ἀθετῶν / ἀθετεῖ
  choice: తిరస్కరించేవారు … తిరస్కరిస్తారు
  rationale: ἀθετέω అధికారపూర్వకమైన ఉపదేశాన్ని తిరస్కరించడం, లెక్కచేయకపోవడం లేదా తోసిపుచ్చడం అనే భావాలను కలిగి ఉంది. దేవుణ్ణి తిరస్కరించడమనే వ్యత్యాసానికి ‘తిరస్కరించు’ బాగా సరిపోతుంది. లింగభేదం లేకుండా సాధారణ వర్తనను తెలియజేయడానికి తెలుగులో గౌరవ/సాధారణ బహువచనం వాడబడింది.
- source_word: οὐκ ἄνθρωπον … ἀλλὰ τὸν θεόν
  choice: మనిషిని కాదు … దేవుణ్ణే
  rationale: ἄνθρωπον ఇక్కడ ఒక నిర్దిష్ట పురుషుణ్ణి కాక మానవుణ్ణి సాధారణంగా సూచిస్తుంది; సంక్షిప్తమైన మూలభాషా వ్యత్యాసాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: τὸν καὶ διδόντα
  choice: అనుగ్రహించే
  rationale: వర్తమాన కృదంతం దేవుణ్ణి ఆయన చేసే కార్యం ద్వారా మరింతగా గుర్తిస్తుంది. సందర్భంలో ‘అనుగ్రహించే’ అనేది దానమిచ్చే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; καί భావం వాక్యనిర్మాణంలో దేవుని గుర్తింపుతో ఈ కార్యాన్ని కలిపి తెలియజేయబడింది.
- source_word: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον
  choice: తన పరిశుద్ధాత్మను
  rationale: పౌలు సందర్భంలో ఇది దేవునికి చెందిన పరిశుద్ధాత్మను సూచిస్తుంది. ‘తన’ అనేది దేవునినే తిరిగి సూచిస్తూ తెలుగు వాక్యాన్ని సహజంగా ఉంచుతుంది.
- source_word: εἰς ὑμᾶς
  choice: మీకు
  rationale: εἰς సాధారణంగా ‘లోనికి’ అనే భావం ఇవ్వగలిగినా, δίδωμι అనే ‘ఇవ్వు’ క్రియతో వ్యక్తులను ఉద్దేశించినప్పుడు తెలుగులో ‘మీకు అనుగ్రహించే’ అనేది సహజమైన సమానార్థక ప్రయోగం. అక్షరార్థ అవకాశాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: ‘తన పరిశుద్ధాత్మ’ అనే పదబంధపు సూచన
  choice: దేవుడు విశ్వాసులకు అనుగ్రహించే పరిశుద్ధాత్మను సూచించేలా అనువదించబడింది.
  alternative: ‘పరిశుద్ధమైన ఆత్మ’ను ఒక వ్యక్తిత్వరహిత వరంగా లేదా స్వభావంగా అర్థం చేసుకోవడం.
  rationale: τὸ πνεῦμα αὐτοῦ τὸ ἅγιον అనే నిర్మాణం పౌలు సందర్భంలో దేవుని పరిశుద్ధాత్మను సహజంగా సూచిస్తుంది; అంతకుమించిన సిద్ధాంత వివరణను వాక్యంలో చేర్చలేదు.
- issue: ὁ ἀθετῶν యొక్క సాధారణ వర్తన
  choice: లింగానికి పరిమితం కాని ‘తిరస్కరించేవారు’ అనే సాధారణ రూపం వాడబడింది.
  alternative: ‘తిరస్కరించేవాడు’ లేదా ‘తిరస్కరించే వ్యక్తి’.
  rationale: గ్రీకు పుంలింగ ఏకవచన కృదంతం ఇక్కడ పురుషులకు మాత్రమే పరిమితం కాకుండా ఎవరైనా అనే ప్రతినిధి భావంతో ఉంది. తెలుగు సాధారణ బహువచనం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి వాడబడింది. మూలంలోని సంక్షిప్త వ్యత్యాసం మరియు దేవుణ్ణి తిరస్కరించడమనే తీవ్రత నిలుపబడ్డాయి.
