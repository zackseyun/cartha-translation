id: 1TH.4.13
reference: 1 Thessalonians 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ θέλομεν δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, περὶ τῶν ⸀κοιμωμένων, ἵνα μὴ λυπῆσθε καθὼς καὶ οἱ λοιποὶ οἱ μὴ ἔχοντες ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/013.yaml
  text: But we do not want you to be uninformed[a], brothers, about those who have fallen asleep, so that you may not grieve as the rest do[b], who have no hope.
translation:
  language: te
  text: అయితే, సహోదరులారా[b], నిద్రపోయినవారి[a] గురించి మీరు తెలియక ఉండాలని మేము కోరము. నిరీక్షణలేని మిగతావారిలా మీరు దుఃఖించకూడదని మేము కోరుతున్నాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిద్రిస్తున్నవారు’; ఇక్కడ పౌలు ‘నిద్ర’ను మరణించిన విశ్వాసులను సూచించే రూపకంగా వాడుతున్నాడు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘సహోదరులు’ అనే సంబోధన సంఘమంతటినీ ఉద్దేశిస్తుంది; అందులో పురుషులు, స్త్రీలు ఇద్దరూ ఉన్నారు.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐ θέλομεν δὲ
  choice: అయితే … మాకు ఇష్టం లేదు
  rationale: δέ స్వల్పమైన సంధానాన్ని లేదా వ్యత్యాసాన్ని సూచిస్తుంది; ‘అయితే’ దానిని అతిశయింపజేయకుండా సహజంగా తెలియజేస్తుంది. Οὐ θέλομεν అనే మాటను ఆధునిక తెలుగులో సహజంగా ‘మాకు ఇష్టం లేదు’ అని అందించాం.
- source_word: ὑμᾶς ἀγνοεῖν
  choice: మీరు తెలియకుండా ఉండడం
  rationale: ἀγνοεῖν అంటే తెలియకపోవడం లేదా సమాచారం లేకపోవడం. అవమానార్థం కలిగే పదాన్ని వాడకుండా మూలార్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం; పౌలు సంఘమంతటినీ సంబోధించే సందర్భంలో దీనిని వాడుతున్నాడు. మూలరూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని సమగ్ర పరిధిని పాదటిప్పణిలో తెలిపాం.
- source_word: περὶ τῶν κοιμωμένων
  choice: నిద్రపోయినవారి గురించి
  rationale: κοιμωμένων అనే పదంలోని ‘నిద్ర’ రూపకాన్ని నిలిపి ఉంచాం. ఈ సందర్భంలో అది మరణించిన విశ్వాసులను సూచించినా, నేరుగా ‘మరణించినవారు’ అని మార్చడం మూలంలోని పునరుత్థాన సంబంధిత రూపకాన్ని తొలగిస్తుంది.
- source_word: ἵνα μὴ λυπῆσθε
  choice: మీరు దుఃఖించకూడదని మా ఉద్దేశం
  rationale: ἵνα + subjunctive ఇక్కడ ఉద్దేశాన్ని తెలియజేస్తుంది. ఈ అనువాదం దుఃఖాన్నే పూర్తిగా నిషేధిస్తున్నట్టు కాకుండా, నిరీక్షణలేనివారి విధంగా దుఃఖించకూడదనే పౌలు ఉద్దేశాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καθὼς καὶ οἱ λοιποὶ
  choice: మిగతావారిలా
  rationale: οἱ λοιποί ఈ పోలికలో విశ్వాస సమాజానికి వెలుపల ఉన్న ఇతరులను సూచిస్తుంది. ‘మిగతావారు’ మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: οἱ μὴ ἔχοντες ἐλπίδα
  choice: నిరీక్షణలేని
  rationale: ఈ కృదంత పదబంధాన్ని సంక్షిప్తమైన, సహజమైన తెలుగులో అందిస్తూ, అంత్యకాల నిరీక్షణకు సంబంధించిన వ్యత్యాసాన్ని నిలిపాం.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో κοιμωμένων అర్థం
  choice: ‘నిద్రపోయినవారు’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపాం.
  alternative: ‘మరణించినవారు’ లేదా ‘నిద్రిస్తున్నవారు’
  rationale: పునరుత్థాన నిరీక్షణ సందర్భంలో మరణించిన విశ్వాసుల కోసం పౌలు ఉద్దేశపూర్వకంగా ‘నిద్ర’ రూపకాన్ని వాడాడు. దానిని నిలపడం వచనంలోని వేదాంతపరమైన భావగాఢతను కాపాడుతుంది; సూచనార్థాన్ని పాదటిప్పణి వివరిస్తుంది.
- issue: ἀδελφοί పదం ఎవరిని కలుపుకుంటుంది
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులారా’ అని ఉంచి, సంఘంలోని స్త్రీపురుషులిద్దరూ ఇందులో ఉన్నారని పాదటిప్పణిలో స్పష్టం చేశాం.
  alternative: ‘సహోదర సహోదరీలారా’ లేదా ‘తోటి విశ్వాసులారా’
  rationale: మూల గ్రీకు పదం పుంలింగ బహువచన రూపంలో ఉన్నప్పటికీ, ఈ సంఘ సంబోధన సందర్భంలో స్త్రీపురుషులిద్దరినీ ఉద్దేశించే అవకాశం బలంగా ఉంది. ప్రధాన పాఠ్యం రూపాన్ని, పాదటిప్పణి పరిధిని కాపాడుతున్నాయి.
- issue: విశ్వాసుల దుఃఖ స్వభావం
  choice: ‘మిగతావారిలా’ అనే పోలికను ‘దుఃఖించకూడదు’తో స్పష్టంగా అనుసంధానించాం.
  alternative: ఏ విధమైన దుఃఖమూ ఉండకూడదనే సంపూర్ణ నిషేధంగా చదవడం
  rationale: మూలవాక్యం దుఃఖాన్ని పూర్తిగా నిషేధించదు; నిరీక్షణలేనివారి విధమైన దుఃఖంతో విశ్వాసుల దుఃఖాన్ని వ్యత్యాసపరుస్తుంది. ఈ ఉద్రిక్తతను పరిష్కరించకుండా వాక్య నిర్మాణంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘నిద్రపోయినవారు’ అనే బైబిలీయ రూపకాన్ని సహజంగా ఉంచి, అపార్థం రాకుండా పాదటిప్పణి జోడించాం. వాక్యాంతంలోని ఉద్దేశ సంబంధాన్ని తెలుగులో స్పష్టంగా వినిపించేందుకు ‘మా ఉద్దేశం’ అని వ్యక్తీకరించాం.
