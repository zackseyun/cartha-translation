    issue: ‘మా ఉద్దేశం’ చేర్చబడింది
    rationale: ἵνα μὴ λυπῆσθε ఉద్దేశాన్ని తెలియజేస్తుంది, కానీ ‘మా ఉద్దేశం’ అనే నామవాచకం మూలపాఠ్యంలో లేదు. ప్రత్యక్ష ఉపవాక్యం మూల నిర్మాణానికీ భావానికీ మరింత దగ్గరగా ఉంటుంది.
  - severity: low
