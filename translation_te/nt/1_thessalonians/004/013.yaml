revisions:
- from: అయితే సహోదరులారా[b], నిద్రపోయినవారి[a] గురించి మీరు తెలియకుండా ఉండడం మాకు ఇష్టం లేదు. నిరీక్షణలేని మిగతావారిలా మీరు దుఃఖించకూడదని మా ఉద్దేశం.
  to: అయితే, సహోదరులారా[b], నిద్రపోయినవారి[a] గురించి మీరు తెలియక ఉండాలని మేము కోరము. నిరీక్షణలేని మిగతావారిలా మీరు దుఃఖించకూడదని మేము కోరుతున్నాము.
  rationale: మొదటి వాక్యంలోని θέλομεν నిర్మాణాన్ని ‘మేము కోరము/కోరుతున్నాము’గా స్థిరంగా, సూటిగా అందించాం. ἵνα ఉపవాక్యంలోని ఉద్దేశ సంబంధాన్ని ‘మా ఉద్దేశం’ అనే అదనపు వ్యాఖ్యాన పదం లేకుండా ఉంచాం. ‘నిద్రపోయినవారు,’ ‘సహోదరులారా,’ మరియు నిరీక్షణలేని ఇతరులతో పోలికను నిలిపి, పాదటిప్పణి aలోని వ్యాకరణాన్ని సరిచేశాం.
