  text: οἴδατε γὰρ τίνας παραγγελίας ἐδώκαμεν ὑμῖν διὰ τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/002.yaml
  text: For you know what instructions we gave you through the Lord Jesus[a].
translation:
  language: te
  text: ఎందుకంటే ప్రభువైన యేసు ద్వారా మేము మీకు ఏ ఆదేశాలు ఇచ్చామో మీకు తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రభువైన యేసు అధికారంతో.’
    reason: διὰ τοῦ κυρίου Ἰησοῦ అనే పదబంధానికి సందర్భంలో సాధ్యమైన అధికారార్థాన్ని సూచించడానికి.
lexical_decisions:
- source_word: οἴδατε
  choice: మీకు తెలుసు
  rationale: οἶδα పరిపూర్ణ రూపంలో ఉన్నప్పటికీ కొయినే గ్రీకులో వర్తమానార్థాన్ని ఇస్తుంది; ఆధునిక తెలుగులో ‘మీకు తెలుసు’ సహజంగా ఉంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను అనుసంధానిస్తుంది; తెలుగులో ‘ఎందుకంటే’ ఈ సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τίνας παραγγελίας
  choice: ఏ ఆదేశాలు
  rationale: τίνας బహువచనంలోని παραγγελίαςను నిర్దేశిస్తుంది. παραγγελίαలో అధికారపూర్వక ఉపదేశం లేదా ఆజ్ఞ భావం ఉన్నందున ‘ఆదేశాలు’ రెండింటి మధ్య తగిన సమతుల్యతను కలిగిస్తుంది.
- source_word: ἐδώκαμεν ὑμῖν
  choice: మేము మీకు ... ఇచ్చామో
  rationale: δίδωμι యొక్క సాధారణ అర్థమైన ‘ఇవ్వడం’ను నిలుపుతూ, పరోక్ష కర్మను తెలుగులో సహజమైన ‘మీకు’తో వ్యక్తం చేసింది.
- source_word: διὰ τοῦ κυρίου Ἰησοῦ
  choice: ప్రభువైన యేసు ద్వారా
  rationale: జనిటివ్‌తో διά సాధనం లేదా మధ్యవర్తిత్వాన్ని సూచించగలదు. ‘ద్వారా’ గ్రీకు నిర్మాణాన్ని నిలుపుతూ అధికార భావాన్ని తప్పనిసరిగా ఒక్క అర్థానికే పరిమితం చేయదు.
- source_word: κυρίου Ἰησοῦ
  choice: ప్రభువైన యేసు
  rationale: κύριοςకు ప్రమాణ తెలుగు రూపం ‘ప్రభువు’; విశేషణాత్మక అనుసంధానంతో ‘ప్రభువైన యేసు’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
theological_decisions:
- issue: διὰ τοῦ κυρίου Ἰησοῦ యొక్క భావబలం
  choice: ప్రభువైన యేసు ద్వారా
  alternative: ప్రభువైన యేసు అధికారంతో
  rationale: ఈ పదబంధం మధ్యవర్తిత్వం/సాధనం లేదా అధికారాన్ని సూచించవచ్చు. ప్రధాన పాఠంలోని ‘ద్వారా’ మూలంలోని విస్తృత భావాన్ని, ధార్మిక ఉద్వేగాన్ని నిలుపుతుంది; సందర్భోచితమైన అధికార భావాన్ని పాదటిప్పణిలో ప్రత్యామ్నాయంగా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యక్రమం, అయితే ‘ఆదేశాలు’ మరియు ‘ప్రభువైన యేసు ద్వారా’ అనే రూపాలతో మూలంలోని అధికారపూర్వకతను, భావసందిగ్ధతను నిలుపుకుంది.
