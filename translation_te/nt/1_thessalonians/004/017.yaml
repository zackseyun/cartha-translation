id: 1TH.4.17
reference: 1 Thessalonians 4:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔπειτα ἡμεῖς οἱ ζῶντες οἱ περιλειπόμενοι ἅμα σὺν αὐτοῖς ἁρπαγησόμεθα ἐν νεφέλαις εἰς ἀπάντησιν τοῦ κυρίου εἰς ἀέρα· καὶ οὕτως πάντοτε σὺν κυρίῳ ἐσόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/017.yaml
  text: Then we who are alive[a], who remain, will be caught up together with them in the clouds to meet the Lord in the air[b]; and so we will always be with the Lord.
translation:
  language: te
  text: ఆ తరువాత, సజీవులుగా మిగిలి ఉన్న మనం అదే సమయంలో వారితో కలిసి మేఘాల్లో, ప్రభువును కలుసుకోవడానికి, గాలిలోకి ఎత్తబడతాం[a]. ఆ విధంగా మనం ఎల్లప్పుడూ ప్రభువుతో ఉంటాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పైకి లాక్కొనబడతాం.” గ్రీకు క్రియ అకస్మాత్తుగా, బలంగా జరిగే చర్యను నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: ఆ తరువాత
  rationale: మునుపటి వచనంలో చెప్పిన క్రీస్తులో మృతుల పునరుత్థానం తరువాత జరిగే తదుపరి సంఘటనను సూచిస్తుంది.
- source_word: οἱ ζῶντες οἱ περιλειπόμενοι
  choice: సజీవులమై మిగిలి ఉన్న మనం
  rationale: ఆ సమయానికి ఇంకా జీవించి ఉన్న విశ్వాసులను సూచించే రెండు భాగాల వర్ణనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἅμα σὺν αὐτοῖς
  choice: వారితో పాటు
  rationale: పునరుత్థానమైన వారితో ఏకకాలంలో, కలిసి ఉండడమనే భావాలను సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἁρπαγησόμεθα
  choice: అకస్మాత్తుగా ఎత్తబడతాం
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, ἁρπάζωలోని హఠాత్తైన బలమైన చర్య భావాన్ని తెలుగులో తెలియజేస్తుంది; ఏ ప్రత్యేక అంత్యకాల సిద్ధాంత పదజాలాన్నీ చేర్చదు.
- source_word: ἐν νεφέλαις
  choice: మేఘాల్లోకి
  rationale: మేఘాలకు సంబంధించిన స్పష్టమైన దృశ్యాన్ని నిలుపుతుంది; కదలికను సూచించే సందర్భానికి సహజమైన తెలుగు రూపం.
- source_word: εἰς ἀπάντησιν τοῦ κυρίου
  choice: ప్రభువును కలుసుకోవడానికి
  rationale: ప్రభువుతో జరిగే ఎదుర్కోలు వైపు ఉద్దేశపూర్వక కదలికను సహజంగా వ్యక్తం చేస్తుంది; తరువాతి సంఘటనల క్రమాన్ని నిర్దేశించదు.
- source_word: εἰς ἀέρα
  choice: గాలిలో
  rationale: కలుసుకునే స్థలాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; గ్రీకు εἰς యొక్క దిశాభావం మొత్తం వాక్యంలోని కదలిక ద్వారా స్పష్టమవుతుంది.
- source_word: καὶ οὕτως
  choice: ఆ విధంగా
  rationale: ముందు వివరించిన సంఘటనల ద్వారా కలిగే స్థితిని, లేదా పద్ధతిని, అనవసర వ్యాఖ్యానం లేకుండా సూచిస్తుంది.
- source_word: πάντοτε σὺν κυρίῳ ἐσόμεθα
  choice: మనం ఎల్లప్పుడూ ప్రభువుతో ఉంటాం
  rationale: భవిష్యత్ నిశ్చయాన్నీ, ప్రభువుతో నిరంతర సహవాసమనే శిఖర భావాన్నీ స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘ἁρπαγησόμεθα’ అనే పదం మరియు ‘రాప్చర్’ సంబంధిత సిద్ధాంత వాదనలు
  choice: అకస్మాత్తుగా ఎత్తబడతాం
  alternative: పైకి లాక్కొనబడతాం
  rationale: గ్రీకు క్రియలోని అకస్మాత్తైన, బలమైన కర్మణి చర్యను వ్యక్తం చేస్తూ, ఈ సంఘటన సమయం లేదా స్వరూపంపై ఏ సంప్రదాయ సిద్ధాంత వ్యవస్థనూ పాఠ్యంలోకి దిగుమతి చేయదు.
- issue: ‘εἰς ἀπάντησιν τοῦ κυρίου’ యొక్క అంత్యకాలార్థం
  choice: ప్రభువును కలుసుకోవడానికి
  alternative: ప్రభువుతో సమావేశం కావడానికి
  rationale: ప్రభువును ఎదుర్కొని కలుసుకోవడాన్ని మాత్రమే స్పష్టంగా చెబుతుంది. ఆ తరువాత వారు ఏ దిశగా వెళ్తారో ఈ వచనం నిర్దేశించనందున, దానిని అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రభువు’ అనే బిరుదు κύριος యొక్క సంపూర్ణ బిరుదార్థాన్ని నిలుపుతుంది. వచనంలోని మొదటి బహువచన దృష్టికోణం కాపాడబడింది; అంత్యకాల సిద్ధాంతాలకు ప్రత్యేకమైన సాంకేతిక పదజాలం నివారించబడింది.
