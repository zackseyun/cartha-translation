review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the Lord’s personal descent, the commanding call, an archangel’s voice, and the priority of the dead in Messiah. However, “దేవుని బూరధ్వనితో” renders the audible sound rather than the instrument σάλπιγξ (“trumpet”), and “అప్పుడు” is an unnecessary temporal addition to the source’s simple conjunction.
  naturalness: The Telugu is generally clear and suitably elevated. “దేవుని బూరతో” is both more idiomatic and closer to the Greek than “దేవుని బూరధ్వనితో.” Maintaining the verse as one coordinated sentence also better represents the source.
  terminology: “ప్రభువు తానే,” “ప్రధానదూత,” and “మెస్సీయ” are appropriate. “పరలోకం నుండి” naturally communicates the eschatological sense of ἀπ’ οὐρανοῦ in this context. The traditional “క్రీస్తులో” alternative is correctly retained in the footnote.
  issues:
  - severity: medium
    issue: “దేవుని బూరధ్వనితో” translates σάλπιγξ as its sound rather than as a trumpet.
    rationale: The Greek says “with the trumpet of God,” naming the instrument. “దేవుని బూరతో” preserves this lexical meaning without losing natural Telugu.
  - severity: low
    issue: “అప్పుడు” adds an explicit temporal connective not present in the Greek.
    rationale: καί simply coordinates the clauses. “మొదట” already expresses the intended sequence, so the addition is unnecessary.
  revised_text: ఎందుకంటే ప్రభువు తానే ఆజ్ఞతో[a], ప్రధానదూత స్వరంతో, దేవుని బూరతో పరలోకం నుండి దిగివస్తాడు; మెస్సీయలో మృతులైనవారు మొదట లేస్తారు[b].
