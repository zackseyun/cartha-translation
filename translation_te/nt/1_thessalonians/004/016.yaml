revisions:
- from: ఎందుకంటే ప్రభువు తానే ఆజ్ఞతో[a], ప్రధానదూత స్వరంతో, దేవుని బూరధ్వనితో ఆకాశం నుండి దిగివస్తాడు. అప్పుడు మెస్సీయలో మృతులైనవారు మొదట లేస్తారు[b].
  to: ఎందుకంటే ప్రభువు తానే ఆజ్ఞతో[a], ప్రధానదూత స్వరంతో, దేవుని బూరతో పరలోకం నుండి దిగివస్తాడు; మెస్సీయలో మృతులైనవారు మొదట లేస్తారు[b].
