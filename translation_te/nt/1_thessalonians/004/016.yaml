id: 1TH.4.16
reference: 1 Thessalonians 4:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι αὐτὸς ὁ κύριος ἐν κελεύσματι, ἐν φωνῇ ἀρχαγγέλου καὶ ἐν σάλπιγγι θεοῦ, καταβήσεται ἀπ’ οὐρανοῦ, καὶ οἱ νεκροὶ ἐν Χριστῷ ἀναστήσονται πρῶτον,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/016.yaml
  text: For the Lord himself will descend from heaven with a command[a], with the voice of an archangel, and with the trumpet of God, and the dead in Messiah will rise first[b],
translation:
  language: te
  text: ఎందుకంటే ప్రభువు తానే ఆజ్ఞతో[a], ప్రధానదూత స్వరంతో, దేవుని బూరతో పరలోకం నుండి దిగివస్తాడు; మెస్సీయలో మృతులైనవారు మొదట లేస్తారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆజ్ఞాపూర్వకమైన కేకతో.” గ్రీకు పదం ఒకరిని పిలిచే ఆజ్ఞను లేదా బిగ్గరగా పలికే ఆజ్ఞను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: 'సంప్రదాయ అనువాదం: “క్రీస్తులో మృతులైనవారు మొదట లేస్తారు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో ఇచ్చిన ఆదరణకు కారణం లేదా వివరణను పరిచయం చేస్తుంది.
- source_word: αὐτὸς ὁ κύριος
  choice: ప్రభువు తానే
  rationale: αὐτός ఇచ్చే ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐν κελεύσματι
  choice: ఆజ్ఞతో
  rationale: κέλευσμα ఆజ్ఞ, ఆజ్ఞాపూర్వక పిలుపు లేదా కేకను సూచించగలదు; సంక్షిప్త ప్రధాన పాఠంలో ‘ఆజ్ఞతో’ అని ఉంచి, స్పష్టమైన శ్రావ్య భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἐν φωνῇ ἀρχαγγέλου
  choice: ప్రధానదూత స్వరంతో
  rationale: φωνήను ‘స్వరం’గా, ἀρχαγγέλουను సంబంధార్థకంగా అనువదిస్తుంది; గ్రీకులో నిర్దిష్ట ఉపపదం లేనందున తెలుగులో అనవసరంగా ఒక నిర్దిష్ట ప్రధానదూతను సూచించదు.
- source_word: ἐν σάλπιγγι θεοῦ
  choice: దేవుని బూరధ్వనితో
  rationale: σάλπιγξను ‘బూర’గా అనువదిస్తూ, సందర్భంలో వినిపించే ధ్వని భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καταβήσεται ἀπ’ οὐρανοῦ
  choice: ఆకాశం నుండి దిగివస్తాడు
  rationale: భవిష్యత్ క్రియను సహజమైన తెలుగులో వ్యక్తం చేసి, పై నుండి కిందికి వచ్చే దిశను నిలుపుతుంది.
- source_word: οἱ νεκροὶ ἐν Χριστῷ
  choice: మెస్సీయలో మృతులైనవారు
  rationale: οἱ νεκροί అనే సమూహార్థాన్ని సహజంగా వ్యక్తం చేస్తూ, Χριστόςను పేరుగా కాక అభిషిక్తుడనే బిరుదుగా ‘మెస్సీయ’ అని అనువదిస్తుంది.
- source_word: ἀναστήσονται πρῶτον
  choice: మొదట లేస్తారు
  rationale: మధ్యమ రూపంలోని ప్రత్యక్ష పునరుత్థాన భావాన్ని అనవసరమైన కర్మణి రూపం లేకుండా, తరువాతి వచనంతో ఉన్న క్రమాన్ని నిలుపుతూ తెలుపుతుంది.
theological_decisions:
- issue: ἐν Χριστῷలో Χριστός అనువాదం
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: ఈ సందర్భంలో Χριστός అభిషిక్తుడనే బిరుదుగా పనిచేస్తుంది. అందువల్ల అర్థాన్ని తెలిపే ‘మెస్సీయ’ను ప్రధాన పాఠంలో ఉంచి, సుపరిచిత సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ἀναστήσονται యొక్క కర్తృ/కర్మణి భావం
  choice: లేస్తారు
  alternative: లేపబడతారు
  rationale: గ్రీకు రూపం భవిష్యత్ మధ్యమం; ‘లేస్తారు’ దానిని నేరుగా నిలుపుతుంది. ‘లేపబడతారు’ అనడం పాఠంలో స్పష్టంగా లేని కర్మణి భావాన్ని చేర్చవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలిని ఉపయోగించాం. ‘ప్రభువు తానే’ ఉద్ఘాటనను నిలుపుతుంది; ‘ప్రధానదూత స్వరం’ గ్రీకు నిర్దిష్టతలేమిని కాపాడుతుంది. మూలంలోని దీర్ఘ సమన్వయ వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించి, ‘అప్పుడు’తో సంఘటనల క్రమాన్ని తెలిపాం.
