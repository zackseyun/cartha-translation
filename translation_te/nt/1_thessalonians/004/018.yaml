translation:
  language: te
  text: కాబట్టి ఈ మాటలతో ఒకరినొకరు ప్రోత్సహించుకోండి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ మాటలతో ఒకరినొకరు ఓదార్చుకోండి.” ఈ క్రియ ప్రోత్సహించడం, ఓదార్చడం లేదా ఉద్బోధించడం అనే భావాలను ఇవ్వగలదు; ఇక్కడి సందర్భం ముఖ్యంగా ఆదరణనిచ్చే భరోసాను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందు చెప్పిన ప్రభువు రాకడ, మృత విశ్వాసుల పునరుత్థానం, అందరి కలయిక నుంచి వచ్చే ముగింపును సహజంగా సూచిస్తుంది.
- source_word: παρακαλεῖτε
  choice: ప్రోత్సహించుకోండి
  rationale: ఈ క్రియకు ప్రోత్సహించడం, ఓదార్చడం, బతిమాలడం/హెచ్చరించడం వంటి భావాలు ఉండవచ్చు. ఇక్కడ దుఃఖిస్తున్న విశ్వాసులకు భరోసా ఇచ్చే సందర్భంలో ‘ప్రోత్సహించుకోండి’ ప్రధాన భావాన్ని తెలియజేస్తూ ఓదార్పు ఛాయను కూడా నిలుపుతుంది.
- source_word: ἀλλήλους
  choice: ఒకరినొకరు
  rationale: పరస్పర సర్వనామంలోని పరస్పర బాధ్యతను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν
  choice: ఈ మాటలతో
  rationale: ఇక్కడ ἐν ప్రోత్సాహానికి సాధనాన్ని లేదా విషయాన్ని సూచిస్తుంది; తెలుగులో ‘తో’ సహజమైన సమానార్థక ప్రయోగం.
- source_word: τοῖς λόγοις τούτοις
  choice: ఈ మాటలు
  rationale: పౌలు కాస్తముందు చెప్పిన నిర్దిష్ట బోధను నేరుగా సూచిస్తుంది; ‘ఈ సందేశం’ కంటే మూలపద రూపాన్ని మరింత పారదర్శకంగా నిలుపుతుంది.
theological_decisions:
- issue: παρακαλεῖτε యొక్క సందర్భానుసార భావం
  choice: ప్రోత్సహించుకోండి
  alternative: ఒకరినొకరు ఓదార్చుకోండి
  rationale: మరణించిన విశ్వాసుల గురించి ఉన్న దుఃఖానికి ఓదార్పు ఈ సందర్భంలో ప్రముఖమైనా, గ్రీకు క్రియ యొక్క విస్తృతమైన ప్రోత్సాహ భావాన్ని ప్రధాన పాఠంలో నిలిపి, మరింత నిర్దిష్టమైన ‘ఓదార్చుకోండి’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘ప్రోత్సహించుకోండి’ అనే పరస్పర క్రియారూపం ἀλλήλους యొక్క పరస్పరతను సహజంగా తెలియజేస్తుంది; పాదసూచిక గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
