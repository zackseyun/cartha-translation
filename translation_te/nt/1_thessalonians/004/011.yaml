id: 1TH.4.11
reference: 1 Thessalonians 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ φιλοτιμεῖσθαι ἡσυχάζειν καὶ πράσσειν τὰ ἴδια καὶ ἐργάζεσθαι ⸀ταῖς χερσὶν ὑμῶν, καθὼς ὑμῖν παρηγγείλαμεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/011.yaml
  text: and to aspire to live quietly[a], to mind your own affairs, and to work with your own hands, just as we commanded you[b],
translation:
  language: te
  text: మేము మీకు ఆజ్ఞాపించినట్లే, ప్రశాంతంగా జీవించడాన్ని మీ ఆశయంగా చేసుకోవాలని, మీ సొంత వ్యవహారాలను చూసుకోవాలని, మీ చేతులతో పని చేయాలని శ్రద్ధగా ప్రయత్నించండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλοτιμεῖσθαι
  choice: మీ ఆశయంగా పెట్టుకోవాలని
  rationale: ఈ క్రియలో ఒక విషయాన్ని గౌరవప్రదమైన లక్ష్యంగా భావించి దానికోసం శ్రద్ధగా ప్రయత్నించడం అనే భావం ఉంది. ‘ఆశయంగా పెట్టుకోవడం’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἡσυχάζειν
  choice: ప్రశాంతంగా జీవించడాన్ని
  rationale: ఇక్కడ భావం కేవలం మాట్లాడకుండా ఉండడం కాదు; కలతలేని, కుదురైన జీవన విధానాన్ని అనుసరించడం. అందువల్ల ‘ప్రశాంతంగా జీవించడం’ సందర్భానికి తగినది.
- source_word: πράσσειν τὰ ἴδια
  choice: మీ సొంత వ్యవహారాలు చూసుకోవాలని
  rationale: ఈ గ్రీకు ప్రయోగం ఇతరుల విషయాల్లో జోక్యం చేసుకోకుండా తమకు సంబంధించిన విషయాలపై శ్రద్ధ పెట్టడాన్ని సూచిస్తుంది. ‘వ్యవహారాలు చూసుకోవడం’ తెలుగులో సహజంగా ఉండి, అనవసరమైన కఠిన స్వరాన్ని నివారిస్తుంది.
- source_word: ἐργάζεσθαι
  choice: పని చేసుకోవాలని
  rationale: క్రియకు సాధారణంగా పని చేయడం లేదా శ్రమించడం అనే విస్తృత భావం ఉంది. ‘పని చేసుకోవడం’ ఇక్కడ స్వయంగా పనిచేసి జీవించాలనే సందర్భానికి సరిపోతుంది.
- source_word: ταῖς χερσὶν ὑμῶν
  choice: మీ చేతులతోనే
  rationale: దత్తి విభక్తి సాధనార్థకంగా ఉంది. ‘చేతులతోనే’ అనేది స్వయంగా శారీరకంగా పనిచేయడంపై ఉన్న నొక్కును సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: καθὼς
  choice: అలాగే / ఆజ్ఞాపించినట్లే
  rationale: ఇది పౌలు ఇంతకుముందు ఇచ్చిన ఉపదేశంతో పోలికను చూపుతుంది. వాక్య నిర్మాణంలో ‘ఆజ్ఞాపించినట్లే’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: παρηγγείλαμεν
  choice: మేము మీకు ఆజ్ఞాపించినట్లే
  rationale: παραγγέλλω అధికారంతో ఇచ్చిన నిర్దేశాన్ని సూచించగలదు. ‘ఆజ్ఞాపించాము’ ఆ బలాన్ని అతిశయింపకుండా నిలుపుతుంది.
theological_decisions:
- issue: అపొస్తలుని నైతిక ఉపదేశంలోని అధికార స్వరం
  choice: ‘ఆజ్ఞాపించినట్లే’ అని అనువదించబడింది.
  alternative: ‘ఉపదేశించినట్లే’ లేదా ‘నిర్దేశించినట్లే’
  rationale: గ్రీకు క్రియ సాధారణ సలహా కంటే అధికారపూర్వకమైన ఆదేశాన్ని తెలియజేస్తుంది. అందువల్ల పౌలు ఇచ్చిన నైతిక బోధలోని బలాన్ని నిలుపుతూ ‘ఆజ్ఞాపించినట్లే’ ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఉపదేశ శైలి ఉపయోగించబడింది. గ్రీకు మూలంలోని అనుబంధ క్రియారూపాలను తెలుగు వాక్య ప్రవాహానికి అనుగుణంగా ‘కోరుకోండి’తో పూర్తి చేశాం; ఇది ముందున్న సందర్భంలోని ప్రోత్సాహక స్వరాన్ని ప్రతిబింబిస్తుంది.
