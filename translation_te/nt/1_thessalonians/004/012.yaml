id: 1TH.4.12
reference: 1 Thessalonians 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα περιπατῆτε εὐσχημόνως πρὸς τοὺς ἔξω καὶ μηδενὸς χρείαν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/004/012.yaml
  text: so that you may walk properly before outsiders and have need of nothing[a].
translation:
  language: te
  text: మీరు సంఘానికి వెలుపలివారి పట్ల తగిన విధంగా నడుచుకోవడానికి, మీకు ఏ కొరతా లేకుండా ఉండడానికి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు ఎవరి మీదా ఆధారపడకుండా ఉండడానికి.” ఈ మాటలు ఇతరులపై ఆధారపడి జీవించకపోవడాన్ని నొక్కిచెప్పవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: చేయడానికి
  rationale: ముందటి వచనంలోని ఉపదేశాల ఉద్దేశాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: περιπατῆτε
  choice: నడుచుకోవడానికి
  rationale: జీవన ప్రవర్తనను సూచించే పౌలు వాడిన ‘నడచుట’ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: εὐσχημόνως
  choice: మర్యాదగా
  rationale: ఇతరుల దృష్టిలో తగిన, గౌరవప్రదమైన ప్రవర్తన అనే సామాజిక భావాన్ని తెలియజేస్తుంది; అతిగా నైతికీకరించదు.
- source_word: πρὸς τοὺς ἔξω
  choice: సంఘానికి వెలుపల ఉన్నవారి ఎదుట
  rationale: క్రైస్తవ సమాజానికి వెలుపలివారితో సంబంధంలో కనిపించే బహిరంగ ప్రవర్తనను స్పష్టంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
- source_word: μηδενὸς χρείαν ἔχητε
  choice: మీకు ఏ లోటూ లేకుండా ఉండడానికి
  rationale: ‘దేనికీ అవసరం లేకపోవడం’ అనే ప్రధాన వ్యాకరణ భావాన్ని సహజ తెలుగులో అందిస్తూ, సంపూర్ణ స్వయంసమృద్ధి అనే కఠిన భావాన్ని రుద్దకుండా అవసరమైన వాటిలో లోటు లేకపోవడాన్ని సూచిస్తుంది.
theological_decisions:
- issue: μηδενὸς χρείαν ἔχητε అనే ముగింపు భాగం యొక్క అర్థం
  choice: ‘మీకు ఏ లోటూ లేకుండా ఉండడానికి’—అవసరమైన వాటిలో కొరత లేకపోవడం
  alternative: ‘మీరు ఎవరి మీదా ఆధారపడకుండా ఉండడానికి’—ఇతరులపై ఆధారపడకపోవడం
  rationale: μηδενός నపుంసకార్థంలో ‘ఏదీ/దేనికీ’ అని అర్థమవడం వ్యాకరణపరంగా సహజం. అయితే చేతులతో పనిచేయాలనే సందర్భం ఇతరులపై అనవసరంగా ఆధారపడకపోవడాన్ని కూడా సూచించవచ్చు. అందువల్ల ప్రధాన పాఠంలో విస్తృత భావాన్ని ఉంచి, వ్యక్తులపై ఆధారపడకపోవడం అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘నడుచుకోవడం’ అనే మూల రూపకాన్ని నిలిపి, ‘వెలుపల ఉన్నవారు’ ఎవరనే విషయాన్ని ‘సంఘానికి’ అనే సందర్భస్పష్టీకరణతో తెలిపాం.
