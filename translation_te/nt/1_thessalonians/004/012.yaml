review_pass:
  verdict: revise
  source_fidelity: The purpose conjunction and both coordinated purposes are retained. ‘సంఘానికి వెలుపలివారి’ appropriately conveys τοὺς ἔξω in this early Christian context, while the main rendering of μηδενὸς χρείαν ἔχητε preserves the broad sense of lacking nothing; the footnote retains the contextually plausible personal-dependence sense.
  naturalness: The draft is generally clear modern Telugu. Replacing ‘మర్యాదగా’ with ‘తగిన విధంగా’ avoids reducing εὐσχημόνως to mere politeness and better conveys fitting, respectable public conduct. ‘సంఘానికి వెలుపల ఉన్నవారి’ is streamlined to the more natural ‘సంఘానికి వెలుపలివారి.’
  terminology: ‘సంఘం’ is suitable for the Christian community in context without supplying a denominational label. ‘తగిన విధంగా నడుచుకోవడం’ is an idiomatic Telugu rendering of the conduct metaphor and its social-respectability nuance.
  issues:
  - severity: medium
    issue: ‘మర్యాదగా’ is too narrow for εὐσχημόνως.
    rationale: It can primarily mean politely or courteously, whereas the Greek denotes conduct that is fitting, proper, and respectable in the eyes of those outside.
  - severity: low
    issue: ‘సంఘానికి వెలుపల ఉన్నవారి’ is slightly cumbersome.
    rationale: ‘సంఘానికి వెలుపలివారి’ expresses the same contextual referent more naturally in modern standard Telugu.
  revised_text: మీరు సంఘానికి వెలుపలివారి పట్ల తగిన విధంగా నడుచుకోవడానికి, మీకు ఏ కొరతా లేకుండా ఉండడానికి[a].
  revised_footnotes:
