revisions:
- from: మీరు సంఘానికి వెలుపల ఉన్నవారి ఎదుట మర్యాదగా నడుచుకోవడానికి, మీకు ఏ లోటూ లేకుండా ఉండడానికి[a].
  to: మీరు సంఘానికి వెలుపలివారి పట్ల తగిన విధంగా నడుచుకోవడానికి, మీకు ఏ కొరతా లేకుండా ఉండడానికి[a].
  rationale: The revision strengthens the rendering of εὐσχημόνως from mere courtesy to fitting/respectable conduct, improves Telugu flow, and preserves both the broad primary sense of the final clause and its contextually supported alternative in the footnote.
