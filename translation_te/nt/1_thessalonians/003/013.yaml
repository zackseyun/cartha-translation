    text: లేదా, ‘తన పరిశుద్ధులందరితో.’ ఇక్కడి గ్రీకు పదం పవిత్ర ప్రజలను, దేవదూతలను, లేదా ఇద్దరినీ సూచించవచ్చు.
    reason: alternative_reading
