revisions:
- from: మన ప్రభువైన యేసు తన పవిత్రులందరితో[a] వచ్చినప్పుడు, మన దేవుడూ తండ్రీ అయిన ఆయన ఎదుట పవిత్రతలో నిందలేనివిగా మీ హృదయాలను ఆయన స్థిరపరచేలా.
  to: మన ప్రభువైన యేసు తన పవిత్రులందరితో[a] వచ్చునప్పుడు, మన దేవుడైన తండ్రి ఎదుట పవిత్రతలో నిందలేనివిగా మీ హృదయాలను స్థిరపరచునట్లు.
  rationale: The revision removes a misleading added pronoun while preserving the purposive, cross-verse construction of εἰς τὸ στηρίξαι. It also replaces an awkward expression for ‘our God and Father’ with idiomatic modern standard Telugu. No interpretation is imposed on ‘his holy ones,’ and the footnote retains both the traditional alternative and the source ambiguity.
