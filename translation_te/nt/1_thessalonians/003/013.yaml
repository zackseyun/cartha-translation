id: 1TH.3.13
reference: 1 Thessalonians 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς τὸ στηρίξαι ὑμῶν τὰς καρδίας ἀμέμπτους ἐν ἁγιωσύνῃ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν ⸀Ἰησοῦ μετὰ πάντων τῶν ἁγίων ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/013.yaml
  text: so that he may establish your hearts blameless in holiness before our God and Father at the coming of our Lord Jesus with all his holy ones[a].
translation:
  language: te
  text: మన ప్రభువైన యేసు తన పవిత్రులందరితో[a] వచ్చునప్పుడు, మన దేవుడైన తండ్రి ఎదుట పవిత్రతలో నిందలేనివిగా మీ హృదయాలను స్థిరపరచునట్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన పరిశుద్ధులందరితో.’ ఇక్కడి గ్రీకు పదం పవిత్ర ప్రజలను, దేవదూతలను, లేదా ఇద్దరినీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ στηρίξαι
  choice: స్థిరపరచేలా
  rationale: ముందటి వచనం నుంచి కొనసాగే ఉద్దేశం లేదా ఫలితాన్ని తెలిపే ఆర్టిక్యులర్ ఇన్ఫినిటివ్ నిర్మాణాన్ని సహజమైన తెలుగు ప్రయోజనార్థక రూపంలో అందిస్తుంది.
- source_word: στηρίξαι
  choice: స్థిరపరచేలా
  rationale: బలపరచడం, దృఢంగా నిలిపివేయడం అనే భావాలను వ్యక్తం చేస్తుంది; హృదయాలు అనే కర్మతో సహజంగా సరిపోతుంది.
- source_word: καρδίας
  choice: హృదయాలను
  rationale: పౌలు వాడుకలో భావోద్వేగాలు మాత్రమే కాక అంతరంగ వ్యక్తిత్వాన్ని సూచించే మూలరూపకాన్ని నిలుపుతుంది.
- source_word: ἀμέμπτους
  choice: నిందలేనివిగా
  rationale: సముచితమైన నిందకు తావులేని స్థితిని స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν ἁγιωσύνῃ
  choice: పవిత్రతలో
  rationale: పవిత్రంగా ఉండే స్థితి లేదా గుణాన్ని నేరుగా, మతపరమైన అదనపు సాంకేతిక భావాలు లేకుండా అందిస్తుంది.
- source_word: ἔμπροσθεν
  choice: ఎదుట
  rationale: దేవుని సన్నిధిలో లేదా దృష్టిలో నిలవడాన్ని సంక్షిప్తంగా సూచిస్తుంది.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: మన దేవుడూ తండ్రీ అయిన ఆయన
  rationale: ఒకే వ్యక్తిని ‘దేవుడు’ మరియు ‘తండ్రి’గా పేర్కొనే గ్రీకు సమన్వయ నిర్మాణాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: παρουσίᾳ
  choice: వచ్చినప్పుడు
  rationale: ఈ అంత్యకాల సందర్భంలో ప్రభువు భవిష్యదాగమనాన్ని సూచిస్తుంది; ‘సన్నిధి’ అనే సాధ్యమైన మూలార్థం కంటే సందర్భానుకూలంగా స్పష్టంగా ఉంటుంది.
- source_word: κυρίου ἡμῶν Ἰησοῦ
  choice: మన ప్రభువైన యేసు
  rationale: క్రీస్తు సంబంధమైన బిరుదును, వ్యక్తినామాన్ని ప్రామాణిక ఆధునిక తెలుగు రూపంలో నిలుపుతుంది.
- source_word: μετὰ πάντων τῶν ἁγίων αὐτοῦ
  choice: తన పవిత్రులందరితో
  rationale: ἅγιοι ఎవరిని సూచిస్తుందో—పవిత్ర ప్రజలనో, దేవదూతలనో, ఇద్దరినో—ప్రధాన పాఠంలో ఖచ్చితంగా నిర్ధారించకుండా విస్తృతతను నిలుపుతుంది.
theological_decisions:
- issue: ‘తన పవిత్రులందరు’ అనే మాట ఎవరిని సూచిస్తుంది?
  choice: ‘తన పవిత్రులందరితో’ అని విస్తృతంగానే ఉంచడం
  alternative: ‘తన పరిశుద్ధులతో’ లేదా ‘తన దేవదూతలందరితో’
  rationale: ఈ అంత్యకాల సందర్భంలో గ్రీకు ἁγίων పవిత్ర ప్రజలను, దేవదూతలను, లేదా ఇద్దరినీ సూచించగలదు. వచనం స్వయంగా పరిష్కరించని విషయాన్ని అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వాక్యం ముందటి వచనం నుంచి వ్యాకరణపరంగా కొనసాగుతున్నందున చివర ఉద్దేశార్థక ‘స్థిరపరచేలా’ రూపం ఉంచబడింది. ‘పవిత్రులు’ అనే రూపం ఉద్దేశపూర్వకంగా విస్తృతంగా ఉంది; పాదటిప్పణి ప్రత్యామ్నాయ సంప్రదాయ పదాన్ని, సూచ్యార్థంలోని సందిగ్ధతను తెలియజేస్తుంది.
