id: 1TH.3.2
reference: 1 Thessalonians 3:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐπέμψαμεν Τιμόθεον, τὸν ἀδελφὸν ἡμῶν καὶ ⸀συνεργὸν τοῦ ⸀θεοῦ ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ, εἰς τὸ στηρίξαι ὑμᾶς καὶ παρακαλέσαι ⸀ὑπὲρ τῆς πίστεως ὑμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/002.yaml
  text: and we sent Timothy[a], our brother and God's fellow worker in the gospel of the Messiah, to strengthen you and to encourage you concerning your faith[b],
translation:
  language: te
  text: మేము మా సహోదరుడైన, మెస్సీయ[b] సువార్తలో దేవుని సహకార్యకర్త[a] అయిన తిమోతిని మిమ్మల్ని స్థిరపరచడానికి, మీ విశ్వాసం విషయంలో మిమ్మల్ని ప్రోత్సహించడానికి పంపించాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేవునితో కలిసి పనిచేసేవాడు’ అని కూడా అర్థం చేసుకోవచ్చు. కొన్ని ప్రాచీన ప్రతుల్లో ఇక్కడ ‘దేవుని సేవకుడు’ వంటి భిన్న పాఠాలు ఉన్నాయి.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో ‘క్రీస్తు’; ఇక్కడ అది బిరుదు భావంలో ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέμψαμεν
  choice: పంపించాము
  rationale: గ్రీకు భూతకాల కథన క్రియను సహజమైన ఆధునిక తెలుగు సాధారణ భూతకాలంతో వ్యక్తం చేస్తుంది.
- source_word: Τιμόθεον
  choice: తిమోతి
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపాన్ని అనుసరిస్తుంది; విభక్తి కారణంగా ప్రధాన వాక్యంలో ‘తిమోతిని’ అని ఉంది.
- source_word: ἀδελφὸν ἡμῶν
  choice: మన సహోదరుడు
  rationale: విశ్వాసుల మధ్య కుటుంబ సంబంధ రూపకాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది.
- source_word: συνεργὸν τοῦ θεοῦ
  choice: దేవుని సహకార్యకర్త
  rationale: ‘దేవుని సేవకుడు’ అని బలహీనపరచకుండా συνεργός లోని కలిసి పనిచేసే వ్యక్తి అనే బలమైన భావాన్ని నిలుపుతుంది; గ్రీకు షష్ఠీ సంబంధంలోని ఉద్రిక్తతను పూర్తిగా పరిష్కరించదు.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ
  choice: మెస్సీయ సువార్తలో
  rationale: ἐν సూచించే కార్యక్షేత్రాన్ని ‘లో’తో, షష్ఠీ సంబంధాన్ని విప్పి చెప్పకుండా సంక్షిప్తంగా నిలుపుతుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తున్నందున దాని యూద నేపథ్యార్థాన్ని స్పష్టంగా తెలిపే ‘మెస్సీయ’ను వాడింది.
- source_word: εἰς τὸ στηρίξαι ὑμᾶς
  choice: మీ విశ్వాసంలో మిమ్మల్ని స్థిరపరచడానికి
  rationale: ఉద్దేశాన్ని తెలిపే εἰς τό + infinitive నిర్మాణాన్ని తెలుగులో సహజమైన ‘-డానికి’ రూపంతో వ్యక్తం చేస్తుంది; సందర్భం దృష్ట్యా స్థిరపరచడం విశ్వాసంలోనిదని స్పష్టం చేస్తుంది.
- source_word: παρακαλέσαι
  choice: ప్రోత్సహించడానికి
  rationale: ఒత్తిడి మధ్య ఉన్నవారికి బలాన్నిచ్చే pastoral భావాన్ని అందిస్తుంది; కేవలం ఓదార్పు లేదా గద్దింపు అనే ఒకే భావానికి పరిమితం చేయదు.
- source_word: ὑπὲρ τῆς πίστεως ὑμῶν
  choice: మీ విశ్వాసం విషయంలో
  rationale: ὑπέρ కు ఇక్కడ సాధ్యమైన ‘సంబంధించి’ అనే భావాన్ని సహజ తెలుగులో ఇస్తుంది; ‘విశ్వాసం కోసం’ అనే ప్రయోజనార్థాన్ని బలవంతంగా నిర్ణయించదు.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో నమ్మకం మరియు దానిలో నిలకడ అనే భావాలకు సరిపోయే సాధారణ తెలుగు బైబిలు పదం.
theological_decisions:
- issue: συνεργὸν τοῦ θεοῦ అనువాదం
  choice: దేవుని సహకార్యకర్త
  alternative: దేవునితో కలిసి పనిచేసేవాడు; దేవుని సేవకుడు
  rationale: SBLGNT లోని బలమైన ‘దేవుని సహకార్యకర్త’ అనే పాఠాన్ని theological అసౌకర్యం కారణంగా ‘సేవకుడు’గా మార్చలేదు. అదే సమయంలో ‘దేవునితో’ అని విప్పి చెప్పి షష్ఠీ సంబంధాన్ని అతిగా నిర్ణయించలేదు; పాఠభేదాలను పాదసూచికలో ఉంచింది.
- issue: εὐαγγελίῳ τοῦ Χριστοῦ లో Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ పదానికి బిరుదు భావం స్పష్టంగా ఉన్నందున ‘మెస్సీయ’ను ప్రధాన పాఠంలో ఉంచి, సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వాక్య నిర్మాణం వాడబడింది. ‘సహకార్యకర్త’ కొద్దిగా సాంప్రదాయికమైనప్పటికీ, మూలంలోని బలమైన συνεργός భావాన్ని ‘సేవకుడు’గా తగ్గించకుండా సాధారణ పాఠకునికి అర్థమయ్యే ఉత్తమ రూపం. [a] ను సంబంధిత పదబంధం దగ్గర ఉంచగా, అందించిన పాదసూచిక క్రమాన్ని నిలుపుటకు [b] వాక్యాంతంలో ఉంచబడింది.
