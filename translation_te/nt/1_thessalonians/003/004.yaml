id: 1TH.3.4
reference: 1 Thessalonians 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γὰρ ὅτε πρὸς ὑμᾶς ἦμεν, προελέγομεν ὑμῖν ὅτι μέλλομεν θλίβεσθαι, καθὼς καὶ ἐγένετο καὶ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/004.yaml
  text: For even when we were with you[a], we kept telling you beforehand that we were going to suffer affliction, just as it also happened, and you know it.
translation:
  language: te
  text: నిజానికి, మేము మీతో ఉన్నప్పుడు, మేము శ్రమలు అనుభవించబోతున్నామని[a] మీకు ముందుగానే పదేపదే చెప్పాము. మేము చెప్పినట్లే అలాగే జరిగింది; అది మీకూ తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘బాధింపబడబోతున్నామని,’ ‘బాధలు అనుభవించబోతున్నామని.’ గ్రీకు క్రియ ఒత్తిడి, వేదన, కష్టం లేదా హింసను అనుభవించడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందున్న వాక్యానికి వివరణాత్మక కారణాన్ని కలుపుతుంది. καί ఇచ్చే స్వల్ప ఉద్ఘాటన తరువాతి ‘ఉన్నప్పుడే’లో సహజంగా ప్రతిఫలిస్తుంది.
- source_word: ὅτε πρὸς ὑμᾶς ἦμεν
  choice: మేము మీతో ఉన్నప్పుడే
  rationale: πρὸς ὑμᾶς ఇక్కడ వారి సమక్షంలో, వారితో ఉండడాన్ని సూచిస్తుంది. ‘ఉన్నప్పుడే’ సందర్భంలోని ఉద్ఘాటనను సహజ తెలుగులో నిలుపుతుంది.
- source_word: προελέγομεν
  choice: ముందుగానే పదేపదే చెప్పాము
  rationale: προ- ముందుగా చెప్పడాన్ని సూచిస్తుంది; అసంపూర్ణ భూతకాల రూపం ఆ మాటను ఒకసారి మాత్రమే కాక కొనసాగిస్తూ లేదా పదేపదే చెప్పిన భావాన్ని ఇస్తుంది.
- source_word: μέλλομεν θλίβεσθαι
  choice: బాధలు అనుభవించబోతున్నామని
  rationale: μέλλομεν సమీపిస్తున్న లేదా ఎదురుచూస్తున్న అనుభవాన్ని సూచిస్తుంది. θλίβεσθαι ఒత్తిడి, కష్టం, బాధ లేదా హింసను అనుభవించే విస్తృత భావం కలిగి ఉంది; ‘బాధలు అనుభవించడం’ దానిని హింసకు మాత్రమే పరిమితం చేయదు.
- source_word: καθὼς καὶ ἐγένετο
  choice: మేము చెప్పినట్లే అది జరిగింది
  rationale: καθώς ముందుగా చెప్పినదానికి, తరువాత నిజంగా జరిగినదానికి మధ్య సరిపోలికను తెలియజేస్తుంది. తెలుగు వాక్యంలో ‘మేము చెప్పినట్లే’ ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ οἴδατε
  choice: అది మీకు తెలుసు
  rationale: గ్రీకులో కర్మ ప్రత్యక్షంగా లేకపోయినా, తెలిసిన విషయం ఇప్పుడే ప్రస్తావించిన సంఘటన. తెలుగులో ‘అది’ చేర్చడం సహజంగా ఉంటుంది.
theological_decisions:
- issue: θλίβεσθαι సూచించే బాధ స్వభావం
  choice: హింసను కూడా కలిగి ఉండగల సాధారణ బాధలు లేదా కష్టాలు
  alternative: ప్రత్యేకంగా హింస; లేదా సాంకేతిక అంత్యకాల ‘మహాశ్రమ’ భావం
  rationale: సందర్భంలో వ్యతిరేకత, హింస ఉండవచ్చు; అయితే గ్రీకు పదం వాటికే పరిమితం కాదు. అందువల్ల మూలంలోని విస్తృతతను నిలిపి, ఒక నిర్దిష్ట సిద్ధాంతార్థానికి కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి వాడబడింది. ‘పదేపదే’ ద్వారా గ్రీకు అసంపూర్ణ భూతకాలంలోని కొనసాగింపు భావం వ్యక్తమైంది; బాధ స్వభావాన్ని అనవసరంగా సంకుచితం చేయలేదు.
