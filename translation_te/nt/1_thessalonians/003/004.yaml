  to: నిజానికి, మేము మీతో ఉన్నప్పుడు, మేము శ్రమలు అనుభవించబోతున్నామని[a] మీకు ముందుగానే పదేపదే చెప్పాము. మేము చెప్పినట్లే అలాగే జరిగింది; అది మీకూ తెలుసు.
