lexical_decisions:
- source_word: Διὸ
  choice: అందువల్ల
  rationale: ముందటి సందర్భం నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μηκέτι στέγοντες
  choice: ఇక సహించలేక
  rationale: στέγω ఇక్కడ థెస్సలొనీకయుల గురించిన ఆందోళనను మరింత కాలం భరించలేని భావోద్వేగ స్థితిని సూచిస్తుంది; μηκέτιతో కలిసి ఈ ప్రయోగం సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: εὐδοκήσαμεν
  choice: మంచిదని నిర్ణయించుకున్నాము
  rationale: ఈ క్రియలో సమ్మతి, సుముఖత, అనుకూల నిర్ణయం అనే భావాలు ఉన్నాయి. కేవలం ఆనందాన్ని సూచించకుండా, సందర్భానుసారమైన సానుకూల నిర్ణయాన్ని ఈ అనువాదం తెలియజేస్తుంది.
- source_word: καταλειφθῆναι
  choice: ఉండిపోవడం
  rationale: గ్రీకులో ఇది నిష్క్రియార్థక infinitive అయినప్పటికీ, తెలుగులో ‘విడిచిపెట్టబడడం’ అసహజంగా ఉండగలదు. ‘ఉండిపోవడం’ ఏథెన్సులో వెనుక మిగిలిన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యక్ష నిష్క్రియార్థ రూపం పాదసూచికలో ఇవ్వబడింది.
- source_word: ἐν Ἀθήναις
  choice: ఏథెన్సులో
  rationale: స్థలాన్ని సూచించే సహజమైన తెలుగు రూపం.
- source_word: μόνοι
  choice: మేము మాత్రమే
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, ఇతర సహచరులు లేకుండా మిగిలిన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మొదటి పురుష బహువచనం ఎవరిని సూచిస్తుందనే ప్రశ్న
  choice: ‘మేము’ అనే గ్రీకు బహువచనాన్ని యథాతథంగా నిలుపుకున్నాము.
  alternative: దీనిని పత్రికా బహువచనంగా భావించి ‘నేను’ అని అనువదించడం.
  rationale: εὐδοκήσαμεν, μόνοι రెండూ బహువచన రూపాలు. ఇది పౌలును మాత్రమే సూచిస్తుందా లేక సేవకుల బృందాన్ని సూచిస్తుందా అనే చారిత్రక ప్రశ్నను అనువాదం నిర్ణయించకుండా, మూలపాఠంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు బహువచనాన్ని నిలుపుతూ, నిష్క్రియార్థక infinitive‌ను ప్రధాన వాక్యంలో సహజమైన తెలుగు ప్రయోగంతో అందించి, మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఇచ్చాము.
