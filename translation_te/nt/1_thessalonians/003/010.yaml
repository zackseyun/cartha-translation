translation:
  language: te
  text: మీ ముఖం చూడటానికి, మీ విశ్వాసంలో కొరవడినదాన్ని పూరించడానికి మేము రాత్రింబగళ్లు ఎంతో మనఃపూర్వకంగా ప్రార్థిస్తున్నాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ విశ్వాసంలో లోటుగా ఉన్నదాన్ని సంపూర్ణం చేయడానికి.” గ్రీకు పదబంధం వారి విశ్వాసంలో ఇంకా బలపరచవలసిన లేదా సంపూర్ణం చేయవలసిన దానిని విస్తృతంగా కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυκτὸς καὶ ἡμέρας
  choice: రాత్రింబగళ్లు
  rationale: కాలాన్ని సూచించే క్రియావిశేషణ ప్రయోగాన్ని సహజమైన ఆధునిక తెలుగు నుడికారంతో తెలియజేస్తుంది; నిరంతరంగా లేదా పదేపదే చేసే ప్రార్థన భావాన్ని నిలుపుతుంది.
- source_word: ὑπερεκπερισσοῦ
  choice: అత్యంత ఆసక్తితో
  rationale: ఈ బలమైన క్రియావిశేషణంలోని మిక్కిలి తీవ్రతను సహజంగా తెలియజేస్తూ, ప్రార్థన చేసే విధానాన్ని విశేషిస్తుంది.
- source_word: δεόμενοι
  choice: ప్రార్థిస్తున్నాం
  rationale: మూలంలోని వర్తమాన కృదంతం తీవ్రమైన విన్నపాన్ని సూచిస్తుంది. తెలుగు వాక్యంలో సహజంగా ఉండేందుకు ప్రధాన క్రియగా ఇచ్చాం; తీవ్రతను ముందున్న క్రియావిశేషణం వ్యక్తం చేస్తుంది.
- source_word: εἰς τὸ ἰδεῖν
  choice: చూడాలని
  rationale: ఉద్దేశాన్ని తెలిపే ఆర్టిక్యులర్ ఇన్ఫినిటివ్‌ను తెలుగు కోరికార్థక నిర్మాణంతో సహజంగా అందిస్తుంది.
- source_word: ὑμῶν τὸ πρόσωπον
  choice: మీ ముఖం
  rationale: అక్షరార్థంలోని స్పష్టమైన రూపకాన్ని నిలుపుతుంది; సందర్భంలో ప్రత్యక్షంగా కలుసుకోవడం అనే సంబంధపూర్వక భావం సహజంగా గ్రహించబడుతుంది.
- source_word: καταρτίσαι
  choice: సరిచేయాలని
  rationale: ఈ క్రియలోని క్రమపరచడం, పూరించడం, సంపూర్ణం చేయడం వంటి విస్తృత భావాన్ని ‘లోటుగా ఉన్నవాటిని’ అనే కర్మతో కలిపి సహజంగా తెలియజేస్తుంది; కేవలం సరఫరా చేయడం అనే సన్నని భావానికి పరిమితం చేయదు.
- source_word: τὰ ὑστερήματα
  choice: లోటుగా ఉన్నవాటిని
  rationale: బహువచన రూపాన్ని నిలుపుతూ, ఇంకా కొరవడిన లేదా బలపరచవలసిన అంశాలు ఉన్నాయని తెలుపుతుంది; విశ్వాసమే లేదని సూచించదు.
- source_word: τῆς πίστεως ὑμῶν
  choice: మీ విశ్వాసంలో
  rationale: సందర్భంలో థెస్సలొనీకయుల నమ్మకం లేదా విశ్వాసం ఇంకా బలపడవలసిన అంశాలను సూచిస్తుంది. తెలుగు విభక్తి సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πίστις పదానికి అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఇక్కడ ప్రధానంగా దేవునిపై వారి విశ్వాసం లేదా నమ్మకం బలపడవలసినదిగా ఉద్దేశించబడింది. ‘విశ్వసనీయత’ అనే అర్థసాధ్యత ఉన్నప్పటికీ ఈ సందర్భంలో అది ప్రధాన భావం కాదు.
- issue: καταρτίσαι మరియు τὰ ὑστερήματα మధ్య సంబంధం
  choice: లోటుగా ఉన్నవాటిని సరిచేయడం
  alternative: కొరవడినదాన్ని పూరించడం; ఇంకా బలపడవలసినదాన్ని సంపూర్ణం చేయడం
  rationale: మూలపదాలు కేవలం ఏదో వస్తువును జోడించడం కన్నా పునరుద్ధరణ, సిద్ధపరచడం, సంపూర్ణతవైపు తీసుకెళ్లడం వంటి విస్తృత భావాన్ని అనుమతిస్తాయి. ప్రధాన పాఠ్యం ఆ పరిధిని పూర్తిగా మూసివేయకుండా ఉంచుతుంది; పాదసూచిక ప్రత్యామ్నాయ నుడికారాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మీ ముఖం’ అనే మూలంలోని స్పష్టమైన వ్యక్తీకరణను నిలిపి, ‘రాత్రింబగళ్లు’ అనే సహజ తెలుగు నుడికారాన్ని వాడాం. వాక్యం ముందరి సందర్భంలోని బహువచన కర్తను అనుసరించి ‘ప్రార్థిస్తున్నాం’ అని ముగుస్తుంది.
