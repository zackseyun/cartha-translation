revisions:
- from: మీ ముఖం చూడాలని, మీ విశ్వాసంలో లోటుగా ఉన్నవాటిని సరిచేయాలని రాత్రింబగళ్లు అత్యంత ఆసక్తితో ప్రార్థిస్తున్నాం.[a]
  to: మీ ముఖం చూడటానికి, మీ విశ్వాసంలో కొరవడినదాన్ని పూరించడానికి మేము రాత్రింబగళ్లు ఎంతో మనఃపూర్వకంగా ప్రార్థిస్తున్నాం.[a]
  rationale: The revision replaces ‘ఆసక్తితో’ with an expression of earnest prayer and renders the deficient elements as something to be supplied or completed, in line with the Greek verb and noun. It retains the source’s purpose construction, plural first-person context, and the established rendering ‘విశ్వాసం.’
