id: 1TH.3.12
reference: 1 Thessalonians 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμᾶς δὲ ὁ κύριος πλεονάσαι καὶ περισσεύσαι τῇ ἀγάπῃ εἰς ἀλλήλους καὶ εἰς πάντας, καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/012.yaml
  text: And may the Lord cause you to increase and abound in love for one another and for all[a], just as we also do for you[b],
translation:
  language: te
  text: మీరు ఒకరి పట్ల ఒకరు, అందరి పట్ల ప్రేమలో మరింత వృద్ధి చెంది సమృద్ధిగా ఉండేలా ప్రభువు చేయుగాక[a]—మేము కూడా మీ పట్ల ప్రేమ చూపిస్తున్నట్లే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకరి వైపు ఒకరు, అందరి వైపు ప్రేమలో.”
    reason: εἰς అనే పదంలోని దిశార్థాన్ని మరింత అక్షరార్థంగా చూపే ప్రత్యామ్నాయం.
  - marker: b
    text: గ్రీకులో చివరి భాగం అక్షరార్థంగా, “మేము కూడా మీ పట్ల” అని క్రియ లేకుండా సంక్షిప్తంగా ఉంది. “ప్రేమ చూపిస్తున్నట్లే” అనే భావం ముందటి వాక్యభాగంలోని ప్రేమను బట్టి పూరించబడింది.
    reason: మూలపాఠంలోని ellipsis‌ను పాఠకునికి తెలియజేయడం.
lexical_decisions:
- source_word: ὁ κύριος
  choice: ప్రభువు
  rationale: ప్రార్థనాత్మక ఆశీర్వచన సందర్భంలో κύριος అనే దైవిక/క్రీస్తుసంబంధ బిరుదును మరింత నిర్దిష్టం చేయకుండా సహజమైన తెలుగు బిరుదుతో నిలుపుతుంది.
- source_word: πλεονάσαι
  choice: అంతకంతకు వృద్ధి చెంది ... ఉండేలా చేయుగాక
  rationale: కర్తగా ప్రభువును, కర్మగా ‘మీరు’ను ఉంచే కారణార్థక భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ఆశను సూచించే గ్రీకు optative భావాన్ని ‘చేయుగాక’ నిలుపుతుంది.
- source_word: περισσεύσαι
  choice: సమృద్ధిగా ఉండేలా
  rationale: πλεονάσαιతో ఉన్న భావతీవ్రతను నిలుపుతూ, ప్రేమ విస్తారంగా పెరగడాన్ని తెలియజేస్తుంది; రెండు క్రియల భేదాన్ని పూర్తిగా కలిపివేయదు.
- source_word: τῇ ἀγάπῃ
  choice: ప్రేమలో
  rationale: వృద్ధి సంభవించే రంగం లేదా విషయంలోని దత్తివును నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς ἀλλήλους
  choice: ఒకరి పట్ల ఒకరు
  rationale: పరస్పర ప్రేమ దిశను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: καὶ εἰς πάντας
  choice: అందరి పట్ల
  rationale: πάντας పరిధిని ‘మనుషులందరూ’ లేదా ‘విశ్వాసులందరూ’ అని సంకుచితం చేయకుండా విస్తృతంగానే ఉంచుతుంది.
- source_word: καθάπερ καὶ ἡμεῖς εἰς ὑμᾶς
  choice: మేము కూడా మీ పట్ల ఉన్నట్లే
  rationale: గ్రీకులో క్రియ లేకుండా ఉన్న సంక్షిప్త ఉపవాక్యాన్ని సాధ్యమైనంతవరకు అలాగే నిలుపుతుంది; ముందు వచ్చిన ప్రేమ/సమృద్ధి భావం సందర్భం ద్వారా పూరించబడుతుంది.
- source_word: δὲ
  choice: —
  rationale: ఈ ఒక్క వచనంలో δέ సూచించే మృదువైన కొనసాగింపును బలమైన విరోధార్థక పదంతో చూపకుండా, తెలుగు వాక్యప్రవాహంలో సహజంగా ఉంచింది.
theological_decisions:
- issue: ‘ప్రభువు’ అనే బిరుదు ఎవరిని సూచిస్తుంది
  choice: అనువాదంలో ‘ప్రభువు’ అని మాత్రమే ఉంచడం
  alternative: ప్రత్యేకంగా క్రీస్తును లేదా సాధారణంగా దేవుణ్ణి సూచిస్తున్నట్లు విస్తరించడం
  rationale: ఈ వచనం κύριος అనే బిరుదును మాత్రమే వాడుతుంది. సందర్భం ఆధారంగా పాఠకుడు గ్రహించగల సూచనను అనువాదం నిర్బంధంగా పరిష్కరించదు.
- issue: πάντας పరిధి
  choice: ‘అందరి’ అని విస్తృతంగా ఉంచడం
  alternative: ‘మనుషులందరి’ లేదా ‘విశ్వాసులందరి’ అని నిర్దిష్టం చేయడం
  rationale: గ్రీకు పదం స్వయంగా వర్గాన్ని నిర్దిష్టం చేయదు; అందువల్ల దాని విస్తృతతను, సాధ్యమైన భావతీవ్రతను నిలుపుతుంది.
- issue: చివరి ఉపవాక్యంలోని గ్రీకు ellipsis
  choice: ‘మేము కూడా మీ పట్ల ఉన్నట్లే’ అని సంక్షిప్తతను నిలుపడం
  alternative: ‘మేము కూడా మీ పట్ల ప్రేమలో సమృద్ధిగా ఉన్నట్లే’ అని క్రియాభావాన్ని పూర్తిగా పూరించడం
  rationale: ముందటి వాక్యభాగం నుంచి భావాన్ని గ్రహించవచ్చు; ఏ క్రియను పూరించాలో అనువాదంలో అతిగా నిర్ణయించకుండా గ్రీకు నిర్మాణంలోని తెరచిన భావాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ప్రార్థనాత్మక శైలిని వాడింది. ‘చేయుగాక’ ఆశీర్వచన స్వరాన్ని నిలుపుతుంది; మిగతా పదబంధాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచబడ్డాయి. ‘అంతకంతకు వృద్ధి చెంది సమృద్ధిగా’ అనే జంట πλεονάζω మరియు περισσεύω రెండింటి భావతీవ్రతను ప్రతిబింబిస్తుంది.
