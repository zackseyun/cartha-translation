source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς καὶ πατὴρ ἡμῶν καὶ ὁ κύριος ἡμῶν ⸀Ἰησοῦς κατευθύναι τὴν ὁδὸν ἡμῶν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/011.yaml
  text: May our God and Father himself[a], and our Lord Jesus[b], direct our way to you.
translation:
  language: te
  text: మన దేవుడైన తండ్రి తానే[a], మన ప్రభువైన యేసు కూడా, మీ దగ్గరకు మా మార్గాన్ని సుగమం చేయుగాక.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘సుగమం చేయుగాక’ అనే క్రియ ఏకవచనంలో ఉంది; అయితే ‘మన దేవుడైన తండ్రి’ మరియు ‘మన ప్రభువైన యేసు’ కలిసి దానికి కర్తలుగా ఉన్నారు.
    reason: cross_reference
  - marker: b
    text: లేదా, ‘మీ దగ్గరకు వచ్చే మా దారిని సరిచేయుగాక.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: ఆయనే
  rationale: తీవ్రతను సూచించే αὐτός, దేవుడు స్వయంగా కార్యం చేయాలనే ప్రార్థనలోని ఉద్ఘాటనను తెలియజేస్తుంది. ‘ఆయనే’ ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక, ప్రార్థనవైపు స్వల్ప మలుపును సూచిస్తుంది. తెలుగులో ప్రత్యేక సంధానపదం చేరిస్తే మూలంలో లేని కాలార్థం లేదా వ్యతిరేకార్థం ఎక్కువగా వినిపించవచ్చు.
- source_word: ὁ θεὸς καὶ πατὴρ ἡμῶν
  choice: మన దేవుడూ తండ్రీ అయిన
  rationale: θεός, πατήρ అనే రెండు బిరుదులు ఒకే వ్యక్తిని సూచిస్తున్న నిర్మాణాన్ని, అలాగే ‘మన’ అనే సంబంధాన్ని ఈ రూపం స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς
  choice: మన ప్రభువైన యేసు
  rationale: κύριοςకు ‘ప్రభువు’ అనే సాధారణ ప్రాజెక్టు పదాన్ని వాడి, ἡμῶνను ‘మన’గా నిలిపింది; మూలంలో ‘క్రీస్తు’ లేనందున దాన్ని చేర్చలేదు.
- source_word: κατευθύναι
  choice: సుగమం చేయుగాక
  rationale: అయోరిస్ట్ ఆప్టేటివ్ ప్రార్థనాత్మక కోరికను ‘చేయుగాక’ తెలియజేస్తుంది. ప్రయాణానికి దారిని సరిచేయడం, అడ్డంకులను తొలగించడం అనే సందర్భార్థాన్ని ‘సుగమం చేయు’ సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τὴν ὁδὸν ἡμῶν
  choice: మా మార్గాన్ని
  rationale: ὁδόςలోని దారి, ప్రయాణమార్గం అనే భావాలను ‘మార్గం’ నిలుపుతుంది; ‘మా’ అనే రూపం పౌలు మరియు అతని సహచరుల ప్రయాణాన్ని సూచిస్తుంది.
- source_word: πρὸς ὑμᾶς
  choice: మీ దగ్గరకు రావడానికి
  rationale: πρός ఇక్కడ థెస్సలొనీకయులవైపు ప్రయాణదిశను సూచిస్తుంది. తెలుగులో ‘మీ దగ్గరకు రావడానికి’ ఆ గమ్యాన్ని సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘మన దేవుడూ తండ్రీ’ మరియు ‘మన ప్రభువైన యేసు’ అనే సమన్విత కర్తలతో ఏకవచన క్రియ
  choice: ఇద్దరు కర్తలనూ స్పష్టంగా ఉంచి, వారితో ఒకే ప్రార్థనాత్మక క్రియ ‘సుగమం చేయుగాక’ను వాడింది.
  alternative: వాక్యాన్ని విడదీసి దేవునికి, యేసుకు వేర్వేరు క్రియలు పెట్టడం; లేదా క్రియను ప్రధానంగా దేవునికే వర్తింపజేయడం.
  rationale: గ్రీకు వాక్యంలో తండ్రి మరియు ప్రభువైన యేసు కలిసి ఒక ఏకవచన ఆప్టేటివ్ క్రియకు కర్తలుగా ఉన్నారు. అనువాదం ఈ గమనార్హమైన వ్యాకరణ-దైవశాస్త్ర ఉద్రిక్తతను వివరించి పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే ప్రార్థనాత్మక శైలిని ఉపయోగించింది. ‘ఆయనే’ మూలంలోని ఉద్ఘాటనను, ‘చేయుగాక’ ఆప్టేటివ్ కోరికను నిలుపుతాయి. పాతకాలపు ‘మీయొద్దకు’, ‘సరాళము’ వంటి రూపాలను నివారించింది.
