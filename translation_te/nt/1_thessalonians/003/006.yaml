id: 1TH.3.6
reference: 1 Thessalonians 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄρτι δὲ ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν καὶ εὐαγγελισαμένου ἡμῖν τὴν πίστιν καὶ τὴν ἀγάπην ὑμῶν, καὶ ὅτι ἔχετε μνείαν ἡμῶν ἀγαθὴν πάντοτε ἐπιποθοῦντες ἡμᾶς ἰδεῖν καθάπερ καὶ ἡμεῖς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/006.yaml
  text: But now that Timothy has come to us from you and has brought us the good news of your faith and love[a], and that you always have a good remembrance of us, longing to see us just as we also long to see you,
translation:
  language: te
  text: అయితే ఇప్పుడు తిమోతి మీ దగ్గర నుంచి మా దగ్గరకు వచ్చి, మీ విశ్వాసం గురించీ ప్రేమ గురించీ, అలాగే మీరు ఎల్లప్పుడూ మా గురించి మంచి జ్ఞాపకం కలిగి ఉన్నారని, మేము మిమ్మల్ని చూడాలని ఎంతో కోరుకుంటున్నట్లే మీరు కూడా మమ్మల్ని చూడాలని ఎంతో కోరుకుంటున్నారని మాకు శుభవార్త చెప్పాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ విశ్వసనీయత గురించీ ప్రేమ గురించీ.” గ్రీకు పదమైన πίστiς విశ్వాసం, నమ్మకం, లేదా విశ్వసనీయతను సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄρτι δὲ
  choice: అయితే ఇప్పుడు
  rationale: మునుపటి ఆందోళన నుంచి ఇప్పుడు కలిగిన ఉపశమనానికి మార్పును δὲ సూచిస్తుంది; ἄρτι ప్రస్తుతమైన, ఇటీవలి పరిణామాన్ని తెలియజేస్తుంది.
- source_word: ἐλθόντος Τιμοθέου πρὸς ἡμᾶς ἀφ’ ὑμῶν
  choice: తిమోతి మీ దగ్గర నుంచి మా దగ్గరకు వచ్చి
  rationale: గ్రీకు genitive absolute నిర్మాణాన్ని సహజమైన తెలుగు సమాపక క్రియా నిర్మాణంగా మార్చి, ప్రయాణ దిశను స్పష్టంగా ఉంచింది.
- source_word: εὐαγγελισαμένου
  choice: మాకు శుభవార్త చెప్పాడు
  rationale: ఇక్కడ సువార్త ప్రకటించడం కంటే తిమోతి తెచ్చిన అనుకూల నివేదిక ఉద్దేశం; అయినా మూలంలోని ‘మంచి వార్త’ భావాన్ని నిలుపుతుంది.
- source_word: τὴν πίστιν
  choice: మీ విశ్వాసం
  rationale: πίστις‌కు సందర్భానుకూల ప్రధాన అర్థంగా ‘విశ్వాసం’ వాడబడింది; ‘విశ్వసనీయత/నమ్మకత్వం’ అనే సాధ్యమైన ఛాయను పాదసూచికలో ఉంచింది.
- source_word: τὴν ἀγάπην
  choice: ప్రేమ
  rationale: ἀγάπηకు సహజమైన, స్థిరమైన తెలుగు సమానార్థకం.
- source_word: μνείαν ἡμῶν ἀγαθὴν
  choice: మమ్మల్ని మంచిగా జ్ఞాపకం చేసుకుంటున్నారు
  rationale: అక్షరార్థమైన నామవాచక నిర్మాణాన్ని సహజ తెలుగు క్రియారూపంలో వ్యక్తం చేస్తూ అనుకూలమైన జ్ఞాపకం అనే భావాన్ని కాపాడింది.
- source_word: ἐπιποθοῦντες ἡμᾶς ἰδεῖν
  choice: మమ్మల్ని చూడాలని తహతహలాడుతున్నారు
  rationale: ἐπιποθέωలోని గాఢమైన ఆప్యాయ కోరికను ఆధునిక తెలుగులో బలంగా, సహజంగా తెలియజేస్తుంది.
- source_word: καθάπερ καὶ ἡμεῖς ὑμᾶς
  choice: మేము మిమ్మల్ని చూడాలని తహతహలాడుతున్నట్లే మీరు కూడా
  rationale: గ్రీకులో అధ్యాహారంగా ఉన్న ‘చూడాలని తహతహలాడటం’ అనే భావాన్ని తెలుగులో స్పష్టంగా పునరుక్తి చేసి పరస్పర కోరికను నిలుపుతుంది.
theological_decisions:
- issue: πίστις అనే పదం ‘విశ్వాసం’ లేదా ‘విశ్వసనీయత/నమ్మకత్వం’ అనే భావాలను ఇవ్వగలగడం
  choice: మీ విశ్వాసం
  alternative: మీ విశ్వసనీయత; మీ నమ్మకత్వం
  rationale: ఈ సందర్భంలో థెస్సలొనీకయులు విశ్వాసంలో కొనసాగుతున్నారనే నివేదిక ప్రధానంగా కనిపిస్తుంది. అయితే స్థిరత్వం లేదా నమ్మకత్వం అనే అర్థఛాయ కూడా సాధ్యమే కాబట్టి దానిని పాదసూచికలో సంరక్షించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని దీర్ఘ వాక్యాన్ని చదవడానికి సహజంగా రెండు వాక్యాలుగా విభజించాం; రెండవ వాక్యంలో ‘అతడు తెలిపాడు’ అని చేర్చడం గ్రీకు εὐαγγελισαμένου కింద ఉన్న నివేదిక అంశాల సంబంధాన్ని స్పష్టం చేస్తుంది. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
