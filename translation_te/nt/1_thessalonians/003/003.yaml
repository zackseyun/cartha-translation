review_pass:
  verdict: revise
  source_fidelity: The draft adds “మేము అతన్ని పంపాము” (“we sent him”), which belongs to the preceding verse and is absent from 1 Thessalonians 3:3. The Greek begins with a purpose infinitive dependent on the prior context; Telugu should retain that dependence without importing text from verse 2. “దీనికోసమే నియమించబడ్డాము” accurately renders εἰς τοῦτο κείμεθα while retaining the referential breadth of τοῦτο.
  naturalness: The revised wording is modern, clear Telugu. “మీకు స్వయంగా తెలుసు” naturally conveys the emphasis of αὐτοὶ, without the potentially misleading exclusivity of “మీకే.”
  terminology: “శ్రమలు” suitably renders θλίψεις, “చలించిపోవడం” fits σαίνεσθαι in this context, and “నియమించబడ్డాము” appropriately expresses the idiomatic force of κεῖμαι without imposing a detailed theological system.
  issues:
  - severity: high
    issue: The main text includes “మేము అతన్ని పంపాము.”
    rationale: This clause is not present in the supplied Greek text for 3:3; it belongs to the preceding verse. It must be removed for verse-level source fidelity.
  - severity: medium
    issue: “మీకే తెలుసు” can imply that only the readers know this.
    rationale: αὐτοὶ is emphatic (“you yourselves”), not necessarily exclusive. “మీకు స్వయంగా తెలుసు” more naturally preserves the emphasis.
  - severity: low
    issue: “వీటిని అనుభవించడానికే” narrows τοῦτο to an explicit object and inserts an infinitival formulation not present in the Greek.
    rationale: The antecedent is clearly the afflictions, but “దీనికోసమే” better preserves the Greek’s concise, context-dependent reference.
  revised_text: ఈ శ్రమలవల్ల ఎవరూ చలించిపోకుండా ఉండాలని[a]. ఎందుకంటే, మనం దీనికోసమే నియమించబడ్డామని[b] మీకు స్వయంగా తెలుసు.
