  text: τὸ μηδένα σαίνεσθαι ἐν ταῖς θλίψεσιν ταύταις. αὐτοὶ γὰρ οἴδατε ὅτι εἰς τοῦτο κείμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/003.yaml
  text: so that no one would be shaken by these afflictions[c][b][a]. For you yourselves know that we are appointed for this.
translation:
  language: te
  text: ఈ శ్రమలవల్ల ఎవరూ చలించిపోకుండా ఉండాలని[a]. ఎందుకంటే, మనం దీనికోసమే నియమించబడ్డామని[b] మీకు స్వయంగా తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కలవరపడకుండా,’ ‘అస్థిరపడకుండా.’ అరుదైన ఈ గ్రీకు క్రియకు ఇతర సందర్భాల్లో ‘మోసపోవడం’ లేదా ‘ముఖస్తుతితో లోబరచబడడం’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మనం దీనికోసం నిర్ణయించబడ్డాము,’ ‘మనం దీనికోసం ఉంచబడ్డాము.’
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ μηδένα σαίνεσθαι
  choice: ఎవరూ చలించిపోకుండా
  rationale: ముందటి వచనంలోని పంపడం అనే క్రియతో ఈ ఉద్దేశార్థక infinitive సంబంధిస్తుంది. అరుదైన σαίνεσθαι ఇక్కడ శ్రమలవల్ల విశ్వాసంలో కలవరపడడం లేదా అస్థిరపడడం అనే భావాన్ని ఇస్తుంది; ‘చలించిపోవడం’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐν ταῖς θλίψεσιν ταύταις
  choice: ఈ శ్రమలవల్ల
  rationale: ἐν అక్షరార్థంగా ‘లో’ అయినప్పటికీ, ఇక్కడ శ్రమలు కలవరానికి కారణమైన పరిస్థితులని సందర్భం సూచిస్తుంది. θλίψεις‌కు ‘శ్రమలు’ సాధారణ పాఠకులకు సహజంగా ఉండి పౌలు వాడుకలోని ఒత్తిడి, బాధ అనే బరువును నిలుపుతుంది.
- source_word: αὐτοὶ γὰρ οἴδατε
  choice: ఎందుకంటే ... మీకే తెలుసు
  rationale: αὐτοί ఇచ్చే ఉద్ఘాటనను ‘మీకే’ నిలుపుతుంది; γάρ ముందటి మాటకు వివరణాత్మక ఆధారాన్ని పరిచయం చేస్తుంది.
- source_word: εἰς τοῦτο κείμεθα
  choice: మనం వీటిని అనుభవించడానికే నియమించబడ్డాము
  rationale: κεῖμαι యొక్క ‘ఉంచబడి ఉండడం’ అనే మూలభావం ఈ ప్రయోగంలో నియమించబడడం లేదా నిర్ణయించబడడం అనే భావాన్ని ఇస్తుంది. ‘వీటిని అనుభవించడానికి’ అనేది τοῦτο సమీపంలోని బహువచన ‘ఈ శ్రమలు’ను సూచిస్తుందని తెలుగులో స్పష్టం చేస్తుంది; ‘నియమించబడ్డాము’ దైవిక ఏర్పాటును సూచించినా అనవసరమైన సిద్ధాంత వివరణను జోడించదు.
theological_decisions:
- issue: εἰς τοῦτο κείμεθα లో విశ్వాసులకూ శ్రమలకూ ఉన్న సంబంధం
  choice: మనం వీటిని అనుభవించడానికే నియమించబడ్డాము
  alternative: మనం వీటి కోసమే ఉంచబడ్డాము / ఇవి మనకు నిర్ణయించబడ్డాయి
  rationale: విశ్వాసుల జీవితంలో శ్రమలు ఊహించని ప్రమాదం కావని, వారి పిలుపులో భాగమని వాక్యం చెబుతుంది. ‘నియమించబడ్డాము’ ఆ గంభీరతను నిలుపుతూనే, నియామక స్వరూపం లేదా ముందుగా నిర్ణయించడం గురించి వాక్యం చెప్పని ప్రత్యేక సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. వాక్యం 2తో ఉన్న వ్యాకరణ సంబంధాన్ని తెలుగులో సంపూర్ణంగా చూపేందుకు ‘మేము అతన్ని పంపాము’ను పునరుద్ధరించాం. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ఉంచబడింది.
