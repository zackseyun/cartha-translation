id: 1TH.3.5
reference: 1 Thessalonians 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο κἀγὼ μηκέτι στέγων ἔπεμψα εἰς τὸ γνῶναι τὴν πίστιν ὑμῶν, μή πως ἐπείρασεν ὑμᾶς ὁ πειράζων καὶ εἰς κενὸν γένηται ὁ κόπος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/005.yaml
  text: For this reason[a], when I could bear it no longer, I sent to learn about your faith[b], lest somehow the tempter had tempted you and our labor might be in vain.
translation:
  language: te
  text: అందుచేత నేనుకూడా ఇక సహించలేక, మీ విశ్వాసం[a] గురించి తెలుసుకోవడానికి పంపాను; ఎక్కడ శోధించేవాడు మిమ్మల్ని ఎలాగైనా శోధించి, మా శ్రమ వృథా అయిపోయిందేమోనని.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ నమ్మకం”; సందర్భాన్ని బట్టి “నమ్మకంగా ఉండడం” అనే భావం కూడా ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “వృథా అయిపోయిందేమోనని” అంటే “ఫలితం లేకుండా పోయిందేమోనని” లేదా “వ్యర్థమైందేమోనని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందుచేత
  rationale: ముందటి వచనాలలో చెప్పిన పరిస్థితికి వెనుకకు సూచించే కారణ-ఫల సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κἀγὼ
  choice: నేను కూడా
  rationale: κἀγώలోని καί భావాన్ని తెలుగులో స్పష్టంగా ఉంచుతూ పౌలు తన స్పందనను ముందటి సందర్భంతో కలుపుతుంది.
- source_word: μηκέτι στέγων
  choice: ఇక సహించలేక
  rationale: కొంతకాలం భరించిన తరువాత ఇక భరించలేని స్థితిని సంక్షిప్తమైన, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἔπεμψα
  choice: పంపాను
  rationale: గ్రీకులో కర్మ ప్రత్యక్షంగా లేదు; సందర్భంలో తిమోతి సూచింపబడినా ఈ వచనంలో లేని పేరును చేర్చలేదు.
- source_word: εἰς τὸ γνῶναι
  choice: గురించి తెలుసుకోవడానికి
  rationale: ఉద్దేశార్థక infinitive భావాన్ని సహజమైన తెలుగులో, సమాచారాన్ని తెలుసుకోవాలనే పరిశీలన భావంతో అందిస్తుంది.
- source_word: τὴν πίστιν ὑμῶν
  choice: మీ విశ్వాసం
  rationale: πίστιςకు ఈ సందర్భంలో ప్రధాన భావమైన దేవునిపై నమ్మకాన్ని తెలిపే సాధారణ తెలుగు పదం; నమ్మకం లేదా విశ్వసనీయత అనే సాధ్యమైన ఛాయలను పాదసూచికలో ఉంచాం.
- source_word: μή πως
  choice: ఏ విధంగానైనా … ఏమో … అని భయపడ్డాను
  rationale: సంభవించి ఉండవచ్చనే పౌలు ఆందోళనను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; 'భయపడ్డాను' అనేది గ్రీకులోని apprehensive constructionను స్పష్టం చేస్తుంది.
- source_word: ἐπείρασεν ὑμᾶς ὁ πειράζων
  choice: శోధించేవాడు మిమ్మల్ని ఏ విధంగానైనా శోధించి ఉంటాడేమో
  rationale: పాల్గొనేవాడు మరియు క్రియ మధ్య ఉన్న ఒకే మూలపదపు పునరుక్తిని నిలుపుతుంది; సందర్భంలో ఇది విశ్వాసం నుండి తొలగించే ప్రలోభాన్ని సూచిస్తుంది.
- source_word: εἰς κενὸν γένηται
  choice: వ్యర్థమైపోతుందేమో
  rationale: ‘ఫలితం లేకుండా పోవడం’ అనే idiomatic అర్థాన్ని సహజంగా తెలియజేస్తూ γένηταιలోని మార్పు లేదా ఫలిత స్థితి భావాన్ని కూడా ఉంచుతుంది.
- source_word: ὁ κόπος ἡμῶν
  choice: మా కష్టం
  rationale: κόποςలోని శ్రమతో కూడిన కృషి భావాన్ని సాధారణ పాఠకులకు సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: πίστις యొక్క సందర్భోచిత భావం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఇక్కడ థెస్సలొనీకయులు సువార్తపై కొనసాగిస్తున్న నమ్మకమే ప్రధానంగా ఉద్దేశించబడినట్లు సందర్భం సూచిస్తుంది; అయినా గ్రీకు పదంలోని పరస్పరం మేళవిన ఇతర భావాలను పాదసూచికలో నిలిపాం.
- issue: ὁ πειράζων యొక్క గుర్తింపు
  choice: శోధించేవాడు
  alternative: శోధకుడు; సాతాను
  rationale: సందర్భం సాతానును సూచించినా మూలపాఠం ఇక్కడ అతని పేరును కాక వివరణాత్మక participleను వాడుతుంది; అందుచేత పేరును దిగుమతి చేయకుండా మూల రూపాన్ని అనుసరించాం.
- issue: μή πως తరువాతి రెండు క్రియల అనిశ్చితి
  choice: శోధించి ఉంటాడేమో … వ్యర్థమైపోతుందేమో
  alternative: శోధించాడు … వ్యర్థమైంది
  rationale: మొదటి క్రియ గతంలో సంభవించి ఉండవచ్చనే ఆందోళనను, రెండవది దాని ఫలితంగా శ్రమ నిష్ఫలమయ్యే అవకాశాన్ని తెలుగులో వేరుచేసి, మూలంలోని కాల-భావ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ‘శోధించేవాడు … శోధించి’ అనే పునరుక్తి మూల గ్రీకులోని పదప్రయోగాన్ని ఉద్దేశపూర్వకంగా నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
