id: 1TH.3.7
reference: 1 Thessalonians 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρεκλήθημεν, ἀδελφοί, ἐφ’ ὑμῖν ἐπὶ πάσῃ τῇ ⸂ἀνάγκῃ καὶ θλίψει⸃ ἡμῶν διὰ τῆς ὑμῶν πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/007.yaml
  text: For this reason[a], brothers, concerning you, in all our distress and affliction[b], we were comforted through your faith.
translation:
  language: te
  text: అందువల్ల, సోదరులారా,[a] మీ విషయమై, మా సమస్త కష్టాల్లోను బాధల్లోను, మీ విశ్వాసం[b] ద్వారా మేము ఆదరణ పొందాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సోదరులు” అనేది పౌలు సంఘాన్ని సంబోధించడానికి సాధారణంగా ఉపయోగించే మాట; ఇది విశ్వాసులైన స్త్రీపురుషులందరినీ కలుపుకొని ఉండవచ్చు.
    reason: cultural_note
  - marker: b
    text: లేదా, “విశ్వాసంలో స్థిరత్వం.” గ్రీకు పదం విశ్వాసం, నమ్మకం లేదా స్థిరనిష్ఠను సూచించగలదు; ఇక్కడ థెస్సలొనీకయులు విశ్వాసంలో స్థిరంగా కొనసాగుతున్న భావం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందువల్ల
  rationale: ముందటి వాక్యాల్లోని తిమోతి నివేదికకు ఈ ఫలితాన్ని సహజంగా అనుసంధానించే కారణార్థక పదబంధం.
- source_word: παρεκλήθημεν
  choice: మేము ఆదరణ పొందాము
  rationale: ఇక్కడ παρακαλέω కర్తరి కాని రూపం కష్టాల మధ్య లభించిన ఓదార్పు, ధైర్యాన్ని సూచిస్తుంది; ‘ఆదరణ పొందాము’ ఈ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: సంభోధన రూపాన్ని నిలుపుతూ పౌలు సంఘాన్ని ఉద్దేశించి మాట్లాడుతున్న గౌరవభరిత శైలిని కాపాడుతుంది.
- source_word: ἐφ’ ὑμῖν
  choice: మీ విషయమై
  rationale: థెస్సలొనీకయులు కష్టాలకు కారణమన్న భావం రాకుండా, వారి గురించిన విషయంలో పౌలు ఆదరణ పొందాడనే సంబంధాన్ని కాపాడుతుంది.
- source_word: ἐπὶ πάσῃ τῇ ἀνάγκῃ καὶ θλίψει ἡμῶν
  choice: మా కష్టాలన్నిటిలోనూ బాధలన్నిటిలోనూ
  rationale: ఆదరణ పొందిన పరిస్థితులను తెలియజేస్తూ, ఒత్తిడి మరియు శ్రమను సూచించే రెండు మూలపదాల తీవ్రతను ఆధునిక తెలుగులో వేర్వేరు నామవాచకాలతో నిలుపుతుంది.
- source_word: διὰ τῆς ὑμῶν πίστεως
  choice: మీ విశ్వాసం ద్వారా
  rationale: διά షష్ఠీ విభక్తితో ఇక్కడ సాధనార్థాన్ని సూచిస్తుంది; వారి విశ్వాసమే ఆదరణకు సాధనమని తెలియజేస్తుంది.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: πίστις యొక్క సాధారణ అర్థాన్ని ఉంచుతుంది; ఈ సందర్భంలో ఉండగల స్థిరనిష్ఠ అనే భావఛాయను పాదసూచికలో భద్రపరుస్తుంది.
theological_decisions:
- issue: కొనసాగుతున్న స్థిరత్వాన్ని సూచించే సందర్భంలో πίστις అనువాదం
  choice: విశ్వాసం
  alternative: విశ్వసనీయత; విశ్వాసంలో స్థిరత్వం
  rationale: ప్రధాన పాఠ్యంలో πίστις యొక్క సాధారణ భావమైన ‘విశ్వాసం’ను ఉంచడం, వారి నమ్మకంతో పాటు దానిలోని స్థిరత్వాన్ని కూడా తెరిచి ఉంచుతుంది; ‘విశ్వసనీయత’ అని మాత్రమే అనువదిస్తే నమ్మకం అనే భావం తగ్గిపోవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సంఘ పఠనానికి అనువైన శైలి. మూలంలోని ‘మీ విషయమై’ అనే సంబంధాన్ని విడిగా ఉంచి, కష్టాలు థెస్సలొనీకయుల వల్ల వచ్చాయనే అపార్థాన్ని నివారించింది. రెండు పాదసూచిక గుర్తులు సంబంధిత పదాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
