id: 1TH.3.9
reference: 1 Thessalonians 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίνα γὰρ εὐχαριστίαν δυνάμεθα τῷ θεῷ ἀνταποδοῦναι περὶ ὑμῶν ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν δι’ ὑμᾶς ἔμπροσθεν τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/003/009.yaml
  text: For what thanksgiving can we repay to God concerning you[a], for all the joy with which we rejoice because of you before our God,
translation:
  language: te
  text: మీ విషయమై దేవునికి మేము ఏ కృతజ్ఞతను తిరిగి చెల్లించగలం—మీ కారణంగా మన దేవుని సన్నిధిలో మేము అనుభవిస్తున్న సమస్త ఆనందానికిగాను?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, మరింత వాడుకగా: “మీ నిమిత్తం దేవునికి తగినంతగా ఎలా కృతజ్ఞతలు చెప్పగలం? మీ కారణంగా మన దేవుని సన్నిధిలో మేము పొందుతున్న సమస్త ఆనందం కోసం ఇలా అడుగుతున్నాం.” గ్రీకు వాక్యం అక్షరార్థానికి దగ్గరగా, “మీ విషయమై దేవునికి ఏ కృతజ్ఞతను తిరిగి చెల్లించగలం—మీ కారణంగా మన దేవుని సన్నిధిలో మేము ఆనందించే సమస్త ఆనందానికిగాను?” అని ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα ... εὐχαριστίαν
  choice: ఏ విధమైన కృతజ్ఞతను
  rationale: ప్రశ్నార్థక నిర్మాణాన్ని నిలుపుతూ, తమ కృతజ్ఞత ఎంత అపరిపూర్ణమో తెలిపే అలంకారిక ప్రశ్నగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δυνάμεθα
  choice: చెల్లించగలం
  rationale: సామర్థ్యాన్ని సూచించే గ్రీకు క్రియ భావం, ἀνταποδοῦναιతో కలిసి తెలుగులో సహజంగా వ్యక్తమవుతుంది.
- source_word: ἀνταποδοῦναι
  choice: తిరిగి చెల్లించగలం
  rationale: ప్రతిగా తిరిగి ఇవ్వడం అనే మూలభావాన్ని నిలుపుతుంది; ఇది దేవునితో వ్యాపార సంబంధాన్ని సూచించకుండా, కృతజ్ఞతను తగినంతగా వ్యక్తం చేయలేమనే అలంకారిక భావాన్ని ఇస్తుంది.
- source_word: περὶ ὑμῶν
  choice: మీ విషయమై
  rationale: ‘మీ గురించి/మీ విషయమై’ అనే సూచనార్థాన్ని కాపాడుతూ, తరువాతి δι’ ὑμᾶς యొక్క కారణార్థంతో కలిసిపోకుండా చేస్తుంది.
- source_word: ἐπὶ πάσῃ τῇ χαρᾷ ᾗ χαίρομεν
  choice: మేము పొందుతున్న ఈ సమస్త ఆనందానికిగాను
  rationale: χαρά–χαίρομεν పదపునరుక్తిని తెలుగులో యథాతథంగా ఉంచితే కృత్రిమంగా వినిపిస్తుంది; ఆనందానికి కారణంగా కృతజ్ఞత చెల్లించే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: δι’ ὑμᾶς
  choice: మీ విషయమై ... పొందుతున్న
  rationale: తెలుగు వాక్యనిర్మాణంలో ‘మీ విషయమై’తో అనుసంధానించి, వారి కారణంగా కలిగిన ఆనందాన్ని వ్యక్తం చేస్తుంది; కారణ సంబంధం సందర్భంలో స్పష్టంగా ఉంది.
- source_word: ἔμπροσθεν τοῦ θεοῦ ἡμῶν
  choice: మన దేవుని సన్నిధిలో
  rationale: దేవుని ఎదుట లేదా ఆయన సమక్షంలో అనే రూపకాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: దేవునికి కృతజ్ఞతను ‘తిరిగి చెల్లించడం’ అనే భాష
  choice: ‘కృతజ్ఞతను తిరిగి చెల్లించగలం’ అనే మూలంలోని ప్రతిదాన భావాన్ని నిలిపాము.
  alternative: ‘దేవునికి మీ నిమిత్తం తగినంతగా ఎలా కృతజ్ఞతలు చెప్పగలం?’
  rationale: ἀνταποδοῦναιలో ప్రతిగా ఇవ్వడం అనే స్పష్టమైన భావం ఉంది. అలంకారిక ప్రశ్న ఇది నిజమైన ఋణపరిహార లావాదేవీ కాదని, దేవునిపట్ల తమ కృతజ్ఞతను పూర్తిగా వ్యక్తం చేయలేమనే భావమని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు అలంకారిక ప్రశ్నను, ‘తిరిగి చెల్లించడం’ అనే రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, మరింత వాడుకైన రూపాన్ని పాదటిప్పణిలో ఇచ్చాము.
