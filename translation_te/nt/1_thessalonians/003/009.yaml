revisions:
- from: మీ విషయమై మన దేవుని సన్నిధిలో మేము పొందుతున్న ఈ సమస్త ఆనందానికిగాను, దేవునికి ఏ విధమైన కృతజ్ఞతను తిరిగి చెల్లించగలం?[a]
  to: మీ విషయమై దేవునికి మేము ఏ కృతజ్ఞతను తిరిగి చెల్లించగలం—మీ కారణంగా మన దేవుని సన్నిధిలో మేము అనుభవిస్తున్న సమస్త ఆనందానికిగాను?[a]
  rationale: The revision distinguishes ‘మీ విషయమై’ (περί ὑμῶν) from ‘మీ కారణంగా’ (διά ὑμᾶς), retains the rhetorical question and the reciprocal metaphor of rendering thanksgiving back to God, and preserves the relation of thanksgiving to the total joy experienced before God. The footnote now gives a complete idiomatic alternative and a complete near-literal rendering.
