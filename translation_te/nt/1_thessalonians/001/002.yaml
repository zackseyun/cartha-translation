translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని ప్రధాన క్రియను, ప్రార్థనను సూచించే భాగస్వామ్య క్రియను వేరు చూపేందుకు అర్ధవిరామం వాడబడింది; చివరి క్రియావిశేషణం యొక్క నిజమైన అన్వయ సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
