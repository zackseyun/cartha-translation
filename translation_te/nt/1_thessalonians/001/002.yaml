id: 1TH.1.2
reference: 1 Thessalonians 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ θεῷ πάντοτε περὶ πάντων ὑμῶν ⸀μνείαν ποιούμενοι ἐπὶ τῶν προσευχῶν ἡμῶν, ἀδιαλείπτως
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/002.yaml
  text: We always give thanks to God for all of you[a], making mention of you in our prayers unceasingly,
translation:
  language: te
  text: మేము మీ అందరి కోసం ఎల్లప్పుడూ దేవునికి కృతజ్ఞతలు చెల్లిస్తున్నాం; మా ప్రార్థనల్లో మిమ్మల్ని ప్రస్తావిస్తూ ఉంటాం—ఎడతెగకుండా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నిరంతరం.’ ఈ క్రియావిశేషణం ప్రత్యేకంగా ‘మా ప్రార్థనల్లో మిమ్మల్ని ప్రస్తావిస్తూ ఉంటాం’ అనే మాటకు గానీ, విస్తృతంగా దేవునికి కృతజ్ఞతలు చెల్లించే మొత్తం వాక్యానికి గానీ అన్వయించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: కృతజ్ఞతలు చెల్లిస్తున్నాం
  rationale: వర్తమానకాల క్రియ యొక్క భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది; కృతజ్ఞతలు దేవునికే ఉద్దేశించబడ్డాయని స్పష్టంగా ఉంచుతుంది.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: కృతజ్ఞతలు అందుకునే వ్యక్తిని సూచించే గ్రీకు చతుర్థీ విభక్తిని నేరుగా వ్యక్తపరుస్తుంది.
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: కాలవ్యాప్తిని తెలిపే πάντοτεకు సహజమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: περὶ πάντων ὑμῶν
  choice: మీ అందరి కోసం
  rationale: περί మరియు షష్ఠీ విభక్తి ఇక్కడ సంబంధం లేదా శ్రద్ధను సూచిస్తున్నాయి; ‘మీ అందరి’ అన్నది πάντων యొక్క సమగ్రతను కాపాడుతుంది.
- source_word: μνείαν ποιούμενοι
  choice: మిమ్మల్ని ప్రస్తావిస్తూ ఉంటాం
  rationale: ప్రార్థనలో వారి గురించి ప్రస్తావించడం అనే గ్రీకు ప్రయోగాన్ని సహజంగా తెలుపుతుంది; సందర్భం ద్వారా అర్థమయ్యే కర్మను ‘మిమ్మల్ని’ అని స్పష్టం చేస్తుంది.
- source_word: ἐπὶ τῶν προσευχῶν ἡμῶν
  choice: మా ప్రార్థనల్లో
  rationale: ప్రార్థన చేసే సందర్భాన్ని సూచించే ఈ గ్రీకు ప్రయోగానికి సహజమైన తెలుగు రూపం.
- source_word: ἀδιαλείπτως
  choice: ఎడతెగకుండా
  rationale: ఆగకుండా, నిరంతరంగా కొనసాగడాన్ని బలంగా సూచిస్తుంది; గ్రీకులోని చివరి స్థానాన్ని అనుసరించి ఉంచడం వల్ల దాని అన్వయ సందిగ్ధతను పూర్తిగా తొలగించకుండా కాపాడుతుంది.
