  naturalness: The Telugu is generally clear and modern. 'తీవ్రమైన శ్రమ మధ్య' is more direct and source-close than 'తీవ్రమైన శ్రమల మధ్య.' Placing the footnote marker directly after the phrase it qualifies makes its reference clear.
