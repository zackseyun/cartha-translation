id: 1TH.1.6
reference: 1 Thessalonians 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μιμηταὶ ἡμῶν ἐγενήθητε καὶ τοῦ κυρίου, δεξάμενοι τὸν λόγον ἐν θλίψει πολλῇ μετὰ χαρᾶς πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/006.yaml
  text: And you became imitators of us and of the Lord[a], having received the word in much affliction with joy of the Holy Spirit,
translation:
  language: te
  text: మీరు మమ్మల్నీ ప్రభువునీ అనుకరించేవారయ్యారు. తీవ్రమైన శ్రమ మధ్య పరిశుద్ధాత్మవలన కలిగిన ఆనందంతో[a] వాక్యాన్ని స్వీకరించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధాత్మ ఆనందంతో”; అంటే, పరిశుద్ధాత్మ కలిగించిన ఆనందంతో.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ
  choice: అనుకరించేవారు
  rationale: ఇది కేవలం వెంబడించడాన్ని కాక, ఒకరి మాదిరిని అనుసరించి ప్రవర్తించడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐγενήθητε
  choice: అయ్యారు
  rationale: స్థితిలో వచ్చిన మార్పును సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τοῦ κυρίου
  choice: ప్రభువును
  rationale: ఇక్కడ κύριος యేసును సూచించే క్రీస్తుసంబంధమైన బిరుదు; ‘ప్రభువు’ దానికి స్థిరమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: δεξάμενοι
  choice: స్వీకరించారు
  rationale: సందేశాన్ని అంగీకరించి ఆదరంగా స్వీకరించిన భావాన్ని సహజంగా తెలియజేస్తుంది; ప్రధాన క్రియతో దాని సంబంధాన్ని తెలుగులో ప్రత్యేక వాక్యంగా స్పష్టపరుస్తుంది.
- source_word: τὸν λόγον
  choice: వాక్యాన్ని
  rationale: ఇది ప్రకటించబడిన సువార్త సందేశాన్ని సూచిస్తుంది; ‘వాక్యం’ పౌలు వాడిన పదప్రయోగాన్ని, దాని అంతర్గ్రంథ ప్రతిధ్వనులను కాపాడుతుంది.
- source_word: ἐν θλίψει πολλῇ
  choice: తీవ్రమైన శ్రమల మధ్య
  rationale: ఒత్తిడి, బాధ, హింసాత్మక కష్టాల భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; అనవసరమైన అంత్యకాల సూచనను చేర్చదు.
- source_word: μετὰ χαρᾶς
  choice: ఆనందంతో
  rationale: గ్రీకు ఉపసర్గ పదబంధానికి సరళమైన, సహజమైన సమానం.
- source_word: πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మ అనుగ్రహించిన
  rationale: షష్ఠీ విభక్తి సూచించే మూలం లేదా ఉత్పాదక సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయంగా మరింత రూపసామ్యమైన పఠనాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: ‘పరిశుద్ధాత్మ ఆనందం’లోని షష్ఠీ విభక్తి సంబంధం
  choice: పరిశుద్ధాత్మ అనుగ్రహించిన ఆనందం
  alternative: పరిశుద్ధాత్మకు చెందిన ఆనందం / పరిశుద్ధాత్మ కలిగించిన ఆనందం
  rationale: తీవ్రమైన శ్రమలకు విరుద్ధంగా ఉన్న ఈ ఆనందానికి పరిశుద్ధాత్మ మూలమని సందర్భం సూచిస్తుంది. ప్రధాన పాఠం ఆ భావాన్ని సహజ తెలుగులో ఇస్తూ, గ్రీకులోని నిజమైన సంబంధ అస్పష్టతను పాదటిప్పణిలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. పొడవైన గ్రీకు వాక్య నిర్మాణాన్ని సహజ తెలుగు కోసం రెండు వాక్యాలుగా విభజించాం; భావ సంబంధాన్ని మార్చలేదు.
