  text: ὥστε γενέσθαι ὑμᾶς ⸀τύπον πᾶσιν τοῖς πιστεύουσιν ἐν τῇ Μακεδονίᾳ καὶ ⸀ἐν τῇ Ἀχαΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/007.yaml
  text: so that you became an example to all the believers in Macedonia and in Achaia[a].
translation:
  language: te
  text: అలా మీరు మాసిదోనియలో, అకయలో ఉన్న విశ్వాసులందరికీ ఆదర్శంగా[a] నిలిచారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మాదిరిగా,” “నమూనాగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: అలా
  rationale: మునుపటి వాక్యంలో చెప్పిన పరిణామాన్ని సహజమైన తెలుగులో సూచిస్తుంది; గ్రీకు పదంలోని ఫలితార్థాన్ని నిలుపుతుంది.
- source_word: γενέσθαι
  choice: నిలిచారు
  rationale: ‘అయ్యారు’ అనే మూలార్థాన్ని సందర్భానుకూలంగా, ఆదర్శంగా మారి కొనసాగిన భావంతో సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑμᾶς
  choice: మీరు
  rationale: బహువచన ద్వితీయ పురుషాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τύπον
  choice: ఆదర్శంగా
  rationale: ఇతరులు అనుసరించదగిన నమూనా అనే సందర్భార్థాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πᾶσιν τοῖς πιστεύουσιν
  choice: విశ్వాసులందరికీ
  rationale: నామవాచకంగా పనిచేసే వర్తమాన కృదంతాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తూ, దత్తి విభక్తిలోని ‘ఎవరికి ఆదర్శం’ అనే సంబంధాన్ని నిలుపుతుంది.
- source_word: ἐν τῇ Μακεδονίᾳ καὶ ἐν τῇ Ἀχαΐᾳ
  choice: మాసిదోనియలో, అకయలో ఉన్న
  rationale: రెండు ప్రాంతాల స్థానార్థాన్ని సమాంతరంగా నిలుపుతూ, అవి విశ్వాసుల స్థానాన్ని సూచిస్తున్నాయని తెలుగులో సహజంగా స్పష్టం చేస్తుంది.
