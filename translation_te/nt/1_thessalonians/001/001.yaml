id: 1TH.1.1
reference: 1 Thessalonians 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παῦλος καὶ Σιλουανὸς καὶ Τιμόθεος τῇ ἐκκλησίᾳ Θεσσαλονικέων ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ· χάρις ὑμῖν καὶ ⸀εἰρήνη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/001.yaml
  text: 'Paul and Silvanus and Timothy[b][a], to the church of the Thessalonians in God the Father and the Lord Jesus the Messiah: grace to you and peace.'
translation:
  language: te
  text: 'పౌలు, సిల్వాను, తిమోతి—తండ్రియైన దేవునిలోనూ ప్రభువైన యేసు మెస్సీయలోనూ[b] ఉన్న థెస్సలొనీకయుల సంఘానికి[a]: మీకు కృప, శాంతి కలుగుగాక.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సంఘం’కు బదులుగా ‘సభ’ అని కూడా అనువదించవచ్చు. గ్రీకు ἐκκλησία కూడిన సమాజాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ప్రభువైన యేసు క్రీస్తులోనూ.’ గ్రీకు Χριστός ఒక బిరుదుగా ‘మెస్సీయ’ లేదా ‘అభిషిక్తుడు’ అని అర్థం; తెలుగులో సాధారణంగా ‘క్రీస్తు’ అని ధ్వన్యనువాదం చేస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: పౌలు
  rationale: Παῦλος అనే వ్యక్తిపేరుకు తెలుగులో స్థిరపడిన సహజ రూపం.
- source_word: Σιλουανὸς
  choice: సిల్వాను
  rationale: మూలపాఠంలోని Σιλουανός రూపాన్ని నేరుగా ప్రతిబింబిస్తుంది; వేరే గ్రీకు రూపానికి అనుగుణమైన ‘సీల’ అని మార్చలేదు.
- source_word: Τιμόθεος
  choice: తిమోతి
  rationale: Τιμόθεος అనే వ్యక్తిపేరుకు తెలుగులో స్థిరపడిన రూపం.
- source_word: ἐκκλησίᾳ
  choice: సంఘానికి
  rationale: ఇక్కడ విశ్వాసులుగా కూడిన సమాజాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం; కేవలం భవనాన్ని సూచించదు.
- source_word: Θεσσαλονικέων
  choice: థెస్సలొనీకయుల
  rationale: థెస్సలొనీక పట్టణానికి చెందిన ప్రజలను సూచించే జనవాచక బహువచనాన్ని నిలుపుతుంది.
- source_word: ἐν
  choice: లోనూ … లోనూ
  rationale: సంఘం తండ్రియైన దేవునితోను ప్రభువైన యేసు మెస్సీయతోను కలిగిన సంబంధం లేదా ఉనికి పరిధిని ‘లో’ అనే రూపంతో నిలిపి, ‘చెందిన’ వంటి వివరణాత్మక భావానికి పరిమితం చేయలేదు. తెలుగులో సమాంతర సంబంధాన్ని స్పష్టం చేయడానికి విభక్తిని రెండుసార్లు పలికాం.
- source_word: θεῷ πατρὶ
  choice: తండ్రియైన దేవుని
  rationale: గ్రీకులో లేని ‘మన’ అనే స్వామ్యపదాన్ని చేర్చకుండా, θεός మరియు πατήρ మధ్యనున్న విశేషణసమాన సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κυρίῳ
  choice: ప్రభువైన
  rationale: నూతన నిబంధన సందర్భంలో κύριοςకు సాధారణమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: Ἰησοῦ Χριστῷ
  choice: యేసు మెస్సీయ
  rationale: Χριστόςను కేవలం ధ్వన్యనువాదమైన ‘క్రీస్తు’గా కాక, అభిషిక్త రాజు అనే బిరుదు అర్థాన్ని నిలిపే ‘మెస్సీయ’గా ఇచ్చాం.
- source_word: χάρις
  choice: కృప
  rationale: పౌలు పత్రికల అభివాదంలో పదానికి ఉన్న భావాన్ని, ఆధ్యాత్మిక ప్రతిధ్వనిని నిలిపే ప్రామాణిక తెలుగు రూపం.
- source_word: εἰρήνη
  choice: శాంతి
  rationale: గ్రీకు మరియు యూదు అభివాద సంప్రదాయాల రెండింటి ప్రతిధ్వనినీ నిలిపే సహజ తెలుగు సమానం.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: మీకు కృప, శాంతి కలుగుగాక
  rationale: గ్రీకు వాక్యంలో క్రియ వ్యక్తంగా లేకపోయినా, ఇది అభివాద ఆశీర్వచనం. తెలుగులో పూర్తి, సహజ అభివాదంగా వినిపించేందుకు ‘కలుగుగాక’ను భావపూరకంగా చేర్చాం; ‘మీకు’ స్థానాన్ని కృపకు ముందే ఉంచాం.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ అభివాదంలోనూ బిరుదు భావం గ్రహించదగినదే. అందువల్ల అభిషిక్తుడు అనే అర్థాన్ని సూచించే ‘మెస్సీయ’ను వాడి, విస్తృతంగా పరిచయమైన ‘క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
- issue: ἐν θεῷ πατρὶ καὶ κυρίῳ Ἰησοῦ Χριστῷ వ్యక్తపరచే సంబంధం
  choice: సంఘం తండ్రియైన దేవునిలోనూ ప్రభువైన యేసు మెస్సీయలోనూ ఉంది
  alternative: సంఘం తండ్రియైన దేవునికీ ప్రభువైన యేసు మెస్సీయకీ చెందింది
  rationale: ἐνను ‘లో’ అని నిలిపి, ఐక్యత, సంబంధం, ఉనికి పరిధి వంటి సాధ్యమైన భావాలను ఒకే వివరణకు కుదించలేదు. తండ్రి మరియు యేసు మెస్సీయతో ఉన్న సమాంతర సంబంధాన్ని కూడా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా-అభివాద శైలిని వాడాం. ‘యందు’, ‘కృపయు’ వంటి ప్రాచీన రూపాలను నివారించి ‘లోనూ’, ‘కృప, శాంతి’ వంటి ప్రస్తుత రూపాలను ఎంచుకున్నాం. మూలంలోని పంపినవారి సంయుక్త పరిచయం, గ్రహీత, దేవునిలో మరియు ప్రభువులో సంఘం ఉన్నదనే ఉద్వేగభరిత సంబంధం, చివరి ఆశీర్వచనం అన్నీ నిలిపాం.
