id: 1TH.1.8
reference: 1 Thessalonians 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀφ’ ὑμῶν γὰρ ἐξήχηται ὁ λόγος τοῦ κυρίου οὐ μόνον ἐν τῇ Μακεδονίᾳ ⸀καὶ Ἀχαΐᾳ, ⸀ἀλλ’ ἐν παντὶ τόπῳ ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεὸν ἐξελήλυθεν, ὥστε μὴ χρείαν ⸂ἔχειν ἡμᾶς⸃ λαλεῖν τι·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/008.yaml
  text: For from you the word of the Lord has sounded forth[a], not only in Macedonia and Achaia, but in every place your faith toward God has gone out, so that we have no need to say anything.
translation:
  language: te
  text: ఎందుకంటే, మీ దగ్గరనుండి ప్రభువు వాక్యం మకెదోనియాలోను అఖయాలోను మారుమోగడమే కాదు, ప్రతి చోటా దేవునిపట్ల మీ విశ్వాసం[a] వ్యాపించింది; అందువల్ల మేము ఏమీ చెప్పాల్సిన అవసరం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవునిలో మీ విశ్వాసం.” గ్రీకు పదబంధం మరింత అక్షరార్థంగా, “దేవునివైపు మీ విశ్వాసం” అని ఉంది.
    reason: πρὸς τὸν θεόν అనే పదబంధంలోని దిశాత్మక భావాన్ని మరియు సాధారణంగా వాడే ప్రత్యామ్నాయ అనువాదాన్ని చూపించడానికి.
lexical_decisions:
- source_word: ἐξήχηται
  choice: మారుమోగింది
  rationale: ఈ క్రియలోని బలమైన శ్రవణ రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది; సందేశం కేవలం వ్యాపించిందని చెప్పడం కంటే మూలంలోని ‘ధ్వనించడం/ప్రతిధ్వనించడం’ భావాన్ని కాపాడుతుంది.
- source_word: ὁ λόγος τοῦ κυρίου
  choice: ప్రభువు వాక్యం
  rationale: పౌలు రచనల్లో పరిచితమైన పదబంధాన్ని నిలుపుతూ, ఈ వాక్యం ప్రభువుకు చెందినదా లేక ప్రభువును గురించినదా అనే సమాస సంబంధాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: Μακεδονίᾳ καὶ Ἀχαΐᾳ
  choice: మాసిదోనియలోను అకయలోను
  rationale: ప్రాంతాల పేర్లకు ఆధునిక తెలుగు లిప్యంతరీకరణను ఉపయోగించి, ‘రెండింటిలోనూ’ అనే సముచ్చయ భావాన్ని ‘లోను … లోను’తో సహజంగా వ్యక్తం చేసింది.
- source_word: ἀλλ’ ἐν παντὶ τόπῳ
  choice: ప్రతి చోటా
  rationale: παντί యొక్క సమగ్ర భావాన్ని, τόπῳ యొక్క స్థలార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ πίστις ὑμῶν ἡ πρὸς τὸν θεόν
  choice: దేవునిపట్ల మీ విశ్వాసం
  rationale: πρὸς లోని దేవునివైపు దిశ లేదా సంబంధ భావాన్ని ‘పట్ల’తో కాపాడుతూ, తెలుగులో సహజంగా వినిపిస్తుంది. ‘దేవునిలో మీ విశ్వాసం’ అనే మరింత వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἐξελήλυθεν
  choice: వ్యాపించింది
  rationale: విశ్వాసం ప్రతి చోటికి వెళ్లి తెలిసినదైందనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది. అక్షరార్థమైన ‘బయటికి వెళ్లింది’ తెలుగులో ఈ సందర్భంలో అసహజంగా ఉంటుంది.
- source_word: ὥστε μὴ χρείαν ἔχειν ἡμᾶς
  choice: అందువల్ల మేము … అవసరం లేదు
  rationale: ὥστε సూచించే ఫలిత సంబంధాన్ని స్పష్టమైన, సహజమైన తెలుగు నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: λαλεῖν τι
  choice: ఏమీ చెప్పాల్సిన
  rationale: ‘ఏదైనా మాట్లాడడం’ అనే కఠిన అక్షరానువాదం బదులు, మూలార్థాన్ని సహజమైన తెలుగులో ఇస్తుంది.
theological_decisions:
- issue: πίστις పదం యొక్క అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఈ సందర్భంలో థెస్సలొనీకయుల దేవునివైపు ఉన్న నమ్మక స్పందనే ప్రధాన భావం; వారి విశ్వసనీయత ప్రధానంగా ఉద్దేశించబడలేదు. అందువల్ల ‘విశ్వాసం’ సందర్భానికి మరియు పౌలు వాడుకకు సరిపోతుంది.
- issue: πρὸς τὸν θεόν లోని సంబంధ భావం
  choice: దేవునిపట్ల
  alternative: దేవునిలో; దేవునివైపు
  rationale: ‘పట్ల’ అనేది గ్రీకు πρὸς లోని దిశాత్మక/సంబంధ భావాన్ని తెలుగు సహజత్వంతో నిలుపుతుంది; ‘దేవునిలో’ మరింత సాంప్రదాయబద్ధమైనదైనా ἐν అనే భావాన్ని దిగుమతి చేయవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘మారుమోగింది’తో మూలంలోని శ్రవణ రూపకాన్ని నిలిపి, ‘వ్యాపించింది’తో రెండో క్రియను సహజంగా అందించాం. గ్రీకు వాక్యంలో ‘ప్రభువు వాక్యం’ నుంచి ‘మీ విశ్వాసం’ వైపు జరిగే అంశ మార్పును తెలుగు విరామచిహ్నంతో స్పష్టపరిచాం; దాన్ని ఒకే అంశంగా కలిపివేయలేదు.
