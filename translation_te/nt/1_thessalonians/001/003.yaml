id: 1TH.1.3
reference: 1 Thessalonians 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μνημονεύοντες ὑμῶν τοῦ ἔργου τῆς πίστεως καὶ τοῦ κόπου τῆς ἀγάπης καὶ τῆς ὑπομονῆς τῆς ἐλπίδος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἔμπροσθεν τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/003.yaml
  text: remembering your work of faith and labor of love and steadfastness of hope in our Lord Jesus the Messiah before our God and Father[b][a],
translation:
  language: te
  text: మన దేవుడూ తండ్రియూ అయిన ఆయన సన్నిధిలో, మీ విశ్వాసం[a] వల్ల కలిగిన కార్యాన్ని, ప్రేమతో కూడిన ప్రయాసను, మన ప్రభువైన యేసు మెస్సీయ[b]పై మీకున్న నిరీక్షణ వల్ల కలిగిన నిలకడను జ్ఞాపకం చేసుకుంటూ ఉన్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విశ్వాసం’ అనే పదానికి ‘విశ్వసనీయత’ లేదా ‘నమ్మకం’ అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘క్రీస్తు’; ఇక్కడ అది బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: μνημονεύοντες
  choice: జ్ఞాపకం చేసుకుంటూ ఉన్నాం
  rationale: ఇది ముందటి వచనంలోని ప్రధాన క్రియతో కొనసాగుతున్న వర్తమాన కృదంతం. తెలుగులో సహజంగా ఉండేందుకు సందర్భం సూచించే బహువచన కర్తను క్రియలో వ్యక్తం చేసి, నిరంతర స్మరణ భావాన్ని నిలిపింది.
- source_word: ἔργου
  choice: కార్యాన్ని
  rationale: ἔργον యొక్క సాధారణ అర్థాన్ని ఇస్తూ, కార్యం–ప్రయాస–నిలకడ అనే పౌలు త్రయ నిర్మాణాన్ని కాపాడుతుంది.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: ఇక్కడ πίστις‌కు ప్రధానంగా ‘విశ్వాసం’ సరిపోతుంది. జనిటివ్ సంబంధాన్ని ‘వల్ల కలిగిన’ అని వ్యక్తం చేయడం ఆ కార్యం విశ్వాసం నుంచి ఉద్భవించిందనే సందర్భార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: κόπου
  choice: ప్రయాసను
  rationale: κόπος‌లోని శ్రమతో కూడిన కృషి భావాన్ని ‘ప్రయాస’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀγάπης
  choice: ప్రేమతో కూడిన
  rationale: ἀγάπηను ‘ప్రేమ’గా అనువదించి, ప్రయాసతో దాని సంబంధాన్ని అతిగా నిర్ధారించకుండా సహజంగా చూపుతుంది.
- source_word: ὑπομονῆς
  choice: నిలకడను
  rationale: ఒత్తిడి లేదా కష్టంలో ఓర్పుతో స్థిరంగా కొనసాగడాన్ని సూచించే ὑπομονή భావాన్ని ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐλπίδος
  choice: నిరీక్షణ
  rationale: దేవునిపై ఆధారపడిన నమ్మకమైన ఎదురుచూపు అనే పౌలు వాడుకకు ‘నిరీక్షణ’ ప్రామాణికమైన, సహజమైన పదం.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: మన ప్రభువైన యేసు మెస్సీయపై
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది. జనిటివ్‌ను నిరీక్షణ యొక్క లక్ష్యంగా ‘పై’ అనే విభక్తితో సహజ తెలుగులో వ్యక్తం చేసింది.
- source_word: ἔμπροσθεν
  choice: సన్నిధిలో
  rationale: దేవుని ఎదుట లేదా ఆయన సమక్షంలో అనే సంబంధార్థాన్ని గౌరవప్రదమైన సహజ తెలుగులో ఇస్తుంది.
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: మన దేవుడూ తండ్రీ అయిన ఆయన
  rationale: ఒకే వ్యక్తిని ‘మన దేవుడు’గానూ ‘తండ్రి’గానూ పేర్కొనే గ్రీకు నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: τῆς πίστεως లో πίστις భావం
  choice: విశ్వాసం
  alternative: విశ్వసనీయత; నమ్మకం
  rationale: ఈ సందర్భంలో విశ్వాసం నుంచి పుట్టే కార్యం అనే భావమే ఎక్కువ సంభావ్యం. అయినా πίστις‌కు ‘విశ్వసనీయత’ లేదా ‘నమ్మకం’ అనే భావఛాయలు సాధ్యమైనందున వాటిని పాదసూచికలో ఉంచింది.
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ యేసుకు సంబంధించిన బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ ప్రధాన పాఠ్యంలో ఉంది. తెలుగులో సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో ఇచ్చింది.
- issue: విశ్వాసం, ప్రేమ, నిరీక్షణలకు అనుసంధానమైన జనిటివ్‌ల భావం
  choice: కార్యం విశ్వాసం వల్ల కలిగినదిగా, ప్రయాస ప్రేమతో కూడినదిగా, నిలకడ నిరీక్షణ వల్ల కలిగినదిగా వ్యక్తీకరణ
  alternative: ‘విశ్వాసపు కార్యం, ప్రేమ యొక్క ప్రయాస, నిరీక్షణ యొక్క నిలకడ’ అనే మరింత రూపపరమైన అనువాదం
  rationale: గ్రీకు జనిటివ్‌లు మూలం, లక్షణం లేదా సంబంధాన్ని సూచించగలవు. తెలుగు ప్రధాన పాఠ్యం సందర్భంలో అత్యంత సహజమైన సంబంధాన్ని తెలియజేస్తుంది; అయితే ప్రేమ విషయంలో కారణార్థాన్ని బలవంతంగా నిర్ధారించకుండా ‘తో కూడిన’ అని ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా ఆరాధనా పఠనానికి తగిన గౌరవప్రద శైలిలో రూపొందించబడింది. మూలంలోని విశ్వాసం–ప్రేమ–నిరీక్షణ త్రయ నిర్మాణం మరియు కార్యం–ప్రయాస–నిలకడ సమాంతరత నిలుపబడ్డాయి.
