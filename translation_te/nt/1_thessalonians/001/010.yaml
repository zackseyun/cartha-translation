id: 1TH.1.10
reference: 1 Thessalonians 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀναμένειν τὸν υἱὸν αὐτοῦ ἐκ τῶν οὐρανῶν, ὃν ἤγειρεν ἐκ τῶν νεκρῶν, Ἰησοῦν τὸν ῥυόμενον ἡμᾶς ⸀ἐκ τῆς ὀργῆς τῆς ἐρχομένης.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/010.yaml
  text: and to wait for his Son from heaven[a], whom he raised from the dead—Jesus, who rescues us from the coming wrath.
translation:
  language: te
  text: మరియు పరలోకం నుండి వచ్చే ఆయన కుమారుని కోసం ఎదురుచూడడానికి—మృతులలోనుండి ఆయన లేపిన యేసు కోసం, రాబోయే ఉగ్రత నుండి మనలను రక్షించేవాని కోసం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాబోయే ఉగ్రత నుండి మనలను విడిపించేవాని కోసం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμένειν
  choice: ఎదురుచూడడానికి
  rationale: ఆశతో నిరీక్షించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఇది 9వ వచనంలోని దేవుని వైపు తిరగడం అనే భావానికి కొనసాగింపు.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: ఆయన కుమారుడు
  rationale: క్రీస్తుకు సంబంధించిన కుమారత్వ బిరుదును వివరణ చేర్చకుండా నేరుగా నిలుపుతుంది.
- source_word: ἐκ τῶν οὐρανῶν
  choice: పరలోకాల నుండి
  rationale: గ్రీకు బహువచన రూపాన్ని తెలుగులో సహజంగా నిలుపుతుంది; భావం యేసు పరలోకం నుండి రావడాన్ని సూచిస్తుంది.
- source_word: ὃν ἤγειρεν ἐκ τῶν νεκρῶν
  choice: మృతులలో నుండి దేవుడు లేపిన
  rationale: ἐκ τῶν νεκρῶν అనే వాక్యభాగంలోని ‘మృతుల మధ్యనుండి’ అనే భావాన్ని నిలుపుతుంది. తెలుగు వాక్యంలో కర్త స్పష్టత కోసం సందర్భానుసారంగా ‘దేవుడు’ అని పేర్కొనబడింది.
- source_word: Ἰησοῦν
  choice: యేసు
  rationale: తెలుగులో స్థిరపడిన ప్రామాణిక నామరూపం.
- source_word: τὸν ῥυόμενον
  choice: రక్షించేవాడు
  rationale: వర్తమాన కృదంతాన్ని యేసును రక్షకునిగా లక్షణీకరించే రూపంలో అందిస్తుంది; దాన్ని కేవలం భవిష్యత్ చర్యగా పరిమితం చేయదు.
- source_word: ἐκ τῆς ὀργῆς
  choice: ఉగ్రత నుండి
  rationale: ὀργήలోని దైవిక కోపం/ఉగ్రత భావాన్ని ‘తీర్పు’గా విస్తరించకుండా నిలుపుతుంది.
- source_word: τῆς ἐρχομένης
  choice: రాబోయే
  rationale: సమీపిస్తున్న లేదా భవిష్యత్తులో వచ్చే ఉగ్రత అనే అంత్యకాల దిశను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘రాబోయే ఉగ్రత’ స్వరూపం
  choice: ‘రాబోయే ఉగ్రత’ అని నిర్దిష్ట వివరణ లేకుండా నిలుపడం
  alternative: దానిని ప్రత్యేకంగా అంత్యకాల శ్రమగా లేదా తుదితీర్పులోని శిక్షగా నిర్వచించడం
  rationale: ఈ వచనం ఉగ్రత స్వరూపాన్ని మరింత సన్నగా నిర్వచించదు. అందువల్ల ఏ ప్రత్యేక అంత్యకాల పద్ధతినీ అనువాదంలోకి తీసుకురాకుండా గ్రీకు పదబంధంలోని theological tension‌ను నిలుపుతుంది.
- issue: ῥυόμενον అనే వర్తమాన కృదంతం యొక్క కాలబలం
  choice: ‘రక్షించేవాడు’
  alternative: ‘రక్షించబోయేవాడు’ లేదా ‘రక్షిస్తున్నవాడు’
  rationale: సందర్భంలోని ఉగ్రత భవిష్యత్ దిశ కలిగినదైనా, గ్రీకు రూపం యేసును రక్షించే వ్యక్తిగా లక్షణీకరిస్తుంది; కాబట్టి స్పష్టమైన భవిష్యత్ కాలాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని దీర్ఘ వాక్య సంబంధాన్ని డాష్‌తో స్పష్టంచేసి, ‘పరలోకాల’ అనే బహువచనాన్ని మరియు ‘ఉగ్రత’ అనే బలమైన పదాన్ని నిలుపుకున్నాం.
