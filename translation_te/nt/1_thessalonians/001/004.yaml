lexical_decisions:
- source_word: εἰδότες
  choice: మాకు తెలుసు
  rationale: గ్రీకులో ఇది ‘తెలుసుకొని/ఎరిగి’ అనే అసమాపక క్రియారూపం. ముందు వచనంతో కొనసాగుతున్న భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి సమాపక క్రియగా అనువదించాం.
- source_word: ἀδελφοὶ
  choice: సహోదరులారా
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం. పౌలు సంఘమంతటినీ ఉద్దేశించి ఈ సంబోధనను తరచుగా ఉపయోగిస్తాడు; ఆ విస్తృత ప్రయోగాన్ని పాదసూచికలో తెలిపాం.
- source_word: ἠγαπημένοι ὑπὸ θεοῦ
  choice: దేవుడు ప్రేమించిన
  rationale: పూర్తయిన క్రియ ఫలితంగా కొనసాగుతున్న స్థితిని సూచించే గ్రీకు పూర్ణకాల కర్మణి రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ప్రేమకు కర్త దేవుడనే విషయాన్ని నిలుపుతుంది.
- source_word: τὴν ἐκλογὴν ὑμῶν
  choice: మీరు ఎన్నుకోబడిన సంగతి
  rationale: ἐκλογή అనే నామవాచకానికి ‘ఎన్నిక’ అని నేరుగా అనువదిస్తే ఆధునిక తెలుగులో రాజకీయ ఎన్నిక అనే అపార్థం కలగవచ్చు. కాబట్టి దాని కర్మణి భావాన్ని స్పష్టంగా, సహజంగా తెలిపే పదబంధాన్ని ఎంచుకున్నాం; ఎవరు ఎన్నుకున్నారనే విషయాన్ని ఈ పదబంధంలో అదనంగా చేర్చలేదు.
theological_decisions:
- issue: సిద్ధాంతపరంగా వివాదాస్పదమైన ἐκλογή పదాన్ని అనువదించడం
  choice: మీరు ఎన్నుకోబడిన సంగతి
  alternative: మీ ఎన్నిక; దేవుడు మిమ్మల్ని ఎన్నుకోవడం
  rationale: విశ్వాసులు ఎన్నుకోబడ్డారని వచనం చెప్పేంతవరకే అనువాదం పరిమితమవుతుంది. ‘దేవుడు మిమ్మల్ని ఎన్నుకోవడం’ భావపరంగా సాధ్యమైనా, నామవాచకంతో దేవుని కర్తగా ఈ పదబంధంలో గ్రీకు పాఠం ప్రత్యక్షంగా పేర్కొనదు. విస్తృతమైన సిద్ధాంత వ్యవస్థను ఇందులోకి చేర్చకుండా మూలంలోని ఉద్వేగాన్ని నిలిపాం.
- issue: ἀδελφοί అనే పుంలింగ బహువచన సంబోధనలో సంఘమంతటినీ ఉద్దేశించే భావం
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా
  rationale: మూలంలోని పుంలింగ రూపాన్ని ప్రధాన పాఠంలో నిలిపాం. అయితే పౌలు వాడుకలో ఇది స్త్రీపురుషులందరితో కూడిన విశ్వాస సమాజాన్ని సాధారణంగా ఉద్దేశించగలదని పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలిని వాడాం. ‘మీ ఎన్నిక’ అనే పదబంధం రాజకీయ అర్థాన్ని సూచించే అవకాశం ఉన్నందున ‘మీరు ఎన్నుకోబడిన సంగతి’ అని ఇచ్చాం. సంబోధనలో మూలంలోని పుంలింగ రూపాన్ని నిలిపి, సమగ్ర సంఘాన్ని ఉద్దేశించే ప్రయోగాన్ని పాదసూచికలో వివరించాం.
