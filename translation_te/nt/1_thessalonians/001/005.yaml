id: 1TH.1.5
reference: 1 Thessalonians 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι τὸ εὐαγγέλιον ἡμῶν οὐκ ἐγενήθη εἰς ὑμᾶς ἐν λόγῳ μόνον ἀλλὰ καὶ ἐν δυνάμει καὶ ἐν πνεύματι ἁγίῳ ⸀καὶ πληροφορίᾳ πολλῇ, καθὼς οἴδατε οἷοι ἐγενήθημεν ⸀ἐν ὑμῖν δι’ ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/005.yaml
  text: because our gospel did not come to you in word only[a], but also in power and in the Holy Spirit and with great conviction[b], just as you know what kind of men we proved to be among you for your sake.
translation:
  language: te
  text: ఎందుకంటే మా సువార్త మీ దగ్గరకు కేవలం మాటలతోనే రాలేదు; శక్తితోనూ, పరిశుద్ధాత్మతోనూ, ఎంతో నిశ్చయంతోనూ[a] వచ్చింది. మీ కోసం మేము మీ మధ్య ఎలాంటివారమయ్యామో[b] మీకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎంతో పూర్ణ నిశ్చయంతోనూ”; ఈ నిశ్చయం ఎవరిలో ఉందో గ్రీకు పాఠం స్పష్టంగా చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎలాంటి మనుషులమని రుజువయ్యామో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐαγγέλιον
  choice: సువార్త
  rationale: పౌలు ప్రకటించిన రక్షణ సందేశానికి తెలుగులో స్థిరపడిన, సహజమైన పదం.
- source_word: ἐγενήθη εἰς ὑμᾶς
  choice: మీ దగ్గరకు ... రాలేదు
  rationale: గ్రీకు నుడికారాన్ని సందర్భానుగుణంగా సువార్త వారి వద్దకు చేరడంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν λόγῳ μόνον
  choice: కేవలం మాటలతోనే
  rationale: మౌఖిక ప్రకటన మాత్రమే అనే భావాన్ని, తరువాతి ‘శక్తితోనూ’ అనే వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐν δυνάμει
  choice: శక్తితోనూ
  rationale: ప్రకటనతో కూడిన ప్రభావశక్తిని సూచిస్తూ, వరుసగా వచ్చే ἐν పదబంధాల లయను తెలుగులో నిలుపుతుంది.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: పరిశుద్ధాత్మతోనూ
  rationale: ఇక్కడ మానవ ఆత్మ లేదా పవిత్రమైన వాతావరణం కాక దేవుని పరిశుద్ధాత్మ ఉద్దేశించబడ్డాడు.
- source_word: πληροφορίᾳ πολλῇ
  choice: ఎంతో దృఢనిశ్చయంతోనూ
  rationale: నిండైన నిశ్చయం లేదా బలమైన విశ్వాసం అనే అర్థపరిధిని సహజ తెలుగులో ఇస్తుంది; ఆ నిశ్చయం ఎవరిలో ఉందో మూలపాఠం నిర్దేశించనందున అనువాదమూ దాన్ని తెరిచి ఉంచుతుంది.
- source_word: καθὼς οἴδατε
  choice: మీకు తెలుసు
  rationale: థెస్సలొనీకయుల ప్రత్యక్ష పరిజ్ఞానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οἷοι ἐγενήθημεν
  choice: మేము ... ఎలాంటివారిగా ఉన్నామో
  rationale: పౌలు మరియు అతని సహచరుల స్వభావం, ప్రవర్తన ఏ రీతిగా ప్రత్యక్షమైందో తెలియజేస్తుంది; పదశః ‘ఎలాంటివారమయ్యామో’ కంటే ఇది సహజంగా ఉంటుంది.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: వారి సమాజంలో మిషనరీలు గడిపిన జీవితం, ప్రవర్తనను సూచిస్తుంది.
- source_word: δι’ ὑμᾶς
  choice: మీ కోసం
  rationale: διά + accusative ఇక్కడ వారి ప్రయోజనం లేదా మేలు కోసం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πνεύματι ἁγίῳ యొక్క సూచన
  choice: పరిశుద్ధాత్మ
  alternative: పవిత్రమైన ఆత్మ లేదా ఆధ్యాత్మిక శక్తి
  rationale: పౌలు వాడుకలోనూ, మాట మాత్రమే కాక దైవిక ప్రభావంతో వచ్చిన ప్రకటన అనే సందర్భంలోనూ ఇది దేవుని పరిశుద్ధాత్మనే సూచిస్తుంది.
- issue: πληροφορίᾳ πολλῇలో నిశ్చయానికి కర్త ఎవరు?
  choice: ఎంతో దృఢనిశ్చయంతో
  alternative: పూర్ణ నిశ్చయంతో; గొప్ప ఒప్పింపుతో
  rationale: గ్రీకు పదబంధం ఆ నిశ్చయం ప్రకటించినవారిలోనా, విన్నవారిలోనా, లేక ప్రకటన వచ్చిన మొత్తం తీరులోనా ఉందో స్పష్టంగా చెప్పదు; ప్రధాన పాఠం ఆ విస్తృతిని కుదించదు.
- issue: οἷοι ἐγενήθημεν యొక్క భావం
  choice: ఎలాంటివారిగా ఉన్నామో
  alternative: ఎలాంటివారమయ్యామో; ఎలాంటి మనుషులమని రుజువయ్యామో
  rationale: ఈ మాట పౌలు మరియు అతని సహచరుల వ్యక్తిత్వం, వారి మధ్య కనబడిన తీరును సూచిస్తుంది. ‘ఉన్నామో’ సహజ తెలుగులో సందర్భార్థాన్ని ఇస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచడం ద్వారా γίνομαι భావాన్ని చూపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘తోనూ’ పునరుక్తి గ్రీకు మూలంలోని సమాంతర లయను నిలుపుతుంది. ‘మీ కోసం’ అనే భాగాన్ని రెండవ వాక్యారంభంలో ఉంచి దాని ప్రయోజనార్థాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేశాం.
