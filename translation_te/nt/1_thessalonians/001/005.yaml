- from: ఎందుకంటే మా సువార్త మీ దగ్గరకు కేవలం మాటలతోనే రాలేదు; శక్తితోనూ, పరిశుద్ధాత్మతోనూ, ఎంతో దృఢనిశ్చయంతోనూ[a] వచ్చింది. మీ కోసం మేము మీ మధ్య ఎలాంటివారిగా ఉన్నామో[b] మీకు తెలుసు.
  to: ఎందుకంటే మా సువార్త మీ దగ్గరకు కేవలం మాటలతోనే రాలేదు; శక్తితోనూ, పరిశుద్ధాత్మతోనూ, ఎంతో నిశ్చయంతోనూ[a] వచ్చింది. మీ కోసం మేము మీ మధ్య ఎలాంటివారమయ్యామో[b] మీకు తెలుసు.
