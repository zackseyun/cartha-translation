id: 1TH.1.9
reference: 1 Thessalonians 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ περὶ ἡμῶν ἀπαγγέλλουσιν ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς, καὶ πῶς ἐπεστρέψατε πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων δουλεύειν θεῷ ζῶντι καὶ ἀληθινῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/001/009.yaml
  text: For they themselves report about us what kind of reception we had among you[a], and how you turned to God from idols to serve the living and true God[c][b],
translation:
  language: te
  text: 'ఎందుకంటే వారే మా గురించి చెబుతున్నారు: మేము మీ దగ్గరకు వచ్చిన తీరు ఎలాంటిదో, అలాగే సజీవుడూ నిజమైనవాడూ అయిన దేవునికి సేవ చేయడానికి మీరు విగ్రహాలనుండి దేవుని వైపు ఎలా తిరిగారో.[a][c][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మేము మీ దగ్గరకు ఎలాంటి రాక కలిగించామో.’ గ్రీకు పదబంధం పౌలు బృందం వారి దగ్గరకు వచ్చిన తీరును, దాని ప్రభావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీరు విగ్రహాలనుండి దేవుని వైపు ఎలా పరివర్తన చెందారో.’
    reason: alternative_reading
  - marker: c
    text: ‘సజీవుడూ నిజమైనవాడూ అయిన దేవుడు’ అనే మాట దేవుణ్ణి జీవంలేని విగ్రహాలకు భిన్నంగా చూపిస్తుంది; యిర్మీయా 10:10 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: వారే
  rationale: నివేదిక పౌలు ప్రేరేపించడం వల్ల కాకుండా ఇతరుల నుంచే వస్తోందనే గ్రీకు సర్వనామంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἀπαγγέλλουσιν
  choice: చెబుతున్నారు
  rationale: ప్రస్తుతం కొనసాగుతున్న సమాచార ప్రసారాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁποίαν εἴσοδον ἔσχομεν πρὸς ὑμᾶς
  choice: మీ దగ్గరకు మేము వచ్చినప్పుడు మీరు మమ్మల్ని ఎలా స్వీకరించారో
  rationale: అక్షరార్థంగా ‘ఎలాంటి ప్రవేశం/రాక’ అయినప్పటికీ, సందర్భంలో పౌలు బృందం రాకకు లభించిన స్వీకరణను సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో సంబంధార్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πῶς ἐπεστρέψατε
  choice: ఎలా తిరిగారో
  rationale: మారుమనస్సు లేదా మతమార్పు అనే సాంకేతిక పదాన్ని ముందుగానే రుద్దకుండా, దిశ మార్చుకోవడమనే మూల రూపకాన్ని కాపాడుతుంది.
- source_word: πρὸς τὸν θεὸν ἀπὸ τῶν εἰδώλων
  choice: విగ్రహాలను విడిచిపెట్టి దేవుని వైపు
  rationale: ἀπό మరియు πρός సూచించే మూలస్థానం, గమ్యం అనే రెండు దిశలనూ స్పష్టమైన తెలుగులో నిలుపుతుంది.
- source_word: εἰδώλων
  choice: విగ్రహాలు
  rationale: ఆరాధనకు సంబంధించిన ప్రతిమలు లేదా దేవతా రూపాలను సూచించే ప్రామాణికమైన తెలుగు పదం.
- source_word: δουλεύειν
  choice: సేవించడానికి
  rationale: దాసత్వ పదక్షేత్రానికి చెందినప్పటికీ, ఇక్కడ దేవునిపట్ల అంకితమైన సేవను సూచిస్తుంది; ‘బానిసగా ఉండడానికి’ అనడం సందర్భానికి మించిన కఠినతను కలిగిస్తుంది.
- source_word: θεῷ ζῶντι καὶ ἀληθινῷ
  choice: సజీవుడూ సత్యవంతుడూ అయిన దేవుణ్ణి
  rationale: జీవంలేని విగ్రహాలకు విరుద్ధంగా దేవుడు జీవించేవాడనీ నిజమైనవాడనీ తెలిపే రెండు విశేషణాలను సహజంగా నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యానికి ఈ వచనం ఆధార వివరణగా అనుసంధానమవుతున్నట్లు స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ἐπεστρέψατε లోని మార్పు/పరివర్తన భావం
  choice: దేవుని వైపు ఎలా తిరిగారో
  alternative: దేవుని వైపు ఎలా మార్చబడ్డారో; దేవుని వైపు ఎలా మతం మారారో
  rationale: క్రియలో ఉన్న ‘తిరగడం’ అనే రూపకాన్నీ కర్తృవాచక రూపాన్నీ నిలుపుతూ, పరివర్తనలో దైవ-మానవ పాత్రలపై వచనం చెప్పనిదాన్ని చేర్చదు.
- issue: δουλεύειν ద్వారా దేవునితో సంబంధం
  choice: సేవించడానికి
  alternative: దేవునికి బానిసలుగా ఉండడానికి; ఆరాధించడానికి
  rationale: ఈ సందర్భంలో విగ్రహాలనుంచి దేవునికి మారిన అంకిత సేవ ప్రధాన భావం. ‘సేవించడం’ దాసత్వ పదక్షేత్రాన్ని పూర్తిగా కఠినతరం చేయకుండానే సముచితంగా వ్యక్తపరుస్తుంది.
- issue: ζῶντι καὶ ἀληθινῷ యొక్క వ్యత్యాస బలం
  choice: సజీవుడూ సత్యవంతుడూ అయిన దేవుడు
  alternative: జీవముగల నిజమైన దేవుడు
  rationale: దేవుని జీవత్వం మరియు సత్యత్వం రెండింటినీ విగ్రహాలతో ఉన్న అంతర్లీన వ్యత్యాసంతో కాపాడుతుంది; ‘సత్యవంతుడు’ దేవుని యథార్థతతో పాటు విశ్వసనీయత భావాన్నీ తెరిచి ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘వారే’ ద్వారా మూలంలోని ఉద్ఘాటనను, ‘తిరిగారు’ ద్వారా మార్పు రూపకాన్ని కాపాడాం. ప్రధాన వాక్యంలో స్వీకరణ భావాన్ని సహజీకరించి, అక్షరార్థమైన ‘రాక’ను పాదసూచికలో ఇచ్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
