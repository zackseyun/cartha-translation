id: 1TH.2.9
reference: 1 Thessalonians 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μνημονεύετε γάρ, ἀδελφοί, τὸν κόπον ἡμῶν καὶ τὸν μόχθον· ⸀νυκτὸς καὶ ἡμέρας ἐργαζόμενοι πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν ἐκηρύξαμεν εἰς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/009.yaml
  text: 'For you remember[a], brothers, our labor and hardship: working night and day so as not to burden any of you, we proclaimed to you the gospel of God.'
translation:
  language: te
  text: ఎందుకంటే, సోదరులారా,[a] మా ప్రయాసను, కష్టాన్ని మీరు జ్ఞాపకం చేసుకుంటున్నారు. మీలో ఎవరికీ భారంగా ఉండకూడదనే ఉద్దేశంతో రాత్రింబగళ్లు పనిచేస్తూ, దేవుని సువార్తను మీకు ప్రకటించాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సోదర సోదరీమణులారా”; గ్రీకులో “సోదరులు” అని ఉంది; అది సంఘమంతటినీ సమ్మిళితంగా ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μνημονεύετε
  choice: మీరు జ్ఞాపకం చేసుకుంటున్నారు కదా
  rationale: వర్తమానకాల, ద్వితీయ పురుష బహువచన సూచనార్థక రూపాన్ని ఆజ్ఞగా కాక, పాఠకుల జ్ఞాపకాన్ని ధృవీకరిస్తూ చేసే విజ్ఞాపనగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పుంలింగ బహువచన సంబోధనను ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భంలో సంఘమంతా ఉద్దేశించబడి ఉండవచ్చని పాదటిప్పణి తెలియజేస్తుంది.
- source_word: τὸν κόπον ἡμῶν καὶ τὸν μόχθον
  choice: మా ప్రయాసను, కష్టాన్ని
  rationale: κόποςలోని శ్రమతో కూడిన ప్రయత్నాన్ని ‘ప్రయాస’, μόχθοςలోని దుర్భరమైన కష్టాన్ని ‘కష్టం’గా వేరు చేస్తూ జంట పదాల బలాన్ని కాపాడుతుంది.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: రాత్రింబగళ్లు
  rationale: నిరంతరమైన కృషిని సూచించే మూలభాషా నుడికారానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: ἐργαζόμενοι
  choice: పనిచేస్తూ
  rationale: ప్రకటన సేవతోపాటు వారు చేసిన నిరంతర పనిని సూచించే సహజమైన క్రియ; ముందున్న ‘ప్రయాస’తో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: πρὸς τὸ μὴ ἐπιβαρῆσαί τινα ὑμῶν
  choice: మీలో ఎవరికీ భారంగా ఉండకూడదని
  rationale: ఉద్దేశాన్ని స్పష్టంగా వ్యక్తం చేస్తూ, ఆర్థిక లేదా ఆచరణాత్మక భారం మోపకూడదనే భావాన్ని అతి వివరణ లేకుండా నిలుపుతుంది.
- source_word: ἐκηρύξαμεν εἰς ὑμᾶς
  choice: మీకు ప్రకటించాము
  rationale: κηρύσσωలోని బహిరంగంగా ప్రకటించే భావాన్ని ‘ప్రకటించాము’ నిలుపుతుంది; εἰς ὑμᾶς యొక్క దిశాత్మక భావాన్ని ‘మీకు’ సహజంగా అందిస్తుంది.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: దేవుని సువార్తను
  rationale: తెలుగులో స్థిరపడిన ‘సువార్త’ను వాడి, τοῦ θεοῦలో మూలం, స్వామ్యం లేదా విషయార్థం ఏది ప్రధానమో తేల్చకుండా షష్ఠీ సంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ἀδελφοί అనే సంబోధనలో సమ్మిళిత భావం
  choice: ప్రధాన పాఠ్యంలో ‘సోదరులారా’
  alternative: ‘సోదర సోదరీమణులారా’
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, అది సందర్భానుసారంగా సంఘంలోని స్త్రీపురుషులందరినీ ఉద్దేశించి ఉండవచ్చనే భావాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘కదా’ పౌలు పాఠకుల జ్ఞాపకాన్ని ఆధారంగా చేసుకొని చెప్పే ధృవీకరణాత్మక విజ్ఞాపనను చూపుతుంది; వాక్యాన్ని ఆజ్ఞగా మార్చదు.
