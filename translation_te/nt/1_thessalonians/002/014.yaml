id: 1TH.2.14
reference: 1 Thessalonians 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμεῖς γὰρ μιμηταὶ ἐγενήθητε, ἀδελφοί, τῶν ἐκκλησιῶν τοῦ θεοῦ τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ ἐν Χριστῷ Ἰησοῦ, ὅτι τὰ αὐτὰ ἐπάθετε καὶ ὑμεῖς ὑπὸ τῶν ἰδίων συμφυλετῶν καθὼς καὶ αὐτοὶ ὑπὸ τῶν Ἰουδαίων
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/014.yaml
  text: For you became imitators[a], brothers, of the churches of God that are in Judea in Messiah Jesus, because you also suffered the same things from your own countrymen[c][b], just as they did from the Jews.
translation:
  language: te
  text: సోదరులారా, మెస్సీయ అయిన యేసులో ఉన్న యూదయలోని దేవుని సంఘాలను మీరు అనుకరించేవారయ్యారు. ఎందుకంటే, వారు యూదుల[b] చేత బాధలు అనుభవించినట్లే, మీరు కూడా మీ సొంత జాతివారి[a] చేత అవే బాధలు అనుభవించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ సొంత స్వదేశీయుల చేత.” గ్రీకు పదం ఒకే జాతి, ప్రజా సమూహం లేదా దేశానికి చెందినవారిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “యూదయవారి చేత.” గ్రీకు పదం సందర్భాన్ని బట్టి యూదులను లేదా యూదయ ప్రాంతవాసులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μιμηταὶ ἐγενήθητε
  choice: అనుకరించేవారయ్యారు
  rationale: μιμηταίలోని స్పష్టమైన అనుకరణ భావాన్నీ, ἐγενήθητεలోని ‘అయ్యారు’ అనే మార్పు భావాన్నీ నిలుపుతుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: సంఘాన్ని నేరుగా సంబోధించే గ్రీకు పుంలింగ బహువచనానికి సహజమైన తెలుగు రూపం; సందర్భంలో ఇది సంఘ సభ్యులందరినీ ఉద్దేశించగలదు.
- source_word: ἐκκλησιῶν τοῦ θεοῦ
  choice: దేవుని సంఘాలను
  rationale: పౌలు పత్రికల సంఘసంబంధ సందర్భంలో ἐκκλησίαιకి ‘సంఘాలు’ సహజమైన, స్థిరమైన తెలుగు పదం.
- source_word: τῶν οὐσῶν ἐν τῇ Ἰουδαίᾳ
  choice: యూదయలో ... ఉన్న
  rationale: సంఘాల భౌగోళిక స్థానాన్ని తెలిపే కృదంత పదబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ అయిన యేసులో
  rationale: Χριστόςలోని అభిషిక్తుడైన మెస్సీయ అనే బిరుదు భావాన్ని స్పష్టంగా ఉంచుతూ, ἐν అనే పౌలు వాడుకను ‘లో’తో నిలుపుతుంది.
- source_word: τὰ αὐτὰ ἐπάθετε
  choice: అవే బాధలు అనుభవించారు
  rationale: πάσχωలోని బాధను అనుభవించడం అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, τὰ αὐτάలోని పోలికను ‘అవే’తో నిలుపుతుంది.
- source_word: τῶν ἰδίων συμφυλετῶν
  choice: మీ సొంత జాతివారి చేత
  rationale: ἰδίωνలోని ‘సొంత’ అనే నొక్కిచెప్పే భావాన్నీ, συμφυλέταιలోని ఒకే ప్రజా లేదా జాతి సమూహానికి చెందినవారు అనే భావాన్నీ కాపాడుతుంది.
- source_word: τῶν Ἰουδαίων
  choice: యూదుల చేత
  rationale: ఈ సందర్భంలో సాధారణ జాతి-మతపరమైన అర్థాన్ని ఇస్తుంది; ‘యూదయవారు’ అనే భౌగోళిక అర్థసాధ్యతను పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: Χριστῷను బిరుదుగా లేదా పేరులో భాగంలా అనువదించడం
  choice: మెస్సీయ అయిన యేసులో
  alternative: క్రీస్తు యేసులో
  rationale: Χριστόςకు ఇక్కడ బిరుదు భావం ఇంకా స్పష్టంగా ఉంది. ‘మెస్సీయ అయిన’ అనేది ఆ అర్థాన్ని తెలుగులో తెలియజేస్తుంది; స్థిరపడిన ‘క్రీస్తు’ రూపాన్ని ప్రత్యామ్నాయంగా గుర్తించవచ్చు.
- issue: τῶν Ἰουδαίων సూచించే వర్గం యొక్క పరిధి
  choice: యూదుల చేత
  alternative: యూదయవారి చేత
  rationale: వాక్యం బాధ కలిగించిన నిర్దిష్ట వ్యక్తులను సూచిస్తుంది; యూదులందరినీ సార్వత్రికంగా నిందిస్తున్నట్లు విస్తరించదు. గ్రీకు పదంలోని భౌగోళిక ప్రత్యామ్నాయ అర్థాన్ని పాదటిప్పణిలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని కారణ సంబంధాన్ని ‘ఎందుకంటే’తో, రెండు సంఘాల బాధల మధ్య సమాంతరాన్ని ‘అవే ... అనుభవించారు’తో స్పష్టంగా ఉంచాం.
