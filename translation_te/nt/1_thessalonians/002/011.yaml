  text: just as you know[a], we dealt with each one of you as a father with his own children
translation:
  language: te
  text: మీకు తెలిసినట్లే, మేము మీలో ఒక్కొక్కరితో ఒక తండ్రి తన సొంత పిల్లలతో వ్యవహరించినట్లే వ్యవహరించాము.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάπερ
  choice: తెలిసినట్లే
  rationale: ఉపమాన భావాన్ని ‘-నట్లే’ సహజంగా తెలియజేస్తుంది; οἴδατεతో కలిపి తెలుగులో సరళమైన నిర్మాణం అవుతుంది.
- source_word: οἴδατε
  choice: మీకు తెలిసిన
  rationale: రూపంలో perfect అయిన οἶδα ఇక్కడ వర్తమానార్థంలో ‘తెలుసు’ అని వాడబడింది.
- source_word: ὡς (first)
  choice: అని/ఎలా అనే భావం వాక్య నిర్మాణంలో అంతర్భూతం
  rationale: తెలుగులో ‘మీకు తెలిసినట్లే’ అనే నిర్మాణం, వారు ఎరిగిన విషయాన్ని పరిచయం చేస్తుంది; ప్రత్యేకంగా ‘అని’ చేర్చడం అవసరం లేదు.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: మీలో ప్రతి ఒక్కరితో
  rationale: ఒక్కొక్క వ్యక్తిపట్ల చూపిన శ్రద్ధను బలంగా నిలుపుతుంది; సందర్భం కోరే సంబంధార్థానికి ‘తో’ ఉపయోగించబడింది.
- source_word: ὡς (second)
  choice: వంటి విధంగా / ...ట్లు
  rationale: తండ్రి ప్రవర్తనతో పోలికను సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: πατὴρ
  choice: ఒక తండ్రి
  rationale: నిర్దిష్ట తండ్రిని కాక, తండ్రికి సహజమైన పాత్రను ఉపమానంగా సూచిస్తుంది.
- source_word: τέκνα
  choice: పిల్లలు
  rationale: లింగాన్ని ప్రత్యేకంగా నిర్దేశించని విస్తృత బంధుత్వ పదమైన τέκναకు సహజమైన సమానార్థకం.
- source_word: ἑαυτοῦ
  choice: తన సొంత
  rationale: తండ్రికి చెందిన స్వంత పిల్లలనే సూచించే reflexive ఉద్ఘాటనను నిలుపుతుంది.
- source_word: '[elliptical verbal idea from context]'
  choice: వ్యవహరించాము
  rationale: గ్రీకు వాక్యభాగంలో క్రియ స్పష్టంగా లేక చుట్టుపక్కల వాక్యంపై ఆధారపడుతుంది. ‘వ్యవహరించాము’ అనేది తరువాతి ప్రోత్సాహం, ఆదరణ, బతిమాలడం వంటి చర్యలను ఒక్కదానికి కుదించకుండా విస్తృతంగా సూచిస్తుంది.
theological_decisions:
- issue: అధ్యాహారంగా ఉన్న క్రియాభావాన్ని పూరించడం
  choice: ‘మీలో ప్రతి ఒక్కరితో ... వ్యవహరించాము’ అనే విస్తృత క్రియను చేర్చడం
  alternative: వాక్యాన్ని గ్రీకు మాదిరిగా అసంపూర్ణంగా ఉంచడం, లేదా ‘ప్రోత్సహించాము’ వంటి ఒక నిర్దిష్ట క్రియను చేర్చడం
  rationale: మూలంలోని ఈ భాగం స్వతంత్రంగా సంపూర్ణ వాక్యం కాదు; సందర్భం నుంచి క్రియాభావాన్ని పొందుతుంది. విస్తృతమైన ‘వ్యవహరించాము’ తెలుగు వాక్యాన్ని సంపూర్ణం చేస్తూనే, తరువాత చెప్పబడే అనేక కాపరి చర్యలలో ఒక్కదానికే భావాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని తండ్రి–పిల్లల కుటుంబ రూపకాన్ని, వ్యక్తిగత శ్రద్ధను, అలాగే గ్రీకు వాక్యంలోని అధ్యాహార స్వభావాన్ని పాదటిప్పణి ద్వారా నిలుపుకుంది.
