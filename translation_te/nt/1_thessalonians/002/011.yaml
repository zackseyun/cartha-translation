  terminology: ‘ఒక తండ్రి,’ ‘తన సొంత పిల్లలు,’ and ‘మీలో ఒక్కొక్కరు’ appropriately preserve the familial comparison, reflexive emphasis, and individual focus. No doctrinal terminology is at issue.
