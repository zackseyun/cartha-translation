id: 1TH.2.13
reference: 1 Thessalonians 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Καὶ διὰ τοῦτο καὶ ἡμεῖς εὐχαριστοῦμεν τῷ θεῷ ἀδιαλείπτως, ὅτι παραλαβόντες λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ ἐδέξασθε οὐ λόγον ἀνθρώπων ἀλλὰ καθὼς ⸂ἀληθῶς ἐστὶν⸃ λόγον θεοῦ, ὃς καὶ ἐνεργεῖται ἐν ὑμῖν τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/013.yaml
  text: And because of this we also thank God continually[a], that when you received the word of God that you heard from us, you accepted it not as the word of men but, as it truly is, the word of God[c][b], which is also at work in you who believe.
translation:
  language: te
  text: 'ఈ కారణంగానే మేము కూడా దేవునికి ఎడతెగక కృతజ్ఞతలు చెల్లిస్తున్నాం: మీరు మా ద్వారా విన్న దేవుని వాక్యాన్ని స్వీకరించినప్పుడు, దానిని మనుషుల మాటగా కాక, నిజంగా ఏదైతే ఉందో అలాగే దేవుని వాక్యంగా అంగీకరించారు.[a] ఆ వాక్యం కూడా విశ్వసిస్తున్న మీలో పనిచేస్తోంది.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మీరు మా ద్వారా విన్న దేవుని సందేశాన్ని స్వీకరించినప్పుడు, దానిని మానవ సందేశంగా కాక, నిజంగా ఏదైతే ఉందో అలాగే దేవుని సందేశంగా అంగీకరించారు.” గ్రీకు పదబంధం సంక్షిప్తంగా ఉండి, సహజ తెలుగులో ఒకటి కంటే ఎక్కువ విధాలుగా విప్పవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: “ఆ వాక్యం” అని అనువదించిన సంబంధసర్వనామాన్ని దేవునికి అన్వయించి, “విశ్వసిస్తున్న మీలో ఆయనే కూడా పనిచేస్తున్నాడు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందుకే
  rationale: ముందటి సందర్భంతో ఉన్న కారణ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా చూపిస్తుంది.
- source_word: εὐχαριστοῦμεν ... ἀδιαλείπτως
  choice: దేవునికి ఎడతెగకుండా కృతజ్ఞతలు చెల్లిస్తున్నాం
  rationale: వర్తమానకాలంలోని కొనసాగుతున్న క్రియను, ἀδιαλείπτως యొక్క నిరంతర భావాన్ని నిలుపుతుంది.
- source_word: λόγον ἀκοῆς παρ’ ἡμῶν τοῦ θεοῦ
  choice: మీరు మా ద్వారా విన్న దేవుని వాక్యాన్ని
  rationale: సంక్షిప్తమైన గ్రీకు షష్ఠీ నిర్మాణాన్ని సహజంగా విప్పి, వాక్యం దేవునిదని మరియు అది అపొస్తలుల ద్వారా వినబడిందని రెండింటినీ కాపాడుతుంది.
- source_word: παραλαβόντες
  choice: స్వీకరించినప్పుడు
  rationale: అప్పగించబడిన సందేశాన్ని పొందడం అనే భావాన్ని కాలసూచక ఉపవాక్యంగా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐδέξασθε
  choice: అంగీకరించారు
  rationale: కేవలం వినడం లేదా పొందడం కంటే అనుకూలంగా స్వీకరించిన భావాన్ని తెలియజేస్తూ, παραλαβόντεςతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: οὐ λόγον ἀνθρώπων
  choice: మనుషుల మాటగా కాకుండా
  rationale: లింగ-సమగ్రంగా ఉండే సహజ తెలుగు ప్రయోగంతో గ్రీకు పదబంధంలోని గుణాత్మక భావాన్ని తెలియజేస్తుంది.
- source_word: ἀλλὰ καθὼς ἀληθῶς ἐστὶν λόγον θεοῦ
  choice: అది నిజంగా ఉన్నట్టుగానే దేవుని వాక్యంగా
  rationale: వాస్తవత్వాన్ని నొక్కిచెప్పే మధ్యస్థ వ్యాఖ్యను మరియు మనుషుల మాట—దేవుని వాక్యం అనే వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ἐνεργεῖται
  choice: పనిచేస్తోంది
  rationale: విశ్వాసులలో కొనసాగుతున్న కార్యసామర్థ్యాన్ని సహజంగా తెలియజేస్తుంది; మధ్యమ లేదా కర్మణి సూక్ష్మభేదాన్ని అతిగా నిర్ధారించదు.
- source_word: τοῖς πιστεύουσιν
  choice: విశ్వసిస్తున్న మీలో
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న లేదా లక్షణాత్మక విశ్వాస భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ὃς అనే సంబంధసర్వనామం దేనిని సూచిస్తుంది
  choice: ‘దేవుని వాక్యం’ను సూచించేలా ‘ఆ వాక్యమే ... పనిచేస్తోంది’
  alternative: దేవునిని సూచించేలా ‘ఆయనే ... పనిచేస్తున్నాడు’
  rationale: ὃς పుంలింగ ఏకవచన λόγοςతో సరిపోతుంది; వెంటనే దాని తర్వాత రావడం వల్ల ‘వాక్యం’ అత్యంత సహజ పూర్వపదం. అయితే θεός కూడా వ్యాకరణపరంగా సాధ్యమైనందున ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: అపొస్తలుల ప్రకటనలో ‘దేవుని వాక్యం’ భావం
  choice: దేవుని వాక్యం
  alternative: దేవుని సందేశం
  rationale: λόγοςను ‘వాక్యం’గా అనువదించడం ద్వారా మనుషుల మాటతో ఉన్న ప్రత్యక్ష అలంకారాత్మక మరియు ధార్మిక వ్యత్యాసం నిలుస్తుంది; వచనం చెప్పేదానికంటే విస్తృతమైన ప్రేరణ సిద్ధాంతాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వచనానికి తగిన గంభీరతతో రూపొందించబడింది. ‘వాక్యం’ అనే బైబిలీయ పదాన్ని నిలుపుతూ, వాక్యనిర్మాణాన్ని మాట్లాడే తెలుగుకు దగ్గరగా ఉంచాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
