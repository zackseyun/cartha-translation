id: 1TH.2.4
reference: 1 Thessalonians 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς δεδοκιμάσμεθα ὑπὸ τοῦ θεοῦ πιστευθῆναι τὸ εὐαγγέλιον οὕτως λαλοῦμεν, οὐχ ὡς ἀνθρώποις ἀρέσκοντες ἀλλὰ ⸀θεῷ τῷ δοκιμάζοντι τὰς καρδίας ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/004.yaml
  text: But just as we have been approved by God to be entrusted with the gospel[a], so we speak—not as pleasing people, but God, who tests our hearts.
translation:
  language: te
  text: కాని సువార్తను మాకు అప్పగించేందుకు దేవుడు మమ్మల్ని పరీక్షించి ఆమోదించినట్లే మేము మాట్లాడుతున్నాం—మనుషులకు నచ్చేలా కాదు, మా హృదయాలను పరీక్షించే దేవునికి నచ్చేలా[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకులో ‘మెప్పించేవారిగా’ అనే కృదంతం మనుషుల విషయంలో మాత్రమే స్పష్టంగా ఉంది; దేవుని విషయంలో అది అధ్యాహారంగా ఉంది. అక్షరార్థంగా, “మనుషులను మెప్పించేవారిగా కాదు, దేవుణ్ణి [మెప్పించేవారిగా].”
    reason: మూలంలోని సంక్షిప్త వ్యాకరణ నిర్మాణాన్ని, రెండవ భాగంలో అధ్యాహారమైన కృదంతాన్ని స్పష్టంగా తెలియజేసే పదబంధ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: δεδοκιμάσμεθα
  choice: మమ్మల్ని పరీక్షించి ఆమోదించిన
  rationale: పూర్తయిన పరీక్ష ఫలితంగా కొనసాగుతున్న ఆమోద స్థితిని సూచించే పరిపూర్ణ కర్మణి రూపాన్ని ‘పరీక్షించి ఆమోదించిన’ స్పష్టంగా తెలియజేస్తుంది; కేవలం ‘పరీక్షించిన’ అని చెప్పడం కన్నా మూలంలోని ఫలిత భావాన్ని కాపాడుతుంది.
- source_word: πιστευθῆναι τὸ εὐαγγέλιον
  choice: సువార్తను మాకు అప్పగించడానికి
  rationale: ఇక్కడ భావం సువార్తను నమ్మడం కాదు, దాని బాధ్యతను వారికి అప్పగించడం. తెలుగు వాక్య నిర్మాణంలో ‘మాకు అప్పగించడానికి’ సహజంగా ఉండి కర్మణి భావాన్ని సందర్భానుగుణంగా అందిస్తుంది.
- source_word: τὸ εὐαγγέλιον
  choice: సువార్త
  rationale: పౌలు రచనల సందర్భంలో స్థిరపడిన, భావసాంద్రతను నిలుపుకునే సహజ తెలుగు పదం.
- source_word: οὕτως λαλοῦμεν
  choice: అలాగే మేము మాట్లాడుతున్నాం
  rationale: దేవుని ముందస్తు పరీక్ష, ఆమోదం, అప్పగింతలకు వారి మాటల విధానాన్ని అనుసంధానించే οὕτως భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: οὐχ ὡς ἀνθρώποις ἀρέσκοντες
  choice: మనుషులకు నచ్చేలా కాదు
  rationale: మనుషుల మెప్పును లక్ష్యంగా చేసుకొని మాట్లాడడం లేదనే భావాన్ని ఆధునిక సాధారణ తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀλλὰ θεῷ
  choice: దేవునికి నచ్చేలా
  rationale: గ్రీకులో రెండో భాగంలో ‘నచ్చడం/సంతోషపెట్టడం’ అనే క్రియాభావం అధ్యాహారంగా ఉంది. తెలుగు వ్యాకరణంలో స్పష్టత, సహజత్వం కోసం దానిని పునరుక్తి చేసి, మూలంలోని సంక్షిప్త నిర్మాణాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: τῷ δοκιμάζοντι
  choice: పరీక్షించే
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న పరిశీలన భావాన్ని నిలుపుతుంది; అంతేకాక, వచనం మొదట్లోని δοκιμάζω పదంతో ఉన్న పదసంబంధాన్ని కూడా కాపాడుతుంది.
- source_word: τὰς καρδίας ἡμῶν
  choice: మా హృదయాలను
  rationale: బైబిలు మానవ స్వభావ పదప్రయోగాన్ని నిలుపుతూ, దానిని కేవలం మనస్సు లేదా భావోద్వేగాలకు పరిమితం చేయదు.
theological_decisions:
- issue: మనుషుల మెప్పు మరియు దేవుని మెప్పు మధ్య ఉన్న సంక్షిప్త గ్రీకు వ్యత్యాసాన్ని తెలుగులో వ్యక్తపరచడం
  choice: ప్రధాన పాఠ్యంలో ‘మనుషులకు నచ్చేలా కాదు, ... దేవునికి నచ్చేలా’ అని సహజంగా విస్తరించడం
  alternative: ‘మనుషులను సంతోషపెట్టేవారిగా కాక, దేవుణ్ణి’ అని గ్రీకు సంక్షిప్తతను యథాతథంగా అనుసరించడం
  rationale: గ్రీకు మొదటి భాగంలో మాత్రమే ‘మెప్పించడం’ అనే కృదంతాన్ని స్పష్టంగా ఉంచి, రెండో భాగంలో దానిని అధ్యాహారంగా వదులుతుంది. అదే సంక్షిప్తత తెలుగులో అసంపూర్ణంగా, అసహజంగా వినిపిస్తుంది. అందువల్ల అధ్యాహార భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టం చేసి, మూల నిర్మాణాన్ని పాదటిప్పణిలో భద్రపరిచాం; దీనివల్ల మనుషుల ఆమోదం కంటే దేవుని ఆమోదమే లక్ష్యమనే వ్యత్యాసం మారదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘సువార్త,’ ‘హృదయాలు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని నిలుపుకుంది. గ్రీకు పరిపూర్ణ రూపంలోని పరీక్షతో కూడిన ఆమోదాన్ని ‘పరీక్షించి ఆమోదించిన’ అని స్పష్టపరిచింది.
