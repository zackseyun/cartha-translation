id: 1TH.2.6
reference: 1 Thessalonians 2:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὔτε ζητοῦντες ἐξ ἀνθρώπων δόξαν, οὔτε ἀφ’ ὑμῶν οὔτε ἀπ’ ἄλλων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/006.yaml
  text: nor seeking glory from people[a], neither from you nor from others,
translation:
  language: te
  text: మనుషుల నుండి గౌరవాన్ని కోరడం లేదు—మీ నుండి గానీ, ఇతరుల నుండి గానీ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: కోరుతూ
  rationale: వర్తమాన కృదంతం సందర్భంలోని అంతర్లీన కర్తను విశేషిస్తుంది; ‘కోరుతూ’ అనే రూపం కొనసాగుతున్న క్రియాభావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐξ ἀνθρώπων
  choice: మనుషుల నుండి
  rationale: ἄνθρωποι ఇక్కడ పురుషులను మాత్రమే కాక మానవులను సాధారణంగా సూచిస్తుంది; ‘మనుషుల నుండి’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా ఉంది.
- source_word: δόξαν
  choice: మహిమను
  rationale: δόξα ఇక్కడ మనుషులిచ్చే గౌరవం లేదా ప్రశంసను సూచించినా, ‘మహిమ’ కొత్త నిబంధన అంతటా ఉన్న పదసంబంధాన్ని కాపాడుతుంది; సందర్భం దాని మానవ మూలాన్ని స్పష్టం చేస్తుంది.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: కూడా లేము ... గానీ ... గానీ
  rationale: మొదటి οὔτε ముందు వాక్యంతో ప్రతికూల సమన్వయాన్ని కొనసాగిస్తుంది; చివరి రెండు పదబంధాలకు ‘గానీ ... గానీ’ సహజమైన తెలుగు సమాంతర నిర్మాణాన్ని ఇస్తుంది.
- source_word: ἀφ’ ὑμῶν
  choice: మీ నుండి
  rationale: థెస్సలొనీక విశ్వాసులను ఉద్దేశించిన ప్రత్యక్ష బహువచన సంబోధనను యథాతథంగా నిలుపుతుంది.
- source_word: ἀπ’ ἄλλων
  choice: ఇతరుల నుండి
  rationale: థెస్సలొనీకయులు కాక ఇతర మనుషులను సూచించే సంక్షిప్తమైన, సహజమైన అనువాదం.
theological_decisions:
- issue: కోరబడని δόξα స్వభావం
  choice: మనుషుల నుండి వచ్చే మహిమ/మెప్పు
  alternative: దేవుని మహిమ; లేదా కేవలం గౌరవం/ప్రశంస
  rationale: ἐξ ἀνθρώπων అనే పదబంధం మూలం మనుషులేనని స్పష్టం చేస్తుంది. ప్రధాన పాఠంలో ‘మహిమ’ ఉంచి, అది మానవ గౌరవం లేదా ప్రశంస అనే భావాన్ని పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు సులభంగా ఉండేలా నిర్మించబడింది. ఈ వాక్యభాగం ముందరి వచనంతో వ్యాకరణపరంగా కొనసాగుతుందనే భావాన్ని ‘కూడా లేము’ నిలుపుతుంది.
