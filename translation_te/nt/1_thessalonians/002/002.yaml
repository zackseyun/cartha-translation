id: 1TH.2.2
reference: 1 Thessalonians 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ προπαθόντες καὶ ὑβρισθέντες καθὼς οἴδατε ἐν Φιλίπποις ἐπαρρησιασάμεθα ἐν τῷ θεῷ ἡμῶν λαλῆσαι πρὸς ὑμᾶς τὸ εὐαγγέλιον τοῦ θεοῦ ἐν πολλῷ ἀγῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/002.yaml
  text: But after we had already suffered and been shamefully mistreated[a], as you know, in Philippi[c][b], we were bold in our God to speak the gospel of God to you amid much conflict.
translation:
  language: te
  text: కానీ, మీకు తెలిసినట్లే, ఫిలిప్పీలో ముందే బాధలు అనుభవించి, అవమానకరమైన దుర్వ్యవహారానికి గురైన తర్వాత[a], ఎంతో పోరాటం మధ్య[b] మా దేవునిలో ధైర్యం పొంది దేవుని సువార్తను మీకు చెప్పాము[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అవమానించబడిన తర్వాత,” “దారుణంగా ప్రవర్తించబడిన తర్వాత,” లేదా “దుర్వినియోగానికి గురైన తర్వాత.” గ్రీకు క్రియలో దురహంకారంతో ప్రవర్తించడం లేదా బహిరంగంగా పరువు తీయడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఎంతో సంఘర్షణలో” లేదా “తీవ్రమైన ప్రతిఘటన మధ్య.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “మా దేవునిలో ధైర్యంగా దేవుని సువార్తను మీకు ప్రకటించాము.” గ్రీకు క్రియలో ధైర్యంగా మాట్లాడే చర్య కూడా ఇమిడి ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందటి భావానికి బలమైన వ్యతిరేకతను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: προπαθόντες
  choice: అప్పటికే బాధలు అనుభవించి
  rationale: ప్రధాన క్రియకు ముందు జరిగిన బాధను, προ- ఉపసర్గలోని పూర్వత్వ భావాన్ని తెలియజేస్తుంది.
- source_word: ὑβρισθέντες
  choice: అవమానకరంగా హింసించబడినప్పటికీ
  rationale: కేవలం మాటలతో అవమానించడం మాత్రమే కాక, దురహంకారంతో అవమానకరంగా బాధించడం అనే క్రియ బలాన్ని వ్యక్తపరుస్తుంది.
- source_word: καθὼς οἴδατε
  choice: మీకు తెలిసినట్లే
  rationale: పాఠకులకు తెలిసిన విషయాన్ని గుర్తుచేసే సహజమైన మధ్యవాక్య ప్రయోగం.
- source_word: ἐν Φιλίπποις
  choice: ఫిలిప్పీలో
  rationale: స్థలనామానికి ప్రామాణిక తెలుగు లిప్యంతరీకరణతో స్థలార్థక విభక్తిని జోడిస్తుంది.
- source_word: ἐπαρρησιασάμεθα
  choice: ధైర్యంగా మాట్లాడాము
  rationale: ఈ క్రియలోనే బహిరంగంగా, నిర్భయంగా మాట్లాడే భావం ఉండటంతో తెలుగులో సహజంగా క్రియాత్మకంగా అనువదించబడింది.
- source_word: ἐν τῷ θεῷ ἡμῶν
  choice: మా దేవునిలో
  rationale: దేవుణ్ణి కేవలం సాధనకారణంగా పరిమితం చేయకుండా, ధైర్యం ప్రదర్శితమైన సంబంధపూర్వక పరిధి లేదా ఆధారాన్ని నిలుపుతుంది.
- source_word: λαλῆσαι πρὸς ὑμᾶς
  choice: మీకు చెప్పడానికి
  rationale: తెలుగులో పునరుక్తిని తగ్గిస్తూ, శ్రోతల వైపు ఉద్దేశించిన మాటల చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: దేవుని సువార్తను
  rationale: పౌలు వాడే పరిచిత పదబంధాన్ని, జనిటివ్ సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν πολλῷ ἀγῶνι
  choice: ఎంతో పోరాటం మధ్య
  rationale: ἀγών లోని పోరాటం, సంఘర్షణ, ప్రతిఘటనల మధ్య శ్రమించే విస్తృత భావాన్ని ఉద్దేశపూర్వకంగా తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: ἐν τῷ θεῷ ἡμῶν యొక్క భావబలం
  choice: మా దేవునిలో
  alternative: మా దేవునివల్ల; మా దేవుని ద్వారా; మా దేవునిపై నమ్మకంతో
  rationale: గ్రీకు పదబంధంలోని సంబంధపూర్వక పరిధి లేదా ఆధార భావాన్ని నిలిపి, దేవుణ్ణి కేవలం కార్యసాధక కారణంగా మాత్రమే నిర్వచించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా గౌరవప్రదంగా రూపొందించబడింది. మూలంలోని భాగధేయ క్రియల వరుసను తెలుగుకు సరిపోయే ఉపవాక్య నిర్మాణంగా మార్చినా, పూర్వ బాధ, అవమానకర దుర్వ్యవహారం, దేవునిలో ధైర్యం, సువార్త ప్రకటన, తీవ్రమైన పోరాటం అనే భావాలన్నీ నిలుపబడ్డాయి.
