id: 1TH.2.17
reference: 1 Thessalonians 2:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἡμεῖς δέ, ἀδελφοί, ἀπορφανισθέντες ἀφ’ ὑμῶν πρὸς καιρὸν ὥρας, προσώπῳ οὐ καρδίᾳ, περισσοτέρως ἐσπουδάσαμεν τὸ πρόσωπον ὑμῶν ἰδεῖν ἐν πολλῇ ἐπιθυμίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/017.yaml
  text: But we[a], brothers, having been torn away from you for a short time—in person, not in heart—were all the more eager, with great longing[b], to see your face.
translation:
  language: te
  text: అయితే, సహోదరులారా,[b] మేము కొద్దికాలం పాటు మీ నుండి వేరుచేయబడ్డాము[a]—శారీరకంగా మాత్రమే, హృదయపరంగా కాదు—కాబట్టి, ఎంతో ఆరాటంతో మీ ముఖం చూడడానికి మరింతగా ప్రయత్నించాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “వేరుచేయబడ్డాము” అని అనువదించిన గ్రీకు పదానికి అక్షరార్థంగా “అనాథలైనట్లుగా చేయబడ్డాము” అనే భావం ఉంది; ఈ వియోగం కలిగించిన తీవ్రమైన వెలితిని అది చిత్రిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “సహోదరులారా” అనేది పౌలు ఉపయోగించిన సంబోధన; ఈ సందర్భంలో అది స్త్రీలతో సహా విశ్వాస సమాజమంతటినీ సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡμεῖς δέ
  choice: అయితే ... మేము
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది; Ἡμεῖς అనే స్పష్టమైన కర్తకు ఉన్న ఉద్ఘాటనను ‘మేము’ నిలుపుతుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు సంబోధనలోని పుంలింగ బహువచన రూపాన్ని గౌరవప్రదమైన సహజ తెలుగు రూపంలో నిలిపింది; సందర్భంలో ఇది విశ్వాస సమాజమంతటికీ వర్తించవచ్చని పాదసూచిక వివరిస్తుంది.
- source_word: ἀπορφανισθέντες ἀφ’ ὑμῶν
  choice: మీ నుండి దూరం చేయబడ్డాము
  rationale: కర్తలు కోరుకోకుండా బాధాకరంగా వేరుచేయబడ్డారనే కర్మణి భావాన్ని తెలియజేస్తుంది. మూలపదంలోని అనాథలైనట్లున్న వియోగపు సజీవ రూపకాన్ని పాదసూచికలో భద్రపరిచింది.
- source_word: πρὸς καιρὸν ὥρας
  choice: కొద్దికాలం
  rationale: ఇది అక్షరార్థంగా ఒక గంటను కాక స్వల్ప వ్యవధిని సూచించే నుడికారం; ‘కొద్దికాలం’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: προσώπῳ οὐ καρδίᾳ
  choice: ముఖతఃనే గాని హృదయపూర్వకంగా కాదు
  rationale: శారీరక సన్నిధి లేకపోవడానికీ అంతరంగ అనుబంధం కొనసాగడానికీ మధ్యనున్న వ్యత్యాసాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: περισσοτέρως ἐσπουδάσαμεν
  choice: మరింతగా ప్రయత్నించాము
  rationale: περισσοτέρως లోని తులనాత్మక తీవ్రతను, σπουδάζω లోని శ్రద్ధతో ప్రయత్నించే భావాన్ని రెండింటినీ నిలుపుతుంది; కేవలం భావోద్వేగ ఆసక్తిగా పరిమితం చేయదు.
- source_word: τὸ πρόσωπον ὑμῶν ἰδεῖν
  choice: మీ ముఖం చూడడానికి
  rationale: ‘మిమ్మల్ని చూడడానికి’ అని సులభీకరించకుండా మూలంలోని ‘ముఖం’ అనే వ్యక్తిగత, శారీరక సన్నిధి చిత్రాన్ని నిలుపుతుంది.
- source_word: ἐν πολλῇ ἐπιθυμίᾳ
  choice: మిక్కిలి ఆరాటంతో
  rationale: ἐπιθυμία ఇక్కడ ప్రతికూల కామార్థంలో కాక తీవ్రమైన కలయిక కోరికను సూచిస్తుంది; ‘మిక్కిలి ఆరాటంతో’ ఆ తీవ్రతను సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἀδελφοί అనే లింగసూచక సంబోధన
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది సందర్భానుసారం స్త్రీలతో సహా విశ్వాస సమాజమంతటినీ ఉద్దేశించవచ్చనే విషయాన్ని పాదసూచికలో స్పష్టం చేసింది.
- issue: ἀπορφανισθέντες లోని వియోగ రూపకం
  choice: దూరం చేయబడ్డాము
  alternative: అనాథలమైనట్లుగా మీ నుండి వేరయ్యాము
  rationale: పౌలు-సంఘ సంబంధాన్ని తల్లిదండ్రి-పిల్ల సంబంధంగా నిర్ణయించకుండా, గ్రీకు పదంలోని దుఃఖభరితమైన వియోగాన్ని ప్రధాన పాఠ్యంలో సహజంగా అందించి, అసలు రూపకాన్ని పాదసూచికలో పేర్కొంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘ముఖతః’ కొద్దిగా సాహిత్యపూర్వకమైనదైనా ‘హృదయపూర్వకంగా’తో ఉన్న మూల వ్యత్యాసాన్ని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది. పాదసూచిక సూచికలు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
