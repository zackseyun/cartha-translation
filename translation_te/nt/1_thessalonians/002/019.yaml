revisions:
- from: ఎందుకంటే, మన ప్రభువైన యేసు రాకడలో[a] ఆయన ఎదుట మా నిరీక్షణగానీ, ఆనందంగానీ, అతిశయానికి కిరీటంగానీ ఎవరు? నిజంగా మీరే కాదా?
  to: ఎందుకంటే, మన ప్రభువైన యేసు రాకడలో[a] ఆయన ఎదుట మన నిరీక్షణగానీ, ఆనందంగానీ, అతిశయానికి కిరీటంగానీ ఏమిటి? మీరే కాదా?
  rationale: The revision restores the impersonal interrogative required by τίς with ‘నిరీక్షణ,’ ‘ఆనందం,’ and ‘కిరీటం,’ while keeping the readers as the rhetorical answer. It also corrects the lexical footnote’s misleading completed-arrival wording. The wording retains the source’s future-coming sense and its rhetorical emphasis without resolving beyond the text.
