id: 1TH.2.19
reference: 1 Thessalonians 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς γὰρ ἡμῶν ἐλπὶς ἢ χαρὰ ἢ στέφανος καυχήσεως— ἢ οὐχὶ καὶ ὑμεῖς— ἔμπροσθεν τοῦ κυρίου ἡμῶν Ἰησοῦ ἐν τῇ αὐτοῦ παρουσίᾳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/019.yaml
  text: For what is our hope or joy or crown of boasting—is it not indeed you?—before our Lord Jesus at his coming[a].
translation:
  language: te
  text: ఎందుకంటే, మన ప్రభువైన యేసు రాకడలో[a] ఆయన ఎదుట మన నిరీక్షణగానీ, ఆనందంగానీ, అతిశయానికి కిరీటంగానీ ఏమిటి? మీరే కాదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన సన్నిధిలో’ లేదా ‘ఆయన ఆగమనంలో.’ గ్రీకు పదం παρουσία సన్నిధిని లేదా ఆగమనాన్ని సూచించగలదు; ఈ సందర్భంలో అది ప్రభువైన యేసు భవిష్యత్తు రాకడను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: ఎవరు
  rationale: ఈ ప్రశ్నకు సమాధానం వ్యక్తులైన థెస్సలొనీకయ విశ్వాసులు కాబట్టి తెలుగులో ‘ఎవరు’ సహజంగా ఉంటుంది; నిరీక్షణ, ఆనందం, కిరీటం అనే విధేయ నామాల భావమూ నిలుస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందరి వాక్యంతో ఉన్న వివరణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐλπίς
  choice: నిరీక్షణ
  rationale: పౌలు వాడుకలోని నమ్మకంతో కూడిన ఎదురుచూపు భావానికి ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: χαρά
  choice: ఆనందం
  rationale: భావోద్వేగ బలాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా వ్యక్తపరుస్తుంది.
- source_word: στέφανος καυχήσεως
  choice: అతిశయానికి కిరీటం
  rationale: στέφανος లోని గౌరవ లేదా విజయ కిరీట భావాన్ని, καύχησις లోని అతిశయించుట అనే భావాన్ని కుదించకుండా నిలుపుతుంది.
- source_word: οὐχὶ καὶ ὑμεῖς
  choice: నిజంగా మీరే కాదా?
  rationale: అవుననే సమాధానాన్ని ఆశించే ప్రశ్ననూ οὐχί యొక్క నొక్కిచెప్పే బలాన్నీ సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; καί ఇక్కడ నొక్కిచెప్పే పనిలో ఉన్నదిగా గ్రహించబడింది.
- source_word: ἔμπροσθεν
  choice: ఎదుట
  rationale: ప్రభువు సన్నిధిలో ఉండే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος కు నూతన నిబంధన సందర్భంలో సాధారణమైన, గౌరవప్రదమైన తెలుగు అనువాదం.
- source_word: παρουσίᾳ
  choice: రాకడలో
  rationale: ఈ అంత్యకాల సందర్భంలో యేసు భవిష్యత్తులో రావడాన్ని సహజంగా తెలియజేస్తుంది; పదంలోని ‘సన్నిధి’ లేదా ‘చేరుకోవడం’ అనే విస్తృత భావాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: అంత్యకాల సందర్భంలో παρουσίᾳ అనువాదం
  choice: రాకడలో
  alternative: సన్నిధిలో; చేరుకున్నప్పుడు
  rationale: ఈ సందర్భం ప్రభువైన యేసు భవిష్యత్తులో రావడాన్ని సూచిస్తుంది. అయినా παρουσία అనే పదానికి ‘సన్నిధి’ మరియు ‘రాక/చేరుకోవడం’ అనే భావాలు ఉండటంతో ఆ పదార్థ విస్తృతిని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే పౌలు వాక్యంలోని అలంకారిక ప్రశ్న మరియు గౌరవప్రదమైన ధోరణి నిలిచేలా రూపొందించబడింది.
