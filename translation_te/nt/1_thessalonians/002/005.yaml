review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys the two coordinated denials: flattering speech and a pretext that conceals greed. However, ‘దేవుడే సాక్షి’ adds emphatic/exclusive force not explicitly marked by θεὸς μάρτυς. The revised wording retains the Greek parallelism more directly with ‘గానీ ... గానీ’ and uses the unmarked solemn appeal ‘దేవుడు సాక్షి.’'
  naturalness: The revision is natural modern standard Telugu and keeps the parenthetic appeal ‘మీకు తెలిసినట్లే’ close to the first denial. ‘దురాశను కప్పిపుచ్చే సాకుతో’ is clear and preserves the figurative sense of πρόφασις as a cover or pretext.
  terminology: ‘ముఖస్తుతి మాటలు’ suitably renders λόγῳ κολακείας; ‘దురాశ’ appropriately renders πλεονεξία without restricting it to money; and ‘సాక్షి’ is the standard formal equivalent for μάρτυς.
  issues:
  - severity: low
    issue: Unwarranted emphasis in ‘దేవుడే సాక్షి.’
    rationale: The particle-like emphatic force of ‘-ఏ’ can imply ‘God alone/indeed is witness,’ whereas the Greek simply reads θεὸς μάρτυς, ‘God is witness.’
  - severity: low
    issue: The two οὔτε clauses are expressed by repeating ‘రాలేదు’ rather than with a Telugu correlative negative construction.
    rationale: The draft is understandable, but ‘గానీ ... గానీ రాలేదు’ more transparently retains the source’s balanced paired negation.
  revised_text: ఎందుకంటే మేము ఎన్నడూ ముఖస్తుతి మాటలతో రాలేదు, మీకు తెలిసినట్లే; దురాశను కప్పిపుచ్చే సాకుతో గానీ రాలేదు[a]—దేవుడు సాక్షి.
  revised_footnotes:
  - marker: a
    text: లేదా, ‘దురాశకు ముసుగుతో’; లేదా, ‘లోభాన్ని కప్పే నెపంతో.’
    reason: lexical_alternative
  revision_rationale: The revision removes added emphasis from the final divine-witness formula and slightly regularizes the second negative clause. It retains the draft’s accurate interpretation of πρόφασις as a pretext or outward cover for greed, without narrowing πλεονεξία to financial gain.
