- from: ఎందుకంటే, మీకు తెలిసినట్లే, మేము ఎన్నడూ ముఖస్తుతి మాటలతో రాలేదు; దురాశను కప్పిపుచ్చే సాకుతోనూ రాలేదు[a]—దేవుడే సాక్షి.
  to: ఎందుకంటే మేము ఎన్నడూ ముఖస్తుతి మాటలతో రాలేదు, మీకు తెలిసినట్లే; దురాశను కప్పిపుచ్చే సాకుతో గానీ రాలేదు[a]—దేవుడు సాక్షి.
