id: 1TH.2.5
reference: 1 Thessalonians 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὔτε γάρ ποτε ἐν λόγῳ κολακείας ἐγενήθημεν, καθὼς οἴδατε, οὔτε ⸀ἐν προφάσει πλεονεξίας, θεὸς μάρτυς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/005.yaml
  text: For we never came with flattering speech[a], as you know[b], nor with a pretext for greed—God is witness.
translation:
  language: te
  text: ఎందుకంటే మేము ఎన్నడూ ముఖస్తుతి మాటలతో రాలేదు, మీకు తెలిసినట్లే; దురాశను కప్పిపుచ్చే సాకుతో గానీ రాలేదు[a]—దేవుడు సాక్షి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దురాశకు ముసుగుతో’; లేదా, ‘లోభాన్ని కప్పే నెపంతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔτε γάρ ποτε
  choice: ఎందుకంటే ... ఎన్నడూ ... రాలేదు
  rationale: γάρ ముందున్న వాదనతో కారణ సంబంధాన్ని చూపుతుంది; οὔτε ... ποτε కాలపరంగా బలమైన నిరాకరణను తెలియజేస్తుంది. తెలుగులో ‘ఎన్నడూ ... రాలేదు’ సహజంగా ఉంది.
- source_word: ἐν λόγῳ κολακείας
  choice: ముఖస్తుతి మాటలతో
  rationale: λόγος ఇక్కడ ఒకే పదాన్ని కాక మాటతీరును సూచిస్తుంది; κολακεία స్వార్థపూరితమైన పొగడ్త లేదా ముఖస్తుతిని సూచిస్తుంది. ‘ముఖస్తుతి మాటలతో’ సాధనార్థక ἐν భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐγενήθημεν
  choice: రాలేదు
  rationale: సందర్భం థెస్సలొనీకయుల మధ్యకు మిషనరీలు వచ్చిన విధానాన్ని గురించి ఉంది. అందువల్ల అక్షరార్థమైన ‘కాలేదు’ కంటే ‘రాలేదు’ సందర్భోచితంగా ఉంది.
- source_word: καθὼς οἴδατε
  choice: మీకు తెలిసినట్లే
  rationale: వారి ప్రత్యక్ష జ్ఞానాన్ని ఆధారంగా చేసుకున్న పౌలు విజ్ఞాపనను సరళంగా నిలుపుతుంది.
- source_word: ἐν προφάσει πλεονεξίας
  choice: దురాశను కప్పిపుచ్చే సాకుతో
  rationale: πρόφασις సాకు, నెపం, లేదా నిజమైన ఉద్దేశాన్ని కప్పే బాహ్య రూపం అనే భావాలను కలిగి ఉంది; πλεονεξία మరింత సంపాదించాలనే దురాశను సూచిస్తుంది. ఈ ఎంపిక దురాశను దాచే నెపం అనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: θεὸς μάρτυς
  choice: దేవుడే సాక్షి
  rationale: ఇది దేవుణ్ణి గంభీరమైన సాక్షిగా పిలిచే సంక్షిప్త వాక్యం. గ్రీకులో స్వామ్య సర్వనామం లేకపోవడంతో ‘మా సాక్షి’ అని చేర్చకుండా, ‘దేవుడే సాక్షి’ అని సహజంగా అనువదించబడింది.
theological_decisions:
- issue: పౌలు నిరాకరిస్తున్న పద్ధతి మరియు ఉద్దేశం
  choice: ముఖస్తుతితో మాట్లాడడాన్నీ, దురాశను సాకుతో కప్పిపుచ్చడాన్నీ వాక్యం నిరాకరిస్తుంది.
  alternative: అన్ని రకాల అలంకారిక ప్రసంగాన్ని ఖండించడం, లేదా కేవలం ఆర్థిక దోపిడినే ఉద్దేశించడం.
  rationale: గ్రీకు పాఠం ప్రత్యేకంగా κολακεία మరియు πλεονεξίαలను పేర్కొంటుంది. అందువల్ల వాక్యాన్ని అన్ని వాక్చాతుర్యాలపై సాధారణ ఖండనగా విస్తరించలేదు; అలాగే దురాశను కేవలం డబ్బుకే పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి ఉపయోగించబడింది. ‘ముఖస్తుతి’ మరియు ‘దురాశ’ స్పష్టమైన సమకాలీన పదాలు; మూలంలోని రెండు సమాంతర నిరాకరణలను తెలుగులో పునరుక్త క్రియతో స్పష్టంగా చూపించాం.
