id: 1TH.2.10
reference: 1 Thessalonians 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμεῖς μάρτυρες καὶ ὁ θεός, ὡς ὁσίως καὶ δικαίως καὶ ἀμέμπτως ὑμῖν τοῖς πιστεύουσιν ἐγενήθημεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/010.yaml
  text: You are witnesses[a], and God also, how devoutly and righteously and blamelessly we behaved toward you who believe[b],
translation:
  language: te
  text: విశ్వసించే మీ పట్ల[b] మేము ఎంత భక్తిగా[a], నీతిగా, నిందారహితంగా ప్రవర్తించామో మీరే సాక్షులు; దేవుడు కూడా సాక్షి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పవిత్రంగా” అని అనువదించవచ్చు. గ్రీకు పదం దేవుని ఎదుట భక్తిపూర్వకమైన ప్రవర్తనను ప్రధానంగా సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “మీ పట్ల” అనే మాటకు బదులుగా “విశ్వసించే మీ మధ్య” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς μάρτυρες καὶ ὁ θεός
  choice: మీరే సాక్షులు; దేవుడు కూడా సాక్షి
  rationale: థెస్సలొనీకయులకు చేసిన ప్రత్యక్ష విజ్ఞప్తిని ముందుంచి, తరువాత దేవుణ్ణి సాక్షిగా పేర్కొనే గ్రీకు పదక్రమం మరియు భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది. ఏకవచనమైన దేవునికి ‘సాక్షి’ అని వాడటం తెలుగు వ్యాకరణానికి అనుగుణం.
- source_word: ὡς
  choice: ఎంత ... ప్రవర్తించామో
  rationale: ఇక్కడ ὡς ప్రవర్తన విధానాన్ని పరిచయం చేస్తుంది. తెలుగు సహసంబంధ నిర్మాణమైన ‘ఎంత ... ఓ’ సాక్ష్య విజ్ఞప్తితో సహజంగా కలుస్తుంది.
- source_word: ὁσίως
  choice: భక్తిగా
  rationale: దేవుని పట్ల భక్తి, పవిత్ర గౌరవం ప్రతిఫలించే ప్రవర్తనను సూచిస్తుంది; ఆధునిక తెలుగులో ‘భక్తిగా’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: δικαίως
  choice: నీతిగా
  rationale: నైతికంగా సరైన, న్యాయమైన ప్రవర్తన అనే విస్తృత భావాన్ని నిలుపుతుంది; కేవలం న్యాయపరమైన అర్థానికి పరిమితం చేయదు.
- source_word: ἀμέμπτως
  choice: నిందారహితంగా
  rationale: సముచితమైన నిందకు తావులేని ప్రవర్తనను నేరుగా వ్యక్తం చేస్తుంది; పాపరహిత పరిపూర్ణత అనే అదనపు భావాన్ని స్వయంగా మోపదు.
- source_word: ὑμῖν
  choice: మీ పట్ల
  rationale: దత్తివిభక్తి సూచించే సంబంధ దిశను వ్యక్తం చేస్తుంది. ‘మీ మధ్య’ అనే స్థల/సమూహ భావం కూడా సందర్భానుసారం సాధ్యమేనని పాదటిప్పణిలో ఉంచబడింది.
- source_word: τοῖς πιστεύουσιν
  choice: విశ్వసిస్తున్న మీ
  rationale: వర్తమాన కృదంతంలోని క్రియాత్మక భావాన్ని నిలుపుతూ, థెస్సలొనీకయులను ఉద్దేశించిన మాటగా సహజమైన తెలుగులో ఇస్తుంది.
- source_word: ἐγενήθημεν
  choice: ప్రవర్తించాము
  rationale: మూడు క్రియావిశేషణాలతో కూడిన సందర్భంలో γίνομαι వారు ఎలా జీవించారో లేదా నడుచుకున్నారో సూచిస్తుంది; ‘ప్రవర్తించాము’ ఆ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: అపొస్తలిక సేవకుల ప్రవర్తనకు సంబంధించిన మూడు నైతిక వర్ణనలు
  choice: భక్తిగా, నీతిగా, నిందారహితంగా
  alternative: ఈ మాటలను కేవలం వాదనాత్మక ఆత్మరక్షణగా తీసుకోవడం, లేదా సంపూర్ణ పాపరాహిత్య ప్రకటనగా విస్తరించడం
  rationale: వచనం విశ్వాసులనూ దేవుణ్ణీ సాక్షులుగా పిలుస్తూ వారి ప్రత్యక్ష ప్రవర్తన సమగ్రతను బలంగా ప్రకటిస్తుంది. మూలంలో లేని ‘సంపూర్ణ పాపరాహిత్యం’ అనే వివరణను చేర్చకుండా ఆ బలాన్ని అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని మూడు సమాంతర క్రియావిశేషణాలను కాపాడి, తెలుగు సహజత్వం కోసం ప్రధాన క్రియను ముందుకు తెచ్చి సాక్షుల విజ్ఞప్తిని వాక్యాంతంలో ఉంచాం. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
