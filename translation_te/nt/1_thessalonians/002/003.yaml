    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλησις
  choice: విజ్ఞప్తి
  rationale: ఈ సందర్భంలో వినేవారిని ఉద్దేశించి గంభీరంగా కోరడం, ప్రబోధించడం అనే భావం ఉంది. ‘విజ్ఞప్తి’ ఆ ఉద్దేశాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; అయితే గ్రీకు పదానికి ‘ప్రబోధం’ అనే అర్థం కూడా సాధ్యమైనందున దానిని పాదసూచికలో ఉంచాం.
- source_word: πλάνης
  choice: తప్పుదారి
  rationale: ἐκ అనే విభక్తి ప్రయోగంతో ఇది విజ్ఞప్తికి మూలం లేదా పుట్టుకను సూచిస్తుంది. ‘తప్పుదారి’ అబద్ధం లేదా పొరపాటుతో కూడిన దారి అనే విస్తృత భావాన్ని నిలుపుతుంది; ఉద్దేశపూర్వక మోసాన్ని సూచించే δόλος‌తో దీనికి ఉన్న తేడాను కూడా కాపాడుతుంది.
- source_word: ἀκαθαρσίας
  choice: అపవిత్రత
  rationale: నైతిక అపవిత్రత అనే విస్తృత భావాన్ని నిలుపుతూ, మూలపాఠం స్పష్టంగా చెప్పని లైంగిక అర్థానికి మాత్రమే దీనిని పరిమితం చేయదు.
- source_word: δόλῳ
  choice: మోసంతో
  rationale: ἐν తో వచ్చిన ఈ పదం కార్యవిధానాన్ని సూచిస్తుంది. ‘మోసంతో’ ఉద్దేశపూర్వక కపటాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκ ... ἐξ ... ἐν
  choice: నుండి గానీ ... నుండి గానీ ... మోసంతో
  rationale: ἐκ/ἐξ సూచించే మూలాన్ని ‘నుండి’తో, ἐν సూచించే విధానాన్ని ‘తో’తో వేరు చేసి చూపించాం. తెలుగు వాక్య సహజత్వం కోసం ‘పుట్టింది’ని మొదటి రెండు పదబంధాలకు అన్వయించాం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఈ వాక్యం వివరణ లేదా కారణం ఇస్తున్న అనుసంధానాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ἀκαθαρσία పదం సూచించే అపవిత్రత పరిధి
  choice: ప్రధాన పాఠంలో విస్తృతంగా ‘అపవిత్రత’ అని అనువదించడం
  alternative: ‘లైంగిక అపవిత్రత’ అని ప్రత్యేకంగా అనువదించడం
  rationale: ఈ పదానికి కొన్ని సందర్భాల్లో లైంగిక భావం ఉండగలిగినా, ఇక్కడ గ్రీకు పాఠం అపవిత్రత యొక్క నిర్దిష్ట రూపాన్ని పేర్కొనదు. కాబట్టి భావాన్ని అనవసరంగా కుదించకుండా విస్తృత పదాన్నే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలపాఠంలోని మొదటి రెండు ‘నుండి’ సంబంధాలకూ చివరి ‘తో’ సంబంధానికీ మధ్య ఉన్న వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా నిలిపాం; గ్రీకులోని మూడు నిరాకరణలను తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా వ్యక్తం చేశాం.
