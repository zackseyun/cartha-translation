  text: ఎందుకంటే మా విజ్ఞప్తి[a] తప్పు[b] నుండి గానీ, అపవిత్రత నుండి గానీ ఉద్భవించినది కాదు; మోసపూర్వకమైనదీ కాదు.
  philosophy: optimal-equivalence
