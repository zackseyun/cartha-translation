  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῶν καὶ τὸν κύριον ἀποκτεινάντων Ἰησοῦν καὶ ⸀τοὺς προφήτας καὶ ἡμᾶς ἐκδιωξάντων, καὶ θεῷ μὴ ἀρεσκόντων, καὶ πᾶσιν ἀνθρώποις ἐναντίων,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/015.yaml
  text: who also killed the Lord Jesus and the prophets[a], and drove us out, and are not pleasing to God, and are hostile to all people[c][b],
translation:
  language: te
  text: వారే ప్రభువైన యేసును, ప్రవక్తలను కూడా చంపి, మమ్మల్ని తరిమివేసినవారు[a][b]; వారు దేవునికి ఇష్టమైనవారు కారు, మనుషులందరికీ విరోధులుగా ఉన్నారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువైన యేసును ప్రాణం తీశారు.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, “మమ్మల్ని బయటకు వెళ్లగొట్టారు” లేదా “బహిష్కరించారు.” ఇక్కడి క్రియ సాధారణమైన ‘హింసించారు’ అనే భావం కంటే నిర్దిష్టమైనది.
    reason: lexical_alternative
  - marker: c
    text: వ్యాకరణపరంగా ఈ వర్ణన మునుపటి వచనంలో గుర్తించిన సమూహాన్నే కొనసాగిస్తుంది; అన్ని కాలాల్లో, అన్ని ప్రాంతాల్లో ఉన్న యూదులందరి గురించిన సమగ్ర ప్రకటనగా దీనిని చదవకూడదు.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκτεινάντων
  choice: చంపారు
  rationale: క్రియలో ఉద్దేశపూర్వక హత్య అనే అదనపు భావాన్ని చేర్చకుండా, ‘చంపడం/ప్రాణం తీయడం’ అనే మౌలిక అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κύριον Ἰησοῦν
  choice: ప్రభువైన యేసును
  rationale: κύριοςను క్రీస్తుకు సంబంధించిన బిరుదుగా ‘ప్రభువు’ అని అనువదించి, తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ‘ప్రభువైన యేసు’ అని ఇచ్చాం.
- source_word: τοὺς προφήτας
  choice: ప్రవక్తలను
  rationale: నిర్దిష్టమైన, గుర్తింపబడిన ప్రవక్తల పరంపరను సూచించే గ్రీకు సపద ఆర్టికల్ భావం తెలుగు సందర్భంలో సహజంగా అంతర్భూతమవుతుంది.
- source_word: ἐκδιωξάντων
  choice: తరిమివేశారు
  rationale: సాధారణంగా ‘హింసించారు’ అనే విస్తృత భావం కంటే, బయటకు వెళ్లగొట్టడం లేదా తరిమివేయడం అనే క్రియ యొక్క నిర్దిష్ట బలాన్ని కాపాడుతుంది.
- source_word: θεῷ μὴ ἀρεσκόντων
  choice: దేవునికి ఇష్టమైనవారుగా ఉండరు
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న వర్ణనాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πᾶσιν ἀνθρώποις ἐναντίων
  choice: మనుషులందరికీ విరోధులుగా ఉన్నారు
  rationale: ἐναντίοςలోని వ్యతిరేకత/విరోధ భావాన్ని సహజంగా వ్యక్తం చేస్తూ, మూలంలోని ‘అందరికీ’ అనే విస్తృత పదబంధాన్ని నిలుపుతుంది.
- source_word: τῶν ... ἀποκτεινάντων ... ἐκδιωξάντων ... ἀρεσκόντων ... ἐναντίων
  choice: వారు ... చంపారు ... తరిమివేశారు ... ఉండరు ... ఉన్నారు
  rationale: ఈ కృదంతాల పరంపర మునుపటి వచనంలోని సమూహాన్ని వర్ణిస్తూనే ఉంటుంది. తెలుగులో స్పష్టత, సహజత్వం కోసం పరిమిత క్రియలతో వాక్యాలుగా వ్యక్తం చేశాం.
- source_word: καὶ
  choice: కూడా / మరియు భావాన్ని జాబితా నిర్మాణంలో వ్యక్తీకరణ
  rationale: మొదటి καί యొక్క చేర్పు భావాన్ని ‘కూడా’తో చూపించాం; మిగిలిన καί పదాల సంచిత అలంకార బలం తెలుగు విరామచిహ్నాలు, అనుసంధాన నిర్మాణం ద్వారా నిలిచింది.
theological_decisions:
- issue: కృదంత వర్ణన ఎవరిని సూచిస్తుంది?
  choice: ఈ వచనం 2:14లో గుర్తించిన సమూహం గురించిన వర్ణనను కొనసాగిస్తుంది.
  alternative: ఇది అన్ని కాలాల్లోని యూదులందరి మీద చేసిన సాధారణ ఖండన అని చదవడం.
  rationale: గ్రీకు సపద కృదంత నిర్మాణం మునుపటి వచనంలోని పూర్వపదంతో వ్యాకరణపరంగా అనుసంధానమై ఉంది. అనువాదం ఆ సందర్భాన్ని విశ్వవ్యాప్త జాతి-ఖండనగా విస్తరించదు; పాదటిప్పణి పరిమితిని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలిని వాడాం. మూలంలోని ఆరోపణాత్మక తీవ్రతను తగ్గించలేదు; అయితే ‘హత్య చేశారు’ వంటి ఉద్దేశాన్ని మరింత నిర్దిష్టం చేసే పదాన్ని నివారించాం. మునుపటి వచనంతో ఉన్న వ్యాకరణ సంబంధాన్ని సందర్భం మరియు [c] పాదటిప్పణి ద్వారా కాపాడాం.
