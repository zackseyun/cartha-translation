id: 1TH.2.16
reference: 1 Thessalonians 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κωλυόντων ἡμᾶς τοῖς ἔθνεσιν λαλῆσαι ἵνα σωθῶσιν, εἰς τὸ ἀναπληρῶσαι αὐτῶν τὰς ἁμαρτίας πάντοτε. ἔφθασεν δὲ ἐπ’ αὐτοὺς ἡ ⸀ὀργὴ εἰς τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/016.yaml
  text: by hindering us from speaking to the Gentiles so that they may be saved[a], so as always to fill up the measure of their sins[b]. But wrath has come upon them at last.
translation:
  language: te
  text: వారు అన్యజనులు రక్షణ పొందేలా మేము వారితో మాట్లాడకుండా అడ్డుకుంటున్నారు. ఇలా వారు ఎల్లప్పుడూ తమ పాపాలను పూర్తిగా నింపుతున్నారు. అయితే చివరకు[a] ఉగ్రత[b] వారిమీదికి వచ్చింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “పూర్తిగా,” “అంతం వరకు” (గ్రీకు: εἰς τέλος).'
    reason: lexical_alternative
  - marker: b
    text: “ఉగ్రత” అనేది బహుశా దేవుని తీర్పును సూచిస్తుంది. అయితే పౌలు ఇక్కడ వర్తమానంలోని ఒక చారిత్రక తీర్పును ఉద్దేశించాడా, తుది తీర్పును ఉద్దేశించాడా, లేక రెండింటినీ ఉద్దేశించాడా అనేది స్పష్టంగా చెప్పలేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: κωλυόντων
  choice: అడ్డుకుంటున్నారు
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న నిరోధక చర్యను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; చట్టపరమైన నిషేధమనే అదనపు భావాన్ని చేర్చదు.
- source_word: τοῖς ἔθνεσιν
  choice: అన్యజనులు … వారితో
  rationale: ఇక్కడ భౌగోళిక దేశాలు కాక యూదేతర ప్రజలే ఉద్దేశించబడ్డారు. తెలుగులో ‘అన్యజనులు’ పౌలు వాడుకలోని జాతి-మత భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: λαλῆσαι
  choice: మాట్లాడకుండా
  rationale: κωλυόντων మీద ఆధారపడిన క్రియారూపాన్ని నేరుగా అనువదిస్తుంది; సువార్త ప్రకటన అనే సందర్భార్థాన్ని క్రియలోనే అతిగా చేర్చదు.
- source_word: ἵνα σωθῶσιν
  choice: రక్షణ పొందేలా
  rationale: ఉద్దేశాన్ని, కర్మణి భావాన్ని సహజ తెలుగులో నిలుపుతుంది; రక్షణ స్వరూపాన్ని మరింత సంకుచితం చేయదు.
- source_word: εἰς τὸ ἀναπληρῶσαι
  choice: ఇలా … పూర్తిగా నింపుతున్నారు
  rationale: గ్రీకు నిర్మాణంలోని పరిణామం/ఫలితం వైపున్న బలాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; పాపాలను నింపడమే వారి చైతన్యపూర్వక ఉద్దేశమని నిర్ధారించదు.
- source_word: ἀναπληρῶσαι
  choice: పూర్తిగా నింపుతున్నారు
  rationale: ‘నిండుదలకు తీసుకురావడం’ అనే భావాన్ని నిలుపుతుంది. మూలంలో లేని ‘కొలత’ అనే నామవాచకాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా రూపకాన్ని సంరక్షిస్తుంది.
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: నిరంతరంగా పునరావృతమయ్యే ధోరణిని సూచించే సూటి సమానార్థకం.
- source_word: ἔφθασεν
  choice: వచ్చింది
  rationale: ἐπίతో కలిసి ‘వారిమీదికి వచ్చింది’ అనే సహజ ప్రయోగం సంఘటన చేరిన భావాన్ని ఇస్తుంది; ‘పట్టుకుంది’ వంటి అధిక వ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: ὀργή
  choice: ఉగ్రత
  rationale: తీవ్రమైన, సందర్భంలో దేవునికి సంబంధించిన కోపం/తీర్పు భావాన్ని నిలుపుతుంది; ‘తీర్పు’ అని అనువదించి అర్థాన్ని ముందుగానే నిర్ణయించదు.
- source_word: εἰς τέλος
  choice: చివరకు
  rationale: పదబంధాన్ని కాలపరమైన పరాకాష్ఠగా సహజంగా అందిస్తుంది; ‘పూర్తిగా’ లేదా ‘అంతం వరకు’ అనే సాధ్యమైన అర్థాలను పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: ὀργή యొక్క కర్త మరియు తీర్పు స్వరూపం
  choice: ‘ఉగ్రత’ అని ఉంచి, సందర్భంలో దైవిక ఉగ్రతను సూచించినా అది ఏ ప్రత్యేక తీర్పో ప్రధాన పాఠ్యంలో నిర్ధారించలేదు.
  alternative: ఒక నిర్దిష్ట చారిత్రక తీర్పు; అంత్యకాల తుది తీర్పు; లేదా వర్తమాన-భవిష్యత్ తీర్పు రెండూ.
  rationale: వాక్యం ఉగ్రత వారిమీదికి వచ్చిందని చెబుతుంది గాని, ఆ సంఘటనను స్పష్టంగా గుర్తించదు. అందువల్ల మూలంలోని వేదాంతపరమైన అనిశ్చితిని నిలుపుతుంది.
- issue: εἰς τὸ ἀναπληρῶσαι యొక్క బలం
  choice: చైతన్యపూర్వక ఉద్దేశం కంటే చర్యల ఫలితాన్ని సూచించేలా ‘ఇలా’ అని అనుసంధానించడం.
  alternative: ‘తమ పాపాలను నింపడానికి’ అనే స్పష్టమైన ఉద్దేశార్థం.
  rationale: εἰς τό నిర్మాణం ఉద్దేశం లేదా ఫలితం రెండింటినీ మోయగలదు. సందర్భంలో వారు పాపాలను నింపాలని ఉద్దేశించారనే భావాన్ని అనవసరంగా దిగుమతి చేయకుండా గ్రీకు నిర్మాణంలోని సహజ పరిణామాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ముందు వచనంతో వ్యాకరణ సంబంధం ఉన్న కృదంతాన్ని స్వతంత్ర తెలుగు వాక్యంగా సహజీకరించాం. [a], [b] గుర్తులు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
