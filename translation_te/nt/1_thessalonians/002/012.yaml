  yaml_path: translation/nt/1_thessalonians/002/012.yaml
  text: encouraging[a], comforting, and urging you to walk worthily of God[c][b], who calls you into his own kingdom and glory.
translation:
  language: te
  text: మిమ్మల్ని ప్రోత్సహిస్తూ, ఆదరిస్తూ, గంభీరంగా కోరుతూ,[a] తన సొంత రాజ్యంలోకీ మహిమలోకీ మిమ్మల్ని పిలుస్తున్న దేవునికి తగిన విధంగా మీరు నడుచుకోవాలని.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ఈ మూడు మాటల భావాలు కొంతవరకు ఒకదానితో ఒకటి కలుస్తాయి: ప్రోత్సహించడం, ఆదరించడం, గంభీరంగా కోరడం. చివరి మాటను ‘సాక్ష్యమిస్తూ’ లేదా ‘దృఢంగా విజ్ఞప్తి చేస్తూ’ అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: ‘నడుచుకోవడం’ అనేది ఒకరి జీవన విధానాన్ని సూచించే బైబిలు రూపకం; ‘జీవించాలని’ లేదా ‘ప్రవర్తించాలని’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦντες
  choice: ప్రోత్సహిస్తూ
  rationale: ఈ వర్తమాన కృదంతం పౌలు కొనసాగిస్తూ వచ్చిన తండ్రివంటి పరిచర్యను సూచిస్తుంది. ‘ప్రోత్సహిస్తూ’ అనేది కుటుంబసంబంధమైన సందర్భంలోని ఆదరణతో కూడిన ప్రేరేపణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘హెచ్చరిస్తూ’ అనేది ఇక్కడ అవసరానికి మించిన కఠినతను కలిగించవచ్చు.
- source_word: παραμυθούμενοι
  choice: ఆదరిస్తూ
  rationale: ఈ క్రియ ఓదార్పు, ధైర్యం కలిగించే మాటలను సూచిస్తుంది. ‘ఆదరిస్తూ’ అనేది దుఃఖసందర్భానికే పరిమితం కాకుండా పాస్టరల్ సాన్నిహిత్యాన్ని తెలియజేస్తూ, ముందున్న ‘ప్రోత్సహిస్తూ’ నుండి తగినంత భేదాన్ని ఉంచుతుంది.
- source_word: μαρτυρόμενοι
  choice: గట్టిగా కోరుతూ
  rationale: ఇక్కడ ఈ క్రియకు సాక్ష్యమివ్వడం కంటే గంభీరంగా నొక్కిచెప్పడం లేదా పట్టుదలతో విజ్ఞప్తి చేయడం అనే భావం ప్రధానమైనది. ‘గట్టిగా కోరుతూ’ ఆ బలాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది; అయితే ‘ఆజ్ఞాపిస్తూ’ అనేంత అధికారపూర్వకంగా చేయదు.
- source_word: εἰς τὸ περιπατεῖν ὑμᾶς
  choice: మీరు నడుచుకోవాలని
  rationale: εἰς τό + infinitive నిర్మాణం ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని సూచిస్తుంది. ‘నడుచుకోవడం’ జీవన ప్రవర్తనకు సంబంధించిన బైబిలు రూపకాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ἀξίως τοῦ θεοῦ
  choice: దేవునికి తగిన విధంగా
  rationale: ἀξίως తో వచ్చిన షష్ఠీ విభక్తి ‘దేవునికి తగిన రీతిలో’ అనే భావాన్ని ఇస్తుంది. ‘యోగ్యులుగా’ అని అనువదిస్తే వ్యక్తులు దేవునికి అర్హత సంపాదించాలనే అనవసర భావం కలగవచ్చు; ‘తగిన విధంగా’ జీవనరీతిపై దృష్టిని ఉంచుతుంది.
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: మిమ్మల్ని పిలుస్తున్న
  rationale: వర్తమాన కృదంతపు కొనసాగుతున్న భావాన్ని సహజమైన తెలుగు సంబంధవాచక నిర్మాణంలో నిలుపుతుంది; పిలుపు గతంలో మాత్రమే ముగిసిందని లేదా దాని విధానం ఏమిటని పాఠ్యంలో లేని నిర్ణయం చేయదు.
- source_word: εἰς τὴν ἑαυτοῦ βασιλείαν καὶ δόξαν
  choice: తన సొంత రాజ్యంలోకీ మహిమలోకీ
  rationale: ἑαυτοῦ లోని స్వీయ/ఉద్ఘాటక భావాన్ని ‘తన సొంత’ నిలుపుతుంది. ఒకే εἰς రెండు సమన్విత నామవాచకాలను నియంత్రిస్తున్నందున, తెలుగులో సమాంతరమైన ‘లోకీ … లోకీ’ నిర్మాణంతో రాజ్యమూ మహిమా రెండింటిలో ప్రవేశం లేదా పాలుపంచుకోవడం అనే దిశను స్పష్టంగా ఉంచాం.
theological_decisions:
- issue: περιπατεῖν అనే ‘నడవడం’ రూపకాన్ని ఉంచాలా, సాధారణంగా ‘జీవించాలి’ అని వివరించాలా
  choice: ‘నడుచుకోవాలని’ అని రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘జీవించాలని’ లేదా ‘ప్రవర్తించాలని’
  rationale: తెలుగులో ‘నడుచుకోవడం’ జీవన ప్రవర్తనను సహజంగా సూచిస్తుంది; అందువల్ల మూలంలోని రూపకమూ దాని నైతిక భావమూ రెండూ నిలుస్తాయి. పాదటిప్పణి ప్రత్యక్షార్థాన్ని వివరిస్తుంది.
- issue: τοῦ καλοῦντος లో దేవుని పిలుపు యొక్క కాలబలం
  choice: వర్తమాన రూపమైన ‘పిలుస్తున్న’
  alternative: ‘పిలిచిన’
  rationale: గ్రీకు వర్తమాన కృదంతాన్ని కాపాడుతూ, దేవుని పిలుపు యొక్క సమయం లేదా కార్యవిధానం గురించి పాఠ్యం చెప్పనిదాన్ని సిద్ధాంతపరంగా నిర్ణయించకుండా ఉంటుంది.
- issue: రాజ్యం మరియు మహిమ మధ్య సంబంధం
  choice: ‘రాజ్యంలోకీ మహిమలోకీ’ అని రెండింటినీ సమన్విత గమ్యాలుగా ఉంచడం
  alternative: ‘మహిమగల రాజ్యంలోకి’
  rationale: మూలంలో βασιλείαν మరియు δόξαν καί చేత సమన్వయించబడ్డాయి. ‘మహిమగల రాజ్యం’ అని చేస్తే మహిమను రాజ్యానికి విశేషణంగా మార్చి మూలంలోని సమన్వయాన్ని అనవసరంగా పరిష్కరించినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి ఉపయోగించబడింది. గ్రీకులోని మూడు వర్తమాన కృదంతాల లయను ‘-తూ’ రూపాలతో నిలిపాం. ఈ వాక్యం 11వ వచనంలోని తండ్రి ఉపమానానికి వ్యాకరణపరంగా కొనసాగింపు; తెలుగు వచనం స్వతంత్రంగా చదివినప్పుడు పూర్తి కావడానికి సందర్భంలో అంతర్లీనంగా ఉన్న ప్రధాన క్రియను ‘చెప్పాం’గా చివర చేర్చాం. ‘నడుచుకోవడం’ రూపకం సహజమైన తెలుగు నైతిక వాడుకలో నిలుపబడింది.
