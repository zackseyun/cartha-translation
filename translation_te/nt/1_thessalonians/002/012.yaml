- from: మిమ్మల్ని ప్రోత్సహిస్తూ, ఆదరిస్తూ, గట్టిగా కోరుతూ,[a] తన సొంత రాజ్యంలోకీ మహిమలోకీ మిమ్మల్ని పిలుస్తున్న దేవునికి తగిన విధంగా మీరు నడుచుకోవాలని[b] చెప్పాం.
  to: మిమ్మల్ని ప్రోత్సహిస్తూ, ఆదరిస్తూ, గంభీరంగా కోరుతూ,[a] తన సొంత రాజ్యంలోకీ మహిమలోకీ మిమ్మల్ని పిలుస్తున్న దేవునికి తగిన విధంగా మీరు నడుచుకోవాలని.[b]
