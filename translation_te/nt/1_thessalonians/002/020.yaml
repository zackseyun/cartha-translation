  yaml_path: translation/nt/1_thessalonians/002/020.yaml
  text: For you are our glory and joy[a].
translation:
  language: te
  text: ఎందుకంటే మీరే మా మహిమ, మా ఆనందం[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మహిమ’ అనే పదాన్ని ‘అతిశయానికి కారణం’ లేదా ‘గౌరవం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: మీరే
  rationale: బహువచన ద్వితీయ పురుష సర్వనామం గ్రీకులో స్పష్టంగా ఉండి ఉద్ఘాటనను కలిగిస్తుంది; తెలుగు ‘మీరే’ ఆ బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను తెలిపే అనుసంధాన పదం; ‘ఎందుకంటే’ తార్కిక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐστε
  choice: మీరే …
  rationale: వర్తమానకాలంలోని ‘ఉండు/అవు’ అనే సంధాన క్రియ; తెలుగు నామవాచక వాక్యంలో ప్రత్యేక క్రియ లేకుండానే ‘మీరే’తో సహజంగా వ్యక్తమవుతుంది.
- source_word: ἡ δόξα ἡμῶν
  choice: మా మహిమ
  rationale: δόξα యొక్క ప్రధాన అర్థమైన ‘మహిమ’ను నిలుపుతూ, ἡμῶν అనే బహువచన స్వామ్యార్థాన్ని ‘మా’గా సహజంగా అందిస్తుంది.
- source_word: ἡ χαρά
  choice: ఆనందం
  rationale: χαρά ఆనందం లేదా సంతోషాన్ని సూచిస్తుంది; వ్యక్తులే వారి ఆనందమని చెప్పే ఈ సందర్భంలో ‘ఆనందం’ ప్రత్యక్షమైన, సహజమైన నామవాచక రూపం.
theological_decisions:
- issue: పౌలు వ్యక్తుల గురించి ఉపయోగించిన δόξα పదానికి అనువాదం
  choice: మహిమ
  alternative: అతిశయానికి కారణం; గౌరవం
  rationale: ఇక్కడ సాంకేతిక సిద్ధాంత ప్రకటనకన్నా, థెస్సలొనీకయులు సేవకులకు మహిమకూ ఆనందానికీ కారణమని చెప్పే సంబంధాత్మక భావం ఉంది. ‘మహిమ’ గ్రీకు పదం యొక్క విస్తృత అర్థాన్నీ వాక్యపు గంభీరతనూ నిలుపుతుంది; ఇతర సందర్భోచిత భావాలను పాదసూచికలో ఉంచడం ద్వారా అసలు పదంలోని అర్థవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గంభీరమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘మీరే’ గ్రీకు సర్వనామంలోని ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది; పునరుక్త ‘మా’ రెండు నామవాచకాల సమాంతరతను స్పష్టం చేస్తుంది.
