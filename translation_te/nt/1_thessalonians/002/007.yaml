id: 1TH.2.7
reference: 1 Thessalonians 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δυνάμενοι ἐν βάρει εἶναι ὡς Χριστοῦ ἀπόστολοι· ἀλλὰ ἐγενήθημεν ⸀ἤπιοι ἐν μέσῳ ὑμῶν, ὡς ⸀ἐὰν τροφὸς θάλπῃ τὰ ἑαυτῆς τέκνα·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/007.yaml
  text: though we could have been a burden as apostles of the Messiah[a], yet we became gentle among you[c][b], as a nursing mother cherishes her own children.
translation:
  language: te
  text: మెస్సీయ[b] అపొస్తలులుగా మేము మీకు భారంగా ఉండగలిగేవాళ్లం[a]. అయినప్పటికీ, పాలిచ్చే తల్లి[c] తన సొంత పిల్లలను ఆప్యాయంగా చూసుకుంటున్నట్లుగా, మేము మీ మధ్య సౌమ్యులమయ్యాం[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “బరువుగా ఉండగలిగేవాళ్లం.” లేదా “మా అధికారాన్ని చాటగలిగేవాళ్లం,” “మీపై కోరికలు మోపగలిగేవాళ్లం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'సంప్రదాయ అనువాదం: “క్రీస్తు అపొస్తలులుగా.”'
    reason: alternative_reading
  - marker: c
    text: “పాలిచ్చి పోషించే స్త్రీగా” లేదా “దాదిగా” అని కూడా అనువదించవచ్చు; ఇక్కడి చిత్రం తల్లివంటి ఆప్యాయ సంరక్షణను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: కొన్ని ప్రాచీన ప్రతుల్లో “మేము మీ మధ్య చిన్నపిల్లలమయ్యాం” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: δυνάμενοι
  choice: ఉండగలిగేవాళ్లమే
  rationale: ἀλλάతో ఉన్న వ్యతిరేక సంబంధం ఈ కృదంతానికి అనుమతిని లేదా సామర్థ్యాన్ని సూచించే భావం ఇస్తుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ἐν βάρει εἶναι
  choice: మీకు భారంగా ఉండగలిగేవాళ్లమే
  rationale: గ్రీకు పదబంధంలోని ‘బరువు/భారం’ రూపకాన్ని నిలుపుతూ, ఆర్థిక భారం మాత్రమే అని పరిమితం చేయకుండా అపొస్తలుల హోదాతో ఒత్తిడి చేయడం లేదా హక్కులు కోరడం అనే విస్తృత భావానికి చోటిస్తుంది.
- source_word: ὡς Χριστοῦ ἀπόστολοι
  choice: మెస్సీయ అపొస్తలులుగా
  rationale: Χριστοῦ ఇక్కడ బిరుదుగా పనిచేస్తుంది; అందువల్ల ‘మెస్సీయ’ అని అనువదించాం. సంబంధార్థక షష్ఠీ విభక్తిని తెలుగులో సహజమైన సమాసంతో వ్యక్తం చేశాం.
- source_word: ἀλλὰ ἐγενήθημεν
  choice: అయినా ... సౌమ్యులమయ్యాం
  rationale: ‘అయినా’ ముందున్న సామర్థ్య ప్రకటనతో వ్యతిరేకతను చూపుతుంది; ‘అయ్యాం’ γίνομαιలోని అవడం/కావడం అనే క్రియాబలాన్ని నిలుపుతుంది.
- source_word: ἤπιοι
  choice: సౌమ్యులమయ్యాం
  rationale: ἤπιοςలోని మృదుత్వం, దయతో వ్యవహరించే స్వభావం రెండింటినీ ‘సౌమ్యులు’ గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν μέσῳ ὑμῶν
  choice: మీ మధ్య
  rationale: మూలంలోని స్థానసంబంధ భావానికి సహజమైన తెలుగు సమానం.
- source_word: ὡς ἐὰν τροφὸς
  choice: పాలిచ్చే తల్లి ... చూసుకున్నట్టుగా
  rationale: τροφός పాలిచ్చి పోషించే స్త్రీని సూచిస్తుంది. తరువాత ‘తన సొంత పిల్లలు’ అని ఉన్నందున, వైద్యసేవకురాలు అనే అపార్థం రాకుండా ‘పాలిచ్చే తల్లి’ అని అనువదించాం.
- source_word: θάλπῃ
  choice: ఆప్యాయంగా చూసుకున్నట్టుగా
  rationale: క్రియ యొక్క మూలార్థం వెచ్చగా ఉంచడం; సందర్భంలో అది మృదువుగా పోషించి జాగ్రత్తగా చూసుకోవడాన్ని సూచిస్తుంది. తెలుగు పదబంధం ఆ ప్రేమపూర్వక సంరక్షణను సహజంగా తెలియజేస్తుంది.
- source_word: τὰ ἑαυτῆς τέκνα
  choice: తన సొంత పిల్లలను
  rationale: τέκναను ‘పిల్లలు’ అని, ἑαυτῆς ఇచ్చే స్వకీయ ఉద్ఘాటనను ‘సొంత’తో స్పష్టంగా నిలిపాం.
theological_decisions:
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ పదం ఇక్కడ వ్యక్తినామంలా కాక బిరుదుగా వాడబడింది. సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఉంచాం.
- issue: అపొస్తలుల ‘భారం’ స్వరూపం
  choice: మీకు భారంగా ఉండడం
  alternative: మా అధికారాన్ని చాటడం / మీపై కోరికలు మోపడం
  rationale: ἐν βάρει εἶναιలోని రూపకాన్ని ప్రధాన పాఠంలో నిలిపి, అది ఆర్థిక భారం మాత్రమేనా లేక అపొస్తలుల హోదా ద్వారా ఒత్తిడి చేయడమా అన్న ఉద్రిక్తతను నిర్ణయించకుండా ఉంచాం.
- issue: ἤπιοι పాఠాంతరం
  choice: సౌమ్యులు
  alternative: చిన్నపిల్లలు
  rationale: ఇచ్చిన SBLGNT ప్రధాన పాఠంలోని ἤπιοιను అనుసరించాం; νήπιοι అనే ప్రాచీన పాఠాంతరం భావాన్ని గణనీయంగా మార్చేందున పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘భారంగా ఉండడం’ అనే రూపకాన్ని ఉద్దేశపూర్వకంగా నిలిపి, అధికార వినియోగం మరియు భౌతిక భారం మధ్య భావవ్యాప్తిని పాదసూచికలో చూపించాం. తల్లితనపు ఉపమానాన్ని సహజంగా వినిపించేలా వాక్యక్రమాన్ని అమర్చాం.
