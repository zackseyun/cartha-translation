id: 1TH.2.8
reference: 1 Thessalonians 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως ὁμειρόμενοι ὑμῶν εὐδοκοῦμεν μεταδοῦναι ὑμῖν οὐ μόνον τὸ εὐαγγέλιον τοῦ θεοῦ ἀλλὰ καὶ τὰς ἑαυτῶν ψυχάς, διότι ἀγαπητοὶ ἡμῖν ⸀ἐγενήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/008.yaml
  text: So[a], longing for you in this way, we were pleased to share with you not only the gospel of God but also our own lives[b], because you had become dear to us.
translation:
  language: te
  text: ఈ విధంగా, మిమ్మల్ని ఎంతో ఆప్యాయంగా కోరుకుంటూ, దేవుని సువార్తను మాత్రమే కాక మా సొంత ప్రాణాలను కూడా మీతో పంచుకోవడానికి మేము సంతోషంగా సిద్ధపడ్డాము; ఎందుకంటే మీరు మాకు ప్రియులయ్యారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: అలాగే
  rationale: ముందున్న పాలిచ్చి పోషించే తల్లి ఉపమానంలో వర్ణించిన విధానాన్ని ఈ వాక్యంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: ὁμειρόμενοι ὑμῶν
  choice: మీ మీద ఎంతో మమకారంతో
  rationale: అరుదైన ఈ క్రియారూపం గాఢమైన అనురాగాన్ని, ఆప్యాయమైన ఆకాంక్షను సూచిస్తుంది; తెలుగులో ‘మమకారం’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εὐδοκοῦμεν
  choice: మేము సంతోషించాం
  rationale: కేవలం సమ్మతి కాకుండా ఇష్టపూర్వకమైన ఆనందాన్ని సూచిస్తుంది.
- source_word: μεταδοῦναι
  choice: పంచుకోవడానికి
  rationale: తమకు చెందినదానిలో ఇతరులకు భాగం ఇవ్వడం అనే భావాన్ని సువార్తకూ ప్రాణాలకూ సరిపోయేలా వ్యక్తం చేస్తుంది.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: దేవుని సువార్తను
  rationale: మూలంలోని జనిటివ్ సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘సువార్త’ స్థిరపడిన, సులభంగా అర్థమయ్యే పదం.
- source_word: τὰς ἑαυτῶν ψυχάς
  choice: మా ప్రాణాలను సైతం
  rationale: ఇక్కడ ψυχή వేరైన అభౌతిక ఆత్మను కాక జీవితం లేదా స్వయాన్ని అర్పించడాన్ని సూచిస్తుంది; ‘ప్రాణాలు’ త్యాగపూర్వక స్వీయార్పణను బలంగా తెలియజేస్తుంది.
- source_word: διότι
  choice: ఎందుకంటే
  rationale: వారి స్వీయార్పణకు కారణాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: ἀγαπητοὶ ἡμῖν ἐγενήθητε
  choice: మీరు మాకు ప్రియులయ్యారు
  rationale: వారు అపొస్తలులకు ప్రియమైనవారిగా మారిన ఫలితస్థితిని సంక్షిప్తంగా, ఆప్యాయంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: τὰς ἑαυτῶν ψυχάς లో ψυχάς భావం
  choice: ‘మా ప్రాణాలను’ అని అనువదించడం
  alternative: ‘మా ఆత్మలను’ లేదా ‘మమ్మల్నే’
  rationale: సందర్భం శరీరం–ఆత్మ విభజనను బోధించడం గురించి కాక, వ్యక్తిగతమైన త్యాగపూర్వక స్వీయార్పణ గురించి. ‘ప్రాణాలు’ ఆ భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- issue: ἀγαπητοὶ యొక్క సంబంధాత్మక భావం
  choice: ‘మాకు ప్రియులయ్యారు’
  alternative: ‘మాచేత ప్రేమించబడినవారయ్యారు’
  rationale: మూలంలోని ఆప్యాయ సంబంధాన్ని నిలుపుతూ, అనవసరమైన సాంకేతిక లేదా సిద్ధాంతపరమైన ఛాయను చేర్చకుండా సహజంగా ఉంటుంది.
- issue: ὁμειρόμενοι యొక్క వ్యాకరణ సంబంధం
  choice: విధానాన్ని/భావస్థితిని తెలిపే ‘మీ మీద ఎంతో మమకారంతో’
  alternative: కారణార్థకంగా ‘మేము మిమ్మల్ని ఎంతో కోరుకున్నందున’
  rationale: గ్రీకు కృదంతం ప్రధాన క్రియతో ఉన్న సంబంధంలో కొంత అనిశ్చితిని అనుమతిస్తుంది. కారణాన్ని ఖచ్చితంగా నిర్ధారించకుండా, ప్రేమతో కూడిన భావస్థితిని ప్రధాన పాఠంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మమకారం,’ ‘ప్రాణాలు సైతం,’ ‘ప్రియులయ్యారు’ అనే పదబంధాలు మూలంలోని ఆప్యాయతను, స్వీయార్పణను సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తాయి.
