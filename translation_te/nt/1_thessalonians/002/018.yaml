reference: 1 Thessalonians 2:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀διότι ἠθελήσαμεν ἐλθεῖν πρὸς ὑμᾶς, ἐγὼ μὲν Παῦλος καὶ ἅπαξ καὶ δίς, καὶ ἐνέκοψεν ἡμᾶς ὁ Σατανᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/018.yaml
  text: Because we wanted to come to you—I[a], Paul, again and again—but Satan hindered us.
translation:
  language: te
  text: ఎందుకంటే మేము మీ దగ్గరికి రావాలని కోరుకున్నాం—నేను పౌలు మాత్రం, ఒకటికి రెండుసార్లు[a]—కాని సాతాను మమ్మల్ని అడ్డుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ఒకసారి, రెండుసార్లు”; అంటే ఒకటి కంటే ఎక్కువసార్లు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని పరిచయం చేసే వివరణాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἠθελήσαμεν
  choice: మేము ... రావాలని కోరుకున్నాం
  rationale: θέλω లోని సంకల్పం లేదా కోరికను అతిగా బలపరచకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: మీ దగ్గరికి రావాలని
  rationale: వారి వైపు రావడం అనే మూలంలోని దిశాభావాన్ని నిలుపుతుంది; ‘సందర్శించాలని’ లేదా ‘తిరిగి రావాలని’ అనే అదనపు వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: ἐγὼ μὲν Παῦλος
  choice: ముఖ్యంగా పౌలు అనే నేను
  rationale: బహువచనమైన ‘మేము’లోనుండి పౌలు తనను ప్రత్యేకంగా సూచిస్తున్నాడనే μέν యొక్క ఉద్ఘాటనను సహజమైన తెలుగులో వెల్లడిస్తుంది.
- source_word: καὶ ἅπαξ καὶ δίς
  choice: ఒకటికి రెండుసార్లు
  rationale: ‘ఒకసారి, రెండుసార్లు’ అనే మూల నుడికారాన్ని తెలుగు పాఠకుడికి అర్థమయ్యే రీతిలో, ఒకటి కంటే ఎక్కువ సందర్భాలు అనే భావంతో అందిస్తుంది.
- source_word: ἐνέκοψεν
  choice: అడ్డుకున్నాడు
  rationale: ప్రయాణ ప్రయత్నానికి ఆటంకం కలిగించడం అనే భావాన్ని తెలియజేస్తుంది; మూలపదం అనుమతించేదానికంటే ఎక్కువగా సంపూర్ణ నిరోధాన్ని సూచించదు.
- source_word: ὁ Σατανᾶς
  choice: సాతాను
  rationale: కొత్త నిబంధనలో వ్యక్తిగత నామం లేదా బిరుదుగా వాడబడే పదానికి తెలుగులో స్థిరపడిన రూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పౌలు ప్రయాణానికి కలిగిన ఆటంకంలో సాతాను కార్యసాధకత్వం
  choice: కాని సాతాను మమ్మల్ని అడ్డుకున్నాడు
  alternative: కాని విరోధి మమ్మల్ని అడ్డుకున్నాడు
  rationale: మూలపాఠం ఆటంకాన్ని వ్యక్తిగతంగా సాతానుకే ఆపాదిస్తుంది. దానిని పరిస్థితుల వల్ల కలిగిన నిర్జీవ ఆటంకంగా మార్చకుండా, అలాగే సంపూర్ణ నిర్ణయవాదంగా బలపరచకుండా ఉన్న ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా, గౌరవప్రదంగా ఉండే శైలి. డాష్‌ల మధ్య భాగం బహువచనమైన ‘మేము’లో పౌలును ప్రత్యేకంగా చూపిస్తుంది.
