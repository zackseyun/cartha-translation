source:
  edition: SBLGNT
  text: Αὐτοὶ γὰρ οἴδατε, ἀδελφοί, τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς ὅτι οὐ κενὴ γέγονεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/002/001.yaml
  text: For you yourselves know[a], brothers, that our coming to you was not in vain,
translation:
  language: te
  text: ఎందుకంటే, సహోదరులారా, మేము మీ దగ్గరకు రావడం వ్యర్థం కాలేదని మీరే తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహోదర సహోదరీలారా’; గ్రీకులో ‘సహోదరులు’ అని ఉంది. ఈ పుంలింగ రూపం తరచుగా విశ్వాస సమాజమంతటినీ ఉద్దేశించి వాడబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: మీకే
  rationale: తెస్సలొనీకయుల ప్రత్యక్ష జ్ఞానాన్ని నొక్కిచెప్పే intensive భావాన్ని సహజమైన తెలుగులో ‘మీకే’ తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలోని మాటకు కారణం లేదా ఆధారం చూపే అనుసంధానాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οἴδατε
  choice: తెలుసు
  rationale: రూపరీత్యా perfect అయినప్పటికీ οἶδα ఇక్కడ వర్తమానార్థంలో ‘తెలుసు’ అని సహజంగా అర్థమవుతుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు పుంలింగ సంబోధన రూపాన్ని గౌరవంగా, మూలరూపానికి దగ్గరగా నిలుపుతుంది; ఇది విశ్వాసుల సమాజమంతటినీ సూచించవచ్చనే విషయాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: τὴν εἴσοδον ἡμῶν τὴν πρὸς ὑμᾶς
  choice: మేము మీ దగ్గరికి రావడం
  rationale: అక్షరార్థమైన ‘మా ప్రవేశం’ కంటే, పౌలు బృందం వారి వద్దకు వచ్చిన సంఘటనను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; πρὸς ὑμᾶς యొక్క దిశార్థాన్ని ‘మీ దగ్గరికి’ నిలుపుతుంది.
- source_word: ὅτι
  choice: అని
  rationale: వారికి తెలిసిన విషయవస్తువును పరిచయం చేసే content conjunction‌గా సహజమైన తెలుగు రూపం.
- source_word: οὐ κενὴ γέγονεν
  choice: వ్యర్థం కాలేదు
  rationale: κενή యొక్క ‘ఖాళీగా, ఫలితం లేకుండా, వ్యర్థంగా’ అనే పరిధిలో సందర్భానుకూలమైన మూల్యాంకన భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; γέγονεν సూచించే పూర్తయిన సంఘటనకు కొనసాగుతున్న ప్రాముఖ్యతను తెలుగు perfect-negative నిర్మాణం సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: మిశ్రమ విశ్వాస సమాజాన్ని ఉద్దేశించిన ἀδελφοί అనువాదం
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా
  rationale: మూలంలోని పుంలింగ బహువచన సంబోధనను ప్రధాన పాఠ్యంలో నిలుపుతూ, పౌలు వాడుకలో అది స్త్రీపురుషులందరితో కూడిన విశ్వాస సమాజాన్ని ఉద్దేశించవచ్చనే విస్తృత సూచనను పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా అర్థమయ్యే వాక్యనిర్మాణం. ‘మీకే’ ద్వారా మూలంలోని ఉద్ఘాటనను, ‘వ్యర్థం కాలేదు’ ద్వారా κενή యొక్క సందర్భార్థాన్ని నిలిపాం.
