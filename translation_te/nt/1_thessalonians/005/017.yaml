  text: ἀδιαλείπτως προσεύχεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/017.yaml
  text: Pray without ceasing[a].
translation:
  language: te
  text: ఎడతెగకుండా ప్రార్థించండి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నిరంతరం ప్రార్థించండి’ లేదా ‘మానకుండా ప్రార్థించండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδιαλείπτως
  choice: ఎడతెగకుండా
  rationale: ఈ క్రియావిశేషణం ఆగిపోని లేదా క్రమంగా కొనసాగుతున్న పట్టుదలగల విధానాన్ని సూచిస్తుంది. ‘ఎడతెగకుండా’ మూలంలోని బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ప్రతి క్షణమూ మాటలతో ప్రార్థించాలనే అతిశయార్థాన్ని తప్పనిసరిగా రుద్దదు.
- source_word: προσεύχεσθε
  choice: ప్రార్థించండి
  rationale: ఇది బహువచన వర్తమాన ఆజ్ఞారూపం; కొనసాగుతూ అలవాటుగా చేసే కార్యానికి పిలుపునిస్తుంది. ‘ప్రార్థించండి’ ఆజ్ఞాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది; కొనసాగుదల భావాన్ని ‘ఎడతెగకుండా’ ఇప్పటికే వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆజ్ఞ యొక్క ఆచరణాత్మక భావం
  choice: ప్రార్థనలో నిరంతర పట్టుదల చూపాలనే సాధారణ ప్రోత్సాహంగా వాక్యాన్ని అనువదించడం
  alternative: ప్రతి క్షణమూ విరామం లేకుండా మాటలతో ప్రార్థించాలనే అక్షరార్థ అవగాహన
  rationale: వర్తమాన ఆజ్ఞారూపం, ἀδιαλείπτως అనే క్రియావిశేషణంతో కలిసి, ప్రార్థనలో కొనసాగుతున్న అంకితభావాన్ని, క్రమమైన పట్టుదలను ప్రోత్సహిస్తుంది. అనువాదం ఈ భావవిస్తృతిని నిలుపుతూ ప్రత్యేకమైన సిద్ధాంత లేదా తపస్వి వ్యాఖ్యానాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవప్రదమైన ఆజ్ఞారూపం. బహువచన సంబోధనను ‘ప్రార్థించండి’ ద్వారా స్పష్టంగా ఉంచాం.
