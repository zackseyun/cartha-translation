  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄρα οὖν μὴ καθεύδωμεν ⸀ὡς οἱ λοιποί, ἀλλὰ γρηγορῶμεν καὶ νήφωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/006.yaml
  text: So then[a], let us not sleep as the rest do[b], but let us stay awake and be sober.
translation:
  language: te
  text: కాబట్టి, మనం మిగతావారిలా నిద్రపోక, మేలుకొని[a] ఉందాం; మత్తు లేకుండా[b] ఉందాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అప్రమత్తంగా ఉందాం.’ గ్రీకు క్రియ మేలుకొని ఉండడాన్ని లేదా జాగరూకతను నొక్కి చెప్పగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఆత్మనిగ్రహంతో ఉందాం’ లేదా ‘స్పష్టబుద్ధితో ఉందాం.’ గ్రీకు క్రియ మత్తు లేకపోవడాన్ని, విస్తృతార్థంలో మానసిక అప్రమత్తతను మరియు నిగ్రహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: కాబట్టి
  rationale: ఈ రెండు అనుమానార్థక అవ్యయాలు ముందున్న సందర్భం నుంచి వచ్చే నిర్ణయాన్ని బలపరుస్తాయి. ఆధునిక తెలుగులో ‘కాబట్టి’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μὴ καθεύδωμεν
  choice: మనం ... నిద్రపోకుండా
  rationale: μήతో కూడిన వర్తమానకాల ప్రథమ పురుష బహువచన సంభావనార్థక క్రియ ఇక్కడ సామూహిక ప్రోత్సాహాన్ని సూచిస్తుంది. సందర్భంలో నిద్ర రూపకార్థకమైనా, మూలపాఠంలోని చిత్రాన్ని అలాగే ఉంచాం.
- source_word: ὡς οἱ λοιποί
  choice: మిగతావారిలా
  rationale: οἱ λοιποί పరిసర సందర్భంలో విశ్వాసులకు భిన్నంగా ఉన్న ఇతరులను సూచిస్తుంది. ‘మిగతావారిలా’ సంక్షిప్తంగా, సహజంగా ఆ వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἀλλὰ
  choice: -కుండా,
  rationale: తెలుగులో ‘నిద్రపోకుండా, మేలుకొని’ అనే వ్యతిరేక నిర్మాణం ἀλλά తెలిపే బలమైన వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యేకంగా ‘కాని’ చేర్చడం అవసరం లేదు.
- source_word: γρηγορῶμεν
  choice: మేలుకొని ఉందాం
  rationale: ఈ క్రియ మెలకువతో ఉండడం లేదా అప్రమత్తంగా ఉండడం అనే భావాలను కలిగి ఉంది. నిద్ర అనే ముందరి రూపకానికి నేరమైన వ్యతిరేకతను ‘మేలుకొని’ నిలుపుతుంది.
- source_word: νήφωμεν
  choice: మత్తులేక ఉందాం
  rationale: νήφω నేరుగా మత్తులేక ఉండడాన్ని, విస్తృతార్థంలో స్పష్టబుద్ధి మరియు నిగ్రహాన్ని సూచిస్తుంది. ‘మత్తులేక’ మూలపదంలోని చిత్రాన్ని, దాని నైతిక భావసూచనను రెండింటినీ పూర్తిగా ఒకే అర్థానికి పరిమితం చేయకుండా ఉంచుతుంది.
theological_decisions:
- issue: నిద్ర–మేలుకొనడం అనే రూపకం
  choice: నైతిక-ఆధ్యాత్మిక హెచ్చరికగా ఉన్నప్పటికీ, నిద్ర మరియు మేలుకొనడం అనే చిత్రాన్ని ప్రధాన పాఠంలో నిలుపడం.
  alternative: అజాగ్రత్తగా ఉండడం–అప్రమత్తంగా ఉండడం అని భావానువాదం చేయడం.
  rationale: పరిసర వచనాలు వెలుగు సంబంధులైన విశ్వాసులను రాత్రితో సంబంధం ఉన్న మిగతావారితో వ్యత్యాసపరుస్తాయి. రూపకాన్ని నిలపడం ద్వారా పౌలు వాడిన ధార్మిక చిత్రణను అతిగా వివరించకుండా కాపాడాం.
- issue: νήφω యొక్క భావపరిధి
  choice: ‘మత్తులేక ఉందాం’ అని అనువదించి, నేరార్థం మరియు రూపకార్థం మధ్యనున్న ఉద్వేగాన్ని నిలుపడం.
  alternative: ‘ఆత్మనిగ్రహంతో ఉందాం’ లేదా ‘స్పష్టబుద్ధితో ఉందాం’ అని అనువదించడం.
  rationale: ఈ పదంలో మద్యమత్తు లేకపోవడం అనే నేరార్థంతో పాటు మానసిక అప్రమత్తత, నిగ్రహం అనే విస్తృతార్థాలు ఉండవచ్చు. ప్రధాన పాఠంలో ఒక్క అమూర్తమైన సద్గుణానికే దాని భావాన్ని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సామూహిక ప్రోత్సాహ శైలిని ఉపయోగించాం. ‘నిద్రపోకుండా—మేలుకొని’ అనే వ్యత్యాసాన్ని స్పష్టంగా ఉంచి, ‘మత్తులేక’ ద్వారా మూలంలోని నేరార్థం మరియు రూపకార్థం రెండింటికీ స్థలం ఇచ్చాం.
