review_pass:
  verdict: revise
  source_fidelity: The draft preserves the inferential force of ἄρα οὖν, the sleep/wake contrast, and the literal sobriety imagery of νήφω. However, the Telugu coordination and the expression ‘మత్తులేక’ are not idiomatic enough for the two parallel Greek exhortations.
  naturalness: ‘మేలుకొని[a], మత్తులేక[b] ఉందాం’ is grammatically and stylistically awkward in modern standard Telugu. ‘మత్తు లేకుండా’ is the normal form, and repeating ‘ఉందాం’ gives each coordinate exhortation clear scope.
  terminology: ‘మిగతావారిలా,’ ‘నిద్రపోక,’ and ‘మేలుకొని’ are suitable. ‘మత్తు లేకుండా ఉండడం’ retains the concrete sobriety image while allowing the contextual figurative force. The lexical alternatives in both notes are appropriate after minor wording adjustments.
  issues:
  - severity: medium
    issue: Awkward coordination of the two exhortations
    rationale: The Greek has two coordinated present hortatory subjunctives, γρηγορῶμεν καὶ νήφωμεν. The draft’s single final ‘ఉందాం’ after ‘మేలుకొని, మత్తులేక’ makes the expression strained and less clearly parallel. Repeating the finite exhortation yields natural Telugu and reflects the Greek coordination.
  - severity: medium
    issue: Nonstandard/awkward form ‘మత్తులేక’
    rationale: Modern standard Telugu normally uses ‘మత్తు లేకుండా’ (or ‘మత్తులో లేక’) rather than the fused form ‘మత్తులేక.’
  revised_text: కాబట్టి, మనం మిగతావారిలా నిద్రపోక, మేలుకొని[a] ఉందాం; మత్తు లేకుండా[b] ఉందాం.
