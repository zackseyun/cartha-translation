revisions:
- from: కాబట్టి మనం మిగతావారిలా నిద్రపోకుండా, మేలుకొని[a], మత్తులేక[b] ఉందాం.
  to: కాబట్టి, మనం మిగతావారిలా నిద్రపోక, మేలుకొని[a] ఉందాం; మత్తు లేకుండా[b] ఉందాం.
  rationale: The revision retains the source text’s metaphorical imagery and its deliberate sobriety vocabulary. It replaces the awkward fused expression ‘మత్తులేక’ with idiomatic ‘మత్తు లేకుండా’ and gives the paired exhortations balanced Telugu expression. The semicolon marks the adversative turn conveyed by ἀλλά without introducing an unnecessary interpretive paraphrase.
