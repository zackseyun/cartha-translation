revisions:
- from: ఎందుకంటే, ప్రభువు దినం రాత్రివేళ దొంగ వచ్చినట్లే వస్తుందని మీకే బాగా తెలుసు.
  to: ఎందుకంటే, ప్రభువు దినం రాత్రివేళ దొంగ వచ్చినట్లే వస్తుందని మీకు స్వయంగా బాగా తెలుసు.
  rationale: The revision corrects the intensive-pronoun rendering while retaining the draft’s accurate terminology, natural word order, explanatory connection, and non-expanded simile.
