id: 1TH.5.2
reference: 1 Thessalonians 5:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτοὶ γὰρ ἀκριβῶς οἴδατε ⸀ὅτι ἡμέρα κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/002.yaml
  text: For you yourselves know very well that the day of the Lord comes like a thief in the night.
translation:
  language: te
  text: ఎందుకంటే, ప్రభువు దినం రాత్రివేళ దొంగ వచ్చినట్లే వస్తుందని మీకు స్వయంగా బాగా తెలుసు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ
  choice: మీకే
  rationale: క్రియలో ఇప్పటికే ఉన్న ద్వితీయ పురుష బహువచన కర్తను ఈ ఉద్ఘాటక సర్వనామం బలపరుస్తుంది. ‘మీకే’ ఆధునిక తెలుగులో ఆ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే అనుసంధాన భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀκριβῶς
  choice: బాగా
  rationale: οἴδατεతో కలిసి ఖచ్చితమైన, సంపూర్ణమైన అవగాహనను సూచిస్తుంది. ‘బాగా తెలుసు’ అనేది తెలుగులో సహజమైన ప్రయోగం; కేవలం సాధారణ పరిచయాన్ని కాక దృఢమైన జ్ఞానాన్ని సూచిస్తుంది.
- source_word: οἴδατε
  choice: తెలుసు
  rationale: జ్ఞానం లేదా అవగాహనను నేరుగా తెలిపే సాధారణ తెలుగు సమానం.
- source_word: ἡμέρα κυρίου
  choice: ప్రభువు దినం
  rationale: ఇది వారపు ఆరాధనా దినాన్ని కాక, ప్రభువు నిర్ణాయకంగా జోక్యం చేసుకునే అంత్యకాల దినాన్ని సూచించే స్థిరమైన బైబిలు పదబంధం.
- source_word: ὡς κλέπτης ἐν νυκτί
  choice: రాత్రివేళ దొంగ వచ్చినట్లే
  rationale: అకస్మాత్తుగా, ఊహించని రీతిలో రావడాన్ని తెలిపే ఉపమానాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: οὕτως ἔρχεται
  choice: వస్తుంది
  rationale: οὕτως సూచించే విధానం ముందున్న ఉపమానంతో తెలుగులోనే స్పష్టమవుతుంది. వర్తమాన రూపం భవిష్య సంఘటనను సజీవంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἡμέρα κυρίου అనే అంత్యకాల పదబంధం
  choice: ప్రభువు దినం
  alternative: ప్రభువు యొక్క దినం; ప్రభువు రోజు
  rationale: సందర్భం దైవిక జోక్యం లేదా తీర్పుకు సంబంధించిన అంత్యకాల దినాన్ని సూచిస్తుంది; వారపు ఆరాధనా దినాన్ని కాదు. ‘ప్రభువు దినం’ బైబిలు ప్రతిధ్వనిని, భావాన్ని నిలుపుతుంది.
- issue: ‘రాత్రివేళ దొంగ’ అనే ఉపమానపు భావం
  choice: ఉపమానాన్ని వివరణాత్మక విస్తరణ లేకుండా యథాతథంగా నిలుపడం
  alternative: ‘ఎవరికీ తెలియకుండా’ లేదా నిర్దిష్ట అంత్యకాల సిద్ధాంతాన్ని చేర్చి వివరించడం
  rationale: మూలపాఠం అకస్మికతను, ఊహించనితనాన్ని సూచిస్తుంది; రహస్య రాక లేదా ప్రత్యేక కాలక్రమ సిద్ధాంతాన్ని స్పష్టంగా చెప్పదు. అందువల్ల అదనపు సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘మీకే’ ద్వారా αὐτοὶ యొక్క ఉద్ఘాటనను, ‘బాగా తెలుసు’ ద్వారా ἀκριβῶς οἴδατε యొక్క సహజ భావాన్ని నిలిపాం. పాదటిప్పణులు అవసరం లేదు.
