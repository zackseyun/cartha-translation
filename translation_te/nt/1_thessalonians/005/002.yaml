review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the explanatory γάρ, the precise knowledge expressed by ἀκριβῶς οἴδατε, the eschatological expression ἡμέρα κυρίου, and the simile of an unexpected thief's arrival at night. However, “మీకే” normally carries an exclusive sense (“to you alone”), whereas αὐτοὶ is intensive (“you yourselves”), not exclusive.
  naturalness: The sentence is otherwise fluent modern standard Telugu. Replacing “మీకే” with “మీకు స్వయంగా” preserves the emphasis without suggesting that only the Thessalonians possess this knowledge.
  terminology: “ప్రభువు దినం” is an appropriate established rendering of ἡμέρα κυρίου in this context. “రాత్రివేళ దొంగ వచ్చినట్లే” naturally retains the simile without adding interpretive detail.
  issues:
  - severity: medium
    issue: “మీకే” renders αὐτοὶ with unintended exclusivity.
    rationale: The suffix -ఏ commonly means “alone/only” in this construction. The Greek intensive pronoun emphasizes the addressees themselves but does not say that the knowledge belongs exclusively to them. “మీకు స్వయంగా” expresses the intensive force more accurately.
  revised_text: ఎందుకంటే, ప్రభువు దినం రాత్రివేళ దొంగ వచ్చినట్లే వస్తుందని మీకు స్వయంగా బాగా తెలుసు.
  revised_footnotes: []
  revision_rationale: The revision corrects the intensive-pronoun rendering while retaining the draft’s accurate terminology, natural word order, explanatory connection, and non-expanded simile.
