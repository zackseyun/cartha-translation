id: 1TH.5.3
reference: 1 Thessalonians 5:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ὅταν λέγωσιν· Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/003.yaml
  text: When they say[a], “Peace and security,” then sudden destruction comes upon them, like labor pains upon a pregnant woman[c][b], and they will certainly not escape.
translation:
  language: te
  text: “శాంతి, భద్రత ఉన్నాయి[a]” అని వారు చెప్పినప్పుడు, అప్పుడు గర్భిణికి ప్రసవ వేదనలు వచ్చినట్లే అకస్మాత్తుగా వినాశనం వారిమీదికి వస్తుంది; వారు ఎంతమాత్రమూ తప్పించుకోరు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్షేమం.”
    reason: ἀσφάλεια అనే పదం సందర్భానుసారం భద్రత లేదా క్షేమం అనే భావాన్ని ఇవ్వగలదు.
  - marker: c
    text: 'గ్రీకులో ఇది బలమైన నిరాకరణ: “వారు ఏ విధంగానూ తప్పించుకోరు.”'
    reason: οὐ μή నిర్మాణంలోని ఉద్ఘాటనను పాఠకునికి తెలియజేస్తుంది.
lexical_decisions:
- source_word: ὅταν λέγωσιν
  choice: వారు చెప్పినప్పుడు
  rationale: ὅτανతో కూడిన వర్తమాన సంభావనార్థక క్రియ భవిష్యత్తులో సంభవించే సందర్భాన్ని సూచిస్తుంది. ‘చెప్పినప్పుడు’ ఆధునిక తెలుగులో సహజంగా ఉండి, నిర్దిష్టంగా చెప్పని బహువచన కర్తను అలాగే ఉంచుతుంది.
- source_word: Εἰρήνη καὶ ἀσφάλεια
  choice: శాంతి, భద్రత ఉన్నాయి
  rationale: εἰρήνηకు ‘శాంతి’, ἀσφάλειαకు ‘భద్రత’ సహజమైన సమానార్థకాలు. గ్రీకులో నామవాచకాలతో మాత్రమే ఉన్న ప్రకటనను తెలుగులో సంపూర్ణంగా వినిపించేందుకు ‘ఉన్నాయి’ చేర్చబడింది.
- source_word: τότε
  choice: అప్పుడు అనే భావాన్ని ‘చెప్పినప్పుడు … వస్తుంది’ నిర్మాణంలో వ్యక్తీకరించడం
  rationale: తెలుగు ‘ఎప్పుడు—అప్పుడు’ నిర్మాణంలో ‘అప్పుడు’ పెట్టవచ్చు; అయితే ఇక్కడ ‘చెప్పినప్పుడు’ తరువాత ప్రధాన వాక్యం నేరుగా రావడం సహజం, మరియు గ్రీకు తెలిపే పర్యవసాన సంబంధం స్పష్టంగానే ఉంటుంది.
- source_word: αἰφνίδιος
  choice: అకస్మాత్తుగా
  rationale: వినాశనం హఠాత్తుగా సంభవించడాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘ఊహించని’ అని అనువదించి వారి మానసిక స్థితిని అదనంగా నిర్ధారించదు.
- source_word: ἐφίσταται
  choice: వారిమీదికి వస్తుంది
  rationale: తీర్పు లేదా విపత్తు ఒకరిమీదికి వచ్చిపడే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; మూలంలోని వర్తమాన రూపం కలిగిన సజీవమైన భవిష్య సూచనను నిలుపుతుంది.
- source_word: ὄλεθρος
  choice: వినాశనం
  rationale: తీవ్రమైన నాశనం లేదా పతనాన్ని సూచిస్తుంది; అది పూర్తిగా ఉనికినే నిర్మూలించడమా అనే సిద్ధాంత నిర్ణయాన్ని పదంలోకి చేర్చదు.
- source_word: ἡ ὠδίν
  choice: ప్రసవ వేదనలు
  rationale: ప్రసవ సమయంలో కలిగే నొప్పులను గౌరవప్రదమైన, విస్తృతంగా అర్థమయ్యే ఆధునిక భాషలో తెలియజేస్తుంది.
- source_word: τῇ ἐν γαστρὶ ἐχούσῃ
  choice: గర్భిణికి
  rationale: అక్షరార్థంగా ‘గర్భంలో కలిగియున్న స్త్రీకి’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ μὴ ἐκφύγωσιν
  choice: వారు ఎంతమాత్రమూ తప్పించుకోరు
  rationale: οὐ μήతో ఉన్న బలమైన భవిష్య నిరాకరణను ‘ఎంతమాత్రమూ’ ద్వారా వ్యక్తం చేస్తుంది; సాధారణ ‘తప్పించుకోరు’ కంటే మూలంలోని ఉద్ఘాటనను మెరుగ్గా నిలుపుతుంది.
theological_decisions:
- issue: అంత్యకాల హెచ్చరికలో ὄλεθρος స్వభావం
  choice: ‘వినాశనం’ అని అనువదించి దాని విధానాన్ని లేదా వ్యవధిని నిర్దిష్టం చేయలేదు.
  alternative: ‘సర్వనాశనం’, ‘నిత్య శిక్ష’ లేదా ‘దుర్గతి’ వంటి మరింత వ్యాఖ్యానాత్మక పదాలు
  rationale: ఈ వచనం తప్పించుకోలేని తీవ్రమైన తీర్పును ప్రకటిస్తుంది; అయితే ὄλεθρος ఒక్కటే ఆ తీర్పు ఉనికి నిర్మూలననా, నిరంతర శిక్షనా, లేక మరొక విధమైన పతనమా అనేది నిర్ణయించదు. అందువల్ల మూలంలోని తీవ్రతతోపాటు దాని సిద్ధాంతపరమైన ఉద్వేగం కూడా నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘గర్భిణి’, ‘ప్రసవ వేదనలు’, ‘వినాశనం’ వంటి పదాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి వచన గంభీరతను నిలుపుతాయి. మూలంలోని అనిర్దిష్ట ‘వారు’ అలాగే ఉంచబడింది.
