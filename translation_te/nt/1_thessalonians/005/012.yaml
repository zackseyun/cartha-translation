id: 1TH.5.12
reference: 1 Thessalonians 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν καὶ προϊσταμένους ὑμῶν ἐν κυρίῳ καὶ νουθετοῦντας ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/012.yaml
  text: We ask you[a], brothers, to acknowledge those who labor among you and lead you in the Lord and admonish you[c][b],
translation:
  language: te
  text: సోదరులారా,[a] మీ మధ్య కష్టపడి పనిచేస్తూ, ప్రభువులో మీకు నాయకత్వం వహిస్తూ[c], మీకు హితబోధ చేస్తున్నవారిని గుర్తించమని[b] మిమ్మల్ని కోరుతున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సోదర సోదరీమణులారా’ అని కూడా అనువదించవచ్చు. గ్రీకులో ‘సోదరులారా’; ఇక్కడ ఇది సంఘమంతటినీ ఉద్దేశించిన సంబోధన.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘గౌరవించమని’ లేదా ‘వారి సేవను గుర్తించమని’.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘ప్రభువులో మీపై బాధ్యత వహిస్తూ’; అక్షరార్థానికి దగ్గరగా, ‘ప్రభువులో మీపై ఉన్నవారు’.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐρωτῶμεν
  choice: మిమ్మల్ని కోరుతున్నాం
  rationale: ఇది ఆజ్ఞ కంటే సౌమ్యమైన సంఘపరమైన విజ్ఞప్తి; ‘కోరుతున్నాం’ ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది స్వల్ప విషయాంతరాన్ని సూచిస్తుంది. ఈ ఒక్క వాక్యంలో ‘ఇక’ లేదా ‘అయితే’ చేరిస్తే మూలంలో ఉన్నదానికంటే ఎక్కువ కాలసూచన లేదా వ్యతిరేక భావం కలగవచ్చు; తెలుగు వాక్యప్రవాహమే మార్పును మోస్తుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పుంలింగ బహువచన సంబోధనను నిలుపుతూ, ఇది సంఘమంతటినీ ఉద్దేశించవచ్చని పాదసూచికలో తెలిపాం.
- source_word: εἰδέναι
  choice: గుర్తించమని
  rationale: ఇక్కడ క్రియ కేవలం సమాచారం పరంగా ‘తెలుసుకోవడం’ కాక, సేవచేసేవారిని గుర్తించి తగిన విలువ ఇవ్వడాన్ని సూచిస్తుంది. ‘గుర్తించండి’ ఆ సంబంధపూర్వక భావాన్ని అనవసరంగా బలపరచకుండా వ్యక్తం చేస్తుంది.
- source_word: κοπιῶντας
  choice: కష్టపడి పనిచేస్తూ
  rationale: క్రియలోని శ్రమతో కూడిన పనిభావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: వారి శ్రమ సంఘం మధ్య జరుగుతోందనే భావాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: προϊσταμένους
  choice: మీకు నాయకత్వం వహిస్తూ
  rationale: ఈ పదం నాయకత్వం, పర్యవేక్షణ, బాధ్యతతో కూడిన సంరక్షణను సూచించగలదు. ‘నాయకత్వం వహిస్తూ’ అధికారాన్ని చూపుతూనే ప్రత్యేక సంఘపాలనా విధానాన్ని రుద్దదు.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: వారి నాయకత్వం ప్రభువుతో ఉన్న సంబంధంలో, ఆయన పరిధిలో నెరవేరుతుందని చూపే సాంప్రదాయబద్ధమైన, పారదర్శకమైన అనువాదం.
- source_word: νουθετοῦντας
  choice: హితబోధ చేస్తున్నవారిని
  rationale: νουθετέωలో ఉపదేశంతో పాటు హెచ్చరిక, దిద్దుబాటు భావాలూ ఉన్నాయి. ‘హితబోధ’ ఈ కాపరి సంబంధమైన సరిదిద్దే ఉపదేశాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ἀδελφοί అనే సంఘ సంబోధన పరిధి
  choice: సోదరులారా
  alternative: సోదర సోదరీమణులారా
  rationale: ముఖ్య పాఠ్యంలో గ్రీకు పుంలింగ రూపాన్ని నిలిపాం; సందర్భంలో మొత్తం సంఘం ఉద్దేశించబడే అవకాశాన్ని పాదసూచికలో స్పష్టం చేశాం.
- issue: సేవా నాయకుల విషయంలో εἰδέναι భావం
  choice: గుర్తించమని
  alternative: గౌరవించమని; తెలుసుకోమని
  rationale: గ్రీకు పదం వారిని గుర్తించి విలువ ఇవ్వడాన్ని సూచించగలదు; అయితే విధేయత లేదా అతిశయమైన భక్తిని స్పష్టంగా ఆజ్ఞాపించదు. అందువల్ల ‘గుర్తించమని’ భావాన్ని సమతుల్యంగా ఉంచుతుంది.
- issue: προϊσταμένους ὑμῶν ἐν κυρίῳ యొక్క అధికార భావం
  choice: ప్రభువులో మీకు నాయకత్వం వహిస్తూ
  alternative: ప్రభువులో మీపై బాధ్యత వహిస్తూ; ప్రభువులో మీపై ఉన్నవారు
  rationale: మూలపదం నాయకత్వం లేదా పర్యవేక్షణతో పాటు శ్రద్ధ తీసుకునే బాధ్యతను కూడా సూచించవచ్చు. ఎంపిక చేసిన రూపం అధికారాన్ని తొలగించదు, అలాగే ఏ ప్రత్యేక సంఘపాలనా సిద్ధాంతాన్నీ ప్రవేశపెట్టదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన సంఘపరమైన శైలి వాడబడింది. మూలంలోని మూడు సమాంతర కృదంత భావాలు—శ్రమించడం, నాయకత్వం వహించడం, హితబోధ చేయడం—ఒకే వర్గానికి చెందినవారిని వర్ణిస్తున్నట్టు వాక్యనిర్మాణంలో నిలుపబడ్డాయి.
