id: 1TH.5.18
reference: 1 Thessalonians 5:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/018.yaml
  text: Give thanks in everything[b][a], for this is God's will in Messiah Jesus for you.
translation:
  language: te
  text: ప్రతి పరిస్థితిలోనూ కృతజ్ఞతలు చెల్లించండి[a]. ఎందుకంటే, మెస్సీయ అయిన యేసులో[b] మీ పట్ల దేవుని చిత్తం ఇదే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరో అనువాదం: “అన్నిటిలోనూ.” గ్రీకు పదబంధం ఏ పరిస్థితిలో ఉన్నా కృతజ్ఞతలు చెల్లించాలని సూచిస్తుంది; చెడుకే కృతజ్ఞతలు చెల్లించాలని తప్పనిసరిగా అర్థం కాదు.'
    reason: lexical_alternative
  - marker: b
    text: 'సంప్రదాయ అనువాదం: “క్రీస్తు యేసులో.”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντί
  choice: ప్రతి పరిస్థితిలోనూ
  rationale: ἐν తో దత్తివ విభక్తిలో ఉన్న παντί కృతజ్ఞత చెప్పవలసిన పరిస్థితిని లేదా పరిధిని సూచిస్తుంది. తెలుగు సహజ ప్రయోగంలో ‘ప్రతి పరిస్థితిలోనూ’ ఈ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; చెడుకే కృతజ్ఞత చెప్పాలని అనవసరంగా సూచించదు.
- source_word: εὐχαριστεῖτε
  choice: కృతజ్ఞతలు చెల్లించండి
  rationale: ఇది వర్తమానకాల క్రియాశీల ఆజ్ఞార్థక బహువచనం. కొనసాగుతూ ఉండవలసిన ఆచరణను సూచించినా, క్రియారూపంలోని కాలాంశాన్ని అతిగా విస్తరించకుండా సహజమైన తెలుగు ఆజ్ఞగా అనువదించబడింది.
- source_word: τοῦτο
  choice: ఇదే
  rationale: ఈ సూచన సర్వనామం వెంటనే ముందున్న కృతజ్ఞత చెప్పాలనే ఉపదేశాన్ని ప్రధానంగా వెనక్కి చూపుతుంది. గ్రీకు వాక్యంలోని సంక్షిప్తతను కాపాడేందుకు వివరణాత్మక పదాలను చేర్చలేదు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న ఆజ్ఞకు కారణం లేదా ఆధారాన్ని పరిచయం చేస్తుంది.
- source_word: θέλημα θεοῦ
  choice: దేవుని చిత్తం
  rationale: θεοῦ ఇక్కడ సహజంగా సంబంధార్థక షష్ఠీ విభక్తి; ‘దేవుని చిత్తం’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టమైన, గౌరవప్రదమైన రూపం.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ అయిన యేసులో
  rationale: Χριστός ఇక్కడ బిరుదుగా తన అర్థాన్ని నిలుపుకుంటుంది. ‘మెస్సీయ అయిన యేసు’ ఆ బిరుదు భావాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది; ‘లో’ అనే రూపాన్ని నిలుపుకోవడం ద్వారా పౌలు వాడే సంబంధ/ఐక్యత భాషను వ్యాఖ్యానాత్మకంగా కుదించలేదు.
- source_word: εἰς ὑμᾶς
  choice: మీ పట్ల
  rationale: వ్యక్తులను సూచించే εἰς ఇక్కడ దిశ, సంబంధం లేదా వర్తింపును తెలియజేయగలదు. ‘మీ పట్ల’ దేవుని చిత్తం విశ్వాసులను ఉద్దేశించి ఉందనే భావాన్ని తెలియజేస్తూ గ్రీకు పదబంధంలోని దిశాత్మక ఛాయను కాపాడుతుంది.
theological_decisions:
- issue: Χριστῷను అర్థవంతమైన బిరుదుగా అనువదించాలా, సంప్రదాయ రూపాన్ని వాడాలా
  choice: మెస్సీయ అయిన యేసులో
  alternative: క్రీస్తు యేసులో
  rationale: Χριστός ఇక్కడ కేవలం అర్థం కోల్పోయిన పేరుగా కాక, అభిషిక్తుడైన మెస్సీయ అనే బిరుదు భావాన్ని ఇంకా మోస్తుంది. ప్రధాన పాఠ్యంలో ఆ భావాన్ని వెల్లడించి, విస్తృతంగా పరిచయమైన సంప్రదాయ రూపాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: ‘ఇదే’ దేనిని సూచిస్తుంది
  choice: గ్రీకు మాదిరిగా సూచనను సంక్షిప్తంగా ఉంచడం
  alternative: ‘కృతజ్ఞతలు చెల్లించడమే’ అని స్పష్టీకరించడం
  rationale: τοῦτο వెంటనే ముందున్న ఆజ్ఞను ప్రధానంగా సూచించినా, దానిని వివరణాత్మక నామవాచక పదబంధంగా మార్చడం మూలంలోని సంక్షిప్తతను తగ్గిస్తుంది. అందువల్ల వాక్యంలోని సహజ సూచన సంబంధాన్ని నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖన పఠనానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. ‘కృతజ్ఞతలు చెల్లించండి’ అనే ప్రయోగం స్పష్టమైన బహువచన ఆజ్ఞను ఇస్తుంది; మూలంలో లేని ‘ఎల్లప్పుడూ’ వంటి పదం చేర్చలేదు.
