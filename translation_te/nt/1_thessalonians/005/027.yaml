source:
  edition: SBLGNT
  text: ⸀ἐνορκίζω ὑμᾶς τὸν κύριον ἀναγνωσθῆναι τὴν ἐπιστολὴν πᾶσιν ⸀τοῖς ἀδελφοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/027.yaml
  text: I put you under oath before the Lord to have this letter read to all the brothers[a][b].
translation:
  language: te
  text: ఈ లేఖ సహోదరులందరికీ చదవబడేలా ప్రభువు పేరట నేను మిమ్మల్ని ప్రమాణబద్ధులను చేస్తున్నాను[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రభువును సాక్షిగా.’ గ్రీకు ప్రయోగం ప్రభువును ప్రమాణానికి సాక్షిగా లేదా అధికారంగా ఆహ్వానించే భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సహోదరులు’ అనే పదం స్త్రీలతో సహా సంఘమంతటినీ సూచించే అవకాశం ఉంది; గ్రీకు ἀδελφοῖς వ్యాకరణపరంగా పుంలింగ బహువచనం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνορκίζω
  choice: ప్రమాణబద్ధులను చేస్తున్నాను
  rationale: ఈ క్రియ ఒకరిని ప్రమాణంతో గంభీరంగా బంధించే భావాన్ని వ్యక్తం చేస్తుంది. ఈ తెలుగు ప్రయోగం కేవలం ‘గట్టిగా ఆదేశిస్తున్నాను’ అనేదానికంటే మూలంలోని ప్రమాణ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τὸν κύριον
  choice: ప్రభువు సాక్షిగా
  rationale: ἐνορκίζωతో వచ్చిన ద్వితీయా విభక్తి రూపం ప్రభువును ప్రమాణానికి అధికారిగా లేదా సాక్షిగా ఆహ్వానించే భావాన్ని కలిగి ఉండవచ్చు. ‘ప్రభువు సాక్షిగా’ అనేది సహజమైన తెలుగులో ఆ గంభీరతను తెలియజేస్తుంది; ‘ప్రభువు పేరట’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἀναγνωσθῆναι
  choice: చదివించండి
  rationale: మూలంలోని aorist passive infinitive ‘చదవబడుట’ అనే భావం ఇస్తుంది. సందర్భంలో పత్రికను సంఘానికి వినిపించేలా చదవడం ఉద్దేశం; ‘చదివించండి’ ఆ causative-passive భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τὴν ἐπιστολήν
  choice: ఈ పత్రికను
  rationale: వ్యాసకర్త ప్రస్తుతం పంపుతున్న రచననే సూచిస్తున్నందున ‘ఈ పత్రిక’ సహజమైన ఆధునిక తెలుగు. ‘లేఖ’ కూడా సాధ్యమే, కాని ‘పత్రిక’ నూతన నిబంధన పత్ర రచనకు గౌరవప్రదమైన, సుపరిచితమైన పదం.
- source_word: πᾶσιν τοῖς ἀδελφοῖς
  choice: సహోదరులందరికీ
  rationale: ἀδελφοῖς వ్యాకరణపరంగా పుంలింగ బహువచనం. పౌలు వాడుకలో ఇది స్త్రీలతో సహా సంఘమంతటినీ సూచించే అవకాశం ఉన్నప్పటికీ, ప్రధాన పాఠంలో మూలరూపాన్ని నిలిపి దాని సమగ్ర పరిధిని పాదటిప్పణిలో వివరించాం.
theological_decisions:
- issue: మిశ్రలింగ సంఘ సందర్భంలో ἀδελφοῖς అనువాదం
  choice: సహోదరులందరికీ
  alternative: సహోదర సహోదరీలందరికీ / విశ్వాసులందరికీ
  rationale: మూల గ్రీకులో పుంలింగ బహువచనమైన ἀδελφοῖς ఉంది. ఇది సంఘంలోని స్త్రీలను కూడా కలుపుకొని ఉండవచ్చు; అయితే ఆ సూచనను ప్రధాన పాఠంలో విస్తరించి నిర్ణయించకుండా, నిజమైన రూపం మరియు సాధ్యమైన సమగ్ర భావం రెండింటినీ పాఠం–పాదటిప్పణి ద్వారా కాపాడాం.
- issue: τὸν κύριον ప్రమాణ సంబంధ భావం
  choice: ప్రభువు సాక్షిగా
  alternative: ప్రభువు పేరట
  rationale: ఈ నిర్మాణం ప్రభువును ప్రమాణానికి సాక్షిగా/అధికారిగా ఆహ్వానించడం లేదా ప్రభువు పేరట ప్రమాణబద్ధం చేయడం అనే సన్నిహిత భావాలకు వీలు ఇస్తుంది. ప్రధాన పాఠంలో సహజమైన తెలుగు రూపాన్ని ఎంచుకొని, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన అపొస్తలిక ఆజ్ఞ స్వరాన్ని నిలిపాం. ‘ప్రమాణబద్ధులను చేస్తున్నాను’ మూలంలోని oath force‌ను కాపాడుతుంది; ‘చదివించండి’ సంఘంలో పత్రిక బహిరంగంగా చదవబడే సందర్భాన్ని సహజంగా వ్యక్తం చేస్తుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠంలో చేర్చబడింది.
