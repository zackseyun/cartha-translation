translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే వాక్య గౌరవాన్ని నిలుపుతూ రూపొందించబడింది. మూలంలోని తీవ్రతను ప్రధాన పాఠంలో ‘అత్యంత’తో, మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
