  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡγεῖσθαι αὐτοὺς ⸀ὑπερεκπερισσοῦ ἐν ἀγάπῃ διὰ τὸ ἔργον αὐτῶν. εἰρηνεύετε ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/013.yaml
  text: and to regard them very highly in love because of their work[a]. Be at peace among yourselves.
translation:
  language: te
  text: వారి పనిని బట్టి ప్రేమతో వారిని అత్యంత ఉన్నతంగా పరిగణించండి.[a] మీ మధ్య శాంతిగా ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రేమతో వారిని మితిమీరినంతగా గౌరవించండి.” గ్రీకు క్రియావిశేషణం అసాధారణమైన తీవ్రతను వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγεῖσθαι
  choice: గౌరవంగా ఎంచండి
  rationale: ఇక్కడ క్రియకు నాయకత్వం వహించడం అనే అర్థం కాక, ఒకరిని ఉన్నతంగా పరిగణించి గౌరవించడం అనే మూల్యాంకన భావం ఉంది.
- source_word: ὑπερεκπερισσοῦ
  choice: అత్యంత
  rationale: అరుదైన ఈ తీవ్రతాసూచక క్రియావిశేషణంలోని అసాధారణ బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν ἀγάπῃ
  choice: ప్రేమతో
  rationale: వారిని గౌరవించే విధానాన్ని సూచిస్తూ ἀγάπη అనే కీలక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: διὰ τὸ ἔργον αὐτῶν
  choice: వారు చేసే పనిని బట్టి
  rationale: διά + ద్వితీయా విభక్తి ఇక్కడ కారణం లేదా ఆధారాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో సహజంగా ఉండేందుకు నామవాచక భావాన్ని క్రియాత్మకంగా వ్యక్తం చేసింది.
- source_word: εἰρηνεύετε
  choice: సమాధానంగా ఉండండి
  rationale: కొనసాగవలసిన శాంతియుత స్థితి లేదా ఆచరణను సూచించే వర్తమాన ఆజ్ఞార్థక భావాన్ని ప్రతిబింబిస్తుంది.
- source_word: ἐν ἑαυτοῖς
  choice: మీలో మీరు
  rationale: విశ్వాసుల సమాజం అంతర్గతంగా పరస్పరం సమాధానంగా ఉండాలనే బహువచన ఆత్మవాచక భావాన్ని నిలుపుతుంది.
- source_word: καὶ
  choice: మరియు అనే పదాన్ని విడిగా ఉంచకుండా వాక్య అనుసంధానంలో తెలిపింది
  rationale: ఈ వచనం ముందటి వచనంలోని ఆజ్ఞకు కొనసాగింపు; తెలుగులో విడిగా ‘మరియు’ పెట్టడం కంటే సహజ వాక్యప్రవాహమే ఆ అనుసంధానాన్ని తెలియజేస్తుంది.
- source_word: αὐτούς
  choice: వారిని
  rationale: ముందటి వచనంలో సంఘంలో శ్రమించి, నడిపించి, హెచ్చరించేవారిని సూచించే సర్వనామాన్ని నేరుగా అనువదిస్తుంది.
