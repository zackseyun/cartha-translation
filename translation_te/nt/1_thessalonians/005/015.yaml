id: 1TH.5.15
reference: 1 Thessalonians 5:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινι ἀποδῷ, ἀλλὰ πάντοτε τὸ ἀγαθὸν ⸀διώκετε εἰς ἀλλήλους καὶ εἰς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/015.yaml
  text: See to it that no one repays evil for evil to anyone[b][a], but always pursue what is good toward one another and toward all people.
translation:
  language: te
  text: ఎవరూ ఎవరికీ కీడుకు ప్రతిగా కీడు చేయకుండా చూసుకోండి.[a] దానికి బదులు, ఒకరి పట్ల ఒకరు, అందరి పట్లా ఎల్లప్పుడూ మేలు చేయడానికి పాటుపడండి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఎవరైనా ఎవరికైనా కీడుకు ప్రతిగా కీడు చేయకుండేలా జాగ్రత్తపడండి.”
    reason: lexical_alternative
  - marker: b
    text: “ఒకరి పట్ల ఒకరు ... అందరి పట్లా” అనే మాటలు తోటి విశ్వాసుల నుంచి మరింత విస్తృతంగా ప్రజలందరి వైపుకు కదులుతున్నట్లు కనిపిస్తున్నాయి.
    reason: cross_reference
lexical_decisions:
- source_word: ὁρᾶτε
  choice: చూసుకోండి
  rationale: ఇక్కడ ఈ క్రియ అక్షరార్థంగా చూడడాన్ని కాకుండా, సంఘమంతా అప్రమత్తంగా ఉండి ఒక విషయం జరగకుండా జాగ్రత్తపడాలనే బహువచన ఆజ్ఞను తెలియజేస్తుంది.
- source_word: μή τις
  choice: ఎవరూ ... చేయకుండా
  rationale: ὁρᾶτεతో కలిసి నివారించవలసిన ప్రవర్తనను సూచిస్తుంది; ఆధునిక తెలుగులో ఈ నిర్మాణం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: కీడుకు ప్రతిగా కీడు
  rationale: ప్రతీకారాన్ని సూచించే మూలభాషలోని పునరుక్తిని, దాని విస్తృత నైతిక భావాన్ని నిలుపుతుంది.
- source_word: τινι
  choice: ఎవరికీ
  rationale: ప్రతీకార చర్యకు గురయ్యే వ్యక్తి ఎవరైనా కావచ్చనే విస్తృత పరిధిని తెలియజేస్తుంది.
- source_word: ἀποδῷ
  choice: చేయకుండా
  rationale: తెలుగులో ‘కీడుకు ప్రతిగా కీడు చేయడం’ ప్రతీకారంగా తిరిగి చెల్లించే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘తిరిగి చెల్లించడం’ అనే అక్షరానువాదం ఈ సందర్భంలో కృత్రిమంగా ఉంటుంది.
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: కాలవ్యాప్తిని సూటిగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὸ ἀγαθὸν
  choice: మేలు
  rationale: నామవాచకంగా వాడిన విశేషణం సూచించే ‘మంచిదైనది’ అనే నైతిక భావాన్ని వ్యక్తుల పట్ల ప్రవర్తన సందర్భంలో సహజమైన తెలుగులో అందిస్తుంది.
- source_word: διώκετε
  choice: చేయడానికి పాటుపడండి
  rationale: కేవలం కోరుకోవడం కాకుండా మేలును చురుకుగా, పట్టుదలతో అనుసరించాలనే ఆజ్ఞ బలాన్ని నిలుపుతుంది.
- source_word: εἰς ἀλλήλους
  choice: ఒకరి పట్ల ఒకరు
  rationale: పరస్పర సంబంధంలో చర్య ఏ దిశగా ఉండాలో సహజమైన తెలుగులో చూపిస్తుంది.
- source_word: καὶ εἰς πάντας
  choice: అందరి పట్లా
  rationale: πάντας యొక్క విశాల పరిధిని నిలుపుతూ, ముందు ఉన్న పరస్పర సమూహాన్ని దాటి విస్తరించే భావానికి అవకాశం ఇస్తుంది.
theological_decisions:
- issue: క్రైస్తవ నైతిక బాధ్యత పరిధి
  choice: ‘ఒకరి పట్ల ఒకరు’ అనే పరస్పర సమూహం నుంచి ‘అందరి పట్లా’ అనే విస్తృత పరిధికి వాక్యం కదులుతున్నట్లు అనువదించబడింది.
  alternative: ‘అందరు’ అనేది విశ్వాసులందరినే సూచిస్తుందని చదవడం.
  rationale: εἰς ἀλλήλους καὶ εἰς πάντας అనే జత సహజంగా అంతర్గత సమూహం నుంచి మరింత విస్తృత సమూహానికి కదులుతుంది. అయితే ‘అందరి’ అనే పదాన్ని మాత్రమే ఉంచడం ద్వారా ఆ పరిధిని వ్యాఖ్యానంలో అతిగా నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘దానికి బదులు’ ప్రతీకారం మరియు మేలు అనే వ్యతిరేక నైతిక దిశల మధ్య సంబంధాన్ని స్పష్టం చేస్తుంది; మూలంలోని ఆజ్ఞ బలం ‘పాటుపడండి’ ద్వారా నిలుపబడింది.
