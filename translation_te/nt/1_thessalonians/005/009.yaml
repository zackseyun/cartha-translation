revisions:
- from: ఎందుకంటే దేవుడు మనలను ఉగ్రతకు నియమించలేదు; దానికి బదులుగా, మన ప్రభువైన యేసు మెస్సీయ[b] ద్వారా రక్షణను పొందడానికి[a] నియమించాడు.
  to: ఎందుకంటే దేవుడు మనలను ఉగ్రతకు నియమించలేదు; కానీ మన ప్రభువైన యేసు మెస్సీయ[b] ద్వారా రక్షణను పొందడానికి[a] నియమించాడు.
  rationale: A single stylistic correction replaces the circumlocutory contrast ‘దానికి బదులుగా’ with direct ‘కానీ,’ corresponding naturally to ἀλλά. All source-sensitive lexical choices, theological restraint, and footnote anchors are retained.
