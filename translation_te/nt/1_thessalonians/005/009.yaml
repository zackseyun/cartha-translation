id: 1TH.5.9
reference: 1 Thessalonians 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔθετο ἡμᾶς ὁ θεὸς εἰς ὀργὴν ἀλλὰ εἰς περιποίησιν σωτηρίας διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/009.yaml
  text: For God did not appoint us for wrath[a], but for obtaining salvation through our Lord Jesus the Messiah[b],
translation:
  language: te
  text: ఎందుకంటే దేవుడు మనలను ఉగ్రతకు నియమించలేదు; కానీ మన ప్రభువైన యేసు మెస్సీయ[b] ద్వారా రక్షణను పొందడానికి[a] నియమించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రక్షణను సొంతం చేసుకోవడానికి,” “రక్షణను సంపాదించడానికి”; “రక్షణలో కాపాడబడడానికి” అని కూడా అర్థం కావచ్చు. περιποίησις అనే గ్రీకు నామవాచకానికి ‘పొందడం’ కంటే విస్తృతమైన అర్థపరిధి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: 'సంప్రదాయ అనువాదం: “యేసు క్రీస్తు.” Χριστός అనే గ్రీకు బిరుదు అర్థాన్ని నిలుపుటకు ఇక్కడ “మెస్సీయ” అని అనువదించాం.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రోత్సాహానికి ఈ వాక్యం కారణాన్ని తెలియజేస్తుంది; అందువల్ల కారణార్థాన్ని సహజమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἔθετο
  choice: నియమించలేదు … నియమించాడు
  rationale: τίθημι ఇక్కడ ఒక ఫలితాన్ని ఉద్దేశించి ఉంచడం లేదా నియమించడం అనే భావం ఇస్తుంది. ప్రతికూల వాక్యంలోని క్రియను రెండవ భాగంలో సహజమైన తెలుగు కోసం పునరుక్తం చేశాం; ‘ముందే నిర్ణయించాడు’ వంటి మరింత బలమైన సిద్ధాంతార్థాన్ని చేర్చలేదు.
- source_word: εἰς ὀργὴν
  choice: ఉగ్రతకు
  rationale: ὀργή పౌలు రాసిన అంత్యకాల సందర్భాల్లో సాధారణంగా దేవుని ఉగ్రతను సూచిస్తుంది. అయితే మూలపాఠంలో ‘దేవుని’ అని ప్రత్యక్షంగా లేనందున ప్రధాన పాఠంలో దానిని చేర్చకుండా సంక్షిప్త రూపాన్ని నిలిపాం.
- source_word: περιποίησιν
  choice: పొందడానికి
  rationale: περιποίησις పొందడం, సొంతం చేసుకోవడం, స్వాధీనం లేదా కాపాడబడడం వంటి విస్తృత అర్థపరిధి కలిగిన పదం. ఈ సందర్భంలో ‘రక్షణను పొందడానికి’ సహజంగా ఉండి, ఉగ్రతతో ఉద్దేశిత ఫలితాన్ని వ్యతిరేకంగా చూపిస్తుంది; ఇతర అవకాశాలను పాదసూచికలో ఉంచాం.
- source_word: σωτηρίας
  choice: రక్షణను
  rationale: పౌలు వాడుకలో σωτηρία సాధారణంగా దేవుడు కలిగించే రక్షణను సూచిస్తుంది; స్థిరమైన తెలుగు బైబిలు పదజాలానికి అనుగుణంగా ‘రక్షణ’ను ఎంచుకున్నాం.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: మన ప్రభువైన యేసు మెస్సీయ ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది కాబట్టి ‘ద్వారా’ అని అనువదించాం. Χριστός వ్యక్తిగత పేరుకు వెంట వచ్చినప్పటికీ అభిషిక్త రాజు అనే బిరుదు భావాన్ని కలిగి ఉండటంతో ‘మెస్సీయ’ అని ఇచ్చాం.
theological_decisions:
- issue: ἔθετο పదానికి మరింత బలమైన ముందస్తు నిర్ణయ భావం ఇవ్వాలా?
  choice: నియమించలేదు
  alternative: ముందే నిర్ణయించలేదు
  rationale: ఈ వాక్యం విశ్వాసుల అంతిమ ఫలితం విషయంలో దేవుని ఉద్దేశాన్ని ప్రకటిస్తుంది. అయితే ముందస్తు నిర్ణయం గురించిన ఒక నిర్దిష్ట సిద్ధాంతవ్యవస్థను మూలపాఠం తప్పనిసరిగా నిర్ధారించదు; ‘నియమించలేదు’ ఆ ఉద్రిక్తతను నిలుపుతుంది.
- issue: Χριστοῦను బిరుదుగా అనువదించాలా, సంప్రదాయ నామరూపంగా ఉంచాలా?
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ యేసుకు సంబంధించిన అభిషిక్తుని బిరుదు భావాన్ని మోస్తుంది. ప్రధాన పాఠంలో దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను వాడి, సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ὀργήను దేవుని ఉగ్రతగా స్పష్టీకరించాలా?
  choice: ఉగ్రత
  alternative: దేవుని ఉగ్రత
  rationale: సందర్భం దేవుని ఉగ్రతను బలంగా సూచించినా, మూల గ్రీకులో సంబంధవాచక పదం లేదు. కాబట్టి ప్రధాన పాఠం మూలంలోని సంక్షిప్తతను, సాధ్యమైన విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘ఉగ్రతకు’ అనే సంక్షిప్త నిర్మాణం మూలపాఠపు గంభీరతను నిలుపుతుంది. రెండవ భాగంలో గ్రీకులో అధ్యాహారంగా ఉన్న ἔθετοను తెలుగులో ‘నియమించాడు’ అని పునరుక్తం చేయడం వాక్యాన్ని సహజంగా, స్పష్టంగా చేస్తుంది.
