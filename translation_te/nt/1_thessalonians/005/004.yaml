id: 1TH.5.4
reference: 1 Thessalonians 5:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς ⸀κλέπτης καταλάβῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/004.yaml
  text: But you[a], brothers, are not in darkness[b], so that the day would overtake you like a thief.
translation:
  language: te
  text: అయితే సహోదరులారా[a], ఆ దినం దొంగలా మిమ్మల్ని పట్టుకునేలా మీరు చీకటిలో[b] లేరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ “సహోదరులు” అనే సంబోధనలో సహోదరీలు కూడా కలిసివుండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: సమీప సందర్భంలో ఇది ప్రభువు దినాన్ని సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: అయితే ... మీరు
  rationale: δέ ముందున్నవారితో వ్యత్యాసాన్ని సూచిస్తుంది; స్పష్టంగా ఉన్న ὑμεῖς ‘మీరు’ అనే పదానికి ఉద్ఘాటన ఇస్తుంది. తెలుగు సహజ వాక్యక్రమంలో రెండింటినీ నిలిపాం.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: సంబోధన బహువచనాన్ని గౌరవప్రదంగా, సహజంగా వ్యక్తపరుస్తుంది; సంఘమంతటినీ ఉద్దేశించే సమగ్ర భావాన్ని పాదసూచికలో తెలిపాం.
- source_word: ἐν σκότει
  choice: చీకటిలో
  rationale: మూలంలోని చీకటి రూపకాన్ని, దాని నైతిక-ఆధ్యాత్మిక ప్రతిధ్వనిని వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: ἵνα
  choice: '... పట్టుకునేలా'
  rationale: వారు చీకటిలో లేకపోవడం మరియు ఆ దినం వారిని పట్టుకోవడం మధ్యనున్న ఫలిత/పర్యవసాన సంబంధాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; ఉద్దేశం లేదా ఫలితం అనే సూక్ష్మభేదాన్ని అతిగా నిర్ణయించదు.
- source_word: ἡ ἡμέρα
  choice: ఆ దినం
  rationale: నిర్దిష్టమైన, సందర్భంలో ఇప్పటికే ప్రస్తావించబడిన అంత్యకాల దినాన్ని సూచిస్తుంది; ప్రధాన పాఠ్యంలో ‘ప్రభువు దినం’ అని విస్తరించలేదు.
- source_word: ὡς κλέπτης
  choice: దొంగలా
  rationale: ὡς సూచించే పోలికను సంక్షిప్తమైన, సహజ ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: καταλάβῃ
  choice: హఠాత్తుగా పట్టుకునే
  rationale: καταλαμβάνω యొక్క అందుకోవడం/పట్టుకోవడం అనే భావాన్ని నిలుపుతూ, దొంగ ఉపమానంలో అంతర్లీనమైన ఆకస్మికతను తెలుగులో స్పష్టం చేస్తుంది; ‘ఆశ్చర్యపరచడం’ అనే పూర్తిగా వివరణాత్మక అనువాదాన్ని నివారిస్తుంది.
theological_decisions:
- issue: మిశ్రమ సంఘాన్ని ఉద్దేశించిన ἀδελφοί అనే లింగసూచక సంబోధన
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా
  rationale: మూలంలోని పురుష బహువచన రూపానికి దగ్గరగా ప్రధాన పాఠ్యాన్ని ఉంచుతూ, అది సంఘంలోని స్త్రీపురుషులందరినీ కలుపుకొని ఉండగలదని పాదసూచికలో సంరక్షించాం.
- issue: ἡ ἡμέρα యొక్క అంత్యకాల సూచన
  choice: ఆ దినం
  alternative: ప్రభువు దినం
  rationale: సమీప సందర్భం దీనిని ప్రభువు దినంగా గుర్తిస్తుంది; అయితే ఈ వచనంలోని గ్రీకు కేవలం ‘దినం’ అంటుంది. అందుచేత విస్తృత పదబంధాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా పాదసూచికలో సందర్భాన్ని తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన సంఘ సంబోధనను ఉపయోగించాం. ‘చీకటి,’ ‘దినం,’ ‘దొంగ’ అనే మూల రూపకాలను నిలిపి, వాక్యాన్ని సాధారణ పాఠకులకు సహజంగా వినిపించేలా అమర్చాం.
