  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/024.yaml
  text: Faithful is the one who calls you[a], who also will do it.
translation:
  language: te
  text: మిమ్మల్ని పిలిచేవాడు నమ్మదగినవాడు; ఆయన దానిని కూడా చేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిమ్మల్ని పిలిచేవాడు నమ్మకమైనవాడు; ఆయన దానిని కూడా నెరవేరుస్తాడు.”
    reason: πιστόςకు ‘నమ్మకమైనవాడు’ అనే సముచిత ప్రత్యామ్నాయాన్ని, ποιήσειకి సందర్భానుగుణమైన ‘నెరవేరుస్తాడు’ అనే ప్రత్యామ్నాయాన్ని చూపిస్తుంది.
lexical_decisions:
- source_word: πιστὸς
  choice: నమ్మదగినవాడు
  rationale: ఇది కర్త యొక్క విశ్వసనీయతను తెలిపే విధేయ విశేషణం. ఆధునిక తెలుగులో ‘నమ్మదగినవాడు’ సహజంగా ఉండి, దేవుడు తాను చెప్పినదాన్ని నెరవేర్చే విశ్వసనీయతను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ καλῶν
  choice: పిలిచేవాడు
  rationale: వర్తమానకాల ఆర్టికల్‌తో కూడిన కృదంతం నామవాచకంగా పనిచేస్తూ, పిలుస్తున్న దేవుణ్ణి సూచిస్తుంది. ‘పిలిచేవాడు’ ఆ కృదంత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὑμᾶς
  choice: మిమ్మల్ని
  rationale: ఇది ద్వితీయ పురుష బహువచన కర్మ. ‘మిమ్మల్ని’ సంఘమంతటినీ ఉద్దేశించిన బహువచనాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὃς καὶ
  choice: ఆయన ... తప్పక
  rationale: సంబంధ సర్వనామం ముందున్న ‘పిలిచేవాడు’నే తిరిగి సూచిస్తుంది; καὶ ఇక్కడ అదే వ్యక్తి కార్యాన్ని కూడా నిశ్చయంగా చేస్తాడనే కొనసాగింపు, ఉద్ఘాటనను ఇస్తుంది. తెలుగులో ‘ఆయన ... తప్పక’ ఆ బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ποιήσει
  choice: దాన్ని ... నెరవేరుస్తాడు
  rationale: ποιέω విస్తృతంగా ‘చేయు, నెరవేర్చు’ అనే అర్థాలిస్తుంది. ముందు వచనంలోని పవిత్రపరచడం, కాపాడడం అనే ప్రార్థనను సూచించే అంతర్లీన కర్మను ‘దాన్ని’గా ఉంచి, భవిష్యత్ కార్యసిద్ధిని ‘నెరవేరుస్తాడు’గా సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: ποιήσει లో అంతర్లీనంగా ఉన్న కర్మ
  choice: దాన్ని తప్పక నెరవేరుస్తాడు
  alternative: దాన్ని చేస్తాడు
  rationale: గ్రీకులో కర్మ చెప్పబడలేదు; అది 23వ వచనంలో ప్రార్థించిన పవిత్రపరచడం, కాపాడడం అనే కార్యాన్ని సూచిస్తుంది. ‘దాన్ని’ ఆ సూచనను తెరిచి ఉంచుతుంది; ‘నెరవేరుస్తాడు’ దేవుడు ఆ కార్యాన్ని కార్యసిద్ధికి తీసుకువస్తాడనే సందర్భార్థాన్ని తెలుగులో సహజంగా ఇస్తుంది.
- issue: πιστὸς యొక్క భావవ్యాప్తి
  choice: నమ్మదగినవాడు
  alternative: నమ్మకమైనవాడు
  rationale: రెండు అనువాదాలూ సాధ్యమే. ‘నమ్మదగినవాడు’ దేవునిపై ఆధారపడవచ్చనే విశ్వసనీయతను నేరుగా తెలియజేస్తుంది; ‘నమ్మకమైనవాడు’ ఆయన విశ్వాసపాత్రతను ఎక్కువగా ముందుకు తెస్తుంది. మూలంలోని భావాన్ని ఏకపక్షంగా పరిమితం చేయకుండా ప్రధాన పాఠంలో మొదటిదాన్ని, పాదటిప్పణిలో ప్రత్యామ్నాయాన్ని ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తంగా, గంభీరంగా అనువదించాం. ‘మిమ్మల్ని’ ద్వారా బహువచనం నిలిపాం. గ్రీకులో కర్మ స్పష్టంగా లేకపోవడాన్ని ‘దాన్ని’ ద్వారా కాపాడుతూ, ముందరి వచనంతో సంబంధాన్ని సహజంగా తెలియజేశాం.
