translation:
  language: te
  text: అన్ని రకాల చెడుకు దూరంగా ఉండండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి విధమైన చెడు నుండి దూరంగా ఉండండి”; సంప్రదాయంగా, “చెడుగా కనిపించే ప్రతి దాని నుండి దూరంగా ఉండండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέχεσθε
  choice: దూరంగా ఉండండి
  rationale: వర్తమానకాల మధ్యమ ఆజ్ఞార్థక బహువచన రూపం నిరంతరంగా విడిగా ఉండాలని పిలుపునిస్తుంది. ‘దూరంగా ఉండండి’ సహజమైన ఆధునిక తెలుగు ప్రయోగంగా ఆజ్ఞ బలాన్ని నిలుపుతుంది.
- source_word: ἀπὸ
  choice: కు దూరంగా
  rationale: ἀπέχομαι క్రియతో కలిసి వేరుపాటు లేదా నివారణను సూచిస్తుంది; తెలుగులో ‘కు దూరంగా ఉండండి’ సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: παντὸς
  choice: అన్ని
  rationale: εἴδους‌తో కలిసి ‘ప్రతి రకం’ అనే సమగ్ర భావం ఇస్తుంది. బహువచన తెలుగు నిర్మాణంలో ‘అన్ని రకాల’ సహజంగా ఉంటుంది.
- source_word: εἴδους
  choice: రకాల
  rationale: ఈ సందర్భంలో ‘కనిపించే రూపం’ కంటే ‘రకం/విధం’ అనే భావమే ఎక్కువ సంభావ్యమైనది. ‘రకాల’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది.
- source_word: πονηροῦ
  choice: చెడు
  rationale: εἴδους‌ను విశేషించే షష్ఠీ ఏకవచన రూపం; ‘చెడు’ మూలంలోని నైతిక దుష్టత్వ భావాన్ని సూటిగా అందిస్తుంది.
theological_decisions:
- issue: ἀπὸ παντὸς εἴδους πονηροῦలో εἴδους అర్థం
  choice: అన్ని రకాల చెడు
  alternative: చెడు యొక్క ప్రతి రూపం; చెడుగా కనిపించే ప్రతిదీ
  rationale: ఈ సందర్భంలో εἶδος‌కు ‘రకం’ లేదా ‘విధం’ అనే అర్థం సహజంగా సరిపోతుంది. సంప్రదాయ ‘appearance of evil’ భావం కేవలం చెడుగా కనిపించేదానినీ నివారించాలి అనే అదనపు అర్థాన్ని కలిగించవచ్చు. నిజమైన పదార్థ ప్రత్యామ్నాయాలను పాదటిప్పణిలో పారదర్శకంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, సంక్షిప్తమైన మరియు గౌరవప్రదమైన ఆజ్ఞారూపాన్ని ఉపయోగించాం. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
