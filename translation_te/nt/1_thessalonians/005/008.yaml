id: 1TH.5.8
reference: 1 Thessalonians 5:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἡμέρας ὄντες νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης καὶ περικεφαλαίαν ἐλπίδα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/008.yaml
  text: But since we are of the day[a], let us be sober, having put on the breastplate of faith and love[b], and the hope of salvation as a helmet.
translation:
  language: te
  text: అయితే మనం పగటివారమైనందున, విశ్వాసాన్నీ[a] ప్రేమనూ ఛాతీ కవచంగా, రక్షణ నిరీక్షణను తలకవచంగా[b] ధరించుకొని, మత్తు లేకుండా ఉందాం.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వసనీయతను.” గ్రీకు πίστις అనే పదానికి “విశ్వాసం,” “నమ్మకం,” లేదా “విశ్వసనీయత” అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'మూలపాఠపు నామవాచక నిర్మాణానికి మరింత దగ్గరగా: “రక్షణ నిరీక్షణ అనే తలకవచాన్ని.”'
    reason: structural_alternative
  - marker: c
    text: లేదా, “అప్రమత్తంగా, నిగ్రహంతో ఉందాం.” ఇక్కడి గ్రీకు పదం మత్తు లేకపోవడాన్నీ, రూపకంగా అప్రమత్తమైన నిగ్రహాన్నీ సూచించగలదు.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: అయితే మనం
  rationale: δέ ముందున్న రాత్రికి చెందినవారితో వ్యత్యాసాన్ని సూచిస్తుంది. ‘అయితే’ ఆ వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἡμέρας ὄντες
  choice: పగటికి చెందినవాళ్లం కాబట్టి
  rationale: ఇది కేవలం పగటి సమయాన్ని కాక, పగటితో సంబంధం లేదా దానికి చెందడాన్ని తెలిపే రూపకం. కారణార్థక సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘కాబట్టి’ వాడబడింది.
- source_word: νήφωμεν
  choice: మత్తులేకుండా ఉందాం
  rationale: νήφω అనే పదానికి మత్తు లేకపోవడం అనే ప్రత్యక్ష భావంతో పాటు అప్రమత్తమైన నిగ్రహం అనే రూపకాలంకార భావం కూడా ఉంది. సమీప సందర్భంలో రాత్రి, నిద్ర, మత్తు ప్రస్తావనలు ఉన్నందున ప్రధాన పాఠంలో ప్రత్యక్ష భావాన్ని నిలిపి, విస్తృత భావాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἐνδυσάμενοι
  choice: ధరించుకొని
  rationale: కవచాన్ని వేసుకోవడం అనే సైనిక రూపకాన్ని కాపాడుతూ, ప్రధాన ప్రబోధంతో పాటు జరిగే చర్యను సహజమైన తెలుగు క్రియారూపంలో తెలియజేస్తుంది.
- source_word: θώρακα
  choice: ఛాతీ కవచంగా
  rationale: θώραξ శరీరంలోని ఛాతీ భాగాన్ని కాపాడే సైనిక కవచం. ‘ఛాతీ కవచం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, సైనిక రూపకాన్ని నిర్దిష్టంగా నిలుపుతుంది.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: πίστις ఇక్కడ ప్రేమ, నిరీక్షణలతో కూడిన సద్గుణ త్రయంలో వస్తుంది కాబట్టి ‘విశ్వాసం’ సహజమైన ప్రధాన అర్థం. ‘నమ్మకత్వం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀγάπης
  choice: ప్రేమ
  rationale: ἀγάπηకి ఈ సందర్భంలో నేరుగా, సహజంగా సరిపోయే ఆధునిక తెలుగు పదం ‘ప్రేమ’.
- source_word: περικεφαλαίαν
  choice: తలకవచంగా
  rationale: ఇది తలను కాపాడే సైనిక శిరస్త్రాణాన్ని సూచిస్తుంది. ‘తలకవచం’ సాధారణ పాఠకులకు వెంటనే అర్థమయ్యే పదం.
- source_word: ἐλπίδα σωτηρίας
  choice: రక్షణ నిరీక్షణను
  rationale: σωτηρίας అనే షష్ఠీ విభక్తి నిరీక్షణ యొక్క లక్ష్యాన్ని లేదా విషయాన్ని సూచించగలదు. ‘రక్షణ నిరీక్షణ’ మూలంలోని సంక్షిప్తతను, పౌలు చెప్పే విశ్వాసం–ప్రేమ–నిరీక్షణ క్రమాన్ని నిలుపుతుంది.
theological_decisions:
- issue: కవచ రూపకంలో πίστις యొక్క భావం
  choice: విశ్వాసం
  alternative: నమ్మకత్వం; నమ్మకం
  rationale: ప్రేమ, నిరీక్షణలతో జతగా ఉన్న ఈ సందర్భంలో ‘విశ్వాసం’ ప్రధాన పఠనంగా సహజం. అయితే గ్రీకు పదానికి ‘నమ్మకత్వం’ అనే భావం కూడా సాధ్యమే కాబట్టి దాన్ని తొలగించకుండా పాదసూచికలో నిలిపాం.
- issue: ἡμέρας ὄντες యొక్క రూపకాలంకార బలం
  choice: పగటికి చెందినవాళ్లం
  alternative: పగటివారమై ఉన్నాం
  rationale: ఈ మాట కేవలం కాలసూచన కాదు; పగటితో అనుబంధం లేదా దానికి చెందడాన్ని సూచిస్తుంది. ఎవరికి చెందారనే అదనపు సిద్ధాంత వివరణను చేర్చకుండా మూల రూపకాన్ని అలాగే ఉంచాం.
- issue: νήφωμενలో ప్రత్యక్ష మత్తురాహిత్యం మరియు రూపకాలంకార నిగ్రహం
  choice: మత్తులేకుండా ఉందాం
  alternative: అప్రమత్తంగా, నిగ్రహంతో ఉందాం
  rationale: ముందరి సందర్భంలోని మత్తు ప్రస్తావన వల్ల ప్రత్యక్ష భావం సజీవంగా ఉంది; అదే సమయంలో పదం నైతిక అప్రమత్తతను కూడా సూచించగలదు. ప్రధాన పాఠం ఒక భావాన్ని ఎంచుకున్నా, మరో నిజమైన భావఛాయను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా ‘ఛాతీ కవచం,’ ‘తలకవచం’ వంటి స్పష్టమైన పదాలు వాడబడ్డాయి. వాక్యక్రమం తెలుగు సహజ ప్రవాహానికి అనుగుణంగా మార్చినా, పగలు–మత్తురాహిత్యం–కవచం అనే మూల రూపకాలన్నీ నిలుపబడ్డాయి. ‘చెందినవాళ్లం’ ప్రస్తుత సాధారణ వాడుకలో సహజమైన సమ్మిళిత ప్రథమ పురుష రూపం.
