    rationale: “విశ్వసనీయత” is the more natural modern standard Telugu term for faithfulness/reliability and avoids an awkward nominal form. The underlying lexical range can be stated more accurately by retaining both ‘trust’ and ‘faithfulness’ alternatives.
  - severity: low
    issue: “పగటికి చెందినవాళ్లం కాబట్టి” is somewhat colloquial for the requested modern standard register.
    rationale: “పగటివారమైనందున” preserves the metaphorical belonging/sphere sense and the logical connection while reading more smoothly in standard Telugu.
