lexical_decisions:
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: ఈ క్రియావిశేషణం నిరంతరతను లేదా అన్ని సమయాల్లోనూ జరిగే విషయాన్ని సూచిస్తుంది. ‘ఎల్లప్పుడూ’ సహజంగా, సంక్షిప్తంగా ఉండి మూలంలోని సంపూర్ణ భావాన్ని నిలుపుతుంది.
- source_word: χαίρετε
  choice: సంతోషించండి
  rationale: ఇది χαίρω అనే క్రియ యొక్క ద్వితీయ పురుష బహువచన వర్తమాన క్రియాజ్ఞారూపం. ‘సంతోషించండి’ ఆజ్ఞార్థాన్ని, ఆనందభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. వర్తమాన క్రియాజ్ఞలోని కొనసాగింపు భావాన్ని సందర్భంలో ‘ఎల్లప్పుడూ’ కూడా బలపరుస్తుంది.
