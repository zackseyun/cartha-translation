  terminology: “వెలుగు,” “పగటి,” “రాత్రి,” and “చీకటి” faithfully preserve the passage’s paired imagery. “కుమారులు” properly reflects υἱοί, and the anchored note responsibly gives “పిల్లలు” as an idiomatic alternative while explaining the broader relational sense.
