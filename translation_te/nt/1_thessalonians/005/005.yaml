id: 1TH.5.5
reference: 1 Thessalonians 5:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντες ⸀γὰρ ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας. οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/005.yaml
  text: For you are all sons of light and sons of day[a]. We are not of night or of darkness.
translation:
  language: te
  text: ఎందుకంటే మీరందరూ వెలుగు కుమారులు, పగటి కుమారులు[a]. మనం రాత్రికి చెందినవాళ్లం కాదు, చీకటికి చెందినవాళ్లం కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వెలుగు పిల్లలు, పగటి పిల్లలు.” గ్రీకులో అక్షరార్థంగా “కుమారులు” అని ఉంది; ఈ నుడికారం వెలుగుకు, పగటికి చెందినవారిని లేదా వాటి లక్షణం గలవారిని సూచిస్తుంది.
    reason: ‘కుమారులు’ అనే అక్షరార్థ రూపానికి ఉన్న సమగ్ర, సంబంధసూచక నుడికార భావాన్ని స్పష్టం చేయడం.
lexical_decisions:
- source_word: πάντες
  choice: మీరందరూ
  rationale: ὑμεῖςతో కలిపి సమూహంలోని ప్రతి ఒక్కరినీ చేర్చే ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు ఈ వాక్యం ఇచ్చే వివరణాత్మక కారణ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: υἱοὶ
  choice: కుమారులు
  rationale: గ్రీకులోని పుంలింగ బహువచన రూపాన్ని నిలుపుతూ, వెలుగు లేదా పగటికి చెందినవారు, వాటి లక్షణం గలవారు అనే సేమీయ సంబంధరూపకాన్ని కాపాడుతుంది.
- source_word: φωτός
  choice: వెలుగు
  rationale: నైతిక, ఆధ్యాత్మిక రూపకాన్ని మరియు చీకటితో ఉన్న వ్యత్యాసాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἡμέρας
  choice: పగటి
  rationale: νυκτόςకు వ్యతిరేకంగా ఉన్న పగలు అనే భావాన్ని తెలుగులో సహజమైన సమాసరూపంలో వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἐσμὲν
  choice: మనం ... కాదు
  rationale: ‘మీరు’ అనే ద్వితీయ పురుష సంబోధన నుంచి పౌలు తననూ ఇతరులనూ చేర్చుకునే ప్రథమ పురుష బహువచనానికి జరిగిన మార్పును యథాతథంగా నిలుపుతుంది.
- source_word: νυκτός
  choice: రాత్రికి చెందినవాళ్లం
  rationale: కేవలం కాలసూచనగా కాక, రాత్రికి చెందినవారనే సంబంధం లేదా పరిధిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: σκότους
  choice: చీకటికి చెందినవాళ్లం
  rationale: వెలుగుతో ఉన్న నైతిక, ఆధ్యాత్మిక వ్యత్యాసాన్ని మరియు చెందినవారనే సమాంతర భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: υἱοὶ φωτός / υἱοὶ ἡμέραςలోని లింగసూచక కుటుంబ రూపకం
  choice: వెలుగు కుమారులు, పగటి కుమారులు
  alternative: వెలుగు పిల్లలు, పగటి పిల్లలు
  rationale: గ్రీకు పాఠంలో υἱοί అనే పుంలింగ పదమే ఉంది. ప్రధాన పాఠంలో దానిని ‘కుమారులు’గా నిలిపి, ఇది పురుషులకు మాత్రమే పరిమితమైన ఉద్దేశం కాకుండా వెలుగు, పగటికి చెందినవారిని సూచించే నుడికారం అని పాదసూచికలో వివరిస్తుంది.
- issue: ద్వితీయ పురుషం నుంచి ప్రథమ పురుష బహువచనానికి మార్పు
  choice: మీరందరూ ... మనం ... కాదు
  alternative: మీరందరూ ... మీరు ... కాదు
  rationale: మూలపాఠంలోని వ్యక్తి మార్పును సవరించకుండా కాపాడుతుంది; తద్వారా పౌలు తననూ తన సహచరులనూ థెస్సలొనీక విశ్వాసులతో కలుపుతున్న భావం నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ‘మీరందరూ’, ‘మనం’, ‘చెందినవాళ్లం’ వాడబడ్డాయి. రూపకాల సమాంతరత, ‘మీరు’ నుంచి ‘మనం’కు మార్పు, వెలుగు/చీకటి మరియు పగలు/రాత్రి వ్యత్యాసాలు నిలుపబడ్డాయి.
