id: 1TH.5.23
reference: 1 Thessalonians 5:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ὁ θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς, καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/023.yaml
  text: May the God of peace himself sanctify you completely[b][a], and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus the Messiah.
translation:
  language: te
  text: శాంతి దేవుడే మిమ్మల్ని పూర్తిగా పవిత్రపరచుగాక. మీ ఆత్మ, ప్రాణం, శరీరం మొత్తం[b] మన ప్రభువైన యేసు మెస్సీయ[a] రాకడలో నిందారహితంగా కాపాడబడుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'సంప్రదాయంగా: “మన ప్రభువైన యేసు క్రీస్తు రాకడలో.”'
    reason: alternative_reading
  - marker: b
    text: పౌలు ఇక్కడ “ఆత్మ, ప్రాణం, శరీరం” అని పేర్కొంటున్నాడు. ఇది మానవ స్వభావం మూడు భాగాలుగా ఉందని బోధిస్తుందా, లేక మొత్తం వ్యక్తిని నొక్కి చెబుతుందా అనే విషయంలో వ్యాఖ్యాతల అభిప్రాయాలు భిన్నంగా ఉన్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς
  choice: దేవుడే
  rationale: αὐτός ఇక్కడ దేవుడే స్వయంగా కార్యం చేస్తాడనే ఉద్ఘాటనను ఇస్తుంది; తెలుగులో ‘దేవుడే’ సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ప్రార్థనాత్మక ఆశీర్వచనానికి మార్పును సూచిస్తుంది. తెలుగులో వాక్యారంభమే ఆ మార్పును సహజంగా తెలియజేస్తుంది; ‘అయితే’ అని పెడితే లేనిపోని వ్యతిరేక భావం రావచ్చు.
- source_word: ὁ θεὸς τῆς εἰρήνης
  choice: సమాధాన దేవుడు
  rationale: దేవుడు సమాధానంతో విశిష్టంగా సంబంధం కలిగినవాడని తెలిపే పౌలు వాడే బిరుదును సంక్షిప్తంగా, గంభీరంగా నిలుపుతుంది.
- source_word: ἁγιάσαι
  choice: పవిత్రపరచుగాక
  rationale: ఇది కోరిక లేదా ప్రార్థనను తెలిపే aorist optative; ‘పవిత్రపరచుగాక’ ఆ ప్రార్థనాత్మక రూపాన్నీ పరిశుద్ధతతో ఉన్న పదసంబంధాన్నీ కాపాడుతుంది.
- source_word: ὁλοτελεῖς
  choice: సంపూర్ణంగా
  rationale: పవిత్రపరచడం మొత్తం వ్యక్తిని ఆవరించాలనే సంపూర్ణత భావాన్ని సహజమైన తెలుగు క్రియావిశేషణంతో వ్యక్తం చేస్తుంది.
- source_word: ὁλόκληρον
  choice: సంపూర్ణంగా
  rationale: ఆత్మ, ప్రాణం, శరీరం చెక్కుచెదరకుండా మొత్తంగా కాపాడబడాలనే wholeness భావాన్ని తెలియజేస్తుంది.
- source_word: τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα
  choice: ఆత్మయూ ప్రాణమూ శరీరమూ
  rationale: గ్రీకు మూలంలోని మూడు పదాలనూ వేర్వేరుగా నిలిపి, వాటి సంబంధాన్ని సిద్ధాంతపరంగా ముందే నిర్ణయించదు.
- source_word: ἀμέμπτως
  choice: నిందారహితంగా
  rationale: కాపాడబడే స్థితి ఎలాంటి నిందకు తావులేనిదిగా ఉండాలని సూచిస్తుంది.
- source_word: ἐν τῇ παρουσίᾳ
  choice: రాకడ సమయంలో
  rationale: పౌలు అంత్యకాల సందర్భంలో παρουσίαను ప్రభువు రాక లేదా ప్రత్యక్ష రాకడకు వాడుతున్నాడు; ‘సమయంలో’ అనేది గ్రీకు ἐν యొక్క కాలసంబంధాన్ని ‘వరకు’గా మార్చకుండా నిలుపుతుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది; దాని అర్థాన్ని ‘మెస్సీయ’గా అనువదించి, సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ఇస్తుంది.
theological_decisions:
- issue: ఆత్మ, ప్రాణం, శరీరం అనే త్రివిధ ప్రస్తావన
  choice: మూడు పదాలనూ మూలంలో ఉన్నట్లే విడివిడిగా ఉంచడం
  alternative: ఇవి మనిషి మూడు వేర్వేరు భాగాలని బోధిస్తున్నట్లు అనువదించడం, లేదా ‘మొత్తం వ్యక్తి’ అని మాత్రమే చెప్పి మూడు పదాలను కలిపివేయడం
  rationale: వాక్యం మూడు అంశాలను స్పష్టంగా పేర్కొంటుంది; అయితే ఇది మానవ స్వభావాన్ని మూడు భాగాలుగా నిర్వచిస్తుందా, లేక సంపూర్ణ వ్యక్తిని ఉద్దేశించిన అలంకారిక సమాహారమా అన్నది స్వయంగా తేల్చదు.
- issue: Χριστοῦ అనే బిరుదు
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: గ్రీకు పదం బిరుదుగా ఉన్నందున దాని అర్థాన్ని ప్రధాన పాఠ్యంలో ఇస్తూ, తెలుగు బైబిలు సంప్రదాయంలో పరిచితమైన లిప్యంతరీకరణను పాదటిప్పణిలో ఉంచడం అర్థస్పష్టతను, సంప్రదాయ పరిచయాన్ని రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రార్థనాత్మక శైలిని వాడాం. ‘పవిత్రపరచుగాక’, ‘కాపాడబడుగాక’ అనే రూపాలు గ్రీకు optative కోరికను స్పష్టంగా చూపుతాయి. ‘యేసు మెస్సీయ’ అనే నిర్మాణం బిరుదు భావాన్ని నిలుపుతుంది; సంప్రదాయ ‘యేసు క్రీస్తు’ పాదటిప్పణిలో ఉంది.
