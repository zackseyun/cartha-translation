revisions:
- from: కాబట్టి ఒకరినొకరు ప్రోత్సహించండి[a], ఒకరినొకరు కట్టండి—మీరు ఇప్పుడు చేస్తున్నట్టుగానే.
  to: కాబట్టి ఒకరినొకరు ప్రోత్సహించండి[a], ఒకరినొకరు బలపరచండి—మీరు చేస్తున్నట్టుగానే.
