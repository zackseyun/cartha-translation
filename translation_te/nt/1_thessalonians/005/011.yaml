  text: Therefore encourage one another and build up one another[a], just as you are also doing.
translation:
  language: te
  text: కాబట్టి ఒకరినొకరు ప్రోత్సహించండి[a], ఒకరినొకరు బలపరచండి—మీరు చేస్తున్నట్టుగానే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఒకరినొకరు పురికొల్పండి”; παρακαλεῖτε అనే పదం ఈ సందర్భంలో ప్రోత్సహించడం లేదా పురికొల్పడం అనే భావాలను కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: కాబట్టి
  rationale: ముందున్న వాదననుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: παρακαλεῖτε
  choice: ప్రోత్సహించండి
  rationale: ఈ పరస్పర బలపరచే సందర్భంలో ప్రోత్సహించడం అనే విస్తృత భావం సరిపోతుంది; అయితే ఈ పదానికి ప్రబోధించడం లేదా పురికొల్పడం అనే భావం కూడా ఉండగలదని పాదసూచికలో నిలిపాం.
- source_word: ἀλλήλους
  choice: ఒకరినొకరు
  rationale: పరస్పర చర్యను సహజంగా, స్పష్టంగా వ్యక్తం చేసే తెలుగు రూపం.
- source_word: οἰκοδομεῖτε
  choice: కట్టండి
  rationale: గ్రీకు పదంలోని నిర్మాణ రూపకాన్ని నిలుపుతుంది; సందర్భంలో ఒకరి విశ్వాస జీవితం మరొకరు బలపడేలా చేయడం అనే భావాన్ని మోస్తుంది.
- source_word: εἷς τὸν ἕνα
  choice: ఒకరినొకరు
  rationale: గ్రీకు నుడికారంలోని పరస్పరతను సహజ తెలుగులో చూపడానికి రెండో ఆజ్ఞతోనూ ఈ పదబంధాన్ని స్పష్టంగా ఉంచాం.
- source_word: καθὼς καὶ ποιεῖτε
  choice: మీరు ఇప్పుడు చేస్తున్నట్టుగానే
  rationale: వారు ఇప్పటికే ఆచరిస్తున్న పనిని మెచ్చుకుంటున్న భావాన్నీ, కొనసాగుతున్న చర్యనూ సహజ తెలుగులో తెలియజేస్తుంది.
