  text: The grace of our Lord Jesus Christ be with you[a].
translation:
  language: te
  text: మన ప్రభువైన యేసు క్రీస్తు కృప మీతో ఉండుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “మీ అందరితో ఉండుగాక. ఆమేన్” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పౌలు ఆశీర్వాద వాక్యాల్లో χάρις దేవుని అనుగ్రహాన్ని సూచించే స్థిరమైన విశ్వాసపర పదం; తెలుగులో ‘కృప’ సహజమైన, ప్రామాణికమైన సమానార్థకం.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: ఇక్కడ κύριος యేసుకు వర్తించే గౌరవపూర్వక బిరుదు; దాని క్రీస్తుసంబంధమైన భావబలాన్ని ‘ప్రభువు’ నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు క్రీస్తు
  rationale: తెలుగు క్రైస్తవ వాడుకలో ఈ నామ-బిరుదు కలయికకు ‘యేసు క్రీస్తు’ స్పష్టమైన, విస్తృతంగా గుర్తించబడే రూపం; ‘క్రీస్తు’ అభిషిక్తుడు/మెస్సీయ అనే బిరుదు నేపథ్యాన్ని కలిగి ఉంది.
- source_word: μεθ’ ὑμῶν
  choice: మీకు తోడుగా ఉండుగాక
  rationale: గ్రీకులోని ‘మీతో’ అనే అవ్యయ పదబంధంలో ఆశీర్వాద క్రియ అధ్యాహారంగా ఉంది; తెలుగులో ఆశీర్వాద భావాన్ని సహజంగా వ్యక్తం చేయడానికి ‘ఉండుగాక’ను పూరించి, సహవాస భావాన్ని ‘తోడుగా’ తెలిపాం.
theological_decisions:
- issue: Χριστοῦను బిరుదుగా లేదా స్థిర నామరూపంగా అనువదించడం
  choice: క్రీస్తు
  alternative: మెస్సీయ
  rationale: Χριστός మూలంగా ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదే అయినా, ఈ పౌలు ముగింపు సూత్రంలో ‘యేసు క్రీస్తు’ తెలుగు పాఠకులకు సహజమైన స్థిర రూపం. ‘మెస్సీయ’ అని మార్చడం మూలంలోని బిరుదు భావాన్ని మరింత బహిర్గతం చేస్తుంది గాని, సందర్భంలోని సుపరిచిత నామ-బిరుదు కలయికను అవసరానికి మించి గుర్తింపజేయవచ్చు.
- issue: క్రియలేని గ్రీకు ఆశీర్వాద సూత్రాన్ని తెలుగులో వ్యక్తం చేయడం
  choice: ఉండుగాక
  alternative: ఉండాలి / మీతో
  rationale: గ్రీకు వాక్యంలో క్రియ లేకపోయినా ఇది ఆశీర్వాద కోరికను తెలిపే సూత్రం. ‘ఉండుగాక’ ఆ భావాన్ని గౌరవప్రదమైన ఆధునిక బైబిలు తెలుగులో స్పష్టంగా ఉంచుతుంది; ఇది ప్రకటనగా కాక ఆశీర్వాదంగా చదవబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పౌలు పత్రిక ముగింపు ఆశీర్వాదానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘తోడుగా ఉండుగాక’ సహజమైన ఆశీర్వాద రూపం. ప్రధాన పాఠం SBLGNTలోని సంక్షిప్త పఠనాన్ని అనుసరిస్తుంది; ⸀ వద్ద ఉన్న ప్రతుల భేదాన్ని పాదటిప్పణిలో చూపించాం.
