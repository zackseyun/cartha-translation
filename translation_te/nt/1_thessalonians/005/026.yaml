translation:
  language: te
  text: పవిత్ర ముద్దుతో సహోదరులందరికీ అభివాదం చేయండి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సహోదర సహోదరీలందరికీ”; “సహోదరులు” అనే పదం విశ్వాసుల సమాజమంతటినీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “పవిత్ర ముద్దు” క్రైస్తవ సహవాసాన్నీ ఆప్యాయతనూ వ్యక్తపరిచే, ఆ కాలంలో సాంస్కృతికంగా ఆమోదించబడిన అభివాదం.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: వందనం చెప్పండి
  rationale: ఇది రెండవ పురుష బహువచన ఆజ్ఞారూపం. సామాజిక పలకరింపును సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: ἀδελφοὺς
  choice: సహోదరులు
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం. ప్రధాన పాఠ్యంలో ఆ రూపాన్ని నిలిపి, విశ్వాస సమాజమంతటినీ సూచించే అవకాశం పాదసూచికలో ఇచ్చాం.
- source_word: πάντας
  choice: అందరికీ
  rationale: సహోదరుల సమూహంలో ఎవ్వరినీ మినహాయించకుండా మొత్తాన్ని నొక్కిచెబుతుంది.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: పవిత్రమైన ముద్దుతో
  rationale: ἐν ఇక్కడ సహచర విధానాన్ని లేదా సాధనాన్ని సూచిస్తుంది; φίλημα అంటే ముద్దు, ἁγίῳ దానిని పవిత్రమైనదిగా విశేషిస్తుంది.
theological_decisions:
- issue: సంఘ సందర్భంలో ἀδελφοί అనే లింగసూచక సంబోధన
  choice: సహోదరులు
  alternative: సహోదర సహోదరీలు
  rationale: మూల గ్రీకు రూపం పుంలింగ బహువచనం కాబట్టి ప్రధాన పాఠ్యంలో దానిని నిలిపాం. అయితే సందర్భంలో విశ్వాస సమాజంలోని స్త్రీపురుషులందరూ ఉద్దేశించబడి ఉండవచ్చు; ఆ భావాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞార్థక శైలి. మూలంలోని సంక్షిప్తతను నిలిపి, లింగసంబంధ సూచనలోని నిజమైన సందిగ్ధతను పాదసూచికలో ఉంచాం.
