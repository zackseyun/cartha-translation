id: 1TH.5.14
reference: 1 Thessalonians 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/014.yaml
  text: And we urge you[a], brothers, admonish the disorderly, encourage the fainthearted, help the weak[d][c][b], be patient with everyone.
translation:
  language: te
  text: 'సహోదరులారా,[a] మేము మిమ్మల్ని వేడుకొంటున్నాము: క్రమం తప్పి నడుచుకునేవారిని హెచ్చరించండి,[b] నిరుత్సాహపడినవారిని ధైర్యపరచండి,[c] బలహీనులకు అండగా ఉండండి,[d] అందరిపట్ల ఓర్పు చూపండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సహోదర సహోదరీలారా’; పౌలు సంఘమంతటినీ ఉద్దేశించి మాట్లాడుతున్నాడు.
    reason: alternative_reading
  - marker: b
    text: ‘క్రమం తప్పి నడుచుకునేవారు’ అనే మాటకు ‘పనిచేయకుండా ఉండేవారు,’ ‘క్రమశిక్షణ లేనివారు,’ లేదా ‘అవిధేయంగా నడుచుకునేవారు’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మనసు కుంగినవారిని ఆదరించండి.’
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘బలహీనులకు తోడ్పడండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλοῦμεν
  choice: విన్నవిస్తున్నాము
  rationale: ఇక్కడ అపొస్తలుల గంభీరమైన, ఆప్యాయమైన విజ్ఞప్తిని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఆ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: δέ
  choice: అయితే
  rationale: బలమైన వ్యతిరేకతకన్నా ముందున్న ఉపదేశాల నుంచి కొత్త విజ్ఞప్తికి మార్పును సూచిస్తుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: మూలంలోని పుంలింగ బహువచన సంబోధనను నిలుపుతుంది; సందర్భంలో సంఘమంతా ఉద్దేశించబడిందనే విషయాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: νουθετεῖτε
  choice: హెచ్చరించండి
  rationale: తప్పును సరిదిద్దే ఉద్దేశంతో ఇచ్చే బోధన లేదా హెచ్చరిక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀτάκτους
  choice: క్రమం తప్పి నడుచుకునేవారిని
  rationale: క్రమశిక్షణకు విరుద్ధంగా లేదా బాధ్యతారహితంగా నడుచుకోవడం అనే విస్తృత భావాన్ని నిలుపుతుంది; కేవలం సోమరితనానికే పరిమితం చేయదు.
- source_word: παραμυθεῖσθε
  choice: ధైర్యపరచండి
  rationale: ఆదరణతో మాట్లాడి మనోధైర్యం కలిగించడం అనే క్రియార్థాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ὀλιγοψύχους
  choice: నిరుత్సాహపడినవారిని
  rationale: ధైర్యం కోల్పోయిన లేదా మనసు కుంగినవారనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: ἀντέχεσθε
  choice: అండగా ఉండండి
  rationale: జనిటివ్‌తో ఈ క్రియకు ఉన్న పట్టుకొని నిలబెట్టడం, తోడ్పడడం అనే నిరంతర సహాయక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: τῶν ἀσθενῶν
  choice: బలహీనులకు
  rationale: శారీరక, నైతిక లేదా సామాజిక బలహీనతలలో ఏదో ఒకదానికే పరిమితం చేయకుండా మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: μακροθυμεῖτε
  choice: ఓర్పు చూపండి
  rationale: ప్రజల పట్ల కోపాన్ని అదుపులో ఉంచుకొని దీర్ఘశాంతితో వ్యవహరించడాన్ని సహజ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πρὸς πάντας
  choice: అందరిపట్ల
  rationale: ఈ ఆజ్ఞ ఎవరినీ మినహాయించకుండా ప్రతి వ్యక్తికి వర్తిస్తుందనే విశ్వవ్యాప్త పరిధిని స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: సంఘాన్ని ఉద్దేశించిన ἀδελφοί పదంలోని సమ్మిళిత భావం
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులారా’ అని మూలంలోని పుంలింగ రూపాన్ని నిలిపి, స్త్రీలను కూడా కలుపుకొని సంఘమంతా ఉద్దేశించబడిందని పాదసూచికలో తెలపడం.
  alternative: ‘సహోదర సహోదరీలారా’
  rationale: మూల రూపాన్ని దాచకుండా కాపాడుతూ, చారిత్రక సందర్భంలో ఈ సంబోధన మొత్తం సంఘానికి వర్తిస్తుందనే భావాన్నీ స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సంఘ పఠనానికి అనువైన ఆజ్ఞార్థక శైలి వాడబడింది. ‘క్రమం తప్పి నడుచుకునేవారు’ మరియు ‘బలహీనులు’ వంటి పదబంధాలలో మూలంలోని ఉద్దేశపూర్వక విస్తృతతను నిలిపి, సాధ్యమైన ప్రత్యామ్నాయ సూక్ష్మార్థాలను పాదసూచికల్లో ఇచ్చాం.
