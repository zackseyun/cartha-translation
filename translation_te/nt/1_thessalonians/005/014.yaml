  rationale: మూలపాఠ్యంలో ఉన్న παρακαλοῦμεν ὑμᾶςను ‘మేము మిమ్మల్ని వేడుకొంటున్నాము’గా పునరుద్ధరించాం. δέకు ఉన్న సున్నితమైన కొనసాగింపు భావాన్ని తెలుగులో బలవంతంగా ‘అయితే’గా చూపకుండా, సహజమైన సంబోధన-విజ్ఞప్తి నిర్మాణంలో వ్యక్తం చేశాం. మిగిలిన పాఠ్యం, పాదసూచికలు, వాటి సూచికలు మార్పు అవసరం లేకుండా మూలానికి అనుగుణంగా ఉన్నాయి.
