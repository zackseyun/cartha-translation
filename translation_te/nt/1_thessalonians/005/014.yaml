  naturalness: ‘సహోదరులారా, మేము మిమ్మల్ని వేడుకొంటున్నాము:’ అనేది ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, సంఘపఠనానికి తగిన ప్రవేశిక. ‘అయితే’ తొలగించబడింది, ఎందుకంటే అది తెలుగులో అనవసరమైన వ్యతిరేక భావాన్ని కలిగించవచ్చు; గ్రీకు δέ ఇక్కడ ప్రధానంగా కొనసాగింపు/మార్పును సూచిస్తుంది.
  terminology: ‘క్రమం తప్పి నడుచుకునేవారు,’ ‘నిరుత్సాహపడినవారు,’ ‘బలహీనులు,’ ‘అండగా ఉండండి,’ మరియు ‘అందరిపట్ల ఓర్పు చూపండి’ పదాలు వరుసగా ἀτάκτους, ὀλιγοψύχους, ἀσθενῶν, ἀντέχεσθε, μακροθυμεῖτε πρὸς πάντας యొక్క భావపరిధిని తగిన విధంగా కాపాడుతున్నాయి. పాదసూచిక ప్రత్యామ్నాయాలు సరైన స్థానాల్లో ఉన్నాయి.
