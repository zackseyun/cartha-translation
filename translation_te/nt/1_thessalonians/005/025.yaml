lexical_decisions:
- source_word: Ἀδελφοί
  choice: సోదరులారా
  rationale: ἀδελφός పదానికి సంబోధన బహువచన రూపం. గ్రీకు పాఠంలోని పుంలింగ రూపాన్ని ప్రధాన పాఠంలో నిలుపుతూ, మొత్తం సంఘాన్ని—స్త్రీపురుషులందరినీ—ఉద్దేశించి ఉండే అవకాశాన్ని పాదటిప్పణిలో తెలియజేశాం.
- source_word: προσεύχεσθε
  choice: ప్రార్థించండి
  rationale: ప్రస్తుతకాల ఆజ్ఞార్థక బహువచనం. ఈ సంక్షిప్త విజ్ఞప్తిలో సహజమైన ఆధునిక తెలుగు రూపం; కొనసాగుతున్న క్రియాభావాన్ని ప్రత్యేకంగా ‘ప్రార్థిస్తూ ఉండండి’ అని విస్తరించాల్సిన అవసరం లేదు.
- source_word: περὶ
  choice: కోసం
  rationale: ἡμῶν అనే షష్ఠీ విభక్తి సర్వనామంతో కలిసి ప్రార్థనలో ఎవరి పక్షంగా వేడుకోవాలో సూచిస్తుంది. ‘మా కోసం’ సహజమైన తెలుగు ప్రయోగం.
- source_word: ἡμῶν
  choice: మా
  rationale: మొదటి పురుష బహువచన షష్ఠీ సర్వనామం; పౌలు మరియు అతని సహచరులను సూచిస్తుంది. మూలపాఠం చెప్పినదానికంటే ఎక్కువగా వివరించకుండా అనువదించబడింది.
theological_decisions:
- issue: మిశ్రమ లింగాల సంఘాన్ని ఉద్దేశించి ఉండే Ἀδελφοί అనే లింగసూచక సంబోధన
  choice: సోదరులారా
  alternative: సోదర సోదరీమణులారా
  rationale: ప్రధాన పాఠం గ్రీకు పదంలోని పుంలింగ రూపాన్ని ప్రతిబింబిస్తుంది; సందర్భంలో ఈ సంబోధన మొత్తం సంఘంలోని స్త్రీపురుషులందరినీ కలుపుకొని ఉండవచ్చనే భావాన్ని పాదటిప్పణి కాపాడుతుంది.
translation_notes:
  register: సంక్షిప్తమైన, గౌరవప్రదమైన ఆధునిక ప్రామాణిక తెలుగు. ‘మా కొరకు’ కంటే సాధారణ పాఠకులకు సహజంగా వినిపించే ‘మా కోసం’ వాడబడింది.
