lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: ఆత్మను
  rationale: ఆర్టికల్‌తో ఉన్న πνεῦμα, తరువాతి వచనాల్లోని ప్రవచనాల ప్రస్తావన దృష్ట్యా, ఇక్కడ పరిశుద్ధాత్మను సూచించే అవకాశమే ఎక్కువ. తెలుగు ప్రధాన పాఠ్యంలో ‘ఆత్మ’ అనే సహజమైన బైబిలీయ పదం ఈ సూచనను నిలుపుతూ, పదానికి ఉండే విస్తృత అర్థాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: μὴ
  choice: -కండి
  rationale: μή వర్తమాన ఆజ్ఞార్థక క్రియతో కలిసి నిషేధాన్ని వ్యక్తం చేస్తుంది; ఆధునిక గౌరవపూర్వక బహువచన తెలుగులో ‘-కండి’ సహజమైన రూపం.
- source_word: σβέννυτε
  choice: ఆర్పివేయకండి
  rationale: σβέννυμι ప్రధానంగా మంటను ఆర్పడం అనే అర్థం ఇస్తుంది. ‘ఆర్పివేయడం’ మూలంలోని అగ్ని రూపకాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది; ‘అణచివేయడం’ అనే వివరణాత్మక భావానికి పరిమితం చేయదు.
theological_decisions:
- issue: πνεῦμα దేనిని సూచిస్తుంది?
  choice: పరిశుద్ధాత్మను సూచించే ‘ఆత్మ’
  alternative: మానవ ఆత్మ; ఆధ్యాత్మిక ఉత్సాహం లేదా వరం
  rationale: తరువాత వెంటనే ప్రవచనాలను తృణీకరించవద్దనే హెచ్చరిక రావడం వల్ల సంఘంలో పనిచేసే పరిశుద్ధాత్మ ఇక్కడ ఉద్దేశించబడ్డాడని భావించడం అత్యంత సహజం. అయితే గ్రీకు పదం సాధారణంగా ‘ఆత్మ’ అని కూడా అర్థమివ్వగలదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవపూర్వక బహువచన నిషేధ రూపాన్ని వాడాం. మూలంలోని సంక్షిప్తతను, అగ్ని ఆర్పే రూపకాన్ని కాపాడాం. ప్రధాన పాఠ్యంలో ‘పరిశుద్ధాత్మ’ అని విస్తరించకుండా ‘ఆత్మ’ అని ఉంచి మూలపద రూపాన్ని నిలిపాం.
