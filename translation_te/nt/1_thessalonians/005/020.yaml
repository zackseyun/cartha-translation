  text: Do not despise prophecies[a].
translation:
  language: te
  text: ప్రవచనాలను తృణీకరించకండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రవచన వాక్యాలను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: προφητείας
  choice: ప్రవచనాలను
  rationale: προφητεία అనే పదానికి ఇది బహువచన కర్మకారక రూపం; అమూర్తమైన ‘ప్రవచనం’ అనే భావం మాత్రమే కాకుండా, పలికిన ప్రవచనాలనూ సూచిస్తుంది. తెలుగు బహువచనం మూలరూపాన్ని సహజంగా నిలుపుతుంది.
- source_word: μὴ
  choice: -కండి
  rationale: వర్తమాన ఆజ్ఞార్థక క్రియతో వచ్చిన సాధారణ నిషేధాన్ని తెలుగులో గౌరవ/బహువచన నిషేధ ఆజ్ఞారూపమైన ‘-కండి’ సహజంగా వ్యక్తం చేస్తుంది; ‘ఎన్నటికీ’ వంటి పదం మూలంలో లేని బలాన్ని చేర్చుతుంది.
- source_word: ἐξουθενεῖτε
  choice: తృణీకరించకండి
  rationale: ఈ క్రియ దేనినైనా విలువలేనిదిగా చూడడం, చిన్నచూపు చూడడం, తిరస్కారభావంతో వ్యవహరించడం అనే అర్థాన్ని ఇస్తుంది. ‘తృణీకరించకండి’ ఆ బలాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం ‘తిరస్కరించకండి’ అనడం ధిక్కారభావాన్ని పూర్తిగా పట్టుకోదు.
theological_decisions:
- issue: ఆదిమ క్రైస్తవ సంఘ సందర్భంలో ‘ప్రవచనాలు’ అనే పదం యొక్క పరిధి
  choice: ‘ప్రవచనాలు’ అనే విస్తృత పదాన్నే ఉంచడం
  alternative: ‘ప్రవచన వాక్యాలు’ లేదా ‘దేవుని నుండి వచ్చాయని చెప్పబడే సందేశాలు’
  rationale: గ్రీకు పదం సంఘంలో పలికిన ప్రవచనాత్మక మాటలను సూచించగలదు; అయితే అది ఏ నిర్దిష్ట విధానానికో, తరువాతి సిద్ధాంత వర్గానికో పరిమితం చేయదు. నేరుగా అనువదించడం ద్వారా వచనంలోని విస్తృతత, సిద్ధాంతపరమైన ఉద్రిక్తత నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సంక్షిప్తంగా, గౌరవప్రదంగా ఉంది. ‘తృణీకరించకండి’ మూలంలోని ధిక్కారపూర్వక నిర్లక్ష్య భావాన్ని నిలుపుతుంది.
