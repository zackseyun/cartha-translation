    text: లేదా, ‘సమస్త విషయాలను.’ ఈ సందర్భంలో ముఖ్యంగా ప్రవచనాలను పరిశీలించడం ఇందులో చేరుతుంది.
    reason: πάντα యొక్క విస్తృత అర్థాన్ని కాపాడుతూ, సమీప సందర్భంలో ప్రవచనాల పరిశీలనకు ఉన్న ప్రత్యేక సంబంధాన్ని సూచించడానికి.
  revision_rationale: The revision retains the source’s broad command to test all things and its paired command to retain what is good. It removes an unnecessarily strong rendering of δέ and uses an idiomatic Telugu expression that more fully conveys the ongoing force of κατέχετε. The footnote keeps the lexical alternative and contextual guidance without narrowing the Greek text.
