id: 1TH.5.21
reference: 1 Thessalonians 5:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πάντα δὲ δοκιμάζετε, τὸ καλὸν κατέχετε,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/021.yaml
  text: But test everything[a]; hold fast to what is good.
translation:
  language: te
  text: అన్నిటినీ పరీక్షించండి[a]; మంచిదానిని గట్టిగా పట్టుకొని ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమస్త విషయాలను.’ ఈ సందర్భంలో ముఖ్యంగా ప్రవచనాలను పరిశీలించడం ఇందులో చేరుతుంది.
    reason: πάντα యొక్క విస్తృత అర్థాన్ని కాపాడుతూ, సమీప సందర్భంలో ప్రవచనాల పరిశీలనకు ఉన్న ప్రత్యేక సంబంధాన్ని సూచించడానికి.
lexical_decisions:
- source_word: πάντα
  choice: అన్నిటినీ
  rationale: నపుంసక బహువచన ద్వితీయా విభక్తి విస్తృత పరిధిని సూచిస్తుంది. ‘అన్నిటినీ’ సహజమైన ఆధునిక తెలుగు; మూలంలోని విస్తృతిని కాపాడుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న ఆదేశాలకు సంబంధించి స్వల్ప వ్యత్యాసాన్ని లేదా కొనసాగింపు మలుపును సూచిస్తుంది; ‘అయితే’ దానిని అతిగా బలపరచకుండా తెలియజేస్తుంది.
- source_word: δοκιμάζετε
  choice: పరీక్షించండి
  rationale: వర్తమాన ఆజ్ఞార్థక క్రియ నిరంతరంగా పరిశీలించి నిజత్వం లేదా విలువను నిర్ధారించే భావాన్ని ఇస్తుంది. ‘పరీక్షించండి’ సంక్షిప్తంగా, సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- source_word: τὸ καλὸν
  choice: మంచిదాన్ని
  rationale: ఆర్టికల్‌తో ఉన్న నపుంసక ఏకవచన విశేషణం నామవాచకంగా పనిచేస్తుంది. ‘మంచిదాన్ని’ సాధారణ పాఠకులకు సహజంగా ఉండి ‘మంచిదేదో దానిని’ అనే భావాన్ని అందిస్తుంది.
- source_word: κατέχετε
  choice: గట్టిగా పట్టుకోండి
  rationale: పరీక్షించిన తరువాత మంచిదానిని దృఢంగా అంటిపెట్టుకొని కొనసాగించే భావం ఉంది. ‘గట్టిగా పట్టుకోండి’ ఆ క్రియాశీల, స్థిరమైన నిబద్ధతను తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రవచనం మరియు వివేచన సందర్భంలో πάντα యొక్క పరిధి
  choice: ‘అన్నిటినీ’ అని విస్తృతంగానే అనువదించి, వెంటనే ముందున్న సందర్భం ముఖ్యంగా ప్రవచన వాక్యాల పరిశీలనను సూచించనివ్వడం.
  alternative: ‘ప్రవచనాలన్నిటినీ’ లేదా ‘చెప్పబడిన ప్రతిదానినీ’ అని పరిధిని స్పష్టంగా కుదించడం.
  rationale: 20వ వచనంలో ప్రవచనాలు ప్రస్తావించబడినప్పటికీ, గ్రీకు పాఠంలో πάνταతో పరిధిని పరిమితం చేసే నామవాచకం లేదు. అందువల్ల అనువాదం మూలంలోని విస్తృతిని, సందర్భం కలిగించే ప్రత్యేక అన్వయాన్ని రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. వాక్య నిర్మాణం సంక్షిప్తంగా ఉంచి, మూలంలోని రెండు సమాంతర ఆదేశాలు మరియు స్వల్ప వ్యత్యాస సూచన నిలుపబడ్డాయి.
