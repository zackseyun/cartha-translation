source:
  edition: SBLGNT
  text: Περὶ δὲ τῶν χρόνων καὶ τῶν καιρῶν, ἀδελφοί, οὐ χρείαν ἔχετε ὑμῖν γράφεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/001.yaml
  text: Concerning the times and the seasons[a], brothers, you have no need to have anything written to you[b],
translation:
  language: te
  text: ఇక కాలాలు, నియమిత సమయాల గురించి, సహోదరులారా[a], మీకు వ్రాయబడడం అవసరం లేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహోదర సహోదరీలారా’; గ్రీకులో అక్షరార్థంగా ‘సహోదరులారా’ అని ఉంది. ఇది విశ్వాసుల సమాజమంతటినీ ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కాలాలు, నియమిత సమయాలు’ అనేది కాలవ్యవధులనూ నిర్ణయించబడిన సందర్భాలనూ కలిపి సూచించే జంట పదబంధం; ఇక్కడ అది ముఖ్యంగా అంత్యకాల సందర్భానికి సంబంధించినది.
    reason: cultural_note
lexical_decisions:
- source_word: Περὶ δὲ
  choice: ఇక ... గురించి
  rationale: Περὶ విషయాన్ని పరిచయం చేస్తుంది; δέ ఇక్కడ బలమైన వ్యతిరేకతకన్నా విషయమార్పును సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఇక ... గురించి’ ఈ సంభాషణాత్మక మార్పును సహజంగా తెలియజేస్తుంది.
- source_word: τῶν χρόνων
  choice: కాలాలూ
  rationale: χρόνος కాలవ్యవధులు లేదా కాలపరంపరలను సూచిస్తుంది. బహువచనాన్ని నిలిపి, జతపదంలోని మొదటి భాగంగా ‘కాలాలు’ వాడబడింది.
- source_word: τῶν καιρῶν
  choice: నియమిత సమయాలూ
  rationale: καιρός అనుకూలమైన, నిర్ణయించబడిన లేదా నియమిత సమయాన్ని సూచించగలదు. ‘నియమిత సమయాలు’ χρόνοι నుండి దాని భావభేదాన్ని స్పష్టంగా ఉంచుతుంది; అంత్యకాల సందర్భాన్నీ ముందుగానే అతిగా నిర్వచించదు.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: పదరూపం పుంలింగ బహువచన సంబోధన. మూలరూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సంఘమంతటికీ వర్తించే సంభావ్య సమగ్రార్థాన్ని పాదటిప్పణిలో తెలిపాం.
- source_word: οὐ χρείαν ἔχετε
  choice: అవసరం లేదు
  rationale: అవసరం లేకపోవడాన్ని తెలిపే గ్రీకు నుడికారానికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ὑμῖν
  choice: మీకు
  rationale: వ్రాయబడే విషయానికి పరోక్ష కర్మగా ఉన్న దత్తివాచక సర్వనామాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: γράφεσθαι
  choice: వ్రాయబడాల్సిన
  rationale: గ్రీకులోని కర్మణి క్రియారూపాన్ని నిలిపి, వ్రాసే వ్యక్తిని స్పష్టంగా చేర్చకుండా ఉంచుతుంది.
theological_decisions:
- issue: విశ్వాసుల సమాజానికి లింగసూచక సంబోధన
  choice: సహోదరులారా
  alternative: సహోదర సహోదరీలారా
  rationale: ἀδελφοί వ్యాకరణపరంగా పుంలింగ బహువచనం; అందువల్ల మూలరూపాన్ని ప్రధాన పాఠ్యంలో ఉంచాం. అయితే ఇది స్త్రీపురుషులందరితో కూడిన విశ్వాసుల సమాజాన్ని ఉద్దేశించే అవకాశం ఉన్నందున ఆ సమగ్రార్థాన్ని పాదటిప్పణిలో భద్రపరిచాం.
- issue: χρόνοι మరియు καιροί మధ్య భావభేదం
  choice: కాలాలూ నియమిత సమయాలూ
  alternative: కాలాలూ సమయాలూ
  rationale: రెండు గ్రీకు పదాలను ఒకే అర్థంగా కలిపేయకుండా, χρόνοι యొక్క కాలవ్యాప్తి భావానికీ καιροί యొక్క నిర్ణీత లేదా అనుకూల సమయ భావానికీ మధ్య ఉన్న స్వల్ప ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ఇక’ విషయమార్పును సూచిస్తుంది; ‘వ్రాయబడాల్సిన’ మూలంలోని కర్మణి రూపాన్నీ రచయితను పేర్కొనని అస్పష్టతనూ కాపాడుతుంది.
