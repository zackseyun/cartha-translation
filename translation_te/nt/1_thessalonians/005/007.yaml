reference: 1 Thessalonians 5:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ γὰρ καθεύδοντες νυκτὸς καθεύδουσιν, καὶ οἱ μεθυσκόμενοι νυκτὸς μεθύουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_thessalonians/005/007.yaml
  text: For those who sleep, sleep at night, and those who get drunk, get drunk at night.
translation:
  language: te
  text: ఎందుకంటే నిద్రపోయేవారు రాత్రివేళ నిద్రపోతారు; మరియు మత్తెక్కేవారు రాత్రివేళ మత్తెక్కుతారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి వివరణాత్మక ఆధారాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో కారణసంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: οἱ καθεύδοντες ... καθεύδουσιν
  choice: నిద్రపోయేవారు ... నిద్రపోతారు
  rationale: ఆర్టికల్‌తో కూడిన వర్తమాన కృదంతాన్ని సాధారణ వర్గాన్ని సూచించేలా అనువదించి, మూలంలోని పదపునరుక్తి మరియు సమాంతర నిర్మాణాన్ని నిలిపింది.
- source_word: νυκτός
  choice: రాత్రివేళ
  rationale: క్రియావిశేషణార్థక షష్ఠీ విభక్తి ఇక్కడ కాలాన్ని సూచిస్తుంది; ‘రాత్రివేళ’ సంక్షిప్తమైన, సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: οἱ μεθυσκόμενοι ... μεθύουσιν
  choice: మత్తెక్కేవారు ... మత్తెక్కుతారు
  rationale: మద్యం వల్ల మత్తు పొందే చర్య లేదా స్థితిని తెలుపుతూ, కృదంతం మరియు సమాపక క్రియ మధ్యనున్న మూలభాషా పునరుక్తిని కాపాడుతుంది.
- source_word: καί
  choice: ;
  rationale: రెండు సమాంతర ఉపవాక్యాల సమన్వయాన్ని తెలుగులో సహజంగా చూపేందుకు విరామచిహ్నంతో అనుసంధానించబడింది; భావపరంగా ‘మరియు’ అనే సమన్వయ బలం నిలుస్తుంది.
theological_decisions:
- issue: నిద్ర మరియు మత్తును అక్షరార్థంగా అనువదించాలా, రూపకార్థాన్ని వివరణగా చేర్చాలా
  choice: ప్రధాన పాఠ్యంలో ‘నిద్రపోవడం,’ ‘మత్తెక్కడం’ అనే సాధారణ రాత్రివేళ ప్రవర్తనకు సంబంధించిన చిత్రణను యథాతథంగా ఉంచడం
  alternative: ఆధ్యాత్మిక అజాగ్రత్త మరియు నైతిక విచ్చలవిడితనంగా నేరుగా అనువదించడం
  rationale: సందర్భంలో పౌలు సాధారణ రాత్రివేళ ప్రవర్తనను ఆధ్యాత్మిక మెలకువకు విరుద్ధమైన ఉపమానంగా ఉపయోగిస్తున్నాడు. అక్షరార్థ చిత్రణను ఉంచడం ద్వారా అనువాదంలోనే వ్యాఖ్యానాన్ని చొప్పించకుండా మూలంలోని ఉపమాన బలం, ఉద్వేగం నిలుస్తాయి.
translation_notes:
  register: సరళమైన, ఆధునిక, గౌరవప్రదమైన ప్రామాణిక తెలుగు. రెండు ఉపవాక్యాల్లోని ఉద్దేశపూర్వక పునరుక్తి, సమాంతరత నిలిపబడ్డాయి. ‘మత్తెక్కు’ అనేది ‘త్రాగు’ కంటే మూలంలోని మత్తు స్థితి/ప్రక్రియను స్పష్టంగా తెలియజేస్తుంది.
