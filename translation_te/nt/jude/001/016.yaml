id: JUD.1.16
reference: Jude 1:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν γογγυσταί, μεμψίμοιροι, κατὰ τὰς ἐπιθυμίας ⸀αὐτῶν πορευόμενοι, καὶ τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα, θαυμάζοντες πρόσωπα ὠφελείας χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/016.yaml
  text: These are grumblers[a], malcontents, walking according to their own desires, and their mouth speaks arrogant things[c][b], showing favoritism for the sake of gain.
translation:
  language: te
  text: వీరు సణుగువారు, తమ పరిస్థితిపై అసంతృప్తితో ఫిర్యాదు చేసేవారు; తమ సొంత కోరికల ప్రకారం నడుచుకునేవారు.[a] వారి నోరు అహంకారపూరితమైన మాటలు పలుకుతుంది; తమకు ప్రయోజనం కలగాలని మనుషుల పట్ల పక్షపాతం చూపుతారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కోరికలు’ అనే పదాన్ని ‘దురాశలు’ లేదా ‘మోహాలు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘మనుషుల పట్ల పక్షపాతం చూపుతారు’—అక్షరార్థంగా, ‘ముఖాలను మెచ్చుకుంటారు’; ఇది స్వప్రయోజనం కోసం వ్యక్తులను ప్రత్యేకంగా ఆదరించడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσταί
  choice: సణుగువారు
  rationale: మాటిమాటికీ అసంతృప్తిని గొణుగుతూ వ్యక్తం చేసే స్వభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μεμψίμοιροι
  choice: తమ పరిస్థితిపై అసంతృప్తితో ఫిర్యాదు చేసేవారు
  rationale: ఈ అరుదైన పదం తమకు దక్కిన పరిస్థితి లేదా వాటాపట్ల అసంతృప్తితో ఫిర్యాదు చేసేవారిని సూచిస్తుంది; సాధారణ ‘విమర్శకులు’ అనే అర్థం కంటే దీనిని స్పష్టంగా చూపుతుంది.
- source_word: κατὰ τὰς ἐπιθυμίας αὐτῶν πορευόμενοι
  choice: తమ సొంత కోరికల ప్రకారం నడుచుకునేవారు
  rationale: πορεύομαι ఇక్కడ జీవన ప్రవర్తనను సూచించే రూపక ప్రయోగం; ἐπιθυμίαι లైంగిక వాంఛలకే పరిమితం కాకుండా స్వార్థపూరితమైన బలమైన కోరికలను విస్తృతంగా సూచించగలదు.
- source_word: τὸ στόμα αὐτῶν λαλεῖ ὑπέρογκα
  choice: వారి నోరు అహంకారపూరితమైన మాటలు పలుకుతుంది
  rationale: గ్రీకు వాక్యంలోని ఏకవచన ‘నోరు’ అనే వాక్ప్రయోగాన్ని నిలుపుతూ, ὑπέρογκα సూచించే ఉబ్బిన, అతిశయపూరితమైన, అహంకారపు మాటలను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: θαυμάζοντες πρόσωπα
  choice: మనుషుల పట్ల పక్షపాతం చూపుతారు
  rationale: అక్షరార్థంగా ‘ముఖాలను మెచ్చుకోవడం’ అనే ఈ గ్రీకు నుడికారం వ్యక్తులను స్వార్థ ప్రయోజనంతో ప్రత్యేకంగా ఆదరించడం లేదా వారి పక్షం వహించడాన్ని సూచిస్తుంది.
- source_word: ὠφελείας χάριν
  choice: తమకు ప్రయోజనం కలగాలని
  rationale: ὠφέλεια కేవలం ధనలాభానికే కాక ప్రయోజనం లేదా అనుకూలతకు కూడా వర్తిస్తుంది; అందువల్ల మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: οὗτοί εἰσιν
  choice: వీరు
  rationale: సందర్భంలో ఇప్పటికే ప్రస్తావించిన వ్యక్తులను సూటిగా గుర్తించే సంక్షిప్తమైన సహజ తెలుగు రూపం.
theological_decisions:
- issue: ἐπιθυμίαι యొక్క నైతిక భావబలం
  choice: ప్రధాన పాఠ్యంలో ‘కోరికలు’; ప్రతికూల నైతిక భావం సందర్భం ద్వారా వ్యక్తమవుతుంది
  alternative: ‘దురాశలు’ లేదా ‘మోహాలు’
  rationale: ఈ పదం సాధారణంగా బలమైన కోరికలను సూచించగలిగినా, యూదా ఖండనాత్మక సందర్భంలో అవి స్వార్థపూరితమైనవని స్పష్టమవుతుంది. ‘మోహాలు’ అని అనడం భావాన్ని లైంగిక వాంఛలకు అతిగా పరిమితం చేయవచ్చు.
- issue: θαυμάζοντες πρόσωπα అనే నుడికారం
  choice: మనుషుల పట్ల పక్షపాతం చూపడం
  alternative: మనుషులను ముఖస్తుతి చేయడం
  rationale: నుడికారం వ్యక్తులను స్వప్రయోజనం కోసం ప్రత్యేకంగా ఆదరించడాన్ని సూచిస్తుంది. ముఖస్తుతి ఇందులో ఉండవచ్చు గాని, అది సాధ్యమైన వ్యక్తీకరణను మాత్రమే ప్రధాన అర్థంగా పరిమితం చేస్తుంది.
- issue: ὠφέλεια యొక్క పరిధి
  choice: ప్రయోజనం
  alternative: లాభం
  rationale: మూలపదం ఆర్థిక లాభాన్ని మాత్రమే కాక సాధారణ అనుకూలత లేదా ప్రయోజనాన్ని కూడా సూచించగలదు; అందువల్ల విస్తృత పదాన్ని ఎంచుకున్నారు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘నడుచుకునేవారు’ మరియు ‘వారి నోరు’ అనే మూలభాషా రూపకాలను తెలుగులో సహజంగా ఉన్నంతవరకు నిలుపుతూ, అరుదైన μεμψίμοιροι భావాన్ని వివరణాత్మకంగా అనువదించారు.
