review_pass:
  verdict: revise
  source_fidelity: The draft preserves the principal elements of the Greek, including the unresolved comparison in τὸν ὅμοιον τρόπον τούτοις, the literal sense of σαρκὸς ἑτέρας, and the judicial force of δίκην ὑπέχουσαι. However, ‘వెంబడించినందువల్ల’ introduces an explicit causal relation (‘because’) not expressed by the participles, and ‘నిలిచాయి’ changes the present force of πρόκεινται to a completed past result. ‘హెచ్చరికాత్మక’ is a permissible contextual implication but is stronger than the direct lexical sense of δεῖγμα (‘example’).
  naturalness: The Telugu is generally clear and suitably formal. The revision removes the unnecessary causal connective, uses a more natural present-state expression for ‘are set forth,’ and avoids the mildly over-interpreting adjective ‘హెచ్చరికాత్మక.’
  terminology: ‘లైంగిక దుర్నీతి,’ ‘వేరొక శరీరం,’ and ‘నిత్యాగ్ని శిక్ష’ are appropriate modern-standard Telugu renderings. The place names are conventional. The pronoun in the comparison is retained without resolving its debated antecedent.
  issues:
  - severity: medium
    issue: ‘వెంబడించినందువల్ల’ adds causation.
    rationale: ἐκπορνεύσασαι and ἀπελθοῦσαι are coordinated aorist participles describing the cities; the Greek does not explicitly say that their being an example occurred ‘because’ they pursued other flesh.
  - severity: medium
    issue: ‘నిలిచాయి’ does not adequately represent the present πρόκεινται.
    rationale: πρόκεινται means ‘are set forth/displayed’ in the present. ‘నిదర్శనంగా ఉంచబడి ఉన్నాయి’ preserves both the public exemplary sense and the ongoing present force.
  - severity: low
    issue: ‘హెచ్చరికాత్మక’ is interpretively stronger than δεῖγμα.
    rationale: The context certainly has warning force, but δεῖγμα itself is most directly ‘example.’ Rendering it simply as ‘నిదర్శనం’ avoids adding emphasis not lexically present.
  revised_text: అలాగే సొదొమ, గొమొర్రా, వాటి చుట్టుపక్కల ఉన్న పట్టణాలు కూడా, వీరి మాదిరిగా[a] లైంగిక దుర్నీతికి పాల్పడి, వేరొక శరీరాన్ని[b] వెంబడించి, నిత్యాగ్ని శిక్షను అనుభవిస్తూ నిదర్శనంగా ఉంచబడి ఉన్నాయి.
