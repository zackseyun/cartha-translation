id: JUD.1.7
reference: Jude 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς Σόδομα καὶ Γόμορρα καὶ αἱ περὶ αὐτὰς πόλεις, τὸν ὅμοιον ⸂τρόπον τούτοις⸃ ἐκπορνεύσασαι καὶ ἀπελθοῦσαι ὀπίσω σαρκὸς ἑτέρας, πρόκεινται δεῖγμα πυρὸς αἰωνίου δίκην ὑπέχουσαι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/007.yaml
  text: just as Sodom and Gomorrah and the cities around them[a], having in like manner committed sexual immorality and gone after other flesh, are set forth as an example[b], undergoing the punishment of eternal fire.
translation:
  language: te
  text: అలాగే సొదొమ, గొమొర్రా, వాటి చుట్టుపక్కల ఉన్న పట్టణాలు కూడా, వీరి మాదిరిగా[a] లైంగిక దుర్నీతికి పాల్పడి, వేరొక శరీరాన్ని[b] వెంబడించి, నిత్యాగ్ని శిక్షను అనుభవిస్తూ నిదర్శనంగా ఉంచబడి ఉన్నాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వీరి మాదిరిగా’ అనే మాట 6వ వచనంలో చెప్పిన దేవదూతలను సూచించవచ్చు; లేదా ముందుగా చెప్పిన తిరుగుబాటు, తీర్పు ఉదాహరణలను మరింత విస్తృతంగా సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా ‘వేరొక శరీరం’; ‘భిన్నమైన శరీరం’ అని కూడా అనువదించవచ్చు. సంప్రదాయ అనువాదాల్లో ‘పర శరీరం’ అని ఉంటుంది. ఈ పదబంధాన్ని ఇక్కడ ఒకే నిర్దిష్ట వ్యాఖ్యానానికి పరిమితం చేయలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: అలాగే
  rationale: ముందటి ఉదాహరణలతో పోలికను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: Σόδομα καὶ Γόμορρα
  choice: సొదొమ, గొమొర్రా
  rationale: తెలుగు బైబిల్ వాడుకలో స్థిరపడిన స్థలనామ రూపాలు.
- source_word: αἱ περὶ αὐτὰς πόλεις
  choice: వాటి చుట్టూ ఉన్న పట్టణాలు
  rationale: περί యొక్క పరిసర ప్రాంత భావాన్ని నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὸν ὅμοιον τρόπον τούτοις
  choice: ఇవరి మాదిరిగానే
  rationale: గ్రీకు వాక్యంలో ఉన్న పోలికను నిలుపుతుంది; τούτοις ఎవరిని సూచిస్తుందో ప్రధాన పాఠ్యంలో నిర్ధారించకుండా పాదసూచికలో వివరిస్తుంది.
- source_word: ἐκπορνεύσασαι
  choice: లైంగిక దుర్నీతికి పాల్పడి
  rationale: లైంగిక అనైతిక ప్రవర్తనను స్పష్టంగా, గౌరవప్రదమైన ఆధునిక భాషలో వ్యక్తం చేస్తుంది.
- source_word: ἀπελθοῦσαι ὀπίσω
  choice: వెంబడించినందువల్ల
  rationale: దేనినైనా ఆశించి దాని వెంట వెళ్లడం అనే గ్రీకు నుడికార భావాన్ని కాపాడుతుంది.
- source_word: σαρκὸς ἑτέρας
  choice: వేరొక శరీరాన్ని
  rationale: ἑτέρα యొక్క ‘వేరొక/భిన్నమైన’ భావాన్నీ σάρξ యొక్క శరీరార్థాన్నీ, నిర్దిష్ట వ్యాఖ్యానానికి కుదించకుండా నిలుపుతుంది.
- source_word: πρόκεινται δεῖγμα
  choice: ఒక హెచ్చరికాత్మక నిదర్శనంగా నిలిచాయి
  rationale: బహిరంగంగా చూపబడిన ఉదాహరణ అనే భావంతోపాటు సందర్భంలోని హెచ్చరిక స్వరాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: πυρὸς αἰωνίου δίκην ὑπέχουσαι
  choice: నిత్య అగ్ని శిక్షను అనుభవిస్తూ
  rationale: న్యాయపరమైన శిక్షను పొందడం అనే నుడికారాన్ని, αἰώνιος యొక్క కాలసంబంధ బరువును తగ్గించకుండా అనువదిస్తుంది.
theological_decisions:
- issue: τούτοις అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘ఇవరి మాదిరిగానే’ అని పోలికను ఉంచి, దాని సూచితులను నిర్ధారించలేదు.
  alternative: ఇది 6వ వచనంలోని దేవదూతలను ప్రత్యేకంగా సూచిస్తుంది; లేదా ముందున్న తిరుగుబాటు మరియు తీర్పు ఉదాహరణలను విస్తృతంగా సూచిస్తుంది.
  rationale: గ్రీకు పాఠ్యం పోలికను స్పష్టంగా చెబుతుంది, కాని సర్వనామపు ఖచ్చిత పూర్వపదం వ్యాఖ్యానపరంగా వివాదాస్పదం. అందువల్ల అసలు సందిగ్ధతను పాదసూచికలో నిలిపాం.
- issue: σαρκὸς ἑτέρας యొక్క నిర్దిష్ట భావం
  choice: ‘వేరొక శరీరం’ అని పదబద్ధ భావాన్ని నిలిపాం.
  alternative: ‘భిన్నమైన శరీరం’ లేదా ఒక నిర్దిష్ట లైంగిక ఆచారంగా గానీ, దేవదూత-మానవ హద్దు అతిక్రమణగా గానీ వివరించడం.
  rationale: ఈ పదబంధపు ఖచ్చిత సూచన వివాదాస్పదం. మూలపాఠ్యం చెప్పినదానికంటే సంకుచితమైన సిద్ధాంతార్థాన్ని అనువాదంలో చేర్చలేదు.
- issue: πυρὸς αἰωνίου యొక్క తీర్పు భాష
  choice: ‘నిత్య అగ్ని’ అని నేరుగా అనువదించాం.
  alternative: ‘శాశ్వత అగ్ని’ లేదా ఈ వచనాన్ని మించిన వ్యవస్థీకృత సిద్ధాంత వివరణ.
  rationale: మూలంలోని గంభీరమైన తీర్పు భాషను తగ్గించకుండా, అదే సమయంలో వచనం చెప్పనిదాన్ని విస్తరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే తీర్పు సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. దీర్ఘ గ్రీకు వాక్య నిర్మాణాన్ని స్పష్టంగా చదవడానికి విరామచిహ్నాలు ఉపయోగించబడ్డాయి.
