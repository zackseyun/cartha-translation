revisions:
- from: అలాగే సొదొమ, గొమొర్రా, వాటి చుట్టూ ఉన్న పట్టణాలు కూడా—ఇవరి మాదిరిగానే[a] లైంగిక దుర్నీతికి పాల్పడి, వేరొక శరీరాన్ని[b] వెంబడించినందువల్ల—నిత్య అగ్ని శిక్షను అనుభవిస్తూ, ఒక హెచ్చరికాత్మక నిదర్శనంగా నిలిచాయి.
  to: అలాగే సొదొమ, గొమొర్రా, వాటి చుట్టుపక్కల ఉన్న పట్టణాలు కూడా, వీరి మాదిరిగా[a] లైంగిక దుర్నీతికి పాల్పడి, వేరొక శరీరాన్ని[b] వెంబడించి, నిత్యాగ్ని శిక్షను అనుభవిస్తూ నిదర్శనంగా ఉంచబడి ఉన్నాయి.
  rationale: The revision retains the source text’s ambiguity concerning τούτοις and σαρκὸς ἑτέρας, while correcting the added causal nuance, restoring the present force of πρόκεινται, and rendering δεῖγμα without an unnecessary interpretive intensifier. Footnote markers remain correctly paired with their respective disputed expressions.
