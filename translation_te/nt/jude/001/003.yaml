id: JUD.1.3
reference: Jude 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀγαπητοί, πᾶσαν σπουδὴν ποιούμενος γράφειν ὑμῖν περὶ τῆς κοινῆς ⸀ἡμῶν σωτηρίας ἀνάγκην ἔσχον γράψαι ὑμῖν παρακαλῶν ἐπαγωνίζεσθαι τῇ ἅπαξ παραδοθείσῃ τοῖς ἁγίοις πίστει.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/003.yaml
  text: Beloved[a], although I was making every effort to write to you about our common salvation, I found it necessary to write[d][c][b], urging you to contend earnestly for the faith once for all delivered to the saints.
translation:
  language: te
  text: ప్రియులారా, మన ఉమ్మడి రక్షణ గురించి మీకు రాయడానికి నేను ఎంతో శ్రద్ధ చూపుతూ ఉన్నప్పటికీ, పరిశుద్ధులకు ఒక్కసారే అప్పగించబడిన విశ్వాసం కోసం మీరు దృఢంగా పోరాడాలని విజ్ఞప్తి చేస్తూ మీకు రాయడం అవసరమని భావించాను.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “విశ్వాసం” ఇక్కడ వ్యక్తిగతంగా నమ్మే చర్యను మాత్రమే కాక, విశ్వాసులకు అప్పగించబడిన క్రైస్తవ బోధను సూచించే అవకాశం ఎక్కువ.
    reason: alternative_reading
  - marker: b
    text: “అప్పగించబడిన” అనే పదాన్ని “అందజేయబడిన” లేదా “సంప్రదాయంగా అందించబడిన” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “పరిశుద్ధులు” అంటే దేవునికి చెందిన పవిత్ర ప్రజలు, అంటే విశ్వాసులు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: ప్రియులారా
  rationale: ఆప్యాయతతో కూడిన బహువచన సంబోధనను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πᾶσαν σπουδὴν ποιούμενος
  choice: నేను ఎంతో ఆసక్తి చూపుతున్నప్పటికీ
  rationale: సందర్భంలోని విరుద్ధ భావాన్ని concessive రూపంలో నిలుపుతూ, శ్రద్ధతో కూడిన ఉత్సాహాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: περὶ τῆς κοινῆς ἡμῶν σωτηρίας
  choice: మనందరం పంచుకునే రక్షణ గురించి
  rationale: κοινῆς యొక్క ఉమ్మడి లేదా పంచుకునే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ἀνάγκην ἔσχον
  choice: అవసరమని భావించాను
  rationale: పరిస్థితుల వల్ల ఏర్పడిన అవసరాన్ని తెలుపుతుంది; బలవంతం చేయబడ్డాననే మితిమీరిన భావాన్ని చేర్చదు.
- source_word: παρακαλῶν
  choice: ప్రోత్సహిస్తూ
  rationale: ఇక్కడి గంభీరమైన విజ్ఞప్తి లేదా ప్రబోధ భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యే భాషలో అందిస్తుంది.
- source_word: ἐπαγωνίζεσθαι
  choice: పట్టుదలతో పోరాడాలని
  rationale: సమ్మిళిత క్రియలోని తీవ్రతను నిలుపుతుంది; శారీరక హింసను తప్పనిసరిగా సూచించకుండా దృఢమైన కృషిని తెలియజేస్తుంది.
- source_word: τῇ ... πίστει
  choice: విశ్వాసం కోసం
  rationale: ఈ సందర్భంలో విశ్వాసుల వ్యక్తిగత నమ్మకం కంటే వారికి అప్పగించబడిన క్రైస్తవ బోధ లేదా విశ్వాస సంపదను ప్రధానంగా సూచిస్తుంది; మూలపదపు విస్తృతిని మాత్రం నిలుపుతుంది.
- source_word: ἅπαξ
  choice: ఒక్కసారిగా, శాశ్వతంగా
  rationale: నిర్ణాయకమైన, మళ్లీ మళ్లీ జరగని అప్పగింత అనే బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: παραδοθείσῃ
  choice: అప్పగించబడిన
  rationale: అందజేయడం, అప్పగించడం, తరలించి ఇవ్వడం అనే భావాలను మోస్తూ, బోధను విశ్వాసుల సమాజానికి అప్పగించిన సందర్భానికి సరిపోతుంది.
- source_word: τοῖς ἁγίοις
  choice: పరిశుద్ధులకు
  rationale: దేవునికి చెందిన పవిత్ర ప్రజలను సూచించే స్థిరమైన బైబిలు పదప్రయోగాన్ని నిలుపుతుంది.
theological_decisions:
- issue: πίστις అనే పదం ఇక్కడ సూచించే భావం
  choice: విశ్వాసుల సమాజానికి అప్పగించబడిన క్రైస్తవ విశ్వాస బోధ
  alternative: వ్యక్తులు దేవునిపై ఉంచే నమ్మకం
  rationale: ‘అప్పగించబడిన’ మరియు ‘దాని కోసం పోరాడాలి’ అనే నిర్మాణం ఒక బోధా సంపదను సూచించే అవకాశాన్ని బలపరుస్తుంది; అయితే ప్రధాన పాఠంలో ‘విశ్వాసం’ అనే పదాన్ని ఉంచడం ద్వారా పదంలోని సహజ విస్తృతిని కాపాడుతుంది.
- issue: ἅπαξ παραδοθείσῃ యొక్క బలం
  choice: నిర్ణాయకంగా ఒక్కసారే అప్పగించబడింది
  alternative: గతంలో ఏదో ఒకసారి అప్పగించబడింది
  rationale: ఈ సందర్భంలో ἅπαξ అప్పగింత యొక్క నిర్ణాయక, పునరావృతం కాని స్వభావాన్ని బలంగా సూచిస్తుంది; దానిని తరువాతి ఏదైనా మతసిద్ధాంత వ్యవస్థతో సమానీకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ఆప్యాయమైన సంబోధనతో గంభీరమైన ప్రబోధ స్వరం. పొడవైన గ్రీకు వాక్య నిర్మాణాన్ని సాధ్యమైనంతవరకు ఒకే ప్రవాహంలో ఉంచి, సహజమైన తెలుగు క్రమానికి మార్చాం. మూలంలోని γράφειν ... γράψαι పునరుక్తిని ‘రాయడానికి ... రాయడం’గా నిలిపాం.
