  to: ప్రియులారా, మన ఉమ్మడి రక్షణ గురించి మీకు రాయడానికి నేను ఎంతో శ్రద్ధ చూపుతూ ఉన్నప్పటికీ, పరిశుద్ధులకు ఒక్కసారే అప్పగించబడిన విశ్వాసం కోసం మీరు దృఢంగా పోరాడాలని విజ్ఞప్తి చేస్తూ మీకు రాయడం అవసరమని భావించాను.[a][b][c]
  rationale: The revision removes the unwarranted ‘eternally’ while retaining the definitive once-for-all sense of ἅπαξ. It strengthens the rendering of πᾶσαν σπουδὴν and παρακαλῶν, and uses more idiomatic concise Telugu for the shared salvation. It preserves the Greek's two references to writing and does not add doctrinal interpretation to the main text.
