id: JUD.1.24
reference: Jude 1:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ φυλάξαι ⸀ὑμᾶς ἀπταίστους καὶ στῆσαι κατενώπιον τῆς δόξης αὐτοῦ ἀμώμους ἐν ἀγαλλιάσει
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/024.yaml
  text: To the one who is able to keep you from stumbling and to present you blameless before his glory with rejoicing[c][b][a],
translation:
  language: te
  text: మిమ్మల్ని తడబడకుండా[a] కాపాడడానికీ, తన మహిమ ఎదుట[b] మిమ్మల్ని నిందలేనివారిగా[c] ఉల్లాసంతో నిలబెట్టడానికీ శక్తిగలవానికి—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “పడిపోకుండా.” గ్రీకు పదం తడబడకపోవడం లేదా పడిపోకపోవడం అనే భావాన్ని కలిగి ఉంది.'
    reason: lexical_alternative
  - marker: b
    text: 'అక్షరార్థంగా: “తన మహిమ ఎదుట.” దీనిని కొన్నిసార్లు “తన మహిమాన్విత సన్నిధిలో” అని కూడా భావానువాదం చేస్తారు.'
    reason: alternative_reading
  - marker: c
    text: 'లేదా: “నిర్దోషులుగా”; ఈ గ్రీకు పదం “మచ్చలేనివారిగా” అనే భావాన్ని కూడా ప్రతిధ్వనింపజేయగలదు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: శక్తిగలవానికి
  rationale: దత్తివిభక్తిలో ఉన్న నామవాచకార్థక వర్తమాన కృదంతాన్ని సహజమైన తెలుగులో చూపుతుంది; 25వ వచనంలో కొనసాగే స్తుతివాక్య నిర్మాణాన్ని కూడా నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది బలమైన వ్యతిరేకతను కాక ముగింపు స్తుతికి మృదువైన మార్పును సూచిస్తుంది. తెలుగులో కృత్రిమంగా ‘ఇప్పుడు’ లేదా ‘అయితే’ చేర్చకుండా వాక్యమార్పు ద్వారానే ఆ పని జరుగుతుంది.
- source_word: φυλάξαι
  choice: కాపాడడానికి
  rationale: φυλάσσω లోని కాపాడటం, భద్రపరచటం అనే భావాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది.
- source_word: ὑμᾶς
  choice: మిమ్మల్ని
  rationale: మూలంలోని ద్వితీయ పురుష బహువచన కర్మను స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: ἀπταίστους
  choice: తడబడకుండా
  rationale: పడిపోవడం లేదా తప్పటడుగు వేయడం అనే రూపకాన్ని నిలుపుతూ, దాన్ని కేవలం నైతిక నిర్దోషిత్వంగా గానీ తుద భ్రష్టత్వంగా గానీ సంకుచితం చేయదు.
- source_word: καὶ στῆσαι
  choice: నిలబెట్టడానికి
  rationale: ἵστημι లోని ‘నిలిచేలా చేయడం’ అనే మూలచిత్రాన్ని తెలుగులో సహజంగా నిలుపుతుంది; దేవుని మహిమ ఎదుట సమర్పణ భావం సందర్భం ద్వారా వ్యక్తమవుతుంది.
- source_word: κατενώπιον
  choice: ఎదుట
  rationale: ‘ముందు/సన్నిధిలో’ అనే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: τῆς δόξης αὐτοῦ
  choice: తన మహిమ
  rationale: మూలంలోని δόξα అనే నామవాచకాన్ని నేరుగా నిలుపుతుంది; ‘మహిమాన్విత సన్నిధి’ అనే వివరణాత్మక విస్తరణను చేర్చదు.
- source_word: ἀμώμους
  choice: నిర్దోషులుగా
  rationale: నైతిక నిందారాహిత్యాన్ని సులభంగా తెలియజేస్తూనే, ‘మచ్చలేని’ అనే బలిపరమైన ప్రతిధ్వనికి పాదసూచికలో స్థానం ఇస్తుంది.
- source_word: ἐν ἀγαλλιάσει
  choice: ఉల్లాసంతో
  rationale: ἀγαλλίασις సూచించే పొంగిపొర్లే ఆనందాన్ని అదనంగా ‘గొప్ప’ వంటి పదం చేర్చకుండా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: τῆς δόξης αὐτοῦ ను నేరుగా ‘తన మహిమ’గా అనువదించాలా, లేక ‘తన మహిమాన్విత సన్నిధి’గా విస్తరించాలా
  choice: తన మహిమ
  alternative: తన మహిమాన్విత సన్నిధి
  rationale: గ్రీకు పాఠంలో ‘మహిమ’ అనే నామవాచకమే ఉంది. దేవుని సన్నిధి సందర్భంలో అంతర్లీనంగా ఉన్నప్పటికీ, దాన్ని ప్రధాన పాఠంలో వివరణగా చేర్చకుండా మూలపాఠపు రూపాన్ని, దైవశాస్త్రీయ బరువును నిలిపింది.
- issue: ἀπταίστους ను సాధారణ తడబాటు నుండి కాపాడటంగా అనువదించాలా, లేక అంతిమ పతనం నుండి కాపాడటంగా నిర్దిష్టం చేయాలా
  choice: తడబడకుండా
  alternative: పడిపోకుండా
  rationale: ‘తడబడటం’ మూలంలోని రూపకాన్ని నిలుపుతుంది; ఇది దైనందిన పాపం, సిద్ధాంతపరమైన తప్పు, లేదా అంతిమ పతనం—వీటిలో ఏ ఒక్కదానికీ అర్థాన్ని అనవసరంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకునికి అర్థమయ్యే గంభీరమైన స్తుతివాక్య శైలి ఉపయోగించబడింది. ఇది 25వ వచనంలో పూర్తయ్యే ఒకే వాక్యభాగం కావడంతో చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది. ‘కాపాడడానికీ ... నిలబెట్టడానికీ శక్తిగలవానికి’ అనే నిర్మాణం ఒకే శక్తిమంతునికి సంబంధించిన రెండు సమాంతర క్రియలను స్పష్టంగా చూపుతుంది.
