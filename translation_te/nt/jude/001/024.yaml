- from: మిమ్మల్ని తడబడకుండా[a] కాపాడడానికీ, తన మహిమ ఎదుట[b] మిమ్మల్ని నిర్దోషులుగా[c] ఉల్లాసంతో నిలబెట్టడానికీ శక్తిగలవానికి—
  to: మిమ్మల్ని తడబడకుండా[a] కాపాడడానికీ, తన మహిమ ఎదుట[b] మిమ్మల్ని నిందలేనివారిగా[c] ఉల్లాసంతో నిలబెట్టడానికీ శక్తిగలవానికి—
  rationale: A limited lexical refinement changes only the rendering of ἀμώμους from “నిర్దోషులుగా” to “నిందలేనివారిగా.” This better represents the Greek’s broad sense of blamelessness without excluding its “without blemish” resonance, which remains documented in the footnote. No doctrinal implication is added or resolved.
