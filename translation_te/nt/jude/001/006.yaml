id: JUD.1.6
reference: Jude 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀγγέλους τε τοὺς μὴ τηρήσαντας τὴν ἑαυτῶν ἀρχὴν ἀλλὰ ἀπολιπόντας τὸ ἴδιον οἰκητήριον εἰς κρίσιν μεγάλης ἡμέρας δεσμοῖς ἀϊδίοις ὑπὸ ζόφον τετήρηκεν·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/006.yaml
  text: And the angels who did not keep their own domain[a], but abandoned their proper dwelling[c][b], he has kept in eternal chains under gloom for the judgment of the great day.
translation:
  language: te
  text: 'అలాగే, తమకు చెందిన అధికార పరిధిని[a] నిలుపుకోకుండా, తమకు తగిన నివాసాన్ని[b] విడిచిపెట్టిన దేవదూతలను ఆయన మహా దినపు తీర్పు కోసం నిత్య సంకెళ్లలో, గాఢాంధకారం[c] కింద బంధించి ఉంచాడు.


    [a] లేదా, “తమకు చెందిన స్థానం”; లేదా, “తమ అధికారం.”


    [b] లేదా, “తమ సొంత నివాసస్థలం.”


    [c] లేదా, “చీకటి కింద”; గ్రీకు పదం దట్టమైన, మసక చీకటిని సూచిస్తుంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమకు చెందిన స్థానం”; లేదా, “తమ అధికారం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తమ సొంత నివాసస్థలం.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “చీకటి కింద”; గ్రీకు పదం దట్టమైన, మసక చీకటిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλους
  choice: దేవదూతలను
  rationale: ఈ తీర్పు సందర్భంలో ఇది మానవ సందేశకులను కాక అలౌకిక ప్రాణులను సూచిస్తుంది.
- source_word: τηρήσαντας / τετήρηκεν
  choice: నిలుపుకోకుండా / ఉంచి ఉన్నాడు
  rationale: మొదటి క్రియ వారు తమకు నియమితమైన పరిధిలో నిలిచి ఉండకపోవడాన్ని, రెండవది దేవుడు వారిని తీర్పు కోసం నిర్బంధించి ఉంచిన కొనసాగుతున్న స్థితిని తెలియజేస్తుంది. తెలుగులో సహజత్వాన్ని కాపాడుతూ మూలంలోని వ్యతిరేకతను నిలిపింది.
- source_word: τὴν ἑαυτῶν ἀρχὴν
  choice: తమకు చెందిన అధికార పరిధిని
  rationale: ἀρχή ఇక్కడ అధికారం, స్థానం, లేదా నియమిత పరిధి అనే భావాలను కలిగి ఉండవచ్చు. “అధికార పరిధి” సందర్భానికి సరిపోతూనే ఒక్క వ్యాఖ్యానానికే పరిమితం చేయదు; ఇతర సాధ్యార్థాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: ἀπολιπόντας
  choice: విడిచిపెట్టిన
  rationale: ఇది కేవలం వెళ్లిపోవడం కాక, ఉద్దేశపూర్వకంగా వదిలివేయడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ ἴδιον οἰκητήριον
  choice: తమకు తగిన నివాసాన్ని
  rationale: οἰκητήριον నివాసస్థలాన్ని సూచిస్తుంది; ἴδιον ఇక్కడ వారికి చెందిన లేదా వారికి తగిన నివాసం అనే భావాన్ని ఇస్తుంది. “తగిన” అనేది సందర్భంలోని నియమిత నివాస భావాన్ని తెలియజేస్తుంది.
- source_word: εἰς κρίσιν μεγάλης ἡμέρας
  choice: మహా దినపు తీర్పు కోసం
  rationale: εἰς యొక్క ఉద్దేశం లేదా ఫలిత దిశను “కోసం” సహజంగా వ్యక్తం చేస్తుంది; మూలంలో లేని “వరకు” అనే కాలార్థాన్ని చేర్చదు.
- source_word: δεσμοῖς ἀϊδίοις
  choice: నిత్య బంధాల్లో
  rationale: δεσμοί సంకెళ్లు లేదా బంధాలు కావచ్చు. “బంధాలు” నిర్బంధ భావాన్ని స్పష్టంగా ఇస్తుంది; ἀΐδιος యొక్క నిరంతర స్థిరత్వాన్ని “నిత్య” తెలియజేస్తుంది.
- source_word: ὑπὸ ζόφον
  choice: కటిక చీకటి కింద
  rationale: ζόφος సాధారణ చీకటి కంటే దట్టమైన, భయంకరమైన అంధకారాన్ని సూచిస్తుంది. “కటిక చీకటి” ఆ తీవ్రతను సహజ తెలుగులో అందిస్తుంది; “కింద” ὑπό యొక్క రూపకాన్ని నిలుపుతుంది.
- source_word: τε
  choice: అలాగే
  rationale: ఈ ఉదాహరణను ముందున్న తీర్పు ఉదాహరణతో అనుసంధానిస్తుంది.
theological_decisions:
- issue: దేవదూతల అపరాధ స్వరూపం
  choice: వారు తమకు చెందిన అధికార పరిధిని నిలుపుకోకుండా, తమకు తగిన నివాసాన్ని విడిచిపెట్టారని మాత్రమే ప్రధాన పాఠం చెబుతుంది.
  alternative: ఇది ఆదికాండం 6తో ముడిపడిన దేవదూతల తిరుగుబాటును సూచించవచ్చు; లేదా సాధారణంగా ఆదికాలపు దేవదూతల పతనాన్ని సూచించవచ్చు.
  rationale: యూదా తన పాఠకులకు తెలిసిన యూదు సంప్రదాయాన్ని సూచిస్తుండవచ్చు; అయితే ఈ వాక్యంలోని గ్రీకు పాఠం ఆ నేపథ్యాన్ని వివరంగా నిర్వచించదు. అందువల్ల అనిశ్చితిని వ్యాఖ్యానంతో పూరించలేదు.
- issue: ἀΐδιος యొక్క బలం
  choice: నిత్య
  alternative: శాశ్వతమైన; నిరంతరమైన
  rationale: ఈ పదం నిలిచివుండే స్థిరత్వాన్ని సూచిస్తుంది. “నిత్య” స్పష్టమైనదీ ప్రామాణికమైనదీ; అయితే బంధాల స్వభావం గురించి పాఠానికి మించిన సిద్ధాంత వివరణను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. “అధికార పరిధి,” “తగిన నివాసం” వంటి పదబంధాలు మూలంలోని భావపరమైన విస్తృతిని నిలుపుతాయి. వాక్య నిర్మాణం తెలుగు పఠనసౌలభ్యం కోసం స్వల్పంగా పునర్వ్యవస్థీకరించబడింది; మూలంలోని తీర్పు స్వరం, చీకటి రూపకం, అంత్యకాల దిశ కాపాడబడ్డాయి.
