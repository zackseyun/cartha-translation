id: JUD.1.20
reference: Jude 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑμεῖς δέ, ἀγαπητοί, ⸂ἐποικοδομοῦντες ἑαυτοὺς τῇ ἁγιωτάτῃ ὑμῶν πίστει⸃, ἐν πνεύματι ἁγίῳ προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/020.yaml
  text: But you[a], beloved, building yourselves up in your most holy faith and praying in the Holy Spirit[c][b],
translation:
  language: te
  text: కాని ప్రియులారా, మీరు మీ అత్యంత పరిశుద్ధమైన విశ్వాసం[c] మీద[a] మిమ్మల్ని మీరు నిర్మించుకుంటూ, పరిశుద్ధాత్మలో[b] ప్రార్థిస్తూ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీ అత్యంత పరిశుద్ధమైన విశ్వాసంలో.’ ఈ గ్రీకు నిర్మాణం ఒక పునాది మీద నిర్మించడాన్నిగానీ, విశ్వాసానికి సంబంధించి బలపడడాన్నిగానీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పరిశుద్ధాత్మ ద్వారా.’ ఈ పదబంధం ప్రార్థన జరిగే పరిధిని (‘లో’) లేదా పరిశుద్ధాత్మ దానిని సాధ్యపరచడాన్ని (‘ద్వారా’) నొక్కి చెప్పవచ్చు.
    reason: alternative_reading
  - marker: c
    text: ఇక్కడ ‘విశ్వాసం’ అనేది ‘నమ్మకం’ లేదా ‘విశ్వసనీయత’ అని కూడా అర్థం కావచ్చు; అయితే యూదా పత్రిక సందర్భంలో ఇది విశ్వాసుల సమాజం పంచుకునే క్రైస్తవ విశ్వాసాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δέ
  choice: కాని ... మీరు
  rationale: δέ ముందున్న భక్తిహీనులకు మరియు ఇక్కడ సంబోధించబడుతున్న విశ్వాసులకు మధ్య ఉన్న వ్యత్యాసాన్ని చూపుతుంది; స్పష్టంగా ఉన్న ὑμεῖς‌కు అనుగుణంగా ‘మీరు’ను ఉంచడం ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἀγαπητοί
  choice: ప్రియులారా
  rationale: బహువచన సంబోధనలోని ఆప్యాయతను, గౌరవాన్ని ఆధునిక సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἐποικοδομοῦντες ἑαυτοὺς
  choice: మిమ్మల్ని మీరు నిర్మించుకుంటూ
  rationale: నిర్మాణ రూపకాన్ని, ఆత్మవాచక బహువచన భావాన్ని కాపాడుతుంది; సంఘంగా వారు బలపడుతున్న భావం సందర్భంలో సహజంగా వినిపిస్తుంది.
- source_word: τῇ ἁγιωτάτῃ ὑμῶν πίστει
  choice: మీ అత్యంత పరిశుద్ధమైన విశ్వాసం మీద
  rationale: ἁγιωτάτῃలోని అత్యుత్తమ స్థాయి భావాన్ని ‘అత్యంత పరిశుద్ధమైన’గా నిలుపుతూ, ἐποικοδομοῦντες‌తో దత్తి విభక్తి సూచించగల నిర్మాణపు ఆధార భావాన్ని ‘మీద’గా వ్యక్తం చేస్తుంది.
- source_word: πίστει
  choice: విశ్వాసం
  rationale: యూదా పత్రిక సందర్భంలో ఇది విశ్వాసుల సమాజం స్వీకరించి అంగీకరించిన క్రైస్తవ విశ్వాసాన్ని ప్రధానంగా సూచిస్తుంది; అయితే నమ్మకం లేదా విశ్వసనీయత అనే పదార్థ అవకాశాలను పాదసూచికలో నిలుపుతుంది.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: పరిశుద్ధాత్మలో
  rationale: ἐν యొక్క ప్రాథమిక పరిధి భావాన్ని కాపాడి, ఈ పదబంధాన్ని దేవుని పరిశుద్ధాత్మకు సూచనగా సహజంగా అందిస్తుంది; సాధనార్థక భావాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: προσευχόμενοι
  choice: ప్రార్థిస్తూ
  rationale: వర్తమాన కృదంత ప్రవాహాన్ని నిలుపుతూ, తరువాతి వచనంలో కొనసాగనున్న వాక్య నిర్మాణాన్ని తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: ἐν πνεύματι ἁγίῳలో πνεύματι ἁγίῳ యొక్క సూచన
  choice: దేవుని పరిశుద్ధాత్మ
  alternative: పరిశుద్ధమైన మానవ ఆత్మభావం
  rationale: తొలి క్రైస్తవ వాడుకలోను యూదా పత్రికలోని ఉపదేశ సందర్భంలోను ఈ పదబంధం పరిశుద్ధాత్మ ప్రభావ పరిధిలో జరిగే ప్రార్థనను అత్యంత సహజంగా సూచిస్తుంది; మూలంలో లేని అదనపు సిద్ధాంత వివరణను అనువాదం చేర్చదు.
- issue: ‘మీ అత్యంత పరిశుద్ధమైన విశ్వాసం’లో πίστις భావం
  choice: విశ్వాసుల సమాజం స్వీకరించిన క్రైస్తవ విశ్వాసం
  alternative: వ్యక్తిగతంగా నమ్మడం లేదా విశ్వసనీయత
  rationale: యూదా పత్రికలో ‘విశ్వాసం’ గురించిన సమీప వాడుక అపొస్తలుల ద్వారా అందించబడిన ఉమ్మడి విశ్వాసాన్ని సూచిస్తుంది. అయినా ‘విశ్వాసం’ అనే విస్తృత పదాన్నే ప్రధాన పాఠ్యంలో ఉంచి ఇతర సాధ్య భావాలను పాదసూచికలో పేర్కొంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడింది. ‘నిర్మించుకుంటూ’ అనే రూపం మూలంలోని నిర్మాణ రూపకాన్ని నిలుపుతుంది. వచనం 21వ వచనంలో కొనసాగుతుంది కాబట్టి చివర కామా ఉంచబడింది; పాదసూచిక గుర్తులన్నీ ప్రధాన పాఠ్యంలో ఉన్నాయి.
