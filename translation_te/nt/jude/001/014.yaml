id: JUD.1.14
reference: Jude 1:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Προεφήτευσεν δὲ καὶ τούτοις ἕβδομος ἀπὸ Ἀδὰμ Ἑνὼχ λέγων· Ἰδοὺ ἦλθεν κύριος ἐν ἁγίαις μυριάσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/014.yaml
  text: And Enoch[a], the seventh from Adam, also prophesied to these, saying, “Behold[c][b], the Lord came with his holy myriads,”
translation:
  language: te
  text: 'ఆదాము నుండి ఏడవవాడైన హనోకు కూడా వీరి గురించి[a] ప్రవచిస్తూ ఇలా అన్నాడు: “ఇదిగో,[b] ప్రభువు తన పవిత్రులైన అసంఖ్యాక సమూహాలతో[c] వచ్చాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వీరికి” లేదా “వీరికి వ్యతిరేకంగా.” గ్రీకులోని దత్తివిభక్తి వీరు ప్రవచనాన్ని విన్నవారిని, దాని విషయాన్ని, లేదా దానికి గురైనవారిని సూచించవచ్చు; సందర్భంలో వీరు భక్తిహీనులైన చొరబాటుదారులు.
    reason: lexical_alternative
  - marker: b
    text: ఈ మాటలు 1 హనోకు 1:9ను ప్రతిధ్వనింపజేస్తున్నాయి.
    reason: cross_reference
  - marker: c
    text: లేదా, “తన పవిత్రులైన పదివేల సమూహాలతో” లేదా “తన పవిత్రులైన అసంఖ్యాకులతో.” గ్రీకులోని పదం పదివేలు లేదా విస్తారమైన అసంఖ్యాక సమూహాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προεφήτευσεν
  choice: ప్రవచిస్తూ ... అన్నాడు
  rationale: προφητεύω సూచించే ప్రవచన వాక్కును నిలుపుతూ, λέγωνతో కలిపి సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంగా అందించబడింది.
- source_word: δὲ καὶ
  choice: కూడా
  rationale: δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని సందర్భంలో సహజంగా ఉంచి, καί యొక్క అదనపు సాక్ష్య భావాన్ని ‘కూడా’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: τούτοις
  choice: వీరి గురించి
  rationale: దత్తివిభక్తి ఇక్కడ ప్రవచనం ఎవరిని ఉద్దేశించి లేదా ఎవరి విషయంగా ఉందో సూచించవచ్చు. సందర్భానుసారం ముందుగా చెప్పబడిన భక్తిహీన చొరబాటుదారుల విషయాన్ని సూచిస్తుంది; అయితే ‘వీరికి’ లేదా ‘వీరికి వ్యతిరేకంగా’ అనే భావాలూ వ్యాకరణపరంగా సాధ్యమే.
- source_word: ἕβδομος ἀπὸ Ἀδὰμ
  choice: ఆదాము నుండి ఏడవ తరంవాడైన
  rationale: వంశక్రమ సూచనను తెలుగులో స్పష్టంగా తెలియజేస్తూ, ఆదామును లెక్కలో మొదటివాడిగా తీసుకుంటే హనోకు ఏడవవాడనే భావాన్ని అందిస్తుంది.
- source_word: Ἑνὼχ
  choice: హనోకు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: ప్రవచనంలోని గంభీరమైన దృష్టి ఆకర్షణను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἦλθεν
  choice: వచ్చాడు
  rationale: గ్రీకు ఆరిస్టు భూతకాల రూపాన్ని అలాగే ప్రతిబింబిస్తుంది. ఇది ప్రవచనాత్మక భూతకాలమై ఉండవచ్చనే అర్థాన్ని అనువాదంలో భవిష్యత్తుగా మార్చి నిర్ణయించలేదు.
- source_word: κύριος
  choice: ప్రభువు
  rationale: κύριοςకు సాధారణమైన తెలుగు సమానార్థకం; ఇది దేవుణ్ణి సూచిస్తుందా, ప్రభువైన యేసును సూచిస్తుందా అనేది వాక్యంలో ప్రత్యేకంగా నిర్ణయించదు.
- source_word: ἐν ἁγίαις μυριάσιν αὐτοῦ
  choice: తన పవిత్రులైన అసంఖ్యాక సమూహాలతో
  rationale: ἐνను సహచర్యార్థకంగా ‘తో’ అని అందించింది. μυριάσιν యొక్క విస్తారమైన, లెక్కకు అందని సమూహ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, మూలంలో లేని ‘దూతలు’ అనే గుర్తింపును చేర్చలేదు.
theological_decisions:
- issue: ‘ప్రభువు’ ఎవరు?
  choice: ‘ప్రభువు’ అని మాత్రమే అనువదించడం
  alternative: హనోకు గ్రంథ సందర్భంలో దేవుడు; లేదా యూదా వినియోగంలో యేసుకు అన్వయించబడిన బిరుదు
  rationale: గ్రీకు పాఠంలో κύριος అని మాత్రమే ఉంది. అందువల్ల దాని సూచిత వ్యక్తిని అనువాదంలో అదనంగా నిర్ణయించకుండా మూలపాఠంలోని ధార్మిక ఉద్వేగాన్ని నిలిపింది.
- issue: 1 హనోకు గ్రంథంతో సంబంధం
  choice: ప్రధాన పాఠంలో హనోకు పలికిన ప్రవచనంగా అందించడం
  alternative: 1 హనోకు 1:9 నుండి ప్రత్యక్ష ఉల్లేఖనమని ప్రధాన పాఠంలో పేర్కొనడం; లేదా హనోకు పేరుతో వచ్చిన సంప్రదాయ వాక్యంగా వివరించడం
  rationale: యూదా దీనిని హనోకు ప్రవచనంగా పరిచయం చేస్తున్నాడు. దాని గ్రంథస్థాయి గురించి వాక్యం చేయని ప్రకటనను అనువాదం చేర్చదు; సాహిత్య సంబంధాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- issue: ἦλθεν కాలభావం
  choice: భూతకాలంగా ‘వచ్చాడు’
  alternative: ప్రవచనాత్మక భూతకాలాన్ని వివరిస్తూ ‘వస్తాడు’ అని భావానువాదం చేయడం
  rationale: గ్రీకు రూపం భూతకాలంలో ఉంది. నెరవేరడం నిశ్చయమనే ప్రవచనాత్మక ప్రయోగం కావచ్చు గాని, అనువాదం దానిని నేరుగా భవిష్యత్తుగా మార్చకుండా అసలు రూపంలోని ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ప్రవచన శైలిని, సాధారణ పాఠకులకు స్పష్టంగా ఉండే వాక్యనిర్మాణంతో సమతుల్యం చేసింది. ‘హనోకు’, ‘ఆదాము’, ‘ప్రభువు’ వంటి స్థిరపడిన బైబిలు రూపాలను వాడింది. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠంలో ఉంది.
