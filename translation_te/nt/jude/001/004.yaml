id: JUD.1.4
reference: Jude 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παρεισέδυσαν γάρ τινες ἄνθρωποι, οἱ πάλαι προγεγραμμένοι εἰς τοῦτο τὸ κρίμα, ἀσεβεῖς, τὴν τοῦ θεοῦ ἡμῶν χάριτα μετατιθέντες εἰς ἀσέλγειαν καὶ τὸν μόνον ⸀δεσπότην καὶ κύριον ἡμῶν Ἰησοῦν Χριστὸν ἀρνούμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/004.yaml
  text: For certain men have slipped in unnoticed[a], who long ago were designated for this judgment, ungodly men who turn the grace of our God into sensuality and deny our only Master and Lord[d][c][b], Jesus the Messiah.
translation:
  language: te
  text: ఎందుకంటే కొందరు మనుషులు ఎవరికీ తెలియకుండా చొరబడ్డారు[a]. వీరి గురించి ఈ తీర్పుకు సంబంధించి చాలాకాలం క్రితమే వ్రాయబడింది[b]. భక్తిహీనులైన వీరు మన దేవుని కృపను విచ్చలవిడితనానికి[c] మళ్లిస్తూ, మన ఏకైక యజమాని మరియు ప్రభువు అయిన యేసు మెస్సీయను నిరాకరిస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘రహస్యంగా, ఎవరికీ తెలియకుండా చొరబడ్డారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఈ తీర్పుకోసం చాలాకాలం క్రితమే సూచించబడ్డారు’ లేదా ‘ఈ తీర్పుకోసం ముందుగానే నిర్దేశించబడ్డారు.’
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘సిగ్గులేని స్వేచ్ఛాచారానికి’ లేదా ‘లైంగిక దుర్నీతికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισέδυσαν
  choice: ఎవరికీ తెలియకుండా చొరబడ్డారు
  rationale: రహస్యంగా లోనికి ప్రవేశించి కలిసిపోయిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάλαι προγεγραμμένοι
  choice: చాలాకాలం క్రితమే రాయబడింది
  rationale: προγράφω పదంలోని ‘ముందుగా రాయడం/గురించి రాయడం’ అనే మూల భావాన్ని నిలుపుతూ, వ్యక్తిగత ముందస్తు నియామకాన్ని అనవసరంగా నిర్ధారించదు.
- source_word: κρίμα
  choice: తీర్పు
  rationale: న్యాయనిర్ణయం లేదా దాని ఫలితమైన శిక్షార్హత అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ἀσεβεῖς
  choice: భక్తిహీనులు
  rationale: దేవునిపట్ల భయభక్తులు లేని స్వభావాన్ని గౌరవప్రదమైన, సుపరిచితమైన తెలుగులో తెలియజేస్తుంది.
- source_word: χάριτα
  choice: కృప
  rationale: దేవుని అనుగ్రహాన్ని సూచించే స్థిరమైన, సందర్భోచితమైన వేదాంత పదం.
- source_word: μετατιθέντες εἰς ἀσέλγειαν
  choice: విచ్చలవిడితనానికి మళ్లిస్తూ
  rationale: దేవుని కృపను సిగ్గులేని స్వేచ్ఛాచారానికి వక్రీకరించే భావాన్ని తెలియజేస్తుంది; పదాన్ని కేవలం లైంగిక అర్థానికే పరిమితం చేయదు.
- source_word: τὸν μόνον δεσπότην καὶ κύριον
  choice: మన ఏకైక యజమానిని, ప్రభువైన
  rationale: δεσπότης, κύριος అనే రెండు అధికార బిరుదులనూ ప్రతిబింబిస్తూ, తెలుగులో యేసునే రెండింటి సూచ్యంగా సహజంగా చదివే నిర్మాణాన్ని ఇస్తుంది.
- source_word: Ἰησοῦν Χριστόν
  choice: యేసు మెస్సీయ
  rationale: Χριστόςను కేవలం పేరులో భాగంగా కాక ‘మెస్సీయ’ అనే బిరుదుగా వ్యక్తం చేస్తుంది.
- source_word: ἀρνούμενοι
  choice: నిరాకరిస్తున్నారు
  rationale: విశ్వాసంలోను ప్రవర్తనలోను అధికారాన్ని ఒప్పుకోకపోవడం లేదా తృణీకరించడం అనే భావాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: προγεγραμμένοι εἰς τοῦτο τὸ κρίμα భావం
  choice: ఈ తీర్పుకు గురవుతారని చాలాకాలం క్రితమే రాయబడింది
  alternative: ఈ తీర్పుకోసం ముందుగానే నియమించబడ్డారు
  rationale: గ్రీకు పదబంధం ముందుగా రాయబడటం, ముందుగా సూచించబడటం లేదా నిర్దేశించబడటం అనే భావాలకు వీలు ఇస్తుంది. ప్రధాన పాఠం వ్యక్తిగత ముందస్తు నిర్ణయం అనే బలమైన సిద్ధాంతార్థాన్ని విధించకుండా ‘రాయబడింది’ అనే మూల భావాన్ని ఉంచుతుంది.
- issue: ‘ఏకైక యజమాని మరియు ప్రభువు’ అనే బిరుదుల సూచ్యం
  choice: రెండు బిరుదులూ యేసు మెస్సీయను సూచిస్తాయి
  alternative: ‘యజమాని’ దేవుని తండ్రిని, ‘ప్రభువు’ యేసును విడివిడిగా సూచిస్తాయి
  rationale: గ్రీకు వాక్యనిర్మాణంలో రెండు బిరుదుల తరువాత ఒకే వ్యక్తి పేరు రావడం వల్ల రెండూ యేసుకే చెందినవిగా చదవడం అత్యంత సహజం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా చిన్న వాక్యాలుగా విభజించబడింది. గంభీరతను నిలుపుతూ ‘భక్తిహీనులు’, ‘కృప’, ‘తీర్పు’, ‘ప్రభువు’ వంటి సుపరిచిత బైబిలు పదజాలం వాడబడింది. ప్రధాన పాఠంలోని [a], [b], [c] గుర్తులు ప్రతి పాదటిప్పణితో సరిపోతాయి.
