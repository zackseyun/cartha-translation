  to: ఎందుకంటే కొందరు మనుషులు ఎవరికీ తెలియకుండా చొరబడ్డారు[a]. వీరి గురించి ఈ తీర్పుకు సంబంధించి చాలాకాలం క్రితమే వ్రాయబడింది[b]. భక్తిహీనులైన వీరు మన దేవుని కృపను విచ్చలవిడితనానికి[c] మళ్లిస్తూ, మన ఏకైక యజమాని మరియు ప్రభువు అయిన యేసు మెస్సీయను నిరాకరిస్తున్నారు.
  rationale: సవరణలు అర్థాన్ని మార్చవు. ‘వీరి గురించి ... వ్రాయబడింది’ అనేది προγεγραμμένοι యొక్క పూర్వ-లిఖిత/పూర్వ-సూచన భావాన్ని స్పష్టపరుస్తూ, అది వ్యక్తిగత పూర్వనిర్ణయమా లేక పూర్వపు లేఖన హెచ్చరికా అనే వివాదాస్పద అంశాన్ని పరిష్కరించదు. ‘యజమాని మరియు ప్రభువు అయిన’ అనే నిర్మాణం రెండు గ్రీకు బిరుదులనూ యేసు మెస్సీయతో స్పష్టంగా కలుపుతుంది. అన్ని పాదటిప్పణి గుర్తులు తమ పాదటిప్పణులతో సరిపోతాయి.
