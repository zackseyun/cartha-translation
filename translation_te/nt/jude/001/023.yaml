id: JUD.1.23
reference: Jude 1:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὓς δὲ σῴζετε ἐκ πυρὸς ἁρπάζοντες, οὓς δὲ ἐλεᾶτε ἐν φόβῳ⸃, μισοῦντες καὶ τὸν ἀπὸ τῆς σαρκὸς ἐσπιλωμένον χιτῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/023.yaml
  text: save others by snatching them out of the fire[a]; and have mercy on others with fear[d][c][b], hating even the tunic stained by the flesh.
translation:
  language: te
  text: మరికొందరిని అగ్నిలోనుండి లాక్కొని రక్షించండి[a]; శరీరం చేత మలినమైన లోపలి అంగీని సైతం అసహ్యించుకుంటూ, మరికొందరిపై భయంతో కరుణ చూపండి[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరికొందరిని అగ్నిలోనుండి లాక్కొని కాపాడండి.” ఇక్కడి అగ్ని రాబోయే తీర్పును లేదా తీవ్రమైన ఆత్మీయ ప్రమాదాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “భయంతో” అంటే దేవునిపట్ల భయభక్తితో అని గానీ, తాము కూడా కలుషితం కాకుండా జాగ్రత్తపడుతూ అని గానీ అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “పాప స్వభావం వల్ల మలినమైన వస్త్రాన్ని.” గ్రీకులో “శరీరం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: σῴζετε
  choice: రక్షించండి
  rationale: ఆజ్ఞారూప భావాన్ని నిలుపుతూ, ఆత్మీయ రక్షణ మరియు తక్షణ ప్రమాదం నుంచి కాపాడటం అనే రెండు ఛాయలనూ మోయగల సహజమైన తెలుగు పదం.
- source_word: ἐκ πυρὸς ἁρπάζοντες
  choice: అగ్నిలోనుంచి లాగివేసి
  rationale: ἁρπάζοντες‌లోని బలమైన, అత్యవసర చర్యను ‘లాగివేసి’ తెలియజేస్తుంది; కృదంతం రక్షించే విధానాన్ని వివరిస్తున్న సంబంధాన్ని నిలుపుతుంది.
- source_word: ἐλεᾶτε
  choice: కరుణ చూపండి
  rationale: ఆజ్ఞను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν φόβῳ
  choice: భయంతో
  rationale: దేవునిపట్ల భయభక్తి కావచ్చు లేదా తామూ కలుషితం కాకుండా జాగ్రత్తపడే భయం కావచ్చు; ఏ అర్థాన్నీ ప్రధాన పాఠ్యంలో ఖరారు చేయదు.
- source_word: μισοῦντες
  choice: అసహ్యించుకోండి
  rationale: నైతిక కలుషితాన్ని తీవ్రంగా తిరస్కరించాలనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; వ్యక్తులపై కరుణ చూపడం, కలుషితాన్ని ద్వేషించడం మధ్య ఉన్న ఉద్రిక్తతను నిలుపుతుంది.
- source_word: χιτῶνα
  choice: లోపలి అంగీ
  rationale: χιτών సాధారణంగా శరీరానికి దగ్గరగా ధరించే లోపలి వస్త్రాన్ని సూచిస్తుంది; ‘లోపలి అంగీ’ ఆ ప్రత్యేకతను సాధారణ పాఠకునికి అర్థమయ్యేలా తెలియజేస్తుంది.
- source_word: ἐσπιλωμένον
  choice: మలినమైన
  rationale: వస్త్రంపై మరకపడిన దృశ్యాన్ని, దానితో కూడిన నైతిక అపవిత్రత భావాన్ని రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: σάρξ
  choice: శరీరం
  rationale: గ్రీకు పదంలోని దేహసంబంధ రూపకాన్ని నిలుపుతూ, ‘పాప స్వభావం’ అని వ్యాఖ్యానాత్మకంగా ఖరారు చేయకుండా ఉంటుంది.
theological_decisions:
- issue: ‘అగ్ని’ దేనిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘అగ్ని’ అనే రూపకాన్ని వివరణ లేకుండా నిలుపడం.
  alternative: రాబోయే తీర్పు లేదా తీవ్రమైన ప్రస్తుత ఆత్మీయ ప్రమాదం.
  rationale: గ్రీకు పాఠ్యం అగ్ని యొక్క నిర్దిష్ట సూచనను ప్రకటించదు; అందువల్ల తీర్పు మరియు ఆత్మీయ ప్రమాదం అనే సాధ్యార్థాలను తెరిచి ఉంచడం సముచితం.
- issue: ‘శరీరం వల్ల మలినమైన’ అనే మాటలో σάρξ అర్థం
  choice: ‘శరీరం’ అని అనువదించడం.
  alternative: ‘పాప స్వభావం’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం.
  rationale: సందర్భం నైతిక కలుషితాన్ని సూచించినప్పటికీ, ‘శరీరం’ మూలంలోని రూపకాన్ని మరియు దాని ఉద్దేశపూర్వక ఉద్రిక్తతను కాపాడుతుంది.
- issue: కరుణతోపాటు భయం మరియు అసహ్యం
  choice: వ్యక్తులపై కరుణ చూపుతూనే కలుషితాన్ని అసహ్యించుకోవాలనే రెండు ఆదేశాలనూ స్పష్టంగా నిలుపడం.
  alternative: ‘భయం’ను కేవలం జాగ్రత్తగా లేదా ‘అసహ్యం’ను స్వల్పమైన దూరంగా మాత్రమే మృదుపరచడం.
  rationale: పాఠ్యం కరుణను నైతిక అప్రమత్తతతో కలిపి ఉంచుతుంది; ఒకదానిని మరొకదానితో తగ్గించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకునికి స్పష్టమైన ఆజ్ఞారూప శైలి. ‘లోపలి అంగీ’ ప్రాచీన వస్త్ర సూచనను అర్థమయ్యేలా చేస్తుంది. వాక్యంలోని అత్యవసరత, కరుణ, భయం, నైతిక అసహ్యం మధ్య ఉన్న సమతుల్యతను నిలుపుకుంది.
