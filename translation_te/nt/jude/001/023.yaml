revisions:
- from: మరికొందరిని అగ్నిలోనుంచి లాగివేసి రక్షించండి[a]; మరికొందరిపై భయంతో కరుణ చూపండి[b]. శరీరం వల్ల మలినమైన లోపలి అంగీని సైతం అసహ్యించుకోండి[c].
  to: మరికొందరిని అగ్నిలోనుండి లాక్కొని రక్షించండి[a]; శరీరం చేత మలినమైన లోపలి అంగీని సైతం అసహ్యించుకుంటూ, మరికొందరిపై భయంతో కరుణ చూపండి[b][c].
