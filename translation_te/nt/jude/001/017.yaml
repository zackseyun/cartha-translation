id: JUD.1.17
reference: Jude 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ, ἀγαπητοί, μνήσθητε τῶν ῥημάτων τῶν προειρημένων ὑπὸ τῶν ἀποστόλων τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/017.yaml
  text: But you[a], beloved, remember the words spoken beforehand by the apostles of our Lord Jesus the Messiah.
translation:
  language: te
  text: అయితే మీరు, ప్రియులారా, మన ప్రభువైన యేసు మెస్సీయ యొక్క అపొస్తలులు ముందుగా చెప్పిన మాటలను గుర్తుంచుకోండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “యేసు క్రీస్తు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δέ
  choice: అయితే
  rationale: δέ లోని వ్యతిరేక భావాన్ని సహజమైన తెలుగులో చూపుతుంది; సంబోధనతో కలిసి Ὑμεῖς యొక్క ఉద్ఘాటన సందర్భం ద్వారా స్పష్టమవుతుంది.
- source_word: ἀγαπητοί
  choice: ప్రియులారా
  rationale: ఆప్యాయమైన బహువచన సంబోధనను గౌరవప్రదంగా, సహజంగా అందిస్తుంది.
- source_word: μνήσθητε
  choice: జ్ఞాపకం చేసుకోండి
  rationale: ముందుగా అందుకున్న బోధను గుర్తుకు తెచ్చుకోవాలనే ఆజ్ఞార్థక భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τῶν ῥημάτων
  choice: మాటలను
  rationale: ఇక్కడ పలికిన వాక్కులు లేదా ప్రకటనలను సూచించే ῥήματα కు సూటిగా సరిపోతుంది.
- source_word: τῶν προειρημένων
  choice: ఇంతకుముందే చెప్పిన
  rationale: προλέγω యొక్క కాలపూర్వక భావాన్ని నిలుపుతుంది; తప్పనిసరిగా ప్రవచనార్థాన్ని మోపదు.
- source_word: ὑπὸ τῶν ἀποστόλων
  choice: అపొస్తలులు
  rationale: తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన పదం; కర్తరివాచ్య తెలుగు నిర్మాణంలో గ్రీకు కర్తను సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τοῦ κυρίου ἡμῶν
  choice: మన ప్రభువైన
  rationale: సంబంధార్థాన్ని సహజమైన తెలుగు విశేషణ నిర్మాణంలో చూపుతూ κύριος ను ‘ప్రభువు’గా నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: యేసును మెస్సీయగా గుర్తించే బిరుదార్థాన్ని స్పష్టంగా ఉంచుతుంది; ‘యేసు క్రీస్తు’ అనే సంప్రదాయ రూపాన్ని పాదటిప్పణిలో ఇస్తుంది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ లో Χριστοῦ ను ఎలా అనువదించాలి
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: Χριστός యొక్క ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదార్థాన్ని అనువాదంలో ప్రత్యక్షంగా చూపుతుంది; పేరులా స్థిరపడిన సంప్రదాయ రూపాన్ని ప్రత్యామ్నాయంగా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా సంబోధనను ఉపయోగించాం. గ్రీకు నిష్క్రియ నిర్మాణాన్ని యథాతథంగా అనుసరించకుండా, తెలుగులో సహజమైన కర్తరివాచ్య క్రమాన్ని ఎంచుకున్నాం. ప్రధాన వాక్యంలో ఉన్న [a] గుర్తు పాదటిప్పణికి సరిపోతుంది.
