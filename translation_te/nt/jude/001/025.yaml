id: JUD.1.25
reference: Jude 1:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀μόνῳ θεῷ σωτῆρι ἡμῶν ⸂διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν⸃ ⸀δόξα μεγαλωσύνη κράτος καὶ ἐξουσία ⸂πρὸ παντὸς τοῦ αἰῶνος⸃ καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/025.yaml
  text: to the only God our Savior[a], through Jesus the Messiah our Lord, be glory, majesty, dominion, and authority, before all time and now and forever[b]. Amen.
translation:
  language: te
  text: మన ఏకైక రక్షకుడైన దేవునికి, మన ప్రభువైన యేసు మెస్సీయ ద్వారా, మహిమ, మహాత్మ్యం, ఆధిపత్యం, అధికారం సమస్త కాలానికి ముందే, ఇప్పుడూ, యుగయుగాలకూ కలుగుగాక.[a] ఆమేన్.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా: “ప్రతి యుగానికి ముందు, ఇప్పుడూ, సమస్త యుగాల వరకూ.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνῳ θεῷ σωτῆρι ἡμῶν
  choice: మన ఏకైక రక్షకుడైన దేవునికి
  rationale: దత్తి విభక్తిలోని పదబంధాన్ని తెలుగు స్తోత్రవాక్య నిర్మాణానికి సహజంగా మార్చి, μόνος సూచించే దేవుని ఏకైకత్వాన్ని ‘ఏకైక’తోను σωτήρ ను సాధారణ ధార్మిక పదమైన ‘రక్షకుడు’తోను నిలిపాం.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: మన ప్రభువైన యేసు మెస్సీయ ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సూచించే మాధ్యమాన్ని ‘ద్వారా’ స్పష్టంగా నిలుపుతుంది. Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించాం; κύριος ను ‘ప్రభువు’గా ఇచ్చాం.
- source_word: δόξα μεγαλωσύνη κράτος καὶ ἐξουσία
  choice: మహిమ, మహాత్మ్యం, ఆధిపత్యం, అధికారం
  rationale: 'నాలుగు వేర్వేరు స్తుతి పదాల వరుసను సాధ్యమైనంత భేదంతో నిలిపాం: δόξα—మహిమ; μεγαλωσύνη—మహాత్మ్యం; κράτος—ప్రభావవంతమైన పాలనాబలం/ఆధిపత్యం; ἐξουσία—హక్కుగల అధికారం.'
- source_word: πρὸ παντὸς τοῦ αἰῶνος
  choice: సమస్త కాలానికి ముందునుండీ
  rationale: అక్షరార్థంలోని ‘ప్రతి యుగానికి ముందు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో కాలారంభానికి పూర్వమైన వ్యాప్తిగా వ్యక్తపరుస్తుంది.
- source_word: καὶ νῦν καὶ εἰς πάντας τοὺς αἰῶνας
  choice: ఇప్పుడూ, యుగయుగాలకూ
  rationale: νῦν యొక్క వర్తమాన సూచనను, πάντας τοὺς αἰῶνας యొక్క అంతులేని యుగవ్యాప్తిని తెలుగు స్తోత్రభాషలో సహజంగా నిలిపాం.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: సభా మరియు బైబిలు వాడుకలో స్థిరపడిన ధ్వన్యనువాదం.
theological_decisions:
- issue: స్తుతి ఎవరికి అర్పించబడుతోంది, యేసు పాత్ర ఏమిటి
  choice: స్తుతి మన ఏకైక రక్షకుడైన దేవునికి అర్పించబడుతుంది; అది మన ప్రభువైన యేసు మెస్సీయ ద్వారా అర్పించబడుతుంది.
  alternative: ‘యేసు మెస్సీయ ద్వారా’ అనే పదబంధాన్ని వాక్యంతో మరింత సడలుగా అనుసంధానించవచ్చు.
  rationale: గ్రీకు వాక్యనిర్మాణం διὰ పదబంధాన్ని దేవునికి ఆపాదించే స్తుతికి మాధ్యమంగా సహజంగా చూపుతుంది. ఈ రూపం దేవుని ఏకైకత్వాన్నీ యేసు మధ్యవర్తిత్వాన్నీ కలిపివేయకుండా నిలుపుతుంది.
- issue: Χριστός యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός బిరుదు భావాన్ని కలిగి ఉంది. ‘మెస్సీయ’ దాని అభిషిక్త రాజు అనే అర్థాన్ని పాఠకునికి మరింత స్పష్టంగా ఉంచుతుంది; ‘క్రీస్తు’ సంప్రదాయ ధ్వన్యనువాదం.
- issue: స్తుతిగుణాలు కాలమంతటా ఉన్నవా లేక కలుగాలని కోరుతున్నదా
  choice: ‘కలుగుగాక’ అనే తెలుగు స్తోత్రరూపంతో గ్రీకులో అంతర్లీనంగా ఉన్న దత్తి-ఆశీర్వచన భావాన్ని వ్యక్తపరచాం.
  alternative: ‘ఉన్నాయి’ లేదా ‘చెందుతాయి’ అని ప్రకటన రూపంలో ఇవ్వవచ్చు.
  rationale: గ్రీకులో స్పష్టమైన క్రియ లేకపోవడం వల్ల రూపకంగా కొంత విపులత ఉంది. తెలుగు వాక్యానికి క్రియ అవసరమైనందున సంప్రదాయ స్తోత్రార్థానికి అనుగుణంగా ‘కలుగుగాక’ ఎంచుకున్నాం; ఇది దేవునికి ఈ లక్షణాలు మొదటిసారి లభిస్తాయని సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన స్తోత్రశైలిని వాడాం. ‘మహాత్మ్యం—ఆధిపత్యం—అధికారం’ అనే వరుస గ్రీకు పదాల భావభేదాన్ని సాధ్యమైనంతగా కాపాడుతుంది. ప్రధాన పాఠంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
