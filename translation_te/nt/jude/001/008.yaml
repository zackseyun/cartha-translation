id: JUD.1.8
reference: Jude 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁμοίως μέντοι καὶ οὗτοι ἐνυπνιαζόμενοι σάρκα μὲν μιαίνουσιν, κυριότητα δὲ ἀθετοῦσιν, δόξας δὲ βλασφημοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/008.yaml
  text: Yet in the same way, these people also, relying on dreams, defile the flesh, reject authority, and slander glorious ones.
translation:
  language: te
  text: అయినా అదే విధంగా, వీరు కూడా కలలపై ఆధారపడుతూ[a] శరీరాన్ని అపవిత్రం చేస్తారు, అధికారాన్ని తిరస్కరిస్తారు, మహిమగలవారిని[b] దూషిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “కలలు కంటూ.” గ్రీకు కృదంతాన్ని ఇలా మరింత రూపసామ్యంగా అనువదించవచ్చు; అయితే తమ ప్రవర్తనకు కలలను ఆధారంగా చూపుతున్నారనే భావం ఇక్కడ ఉండవచ్చు.'
    reason: lexical_alternative
  - marker: b
    text: '“మహిమగలవారు” అనేది మహోన్నతమైన పరలోక జీవులను, బహుశా దేవదూతలను, సూచించవచ్చు. గ్రీకు పదశః: “మహిమలు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁμοίως μέντοι
  choice: అయినా అదే విధంగా
  rationale: ὁμοίως లోని ముందటి ఉదాహరణలతో పోలికను, μέντοι లోని స్వల్ప వ్యతిరేక భావాన్ని రెండింటినీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: οὗτοι
  choice: వీరు
  rationale: సందర్భంలో చొరబడిన వ్యక్తులను సూచించే నిర్దేశక సర్వనామం; గ్రీకులో లేని పురుషలింగ నిర్దిష్టతను చేర్చదు.
- source_word: ἐνυπνιαζόμενοι
  choice: కలలపై ఆధారపడుతూ
  rationale: వారి ప్రవర్తనకు కలలను ఆధారంగా చేసుకుంటున్నారనే సంభావ్య భావాన్ని తెలియజేస్తుంది; మరింత రూపసామ్యమైన అనువాదాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: σάρκα
  choice: శరీరాన్ని
  rationale: ఇక్కడ σάρξ శారీరక-నైతిక అపవిత్రతను సూచిస్తుంది. తెలుగులో ‘శరీరాన్ని’ సహజంగా ఉంటుంది; ‘పాప స్వభావం’ వంటి పౌలీయ సాంకేతిక భావాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: μιαίνουσιν
  choice: అపవిత్రం చేస్తారు
  rationale: నైతిక లేదా ఆచార సంబంధ అపవిత్రతను సూచించే బలమైన, గౌరవప్రదమైన పదబంధం.
- source_word: κυριότητα
  choice: అధికారాన్ని
  rationale: దైవ ప్రభుత్వమా, పరలోక అధికారమా, మరేదైనా అధికారమా అన్న సూచనను ఖరారు చేయకుండా κυριότης యొక్క విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: ἀθετοῦσιν
  choice: తిరస్కరిస్తారు
  rationale: గౌరవించవలసిన దానిని నిరాకరించడం లేదా తోసిపుచ్చడం అనే బలమైన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: δόξας
  choice: మహిమగలవారిని
  rationale: పదశః బహువచన ‘మహిమలు’ వెనుక ఉన్న మహోన్నత పరలోక వ్యక్తుల సంభావ్య సూచనను సహజ తెలుగులో తెలియజేస్తూ, వారిని నేరుగా దేవదూతలుగా నిర్ధారించదు.
- source_word: βλασφημοῦσιν
  choice: దూషిస్తారు
  rationale: దేవునికే పరిమితమైన ‘దైవదూషణ’ భావాన్ని బలవంతంగా రుద్దకుండా, అవమానకరంగా మాట్లాడే తీవ్రతను తెలియజేస్తుంది.
theological_decisions:
- issue: δόξας ఎవరిని సూచిస్తుంది
  choice: మహోన్నతమైన లేదా పరలోక సంబంధ వ్యక్తులను సూచించగల విస్తృత వ్యక్తీకరణ
  alternative: దేవదూతలు; పరలోక మహిమాన్వితులు; అమూర్తమైన ‘మహిమలు’
  rationale: తదుపరి వచనం దేవదూతల సందర్భాన్ని సూచించినా, ఈ నామవాచకం స్వయంగా అంత నిర్దిష్టం కాదు. ప్రధాన పాఠం గ్రీకు పదంలోని విస్తృతతను నిలుపుతుంది; పాదటిప్పణి సంభావ్య సూచనను వివరిస్తుంది.
- issue: ἐνυπνιαζόμενοι యొక్క భావబలం
  choice: వారు తమ కలలను ఆధారంగా చేసుకొని ప్రవర్తిస్తున్నారు
  alternative: కలలు కంటూ; కలలు కనేవారిగా
  rationale: కృదంతం వారి చర్యల పద్ధతి లేదా ఆధారాన్ని సూచించవచ్చు. ప్రధాన పాఠం ఈ సంభావ్య సంబంధాన్ని స్పష్టం చేస్తుంది; రూపసామ్యమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణి కాపాడుతుంది.
- issue: κυριότητα యొక్క నిర్దిష్ట సూచన
  choice: అధికారం అనే ఉద్దేశపూర్వకంగా విస్తృత పదం
  alternative: ప్రభుత్వం; ప్రభువు యొక్క అధికారం; దేవదూతల అధికారం
  rationale: మూలపదం సూచించే అధికారాన్ని సందర్భం పూర్తిగా నిర్దిష్టం చేయదు. అందువల్ల అనువాదం ఒకే సిద్ధాంతపరమైన గుర్తింపును నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఖండన స్వరం ఉపయోగించబడింది. వాక్యంలోని సమాంతర మూడు క్రియలను నిలుపుతూ, మూలంలోని అస్పష్టతలను పాదటిప్పణులతో సంరక్షించాం.
