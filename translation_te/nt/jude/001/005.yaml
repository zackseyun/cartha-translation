id: JUD.1.5
reference: Jude 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὑπομνῆσαι δὲ ὑμᾶς βούλομαι, εἰδότας ⸂ὑμᾶς ἅπαξ⸃ ⸀πάντα, ὅτι ⸀Ἰησοῦς λαὸν ἐκ γῆς Αἰγύπτου σώσας τὸ δεύτερον τοὺς μὴ πιστεύσαντας ἀπώλεσεν,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/005.yaml
  text: I want to remind you[a], though you know all things once for all, that Jesus, having saved a people out of the land of Egypt, afterward destroyed those who did not believe.
translation:
  language: te
  text: 'మీరు ఇవన్నీ ఒకసారి తెలుసుకున్నవారే అయినప్పటికీ, మీకు గుర్తుచేయాలని కోరుతున్నాను: యేసు[a] ఐగుప్తు దేశం నుండి ఒక ప్రజను రక్షించిన తరువాత, నమ్మని వారిని నాశనం చేశాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘యేసు’కు బదులుగా ‘ప్రభువు’ లేదా ‘దేవుడు’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπομνῆσαι ... βούλομαι
  choice: జ్ఞాపకం చేయాలని కోరుతున్నాను
  rationale: తెలిసిన విషయాన్ని తిరిగి గుర్తుచేయాలనే వక్త సంకల్పాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰδότας ὑμᾶς ἅπαξ πάντα
  choice: మీరు ఇవన్నీ ఒక్కసారిగా తెలుసుకున్నవారే అయినప్పటికీ
  rationale: సందర్భంలో participle‌కు ఉన్న concessive భావాన్ని ‘అయినప్పటికీ’తో చూపిస్తుంది; πάνταను సందర్భానుసారంగా ‘ఇవన్నీ’గా, ἅπαξను ‘ఒక్కసారిగా’గా ఉంచి దాని భావసంభావ్యతను అతిగా నిర్ధారించదు.
- source_word: Ἰησοῦς
  choice: యేసు
  rationale: అందించిన SBLGNT మూలపాఠంలో ఉన్న Ἰησοῦςను నేరుగా అనువదించి, నిర్గమ సంఘటనలో యేసు కర్తగా ఉన్న క్రీస్తుసంబంధమైన బలాన్ని నిలుపుతుంది.
- source_word: λαὸν
  choice: ఒక ప్రజను
  rationale: అనిర్దిష్ట రూపంలో ఉన్న సమూహవాచక భావాన్ని అతిగా ప్రత్యేకీకరించకుండా ప్రతిబింబిస్తుంది.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: ఐగుప్తు దేశం నుండి
  rationale: నిర్గమ కథనానికి సంబంధించిన బైబిలీయ ప్రతిధ్వనిని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: σώσας
  choice: రక్షించిన తరువాత
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యను తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὸ δεύτερον
  choice: తరువాత
  rationale: రక్షణ తరువాత సంభవించిన రెండవ చర్య అనే కాలక్రమ భావాన్ని అసహజమైన పదానువాదం లేకుండా అందిస్తుంది.
- source_word: τοὺς μὴ πιστεύσαντας
  choice: నమ్మని వారిని
  rationale: విశ్వసించని సమూహాన్ని సూటిగా, సాధారణ ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἀπώλεσεν
  choice: నాశనం చేశాడు
  rationale: దైవిక తీర్పు తీవ్రతను తగ్గించకుండా క్రియ యొక్క బలాన్ని నేరుగా తెలియజేస్తుంది.
theological_decisions:
- issue: నిర్గమ వాక్యంలో కర్త ఎవరు?
  choice: ప్రధాన పాఠంలో ‘యేసు’
  alternative: ‘ప్రభువు’ లేదా ‘దేవుడు’
  rationale: అందించిన గ్రీకు పాఠం Ἰησοῦς అని చదువుతుంది. అందువల్ల ప్రధాన పాఠం ‘యేసు’ అని అనువదిస్తుంది; ఇతర ముఖ్య ప్రతుల పాఠాంతరాలను పాదటిప్పణిలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలోని దీర్ఘ వాక్య నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం ద్విబిందువుతో క్రమబద్ధం చేశాం.
