  verdict: revise
  source_fidelity: The draft conveys the judicial force of ποιῆσαι κρίσιν and ἐλέγξαι, preserves the repeated ἀσεβ- word group, and correctly retains αὐτοῦ as a pronoun. However, it adds “ఆయన వచ్చాడు” (“he came”), which belongs to the preceding verse's framing clause and is not present in Jude 1:15 itself. It also repeats “వారిని దోషులుగా నిరూపించడానికి” for the second charge, although the Greek has one ἐλέγξαι governing both prepositional clauses.
  naturalness: The revised Telugu is formal but natural for a solemn judicial pronouncement. It maintains the source's extended infinitival construction without requiring an added finite verb.
  terminology: “తీర్పు అమలు చేయడానికి” suitably expresses judicial action; “దోషులుగా నిరూపించడానికి” fits the forensic sense of ἐλέγξαι; and “భక్తిహీన” consistently represents the emphatic ἀσεβ- repetition. “అతనికి వ్యతిరేకంగా” naturally renders κατ’ αὐτοῦ.
  issues:
  - severity: medium
    issue: The main text adds “ఆయన వచ్చాడు.”
    rationale: This finite clause is supplied from Jude 1:14 and is absent from the Greek text of v. 15. The verse should retain its dependent infinitival form, as does the source and English audit trail.
  - severity: low
    issue: The second occurrence of “వారిని దోషులుగా నిరూపించడానికి” unnecessarily repeats the governing infinitive.
    rationale: Greek uses a single ἐλέγξαι, followed by two coordinated περὶ clauses. Removing the second Telugu repetition more closely reflects the syntax and improves flow.
