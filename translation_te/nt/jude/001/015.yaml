id: JUD.1.15
reference: Jude 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ποιῆσαι κρίσιν κατὰ πάντων καὶ ἐλέγξαι ⸂πάντας τοὺς ἀσεβεῖς⸃ περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν καὶ περὶ πάντων τῶν σκληρῶν ὧν ἐλάλησαν κατ’ αὐτοῦ ἁμαρτωλοὶ ἀσεβεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/015.yaml
  text: to execute judgment against all and to convict all the ungodly concerning all their ungodly deeds that they committed in ungodliness[c][b][a], and concerning all the harsh things that ungodly sinners have spoken against him.
translation:
  language: te
  text: అందరిమీద తీర్పు అమలు చేయడానికి, భక్తిహీనులందరినీ వారు భక్తిహీనంగా చేసిన తమ భక్తిహీన కార్యాలన్నిటి విషయములోను, భక్తిహీన పాపులు అతనికి[c] వ్యతిరేకంగా పలికిన కఠినమైన మాటలన్నిటి[b] విషయములోను దోషులుగా నిరూపించడానికి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి తప్పును బయటపెట్టడానికి,’ ‘వారిని అపరాధులుగా నిర్ధారించడానికి.’ ఇక్కడి గ్రీకు క్రియ తప్పును వెలుగులోకి తేవడాన్ని సూచించగలదు; అయితే ఇది ‘తీర్పు అమలు చేయడం’తో పాటు న్యాయపరమైన సందర్భంలో ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కఠోరమైన మాటలన్నిటి,’ ‘ధిక్కారపూరితమైన మాటలన్నిటి.’ గ్రీకు పదానికి అక్షరార్థం ‘గట్టివైనవి’; ఇక్కడ అది అతనికి వ్యతిరేకంగా పలికిన కఠినమైన లేదా ధిక్కారపూరితమైన మాటలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘అతను’ అనే సర్వనామం సందర్భానుసారంగా ముందటి వచనంలో ప్రస్తావించిన ప్రభువును సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ποιῆσαι κρίσιν κατὰ πάντων
  choice: అందరిమీద తీర్పు అమలు చేయడానికి
  rationale: κρίσιν ποιεῖν అనే న్యాయపరమైన పదబంధం తీర్పును కేవలం ప్రకటించడం కాక దాన్ని అమలు చేయడాన్ని సూచిస్తుంది; κατάతో కూడిన భావాన్ని ‘అందరిమీద’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐλέγξαι
  choice: దోషులుగా నిరూపించడానికి
  rationale: తీర్పు సందర్భంలో ἐλέγχω తప్పును బయటపెట్టి అపరాధాన్ని స్థాపించడం అనే బలమైన న్యాయపరమైన భావాన్ని కలిగి ఉంది.
- source_word: πάντας τοὺς ἀσεβεῖς
  choice: భక్తిహీనులందరినీ
  rationale: నామవాచకంగా వాడిన బహువచన పదబంధాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తూ, ఈ వచనమంతటా పునరావృతమయ్యే ἀσεβ- పదకుటుంబ సంబంధాన్ని నిలుపుతుంది.
- source_word: περὶ πάντων τῶν ἔργων ἀσεβείας αὐτῶν ὧν ἠσέβησαν
  choice: తాము భక్తిహీనంగా చేసిన భక్తిహీన కార్యాలన్నిటి విషయంలో
  rationale: ἀσέβεια మరియు ἀσεβέω మధ్య ఉన్న ఉద్దేశపూర్వక పదపునరుక్తిని తెలుగులో ‘భక్తిహీనంగా’ మరియు ‘భక్తిహీన కార్యాలు’ ద్వారా సాధ్యమైనంతవరకు కాపాడుతుంది.
- source_word: πάντων τῶν σκληρῶν
  choice: కఠినమైన మాటలన్నిటి
  rationale: σκληρός యొక్క మూలభావం ‘కఠినమైనది’; మాటల సందర్భంలో ఇది కఠోరమైన, ధిక్కారపూరితమైన పలుకులను సూచిస్తుంది. తెలుగులో ‘మాటలు’ను స్పష్టంగా చేర్చడం భావాన్ని సహజంగా చేస్తుంది.
- source_word: ἐλάλησαν κατ’ αὐτοῦ
  choice: అతనికి విరోధంగా పలికిన
  rationale: κατά యొక్క ప్రతికూల దిశను ‘విరోధంగా’ తెలియజేస్తుంది; αὐτοῦను వ్యాఖ్యానాత్మకంగా విస్తరించకుండా సర్వనామంగానే ఉంచుతుంది.
- source_word: ἁμαρτωλοὶ ἀσεβεῖς
  choice: భక్తిహీనులైన పాపులు
  rationale: రెండు వర్ణనలనూ నిలుపుతూ, ἀσεβ- పదకుటుంబం మీదున్న వచనంలోని ప్రధాన ఉద్ఘాటనను సహజమైన తెలుగు క్రమంలో అందిస్తుంది.
theological_decisions:
- issue: ‘అతనికి విరోధంగా’ అనే పదబంధంలోని αὐτοῦ ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘అతనికి’ అనే సర్వనామాన్నే ఉంచడం
  alternative: ‘ప్రభువుకు విరోధంగా’ లేదా ‘దేవునికి విరోధంగా’ అని స్పష్టీకరించడం
  rationale: ముందటి వచనంలో ప్రస్తావించిన ప్రభువే సందర్భానుసారమైన సూచితుడు. అయినప్పటికీ గ్రీకు పాఠ్యం సర్వనామాన్ని వాడుతుంది కాబట్టి, దాన్ని అలాగే ఉంచడం అనవసరమైన వ్యాఖ్యాన విస్తరణను నివారించి మూలంలోని రూపాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన న్యాయపరమైన శైలిని పాటించాం. మూలంలోని ἀσεβ- పదకుటుంబ పునరుక్తిని ‘భక్తిహీన’ రూపాలతో ఉద్దేశపూర్వకంగా నిలిపాం. ఈ వాక్యం 14వ వచనంలో మొదలైన ప్రవచనానికి కొనసాగింపు కాబట్టి, తెలుగులో వాక్యాన్ని సంపూర్ణంగా చేయడానికి చివర ‘ఆయన వచ్చాడు’ను సందర్భం నుంచి పునరుద్ధరించాం.
