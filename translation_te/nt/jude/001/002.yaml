id: JUD.1.2
reference: Jude 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔλεος ὑμῖν καὶ εἰρήνη καὶ ἀγάπη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/002.yaml
  text: May mercy and peace and love be multiplied to you[a].
translation:
  language: te
  text: కనికరం, శాంతి, ప్రేమ మీకు విస్తారంగా కలుగుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అధికమగుగాక,” “సమృద్ధిగా కలుగుగాక.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: కనికరం
  rationale: ఆశీర్వాద వాక్య సందర్భంలో దేవుని దయతో కూడిన కరుణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: ఆశీర్వాదం ఎవరికి ఉద్దేశించబడిందో తెలిపే దత్తివ విభక్తిని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: εἰρήνη
  choice: శాంతి
  rationale: వ్యక్తిగత ప్రశాంతతతో పాటు సంబంధపూర్వకమైన, దేవునితో సంబంధించిన సమాధాన స్థితిని కూడా సూచించగల స్థిరమైన తెలుగు పదం.
- source_word: ἀγάπη
  choice: ప్రేమ
  rationale: మూలపదానికి సహజమైన, విస్తృతంగా అర్థమయ్యే ఆధునిక తెలుగు సమానార్థకం.
- source_word: πληθυνθείη
  choice: విస్తారంగా కలుగుగాక
  rationale: ఆశీర్వాదరూపమైన optative భావాన్ని ‘కలుగుగాక’ తెలియజేస్తుంది; ‘విస్తారంగా’ మూలంలోని అధికమవడం లేదా విస్తరించడం అనే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: καὶ ... καὶ ... καὶ
  choice: కనికరం, శాంతి, ప్రేమ
  rationale: తెలుగులో జాబితాను సహజంగా చదివేందుకు విరామచిహ్నాలతో ఇచ్చాం; మూడు వరాల సమాన ప్రాధాన్యాన్ని క్రమం ద్వారా నిలిపాం.
theological_decisions:
- issue: ఆశీర్వాద వాక్యంలోని optative క్రియారూపం
  choice: మీకు విస్తారంగా కలుగుగాక
  alternative: మీకు అధికమగుగాక
  rationale: ‘కలుగుగాక’ ఇది ఒక ఆశీర్వాదపూర్వక ఆకాంక్ష అని స్పష్టంగా తెలియజేస్తుంది. ‘విస్తారంగా’ మూలంలోని πληθύνω భావాన్ని కాపాడుతూ ఆధునిక పాఠకులకు సహజంగా ఉంటుంది; అది ఎలా లేదా ఎవరి ద్వారా జరుగుతుందో అనవసరంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన ఆశీర్వాద శైలిని ఉపయోగించాం. ‘కలుగుగాక’ అనే రూపం సాధారణ సంభాషణకన్నా కొద్దిగా ఉన్నతమైనదైనా, పత్రికా ఆశీర్వాదానికి సహజంగా సరిపోతుంది.
