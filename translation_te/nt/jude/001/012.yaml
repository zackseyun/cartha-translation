  source_fidelity: The draft accurately retains Jude’s series of metaphors, including the deliberately stark ‘twice dead’ and the intensified image of being uprooted. However, ‘మీతో కలిసి’ adds an explicit ‘with you’ that is not present in the Greek participle; the communal setting is already supplied by ‘your love feasts.’
