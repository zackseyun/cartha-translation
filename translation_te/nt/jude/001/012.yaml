id: JUD.1.12
reference: Jude 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν ⸀οἱ ἐν ταῖς ἀγάπαις ὑμῶν σπιλάδες συνευωχούμενοι, ἀφόβως ἑαυτοὺς ποιμαίνοντες, νεφέλαι ἄνυδροι ὑπὸ ἀνέμων παραφερόμεναι, δένδρα φθινοπωρινὰ ἄκαρπα δὶς ἀποθανόντα ἐκριζωθέντα,
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/012.yaml
  text: These are hidden reefs at your love feasts[a], feasting together without fear, shepherding themselves; waterless clouds carried along by winds; autumn trees without fruit, twice dead[c][b], uprooted.
translation:
  language: te
  text: వీరు మీ ప్రేమ విందుల్లో[a] దాగి ఉన్న బండరాళ్లు; ఏ భయమూ లేకుండా కలిసి విందు చేస్తూ, తమనే తాము మేపుకొంటూ ఉన్నారు[b][c]; గాలులచే కొట్టుకుపోతున్న నీరు లేని మేఘాలు; ఫలాలు లేని శరత్కాలపు చెట్లు—రెండుసార్లు చనిపోయినవి, వేళ్లతో సహా పెకలించబడినవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ ప్రేమ విందుల్లోని మచ్చలు” లేక “కళంకాలు.” గ్రీకు పదం నైతిక కళంకాన్ని సూచించవచ్చు; అయితే నీటిలో దాగి ఉండే ప్రమాదకరమైన బండరాళ్లను కూడా సూచించగలదు.
    reason: alternative_reading
  - marker: b
    text: “తమనే తాము మేపుకొంటూ” అనే మాటను “తమను తాము పోషించుకుంటూ” అని కూడా అనువదించవచ్చు. ఇది వారి స్వప్రయోజనపరమైన ప్రవర్తనను ఎత్తిచూపుతుంది.
    reason: lexical_alternative
  - marker: c
    text: తమను తాము పోషించుకునే కాపరుల చిత్రానికి యెహెజ్కేలు 34తో పోల్చండి.
    reason: cross_reference
lexical_decisions:
- source_word: σπιλάδες
  choice: దాగి ఉన్న బండరాళ్లు
  rationale: ఈ పదానికి ‘మచ్చలు’ అనే భావం సాధ్యమైనా, నీటిలో దాగి ఉండి ప్రమాదం కలిగించే బండరాళ్లు అనే రూపకం యూదా వాడిన వరుస ప్రకృతి రూపకాలలో చక్కగా సరిపోతుంది.
- source_word: ἀγάπαις
  choice: ప్రేమ విందులు
  rationale: బహువచన రూపం ఇక్కడ క్రైస్తవుల సహవాస భోజనాలను సూచిస్తుంది; ‘ప్రేమ విందులు’ ప్రేమతో ఉన్న పదసంబంధాన్ని, ప్రత్యేక సందర్భాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: συνευωχούμενοι
  choice: మీతో కలిసి విందు చేస్తూ
  rationale: కలిసి విందులో పాలుపంచుకోవడం అనే క్రియార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; సందర్భంలోని ‘మీ’ అనే సమూహసంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: ἀφόβως
  choice: ఏ భయమూ లేకుండా
  rationale: నిర్భయత, సిగ్గులేని నిర్లక్ష్యం, భక్తిభయం లేకపోవడం వంటి సాధ్యమైన భావాలను అతిగా నిర్ణయించకుండా ఉంచుతుంది.
- source_word: ἑαυτοὺς ποιμαίνοντες
  choice: తమనే తాము మేపుకొంటున్నారు
  rationale: ποιμαίνω లోని కాపరి/మేపుట రూపకాన్ని నిలుపుతూ, తమ స్వప్రయోజనానికే చూసుకునే ధోరణిని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: νεφέλαι ἄνυδροι
  choice: నీరు లేని మేఘాలు
  rationale: వాగ్దానం ఉన్నట్లు కనిపించినా ప్రయోజనం ఇవ్వని దృశ్యరూపకాన్ని నేరుగా, స్పష్టంగా నిలుపుతుంది.
- source_word: παραφερόμεναι
  choice: గాలులకు కొట్టుకుపోయే
  rationale: బాహ్యశక్తులచేత అటూ ఇటూ మోయబడుతున్న నిష్క్రియ భావాన్ని సజీవమైన తెలుగులో తెలియజేస్తుంది.
- source_word: δένδρα φθινοπωρινὰ ἄκαρπα
  choice: ఫలాలు లేని శరత్కాలపు చెట్లు
  rationale: ఫలాలు ఆశించదగిన కాలంలోనూ ఫలించని చెట్ల స్పష్టమైన రూపకాన్ని కాపాడుతుంది.
- source_word: δὶς ἀποθανόντα
  choice: రెండుసార్లు చనిపోయి
  rationale: వాక్యంలోని ఉద్దేశపూర్వకమైన, ఆశ్చర్యకరమైన పదబంధాన్ని వివరణతో సడలించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: ἐκριζωθέντα
  choice: వేళ్లతో సహా పెకలించబడినవి
  rationale: పూర్తిగా వేరుచేయబడి తిరిగి జీవించే అవకాశం లేని తీవ్ర చిత్రాన్ని ‘uprooted’ కంటే స్పష్టంగా తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: σπιλάδες అనే పదం ద్వారా అబద్ధ బోధకుల చిత్రణ
  choice: సమాజపు ప్రేమ విందుల్లో దాగి ఉన్న ప్రమాదకరమైన బండరాళ్లు
  alternative: ప్రేమ విందుల్లోని మచ్చలు లేదా కళంకాలు
  rationale: చుట్టూ ఉన్నవి వరుసగా సజీవమైన ప్రకృతి రూపకాలు కావడం వల్ల ‘దాగి ఉన్న బండరాళ్లు’ సందర్భానికి బాగా సరిపోతుంది; అయితే నైతిక ‘మచ్చలు’ అనే పఠనసాధ్యతను పాదటిప్పణిలో నిలిపాం.
- issue: ἑαυτοὺς ποιμαίνοντες లో ποιμαίνω యొక్క భావం
  choice: కాపరి/మేపుట రూపకాన్ని ‘తమనే తాము మేపుకొంటున్నారు’గా నిలుపడం
  alternative: తమ కడుపు నింపుకొంటున్నారు లేదా తమనే చూసుకొంటున్నారు
  rationale: మూల క్రియ సాధారణంగా కాపరిగా ఉండటం లేదా మేపటం అని అర్థం; ఈ రూపాన్ని నిలపడం యెహెజ్కేలు 34లోని స్వప్రయోజనపరులైన కాపరుల ప్రతిధ్వనిని అనుమతిస్తుంది, కానీ దాన్ని బలవంతంగా వ్యాఖ్యానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు స్పష్టంగా ఉండే శైలి. గ్రీకు వాక్యంలోని వరుస రూపకాలను సెమికోలన్లు మరియు డాష్‌తో నిలిపాం. ‘రెండుసార్లు చనిపోయి’ అనే ఉద్దేశపూర్వక ఉద్వేగాన్ని వివరించి తగ్గించకుండా ఉంచాం.
