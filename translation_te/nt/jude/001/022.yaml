lexical_decisions:
- source_word: καὶ
  choice: ప్రత్యేకంగా అనువదించలేదు
  rationale: ఇది ముందున్న ఉపదేశాలను ఈ వాక్యంతో కలిపే సాధారణ సంధాయకం. తెలుగు సందర్భంలో వాక్యారంభంలో ‘మరియు’ అని పెట్టడం సహజంగా ఉండదు; అనుసంధానం సందర్భం ద్వారానే స్పష్టమవుతుంది.
- source_word: οὓς μὲν
  choice: వారిపై
  rationale: ఈ పదబంధం తరువాత పేర్కొనే ఇతర వర్గాలకు భిన్నంగా ఒక వర్గాన్ని పరిచయం చేస్తుంది. μέν ను యాంత్రికంగా ‘ఒకవైపు’ అని అనువదించకుండా, తెలుగు వాక్య నిర్మాణంలో సహజంగా సూచించాం.
- source_word: ἐλεᾶτε
  choice: కనికరం చూపండి
  rationale: ఆజ్ఞార్థక క్రియలోని కరుణతో వ్యవహరించాలనే నైతిక బలాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: διακρινομένους
  choice: సందేహపడుతున్నవారు
  rationale: ఈ సందర్భంలో ఆత్మీయంగా అనిశ్చితిలో ఉన్నవారిని సూచించడం సాధ్యమైన ప్రధాన భావం. అయితే గ్రీకు పదానికి ఊగిసలాడడం లేదా వాదించడం అనే భావాలు కూడా రావచ్చు; అందువల్ల ఆ అస్పష్టతను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: διακρινομένους అనే పదం సూచించే వారి స్థితి
  choice: సందేహపడుతున్నవారు
  alternative: ఊగిసలాడుతున్నవారు; వాదిస్తున్నవారు
  rationale: కనికరం చూపాలనే ఆజ్ఞతో కలిసి చదివినప్పుడు, తప్పుడు బోధ వల్ల అనిశ్చితిలో ఉన్నవారు అనే భావం సందర్భానికి చక్కగా సరిపోతుంది. అయినా మూలపదం ఇతర భావాలను కూడా అనుమతిస్తుంది కాబట్టి వాటిని సిద్ధాంతపరంగా తొలగించకుండా పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: సామాన్య పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైన ఆజ్ఞారూపాన్ని ఉపయోగించాం. ‘కరుణించండి’ కంటే ‘కనికరం చూపండి’ ఇక్కడ సహజంగా, సంబంధాత్మకంగా వినిపిస్తుంది.
