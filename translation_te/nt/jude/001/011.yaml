id: JUD.1.11
reference: Jude 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐαὶ αὐτοῖς, ὅτι τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν, καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν, καὶ τῇ ἀντιλογίᾳ τοῦ Κόρε ἀπώλοντο.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/011.yaml
  text: Woe to them[a], because they have walked in the way of Cain, and have poured themselves out for pay into Balaam’s error, and have perished in Korah’s rebellion.
translation:
  language: te
  text: వారికి శ్రమ! వారు కయీను మార్గంలో నడిచారు; లాభం కోసం బిలాము తప్పుదారిలోకి అదుపు లేకుండా దూసుకుపోయారు[a]; కోరహు తిరుగుబాటులో నశించారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “లాభం కోసం బిలాము తప్పుదారిలో తమను తాము అప్పగించుకున్నారు.”
    reason: ἐξεχύθησαν అనే రూపకానికి మరింత అక్షరార్థానికి దగ్గరైన, స్వీయ-విసర్జన భావాన్ని తెలిపే ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: οὐαὶ
  choice: అయ్యో!
  rationale: ఇది కేవలం విచారాన్ని కాక, ప్రవక్తల తీర్పు ప్రకటనలోని ఖండనను కూడా వ్యక్తం చేస్తుంది.
- source_word: τῇ ὁδῷ τοῦ Κάϊν ἐπορεύθησαν
  choice: కయీను మార్గంలో నడిచారు
  rationale: ὁδός‌లోని ప్రవర్తనా మార్గం అనే రూపకాన్ని, ἐπορεύθησαν‌లోని నడచుట భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τῇ πλάνῃ τοῦ Βαλαὰμ
  choice: బిలాము తప్పుదారిలో
  rationale: πλάνηలో తప్పు, మోసం, దారితప్పడం అనే భావాలు ఉన్నాయి; 'తప్పుదారి' నైతికంగా భ్రష్టమైన గమనాన్ని, రూపకాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: μισθοῦ
  choice: జీతం కోసం
  rationale: లాభాపేక్షతో పొందే ప్రతిఫలాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలంలోని mercenary motive‌ను అతిగా వివరించదు.
- source_word: ἐξεχύθησαν
  choice: తమను తాము కుమ్మరించుకున్నారు
  rationale: క్రియలోని 'కుమ్మరింపబడటం/కుమ్మరించుకోవడం' అనే బలమైన రూపకాన్ని నిలుపుతూ, సందర్భంలోని అదుపులేని స్వీయ సమర్పణ భావాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τῇ ἀντιλογίᾳ τοῦ Κόρε
  choice: కోరహు తిరుగుబాటులో
  rationale: సంఖ్యాకాండము 16లోని సంఘటనను దృష్టిలో ఉంచితే ἀντιλογίαలోని వ్యతిరేకత ఇక్కడ తిరుగుబాటుగా సహజంగా వ్యక్తమవుతుంది.
- source_word: ἀπώλοντο
  choice: నశించారు
  rationale: నాశనం లేదా పతనం అనే గంభీర ఫలితాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; నాశన విధానాన్ని అనవసరంగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: καὶ τῇ πλάνῃ τοῦ Βαλαὰμ μισθοῦ ἐξεχύθησαν అనే సంక్షిప్తమైన రూపక వాక్యభాగాన్ని ఎలా అనువదించాలి
  choice: జీతం కోసం బిలాము తప్పుదారిలో తమను తాము కుమ్మరించుకున్నారు
  alternative: లాభం కోసం బిలాము తప్పుదారిలోకి అదుపు లేకుండా దూసుకుపోయారు
  rationale: ప్రధాన పాఠం ἐξεχύθησαν‌లోని కుమ్మరించుట రూపకాన్ని, μισθοῦ సూచించే లాభాపేక్షను నిలుపుతుంది. ఈ రూపకం తెలుగులో అసాధారణంగా వినిపించవచ్చు కాబట్టి, దాని భావాన్ని తెలిపే మరింత సహజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన తీర్పు ధోరణి, మూడు సమాంతర భాగాలు, పాత నిబంధన వ్యక్తులపై సూచనలు నిలుపబడ్డాయి. ప్రధాన పాఠంలో క్లిష్టమైన మూల రూపకం ఉద్దేశపూర్వకంగా కాపాడబడింది; పాదటిప్పణి దాని సహజ భావానువాదాన్ని అందిస్తుంది.
