id: JUD.1.18
reference: Jude 1:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἔλεγον ⸀ὑμῖν· ⸂Ἐπ’ ἐσχάτου χρόνου⸃ ἔσονται ἐμπαῖκται κατὰ τὰς ἑαυτῶν ἐπιθυμίας πορευόμενοι τῶν ἀσεβειῶν.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/018.yaml
  text: that they were saying to you[a], “In the last time there will be mockers[b], going according to their own ungodly desires.”
translation:
  language: te
  text: 'వారు మీతో ఇలా చెప్పేవారు: “చివరి కాలంలో[a] అపహాసకులు[b] ఉంటారు. వారు తమ భక్తిహీనమైన కోరికల ప్రకారం నడుచుకుంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “కాలాంతంలో.” గ్రీకులో “కాలం” ఏకవచనంలో ఉంది; “దినాలు” అని లేదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఎగతాళి చేసేవారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: చెప్పేవారు
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో పదేపదే లేదా కొనసాగుతూ చెప్పడాన్ని సూచిస్తుంది; ‘చెప్పేవారు’ ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Ἐπ’ ἐσχάτου χρόνου
  choice: చివరి కాలంలో
  rationale: χρόνου ఏకవచనంలో ఉంది. అందువల్ల ‘చివరి దినాల్లో’ అని మార్చకుండా, అంత్యకాల భావాన్ని సహజంగా వ్యక్తం చేసే ‘చివరి కాలంలో’ ఎంచుకున్నాం.
- source_word: ἐμπαῖκται
  choice: అపహాసకులు
  rationale: ఎగతాళి చేస్తూ వ్యతిరేకించేవారిని సూచించే ఈ పదానికి ‘అపహాసకులు’ గౌరవప్రదమైన ఆధునిక తెలుగు రూపం; ‘ఎగతాళి చేసేవారు’ అనే మరింత సాధారణ ప్రత్యామ్నాయం పాదసూచికలో ఇచ్చాం.
- source_word: κατὰ τὰς ἑαυτῶν ἐπιθυμίας
  choice: తమ ... కోరికల ప్రకారం
  rationale: κατά ఇక్కడ అనుసరణ లేదా అనుగుణతను తెలియజేస్తుంది. ἐπιθυμίαι విస్తృతంగా కోరికలను సూచిస్తుంది కాబట్టి దానిని కేవలం లైంగిక వాంఛలకు పరిమితం చేయలేదు.
- source_word: πορευόμενοι
  choice: నడుచుకుంటారు
  rationale: ఈ కృదంతం అక్షరార్థంగా వెళ్లడం లేదా నడవడం, రూపకాలంకారంగా జీవన ప్రవర్తనను సూచిస్తుంది; ‘నడుచుకుంటారు’ ఈ రెండు ఛాయలను సహజంగా నిలుపుతుంది.
- source_word: τῶν ἀσεβειῶν
  choice: భక్తిహీనమైన
  rationale: ఈ జనిటివ్ రూపం కోరికలను భక్తిహీనతతో లక్షణీకరిస్తుంది. ‘భక్తిహీనమైన కోరికలు’ దేవునిపట్ల గౌరవం లేని నైతిక-మతపరమైన భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: అంత్యకాల వ్యక్తీకరణ
  choice: చివరి కాలంలో
  alternative: చివరి దినాల్లో; కాలాంతంలో
  rationale: మూలంలో χρόνος ఏకవచనంలో ఉన్నందున, ఇతర వాక్యాల్లో సుపరిచితమైన ‘చివరి దినాలు’ అనే పదబంధంతో సమన్వయం చేయలేదు. అదే సమయంలో దాని అంత్యకాల భావాన్ని నిలిపాం.
- issue: కోరికల నైతిక స్వభావం
  choice: భక్తిహీనమైన కోరికలు
  alternative: భక్తిహీనతతో కూడిన కోరికలు; దేవునిపట్ల భయం లేని కోరికలు
  rationale: మూలంలోని నైతిక తీర్పును స్పష్టంగా ఉంచుతూ, ἐπιθυμίαι అనే విస్తృత పదాన్ని లైంగిక వాంఛలకు మాత్రమే పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘చెప్పేవారు’ ద్వారా కొనసాగిన లేదా పునరావృతమైన గత వాక్కును, ‘నడుచుకుంటారు’ ద్వారా జీవన ప్రవర్తన అనే రూపకాన్ని నిలిపాం. పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో వాటి సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
