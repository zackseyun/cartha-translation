id: JUD.1.13
reference: Jude 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κύματα ἄγρια θαλάσσης ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας, ἀστέρες πλανῆται οἷς ὁ ζόφος τοῦ σκότους εἰς αἰῶνα τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/013.yaml
  text: wild waves of the sea[a], foaming up their own shames; wandering stars[b], for whom the gloom of darkness has been reserved forever.
translation:
  language: te
  text: సముద్రపు ఉగ్ర అలలు[a], తమ సొంత అవమానాలను నురగలా పైకి ఎగదోసేవి; అటూ ఇటూ తిరిగే నక్షత్రాలు, వీరికోసం చీకటి గాఢాంధకారం[b] శాశ్వతంగా భద్రపరచబడి ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమ సొంత అవమానకరమైన పనులను నురగలా పైకి ఎగదోసేవి.” గ్రీకులోని “అవమానాలు” అనే బహువచనం అవమానాన్ని లేదా వారిని బట్టబయలు చేసే అవమానకరమైన పనులను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “చీకటి యొక్క దట్టమైన అంధకారం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: κύματα ἄγρια θαλάσσης
  choice: సముద్రపు ఉగ్ర అలలు
  rationale: κύματα అంటే ‘అలలు,’ ἄγρια వాటి అదుపులేని ఉగ్రతను సూచిస్తుంది, θαλάσσης ‘సముద్రపు’ అనే సంబంధాన్ని తెలియజేస్తుంది. ఈ రూపం సజీవమైన రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐπαφρίζοντα τὰς ἑαυτῶν αἰσχύνας
  choice: తమ సొంత అవమానకరమైన పనులను నురగగా పైకి కక్కేవారు
  rationale: ἐπαφρίζοντα నురగను పైకి కక్కే నిరంతర చర్యను సూచిస్తుంది. αἰσχύνας అనే బహువచనం అవమానాలనో, అవమానకరమైన క్రియలనో సూచించవచ్చు; ప్రధాన పాఠ్యంలో సహజంగా అర్థమయ్యే క్రియాత్మక భావాన్ని తీసుకుని, ఇతర సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం. ἑαυτῶν లోని స్వీయ ఉద్ఘాటనను ‘తమ సొంత’ నిలుపుతుంది.
- source_word: ἀστέρες πλανῆται
  choice: దారితప్పి తిరిగే నక్షత్రాలు
  rationale: πλανῆται లో సంచరించడం మాత్రమే కాక దారితప్పడం అనే భావ ఛాయ కూడా ఉంది. ఆధునిక ఖగోళార్థంలోని ‘గ్రహాలు’ అని నిర్దిష్టం చేయకుండా వ్యక్తులపై ప్రయోగించిన రూపకాన్ని ఈ అనువాదం స్పష్టంగా ఉంచుతుంది.
- source_word: ὁ ζόφος τοῦ σκότους
  choice: చీకటి గాఢాంధకారం
  rationale: ζόφος మబ్బులాంటి దట్టమైన గాఢాంధకారాన్ని, σκότος చీకటిని సూచిస్తాయి. మూలంలోని తీవ్రతను, సంబంధ నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ తెలుగులో గంభీరంగా వినిపించే రూపం.
- source_word: εἰς αἰῶνα
  choice: శాశ్వతంగా
  rationale: ఈ తీర్పు సందర్భంలో ఈ పదబంధం అంతం లేని కాలవ్యాప్తిని సహజంగా సూచిస్తుంది.
- source_word: τετήρηται
  choice: భద్రపరచబడి ఉంది
  rationale: పరిపూర్ణ కర్మణి రూపం గతంలో ఏర్పడిన చర్య ఫలితంగా ఇప్పటికీ నిలిచి ఉన్న స్థితిని సూచిస్తుంది. ‘భద్రపరచబడి ఉంది’ అనేది తీర్పుకోసం ఉంచబడిన భావాన్ని, ఫలితస్థితిని రెండింటినీ తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: εἰς αἰῶνα లోని తుదితీర్పు కాలవ్యాప్తి
  choice: శాశ్వతంగా
  alternative: యుగాంతం వరకు / యుగానికి
  rationale: ఈ తీర్పు సందర్భంలో εἰς αἰῶνα సహజంగా నిరంతర కాలాన్ని తెలియజేస్తుంది. అదనపు సిద్ధాంత వివరణను చేర్చకుండా హెచ్చరిక తీవ్రతను నిలుపుతుంది.
- issue: αἰσχύνας బహువచనం సూచించే అవమానం లేదా అవమానకరమైన క్రియలు
  choice: అవమానకరమైన పనులు
  alternative: తమ సొంత అవమానాలు / తమ సొంత అవమానాన్ని
  rationale: గ్రీకు పదం అవమాన స్థితినీ, అవమానకర ప్రవర్తననీ సూచించగలదు. ప్రధాన పాఠ్యంలో అలలు బయటకు కక్కే రూపకంతో క్రియాత్మక భావం సహజంగా సరిపోతుంది; నిజమైన అర్థసందిగ్ధతను పాదసూచికలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైన ప్రవచనాత్మక రూపకాలతో అనువదించబడింది. మూలంలోని రెండు సమాంతర రూపకాలు, బహువచనంలోని అర్థసందిగ్ధత, పరిపూర్ణ కర్మణి క్రియ సూచించే నిలిచియున్న స్థితి సంరక్షించబడ్డాయి. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
