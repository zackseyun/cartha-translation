revisions:
- from: సముద్రపు ఉగ్ర అలలు[a], తమ సొంత అవమానకరమైన పనులను నురగగా పైకి కక్కేవారు; దారితప్పి తిరిగే నక్షత్రాలు, వీరికోసం చీకటి గాఢాంధకారం శాశ్వతంగా భద్రపరచబడి ఉంది.[b]
  to: సముద్రపు ఉగ్ర అలలు[a], తమ సొంత అవమానాలను నురగలా పైకి ఎగదోసేవి; అటూ ఇటూ తిరిగే నక్షత్రాలు, వీరికోసం చీకటి గాఢాంధకారం[b] శాశ్వతంగా భద్రపరచబడి ఉంది.
  rationale: The revision keeps the source’s parallel metaphors, plural ‘shames,’ and judgment imagery while avoiding an unnecessary interpretive narrowing of αἰσχύνας and an added ‘lost one’s way’ sense in πλανῆται. It also uses natural Telugu syntax for waves and relocates footnote b to the expression it documents.
