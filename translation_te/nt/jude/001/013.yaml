review_pass:
  verdict: revise
  source_fidelity: The draft preserves the two metaphorical images and the perfect-passive sense of τετήρηται. However, “దారితప్పి తిరిగే” adds the idea of having lost one’s way, which πλανῆται does not require. The main rendering of αἰσχύνας as “అవమానకరమైన పనులు” prematurely selects one of the source word’s possible senses; the Greek plural ‘shames/disgraces’ is better retained in the text, with ‘shameful deeds’ in a note.
  naturalness: “కక్కేవారు” grammatically treats the sea waves as human agents and is less natural in this Telugu image. A neuter-compatible verbal expression for waves is preferable. “అటూ ఇటూ తిరిగే నక్షత్రాలు” is clear, modern Telugu and conveys ‘wandering’ without importing modern astronomical specificity or the additional ‘lost’ sense.
  terminology: “సముద్రపు ఉగ్ర అలలు,” “చీకటి గాఢాంధకారం,” “శాశ్వతంగా,” and “భద్రపరచబడి ఉంది” suitably convey the source’s vivid, solemn register. The darkness phrase retains the source’s emphatic pairing of ζόφος and σκότος.
  issues:
  - severity: medium
    issue: The main text renders αἰσχύνας as “అవమానకరమైన పనులు.”
    rationale: αἰσχύνας can refer to disgraces/shames or shameful acts. Choosing ‘deeds’ in the main text narrows an ambiguity that the Greek deliberately leaves open; “అవమానాలు” preserves the plural and ambiguity.
  - severity: medium
    issue: “దారితప్పి తిరిగే నక్షత్రాలు” adds ‘having lost the way.’
    rationale: πλανῆται means wandering/roaming and may carry an errant nuance in context, but ‘దారితప్పి’ states a more specific evaluative image than the word itself requires.
  - severity: low
    issue: “కక్కేవారు” personifies the waves through a human plural verb.
    rationale: The Greek participle agrees grammatically with ‘waves’; Telugu can retain the image more naturally with a form appropriate to waves, such as “పైకి ఎగదోసేవి.”
  - severity: low
    issue: Footnote b is anchored after the sentence rather than at the darkness phrase it explains.
    rationale: Placing the anchor immediately after “చీకటి గాఢాంధకారం” makes the note’s referent unambiguous.
  revised_text: సముద్రపు ఉగ్ర అలలు[a], తమ సొంత అవమానాలను నురగలా పైకి ఎగదోసేవి; అటూ ఇటూ తిరిగే నక్షత్రాలు, వీరికోసం చీకటి గాఢాంధకారం[b] శాశ్వతంగా భద్రపరచబడి ఉంది.
