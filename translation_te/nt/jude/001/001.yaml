  - severity: medium
    issue: The three Greek recipient modifiers are not rendered in fully parallel Telugu form.
    rationale: ἠγαπημένοις, τετηρημένοις, and κλητοῖς are coordinated dative plural modifiers. ‘ప్రేమించబడిన, కాపాడబడిన, పిలువబడిన వారికి’ preserves their parallel adjectival function more precisely than two converbs followed by an adjective.
