source:
  edition: SBLGNT
  text: Ἰούδας Ἰησοῦ Χριστοῦ δοῦλος, ἀδελφὸς δὲ Ἰακώβου, τοῖς ἐν θεῷ πατρὶ ⸀ἠγαπημένοις καὶ Ἰησοῦ Χριστῷ τετηρημένοις κλητοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/001.yaml
  text: 'Jude[a], a servant of Jesus the Messiah and brother of James, to those who are loved in God the Father and kept for Jesus the Messiah[c][b], called:'
translation:
  language: te
  text: 'యేసు మెస్సీయకు దాసుడును, యాకోబు సోదరుడునైన యూదా—తండ్రియైన దేవునిలో ప్రేమించబడిన[a], యేసు మెస్సీయ కొరకు కాపాడబడిన[b], పిలువబడిన[c] వారికి:


    [a] కొన్ని ప్రాచీన ప్రతుల్లో “తండ్రియైన దేవునిలో పవిత్రపరచబడిన” అని ఉంది.


    [b] లేదా “యేసు మెస్సీయ చేత కాపాడబడిన.” గ్రీకు దత్తివిభక్తి “చేత” అనే కర్తృత్వ భావాన్నిగానీ, “కొరకు” అనే ప్రయోజన భావాన్నిగానీ సూచించవచ్చు.


    [c] లేదా “పిలువబడినవారికి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “తండ్రియైన దేవునిలో పవిత్రపరచబడిన” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా “యేసు మెస్సీయ చేత కాపాడబడిన.” గ్రీకు దత్తివిభక్తి “చేత” అనే కర్తృత్వ భావాన్నిగానీ, “కొరకు” అనే ప్రయోజన భావాన్నిగానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా “పిలువబడినవారికి.”
    reason: alternative_rendering
lexical_decisions:
- source_word: δοῦλος
  choice: దాసుడు
  rationale: బంధిత సేవను, సంపూర్ణ విధేయతను సూచించే గ్రీకు పదబలాన్ని తెలుగులో సహజంగా నిలుపుతుంది; “బానిస” ఆధునిక తెలుగులో ప్రధానంగా బలవంతపు సామాజిక దాస్యాన్నే ముందుకు తెస్తుంది.
- source_word: Χριστοῦ / Χριστῷ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదు; “అభిషిక్తుడు” అనే భావాన్ని కలిగిన యూదుల నిరీక్షణ సంబంధమైన “మెస్సీయ” బిరుదును నిలుపుతుంది.
- source_word: ἀδελφὸς δὲ Ἰακώβου
  choice: యాకోబు సోదరుడు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకత కాక స్వల్ప అనుసంధానం; తెలుగు సమాస వాక్య నిర్మాణంలో ప్రత్యేకంగా “కాని” లేదా “మరియు” అవసరం లేదు.
- source_word: ἐν θεῷ πατρὶ
  choice: తండ్రియైన దేవునిలో
  rationale: ἐν యొక్క పరిధి/సంబంధ భావాన్ని “లో” ద్వారా నిలుపుతూ, దేవుడు తండ్రి అనే గ్రీకు పదబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἠγαπημένοις
  choice: ప్రేమించబడి
  rationale: పూర్తయిన చర్య ఫలితంగా కొనసాగుతున్న స్థితిని సూచించే perfect passive participle భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τετηρημένοις
  choice: కాపాడబడి
  rationale: కాపాడి ఉంచబడిన స్థితిని సూచించే perfect passive భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: κλητοῖς
  choice: పిలువబడిన వారికి
  rationale: గ్రహీతలను విశేషించే substantival adjective భావాన్ని తెలుగులో సహజంగా చూపుతుంది; మిగిలిన రెండు కర్మణి రూపాలతో వ్యాకరణ సమాంతరతను నిలుపుతుంది.
- source_word: Ἰούδας
  choice: యూదా
  rationale: తెలుగు బైబిలు వాడుకలో ఈ రచయిత పేరుకు స్థిరమైన రూపం.
- source_word: Ἰάκωβος
  choice: యాకోబు
  rationale: గ్రీకు Ἰάκωβος పేరుకు మూలానికి దగ్గరగా ఉండే, తెలుగులో పరిచితమైన రూపం.
theological_decisions:
- issue: τετηρημένοις మరియు Ἰησοῦ Χριστῷ మధ్య సంబంధం
  choice: యేసు మెస్సీయ కొరకు కాపాడబడి
  alternative: యేసు మెస్సీయ చేత కాపాడబడి
  rationale: దత్తివిభక్తి ప్రయోజనం/గమ్యం లేదా కర్తృత్వం రెండింటినీ అనుమతిస్తుంది. ప్రధాన పాఠంలో సంభావ్యమైన “కొరకు” భావాన్ని ఉంచి, నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో నిలిపాం.
- issue: ἠγαπημένοις పాఠాంతరం
  choice: ప్రేమించబడి
  alternative: పవిత్రపరచబడి
  rationale: SBLGNT ప్రధాన పాఠంలోని ἠγαπημένοις ను అనుసరించాం; కొన్ని ప్రతుల్లోని ἡγιασμένοις పాఠాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన పత్రికా ఆరంభ శైలి వాడబడింది. “రాస్తున్నది” అనే సహజ తెలుగు పూరకాన్ని చేర్చి, మూలంలోని శీర్షికాత్మక సంబోధన నిర్మాణాన్ని స్పష్టంచేశాం. కృదంతాల సమాంతరతను “ప్రేమించబడి… కాపాడబడి… పిలువబడిన”గా నిలిపాం.
