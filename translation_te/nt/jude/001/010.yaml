id: JUD.1.10
reference: Jude 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτοι δὲ ὅσα μὲν οὐκ οἴδασιν βλασφημοῦσιν, ὅσα δὲ φυσικῶς ὡς τὰ ἄλογα ζῷα ἐπίστανται, ἐν τούτοις φθείρονται.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/010.yaml
  text: But these people slander whatever they do not understand[a], and whatever they understand naturally, like irrational animals[c][b], by these things they are corrupted.
translation:
  language: te
  text: కాని వీరు తమకు అర్థంకాని వాటిని దూషిస్తారు[a]; వివేచనలేని జంతువులవలె సహజసిద్ధంగా వారు గ్రహించే విషయాల ద్వారానే వారు నాశనమవుతున్నారు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తమకు తెలియని వాటిని దూషిస్తారు”; βλασφημοῦσιν అనే పదానికి సందర్భానుసారం “దైవదూషణ చేస్తారు” లేదా “దుర్భాషలాడుతారు” అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సహజంగా,” అంటే జంతువుల సహజ ప్రవృత్తి ప్రకారం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఆ విషయాల్లోనే వారు చెడిపోతున్నారు.” గ్రీకు పదబంధం సాధనం (“వాటి ద్వారా”) లేదా పరిధి (“వాటిలో”) అనే రెండు భావాలనూ అనుమతిస్తుంది; చివరి క్రియకు “చెడిపోతున్నారు” లేదా “నాశనమవుతున్నారు” అనే భావాలు ఉండవచ్చు.
    reason: ambiguity
lexical_decisions:
- source_word: οὗτοι
  choice: వీరు
  rationale: సందర్భంలో యూదా ఖండిస్తున్న చొరబాటుదారులను సూచిస్తుంది; తెలుగులో సహజంగా, లింగాన్ని అనవసరంగా నిర్దేశించకుండా ఉంది.
- source_word: ὅσα μὲν οὐκ οἴδασιν
  choice: తమకు అర్థంకాని వాటిని
  rationale: οἶδα యొక్క ప్రాథమిక భావం ‘తెలుసుకోవడం’ అయినా, ఇక్కడ సహజసిద్ధమైన జ్ఞానంతో ఉన్న వ్యత్యాసం వల్ల ‘అర్థంకాని’ అనేది భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: βλασφημοῦσιν
  choice: దూషిస్తారు
  rationale: ఈ క్రియ పవిత్రమైన వాటిని దైవదూషణ చేయడాన్నీ, సాధారణంగా నిందాపూర్వకంగా మాట్లాడడాన్నీ సూచించగలదు. కర్మ ‘తమకు అర్థంకాని వాటిని’ కావడంతో ‘దూషిస్తారు’ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: φυσικῶς
  choice: సహజసిద్ధంగా
  rationale: హేతుబద్ధమైన అవగాహనకు భిన్నంగా, జంతువులకు సహజంగా కలిగే గ్రహింపును సూచిస్తుంది.
- source_word: ἄλογα ζῷα
  choice: వివేచనలేని జంతువులు
  rationale: ἄλογα ఇక్కడ హేతుబద్ధమైన వివేచన లేమిని తెలియజేస్తుంది; ఈ తెలుగు రూపం ఆధునికంగా, అవమానకరమైన పాత పదజాలం లేకుండా ఉంది.
- source_word: ἐπίστανται
  choice: తెలుసుకునే
  rationale: వారికి సహజంగా ఉన్న పరిమిత గ్రహింపును సూచిస్తుంది; ముందటి ‘అర్థంకాని’ అనే పదంతో భావపరమైన వ్యత్యాసాన్ని ఉంచుతుంది.
- source_word: ἐν τούτοις
  choice: వాటివల్లనే
  rationale: ἐν τούτοις స్థానార్థకంగానూ సాధనార్థకంగానూ అర్థమవుతుంది. ఇక్కడ వారు అనుసరించే సహజ ప్రవృత్తులే వారి నాశనానికి సాధనమవుతున్న భావాన్ని ప్రధాన పాఠం సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: φθείρονται
  choice: నాశనమవుతున్నారు
  rationale: ఈ రూపం చెడిపోవడం మరియు చివరికి నాశనానికి గురికావడం అనే పరస్పర సంబంధిత భావాలను కలిగి ఉంటుంది. యూదా పత్రికలోని తీర్పు సందర్భంలో ‘నాశనమవుతున్నారు’ దాని తీవ్రతను తెలియజేస్తుంది; ‘చెడిపోతున్నారు’ అనే ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
theological_decisions:
- issue: βλασφημέω అనే క్రియ యొక్క పరిధి
  choice: దూషిస్తారు
  alternative: దైవదూషణ చేస్తారు; దుర్భాషలాడుతారు
  rationale: ఈ వాక్యం నేరుగా దేవుణ్ణి కర్మగా పేర్కొనదు. అందువల్ల ‘దూషిస్తారు’ అనే విస్తృత పదం వాక్యంలోని తీవ్రతను ఉంచుతూ, పాఠ్యం స్పష్టంగా చెప్పని దైవసంబంధ కర్మను చేర్చదు.
- issue: φθείρονται లోని చెడిపోవడం–నాశనం ఉద్రిక్తత
  choice: నాశనమవుతున్నారు
  alternative: చెడిపోతున్నారు
  rationale: సందర్భంలో నైతిక భ్రష్టత మరియు తీర్పువల్ల కలిగే నాశనం రెండూ ప్రతిధ్వనిస్తాయి. ప్రధాన పాఠంలో నాశన భావాన్ని ఇచ్చి, నైతిక చెడిపోవడం అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: ἐν τούτοις యొక్క స్థానార్థక లేదా సాధనార్థక భావం
  choice: వాటివల్లనే
  alternative: వాటిలోనే
  rationale: సహజసిద్ధంగా తెలిసిన విషయాలు వారి నాశనానికి సాధనమవుతున్నాయని ప్రధాన పాఠం చూపుతుంది; ‘వాటిలోనే’ అనే స్థానార్థక పఠనం కూడా గ్రీకు నిర్మాణంలో సాధ్యమైనందున పాదసూచికలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి వాడబడింది. ‘వివేచనలేని జంతువులు’ హేతుబద్ధత లేమిని స్పష్టంగా తెలియజేస్తుంది. ప్రధాన వాక్యంలోని రెండు భాగాల వ్యత్యాసాన్ని ‘కాని… అయితే…’ నిర్మాణం నిలుపుతుంది.
