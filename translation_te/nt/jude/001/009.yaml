    text: “ప్రధాన దేవదూత” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ మాటలు జెకర్యా 3:2ను ప్రతిధ్వనింపజేస్తాయి; అక్కడ యెహోవా సాతానును గద్దిస్తాడు.
    reason: cross_reference
