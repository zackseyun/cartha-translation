id: JUD.1.9
reference: Jude 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ Μιχαὴλ ὁ ἀρχάγγελος, ὅτε τῷ διαβόλῳ διακρινόμενος διελέγετο περὶ τοῦ Μωϋσέως σώματος, οὐκ ἐτόλμησεν κρίσιν ἐπενεγκεῖν βλασφημίας, ἀλλὰ εἶπεν· Ἐπιτιμήσαι σοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/009.yaml
  text: But Michael the archangel[a], when he was disputing with the devil and arguing about Moses' body, did not dare to bring a slanderous judgment against him, but said[b], “May the Lord rebuke you.”
translation:
  language: te
  text: అయితే ప్రధానదూత మిఖాయేలు[a] అపవాదితో వివాదంలో ఉండి మోషే దేహం గురించి వాదిస్తున్నప్పుడు, అతనికి వ్యతిరేకంగా దూషణతో కూడిన తీర్పు పలకడానికి సాహసించలేదు. బదులుగా, “ప్రభువు నిన్ను గద్దించుగాక” అని అన్నాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ప్రధాన దేవదూత” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఈ మాటలు జెకర్యా 3:2ను ప్రతిధ్వనింపజేస్తాయి; అక్కడ యెహోవా సాతానును గద్దిస్తాడు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀρχάγγελος
  choice: ప్రధానదూత
  rationale: ‘దూతలలో ప్రధానుడు’ అనే బిరుదు భావాన్ని సహజమైన, స్థిరపడిన తెలుగు పదంతో తెలియజేస్తుంది.
- source_word: διαβόλῳ
  choice: అపవాది
  rationale: ఇక్కడ వ్యక్తిగతమైన అతీంద్రియ విరోధిని సూచించే బిరుదు; తెలుగు బైబిలు వాడుకలో స్థిరపడిన రూపం, అలాగే పదంలోని ‘నిందించేవాడు’ అనే భావాన్నీ నిలుపుతుంది.
- source_word: διακρινόμενος διελέγετο
  choice: వివాదపడుతూ వాదించినప్పుడు
  rationale: పరస్పరం దగ్గర భావాలున్న రెండు గ్రీకు క్రియలనూ కూలదోసకుండా, కొనసాగుతున్న విరోధపూర్వక వివాదం మరియు మాటల వాదన అనే ఛాయలను ప్రతిబింబిస్తుంది.
- source_word: περὶ τοῦ Μωϋσέως σώματος
  choice: మోషే దేహం గురించి
  rationale: గ్రీకు సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: οὐκ ἐτόλμησεν
  choice: సాహసించలేదు
  rationale: τολμάω లోని ‘చేయడానికి తెగించడం/సాహసించడం’ అనే సూటి భావాన్ని నిలుపుతుంది.
- source_word: κρίσιν ἐπενεγκεῖν βλασφημίας
  choice: దూషణతో కూడిన తీర్పు మోపడానికి
  rationale: కఠినమైన గ్రీకు నిర్మాణంలోని న్యాయపరమైన ‘తీర్పు మోపడం’ భావాన్ని, βλασφημία లోని దూషణ భావాన్ని నిలుపుతూ, మిఖాయేలు దేవుణ్ణి దూషించాడనే అపార్థాన్ని తగ్గిస్తుంది.
- source_word: Ἐπιτιμήσαι σοι κύριος
  choice: ప్రభువు నిన్ను గద్దించుగాక
  rationale: ఆప్టేటివ్ రూపంలోని కోరిక లేదా విజ్ఞాపన భావాన్ని సహజమైన తెలుగు ఆశీర్వాదార్థక క్రియారూపంతో వ్యక్తపరుస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: κύριος కు తెలుగు క్రైస్తవ వాడుకలో సహజమైన, గౌరవప్రదమైన సాధారణ అనువాదం.
theological_decisions:
- issue: అపవాదిని సంబోధించడంలో మిఖాయేలు చూపిన సంయమనం
  choice: మిఖాయేలు తనంతట తాను దూషణతో కూడిన తీర్పును మోపకుండా, ప్రభువు గద్దింపును కోరాడు.
  alternative: మిఖాయేలు దూషణాత్మకమైన తీర్పునే గాని, లేదా నిందాపూర్వక ఆరోపణనే గాని పలకలేదు.
  rationale: κρίσιν ... βλασφημίας అనే పదబంధానికి ఒకటి కంటే ఎక్కువ సాధ్యమైన వివరణలు ఉన్నాయి. అనువాదం నిర్దిష్ట దేవదూతల సిద్ధాంతాన్ని చొప్పించకుండా, మిఖాయేలు స్వయంగా తీర్పు మోపక ప్రభువు అధికారాన్ని ఆశ్రయించాడనే స్పష్టమైన వ్యత్యాసాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అదే సమయంలో గంభీరమైన గ్రంథశైలిని నిలుపుతూ రూపొందించబడింది. క్లిష్టమైన గ్రీకు న్యాయపర పదబంధంలోని అస్పష్టతను పూర్తిగా తొలగించకుండా ఉంచింది.
