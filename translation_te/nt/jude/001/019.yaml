id: JUD.1.19
reference: Jude 1:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἱ ἀποδιορίζοντες, ψυχικοί, πνεῦμα μὴ ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/019.yaml
  text: These are the ones who cause divisions[a], worldly people[c][b], not having the Spirit.
translation:
  language: te
  text: వీరు విభజనలు కలిగించేవారు[a], సహజ స్వభావం గలవారు[b], పరిశుద్ధాత్మ లేనివారు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమను తాము వేరుచేసుకునేవారు’; లేదా ‘విభజనలు చేసేవారు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఆత్మసంబంధమైన వారు కానివారు’; లేదా ‘సహజ మనుషులు.’
    reason: lexical_alternative
  - marker: c
    text: మూలంలో ‘ఆత్మ’ అని ఉంది; ఈ సందర్భంలో అది ఎక్కువగా పరిశుద్ధాత్మను సూచిస్తుంది. అయితే ‘మానవ ఆత్మ’ అనే అర్థసాధ్యత కూడా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοί
  choice: వీరు
  rationale: ముందు ప్రస్తావించిన దుర్బోధకులను సూచించే నిర్దేశక సర్వనామం. ‘వీరు’ సంక్షిప్తంగా, సహజంగా ఉండి మూలంలోని సూచనార్థాన్ని నిలుపుతుంది.
- source_word: οἱ ἀποδιορίζοντες
  choice: విభేదాలు కలిగించేవారు
  rationale: ఈ కృదంతం వారిని విభజనకు కారణమయ్యే ప్రవర్తన ద్వారా వర్ణిస్తుంది. సందర్భంలో క్రియాశీల విభేదకారక భావం బలంగా ఉన్నా, ‘తమను తాము వేరుచేసుకునేవారు’ అనే అర్థసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: ψυχικοί
  choice: సహజ స్వభావానికి లోబడినవారు
  rationale: ఈ పదం తరువాతి πνεῦμα భావంతో వ్యత్యాసాన్ని చూపుతూ, దేవుని ఆత్మచేత నడిపింపబడకుండా కేవలం సహజ మానవ ప్రవృత్తులకు లోబడినవారిని సూచిస్తుంది. ‘ప్రాపంచికులు’ కంటే ఈ అనువాదం మూలభావాన్ని స్పష్టంగా తెలియజేస్తుంది; ఇతర సాధ్యమైన పదబంధాలు పాదసూచికలో ఉన్నాయి.
- source_word: πνεῦμα
  choice: పరిశుద్ధాత్మ
  rationale: ψυχικοίతో ఉన్న తక్షణ వ్యత్యాసం, యూదా పత్రిక సందర్భం కలిపి చూస్తే ఇక్కడ పరిశుద్ధాత్మ ఉద్దేశించబడినట్లు బలంగా సూచిస్తాయి. అయితే మూలంలో కేవలం πνεῦμα అని ఉన్నందున ‘ఆత్మ’ అనే సాధ్యతను పాదసూచికలో నిలిపాం.
- source_word: μὴ ἔχοντες
  choice: లేనివారు
  rationale: గ్రీకు నిషేధార్థక కృదంతాన్ని తెలుగులో సహజమైన విశేషణాత్మక రూపంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πνεῦμα ఎవరిని లేదా దేనిని సూచిస్తుంది?
  choice: పరిశుద్ధాత్మ
  alternative: ఆత్మ; మానవ ఆత్మ
  rationale: ψυχικοίతో ఉన్న వ్యత్యాసం మరియు దుర్బోధకులపై యూదా చేస్తున్న హెచ్చరిక పరిశుద్ధాత్మనే ప్రధానంగా సూచిస్తున్నాయి. అయినప్పటికీ మూలపదం వ్యాకరణపరంగా నిర్దిష్ట ఉపపదం లేకుండా ఉండటం వల్ల సాధ్యమైన విస్తృత అర్థాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. వాక్యంలోని వరుస విశేషణాత్మక నిర్మాణం మూలంలోని మూడు సమాంతర వర్ణనలను నిలుపుతుంది; నిజమైన పదార్థ సందిగ్ధతలు పాదసూచికల్లో భద్రపరచబడ్డాయి.
