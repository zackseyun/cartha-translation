revisions:
- from: దేవుని ప్రేమలో[a] మిమ్మల్ని మీరు కాపాడుకోండి; నిత్యజీవం కోసం[c] మన ప్రభువైన యేసు మెస్సీయ[b] కనికరం కోసం ఎదురుచూడండి.
  to: దేవుని ప్రేమలో[a] మిమ్మల్ని మీరు కాపాడుకోండి; నిత్యజీవానికి[c] మన ప్రభువైన యేసు మెస్సీయ యొక్క కనికరం కోసం ఎదురుచూస్తూ ఉండండి.
  rationale: The revision preserves the main imperative ‘కాపాడుకోండి’ and expresses προσδεχόμενοι as an ongoing attendant action, ‘ఎదురుచూస్తూ ఉండండి.’ It also supplies the natural Telugu possessive linker for the mercy belonging to the Lord Jesus the Messiah and uses ‘నిత్యజీవానికి’ for the goal-oriented εἰς phrase. The ambiguous ‘దేవుని ప్రేమలో’ and the title rendering ‘మెస్సీయ’ are retained. All footnote markers remain anchored in the text.
