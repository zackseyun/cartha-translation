id: JUD.1.21
reference: Jude 1:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἑαυτοὺς ἐν ἀγάπῃ θεοῦ τηρήσατε προσδεχόμενοι τὸ ἔλεος τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/jude/001/021.yaml
  text: keep yourselves in the love of God[c][b][a], waiting for the mercy of our Lord Jesus the Messiah unto eternal life.
translation:
  language: te
  text: దేవుని ప్రేమలో[a] మిమ్మల్ని మీరు కాపాడుకోండి; నిత్యజీవానికి[c] మన ప్రభువైన యేసు మెస్సీయ యొక్క కనికరం కోసం ఎదురుచూస్తూ ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దేవుని ప్రేమలో’ అనే మాటను ‘దేవుడు చూపే ప్రేమలో’ అని లేదా ‘దేవునిపట్ల ప్రేమలో’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా ‘నిత్యజీవం కోసం’; ఈ మాటలు నిత్యజీవం అనే లక్ష్యాన్ని లేదా ఫలితాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρήσατε
  choice: కాపాడుకోండి
  rationale: రెండవ పురుష బహువచన ఆజ్ఞారూప బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ἑαυτούς వల్ల ఉన్న ‘మిమ్మల్ని మీరు’ అనే స్వీయ సూచనను ప్రధాన వాక్యంలో స్పష్టంగా ఉంచాం.
- source_word: ἐν ἀγάπῃ θεοῦ
  choice: దేవుని ప్రేమలో
  rationale: θεοῦ అనే షష్ఠీ విభక్తి దేవుడు చూపే ప్రేమనో, దేవునిపట్ల ప్రేమనో సూచించగలదు. ‘దేవుని ప్రేమ’ అనే రూపం ఈ నిజమైన సందిగ్ధతను పరిష్కరించకుండా నిలుపుతుంది.
- source_word: προσδεχόμενοι
  choice: ఎదురుచూడండి
  rationale: కొనసాగుతున్న నిరీక్షణను తెలిపే వర్తమాన కృదంత భావాన్ని తెలుగులో సహజమైన సమన్విత ఆజ్ఞగా వ్యక్తం చేస్తుంది; మూలంలో లేని అధిక తీవ్రతను చేర్చదు.
- source_word: ἔλεος
  choice: కనికరం
  rationale: దయతో కూడిన అనుగ్రహ భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: నూతన నిబంధనలో κύριοςకు సాధారణమైన, గౌరవార్థకమైన తెలుగు సమానం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Ἰησοῦను పేరుగా లిప్యంతరీకరించి, Χριστοῦను అభిషిక్త రాజు అనే బిరుదు భావాన్ని నిలిపే ‘మెస్సీయ’గా ఇచ్చాం.
- source_word: εἰς ζωὴν αἰώνιον
  choice: నిత్యజీవం కోసం
  rationale: εἰς తెలిపే లక్ష్యం లేదా ఫలిత దిశను సంక్షిప్తమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఇతర సాధ్యమైన సంబంధాలను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ἀγάπῃ θεοῦలోని షష్ఠీ విభక్తి భావం
  choice: దేవుని ప్రేమలో అనే సందిగ్ధతను నిలిపాం
  alternative: దేవుడు మీపై చూపే ప్రేమలో; దేవునిపట్ల మీ ప్రేమలో
  rationale: తక్షణ సందర్భం కర్తృసంబంధమైన ప్రేమను గానీ, కర్మసంబంధమైన ప్రేమను గానీ తప్పనిసరిగా నిర్ణయించదు; అందువల్ల మూలంలోని దైవశాస్త్రీయ ఉద్వేగాన్ని అనువాదంలో పరిష్కరించలేదు.
- issue: Χριστοῦను బిరుదుగా అందించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστόςకు అభిషిక్తుడు అనే బిరుదు బలం ఉంది. అందువల్ల కేవలం పేరులో భాగంలా కనిపించే రూపం కంటే ‘మెస్సీయ’ను ఎంచుకున్నాం.
- issue: εἰς ζωὴν αἰώνιον సంబంధం
  choice: నిత్యజీవం కోసం
  alternative: నిత్యజీవానికి; నిత్యజీవానికి నడిపించే
  rationale: εἰς లక్ష్యం లేదా ఫలితాన్ని సూచించవచ్చు. ప్రధాన పాఠం దిశను సహజంగా తెలియజేస్తుంది; ‘నడిపించే’ అని కారణ-ఫలిత సంబంధాన్ని మరీ స్పష్టీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకు ప్రధాన ఆజ్ఞను మొదటి భాగంలో ఉంచి, దానితో పాటు సాగే నిరీక్షణ భావాన్ని రెండో సమన్విత ఆజ్ఞగా సహజీకరించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
