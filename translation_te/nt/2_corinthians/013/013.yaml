id: 2CO.13.13
reference: 2 Corinthians 13:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: te
  text: 'ప్రభువైన యేసు మెస్సీయ[a] కృప, దేవుని ప్రేమ, పరిశుద్ధాత్మ సహవాసం[b] మీ అందరికీ తోడై ఉండుగాక.


    [a] లేదా, సాంప్రదాయికంగా, “యేసు క్రీస్తు.”

    [b] లేదా “పరిశుద్ధాత్మతో సహవాసం” లేదా “పరిశుద్ధాత్మలో పాలుపంచుకోవడం.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సాంప్రదాయికంగా, “యేసు క్రీస్తు.”
    reason: alternative_reading
  - marker: b
    text: లేదా “పరిశుద్ధాత్మతో సహవాసం” లేదా “పరిశుద్ధాత్మలో పాలుపంచుకోవడం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పౌలు ఆశీర్వచనాల్లో స్థిరంగా వినిపించే పదం; దేవుని అనుగ్రహం అనే భావభారాన్ని, తెలుగు క్రైస్తవ వాడుకలోని సహజత్వాన్ని నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువైన
  rationale: ఇక్కడ κύριος యేసుకు సంబంధించిన బిరుదు. ‘ప్రభువైన’ అనే రూపం తదనంతర నామబిరుదుతో సహజంగా కలుస్తుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Ἰησοῦ పేరును లిప్యంతరీకరించి, Χριστοῦను అభిషిక్తుడనే బిరుదుగా ‘మెస్సీయ’ అని ఇచ్చాం; సాంప్రదాయిక ‘యేసు క్రీస్తు’ను పాదసూచికలో ఉంచాం.
- source_word: ἀγάπη
  choice: ప్రేమ
  rationale: ఈ ఆశీర్వచనంలో సహజమైన, అర్థపరిధిని సంకుచితం చేయని సమానార్థకం.
- source_word: θεοῦ
  choice: దేవుని
  rationale: మూలంలోని సంబంధ విభక్తిని అలాగే ఉంచి, ‘దేవుడు మనపై చూపే ప్రేమ’ అని అర్థాన్ని అతిగా నిర్దిష్టం చేయలేదు.
- source_word: κοινωνία
  choice: సహవాసం
  rationale: సంబంధం, భాగస్వామ్యం, పాలుపంచుకోవడం అనే పరస్పర సంబంధిత భావాలను విస్తృతంగా నిలుపుతుంది.
- source_word: ἁγίου πνεύματος
  choice: పరిశుద్ధాత్మ
  rationale: ఆధునిక ప్రామాణిక తెలుగులో దైవిక వ్యక్తికి స్థిరమైన, గౌరవప్రదమైన రూపం.
- source_word: μετὰ πάντων ὑμῶν
  choice: మీ అందరికీ తోడై ఉండుగాక
  rationale: μετά యొక్క తోడుండటం/సన్నిధి భావాన్ని, πάντων యొక్క సమగ్రతను స్పష్టంగా ప్రతిబింబించే సహజ తెలుగు ఆశీర్వచన రూపం.
theological_decisions:
- issue: Χριστοῦ అనే క్రీస్తుసంబంధ బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός స్థిరమైన ఇంటిపేరుగా కాక బిరుదుగా పనిచేస్తుంది. అందువల్ల ప్రధాన పాఠ్యంలో దాని బిరుదు స్వభావాన్ని ‘మెస్సీయ’తో చూపించి, సాంప్రదాయిక రూపాన్ని పాదసూచికలో నిలిపాం.
- issue: κοινωνία τοῦ ἁγίου πνεύματος యొక్క భావం
  choice: పరిశుద్ధాత్మ సహవాసం
  alternative: పరిశుద్ధాత్మతో సహవాసం; పరిశుద్ధాత్మలో పాలుపంచుకోవడం
  rationale: మూలంలోని షష్ఠీ విభక్తి పరిశుద్ధాత్మ ప్రసాదించే సహవాసం, పరిశుద్ధాత్మతో సహవాసం, పరిశుద్ధాత్మలో భాగస్వామ్యం వంటి దగ్గరి భావాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠ్యం ఈ విస్తృతిని నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచిక వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, ఆశీర్వచనానికి తగిన గౌరవప్రదమైన శైలి. మూలంలో వ్యక్తంగా లేని క్రియను తెలుగు ఆశీర్వచన సంప్రదాయానికి అనుగుణంగా ‘తోడై ఉండుగాక’ అని పూరించాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
