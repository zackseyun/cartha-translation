source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν ἁγίῳ φιλήματι. ἀσπάζονται ὑμᾶς οἱ ἅγιοι πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/012.yaml
  text: Greet one another with a holy kiss[b][a]. All the saints greet you.
translation:
  language: te
  text: పరిశుద్ధ ముద్దుతో ఒకరినొకరు పలకరించుకోండి.[a] పరిశుద్ధులందరూ[b] మీకు వందనాలు తెలియజేస్తున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పవిత్ర ముద్దుతో.” ఇది పరిశుద్ధతతోను క్రైస్తవ సహవాసంతోను గుర్తించబడిన, ఆ సంస్కృతిలో తెలిసిన పలకరింపు విధానాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “పరిశుద్ధులు” అంటే విశ్వాసులు, అంటే దేవునికి ప్రత్యేకించబడిన ఆయన ప్రజలు; ప్రత్యేకంగా అధికారిక గుర్తింపు పొందిన కొందరు క్రైస్తవులను మాత్రమే సూచించడం లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: పలకరించుకోండి
  rationale: రెండవ పురుష బహువచన ఆజ్ఞను, పరస్పర కర్మతో సహజంగా వినిపించే ఆధునిక తెలుగు క్రియగా అందిస్తుంది.
- source_word: ἀλλήλους
  choice: ఒకరినొకరు
  rationale: సమాజంలోని పరస్పర చర్యను తెలిపే గ్రీకు అన్యోన్య సర్వనామానికి నేరమైన, సహజమైన తెలుగు సమానం.
- source_word: ἐν ἁγίῳ φιλήματι
  choice: పవిత్రమైన ముద్దుతో
  rationale: ἐν ఇక్కడ పలకరింపు జరిగే విధానాన్ని సూచిస్తుంది కాబట్టి తెలుగులో ‘తో’ సహజం. ἁγίῳ యొక్క పవిత్రత భావాన్నీ, φίλημα యొక్క స్పష్టమైన ‘ముద్దు’ అర్థాన్నీ నిలుపుతుంది.
- source_word: ἀσπάζονται
  choice: వందనాలు చెబుతున్నారు
  rationale: పత్రిక ముగింపులో ఇతరుల అభివందనాలను చేరవేసే సందర్భాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑμᾶς
  choice: మీకు
  rationale: గ్రీకులో నేర కర్మగా ఉన్నప్పటికీ, ‘వందనాలు చెబుతున్నారు’ అనే తెలుగు ప్రయోగానికి చతుర్థీ రూపం సహజం; బహువచన సంబోధన భావం సందర్భంలో నిలుస్తుంది.
- source_word: οἱ ἅγιοι πάντες
  choice: పవిత్రులందరూ
  rationale: పౌలు వాడుకలో దేవునికి ప్రత్యేకించబడిన విశ్వాసుల సమూహాన్ని సూచిస్తుంది. ‘అందరూ’ πάντες యొక్క సంపూర్ణతను స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: పౌలు సమాజపరమైన సంబోధనలో ἅγιοι అనువాదం
  choice: పవిత్రులు
  alternative: దేవుని పవిత్ర ప్రజలు; పరిశుద్ధులు
  rationale: ‘పవిత్రులు’ మూలపదంలోని దేవునికి ప్రత్యేకించబడిన స్థితిని సంక్షిప్తంగా నిలుపుతూ, తరువాతి కాలంలో అధికారికంగా ప్రత్యేక హోదా పొందిన కొందరిని మాత్రమే సూచిస్తున్నట్టు భావించకుండా పాదటిప్పణి ద్వారా వివరిస్తుంది.
- issue: ἅγιον అనే విశేషణం పలకరింపు ముద్దును ఎలా నిర్వచిస్తుంది
  choice: పవిత్రమైన
  alternative: పరిశుద్ధమైన; దేవునికి ప్రత్యేకమైన
  rationale: సాధారణ సామాజిక చర్యకంటే క్రైస్తవ సహవాసపు పవిత్ర స్వభావం గల పలకరింపని సూచిస్తుంది; నిర్దిష్ట ఆచారవిధిని అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞను, సహజమైన పత్రికా ముగింపు శైలిని ఉపయోగించాం. ‘ముద్దు’ అనే సాంస్కృతికంగా నిర్దిష్టమైన చర్యను అస్పష్టమైన ‘ఆప్యాయ పలకరింపు’గా మార్చకుండా నిలిపాం. పాదటిప్పణి గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
