- from: నేను మీ దగ్గరికి రావడం ఇది మూడవసారి. “ఇద్దరు సాక్షుల నోటి ద్వారా, లేదా ముగ్గురు సాక్షుల నోటి ద్వారా ప్రతి విషయం స్థిరపరచబడుతుంది.”[a][b]
  to: నేను మీ దగ్గరకు రావడం ఇది మూడవసారి. “ఇద్దరు లేదా ముగ్గురు సాక్షుల సాక్ష్యంతో ప్రతి విషయం స్థిరపరచబడుతుంది.”[a][b]
  rationale: సవరణ మూలంలోని న్యాయపరమైన సాక్ష్య-నుడికారాన్ని నిలుపుతూ, ప్రధాన పాఠాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చేసింది. πᾶν ῥῆμαకు ‘ప్రతి విషయం’ అనే విస్తృత న్యాయార్థాన్ని కాపాడాం; మరింత అక్షరార్థమైన ‘నోటి ద్వారా’ మరియు ‘ప్రతి మాట’ రూపాలను పాదసూచికలో ఉంచాం. పాదసూచిక గుర్తులు, వాటి క్రమం, కారణాలు యథాతథంగా సరిపోతాయి.
