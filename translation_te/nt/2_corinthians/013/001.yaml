id: 2CO.13.1
reference: 2 Corinthians 13:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: te
  text: నేను మీ దగ్గరకు రావడం ఇది మూడవసారి. “ఇద్దరు లేదా ముగ్గురు సాక్షుల సాక్ష్యంతో ప్రతి విషయం స్థిరపరచబడుతుంది.”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇద్దరు లేదా ముగ్గురు సాక్షుల నోటి ద్వారా ప్రతి మాట స్థిరపరచబడుతుంది.” గ్రీకు పాఠం ద్వితీయోపదేశకాండము 19:15లోని పదప్రయోగాన్ని దగ్గరగా అనుసరిస్తూ న్యాయపరమైన నుడికారాన్ని ఉపయోగిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ద్వితీయోపదేశకాండము 19:15కు సూచన.
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: నేను మీ దగ్గరికి రావడం ఇది మూడవసారి
  rationale: ఈ పదబంధం ἔρχομαιతో క్రియావిశేషణార్థంగా వచ్చి, పౌలు రావడం ఇది మూడవ సందర్భమని సూచిస్తుంది. ఆధునిక తెలుగులో ఈ నిర్మాణం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: నేను మీ దగ్గరికి రావడం
  rationale: వర్తమాన రూపం సందర్భంలో సమీప భవిష్యత్తులో జరగనున్న రాకను తెలియజేస్తుంది; ‘రావడం’ ఆ ప్రకటనలోని తక్షణ భావాన్ని నిలుపుతుంది.
- source_word: ἐπὶ στόματος
  choice: నోటి ద్వారా
  rationale: ద్వితీయోపదేశకాండము 19:15లోని న్యాయపరమైన నుడికారాన్ని మూలానికి దగ్గరగా ఉంచుతుంది. దాని భావం సాక్షులు పలికే సాక్ష్యం ద్వారా అని పాదసూచిక వివరిస్తుంది.
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: ఇద్దరు సాక్షుల ... లేదా ముగ్గురు సాక్షుల
  rationale: గ్రీకు వాక్యంలోని καί ఇక్కడ సంప్రదాయబద్ధమైన ‘ఇద్దరు లేదా ముగ్గురు’ అనే పంపిణీ భావాన్ని కలిగి ఉంది; మొత్తం ఐదుగురు అనే అపార్థాన్ని నివారించేందుకు తెలుగులో ‘లేదా’ వాడబడింది.
- source_word: σταθήσεται
  choice: స్థిరపరచబడుతుంది
  rationale: న్యాయపరమైన సందర్భంలో ఈ భవిష్యత్ కర్మణి రూపం ఒక విషయం నిర్ధారించబడటం లేదా చెల్లుబాటుగా స్థాపించబడటాన్ని సూచిస్తుంది.
- source_word: πᾶν ῥῆμα
  choice: ప్రతి విషయం
  rationale: ῥῆμα అక్షరార్థంగా ‘మాట’ కావచ్చు; అయితే ఈ న్యాయపరమైన ఉల్లేఖనంలో విచారణకు సంబంధించిన విషయం అనే విస్తృత భావం ఉంది. ‘ప్రతి విషయం’ ఆ భావాన్ని సంకుచితం చేయకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: పౌలు తన క్రమశిక్షణాత్మక సందర్భంలో ద్వితీయోపదేశకాండములోని న్యాయసూత్రాన్ని ఉపయోగించడం
  choice: ఉల్లేఖనాన్ని ఏ విషయమైనా సాక్షుల ఆధారంగా స్థిరపరచబడుతుందనే విస్తృత న్యాయపరమైన భావంతో అనువదించడం
  alternative: πᾶν ῥῆμαను ‘ప్రతి మాట’ అని అక్షరార్థంగా లేదా ‘ప్రతి ఆరోపణ’ అని మరింత సంకుచితంగా అనువదించడం
  rationale: మూల గ్రీకు సంఘ క్రమశిక్షణకు మాత్రమే వర్తించేలా భావాన్ని పరిమితం చేయదు. అందువల్ల విస్తృత న్యాయసూత్రాన్ని నిలుపుతూ, సాధ్యమైన అక్షరార్థాన్ని పాదసూచికలో పొందుపరచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ప్రధాన పాఠంలో న్యాయపరమైన భావం స్పష్టంగా ఉండేలా ‘ప్రతి విషయం’ ఎంచుకోబడింది; మూలంలోని ‘నోరు/మాట’ పదబంధాన్ని పాఠంలో కొంతవరకు నిలిపి, దాని మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఇచ్చాం.
