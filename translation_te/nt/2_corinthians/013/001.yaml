    rationale: తప్పు కాదు; కానీ ‘మీ దగ్గరకు’ ఈ వాక్యనిర్మాణంలో కొద్దిగా సహజమైన ఆధునిక ప్రామాణిక రూపం.
  - severity: low
    issue: పాదసూచిక aలో ‘నోటిమీద’
    rationale: ఈ సందర్భంలో ‘నోటిమీద’ సహజమైన తెలుగు న్యాయప్రయోగం కాదు. అక్షరానువాద ప్రత్యామ్నాయంలో కూడా ‘సాక్షుల నోటి ద్వారా’ అనడం స్పష్టంగా ఉంటుంది.
