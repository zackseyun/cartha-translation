review_pass:
  verdict: revise
  source_fidelity: The draft conveys the causal purpose, the absent/present contrast, the Lord-given authority, and the building-versus-tearing-down metaphor. However, it repeats “రాస్తున్నాను” in a way that weakens the Greek purpose construction, and “అధికారంతో” does not fully express κατά (‘in accordance with’).
  naturalness: The wording is generally modern and clear, but the three-sentence arrangement produces an unnecessary repetition and makes the second sentence sound as though Paul writes a second time. A single purpose construction is more natural Telugu.
  terminology: “ప్రభువు,” “అధికారం,” and the construction metaphor are appropriate. “నిర్మించడానికే గాని కూల్చివేయడానికే కాదు” preserves the paired imagery more idiomatically than “కట్టడానికే గాని కూల్చివేయడానికి కాదు.”
  issues:
  - severity: medium
    issue: The main text repeats “ఇలా రాస్తున్నాను” after already stating “ఈ సంగతులు రాస్తున్నాను.”
    rationale: 'γράϕω occurs once, governed by ἵνα as a purpose clause: Paul writes while absent in order not to need severe action when present. Repeating the verb is not required in Telugu and obscures that relationship.'
  - severity: low
    issue: “అధికారంతో” is less precise than the Greek κατά phrase.
    rationale: κατὰ τὴν ἐξουσίαν indicates action in accordance with the authority granted by the Lord; “అధికారానికి అనుగుణంగా” makes this relationship explicit without adding meaning.
  - severity: low
    issue: The building metaphor can be expressed more smoothly and symmetrically.
    rationale: “నిర్మించడానికే గాని కూల్చివేయడానికే కాదు” retains both the purpose sense and the deliberate Greek contrast.
  revised_text: ఈ కారణంగానే, నేను దూరంగా ఉన్నప్పుడు ఈ సంగతులు రాస్తున్నాను; నేను సమక్షంలో ఉన్నప్పుడు ప్రభువు నాకు ఇచ్చిన అధికారానికి అనుగుణంగా కఠినంగా వ్యవహరించాల్సి రాకుండేలా[a]. ఆ అధికారం నిర్మించడానికే గాని కూల్చివేయడానికే కాదు[b].
