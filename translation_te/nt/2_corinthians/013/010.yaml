revisions:
- from: అందుకే, నేను మీకు దూరంగా ఉన్నప్పుడే ఈ సంగతులు రాస్తున్నాను. నేను వచ్చినప్పుడు, ప్రభువు నాకు ఇచ్చిన అధికారంతో కఠినంగా వ్యవహరించాల్సి రాకుండా[a] ఇలా రాస్తున్నాను. ఆ అధికారం కట్టడానికే గాని కూల్చివేయడానికి కాదు[b].
  to: ఈ కారణంగానే, నేను దూరంగా ఉన్నప్పుడు ఈ సంగతులు రాస్తున్నాను; నేను సమక్షంలో ఉన్నప్పుడు ప్రభువు నాకు ఇచ్చిన అధికారానికి అనుగుణంగా కఠినంగా వ్యవహరించాల్సి రాకుండేలా[a]. ఆ అధికారం నిర్మించడానికే గాని కూల్చివేయడానికే కాదు[b].
  rationale: The revision retains the Greek causal connector, plural ‘these things,’ and the temporal contrast between absence and presence. It expresses the ἵνα purpose without duplicating ‘write,’ renders κατά more accurately as conformity to the entrusted authority, and preserves the οἰκοδομή/καθαίρεσις construction contrast. Footnote anchors remain attached to the clauses they explain.
