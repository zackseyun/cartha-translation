id: 2CO.13.10
reference: 2 Corinthians 13:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: te
  text: ఈ కారణంగానే, నేను దూరంగా ఉన్నప్పుడు ఈ సంగతులు రాస్తున్నాను; నేను సమక్షంలో ఉన్నప్పుడు ప్రభువు నాకు ఇచ్చిన అధికారానికి అనుగుణంగా కఠినంగా వ్యవహరించాల్సి రాకుండేలా[a]. ఆ అధికారం నిర్మించడానికే గాని కూల్చివేయడానికే కాదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తీవ్రత చూపాల్సి రాకుండేలా’ లేదా ‘కఠినంగా ఎదుర్కోవాల్సి రాకుండేలా.’
    reason: lexical_alternative
  - marker: b
    text: 'లేదా, ‘బలపరచడానికే గాని నాశనం చేయడానికే కాదు.’ గ్రీకులో నిర్మాణ రూపకం ఉంది: ‘నిర్మించడం—కూల్చివేయడం.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందుకే
  rationale: ముందటి సందర్భంతో ఉన్న కారణ–ఫలిత సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ταῦτα
  choice: ఈ సంగతులు
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, పౌలు రాస్తున్న విషయాలు లేదా హెచ్చరికలను సహజంగా సూచిస్తుంది.
- source_word: ἀπὼν γράφω
  choice: నేను మీకు దూరంగా ఉన్నప్పుడే … రాస్తున్నాను
  rationale: ἀπών అనే భాగధాతువు తెలిపే కాలసంబంధ భావాన్ని παρώνతో ఉన్న వ్యత్యాసంతో సహా స్పష్టంగా వ్యక్తపరుస్తుంది; ‘మీకు’ అనేది సందర్భానుసారంగా స్పష్టీకరించిన పదం.
- source_word: ἵνα παρὼν
  choice: నేను వచ్చినప్పుడు … రాకుండా
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని, παρών తెలిపే ప్రత్యక్ష సమక్షాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో అందిస్తుంది.
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: కఠినంగా వ్యవహరించాల్సి రాకుండా
  rationale: ἀποτόμωςలోని తీవ్రత లేదా కఠినత భావాన్నీ, χράομαιలోని వ్యవహరించడం/ప్రయోగించడం భావాన్నీ అందిస్తుంది. ‘చేయాల్సి రావడం’ సందర్భంలో పౌలు నివారించాలని కోరుతున్న అనిష్ట అవసరాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κατὰ τὴν ἐξουσίαν
  choice: అధికారంతో
  rationale: పౌలు తనకు అప్పగించబడిన అధికారాన్ని ఆధారంగా చేసుకొని లేదా దాన్ని ప్రయోగించి వ్యవహరించే భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὁ κύριος ἔδωκέν μοι
  choice: ప్రభువు నాకు ఇచ్చిన
  rationale: కర్త, గ్రహీత, ఇవ్వబడిన అధికారాన్ని నేరుగా నిలుపుతుంది; κύριοςను సాధారణ గౌరవబిరుదైన ‘ప్రభువు’గా అనువదిస్తుంది.
- source_word: εἰς οἰκοδομὴν
  choice: కట్టడానికే
  rationale: οἰκοδομήలోని నిర్మాణ రూపకాన్ని నిలుపుతుంది; ‘కే’ దాని సానుకూల ఉద్దేశాన్ని వ్యతిరేక పదబంధంతో స్పష్టంగా జతచేస్తుంది.
- source_word: οὐκ εἰς καθαίρεσιν
  choice: కూల్చివేయడానికి కాదు
  rationale: καθαίρεσιςలోని పడగొట్టడం లేదా కూల్చడం భావాన్ని నిలుపుతూ, ‘కట్టడం’తో ఉన్న నిర్మాణ రూపక వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: అధికారాన్ని ఇచ్చిన ‘ప్రభువు’ ఎవరు అనే నిర్దిష్ట గుర్తింపు
  choice: గ్రీకులో ఉన్నట్లే ‘ప్రభువు’ అని మాత్రమే అనువదించడం
  alternative: ప్రత్యేకంగా ‘ప్రభువైన యేసు’ అని స్పష్టీకరించడం లేదా విస్తృత దైవసూచనగా అర్థం చేయడం
  rationale: ఈ వచనంలో ὁ κύριος అనే బిరుదు మాత్రమే ఉంది. మూలపాఠం చెప్పినదానికంటే ఎక్కువ నిర్దిష్టమైన సిద్ధాంత గుర్తింపును అనువాదం చేర్చదు.
- issue: అధికారం యొక్క ఉద్దేశంలో నిర్మాణ రూపకం
  choice: ‘కట్టడానికే గాని కూల్చివేయడానికి కాదు’ అనే రూపకాన్ని ప్రధాన పాఠంలో నిలుపడం
  alternative: ‘అభివృద్ధి చేయడానికి గాని నాశనం చేయడానికి కాదు’ అని రూపకార్థాన్ని నేరుగా చెప్పడం
  rationale: పౌలు ఉపయోగించిన నిర్మాణ–కూల్చివేత వ్యత్యాసాన్ని నిలుపుతూ, దాని భావార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి వాడబడింది. గ్రీకు వాక్యంలోని దీర్ఘ నిర్మాణాన్ని తెలుగులో మూడు వాక్యాలుగా విభజించి సంబంధాన్ని స్పష్టంగా ఉంచాం. ప్రధాన పాఠంలో నిర్మాణ రూపకాన్ని కాపాడి, దాని భావార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
