  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: te
  text: ఎందుకంటే ఆయన బలహీనతలో సిలువవేయబడ్డాడు[a]; అయినా దేవుని శక్తివల్ల జీవిస్తున్నాడు. ఎందుకంటే మేము కూడా ఆయనలో బలహీనులమే; అయినా దేవుని శక్తివల్ల ఆయనతో కలిసి మీ పట్ల జీవిస్తాము[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “బలహీనత నుండి.” గ్రీకు ἐξ మూలాన్ని లేదా ఆధారాన్ని సూచించగలదు; ఈ సందర్భంలో “బలహీనతలో” అని కూడా సహజంగా అర్థమవుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “ఆయనతో కలిసి జీవిస్తాము” అనేది కొరింథీయుల విషయంలో క్రీస్తు ఇచ్చే శక్తితో పౌలు కనబరచబోయే జీవితాన్ని సూచించవచ్చు; అంతేకాక, ఇది విస్తృతమైన పునరుత్థాన జీవ భావాన్ని కూడా ప్రతిధ్వనింపజేయవచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా, “మీ కోసం” / “మీ మధ్య.” గ్రీకు εἰς ὑμᾶς దిశను, సంబంధాన్ని లేదా ప్రభావాన్ని సూచించగల సంక్షిప్త ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσταυρώθη
  choice: సిలువవేయబడ్డాడు
  rationale: σταυρόω యొక్క భూతకాల కర్మణి రూపాన్ని స్పష్టంగా, ప్రామాణికంగా వ్యక్తపరుస్తుంది.
- source_word: ἐξ ἀσθενείας
  choice: బలహీనతలో
  rationale: ἐξ మూలం లేదా ఆధారాన్ని సూచించగలిగినా, ఇక్కడ సిలువ మరణం జరిగిన బలహీన స్థితి లేదా పరిధిని సహజమైన తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: ζῇ
  choice: జీవిస్తున్నాడు
  rationale: వర్తమానకాల క్రియ యొక్క కొనసాగుతున్న భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐκ δυνάμεως θεοῦ
  choice: దేవుని శక్తివల్ల
  rationale: దేవుని శక్తిని జీవానికి ఆధారం మరియు కార్యసాధక శక్తిగా చూపుతుంది; ἐκ యొక్క మూలభావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἀσθενοῦμεν
  choice: బలహీనులమే
  rationale: మొదటి వాక్యభాగంలోని ἀσθένειαతో పదసంబంధాన్ని నిలుపుతూ, గ్రీకు వర్తమాన భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: క్రీస్తుతో ఐక్యతను సూచించే పౌలు సంక్షిప్త భాషను వివరణతో పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: ζήσομεν
  choice: జీవిస్తాము
  rationale: గ్రీకులోని భవిష్యత్ కాలాన్ని నిలుపుతుంది; ఇది ప్రస్తుత అపొస్తల సేవలో కనబడబోయే శక్తినో, విస్తృత పునరుత్థాన జీవాన్నో ఒక్కదానికే పరిమితం చేయదు.
- source_word: σὺν αὐτῷ
  choice: ఆయనతో కలిసి
  rationale: సహవాసం మరియు పాలుపంచుకోవడం అనే σύν భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: εἰς ὑμᾶς
  choice: మీ పట్ల
  rationale: కొరింథీయులకు సంబంధించిన దిశ, సంబంధం లేదా ప్రభావం అనే సంక్షిప్త గ్రీకు భావాన్ని అతివ్యాఖ్యానం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: సిలువలో క్రీస్తు ‘బలహీనత’ అర్థం
  choice: ఆయన బలహీనతలో సిలువవేయబడ్డాడని పాఠ్యంలోని విరోధాభాసాన్ని యథాతథంగా ఉంచాం.
  alternative: మనుషుల దృష్టికి మాత్రమే ఆయన బలహీనుడిగా కనిపించాడని వివరణాత్మకంగా అనువదించడం.
  rationale: వాక్యం బలహీనతలో సిలువ మరణాన్ని దేవుని శక్తివల్ల జీవించడంతో ఎదురెదురుగా ఉంచుతుంది. అనువాదం క్రీస్తు స్వరూపం గురించి పాఠ్యంలో లేని నిర్ణయాన్ని చేర్చదు.
- issue: ‘ఆయనతో కలిసి జీవిస్తాము’ అనే మాటకు సూచన
  choice: భవిష్యత్తులో కొరింథీయుల పట్ల కనబడే దేవశక్తితో కూడిన అపొస్తల జీవితం మరియు విస్తృత పునరుత్థాన జీవితం—రెండింటికీ అవకాశం ఉండేలా ఉంచాం.
  alternative: దీనిని అంతిమ పునరుత్థానానికి మాత్రమే లేదా ప్రస్తుత అపొస్తల సేవకు మాత్రమే పరిమితం చేయడం.
  rationale: సమీప సందర్భంలోని ‘మీ పట్ల’ అపొస్తల సేవను సూచిస్తుండగా, ‘ఆయనతో కలిసి’ అనే భాష విస్తృత పునరుత్థాన జీవాన్ని కూడా ప్రతిధ్వనింపజేయగలదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతతో కూడిన సహజ శైలి వాడబడింది. ‘అయినా’ ద్వారా బలహీనత–దేవుని శక్తి మధ్య ఉన్న ఉద్దేశపూర్వక వ్యత్యాసం నిలుపబడింది; ‘ఆయనలో’ మరియు ‘మీ పట్ల’ వంటి పౌలు సంక్షిప్త ప్రయోగాలను అతిగా విప్పలేదు.
