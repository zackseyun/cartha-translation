  terminology: ‘సిలువవేయబడ్డాడు,’ ‘బలహీనతలో,’ ‘దేవుని శక్తివల్ల,’ ‘ఆయనలో,’ and ‘ఆయనతో కలిసి’ are suitable standard Telugu renderings. The footnotes preserve relevant lexical and interpretive latitude without imposing a doctrinal conclusion.
