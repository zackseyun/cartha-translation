  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χαίρομεν γὰρ ὅταν ἡμεῖς ἀσθενῶμεν, ὑμεῖς δὲ δυνατοὶ ἦτε· ⸀τοῦτο καὶ εὐχόμεθα, τὴν ὑμῶν κατάρτισιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: te
  text: ఎందుకంటే మేము బలహీనులమై, మీరు బలంగా ఉన్నప్పుడు మేము సంతోషిస్తాము. మీరు సక్రమ స్థితికి పునరుద్ధరించబడాలని కూడా మేము ప్రార్థిస్తున్నాము.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీరు పరిపక్వులు కావడం,” లేదా “మీరు సంపూర్ణ స్థితికి తీసుకురాబడడం.” గ్రీకు పదం పునరుద్ధరించడం, సన్నద్ధపరచడం, లేదా దేనినైనా తగిన స్థితికి తీసుకురావడం అనే భావాలను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: మేము సంతోషిస్తాము
  rationale: వర్తమాన కాలంలోని ఆనందభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం ‘సంతోషంగా ఉన్నాము’ కంటే క్రియాశీల భావాన్ని నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న సందర్భానికి ఈ వాక్యం వివరణగా అనుసంధానమవుతున్నదని స్పష్టంగా చూపుతుంది.
- source_word: ὅταν
  choice: ఉన్నప్పుడు
  rationale: ఉపవాక్యంలోని సాధారణ కాలసంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘ఎప్పుడెప్పుడైతే’ అని భారంగా చేయదు.
- source_word: ἀσθενῶμεν
  choice: మేము బలహీనంగా ఉండి
  rationale: శారీరక, సామాజిక లేదా వ్యక్తమయ్యే బలహీనతలో ఏదో ఒకదానికే అర్థాన్ని పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: δυνατοὶ ἦτε
  choice: మీరు బలంగా ఉన్నప్పుడు
  rationale: ‘బలహీనంగా’ అనే పదానికి సహజమైన వ్యతిరేకతను నిలిపి, ‘శక్తిమంతులు’ అనే అతిశయార్థాన్ని నివారిస్తుంది.
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: ఇదే మేము ప్రార్థించేది కూడా
  rationale: τοῦτο మీదున్న ఉద్ఘాటనను ‘ఇదే’ ద్వారా, καί భావాన్ని ‘కూడా’ ద్వారా సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: κατάρτισιν
  choice: మీరు సరిచేయబడి తగిన స్థితికి రావడం
  rationale: ఈ పదంలోని పునరుద్ధరణ, సన్నద్ధపరచడం, తగిన సంపూర్ణ స్థితికి తీసుకురావడం అనే భావపరిధిని సందర్భానుగుణంగా వ్యక్తం చేస్తుంది; ఒకే సాంకేతిక సిద్ధాంతార్థానికి పరిమితం చేయదు.
theological_decisions:
- issue: పౌలు కోరుతున్న κατάρτισις యొక్క కాపరి సంబంధమైన భావం
  choice: మీరు సరిచేయబడి తగిన స్థితికి రావడం
  alternative: మీరు పరిపక్వులు కావడం; మీరు సంపూర్ణ స్థితికి తీసుకురాబడడం
  rationale: కొరింథీయులు సరిగా నిలబడాలనే పౌలు ఆశను ఇది ప్రధానంగా తెలియజేస్తుంది. అదే సమయంలో, ఈ గ్రీకు పదానికి సాధ్యమైన పరిపక్వత లేదా సంపూర్ణత భావాలను పాదటిప్పణిలో ఉంచి మూలంలోని అర్థవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘బలహీనంగా/బలంగా’ అనే ప్రత్యక్ష వ్యతిరేకతను నిలిపి, κατάρτισις యొక్క ఉద్దేశపూర్వక అర్థవిస్తృతిని ప్రధాన పాఠ్యం మరియు పాదటిప్పణి ద్వారా సంరక్షించాం.
