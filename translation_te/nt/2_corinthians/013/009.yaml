revisions:
- from: ఎందుకంటే మేము బలహీనంగా ఉండి, మీరు బలంగా ఉన్నప్పుడు మేము సంతోషిస్తాము. మీరు సరిచేయబడి తగిన స్థితికి రావాలనేదే[a] మేము ప్రార్థించేది కూడా.
  to: ఎందుకంటే మేము బలహీనులమై, మీరు బలంగా ఉన్నప్పుడు మేము సంతోషిస్తాము. మీరు సక్రమ స్థితికి పునరుద్ధరించబడాలని కూడా మేము ప్రార్థిస్తున్నాము.[a]
  rationale: The revision regularizes the shared temporal contrast, improves idiomatic Telugu syntax, and renders κατάρτισις as restoration to a proper condition. The lexical alternatives remain available in the anchored footnote, preserving the source term's semantic breadth.
