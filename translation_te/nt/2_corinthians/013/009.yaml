review_pass:
  verdict: revise
  source_fidelity: The draft conveys the central contrast of Paul's apparent weakness and the Corinthians' strength, and it correctly takes κατάρτισις as their being brought into a proper condition. However, the first temporal clause is grammatically uneven ("మేము బలహీనంగా ఉండి, మీరు బలంగా ఉన్నప్పుడు"), since the first member is participial while the second is temporal. The revision makes the shared temporal relation clear. The revised δεύτερη sentence renders the noun κατάρτισιν more directly as restoration to a proper condition, without narrowing it to a particular kind of correction.
  naturalness: The current wording is mostly understandable, but "రావాలనేదే మేము ప్రార్థించేది కూడా" is heavy and less idiomatic than a finite prayer clause. The revision uses natural modern standard Telugu while retaining the formal, pastoral register.
  terminology: '"బలహీనులమై / బలంగా" retains the intended contrast without specifying physical, social, or rhetorical weakness. "సక్రమ స్థితికి పునరుద్ధరించబడాలని" represents the restorative sense of κατάρτισις; the footnote retains the viable senses of maturity, completeness, and equipping.'
  issues:
  - severity: medium
    issue: Uneven syntax in the temporal contrast
    rationale: The draft combines "మేము బలహీనంగా ఉండి" with "మీరు బలంగా ఉన్నప్పుడు," which does not naturally express the Greek's single ὅταν clause governing both conditions. Parallel phrasing better preserves the relationship.
  - severity: low
    issue: Cumbersome rendering of the prayer clause
    rationale: '"మీరు సరిచేయబడి తగిన స్థితికి రావాలనేదే మేము ప్రార్థించేది కూడా" is intelligible but overly periphrastic. A direct finite clause is more natural and preserves the prayer''s object.'
  revised_text: ఎందుకంటే మేము బలహీనులమై, మీరు బలంగా ఉన్నప్పుడు మేము సంతోషిస్తాము. మీరు సక్రమ స్థితికి పునరుద్ధరించబడాలని కూడా మేము ప్రార్థిస్తున్నాము.[a]
