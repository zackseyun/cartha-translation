id: 2CO.13.3
reference: 2 Corinthians 13:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπεὶ δοκιμὴν ζητεῖτε τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ· ὃς εἰς ὑμᾶς οὐκ ἀσθενεῖ ἀλλὰ δυνατεῖ ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/003.yaml
  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: te
  text: ఎందుకంటే, మెస్సీయ నాలో మాట్లాడుతున్నాడనడానికి రుజువు మీరు కోరుతున్నారు; ఆయన మీ పట్ల బలహీనుడు కాడు, కానీ మీలో శక్తివంతుడిగా ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మీలో” అని అనువదించిన మాటను “మీ మధ్య” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: ఎందుకంటే
  rationale: సందర్భంలో పౌలు కఠినంగా వ్యవహరించబోవడానికి కారణాన్ని పరిచయం చేస్తుంది; కారణార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δοκιμὴν ζητεῖτε
  choice: రుజువు మీరు వెదుకుతున్నారు
  rationale: δοκιμή ఇక్కడ పరీక్షా ప్రక్రియకన్నా నిజత్వాన్ని నిర్ధారించే రుజువును సూచిస్తుంది; వర్తమాన క్రియ కొనసాగుతున్న డిమాండును తెలియజేస్తుంది.
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: నాలో మాట్లాడుతున్న మెస్సీయకు
  rationale: గ్రీకు షష్ఠీ విభక్తి నిర్మాణాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ἐν ἐμοί అనే ‘నాలో’ రూపాన్ని వ్యాఖ్యానాత్మకమైన ‘నా ద్వారా’గా మార్చలేదు.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తుంది; అభిషిక్త రాజు అనే బిరుదు భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది.
- source_word: εἰς ὑμᾶς οὐκ ἀσθενεῖ
  choice: ఆయన మీ పట్ల బలహీనుడు కాడు
  rationale: εἰς ὑμᾶς యొక్క సంబంధ/దిశ భావాన్ని ‘మీ పట్ల’ నిలుపుతూ, ἀσθενεῖ–δυνατεῖ మధ్య బలహీనత/శక్తి వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ἀλλὰ δυνατεῖ ἐν ὑμῖν
  choice: మీలో శక్తిమంతుడై ఉన్నాడు
  rationale: అరుదైన δυνατέω క్రియలోని శక్తి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ἐν ὑμῖνను నేరుగా ‘మీలో’గా ఉంచి వ్యక్తిగత లేదా సమూహార్థాన్ని ముందుగానే నిర్ణయించదు.
theological_decisions:
- issue: Χριστοῦ యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వాక్యంలో పదం బిరుదు భావంతో ఉందని గ్రహించి ‘మెస్సీయ’గా అనువదించాం; అయితే పౌలు రచనల్లో పేరు వలె వినిపించే ‘క్రీస్తు’ కూడా సాధ్యమైన సంప్రదాయ రూపం.
- issue: ἐν ἐμοί యొక్క భావం
  choice: నాలో మాట్లాడుతున్న
  alternative: నా ద్వారా మాట్లాడుతున్న
  rationale: మూలంలోని ἐν (‘లో’)ను నేరుగా నిలిపి, మెస్సీయ పౌలులో ఉండి మాట్లాడుతున్నాడా లేక పౌలు ద్వారా మాట్లాడుతున్నాడా అనే భావసూక్ష్మతను ప్రధాన పాఠంలో పరిష్కరించలేదు.
- issue: ἐν ὑμῖν యొక్క పరిధి
  choice: మీలో
  alternative: మీ మధ్య
  rationale: ‘మీలో’ మూలానికి దగ్గరగా ఉండి, సంఘ సభ్యుల అంతరంగంలోనో వారి సమూహం మధ్యనో పనిచేసే శక్తి అనే రెండు సాధ్య భావాలకు చోటిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని బలహీనత–శక్తి వ్యత్యాసాన్ని స్పష్టంగా ఉంచి, ‘నాలో/నా ద్వారా’ మరియు ‘మీలో/మీ మధ్య’ అనే సందిగ్ధతలను అనవసరంగా పరిష్కరించలేదు.
