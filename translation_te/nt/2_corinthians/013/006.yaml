  yaml_path: translation/nt/2_corinthians/013/006.yaml
  text: But I hope that you will know that we are not disqualified[a].
translation:
  language: te
  text: అయితే, మేము పరీక్షలో అనర్హులము కాదు[a] అని మీరు తెలుసుకుంటారని నేను ఆశిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆమోదయోగ్యులము కాదు” లేదా “పరీక్షలో విఫలమైనవారము కాదు.” గ్రీకు విశేషణం పరీక్షించబడిన తర్వాత ఆమోదయోగ్యంగా నిలవకపోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: నేను ఆశిస్తున్నాను
  rationale: వర్తమాన కాలంలోని ప్రథమ పురుష ఏకవచన క్రియను సహజమైన ఆధునిక తెలుగులో ఇలా అనువదించడం సముచితం; ఇది పౌలు ముందుచూపుతో వ్యక్తం చేస్తున్న నిరీక్షణను నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాక్యంలోని పరీక్షలో అనర్హుడిగా తేలే అవకాశంతో ఉన్న స్వల్ప వ్యత్యాసాన్ని, అలాగే భావమార్పును సహజంగా సూచిస్తుంది.
- source_word: γνώσεσθε
  choice: మీరు తెలుసుకుంటారు
  rationale: భవిష్యత్ కాలంలోని ఈ క్రియ కొరింథీయులు తరువాత గ్రహించబోయే విషయాన్ని సూచిస్తుంది; ప్రక్రియను అతిగా నొక్కకుండా నేరుగా అర్థాన్ని అందిస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: విషయార్థక ఉపవాక్యాన్ని తెలుగులో సహజంగా పరిచయం చేస్తుంది.
- source_word: ἡμεῖς
  choice: మేము
  rationale: పౌలు తనతో పాటు తన సహచరులను సూచించే స్పష్టమైన బహువచన సర్వనామాన్ని నిలుపుతుంది.
- source_word: οὐκ ἐσμὲν
  choice: కాదు
  rationale: మూలంలోని సాధారణ నిషేధాన్ని అదనపు తీవ్రత చేర్చకుండా తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἀδόκιμοι
  choice: పరీక్షలో అనర్హులు
  rationale: సమీప సందర్భంలోని పరీక్షించుకోవడం, ఆమోదయోగ్యంగా తేలడం అనే భావక్షేత్రాన్ని స్పష్టంగా నిలుపుతుంది. కేవలం ‘అనర్హులు’ కంటే పరీక్షా నేపథ్యాన్ని తెలియజేస్తూ, సిద్ధాంతపరంగా భారమైన పదాన్ని నివారిస్తుంది.
theological_decisions:
- issue: పరీక్ష మరియు అపొస్తల అధికార ప్రామాణికత సందర్భంలో ἀδόκιμοι అనువాదం
  choice: పరీక్షలో అనర్హులం కాదు
  alternative: ఆమోదం పొందనివారము కాదు; పరీక్షలో విఫలమైనవారము కాదు
  rationale: ఈ సందర్భం పౌలు మరియు అతని సహచరులు పరిశీలనలో ఆమోదయోగ్యులుగా నిలుస్తారా అనే విషయానికి సంబంధించినది. ఈ అనువాదం మూలంలోని పరీక్షాపరమైన మూల్యాంకన భావాన్ని కాపాడుతూ, ‘భ్రష్టులు’ వంటి తరువాతి సిద్ధాంతార్థాలను దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పరీక్షలో అనర్హులు’ అనే ప్రయోగం ἀδόκιμοι యొక్క మూల్యాంకన భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా చేస్తుంది; అడుగుసూచిక ప్రత్యామ్నాయ అర్థాలను భద్రపరుస్తుంది.
