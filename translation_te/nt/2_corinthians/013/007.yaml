  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: te
  text: మీరు ఏ చెడూ చేయకుండా ఉండాలని[a] మేము దేవునికి ప్రార్థిస్తున్నాం; మేము ఆమోదించబడినవారిగా[b] కనిపించడానికికాదు, మీరు సరైనది చేయాలని—మేము ఆమోదం పొందనివారిలా ఉన్నా సరే[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఏ దుష్కార్యమూ చేయకూడదని.”
    reason: lexical_alternative
  - marker: b
    text: “ఆమోదించబడినవారు” అంటే పరీక్షింపబడి ఆమోదం పొందినవారు లేదా నిజమైనవారిగా రుజువైనవారు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మేము ఆమోదం పొందనివారిలా ఉన్నా సరే”; సందర్భానుసారం, “మేము అనర్హులుగా కనిపించినా సరే” అని కూడా అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐχόμεθα δὲ πρὸς τὸν θεόν
  choice: మేము దేవునికి ప్రార్థిస్తున్నాం
  rationale: εὔχομαι ప్రార్థనను, πρός + accusative ఆ ప్రార్థన దేవుని వైపు ఉద్దేశించబడటాన్ని సూచిస్తున్నాయి. δέను తెలుగులో ప్రత్యేక సంధానపదంతో బలవంతంగా చూపకుండా వాక్యప్రవాహంలో ఉంచడం సహజం.
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: మీరు ఏ చెడూ చేయకూడదని
  rationale: 'μηδέν‌తో కూడిన κακόν బలమైన సంపూర్ణ నిరాకరణను ఇస్తుంది: ‘ఏ చెడూ కాదు.’ ప్రార్థనలోని విషయాన్ని తెలుగులో ‘చేయకూడదని’ సహజంగా వ్యక్తం చేస్తుంది.'
- source_word: οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν
  choice: మేము పరీక్షలో నిలిచినవారిగా కనిపించాలని కాదు
  rationale: δόκιμοιలో పరీక్షింపబడి ఆమోదించబడిన భావం ఉంది; φανῶμεν కనిపించడం లేదా అలా వెల్లడికావడాన్ని సూచిస్తుంది. ఈ అనువాదం బహిరంగ నిరూపణ భావాన్నీ, తరువాతి ἀδόκιμοιతో వ్యతిరేకతనూ నిలుపుతుంది.
- source_word: ἵνα ὑμεῖς τὸ καλὸν ποιῆτε
  choice: మీరు మంచిదే చేయాలని
  rationale: τὸ καλόν ఇక్కడ నైతికంగా మంచి లేదా సరైన దానిని సూచిస్తుంది. ‘మంచిదే’ అనే రూపం వ్యతిరేకతను సహజమైన ఆధునిక తెలుగులో బలపరుస్తుంది.
- source_word: ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν
  choice: మేము పరీక్షలో నిలవనివారిలా ఉన్నా సరే
  rationale: ἀδόκιμοι అనేది δόκιμοιకి వ్యతిరేక పదం; పరీక్షలో నిలవకపోవడం లేదా ఆమోదం పొందకపోవడం అనే భావం ఇస్తుంది. ὡς‌ను ‘వారిలా’ అని చూపి, ఇది తుది ఆధ్యాత్మిక తీర్పే అని నిర్ణయించకుండా అసలు వాక్యంలోని భావసందిగ్ధతను కాపాడింది.
theological_decisions:
- issue: ὡς ἀδόκιμοιలో పౌలు తనను వర్ణించుకున్న భావం
  choice: ‘పరీక్షలో నిలవనివారిలా ఉన్నా సరే’ అని అనువదించి, ఇతరుల దృష్టిలో అపొస్తలిక పరీక్షలో విఫలమైనట్టుగా కనిపించడం లేదా అలా పరిగణించబడటం అనే అవకాశాన్ని తెరిచి ఉంచడం
  alternative: ‘అయోగ్యులుగా ఉన్నా సరే’ లేదా ‘అనర్హులుగా కనిపించినా సరే’
  rationale: సమీప సందర్భంలో δόκιμοι–ἀδόκιμοι పదజంట పరీక్ష, నిరూపణ, ఆమోదం అనే భావక్షేత్రంలో ఉంది. దీనిని తుది నాశనం లేదా శాశ్వత తిరస్కారం అనే సిద్ధాంతార్థంగా నిర్ణయించడం వాక్యం చెప్పేదానికంటే ఎక్కువ అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. δόκιμοι/ἀδόκιμοι మధ్య ఉన్న ఒకే పరీక్ష-ఆమోద పదక్షేత్రాన్ని ‘పరీక్షలో నిలిచినవారు/నిలవనివారు’ అనే జంటతో స్పష్టంగా కాపాడింది. మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ చేర్చలేదు.
