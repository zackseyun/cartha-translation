revisions:
- from: 'మీరు విశ్వాసంలో ఉన్నారో లేదో మిమ్మల్ని మీరే పరీక్షించుకోండి[c]; మిమ్మల్ని మీరే పరిశీలించుకోండి. యేసు మెస్సీయ[a] మీలో[b] ఉన్నాడని మీరే గుర్తించలేరా?—ఒకవేళ మీరు పరీక్షలో నిలవనివారైతే తప్ప.


