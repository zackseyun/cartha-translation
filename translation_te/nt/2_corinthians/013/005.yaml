id: 2CO.13.5
reference: 2 Corinthians 13:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: te
  text: 'మీరు విశ్వాసంలో[c] ఉన్నారో లేదో మిమ్మల్ని మీరే పరీక్షించుకోండి; మిమ్మల్ని మీరే పరిశీలించుకోండి. లేదా, యేసు మెస్సీయ[a] మీలో[b] ఉన్నాడని మీ గురించే మీకు తెలియదా?—మీరు పరీక్షలో నిలవనివారై ఉంటే తప్ప.


    [a] లేదా, “యేసు క్రీస్తు.”


    [b] లేదా, “మీ మధ్య.”


    [c] “విశ్వాసంలో” అనే మాట క్రైస్తవ విశ్వాసంలో కొనసాగడాన్ని గానీ, నిజమైన విశ్వాసం కలిగి ఉండడాన్ని గానీ సూచించవచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు క్రీస్తు.”
    reason: Χριστόςకు సంప్రదాయ ప్రత్యామ్నాయ రూపం.
  - marker: b
    text: లేదా, “మీ మధ్య.”
    reason: ἐν ὑμῖνకు సాధ్యమైన సామూహిక అర్థం.
  - marker: c
    text: “విశ్వాసంలో” అనే మాట క్రైస్తవ విశ్వాసంలో కొనసాగడాన్ని గానీ, నిజమైన విశ్వాసం కలిగి ఉండడాన్ని గానీ సూచించవచ్చు.
    reason: ἐν τῇ πίστειలోని నిజమైన భావసందిగ్ధతను నిలుపడం.
lexical_decisions:
- source_word: πειράζετε
  choice: పరీక్షించుకోండి
  rationale: ఇక్కడ భావం శోధనకు గురిచేయడం కాదు; తమ నిజస్థితిని తెలుసుకోవడానికి తమను తాము పరీక్షించుకోవడం. ఆజ్ఞార్థక రూపంలోని స్వీయపరీక్ష భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν τῇ πίστει
  choice: విశ్వాసంలో
  rationale: నిర్దిష్టమైన క్రైస్తవ విశ్వాస పరిధిని సూచించే అవకాశాన్ని నిలుపుతుంది; అదే సమయంలో వ్యక్తిగతమైన నిజ విశ్వాసం అనే భావాన్నీ మూసివేయదు.
- source_word: δοκιμάζετε
  choice: పరిశీలించుకోండి
  rationale: πειράζετεతో సమీపార్థకమైనా, నిజమైనదో ఆమోదయోగ్యమైనదో తేల్చేందుకు జాగ్రత్తగా పరిశీలించే ఛాయను చూపుతుంది.
- source_word: ἐπιγινώσκετε
  choice: గుర్తించలేరా
  rationale: తెలుసుకోవడం మాత్రమే కాక స్పష్టంగా గ్రహించడం లేదా గుర్తించడం అనే బలాన్ని సహజమైన అలంకార ప్రశ్నగా అందిస్తుంది.
- source_word: ἑαυτούς
  choice: మీరే
  rationale: తెలుగులో అసహజమైన ‘మిమ్మల్ని మీరు గుర్తించలేరా’ నిర్మాణాన్ని నివారిస్తూ, స్వీయసంబంధమైన నొక్కిచెప్పే భావాన్ని ‘మీరే’ ద్వారా నిలుపుతుంది.
- source_word: Ἰησοῦς Χριστός
  choice: యేసు మెస్సీయ
  rationale: Χριστόςను ఇక్కడ బిరుదుగా గ్రహించి దాని అర్థాన్ని వ్యక్తం చేస్తుంది; సంప్రదాయ ‘యేసు క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: స్వీయపరిశీలన సందర్భంలో క్రీస్తు వారిలో ఉండడమే ప్రధాన భావం; సమూహార్థమైన ‘మీ మధ్య’ను పాదసూచికలో నిలుపుతుంది.
- source_word: εἰ μήτι
  choice: ఒకవేళ … అయితే తప్ప
  rationale: మినహాయింపును స్వల్పమైన అలంకారాత్మక తీవ్రతతో పరిచయం చేసే గ్రీకు నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀδόκιμοί
  choice: పరీక్షలో నిలవనివారు
  rationale: δοκιμάζετεతో ఉన్న పరీక్ష–ఆమోదం పదసంబంధాన్ని నిలుపుతూ, తరువాతి కాలపు సిద్ధాంతపరమైన భారమున్న పదాలను నివారిస్తుంది.
theological_decisions:
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ ఒప్పుకోలు స్వరూపమైన వాక్యంలో పదం బిరుదుగా పనిచేస్తుంది. అర్థాన్ని స్పష్టం చేయడానికి ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో ఉంచి, పరిచితమైన రూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ἐν τῇ πίστει భావం
  choice: విశ్వాసంలో
  alternative: నిజమైన వ్యక్తిగత విశ్వాసం కలిగి ఉండడం
  rationale: ఈ పదబంధం క్రైస్తవ విశ్వాస పరిధిలో కొనసాగడాన్ని గానీ, నిజ విశ్వాసం కలిగి ఉండడాన్ని గానీ సూచించవచ్చు. ప్రధాన పాఠ్యం ఈ ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది; పాదసూచిక రెండు అవకాశాలను తెలియజేస్తుంది.
- issue: ἐν ὑμῖν భావం
  choice: మీలో
  alternative: మీ మధ్య
  rationale: తమను తాము పరీక్షించుకోవాలనే తక్షణ సందర్భం అంతర్గత ఉనికిని బలపరుస్తుంది; అయితే గ్రీకు బహువచన నిర్మాణంలోని సామూహిక అవకాశాన్ని పాదసూచికలో ఉంచాం.
- issue: ἀδόκιμοί యొక్క సిద్ధాంతపరమైన భావం
  choice: పరీక్షలో నిలవనివారు
  alternative: అయోగ్యులు / తిరస్కరించబడినవారు
  rationale: దైవిక నిరాకరణ లేదా శాశ్వత స్థితి గురించి పాఠ్యం చెప్పినదానికంటే ఎక్కువగా నిర్ణయించకుండా, పరీక్షలో ఆమోదం పొందకపోవడం అనే సందర్భార్థాన్ని మాత్రమే వ్యక్తపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధనను ఉపయోగించాం. ‘పరీక్షించుకోండి / పరిశీలించుకోండి’ అనే జంట ద్వారా గ్రీకు సమీపార్థక క్రియల భేదాన్ని సహజంగా ఉంచాం. చివరి వాక్యభాగంలోని అలంకారాత్మక మినహాయింపును డాష్‌తో వేరు చేశాం.
