id: 2CO.13.11
reference: 2 Corinthians 13:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: te
  text: చివరిగా, సహోదరులారా[b], ఆనందించండి[a]. సక్రమ స్థితికి రండి[c], ప్రోత్సాహాన్ని స్వీకరించండి[d], ఒకే విధంగా ఆలోచించండి[e], సమాధానంతో జీవించండి. ప్రేమ, సమాధానాల దేవుడు మీతో ఉంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వీడ్కోలు.’ గ్రీకు పదం ముగింపు అభివాదంగా వాడబడవచ్చు; అయితే ఇక్కడ వరుస ప్రోత్సాహాలలో భాగంగా ‘ఆనందించండి’ అనే అర్థమే ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘సహోదరులు’ అనే సంబోధన సంఘమంతటినీ ఉద్దేశిస్తుంది; అందులో పురుషులు, స్త్రీలు ఇద్దరూ ఉన్నారు.
    reason: cultural_note
  - marker: c
    text: లేదా ‘సంపూర్ణ స్థితికి రండి,’ ‘పునరుద్ధరించబడండి,’ లేదా ‘మిమ్మల్ని మీరు క్రమపరచుకోండి.’
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘ఆదరణ పొందండి’ లేదా ‘ఉపదేశాన్ని స్వీకరించండి.’
    reason: lexical_alternative
  - marker: e
    text: అక్షరార్థంగా ‘అదే విషయాన్ని ఆలోచించండి’; అంటే ‘ఒకే మనసు కలిగి ఉండండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: చివరిగా
  rationale: పత్రిక ముగింపు భాగానికి మారుతున్న సంభాషణ సూచికగా దీనిని సహజమైన ఆధునిక తెలుగులో చూపుతుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు పదంలోని పుంలింగ బహువచన సంబోధనను నిలుపుతూ, పౌలు సంఘమంతటినీ ఉద్దేశిస్తున్న విషయాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: χαίρετε
  choice: ఆనందించండి
  rationale: ఇది వీడ్కోలు పలుకుగా కూడా వాడబడగలిగినా, ఇక్కడ వరుస ఆజ్ఞార్థక ప్రోత్సాహాల మధ్య ఉండడం వల్ల ‘ఆనందించండి’ అనే భావం సందర్భానికి బాగా సరిపోతుంది.
- source_word: καταρτίζεσθε
  choice: సరిదిద్దుకోండి
  rationale: లోపాన్ని సవరించి తగిన స్థితికి రావడం అనే సంఘ పునరుద్ధరణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; పరిపూర్ణత అనే అతిశయార్థాన్ని రుద్దదు.
- source_word: παρακαλεῖσθε
  choice: ప్రోత్సాహాన్ని స్వీకరించండి
  rationale: క్రియారూపంలోని స్వీకరణ భావాన్ని కాపాడుతూ, ఆదరణ లేదా ఉపదేశం అనే విస్తృతార్థానికి పాదసూచికలో చోటిస్తుంది.
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: ఒకే విధంగా ఆలోచించండి
  rationale: ‘అదే విషయాన్ని ఆలోచించండి’ అనే మూల నిర్మాణానికి దగ్గరగా ఉండి, సంఘ ఐక్యతను సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: εἰρηνεύετε
  choice: సమాధానంగా జీవించండి
  rationale: వర్తమాన ఆజ్ఞార్థకం సూచించే నిరంతర, సామూహిక శాంతియుత జీవనాన్ని తెలియజేస్తుంది.
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: ప్రేమకూ సమాధానానికీ దేవుడైనవాడు
  rationale: గ్రీకు సంబంధవాచక నిర్మాణాన్ని ఏకపక్షంగా ‘మూలం’ లేదా ‘లక్షణం’ అని వివరించకుండా, దాని భావసాంద్రతను నిలుపుతుంది.
- source_word: ἔσται μεθ’ ὑμῶν
  choice: మీతో ఉంటాడు
  rationale: సరళమైన భవిష్యత్ వాగ్దానాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: సంఘ సంబోధనలో ἀδελφοί పదానికి ఉన్న సమగ్ర వ్యాప్తి
  choice: ప్రధాన పాఠ్యంలో ‘సహోదరులారా’ అని ఉంచి, అది సంఘంలోని పురుషులు మరియు స్త్రీలు అందరినీ ఉద్దేశిస్తుందని పాదసూచికలో తెలియజేయడం.
  alternative: ‘సహోదర సహోదరీలారా’ అని స్పష్టీకరించడం.
  rationale: మూలంలోని వ్యాకరణ పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో కాపాడుతూ, చారిత్రక సంఘ సందర్భంలోని సమగ్ర సంబోధనను పాదసూచిక ద్వారా స్పష్టం చేస్తుంది.
- issue: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης లోని సంబంధవాచక భావం
  choice: ‘ప్రేమకూ సమాధానానికీ దేవుడైనవాడు’ అని సంబంధాన్ని తెరిచి ఉంచడం.
  alternative: ‘ప్రేమకూ సమాధానానికీ మూలమైన దేవుడు’ లేదా ‘ప్రేమ, సమాధానం గల దేవుడు’.
  rationale: గ్రీకు షష్ఠీ విభక్తి దేవుడు ప్రేమ మరియు సమాధానానికి మూలమని, వాటితో లక్షణీకరించబడినవాడని, లేదా వాటిపై అధికారమున్నవాడని సూచించవచ్చు. ప్రధాన పాఠ్యం ఒకే వివరణను బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. మూలంలోని వరుస ప్రోత్సాహాలను చదవడానికి సులభంగా రెండు వాక్యాలుగా విభజించాం. అతిగా సంస్కృతీకృతమైన లేదా ప్రాచీన క్రైస్తవ పరిభాషను నివారించాం; అదే సమయంలో మూలంలోని ఆజ్ఞార్థక బలం, సామూహిక స్వరం, చివరి వాగ్దానం నిలుపబడ్డాయి.
