id: 2CO.13.2
reference: 2 Corinthians 13:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: te
  text: 'నేను ఇంతకుముందే చెప్పాను; రెండోసారి మీ దగ్గర ఉన్నప్పుడు చెప్పినట్లే, ఇప్పుడు మీకు దూరంగా ఉంటూ ముందుగానే చెబుతున్నాను—మునుపు పాపం చేసినవారికీ, మిగిలిన వారందరికీ చెబుతున్నదేమిటంటే: నేను మళ్లీ వస్తే[a], ఎవరినీ ఉపేక్షించను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భాన్ని మరింత స్పష్టంగా చెబితే, ‘నేను మూడోసారి వస్తే.’ గ్రీకులో అక్షరార్థంగా ‘నేను మళ్లీ వస్తే’ అని ఉంది; అయితే పౌలు చేసిన సందర్శనల సందర్భం ప్రకారం ఇది రెండో సందర్శన తర్వాతి మరొక సందర్శనను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: προείρηκα
  choice: నేను ఇంతకుముందే చెప్పాను
  rationale: పరిపూర్ణ కాలంలోని క్రియ గతంలో చెప్పిన మాటకు ఇప్పటికీ బలం ఉందని సూచిస్తుంది. సందర్భంలో హెచ్చరిక భావం ఉన్నప్పటికీ, మూలంలోని ‘ముందే చెప్పాను’ అనే అర్థాన్ని మించకుండా ఈ రూపం నిలుపుతుంది.
- source_word: προλέγω
  choice: ముందుగానే చెబుతున్నాను
  rationale: ‘ముందుగా చెప్పడం’ అనే క్రియ యొక్క ప్రత్యక్ష అర్థాన్ని సహజమైన ఆధునిక తెలుగులో ఇస్తుంది; ‘హెచ్చరిస్తున్నాను’ అని సందర్భార్థాన్ని మూలపదంలోకి చేర్చదు.
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: రెండోసారి మీ దగ్గర ఉన్నప్పుడు చెప్పినట్లే, ఇప్పుడు మీకు దూరంగా ఉంటూ
  rationale: పౌలు రెండోసారి వారితో ప్రత్యక్షంగా ఉన్న సందర్భానికీ, ప్రస్తుతం దూరంగా ఉన్న స్థితికీ మధ్యనున్న పోలికను సహజంగా స్పష్టం చేస్తుంది. మూలంలోని సంక్షిప్త నిర్మాణాన్ని తెలుగులో అర్థవంతమైన క్రమంలో అందిస్తుంది.
- source_word: τοῖς προημαρτηκόσιν
  choice: మునుపు పాపం చేసినవారికి
  rationale: ఇప్పటికే జరిగిన పాపాన్ని సూచించే పూర్వత్వాన్ని నిలుపుతుంది; వారు పశ్చాత్తాపపడ్డారా లేదా అనే విషయాన్ని అనువాదం నిర్ణయించదు.
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: మిగిలిన వారందరికీ
  rationale: ‘మిగిలినవారు’ అనే వర్గాన్నీ πᾶσιν లోని సమగ్రతనూ స్పష్టంగా నిలుపుతుంది.
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: నేను మళ్లీ వస్తే
  rationale: మరొకసారి రావడాన్ని సూచించే గ్రీకు నుడికారానికి సహజమైన తెలుగు సమానం. అది మూడో రాక అని ప్రధాన పాఠ్యంలో స్పష్టీకరించకుండా, సందర్భాధారిత అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: οὐ φείσομαι
  choice: ఎవరినీ ఉపేక్షించను
  rationale: తీవ్ర చర్య తీసుకోకుండా విడిచిపెట్టడం లేదా మన్నించడం అనే భావాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది. తెలుగులో అవసరమైన కర్మను ‘ఎవరినీ’ అని చేర్చి, హెచ్చరిక ఉద్దేశించిన సమూహాలపై వర్తించేలా చేస్తుంది; నిర్దిష్టమైన సంఘశిక్ష విధానాన్ని మాత్రం చేర్చదు.
theological_decisions:
- issue: పౌలు హెచ్చరించిన కఠినత్వం ఎవరికి వర్తిస్తుంది?
  choice: మునుపు పాపం చేసినవారితో పాటు మిగిలిన వారందరికీ హెచ్చరికను ఉద్దేశించి, తాను తిరిగి వస్తే ఎవరినీ ఉపేక్షించనని పౌలు చెబుతున్నట్లు అనువదించబడింది.
  alternative: ఈ హెచ్చరిక మునుపు పాపం చేసినవారికి మాత్రమే వర్తిస్తుంది; లేదా పౌలు నిర్దిష్ట సంఘశిక్షను కాక సాధారణ అపొస్తలీయ కఠినత్వాన్ని మాత్రమే సూచిస్తున్నాడు.
  rationale: వాక్యనిర్మాణంలో ‘మునుపు పాపం చేసినవారు’ మరియు ‘మిగిలిన వారందరూ’ అనే రెండు వర్గాలూ సంబోధించబడ్డారు. ‘ఉపేక్షించను’ అనేది హెచ్చరిక తీవ్రతను నిలుపుతూ, ఏ విధమైన శిక్ష లేదా సంఘపాలనా చర్య అనేది నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం ఉపయోగించబడింది. గ్రీకు వాక్యంలోని సంక్షిప్తమైన కాల-స్థితి పోలికను సహజత కోసం పునర్వ్యవస్థీకరించాం; హెచ్చరిక భావాన్ని అతిగా సిద్ధాంతీకరించలేదు. పాదసూచిక గుర్తు అది వివరిస్తున్న ‘మళ్లీ వస్తే’ అన్న పదబంధం వద్ద ఉంచబడింది.
