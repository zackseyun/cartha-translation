source:
  edition: SBLGNT
  text: οὐ γὰρ δυνάμεθά τι κατὰ τῆς ἀληθείας, ἀλλὰ ὑπὲρ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/008.yaml
  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: te
  text: ఎందుకంటే మేము సత్యానికి విరోధంగా ఏమీ చేయలేము; కాని సత్యానికి అనుకూలంగా మాత్రమే చేయగలం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సత్యానికి విరోధంగా మేమేమీ చేయలేము; సత్యానికి మద్దతుగా మాత్రమే పనిచేయగలం.”
    reason: ὑπέρ ఇక్కడ సత్యానికి మద్దతుగా లేదా దాని పక్షాన అనే భావాన్ని సూచిస్తుంది. ‘అనుకూలంగా’కు ప్రత్యామ్నాయంగా ‘మద్దతుగా’ వాడవచ్చు.
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ఎందుకంటే ... చేయలేము
  rationale: γάρ ముందున్న భావానికి కారణాన్ని వివరిస్తుంది; అందువల్ల ఆధునిక తెలుగులో ‘ఎందుకంటే’ సహజంగా ఉంది. οὐ క్రియను నేరుగా నిరాకరిస్తుంది.
- source_word: δυνάμεθά τι
  choice: మేమేమీ చేయలేము
  rationale: δύναμαι సామర్థ్యాన్ని సూచిస్తుంది; నిరాకరణతో కూడిన τι తెలుగులో సహజంగా ‘ఏమీ’ అవుతుంది. ‘మేమేమీ చేయలేము’ సామర్థ్యలేమినీ విస్తృత పరిధినీ స్పష్టంగా తెలియజేస్తుంది.
- source_word: κατὰ τῆς ἀληθείας
  choice: సత్యానికి విరోధంగా
  rationale: Genitive‌తో κατά ఇక్కడ వ్యతిరేకతను సూచిస్తుంది. ‘సత్యానికి విరోధంగా’ ఆ భావాన్ని సహజమైన, గంభీరమైన తెలుగులో అందిస్తుంది.
- source_word: ἀλλὰ
  choice: ;
  rationale: ἀλλά బలమైన వ్యత్యాసాన్ని సూచిస్తుంది. తెలుగులో అర్ధవిరామం రెండు సమాంతర భాగాల మధ్య ఆ వ్యత్యాసాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది; భావపరంగా ఇది ‘కాని’కి సమానం.
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: సత్యానికి అనుకూలంగా
  rationale: ὑπέρ ఇక్కడ మద్దతు లేదా పక్షపాత భావాన్ని కలిగిస్తుంది. ‘అనుకూలంగా’ మొదటి భాగంలోని ‘విరోధంగా’తో సమాంతర విరుద్ధతను కాపాడుతుంది.
theological_decisions:
- issue: ‘సత్యం’ అనే పదం యొక్క పరిధి
  choice: ‘సత్యం’ అనే విస్తృత పదాన్నే ఉంచడం
  alternative: ‘సువార్త సత్యం’ లేదా ‘నిజమైనది’ అని సంకుచితం చేయడం
  rationale: సందర్భంలో సువార్త సత్యం చేరినా, గ్రీకు పదం దానిని ఒక నిర్దిష్ట సిద్ధాంత సూత్రానికే పరిమితం చేయదు. అందువల్ల మూలంలోని ధార్మిక విస్తృతతను, ఉద్వేగాన్ని అలాగే ఉంచాం.
- issue: రెండవ భాగంలో విడిచిపెట్టబడిన క్రియ
  choice: తెలుగులో స్పష్టత కోసం ‘చేయగలం’ అని పూరించడం
  alternative: ‘సత్యానికి అనుకూలంగా మాత్రమే’ అని అసంపూర్ణ వాక్యరూపంలో ఉంచడం
  rationale: గ్రీకులో మొదటి భాగంలోని సామర్థ్యక్రియ రెండవ భాగంలో భావపరంగా కొనసాగుతుంది. తెలుగులో దాన్ని పూరించడం సహజం; అయితే మూలంలో లేని ‘మాత్రమే’ను ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా సంక్షిప్తమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. ‘విరోధంగా/అనుకూలంగా’ అనే సమాంతర పదజంట మూలంలోని κατά/ὑπέρ వ్యత్యాసాన్ని నిలుపుతుంది.
