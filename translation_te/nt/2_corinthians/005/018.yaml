id: 2CO.5.18
reference: 2 Corinthians 5:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: te
  text: ఇవన్నీ[a] దేవుని నుండే వచ్చాయి. ఆయన మెస్సీయ[b] ద్వారా మనలను తనతో సయోధ్యపరచి, సయోధ్య పరిచర్యను మనకు ఇచ్చాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో ‘అన్నీ’ అని ఉంది. ఇది ఈ కొత్త వాస్తవానికి సంబంధించిన సమస్తాన్ని విస్తృతంగా సూచించవచ్చు; లేదా సందర్భంలో ఇంతకుముందు చెప్పిన విషయాలను ప్రత్యేకంగా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం Χριστός; దాని అర్థం ‘మెస్సీయ’ లేదా ‘అభిషిక్తుడు.’
    reason: alternative_reading
  - marker: c
    text: ‘మనలను,’ ‘మనకు’ అనే మాటలు విశ్వాసులను విస్తృతంగా సూచించవచ్చు. అయితే చుట్టుపక్కల సందర్భంలో పౌలు తనకు, తన సహపరిచారకులకు అప్పగించబడిన అపొస్తలిక పరిచర్యను ప్రత్యేకంగా నొక్కిచెబుతున్నాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: ఇవన్నీ
  rationale: τὰ πάντα సందర్భంలో ఇంతకుముందు చెప్పిన నూతన సృష్టి, మారిన జీవితం వంటి వాస్తవాలను వెనక్కి సూచించవచ్చు. δέ ఇక్కడ స్వల్ప అనుసంధానాన్ని చూపుతుంది; తెలుగులో ప్రత్యేక పదం చేర్చకుండానే వాక్యప్రవాహం సహజంగా ఉంటుంది.
- source_word: ἐκ τοῦ θεοῦ
  choice: దేవుని నుండే కలిగాయి
  rationale: ἐκ మూలాన్ని లేదా ఆరంభకర్తను సూచిస్తుంది. ‘నుండే’ అనే నొక్కిచెప్పే రూపం ఈ సమస్తానికి దేవుడే మూలమనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: ఆయన మనలను తనతో సయోధ్యపరచి
  rationale: καταλλάσσω విరిగిన సంబంధాన్ని తిరిగి సరిచేయడం అనే భావాన్ని కలిగి ఉంది. ‘సయోధ్యపరచి’ ఆ సంబంధపరమైన భావాన్ని కాపాడుతుంది; ἑαυτῷ ను ‘తనతో’గా స్పష్టంగా ఉంచింది.
- source_word: διὰ Χριστοῦ
  choice: మెస్సీయ ద్వారా
  rationale: διά + సంబంధ విభక్తి సాధనం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది. Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున దాని బిరుదు భావాన్ని ‘మెస్సీయ’గా వ్యక్తం చేసింది.
- source_word: δόντος ἡμῖν
  choice: మనకు ఇచ్చాడు
  rationale: దేవునికి సంబంధించిన రెండవ aorist participle ను సహజ తెలుగు సమాపక క్రియగా అనువదించింది. ‘ఇచ్చాడు’ మూలంలోని సాధారణ దాన భావాన్ని అతిగా విస్తరించదు.
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: సయోధ్య పరిచర్యను
  rationale: διακονία నియమించబడిన సేవ లేదా పరిచర్యను సూచిస్తుంది; ‘పరిచర్య’ పౌలు సందర్భంలోని బాధ్యతాయుత సేవను నిలుపుతుంది. ‘సయోధ్య పరిచర్య’ అనే నిర్మాణం genitive యొక్క నిర్వచనాత్మక విస్తృతిని కాపాడి, అది సయోధ్యను ప్రకటించే లేదా కలిగించే పరిచర్య అనే భావాన్ని అనవసరంగా ఒక్క విధంగా మాత్రమే నిర్ణయించదు.
theological_decisions:
- issue: Χριστοῦ యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు; అభిషిక్తుడు
  rationale: ఈ వాక్యంలో దేవుడు సయోధ్య కలిగించే మధ్యవర్తిగా Χριστόςను పేర్కొనడం వల్ల బిరుదు భావం సజీవంగా ఉంది. అందుచేత పేరులా లిప్యంతరీకరించకుండా బిరుదును ‘మెస్సీయ’గా ఇచ్చింది.
- issue: ἡμᾶς / ἡμῖν పరిధి
  choice: మనలను / మనకు
  alternative: విశ్వాసులందరినీ; పౌలు మరియు అతని సహపరిచారకులను ప్రత్యేకంగా
  rationale: గ్రీకు సర్వనామాలు పరిధిని స్వయంగా నిర్దిష్టం చేయవు. ముందరి సందర్భం విశ్వాసుల నూతన జీవితాన్ని సూచించగలిగినా, తరువాతి సందర్భం అపొస్తలిక బాధ్యతను ప్రధానంగా చూపుతుంది. ప్రధాన పాఠం ఈ ఉద్రిక్తతను పరిష్కరించకుండా ఉంచుతుంది.
- issue: τῆς καταλλαγῆς యొక్క సంబంధం
  choice: సయోధ్య పరిచర్య
  alternative: సయోధ్య కలిగించే పరిచర్య; సయోధ్యను ప్రకటించే పరిచర్య
  rationale: genitive పరిచర్య యొక్క విషయాన్ని లేదా లక్షణాన్ని నిర్వచించవచ్చు. సంక్షిప్త రూపం దాని ఫలితం, ప్రకటన, లేదా బాధ్యత మధ్య ఒకదానిని మాత్రమే బలవంతంగా ఎంచుకోదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, చదవడానికి సులభమైన వాక్యనిర్మాణం వాడబడింది. ‘సయోధ్య’ సంబంధాల పునరుద్ధరణను స్పష్టంగా తెలియజేస్తుంది; ‘పరిచర్య’ పౌలు ఉద్దేశించిన బాధ్యతాయుత సేవకు తగిన బైబిలు-సంబంధిత గంభీరతను ఉంచుతుంది. మూలంలో లేని కాలసూచక ‘ఇప్పుడు’ చేర్చలేదు.
