  to: ఇవన్నీ[a] దేవుని నుండే వచ్చాయి. ఆయన మెస్సీయ[b] ద్వారా మనలను తనతో సయోధ్యపరచి, సయోధ్య పరిచర్యను మనకు ఇచ్చాడు[c].
