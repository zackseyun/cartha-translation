revisions:
- from: కాబట్టి, ఇంటిలో ఉన్నా బయట ఉన్నా, ఆయనకు ఇష్టులమై ఉండడాన్నే మన ఆశయంగా పెట్టుకుంటున్నాం.[a]
  to: కాబట్టి మనం కూడా, ఇంటివద్ద ఉన్నా దూరంగా ఉన్నా, ఆయనకు ప్రీతికరంగా ఉండడమే మన ఆశయంగా చేసుకుంటున్నాం.[a]
  rationale: The revision corrects the sense of εὐάρεστοι, makes the home/away idiom less misleading in modern Telugu, restores the connective force of καὶ with ‘కూడా,’ and removes unnecessary exclusivity. The main text still preserves the Greek’s concise omission of the complements; the footnote gives the contextual expansion and remains correctly anchored.
  reviewer_model: gpt-5.6-terra
