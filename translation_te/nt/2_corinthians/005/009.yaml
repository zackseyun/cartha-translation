id: 2CO.5.9
reference: 2 Corinthians 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ καὶ φιλοτιμούμεθα, εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες, εὐάρεστοι αὐτῷ εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/009.yaml
  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: te
  text: కాబట్టి మనం కూడా, ఇంటివద్ద ఉన్నా దూరంగా ఉన్నా, ఆయనకు ప్రీతికరంగా ఉండడమే మన ఆశయంగా చేసుకుంటున్నాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సందర్భాన్ని మరింత స్పష్టంగా చెప్పాలంటే: “శరీరంలో నివసిస్తున్నా, శరీరానికి దూరంగా ఉన్నా.”'
    reason: సందర్భంలో సూచితమైన పూరకాన్ని వివరించే ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: διὸ
  choice: కాబట్టి
  rationale: మునుపటి వచనాల్లోని శరీరంలో నివసించడం, ప్రభువుతో నివసించడం అనే చర్చనుంచి వచ్చే నిర్ధారణను సహజంగా సూచిస్తుంది.
- source_word: καὶ
  choice: (ప్రత్యేక పదంగా అనువదించలేదు)
  rationale: తెలుగులో వాక్యప్రవాహం ద్వారానే కొనసాగింపు భావం స్పష్టమవుతుంది; ‘కూడా’ చేర్చితే సందర్భంలో అసహజంగా ఉండే అవకాశం ఉంది.
- source_word: φιλοτιμούμεθα
  choice: మన ఆశయంగా పెట్టుకుంటున్నాం
  rationale: ఏదో ఒక లక్ష్యాన్ని గౌరవప్రదమైన, గాఢమైన ఆకాంక్షగా చేసుకొని దానికోసం కృషి చేయడం అనే క్రియాభావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: ఇంటిలో ఉన్నా బయట ఉన్నా
  rationale: మూలంలోని ‘స్వస్థలంలో/ఇంటిలో ఉండడం—దాని వెలుపల ఉండడం’ అనే సంక్షిప్త జంటను కాపాడుతుంది; శరీరానికి సంబంధించిన సూచనను సందర్భమే అందిస్తుంది.
- source_word: εὐάρεστοι
  choice: ఇష్టులమై
  rationale: ఒకరికి ఆమోదయోగ్యంగా, సంతోషకరంగా ఉండడం అనే సంబంధపూర్వక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτῷ
  choice: ఆయనకు
  rationale: మూలంలోని సర్వనామాన్ని నిలుపుతూ, సందర్భంలో ప్రభువును సూచిస్తుంది.
- source_word: εἶναι
  choice: ఉండడాన్నే
  rationale: ఆశయానికి లక్ష్యాన్ని తెలిపే మూలంలోని క్రియార్థక రూపాన్ని తెలుగులో నామీకృత క్రియారూపంగా సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘ఇంటిలో ఉన్నా బయట ఉన్నా’ అనే మాటల్లో సూచితమైన శరీర సంబంధ పూరకాన్ని ప్రధాన వాక్యంలో స్పష్టపరచాలా?
  choice: మూలంలోని సంక్షిప్తతను కాపాడుతూ ‘ఇంటిలో ఉన్నా బయట ఉన్నా’ అని ఉంచడం
  alternative: ‘శరీరంలో నివసిస్తున్నా, శరీరానికి దూరంగా ఉన్నా’ అని స్పష్టపరచడం
  rationale: 5:6–8 సందర్భం శరీరంలో నివసించడం, శరీరానికి దూరంగా ఉండడం గురించి స్పష్టంగా ఉన్నప్పటికీ, ఈ వచనంలో గ్రీకు పాఠం ఆ పూరకాలను మళ్లీ చెప్పదు. ప్రధాన పాఠంలో ఆ సంక్షిప్తతను నిలిపి, సందర్భార్థాన్ని పాదసూచికలో తెలియజేయడం నిజమైన రూపార్థ ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. ‘ఇంటిలో—బయట’ అనే రూపకం మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
