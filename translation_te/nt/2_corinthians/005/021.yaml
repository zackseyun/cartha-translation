id: 2CO.5.21
reference: 2 Corinthians 5:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: te
  text: పాపం ఎరుగని ఆయనను దేవుడు మన కోసం పాపంగా[a] చేశాడు; ఆయనలో మనం దేవుని నీతిగా[b] మారేలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పాపబలిగా.’ గ్రీకులో రెండు చోట్లా ‘పాపం’ అనే పదమే ఉంది; రెండవ ప్రయోగాన్ని కొందరు బలిసంబంధ అర్థంలో గ్రహిస్తారు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘దేవుని న్యాయంగా,’ లేదా ‘దేవుని నుండి వచ్చే నీతిగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντα
  choice: ఎరుగని
  rationale: γινώσκω యొక్క సాధారణ అర్థమైన ‘తెలుసుకోవడం/ఎరుగడం’ను నిలుపుతుంది. ఇక్కడ ఇది పాపంలో వ్యక్తిగతంగా పాలుపంచుకోకపోవడాన్ని సూచిస్తుంది; ‘పాపం చేయని’ అని విపులీకరించకుండా గ్రీకు సంక్షిప్త ప్రయోగాన్ని కాపాడుతుంది.
- source_word: ἁμαρτίαν (మొదటి ప్రయోగం)
  choice: పాపం
  rationale: γνόντα యొక్క కర్మగా ఉన్న భావవాచక నామాన్ని యథాతథంగా ఉంచి, పౌలు వాక్యంలోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: ὑπὲρ ἡμῶν
  choice: మన కోసం
  rationale: ప్రతినిధిత్వం, మేలు అనే రెండు ఛాయలకూ వీలిచ్చే సహజ తెలుగు ప్రయోగం; ప్రాయశ్చిత్తానికి సంబంధించిన ఒకే సిద్ధాంతానికి దీనిని పరిమితం చేయదు.
- source_word: ἁμαρτίαν (రెండవ ప్రయోగం)
  choice: పాపంగా
  rationale: గ్రీకులో రెండుసార్లూ ఒకే నామపదం ఉంది. పౌలు వాడిన గాఢమైన మాటను ప్రధాన పాఠంలో నిలిపి, ‘పాపబలి’ అనే సాధ్యమైన బలిసంబంధ అర్థాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ἐποίησεν
  choice: చేశాడు
  rationale: దేవుని కార్యాన్ని స్పష్టంగా తెలిపే సహజ సమానార్థకం; ఆ కార్యం ఏ విధంగా జరిగిందనే అదనపు తాత్త్విక నిర్ధారణను చేర్చదు.
- source_word: γενώμεθα
  choice: మారేలా
  rationale: γίνομαι యొక్క ‘అవడం/మారడం’ భావాన్నీ, ἵνα ఉద్దేశ వాక్యంలోని సాధ్యతనూ సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δικαιοσύνη
  choice: నీతి
  rationale: పౌలు వాడుకలోని న్యాయ, సంబంధ, నిబంధన ఛాయలను పూర్తిగా ఒకే వ్యాఖ్యానానికి కుదించకుండా ఉంచే సాధారణ తెలుగు పదం.
- source_word: θεοῦ
  choice: దేవుని
  rationale: గ్రీకు షష్ఠీ విభక్తిలోని మూలం, స్వామ్యం, సంబంధం వంటి సాధ్యమైన భావాలను ప్రధాన పాఠంలో తెరిచి ఉంచుతుంది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: పౌలు వాడే ముఖ్యమైన సంక్షిప్త ప్రయోగాన్ని నిలుపుతుంది; ‘ఆయనతో ఐక్యమై’ అని వ్యాఖ్యానాత్మకంగా విస్తరించదు.
theological_decisions:
- issue: ‘ఆయనను ... పాపంగా చేశాడు’ అనే మాట అర్థం
  choice: పాపం ఎరుగని క్రీస్తును దేవుడు మన కోసం పాపంతో సంబంధమున్న ప్రతినిధి స్థానంలో ఉంచినట్లు వాక్యం చెబుతుంది; క్రీస్తు నైతికంగా పాపి అయ్యాడని ప్రధాన పాఠం చెప్పదు.
  alternative: ‘ఆయనను పాపబలిగా చేశాడు’; లేదా, సందర్భానికి విరుద్ధంగా, ‘ఆయనను నైతికంగా పాపిగా చేశాడు.’
  rationale: మొదటి భాగమే క్రీస్తు పాపం ఎరుగనివాడని స్పష్టం చేస్తుంది. అయినా పౌలు ఉద్దేశపూర్వకంగా వాడిన ‘పాపంగా’ అనే గాఢమైన మాటను అనువాదం మృదువుచేయదు; బలిసంబంధ అర్థాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: δικαιοσύνη θεοῦ యొక్క భావం
  choice: ‘దేవుని నీతి’ అనే సంక్షిప్త రూపాన్ని నిలిపి, అది దేవుని స్వంత నీతినా, దేవుని నుండి వచ్చే నీతినా, లేక దేవునితో సరైన సంబంధస్థితినా అన్నది ప్రధాన పాఠంలో నిర్ణయించలేదు.
  alternative: ‘దేవుని నుండి వచ్చే నీతి’; ‘దేవుని న్యాయం.’
  rationale: ఈ పదబంధం పౌలు రచనల్లో గాఢమైనదీ వివాదాస్పదమైనదీ. ఒక నిర్దిష్ట సిద్ధాంత పద్ధతికి దాన్ని కుదించకుండా గ్రీకు నిర్మాణంలోని నిజమైన అనిశ్చితిని కాపాడటం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘పాపం ఎరుగని’ అనే ప్రయోగం మూలంలోని సంక్షిప్త గాఢతను నిలుపుతుంది. వాక్యం స్వతంత్రంగా స్పష్టంగా ఉండేందుకు మునుపటి సందర్భంలో ఉన్న కర్తను ‘దేవుడు’ అని వెల్లడించాం; చివరి ‘అలా చేశాడు’ ఉద్దేశ సంబంధాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
