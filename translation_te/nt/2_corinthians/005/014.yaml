id: 2CO.5.14
reference: 2 Corinthians 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: te
  text: 'మెస్సీయ ప్రేమ[a] మమ్మల్ని బలంగా ప్రేరేపిస్తోంది, ఎందుకంటే మేము ఈ నిర్ణయానికి వచ్చాము: ఒక్కడు అందరి నిమిత్తం చనిపోయాడు; కాబట్టి అందరూ చనిపోయారు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మనపట్ల మెస్సీయ ప్రేమ’ లేదా ‘మెస్సీయపట్ల మన ప్రేమ’; గ్రీకు పదబంధాన్ని ఈ రెండు విధాలుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: ప్రేమ
  rationale: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన సమానార్థకం; మూలపదంలోని విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయకు సంబంధించిన
  rationale: Χριστόςను పేరుగా కాక బిరుదుగా అనువదిస్తూ, గ్రీకు షష్ఠీ విభక్తిలోని కర్తృార్థక లేదా కర్మార్థక సాధ్యతను ప్రధాన పాఠ్యంలో సాధ్యమైనంతవరకు తెరిచి ఉంచుతుంది.
- source_word: συνέχει
  choice: బలంగా నడిపిస్తోంది
  rationale: సందర్భంలో ప్రేమ కలిగించే శక్తిమంతమైన ప్రేరణ, నియంత్రణ భావాలను సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ‘బలవంతం చేస్తోంది’ అనే ప్రతికూల ఛాయను నివారిస్తుంది.
- source_word: κρίναντας
  choice: మేము ఈ నిర్ణయానికి వచ్చాము
  rationale: ఇది ఆలోచించి చేసిన నిర్ధారణ అని తెలియజేస్తూ, కృదంతానికి సందర్భానుసారమైన కారణ సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εἷς
  choice: ఒక్కడు
  rationale: గ్రీకు పాఠ్యంలోని సంక్షిప్తమైన పురుష ఏకవచనాన్ని నిలుపుతుంది; ‘మెస్సీయ’ అని వివరణాత్మకంగా చేర్చదు.
- source_word: ὑπὲρ πάντων
  choice: అందరి నిమిత్తం
  rationale: ‘అందరి కోసం/పక్షంగా’ అనే విస్తృత భావాన్ని కాపాడుతూ, నిర్దిష్ట ప్రాయశ్చిత్త సిద్ధాంతాన్ని అనువాదంలోనే ఖరారు చేయదు.
- source_word: ἄρα
  choice: కాబట్టి
  rationale: ముందటి వాక్యం నుంచి పౌలు తీసే తార్కిక నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: οἱ πάντες ἀπέθανον
  choice: అందరూ చనిపోయారు
  rationale: మూలంలోని సంక్షిప్త వాక్యాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
theological_decisions:
- issue: ἡ ἀγάπη τοῦ Χριστοῦలో షష్ఠీ విభక్తి భావం
  choice: ప్రధాన పాఠ్యంలో ‘మెస్సీయకు సంబంధించిన ప్రేమ’ అని విస్తృతంగా ఉంచి, రెండు సాధ్యమైన అర్థాలను పాదసూచికలో తెలిపాం.
  alternative: ‘మనపట్ల మెస్సీయ ప్రేమ’ లేదా ‘మెస్సీయపట్ల మన ప్రేమ’
  rationale: గ్రీకు రూపం కర్తృార్థకంగానూ కర్మార్థకంగానూ అర్థమవుతుంది; ఈ వచనం మాత్రమే ఆ సందిగ్ధతను పూర్తిగా పరిష్కరించదు.
- issue: ‘అందరూ చనిపోయారు’ అనే మాట భావం
  choice: వ్యాఖ్యానాత్మక విస్తరణ లేకుండా యథాతథంగా అనువదించాం.
  alternative: ‘అందరూ మెస్సీయలో ప్రాతినిధ్యంగా చనిపోయారు’ లేదా ‘విశ్వాసులందరూ ఆయనతో కలిసి చనిపోయారు’
  rationale: పౌలు మాటల్లో ప్రాతినిధ్య భాగస్వామ్య భావం ఉండవచ్చు; అయితే ‘అందరూ’ అనే మాట పరిధిని ఈ వచనంలో అనువాదకుడు నిర్ణయించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే వాక్యంలోని గంభీరమైన తార్కిక ధోరణిని నిలుపుతూ అనువదించబడింది.
