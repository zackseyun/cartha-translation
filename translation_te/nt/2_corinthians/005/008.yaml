  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: te
  text: మేము ధైర్యంగా ఉన్నాం; శరీరం నుండి దూరంగా ఉండడానికీ ప్రభువు సన్నిధిలో ఉండడానికీ మరింత ఇష్టపడుతున్నాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శరీరం నుండి దూరంగా ఉండి, ప్రభువుతో ఇంటివద్ద ఉన్నట్లుగా ఉండడానికి.’
    reason: ἐκδημέω–ἐνδημέω జంటలో ‘ఇంటికి దూరంగా ఉండడం/ఇంటివద్ద ఉండడం’ అనే నివాస రూపకం ఉంది. ప్రధాన పాఠ్యం దాన్ని సహజమైన తెలుగులో ‘దూరంగా ఉండడం/సన్నిధిలో ఉండడం’గా వ్యక్తం చేస్తుంది; πρός τὸν κύριον కు ‘ప్రభువుతో’ అనేది ప్రత్యామ్నాయ వ్యక్తీకరణ.
lexical_decisions:
- source_word: θαρροῦμεν
  choice: మేము ధైర్యంగా ఉన్నాం
  rationale: వర్తమాన సూచక క్రియలోని స్థిరమైన ధైర్యభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: కాబట్టి
  rationale: మునుపటి వచనాల ఆలోచనను కొనసాగిస్తూ దాని నుంచి వచ్చే నిర్ధారణను ఇక్కడ సూచిస్తుంది; బలమైన వ్యతిరేకతను కాదు.
- source_word: καὶ εὐδοκοῦμεν μᾶλλον
  choice: ఎక్కువగా ఇష్టపడుతున్నాం
  rationale: εὐδοκοῦμεν లోని సంతోషపూర్వక సమ్మతిని, μᾶλλον లోని తులనాత్మక ప్రాధాన్యాన్ని కలిపి సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκδημῆσαι ἐκ τοῦ σώματος
  choice: శరీరానికి దూరంగా ఉండి
  rationale: సొంత నివాసానికి దూరంగా ఉండడమనే ἐκδημέω రూపకాన్ని నిలుపుతూ, గ్రీకులో లేని ‘చనిపోవడం’ అనే వివరణను చేర్చదు.
- source_word: ἐνδημῆσαι πρὸς τὸν κύριον
  choice: ప్రభువు దగ్గర నివసించడానికి
  rationale: ἐνδημέω లోని ఇంటివద్ద/నివాసంలో ఉండే రూపకాన్ని ‘నివసించడానికి’ నిలుపుతుంది; πρός ఇక్కడ ప్రభువు సన్నిధి, సాంగత్య భావాన్ని ‘దగ్గర’ ద్వారా తెలియజేస్తుంది.
theological_decisions:
- issue: ఈ వచనాన్ని మధ్యస్థితి గురించి స్పష్టమైన సిద్ధాంత ప్రకటనగా విస్తరించాలా
  choice: శరీరానికి దూరంగా ఉండడం, ప్రభువు దగ్గర నివసించడం అనే పౌలు రూపకాన్నే నిలుపడం
  alternative: ‘చనిపోయి పరలోకంలో ప్రభువుతో ఉండడం’ అని వివరణాత్మకంగా అనువదించడం
  rationale: వచనం మరణానంతరం ప్రభువు సన్నిధిని బలంగా సూచించినా, ‘మరణం,’ ‘పరలోకం’ అనే పదాలు గ్రీకులో లేవు. వాటిని చేర్చకుండా మూలంలోని రూపకాన్నీ ధార్మిక ఉద్వేగాన్నీ కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో. మూలంలోని ‘దూరంగా ఉండడం/నివసించడం’ అనే నివాస రూపకాన్ని ప్రధాన పాఠ్యంలో కాపాడి, ప్రత్యామ్నాయ భావవ్యక్తీకరణను పాదటిప్పణిలో ఇచ్చాం.
