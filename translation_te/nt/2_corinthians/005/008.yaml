revisions:
- from: కాబట్టి మేము ధైర్యంగా ఉన్నాం; శరీరానికి దూరంగా ఉండి, ప్రభువు దగ్గర నివసించడానికే ఎక్కువగా ఇష్టపడుతున్నాం.[a]
  to: మేము ధైర్యంగా ఉన్నాం; శరీరం నుండి దూరంగా ఉండడానికీ ప్రభువు సన్నిధిలో ఉండడానికీ మరింత ఇష్టపడుతున్నాం.[a]
  rationale: The revision preserves Paul’s paired residence metaphor and his comparative preference, removes the unsupported exclusive particle, and uses a natural Telugu parallel construction. It does not add an explicit reference to death, heaven, or a doctrinally resolved intermediate state.
