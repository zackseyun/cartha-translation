id: 2CO.5.6
reference: 2 Corinthians 5:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: te
  text: కాబట్టి మనం ఎల్లప్పుడూ ధైర్యంగా ఉన్నాం. శరీరంలో నివసిస్తున్నంతకాలం ప్రభువుకు దూరంగా ఉన్నామని మనకు తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువు దగ్గర లేమని.” గ్రీకు క్రియ ἐκδημοῦμεν, “నివసిస్తున్నాం” అనే క్రియకు వ్యతిరేకార్థకంగా వాడబడింది; దాన్ని “దూరంగా ఉన్నాం” లేదా “దగ్గర లేము” అని అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρροῦντες
  choice: మనం ... ధైర్యంగా ఉన్నాం
  rationale: వర్తమాన కృదంతం నిరంతర ధైర్యస్థితిని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో సమాపక క్రియగా అనువదించబడింది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందరి వాదననుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: నిరంతరతను నేరుగా, సహజంగా తెలియజేస్తుంది.
- source_word: εἰδότες
  choice: మనకు తెలుసు
  rationale: οἶδα పరిపూర్ణ కృదంతానికి వర్తమాన భావం ఉంది; స్థిరమైన అవగాహనను సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐνδημοῦντες
  choice: నివసిస్తున్నంతకాలం
  rationale: సొంత ఇంటిలో లేదా స్వదేశంలో ఉండడమనే మూల రూపకాన్ని 'నివసించడం' నిలుపుతుంది; కాలసంబంధ కృదంత భావాన్ని 'అంతకాలం' వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ σώματι
  choice: శరీరంలో
  rationale: భూలోక శరీర జీవనాన్ని సూచించే స్థానార్థక పదబంధాన్ని అదనపు వ్యాఖ్యానం లేకుండా అనువదిస్తుంది.
- source_word: ἐκδημοῦμεν
  choice: దూరంగా ఉన్నాం
  rationale: ἐνδημοῦντεςకు వ్యతిరేకార్థకమైన, ఇంటికి దూరంగా ఉండే రూపకాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἀπὸ τοῦ κυρίου
  choice: ప్రభువుకు దూరంగా
  rationale: ἀπό సూచించే వేరుదనాన్ని క్రియాపదబంధంలో సహజంగా వ్యక్తపరుస్తుంది; κύριοςను 'ప్రభువు'గా అనువదిస్తుంది.
theological_decisions:
- issue: శరీరంలో నివసించడం మరియు ప్రభువుకు దూరంగా ఉండడం మధ్య రూపకాలంకార వ్యత్యాసం
  choice: ప్రస్తుత శరీర జీవనాన్ని 'శరీరంలో నివసించడం'గా, దానికి అనుగుణంగా 'ప్రభువుకు దూరంగా ఉండడం'గా అనువదించడం
  alternative: తరువాతి వచనంలోని 'శరీరానికి దూరంగా ఉండి ప్రభువు దగ్గర ఉండడం' అనే భాషను ఈ వచనంలోకి తీసుకురావడం; లేదా శరీరంలో ఉన్న విశ్వాసులు క్రీస్తు నుండి పూర్తిగా వేరై ఉన్నారని బలంగా చెప్పడం
  rationale: ఈ వచనం ప్రస్తుత శరీర జీవనానికీ ప్రభువుతో ఇంకా సంపూర్ణంగా ఉండని స్థితికీ మధ్య ఉన్న ఉద్వేగాన్ని తెలియజేస్తుంది. క్రీస్తు సన్నిధి నుండి సంపూర్ణ వియోగమని అతిశయించకుండా, తరువాతి వచన భావాన్ని ముందుగానే చేర్చకుండా మూలంలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకులోని ఇంట్లో ఉండడం/ఇంటికి దూరంగా ఉండడం అనే జత రూపకాన్ని 'నివసించడం/దూరంగా ఉండడం' ద్వారా సాధ్యమైనంతవరకు నిలిపింది; కృదంతాలను తెలుగు వాక్యప్రవాహానికి తగినట్లుగా రెండు వాక్యాలుగా అమర్చింది.
