  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: te
  text: జీవించేవారు ఇకపై తమకోసం జీవించకుండా, వారి కోసం చనిపోయి లేపబడిన ఆయన కోసం జీవించేలా ఆయన అందరి కోసం[a] చనిపోయాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అందరి పక్షంగా’; ఈ వచనంలో రెండుసార్లు వచ్చిన ‘కోసం’ (ὑπέρ) వారి ప్రయోజనం కోసం లేదా వారి పక్షంగా అనే ప్రతినిధిత్వ భావాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: అందరి కోసం
  rationale: ὑπέρ + షష్ఠీ విభక్తి ప్రతినిధిత్వం లేదా ప్రయోజనార్థాన్ని సూచిస్తుంది. ‘అందరి కోసం’ సహజమైన తెలుగులో ఆ భావాన్ని అతిగా సిద్ధాంతీకరించకుండా నిలుపుతుంది.
- source_word: ἀπέθανεν
  choice: ఆయన చనిపోయాడు
  rationale: ఆరిస్ట్ సూచనార్థక క్రియ గతంలో జరిగిన సంఘటనను సూటిగా తెలియజేస్తుంది; సందర్భం మరియు గ్రీకు క్రియారూపం ఆధారంగా కర్తను ‘ఆయన’గా వ్యక్తం చేశాం.
- source_word: ἵνα
  choice: జీవించాలని
  rationale: ఈ నిర్మాణం ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. తెలుగులో ‘జీవించాలని ఆయన చనిపోయాడు’ అనే నిర్మాణం దాని లక్ష్యార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οἱ ζῶντες
  choice: జీవించేవారు
  rationale: నామవాచకంగా వాడిన వర్తమాన కృదంతం జీవం పొందిన లేదా జీవిస్తున్నవారిని సూచిస్తుంది. ‘జీవించేవారు’ మూలంలోని విస్తృతతను నిలుపుతుంది.
- source_word: μηκέτι
  choice: ఇక ... జీవించకుండా
  rationale: ఇంతకుముందున్న జీవన విధానం ఇక కొనసాగకూడదనే భావాన్ని ‘ఇక’ మరియు నిషేధార్థక క్రియారూపం సహజంగా తెలియజేస్తాయి.
- source_word: ἑαυτοῖς ζῶσιν
  choice: తమ కోసం తాము జీవించకుండా
  rationale: ప్రతిబింబక చతుర్థీ విభక్తి జీవితం ఎవరి వైపు లేదా ఎవరి ప్రయోజనానికి మళ్లిందో సూచిస్తుంది. ‘తమ కోసం తాము’ స్వకేంద్రిత జీవనాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀλλὰ τῷ ... ἀποθανόντι καὶ ἐγερθέντι
  choice: కాని ... చనిపోయి లేపబడిన ఆయన కోసం జీవించాలని
  rationale: ముందున్న ‘జీవించాలి’ అనే క్రియాభావం ఇక్కడ కూడా కొనసాగుతుంది. కృదంత నిర్మాణాన్నీ, తమ కోసం కాక మరొకరి కోసం జీవించాలనే వ్యత్యాసాన్నీ ఈ రూపం నిలుపుతుంది.
- source_word: ἐγερθέντι
  choice: లేపబడిన
  rationale: గ్రీకులోని కర్మణి రూపాన్ని కాపాడుతూ, పునరుత్థానంలో దేవుని కార్యాన్ని సూచించే వ్యాకరణ సూక్ష్మతను నిలుపుతుంది.
- source_word: ὑπὲρ αὐτῶν
  choice: తమ కోసం
  rationale: మొదటి ὑπέρ వాడుకతో భావసామ్యాన్ని నిలుపుతూ, తెలుగు వాక్యంలో సూచించబడిన జీవించేవారినే సహజంగా తిరిగి సూచిస్తుంది.
theological_decisions:
- issue: πάντων / αὐτῶν యొక్క పరిధి
  choice: ‘అందరి’ మరియు ‘తమ’ అని సూటిగా అనువదించి, సూచిత వర్గాన్ని సంకుచితం చేయలేదు.
  alternative: ‘అందరు’ అంటే మినహాయింపు లేకుండా సమస్త మానవాళి అని లేదా సందర్భంలోని విశ్వాసులందరని ప్రత్యేకంగా నిర్ధారించడం.
  rationale: వచనం విస్తృత పరిధి గల పదాన్ని ఉపయోగిస్తుంది; ప్రాయశ్చిత్త పరిధిపై తరువాతి సిద్ధాంత వివాదాన్ని ఈ వచనం మాత్రమే స్పష్టంగా పరిష్కరించదు. అందువల్ల మూలంలోని ఉద్రిక్తతను అలాగే ఉంచాం.
- issue: ἐγερθέντι లోని పునరుత్థాన ప్రయోగం
  choice: ‘లేపబడిన’
  alternative: ‘తిరిగి లేచిన’
  rationale: ‘లేపబడిన’ గ్రీకు కర్మణి రూపాన్ని స్పష్టంగా ప్రతిబింబిస్తుంది; ‘తిరిగి లేచిన’ సహజమైన ప్రత్యామ్నాయమే అయినా కర్మణి సూక్ష్మతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని పొడవును తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా మలిచినా, ఉద్దేశసంబంధాన్ని రెండో వాక్యాంతంలో నిలిపాం. కర్మణి ‘లేపబడిన’ రూపాన్ని కాపాడాం.
