revisions:
- from: ఆయన అందరి కోసం[a] చనిపోయాడు. ఇక జీవించేవారు తమ కోసం తాము జీవించకుండా, తమ కోసం చనిపోయి లేపబడిన ఆయన కోసం జీవించాలని ఆయన చనిపోయాడు.
  to: జీవించేవారు ఇకపై తమకోసం జీవించకుండా, వారి కోసం చనిపోయి లేపబడిన ఆయన కోసం జీవించేలా ఆయన అందరి కోసం[a] చనిపోయాడు.
  rationale: 'The revision preserves every major source feature: πάντων remains ‘అందరి’; both occurrences of ὑπέρ are represented by ‘కోసం’; ἵνα is conveyed by ‘జీవించేలా’; μηκέτι by ‘ఇకపై’; the self-directed dative by ‘తమకోసం’; and the passive ἐγερθέντι by ‘లేపబడిన.’ ‘వారి కోసం’ unambiguously refers back to ‘జీవించేవారు’ while preserving the source''s unresolved scope.'
  reviewer_model: gpt-5.6-terra
