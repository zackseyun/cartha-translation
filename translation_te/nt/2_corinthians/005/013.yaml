language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴτε γὰρ ἐξέστημεν, θεῷ· εἴτε σωφρονοῦμεν, ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/013.yaml
  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: te
  text: ఎందుకంటే, మేము మతి తప్పినవారమైతే[a], అది దేవునికోసమే; మేము స్వస్థబుద్ధితో ఉన్నామైతే[b], అది మీకోసమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తనలో తాను లేనివారమైతే.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సవ్యమైన మనస్సుతో ఉన్నామైతే” / “నిగ్రహంతో ఉన్నామైతే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: '...అంటే ...అంటే'
  rationale: గ్రీకు పదబంధంలోని రెండు ప్రత్యామ్నాయాల భావాన్ని తెలుగులో సహజమైన సమాంతర షరతులతో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందరి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే అనుసంధాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐξέστημεν
  choice: మతిస్థిమితం లేనివారిలా ఉన్నాము
  rationale: ἐξίστημι యొక్క ‘మతి తప్పినట్లు లేదా తనలో తాను లేనట్లు ఉండడం’ అనే భావాన్ని, పౌలు నిజంగా పిచ్చివాడని తేల్చకుండా, ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: θεῷ
  choice: దేవుని కోసం
  rationale: సంక్షిప్తంగా ఉన్న గ్రీకు చతుర్థీ విభక్తి దేవునికి సంబంధించిన లేదా దేవుని ప్రయోజనార్థమైన దిశను సూచిస్తుంది; తెలుగు వాక్యంలో ‘కోసం’ సహజంగా ఉంటుంది.
- source_word: σωφρονοῦμεν
  choice: స్థిరబుద్ధితో ఉన్నాము
  rationale: సవ్యమైన, నిగ్రహంతో కూడిన వివేకస్థితిని సూచిస్తూ, ἐξέστημενతో ఉన్న గట్టి వ్యతిరేకతను నిలుపుతుంది.
- source_word: ὑμῖν
  choice: మీ కోసం
  rationale: కొరింథీయుల మేలు లేదా ప్రయోజనం అనే చతుర్థీ విభక్తి భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పౌలు తన స్థితిని విరుద్ధ పదాలతో వర్ణించడం
  choice: పిచ్చిగా కనిపించే ప్రవర్తనను స్థిరబుద్ధిగల ప్రవర్తనతో పౌలు పోల్చుతున్నట్లు అనువదించబడింది; నిజమైన మానసిక వ్యాధిని అతనికి ఆపాదించలేదు.
  alternative: ఇది నిజమైన పారవశ్య ఆధ్యాత్మిక అనుభవాన్ని సూచిస్తుందని లేదా ప్రత్యర్థుల ఆరోపణను మాత్రమే అతిశయోక్తిగా ఉటంకిస్తుందని అర్థం చేసుకోవచ్చు.
  rationale: గ్రీకు వాక్యం సంక్షిప్తంగాను అలంకారికంగాను ఉంది. అనువాదం దాని ఉద్రిక్తతను కాపాడుతూ, పారవశ్యం గురించిన ప్రత్యేక సిద్ధాంతాన్ని చేర్చదు; అదే సమయంలో దానిని కేవలం అవమానపూర్వక ఆరోపణగా కూడా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త సమాంతర నిర్మాణాన్ని ‘...అంటే ...అంటే’ ద్వారా నిలిపి, ప్రతి చతుర్థీ విభక్తి పదబంధంలోని ప్రయోజన భావాన్ని ‘కోసం’తో స్పష్టం చేశాం.
