revisions:
- from: ఎందుకంటే, మేము మతిస్థిమితం లేనివారిలా ఉన్నామంటే[a], అది దేవుని కోసం; మేము స్థిరబుద్ధితో ఉన్నామంటే[b], అది మీ కోసం.
  to: ఎందుకంటే, మేము మతి తప్పినవారమైతే[a], అది దేవునికోసమే; మేము స్వస్థబుద్ధితో ఉన్నామైతే[b], అది మీకోసమే.
  rationale: The revision removes the added comparative “లా,” preserving the source's direct but rhetorically open self-description. It also replaces “స్థిరబుద్ధితో” with “స్వస్థబుద్ధితో” to express the sound-minded contrast of σωφρονοῦμεν more accurately, while retaining the concise parallel structure and the benefit/reference sense of the two datives.
