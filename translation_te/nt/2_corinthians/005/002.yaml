source:
  edition: SBLGNT
  text: καὶ γὰρ ἐν τούτῳ στενάζομεν, τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ ἐπενδύσασθαι ἐπιποθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/002.yaml
  text: For indeed in this we groan[a], longing to put on our dwelling from heaven[b],
translation:
  language: te
  text: ఎందుకంటే నిజానికి, ఇందులో[a] మనం మూలుగుతున్నాం; పరలోకం నుండి వచ్చిన మన నివాసాన్ని[b] ధరించుకోవాలని[c] ఎంతో ఆశిస్తున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఇందులో’ అని ఉన్న గ్రీకు పదబంధం దేనిని సూచిస్తుందో స్పష్టంగా చెప్పదు; సందర్భంలో అది ప్రస్తుత శరీరస్థితిని సూచించవచ్చు.
    reason: referential_ambiguity
  - marker: b
    text: అక్షరార్థంగా, ‘పరలోకం నుండి వచ్చిన మన నివాసం.’ ఇది ఆ నివాసపు లక్షణం కంటే దాని మూలాన్ని నొక్కి చెబుతుంది.
    reason: lexical_alternative
  - marker: c
    text: ఈ క్రియకు, ఒక వస్త్రంపై మరొక వస్త్రాన్ని వేసుకున్నట్లు, ‘పైన ధరించుకోవడం’ అనే భావఛాయ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ఎందుకంటే, నిజానికి
  rationale: ముందటి వాక్యానికి గల వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’ తెలియజేస్తుంది; γὰρ లోని స్వల్ప ఉద్ఘాటనను ‘నిజానికి’ నిలుపుతుంది.
- source_word: ἐν τούτῳ
  choice: ఇందులో
  rationale: సూచనాపదం దేనిని సూచిస్తుందో గ్రీకు వాక్యం స్పష్టంగా చెప్పదు. కాబట్టి ‘ఈ గుడారంలో’ లేదా ‘ఈ స్థితిలో’ అని అర్థాన్ని ముందే నిర్ణయించకుండా అస్పష్టతను నిలిపింది.
- source_word: στενάζομεν
  choice: మనం మూలుగుతూ
  rationale: భారం వల్ల కలిగే అంతర్గత వేదనతో పాటు ఆరాటాన్ని కూడా ‘మూలుగు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: పరలోకం నుండి వచ్చే మన నివాసాన్ని
  rationale: οἰκητήριον లోని నివాస రూపకాన్నీ, ἐξ οὐρανοῦ లోని మూలస్థాన భావాన్నీ నిలుపుతుంది. ‘పరలోక నివాసం’ అని చెప్పడం కంటే ‘పరలోకం నుండి వచ్చే’ అనేది మూలాన్ని మరింత స్పష్టంగా ప్రతిబింబిస్తుంది.
- source_word: ἐπενδύσασθαι
  choice: ధరించుకోవాలని
  rationale: వస్త్రాన్ని వేసుకోవడం అనే రూపకాన్ని సహజమైన తెలుగులో అందిస్తుంది. ఇప్పటికే ఉన్నదానిపై మరొకటి వేసుకోవడం అనే ప్రత్యేక ఛాయను పాదసూచికలో తెలిపింది.
- source_word: ἐπιποθοῦντες
  choice: ఎంతో ఆశిస్తున్నాం
  rationale: ఈ కృదంతంలోని బలమైన, కొనసాగుతున్న ఆకాంక్షను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: పరలోకం నుండి వచ్చే నివాసం మరియు దాన్ని ధరించుకోవడం అనే రూపకాల భావం
  choice: నివాసం, వస్త్రధారణ అనే పరస్పరం కలిసిన రూపకాలను యథాతథంగా నిలిపి, అవి సూచించే స్థితిని సిద్ధాంతపరంగా నిర్దిష్టం చేయలేదు.
  alternative: దీనిని ‘పునరుత్థాన శరీరం’ లేదా ‘పరలోక గృహం’ అని స్పష్టీకరించడం.
  rationale: ఈ వచనం పునరుత్థాన శరీరాన్ని, మధ్యస్థితిని, లేదా అంత్యకాల పరలోక నివాసాన్ని మాత్రమే సూచిస్తుందని స్వయంగా తేల్చదు. అందువల్ల మూలంలోని భావ ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడింది. ‘నివాసాన్ని ధరించుకోవడం’ అనే అసాధారణ రూపకసమ్మేళనాన్ని సులభీకరించకుండా నిలిపింది; అది మూల గ్రీకులోనే ఉంది.
