id: 2CO.5.20
reference: 2 Corinthians 5:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: te
  text: 'కాబట్టి, మేము అభిషిక్తుని తరఫున రాయబారులుగా ఉన్నాం[a]. దేవుడు మా ద్వారా విజ్ఞప్తి చేస్తున్నట్టుగా, అభిషిక్తుని తరఫున మేము మిమ్మల్ని వేడుకుంటున్నాం: దేవునితో సయోధ్య పొందండి[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు బిరుదు Χριστός అంటే ‘అభిషిక్తుడు.’ దీనిని ‘క్రీస్తు’ అని కూడా అనువదించవచ్చు; ఈ వచనంలో రెండుచోట్లా ఇదే పదం ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘దేవునికి సయోధ్య పొందండి.’ గ్రీకు దత్తి విభక్తి ఇక్కడ ‘దేవునికి’ లేదా ‘దేవునితో’ అనే భావాలను అనుమతిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: అభిషిక్తుడి తరఫున
  rationale: ὑπέρ + షష్ఠీ విభక్తి ఇక్కడ ప్రతినిధిత్వాన్ని సూచిస్తూ ‘తరఫున’ అనే భావాన్ని ఇస్తుంది. Χριστός ఒక బిరుదుగా ఉన్నందున దాని అర్థాన్ని తెలిపే ‘అభిషిక్తుడు’ అని అనువదించాం.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వచనాల్లోని సయోధ్య సందేశం నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: πρεσβεύομεν
  choice: మేము ... రాయబారులం
  rationale: క్రియలోని రాయబారిగా లేదా ప్రతినిధిగా వ్యవహరించే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὡς
  choice: '... చేస్తున్నట్టుగా'
  rationale: దేవుడు వారి ద్వారా విజ్ఞప్తి చేస్తున్నాడన్న పోలిక లేదా దృక్కోణాన్ని నిలుపుతుంది; దానిని నేరుగా సమానార్థక ప్రకటనగా మార్చదు.
- source_word: παρακαλοῦντος
  choice: విజ్ఞప్తి చేస్తున్న
  rationale: సయోధ్య సందర్భంలో παρακαλέω లోని హృదయపూర్వకంగా కోరే, ప్రోత్సహించే భావాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో అందిస్తుంది.
- source_word: δι’ ἡμῶν
  choice: మా ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సూచించే సాధనం లేదా మధ్యవర్తిత్వ భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: δεόμεθα
  choice: మేము మిమ్మల్ని వేడుకుంటున్నాం
  rationale: δεόμαι లోని అత్యవసరమైన, హృదయపూర్వక అభ్యర్థనను సులభంగా అర్థమయ్యే తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καταλλάγητε
  choice: సయోధ్య పొందండి
  rationale: కర్తరి రూపంగా మార్చకుండా, పరోక్షంగా స్వీకరించబడే సయోధ్య భావాన్ని సహజ తెలుగులో నిలుపుతుంది. గ్రీకు రూపం భూతకాల దృష్టిగల కర్మణి ఆజ్ఞార్థకం.
- source_word: τῷ θεῷ
  choice: దేవునితో
  rationale: καταλλάσσω తరువాతి దత్తి విభక్తి సంబంధాత్మక సయోధ్యను సూచిస్తుంది; తెలుగులో ‘దేవునితో’ అత్యంత సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
theological_decisions:
- issue: Χριστοῦ అనే బిరుదు అనువాదం
  choice: అభిషిక్తుడు
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ పేరుగా కాక బిరుదుగా పనిచేస్తుంది. అందువల్ల దాని అర్థాన్ని ప్రధాన పాఠ్యంలో అనువదించి, సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఉంచాం.
- issue: సయోధ్యలో కర్తృత్వం మరియు మానవ ప్రతిస్పందన
  choice: దేవునితో సయోధ్య పొందండి
  alternative: దేవునికి సమాధానపరచబడండి
  rationale: ‘పొందండి’ కర్మణి భావాన్ని సహజ తెలుగులో నిలుపుతూ, దేవుని కార్యాన్నీ వినేవారికి ఇచ్చిన ఆజ్ఞనూ ఒకదానితో మరొకటి కలిపి పరిష్కరించకుండా ఉంచుతుంది.
- issue: ὡς యొక్క పోలికాత్మక బలం
  choice: దేవుడు ... విజ్ఞప్తి చేస్తున్నట్టుగా ఉంది
  alternative: దేవుడు ... విజ్ఞప్తి చేస్తున్నాడు
  rationale: మూలంలోని ὡς ను తొలగించి వాక్యాన్ని నేర ప్రకటనగా మార్చకుండా, అపొస్తలుల రాయబార సేవను ఎలా గ్రహించాలో తెలిపే పోలికాత్మక ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. ‘రాయబారులం,’ ‘విజ్ఞప్తి,’ ‘వేడుకుంటున్నాం,’ ‘సయోధ్య పొందండి’ అనే రూపాలు మూలంలోని అధికారిక ప్రతినిధిత్వాన్నీ హృదయపూర్వక విజ్ఞప్తినీ సమతుల్యం చేస్తాయి.
