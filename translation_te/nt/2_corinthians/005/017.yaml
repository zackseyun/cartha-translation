id: 2CO.5.17
reference: 2 Corinthians 5:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: te
  text: కాబట్టి, ఎవరైనా మెస్సీయలో ఉంటే—నూతన సృష్టి[a]; పాతవి గతించిపోయాయి; ఇదిగో, కొత్తవి వచ్చాయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ వ్యక్తి నూతన సృష్టి.” గ్రీకు వాక్యం క్రియ లేకుండా సంక్షిప్తంగా ఉంది; అక్షరార్థంగా, “ఎవరైనా మెస్సీయలో ఉంటే—నూతన సృష్టి.”
    reason: alternative_reading
  - marker: b
    text: అనేక అనువాదాల్లో, “అన్నీ కొత్తవయ్యాయి” అని ఉంటుంది. ఇక్కడ SBLGNT పాఠంలో ‘అన్నీ’ అనే స్పష్టమైన పదం లేకుండా, “కొత్తవి వచ్చాయి” అని మాత్రమే ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి తీసుకున్న నిర్ధారణను సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: εἴ τις
  choice: ఎవరైనా
  rationale: లింగభేదాన్ని చేర్చకుండా, గ్రీకులోని సాధారణమైన అనిర్దిష్ట షరతును తెలియజేస్తుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστόςలోని బిరుదు భావాన్ని, అలాగే మెస్సీయతో ఐక్యతను తెలిపే పౌలు వాడుకను నిలుపుతుంది.
- source_word: καινὴ κτίσις
  choice: నూతన సృష్టి
  rationale: మూలంలోని క్రియలేని, సంక్షిప్త నిర్మాణాన్ని అనవసరంగా ఒకే అర్థానికి పరిమితం చేయకుండా అలాగే ఉంచుతుంది.
- source_word: τὰ ἀρχαῖα
  choice: పాతవి
  rationale: నపుంసక బహువచన విశేషణం నామవాచకంగా వాడబడిన రూపాన్ని సంక్షిప్తంగా, విస్తృత పరిధితో తెలియజేస్తుంది.
- source_word: παρῆλθεν
  choice: గతించిపోయాయి
  rationale: సంభవించిన మార్పుతో పాటు దాని ప్రస్తుత ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: తరువాత చెప్పే ఫలితంపై శ్రద్ధ నిలిపే గ్రీకు సూచనాత్మక అవ్యయపు అలంకార బలాన్ని నిలుపుతుంది.
- source_word: γέγονεν καινά
  choice: కొత్తవి వచ్చాయి
  rationale: γέγονεν సూచించే మార్పు వల్ల ఏర్పడిన ప్రస్తుత స్థితిని, καινάలోని బహువచనాన్ని నిలుపుతూ తెలియజేస్తుంది; మూలపాఠంలో లేని ‘అన్నీ’ని చేర్చదు.
theological_decisions:
- issue: Χριστῷను బిరుదుగా అనువదించాలా, పేరువలె లిప్యంతరీకరించాలా
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: ఈ పౌలు ప్రయోగంలో మెస్సీయ బిరుదు భావం సార్థకంగా ఉంది; దానిని అనువదించడం మూలంలోని భావాన్ని స్పష్టంగా నిలుపుతుంది.
- issue: καινὴ κτίσις అనే క్రియలేని వాక్యఖండాన్ని ఎలా అందించాలి
  choice: నూతన సృష్టి
  alternative: ఆ వ్యక్తి నూతన సృష్టి
  rationale: గ్రీకులో స్పష్టమైన క్రియగానీ, వ్యక్తిని సూచించే సర్వనామంగానీ లేదు. అందువల్ల ప్రధాన పాఠం దాని ఉద్దేశపూర్వక సంక్షిప్తతను, వ్యక్తిగత మరియు విస్తృత నూతన సృష్టి భావాల మధ్యనున్న ఉద్వేగాన్ని నిలుపుతుంది; వ్యక్తిని ఉద్దేశించిన పఠనం పాదసూచికలో ఇవ్వబడింది.
- issue: καινάతో ‘అన్నీ’ని చేర్చాలా
  choice: కొత్తవి వచ్చాయి
  alternative: అన్నీ కొత్తవయ్యాయి
  rationale: SBLGNT పాఠంలో καινά మాత్రమే ఉంది; ‘అన్నీ’ అనే స్పష్టమైన పదం లేదు. కాబట్టి దానిని ప్రధాన పాఠంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. మూలంలోని సంక్షిప్తతను నిలుపడానికి దీర్ఘవిరామం ఉపయోగించబడింది; ‘ఇదిగో’ ἰδοὺ యొక్క శ్రద్ధాకర్షక బలాన్ని అందిస్తుంది.
