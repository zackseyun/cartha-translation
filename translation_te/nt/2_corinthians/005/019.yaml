source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: te
  text: అంటే, దేవుడు మెస్సీయలో ఉండి లోకాన్ని తనతో సమాధానపరుస్తూ ఉన్నాడు[a]; వారి అపరాధాలను వారికి వ్యతిరేకంగా లెక్కించకుండా, సమాధానపరచుటకు సంబంధించిన సందేశాన్ని మాకు అప్పగించాడు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెస్సీయలో దేవుడు లోకాన్ని తనతో సమాధానపరుస్తూ ఉన్నాడు.”
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “మనలో ఉంచాడు”; సందర్భానుసారంగా, “మన మధ్య ఉంచాడు” లేదా “మాకు అప్పగించాడు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “సమాధానపరచుట గురించిన వాక్యం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ὅτι
  choice: అంటే
  rationale: ముందటి ప్రకటనను వివరించే సూత్రంగా సహజమైన ఆధునిక తెలుగు పదాన్ని వాడింది.
- source_word: θεὸς ἦν ἐν Χριστῷ
  choice: దేవుడు మెస్సీయలో ఉండి
  rationale: ἐν అనే పదంలోని ‘లో’ భావాన్ని నిలిపి, దేవుని కార్యం మెస్సీయలో/మెస్సీయ ద్వారా జరిగిందనే వాక్యంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను వ్యాఖ్యానంతో తొలగించలేదు.
- source_word: Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ దాని బిరుదు భావాన్ని సాధారణ తెలుగు పాఠకులకు గుర్తించదగిన రూపంలో నిలుపుతుంది.
- source_word: κόσμον
  choice: లోకాన్ని
  rationale: మానవ లోకాన్ని విస్తృతంగా సూచించే సహజమైన, సంప్రదాయబద్ధమైన తెలుగు సమానార్థకం.
- source_word: καταλλάσσων
  choice: సమాధానపరుస్తూ ఉన్నాడు
  rationale: కొనసాగుతున్న దైవిక కార్యాన్ని తెలిపే వర్తమాన కృదంత భావాన్ని, తరువాతి καταλλαγήతో పదసంబంధం కనిపించేలా అనువదించింది.
- source_word: ἑαυτῷ
  choice: తనతో
  rationale: సమాధానం దేవునితోనే ఏర్పడుతున్న దిశను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μὴ λογιζόμενος
  choice: లెక్కించకుండా
  rationale: λογίζομαιలోని లెక్కింపు రూపకాన్ని భారమైన సిద్ధాంతపరమైన పదజాలం లేకుండా నిలుపుతుంది.
- source_word: παραπτώματα
  choice: అపరాధాలను
  rationale: తప్పిదాలు లేదా హద్దుమీరిన కార్యాలు అనే సంబంధాత్మక భావాన్ని ‘పాపాలు’ అనే విస్తృత పదం కంటే స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: θέμενος ἐν ἡμῖν
  choice: మాకు అప్పగించాడు
  rationale: అక్షరార్థమైన ‘మనలో ఉంచాడు’ అనే గ్రీకు నుడికారాన్ని సందర్భానుసారంగా సహజ తెలుగులో తెలిపింది; అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: సమాధానపరచే సందేశాన్ని
  rationale: λόγος ఇక్కడ ప్రకటించబడే విషయాన్ని సూచిస్తుంది; ‘సందేశం’ ఆధునిక తెలుగులో స్పష్టంగా ఉండగా, ‘సమాధానపరచే’ పదం καταλλάσσω/καταλλαγή పదబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: θεὸς ἦν ἐν Χριστῷ అనే వాక్య నిర్మాణం
  choice: దేవుడు మెస్సీయలో ఉండి లోకాన్ని తనతో సమాధానపరుస్తూ ఉన్నాడు
  alternative: మెస్సీయలో దేవుడు లోకాన్ని తనతో సమాధానపరుస్తూ ఉన్నాడు
  rationale: ప్రధాన పాఠం గ్రీకు పదక్రమంలోని ‘దేవుడు ... మెస్సీయలో ఉండి’ అనే భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ నిర్మాణం ἦνను సహాయక క్రియగా గ్రహించే అవకాశాన్ని చూపుతుంది.
- issue: Χριστῷ అనే బిరుదు
  choice: మెస్సీయలో
  alternative: క్రీస్తులో; అభిషిక్తునిలో
  rationale: ఇక్కడ పదం పేరు కంటే బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని గుర్తించదగిన, మతశాఖాపరంగా తటస్థమైన రూపంలో ఉంచుతుంది.
- issue: θέμενος ἐν ἡμῖν యొక్క భావం
  choice: మాకు అప్పగించాడు
  alternative: మనలో ఉంచాడు; మన మధ్య ఉంచాడు
  rationale: సందేశాన్ని అపొస్తలులకు బాధ్యతగా ఇచ్చాడనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తూనే, గ్రీకులోని ἐν వల్ల సాధ్యమయ్యే ఇతర భావాలను పాదసూచికలో కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడింది. ‘లెక్కించకుండా’ అనే రూపకం, ‘మెస్సీయలో’ అనే వాక్యంలోని ధార్మిక ఉద్రిక్తత, ‘మనలో/మాకు’ అనే గ్రీకు అస్పష్టత పాదసూచికలతో నిలుపబడ్డాయి.
