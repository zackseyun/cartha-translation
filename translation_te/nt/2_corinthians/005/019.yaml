  to: అంటే, దేవుడు మెస్సీయలో ఉండి లోకాన్ని తనతో సమాధానపరుస్తూ ఉన్నాడు[a]; వారి అపరాధాలను వారికి వ్యతిరేకంగా లెక్కించకుండా, సమాధానపరచుటకు సంబంధించిన సందేశాన్ని మాకు అప్పగించాడు[b][c].
