revisions:
- from: ఎందుకంటే నిజంగా, ఈ గుడారంలో ఉన్న మనం భారంతో నలిగిపోతూ మూలుగుతున్నాం. మనం వస్త్రాన్ని తీసివేసుకోవాలని కాదు, దానిపై మరొక వస్త్రాన్ని ధరించుకోవాలని[a] కోరుతున్నాం; తద్వారా మర్త్యమైనది[b] జీవం చేత మింగివేయబడాలి.
  to: ఎందుకంటే నిజంగా, ఈ గుడారంలో ఉన్న మనం భారంతో నలిగిపోతూ మూలుగుతున్నాం; వస్త్రాన్ని తీసివేసుకోవాలని మనకు ఇష్టం లేదు గాని, దానిపై మరొక వస్త్రాన్ని ధరించుకోవాలని[a] కోరుకుంటున్నాం, తద్వారా మర్త్యమైనది[b] జీవం చేత మింగివేయబడేలా.
