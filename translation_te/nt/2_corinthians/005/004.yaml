id: 2CO.5.4
reference: 2 Corinthians 5:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: te
  text: ఎందుకంటే నిజంగా, ఈ గుడారంలో ఉన్న మనం భారంతో నలిగిపోతూ మూలుగుతున్నాం; వస్త్రాన్ని తీసివేసుకోవాలని మనకు ఇష్టం లేదు గాని, దానిపై మరొక వస్త్రాన్ని ధరించుకోవాలని[a] కోరుకుంటున్నాం, తద్వారా మర్త్యమైనది[b] జీవం చేత మింగివేయబడేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వస్త్రంపై మరొక వస్త్రాన్ని ధరించుకోవాలని.’ గ్రీకు క్రియ ఇప్పటికే ధరించిన వస్త్రంపై ఇంకొక వస్త్రాన్ని వేసుకోవడం అనే భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మర్త్యత్వం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ఎందుకంటే నిజంగా
  rationale: ముందటి వాదనతో ఉన్న వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’ తెలియజేస్తుంది; ‘నిజంగా’ గ్రీకు పదబంధంలోని ఉద్ఘాటనను నిలుపుతుంది.
- source_word: σκήνει
  choice: గుడారంలో
  rationale: ప్రస్తుత శరీర అస్తిత్వానికి పౌలు వాడిన రూపకాన్ని అలాగే ఉంచి, చుట్టుపక్కల వచనాలతో అనుసంధానిస్తుంది.
- source_word: στενάζομεν
  choice: మూలుగుతున్నాం
  rationale: ‘నిట్టూరుస్తున్నాం’ కంటే భారాన్ని, తీవ్రమైన ఆకాంక్షను బలంగా తెలియజేస్తుంది.
- source_word: βαρούμενοι
  choice: భారంతో నలిగిపోతూ
  rationale: క్రియలోని కర్మణి భావాన్నీ, మూలుగుతున్న స్థితికి కారణమైన భారాన్నీ సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐφ’ ᾧ
  choice: కోరుతున్నాం అనే కారణసంబంధంగా వాక్య నిర్మాణంలో వ్యక్తీకరించబడింది
  rationale: ఈ పదబంధం మూలుగడానికి గల కారణాన్ని పరిచయం చేస్తుంది; తెలుగులో వాక్యాల అనుసంధానం ద్వారా ఆ సంబంధం సహజంగా తెలుస్తుంది.
- source_word: ἐκδύσασθαι
  choice: వస్త్రాన్ని తీసివేసుకోవాలని
  rationale: గ్రీకులోని వస్త్ర రూపకాన్ని సిద్ధాంతపరంగా విప్పి చెప్పకుండా నిలుపుతుంది.
- source_word: ἐπενδύσασθαι
  choice: దానిపై మరొక వస్త్రాన్ని ధరించుకోవాలని
  rationale: ఇప్పటికే ధరించినదానిపై ఇంకొక వస్త్రాన్ని వేసుకోవడం అనే ఉపసర్గతో కూడిన గ్రీకు క్రియ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: καταποθῇ
  choice: మింగివేయబడాలి
  rationale: పూర్తిగా జయించబడటం లేదా అంతరించిపోవడం అనే సజీవ రూపకాన్ని కర్మణి రూపంతో నిలుపుతుంది.
- source_word: τὸ θνητόν
  choice: మర్త్యమైనది
  rationale: నపుంసకలింగ విశేషణం నామవాచకంగా వాడబడిన విస్తృత భావాన్ని కాపాడుతుంది; దానిని కేవలం ‘శరీరం’గా పరిమితం చేయదు.
- source_word: ζωῆς
  choice: జీవం
  rationale: మర్త్యమైనదానికి విరుద్ధంగా ఉన్న మూలపాఠంలోని సంక్షిప్తమైన, శక్తివంతమైన భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: పౌలు వాడిన వస్త్ర రూపకం మరియు మధ్యస్థితి
  choice: ‘వస్త్రాన్ని తీసివేసుకోవడం’, ‘దానిపై మరొక వస్త్రాన్ని ధరించుకోవడం’ అనే రూపకాలను సిద్ధాంతపరంగా నిర్వచించకుండా నిలుపడం
  alternative: ‘వస్త్రాన్ని తీసివేసుకోవడం’ అంటే శరీరరహిత స్థితి అని, లేదా ‘మరొక వస్త్రాన్ని ధరించడం’ అంటే పునరుత్థాన శరీరం మాత్రమే అని స్పష్టీకరించడం
  rationale: గ్రీకు పాఠం శరీర అస్తిత్వం, రాబోయే రూపాంతరం గురించి రూపకాలతో మాట్లాడుతుంది. అనువాదం వివాదాస్పదమైన మధ్యస్థితి సిద్ధాంతాన్ని నిర్ణయించకుండా అసలు పాఠంలోని ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. సమూహాన్ని సహజంగా సూచించేందుకు ‘మనం’ వాడబడింది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు వాటికి సంబంధించిన పదబంధాల వద్ద ఉంచబడ్డాయి.
