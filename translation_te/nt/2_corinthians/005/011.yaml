source:
  edition: SBLGNT
  text: Εἰδότες οὖν τὸν φόβον τοῦ κυρίου ἀνθρώπους πείθομεν, θεῷ δὲ πεφανερώμεθα· ἐλπίζω δὲ καὶ ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: te
  text: కాబట్టి, ప్రభువు పట్ల భయం ఎరిగినవారమై[a], మేము మనుష్యులను ఒప్పిస్తున్నాము. కానీ దేవునికి మేము బహిర్గతమయ్యాము[b]; మీ మనస్సాక్షులలో కూడా మేము బహిర్గతమయ్యామని ఆశిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రభువు పట్ల భయం’ అనే మాటను, ముఖ్యంగా ముందటి వచనంలోని తీర్పాసన సందర్భంలో, ప్రభువు ఎదుట భక్తిపూర్వక విస్మయం మరియు జవాబుదారీతనంతో కూడిన భయంగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవునికి మేము వెల్లడయ్యాము; మీ మనస్సాక్షులలో కూడా మేము వెల్లడయ్యామని ఆశిస్తున్నాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰδότες οὖν
  choice: కాబట్టి ... ఎరిగినవారమై
  rationale: οὖν ముందున్న తీర్పాసన సందర్భం నుంచి వచ్చే నిర్ణయాన్ని సూచిస్తుంది; perfect participle Εἰδότες వర్తమాన జ్ఞానస్థితిని, ప్రధాన క్రియతో దాని అనుబంధాన్ని నిలుపుతుంది.
- source_word: τὸν φόβον τοῦ κυρίου
  choice: ప్రభువు పట్ల భయం
  rationale: మునుపటి వచనంలోని తీర్పు సందర్భాన్ని బట్టి ‘భయం’ అనే బలమైన భావాన్ని తగ్గించకుండా ఉంచుతుంది; ఇందులో భక్తిపూర్వక విస్మయం, జవాబుదారీతనం రెండూ ఉండవచ్చు.
- source_word: ἀνθρώπους πείθομεν
  choice: మేము మనుష్యులను ఒప్పిస్తున్నాము
  rationale: ἀνθρώπους ఇక్కడ సాధారణంగా ప్రజలను సూచిస్తుంది; πείθομεν యొక్క వర్తమాన క్రియారూపాన్ని నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: అయితే మేము దేవునికి స్పష్టంగా వెల్లడయ్యాము
  rationale: φανερόω perfect passive రూపంలోని వెల్లడికావడం మరియు దాని కొనసాగుతున్న ఫలితాన్ని నిలుపుతూ, దైవకర్తను చేర్చకుండా గ్రీకు దత్తివిభక్తి ‘దేవునికి’ని అనుసరిస్తుంది.
- source_word: ἐλπίζω
  choice: ఆశిస్తున్నాను
  rationale: పౌలు వ్యక్తిగతంగా వ్యక్తం చేస్తున్న నిరీక్షణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν
  choice: మీ మనస్సాక్షులకు
  rationale: కొరింథీయుల అంతరంగ నైతిక అవగాహనను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘వెల్లడయ్యాము’తో సహజంగా కలవడానికి దత్తివాచక రూపం వాడబడింది; గ్రీకులోని బహువచన భావం ‘మీ’ ద్వారా సమూహంలోని వ్యక్తులను కలుపుతుంది.
- source_word: πεφανερῶσθαι
  choice: స్పష్టంగా వెల్లడయ్యామని
  rationale: మొదటి πεφανερώμεθαతో పదబంధ సమాంతరతను నిలుపుతూ perfect passive యొక్క ఫలితస్థితిని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ప్రభువు పట్ల భయం’ యొక్క భావం
  choice: ‘భయం’ అనే పదాన్ని నిలుపుతూ, భక్తిపూర్వక విస్మయం కూడా సాధ్యమని పాదటిప్పణిలో సూచించడం
  alternative: ప్రభువు పట్ల భక్తిపూర్వక గౌరవం
  rationale: 2 కొరింథీయులు 5:10లోని తీర్పాసన సందర్భం భయం, విస్మయం, జవాబుదారీతనం కలిసిన భావాన్ని అనుమతిస్తుంది. ‘గౌరవం’ మాత్రమే అనడం వచన బలాన్ని తగ్గించవచ్చు.
- issue: దేవునికి మరియు కొరింథీయుల మనస్సాక్షులకు φανερόω యొక్క భావం
  choice: స్పష్టంగా వెల్లడయ్యాము
  alternative: బయలుపరచబడ్డాము; తెలిసినవారమయ్యాము
  rationale: పౌలు మరియు అతని సేవ దేవునికి పూర్తిగా బహిర్గతమై ఉన్నాయనే భావాన్ని, అలాగే కొరింథీయుల అంతరంగ అవగాహనలోనూ అదే స్పష్టత ఉండాలనే ఆశను అదనపు సిద్ధాంతార్థం లేకుండా వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని తార్కిక అనుసంధానం, క్రియల సమాంతరత, perfect passive ఫలితభావం సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
