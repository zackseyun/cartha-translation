revisions:
- from: కాబట్టి ఇకనుంచి మేము ఎవరినీ శరీరాన్ని బట్టి చూడము[a]. మేము మెస్సీయను[b] శరీరాన్ని బట్టి తెలుసుకొని ఉన్నా, ఇప్పుడు ఇక ఆయనను ఆ విధంగా తెలుసుకోము.
  to: కాబట్టి ఇకనుంచి మేము ఎవరినీ శరీరాన్ని బట్టి పరిగణించము[a]. మేము మెస్సీయను[b] శరీరాన్ని బట్టి తెలుసుకున్నప్పటికీ, ఇప్పుడు ఇక ఆ విధంగా ఆయనను తెలుసుకోము.
  rationale: 'The revision makes the first verb explicitly evaluative, improves the concessive perfect clause in natural modern Telugu, and corrects the Greek transliteration in the footnote. It retains the source’s theological and lexical ambiguity: ‘శరీరాన్ని బట్టి’ remains in the text, while the note supplies contextual alternatives without making the phrase deny the Messiah’s humanity or impose a doctrinal interpretation.'
