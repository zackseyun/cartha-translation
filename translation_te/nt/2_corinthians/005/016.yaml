id: 2CO.5.16
reference: 2 Corinthians 5:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: te
  text: కాబట్టి ఇకనుంచి మేము ఎవరినీ శరీరాన్ని బట్టి పరిగణించము[a]. మేము మెస్సీయను[b] శరీరాన్ని బట్టి తెలుసుకున్నప్పటికీ, ఇప్పుడు ఇక ఆ విధంగా ఆయనను తెలుసుకోము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మానవ దృష్టితో’ లేదా ‘లోకసంబంధ ప్రమాణాల ప్రకారం.’ ఇక్కడ ‘శరీరాన్ని బట్టి’ అంటే కేవలం మానవ, భౌతిక ప్రమాణాలతో పరిగణించడం.
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు: ‘ఖ్రిస్టోన్’ (Χριστόν); సంప్రదాయంగా ‘క్రీస్తు.’ ఇక్కడ బిరుదు యొక్క అర్థాన్ని నిలుపడానికి ‘మెస్సీయ’ అని అనువదించబడింది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: కాబట్టి
  rationale: ముందున్న వాదననుంచి తీసుకున్న నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπὸ τοῦ νῦν
  choice: ఇకనుంచి
  rationale: ప్రస్తుత క్షణం మొదలుకొని కొనసాగనున్న మార్పును సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐδένα
  choice: ఎవరినీ
  rationale: వ్యక్తుల విషయంలో మినహాయింపు లేదనే గ్రీకు భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: οἴδαμεν
  choice: చూడము
  rationale: κατὰ σάρκα అనే విధసూచక పదబంధంతో కలిసినప్పుడు ఇక్కడ కేవలం సమాచారం తెలుసుకోవడం కాక, ఒకరిని ఒక నిర్దిష్ట దృష్టితో పరిగణించడం అనే సందర్భార్థం ఉంది. తెలుగులో ‘శరీరాన్ని బట్టి చూడము’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: κατὰ σάρκα
  choice: శరీరాన్ని బట్టి
  rationale: పౌలు వాడిన σάρξ పదాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, కేవలం మానవ లేదా లోకసంబంధ ప్రమాణాల ప్రకారం చూడడం అనే సందర్భార్థానికి తెలుగులో సహజమైన రూపం ఇస్తుంది.
- source_word: εἰ καὶ
  choice: …ఉన్నా
  rationale: గ్రీకులోని concessive భావాన్ని నిలుపుతుంది; ఇది తెలుగులో ‘అయినప్పటికీ’ లేదా సందర్భానుసారం ‘ఒకవేళ … అయినా’ అనే సూక్ష్మ ద్వంద్వసాధ్యతను పూర్తిగా మూసివేయదు.
- source_word: ἐγνώκαμεν
  choice: తెలుసుకొని ఉన్నా
  rationale: గతంలో ఏర్పడిన పరిచయం లేదా అవగాహనకు వర్తమాన సంబంధం ఉన్న పరిపూర్ణకాల భావాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: Χριστόν
  choice: మెస్సీయను
  rationale: Χριστός ఇక్కడ బిరుదుగా సూచించే ‘అభిషిక్తుడు/మెస్సీయ’ అనే అర్థాన్ని నిలుపుతుంది; దానిని కేవలం వ్యక్తినామంలా మార్చదు.
- source_word: ἀλλὰ νῦν οὐκέτι
  choice: ఇప్పుడు ఇక
  rationale: గత విధానానికి, ప్రస్తుత విధానానికి మధ్యనున్న బలమైన వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: γινώσκομεν
  choice: తెలుసుకోము
  rationale: ముందటి ‘తెలుసుకొని’ అనే భావసంబంధాన్ని నిలుపుతూ, ‘ఆ విధంగా’ అనే పదాలతో మారింది మెస్సీయ గురించిన జ్ఞానం కాదని, ఆయనను తెలుసుకునే విధానమని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: κατὰ σάρκα అనే పదబంధం ప్రజలకు, మెస్సీయకు ఎలా వర్తిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘శరీరాన్ని బట్టి’ అని ఉంచి, దానిని కేవలం మానవ లేదా లోకసంబంధ ప్రమాణాల ప్రకారం చూడడంగా అర్థం వచ్చేలా సందర్భాన్ని నిలుపడం
  alternative: ‘మానవ దృష్టితో’ లేదా ‘లోకసంబంధ ప్రమాణాల ప్రకారం’
  rationale: ఈ పదబంధం మెస్సీయ నిజమైన మానవత్వాన్ని నిరాకరించదు; వ్యక్తులను, మెస్సీయను కేవలం భౌతిక-మానవ ప్రమాణాలతో అంచనా వేసే పూర్వ విధానం ఇక సరిపోదని చెబుతుంది. ‘శరీరం’ అనే పౌలు పదాన్ని ఉంచడం మూలపాఠ్యంలోని ధార్మిక ఉద్వేగాన్ని కాపాడుతుంది.
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ గ్రీకు పదంలోని బిరుదు భావాన్ని స్పష్టంగా నిలుపుతుంది; ఏ ప్రత్యేక సంప్రదాయ వ్యాఖ్యానాన్నీ చేర్చదు.
- issue: εἰ καὶ యొక్క concessive స్వభావం
  choice: ‘తెలుసుకొని ఉన్నా’ అనే రూపం
  alternative: ‘తెలుసుకొని ఉన్నప్పటికీ’ లేదా ‘ఒకవేళ తెలుసుకొని ఉన్నా’
  rationale: గ్రీకు నిర్మాణాన్ని ఖచ్చితంగా ఒకే విధంగా—నిశ్చిత గత వాస్తవంగా గానీ, పూర్తిగా ఊహాత్మక షరతుగా గానీ—నిర్బంధించకుండా దాని సహజమైన concessive ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘శరీరాన్ని బట్టి’ అనే పదబంధం పౌలు పదజాలాన్ని కనిపించేలా ఉంచుతుంది; ‘చూడము’ మొదటి వాక్యంలో సందర్భార్థమైన పరిగణనను, ‘తెలుసుకోము’ రెండవ వాక్యంలో జ్ఞానసంబంధ క్రియను సహజంగా వ్యక్తం చేస్తాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
