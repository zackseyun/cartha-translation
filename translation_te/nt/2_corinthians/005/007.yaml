  yaml_path: translation/nt/2_corinthians/005/007.yaml
  text: For we walk by faith[a], not by sight—
translation:
  language: te
  text: ఎందుకంటే మనం విశ్వాసం ద్వారా నడుస్తున్నాం, కంటికి కనిపించేదాన్ని బట్టి కాదు[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కనిపించే రూపాన్ని బట్టి కాదు’ లేదా ‘బాహ్య రూపాన్ని బట్టి కాదు.’ గ్రీకు పదం కనిపించే రూపం, బాహ్య ఆకారం, లేదా కంటికి కనిపించేదాన్ని సూచించగలదు. ‘విశ్వాసం’తో ఉన్న వ్యతిరేకతను నిలుపడానికి ప్రధాన పాఠంలో ‘కంటికి కనిపించేదాన్ని బట్టి కాదు’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: విశ్వాసం ఆధారంగా
  rationale: διά + షష్ఠీ విభక్తి సాధనం లేదా విధానాన్ని సూచిస్తుంది. ఇక్కడ εἴδους‌తో ఉన్న వ్యతిరేక సమాంతరతను నిలుపుతూ, ‘విశ్వాసం ఆధారంగా’ అనేది సహజమైన ఆధునిక తెలుగు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందున్న వాక్యానికి వివరణాత్మక ఆధారాన్ని ఇస్తుంది; ‘ఎందుకంటే’ ఆ అనుసంధానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: περιπατοῦμεν
  choice: మనం ... నడుస్తున్నాం
  rationale: περιπατέω యొక్క ‘నడవడం’ అనే రూపకాన్ని నిలుపుతుంది; సందర్భంలో ఇది జీవన విధానాన్ని కూడా సూచిస్తుంది.
- source_word: οὐ διὰ εἴδους
  choice: చూపు ఆధారంగా కాదు
  rationale: εἶδος కనిపించే రూపం, దృశ్యం లేదా కనిపించేది అనే అర్థాలు కలిగి ఉంది. విశ్వాసంతో ఉన్న సంక్షిప్త వ్యతిరేకతలో ‘చూపు’ సహజంగా ఉండి మూలంలోని భావవిస్తృతిని చాలావరకు నిలుపుతుంది.
theological_decisions:
- issue: పౌలు వాడిన πίστις పదానికి అనువాదం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఈ వాక్యంలో πίστις, εἶδος‌కు వ్యతిరేకంగా ఉంది; అందువల్ల ఇక్కడ ‘విశ్వాసం’ అనేది కనిపించేదానిపై ఆధారపడని నమ్మకాన్ని సూచిస్తుంది. ‘విశ్వసనీయత’ ఈ సందర్భానికి తక్కువ సరిపోతుంది.
translation_notes:
  register: సహజమైన, ఆధునిక ప్రామాణిక తెలుగు వాడబడింది. ‘నడుస్తున్నాం’ అనే మూల రూపకం అలాగే ఉంచబడింది; ‘ఆధారంగా’ అనే పదం రెండు భాగాల్లో సమాంతరతను స్పష్టం చేస్తుంది. మూలంలోని అసంపూర్ణ కొనసాగింపును సూచించే దీర్ఘ గీత కూడా నిలుపబడింది.
