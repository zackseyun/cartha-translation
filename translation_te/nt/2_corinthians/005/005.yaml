reference: 2 Corinthians 5:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ κατεργασάμενος ἡμᾶς εἰς αὐτὸ τοῦτο θεός, ⸀ὁ δοὺς ἡμῖν τὸν ἀρραβῶνα τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: te
  text: ఈ సంగతికోసమే మనలను సిద్ధపరచినవాడు దేవుడు; ఆయన మనకు ఆత్మ యొక్క ముందస్తు చెల్లింపును[a][b] ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘హామీ’, ‘డిపాజిట్’, లేదా ‘మొదటి వాయిదా’.
    reason: lexical_alternative
  - marker: b
    text: ఈ పదబంధం ఆత్మయే ముందస్తు చెల్లింపు అని సూచించవచ్చు; లేదా ఆత్మతో సంబంధమున్న భవిష్యత్ నెరవేర్పుకు దేవుడు ఇచ్చిన హామీ అని అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: κατεργασάμενος
  choice: సిద్ధపరచినవాడు
  rationale: సందర్భంలో దేవుడు విశ్వాసులను రాబోయే దేహస్థితికి ఉద్దేశపూర్వకంగా రూపొందించి సిద్ధం చేశాడనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: εἰς αὐτὸ τοῦτο
  choice: ఈ సంగతికోసమే
  rationale: ముందటి వచనాల్లో చెప్పిన నిర్దిష్టమైన భవిష్యత్ వాస్తవాన్ని సూచిస్తూ, αὐτὸ τοῦτο లోని ఉద్ఘాటనను ‘-ఏ’ కాపాడుతుంది.
- source_word: θεός
  choice: దేవుడే
  rationale: గ్రీకులో ‘మనలను సిద్ధపరచినవాడు దేవుడు’ అనే గుర్తింపును తెలుగు వాక్యంలో సహజంగా, ఉద్ఘాటనతో అందిస్తుంది.
- source_word: δοὺς
  choice: ఆయనే ... ఇచ్చాడు
  rationale: కర్త దేవుడేనని స్పష్టంగా కొనసాగిస్తూ, గ్రీకు కృదంతాన్ని సహజమైన తెలుగు సమాపక క్రియగా వ్యక్తం చేస్తుంది.
- source_word: ἀρραβῶνα
  choice: ముందస్తు చెల్లింపు
  rationale: మిగిలినది తప్పక అందుతుందనే హామీని కలిగించే మొదటి చెల్లింపు అనే వాణిజ్య రూపకంలోని ప్రస్తుత భాగస్వామ్యాన్నీ భవిష్యత్ నెరవేర్పునీ నిలుపుతుంది.
- source_word: τοῦ πνεύματος
  choice: ఆత్మ అనే
  rationale: షష్ఠీ విభక్తిని వ్యాఖ్యానాత్మకంగా తీసుకొని ఆత్మయే ముందస్తు చెల్లింపు అనే సాధ్యమైన ప్రధాన భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయ సంబంధాన్ని పాదసూచనలో ఉంచుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్పమైన భావగమనాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేక సంధానపదం చేర్చకుండా వాక్యప్రవాహమే ఆ పనిని సహజంగా చేస్తుంది.
theological_decisions:
- issue: ‘ఆత్మ అనే ముందస్తు చెల్లింపు’ యొక్క అర్థం
  choice: దేవుడు ఇచ్చిన పరిశుద్ధాత్మయే భవిష్యత్ జీవితం నెరవేరుతుందనే ప్రస్తుత ముందస్తు చెల్లింపు లేదా హామీ.
  alternative: ఆత్మ స్వయంగా ముందస్తు చెల్లింపు కాకుండా, ఆత్మ నెరవేర్చబోయేదానికి దేవుడు ఇచ్చిన హామీ అని కూడా ఈ పదబంధాన్ని అర్థం చేసుకోవచ్చు.
  rationale: పౌలు ఇతర చోట్ల ఉపయోగించిన సమాన భాష ఆత్మయే ఇవ్వబడిన హామీ అని బలంగా సూచిస్తుంది; అయినా గ్రీకు షష్ఠీ సంబంధంలోని భావసాధ్యతను పాదసూచనలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ముందస్తు చెల్లింపు’ వాణిజ్య రూపకాన్ని స్పష్టంగా ఉంచుతుంది; పాదసూచనలు పదార్థ వైవిధ్యాన్నీ వేదాంతపరమైన సందిగ్ధతనూ సంరక్షిస్తాయి.
