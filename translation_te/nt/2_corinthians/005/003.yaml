translation:
  language: te
  text: మనం నిజంగా వస్త్రం ధరించుకొని ఉంటే[a], నగ్నులుగా కనబడము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనం నిజంగా వస్త్రం ధరించుకొని ఉంటే, వస్త్రహీనులుగా కనబడము.”
    reason: ‘నగ్నులుగా’కు బదులుగా ‘వస్త్రహీనులుగా’ అనే పదాన్ని ఉపయోగించే సాధ్యమైన అనువాదం; మూలంలో సూచ్యంగా ఉన్న వస్త్రధారణను అలాగే ఉంచుతుంది.
lexical_decisions:
- source_word: εἴ γε
  choice: నిజంగా … అయితే
  rationale: εἰ లోని షరతు భావాన్నీ, γε ఇచ్చే బలపరిచే భావాన్నీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: καὶ
  choice: ప్రత్యేక పదంగా అనువదించకుండా వాక్య నిర్మాణంలో అంతర్భావం
  rationale: ఇక్కడ καί భాగవాచక క్రియతో అనుసంధానమై ఉంది; దాన్ని ‘కూడా’ లేదా ‘సైతం’ అని విడిగా అనువదిస్తే తెలుగులో అనవసరమైన అర్థభారం ఏర్పడుతుంది.
- source_word: ἐνδυσάμενοι
  choice: వస్త్రం ధరించినవారమైతే
  rationale: ఇది ‘ధరించుకోవడం’ అనే వస్త్ర రూపకాన్ని నిలుపుతూ, aorist middle participle ను ప్రధాన షరతు వాక్యంతో సహజంగా అనుసంధానిస్తుంది. గ్రీకులో కర్మ స్పష్టంగా చెప్పబడనందున నిర్దిష్ట వస్తువు లేదా శరీరం అని చేర్చలేదు.
- source_word: οὐ
  choice: కనబడము
  rationale: తెలుగులో నిషేధం క్రియారూపంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: γυμνοὶ
  choice: నగ్నులుగా
  rationale: మూలపదానికి నేరమైన అర్థాన్ని ఇస్తూ పౌలు ఉపయోగించిన వస్త్ర రూపకాన్ని అలాగే ఉంచుతుంది.
- source_word: εὑρεθησόμεθα
  choice: కనబడము
  rationale: భవిష్యత్ కర్మణి రూపంలోని ‘మేము కనబడతాము’ అనే భావాన్ని నిషేధంతో కలిపి సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: వస్త్రధారణ, నగ్నత్వం అనే రూపకాల భావం
  choice: రూపకాలను వివరణాత్మకంగా విప్పకుండా అలాగే ఉంచడం
  alternative: ‘నగ్నత్వం’ అంటే దేహరహిత మధ్యస్థితి, పరలోక శరీరం లేకపోవడం, లేదా దేవుని ఎదుట అవమానం అని నిర్దిష్టీకరించడం
  rationale: ఈ వచనం రూపకాల పూర్తి తాత్త్విక సూచనను స్పష్టంగా నిర్వచించదు. అందువల్ల ఏ ఒక్క సిద్ధాంతపరమైన అర్థాన్నీ అనువాదంలో చేర్చకుండా మూలంలోని అస్పష్టతను, ఉద్విగ్నతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరమైన శైలిలో ఉంది. షరతు భావం, వస్త్ర రూపకం, భవిష్యత్ భావం నిలుపబడ్డాయి.
