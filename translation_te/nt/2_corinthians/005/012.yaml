id: 2CO.5.12
reference: 2 Corinthians 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: te
  text: మేము మళ్లీ మమ్మల్ని మేమే మీకు సిఫారసు చేసుకోవడం లేదు; బదులుగా, మా గురించి గొప్పగా చెప్పుకోవడానికి మీకు ఒక అవకాశం ఇస్తున్నాం[a], తద్వారా పైకి కనిపించేదానిలో గొప్పలు చెప్పుకొని హృదయంలో కాక గొప్పలు చెప్పుకునేవారికి మీరు జవాబు చెప్పగలిగేలా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మా పక్షంగా గొప్పగా చెప్పుకోవడానికి మీకు ఒక ఆధారం ఇస్తున్నాం.’
    reason: ὑπὲρ ἡμῶνకు ‘మా పక్షంగా’ అనే ప్రాతినిధ్య/సమర్థన భావం, ἀφορμήకి ‘ఆధారం’ లేదా ‘సందర్భం’ అనే భావం కూడా ఉండవచ్చు.
  - marker: b
    text: అక్షరార్థంగా, ‘ముఖంలో గొప్పలు చెప్పుకునేవారు, హృదయంలో కాదు’; ఇది హృదయానికి విరుద్ధంగా బాహ్య రూపం లేదా కనిపించే విషయాలలో గొప్పలు చెప్పుకోవడాన్ని సూచిస్తుంది.
    reason: ἐν προσώπῳ ... καὶ μὴ ἐν καρδίᾳ అనే గ్రీకు వ్యతిరేకతలోని రూపకాన్ని తెలియజేస్తూ, దాని సందర్భానుగుణమైన విస్తృతిని కాపాడుతుంది.
lexical_decisions:
- source_word: συνιστάνομεν
  choice: సిఫారసు చేసుకోవడం
  rationale: ఈ సందర్భంలో తమ యోగ్యతను తామే నిరూపించుకోవడం లేదా తమను తాము ప్రశంసించుకోవడం అనే భావం ఉంది. ‘సిఫారసు చేసుకోవడం’ సంబంధపరమైన భావాన్ని నిలుపుతూ సహజమైన తెలుగులో ఉంది.
- source_word: ἀφορμὴν
  choice: అవకాశం
  rationale: ఈ పదానికి సందర్భం, ఆధారం, అవకాశం అనే భావాలు ఉన్నాయి. కొరింథీయులు పౌలు పక్షంగా మాట్లాడేందుకు ఆయన వారికి వీలు కల్పిస్తున్నాడనే భావాన్ని ‘అవకాశం’ సహజంగా తెలియజేస్తుంది.
- source_word: καυχήματος
  choice: గొప్పగా చెప్పుకోవడానికి
  rationale: καύχημα అనే పదం అతిశయం, గర్వంగా చెప్పుకోవడం, ప్రశంసగా చెప్పుకోవడం అనే అర్థపరిధిని కలిగి ఉంది. ఇక్కడ అది తప్పనిసరిగా దోషపూరిత గర్వం కాదు; అందువల్ల సాధారణ పాఠకులకు స్పష్టమైన ఈ రూపం ఎంచుకోబడింది.
- source_word: ὑπὲρ ἡμῶν
  choice: మా గురించి
  rationale: ὑπέρ ఇక్కడ ‘మా గురించి’ లేదా ‘మా పక్షంగా’ అనే రెండింటి ఛాయను కలిగి ఉండవచ్చు. ప్రధాన వాక్యంలో సహజమైన ‘మా గురించి’ ఉంచి, పక్షంగా మాట్లాడే సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: ἵνα ἔχητε πρὸς
  choice: మీరు జవాబు చెప్పగలిగేలా
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘వారిపట్ల మీకు ఏదో ఉండేలా’ ఉన్నా, సందర్భంలో ప్రతివాదులకు చెప్పడానికి సమాధానం ఉండడం అనే అంతర్లీన భావాన్ని ఇది తెలియజేస్తుంది.
- source_word: ἐν προσώπῳ
  choice: పైకి కనిపించేదాన్ని బట్టి
  rationale: అక్షరార్థమైన ‘ముఖంలో’ అనే రూపం తెలుగులో ఉద్దేశాన్ని స్పష్టంగా ఇవ్వదు. హృదయంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతూ బాహ్యంగా కనిపించే అంశాల భావాన్ని ఈ అనువాదం అందిస్తుంది.
- source_word: καυχωμένους
  choice: గొప్పలు చెప్పుకునేవారు
  rationale: ముందున్న καύχημα పదంతో ఉన్న పదబంధ సంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది; అలాగే సందర్భంలోని ఆత్మప్రదర్శన భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: καρδίᾳ
  choice: హృదయంలో ఉన్నదాన్ని బట్టి
  rationale: ‘హృదయం’ అనే మూల రూపాన్ని నిలుపుతూ, బాహ్య రూపానికి విరుద్ధంగా అంతరంగ వాస్తవికతను సూచిస్తుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: చర్య పునరావృతమవుతున్నదనే పౌలు నిరాకరణను నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: ἐν προσώπῳ ... καὶ μὴ ἐν καρδίᾳ అనే వ్యత్యాసం
  choice: పైకి కనిపించేది మరియు హృదయంలో ఉన్నది మధ్య వ్యత్యాసం
  alternative: ప్రజల మధ్య పేరు ప్రతిష్ఠ మరియు అంతరంగ నిజాయితీ మధ్య వ్యత్యాసం; లేదా ముఖాముఖి హాజరు మరియు అంతరంగ వైఖరి మధ్య వ్యత్యాసం
  rationale: గ్రీకు వాక్యం బాహ్యమైనదాన్ని ‘హృదయం’తో వ్యతిరేకిస్తుంది. ప్రధాన అనువాదం ఈ నైతిక, అంతరంగ వ్యత్యాసాన్ని నిలుపుతుంది; అయితే దాన్ని ఒక నిర్దిష్ట సిద్ధాంత వ్యాఖ్యానానికి పరిమితం చేయదు.
- issue: ὑπὲρ ἡμῶν యొక్క సంబంధార్థం
  choice: మా గురించి
  alternative: మా పక్షంగా
  rationale: ఈ సందర్భంలో విషయం గురించి గొప్పగా చెప్పుకోవడం మరియు వారి పక్షంగా సమాధానం చెప్పడం రెండూ దగ్గరగా ఉన్నాయి. ప్రధాన పాఠ్యంలో సాధారణ సంబంధార్థాన్ని ఉంచి, ప్రాతినిధ్య లేదా సమర్థన భావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘అతిశయించు’ కంటే ‘గొప్పగా చెప్పుకోవడం/గొప్పలు చెప్పుకోవడం’ సహజంగా ఉండటంతో దాన్ని ఎంచుకున్నాం; అయితే పౌలు తన గురించి సానుకూలంగా చెప్పుకునే అవకాశం మరియు ప్రత్యర్థుల బాహ్య ఆత్మప్రదర్శన మధ్య తేడాను సందర్భం స్పష్టం చేస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
