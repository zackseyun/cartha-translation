id: 2CO.5.10
reference: 2 Corinthians 5:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: te
  text: ఎందుకంటే మనమందరం మెస్సీయ[a] న్యాయపీఠం ఎదుట బహిర్గతం కావాలి[b], తద్వారా ప్రతి ఒక్కరూ తాను శరీరం ద్వారా చేసినది మంచిదైనా చెడ్డదైనా, దానికి తగినదాన్ని పొందుతాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘క్రీస్తు’; ఇక్కడ Χριστός ఒక బిరుదుగా ఉన్నందున దాని అర్థమైన ‘మెస్సీయ’ అని అనువదించాం.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘ప్రత్యక్షం కావాలి.’ గ్రీకు క్రియ కేవలం హాజరు కావడాన్నీ, బహిరంగంగా వెల్లడికావడాన్నీ సూచించగలదు; ప్రధాన పాఠం రెండవ, బలమైన భావాన్ని ఉంచుతుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘శరీరంలో ఉన్నప్పుడు చేసినదానికి తగినదాన్ని పొందుతాడు’; గ్రీకు పదబంధాన్ని మరింత అక్షరార్థంగా ‘శరీరం ద్వారా చేసినవి’ అని చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: బహిర్గతం కావాలి
  rationale: ఈ కర్మణి క్రియ కేవలం అక్కడ హాజరు కావడమే కాకుండా, ఒకరి నిజస్థితి బహిరంగంగా వెల్లడికావడం అనే బలమైన భావాన్ని కూడా ఇస్తుంది. న్యాయవిచారణ సందర్భంలోని ఆ భావాన్ని ఈ పదబంధం కాపాడుతుంది.
- source_word: βήματος
  choice: న్యాయపీఠం
  rationale: βῆμα ఇక్కడ తీర్పు లేదా మూల్యాంకనం జరిగే న్యాయాధికార వేదికను సూచిస్తుంది. ‘న్యాయపీఠం’ సహజమైన, గంభీరమైన తెలుగు పదం.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తోంది; అందువల్ల దాని అర్థమైన ‘మెస్సీయ’ను ఉపయోగించాం.
- source_word: κομίσηται
  choice: తగిన ఫలాన్ని పొందుతారు
  rationale: ఈ సందర్భంలో క్రియ ఒకరి క్రియలకు అనుగుణమైన ఫలాన్ని తిరిగి పొందడం అనే ప్రతిఫల భావాన్ని కలిగి ఉంది. ‘తగిన’ అనే పదం πρὸς ἃ తెలిపే అనుగుణతను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰ διὰ τοῦ σώματος
  choice: శరీరం ద్వారా చేసినదానికి
  rationale: διά + షష్ఠీ విభక్తి సాధనార్థకమైన ‘ద్వారా’ భావాన్ని సహజంగా అనుమతిస్తుంది. ఇది శరీరధారిగా గడిపిన జీవితంలో చేసిన క్రియలను సూచించే గ్రీకు సంక్షిప్త నిర్మాణాన్ని సాధ్యమైనంత వరకు నిలుపుతుంది.
- source_word: πρὸς ἃ ἔπραξεν
  choice: తాము చేసినదానికి అనుగుణంగా
  rationale: πρός ఇక్కడ క్రియలకు మరియు పొందే ఫలానికి మధ్య ఉన్న అనురూపతను సూచిస్తుంది. వ్యక్తిగత బాధ్యతను ἔπραξεν స్పష్టంగా ఉంచుతుంది.
- source_word: ἕκαστος
  choice: ప్రతి ఒక్కరూ
  rationale: ఈ పంపిణీ ఏకవచన భావం ప్రతి వ్యక్తి విడివిడిగా జవాబుదారీ అని నొక్కిచెబుతుంది; తెలుగులో ‘ప్రతి ఒక్కరూ’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἀγαθὸν … φαῦλον
  choice: మంచిదైనా చెడ్డదైనా
  rationale: ఈ పదజంట విస్తృతమైన నైతిక వ్యత్యాసాన్ని చూపుతుంది. φαῦλον‌ను తప్పనిసరిగా అత్యంత బలమైన ‘దుష్టమైనది’గా చేయకుండా ‘చెడ్డది’గా అనువదించడం దాని భావవిస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: మెస్సీయ న్యాయపీఠం ఎదుట జరిగే మూల్యాంకనం యొక్క పరిధి, ఫలితం
  choice: అందరూ బహిర్గతం కావడం, ప్రతి వ్యక్తి తన క్రియలకు అనుగుణమైన ఫలాన్ని పొందడం అనే వచనంలోని మాటలను మాత్రమే ఉంచాం.
  alternative: ఇది విశ్వాసుల బహుమానాల విచారణ మాత్రమే అని, లేదా సమస్త మానవుల అంతిమ తీర్పు అని అనువాదంలోనే నిర్దిష్టీకరించడం.
  rationale: ఈ వచనం న్యాయపరమైన గంభీరతను, సార్వత్రిక జవాబుదారీతనాన్ని స్పష్టంగా చెబుతుంది; అయితే ఆ తీర్పు పరిధి లేదా ప్రతి వర్గానికి కలిగే అంతిమ ఫలితాన్ని ఈ వచనం ఒక్కటే పూర్తిగా నిర్ణయించదు. అందువల్ల సిద్ధాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే న్యాయవిచారణ సందర్భానికి తగిన గంభీరతతో రచించాం. ‘బహిర్గతం కావాలి,’ ‘న్యాయపీఠం,’ ‘తగిన ఫలం’ వంటి పదాలు మూలంలోని న్యాయపరమైన మరియు నైతిక బలాన్ని నిలుపుతాయి; దీర్ఘమైన గ్రీకు వాక్యాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించాం.
