revisions:
- from: ఎందుకంటే మనమందరం మెస్సీయ[a] న్యాయపీఠం ఎదుట బహిర్గతం కావాలి[b]. అప్పుడు ప్రతి ఒక్కరూ తాము శరీరం ద్వారా చేసినదానికి అనుగుణంగా—అది మంచిదైనా చెడ్డదైనా—తగిన ఫలాన్ని పొందుతారు[c].
  to: ఎందుకంటే మనమందరం మెస్సీయ[a] న్యాయపీఠం ఎదుట బహిర్గతం కావాలి[b], తద్వారా ప్రతి ఒక్కరూ తాను శరీరం ద్వారా చేసినది మంచిదైనా చెడ్డదైనా, దానికి తగినదాన్ని పొందుతాడు[c].
  rationale: The revision corrects the purpose force of ἵνα and avoids narrowing the Greek’s broad ‘receive what corresponds’ language to ‘receive a result.’ It also uses singular Telugu pronouns and verb forms with ‘ప్రతి ఒక్కరూ’ to reflect ἕκαστος’s distributive singular force. The footnote anchors remain valid and each note continues to correspond to its marked expression.
