id: 2CO.5.1
reference: 2 Corinthians 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: te
  text: ఎందుకంటే, మన భూసంబంధమైన గుడారపు ఇల్లు కూల్చివేయబడితే[a], దేవుని నుండి ఒక కట్టడం—చేతులతో చేయబడని[b], పరలోకాలలోనున్న నిత్యమైన ఇల్లు—మనకు ఉంది[c] అని తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నాశనం చేయబడితే’ లేదా ‘విప్పివేయబడితే’ అని కూడా అనువదించవచ్చు. ఈ క్రియ నిర్మాణాన్ని తీసివేయడం లేదా కూల్చివేయడం అనే భావాన్ని కలిగివుండి, గుడారం అనే చిత్రణకు సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మానవ చేతులతో చేయబడని.’ ఈ మాట మానవ నిర్మాణానికి భిన్నంగా దైవిక మూలం గలదనే బైబిలీయ భావాన్ని ప్రతిధ్వనింపజేస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు పాఠం ‘మనకు ఉంది’ అంటుంది; ‘మనకు ఉంటుంది’ అనదు. అందువల్ల ప్రస్తుత స్వాధీనతకూ భవిష్యత్ సాకారానికీ మధ్య ఉన్న ఉద్వేగం నిలిచి ఉంటుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδαμεν
  choice: మనకు తెలుసు
  rationale: οἶδα స్థిరమైన జ్ఞానాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ‘మనకు తెలుసు’ అని వ్యక్తమవుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు ఈ వాక్యం ఆధారాన్ని లేదా వివరణను ఇస్తున్న సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐὰν ... καταλυθῇ
  choice: కూల్చివేయబడినా
  rationale: ἐάν తో కూడిన భావి సంభావ్యతను తెలుగులో ‘-బడినా’ సహజంగా తెలియజేస్తుంది. καταλύω నిర్మాణాన్ని విప్పడం లేదా కూల్చడం అనే గుడారపు రూపకానికి సరిపోతుంది.
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: గుడారమైన మన భూసంబంధమైన ఇల్లు
  rationale: οἰκία మరియు σκῆνος అనే ఇల్లు–గుడారం ద్వంద్వ చిత్రణను ‘శరీరం’గా నేరుగా వివరణ చేయకుండా రెండింటినీ నిలుపుతుంది.
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: దేవుని నుండి వచ్చిన ఒక కట్టడం
  rationale: οἰκοδομήని ఇక్కడ స్పష్టమైన నిర్మాణంగా, ἐκ θεοῦను మూలాన్ని సూచించే ‘దేవుని నుండి’గా అనువదిస్తుంది.
- source_word: ἔχομεν
  choice: మనకు ఉంది
  rationale: గ్రీకు వర్తమాన కాలాన్ని భావికాలంగా మార్చకుండా నిలుపుతుంది; ప్రస్తుత స్వాధీనత–భవిష్యత్ సాకారం మధ్య ఉద్వేగాన్ని పరిష్కరించదు.
- source_word: οἰκίαν ἀχειροποίητον
  choice: చేతులతో చేయబడని ఇల్లు
  rationale: ἀχειροποίητος యొక్క బైబిలీయ ప్రతిధ్వనిని, దైవిక మూలం మరియు మానవ నిర్మాణం మధ్య వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: αἰώνιον
  choice: నిత్యమైన
  rationale: తాత్కాలిక భూసంబంధమైన నివాసానికి విరుద్ధంగా శాశ్వతంగా నిలిచేదాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: పరలోకాలలో ఉన్న
  rationale: గ్రీకులోని బహువచన రూపాన్ని ‘పరలోకాలలో’ అని నిలుపుతూ, వాక్యానికి అవసరమైన తెలుగు అనుసంధానార్థంగా ‘ఉన్న’ను చేర్చుతుంది.
theological_decisions:
- issue: నివాస రూపకాల సూచ్యార్థం
  choice: ప్రధాన పాఠ్యంలో ఇల్లు, గుడారం, కట్టడం అనే రూపకాలను నిలుపడం
  alternative: ‘మన భూసంబంధమైన శరీరం నాశనమైనా’ అని నేరుగా శరీరంగా వివరించడం
  rationale: మూలపాఠం అనేక నిర్మాణ రూపకాలను ఉద్దేశపూర్వకంగా పొరలుగా ఉపయోగిస్తుంది. ‘శరీరం’ అని పెట్టడం వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలోకి తెచ్చి ఆ రూపకాల సాంద్రతను తగ్గిస్తుంది.
- issue: ἔχομεν యొక్క కాలార్థం
  choice: వర్తమానార్థమైన ‘మనకు ఉంది’ను నిలుపడం
  alternative: ‘మనకు ఉంటుంది’ అనే భావికాలం
  rationale: గ్రీకు క్రియ వర్తమాన కాలంలో ఉంది. అది ఇప్పుడు నిశ్చయంగా కలిగినదా లేక భవిష్యత్తులో సాకారమయ్యేదాన్ని ముందుగానే చెప్పడమా అనే ధార్మిక ఉద్వేగాన్ని అనువాదం పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘గుడారమైన ... ఇల్లు’ కొద్దిగా అసాధారణంగా వినిపించినా, మూలంలోని οἰκία–σκῆνος మిశ్రిత చిత్రణను ఉద్దేశపూర్వకంగా నిలుపుతుంది. ‘పరలోకాలు’ బహువచనం గ్రీకు రూపానికి అనుగుణం.
