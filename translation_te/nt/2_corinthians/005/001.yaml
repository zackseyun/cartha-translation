- from: ఎందుకంటే, గుడారమైన మన భూసంబంధమైన ఇల్లు కూల్చివేయబడినా[a], దేవుని నుండి వచ్చిన ఒక కట్టడం మనకు ఉందని మనకు తెలుసు—అది చేతులతో చేయబడని[b] ఇల్లు, పరలోకాలలో ఉన్న నిత్యమైన ఇల్లు.[c]
