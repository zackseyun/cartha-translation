id: 2CO.3.13
reference: 2 Corinthians 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: te
  text: మేము మోషే చేసినట్లు చేయము. ఆయన ఇశ్రాయేలు ప్రజలు గతించిపోతున్న దాని అంతాన్ని నిశితంగా చూడకుండేందుకు తన ముఖంపై ముసుగు వేసుకునేవాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముగింపుకు తీసుకురాబడుతున్న దాని గమ్యాన్ని/ఫలితాన్ని.”
    reason: alternative_reading
lexical_decisions:
- source_word: καθάπερ
  choice: చేసినట్లుగా
  rationale: ముందున్న వాక్యంతో పోలికను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐτίθει
  choice: వేసుకునేవాడు
  rationale: అసంపూర్ణ భూతకాల రూపంలోని అలవాటు లేదా పునరావృత చర్య భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: κάλυμμα
  choice: ముసుగు
  rationale: ముఖాన్ని కప్పే వస్తువును స్పష్టంగా సూచిస్తూ, నిర్గమకాండ నేపథ్యానికీ పౌలు కొనసాగించే రూపకానికీ సరిపోతుంది.
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: తదేకంగా చూడకుండా ఉండేందుకు
  rationale: ఉద్దేశాన్ని తెలిపే నిర్మాణాన్ని, ἀτενίζω లోని నిలకడగా లేదా నిశితంగా చూసే భావాన్ని నిలుపుతుంది.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: ఇశ్రాయేలు ప్రజలు
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘ఇశ్రాయేలు కుమారులు’; ఇక్కడ అది సమూహంగా ఇశ్రాయేలీయులను సూచించే సెమిటిక్ జాతీయ నుడికారం కాబట్టి సహజ తెలుగులో ‘ఇశ్రాయేలు ప్రజలు’ అని ఇచ్చాం.
- source_word: εἰς τὸ τέλος
  choice: అంతాన్ని
  rationale: τέλος కు ‘అంతం’, ‘గమ్యం’, ‘ఫలితం’ అనే సాధ్యార్థాలు ఉన్నాయి; తాత్కాలికమైనదానికీ నిలిచేదానికీ మధ్య సందర్భంలోని వ్యత్యాసంలో ‘అంతం’ ప్రధానార్థంగా సరిపోతుంది.
- source_word: τοῦ καταργουμένου
  choice: గతించిపోతున్న దాని
  rationale: ప్రస్తుత కృదంతం సూచించే కొనసాగుతున్న క్షీణత లేదా ప్రభావం కోల్పోయి తొలగిపోవడాన్ని సహజంగా తెలియజేస్తుంది; మరింత కారణార్థకమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: τέλος τοῦ καταργουμένου యొక్క అర్థం
  choice: గతించిపోతున్న దాని అంతం
  alternative: అంతానికి తీసుకురాబడుతున్న దాని గమ్యం/ఫలితం
  rationale: తక్షణ సందర్భం తాత్కాలికమైనదానిని నిలిచేదానితో పోలుస్తుంది. ప్రధాన పాఠం ముగింపు భావాన్ని ముందుకు తెస్తుంది; అయితే τέλος మరియు καταργουμένου పదాల నిజమైన అర్థవిస్తృతిని పాదసూచికలో ఉంచి వేదాంతపరమైన ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. వాక్యారంభంలోని καὶ οὐ ను ముందరి వచనంతో మాత్రమే ఆధారపడకుండా తెలుగులో సంపూర్ణ వాక్యంగా ‘మేము చేయము’ అని వ్యక్తం చేశాం. ‘ఇశ్రాయేలు కుమారులు’ అనే పదశః రూపం తెలుగులో పురుషులకు మాత్రమే పరిమితమైనట్లు వినిపించే అవకాశం ఉన్నందున, జాతీయ నుడికార భావాన్ని ‘ఇశ్రాయేలు ప్రజలు’గా అందించాం.
