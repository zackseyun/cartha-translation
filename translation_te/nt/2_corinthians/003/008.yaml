  revision_rationale: ‘అలాంటప్పుడు’ స్థానంలో ‘ఎలా’ ఉంచడం ద్వారా πῶς οὐχὶ యొక్క ప్రత్యక్ష అలంకార ప్రశ్నను కాపాడాం. మిగిలిన పదబంధాలు మూలార్థాన్ని, సందర్భంలోని తక్కువనుండి ఎక్కువకు సాగే పోలికను, మరియు ఆధునిక తెలుగు సహజత్వాన్ని తగిన విధంగా నిలుపుతున్నాయి.
