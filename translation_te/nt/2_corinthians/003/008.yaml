  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πῶς οὐχὶ μᾶλλον ἡ διακονία τοῦ πνεύματος ἔσται ἐν δόξῃ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/008.yaml
  text: how will the ministry of the Spirit not be even more in glory?[a]
translation:
  language: te
  text: ఆత్మ పరిచర్య మరెంతో మహిమతో ఎలా ఉండదు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మహిమలో.’
    reason: ἐν δόξῃ అనే గ్రీకు పదబంధానికి మరింత రూపానుగుణమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: πῶς οὐχὶ
  choice: అలాంటప్పుడు ... ఉండదా?
  rationale: నిశ్చయాత్మక సమాధానాన్ని ఆశించే గ్రీకు అలంకార ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; πῶς యొక్క తార్కిక అనుసంధానాన్ని ‘అలాంటప్పుడు’ తెలియజేస్తుంది.
- source_word: μᾶλλον
  choice: మరెంత
  rationale: మునుపటి వచనంతో ఉన్న తక్కువనుండి ఎక్కువకు సాగే పోలికను, దాని ఉద్ధృతిని కాపాడుతుంది.
- source_word: ἡ διακονία
  choice: పరిచర్య
  rationale: ఇక్కడ సాధారణ సేవకన్నా అప్పగించబడిన దైవిక పరిచర్యను సూచిస్తుంది; సందర్భంలోని సమాంతర విరుద్ధతకు సరిపోతుంది.
- source_word: τοῦ πνεύματος
  choice: ఆత్మ పరిచర్య
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని సహజ తెలుగు సమాసంతో అందిస్తుంది; సందర్భానుసారం ఇది పవిత్రాత్మను సూచిస్తుంది.
- source_word: ἔσται
  choice: ఉండదా
  rationale: భవిష్యత్ క్రియ యొక్క భావాన్ని అలంకార ప్రశ్నలో సహజంగా నిలుపుతుంది.
- source_word: ἐν δόξῃ
  choice: మహిమతో
  rationale: తెలుగులో సహజంగా ఉండే విధంగా ‘మహిమతో’ అని అనువదిస్తూ, పరిచర్య మహిమలో ఉండటం లేదా మహిమచేత కూడి ఉండటం అనే భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: πνεύματος యొక్క సూచన
  choice: ఆత్మ = పవిత్రాత్మ
  alternative: మానవ ఆత్మ లేదా వ్యక్తిత్వరహిత ఆధ్యాత్మిక భావం
  rationale: 2 కొరింథీయులు 3:6లోని జీవింపజేసే ఆత్మ మరియు ఇక్కడి నిబంధనాపరమైన వ్యత్యాసం పవిత్రాత్మనే అత్యంత సహజ సూచనగా చేస్తాయి; అనువాదం అదనపు సిద్ధాంత వివరణను చేర్చదు.
- issue: ἐν δόξῃ యొక్క భావం
  choice: మహిమతో
  alternative: మహిమలో; మరింత మహిమాన్వితంగా
  rationale: ‘మహిమతో’ సహజ తెలుగును అందించడంతోపాటు గ్రీకు పూర్వప్రత్యయ నిర్మాణంలోని అనుబంధ/పరిధి భావాన్ని పూర్తిగా విశేషణంగా మార్చకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సామాన్య పాఠకులకు సహజంగా ఉండే అలంకార ప్రశ్న. ‘మరెంత’ తక్కువనుండి ఎక్కువకు సాగే వాదనను స్పష్టంగా తెలియజేస్తుంది.
