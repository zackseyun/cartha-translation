revisions:
- from: అయితే, ఎవరైనా ప్రభువు వైపు తిరిగినప్పుడల్లా, ముసుగు తొలగిపోతుంది.[a]
  to: కానీ, ప్రభువు వైపు తిరిగినప్పుడల్లా, ముసుగు తొలగిపోతుంది.[a]
  rationale: The revision uses ‘కానీ’ for δέ and removes the added individual subject so that the translation does not settle an ambiguity left open by the Greek. It retains the draft’s natural rendering of the veil’s removal and its correctly anchored lexical-alternative footnote.
