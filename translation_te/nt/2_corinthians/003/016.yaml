id: 2CO.3.16
reference: 2 Corinthians 3:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡνίκα ⸂δὲ ἐὰν⸃ ἐπιστρέψῃ πρὸς κύριον, περιαιρεῖται τὸ κάλυμμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/016.yaml
  text: But whenever one turns to the Lord[b][a], the veil is removed.
translation:
  language: te
  text: కానీ, ప్రభువు వైపు తిరిగినప్పుడల్లా, ముసుగు తొలగిపోతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ముసుగు తీసివేయబడుతుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: అయితే, … తిరిగినప్పుడల్లా
  rationale: ἡνίκα, ἐὰν మరియు సంభావనార్థక క్రియ కలసి అనిర్దిష్ట కాలసంబంధ భావాన్ని ఇస్తాయి; ‘అప్పుడల్లా’ దాని పునరావృత లేదా ఎప్పుడైనా సంభవించే భావాన్ని సహజ తెలుగులో నిలుపుతుంది. ‘అయితే’ δέ యొక్క సందర్భానుసారమైన వ్యత్యాస సంబంధాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐπιστρέψῃ
  choice: తిరిగిన
  rationale: ‘తిరుగు’ దిశామార్పు రూపకాన్ని నిలుపుతూ, పశ్చాత్తాపం లేదా మతమార్పు వంటి మరింత నిర్దిష్ట భావాన్ని అనవసరంగా చేర్చదు.
- source_word: πρὸς κύριον
  choice: ప్రభువు వైపు
  rationale: πρός తో ద్వితీయా విభక్తి వ్యక్తి దిశగా తిరగడాన్ని సూచిస్తుంది; ‘వైపు’ ఆ దిశాత్మక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: κύριον
  choice: ప్రభువు
  rationale: κύριος బిరుదుకు సహజమైన తెలుగు రూపం; నిర్గమకాండంలోని నేపథ్య సూచనతోనూ పౌలు వాడుకతోనూ సరిపోతుంది.
- source_word: περιαιρεῖται
  choice: తొలగిపోతుంది
  rationale: వర్తమాన కర్మణి భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, చర్యను చేసేది ఎవరో వచనంలో లేనందున దానిని చేర్చదు.
- source_word: τὸ κάλυμμα
  choice: ముసుగు
  rationale: మోషే ముఖంపై ఉన్న కప్పును సూచించే సందర్భంలో ‘ముసుగు’ స్పష్టమైన, సాధారణ ఆధునిక తెలుగు పదం.
theological_decisions:
- issue: గ్రీకులో స్పష్టంగా లేని కర్తను తెలుగులో ఎలా వ్యక్తం చేయాలి
  choice: ‘ఎవరైనా’ అని సాధారణ, అనిర్దిష్ట కర్తను వాడటం
  alternative: కర్తను పూర్తిగా వదలి ‘ప్రభువు వైపు తిరిగినప్పుడల్లా’ అని అనువదించడం
  rationale: గ్రీకు క్రియకు ప్రత్యేక నామవాచక కర్త లేదు. తెలుగులో ‘ఎవరైనా’ వాక్యాన్ని సహజంగా చేసి, వ్యక్తిగతమా సామూహికమా అనే పరిధిని సిద్ధాంతపరంగా కుదించకుండా అనిర్దిష్టతను నిలుపుతుంది.
- issue: ‘ప్రభువు’ ఎవరు అనే సందర్భ సంబంధమైన ప్రశ్న
  choice: వచనంలో ఉన్నట్టే ‘ప్రభువు’ అని మాత్రమే ఉంచడం
  alternative: ‘ప్రభువైన క్రీస్తు’ లేదా ‘ప్రభువు, అంటే ఆత్మ’ అని స్పష్టీకరించడం
  rationale: ఈ వచనం κύριον అని మాత్రమే చెబుతుంది. సమీప సందర్భంలో ప్రభువు మరియు ఆత్మ మధ్య సంక్లిష్ట సంబంధం ఉన్నా, అనువాద పంక్తి దానిని ఒకే విధంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘అప్పుడల్లా’ అనిర్దిష్ట/పునరావృత కాలభావాన్ని, ‘ప్రభువు వైపు’ దిశాత్మకతను నిలుపుతాయి. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
