id: 2CO.3.14
reference: 2 Corinthians 3:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ⸀ἡμέρας τὸ αὐτὸ κάλυμμα ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης μένει μὴ ἀνακαλυπτόμενον, ⸀ὅτι ἐν Χριστῷ καταργεῖται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: te
  text: కాని వారి మనస్సులు కఠినపరచబడ్డాయి. ఎందుకంటే ఈ దినం వరకు పాత ఒడంబడికను[a] చదివేటప్పుడు అదే ముసుగు తొలగించబడకుండా అలాగే ఉంది; అది మెస్సీయలో తొలగించబడుతుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాత నిబంధన.” గ్రీకులో, “పాత ఒడంబడిక.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఎందుకంటే మెస్సీయలో అది రద్దు చేయబడుతుంది / పక్కన పెట్టబడుతుంది.” ఇక్కడ “అది” పాత ఒడంబడికను సూచించవచ్చని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη
  choice: కఠినమయ్యాయి
  rationale: ఆత్మీయంగా గ్రహించలేని, స్పందించలేని స్థితిని సూచించే గ్రీకు నిష్క్రియ భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఉద్దేశపూర్వక తిరుగుబాటు భావాన్ని అవసరానికి మించి చేర్చదు.
- source_word: νοήματα
  choice: మనస్సులు
  rationale: ఈ సందర్భంలో గ్రహణశక్తి, అవగాహన సామర్థ్యం అనే భావాన్ని సూచిస్తుంది; ‘మనస్సులు’ సహజంగా ఉండి పౌలు వాదనకు సరిపోతుంది.
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: ఎందుకంటే నేటి దినం వరకు
  rationale: కాలవ్యాప్తినీ ‘ఈ రోజువరకు’ అనే బలాన్నీ నిలుపుతూ గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: κάλυμμα
  choice: ముసుగు
  rationale: చుట్టుపక్కల వచనాల్లో మోషే ముఖంపై ఉన్న ముసుగుతో సంబంధాన్ని నిలుపుతుంది.
- source_word: ἐπὶ τῇ ἀναγνώσει
  choice: చదివేటప్పుడు
  rationale: పఠనం జరుగుతున్న సందర్భాన్ని ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: παλαιᾶς διαθήκης
  choice: పాత ఒడంబడిక
  rationale: διαθήκηకి ఇక్కడ ‘ఒడంబడిక’ అనే మూలార్థాన్ని ఇస్తుంది; సంప్రదాయంగా గ్రంథభాగాన్ని సూచించే ‘పాత నిబంధన’తో అనవసరంగా సమానం చేయదు.
- source_word: μένει
  choice: అలాగే ఉంది
  rationale: ముసుగు ఇప్పటికీ కొనసాగి ఉండటాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: μὴ ἀνακαλυπτόμενον
  choice: తొలగించబడకుండా
  rationale: ముసుగు రూపకాన్ని, నిష్క్రియ కృదంత భావాన్ని నిలుపుతుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός అనే బిరుదు యొక్క అర్థాన్ని వ్యక్తం చేస్తూ ప్రాజెక్టు విధానానికి అనుగుణంగా ఉంది.
- source_word: καταργεῖται
  choice: తొలగించబడుతుంది
  rationale: దగ్గరలోని ‘ముసుగు’నే అంతర్లీన కర్తగా తీసుకుంటే ఈ ఎంపిక రూపకానికి సహజంగా సరిపోతుంది; గ్రీకు నిష్క్రియ భావాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: καταργεῖται యొక్క సూచ్యవిషయం
  choice: ప్రధాన పాఠ్యంలో అంతర్లీన కర్త ‘ముసుగు’; అందువల్ల ‘అది మెస్సీయలో తొలగించబడుతుంది.’
  alternative: అంతర్లీన కర్త ‘పాత ఒడంబడిక’ కావచ్చు; అప్పుడు ‘అది మెస్సీయలో రద్దు చేయబడుతుంది / పక్కన పెట్టబడుతుంది’ అని అర్థం కావచ్చు.
  rationale: వ్యాకరణపరంగా అత్యంత సమీపంలోని సంభావ్య పూర్వపదం κάλυμμα (‘ముసుగు’); ఇది ‘తొలగించబడకుండా’ అనే ముందరి పదబంధంతోనూ సరిపోతుంది. అయితే గ్రీకులో కర్త స్పష్టంగా లేకపోవడం వల్ల ‘పాత ఒడంబడిక’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్య నిర్మాణం, అయితే ముసుగు రూపకం మరియు మూలపాఠంలోని సూచ్యవిషయ అస్పష్టత నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
