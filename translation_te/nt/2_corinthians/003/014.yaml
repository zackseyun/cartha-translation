revisions:
- from: కాని వారి మనస్సులు కఠినమయ్యాయి. ఎందుకంటే నేటి దినం వరకు పాత ఒడంబడికను[a] చదివేటప్పుడు అదే ముసుగు తొలగించబడకుండా అలాగే ఉంది; అది మెస్సీయలో తొలగించబడుతుంది.[b]
  to: కాని వారి మనస్సులు కఠినపరచబడ్డాయి. ఎందుకంటే ఈ దినం వరకు పాత ఒడంబడికను[a] చదివేటప్పుడు అదే ముసుగు తొలగించబడకుండా అలాగే ఉంది; అది మెస్సీయలో తొలగించబడుతుంది.[b]
