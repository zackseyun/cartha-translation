  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐχ ὅτι ⸂ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν⸃ λογίσασθαί τι ὡς ἐξ ⸀αὑτῶν, ἀλλ’ ἡ ἱκανότης ἡμῶν ἐκ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/005.yaml
  text: Not that we are sufficient in ourselves to consider anything as coming from ourselves[a], but our sufficiency is from God[b],
translation:
  language: te
  text: మనంతట మనమే దేనినైనా మన నుండే వచ్చినదిగా పరిగణించేంత సమర్థులము కాదు[a]; మన సామర్థ్యం దేవుని నుండి వస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “లెక్కించేంత,” “అంచనా వేసేంత.”
    reason: lexical_alternative
  - marker: b
    text: “సమర్థులము,” “సామర్థ్యం” అనే పదాలను వరుసగా “తగినవారము,” “తగిన శక్తి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: అని కాదు
  rationale: పౌలు చేస్తున్న వివరణాత్మక సవరణను సహజమైన ఆధునిక తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది; దీనిని కారణార్థకంగా మార్చదు.
- source_word: ἀφ’ ἑαυτῶν
  choice: మనంతట మనమే
  rationale: సామర్థ్యం స్వతహాగా మనలోనిదనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἱκανοί
  choice: సమర్థులు
  rationale: అవసరమైన సామర్థ్యం లేదా తగిన శక్తి కలిగి ఉండడాన్ని సూచిస్తుంది; తరువాతి ἱκανότηςతో ఉన్న పదార్థ సంబంధాన్ని నిలుపుతుంది.
- source_word: λογίσασθαί
  choice: పరిగణించడానికి
  rationale: మానసికంగా లెక్కించడం, అంచనా వేయడం అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: τι
  choice: దేనినైనా
  rationale: నిరాకరణ సందర్భంలో గ్రీకు అనిర్దిష్ట పదం యొక్క విస్తృత పరిధిని నిలుపుతుంది.
- source_word: ὡς ἐξ αὑτῶν
  choice: మన నుండే వచ్చినదిగా
  rationale: దేనికైనా మూలం మనమే అన్న భావాన్ని స్పష్టంగా తెలుపుతుంది; ὡςలోని ‘అని/గా’ భావాన్ని కూడా నిలుపుతుంది.
- source_word: ἡ ἱκανότης ἡμῶν
  choice: మన సామర్థ్యం
  rationale: ἱκανοίతో ఉన్న పదార్థ సంబంధాన్ని సహజమైన తెలుగులో సాధ్యమైనంతగా కాపాడుతుంది.
- source_word: ἐκ τοῦ θεοῦ
  choice: దేవుని నుండే వస్తుంది
  rationale: దేవుడే సామర్థ్యానికి మూలమని స్పష్టంగా తెలియజేస్తుంది; ‘నుండే’ ద్వారా మూలంపై ఉన్న వ్యత్యాసాన్ని ఉద్ఘాటిస్తుంది.
theological_decisions:
- issue: మానవ సామర్థ్యం గురించి పౌలు చేస్తున్న వాదన పరిధి
  choice: వాక్యాన్ని స్వయం-ఉద్భవమైన సామర్థ్యం గురించి విస్తృతంగా ఉంచడం
  alternative: దీనిని అపొస్తల పరిచర్యకు సంబంధించిన నైపుణ్యానికి మాత్రమే పరిమితం చేయడం
  rationale: సమీప సందర్భం పరిచర్యను గురించి ఉన్నప్పటికీ, గ్రీకు వాక్యంలోని పదాలు స్వయంగా మరింత విస్తృతంగా ఉన్నాయి. అందువల్ల వచనం చెప్పిన దానికంటే భావాన్ని సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే పౌలు వాడిన ‘సమర్థులు/సామర్థ్యం’ అనే భావసంబంధాన్ని నిలుపుతూ గౌరవప్రదమైన శైలి ఉపయోగించబడింది.
