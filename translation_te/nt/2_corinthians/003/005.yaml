revisions:
- from: మనంతట మనమే దేనినైనా మన నుండే వచ్చినదిగా పరిగణించడానికి[a] సమర్థులమని[b] కాదు; మన సామర్థ్యం దేవుని నుండే వస్తుంది.
  to: మనంతట మనమే దేనినైనా మన నుండే వచ్చినదిగా పరిగణించేంత సమర్థులము కాదు[a]; మన సామర్థ్యం దేవుని నుండి వస్తుంది[b].
  rationale: The revision improves Telugu syntax by directly connecting the adequacy term with the act of reckoning, without narrowing Paul’s broad statement to ministerial skill. It retains the repeated adequacy terminology and the contrast between self-origin and God as the source. Footnote a remains attached to the rendering of λογίζεσθαι; footnote b identifies the linked alternatives for ἱκανοί/ἱκανότης.
