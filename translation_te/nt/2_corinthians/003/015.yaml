id: 2CO.3.15
reference: 2 Corinthians 3:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: te
  text: అయితే, నేటి వరకు మోషేను చదివినప్పుడల్లా[a] వారి హృదయంపై[b] ఒక ముసుగు ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘మోషే’ అంటే మోషే రచనలు, ముఖ్యంగా ధర్మశాస్త్రం.
    reason: cultural_note
  - marker: b
    text: గ్రీకులో ‘వారి హృదయం’ అని ఏకవచనంలో ఉంది; ఇది సమూహార్థక ఏకవచనం కావచ్చు. ‘వారి హృదయాలపై’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: అయితే
  rationale: ముందటి వాక్యంతో ఉన్న వ్యత్యాసాన్ని సహజమైన, సంక్షిప్తమైన తెలుగులో సూచిస్తుంది.
- source_word: ἕως σήμερον
  choice: నేటివరకూ
  rationale: ఆ పరిస్థితి పౌలు వర్తమాన కాలం వరకు కొనసాగుతున్నదనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: చదివినప్పుడల్లా
  rationale: ἡνίκα, ἄν, వర్తమాన సుబ్జంక్టివ్ కలయికలోని పునరావృతమయ్యే అనిర్దిష్ట సందర్భాన్ని ‘ప్పుడల్లా’ స్పష్టంగా తెలియజేస్తుంది; గ్రీకులోని కర్మణి రూపాన్ని తెలుగులో సహజమైన అనిర్దిష్ట కర్త నిర్మాణంతో అందిస్తుంది.
- source_word: Μωϋσῆς
  choice: మోషేను
  rationale: మోషే రచనలకు సూచనగా వ్యక్తి పేరును వాడిన మూలపాఠంలోని లక్షణాలంకారాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది.
- source_word: κάλυμμα
  choice: ఒక ముసుగు
  rationale: ఈ అధ్యాయమంతటా కొనసాగుతున్న మోషే ముసుగు రూపకానికి సందర్భోచితమైన, సాధారణ తెలుగు పదం.
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: వారి హృదయం మీద
  rationale: బహువచన సంబంధసర్వనామంతో వచ్చిన ఏకవచన ‘హృదయం’ అనే మూలపాఠ రూపాన్ని సమూహార్థక ఏకవచనంగా నిలుపుతుంది.
- source_word: κεῖται
  choice: ఉంటుంది
  rationale: ముసుగు హృదయం మీద స్థిరంగా ఉండడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; మూలంలో లేని అదనపు చర్యను చేర్చదు.
theological_decisions:
- issue: ‘మోషే’ అనేది మోషే ధర్మశాస్త్రాన్ని లేదా ఆయన రచనలను సూచిస్తోందని ప్రధాన పాఠ్యంలో స్పష్టం చేయాలా?
  choice: ప్రధాన పాఠ్యంలో ‘మోషేను’ అనే లక్షణాలంకారాన్ని నిలుపడం
  alternative: ‘మోషే ధర్మశాస్త్రాన్ని’ లేదా ‘మోషే రచనలను’ అని వివరణాత్మకంగా అనువదించడం
  rationale: గ్రీకు పాఠం నేరుగా ‘మోషే’ అని చెబుతుంది. దాన్ని అలాగే ఉంచడం మూలంలోని వ్యక్తీకరణను, దాని కొంత సంక్షిప్తతను కాపాడుతుంది; ఉద్దేశించిన రచనల భావాన్ని పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అదే సమయంలో గౌరవప్రదమైన శైలిని పాటించాం. ‘మోషేను చదివినప్పుడల్లా’ అనే సహజ తెలుగు నిర్మాణం మూలంలోని పునరావృత సందర్భాన్ని మరియు ‘మోషే’ అనే లక్షణాలంకారాన్ని కాపాడుతుంది.
