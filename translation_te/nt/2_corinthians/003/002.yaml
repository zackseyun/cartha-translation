translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. ఉత్తరం–చదవడం అనే రూపకాన్ని నిలిపి, గ్రీకు వాక్యంలోని కర్మణి భావాన్ని సాధ్యమైనంత సహజంగా కాపాడింది.
