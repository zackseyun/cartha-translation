  text: ἡ ἐπιστολὴ ἡμῶν ὑμεῖς ἐστε, ἐγγεγραμμένη ἐν ταῖς καρδίαις ἡμῶν, γινωσκομένη καὶ ἀναγινωσκομένη ὑπὸ πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/002.yaml
  text: You are our letter[a], written in our hearts, known and read by all people.
translation:
  language: te
  text: మీరు మా ఉత్తరం; అది మా హృదయాల్లో రాయబడి, మనుషులందరికీ తెలిసి, వారిచేత చదవబడుతోంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనుషులందరిచేత గుర్తించబడి, చదవబడుతోంది.”
    reason: γινωσκομένηకు ‘తెలిసి’తో పాటు ‘గుర్తించబడి’ అనే అర్థం కూడా సాధ్యమే; ὑπὸ πάντων ἀνθρώπων రెండు కృదంతాలతోనూ సంబంధం కలిగి ఉంది.
lexical_decisions:
- source_word: ἡ ἐπιστολὴ ἡμῶν
  choice: మా ఉత్తరం
  rationale: ἐπιστολήకి ఆధునిక సాధారణ తెలుగులో ‘ఉత్తరం’ సహజమైన సమానం; ἡμῶν స్వామ్యాన్ని ‘మా’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑμεῖς ἐστε
  choice: మీరే
  rationale: ప్రత్యక్ష విధేయ వాక్యాన్ని సహజంగా అందిస్తూ, స్పష్టంగా ఉన్న ὑμεῖς యొక్క ఉద్ఘాటనను ‘ఏ’ నిలుపుతుంది.
- source_word: ἐγγεγραμμένη ἐν ταῖς καρδίαις ἡμῶν
  choice: అది మా హృదయాల్లో రాయబడి ఉంది
  rationale: పరిపూర్ణ కర్మణి కృదంతం వల్ల ఏర్పడిన, ఇప్పటికీ నిలిచి ఉన్న స్థితిని ‘రాయబడి ఉంది’ తెలియజేస్తుంది; ἐν భావాన్ని ‘హృదయాల్లో’ కాపాడుతుంది.
- source_word: γινωσκομένη
  choice: తెలిసి
  rationale: ఈ కర్మణి కృదంతం ‘తెలియబడటం’ లేదా ‘గుర్తించబడటం’ అనే భావాలను అనుమతిస్తుంది; ప్రధాన పాఠంలో ‘తెలిసి’ సహజంగా ఉంది.
- source_word: ἀναγινωσκομένη
  choice: చదవబడుతోంది
  rationale: ఉత్తరం అనే రూపకాన్ని నేరుగా కొనసాగిస్తూ కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: మనుషులందరికీ తెలిసి, వారందరిచేత చదవబడుతోంది
  rationale: ἀνθρώπων సమస్త మానవులను సూచిస్తుంది. ఒకే కర్తృవాచక పదబంధం రెండు కృదంతాలకూ వర్తిస్తుందని తెలుగులో సహజంగా తెలియజేయడానికి ‘మనుషులందరికీ … వారందరిచేత’ అని విస్తరించబడింది.
