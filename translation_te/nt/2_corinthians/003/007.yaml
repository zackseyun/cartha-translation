id: 2CO.3.7
reference: 2 Corinthians 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ διακονία τοῦ θανάτου ἐν ⸀γράμμασιν ⸀ἐντετυπωμένη λίθοις ἐγενήθη ἐν δόξῃ, ὥστε μὴ δύνασθαι ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ πρόσωπον Μωϋσέως διὰ τὴν δόξαν τοῦ προσώπου αὐτοῦ τὴν καταργουμένην,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: te
  text: అయితే, అక్షరాలతో రాళ్లపై చెక్కబడిన మరణపు పరిచర్య మహిమతో ఏర్పడినట్లయితే, మోషే ముఖ మహిమ కారణంగా ఇశ్రాయేలు కుమారులు మోషే ముఖాన్ని తేరి చూడలేని విధంగా—ఆ మహిమ తొలగించబడుతూ ఉండగా—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διακονία τοῦ θανάτου
  choice: మరణ పరిచర్య
  rationale: పౌలు ఉద్దేశపూర్వకంగా వాడిన సంక్షిప్తమైన, తీవ్ర స్వభావం గల షష్ఠీ విభక్తి సంబంధాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది; ‘పరిచర్య’ సేవతోపాటు అప్పగించబడిన నిర్వహణ భావాన్నీ అందిస్తుంది.
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: అక్షరాలతో రాళ్లపై చెక్కబడిన
  rationale: γράμματα అనే బహువచనాన్ని ‘అక్షరాలు’గా ఉంచి, ఆత్మతో ఉన్న సందర్భానుసార వ్యత్యాసాన్ని కాపాడుతుంది; λίθοιςలో స్పష్టంగా లేని ‘పలకలు’ అనే వివరణను చేర్చదు.
- source_word: ἐγενήθη ἐν δόξῃ
  choice: మహిమతో వచ్చినప్పుడు
  rationale: ἐγενήθη యొక్క సంఘటనాత్మక భావాన్నీ, ἐν δόξῃలోని మహిమతో కూడిన రాక భావాన్నీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: తేరి చూడలేకపోయారు
  rationale: ఫలితాన్ని తెలిపే నిర్మాణాన్ని నిలుపుతూ, ἀτενίζωలోని తదేకంగా లేదా నిలకడగా చూసే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: ఇశ్రాయేలు కుమారులు
  rationale: గ్రీకులోని పురుషవాచక, సాంప్రదాయిక వ్యక్తీకరణను ‘ఇశ్రాయేలీయులు’గా సాధారణీకరించకుండా దగ్గరగా ప్రతిబింబిస్తుంది.
- source_word: εἰς τὸ πρόσωπον Μωϋσέως
  choice: మోషే ముఖాన్ని
  rationale: తెలుగు వాక్యనిర్మాణానికి సహజంగా ఉండగా, దృష్టి మోషే ముఖంపైనే ఉందని స్పష్టంగా ఉంచుతుంది.
- source_word: τὴν καταργουμένην
  choice: ఆ మహిమ తొలగిపోతూ ఉన్నదే
  rationale: καταργέω యొక్క ‘ప్రభావం కోల్పోవడం/తొలగిపోవడం/ముగింపుకు రావడం’ అనే విస్తృత భావాన్ని కాపాడుతుంది; కేవలం కాంతి మసకబారడమేనని తేల్చదు.
theological_decisions:
- issue: καταργουμένην అనేది కనబడే మహిమ మసకబారడాన్నా, లేక అది తొలగించబడుతూ లేదా ముగింపుకు వస్తున్నదన్న విస్తృత భావాన్నా సూచిస్తుంది?
  choice: ఆ మహిమ తొలగిపోతూ ఉన్నదే
  alternative: ఆ మహిమ మసకబారుతూ ఉన్నదే; ఆ మహిమ ముగింపుకు వస్తూ ఉన్నదే
  rationale: తక్షణ సందర్భంలో మోషే ముఖంపై కనిపించే మహిమ ఉన్నప్పటికీ, ఈ క్రియ పౌలు చేసే విస్తృత నిబంధనాత్మక వ్యత్యాసాన్నీ మోయగలదు. అందువల్ల ప్రధాన పాఠం కనిపించే క్షీణతకే భావాన్ని పరిమితం చేయకుండా అస్పష్టతను నిలుపుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని దీర్ఘ షరతు వాక్య స్వరూపం, వచనం 8లో కొనసాగబోయే పోలిక, అలాగే చివరి అసమాపక భావం నిలుపబడ్డాయి. ఇంగ్లీషు సంప్రదింపు పొరలో పాదసూచిక గుర్తులు విషయాలతో మారిపోయినట్లు కనిపించినందున, మూలార్థానికి అనుగుణంగా καταργουμένην వద్ద మాత్రమే [a] ఉంచబడింది.
