revisions:
- from: మీరు మా పరిచర్య ద్వారా అందించబడిన మెస్సీయ[a] లేఖ అని స్పష్టమవుతోంది. అది సిరాతో కాదు, సజీవుడైన దేవుని ఆత్మతో[b] రాయబడింది; రాతి పలకల మీద కాదు, మాంసపు హృదయాలనే పలకల మీద[c][d] రాయబడింది.
