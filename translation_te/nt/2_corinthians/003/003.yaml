  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: te
  text: మీరు మెస్సీయ నుండి వచ్చిన, మా ద్వారా అందించబడిన లేఖ అని స్పష్టంగా కనిపిస్తున్నారు[a]. అది సిరాతో కాదు, సజీవుడైన దేవుని ఆత్మతో[b] రాయబడింది; రాతి పలకల మీద కాదు, మాంసపు హృదయాలనే పలకల మీద[c][d] రాయబడింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మెస్సీయకు చెందిన లేఖ’ లేదా సంప్రదాయంగా, ‘క్రీస్తు లేఖ.’ Χριστός అనే గ్రీకు బిరుదుకు సంప్రదాయ అనువాదం ‘క్రీస్తు’; దాని అర్థం ‘మెస్సీయ.’ గ్రీకు సంబంధవిభక్తి మూలం, కర్తృత్వం, లేదా స్వామ్య సంబంధం వంటి భావాలను అనుమతిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ సందర్భం ‘ఆత్మ’ను సజీవుడైన దేవుని ఆత్మగా సూచిస్తుంది.
    reason: theological_clarity
  - marker: c
    text: ‘మాంసపు హృదయాలు’ అనే మాట యెహెజ్కేలు 11:19; 36:26లోని హృదయ రూపకాన్ని ప్రతిధ్వనిస్తుంది.
    reason: cross_reference
  - marker: d
    text: గ్రీకులో ‘పలకలు’ మరియు ‘మాంసపు హృదయాలు’ ఒకే నిర్మాణంలో ఉన్నాయి; పలకలే ఆ హృదయాలని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: φανερούμενοι
  choice: స్పష్టమవుతోంది
  rationale: ఈ కృదంతం కొరింథీయులు క్రీస్తు లేఖగా బహిరంగంగా కనబడుతున్నారని సూచిస్తుంది. తెలుగులో వాక్యాన్ని సహజంగా కొనసాగించేందుకు ‘స్పష్టమవుతోంది’ అని అనువదించాం.
- source_word: ἐπιστολὴ
  choice: లేఖ
  rationale: ఆధునిక తెలుగులో సాధారణంగా అర్థమయ్యే పదం; పౌలు ఉపయోగించిన రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ లేఖ
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉంది. జనిటివ్ సంబంధాన్ని ప్రధాన పాఠంలో మూలం లేదా కర్తృత్వ భావంతో ఉంచినా, దాని వ్యాకరణ విస్తృతిని పాదటీపులో సూచించాం.
- source_word: διακονηθεῖσα ὑφ’ ἡμῶν
  choice: మా పరిచర్య ద్వారా అందించబడిన
  rationale: పౌలు మరియు అతని సహచరులు ఈ ‘లేఖ’కు సేవ చేసిన సాధనాలనే భావాన్ని నిలుపుతూ, తెలుగులో కేవలం తపాలా బట్వాడా భావం రాకుండా ‘పరిచర్య ద్వారా’ అని స్పష్టం చేశాం.
- source_word: ἐγγεγραμμένη
  choice: రాయబడింది
  rationale: సిరా, ఆత్మ, పలకలు అనే లేఖన రూపకానికి సహజమైన తెలుగు సమానం.
- source_word: μέλανι
  choice: సిరాతో
  rationale: మూలంలోని లేఖన సాధనాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: πνεύματι θεοῦ ζῶντος
  choice: సజీవుడైన దేవుని ఆత్మతో
  rationale: దేవుడు సజీవుడని చెప్పే గ్రీకు నిర్మాణాన్ని సహజ తెలుగులో నిలిపి, సందర్భానుసారం πνεῦμα ను దేవుని ఆత్మగా అనువదించాం.
- source_word: πλαξὶν λιθίναις
  choice: రాతి పలకల మీద
  rationale: సీనాయి నిబంధన పలకల ప్రతిధ్వనిని సహజంగా నిలుపుతుంది.
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: మాంసపు హృదయాలనే పలకల మీద
  rationale: పలకలు హృదయాలే అనే సమాససంబంధాన్ని ‘అనే’ ద్వారా స్పష్టం చేస్తూ, యెహెజ్కేలు గ్రంథంలోని ‘మాంసపు హృదయం’ ప్రతిధ్వనిని కాపాడాం.
theological_decisions:
- issue: Χριστοῦ యొక్క సంబంధార్థం
  choice: మెస్సీయ లేఖ
  alternative: క్రీస్తు లేఖ; మెస్సీయ నుండి వచ్చిన లేఖ
  rationale: జనిటివ్ మూలం, కర్తృత్వం లేదా స్వామ్య సంబంధాన్ని సూచించవచ్చు. ప్రధాన పాఠం బిరుదు అర్థాన్ని ‘మెస్సీయ’గా ఉంచుతుంది; పాదటీపు మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని ఇస్తుంది.
- issue: πνεύματι సూచించే వ్యక్తి లేదా శక్తి
  choice: దేవుని ఆత్మ
  alternative: సజీవుడైన దేవుని ఆత్మ/ఊపిరి
  rationale: సిరాతో రాయడాన్ని దేవుని అంతరంగ కార్యంతో వ్యతిరేకంగా ఉంచిన నిబంధన సందర్భం పరిశుద్ధాత్మను బలంగా సూచిస్తుంది; తెలుగు రూపం అనవసరమైన అదనపు సిద్ధాంత వివరణను చేర్చదు.
- issue: καρδίαις σαρκίναις లోని నిబంధన రూపకం
  choice: మాంసపు హృదయాలనే పలకలు
  alternative: మాంసంతో చేసిన హృదయ పలకలు
  rationale: ఇది పాపస్వభావం గల ‘శరీర సంబంధమైన’ హృదయాలు అనే భావం కాదు; రాతికి వ్యతిరేకంగా స్పందించే సజీవ హృదయాల పాత నిబంధన రూపకం. అందుకే ‘మాంసపు’ అని ఉంచి దాని ప్రతిధ్వనిని పాదటీపులో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే వాక్య నిర్మాణం. ‘పరిచర్య,’ ‘మెస్సీయ’ వంటి బైబిలు పదాలకు సందర్భం మరియు పాదటీపుల ద్వారా స్పష్టత ఇచ్చాం. రాతి పలకలు–హృదయ పలకలు, సిరా–దేవుని ఆత్మ అనే సమాంతర విరోధాలను నిలిపాం.
