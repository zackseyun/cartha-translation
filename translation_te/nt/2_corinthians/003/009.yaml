id: 2CO.3.9
reference: 2 Corinthians 3:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: te
  text: ఎందుకంటే, దోషిగా తీర్పు విధించే పరిచర్య మహిమతో కూడినదైతే, నీతి[a] పరిచర్య మహిమలో మరెంతో సమృద్ధిగా ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “న్యాయం.”
    reason: δικαιοσύνη పదానికి ఈ సందర్భంలో సాధ్యమైన ప్రత్యామ్నాయ భావాన్ని భద్రపరచడానికి.
lexical_decisions:
- source_word: διακονία
  choice: పరిచర్య
  rationale: పౌలు పరస్పరం పోల్చుతున్న రెండు ఒడంబడిక సంబంధిత సేవా వ్యవస్థలను సూచించడానికి, ఒక్కొక్క సేవాకార్యాన్ని మాత్రమే సూచించే ‘సేవ’ కంటే ‘పరిచర్య’ సందర్భోచితంగా ఉంది.
- source_word: κατάκρισις
  choice: దోషిగా తీర్పు విధించడం
  rationale: ఈ పదంలోని న్యాయస్థాన సంబంధమైన ‘condemnation’ భావాన్ని స్పష్టంగా, ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ఇది కేవలం మందలింపు అనే అర్థాన్ని ఇవ్వదు.
- source_word: δόξα
  choice: మహిమ
  rationale: ఈ వాదన అంతటా కొనసాగుతున్న దైవిక వైభవం, ఘనత అనే భావాన్ని నిలుపుతుంది.
- source_word: πολλῷ μᾶλλον
  choice: మరెంతో
  rationale: మొదటి పరిచర్యకంటే రెండవ పరిచర్యలోని మహిమ అత్యధికమని తెలిపే గ్రీకు తులనాత్మక బలాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: περισσεύω
  choice: సమృద్ధిగా ఉంటుంది
  rationale: మహిమ అధికంగా, పుష్కలంగా ఉండే భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని వర్తమాన భావాన్ని కూడా నిలుపుతుంది.
- source_word: δικαιοσύνη
  choice: నీతి
  rationale: పౌలు వాడుకలోని విస్తృత భావాన్ని, అలాగే ‘దోషిగా తీర్పు విధించడం’తో ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని నిలుపుతుంది; ‘న్యాయం’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: κατάκρισις మరియు δικαιοσύνη మధ్య న్యాయస్థాన సంబంధిత వ్యత్యాసం
  choice: దోషిగా తీర్పు విధించడం / నీతి
  alternative: శిక్షావిధి / న్యాయం
  rationale: మూలంలోని తీర్పు సంబంధిత ఉద్రిక్తతను స్పష్టంగా ఉంచుతూ, δικαιοσύνηని కేవలం నిర్దోషిగా ప్రకటించడం లేదా సామాజిక న్యాయం అనే ఒక్క భావానికే పరిమితం చేయలేదు.
- issue: క్రియలేని మొదటి ఉపవాక్యంలో δόξα సంబంధం
  choice: మహిమతో కూడినదైతే
  alternative: మహిమ కలిగి ఉంటే
  rationale: గ్రీకులో స్పష్టమైన క్రియ లేకపోవడాన్ని గౌరవిస్తూ, పరిచర్యకు మహిమ తోడై ఉన్నదనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; కాలం లేదా ఆరంభం గురించి అదనపు వాదనను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. ‘పరిచర్య,’ ‘మహిమ,’ ‘నీతి’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచి, ‘దోషిగా తీర్పు విధించే’ అనే స్పష్టమైన ఆధునిక వ్యక్తీకరణను ఉపయోగించాం.
