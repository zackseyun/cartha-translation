revisions:
- from: ఎందుకంటే, దోషిగా తీర్పు విధించే పరిచర్య మహిమతో కూడినదైతే, నీతి[a] కలిగించే పరిచర్య మహిమలో మరెంతో సమృద్ధిగా ఉంటుంది.
  to: ఎందుకంటే, దోషిగా తీర్పు విధించే పరిచర్య మహిమతో కూడినదైతే, నీతి[a] పరిచర్య మహిమలో మరెంతో సమృద్ధిగా ఉంటుంది.
  rationale: The sole revision changes the second genitival expression from a causative paraphrase to “నీతి పరిచర్య,” preserving the source’s meaning and Pauline contrast with the ministry of condemnation. The draft’s rendering of the first verbless clause and of the comparative abundance in glory is retained.
