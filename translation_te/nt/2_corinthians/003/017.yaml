id: 2CO.3.17
reference: 2 Corinthians 3:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν· οὗ δὲ τὸ πνεῦμα ⸀κυρίου, ἐλευθερία.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/017.yaml
  text: The Lord is the Spirit[a], and where the Spirit of the Lord is, there is freedom.
translation:
  language: te
  text: ప్రభువే ఆత్మ[a]; ప్రభువు ఆత్మ ఎక్కడ ఉంటే అక్కడ స్వేచ్ఛ ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువే ఆత్మ” అనే మాటను, ఆ సంబంధాన్ని దైవశాస్త్రపరంగా ఎలా నిర్వచించాలో నిర్దేశించకుండా, సందర్భంలో ఉన్న సన్నిహిత గుర్తింపుగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: ప్రభువు
  rationale: పౌలు వాడుకలోని దైవసంబంధమైన భావాన్ని, తెలుగు బైబిలు భాషలో సహజమైన గౌరవార్థక పదంతో నిలుపుతుంది.
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: ఈ సందర్భంలో రెండు చోట్లా దేవుని ఆత్మను సూచిస్తుంది; తెలుగులో ప్రత్యేక నామ సూచనకు అక్షరాల పెద్ద/చిన్న రూప భేదం లేకపోయినా సందర్భం ఆ భావాన్ని స్పష్టం చేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు; వాక్య విరామం ద్వారా సంబంధాన్ని చూపించాం
  rationale: మొదటి δέ వాదనలో ముందడుగును సూచిస్తుంది; తెలుగులో ‘ఇప్పుడు’ అని పెడితే మూలంలో లేని కాలార్థం కలగవచ్చు. రెండవ δέను సహజమైన వాక్య నిర్మాణంలో అంతర్భూతం చేశాం.
- source_word: οὗ
  choice: ఎక్కడ
  rationale: సాధారణ స్థానార్థక ప్రకటనను సహజంగా వ్యక్తం చేస్తుంది; ‘ఎక్కడైతే’ కంటే సంక్షిప్తంగా, ప్రస్తుత తెలుగు వాడుకకు అనుగుణంగా ఉంది.
- source_word: ἐλευθερία
  choice: స్వేచ్ఛ
  rationale: ఆధునిక తెలుగులో సహజమైన సమానార్థకం; విముక్తి భావాన్ని పరిమితం చేయకుండా మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: ప్రభువే ఆత్మ
  rationale: గ్రీకు సమీకరణ వాక్యాన్ని సడలించకుండా తెలుగులో సహజంగా, ఉద్ఘాటనతో వ్యక్తం చేస్తుంది.
- source_word: τὸ πνεῦμα κυρίου
  choice: ప్రభువు ఆత్మ
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని స్పష్టంగా నిలుపుతూ తెలుగులో సహజంగా ఉంది.
theological_decisions:
- issue: ‘ప్రభువే ఆత్మ’ అనే గుర్తింపు వాక్యానికి సంబంధించిన దైవశాస్త్ర వివాదం
  choice: గ్రీకులో ఉన్న ప్రత్యక్ష సమీకరణను ‘ప్రభువే ఆత్మ’గా మార్చకుండా ఉంచాం.
  alternative: దీనిని కార్యసంబంధమైన లేదా నిబంధనసంబంధమైన సన్నిహిత గుర్తింపుగా అర్థం చేసుకోవచ్చు; ‘ప్రభువు’ను ప్రత్యేకంగా క్రీస్తుగా లేదా విస్తృత దైవసూచనగా కూడా కొందరు గ్రహిస్తారు.
  rationale: అనువాదం సంబంధాన్ని సిద్ధాంతపరంగా నిర్వచించకుండా, మూలంలోని నిజమైన ఉద్రిక్తతను అలాగే పాఠకుని ముందుంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలో స్పష్టమైన కాలార్థక ‘ఇప్పుడు’ లేకపోవడంతో దాన్ని చేర్చలేదు. ‘ప్రభువే ఆత్మ’ అనే సంక్షిప్త రూపం గ్రీకు సమీకరణ బలాన్ని నిలుపుతుంది.
