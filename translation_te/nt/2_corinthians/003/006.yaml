id: 2CO.3.6
reference: 2 Corinthians 3:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: te
  text: ఆయనే మమ్మల్ని కొత్త ఒడంబడిక సేవకులుగా సమర్థులుగా చేశాడు—అక్షరానికి సేవకులుగా కాదు, ఆత్మకు[a] సేవకులుగా; ఎందుకంటే అక్షరం చంపుతుంది, ఆత్మ జీవాన్ని ఇస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ రెండు చోట్ల వచ్చిన “ఆత్మ” అనే మాట పరిశుద్ధాత్మను సూచించవచ్చు; లేదా “ఆత్మ/ఆధ్యాత్మిక భావం” అని కూడా అర్థం చేసుకోవచ్చు. గ్రీకు లిపి ఈ భేదాన్ని చూపదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: సామర్థ్యాన్ని మాకు ఇచ్చాడు
  rationale: దేవుడు వారిని ఈ సేవకు తగినవారిగా, సమర్థులుగా చేశాడనే కారణార్థక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: διακόνους
  choice: సేవకులు
  rationale: తరువాత ఏర్పడిన సంఘపదవి భావాన్ని అనవసరంగా చేర్చకుండా, διάκονος లోని సేవాభావాన్ని నిలుపుతుంది.
- source_word: καινῆς διαθήκης
  choice: కొత్త ఒడంబడికకు
  rationale: అనిర్దిష్ట ఆర్టికల్ లేని తెలుగులో గ్రీకు అనార్త్రస్ పదబంధాన్ని సహజంగా చూపిస్తూ, పౌలు చెప్పే ఒడంబడిక భావాన్ని నిలుపుతుంది.
- source_word: γράμματος / γράμμα
  choice: అక్షరానికి / అక్షరం
  rationale: పౌలు ఉపయోగించిన సంక్షిప్తమైన, ఉద్దేశపూర్వకంగా గాఢమైన వ్యత్యాసాన్ని కాపాడుతుంది; ‘లిఖిత నియమం’ అని అనువదిస్తే అర్థం అవసరానికి మించి సంకుచితమవుతుంది.
- source_word: πνεύματος / πνεῦμα
  choice: ఆత్మకు / ఆత్మ
  rationale: కొత్త ఒడంబడిక సందర్భంలో పరిశుద్ధాత్మే ప్రధాన సూచనగా కనిపిస్తుంది. తెలుగులో గౌరవార్థక లేదా ప్రత్యేక పెద్ద అక్షర భేదం లేకపోవడంతో నిజమైన అనిశ్చితిని పాదటిప్పణిలో స్పష్టం చేస్తుంది.
- source_word: ἀποκτέννει
  choice: చంపుతుంది
  rationale: గ్రీకు క్రియలోని నేరుగా, బలంగా ఉన్న వర్తమానకాల భావాన్ని నిలుపుతుంది.
- source_word: ζῳοποιεῖ
  choice: జీవాన్ని ఇస్తుంది
  rationale: జీవింపజేసే కార్యాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πνεῦμα పరిశుద్ధాత్మను సూచిస్తుందా, లేక సాధారణంగా ఆత్మను సూచిస్తుందా
  choice: ప్రధాన పాఠ్యంలో ‘ఆత్మ’—కొత్త ఒడంబడిక సందర్భంలో పరిశుద్ధాత్మను ప్రధాన సూచనగా గ్రహించడం
  alternative: మానవ ఆత్మ లేదా ‘అక్షరం’కు విరుద్ధమైన ఆంతరిక/ఆధ్యాత్మిక భావం
  rationale: పౌలు కొత్త ఒడంబడికను జీవాన్ని ఇచ్చే ఆత్మతో కలుపుతున్నందున పరిశుద్ధాత్మ సూచన ఎక్కువ సంభావ్యమైనది. అయితే గ్రీకు లిపిలో పెద్ద/చిన్న అక్షరాల ద్వారా ఈ భేదం చూపబడదు; అందువల్ల ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: ‘అక్షరం’ యొక్క పరిధి
  choice: రూపకంలోని విస్తృతతను కాపాడుతూ ‘అక్షరం’
  alternative: ‘లిఖిత నియమం’ లేదా ‘వ్రాతపూర్వక ధర్మశాస్త్రం’
  rationale: సందర్భం లిఖిత ధర్మశాస్త్రం లేదా నియమావళిని సూచించవచ్చుగానీ, గ్రీకు పదాన్ని మరింత నిర్దిష్ట సిద్ధాంత వ్యాఖ్యానంగా మార్చకుండా పౌలు చెప్పిన ఉద్వేగభరిత వ్యత్యాసాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను కాపాడే శైలి. వాక్యంలోని ‘అక్షరం—ఆత్మ’, ‘చంపుతుంది—జీవాన్ని ఇస్తుంది’ అనే సమాంతర వ్యత్యాసాలు యథాతథంగా నిలుపబడ్డాయి. ప్రధాన పాఠ్యంలో ఉన్న [a] సూచిక పాదటిప్పణికి సరిపోతుంది.
