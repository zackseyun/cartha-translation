revisions:
- from: కాబట్టి, ఇలాంటి నిరీక్షణ మనకు ఉంది గనుక, మనం ఎంతో ధైర్యంగా వ్యవహరిస్తున్నాం.[a]
  to: కాబట్టి, ఇలాంటి నిరీక్షణ మనకు ఉన్నందున, మేము ఎంతో ధైర్యంగా వ్యవహరిస్తాం.[a]
  rationale: The revision preserves the Greek logical connection in idiomatic Telugu, distinguishes Paul’s ministerial “we” from an inclusive “we,” and uses a generic present for the ongoing practice. It retains “ధైర్యంగా వ్యవహరిస్తాం” as a natural, nonrestrictive rendering of χρώμεθα with παρρησίᾳ, while the footnote preserves the principal lexical alternatives.
