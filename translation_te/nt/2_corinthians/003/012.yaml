  yaml_path: translation/nt/2_corinthians/003/012.yaml
  text: Since, then, we have such a hope, we act with great boldness,
translation:
  language: te
  text: కాబట్టి, ఇలాంటి నిరీక్షణ మనకు ఉన్నందున, మేము ఎంతో ధైర్యంగా వ్యవహరిస్తాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మేము ఎంతో బహిరంగతతో వ్యవహరిస్తాం”; లేదా, “మేము ఎంతో నిస్సంకోచంగా మాట్లాడతాం.”
    reason: παρρησίᾳ అనే పదానికి ధైర్యం, బహిరంగత, నిస్సంకోచమైన మాట అనే భావసాధ్యతలు ఉన్నాయి; χρώμεθα వాటిని ఉపయోగించడం లేదా ఆచరించడం అనే భావాన్ని ఇస్తుంది.
lexical_decisions:
- source_word: Ἔχοντες
  choice: మనకు ఉంది గనుక
  rationale: సందర్భంలో ఈ కృదంతం ప్రధాన క్రియకు కారణాన్ని సూచిస్తుంది. తెలుగు సహజ వాక్యనిర్మాణంలో ‘ఉంది గనుక’ ఆ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి వచ్చే నిర్ధారణను సూచించే అన్వయార్థాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: τοιαύτην
  choice: ఇలాంటి
  rationale: నిరీక్షణ యొక్క స్వభావాన్ని ముందటి సందర్భంతో అనుసంధానించే గుణాత్మక సూచనను సహజంగా తెలియజేస్తుంది.
- source_word: ἐλπίδα
  choice: నిరీక్షణ
  rationale: పౌలు సందర్భంలో భవిష్యత్తుపట్ల నమ్మకంతో కూడిన ఎదురుచూపును తెలిపే ప్రామాణికమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: πολλῇ
  choice: ఎంతో
  rationale: παρρησίᾳ యొక్క పరిమాణం లేదా తీవ్రతను తెలుగు సహజ ప్రయోగంలో బలంగా వ్యక్తం చేస్తుంది.
- source_word: παρρησίᾳ
  choice: ధైర్యంగా
  rationale: ఈ పదం ధైర్యం, బహిరంగత, నిస్సంకోచత అనే భావాలను కలిగి ఉంది. తక్షణ సందర్భంలోని ముసుగు అనే వ్యత్యాసానికి ‘ధైర్యంగా’ ప్రధాన భావాన్ని సహజంగా అందిస్తుంది; ఇతర భావసాధ్యతలను పాదసూచికలో ఉంచాం.
- source_word: χρώμεθα
  choice: వ్యవహరిస్తున్నాం
  rationale: దత్తివిభక్తితో వచ్చిన మధ్యమ క్రియ ‘దేనినైనా ఉపయోగించడం/ఆచరించడం’ అనే భావం ఇస్తుంది. ‘వ్యవహరిస్తున్నాం’ అనేది పలుకుబడికే అనవసరంగా పరిమితం చేయకుండా ప్రవర్తనా భావాన్ని సహజంగా తెలియజేస్తుంది.
