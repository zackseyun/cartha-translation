translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని కారణసంబంధం మరియు నిర్ధారణసూచక అనుసంధానం రెండింటినీ నిలిపి, παρρησία యొక్క అర్థవిస్తృతిని పాదసూచికలో సంరక్షించాం.
