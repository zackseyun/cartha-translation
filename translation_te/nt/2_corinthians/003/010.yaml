id: 2CO.3.10
reference: 2 Corinthians 3:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: te
  text: ఎందుకంటే నిజానికి, మహిమ పొందినది ఈ విషయంలో దానిని మించిన మహిమ కారణంగా మహిమ పొందినదిగా లేదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ఎందుకంటే ... కూడా
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో, καί యొక్క బలాన్ని ‘కూడా’తో సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలిపింది.
- source_word: οὐ δεδόξασται
  choice: మహిమపరచబడినదిగా లేదు
  rationale: పరిపూర్ణ కర్మణి రూపాన్ని సాధ్యమైనంతవరకు నిలిపి, పౌలు ఉద్దేశించిన విరోధాభాసాన్ని ‘మహిమ లేదు’ అని సాదాసీదాగా మార్చకుండా ఉంచుతుంది.
- source_word: τὸ δεδοξασμένον
  choice: మహిమపరచబడినది
  rationale: నామవాచకంగా వాడిన పరిపూర్ణ కర్మణి కృదంతాన్ని అలాగే అనువదించి, మూలంలో లేని ‘నిబంధన’ లేదా ‘పరిచర్య’ అనే పదాన్ని చేర్చలేదు.
- source_word: ἐν τούτῳ τῷ μέρει
  choice: ఈ విషయంలో
  rationale: ముందటి మహిమను పూర్తిగా నిరాకరించకుండా, పోలిక వర్తించే పరిమిత కోణాన్ని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: εἵνεκεν
  choice: కారణంగా
  rationale: స్పష్టమైన కారణార్థాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: దానిని మించిన మహిమ
  rationale: ὑπερβαλλούσης యొక్క పోలిక భావాన్ని స్పష్టంగా చూపుతుంది; ‘దానిని’ అనేది సందర్భం సూచించే పూర్వ మహిమను తెలియజేయడానికి సరఫరా చేయబడింది.
- source_word: δόξα / δεδοξασμένον wordplay
  choice: మహిమపరచబడినది ... మహిమ
  rationale: δοξ- పదకుటుంబంలోని పౌలు వాక్చాతుర్యాన్ని తెలుగులోనూ కనిపించేలా ఉంచుతుంది.
theological_decisions:
- issue: పూర్వ నిబంధన పరిచర్యకు మహిమ అసలే లేదని పౌలు నిరాకరిస్తున్నాడా, లేక మించిన మహిమతో పోల్చి మాత్రమే అలా చెబుతున్నాడా?
  choice: '‘ఈ విషయంలో’ అనే పరిమితిలో తులనాత్మక నిరాకరణ: మించిన మహిమ ఎదుట పూర్వ మహిమ మహిమగా లెక్కించబడదు.'
  alternative: పూర్వ పరిచర్యకు నిజమైన మహిమ ఏదీ లేదనే సంపూర్ణ నిరాకరణ.
  rationale: ‘ఈ విషయంలో’ అనే పదబంధం నిరాకరణను పరిమితం చేస్తుంది; అంతేకాక, 2 కొరింథీయులు 3 యొక్క సమీప సందర్భం పూర్వ పరిచర్యకు మహిమ ఉండేదని అంగీకరిస్తూనే, మరింత గొప్ప మహిమ దానిని మించిపోతుందని చెబుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ఉద్దేశపూర్వక పునరుక్తి, తులనాత్మక ఉద్రిక్తత నిలిపివేయబడ్డాయి. ఈ వాక్యానికి ప్రత్యేక పాఠాంతర లేదా అనువాద ప్రత్యామ్నాయ పాదటిప్పణి అవసరం లేదు.
