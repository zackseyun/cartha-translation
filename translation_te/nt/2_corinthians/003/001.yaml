  yaml_path: translation/nt/2_corinthians/003/001.yaml
  text: Are we beginning again to commend ourselves? Or do we need[a], like some, letters of recommendation to you or from you?
translation:
  language: te
  text: మమ్మల్ని మేమే మళ్లీ సిఫారసు చేసుకోవడం మొదలుపెడుతున్నామా? లేక కొందరిలాగా, మీకు గానీ మీ నుండి గానీ సిఫారసు పత్రాలు[a] మాకు అవసరమా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సిఫారసు లేఖలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρχόμεθα
  choice: మొదలుపెడుతున్నామా
  rationale: వర్తమానకాల క్రియలోని ఆరంభ/కొనసాగుతున్న భావాన్ని సహజమైన తెలుగు ప్రశ్నారూపంలో నిలుపుతుంది.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: పునరావృతిని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἑαυτοὺς συνιστάνειν
  choice: మనల్ని మనమే మెచ్చుకోదగినవారిగా పరిచయం చేసుకోవడం
  rationale: తమను తాము అనుకూలంగా సమర్పించుకోవడం లేదా యోగ్యులుగా చూపించుకోవడం అనే సందర్భోచిత భావాన్ని వ్యక్తం చేస్తూ, తరువాత వచ్చే సిఫారసు పత్రాలతో ఉన్న పదసంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: μὴ χρῄζομεν
  choice: మాకు అవసరమా
  rationale: μή సూచించే ప్రతికూల సమాధాన నిరీక్షణను బలవంతంగా చేర్చకుండా, అలంకారిక ప్రశ్న ద్వారానే తెలియజేస్తుంది.
- source_word: ὥς τινες
  choice: కొందరిలాగా
  rationale: పేరు చెప్పని కొందరితో పోలికను సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: συστατικῶν ἐπιστολῶν
  choice: సిఫారసు పత్రాలు
  rationale: వ్యక్తిని పరిచయం చేసి అతనికి అనుకూలంగా సాక్ష్యమిచ్చే పత్రాలు అనే భావానికి ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: πρὸς ὑμᾶς
  choice: మీకు చూపించడానికి
  rationale: కొరింథీయుల వైపు ఉద్దేశించిన పత్రాలు అనే దిశాభావాన్ని తెలుగులో సందర్భస్పష్టంగా తెలియజేస్తుంది.
- source_word: ἢ ἐξ ὑμῶν
  choice: లేక మీ నుండి పొందడానికి
  rationale: ἐξ లోని మూలం/వచ్చిన చోటు అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
