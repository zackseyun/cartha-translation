- from: మనల్ని మనమే మళ్లీ మెచ్చుకోదగినవారిగా పరిచయం చేసుకోవడం మొదలుపెడుతున్నామా? లేక కొందరిలాగా, మీకు చూపించడానికి గానీ మీ నుండి పొందడానికి గానీ సిఫారసు పత్రాలు[a] మాకు అవసరమా?
  to: మమ్మల్ని మేమే మళ్లీ సిఫారసు చేసుకోవడం మొదలుపెడుతున్నామా? లేక కొందరిలాగా, మీకు గానీ మీ నుండి గానీ సిఫారసు పత్రాలు[a] మాకు అవసరమా?
