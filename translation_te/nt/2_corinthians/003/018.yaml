id: 2CO.3.18
reference: 2 Corinthians 3:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: te
  text: 'మనమందరం ముసుగు తొలగించబడిన ముఖాలతో, అద్దంలో చూచినట్లుగా ప్రభువు మహిమను వీక్షిస్తూ[a], అదే స్వరూపంలోకి మహిమ నుండి మహిమకు రూపాంతరం చెందుతున్నాం; ఇది ప్రభువు, అనగా ఆత్మ, నుండి కలిగినట్లే.[b]


    [a] లేదా, “అద్దంలా ప్రభువు మహిమను ప్రతిబింబిస్తూ.”


    [b] లేదా, “ఆత్మయైన ప్రభువు నుండి”; మరో విధంగా, “ప్రభువు యొక్క ఆత్మ నుండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అద్దంలా ప్రభువు మహిమను ప్రతిబింబిస్తూ.”
    reason: alternative_reading
  - marker: b
    text: లేదా, “ఆత్మయైన ప్రభువు నుండి”; మరో విధంగా, “ప్రభువు యొక్క ఆత్మ నుండి.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: ముసుగు తొలగిన ముఖంతో
  rationale: పరిపూర్ణ కృదంతం ముసుగు తొలగించబడిన ఫలితంగా కొనసాగుతున్న ప్రస్తుత స్థితిని సూచిస్తుంది. ఈ ఎంపిక ఏకవచన సమష్టి ప్రయోగాన్ని కూడా నిలుపుతుంది.
- source_word: δόξαν κυρίου
  choice: ప్రభువు మహిమను
  rationale: సంబంధ విభక్తి భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా అందిస్తుంది; κύριοςకు ‘ప్రభువు’ వాడబడింది.
- source_word: κατοπτριζόμενοι
  choice: అద్దంలో చూసినట్లుగా ... చూస్తూ
  rationale: ఈ క్రియ అద్దంలో చూడడం లేదా అద్దంలా ప్రతిబింబించడం అనే రెండు భావాలను ఇవ్వగలదు. ప్రభువు మహిమను చూడడం నుండి రూపాంతరానికి సాగే సందర్భానికి మొదటి భావం సరిపోతుంది; రెండవ భావం పాదసూచికలో నిలుపబడింది.
- source_word: τὴν αὐτὴν εἰκόνα
  choice: అదే స్వరూపంలోకి
  rationale: ‘అదే’ అనే నిర్దేశం ప్రభువు మహిమకూ విశ్వాసులు రూపాంతరం చెందే స్వరూపానికీ ఉన్న సంబంధాన్ని నిలుపుతుంది. ‘స్వరూపం’ వ్యక్తి రూపసాదృశ్య భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: μεταμορφούμεθα
  choice: రూపాంతరం చెందుతున్నాం
  rationale: వర్తమాన కర్మణి రూపంలోని కొనసాగుతున్న ప్రక్రియను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: మహిమ నుండి మహిమకు
  rationale: మూలంలోని సంక్షిప్తతను, ఉద్దేశపూర్వకంగా వివరించని ప్రగతి భావాన్ని అలాగే ఉంచుతుంది; ‘ఒక స్థాయి మహిమ నుండి మరొక స్థాయికి’ అని పాఠానికి మించిన వివరణను చేర్చదు.
- source_word: καθάπερ ἀπὸ κυρίου πνεύματος
  choice: ఇది ప్రభువు, అనగా ఆత్మ, నుండి కలుగుతోంది
  rationale: తెలుగులో పూర్తి భావం రావడానికి ‘ఇది ... కలుగుతోంది’ అని వ్యక్తపరుస్తూ, κυρίου πνεύματοςలోని సంక్షిప్త సమానాధికార సంబంధాన్ని ‘ప్రభువు, అనగా ఆత్మ’గా ఉంచుతుంది. ఇతర సాధ్యమైన వ్యాకరణ సంబంధాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- source_word: κύριος
  choice: ప్రభువు
  rationale: రెండు సందర్భాల్లోనూ గౌరవభరితమైన, సాధారణంగా అర్థమయ్యే ప్రామాణిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: κατοπτριζόμενοι అనే పదం యొక్క భావం
  choice: అద్దంలో చూసినట్లుగా ప్రభువు మహిమను చూస్తూ
  alternative: అద్దంలా ప్రభువు మహిమను ప్రతిబింబిస్తూ
  rationale: ప్రభువు మహిమను గ్రహించడం రూపాంతరానికి దారితీసే సందర్భగతి ‘చూడడం’ అనే భావానికి మద్దతిస్తుంది. అయినా గ్రీకు క్రియలో ‘ప్రతిబింబించడం’ అనే నిజమైన ప్రత్యామ్నాయ భావం ఉన్నందున దాన్ని పాదసూచికలో నిలిపాం.
- issue: చివరి పదబంధంలో κυρίου మరియు πνεύματος మధ్య సంబంధం
  choice: ప్రభువు, అనగా ఆత్మ, నుండి
  alternative: ఆత్మయైన ప్రభువు నుండి; లేదా ప్రభువు యొక్క ఆత్మ నుండి
  rationale: గ్రీకు పదబంధం సంక్షిప్తంగా ఉండి ఒకటి కంటే ఎక్కువ విధాలుగా అన్వయించవచ్చు. ప్రధాన పాఠం సమానాధికార భావాన్ని సాధ్యమైనంత మితంగా చూపుతుంది; అధికంగా స్పష్టీకరించే ఇతర అన్వయాలను పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవభరితమైన వాక్యనిర్మాణం ఉపయోగించబడింది. ‘మహిమ నుండి మహిమకు’ అనే మూలంలోని సంక్షిప్తతను వివరించి పలుచన చేయకుండా నిలిపాం. రెండు నిజమైన వ్యాకరణార్థ సందిగ్ధతలను ప్రధాన పాఠంలో బలవంతంగా పరిష్కరించకుండా పాదసూచికల్లో భద్రపరిచాం.
