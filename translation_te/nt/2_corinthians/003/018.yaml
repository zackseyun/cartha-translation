revisions:
- from: 'మనమందరం ముసుగు తొలగిన ముఖంతో, అద్దంలో చూసినట్లుగా ప్రభువు మహిమను చూస్తూ[a], అదే స్వరూపంలోకి మహిమ నుండి మహిమకు రూపాంతరం చెందుతున్నాం. ఇది ప్రభువు, అనగా ఆత్మ, నుండి కలుగుతోంది.[b]


    [a] లేదా, “అద్దంలా ప్రభువు మహిమను ప్రతిబింబిస్తూ.”

    [b] లేదా, “ఆత్మయైన ప్రభువు నుండి”; మరో విధంగా, “ప్రభువు యొక్క ఆత్మ నుండి.”'
  to: 'మనమందరం ముసుగు తొలగించబడిన ముఖాలతో, అద్దంలో చూచినట్లుగా ప్రభువు మహిమను వీక్షిస్తూ[a], అదే స్వరూపంలోకి మహిమ నుండి మహిమకు రూపాంతరం చెందుతున్నాం; ఇది ప్రభువు, అనగా ఆత్మ, నుండి కలిగినట్లే.[b]


    [a] లేదా, “అద్దంలా ప్రభువు మహిమను ప్రతిబింబిస్తూ.”


