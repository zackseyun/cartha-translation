  yaml_path: translation/nt/2_corinthians/003/011.yaml
  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: te
  text: ఎందుకంటే, అంతం చేయబడుతున్నది మహిమతో వచ్చినట్లయితే,[a][b] నిలిచి ఉండేది మహిమలో మరెంతో ఎక్కువగా ఉంటుంది!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “తొలగించబడుతున్నది,” “రద్దు చేయబడుతున్నది,” లేదా సందర్భానుసారం “క్షీణించిపోతున్నది.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “మహిమ ద్వారా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: అంతమొందుతున్నది
  rationale: ఈ వర్తమాన కర్మణి కృదంతం అంతానికి తీసుకురాబడుతున్నది, తొలగిపోతున్నది అనే భావాన్ని ఇస్తుంది. సందర్భంలోని తాత్కాలికతను తెలియజేస్తూనే, కేవలం ‘మసకబారడం’ అనే భావానికి పరిమితం చేయకుండా ‘అంతమొందుతున్నది’ అని అనువదించాం.
- source_word: διὰ δόξης
  choice: మహిమతో వచ్చింది
  rationale: διά + షష్ఠీ విభక్తికి అక్షరార్థంగా ‘మహిమ ద్వారా’ అనే భావం ఉన్నా, ఇక్కడ మహిమతో కూడి ప్రత్యక్షమైనదనే భావాన్ని సహజ తెలుగులో ‘మహిమతో వచ్చింది’ తెలియజేస్తుంది.
- source_word: μένον
  choice: నిలిచి ఉండేది
  rationale: μένω యొక్క కొనసాగడం, నిలిచి ఉండడం అనే భావాన్ని, మూలంలోని నపుంసకలింగ నామవాచకసమాన కృదంత నిర్మాణానికి దగ్గరగా నిలుపుతుంది.
- source_word: ἐν δόξῃ
  choice: మహిమలో ఉంటుంది
  rationale: ἐν అనే ఉపసర్గను నేరుగా ప్రతిబింబిస్తూ, మహిమ అనే స్థితి లేదా పరిధిలో ఉండడాన్ని నిలుపుతుంది.
- source_word: πολλῷ μᾶλλον
  choice: మరెంత ఎక్కువగా
  rationale: బలమైన తులనాత్మక భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అంతమొందుతున్నది మరియు నిలిచి ఉండేది దేనిని సూచిస్తాయి?
  choice: ఈ వచనంలో వాటిని ప్రత్యేకంగా పాత నిబంధన, కొత్త నిబంధన అని చేర్చకుండా, మూలంలోని నపుంసకలింగ కృదంతాలనే అనుసరించాం.
  alternative: సందర్భాన్ని వివరిస్తూ వాటిని పాత నిబంధన పరిచర్య, కొత్త నిబంధన పరిచర్య అని స్పష్టంగా పేర్కొనవచ్చు.
  rationale: గ్రీకు వచనం ఈ పదాలను ఇక్కడ ప్రత్యక్షంగా పేర్కొనదు. అందువల్ల పౌలు ఉద్దేశించిన వ్యత్యాసాన్ని సందర్భమే వివరించనిచ్చి, అనువాదంలో అదనపు సిద్ధాంత నిర్ధారణను చేర్చలేదు.
- issue: καταργούμενον యొక్క భావం
  choice: అంతమొందుతున్నది
  alternative: తొలగించబడుతున్నది; రద్దు చేయబడుతున్నది; క్షీణించిపోతున్నది
  rationale: ఈ పదానికి ఉన్న ‘ప్రభావరహితం చేయడం/అంతానికి తేవడం’ అనే భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, దాని పరిధిలోని ఇతర సాధ్యమైన భావాలను పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మహిమతో వచ్చింది’ మరియు ‘మహిమలో ఉంటుంది’ అనే భేదం ద్వారా διὰ δόξης / ἐν δόξῃ మధ్యనున్న మూలభాషా వ్యత్యాసాన్ని వీలైనంతగా కాపాడాం. ప్రధాన పాఠ్యంలోని ప్రతి పాదటిప్పణి గుర్తు సంబంధిత పదబంధం తరువాత ఉంచబడింది.
