revisions:
- from: ఆయన రాకవల్లనే[a] కాదు, మీ కారణంగా ఆయన పొందిన ఓదార్పువల్ల కూడా[b] నేను ఓదార్పు పొందాను. నా కోసం మీకున్న ఆరాటాన్ని, మీ విలాపాన్ని[c], నా పట్ల మీకున్న ఉత్సాహాన్ని ఆయన మాకు తెలియజేశాడు. దాంతో నేను మరింతగా సంతోషించాను.
