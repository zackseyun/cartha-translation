id: 2CO.7.7
reference: 2 Corinthians 7:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: te
  text: ఆయన రాకవల్లనే[a] కాదు, మీ కారణంగా ఆయన పొందిన ఓదార్పు వల్ల కూడా[b] నేను ఓదార్పు పొందాను. ఆయన మాకు మీ ఆరాటాన్ని, మీ విలాపాన్ని[c], నా పట్ల మీకున్న ఉత్సాహాన్ని తెలియజేశాడు. దాంతో నేను మరింతగా సంతోషించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆయన సన్నిధి వల్ల.’
    reason: lexical_alternative
  - marker: b
    text: ‘ఓదార్పు’కు బదులుగా ఈ వాక్యంలో రెండు చోట్లా ‘ప్రోత్సాహం’ అని కూడా అనువదించవచ్చు. ‘మీ కారణంగా’కు బదులుగా ‘మీ గురించి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_and_syntactical_alternative
  - marker: c
    text: లేదా ‘మీ దుఃఖాన్ని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παρουσίᾳ
  choice: రాక
  rationale: తీతు వ్యక్తిగతంగా వారి దగ్గర నుంచి పౌలు వద్దకు చేరుకున్న సందర్భంలో ఇది సాధారణ ‘సన్నిధి’కన్నా అతని రాకను సూచిస్తుంది.
- source_word: παρακλήσει / παρεκλήθη
  choice: ఓదార్పు / పొందిన ఓదార్పు
  rationale: నామవాచకం, క్రియ మధ్య ఉన్న మూలపద సంబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, కష్టానంతరం కలిగిన మనశ్శాంతి మరియు ధైర్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐφ’ ὑμῖν
  choice: మీ కారణంగా
  rationale: కొరింథీయుల స్పందన తీతుకు ఓదార్పు కలిగించిన సందర్భం లేదా కారణాన్ని సూచిస్తుంది; ‘మీ గురించి’ అనే భావం కూడా వ్యాకరణపరంగా సాధ్యమే.
- source_word: ἀναγγέλλων
  choice: ఆయన మాకు తెలియజేశాడు
  rationale: వారి స్పందన గురించి పౌలుకు తీతు ద్వారా సమాచారం అందిందనే భావాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో తెలియజేస్తుంది.
- source_word: ἐπιπόθησιν
  choice: ఆరాటం
  rationale: బలమైన కోరికను, తహతహను భావోద్వేగ తీవ్రతతో వ్యక్తం చేస్తుంది.
- source_word: ὀδυρμόν
  choice: విలాపం
  rationale: ఇది కేవలం అంతర్గత దుఃఖమే కాక, వ్యక్తమైన శోకాన్ని కూడా సూచించే బలమైన పదం.
- source_word: ζῆλον
  choice: ఉత్సాహం
  rationale: పౌలు పట్ల వారి తీవ్రమైన ఆసక్తి, శ్రద్ధ, తపనను సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὑπὲρ ἐμοῦ
  choice: నా పట్ల
  rationale: వారి ఉత్సాహం పౌలును ఉద్దేశించి ఉందనే విస్తృత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: దాంతో నేను మరింతగా సంతోషించాను
  rationale: ఫలితాన్ని మరియు μᾶλλον లోని తులనాత్మక బలాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἐφ’ ὑμῖν యొక్క సంబంధ భావం
  choice: మీ కారణంగా
  alternative: మీ గురించి
  rationale: ఈ సందర్భంలో కొరింథీయుల స్పందనే తీతు పొందిన ఓదార్పుకు సందర్భం లేదా కారణం; అయితే గ్రీకు ప్రయోగం ‘వారి గురించి’ అనే భావాన్నీ అనుమతిస్తుందని పాదసూచికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. గ్రీకు వాక్యం ముందరి వచనంపై ఆధారపడినప్పటికీ, తెలుగు వచనం స్వతంత్రంగా స్పష్టంగా ఉండేందుకు ముందరి వచనంలోని ‘నేను ఓదార్పు పొందాను’ అనే భావం సందర్భానుసారంగా పునరుద్ధరించబడింది. వరుసగా ఉన్న భావోద్వేగ నామవాచకాల తీవ్రతను ‘ఆరాటం, విలాపం, ఉత్సాహం’ అనే క్రమంలో నిలుపబడింది.
