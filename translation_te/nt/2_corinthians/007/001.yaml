id: 2CO.7.1
reference: 2 Corinthians 7:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: te
  text: కాబట్టి, ప్రియులారా, మనకు ఈ వాగ్దానాలు ఉన్నందున, దేవుని భయంలో పరిశుద్ధతను సంపూర్ణం చేస్తూ, దేహానికీ ఆత్మకూ సంబంధించిన ప్రతి కల్మషం నుండి మనల్ని మనం శుద్ధి చేసుకుందాం.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేహానికీ ఆత్మకూ సంబంధించిన ప్రతి అపవిత్రత నుండి.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘దేవుని భయం’ అంటే కేవలం భీతి కాదు; దేవుని ఎదుట ఉండే భక్తిపూర్వక విస్మయం, గంభీర గౌరవం కూడా ఇందులో ఉన్నాయి.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘దేవుని భయంలో పరిశుద్ధతను పరిపూర్ణం చేసుకుంటూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ταύτας ... τὰς ἐπαγγελίας
  choice: ఈ వాగ్దానాలు
  rationale: ταύτας ముందున్న వాగ్దానాలను సూచిస్తుంది; ἐπαγγελίαకు పౌలు వాడుకలో సహజమైన, స్పష్టమైన తెలుగు పదం ‘వాగ్దానం’.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాక్యాలు, ఉల్లేఖనాల నుండి వచ్చే నిర్ధారణను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀγαπητοί
  choice: ప్రియులారా
  rationale: ఆప్యాయతతో కూడిన సంబోధనను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: మనల్ని మనం శుద్ధి చేసుకుందాం
  rationale: మొదటి పురుష బహువచన exhortative subjunctiveను పౌలుతోపాటు పాఠకులను చేర్చుకునే ప్రోత్సాహక ఆజ్ఞగా నిలుపుతుంది.
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: ప్రతి కల్మషం నుండి
  rationale: μολυσμόςలోని మతపరమైన, నైతిక అపవిత్రత లేదా మలినపు భావాన్ని ‘కల్మషం’ సంక్షిప్తంగా మోస్తుంది.
- source_word: σαρκὸς καὶ πνεύματος
  choice: దేహానికీ ఆత్మకూ కలిగే
  rationale: ఇక్కడ σάρξ–πνεῦμα జత మానవుని బాహ్య/శారీరక మరియు అంతరంగ పార్శ్వాలను సూచిస్తుంది. ‘దేహం–ఆత్మ’ తెలుగు పాఠకునికి సహజంగా ఉండి, ‘పాప స్వభావం’ అనే అతివ్యాఖ్యానాన్ని నివారిస్తుంది.
- source_word: ἐπιτελοῦντες
  choice: సంపూర్ణం చేస్తూ ఉందాం
  rationale: ప్రధాన ప్రోత్సాహక క్రియతో పాటు సాగే కార్యాన్ని participial రూపానికి దగ్గరగా ఉంచి, పరిశుద్ధతను దాని ఉద్దేశిత పరిపూర్ణతవైపు కొనసాగించే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἁγιωσύνην
  choice: పరిశుద్ధతను
  rationale: నైతిక, ఆధ్యాత్మిక పవిత్రత అనే స్థితి లేదా గుణాన్ని తెలిపే స్థిరమైన తెలుగు బైబిలు పదం.
- source_word: ἐν φόβῳ θεοῦ
  choice: దేవుని భయంలో
  rationale: దేవుని పట్ల భక్తిపూర్వక విస్మయం అనే భావం ఉన్నప్పటికీ, మూలంలోని బలమైన ‘భయం’ పదాన్ని మృదువుచేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘దేహం మరియు ఆత్మ కల్మషం’లో σάρξ అర్థం
  choice: ‘దేహం’గా అనువదించబడింది; ‘పాప స్వభావం’గా కాదు.
  alternative: ‘మాంసం’ లేదా ‘పాప స్వభావం’
  rationale: πνεῦμαతో ఉన్న జత మొత్తం వ్యక్తిలోని శారీరక, అంతరంగ పార్శ్వాలను సూచిస్తుంది. ఇక్కడ పతిత పాపప్రవృత్తి అనే పౌలు ప్రత్యేకార్థాన్ని బలవంతంగా చేర్చకూడదు.
- issue: καθαρίσωμεν అనే hortatory subjunctive బలం
  choice: పౌలును, పాఠకులను చేర్చే ‘శుద్ధి చేసుకుందాం’ అనే ప్రోత్సాహక ఆజ్ఞ
  alternative: ‘శుద్ధి చేసుకోవాలి’ అనే సాధారణ విధి ప్రకటన
  rationale: గ్రీకు మొదటి పురుష బహువచన రూపంలోని సమైక్యమైన కాపరి స్వరాన్ని, ఆజ్ఞ బలాన్ని రెండింటినీ కాపాడుతుంది.
- issue: దేవునికి సంబంధించి φόβος భావం
  choice: ‘దేవుని భయం’ అనే బైబిలు నుడికారాన్ని నిలుపడం
  alternative: ‘దేవుని పట్ల భక్తిపూర్వక గౌరవం’
  rationale: ఇది కేవలం భీతిని కాక భక్తిపూర్వక విస్మయాన్ని సూచించినా, ‘గౌరవం’గా మాత్రమే మార్చితే మూలంలోని గంభీరమైన ఉద్వేగం తగ్గిపోతుంది.
- issue: ἐπιτελοῦντες ἁγιωσύνην యొక్క సంబంధం
  choice: తమను శుద్ధి చేసుకోవడంతో పాటు కొనసాగించే కార్యంగా ‘పరిశుద్ధతను సంపూర్ణం చేస్తూ ఉందాం’
  alternative: వేరొక స్వతంత్ర ఆజ్ఞగా ‘పరిశుద్ధతను సంపూర్ణం చేసుకుందాం’
  rationale: గ్రీకులో ఇది participle; అందువల్ల ప్రధాన exhortationతో దాని వ్యాకరణ సంబంధాన్ని నిలుపుతూనే కార్యం కొనసాగుతూ పరిపూర్ణతకు చేరే భావాన్ని వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో ఆప్యాయతతో కూడిన గంభీర ఉపదేశ స్వరం వాడబడింది. ‘ప్రియులారా’, ‘వాగ్దానాలు’, ‘శుద్ధి’, ‘పరిశుద్ధత’ వంటి సుపరిచితమైన బైబిలు పదాలను ఉంచి, అసహజమైన పదానువాదాన్ని నివారించాం. ‘దేవుని భయం’ అనే ఉద్దేశపూర్వక ఉద్వేగాన్ని పాదసూచికలో వివరిస్తూ ప్రధాన పాఠ్యంలో నిలిపాం.
