id: 2CO.7.6
reference: 2 Corinthians 7:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ παρακαλῶν τοὺς ταπεινοὺς παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: te
  text: అయితే దీనులను[a] ఆదరించే దేవుడు తీతు రావడం ద్వారా[b] మమ్మల్ని ఆదరించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, ‘కృంగిపోయినవారిని,’ ‘అణగారినవారిని,’ లేదా ‘వినయస్థులను.’
    reason: lexical_alternative
  - marker: b
    text: లేక, ‘తీతు సన్నిధి ద్వారా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: అయితే
  rationale: ముందటి వచనంలో చెప్పిన కష్టాలకు విరుద్ధంగా దేవుడు ఇచ్చిన ఆదరణను సహజంగా సూచిస్తుంది.
- source_word: ὁ παρακαλῶν
  choice: ఆదరించే
  rationale: వర్తమాన కృదంతం దేవుని నిరంతర లక్షణాత్మక కార్యాన్ని తెలుపుతుంది; ఇదే మూలపదంతో వచ్చిన ప్రధాన క్రియతో పదసంబంధాన్ని నిలుపుతుంది.
- source_word: τοὺς ταπεινοὺς
  choice: దీనులను
  rationale: పరిస్థితులవల్ల కృంగిపోయినవారు, అణగారినవారు, వినయస్థులు అనే భావపరిధిని అతిగా కుదించకుండా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παρεκάλεσεν
  choice: ఆదరించాడు
  rationale: బాధలో ఉన్నవారికి ఓదార్పు, ధైర్యం కలిగించడం అనే సందర్భార్థాన్ని ఇస్తూ ὁ παρακαλῶνతో ఉన్న పదసంబంధాన్ని కాపాడుతుంది.
- source_word: ἐν τῇ παρουσίᾳ
  choice: రావడం ద్వారా
  rationale: παρουσία ఇక్కడ తీతు రాకను లేదా అతని సన్నిధిని సూచించవచ్చు; సందర్భంలో అతని రాక అనే సంఘటనార్థం సహజంగా సరిపోతుంది.
- source_word: Τίτου
  choice: తీతు
  rationale: గ్రీకు వ్యక్తినామానికి తెలుగులో స్థిరమైన లిప్యంతరీకరణ.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: క్రియకు స్పష్టమైన కర్తను సాధారణ తెలుగు వాక్యక్రమంలో ఉంచుతుంది.
theological_decisions:
- issue: τοὺς ταπεινοὺς యొక్క సందర్భార్థం
  choice: దీనులను
  alternative: కృంగిపోయినవారిని; అణగారినవారిని; వినయస్థులను
  rationale: పదం మనోస్థితినే కాక సామాజిక స్థితి లేదా వినయాన్ని కూడా సూచించగలదు. ప్రధాన పాఠంలో ‘దీనులను’ ఉంచి విస్తృత భావాన్ని కాపాడుతూ, ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
- issue: ἐν τῇ παρουσίᾳ Τίτου యొక్క భావం
  choice: తీతు రావడం ద్వారా
  alternative: తీతు సన్నిధి ద్వారా
  rationale: సందర్భం తీతు చేరుకున్న సంఘటనను బలంగా సూచించినా, గ్రీకు పదంలో ‘సన్నిధి’ అనే భావం కూడా ఉంది; దానిని పాదసూచికలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. παρακαλέω పదం రెండుసార్లు వచ్చినందున రెండుచోట్లా ‘ఆదరించు’ అనే ఒకే ధాతువును వాడి మూలంలోని పదసంబంధాన్ని నిలిపాం.
