- issue: రెండు రకాల దుఃఖాల మధ్య వ్యత్యాసం
  choice: ‘దేవునికి అనుగుణమైన దుఃఖం’ మరియు ‘లోకసంబంధమైన దుఃఖం’ అని అనువదించి, ‘మరణం’ ఏ విధమైనదో నిర్దిష్టంగా చెప్పలేదు.
