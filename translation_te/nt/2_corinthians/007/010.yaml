- source_word: θάνατον
  choice: మరణం
  rationale: మూలంలోని విస్తృత అర్థాన్ని అలాగే ఉంచుతుంది; అది శారీరకమా, ఆత్మసంబంధమైనదా, అంతిమమైనదా అని అనువాదం నిర్ణయించదు.
- source_word: κατεργάζεται
  choice: కలిగిస్తుంది
  rationale: మొదటి క్రియతో భావపరమైన సమాంతరతను నిలుపుతుంది; గ్రీకులోని స్వల్ప క్రియా భేదాన్ని తెలుగులో కృత్రిమంగా అతిశయింపదు.
