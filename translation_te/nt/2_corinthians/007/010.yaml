  rationale: గ్రీకు పదక్రమం మరియు వ్యాకరణ సంబంధం ఒకటి కంటే ఎక్కువ అనుసంధానాలకు వీలు ఇస్తాయి; ఆ నిజమైన అస్పష్టతను పాదసూచికలో నిలుపడం సముచితం.
