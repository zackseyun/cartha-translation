  rationale: εἰς σωτηρίαν రక్షణను లక్ష్యం లేదా ఫలితంగా చూపుతుంది; రక్షణ ఎలా సంభవిస్తుందో వచనం చెప్పిన దానికంటే ఎక్కువగా నిర్వచించకూడదు.
- issue: ἀμεταμέλητον దేనిని విశేషిస్తుంది
  choice: ప్రధాన వాక్యంలో మొత్తం పశ్చాత్తాపం-రక్షణ భావసముదాయంతో సహజంగా అనుసంధానించి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
