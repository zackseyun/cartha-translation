  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: te
  text: దేవునికి అనుగుణమైన దుఃఖం[a] రక్షణకు దారితీసే, తరువాత విచారించనవసరం లేని పశ్చాత్తాపాన్ని కలిగిస్తుంది[b]; అయితే లోకసంబంధమైన దుఃఖం మరణాన్ని కలిగిస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘దేవుని ప్రకారమైన దుఃఖం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘రక్షణకు దారితీసే, పశ్చాత్తాపం కలిగించినందుకు తరువాత విచారించనవసరం లేని పశ్చాత్తాపాన్ని కలిగిస్తుంది.’ గ్రీకులో ‘తరువాత విచారించనవసరం లేని’ అనే పదం నేరుగా ‘పశ్చాత్తాపం’ను విశేషిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: దేవునికి అనుగుణమైన
  rationale: ఈ పదబంధం దేవుని ప్రమాణానికి లేదా చిత్తానికి అనుగుణంగా ఉండే దుఃఖాన్ని సూచిస్తుంది. ‘దైవికమైన’ కంటే ఇది మూలంలోని ‘దేవుని ప్రకారం’ అనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: λύπη
  choice: దుఃఖం
  rationale: రెండు భాగాల్లోనూ భావోద్వేగ మరియు నైతిక సందర్భానికి సరిపోయే సహజమైన తెలుగు పదం.
- source_word: μετάνοιαν
  choice: పశ్చాత్తాపం
  rationale: ఇక్కడ ఇది కేవలం అభిప్రాయ మార్పును కాక, నైతికంగా దేవునివైపు తిరిగే మార్పును సూచిస్తుంది; ఆధునిక తెలుగు క్రైస్తవ వాడుకలో ‘పశ్చాత్తాపం’ స్పష్టమైన సమానార్థకం.
- source_word: εἰς σωτηρίαν
  choice: రక్షణకు నడిపిస్తుంది
  rationale: εἰς లోని లక్ష్య లేదా ఫలిత దిశను సహజమైన తెలుగులో తెలియజేస్తుంది; రక్షణ యొక్క కార్యవిధానాన్ని అనవసరంగా నిర్వచించదు.
- source_word: ἀμεταμέλητον
  choice: దాని గురించి విచారించాల్సిన అవసరం ఉండదు
  rationale: ‘పశ్చాత్తాపపడనక్కరలేని’ అని అనువదిస్తే μετάνοια మరియు μεταμέλομαι మధ్య తెలుగులో గందరగోళం కలగవచ్చు. ఈ రూపం ‘not to be regretted’ అనే భావాన్ని తెలియజేస్తూ, విశేషణం దేనిని విశేషిస్తుందనే అస్పష్టతను పాదసూచికలో నిలుపుతుంది.
- source_word: ἐργάζεται
  choice: కలిగిస్తుంది
  rationale: ఒక ఫలితాన్ని ఉత్పత్తి చేయడం లేదా తీసుకురావడం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ κόσμου
  choice: లోకసంబంధమైన
