revisions:
- from: ఎందుకంటే, మేము మాసిదోనియకు వచ్చినప్పుడు కూడా మా శరీరానికి[a] ఏమాత్రం విశ్రాంతి దొరకలేదు. బదులుగా, మేము అన్ని విధాలా బాధించబడ్డాం—బయట పోరాటాలు, లోపల భయాలు.
  to: ఎందుకంటే, మేము మాసిదోనియకు వచ్చినప్పుడు కూడా మా శరీరానికి[a] ఏమాత్రం ఉపశమనం కలగలేదు. కానీ మేము అన్ని విధాలా బాధించబడ్డాం—బయట ఘర్షణలు, లోపల భయాలు—
  rationale: 'The revision makes only limited lexical and connective adjustments: it renders ἄνεσις as ‘ఉపశమనం,’ replaces the overly substitutive ‘బదులుగా’ with adversative ‘కానీ,’ and uses ‘ఘర్షణలు’ for the broad contextual sense of μάχαι. The final dash is retained to reflect the source’s unfinished, emphatic paired phrasing. The σάρξ footnote anchor and its lexical alternative are preserved.'
