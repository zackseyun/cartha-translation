id: 2CO.7.5
reference: 2 Corinthians 7:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ γὰρ ἐλθόντων ἡμῶν εἰς Μακεδονίαν οὐδεμίαν ⸀ἔσχηκεν ἄνεσιν ἡ σὰρξ ἡμῶν, ἀλλ’ ἐν παντὶ θλιβόμενοι— ἔξωθεν μάχαι, ἔσωθεν φόβοι—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: te
  text: ఎందుకంటే, మేము మాసిదోనియకు వచ్చినప్పుడు కూడా మా శరీరానికి[a] ఏమాత్రం ఉపశమనం కలగలేదు. కానీ మేము అన్ని విధాలా బాధించబడ్డాం—బయట ఘర్షణలు, లోపల భయాలు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాకు ఏమాత్రం ఉపశమనం కలగలేదు.” గ్రీకులో అక్షరార్థంగా “మా శరీరానికి” అని ఉంది; ఇది శరీరంతో కూడిన మానవ బలహీనతను, క్షోభను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: ఎందుకంటే ... కూడా
  rationale: ముందున్న సందర్భానికి వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’ తెలియజేస్తుంది; గ్రీకు పదబంధంలోని స్వల్ప ఉద్ఘాటనను ‘కూడా’ సహజంగా నిలుపుతుంది.
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: మేము మాసిదోనియకు వచ్చినప్పుడు
  rationale: జెనిటివ్ అబ్సల్యూట్‌ను కాలార్థక ఉపవాక్యంగా సహజమైన తెలుగులో అందిస్తుంది; εἰς సూచించే గమనాన్ని ‘-కు’ నిలుపుతుంది.
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: ఏమాత్రం విశ్రాంతి దొరకలేదు
  rationale: ἄνεσις‌లోని విశ్రాంతి లేదా ఒత్తిడి నుంచి ఉపశమన భావాన్ని సహజంగా తెలియజేస్తుంది; οὐδεμίαν యొక్క సంపూర్ణ నిరాకరణను ‘ఏమాత్రం’ బలపరుస్తుంది.
- source_word: ἡ σὰρξ ἡμῶν
  choice: మా శరీరానికి
  rationale: ఇక్కడ σάρξ పాపస్వభావాన్ని సూచించకుండా, శరీరంతో కూడిన మానవ బలహీనతను మరియు క్షోభను సూచిస్తుంది. ‘శరీరం’ మూలంలోని దేహసంబంధ రూపకాన్ని తెలుగులో అర్థవంతంగా నిలుపుతుంది.
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: బదులుగా, మేము అన్ని విధాలా బాధించబడ్డాం
  rationale: ἀλλά చూపే వ్యత్యాసాన్ని ‘బదులుగా’ స్పష్టం చేస్తుంది; θλιβόμενοι యొక్క ఒత్తిడికి గురికావడం లేదా బాధింపబడడం అనే విస్తృత భావాన్ని నిష్క్రియ రూపంలో నిలుపుతుంది.
- source_word: ἔξωθεν μάχαι
  choice: బయట పోరాటాలు
  rationale: μάχαι అనేది తప్పనిసరిగా సాయుధ యుద్ధాలనే కాక వ్యతిరేకతలు, ఘర్షణలు, పోరాటాలను సూచించగలదు. ‘పోరాటాలు’ ఆ విస్తృతతను కాపాడుతుంది.
- source_word: ἔσωθεν φόβοι
  choice: లోపల భయాలు
  rationale: బాహ్య పోరాటాలకు విరుద్ధంగా అంతరంగ భయాలను సంక్షిప్తమైన సమాంతర నిర్మాణంలో తెలియజేస్తుంది.
theological_decisions:
- issue: σάρξ పదానికి అనువాదం
  choice: మా శరీరానికి
  alternative: మాకు మేమే / మాకు
  rationale: ఈ సందర్భంలో σάρξ నైతికంగా ‘పాపస్వభావం’ అని అర్థం కాదు; శరీరంతో కూడిన మానవ అశక్తత, క్షోభను సూచిస్తుంది. అందువల్ల దేహసంబంధ మూలవ్యక్తీకరణను ప్రధాన పాఠ్యంలో ఉంచి, సహజమైన వ్యక్తిసూచక అర్థాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘బయట పోరాటాలు, లోపల భయాలు’ అనే సమాంతర నిర్మాణం మూలంలోని సంక్షిప్తతను, వాక్చాతుర్యాన్ని నిలుపుతుంది.
