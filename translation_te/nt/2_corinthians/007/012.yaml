id: 2CO.7.12
reference: 2 Corinthians 7:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: te
  text: కాబట్టి, నేను మీకు రాసినా కూడా, తప్పు చేసినవాని కోసమో అన్యాయానికి గురైనవాని కోసమో కాదు; దేవుని సన్నిధిలో మా పట్ల మీకున్న హృదయపూర్వక శ్రద్ధ[b] మీ మధ్య వెల్లడికావాలనే రాశాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో, “దేవుని సన్నిధిలో మీ పట్ల మాకున్న హృదయపూర్వక శ్రద్ధ మీ మధ్య వెల్లడికావాలనే” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా “పట్టుదల,” “ఉత్సాహం,” లేదా “గాఢమైన శ్రద్ధ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: కాబట్టి, ... రాసినప్పటికీ
  rationale: ἄρα యొక్క నిర్ధారణాత్మక అనుసంధానాన్ని ‘కాబట్టి’తో, εἰ καὶ యొక్క concessive భావాన్ని ‘రాసినప్పటికీ’తో సహజమైన తెలుగులో నిలిపింది.
- source_word: ἔγραψα ὑμῖν
  choice: నేను మీకు రాసినప్పటికీ
  rationale: అయోరిస్ట్ క్రియను గతంలో పౌలు రాసిన ఉత్తరాన్ని సూచించే సాధారణ భూతకాల రూపంలో ఇచ్చింది.
- source_word: οὐχ ἕνεκεν τοῦ ἀδικήσαντος
  choice: అది తప్పు చేసిన వ్యక్తిని బట్టి ... కాదు
  rationale: సుబ్‌స్టాంటివల్ పార్టిసిపిల్‌లోని క్రియాత్మక భావాన్ని నిలిపి, న్యాయపరమైన ప్రత్యేక పదజాలాన్ని అనవసరంగా రుద్దకుండా వ్యక్తిగతంగా అనువదించింది.
- source_word: οὐδὲ ἕνεκεν τοῦ ἀδικηθέντος
  choice: అన్యాయానికి గురైన వ్యక్తిని బట్టిగానీ కాదు
  rationale: నిష్క్రియ పార్టిసిపిల్ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, ముందరి పదబంధంతో సమాంతరతను కాపాడింది.
- source_word: ἀλλ’ ἕνεκεν τοῦ φανερωθῆναι
  choice: వెల్లడికావాలనే రాశాను
  rationale: ἕνεκενతో కూడిన articular infinitive యొక్క ప్రయోజనార్థాన్ని, φανερωθῆναι యొక్క నిష్క్రియ భావంతో సహా తెలుగులో స్పష్టంగా తెలిపింది.
- source_word: τὴν σπουδὴν ὑμῶν
  choice: మీకున్న హృదయపూర్వక శ్రద్ధ
  rationale: σπουδήలోని గంభీరమైన ఆసక్తి, శ్రద్ధ, ఉత్సాహం అనే భావాలను సాధారణ పాఠకులకు సహజంగా అందిస్తుంది; ఒక్క నిర్దిష్ట భావానికి పరిమితం చేయకుండా ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచింది.
- source_word: τὴν ὑπὲρ ἡμῶν
  choice: మా పట్ల
  rationale: ὑπέρ ఇక్కడ పౌలు మరియు అతని సహచరుల పట్ల ఉన్న అనుకూల శ్రద్ధ లేదా ఆసక్తిని సూచిస్తుంది.
- source_word: πρὸς ὑμᾶς
  choice: మీ మధ్య
  rationale: ఈ క్లిష్ట వాక్యనిర్మాణంలో ప్రత్యక్షత కొరింథీయుల సమాజంలో కలగడాన్ని సూచించే సందర్భోచిత అర్థాన్ని ఎంచుకుంది; గ్రీకు పాఠంలోని అసౌకర్యాన్ని అతిగా వివరించలేదు.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని సన్నిధిలో
  rationale: దేవుని సమక్షం మరియు సాక్షిత్వం అనే గంభీరమైన భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలిపింది.
theological_decisions:
- issue: τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς అనే క్లిష్ట పాఠంలో శ్రద్ధ ఎవరిది, ఎవరి పట్లది అనే ప్రశ్న
  choice: ‘మా పట్ల మీకున్న ... శ్రద్ధ మీ మధ్య వెల్లడికావాలి’
  alternative: ‘మీ పట్ల మాకున్న ... శ్రద్ధ మీ మధ్య వెల్లడికావాలి’
  rationale: SBLGNT ముద్రిత పాఠంలోని ὑμῶνను ‘మీ’, ὑπὲρ ἡμῶνను ‘మా పట్ల’గా నేరుగా అనుసరించింది. ప్రసిద్ధమైన మరో పాఠాంతరాన్ని ప్రధాన పాఠంలో కలపకుండా పాదసూచికలో భద్రపరిచింది.
- issue: పౌలు రాసిన ఉద్దేశంలో తప్పు చేసినవాడు మరియు అన్యాయానికి గురైనవాడి పాత్ర
  choice: ఇద్దరినీ కారణంగా నిరాకరిస్తూ, కొరింథీయుల శ్రద్ధ వెల్లడికావడమే ఉద్దేశమని తెలిపింది
  alternative: వారిలో ఒకరి ప్రయోజనార్థమే పౌలు రాశాడని అర్థం చేయడం
  rationale: οὐχ ... οὐδὲ ... ἀλλά అనే స్పష్టమైన వ్యతిరేక నిర్మాణాన్ని అలాగే ఉంచి, వాక్యంలోని ఉద్దేశ సంబంధమైన ఉద్వేగాన్ని సిద్ధాంతపరంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. ‘బట్టిగానీ ... బట్టిగానీ కాదు’ అనే నిర్మాణం గ్రీకు సమాంతరతను సహజంగా నిలుపుతుంది. పాఠాంతర సూచిక [a] సంబంధిత క్లిష్ట ఉపవాక్యంపైన, పదార్థ సూచిక [b] ‘హృదయపూర్వక శ్రద్ధ’పైన ఉంచబడ్డాయి.
