id: 2CO.7.9
reference: 2 Corinthians 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: te
  text: ఇప్పుడు నేను సంతోషిస్తున్నాను. మీరు దుఃఖపడ్డారని కాదు, పశ్చాత్తాపానికి దారితీసేలా మీరు దుఃఖపడ్డారని సంతోషిస్తున్నాను.[a] ఎందుకంటే మా వల్ల మీరు ఏ విషయంలోనూ నష్టపోకుండా ఉండేలా, మీరు దేవునికి అనుగుణంగా దుఃఖపడ్డారు.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనస్సు మార్పుకు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవుని ప్రకారం” లేదా “దేవుడు కోరిన విధంగా.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మా వల్ల మీరు ఏ విధంగానూ హాని పొందకుండా ఉండేలా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν χαίρω
  choice: ఇప్పుడు నేను సంతోషిస్తున్నాను
  rationale: νῦν యొక్క కాలసూచనను, χαίρω యొక్క వర్తమాన ఆనందాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐλυπήθητε
  choice: మీరు దుఃఖపడ్డారు
  rationale: మూలంలోని పునరుక్తిని సాధ్యమైనంతవరకు నిలుపుతూ, అనుభవించిన దుఃఖాన్ని సహజంగా వ్యక్తపరుస్తుంది; దానికి కారణమైన వ్యక్తిని అనవసరంగా నిర్దేశించదు.
- source_word: εἰς μετάνοιαν
  choice: మీ దుఃఖం పశ్చాత్తాపానికి దారితీసింది
  rationale: εἰς సూచించే దిశ లేదా ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది. ఈ సందర్భంలో μετάνοιαకు నైతిక-ఆధ్యాత్మిక భావం ఉన్నందున ‘పశ్చాత్తాపం’ ప్రధాన పాఠంలో సముచితం.
- source_word: κατὰ θεόν
  choice: దేవుని ప్రకారం
  rationale: దుఃఖం దేవుని ప్రమాణానికి, చిత్తానికి లేదా ఉద్దేశానికి అనుగుణంగా ఉందనే సంబంధాన్ని ఏకార్థంగా కుదించకుండా మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
- source_word: ἵνα ἐν μηδενὶ ζημιωθῆτε
  choice: మీరు ఏ విషయంలోనూ నష్టపోకుండా ఉన్నారు
  rationale: ἵνα ఉపవాక్యం సూచించే ఉద్దేశిత ఫలితాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తూ, ζημιόω యొక్క ‘నష్టం పొందడం’ అనే విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: ἐξ ἡμῶν
  choice: మా మూలంగా
  rationale: ἐξ ఇక్కడ సూచించే కారణాత్మక మూలాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘మా వల్ల’ కూడా సాధ్యమే.
theological_decisions:
- issue: μετάνοια యొక్క భావం
  choice: పశ్చాత్తాపం
  alternative: మనస్సు మార్పు
  rationale: ఈ సందర్భంలో ఇది కేవలం అభిప్రాయ మార్పు కాకుండా, దుఃఖం ద్వారా కలిగిన నైతిక-ఆధ్యాత్మిక మళ్లింపును సూచిస్తుంది. అయినప్పటికీ పదంలోని ‘మనస్సు మార్పు’ భావాన్ని పాదసూచికలో ఉంచాం.
- issue: κατὰ θεόν లో దుఃఖ స్వభావం
  choice: దేవుని ప్రకారం
  alternative: దేవునికి అనుగుణంగా; దేవుడు కోరిన విధంగా
  rationale: ఈ పదబంధం దేవుని ప్రమాణం, చిత్తం లేదా ఉద్దేశంతో ఉన్న సంబంధాన్ని సూచించవచ్చు. ప్రధాన పాఠం ఈ భావవిస్తృతిని ముందుగానే ఒకే వివరణకు పరిమితం చేయదు.
- issue: ἵνα ఉపవాక్యంలోని ఉద్దేశం మరియు ఫలితం
  choice: నష్టపోకుండా ఉన్నారు
  alternative: నష్టపోకూడదని; నష్టపోకుండా ఉండేలా
  rationale: సందర్భంలో పౌలు ఉద్దేశించిన ఫలితం వాస్తవంగా నెరవేరిందనే భావం సహజంగా వినిపిస్తుంది; ప్రత్యామ్నాయాలు ఉద్దేశ భావాన్ని మరింత ప్రత్యక్షంగా చూపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని దుఃఖం అనే క్రియ పునరుక్తిని కొంతవరకు నిలిపి, తెలుగులో అసహజత రాకుండా రెండవ వాక్యంలో ‘దారితీసింది’ ఉపయోగించాం. ‘దేవుని ప్రకారం’ అనే కొంత సాంద్రమైన పదబంధాన్ని ఉద్దేశపూర్వకంగా నిలిపి, దాని సాధ్యమైన భావాలను పాదసూచికలో ఇచ్చాం.
