id: 2CO.7.2
reference: 2 Corinthians 7:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Χωρήσατε ἡμᾶς· οὐδένα ἠδικήσαμεν, οὐδένα ἐφθείραμεν, οὐδένα ἐπλεονεκτήσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/002.yaml
  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: te
  text: మాకు చోటివ్వండి[a]. మేము ఎవరికీ అన్యాయం చేయలేదు, ఎవరినీ చెడగొట్టలేదు[b], ఎవరి నుండీ అన్యాయంగా లాభం పొందలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మమ్మల్ని స్వీకరించండి,’ ‘మీ హృదయాల్లో మాకు చోటివ్వండి.’ గ్రీకు వాక్యం అక్షరార్థంగా ‘మాకు చోటివ్వండి’ అని చెబుతుంది; ఇది బహుశా 6:11–13లోని సంబంధపరమైన రూపకాన్ని కొనసాగిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఎవరినీ భ్రష్టుపట్టించలేదు,’ ‘ఎవరినీ నాశనం చేయలేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε
  choice: చోటివ్వండి
  rationale: χωρέω అనే క్రియకు అక్షరార్థంగా ‘చోటివ్వడం’ అనే భావం ఉంది. 2 కొరింథీయులు 6:11–13లోని హృదయవిశాలత, ఆప్యాయ స్వీకారం అనే సందర్భాన్ని ఇది రూపకాలంకారంతో కొనసాగిస్తుంది; ‘మమ్మల్ని స్వీకరించండి’ కంటే మూలంలోని రూపకాన్ని బాగా నిలుపుతుంది.
- source_word: ἡμᾶς
  choice: మాకు
  rationale: తెలుగులో ‘చోటివ్వండి’ అనే క్రియతో సహజంగా దత్తి విభక్తి అవసరం కాబట్టి, గ్రీకులోని ప్రత్యక్ష కర్మను భావానుగుణంగా ‘మాకు’ అని అనువదించాం.
- source_word: οὐδένα
  choice: ఎవరికీ / ఎవరినీ / ఎవరి నుండీ
  rationale: గ్రీకులో మూడుసార్లు వచ్చిన ‘ఎవరినీ కాదు’ అనే బలమైన పునరుక్తిని తెలుగులో ప్రతి క్రియకు తగిన విభక్తితో నిలిపాం.
- source_word: ἠδικήσαμεν
  choice: అన్యాయం చేయలేదు
  rationale: ἀδικέω అంటే ఒకరి పట్ల అన్యాయంగా ప్రవర్తించడం లేదా వారికి హాని చేయడం. ‘అన్యాయం చేయలేదు’ అనేది విస్తృతమైన మూలభావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐφθείραμεν
  choice: చెడగొట్టలేదు
  rationale: φθείρωకు చెడగొట్టు, భ్రష్టుపట్టు, నాశనం చేయు వంటి భావాలు ఉండవచ్చు. ఇక్కడ ‘చెడగొట్టలేదు’ నైతిక లేదా ఆత్మీయ హానిని సూచించగలదు, అయితే భౌతిక నాశనం అనే అతి నిర్దిష్ట భావాన్ని రుద్దదు.
- source_word: ἐπλεονεκτήσαμεν
  choice: అన్యాయంగా లాభం పొందలేదు
  rationale: πλεονεκτέω ఇతరులను తన లాభం కోసం వాడుకోవడం, దోచుకోవడం లేదా మోసంతో ప్రయోజనం పొందడం అనే భావాన్ని కలిగి ఉంది. ‘ఎవరి నుండీ అన్యాయంగా లాభం పొందలేదు’ ఆ స్వలాభపరమైన దోపిడీ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Χωρήσατε ἡμᾶςలో పౌలు చేస్తున్న విజ్ఞప్తి స్వభావం
  choice: పౌలు మరియు అతని సహచరులకు తమ అనురాగంలో, సంబంధంలో చోటివ్వాలనే విజ్ఞప్తి
  alternative: వారిని సాధారణంగా స్వీకరించండి లేదా ఆహ్వానించండి
  rationale: 6:11–13లో హృదయాలు విశాలం కావడం, అనురాగంలో ఇరుకుగా ఉండడం అనే తక్షణ సందర్భం సంబంధపరమైన భావాన్ని సూచిస్తుంది. అయినా మూలపాఠంలో ‘హృదయాలు’ అనే పదం ఈ వాక్యంలో లేదు కాబట్టి ప్రధాన పాఠంలో దాన్ని చేర్చకుండా రూపకాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. గ్రీకు వాక్యంలోని మూడు సమాంతర నిరాకరణలను నిలిపి, ప్రతి క్రియకు సహజమైన తెలుగు విభక్తులను ఉపయోగించాం. ప్రధాన పాఠం మూలంలోని సంబంధపరమైన రూపకాన్ని కాపాడుతూ సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా రూపొందించబడింది.
