id: 2CO.7.11
reference: 2 Corinthians 7:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: te
  text: 'ఇదిగో, దేవునికి అనుగుణమైన ఈ దుఃఖం మీలో ఎంతటి శ్రద్ధను కలిగించిందో చూడండి: అంతేకాదు, తమను తాము సమర్థించుకోవడం[a], అంతేకాదు, ఆగ్రహం, అంతేకాదు, భయం, అంతేకాదు, ఆకాంక్ష, అంతేకాదు, ఉత్సాహం, అంతేకాదు, శిక్ష విధించడం[b]. ఈ విషయంలో మీరు కలుషితం కానివారని అన్ని విధాలా నిరూపించుకున్నారు[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తమను తాము నిర్దోషులుగా చూపించుకోవడం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘న్యాయం చేయడం’ లేదా ‘ప్రతీకారం తీర్చడం.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘పవిత్రులని’ లేదా ‘నిర్మలులని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: ఇదిగో ... చూడండి
  rationale: γάρ సూచించే ముందటి భావంతో సంబంధాన్ని సందర్భం మోస్తుండగా, ἰδού యొక్క దృష్టిని ఆకర్షించే బలాన్ని సహజమైన తెలుగు ప్రయోగంతో స్పష్టంగా ఉంచుతుంది.
- source_word: τὸ κατὰ θεὸν λυπηθῆναι
  choice: దేవునికి అనుగుణంగా కలిగిన ఈ దుఃఖం
  rationale: κατὰ θεόν ను కేవలం ‘దైవికమైన’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా, దేవుని చిత్తం లేదా ప్రమాణానికి అనుగుణమైనదనే మూలభావాన్ని నిలుపుతుంది.
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: మీలో ఎంతటి శ్రద్ధను పుట్టించింది
  rationale: κατεργάζομαι ఫలితాన్ని కలిగించడాన్ని, σπουδή గంభీరమైన శ్రద్ధను సూచిస్తాయి; ఈ తెలుగు వాక్యం అంతరంగ నైతిక ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἀλλὰ
  choice: అంతేకాదు
  rationale: ఇక్కడ పదేపదే వచ్చే ἀλλά ప్రధానంగా వ్యతిరేకతను కాక, వరుసగా పెరుగుతున్న అదనపు ఫలితాలను నొక్కిచెబుతుంది. దాని వాక్చాతుర్య పునరుక్తిని తెలుగులో నిలుపుతుంది.
- source_word: ἀπολογίαν
  choice: మిమ్మల్ని మీరు సమర్థించుకోవడం
  rationale: తమ పాత్ర లేదా బాధ్యత విషయంలో వివరణ ఇచ్చి తమను తాము నిర్దోషులుగా చూపించుకోవాలనే సందర్భోచిత భావాన్ని తెలియజేస్తుంది.
- source_word: ἀγανάκτησιν
  choice: ఆగ్రహం
  rationale: జరిగిన తప్పుపట్ల కలిగిన బలమైన నైతిక అసంతృప్తిని సూచిస్తుంది; ఆగ్రహం ఎవరి మీదో మూలపాఠం చెప్పనందున అనువాదమూ దానిని నిర్ధారించదు.
- source_word: φόβον
  choice: భయం
  rationale: భయానికి కారణం లేదా లక్ష్యం మూలపాఠంలో పేర్కొనబడలేదు; సాధారణ పదం ఆ సందిగ్ధతను కాపాడుతుంది.
- source_word: ἐπιπόθησιν
  choice: ఆతురత
  rationale: తిరిగి సంబంధం నెలకొనాలనే బలమైన కోరికను సూచించగలదు, అయితే దాని లక్ష్యాన్ని అనువాదంలో అదనంగా చేర్చదు.
- source_word: ζῆλον
  choice: ఆసక్తి
  rationale: σπουδήకు వేరుగా, ఒక విషయంపట్ల ఉత్సాహపూర్వకమైన తీవ్ర నిబద్ధతను ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐκδίκησιν
  choice: తప్పుకు తగిన చర్య తీసుకోవడం
  rationale: వ్యక్తిగత ప్రతీకారాన్ని సూచించకుండా, తప్పును సరిచేయడానికి లేదా దానికి న్యాయమైన పరిణామం కలిగించడానికి తీసుకున్న దృఢ చర్య అనే సందర్భోచిత విస్తృతిని నిలుపుతుంది.
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς
  choice: అన్ని విధాలా ... నిరూపించుకున్నారు
  rationale: ἐν παντί యొక్క సమగ్రతను, συνίστημι యొక్క చూపించడం లేదా రుజువు చేయడం అనే సాక్ష్యాత్మక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἁγνοὺς εἶναι τῷ πράγματι
  choice: ఈ విషయంలో ... నిర్దోషులని
  rationale: ἁγνός ఇక్కడ సంబంధిత వ్యవహారంలో అపవిత్రత లేదా దోషం అంటకుండా ఉన్న స్థితిని సూచిస్తుంది; ‘ఈ విషయంలో’ అనే పరిమితిని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: κατὰ θεόν యొక్క భావం
  choice: దేవునికి అనుగుణంగా
  alternative: దైవికమైన; దేవుని చిత్తానుసారమైన
  rationale: దుఃఖం దేవుని ప్రమాణం లేదా చిత్తానికి అనుగుణంగా ఉందనే భావాన్ని నిలుపుతూ, దాన్ని స్వతహాగా ‘దైవికమైనది’ అని మరీ నిర్ణయాత్మకంగా వ్యాఖ్యానించదు.
- issue: ἐκδίκησις యొక్క న్యాయ లేదా శిక్షాత్మక భావం
  choice: తప్పుకు తగిన చర్య తీసుకోవడం
  alternative: శిక్ష; న్యాయం జరిగేలా చేయడం; ప్రతీకారం తీర్చడం
  rationale: కొరింథీయులు తప్పును గంభీరంగా తీసుకొని దాన్ని సరిచేసేందుకు చర్య తీసుకున్నారనే విస్తృత భావాన్ని ఇస్తుంది. వ్యక్తిగత ప్రతీకారం లేదా నిర్దిష్ట శిక్షను మూలపాఠం కంటే ఎక్కువగా నిర్ధారించదు.
- issue: ἁγνούς అనే పదం నైతిక పరిశుద్ధతనా లేక ఈ వ్యవహారంలో నిర్దోషిత్వమా
  choice: ఈ విషయంలో నిర్దోషులు
  alternative: ఈ విషయంలో పవిత్రులు; ఈ వ్యవహారంలో కలుషితం కానివారు
  rationale: τῷ πράγματι అనే పరిమితి కారణంగా ఇది సంపూర్ణ పాపరాహిత్య ప్రకటనగా కాక, ఈ వ్యవహారానికి సంబంధించి వారు తమను శుద్ధి చేసుకున్నారని లేదా దోషం అంటకుండా ప్రవర్తించారని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. గ్రీకు వాక్యంలో పదేపదే వచ్చే ἀλλά యొక్క వాక్చాతుర్య బలాన్ని ‘అంతేకాదు’ పునరుక్తితో ఉంచాం. భయం, ఆగ్రహం, ఆతురత ఎవరిని లేదా దేనిని లక్ష్యంగా చేసుకున్నాయో మూలపాఠం నిర్దిష్టంగా చెప్పనందున అనువాదంలోనూ ఆ తెరచిన భావాన్ని కాపాడాం.
