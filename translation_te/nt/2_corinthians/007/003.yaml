source:
  edition: SBLGNT
  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: te
  text: మిమ్మల్ని ఖండించడానికి నేను ఇలా చెప్పడం లేదు.[a] ఎందుకంటే, కలిసి చనిపోవడానికీ కలిసి జీవించడానికీ మీరు మా హృదయాల్లో ఉన్నారని నేను ఇంతకుముందే చెప్పాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఖండన కోసం’ లేదా ‘ఖండించాలనే ఉద్దేశంతో.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కలిసి చనిపోవడం, కలిసి జీవించడం కోసం.’ గ్రీకు పదాలు మరణంలోనూ జీవితంలోనూ పంచుకునే సంఘీభావాన్ని నొక్కిచెబుతున్నాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν
  choice: దోషులుగా తీర్చడానికి
  rationale: πρός + κατάκρισιν ఇక్కడ ఉద్దేశాన్ని లేదా దిశను సూచిస్తుంది. తెలుగు సహజ వాడుకలో ‘దోషులుగా తీర్చడానికి’ అనేది పౌలు మాటల ఉద్దేశం వారిని ఖండించడం కాదనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: λέγω
  choice: నేను ఇలా చెప్పడం లేదు
  rationale: వర్తమానకాల క్రియను సహజమైన తెలుగులో అందించింది; సందర్భాన్ని సూచించేందుకు ‘ఇలా’ చేర్చబడింది.
- source_word: προείρηκα
  choice: నేను ఇంతకుముందే చెప్పాను
  rationale: గతంలో చెప్పిన మాటకు ఇప్పటికీ ప్రాసంగికత ఉందనే గ్రీకు పర్ఫెక్ట్ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: మీరు మా హృదయాల్లో ఉన్నారు
  rationale: గ్రీకులోని బహువచనమైన ‘మా హృదయాల్లో’ను నిలుపుతూ, పౌలు మరియు అతని సహచరుల లోతైన అనురాగాన్నీ అంతరంగ అనుబంధాన్నీ తెలియజేస్తుంది.
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: కలిసి చనిపోవడానికీ కలిసి జీవించడానికీ
  rationale: εἰς + articular infinitive లోని ఉద్దేశం/ఫలితం మధ్యనున్న భావ విస్తృతిని సాధ్యమైనంతవరకు నిలుపుతుంది. రెండు συν- సమాస క్రియలలోని సహభాగితను ‘కలిసి’ ద్వారా, మరణం–జీవితం అనే క్రమాన్ని యథాతథంగా ఉంచింది.
theological_decisions:
- issue: ‘కలిసి చనిపోవడం, కలిసి జీవించడం’ అనే మాటలను నిబంధనాత్మక, వైవాహిక లేదా క్రీస్తుతో ఐక్యతకు సంబంధించిన సాంకేతిక భాషగా స్పష్టీకరించాలా?
  choice: ఏదైనా సంకుచితమైన వేదాంత వర్గాన్ని చేర్చకుండా పరస్పర అనురాగం, సంఘీభావం అనే భాషనే నిలుపడం
  alternative: దీనిని నిబంధన విశ్వాస్యతకు సూచనగా లేదా క్రీస్తులో భాగస్వామ్యానికి ప్రతిధ్వనిగా స్పష్టంగా అనువదించడం
  rationale: మూలపాఠం పౌలు, కొరింథీయుల మధ్య గాఢమైన అనుబంధాన్నీ మరణం మరియు జీవితం రెండింటిలోనూ సంఘీభావాన్నీ వ్యక్తం చేస్తుంది; అయితే దానికి ఒక నిర్దిష్ట సాంకేతిక వేదాంత వర్గాన్ని పేరుపెట్టదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఖండించడానికి’ కంటే న్యాయనిర్ణయ భావాన్ని స్పష్టంగా ఉంచేందుకు ‘దోషులుగా తీర్చడానికి’ వాడబడింది. ప్రధాన పాఠంలో [a], [b] సూచికలు రెండూ సంబంధిత స్థానాల్లో ఉన్నాయి.
