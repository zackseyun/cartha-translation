revisions:
- from: అతడు మీ అందరి విధేయతను, మీరు భయంతోను వణుకుతోను అతణ్ణి ఎలా స్వీకరించారో జ్ఞాపకం చేసుకుంటున్నప్పుడు, మీ పట్ల అతని వాత్సల్యం మరింతగా పెరుగుతోంది.[a]
  to: మీ అందరి విధేయతను, మీరు అతణ్ణి భయంతోను వణుకుతోను ఎలా స్వీకరించారో అతడు జ్ఞాపకం చేసుకుంటున్నప్పుడు, మీ పట్ల అతనికి ఉన్న ఆప్యాయత మరింత ఎక్కువగా ఉంది.[a]
  rationale: The revision corrects the unwarranted progressive nuance in the comparative expression for Titus's affection and selects a broader, idiomatic Telugu term for σπλάγχνα. It preserves the Greek pronouns, the whole-community emphasis, and the ambiguity of ‘fear and trembling,’ with the footnote anchored at that phrase.
