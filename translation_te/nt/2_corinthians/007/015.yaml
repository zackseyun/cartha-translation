source:
  edition: SBLGNT
  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: te
  text: మీ అందరి విధేయతను, మీరు అతణ్ణి భయంతోను వణుకుతోను ఎలా స్వీకరించారో అతడు జ్ఞాపకం చేసుకుంటున్నప్పుడు, మీ పట్ల అతనికి ఉన్న ఆప్యాయత మరింత ఎక్కువగా ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘భక్తిపూర్వక గౌరవంతోను వణుకుతోను’; ‘భయంతోను వణుకుతోను’ అనేది గంభీరమైన, వినయపూర్వక స్పందనను సూచించే పౌలు నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: వాత్సల్యం
  rationale: అక్షరార్థంగా ‘అంతరంగ అవయవాలు’ అయినా, ఇక్కడ లోతైన ఆప్యాయతను, సున్నితమైన ప్రేమాభిమానాన్ని సూచించే గ్రీకు నుడికారం. ఆధునిక తెలుగులో ‘వాత్సల్యం’ ఆ భావగాఢతను గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: περισσοτέρως
  choice: మరింతగా పెరుగుతోంది
  rationale: అతని వాత్సల్యపు అధికమవుతున్న పరిమాణాన్ని సూచించే తులనాత్మక క్రియావిశేషణం. తెలుగు వాక్యంలో సహజంగా ఉండేందుకు భావాన్ని క్రియతో వ్యక్తం చేశాం.
- source_word: εἰς ὑμᾶς
  choice: మీ పట్ల
  rationale: వాత్సల్యం కొరింథీయుల వైపు దిశగలదని తెలుపుతుంది; ‘మీ పట్ల’ సహజమైన తెలుగు ప్రయోగం.
- source_word: ἀναμιμνῃσκομένου
  choice: జ్ఞాపకం చేసుకుంటున్నప్పుడు
  rationale: తీతు వారిని నిరంతరం తలచుకునే సందర్భాన్ని తెలిపే వర్తమాన కృదంత భావాన్ని నిలుపుతుంది.
- source_word: ὑπακοήν
  choice: విధేయత
  rationale: అపొస్తలీయ ఉపదేశానికి వారు చూపిన లోబడిన స్పందనను నేరుగా తెలిపే పదం.
- source_word: πάντων ὑμῶν
  choice: మీ అందరి
  rationale: సమాజమంతటినీ కలుపుకొనే గ్రీకు పదబంధపు బలాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: భయంతోను వణుకుతోను
  rationale: పౌలు వాడే గంభీరమైన నుడికారాన్ని వ్యాఖ్యానించి సడలించకుండా ప్రధాన పాఠ్యంలో నిలుపుతుంది; సందర్భానుగుణ భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: ἐδέξασθε
  choice: స్వీకరించారు
  rationale: తీతును ఆహ్వానించి అంగీకరించిన విస్తృత భావాన్ని అతిగా వ్యాఖ్యానించకుండా తెలుపుతుంది.
- source_word: αὐτόν
  choice: అతణ్ణి
  rationale: గ్రీకులోని సర్వనామాన్ని అలాగే ఉంచుతుంది; సమీప సందర్భంలో అది తీతును సూచిస్తుంది.
theological_decisions:
- issue: కొరింథీయులు తీతును స్వీకరించిన సందర్భంలో ‘భయంతోను వణుకుతోను’ అనే మాటల భావం
  choice: నుడికారాన్ని ప్రధాన పాఠ్యంలో యథాతథంగా నిలిపి, భక్తిపూర్వక గంభీరత మరియు వినయపూర్వక స్పందన అనే సాధ్యమైన భావాన్ని పాదసూచికలో తెలపడం
  alternative: ‘భక్తిపూర్వక గౌరవంతోను వణుకుతోను’ అని ప్రధాన పాఠ్యంలోనే అర్థాన్ని విప్పి చెప్పడం; లేదా అక్షరార్థ భయంగా మాత్రమే గ్రహించడం
  rationale: ఇది పౌలు రచనల్లో కనిపించే నుడికారం. సందర్భంలో కేవలం భీతిని కాక గంభీరమైన, వినయపూర్వక స్పందనను సూచించే అవకాశం బలంగా ఉన్నా, ప్రధాన పాఠ్యంలో ఉన్న భావ ఉద్రిక్తతను తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే గ్రీకు మూలంలోని భావగాఢత మరియు నుడికారాన్ని కాపాడే గౌరవప్రద శైలి. [a] సూచిక ప్రధాన పాఠ్యంలో ఉంచబడింది.
