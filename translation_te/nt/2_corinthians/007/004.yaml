  text: πολλή μοι παρρησία πρὸς ὑμᾶς, πολλή μοι καύχησις ὑπὲρ ὑμῶν· πεπλήρωμαι τῇ παρακλήσει, ὑπερπερισσεύομαι τῇ χαρᾷ ἐπὶ πάσῃ τῇ θλίψει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: te
  text: మీతో నేను ఎంతో ధైర్యంగా, బహిరంగంగా మాట్లాడుతున్నాను[a]; మీ గురించి నేను ఎంతో గొప్పగా చెప్పుకుంటున్నాను. నేను ఓదార్పుతో నిండిపోయాను[b]; మా బాధలన్నిటి మధ్యన[c] ఆనందంతో ఉప్పొంగిపోతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ విషయంలో నాకు ఎంతో నమ్మకం ఉంది.’ παρρησία అనే గ్రీకు పదం ధైర్యంతో కూడిన నమ్మకాన్ని, అలాగే మాటలో నిష్కపటమైన బహిరంగతను సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రోత్సాహంతో.’ παράκλησις అనే గ్రీకు పదంలో ఓదార్పు, ప్రోత్సాహం, బలపరచడం అనే భావాలు ఉన్నాయి.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మా బాధలన్నీ ఉన్నప్పటికీ.’ ఇక్కడ గ్రీకు మాటలను, బాధ కొనసాగుతున్న మధ్యలోనే ఆనందం ఉప్పొంగుతున్నదనే భావంతో అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: ధైర్యం
  rationale: ఇక్కడ ఈ పదం కొరింథీయుల పట్ల పౌలుకు ఉన్న నమ్మకంతో కూడిన బహిరంగతను సూచిస్తుంది. ‘ధైర్యం’ దాని బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది; మాటలోని నిష్కపటమైన బహిరంగత అనే ఛాయను పాదటిప్పణి తెలియజేస్తుంది.
- source_word: πρὸς ὑμᾶς
  choice: మీ పట్ల
  rationale: πρός సంబంధ దిశను సూచిస్తుంది. ‘మీ పట్ల’ అనేది పౌలు ధైర్యం కొరింథీయులతో ఉన్న సంబంధానికి చెందినదని సహజంగా తెలియజేస్తుంది.
- source_word: καύχησις
  choice: గొప్పగా చెప్పుకోవడం
  rationale: పౌలు కొరింథీయుల గురించి అనుకూలంగా అతిశయించి చెప్పే భావాన్ని ఇది నిలుపుతుంది. ‘గర్వం’ అని మెత్తబరచకుండా, తెలుగులో అనవసరంగా పాపపూరిత స్వీయోన్నతి భావం రాకుండా క్రియాత్మకంగా అనువదించబడింది.
- source_word: ὑπὲρ ὑμῶν
  choice: మీ గురించి
  rationale: ὑπέρ ఇక్కడ ‘గురించి/సంబంధించి’ అనే భావాన్ని ఇవ్వగలదు. సందర్భంలో పౌలు కొరింథీయులను ప్రశంసిస్తూ చెప్పుకోవడాన్ని ‘మీ గురించి’ స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: πεπλήρωμαι
  choice: నిండిపోయాను
  rationale: పర్ఫెక్ట్ పాసివ్ రూపం గతంలో కలిగిన కార్యఫలంగా ప్రస్తుతం కొనసాగుతున్న నిండుదల స్థితిని సూచిస్తుంది. ‘నిండిపోయాను’ ఆ ఫలితస్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: παρακλήσει
  choice: ఓదార్పుతో
  rationale: παράκλησιςలో ఓదార్పు, ప్రోత్సాహం, బలపరచడం అనే భావాలు ఉన్నాయి. ప్రస్తుత బాధల సందర్భంలో ‘ఓదార్పు’ ప్రధాన భావాన్ని సహజంగా అందిస్తుంది; విస్తృత భావాన్ని పాదటిప్పణి సూచిస్తుంది.
- source_word: ὑπερπερισσεύομαι
  choice: ఉప్పొంగిపోతున్నాను
  rationale: ఈ తీవ్రతాసూచక క్రియ మితిమీరిన సమృద్ధిని తెలియజేస్తుంది. ‘ఉప్పొంగిపోతున్నాను’ ఆనందం పొంగిపొర్లే చిత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: χαρᾷ
  choice: ఆనందంతో
  rationale: χαράకు నేరుగా, సహజంగా సరిపోయే ఆధునిక తెలుగు పదం ‘ఆనందం’.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: మా బాధలన్నిటి మధ్యన
  rationale: ἐπί + దత్తి ఇక్కడ బాధ కొనసాగుతున్న పరిస్థితిలోనే ఆనందం ఉప్పొంగడాన్ని సూచిస్తుంది. ‘మధ్యన’ ఆనందం మరియు బాధ కలిసి ఉన్న ఉద్రిక్తతను తొలగించకుండా నిలుపుతుంది.
- source_word: πολλή ... πολλή
  choice: ఎంతో ... ఎంతో
  rationale: పునరుక్త πολλή సమృద్ధిని నొక్కిచెబుతుంది. తెలుగులో రెండు చోట్ల ‘ఎంతో’ వాడడం ఆ పునరుక్తి మరియు ఉద్ఘాటనను సహజంగా కాపాడుతుంది.
theological_decisions:
- issue: పౌలు సానుకూల భావంలో వాడిన καύχησιςను పాపపూరిత గర్వంగా చూపకుండా నిలుపడం
  choice: ‘మీ గురించి నేను ఎంతో గొప్పగా చెప్పుకుంటున్నాను’ అని అనువదించడం
  alternative: ‘మీ విషయంలో నాకు ఎంతో గర్వంగా ఉంది’
  rationale: ‘గొప్పగా చెప్పుకోవడం’ పౌలు వాడే boasting భాషను నిలుపుతుంది. సందర్భం దానిని స్వీయోన్నతిగా కాక, కొరింథీయులను ప్రశంసిస్తూ చెప్పుకోవడంగా నిర్దేశిస్తుంది.
- issue: ఆనందం మరియు బాధ మధ్యనున్న ఉద్రిక్తతను నిలుపడం
  choice: ‘మా బాధలన్నిటి మధ్యన’ అని అనువదించడం
  alternative: ‘మా బాధలన్నీ ఉన్నప్పటికీ’
  rationale: గ్రీకు వాక్యం బాధ తొలగిపోయిందని కాక, బాధ మధ్యలోనే ఆనందం ఉప్పొంగుతోందని చూపుతుంది. ‘మధ్యన’ ఆ సహస్థితిని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన మరియు భావపూర్ణమైన శైలి వాడబడింది. మూలంలోని సమాంతర ఉద్ఘాటనను ‘ఎంతో ... ఎంతో’తో, సమృద్ధి చిత్రాన్ని ‘నిండిపోయాను ... ఉప్పొంగిపోతున్నాను’తో నిలుపబడింది.
