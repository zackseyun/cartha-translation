  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: te
  text: అందుచేత మేము ఓదార్పు పొందాము.[a] మా ఓదార్పుతోపాటు, తీతు ఆనందాన్ని బట్టి మేము ఇంకా ఎంతో ఎక్కువగా ఆనందించాము; ఎందుకంటే మీ అందరివల్ల అతని ఆత్మ సేదతీరింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రోత్సాహం పొందాము.” ఇక్కడ వాడిన గ్రీకు పదకుటుంబం ఓదార్పు, ఆదరణ, ప్రోత్సాహం అనే భావాలను కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “విశ్రాంతి పొందింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందుచేత
  rationale: ముందటి విషయాల నుంచి వచ్చే కారణాత్మక లేదా పర్యవసాన సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: παρακεκλήμεθα
  choice: మేము ఆదరణ పొందాము
  rationale: పూర్తయిన చర్య ఫలితంగా ఏర్పడిన స్థితిని సూచించే గ్రీకు పర్ఫెక్ట్ పాసివ్ భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; సందర్భంలో ఓదార్పు, ప్రోత్సాహం రెండూ సాధ్యమైనందున ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: మా ఆదరణకు తోడుగా
  rationale: వారు పొందిన ఆదరణపై మరొక అధిక ఆనందం చేరిందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: περισσοτέρως μᾶλλον
  choice: మరింతగా
  rationale: రెండు తులనాత్మక పదాల తీవ్రతను సరళమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అతిశయంగా లేదా కృత్రిమంగా వినిపించకుండా బలాన్ని నిలుపుతుంది.
- source_word: ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου
  choice: తీతుకు కలిగిన ఆనందాన్ని బట్టి మేము మరింతగా ఆనందించాము
  rationale: తీతు ఆనందమే వారి అదనపు ఆనందానికి ఆధారమని తెలియజేస్తూ χαρά/χαίρω పదబంధ సంబంధాన్ని తెలుగులో నిలుపుతుంది.
- source_word: ἀναπέπαυται
  choice: సేదతీరింది
  rationale: మునుపటి అనుభవం వల్ల ఇప్పుడు ఉన్న ఉపశాంతి, నూతనోత్సాహ స్థితిని సంక్షిప్తంగా వ్యక్తం చేస్తుంది; ‘విశ్రాంతి పొందింది’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: అతని ఆత్మ
  rationale: తీతు అంతరంగ స్థితిని సూచించే గ్రీకు మానవశాస్త్రీయ భాషను నేరుగా నిలుపుతుంది; పరిశుద్ధాత్మను సూచించదు.
- source_word: ἀπὸ πάντων ὑμῶν
  choice: మీ అందరి వల్ల
  rationale: ἀπό ఇక్కడ మూలం లేదా కార్యసాధక కారణాన్ని సూచిస్తుంది; తెలుగు వాక్యంలో సహజంగా ఉండేలా ‘వల్ల’ ఉపయోగించబడింది.
theological_decisions:
- issue: τὸ πνεῦμα αὐτοῦ లో πνεῦμα యొక్క సూచన
  choice: తీతు యొక్క మానవ ఆత్మ లేదా అంతరంగ స్థితి
  alternative: పరిశుద్ధాత్మ
  rationale: αὐτοῦ (‘అతని’) అనే స్వామ్యరూపం మరియు కొరింథీయుల స్పందన వల్ల తీతుకు కలిగిన ఉపశాంతిని వివరించే సందర్భం దీనిని తీతు స్వంత అంతరంగ స్థితిగా సూచిస్తున్నాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘ఆదరణ,’ ‘ఆనందం,’ ‘ఆత్మ,’ ‘సేదతీరింది’ వంటి పదాలు మూలంలోని భావోద్వేగ మరియు అంతరంగ భాషను సహజంగా నిలుపుతాయి.
