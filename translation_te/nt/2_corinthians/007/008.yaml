  - severity: low
    issue: “ఇప్పుడు” is added in the rendering of οὐ μεταμέλομαι.
    rationale: The present tense contrasts naturally with the imperfect, but “now” is not stated and need not be supplied. Removing it preserves the source’s wording more closely.
