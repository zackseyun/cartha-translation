  source_fidelity: 'The central sense is retained: Paul does not now regret causing the Corinthians sorrow by the letter, although he had felt regret when he recognized its temporary painful effect. However, the Telugu main text adds “ఇప్పుడు” (“now”), which is not explicit in the Greek, and its final dash leaves the parenthetical construction structurally unfinished.'
