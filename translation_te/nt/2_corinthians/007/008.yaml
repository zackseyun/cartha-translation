id: 2CO.7.8
reference: 2 Corinthians 7:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι εἰ καὶ ἐλύπησα ὑμᾶς ἐν τῇ ἐπιστολῇ, οὐ μεταμέλομαι· εἰ καὶ μετεμελόμην (⸀βλέπω ὅτι ἡ ἐπιστολὴ ἐκείνη εἰ καὶ πρὸς ὥραν ἐλύπησεν ὑμᾶς),
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/008.yaml
  text: For even if I grieved you with the letter[a], I do not regret it—though I did regret it, for I see that that letter grieved you[b], though only for a time.
translation:
  language: te
  text: ఎందుకంటే, ఆ ఉత్తరం ద్వారా నేను మిమ్మల్ని దుఃఖపెట్టినప్పటికీ, దాని గురించి నేను చింతించడం లేదు; నేను చింతించినప్పటికీ[a], ఆ ఉత్తరం మిమ్మల్ని కొద్దికాలం మాత్రమే[b] దుఃఖపెట్టిందని నేను చూస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను చింతిస్తూ ఉండేవాడిని.” గ్రీకు అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగిన చింత స్థితిని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: పదశః, “ఒక గంటసేపు”; ఇది కొద్దికాలాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύπησα / ἐλύπησεν
  choice: దుఃఖపెట్టాను / దుఃఖపెట్టింది
  rationale: λυπέω ఇక్కడ మనోవేదన లేదా దుఃఖం కలిగించడాన్ని సూచిస్తుంది. ‘దుఃఖపెట్టు’ మూలంలోని భావోద్వేగ బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν τῇ ἐπιστολῇ
  choice: ఆ ఉత్తరం ద్వారా
  rationale: ἐν ఇక్కడ సాధనార్థకంగా ఉంది; పౌలు వారిని దుఃఖపెట్టిన సాధనం ఉత్తరమని ‘ద్వారా’ స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: οὐ μεταμέλομαι
  choice: దాని గురించి ఇప్పుడు నేను చింతించడం లేదు
  rationale: μεταμέλομαι ఇక్కడ నైతిక పశ్చాత్తాపం కంటే చేసిన కార్యం వల్ల కలిగిన విచారం లేదా చింతను సూచిస్తుంది. వర్తమాన కాల వ్యత్యాసాన్ని స్పష్టం చేయడానికి ‘ఇప్పుడు’ చేర్చబడింది; ‘దాని గురించి’ తెలుగులో అవసరమైన సూచనార్థక పూరకం.
- source_word: εἰ καὶ μετεμελόμην
  choice: నేను చింతించాను గానీ
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగిన లేదా ఉన్న చింత స్థితిని సూచించవచ్చు. సంక్షిప్తమైన ప్రధాన పాఠ్యం గ్రీకు వాక్యంలోని concessive contrast‌ను నిలుపుతుంది; కాలాంశం పాదసూచికలో ఇవ్వబడింది.
- source_word: βλέπω
  choice: నేను చూస్తున్నాను
  rationale: βλέπω యొక్క ప్రత్యక్ష భావమైన ‘చూస్తున్నాను’ పౌలు ఇప్పుడు గుర్తిస్తున్న వాస్తవాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘గ్రహిస్తున్నాను’ అనే వ్యాఖ్యాత్మక విస్తరణను నివారిస్తుంది.
- source_word: ἡ ἐπιστολὴ ἐκείνη
  choice: ఆ ఉత్తరం
  rationale: ἐκείνη లోని నిర్దేశక బలాన్ని ‘ఆ’ నిలుపుతుంది; ఆధునిక తెలుగులో ‘ఉత్తరం’ సహజమైన పదం.
- source_word: πρὸς ὥραν
  choice: కొద్దికాలం మాత్రమే
  rationale: పదశః ‘ఒక గంటసేపు’ అయినా, ఈ ప్రయోగం తాత్కాలికమైన స్వల్పకాలాన్ని సూచిస్తుంది. ‘కొద్దికాలం మాత్రమే’ ఆ నుడికారార్థాన్ని, పరిమితిని రెండింటినీ తెలియజేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఈ వచనారంభంలో ὅτι ముందున్న మాటకు వివరణను పరిచయం చేస్తుంది; ‘ఎందుకంటే’ ఆ సంబంధాన్ని తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: εἰ καὶ
  choice: …ప్పటికీ / …గానీ
  rationale: పునరావృతమయ్యే concessive నిర్మాణాన్ని తెలుగులో ఒకే విధంగా బలవంతంగా కాకుండా, సందర్భానుసారమైన సహజ రూపాలతో నిలుపుతుంది.
theological_decisions:
- issue: μεταμέλομαι ద్వారా పౌలు తెలిపిన భావం
  choice: ‘చింతించడం’ అని అనువదించడం
  alternative: ‘పశ్చాత్తాపపడడం’ లేదా ‘విచారించడం’
  rationale: సందర్భం దేవుని ఎదుట నైతిక పశ్చాత్తాపం గురించి కాకుండా, తన ఉత్తరం కలిగించిన బాధను చూసి పౌలుకు కలిగిన తాత్కాలిక చింత గురించి ఉంది. ‘పశ్చాత్తాపం’ అనడం మూలంలో లేని ప్రత్యేక ధార్మిక భావాన్ని తెచ్చే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యం తదుపరి వచనంలో కొనసాగుతున్న స్వభావాన్ని చివరి దీర్ఘవిరామం నిలుపుతుంది; మూలంలోని భావోద్వేగ ఉద్వేగం, వర్తమాన–భూతకాల చింత మధ్య వ్యత్యాసం కాపాడబడ్డాయి.
