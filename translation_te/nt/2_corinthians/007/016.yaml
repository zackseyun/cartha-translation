lexical_decisions:
- source_word: χαίρω
  choice: నేను సంతోషిస్తున్నాను
  rationale: వర్తమానకాల క్రియాభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; సందర్భంలోని ఆనందాన్ని అతిశయింపకుండా నిలుపుతుంది.
- source_word: ὅτι
