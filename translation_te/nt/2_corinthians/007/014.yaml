id: 2CO.7.14
reference: 2 Corinthians 7:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: te
  text: ఎందుకంటే, మీ గురించి నేను అతనితో ఏమైనా గొప్పగా చెప్పుకున్నా, సిగ్గుపాలు కాలేదు; మేము మీకు ప్రతి విషయమూ సత్యంగా చెప్పినట్లే, తీతుకు[a] మేము మీ గురించి గొప్పగా చెప్పుకున్నది కూడా నిజమని తేలింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తీతు ఎదుట.’ గ్రీకు పదబంధాన్ని ఇలా మరింత అక్షరార్థంగా అనువదించవచ్చు; సందర్భం ప్రకారం పౌలు తీతుకు కొరింథీయుల గురించి చెప్పుకున్న మాటలే ఉద్దేశం.
    reason: lexical_alternative
lexical_decisions:
- source_word: κεκαύχημαι / ἡ καύχησις ἡμῶν
  choice: గొప్పగా చెప్పుకున్నా / మేము గొప్పగా చెప్పుకున్నది
  rationale: క్రియకూ దాని సంబంధిత నామవాచకానికీ ఉన్న పదబంధ సంబంధాన్ని తెలుగులో నిలుపుతుంది. ‘గర్వపడ్డాను’ అనడం అంతరంగ భావాన్ని ఎక్కువగా సూచించవచ్చు; ఇక్కడ పౌలు తీతుతో కొరింథీయుల గురించి ప్రశంసాపూర్వకంగా చెప్పిన మాటలే ప్రధానంగా ఉద్దేశించబడ్డాయి.
- source_word: οὐ κατῃσχύνθην
  choice: నేను సిగ్గుపాలు కాలేదు
  rationale: కర్తరి భావంలోని ‘నేను సిగ్గుపడలేదు’ కంటే, పౌలు చెప్పుకున్నది అబద్ధమని తేలి అతడు అవమానానికి గురికాలేదనే గ్రీకు కర్మణి భావాన్ని ఇది సహజమైన తెలుగులో మెరుగ్గా నిలుపుతుంది.
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν
  choice: మేము మీతో ప్రతిదీ నిజంగానే చెప్పినట్లే
  rationale: πάντα యొక్క విస్తృతార్థాన్ని ‘ప్రతిదీ’ నిలుపుతుంది; ἐν ἀληθείᾳ ఇక్కడ మాట్లాడిన విధానాన్ని సూచిస్తున్నందున ‘నిజంగానే’ సహజంగా ఉంది.
- source_word: ἡ ἐπὶ Τίτου
  choice: తీతుతో
  rationale: సందర్భంలో పౌలు తీతుతో చేసిన గొప్పచెప్పుకోవడాన్ని సూచిస్తుంది. సంక్షిప్తమైన ఈ రూపం మొదటి భాగంలో ఇప్పటికే స్పష్టమైన ‘మీ గురించి’ అనే అంశాన్ని అనవసరంగా పునరావృతం చేయదు.
- source_word: ἀλήθεια ἐγενήθη
  choice: నిజమని తేలింది
  rationale: పౌలు చెప్పుకున్నది వాస్తవానికి సరిపోలిందని తరువాత నిరూపితమైందనే గ్రీకు ప్రయోగార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యంలోని విషయానికి కారణం లేదా వివరణను ఈ వాక్యం అందిస్తున్నదని తెలుగులో స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: పౌలు ‘గొప్పగా చెప్పుకోవడం’ యొక్క స్వభావం
  choice: పాపపూరిత అహంకారంగా కాకుండా, కొరింథీయుల గురించి ధైర్యంగా ప్రశంసించి చెప్పడంగా సందర్భం అర్థాన్ని నిర్ణయించేలా ‘గొప్పగా చెప్పుకోవడం’ అని అనువదించబడింది.
  alternative: ప్రతికూల భావఛాయను తొలగించేందుకు ‘నమ్మకం వ్యక్తం చేయడం’ లేదా ‘గర్వించడం’ అని అనువదించడం.
  rationale: καυχάομαι/καύχησις పదాలు పౌలు రచనల్లో అహంకారాన్ని మాత్రమే కాక, సముచితమైన ప్రశంసను లేదా అతిశయోక్తితో కూడిన ధైర్యవచనాన్ని కూడా సూచించగలవు. బలమైన మూలపద భావాన్ని ఉంచి, అది సముచితమో కాదో సందర్భమే తెలియజేసేలా చేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘సిగ్గుపాలు కాలేదు’ కర్మణి భావాన్ని, ‘నిజమని తేలింది’ ఫలితంగా ధృవీకరించబడిన భావాన్ని స్పష్టంగా అందిస్తాయి.
