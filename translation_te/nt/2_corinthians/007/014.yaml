revisions:
- from: ఎందుకంటే, మీ గురించి నేను అతనితో ఏమైనా గొప్పగా చెప్పుకున్నా, నేను సిగ్గుపాలు కాలేదు. మేము మీతో ప్రతిదీ నిజంగానే చెప్పినట్లే, తీతుతో[a] మేము గొప్పగా చెప్పుకున్నది కూడా నిజమని తేలింది.
  to: ఎందుకంటే, మీ గురించి నేను అతనితో ఏమైనా గొప్పగా చెప్పుకున్నా, సిగ్గుపాలు కాలేదు; మేము మీకు ప్రతి విషయమూ సత్యంగా చెప్పినట్లే, తీతుకు[a] మేము మీ గురించి గొప్పగా చెప్పుకున్నది కూడా నిజమని తేలింది.
  rationale: The revision clarifies the dative addressee and truthful manner in the middle clause, and it avoids the possible Telugu ambiguity that Paul and Titus boasted together. It retains the source’s contextual implication that the boast concerned the Corinthians and preserves the ‘before Titus’ alternative in a footnote.
