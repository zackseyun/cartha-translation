reference: 2 Corinthians 1:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: te
  text: 'ఎందుకంటే, మాకు అతిశయకారణం ఇదే—మా మనస్సాక్షి ఇచ్చే సాక్ష్యం ఏమిటంటే: మేము లోకంలో పవిత్రతతో[a], దేవుని నుండి కలిగిన నిష్కపటతతో[b], శరీరసంబంధమైన జ్ఞానంతో కాక దేవుని కృపతో నడుచుకున్నాము; ముఖ్యంగా మీ పట్ల కూడా అలాగే నడుచుకున్నాము.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “పవిత్రతతో” అనే పదానికి బదులుగా “సరళతతో” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా, “దైవిక నిష్కపటతతో”; అక్షరార్థంగా, “దేవుని నిష్కపటతతో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καύχησις
  choice: అతిశయానికి కారణం
  rationale: పౌలు చెప్పే సానుకూలమైన గర్వకారణాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, కేవలం అహంకారం అనే ప్రతికూల భావాన్ని నివారిస్తుంది.
- source_word: μαρτύριον τῆς συνειδήσεως
  choice: మనస్సాక్షి ఇచ్చే సాక్ష్యం
  rationale: అంతరంగ నైతిక అవగాహన ధృవీకరించే సాక్ష్యభావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἁγιότητι
  choice: పవిత్రతతో
  rationale: SBLGNT ప్రధాన పాఠంలోని నైతిక, ఆధ్యాత్మిక భావాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: దేవుని నుండి కలిగిన నిష్కపటతతో
  rationale: εἰλικρίνεια యొక్క యథార్థత/నిష్కపటత భావాన్ని, τοῦ θεοῦ యొక్క మూలం లేదా గుణసంబంధ భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: σοφίᾳ σαρκικῇ
  choice: శరీర సంబంధమైన జ్ఞానంతో
  rationale: σαρκ- పదకుటుంబాన్ని కనిపించేలా ఉంచి, మానవ స్వభావాధారిత జ్ఞానం అనే భావాన్ని కాపాడుతుంది.
- source_word: χάριτι θεοῦ
  choice: దేవుని కృపతో
  rationale: పౌలు వాడే χάρις పదానికి ఉన్న దైవశాస్త్రీయ బరువును సహజంగా నిలుపుతుంది.
- source_word: ἀνεστράφημεν
  choice: నడుచుకున్నాము
  rationale: జీవన ప్రవర్తనను సూచించే ఈ క్రియకు ప్రస్తుత ప్రామాణిక తెలుగులో సహజమైన బైబిలీయ ప్రయోగం.
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: ముఖ్యంగా మీ పట్ల
  rationale: περισσοτέρως యొక్క అధికతను, πρὸς ὑμᾶς యొక్క సంబంధాత్మక దిశను సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: εἰλικρινείᾳ τοῦ θεοῦ లో τοῦ θεοῦ యొక్క భావం
  choice: దేవుని నుండి కలిగిన నిష్కపటత
  alternative: దైవిక నిష్కపటత; దేవుని నిష్కపటత
  rationale: దేవుడే ఈ నిష్కపటతకు మూలం లేదా దాని స్వభావాన్ని నిర్ణయించేవాడు అనే సాధ్యమైన భావాన్ని తెలియజేస్తుంది; ఇది దేవుని స్వంత నిష్కపటత అని అనవసరంగా నిర్ణయించదు.
- issue: ἁγιότητι పాఠాంతరం
  choice: ప్రధాన పాఠం ప్రకారం ‘పవిత్రత’
  alternative: ἁπλότητι ప్రకారం ‘సరళత/నిష్కపటత’
  rationale: ఇచ్చిన SBLGNT పాఠాన్ని ప్రధాన అనువాదంలో అనుసరించి, ప్రాచీన ప్రతులలోని ముఖ్యమైన పాఠాంతరాన్ని పాదసూచికలో వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. గ్రీకు వాక్యంలోని ‘ముఖ్యంగా మీ పట్ల’ అనే భాగాన్ని తెలుగులో సహజమైన స్థానంలో ఉంచాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
