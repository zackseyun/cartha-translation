  to: మిమ్మల్ని కలుసుకొని మాసిదోనియాకు వెళ్లి, మళ్లీ మాసిదోనియా నుండి మీ దగ్గరికి వచ్చి, మీ చేత యూదయకు సాగనంపబడాలని అనుకున్నాను.[a]
