source:
  edition: SBLGNT
  text: καὶ δι’ ὑμῶν διελθεῖν εἰς Μακεδονίαν, καὶ πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι εἰς τὴν Ἰουδαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: te
  text: మిమ్మల్ని కలుసుకొని మాసిదోనియాకు వెళ్లి, మళ్లీ మాసిదోనియా నుండి మీ దగ్గరికి వచ్చి, మీ చేత యూదయకు సాగనంపబడాలని అనుకున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యూదయకు వెళ్లే ప్రయాణంలో మీ సహాయం పొందాలని.”
    reason: ప్రయాణ సందర్భంలో προπεμφθῆναι అనేది కేవలం వీడ్కోలు చెప్పి పంపడం మాత్రమే కాకుండా, ప్రయాణానికి అవసరమైన సహాయం చేసి పంపడం అనే భావాన్నీ కలిగి ఉండవచ్చు.
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: మీ మధ్యగా
  rationale: διά + షష్ఠీ విభక్తి ప్రయాణ మార్గాన్ని సూచిస్తుంది; కొరింథు విశ్వాసులున్న ప్రాంతం గుండా వెళ్లాలనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: మాసిదోనియాకు వెళ్లి
  rationale: క్రియలోని ‘గుండా ప్రయాణించి ముందుకు వెళ్లడం’ అనే భావం సందర్భంలో ఉంది; తెలుగులో గమ్యస్థానంతో ‘వెళ్లి’ సహజంగా ఉంటుంది, అలాగే ‘మీ మధ్యగా’ ప్రయాణ దిశను స్పష్టం చేస్తుంది.
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: మళ్లీ మాసిదోనియా నుండి మీ దగ్గరికి వచ్చి
  rationale: πάλιν పునరాగమనాన్ని, ἀπό బయలుదేరిన స్థలాన్ని, πρὸς వ్యక్తుల వైపు రాకను స్పష్టంగా నిలుపుతాయి; గ్రీకులో లేని ‘తిరిగి’ అనే అదనపు పదాన్ని చేర్చలేదు.
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι
  choice: మీ చేత సాగనంపబడాలని
  rationale: ὑπό + షష్ఠీ కర్తృత్వాన్ని సూచిస్తుంది; προπέμπω ప్రయాణ సందర్భంలో అవసరమైన సహాయంతో ముందుకు పంపడాన్ని సూచిస్తుంది. ‘సాగనంపడం’ ఈ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: యూదయకు వెళ్లేందుకు
  rationale: εἰς గమ్యాన్ని సూచిస్తుంది; తెలుగులో ‘యూదయకు’ సహజమైన గమ్యప్రయోగం. ఉద్దేశార్థక నిర్మాణం వాక్యంలోని ప్రయాణ ప్రణాళికను స్పష్టం చేస్తుంది.
