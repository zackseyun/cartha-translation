translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రయాణ భాషను వాడాం. ఇది ముందు వచనంలో ప్రారంభమైన పౌలు ఉద్దేశాన్ని కొనసాగించే వాక్యం కాబట్టి, సహజత కోసం ‘అనుకున్నాను’ను చివర చేర్చాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
