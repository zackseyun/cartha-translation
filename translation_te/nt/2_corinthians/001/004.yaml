id: 2CO.1.4
reference: 2 Corinthians 1:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: te
  text: ఆయన మన బాధలన్నిటిలో మనలను ఆదరిస్తాడు[a], తద్వారా దేవుని ద్వారా మనమే పొందే అదే ఆదరణతో ఎలాంటి బాధలో ఉన్నవారినైనా మనం ఆదరించగలుగుతాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రోత్సహిస్తాడు … ప్రోత్సాహం’; గ్రీకులో ఈ వచనమంతటా ఒకే పదకుటుంబానికి చెందిన పదాలు వాడబడ్డాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶν / παρακαλεῖν / παρακλήσεως / παρακαλούμεθα
  choice: ఆదరిస్తాడు / ఆదరించగలుగుతాం / ఆదరణ / ఆదరించే
  rationale: బాధల సందర్భంలో ఈ పదకుటుంబం ఓదార్పుతోపాటు బలపరిచే ఆదరణను సూచిస్తుంది. తెలుగు వాక్యమంతటా ఒకే పదకుటుంబాన్ని కొనసాగించడం ద్వారా గ్రీకు మూలంలోని పునరుక్తి, భావసంబంధం నిలిచాయి.
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: మన బాధలన్నిటిలో
  rationale: θλῖψις సూచించే బాధ, ఒత్తిడి, సంకట స్థితుల తీవ్రతను ‘బాధ’ సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; πάσῃ యొక్క సమగ్రతను ‘అన్నిటిలో’ నిలుపుతుంది.
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: తద్వారా ... మనం ... ఆదరించగలుగుతాం
  rationale: ఈ నిర్మాణంలోని ఉద్దేశం లేదా ఫలిత భావాన్ని ‘తద్వారా’ సహజంగా వ్యక్తం చేస్తుంది; δύνασθαι యొక్క సామర్థ్య భావం ‘గలుగుతాం’లో నిలిచింది.
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: ఎలాంటి బాధలో ఉన్నవారినైనా
  rationale: ఇక్కడ πάσῃ విస్తృత పంపిణీ భావాన్ని కలిగి ఉంది—ఏ రకమైన బాధలో ఉన్న ఏ వ్యక్తినైనా. ఈ అర్థాన్ని సహజమైన తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: αὐτοὶ ὑπὸ τοῦ θεοῦ
  choice: దేవుడు మనల్ని
  rationale: ὑπό సూచించే దేవుని కార్యసాధకత్వాన్ని స్పష్టంగా ఉంచింది. తెలుగు సహజత్వం కోసం కర్మణి నిర్మాణాన్ని కర్తరి నిర్మాణంగా మార్చినా, ఆదరణను పొందేవారు ‘మనమే’ అనే భావం సందర్భంలో నిలుస్తుంది.
theological_decisions:
- issue: παρακαλέω / παράκλησις పదకుటుంబపు భావవిస్తృతి
  choice: ఆదరించు / ఆదరణ
  alternative: ప్రోత్సహించు / ప్రోత్సాహం; ఓదార్చు / ఓదార్పు
  rationale: θλῖψις అనే బాధల సందర్భంలో ఓదార్పునిస్తూ బలపరిచే భావం ప్రధానంగా ఉంది. ‘ఆదరణ’ కేవలం భావోద్వేగ ఉపశమనానికి పరిమితం కాకుండా తోడ్పాటు, ధైర్యం ఇచ్చే భావాన్నీ మోస్తుంది. ఇతర సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- issue: εἰς τό నిర్మాణం ఉద్దేశమా ఫలితమా
  choice: ‘తద్వారా’ అని, ఉద్దేశం-ఫలితం రెండింటికీ చోటిచ్చే రూపం
  alternative: ‘మనము ... చేయగలిగేలా’ అని స్పష్టమైన ఉద్దేశార్థం
  rationale: గ్రీకు నిర్మాణం ఉద్దేశం మరియు ఫలితం మధ్య సున్నితమైన భావసంబంధాన్ని అనుమతిస్తుంది. ‘తద్వారా’ దానిని అనవసరంగా ఒక వైపుకు పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘బాధ’, ‘ఆదరణ’ వంటి సాధారణంగా అర్థమయ్యే పదాలను వాడి, గ్రీకు మూలంలోని పదపునరుక్తిని సాధ్యమైనంతవరకు నిలిపాం.
