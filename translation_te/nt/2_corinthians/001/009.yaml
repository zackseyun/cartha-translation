    text: లేదా, “మరణపు తీర్పు.”
    reason: ἀπόκριμα τοῦ θανάτου యొక్క న్యాయపరమైన/నిర్ణయాత్మక భావానికి సమానంగా సాధ్యమైన ప్రత్యామ్నాయ అనువాదం.
  revision_rationale: The revision retains the Greek perfect expression as “కలిగి ఉన్నాము,” preserves the emphatic inward phrase with “మేమే మాలోనే,” and avoids adding the unsupported ideas that a sentence was formally imposed or merely imagined. It also expresses the ἵνα purpose clause naturally while maintaining the contrast between confidence in oneself and confidence in God.
