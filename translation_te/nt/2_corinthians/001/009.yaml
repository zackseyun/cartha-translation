id: 2CO.1.9
reference: 2 Corinthians 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: te
  text: అయితే, మేమే మాలోనే మరణతీర్పును[a] కలిగి ఉన్నాము; తద్వారా మనపై మనం నమ్మకం ఉంచకుండా, మృతులను లేపే దేవునిపై నమ్మకం ఉంచేలా అయ్యాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరణపు తీర్పు.”
    reason: ἀπόκριμα τοῦ θανάτου యొక్క న్యాయపరమైన/నిర్ణయాత్మక భావానికి సమానంగా సాధ్యమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందటి వాక్యంతో ఉన్న బలమైన వ్యత్యాసాన్ని ఆధునిక తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: αὐτοὶ ἐν ἑαυτοῖς
  choice: మేము మా విషయంలో ... భావించాము
  rationale: αὐτοί లోని ఉద్ఘాటనను ‘మేము’తో, ἐν ἑαυτοῖς లోని అంతర్గత వ్యక్తిగత నిర్ధారణను ‘మా విషయంలో’తో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: మరణశిక్ష విధించబడినట్లు
  rationale: ἀπόκριμα ఇక్కడ నిర్ణయాత్మకమైన తీర్పు లేదా శిక్షావిధిని సూచిస్తుంది; సందర్భంలో మరణం ఖాయమైందనే భావాన్ని ఈ రూపం తెలియజేస్తుంది.
- source_word: ἐσχήκαμεν
  choice: భావించాము
  rationale: అక్షరార్థంగా ‘కలిగి ఉన్నాము’ అయినప్పటికీ, అంతరంగంలో మరణతీర్పు ఉన్నదనే గ్రీకు భావాన్ని తెలుగులో సహజంగా అందిస్తుంది; ‘పొందాము’ అని మూలంలో లేని స్వీకరణ భావాన్ని చేర్చదు.
- source_word: ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς
  choice: మాపై మేము ఆధారపడకుండా
  rationale: ఉద్దేశాన్ని మరియు స్వీయనమ్మకంపై స్థిరంగా ఆధారపడకూడదనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἀλλ’ ἐπὶ τῷ θεῷ
  choice: దేవునిపై ఆధారపడేలా
  rationale: స్వీయాధారతకు దేవునిపై ఆధారతను ప్రత్యక్షంగా వ్యతిరేకంగా నిలుపుతుంది.
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: చనిపోయినవారిని లేపే
  rationale: దేవుని పునరుత్థాన శక్తిని సూటిగా, సాధారణ ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: τοὺς νεκρούς ను సంప్రదాయ పదబంధంగా లేదా వ్యక్తులను స్పష్టంగా సూచించేలా అనువదించాలా
  choice: చనిపోయినవారిని
  alternative: మృతులను
  rationale: రెండూ సాధ్యమే; ‘చనిపోయినవారిని’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతూ, దేవుని పునరుత్థాన శక్తిని అదనపు సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది.
- issue: ἵνα ను ఉద్దేశంగా మాత్రమేనా లేక ఫలితాన్ని కూడా సూచించేలా అనువదించాలా
  choice: ఇది ... ఆధారపడేలా జరిగింది
  alternative: దీనివల్ల ... ఆధారపడ్డాము
  rationale: ἵνα లోని ఉద్దేశ భావాన్ని కాపాడుతుంది; ఆ కష్టానికి దేవుడు నిర్దేశించిన ఉద్దేశమని అతిగా స్పష్టీకరించకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగానూ సాధారణ పాఠకులకు అర్థమయ్యేదిగానూ ఉంచబడింది. ‘మృతులను పునరుత్థానం చేసే’ వంటి అధిక సాంకేతిక రూపానికి బదులు సహజమైన ‘చనిపోయినవారిని లేపే’ వాడబడింది.
