- from: అయితే, మిమ్మల్ని కనికరించి నేను కొరింతుకు మళ్లీ రాలేదని నా ప్రాణం మీద దేవుణ్ణి సాక్షిగా పిలుస్తున్నాను.[a][b]
  to: అయితే, మిమ్మల్ని బాధపెట్టకుండా ఉండటానికి నేను కొరింతుకు మళ్లీ రాలేదని[b] నా ప్రాణం మీద[a] దేవుణ్ణి సాక్షిగా పిలుస్తున్నాను.
  rationale: The revision renders φειδόμενος ὑμῶν as refraining from causing the Corinthians pain, which fits both the verb’s sense and the surrounding discussion of sorrow. It preserves the Greek’s oath formula, the mild contrast, and the contextual sense of οὐκέτι ἦλθον as not coming again, while placing each footnote marker at its proper anchor.
