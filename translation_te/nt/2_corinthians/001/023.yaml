id: 2CO.1.23
reference: 2 Corinthians 1:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐγὼ δὲ μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν, ὅτι φειδόμενος ὑμῶν οὐκέτι ἦλθον εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: te
  text: అయితే, మిమ్మల్ని బాధపెట్టకుండా ఉండటానికి నేను కొరింతుకు మళ్లీ రాలేదని[b] నా ప్రాణం మీద[a] దేవుణ్ణి సాక్షిగా పిలుస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా, “నా ఆత్మ మీద”; భావం: నేను చెప్పేది అబద్ధమైతే దాని బాధ్యత నా మీద పడాలి.'
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఇక కొరింతుకు రాలేదు.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: అయితే, ... నేను
  rationale: δέ సూచించే స్వల్ప వ్యత్యాసాన్ని ‘అయితే’ నిలుపుతుంది; ἐγώలోని వ్యక్తిగత ఉద్ఘాటనను ‘నేను’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: దేవుణ్ణి సాక్షిగా పిలుస్తున్నాను
  rationale: దేవుడు తన మాట నిజమని సాక్ష్యమివ్వాలని పౌలు చేసే గంభీర ప్రమాణపూర్వక పిలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: నా ప్రాణం మీద
  rationale: మూలంలోని ψυχή మరియు ἐπί పదబంధాన్ని దగ్గరగా నిలుపుతూ, అబద్ధమైతే బాధ్యత తనమీద పడాలనే ప్రమాణ భావాన్ని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: ὅτι
  choice: అని
  rationale: ఇది ప్రమాణపూర్వక ప్రకటనలోని విషయాన్ని పరిచయం చేస్తుంది.
- source_word: φειδόμενος ὑμῶν
  choice: మిమ్మల్ని కనికరించి
  rationale: φείδομαιలోని హాని లేదా కఠినతను తప్పించి వారిని విడిచిపెట్టాలనే భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: οὐκέτι ἦλθον
  choice: మళ్లీ రాలేదు
  rationale: సందర్భంలో వాయిదా పడిన తిరుగు సందర్శనను సూచించే οὐκέτι భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కాలపరమైన ‘ఇక రాలేదు’ అనే సాధ్యమైన అర్థాన్ని గమనికలో ఉంచింది.
- source_word: εἰς Κόρινθον
  choice: కొరింతుకు
  rationale: ఒక నగరంవైపు గమనాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రమాణంలో ἐπὶ τὴν ἐμὴν ψυχήν యొక్క బాధ్యతార్థం
  choice: నా ప్రాణం మీద
  alternative: నాకు విరోధంగా / నా మీదకే
  rationale: మూల రూపకాన్ని మరియు దాని గంభీరతను నిలుపుతూ, అబద్ధమైతే పౌలే బాధ్యత వహిస్తాడనే సూచనను పాదటిప్పణిలో స్పష్టం చేసింది; దీనికి అదనపు సిద్ధాంతార్థం జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం వాడబడింది. ‘ప్రాణం మీద’ ప్రమాణ సందర్భంలో సహజంగా ఉండి మూలంలోని ‘ψυχή’ భావాన్ని నిలుపుతుంది. రెండు పాదటిప్పణి గుర్తులూ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
