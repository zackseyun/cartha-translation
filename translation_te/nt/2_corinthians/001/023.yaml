    issue: “మిమ్మల్ని కనికరించి” for φειδόμενος ὑμῶν
    rationale: The verb φείδομαι means ‘spare, refrain from treating harshly,’ rather than ‘have pity.’ In the immediate context Paul means that he refrained from coming so as not to cause the Corinthians further pain.
