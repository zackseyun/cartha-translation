- from: మీ విశ్వాసంపై మేము అధికారం చలాయిస్తున్నామని కాదు; మీ ఆనందం కోసం మేము మీతో కలిసి పనిచేసేవాళ్లం.[a] ఎందుకంటే విశ్వాసం ద్వారానే మీరు స్థిరంగా నిలిచి ఉన్నారు.[b]
