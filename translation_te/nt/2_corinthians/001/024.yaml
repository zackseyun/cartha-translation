id: 2CO.1.24
reference: 2 Corinthians 1:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: te
  text: మీ విశ్వాసంపై మేము అధిపత్యం చలాయిస్తున్నామని కాదు; మీ ఆనందం కోసం మేము సహపనివారము.[a] ఎందుకంటే విశ్వాసంలో మీరు స్థిరంగా నిలిచి ఉన్నారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ ఆనందం కోసం మీతో కలిసి పనిచేసేవారము.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “విశ్వాసం ద్వారా మీరు స్థిరంగా నిలిచి ఉన్నారు.”
    reason: alternative_reading
lexical_decisions:
- source_word: κυριεύομεν
  choice: అధికారం చలాయిస్తున్నాం
  rationale: ఈ క్రియ ఇతరులపై ప్రభుత్వం లేదా ఆధిపత్యం ప్రదర్శించడాన్ని సూచిస్తుంది. ప్రతికూల సందర్భానికి తగినట్లుగా ఈ ఎంపిక సహజమైన ఆధునిక తెలుగులో ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: ὑμῶν τῆς πίστεως
  choice: మీ విశ్వాసంపై
  rationale: గ్రీకు షష్ఠీ విభక్తి నిర్మాణాన్ని తెలుగు వాక్యనిర్మాణంలో సహజంగా ‘మీ విశ్వాసంపై’ అని వ్యక్తపరచవచ్చు; ఇక్కడ πίστις విశ్వాసం లేదా నమ్మకాన్ని సూచిస్తుంది.
- source_word: συνεργοί
  choice: మీతో కలిసి పనిచేసేవాళ్లం
  rationale: ఇది కొరింథీయులపై అధికారం కాకుండా వారితో కలసి చేసే పనిని సూచిస్తుంది. ‘సహపనివారము’ కంటే ఈ రూపం సాధారణ ఆధునిక పాఠకులకు సహజంగా ఉంటుంది.
- source_word: τῆς χαρᾶς ὑμῶν
  choice: మీ ఆనందం కోసం
  rationale: రూపపరంగా షష్ఠీ విభక్తి అయినా, సందర్భంలో పౌలు మరియు అతని సహచరుల పని కొరింథీయుల ఆనందాన్ని లక్ష్యంగా కలిగి ఉందనే భావం ఉంది.
- source_word: τῇ γὰρ πίστει
  choice: విశ్వాసం ద్వారానే
  rationale: ఇక్కడ దత్తి విభక్తి సాధనం లేదా ఆధారాన్ని సూచించవచ్చు. ‘ద్వారా’ ఆ భావాన్ని సహజంగా తెలుపుతుంది; ‘ఏ’ వాక్యంలోని వివరణాత్మక బలాన్ని వ్యక్తపరుస్తుంది.
- source_word: ἑστήκατε
  choice: స్థిరంగా నిలిచి ఉన్నారు
  rationale: పరిపూర్ణ కాలరూపం ఏర్పడిన స్థితి కొనసాగుతోందనే ఫలితార్థాన్ని కలిగి ఉంది. ఈ తెలుగు రూపం నిలకడను మరియు కొనసాగుతున్న స్థితిని రెండింటినీ తెలియజేస్తుంది.
theological_decisions:
- issue: రెండు చోట్ల πίστις యొక్క అర్థం
  choice: విశ్వాసం
  alternative: నమ్మకం
  rationale: సందర్భం కొరింథీయుల విశ్వసించే స్థితిని సూచిస్తుంది. ‘విశ్వాసం’ ప్రధాన పాఠ్యంలో సాంప్రదాయబద్ధమైనప్పటికీ ఆధునికంగా అర్థమయ్యే ఎంపిక; ‘నమ్మకం’ సాధ్యమైన పదార్థ ప్రత్యామ్నాయం.
- issue: τῇ πίστει లో దత్తి విభక్తి సంబంధం
  choice: విశ్వాసం ద్వారా
  alternative: విశ్వాసంలో
  rationale: దీనిని సాధనం లేదా ఆధారంగా గ్రహించడం సందర్భానికి చక్కగా సరిపోతుంది; అయితే స్థితి లేదా పరిధిని సూచిస్తూ ‘విశ్వాసంలో’ అని గ్రహించే అవకాశం కూడా ఉంది, కాబట్టి దాన్ని పాదసూచికలో ఉంచాం.
- issue: συνεργοί మరియు ఆనందంతో సంబంధం
  choice: మీ ఆనందం కోసం మీతో కలిసి పనిచేసేవాళ్లు
  alternative: మీ ఆనందానికి సహపనివారు
  rationale: గ్రీకు షష్ఠీ విభక్తి ఖచ్చిత సంబంధాన్ని పూర్తిగా నిర్దేశించదు. ప్రధాన పాఠ్యం లక్ష్యార్థాన్ని సహజ తెలుగులో తెలియజేస్తుంది; మరింత రూపానుసారమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మొదటి బహువచనానికి సహజమైన సంభాషణాత్మక రూపాన్ని ఎంచుకున్నాం; ఆధిపత్యం మరియు సహకారం మధ్య ఉన్న పౌలు ఉద్దేశించిన వ్యత్యాసాన్ని స్పష్టంగా నిలిపాం.
