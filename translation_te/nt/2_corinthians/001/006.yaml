id: 2CO.1.6
reference: 2 Corinthians 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: te
  text: మేము శ్రమలకు గురవుతున్నామంటే, అది మీ ఆదరణ, రక్షణ కోసమే; మేము ఆదరణ పొందుతున్నామంటే, అది మీ ఆదరణ కోసమే[a]. మేము కూడా అనుభవిస్తున్న అవే బాధలను మీరు సహనంతో భరించడంలో ఆ ఆదరణ పనిచేస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో “మేము ఆదరణ పొందుతున్నామంటే, అది మీ ఆదరణ కోసమే” అనే మాటలు లేవు.
    reason: textual_variant
  - marker: b
    text: ఈ వచనమంతటా “ఆదరణ” అనే పదానికి “ప్రోత్సాహం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: మేము శ్రమలకు గురవుతున్నాము
  rationale: వర్తమాన కర్మణి రూపం కొనసాగుతున్న ఒత్తిడి లేదా కష్టానుభవాన్ని సూచిస్తుంది. ‘శ్రమలకు గురవడం’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: ఆదరణ / ఆదరణ పొందుతున్నాము
  rationale: సందర్భంలో ఈ పదసమూహం ఓదార్పుతో పాటు ధైర్యపరచడం, బలపరచడం అనే భావాలను కలిగి ఉంది. ‘ఆదరణ’ ఈ భావపరిధిని సహజంగా వ్యక్తం చేస్తూ పదపునరావృత్తిని కాపాడుతుంది.
- source_word: σωτηρίας
  choice: రక్షణ
  rationale: ఈ సందర్భంలో తాత్కాలిక విడుదల అనే భావం సాధ్యమైనా, పౌలు వాడుకలోని విస్తృత రక్షణ భావాన్ని ‘రక్షణ’ స్పష్టంగా నిలుపుతుంది.
- source_word: τῆς ἐνεργουμένης
  choice: పనిచేస్తుంది
  rationale: ఈ కృదంతం ఆదరణ కేవలం ఉన్నదని కాక, సహనంలో క్రియాశీలంగా ఫలితాన్ని కలిగిస్తుందని సూచిస్తుంది.
- source_word: ἐν ὑπομονῇ
  choice: సహనంతో భరించడంలో
  rationale: ὑπομονήలోని స్థిరంగా నిలిచి భరించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ἐν యొక్క సంబంధాన్ని ‘లో’ ద్వారా నిలుపుతుంది.
- source_word: τῶν αὐτῶν παθημάτων
  choice: అవే బాధలు
  rationale: పౌలు బృందం, కొరింథీయులు పంచుకుంటున్న ఒకే రకమైన బాధలను నేరుగా తెలియజేస్తుంది.
- source_word: ὑπὲρ
  choice: కోసం
  rationale: కొరింథీయుల ప్రయోజనాన్ని సూచించే హితార్థక భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: τῆς ἐνεργουμένης ἐν ὑπομονῇ యొక్క సంబంధం
  choice: ఆదరణ, అదే బాధలను సహనంతో భరించడంలో పనిచేస్తుంది
  alternative: ఆదరణ వల్ల అదే బాధలను సహనంతో భరించగలుగుతారు
  rationale: మూలంలోని వ్యాకరణ సంబంధాన్ని కాపాడుతూ, సహనం ఆదరణకు ఫలితమా లేక అది పనిచేసే పరిధియా అనే సూక్ష్మతను అతిగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. మూలంలోని ‘ఆదరణ’ పదసంబంధ పునరావృత్తి ఉద్దేశపూర్వకంగా కాపాడబడింది.
