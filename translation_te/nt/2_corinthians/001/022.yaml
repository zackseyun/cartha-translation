translation:
  language: te
  text: ఆయనే మనపై తన ముద్ర కూడా వేశాడు; మన హృదయాల్లో ఆత్మ యొక్క ముందస్తు చెల్లింపును[a] ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆత్మ యొక్క పూచీ’ లేదా ‘ఆత్మ యొక్క హామీ’.
    reason: ἀρραβών మిగిలినది అందుతుందని నిర్ధారించే తొలి చెల్లింపు, పూచీ లేదా హామీని సూచిస్తుంది. ‘ఆత్మ యొక్క’ అనే సంబంధాన్ని ప్రధాన పాఠంలో, అలాగే ప్రత్యామ్నాయాల్లోనూ నిలిపాం.
lexical_decisions:
- source_word: σφραγισάμενος
  choice: మనపై తన ముద్ర వేశాడు
  rationale: ముద్ర వేయడం అనే మూల రూపకాన్ని నిలుపుతూ, యాజమాన్యం, ప్రామాణికత లేదా భద్రత అనే సూచనలను అతిగా వివరించకుండా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δοὺς
  choice: ఇచ్చాడు
  rationale: గ్రీకు భూతకాల అసమాపక క్రియారూపాన్ని ముందున్న సమాంతర క్రియతో సమన్వయించి తెలుగులో సహజమైన సమాపక క్రియగా ఇచ్చాం.
- source_word: ἀρραβῶνα
  choice: ముందస్తు చెల్లింపుగా
  rationale: మిగిలినది తప్పక అందుతుందనే హామీనిచ్చే తొలి చెల్లింపు అనే వాణిజ్య రూపకాన్ని స్పష్టమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τοῦ πνεύματος
  choice: ఆత్మను ముందస్తు చెల్లింపుగా
  rationale: ఈ షష్ఠీ విభక్తి ఆత్మయే ఆ ముందస్తు చెల్లింపు అని సూచించగలదు. తెలుగు వాక్య నిర్మాణంలో సహజత్వం కోసం దీనిని స్పష్టంగా వ్యక్తం చేశాం; కేవలం ఆత్మ నుండి వచ్చిన చెల్లింపు అని పరిమితం చేయలేదు.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: మన హృదయాల్లో
  rationale: ἐν మరియు దత్తివిభక్తి సూచించే అంతర్గత స్థానాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: ὁ καὶ ... καὶ
  choice: ఆయనే ...; ... ఇచ్చాడు
  rationale: ὁ ముందటి వచనంలోని దేవుణ్ణి సూచిస్తుంది. ‘ఆయనే’ ఆ అనుసంధానాన్ని తెలియజేస్తూ, రెండు అసమాపక క్రియలను తెలుగులో సహజమైన సమాంతర వాక్యాలుగా అందిస్తుంది.
theological_decisions:
- issue: ఆత్మ ἀρραβών కావడం యొక్క భావం
  choice: ‘ఆత్మను ముందస్తు చెల్లింపుగా’ అని వాణిజ్య రూపకాన్ని నిలిపాం.
  alternative: ‘ఆత్మను పూచీగా’ లేదా ‘ఆత్మ అనే హామీని’
  rationale: ‘హామీ’ భావాన్ని తెలిపినా మూలంలోని స్పష్టమైన తొలి చెల్లింపు రూపకాన్ని తగ్గిస్తుంది. ప్రధాన పాఠంలో రూపకాన్ని ఉంచి, సమీప అర్థాలను పాదసూచికలో ఇచ్చాం.
- issue: τοῦ πνεύματος యొక్క సంబంధం
  choice: ఆత్మయే ముందస్తు చెల్లింపు అనే పఠనాన్ని సహజ తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేశాం.
  alternative: ఆత్మ ఇచ్చే ముందస్తు చెల్లింపు
  rationale: గ్రీకు షష్ఠీ విభక్తిలో కొంత సంక్షిప్తత ఉన్నప్పటికీ, పౌలు వాడిన సమాంతర సందర్భాల్లో ఆత్మయే ఇచ్చబడిన పూచీ/ముందస్తు చెల్లింపు అనే భావం బలంగా ఉంటుంది; అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ముద్ర’ మరియు ‘ముందస్తు చెల్లింపు’ అనే రెండు మూల రూపకాలను నిలిపి, వాక్యాన్ని సహజ తెలుగు క్రమంలో అమర్చాం.
