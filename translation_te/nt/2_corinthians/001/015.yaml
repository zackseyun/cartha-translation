  yaml_path: translation/nt/2_corinthians/001/015.yaml
  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: te
  text: ఈ నమ్మకంతో, మీరు రెండవ మేలును[a] పొందేలా నేను ముందుగా మీ దగ్గరకు రావాలని ఉద్దేశించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “రెండవ కృపను” లేదా “రెండవ అనుగ్రహాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθήσει
  choice: నమ్మకంతో
  rationale: πεποίθησις ఇక్కడ పౌలు తన ప్రయాణ ఉద్దేశానికి ఆధారమైన నమ్మకం లేదా ధైర్యాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నమ్మకం’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: ἐβουλόμην
  choice: ఉద్దేశించాను
  rationale: βούλομαι సంకల్పం లేదా ఉద్దేశాన్ని తెలియజేస్తుంది; ‘ఉద్దేశించాను’ అనేది కేవలం కోరికకన్నా బలమైనదిగా ఉండి, ఖరారైన ప్రణాళికగా అతిశయింపదు.
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: మొదట మీ దగ్గరకు రావాలని
  rationale: πρότερον ఇక్కడ ప్రయాణ క్రమంలో ముందుగా రావడాన్ని సూచించే అవకాశం ఎక్కువ; ‘మొదట’ ఆ క్రమ ప్రాధాన్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δευτέραν χάριν
  choice: రెండవ కృపను
  rationale: χάρις అనేది కృప, అనుగ్రహం, మేలు అనే అర్థ విస్తృతిని కలిగి ఉంది. సందర్శన ద్వారా కలిగే మేలు సందర్భానికి సరిపోతున్నా, ‘కృప’ మూలపదంలోని ఉద్దేశపూర్వక అస్పష్టతను, ధార్మిక ప్రతిధ్వనిని నిలుపుతుంది.
- source_word: σχῆτε
  choice: పొందేలా
  rationale: ἔχω ఇక్కడ ‘కలిగి ఉండడం’ లేదా ‘పొందడం’ అనే భావంలో ఉంది; ప్రయోజనం లేదా కృపను స్వీకరించే సందర్భంలో ‘పొందేలా’ సహజమైన తెలుగు.
theological_decisions:
- issue: δευτέραν χάριν యొక్క భావం
  choice: రెండవ కృపను
  alternative: రెండవ మేలును / రెండోసారి మేలు
  rationale: ప్రయాణ సందర్భంలో ఇది పౌలు సందర్శన వల్ల కలిగే ప్రయోజనాన్ని సూచించవచ్చు. అయినప్పటికీ χάρις యొక్క ‘కృప/అనుగ్రహం’ భావాన్ని పూర్తిగా తొలగించకుండా ప్రధాన పాఠంలో నిలిపి, సందర్భార్థాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని ప్రయాణ క్రమాన్ని ‘మొదట’తో, χάρις పదంలోని అర్థ విస్తృతిని ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా నిలిపాం.
