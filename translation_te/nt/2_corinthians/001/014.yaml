language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καθὼς καὶ ἐπέγνωτε ἡμᾶς ἀπὸ μέρους, ὅτι καύχημα ὑμῶν ἐσμεν καθάπερ καὶ ὑμεῖς ἡμῶν ἐν τῇ ἡμέρᾳ τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: te
  text: మీరు కూడా మమ్మల్ని కొంతవరకు అర్థం చేసుకున్నారు—మన ప్రభువైన యేసు దినాన మేము మీ అతిశయకారణమని, అలాగే మీరు మా అతిశయకారణమని.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పాక్షికంగా” లేదా “కొంతమట్టుకు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “గర్వకారణంగా” లేదా “గర్వించడానికి కారణంగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: అర్థం చేసుకున్నారు
  rationale: కొరింథీయులు పౌలును, అతని సహచరులను నిజంగా గుర్తించి అర్థం చేసుకున్నారని సూచిస్తుంది; సంపూర్ణంగా గ్రహించారనే భావాన్ని అతిగా చేర్చదు.
- source_word: ἀπὸ μέρους
  choice: కొంతవరకు
  rationale: అవగాహన పరిమితమైనదని తెలిపే గ్రీకు నుడికారాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, దాని స్థాయిని నిర్దిష్టం చేయదు.
- source_word: καύχημα
  choice: అతిశయకారణం
  rationale: వ్యక్తి లేదా సంబంధాన్ని బట్టి కలిగే అతిశయాన్ని సూచించే పౌలు ప్రయోగాన్ని నిలుపుతుంది; కేవలం గర్వం అనే ప్రతికూల భావానికి పరిమితం చేయదు.
- source_word: καθάπερ
  choice: ఉన్నట్లే
  rationale: పౌలు బృందం మరియు కొరింథీయుల మధ్య ఉన్న పరస్పర పోలికను స్పష్టంగా నిలుపుతుంది.
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: ప్రభువైన మన యేసు దినాన
  rationale: అంత్యకాల సంబంధమైన స్థిర అభివ్యక్తిని సహజ తెలుగులో నిలుపుతూ, κύριοςను క్రీస్తు బిరుదుగా స్పష్టంగా అనువదిస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: ఈ సందర్భంలోని క్రీస్తు బిరుదుకు గౌరవప్రదమైన, ప్రామాణిక తెలుగు రూపం.
- source_word: καθὼς καὶ
  choice: మీరు కూడా ... అర్థం చేసుకున్నట్లే
  rationale: మునుపటి వాక్యంతో ఉన్న పోలికనూ καί యొక్క ‘కూడా’ భావాన్నీ సహజ తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
theological_decisions:
- issue: పౌలు వాడిన పరస్పర καύχημα భాష
  choice: మేము మీకు అతిశయకారణంగా ఉన్నట్లే, మీరు కూడా మాకు అతిశయకారణంగా ఉంటారు
  alternative: మేము మీ గర్వకారణంగా ఉన్నట్లే, మీరు కూడా మా గర్వకారణంగా ఉంటారు
  rationale: అపొస్తలుడు మరియు సంఘం ప్రభువు దినాన ఒకరినిబట్టి మరొకరు అతిశయిస్తారనే పరస్పర భావాన్ని నిలుపుతుంది. ‘అతిశయకారణం’ అనే రూపం మూలంలోని నామవాచక భావాన్ని కాపాడుతూ, స్వీయోన్నతి అనే అర్థాన్ని అనవసరంగా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వాక్యంలో కాలసూచక పదబంధం చివర ఉన్నా, తెలుగు సహజత్వం కోసం ప్రధాన పరస్పర వాక్యానికి ముందు ఉంచబడింది. మొదటి భాగంలోని భూతకాలం, ప్రభువు దినానికి సంబంధించిన భావంలోని భవిష్యత్ దృష్టి తెలుగులో స్పష్టంగా వ్యక్తమయ్యాయి.
