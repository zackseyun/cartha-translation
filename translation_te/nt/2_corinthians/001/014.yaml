    reason: lexical_alternative
  revision_rationale: This revision replaces the ambiguous repeated comparative phrasing with an explicit content clause, restores the source's reciprocal present assertion rather than a future prediction, and makes the Lord's-day phrase govern both sides of the reciprocal statement. It preserves the opening comparative connection through the verse's ellipsis/dash structure without supplying doctrinal detail.
