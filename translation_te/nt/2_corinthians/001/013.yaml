  revision_rationale: The revision corrects the source-level mistranslation of ἢ καὶ by changing the joined verbal idea to an explicit alternative, while retaining a natural Telugu expression. It also places the completive interpretation of ἕως τέλους in the footnote, so that the temporal and completive possibilities are not fused into a single, over-specified main-text rendering.
