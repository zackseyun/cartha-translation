revisions:
- from: ఎందుకంటే, మీరు చదివి గ్రహించేవి తప్ప వేరే విషయాలేవీ మేము మీకు రాయడం లేదు. మీరు అంతం వరకు పూర్తిగా గ్రహిస్తారని నేను ఆశిస్తున్నాను[a].
  to: ఎందుకంటే, మీరు చదివేవి లేదా గ్రహించేవి తప్ప మేము మీకు వేరే ఏదీ రాయడం లేదు; మీరు అంతం వరకు గ్రహిస్తారని నేను ఆశిస్తున్నాను[a].
  rationale: The revision corrects the source-level mistranslation of ἢ καὶ by changing the joined verbal idea to an explicit alternative, while retaining a natural Telugu expression. It also places the completive interpretation of ἕως τέλους in the footnote, so that the temporal and completive possibilities are not fused into a single, over-specified main-text rendering.
