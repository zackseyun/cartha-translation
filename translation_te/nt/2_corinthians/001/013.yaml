id: 2CO.1.13
reference: 2 Corinthians 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: te
  text: ఎందుకంటే, మీరు చదివేవి లేదా గ్రహించేవి తప్ప మేము మీకు వేరే ఏదీ రాయడం లేదు; మీరు అంతం వరకు గ్రహిస్తారని నేను ఆశిస్తున్నాను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు పూర్తిగా గ్రహిస్తారని నేను ఆశిస్తున్నాను.”
    reason: ἕως τέλουςను కాలసంబంధంగా “అంతం వరకు” అని లేదా సంపూర్ణతను సూచిస్తూ “పూర్తిగా” అని అర్థం చేసుకునే సాధ్యమైన సందిగ్ధతను చూపిస్తుంది.
lexical_decisions:
- source_word: ἄλλα
  choice: వేరే విషయాలేవీ
  rationale: నపుంసక బహువచనాన్ని తెలుగు వాక్యనిర్మాణానికి సహజంగా మార్చి, భిన్నమైన లేదా దాచిన సందేశమేదీ రాయడం లేదనే నిరాకరణను నిలుపుతుంది.
- source_word: ἀναγινώσκετε
  choice: మీరు చదివి
  rationale: వర్తమాన క్రియ యొక్క సాధారణ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐπιγινώσκετε
  choice: గ్రహించేవి
  rationale: ఇక్కడ కేవలం చదవడానికీ దాని భావాన్ని తెలుసుకోవడానికీ మధ్య ఉన్న పురోగతిని ‘గ్రహించు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐπιγνώσεσθε
  choice: పూర్తిగా గ్రహిస్తారని
  rationale: అదే క్రియ యొక్క భవిష్యత్తు రూపాన్ని ముందటి ‘గ్రహించు’తో అనుసంధానిస్తూ, మరింత సంపూర్ణమైన అవగాహన భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἕως τέλους
  choice: అంతం వరకు
  rationale: గ్రీకు పదబంధంలోని కాలసంబంధమైన లేదా పరిపూర్ణతసంబంధమైన నిజమైన సందిగ్ధతను తొలగించకుండా, దాని ప్రత్యక్ష భావాన్ని నిలుపుతుంది.
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: ఎందుకంటే ... తప్ప ... లేదు
  rationale: మినహాయింపు మరియు నిరాకరణతో కూడిన గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: ἕως τέλους యొక్క కాలసంబంధమైన భావమా, సంపూర్ణత భావమా
  choice: ప్రధాన పాఠ్యంలో ‘అంతం వరకు’ అని ప్రత్యక్ష కాలసంబంధ రూపాన్ని ఉంచి, ‘పూర్తిగా’ ద్వారా సాధ్యమైన సంపూర్ణత భావాన్నీ తెలియజేయడం
  alternative: ‘పూర్తిగా’ అని మాత్రమే అనువదించడం
  rationale: మూలంలోని ‘అంతం వరకు’ అనే వ్యక్తీకరణను చెరపకుండా, సందర్భంలో సూచితమయ్యే సంపూర్ణ అవగాహన భావాన్ని కూడా నిలుపుతుంది; ఏ ప్రత్యేక సిద్ధాంతార్థాన్నీ బలవంతంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయినా పత్రికా శైలికి తగిన గౌరవగంభీరతతో ఉంది. ‘చదివి గ్రహించేవి’ అనే రూపం చదవడం నుంచి అవగాహనకు వెళ్లే భావక్రమాన్ని సంక్షిప్తంగా నిలుపుతుంది.
