id: 2CO.1.1
reference: 2 Corinthians 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: te
  text: 'దేవుని చిత్తం ద్వారా మెస్సీయ యేసు[a] అపొస్తలుడైన పౌలు, మరియు సహోదరుడైన తిమోతి, కొరింథులో ఉన్న దేవుని సంఘానికీ, అకయ అంతటా ఉన్న పరిశుద్ధులందరికీ తో పాటు:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, క్రీస్తు యేసు.
    reason: ‘మెస్సీయ యేసు’కు సాంప్రదాయ ప్రత్యామ్నాయ అనువాదాన్ని సూచిస్తుంది; ఇది ఆంగ్ల పరిశీలన-చరిత్రలో నమోదు చేసిన ప్రత్యామ్నాయాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: ἀπόστολος
  choice: అపొస్తలుడు
  rationale: పౌలుకు అప్పగించబడిన అధికారిక సేవను సూచించే స్థిరమైన తెలుగు బైబిలు పదం; సాధారణ ‘దూత’ కంటే సందర్భానికి ఖచ్చితమైనది.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: ఇక్కడ Χριστός బిరుదు భావాన్ని నిలుపుతుంది; ‘మెస్సీయ’ ఆ అభిషిక్తుని భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: διὰ θελήματος θεοῦ
  choice: దేవుని చిత్తం వల్ల
  rationale: διά + genitive ఇక్కడ పౌలు అపొస్తలత్వానికి దేవుని చిత్తమే ఆధారమని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ ἀδελφὸς
  choice: సహోదరుడైన
  rationale: గ్రీకులో స్వామ్యసూచక పదం లేదు. తెలుగు లేఖా పరిచయంలో సంబంధాన్ని సహజంగా తెలిపేందుకు ‘సహోదరుడైన’ అని, ‘మన’ అనే చేర్పు లేకుండా అనువదించబడింది.
- source_word: ἐκκλησίᾳ
  choice: సంఘానికి
  rationale: పౌలు సంబోధిస్తున్న దేవుని విశ్వాసుల సమాజానికి ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజమైన, స్థిరమైన పదం.
- source_word: ἁγίοις
  choice: పరిశుద్ధులు
  rationale: దేవునికి ప్రత్యేకపరచబడిన విశ్వాసులను సూచించే పౌలు వాడుకను స్థిరంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: σὺν
  choice: అలాగే
  rationale: కొరింథు సంఘంతోపాటు అకయలోని పరిశుద్ధులందరూ కూడా పత్ర గ్రహీతలని సహజ తెలుగులో కలుపుతుంది.
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: అకయ అంతటా
  rationale: మొత్తం ప్రాంతమంతటా ఉన్నవారనే విస్తృతిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పౌలు ప్రారంభ పరిచయంలో Χριστός అనువాదం
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఈ సందర్భంలో Χριστόςకు అభిషిక్త రాజు అనే బిరుదు భావం కనిపిస్తుంది. అందువల్ల ఆ భావాన్ని మరుగుపరచకుండా ‘మెస్సీయ’గా అనువదించబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన లేఖా శైలి. మూలంలోని దీర్ఘ సంబోధన నిర్మాణాన్ని తెలుగులో స్పష్టంగా చేయడానికి దీర్ఘ విరామ చిహ్నం మరియు ‘రాస్తున్నది’ ఉపయోగించబడ్డాయి; ఇది పత్రారంభంలో అంతర్లీనంగా ఉన్న భావాన్ని మాత్రమే వెల్లడిస్తుంది.
