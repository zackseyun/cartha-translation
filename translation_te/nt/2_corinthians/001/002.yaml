translation:
  language: te
  text: మన తండ్రియైన దేవుని నుండీ, ప్రభువైన[b] యేసు క్రీస్తు[a] నుండీ మీకు కృప, శాంతి కలుగుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “క్రీస్తు” అంటే “అభిషిక్తుడు”; దీనిని “మెస్సీయ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని సందర్భాల్లో “ప్రభువు” అనే పదాన్ని “యజమాని” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పౌలు పత్రికల అభివాదంలో ఈ పదానికి ఉన్న అనుగ్రహ భావాన్నీ, దైవశాస్త్రపరమైన బరువునూ నిలుపుతుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: దత్తివిభక్తి భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: εἰρήνη
  choice: శాంతి
  rationale: వ్యక్తిగత ప్రశాంతతకన్నా విస్తృతమైన బైబిలు శాంతి భావాన్ని తెలిపే, ఆధునిక పాఠకులకు స్పష్టమైన పదం.
- source_word: ἀπὸ
  choice: నుండీ
  rationale: కృప, శాంతి ఎక్కడి నుండి వస్తున్నాయో తెలిపే మూలార్థాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: మన తండ్రియైన దేవుడు
  rationale: దేవుడే మన తండ్రి అనే అన్వయాన్ని సహజమైన తెలుగు రూపంలో కాపాడుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: యేసుకు వర్తించే గౌరవపూర్వక బిరుదుగా నూతన నిబంధన సందర్భానికి సరిపోతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు క్రీస్తు
  rationale: తెలుగులో స్థిరపడిన నామ-బిరుదు రూపాన్ని వాడుతూ, Χριστός యొక్క బిరుదు భావాన్ని పాదసూచికలో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: Χριστοῦ అనే బిరుదును పౌలు అభివాదంలో ఎలా అందించాలి
  choice: క్రీస్తు
  alternative: మెస్సీయ; అభిషిక్తుడు
  rationale: తెలుగులో ‘యేసు క్రీస్తు’ సహజంగా, విస్తృతంగా గుర్తించబడే రూపం. అయితే మూలపదంలోని ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు భావం మరుగునపడకుండా పాదసూచికలో ఇచ్చాం.
- issue: κυρίου యొక్క క్రీస్తుసంబంధ బిరుదు భావం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ ఆశీర్వాద సూత్రంలో ఇది యేసుకు ఇచ్చిన ఉన్నత బిరుదు; ‘ప్రభువు’ ఆ భావాన్నీ గంభీరతనూ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, పత్రికా అభివాదానికి తగిన గంభీరమైన కానీ సులభంగా అర్థమయ్యే శైలి. ‘సమాధానం’ ఆధునిక తెలుగులో ‘జవాబు’ అనే అర్థాన్ని బలంగా సూచించగలందున εἰρήνηకి ‘శాంతి’ ఎంచుకున్నాం. గ్రీకులో ἀπό ఒక్కసారే ఉన్నప్పటికీ, రెండు సమన్విత మూలాలను తెలుగులో స్పష్టంగా చూపేందుకు ‘నుండీ’ని పునరుక్తి చేశాం.
