id: 2CO.1.8
reference: 2 Corinthians 1:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: te
  text: సోదరులారా,[a] ఆసియలో[b] మాకు కలిగిన శ్రమ గురించి మీరు తెలియకుండా ఉండాలని మేము కోరము; ఎందుకంటే, మా శక్తికి మించి మితిమీరిన భారంతో మేము అణచివేయబడ్డాం. దానివల్ల బ్రతకడం గురించికూడా పూర్తిగా నిరాశ చెందాము.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సోదరులారా” అనేది పుంలింగ బహువచనమైన ἀδελφοί అనే గ్రీకు పదానికి అనువాదం; ఈ సందర్భంలో పౌలు విశ్వాస సమాజంలోని స్త్రీపురుషులందరినీ ఉద్దేశించి ఉండవచ్చు.
    reason: cultural_note
  - marker: b
    text: ఇక్కడ “ఆసియ” అంటే ఆధునిక ఆసియా ఖండం కాదు; ఆసియా మైనరు పశ్చిమ భాగంలో ఉన్న రోమా పరిపాలనా ప్రాంతం.
    reason: cultural_note
  - marker: c
    text: లేదా, “జీవించి ఉండగలమనే ఆశను కూడా కోల్పోయాం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλομεν ... ἀγνοεῖν
  choice: మీరు తెలియకుండా ఉండడం మాకు ఇష్టం లేదు
  rationale: గ్రీకు వర్తమానకాల సంకల్ప ప్రకటనను ఆధునిక, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ἀγνοεῖν లోని ‘తెలియకపోవడం’ అనే భావాన్ని కాపాడుతుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పదంలోని వ్యాకరణపరమైన పుంలింగ బహువచన సంబోధనను ప్రధాన పాఠ్యంలో నిలుపుతుంది; సమాజమంతటినీ ఉద్దేశించే సంభావ్య విస్తృత ప్రయోగాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: ὑπὲρ τῆς θλίψεως ἡμῶν
  choice: మాకు కలిగిన శ్రమ గురించి
  rationale: θλῖψις సూచించే తీవ్రమైన కష్టం, ఒత్తిడి భావాన్ని ‘శ్రమ’ గౌరవప్రదంగా, సులభంగా తెలియజేస్తుంది.
- source_word: τῆς γενομένης ἐν τῇ Ἀσίᾳ
  choice: ఆసియలో మాకు కలిగిన
  rationale: γενομένης అనే కృదంత నిర్మాణాన్ని తెలుగులో సహజంగా అందిస్తూ సంఘటన స్థలాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: καθ’ ὑπερβολὴν ὑπὲρ δύναμιν
  choice: మా శక్తికి మించి అత్యధికంగా
  rationale: 'రెండు అతిశయ పదబంధాలనూ కాపాడుతుంది: ఒకటి తీవ్రతను, మరొకటి మానవ సామర్థ్యాన్ని మించడాన్ని సూచిస్తాయి.'
- source_word: ἐβαρήθημεν
  choice: భారానికి లోనయ్యాం
  rationale: క్రియలోని కర్మణి భావాన్నీ, బరువుతో అణచివేయబడిన రూపకాన్నీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: దానివల్ల బ్రతుకుతామనే ఆశను కూడా వదులుకున్నాం
  rationale: ὥστε లోని ఫలిత భావాన్ని స్పష్టం చేసి, ἐξαπορέομαι యొక్క తీవ్రమైన నిరాశను మరియు τοῦ ζῆν యొక్క జీవించడం గురించిన పరిధిని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ἀδελφοί అనే పత్రికా సంబోధన
  choice: సోదరులారా
  alternative: సోదర సోదరీమణులారా
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది విశ్వాస సమాజంలోని స్త్రీపురుషులందరినీ కలుపుకొని ఉండవచ్చనే అంశాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: καὶ τοῦ ζῆν తో కూడిన ἐξαπορηθῆναι తీవ్రత
  choice: బ్రతుకుతామనే ఆశను కూడా వదులుకున్నాం
  alternative: ఇక బ్రతకడం సాధ్యమేనా అని పూర్తిగా దిక్కుతోచని స్థితికి వచ్చాం
  rationale: ఇది కేవలం భావోద్వేగ నిరుత్సాహమా లేక జీవించి కొనసాగడంపై సంపూర్ణ నిస్సహాయతా అనే పదంలోని విస్తృతిని అతిగా సిద్ధాంతీకరించకుండా, సందర్భంలోని ప్రాణాపాయ తీవ్రతను తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పత్రికా శైలి. మూలంలోని తీవ్రతను ‘మా శక్తికి మించి అత్యధికంగా’ అనే ద్వంద్వ వ్యక్తీకరణతో నిలిపి, పొడవైన గ్రీకు వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించాం.
