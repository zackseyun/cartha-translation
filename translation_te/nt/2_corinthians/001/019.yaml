id: 2CO.1.19
reference: 2 Corinthians 1:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: te
  text: ఎందుకంటే మా ద్వారా—అంటే నా ద్వారా, సిల్వాను మరియు తిమోతి ద్వారా—మీ మధ్య ప్రకటించబడిన దేవుని కుమారుడైన యేసు క్రీస్తు[a] “అవును”గానూ “కాదు”గానూ కాలేదు; బదులుగా, ఆయనలో అది “అవును”గా అయింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు మెస్సీయ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς τοῦ θεοῦ
  choice: దేవుని కుమారుడు
  rationale: మూలంలోని క్రీస్తును సూచించే బిరుదును సహజమైన తెలుగు పదక్రమంలో, దాని సంపూర్ణ భావభారంతో నిలిపింది.
- source_word: Ἰησοῦς Χριστός
  choice: యేసు క్రీస్తు
  rationale: ఈ జతపదం ఇక్కడ స్థిరమైన వ్యక్తినామంలా పనిచేస్తున్నందున ఆధునిక ప్రామాణిక తెలుగులో సుపరిచితమైన ‘యేసు క్రీస్తు’ను ప్రధాన పాఠంలో ఉంచింది; ‘మెస్సీయ’ అనే బిరుదు భావాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: κηρυχθείς
  choice: ప్రకటించబడిన
  rationale: κηρύσσω లోని బహిరంగంగా ప్రకటించే భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δι’ ἡμῶν
  choice: మా ద్వారా
  rationale: διά సూచించే సాధనత్వం లేదా మధ్యవర్తిత్వాన్ని నిలిపి, తరువాత వచ్చే వ్యక్తుల పేర్లతో ఉన్న పునరుక్తికి అనుసంధానిస్తుంది.
- source_word: δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: నా ద్వారా, సిల్వాను ద్వారా, తిమోతి ద్వారా
  rationale: మూలంలోని ఒకే విభక్తి సంబంధాన్ని ప్రతి పేరుతో స్పష్టంగా చూపిస్తూ, పౌలు తనను మరియు తన సహచరులను పేర్కొన్న విధానాన్ని కాపాడుతుంది.
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: “అవును” అనీ “కాదు” అనీ కాలేదు
  rationale: ἐγένετο యొక్క ‘కాలేదు/అవలేదు’ భావాన్ని ప్రతిబింబిస్తూ, పౌలు వాడిన ఉద్దేశపూర్వకమైన ‘అవును–కాదు’ వ్యతిరేకతను వివరణాత్మకంగా మార్చకుండా నిలిపింది.
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: బదులుగా, ఆయనలో అది “అవును” అయింది
  rationale: γέγονεν లోని సంభవించి కొనసాగుతున్న భావానికి తెలుగు పరిపూర్ణ రూపాన్ని ఉపయోగించి, ‘ఆయనలో’ అనే ధార్మికంగా ముఖ్యమైన కానీ కొంత అస్పష్టమైన వ్యక్తీకరణను వ్యాఖ్యానించి పరిష్కరించకుండా ఉంచింది.
theological_decisions:
- issue: Χριστόςను బిరుదుగా లేదా స్థిరనామ భాగంగా అనువదించడం
  choice: యేసు క్రీస్తు
  alternative: యేసు మెస్సీయ
  rationale: Ἰησοῦς Χριστός ఇక్కడ ‘దేవుని కుమారుడు’కు సమానాధికారంగా వచ్చి స్థిరమైన వ్యక్తినామంలా పనిచేస్తుంది. అందువల్ల తెలుగు పాఠకులకు సహజమైన ‘యేసు క్రీస్తు’ను ప్రధాన పాఠంలో ఉంచి, బిరుదు భావాన్ని పాదసూచికలో సంరక్షించింది.
- issue: Ναί/Οὔ అనే రూపక వ్యతిరేకతను వివరించాలా లేక యథాతథంగా ఉంచాలా
  choice: “అవును” అనీ “కాదు” అనీ కాలేదు; ... ఆయనలో అది “అవును” అయింది
  alternative: ఆయన నిలకడలేనివాడు కాదు; పూర్తిగా నమ్మదగినవాడు
  rationale: పౌలు మాటలలోని ధార్మిక ఉద్వేగాన్ని, సూచనాత్మకతను కాపాడటానికి ‘నిలకడలేని/నమ్మదగిన’ వంటి వ్యాఖ్యానాత్మక పదాలతో భావాన్ని ముందుగానే పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నప్పటికీ గౌరవప్రదమైన వాక్యనిర్మాణం. గ్రీకు వాక్యంలోని διά పునరుక్తిని తెలుగులో ‘ద్వారా’తో నిలిపి, పొడవైన వాక్యాన్ని దీర్ఘవిరామంతో స్పష్టపరిచింది. ‘అవును/కాదు’ అనే ఉద్దేశపూర్వక అస్పష్టతను వ్యాఖ్యానాత్మకంగా సరళీకరించలేదు.
