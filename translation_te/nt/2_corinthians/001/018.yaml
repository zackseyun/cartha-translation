language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πιστὸς δὲ ὁ θεὸς ὅτι ὁ λόγος ἡμῶν ὁ πρὸς ὑμᾶς οὐκ ⸀ἔστιν Ναὶ καὶ Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/018.yaml
  text: As surely as God is faithful[b][a], our message to you is not “Yes and No.”
translation:
  language: te
  text: దేవుడు విశ్వాసయోగ్యుడు అన్నది ఎంత నిశ్చయమో, మీకు మా సందేశం “అవును మరియు కాదు” అని ఉండదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరానుసారంగా: “అయితే దేవుడు విశ్వాసయోగ్యుడు; మీకు మా మాట ‘అవును మరియు కాదు’ అని ఉండదు.” ఇక్కడ “సందేశం”ను “మాట” లేదా “మాట్లాడిన మాట” అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: నమ్మదగినవాడు
  rationale: ఇక్కడ దేవుని విశ్వసనీయత, ఆయనపై నిశ్చయంగా ఆధారపడగల స్వభావం ప్రధానంగా ఉంది; ఆధునిక తెలుగులో ‘నమ్మదగినవాడు’ దాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δὲ ... ὅτι
  choice: '...ఉన్నంత నిశ్చయంగా'
  rationale: πιστὸς ὁ θεός అనే ప్రమాణబద్ధమైన నిశ్చయ ప్రకటన బలాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; కేవలం ‘అయితే’ అని అనువదిస్తే వాక్యంలోని ఆ బలం స్పష్టంగా ఉండదు.
- source_word: ὁ λόγος ἡμῶν ὁ πρὸς ὑμᾶς
  choice: మీకు మేము ప్రకటించిన సందేశం
  rationale: λόγος ఇక్కడ కొరింథీయులకు పౌలు మరియు అతని సహచరులు తెలియజేసిన మాట లేదా సందేశాన్ని సూచిస్తుంది. ‘ప్రకటించిన’ అనేది πρὸς ὑμᾶς యొక్క దిశను సహజంగా స్పష్టం చేస్తుంది; ‘మాట’ అనే మరింత అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: οὐκ ἔστιν
  choice: ఉండదు
  rationale: తెలుగులో సందేశ స్వభావాన్ని చెప్పేటప్పుడు సహజమైన వర్తమాన భావం; అది విరుద్ధంగా లేదా తటపటాయింపుగా ఉండదనే వాదనను తెలియజేస్తుంది.
- source_word: Ναὶ καὶ Οὔ
  choice: “అవును, కాదు”
  rationale: మూలంలోని పదునైన జంట పదాలను అలాగే నిలుపుతూ, అస్థిరత లేదా పరస్పర విరుద్ధత అనే సూచనను పాఠకుడు గ్రహించేలా ఉద్ధరణ చిహ్నాల్లో ఇచ్చాం.
theological_decisions:
- issue: πιστὸς δὲ ὁ θεὸς ὅτι అనే ప్రమాణబద్ధ నిర్మాణాన్ని ఎలా అనువదించాలి
  choice: దేవుడు నమ్మదగినవాడై ఉన్నంత నిశ్చయంగా
  alternative: అయితే దేవుడు నమ్మదగినవాడు; మీకు మా మాట ‘అవును, కాదు’ అని ఉండదు
  rationale: పౌలు తన ప్రకటన సత్యమనే నిశ్చయానికి దేవుని విశ్వసనీయతను ఆధారంగా చూపుతున్న బలాన్ని ఇది సహజ తెలుగులో నిలుపుతుంది. అయినా, మూలంలోని δέ మరియు ὅτιలను మరింత రూపానుగుణంగా చదివే అవకాశం ఉన్నందున దాన్ని పాదసూచికలో సూచించాం.
- issue: ‘అవును, కాదు’ అనే జంట యొక్క భావాన్ని స్పష్టీకరించాలా
  choice: మూలంలోని జంట పదాలను వివరణ లేకుండా నిలుపడం
  alternative: ‘ఒకసారి అవునని, మరొకసారి కాదని’
  rationale: వివరణాత్మక ప్రత్యామ్నాయం తటపటాయింపు భావాన్ని బలపరుస్తుంది గాని, మూలపాఠంలో ఉన్న సంక్షిప్తతను మరియు తరువాతి వచనాలతో ఏర్పడే వాక్చాతుర్య సంబంధాన్ని ముందుగానే పరిష్కరిస్తుంది. అందువల్ల నిజమైన భావ ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ప్రమాణబద్ధ నిశ్చయ ప్రకటనను సహజంగా వ్యక్తం చేస్తూనే, మూల నిర్మాణానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో భద్రపరిచాం.
