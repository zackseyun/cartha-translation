id: 2CO.1.5
reference: 2 Corinthians 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: te
  text: ఎందుకంటే, క్రీస్తు శ్రమలు[a][b] మనకు ఏ విధంగా పొంగిపొర్లుతున్నాయో, అలాగే క్రీస్తు ద్వారా మన ఆదరణ కూడా పొంగిపొర్లుతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు కోసం అనుభవించే శ్రమలు.” గ్రీకు పదబంధం క్రీస్తుకు చెందిన శ్రమలను గానీ, ఆయన నిమిత్తం అనుభవించే శ్రమలను గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ “క్రీస్తు” అనే పదాన్ని బిరుదు భావం ప్రధానంగా ఉన్నప్పుడు “మెస్సీయ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి వివరణాత్మక కారణాన్ని పరిచయం చేస్తుంది; గ్రీకు పదంలోని కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: καθὼς ... οὕτως
  choice: ఏ విధంగా ... అలాగే
  rationale: మూలంలోని పరస్పర సంబంధమున్న పోలిక నిర్మాణాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: περισσεύει
  choice: పొంగిపొర్లుతున్నాయి / పొంగిపొర్లుతోంది
  rationale: సమృద్ధిగా ఉండడమే కాక మితిమీరి ప్రవహించే భావాన్ని కూడా వ్యక్తం చేస్తుంది; వాక్యంలో రెండుసార్లు వచ్చిన ఒకే గ్రీకు క్రియకు ఒకే రూపకాన్ని కొనసాగిస్తుంది.
- source_word: τὰ παθήματα
  choice: శ్రమలు
  rationale: బాధలు, కష్టానుభవాలు అనే భావాన్ని సహజమైన బైబిలు తెలుగులో సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ Χριστοῦ
  choice: క్రీస్తు
  rationale: సంబంధాన్ని అతిగా నిర్ధారించకుండా గ్రీకు షష్ఠీ విభక్తిలోని ‘క్రీస్తుకు చెందిన’ భావాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; ‘క్రీస్తు కోసం అనుభవించే’ అర్థసాధ్యతను పాదటిప్పణిలో ఇస్తుంది.
- source_word: εἰς ἡμᾶς
  choice: మనకు
  rationale: శ్రమలు పౌలు మరియు అతని సహచరులకు వచ్చి వారు వాటిని అనుభవిస్తున్నారనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: διὰ τοῦ Χριστοῦ
  choice: క్రీస్తు ద్వారా
  rationale: διά తో కూడిన షష్ఠీ విభక్తి తెలిపే మధ్యవర్తిత్వాన్ని నేరుగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ παράκλησις ἡμῶν
  choice: మన ఆదరణ
  rationale: సందర్భంలో శ్రమలకు ఎదురుగా నిలిచే ఓదార్పు, బలపరచడం అనే παράκλησις భావాన్ని ‘ఆదరణ’ సహజంగా అందిస్తుంది; స్వామ్యసంబంధాన్ని విస్తరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘క్రీస్తు శ్రమలు’ (τὰ παθήματα τοῦ Χριστοῦ) అనే పదబంధం యొక్క సంబంధం
  choice: క్రీస్తుకు చెందిన శ్రమలలో ఆయన ప్రజలు పాలుపంచుకోవడం అనే అర్థాన్ని అనుమతిస్తూ, ప్రధాన పాఠంలో ‘క్రీస్తు శ్రమలు’ అని సంబంధాన్ని తెరిచి ఉంచడం
  alternative: క్రీస్తు కోసం అనుభవించే శ్రమలు; లేదా క్రీస్తు స్వయంగా అనుభవించిన శ్రమలు ఇప్పుడు ఆయన ప్రజలలో విస్తరించడం
  rationale: గ్రీకు షష్ఠీ విభక్తి ఈ భావ ఛాయలలో ఒక్కదానినే తప్పనిసరిగా నిర్ధారించదు. అందువల్ల ప్రధాన పాఠం ఆ ఉద్రిక్తతను నిలుపుతుంది; ముఖ్యమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘పొంగిపొర్లుతోంది’ అనే రూపకం మూలంలోని పునరుక్త సమృద్ధి భావాన్ని కాపాడుతుంది. ‘క్రీస్తు శ్రమలు’ అనే సంక్షిప్త నిర్మాణం ఉద్దేశపూర్వకంగా అస్పష్టతను నిలుపుతుంది.
