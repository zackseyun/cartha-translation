  source_fidelity: The Telugu accurately preserves the causal connector (ὅτι), the correlative comparison (καθὼς ... οὕτως), the repeated overflow imagery (περισσεύει), and the mediated sense of διὰ τοῦ Χριστοῦ. “క్రీస్తు శ్రమలు” appropriately leaves the genitive τοῦ Χριστοῦ open rather than selecting one disputed nuance. “మనకు” is an idiomatic and adequately faithful rendering of εἰς ἡμᾶς in this context.
