  rationale: '‘యేసు మెస్సీయకు దేవుడును తండ్రియునై’ అని మార్చడం ద్వారా τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ యొక్క సంబంధం స్పష్టమవుతుంది: దేవుడే యేసు మెస్సీయకు దేవుడును తండ్రియును. మిగిలిన సమాంతర విశేషణాలు—కనికరాల తండ్రి, సమస్త ఆదరణకు దేవుడు—మూలంలోని ఒకే దేవునికి వర్తించే నిర్మాణాన్ని నిలుపుతాయి.'
