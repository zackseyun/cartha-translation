reference: 2 Corinthians 1:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: te
  text: మన ప్రభువైన యేసు మెస్సీయకు దేవుడును తండ్రియునై, కనికరాల తండ్రియు సమస్త ఆదరణకు దేవుడునైన దేవుడు స్తుతించబడునుగాక![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యేసు క్రీస్తు’ అని కూడా అనువదించవచ్చు.
    reason: Χριστόςను సంప్రదాయ నామ-బిరుదు రూపంగా అనువదించే ప్రత్యామ్నాయం.
  - marker: b
    text: ‘ఆదరణ’కు బదులు సందర్భానుసారం ‘ఓదార్పు’ లేదా ‘ప్రోత్సాహం’ అని కూడా అనువదించవచ్చు.
    reason: παράκλησις అనే పదానికి ఓదార్పు, ధైర్యపరచడం, ప్రోత్సాహం అనే అర్థపరిధి ఉంది.
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: స్తుతించబడునుగాక
  rationale: దైవాన్ని ఉద్దేశించిన స్తుతి సూత్రంలో ఈ విశేషణం దేవుడు స్తుతికి పాత్రుడని ప్రకటిస్తుంది; ఆధునిక తెలుగు ఆరాధనా భాషలో ఈ రూపం సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: దేవుడూ తండ్రీ
  rationale: ఒకే గ్రీకు నిర్దిష్ట ఉపపదం ఈ జత నామాలను ఒకే వ్యక్తికి వర్తింపజేస్తుంది; తెలుగు సముచ్చయ నిర్మాణం ఆ ఏకసూచనను నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: క్రొత్త నిబంధనలో యేసుకు వర్తించే κύριος అనే గౌరవ, అధికార సూచక బిరుదుకు సహజమైన ప్రామాణిక తెలుగు రూపం.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός యొక్క అభిషిక్తుడు అనే బిరుదు భావాన్ని కేవలం లిప్యంతరీకరణ చేయకుండా స్పష్టంగా నిలుపుతుంది.
- source_word: οἰκτιρμῶν
  choice: కనికరాలు
  rationale: గ్రీకు బహువచనాన్ని నిలుపుతూ, దేవుని విస్తారమైన దయానుభూతులను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάσης παρακλήσεως
  choice: సమస్త ఆదరణ
  rationale: πάσης యొక్క సమగ్రతను ‘సమస్త’ నిలుపుతుంది; శ్రమల సందర్భంలో παράκλησις సూచించే ఓదార్పు, ధైర్యపరచడం, తోడ్పాటు అనే పరిధికి ‘ఆదరణ’ విస్తృతంగా సరిపోతుంది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ లో Χριστός యొక్క బిరుదు భావం
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: ఈ నిర్మాణంలో సంప్రదాయ నామరూపం సాధ్యమైనప్పటికీ, మూలంలోని ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు భావాన్ని ప్రత్యక్షంగా ఉంచాం; తెలుగులో ‘యేసు మెస్సీయ’ సహజంగా బిరుదును సూచిస్తుంది.
- issue: ὁ θεὸς καὶ πατὴρ యొక్క సంబంధం
  choice: ఒకే వ్యక్తిని సూచించే ‘దేవుడూ తండ్రీ’
  alternative: ‘దేవుడు మరియు తండ్రి’ అని మరింత పదక్షరంగా విభజించడం
  rationale: ఒకే నిర్దిష్ట ఉపపదం మరియు సమన్విత నామాలు రెండూ మన ప్రభువైన యేసు మెస్సీయతో సంబంధమున్న ఒకే వ్యక్తిని సూచిస్తున్నాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన స్తుతి శైలిని వాడాం. ‘స్తుతించబడునుగాక’ దోక్సాలజీ స్వరాన్ని నిలుపుతుంది; మిగతా పదబంధాలను సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంచాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
