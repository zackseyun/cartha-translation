- from: దేవుని వాగ్దానాలు ఎన్నున్నా, ఆయనలోనే “అవును” ఉంది.[a] అందువల్ల, మన ద్వారా దేవునికి మహిమ కలిగేలా, “ఆమేన్” కూడా ఆయన ద్వారానే పలుకబడుతుంది.[b][c]
