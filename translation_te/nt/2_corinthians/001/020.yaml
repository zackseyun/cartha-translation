id: 2CO.1.20
reference: 2 Corinthians 1:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: te
  text: దేవుని వాగ్దానాలు ఎన్నున్నా, ఆయనలో “అవును” ఉంది.[a] అందువల్ల, ఆయన ద్వారా దేవునికి “ఆమేన్” కూడా మన ద్వారా మహిమ కోసం పలుకబడుతుంది.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత స్పష్టంగా: “ఆయనలో వాటికి ‘అవును’ లభిస్తుంది.”'
    reason: alternative_reading
  - marker: b
    text: “ఆమేన్” అనేది “నిజమే,” “అలాగే జరగాలి” వంటి సమ్మతి భావాన్ని తెలిపే లిప్యంతరీకృత పదం.
    reason: cultural_note
  - marker: c
    text: 'లేదా: “మన ద్వారా దేవుని మహిమ కోసం,” అని πρὸς δόξαν అనే మాటను దేవుని మహిమను మరింత ప్రత్యక్షంగా సూచించేదిగా అర్థం చేసుకోవచ్చు.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: ఎన్నున్నా
  rationale: దేవుని వాగ్దానాలన్నిటినీ మినహాయింపు లేకుండా సూచించే అనిర్దిష్ట సంపూర్ణతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπαγγελίαι θεοῦ
  choice: దేవుని వాగ్దానాలు
  rationale: వాగ్దానాలు దేవునివని తెలిపే గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని స్పష్టంగా, సాధారణంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలోనే
  rationale: క్రీస్తును కేంద్రంగా ఉంచే సంక్షిప్త గ్రీకు వ్యక్తీకరణను కాపాడుతుంది; ‘నెరవేరాయి’ అనే వివరణాత్మక క్రియను ప్రధాన పాఠ్యంలో చేర్చదు. ‘నే’ ఉద్ఘాటనను సహజంగా తెలియజేస్తుంది.
- source_word: τὸ Ναί
  choice: “అవును”
  rationale: పౌలు ఉపయోగించిన ఉద్ఘాటిత సమ్మతి పదాన్ని నామవాచకసదృశంగా ఉల్లేఖన చిహ్నాల్లో నిలుపుతుంది.
- source_word: διὸ καὶ δι’ αὐτοῦ
  choice: అందువల్ల ... కూడా ఆయన ద్వారానే
  rationale: ముందటి వాక్యభాగం నుంచి వచ్చే నిర్ధారణను, అలాగే క్రీస్తు మధ్యవర్తిత్వంపై ఉన్న ఉద్ఘాటనను కాపాడుతుంది.
- source_word: τὸ Ἀμὴν
  choice: “ఆమేన్”
  rationale: తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన లిప్యంతరీకరణను నిలుపుతూ, ‘అవును’తో ఉన్న వాక్చాతుర్య సమాంతరాన్ని కాపాడుతుంది.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: ‘ఆమేన్’ ఎవరికి ఉద్దేశించబడిందో తెలిపే గ్రీకు చతుర్థీ విభక్తిని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: πρὸς δόξαν
  choice: మహిమ కలిగేలా
  rationale: మహిమను లక్ష్యంగా చూపే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఎవరి మహిమ అన్నది సందర్భానుసారంగా దేవునితో అనుసంధానమవుతుంది.
- source_word: δι’ ἡμῶν
  choice: మన ద్వారా
  rationale: పౌలు మాటల విస్తృతతను నిలుపుతుంది; ‘మా పరిచర్య ద్వారా’ వంటి వివరణను చేర్చదు.
theological_decisions:
- issue: క్రీస్తులో దేవుని వాగ్దానాలు నెరవేరుతాయనే భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా విస్తరించాలా
  choice: “ఆయనలోనే ‘అవును’ ఉంది” అనే సంక్షిప్త రూపాన్ని నిలుపడం
  alternative: “ఆయనలోనే అవన్నీ నెరవేరాయి” లేదా “ఆయనలోనే వాటికి ‘అవును’ లభించింది”
  rationale: నెరవేర్పు భావం బలంగా సూచించబడినా, గ్రీకు వాక్యం సంక్షిప్తంగా మరియు వాక్చాతుర్యంతో ఉంది. దాని భావ ఉద్రిక్తతను వివరణతో తొలగించకుండా కాపాడటం మూలానికి దగ్గరగా ఉంటుంది.
- issue: ἐν αὐτῷ మరియు δι’ αὐτοῦ మధ్య తేడాను నిలుపాలా
  choice: మొదటిది “ఆయనలోనే,” రెండవది “ఆయన ద్వారానే”గా అనువదించడం
  alternative: రెండింటినీ ఒకే విధంగా “ఆయనలో” లేదా “ఆయన ద్వారా”గా సమీకరించడం
  rationale: వాగ్దానాల ‘అవును’ క్రీస్తులో ఉండటం, ‘ఆమేన్’ క్రీస్తు ద్వారా దేవునికి చేరడం అనే గ్రీకు భేదాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్తతను సాధ్యమైనంతవరకు నిలుపుతూ, రెండవ భాగం తెలుగులో సహజంగా ఉండేందుకు ‘పలుకబడుతుంది’ అనే సూచిత క్రియను ఉపయోగించాం. “అవును,” “ఆమేన్” మధ్య వాక్చాతుర్య సమాంతరాన్ని ఉల్లేఖన చిహ్నాలతో చూపించాం.
