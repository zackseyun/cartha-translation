id: 2CO.1.10
reference: 2 Corinthians 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: te
  text: ఆయన అంతటి మరణం నుండి మమ్మల్ని రక్షించాడు; ఇంకా రక్షిస్తాడు.[a] ఆయన ఇంకా రక్షిస్తాడని, ఆయనపైనే మేము నిరీక్షణ ఉంచాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అంతటి ప్రాణాంతక ప్రమాదం నుండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τηλικούτου
  choice: అంత ఘోరమైన
  rationale: ఈ నిర్దేశక విశేషణం ప్రమాద తీవ్రతను నొక్కిచెబుతుంది. ‘అంత ఘోరమైన’ అనేది ఆ బలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: θανάτου
  choice: మరణం
  rationale: మూలపదానికి ప్రత్యక్ష అర్థం ‘మరణం.’ సందర్భంలో ఇది ప్రాణాంతక ప్రమాదాన్ని సూచించవచ్చుగానీ, ప్రధాన పాఠంలో మూలంలోని రూపకాన్ని నిలిపి ఉంచాం.
- source_word: ἐρρύσατο
  choice: రక్షించాడు
  rationale: ప్రమాదం నుండి విడిపించడాన్ని ఈ క్రియ సూచిస్తుంది. ‘రక్షించాడు’ సహజంగా ఉండి పూర్తయిన గత చర్యను తెలియజేస్తుంది.
- source_word: ῥύσεται
  choice: రక్షిస్తాడు
  rationale: అదే గ్రీకు క్రియకు పదసామ్యాన్ని నిలిపి, భవిష్యత్ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰς ὃν
  choice: ఆయన మీదే
  rationale: ఇక్కడ εἰς నిరీక్షణకు ఆధారమైన వ్యక్తిని సూచిస్తుంది. ‘ఆయన మీదే’ తెలుగులో సహజంగా ఉండి వ్యక్తిగత ఆధారాన్ని స్పష్టం చేస్తుంది.
- source_word: ἠλπίκαμεν
  choice: మేము నిరీక్షణ ఉంచాము
  rationale: పరిపూర్ణ కాలరూపం గతంలో ఉంచిన, ఇప్పటికీ కొనసాగుతున్న స్థిర నిరీక్షణను సూచిస్తుంది; ఈ తెలుగు నిర్మాణం సందర్భంలో ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: καὶ ἔτι
  choice: మళ్లీ
  rationale: ఈ కలయిక కొనసాగింపుతో కూడిన భవిష్యత్ రక్షణను నొక్కిచెబుతుంది. ముందున్న ‘ఇకముందు కూడా’తో కలిసి ‘మళ్లీ’ ఆ కొనసాగింపు, పునరావృత భావాలను తెలియజేస్తుంది.
theological_decisions:
- issue: θάνατος ను ప్రధాన పాఠంలో అక్షరార్థంగా ‘మరణం’ అని ఉంచాలా, లేక ‘ప్రాణాంతక ప్రమాదం’ అని వ్యాఖ్యానాత్మకంగా అనువదించాలా
  choice: ప్రధాన పాఠంలో ‘మరణం’ అని ఉంచడం
  alternative: ‘ప్రాణాంతక ప్రమాదం’ అని అనువదించడం
  rationale: గ్రీకు పాఠం స్పష్టంగా ‘మరణం’ అంటుంది. పౌలు ఉపయోగించిన బలమైన వ్యక్తీకరణను ప్రధాన పాఠంలో నిలిపి, సందర్భానుసార భావాన్ని పాదటిప్పణిలో ఇవ్వడం మూలభాష ప్రాధాన్యానికి అనుగుణం.
- issue: రెండవ ῥύσεται తరువాతి వాక్యం మొదటి భవిష్యత్ ప్రకటనను పునరుద్ఘాటిస్తుందా లేదా మరో భవిష్యత్ రక్షణను సూచిస్తుందా
  choice: రక్షణ కొనసాగుతుందనే నమ్మకంతో కూడిన పునరుద్ఘాటనగా అనువదించడం
  alternative: విడివిడిగా జరిగే రెండు భవిష్యత్ రక్షణలను స్పష్టంగా సూచించడం
  rationale: καὶ ἔτι కొనసాగింపు లేదా మరల జరగడాన్ని సూచించగలదు. తెలుగు పాఠం ‘ఇకముందు కూడా’ మరియు ‘మళ్లీ’ ద్వారా ఈ రెండింటి మధ్య ఉన్న సహజమైన ఉద్వేగాన్ని పూర్తిగా పరిష్కరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘రక్షించాడు/రక్షిస్తాడు’ అనే పునరావృతం మూలంలోని ఒకే క్రియ పదసామ్యాన్ని నిలుపుతుంది. [a] గుర్తు ప్రధాన పాఠంలో సంబంధిత వాక్యం వెంట ఉంచబడింది.
