id: 2CO.1.21
reference: 2 Corinthians 1:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: te
  text: అయితే మీతోపాటు మమ్మల్ని మెస్సీయలో స్థిరపరుస్తూ, మమ్మల్ని అభిషేకించినవాడు దేవుడే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తులో.” గ్రీకు బిరుదు క్రిస్టోస్‌ను ఇక్కడ “మెస్సీయ” అని అనువదించాం.
    reason: alternative_reading
lexical_decisions:
- source_word: βεβαιῶν
  choice: స్థిరపరుస్తూ
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న క్రియాభావాన్ని నిలుపుతూ, దృఢంగా చేయడం లేదా స్థిరంగా ఉంచడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: σὺν ὑμῖν
  choice: మీతోపాటు మమ్మల్ని
  rationale: పౌలు సహా మాట్లాడుతున్నవారికి, కొరింథీయులకు కలిగిన ఉమ్మడి భాగస్వామ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰς Χριστόν
  choice: మెస్సీయలో
  rationale: εἰς అనే విభక్త్యర్థక పదానికి అక్షరార్థంగా ‘లోనికి’ అనే భావం ఉన్నప్పటికీ, ఇక్కడ మెస్సీయతో సంబంధం లేదా ఆయనలో స్థిరపడటాన్ని సూచించే పౌలు వాడుకకు ‘మెస్సీయలో’ సహజంగా సరిపోతుంది.
- source_word: χρίσας
  choice: అభిషేకించిన
  rationale: χρίω పదంలోని అభిషేక భావాన్ని నేరుగా నిలుపుతుంది; దానిని ఒక నిర్దిష్ట ఆచారానికి మాత్రమే పరిమితం చేయదు.
- source_word: θεός
  choice: దేవుడే
  rationale: గ్రీకు వాక్యాంతంలోని θεός మీదున్న ఉద్ఘాటనను తెలుగులో ‘దేవుడే’ సహజంగా ప్రతిబింబిస్తుంది.
- source_word: Χριστόν
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్నందున, దాని యూదీయ అభిషిక్తుని భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది.
theological_decisions:
- issue: εἰς Χριστόν లో εἰς యొక్క భావం
  choice: సంబంధం లేదా ఐక్యతను సూచించే ‘మెస్సీయలో’
  alternative: మరింత అక్షరార్థమైన ‘మెస్సీయలోనికి’; సంప్రదాయ రూపమైన ‘క్రీస్తులో’
  rationale: ‘లోనికి’ గ్రీకు రూపానికి దగ్గరైనా తెలుగులో ఈ సందర్భంలో అసహజంగా ఉండి, ఉద్దేశించిన సంబంధ భావాన్ని మసకబార్చవచ్చు. ‘మెస్సీయలో’ భావాన్ని సహజంగా అందిస్తూనే, ఐక్యత స్వరూపాన్ని మరీ నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరతను నిలుపుతూ రూపొందించబడింది. గ్రీకు వాక్యంలోని రెండు కృదంతాల సంబంధాన్ని తెలుగు క్రియారూపాలతో కాపాడి, వాక్యాంత ఉద్ఘాటనను ‘దేవుడే’తో వ్యక్తం చేశాం.
