id: 2CO.1.7
reference: 2 Corinthians 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: te
  text: మిమ్మల్ని గూర్చిన మా నిరీక్షణ దృఢంగా ఉంది. ఎందుకంటే, మీరు శ్రమల్లో పాలివారై ఉన్నట్లే, ఆదరణలో[a] కూడా పాలివారై ఉన్నారని మాకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ఆదరణ” అనే పదానికి “ప్రోత్సాహం” లేదా “ఓదార్పు” అని కూడా అనువదించవచ్చు (παράκλησις).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: నిరీక్షణ
  rationale: ఎదురుచూపుతో కూడిన నమ్మకాన్ని తెలిపే ప్రామాణికమైన, సహజమైన తెలుగు పదం.
- source_word: βεβαία
  choice: స్థిరంగా
  rationale: పౌలు నిరీక్షణ దృఢమైనదని, నమ్మదగినదని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὑπὲρ ὑμῶν
  choice: మీ విషయంలో
  rationale: ఇక్కడ ὑπέρ కొరింథీయులను గురించిన సంబంధాన్ని సూచిస్తుంది; ‘మీ విషయంలో’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: εἰδότες
  choice: ఎందుకంటే ... మాకు తెలుసు
  rationale: కృదంతం పౌలు నిరీక్షణకు కారణాన్ని ఇస్తోంది; కారణార్థక సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὡς ... οὕτως καί
  choice: '... ఉన్నట్లే, ... కూడా'
  rationale: గ్రీకు పరస్పర సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు వాక్యరూపంలో నిలుపుతుంది.
- source_word: κοινωνοί
  choice: పాలివారై
  rationale: కేవలం అనుభవించడం కాక, వాటిలో భాగస్వాములుగా ఉండే భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: παθημάτων
  choice: శ్రమల్లో
  rationale: ఈ సందర్భంలోని బాధలు, కష్టాలు అనే విస్తృత భావాన్ని తెలిపే సహజమైన బైబిలు తెలుగు పదం.
- source_word: παρακλήσεως
  choice: ఆదరణలో
  rationale: 2 కొరింథీయులు 1లో పదేపదే వచ్చే ఓదార్పు, ధైర్యప్రదానం అనే భావ పరిధిని ‘ఆదరణ’ గౌరవప్రదంగా, సహజంగా అందిస్తుంది.
- source_word: '[elliptical second clause]'
  choice: కూడా పాలివారై ఉన్నారని
  rationale: గ్రీకులో రెండో భాగంలో క్రియాభావం పునరుక్తం కాలేదు; తెలుగులో అర్థస్పష్టత కోసం మొదటి భాగంలోని భాగస్వామ్య భావాన్ని సహజంగా పూరిస్తుంది.
