translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. గ్రీకు వాక్యంలోని ‘ఉన్నట్లే ... కూడా’ అనే సమాంతర నిర్మాణాన్ని, శ్రమలు మరియు ఆదరణ రెండింటిలోనూ భాగస్వామ్యం అనే భావాన్ని నిలిపాం.
