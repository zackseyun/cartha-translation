id: 2CO.1.11
reference: 2 Corinthians 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: te
  text: మీరు కూడా విన్నప ప్రార్థన ద్వారా మా కొరకు మాతో కలిసి సహాయం చేస్తూ ఉన్నారు; అలా, అనేకుల నుండి మా కొరకు కృతజ్ఞతలు చెల్లించబడేలా, అనేకమంది ద్వారా మాకు లభించిన కృపావరం[c] నిమిత్తం ప్రార్థిస్తున్నారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అనేకమంది ద్వారా మా కొరకు కృతజ్ఞతలు చెల్లించబడేలా, మాకు లభించిన కృపావరం నిమిత్తం.” గ్రీకు వాక్యంలో “అనేకులు” అనే భావం రెండుసార్లు వస్తుంది; రెండవది కృపావరం లభించడానికా లేక కృతజ్ఞతలు చెల్లించబడడానికా అన్వయించాలో స్పష్టంగా లేదు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “అనేక ముఖాల నుండి”; ఇక్కడ “ముఖాలు” అంటే వ్యక్తులు.
    reason: lexical_alternative
  - marker: c
    text: “కృపావరం” అనే పదాన్ని “కృపతో అనుగ్రహించిన వరం,” “ఆశీర్వాదం,” లేదా “మాకు చూపిన అనుగ్రహం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνυπουργούντων
  choice: తోడుగా సహాయం చేస్తున్నారు
  rationale: συν- ఉపసర్గలోని కలిసి సహాయం చేసే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఇది ముందరి వాక్యంతో కొనసాగుతున్న భాగవాక్య భావాన్ని కూడా నిలుపుతుంది.
- source_word: τῇ δεήσει
  choice: విన్నప ప్రార్థన చేస్తూ
  rationale: δέησις సాధారణ ప్రార్థనకన్నా ప్రత్యేకమైన, హృదయపూర్వక విన్నపాన్ని సూచిస్తుంది. ‘విన్నప ప్రార్థన’ ఆ నుడికారాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἵνα
  choice: అలా … చెల్లిస్తారు
  rationale: ἵνα తెలిపే ఉద్దేశం లేదా ఫలిత సంబంధాన్ని తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: ἐκ πολλῶν προσώπων
  choice: అనేకమంది
  rationale: πρόσωπον అక్షరార్థంగా ‘ముఖం’ అయినా, ఇక్కడ వ్యక్తులను సూచించే నుడికారం. అందువల్ల ‘అనేకమంది’ సహజమైన అర్థానువాదం.
- source_word: χάρισμα
  choice: కృపావరం
  rationale: χάρισμαలో దేవుని కృపచేత అనుగ్రహించబడిన వరం అనే భావం ఉంది. ‘కృపావరం’ వరం మరియు కృప అనే రెండు అంశాలను నిలుపుతుంది.
- source_word: διὰ πολλῶν
  choice: అనేకమంది చేసిన ప్రార్థనల ద్వారా
  rationale: సందర్భంలో అనేకమంది చేసిన విన్నపాల ద్వారా లభించిన అనుగ్రహాన్ని సూచించవచ్చు. ‘ప్రార్థనల’ అనే పదం గ్రీకులో స్పష్టంగా పునరుక్తం కాలేదని, ఇతర అన్వయాలు సాధ్యమని పాదటిప్పణిలో తెలియజేశారు.
- source_word: εὐχαριστηθῇ
  choice: కృతజ్ఞతలు చెల్లిస్తారు
  rationale: గ్రీకు కర్మణి రూపంలోని కృతజ్ఞత అర్పణ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπὲρ ἡμῶν
  choice: మా తరఫున
  rationale: ప్రార్థన మరియు కృతజ్ఞత సందర్భంలో ὑπέρ తెలిపే ‘మా పక్షాన/మా నిమిత్తం’ అనే భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: διὰ πολλῶν అనే పదబంధం దేనితో అన్వయించాలి?
  choice: అనేకమంది చేసిన ప్రార్థనల ద్వారా కృపావరం మాకు లభించిందని ప్రధాన పాఠంలో అన్వయించడం
  alternative: అనేకమంది ద్వారా కృతజ్ఞతలు చెల్లించబడతాయని అన్వయించడం
  rationale: గ్రీకు వాక్య నిర్మాణం సంక్షిప్తంగా ఉండి రెండు అన్వయాలకు అవకాశం ఇస్తుంది. సమీప ప్రార్థనా సందర్భం ప్రధాన పాఠంలోని అన్వయానికి మద్దతిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రార్థన మరియు కృపకు సంబంధించిన గౌరవప్రదమైన బైబిలు నుడికారాన్ని నిలిపాం. ఈ వచనం ముందరి వాక్యంపై ఆధారపడే గ్రీకు భాగవాక్యంతో మొదలవుతున్నందున, తెలుగులో చదవడానికి సహజంగా పూర్తి వాక్యంగా మలిచాం.
