- from: కాబట్టి నేను ఇలా ఉద్దేశించినప్పుడు, చంచలంగా ప్రవర్తించానా?[a] లేక నేను ఉద్దేశించేవాటిని శరీరానుసారంగా ఉద్దేశిస్తున్నానా,[b] నా దగ్గర “అవును, అవును” అనేదీ “కాదు, కాదు” అనేదీ రెండూ ఉండేలా?[c]
  to: కాబట్టి నేను ఇలా ఉద్దేశించినప్పుడు, చంచలంగా ప్రవర్తించానా?[a] లేక నేను ఏది నిర్ణయించుకుంటానో, దానిని శరీరానుసారంగా నిర్ణయించుకుంటానా,[b] దాని ఫలితంగా నా విషయంలో “అవును, అవును” అనేదీ “కాదు, కాదు” అనేదీ రెండూ ఉండేలా?[c]
  rationale: The revision corrects two Telugu idiomatic issues while preserving the Greek syntax and ambiguity. “నా విషయంలో” is a natural equivalent for the characteristic/conduct sense of παρ’ ἐμοὶ. The revised deliberation clause retains the emphatic verbal recurrence of ἃ βουλεύομαι ... βουλεύομαι in intelligible modern Telugu. “దాని ఫలితంగా” makes the ἵνα result/purpose connection explicit without resolving the precise nature of the implied inconsistency.
