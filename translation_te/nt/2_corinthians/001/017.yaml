source:
  edition: SBLGNT
  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: te
  text: కాబట్టి నేను ఇలా ఉద్దేశించినప్పుడు, చంచలంగా ప్రవర్తించానా?[a] లేక నేను ఏది నిర్ణయించుకుంటానో, దానిని శరీరానుసారంగా నిర్ణయించుకుంటానా,[b] దాని ఫలితంగా నా విషయంలో “అవును, అవును” అనేదీ “కాదు, కాదు” అనేదీ రెండూ ఉండేలా?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తేలికబుద్ధితో ప్రవర్తించానా?”
    reason: lexical_alternative
  - marker: b
    text: “శరీరానుసారంగా” అంటే ఇక్కడ కేవలం మానవ లేదా లోకసంబంధమైన ప్రమాణాల ప్రకారం అని అర్థం కావచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అంటే, “అవును” అనేదీ “కాదు” అనేదీ రెండూ ఒకేసారి నిలిచేలా మాట్లాడడం.
    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: ఉద్దేశించినప్పుడు
  rationale: ముందు ప్రస్తావించిన పౌలు ప్రయాణ ఉద్దేశాన్ని సూచిస్తూ, నిర్ణయం లేదా ప్రణాళిక అనే భావాన్ని అతిగా నిర్దిష్టం చేయకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: చంచలంగా ప్రవర్తించానా
  rationale: ఈ గ్రీకు ప్రయోగం ఉద్దేశంలో తేలికత లేదా నిలకడలేమితో ప్రవర్తించడాన్ని సూచిస్తుంది. తెలుగులో ‘చంచలంగా’ అనేది ఇక్కడ ఆరోపించబడుతున్న మాటమార్పు భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: నేను ఉద్దేశించేవాటిని ... ఉద్దేశిస్తున్నానా
  rationale: గ్రీకులోని అలంకారాత్మక పునరుక్తిని తెలుగులోనూ నిలుపుతూ, ప్రణాళిక చేయడం లేదా నిర్ణయించుకోవడం అనే భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: κατὰ σάρκα
  choice: శరీరానుసారంగా
  rationale: పౌలు వాడే σάρξ అనే ప్రాముఖ్యమైన పదాన్ని ప్రధాన పాఠంలో నిలుపుతుంది; కేవలం మానవ లేదా లోక సంబంధ ప్రమాణాల ప్రకారం అనే సందర్భార్థాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: παρ’ ἐμοὶ
  choice: నా దగ్గర
  rationale: ఏదో ఒక ధోరణి పౌలులో లేదా అతని వ్యవహారంలో కనిపించడాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: “అవును, అవును” అనేదీ “కాదు, కాదు” అనేదీ రెండూ
  rationale: గ్రీకు మూలంలోని పునరుక్తిని కాపాడి, పరస్పర విరుద్ధమైన మాటలు ఒకే వ్యక్తి దగ్గర ఉండడమనే ఆరోపణను స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: κατὰ σάρκα లోని σάρξ పదం
  choice: శరీరానుసారంగా
  alternative: కేవలం మానవ ప్రమాణాల ప్రకారం; లోకరీతిగా
  rationale: ఈ సందర్భంలో పదం రూపకాలంకారంగా ఉన్నా, దానిని పూర్తిగా వ్యాఖ్యానించి ఒకే అర్థానికి పరిమితం చేయకుండా పౌలు వాడుకలోని వేదాంతపరమైన పదస్వరూపాన్ని నిలుపుతుంది.
- issue: “అవును, అవును” మరియు “కాదు, కాదు” మధ్య సంబంధం
  choice: రెండూ నా దగ్గర ఉండేలా
  alternative: ఒకేసారి ‘అవును’ అనీ ‘కాదు’ అనీ చెప్పేలా
  rationale: మూలపాఠంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడుతుంది; ఇది మాటమార్పు, ద్వంద్వవైఖరి, లేదా విరుద్ధ హామీలను సూచించవచ్చని పాఠకుడు గ్రహించేందుకు వీలు ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; పౌలు ప్రశ్నలోని సవాలు చేసే స్వరాన్ని, గ్రీకు పునరుక్తిని, σάρξ పదంలోని వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన భాష వాడబడింది.
