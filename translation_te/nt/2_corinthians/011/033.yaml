id: 2CO.11.33
reference: 2 Corinthians 11:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ διὰ θυρίδος ἐν σαργάνῃ ἐχαλάσθην διὰ τοῦ τείχους καὶ ἐξέφυγον τὰς χεῖρας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/033.yaml
  text: and through a window in a basket I was lowered through the wall and escaped his hands[a].
translation:
  language: te
  text: గోడలోని ఒక కిటికీ గుండా, ఒక బుట్టలో నన్ను కిందికి దించారు; అలా నేను అతని చేతులనుండి తప్పించుకున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తాళ్లతో అల్లిన బుట్టలో గోడలోని ఒక కిటికీ గుండా నన్ను కిందికి దించారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: θυρίδος
  choice: కిటికీ
  rationale: θυρίς అంటే కిటికీ లేదా చిన్న తెరువు. ఈ సందర్భంలో గోడలో మనిషిని దింపగల తెరువును సహజంగా సూచించడానికి ‘కిటికీ’ స్పష్టమైన ఆధునిక తెలుగు పదం.
- source_word: σαργάνῃ
  choice: బుట్ట
  rationale: σαργάνη అల్లిన తాడు లేదా పేముతో చేసిన పాత్రను సూచిస్తుంది. ప్రధాన పాఠ్యంలో ‘బుట్ట’ సహజంగా ఉంటుంది; నిర్మాణ పదార్థానికి సంబంధించిన సూక్ష్మార్థం పాదసూచికలో ఉంచబడింది.
- source_word: ἐχαλάσθην
  choice: నన్ను కిందికి దించారు
  rationale: χαλάω యొక్క కర్మణి రూపం ఇక్కడ తాడు వంటి సాధనంతో కిందికి దింపబడటాన్ని సూచిస్తుంది. తెలుగు కర్తరహిత కర్మణి భావాన్ని సహజంగా తెలియజేయడానికి ఈ నిర్మాణం వాడబడింది.
- source_word: διὰ τοῦ τείχους
  choice: గోడలోని ... గుండా
  rationale: ఈ పదబంధం గోడలో ఉన్న తెరువు ద్వారా వెళ్లడాన్ని సూచిస్తుంది. గ్రీకులో ‘పట్టణపు’ అని స్పష్టంగా లేనందున దాన్ని చేర్చలేదు.
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: అతని చేతులనుండి తప్పించుకున్నాను
  rationale: ‘చేతులనుండి తప్పించుకోవడం’ అనే రూపం గ్రీకు నుడికారంలోని పట్టుకు లేదా అధికారానికి చిక్కకుండా బయటపడే సజీవ భావాన్ని తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి పాటించబడింది. సంఘటనల క్రమాన్ని స్పష్టంగా చూపేందుకు అర్ధవిరామ చిహ్నం మరియు ‘అలా’ వాడబడ్డాయి; మూలంలో లేని ‘పట్టణపు’ అనే విశేషణం చేర్చబడలేదు.
