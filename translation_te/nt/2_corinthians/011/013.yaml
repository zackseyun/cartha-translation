id: 2CO.11.13
reference: 2 Corinthians 11:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: te
  text: ఎందుకంటే అలాంటివారు అబద్ధ అపొస్తలులు, మోసపూరిత పనివారు; మెస్సీయ[a] అపొస్తలులుగా వేషం వేసుకుంటున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు అపొస్తలులు.” గ్రీకు బిరుదైన Χριστόςను పేరు వలె వాడినప్పుడు “క్రీస్తు” అని కూడా అనువదించవచ్చు; ఇక్కడ బిరుదు భావాన్ని నిలుపడానికి “మెస్సీయ” అని అనువదించాం.
    reason: Χριστός అనే బిరుదుకు సందర్భానుసారంగా సాధ్యమైన, పరిచితమైన ప్రత్యామ్నాయ అనువాదాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు ఈ మాట వివరణ ఇస్తున్నదని స్పష్టంగా చూపించే సహజమైన తెలుగు అనుసంధాన పదం.
- source_word: τοιοῦτοι
  choice: అలాంటివారు
  rationale: ఇంతకుముందు వర్ణించిన నిర్దిష్టమైన వ్యక్తుల వర్గాన్ని సహజంగా సూచిస్తుంది; గ్రీకులోని బహువచన భావాన్ని నిలుపుతుంది.
- source_word: ψευδαπόστολοι
  choice: అబద్ధ అపొస్తలులు
  rationale: అపొస్తలులమని అబద్ధంగా చెప్పుకునేవారనే సమాసపద భావాన్ని స్పష్టంగా, సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἐργάται δόλιοι
  choice: మోసపూరిత పనివారు
  rationale: వారి పనితీరు మోసంతో కూడినదనే నైతిక బలాన్ని నిలుపుతూ, నామవాచక-విశేషణ నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: μετασχηματιζόμενοι
  choice: వేషం వేసుకుంటున్నారు
  rationale: అంతరంగ మార్పు కాకుండా, మోసపూర్వకంగా తమ బాహ్య గుర్తింపును మార్చుకొని చూపించుకోవడాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: మెస్సీయ అపొస్తలుల వేషం
  rationale: εἰς ఇక్కడ స్వీకరించిన పాత్ర లేదా గుర్తింపును సూచిస్తుంది. Χριστοῦలోని బిరుదు భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది.
theological_decisions:
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ἀποστόλους Χριστοῦ అనే సంబంధబోధక పదబంధంలో అభిషిక్తుడైన రాజు అనే బిరుదు భావం సజీవంగా ఉంది. అందువల్ల ‘మెస్సీయ’ మూలపద భావాన్ని నిలుపుతుంది; పరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: μετασχηματιζόμενοι యొక్క మార్పు స్వభావం
  choice: వేషం వేసుకుంటున్నారు
  alternative: తమను తాము మార్చుకుంటున్నారు
  rationale: ఈ సందర్భంలో పౌలు అంతరంగ పరివర్తనను కాక మోసపూర్వక స్వీయప్రదర్శనను ఖండిస్తున్నాడు; అందువల్ల ఆ ఉద్దేశాన్ని నిశ్శబ్దంగా సద్దుమణచకుండా స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సరళంగా, అయితే పత్రికా శైలికి తగిన గౌరవభరిత స్వరంతో ఉంది. ‘అపొస్తలులు,’ ‘మెస్సీయ’ వంటి స్థిరపడిన బైబిలు పదాలను ఉపయోగించాం.
