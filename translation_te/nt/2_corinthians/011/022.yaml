source:
  edition: SBLGNT
  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: te
  text: వారు హెబ్రీయులా? నేనూ అలాగే. వారు ఇశ్రాయేలీయులా? నేనూ అలాగే. వారు అబ్రాహాము సంతానమా?[a] నేనూ అలాగే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పదశః, ‘అబ్రాహాము విత్తనం.’ గ్రీకు మూలంలో సమూహాన్ని సూచించే ఏకవచన పదం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: హెబ్రీయులు
  rationale: యూదుల జాతి, భాషా-సాంస్కృతిక వారసత్వాన్ని సూచించే స్థిరమైన పదం; తరువాతి ‘ఇశ్రాయేలీయులు’ అనే పదంతో ఉన్న భేదాన్ని నిలుపుతుంది.
- source_word: κἀγώ
  choice: నేనూ
  rationale: καί + ἐγώ అనే సంక్షిప్త, నొక్కిచెప్పే జవాబును తెలుగులో సహజంగా, అదే సంక్షిప్తతతో వ్యక్తం చేస్తుంది.
- source_word: Ἰσραηλῖταί
  choice: ఇశ్రాయేలీయులు
  rationale: ఇశ్రాయేలు ప్రజలకు చెందినవారనే గుర్తింపును ఖచ్చితంగా తెలియజేస్తూ, ‘హెబ్రీయులు,’ ‘అబ్రాహాము సంతానం’ అనే ఇతర గుర్తింపులతో కలపకుండా ఉంచుతుంది.
- source_word: σπέρμα Ἀβραάμ
  choice: అబ్రాహాము సంతానం
  rationale: σπέρμα ఇక్కడ ఏకవచన రూపంలో ఉన్న సమూహార్థక పదం. ‘సంతానం’ ఆధునిక తెలుగులో సహజంగా ఉండి, అబ్రాహాము నుండి వచ్చిన వారందరినీ సమూహంగా సూచించగలదు.
- source_word: εἰσιν
  choice: వారు …లా?
  rationale: పునరావృతమైన సంధాన క్రియను తెలుగు ప్రశ్నార్థక నిర్మాణంలో సహజంగా అంతర్భాగం చేసి, మూలంలోని ప్రశ్న-జవాబు క్రమాన్ని నిలిపింది.
theological_decisions:
- issue: యూదు గుర్తింపును తెలిపే మూడు పదాల మధ్య సూక్ష్మ భేదం
  choice: ‘హెబ్రీయులు,’ ‘ఇశ్రాయేలీయులు,’ ‘అబ్రాహాము సంతానం’ అనే మూడు వేర్వేరు గుర్తింపులను నిలుపడం
  alternative: మూడింటినీ ‘యూదులు’ వంటి ఒకే పదంతో అనువదించడం
  rationale: పౌలు ఉద్దేశపూర్వకంగా ఒకదానితో ఒకటి ముడిపడినప్పటికీ వేర్వేరు కోణాలను తెలిపే మూడు గుర్తింపులను వరుసగా పేర్కొంటున్నాడు. వాటిని ఒకే పదంగా మార్చితే అతని వాదనలోని క్రమబద్ధమైన ఉద్ఘాటన కనుమరుగవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని వేగవంతమైన ప్రశ్న-జవాబు లయను, κἀγώ యొక్క సంక్షిప్త పునరావృతిని నిలుపడానికి ప్రతి ప్రశ్నకు ‘నేనూ’ అని ఇచ్చాం. ఆంగ్ల సంప్రదింపు పాఠంలో [a] గుర్తు మొదటి వాక్యం తరువాత కనిపించినప్పటికీ, దాని విషయం σπέρμα Ἀβραάμ గురించినది కాబట్టి సంబంధిత ‘అబ్రాహాము సంతానం’ వద్ద ఉంచాం.
