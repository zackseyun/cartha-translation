reference: 2 Corinthians 11:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λογίζομαι γὰρ μηδὲν ὑστερηκέναι τῶν ὑπερλίαν ἀποστόλων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/005.yaml
  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: te
  text: ఎందుకంటే, నేను ఆ అతిగొప్ప అపొస్తలులకంటే ఏమాత్రం తీసిపోలేదని భావిస్తున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అత్యంత ప్రముఖులైన అపొస్తలులు” అని. గ్రీకు పదబంధాన్ని వ్యంగ్యంగా (“అతిగొప్ప అపొస్తలులు”) లేదా ఎంతో గౌరవం పొందిన అపొస్తలులను సూటిగా సూచించేదిగా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: భావిస్తున్నాను
  rationale: ఆలోచించి ఒక అంచనాకు రావడం లేదా పరిగణించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి వివరణ లేదా ఆధారం అందించే పౌలు వాదనా ప్రవాహాన్ని స్పష్టంగా చూపిస్తుంది.
- source_word: μηδὲν
  choice: ఏమాత్రం
  rationale: ఇక్కడ ఇది క్రియావిశేషణ బలంతో ‘ఏ విధంగానూ కాదు’ అనే నొక్కిచెప్పే భావాన్ని ఇస్తుంది.
- source_word: ὑστερηκέναι
  choice: తీసిపోనని
  rationale: ఇతరులతో పోల్చినప్పుడు తక్కువగా లేదా లోపంగా ఉండడం అనే భావాన్ని సహజమైన తెలుగు ప్రయోగంతో వ్యక్తపరుస్తుంది.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: ఆ అతిగొప్ప అపొస్తలులకంటే
  rationale: ὑπερλίαν లోని ‘మితిమీరి గొప్ప’ అనే బలాన్ని నిలుపుతూ, సందర్భంలో ఉండగల వ్యంగ్యాన్ని సూచిస్తుంది; అదే సమయంలో సూటిగా ‘ఎంతో గొప్పవారు’ అనే అర్థాన్ని పూర్తిగా మూసివేయదు.
theological_decisions:
- issue: τῶν ὑπερλίαν ἀποστόλων అనేది పౌలు ప్రత్యర్థులను వ్యంగ్యంగా సూచిస్తుందా, లేక ప్రముఖ అపొస్తలులను సూటిగా సూచిస్తుందా?
  choice: ప్రధాన పాఠ్యంలో ‘ఆ అతిగొప్ప అపొస్తలులు’ అని అనువదించి, సందర్భంలో కనిపించే సంభావ్య వ్యంగ్యాన్ని నిలిపాము.
  alternative: ‘అత్యంత ప్రముఖులైన అపొస్తలులు’ అని సూటిగా అర్థం చేసుకోవచ్చు.
  rationale: 2 కొరింథీయులు 11 అధ్యాయం సందర్భం పౌలుకు ఎదురు నిలిచిన బోధకులపై వ్యంగ్యాన్ని బలంగా సూచిస్తుంది. అయినప్పటికీ, గ్రీకు పదబంధం ప్రముఖ అపొస్తలులను సూటిగా సూచించే అవకాశాన్ని పూర్తిగా తొలగించదు; అందుకే ఆ అర్థాన్ని పాదసూచికలో ఉంచాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే వాక్యనిర్మాణం వాడబడింది. ‘తీసిపోను’ అనే సాధారణ ప్రయోగం పోలికలోని హీనత భావాన్ని స్పష్టంగా అందిస్తుంది; ‘అతిగొప్ప’ సంభావ్య వ్యంగ్యాన్ని అతిగా వివరణ చేయకుండా నిలుపుతుంది.
