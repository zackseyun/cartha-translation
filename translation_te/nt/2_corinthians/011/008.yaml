translation:
  language: te
  text: మీకు సేవ చేయడానికి ఆర్థిక సహాయం[a] తీసుకొని, నేను ఇతర సంఘాలను దోచుకున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత అక్షరార్థంగా, “జీతం” లేదా “వేతనం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: ఇతర సంఘాలను
  rationale: పౌలు వాడుకలో ἐκκλησία సాధారణంగా స్థానిక క్రైస్తవ సమాజాన్ని సూచిస్తుంది. ఆధునిక తెలుగు బైబిల్ భాషలో ‘సంఘాలు’ సహజమైన పదం.
- source_word: ἐσύλησα
  choice: దోచుకున్నాను
  rationale: συλάω అనేది దోచుకోవడం లేదా కొల్లగొట్టడం అనే బలమైన క్రియ. కొరింథులో సేవ చేస్తూ ఇతర సంఘాల సహాయం స్వీకరించడాన్ని గురించి పౌలు ఉద్దేశపూర్వకంగా వాడిన వ్యంగ్యాత్మక అతిశయోక్తి తీవ్రతను ఇది నిలుపుతుంది.
- source_word: λαβὼν
  choice: తీసుకొని
  rationale: ఈ భూతకాల కృదంతం ప్రధాన క్రియతో సాధనాత్మక సంబంధం కలిగి ఉంది—పౌలు ఏ విధంగా ఇతర సంఘాలను ‘దోచుకున్నాడో’ వివరిస్తుంది.
- source_word: ὀψώνιον
  choice: అవసరమైన సహాయం
  rationale: ὀψώνιον ప్రాథమికంగా జీతం, వేతనం లేదా జీవనోపాధికి ఇచ్చే సరఫరాను సూచిస్తుంది. ఈ సేవా సందర్భంలో ‘అవసరమైన సహాయం’ ఆర్థిక లేదా వస్తురూప పోషణను సహజంగా తెలియజేస్తూ, ఉద్యోగ సంబంధాన్ని అనవసరంగా సూచించదు; మరింత అక్షరార్థమైన పదాలు పాదసూచికలో ఉన్నాయి.
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: మీకు సేవ చేయడానికి
  rationale: πρός తో కూడిన ద్వితీయావిభక్తి ఇక్కడ ఉద్దేశాన్ని సూచిస్తుంది; ఇతర సంఘాల నుంచి అందిన సహాయం కొరింథీయులకు పౌలు చేసిన సేవ కోసం ఉపయోగించబడింది. ఈ అనువాదం సేవ చేసేవాడు పౌలేనని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ఇతర సంఘాల నుంచి సహాయం పొందడాన్ని ‘దోచుకోవడం’గా చెప్పడంలోని అలంకారిక బలం
  choice: ‘నేను ఇతర సంఘాలను దోచుకున్నాను’ అనే రెచ్చగొట్టే వ్యంగ్యాత్మక అతిశయోక్తిని నిలుపుకోవడం
  alternative: ప్రధాన పాఠంలో ‘ఇతర సంఘాల నుంచి సహాయం తీసుకున్నాను’ లేదా ‘ఇతర సంఘాలకు నష్టం కలిగించాను’ అని మృదువుగా అనువదించడం
  rationale: గ్రీకు క్రియ ఉద్దేశపూర్వకంగా బలంగా ఉంది. సందర్భం నిజమైన దొంగతనం గురించి కాక ఆర్థిక సహాయం గురించి మాట్లాడుతున్నప్పటికీ, పదాన్ని మృదువుచేస్తే తన అపొస్తల సేవను సమర్థించుకుంటూ పౌలు వాడిన పదునైన వ్యంగ్యం తగ్గిపోతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘దోచుకున్నాను’ అనే బలమైన రూపం మూలంలోని వ్యంగ్యాత్మక తీవ్రతను కాపాడుతుంది; ‘అవసరమైన సహాయం’ సందర్భార్థాన్ని స్పష్టంగా అందిస్తుంది.
