id: 2CO.11.23
reference: 2 Corinthians 11:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διάκονοι Χριστοῦ εἰσιν; παραφρονῶν λαλῶ, ὑπὲρ ἐγώ· ἐν κόποις περισσοτέρως, ἐν ⸂φυλακαῖς περισσοτέρως, ἐν πληγαῖς ὑπερβαλλόντως⸃, ἐν θανάτοις πολλάκις·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: te
  text: 'వారు మెస్సీయ[a] సేవకులా? నేను పిచ్చివాడిలా మాట్లాడుతున్నాను—నేను వారికంటే ఎక్కువగా: శ్రమల్లో మరింతగా, చెరసాలల్లో మరింతగా, దెబ్బల్లో లెక్కకు మించి, మరణాల్లో ఎన్నోసార్లు[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా ‘క్రీస్తు’: ‘వారు క్రీస్తు సేవకులా?’'
    reason: alternative_rendering
  - marker: b
    text: అక్షరార్థంగా ‘మరణాల్లో ఎన్నోసార్లు’; ఇది పలుమార్లు మరణం అంచుకు చేరడం లేదా ప్రాణాంతక ప్రమాదాలను ఎదుర్కోవడం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διάκονοι
  choice: సేవకులు
  rationale: ఈ సందర్భంలో ఈ పదం సేవచేసేవారిని సూచిస్తుంది. ‘పరిచారకులు’ కంటే ‘సేవకులు’ సాధారణ పాఠకులకు సహజంగా ఉండి, సంఘపదవిని అనవసరంగా సూచించదు.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός ఒక బిరుదుగా పనిచేస్తోంది; అందువల్ల దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో ఉంచి, సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఇచ్చాం.
- source_word: παραφρονῶν λαλῶ
  choice: నేను పిచ్చివాడిలా మాట్లాడుతున్నాను
  rationale: తాను చేస్తున్న పోలికతో కూడిన గొప్పచెప్పుకోవడం వెర్రితనంలా వినిపిస్తుందని పౌలు స్వయంగా అంగీకరిస్తున్న భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὑπὲρ ἐγώ
  choice: నేను అంతకంటే ఎక్కువగా
  rationale: గ్రీకులోని సంక్షిప్తమైన, క్రియ లేని పోలికను అలాగే కొంతవరకు నిలిపి, ముందున్న ‘సేవకులు’ అనే భావాన్ని పాఠకుడు పూరించుకునేలా చేస్తుంది.
- source_word: ἐν κόποις περισσοτέρως
  choice: శ్రమల్లో మరింతగా
  rationale: κόπος కఠినమైన శ్రమను సూచిస్తుంది; περισσοτέρως లోని పోలిక బలాన్ని ‘మరింతగా’ నిలుపుతుంది.
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: చెరసాలల్లో మరింతగా
  rationale: బహువచనం పౌలు ఎదుర్కొన్న పునరావృత నిర్బంధాలను సూచిస్తుంది. ‘చెరసాలల్లో’ సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: దెబ్బల్లో లెక్కకు మించి
  rationale: πληγαί శారీరకంగా కొట్టబడటాన్ని సూచిస్తే, ὑπερβαλλόντως సాధారణ పరిమితిని మించిన తీవ్రతను తెలియజేస్తుంది.
- source_word: ἐν θανάτοις πολλάκις
  choice: మరణాల్లో ఎన్నోసార్లు
  rationale: గ్రీకులోని అసాధారణ బహువచనాన్ని, దాని బలమైన అలంకారాన్ని ప్రధాన పాఠ్యంలో నిలిపింది; భావసంభావ్యతను పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: Χριστοῦ అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వాక్యంలో పదం బిరుదుగా వాడబడినందున దాని అర్థాన్ని తెలిపే రూపాన్ని ఎంచుకున్నాం; తెలుగు క్రైస్తవ వాడుకలో సుపరిచితమైన ‘క్రీస్తు’ను ప్రత్యామ్నాయంగా పాదసూచికలో ఉంచాం.
- issue: ὑπὲρ ἐγώ లోని అపూర్ణ పోలిక
  choice: నేను అంతకంటే ఎక్కువగా
  alternative: నేను మరింత గొప్ప సేవకుణ్ణి
  rationale: ‘సేవకుణ్ణి’ అని స్పష్టంగా చేర్చడం భావాన్ని సులభం చేసినా, మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను పరిష్కరించేస్తుంది. అందువల్ల అపూర్ణ పోలికను సాధ్యమైనంతవరకు నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పౌలు వాడిన వేగవంతమైన జాబితా, పునరుక్తి, అసాధారణ ‘మరణాలు’ బహువచనం నిలుపబడ్డాయి.
