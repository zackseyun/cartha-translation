id: 2CO.11.29
reference: 2 Corinthians 11:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς ἀσθενεῖ, καὶ οὐκ ἀσθενῶ; τίς σκανδαλίζεται καὶ οὐκ ἐγὼ πυροῦμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: te
  text: ఎవరు బలహీనులైతే, నేనూ బలహీనుడిని కానా? ఎవరైనా తొట్రుపడేలా చేయబడితే, నేను మండిపోనా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మండిపోవడం’ అనేది ఇక్కడ రూపక ప్రయోగం; అది తీవ్రమైన దుఃఖం, ఉత్సాహం లేదా ఆగ్రహాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: బలహీనపడితే / బలహీనపడకుండా ఉంటానా
  rationale: ఈ క్రియ శారీరక, సామాజిక లేదా ఆత్మీయ బలహీనతను సూచించగలదు. ‘బలహీనపడు’ అనే పదం ఆ విస్తృతిని నిలుపుతూ, ఇతరుల బలహీనతలో పౌలు సానుభూతితో పాలుపంచుకోవడాన్ని వ్యక్తం చేస్తుంది.
- source_word: σκανδαλίζεται
  choice: తొట్రుపడేలా చేయబడితే
  rationale: కర్మణి రూపాన్ని, అలాగే ఒకరిని ఆత్మీయంగా లేదా నైతికంగా పడిపోయే ప్రమాదంలోకి నెట్టే రూపకాన్ని నిలుపుతుంది; అది అభ్యంతరపడటమా, పాపంలో పడటమా, ఆత్మీయ పతనమా అన్నది అనవసరంగా నిర్ధారించదు.
- source_word: πυροῦμαι
  choice: మండిపోకుండా ఉంటానా
  rationale: మూలంలోని ‘కాలడం/మండడం’ అనే బలమైన రూపకాన్ని నిలుపుతుంది. ఇది తీవ్రమైన దుఃఖం, ఉత్సాహం లేదా ఆగ్రహాన్ని సూచించవచ్చు; ప్రధాన వాక్యంలో ఒక్క భావానికే పరిమితం చేయలేదు.
- source_word: τίς
  choice: ఎవరు
  rationale: వ్యక్తులను గురించి అడిగే అలంకారిక ప్రశ్నలకు సహజమైన తెలుగు సమానార్థకం.
- source_word: καὶ οὐκ ἐγὼ
  choice: నేనూ ... లేకుండా ఉంటానా
  rationale: ἐγώ లోని ఉద్ఘాటనను ‘నేనూ’ ద్వారా తెలియజేస్తూ, గ్రీకు నిషేధార్థక అలంకారిక ప్రశ్నను సహజమైన తెలుగు ప్రశ్నారూపంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πυροῦμαιలో పౌలు స్పందన స్వభావం
  choice: ప్రధాన పాఠ్యంలో ‘మండిపోవడం’ అనే రూపకాన్ని నిలుపడం
  alternative: ఆగ్రహంతో మండిపోవడం / దుఃఖంతో మండిపోవడం / లోలోపల రగిలిపోవడం
  rationale: పౌలు ఇతరుల ఆత్మీయ ప్రమాదంలో తీవ్రంగా పాలుపంచుకుంటున్నాడని వాక్యం తెలియజేస్తుంది. అయితే గ్రీకు రూపకం ఒకే భావోద్వేగాన్ని తప్పనిసరిగా నిర్దేశించదు; అందువల్ల దాని ఉద్దేశపూర్వక విస్తృతిని నిలిపాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని సమాంతర అలంకారిక ప్రశ్నలను, δεύτεవ ప్రశ్నలోని కర్మణి భావాన్ని, ‘మండడం’ అనే ఉద్దేశపూర్వక భావసందిగ్ధతను నిలిపాము.
