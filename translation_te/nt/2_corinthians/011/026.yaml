id: 2CO.11.26
reference: 2 Corinthians 11:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁδοιπορίαις πολλάκις, κινδύνοις ποταμῶν, κινδύνοις λῃστῶν, κινδύνοις ἐκ γένους, κινδύνοις ἐξ ἐθνῶν, κινδύνοις ἐν πόλει, κινδύνοις ἐν ἐρημίᾳ, κινδύνοις ἐν θαλάσσῃ, κινδύνοις ἐν ψευδαδέλφοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/026.yaml
  text: often on journeys[a], in dangers from rivers, in dangers from robbers, in dangers from my own people, in dangers from Gentiles, in dangers in the city, in dangers in the wilderness, in dangers at sea, in dangers among false brothers[b],
translation:
  language: te
  text: తరచుగా ప్రయాణాల్లో, నదులవల్ల ప్రమాదాల్లో, దొంగలవల్ల ప్రమాదాల్లో, నా స్వజనులవల్ల ప్రమాదాల్లో[a], అన్యజనులవల్ల ప్రమాదాల్లో, పట్టణంలో ప్రమాదాల్లో, అరణ్యంలో ప్రమాదాల్లో, సముద్రంలో ప్రమాదాల్లో, కపట సహోదరుల మధ్య ప్రమాదాల్లో[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా సొంత జాతివారివల్ల’ లేదా ‘నా సొంత ప్రజలవల్ల.’ గ్రీకులో అక్షరార్థంగా ‘[నా] వంశం/ప్రజలవల్ల’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కపట విశ్వాసుల మధ్య.’ గ్రీకులో అక్షరార్థంగా ‘కపట సహోదరుల మధ్య’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: తరచుగా ప్రయాణాల్లో
  rationale: దత్తివిభక్తి బహువచనమైన ὁδοιπορίαις‌తో πολλάκις కలిసి పదేపదే చేసిన ప్రయాణాలను సూచిస్తుంది. తెలుగు జాబితా లయను నిలుపుతూ సహజంగా ఉండే రూపం ఇది.
- source_word: κινδύνοις
  choice: ప్రమాదాల్లో
  rationale: గ్రీకులో పదేపదే వచ్చే దత్తివిభక్తి బహువచనాన్ని పునరావృతం చేసి, కష్టాల సమాహారాన్ని బలంగా వినిపించే మూలపాఠ్య వాక్చాతుర్యాన్ని నిలిపింది.
- source_word: ποταμῶν
  choice: నదులవల్ల
  rationale: ఇది ప్రమాదానికి మూలాన్ని లేదా రకాన్ని సూచిస్తుంది. వరదలు లేదా నది దాటడాలు అని మూలంలో లేని నిర్దిష్టతను చేర్చకుండా ఉంచింది.
- source_word: λῃστῶν
  choice: దొంగలవల్ల
  rationale: λῃσταί ప్రయాణికులను దోచే దొంగలు లేదా బందిపోట్లను సూచించగలదు; సాధారణ ఆధునిక తెలుగులో ‘దొంగలు’ స్పష్టమైన పదం.
- source_word: ἐκ γένους
  choice: నా స్వజనులవల్ల
  rationale: γένος ఇక్కడ పౌలు చెందిన జాతి లేదా ప్రజావర్గాన్ని సూచిస్తుంది. గ్రీకులో స్పష్టంగా లేని ‘యూదులు’ అనే నామాన్ని చేర్చకుండా, ἐξ ἐθνῶν‌తో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐξ ἐθνῶν
  choice: అన్యజనులవల్ల
  rationale: పౌలు స్వజనులతో వ్యత్యాసంగా ἔθνη ఇక్కడ యూదేతరులను సూచిస్తుంది. ‘అన్యజనులు’ ఈ సందర్భంలో సంక్షిప్తమైన, స్థిరపడిన తెలుగు ప్రయోగం.
- source_word: ἐν πόλει
  choice: పట్టణంలో
  rationale: గ్రీకు ఏకవచన రూపాన్ని నిలుపుతూ, స్థలాన్ని సాధారణ లేదా ప్రతినిధి భావంలో తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ἐρημίᾳ
  choice: అరణ్యంలో
  rationale: ἐρημία నిర్జన ప్రాంతం, ఎడారి లేదా అరణ్యాన్ని సూచించగలదు. ‘అరణ్యం’ విస్తృత భావాన్ని ఇస్తూ పట్టణం–అరణ్యం–సముద్రం అనే వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐν θαλάσσῃ
  choice: సముద్రంలో
  rationale: మూలంలోని స్థలార్థాన్ని నేరుగా తెలియజేస్తూ సముద్ర ప్రయాణంలో ఎదురైన ప్రమాదాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν ψευδαδέλφοις
  choice: కపట సహోదరుల మధ్య
  rationale: ψευδάδελφοι అనే సమాసంలోని ‘అబద్ధ/నకిలీ’ మరియు ‘సహోదరులు’ అనే రెండు భాగాల భావాన్ని నిలుపుతుంది; వారు నిజమైన విశ్వాసులా కాదా అనే తీర్పును అనవసరంగా విస్తరించదు.
theological_decisions:
- issue: ψευδαδέλφοις‌ను లింగం మరియు విశ్వాస గుర్తింపుతో అనువదించడం
  choice: కపట సహోదరుల మధ్య
  alternative: కపట విశ్వాసుల మధ్య
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం; అక్షరార్థంగా ‘కపట సహోదరులు.’ ‘విశ్వాసులు’ అని మార్చడం మూలంలోని కుటుంబసంబంధ పదచిత్రాన్ని తొలగించి వారి స్థితిని మరింత వ్యాఖ్యానిస్తుంది.
- issue: ἐκ γένους మరియు ἐξ ἐθνῶν మధ్య జాతిపరమైన వ్యత్యాసం
  choice: నా స్వజనులవల్ల … అన్యజనులవల్ల
  alternative: యూదులవల్ల … యూదేతరులవల్ల
  rationale: సందర్భం పౌలు స్వప్రజలకు, అన్యజనులకు మధ్య వ్యత్యాసాన్ని సూచించినా, మొదటి పదబంధంలో గ్రీకు ‘యూదులు’ అని ప్రత్యక్షంగా చెప్పదు. ఎంపిక చేసిన రూపం ఆ వ్యత్యాసాన్ని స్పష్టంగా ఉంచి మూలంలోని స్వల్ప పరోక్షతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. κινδύνοις పునరావృతిని తెలుగులోనూ ఉద్దేశపూర్వకంగా నిలిపి పౌలు జాబితాలోని వాక్చాతుర్య లయను కాపాడాం. ఇది ముందున్న వాక్యభాగంతో కొనసాగే జాబితా కావడంతో చివర కామా ఉంచబడింది.
