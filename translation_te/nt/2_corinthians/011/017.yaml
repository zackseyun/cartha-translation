  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: te
  text: నేను చెప్పేది ప్రభువు ప్రమాణం ప్రకారం చెప్పేది కాదు[a]; కానీ గొప్పచెప్పుకోవడంలోని ఈ ధైర్యంతో, బుద్ధిహీనతతో చెప్పినట్టుగా చెబుతున్నాను[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నేను దీన్ని ప్రభువు నుండి వచ్చిన మాటగా చెప్పడం లేదు,” లేదా “ప్రభువు ప్రమాణం ప్రకారం చెప్పడం లేదు.”
    reason: alternative_reading
  - marker: b
    text: లేదా, “కానీ బుద్ధిహీనతలో ఉన్నవాడిలా,” మరింత సహజంగా, “కానీ బుద్ధిహీనుడిలా.”
    reason: lexical_alternative
  - marker: c
    text: “ధైర్యం” అని అనువదించిన గ్రీకు పదానికి ఈ సందర్భంలో “విషయం,” “ఆధారం,” లేదా “చేపట్టిన కార్యం” అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: నేను చెప్పేది
  rationale: వర్తమాన సందర్భంలో పౌలు చెబుతున్న మాటల విషయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κατὰ κύριον
  choice: ప్రభువు ప్రకారం
  rationale: κατά సూచించే ప్రమాణం, విధానం లేదా అధికార మూలం అనే సాధ్యమైన భావాలను ఏ ఒక్కదానికీ పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: κύριον
  choice: ప్రభువు
  rationale: ఈ సందర్భంలో ప్రభువైన యేసును సహజంగా సూచించే గౌరవపూర్వకమైన సాధారణ అనువాదం.
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: కానీ ... బుద్ధిహీనతలో ఉన్నట్టుగా
  rationale: పౌలు తనను నేరుగా బుద్ధిహీనుడని గుర్తించకుండా, అతని మాటల తీరు బుద్ధిహీనత పరిధిలో ఉన్నట్టుగా ఉందనే ὡς ἐν నిర్మాణాన్ని కాపాడుతుంది.
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: ఈ ... ధైర్యంలో
  rationale: ὑπόστασις ఇక్కడ నమ్మకం, ఆధారం, విషయం లేదా చేపట్టిన కార్యం అనే భావాలను కలిగి ఉండవచ్చు; సందర్భంలోని ధైర్యంగా గొప్పచెప్పుకోవడాన్ని ‘ధైర్యం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῆς καυχήσεως
  choice: గొప్పచెప్పుకునే
  rationale: καύχησις యొక్క క్రియాత్మక భావాన్ని తెలుగులో సహజంగా నిలుపుతూ, అది ధైర్యానికి సంబంధించిన రంగాన్ని వివరిస్తుంది.
theological_decisions:
- issue: ‘ప్రభువు ప్రకారం’ అనే మాట యొక్క భావం
  choice: పౌలు తాను చేయబోయే గొప్పచెప్పుకోవడం ప్రభువు ప్రమాణం లేదా విధానం ప్రకారం కాదని చెబుతున్నట్టుగా అనువదించడం
  alternative: ఇది ప్రభువు నుండి నేరుగా వచ్చిన ఆజ్ఞ లేదా మాట కాదని పౌలు చెబుతున్నాడు
  rationale: మూలంలోని పదబంధం విధానం, ప్రమాణం, లేదా మూలాధికారాన్ని సూచించగలదు. ప్రధాన పాఠం ఈ ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచుతుంది; పౌలు ప్రేరణను లేదా సత్యతను నిరాకరిస్తున్నాడని అనువాదం నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవపూర్వకమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే వాక్య నిర్మాణం. గ్రీకు వాక్యంలోని క్లిష్టమైన ὑπόστασις భావాన్ని ప్రధాన పాఠంలో ‘ధైర్యం’తో అందించి, ఇతర సాధ్యతలను పాదసూచికలో ఉంచాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
