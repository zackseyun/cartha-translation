id: 2CO.11.31
reference: 2 Corinthians 11:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ⸀Ἰησοῦ οἶδεν, ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας, ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: te
  text: ప్రభువైన యేసు యొక్క దేవుడూ తండ్రీ, ఎప్పటికీ[a] స్తుతింపబడే ఆయన, నేను అబద్ధం చెప్పడం లేదని తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, ‘యుగయుగాలకు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: దేవుడూ తండ్రీ
  rationale: ఒకే నిర్దేశక పదం రెండు నామవాచకాలను కలిపి ఒక స్థిరమైన సంబోధనాత్మక వర్ణనగా నిలుపుతోంది. అందువల్ల రెండింటినీ సమన్వయంగా ఉంచాం.
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: ప్రభువైన యేసు యొక్క
  rationale: మూలంలో లేని ‘మన’ అనే పదాన్ని చేర్చకుండా, κύριος అనే బిరుదును ‘ప్రభువు’గా నిలిపి సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేశాం.
- source_word: οἶδεν
  choice: తెలుసు
  rationale: ఈ మాట ప్రమాణపూర్వక సాక్ష్యంలా పనిచేసినా, క్రియ యొక్క ప్రత్యక్ష అర్థమైన ‘తెలుసు’నే నిలిపాం.
- source_word: ὁ ὢν εὐλογητὸς
  choice: స్తుతింపబడే ఆయన
  rationale: దేవుని గురించి మధ్యలో వచ్చే స్తోత్రాత్మక వర్ణనను సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది; దానిని ప్రధాన వాక్యంతో కలిపివేయదు.
- source_word: εἰς τοὺς αἰῶνας
  choice: ఎప్పటికీ
  rationale: కాలాంతరములన్నిటిలో కొనసాగే స్తోత్ర భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ὅτι
  choice: అని
  rationale: ఇది దేవునికి తెలిసిన విషయాన్ని పరిచయం చేస్తోంది; కారణాన్ని కాదు.
- source_word: οὐ ψεύδομαι
  choice: నేను అబద్ధం చెప్పడం లేదు
  rationale: వర్తమానకాలంలోని నేరుగా చేసిన నిరాకరణను సహజమైన ఆధునిక తెలుగులో నిలిపాం.
theological_decisions:
- issue: ‘దేవుడూ తండ్రీ’కి ‘ప్రభువైన యేసు’తో ఉన్న సంబంధం
  choice: ‘ప్రభువైన యేసు యొక్క దేవుడూ తండ్రీ’ అని నేరుగా అనువదించాం.
  alternative: వ్యక్తుల మధ్య కనిపించే భేదాన్ని తగ్గించేలా భావానువాదం చేయడం.
  rationale: మూలపాఠం దేవుని ప్రభువైన యేసుకు దేవుడిగా, తండ్రిగా వర్ణిస్తుంది. అందులోని సంబంధ భేదాన్ని తగ్గించకుండా, అదనపు సిద్ధాంత వివరణను చేర్చకుండా నిలిపాం.
- issue: స్తుతివాక్య భాగపు అన్వయం
  choice: ‘ఎప్పటికీ స్తుతింపబడే ఆయన’ను దేవుని గురించిన మధ్యవర్తి స్తోత్రాత్మక వర్ణనగా కామాలతో వేరు చేశాం.
  alternative: దానిని పరిమితిని సూచించే విశేషణ వాక్యంగా ప్రధాన వాక్యానికి గట్టిగా జోడించడం.
  rationale: ఈ భాగం పౌలు చేస్తున్న గంభీర ప్రకటన మధ్యలో దేవుని స్తుతించే వర్ణనగా సహజంగా పనిచేస్తుంది; కామాలు ఆ సంబంధాన్ని స్పష్టంగా ఉంచుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని గంభీరమైన ప్రమాణసదృశ స్వరాన్ని కాపాడుతూ కృత్రిమమైన ప్రాచీన పదప్రయోగాలను నివారించాం.
