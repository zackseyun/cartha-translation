id: 2CO.11.28
reference: 2 Corinthians 11:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χωρὶς τῶν παρεκτὸς ἡ ⸀ἐπίστασίς ⸀μοι ἡ καθ’ ἡμέραν, ἡ μέριμνα πασῶν τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/028.yaml
  text: 'Apart from such external things[c][b][a], there is the daily pressure on me: concern for all the churches.'
translation:
  language: te
  text: ఇవి కాకుండా[a], ప్రతిరోజూ నాపై పడే ఒత్తిడి[b]—సంఘాలన్నిటి గురించిన చింత[c]—ఉంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మిగతా సంగతులు కాకుండా’; లేదా ‘చెప్పకుండా వదిలిన సంగతులు కాకుండా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నాకు ప్రతిరోజూ కలిగే భారం’; లేదా ‘ప్రతిరోజూ నన్ను చుట్టుముట్టే ఒత్తిడి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘సంఘాలన్నిటి గురించిన ఆందోళన.’
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: ఇవి కాకుండా
  rationale: ఈ పదబంధం ఇంతకుముందు పేర్కొన్న కష్టాలకు అదనంగా లేదా వాటిని పక్కనబెడితే అనే భావాన్ని ఇస్తుంది. ‘ఇవి కాకుండా’ ముందున్న జాబితాతో సహజంగా అనుసంధానమవుతుంది; ‘బాహ్యమైనవి’ అనే సాధ్యమైన భావాన్ని అనవసరంగా ఖరారు చేయదు.
- source_word: ἐπίστασίς μοι
  choice: నాపై పడే ఒత్తిడి
  rationale: ἐπίστασις ఒత్తిడి లేదా మీదికి వచ్చి పడటాన్ని సూచించగలదు. μοι లోని అనుభవార్థక దత్తివును ‘నాపై’ అని నిలుపుతూ, సందర్భంలో అక్షరార్థపు జనసమూహం కంటే పౌలు అనుభవించే భారాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ καθ’ ἡμέραν
  choice: ప్రతిరోజూ
  rationale: రోజు రోజుకూ పునరావృతమయ్యే ఒత్తిడిని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἡ μέριμνα
  choice: చింత
  rationale: μέριμνα శ్రద్ధతో కూడిన చింతను లేదా ఆందోళనను సూచించగలదు. ‘చింత’ పౌలు సంఘాలపట్ల కలిగిన నిజమైన మానసిక భారాన్ని నిలుపుతుంది; దానిని పాపపూరితమైన ఆందోళనగా ముందే నిర్ణయించదు.
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: సంఘాలన్నిటి గురించి
  rationale: పౌలు వాడుకలో ἐκκλησίαι క్రైస్తవ విశ్వాసుల స్థానిక సంఘాలను సూచిస్తుంది. ‘సంఘాలు’ ఆధునిక తెలుగు బైబిలు సందర్భంలో స్పష్టమైన, సహజమైన పదం.
theological_decisions:
- issue: μέριμνα లో పౌలు మ pastoral భారపు స్వభావం
  choice: చింత
  alternative: ఆందోళన; శ్రద్ధ
  rationale: ఈ పదం భావోద్వేగ భారాన్నీ శ్రద్ధనూ కలిపి సూచించగలదు. ‘చింత’ ఆ ఉద్వేగాన్ని నిలుపుతూ, అది నైతికంగా తప్పైన ఆందోళన అని పాఠ్యంలో లేని తీర్పును చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని విరామసదృశ అనుప్రయోగాన్ని డ్యాష్‌లతో చూపించి, ప్రతిరోజూ పడే ఒత్తిడి ఏమిటో తరువాతి పదబంధం వివరిస్తున్న సంబంధాన్ని నిలిపాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
