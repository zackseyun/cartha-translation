  source_fidelity: మూలంలోని కారణార్థక ἐπεὶను “కాబట్టి” సహజంగా అందించింది; πολλοὶ, వర్తమాన కాలంలోని καυχῶνται, κατὰ σάρκα, నొక్కిచెప్పే κἀγώ, భవిష్యత్ కాలంలోని καυχήσομαι అన్నీ సరిగా ప్రతిఫలించాయి. రెండు చోట్లా “గొప్పలు చెప్పుకుంటాను/చెప్పుకుంటున్నారు” అనే పునరుక్తి మూలంలోని ఉద్దేశపూర్వక ప్రతిధ్వనిని కాపాడుతుంది.
