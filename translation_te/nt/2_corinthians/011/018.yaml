  text: Since many boast according to the flesh[a], I too will boast.
translation:
  language: te
  text: చాలామంది శరీరానుసారంగా[a] గొప్పలు చెప్పుకుంటున్నారు కాబట్టి, నేనూ గొప్పలు చెప్పుకుంటాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మానవ ప్రమాణాల ప్రకారం” లేదా “కేవలం మానవ రీతిలో.”
    reason: κατὰ σάρκα అనే పదబంధానికి సందర్భోచితమైన అర్థ ప్రత్యామ్నాయాలు.
lexical_decisions:
- source_word: ἐπεὶ
  choice: కాబట్టి
  rationale: పౌలు తాను చేయబోయే వ్యంగ్యాత్మక ప్రగల్భానికి ముందున్న కారణాన్ని ఇది సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: πολλοὶ
  choice: చాలామంది
  rationale: పరిమాణాన్ని సరళంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: καυχῶνται
  choice: గొప్పలు చెప్పుకుంటున్నారు
  rationale: సందర్భంలోని ప్రగల్భం, వ్యంగ్యం, వాదనాత్మక ధోరణిని తెలియజేస్తుంది; తరువాతి καυχήσομαιతో పదపునరుక్తిని నిలుపుతుంది.
- source_word: κατὰ σάρκα
  choice: శరీరానుసారంగా
  rationale: పౌలు వాడిన σάρξ అనే వివాదాస్పద పదాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, దాని మానవీయ లేదా లోకసంబంధ ప్రమాణాల భావాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: κἀγὼ
  choice: నేనూ
  rationale: καί + ἐγώలోని ‘నేను కూడా’ అనే నొక్కిచెప్పే పోలికను సహజమైన తెలుగులో అందిస్తుంది.
- source_word: καυχήσομαι
  choice: గొప్పలు చెప్పుకుంటాను
  rationale: భవిష్యత్ భావాన్ని, అలాగే ముందటి క్రియతో ఉన్న ఉద్దేశపూర్వక పునరుక్తిని నిలుపుతుంది.
theological_decisions:
- issue: κατὰ σάρκα లోని σάρξ పద అనువాదం
  choice: శరీరానుసారంగా
  alternative: మానవ ప్రమాణాల ప్రకారం; కేవలం మానవ రీతిలో
  rationale: ప్రధాన పాఠ్యంలో పౌలు పదప్రయోగంలోని వేదాంతపరమైన ఉద్రిక్తతను, అస్పష్టతను నిలుపుతుంది; ఇక్కడ ఉద్దేశం భౌతిక దేహం అని తేల్చకుండా, సందర్భోచితమైన మానవీయ లేదా లోకసంబంధ భావాన్ని పాదటిప్పణి వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని వ్యంగ్యభరిత పునరుక్తి నిలుపబడింది.
