lexical_decisions:
- source_word: ἡδέως
  choice: సంతోషంగా
  rationale: ఇష్టపూర్వకంగా లేదా సంతోషంతో సహించడాన్ని సూచిస్తుంది; సందర్భంలోని పౌలు వ్యంగ్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి మాటకు కారణం లేదా వివరణను పరిచయం చేసే అనుసంధాన భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνέχεσθε
  choice: సహిస్తున్నారు
  rationale: ఎవరినైనా భరించడం లేదా ఓర్చుకోవడం అనే భావాన్ని సహజంగా అందిస్తుంది; ప్రత్యామ్నాయంగా ‘భరిస్తున్నారు’ కూడా సాధ్యం.
- source_word: τῶν ἀφρόνων
  choice: మూర్ఖులను
  rationale: క్రియకు కర్మగా ఉన్న మూర్ఖ వ్యక్తులను నేరుగా సూచిస్తుంది; ‘జ్ఞానులు’ అనే పదంతో ఉద్దేశిత వ్యతిరేకతను నిలుపుతుంది.
- source_word: φρόνιμοι
  choice: జ్ఞానులు
  rationale: ‘మూర్ఖులు’తో ఉన్న పదార్థ వ్యతిరేకతను నిలుపుతూ, కొరింథీయులు తమను జ్ఞానులుగా భావించడంపై ఉన్న వ్యంగ్యాన్ని వెల్లడిస్తుంది.
- source_word: ὄντες
  choice: గనుక
  rationale: వర్తమాన కృదంతాన్ని సహజమైన తెలుగు ఉపవాక్యంగా వ్యక్తం చేస్తుంది. సందర్భంలో కారణార్థ పఠనం సాధ్యమైనప్పటికీ, మొత్తం వాక్యంలోని వ్యంగ్యమే ఆ కారణ భావాన్ని తలకిందులు చేస్తుంది.
theological_decisions:
- issue: కొరింథీయుల పట్ల పౌలు ఉపయోగించిన వ్యంగ్యం
  choice: ‘మూర్ఖులు’–‘జ్ఞానులు’ అనే వ్యతిరేకతను నేరుగా ఉంచి, అదనపు వ్యంగ్య పదాలను ప్రధాన వచనంలో చేర్చలేదు.
  alternative: ‘మీరు అంత జ్ఞానులు కదా’ వంటి స్పష్టమైన వ్యంగ్య పదబంధాన్ని చేర్చడం.
  rationale: గ్రీకు వాక్యంలోనే పదాల పరస్పర వ్యతిరేకత ద్వారా వ్యంగ్యం వ్యక్తమవుతుంది. అనువాదం దానిని నిలపాలి గాని, మూలంలో లేని వివరణాత్మక పదాలను చేర్చి భావాన్ని ముందే నిర్ణయించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సంతోషంగా సహిస్తున్నారు’ అనే పదబంధం గ్రీకు వాక్యంలోని పదునైన వ్యంగ్యాన్ని నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో ఉన్నాయి.
