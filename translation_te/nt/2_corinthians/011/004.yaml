revisions:
- from: ఎందుకంటే, ఎవరైనా వచ్చి మేము ప్రకటించని మరొక యేసును ప్రకటిస్తే, లేదా మీరు పొందని భిన్నమైన ఆత్మను పొందితే, లేదా మీరు అంగీకరించని భిన్నమైన సువార్తను అంగీకరిస్తే, మీరు బాగానే సహిస్తున్నారు.[a]
  to: ఎందుకంటే, ఎవరైనా వచ్చి మేము ప్రకటించని మరొక యేసును ప్రకటిస్తే, లేదా మీరు ఇంతకు ముందు పొందని భిన్నమైన ఆత్మను పొందుతున్నట్లయితే, లేదా మీరు అంగీకరించని భిన్నమైన సువార్తను అంగీకరించారు అంటే, మీరు బాగానే సహిస్తున్నారు.[a]
  rationale: 'The revision retains the draft’s faithful lexical choices but improves source-level verbal fidelity: ‘పొందుతున్నట్లయితే’ represents the present λαμβάνετε, and ‘అంగీకరించారు అంటే’ represents the aorist ἐδέξασθε within the same rhetorical conditional frame. ‘ఇంతకు ముందు’ clarifies the temporal contrast inherent in the aorist ‘you did not receive’ without narrowing what ‘spirit’ denotes. The ironic closing and its footnote are retained.'
