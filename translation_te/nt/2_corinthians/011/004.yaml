review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the three contrasts (another Jesus, a different spirit, and a different gospel) and retains the ironic final clause. However, its second and third parallel clauses make the Corinthians' receiving and accepting purely conditional with 'పొందితే/అంగీకరిస్తే,' whereas the Greek has present indicative λαμβάνετε ('you are receiving/receive') and aorist ἐδέξασθε ('you accepted'). A modest revision better reflects the verbal distinction and the rhetorical conditional construction.
  naturalness: The draft is generally clear and uses modern standard Telugu. The revised wording makes the parallel conditional sequence more idiomatic while distinguishing the ongoing/current sense of 'పొందుతున్నారు' from the prior acceptance expressed by 'అంగీకరించారు.'
  terminology: ‘మరొక యేసు,’ ‘భిన్నమైన ఆత్మ,’ ‘భిన్నమైన సువార్త,’ and ‘ప్రకటించడం’ are suitable and preserve the source distinctions without specifying the referent of ‘spirit.’ ‘సహిస్తున్నారు’ appropriately retains the broad, unexpressed object of ἀνέχεσθε.
  issues:
  - severity: medium
    issue: The verbs in the second and third clauses are rendered as conditional forms (‘పొందితే,’ ‘అంగీకరిస్తే’), without retaining the Greek tense/aspect contrast.
    rationale: λαμβάνετε is present indicative, while ἐδέξασθε is aorist indicative. In this rhetorical condition, Telugu can naturally use ‘పొందుతున్నట్లయితే’ and ‘అంగీకరించారు’ to preserve the contrast between receiving and prior acceptance.
  revised_text: ఎందుకంటే, ఎవరైనా వచ్చి మేము ప్రకటించని మరొక యేసును ప్రకటిస్తే, లేదా మీరు ఇంతకు ముందు పొందని భిన్నమైన ఆత్మను పొందుతున్నట్లయితే, లేదా మీరు అంగీకరించని భిన్నమైన సువార్తను అంగీకరించారు అంటే, మీరు బాగానే సహిస్తున్నారు.[a]
