id: 2CO.11.4
reference: 2 Corinthians 11:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: te
  text: ఎందుకంటే, ఎవరైనా వచ్చి మేము ప్రకటించని మరొక యేసును ప్రకటిస్తే, లేదా మీరు ఇంతకు ముందు పొందని భిన్నమైన ఆత్మను పొందుతున్నట్లయితే, లేదా మీరు అంగీకరించని భిన్నమైన సువార్తను అంగీకరించారు అంటే, మీరు బాగానే సహిస్తున్నారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మీరు బాగానే సహిస్తున్నారు’ అన్నది వ్యంగ్యంగా చెప్పిన మాట కావచ్చు; అటువంటి ప్రకటనలను వారు మరీ సులభంగా సహిస్తున్నారని పౌలు మందలిస్తున్నాడు.
    reason: వ్యంగ్య స్వరాన్ని స్పష్టం చేయడం
lexical_decisions:
- source_word: ὁ ἐρχόμενος
  choice: ఎవరైనా వచ్చి
  rationale: నామవాచకార్థంలో వాడిన వర్తమాన కృదంతం సందర్భంలో సాధారణంగా వచ్చే వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఎవరైనా వచ్చి’ సహజంగా ఉండి, వ్యక్తి ఎవరన్నది నిర్దిష్టం చేయదు.
- source_word: ἄλλον Ἰησοῦν
  choice: మరొక యేసు
  rationale: ἄλλος ఇక్కడ అదే పేరుతో ప్రతిపాదించబడుతున్న ప్రత్యామ్నాయ యేసును సూచిస్తుంది. ‘మరొక యేసు’ మూలంలోని సంక్షిప్తతను, హెచ్చరికను నిలుపుతుంది.
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: ప్రకటిస్తే / ప్రకటించని
  rationale: κηρύσσω బహిరంగంగా సందేశాన్ని ప్రకటించడాన్ని సూచిస్తుంది. ‘ప్రకటించు’ సాధారణ పాఠకులకు సహజంగా ఉండి, కేవలం బోధించడంకన్నా విస్తృతమైన అర్థాన్ని ఇస్తుంది.
- source_word: πνεῦμα ἕτερον
  choice: భిన్నమైన ఆత్మ
  rationale: ἕτερος‌లోని భేదాన్ని ‘భిన్నమైన’ స్పష్టంగా తెలియజేస్తుంది. ‘ఆత్మ’ ఏ నిర్దిష్ట ఆధ్యాత్మిక శక్తిని లేదా అనుభవాన్ని సూచిస్తుందో అనువాదం నిర్ణయించదు.
- source_word: λαμβάνετε / ἐλάβετε
  choice: పొందితే / పొందని
  rationale: λαμβάνω ఇక్కడ ఇవ్వబడినదాన్ని పొందడాన్ని సూచిస్తుంది. ‘పొందు’ తరువాతి δέχομαιకు వాడిన ‘అంగీకరించు’తో ఉన్న పదభేదాన్ని కాపాడుతుంది.
- source_word: εὐαγγέλιον ἕτερον
  choice: భిన్నమైన సువార్త
  rationale: ‘భిన్నమైన’ ప్రత్యామ్నాయ సందేశం గుణరీత్యా వేరైనదని సూచిస్తుంది; ‘సువార్త’ పౌలు వాడుకలో స్థిరమైన, సులభంగా అర్థమయ్యే పదం.
- source_word: ἐδέξασθε
  choice: అంగీకరించని
  rationale: δέχομαιలో స్వీకరించడం లేదా ఆదరించి అంగీకరించడం అనే భావం ఉంది. ‘అంగీకరించు’ ముందు వాక్యభాగంలోని λαμβάνω (‘పొందు’)తో తేడాను నిలుపుతుంది.
- source_word: καλῶς ἀνέχεσθε
  choice: మీరు బాగానే సహిస్తున్నారు
  rationale: ἀνέχομαι అంటే సహించడం లేదా ఓర్చుకోవడం; καλῶς‌తో కలిసిన ఈ మాట సందర్భంలో వ్యంగ్య మందలింపుగా వినిపిస్తుంది. గ్రీకులో సహిస్తున్నది ఎవరిని లేదా దేనిని అన్న కర్మ స్పష్టంగా లేకపోవడంతో తెలుగులోనూ దాన్ని చేర్చలేదు.
- source_word: εἰ μὲν γὰρ
  choice: ఎందుకంటే … ప్రకటిస్తే
  rationale: γάρ ముందున్న వాదనకు వివరణను కలుపుతుంది; εἰ షరతును ప్రవేశపెడుతుంది. తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా ‘ఎందుకంటే’తో మొదలుపెట్టి క్రియలకు ‘-తే’ రూపం ఇచ్చాం.
theological_decisions:
- issue: ‘భిన్నమైన ఆత్మ’ దేనిని సూచిస్తుంది?
  choice: దాని సూచనను నిర్దిష్టం చేయకుండా ‘భిన్నమైన ఆత్మ’గా ఉంచడం
  alternative: తప్పుగా ప్రతిపాదించబడిన పరిశుద్ధాత్మ; దుష్టాత్మ; భిన్నమైన ఆధ్యాత్మిక వైఖరి లేదా అనుభవం
  rationale: πνεῦμα ἕτερον అనే గ్రీకు పదబంధం విస్తృతార్థకమైనది; సమీప సందర్భం ఒకే సూచనను తప్పనిసరి చేయదు. అందువల్ల మూలంలోని ధార్మిక అస్పష్టతను నిలిపాం.
- issue: καλῶς ἀνέχεσθε మాటలోని స్వరం
  choice: వ్యంగ్య మందలింపుగా ‘మీరు బాగానే సహిస్తున్నారు’
  alternative: నిజమైన ప్రశంస; తటస్థ పరిశీలన
  rationale: సందర్భంలో పౌలు ప్రత్యర్థి బోధకులను కొరింథీయులు సులభంగా సహించడాన్ని విమర్శిస్తున్నాడు. వాక్యాన్ని అతిగా విప్పకుండా వ్యంగ్య స్వరాన్ని తెలుగు పదబంధం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మరొక యేసు’తో ἄλλοςను, ‘భిన్నమైన ఆత్మ/సువార్త’తో ἕτεροςను సాధ్యమైనంతవరకు వేరుచేశాం. మూడు సమాంతర షరతులను నిలిపి, గ్రీకులో లేని కర్మను చివరి వాక్యభాగంలో చేర్చలేదు.
