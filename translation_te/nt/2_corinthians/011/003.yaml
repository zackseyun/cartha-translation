id: 2CO.11.3
reference: 2 Corinthians 11:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: te
  text: అయితే, సర్పం తన కపట చాతుర్యంతో హవ్వను మోసగించినట్లే, ఏదో విధంగా మెస్సీయ పట్లనున్న నిష్కపటత[a] మరియు పవిత్రత[b] నుండి మీ మనస్సులు చెడిపోతాయేమోనని నేను భయపడుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నిష్కపటత’కు బదులుగా ‘సరళత’ లేదా ‘ఏకహృదయ నిబద్ధత’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘మరియు పవిత్రత’ అనే మాటలు లేవు.
    reason: textual_variant
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: అయితే ... ఏదో విధంగా ... చెడిపోతాయేమోనని నేను భయపడుతున్నాను
  rationale: భయాన్ని తెలిపే గ్రీకు నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగు వాక్యక్రమంలో ఉంచి, μή πως లోని అనిశ్చిత ఆందోళనను ‘ఏదో విధంగా ... ఏమో’తో నిలిపింది.
- source_word: ὡς ὁ ὄφις ἐξηπάτησεν Εὕαν
  choice: సర్పం ... హవ్వను మోసగించినట్లే
  rationale: ఆదికాండంలోని సంఘటనకు ఉన్న సూచనను ‘సర్పం’ అనే గౌరవప్రదమైన బైబిలు పదంతో కాపాడుతుంది; ἐξηπάτησεν యొక్క ప్రధాన భావాన్ని ‘మోసగించాడు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: తన కపటంతో
  rationale: ἐν ఇక్కడ సాధనార్థకంగా ఉంది; πανουργία లోని మోసపూరిత చాతుర్యాన్ని ‘కపటం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: మీ మనస్సులు చెడిపోతాయేమో
  rationale: సంభవించగల హానికరమైన చెడుదలను తెలిపే పరోక్ష భావాన్ని సహజమైన తెలుగులో కాపాడుతుంది. νοήματα ఇక్కడ ఆలోచనా విధానం లేదా మనస్సులను సూచిస్తుంది.
- source_word: τῆς ἁπλότητος
  choice: నిష్కపటత
  rationale: ఈ సందర్భంలో ἁπλότης కేవలం సాధారణతకన్నా నిజాయితీగల, విభజనలేని భక్తిని సూచిస్తుంది. ‘నిష్కపటత’ దాని నైతిక భావాన్ని స్పష్టంగా ఇస్తుంది; ఇతర సాధ్య భావాలు పాదసూచికలో ఉన్నాయి.
- source_word: καὶ τῆς ἁγνότητος
  choice: పవిత్రత
  rationale: ἁγνότης లోని శుద్ధతను, ముందరి వచనంలోని నిర్మల కన్య ఉపమానాన్ని అతిగా లైంగిక అర్థానికి పరిమితం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: τῆς εἰς τὸν Χριστόν
  choice: మెస్సీయ పట్ల మీకున్న
  rationale: εἰς లోని దిశాత్మక సంబంధాన్ని ‘పట్ల’తో తెలుపుతుంది. Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని ‘మెస్సీయ’గా అనువదించింది.
theological_decisions:
- issue: Χριστόν పదానికి అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఈ సందర్భంలో అభిషిక్తుడనే బిరుదు భావాన్ని కలిగి ఉంది. అందువల్ల పేరు వలె లిప్యంతరీకరించకుండా బిరుదు అర్థాన్ని ‘మెస్సీయ’గా వ్యక్తం చేసింది.
- issue: ἁπλότης యొక్క సందర్భార్థం
  choice: నిష్కపటత
  alternative: సరళత; ఏకహృదయ నిబద్ధత
  rationale: పౌలు ఆందోళన విభజనలేని, నిజమైన మెస్సీయ-కేంద్రిత భక్తి చెడిపోవడం గురించి. ప్రధాన పాఠంలో నైతిక నిష్కపటతను ఉంచి, పదంలోని సరళత/ఏకహృదయత భావాలను పాదసూచికలో కాపాడింది.
- issue: καὶ τῆς ἁγνότητος చేర్పు
  choice: ‘పవిత్రత’ను ప్రధాన పాఠంలో చేర్చడం
  alternative: దాన్ని విడిచిపెట్టడం
  rationale: SBLGNT ప్రధాన పాఠంలో ఈ మాటలు ఉన్నాయి; అందువల్ల అవి అనువదించబడ్డాయి. కొన్ని ప్రతుల్లో లేని పాఠభేదాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. దీర్ఘమైన గ్రీకు వాక్య నిర్మాణాన్ని తెలుగు వాక్యక్రమానికి మార్చినా పోలిక, భయం, సంభావ్యత, మెస్సీయ పట్ల ఉన్న నిష్కపటత మరియు పవిత్రత అనే సంబంధాలు యథాతథంగా నిలిపబడ్డాయి.
