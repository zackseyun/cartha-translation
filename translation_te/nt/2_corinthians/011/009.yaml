    text: లేదా, ‘నేను ఎవరి మీదా భారం మోపలేదు.’ గ్రీకు క్రియ ఎవరి మీదనైనా భారం మోపడాన్ని, ముఖ్యంగా ఆర్థిక భారంగా మారడాన్ని సూచించగలదు.
