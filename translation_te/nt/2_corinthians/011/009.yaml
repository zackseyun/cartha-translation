id: 2CO.11.9
reference: 2 Corinthians 11:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: te
  text: నేను మీతో ఉన్నప్పుడు నాకు కొదువ కలిగినా, ఎవరికీ భారంగా ఉండలేదు[a]; ఎందుకంటే మాసిదోనియా నుండి వచ్చిన సోదరులు[b] నా కొదువను తీర్చారు. ప్రతి విషయంలోనూ నేను మీకు భారంగా ఉండకుండా నన్ను నేను కాపాడుకున్నాను; ఇకముందూ అలాగే కాపాడుకుంటాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను ఎవరి మీదా భారం మోపలేదు.’ గ్రీకు క్రియ ఎవరి మీదనైనా భారం మోపడాన్ని, ముఖ్యంగా ఆర్థిక భారంగా మారడాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: ‘సోదరులు’ అనే పదం గ్రీకులో పుంలింగ బహువచనం. సందర్భాన్నిబట్టి పౌలు దీనిని తోటి విశ్వాసులను విస్తృతంగా సూచించడానికి వాడగలడు; అయితే ఇక్కడ ఇది మాసిదోనియా నుండి వచ్చిన నిర్దిష్ట సహోద్యోగులను సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: నేను మీతో ఉన్నప్పుడు
  rationale: కాలసూచక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, పౌలు వ్యక్తిగతంగా వారితో ఉన్నాడనే అర్థాన్ని నిలుపుతుంది.
- source_word: ὑστερηθεὶς
  choice: నాకు కొదువ కలిగినా
  rationale: ఈ కర్తరి కాని భూతకాల కృదంతం వస్తుపరమైన అవసరాన్ని లేదా లోటును అనుభవించడాన్ని సూచిస్తుంది. ‘కొదువ కలిగినా’ అనే రూపం సందర్భంలోని ఆర్థిక లోటును సహజంగా తెలియజేస్తుంది.
- source_word: οὐ κατενάρκησα οὐθενός
  choice: ఎవరికీ భారంగా ఉండలేదు
  rationale: καταναρκάω ఇక్కడ ముఖ్యంగా ఆర్థికంగా ఇతరులపై భారం కావడాన్ని సూచిస్తుంది; οὐθενός భావాన్ని ‘ఎవరికీ’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ ὑστέρημά μου
  choice: నాకు కొదువైనదాన్ని
  rationale: అమూర్తమైన ‘నా కొదువ’ కంటే, లోటుగా ఉన్నదాన్ని సూచించే ఈ ప్రయోగం తెలుగులో సహజంగా ఉండి మూలార్థాన్ని కాపాడుతుంది.
- source_word: προσανεπλήρωσαν
  choice: సమకూర్చారు
  rationale: లోటును అదనంగా పూరించడం లేదా అవసరమైనదాన్ని అందించడం అనే సమాస క్రియ భావాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది.
- source_word: οἱ ἀδελφοὶ
  choice: సోదరులు
  rationale: మూలంలోని పుంలింగ బహువచనాన్ని నిలుపుతుంది. ఈ సందర్భంలో మాసిదోనియా నుండి వచ్చిన నిర్దిష్ట సహోద్యోగులను సూచించే అవకాశం ఉంది.
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: మాసిదోనియా నుండి వచ్చిన
  rationale: భూతకాల కృదంతాన్ని తెలుగులో సహజమైన విశేషణ ఉపవాక్యంగా మార్చి, వారు వచ్చిన ప్రాంతాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: ἐν παντί
  choice: ప్రతి విషయంలోనూ
  rationale: పౌలు ఏ విధంగానూ వారికి భారం కాకుండా ఉన్నాడనే విస్తృత పరిధిని అతిగా నిర్దిష్టం చేయకుండా వ్యక్తం చేస్తుంది.
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: నేను మీకు భారంగా ఉండకుండా
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్త నిర్మాణాన్ని సహజమైన తెలుగులో విస్తరించి, ముఖ్యంగా ఆర్థిక భారం కాకపోవడం అనే సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: ἐτήρησα καὶ τηρήσω
  choice: చూసుకున్నాను; ఇకముందూ అలాగే చూసుకుంటాను
  rationale: భారంగా ఉండని స్థితిని గతంలో పాటించాననీ భవిష్యత్తులోనూ కొనసాగిస్తాననీ తెలిపే క్రియల కాలభేదాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ἀδελφοὶ పదంలోని లింగ సూచన
  choice: సోదరులు
  alternative: సోదర సోదరీమణులు / తోటి విశ్వాసులు
  rationale: గ్రీకు రూపం పుంలింగ బహువచనం. పౌలు ఈ పదాన్ని కొన్నిసార్లు విశ్వాసులందరికీ విస్తృతంగా వాడినా, ఇక్కడ మాసిదోనియా నుండి వచ్చిన నిర్దిష్ట సహోద్యోగులను సూచించే అవకాశం ఎక్కువ. అందువల్ల ప్రధాన పాఠ్యంలో పుంలింగ రూపాన్ని ఉంచి, సాధ్యమైన విస్తృత ప్రయోగాన్ని పాదసూచికలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘కొదువ’, ‘భారంగా ఉండడం’, ‘సమకూర్చడం’ వంటి సాధారణ పదాలు ఆర్థిక సందర్భాన్ని స్పష్టంగా ఉంచుతాయి. మూలంలోని గత చర్య మరియు భవిష్యత్ సంకల్పం రెండూ వేరుగా వ్యక్తమయ్యాయి.
