    text: లేదా, ‘న్యాయం.’ గ్రీకు పదానికి ‘నీతి,’ ‘న్యాయం’ అనే రెండు అర్థాలూ ఉండవచ్చు; ఇక్కడ సరైనదానితో అనుసంధానమైనవారిగా కనిపించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  revision_rationale: The revision removes a minor Telugu syntactic ambiguity by making clear that the servants assume the role of servants of righteousness. It also replaces the less idiomatic ‘క్రియలు’ with ‘కార్యాలు.’ The source meaning, register, theological restraint, and lexical-alternative footnote are preserved.
