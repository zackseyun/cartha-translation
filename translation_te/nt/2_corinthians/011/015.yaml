id: 2CO.11.15
reference: 2 Corinthians 11:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: te
  text: కాబట్టి, అతని సేవకులు కూడా నీతిసేవకులుగా వేషం వేసుకుంటే ఆశ్చర్యమేమీ లేదు. వారి కార్యాలకు తగినట్లే వారి అంతం ఉంటుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μέγα
  choice: ఆశ్చర్యమేమీ లేదు
  rationale: ఇది గొప్పది కాదనే అక్షరార్థం కంటే, సందర్భంలో ‘ఇది ఆశ్చర్యకరం కాదు’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి వాక్యం నుంచి తీసుకున్న నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: διάκονοι
  choice: సేవకులు
  rationale: ఇక్కడ సాతాను తరఫున పనిచేసే వారిని సూచిస్తుంది; సంఘపరమైన సానుకూల భావం కలిగించగల ‘పరిచారకులు’ లేదా ‘పరిచర్యకులు’ కంటే ‘సేవకులు’ స్పష్టంగా ఉంటుంది.
- source_word: μετασχηματίζονται
  choice: వేషం వేసుకుంటే
  rationale: అంతరంగ మార్పును కాక, మోసపూరితమైన బాహ్య రూపాన్ని లేదా పాత్రను ధరించడాన్ని సూచిస్తుంది.
- source_word: ὡς
  choice: వేషం వేసుకుంటే అనే నిర్మాణంలో ‘గా’ భావం
  rationale: వారు నిజంగా అలాంటి వారు కాకపోయినా, ఆ పాత్రలో కనిపించడాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: ఈ సందర్భంలో న్యాయవిచారణకన్నా సరైనదానితో, నైతిక యథార్థతతో అనుసంధానమైనట్లు కనిపించడమే ప్రధాన భావం; ‘న్యాయం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: τὸ τέλος
  choice: వారి అంతం
  rationale: వారికి చివరికి కలిగే ఫలితాన్ని లేదా తీర్పులో ఎదురయ్యే గమ్యాన్ని సంక్షిప్తంగా సూచిస్తుంది.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: వారి క్రియలకు తగినట్టే
  rationale: వారి చివరి ఫలితం వారి కార్యాలకు అనుగుణంగా ఉంటుందనే తీర్పు సూత్రాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: పౌలు వాడుకలో δικαιοσύνη పదం అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఇక్కడ తప్పుడు సేవకులు నైతికంగా సరైనవారిగా కనిపించడాన్ని ‘నీతి’ బాగా వ్యక్తం చేస్తుంది. అయినప్పటికీ గ్రీకు పదానికి ‘న్యాయం’ అనే అర్థం కూడా ఉండగలదు కాబట్టి దాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరతను నిలుపుతూ అనువదించాం. ‘వేషం వేసుకుంటే’ మోసపూరిత బాహ్య రూపాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘అంతం’ తీర్పు సందర్భంలోని గంభీరతను నిలుపుతుంది.
