revisions:
- from: కాబట్టి, అతని సేవకులు కూడా నీతి[a] సేవకుల వేషం వేసుకుంటే ఆశ్చర్యమేమీ లేదు. వారి క్రియలకు తగినట్టే వారి అంతం ఉంటుంది.
  to: కాబట్టి, అతని సేవకులు కూడా నీతిసేవకులుగా వేషం వేసుకుంటే ఆశ్చర్యమేమీ లేదు. వారి కార్యాలకు తగినట్లే వారి అంతం ఉంటుంది.
  rationale: The revision removes a minor Telugu syntactic ambiguity by making clear that the servants assume the role of servants of righteousness. It also replaces the less idiomatic ‘క్రియలు’ with ‘కార్యాలు.’ The source meaning, register, theological restraint, and lexical-alternative footnote are preserved.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T07:59:16Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential force of οὖν, the non-surprising sense of οὐ μέγα, the deceptive outward presentation denoted by μετασχηματίζονται, and the final outcome corresponding to their deeds. ‘అతని’ appropriately retains the antecedent from the preceding context without adding it to this verse.
  naturalness: The conditional construction is natural, but ‘నీతి సేవకుల వేషం’ is slightly ambiguous in Telugu, as though the disguise belongs to servants rather than that they present themselves in that role. ‘నీతిసేవకులుగా వేషం వేసుకుంటే’ states the assumed role more directly. ‘కార్యాలు’ is more natural and suitably formal here than ‘క్రియలు.’
  terminology: ‘సేవకులు’ appropriately renders διάκονοι in this non-ecclesiastical, deceptive context. ‘నీతి’ suitably renders δικαιοσύνη, and the footnote responsibly preserves ‘న్యాయం’ as a lexical alternative. ‘అంతం’ and ‘కార్యాలకు తగినట్లే’ preserve the judgment-result and correspondence language without overstating it.
  issues:
  - severity: low
    issue: Ambiguity in ‘నీతి సేవకుల వేషం’
    rationale: This genitive-like sequence can be read as ‘the disguise of servants of righteousness.’ Rendering the role with ‘నీతిసేవకులుగా’ more clearly expresses ὡς διάκονοι δικαιοσύνης.
  - severity: low
    issue: ‘క్రియలు’ is less idiomatic in this context
    rationale: For ἔργα in a moral evaluation formula, ‘కార్యాలు’ is natural modern standard Telugu and retains the sense of deeds/works.
  revised_text: కాబట్టి, అతని సేవకులు కూడా నీతిసేవకులుగా వేషం వేసుకుంటే ఆశ్చర్యమేమీ లేదు. వారి కార్యాలకు తగినట్లే వారి అంతం ఉంటుంది.
  revised_footnotes:
