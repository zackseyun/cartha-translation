id: 2CO.11.16
reference: 2 Corinthians 11:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πάλιν λέγω, μή τίς με δόξῃ ἄφρονα εἶναι— εἰ δὲ μή γε, κἂν ὡς ἄφρονα δέξασθέ με, ἵνα κἀγὼ μικρόν τι καυχήσωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: te
  text: 'మళ్లీ చెబుతున్నాను: ఎవరూ నన్ను అవివేకినని అనుకోవద్దు. కానీ అలా కాకపోతే, నేనూ కొంచెం గొప్పలు చెప్పుకొనేందుకు అవివేకినిగానైనా నన్ను స్వీకరించండి.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: మళ్లీ చెబుతున్నాను
  rationale: పౌలు తన విజ్ఞప్తిని పునరావృతం చేస్తున్న భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: ఎవరూ నన్ను అవివేకినని అనుకోవద్దు
  rationale: μή తో కూడిన subjunctive యొక్క నిషేధార్థాన్ని నిలుపుతూ, δοκέω మరియు infinitive నిర్మాణాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἄφρονα
  choice: అవివేకినని / అవివేకినిగా
  rationale: ἄφρων సూచించే వివేకరాహిత్యాన్ని తెలియజేస్తుంది; రెండు చోట్ల ఒకే పదాన్ని వాడడం పౌలు వ్యంగ్యంగా స్వీకరిస్తున్న ఆరోపణను స్పష్టంగా ఉంచుతుంది.
- source_word: εἰ δὲ μή γε
  choice: ఒకవేళ అలా చేయలేకపోతే
  rationale: ముందటి విజ్ఞప్తిని వారు అంగీకరించకపోతే కనీసం తరువాత చెప్పేదైనా చేయాలనే ప్రత్యామ్నాయ రాయితీని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: అవివేకినిగానైనా నన్ను స్వీకరించండి
  rationale: κἂν లోని concessive భావాన్ని ‘అయినా’ ద్వారా, imperative యొక్క ప్రత్యక్షతను ‘స్వీకరించండి’ ద్వారా నిలుపుతుంది.
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: అప్పుడు నేను కూడా కొంచెం గొప్పలు చెప్పుకోగలను
  rationale: ἵνα యొక్క సందర్భోచిత ఉద్దేశం/ఫలిత భావాన్ని, κἀγώ లోని ‘నేను కూడా’ అనే నొక్కిచెప్పడాన్ని, καυχάομαι లోని గొప్పలు చెప్పుకోవడం అనే ఉద్దేశపూర్వక పదప్రయోగాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ἄφρων అనే పదంతో పౌలు చేసుకున్న వ్యంగ్య స్వవర్ణన
  choice: ‘అవివేకి’ మరియు ‘గొప్పలు చెప్పుకోవడం’ అనే బలమైన పదాలను అలాగే ఉంచడం
  alternative: ‘తొందరపడి మాట్లాడేవాడు’ వంటి మృదువైన వివరణాత్మక పదాలతో మార్చడం
  rationale: తాను అవివేకిగా కనిపించవచ్చని రాయితీ ఇచ్చి, అయిష్టంగానే గొప్పలు చెప్పుకోబోతున్న పౌలు వాక్చాతుర్యంలోని ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన పౌలు వాక్చాతుర్యాన్ని నిలుపుతూ రూపొందించబడింది. ఎమ్ డాష్‌కు బదులుగా వాక్య విభజనను ఉపయోగించి తెలుగు ప్రవాహాన్ని మెరుగుపరచింది.
