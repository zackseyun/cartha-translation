id: 2CO.11.2
reference: 2 Corinthians 11:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: te
  text: నేను మీ పట్ల దేవుని అసూయతో[a] అసూయపడుతున్నాను; ఎందుకంటే, మిమ్మల్ని ఒకే భర్తకు[b] నిశ్చితార్థం చేసి, నిర్మలమైన కన్యగా మెస్సీయకు సమర్పించడానికి ఇలా చేశాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దైవికమైన అసూయతో.” గ్రీకు పదబంధం దేవునికి చెందిన అసూయనో, దేవుని స్వభావానికి తగిన అసూయనో సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదబంధానికి “ఒకే పురుషునికి” అని కూడా అర్థం కావచ్చు; ఇక్కడ వివాహ రూపకాన్ని బట్టి “ఒకే భర్తకు” అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλῶ
  choice: అసూయపడుతున్నాను
  rationale: వివాహ-నిశ్చితార్థ రూపకంలో ఈ క్రియ చిన్నబుద్ధిగల ఈర్ష్యను కాక, సంబంధాన్ని కాపాడే ఒడంబడికపరమైన అసూయను సూచిస్తుంది; అందువల్ల ‘ఆసక్తి చూపుతున్నాను’ అని మృదువుచేయకుండా మూలంలోని ఉద్వేగాన్ని నిలిపింది.
- source_word: θεοῦ ζήλῳ
  choice: దేవుని అసూయతో
  rationale: θεοῦ అనే షష్ఠీ విభక్తి దేవునికి చెందిన అసూయను లేదా దేవుని లక్షణానికి తగిన అసూయను సూచించవచ్చు; ప్రధాన పాఠం నేరుగా ఉన్న నిర్మాణాన్ని కాపాడి, ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో తెలిపింది.
- source_word: ἡρμοσάμην
  choice: నిశ్చయించాను
  rationale: వివాహానికి కుదిర్చడం లేదా నిశ్చితార్థం చేయడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἑνὶ ἀνδρὶ
  choice: ఒకే భర్తకు
  rationale: ἀνήρ సాధారణంగా ‘పురుషుడు’ అని కూడా అర్థమవుతుంది; అయితే వధువు-నిశ్చితార్థ రూపకంలో ‘భర్త’ సందర్భోచితమైన భావం. ‘ఒకే’ అనేది ἑνίలోని ఏకైకత్వాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: παρθένον ἁγνὴν
  choice: పవిత్రమైన కన్యగా
  rationale: కన్యత్వం మరియు నైతిక నిర్మలత్వం కలిసిన వధువు రూపకాన్ని సహజంగా కాపాడుతుంది.
- source_word: παραστῆσαι
  choice: సమర్పించడానికి
  rationale: ఒకరిని మరొకరి ఎదుట అధికారికంగా తీసుకువచ్చి అప్పగించడం లేదా సమర్పించడం అనే పౌలు వాడుకకు తగిన గంభీరమైన తెలుగు పదం.
- source_word: τῷ Χριστῷ
  choice: మెస్సీయకు
  rationale: ఇక్కడ Χριστός నిర్దిష్ట వరుడి బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించడం బిరుదు భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పౌలు చెప్పే అసూయ స్వభావం
  choice: దేవుని ఒడంబడికపరమైన, సంబంధాన్ని కాపాడే అసూయను ప్రతిబింబించే అసూయగా ఉంచబడింది.
  alternative: దైవిక సంబంధ సూచన లేని పౌలు వ్యక్తిగత ఉత్సాహం మాత్రమే.
  rationale: θεοῦ ζήλῳ మరియు వివాహ రూపకం కలిసి దేవుని ప్రత్యేక హక్కును కాపాడే అసూయను సూచిస్తాయి; అయినా షష్ఠీ విభక్తి యొక్క స్వభావాన్ని పూర్తిగా నిర్ణయించకుండా పాదసూచికలో ప్రత్యామ్నాయాన్ని ఉంచాం.
- issue: Χριστός పదం బిరుదా, పేరులాంటి వాడుకా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: నిర్దిష్ట వరుడు అనే రూపక సందర్భంలో ఇది అభిషిక్తుడైన వ్యక్తి బిరుదుగా స్పష్టంగా పనిచేస్తుంది; ‘క్రీస్తు’ అనే సంప్రదాయ రూపం సాధ్యమే అయినా బిరుదు భావం ‘మెస్సీయ’లో మరింత ప్రత్యక్షంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి పాటించబడింది. గ్రీకు వాక్యంలోని కారణసూచక పునరుక్తి తెలుగులో ప్రవాహం కోసం రెండు వాక్యాలుగా అమర్చబడింది. ‘అసూయ’ అనే ఉద్వేగభరిత పదాన్ని మృదువుచేయకుండా, దాని సానుకూల ఒడంబడిక సందర్భాన్ని పాదసూచిక మరియు పదనిర్ణయ వివరణలో స్పష్టం చేశాం.
