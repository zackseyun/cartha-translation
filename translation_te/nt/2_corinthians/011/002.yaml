- from: ఎందుకంటే, దేవుని అసూయతో[a] మీ విషయమై నేను అసూయపడుతున్నాను. మిమ్మల్ని పవిత్రమైన కన్యగా మెస్సీయకు సమర్పించడానికి, మిమ్మల్ని ఒకే భర్తకు[b] నిశ్చయించాను.
