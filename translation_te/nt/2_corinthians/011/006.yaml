id: 2CO.11.6
reference: 2 Corinthians 11:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ἰδιώτης τῷ λόγῳ, ἀλλ’ οὐ τῇ γνώσει, ἀλλ’ ἐν παντὶ ⸀φανερώσαντες ἐν πᾶσιν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: te
  text: నేను మాట్లాడటంలో శిక్షణ లేనివాడినైనా[a], జ్ఞానంలో మాత్రం అలాంటివాడిని కాను. నిజానికి, ప్రతి విధంగాను, అన్ని విషయాల్లోను మేము దీన్ని మీకు స్పష్టం చేశాం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాట్లాడే నైపుణ్యంలో నేర్పు లేనివాడినైనా”; అంటే మెరుగైన వాక్చాతుర్యంలో శిక్షణ లేనివాడు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు వాక్యం సంక్షిప్తంగా ఉంది. దీన్ని “అన్ని విషయాల్లో మేము దీన్ని మీకు స్పష్టం చేశాం” లేదా “అందరి మధ్య అన్ని విధాలుగా మీకు స్పష్టం చేశాం” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης τῷ λόγῳ
  choice: మాట్లాడటంలో శిక్షణ లేనివాడు
  rationale: ఇక్కడ ἰδιώτης సాధారణ అజ్ఞానాన్ని కాక, మెరుగుపరచబడిన వాక్చాతుర్యంలో అధికారిక శిక్షణ లేకపోవడాన్ని సూచిస్తుంది; τῷ λόγῳ దాని రంగాన్ని, అంటే మాట్లాడే నైపుణ్యాన్ని, నిర్దేశిస్తుంది.
- source_word: γνώσει
  choice: జ్ఞానంలో
  rationale: పౌలు మాట్లాడే శైలికి విషయజ్ఞానాన్ని వ్యతిరేకంగా ఉంచుతున్నందున నేరుగా, సహజంగా ఉన్న ‘జ్ఞానం’ సరిపోతుంది.
- source_word: φανερώσαντες
  choice: మేము దీన్ని మీకు స్పష్టం చేశాం
  rationale: రూపపరంగా ఇది భూతకాల కృదంతమైనప్పటికీ, సందర్భంలో బహిరంగంగా వెల్లడించి నిరూపించిన భావాన్ని తెలిపే ప్రధాన ప్రకటనలా పనిచేస్తుంది.
- source_word: ἐν παντί ... ἐν πᾶσιν
  choice: ప్రతి విషయంలో, అన్ని విధాలుగా
  rationale: రెండు సమగ్రతా పదబంధాల పునరుక్తిని నిలుపుతూ, అవి విషయాలు, సందర్భాలు లేదా ప్రజలను సూచించవచ్చనే సంక్షిప్త గ్రీకు నిర్మాణంలోని అస్పష్టతను ప్రధాన పాఠ్యంలో సహజంగా అందిస్తుంది.
- source_word: εἰς ὑμᾶς
  choice: మీకు
  rationale: కొరింథీయులు ఈ వెల్లడికి గ్రహీతలని సహజమైన తెలుగులో సూచిస్తుంది.
theological_decisions:
- issue: పౌలు తన మాట్లాడే సామర్థ్యాన్ని వర్ణించిన భావం
  choice: మెరుగైన వాక్చాతుర్యంలో శిక్షణ లేకపోవడాన్ని ఒప్పుకుంటున్నాడు; జ్ఞానం లేదని కాదు
  alternative: పౌలు సాధారణంగా చదువులేనివాడు; లేదా ఏ లోపాన్నీ ఒప్పుకోకుండా పూర్తిగా వ్యంగ్యంగా మాట్లాడుతున్నాడు
  rationale: ‘మాట/మాట్లాడటం’ మరియు ‘జ్ఞానం’ మధ్యనున్న ప్రత్యక్ష వ్యత్యాసం, సమస్య సత్యం లేదా అధికారంకన్నా ప్రసంగ నైపుణ్యమని సూచిస్తుంది.
- issue: ἐν παντί ... ἐν πᾶσιν యొక్క పరిధి
  choice: ‘ప్రతి విషయంలో, అన్ని విధాలుగా’ అని విస్తృతంగా ఉంచడం
  alternative: ‘అందరి మధ్య’ లేదా ‘ప్రతి సందర్భంలో’ అని నిర్దిష్టంగా అర్థం చేయడం
  rationale: గ్రీకు వాక్యం సంక్షిప్తంగా ఉండి వ్యక్తులు, విషయాలు, పరిస్థితులు అనే దగ్గరి అవకాశాలకు వీలు ఇస్తుంది; అనవసరంగా ఒక్కదానిని ఖరారు చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘మాట్లాడటంలో శిక్షణ లేనివాడు’ అనే రూపం వాక్చాతుర్య శిక్షణ భావాన్ని సాధారణ పాఠకుడికి స్పష్టంగా చేస్తుంది. చివరి గ్రీకు పదబంధంలోని నిజమైన అస్పష్టతను పాదసూచనలో నిలిపాం.
