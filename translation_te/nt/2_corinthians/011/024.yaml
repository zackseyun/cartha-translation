lexical_decisions:
- source_word: ὑπὸ Ἰουδαίων
  choice: యూదుల చేత
  rationale: ὑπό + షష్ఠీ విభక్తి శిక్షను అమలు చేసిన వ్యక్తులను సూచిస్తుంది. ‘యూదుల చేత’ మూలంలోని కర్తృత్వాన్ని నిలుపుతుంది; నిర్దిష్టమైన అధికార సంస్థను అనవసరంగా చేర్చదు.
- source_word: πεντάκις
  choice: ఐదుసార్లు
  rationale: ఈ క్రియావిశేషణానికి నేరుగా ‘ఐదుసార్లు’ అనే అర్థం; పౌలు పదేపదే అనుభవించిన శిక్షను సహజంగా తెలియజేస్తుంది.
- source_word: τεσσεράκοντα παρὰ μίαν
  choice: నలభై కొరడా దెబ్బలకు ఒకటి తక్కువగా
  rationale: మూలంలోని ‘నలభైకి ఒకటి తక్కువ’ అనే నిర్మాణాన్ని నిలుపుతూ, ἔλαβον సందర్భంలో అంతర్లీనంగా ఉన్న దెబ్బల భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ἔλαβον
  choice: పొందాను
  rationale: λαμβάνω యొక్క ప్రాథమిక ‘పొందు/స్వీకరించు’ భావాన్ని నిలుపుతుంది. ఇక్కడ అది శిక్షకు గురికావడాన్ని సూచించినా, ‘భరించాను’ అని అనువదించడం క్రియలో లేని అదనపు భావాన్ని చేర్చుతుంది.
