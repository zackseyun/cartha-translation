id: 2CO.11.20
reference: 2 Corinthians 11:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀνέχεσθε γὰρ εἴ τις ὑμᾶς καταδουλοῖ, εἴ τις κατεσθίει, εἴ τις λαμβάνει, εἴ τις ἐπαίρεται, εἴ τις ⸂εἰς πρόσωπον ὑμᾶς⸃ δέρει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: te
  text: ఎందుకంటే, ఎవరైనా మిమ్మల్ని బానిసలుగా చేస్తే, ఎవరైనా మిమ్మల్ని మింగివేస్తే, ఎవరైనా మీ దగ్గర నుండి తీసుకుంటే[a], ఎవరైనా తనను తాను గొప్ప చేసుకుంటే, ఎవరైనా మీ ముఖం మీద కొడితే—మీరు సహిస్తారు కదా!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిమ్మల్ని దోచుకుంటే”; గ్రీకులో కేవలం “తీసుకుంటే” అని ఉంది, అయితే సందర్భం దోపిడీ భావాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: మీరు సహిస్తున్నారు కదా
  rationale: వర్తమానకాలంలోని వాస్తవ సహనాన్ని తెలియజేస్తూ, సందర్భంలోని వ్యంగ్య మందలింపును సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: కదా
  rationale: ముందటి వాక్యంతో ఉన్న వివరణాత్మక సంబంధాన్ని, తెలుగు వాక్యాంతంలో వ్యంగ్య ధృవీకరణతో సహజంగా తెలియజేస్తుంది.
- source_word: καταδουλοῖ
  choice: మిమ్మల్ని బానిసలుగా చేసుకున్నా
  rationale: బానిసత్వానికి లేదా సంపూర్ణ అధీనానికి లోబరచే బలమైన భావాన్ని మెత్తబరచకుండా నిలుపుతుంది.
- source_word: κατεσθίει
  choice: మిమ్మల్ని మింగివేసినా
  rationale: దోపిడీని సూచించే సజీవమైన భక్షణ రూపకాన్ని నిలుపుతుంది.
- source_word: λαμβάνει
  choice: మీది తీసుకున్నా
  rationale: గ్రీకు క్రియలోని ఉద్దేశపూర్వక విస్తృతిని నిలుపుతూ, సందర్భంలోని దోపిడీ భావాన్ని సూచిస్తుంది; డబ్బు వంటి ఒక నిర్దిష్ట వస్తువుకు పరిమితం చేయదు.
- source_word: ἐπαίρεται
  choice: తనను తాను గొప్ప చేసుకున్నా
  rationale: తన్నుతాను పైకెత్తుకునే లేదా అహంకారంగా ప్రవర్తించే ప్రతిఫల భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: మీ ముఖం మీద కొట్టినా
  rationale: అవమానకరమైన శారీరక చర్యను స్పష్టంగా ఉంచుతూ, దానిని కేవలం చెంపదెబ్బగా అనవసరంగా సంకుచితం చేయదు.
- source_word: εἴ τις
  choice: ఎవరైనా
  rationale: ప్రతి షరతులోని ఏకవచన అనిర్దిష్ట వ్యక్తిని, పునరావృత అలంకార బలంతో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పౌలు మాటలోని వ్యంగ్య ధోరణి
  choice: కొరింథీయులు దోపిడీ చేసే వ్యక్తులను సహిస్తున్నారనే వ్యంగ్య మందలింపుగా అనువదించడం; ప్రధాన పాఠ్యంలో వారిని ‘అబద్ధ అపొస్తలులు’ అని పేరుపెట్టకపోవడం
  alternative: దుర్వినియోగం చేసేవారిని అబద్ధ అపొస్తలులు లేదా బోధకులు అని స్పష్టంగా చేర్చడం
  rationale: విస్తృత సందర్భం వ్యంగ్యాన్ని, అబద్ధ అపొస్తలుల నేపథ్యాన్ని సమర్థిస్తుంది; అయితే ఈ వచనంలోని గ్రీకు పాఠ్యం వ్యక్తుల పేరును కాక వారి చర్యలను మాత్రమే పేర్కొంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. పునరావృతమైన ‘ఎవరైనా’ నిర్మాణం వాక్యంలోని ఆరోపణాత్మక లయను నిలుపుతుంది; చివరి ‘కదా!’ సందర్భంలోని వ్యంగ్యాన్ని తెలియజేస్తుంది.
