review_pass:
  verdict: revise
  source_fidelity: The repeated conditional structure, slavery imagery, devouring metaphor, self-exaltation, and physical blow to the face are retained. A revision is needed because the draft does not explicitly convey γάρ ('for/because') and its footnote's proposed alternative, “మిమ్మల్ని పట్టుకున్నా,” is not a sound contextual alternative for λαμβάνει here.
  naturalness: The repeated “ఎవరైనా” is effective and idiomatic. “మీది తీసుకున్నా” is somewhat elliptical in modern Telugu; “మీ దగ్గర నుండి తీసుకుంటే” is clearer while retaining the Greek's unspecified object. Using conditional present forms also better matches the repeated εἴ τις clauses.
  terminology: “బానిసలుగా చేస్తే” appropriately preserves καταδουλοῖ without softening it. “తనను తాను గొప్ప చేసుకుంటే” accurately expresses self-exaltation, and “మీ ముఖం మీద కొడితే” preserves the concrete force of the final clause.
  issues:
  - severity: medium
    issue: γάρ is not explicitly represented.
    rationale: The final “కదా” conveys rhetorical irony but does not adequately carry the explanatory connective γάρ. “ఎందుకంటే” naturally retains the connection in Telugu.
  - severity: medium
    issue: The footnote alternative for λαμβάνει is misleading.
    rationale: “మిమ్మల్ని పట్టుకున్నా” shifts the sense toward physically seizing the readers and does not reflect the contextual sense of exploitative taking. The Greek verb remains broad, though the context likely implies exploitation.
  - severity: low
    issue: “మీది తీసుకున్నా” is awkwardly elliptical.
    rationale: “మీ దగ్గర నుండి తీసుకుంటే” is natural modern Telugu and makes explicit the relational implication supplied by the context, without specifying what is taken.
