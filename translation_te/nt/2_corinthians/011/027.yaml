id: 2CO.11.27
reference: 2 Corinthians 11:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀κόπῳ καὶ μόχθῳ, ἐν ἀγρυπνίαις πολλάκις, ἐν λιμῷ καὶ δίψει, ἐν νηστείαις πολλάκις, ἐν ψύχει καὶ γυμνότητι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/027.yaml
  text: in labor and hardship[a], in many sleepless nights, in hunger and thirst, in frequent fastings[b], in cold and exposure.
translation:
  language: te
  text: శ్రమలోను కష్టంలోను, తరచుగా నిద్రలేని రాత్రుల్లోను, ఆకలిదప్పుల్లోను, తరచుగా ఉపవాసాల్లోను[a], చలిలోను వస్త్రహీనతలోను[b] ఉన్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘ఉపవాసాలు’ అనేది స్వచ్ఛందంగా చేసిన ఉపవాసాలను లేదా పరిస్థితులవల్ల ఆహారం లేక పస్తులుండడాన్ని సూచించవచ్చు; గ్రీకు పాఠం ఏదో స్పష్టం చేయదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘సరిపడా వస్త్రాలు లేక వాతావరణానికి బహిర్గతం కావడంలోను.’ గ్రీకు పదానికి ‘నగ్నత’ అనే అర్థం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόπῳ
  choice: శ్రమలోను
  rationale: κόπος కఠినమైన శ్రమను లేదా ప్రయాసను సూచిస్తుంది. ‘శ్రమ’ సాధారణ ఆధునిక తెలుగులో సహజంగా ఉండి, తరువాతి μόχθοςతో ఉన్న భావసామీప్యాన్ని నిలుపుతుంది.
- source_word: μόχθῳ
  choice: కష్టంలోను
  rationale: μόχθος శ్రమతో కూడిన బాధను, కష్టాన్ని సూచిస్తుంది. ‘కష్టం’ అని అనువదించడం వల్ల κόποςతో ఒకే పదాన్ని పునరావృతం చేయకుండా పౌలు ఉపయోగించిన సమీపార్థక జంట నిలుస్తుంది.
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: తరచుగా నిద్రలేని రాత్రుల్లోను
  rationale: ἀγρυπνία మేల్కొని ఉండడాన్ని లేదా నిద్రలేమిని సూచిస్తుంది; బహువచనం మరియు πολλάκις పునరావృతమైన నిద్రలేని సందర్భాలను తెలియజేస్తాయి. తెలుగులో ‘నిద్రలేని రాత్రులు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: ἐν λιμῷ καὶ δίψει
  choice: ఆకలిదప్పుల్లోను
  rationale: λιμός మరియు δίψος అనుభవించిన ఆకలి, దప్పులను సూచిస్తాయి. ‘ఆకలిదప్పులు’ సహజమైన తెలుగు జంటపదంగా గ్రీకు జాబితా సంక్షిప్తతను నిలుపుతుంది.
- source_word: ἐν νηστείαις πολλάκις
  choice: తరచుగా ఉపవాసాల్లోను[a]
  rationale: νηστεία ఉపవాసాన్ని సూచిస్తుంది; λιμός ఇప్పటికే ఆకలిని పేర్కొన్నందున రెండింటినీ ఒకే భావంగా కలపలేదు. అవి స్వచ్ఛంద ఉపవాసాలా లేక పరిస్థితులవల్ల ఆహారం లేకపోవడమా అన్నది మూలపాఠం స్పష్టం చేయదు; ఆ సందిగ్ధతను పాదసూచికలో నిలిపాం.
- source_word: ἐν ψύχει
  choice: చలిలోను
  rationale: ψῦχος అనుభవించిన చలిని సూచిస్తుంది. ‘చలిలో’ సంక్షిప్తంగా, సహజంగా ఉంది.
- source_word: γυμνότητι
  choice: వస్త్రహీనతలోను[b]
  rationale: γυμνότης యొక్క ప్రత్యక్ష అర్థం నగ్నత లేదా వస్త్రహీనత. కష్టాల జాబితాలో ఇది సరిపడా వస్త్రాలు లేక వాతావరణానికి బహిర్గతం కావడాన్ని కూడా సూచించవచ్చు. ప్రధాన పాఠంలో మూలపదానికి దగ్గరైన ‘వస్త్రహీనత’ను ఉంచి, సందర్భానుగుణ భావాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: νηστείαις అనే పదం పౌలు కష్టాల జాబితాలో సూచించే భావం
  choice: ఉపవాసాలు
  alternative: ఆహారం దొరకక పస్తులుండడం లేదా పరిస్థితులవల్ల ఆహారానికి దూరమవడం
  rationale: గ్రీకు పదం సాధారణ ఆకలికన్నా ఉపవాసాన్ని నేరుగా సూచిస్తుంది; అంతేకాక λιμός ఇప్పటికే ఆకలిని పేర్కొంటుంది. అయితే ఈ ఉపవాసాలు స్వచ్ఛందమైనవా, పరిస్థితులవల్ల కలిగినవా అని వాక్యం నిర్ణయించదు; అందువల్ల ఆ ప్రశ్నను అనువాదం పరిష్కరించలేదు.
- issue: γυμνότητι యొక్క సందర్భానుగుణ భావం
  choice: వస్త్రహీనత
  alternative: సరిపడా వస్త్రాలు లేక చలికి, వాతావరణానికి బహిర్గతం కావడం
  rationale: మూలపదపు ప్రత్యక్ష భావాన్ని ప్రధాన పాఠంలో నిలిపాం. ఈ కష్టాల సందర్భంలో అది పూర్తిగా నగ్నంగా ఉండడం కంటే చాలినన్ని బట్టలు లేకపోవడాన్ని సూచించే అవకాశం ఉన్నందున ఆ భావాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వినిపించేలా, అయినా పౌలు క్రమంగా పేర్చిన కష్టాల జాబితా లయను నిలుపుతూ ప్రతి భాగంలో ‘లోను’ వాడాం. ముందరి వాక్యంతో వ్యాకరణ సంబంధం ఉన్నప్పటికీ, ఇచ్చిన వచనం విడిగా చదవడానికి చివర ‘ఉన్నాను’ చేర్చాం. భాష గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
