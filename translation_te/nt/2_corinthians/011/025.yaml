translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. వరుస కష్టాల జాబితాలోని సంక్షిప్తతను, సమాంతర నిర్మాణాన్ని నిలిపింది. పాదటిప్పణి గుర్తు సంబంధిత ‘నడి సముద్రంలో’ అన్న పదబంధం వెంట ఉంచబడింది.
