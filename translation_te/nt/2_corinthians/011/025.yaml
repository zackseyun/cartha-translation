id: 2CO.11.25
reference: 2 Corinthians 11:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τρὶς ἐραβδίσθην, ἅπαξ ἐλιθάσθην, τρὶς ἐναυάγησα, νυχθήμερον ἐν τῷ βυθῷ πεποίηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: te
  text: మూడుసార్లు కర్రలతో కొట్టబడ్డాను, ఒకసారి రాళ్లతో కొట్టబడ్డాను, మూడుసార్లు ఓడప్రమాదానికి గురయ్యాను; ఒక రాత్రీ ఒక పగలూ నడి సముద్రంలో[a] గడిపాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సముద్రపు అగాధ జలాల్లో.”
    reason: βυθός అనే పదం బహిరంగ సముద్రాన్నీ, లోతైన జలాలనూ సూచించగలిగే పదార్థ వైవిధ్యాన్ని నిలుపుటకు.
lexical_decisions:
- source_word: τρὶς
  choice: మూడుసార్లు
  rationale: రెండు సందర్భాల్లోనూ పునరావృతమైన మూడు ఘటనలను సహజంగా, స్థిరంగా తెలియజేస్తుంది.
- source_word: ἐραβδίσθην
  choice: కర్రలతో కొట్టబడ్డాను
  rationale: ῥαβδίζωలోని కర్రలతో కొట్టడం అనే నిర్దిష్ట భావాన్ని నిలుపుతుంది; సాధారణంగా ‘కొట్టబడ్డాను’ అని మాత్రమే అనలేదు.
- source_word: ἅπαξ
  choice: ఒకసారి
  rationale: ఒక్క ఘటనను తెలిపే సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἐλιθάσθην
  choice: రాళ్లతో కొట్టబడ్డాను
  rationale: λιθάζω సూచించే రాళ్లతో దాడి చేయడాన్ని స్పష్టంగా తెలియజేస్తుంది; సందర్భంలో లేని ఫలితాన్ని జోడించదు.
- source_word: ἐναυάγησα
  choice: ఓడప్రమాదానికి గురయ్యాను
  rationale: నౌకాభంగం లేదా ఓడప్రమాదం అనుభవించడాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: νυχθήμερον
  choice: ఒక రాత్రీ ఒక పగలూ
  rationale: రాత్రి-పగలు కాలవ్యవధిని మూలంలోని క్రమంతోనే నిలుపుతుంది; ‘ఇరవై నాలుగు గంటలు’ అనే మితిమీరిన ఖచ్చితత్వాన్ని రుద్దదు.
- source_word: ἐν τῷ βυθῷ
  choice: నడి సముద్రంలో
  rationale: βυθός ఇక్కడ సూచించే లోతైన లేదా బహిరంగ సముద్ర జలాల భావాన్ని పాఠకుడికి సహజంగా అందిస్తుంది; పదానికి ఉన్న ‘అగాధ జలాలు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
- source_word: πεποίηκα
  choice: గడిపాను
  rationale: కాలవ్యవధితో వాడిన ποιέωకు ‘కాలం గడపడం’ అనే సహజ తెలుగు అర్థాన్ని ఇస్తుంది; పరిపూర్ణ కాలంలోని గతానుభవాన్ని సందర్భానుసారంగా వ్యక్తం చేస్తుంది.
