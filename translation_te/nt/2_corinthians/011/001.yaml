  yaml_path: translation/nt/2_corinthians/011/001.yaml
  text: I wish you would bear with me in a little foolishness[a]. But indeed[b], do bear with me.
translation:
  language: te
  text: నేను కొద్దిపాటి అవివేకంగా మాట్లాడుతున్నప్పుడు నన్ను మీరు సహిస్తే బాగుండేది[a]. అయితే, నిజంగానే నన్ను సహించండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘కొద్దిపాటి అవివేకాన్ని మీరు నన్ను సహిస్తే.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నన్ను ఓర్చుకోండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὄφελον
  choice: సహిస్తే బాగుండును
  rationale: నెరవేరాలని కోరుకునే ఆశను తెలిపే ఈ అవ్యయ భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνείχεσθέ / ἀνέχεσθέ
  choice: సహిస్తే / సహించండి
  rationale: ἀνέχομαι ఇక్కడ ఓర్పుతో భరించడం లేదా సహించడం అనే భావాన్ని ఇస్తుంది. మొదటి వాక్యంలో కోరికను, రెండవ వాక్యంలో పునరుద్ఘాటించిన విజ్ఞప్తిని తెలుగు క్రియారూపాలు స్పష్టంగా చూపుతాయి.
- source_word: μου
  choice: నా / నన్ను
  rationale: మొదటి వాక్యంలో అవివేకంతో పౌలుకు ఉన్న సంబంధాన్ని ‘నా’ సహజంగా తెలుపుతుంది; పునరావృత విజ్ఞప్తిలో అదే వ్యక్తిగత భావాన్ని ‘నన్ను’ నేరుగా వ్యక్తం చేస్తుంది.
- source_word: μικρόν τι
  choice: కొంచెం
  rationale: పౌలు ఉపయోగించిన అల్పీకరణతో కూడిన వాక్చాతుర్యాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἀφροσύνης
  choice: అవివేకం
  rationale: ఈ పదంలోని foolishness/folly భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతూ, పౌలు తనను తాను వ్యంగ్యంగా తగ్గించుకొని మాట్లాడే తీరును కాపాడుతుంది.
- source_word: ἀλλὰ καὶ
  choice: నిజానికి
  rationale: ముందటి కోరికను బలపరుస్తూ మళ్లీ విజ్ఞప్తి చేసే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సాధారణ ‘కాని’ కంటే పునరుద్ఘాటనను మెరుగ్గా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పౌలు తన మాటలను ‘అవివేకం’గా పేర్కొనడం
  choice: ‘నా కొంచెం అవివేకం’ అనే స్వీయ-తగ్గింపు భావాన్ని యథాతథంగా నిలుపడం
  alternative: ‘నేను అవివేకంగా మాట్లాడడం’ అని సందర్భాన్ని స్పష్టీకరించడం
  rationale: ఈ వచనం పౌలు వ్యంగ్యంగా చెప్పబోయే అతిశయోక్తి విభాగాన్ని పరిచయం చేస్తుంది. మూలంలో స్పష్టంగా లేని ‘మాట్లాడడం’ వంటి పదాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా వాక్చాతుర్యంలోని ఉద్రిక్తతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. మొదటి వాక్యంలోని కోరిక, రెండవ వాక్యంలోని బలమైన ప్రత్యక్ష విజ్ఞప్తి వేరువేరు క్రియారూపాలతో నిలుపబడ్డాయి; మూలంలో లేని సందర్భ వివరణను ప్రధాన పాఠ్యంలో చేర్చలేదు.
