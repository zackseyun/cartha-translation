  yaml_path: translation/nt/2_corinthians/011/032.yaml
  text: In Damascus[a], the ethnarch of King Aretas was guarding the city of the Damascenes in order to seize me,
translation:
  language: te
  text: దమస్కులో అరేతా రాజుకు చెందిన జాతిపాలకుడు నన్ను పట్టుకోవడానికి దమస్కీయుల పట్టణాన్ని[a] కాపలా కాస్తూ ఉన్నాడు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దమస్కు పట్టణాన్ని.’ గ్రీకు మూలంలో అక్షరార్థంగా, ‘దమస్కీయుల పట్టణాన్ని’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: దమస్కులో
  rationale: ἐν తో కూడిన దత్తి విభక్తి ఇక్కడ స్థలాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘దమస్కులో’ సహజమైన రూపం.
- source_word: ἐθνάρχης
  choice: జాతిపాలకుడు
  rationale: ఈ పదం ఒక ప్రజావర్గం లేదా ప్రాంతంపై అధికారమున్న చారిత్రక పాలనా పదవిని సూచిస్తుంది. సాధారణమైన ‘అధికారి’ లేదా ‘పాలకుడు’ కంటే ‘జాతిపాలకుడు’ మూలపద ప్రత్యేకతను నిలుపుతుంది.
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: అరేత రాజు కింద ఉన్న
  rationale: సంబంధాన్ని తెలిపే షష్ఠీ నిర్మాణం ఈ జాతిపాలకుడు అరేత రాజుకు చెందినవాడని లేదా ఆయన అధికారంలో సేవచేసేవాడని సూచిస్తుంది; తెలుగులో ‘కింద ఉన్న’ ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐφρούρει
  choice: కాపలా కాస్తూ ఉన్నాడు
  rationale: అసంపూర్ణ భూతకాల క్రియ గతంలో కొనసాగుతున్న నిఘా చర్యను సూచిస్తుంది; ఈ రూపం ఆ కొనసాగింపు భావాన్ని కాపాడుతుంది.
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: దమస్కీయుల పట్టణానికి
  rationale: Δαμασκηνῶν అనేది ‘దమస్కీయులు’ అనే బహువచన షష్ఠీ రూపం. ‘దమస్కీయుల పట్టణం’ మూలంలోని అసాధారణమైన కానీ అర్థవంతమైన నిర్మాణాన్ని నిలుపుతుంది.
- source_word: πιάσαι με
  choice: నన్ను పట్టుకోవడానికి
  rationale: అనంత క్రియ కాపలా చర్య యొక్క ఉద్దేశాన్ని తెలుపుతుంది. ‘పట్టుకోవడానికి’ అనేది ‘అరెస్టు చేయడానికి’ కంటే తక్కువ వ్యాఖ్యానాత్మకంగా ఉండి, శత్రుత్వపూర్వకంగా అదుపులోకి తీసుకోవడాన్ని సహజంగా వ్యక్తపరుస్తుంది.
