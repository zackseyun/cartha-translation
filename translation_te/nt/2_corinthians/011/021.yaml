source:
  edition: SBLGNT
  text: κατὰ ἀτιμίαν λέγω, ὡς ὅτι ἡμεῖς ⸀ἠσθενήκαμεν· ἐν ᾧ δ’ ἄν τις τολμᾷ, ἐν ἀφροσύνῃ λέγω, τολμῶ κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: te
  text: మన అవమానానికే నేను చెబుతున్నాను:[a] మనం బలహీనులమై ఉన్నట్టుగా![b] అయితే, ఎవరైనా ఏ విషయంలో ధైర్యం చేస్తారో—నేను మూర్ఖత్వంతో మాట్లాడుతున్నాను[d]—ఆ విషయంలో నేనూ ధైర్యం చేస్తాను.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అవమానకరంగా నేను చెబుతున్నాను’; గ్రీకు నుడికారాన్ని ‘అవమానానికి గురయ్యే విధంగా చెబుతున్నాను’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మనం బలహీనులమై ఉన్నామన్నట్టు.’ తన ‘మూర్ఖపు’ ప్రగల్భాల సందర్భంలో పౌలు వ్యంగ్యంగా మాట్లాడుతున్నాడు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘ఎవరైనా ఏ విషయంలో ధైర్యం చేస్తారో.’ ‘గొప్పలు చెప్పడంలో’ అనే భావం చుట్టుపక్కల సందర్భంలో సూచితమవుతోంది.
    reason: implicit_object
  - marker: d
    text: లేదా, ‘నేను మూర్ఖునిలా మాట్లాడుతున్నాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: మనకు అవమానకరంగా చెప్పాలంటే
  rationale: ఈ గ్రీకు నుడికారం అవమానం లేదా అగౌరవం కలిగించే రీతిలో చెప్పడాన్ని సూచిస్తుంది. సందర్భంలో పౌలు తననూ తన సహచరులనూ బలహీనులుగా భావించిన దృష్టిని వ్యంగ్యంగా ప్రస్తావిస్తున్నాడు; ఈ అనువాదం ఆ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: λέγω
  choice: చెప్పాలంటే / మాట్లాడుతున్నాను
  rationale: మొదటి సందర్భంలో ఇది వాక్యారంభపు అలంకారిక వ్యాఖ్యగా, రెండవ సందర్భంలో మధ్యలో చేర్చిన స్వీయ హెచ్చరికగా ఉంది; అందువల్ల సందర్భానుసారంగా సహజమైన తెలుగు రూపాలు వాడబడ్డాయి.
- source_word: ὡς ὅτι
  choice: ఉన్నట్టుగా
  rationale: ఇది వాస్తవ నిర్ధారణ కాకుండా, కనిపించే విధానాన్ని లేదా వ్యంగ్యపూర్వక అంగీకారాన్ని పరిచయం చేస్తుంది.
- source_word: ἠσθενήκαμεν
  choice: మేము బలహీనులమై ఉన్నట్టుగా
  rationale: ఇక్కడ శారీరక అనారోగ్యం కంటే శక్తి, ధైర్యం లేదా స్థాయి లేనివారిగా కనిపించడం ప్రధాన భావం. పరిపూర్ణ కాలపు ఫలితస్థితిని తెలుగు సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ᾧ
  choice: ఏ విషయంలో
  rationale: ఎవరో ధైర్యం చూపే పరిధిని లేదా విషయాన్ని సూచించే గ్రీకు ప్రయోగానికి ఇది స్పష్టమైన, సహజమైన తెలుగు.
- source_word: τολμᾷ
  choice: ధైర్యం చేస్తాడో
  rationale: మూల క్రియకు ‘సాహసించు/ధైర్యం చేయు’ అనే భావం ఉంది. ‘గొప్పలు చెప్పడానికి’ అనేది సందర్భంలో సూచితమైనప్పటికీ ప్రధాన పాఠ్యంలో చేర్చకుండా మూలంలోని అంతర్నిహితత్వాన్ని నిలిపాం; పాదసూచిక దాన్ని వివరిస్తుంది.
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: నేను మూర్ఖత్వంతో మాట్లాడుతున్నాను
  rationale: పౌలు తన అలంకారిక ప్రగల్భాల మాటను మూర్ఖత్వంగా గుర్తిస్తూ చేర్చిన స్వీయ వ్యాఖ్యను నేరుగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τολμῶ κἀγώ
  choice: నేనూ ధైర్యం చేస్తాను
  rationale: ముందటి τολμᾷతో ఉన్న పదపునరుక్తిని నిలుపుతూ, సందర్భంలో సూచితమైన గొప్పలు చెప్పడాన్ని స్పష్టంగా చేర్చకుండా ఉంచుతుంది.
theological_decisions:
- issue: పౌలు ‘బలహీనత’ గురించి పలికిన వ్యంగ్యోక్తి
  choice: దాన్ని నిజమైన అపొస్తలత్వ లోపాన్ని ఒప్పుకున్న మాటగా కాక, వ్యంగ్యపూర్వక అంగీకారంగా వ్యక్తం చేయడం
  alternative: ‘మేము బలహీనులమై ఉన్నామని’ అనే సూటి వాస్తవ అంగీకారంగా అనువదించడం
  rationale: విస్తృత సందర్భంలో ఇది గొప్పలు చెప్పుకునే ప్రత్యర్థులకు జవాబుగా పౌలు చెప్పే ‘మూర్ఖుని ప్రసంగం.’ ‘ఉన్నట్టుగా’ అనే రూపం అతని వ్యంగ్య ధోరణిని చూపుతుంది; అయితే బలహీనత అనే పదంలో ఉన్న వేదాంతపరమైన ఉద్రిక్తతను తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని ‘ధైర్యం చేయడం’ అనే పునరుక్తిని నిలిపి, గొప్పలు చెప్పడం అనే సూచిత కర్మను పాదసూచికలో వివరించాం. వ్యంగ్యాన్ని ఆశ్చర్యార్థక విరామచిహ్నం మరియు ‘ఉన్నట్టుగా’ అనే రూపం తెలియజేస్తాయి.
