revisions:
- from: అయితే నేను ఇప్పుడు చేస్తున్నదానినే ఇకముందూ చేస్తాను. అవకాశం కోరుతున్నవారికి ఆ అవకాశాన్ని[a] లేకుండా చేయడానికి, వారు దేని గురించి గొప్ప చెప్పుకుంటున్నారో దానిలో వారు కూడా మాలాగే ఉన్నారని తేలేలా నేను ఇలా చేస్తాను.
