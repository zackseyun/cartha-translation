id: 2CO.11.12
reference: 2 Corinthians 11:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: te
  text: అయితే నేను చేస్తున్నదానినే ఇకముందూ చేస్తాను. అవకాశం కోరుతున్నవారికి ఆ అవకాశాన్ని తొలగించడానికి, వారు దేని విషయంలో గొప్పలు చెప్పుకుంటున్నారో ఆ విషయంలో వారు కూడా మాలాగే ఉన్నారని తేలేలా చేస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: అయితే నేను ఇప్పుడు చేస్తున్నదానినే ఇకముందూ చేస్తాను
  rationale: వర్తమాన కాలం, భవిష్యత్ కాలం కలయిక పౌలు ప్రస్తుతం చేస్తున్న పనిని కొనసాగించాలనే దృఢనిశ్చయాన్ని తెలియజేస్తుంది.
- source_word: ἐκκόψω
  choice: లేకుండా చేయడానికి
  rationale: మూలపదంలోని ‘నరికివేయడం’ అనే రూపకం ఇక్కడ ఒక అవకాశాన్ని తొలగించడం అనే భావంలో ఉంది; ఆధునిక తెలుగులో ఈ సందర్భానికి ‘లేకుండా చేయడం’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἀφορμή
  choice: అవకాశం
  rationale: ఈ పదం అవకాశం, సందర్భం, సాకు అనే అర్థాలను కలిగి ఉండవచ్చు. ప్రధాన పాఠ్యంలో తటస్థమైన ‘అవకాశం’ను ఉంచి, సందర్భానుసారమైన ఇతర భావాలను పాదసూచికలో ఇచ్చాం.
- source_word: τῶν θελόντων ἀφορμήν
  choice: అవకాశం కోరుతున్నవారికి
  rationale: గ్రీకులోని సంక్షిప్తమైన, ఎత్తిచూపే వ్యక్తీకరణను సహజమైన తెలుగులో అందిస్తూ ἀφορμή పదపు పునరావృతిని నిలిపాం.
- source_word: ἐν ᾧ καυχῶνται
  choice: వారు దేని గురించి గొప్ప చెప్పుకుంటున్నారో దానిలో
  rationale: ఇది వారు అతిశయిస్తున్న విషయం లేదా రంగాన్ని సూచిస్తుంది; ‘గొప్ప చెప్పుకోవడం’ సాధారణ ఆధునిక తెలుగులో καυχάομαι భావాన్ని సహజంగా అందిస్తుంది.
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: వారు కూడా మాలాగే ఉన్నారని తేలేలా
  rationale: εὑρεθῶσιν యొక్క నిష్క్రియార్థాన్ని ‘తేలడం’ ద్వారా సహజంగా వ్యక్తం చేసి, పౌలు మరియు అతని సహచరులతో పోలికను ‘మాలాగే’ ద్వారా నిలిపాం.
theological_decisions:
- issue: పౌలు ప్రత్యర్థులు కోరుతున్న ἀφορμή స్వభావం
  choice: ప్రధాన పాఠ్యంలో తటస్థంగా ‘అవకాశం’
  alternative: ‘సాకు’ లేదా ‘సందర్భం’
  rationale: ఈ వివాద సందర్భంలో ‘సాకు’ అనే ప్రతికూల భావం సాధ్యమైనా, నామవాచకం స్వయంగా దానిని తప్పనిసరి చేయదు. అందువల్ల ప్రధాన పాఠ్యం అస్పష్టతను కాపాడుతుంది; ప్రత్యామ్నాయాలను పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని పునరావృతిని సాధ్యమైనంత వరకు నిలిపి, ἀφορμή యొక్క ఉద్దేశపూర్వక అస్పష్టతను పాదసూచికతో సంరక్షించాం.
