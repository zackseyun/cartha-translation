id: 2CO.11.7
reference: 2 Corinthians 11:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: te
  text: లేక, మీరు హెచ్చింపబడాలని నన్ను నేను తగ్గించుకొని, దేవుని సువార్తను మీకు ఉచితంగా[b] ప్రకటించినందుకు నేను పాపం చేశానా[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను పాపానికి పాల్పడ్డానా?’ గ్రీకు నుడికారం అక్షరార్థంగా ‘నేను ఒక పాపాన్ని చేశానా?’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ప్రతిఫలం తీసుకోకుండా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: లేక
  rationale: ముందున్న వాదనకు అనుసంధానమైన పదునైన అలంకారప్రశ్నను సహజమైన తెలుగులో కొనసాగిస్తుంది.
- source_word: ἁμαρτίαν ἐποίησα
  choice: నేను పాపం చేశానా
  rationale: గ్రీకు నుడికారం అక్షరార్థంగా ‘పాపాన్ని చేశానా’ అనే భావం కలిగినా, ‘పాపం చేశానా’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి నైతిక భావాన్ని నిలుపుతుంది.
- source_word: ἐμαυτὸν ταπεινῶν
  choice: నన్ను నేను తగ్గించుకొని
  rationale: ఆత్మవాచక భావాన్ని, పౌలు తన స్థాయిని తానే తగ్గించుకున్నాడనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: మీరు హెచ్చింపబడాలని
  rationale: ταπεινῶνతో ఉన్న తగ్గింపు–హెచ్చింపు వ్యత్యాసాన్ని, అలాగే గ్రీకులోని కర్మణి రూపాన్ని నిలుపుతుంది; ఎవరు హెచ్చిస్తారో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ὅτι
  choice: ప్రకటించినందుకు
  rationale: ఆ చర్యనే అనుమానిత ‘పాపానికి’ కారణం లేదా ఆధారంగా చూపే సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: δωρεὰν
  choice: ఉచితంగా
  rationale: డబ్బు లేదా ప్రతిఫలం తీసుకోకుండా చేసిన కార్యాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: దేవుని సువార్తను
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని పారదర్శకంగా నిలుపుతూ, పౌలు వాడే పరిచితమైన ధార్మిక పదబంధాన్ని అందిస్తుంది.
- source_word: εὐηγγελισάμην ὑμῖν
  choice: మీకు ... ప్రకటించినందుకు
  rationale: సువార్తను వారికి తెలియజేసిన బహిరంగ ప్రకటన భావాన్ని నిలుపుతుంది; ‘ప్రకటించు’ అనేది ఆధునిక తెలుగులో విస్తృతంగా అర్థమయ్యే పదం.
theological_decisions:
- issue: ఆర్థిక సహాయం, పౌలు తనను తాను తగ్గించుకోవడం గురించి ఉన్న అలంకారప్రశ్న స్వభావం
  choice: పౌలు చేసిన పని పాపమా అని ప్రశ్నించే వ్యంగ్యభరితమైన అలంకారప్రశ్నను నేరుగా నిలుపడం
  alternative: పరిచర్యకు ప్రతిఫలం తీసుకోవడం సరైనదా కాదా అనే సిద్ధాంత నిర్ణయాన్ని వాక్యంలోనే చేర్చడం
  rationale: గ్రీకు పాఠ్యం పౌలు తనను తాను తగ్గించుకొని ఉచితంగా సువార్త ప్రకటించడం ‘పాపం’ అయిందా అని ప్రశ్నిస్తుంది. పరిచర్య ప్రతిఫలం గురించి పాఠ్యాన్ని మించిన సిద్ధాంత తీర్పును అనువాదం చేర్చకూడదు.
- issue: ὑψωθῆτε అనే కర్మణి రూపంలో కార్యసాధకుడు
  choice: ‘మీరు హెచ్చింపబడాలని’ అని కార్యసాధకుణ్ణి పేర్కొనకుండా ఉంచడం
  alternative: ‘దేవుడు మిమ్మల్ని హెచ్చించాలని’ అని దేవుణ్ణి కార్యసాధకుడిగా స్పష్టీకరించడం
  rationale: సందర్భంలో దేవుని కార్యం సూచితమై ఉండవచ్చుగానీ, గ్రీకు వాక్యం కార్యసాధకుణ్ణి స్పష్టంగా పేర్కొనదు; ఆ నిజమైన అస్పష్టతను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రశ్నాక్రమాన్ని వాడుతూ, పౌలు మాటల్లోని పదును మరియు తగ్గింపు–హెచ్చింపు వ్యత్యాసాన్ని నిలిపాం. ‘సువార్త,’ ‘హెచ్చింపబడడం’ వంటి గౌరవప్రదమైన, విస్తృతంగా పరిచితమైన పదాలను ఉపయోగించాం; ఏ సంఘపరమైన ప్రత్యేక సిద్ధాంత భాషనూ చేర్చలేదు.
