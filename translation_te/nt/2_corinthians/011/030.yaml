id: 2CO.11.30
reference: 2 Corinthians 11:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰ καυχᾶσθαι δεῖ, τὰ τῆς ἀσθενείας μου καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/030.yaml
  text: If I must boast[a], I will boast in the things of my weakness.
translation:
  language: te
  text: నేను గొప్పగా చెప్పుకోవలసి వస్తే, నా బలహీనతకు సంబంధించిన వాటి గురించే గొప్పగా చెప్పుకుంటాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత వ్యవహారికంగా: “నా బలహీనతల గురించే గొప్పగా చెప్పుకుంటాను.” గ్రీకు వాక్యం మరింత అక్షరార్థంగా, “నా బలహీనతకు సంబంధించిన వాటి గురించి గొప్పగా చెప్పుకుంటాను” అని ఉంది.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: వస్తే
  rationale: గ్రీకు షరతు రూపాన్ని సహజమైన తెలుగు షరతు నిర్మాణంలో నిలుపుతుంది; దానిని ‘కాబట్టి’ అనే కారణార్థంగా మార్చదు.
- source_word: καυχᾶσθαι
  choice: గొప్పగా చెప్పుకోవడం
  rationale: పౌలు వాడిన καυχάομαι పదంలోని అతిశయోక్తి/శ్లాఘన భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; ‘మహిమపడడం’ ఇక్కడ తక్కువ సహజంగా, మతపరమైన ప్రత్యేక అర్థంతో వినిపించవచ్చు.
- source_word: δεῖ
  choice: చెప్పుకోవలసి వస్తే
  rationale: అవసరాన్ని లేదా తప్పనిసరితనాన్ని తెలుపుతూ, షరతుతో కలిపి సహజమైన తెలుగు వాక్యనిర్మాణాన్ని ఇస్తుంది.
- source_word: τὰ τῆς ἀσθενείας μου
  choice: నా బలహీనతకు సంబంధించిన వాటి గురించి
  rationale: τὰ అనే నపుంసక బహువచన రూపాన్నీ, దానితో ఉన్న సంబంధార్థక షష్ఠీ నిర్మాణాన్నీ పూర్తిగా ‘నా బలహీనతలు’గా కుదించకుండా నిలుపుతుంది.
- source_word: ἀσθενείας
  choice: బలహీనత
  rationale: శారీరక అస్వస్థతకే పరిమితం చేయకుండా, పౌలు అనుభవించిన అవమానకరమైన లేదా నిస్సహాయ పరిస్థితులను కూడా కలుపుకోగల విస్తృతమైన అర్థాన్ని ఇస్తుంది.
- source_word: καυχήσομαι
  choice: గొప్పగా చెప్పుకుంటాను
  rationale: భవిష్యత్ క్రియారూపాన్ని స్పష్టంగా అందించి, ముందున్న καυχᾶσθαιతో పదపునరుక్తి మరియు వాక్చాతుర్య సమాంతరతను నిలుపుతుంది.
theological_decisions:
- issue: పౌలు గొప్పగా చెప్పుకోవడం యొక్క స్వభావం
  choice: బలహీనతకు సంబంధించిన వాటి గురించే గొప్పగా చెప్పుకుంటాననే విరోధాభాసాన్ని వివరణ జోడించకుండా నిలుపడం
  alternative: ‘నా బలహీనతల గురించే గొప్పగా చెప్పుకుంటాను’ అని మరింత వ్యవహారికంగా కుదించడం
  rationale: సాధారణంగా మనుషులు గొప్పగా భావించే విషయాలకు విరుద్ధంగా బలహీనతను గురించి గొప్పగా చెప్పుకోవడంలోని పౌలు ఉద్దేశించిన ఉద్వేగాన్నీ వ్యంగ్యాన్నీ అనువాదం స్వయంగా పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మహిమపడడం’కు బదులుగా సాధారణ పాఠకులకు స్పష్టమైన ‘గొప్పగా చెప్పుకోవడం’ వాడబడింది; అయితే మూలంలోని అసాధారణ సంబంధ నిర్మాణం ప్రధాన పాఠ్యంలో సాధ్యమైనంతవరకు నిలుపబడింది.
