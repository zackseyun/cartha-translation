id: 2CO.11.11
reference: 2 Corinthians 11:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τί; ὅτι οὐκ ἀγαπῶ ὑμᾶς; ὁ θεὸς οἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/011.yaml
  text: Why? Because I do not love you? God knows I do.
translation:
  language: te
  text: ఎందుకు? నేను మిమ్మల్ని ప్రేమించనందువల్లనా? దేవునికి తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, సందర్భంలో సూచితమైన భావాన్ని స్పష్టంగా చెబితే: “నేను మిమ్మల్ని ప్రేమిస్తున్నానని దేవునికి తెలుసు.” గ్రీకు మూలంలో “దేవునికి తెలుసు” అని మాత్రమే ఉంది.'
    reason: మూల గ్రీకులో చివరి వాక్యం సంక్షిప్తంగా ఉండి, అలంకారిక ప్రశ్నకు సానుకూల జవాబును స్పష్టంగా చెప్పకుండా సందర్భానికి వదిలివేస్తుంది.
lexical_decisions:
- source_word: διὰ τί
  choice: ఎందుకు?
  rationale: కారణాన్ని ప్రశ్నించే సంక్షిప్తమైన, సహజమైన తెలుగు రూపం; మూలంలోని అలంకారిక ప్రశ్న బలాన్ని నిలుపుతుంది.
- source_word: ὅτι
  choice: …లేదనా?
  rationale: ఇక్కడ ὅτι ముందున్న ‘ఎందుకు?’ అనే ప్రశ్నకు సాధ్యమైన కారణాన్ని ప్రశ్నారూపంలో ప్రవేశపెడుతుంది. తెలుగులో ‘అందుకా?’ అని విడిగా చేర్చడం కంటే ‘లేదనా?’ అనే నిర్మాణం సహజంగా అదే సంబంధాన్ని తెలియజేస్తుంది.
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: నేను మిమ్మల్ని ప్రేమించడం లేదనా?
  rationale: నిరాకరణను, ‘మిమ్మల్ని’ అనే ప్రత్యక్ష కర్మను స్పష్టంగా ఉంచి, వాక్యాన్ని అలంకారిక ప్రశ్నగా సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ὁ θεὸς
  choice: దేవునికి
  rationale: θεόςకు ప్రామాణిక తెలుగు పదం ‘దేవుడు’; οἶδενతో సహజమైన తెలుగు వాక్యనిర్మాణం కోసం ‘దేవునికి’ అనే చతుర్థీ రూపం వాడబడింది.
- source_word: οἶδεν
  choice: తెలుసు
  rationale: మూలంలో కేవలం ‘తెలుసు’ అని ఉంది; తెలిసిన విషయం సందర్భం ద్వారా సూచితమవుతుంది. తెలుగు కూడా ఈ సంక్షిప్తతను సహజంగా అనుమతిస్తుంది.
theological_decisions:
- issue: చివరి మాటలో దేవునికి తెలిసిన విషయాన్ని స్పష్టంగా చేర్చాలా, లేక మూలంలోని సూచిత భావంగానే ఉంచాలా
  choice: దేవునికి తెలుసు.
  alternative: నేను మిమ్మల్ని ప్రేమిస్తున్నానని దేవునికి తెలుసు.
  rationale: గ్రీకు పాఠం ὁ θεὸς οἶδεν (‘దేవునికి తెలుసు’) అని మాత్రమే చెబుతుంది. సందర్భం పౌలు వారిని ప్రేమిస్తున్నాడనే సానుకూల జవాబును బలంగా సూచించినా, దాన్ని ప్రధాన పాఠంలో స్పష్టంగా చేర్చకుండా ఉండటం మూలంలోని సంక్షిప్తతను, అలంకారిక ఉద్వేగాన్ని, వ్యాకరణపరమైన సూచితత్వాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రేమించడం లేదనా?’ అనే రూపం అలంకారిక ప్రశ్నను స్పష్టంగా వినిపిస్తుంది; ‘దేవునికి తెలుసు’ మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను నిలుపుతుంది.
