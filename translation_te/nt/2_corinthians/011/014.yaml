id: 2CO.11.14
reference: 2 Corinthians 11:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐ ⸀θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/014.yaml
  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: te
  text: ఇందులో ఆశ్చర్యమేమీ లేదు; ఎందుకంటే సాతాను తానే వెలుగు దూతగా వేషం వేసుకుంటాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెలుగు దూతగా రూపం మార్చుకుంటాడు.’ గ్రీకు క్రియకు మరింత పదశఃగా ‘రూపాన్ని మార్చుకోవడం’ అని అర్థం; అయితే ఇక్కడ అది మోసపూరితంగా అలా కనిపించడాన్ని సూచిస్తున్నట్లు ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐ θαῦμα
  choice: అందులో ఆశ్చర్యమేమీ లేదు
  rationale: ముందటి వాక్యంతో సంబంధాన్ని కొనసాగిస్తూ, ‘ఇది ఆశ్చర్యకరం కాదు’ అనే గ్రీకు నుడికార భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτὸς ... ὁ Σατανᾶς
  choice: సాతాను తానే
  rationale: αὐτός ఇక్కడ ఇచ్చే ఉద్ఘాటనను ‘తానే’ స్పష్టంగా నిలుపుతుంది; గ్రీకు నిర్దేశక పదాన్ని తెలుగు పేరుతో విడిగా అనువదించాల్సిన అవసరం లేదు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ఆశ్చర్యపడనవసరం ఎందుకో వివరించే కారణ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: μετασχηματίζεται εἰς
  choice: వేషం వేసుకుంటాడు
  rationale: సందర్భంలో మోసపూరితమైన బాహ్య రూపధారణ ప్రధాన భావం. ఈ తెలుగు నుడికారం దాన్ని సహజంగా వ్యక్తం చేస్తుంది; పదశః ‘రూపం మార్చుకుంటాడు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἄγγελον φωτός
  choice: వెలుగు దూత
  rationale: ‘వెలుగుకు చెందిన దూత’ అనే గ్రీకు రూపకాన్ని సంక్షిప్తంగా, గంభీరంగా నిలుపుతుంది; ఈ అతీంద్రియ సందర్భంలో ἄγγελος అంటే దూత/దేవదూత.
theological_decisions:
- issue: సాతాను రూపమార్పు స్వభావం
  choice: మోసపూరితంగా వెలుగు దూతలా కనిపించే వేషధారణ
  alternative: నిజంగానే వెలుగు దూతగా రూపాంతరం చెందడం
  rationale: తక్షణ సందర్భం అబద్ధ అపొస్తలుల మోసపూరిత ప్రదర్శన గురించి మాట్లాడుతోంది. అందువల్ల ప్రధాన పాఠంలో బాహ్య వేషధారణను వ్యక్తం చేశాం; అయితే μετασχηματίζεται అనే క్రియలోని ‘రూపం మార్చుకోవడం’ అనే నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన నుడికారం, అయితే వాక్యంలోని గంభీరతను, ఉద్ఘాటనను, వెలుగు రూపకాన్ని నిలిపింది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో ఉంచబడింది.
