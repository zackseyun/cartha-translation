id: 2CO.11.10
reference: 2 Corinthians 11:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι ἡ καύχησις αὕτη οὐ φραγήσεται εἰς ἐμὲ ἐν τοῖς κλίμασι τῆς Ἀχαΐας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: te
  text: క్రీస్తు సత్యం నాలో ఉన్నట్లే, ఈ నా గొప్పగా చెప్పుకోవడం అఖయ ప్రాంతాల్లో ఆపబడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “క్రీస్తు సత్యం నాలో ఉంది; అఖయ ప్రాంతాల్లో నా విషయమై ఈ గొప్పగా చెప్పుకోవడం మూయబడదు” అని కూడా అనువదించవచ్చు. “ఆపబడదు” అనే మాటకు ఇక్కడ “మూయబడదు” లేదా “నిశ్శబ్దం చేయబడదు” అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια Χριστοῦ
  choice: క్రీస్తు సత్యం
  rationale: సంబంధం లేదా స్వామ్యాన్ని సూచించే షష్ఠీ విభక్తి నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతుంది. పౌలు రచనలో ఇక్కడ Χριστός పేరు వలె స్థిరపడిన బిరుదుగా సహజంగా వినిపిస్తున్నందున ‘క్రీస్తు’ వాడబడింది.
- source_word: ἐν ἐμοὶ
  choice: నాలో ఉన్న
  rationale: మూలంలోని సరళమైన స్థానార్థక వ్యక్తీకరణను నిలుపుతూ, పౌలు చేసే గంభీరమైన నిశ్చయ ప్రకటనకు సహజమైన తెలుగు రూపం ఇస్తుంది.
- source_word: ὅτι
  choice: ఉన్నంత నిశ్చయంగా
  rationale: ఇక్కడ ὅτι గంభీరమైన ప్రమాణసదృశ ప్రకటనలో దాని విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో ‘ఉన్నంత నిశ్చయంగా’ ఆ బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ καύχησις αὕτη
  choice: నాకున్న ఈ అతిశయం
  rationale: καύχησις సూచించే అతిశయించడం లేదా దానికి ఆధారమైన విషయాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; εἰς ἐμέను కూడా వ్యక్తిసంబంధ భావంగా ఇందులో కలుపుతుంది.
- source_word: οὐ φραγήσεται
  choice: ఎవరూ అడ్డుకోలేరు
  rationale: φράσσω యొక్క ‘మూసివేయడం, అడ్డుకోవడం’ అనే రూపక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. గ్రీకులోని భవిష్యత్ కర్మణి భావాన్ని తెలుగు సామర్థ్యనిషేధ రూపంలో అర్థసమానంగా అందిస్తుంది.
- source_word: εἰς ἐμὲ
  choice: నాకున్న
  rationale: అక్షరార్థంగా అసహజంగా ఉండే ‘నా వైపుకు’ అనే రూపం బదులు, ఈ అతిశయం పౌలుకు సంబంధించినదని తెలిపే స్వామ్య/సంబంధ రూపం ఎంచుకోబడింది.
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: అకయ ప్రాంతాల్లో
  rationale: κλίματα యొక్క బహువచనమైన ‘ప్రాంతాలు’ అనే భావాన్ని నిలుపుతుంది; Ἀχαΐα ప్రాచీన రోమా ప్రావిన్సు పేరుగా లిప్యంతరీకరించబడింది.
theological_decisions:
- issue: Χριστοῦ అనువాదం
  choice: క్రీస్తు
  alternative: మెస్సీయ
  rationale: ఈ పౌలు వాక్యంలో Χριστός వ్యక్తినామసదృశ బిరుదుగా సహజంగా పనిచేస్తుంది. అందువల్ల ఆధునిక ప్రామాణిక తెలుగులో సుపరిచితమైన ‘క్రీస్తు’ ఎంచుకోబడింది; ‘మెస్సీయ’ అనే బిరుదార్థాన్ని బలవంతంగా చేర్చలేదు.
- issue: ἀλήθεια Χριστοῦ యొక్క షష్ఠీ సంబంధం
  choice: క్రీస్తు సత్యం
  alternative: క్రీస్తుకు సంబంధించిన సత్యం
  rationale: మూలంలో ఈ సంబంధం స్వామ్యం, లక్షణం, లేదా సంబంధార్థంగా ఉండవచ్చు. సంక్షిప్తమైన తెలుగు నిర్మాణం ఆ విస్తృతిని పూర్తిగా ఒకే వివరణకు పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ప్రమాణసదృశ ప్రారంభాన్ని సహజీకరించగా, క్లిష్టమైన φραγήσεται εἰς ἐμέ పదబంధంలోని ప్రత్యామ్నాయాలను పాదటిప్పణిలో నిలిపాం.
