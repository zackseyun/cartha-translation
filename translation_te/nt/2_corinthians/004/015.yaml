id: 2CO.4.15
reference: 2 Corinthians 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: te
  text: ఎందుకంటే, ఇవన్నీ మీ కోసమే ఉన్నాయి; కృప ఎక్కువమంది[a] ద్వారా విస్తరించి, దేవుని మహిమ కొరకు కృతజ్ఞత సమృద్ధిగా వెల్లివిరియునట్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అనేకుల ద్వారా’ లేదా ‘ఎక్కువ సంఖ్యలోని వారి ద్వారా’ అని కూడా అనువదించవచ్చు. గ్రీకు పదబంధం సాధారణంగా అనేకమందిని గానీ, సంఖ్యలో పెరుగుతున్న ప్రజలను గానీ సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ γὰρ πάντα
  choice: ఇవన్నీ
  rationale: ముందటి సందర్భంలోని సమస్త శ్రమలు, పరిచర్య ఫలితాలను సమగ్రంగా సూచించే సహజమైన తెలుగు రూపం; γὰρ యొక్క వివరణాత్మక సంబంధం తెలుగులో వాక్యప్రవాహం ద్వారా వ్యక్తమవుతుంది.
- source_word: δι’ ὑμᾶς
  choice: మీ కోసమే
  rationale: διά + accusative ఇక్కడ లబ్ధి లేదా ప్రయోజనాన్ని సూచిస్తుంది; ‘మీ కోసమే’ ఆ భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα
  choice: తద్వారా
  rationale: ఉద్దేశం లేదా ఫలితాన్ని సూచించే ἵνα భావాన్ని తెలుగు వాక్యప్రవాహంలో సహజంగా నిలుపుతుంది.
- source_word: ἡ χάρις
  choice: కృప
  rationale: దేవుని అనుగ్రహపూర్వక కార్యాన్ని సూచించే విస్తృతమైన దైవశాస్త్రీయ భావాన్ని సంకుచితం చేయకుండా నిలుపుతుంది.
- source_word: πλεονάσασα
  choice: విస్తరిస్తూ
  rationale: కృప పెరుగుతూ మరింతమందికి చేరే సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; participial సంబంధాన్ని కొనసాగిస్తుంది.
- source_word: διὰ τῶν πλειόνων
  choice: ఎక్కువమంది ద్వారా
  rationale: ‘అనేకుల ద్వారా’ లేదా ‘మరింత ఎక్కువ సంఖ్యలోని వారి ద్వారా’ అనే గ్రీకు పదబంధంలోని నిజమైన అనిశ్చితిని ప్రధాన పాఠ్యంలో అతిగా నిర్ణయించకుండా వ్యక్తం చేస్తుంది.
- source_word: τὴν εὐχαριστίαν περισσεύσῃ
  choice: కృతజ్ఞతలు మరింతగా వెల్లివిరియాలి
  rationale: εὐχαριστία దేవునికి అర్పించే కృతజ్ఞతను, περισσεύω దాని సమృద్ధిని సూచిస్తాయి; బహువచన తెలుగు రూపం అనేకుల కృతజ్ఞత వ్యక్తీకరణను సహజంగా తెలియజేస్తుంది.
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: దేవుని మహిమకోసం
  rationale: εἰς సూచించే లక్ష్యం లేదా ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఉద్దేశ వాక్యంలో ‘కృప’ యొక్క నిర్దిష్ట సూచన
  choice: అపొస్తలిక పరిచర్యలో పనిచేస్తూ విస్తరించే దేవుని కృప అనే విస్తృత భావాన్ని నిలుపడం
  alternative: మరింతమంది పొందుతున్న రక్షణ కృపగా లేదా కృతజ్ఞతలను పెంచే దేవుని అనుగ్రహంగా ప్రత్యేకంగా అర్థం చేయడం
  rationale: χάρις ఏ ఒక్క దైవశాస్త్రీయ ప్రక్రియకే పరిమితమని వాక్యం స్పష్టంగా చెప్పదు; అందువల్ల మూలంలోని భావవిస్తృతిని అలాగే ఉంచాం.
- issue: διὰ τῶν πλειόνων యొక్క భావం
  choice: ‘ఎక్కువమంది ద్వారా’ అని అనువదించి సంఖ్య విస్తరణ భావాన్ని ఉంచడం
  alternative: ‘అనేకుల ద్వారా’ లేదా ‘మరింత ఎక్కువ సంఖ్యలోని వారి ద్వారా’
  rationale: గ్రీకు రూపం సాధారణంగా అనేకులను గానీ, పెరుగుతున్న సంఖ్యను గానీ సూచించగలదు; పాదటిప్పణి ఈ అనిశ్చితిని వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని ఉద్దేశం/ఫలితం సంబంధం మరియు ‘కృప’ యొక్క దైవశాస్త్రీయ విస్తృతి నిలుపబడ్డాయి.
