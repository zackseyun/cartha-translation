id: 2CO.4.18
reference: 2 Corinthians 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα, τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: te
  text: మేము కనిపించేవాటిపై కాక, కనిపించనివాటిపై దృష్టి నిలుపుతుండగా—ఎందుకంటే కనిపించేవి తాత్కాలికమైనవి[a], కనిపించనివి శాశ్వతమైనవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కనిపించేది … కనిపించనిది’ అని కూడా అనువదించవచ్చు; లేదా ‘దృశ్యమైనవి … అదృశ్యమైనవి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοπούντων
  choice: దృష్టి నిలుపుతున్నాం
  rationale: స్కోపేయో ఇక్కడ దృష్టిని లేదా శ్రద్ధను ఒకదానిపై కేంద్రీకరించడాన్ని సూచిస్తుంది. ‘దృష్టి నిలుపుతున్నాం’ అనే మాట దృశ్య రూపకాన్ని కాపాడుతూ ఆధునిక తెలుగులో సహజంగా ఉంది; మునుపటి వాక్యంతో అనుసంధానమైన వర్తమాన కృదంత భావాన్ని కొనసాగిస్తుంది.
- source_word: μὴ
  choice: కాక / కనిపించని
  rationale: మొదటి భాగంలో వ్యతిరేక జతను తెలుగులో సహజంగా చూపేందుకు ‘కాక’ను, రెండవ కృదంతంలో నిషేధాన్ని ‘కనిపించని’గా ఇచ్చాం. గ్రీకులో లేని ‘ఇకపై కాదు’ అనే కాలార్థాన్ని చేర్చలేదు.
- source_word: τὰ βλεπόμενα
  choice: కనిపించేవి
  rationale: నపుంసక బహువచన నామీకృత వర్తమాన కృదంతానికి సహజమైన తెలుగు రూపం. ‘కనిపించనివి’తో ఉన్న పునరుక్త సమాంతరతను నిలుపుతుంది.
- source_word: ἀλλὰ
  choice: కాక ... పై
  rationale: రెండు దృష్టి విషయాల మధ్య బలమైన వ్యతిరేకతను తెలుగు ‘కాక’ నిర్మాణం స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τὰ μὴ βλεπόμενα
  choice: కనిపించనివి
  rationale: ‘కనిపించేవి’కి సమాంతరమైన నామీకృత రూపం; కనిపించే, కనిపించని వాస్తవాల మధ్య పౌలు ఉంచిన వ్యత్యాసాన్ని అలాగే ఉంచుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణం లేదా వివరణను పరిచయం చేసే సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: πρόσκαιρα
  choice: తాత్కాలికమైనవి
  rationale: పరిమిత కాలమే ఉండేదని స్పష్టంగా తెలిపే సాధారణ ఆధునిక తెలుగు పదం. 17వ వచనంలోని ‘క్షణిక’ భావాన్ని అనవసరంగా ఇక్కడికి బలంగా మోపదు.
- source_word: δέ
  choice: ;
  rationale: తెలుగులో రెండు విరుద్ధ సమాంతర భాగాల మధ్య విరామచిహ్నమే వ్యత్యాసాన్ని సహజంగా మోస్తుంది; ‘అయితే’ను చేర్చినా సాధ్యమే, కాని అది అవసరం లేదు.
- source_word: αἰώνια
  choice: శాశ్వతమైనవి
  rationale: πρόσκαιρα అనే తాత్కాలికతకు వ్యతిరేకంగా అంతం లేక నిలిచే భావాన్ని సందర్భానుసారంగా స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἡμῶν
  choice: మనం
  rationale: గ్రీకులో కృదంతానికి కర్తగా ఉన్న ప్రథమ పురుష బహువచనాన్ని తెలుగులో సహజమైన సమాప్త క్రియ నిర్మాణంలో ‘మనం’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: కనిపించే వాటికి, కనిపించని వాటికి మధ్య వ్యత్యాసం
  choice: ‘కనిపించేవి ... కనిపించనివి’ అనే నిర్దిష్టమైన దృశ్య భాషను నిలుపడం
  alternative: ‘భౌతికమైనవి ... ఆధ్యాత్మికమైనవి’ లేదా ‘దృశ్యమైనవి ... అదృశ్యమైనవి’
  rationale: మూలపాఠం వీటిని తాత్వికంగా భౌతిక, ఆధ్యాత్మిక వర్గాలుగా నిర్వచించదు. అందువల్ల పాఠంలోని నిజమైన విస్తృతిని, వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు స్పష్టంగా ఉండే, గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని కనిపించే/కనిపించని పదపునరుక్తిని, తాత్కాలిక/శాశ్వత వ్యత్యాసాన్ని నిలిపాం. ఈ వచనం మునుపటి వాక్యానికి వ్యాకరణపరంగా ఆధారపడినప్పటికీ, ఇచ్చిన ఏకవచన సూచనలో సహజంగా చదవడానికి సమాప్త క్రియను ఉపయోగించాం.
