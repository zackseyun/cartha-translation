  terminology: ‘ఈ యుగపు దేవుడు,’ ‘మెస్సీయ,’ ‘దేవుని ప్రతిరూపం,’ and ‘సువార్త’ are suitable and source-faithful. The lexical-alternative notes appropriately preserve both ‘world’ and the disputed nuance of αὐγάσαι.
