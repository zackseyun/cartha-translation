id: 2CO.4.4
reference: 2 Corinthians 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ ⸀αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν εἰκὼν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: te
  text: వారి విషయంలో, ఈ యుగపు దేవుడు[a] విశ్వసించని వారి మనస్సులను అంధపరిచాడు; దేవుని ప్రతిరూపమైన మెస్సీయ[b] మహిమను గురించిన సువార్త వెలుగు వారిపై ప్రకాశించకుండునట్లు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ లోకపు దేవుడు.’ గ్రీకు పదం సాధారణంగా ‘యుగం’ అని అర్థమై, ప్రస్తుత పతిత కాలాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం Χριστός; ఇక్కడ అది బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘మెస్సీయ మహిమను గురించిన సువార్త వెలుగును వారు చూడకుండా.’ ఇక్కడి అరుదైన గ్రీకు క్రియ వెలుగు ప్రకాశించడాన్నైనా, వారు దానిని చూడడాన్నైనా నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: వారి విషయంలో
  rationale: మునుపటి సందర్భంలో ప్రస్తావించిన నశించిపోతున్న, విశ్వసించని వారిని సూచిస్తుంది. ‘వారిలో’ అనే పదబంధం కలిగించగల అంతర్నివాస భావాన్ని నివారిస్తూ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: ఈ యుగపు దేవుడు
  rationale: αἰών ఇక్కడ సృష్టించబడిన లోకాన్ని కాక ప్రస్తుత పతిత యుగాన్ని ప్రధానంగా సూచిస్తుంది. మూలంలోని బిరుదును అలాగే ఉంచి, దాని స్థానంలో ‘సాతాను’ అని వివరణాత్మకంగా చేర్చలేదు.
- source_word: ἐτύφλωσεν τὰ νοήματα
  choice: మనస్సులను గుడ్డివిగా చేశాడు
  rationale: νόημα ఇక్కడ విడివిడి ఆలోచనలకన్నా గ్రహించే మానసిక సామర్థ్యాన్ని సూచిస్తుంది. అంధత్వ రూపకాన్ని ఆధునిక తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: τῶν ἀπίστων
  choice: విశ్వసించని వారి
  rationale: నమ్మకం లేనివారిని సూచించే విశేషణార్థాన్ని నిలుపుతుంది; ‘నమ్మకద్రోహులు’ వంటి అదనపు నైతిక భావాన్ని చేర్చదు.
- source_word: εἰς τὸ μὴ αὐγάσαι τὸν φωτισμόν
  choice: వెలుగు వారిపై ప్రకాశించకుండా
  rationale: ప్రయోజనం లేదా ఫలితాన్ని తెలిపే నిర్మాణాన్ని సహజంగా వ్యక్తం చేస్తుంది. అరుదైన αὐγάζω క్రియను వెలుగు ప్రకాశించడంగా ప్రధాన పాఠంలో తీసుకుంది; వారు వెలుగును చూడకపోవడం అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచింది.
- source_word: τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ
  choice: మెస్సీయ మహిమను గురించిన సువార్త
  rationale: సంబంధక విభక్తుల పొరలను చదవదగిన తెలుగులో వ్యక్తం చేస్తూ, సువార్త మెస్సీయ మహిమను తెలియజేస్తుందనే భావాన్ని కాపాడుతుంది; ‘మహిమగల సువార్త’గా మాత్రమే కుదించదు.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని అర్థాన్ని తెలియజేసే ‘మెస్సీయ’ను ఉపయోగించింది.
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: దేవుని ప్రతిరూపమైన
  rationale: εἰκών యొక్క ప్రత్యక్ష క్రీస్తుసంబంధ ప్రకటనను నిలుపుతుంది; మూలంలో లేని తరువాతి సిద్ధాంత పదజాలాన్ని చేర్చదు.
theological_decisions:
- issue: ‘ఈ యుగపు దేవుడు’ అనే పదబంధం ఎవరిని సూచిస్తుంది
  choice: మూలంలోని బిరుదును అనువదించి, వ్యక్తిగత దుష్ట అధికారిని సూచించే అవకాశాన్ని తెరిచి ఉంచడం
  alternative: పాఠ్యంలోనే ‘సాతాను’ అని పేర్కొనడం లేదా దీనిని కేవలం లోకవ్యవస్థగా మార్చడం
  rationale: సందర్భంలో ఇది సంప్రదాయంగా సాతానుగా గ్రహించబడే దుష్ట అధికారిని సూచించినా, గ్రీకు పాఠ్యం పేరును ప్రత్యక్షంగా చెప్పదు. కాబట్టి అనువాదం మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: αὐγάσαι అనే అరుదైన క్రియ యొక్క కర్తృత్వం
  choice: సువార్త వెలుగు వారిపై ప్రకాశించకపోవడం
  alternative: విశ్వసించని వారు ఆ వెలుగును చూడకపోవడం
  rationale: φωτισμόςతో ఉన్న నిర్మాణంలో వెలుగు ప్రకాశించడం ప్రధాన పాఠ్యానికి సహజంగా సరిపోతుంది; అయితే గ్రహించడం లేదా చూడడం అనే అర్థం సాధ్యమే కాబట్టి పాదసూచికలో ఇచ్చింది.
- issue: ‘దేవుని ప్రతిరూపం’ యొక్క క్రీస్తుసంబంధ బలం
  choice: మెస్సీయ దేవుని ప్రతిరూపమని నేరుగా చెప్పడం
  alternative: దైవసంబంధాన్ని తరువాతి సిద్ధాంత పదాలతో విస్తరించడం
  rationale: గ్రీకు పాఠ్యంలోని బలమైన గుర్తింపును తగ్గించకుండా, అదే సమయంలో మూలంలో లేని వివరణను చేర్చకుండా ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించింది. పొడవైన గ్రీకు వాక్యాన్ని రెండు తెలుగు వాక్యాలుగా విభజించి, రెండవ వాక్యంలో ‘అతడు అలా చేశాడు’ అని చేర్చడం ద్వారా కారణ–ఫలిత సంబంధాన్ని స్పష్టంగా ఉంచింది. రూపకాలు మరియు సంబంధక నిర్మాణాల theological బలాన్ని సరళీకరించకుండా సాధారణ పాఠకునికి చదవదగిన రూపం ఇచ్చింది.
