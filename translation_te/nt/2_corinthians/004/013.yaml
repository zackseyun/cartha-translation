id: 2CO.4.13
reference: 2 Corinthians 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: te
  text: అయితే, “నేను నమ్మాను; అందువల్ల మాట్లాడాను” అని వ్రాయబడి ఉన్న ప్రకారం, అదే విశ్వాసపు ఆత్మను కలిగియున్న మనమూ నమ్ముతున్నాం; అందువల్ల మనమూ మాట్లాడుతున్నాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పౌలు కీర్తన 116:10ను (గ్రీకు పాత నిబంధనలో కీర్తన 115:1) ఉల్లేఖిస్తున్నాడు. లేదా, ఇక్కడ πνεῦμα పరిశుద్ధాత్మను సూచిస్తే, “విశ్వాసపు అదే ఆత్మ.”
    reason: cross_reference; alternative_reading
lexical_decisions:
- source_word: Ἔχοντες δὲ
  choice: అయితే, ... మనకు ఉంది కాబట్టి
  rationale: తెలుగులో సహజమైన వాక్యప్రవాహం కోసం గ్రీకు వర్తమాన కృదంతాన్ని కారణార్థక ఉపవాక్యంగా అందించాం. δέ సూచించే స్వల్ప వ్యత్యాసం లేదా భావవికాసాన్ని ‘అయితే’ నిలుపుతుంది.
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: అదే విశ్వాసపు ఆత్మ
  rationale: గ్రీకు పదబంధంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతూ, విశ్వాసంతో నిండిన అంతరంగ ధోరణి అనే ప్రధాన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; పరిశుద్ధాత్మ సూచన అయ్యే అవకాశాన్ని పాదసూచికలో ఉంచాం.
- source_word: κατὰ τὸ γεγραμμένον
  choice: లేఖనంలో రాసి ఉన్నదాని ప్రకారం
  rationale: ఇది లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే సూత్రప్రయోగం. ‘లేఖనంలో’ అని చేర్చడం తెలుగు పాఠకునికి సూచనను స్పష్టం చేస్తుంది.
- source_word: Ἐπίστευσα, διὸ ἐλάλησα
  choice: నేను నమ్మాను; అందువల్ల మాట్లాడాను
  rationale: రెండు క్రియల కాలభావాన్ని, διό తెలిపే ఫలితసంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν
  choice: మనమూ నమ్ముతున్నాం; అందువల్ల మనమూ మాట్లాడుతున్నాం
  rationale: ἡμεῖς యొక్క ఉద్ఘాటనను మరియు రెండు καί పదాలు చూపే ‘మేము కూడా’ అనే సమాంతరతను ‘మనమూ’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: πνεῦμα అనేది పరిశుద్ధాత్మను సూచిస్తుందా, లేక విశ్వాసంతో కూడిన ఉమ్మడి అంతరంగ ధోరణిని సూచిస్తుందా?
  choice: ప్రధాన పాఠ్యంలో ‘విశ్వాసపు ఆత్మ’
  alternative: ‘విశ్వాసాన్ని కలిగించే అదే ఆత్మ’ లేదా పరిశుద్ధాత్మను సూచించే పఠనం
  rationale: కీర్తన ఉల్లేఖనంలోని ‘నమ్మాను—మాట్లాడాను’ అనే సంబంధం విశ్వాసంతో కూడిన ఉమ్మడి ధోరణిని ప్రధానంగా సూచిస్తుంది. అయినప్పటికీ గ్రీకు పదం పరిశుద్ధాత్మను సూచించే అవకాశాన్ని నిరాకరించదు; అందువల్ల దానిని పాదసూచికలో సంరక్షించాం.
- issue: πιστεύω పదసమూహం అనువాదం
  choice: నమ్మాను / నమ్ముతున్నాం
  alternative: విశ్వసించాను / విశ్వసిస్తున్నాం; విశ్వాసముంచాను / విశ్వాసముంచుతున్నాం
  rationale: ‘నమ్ము’ ఆధునిక సాధారణ తెలుగులో సహజంగా ఉండి, ఉల్లేఖనం మరియు పౌలు అన్వయానికి మధ్య ఉన్న ఒకే పదమూలపు సమాంతరతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని తార్కిక సమాంతరతను నిలుపుతూ, కృదంత నిర్మాణాన్ని సహజ తెలుగు కారణార్థక వాక్యంగా మార్చాం. ‘ఆత్మ’కు సంబంధించిన నిజమైన వ్యాఖ్యాన అస్పష్టతను ప్రధాన పాఠ్యం మరియు పాదసూచిక కలిసి సంరక్షిస్తాయి.
