id: 2CO.4.11
reference: 2 Corinthians 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: te
  text: ఎందుకంటే జీవిస్తున్న మనం యేసు నిమిత్తం[a] ఎల్లప్పుడూ మరణానికి అప్పగించబడుతున్నాం; యేసు జీవం కూడా మరణశీలమైన మన శరీరంలో[b] ప్రత్యక్షమయ్యేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు కారణంగా” లేదా “యేసు కోసం.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “శరీరం” అంటే మరణానికి లోబడిన దేహసంబంధ ఉనికి; “పాపస్వభావం” కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀεὶ
  choice: ఎల్లప్పుడూ
  rationale: నిరంతరంగా లేదా పదేపదే ఎదురయ్యే పరిస్థితిని సహజంగా, నేరుగా తెలియజేస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి వివరణగా ఈ వాక్యాన్ని అనుసంధానిస్తుంది.
- source_word: ἡμεῖς οἱ ζῶντες
  choice: జీవిస్తున్న మనం
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న భావాన్ని నిలుపుతూ, ‘మరణం’తో ఉన్న వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: εἰς θάνατον παραδιδόμεθα
  choice: మరణానికి అప్పగించబడుతున్నాం
  rationale: వర్తమాన కర్మణి ప్రయోగంలోని కొనసాగుతున్న చర్యను, మరణాన్ని ఎదుర్కొనేలా అప్పగించబడే భావాన్ని నిలుపుతుంది.
- source_word: διὰ Ἰησοῦν
  choice: యేసు నిమిత్తం
  rationale: διά + ద్వితీయా విభక్తి సూచించే కారణం లేదా హేతువు రెండింటికీ సరిపోయే గౌరవప్రదమైన తెలుగు ప్రయోగం; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἵνα
  choice: తద్వారా
  rationale: సందర్భంలోని ఉద్దేశం/ఫలితం మధ్య ఉన్న నిజమైన విస్తృతిని బలవంతంగా ఒక్కదానికే పరిమితం చేయకుండా తెలియజేస్తుంది.
- source_word: καὶ ἡ ζωὴ τοῦ Ἰησοῦ
  choice: యేసు జీవం కూడా
  rationale: καί యొక్క సమాంతర భావాన్ని ‘కూడా’తో నిలుపుతూ, గ్రీకు షష్ఠీ నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: φανερωθῇ
  choice: ప్రత్యక్షమవుతుంది
  rationale: కర్మణి భావాన్ని, కర్తను ప్రత్యేకంగా చేర్చకుండా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ἵναతో కలసి ఉద్దేశం/ఫలిత భావాన్ని ఇస్తుంది.
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: మరణశీలమైన మన శరీరంలో
  rationale: ఇక్కడ σάρξ పాపస్వభావాన్ని కాక, మరణానికి లోబడిన దేహసంబంధ ఉనికిని సూచిస్తుంది. తెలుగులో ‘శరీరం’ ఆ భావాన్ని అపార్థం లేకుండా సహజంగా అందిస్తుంది.
theological_decisions:
- issue: పౌలు వాడిన σάρξ పదానికి ఇక్కడి అర్థం
  choice: శరీరం—మరణానికి లోబడిన దేహసంబంధ ఉనికి
  alternative: శరీరధాతువు; పాపస్వభావం
  rationale: ‘మరణశీలమైన’ అనే విశేషణం, సందర్భంలోని శ్రమ మరియు మరణాపాయం కలిసి ఇది భౌతికమైన, బలహీనమైన మానవ దేహాన్ని సూచిస్తున్నాయని తెలియజేస్తాయి. ‘పాపస్వభావం’ అని అనువదించడం ఈ సందర్భంలో లేని నైతిక భావాన్ని దిగుమతి చేస్తుంది.
- issue: διὰ Ἰησοῦνలో కారణం/నిమిత్త భావం
  choice: యేసు నిమిత్తం
  alternative: యేసు కారణంగా; యేసు కోసం
  rationale: గ్రీకు నిర్మాణం కారణం లేదా నిమిత్తాన్ని సూచించగలదు. ‘యేసు నిమిత్తం’ సందర్భానికి సహజంగా సరిపోతూ ఈ భావ విస్తృతిని చాలావరకు నిలుపుతుంది; ప్రత్యామ్నాయాలు పాదసూచికలో ఇవ్వబడ్డాయి.
- issue: ἵναలో ఉద్దేశం లేదా ఫలితం
  choice: తద్వారా
  alternative: అందుకోసం; ఆ విధంగా
  rationale: ఈ సంధాన పదం అపొస్తలుల మరణాపాయం ద్వారా యేసు జీవం ప్రత్యక్షమయ్యే ఉద్దేశం మరియు ఫలితం రెండింటినీ అనుమతిస్తుంది; అనువాదం వాటిలో ఒక్కదానిని మాత్రమే ఖరారు చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘అప్పగించబడుతున్నాం’ ద్వారా గ్రీకు కర్మణి మరియు కొనసాగుతున్న భావం నిలుపబడ్డాయి. ‘మరణశీలమైన మన శరీరంలో’ అనే రూపం కొద్దిగా సాహిత్య గాంభీర్యం కలిగినా స్పష్టంగా ఉంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
