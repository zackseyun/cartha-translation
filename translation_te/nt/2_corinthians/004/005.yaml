id: 2CO.4.5
reference: 2 Corinthians 4:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: te
  text: ఎందుకంటే మేము మమ్మల్ని మేమే ప్రకటించడం లేదు; మెస్సీయ అయిన యేసును[a] ప్రభువుగా ప్రకటిస్తున్నాం, అలాగే యేసు నిమిత్తం[c] మమ్మల్ని మేము మీ బానిసలుగా[b] ప్రకటిస్తున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు యేసును.” గ్రీకు Χριστός పదం బిరుదుగా ఉన్నప్పుడు “మెస్సీయ” అని, పేరులో భాగంలా ఉన్నప్పుడు “క్రీస్తు” అని అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ సేవకులుగా” లేదా “మీ దాసులుగా.” గ్రీకు δοῦλοι అనే పదం సేవకులను లేదా బానిసలను సూచించవచ్చు; ఇక్కడ యేసు ప్రభువుగా ఉండటానికి వ్యత్యాసంగా బలమైన అధీనత భావాన్ని నిలపడానికి “బానిసలు” అని అనువదించాం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “యేసు కారణంగా.”
    reason: alternative_reading
lexical_decisions:
- source_word: κηρύσσομεν
  choice: ప్రకటిస్తున్నాం
  rationale: బహిరంగంగా సందేశాన్ని చాటే κηρύσσω భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; దానిని కేవలం ప్రసంగం చేయడానికే పరిమితం చేయదు.
- source_word: ἑαυτοὺς
  choice: మమ్మల్ని మేము
  rationale: గ్రీకులో పునరావృతమైన ఆత్మవాచక సర్వనామాన్ని నిలుపుతూ, ప్రకటించబడే ప్రభువైన యేసుకు మరియు కొరింథీయుల పట్ల అపొస్తలుల స్థానానికి మధ్య ఉన్న వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: Χριστὸν Ἰησοῦν
  choice: మెస్సీయ అయిన యేసును
  rationale: Χριστόςను ఇక్కడ సజీవమైన బిరుదుగా తీసుకుని ‘మెస్సీయ’ అని అనువదించాం; ‘అయిన’ అనే నిర్మాణం తెలుగులో సహజంగా ఉండి యేసు వ్యక్తినామంతో బిరుదును కలుపుతుంది.
- source_word: κύριον
  choice: ప్రభువుగా
  rationale: κύριον ఇక్కడ విధేయార్థకంగా ఉండి యేసును ఏ హోదాలో ప్రకటిస్తున్నారో తెలుపుతుంది; ‘ప్రభువుగా’ గ్రీకు నిర్మాణాన్ని అదనపు క్రియ లేకుండా నిలుపుతుంది.
- source_word: δούλους
  choice: బానిసలుగా
  rationale: ‘ప్రభువు’తో ఉద్దేశపూర్వకంగా ఏర్పడిన వ్యత్యాసంలో δοῦλος పదంలోని బలమైన అధీనతను ‘బానిస’ నిలుపుతుంది; ‘సేవకుడు’ కంటే ఇది మూలపద బలానికి దగ్గరగా ఉంటుంది.
- source_word: ὑμῶν
  choice: మీ
  rationale: δοῦλος తరువాతి సంబంధవాచక షష్ఠీని తెలుగులో సహజంగా ‘మీ బానిసలుగా’ అని వ్యక్తపరుస్తుంది.
- source_word: διὰ Ἰησοῦν
  choice: యేసు నిమిత్తం
  rationale: διά + ద్వితీయా విభక్తి ఇక్కడ కారణం లేదా ప్రేరణను సూచిస్తుంది; కొరింథీయుల పట్ల వారి అధీన సేవ యేసు కారణంగానే ఉందని తెలియజేస్తుంది.
theological_decisions:
- issue: Χριστόςను బిరుదుగా అనువదించాలా, పేరులో భాగంలా అనువదించాలా
  choice: బిరుదుగా ‘మెస్సీయ’
  alternative: ‘క్రీస్తు యేసు’
  rationale: ఈ వాక్యంలో యేసు గురించి ప్రకటిస్తున్న విషయాన్ని ఈ పదబంధం తెలియజేస్తున్నందున Χριστός యొక్క బిరుదు భావం చురుకుగా ఉంది. అయితే పేరులో భాగంలా చదివే అవకాశాన్ని పాదసూచికలో నిలిపాం.
- issue: Χριστὸν Ἰησοῦν κύριον అనే ప్రకటన నిర్మాణం
  choice: ‘మెస్సీయ అయిన యేసును ప్రభువుగా’
  alternative: ‘ప్రభువైన క్రీస్తు యేసును’ లేదా ‘యేసు క్రీస్తే ప్రభువు అని’
  rationale: κύριονను విధేయార్థకంగా తీసుకుని, యేసును ప్రభువుగా ప్రకటిస్తున్నారనే గ్రీకు నిర్మాణాన్ని కాపాడుతుంది; మూలంలో లేని ‘అని/ఉన్నాడు’ అనే పరిమిత finite వాక్యాన్ని బలవంతంగా చేర్చదు.
- issue: δοῦλος పదంలోని అధీనత బలం
  choice: ‘బానిసలు’
  alternative: ‘సేవకులు’ లేదా ‘దాసులు’
  rationale: యేసు ‘ప్రభువు’ కావడం మరియు అపొస్తలులు విశ్వాసుల పట్ల తమ్మును తాము తగ్గించుకోవడం మధ్యనున్న ఉద్రిక్త వ్యత్యాసాన్ని బలహీనపరచకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. ‘మమ్మల్ని మేము’ అనే పునరుక్తి మూలంలోని ఆత్మవాచక వ్యత్యాసాన్ని నిలుపుతుంది. రెండు భాగాలను విడివిడిగా వాక్యాలుగా ఉంచడం తెలుగులో పఠనసౌలభ్యాన్ని పెంచుతుంది; అయినా రెండింటిలోనూ ‘ప్రకటిస్తున్నాం’ను ఉంచి గ్రీకు సమన్వయ నిర్మాణాన్ని స్పష్టం చేశాం.
