- from: ఎందుకంటే మమ్మల్ని మేము ప్రకటించుకోవడం లేదు; మెస్సీయ అయిన యేసును[a] ప్రభువుగా ప్రకటిస్తున్నాం. యేసు నిమిత్తం[c] మమ్మల్ని మేము మీ బానిసలుగా[b] ప్రకటిస్తున్నాం.
  to: ఎందుకంటే మేము మమ్మల్ని మేమే ప్రకటించడం లేదు; మెస్సీయ అయిన యేసును[a] ప్రభువుగా ప్రకటిస్తున్నాం, అలాగే యేసు నిమిత్తం[c] మమ్మల్ని మేము మీ బానిసలుగా[b] ప్రకటిస్తున్నాం.
