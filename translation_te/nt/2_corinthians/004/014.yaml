id: 2CO.4.14
reference: 2 Corinthians 4:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: te
  text: ఎందుకంటే, యేసును లేపినవాడు యేసుతోపాటు మనలను కూడా లేపి, మీతోపాటు నిలబెడతాడని మనకు తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “యేసు”కు బదులుగా “ప్రభువైన యేసు” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: ఎందుకంటే ... మనకు తెలుసు
  rationale: వ్యాకరణరీత్యా ఇది ‘తెలిసికొని’ అనే భాగధాతు రూపమైనా, సందర్భంలో శ్రమల మధ్య విశ్వాసంతో మాట్లాడటానికి కారణాన్ని తెలియజేస్తుంది. ఆధునిక తెలుగులో కారణార్థం స్పష్టంగా ఉండేందుకు ఈ నిర్మాణం సహజంగా ఉంది.
- source_word: ὁ ἐγείρας τὸν Ἰησοῦν
  choice: యేసును మృతుల్లోనుండి లేపినవాడు
  rationale: కర్తను సూచించే గ్రీకు సపద భాగధాతు నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపింది. ἐγείρω యొక్క పునరుత్థాన భావం స్పష్టమయ్యేందుకు ‘మృతుల్లోనుండి’ చేర్చబడింది; ఇది సందర్భంలో అంతర్లీనమైన అర్థం.
- source_word: καὶ ἡμᾶς ... ἐγερεῖ
  choice: మనలను కూడా లేపి
  rationale: καί లోని అదనపు భావాన్ని ‘కూడా’ తెలియజేస్తుంది; భవిష్యత్ క్రియను తరువాతి ‘నిలబెడతాడు’తో అనుసంధానించే సహజ తెలుగు క్రియారూపం ఉపయోగించబడింది.
- source_word: σὺν Ἰησοῦ
  choice: యేసుతోపాటు
  rationale: σύν యొక్క సహవాస లేదా కలిసియుండే భావాన్ని కాపాడుతుంది; ‘యేసు ద్వారా’ అనే ఆధారంలేని సాధనార్థాన్ని చేర్చదు.
- source_word: παραστήσει
  choice: తన సన్నిధిలో నిలబెడతాడు
  rationale: పదానికి ‘ఎదుట నిలబెట్టడం/సమర్పించడం’ అనే భావం ఉంది. తెలుగులో ‘సమర్పిస్తాడు’ వస్తువును అర్పించే భావాన్ని కలిగించవచ్చు కాబట్టి, అంత్యకాల సంబంధమైన సమక్ష భావాన్ని సహజంగా తెలియజేసే ఈ రూపం ఎంచుకోబడింది. ‘తన’ అనేది దేవుని సమక్షాన్ని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: σὺν ὑμῖν
  choice: మీతోపాటు
  rationale: పౌలు మరియు కొరింథీయులు కలిసి పొందే భవిష్యత్ నిరీక్షణను, σύν యొక్క సహవాస భావంతో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ἐγείρας తరువాతి పాఠాంతరం
  choice: SBLGNT ప్రధాన పాఠాన్ని అనుసరించి ‘యేసు’ అని ప్రధాన వచనంలో ఉంచడం
  alternative: ‘ప్రభువైన యేసు’
  rationale: ఇది సిద్ధాంతపరమైన తేడా కాక పాఠాంతర విషయం. ప్రధాన వచనం ఇవ్వబడిన గ్రీకు పాఠాన్ని అనుసరిస్తుంది; విస్తృత పాఠాంతరాన్ని పాదసూచికలో పారదర్శకంగా ఉంచుతుంది.
- issue: παραστήσει యొక్క అంత్యకాల భావం
  choice: పౌలును, సహచరులను, కొరింథీయులను కలిసి దేవుని సన్నిధిలో నిలబెట్టే భవిష్యత్ కార్యంగా అనువదించడం
  alternative: సాధారణంగా ‘సమర్పిస్తాడు’ లేదా ప్రత్యేకంగా తీర్పు సింహాసనం ఎదుట నిలబెడతాడు
  rationale: పునరుత్థాన సందర్భం అంత్యకాల సమక్షాన్ని సూచిస్తుంది. అయితే గ్రీకు పేర్కొనని తీర్పు స్థలాన్ని లేదా ఖచ్చిత పరిస్థితిని అనువాదం నిర్దేశించదు.
- issue: σὺν Ἰησοῦ లోని సంబంధం
  choice: ‘యేసుతోపాటు’ అనే సహవాసార్థం
  alternative: ‘యేసు ద్వారా’ అనే సాధనార్థం
  rationale: σύν + దత్తివిభక్తి ఇక్కడ సహవాసాన్ని సహజంగా సూచిస్తుంది. సాధనార్థాన్ని చేర్చడం మూలపాఠాన్ని మించి వ్యాఖ్యానించడం అవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరమైన కానీ అతిగా గ్రాంథికం కాని శైలి. ‘లేపడం’ పునరుత్థాన పదసంబంధాన్ని నిలుపుతుంది; ‘సన్నిధిలో నిలబెడతాడు’ παραστήσει లోని సమక్ష భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
