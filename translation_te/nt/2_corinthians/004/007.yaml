id: 2CO.4.7
reference: 2 Corinthians 4:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἔχομεν δὲ τὸν θησαυρὸν τοῦτον ἐν ὀστρακίνοις σκεύεσιν, ἵνα ἡ ὑπερβολὴ τῆς δυνάμεως ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: te
  text: అయితే ఈ నిధి మట్టి పాత్రల్లో[a] మనకు ఉంది; శక్తి యొక్క అపారమైన గొప్పతనం[b] దేవునిదే గాని మన నుండి కానట్లుగా ఉండటానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మట్టితో చేసిన పాత్రల్లో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అసాధారణమైన శక్తి” లేదా “అతిశయమైన శక్తి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχομεν δὲ
  choice: అయితే ... మనకు ఉంది
  rationale: δὲ యొక్క సందర్భానుసారమైన వ్యత్యాస భావాన్ని ‘అయితే’ తెలియజేస్తుంది; Ἔχομενను సహజమైన వర్తమాన స్వాధీన వాక్యంగా అనువదిస్తుంది.
- source_word: τὸν θησαυρὸν τοῦτον
  choice: ఈ నిధి
  rationale: θησαυρός యొక్క సాధారణ అర్థమైన ‘నిధి’ని, వెనుకటి సందర్భాన్ని సూచించే demonstrativeతో సహా నిలుపుతుంది; రూపకాన్ని వివరించి పరిమితం చేయదు.
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: మట్టి పాత్రల్లో
  rationale: ὀστράκινος కాల్చిన మట్టితో చేసినదాన్ని, σκεῦος పాత్రను సూచిస్తాయి. ‘మట్టి పాత్రలు’ ఆధునిక తెలుగులో సహజంగా ఉండి, బలహీనత మరియు సామాన్యతను సూచించే రూపకాన్ని నిలుపుతుంది.
- source_word: ἵνα
  choice: దీనివల్ల ... స్పష్టమవుతుంది
  rationale: తెలుగులో సహజంగా ఉద్దేశం/ఫలితం రెండింటికీ చోటిచ్చే నిర్మాణం; గ్రీకు ἵνα వాక్యభాగాన్ని కేవలం ఫలితంగా మాత్రమే కుదించదు.
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: ఆ అసాధారణమైన శక్తి
  rationale: ὑπερβολή సూచించే సాధారణ పరిమితిని మించిన విశిష్టతను ‘అసాధారణమైన’ తెలియజేస్తుంది; τῆς δυνάμεωςను శక్తిగా నిలుపుతుంది.
- source_word: ᾖ τοῦ θεοῦ
  choice: దేవునిదే ... అని స్పష్టమవుతుంది
  rationale: తెలుగులో ‘దేవునిదే’ మూల గ్రీకులోని genitive భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ἵναతో ఉన్న subjunctive భావాన్ని వాక్య నిర్మాణం ద్వారా తెలియజేస్తుంది.
- source_word: καὶ μὴ ἐξ ἡμῶν
  choice: మన నుండి వచ్చినది కాదని
  rationale: ἐξ యొక్క మూలం/source భావాన్ని ‘నుండి వచ్చినది’ స్పష్టంగా నిలుపుతుంది; దేవుడు–మనుషులు అనే వ్యత్యాసాన్ని అతివ్యాఖ్య చేయదు.
theological_decisions:
- issue: ‘నిధి’ మరియు ‘మట్టి పాత్రలు’ రూపకాల స్వభావం
  choice: నిధిని సువార్తగా గాని, పాత్రలను శరీరాలు లేదా మానవ బలహీనతగా గాని ప్రధాన వాక్యంలో వివరించకుండా రూపకంగానే ఉంచడం.
  alternative: ‘సువార్త అనే నిధి’ లేదా ‘బలహీనమైన మా శరీరాల్లో’ అని వ్యాఖ్యానాత్మకంగా విస్తరించడం.
  rationale: చుట్టుపక్కల సందర్భం రూపకానికి వివరణ ఇస్తున్నా, ఈ వచనం స్వయంగా రూపక భాషనే వాడుతుంది. దానిని విప్పి చెప్పడం మూలపాఠం కన్నా ఎక్కువ వ్యాఖ్యానాన్ని చేర్చుతుంది.
- issue: ἵνα వాక్యభాగం యొక్క ఉద్దేశం/ఫలిత భావం
  choice: ‘దీనివల్ల ... స్పష్టమవుతుంది’ అని అనువదించి ఉద్దేశం మరియు ఫలితం మధ్య ఉన్న భావ విస్తృతిని నిలుపడం.
  alternative: కేవలం ఉద్దేశంగా ‘... స్పష్టమయ్యేలా’ లేదా కేవలం ఫలితంగా ‘ఫలితంగా ... స్పష్టమైంది’ అని అనువదించడం.
  rationale: ఇక్కడ ἵνα ఉద్దేశాన్ని సూచిస్తూనే ఫలిత ఛాయను కలిగి ఉండవచ్చు. ఎంచుకున్న తెలుగు నిర్మాణం ఆ ఉద్రిక్తతను పూర్తిగా పరిష్కరించకుండా సహజంగా వ్యక్తం చేస్తుంది.
- issue: శక్తి దేవునితో ఉన్న సంబంధం
  choice: ‘ఆ ... శక్తి దేవునిదే’ అని చెప్పడం.
  alternative: ‘ఆ శక్తి దేవుని నుండి వస్తుంది’ అని source భావంతో మార్చడం.
  rationale: τοῦ θεοῦ genitiveను స్వాధీన/సంబంధ భావంతో నిలిపి, వెంటనే వచ్చే ἐξ ἡμῶν అనే స్పష్టమైన source పదబంధంతో దానిని కలిపివేయకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘నిధి,’ ‘మట్టి పాత్రలు’ అనే పౌలు రూపకాలను యథాతథంగా నిలిపి, వాక్యాన్ని తెలుగు సహజ క్రమంలో అమర్చాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
