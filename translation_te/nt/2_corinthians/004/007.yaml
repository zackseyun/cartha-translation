- from: అయితే ఈ నిధి మట్టి పాత్రల్లో[a] మనకు ఉంది. దీనివల్ల ఆ అసాధారణమైన శక్తి[b] దేవునిదే గాని మన నుండి వచ్చినది కాదని స్పష్టమవుతుంది.
  to: అయితే ఈ నిధి మట్టి పాత్రల్లో[a] మనకు ఉంది; శక్తి యొక్క అపారమైన గొప్పతనం[b] దేవునిదే గాని మన నుండి కానట్లుగా ఉండటానికి.
