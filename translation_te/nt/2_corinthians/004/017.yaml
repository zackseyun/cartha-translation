id: 2CO.4.17
reference: 2 Corinthians 4:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ γὰρ παραυτίκα ἐλαφρὸν τῆς θλίψεως ⸀ἡμῶν καθ’ ὑπερβολὴν εἰς ὑπερβολὴν αἰώνιον βάρος δόξης κατεργάζεται ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/017.yaml
  text: For our momentary light affliction is producing for us an eternal weight of glory beyond all comparison,[a]
translation:
  language: te
  text: ఎందుకంటే మన క్షణికమైన తేలికపాటి శ్రమ, మనకొరకు పోల్చలేనంత గొప్పదైన[a] నిత్య మహిమాభారాన్ని కలుగజేస్తోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అత్యంత అపారమైన స్థాయిలో.” గ్రీకులో అక్షరార్థంగా, “అతిశయానికి అనుగుణంగా అతిశయానికి” అనే తీవ్రతను తెలిపే ప్రయోగం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραυτίκα
  choice: క్షణకాలముండే
  rationale: ప్రస్తుతానికి మాత్రమే ఉండే తాత్కాలిక స్వభావాన్ని తెలియజేస్తూ, తరువాతి ‘నిత్య’ అనే పదంతో ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐλαφρὸν
  choice: తేలికపాటి
  rationale: తరువాత వచ్చే βάρος (‘భారం’)తో పౌలు ఉద్దేశించిన తేలిక–భారం అలంకార వ్యత్యాసాన్ని కాపాడుతుంది; శ్రమ అసలు తీవ్రమైనది కాదని నిరాకరించదు, నిత్య మహిమతో పోల్చి చెబుతుంది.
- source_word: θλίψεως
  choice: శ్రమ
  rationale: ఒత్తిడి, బాధ, కష్టం అనే భావాలను మోసే సహజమైన ఆధునిక తెలుగు పదం; ప్రత్యేక అంత్యకాల సాంకేతిక భావాన్ని అనవసరంగా చేర్చదు.
- source_word: ἡμῶν
  choice: మన
  rationale: మూలంలోని స్వామ్య సంబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολὴν
  choice: పోల్చలేనంత గొప్పదైన
  rationale: ‘అతిశయాన్ని మించి అతిశయం’ అనే గ్రీకు తీవ్రతా ప్రయోగాన్ని సహజ తెలుగులో వ్యక్తపరుస్తూ, అపారమైన పరిమాణాన్ని సూచిస్తుంది.
- source_word: αἰώνιον
  choice: నిత్య
  rationale: తాత్కాలిక శ్రమకు వ్యతిరేకంగా అంతంలేని స్థిరత్వాన్ని తెలియజేస్తుంది.
- source_word: βάρος
  choice: భారం
  rationale: ἐλαφρόν (‘తేలికపాటి’)తో ఉన్న ఉద్దేశపూర్వక రూపక వ్యత్యాసాన్ని నిలుపుతుంది; ‘భారం’ను ప్రతికూలమైన బరువుగా కాక మహిమ యొక్క ఘనతగా సందర్భం నిర్దేశిస్తుంది.
- source_word: δόξης
  choice: మహిమాభారం
  rationale: ‘మహిమ యొక్క భారం’ అనే మూల రూపకాన్ని తెలుగు సమాసంలో సంక్షిప్తంగా, గంభీరంగా నిలుపుతుంది.
- source_word: κατεργάζεται
  choice: కలుగజేస్తోంది
  rationale: కొనసాగుతున్న ప్రభావవంతమైన ఫలితాన్ని తెలుపుతుంది; శ్రమ మానవ పుణ్యంతో రక్షణను సంపాదిస్తుందని అదనంగా చెప్పదు.
- source_word: ἡμῖν
  choice: మన కోసం
  rationale: దత్తివిభక్తిలోని ప్రయోజనార్థక భావాన్ని వ్యక్తపరుస్తుంది; ‘మనలో’ అని అనువదించి కేవలం అంతర్గత నైతిక వికాసానికి పరిమితం చేయదు.
- source_word: τὸ ... ἐλαφρὸν τῆς θλίψεως ἡμῶν
  choice: క్షణకాలముండే మన తేలికపాటి శ్రమ
  rationale: మూలంలోని తాత్కాలికత, తేలిక, స్వామ్య సంబంధం అన్నిటినీ సహజమైన తెలుగు పదక్రమంలో ఉంచుతుంది.
theological_decisions:
- issue: శ్రమ కలుగజేసే మహిమ స్వభావం
  choice: ప్రస్తుత శ్రమ విశ్వాసుల కోసం భవిష్యత్తులోని నిత్య మహిమను కలుగజేస్తుందని వాక్యం చెప్పే విధంగానే అనువదించబడింది.
  alternative: శ్రమ మానవ పుణ్యంగా మహిమను సంపాదిస్తుంది; లేదా ఇది కేవలం ప్రస్తుత ఆత్మీయ పరిపక్వతనే కలుగజేస్తుంది.
  rationale: ‘క్షణకాలం’–‘నిత్య’ అనే వ్యత్యాసం భవిష్యత్తు మహిమను సూచిస్తుంది. అయితే κατεργάζεται లోని బలమైన ఫలిత సంబంధాన్ని బలహీనపరచకుండా, పుణ్యసంపాదన సిద్ధాంతాన్ని కూడా అనువాదంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గంభీరమైన శైలిని అనుసరించాం. ‘తేలికపాటి’–‘మహిమాభారం’ అనే మూల రూపక వ్యత్యాసాన్ని కాపాడి, శ్రమను అలక్ష్యం చేస్తున్న భావం రాకుండా సందర్భానుసారమైన పోలికగా ఉంచాం.
