id: 2CO.4.12
reference: 2 Corinthians 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε ⸀ὁ θάνατος ἐν ἡμῖν ἐνεργεῖται, ἡ δὲ ζωὴ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/012.yaml
  text: So then[a], death is at work in us, but life in you.
translation:
  language: te
  text: కాబట్టి[a] మాలో మరణం పనిచేస్తోంది; మీలో మాత్రం జీవం పనిచేస్తోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాని ఫలితంగా.’
    reason: ὥστε ఫలితాన్ని లేదా ముందున్న విషయాలనుంచి వచ్చే నిర్ధారణను సూచించగలదు.
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందున్న 8–11 వచనాల చర్చనుంచి వచ్చే ఫలితాన్ని లేదా నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ θάνατος
  choice: మరణం
  rationale: ఇక్కడ ఒక నిర్దిష్ట మరణ సంఘటనకన్నా, పౌలు మరియు అతని సహసేవకుల బాధల్లో క్రియాశీలంగా ఉన్న మరణ వాస్తవాన్ని సూచిస్తుంది; తెలుగు వాడుకలో నిర్దేశక పదం అవసరం లేదు.
- source_word: ἐν ἡμῖν
  choice: మాలో
  rationale: అపొస్తల సేవకుల అనుభవాన్ని కొరింథీయుల అనుభవంతో నేరుగా వ్యతిరేకంగా ఉంచుతుంది; వ్యక్తిగత, సామూహిక భావాలు రెండింటినీ తెరిచి ఉంచుతుంది.
- source_word: ἐνεργεῖται
  choice: పనిచేస్తోంది
  rationale: క్రియ కొనసాగుతూ ప్రభావం చూపుతున్న భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; ‘క్రియాశీలంగా ఉంది’ కంటే సాధారణ పాఠకులకు సులభంగా ఉంటుంది.
- source_word: ἡ δὲ ζωὴ
  choice: మీలో మాత్రం జీవం
  rationale: δέ సూచించే వ్యత్యాసాన్ని ‘మాత్రం’ స్పష్టంగా చూపుతుంది. గ్రీకులో రెండో భాగంలో క్రియ అధ్యాహారంగా ఉన్నందున తెలుగులో సహజత కోసం ‘పనిచేస్తోంది’ పునరుక్తం చేయబడింది.
- source_word: ἐν ὑμῖν
  choice: మీలో
  rationale: ἐν ἡμῖν అనే సమాంతర పదబంధానికి సరిపోతూ, కొరింథీయులలో వ్యక్తిగతంగానూ సంఘపరంగానూ జీవం కార్యసాధకంగా ఉందనే విస్తృత భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: మరణం–జీవం వ్యత్యాసం యొక్క అర్థం
  choice: అపొస్తలుల మరణసదృశమైన బాధల్లో మరణం పనిచేస్తుండగా, వారి సేవ ద్వారా కొరింథీయులలో జీవం పనిచేస్తోందనే విస్తృత వ్యత్యాసాన్ని యథాతథంగా ఉంచడం.
  alternative: దీనిని కేవలం శారీరక మరణం–శారీరక సంరక్షణగా గానీ, కేవలం ఆత్మనిరాకరణ–నిత్యజీవంగా గానీ స్పష్టీకరించడం.
  rationale: సమీప సందర్భం యేసు మరణం మరియు జీవం అపొస్తలుల శరీరాల్లో ప్రత్యక్షమవడాన్ని చెబుతుంది; విస్తృత సందర్భం ఇతరులకు జీవాన్ని అందించే సేవను సూచిస్తుంది. అందువల్ల ‘మరణం’, ‘జీవం’ అనే సంక్షిప్త పదాల ఉద్దేశపూర్వక విస్తృతిని అనువాదం కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని సంక్షిప్త వ్యత్యాసాన్ని నిలుపుతూ, తెలుగులో అసంపూర్ణంగా అనిపించకుండా రెండో భాగంలో క్రియను పునరుక్తం చేశాం.
