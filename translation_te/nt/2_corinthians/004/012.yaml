  source_fidelity: ‘కాబట్టి’ correctly conveys the inferential/resultative force of ὥστε in context. ‘మాలో మరణం పనిచేస్తోంది; మీలో మాత్రం జీవం పనిచేస్తోంది’ retains the Greek’s central antithesis, its ongoing effective-operation sense (ἐνεργεῖται), and the parallel ἐν ἡμῖν / ἐν ὑμῖν expressions without over-interpreting ‘death’ or ‘life.’ Repeating the verb in the second Telugu clause is a natural, non-expansive rendering of the Greek ellipsis.
  naturalness: The wording is clear, idiomatic modern standard Telugu, and suitably concise for the elevated but accessible register of the passage. ‘మాత్రం’ naturally marks the δέ contrast here.
