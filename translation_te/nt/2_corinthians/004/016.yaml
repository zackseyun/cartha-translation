reference: 2 Corinthians 4:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὸ οὐκ ⸀ἐγκακοῦμεν, ἀλλ’ εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ’ ὁ ⸂ἔσω ἡμῶν⸃ ἀνακαινοῦται ἡμέρᾳ καὶ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: te
  text: అందుచేత మేము అధైర్యపడము. మా బాహ్య మనిషి క్షీణించిపోతున్నప్పటికీ, అయితే మా అంతరంగ మనిషి రోజురోజుకూ నూతనపరచబడుతున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: అందుచేత
  rationale: ముందటి వాదననుంచి వచ్చే నిర్ధారణను సహజమైన, గౌరవప్రదమైన తెలుగులో సూచిస్తుంది.
- source_word: οὐκ ἐγκακοῦμεν
  choice: మేము అధైర్యపడము
  rationale: ధైర్యాన్ని కోల్పోకపోవడం లేదా మనసు విరిగిపోకపోవడం అనే పౌలు వాడుకలోని భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἀλλ’ εἰ καὶ
  choice: …పోతున్నా
  rationale: అంగీకారార్థక విరోధ భావాన్ని తెలుగులో సహజమైన concessive నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: మా బాహ్య మనిషి
  rationale: ἄνθρωπος అనే ఏకవచన ప్రతినిధి పదాన్ని ఉంచుతూ, తరువాతి ‘అంతరంగ మనిషి’తో ఉన్న ఉద్దేశపూర్వక సమాంతరాన్ని కాపాడుతుంది.
- source_word: διαφθείρεται
  choice: క్షీణించిపోతున్నా
  rationale: వర్తమాన కర్మణి రూపం సూచించే కొనసాగుతున్న చెడిపోవడం లేదా బలహీనపడడం అనే ప్రక్రియను తెలియజేస్తుంది; పూర్తిగా నాశనం కావడం అనే అధిక భావాన్ని రుద్దదు.
- source_word: ἀλλ’
  choice: మా అంతరంగ మనిషి
  rationale: తెలుగు వాక్య నిర్మాణంలోని ప్రత్యక్ష విరుద్ధ సమాంతరం రెండవ ἀλλά యొక్క బలాన్ని సహజంగా వ్యక్తం చేస్తుంది; అదనపు సంధిపదం అవసరం లేదు.
- source_word: ὁ ἔσω ἡμῶν
  choice: మా అంతరంగ మనిషి
  rationale: మూలంలోని సంక్షిప్త రూపంలో ఊహించబడిన ἄνθρωποςను స్పష్టపరచి, ‘బాహ్య మనిషి’తో ఉన్న పదబంధ సమాంతరాన్ని నిలుపుతుంది.
- source_word: ἀνακαινοῦται
  choice: నూతనపరచబడుతున్నాడు
  rationale: కొనసాగుతూ, కర్తకు వెలుపలి కార్యసాధకునిచేత జరిగే నూతనీకరణను వర్తమాన కర్మణి రూపంతో కాపాడుతుంది.
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: రోజురోజుకూ
  rationale: నిరంతరంగా ప్రతి రోజు జరుగుతున్న ప్రక్రియను తెలిపే సహజమైన ఆధునిక తెలుగు నానుడి.
theological_decisions:
- issue: ὁ ἔξω ἄνθρωπος మరియు ὁ ἔσω మధ్య మానవ సంబంధిత వ్యత్యాసం
  choice: ‘బాహ్య మనిషి’ / ‘అంతరంగ మనిషి’ అని అనువదించడం
  alternative: ‘బాహ్య స్వరూపం’ / ‘అంతరంగ స్వరూపం’ లేదా ‘బాహ్య వ్యక్తి’ / ‘అంతరంగ వ్యక్తి’
  rationale: పౌలు ఉద్దేశపూర్వకంగా ఉంచిన బాహ్య–అంతరంగ మానవ జీవితం మధ్య వ్యత్యాసాన్ని ఇది నిలుపుతుంది. దేహం–ఆత్మ గురించి ఈ వాక్యం స్వయంగా నిర్వచించని సంపూర్ణ ద్వైత సిద్ధాంతాన్ని అనువాదం రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘బాహ్య మనిషి/అంతరంగ మనిషి’ కొద్దిగా సాహిత్య ధోరణి కలిగినప్పటికీ, మూలంలోని పదసామ్యాన్ని మరియు పౌలు వాడిన ప్రతీకాత్మక ఉద్రిక్తతను కాపాడుతుంది.
