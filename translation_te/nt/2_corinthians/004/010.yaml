source:
  edition: SBLGNT
  text: πάντοτε τὴν νέκρωσιν ⸀τοῦ Ἰησοῦ ἐν τῷ σώματι περιφέροντες, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ ἐν τῷ σώματι ἡμῶν φανερωθῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/010.yaml
  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: te
  text: యేసు మరణాన్ని[a] ఎల్లప్పుడూ శరీరంలో మోస్తూ ఉన్నాం; తద్వారా యేసు జీవం కూడా మా శరీరంలో వెల్లడవుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘యేసు మరణించడాన్ని.’ గ్రీకు నామవాచకం శరీరంలో మోసే మరణస్థితిని లేదా మరణానుభవాన్ని నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: నిరంతర పరిస్థితిని సూచించే క్రియావిశేషణం; సహజమైన ఆధునిక తెలుగులో కొనసాగుతున్న భావాన్ని నిలుపుతుంది.
- source_word: νέκρωσιν
  choice: మరణాన్ని
  rationale: మరణస్థితి లేదా మరణానుభవాన్ని సూచిస్తుంది. తరువాతి ‘జీవం’తో ఉన్న సమాంతరతను స్పష్టంగా నిలుపుతుంది; ‘మరణించడాన్ని’ అనే ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: τοῦ Ἰησοῦ
  choice: యేసు
  rationale: గ్రీకు షష్ఠీ విభక్తి సంబంధాన్ని ‘యేసు మరణం’గా సహజంగా ఉంచి, ఆ సంబంధాన్ని మరింత నిర్దిష్టంగా వ్యాఖ్యానించదు.
- source_word: ἐν τῷ σώματι
  choice: శరీరంలో
  rationale: మొదటి ప్రయోగంలో గ్రీకులో స్పష్టమైన స్వామ్యసూచక సర్వనామం లేదు; కాబట్టి ‘మా’ను చేర్చకుండా మూలంలోని రూపాన్ని నిలుపుతుంది.
- source_word: περιφέροντες
  choice: మోస్తూ ఉన్నాం
  rationale: వర్తమాన కృదంతంలోని నిరంతరంగా భరించే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἵνα
  choice: తద్వారా
  rationale: ఉద్దేశం లేదా ఫలితం రెండింటికీ చోటు ఇచ్చే విధంగా ఉపవాక్య సంబంధాన్ని తెలియజేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: యేసు మరణం, యేసు జీవం మధ్య ఉన్న అనురూపమైన అదనపు సంబంధాన్ని నిలుపుతుంది.
- source_word: ζωὴ
  choice: జీవం
  rationale: యేసుకు సంబంధించిన ప్రత్యక్షమయ్యే జీవాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: మా శరీరంలో
  rationale: గ్రీకులో ఏకవచన ‘శరీరం’తో బహువచన స్వామ్యసూచకం ఉంది. ‘మా శరీరంలో’ అనే సామూహిక ఏకవచనం మూలంలోని వాక్చాతుర్యాన్ని నిలుపుతుంది.
- source_word: φανερωθῇ
  choice: వెల్లడవుతుంది
  rationale: కనబడేలా చేయబడటం లేదా ప్రత్యక్షం కావడం అనే భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; ἵνα ఉపవాక్యంలో ఉద్దేశం/ఫలిత భావాన్ని ‘తద్వారా’ మోస్తుంది.
theological_decisions:
- issue: యేసుకు సంబంధించి νέκρωσις అర్థం
  choice: ‘యేసు మరణం’ అని అనువదించడం
  alternative: ‘యేసు మరణించడాన్ని’ అని అనువదించడం
  rationale: రెండూ సందర్భంలో సాధ్యమే. ‘మరణం’ అనే రూపం నామవాచకపు ప్రధాన భావాన్నీ, ‘యేసు జీవం’తో సమాంతరతనూ నిలుపుతుంది; శరీరంలో అనుభవించే మరణప్రక్రియ భావాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
- issue: σῶμα సంఖ్య
  choice: రెండు చోట్లా ఏకవచన ‘శరీరం’ను నిలుపడం
  alternative: రెండవ చోట ‘మా శరీరాల్లో’ అని బహువచనం చేయడం
  rationale: గ్రీకులో రెండు ప్రయోగాలూ ఏకవచనంలో ఉన్నాయి. ఏకవచనం పౌలు సేవలోని సామూహిక, శరీరసంబంధ భావాన్నీ వాక్య సమాంతరతనూ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరంగా ఉంది. మొదటి ‘శరీరంలో’ వద్ద మూలంలో లేని స్వామ్యసూచకాన్ని చేర్చలేదు; రెండవదిలోని సామూహిక ఏకవచనాన్ని ‘మా శరీరంలో’గా నిలిపింది.
