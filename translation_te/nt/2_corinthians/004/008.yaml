  to: అన్ని విధాలా శ్రమలకు గురవుతున్నాం[a], అయినా నలిగిపోకుండా ఉన్నాం[b]; ఏమి చేయాలో తోచని స్థితిలో ఉన్నాం, అయినా పూర్తిగా దిక్కుతోచని స్థితిలో లేము[c].
