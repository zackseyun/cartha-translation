  source_fidelity: 'మొదటి జంట మూలగ్రీకు భావాన్ని సరిగ్గా ప్రతిబింబిస్తోంది: సమగ్రంగా ఎదురయ్యే శ్రమ మరియు దానివల్ల పూర్తిగా నలిగిపోకపోవడం మధ్య వ్యత్యాసం నిలిచింది. రెండవ జంటలో ἀπορέω యొక్క ‘ఏమి చేయాలో తోచకపోవడం’ భావం సరైనదే. అయితే ἐξαπορέωను ‘స్థితికి చేరడం లేదు’గా చెప్పడం మూలంలోని సమాంతర వర్తమాన భాగరూపాన్ని కొద్దిగా బలహీనపరుస్తుంది; ‘పూర్తిగా దిక్కుతోచని స్థితిలో లేము’ మూలవ్యత్యాసాన్ని మరింత నేరుగా ఇస్తుంది.'
  naturalness: ‘పూర్తిగా దిక్కుతోచని స్థితికి చేరడం లేదు’ అనేది తెలుగులో కొంత భారంగా, గతిశీల మార్పును సూచించేలా వినిపిస్తుంది. ‘పూర్తిగా దిక్కుతోచని స్థితిలో లేము’ సహజమైన ఆధునిక ప్రామాణిక తెలుగు; రెండు వ్యతిరేక జంటల సమాంతర లయను కూడా మెరుగుపరుస్తుంది. ‘అయినా నలిగిపోకుండా ఉన్నాం’ అనేది అదే వర్తమాన-స్థితి నిర్మాణాన్ని స్పష్టంగా ఉంచుతుంది.
