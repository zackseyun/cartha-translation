  text: ἐν παντὶ θλιβόμενοι ἀλλ’ οὐ στενοχωρούμενοι, ἀπορούμενοι ἀλλ’ οὐκ ἐξαπορούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/008.yaml
  text: We are afflicted in every way[a], but not crushed; perplexed[c][b], but not driven to despair.
translation:
  language: te
  text: అన్ని విధాలా శ్రమలకు గురవుతున్నాం[a], అయినా నలిగిపోకుండా ఉన్నాం[b]; ఏమి చేయాలో తోచని స్థితిలో ఉన్నాం, అయినా పూర్తిగా దిక్కుతోచని స్థితిలో లేము[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రతి విషయంలోనూ”; ఇది అక్షరార్థంగా అన్ని వైపుల నుంచి అని కాకుండా, శ్రమల సమగ్ర పరిధిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: మూలపదం అక్షరార్థంగా “ఇరుకులో పెట్టబడడం” లేదా “కుదించబడడం” అనే భావాన్ని ఇస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “నిరాశలో కూరుకుపోవడం లేదు.” గ్రీకు పదం ముందటి “తోచని స్థితి” అనే భావాన్ని తీవ్రతరం చేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: అన్ని విధాలా
  rationale: ఈ ప్రయోగం స్థలాన్ని కాకుండా శ్రమల సమగ్ర పరిధిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘అన్ని విధాలా’ సహజంగా, స్పష్టంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: θλιβόμενοι
  choice: శ్రమలకు గురవుతున్నాం
  rationale: θλίβω బయటి ఒత్తిడి, బాధ, కష్టాలకు లోనవడాన్ని సూచిస్తుంది. తరువాతి στενοχωρούμενοιతో ఉన్న వ్యత్యాసం నిలిచేలా సాధారణ పాఠకులకు అర్థమయ్యే రూపం ఎంచుకోబడింది.
- source_word: στενοχωρούμενοι
  choice: నలిగిపోవడం
  rationale: ఈ పదంలో ఇరుకులో చిక్కుకోవడం లేదా ఒత్తిడివల్ల కుంగిపోవడం అనే రూపకం ఉంది. ‘నలిగిపోవడం లేదు’ అనేది ఒత్తిడికి లోనైనా పూర్తిగా కూలిపోలేదనే నిరాకరణను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἀπορούμενοι
  choice: ఏమి చేయాలో తోచని స్థితిలో ఉన్నాం
  rationale: ἀπορέω ఏమి చేయాలో లేదా ఏ దారి పట్టాలో తెలియక తికమకపడే స్థితిని సూచిస్తుంది. ‘కలవరపడుతున్నాం’ కంటే ఈ రూపం మూలంలోని దారితోచకపోవడం అనే భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἐξαπορούμενοι
  choice: పూర్తిగా దిక్కుతోచని స్థితికి చేరడం
  rationale: ἐξ- ఉపసర్గ ముందటి ἀπορέω భావాన్ని తీవ్రతరం చేస్తుంది. ఈ అనువాదం నిరాశ అనే మానసిక లేదా సిద్ధాంతపరమైన భావాన్ని అనవసరంగా బలపరచకుండా, సంపూర్ణంగా మార్గం లేకపోవడం అనే తీవ్రతను కాపాడుతుంది.
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: అయినా ... లేదు; ... అయినా ... లేదు
  rationale: పునరావృతమైన వ్యతిరేక నిర్మాణం పౌలు వాక్యంలోని లయను, కష్టానికీ దాని పరిమితికీ మధ్యనున్న స్పష్టమైన వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: రెండవ భాగంలోని ἐξαπορούμενοι తీవ్రత
  choice: ‘పూర్తిగా దిక్కుతోచని స్థితికి చేరడం లేదు’ అని అనువదించడం
  alternative: ‘నిరాశలో కూరుకుపోవడం లేదు’ అని అనువదించడం
  rationale: మూలపదం ముందటి ‘తోచని స్థితి’ని తీవ్రతరం చేస్తుంది; అది తప్పనిసరిగా విశ్వాసం కోల్పోవడం లేదా మానసిక నిరాశ అనే సాంకేతిక భావాన్ని ప్రకటించదు. ఎంపిక చేసిన రూపం ఈ అస్పష్టతను, తీవ్రతను రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. రెండు విరుద్ధ జంటల లయను నిలుపుతూ, మొదటి జంటలో బయటి ఒత్తిడి–పూర్తి నలిగిపోవడం, రెండవ జంటలో తికమక–సంపూర్ణ దిక్కుతోచకపోవడం మధ్య తేడా స్పష్టంగా ఉంచబడింది.
