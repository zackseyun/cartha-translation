revisions:
- from: అయితే, సిగ్గుకరమైన రహస్య కార్యాలను మేము త్యజించాము. కపటంతో నడుచుకోము; దేవుని వాక్యాన్ని మోసపూరితంగా వక్రీకరించము.[a] దానికి బదులుగా, సత్యాన్ని బహిర్గతం చేయడం ద్వారా దేవుని ఎదుట ప్రతి మనిషి మనస్సాక్షికి మమ్మల్ని మేము యోగ్యులుగా చూపిస్తున్నాము.[b]
  to: అయితే, సిగ్గుకరమైన రహస్య కార్యాలను మేము విడిచిపెట్టాము; కపటంతో నడుచుకోకుండా, దేవుని వాక్యాన్ని మోసపూరితంగా వక్రీకరించకుండా,[a] సత్యాన్ని బహిరంగంగా వెల్లడించడం ద్వారా[b] దేవుని ఎదుట ప్రతి మనిషి మనస్సాక్షికి మమ్మల్ని మేమే సిఫారసు చేసుకుంటున్నాము.
  rationale: The revision preserves the source’s participial syntax, removes the added notion of worthiness, and places the footnote anchor directly after the expression it explains. It retains the draft’s sound rendering of the deceptive handling of God’s word and the public disclosure of truth.
