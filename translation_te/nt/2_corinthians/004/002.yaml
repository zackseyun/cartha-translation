id: 2CO.4.2
reference: 2 Corinthians 4:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: te
  text: అయితే, సిగ్గుకరమైన రహస్య కార్యాలను మేము విడిచిపెట్టాము; కపటంతో నడుచుకోకుండా, దేవుని వాక్యాన్ని మోసపూరితంగా వక్రీకరించకుండా,[a] సత్యాన్ని బహిరంగంగా వెల్లడించడం ద్వారా[b] దేవుని ఎదుట ప్రతి మనిషి మనస్సాక్షికి మమ్మల్ని మేమే సిఫారసు చేసుకుంటున్నాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని వాక్యాన్ని మోసంతో కల్తీ చేయకుండా.” ఈ గ్రీకు క్రియ మోసపూరితంగా దేనినైనా కల్తీ చేయడం లేదా చెడగొట్టడం అనే భావాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సత్యం ప్రత్యక్షం కావడం ద్వారా.” ఇక్కడి గ్రీకు పదం కేవలం ప్రకటించడంకన్నా సత్యాన్ని స్పష్టంగా, బహిరంగంగా తెలియజేయడాన్ని నొక్కి చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: త్యజించాము
  rationale: నిర్ణయాత్మకంగా విడిచిపెట్టడం లేదా నిరాకరించడం అనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: సిగ్గుకరమైన రహస్య కార్యాలు
  rationale: మూలంలోని ‘సిగ్గు’ మరియు ‘దాచబడినవి’ అనే రెండు భావాలనూ నిలుపుతూ, సందర్భంలో ఉద్దేశించిన రహస్య ప్రవర్తనను తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: περιπατοῦντες ἐν πανουργίᾳ
  choice: కపటంతో నడుచుకోము
  rationale: περιπατέω యొక్క జీవనశైలి రూపకాన్ని ‘నడుచుకొను’తో నిలుపుతుంది; πανουργίαలోని నీతిలేని జిత్తులమారి స్వభావాన్ని ‘కపటం’ సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: δολοῦντες
  choice: మోసపూరితంగా వక్రీకరించము
  rationale: మోసంతో కల్తీ చేయడం లేదా మార్చడం అనే క్రియ యొక్క బలాన్ని గ్రాహ్యమైన తెలుగులో అందిస్తుంది; ‘కల్తీ చేయడం’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యం
  rationale: λόγοςను అనవసరంగా కేవలం ప్రసంగానికి పరిమితం చేయకుండా, స్థిరమైన మరియు విస్తృతమైన తెలుగు బైబిలు పదప్రయోగాన్ని ఉపయోగిస్తుంది.
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: సత్యాన్ని బహిర్గతం చేయడం ద్వారా
  rationale: φανέρωσιςలోని కనిపించేలా లేదా స్పష్టంగా చేయడం అనే భావాన్ని కేవలం మౌఖిక ప్రకటనగా కుదించకుండా వ్యక్తం చేస్తుంది.
- source_word: συνιστάνοντες ἑαυτούς
  choice: మమ్మల్ని మేము యోగ్యులుగా చూపిస్తున్నాము
  rationale: తమను తాము అనుకూలంగా సమర్పించుకోవడం లేదా సమర్థించుకోవడం అనే సందర్భార్థాన్ని సహజంగా అందిస్తుంది; అతిశయోక్తి భావాన్ని బలవంతంగా చేర్చదు.
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: ప్రతి మనిషి మనస్సాక్షికి
  rationale: πᾶσαν యొక్క విభజనాత్మక బలాన్ని, συνείδησις యొక్క నైతిక అవగాహన భావాన్ని నిలుపుతుంది.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: దేవుని ఎదుట
  rationale: దేవుడు సాక్షిగా ఉన్నాడనే మరియు ఆయన తీర్పుకు లోబడి ఉన్నారనే అంతర్భావాన్ని సూటిగా నిలుపుతుంది.
theological_decisions:
- issue: మోసపూరిత పరిచర్యకు, సత్యాన్ని వెల్లడించే పరిచర్యకు మధ్య పౌలు చూపిన వ్యత్యాసం
  choice: ఈ వాక్యాన్ని పరిచర్యలో నైతిక పారదర్శకతను, దేవుని సన్నిధిలో మనస్సాక్షికి చేసే విజ్ఞప్తిని తెలిపేదిగా అనువదించాం.
  alternative: దీనిని కేవలం వాక్చాతుర్యపు దుర్వినియోగంపై నిషేధంగా లేదా సమస్త లేఖన నిర్వహణపై సాంకేతిక సిద్ధాంత ప్రకటనగా చదవడం.
  rationale: తక్షణ సందర్భం అపొస్తల పరిచర్య ప్రవర్తన మరియు సందేశ ప్రకటన గురించి ఉంది. మూలం చెప్పిన పరిధిని మించకుండా అనువాదం ఆ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. పౌలు ఉపయోగించిన ‘నడుచుకొను’ జీవనరూపకాన్ని నిలిపి, క్లిష్టమైన గ్రీకు పదాలకు సహజమైన తెలుగు నిర్మాణాలను ఎంచుకున్నాం. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠ్యంలో ఉంది.
