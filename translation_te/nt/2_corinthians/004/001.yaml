  text: Διὰ τοῦτο, ἔχοντες τὴν διακονίαν ταύτην καθὼς ἠλεήθημεν, οὐκ ⸀ἐγκακοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: te
  text: కాబట్టి, మనకు కనికరం చూపబడినట్లే ఈ పరిచర్యను కలిగియున్న మనం నిరుత్సాహపడము.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: కాబట్టి
  rationale: మునుపటి వాదననుంచి వచ్చే నిర్ధారణను సహజంగా సూచిస్తుంది.
- source_word: τὴν διακονίαν ταύτην
  choice: ఈ పరిచర్యను
  rationale: διακονία ఇక్కడ దేవుడు అప్పగించిన సేవా బాధ్యతను సూచిస్తుంది; ‘పరిచర్య’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: καθὼς ἠλεήθημεν
  choice: మనం కనికరం పొందిన ప్రకారం
  rationale: καθώς లోని అనురూపత/ఆధార సంబంధాన్ని ‘ప్రకారం’ నిలుపుతుంది; దైవ కర్మను సూచించే పరోక్ష ప్రయోగాన్ని అలాగే ఉంచుతుంది.
- source_word: οὐκ ἐγκακοῦμεν
  choice: మనం నిరుత్సాహపడము
  rationale: ἐγκακέω ఇక్కడ కష్టాలవల్ల ధైర్యం కోల్పోయి వెనుకంజ వేయడాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజమైన సమానార్థక ప్రయోగం.
theological_decisions:
- issue: పరిచర్యకు ఆధారంగా కనికరం
  choice: ‘మనం కనికరం పొందిన ప్రకారం’ అని రెండింటి సంబంధాన్ని నిలుపడం
  alternative: ‘దేవుని కనికరం వల్ల’ అని కారణార్థాన్ని స్పష్టీకరించడం
  rationale: మూలంలోని καθώς స్పష్టంగా కేవలం కారణార్థాన్నే నిర్దేశించదు; అలాగే దేవుడు అనే కర్త మూలంలో ప్రత్యక్షంగా లేదు. అందువల్ల భావాన్ని అతిగా నిర్ధారించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పౌలు తన సహపరిచారకులను ఉద్దేశించి వాడిన బహువచనాన్ని ‘మనం’తో నిలుపబడింది.
