review_pass:
  verdict: revise
  source_fidelity: ‘హింసించబడుతున్నా’ accurately conveys διωκόμενοι in its hostile-oppression sense. ‘విడిచిపెట్టబడడం లేదు’ faithfully retains ἐγκαταλειπόμενοι without specifying the unstated agent. For καταβαλλόμενοι, ‘పడగొట్టబడుతున్నా’ is a more direct and natural rendering of being thrown/knocked down than the draft’s ‘కూలదోయబడుతున్నా.’ ‘నాశనం కావడం లేదు’ adequately conveys the contrast with ἀπολλύμενοι. The concessive-negative Telugu construction preserves the paired ἀλλ’ οὐκ contrasts naturally.
  naturalness: The verse is concise, balanced, and appropriate to modern standard Telugu. Replacing ‘కూలదోయబడుతున్నా’ with ‘పడగొట్టబడుతున్నా’ improves everyday clarity and maintains the concrete force of the image. The alternative ‘దెబ్బతిని కూలుతున్నా’ is less suitable because it shifts from the Greek passive action to an intransitive result.
  terminology: ‘హింసించబడుతున్నా,’ ‘విడిచిపెట్టబడడం లేదు,’ and ‘నాశనం కావడం లేదు’ are suitable, non-sectarian modern Telugu choices. No theological amplification is introduced. Footnote a preserves the viable alternative of hostile pursuit; footnote b now supplies direct lexical alternatives for καταβάλλω.
  issues:
  - severity: low
    issue: The main rendering ‘కూలదోయబడుతున్నా’ is less idiomatic and less directly equivalent than ‘పడగొట్టబడుతున్నా.’
    rationale: καταβαλλόμενοι denotes being cast or knocked down. ‘పడగొట్టబడుతున్నా’ expresses this action clearly in current standard Telugu.
  - severity: low
    issue: Footnote b’s alternative ‘దెబ్బతిని కూలుతున్నా’ changes the grammatical perspective.
    rationale: It describes someone falling after being struck rather than directly being thrown/knocked down, whereas the Greek is passive. A direct passive alternative better serves the lexical note.
  revised_text: హింసించబడుతున్నా[a], విడిచిపెట్టబడడం లేదు; పడగొట్టబడుతున్నా[b], నాశనం కావడం లేదు.
