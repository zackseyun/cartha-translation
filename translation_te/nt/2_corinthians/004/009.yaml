  text: persecuted[a], but not abandoned; struck down, but not destroyed[b],
translation:
  language: te
  text: హింసించబడుతున్నా[a], విడిచిపెట్టబడడం లేదు; పడగొట్టబడుతున్నా[b], నాశనం కావడం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వెంటాడబడుతున్నా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కూలదోయబడుతున్నా’ లేదా ‘కిందపడవేయబడుతున్నా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διωκόμενοι
  choice: హింసించబడుతున్నా
  rationale: ఇక్కడ క్రియ శత్రువుల చేత వెంటాడబడి పీడింపబడటాన్ని సూచిస్తుంది. ఆధునిక తెలుగు వాడుకలో ‘హింసించబడటం’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐγκαταλειπόμενοι
  choice: విడిచిపెట్టబడడం లేదు
  rationale: సహాయం లేకుండా ఒంటరిగా వదిలివేయబడటం అనే భావాన్ని ఇది స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καταβαλλόμενοι
  choice: కూలదోయబడుతున్నా
  rationale: కిందికి పడగొట్టడం లేదా దెబ్బతీసి కూల్చడం అనే రూపక బలాన్ని నిలుపుతుంది; కేవలం నిరుత్సాహపడటం అనే భావానికి పరిమితం కాదు.
- source_word: ἀπολλύμενοι
  choice: నాశనం కావడం లేదు
  rationale: కూలదోయబడటానికి విరుద్ధంగా, అంతిమంగా నశించిపోకపోవడాన్ని బలంగా తెలియజేస్తుంది.
- source_word: ἀλλ’ οὐκ
  choice: …ఉన్నా, …లేదు
  rationale: గ్రీకు పాఠంలోని ‘కాని కాదు’ అనే వ్యతిరేక సమాంతర నిర్మాణాన్ని సహజమైన తెలుగు concessive-negative జతగా అందిస్తుంది.
theological_decisions:
- issue: ἐγκαταλειπόμενοι అనే పదాన్ని దేవునిచేత ‘త్యజించబడటం’ అనే బలమైన ధార్మిక ప్రతిధ్వనితో అనువదించాలా, లేక సాధారణంగా ‘విడిచిపెట్టబడటం’గా అనువదించాలా
  choice: విడిచిపెట్టబడడం లేదు
  alternative: త్యజించబడడం లేదు
  rationale: మూలపాఠం ఎవరు విడిచిపెట్టడం లేదో ఇక్కడ ప్రత్యక్షంగా పేర్కొనదు. ‘విడిచిపెట్టబడడం లేదు’ అనే రూపం ఆ కర్తను చేర్చకుండా అర్థాన్ని నిలిపి, ప్రత్యేక అంతర్పాఠ్య లేదా సిద్ధాంతపరమైన భావాన్ని బలవంతంగా రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు వర్తమాన కర్మణి కృదంతాల కొనసాగుతున్న భావాన్ని ‘బడుతున్నా’ నిర్మాణంతో, రెండు సమాంతర వ్యతిరేక జతలను సమతుల్య లయతో నిలిపాం.
