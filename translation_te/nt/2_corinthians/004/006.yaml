  to: ఎందుకంటే, “చీకటిలోనుండి వెలుగు ప్రకాశిస్తుంది”[c] అని చెప్పిన దేవుడే, మెస్సీయ[b] ముఖంలో ఉన్న దేవుని మహిమను గురించిన జ్ఞానానికి వెలుగునివ్వడానికి మా హృదయాల్లో ప్రకాశించాడు.[a]
