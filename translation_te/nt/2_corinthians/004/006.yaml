id: 2CO.4.6
reference: 2 Corinthians 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: te
  text: ఎందుకంటే, “చీకటిలోనుండి వెలుగు ప్రకాశిస్తుంది”[c] అని చెప్పిన దేవుడే, మెస్సీయ[b] ముఖంలో ఉన్న దేవుని మహిమను గురించిన జ్ఞానానికి వెలుగునివ్వడానికి మా హృదయాల్లో ప్రకాశించాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “మెస్సీయ ముఖంలో” అనే గ్రీకు పదబంధాన్ని “క్రీస్తు వ్యక్తిత్వంలో” అని కూడా అర్థం చేసుకోవచ్చు. అయితే “ముఖం” అనే అనువాదం ఇక్కడ వెలుగు, మహిమల దృశ్యప్రతిమను నిలుపుతుంది.
    reason: alternative_reading
  - marker: b
    text: గ్రీకు Χριστοῦ (క్రిస్టూ), సంప్రదాయంగా “క్రీస్తు”; ఇది “అభిషిక్తుడు” అనే అర్థమున్న బిరుదు కాబట్టి ఇక్కడ “మెస్సీయ” అని అనువదించబడింది.
    reason: lexical_alternative
  - marker: c
    text: ఈ మాట ఆదికాండం 1:3ను ప్రతిధ్వనింపజేస్తూ, సృష్టిలోని వెలుగు ప్రతిమను విశ్వాసులలో దేవుడు తనను వెల్లడించే కార్యానికి అన్వయిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఈ వాక్యం ముందున్న ప్రకటనకు కారణాన్ని ఇస్తోంది; అందువల్ల కారణార్థక అనుసంధానాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ θεὸς ὁ εἰπών
  choice: అని చెప్పిన దేవుడే
  rationale: గ్రీకు నిశ్చయార్థక కృదంతాన్ని తెలుగులో సహజమైన సంబంధవాచక నిర్మాణంగా మార్చి, అదే దేవుడు హృదయాల్లో ప్రకాశించాడనే వాక్యబలాన్ని ‘దేవుడే’ నిలుపుతుంది.
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: చీకటిలోనుండి వెలుగు ప్రకాశిస్తుంది
  rationale: ἐκ యొక్క ‘లోనుండి’ భావాన్నీ, భవిష్యదర్థాన్నివ్వగల తెలుగు వర్తమాన-భవిష్య రూపాన్నీ, సృష్టి-వెలుగు ప్రతిమనూ నిలుపుతుంది.
- source_word: ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν
  choice: మా హృదయాల్లో ప్రకాశించాడు
  rationale: ἔλαμψεν ను అకర్మకంగానే ఉంచి, καρδίαις లోని అంతరంగానికి సంబంధించిన బైబిలు రూపకాన్ని ‘హృదయాలు’గా నిలుపుతుంది.
- source_word: πρὸς φωτισμὸν τῆς γνώσεως
  choice: జ్ఞానపు వెలుగు కలిగించడానికి
  rationale: నామవాచక శ్రేణిని తెలుగులో అర్థమయ్యే ప్రయోజనార్థక నిర్మాణంగా వ్యక్తం చేస్తూనే φωτισμός లోని వెలుగు/ప్రకాశన భావాన్ని కాపాడుతుంది.
- source_word: τῆς δόξης τοῦ θεοῦ
  choice: దేవుని మహిమను గురించిన
  rationale: γνῶσις తో ఉన్న సంబంధాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తూ ‘దేవుని మహిమ’ అనే మూల భావాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: మెస్సీయ ముఖంలో కనిపించే
  rationale: πρόσωπον యొక్క మౌలికమైన ‘ముఖం’ ప్రతిమను నిలుపుతుంది; తెలుగులో దాని సంబంధాన్ని సహజంగా తెలియజేయడానికి ‘కనిపించే’ చేర్చబడింది. Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ వాడబడింది.
theological_decisions:
- issue: Χριστοῦ ను ఎలా అనువదించాలి
  choice: మెస్సీయ
  alternative: క్రీస్తు; అభిషిక్తుడు
  rationale: ఈ సందర్భంలో పదం వ్యక్తిపేరుకన్నా బిరుదుగా పనిచేస్తోంది. ‘మెస్సీయ’ ఆ బిరుదు స్వభావాన్ని నిలుపుతుంది; పాదసూచిక సంప్రదాయ రూపాన్ని తెలియజేస్తుంది.
- issue: ἐν προσώπῳ Χριστοῦ భావం
  choice: మెస్సీయ ముఖంలో
  alternative: క్రీస్తు వ్యక్తిత్వంలో; మెస్సీయ సన్నిధిలో
  rationale: వెలుగు, ప్రకాశం, మహిమ అనే సమీప సందర్భంలో ‘ముఖం’ అనే స్పష్టమైన దృశ్యప్రతిమను నిలుపడం సముచితం; అయినా πρόσωπον వ్యక్తిని లేదా సన్నిధిని సూచించే విస్తృత భావాన్ని కూడా కలిగి ఉండగలదని పాదసూచికలో తెలియజేయబడింది.
- issue: దేవుని ప్రకాశం మరియు జ్ఞానపు వెలుగు మధ్య సంబంధం
  choice: దేవుడు హృదయాల్లో ప్రకాశించి జ్ఞానపు వెలుగు కలిగించాడు
  alternative: దేవుడు హృదయాలను వెలిగించాడు
  rationale: ἔλαμψεν అకర్మక రూపాన్ని మార్చకుండా, πρὸς φωτισμόν తెలిపే ఉద్దేశం/ఫలితాన్ని వేరుగా ఉంచుతుంది; దేవుడు నేరుగా హృదయాలను ప్రకాశింపజేశాడని మూలంలో లేని కర్మక భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం వాడబడింది. ‘జ్ఞానపు వెలుగు’ పౌలు వాడిన వెలుగు-ప్రకాశన ప్రతిమను నిలుపుతుంది; ‘ముఖం’ అనే స్పష్టమైన పదాన్ని ప్రధాన పాఠ్యంలో ఉంచి దాని విస్తృత భావాన్ని పాదసూచికలో ఇచ్చాం.
