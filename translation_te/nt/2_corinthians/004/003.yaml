  terminology: ‘సువార్త’ ప్రామాణికమైన పదం. ‘నశించిపోతున్నవారు’ వర్తమాన కృదంతంలోని కొనసాగుతున్న ప్రక్రియను సముచితంగా తెలియజేస్తుంది. పాదటిప్పణిలో ‘నశించినవారు’ అనేది వర్తమాన కృదంతం కంటే పూర్తయిన స్థితిని సూచిస్తుంది; దాని స్థానంలో ఆంగ్ల audit trailలోని ‘lost’కు సరితూగే ‘తప్పిపోయినవారు’ను ప్రత్యామ్నాయంగా ఇవ్వవచ్చు, అయితే ప్రధాన పాఠం ప్రక్రియాత్మక పదాన్నే ఉంచుతుంది.
