  source_fidelity: 'ప్రధాన భావం మూలానికి సన్నిహితంగా ఉంది: షరతుతో కూడిన అంగీకారం, ‘మా సువార్త,’ మరియు ἀπολλυμένοιςలోని కొనసాగుతున్న ‘నశించిపోతున్న’ భావం నిలిచాయి. అయితే ‘మరుగుచేయబడి’ కన్నా καλύπτωకు సహజమైన కర్మణి రూపమైన ‘కప్పబడి’ సరిపోతుంది. ‘మధ్యనే’లోని ‘నే’ మూలంలో లేని ప్రత్యేక పరిమితిని సూచించవచ్చు; దాన్ని తొలగించాలి.'
