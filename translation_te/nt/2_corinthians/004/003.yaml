source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ἔστιν κεκαλυμμένον τὸ εὐαγγέλιον ἡμῶν, ἐν τοῖς ἀπολλυμένοις ἐστὶν κεκαλυμμένον,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/003.yaml
  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: te
  text: అయితే మా సువార్త కప్పబడి ఉన్నప్పటికీ, అది నశించిపోతున్నవారి మధ్య కప్పబడి ఉంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నశించిపోతున్నవారికి”; లేదా, “తప్పిపోయినవారి మధ్య.”
    reason: ἐν ఇక్కడ సమూహం/పరిధి భావంతో ‘మధ్య’గా, లేదా సంబంధ భావంతో ‘వారికి’గా అర్థమవవచ్చు. ἀπολλυμένοιςలోని వర్తమాన కృదంత భావాన్ని ప్రధాన పాఠం ‘నశించిపోతున్నవారు’గా నిలుపుతుంది; ‘తప్పిపోయినవారు’ సందర్భానుసారమైన ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: ఒకవేళ ... ఉంటే కూడా
  rationale: షరతుతో కూడిన అంగీకార భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; δέ యొక్క సందర్భానుసార కొనసాగింపు/వ్యతిరేక ఛాయను వాక్య నిర్మాణంలో ఉంచుతుంది, καί యొక్క ‘కూడా’ బలాన్ని నిలుపుతుంది.
- source_word: κεκαλυμμένον
  choice: మరుగుచేయబడి
  rationale: καλύπτω యొక్క సంపూర్ణ కర్మణి రూపాన్ని ప్రతిబింబిస్తూ, 3:14–16లోని ముసుగు రూపకంతో సంబంధాన్ని నిలుపుతుంది. ‘దాచబడి’ కంటే ఇది ఉద్దేశపూర్వకంగా దాచడం అనే భావాన్ని కొంత తగ్గించి, కప్పబడి కనిపించకపోవడాన్ని సూచిస్తుంది.
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: మా సువార్త
  rationale: ἡμῶν అనే స్వామ్యార్థాన్ని నేరుగా నిలుపుతూ, εὐαγγέλιονకు ప్రామాణికమైన మరియు సంక్షిప్తమైన తెలుగు పదాన్ని ఉపయోగిస్తుంది.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: నశించిపోతున్నవారి మధ్యనే
  rationale: ἐν యొక్క పరిధి/సమూహ భావాన్ని ‘మధ్య’తో వ్యక్తపరుస్తుంది. వర్తమాన కృదంతమైన ἀπολλυμένοιςలోని కొనసాగుతున్న స్థితి లేదా ప్రక్రియను ‘నశించిపోతున్నవారు’ నిలుపుతుంది; ‘నే’ గ్రీకులో పునరుక్తమైన నిర్దిష్ట పరిమితిని సహజ తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ἐστὶν κεκαλυμμένον
  choice: అది మరుగుచేయబడి ఉంది
  rationale: గ్రీకులోని పునరుక్త విధేయాన్ని తెలుగు వాక్యంలోనూ నిలుపుతుంది. ‘అది’ అనేది ‘మా సువార్త’ను స్పష్టంగా సూచిస్తుంది; ‘అలాగే ఉండిపోతుంది’ వంటి అదనపు కాలవ్యాప్త వ్యాఖ్యానాన్ని చేర్చదు.
theological_decisions:
- issue: పౌలు రక్షణశాస్త్ర సందర్భంలో ἀπολλυμένοις స్వభావం
  choice: నశించిపోతున్నవారు
  alternative: నశించినవారు / తప్పిపోయినవారు
  rationale: వర్తమాన కృదంతం కొనసాగుతున్న స్థితి లేదా ప్రక్రియను సూచిస్తుంది. ‘నశించిపోతున్నవారు’ ఆ ఉద్విగ్నతను నిలుపుతుంది; స్థిరమైన తుది వర్గంగా ముందుగానే నిర్వచించదు.
- issue: ἐν τοῖς ἀπολλυμένοιςలో ἐν యొక్క సంబంధం
  choice: నశించిపోతున్నవారి మధ్య
  alternative: నశించిపోతున్నవారికి / నశించిపోతున్నవారి విషయంలో
  rationale: ἐνను సమూహం లేదా పరిధిగా తీసుకోవడం మూలపాఠానికి అత్యంత సన్నిహితం. అయితే సందర్భంలో ‘వారికి’ అనే సంబంధార్థం సాధ్యమే కనుక దాన్ని పాదటిప్పణిలో ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మరుగుచేయబడి’ అనే రూపం సమీప సందర్భంలోని ముసుగు/కప్పుదల రూపకాన్ని నిలుపుతుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
