id: 2CO.6.10
reference: 2 Corinthians 6:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς λυπούμενοι ἀεὶ δὲ χαίροντες, ὡς πτωχοὶ πολλοὺς δὲ πλουτίζοντες, ὡς μηδὲν ἔχοντες καὶ πάντα κατέχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/010.yaml
  text: as sorrowful[a], yet always rejoicing; as poor, yet making many rich; as having nothing[b], and yet possessing everything.
translation:
  language: te
  text: దుఃఖిస్తున్నవారిలా ఉన్నా[a], ఎల్లప్పుడూ ఆనందించేవారము; పేదవారిలా ఉన్నా, అనేకులను ధనవంతులను చేసేవారము; ఏమీ లేనివారిలా ఉన్నా, సమస్తమూ కలిగినవారము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దుఃఖించేవారిలా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: …వారిలా ఉన్నా
  rationale: పౌలు వరుసగా ఉపయోగించిన తులనాత్మక రూపాన్ని, దానికి వెంటనే వచ్చే విరుద్ధ వాస్తవంతో సహా, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: λυπούμενοι
  choice: దుఃఖపడుతున్నవారు
  rationale: దుఃఖ స్థితిని సహజంగా తెలియజేస్తుంది; దానికి కారణమైన కర్తను అనవసరంగా నిర్దేశించదు.
- source_word: ἀεὶ δὲ χαίροντες
  choice: ఎల్లప్పుడూ ఆనందించేవారు
  rationale: నిరంతర కాలభావాన్నీ, దుఃఖంతో ఉన్న విరుద్ధతనూ కాపాడుతుంది.
- source_word: πτωχοὶ
  choice: పేదవారు
  rationale: ఆర్థిక కొరతకూ అపొస్తలుల దీనస్థితికీ అవకాశం ఉంచే సూటి సమానార్థకం.
- source_word: πολλοὺς δὲ πλουτίζοντες
  choice: అనేకులను ధనవంతులను చేసేవారు
  rationale: πλουτίζω యొక్క ‘ధనవంతునిగా చేయు’ అనే క్రియార్థాన్ని స్పష్టంగా ఉంచుతూ, సంపద స్వభావాన్ని ప్రధాన వాక్యంలో నిర్దేశించదు.
- source_word: μηδὲν ἔχοντες
  choice: ఏమీ లేనివారు
  rationale: బాహ్యంగా ఏ ఆస్తీ లేని స్థితిని సూచించే సహజమైన తెలుగు రూపం.
- source_word: πάντα κατέχοντες
  choice: సమస్తమూ కలిగినవారు
  rationale: κατέχωలోని నిజమైన స్వాధీనత భావాన్ని తెలియజేస్తూ, ముందున్న ‘ఏమీ లేని’ అనే విరోధాభాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ధనవంతులను చేయడం, సమస్తమూ కలిగి ఉండడం అనే మాటల స్వభావం
  choice: ప్రధాన వాక్యంలో ‘ఆధ్యాత్మికంగా’ వంటి వివరణాత్మక విశేషణం చేర్చకుండా సూటిగా అనువదించడం.
  alternative: క్రీస్తులోని ఆధ్యాత్మిక సంపద అని ప్రధాన వాక్యంలోనే స్పష్టీకరించడం.
  rationale: సందర్భం ఆధ్యాత్మిక సమృద్ధిని బలంగా సూచించినా, గ్రీకు మూలం దానిని ప్రత్యేక విశేషణంతో పరిమితం చేయదు. అందువల్ల పౌలు ఉద్దేశించిన విరోధాభాసాన్నీ theological tensionనూ యథాతథంగా ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే పదజాలం. మూడు సమాంతర విరోధాభాసాల లయను నిలుపుతూ, చివర చేర్చిన ‘ఉన్నాము’ ద్వారా తెలుగులో వాక్యాన్ని సంపూర్ణం చేశాం. ప్రతి పాదంలో ‘…వారిలా ఉన్నా …వారిగా’ అనే నిర్మాణం ὡς మరియు δέ భావాలను సహజంగా ప్రతిబింబిస్తుంది.
