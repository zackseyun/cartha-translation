translation:
  language: te
  text: ఘనతలోనూ అవమానంలోనూ[a], అపనిందలోనూ ప్రశంసలోనూ[b]; మోసగాళ్లుగా పరిగణించబడినా, సత్యవంతులుగా[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మహిమలోనూ అవమానంలోనూ.’ ఇక్కడ గ్రీకు పదం ‘మహిమ’ అని కూడా అర్థమివ్వగలదు; ఈ సందర్భంలో ప్రజల మధ్య లభించే ఘనత అనే భావం ఎక్కువగా సరిపోతుంది.
