id: 2CO.6.15
reference: 2 Corinthians 6:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: te
  text: మెస్సీయకూ బెలియార్‌కూ మధ్య ఎలాంటి సామరస్యం ఉంది? విశ్వాసికి అవిశ్వాసితో ఏ ఉమ్మడి వాటా ఉంది?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'బెలియార్: గ్రీకు Βελιάρ; ఈ పేరుకు ‘బెలియాల్’ అనే ప్రత్యామ్నాయ రూపం కూడా వాడుకలో ఉంది.'
    reason: alternative_reading
lexical_decisions:
- source_word: συμφώνησις
  choice: సామరస్యం
  rationale: ఈ నామవాచకం ఏకీభావం, పొందిక లేదా పరస్పర అనుకూలతను సూచిస్తుంది. అలంకారిక ప్రశ్నలోని సంబంధపరమైన వ్యతిరేకతను ‘సామరస్యం’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయకు
  rationale: ఇక్కడ Χριστός వ్యక్తిగత పేరులా కాక బిరుదుగా, బెలియార్‌కు విరుద్ధంగా ఉపయోగించబడింది; అందువల్ల ‘మెస్సీయ’ అని అనువదించాం.
- source_word: Βελιάρ
  choice: బెలియార్
  rationale: ఇది పేరుగా ఉంది. మూల గ్రీకు రూపం Βελιάρను నేరుగా లిప్యంతరీకరించాం; పరిచితమైన ప్రత్యామ్నాయ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: μερίς
  choice: భాగం
  rationale: ఈ పదం ఒకరితో మరొకరు పంచుకునే వాటా, భాగం లేదా ఉమ్మడి పాలును సూచిస్తుంది. తెలుగులో ‘ఏ భాగం ఉంది?’ అనే ప్రయోగం సంక్షిప్తంగా ఈ భావాన్ని నిలుపుతుంది.
- source_word: πιστῷ
  choice: విశ్వాసికి
  rationale: విశేషణం ఇక్కడ వ్యక్తిని సూచించే నామవాచకార్థంలో ఉంది; ‘విశ్వాసి’ సహజమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: ἀπίστου
  choice: అవిశ్వాసితో
  rationale: πιστῷకు వ్యతిరేకంగా ఇది నమ్మని వ్యక్తిని సూచిస్తుంది. ‘అవిశ్వాసి’ ఈ వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: πρὸς
  choice: కు ... కు మధ్య
  rationale: συμφώνησιςతో కూడిన ఈ నిర్మాణం రెండు పక్షాల మధ్య సంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘Xకు Yకు మధ్య’ సహజంగా ఉంటుంది.
- source_word: μετὰ
  choice: తో
  rationale: ఈ విభక్తి సహవాసం లేదా సంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘తో’ సంక్షిప్తమైన సహజ సమానం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ వరుస అలంకారిక ప్రశ్నను కొనసాగిస్తుంది. తెలుగులో ప్రారంభ సంధిపదం లేకుండానే కొనసాగింపు సహజంగా స్పష్టమవుతుంది; ‘అయితే’ అనడం అనవసరమైన వ్యతిరేక బలాన్ని చేర్చవచ్చు.
theological_decisions:
- issue: Χριστός పదం అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: బెలియార్‌తో భావపరమైన వ్యతిరేక జతలో Χριστός బిరుదుగా పనిచేస్తోంది. అందువల్ల బిరుదు భావాన్ని స్పష్టంగా ఉంచేందుకు ‘మెస్సీయ’ ఎంచుకున్నాం.
- issue: Βελιάρ గుర్తింపు
  choice: బెలియార్ అనే పేరును వివరణ జోడించకుండా ఉంచడం
  alternative: బెలియాల్
  rationale: మూలపాఠంలోని పేరును లిప్యంతరీకరించడం ద్వారా దాని గుర్తింపుపై అదనపు వ్యాఖ్యానాన్ని ప్రధాన వాక్యంలోకి దిగుమతి చేయలేదు. మరో ప్రసిద్ధ రూపాన్ని పాదసూచికలో ఉంచాం.
- issue: μερίς యొక్క సంబంధార్థం
  choice: భాగం
  alternative: పాలు; ఉమ్మడి వాటా
  rationale: పదం ఉమ్మడి భాగస్వామ్యాన్ని సూచించగలదు; అయితే మూలంలోని సంక్షిప్తతను, అలంకారిక ఉద్వేగాన్ని కాపాడేందుకు ‘భాగం’ వాడాం, దానిని నిర్దిష్ట సిద్ధాంతపరమైన సహవాసంగా పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే అలంకారిక ప్రశ్నలుగా మలిచాం. మూలంలోని రెండు సమాంతర ప్రశ్నలను, ‘విశ్వాసి/అవిశ్వాసి’ వ్యతిరేకతను నిలిపాం.
