id: 2CO.6.14
reference: 2 Corinthians 6:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: te
  text: అవిశ్వాసులతో పొంతనలేని కాడిలో జతకట్టవద్దు.[b] నీతికి[a] ధర్మరాహిత్యంతో ఎలాంటి భాగస్వామ్యం ఉంది? వెలుగుకు చీకటితో ఎలాంటి సహవాసం ఉంది?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీతి’ (δικαιοσύνῃ) అనే పదాన్ని ‘న్యాయం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘పొంతనలేని కాడిలో జతకట్టడం’ అనే మాట, వేర్వేరు రకాల జంతువులను ఒకే కాడితో కట్టే దృశ్యాన్ని సూచిస్తుంది; ద్వితీయోపదేశకాండము 22:10 చూడండి.
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: జతకట్టకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞ నిషేధాన్ని తెలియజేస్తుంది. తెలుగులో ఈ రూపం సహజంగా ఉండి, తరువాతి కాడి రూపకంతో కలిసి ‘అలా మారవద్దు/అలా సంబంధంలోకి రావద్దు’ అనే భావాన్ని అందిస్తుంది.
- source_word: ἑτεροζυγοῦντες
  choice: సరిపోని కాడి కింద
  rationale: వేర్వేరు రకాల లేదా పొంతనలేని జంతువులను ఒకే కాడికి కట్టే దృశ్యాన్ని స్పష్టంగా, ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀπίστοις
  choice: అవిశ్వాసులతో
  rationale: ఇక్కడ విశ్వసించని వారిని సూచిస్తుంది; కాడిలో మరొకరితో జతకట్టే సంబంధాన్ని ‘తో’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μετοχὴ
  choice: భాగస్వామ్యం
  rationale: కలిసి పాలుపంచుకోవడం లేదా ఉమ్మడి భాగం కలిగి ఉండడం అనే భావాన్ని వ్యక్తం చేస్తూ, తరువాతి ‘సహవాసం’తో సమాంతరతను నిలుపుతుంది.
- source_word: δικαιοσύνῃ
  choice: నీతి
  rationale: ఈ సందర్భంలో ἀνομίαతో ఉన్న నైతిక వ్యతిరేకతకు ‘నీతి’ సహజంగా సరిపోతుంది; ‘న్యాయం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀνομίᾳ
  choice: అక్రమం
  rationale: చట్టం లేదా ధర్మానికి విరుద్ధంగా ఉండే స్థితిని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘నీతి’కి ఎదురైన నైతిక వ్యతిరేకతను కాపాడుతుంది.
- source_word: κοινωνία
  choice: సహవాసం
  rationale: దగ్గరి అనుబంధం, ఉమ్మడి పాలుపంచుకోవడం అనే భావాన్ని ఇక్కడ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: φωτὶ
  choice: వెలుగు
  rationale: పౌలు ఉపయోగించిన రూపకాలంకార వ్యతిరేకతను నేరుగా నిలుపుతుంది.
- source_word: πρὸς σκότος
  choice: చీకటితో
  rationale: πρός ఇక్కడ సంబంధం లేదా అనుబంధాన్ని సూచిస్తుంది; ప్రశ్నలో ‘తో’ సహజమైన తెలుగు ప్రయోగం.
theological_decisions:
- issue: పౌలు వాడిన δικαιοσύνη పదాన్ని ఈ వ్యతిరేకతలో అనువదించడం
  choice: నీతి
  alternative: న్యాయం
  rationale: ἀνομίαతో ఉన్న నైతిక-ఆధ్యాత్మిక వ్యతిరేకతలో ‘నీతి’ ప్రధాన పాఠానికి తగినది. అయితే δικαιοσύνηకి ‘న్యాయం’ అనే అర్థపరిధి కూడా ఉన్నందున దాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. కాడి రూపకాన్ని వివరణగా మార్చకుండా ప్రధాన పాఠంలోనే నిలిపి, దాని నేపథ్యాన్ని పాదసూచికలో తెలిపాం.
