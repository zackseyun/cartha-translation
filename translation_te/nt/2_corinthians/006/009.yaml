translation:
  language: te
  text: తెలియనివారిగా, అయినా గుర్తించబడుతున్నవారిగా[a]; చనిపోతున్నవారిగా, ఇదిగో, మనం జీవిస్తున్నాం; క్రమశిక్షణకు గురవుతున్నవారిగా, అయినా చంపబడనివారిగా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పూర్తిగా తెలిసినవారిగా” లేదా “గుర్తించబడినవారిగా.” గ్రీకు పదం కేవలం ప్రసిద్ధులుగా ఉండటాన్ని కాక, మరింత పూర్తిగా గుర్తించబడటం లేదా తెలిసికొనబడటం అనే భావాన్ని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దిద్దుబాటు పొందుతున్నవారిగా,” “శిక్షించబడుతున్నవారిగా,” లేదా “రూపుదిద్దే శిక్షణ పొందుతున్నవారిగా.” గ్రీకు పదం సరిదిద్దే క్రమశిక్షణను లేదా రూపుదిద్దే శిక్షణను సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: …వారిగా ఉన్నా
  rationale: ప్రతి విరుద్ధ జంటను పరిచయం చేసే ὡς యొక్క పునరావృత అలంకార నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀγνοούμενοι
  choice: ఎవరికీ తెలియనివారు
  rationale: ఇతరులకు తెలియనివారు లేదా గుర్తింపులేనివారు అనే కర్మణి భావాన్ని సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἐπιγινωσκόμενοι
  choice: గుర్తించబడుతున్నవారు
  rationale: కేవలం ప్రసిద్ధులు అనే అర్థాన్ని రుద్దకుండా, తెలిసికొనబడటం లేదా అంగీకరించబడటం అనే భావాన్ని నిలుపుతుంది.
- source_word: ἀποθνῄσκοντες
  choice: చనిపోతున్నవారు
  rationale: కొనసాగుతున్న మరణస్థితి లేదా మరణం అంచున ఉన్న రూపాన్ని సూచించే వర్తమాన అసమాపక క్రియ భావాన్ని కాపాడుతుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: ఆకస్మికంగా దృష్టిని ఆకర్షించే గ్రీకు నిపాత బలాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో అందిస్తుంది.
- source_word: ζῶμεν
  choice: మనం బ్రతికే ఉన్నాం
  rationale: జీవిస్తున్నాం అనే వర్తమాన భావాన్ని, చనిపోతున్నాం అన్నదానికి ఎదురుగా, ఉద్ఘాటనతో వ్యక్తం చేస్తుంది.
- source_word: παιδευόμενοι
  choice: శిక్షణ పొందుతున్నవారు
  rationale: దిద్దుబాటు క్రమశిక్షణ మరియు రూపుదిద్దే శిక్షణ అనే రెండు సాధ్య భావాలకు చోటు ఇస్తూ, శిక్షించబడుతున్నారనే భావాన్ని అనవసరంగా ఖరారు చేయదు.
- source_word: μὴ θανατούμενοι
  choice: మరణశిక్షకు గురికానివారు
  rationale: చంపబడకపోవడం అనే కర్మణి భావాన్ని నిలుపుతూ, ముందు వచ్చిన చనిపోతున్నవారు అనే పదబంధంతో పదార్థ గందరగోళాన్ని తగ్గిస్తుంది.
theological_decisions:
- issue: బాధల సందర్భంలో παιδευόμενοι యొక్క భావం
  choice: శిక్షణ పొందుతున్నవారిగా
  alternative: శిక్షించబడుతున్నవారిగా / దిద్దుబాటు పొందుతున్నవారిగా
  rationale: ఈ పదం రూపుదిద్దే శిక్షణనూ దిద్దుబాటు క్రమశిక్షణనూ సూచించగలదు. ప్రధాన పాఠం దేవుని శిక్ష అనే నిర్దిష్ట వ్యాఖ్యానాన్ని ఖరారు చేయకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; పౌలు ఉపయోగించిన మూడు విరుద్ధ జంటల సమాంతర నిర్మాణం, సంక్షిప్తత, గంభీరత నిలుపబడ్డాయి. ‘ఇదిగో’ ద్వారా ἰδοὺ యొక్క దృష్టి ఆకర్షించే బలం ఉంచబడింది.
