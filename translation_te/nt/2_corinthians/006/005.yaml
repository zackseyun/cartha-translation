id: 2CO.6.5
reference: 2 Corinthians 6:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν πληγαῖς, ἐν φυλακαῖς, ἐν ἀκαταστασίαις, ἐν κόποις, ἐν ἀγρυπνίαις, ἐν νηστείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/005.yaml
  text: in beatings, in imprisonments, in riots, in labors, in sleepless nights, in fastings,
translation:
  language: te
  text: దెబ్బల్లో, చెరసాలల్లో, కల్లోలాల్లో, శ్రమల్లో, నిద్రలేని రాత్రుల్లో, ఉపవాసాల్లో,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: దెబ్బలు తినడంలో
  rationale: శారీరకంగా కొట్టబడటాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: φυλακαῖς
  choice: చెరసాలల్లో ఉండడంలో
  rationale: బహువచన భావాన్ని నిలుపుతూ, కారాగారవాస అనుభవాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀκαταστασίαις
  choice: అల్లర్లలో
  rationale: ఈ సందర్భంలో ప్రజా కల్లోలాలు లేదా riots అనే భావానికి సరిపోతుంది; పదంలోని విస్తృతమైన అవ్యవస్థ భావాన్ని సందర్భానుసారంగా సంక్షిప్తంగా అందిస్తుంది.
- source_word: κόποις
  choice: కష్టపడడంలో
  rationale: అలసట కలిగించే శ్రమ అనే మూలభావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: ἀγρυπνίαις
  choice: నిద్రలేని రాత్రుల్లో
  rationale: మేల్కొని ఉండాల్సిన రాత్రులు, నిద్రలేమి అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: νηστείαις
  choice: ఉపవాసాల్లో
  rationale: νηστείαις అనే పదానికి నేరుగా సరిపోయే అనువాదం; ఉద్దేశపూర్వక ఉపవాసమా లేక ఆహారలేమా అనే సాధ్యమైన సందర్భభేదాన్ని బలవంతంగా పరిష్కరించదు.
theological_decisions:
- issue: νηστείαις ఉద్దేశపూర్వక మతపరమైన ఉపవాసాలను మాత్రమే సూచిస్తుందా?
  choice: ఉపవాసాల్లో
  alternative: ఆహారం లేకపోవడంలో
  rationale: మూలపదం సాధారణంగా ఉపవాసాన్ని సూచిస్తుంది. సందర్భం కష్టాల జాబితా అయినప్పటికీ, దానిని కేవలం బలవంతపు ఆకలిగా మార్చడం మూలంలోని సాధ్యమైన ఉద్దేశపూర్వక ఉపవాస భావాన్ని తొలగిస్తుంది.
- issue: ἀκαταστασίαις వ్యక్తిగత అస్థిరతనా లేక సామూహిక అల్లర్లనా?
  choice: అల్లర్లలో
  alternative: కల్లోలాల్లో / అవ్యవస్థల్లో
  rationale: పౌలు సేవలో ఎదురైన బాహ్య కష్టాల జాబితాలో సామూహిక అల్లర్లు సందర్భానికి అనుకూలం; అయినా మూలపదానికి విస్తృతమైన కల్లోలం లేదా అవ్యవస్థ భావం కూడా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, వరుసగా వచ్చే ἐν పదబంధాల లయను ‘-లో/‑డంలో’ నిర్మాణాలతో నిలిపాం. వాక్యం తదుపరి వచనంతో కొనసాగుతుందనే కారణంగా చివర కామాను ఉంచాం.
