revisions:
- from: కాబట్టి, వారి మధ్యనుండి బయటికి రండి; వేరుగా ఉండండి[a] అని ప్రభువు చెబుతున్నాడు. అపవిత్రమైనదాన్ని ముట్టుకోవద్దు[b][c]; అప్పుడు నేను మిమ్మల్ని స్వీకరిస్తాను.
  to: కాబట్టి, “వారి మధ్య నుండి బయటికి రండి, వేరుగా ఉండండి[a] అని ప్రభువు చెబుతున్నాడు; అపవిత్రమైన దానిని ముట్టుకోవద్దు[b][c]; మరియు నేను మిమ్మల్ని స్వీకరిస్తాను.”
