reference: 2 Corinthians 6:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ ἐξέλθατε ἐκ μέσου αὐτῶν, καὶ ἀφορίσθητε, λέγει κύριος, καὶ ἀκαθάρτου μὴ ἅπτεσθε· κἀγὼ εἰσδέξομαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: te
  text: కాబట్టి, “వారి మధ్య నుండి బయటికి రండి, వేరుగా ఉండండి[a] అని ప్రభువు చెబుతున్నాడు; అపవిత్రమైన దానిని ముట్టుకోవద్దు[b][c]; మరియు నేను మిమ్మల్ని స్వీకరిస్తాను.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రత్యేకపరచబడండి’ లేదా ‘మిమ్మల్ని మీరు వేరుచేసుకోండి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అపవిత్రమైన దేనినీ ముట్టుకోవద్దు.’
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ పౌలు పాత నిబంధన ప్రవచన భాషను, ముఖ్యంగా యెషయా 52:11ను ప్రతిధ్వనిస్తున్నాడు.
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: కాబట్టి
  rationale: ముందున్న వాదన నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: ἐξέλθατε
  choice: బయటికి రండి
  rationale: బహువచన ఆజ్ఞలోని నిర్ణయాత్మక పిలుపును నిలుపుతూ, ఉల్లేఖన స్వరానికి తగిన సహజమైన పదబంధం.
- source_word: ἐκ μέσου αὐτῶν
  choice: వారి మధ్యనుండి
  rationale: స్థలపరమైన లేదా సహవాసపరమైన వేరుపాటు అనే రెండు భావసాధ్యతలను నిలుపుతుంది.
- source_word: ἀφορίσθητε
  choice: వేరుగా ఉండండి
  rationale: గ్రీకు నిష్క్రియ ఆజ్ఞ సూచించే వేరైన స్థితిని సహజంగా తెలియజేస్తుంది; దానిని తప్పనిసరిగా ఆత్మవాచక క్రియగా మార్చదు.
- source_word: λέγει κύριος
  choice: అని ప్రభువు చెబుతున్నాడు
  rationale: ప్రవచన ఉల్లేఖన సూత్రాన్ని తెలుగులో సహజమైన క్రమంలో అందిస్తుంది.
- source_word: ἀκαθάρτου
  choice: అపవిత్రమైనదాన్ని
  rationale: నిర్దిష్ట వస్తువును బలవంతంగా నిర్ణయించకుండా, అపవిత్రమైన దేనినైనా సూచించగల గ్రీకు నపుంసక విశేషణ నామార్థాన్ని నిలుపుతుంది.
- source_word: μὴ ἅπτεσθε
  choice: ముట్టుకోవద్దు
  rationale: శుద్ధి మరియు వేరుపాటు నేపథ్యంలోని స్పర్శ చిత్రణను నేరుగా కాపాడుతుంది.
- source_word: κἀγὼ
  choice: అప్పుడు నేను
  rationale: తెలుగులో వాక్యసంబంధాన్ని సహజంగా వ్యక్తం చేస్తూ, ప్రభువు స్పందనగా వచ్చే ‘నేను’ను నిలుపుతుంది; ‘అప్పుడు’ సందర్భానుగుణ సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: εἰσδέξομαι ὑμᾶς
  choice: మిమ్మల్ని స్వీకరిస్తాను
  rationale: అనుకూలంగా చేర్చుకోవడం లేదా ఆహ్వానించడం అనే భావాన్ని గంభీరమైన, సాధారణ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: పాత నిబంధన నేపథ్యమున్న ప్రవచన ఉల్లేఖనంలో κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా; యజమాని
  rationale: గ్రీకు కొత్త నిబంధన పాఠంలో ఉన్న κύριοςను అనువదిస్తూ పాత నిబంధన దైవనామాన్ని పాఠంలోకి అదనంగా చేర్చదు.
- issue: వేరుపాటు ఆజ్ఞ యొక్క పరిధి
  choice: వేరుగా ఉండండి
  alternative: ప్రత్యేకపరచబడండి; మిమ్మల్ని మీరు వేరుచేసుకోండి
  rationale: అపవిత్రత నుంచి వేరుగా ఉండాలనే ఆజ్ఞను నిలుపుతుంది; సమస్త బయటి వ్యక్తులతో సంబంధాలను తెంచుకోవాలనే మతశాఖాపరమైన అన్వయాన్ని పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ప్రవచన-ఆజ్ఞ స్వరం ఉంచబడింది. అసలు గ్రీకు పాఠంలోని వేరుపాటు, అపవిత్రత, స్వీకరణ అనే క్రమం కాపాడబడింది. ఆంగ్ల సంప్రదింపు పాఠంలో [a] గుర్తు ‘Therefore’ వద్ద కనిపించినా, దాని గమనిక ἀφορίσθητεకు సంబంధించినందున తెలుగులో ‘వేరుగా ఉండండి’ తర్వాత ఉంచబడింది.
