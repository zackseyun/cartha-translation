id: 2CO.6.1
reference: 2 Corinthians 6:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: te
  text: ఆయనతో కలిసి పనిచేస్తున్న మేము[a], దేవుని కృపను వ్యర్థంగా పొందవద్దని మిమ్మల్ని వేడుకుంటున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తోటి పనివారమైన మేము కూడా మిమ్మల్ని వేడుకుంటున్నాం.” గ్రీకులో పౌలు ఎవరితో కలిసి పనిచేస్తున్నాడో ప్రత్యక్షంగా చెప్పలేదు; అయితే సందర్భం దేవుణ్ణి బలంగా సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: ఆయనతో కలిసి పనిచేస్తున్న మేము
  rationale: ఈ వర్తమాన కృదంతం కలిసి పనిచేయడాన్ని సూచిస్తుంది. 5:18–20లో దేవుని సమాధానపరిచే కార్యం ప్రధానంగా ఉన్నందున, సూచిత భాగస్వామి దేవుడని సందర్భం బలంగా తెలియజేస్తుంది; అయినా గ్రీకులో ఆయన అనే పదం ప్రత్యక్షంగా లేదు కాబట్టి పాదసూచికలో అస్పష్టతను నిలిపాం.
- source_word: δὲ καὶ
  choice: కూడా
  rationale: δέ స్వల్ప సంధానాన్ని సూచిస్తుండగా καί అదనపు భావాన్ని ఇస్తుంది. సహజమైన తెలుగు ప్రవాహంలో δέను ప్రత్యేక పదంతో చూపకుండా, καίను ‘కూడా’గా వ్యక్తం చేశాం.
- source_word: παρακαλοῦμεν
  choice: వేడుకుంటున్నాం
  rationale: ఇక్కడ ఇది గంభీరమైన విజ్ఞప్తి లేదా ప్రేరేపణ. ‘వేడుకుంటున్నాం’ ఆధునిక తెలుగులో earnest appealను సహజంగా తెలియజేస్తుంది.
- source_word: μὴ εἰς κενὸν
  choice: వ్యర్థంగా ... వద్దని
  rationale: εἰς κενόν అంటే ఫలితం లేకుండా, ప్రయోజనం లేకుండా. ‘వ్యర్థంగా’ గ్రీకు నానుడి యొక్క సంక్షిప్తమైన భావబలాన్ని కాపాడుతుంది.
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: దేవుని కృపను
  rationale: χάριςకు పౌలు రచనల్లో ఉన్న దైవశాస్త్రీయ బరువును ‘కృప’ సముచితంగా నిలుపుతుంది; τοῦ θεοῦను సహజమైన సంబంధ రూపంలో అనువదించాం.
- source_word: δέξασθαι ὑμᾶς
  choice: పొందవద్దని మిమ్మల్ని
  rationale: δέχομαι అంటే స్వీకరించడం లేదా పొందడం. ఇక్కడ ‘దేవుని కృపను పొందడం’ సహజమైన తెలుగు ప్రయోగం; ὑμᾶςను ప్రధాన క్రియతో ‘మిమ్మల్ని’గా అమర్చాం.
theological_decisions:
- issue: ‘కలిసి పనిచేస్తున్న’ అనే మాటలో సూచిత భాగస్వామి
  choice: సందర్భానుసారం దేవుణ్ణి సూచిస్తూ ‘ఆయనతో’ అని ప్రధాన పాఠ్యంలో స్పష్టం చేయడం
  alternative: ‘తోటి పనివారమైన మేము’ లేదా సూచిత భాగస్వామిని చెప్పకుండా ‘కలిసి పనిచేస్తూ’ అని అనువదించడం
  rationale: 5:18–20లో సమాధానపరచే కార్యం దేవునిదిగా, పౌలు మరియు అతని సహచరులు ఆయన రాయబారులుగా వర్ణించబడ్డారు. కాబట్టి దేవుడే సూచిత భాగస్వామి కావడం అత్యంత సాధ్యం. అయితే గ్రీకు కృదంతంలో ఆయన అనే కర్మ ప్రత్యక్షంగా లేనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని అనుసరించాం. ‘కృప’, ‘వ్యర్థంగా’ వంటి పరిచితమైన దైవశాస్త్రీయ పదాలను నిలిపి, వాక్యాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచాం.
