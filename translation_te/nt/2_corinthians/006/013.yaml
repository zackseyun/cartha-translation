  rationale: αὐτήν‌లోని ‘అదే/సమానమైన’ భావాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది; పౌలు మరియు అతని సహచరులు చూపిన స్పందనకు సరితూగే స్పందనను కోరుతున్నాడు.
- source_word: ὡς τέκνοις
