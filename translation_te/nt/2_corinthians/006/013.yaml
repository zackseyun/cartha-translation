theological_decisions:
- issue: పౌలు సంబోధనలో స్వామ్యాన్ని స్పష్టంగా చేర్చాలా
  choice: ‘పిల్లలకు’ అని మాత్రమే ఉంచడం
  alternative: ‘నా పిల్లలకు’
  rationale: సందర్భం పౌలు తండ్రిలాంటి ఆప్యాయతను సూచించినా, గ్రీకు మూలంలో ‘నా’ అనే స్వామ్యసూచక సర్వనామం లేదు. అందువల్ల సంబంధంలోని ఆప్యాయతను పాఠకుడు సందర్భం ద్వారా గ్రహించేలా చేసి, మూలంలో లేని పదాన్ని చేర్చలేదు.
- issue: πλατύνθητε వద్ద ‘హృదయాలు’ అనే పదాన్ని చేర్చాలా
  choice: ‘విశాలంగా తెరుచుకోండి’ అని, అవ్యక్త కర్మను చేర్చకుండా అనువదించడం
  alternative: ‘మీ హృదయాలను విశాలంగా తెరవండి’
  rationale: ముందరి వచనాల్లో హృదయం అనే సందర్భం ఉన్నప్పటికీ, ఈ వచనంలోని గ్రీకు క్రియకు ‘హృదయాలు’ అనే ప్రత్యక్ష కర్మ లేదు. రూపకంలోని ఉద్దేశాన్ని సహజంగా తెలియజేస్తూనే మూలంలోని సంక్షిప్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. మూలంలోని మధ్యప్రవేశ వాక్యాన్ని దీర్ఘ విరామ చిహ్నాలతో నిలిపి, ‘నా’ మరియు ‘హృదయాలు’ వంటి సందర్భసిద్ధమైనా మూలంలో ప్రత్యక్షంగా లేని పదాలను ప్రధాన పాఠ్యంలో చేర్చలేదు.
