id: 2CO.6.2
reference: 2 Corinthians 6:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: te
  text: 'ఎందుకంటే ఆయన ఇలా అంటున్నాడు[a]: “అనుకూలమైన సమయంలో నేను నీ మాట ఆలకించాను; రక్షణ దినాన నీకు సహాయం చేశాను.” ఇదిగో, ఇప్పుడు అనుకూలమైన సమయం; ఇదిగో[b], ఇప్పుడు రక్షణ దినం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన ఇలా చెబుతున్నాడు.” ఇక్కడ వర్తమాన కాలపు క్రియ లేఖన వాక్యాన్ని ప్రస్తుతం పలుకుతున్నట్లుగా పరిచయం చేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “ఇదే అనుకూలమైన సమయం … ఇదే రక్షణ దినం” అని కూడా అర్థం చేసుకోవచ్చు. గ్రీకులో ఈ పదబంధాలకు నిర్దిష్ట ఉపపదం లేదు; తెలుగులో ఈ రూపాలు నిర్దిష్టతను గానీ అనిర్దిష్టతను గానీ సందర్భానుసారంగా తెలియజేయగలవు.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει γάρ
  choice: ఎందుకంటే ఆయన ఇలా అంటున్నాడు
  rationale: γάρ ముందున్న విజ్ఞప్తికి వివరణాత్మక సంబంధాన్ని చూపుతుంది. λέγει వర్తమాన కాలంలో లేఖనంలోని దైవిక వక్తను సజీవంగా పరిచయం చేస్తుంది; అందుకే వ్యక్తిగత కర్తను నిలిపాం.
- source_word: Καιρῷ δεκτῷ
  choice: అనుకూలమైన సమయంలో
  rationale: καιρός సాధారణ కాలప్రవాహం కంటే తగిన లేదా నియమిత సందర్భాన్ని సూచిస్తుంది; δεκτός ఆమోదయోగ్యమైన లేదా అనుకూలమైన భావాన్ని ఇస్తుంది. సహజమైన తెలుగులో రెండింటినీ ఈ పదబంధం అందిస్తుంది.
- source_word: ἐπήκουσά σου
  choice: నేను నీ మాట ఆలకించాను
  rationale: ἐπακούω వినడమే కాక అనుకూలంగా వినడం లేదా స్పందించడం అనే ఛాయను కలిగి ఉంటుంది. ‘ఆలకించాను’ ఆ స్పందనాత్మక భావాన్ని ఉంచుతుంది; ‘జవాబిచ్చాను’ అని భావాన్ని మరీ నిర్దిష్టం చేయదు.
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: రక్షణ దినాన
  rationale: తెలుగులో కాలసూచక వాక్యంగా ఇది సహజం. గ్రీకులో నిర్దిష్ట ఉపపదం లేకపోయినా, తెలుగులో articles లేనందున అనవసరంగా నిర్దిష్టతను చేర్చదు.
- source_word: ἐβοήθησά σοι
  choice: నీకు సహాయం చేశాను
  rationale: βοηθέω యొక్క నేరమైన, స్పష్టమైన అర్థం ‘సహాయం చేయడం’ లేదా ‘ఆదుకోవడం’; ఇక్కడ ‘సహాయం చేశాను’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: ἰδοὺ
  choice: ఇదిగో
  rationale: ἰδού శ్రద్ధను ఆకర్షించి ప్రకటనకు గంభీరతనిచ్చే అవ్యయం. ‘ఇదిగో’ దాని వాక్చాతుర్య బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: νῦν
  choice: ఇప్పుడే
  rationale: νῦν లోని ప్రస్తుతకాల అత్యవసరతను సాధారణ ‘ఇప్పుడు’ కంటే ‘ఇప్పుడే’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: καιρὸς εὐπρόσδεκτος
  choice: అత్యంత అనుకూలమైన సమయం
  rationale: εὐπρόσδεκτος కేవలం δεκτός కంటే బలంగా, ఎంతో ఆమోదయోగ్యమైన లేదా విశేషంగా అనుకూలమైన సమయాన్ని సూచిస్తుంది. ‘అత్యంత’ మొదటి పదబంధంతో ఉన్న సంబంధాన్ని నిలిపి తీవ్రతను తెలియజేస్తుంది.
- source_word: ἡμέρα σωτηρίας
  choice: రక్షణ దినం
  rationale: మూలంలోని సంక్షిప్త, గంభీరమైన పదబంధాన్ని యథాతథంగా, సహజంగా అందిస్తుంది; తెలుగులో article వ్యవస్థ లేనందున ఇది ‘ఒక’ లేదా ‘ఆ’ అని బలవంతంగా నిర్ణయించదు.
theological_decisions:
- issue: చివరి రెండు అనుపపద పదబంధాలను నిర్దిష్టంగా లేదా అనిర్దిష్టంగా అర్థం చేయాలా
  choice: తెలుగులో article జోడించకుండా ‘సమయం’, ‘దినం’ అని ఉంచడం
  alternative: ‘ఇదే ఆ అనుకూల సమయం; ఇదే ఆ రక్షణ దినం’ లేదా ‘ఒక అనుకూల సమయం; ఒక రక్షణ దినం’
  rationale: గ్రీకు పదబంధాలు article లేకుండా ఉన్నాయి; అయితే సందర్భం ప్రస్తుత క్షణానికి ప్రత్యేక ప్రాధాన్యం ఇస్తుంది. తెలుగులో article లేకపోవడం వల్ల మూలంలోని నిజమైన అనిశ్చితిని సహజంగా నిలపవచ్చు; ఒక నిర్దిష్ట అంత్యకాల పథకాన్ని అనువాదంలోకి చేర్చాల్సిన అవసరం లేదు.
- issue: λέγει లో అంతర్లీన కర్త లేఖనమా లేక దేవుడా
  choice: వ్యక్తిగతంగా ‘ఆయన ఇలా అంటున్నాడు’
  alternative: ‘లేఖనం ఇలా చెబుతోంది’
  rationale: ఉద్ధరణలో మాట్లాడేవాడు దేవుడిగా ప్రత్యక్షమవుతున్నాడు. ‘ఆయన’ అనడం ఆ దైవిక వాక్య స్వరూపాన్ని నిలుపుతుంది; వివరణాత్మకంగా ‘దేవుడు’ అనే పదాన్ని మూలానికి అదనంగా చేర్చదు.
- issue: σωτηρία ను ఆధ్యాత్మిక రక్షణగా మాత్రమే పరిమితం చేయాలా
  choice: విస్తృతమైన ‘రక్షణ’ అనే పదాన్ని ఉంచడం
  alternative: ‘విమోచనం’ లేదా ‘నిత్యరక్షణ’
  rationale: σωτηρία రక్షణ, విడిపింపు, క్షేమం వంటి విస్తృత భావపరిధి కలిగి ఉంది. ‘రక్షణ’ సందర్భానికి తగినదిగా ఉండి, దాని భావాన్ని ఒకే సిద్ధాంతపరమైన నిర్వచనానికి పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన లేఖనోద్ధరణ శైలిని ఉంచుతూ, అరుదైన సంస్కృతభరిత పదాలను నివారించాం. ‘ఆలకించాను’, ‘ఇదిగో’, ‘రక్షణ దినం’ వంటి పదాలు గౌరవప్రదమైన స్వరాన్ని నిలుపుతాయి; ‘ఇప్పుడే’ పౌలు ఉద్దేశించిన అత్యవసరతను స్పష్టం చేస్తుంది.
