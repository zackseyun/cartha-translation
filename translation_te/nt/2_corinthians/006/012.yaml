id: 2CO.6.12
reference: 2 Corinthians 6:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ στενοχωρεῖσθε ἐν ἡμῖν, στενοχωρεῖσθε δὲ ἐν τοῖς σπλάγχνοις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/012.yaml
  text: You are not restricted by us[a], but you are restricted in your own affections.
translation:
  language: te
  text: మా వల్ల మీరు ఇరుకులో లేరు[a]; కానీ మీ సొంత హృదయాల్లోనే మీరు ఇరుకులో ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాలో మీరు ఇరుకుపడి లేరు; మీ సొంత అంతరంగ వాత్సల్యాల్లోనే మీరు ఇరుకుపడి ఉన్నారు.”
    reason: ἐν (‘లో’) మరియు στενοχωρεῖσθε యొక్క ఇరుకు-స్థల రూపకాన్ని మరింత అక్షరానుసారంగా చూపడానికి; σπλάγχναకు ‘అంతరంగ వాత్సల్యాలు’ అనే భావవ్యక్తీకరణను సూచించడానికి.
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: ఇరుకుపడలేదు / ఇరుకుపోయింది
  rationale: ఈ క్రియ అక్షరార్థంగా ఇరుకైన స్థలంలో ఉండడాన్ని, రూపకంగా నిర్బంధానికి లేదా సంకుచిత స్థితికి లోనవడాన్ని సూచిస్తుంది. రెండు చోట్లా ‘ఇరుకు’ అనే ఒకే మూలభావాన్ని ఉంచడం ద్వారా పౌలు చేసిన వాక్చాతుర్యపూర్వక వ్యత్యాసం నిలుస్తుంది; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా రెండవ ప్రయోగం వాత్సల్యాన్ని కర్తగా చూపుతుంది.
- source_word: ἐν ἡμῖν
  choice: మా వల్ల
  rationale: ἐν అక్షరార్థంగా ‘లో’ అయినప్పటికీ, ఇక్కడ కొరింథీయుల సంకుచిత స్థితికి పౌలు మరియు అతని సహచరులు కారణం కాదనే సంబంధార్థం ఉంది. దాన్ని సహజమైన తెలుగులో ‘మా వల్ల’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: ;
  rationale: రెండు భాగాల మధ్యనున్న బలమైన వ్యత్యాసాన్ని తెలుగులో సమాంతర వాక్య నిర్మాణం మరియు అర్ధవిరామం సహజంగా తెలియజేస్తాయి; ‘కాని’ అని కూడా అనువదించవచ్చు.
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: మీ సొంత వాత్సల్యమే
  rationale: σπλάγχνα అక్షరార్థంగా అంతరాంగాలను, రూపకంగా లోతైన మమకారం లేదా వాత్సల్యాన్ని సూచిస్తుంది. ఈ సంబంధ సందర్భంలో ‘వాత్సల్యం’ భావోద్వేగ సామర్థ్యాన్ని సహజంగా తెలియజేస్తుంది; ‘సొంత’ అనే పదం పరిమితి వారిలోనే ఉందన్న నొక్కును నిలుపుతుంది.
- source_word: οὐ
  choice: లేదు
  rationale: మొదటి భాగంలోని నిరాకరణను సహజమైన తెలుగు క్రియారూపంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: σπλάγχνα యొక్క రూపకార్థం
  choice: కొరింథీయుల అంతరంగ వాత్సల్యం లేదా మమకార సామర్థ్యం
  alternative: అక్షరార్థంగా ‘అంతరాంగాలు’; లేదా సాధారణంగా ‘హృదయాలు’
  rationale: సందర్భం పౌలు చూపిన విశాల హృదయానికి కొరింథీయులు ఇచ్చిన పరిమిత స్పందన గురించినది. అందువల్ల శరీరావయవాల అక్షరార్థం కాకుండా భావోద్వేగ సంబంధమైన రూపకార్థం ఉద్దేశించబడింది; ‘వాత్సల్యం’ దాన్ని అతిగా సిద్ధాంతీకరించకుండా నిలుపుతుంది.
- issue: పరిమితికి కారణం ఎక్కడ ఉందన్న వ్యత్యాసం
  choice: పౌలు సహచరుల వల్ల కాదు; కొరింథీయుల సొంత అంతరంగ స్పందనలోనే ఉంది
  alternative: ‘మాలో మీరు ఇరుకుపడలేదు; మీ అంతరాంగాల్లో ఇరుకుపడ్డారు’ అనే మరింత అక్షరానుసార నిర్మాణం
  rationale: ἐν అనే ఉపసర్గ రెండుసార్లు వచ్చిన సమాంతరతను మూలపాఠం ఉంచినా, మొదటి ప్రయోగం సహజ తెలుగులో కారణార్థకంగా గ్రహించబడుతుంది. పాదటిప్పణి మరింత అక్షరానుసార ప్రత్యామ్నాయాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఇరుకు’ మూలభావాన్ని రెండు భాగాల్లో పునరావృతం చేసి గ్రీకు వాక్యంలోని పదప్రయోగ వ్యత్యాసాన్ని నిలిపాం; ‘వాత్సల్యం’ సాధారణ పాఠకుడికి అర్థమయ్యేలా భావోద్వేగార్థాన్ని వ్యక్తం చేస్తుంది.
