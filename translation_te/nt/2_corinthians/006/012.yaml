revisions:
- from: మా వల్ల మీరు ఇరుకుపడలేదు[a]; మీ సొంత వాత్సల్యమే ఇరుకుపోయింది.
  to: మా వల్ల మీరు ఇరుకులో లేరు[a]; కానీ మీ సొంత హృదయాల్లోనే మీరు ఇరుకులో ఉన్నారు.
  rationale: The revision restores the Corinthians as the subject in both clauses, retains the repeated ‘ఇరుకు’ metaphor and the source's contrast, and uses idiomatic ‘హృదయాల్లో’ for the figurative σπλάγχνα. The footnote preserves a more literal rendering of the repeated ἐν construction and the embodied-affection nuance.
  reviewer_model: gpt-5.6-terra
