  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μηδεμίαν ἐν μηδενὶ διδόντες προσκοπήν, ἵνα μὴ μωμηθῇ ἡ διακονία,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/003.yaml
  text: giving no cause for stumbling in anything[a], so that the ministry may not be blamed[b],
translation:
  language: te
  text: ఏ విషయంలోనూ తడబాటుకు కారణం కలిగించకుండా[a], పరిచర్య నిందకు గురికాకుండా ఉండేలా[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఏ విషయంలోనూ అభ్యంతరానికి కారణం ఇవ్వకుండా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పరిచర్య అపకీర్తికి గురికాకుండా ఉండేలా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδεμίαν … προσκοπήν
  choice: తడబాటుకు కారణం
  rationale: ప్రసκοπήలో ఉన్న తడబడేలా చేసే సందర్భం లేదా అభ్యంతరానికి కారణం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; కేవలం మనస్తాపం కలిగించడం అనే అర్థానికి పరిమితం చేయదు.
- source_word: ἐν μηδενί
  choice: ఏ విషయంలోనూ
  rationale: ఈ పదబంధం వర్తించే పరిధి సమగ్రమైనదని తెలియజేస్తుంది. గ్రీకులో వ్యక్తిని సూచించే స్పష్టమైన పదం లేనందున ‘ఎవరికీ’ అని చేర్చలేదు.
- source_word: διδόντες
  choice: కలిగించకుండా
  rationale: అక్షరార్థంగా ‘ఇవ్వకుండా’ అయినా, తడబాటుకు కారణం అనే నామపదబంధంతో తెలుగులో ‘కలిగించకుండా’ సహజంగా ఉండి కారణమయ్యే భావాన్ని నిలుపుతుంది.
- source_word: ἵνα μὴ
  choice: … కాకుండా ఉండేలా
  rationale: ప్రయోజనం లేదా ఆశించిన ఫలితాన్ని సూచించే గ్రీకు నిర్మాణాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: μωμηθῇ
  choice: నిందకు గురికాకుండా
  rationale: నిందించడం లేదా తప్పుపట్టడం అనే క్రియ యొక్క కర్మణి రూపాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἡ διακονία
  choice: పరిచర్య
  rationale: ఈ సందర్భంలో పౌలు మరియు అతని సహచరులు దేవుని సేవకులుగా నిర్వర్తిస్తున్న సేవను సూచిస్తుంది; తరువాతి కాలపు సంఘపదవుల భావాన్ని అనవసరంగా చేర్చదు.
theological_decisions:
- issue: διακονία అనే పదం సూచించే సేవ
  choice: ‘పరిచర్య’—పౌలు మరియు అతని సహచరుల సేవా కార్యం
  alternative: ‘సేవ’—మరింత విస్తృతమైన సాధారణ సేవ
  rationale: సమీప సందర్భంలో దేవుని సేవకులుగా వారు తమ బాధ్యతను నిర్వర్తించడం ప్రధానాంశం. ‘పరిచర్య’ ఆ సందర్భాన్ని తెలియజేస్తూనే నిర్దిష్ట సంఘపదవిని దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగానూ సాధారణ పాఠకులకు స్పష్టమైనదిగానూ ఉంది. మూలంలోని అసమాపక క్రియా నిర్మాణం మరియు తరువాతి వాక్యంతో అనుసంధానాన్ని నిలుపుటకు వాక్యాన్ని కామాతో ముగించాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
