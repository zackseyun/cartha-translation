- from: పవిత్రతలో, జ్ఞానంలో, సహనంలో, దయలో, పరిశుద్ధాత్మలో[a], నిష్కపటమైన ప్రేమలో,
  to: స్వచ్ఛతలో, జ్ఞానంలో, సహనంలో, దయలో, పరిశుద్ధాత్మలో[a], నిష్కపటమైన ప్రేమలో,
  rationale: The revision distinguishes ἁγνότης (‘purity’) from holiness and corrects the alternative-reading note so that it reflects πνεῦμα as ‘spirit’ rather than ‘inner conscience.’ It also preserves the Greek ἐν (‘in’) construction in the alternative.
