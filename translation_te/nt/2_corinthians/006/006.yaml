id: 2CO.6.6
reference: 2 Corinthians 6:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/006.yaml
  text: in purity[a], in knowledge, in patience, in kindness, in the Holy Spirit, in sincere love,
translation:
  language: te
  text: స్వచ్ఛతలో, జ్ఞానంలో, సహనంలో, దయలో, పరిశుద్ధాత్మలో[a], నిష్కపటమైన ప్రేమలో,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఇది పరిశుద్ధాత్మను కాక పవిత్రమైన స్వభావాన్ని సూచిస్తే, “పవిత్రమైన ఆత్మలో.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: పవిత్రతలో
  rationale: ἁγνότης విస్తృతార్థంలో నైతిక స్వచ్ఛతను సూచిస్తుంది. ‘పవిత్రత’ సహజమైన ఆధునిక తెలుగు పదం; దీనిని లైంగిక శుద్ధికి మాత్రమే పరిమితం చేయదు.
- source_word: γνώσει
  choice: జ్ఞానంలో
  rationale: γνῶσις ఇక్కడ పరిచర్యకు సంబంధించిన జ్ఞానాన్ని, ఆచరణాత్మక అవగాహనను కూడా కలిగిన విస్తృత భావాన్ని సూచించవచ్చు. ‘జ్ఞానం’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: μακροθυμίᾳ
  choice: సహనంలో
  rationale: μακροθυμία మనుషుల పట్లగానీ కష్టాల మధ్యగానీ దీర్ఘంగా ఓర్చుకునే గుణాన్ని సూచిస్తుంది. ‘సహనం’ సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: χρηστότητι
  choice: దయలో
  rationale: χρηστότης దయాపూర్వకమైన, మేలు చేసే వైఖరిని సూచిస్తుంది. ‘దయ’ ఈ సంబంధాత్మక లక్షణాన్ని సరళంగా వ్యక్తం చేస్తుంది.
- source_word: πνεύματι ἁγίῳ
  choice: పరిశుద్ధాత్మలో
  rationale: పౌలు వాడుకలో ఈ పదబంధం అత్యంత సహజంగా దేవుని పరిశుద్ధాత్మను సూచిస్తుంది. అయితే మానవుని పవిత్రమైన అంతరాత్మ లేదా స్వభావం అనే వ్యాకరణపరమైన అవకాశాన్ని పాదసూచికలో నిలిపాం.
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: నిష్కపటమైన ప్రేమలో
  rationale: ἀνυπόκριτος కపటం లేదా నటన లేనిదని సూచిస్తుంది. ‘నిష్కపటమైన ప్రేమ’ ఆధునిక తెలుగులో సహజంగా ఉండి నిజాయితీగల ప్రేమ అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν
  choice: లో
  rationale: పునరావృతమైన ἐν సాధనం, పరిధి లేదా విధానాన్ని సూచించగలదు. ప్రతి అంశంతో ‘లో’ను పునరావృతం చేయడం మూలంలోని అలంకార లయను, ఉద్దేశపూర్వక జాబితా నిర్మాణాన్ని కాపాడుతుంది.
theological_decisions:
- issue: πνεύματι ἁγίῳ యొక్క సూచితార్థం
  choice: దేవుని పరిశుద్ధాత్మ
  alternative: పవిత్రమైన అంతరాత్మ లేదా పవిత్ర స్వభావం
  rationale: పౌలు రచనలలోని సాధారణ వాడుకను, సందర్భాన్ని బట్టి దేవుని పరిశుద్ధాత్మ ప్రధాన అర్థం. అయినప్పటికీ నిర్దేశక పదం లేకపోవడం వల్ల మానవుని పవిత్రమైన అంతరాత్మ లేదా స్వభావం అనే అవకాశాన్ని పూర్తిగా తొలగించకుండా పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని ἐν పద పునరావృతాన్ని ‘లో’ ద్వారా నిలిపి జాబితా లయను కాపాడాం. ఇది వాక్యమధ్య భాగమైనందున చివర కామాను ఉంచాం.
