id: 2CO.6.4
reference: 2 Corinthians 6:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: te
  text: 'అయితే, ప్రతి విషయంలోనూ[a] దేవుని సేవకులుగా మమ్మల్ని మేము చూపించుకుంటూ[b]: ఎంతో ఓర్పుతో[c], బాధల్లో, కష్టాల్లో, సంకట పరిస్థితుల్లో,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతి విధంగానూ.’ గ్రీకు పదబంధం ప్రతి పరిస్థితినీ లేదా వారు తమను చూపించుకునే ప్రతి అంశాన్నీ సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవుని సేవకులుగా మమ్మల్ని మేము సిఫారసు చేసుకుంటూ.’ ఇక్కడ గ్రీకు క్రియకు ‘సిఫారసు చేయడం,’ ‘సమర్పించడం,’ లేదా ‘నిజమైనవారిగా చూపించడం’ అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘ఎంతో ఓర్పులో.’ తరువాతి పదాలతో పాటు గ్రీకులో ‘లో’ అనే నిర్మాణం పదేపదే వస్తుంది; సహజమైన తెలుగుకోసం ఇక్కడ ‘తో’ అని అనువదించాం.
    reason: translation_structure
lexical_decisions:
- source_word: ἀλλ’
  choice: అయితే
  rationale: ముందున్న ప్రతికూల వాక్యానికి భిన్నంగా, పరిచర్య యొక్క సానుకూల తీరును పరిచయం చేసే వ్యతిరేకార్థక సంధానంగా సహజంగా ఉంది.
- source_word: ἐν παντί
  choice: ప్రతి విషయంలోనూ
  rationale: ప్రతి పరిస్థితిని లేదా ప్రతి విధాన్ని సూచించగల గ్రీకు పదబంధపు విస్తృతిని నిలుపుతుంది.
- source_word: συνιστάνοντες ἑαυτούς
  choice: మమ్మల్ని మేము నిరూపించుకుంటున్నాం
  rationale: ఇక్కడ συνίστημι కేవలం స్వీయ ప్రశంసను కాక, ప్రవర్తన మరియు సహనం ద్వారా తమ పరిచర్య నిజమైనదని చూపించడాన్ని సూచిస్తుంది.
- source_word: ὡς θεοῦ διάκονοι
  choice: దేవుని సేవకులుగా
  rationale: διάκονοιలోని సేవ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; అవసరం లేని అధికారిక సంఘపదవి భావాన్ని చేర్చదు.
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: ఎంతో సహనంతో
  rationale: ὑπομονή కష్టాల కింద నిలకడగా భరించడాన్ని సూచిస్తుంది; ఈ తెలుగు పదబంధం సహజంగా ఉండి πολλῇ తీవ్రతను కూడా తెలియజేస్తుంది.
- source_word: θλίψεσιν
  choice: బాధల్లో
  rationale: ఒత్తిడి వల్ల కలిగే వేదన మరియు శ్రమ అనే సందర్భోచిత భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: ἀνάγκαις
  choice: కష్టాల్లో
  rationale: తప్పించుకోలేని ఒత్తిడికర పరిస్థితులు లేదా నిర్బంధించే కష్టాలు అనే సందర్భార్థాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: στενοχωρίαις
  choice: ఇరుకు పరిస్థితుల్లో
  rationale: దారిలేక నలువైపులా నొక్కివేయబడిన స్థితి అనే పదంలోని చిత్రాత్మక భావాన్ని నిలుపుతూ, ముందున్న బాధలు మరియు కష్టాల నుంచి దీనిని వేరుచేస్తుంది.
theological_decisions:
- issue: పరిచర్య సందర్భంలో διάκονοι అనువాదం
  choice: దేవుని సేవకులు
  alternative: దేవుని పరిచారకులు
  rationale: ఈ పదం దేవునికి చేసే సేవను ప్రధానంగా సూచిస్తుంది; తరువాతి కాలపు అధికారిక సంఘపదవి భావాన్ని తప్పనిసరిగా సూచించదు. అందువల్ల సాధారణంగా అర్థమయ్యే ‘సేవకులు’ను ఎంచుకున్నాం.
- issue: συνιστάνοντεςలో స్వీయ సిఫారసు మరియు నిరూపణ మధ్య భావం
  choice: నిరూపించుకుంటున్నాం
  alternative: మమ్మల్ని మేము సిఫారసు చేసుకుంటున్నాం
  rationale: సందర్భంలో పౌలు మరియు అతని సహచరులు మాటలతో తమను పొగడటం కాక, సహనంతో కూడిన జీవితం ద్వారా దేవుని సేవకులమని చూపిస్తున్నారు. అయినా మూలపదంలో ‘సిఫారసు చేయడం’ అనే ఛాయ ఉండగలదని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంచాం. గ్రీకు బాధల జాబితాలోని మూడు దగ్గర భావాల మధ్య తేడాను సాధ్యమైనంతవరకు నిలిపాం. వాక్యం తరువాతి వచనాల్లో కొనసాగుతున్నందున చివర కామాను ఉంచాం.
