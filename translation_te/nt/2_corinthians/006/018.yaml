id: 2CO.6.18
reference: 2 Corinthians 6:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔσομαι ὑμῖν εἰς πατέρα, καὶ ὑμεῖς ἔσεσθέ μοι εἰς υἱοὺς καὶ θυγατέρας, λέγει κύριος παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/018.yaml
  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: te
  text: “నేను మీకు తండ్రిగా ఉంటాను[a]; మీరు నాకు కుమారులుగా, కుమార్తెలుగా ఉంటారు” అని సర్వశక్తిమంతుడైన ప్రభువు చెబుతున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “నేను మీకు తండ్రిగా ఉంటాను; మీరు నాకు కుమారులుగాను కుమార్తెలుగాను ఉంటారు.” గ్రీకులోని ఈ పదప్రయోగం నిబంధన సంబంధాన్ని వ్యక్తపరుస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσομαι ὑμῖν εἰς πατέρα
  choice: నేను మీకు తండ్రిగా ఉంటాను
  rationale: εἶναι + దత్తివు + εἰς అనే నిబంధన-సంబంధ పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తూ, భవిష్యత్ భావాన్ని మరియు తండ్రి-సంబంధాన్ని నిలుపుతుంది.
- source_word: ὑμεῖς ἔσεσθέ μοι
  choice: మీరు నాకు ... ఉంటారు
  rationale: స్పష్టంగా ఉన్న ὑμεῖς వల్ల కలిగే పరస్పర సంబంధపు నొక్కిచెప్పడాన్ని ‘మీరు’తో ఉంచి, మొదటి భాగంతో ఉన్న సమాంతరతను కాపాడుతుంది.
- source_word: υἱοὺς καὶ θυγατέρας
  choice: కుమారులుగా, కుమార్తెలుగా
  rationale: గ్రీకు మూలం మగ, ఆడ సంతానాన్ని విడివిడిగా పేర్కొంటుంది; ‘పిల్లలు’ అని సాధారణీకరించకుండా ఆ స్పష్టతను నిలుపుతుంది.
- source_word: λέγει
  choice: చెబుతున్నాడు
  rationale: లేఖన ఉద్ధరణ సూత్రంలోని గ్రీకు వర్తమాన కాలాన్ని తెలుగులో సహజంగా, సజీవంగా వ్యక్తపరుస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: ఇక్కడ దైవిక బిరుదుగా ఉన్న κύριοςకు ప్రామాణికమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: παντοκράτωρ
  choice: సర్వశక్తిమంతుడైన
  rationale: సమస్తంపై అధికారం, శక్తి కలిగినవాడు అనే దైవిక బిరుదు భావాన్ని సంక్షిప్తంగా, గంభీరంగా అందిస్తుంది.
theological_decisions:
- issue: పుత్రికా సంబంధాన్ని లింగ-స్పష్టతతో అనువదించడం
  choice: కుమారులుగా, కుమార్తెలుగా
  alternative: పిల్లలుగా
  rationale: మూలపాఠం υἱούς, θυγατέρας రెండింటినీ స్పష్టంగా పేర్కొంటుంది; ‘పిల్లలు’ అనడం కుమార్తెలను ఉద్దేశపూర్వకంగా చేర్చిన ప్రత్యేకతను మరుగుపరుస్తుంది.
- issue: κύριος παντοκράτωρ అనే దైవిక బిరుదు
  choice: సర్వశక్తిమంతుడైన ప్రభువు
  alternative: ప్రభువు, సర్వాధికారి
  rationale: మూలంలోని రెండు దైవిక బిరుదులను నిలుపుతూ, లేని వేరొక పాతనిబంధన బిరుదును దిగుమతి చేయకుండా సహజమైన తెలుగు క్రమంలో అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన లేఖన శైలి. పరస్పర నిబంధన సంబంధాన్ని చూపే వాక్య సమాంతరతను, కుమారులు–కుమార్తెలు అనే స్పష్టమైన చేర్పును నిలిపింది.
