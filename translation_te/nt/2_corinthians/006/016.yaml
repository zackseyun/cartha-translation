id: 2CO.6.16
reference: 2 Corinthians 6:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: te
  text: 'దేవుని ఆలయానికీ విగ్రహాలకూ ఏ సమ్మతి[a] ఉంది? ఎందుకంటే మనం సజీవుడైన దేవుని ఆలయం. దేవుడు చెప్పినట్లుగా:


    “నేను వారి మధ్య నివసిస్తాను[b], వారి మధ్య సంచరిస్తాను;


    నేను వారికి దేవుడనై ఉంటాను,


    వారు నా ప్రజలుగా ఉంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సయోధ్య’ లేదా ‘అంగీకారం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘వారిలో నివసిస్తాను’ అని కూడా అనువదించవచ్చు. గ్రీకులోని విభక్తి సూచకం ‘లో’ లేదా ‘మధ్య’ అనే భావాలను ఇవ్వగలదు; ఇక్కడ సమష్టిని ఉద్దేశించిన నిబంధన సందర్భం ‘వారి మధ్య’ అనే అనువాదానికి అనుకూలంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: అంగీకారం
  rationale: ఈ నామవాచకం అంగీకారం, సమ్మతి లేదా సయోధ్యను సూచిస్తుంది. ‘అంగీకారం’ ఆధునిక తెలుగులో స్పష్టంగా ఉండి, సందర్భంలోని పరస్పర విరుద్ధమైన జతల మధ్య సంబంధాన్ని తెలిపే అలంకారిక ప్రశ్నకు సరిపోతుంది.
- source_word: ναῷ / ναὸς
  choice: ఆలయం
  rationale: ναός దేవాలయ ప్రాంగణమంతటినీ కాక ప్రత్యేకంగా ఆలయాన్ని లేదా పవిత్ర మందిరాన్ని సూచిస్తుంది. ‘ఆలయం’ రూపకంలోని ఆరాధనా భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: εἰδώλων
  choice: విగ్రహాలు
  rationale: ఇక్కడ తటస్థమైన ప్రతిమలు కాక అన్యదేవతారాధనకు సంబంధించిన విగ్రహాలే ఉద్దేశం; అందువల్ల ‘విగ్రహాలు’ సందర్భానికి తగినది.
- source_word: ζῶντος
  choice: సజీవుడైన
  rationale: ఈ పదం θεοῦను విశేషిస్తూ జీవంలేని విగ్రహాలకు భిన్నంగా దేవుడు జీవించేవాడని తెలియజేస్తుంది. ‘సజీవుడైన దేవుడు’ గంభీరంగానూ స్పష్టంగానూ ఉంది.
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: దేవుడు చెప్పినట్లుగా
  rationale: καθώςలోని పోలిక భావాన్నీ, εἶπενలోని గతకాల భావాన్నీ సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: నేను వారి మధ్య నివసించి
  rationale: ἐν అనే విభక్తి సూచకం ‘వారిలో’ లేదా ‘వారి మధ్య’ అని అర్థమివ్వగలదు. బహువచన సమాజాన్ని ఉద్దేశించిన నిబంధన సందర్భం మరియు తరువాతి ‘వారి మధ్య సంచరిస్తాను’ అనే సమాంతర వాక్యం దృష్ట్యా ‘వారి మధ్య’ ప్రధాన పాఠ్యానికి అనుకూలం.
- source_word: ἐμπεριπατήσω
  choice: వారి మధ్య సంచరిస్తాను
  rationale: దేవుడు తన ప్రజల మధ్య ఉండడాన్ని సజీవమైన నిబంధనాత్మక రూపకంతో ఈ క్రియ తెలియజేస్తుంది. ‘సంచరిస్తాను’ ఆ కదలిక భావాన్ని నిలుపుతుంది.
- source_word: ἔσομαι αὐτῶν θεός
  choice: నేను వారి దేవుడనై ఉంటాను
  rationale: ఇది నిబంధన సంబంధాన్ని తెలిపే సుపరిచిత సూత్రం. సంబంధార్థక షష్ఠీ విభక్తిని ‘వారి దేవుడు’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: λαός
  choice: ప్రజలు
  rationale: నిబంధన సందర్భంలో λαός దేవునికి చెందిన సమాజాన్ని సమష్టిగా సూచిస్తుంది; ‘ప్రజలు’ ఆ సామూహిక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: సమష్టి ఆలయ రూపకం
  choice: మనం సజీవుడైన దేవుని ఆలయం
  alternative: మనం సజీవుడైన దేవునికి ఒక ఆలయం
  rationale: విధేయ నామవాచకంగా వ్యాసం లేకుండా వచ్చిన ναὸς ఇక్కడ గుణాత్మకంగానూ నిర్దిష్టంగానూ సంఘ సమాజపు గుర్తింపును తెలియజేస్తుంది. ‘ఆలయం’ అనే ఏకవచనం విశ్వాస సమాజాన్ని సమష్టిగా చూపుతుంది; ప్రతి వ్యక్తిని విడివిడిగా ఆలయమని మార్చదు.
- issue: దైవ నివాసం గురించిన ఉల్లేఖన భాష
  choice: నేను వారి మధ్య నివసించి
  alternative: నేను వారిలో నివసించి
  rationale: ἐν αὐτοῖς రెండింటికీ అవకాశం ఇస్తుంది. ఉల్లేఖనం సమాజాన్ని సమష్టిగా ఉద్దేశించడం, వెంటనే ‘వారి మధ్య సంచరిస్తాను’ అని రావడం వల్ల ప్రధాన పాఠ్యంలో ‘వారి మధ్య’ ఎంచుకున్నాం; ‘వారిలో’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. అలంకారిక ప్రశ్నను నేరుగా ఉంచి, ఉల్లేఖనాన్ని కవితాత్మక పంక్తులుగా అమర్చాం. ‘మనం’ సాధారణ పాఠకులకు సహజంగా ఉండగా, ఏకవచన ‘ఆలయం’ సమష్టి రూపకాన్ని కాపాడుతుంది.
