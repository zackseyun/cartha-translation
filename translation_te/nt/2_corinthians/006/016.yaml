revisions:
- from: 'విగ్రహాలతో దేవుని ఆలయానికి ఏ అంగీకారం[a] ఉంటుంది? ఎందుకంటే మనం సజీవుడైన దేవుని ఆలయం. దేవుడు చెప్పినట్లుగా:


    “నేను వారి మధ్య నివసించి[b], వారి మధ్య సంచరిస్తాను;

    నేను వారి దేవుడనై ఉంటాను,

    వారు నా ప్రజలై ఉంటారు.”'
  to: 'దేవుని ఆలయానికీ విగ్రహాలకూ ఏ సమ్మతి[a] ఉంది? ఎందుకంటే మనం సజీవుడైన దేవుని ఆలయం. దేవుడు చెప్పినట్లుగా:


    “నేను వారి మధ్య నివసిస్తాను[b], వారి మధ్య సంచరిస్తాను;


    నేను వారికి దేవుడనై ఉంటాను,


    వారు నా ప్రజలుగా ఉంటారు.”'
  rationale: The revision restores the future verbal force of the divine promise, improves the idiomatic balance of the opening rhetorical question, and uses natural Telugu covenant-formula phrasing without altering the corporate sense or resolving the ‘in/among’ ambiguity beyond what the footnote records.
