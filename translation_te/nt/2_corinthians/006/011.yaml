source:
  edition: SBLGNT
  text: Τὸ στόμα ἡμῶν ἀνέῳγεν πρὸς ὑμᾶς, Κορίνθιοι, ἡ καρδία ἡμῶν πεπλάτυνται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/011.yaml
  text: Our mouth has been opened to you[a], Corinthians[b]; our heart has been widened.
translation:
  language: te
  text: కొరింథీయులారా, మా నోరు మీ పట్ల తెరచి ఉంది[a]; మా హృదయం విశాలమైంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, భావానుసారంగా: “మేము మీతో మనసు విప్పి మాట్లాడాము.”'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “మా హృదయం వెడల్పయింది”; భావానుసారంగా: “మా హృదయం పూర్తిగా తెరచి ఉంది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: στόμα
  choice: నోరు
  rationale: పౌలు ఉపయోగించిన శరీర సంబంధ రూపకాన్ని నిలుపుతుంది; తరువాతి ‘హృదయం’తో ఉన్న సమాంతరతను కూడా కాపాడుతుంది.
- source_word: ἀνέῳγεν
  choice: తెరచి ఉంది
  rationale: పరిపూర్ణ కాలరూపం సూచించే, గత చర్య వల్ల కొనసాగుతున్న ప్రస్తుత స్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πρὸς ὑμᾶς
  choice: మీతో మాట్లాడడానికి
  rationale: ఇక్కడ నోరు తెరవడం అనేది వారిని ఉద్దేశించి మాట్లాడటాన్ని సూచిస్తుంది; తెలుగులో కేవలం ‘మీ వైపు’ లేదా ‘మీకు’ అనడం కంటే ఈ రూపం సహజంగా ఉంటుంది, రూపకాన్ని మాత్రం నిలుపుతుంది.
- source_word: Κορίνθιοι
  choice: కొరింథీయులారా
  rationale: ప్రత్యక్ష సంబోధనను ఆధునిక ప్రామాణిక తెలుగు సంబోధన రూపంలో స్పష్టంగా తెలియజేస్తుంది.
- source_word: καρδία
  choice: హృదయం
  rationale: ఆప్యాయతకు, అంతరంగ వైఖరికి కేంద్రం అనే మూలభాషా రూపకాన్ని గౌరవప్రదమైన సాధారణ తెలుగు పదంతో నిలుపుతుంది.
- source_word: πεπλάτυνται
  choice: విశాలమైంది
  rationale: ‘వెడల్పు చేయబడింది’ అనే కఠినమైన పదానువాదం కన్నా సహజంగా ఉండి, విస్తరించబడిన హృదయం అనే గ్రీకు రూపకాన్ని మరియు ఫలితస్థితిని కాపాడుతుంది.
theological_decisions:
- issue: పౌలు బహిరంగతను, ఆప్యాయతను తెలిపే శరీర రూపకాలు
  choice: ‘నోరు తెరచి ఉంది’, ‘హృదయం విశాలమైంది’ అనే రూపకాలను ప్రధాన పాఠ్యంలో నిలుపడం
  alternative: ‘మేము మీతో మనసు విప్పి మాట్లాడాము; మాపై మీకున్న ప్రేమకు మా హృదయం పూర్తిగా తెరచి ఉంది’ వంటి భావానువాదం
  rationale: మూలపాఠం బహిరంగంగా మాట్లాడటం, విస్తారమైన ప్రేమ అనే భావాలను రూపకాల ద్వారా తెలియజేస్తుంది. వాటిని నేరుగా వివరణగా మార్చకుండా ఉంచడం ద్వారా అసలు వాక్చాతుర్యమూ, దానిలోని భావవిస్తృతీ నిలుస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు మూలంలోని ‘నోరు—హృదయం’ సమాంతర రూపకాలను నిలిపి, అర్థాన్ని సహాయపడే భావానువాదాలను పాదటిప్పణుల్లో ఇచ్చాం.
