source:
  edition: SBLGNT
  text: ἐν λόγῳ ἀληθείας, ἐν δυνάμει θεοῦ· διὰ τῶν ὅπλων τῆς δικαιοσύνης τῶν δεξιῶν καὶ ἀριστερῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/007.yaml
  text: in the word of truth[a], in the power of God; through the weapons of righteousness in the right hand and in the left[c][b],
translation:
  language: te
  text: సత్య వాక్యంలో, దేవుని శక్తిలో; కుడిచేతిలోనూ ఎడమచేతిలోనూ ఉన్న నీతి[a] ఆయుధాల ద్వారా,[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘న్యాయపు ఆయుధాలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కుడివైపునకూ ఎడమవైపునకూ ఉన్న.’ గ్రీకులో ‘చేతులు’ అనే పదం ప్రత్యక్షంగా లేదు.
    reason: previous_rendering
  - marker: c
    text: కుడిచేయి, ఎడమచేయి అనే మాటలు రెండు చేతుల్లో ఉపయోగించే ఆయుధాలను సూచిస్తూ, దాడికీ రక్షణకీ సంపూర్ణ సంసిద్ధతను చిత్రించవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: సత్య వాక్యంలో
  rationale: λόγος అనే పదానికి ‘వాక్యం,’ ‘సందేశం,’ ‘మాట’ అనే అర్థాలు ఉండవచ్చు. ‘సత్య వాక్యం’ గ్రీకు నిర్మాణాన్ని నిలుపుతూ, సత్యమైన ప్రకటన మరియు సత్య సందేశం అనే రెండు భావాలకు చోటిస్తుంది.
- source_word: δυνάμει θεοῦ
  choice: దేవుని శక్తిలో
  rationale: పునరావృతమయ్యే ἐν నిర్మాణాన్ని, మూలంలోని లయను కాపాడే సహజమైన షష్ఠీ ప్రయోగం.
- source_word: διὰ
  choice: ద్వారా
  rationale: షష్ఠీ విభక్తితో వచ్చిన διά సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది; తెలుగులో ‘ద్వారా’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὅπλων
  choice: ఆయుధాల
  rationale: ὅπλον యుద్ధంలో ఉపయోగించే దాడి లేదా రక్షణ సాధనాలను సూచించగలదు. ‘ఆయుధాలు’ ఈ విస్తృత భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: ఇక్కడ δικαιοσύνη నైతిక సదాచారాన్ని లేదా దేవుడు అనుగ్రహించే న్యాయసమ్మత సాధనాలను సూచించవచ్చు. ‘నీతి’ ఈ పౌలు వాడుకలో విస్తృతమైన భావాన్ని నిలుపుతుంది; ‘న్యాయం’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: కుడిచేతిలోనూ ఎడమచేతిలోనూ ఉన్న
  rationale: δεξιῶν, ἀριστερῶν విశేషణాలు నామవాచకాలుగా వాడబడి, సందర్భంలో కుడి మరియు ఎడమ చేతులను సూచించే అవకాశం ఎక్కువ. తెలుగులో సూచితమైన ‘చేతి’ని చేర్చడం చిత్రాన్ని సహజంగా, స్పష్టంగా చేస్తుంది.
theological_decisions:
- issue: పౌలు వాడుకలో δικαιοσύνη అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఒకే సిద్ధాంతపరమైన అర్థాన్ని బలవంతంగా నిర్ణయించకుండా, వ్యక్తిగత నైతిక యథార్థత మరియు న్యాయసమ్మతత రెండింటికీ చోటిచ్చే విస్తృత పదంగా ‘నీతి’ ఎంచుకోబడింది; ‘న్యాయం’ పాదసూచికలో భద్రపరచబడింది.
- issue: కుడి, ఎడమ అనే యుద్ధ రూపకం
  choice: కుడిచేతిలోనూ ఎడమచేతిలోనూ ఉన్న ఆయుధాలు
  alternative: కుడివైపునకూ ఎడమవైపునకూ ఉన్న ఆయుధాలు
  rationale: చేతుల సూచన సంభావ్యమైనదే గాని గ్రీకులో ‘చేతులు’ ప్రత్యక్షంగా లేవు. అందువల్ల ప్రధాన పాఠంలో సహజమైన భావాన్ని ఇచ్చి, మరింత రూపపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ముందూ వెనుకా కొనసాగే సేవా-జాబితా లయ కోసం అర్ధవిరామం మరియు చివరి అల్పవిరామం నిలుపబడ్డాయి. ‘సత్య వాక్యం’ కొంత బైబిలీయ గంభీరతను కలిగి ఉన్నా, λόγος లోని ‘మాట/సందేశం’ ద్వంద్వార్థాన్ని అనవసరంగా సంకుచితం చేయదు.
