source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: te
  text: 'పౌలునైన నేనే, మెస్సీయ సాత్వికతను, సౌమ్యతను బట్టి మిమ్మల్ని వేడుకుంటున్నాను: మీ మధ్య ముఖాముఖిగా ఉన్నప్పుడు నేను అణకువగా ఉంటాను[a], దూరంగా ఉన్నప్పుడు మాత్రం మీ పట్ల ధైర్యంగా ఉంటాను.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అణకువగా’ అనేది ‘దీనంగా’ అని కూడా అర్థం కావచ్చు. పౌలు సమక్షంలో అతడు ప్రభావం లేనివాడని కొందరు చేసిన వ్యంగ్య వ్యాఖ్యకు ఇది ప్రతిధ్వనిగా ఉండవచ్చు; అయితే గ్రీకులో అది స్పష్టంగా చెప్పబడలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: పౌలునైన నేనే
  rationale: Αὐτός, ἐγώ అనే ద్విగుణ వ్యక్తీకరణలోని స్వీయ ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది. δέ ఇక్కడ స్వల్ప సంధానాన్ని సూచిస్తుంది; సందర్భం లేకుండా ‘అయితే’ అని పెట్టడం అనవసరమైన వైరుధ్యాన్ని కలిగించవచ్చు.
- source_word: παρακαλῶ ὑμᾶς
  choice: మిమ్మల్ని వేడుకుంటున్నాను
  rationale: ఇక్కడ ఆజ్ఞకన్నా వ్యక్తిగతమైన, హృదయపూర్వకమైన విజ్ఞప్తి ప్రధానంగా ఉంది.
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: సాత్వికతను, సహనశీలతను బట్టి
  rationale: διά + షష్ఠీ విభక్తి విజ్ఞప్తికి ఆధారం లేదా సాధనాన్ని సూచిస్తుంది. πραΰτηςకు ‘సాత్వికత’, ἐπιείκειαకు కఠినంగా హక్కు చెలాయించకుండా చూపే మృదువైన సహనాన్ని తెలిపే ‘సహనశీలత’ ఎంచుకున్నాం.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ యొక్క
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని మెస్సీయ సంబంధ అర్థాన్ని అనువదించాం.
- source_word: κατὰ πρόσωπον
  choice: ముఖాముఖిగా ఉన్నప్పుడు
  rationale: అక్షరార్థంలోని ‘ముఖం’ చిత్రాన్ని నిలుపుతూ, ఇక్కడ ఉద్దేశించిన ప్రత్యక్ష సాన్నిధ్యాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ταπεινὸς
  choice: అణకువగలవాణ్ణి
  rationale: ‘వినయంగల’ అనే సానుకూల భావానికీ ‘దీనంగా/బెదురుగా’ అనే ప్రత్యర్థుల వ్యంగ్య భావానికీ మధ్య ఉన్న సందర్భోచిత ఉద్రిక్తతను పూర్తిగా పరిష్కరించకుండా ఉంచుతుంది.
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: దూరంగా ఉన్నప్పుడు మాత్రం మీ పట్ల ధైర్యంగా ఉంటాను
  rationale: సాన్నిధ్యం–అనుపస్థితి మధ్య వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది. εἰς ὑμᾶςను శత్రుత్వంగా అతివ్యాఖ్యానించకుండా ‘మీ పట్ల’ అని ఇచ్చాం.
theological_decisions:
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో పదం బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని అనువదించడం మెస్సీయ సంబంధ నేపథ్యాన్ని నిలుపుతుంది.
- issue: పౌలు తనను తాను వర్ణించిన మాటల స్వరం
  choice: సంభావ్య వ్యంగ్యాన్ని సూచిస్తూ, అది స్పష్టమైన ప్రత్యక్ష ఉద్ధరణ కాదని నిలుపడం
  alternative: పౌలు నేరుగా ‘నేను అణకువగలవాణ్ణి’ అని ఒప్పుకున్నట్లు ఇవ్వడం
  rationale: గ్రీకు వాక్యంలో ప్రత్యర్థుల ఆరోపణ ప్రతిధ్వనించే అవకాశం ఉంది, కాని ఉద్ధరణ సూచిక లేదు. అందుకే ‘అని అంటారు’ ద్వారా భావాన్ని సూచించాం; పాదసూచికలో అనిశ్చితిని వెల్లడించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. మూలంలోని ఉద్ఘాటన, వ్యక్తిగత విజ్ఞప్తి, ప్రత్యక్ష సాన్నిధ్యం–దూరం మధ్య వ్యత్యాసం, అలాగే ταπεινόςలోని సంభావ్య వ్యంగ్యాన్ని నిలుపడానికి ప్రయత్నించాం.
