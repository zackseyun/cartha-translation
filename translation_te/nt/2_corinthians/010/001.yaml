- from: పౌలునైన నేనే, మెస్సీయ యొక్క సాత్వికతను, సహనశీలతను బట్టి మిమ్మల్ని వేడుకుంటున్నాను. మీ మధ్య ముఖాముఖిగా ఉన్నప్పుడు నేను అణకువగలవాణ్ణి[a], దూరంగా ఉన్నప్పుడు మాత్రం మీ పట్ల ధైర్యంగా ఉంటానని అంటారు.
  to: 'పౌలునైన నేనే, మెస్సీయ సాత్వికతను, సౌమ్యతను బట్టి మిమ్మల్ని వేడుకుంటున్నాను: మీ మధ్య ముఖాముఖిగా ఉన్నప్పుడు నేను అణకువగా ఉంటాను[a], దూరంగా ఉన్నప్పుడు మాత్రం మీ పట్ల ధైర్యంగా ఉంటాను.'
  rationale: The revision removes the unsupported “they say,” retaining the Greek relative clause as Paul’s direct first-person description while preserving its possible irony in a footnote. It also replaces “సహనశీలత” with “సౌమ్యత” for a closer and more idiomatic rendering of ἐπιείκεια. The emphatic “పౌలునైన నేనే,” the title “మెస్సీయ,” and the non-hostile sense of εἰς ὑμᾶς (“మీ పట్ల”) are retained.
