translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని ἵνα అధీన వాక్యం ముందరి సందర్భంపై ఆధారపడినందున, దాని అసంపూర్ణ అనుసంధాన స్వభావాన్ని అదనపు ప్రధాన క్రియను చేర్చకుండా నిలుపుకున్నాం.
