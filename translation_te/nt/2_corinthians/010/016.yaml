source:
  edition: SBLGNT
  text: εἰς τὰ ὑπερέκεινα ὑμῶν εὐαγγελίσασθαι, οὐκ ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα καυχήσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: te
  text: మీకు ఆవల ఉన్న ప్రాంతాల్లో సువార్త ప్రకటించడానికి[a], వేరొకరి పరిధిలో ఇప్పటికే సిద్ధంగా ఉన్నవాటి గురించి గొప్పలు చెప్పుకోవడానికి కాదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీకు ఆవల ఉన్న దేశాల్లో సువార్త బోధించడానికి.”
    reason: lexical_alternative
  - marker: b
    text: “పరిధి” అని అనువదించిన గ్రీకు పదం ఇక్కడ ఒకరికి కేటాయించబడిన సేవా క్షేత్రాన్ని లేదా హద్దును సూచిస్తుంది. “ఇప్పటికే సిద్ధంగా ఉన్నవి” అనేది సందర్భంలో ఇతరులు ఇప్పటికే చేసిన లేదా సిద్ధం చేసిన సేవా పనిని సూచించవచ్చు.
    reason: cultural_note_and_alternative_reading
lexical_decisions:
- source_word: ὑπερέκεινα ὑμῶν
  choice: మీకు ఆవల ఉన్న ప్రాంతాల్లో
  rationale: ὑπερέκεινα భౌగోళికంగా ఒక స్థానం దాటి ఉన్న ప్రాంతాలను సూచిస్తుంది; ὑμῶν కొరింథీయులకు సంబంధించి ‘మీకు ఆవల’ అనే భావాన్ని ఇస్తుంది.
- source_word: εὐαγγελίσασθαι
  choice: సువార్త ప్రకటించడానికి
  rationale: మిషనరీ ప్రకటనను సూచించే క్రియార్థాన్ని సహజమైన ఆధునిక తెలుగు పదబంధంతో వ్యక్తం చేస్తుంది.
- source_word: ἐν ἀλλοτρίῳ κανόνι
  choice: వేరొకరి పరిధిలో
  rationale: ఇక్కడ κανών నైతిక నియమం లేదా తరువాతి కాలపు గ్రంథసూచిని కాక, మరొకరికి కేటాయించబడిన సేవా పరిధిని సూచిస్తుంది.
- source_word: εἰς τὰ ἕτοιμα
  choice: ఇప్పటికే సిద్ధంగా ఉన్నవాటి గురించి
  rationale: τὰ ἕτοιμα అనే నామవాచకార్థక విశేషణపు అస్పష్టతను ‘ఉన్నవాటి’ అని నిలిపి, అవి ఇతరులు చేసిన సేవాఫలితాలేనని ప్రధాన పాఠ్యంలో అతిగా నిర్ధారించదు.
- source_word: καυχήσασθαι
  choice: గొప్పలు చెప్పుకోకుండా ఉండడానికి
  rationale: పరిసర వచనాల్లో పౌలు వాడే ‘అతిశయించడం/గొప్ప చెప్పుకోవడం’ అనే పునరావృత భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
theological_decisions:
- issue: సేవా సందర్భంలో κανών అర్థం
  choice: కేటాయించబడిన సేవా పరిధి
  alternative: నియమం, ప్రమాణం, కానన్
  rationale: 10:13–15లో కొలత, హద్దులు, సేవా క్షేత్రం ప్రధానాంశాలు; అందువల్ల ‘పరిధి’ సందర్భానికి తగినది, తరువాతి సంఘపరమైన ‘కానన్’ భావాన్ని దిగుమతి చేయదు.
- issue: τὰ ἕτοιμα దేనిని సూచిస్తుంది
  choice: ఇప్పటికే సిద్ధంగా ఉన్నవి
  alternative: ఇతరులు ఇప్పటికే పూర్తి చేసిన సేవా పని
  rationale: సందర్భం ఇతరులు చేసిన పనిని సూచించే అవకాశం బలంగా ఉన్నా, గ్రీకు పదబంధం సంక్షిప్తంగా ఉండి ‘సిద్ధంగా ఉన్నవి’ అనే రూపంలోనే ఉంది; అందువల్ల ప్రధాన పాఠ్యం ఆ అస్పష్టతను కాపాడుతుంది, వివరణను పాదసూచనలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ఈ వాక్యం ముందున్న వచనంపై ఆధారపడే ఉద్దేశార్థక ఖండం కాబట్టి మూలంలోని అసంపూర్ణ వాక్య నిర్మాణాన్ని నిలిపాం. ప్రతి పాదసూచన గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
