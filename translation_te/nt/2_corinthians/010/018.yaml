source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἑαυτὸν ⸀συνιστάνων, ἐκεῖνός ἐστιν δόκιμος, ἀλλὰ ὃν ὁ κύριος συνίστησιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: te
  text: ఎందుకంటే, తనను తాను సిఫారసు చేసుకునేవాడు[a] ఆమోదం పొందినవాడు కాదు; ప్రభువు ఎవరిని సిఫారసు చేస్తాడో అతడే ఆమోదం పొందినవాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తనను తాను ప్రశంసించుకునేవాడు’ ... ‘ప్రభువు ఎవరిని ప్రశంసిస్తాడో.’ గ్రీకులో రెండు చోట్లా ఒకే క్రియ వాడబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: సిఫారసు చేసుకునేవాడు / సిఫారసు చేస్తాడో
  rationale: ఈ సందర్భంలో ఈ క్రియ ఒకరిని పరిశీలనకు యోగ్యుడిగా పరిచయం చేయడం లేదా సమర్థించడం అనే భావాన్ని ఇస్తుంది. రెండు చోట్లా ఒకే తెలుగు క్రియను వాడి గ్రీకు పదపునరుక్తిని నిలిపాము.
- source_word: δόκιμος
  choice: ఆమోదం పొందినవాడు
  rationale: పరీక్ష లేదా పరిశీలన అనంతరం యోగ్యుడిగా తేలిన వ్యక్తిని సూచించే భావాన్ని ఇది సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: మూలంలో ఉన్న బిరుదును మాత్రమే అనువదించి, అది యేసునా దేవుడా అనే గుర్తింపును ప్రధాన పాఠ్యంలో మరింత నిర్దిష్టం చేయలేదు.
- source_word: ἑαυτὸν
  choice: తనను తాను
  rationale: గ్రీకు ఆత్మవాచక సర్వనామ భావాన్ని సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ὃν
  choice: ఎవరిని ... అతడే
  rationale: గ్రీకు సంబంధవాచక నిర్మాణంలోని వ్యక్తిగత వ్యత్యాసాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ఈ వాక్యం ముందున్న వాదనకు వివరణ లేదా కారణం ఇస్తున్నదనే అనుసంధానాన్ని స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: ὁ κύριος అనే పదబంధం ఎవరిని సూచిస్తుంది
  choice: ప్రభువు
  alternative: ప్రభువైన యేసు; దేవుడు
  rationale: పౌలు రచనల సందర్భంలో ఇది సాధారణంగా యేసును సూచించవచ్చు; అయినా ఈ వచనం κύριος అనే బిరుదును మాత్రమే ఉపయోగిస్తుంది. అందువల్ల మూలంలోని అనిర్దిష్టతను అలాగే ఉంచాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాము. ‘సిఫారసు’ ప్రస్తుత వాడుకలో సహజమైన పదం; పాదటిప్పణి దాని విస్తృత భావాన్ని తెలుపుతుంది. మూలంలోని వ్యత్యాసం మరియు ఒకే క్రియ పునరుక్తి రెండూ నిలుపబడ్డాయి.
