  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν σαρκὶ γὰρ περιπατοῦντες οὐ κατὰ σάρκα στρατευόμεθα—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/003.yaml
  text: For though we walk in the flesh[a], we do not wage war according to the flesh—
translation:
  language: te
  text: ఎందుకంటే, మనం శరీరంలో జీవిస్తున్నప్పటికీ[a], శరీరానుసారంగా యుద్ధం చేయము—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మనం దేహంలో జీవిస్తున్నప్పటికీ, కేవలం మానవ ప్రమాణాల ప్రకారం యుద్ధం చేయము.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: శరీరంలో
  rationale: ఇక్కడ మొదటి σάρξ సాధారణ మానవ శారీరక ఉనికిని సూచిస్తుంది. ‘శరీరంలో’ అనేది సహజమైన ఆధునిక తెలుగు; దీనికి ‘పాప స్వభావం’ అనే భావాన్ని అనవసరంగా జోడించదు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందున్న మాటకు వివరణను పరిచయం చేస్తుంది; ‘ఎందుకంటే’ వాదనలోని సంబంధాన్ని తెలుగులో స్పష్టంగా, సహజంగా చూపిస్తుంది.
- source_word: περιπατοῦντες
  choice: జీవిస్తున్నప్పటికీ
  rationale: పదశః ‘నడుస్తూ ఉన్నా’; ఇక్కడ περιπατέω జీవించడాన్ని సూచిస్తుంది. తరువాతి నిరాకరణతో ఉన్న వ్యత్యాసాన్ని concessive భావంలో ‘జీవిస్తున్నప్పటికీ’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ κατὰ σάρκα
  choice: శరీరానుసారంగా ... చేయము
  rationale: κατά ఇక్కడ ప్రమాణం, విధానం లేదా నియంత్రక సూత్రాన్ని సూచిస్తుంది. ‘శరీరానుసారంగా’ రెండవ σάρξ‌ను మొదటిదానితో పదబంధంగా అనుసంధానిస్తూ, ‘కేవలం మానవ ప్రమాణాల ప్రకారం’, ‘లోకరీతిగా’ వంటి సాధ్యమైన భావాలను ఒక్కదానికే పరిమితం చేయదు.
- source_word: στρατευόμεθα
  choice: యుద్ధం చేయము
  rationale: సందర్భంలో ఇది పౌలు ఉపయోగించిన సైనిక రూపకం. ‘యుద్ధం చేయము’ ఆధునిక తెలుగులో సహజంగా ఉండి, క్రియాశీల పోరాట భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: రెండు చోట్ల σάρξ అనువాదం
  choice: మొదటి చోట ‘శరీరంలో’, రెండవ చోట ‘శరీరానుసారంగా’ అని ఒకే మూలపదపు పునరుక్తిని సాధ్యమైనంతవరకు నిలుపడం.
  alternative: ‘దేహంలో జీవిస్తున్నప్పటికీ ... కేవలం మానవ ప్రమాణాల ప్రకారం యుద్ధం చేయము’ లేదా ‘మానవ బలహీనతలో ... లోకరీతిగా యుద్ధం చేయము’.
  rationale: మొదటి వాడుక శారీరక మానవ జీవితాన్ని, రెండవది శరీర సంబంధమైన లేదా కేవలం మానవ విధానాన్ని సూచిస్తున్నట్లు సందర్భం చూపుతుంది. అయినా రెండింటినీ ‘పాప స్వభావం’గా లేదా రెండవదాన్ని ‘మానవ ప్రమాణాలు’గా మాత్రమే నిర్ణయించడం పౌలు ఉద్దేశించిన పదపునరుక్తి మరియు భావ ఉద్రిక్తతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నడుస్తున్నప్పటికీ’ అనే పదశః రూపం కంటే సందర్భానుగుణమైన ‘జీవిస్తున్నప్పటికీ’ ఎంచుకోబడింది; σάρξ పునరుక్తి ప్రధాన వాక్యంలో ‘శరీరం’ ద్వారా సాధ్యమైనంతవరకు నిలుపబడింది. చివరి దీర్ఘ విరామచిహ్నం తరువాతి వచనంతో కొనసాగుతున్న ఆలోచనను సూచిస్తుంది.
