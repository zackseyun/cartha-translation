reference: 2 Corinthians 10:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: te
  text: అయితే, నేను మీ దగ్గర ఉన్నప్పుడు, మనం శరీరానుసారంగా నడుచుకుంటున్నామని భావించే కొందరిని ఎదుర్కోవడానికి నేను సాహసిస్తానని అనుకుంటున్న ఆ ధీమాతో ధైర్యంగా వ్యవహరించాల్సిన అవసరం నాకు రాకూడదని వేడుకుంటున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మానవ ప్రమాణాల ప్రకారం జీవిస్తున్నామని.”
    reason: κατὰ σάρκα అనే పదబంధానికి సందర్భానుగుణమైన వివరణాత్మక ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: δέομαι
  choice: వేడుకుంటున్నాను
  rationale: సాధారణంగా అడగడం కంటే బలమైన, హృదయపూర్వకమైన విజ్ఞప్తిని ఈ పదం తెలియజేస్తుంది.
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: నేను మీ దగ్గర ఉన్నప్పుడు ... ధైర్యంగా వ్యవహరించాల్సిన అవసరం నాకు రాకూడదని
  rationale: μήతో కూడిన ఆర్టిక్యులర్ ఇన్ఫినిటివ్ పౌలు విజ్ఞప్తిలోని విషయాన్ని తెలుపుతుంది; సందర్భంలో సూచితమైన అవాంఛిత అవసరాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τῇ πεποιθήσει
  choice: ఆ నిశ్చయంతో
  rationale: πεποίθησιςలోని ధీమా, దృఢ నమ్మకం అనే భావాన్ని తెలుపుతూ, దత్తివిభక్తి సాధనార్థక భావాన్ని నిలుపుతుంది.
- source_word: τολμῆσαι ἐπί τινας
  choice: కొందరిని ఎదుర్కోవడానికి సాహసించాలని
  rationale: τολμάωలోని సాహసించి చర్య తీసుకునే భావాన్నీ, వ్యక్తులవైపు ప్రతికూలంగా దిశ చూపే ἐπί భావాన్నీ సహజంగా కలిపి వ్యక్తం చేస్తుంది.
- source_word: τοὺς λογιζομένους
  choice: భావించే
  rationale: వారు పౌలు గురించి చేసిన అంచనా లేదా తీర్పును సరళంగా వ్యక్తం చేస్తుంది.
- source_word: κατὰ σάρκα
  choice: శరీరానుసారంగా
  rationale: పౌలు వాడిన σάρξ అనే ప్రాముఖ్యమైన పదాన్ని వ్యాఖ్యానాత్మకంగా కుదించకుండా, దాని ఉద్దేశపూర్వక విస్తృతిని నిలుపుతుంది.
- source_word: περιπατοῦντας
  choice: నడుచుకుంటున్నామని
  rationale: జీవన ప్రవర్తనకు రూపకంగా వాడిన ‘నడవడం’ అనే పౌలు భాషను తెలుగులో సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: κατὰ σάρκα లో σάρξ అనువాదం
  choice: శరీరానుసారంగా
  alternative: మానవ ప్రమాణాల ప్రకారం జీవిస్తున్నామని
  rationale: ఇక్కడ ఆరోపణ కేవలం మానవ లేదా లోకసంబంధ ప్రమాణాల ప్రకారం ప్రవర్తించడాన్ని సూచించవచ్చు; అయితే ‘పాప స్వభావం ప్రకారం’ అని అనువదించడం భావాన్ని అతిగా నిర్ణయిస్తుంది. ప్రధాన పాఠంలో పౌలు పదబంధంలోని వేదాంతపరమైన విస్తృతిని నిలిపి, వివరణాత్మక ప్రత్యామ్నాయాన్ని అధస్సూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. మూలంలోని దీర్ఘ వాక్య నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగు వాక్యప్రవాహం కోసం ‘మీ దగ్గర’ మరియు ‘వ్యవహరించాల్సిన అవసరం’ అనే సహజ వ్యక్తీకరణలను ఉపయోగించాం.
