translation:
  language: te
  text: అయితే గొప్పచెప్పుకొనేవాడు ప్రభువులో గొప్పచెప్పుకోవాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత పదానుసారంగా: “గొప్పచెప్పుకొనేవాడు ప్రభువులో గొప్పచెప్పుకొనాలి.” పౌలు బహుశా యిర్మీయా 9:24ను (సెప్టువజింటులో 9:23) ప్రతిధ్వనింపజేస్తున్నాడు.'
    reason: cross_reference
lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: గొప్పచెప్పుకునేవాడు
  rationale: నిర్దిష్ట ఉపపదంతో కూడిన వర్తమాన మధ్యమ కృదంతం ఇక్కడ సాధారణంగా అలాంటి వ్యక్తిని సూచిస్తోంది. ఈ రూపం ప్రతినిధి ఏకవచనాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందున్న వాదనతో స్వల్ప వ్యత్యాసాన్ని లేదా మలుపును సూచిస్తుంది; అనుచితమైన గొప్పచెప్పుకోవడాన్ని సరైన గొప్పచెప్పుకోవడంతో వ్యత్యాసపరుస్తుంది.
- source_word: καυχώμενος / καυχάσθω
  choice: గొప్పచెప్పుకునేవాడు / గొప్పచెప్పుకోవాలి
  rationale: ఒకే గ్రీకు ధాతువు పునరావృతిని తెలుగులోనూ నిలిపి, దాని ‘boast/glory’ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది. ‘గొప్పచెప్పుకోవాలి’ మూడవ పురుష ఆజ్ఞార్థక బలాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐν
  choice: లోనే
  rationale: καυχάομαιతో వచ్చిన ἐν గొప్పచెప్పుకోవడానికి ఆధారం లేదా పరిధిని తెలియజేస్తుంది. ‘లోనే’ సరైన ఆధారం ప్రభువు మాత్రమే అనే సందర్భోచిత వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κυρίῳ
  choice: ప్రభువు
  rationale: κύριοςకు ప్రాజెక్టు ప్రమాణ పదమైన ‘ప్రభువు’ వాడబడింది. పౌలు యేసును ఉద్దేశించాడా లేక యిర్మీయా ప్రతిధ్వనిలో దేవుణ్ణి ఉద్దేశించాడా అని అనువాదంలో నిర్దిష్టీకరించలేదు.
theological_decisions:
- issue: లేఖన ప్రతిధ్వని సందర్భంలో ‘ప్రభువు’ అనే పదం ఎవరిని సూచిస్తుంది?
  choice: ప్రభువు
  alternative: ప్రభువైన యేసు / దేవుడు
  rationale: గ్రీకు పాఠంలో κυρίῳ మాత్రమే ఉంది. ఇది యిర్మీయా వాక్యాన్ని ప్రతిధ్వనింపజేస్తూనే పౌలు వాడుకలో ప్రభువైన యేసుతోనూ అనుసంధానం కలిగి ఉండవచ్చు; అందువల్ల ఆ ఉద్దేశ్యపూర్వక theological tensionను పరిష్కరించకుండా మూలంలోని సాధారణ సంబోధననే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన శైలి. గ్రీకులోని పదపునరావృతిని నిలిపి, ఆజ్ఞార్థాన్ని సహజమైన ‘-వాలి’ రూపంలో వ్యక్తం చేశాం.
