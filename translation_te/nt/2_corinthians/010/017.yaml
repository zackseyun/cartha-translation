- from: అయితే గొప్పచెప్పుకునేవాడు ప్రభువులోనే గొప్పచెప్పుకోవాలి.[a]
  to: అయితే గొప్పచెప్పుకొనేవాడు ప్రభువులో గొప్పచెప్పుకోవాలి.[a]
  rationale: “ప్రభువులోనే” ను “ప్రభువులో” గా మార్చి, మూలంలో లేని ప్రత్యేక ‘మాత్రమే’ అనే ఉద్ఘాటనను తొలగించాం. క్రియారూపాన్ని “గొప్పచెప్పుకొను” గా ఏకరీతిగా ఉంచి, గ్రీకులోని పదపునరావృతిని సహజంగా ప్రతిఫలించాం. పాదటిప్పణిలోనూ అదే రూపాన్ని ఉపయోగించాం.
