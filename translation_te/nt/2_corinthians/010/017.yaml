review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the generic substantival participle, the mild adversative δέ, the imperative, and κύριος as “ప్రభువు.” However, “ప్రభువులోనే” introduces an exclusive emphasis (“in the Lord alone”) not expressed by ἐν κυρίῳ. The Greek simply says “in the Lord.”
  naturalness: The wording is concise and suitable for modern standard Telugu. “గొప్పచెప్పుకొనేవాడు … గొప్పచెప్పుకోవాలి” naturally preserves the deliberate verbal repetition of the Greek.
  terminology: “ప్రభువు” appropriately preserves the Greek κύριος without deciding whether the allusive context foregrounds God or the Lord Jesus. “గొప్పచెప్పుకొను” is a clear contemporary rendering of καυχάομαι in this rhetorical context.
  issues:
  - severity: medium
    issue: The particle “నే” in “ప్రభువులోనే” is not represented in the Greek.
    rationale: ἐν κυρίῳ identifies the sphere/basis of boasting but does not explicitly state exclusivity. The context may imply a contrast, but the translation should not add it.
  revised_text: అయితే గొప్పచెప్పుకొనేవాడు ప్రభువులో గొప్పచెప్పుకోవాలి.[a]
