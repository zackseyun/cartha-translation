id: 2CO.10.6
reference: 2 Corinthians 10:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἐν ἑτοίμῳ ἔχοντες ἐκδικῆσαι πᾶσαν παρακοήν, ὅταν πληρωθῇ ὑμῶν ἡ ὑπακοή.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: te
  text: మీ విధేయత సంపూర్ణమైనప్పుడు[b], ప్రతి అవిధేయతను శిక్షించడానికి[a] మేము సిద్ధంగా ఉన్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రతి అవిధేయతకు ప్రతీకారం తీర్చడానికి’ లేదా ‘ప్రతి అవిధేయత విషయంలో న్యాయం జరిగేలా చేయడానికి.’ ఇక్కడి గ్రీకు క్రియ న్యాయప్రతిఫలం అమలు చేయడం లేదా ప్రతీకారం తీర్చడం అనే భావాన్ని కూడా ఇవ్వగలదు; ఈ సందర్భంలో ఇది క్రమశిక్షణాత్మక శిక్షను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీ విధేయత నెరవేరినప్పుడు’ లేదా ‘పూర్తి చేయబడినప్పుడు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: మేము సిద్ధంగా ఉన్నాం
  rationale: గ్రీకు నుడికారంలోని ‘సిద్ధంగా ఉండడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ముందున్న సందర్భంతో అనుసంధానమైన కర్తను స్పష్టత కోసం ‘మేము’ అని పేర్కొంది.
- source_word: ἐκδικῆσαι
  choice: శిక్షించడానికి
  rationale: ఈ సందర్భంలో అపొస్తల అధికారాన్ని ఎదిరించే అవిధేయతపై క్రమశిక్షణ చర్య తీసుకోవడం ప్రధాన భావం. వ్యక్తిగత పగ తీర్చుకోవడం అనే భావాన్ని అనవసరంగా కలిగించకుండా ‘శిక్షించడానికి’ అని అనువదించాం; న్యాయం చేయడం లేదా ప్రతీకారం తీర్చడం అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: πᾶσαν παρακοήν
  choice: ప్రతి అవిధేయతను
  rationale: πᾶσαν యొక్క పంపిణీ భావాన్నీ, παρακοή యొక్క విధేయత చూపకపోవడం అనే అర్థాన్నీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ὅταν
  choice: ఎప్పుడు/అప్పుడు అనే భావంతో ‘సంపూర్ణమైనప్పుడు’
  rationale: భవిష్యత్తులో నెరవేరవలసిన పరిస్థితిని సూచించే కాల-షరతు భావం తెలుగు ‘-నప్పుడు’ నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
- source_word: πληρωθῇ
  choice: సంపూర్ణమైనప్పుడు
  rationale: విధేయత తన పూర్తి స్థాయికి చేరడం అనే భావాన్ని సహజంగా తెలియజేస్తుంది; ‘నెరవేరినప్పుడు’ అనే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: ὑμῶν ἡ ὑπακοή
  choice: మీ విధేయత
  rationale: గ్రీకు స్వామ్య నిర్మాణానికి స్పష్టమైన, సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: పౌలు ఉద్దేశించిన ప్రతిస్పందన స్వభావం
  choice: అవిధేయతను శిక్షించడం
  alternative: ప్రతీకారం తీర్చడం లేదా న్యాయం జరిగేలా చేయడం
  rationale: సమీప సందర్భం అపొస్తల అధికారం, సంఘంలోని తిరుగుబాటు ధోరణి, దాని సవరణ గురించి ఉంది. అందువల్ల ‘శిక్షించడం’ సందర్భానికి తగినది; అయితే గ్రీకు క్రియలోని ప్రతీకారం/న్యాయప్రతిఫలం భావసాధ్యతను పాదటిప్పణిలో భద్రపరిచాం.
- issue: విధేయత సంపూర్ణం కావడం
  choice: మీ విధేయత సంపూర్ణమైనప్పుడు
  alternative: మీ విధేయత నెరవేరినప్పుడు లేదా పూర్తి చేయబడినప్పుడు
  rationale: విధేయత పూర్తి స్థాయికి చేరిన తరువాతే చర్య తీసుకుంటారనే కాల-షరతు సంబంధాన్ని నిలుపుతుంది; దానిని నిర్దిష్ట సిద్ధాంతపరమైన అర్థంతో పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే అపొస్తల అధికార సందర్భానికి తగిన గంభీరతతో రూపొందించబడింది. గ్రీకు వాక్యంలోని భాగవాక్య సంబంధాన్ని తెలుగులో సంపూర్ణ వాక్యంగా వ్యక్తం చేసి, καί భావాన్ని ‘కూడా’ ద్వారా నిలిపాం.
