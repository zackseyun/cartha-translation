revisions:
- from: ఎందుకంటే, ప్రభువు మిమ్మల్ని నిర్మించడానికి, కూల్చివేయడానికి కాదు[b], మాకు ఇచ్చిన అధికారాన్ని గురించి నేను ఇంకొంచెం ఎక్కువగా గొప్ప చెప్పుకున్నా కూడా, నేను సిగ్గుపరచబడను[a].
