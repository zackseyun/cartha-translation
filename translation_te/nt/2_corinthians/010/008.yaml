id: 2CO.10.8
reference: 2 Corinthians 10:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: te
  text: ఎందుకంటే, ప్రభువు మాకు ఇచ్చిన అధికారాన్ని గురించి నేను కొంచెం ఎక్కువగా గొప్పగా చెప్పుకున్నా కూడా, అది మీ అభివృద్ధి కోసం, మిమ్మల్ని కూల్చివేయడానికి కాదు[b], నేను అవమానానికి గురికాను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను సిగ్గుపడను.’ గ్రీకు క్రియను రెండు విధాలుగా అనువదించవచ్చు; అయితే ఇక్కడి కర్మణి రూపాన్ని ‘అవమానానికి గురికాను’ మరింత స్పష్టంగా ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీ నాశనం కోసం కాదు.’ గ్రీకు పాఠం ‘అభివృద్ధి’ని ‘కూల్చివేయడం/నాశనం చేయడం’తో వ్యతిరేకిస్తుంది; ప్రధాన పాఠం కూల్చివేత రూపకాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: ఎందుకంటే … చెప్పుకున్నా కూడా
  rationale: γάρ యొక్క వివరణాత్మక భావాన్ని ‘ఎందుకంటే’తో, ἐάν మరియు τε కలిగించే షరతు-ఉద్ఘాటన భావాన్ని ‘చెప్పుకున్నా కూడా’తో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: περισσότερόν τι
  choice: ఇంకొంచెం ఎక్కువగా
  rationale: పోలికను సూచించే ‘ఎక్కువగా’తో పాటు τι ఇచ్చే స్వల్పమైన, అనిర్దిష్టమైన మృదుత్వాన్ని ‘ఇంకొంచెం’ నిలుపుతుంది.
- source_word: καυχήσωμαι
  choice: నేను … గొప్ప చెప్పుకున్నా
  rationale: షరతుతో కూడిన aorist subjunctive భావాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో అందిస్తుంది; తనకు అప్పగించబడిన అధికారాన్ని గురించి పౌలు ధైర్యంగా చెప్పుకోవడాన్ని సూచిస్తుంది.
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: మాకు ఇచ్చిన అధికారాన్ని గురించి
  rationale: ἐξουσίαను కేవలం శక్తిగా కాక, అప్పగించబడిన హక్కు లేదా అధికారంగా స్పష్టంగా అనువదిస్తుంది.
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: ప్రభువు … మాకు ఇచ్చిన
  rationale: సంబంధవాచక పదం ‘అధికారం’ను సూచిస్తుందని నిలుపుతూ, ἔδωκενను సహజమైన భూతకాలంగా, κύριοςను గౌరవప్రదమైన ‘ప్రభువు’గా అందిస్తుంది.
- source_word: εἰς οἰκοδομὴν
  choice: మిమ్మల్ని నిర్మించడానికి
  rationale: οἰκοδομήలోని కట్టడం అనే రూపకాన్ని నిలుపుతూ, సందర్భంలో సూచితమైన ‘మిమ్మల్ని’ అనే కర్మను స్పష్టం చేస్తుంది.
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: కూల్చివేయడానికి కాదు
  rationale: καθαίρεσιςను ‘నిర్మించడం’కు వ్యతిరేకమైన కూల్చివేతగా చూపి, మూలంలోని నిర్మాణ రూపకాన్నీ పౌలు ఉద్దేశంలోని వ్యత్యాసాన్నీ నిలుపుతుంది.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: నేను సిగ్గుపరచబడను
  rationale: భవిష్యత్ కర్మణి రూపాన్ని ప్రతిబింబిస్తూ, పౌలు చెప్పుకున్నది ఆధారరహితమని తేలి అతడు అవమానానికి గురికాడనే భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: అపొస్తల అధికార స్వభావం మరియు ఉద్దేశం
  choice: పౌలు అధికారాన్ని ప్రభువు అప్పగించినదిగా, కొరింథీయులను నిర్మించడానికి ఉద్దేశించినదిగా పేర్కొనడం
  alternative: ఆ అధికారాన్ని ప్రధానంగా వారిని నాశనం చేయడానికి లేదా శిక్షాత్మకంగా కూల్చివేయడానికి ఇచ్చినదిగా అర్థం చేసుకోవడం
  rationale: οἰκοδομή–καθαίρεσις వ్యత్యాసం అధికారం నిజమైనదనీ దృఢంగా ఉపయోగించబడగలదనీ ఒప్పుకుంటూనే, దాని ఉద్దేశం సంఘాన్ని కూల్చడం కాక నిర్మించడమని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘నిర్మించడానికి/కూల్చివేయడానికి’ అనే జత మూలంలోని రూపకాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా నిలుపుతుంది. మూలానికి అనుగుణంగా [b] కూల్చివేత పదం వద్ద, [a] సిగ్గుపరచబడటం పదం వద్ద ఉంచబడ్డాయి.
