review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the conditional force, the delegated nature of the authority, its constructive rather than destructive purpose, and the future passive sense of οὐκ αἰσχυνθήσομαι. A small revision improves the Telugu rendering of οἰκοδομή and the final passive expression without altering the source meaning.
  naturalness: ‘మిమ్మల్ని నిర్మించడానికి’ is understandable but is not idiomatic modern Telugu for the figurative strengthening of persons. ‘సిగ్గుపరచబడను’ is a mechanically passive expression and sounds unnatural. ‘మీ అభివృద్ధి కోసం’ and ‘అవమానానికి గురికాను’ are clearer, natural modern Telugu while retaining the contrast and passive outcome.
  terminology: ‘ప్రభువు’ for κύριος and ‘అధికారం’ for ἐξουσία are appropriate. ‘మీ అభివృద్ధి కోసం’ conveys the edifying purpose of οἰκοδομή naturally; ‘మిమ్మల్ని కూల్చివేయడానికి కాదు’ preserves the contrasting demolition imagery.
  issues:
  - severity: low
    issue: The phrase ‘మిమ్మల్ని నిర్మించడానికి’ is stylistically awkward in modern Telugu.
    rationale: For people or a community, Telugu normally expresses this figurative purpose as strengthening or development rather than literally constructing persons. ‘మీ అభివృద్ధి కోసం’ accurately communicates οἰκοδομή in this context.
  - severity: medium
    issue: ‘నేను సిగ్గుపరచబడను’ is unnatural Telugu and can suggest someone will actively make Paul feel shame.
    rationale: The Greek future passive indicates that Paul will not be shown/discovered to be shameful. ‘నేను అవమానానికి గురికాను’ is an idiomatic Telugu passive-result expression and preserves this sense.
  revised_text: ఎందుకంటే, ప్రభువు మాకు ఇచ్చిన అధికారాన్ని గురించి నేను కొంచెం ఎక్కువగా గొప్పగా చెప్పుకున్నా కూడా, అది మీ అభివృద్ధి కోసం, మిమ్మల్ని కూల్చివేయడానికి కాదు[b], నేను అవమానానికి గురికాను[a].
