  revised_text: ఎందుకంటే, తమను తాము ప్రశంసించుకునే కొందరితో మమ్మల్ని మేము ఒకే కోవలో చేర్చుకోవడానికి గానీ, వారితో పోల్చుకోవడానికి గానీ మేము సాహసించము.[a] అయితే వారు తమనే ప్రమాణంగా చేసుకొని తమను తాము కొలుచుకుంటూ, తమతో తామే పోల్చుకుంటూ, అర్థం చేసుకోరు.[b]
