revisions:
- from: ఎందుకంటే, తమను తామే మెచ్చుకునే కొందరితో మమ్మల్ని మేము ఒకే కోవలో చేర్చుకోవడానికి గానీ, వారితో పోల్చుకోవడానికి గానీ మేము సాహసించము.[a] అయితే వారు తమనే ప్రమాణంగా చేసుకొని తమను తాము కొలుచుకుంటూ, తమతో తామే పోల్చుకుంటూ[b] ఉన్నారు; వారికి అవగాహన లేదు.
  to: ఎందుకంటే, తమను తాము ప్రశంసించుకునే కొందరితో మమ్మల్ని మేము ఒకే కోవలో చేర్చుకోవడానికి గానీ, వారితో పోల్చుకోవడానికి గానీ మేము సాహసించము.[a] అయితే వారు తమనే ప్రమాణంగా చేసుకొని తమను తాము కొలుచుకుంటూ, తమతో తామే పోల్చుకుంటూ, అర్థం చేసుకోరు.[b]
  rationale: మూలంలోని కృదంత-ప్రధానక్రియ సంబంధాన్ని పునరుద్ధరించి, οὐ συνιᾶσιν ను ‘అర్థం చేసుకోరు’గా నేరుగా అనువదించాం. దాని అవ్యక్త కర్మను పూరించలేదు. అలాగే συνιστάνω యొక్క సందర్భోచిత స్వీయ-ప్రశంస భావాన్ని మరింత స్పష్టంగా చేశాం; ఇతర రూపకాలు, వ్యంగ్య స్వరం, మరియు ఫుట్‌నోట్ సూచికలు యథాతథంగా నిలిపాం.
