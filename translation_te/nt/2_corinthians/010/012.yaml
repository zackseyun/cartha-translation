id: 2CO.10.12
reference: 2 Corinthians 10:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: te
  text: ఎందుకంటే, తమను తాము ప్రశంసించుకునే కొందరితో మమ్మల్ని మేము ఒకే కోవలో చేర్చుకోవడానికి గానీ, వారితో పోల్చుకోవడానికి గానీ మేము సాహసించము.[a] అయితే వారు తమనే ప్రమాణంగా చేసుకొని తమను తాము కొలుచుకుంటూ, తమతో తామే పోల్చుకుంటూ, అర్థం చేసుకోరు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “వారిలో మమ్మల్ని మేము చేర్చుకోవడానికి” లేదా “వారితో సమాన స్థాయిలో మమ్మల్ని ఉంచుకోవడానికి.” గ్రీకు క్రియ ఇతరులతో ఒకే వర్గంలో తనను ఉంచుకోవడం అనే భావాన్ని కలిగి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “తమలో తాము తమను తాము కొలుచుకుంటూ, తమతో తామే పోల్చుకుంటూ.” అంటే, తమనే తమకు ప్రమాణంగా చేసుకుంటున్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: మేము సాహసించము
  rationale: ఇక్కడ క్రియ ఒక పని చేయడానికి తెగించకపోవడం లేదా అలా చేయాలని భావించకపోవడం అనే వ్యంగ్యభరిత భావాన్ని ఇస్తుంది.
- source_word: ἐγκρῖναι
  choice: ఒకే కోవలో చేర్చుకోవడానికి
  rationale: ఇది సాధారణంగా తీర్పు తీర్చడం కాదు; ఇతరులతో ఒకే వర్గంలో తనను ఉంచుకోవడం అనే అరుదైన సందర్భార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: συγκρῖναι / συγκρίνοντες
  choice: పోల్చుకోవడానికి / పోల్చుకుంటూ
  rationale: రెండు చోట్లా పోలిక అనే సహజార్థాన్ని, మూలంలోని అలంకారాత్మక పునరుక్తిని నిలుపుతుంది.
- source_word: ἑαυτοὺς συνιστανόντων
  choice: తమను తామే మెచ్చుకునే
  rationale: సందర్భంలో συνίστημι తమను తాము అనుకూలంగా సిఫారసు చేసుకోవడం లేదా ప్రశంసించుకోవడం అనే భావాన్ని సూచిస్తుంది; సహజ తెలుగులో ఈ ఎంపిక ఆత్మస్తుతిని తెలియజేస్తుంది.
- source_word: ἀλλὰ αὐτοὶ
  choice: అయితే వారు
  rationale: ἀλλά తెలిపే వ్యత్యాసాన్ని సహజంగా చూపుతూ, αὐτοίలోని ప్రత్యర్థులపై దృష్టిని ‘వారు’ అనే కర్తతో నిలుపుతుంది.
- source_word: ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες
  choice: తమనే ప్రమాణంగా చేసుకొని తమను తాము కొలుచుకుంటూ
  rationale: ‘తమలో తాము’ అనే అక్షరార్థ రూపం తెలుగులో అస్పష్టంగా ఉండవచ్చు; తమనే కొలమానంగా వాడుతున్న సందర్భార్థాన్ని, కొలవడం అనే రూపకాన్ని కాపాడుతూ తెలియజేస్తుంది.
- source_word: ἑαυτοὺς ἑαυτοῖς
  choice: తమతో తామే
  rationale: ప్రతిబింబ సర్వనామాల పునరుక్తినీ, స్వీయ-సూచక పోలికను కూడా సహజ తెలుగులో నిలుపుతుంది.
- source_word: οὐ συνιᾶσιν
  choice: వారికి అవగాహన లేదు
  rationale: స్పష్టంగా గ్రహించకపోవడం అనే అర్థాన్ని సహజమైన, గంభీరమైన తెలుగులో ఇస్తుంది; గ్రీకులో కర్మ అవ్యక్తంగానే ఉన్నందున దానిని పూరించదు.
theological_decisions:
- issue: οὐ συνιᾶσιν యొక్క అవ్యక్త కర్మ
  choice: వారికి అవగాహన లేదు
  alternative: తాము చేస్తున్నది వారికి అర్థం కాదు
  rationale: మూలంలో వారు దేనిని గ్రహించరో స్పష్టంగా చెప్పలేదు. నిర్దిష్ట కర్మను చేర్చకుండా ఆ భావసందిగ్ధతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే పౌలు వాడిన వ్యంగ్య స్వరం, కొలత రూపకం, ప్రతిబింబ సర్వనామాల పునరుక్తి సాధ్యమైనంతవరకు నిలుపబడ్డాయి.
