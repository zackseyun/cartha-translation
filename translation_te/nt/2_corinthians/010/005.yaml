- from: మరియు దేవుని గురించిన జ్ఞానానికి విరోధంగా పైకెత్తబడే ప్రతి ఉన్నతమైన దానినీ[a], ప్రతి ఆలోచననూ మెస్సీయకు[b] విధేయత చూపేలా బందీగా తీసుకుంటూ,
