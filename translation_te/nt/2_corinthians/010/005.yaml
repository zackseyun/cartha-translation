id: 2CO.10.5
reference: 2 Corinthians 10:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πᾶν ὕψωμα ἐπαιρόμενον κατὰ τῆς γνώσεως τοῦ θεοῦ, καὶ αἰχμαλωτίζοντες πᾶν νόημα εἰς τὴν ὑπακοὴν τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/005.yaml
  text: and every lofty thing raised up against the knowledge of God[a], and taking every thought captive into obedience to Messiah[b],
translation:
  language: te
  text: మరియు దేవుని గురించిన జ్ఞానానికి వ్యతిరేకంగా పైకెత్తబడిన ప్రతి ఉన్నతమైన దానినీ[a], ప్రతి ఆలోచననూ మెస్సీయకు[b] విధేయత చూపేలా బందీగా తీసుకుంటూ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రతి ఎత్తైన దానినీ”; సందర్భానుసారంగా “ప్రతి గర్వోన్నతమైన దానినీ” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “ఆ మెస్సీయకు”; సంప్రదాయంగా “క్రీస్తుకు.”
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: ప్రతి ఉన్నతమైన దానినీ
  rationale: ὕψωμαలోని ‘ఎత్తైనది/ఉన్నతమైనది’ అనే రూపకాన్ని నిలుపుతూ, దానిని కేవలం అహంకారపూరిత వాదనగా పరిమితం చేయకుండా విస్తృతార్థాన్ని కాపాడుతుంది.
- source_word: ἐπαιρόμενον
  choice: పైకెత్తబడే
  rationale: కృదంతంలోని పైకి ఎత్తబడిన లేదా ఉన్నతపరచబడిన భావాన్ని, తప్పనిసరిగా ‘తన్నుతాను హెచ్చించుకునే’ ప్రతిబింబార్థంగా మార్చకుండా వ్యక్తపరుస్తుంది.
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: దేవుని గురించిన జ్ఞానానికి విరోధంగా
  rationale: κατά యొక్క వ్యతిరేకతను స్పష్టంగా తెలియజేస్తూ, సందర్భంలో γνῶσις τοῦ θεοῦను దేవుని గురించిన లేదా దేవునితో సంబంధమైన జ్ఞానంగా సహజంగా అందిస్తుంది.
- source_word: αἰχμαλωτίζοντες
  choice: బందీగా తీసుకుంటూ
  rationale: యుద్ధంలో చెరపట్టే సజీవమైన సైనిక రూపకాన్ని నిలుపుతుంది.
- source_word: πᾶν νόημα
  choice: ప్రతి ఆలోచననూ
  rationale: νόημαకు ఇక్కడ సహజమైన సాధారణ అర్థం ‘ఆలోచన’; πᾶν యొక్క పంపిణీ భావాన్ని ‘ప్రతి’ తెలియజేస్తుంది.
- source_word: εἰς τὴν ὑπακοὴν
  choice: విధేయత చూపేలా
  rationale: εἰς సూచించే గమ్యం లేదా ఫలితస్థితిని సహజ తెలుగు వాక్యనిర్మాణంలో వ్యక్తపరుస్తుంది; అక్షరార్థమైన ‘విధేయతలోకి’ కంటే సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయకు
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని ‘మెస్సీయ’గా అందిస్తుంది; సంబంధవిభక్తిని విధేయత ఎవరికి చూపబడుతుందో తెలిపే దత్తివిభక్తిగా తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయకు
  alternative: క్రీస్తుకు
  rationale: ఈ సందర్భంలో Χριστόςను పేరులో భాగంగా కాక బిరుదుగా గ్రహించి, బిరుదు యొక్క అర్థాన్ని అనువదించాం; సంప్రదాయ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- issue: πᾶν ὕψωμα ἐπαιρόμενον సూచించే వ్యతిరేకత స్వభావం
  choice: దేవుని గురించిన జ్ఞానానికి ఎదురు నిలిచే ఏ ఉన్నతమైనదైనా అనే విస్తృత రూపకం
  alternative: తన్నుతాను హెచ్చించుకునే ప్రతి అహంకారపూరిత వాదన
  rationale: గ్రీకు పదబంధం విస్తృతమైన ఎత్తైన-అడ్డంకి రూపకాన్ని కలిగి ఉంది. దానిని కేవలం మానసిక అహంకారంగా లేదా వాదనగా కుదించకుండా అసలు అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. వాక్యం ముందున్న సందర్భంతో కొనసాగే కృదంత నిర్మాణం కావడంతో చివర ‘తీసుకుంటూ’ అని ఉంచాం. సైనిక రూపకాన్ని ‘బందీగా తీసుకుంటూ’ ద్వారా నిలిపాం; ὕψωμα యొక్క విస్తృత రూపకాన్ని అతిగా వ్యాఖ్యానించలేదు.
