  text: τὰ γὰρ ὅπλα τῆς στρατείας ἡμῶν οὐ σαρκικὰ ἀλλὰ δυνατὰ τῷ θεῷ πρὸς καθαίρεσιν ὀχυρωμάτων— λογισμοὺς καθαιροῦντες
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: te
  text: ఎందుకంటే మా పోరాటపు ఆయుధాలు శరీరసంబంధమైనవి కావు[a]; అవి కోటలను కూల్చివేయడానికి దేవుని ఎదుట శక్తిమంతమైనవి[b]—మేము వాదనలను[c] కూల్చివేస్తున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శరీరానికి చెందినవి కావు’; సందర్భానుసారం, ‘కేవలం మానవమైనవి కావు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవునివలన శక్తిమంతమైనవి’ లేదా ‘దైవికంగా శక్తిమంతమైనవి.’
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘తర్కాలను,’ ‘ఆలోచనా పద్ధతులను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: ఆయుధాలు
  rationale: సైనిక రూపకాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: στρατείας
  choice: యుద్ధం
  rationale: కొనసాగుతున్న సైనిక పోరాటం అనే రూపకాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: σαρκικὰ
  choice: శరీరసంబంధమైనవి
  rationale: కేవలం మానవమైన సాధనాల భావాన్ని సూచిస్తూనే, σάρξతో ఉన్న పౌలు పదసంబంధాన్ని నిలుపుతుంది; దాన్ని నేరుగా ‘పాపభరితమైనవి’ అని పరిమితం చేయదు.
- source_word: δυνατὰ τῷ θεῷ
  choice: దేవుని ఎదుట శక్తిమంతమైనవి
  rationale: τῷ θεῷలోని సంక్షిప్తమైన, బహువిధంగా అర్థమయ్యే దత్తివును మూలానికి దగ్గరగా ఉంచుతుంది; దేవునివలన అనే సాధనార్థాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చదు.
- source_word: καθαίρεσιν
  choice: కూల్చివేయడానికి
  rationale: ముట్టడి లేదా కోట కూల్చివేత దృశ్యాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὀχυρωμάτων
  choice: కోటలను
  rationale: బలపరచబడిన రక్షణ స్థావరాల సైనిక రూపకాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: λογισμοὺς
  choice: వాదనలను
  rationale: తరువాతి వచనంలో దేవుని జ్ఞానానికి ఎదిరించే తర్కాల సందర్భానికి సరిపోతుంది; కేవలం తటస్థమైన ఆలోచనలు అనే భావాన్ని నివారిస్తుంది.
- source_word: καθαιροῦντες
  choice: కూల్చివేస్తున్నాం
  rationale: καθαίρεσινతో ఉన్న పదబంధ సంబంధాన్ని పునరుక్తి ద్వారా నిలుపుతూ, ‘మేము’ అనే అంతర్నిహిత కర్తను తెలుగులో స్పష్టం చేస్తుంది.
theological_decisions:
- issue: σαρκικὰలో మానవ సాధనాలు–దైవిక శక్తి మధ్య వ్యత్యాసం
  choice: శరీరసంబంధమైనవి
  alternative: మానవ సంబంధమైనవి; లోకసంబంధమైనవి
  rationale: పౌలు వాడిన ‘శరీరం’ అనే వేదాంతపరమైన పదస్వరాన్ని నిలుపుతూ, దాని అర్థాన్ని నైతిక పాపత్వానికి మాత్రమే పరిమితం చేయదు.
- issue: δυνατὰ τῷ θεῷలో τῷ θεῷ యొక్క భావం
  choice: దేవుని ఎదుట శక్తిమంతమైనవి
  alternative: దేవునివలన శక్తిమంతమైనవి; దైవికంగా శక్తిమంతమైనవి
  rationale: గ్రీకు దత్తివు దేవుని ఎదుట/దృష్టిలో, దేవునివలన, లేదా దైవిక శక్తితో అనే భావాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠ్యం మూల నిర్మాణానికి దగ్గరగా ఉండగా, ఇతర సాధ్యార్థాలను పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. సైనిక రూపకంలోని ‘ఆయుధాలు–యుద్ధం–కోటలు–కూల్చివేత’ అనే అనుసంధానాన్ని నిలిపాం. మూల పాఠ్యంలో 10:5 ప్రారంభానికి వ్యాకరణపరంగా కొనసాగే λογισμοὺς καθαιροῦντες భాగం ఇచ్చినందున, దానినీ డాష్ తరువాత అనువదించాం.
