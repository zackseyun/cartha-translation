id: 2CO.10.11
reference: 2 Corinthians 10:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: te
  text: 'అలాంటి వ్యక్తి దీన్ని పరిగణనలోకి తీసుకోవాలి: మేము దూరంగా ఉన్నప్పుడు ఉత్తరాల ద్వారా మాటల్లో ఎలా ఉంటామో, ప్రత్యక్షంగా ఉన్నప్పుడు చేతల్లో కూడా అలాగే ఉంటాము.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογιζέσθω
  choice: గుర్తుంచుకోవాలి
  rationale: మూడవ పురుష ఏకవచన ఆజ్ఞార్థక రూపంలోని ఆలోచించి పరిగణనలోకి తీసుకోవాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ τοιοῦτος
  choice: అలాంటి వ్యక్తి
  rationale: ముందు ప్రస్తావించిన విమర్శకుడి వంటి వ్యక్తిని సూచించే ఏకవచన భావాన్ని స్పష్టంగా, సహజంగా నిలుపుతుంది.
- source_word: οἷοί ἐσμεν ... τοιοῦτοι
  choice: ఎలా ఉంటామో ... అలాగే ఉంటాము
  rationale: గ్రీకులోని గుణం లేదా స్వభావాన్ని పోల్చే సహసంబంధ నిర్మాణాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో కాపాడుతుంది.
- source_word: τῷ λόγῳ
  choice: మాటల్లో
  rationale: గౌరవార్థక దత్తివిభక్తి భావాన్ని, τῷ ἔργῳతో ఉన్న సంక్షిప్త అలంకారిక వ్యత్యాసాన్ని తెలియజేస్తుంది.
- source_word: δι’ ἐπιστολῶν
  choice: ఉత్తరాల ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సూచించే సాధన లేదా మాధ్యమ భావాన్ని నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἀπόντες
  choice: దూరంగా ఉన్నప్పుడు
  rationale: పరిస్థితిని సూచించే వర్తమాన కృదంతాన్ని, παρόντεςతో ఉన్న వ్యత్యాసంతో సహజంగా అందిస్తుంది.
- source_word: παρόντες
  choice: మీ దగ్గర ఉన్నప్పుడు
  rationale: సందర్భంలో పౌలు మరియు అతని సహచరులు కొరింథీయుల సమక్షంలో ఉండడాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది; ‘మీ’ అనేది సందర్భానుగుణంగా అంతర్లీనమైనది.
- source_word: τῷ ἔργῳ
  choice: చేతల్లో
  rationale: ‘మాటల్లో—చేతల్లో’ అనే సహజమైన తెలుగు వ్యత్యాసంతో కార్యాచరణ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పౌలు ఉత్తరాల్లోని మాటలకు, ప్రత్యక్షంగా ఉన్నప్పటి కార్యాచరణకు మధ్య సంబంధం
  choice: దూరంగా ఉండి ఉత్తరాల్లో చూపిన దృఢత్వం, దగ్గర ఉన్నప్పుడు చేతల్లోనూ అలాగే ఉంటుందని ప్రత్యక్ష పోలికగా అనువదించడం
  alternative: భవిష్యత్తు చర్య గురించిన స్పష్టమైన బెదిరింపుగా మరింత స్వేచ్ఛగా అనువదించడం
  rationale: గ్రీకు పాఠం మాట మరియు కార్యం, దూరం మరియు సమక్షం మధ్య నేరుగా పోలిక చేస్తుంది. హెచ్చరిక స్వరాన్ని నిలుపుతూ, మూలంలో లేని ప్రత్యేక సిద్ధాంతార్థాన్ని లేదా విస్తరించిన బెదిరింపును చేర్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన ధోరణితో. ‘మాటల్లో ... చేతల్లో’ అనే జత మూలంలోని λόγῳ ... ἔργῳ వ్యత్యాసాన్ని సహజంగా నిలుపుతుంది.
