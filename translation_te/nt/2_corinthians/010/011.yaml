revisions:
- from: 'అలాంటి వ్యక్తి ఈ విషయం గుర్తుంచుకోవాలి: మేము దూరంగా ఉన్నప్పుడు ఉత్తరాల ద్వారా మాటల్లో ఎలా ఉంటామో, మీ దగ్గర ఉన్నప్పుడు చేతల్లో కూడా అలాగే ఉంటాము.'
  to: 'అలాంటి వ్యక్తి దీన్ని పరిగణనలోకి తీసుకోవాలి: మేము దూరంగా ఉన్నప్పుడు ఉత్తరాల ద్వారా మాటల్లో ఎలా ఉంటామో, ప్రత్యక్షంగా ఉన్నప్పుడు చేతల్లో కూడా అలాగే ఉంటాము.'
  rationale: The revision corrects the force of λογιζέσθω and removes the contextually plausible but unstated “your presence.” It retains the source’s parallel structure, the warning-like assertion, and the natural Telugu contrast between words and deeds.
  reviewer_model: gpt-5.6-terra
