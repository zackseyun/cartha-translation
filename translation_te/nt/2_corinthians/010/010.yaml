id: 2CO.10.10
reference: 2 Corinthians 10:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: te
  text: ఎందుకంటే, “అతని ఉత్తరాలు గంభీరమైనవి, బలమైనవి; కానీ అతని శారీరక సాన్నిధ్యం బలహీనమైనది, అతని మాట తృణీకరించబడుతోంది[b]” అని వారు అంటున్నారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘అని అతడు అంటున్నాడు.’ గ్రీకు φησίν అనే పదం ఏకవచనంలో ఉంది; అయితే అది ఇక్కడ ఉటంకింపును పరిచయం చేసే మధ్యవాక్య సూత్రంగా ఉండవచ్చు. సందర్భంలో ఇది పౌలు విమర్శకుల అభిప్రాయం.'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: ‘అతని మాట చులకనగా చూడబడుతోంది’ లేదా ‘లెక్కలోకి తీసుకోబడడం లేదు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో చెప్పిన విషయానికి కారణంగా లేదా వివరణగా విమర్శకుల మాటలను పరిచయం చేస్తుంది.
- source_word: ἐπιστολαὶ
  choice: ఉత్తరాలు
  rationale: సాధారణ లిఖిత పత్రవ్యవహారాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: μέν ... δὲ
  choice: '...; కానీ ...'
  rationale: పౌలు ఉత్తరాలకూ ఆయన ప్రత్యక్ష సాన్నిధ్యానికీ మధ్యనున్న వ్యత్యాసాన్ని సహజమైన తెలుగులో స్పష్టంగా చూపిస్తుంది.
- source_word: φησίν
  choice: వారు అంటున్నారు
  rationale: గ్రీకులో రూపం ఏకవచనమైనప్పటికీ, ఇది విమర్శకుల అభిప్రాయాన్ని ఉదహరించే మధ్యవాక్య సూత్రంగా పనిచేయవచ్చు. సందర్భంలోని సమూహ విమర్శను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; ఏకవచన రూపాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: βαρεῖαι
  choice: గంభీరమైనవి
  rationale: అక్షరార్థమైన ‘బరువైనవి’ అనే రూపకంలోని తీవ్రతను, ఉత్తరాల ప్రభావం మరియు ప్రాముఖ్యతను అతిగా వివరించకుండా సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἰσχυραί
  choice: బలమైనవి
  rationale: ఉత్తరాల శక్తిని నేరుగా తెలియజేసి ‘గంభీరమైనవి’తో సహజంగా జతకడుతుంది.
- source_word: παρουσία τοῦ σώματος
  choice: అతడు శరీరంతో ప్రత్యక్షంగా ఉన్నప్పుడు
  rationale: ఉత్తరాలకు భిన్నంగా పౌలు వ్యక్తిగతంగా, శారీరకంగా ఎదురుగా ఉండడాన్ని సహజ తెలుగులో వ్యక్తపరుస్తూ σώματος సూచనను నిలుపుతుంది.
- source_word: ἀσθενὴς
  choice: బలహీనంగా ఉంటాడు
  rationale: విమర్శకులు పేర్కొన్న బలహీనత స్వభావాన్ని అదనంగా నిర్వచించకుండా మూలపదానికి నేరమైన సమానార్థాన్ని ఇస్తుంది.
- source_word: λόγος
  choice: మాట
  rationale: ఇక్కడ లిఖిత ఉత్తరాలకు వ్యతిరేకంగా పౌలు మౌఖికంగా మాట్లాడడాన్ని సూచిస్తుంది. ‘మాట’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: ἐξουθενημένος
  choice: తృణీకరించబడుతోంది
  rationale: ఇతరులు అతని మాటను విలువలేనిదిగా చూస్తున్నారనే నిష్క్రియ భావాన్ని నిలుపుతుంది; అది స్వతహాగా విలువలేనిదని అనువాదకుడు తీర్పు ఇవ్వదు.
theological_decisions:
- issue: పౌలు గురించి చెప్పిన విమర్శను కథకుని సమర్థనగా చూపకూడదు
  choice: విమర్శకుల ఉటంకింపుగా ‘అని వారు అంటున్నారు’ అని అనువదించడం
  alternative: ‘అని అతడు అంటున్నాడు’ లేదా ‘అని చెప్పబడుతోంది’
  rationale: ఈ మాటలు పౌలు నిజంగా బలహీనుడనీ ఆయన మాట విలువలేనిదనీ గ్రంథకర్త తీర్పు చెప్పడం కాదు; ఆయన విమర్శకుల అభిప్రాయాన్ని నివేదిస్తున్నాయి. అదే సమయంలో గ్రీకు ఏకవచన రూపాన్ని పాదసూచిక తెలియజేస్తుంది.
- issue: ἐξουθενημένοςలోని విలువతగ్గింపు ఎవరి దృష్టిలోనిదో
  choice: ‘తృణీకరించబడుతోంది’ అనే నిష్క్రియ రూపం
  alternative: ‘తృణీకరించదగినది’ లేదా ‘విలువలేనిది’
  rationale: నిష్క్రియ రూపం విమర్శకుల వ్యవహారాన్ని తెలియజేస్తుంది; పౌలు మాట అంతర్గతంగా నీచమైనదని అనువాదం నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘శరీరంతో ప్రత్యక్షంగా’ అన్నది παρουσία τοῦ σώματοςను కృత్రిమమైన పదక్షర రూపంలో కాకుండా స్పష్టంగా అందిస్తుంది. ఉటంకింపులోని విమర్శను విమర్శగానే నిలిపి, అనువాదకుని తీర్పుగా మార్చలేదు. ప్రధాన పాఠ్యంలో [a], [b] గుర్తులు రెండూ సంబంధిత స్థానాల్లో ఉన్నాయి.
