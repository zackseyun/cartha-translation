- from: ఎందుకంటే, “అతని ఉత్తరాలు గంభీరమైనవి, బలమైనవి; కానీ అతడు శరీరంతో ప్రత్యక్షంగా ఉన్నప్పుడు బలహీనంగా ఉంటాడు, అతని మాట తృణీకరించబడుతోంది[b]” అని వారు అంటున్నారు[a].
  to: ఎందుకంటే, “అతని ఉత్తరాలు గంభీరమైనవి, బలమైనవి; కానీ అతని శారీరక సాన్నిధ్యం బలహీనమైనది, అతని మాట తృణీకరించబడుతోంది[b]” అని వారు అంటున్నారు[a].
