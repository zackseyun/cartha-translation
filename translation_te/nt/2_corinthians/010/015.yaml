revisions:
- from: ఇతరుల కష్టఫలాన్ని బట్టి హద్దులు దాటి గొప్పలు చెప్పుకోకుండా, మీ విశ్వాసం పెరుగుతున్నకొద్దీ, మాకు కేటాయించబడిన సేవాపరిధి ప్రకారం మీ మధ్య మా పని మరింత విస్తరించాలని[a] మేము ఆశిస్తున్నాం—అది ఇంకా ఎంతో విస్తరించాలి[b].
  to: ఇతరుల శ్రమలలో హద్దులు దాటి గొప్పలు చెప్పుకోకుండా, మీ విశ్వాసం పెరుగుతున్నకొద్దీ, మా సేవాపరిధి ప్రకారం మీ మధ్య మా సేవ మరింతగా విస్తరించాలని, ఇంకా విస్తారంగా ఉండాలని మేము ఆశిస్తున్నాం.[a][b]
  rationale: The revision renders ἐν ἀλλοτρίοις κόποις as ‘in others’ labors,’ retains the continuous relation of the hope clause, and expresses εἰς περισσείαν as further extent rather than as an added ‘should’ clause. “సేవాపరిధి” communicates the contextual sense of κανών naturally, while the footnote preserves the more literal alternatives and the ambiguity of μεγαλυνθῆναι.
