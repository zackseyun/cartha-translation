source:
  edition: SBLGNT
  text: οὐκ εἰς τὰ ἄμετρα καυχώμενοι ἐν ἀλλοτρίοις κόποις, ἐλπίδα δὲ ἔχοντες αὐξανομένης τῆς πίστεως ὑμῶν ἐν ὑμῖν μεγαλυνθῆναι κατὰ τὸν κανόνα ἡμῶν εἰς περισσείαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/015.yaml
  text: not boasting beyond measure in the labors of others, but having hope that, as your faith is growing among you, we will be enlarged according to our sphere of ministry, unto abundance,
translation:
  language: te
  text: ఇతరుల శ్రమలలో హద్దులు దాటి గొప్పలు చెప్పుకోకుండా, మీ విశ్వాసం పెరుగుతున్నకొద్దీ, మా సేవాపరిధి ప్రకారం మీ మధ్య మా సేవ మరింతగా విస్తరించాలని, ఇంకా విస్తారంగా ఉండాలని మేము ఆశిస్తున్నాం.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా కొలత ప్రకారం మీ మధ్య మేము మరింత ఘనపరచబడాలని.” “కొలత”కు “ప్రమాణం” లేదా “కార్యపరిధి” అనే అర్థాలూ సాధ్యమే; సందర్భంలో ఇది పౌలు అపొస్తల సేవ యొక్క పరిధిని సూచిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, “మరింత అధికంగా” లేదా “ఇంకా విస్తృతంగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: హద్దులు దాటి గొప్పలు చెప్పుకోకుండా
  rationale: కొలత లేదా పరిమితి అనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో ఉంచి, తగిన పరిధిని మించి అతిశయించడాన్ని సూచిస్తుంది.
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: ఇతరుల కష్టఫలాన్ని బట్టి
  rationale: κόποις అనేది శ్రమను సూచిస్తుంది; సందర్భంలో ఇతరులు చేసిన పనికి తానే ఘనత పొందడమే ఉద్దేశం. ‘కష్టఫలం’ ఆ భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: ἐλπίδα δὲ ἔχοντες
  choice: మేము ఆశిస్తున్నాం
  rationale: గ్రీకు నామవాచక నిర్మాణాన్ని తెలుగులో సహజమైన క్రియారూపంగా వ్యక్తపరుస్తుంది.
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: మీ విశ్వాసం పెరుగుతున్నకొద్దీ
  rationale: జనిటివ్ అబ్సల్యూట్ నిర్మాణంలోని సమాంతర పురోగతి భావాన్ని సహజంగా తెలియజేస్తుంది; πίστις కు ‘విశ్వాసం’ అనే సాధారణ అర్థాన్ని నిలుపుతుంది.
- source_word: ἐν ὑμῖν μεγαλυνθῆναι
  choice: మీ మధ్య మా పని మరింత విస్తరించాలని
  rationale: ἐν ὑμῖν ను ‘మీ మధ్య’గా ఉంచుతుంది. μεγαλυνθῆναι యొక్క పెంపు/విస్తరణ రూపకాన్ని నిలుపుతూ, సందర్భానుసారం విస్తరించేది పౌలు అపొస్తల సేవాపనేనని తెలియజేస్తుంది; వ్యక్తిగత మహిమగా అపార్థం కాకుండా చేస్తుంది.
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: మాకు కేటాయించబడిన సేవాపరిధి ప్రకారం
  rationale: κανών ఇక్కడ నియమగ్రంథం లేదా సిద్ధాంత ప్రమాణం కాదు; దేవుడు కొలిచి అప్పగించిన కార్యక్షేత్రాన్ని సూచిస్తుంది. ‘కేటాయించబడిన సేవాపరిధి’ సందర్భార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: εἰς περισσείαν
  choice: అది ఇంకా ఎంతో విస్తరించాలి
  rationale: εἰς లోని దిశాభావాన్ని, περισσεία లోని అధిక విస్తరణ భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: μεγαλυνθῆναι అపొస్తల అధికారంతో గల సంబంధం
  choice: పౌలు వ్యక్తిగతంగా గొప్పవాడిగా కీర్తించబడటం కాక, అతని అపొస్తల సేవ మీ మధ్య మరింత విస్తరించడం
  alternative: కొరింథీయులు పౌలును మరింత ఘనపరచడం లేదా అతని పేరు ప్రతిష్ఠ పెరగడం
  rationale: 10:13–16 సందర్భం ఇతరుల శ్రమలో గొప్పలు చెప్పుకోక, దేవుడు కేటాయించిన కార్యపరిధిలో సేవ విస్తరించడం గురించి మాట్లాడుతుంది.
- issue: κανών యొక్క అర్థం
  choice: కేటాయించబడిన సేవాపరిధి
  alternative: నియమం, ప్రమాణం, లేదా కొలత
  rationale: ఇక్కడ ఈ పదం పౌలు అపొస్తల సేవకు దేవుడు కొలిచి ఇచ్చిన కార్యక్షేత్రాన్ని సూచిస్తుంది; తరువాతి కాలపు ‘కానన్’ భావాన్ని దిగుమతి చేయరాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని దీర్ఘ ప్రవాహాన్ని నిలుపుతూ, చివరి εἰς περισσείαν భావాన్ని సహజంగా స్పష్టం చేయడానికి డాష్ ఉపయోగించబడింది.
