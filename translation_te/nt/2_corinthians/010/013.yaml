id: 2CO.10.13
reference: 2 Corinthians 10:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ⸀οὐκ εἰς τὰ ἄμετρα καυχησόμεθα, ἀλλὰ κατὰ τὸ μέτρον τοῦ κανόνος οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου, ἐφικέσθαι ἄχρι καὶ ὑμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: te
  text: అయితే మేము హద్దులు మీరి గొప్పలు చెప్పుకోము; దేవుడు మాకు కేటాయించిన పరిధి[a] కొలత ప్రకారమే గొప్పలు చెప్పుకుంటాము—ఆ కొలత మీ వరకు కూడా చేరుతుంది—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘కొలమానం,’ ‘ప్రమాణం.’ గ్రీకు పదం కొలిచే కర్రను, ప్రమాణాన్ని, లేదా కేటాయించబడిన కార్యపరిధిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄμετρα
  choice: హద్దులు మీరి
  rationale: ఈ సందర్భంలో తగిన పరిమితులను అతిక్రమించడాన్ని సూచిస్తుంది. సహజమైన తెలుగులో పరిమితి భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: καυχησόμεθα
  choice: గొప్పలు చెప్పుకుంటాము
  rationale: పౌలు తన సేవా పరిధికి మించి ఘనతను తనకు ఆపాదించుకోవడం గురించి మాట్లాడుతున్నాడు; ఈ తెలుగు ప్రయోగం వాదనాత్మక సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: κατὰ τὸ μέτρον
  choice: కొలత ప్రకారమే
  rationale: అప్పగించబడిన పరిమితికి అనుగుణంగా అనే భావాన్ని ఇస్తూ, మూలంలోని కొలత రూపకాన్ని నిలుపుతుంది.
- source_word: κανόνος
  choice: పరిధి
  rationale: ఇక్కడ ఈ పదం ప్రధానంగా నైతిక నియమాన్ని కాక, దేవుడు కేటాయించిన సేవా క్షేత్రాన్ని లేదా విస్తృతిని సూచిస్తుంది.
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: దేవుడు మాకు కేటాయించిన
  rationale: μερίζω ఇక్కడ ఒక భాగాన్ని లేదా సేవా పరిధిని పంచి అప్పగించడాన్ని సూచిస్తుంది; ‘కేటాయించిన’ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: μέτρου
  choice: ఆ కొలత
  rationale: మూలంలో μέτρον పదం పునరావృతమైనందున, భావాన్ని స్పష్టపరుస్తూనే ఆ పునరావృతిని నిలిపింది.
- source_word: ἐφικέσθαι
  choice: చేరుతుంది
  rationale: దేవుడు కేటాయించిన కొలత ఎంతవరకు విస్తరిస్తుందో తెలిపే స్థలవిస్తృతి భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἄχρι καὶ ὑμῶν
  choice: మీ వరకు కూడా
  rationale: ἄχρι యొక్క విస్తృతి భావాన్ని, καί ఇచ్చే ప్రత్యేక చేర్పు ఉద్ఘాటనను రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: పౌలు సేవా హక్కుదావాలో κανών అర్థం
  choice: కొరింథీయులను కూడా చేర్చే, దేవుడు కేటాయించిన సేవా పరిధి
  alternative: పౌలు తన గొప్పలుచెప్పుకోవడాన్ని కొలిచే నియమం లేదా ప్రమాణం
  rationale: తక్షణ సందర్భంలో హద్దు, కొలత, చేరే విస్తృతి అనే స్థలరూపకం ప్రధానంగా ఉంది. అయినా ‘ప్రమాణం’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కొలత’ పదపునరావృతిని మూలంలోని రూపక సంబంధాన్ని కాపాడేందుకు ఉద్దేశపూర్వకంగా నిలిపాం; చివరి దీర్ఘగీత తరువాతి వాక్యంతో కొనసాగే నిర్మాణాన్ని సూచిస్తుంది.
