  source_fidelity: అనువాదం గ్రీకు వాక్యనిర్మాణం మరియు ప్రధాన పదచిత్రాలను విశ్వసనీయంగా ప్రతిబింబిస్తుంది. “హద్దులు మీరి” εἰς τὰ ἄμετρα భావాన్ని, “గొప్పలు చెప్పుకుంటాము” καυχησόμεθα భావాన్ని, “దేవుడు మాకు కేటాయించిన పరిధి కొలత ప్రకారమే” దేవునిచే అప్పగించబడిన κανών/μέτρον భావాన్ని సరిగ్గా అందిస్తుంది. “మీ వరకు కూడా చేరుతుంది” ἐφικέσθαι ἄχρι καὶ ὑμῶν లోని విస్తృతి, ఉద్ఘాటన రెండింటినీ నిలుపుతుంది.
