id: 2CO.10.14
reference: 2 Corinthians 10:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: te
  text: మేము మీ వరకు చేరనే లేనట్టుగా, మా పరిధిని మించి విస్తరించుకోవడం లేదు. ఎందుకంటే మెస్సీయ సువార్తతో మేము మీ వరకు కూడా వచ్చాము—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: మా హద్దులు దాటి విస్తరించుకోవడం లేదు
  rationale: హద్దుకు మించి తనను తాను చాచుకోవడం అనే గ్రీకు రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; సందర్భంలోని పరిధి భావాన్ని కూడా తెలియజేస్తుంది.
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: మేము మీ వరకు చేరనే లేనట్టుగా
  rationale: ఇది వాస్తవాన్ని చెప్పడం కాక, హద్దుమీరి సాగుతున్నామనే ఊహాత్మక పరిస్థితిని సూచిస్తుంది. ‘చేరనే’ అనే ప్రయోగం నిరాకరణలోని బలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν
  choice: ఎందుకంటే ... మేము మీ వరకు కూడా వచ్చాము
  rationale: ἐφθάσαμεν యొక్క పూర్తయిన రాక భావాన్ని ‘వచ్చాము’ తెలియజేస్తుంది; καί లోని ఉద్ఘాటనను ‘కూడా’ నిలుపుతుంది.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: సువార్తతో
  rationale: ἐν ఇక్కడ సువార్త సేవతో కూడిన రాకను లేదా దాని ద్వారా జరిగిన చేరికను సూచించవచ్చు. ‘సువార్తతో’ ఈ సంబంధాన్ని సంక్షిప్తంగా, సహజంగా ఉంచుతుంది.
- source_word: τοῦ Χριστοῦ
  choice: క్రీస్తు
  rationale: తెలుగులో Χριστός కు స్థిరపడి, విస్తృతంగా అర్థమయ్యే రూపం ‘క్రీస్తు’; దాని ‘మెస్సీయ’ అనే బిరుదు భావాన్ని పాదసూచికలో సూచించాం.
theological_decisions:
- issue: τοῦ Χριστοῦ లో Χριστός ను ఎలా అనువదించాలి
  choice: క్రీస్తు
  alternative: మెస్సీయ
  rationale: ‘క్రీస్తు సువార్త’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజమైనది, స్పష్టమైనది. అయినా Χριστός మూలంగా ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు కాబట్టి ఆ అర్థాన్ని పాదసూచికలో నిలిపాం.
- issue: ἐν τῷ εὐαγγελίῳ యొక్క సంబంధ భావం
  choice: సువార్తతో
  alternative: సువార్తలో / సువార్త ద్వారా
  rationale: గ్రీకు పదబంధం సాధనం, సహవాసం లేదా సేవా పరిధిని సూచించగలదు. ప్రధాన పాఠంలోని ‘తో’ ఈ భావాలను అనవసరంగా ఒకదానికే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. గ్రీకు వాక్యంలోని ‘హద్దుకు మించి చాచుకోవడం’ అనే రూపకాన్ని ‘హద్దులు దాటి విస్తరించుకోవడం’గా నిలిపి, καί ఉద్ఘాటనను ‘కూడా’తో వ్యక్తం చేశాం. చివరి దీర్ఘ విరామచిహ్నం తరువాతి వచనంతో వాక్య సంబంధాన్ని సూచిస్తుంది.
