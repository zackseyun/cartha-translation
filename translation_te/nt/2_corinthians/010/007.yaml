id: 2CO.10.7
reference: 2 Corinthians 10:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: te
  text: 'మీరు పైకి కనిపించే వాటిని చూస్తున్నారు.[a] ఎవరైనా తాను మెస్సీయకు చెందినవాడినని నిశ్చయంగా భావిస్తే, అతడు ఈ విషయాన్ని మళ్లీ తనలో తాను ఆలోచించుకోవాలి: తాను మెస్సీయకు చెందినవాడైనట్లే మేము కూడా మెస్సీయకు చెందినవారమని.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “మీరు బాహ్యరూపాన్ని బట్టి ఉన్న వాటిని చూస్తున్నారు.” దీన్ని “మీ కళ్లముందున్నదాన్ని చూడండి” అనే ఆజ్ఞగా కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_and_grammatical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా, “అతడు మెస్సీయకు చెందినవాడైనట్లే మేము కూడా.” ఇక్కడ ‘మెస్సీయకు చెందినవాడు’ అనేది మెస్సీయతో చెందినతనాన్ని లేదా అనుబంధాన్ని సూచిస్తుంది.
    reason: literal_rendering
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: పైకి కనిపించేవాటినే
  rationale: κατὰ πρόσωπον అనే పదబంధం ఇక్కడ బాహ్యంగా లేదా ఉపరితలంపై కనిపించేదాన్ని సూచిస్తుంది. ఈ భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: βλέπετε
  choice: మీరు ... చూస్తున్నారు
  rationale: ఈ రూపాన్ని సూచనార్థకంగానూ ఆజ్ఞార్థకంగానూ అర్థం చేసుకోవచ్చు. సందర్భంలోని పౌలు గద్దింపు దృష్ట్యా, కొరింథీయులు బాహ్య రూపాన్ని బట్టి అంచనా వేస్తున్నారని చెప్పే సూచనార్థక భావాన్ని ప్రధాన పాఠంలో ఉంచాం.
- source_word: πέποιθεν ἑαυτῷ
  choice: తనలో తాను నమ్మకంగా ఉంటే
  rationale: Perfect రూపం స్థిరపడిన నమ్మకాన్ని సూచిస్తుంది; ἑαυτῷ ఆ నమ్మకం తన గురించే ఉన్నదని తెలియజేస్తుంది.
- source_word: Χριστοῦ εἶναι
  choice: మెస్సీయకు చెందినవాడు
  rationale: Genitive‌తో కూడిన εἶναι చెందినతనాన్ని లేదా అనుబంధాన్ని సూచిస్తుంది. Χριστόςను ఇక్కడ బిరుదుగా గుర్తించి ‘మెస్సీయ’ అని అనువదించాం.
- source_word: λογιζέσθω πάλιν
  choice: మరొకసారి ... ఆలోచించుకోవాలి
  rationale: ఆజ్ఞార్థక రూపం పునరాలోచనకు పిలుస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘ఆలోచించుకోవాలి’ సహజంగా ఆ బలాన్ని అందిస్తుంది.
- source_word: ἐφ’ ἑαυτοῦ
  choice: తనలో తాను
  rationale: ఇక్కడ ఈ పదబంధం తన మనస్సులో లేదా తనంతట తాను పరిగణించడాన్ని సూచించే అవకాశం ఉంది; ప్రధాన పాఠం అంతరంగ పునరాలోచన భావాన్ని ఇస్తుంది.
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: తాను మెస్సీయకు చెందినవాడైనట్లే మేము కూడా మెస్సీయకు చెందినవారమని
  rationale: గ్రీకులో రెండవ భాగంలో ఉన్న ellipsis‌ను తెలుగులో స్పష్టంగా పూరించి, అవతలి వ్యక్తి వలె పౌలు మరియు అతని సహచరులు కూడా మెస్సీయకు చెందినవారనే సమాన వాదనను నిలిపాం.
theological_decisions:
- issue: Χριστοῦ అనే పదం అనువాదం
  choice: మెస్సీయకు
  alternative: క్రీస్తుకు
  rationale: Χριστός ఇక్కడ అభిషిక్తుని బిరుదుగా పనిచేస్తోంది. కాబట్టి దాని బిరుదు భావాన్ని స్పష్టంగా ఉంచడానికి ‘మెస్సీయ’ను ఎంచుకున్నాం.
- issue: ప్రత్యర్థి చెప్పుకునే చెందినతనం పట్ల పౌలు వైఖరి
  choice: తాను ... చెందినవాడైనట్లే మేము కూడా
  alternative: అతడు నిజంగా చెందినవాడైతే మేము కూడా
  rationale: మూలంలోని καθὼς ... οὕτως పోలికను యథాతథంగా ఉంచి, అవతలి వ్యక్తి వాదనను పౌలు ధృవీకరిస్తున్నాడా లేక వాదన నిమిత్తం స్వీకరిస్తున్నాడా అనే ఉద్రిక్తతను పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘పైకి కనిపించేవాటినే’ గద్దింపు స్వరాన్ని సహజంగా తెలియజేస్తుంది; ‘తనలో తాను’ మూలంలోని రెండు భిన్న పదబంధాల భావసామీప్యాన్ని ప్రతిబింబించినప్పటికీ తెలుగులో ఉద్దేశపూర్వక పునరుక్తిగా నిలుస్తుంది.
