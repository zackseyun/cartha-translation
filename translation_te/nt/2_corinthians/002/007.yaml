source:
  edition: SBLGNT
  text: ὥστε τοὐναντίον ⸀μᾶλλον ὑμᾶς χαρίσασθαι καὶ παρακαλέσαι, μή πως τῇ περισσοτέρᾳ λύπῃ καταποθῇ ὁ τοιοῦτος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/007.yaml
  text: so that[a], on the contrary, you should rather forgive and comfort him[b], so that such a person may not be overwhelmed by excessive sorrow.
translation:
  language: te
  text: కాబట్టి, దీనికి విరుద్ధంగా, మీరు అతనిని క్షమించి ఓదార్చడమే మేలు; లేకపోతే, అలాంటి వ్యక్తి మితిమీరిన దుఃఖం చేత మింగివేయబడిపోవచ్చు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: అక్షరార్థంగా, ‘మింగివేయబడిపోవచ్చు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὐναντίον
  choice: దానికి విరుద్ధంగా
  rationale: మునుపటి క్రమశిక్షణ చర్యకు బదులుగా ఇప్పుడు పునరుద్ధరణ వైపు తిరగాలనే స్పష్టమైన వ్యతిరేకతను నిలుపుతుంది.
- source_word: μᾶλλον
  choice: ఇప్పుడు … చేయాలి
  rationale: τοὐναντίονతో కలిసి ఉన్న తులనాత్మక బలాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో తెలియజేస్తుంది; వేరుగా ‘మరింతగా’ అని పెట్టి కృత్రిమతను కలిగించదు.
- source_word: χαρίσασθαι
  choice: కృపతో క్షమించి
  rationale: ఈ సందర్భంలో ప్రధాన భావం క్షమించడం; ‘కృపతో’ అనే పదం χάριςతో ఉన్న సంబంధాన్ని కూడా వినిపిస్తుంది.
- source_word: παρακαλέσαι
  choice: ఓదార్చాలి
  rationale: దుఃఖంతో ఉన్న వ్యక్తిని తిరిగి స్వీకరించే సందర్భంలో ఆదరణ, సాంత్వన అనే భావం అత్యంత సహజం.
- source_word: καταποθῇ
  choice: మునిగిపోవచ్చు
  rationale: ‘మింగివేయబడడం’ అనే మూల రూపకాన్ని తెలుగులో సహజంగా, దుఃఖం చేత పూర్తిగా కమ్మివేయబడే భావంతో అందిస్తుంది.
- source_word: ὁ τοιοῦτος
  choice: అలాంటి వ్యక్తి
  rationale: గ్రీకు పదబంధంలోని సూచనను లింగాన్ని అనవసరంగా ముందుకు తేవకుండా సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: περισσοτέρᾳ λύπῃ
  choice: మితిమీరిన దుఃఖం
  rationale: తట్టుకోలేనంత అధికమైన దుఃఖం అనే సందర్భోచిత భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
