revisions:
- from: కాబట్టి, దానికి విరుద్ధంగా, మీరు అతనిని కృపతో క్షమించి[a], ఓదార్చాలి. లేకపోతే, అలాంటి వ్యక్తి మితిమీరిన దుఃఖంలో మునిగిపోవచ్చు[b].
  to: కాబట్టి, దీనికి విరుద్ధంగా, మీరు అతనిని క్షమించి ఓదార్చడమే మేలు; లేకపోతే, అలాంటి వ్యక్తి మితిమీరిన దుఃఖం చేత మింగివేయబడిపోవచ్చు[b].
  rationale: The revision makes the contrast and preferable course of action signaled by τοὐναντίον μᾶλλον explicit in idiomatic modern Telugu. It renders χαρίσασθαι as ‘క్షమించి,’ while avoiding a redundant footnote, and retains the source image in καταποθῇ. Since the grace-related nuance is no longer marked in the main text, its former footnote anchor is removed rather than retained without an anchor.
