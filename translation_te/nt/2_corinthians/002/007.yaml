  register: ఆధునిక ప్రామాణిక తెలుగు; సంఘ క్రమశిక్షణ తర్వాత క్షమాపణ, ఓదార్పు అవసరాన్ని గౌరవప్రదంగా మరియు సాధారణ పాఠకులకు స్పష్టంగా వ్యక్తం చేసింది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
