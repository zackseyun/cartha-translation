id: 2CO.2.10
reference: 2 Corinthians 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: te
  text: మీరు ఎవరికైనా ఏదైనా క్షమిస్తే, నేనూ అలాగే చేస్తాను. నేను క్షమించినదేదైనా—నేను ఏదైనా క్షమించి ఉంటే—మీ కోసమే మెస్సీయ సన్నిధిలో క్షమించాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαρίζεσθε / κεχάρισμαι
  choice: క్షమిస్తారో / క్షమించి ఉంటే / క్షమించాను
  rationale: χαρίζομαι అనే పదానికి సాధారణంగా ‘దయతో అనుగ్రహించడం’ అనే విస్తృత అర్థం ఉన్నా, ఇక్కడ శిక్షణ మరియు పునరుద్ధరణ సందర్భంలో అపరాధాన్ని విడిచిపెట్టడం ఉద్దేశం; అందువల్ల ‘క్షమించు’ సహజమైనది.
- source_word: ᾧ ... τι
  choice: ఎవరినైనా ఏ విషయంలో
  rationale: దత్తివ సంబంధ సర్వనామం క్షమాపణ పొందే వ్యక్తిని సూచిస్తుంది; అనిర్దిష్టమైన τιతో కలిసి ఉన్న విస్తృత పరిధిని ఈ ప్రయోగం సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: κἀγώ
  choice: నేనూ క్షమిస్తాను
  rationale: ‘నేనూ’ అనే ప్రతిస్పందన భావాన్ని స్పష్టంగా ఉంచుతూ, తెలుగులో అవసరమైన క్రియను పూరించింది.
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: నేను ఏదైనా క్షమించి ఉంటే—అసలు నేను క్షమించినది ఏదైనా ఉంటే—
  rationale: పౌలు ఉద్దేశపూర్వకంగా వాడిన షరతుతో కూడిన, స్వీయ ప్రాధాన్యాన్ని తగ్గించే పునరుక్తిని తొలగించకుండా నిలిపింది.
- source_word: δι’ ὑμᾶς
  choice: మీ కోసమే
  rationale: διά + ద్వితీయా విభక్తి ఇక్కడ కొరింథీయుల మేలు లేదా ప్రయోజనాన్ని సూచిస్తుంది; ‘మీ కోసమే’ ఆ ఉద్ఘాటనను తెలియజేస్తుంది.
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: మెస్సీయ సన్నిధిలో
  rationale: πρόσωπον ముఖం, సన్నిధి లేదా వ్యక్తిని సూచించగలదు. ప్రధాన పాఠంలో ‘సన్నిధిలో’ అనేది మెస్సీయ ఎదుట, ఆయన దృష్టిలో చేసిన కార్యం అనే భావాన్ని సహజంగా ఇస్తుంది; ప్రత్యామ్నాయ భావం పాదసూచికలో నిలిపింది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని అనువదించి ‘మెస్సీయ’గా ఇచ్చింది.
theological_decisions:
- issue: Χριστοῦను సంప్రదాయ నామరూపమైన ‘క్రీస్తు’గా ఉంచాలా, బిరుదైన ‘మెస్సీయ’గా అనువదించాలా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వచనంలో అది వ్యక్తినామంలా తప్పనిసరిగా పనిచేయదు; అభిషిక్తుడనే బిరుదు భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది.
- issue: ἐν προσώπῳ Χριστοῦను మెస్సీయ సన్నిధిగా అర్థం చేసుకోవాలా, ఆయన వ్యక్తి/ప్రతినిధిత్వంతో సంబంధింపజేయాలా
  choice: మెస్సీయ సన్నిధిలో
  alternative: మెస్సీయ వ్యక్తిలో, లేదా మెస్సీయ ప్రతినిధిగా
  rationale: పదబంధం రెండు భావాలకు అవకాశం ఇస్తుంది. సందర్భంలో ఆయన ఎదుట, ఆయన దృష్టిలో క్షమించడం సహజమైన ప్రధాన పఠనం; ప్రతినిధిత్వ భావాన్ని పూర్తిగా నిరాకరించకుండా పాదసూచికలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడింది. గ్రీకు మూలంలోని పునరుక్తి మరియు షరతు భావాన్ని అతిగా సరళీకరించకుండా డాష్‌లతో నిలిపింది.
