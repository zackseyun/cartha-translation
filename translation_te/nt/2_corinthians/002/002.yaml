id: 2CO.2.2
reference: 2 Corinthians 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐγὼ λυπῶ ὑμᾶς, καὶ ⸀τίς ὁ εὐφραίνων με εἰ μὴ ὁ λυπούμενος ἐξ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/002.yaml
  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: te
  text: ఎందుకంటే నేనే మిమ్మల్ని దుఃఖపెడితే, నా వల్ల దుఃఖిస్తున్నవాడు తప్ప నన్ను సంతోషపెట్టేవాడు ఇంకెవరు?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπῶ
  choice: దుఃఖపెడితే
  rationale: ఈ క్రియ ఇతరులకు దుఃఖం కలిగించడాన్ని సూచిస్తుంది. ‘దుఃఖపెడితే’ దాని కారక భావాన్ని సహజమైన ఆధునిక తెలుగులో నేరుగా తెలియజేస్తుంది.
- source_word: εὐφραίνων
  choice: సంతోషపెట్టేవారు
  rationale: పౌలుకు సంతోషం కలిగించే వ్యక్తిని సూచించే కర్తృవాచక కృదంత భావాన్ని ఈ పదబంధం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τίς ὁ εὐφραίνων με
  choice: నన్ను సంతోషపెట్టేవారు ఇంకెవరు?
  rationale: నామవాచకంగా వాడిన కృదంతాన్ని, ప్రశ్నలోని అలంకారిక బలాన్ని తెలుగులో సహజంగా నిలుపుతుంది.
- source_word: ὁ λυπούμενος
  choice: దుఃఖపడుతున్న వ్యక్తి
  rationale: గ్రీకులోని వర్తమాన కర్మణి కృదంత భావాన్ని అనవసరంగా పూర్తయిన చర్యగా మార్చకుండా ప్రతిబింబిస్తుంది.
- source_word: ἐξ ἐμοῦ
  choice: నా వల్ల
  rationale: ἐκ ఇక్కడ మూలం లేదా కారణాన్ని సూచిస్తుంది; ‘నా వల్ల’ సందర్భానికి తగిన సహజమైన తెలుగు, అదే సమయంలో కారణ భావాన్ని కాపాడుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: ἐγώ
  choice: నేనే
  rationale: ప్రత్యేకంగా వ్యక్తమైన గ్రీకు సర్వనామంలోని ఉద్ఘాటనను తెలుగులో ‘నేనే’ నిలుపుతుంది.
theological_decisions:
- issue: ἐξ ἐμοῦ మరియు కర్మణి కృదంతం సూచించే కారణం/కర్త సంబంధం
  choice: నా వల్ల దుఃఖపడుతున్న వ్యక్తి
  alternative: నా చేత దుఃఖపరచబడిన వ్యక్తి
  rationale: మొదటి రూపం గ్రీకు పదబంధంలోని కారణ లేదా మూల భావాన్ని సహజంగా నిలుపుతుంది; ప్రత్యామ్నాయం పౌలును ప్రత్యక్ష కర్తగా మరింత స్పష్టంగా చూపుతుంది. మూలంలోని స్వల్ప విస్తృతిని ప్రధాన పాఠంలో సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం వాడబడింది. ‘నేనే’ ద్వారా ἐγώ ఉద్ఘాటనను, ‘ఇంకెవరు?’ ద్వారా అలంకారిక ప్రశ్న బలాన్ని నిలిపాం.
