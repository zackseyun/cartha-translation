  text: Therefore I urge you to confirm your love for him.
translation:
  language: te
  text: కాబట్టి, అతనిపట్ల మీ ప్రేమను ధృవీకరించమని మిమ్మల్ని వేడుకుంటున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: కాబట్టి
  rationale: ముందటి వాక్యాల ఆధారంగా వచ్చే నిర్ధారణను సహజంగా తెలియజేస్తుంది.
- source_word: παρακαλῶ ὑμᾶς
  choice: మిమ్మల్ని వేడుకుంటున్నాను
  rationale: ఇక్కడ పౌలు అధికారపూర్వక ఆజ్ఞకన్నా హృదయపూర్వక విజ్ఞప్తి చేస్తున్న భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: κυρῶσαι
  choice: నిర్ధారించమని
  rationale: ప్రేమను కేవలం మళ్లీ ప్రకటించడం కాక, దానిని చెల్లుబాటయ్యేలా స్పష్టంగా ధృవీకరించాలనే భావాన్ని నిలుపుతుంది.
- source_word: εἰς αὐτὸν ἀγάπην
  choice: అతనిపట్ల మీ ప్రేమను
  rationale: వ్యక్తివైపు ఉద్దేశించిన ప్రేమను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; సందర్భం వల్ల అంతర్భూతమైన ‘మీ’ని చేర్చడం తెలుగు వాక్యానికి స్పష్టత ఇస్తుంది.
theological_decisions:
- issue: సంఘం ఆ వ్యక్తిని క్షమించి తిరిగి స్వీకరించడంలో ప్రేమను ఎలా చూపాలి
  choice: ప్రేమను నిర్ధారించాలి
  alternative: ప్రేమను మళ్లీ ధృవీకరించాలి
  rationale: κυρόω అనే క్రియలోని అధికారికంగా స్థిరపరచడం లేదా చెల్లుబాటును చూపడం అనే భావాన్ని ఉంచుతూ, ముందుగా ప్రేమ నిలిచిపోయిందని తప్పనిసరిగా సూచించే ‘మళ్లీ’ని మూలంలో లేనందున చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే విజ్ఞప్తి శైలి. మూలంలోని సంక్షిప్తతను కాపాడింది.
