- from: ఎందుకంటే, రక్షణ పొందుతూ ఉన్నవారి మధ్యనూ నశిస్తూ ఉన్నవారి మధ్యనూ మేము దేవునికి మెస్సీయ సువాసనగా ఉన్నాం.[a]
  to: ఎందుకంటే, రక్షణ పొందుతున్నవారి మధ్యలోనూ నశిస్తున్నవారి మధ్యలోనూ మేము దేవునికి మెస్సీయ సువాసనగా ఉన్నాం.[a]
  rationale: The revision makes the two ongoing participial expressions natural in modern standard Telugu and uses the fuller, idiomatic locative ‘మధ్యలోనూ’ in both parallel phrases. It preserves every source-level relation and the draft’s established Messiah/Christ footnote treatment.
