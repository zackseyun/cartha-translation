id: 2CO.2.15
reference: 2 Corinthians 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς σῳζομένοις καὶ ἐν τοῖς ἀπολλυμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: te
  text: ఎందుకంటే, రక్షణ పొందుతున్నవారి మధ్యలోనూ నశిస్తున్నవారి మధ్యలోనూ మేము దేవునికి మెస్సీయ సువాసనగా ఉన్నాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్రీస్తు సువాసనగా.”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదుగా ఉన్న భావాన్ని నిలుపుతూ, షష్ఠీ విభక్తి సంబంధాన్ని ‘మెస్సీయ సువాసన’గా సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: εὐωδία
  choice: సువాసన
  rationale: బలి లేదా ధూప సంబంధమైన నేపథ్యాన్ని ముందుగానే అతిగా వివరించకుండా, ఇంద్రియగ్రాహ్య రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: దత్తి విభక్తిలోని దిశాత్మక లేదా సంబంధ భావాన్ని నేరుగా కాపాడుతుంది.
- source_word: ἐν τοῖς σῳζομένοις
  choice: రక్షణ పొందుతూ ఉన్నవారి మధ్యనూ
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న ప్రక్రియ భావాన్ని ‘పొందుతూ ఉన్న’ ద్వారా నిలుపుతుంది; ἐν ఇక్కడ సమూహం మధ్య అనే భావంలో ఉంది.
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: నశిస్తూ ఉన్నవారి మధ్యనూ
  rationale: వర్తమాన కృదంతంలోని కొనసాగుతున్న ప్రక్రియను నిలుపుతూ, ἀπόλλυμι యొక్క విస్తృతమైన నాశనం/నశింపు భావాన్ని అనవసరంగా కర్తరిగా మార్చదు.
theological_decisions:
- issue: σῳζομένοις మరియు ἀπολλυμένοις లోని కొనసాగుతున్న ప్రక్రియ భావం
  choice: ‘రక్షణ పొందుతూ ఉన్నవారు,’ ‘నశిస్తూ ఉన్నవారు’ అని ప్రక్రియాత్మకంగా అనువదించడం
  alternative: ‘రక్షింపబడినవారు,’ ‘నశించినవారు’ అని పూర్తయిన స్థితులుగా అనువదించడం
  rationale: రెండు వర్తమాన కృదంతాలు తెలియజేసే కొనసాగుతున్న భావాన్ని, అలాగే పౌలు ఉంచిన వేదాంతపరమైన ఉద్వేగాన్ని, పూర్తయిన వర్గాలుగా సమతలపరచకుండా కాపాడుతుంది.
- issue: Χριστοῦ యొక్క బిరుదు భావం
  choice: ‘మెస్సీయ’
  alternative: ‘క్రీస్తు’
  rationale: ఈ షష్ఠీ నిర్మాణంలోనూ అభిషిక్తుడనే బిరుదు భావాన్ని స్పష్టంగా ఉంచుతుంది; సాధారణ తెలుగు పాఠకులకు సుపరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సులభంగా అర్థమయ్యే శైలి. గ్రీకులో రెండుసార్లు వచ్చిన ἐν కు అనుగుణంగా ‘మధ్యనూ’ రెండుసార్లు ఉంచి సమాంతరతను కాపాడాం. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో ఉంది.
