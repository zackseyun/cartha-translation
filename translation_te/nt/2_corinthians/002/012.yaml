  revision_rationale: వచనం 13లోని ప్రధాన వాక్యానికి కొనసాగుతుందని చూపే చివరి కామాను నిలిపి, మూలంలో లేని ‘అయినప్పటికీ’ విరుద్ధార్థాన్ని తొలగించాం. పర్ఫెక్ట్ పాసివ్ భావాన్ని ‘తెరవబడి ఉండగా’ ద్వారా, ఉద్దేశార్థక εἰς ను ‘కొరకు’ ద్వారా, మరియు ἐν κυρίῳ యొక్క విస్తృతతను ‘ప్రభువులో’ ద్వారా నిలిపాం.
