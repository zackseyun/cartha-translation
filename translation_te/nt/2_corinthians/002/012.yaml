id: 2CO.2.12
reference: 2 Corinthians 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: te
  text: నేను క్రీస్తు సువార్త కొరకు త్రోయకు వచ్చినప్పుడు, ప్రభువులో నాకు ఒక తలుపు తెరవబడి ఉండగా,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν δὲ
  choice: వచ్చినప్పుడు
  rationale: అయోరిస్టు కృదంతం ఇక్కడ కాలసంబంధ పరిస్థితిని తెలియజేస్తుంది. δέ స్వల్ప కథన మార్పును సూచిస్తుంది; తెలుగులో ప్రత్యేక అనుసంధాన పదం లేకుండానే వాక్యప్రవాహంలో అది సహజంగా వ్యక్తమవుతుంది.
- source_word: εἰς τὴν Τρῳάδα
  choice: త్రోయకు
  rationale: స్థలాన్ని సూచించే εἰς యొక్క సహజ దిశార్థక అనువాదం.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: క్రీస్తు సువార్త కోసం
  rationale: రెండవ εἰς ఉద్దేశాన్ని సూచిస్తుంది. 'ప్రకటించడానికి' అని మూలంలో లేని క్రియను చేర్చకుండా 'కోసం' అని ఉంచాం. Χριστός తెలుగులో స్థిరమైన బైబిలు బిరుదైన 'క్రీస్తు'గా అనువదించబడింది.
- source_word: θύρας
  choice: ఒక తలుపు
  rationale: సందర్భంలో అవకాశం అనే రూపకార్థం ఉన్నా, పౌలు వాడిన తలుపు రూపకాన్ని నిలుపుతుంది.
- source_word: ἀνεῳγμένης
  choice: తెరవబడి ఉన్నప్పటికీ
  rationale: పర్ఫెక్ట్ పాసివ్ కృదంతం ముందుగా జరిగిన చర్య వల్ల కొనసాగుతున్న స్థితిని సూచిస్తుంది. తరువాతి వచనంలోని ప్రధాన వాక్యంతో ఉన్న concessive సంబంధాన్ని సహజ తెలుగులో తెలియజేయడానికి 'ఉన్నప్పటికీ' వాడాం.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో నాకు
  rationale: ἐν యొక్క విస్తృత సంబంధార్థాన్ని 'ప్రభువులో'గా నిలిపి, 'ప్రభువు చేత' అనే సాధనార్థానికి పరిమితం చేయలేదు.
theological_decisions:
- issue: Χριστοῦ యొక్క అనువాదం
  choice: క్రీస్తు
  alternative: మెస్సీయ
  rationale: తెలుగులో 'క్రీస్తు' అనేది Χριστόςకు స్థిరపడిన, బిరుదు భావాన్ని మోసే సహజ బైబిలు పదం. 'మెస్సీయ' అర్థపరంగా సాధ్యమైనా, అది గ్రీకు పదానికి బదులు దాని సెమిటిక్ సమానార్థక రూపాన్ని ప్రత్యక్షంగా వాడుతుంది.
- issue: ἐν κυρίῳ యొక్క సంబంధం
  choice: ప్రభువులో
  alternative: ప్రభువు చేత
  rationale: గ్రీకు పదబంధంలోని ఉద్దేశపూర్వక విస్తృతతను నిలిపి, తలుపు తెరిచిన కర్త ప్రభువేనని వ్యాకరణపరంగా స్పష్టంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. 12వ వచనం గ్రీకులో అసంపూర్ణ ఉపవాక్యంగా ఉండి 13వ వచనంలో కొనసాగుతుందనే నిర్మాణాన్ని చివరి కామాతో, పాదసూచికతో సూచించాం.
