id: 2CO.2.4
reference: 2 Corinthians 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: te
  text: ఎంతో శ్రమ, హృదయవేదనల మధ్య అనేక కన్నీళ్లు కారుస్తూ నేను మీకు రాశాను. మీరు దుఃఖపడాలని కాదు; మీ పట్ల నాకు ఎంత అధికమైన ప్రేమ ఉందో మీరు తెలుసుకోవాలనే రాశాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ πολλῆς θλίψεως
  choice: ఎంతో శ్రమలోనూ
  rationale: ἐκ రచన ఉద్భవించిన అంతరంగ స్థితిని సూచిస్తుంది; θλῖψις‌లోని ఒత్తిడి, బాధల విస్తృత భావాన్ని ‘శ్రమ’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: συνοχῆς καρδίας
  choice: హృదయవేదనలోనూ
  rationale: అంతరంగ సంకోచం, తీవ్రమైన మానసిక వేదనను ఆధునిక తెలుగులో సహజంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: ἔγραψα ὑμῖν
  choice: మీకు రాశాను
  rationale: సాధారణ భూతకాల భావాన్ని నిలుపుతుంది; ఇది మునుపటి ఉత్తరమని క్రియలోనే అదనంగా స్పష్టం చేయదు.
- source_word: διὰ πολλῶν δακρύων
  choice: అనేక కన్నీళ్లతో
  rationale: కన్నీళ్లు కారుస్తూ రాసిన సహవర్తిత్వ భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: λυπηθῆτε
  choice: మీరు దుఃఖపడాలని
  rationale: కర్తకు దుఃఖం కలగడం అనే నిష్క్రియాత్మక భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀγάπην
  choice: ప్రేమ
  rationale: ἀγάπηకు సాధారణమైన, విస్తృతమైన తెలుగు సమానార్థకం.
- source_word: γνῶτε
  choice: మీరు తెలుసుకోవాలని
  rationale: ఉద్దేశ్య ఉపవాక్యాన్ని నిలుపుతూ, గుర్తించడం లేదా మరింతగా గ్రహించడం అనే భావాలకు చోటిస్తుంది.
- source_word: περισσοτέρως εἰς ὑμᾶς
  choice: మీపట్ల నాకు ఎంత అధికమైన ప్రేమ ఉందో
  rationale: περισσοτέρως‌లోని పరిమాణాత్మక/తులనాత్మక బలాన్ని నిలుపుతుంది; ‘ప్రత్యేకంగా’ అని మాత్రమే అనువదించి భావాన్ని సన్నగిల్లనివ్వదు.
theological_decisions:
- issue: περισσοτέρως యొక్క తులనాత్మక సూచన
  choice: ఎంత అధికమైన ప్రేమ
  alternative: ప్రత్యేకమైన ప్రేమ
  rationale: గ్రీకు పదం ప్రేమ యొక్క అధిక పరిమాణాన్ని సూచించగలదు; ఎవరితో పోలిక అన్నది వచనం స్పష్టంగా చెప్పనందున దానిని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పౌలు వ్యక్తం చేసిన తీవ్రమైన భావోద్వేగాన్ని నిలుపుతూ గౌరవప్రదమైన శైలి వాడబడింది.
