revisions:
- from: అయితే, మెస్సీయలో మమ్మల్ని ఎల్లప్పుడూ విజయోత్సవ ఊరేగింపులో నడిపిస్తూ[a], తనను గూర్చిన జ్ఞానపు సువాసనను[b] మా ద్వారా ప్రతి చోటా వ్యాపింపజేసే దేవునికి కృతజ్ఞతలు.
  to: కానీ, మెస్సీయలో మమ్మల్ని ఎల్లప్పుడూ విజయోత్సవ ఊరేగింపులో నడిపిస్తూ[a], తనను గూర్చిన జ్ఞానపు సువాసనను[b] మా ద్వారా ప్రతి చోటా వెల్లడి చేసే దేవునికి కృతజ్ఞతలు.
  rationale: The revision replaces ‘వ్యాపింపజేసే’ with ‘వెల్లడి చేసే’ to represent φανεροῦντι accurately as God’s making the fragrance of the knowledge of himself known. It also changes ‘అయితే’ to ‘కానీ’ for the discourse contrast conveyed by δέ. The procession image, the ambiguity concerning θριαμβεύοντι, the Messiah title, and both footnote anchors are retained.
