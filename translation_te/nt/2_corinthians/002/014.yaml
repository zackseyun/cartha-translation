id: 2CO.2.14
reference: 2 Corinthians 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: te
  text: కానీ, మెస్సీయలో మమ్మల్ని ఎల్లప్పుడూ విజయోత్సవ ఊరేగింపులో నడిపిస్తూ[a], తనను గూర్చిన జ్ఞానపు సువాసనను[b] మా ద్వారా ప్రతి చోటా వెల్లడి చేసే దేవునికి కృతజ్ఞతలు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెస్సీయలో మాపై ఎల్లప్పుడూ విజయం సాధిస్తూ.”
    reason: alternative_reading
  - marker: b
    text: లేదా, “పరిమళాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: కృతజ్ఞతలు
  rationale: ‘Τῷ … θεῷ χάρις’ అనే స్తుతి-కృతజ్ఞతా ప్రయోగాన్ని ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: θριαμβεύοντι
  choice: విజయోత్సవ ఊరేగింపులో నడిపిస్తూ
  rationale: ఈ క్రియలోని రోమా విజయోత్సవ ఊరేగింపు దృశ్యాన్ని నిలుపుతూ, ἡμᾶς అనే ప్రత్యక్ష కర్మను స్పష్టంగా చూపిస్తుంది.
- source_word: ἐν τῷ Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించబడింది; ἐν అనే సంబంధం/పరిధి భావాన్ని ‘లో’ నిలుపుతుంది.
- source_word: ὀσμὴν
  choice: సువాసనను
  rationale: తదుపరి రూపక సందర్భానికి అనుగుణంగా సానుకూలమైన వాసన భావాన్ని సహజ తెలుగులో అందిస్తుంది; సమీపార్థమైన ‘పరిమళం’ పాదసూచికలో ఇవ్వబడింది.
- source_word: γνώσεως αὐτοῦ
  choice: తనను గూర్చిన జ్ఞానపు
  rationale: ‘ఆయనను గూర్చిన జ్ఞానం’ అనే సంబంధాన్ని నిలుపుతుంది; ‘తనను’ అనే రూపం వాక్యంలోని దేవునినే సూచిస్తుంది.
- source_word: φανεροῦντι
  choice: వ్యాపింపజేసే
  rationale: సువాసన రూపకంతో తెలుగులో సహజంగా జతకట్టి, ఆ జ్ఞానాన్ని దేవుడు మా ద్వారా ప్రతి చోట వెల్లడిస్తున్నాడనే భావాన్ని సందర్భానుసారంగా వ్యక్తపరుస్తుంది.
- source_word: δι’ ἡμῶν
  choice: మా ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధనత్వం లేదా మధ్యవర్తిత్వాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἐν παντὶ τόπῳ
  choice: ప్రతి చోటా
  rationale: ‘ప్రతి స్థలంలో’ అనే గ్రీకు భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ἡμᾶς అనే కర్మతో θριαμβεύω యొక్క అర్థం
  choice: దేవుడు అపొస్తలుల బృందాన్ని మెస్సీయలో విజయోత్సవ ఊరేగింపులో నడిపిస్తున్నాడు.
  alternative: దేవుడు మెస్సీయలో మాపై విజయం సాధిస్తున్నాడు.
  rationale: ప్రధాన పాఠం విజయోత్సవ ఊరేగింపు దృశ్యాన్ని, దాని వెంట వచ్చే సువాసన రూపకంతో ఉన్న అనుసంధానాన్ని నిలుపుతుంది. అయితే ఈ క్రియ జయించినవాడు బందీలపై విజయాన్ని ప్రదర్శించడాన్ని కూడా సూచించగలదు కాబట్టి ఆ భావాన్ని పాదసూచికలో ఉంచి అసలు పాఠంలోని ఉద్రిక్తతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘విజయోత్సవ ఊరేగింపు’ చారిత్రక దృశ్యాన్ని స్పష్టంగా ఉంచుతుంది; ‘మెస్సీయ’ను బిరుదుగా నిలుపుతుంది. రెండు పాదసూచిక గుర్తులు [a], [b] ప్రధాన పాఠంలో సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
