id: 2CO.2.1
reference: 2 Corinthians 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔκρινα ⸀γὰρ ἐμαυτῷ τοῦτο, τὸ μὴ πάλιν ἐν λύπῃ πρὸς ὑμᾶς ἐλθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: te
  text: 'ఎందుకంటే, నేను నా మనసులో నేనే ఇదే నిర్ణయించుకున్నాను: మళ్లీ దుఃఖంతో మీ దగ్గరకు రాకూడదని.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దుఃఖంలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: నిర్ణయించుకున్నాను
  rationale: ఇక్కడ κρίνω భూతకాల రూపం ఆలోచించి తీసుకున్న స్థిరమైన వ్యక్తిగత నిర్ణయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నిర్ణయించుకున్నాను’ సహజంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందటి సందర్భానికి వివరణాత్మక కారణసంబంధాన్ని కలుపుతుంది; తెలుగులో ‘ఎందుకంటే’ ఆ అనుసంధానాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἐμαυτῷ
  choice: నా కోసం నేనే
  rationale: ఈ ఆత్మవాచక చతుర్థీ విభక్తి పౌలు స్వయంగా, వ్యక్తిగతంగా నిర్ణయం తీసుకున్నాడనే బలాన్ని ఇస్తుంది.
- source_word: τοῦτο
  choice: ఈ నిర్ణయపు విషయాన్ని తదనంతర వాక్యంగా వ్యక్తీకరించడం
  rationale: τοῦτο ముందుకు సూచిస్తూ తరువాతి articular infinitiveలో నిర్ణయ విషయాన్ని తెలియజేస్తుంది. సహజ తెలుగులో ప్రత్యేకంగా ‘ఇది’ అని ఉంచడం కంటే ‘...అని నిర్ణయించుకున్నాను’ అనే నిర్మాణం అదే సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: రాకూడదని
  rationale: నిషేధార్థక articular infinitive నిర్ణయపు విషయాన్ని సూచిస్తుంది; ‘రాకూడదని’ ఆధునిక తెలుగులో సహజమైన పరోక్ష వాక్య నిర్మాణం.
- source_word: πάλιν
  choice: మళ్లీ
  rationale: πάλιν పునరావృతిని సూచిస్తుంది; ‘మళ్లీ’ సాధారణమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: ἐν λύπῃ
  choice: దుఃఖంతో
  rationale: λύπη దుఃఖం, వేదన లేదా మనస్తాపాన్ని సూచిస్తుంది. ‘దుఃఖంతో’ సహజ తెలుగులో విస్తృత భావాన్ని కాపాడుతుంది; ‘దుఃఖంలో’ అనే స్థితి భావం కూడా సాధ్యమే కాబట్టి దానిని పాదసూచికలో ఉంచాం.
- source_word: πρὸς ὑμᾶς
  choice: మీ దగ్గరికి
  rationale: రావడాన్ని తెలిపే క్రియతో πρός + accusative వ్యక్తులవైపు గమనాన్ని సూచిస్తుంది; ‘మీ దగ్గరికి’ సహజమైన ఆధునిక తెలుగు.
theological_decisions:
- issue: ἐν λύπῃ పౌలు దుఃఖస్థితిని సూచిస్తుందా, లేక దుఃఖాన్ని వెంట తెచ్చే సందర్శనను సూచిస్తుందా
  choice: దుఃఖంతో
  alternative: దుఃఖంలో
  rationale: గ్రీకు పదబంధం విధానం లేదా సహచర్యం (‘దుఃఖంతో’) మరియు స్థితి (‘దుఃఖంలో’) రెండింటినీ అనుమతిస్తుంది. ప్రధాన పాఠంలో సహజమైన రూపాన్ని ఎంచుకుని, నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని వివరణాత్మక అనుసంధానం, పౌలు వ్యక్తిగత నిర్ణయంపై ఉన్న ఉద్ఘాటన, ἐν λύπῃలోని భావసందిగ్ధత కాపాడబడ్డాయి.
