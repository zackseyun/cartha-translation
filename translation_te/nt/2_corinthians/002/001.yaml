revisions:
- from: ఎందుకంటే, నేను మళ్లీ దుఃఖంతో మీ దగ్గరికి రాకూడదని నా కోసం నేనే నిర్ణయించుకున్నాను.[a]
  to: 'ఎందుకంటే, నేను నా మనసులో నేనే ఇదే నిర్ణయించుకున్నాను: మళ్లీ దుఃఖంతో మీ దగ్గరకు రాకూడదని.[a]'
  rationale: The revision corrects the potentially misleading Telugu expression for the reflexive dative while preserving the Greek’s personal deliberative force and the demonstrative-to-infinitive structure. No doctrinal or contextual interpretation has been added.
