  rationale: విధించబడిన క్రమశిక్షణాత్మక చర్య తగినంత స్థాయికి చేరిందనే విధేయ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τῷ τοιούτῳ
  choice: అలాంటి వ్యక్తికి
  rationale: సందర్భంలోని నిర్దిష్ట అపరాధిని సూచిస్తుంది. గ్రీకు రూపం పుంలింగ ఏకవచనమైనప్పటికీ, తెలుగులో ‘వ్యక్తి’ సహజంగా ఉండి మూలంలోని నిర్దిష్ట సూచనను నిలుపుతుంది.
- source_word: ἐπιτιμία
  choice: శిక్ష
  rationale: సమాజం అమలు చేసిన క్రమశిక్షణాత్మక దండనను స్పష్టంగా సూచిస్తుంది; కేవలం మాటలతో చేసిన గద్దింపు అనే పరిమిత భావాన్ని నివారిస్తుంది.
- source_word: ἡ ὑπὸ τῶν πλειόνων
  choice: అధికులు విధించిన
  rationale: τῶν πλειόνων సమూహంలోని ఎక్కువమందిని సూచిస్తుంది. ‘అధికులు’ సంక్షిప్తంగా, గౌరవప్రదంగా ఆ భావాన్ని అందిస్తుంది; ‘విధించిన’ అనేది శిక్షతో సహజంగా అనుసంధానమవుతుంది.
