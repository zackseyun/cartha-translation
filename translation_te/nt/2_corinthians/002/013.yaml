id: 2CO.2.13
reference: 2 Corinthians 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: te
  text: నా సహోదరుడైన తీతు నాకు కనిపించకపోవడంతో నా ఆత్మకు విశ్రాంతి కలగలేదు. కానీ అక్కడివారికి వీడ్కోలు చెప్పి[a], మాసిదోనియాకు బయలుదేరాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి దగ్గర సెలవు తీసుకొని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔσχηκα ἄνεσιν
  choice: విశ్రాంతి కలగలేదు
  rationale: గ్రీకు పరిపూర్ణ కాలరూపం కథన సందర్భంలో గత పరిస్థితిని సూచిస్తుంది; ఈ తెలుగు ప్రయోగం అంతరంగ అశాంతిని సహజంగా తెలియజేస్తూ ‘ఉపశమనం’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: τῷ πνεύματί μου
  choice: నా ఆత్మకు
  rationale: దత్తివిభక్తిలోని reference/sphere భావాల మధ్య ఉన్న స్వల్ప అనిశ్చితిని తెలుగు దత్తివిభక్తి సహజంగా నిలుపుతుంది; దీనిని కేవలం మనోవైజ్ఞానిక భావంగా పరిమితం చేయదు.
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: తీతు నాకు కనిపించకపోవడంతో
  rationale: ఆర్టిక్యులర్ ఇన్ఫినిటివ్ తెలిపే కారణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘కనుగొనలేకపోయాను’ అనే అసమర్థత భావాన్ని అదనంగా చేర్చదు.
- source_word: τὸν ἀδελφόν μου
  choice: నా సహోదరుడైన తీతు
  rationale: పౌలు వాడిన కుటుంబ సంబంధ రూపకాన్ని నిలుపుతూ, తీతుతో ఉన్న విశ్వాస సహవాసం మరియు సన్నిహిత సంబంధాన్ని గౌరవప్రదమైన ప్రస్తుత తెలుగులో తెలియజేస్తుంది.
- source_word: ἀποταξάμενος αὐτοῖς
  choice: అక్కడివారికి వీడ్కోలు చెప్పి
  rationale: ట్రోయలోని వారికి వీడ్కోలు పలికి వెళ్లిన భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది; αὐτοῖς యొక్క స్థానిక సందర్భాన్ని ‘అక్కడివారు’ ద్వారా వెల్లడిస్తుంది.
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: మాసిదోనియకు బయలుదేరాను
  rationale: ప్రయాణ గమ్యాన్ని సూచించే గ్రీకు భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; అక్షరార్థమైన ‘బయటికి వెళ్లాను’ అనే అసహజ ప్రయోగాన్ని నివారిస్తుంది.
theological_decisions:
- issue: πνεῦμα అనే పదం ఇక్కడ పరిశుద్ధాత్మను సూచిస్తుందా లేక పౌలు అంతరంగ స్వభావాన్ని సూచిస్తుందా
  choice: నా ఆత్మకు
  alternative: నా మనసుకు
  rationale: μου వల్ల ఇది పౌలుకు చెందిన అంతరంగ ఆత్మను సూచిస్తుంది. ‘మనసు’ అని అనువదిస్తే గ్రీకు పదంలోని విస్తృత మానవ-ఆత్మ భావం మనోవైజ్ఞానిక అర్థానికి కుదించబడుతుంది.
- issue: ‘సహోదరుడు’ అనే సంబోధన యొక్క స్వభావం
  choice: నా సహోదరుడైన తీతు
  alternative: నా తోటి విశ్వాసియైన తీతు
  rationale: మూలంలోని కుటుంబ రూపకాన్ని నేరుగా నిలుపుతుంది; దాని భావాన్ని ఒక నిర్దిష్ట సంఘపరమైన పదజాలంతో భర్తీ చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘సహోదరుడు,’ ‘ఆత్మ,’ ‘విశ్రాంతి’ వంటి మూలానికి సమీపమైన పదాలను నిలుపుతూ, ప్రయాణ వాక్యాన్ని సహజ తెలుగు క్రమంలో అందించాం. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికకు సరిపోతుంది.
