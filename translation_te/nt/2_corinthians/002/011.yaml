id: 2CO.2.11
reference: 2 Corinthians 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα μὴ πλεονεκτηθῶμεν ὑπὸ τοῦ Σατανᾶ, οὐ γὰρ αὐτοῦ τὰ νοήματα ἀγνοοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/011.yaml
  text: so that we would not be outwitted by Satan[b][a], for we are not ignorant of his schemes.
translation:
  language: te
  text: సాతాను మనలను దుర్వినియోగం చేసుకోకుండా ఉండేందుకు; ఎందుకంటే అతని పన్నాగాలు[b] మనకు తెలియనివి కావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: లేదా, “ఆలోచనలు,” “ఉద్దేశాలు,” “వ్యూహాలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: …కుండా ఉండేందుకు
  rationale: ఉద్దేశాన్ని సూచించే ἵνα మరియు ప్రతికూలమైన μή కలయికను సహజమైన ఆధునిక తెలుగులో ముందుచూపుగల నిరోధక ఉద్దేశంగా వ్యక్తం చేస్తుంది.
- source_word: πλεονεκτηθῶμεν
  choice: మోసంతో తనకు లోబరచుకోకుండా
  rationale: πλεονεκτέω కర్మణి రూపంలో మరొకరు అన్యాయంగా పైచేయి సాధించడం, దోచుకోవడం లేదా ప్రయోజనం పొందడం అనే విస్తృత భావం ఉంది. ఈ సందర్భంలో సాతాను మోసపూరితంగా పైచేయి పొందడాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ప్రత్యామ్నాయాలు పాదసూచికలో ఉంచబడ్డాయి.
- source_word: Σατανᾶ
  choice: సాతాను
  rationale: వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ఉద్దేశ వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: νοήματα
  choice: పన్నాగాలు
  rationale: νόημα అనే పదానికి ఆలోచనలు, ఉద్దేశాలు అనే విస్తృత అర్థం ఉన్నప్పటికీ, ఈ సందర్భంలో శత్రుత్వపూర్వకమైన వ్యూహాల భావాన్ని ‘పన్నాగాలు’ సహజంగా అందిస్తుంది; పదంలోని విస్తృతిని పాదసూచికలో చూపించాం.
- source_word: οὐ … ἀγνοοῦμεν
  choice: మనకు తెలియనివి కావు
  rationale: గ్రీకులోని నిరాకరణతో కూడిన ‘తెలియకపోవడం’ భావాన్ని నిలుపుతూ, తెలుగులో సహజమైన ద్వినిరాకరణ రూపాన్ని ఉపయోగిస్తుంది.
theological_decisions:
- issue: సాతాను సాధించే పైచేయి స్వభావం
  choice: మోసంతో తనకు లోబరచుకోవడం
  alternative: మనపై ప్రయోజనం పొందడం / మనలను దోచుకోవడం / మనలను మించిపోవడం
  rationale: సందర్భంలోని క్షమాపణ, సంఘ క్రమశిక్షణ, విభేదాలను ఉపయోగించుకునే ప్రమాదానికి సరిపోయేలా మోసపూరిత ఆధిపత్య భావాన్ని అందించాం; అయితే గ్రీకు క్రియకు ఉన్న ఆర్థిక లేదా సాధారణ దోపిడీ ఛాయలను ఏకైక సిద్ధాంతార్థంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని ఉద్దేశ–కారణ సంబంధాన్ని స్పష్టంగా ఉంచాం. ప్రధాన పాఠంలోని ప్రతి పాదసూచిక గుర్తు దాని సంబంధిత పదబంధం వెంట ఉంది.
