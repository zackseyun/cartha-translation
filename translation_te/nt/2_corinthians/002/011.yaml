revisions:
- from: సాతాను మనలను మోసంతో తనకు లోబరచుకోకుండా[a] ఉండేందుకు ఇలా చేయాలి; ఎందుకంటే అతని పన్నాగాలు[b] మనకు తెలియనివి కావు.
  to: సాతాను మనలను దుర్వినియోగం చేసుకోకుండా ఉండేందుకు; ఎందుకంటే అతని పన్నాగాలు[b] మనకు తెలియనివి కావు.
  rationale: The revision removes the unsupported ideas of deception and subjugation while preserving the Greek purpose and explanation structure. Because “దుర్వినియోగం చేసుకోవడం” adequately conveys the central lexical sense of πλεονεκτηθῶμεν, no footnote is required for that rendering. The footnote on “పన్నాగాలు” is retained to reflect the wider lexical range of νοήματα.
