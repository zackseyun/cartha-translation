id: 2CO.2.9
reference: 2 Corinthians 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: te
  text: 'ఎందుకంటే నేను కూడా ఇందుకోసమే రాశాను: మీరు అన్నిటిలో విధేయులుగా ఉన్నారో లేదో, మీ రుజువును[a] తెలుసుకోవడానికి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ పరీక్షను”; లేదా, “మీ రుజువైన గుణాన్ని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ καὶ ἔγραψα
  choice: నేను మీకు రాసిన ఉద్దేశం కూడా ఇదే
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని సందర్భంలో సహజంగా తెలియజేస్తూ, εἰς τοῦτο యొక్క ఉద్దేశార్థాన్ని మరియు καί యొక్క అదనపు భావాన్ని నిలుపుతుంది.
- source_word: ἵνα γνῶ
  choice: తెలుసుకొని ... గుర్తించాలి అని
  rationale: తెలుసుకోవడమే రాయడంలోని ఉద్దేశమని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: మీ పరీక్షలో రుజువైన స్థితిని
  rationale: δοκιμή లోని ‘పరీక్ష’ మరియు ‘పరీక్ష ద్వారా లభించిన రుజువు’ అనే రెండు భావఛాయలను సాధ్యమైనంతవరకు కలిపి ఉంచుతుంది; వ్యక్తిత్వమనే అదనపు అర్థాన్ని చేర్చదు.
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: మీరు అన్ని విషయాల్లో విధేయులుగా ఉన్నారో లేదో
  rationale: γνῶ తరువాత εἰ సూచించే పరోక్ష ప్రశ్నను ‘ఉన్నారో లేదో’గా, εἰς πάντα యొక్క సమగ్రతను ‘అన్ని విషయాల్లో’గా సహజంగా అందిస్తుంది.
theological_decisions:
- issue: δοκιμή యొక్క భావం
  choice: పరీక్షలో రుజువైన స్థితి
  alternative: మీ యోగ్యత / మీ రుజువు / మీ పరీక్ష
  rationale: ఈ పదం పరీక్షించే ప్రక్రియనూ, పరీక్షలో వెల్లడయ్యే రుజువైన గుణాన్నీ సూచించగలదు. ఒకే సిద్ధాంతాత్మక అర్థానికి పరిమితం చేయకుండా ఆ ఉద్వేగాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన సంబోధనను, సహజమైన వాక్యక్రమాన్ని ఉపయోగించాం. మూలంలోని δοκιμή పదానికి ఉన్న నిజమైన భావసందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
