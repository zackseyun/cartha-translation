- from: ఎవరైనా దుఃఖం కలిగించి ఉంటే, అతడు నాకు మాత్రమే దుఃఖం కలిగించలేదు; కొంతవరకు మీ అందరికీ కలిగించాడు—నేను మీ అందరిపైనా మరీ భారం మోపకుండా ఉండేందుకే ఇలా అంటున్నాను.[a]
  to: ఎవరైనా దుఃఖం కలిగించి ఉంటే, అతడు నన్ను మాత్రమే కాదు, కొంతవరకు మీ అందరినీ కూడా దుఃఖపరచాడు—మీ అందరిపైనా మరీ భారం మోపకూడదనే ఉద్దేశంతో.[a]
  rationale: The revised text keeps the contrast “not me only, but also all of you to some extent,” retains the burden metaphor and the explicit comprehensiveness of “all of you,” and removes an unnecessary explicit speech formula. The footnote now identifies the genuine syntactic/idiomatic uncertainty without changing “in part” into “some of you.”
