source:
  edition: SBLGNT
  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: te
  text: ఎవరైనా దుఃఖం కలిగించి ఉంటే, అతడు నన్ను మాత్రమే కాదు, కొంతవరకు మీ అందరినీ కూడా దుఃఖపరచాడు—మీ అందరిపైనా మరీ భారం మోపకూడదనే ఉద్దేశంతో.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, చివరి మాటలకు “విషయాన్ని మీ అందరికీ మరీ భారంగా చేయకూడదనే ఉద్దేశంతో” అనే భావం ఉండవచ్చు. “కొంతవరకు” (అక్షరార్థంగా, “భాగంగా”) దుఃఖం ఎంతవరకు వ్యాపించిందో మితీకరిస్తుంది; దాని ఖచ్చితమైన వాక్యాన్వయం కొంత సందిగ్ధంగా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λελύπηκεν
  choice: దుఃఖం కలిగించి ఉంటే / దుఃఖం కలిగించాడు
  rationale: λυπέω యొక్క రెండు ప్రయోగాల్లోనూ ఒకే పదబంధాన్ని ఉంచి మూలంలోని పదసంబంధాన్ని కాపాడాం. గ్రీకు perfect రూపం గత చర్యకు కొనసాగుతున్న ప్రభావం ఉందని సూచిస్తుంది; తెలుగు సహజ వాక్యనిర్మాణంలో ‘కలిగించి ఉంటే’ దీనిని తగినంతగా వ్యక్తం చేస్తుంది.
- source_word: οὐκ ἐμὲ λελύπηκεν
  choice: నాకు మాత్రమే దుఃఖం కలిగించలేదు
  rationale: గ్రీకు పదక్రమంలోని ‘నాకు కాదు’ అనే విరుద్ధతను తెలుగులో సహజంగా తెలియజేయడానికి ‘మాత్రమే’ చేర్చాం; పౌలు తనకు అసలు దుఃఖం కలగలేదని పూర్తిగా నిరాకరిస్తున్నట్టు వచ్చే అపార్థాన్ని ఇది నివారిస్తుంది.
- source_word: ἀπὸ μέρους
  choice: కొంతవరకు
  rationale: ఈ క్రియావిశేషణ ప్రయోగం పరిమితిని లేదా మితీకరణను సూచిస్తుంది. అది ‘మీ అందరికీ’ని సవరించవచ్చు; అయితే వాక్యంలో దాని ఖచ్చిత అన్వయం సందిగ్ధంగా ఉంది.
- source_word: ἵνα μὴ ἐπιβαρῶ
  choice: నేను ... మరీ భారం మోపకుండా ఉండేందుకే
  rationale: ἐπιβαρέω లోని భారం మోపడం అనే రూపకాన్ని నిలిపి, సందర్భంలో పౌలు తన మాటను అతిగా మోపకూడదనే మితీకరణ భావాన్ని సహజ తెలుగులో తెలిపాం.
- source_word: πάντας ὑμᾶς
  choice: మీ అందరికీ / మీ అందరిపైనా
  rationale: πάντας అనే సమగ్రతను స్పష్టంగా కాపాడి, సంఘమంతటినీ ఉద్దేశించిన బహువచన సంబోధనను తెలిపాం.
theological_decisions:
- issue: ἀπὸ μέρους మరియు ἵνα μὴ ἐπιβαρῶ మధ్య వాక్యనిర్మాణ సంబంధం
  choice: ప్రధాన పాఠ్యంలో ‘కొంతవరకు’ను ‘మీ అందరికీ’తో అనుసంధానించి, చివరి పదబంధాన్ని పౌలు తన మాటను మరీ భారంగా మోపకూడదనే వివరణగా అనువదించడం
  alternative: ‘అతడు నాకు దుఃఖం కలిగించలేదు, మీ అందరిలో కొందరికి కలిగించాడు—మీ అందరినీ నిందించి భారపరచకుండా ఉండేందుకు ఇలా అంటున్నాను’ లేదా ‘కొంతవరకు—మీ అందరిపై మరీ భారం మోపకుండా ఇలా అంటున్నాను’
  rationale: గ్రీకు వాక్యం నిజమైన వాక్యనిర్మాణ సందిగ్ధతను కలిగి ఉంది. ప్రధాన అనువాదం పౌలు చెప్పే మితీకరణను సహజంగా అందిస్తుంది; ప్రత్యామ్నాయ అన్వయాలను పాదసూచికలో ఉంచి సందిగ్ధతను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని మితీకరణను, వాక్యనిర్మాణ సందిగ్ధతను పాదసూచికతో కాపాడాం.
