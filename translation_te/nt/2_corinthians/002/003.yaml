id: 2CO.2.3
reference: 2 Corinthians 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: te
  text: నేను వచ్చినప్పుడు, నాకు సంతోషకారణం కావలసినవారి వల్ల నాకు దుఃఖం కలగకూడదని ఈ సంగతినే రాశాను,[a] మీలో అందరి విషయంలో నమ్మకంతో ఉండి, నా సంతోషమే మీ అందరి సంతోషమని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “ఎవరి నుండి నేను సంతోషించవలసి ఉందో, వారి వల్ల నాకు దుఃఖం కలగకూడదని.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: రాశాను
  rationale: సందర్భంలో పౌలు ఇంతకుముందు రాసిన దానిని సూచించే భూతకాల క్రియగా సహజంగా వ్యక్తమవుతుంది.
- source_word: τοῦτο αὐτὸ
  choice: ఈ సంగతినే
  rationale: αὐτό ఇచ్చే ఉద్ఘాటనను తెలుగు ప్రత్యయం ‘నే’ సహజంగా నిలుపుతుంది.
- source_word: ἵνα μὴ ... λύπην σχῶ
  choice: దుఃఖం కలగకూడదని
  rationale: ఉద్దేశార్థక ἵνα మరియు నిషేధార్థక μή భావాన్ని సహజమైన తెలుగు ఉద్దేశ వాక్యంగా అందిస్తుంది.
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: నన్ను సంతోషపరచవలసినవారి వల్లనే
  rationale: అక్షరార్థంగా ‘ఎవరి నుండి నేను సంతోషించవలసి ఉందో’ అనేది తెలుగులో అసహజం; వీరు పౌలు సంతోషానికి మూలంగా ఉండవలసినవారనే సంబంధార్థాన్ని ఈ రూపం స్పష్టం చేస్తుంది.
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: మీ అందరి విషయంలో నమ్మకంతో ఉన్నాను
  rationale: పరిపూర్ణ కృదంతం సూచించే స్థిరమైన నమ్మకాన్ని నిలుపుతూ, దానిని తప్పనిసరిగా బలమైన కారణార్థక వాక్యంగా మార్చకుండా అందిస్తుంది.
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: నా సంతోషమే మీ అందరి సంతోషం
  rationale: గ్రీకు వాక్యంలోని సమానీకరణ నిర్మాణాన్నీ, పౌలు మరియు కొరింథీయుల మధ్య పంచబడిన సంతోష భావాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: πεποιθὼς అనే కృదంతానికి ముందున్న వాక్యంతో ఉన్న సంబంధం
  choice: స్వతంత్రంగా ‘నమ్మకంతో ఉన్నాను’ అని అనుసంధానించడం
  alternative: ‘ఎందుకంటే ... నాకు నమ్మకం ఉంది’ అని కారణార్థకంగా అనువదించడం
  rationale: గ్రీకు కృదంతం కారణాన్ని సూచించగలిగినా, కారణ సంబంధాన్ని తప్పనిసరిగా నిర్ణయించదు. అందుచేత మూలంలోని స్వల్ప అస్పష్టతను నిలుపుకునే నిర్మాణం ఎంచుకోబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘సంతోషం/సంతోషపరచు’ పదపునరుక్తి మూలంలోని χαίρειν–χαρά అనుబంధాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
