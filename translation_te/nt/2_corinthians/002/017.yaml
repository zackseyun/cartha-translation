source:
  edition: SBLGNT
  text: οὐ γάρ ἐσμεν ὡς οἱ ⸀πολλοὶ καπηλεύοντες τὸν λόγον τοῦ θεοῦ, ἀλλ’ ὡς ἐξ εἰλικρινείας, ἀλλ’ ὡς ἐκ θεοῦ ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: te
  text: ఎందుకంటే, దేవుని వాక్యాన్ని సరుకులా అమ్ముకునే[b] ఆ అనేకులవలె[a] మేము లేము. కాని నిష్కపటతతో[c], దేవుని నుండి, దేవుని సమక్షంలో[d], మెస్సీయలో[e] మేము మాట్లాడుతున్నాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘చాలామందివలె’; పదశః ‘ఆ అనేకులవలె.’
    reason: lexical_alternative
  - marker: b
    text: ‘అమ్ముకోవడం’లో లాభం కోసం వ్యాపారం చేయడం అనే భావం ఉంది; కల్తీ చేయడం లేదా భ్రష్టుపట్టించడం అనే భావమూ ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: పదశః ‘నిష్కపటత నుండి’; లేదా ‘యథార్థమైన ఉద్దేశంతో.’
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘దేవుని ఎదుట,’ ‘దేవుని సన్నిధిలో.’
    reason: lexical_alternative
  - marker: e
    text: సంప్రదాయంగా ‘క్రీస్తులో’; పదార్థంగా ‘అభిషిక్తునిలో.’
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πολλοί
  choice: అనేకులు
  rationale: గ్రీకు పదబంధం పౌలు తనను ఒక పెద్ద సమూహంతో విభేదింపజేసే భావాన్ని ఇస్తుంది. తెలుగులో సహజంగా ఉండే ‘అనేకులు’ ఆ వ్యత్యాసాన్ని నిలుపుతుంది; దానిని గణాంకపరంగా ‘అధిక శాతం మంది’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: καπηλεύοντες
  choice: సరుకులా అమ్ముకునే
  rationale: ఈ క్రియలో చిల్లర వ్యాపారి లేదా స్వలాభం కోసం అమ్మే వ్యక్తి అనే వాణిజ్య రూపకం, దానితోపాటు నైతిక విమర్శ ఉన్నాయి. ‘సరుకులా అమ్ముకునే’ అనే ప్రయోగం ఆ రూపకాన్ని తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: దేవుని వాక్యం
  rationale: ఇది గ్రీకు సంబంధవిభక్తి నిర్మాణానికి నేరమైన, గంభీరమైన తెలుగు సమానం; ‘సందేశం’ అని వివరణాత్మకంగా విస్తరించలేదు.
- source_word: ἐξ εἰλικρινείας
  choice: నిష్కపటతతో
  rationale: ἐξ పదశః మూలాన్ని సూచించినా, ‘నిష్కపటత నుండి’ అనేది తెలుగులో కృత్రిమంగా ఉంటుంది. కాబట్టి ఉద్దేశంలోని స్వచ్ఛతను సహజంగా తెలియజేసే సాధనార్థక రూపాన్ని వాడి, మూలార్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἐκ θεοῦ
  choice: దేవుని నుండి వచ్చినవారిగా
  rationale: ἐκ సూచించే మూలం లేదా పంపబడిన స్థితిని కాపాడుతూ, λαλοῦμενతో తెలుగులో సహజంగా అనుసంధానించేందుకు ‘వచ్చినవారిగా’ చేర్చబడింది.
- source_word: κατέναντι θεοῦ
  choice: దేవుని సమక్షంలో
  rationale: ఈ పదబంధం దేవుని సన్నిధిలో మాట్లాడటాన్ని, ఆయన ఎదుట జవాబుదారీతనాన్ని సూచిస్తుంది. ‘దేవుని సమక్షంలో’ సంక్షిప్తంగా, సహజంగా రెండింటినీ మోయగలదు.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: ἐν యొక్క సంబంధ లేదా పరిధి భావాన్ని ‘లో’ నిలుపుతుంది. Χριστόςను ఇక్కడ అభిషిక్తుని బిరుదు భావంతో ‘మెస్సీయ’గా ఇచ్చాం; సంప్రదాయ ‘క్రీస్తులో’ను పాదటిప్పణిలో సూచించాం.
- source_word: λαλοῦμεν
  choice: మేము మాట్లాడుతున్నాం
  rationale: గ్రీకు వర్తమాన కాలాన్ని, సాధారణ ‘మాట్లాడు’ అనే క్రియను నిలుపుతుంది; ‘ప్రకటిస్తున్నాం’ అని అర్థాన్ని అనవసరంగా బలపరచదు.
theological_decisions:
- issue: ἐν Χριστῷలో Χριστόςను ఎలా ఇవ్వాలి
  choice: మెస్సీయలో
  alternative: క్రీస్తులో; అభిషిక్తునిలో
  rationale: ఈ సందర్భంలో బిరుదు భావం సజీవంగా ఉండగలదు. ‘మెస్సీయ’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో గుర్తుపట్టదగినది; ‘అభిషిక్తుడు’ అనే అర్థాన్ని సూచిస్తూ, పౌలు వాడే ‘లో’ సంబంధాన్ని మార్చదు.
- issue: ἀλλ’ ὡς ... ἀλλ’ ὡς అనే పునరుక్త నిర్మాణం
  choice: దానికి భిన్నంగా, నిష్కపటతతో, దేవుని నుండి వచ్చినవారిగా
  alternative: కాని నిష్కపటత నుండి వచ్చినట్లు, కాని దేవుని నుండి వచ్చినట్లు
  rationale: రెండవ ἀλλά మొదటి ప్రతివ్యత్యాసాన్ని బలపరుస్తుంది; తప్పనిసరిగా రెండు వేర్వేరు సరిదిద్దింపులు కాదు. తెలుగులో అసహజమైన పునరుక్తిని తగ్గిస్తూ, నిష్కపటత మరియు దేవుడు అనే రెండు మూలాంశాలనూ ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకునికి అర్థమయ్యే గంభీర శైలి వాడబడింది. వాణిజ్య రూపకాన్ని ‘సరుకులా అమ్ముకునే’గా నిలిపి, దాని లాభాపేక్ష లేదా కల్తీ భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా చేర్చలేదు. గ్రీకు వాక్యంలోని దీర్ఘ నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం రెండు వాక్యాలుగా విభజించినా, కారణసంబంధం మరియు ప్రధాన ప్రతివ్యత్యాసం నిలుపబడ్డాయి.
