id: 2CO.12.11
reference: 2 Corinthians 12:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: te
  text: నేను అవివేకినయ్యాను; మీరే నన్ను దీనికి బలవంతపెట్టారు. ఎందుకంటే, మీరు నన్ను ప్రశంసించవలసి ఉండింది; ఎందుకంటే, నేను ఏమీ కానివాడినైనా, ఆ అత్యున్నతమైన అపొస్తలులకంటే[a] ఏ విషయంలోనూ తక్కువవాడిని కాలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అత్యంత ప్రముఖులైన అపొస్తలులు.” గ్రీకు పదబంధం చాలా ఉద్ఘాటితమైనది; ఈ సందర్భంలో అది వ్యంగ్యంగా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Γέγονα
  choice: అయ్యాను
  rationale: పరిపూర్ణ కాలంలోని, గతంలో ఏర్పడి ప్రస్తుతం కొనసాగుతున్న స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἄφρων
  choice: అవివేకిని
  rationale: పౌలు తనను గురించి వ్యంగ్యంగా వాడిన నామవాచక భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: మీరే నన్ను దీనికి బలవంతపెట్టారు
  rationale: ὑμεῖς అనే ఉద్ఘాటిత కర్తను ‘మీరే’తో నిలిపి, సందర్భంలో సూచితమైన అవివేకపు అతిశయోక్తిని ‘దీనికి’గా మాత్రమే వ్యక్తం చేస్తుంది.
- source_word: ὑφ’ ὑμῶν συνίστασθαι
  choice: మీరే నన్ను మెచ్చుకొని చెప్పవలసి ఉండింది
  rationale: కొరింథీయులు పౌలు పక్షాన సిఫారసు లేదా ప్రశంసగా మాట్లాడవలసిన భావాన్ని సహజంగా అందిస్తుంది; కర్మణి ప్రయోగంలోని వారిచేత అనే భావాన్ని ‘మీరే’ నిలుపుతుంది.
- source_word: οὐδὲν ... ὑστέρησα
  choice: ఏ విషయంలోనూ తక్కువవాడిని కాలేదు
  rationale: వెనుకబడడం లేదా హీనంగా ఉండడం అనే తులనాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: ఆ మేటిమించిన అపొస్తలులు
  rationale: ὑπερλίαν యొక్క బలమైన అతిశయ భావాన్ని నిలుపుతూ, వ్యంగ్యమా లేక నిజమైన ఘనత సూచనా అనే సందిగ్ధతను ప్రధాన పాఠ్యంలో పరిష్కరించదు.
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: నేను ఏమీ కానివాడినైనా
  rationale: ఒప్పుకోలు లేదా concessive భావాన్ని, పౌలు తనను తాను తగ్గించుకొని చెప్పిన పదునుతో సహా, దగ్గరగా నిలుపుతుంది.
theological_decisions:
- issue: τῶν ὑπερλίαν ἀποστόλων యొక్క భావబలం
  choice: ‘ఆ మేటిమించిన అపొస్తలులు’ అని ప్రధాన పాఠ్యంలో ఉంచి, సాధ్యమైన వ్యంగ్యార్థాన్ని పాదటిప్పణిలో సూచించడం
  alternative: ‘అతి శ్రేష్ఠులైన అపొస్తలులు’ లేదా స్పష్టమైన వ్యంగ్యంతో ‘అని చెప్పుకునే మహా అపొస్తలులు’
  rationale: గ్రీకు పదబంధం అత్యంత ఉద్ఘాటితమైనది, సందర్భంలో వ్యంగ్యంగా ఉండవచ్చు; అయితే వ్యంగ్యాన్ని స్పష్టంగా గుర్తించే పదం మూలంలో లేదు. కాబట్టి ప్రధాన పాఠ్యం ఆ ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘అవివేకిని,’ ‘మెచ్చుకొని చెప్పడం,’ ‘తక్కువవాడిని కాలేదు’ వంటి రూపాలు సాధారణ పాఠకులకు అర్థమయ్యేలా ఉండి, పౌలు వాక్యంలోని వ్యంగ్యం, స్వీయతగ్గింపు, తులనాత్మక బలాన్ని నిలుపుతాయి.
