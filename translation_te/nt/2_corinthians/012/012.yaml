revisions:
- from: నిజానికి, అపొస్తలుని గుర్తులు[a] మీ మధ్య సంపూర్ణ సహనంతో కనబరచబడ్డాయి—సూచక క్రియలతో, అద్భుతాలతో, శక్తికార్యాలతో[b].
  to: నిజానికి, అపొస్తలుని గుర్తులు[a] మీ మధ్య అన్ని విధాలైన స్థిరసహనంతో చేయబడ్డాయి—సూచక క్రియలతో, అద్భుతాలతో, శక్తి కార్యాలతో[b].
  rationale: The revision corrects the main verbal nuance by rendering κατειργάσθη as “చేయబడ్డాయి,” strengthens the rendering of comprehensive steadfast endurance in πάσῃ ὑπομονῇ, and retains both the Greek ambiguity of “అపొస్తలుని” and the three distinct terms in the concluding triad. Footnote anchors remain attached to the relevant expressions.
