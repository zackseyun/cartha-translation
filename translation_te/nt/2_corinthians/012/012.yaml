  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: te
  text: నిజానికి, అపొస్తలుని గుర్తులు[a] మీ మధ్య అన్ని విధాలైన స్థిరసహనంతో చేయబడ్డాయి—సూచక క్రియలతో, అద్భుతాలతో, శక్తి కార్యాలతో[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఇది ప్రత్యేకంగా పౌలుని సూచిస్తే, “ఆ అపొస్తలుని గుర్తులు.”
    reason: alternative_reading
  - marker: b
    text: “శక్తి కార్యాలు” అనే పదాన్ని “అద్భుత కార్యాలు” లేదా “మహత్కార్యాలు” అని కూడా అనువదించవచ్చు; గ్రీకు పదం శక్తి వ్యక్తమయ్యే కార్యాలను నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: నిజానికి, ... గుర్తులు
  rationale: μέν ఇచ్చే ధృవీకరణాత్మక నొక్కును ‘నిజానికి’ సహజంగా తెలియజేస్తుంది; ఇక్కడ σημεῖα అపొస్తలత్వాన్ని గుర్తించే ఆధారాల భావంలో ‘గుర్తులు’గా అనువదించబడింది.
- source_word: τοῦ ἀποστόλου
  choice: అపొస్తలుని
  rationale: గ్రీకు నిర్దిష్ట రూపాన్ని అతిగా అనిర్దిష్టం చేయకుండా, అపొస్తలుని లక్షణాలనే సాధారణ గుణార్థ భావాన్నీ నిలుపుతుంది.
- source_word: κατειργάσθη
  choice: కనబరచబడ్డాయి
  rationale: క్రియలోని భూతకాల నిష్క్రియార్థాన్ని, అవి వారి మధ్య కార్యరూపంలో చూపబడ్డాయనే సందర్భోచిత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; కార్యసాధకుడు ఎవరో అదనంగా పేర్కొనదు.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: కొరింథు విశ్వాసుల సమాజంలో, వారి సమక్షంలో జరిగిన కార్యాన్ని సూచిస్తుంది; అంతరంగికమైన ‘మీలో’ అనే భావాన్ని నివారిస్తుంది.
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: సంపూర్ణ సహనంతో
  rationale: కష్టాల మధ్య స్థిరంగా కొనసాగడాన్ని సూచించే ὑπομονή భావాన్ని, పరిస్థితేర్పాటు/విధాన సంబంధమైన ἐνతో కలిపి తెలియజేస్తుంది.
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: సూచక క్రియలతో, అద్భుతాలతో, శక్తికార్యాలతో
  rationale: 'మూడు గ్రీకు పదాల భేదాన్ని కాపాడుతుంది: దైవ కార్యాన్ని సూచించేవి, ఆశ్చర్యం కలిగించేవి, శక్తిని వ్యక్తపరచేవి. ముందున్న ‘గుర్తులు’తో అయోమయం తగ్గించేందుకు ఇక్కడ σημεῖαను ‘సూచక క్రియలు’గా ఇచ్చింది.'
theological_decisions:
- issue: ‘అపొస్తలుని గుర్తులు’ అనే పదబంధం పరిధి
  choice: అపొస్తల సేవను ధృవీకరించే గుర్తులుగా అనువదించి, సహనాన్నీ తదనంతర అద్భుత కార్యాలనూ వాక్యంలో ఉంచడం
  alternative: అద్భుతాలు మాత్రమే అపొస్తలత్వాన్ని నిర్వచించే గుర్తులని స్పష్టంగా చెప్పడం
  rationale: వాక్య నిర్మాణం మొదట అపొస్తలుని గుర్తుల గురించి చెబుతూ, తరువాత సంపూర్ణ సహనాన్ని మరియు సూచక క్రియలు, అద్భుతాలు, శక్తికార్యాలను పేర్కొంటుంది. అనువాదం వీటి ఖచ్చిత పరస్పర సంబంధాన్ని సిద్ధాంతపరంగా కుదించదు.
- issue: τοῦ ἀποστόλου నిర్దిష్టత
  choice: ‘అపొస్తలుని’ అని ఉంచి సాధారణ గుణార్థ పఠనానికి వీలు ఇవ్వడం
  alternative: పౌలును మాత్రమే సూచిస్తూ ‘ఆ అపొస్తలుని’ అని అనువదించడం
  rationale: గ్రీకు పదబంధం నిర్దిష్ట రూపంలో ఉన్నప్పటికీ, అపొస్తలునికి లక్షణమైన గుర్తులు అనే గుణార్థ/సామాన్య భావాన్ని కలిగి ఉండవచ్చు. పాదసూచిక వ్యక్తిగత పఠనాన్ని భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘అపొస్తలుడు,’ ‘సూచక క్రియలు,’ ‘శక్తికార్యాలు’ వంటి సంఘపరంగా పరిచితమైన పదాలను వాడినా, ఏ ప్రత్యేక సంప్రదాయ సిద్ధాంతాన్నీ చేర్చలేదు.
