    issue: The final prepositional phrase is rendered ‘నా బలహీనతల గురించి తప్ప.’
    rationale: This changes ἐν (‘in’) to ‘about/concerning.’ The verse contrasts not boasting with reference to oneself except boasting in weaknesses; Telugu can preserve this with ‘నా బలహీనతలలో తప్ప.’
