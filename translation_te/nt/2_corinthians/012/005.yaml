id: 2CO.12.5
reference: 2 Corinthians 12:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὑπὲρ τοῦ τοιούτου καυχήσομαι, ὑπὲρ δὲ ἐμαυτοῦ οὐ καυχήσομαι εἰ μὴ ἐν ταῖς ⸀ἀσθενείαις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: te
  text: అటువంటి వ్యక్తి గురించి నేను గొప్పగా చెప్పుకుంటాను[a]; అయితే నా గురించి నేను గొప్పగా చెప్పుకోను—నా బలహీనతలలో తప్ప[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అటువంటి వ్యక్తి పక్షంగా.’ గ్రీకు ఉపసర్గం ఆ వ్యక్తిని గురించి లేదా అతని పక్షంగా అనే భావాలను ఇవ్వగలదు; ఇక్కడి అనువాదం సహజమైన తెలుగులో పౌలు పాటిస్తున్న వాక్చాతుర్యపూర్వక దూరాన్ని నిలుపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘బలహీనతలలో తప్ప.’ పౌలు వాడుకలో ‘బలహీనతలు’ మానవ దుర్బలతను, బాధలను, లేదా దేవుని శక్తి వెల్లడయ్యే పరిస్థితులను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ τοῦ τοιούτου
  choice: అటువంటి వ్యక్తి గురించి
  rationale: ὑπέρ + షష్ఠీ విభక్తి ఇక్కడ ఎవరిని ఉద్దేశించి లేదా ఎవరిని గురించి గొప్పగా చెప్పుకోవడం జరుగుతుందో సూచిస్తుంది. ‘గురించి’ సహజమైన ఆధునిక తెలుగు; ‘అటువంటి వ్యక్తి’ అన్నది τοῦ τοιούτου లోని ఉద్దేశపూర్వక పరోక్షతను నిలుపుతుంది.
- source_word: καυχήσομαι / οὐ καυχήσομαι
  choice: నేను గొప్పగా చెప్పుకుంటాను / గొప్పగా చెప్పుకోను
  rationale: καυχάομαιలోని స్వయంగా అతిశయించి చెప్పుకునే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా తెలియజేస్తుంది; రెండు సందర్భాల్లోనూ ఒకే పదబంధాన్ని ఉంచి వాక్యంలోని వ్యతిరేక సమాంతరతను కాపాడింది.
- source_word: ὑπὲρ δὲ ἐμαυτοῦ
  choice: అయితే నా గురించి
  rationale: δέలోని వ్యతిరేకతను ‘అయితే’ తెలియజేస్తుంది; ἐμαυτοῦ పౌలు తననే వ్యత్యాసపు అంశంగా చూపుతున్నందున ‘నా గురించి’ అని అనువదించబడింది.
- source_word: εἰ μὴ
  choice: తప్ప
  rationale: ఇక్కడ ఇది షరతును కాక మినహాయింపును సూచిస్తుంది.
- source_word: ἐν ταῖς ἀσθενείαις
  choice: నా బలహీనతల గురించి
  rationale: ἀσθένειαις అనే బహువచనం మానవ బలహీనతలు, దుర్బలతలు, బాధాకర పరిస్థితులు వంటి విస్తృత భావాన్ని కలిగి ఉంటుంది. గ్రీకులో స్వామ్యసూచక పదం లేకపోయినా, ἐμαυτοῦతో ఉన్న వ్యత్యాసం వల్ల అవి పౌలు బలహీనతలని సందర్భం స్పష్టం చేస్తుంది; తెలుగులో సహజత కోసం ‘నా’ చేర్చబడింది. καυχάομαιతో ἐν వాడుకను ‘గురించి’గా సహజీకరించాం.
theological_decisions:
- issue: పౌలు అనుమతించే గొప్పచెప్పుకోవడం స్వభావం
  choice: అటువంటి వ్యక్తిని గురించి గొప్పగా చెప్పుకోవడానికీ, తనను గురించి గొప్పగా చెప్పుకోవడానికీ మధ్య పౌలు వ్యత్యాసం చూపిస్తూ, తన బలహీనతలను మాత్రమే మినహాయింపుగా ఉంచుతున్నాడు.
  alternative: ‘అటువంటి వ్యక్తి’ పౌలుకు అక్షరార్థంగా వేరైన మరొక వ్యక్తి కావచ్చు; లేదా ఈ మాట వ్యక్తిగత సూచనకన్నా బలహీనతలోనే గొప్పగా చెప్పుకోవాలనే సాధారణ ధార్మిక సూత్రం కావచ్చు.
  rationale: మూలంలోని పరోక్ష స్వీయసూచన, వాక్చాతుర్యపూర్వక దూరం అలాగే ఉంచబడ్డాయి; దర్శనానుభవంలోని వ్యక్తి పౌలేనా కాదా అన్న ప్రశ్నను అనువాదం తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘గొప్పగా చెప్పుకోవడం’ అనే సహజ పదబంధాన్ని పునరావృతం చేసి గ్రీకు వాక్యంలోని సమాంతర వ్యత్యాసాన్ని నిలిపాం. ఎమ్ డాష్ మినహాయింపు భాగాన్ని స్పష్టంగా చూపుతుంది; మూలంలోని ఉద్దేశపూర్వక ధార్మిక ఉద్రిక్తతను పరిష్కరించలేదు.
