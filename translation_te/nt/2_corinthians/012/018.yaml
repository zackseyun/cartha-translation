id: 2CO.12.18
reference: 2 Corinthians 12:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: te
  text: తీతును వెళ్లమని కోరాను; అతనితో పాటు ఆ సహోదరుణ్ణి పంపాను. తీతు మీ నుండి అన్యాయంగా లాభం పొందలేదు కదా? మేము అదే ఆత్మతో[a] నడుచుకోలేదా? అదే అడుగుజాడల్లో నడవలేదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అదే ఆత్మచేత’; ఇది ఒకే మనోభావాన్ని కాక పరిశుద్ధాత్మను సూచించే అవకాశం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: παρεκάλεσα Τίτον
  choice: తీతును వెళ్లమని కోరాను
  rationale: παρακαλέω ఇక్కడ తీతుకు అప్పగించిన ఆచరణాత్మక పరిచర్య సందర్భంలో earnest requestను సూచిస్తుంది. సందర్భం నుండి ‘వెళ్లమని’ని సహజమైన తెలుగులో స్పష్టపరచడం జరిగింది.
- source_word: συναπέστειλα
  choice: అతనితో పాటు ... పంపాను
  rationale: సమ్మిళిత క్రియ తీతుతో కలిసి మరొకరిని పంపిన భావాన్ని ఇస్తుంది; తెలుగులో సంబంధాన్ని స్పష్టంగా చెప్పడం సహజం.
- source_word: τὸν ἀδελφόν
  choice: ఆ సహోదరుణ్ణి
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం ఉంది, స్వామ్యసూచక పదం లేదు. అందువల్ల ‘మన సహోదరుణ్ణి’ అని చేర్చకుండా, వారికి తెలిసిన విశ్వాసిని సూచించేలా ‘ఆ సహోదరుణ్ణి’ అని అనువదించబడింది.
- source_word: μήτι ἐπλεονέκτησεν ὑμᾶς
  choice: తీతు మీ నుండి అన్యాయంగా లాభం పొందలేదు కదా?
  rationale: μήτι ప్రతికూల సమాధానాన్ని ఆశించే ప్రశ్నను సూచిస్తుంది. πλεονεκτέω ఇతరుల నష్టంపై ప్రయోజనం పొందడం లేదా దోచుకోవడం అనే భావం కలిగి ఉంది; ‘అన్యాయంగా లాభం పొందడం’ ఆర్థిక సందర్భాన్ని చూపుతూ, ‘మోసం చేశాడు’ అనే మరీ సంకుచిత అర్థాన్ని రుద్దదు.
- source_word: τῷ αὐτῷ πνεύματι
  choice: ఒకే ఆత్మతో
  rationale: దత్తివిభక్తి విధానాన్ని లేదా పరిధిని సూచించవచ్చు. ‘ఆత్మతో’ అనే రూపం ఒకే మనోభావం అనే ప్రధాన సందర్భార్థాన్నీ, పరిశుద్ధాత్మకు సాధ్యమైన సూచననూ పూర్తిగా మూసివేయకుండా ఉంచుతుంది.
- source_word: περιεπατήσαμεν
  choice: నడుచుకోలేదా
  rationale: ‘నడవడం’ అనే పౌలు రూపకాన్ని తెలుగులో ప్రవర్తనను సూచించే సహజమైన ‘నడుచుకోవడం’ ద్వారా నిలుపుతుంది.
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: ఒకే అడుగుజాడల్లో
  rationale: ἴχνος యొక్క అడుగుజాడ/బాట అనే రూపకాన్ని సహజమైన తెలుగు నుడికారంతో కాపాడుతుంది.
theological_decisions:
- issue: ‘ఒకే ఆత్మతో’ అనే పదబంధం యొక్క భావం
  choice: పౌలు, తీతు ఇద్దరిలోని ఒకే మనోభావం లేదా వైఖరి; అయితే ‘ఆత్మ’ అనే ఉద్దేశపూర్వకంగా విస్తృతమైన పదంతో వ్యక్తీకరించబడింది
  alternative: ఒకే పరిశుద్ధాత్మచేత నడిపించబడటం
  rationale: తక్షణ సందర్భం పౌలు, తీతుల నిజాయితీగల ఒకే విధమైన ప్రవర్తన గురించి మాట్లాడుతుంది. అయినా πνεῦμα పరిశుద్ధాత్మను సూచించే అవకాశాన్ని పూర్తిగా తొలగించలేం; అందువల్ల ప్రధాన పాఠం మరియు పాదసూచిక కలిసి ఈ అర్థసందిగ్ధతను కాపాడుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. వరుస ప్రశ్నల్లో గ్రీకు పాఠం ఆశించే ప్రతికూల సమాధానాన్ని ‘లేదు కదా?’ రూపం సహజంగా వ్యక్తం చేస్తుంది; అడుగుజాడల రూపకం నిలుపబడింది.
