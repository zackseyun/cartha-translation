id: 2CO.12.2
reference: 2 Corinthians 12:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: te
  text: మెస్సీయలో[a] ఉన్న ఒక మనిషి నాకు తెలుసు. పద్నాలుగు సంవత్సరాల క్రితం అతడు—శరీరంలోనో, నాకు తెలియదు; శరీరానికి వెలుపలగానో, నాకు తెలియదు[b]; దేవునికి తెలుసు—మూడవ ఆకాశం[c] వరకు పైకి ఎత్తుకుపోబడ్డాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా సంప్రదాయంగా, “క్రీస్తులో.” గ్రీకు పదబంధం ἐν Χριστῷ; ఇక్కడ బిరుదు భావాన్ని నిలుపడానికి “మెస్సీయ” అని అనువదించబడింది.
    reason: alternative_reading
  - marker: b
    text: ఇది శరీరంలో జరిగిందా, శరీరానికి వెలుపల జరిగిందా అని పౌలు చెప్పడం లేదు; అనుభవం ఏ విధంగా జరిగిందనే ప్రశ్నను పాఠం పరిష్కరించకుండా ఉంచుతుంది.
    reason: theological_ambiguity
  - marker: c
    text: “మూడవ ఆకాశం” అనేది ప్రాచీన యూదుల విశ్వచిత్ర భాష. ఇది అత్యున్నత ఆకాశాన్ని లేదా పరదైసును సూచించవచ్చు; అనువాదం మూలంలోని వ్యక్తీకరణనే నిలుపుతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: οἶδα
  choice: నాకు తెలుసు
  rationale: కొయినే గ్రీకులో పరిపూర్ణ రూపమైన οἶδα వర్తమానార్థాన్ని ఇస్తుంది; తెలుగులో ‘నాకు తెలుసు’ సహజమైన సమానార్థకం.
- source_word: ἄνθρωπον
  choice: ఒక మనిషి
  rationale: ఇక్కడ పురుష ఏకవచనంలో ఒక నిర్దిష్ట వ్యక్తిని సూచిస్తోంది; సందర్భంలో పౌలు తన గురించే పరోక్షంగా మాట్లాడుతున్నాడు.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో ఉన్న
  rationale: Χριστός ఇక్కడ బిరుదు; ‘మెస్సీయ’ దాని బిరుదార్థాన్ని నిలుపుతుంది. ‘లో’ అనే విభక్తి పౌలు వాడిన సంబంధం/ఐక్యత భాషను వివరించి తేల్చకుండా కాపాడుతుంది.
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: పద్నాలుగు సంవత్సరాల క్రితం
  rationale: కాలాన్ని సూచించే πρό + షష్ఠీ విభక్తికి ఇది సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: εἴτε ἐν σώματι
  choice: శరీరంలోనో
  rationale: పౌలు ఉంచిన శరీరంలో/శరీరానికి వెలుపల అనే ప్రత్యక్ష వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ἐκτὸς τοῦ σώματος
  choice: శరీరానికి వెలుపలనో
  rationale: ἐκτός + షష్ఠీ విభక్తి యొక్క ప్రత్యక్ష భావాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తూ, ‘శరీరంలోనో’ అన్నదానికి వ్యతిరేకతను నిలుపుతుంది.
- source_word: ὁ θεὸς οἶδεν
  choice: దేవునికి తెలుసు
  rationale: మూలంలోని సరళ వాక్యాన్ని అనుసరిస్తుంది; గ్రీకులో లేని ‘మాత్రమే’ అనే భావాన్ని చేర్చదు.
- source_word: ἁρπαγέντα
  choice: పైకి ఎత్తుకుపోబడ్డాడు
  rationale: ఆకస్మికంగా పైకి తీసుకుపోవబడిన భావాన్ని సహజమైన తెలుగు కర్మణి రూపంలో అందిస్తుంది; ఎవరు తీసుకెళ్లారో మూలం స్పష్టంగా చెప్పనందున అనవసరంగా కర్తను చేర్చదు.
- source_word: ἕως τρίτου οὐρανοῦ
  choice: మూడవ ఆకాశం వరకు
  rationale: ἕως యొక్క ‘వరకు’ భావాన్ని నిలుపుతూ గమ్యస్థానాన్ని సహజంగా తెలుపుతుంది.
theological_decisions:
- issue: ἐν Χριστῷ అనే పదబంధంలో Χριστῷ అనువాదం
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: Χριστός యొక్క బిరుదార్థాన్ని అనువదించి చూపేందుకు ‘మెస్సీయ’ వాడబడింది; సంప్రదాయ రూపం పాదటిప్పణిలో ఇవ్వబడింది.
- issue: ఈ అనుభవం శరీరంలో జరిగిందా, శరీరానికి వెలుపల జరిగిందా
  choice: పౌలు వ్యక్తం చేసిన అనిశ్చితిని రెండుసార్లు అలాగే నిలుపడం
  alternative: శరీరసహిత ఆరోహణ లేదా శరీరరహిత దర్శనం అని నిర్ణయించడం
  rationale: గ్రీకు పాఠం ఈ అనుభవ విధానాన్ని స్పష్టంగా తేల్చదు; పౌలు రెండుసార్లు తనకు తెలియదని చెప్పి దేవునికి తెలుసని అంటాడు.
- issue: ‘మూడవ ఆకాశం’ యొక్క అర్థం
  choice: మూలంలోని రూపకల్పనను యథాతథంగా ఉంచడం
  alternative: అత్యున్నత ఆకాశం లేదా పరదైసు అని వివరణాత్మకంగా అనువదించడం
  rationale: ప్రాచీన యూదుల విశ్వచిత్ర భాషను అనువాదంలోనే పరిష్కరించకుండా, వివరణను పాదటిప్పణికి పరిమితం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని విరామాత్మక నిర్మాణం, రెండుసార్లు పలికిన ‘నాకు తెలియదు,’ కర్మణి ప్రయోగం, అలాగే అనుభవ విధానంపై ఉన్న అనిశ్చితి నిలుపబడ్డాయి.
