id: 2CO.12.1
reference: 2 Corinthians 12:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: te
  text: గొప్పలు చెప్పుకోవడం తప్పదు. అది ప్రయోజనకరం కాదు; అయినా, ప్రభువు దర్శనాలూ ప్రత్యక్షతలూ[a] అనే విషయానికి వస్తాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువు నుండి వచ్చిన దర్శనాలూ ప్రత్యక్షతలూ.” గ్రీకు పదబంధం వాటి మూలం ప్రభువే అని సూచించవచ్చు; అయితే అది సంబంధాన్ని మరింత సాధారణంగా కూడా ఉంచుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: గొప్పలు చెప్పుకోవడం
  rationale: మధ్యమవాచక భావాన్ని, పౌలు తనను గురించే గొప్పగా చెప్పుకోవలసి వస్తున్న సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δεῖ
  choice: తప్పదు
  rationale: అవసరం లేదా అనివార్యత అనే భావాన్ని సంక్షిప్తంగా, బలంగా వ్యక్తం చేస్తుంది; ఇది ఇష్టపూర్వకంగా గొప్పలు చెప్పుకోవడం కాదనే సందర్భాన్నీ అనుకూలంగా నిలుపుతుంది.
- source_word: οὐ συμφέρον μέν
  choice: అది ప్రయోజనకరం కాదు
  rationale: συμφέρονలోని మేలు కలిగించే లేదా ప్రయోజనకరమైనది అనే భావాన్ని స్పష్టంగా అందిస్తుంది; μέν తరువాతి δέతో ఏర్పడే వ్యత్యాసం విరామచిహ్నం మరియు ‘అయినా’ ద్వారా వ్యక్తమవుతుంది.
- source_word: ἐλεύσομαι δὲ εἰς
  choice: అయినా, … అనే విషయానికి వస్తాను
  rationale: ఇక్కడి గమనార్థక క్రియ కొత్త అంశానికి మారడాన్ని సూచిస్తుంది. ‘విషయానికి వస్తాను’ తెలుగు సంభాషణలో సహజంగా ఆ భావాన్ని అందిస్తుంది; ‘అయినా’ δέలోని వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ὀπτασίας
  choice: దర్శనాలు
  rationale: అసాధారణంగా లేదా దైవికంగా కనిపించిన దృశ్యానుభవాలను సూచించే సాధారణమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: ἀποκαλύψεις
  choice: ప్రత్యక్షతలు
  rationale: దాచబడినది బయలుపరచబడటం లేదా దైవికంగా తెలియజేయబడటం అనే భావాన్ని మతపరమైన సందర్భంలో సంక్షిప్తంగా అందించే స్థిరమైన పదం.
- source_word: κυρίου
  choice: ప్రభువు … [యొక్క]
  rationale: తెలుగు సమాససదృశ నిర్మాణమైన ‘ప్రభువు దర్శనాలూ ప్రత్యక్షతలూ’ మూలంలోని సంబంధవాచక షష్ఠీ విభక్తిని అతిగా వివరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: κυρίουకు ‘దర్శనాలు, ప్రత్యక్షతలు’తో ఉన్న సంబంధం
  choice: ప్రభువు దర్శనాలూ ప్రత్యక్షతలూ
  alternative: ప్రభువు నుండి వచ్చిన దర్శనాలూ ప్రత్యక్షతలూ
  rationale: గ్రీకు షష్ఠీ విభక్తి మూలాన్ని సూచించవచ్చు, కానీ ఆ సంబంధాన్ని స్పష్టంగా ‘నుండి వచ్చిన’ అని నిర్ణయించదు. ప్రధాన పాఠంలోని సంక్షిప్త నిర్మాణం ఆ అస్పష్టతను కొంతవరకు నిలుపుతుంది; ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పౌలు వాదనలోని సంకోచం మరియు వ్యత్యాసం నిలిచే గౌరవప్రదమైన శైలి. ‘ప్రభువు’ అనే పదం κύριοςకు ప్రాజెక్టు స్థిర అనువాదంగా వాడబడింది.
