id: 2CO.12.3
reference: 2 Corinthians 12:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οἶδα τὸν τοιοῦτον ἄνθρωπον— εἴτε ἐν σώματι εἴτε ⸀χωρὶς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/003.yaml
  text: And I know such a man—whether in the body or apart from the body I do not know[a]; God knows—
translation:
  language: te
  text: అలాంటి మనిషి నాకు తెలుసు—అతడు శరీరంలో ఉన్నాడో, శరీరానికి వేరుగా ఉన్నాడో నాకు తెలియదు[a]; దేవునికి తెలుసు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శరీరానికి వేరుగా’ అనే మాటను ‘శరీరం వెలుపల’ అని కూడా అనువదించవచ్చు. ఆ అనుభవం శరీరసహితంగా జరిగిందో లేదో పౌలు చెప్పడం లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: తెలుసు
  rationale: జ్ఞానాన్ని సూచించే సాధారణ, సహజమైన తెలుగు పదం. ఈ వచనంలోని పునరుక్తిని ‘తెలుసు’ రూపంతో నిలిపాం.
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: అలాంటి మనిషి
  rationale: ముందటి సందర్భంలో పేర్కొన్న నిర్దిష్ట పురుషుణ్ణి సూచించే గ్రీకు పుంలింగ ఏకవచనాన్ని, అలాగే పౌలు పాటించిన పరోక్ష స్వీయసూచనను కాపాడుతుంది.
- source_word: εἴτε ... εἴτε
  choice: …ఓ, …ఓ
  rationale: రెండు ప్రత్యామ్నాయ అవకాశాలను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἐν σώματι
  choice: శరీరంలో
  rationale: మూలంలోని స్థానార్థక రూపాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: χωρὶς τοῦ σώματος
  choice: శరీరానికి వేరుగా
  rationale: χωρίς సూచించే వేరుపాటును తెలియజేస్తూ, అనుభవం తప్పనిసరిగా శరీరం వెలుపల జరిగిందని అతిగా నిర్ధారించదు.
- source_word: οὐκ οἶδα, ὁ θεὸς οἶδεν
  choice: నాకు తెలియదు; దేవునికే తెలుసు
  rationale: పౌలు ఎరుగకపోవడానికీ దేవుడు ఎరుగడానికీ మధ్య వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది; ‘కే’ ఆ వ్యత్యాసానికి సహజమైన తెలుగు ఉద్ఘాటన ఇస్తుంది.
- source_word: θεὸς
  choice: దేవుడు
  rationale: దేవునికి ప్రామాణికమైన తెలుగు పదం.
theological_decisions:
- issue: పౌలు పరోక్షంగా తనను సూచించడం మరియు అనుభవ స్వభావం
  choice: ‘అలాంటి మనిషి’ అనే మూడవ పురుష సూచనను నిలిపి, అనుభవం శరీరసహితమా లేక శరీరానికి వేరుగా జరిగిందా అన్నది పరిష్కరించకుండా ఉంచడం.
  alternative: ఆ మనిషి పౌలేనని అనువాదంలో స్పష్టం చేయడం లేదా ఇది శరీరం వెలుపలి అనుభవమని నిర్ణయాత్మకంగా చెప్పడం.
  rationale: గ్రీకు పాఠం పరోక్షతను పాటిస్తుంది; అనుభవం శరీరంలో జరిగిందా, శరీరానికి వేరుగా జరిగిందా అన్నది పౌలే తెలియదని చెబుతుంది. కాబట్టి ఆ ఉద్దేశపూర్వక అనిశ్చితిని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని డాష్‌లను, అసంపూర్ణంగా ముందుకు సాగే వాక్య నిర్మాణాన్ని సాధ్యమైనంతగా నిలిపాం.
