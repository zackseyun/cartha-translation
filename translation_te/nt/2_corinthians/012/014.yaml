id: 2CO.12.14
reference: 2 Corinthians 12:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: te
  text: ఇదిగో, మూడోసారి నేను మీ దగ్గరికి రావడానికి సిద్ధంగా ఉన్నాను. నేను మీకు భారంగా ఉండను.[b] ఎందుకంటే నాకు కావలసింది మీకున్నవి కాదు, మీరే. తల్లిదండ్రుల కోసం పిల్లలు కూడబెట్టాల్సిన బాధ్యత లేదు; పిల్లల కోసం తల్లిదండ్రులే కూడబెట్టాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: “భారంగా ఉండను” అని అనువదించిన క్రియ, ఎవరి మీదైనా—ముఖ్యంగా ఆర్థికంగా—భారం మోపడమనే భావాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: శ్రోతల దృష్టిని ఆకర్షించే గ్రీకు సంభాషణ సూచకాన్ని ఆధునిక, సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: మీ దగ్గరికి రావడానికి నేను సిద్ధంగా ఉండడం ఇది మూడోసారి
  rationale: ఇది మూడవ వాస్తవ సందర్శన అని తప్పనిసరిగా తేల్చకుండా, పౌలు మూడోసారి సిద్ధంగా ఉన్నాడనే గ్రీకు వాక్యంలోని భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καταναρκήσω
  choice: మీకు భారంగా ఉండను
  rationale: ఈ సందర్భంలో ఆర్థికంగా లేదా వస్తుపరంగా భారం మోపకపోవడాన్ని సూచించే క్రియకు సహజమైన తెలుగు రూపం; విస్తృత రూపకాల భావాన్నీ నిలుపుతుంది.
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: నాకు కావలసింది మీకున్నవి కాదు, మీరే
  rationale: వారి ఆస్తులకు, వారికే మధ్య ఉన్న బలమైన వ్యత్యాసాన్ని సహజమైన తెలుగులో కాపాడుతుంది.
- source_word: ὀφείλει
  choice: కూడబెట్టాల్సిన బాధ్యత లేదు
  rationale: నైతిక లేదా సంబంధపరమైన కర్తవ్యాన్ని సూచించే గ్రీకు భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: θησαυρίζειν
  choice: కూడబెట్టడం
  rationale: భవిష్యత్తు కోసం సంపద లేదా వనరులు దాచిపెట్టే భావాన్ని సందర్భానుకూలంగా, అతివ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: γονεῦσιν / γονεῖς; τέκνα / τέκνοις
  choice: తల్లిదండ్రులు; పిల్లలు
  rationale: గ్రీకు పదాల లింగసమగ్ర, సాధారణ కుటుంబార్థాన్ని సరిగ్గా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ‘మూడోసారి’ అనేది మూడవ సందర్శననా, లేక మూడవసారి సిద్ధపడటమా?
  choice: మూడోసారి సిద్ధంగా ఉండడంగా అనువదించడం
  alternative: ‘నేను మూడోసారి మీ దగ్గరికి రావడానికి సిద్ధంగా ఉన్నాను’ లేదా ‘ఇది నేను మీ దగ్గరికి వచ్చే మూడోసారి’
  rationale: గ్రీకు నిర్మాణం ‘మూడోసారి’ అనే మాటను సిద్ధంగా ఉండడంతో అనుసంధానించడానికి వీలు ఇస్తుంది. అందువల్ల ముందరి రెండు సందర్శనలు తప్పకుండా జరిగాయని అనువాదమే నిర్ణయించకుండా మూలంలోని చారిత్రక అస్పష్టతను నిలుపుతుంది.
- issue: ‘భారంగా ఉండను’ అనే మాట యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో సాధారణ రూపకాన్ని ఉంచి, ఆర్థిక భావాన్ని పాదటిప్పణిలో సూచించడం
  alternative: ‘మీపై ఆర్థిక భారం మోపను’
  rationale: సందర్భంలో ఆర్థిక సహాయం ప్రధానంగా ఉన్నప్పటికీ, గ్రీకు క్రియను పూర్తిగా ఆర్థిక పదబంధానికే పరిమితం చేయకుండా దాని విస్తృత రూపకాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వచనం. ‘మీ దగ్గరికి’ సాధారణ పాఠకులకు సహజంగా ఉండగా, ‘మీకున్నవి కాదు, మీరే’ అనే నిర్మాణం మూలంలోని పదునైన వ్యక్తులు–వస్తువులు వ్యత్యాసాన్ని నిలుపుతుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
