revisions:
- from: అతడు పరదైసులోకి ఎత్తుకొని పోబడ్డాడనీ, మాటల్లో చెప్పలేని మాటలు[a]—మనిషి పలకడానికి అనుమతి లేని మాటలు—విన్నాడనీ నాకు తెలుసు.
  to: అతడు పరదైసులోకి ఎత్తుకుపోబడాడనీ, మనిషికి పలకడానికి అనుమతిలేని చెప్పలేని మాటలు[a] విన్నాడనీ.
  rationale: The revision removes material not contained in this verse, improves the Telugu passive expression for ἡρπάγη, and preserves the source text’s syntactic dependence and its distinction between unspeakable sayings and sayings not permitted for a human to speak.
