id: 2CO.12.4
reference: 2 Corinthians 12:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: te
  text: అతడు పరదైసులోకి ఎత్తుకుపోబడాడనీ, మనిషికి పలకడానికి అనుమతిలేని చెప్పలేని మాటలు[a] విన్నాడనీ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పలకరాని మాటలు.” గ్రీకు పదం పలకడానికి వీలులేని లేదా పలకకూడని మాటలను సూచించవచ్చు; తరువాతి భాగం వాటిని పలకడానికి మనిషికి అనుమతి లేదని స్పష్టంగా చెబుతుంది.
    reason: ἄρρητα యొక్క భావవ్యాప్తిని నమోదు చేయడానికి; తరువాతి οὐκ ἐξόν ἀνθρώπῳ λαλῆσαι ద్వారా స్పష్టమయ్యే అనుమతి-లేమిని వేరుగా నిలుపడానికి.
lexical_decisions:
- source_word: ἡρπάγη
  choice: ఎత్తుకొని పోబడ్డాడు
  rationale: బలంగా లేదా అకస్మాత్తుగా కొనిపోవబడటాన్ని సూచించే గ్రీకు కర్మణి రూపాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కార్యాన్ని చేసినవారిని మూలపాఠంలాగే పేర్కొనదు.
- source_word: παράδεισον
  choice: పరదైసు
  rationale: గ్రీకు పదంలోని ప్రత్యేక భావపరిధిని నిలుపుతూ, దానిని నేరుగా ‘స్వర్గం’ లేదా ‘ఏదేను తోట’గా నిర్ధారించకుండా ఉంచుతుంది.
- source_word: ἄρρητα ῥήματα
  choice: మాటల్లో చెప్పలేని మాటలు
  rationale: పలకలేనివి లేదా పలకరానివి అనే ἄρρητα పదంలోని ఉద్రిక్తతను నిలుపుతుంది; తరువాతి సంబంధ వాక్యం అనుమతి లేకపోవడాన్ని స్పష్టంచేస్తుంది.
- source_word: οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι
  choice: మనిషి పలకడానికి అనుమతి లేని మాటలు
  rationale: ἐξόν సూచించే అనుమతి లేదా అధికారం లేకపోవడాన్ని స్పష్టంగా తెలుపుతుంది; ἀνθρώπῳను సాధారణ మానవ సూచనగా ‘మనిషి’ అని అనువదిస్తుంది.
theological_decisions:
- issue: పరదైసు యొక్క ఖచ్చిత స్థానం లేదా స్వరూపం
  choice: ‘పరదైసు’ అనే పదాన్నే నిలుపడం
  alternative: ‘స్వర్గం’ లేదా ‘ఏదేను తోట’
  rationale: మూలపాఠం ఇక్కడ పరదైసును మరింత ఖచ్చితంగా నిర్వచించదు; ఒక నిర్దిష్ట సిద్ధాంతపరమైన గుర్తింపును అనువాదంలోకి దిగుమతి చేయలేదు.
- issue: ఆ మాటలను పలకలేకపోవడమా లేక పలకడానికి అనుమతి లేకపోవడమా
  choice: మొదటి పదబంధంలో విస్తృత భావాన్ని ఉంచి, తరువాతి భాగంలో అనుమతి లేదని స్పష్టంచేయడం
  alternative: రెండు చోట్లా కేవలం ‘పలకడం నిషిద్ధం’ అని అనువదించడం
  rationale: ἄρρητα యొక్క భావవ్యాప్తిని కాపాడుతూ, οὐκ ἐξόν ఇచ్చే స్పష్టమైన నిషేధం లేదా అనుమతి లేమిని కూడా యథాతథంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ఈ వాక్యం ముందటి వచనంలోని ‘అటువంటి మనిషి’ గురించి కొనసాగుతున్నందున, సందర్భసంబంధాన్ని నిలుపడానికి ‘అతడు… అని నాకు తెలుసు’ అనే నిర్మాణం వాడబడింది.
