id: 2CO.12.15
reference: 2 Corinthians 12:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: te
  text: నేను మీ ప్రాణాల కోసం[a] అత్యంత ఇష్టపూర్వకంగా ఖర్చు చేస్తాను; నన్ను నేనే పూర్తిగా వెచ్చించుకుంటాను. నేను మిమ్మల్ని మరింతగా ప్రేమిస్తే, నేను తక్కువగా ప్రేమించబడుతున్నానా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ జీవితాల కోసం,” లేదా “మీరే.”
    reason: ψυχή అనే గ్రీకు పదం ఈ సందర్భంలో ప్రాణం, జీవితం, లేదా వ్యక్తినే సూచించవచ్చు.
lexical_decisions:
- source_word: ἥδιστα
  choice: ఎంతో సంతోషంగా
  rationale: అత్యున్నత స్థాయి సంతోషపూర్వక సంసిద్ధతను తెలిపే క్రియావిశేషణం. పౌలు అయిష్టంగా కాక, హృదయపూర్వకంగా సిద్ధంగా ఉన్నాడనే తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δαπανήσω
  choice: ఖర్చు చేస్తాను
  rationale: వనరులను వెచ్చించడం అనే వ్యయ రూపకాన్ని నిలుపుతుంది; తరువాతి ἐκδαπανηθήσομαιతో ఉన్న పదజోడును కూడా స్పష్టంగా ఉంచుతుంది.
- source_word: ἐκδαπανηθήσομαι
  choice: నేనే పూర్తిగా ఖర్చైపోతాను
  rationale: మొదటి క్రియను తీవ్రతరం చేస్తూ, పౌలు తన దగ్గర ఉన్నదానినే కాదు తనను తానే పూర్తిగా వెచ్చించుకోవడానికి సిద్ధమని చూపుతుంది. తెలుగు వాక్యంలో రూపకంలోని ఉద్దేశపూర్వక అసాధారణతను నిలిపింది.
- source_word: ὑπὲρ
  choice: కోసం
  rationale: ఇక్కడ ప్రయోజనం, మేలు అనే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: మీ ప్రాణాల కోసం
  rationale: ψυχήకి ఉండే ప్రాణం, జీవితం, వ్యక్తి అనే భావ పరిధిని 'ప్రాణాలు' కొంతవరకు నిలుపుతుంది; దానిని తప్పనిసరిగా సాంకేతిక మానవశాస్త్రీయ అర్థంలోని 'ఆత్మలు'గా నిర్ధారించదు.
- source_word: εἰ
  choice: అయితే
  rationale: గ్రీకులోని షరతుతో కూడిన అలంకారిక ప్రశ్నను వ్యాఖ్యానాత్మకంగా 'కాబట్టి' లేదా 'ఎందుకంటే'గా మార్చకుండా నిలుపుతుంది.
- source_word: περισσοτέρως
  choice: మరింతగా
  rationale: ప్రేమ అధికమవుతున్న పరిమాణాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; కేవలం సాధారణ పోలిక కంటే బలమైన భావాన్ని సందర్భం అందిస్తుంది.
- source_word: ἀγαπῶν
  choice: నేను మిమ్మల్ని ... ప్రేమిస్తే
  rationale: గ్రీకు కృదంతాన్ని తెలుగు షరతు వాక్యానికి సహజమైన సమాపక క్రియగా మార్చి, భావాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: ἧσσον ἀγαπῶμαι
  choice: మీరు నన్ను తక్కువగా ప్రేమిస్తారా?
  rationale: గ్రీకు నిష్క్రియ రూపాన్ని తెలుగులో సహజమైన కర్తరి ప్రశ్నగా వ్యక్తం చేసింది. సందర్భంలో సంబోధితులే సూచిత కర్తలు; ప్రేమలోని వ్యత్యాసం మరియు అలంకారిక ఫిర్యాదు రెండూ నిలుస్తాయి.
theological_decisions:
- issue: పౌలు వాడిన ψυχαί పదాన్ని సంఘపాలనా సందర్భంలో అనువదించడం
  choice: మీ ప్రాణాలు
  alternative: మీ జీవితాలు; మీరే
  rationale: ఈ పదం కేవలం శరీరానికి వేరైన అమర భాగాన్ని మాత్రమే సూచిస్తుందని వచనం నిర్ధారించదు. 'ప్రాణాలు' అనే ఎంపిక పౌలు చూపుతున్న లోతైన వ్యక్తిగత శ్రద్ధను నిలుపుతూ, సాధ్యమైన 'జీవితాలు' లేదా 'మీరే' అనే అర్థాలను పాదసూచికలో తెలియజేస్తుంది.
- issue: ἀγαπῶμαι అనే నిష్క్రియ క్రియలో సూచిత కర్త
  choice: మీరు నన్ను తక్కువగా ప్రేమిస్తారా?
  alternative: నేను తక్కువగా ప్రేమించబడుతున్నానా?
  rationale: గ్రీకు రూపం కర్తను ప్రత్యక్షంగా పేర్కొనకపోయినా, ప్రశ్న కొరింథీయులను నేరుగా ఉద్దేశిస్తుంది. తెలుగు సహజత్వం కోసం వారిని కర్తగా వ్యక్తం చేశాము; ఇది కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, నేరుగా అర్థమయ్యే శైలి. 'ఖర్చు చేస్తాను; నేనే పూర్తిగా ఖర్చైపోతాను' అనే పదజోడు సాధారణ తెలుగు కంటే కొద్దిగా రూపకాలంకారపూర్వకమైనదైనా, మూలంలోని వ్యయ రూపకాన్ని మరియు దాని పెరుగుతున్న తీవ్రతను ఉద్దేశపూర్వకంగా నిలుపుతుంది.
