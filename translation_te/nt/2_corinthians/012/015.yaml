revisions:
- from: నేను మీ ప్రాణాల కోసం[a] ఎంతో సంతోషంగా ఖర్చు చేస్తాను; నేనే పూర్తిగా ఖర్చైపోతాను. నేను మిమ్మల్ని మరింతగా ప్రేమిస్తే, మీరు నన్ను తక్కువగా ప్రేమిస్తారా?
