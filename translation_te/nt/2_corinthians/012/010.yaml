id: 2CO.12.10
reference: 2 Corinthians 12:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: te
  text: కాబట్టి మెస్సీయ[a] కోసం బలహీనతల్లో, అవమానాల్లో, కష్టాల్లో, హింసల్లో, ఇరుకు పరిస్థితుల్లో నేను ఆనందిస్తాను. ఎందుకంటే నేను బలహీనుడిగా ఉన్నప్పుడే బలవంతుడిని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయంగా, “క్రీస్తు కోసం.”
    reason: Χριστόςకు తెలుగులో సంప్రదాయంగా వాడే ప్రత్యామ్నాయ రూపాన్ని అందించడం.
lexical_decisions:
- source_word: διὸ
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణను సహజమైన తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: εὐδοκῶ
  choice: నేను ఆనందిస్తాను
  rationale: కేవలం భరించడం లేదా సర్దుకుపోవడం కాకుండా, అనుకూలంగా స్వీకరించి సంతోషించే భావాన్ని వ్యక్తం చేస్తుంది; పౌలు చెప్పే విరోధాభాసాన్ని నిలుపుతుంది.
- source_word: ἐν ἀσθενείαις
  choice: బలహీనతల్లో
  rationale: బహువచనాన్ని, అలాగే శారీరక అనారోగ్యానికే పరిమితం కాని విస్తృతమైన బలహీనత భావాన్ని కాపాడుతుంది.
- source_word: ἐν ὕβρεσιν
  choice: అవమానాల్లో
  rationale: అవహేళనతో కూడిన దూషణ లేదా అవమానకరమైన ప్రవర్తన అనే సందర్భోచిత భావాన్ని తెలియజేస్తుంది.
- source_word: ἐν ἀνάγκαις
  choice: కష్టాల్లో
  rationale: ఒత్తిడి కలిగించే అనివార్య పరిస్థితులు, ఇబ్బందులు అనే సందర్భార్థాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: ἐν διωγμοῖς
  choice: హింసల్లో
  rationale: క్రీస్తుపట్ల విశ్వాసం కారణంగా ఎదురయ్యే పీడనలను సూచించే పౌలు వాడుకకు తగిన పదం.
- source_word: καὶ στενοχωρίαις
  choice: ఇరుకు పరిస్థితుల్లో
  rationale: చుట్టుముట్టి బయటపడే మార్గం లేనట్లుగా తీవ్రమైన ఒత్తిడిలో ఉండే మూలపద చిత్రాన్ని, జాబితాలోని ఇతర పదాలతో పూర్తిగా కలిపివేయకుండా నిలుపుతుంది.
- source_word: ὑπὲρ Χριστοῦ
  choice: మెస్సీయ కోసం
  rationale: ὑπέρ ఇక్కడ ఆయన నిమిత్తం లేదా ఆయనపట్ల నిబద్ధత కారణంగా అనే భావాన్ని ఇస్తుంది; Χριστός యొక్క బిరుదు భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది.
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: ఎందుకంటే నేను బలహీనుడిగా ఉన్నప్పుడే
  rationale: ὅταν తో వర్తమాన సంభావనార్థక క్రియ ఇచ్చే సాధారణ కాలసంబంధ భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘అప్పుడే’ తరువాతి విరోధాభాసాన్ని బలపరుస్తుంది.
- source_word: τότε δυνατός εἰμι
  choice: బలవంతుడిని
  rationale: ‘బలహీనుడు’కి సహజమైన వ్యతిరేక పదాన్ని ఉపయోగించి పౌలు విరోధాభాసాన్ని స్పష్టంగా కాపాడుతుంది.
theological_decisions:
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστόςను బిరుదుగా గ్రహించవచ్చు కాబట్టి దాని యూదీయ మెస్సీయ భావపరిధిని ‘మెస్సీయ’ నిలుపుతుంది. తెలుగులో సంప్రదాయంగా స్థిరపడిన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఉంచి ప్రత్యామ్నాయాన్ని చూపించాం.
- issue: బలహీనతలో బలం అనే విరోధాభాసం
  choice: నేను బలహీనుడిగా ఉన్నప్పుడే బలవంతుడిని
  alternative: నేను బలహీనుడిగా ఉన్నప్పుడు శక్తిమంతుడనవుతాను
  rationale: మూలంలో బలం ఎవరిది లేదా అది ఎలా కలుగుతుందో ఈ వాక్యంలో స్పష్టంగా చెప్పలేదు. అందువల్ల వివరణాత్మకంగా దేవుని శక్తిని చేర్చకుండా అసలు వాక్యంలోని సంక్షిప్తతను, తాత్త్విక ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని పునరుక్త ἐν నిర్మాణాన్ని వరుసగా ‘-ల్లో’ రూపాలతో ప్రతిబింబించాం; అయితే తెలుగులో సహజమైన వాక్యప్రవాహం కోసం క్రియను జాబితా తర్వాత ఉంచాం.
