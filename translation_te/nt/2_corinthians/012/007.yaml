  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: te
  text: 'ఆ ప్రత్యక్షతల అసాధారణ గొప్పతనం కారణంగా—నేను గర్వంతో ఉప్పొంగిపోకుండా ఉండేందుకు—నా శరీరంలో ఒక ముల్లు[a]—సాతాను దూత[b]—నాకు ఇవ్వబడింది; అతడు నన్ను దెబ్బలతో కొట్టేందుకు[c], నేను గర్వంతో ఉప్పొంగిపోకుండా ఉండేందుకు[d] ఇవ్వబడింది.[e]


    [a] లేదా “నా శరీరంలో ఒక పదునైన మేకు.” σκόλοψ అనే గ్రీకు పదం ముల్లు, చెక్కచీలిక, లేదా పదునైన మేకును సూచించవచ్చు; ఇక్కడ ఉద్దేశించిన రూపకం ఖచ్చితంగా ఏదో తెలియదు.


    [b] లేదా “సాతాను యొక్క దేవదూత.” ἄγγελος అనే గ్రీకు పదానికి “దూత” లేదా “దేవదూత” అనే అర్థాలు రావచ్చు.


    [c] లేదా “అతడు నన్ను బాధించేందుకు,” “అతడు నన్ను పిడిగుద్దులతో కొట్టేందుకు.” κολαφίζῃ అనే క్రియకు కొట్టడం, దెబ్బలు వేయడం అనే బలమైన భావం ఉంది.


    [d] “నేను గర్వంతో ఉప్పొంగిపోకుండా ఉండేందుకు” అనే మాట గ్రీకు పాఠంలో రెండుసార్లు ఉంది; ఆ పునరుక్తిని ఇక్కడ నిలిపి ఉంచాం.


    [e] ఈ వాక్యాన్ని ఇలా కూడా అనుసంధానించవచ్చు: “ఆ ప్రత్యక్షతల అసాధారణ గొప్పతనం కారణంగా నేను గర్వంతో ఉప్పొంగిపోకుండా ఉండేందుకు, నా శరీరంలో ఒక ముల్లు నాకు ఇవ్వబడింది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా శరీరంలో ఒక పదునైన మేకు.” σκόλοψ అనే గ్రీకు పదం ముల్లు, చెక్కచీలిక, లేదా పదునైన మేకును సూచించవచ్చు; ఇక్కడ ఉద్దేశించిన రూపకం ఖచ్చితంగా ఏదో తెలియదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “సాతాను యొక్క దేవదూత.” ἄγγελος అనే గ్రీకు పదానికి “దూత” లేదా “దేవదూత” అనే అర్థాలు రావచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా “అతడు నన్ను బాధించేందుకు,” “అతడు నన్ను పిడిగుద్దులతో కొట్టేందుకు.” κολαφίζῃ అనే క్రియకు కొట్టడం, దెబ్బలు వేయడం అనే బలమైన భావం ఉంది.
    reason: lexical_alternative
  - marker: d
    text: “నేను గర్వంతో ఉప్పొంగిపోకుండా ఉండేందుకు” అనే మాట గ్రీకు పాఠంలో రెండుసార్లు ఉంది; ఆ పునరుక్తిని ఇక్కడ నిలిపి ఉంచాం.
    reason: textual_transparency
  - marker: e
    text: 'ఈ వాక్యాన్ని ఇలా కూడా అనుసంధానించవచ్చు: “ఆ ప్రత్యక్షతల అసాధారణ గొప్పతనం కారణంగా నేను గర్వంతో ఉప్పొంగిపోకుండా ఉండేందుకు, నా శరీరంలో ఒక ముల్లు నాకు ఇవ్వబడింది.”'
    reason: syntactical_alternative
lexical_decisions:
- source_word: ὑπερβολῇ
  choice: అసాధారణ గొప్పతనం
  rationale: ప్రత్యక్షతల మితిమించిన విశిష్టతను తెలియజేస్తూ, ఆధునిక తెలుగులో సహజంగా వినిపించే రూపం.
- source_word: ἀποκαλύψεων
  choice: ప్రత్యక్షతలు
  rationale: దేవుడు బయలుపరచిన దర్శనాలు లేదా విషయాలు అనే పౌలు సందర్భానికి సరిపోయే ప్రామాణిక పదం.
- source_word: ὑπεραίρωμαι
  choice: నేను గర్వంతో ఉప్పొంగిపోకుండా
  rationale: తన్నుతాను హెచ్చించుకోవడం లేదా గర్వంతో పొంగిపోవడం అనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; పాఠంలోని పునరుక్తి రెండుసార్లూ నిలిపింది.
- source_word: ἐδόθη μοι
  choice: నాకు ఇవ్వబడింది
  rationale: కర్తను పేర్కొనని గ్రీకు కర్మణి ప్రయోగాన్ని అలాగే ఉంచి, ఇచ్చినవాడు దేవుడని అనువాదంలో చేర్చకుండా ఉంటుంది.
- source_word: σκόλοψ
  choice: ముల్లు
  rationale: బాధ కలిగించే పదునైన వస్తువు రూపకాన్ని సహజంగా నిలుపుతుంది; మేకు లేదా చీలిక అనే సాధ్యార్థాలను పాదసూచికలో ఉంచింది.
- source_word: τῇ σαρκί
  choice: నా శరీరంలో
  rationale: ఇక్కడ σάρξ నైతిక భావంలోని ‘పాప స్వభావం’ కంటే శారీరక జీవనాన్ని సూచించే అవకాశం ఎక్కువ; తెలుగులో ‘శరీరంలో’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: ἄγγελος Σατανᾶ
  choice: సాతాను దూత
  rationale: ἄγγελος మానవ దూతనో దేవదూతనో సూచించగలదు; ‘దూత’ ఆ గుర్తింపును నిర్ణయించకుండా విస్తృతార్థాన్ని నిలుపుతుంది.
- source_word: κολαφίζῃ
  choice: నన్ను దెబ్బలు కొడుతూ ఉండేందుకు
  rationale: పిడిగుద్దులతో కొట్టడం లేదా వరుసగా దెబ్బలు వేయడం అనే క్రియ యొక్క హింసాత్మక, కొనసాగుతున్న భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ‘శరీరంలోని ముల్లు’ స్వరూపం
  choice: ముల్లు అనే రూపకాన్ని మాత్రమే ఉంచడం
  alternative: శారీరక వ్యాధి, హింస లేదా వ్యతిరేకులు, దయ్య సంబంధమైన వేధింపు అని నిర్దిష్టీకరించడం
  rationale: గ్రీకు పాఠం ఆ బాధ ఏమిటో చెప్పదు; అందువల్ల సాధ్యమైన వివరణల్లో ఒక్కదాన్ని ప్రధాన పాఠంలో స్థిరపరచలేదు.
- issue: ‘నాకు ఇవ్వబడింది’ అనే మాటలో కర్త
  choice: కర్తను పేర్కొనని కర్మణి రూపం
  alternative: దేవుడు ఇచ్చాడు లేదా అనుమతించాడు
  rationale: దైవ అనుమతి సూచితమై ఉండవచ్చు, కాని ఈ వాక్యంలో ఇచ్చిన కర్తను ప్రత్యక్షంగా పేర్కొనలేదు.
- issue: ἄγγελος Σατανᾶ యొక్క గుర్తింపు
  choice: సాతాను దూత
  alternative: సాతాను దేవదూత లేదా మానవ ప్రతినిధి
  rationale: ఆ జీవి లేదా సాధనం ఏ స్వరూపమో పాఠం స్పష్టంగా నిర్ణయించదు; ‘దూత’ ఆ సందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు పాఠంలోని కర్మణి ప్రయోగం, రూపకం, ἄγγελος యొక్క సందిగ్ధత, చివరి ఉద్దేశ్యవాక్యపు పునరుక్తి నిలిపి ఉంచబడ్డాయి. విరామచిహ్నాలు మొదటి ఉద్దేశ్యవాక్యాన్ని స్పష్టంగా చూపించేందుకు ఉపయోగించబడ్డాయి.
