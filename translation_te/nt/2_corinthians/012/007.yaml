  to: 'ఆ ప్రత్యక్షతల అసాధారణ గొప్పతనం కారణంగా—నేను గర్వంతో ఉప్పొంగిపోకుండా ఉండేందుకు—నా శరీరంలో ఒక ముల్లు[a]—సాతాను దూత[b]—నాకు ఇవ్వబడింది; అతడు నన్ను దెబ్బలతో కొట్టేందుకు[c], నేను గర్వంతో ఉప్పొంగిపోకుండా ఉండేందుకు[d] ఇవ్వబడింది.[e]


    [a] లేదా “నా శరీరంలో ఒక పదునైన మేకు.” σκόλοψ అనే గ్రీకు పదం ముల్లు, చెక్కచీలిక, లేదా పదునైన మేకును సూచించవచ్చు; ఇక్కడ ఉద్దేశించిన రూపకం ఖచ్చితంగా ఏదో తెలియదు.


    [b] లేదా “సాతాను యొక్క దేవదూత.” ἄγγελος అనే గ్రీకు పదానికి “దూత” లేదా “దేవదూత” అనే అర్థాలు రావచ్చు.


