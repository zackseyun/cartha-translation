    [d] “నేను గర్వంతో ఉప్పొంగిపోకుండా ఉండేందుకు” అనే మాట గ్రీకు పాఠంలో రెండుసార్లు ఉంది; ఆ పునరుక్తిని ఇక్కడ నిలిపి ఉంచాం.


