id: 2CO.12.6
reference: 2 Corinthians 12:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: te
  text: ఎందుకంటే, నేను గొప్పగా చెప్పుకోవాలని కోరుకుంటే, నేను మూర్ఖుణ్ణి కాను; ఎందుకంటే నేను సత్యమే చెబుతాను. అయితే, ఎవరూ నాలో తాము చూసేదానికన్నా లేదా నా నుండి ఏదైనా వినేదానికన్నా నన్ను ఎక్కువగా అంచనా వేయకుండునట్లు నేను మానుకుంటున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θελήσω
  choice: కోరుకున్నా
  rationale: ἐὰνతో కూడిన ఆరిస్ట్ సబ్జంక్టివ్ భవిష్యత్తుకు సంబంధించిన ఊహాత్మక అవకాశాన్ని సూచిస్తుంది; ‘కోరుకున్నా’ ఆధునిక తెలుగులో ఆ షరతును సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καυχήσασθαι
  choice: గొప్పగా చెప్పుకోవాలని
  rationale: ఈ సందర్భంలో తన గురించి తానే గొప్పగా చెప్పుకోవడం అనే భావం ఉంది; పౌలు మాటల్లోని సంకోచం, వ్యంగ్య ఛాయలను కోల్పోకుండా సామాన్యులకు అర్థమయ్యే రూపం ఇది.
- source_word: ἄφρων
  choice: మూర్ఖుణ్ణి
  rationale: ἔσομαιతో విధేయ పదంగా ఉన్న ఈ విశేషణాన్ని తెలుగులో వ్యక్తిని సూచించే నామవాచక రూపంలో చెప్పడం సహజం; అధ్యాయంలోని ‘మూర్ఖుడు’ అనే భాషతోనూ సంబంధం నిలుస్తుంది.
- source_word: ἀλήθειαν ... ἐρῶ
  choice: నేను నిజమే చెబుతాను
  rationale: షరతుతో సంబంధమున్న భవిష్యత్ క్రియను తెలుగులో సహజమైన భవిష్యత్ రూపంతో ఇచ్చి, మాట సత్యమైనదనే ఉద్ఘాటనను ‘నిజమే’ ద్వారా నిలిపాం.
- source_word: φείδομαι
  choice: నేను అలా చేయకుండా ఉంటున్నాను
  rationale: ఇక్కడ పౌలు గొప్పగా చెప్పుకోవడం నుంచి తనను తాను నిలువరించుకుంటున్నాడు; సందర్భంలోని చర్యను స్పష్టంగా సూచించే సహజ తెలుగు రూపం ఇది.
- source_word: λογίσηται
  choice: ఎంచకూడదని
  rationale: λογίζομαιలో ఉన్న అంచనా వేయడం లేదా విలువ కట్టడం అనే భావాన్ని ‘ఎంచడం’ సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ὑπὲρ ὃ
  choice: అంతకంటే ఎక్కువగా
  rationale: చూసినది, విన్నది అనే ప్రమాణాన్ని మించి అంచనా వేయడాన్ని ఈ తులనాత్మక రూపం స్పష్టంగా తెలియజేస్తుంది.
- source_word: βλέπει με
  choice: నాలో చూసేదానిని బట్టి
  rationale: పౌలులో ప్రత్యక్షంగా గమనించగల దానిపై అంచనా ఆధారపడాలనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀκούει τι ἐξ ἐμοῦ
  choice: నా నుండి ఏదైనా వినేదానిని బట్టి
  rationale: గ్రీకులోని అనిర్దిష్ట τιని ‘ఏదైనా’గా స్పష్టంగా నిలిపి, ἐξ ἐμοῦను ‘నా నుండి’గా అనువదించాం.
theological_decisions:
- issue: పౌలు తన గురించి గొప్పగా చెప్పుకోవడం, అయినా దాని నుంచి వెనక్కి తగ్గడం
  choice: తాను గొప్పగా చెప్పుకున్నా అది సత్యమే అవుతుందని పౌలు చెప్పుతున్నప్పటికీ, ఇతరులు తనను అతిగా అంచనా వేయకూడదనే ఉద్దేశంతో అతడు అలా చేయకుండా ఉంటున్నాడని అనువదించాం.
  alternative: పౌలు గొప్పగా చెప్పుకోవడం సముచితమేనని మరింత బలంగా వ్యాఖ్యానించడం, లేదా ఇక్కడి ప్రతి విధమైన గొప్పచెప్పుకోవడమూ అసత్యం లేదా పాపమేనని చూపించడం.
  rationale: గ్రీకు వాక్యం సత్యమైన గొప్పచెప్పుకోవడానికి అవకాశం ఉందని, అదే సమయంలో పౌలు దాన్ని ఉద్దేశపూర్వకంగా మానుకుంటున్నాడని చెబుతుంది. ఈ ఉద్రిక్తతను విస్తృత సిద్ధాంత నిర్ణయంగా మార్చకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకులోని అనిర్దిష్ట అంశాన్ని ప్రధాన వాక్యంలోనే ‘ఏదైనా’గా తెలిపినందున పాదటిప్పణి అవసరం లేదు.
