revisions:
- from: ఎందుకంటే, నేను వచ్చినప్పుడు మీరు నేను కోరుకున్నట్లుగా ఉండరేమో అనీ, అలాగే మీకు నేను మీరు కోరుకున్నట్లుగా కనిపించనేమో అనీ నేను భయపడుతున్నాను. కలహాలు, అసూయలు, కోపావేశాలు, స్వార్థపూరిత పోటీలు, అపనిందలు, గుసగుసలు[a], అహంభావాలు, అల్లకల్లోలాలు మీ మధ్య ఉంటాయేమో అని భయపడుతున్నాను.
  to: ఎందుకంటే, నేను వచ్చినప్పుడు మీరు నేను కోరుకున్నవారిగా ఉండరేమో అనీ, నేను మీకు మీరు కోరుకోనివాడిగా కనిపించవచ్చేమో అనీ భయపడుతున్నాను. కలహాలు, అసూయలు, కోపావేశాలు, స్వార్థపూరిత పోటీలు, అపనిందలు, గుసగుసలు[a], అహంభావాలు, అవ్యవస్థలు మీ మధ్య ఉంటాయేమో అనీ భయపడుతున్నాను.
  rationale: The revision clarifies that Paul fears being found by the Corinthians to be an unwanted kind of person, preserving the Greek reciprocal structure without importing an explanation such as apostolic severity. It also renders ἀκαταστασίαι as “అవ్యవస్థలు” for closer lexical scope. The original footnote remains valid and is retained at its existing anchor.
