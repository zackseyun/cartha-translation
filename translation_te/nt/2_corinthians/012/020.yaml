id: 2CO.12.20
reference: 2 Corinthians 12:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: te
  text: ఎందుకంటే, నేను వచ్చినప్పుడు మీరు నేను కోరుకున్నవారిగా ఉండరేమో అనీ, నేను మీకు మీరు కోరుకోనివాడిగా కనిపించవచ్చేమో అనీ భయపడుతున్నాను. కలహాలు, అసూయలు, కోపావేశాలు, స్వార్థపూరిత పోటీలు, అపనిందలు, గుసగుసలు[a], అహంభావాలు, అవ్యవస్థలు మీ మధ్య ఉంటాయేమో అనీ భయపడుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘చాడీలు.’
    reason: ψιθυρισμοί అనే పదం రహస్య గుసగుసలతో పాటు చాటుగా ఇతరుల గురించి చెప్పే చాడీలను కూడా సూచించగలదు.
lexical_decisions:
- source_word: φοβοῦμαι
  choice: నేను భయపడుతున్నాను
  rationale: వర్తమానకాల క్రియ పౌలు కొనసాగుతున్న ఆందోళనను తెలియజేస్తుంది; ఈ రూపం దాని తీవ్రతను తగ్గించకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: μή πως
  choice: ఉండరేమో అనీ / ఉంటాయేమో అని
  rationale: రెండుసార్లు వచ్చిన ఈ పదబంధం భయంతో కూడిన సంభావ్యతను సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘ఏమో అని’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐλθὼν
  choice: నేను వచ్చినప్పుడు
  rationale: సందర్భంలో ఈ అసమాపక క్రియ కాలసంబంధమైనది; ‘వచ్చినప్పుడు’ సంఘటనల క్రమాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: οὐχ οἵους θέλω εὕρω ὑμᾶς
  choice: మీరు నేను కోరుకున్నట్లుగా ఉండరేమో
  rationale: కొరింథీయుల స్థితి లేదా ప్రవర్తన పౌలు ఆశించిన విధంగా ఉండకపోవచ్చనే భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε
  choice: మీకు నేను మీరు కోరుకున్నట్లుగా కనిపించనేమో
  rationale: εὑρεθῶ అనే కర్మణి రూపం ఇక్కడ వారి అనుభవంలో పౌలు ఎలాంటి వాడిగా తేలుతాడో సూచిస్తుంది. ‘కనిపించనేమో’ పరస్పర అసంతృప్తి నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἔρις
  choice: కలహాలు
  rationale: సంఘంలోని వివాదం, ఘర్షణ అనే విస్తృత భావాన్ని సాధారణ ఆధునిక పదంతో అందిస్తుంది.
- source_word: ζῆλος
  choice: అసూయలు
  rationale: దుర్గుణాల జాబితాలో ఇది సానుకూల ఉత్సాహాన్ని కాక ప్రతికూలమైన అసూయను సూచిస్తుంది.
- source_word: θυμοί
  choice: కోపావేశాలు
  rationale: బహువచనం పదేపదే చెలరేగే కోపాన్ని సూచిస్తుంది; ‘కోపావేశాలు’ ఆ ఆకస్మిక ఉద్ధృతిని తెలియజేస్తుంది.
- source_word: ἐριθεῖαι
  choice: స్వార్థపూరిత పోటీలు
  rationale: స్వలాభం కోసం ఇతరులతో వర్గపోరు లేదా పోటీకి దిగే భావాన్ని తెలియజేస్తుంది; కేవలం సాధారణ ఆశను సూచించకుండా సామూహిక సందర్భాన్ని నిలుపుతుంది.
- source_word: καταλαλιαί
  choice: అపనిందలు
  rationale: ఇతరుల గురించి హానికరంగా, చెడుగా మాట్లాడటాన్ని సూచించే సమకాలీన పదం.
- source_word: ψιθυρισμοί
  choice: గుసగుసలు
  rationale: రహస్యంగా లేదా చాటుగా ఇతరుల గురించి మాట్లాడే భావాన్ని నేరుగా అందిస్తుంది; ప్రత్యామ్నాయంగా ‘చాడీలు’ కూడా సందర్భానికి సరిపోతుంది.
- source_word: φυσιώσεις
  choice: అహంభావాలు
  rationale: తన్నుతాను గొప్పగా భావించుకునే ఉబ్బరాన్ని సూచిస్తుంది; మూలంలోని రూపకాన్ని అక్షరాలా కాక దాని భావాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: ἀκαταστασίαι
  choice: అల్లకల్లోలాలు
  rationale: క్రమం చెడిపోవడం, సామూహిక అశాంతి అనే భావాలను ఒకేసారి అందిస్తుంది.
theological_decisions:
- issue: పౌలు భయపడుతున్న భేటీ స్వభావం
  choice: పరస్పర అసంతృప్తి మరియు సంఘంలో దుర్గుణాలు ఉండవచ్చనే పౌలు భయాన్ని మాత్రమే స్పష్టంగా తెలిపింది.
  alternative: పౌలు అపొస్తల అధికారంతో కఠినంగా వ్యవహరించాల్సి వస్తుందనే భావాన్ని వాక్యంలోనే స్పష్టంగా చేర్చడం.
  rationale: విస్తృత సందర్భం పౌలు కఠినంగా వ్యవహరించే అవకాశాన్ని సూచించవచ్చు; అయితే ఈ వచనం దానిని ప్రత్యక్షంగా చెప్పదు. అందుచేత అనువాదం ఆ కారణాన్ని చేర్చకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. మొదటి వాక్యంలో మూలంలోని పరస్పర నిర్మాణాన్ని నిలిపి, రెండవ వాక్యంలో దుర్గుణాల జాబితాను స్పష్టంగా ఇచ్చాం. తెలుగు సహజత్వం కోసం జాబితాలో బహువచన రూపాలను వాడాం.
