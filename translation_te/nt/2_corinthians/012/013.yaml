id: 2CO.12.13
reference: 2 Corinthians 12:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: te
  text: ఎందుకంటే, నేను స్వయంగా మీకు భారంగా కాకపోవడం తప్ప[b], మిగతా సంఘాలకంటే మీరు ఏ విషయంలో తక్కువగా పరిగణించబడ్డారు[a]? నా ఈ అన్యాయాన్ని క్షమించండి[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిగతా సంఘాలకంటే తక్కువ స్థితిలో ఉంచబడ్డారు.” గ్రీకు క్రియకు వెనుకబడేలా చేయడం లేదా తక్కువ స్థితిలో ఉంచడం అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అంటే, పౌలు వారి దగ్గర ఆర్థిక సహాయం స్వీకరించి వారికి భారంగా మారలేదు.
    reason: cultural_note
  - marker: c
    text: 'ఇక్కడ పౌలు వ్యంగ్యంగా మాట్లాడుతున్నాడు: వారికి భారంగా మారకపోవడమే తాను చేసినట్టుగా చెప్పే “అన్యాయం.”'
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡσσώθητε
  choice: తక్కువగా చూడబడ్డారు
  rationale: ఈ కర్మణి రూపం ఇతరులకంటే తక్కువ స్థితిలో ఉంచడం లేదా తక్కువగా పరిగణించడం అనే భావాన్ని ఇస్తుంది. సహజమైన అంతర్గత న్యూనతను సూచించకుండా, కోరింథీయులు ఇతర సంఘాలతో పోలిస్తే తక్కువగా చూడబడ్డారనే వ్యంగ్య ప్రశ్నను ఇది తెలియజేస్తుంది.
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: మిగతా సంఘాలకంటే
  rationale: ఇక్కడ ὑπέρ పోలికను సూచిస్తుంది; ‘మిగతా సంఘాలకంటే’ అనేది ఆధునిక తెలుగులో సహజంగా ఉండి, పౌలు ఇతర సంఘాలతో చేస్తున్న పోలికను స్పష్టంగా నిలుపుతుంది.
- source_word: αὐτὸς ἐγὼ
  choice: నేను స్వయంగా
  rationale: బలంగా చెప్పబడిన గ్రీకు సర్వనామ నిర్మాణంలోని వ్యక్తిగత ఉద్ఘాటనను నిలుపుతుంది.
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: మీకు భారంగా ఉండకపోవడం
  rationale: ఈ సందర్భంలో καταναρκάω ఆర్థికంగా లేదా వస్తుపరంగా భారమవడాన్ని సూచిస్తుంది. ‘భారంగా ఉండడం’ మూలంలోని రూపకాన్ని, సందర్భార్థాన్ని రెండింటినీ సహజంగా తెలియజేస్తుంది.
- source_word: χαρίσασθέ μοι
  choice: క్షమించండి
  rationale: χαρίζομαι ఇక్కడ క్షమించమనే అర్థంలో వాడబడింది. పౌలు చేసే వ్యంగ్యపూర్వక క్షమాపణలోని పదునును ఈ ఎంపిక నిలుపుతుంది.
- source_word: τὴν ἀδικίαν ταύτην
  choice: నేను చేసిన ఈ అన్యాయాన్ని
  rationale: ἀδικίαకు ‘అన్యాయం’ ప్రత్యక్ష సమానార్థకం. తెలుగులో క్షమాపణ వాక్యం సహజంగా ఉండేందుకు ‘నేను చేసిన’ చేర్చబడింది; ఇది గ్రీకులోని ‘నాకు ఈ అన్యాయాన్ని క్షమించండి’ అనే భావాన్నే వ్యక్తం చేస్తుంది.
- source_word: τί γάρ ἐστιν ὃ
  choice: ఎందుకంటే ... ఏ విషయంలో
  rationale: γάρ ముందరి వాదనతో సంబంధాన్ని చూపుతుంది; τί ... ὃ కోరింథీయులు ఏ విషయంలో వెనుకబడ్డారని ప్రశ్నించే అలంకారిక ప్రశ్నను ప్రవేశపెడుతుంది.
theological_decisions:
- issue: ఆర్థిక సహాయం విషయంలో పౌలు తనను తాను సమర్థించుకోవడంలోని వ్యంగ్యం
  choice: వ్యంగ్యాన్ని ప్రధాన పాఠ్యంలో వివరణగా విస్తరించకుండా, ‘నేను చేసిన ఈ అన్యాయాన్ని క్షమించండి’ అనే నేరుగా ఉన్న మాటల ద్వారా నిలుపడం
  alternative: ‘ఇంత ఘోరమైన తప్పు చేసినందుకు నన్ను క్షమించండి’ వంటి విస్తరించిన వ్యంగ్యార్థక అనువాదం
  rationale: మూల గ్రీకులో వ్యంగ్యం సందర్భం మరియు మాటల పరస్పర విరుద్ధత ద్వారా వ్యక్తమవుతుంది. మూలంలో లేని అతిశయోక్తిని చేర్చకుండా ఆ ఉద్రిక్తతను పాఠకుడు గ్రహించేలా ఉంచడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి ఉపయోగించబడింది. ‘సంఘాలు,’ ‘భారంగా,’ ‘అన్యాయం’ వంటి పదాలు మూలంలోని సభ, ఆర్థిక భారం, వ్యంగ్యపూర్వక న్యాయభాషలను సంక్షిప్తంగా నిలుపుతున్నాయి. అన్ని పాదసూచిక గుర్తులు సంబంధిత ప్రధాన పాఠ్య స్థానాల్లో ఉంచబడ్డాయి.
