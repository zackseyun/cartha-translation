review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the comparative disadvantage expressed by ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, Paul’s emphatic personal role (αὐτὸς ἐγώ), his refusal to burden the Corinthians, and the ironic imperative to forgive the supposed wrong. However, the exception introduced by εἰ μὴ ὅτι is separated into a fragmentary second question in Telugu. It should qualify the rhetorical question as a whole.
  naturalness: The principal terms are modern and understandable. Reordering the sentence so that “except that I myself did not become a burden to you” is integrated with the main rhetorical question produces idiomatic Telugu and makes the logic unambiguous. “నా ఈ అన్యాయాన్ని” is more concise and avoids adding “చేసిన,” which is not explicit in the Greek.
  terminology: “సంఘాలు,” “భారంగా,” and “అన్యాయం” are suitable modern-standard Telugu renderings. “తక్కువగా పరిగణించబడ్డారు” preserves the passive comparative sense without suggesting inherent inferiority.
  issues:
  - severity: medium
    issue: The εἰ μὴ ὅτι exception is rendered as a separate fragmentary question.
    rationale: The wording “నేను స్వయంగా మీకు భారంగా ఉండకపోవడం తప్ప[b]?” leaves “తప్ప” syntactically detached and can sound as though Paul is asking a second question. In Greek, the exception modifies the entire preceding rhetorical question.
  - severity: low
    issue: “నేను చేసిన” adds an explicit verbal element to τὴν ἀδικίαν ταύτην.
    rationale: The phrase is understandable and the irony is retained, but “నా ఈ అన్యాయాన్ని” is both natural Telugu and closer to the Greek’s “forgive me this wrong.”
