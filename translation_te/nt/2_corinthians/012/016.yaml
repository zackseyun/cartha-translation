id: 2CO.12.16
reference: 2 Corinthians 12:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔστω δέ, ἐγὼ οὐ κατεβάρησα ὑμᾶς· ἀλλὰ ὑπάρχων πανοῦργος δόλῳ ὑμᾶς ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: te
  text: 'అయితే, అలా ఉండనివ్వండి: నేను మీపై భారం మోపలేదు.[a] కానీ, నేను కపటుడినై మోసంతో మిమ్మల్ని పట్టుకున్నాను.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “సరే, ఆ సంగతి అలా ఉండనివ్వండి” లేదా “అది అలాగే ఉందని ఒప్పుకుందాం” అని కూడా అనువదించవచ్చు; పౌలు వాదన నిమిత్తం ఆ విషయాన్ని అంగీకరిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “నేను కపటుడినై మోసంతో మిమ్మల్ని పట్టుకున్నాను” అనే మాటలు పౌలు చేసిన నిజమైన ఒప్పుకోలు కాక, తనపై వచ్చిన ఆరోపణను వ్యంగ్యంగా పునరుక్తి చేయడం కావచ్చు.
    reason: alternative_reading
  - marker: c
    text: “మాయతో మిమ్మల్ని చిక్కించుకున్నాను” లేదా “మోసంతో మీనుండి ప్రయోజనం పొందాను” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: అయితే, అలాగే అనుకుందాం
  rationale: వాదన నిమిత్తం ఒక విషయాన్ని అంగీకరిస్తున్న అలంకారిక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; దానిని నిజమైన ఒప్పుకోలుగా నిర్ధారించదు.
- source_word: κατεβάρησα
  choice: భారంగా ఉండలేదు
  rationale: సందర్భంలో పౌలు కొరింథీయులపై, ముఖ్యంగా ఆర్థికంగా, భారం మోపలేదనే భావం ఉంది; అదే సమయంలో మూలంలోని ‘భారం’ రూపకాన్ని నిలుపుతుంది.
- source_word: ὑπάρχων
  choice: అయి
  rationale: కృదంత నిర్మాణాన్ని సంక్షిప్తంగా నిలుపుతూ, కారణార్థమా పరిస్థిత్యర్థమా అన్నది అనవసరంగా నిర్ణయించదు.
- source_word: πανοῦργος
  choice: జిత్తులమారిన
  rationale: ప్రతికూలమైన కపట చాతుర్యాన్ని సూచిస్తూ, పౌలు ప్రతిధ్వనింపజేస్తున్న ఆరోపణ ధోరణికి సరిపోతుంది.
- source_word: δόλῳ
  choice: మోసంతో
  rationale: సాధనార్థక దత్తివును సహజంగా తెలుపుతుంది; కపటం లేదా మోసం ద్వారా అన్న ఆరోపణను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἔλαβον
  choice: పట్టుకున్నాను
  rationale: λαμβάνω యొక్క ‘పట్టుకోవడం/చిక్కించుకోవడం’ భావాన్ని సందర్భానుగుణంగా అందిస్తుంది; ‘దోచుకున్నాను’ వంటి మరింత వ్యాఖ్యానాత్మక అర్థాన్ని ప్రధాన పాఠ్యంలోకి తేవదు.
theological_decisions:
- issue: ἀλλὰ తరువాతి మాటలు పౌలు చేసిన నిజమైన ఒప్పుకోలా, లేక తనపై వచ్చిన ఆరోపణను వ్యంగ్యంగా పునరుక్తి చేస్తున్నాడా
  choice: వాక్యాన్ని ప్రత్యక్ష రూపంలోనే ఉంచి, వ్యంగ్య ఆరోపణ అయ్యే అవకాశాన్ని పాదటిప్పణిలో వివరించడం
  alternative: “కానీ నేను జిత్తులమారిని కాబట్టి, మోసంతో మీనుండి ప్రయోజనం పొందాను” అని స్పష్టంగా వ్యాఖ్యానించడం
  rationale: విస్తృత సందర్భంలో పౌలు తాను వారిని దోచుకోలేదని నిరాకరిస్తున్నాడు. అందువల్ల ఇది ఆరోపణను వ్యంగ్యంగా ప్రతిధ్వనింపజేయడం కావచ్చు; అయితే ప్రధాన పాఠ్యంలో ఆ వ్యంగ్యాన్ని పూర్తిగా విప్పి చెప్పకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘జిత్తులమారినై’ అనే పదం ఆరోపణలోని ప్రతికూల చాతుర్యాన్ని నిలుపుతుంది. వ్యంగ్యాన్ని ప్రధాన పాఠ్యంలో వివరణాత్మకంగా పరిష్కరించకుండా పాదటిప్పణిలో సూచించాం.
