  yaml_path: translation/nt/2_corinthians/012/017.yaml
  text: Did I exploit you through any of those whom I sent to you?[a]
translation:
  language: te
  text: నేను మీ దగ్గరికి పంపిన వారిలో ఎవరి ద్వారా అయినా మీకు నష్టం కలిగించి లాభం పొందానా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మిమ్మల్ని అన్యాయంగా ఉపయోగించుకున్నానా?” లేదా “మీ విషయంలో అన్యాయంగా లాభం పొందానా?” గ్రీకు క్రియ మరొకరి నష్టంపై లాభం పొందడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: దోచుకున్నానా?
  rationale: μή ప్రతికూల సమాధానాన్ని ఆశించే అలంకారప్రశ్నను పరిచయం చేస్తుంది. తెలుగులో ప్రశ్నారూపమే సందర్భానుసారంగా ఆ అంచనాను సహజంగా తెలియజేస్తుంది.
- source_word: τινα ὧν
  choice: పంపినవారిలో ఎవరి ద్వారానైనా
  rationale: పౌలు పంపిన సమూహంలో ఏ వ్యక్తినైనా సూచించే భాగసంబంధ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἀπέσταλκα
  choice: నేను ... పంపిన
  rationale: గ్రీకు పరిపూర్ణ కాలరూపం ఇక్కడ పౌలు కొరింథుకు పంపిన వ్యక్తులను గుర్తిస్తుంది; తెలుగులో సాధారణ భూతకాల సంబంధక్రియ సహజంగా సరిపోతుంది.
- source_word: πρὸς ὑμᾶς
  choice: మీ దగ్గరికి
  rationale: వ్యక్తులవద్దకు పంపడాన్ని సూచించే సహజమైన దిశార్థక తెలుగు ప్రయోగం.
- source_word: δι’ αὐτοῦ
  choice: ఎవరి ద్వారానైనా
  rationale: గ్రీకులో ఏకవచనంగా ‘అతని ద్వారా’ ఉన్నప్పటికీ, ముందు ఉన్న అనిర్దిష్ట సమూహ సూచనతో ఇది పంపబడిన వారిలో ఒక్కొక్కరికి వర్తిస్తుంది; తెలుగు రూపం ఆ పంపిణీ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: ἐπλεονέκτησα
  choice: దోచుకున్నానా
  rationale: ఇతరుల నష్టంపై అన్యాయ లాభం పొందడాన్ని సూచిస్తుంది. ‘దోచుకోవడం’ ఆర్థికమైన లేదా సంబంధపరమైన అన్యాయ ప్రయోజన భావాన్ని సాధారణ ఆధునిక తెలుగులో బలంగా వ్యక్తం చేస్తుంది.
- source_word: ὑμᾶς
  choice: మిమ్మల్ని
  rationale: కొరింథు విశ్వాసులను సమూహంగా సూచించే ప్రత్యక్ష కర్మరూపం.
