translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన అలంకారప్రశ్నగా రూపొందించబడింది. ‘దోచుకున్నానా’ అనే పదం సందర్భంలోని అన్యాయ లాభ భావాన్ని సంక్షిప్తంగా అందిస్తుంది; పాదటిప్పణి దాని విస్తృత అర్థపరిధిని సంరక్షిస్తుంది.
