  rationale: The revision uses ‘నా నుండి తొలగిపోవాలని’ to translate the departure-and-separation sense of ἀποστῇ ἀπ’ ἐμοῦ more directly. It also revises footnote d so that it accurately preserves the unresolved antecedent from the prior context. No doctrinal identification of ‘the Lord’ has been added.
