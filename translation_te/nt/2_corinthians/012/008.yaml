translation:
  language: te
  text: ఈ విషయం గురించి[a] అది నా నుండి తొలగిపోవాలని[d] నేను ప్రభువును[c] మూడుసార్లు వేడుకున్నాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దీని విషయమై’ లేదా ‘దీని కోసం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘విన్నవించుకున్నాను’ లేదా ‘బతిమాలుకున్నాను.’
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో ‘ప్రభువు’ అని మాత్రమే ఉంది; పౌలు ఇక్కడ యేసు పేరును స్పష్టంగా చెప్పలేదు.
    reason: alternative_reading
  - marker: d
    text: లేదా ‘అది నన్ను విడిచిపోవాలని’ లేదా ‘అది నాకు దూరమవాలని.’ గ్రీకులో కర్త స్పష్టంగా లేదు; అది ముందటి వచనంలోని ‘శరీరంలోని ముల్లు’ లేదా ‘సాతాను దూత’ను సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: దీని గురించి
  rationale: ఇక్కడ ὑπέρ + షష్ఠీ విభక్తి ముందటి వచనంలో చెప్పిన బాధను చర్చావిషయంగా సూచిస్తుంది; ‘దీని గురించి’ ఆ అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τρὶς
  choice: మూడుసార్లు
  rationale: ఈ క్రియావిశేషణం మూడు సందర్భాలను సూచిస్తుంది; ‘మూడుసార్లు’ స్పష్టమైన సాధారణ తెలుగు.
- source_word: τὸν κύριον
  choice: ప్రభువును
  rationale: κύριοςకు స్థిరమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం ‘ప్రభువు’; మూలంలో లేని ‘యేసు’ అనే పేరును పాఠ్యంలో చేర్చలేదు.
- source_word: παρεκάλεσα
  choice: వేడుకున్నాను
  rationale: ప్రార్థన సందర్భంలో παρακαλέω హృదయపూర్వకమైన అభ్యర్థనను సూచిస్తుంది; ‘వేడుకున్నాను’ తీవ్రతను అతిశయింపకుండా సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα
  choice: అని / -ాలని
  rationale: విన్నపపు విషయాన్ని తెలిపే ἵναను తెలుగులో సహజమైన ఉద్దేశ్యార్థక ‘విడిచిపోవాలని’ నిర్మాణంతో వ్యక్తం చేశాం.
- source_word: ἀποστῇ
  choice: అది … విడిచిపోవాలని
  rationale: ἀποστῇ అంటే దూరమవడం లేదా విడిచిపోవడం. కర్త మూలంలో సూచితమే; ‘అది’ ముందటి బాధను తిరిగి సూచిస్తూ వ్యక్తి/వస్తువు అనే భేదాన్ని నిర్ణయించదు.
- source_word: ἀπ’ ἐμοῦ
  choice: నన్ను
  rationale: ἀπό తెలిపే వియోగ భావం తెలుగులో ‘నన్ను విడిచిపోవడం’ అనే సహజ క్రియా నిర్మాణంలో వ్యక్తమవుతుంది.
theological_decisions:
- issue: ‘ప్రభువు’ ఎవరిని సూచిస్తున్నాడు?
  choice: మూలంలోని సాధారణ సంబోధనను అనుసరించి ‘ప్రభువు’ అని మాత్రమే అనువదించాం.
  alternative: ప్రభువైన యేసు
  rationale: ఈ సందర్భంలో పౌలు యేసును ఉద్దేశించి ఉండవచ్చు; అయినా గ్రీకు పాఠ్యంలో κύριον మాత్రమే ఉంది. అందువల్ల పేరును చేర్చి భావాన్ని నిర్దిష్టం చేయలేదు.
- issue: ἀποστῇ క్రియకు సూచిత కర్త
  choice: తటస్థ సూచనగా ‘అది’ వాడాం.
  alternative: వాడు / ఆ దూత / ఆ ముల్లు
  rationale: ముందటి సందర్భంలో ‘శరీరంలో ముల్లు,’ ‘సాతాను దూత’ రెండూ ఉన్నాయి; గ్రీకు ఇక్కడ కర్తను స్పష్టంగా పునరుక్తి చేయదు. ‘అది’ ఈ ఉద్రిక్తతను సాధ్యమైనంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘వేడుకున్నాను’ ప్రార్థనలోని ఆర్తిని తెలియజేస్తుంది; ‘ప్రభువు’ మరియు ‘అది’ మూలపాఠ్యంలోని నిర్దిష్టం కాని అంశాలను విస్తరించకుండా నిలుపుతాయి.
