id: 2CO.12.21
reference: 2 Corinthians 12:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: te
  text: నేను మళ్లీ వచ్చినప్పుడు నా దేవుడు మీ ఎదుట నన్ను అణగదొక్కుతాడేమో[a], ఇంతకుముందు పాపం చేసిన అనేకులు తాము ఆచరించిన అపవిత్రత, లైంగిక అనైతికత, సిగ్గుమాలిన విచ్చలవిడితనం గురించి పశ్చాత్తాపపడకపోతే వారి విషయమై నేను దుఃఖించవలసి వస్తుందేమో అని భయపడుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నన్ను అణగదొక్కుతాడేమో’ అనే మాటకు ‘నన్ను తగ్గిస్తాడేమో,’ ‘నన్ను తక్కువ స్థితికి తీసుకువస్తాడేమో,’ లేదా సందర్భానుసారం ‘నన్ను అవమానానికి గురిచేస్తాడేమో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: నేను మళ్లీ వచ్చినప్పుడు ... భయపడుతున్నాను
  rationale: ఈ వాక్యం ముందరి వచనంలోని భయాన్ని కొనసాగిస్తుంది. μήతో ఉన్న నిర్మాణాన్ని సహజమైన తెలుగులో చివర ‘భయపడుతున్నాను’ అని స్పష్టపరచి, πάλινను ‘మళ్లీ’గా నిలిపాం.
- source_word: ταπεινώσῃ με ὁ θεός μου πρὸς ὑμᾶς
  choice: నా దేవుడు మీ ఎదుట నన్ను తలవంచేలా చేస్తాడేమో
  rationale: ταπεινόωలోని ‘తగ్గించడం, అణచడం, అవమానానికి గురిచేయడం’ అనే పరిధిని అతిగా నిర్దిష్టం చేయకుండా ‘తలవంచేలా చేయడం’ సహజంగా తెలియజేస్తుంది. πρὸς ὑμᾶςను వారి సమక్షం/సంబంధ పరిధిగా ‘మీ ఎదుట’ అన్నాం.
- source_word: πενθήσω
  choice: నేను దుఃఖిస్తానేమో
  rationale: πενθέω తీవ్రమైన శోకాన్ని లేదా విలాపాన్ని సూచిస్తుంది. మొత్తం వాక్యం భయానికి లోబడినందున తెలుగులో ‘దుఃఖిస్తానేమో’గా ఇచ్చాం.
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: ఇంతకుముందే పాపం చేసినవారిలో ... అనేకులను
  rationale: గ్రీకు విభక్తి నిర్మాణంలోని ‘ముందుగా పాపం చేసినవారిలో అనేకులు’ అనే భాగార్థాన్ని, పరిపూర్ణ కృదంతంలోని కొనసాగుతున్న ప్రాసంగికతను కాపాడుతుంది.
- source_word: μὴ μετανοησάντων ἐπὶ
  choice: గురించి పశ్చాత్తాపపడని
  rationale: వారు గతంలో పశ్చాత్తాపపడకపోవడమే కాక, పౌలు రాక సమయానికి కూడా పశ్చాత్తాపరహితులుగా ఉన్న సందర్భార్థాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ἐπί పశ్చాత్తాపానికి సంబంధించిన విషయాన్ని సూచిస్తుంది.
- source_word: ἀκαθαρσίᾳ
  choice: అపవిత్రత
  rationale: నైతిక అశుద్ధతను సూచించే విస్తృతమైన, ఆధునిక ప్రామాణిక తెలుగు పదం.
- source_word: πορνείᾳ
  choice: లైంగిక అనైతికత
  rationale: πορνείαను ఒకే నిర్దిష్ట లైంగిక పాపానికి పరిమితం చేయకుండా దాని విస్తృత నైతిక అర్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀσελγείᾳ
  choice: సిగ్గుమాలిన విచ్చలవిడితనం
  rationale: ἀσέλγεια సూచించే సిగ్గులేని, అదుపులేని ప్రవర్తనను—ఈ సందర్భంలో లైంగిక ఛాయతో సహా—తెలియజేస్తూ, ముందున్న రెండు పదాలతో కలపకుండా ప్రత్యేకంగా ఉంచుతుంది.
- source_word: ᾗ ἔπραξαν
  choice: తాము ఆచరించిన
  rationale: జాబితాలోని దుష్ప్రవర్తనలను సమష్టిగా సూచిస్తూ, πράσσωలో ఉండగల పునరావృత లేదా అలవాటైన ఆచరణ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ముందరి వచనం నుండి కొనసాగుతున్న భయవాక్యపు పరిధి
  choice: దేవుడు తలవంచేలా చేయడం, పౌలు దుఃఖించడం—రెండింటినీ ‘భయపడుతున్నాను’ కింద ఉంచడం
  alternative: ‘నేను మళ్లీ వచ్చినప్పుడు నా దేవుడు...; నేను దుఃఖిస్తాను’ అని స్వతంత్ర నిశ్చయవాక్యాలుగా చదవడం
  rationale: గ్రీకు μή ముందరి φοβοῦμαι భావాన్ని కొనసాగిస్తుంది. అందువల్ల ఇది సిద్ధాంతపరమైన నిశ్చయప్రకటన కాదు; పౌలు భయపడుతున్న సంభావ్యత.
- issue: మూడు నైతిక దోషాల ప్రత్యేకత
  choice: ‘అపవిత్రత, లైంగిక అనైతికత, సిగ్గుమాలిన విచ్చలవిడితనం’ అని మూడు వేర్వేరు పదాలుగా ఉంచడం
  alternative: మూడింటినీ ఒకే సాధారణ లైంగిక పాపపదంగా కలపడం
  rationale: గ్రీకు వాక్యం పరస్పరం అతివ్యాప్తి ఉన్నా వేర్వేరు మూడు పదాలను వరుసగా ఇస్తుంది. వాటిని కలపడం మూలంలోని నైతిక ఉద్ధాటనను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే శైలి. పొడవైన గ్రీకు వాక్య నిర్మాణాన్ని రెండు ‘అనీ’ భాగాలతో సహజంగా కట్టిపెట్టి, చివర భయభావాన్ని స్పష్టంచేశాం. నైతిక పదజాలాన్ని మర్యాదపూర్వకంగా, కానీ మూలంలోని తీవ్రత తగ్గకుండా ఉంచాం.
