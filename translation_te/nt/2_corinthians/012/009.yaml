id: 2CO.12.9
reference: 2 Corinthians 12:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: te
  text: 'ఆయన నాతో ఇలా చెప్పారు: “నా కృప నీకు చాలు; ఎందుకంటే బలహీనతలో శక్తి పరిపూర్ణమవుతుంది.”[a] కాబట్టి నేను నా బలహీనతల గురించి మరింత సంతోషంతో గొప్పగా చెప్పుకుంటాను, తద్వారా మెస్సీయ శక్తి నా మీద నివసించేలా.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “ఎందుకంటే నా శక్తి బలహీనతలో పరిపూర్ణమవుతుంది” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: “మెస్సీయ శక్తి నా మీద నిలిచేలా” అని కూడా అనువదించవచ్చు; మరింత అక్షరార్థంగా, “నా మీద గుడారం వేసేలా.” Χριστοῦను సంప్రదాయంగా “క్రీస్తు” అని కూడా అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκέν μοι
  choice: ఆయన నాతో ఇలా చెప్పారు
  rationale: పరిపూర్ణ కాలంలోని, ఇప్పటికీ ప్రాముఖ్యత కలిగిన గత పలుకును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Ἀρκεῖ σοι ἡ χάρις μου
  choice: నా కృప నీకు చాలు
  rationale: Ἀρκεῖ యొక్క సమృద్ధి/సరిపోవడం అనే భావాన్ని సంక్షిప్తంగా, సహజంగా ఉంచుతూ χάρις‌ను పౌలు వాడుకకు తగిన ‘కృప’గా అనువదిస్తుంది.
- source_word: δύναμις
  choice: శక్తి
  rationale: దైవిక సామర్థ్యాన్ని, వాక్యాంతంలో మళ్లీ వచ్చే అదే పదంతో ఉన్న భావసంబంధాన్ని కాపాడుతుంది.
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: బలహీనత / బలహీనతలు
  rationale: మొదట సాధారణ సూత్రాన్ని తెలిపే ఏకవచనాన్ని, తరువాత పౌలు అనుభవాలను తెలిపే బహువచనాన్ని నిలుపుతుంది.
- source_word: τελεῖται
  choice: పరిపూర్ణమవుతుంది
  rationale: τελέωలోని పూర్తి స్థితికి చేరడం లేదా సంపూర్ణ వ్యక్తీకరణ అనే భావాన్ని సంక్షిప్తంగా ఉంచి, వాక్యంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను పరిష్కరించకుండా కాపాడుతుంది.
- source_word: ἥδιστα οὖν μᾶλλον καυχήσομαι
  choice: కాబట్టి … నేను మరింత సంతోషంగా గొప్పగా చెప్పుకుంటాను
  rationale: ἥδιστα మరియు μᾶλλον కలిగించే తీవ్రతను సహజమైన తెలుగు క్రమంలో వ్యక్తం చేస్తూ, καυχάομαιలోని విరుద్ధాభాసమైన ‘గొప్పగా చెప్పుకోవడం’ భావాన్ని నిలుపుతుంది.
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: నా మీద నివసించేలా
  rationale: గుడారం వేసి మీద నిలవడం/నివసించడం అనే రూపకాన్ని చదవడానికి సులభమైన తెలుగులో కొంతవరకు నిలుపుతుంది; మరింత అక్షరార్థ రూపం పాదసూచికలో ఉంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తున్నందున దాని అభిషిక్త రాజు భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది.
theological_decisions:
- issue: δύναμις ముందు స్వామ్యసూచక పదాన్ని చేర్చాలా
  choice: ప్రధాన పాఠ్యంలో ‘శక్తి’
  alternative: ‘నా శక్తి’
  rationale: ఇచ్చిన SBLGNT ప్రధాన పాఠ్యంలో δύναμιςకు ముందు స్పష్టమైన μου లేదు. సందర్భం ఆ శక్తి ప్రభువుదని సూచించినా, అనువాదం దానిని ప్రధాన పాఠ్యంలో చేర్చి అస్పష్టతను తొలగించదు; పాఠాంతరం పాదసూచికలో ఇవ్వబడింది.
- issue: τελεῖταιను ఎలా వ్యక్తపరచాలి
  choice: పరిపూర్ణమవుతుంది
  alternative: పూర్తిగా వ్యక్తమవుతుంది
  rationale: దైవశక్తిలో ముందుగా లోపం ఉందని తప్పనిసరిగా చెప్పకుండా, బలహీనతలో అది తన సంపూర్ణతకు చేరుతుందనే భావాన్నీ సంప్రదాయ పదబంధంలోని ఉద్దేశపూర్వక ఉద్రిక్తతనూ నిలుపుతుంది.
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో పదం బిరుదుగా గ్రహించదగినది; ‘మెస్సీయ’ దాని బిరుదు స్వరూపాన్ని స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే కృప, బలహీనత, శక్తి, పరిపూర్ణత వంటి పౌలు భావపదాలను గౌరవప్రదంగా నిలుపుకుంది. ‘గొప్పగా చెప్పుకుంటాను’ అనే రూపం పౌలు ఉద్దేశించిన విరుద్ధాభాసాన్ని మృదువుచేయకుండా ఉంచుతుంది.
