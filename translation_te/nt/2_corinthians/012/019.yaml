id: 2CO.12.19
reference: 2 Corinthians 12:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: te
  text: మేము ఇంతకాలంగా మీ ఎదుట మమ్మల్ని సమర్థించుకుంటున్నామని మీరు అనుకుంటున్నారా? దేవుని ఎదుట, మెస్సీయలో మేము మాట్లాడుతున్నాం. ప్రియులారా, ఇవన్నీ మిమ్మల్ని బలపరచడానికే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλαι
  choice: ఇంతకాలమూ
  rationale: ఇక్కడ ఇది సుదూర గతాన్ని కాకుండా, పాఠకులు కొనసాగిస్తూ వచ్చిన భావనను సూచిస్తుంది. ‘ఇంతకాలమూ’ ఆ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δοκεῖτε
  choice: మీరు అనుకుంటున్నారా?
  rationale: కొనసాగుతున్న ఊహను ప్రశ్నించే అలంకారిక ప్రశ్నగా సరళంగా, సహజంగా అనువదించబడింది.
- source_word: ὑμῖν ἀπολογούμεθα
  choice: మీ ఎదుట మమ్మల్ని సమర్థించుకుంటున్నాం
  rationale: ἀπολογούμεθα లోని స్వపక్ష సమర్థన భావాన్ని నిలుపుతూ, ὑμῖν ను తెలుగులో సహజమైన ‘మీ ఎదుట’గా వ్యక్తం చేస్తుంది.
- source_word: κατέναντι θεοῦ
  choice: దేవుని సన్నిధిలో
  rationale: దేవుని సమక్షంలో, ఆయనకు జవాబుదారులుగా మాట్లాడుతున్నారనే గంభీర భావాన్ని తెలియజేస్తుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో ఉంటూ
  rationale: ἐν యొక్క సంబంధం లేదా ఐక్యత భావాన్ని ‘లో ఉంటూ’ ద్వారా సహజంగా వ్యక్తం చేస్తూ, Χριστός యొక్క బిరుదు భావాన్ని ‘మెస్సీయ’గా నిలుపుతుంది.
- source_word: λαλοῦμεν
  choice: మేము మాట్లాడుతున్నాం
  rationale: వర్తమానకాలంలోని తక్షణ, కొనసాగుతున్న మాటల భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τὰ δὲ πάντα
  choice: ఇదంతా
  rationale: పౌలు చెప్పినదీ చేసినదీ సమష్టిగా ఉద్దేశించబడిన సందర్భార్థాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; δέ ఇక్కడ బలమైన వ్యతిరేకతకన్నా వాక్యసంధానాన్ని సూచిస్తుంది.
- source_word: ἀγαπητοί
  choice: ప్రియులారా
  rationale: ఆప్యాయమైన సంబోధనను గౌరవప్రదమైన, సాధారణ ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: మీరు బలపడడానికే
  rationale: οἰκοδομή లోని నిర్మాణ రూపకానికి ఉద్దేశమైన అభివృద్ధి, దృఢీకరణ భావాన్ని అసహజమైన పదప్రయోగం లేకుండా స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: Χριστῷ అనే బిరుదు అనువాదం
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: ఈ సందర్భంలో Χριστός బిరుదు భావం క్రియాశీలంగా ఉంది. అందువల్ల ప్రధాన పాఠ్యంలో ‘మెస్సీయ’ వాడి, తెలుగులో సుపరిచితమైన సంప్రదాయ రూపం ‘క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మొదటి వాక్యంలోని అలంకారిక ప్రశ్నను, రెండవ వాక్యంలోని దేవుని సమక్ష భావాన్ని, చివరి వాక్యంలోని ఆప్యాయ సంబోధనను మరియు బలపరచే ఉద్దేశాన్ని స్పష్టంగా ఉంచాం.
