- from: 'మేము ఇంతకాలమూ మీ ఎదుట మమ్మల్ని సమర్థించుకుంటున్నామని మీరు అనుకుంటున్నారా? దేవుని సన్నిధిలో, మెస్సీయలో[a] ఉంటూ మేము మాట్లాడుతున్నాం. ప్రియులారా, ఇదంతా మీరు బలపడడానికే.


    [a] లేదా, “క్రీస్తులో.”'
  to: మేము ఇంతకాలంగా మీ ఎదుట మమ్మల్ని సమర్థించుకుంటున్నామని మీరు అనుకుంటున్నారా? దేవుని ఎదుట, మెస్సీయలో మేము మాట్లాడుతున్నాం. ప్రియులారా, ఇవన్నీ మిమ్మల్ని బలపరచడానికే.
  rationale: గ్రీకు వాక్యనిర్మాణానికి మరింత సన్నిహితంగా ఉండేందుకు ‘ఉంటూ’ను తొలగించాం. చివరి వాక్యంలో ‘ఇవన్నీ’ ద్వారా τὰ πάνταను, ‘మిమ్మల్ని బలపరచడానికే’ ద్వారా οἰκοδομή యొక్క రూపకాలంకార ఉద్దేశాన్ని సహజ ఆధునిక తెలుగులో స్పష్టపరిచాం. పాదసూచిక సూచికను ‘మెస్సీయలో’ తర్వాత ఉంచాలి.
