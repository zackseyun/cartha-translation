language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: te
  text: ఎందుకంటే, ఈ సేవాకార్య నిర్వహణ పరిశుద్ధుల కొరతలను తీర్చడం మాత్రమే కాదు[a], దేవునికి అనేక కృతజ్ఞతల ద్వారా సమృద్ధిగా పొంగిపొర్లుతోంది—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిశుద్ధులకు లోటుగా ఉన్నదాన్ని పూరించడం మాత్రమే కాదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి వివరణను పరిచయం చేసే కారణార్థక బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διακονία
  choice: పరిచర్య
  rationale: సేవ చేయడాన్ని సూచించే పౌలు వాడుకను నిలుపుతూ, తరువాతి λειτουργία నుండి పదభేదాన్ని కాపాడుతుంది.
- source_word: λειτουργίας
  choice: సేవాకార్యం
  rationale: నిర్దిష్టమైన సహాయక సేవను సూచిస్తూ, διακονίαతో ఒకే పదంగా కలిసిపోకుండా స్పష్టంగా ఉంటుంది.
- source_word: προσαναπληροῦσα
  choice: తీర్చడం
  rationale: లోటుగా ఉన్నదాన్ని పూరించడం అనే భావాన్ని ఈ దాతృత్వ సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: ὑστερήματα
  choice: కొరతలు
  rationale: మూలపదంలోని లోటు లేదా లేమి భావాన్ని ‘అవసరాలు’ కంటే నేరుగా నిలుపుతుంది.
- source_word: ἁγίων
  choice: పరిశుద్ధులు
  rationale: విశ్వాసుల కోసం పౌలు సాధారణంగా వాడే పదానికి స్థిరమైన తెలుగు సమానార్థకం; తరువాతి కాలపు ప్రత్యేక బిరుదును ఉద్దేశించదు.
- source_word: περισσεύουσα
  choice: సమృద్ధిగా ఫలిస్తోంది
  rationale: కేవలం సరిపోవడాన్ని మించి విస్తారమైన ఫలితాన్ని కలిగించడం అనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: దేవునికి అనేక కృతజ్ఞతాస్తుతులు చెల్లేలా
  rationale: διά వల్ల వ్యక్తమయ్యే సాధనం లేదా ఫలిత సంబంధంలోని స్వల్ప సందిగ్ధతను కఠినంగా నిర్ణయించకుండా, కృతజ్ఞతలు దేవుని వైపు మళ్లుతాయనే భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ἅγιοι పదానికి అనువాదం
  choice: పరిశుద్ధులు
  alternative: దేవుని ప్రజలు
  rationale: పౌలు సంఘ విశ్వాసులకు వాడే కీలక పదాన్ని నిలుపుతుంది; ‘దేవుని ప్రజలు’ భావానువాదమే అయినా మూలపదంతో తక్కువ ప్రత్యక్ష సంబంధం కలిగి ఉంది.
- issue: διά πολλῶν εὐχαριστιῶν యొక్క సంబంధం
  choice: దేవునికి అనేక కృతజ్ఞతాస్తుతులు చెల్లేలా
  alternative: దేవునికి అర్పించే అనేక కృతజ్ఞతాస్తుతుల ద్వారా
  rationale: ఈ సేవ అనేక కృతజ్ఞతలకు దారితీస్తుందనే సందర్భార్థాన్ని సహజంగా అందిస్తూ, సాధనం మరియు ఫలితం మధ్య ఉన్న గ్రీకు నిర్మాణపు సున్నితత్వాన్ని పూర్తిగా మూసివేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘పరిచర్య/సేవాకార్యం’ ద్వారా రెండు సంబంధిత గ్రీకు నామవాచకాల మధ్య భేదం నిలుపబడింది. మూలంలోని కొనసాగుతున్న వాక్యాన్ని సూచించేందుకు చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది.
