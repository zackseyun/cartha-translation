    text: లేదా, ‘పరిశుద్ధులకు లోటుగా ఉన్నదాన్ని పూరించడం మాత్రమే కాదు.’
    reason: lexical_alternative
  revision_rationale: The revision replaces an unnatural noun stack with idiomatic Telugu while preserving the distinction between διακονία and λειτουργία. It renders περισσεύουσα with the explicit abundance image “సమృద్ధిగా పొంగిపొర్లుతోంది” and translates διὰ πολλῶν εὐχαριστιῶν instrumentally (“అనేక కృతజ్ఞతల ద్వారా”), preserving the source relation without imposing a narrower purpose interpretation. The existing footnote anchor and its lexical alternative remain valid.
