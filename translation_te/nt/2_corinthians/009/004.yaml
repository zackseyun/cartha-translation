source:
  edition: SBLGNT
  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: te
  text: ఒకవేళ మాసిదోనీయుల్లో ఎవరైనా నాతో వచ్చి, మీరు సిద్ధంగా లేరని కనుగొంటే, ఈ నమ్మకం విషయంలో[a] మేము అవమానానికి గురవుతామేమో—మీ సంగతి చెప్పనక్కర్లేదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ నమ్మకంలో.” సందర్భంలో ఈ గ్రీకు పదానికి “ఈ పూనికలో” లేదా “ఈ పరిస్థితిలో” అనే అర్థాలు కూడా రావచ్చు; ఇక్కడ అది కొరింథీయుల విషయంలో పౌలుకు ఉన్న నమ్మకాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ సంగతి ఇక చెప్పనే అక్కర్లేదు.” వారు సిద్ధంగా లేకపోతే కొరింథీయులు కూడా అవమానానికి గురవుతారని పౌలు పరోక్షంగా సూచిస్తున్నాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: ఒకవేళ … అయితే … ఏమో
  rationale: μή πως వ్యక్తం చేసే ఆందోళనను, ἐάν సూచించే సంభావ్య పరిస్థితిని సహజమైన తెలుగు షరతు–ఆందోళన నిర్మాణంతో తెలిపింది.
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: మాసిదోనియవారిలో ఎవరైనా నాతో వచ్చి
  rationale: అనిర్దిష్టంగా ఉన్న Μακεδόνεςను ఒక నిర్దిష్ట బృందంగా కాక, వారిలో ఎవరైనా రావచ్చనే భావంతో అనువదించింది.
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: మీరు సిద్ధంగా లేరని కనుగొంటే
  rationale: ἀπαρασκευάστουςలోని ‘ముందుగా సిద్ధం కాని’ భావాన్ని సందర్భానుకూలంగా, స్పష్టంగా తెలిపింది.
- source_word: καταισχυνθῶμεν
  choice: మేము అవమానానికి గురవుతామేమో
  rationale: క్రియలోని కర్మణి రూపాన్నీ, ఇతరుల ఎదుట కలిగే సామాజిక అవమాన భావాన్నీ నిలుపుతుంది.
- source_word: ἡμεῖς
  choice: మేము
  rationale: గ్రీకులో స్పష్టంగా ఉంచిన సర్వనామంలోని ఉద్ఘాటనను తెలుగులోనూ నిలిపింది.
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: మీ సంగతి చెప్పనక్కర్లేదు
  rationale: కొరింథీయులు కూడా ఆ అవమానంలో పాలుపంచుకుంటారని నేరుగా గట్టిగా చెప్పకుండా సూచించే పౌలు మధ్యప్రస్తావనను సహజంగా తెలిపింది.
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: ఈ నమ్మకం విషయంలో
  rationale: ὑπόστασιςను తరువాతి తాత్త్విక అర్థమైన ‘సారం/పదార్థం’గా కాక, కొరింథీయుల సిద్ధతపై పౌలుకున్న నమ్మకంగా సందర్భానుసారంగా అర్థం చేసుకుంది; ఇతర సందర్భసాధ్య అర్థాలను పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: ఈ సందర్భంలో ὑπόστασις అర్థం
  choice: నమ్మకం
  alternative: ఈ పూనిక / ఈ పరిస్థితి
  rationale: ముందటి వచనాల్లో కొరింథీయుల గురించి పౌలు వ్యక్తం చేసిన ధైర్యం లేదా నమ్మకమే తక్షణ సందర్భానికి బాగా సరిపోతుంది. అయినప్పటికీ గ్రీకు పదానికి ‘పూనిక’ లేదా ‘పరిస్థితి’ అనే సందర్భసాధ్య అర్థాలు ఉండటం వల్ల వాటిని పాదసూచికలో గుర్తించింది; ‘సారం’ వంటి తరువాతి సాంకేతిక theological అర్థాన్ని ఇక్కడ దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని సంభావ్య పరిస్థితి, ఆందోళన, ‘మేము—మీరు కూడా’ అనే మృదువైన కానీ గంభీరమైన వ్యంగ్య ఉద్ఘాటన నిలుపబడ్డాయి.
