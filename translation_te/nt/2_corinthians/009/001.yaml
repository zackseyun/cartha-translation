  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Περὶ μὲν γὰρ τῆς διακονίας τῆς εἰς τοὺς ἁγίους περισσόν μοί ἐστιν τὸ γράφειν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/001.yaml
  text: For concerning the ministry to the saints[a], it is superfluous for me to write to you,
translation:
  language: te
  text: అయితే, పరిశుద్ధుల కొరకు చేసే సేవ విషయానికి వస్తే, మీకు వ్రాయడం నాకు అనవసరమే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధులకు చేసే సేవ.” గ్రీకు ఉపసర్గ ఇక్కడ సేవ ఎవరి వైపుకు ఉద్దేశించబడిందో లేదా ఎవరి ప్రయోజనం కోసమో సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: ఈ ... గురించి
  rationale: Περὶ అంశాన్ని పరిచయం చేస్తుంది. μὲν γὰρ మునుపటి సందర్భంతో అనుసంధానిస్తూ అంశమార్పును సూచిస్తుంది; తెలుగులో సహజంగా ఉండేందుకు ‘ఈ ... గురించి’ అని ఇచ్చాం.
- source_word: διακονίας
  choice: సేవ
  rationale: ఇక్కడ διακονία అవసరంలో ఉన్న విశ్వాసుల కొరకు చేపట్టిన సహాయక సేవను సూచిస్తుంది. ‘సేవ’ దాని గౌరవప్రదమైన భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: పరిశుద్ధుల కోసం చేసే
  rationale: εἰς ఈ సందర్భంలో సేవ యొక్క దిశను లేదా లబ్ధిదారులను సూచించగలదు. ‘కోసం చేసే’ అనే రూపం తెలుగులో సహజంగా ఉండి లబ్ధిదారుల భావాన్ని వ్యక్తం చేస్తుంది; దిశార్థక ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἁγίους
  choice: పరిశుద్ధులు
  rationale: ἅγιοι పౌలు విశ్వాసులను దేవునికి ప్రత్యేకింపబడినవారిగా సూచించడానికి సాధారణంగా వాడే పదం. ‘పరిశుద్ధులు’ సంక్షిప్తమైన, స్థిరపడిన తెలుగు సమానార్థకం.
- source_word: περισσόν
  choice: అనవసరమే
  rationale: ఇక్కడ περισσόν అవసరం లేని లేదా అదనమైన పని అనే అర్థాన్ని ఇస్తుంది. ‘అనవసరమే’ సాధారణ పాఠకులకు స్పష్టంగా ఉండటంతో పాటు పౌలు వాక్యంలోని అలంకారిక బలాన్ని నిలుపుతుంది.
- source_word: μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: మీకు వ్రాయడం నాకు
  rationale: కర్తృార్థక infinitive నిర్మాణాన్ని తెలుగులో సహజమైన ‘మీకు వ్రాయడం నాకు’ అనే క్రమంలో ఇచ్చాం; ‘నాకు’ ద్వారా వ్యక్తిగత సంబంధాన్ని నిలిపాం.
theological_decisions:
- issue: εἰς ద్వారా సేవ యొక్క దిశ లేదా లబ్ధిదారుడు
  choice: పరిశుద్ధుల కోసం
  alternative: పరిశుద్ధులకు
  rationale: సందర్భంలో ఈ సేవ పరిశుద్ధుల ప్రయోజనార్థం చేయబడుతోంది; అయితే గ్రీకు విభక్తిపూర్వక పదం దిశను కూడా సూచించగలదని పాదటిప్పణిలో ప్రత్యామ్నాయం ఇచ్చి అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘పరిచర్య’ కంటే విస్తృతంగా అర్థమయ్యే ‘సేవ’ను, ‘నిరర్థకం’ కంటే సందర్భానికి సరైన ‘అనవసరం’ను ఎంచుకున్నాం. పాదటిప్పణి గుర్తు ప్రధాన వచనంలో చేర్చబడింది.
