id: 2CO.9.8
reference: 2 Corinthians 9:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: te
  text: దేవుడు సమస్త కృపను మీకు సమృద్ధిగా అనుగ్రహించగలడు. తద్వారా మీరు ప్రతి విషయంలో, ఎల్లప్పుడూ, మీకు కావలసినదంతా కలిగి[a], ప్రతి మంచి కార్యం చేయడంలో సమృద్ధిగా ఉండునట్లు చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పూర్తిగా సరిపడినంత కలిగి.’ గ్రీకు పదం సరిపోవడం, తగినంతగా ఉండడం లేదా సంతృప్తిని సూచించగలదు. ఇక్కడ స్వతంత్ర స్వయంసమృద్ధి కంటే దేవుడు అవసరమైనదాన్ని తగినంతగా సమకూర్చడమే భావం.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατεῖ
  choice: అనుగ్రహించగలడు
  rationale: వర్తమాన నిర్దేశక రూపం దేవుని సామర్థ్యాన్ని తెలియజేస్తుంది. ‘గలడు’ దైవిక సామర్థ్యంపై ఉన్న ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δὲ
  choice: వాక్యప్రవాహంలో ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక స్వల్ప అనుసంధానాన్ని సూచిస్తుంది. తెలుగులో వాక్యక్రమమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది; ‘కాని’ అని అనువదిస్తే లేనంత వ్యతిరేక భావం వస్తుంది.
- source_word: πᾶσαν χάριν
  choice: సమస్త కృపను
  rationale: χάρις ఇక్కడ ఉదారతకు దేవుడు కలిగించే సామర్థ్యంతో సహా ఆయన కృపాపూర్వక అనుగ్రహాన్ని విస్తృతంగా సూచిస్తుంది. ‘సమస్త’ πᾶσαν యొక్క సమగ్రతను నిలుపుతుంది.
- source_word: περισσεῦσαι εἰς ὑμᾶς
  choice: మీకు సమృద్ధిగా అనుగ్రహించగలడు
  rationale: ఈ పదబంధం కృప గ్రహీతల వైపు విస్తారంగా కలిగేలా దేవుడు చేయడాన్ని సూచిస్తుంది. తెలుగులో సహజత్వం కోసం కారణార్థాన్ని ‘సమృద్ధిగా అనుగ్రహించగలడు’ అని వ్యక్తం చేశాం.
- source_word: ἵνα
  choice: తద్వారా
  rationale: దేవుని సమృద్ధమైన కృపకు ఉద్దేశం లేదా ఫలితాన్ని పరిచయం చేస్తుంది.
- source_word: ἐν παντὶ πάντοτε
  choice: ప్రతి విషయంలో, ఎల్లప్పుడూ
  rationale: పౌలు వరుసగా వాడిన సమగ్రతను సూచించే పదాల ఉద్ఘాటనను రెండింటినీ స్పష్టంగా అనువదించడం ద్వారా నిలిపాం.
- source_word: πᾶσαν αὐτάρκειαν
  choice: మీకు కావలసినదంతా
  rationale: αὐτάρκεια సరిపోవడం, తగినంతగా ఉండడం లేదా సంతృప్తిని సూచించగలదు. ఈ సందర్భంలో ఉదారంగా ఇవ్వడానికి దేవుని నుండి తగిన సమకూర్పు ఉండడమే ప్రధాన భావం; స్వతంత్ర స్వయంసమృద్ధి కాదు.
- source_word: ἔχοντες
  choice: కలిగి
  rationale: ప్రధాన క్రియతో సమకాలికమైన భాగధాతు భావాన్ని నిలుపుతూ, తగిన సమకూర్పు కలిగివుండగా మంచి కార్యాల్లో సమృద్ధి చెందడాన్ని తెలియజేస్తుంది.
- source_word: περισσεύητε
  choice: సమృద్ధిగా ఉండగలరు
  rationale: ముందున్న περισσεῦσαιతో పదపునరుక్తి ద్వారా ఏర్పడిన సమృద్ధి భావాన్ని తెలుగులోనూ ‘సమృద్ధిగా’ అని పునరావృతం చేసి నిలిపాం.
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: ప్రతి మంచి కార్యం చేయడంలో
  rationale: వారు ప్రతి మంచి కార్యంలో విస్తారంగా పాలుపంచుకోవాలనే ఫలితాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఉదారత సందర్భంలో χάρις అర్థం
  choice: భౌతిక సమకూర్పుతో సహా ఉదారతకు శక్తినిచ్చే దేవుని కృపాపూర్వక అనుగ్రహం
  alternative: కేవలం అనుకూలత; లేదా ఒక నిర్దిష్ట వరం
  rationale: తక్షణ సందర్భం ఇవ్వడం గురించి ఉన్నప్పటికీ, χάριςను కేవలం ధనంగా కుదించకుండా దాని విస్తృత దైవకృప భావాన్ని ‘కృప’ నిలుపుతుంది.
- issue: αὐτάρκεια అర్థం
  choice: దేవుడు సమకూర్చే తగినంత సాధనాలు లేదా అవసరమైనదంతా
  alternative: సంతృప్తి; స్వయంసమృద్ధి
  rationale: సందర్భం విశ్వాసులు ఉదారంగా ఉండేందుకు దేవుడు సమకూర్చడం గురించి. అందువల్ల స్వతంత్రతను సూచించే తాత్విక ‘స్వయంసమృద్ధి’ భావాన్ని అనువాదం రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. మూలంలోని సమగ్రతను సూచించే వరుస పదాలను ‘సమస్త,’ ‘ప్రతి,’ ‘ఎల్లప్పుడూ,’ ‘అంతా’ రూపాల్లో నిలిపాం; περισσεύω పునరుక్తిని ‘సమృద్ధిగా’ అనే పునరావృతంతో ప్రతిబింబించాం.
