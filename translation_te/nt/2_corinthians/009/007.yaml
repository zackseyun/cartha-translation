id: 2CO.9.7
reference: 2 Corinthians 9:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: te
  text: ప్రతి ఒక్కరూ తమ హృదయంలో నిర్ణయించుకున్న ప్రకారం ఇవ్వాలి; బాధతోనో[a], బలవంతంగానో ఇవ్వకూడదు. ఎందుకంటే సంతోషంగా ఇచ్చే వ్యక్తిని దేవుడు ప్రేమిస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అయిష్టంగానో” అని కూడా అనువదించవచ్చు; గ్రీకు పదానికి అక్షరార్థంగా “దుఃఖం” లేదా “బాధ” అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: ప్రతి ఒక్కరూ
  rationale: గ్రీకులోని పంపిణీ ఏకవచన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ఇది పురుషులకు మాత్రమే పరిమితమైన అర్థాన్ని కలిగించదు.
- source_word: καθὼς προῄρηται τῇ καρδίᾳ
  choice: తమ హృదయంలో నిర్ణయించుకున్న ప్రకారం
  rationale: προῄρηται సూచించే ముందస్తు, ఉద్దేశపూర్వక నిర్ణయాన్ని ‘నిర్ణయించుకున్న’ స్పష్టంగా తెలియజేస్తుంది; ‘హృదయంలో’ అనే బైబిలీయ అంతరంగ పదచిత్రాన్ని నిలుపుతుంది.
- source_word: μὴ ἐκ λύπης
  choice: బాధతోనో ... ఇవ్వకూడదు
  rationale: λύπη యొక్క ప్రాథమిక ‘దుఃఖం/బాధ’ భావాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, ఈ సందర్భంలో కలిగే ‘అయిష్టంగా’ అనే భావాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ἢ ἐξ ἀνάγκης
  choice: బలవంతంగానో
  rationale: ఇచ్చే సందర్భంలో ἀνάγκη సూచించే ఒత్తిడి, నిర్బంధం లేదా తప్పనిసరి పరిస్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἱλαρὸν δότην
  choice: సంతోషంగా ఇచ్చే వ్యక్తిని
  rationale: ἱλαρός తెలిపే సంతోషపూర్వక స్వభావాన్ని, δότης యొక్క ఏకవచన వ్యక్తిగత దృష్టిని లింగనిరపేక్షమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἀγαπᾷ ὁ θεός
  choice: దేవుడు ప్రేమిస్తాడు
  rationale: గ్రీకు వాక్యంలోని సాధారణ క్రియార్థాన్నీ, దేవుడు అనే కర్తనూ నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: గ్రీకు ప్రతినిధి ఏకవచనాన్ని తెలుగులో వ్యక్తం చేయడం
  choice: ప్రతి ఒక్కరూ తమ హృదయంలో ... సంతోషంగా ఇచ్చే వ్యక్తిని
  alternative: ప్రతి ఒక్కడూ తన హృదయంలో ... సంతోషంగా ఇచ్చేవాణ్ణి
  rationale: మూలంలోని వ్యక్తిగత బాధ్యతను నిలుపుతూ, గ్రీకు వ్యాకరణ రూపాన్ని పురుషులకు మాత్రమే వర్తించేలా తప్పుగా చూపకుండా ఆధునిక ప్రామాణిక తెలుగు వాడబడింది.
- issue: λύπη పదాన్ని కానుక ఇచ్చే సందర్భంలో అనువదించడం
  choice: బాధతోనో
  alternative: అయిష్టంగానో
  rationale: మూలపదంలోని దుఃఖం లేదా బాధ అనే ప్రత్యక్ష భావాన్ని ప్రధాన పాఠ్యం కాపాడుతుంది; సందర్భానుసారమైన ‘అయిష్టంగా’ అనే అర్థాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. మూలంలో సందర్భం ద్వారా అర్థమయ్యే ‘ఇవ్వాలి’ అనే క్రియను తెలుగులో వాక్యం సంపూర్ణంగా, సహజంగా ఉండేందుకు స్పష్టంగా చేర్చాం. ‘తమ’ ఇక్కడ ‘ప్రతి ఒక్కరూ’ అనే ప్రతినిధి ఏకవచన భావాన్ని లింగనిరపేక్షంగా సూచిస్తుంది.
