id: 2CO.9.5
reference: 2 Corinthians 9:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: te
  text: కాబట్టి, సోదరులు[a] మాకంటే ముందుగా మీ వద్దకు వెళ్లి, మీరు ముందే వాగ్దానం చేసిన ఉదారమైన కానుకను[b] ముందుగానే ఏర్పాటు చేసి, అది ఉదారమైన కానుకగా సిద్ధంగా ఉండేలా, బలవంతంగా రాబట్టినదానిగా[c] కాకుండా ఉండేలా వారిని కోరడం అవసరమని నేను భావించాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ ప్రతినిధి బృందాన్ని విస్తృతార్థంలో అర్థం చేసుకుంటే, ‘సోదర సోదరీమణులు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఆశీర్వాదం.’ ఇక్కడ అది కొరింథీయులు వాగ్దానం చేసిన ఉదారమైన కానుకను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు పదమైన πλεονεξία సాధారణంగా ‘లోభం’ లేదా ‘దురాశ’ అని అర్థం. ఇక్కడ అది ఈ కానుకను ఉదారంగా ఇచ్చినదిగా కాక, ఒత్తిడితో గుంజుకున్నదిగా చూపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον οὖν ἡγησάμην
  choice: కాబట్టి ... అవసరమని నేను భావించాను
  rationale: పౌలు చేసిన ఆచరణాత్మక నిర్ణయాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, అవసరాన్ని అతిగా బలవంతంగా చూపదు.
- source_word: παρακαλέσαι
  choice: కోరడం
  rationale: ఇక్కడ సహోదరులు ముందుగా వెళ్లాలని పౌలు గట్టిగా విజ్ఞప్తి చేస్తున్న భావాన్ని మర్యాదపూర్వకమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τοὺς ἀδελφοὺς
  choice: సోదరులు
  rationale: గ్రీకు పదంలోని వ్యాకరణపరమైన పుంలింగ బహువచనాన్ని నిలుపుతుంది; విస్తృత సమూహాన్ని సూచించే అవకాశం పాదసూచికలో ఇవ్వబడింది.
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: మాకంటే ముందుగా మీ దగ్గరికి వెళ్లి
  rationale: ప్రతినిధులు పౌలు బృందంకంటే ముందుగా కొరింథీయుల దగ్గరికి వెళ్లడాన్ని ప్రయాణ సందర్భానికి అనుగుణంగా స్పష్టం చేస్తుంది.
- source_word: προκαταρτίσωσι
  choice: ముందుగానే ఏర్పాటు చేయాలని
  rationale: కానుకను పౌలు రాకముందే క్రమబద్ధంగా సమకూర్చి సిద్ధం చేయడం అనే భావాన్ని ఇస్తుంది; తరువాత వచ్చే ‘సిద్ధంగా’ అనే పదంతో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: προεπηγγελμένην
  choice: మీరు ముందే వాగ్దానం చేసిన
  rationale: ముందుగా ఇచ్చిన వాగ్దానాన్ని సహజమైన తెలుగు కాలసంబంధంతో తెలియజేస్తుంది.
- source_word: εὐλογίαν
  choice: ఉదారమైన కానుక
  rationale: ఈ విరాళ సేకరణ సందర్భంలో ‘ఆశీర్వాదం’ అనే పదం కానుక యొక్క ఉదార స్వభావాన్ని సూచిస్తుంది; మూలపదం యొక్క అక్షరార్థం పాదసూచికలో నిలుపబడింది.
- source_word: οὕτως ὡς εὐλογίαν
  choice: అలా ... ఉదారమైన కానుకగా
  rationale: οὕτως అనే విధాన భావాన్ని ‘అలా’తో, పునరావృతమైన εὐλογίανను అదే తెలుగు పదబంధంతో ప్రతిబింబిస్తుంది.
- source_word: πλεονεξίαν
  choice: బలవంతంగా రాబట్టినదానిగా
  rationale: ఈ సందర్భంలో కానుకను స్వచ్ఛంద ఉదారతకు బదులు ఒత్తిడితో గుంజుకున్నదానిగా చూపే వ్యత్యాసాన్ని స్పష్టం చేస్తుంది; ‘లోభం/దురాశ’ అనే సాధారణ పదార్థం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: ἀδελφοὺς పదంలోని లింగ సూచన
  choice: సోదరులు
  alternative: సోదర సోదరీమణులు / తోటి విశ్వాసులు
  rationale: మూలంలోని పుంలింగ బహువచనాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, సందర్భం విస్తృత సమూహాన్ని సూచించవచ్చనే అవకాశాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: విరాళ సందర్భంలో εὐλογία అర్థం
  choice: ఉదారమైన కానుక
  alternative: ఆశీర్వాదం
  rationale: ఇక్కడ ఉద్దేశించబడిన ఆర్థిక సహాయాన్ని సాధారణ పాఠకునికి స్పష్టంగా చేస్తూనే, పౌలు వాడిన ‘ఆశీర్వాదం’ అనే రూపకాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- issue: εὐλογία మరియు πλεονεξία మధ్య వ్యత్యాసం
  choice: ఉదారమైన కానుకగా ... బలవంతంగా రాబట్టినదానిగా కాక
  alternative: ఆశీర్వాదంగా ... దురాశగా కాక
  rationale: విరాళం స్వచ్ఛంద ఉదారతతో సిద్ధమవ్వాలా, లేక ఒత్తిడితో గుంజుకున్నదిగా కనిపించాలా అనే పౌలు ఉద్దేశించిన నైతిక ఉద్వేగాన్ని తెలుగులో అర్థవంతంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘ఉదారమైన కానుక’ అనే పునరుక్తి మూలంలోని εὐλογία పునరావృతిని నిలుపుతుంది; ‘అలా’ οὕτως భావాన్ని ప్రతిబింబిస్తుంది.
