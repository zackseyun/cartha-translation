id: 2CO.9.2
reference: 2 Corinthians 9:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: te
  text: ఎందుకంటే మీ సుముఖత నాకు తెలుసు. మీ గురించి మాసిదోనియవారి ఎదుట నేను గొప్పగా చెప్పుకుంటూ, అఖయ గత సంవత్సరం నుంచే సిద్ధంగా ఉందని చెబుతున్నాను.[a] మీ ఉత్సాహం వారిలో ఎక్కువమందిని ప్రేరేపించింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అఖయ అనేది కొరింథు కూడా ఉన్న రోమా పాలనా ప్రాంతం; ఇక్కడ ఆ ప్రాంతంలోని విశ్వాసులను సూచించేలా ప్రాంతం పేరు వాడబడింది.
    reason: cultural_note
  - marker: b
    text: లేదా, “వారిలో అత్యధికులను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμίαν
  choice: ఆసక్తి
  rationale: ఈ పదం మనస్ఫూర్తిగా ముందుకు రావడాన్ని, సిద్ధమనస్సును సూచిస్తుంది. ఆధునిక తెలుగులో ‘ఆసక్తి’ సహజంగా ఉండి, సందర్భంలోని స్వచ్ఛంద ఉత్సాహాన్ని తెలియజేస్తుంది.
- source_word: καυχῶμαι
  choice: గొప్పగా చెప్పుకుంటున్నాను
  rationale: పౌలు ఉపయోగించిన బలమైన అలంకారిక భావాన్ని తగ్గించకుండా, తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὑπὲρ ὑμῶν
  choice: మీ పక్షంగా
  rationale: మాసిదోనియవారి ఎదుట పౌలు కొరింథీయులకు అనుకూలంగా మాట్లాడుతున్న భావాన్ని కాపాడుతుంది.
- source_word: Μακεδόσιν
  choice: మాసిదోనియవారి దగ్గర
  rationale: ఇది మాసిదోనియ ప్రాంత ప్రజలను సూచించే దత్తివాచక బహువచనం; తెలుగులో సంభాషణ సందర్భానికి ‘దగ్గర’ సహజం.
- source_word: Ἀχαΐα
  choice: అఖయ
  rationale: మూలంలోని రోమా పాలనా ప్రాంతం పేరును అలాగే ఉంచి, అక్కడి విశ్వాసులను సూచించే స్థలనామ ప్రయోగాన్ని నిలుపుతుంది.
- source_word: παρεσκεύασται
  choice: సిద్ధంగా ఉంది
  rationale: గతంలో ఏర్పడిన సిద్ధత ప్రస్తుతం కొనసాగుతున్న స్థితిని గ్రీకు పరిపూర్ణ కాలం సూచిస్తుంది.
- source_word: ἀπὸ πέρυσι
  choice: గత సంవత్సరం నుంచే
  rationale: గత సంవత్సరం మొదలైన స్థితి ఇప్పటివరకు కొనసాగుతోందనే కాలార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὸ ὑμῶν ζῆλος
  choice: మీ ఉత్సాహం
  rationale: ఇక్కడ ζῆλος సానుకూలమైన తీవ్ర ఆసక్తి, కార్యోన్ముఖతను సూచిస్తుంది; ‘ఉత్సాహం’ ఆధునిక తెలుగులో సహజం.
- source_word: ἠρέθισε
  choice: ప్రేరేపించింది
  rationale: ఈ సానుకూల సందర్భంలో ఇతరులను కార్యానికి పురికొల్పిన భావాన్ని ప్రతికూల ఛాయ లేకుండా తెలియజేస్తుంది.
- source_word: τοὺς πλείονας
  choice: వారిలో అత్యధికులను
  rationale: ముందు ప్రస్తావించిన మాసిదోనియవారే అంతర్లీన సూచన; πλείονες యొక్క ‘ఎక్కువమంది/అత్యధికులు’ అనే భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘అఖయ’ అనే పదం యొక్క సూచన
  choice: భౌగోళిక పేరైన ‘అఖయ’ను ఉంచి, అక్కడి విశ్వాసులను సూచించే స్థలనామ ప్రయోగంగా గ్రహించబడేలా చేయడం
  alternative: ‘అఖయలోని విశ్వాసులు’ లేదా ‘మీరు’ అని నేరుగా అనువదించడం
  rationale: గ్రీకు మూలం Ἀχαΐα అనే ప్రాంతనామాన్నే ఉపయోగిస్తుంది. దానిని నిలపడం పౌలు మాటల విస్తృత ప్రాంతీయ పరిధిని కాపాడుతుంది.
- issue: పౌలు గొప్పగా చెప్పుకోవడం
  choice: ‘గొప్పగా చెప్పుకుంటున్నాను’ అని నేరుగా అనువదించడం
  alternative: ‘గర్వంగా మాట్లాడుతున్నాను’ లేదా ‘మెచ్చుకొని చెబుతున్నాను’ అని మృదువుగా అనువదించడం
  rationale: καυχῶμαι బలమైన అలంకారిక పదం; దాని ఉద్వేగాన్ని సిద్ధాంతపరంగా మృదూకరించాల్సిన అవసరం లేదు.
- issue: τοὺς πλείονας పరిమాణార్థం
  choice: ‘అత్యధికులను’
  alternative: ‘ఎక్కువమందిని’ లేదా ‘మెజారిటీని’
  rationale: ఇది సమూహంలోని అధిక భాగాన్ని సూచిస్తుంది. ‘అత్యధికులను’ ఆ పరిమాణ భావాన్ని సహజంగా నిలుపుతుంది; ‘ఎక్కువమంది’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని స్థలనామ ప్రయోగం, పౌలు చెప్పుకున్న గొప్పతనం, ‘అత్యధికులు’ అనే పరిమాణార్థం నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
