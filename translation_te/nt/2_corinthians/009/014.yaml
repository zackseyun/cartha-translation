id: 2CO.9.14
reference: 2 Corinthians 9:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: te
  text: అలాగే, మీ కోసం వారు చేసే ప్రార్థనలో[a], దేవుడు మీపై కురిపించిన మించిన కృపను బట్టి వారు మీ పట్ల ఎంతో ఆరాటపడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ కోసం వారు చేసే విన్నపంలో, మీ పట్ల ఆరాటపడుతూ.”
    reason: δέησιςకు ‘విన్నపం’ అనే పదార్థ ప్రత్యామ్నాయాన్ని, అలాగే గ్రీకు కృదంత నిర్మాణానికి మరింత అక్షరానుసారమైన రూపాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: καὶ
  choice: అలాగే
  rationale: మునుపటి వాక్యంతో ఈ అంశాన్ని అనుసంధానించే సాధారణ సంధానపదంగా సహజమైన తెలుగులో ఇచ్చాం.
- source_word: αὐτῶν δεήσει
  choice: వారు చేసే ప్రార్థనలో
  rationale: αὐτῶνను ప్రార్థించే వారిని సూచించే స్వామ్యరూపంగా, δεήσειను ప్రార్థన జరిగే పరిధిని సూచించే దత్తివుగా గ్రహించాం. తెలుగు వాక్యనిర్మాణంలో సంబంధాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑπὲρ ὑμῶν
  choice: మీ కోసం
  rationale: ὑπέρ + షష్ఠీ విభక్తి ప్రార్థన సందర్భంలో ‘మీ పక్షంగా/మీ కోసం’ అనే భావాన్ని ఇస్తుంది; ‘మీ కోసం’ సాధారణ ఆధునిక తెలుగు.
- source_word: ἐπιποθούντων ὑμᾶς
  choice: వారు మీ పట్ల ఎంతో ఆరాటపడతారు
  rationale: ఈ వర్తమాన కృదంతం నిరంతరమైన గాఢమైన వాంఛను తెలియజేస్తుంది. తెలుగులో స్పష్టత కోసం సమాపక క్రియగా మార్చాం; మూలంలో లేని ‘చూడాలని’ అనే భావాన్ని చేర్చలేదు.
- source_word: διὰ
  choice: నుబట్టి
  rationale: 'అక్యూసేటివ్‌తో ఉన్న διά ఇక్కడ కారణాన్ని సూచిస్తుంది: దేవుని కృప కారణంగా వారు ఆరాటపడుతున్నారు.'
- source_word: ὑπερβάλλουσαν χάριν
  choice: అపారమైన కృప
  rationale: ὑπερβάλλουσαν అసాధారణంగా మించిన పరిమాణాన్ని సూచిస్తుంది; ‘అపారమైన’ సహజంగా ఆ బలాన్ని అందిస్తుంది. χάριςకు పౌలు వాడుకలోని దైవానుగ్రహ భావాన్ని నిలుపుతూ ‘కృప’ వాడాం.
- source_word: τοῦ θεοῦ ἐφ’ ὑμῖν
  choice: మీపై ఉన్న దేవుని
  rationale: ἐπί + దత్తివు ద్వారా కృప వారిపై ఉందనే రూపకాన్ని ‘మీపై ఉన్న’ నిలుపుతుంది; దేవుడే ఆ కృపకు మూలమని స్వామ్యరూపం స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ప్రార్థనకు ఆరాటానికి మధ్య వాక్యనిర్మాణ సంబంధం
  choice: వారు కొరింథీయుల కోసం ప్రార్థిస్తూ, దేవుని కృపను బట్టి వారి పట్ల ఆరాటపడుతున్న రెండు అనుసంధానిత చర్యలుగా అనువదించాం.
  alternative: ఈ పదబంధాన్ని మరింత అక్షరానుసారంగా ‘మీ కోసం చేసే విన్నపం ద్వారా, మీ పట్ల ఆరాటపడుతూ’ అని ఇవ్వవచ్చు; అప్పుడు ప్రార్థన వారి ఆరాటం వ్యక్తమయ్యే సాధనమనే ఛాయ రావచ్చు.
  rationale: గ్రీకు నిర్మాణం సంక్షిప్తంగా ఉంది; ἐπιποθούντων అనే షష్ఠీ కృదంతం αὐτῶνతో సరిపోతుంది. మూలం స్పష్టంగా చెప్పనిదాన్ని సిద్ధాంతపరంగా నిర్ణయించకుండా ప్రార్థన, ఆరాటం రెండింటినీ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. ‘కృప’ అనే స్థిరమైన బైబిలు పదాన్ని నిలిపి, సంక్లిష్టమైన గ్రీకు కృదంత నిర్మాణాన్ని సహజ తెలుగు వాక్యంగా విప్పాం.
