id: 2CO.9.3
reference: 2 Corinthians 9:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔπεμψα δὲ τοὺς ἀδελφούς, ἵνα μὴ τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν κενωθῇ ἐν τῷ μέρει τούτῳ, ἵνα καθὼς ἔλεγον παρεσκευασμένοι ἦτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/003.yaml
  text: But I sent the brothers[a], so that our boasting about you might not be emptied in this matter, so that, just as I was saying, you may be prepared[b],
translation:
  language: te
  text: అయితే, మీ గురించి మేము గొప్పగా చెప్పుకోవడం ఈ విషయంలో వట్టిదిగా తేలకుండా ఉండటానికి, నేను చెబుతూ వచ్చినట్లే మీరు సిద్ధంగా ఉండేలా, ఆ సహోదరులను పంపాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεμψα
  choice: పంపాను
  rationale: వివరణాత్మక సందర్భంలోని గ్రీకు ఏఓరిస్టును సహజమైన తెలుగు సాధారణ భూతకాలంతో వ్యక్తపరుస్తుంది.
- source_word: τοὺς ἀδελφούς
  choice: ఆ సహోదరులను
  rationale: సందర్భంలో ముందుగా ప్రస్తావించిన నిర్దిష్ట పురుష ప్రతినిధులను సూచిస్తుంది; తెలుగు నిర్దిష్టత కోసం ‘ఆ’ చేర్చబడింది.
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: మీ గురించి మేము చెప్పుకున్న గొప్ప మాటలు
  rationale: καύχημα లోని గర్వంగా చెప్పుకోవడం లేదా అతిశయంగా చెప్పడం అనే భావాన్ని, ఈ సందర్భంలో పౌలు కొరింథీయుల గురించి ఇతరులతో చెప్పిన మాటలుగా సహజంగా అందిస్తుంది.
- source_word: κενωθῇ
  choice: వట్టివి కాకుండా
  rationale: ‘ఖాళీ చేయబడటం’ అనే మూల చిత్రాన్ని తెలుగులో సహజంగా ‘ఆధారంలేనివిగా లేదా నిజం కానివిగా తేలడం’ అనే భావంతో వ్యక్తపరుస్తుంది.
- source_word: ἐν τῷ μέρει τούτῳ
  choice: ఈ విషయంలో
  rationale: μέρος ఇక్కడ భౌతిక భాగాన్ని కాక ఒక నిర్దిష్ట విషయాన్ని లేదా అంశాన్ని సూచిస్తుంది.
- source_word: καθὼς ἔλεγον
  choice: నేను చెబుతూ వచ్చినట్లే
  rationale: ἔλεγον అనే అసంపూర్ణ భూతకాల రూపంలోని కొనసాగిన లేదా పునరావృతమైన మాటల భావాన్ని కాపాడుతుంది.
- source_word: παρεσκευασμένοι ἦτε
  choice: మీరు సిద్ధంగా ఉండటానికి
  rationale: పరిణామంగా ఉండవలసిన సిద్ధస్థితిని సూచించే పరిభాషాత్మక నిర్మాణాన్ని సహజమైన తెలుగు ప్రయోజన వాక్యంగా అందిస్తుంది.
