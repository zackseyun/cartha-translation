translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని రెండు ἵνα ప్రయోజన భాగాలు రెండింటినీ ‘ఉండటానికి’ రూపంతో నిలిపి, పౌలు ఉద్దేశంలోని వరుసను కాపాడాం. ఈ పద్యంలో మూలాధారంగా అవసరమైన పాఠాంతర లేదా అర్థసందిగ్ధత గమనిక లేదు; అందువల్ల పాదటిప్పణులు చేర్చలేదు.
