  to: 'విషయం ఇదే: కొద్దిగా విత్తేవాడు కొద్దిగా కూడా కోస్తాడు; ఆశీర్వాదాలతో విత్తేవాడు ఆశీర్వాదాలతో కూడా కోస్తాడు.'
  rationale: The revision removes Telugu emphatic -నే, which can introduce an exclusivist nuance, and uses కూడా to represent the Greek καί in each result clause. It otherwise preserves the draft’s source-sensitive choice to retain the repeated blessing terminology. The footnote content is unchanged; its marker should remain attached to the first occurrence of ‘ఆశీర్వాదాలతో’ in the published text.
