id: 2CO.9.6
reference: 2 Corinthians 9:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τοῦτο δέ, ὁ σπείρων φειδομένως φειδομένως καὶ θερίσει, καὶ ὁ σπείρων ἐπ’ εὐλογίαις ἐπ’ εὐλογίαις καὶ θερίσει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: te
  text: 'విషయం ఇదే: కొద్దిగా విత్తేవాడు కొద్దిగా కూడా కోస్తాడు; ఆశీర్వాదాలతో విత్తేవాడు ఆశీర్వాదాలతో కూడా కోస్తాడు.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: 'విషయం ఇదే:'
  rationale: δέ సూచించే స్వల్ప సంభాషణా మలుపును సహజమైన తెలుగులో తెలియజేస్తూ, మూలంలో లేని కాలసూచకమైన ‘ఇప్పుడు’ అనే పదాన్ని చేర్చదు.
- source_word: ὁ σπείρων
  choice: విత్తేవాడు
  rationale: సామెతలాంటి వాక్యంలో సాధారణంగా ఎవరినైనా సూచించే substantival participle భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: φειδομένως
  choice: కొద్దిగా
  rationale: ఇక్కడ ఉద్దేశం పరిమితమైన లేదా స్వల్పమైన మోతాదు. ‘పిసినారిగా’ అనడం మూలపదం తప్పనిసరిగా వ్యక్తం చేయని నైతిక నిందను చేర్చుతుంది; ‘పొదుపుగా’ అనడం సానుకూల వివేకార్థాన్ని కలిగించవచ్చు.
- source_word: καὶ θερίσει
  choice: కోస్తాడు
  rationale: విత్తడం–కోయడం అనే వ్యవసాయ రూపకాన్ని సహజ తెలుగులో నిలుపుతుంది; ‘-గానే’ ద్వారా καί సూచించే అనురూప ఫలిత భావం వ్యక్తమవుతుంది.
- source_word: ἐπ’ εὐλογίαις
  choice: ఆశీర్వాదాలతో
  rationale: εὐλογία అనే నామవాచకంలోని ‘ఆశీర్వాదం’ భావాన్ని, దాని పునరుక్తిని కాపాడుతుంది. సందర్భంలో ఇది ఉదారమైన మోతాదును కూడా సూచించగలదని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: విత్తడం, కోయడంలో ἐπ’ εὐλογίαις అర్థం
  choice: రెండు చోట్లా ‘ఆశీర్వాదాలతో’ అని అనువదించడం
  alternative: రెండు చోట్లా ‘ఉదారంగా’ లేదా ‘సమృద్ధిగా’ అని అనువదించడం
  rationale: సందర్భం ఆర్థిక ఉదారతకు సంబంధించినందున క్రియావిశేషణార్థం సముచితమే. అయినా గ్రీకు నామవాచకంలోని ఆశీర్వాద భావాన్ని, పౌలు ఉద్దేశపూర్వకంగా చేసిన పునరుక్తిని ప్రధాన పాఠ్యంలో నిలుపడం మంచిది. ఇది భౌతిక సంపదకు యాంత్రిక హామీ ఇస్తుందని వ్యాఖ్యానించకుండా విత్తడం–కోయడం మధ్య అనురూపతను మాత్రమే తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన సామెత శైలిని ఉపయోగించాం. సమాంతర నిర్మాణం కోసం ‘కొద్దిగానే/ఆశీర్వాదాలతోనే’ ఉంచాం; గ్రీకు పునరుక్తిని కాపాడుతూ అసహజతను తగ్గించాం.
