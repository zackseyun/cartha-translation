reference: 2 Corinthians 9:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: (καθὼς γέγραπται· Ἐσκόρπισεν, ἔδωκεν τοῖς πένησιν, ἡ δικαιοσύνη αὐτοῦ μένει εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/009.yaml
  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: te
  text: 'లేఖనంలో వ్రాయబడి ఉన్నట్లుగా:


    “అతడు విస్తారంగా పంచిపెట్టాడు;


    పేదలకు ఇచ్చాడు;


    అతని నీతి[a] శాశ్వతంగా నిలిచి ఉంటుంది.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అతని న్యాయం శాశ్వతంగా నిలిచి ఉంటుంది.” గ్రీకు పదం ‘నీతి,’ ‘న్యాయం’ అనే రెండు భావాలనూ కలిగి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: లేఖనంలో ఇలా వ్రాయబడి ఉంది
  rationale: ఇది లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే స్థిర సూత్రం. తెలుగు పాఠకులకు మూల భావం స్పష్టమయ్యేలా ‘లేఖనంలో’ అని వ్యక్తం చేయబడింది.
- source_word: Ἐσκόρπισεν
  choice: ఉదారంగా పంచిపెట్టాడు
  rationale: మూల క్రియలోని విస్తారంగా వెదజల్లే చిత్రాన్ని, ఈ కీర్తన ఉల్లేఖనంలోని దానధర్మ సందర్భాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. కేవలం ‘చెదరగొట్టాడు’ అనడం తెలుగులో ఉద్దేశాన్ని తప్పుగా సూచించవచ్చు.
- source_word: ἔδωκεν
  choice: ఇచ్చాడు
  rationale: గ్రీకు అనిర్దిష్ట భూతకాల క్రియకు సరళమైన భూతకాల రూపం సహజంగా, నేరుగా సరిపోతుంది.
- source_word: τοῖς πένησιν
  choice: పేదలకు
  rationale: పరిమిత వనరులు గలవారిని సూచించే πένης పదానికి ఆధునిక ప్రామాణిక తెలుగులో నేరమైన, సులభమైన సమానార్థకం.
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: అతని నీతి
  rationale: δικαιοσύνη యొక్క నైతిక సదాచారం, న్యాయం అనే భావపరిధిని ‘నీతి’ సంక్షిప్తంగా మోస్తుంది; ‘న్యాయం’ అనే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలిపింది.
- source_word: μένει
  choice: నిలిచి ఉంటుంది
  rationale: కొనసాగడం లేదా నిలిచి ఉండడం అనే వర్తమాన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰς τὸν αἰῶνα
  choice: శాశ్వతంగా
  rationale: అంతం లేకుండా కొనసాగడాన్ని సూచించే గ్రీకు నుడికారానికి గౌరవప్రదమైన, సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: పౌలు సందర్భంలో δικαιοσύνη పదం అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ కీర్తన ఉల్లేఖనంలో పదం ఉదారుడి నిలిచే నైతిక సదాచారాన్ని లేదా నీతికార్యాన్ని సూచించగలదు. ‘నీతి’ విస్తృత భావాన్ని ప్రధాన పాఠంలో కాపాడుతుంది; న్యాయ భావాన్ని పాదటిప్పణి ద్వారా విస్మరించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; లేఖన ఉల్లేఖనానికి తగిన గౌరవప్రదమైన, కవితాత్మక పంక్తి విభజన. మూలంలోని వెదజల్లే రూపకాన్ని తెలుగులో అపార్థం కాకుండా ‘ఉదారంగా పంచిపెట్టాడు’గా భావసహితంగా అందించింది.
