  text: Thanks be to God for his indescribable gift[a].
translation:
  language: te
  text: వర్ణించలేని ఆయన వరాన్ని బట్టి దేవునికి కృతజ్ఞతలు![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మాటల్లో చెప్పలేని ఆయన బహుమానాన్ని బట్టి.’ గ్రీకు విశేషణం పూర్తిగా వర్ణించడానికి లేదా వివరించడానికి వీలులేనిదాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: కృతజ్ఞతలు
  rationale: τῷ θεῷ అనే దత్తివుతో ఉన్న ఈ స్తుతి-రూప ప్రయోగంలో χάρις ‘కృప’ కంటే దేవునికి అర్పించే కృతజ్ఞతను సూచిస్తుంది.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: కృతజ్ఞతను స్వీకరించే వ్యక్తిని సూచించే దత్తివును సహజమైన తెలుగులో ‘దేవునికి’గా అనువదించాం.
- source_word: ἐπὶ
  choice: బట్టి
  rationale: ఇక్కడ దత్తివుతో కూడిన ἐπί కృతజ్ఞతకు కారణం లేదా ఆధారాన్ని సూచిస్తుంది; ‘బట్టి’ ఆ సంబంధాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἀνεκδιηγήτῳ
  choice: వర్ణించలేని
  rationale: పూర్తిగా వివరించడం లేదా మాటల్లో చెప్పడం సాధ్యం కానిదనే భావాన్ని ఆధునిక, సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: సర్వనామం తిరిగి దేవునినే సూచిస్తుంది; గ్రీకు పాఠంలోని సర్వనామ రూపాన్ని నిలుపుతూ తెలుగులో గౌరవార్థకంగా ఇచ్చాం.
- source_word: δωρεᾷ
  choice: వరం
  rationale: δωρεά ఉచితంగా అనుగ్రహించబడిన బహుమతిని సూచిస్తుంది; ఈ దేవుని అనుగ్రహ సందర్భంలో ‘వరం’ సహజంగా, గంభీరంగా ఉంటుంది.
theological_decisions:
- issue: ‘ఆయన వర్ణించలేని వరం’ దేనిని సూచిస్తుంది?
  choice: దేవుని వరం అని మాత్రమే ఉంచి, దాని నిర్దిష్ట సూచనను అనువాదంలో వివరించలేదు.
  alternative: క్రీస్తు; క్రీస్తులోని రక్షణ లేదా కృప; కొరింథీయుల ఉదారతతో సహా దేవుని కృపాపూర్వక ఏర్పాటు.
  rationale: వచనం స్వయంగా ‘ఆయన వరం’ అని మాత్రమే చెబుతుంది. సమీప సందర్భం దేవుని కృప వల్ల కలిగిన ఉదారతను ప్రస్తావించినప్పటికీ, క్రైస్తవ వ్యాఖ్యానంలో క్రీస్తు కూడా ప్రధానంగా భావించబడతాడు. ఈ ఉద్దేశపూర్వక విస్తృతతను అనువాదం కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన కృతజ్ఞతా ఉద్గారంగా రూపొందించాం. ‘వరం’ ప్రధాన పాఠంలో సంక్షిప్తంగా ఉండగా, ‘బహుమానం’ అనే సమీపార్థాన్ని పాదసూచికలో ఇచ్చాం.
