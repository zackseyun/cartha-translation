id: 2CO.9.11
reference: 2 Corinthians 9:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν παντὶ πλουτιζόμενοι εἰς πᾶσαν ἁπλότητα, ἥτις κατεργάζεται δι’ ἡμῶν εὐχαριστίαν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/011.yaml
  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: te
  text: మీరు అన్ని విధాలుగా సమృద్ధిపరచబడి, హృదయపూర్వకంగా ఉదారంగా ఇవ్వగలిగేలా ఉంటారు; ఆ ఉదారత మా ద్వారా దేవునికి కృతజ్ఞత కలుగజేస్తుంది—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παντὶ
  choice: అన్ని విధాలుగా
  rationale: ఈ ప్రయోగం ఒక నిర్దిష్ట రంగాన్ని కాకుండా సమగ్రంగా సమకూర్చబడటాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘అన్ని విధాలుగా’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: πλουτιζόμενοι
  choice: సమృద్ధిపరచబడుతూ ఉంటారు
  rationale: వర్తమానకాల నిష్క్రియార్థాన్ని నిలుపుతూ, దేవుడే అంతర్లీనంగా కార్యనిర్వాహకుడని సూచిస్తుంది. ఇది కేవలం ధనవంతులు కావడం అనే భావాన్ని నివారిస్తుంది.
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: ప్రతి విధమైన ఉదారత చూపడానికి
  rationale: εἰς ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. కానుకలు సమకూర్చే సందర్భంలో ἁπλότης నిష్కపటతకన్నా చేతులు విప్పి ఇచ్చే ఉదారతను ప్రధానంగా సూచిస్తుంది; ‘చూపడానికి’ తెలుగులో ఆ ఉద్దేశ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἥτις
  choice: ఆ ఉదారత
  rationale: గ్రీకు సంబంధసర్వనామం ముందున్న ἁπλότηςను తిరిగి సూచిస్తుంది. తెలుగులో అస్పష్టత లేకుండా ఉండేందుకు నామవాచకాన్ని పునరుక్తి చేయడం సహజం.
- source_word: κατεργάζεται
  choice: కలిగిస్తుంది
  rationale: ఏదో ఒక ఫలితాన్ని ఉత్పన్నం చేయడం లేదా జరిగేలా చేయడం అనే క్రియార్థాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: δι’ ἡμῶν
  choice: మా ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధన లేదా మధ్యవర్తిత్వ భావాన్ని నేరుగా నిలుపుతుంది; ‘మా పరిచర్య ద్వారా’ అని మూలంలో లేని పదాన్ని చేర్చదు.
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: దేవునికి కృతజ్ఞతను
  rationale: దేవునివైపు వ్యక్తమయ్యే కృతజ్ఞత అనే నామవాచక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: కానుకల సందర్భంలో ἁπλότης అర్థం
  choice: ఉదారత
  alternative: దాతృత్వం; నిష్కపటత; సరళత; ఏకమనస్సు
  rationale: ఈ పదానికి ఇతర సందర్భాల్లో సరళత లేదా నిష్కపటత అనే అర్థాలు ఉండగలిగినా, ఇక్కడ ఆర్థిక సహాయం, దాని నిర్వహణ, దాని వల్ల దేవునికి కలిగే కృతజ్ఞత అనే తక్షణ సందర్భం చేతులు విప్పి ఇచ్చే ఉదారతను బలపరుస్తుంది. అంతర్గత నైతిక గుణాన్ని మాత్రమే సూచించేలా అనువదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు వాక్యంలోని కొనసాగింపు భావాన్ని చివరి దీర్ఘ విరామచిహ్నంతో నిలిపాం. నిష్క్రియ నిర్మాణం కొంత అధికారికంగా ఉన్నప్పటికీ, దేవుడే సమృద్ధిపరచేవాడనే అంతర్లీన భావాన్ని ప్రకటితంగా మార్చకుండా కాపాడుతుంది.
