revisions:
- from: ప్రతి విధమైన ఉదారత[a] చూపడానికి మీరు అన్ని విధాలుగా సమృద్ధిపరచబడుతూ ఉంటారు; ఆ ఉదారత మా ద్వారా దేవునికి కృతజ్ఞతను కలిగిస్తుంది—
  to: మీరు అన్ని విధాలుగా సమృద్ధిపరచబడి, హృదయపూర్వకంగా ఉదారంగా ఇవ్వగలిగేలా ఉంటారు; ఆ ఉదారత మా ద్వారా దేవునికి కృతజ్ఞత కలుగజేస్తుంది—
  rationale: The revision replaces the potentially display-oriented phrase ‘ఉదారత చూపడానికి’ with a natural Telugu expression for being enabled to give generously. It also streamlines the passive participial wording. The lexical note is retained, with only a minor stylistic adjustment to its opening.
