review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the supplier/sower/seed/bread agricultural imagery and the three future actions. However, rendering τὸν σπόρον ὑμῶν as “మీకు విత్తనాన్ని” changes the explicit possessive “your seed” into a recipient expression (“seed for you”). The possessive should be retained.
  naturalness: The Telugu is modern and generally natural. “దాన్ని విస్తారంగా పెంచి” is understandable, but using “మీ విత్తనాన్ని” directly is both more precise and smoother in this context.
  terminology: “నీతి” is an appropriate primary rendering for δικαιοσύνη here, and the alternative “న్యాయం” is appropriately retained in a footnote. “పంట” suitably conveys the collective agricultural sense of γενήματα.
  issues:
  - severity: medium
    issue: The possessive force of τὸν σπόρον ὑμῶν is not retained.
    rationale: “మీకు విత్తనాన్ని” means that seed is supplied to the readers, whereas the Greek explicitly says that their seed will be supplied and multiplied. The metaphorical reference to their own seed/capacity for generosity should remain explicit.
