  text: ὁ δὲ ἐπιχορηγῶν ⸀σπόρον τῷ σπείροντι καὶ ἄρτον εἰς βρῶσιν ⸀χορηγήσει καὶ ⸀πληθυνεῖ τὸν σπόρον ὑμῶν καὶ ⸀αὐξήσει τὰ γενήματα τῆς δικαιοσύνης ὑμῶν·)
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: te
  text: విత్తేవానికి విత్తనాన్ని, తినడానికి రొట్టెను సమకూర్చేవాడు మీ విత్తనాన్ని సమకూర్చి, దాన్ని విస్తారంగా పెంచి, మీ నీతి పంటను వృద్ధి చేస్తాడు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ నీతి ఫలాలను/దిగుబడిని వృద్ధి చేస్తాడు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ న్యాయం పంటను వృద్ధి చేస్తాడు.” గ్రీకు δικαιοσύνη అనే పదానికి “నీతి” లేదా కొన్ని సందర్భాల్లో “న్యాయం” అనే అర్థం ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ ἐπιχορηγῶν
  choice: సమకూర్చేవాడు
  rationale: ఆర్టికల్‌తో ఉన్న వర్తమాన కృదంతాన్ని వ్యక్తిని సూచించే రూపంగా అనువదించాం. ἐπιχορηγέωలోని సమృద్ధిగా అందించే భావఛాయను సందర్భం తెలియజేస్తుంది; ‘సమకూర్చేవాడు’ సహజంగా ఉండి మూలంలోని సరఫరా భావాన్ని నిలుపుతుంది. δέను తెలుగులో తప్పనిసరిగా ప్రత్యేక పదంతో చూపకుండా వాక్యసంబంధానికి వదిలాం.
- source_word: σπόρον τῷ σπείροντι
  choice: విత్తేవానికి విత్తనాన్ని
  rationale: వ్యవసాయ రూపకాన్ని నేరుగా నిలుపుతూ, substantival participleను సహజమైన తెలుగు వ్యక్తివాచక రూపంతో ఇచ్చాం.
- source_word: ἄρτον εἰς βρῶσιν
  choice: తినడానికి రొట్టెను
  rationale: εἰς βρῶσιν తెలిపే ప్రయోజన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, విత్తనానికి మరియు తినే రొట్టెకు మధ్య తేడాను నిలిపాం.
- source_word: χορηγήσει καὶ πληθυνεῖ τὸν σπόρον ὑμῶν
  choice: మీకు విత్తనాన్ని సమకూర్చి, దాన్ని విస్తారంగా పెంచి
  rationale: రెండు భవిష్య క్రియలైన ‘సమకూర్చును’ మరియు ‘అధికం చేయును’ అనే భావాలను వేర్వేరుగా నిలిపాం. గ్రీకులోని ‘మీ విత్తనం’ భావం తెలుగులో సహజంగా వినిపించేందుకు ‘మీకు విత్తనాన్ని’ అని ఇచ్చాం; ఇది వారి ఉదారతకు దేవుడు కల్పించే సామర్థ్యమనే రూపకార్థాన్ని సంకుచితం చేయదు.
- source_word: αὐξήσει τὰ γενήματα
  choice: పంటను వృద్ధి చేస్తాడు
  rationale: γενήματα అనేది దిగుబడి, పంట లేదా ఫలాలను సూచిస్తుంది. వ్యవసాయ రూపకాన్ని నిలుపుతూ సమష్టి భావంలో ‘పంట’ను ఎంచుకున్నాం; αὐξήσειకు ‘వృద్ధి చేస్తాడు’ అని ఇచ్చాం.
- source_word: τῆς δικαιοσύνης ὑμῶν
  choice: మీ నీతి
  rationale: δικαιοσύνηకు పౌలు వాడుకలో విస్తృతమైన ‘నీతి’ని ప్రధాన పాఠంలో ఉంచాం. ‘న్యాయం’ అనే సాధ్యమైన భావాన్ని పాదసూచికలో సంరక్షించాం.
theological_decisions:
- issue: ‘మీ నీతి పంట’ అనే పదబంధం యొక్క భావం
  choice: కొరింథీయుల నీతియుక్తమైన ఉదారతనుండి కలిగే ఫలితాలను సూచించే వ్యవసాయ రూపకంగా, దాని విస్తృతిని నిలుపడం
  alternative: దీనిని కేవలం భౌతిక ప్రతిఫలంగా, కేవలం న్యాయాచరణగా, లేదా కేవలం నీతిస్థితికి సాక్ష్యంగా పరిమితం చేయడం
  rationale: ఉదారంగా ఇవ్వడం గురించిన సందర్భంలో వ్యవసాయ రూపకం ఉంది. అనువాదం భౌతిక సంపద వాగ్దానానికి గానీ, న్యాయం అనే ఒక్క భావానికి గానీ, న్యాయస్థాన సంబంధ నీతికి మాత్రమే గానీ దాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. ‘విత్తనం—పంట’ అనే వ్యవసాయ రూపకాన్ని కొనసాగించాం; మూలంలో స్పష్టంగా లేని ‘దేవుడు’ అనే నామాన్ని పాఠ్యంలో చేర్చలేదు.
