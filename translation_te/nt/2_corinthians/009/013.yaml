id: 2CO.9.13
reference: 2 Corinthians 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: te
  text: ఈ సేవ ద్వారా రుజువైనదాన్ని బట్టి, మీరు మెస్సీయ[a] సువార్తను ఒప్పుకొని దానికి లోబడుతున్నందుకూ[b], వారికీ అందరికీ ఉదారంగా పంచినందుకూ[c] వారు దేవుణ్ణి మహిమపరుస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు సువార్త.’ గ్రీకు Χριστός ఇక్కడ ఒక బిరుదు; దాని అర్థాన్ని చూపడానికి ప్రధాన పాఠంలో ‘మెస్సీయ’ అని అనువదించాం.
    reason: alternative_rendering
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘మెస్సీయ సువార్తపట్ల మీ ఒప్పుకోలు యొక్క లోబడుటను బట్టి.’ గ్రీకు పదబంధం ఒప్పుకోలు మరియు విధేయత మధ్య సంబంధాన్ని సాంద్రంగా వ్యక్తం చేస్తుంది.
    reason: preserve_ambiguity
  - marker: c
    text: ఇక్కడ ‘పంచడం’ సాధారణ సహవాసాన్ని మాత్రమే కాక, ముఖ్యంగా అవసరంలో ఉన్నవారికి కానుకలు ఇవ్వడం ద్వారా పాలుపంచుకోవడాన్ని సూచిస్తుంది.
    reason: contextual_lexical_note
lexical_decisions:
- source_word: δοκιμῆς τῆς διακονίας ταύτης
  choice: ఈ సేవ అందించిన రుజువు
  rationale: δοκιμή ఇక్కడ పరీక్షించే ప్రక్రియకన్నా, ఈ సహాయసేవ ద్వారా బయటపడిన రుజువు లేదా సాక్ష్యాన్ని సూచిస్తుంది. ‘ఈ సేవ అందించిన రుజువు’ అనే రూపం గ్రీకు సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: δοξάζοντες τὸν θεὸν
  choice: వారు దేవుణ్ణి మహిమపరుస్తారు
  rationale: దీర్ఘమైన గ్రీకు వాక్యంలోని వర్తమాన కృదంతాన్ని తెలుగులో స్పష్టమైన సమాపక క్రియగా ఇచ్చాం; δοξάζω యొక్క భావబలాన్ని ‘మహిమపరుస్తారు’ నిలుపుతుంది.
- source_word: ὑποταγῇ τῆς ὁμολογίας ὑμῶν
  choice: మీరు ... ఒప్పుకొని దానికి లోబడుతున్నందుకు
  rationale: గ్రీకులోని ‘మీ ఒప్పుకోలు యొక్క విధేయత/లోబడుట’ అనే సాంద్రమైన నిర్మాణాన్ని తెలుగులో సహజంగా విప్పి చెప్పాం. ఒప్పుకోలు మరియు ఆ ఒప్పుకోలకు తగిన లోబడుట రెండూ నిలిచాయి.
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: మెస్సీయ సువార్తను ... దానికి
  rationale: εἰς సూచించే సువార్తపట్ల దిశ లేదా సంబంధాన్ని ‘దానికి లోబడటం’ స్పష్టంగా తెలియజేస్తుంది. Χριστόςను సందర్భంలోని బిరుదు భావంతో ‘మెస్సీయ’గా ఇచ్చాం.
- source_word: ἁπλότητι τῆς κοινωνίας
  choice: ఉదారంగా పంచుకుంటున్నందుకు
  rationale: ఈ కానుకల సేకరణ సందర్భంలో ἁπλότης దాపరికంలేని ఉదారతను, κοινωνία భౌతిక సహాయంలో భాగస్వామ్యాన్ని సూచిస్తాయి. ఈ రెండింటినీ సహజంగా కలిపే రూపమిది.
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: వారితోనూ అందరితోనూ
  rationale: κοινωνίαను ‘పంచుకోవడం’గా ఇచ్చినందున, పునరుక్త εἰς యొక్క దిశాభావాన్ని తెలుగులో సహజమైన ‘వారితోనూ అందరితోనూ’ తెలియజేస్తుంది.
theological_decisions:
- issue: Χριστοῦ అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ అభిషిక్తుడైన వాగ్దానపూర్వక రాజును సూచించే బిరుదు. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని స్పష్టంగా ఉంచుతుంది; పాఠంలో అదనపు సిద్ధాంత వివరణను చేర్చదు.
- issue: ὑποταγῇ τῆς ὁμολογίας మధ్య సంబంధం
  choice: ఒప్పుకొని దానికి లోబడటం
  alternative: మీ ఒప్పుకోలు యొక్క విధేయత
  rationale: గ్రీకు షష్ఠీ సంబంధం ఒకటి కంటే ఎక్కువ రీతుల్లో అర్థమవవచ్చు. ప్రధాన పాఠం ఒప్పుకోలు మరియు దానికి అనుగుణమైన విధేయతను సహజ తెలుగులో వ్యక్తం చేస్తుంది; మరింత రూపానుసారమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా వాక్యనిర్మాణాన్ని సహజీకరించాం. అయినా ‘సేవ,’ ‘సువార్త,’ ‘మహిమపరచడం’ వంటి గౌరవప్రదమైన బైబిలు పదజాలాన్ని నిలిపాం. మూలంలోని దీర్ఘ నిర్మాణాన్ని ఒకే వాక్యంగా ఉంచి, అనుబంధాలను ‘అందుకూ’ రూపంతో స్పష్టపరిచాం.
