- from: ఈ సేవ అందించిన రుజువును బట్టి, మీరు మెస్సీయ[a] సువార్తను ఒప్పుకొని దానికి లోబడుతున్నందుకూ[b], వారితోనూ అందరితోనూ ఉదారంగా పంచుకుంటున్నందుకూ[c] వారు దేవుణ్ణి మహిమపరుస్తారు.
  to: ఈ సేవ ద్వారా రుజువైనదాన్ని బట్టి, మీరు మెస్సీయ[a] సువార్తను ఒప్పుకొని దానికి లోబడుతున్నందుకూ[b], వారికీ అందరికీ ఉదారంగా పంచినందుకూ[c] వారు దేవుణ్ణి మహిమపరుస్తారు.
  rationale: 'The revision corrects the direction of generous sharing: it is toward ‘them and all,’ not necessarily mutual sharing with them. It also makes the relation between the service and its demonstrated proof more natural in Telugu. The rendering of confession and submission, together with its ambiguity-preserving footnote, is retained.'
