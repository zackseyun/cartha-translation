id: 2CO.8.2
reference: 2 Corinthians 8:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἐν πολλῇ δοκιμῇ θλίψεως ἡ περισσεία τῆς χαρᾶς αὐτῶν καὶ ἡ κατὰ βάθους πτωχεία αὐτῶν ἐπερίσσευσεν εἰς ⸂τὸ πλοῦτος⸃ τῆς ἁπλότητος αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/002.yaml
  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: te
  text: ఎందుకంటే, తీవ్రమైన శ్రమపరీక్షలో కూడా, వారి అపారమైన ఆనందం, వారి అగాధ పేదరికం[a] కలిసి వారి ఉదారతకు[b] సంపదగా పొంగిపొర్లాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లోతుల వరకు దిగిపోయిన వారి పేదరికం’; అంటే, ‘వారి అత్యంత తీవ్రమైన పేదరికం.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారి ధారాళతకు సంపదగా.’ ఇక్కడ ‘ఉదారత’గా అనువదించిన గ్రీకు పదానికి ‘సరళత,’ ‘నిష్కపటత,’ లేదా ‘ఏకహృదయత’ అనే అర్థాలు కూడా ఉండవచ్చు; ఈ సందర్భంలో అది ఉదారంగా ఇవ్వడాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: తీవ్రమైన శ్రమలో పరీక్షించబడుతున్నప్పుడు
  rationale: δοκιμήలోని పరీక్ష భావాన్ని, θλῖψιςలోని శ్రమ/బాధ భావాన్ని నిలుపుతూ, గ్రీకు పదబంధ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἡ περισσεία τῆς χαρᾶς
  choice: వారి ఆనంద సమృద్ధి
  rationale: περισσεία నామవాచకంలోని సమృద్ధి భావాన్ని నిలుపుతుంది; తరువాతి ἐπερίσσευσενతో ఉన్న పదప్రయోగ సంబంధాన్ని కూడా ప్రతిధ్వనింపజేస్తుంది.
- source_word: ἡ κατὰ βάθους πτωχεία
  choice: వారి అగాధమైన పేదరికం
  rationale: κατὰ βάθους పేదరికపు తీవ్రతను లోతు రూపకం ద్వారా బలపరుస్తుంది; ‘అగాధమైన’ ఆ రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐπερίσσευσεν
  choice: పొంగిపొర్లాయి
  rationale: περισσεύωలోని విస్తారంగా ఉండటం మాత్రమే కాక, εἰς సూచించే ఫలితంలోకి ప్రవహించే సజీవ భావాన్ని తెలియజేస్తుంది.
- source_word: εἰς τὸ πλοῦτος
  choice: గొప్ప సంపదగా
  rationale: εἰς ఇక్కడ ఫలితాన్ని సూచిస్తుంది. ‘సంపదగా’ ఆ ఫలితార్థాన్ని సహజ తెలుగులో అందిస్తుంది; ‘గొప్ప’ πλοῦτοςలోని సమృద్ధిని స్పష్టం చేస్తుంది.
- source_word: ἁπλότης
  choice: ఉదారత
  rationale: ధనసహాయం గురించిన ఈ సందర్భంలో ἁπλότης ఏకహృదయతతో, సంకోచం లేకుండా ఇచ్చే ఉదారతను సూచిస్తుంది; కేవలం ‘సరళత’ అని అనువదిస్తే సందర్భార్థం అస్పష్టమవుతుంది.
theological_decisions:
- issue: ధనసహాయం సందర్భంలో ἁπλότης అర్థం
  choice: ఉదారత
  alternative: సరళత; నిష్కపటత; ఏకహృదయత
  rationale: సమీప సందర్భం పరిశుద్ధుల కోసం ఇచ్చే భౌతిక సహాయాన్ని గురించి ఉంది. అందువల్ల ఉదారంగా ఇవ్వడం అనే భావం ప్రధానమైనది; అయితే పదంలోని సరళత/ఏకహృదయత ఛాయను పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘కలిసి’ అనేది ఆనంద సమృద్ధి మరియు పేదరికం రెండూ ఒకే ఫలితానికి దారితీశాయని తెలుగులో స్పష్టం చేస్తుంది; మూలంలోని ఉద్దేశాన్ని మార్చదు. [a], [b] గుర్తులు వాటికి సంబంధించిన పదబంధాల వెంట ఉంచబడ్డాయి.
