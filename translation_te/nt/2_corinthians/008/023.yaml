id: 2CO.8.23
reference: 2 Corinthians 8:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: te
  text: తీతు విషయమైతే, అతడు నా భాగస్వామి, మీ కోసం నాతో కలిసి పనిచేసేవాడు; మన సహోదరుల విషయమైతే, వారు సంఘాల దూతలు[a], మెస్సీయ మహిమ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సంఘాల అపొస్తలులు.’ గ్రీకు పదం నియోగించి పంపిన దూతలను లేదా విస్తృత అర్థంలో అపొస్తలులను సూచించగలదు; ఇక్కడి సందర్భం సంఘాల ప్రతినిధులు అనే భావానికి అనుకూలంగా ఉంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘క్రీస్తు మహిమ.’ ఇక్కడ Χριστός బిరుదుగా పనిచేస్తున్నందున ప్రధాన పాఠంలో ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου
  choice: తీతు విషయమైతే
  rationale: ఈ సంక్షిప్త గ్రీకు నిర్మాణం రెండు సమాంతర సందర్భాలను పరిచయం చేస్తుంది. ‘విషయమైతే’ అనేది ὑπέρ యొక్క ‘గురించి/విషయంలో’ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: κοινωνὸς ἐμὸς
  choice: నా భాగస్వామి
  rationale: κοινωνός కలిసి పాలుపంచుకునే వ్యక్తిని, భాగస్వామిని సూచిస్తుంది; సేవాపరమైన సహభాగితను ‘భాగస్వామి’ సహజంగా తెలియజేస్తుంది.
- source_word: εἰς ὑμᾶς συνεργός
  choice: మీ కోసం నా తోటి పనివాడు
  rationale: సహకార సేవను συνεργός సూచిస్తుంది; εἰς ὑμᾶς కొరింథీయుల వైపు ఉద్దేశించిన సేవను తెలియజేస్తుంది. ‘మీ కోసం’ అనేది ‘మీ మేలు కోసం’ అనే అదనపు వివరణను చేర్చకుండా దానిని వ్యక్తం చేస్తుంది.
- source_word: ἀδελφοὶ ἡμῶν
  choice: మన సహోదరులు
  rationale: సందర్భంలో సంఘాలు పంపిన పురుష ప్రతినిధులు ఉద్దేశించబడ్డారు; అందువల్ల గ్రీకు పురుష బహువచనాన్ని లింగ విస్తరణ లేకుండా నిలిపింది.
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: సంఘాల దూతలు
  rationale: ἀπόστολοι ఇక్కడ సంఘాలు నియోగించి పంపిన ప్రతినిధులను సూచించే విస్తృత అర్థంలో ఉంది. ‘దూతలు’ పంపబడినవారు అనే మూలభావాన్ని ఇస్తుంది; ప్రత్యామ్నాయమైన ‘అపొస్తలులు’ను పాదసూచికలో ఉంచింది.
- source_word: δόξα Χριστοῦ
  choice: మెస్సీయ మహిమ
  rationale: ఇది క్రియలేని సమానాధికరణ పదబంధం; ఆ సహోదరులను మెస్సీయ మహిమగా వర్ణిస్తుంది. Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించింది.
theological_decisions:
- issue: పేరు చెప్పని సహోదరులకు సంబంధించి ἀπόστολοι అర్థం
  choice: సంఘాల దూతలు
  alternative: సంఘాల అపొస్తలులు
  rationale: సందర్భం కానుక సేకరణకు సంబంధించిన సంఘ ప్రతినిధుల గురించి మాట్లాడుతుంది; ‘సంఘాల’ అనే సంబంధబోధక రూపం వారిని సంఘాలు పంపిన దూతలుగా అర్థం చేసుకోవడానికి మద్దతిస్తుంది. అయినా గ్రీకు పదంలోని విస్తృత ‘అపొస్తలులు’ అర్థాన్ని పాదసూచికలో నిలిపింది.
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని బిరుదు భావాన్ని ‘మెస్సీయ’ ప్రత్యక్షంగా తెలియజేస్తుంది.
- issue: δόξα Χριστοῦ యొక్క వాక్య సంబంధం
  choice: వారు మెస్సీయ మహిమ అని నేరుగా సమానాధికరణంగా ఉంచడం
  alternative: వారు మెస్సీయకు మహిమ/గౌరవం తెచ్చేవారు
  rationale: మూలంలో క్రియ లేదు; ‘తెచ్చేవారు’ వంటి క్రియను చేర్చడం భావాన్ని వివరిస్తుంది గాని మూలంలోని సంక్షిప్తత, సాధ్యమైన భావ ఉద్రిక్తతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని రెండు εἴτε భాగాల సమాంతరతను ‘విషయమైతే’తో నిలిపింది. చివరి క్రియలేని δόξα Χριστοῦ పదబంధాన్ని వివరణాత్మక క్రియ చేర్చకుండా సంక్షిప్తంగా ఉంచింది; అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో ఉన్నాయి.
