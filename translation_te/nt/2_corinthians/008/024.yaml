source:
  edition: SBLGNT
  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: te
  text: కాబట్టి, సంఘాల సమక్షంలో[b] మీ ప్రేమకు, మీ గురించి మేము గొప్పగా చెప్పుకున్న మాటకు రుజువును[a] వారికి చూపించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిదర్శనాన్ని” లేదా “సాక్ష్యాన్ని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సంఘాల ఎదుట”; ఈ మాట సంఘాల ప్రతినిధుల సమక్షంలో బహిరంగంగా చూపించడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి మాటల నుంచి వచ్చే ముగింపు లేదా విజ్ఞప్తిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: ἔνδειξιν
  choice: రుజువును
  rationale: ప్రేమను క్రియలో స్పష్టంగా కనబరచి దానికి ఆధారం ఇవ్వాలనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది; ‘నిదర్శనం’ లేదా ‘సాక్ష్యం’ అనే భావాలూ ఇందులో ఉన్నాయి.
- source_word: ἀγάπης
  choice: ప్రేమకు
  rationale: ἀγάπηకి సాధారణమైన తెలుగు సమానార్థకం; ఇక్కడ కార్యరూపంలో వ్యక్తమయ్యే సంబంధాత్మక ప్రేమను సూచిస్తుంది.
- source_word: καυχήσεως
  choice: అతిశయంగా చెప్పుకున్నదానికి
  rationale: పౌలు కొరింథీయుల గురించి గర్వంగా, గొప్పగా చెప్పుకున్నాడనే వాక్చాతుర్యాన్ని నిలుపుతూ, తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ὑπὲρ ὑμῶν
  choice: మీ గురించి
  rationale: καύχησιςతో కలిసి కొరింథీయులను గురించి పౌలు చెప్పుకున్న మాటలను సూచిస్తుంది.
- source_word: εἰς αὐτοὺς
  choice: వారికి
  rationale: ముందటి సందర్భంలో చెప్పబడిన సహోదరులు లేదా సంఘాల ప్రతినిధులను సూచిస్తుంది.
- source_word: ἐνδεικνύμενοι
  choice: చూపించండి
  rationale: రూపపరంగా కృదంతమైనా, సందర్భంలో ఇది ఆజ్ఞార్థక విజ్ఞప్తిగా పనిచేస్తుంది.
- source_word: εἰς πρόσωπον τῶν ἐκκλησιῶν
  choice: సంఘాల సమక్షంలో
  rationale: అక్షరార్థంలోని ‘ముఖం ఎదుట’ అనే నుడికారాన్ని, సంఘాల ప్రతినిధుల ఎదుట జరిగే బహిరంగ ప్రదర్శన భావంతో సహజ తెలుగులో అందిస్తుంది.
