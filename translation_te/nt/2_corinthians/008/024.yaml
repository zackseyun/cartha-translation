translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ‘అతిశయంగా చెప్పుకున్నది’ అనే పదబంధం καύχησις యొక్క పౌలు వాడే వాక్చాతుర్యాన్ని మృదువుగా మార్చకుండా, అయితే సహజ తెలుగులో నిలుపుతుంది.
