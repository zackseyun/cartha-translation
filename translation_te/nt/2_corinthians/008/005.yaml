source:
  edition: SBLGNT
  text: καὶ οὐ καθὼς ἠλπίσαμεν ἀλλ’ ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/005.yaml
  text: And not as we expected[a], but they gave themselves first to the Lord and to us through the will of God[b],
translation:
  language: te
  text: మేము ఊహించినట్లుగా కాక, వారు దేవుని చిత్తం ద్వారా తమను తాము మొదట ప్రభువుకు, అలాగే మాకూ అప్పగించుకున్నారు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మేము ఆశించినట్లుగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవుని చిత్తం చేత’ లేదా ‘దేవుని చిత్తానుసారం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἠλπίσαμεν
  choice: మేము ఆశించినట్లుగా
  rationale: ἐλπίζω యొక్క ప్రాథమిక భావమైన ‘ఆశించు’ను సహజమైన తెలుగులో నిలుపుతుంది. సందర్భంలో ‘ఎదురుచూసినట్లుగా’ అనే భావం కూడా సాధ్యమైనందున దాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἑαυτοὺς ἔδωκαν
  choice: తమను తాము ... అప్పగించుకున్నారు
  rationale: కేవలం ధనసహాయం చేశారనే భావానికి పరిమితం చేయకుండా, వ్యక్తిగత స్వీయసమర్పణను స్పష్టంగా నిలుపుతుంది; తెలుగులో ‘ఇచ్చుకున్నారు’ కంటే ‘అప్పగించుకున్నారు’ ఇక్కడ సహజంగా ఉంది.
- source_word: πρῶτον
  choice: మొదట
  rationale: కాలపరమైన లేదా ప్రాధాన్యపరమైన ముందుతనాన్ని నిర్ణయించకుండా రెండింటికీ అవకాశం ఉంచుతుంది.
- source_word: τῷ κυρίῳ
  choice: ప్రభువుకు
  rationale: κύριοςకు సాధారణమైన, గౌరవప్రదమైన తెలుగు సమానార్థకాన్ని ఉపయోగించి దత్తివిభక్తి సంబంధాన్ని నిలిపింది.
- source_word: καὶ ἡμῖν
  choice: ఆ తరువాత మాకు
  rationale: తెలుగులో వాక్యసంబంధాన్ని స్పష్టంగా చేస్తుంది. ‘మొదట’ అనే పదం ప్రభువుకు అప్పగించుకోవడానికున్న ప్రాధాన్యాన్ని సూచిస్తుండగా, ‘మాకు’ అనేది అపొస్తల సేవలో వారి సహకారాన్ని తెలియజేస్తుంది.
- source_word: διὰ θελήματος θεοῦ
  choice: దేవుని చిత్తం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సూచించగల సాధనం, కార్యసాధకత్వం, లేదా అనుగుణత మధ్య ఉన్న భావవిస్తృతిని సాధ్యమైనంతవరకు తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: ప్రభువుకు, మాకు తమను అప్పగించుకోవడం మధ్య సంబంధం
  choice: ప్రభువుకు అప్పగించుకోవడాన్ని మొదట ఉంచి, ఆ తరువాత పౌలు మరియు అతని సహచరులకు అప్పగించుకున్నట్లు అనువదించాం.
  alternative: ‘మొదట’ను మొత్తం ద్వంద్వ సమర్పణకు వర్తింపజేసి, ప్రభువుకు మరియు మాకు సమానాంతరంగా అప్పగించుకున్నారని చదవవచ్చు.
  rationale: పదక్రమం ప్రభువుకు ప్రాధాన్యాన్ని సూచిస్తుంది; అయినా దానినుంచి మరింత బలమైన సంఘపాలనా లేదా అధికార సిద్ధాంతాన్ని అనువాదంలో చేర్చలేదు.
- issue: διὰ θελήματος θεοῦ యొక్క భావబలం
  choice: దేవుని చిత్తం ద్వారా
  alternative: దేవుని చిత్తం చేత; దేవుని చిత్తానుసారం
  rationale: గ్రీకు పదబంధంలో దైవ కార్యసాధకత్వం, అనుమతి, లేదా చిత్తానుగుణత అనే భావాలు సాధ్యమైనందున ఒక్క భావానికే పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘మాత్రమే కాకుండా’ అనేది οὐ καθὼς ... ἀλλά నిర్మాణాన్ని సందర్భానుగుణంగా సహజీకరిస్తుంది; స్వీయసమర్పణ భావాన్ని కాపాడేందుకు ‘తమను తాము అప్పగించుకున్నారు’ వాడబడింది.
