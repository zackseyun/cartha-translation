id: 2CO.8.14
reference: 2 Corinthians 8:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τῷ νῦν καιρῷ τὸ ὑμῶν περίσσευμα εἰς τὸ ἐκείνων ὑστέρημα, ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα, ὅπως γένηται ἰσότης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: te
  text: ప్రస్తుత సమయంలో మీ సమృద్ధి వారి కొరతను తీర్చడానికి ఉంది; తద్వారా వారి సమృద్ధి కూడా మీ కొరతను తీర్చడానికి ఉండేలా, సమానత్వం కలగవచ్చు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘న్యాయసమ్మతత,’ ‘సమతుల్యత.’ ఇక్కడ గ్రీకు పదం పరస్పరం ఒకరి కొరతను మరొకరు తీర్చడం వల్ల ఏర్పడే సమతుల్యతను సూచిస్తుంది; అందరికీ అచ్చంగా ఒకే పరిమాణంలో ఆస్తి ఉండాలని తప్పనిసరిగా సూచించదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: ప్రస్తుత సమయంలో
  rationale: καιρός ఇక్కడ కేవలం కాలక్రమాన్ని కాక ప్రస్తుత సందర్భాన్ని సూచిస్తుంది; ఈ తెలుగు పదబంధం ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὸ ὑμῶν περίσσευμα / τὸ ἐκείνων περίσσευμα
  choice: మీ సమృద్ధి / వారి సమృద్ధి
  rationale: περίσσευμα అవసరానికి మించి ఉన్న సమృద్ధిని, ఈ సందర్భంలో ముఖ్యంగా భౌతిక వనరులను సూచిస్తుంది. పరస్పర నిర్మాణాన్ని నిలుపుకోవడానికి రెండు చోట్లా ఒకే పదాన్ని వాడాం.
- source_word: εἰς τὸ ἐκείνων ὑστέρημα / εἰς τὸ ὑμῶν ὑστέρημα
  choice: వారి కొరతను తీర్చడానికి / మీ కొరతను తీర్చడానికి
  rationale: ὑστέρημα అంటే లోటు లేదా కొరత. εἰς నిర్మాణంలోని ఉద్దేశం/ఫలిత భావాన్ని సహజ తెలుగులో స్పష్టంగా చూపేందుకు ‘కొరతను తీర్చడానికి’ అని అనువదించాం.
- source_word: ἵνα καὶ
  choice: అలాగే
  rationale: καί సూచించే పరస్పరతను ‘అలాగే’ నిలుపుతుంది; ఉపయోగపడాలి అనే నిర్మాణం ἵνα ఉద్దేశ భావాన్ని సందర్భంలో తెలియజేస్తుంది.
- source_word: ὅπως γένηται ἰσότης
  choice: తద్వారా సమానత్వం కలుగుతుంది
  rationale: ὅπως ఫలితం/ఉద్దేశాన్ని ‘తద్వారా’ తెలియజేస్తుంది; γένηται భావాన్ని సహజ తెలుగులో ‘కలుగుతుంది’గా ఇచ్చాం.
theological_decisions:
- issue: పౌలు ఇచ్చే దానాల విషయంలో ἰσότης అనే పదం యొక్క భావం
  choice: పరస్పరం కొరత తీర్చడంలో సమానత్వం
  alternative: న్యాయసమ్మతత; సమతుల్యత
  rationale: సందర్భం విశ్వాసుల అవసరాలను పరస్పరం తీర్చడం గురించి మాట్లాడుతుంది. ‘సమానత్వం’ గ్రీకు పదానికి నేరమైన సమానార్థకం; అది అందరికీ అచ్చంగా ఒకే పరిమాణంలో ఆస్తి ఉండాలని తప్పనిసరిగా సూచించదనే సూక్ష్మభావాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని మొదటి భాగంలో అంతర్లీనంగా ఉన్న క్రియను తెలుగులో సహజంగా ఉండేందుకు ‘ఉపయోగపడాలి’ అని స్పష్టపరిచాం; పరస్పర నిర్మాణాన్ని రెండుసార్లు సమాంతరంగా ఉంచాం.
