revisions:
- from: ప్రస్తుత సమయంలో మీ సమృద్ధి వారి కొరతను తీర్చడానికి ఉపయోగపడాలి; అలాగే వారి సమృద్ధి మీ కొరతను తీర్చడానికి ఉపయోగపడాలి. తద్వారా సమానత్వం[a] కలుగుతుంది.
  to: ప్రస్తుత సమయంలో మీ సమృద్ధి వారి కొరతను తీర్చడానికి ఉంది; తద్వారా వారి సమృద్ధి కూడా మీ కొరతను తీర్చడానికి ఉండేలా, సమానత్వం కలగవచ్చు.[a]
  rationale: The revision removes the added deontic sense of ‘ఉపయోగపడాలి’ and renders the two purpose clauses with ‘తద్వారా’ and ‘ఉండేలా.’ ‘కలగవచ్చు’ expresses the non-assertive, intended-result force of the Greek subjunctive in natural contemporary Telugu. The explanatory footnote remains accurate and retains its anchor.
