id: 2CO.8.8
reference: 2 Corinthians 8:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ κατ’ ἐπιταγὴν λέγω ἀλλὰ διὰ τῆς ἑτέρων σπουδῆς καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: te
  text: నేను దీనిని ఆజ్ఞగా చెప్పడం లేదు; ఇతరుల శ్రద్ధను బట్టి మీ ప్రేమ నిజమైనదో పరీక్షిస్తున్నాను.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇతరుల ఉత్సాహాన్ని బట్టి’ లేదా ‘ఇతరుల ఆసక్తిని బట్టి’; σπουδή అనే పదం ఉత్సాహం, ఆసక్తి, లేదా శ్రద్ధతో కూడిన కృషిని సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మీ ప్రేమ యొక్క నిజాయితీని నిరూపిస్తున్నాను’ లేదా ‘పరీక్షకు పెడుతున్నాను’.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: ఆజ్ఞ
  rationale: οὐ κατ’ ἐπιταγὴν అనే మాట పౌలు అధికారపూర్వకమైన ఆజ్ఞగా చెప్పడం లేదని స్పష్టంగా తెలియజేస్తుంది. సందర్భంలోని స్వచ్ఛంద ఉదారతతో ఉన్న వ్యత్యాసాన్ని ‘ఆజ్ఞ’ సహజంగా కాపాడుతుంది.
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: ఇతరుల ఉత్సాహం ద్వారా
  rationale: διά + సంబంధ విభక్తి సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది. ἑτέρων ను సందర్భం ఆధారంగా ప్రత్యేకంగా ‘మాసిదోనీయులు’ అని విస్తరించకుండా ‘ఇతరులు’గానే ఉంచాం.
- source_word: σπουδή
  choice: ఉత్సాహం
  rationale: ఇక్కడ ఈ పదం తొందరను కాక, చురుకైన ఆసక్తి మరియు శ్రద్ధను సూచిస్తుంది. దానిని ఆధునిక తెలుగులో సహజంగా ‘ఉత్సాహం’ అని ఇచ్చాం; ఇతర సాధ్యమైన భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀγάπη
  choice: ప్రేమ
  rationale: దానధర్మంలో వ్యక్తమయ్యే కొరింథీయుల ప్రేమను నేరుగా, సాధారణంగా తెలియజేస్తుంది.
- source_word: γνήσιον
  choice: యథార్థత
  rationale: నామవాచకార్థంలో వాడిన γνήσιον ప్రేమ నిజమైనది, కల్తీలేనిది అనే గుణాన్ని సూచిస్తుంది. ‘యథార్థత’ ఆ భావాన్ని పరీక్షించే నిర్మాణంతో సహజంగా సరిపోతుంది.
- source_word: δοκιμάζων
  choice: పరీక్షిస్తున్నాను
  rationale: వర్తమాన కృదంతం ప్రధాన క్రియతో సమకాలికమైన పౌలు చర్యను సూచిస్తుంది. తెలుగులో పరిమిత క్రియగా మార్చడం సహజం; పరీక్షించడం మరియు నిరూపించడం మధ్యనున్న భావవ్యాప్తిని పాదసూచిక తెలియజేస్తుంది.
- source_word: καί
  choice: కూడా
  rationale: ఇతరుల ఉత్సాహాన్ని ప్రస్తావించడంతో పాటు కొరింథీయుల ప్రేమ యథార్థతను పరీక్షిస్తున్నాడనే అదనపు భావాన్ని కాపాడుతుంది.
- source_word: ὑμετέρας
  choice: మీ
  rationale: కొరింథీయుల సమూహానికి చెందిన ప్రేమను ఆధునిక తెలుగులో సహజమైన బహువచన సంబోధనతో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: దానం విషయంలో పౌలు తీసుకున్న వాక్చాతుర్య వైఖరి
  choice: పౌలు దీనిని అపొస్తల అధికారంతో ఇచ్చే ఆజ్ఞగా చెప్పడం లేదని స్పష్టంగా నిరాకరిస్తూ, కొరింథీయుల ప్రేమ యథార్థతను పరీక్షిస్తున్నానని చెబుతున్నాడు.
  alternative: ఇది నిజానికి ఆజ్ఞే అయినప్పటికీ పౌలు దాని తీవ్రతను వాక్చాతుర్యంతో తగ్గిస్తున్నాడు.
  rationale: οὐ κατ’ ἐπιταγὴν λέγω అనే పదబంధం నేరుగా ఆజ్ఞగా చెప్పడం లేదని తెలిపుతుంది. అనువాదం దాన్ని పరోక్ష ఆజ్ఞగా మార్చకుండా, అపొస్తల అధికారం మరియు ప్రేమతో కూడిన స్వచ్ఛంద విధేయత మధ్యనున్న ఉద్రిక్తతను అలాగే ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని ఒకే వాక్య నిర్మాణం మరియు ‘ఆజ్ఞ కాదు—అయితే పరీక్ష’ అనే వ్యత్యాసం నిలుపబడ్డాయి.
