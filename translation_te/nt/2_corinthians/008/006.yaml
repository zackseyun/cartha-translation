reference: 2 Corinthians 8:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: te
  text: కాబట్టి తీతు ఇంతకుముందు ప్రారంభించినట్లే, మీ మధ్య ఈ కృపా కార్యాన్ని[a] కూడా పూర్తి చేయాలని మేము అతనిని అభ్యర్థించాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఈ కృపతో కూడిన కార్యాన్ని’; అక్షరార్థంగా ‘ఈ కృపను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: కోరాము
  rationale: ఈ సందర్భంలో తీతు కార్యాన్ని కొనసాగించేలా పౌలు మరియు అతని సహచరులు అతనిని ప్రేరేపించిన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది. ‘ప్రోత్సహించాము’ కంటే కొంత బలంగా ఉండి, అతిగా అధికారికంగా వినిపించదు.
- source_word: Τίτον
  choice: తీతు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: καθὼς προενήρξατο
  choice: ఇంతకుముందు ప్రారంభించినట్లే
  rationale: προενήρξατοలోని ముందుగా లేదా ఇంతకుముందే ఆరంభించిన కాలసూచనను స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπιτελέσῃ
  choice: పూర్తి చేయాలని
  rationale: ἵνα తరువాతి సంభావనార్థక క్రియ ఇక్కడ ఉద్దేశాన్ని సూచిస్తుంది; మొదలుపెట్టిన కార్యాన్ని ముగింపుకు తీసుకురావాలనే భావాన్ని ఈ రూపం సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς ὑμᾶς
  choice: మీ మధ్య
  rationale: కొరింథు విశ్వాసుల సమాజంలో తీతు నిర్వహించి పూర్తి చేయవలసిన కార్యాన్ని సూచిస్తుంది; దిశాభావాన్ని సందర్భానుగుణంగా సమాజం మధ్య జరిగే కార్యంగా అందిస్తుంది.
- source_word: χάριν
  choice: కృపాకార్యాన్ని
  rationale: χάρις అనే కృపాభాషను నిలుపుతూ, పరిశుద్ధుల కోసం సేకరించే సహాయం అనే నిర్దిష్ట కార్యం ఇక్కడ ఉద్దేశించబడిందని తెలియజేస్తుంది.
- source_word: καὶ τὴν χάριν ταύτην
  choice: ఈ కృపాకార్యాన్ని కూడా
  rationale: καίలోని ‘కూడా’ అనే అనుబంధ భావాన్ని నిలుపుతూ, ఈ ప్రత్యేకమైన దాతృత్వ కార్యాన్ని పూర్తి చేయడంపై వాక్యం పెట్టే దృష్టిని సహజమైన తెలుగు పదక్రమంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సేకరణ సందర్భంలో χάρις యొక్క అర్థం
  choice: దాతృత్వ సహాయానికి సంబంధించిన కృపాకార్యం
  alternative: అమూర్తమైన దైవకృప; కానుక
  rationale: తక్షణ సందర్భం పరిశుద్ధుల కోసం సేకరించే సహాయం గురించీ, దానిని పూర్తి చేయడంలో తీతు పాత్ర గురించీ మాట్లాడుతుంది. ‘కృపాకార్యం’ అనేది పౌలు ఉపయోగించిన కృప అనే వేదాంతపరమైన భావాన్ని నిలుపుతూ, ఒక నిర్దిష్ట సేవాకార్యం ఉద్దేశించబడిందని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. మూలంలోని ఉద్దేశార్థం, ముందుగా ప్రారంభించిన కాలసూచన, καί యొక్క ‘కూడా’ భావం నిలుపబడ్డాయి.
