id: 2CO.8.10
reference: 2 Corinthians 8:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: te
  text: ఈ విషయంలో నేను నా అభిప్రాయం చెబుతున్నాను[a]. ఇది మీకు మేలుకరమైనది; ఎందుకంటే గత సంవత్సరం దీనిని చేయడం మాత్రమే కాదు, చేయాలని కోరుకోవడం కూడా[b] మొదలుపెట్టినవారు మీరే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సలహా” లేదా “ఆలోచించి ఏర్పరచుకున్న అభిప్రాయం.” పౌలు దీనిని ఆజ్ఞగా కాకుండా, ఆలోచించి చేసిన సిఫారసుగా చెబుతున్నాడు.
    reason: lexical_alternative
  - marker: b
    text: “చేయాలని కోరుకోవడం” అంటే ఆ పని చేయడానికి సంకల్పించడం లేదా సిద్ధంగా ఉండడం. గ్రీకు పాఠం అంతర్గత సంకల్పానికీ వాస్తవంగా చేయడానికీ తేడా చూపుతుంది.
    reason: lexical_clarification
lexical_decisions:
- source_word: γνώμην
  choice: అభిప్రాయం
  rationale: ఇక్కడ పౌలు ఆజ్ఞ ఇవ్వకుండా, ఆలోచించి చేసిన సిఫారసును తెలియజేస్తున్నాడు. ‘అభిప్రాయం’ ఆధునిక తెలుగులో సహజంగా ఉండి, తీర్పు లేదా అధికారిక ఉత్తర్వు అనే అతిశయార్థాన్ని నివారిస్తుంది.
- source_word: ἐν τούτῳ
  choice: ఈ విషయంలో
  rationale: చర్చలో ఉన్న నిర్దిష్టమైన సహాయధన సేకరణ విషయాన్ని సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: δίδωμι
  choice: చెబుతున్నాను
  rationale: γνώμην δίδωμι అనే సంయోగాన్ని పదశః కాకుండా సహజమైన తెలుగులో ‘నా అభిప్రాయం చెబుతున్నాను’ అని వ్యక్తం చేస్తుంది.
- source_word: συμφέρει
  choice: మేలు
  rationale: వారికి ప్రయోజనకరమైనది, అనుకూలమైనది అనే భావాన్ని సంక్షిప్తంగా, సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: οἵτινες
  choice: మీరే
  rationale: కొరింథీయుల ప్రత్యేక లక్షణాన్ని—వారే ముందుగా ప్రారంభించారనే వివరణాత్మక బలాన్ని—తెలుగు వాక్య నిర్మాణంలో సహజంగా నిలుపుతుంది.
- source_word: τὸ ποιῆσαι
  choice: దీనిని చేయడం
  rationale: సందర్భంలోని సహాయధన కార్యాన్ని సూచిస్తూ, బాహ్య కార్యాచరణను స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τὸ θέλειν
  choice: చేయాలని కోరుకోవడం
  rationale: అసలు కార్యం చేయడానికీ అంతర్గత సంకల్పం లేదా కోరికకూ ఉన్న భేదాన్ని నిలుపుతుంది; ఒట్టి ఇష్టం కంటే ఉద్దేశపూర్వకమైన సిద్ధతను సూచిస్తుంది.
- source_word: προενήρξασθε
  choice: మొదలుపెట్టింది
  rationale: ముందుగానే ప్రారంభించారనే భావం ἀπὸ πέρυσι ద్వారా స్పష్టమవుతున్నందున తెలుగులో అనవసర పునరుక్తి లేకుండా ప్రధాన క్రియార్థాన్ని అందిస్తుంది.
- source_word: ἀπὸ πέρυσι
  choice: గత సంవత్సరం
  rationale: మునుపటి సంవత్సరంలో ఆరంభమైన విషయాన్ని సహజంగా తెలుపుతుంది; తప్పనిసరిగా నిరంతర చర్యను సూచించే ‘గత సంవత్సరం నుండి’ అనే రూపాన్ని నివారిస్తుంది.
theological_decisions:
- issue: అపొస్తల అధికారానికి సంబంధించి పౌలు మాట యొక్క బలం
  choice: పౌలు ప్రత్యక్ష ఆజ్ఞ కాకుండా ఆలోచించి చేసిన అభిప్రాయం లేదా సలహాను ఇస్తున్నాడు.
  alternative: పౌలు అధికారపూర్వకమైన ఆదేశాన్ని జారీ చేస్తున్నాడు.
  rationale: సమీప సందర్భం ఆజ్ఞకూ అభిప్రాయానికీ తేడా చూపుతుంది (8:8, 8:10). ‘అభిప్రాయం’ అనే పదం పౌలు మాటలోని గంభీరతను తగ్గించకుండా, దానిని స్పష్టమైన ఆజ్ఞగా అతిశయింపజేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘చేయడం మాత్రమే కాదు, చేయాలని కోరుకోవడం కూడా’ అనే సమాంతర నిర్మాణం ποιῆσαι / θέλειν మధ్యనున్న కార్యం–సంకల్పం భేదాన్ని నిలుపుతుంది. గ్రీకు వాక్యంలోని అసాధారణ క్రమం—చేయడం ముందుగా, కోరుకోవడం తరువాత—వ్యాఖ్యానంతో మార్చకుండా అలాగే ఉంచబడింది.
