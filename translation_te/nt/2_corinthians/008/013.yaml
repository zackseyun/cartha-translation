  to: ఎందుకంటే, ఇతరులకు ఉపశమనం కలగడానికి మీకు కష్టం కలగాలని నా ఉద్దేశం కాదు; సమానత్వం[a] ఉండాలనేదే నా ఉద్దేశం—
