  text: For I do not mean that there should be relief for others and hardship for you, but equality[a]—
translation:
  language: te
  text: ఎందుకంటే, ఇతరులకు ఉపశమనం కలగడానికి మీకు కష్టం కలగాలని నా ఉద్దేశం కాదు; సమానత్వం[a] ఉండాలనేదే నా ఉద్దేశం—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘న్యాయమైన సమతౌల్యం.’ గ్రీకు పదం అందరికీ ఆస్తులు ఖచ్చితంగా ఒకే మోతాదులో ఉండాలని తప్పనిసరిగా సూచించదు; అది న్యాయబద్ధమైన సమతౌల్యాన్ని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ
  choice: ఎందుకంటే ... కాదు
  rationale: γάρ మునుపటి వాక్యానికి వివరణను జోడిస్తుంది; οὐ పౌలు ఉద్దేశాన్ని నిరాకరిస్తుంది. తెలుగులో ఈ వివరణాత్మక, సవరణాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα
  choice: కలగాలని నా ఉద్దేశం
  rationale: ἵνα సాధారణంగా ఉద్దేశాన్ని సూచిస్తుంది. ఇక్కడ సందర్భంలో అంతర్లీనంగా ఉన్న ఉద్దేశ భావాన్ని తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేయడానికి ‘నా ఉద్దేశం’ చేర్చబడింది.
- source_word: ἄλλοις
  choice: ఇతరులకు
  rationale: దత్తివిభక్తి రూపం ఉపశమనం పొందే వర్గాన్ని సూచిస్తుంది; ‘ఇతరులకు’ గ్రీకు పదంలోని అనిర్దిష్టతను నిలుపుతుంది.
- source_word: ἄνεσις
  choice: ఉపశమనం
  rationale: ఇక్కడ ఇది కేవలం మానసిక సాంత్వనను కాక, భారము లేదా ఒత్తిడి తగ్గడాన్ని సూచిస్తుంది. ఆర్థిక సహాయం సందర్భంలో ‘ఉపశమనం’ తగిన ఆధునిక తెలుగు పదం.
- source_word: ὑμῖν
  choice: మీకు
  rationale: ఇది ἄλλοις‌కు సమాంతరంగా, కష్టం ఎవరి మీద పడుతుందో సూచిస్తుంది.
- source_word: θλῖψις
  choice: కష్టం
  rationale: ఆర్థికంగా ఇవ్వడం వల్ల కలిగే ఒత్తిడి లేదా ఇబ్బందిని సాధారణ పాఠకులకు సహజంగా తెలియజేస్తుంది; ఈ సందర్భంలో ‘శ్రమ’ లేదా ‘హింస’ కంటే విస్తృతంగా సరిపోతుంది.
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: సమానత్వం ఉండాలనేదే
  rationale: ἀλλά బలమైన వ్యతిరేకతను సూచిస్తుంది; ἰσότης సమానత్వం లేదా న్యాయమైన సమతౌల్యాన్ని సూచించగలదు. ‘సమానత్వం’ ప్రత్యక్ష పదసామ్యాన్ని నిలుపుతుండగా, ἐξ భావం తెలుగులో సహజమైన వాక్య నిర్మాణంలో అంతర్భవించింది.
theological_decisions:
- issue: వస్తుసహాయం సందర్భంలో ἰσότης అనువాదం
  choice: సమానత్వం
  alternative: న్యాయమైన సమతౌల్యం
  rationale: ‘సమానత్వం’ గ్రీకు పదానికి ప్రత్యక్షమైన సమానార్థక పదం, తరువాతి వచనాల్లోని పరస్పర సమతౌల్య భావాన్ని నిలుపుతుంది. అయితే ఇది ప్రతి ఒక్కరికీ ఆస్తి పరిమాణం ఖచ్చితంగా ఒకేలా ఉండాలని తప్పనిసరిగా అర్థం కాదనే నిజమైన భావపరిధిని పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త నిర్మాణాన్ని సహజీకరించేందుకు అంతర్లీనమైన ‘నా ఉద్దేశం’ను స్పష్టంచేసి, తరువాతి వచనంతో కొనసాగింపును సూచించే దీర్ఘ విరామచిహ్నాన్ని నిలిపాం.
