id: 2CO.8.11
reference: 2 Corinthians 8:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: te
  text: ఇప్పుడు అయితే ఆ పనిని కూడా పూర్తి చేయండి[a]; చేయాలనే మీ సిద్ధత ఎలాగైతే ఉందో, మీకు ఉన్నదానినిబట్టి దాన్ని పూర్తి చేయడమూ అలాగే ఉండేలా చేయండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దాన్ని కార్యరూపంలో పెట్టడాన్ని పూర్తి చేయండి.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మీకు ఉన్నదానిలోనుంచి’; అంటే, ప్రస్తుతం మీకున్న సామర్థ్యానికి తగినట్లుగా.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: ఇప్పుడు
  rationale: మునుపటి సంసిద్ధత నుంచి ప్రస్తుత కార్యాచరణకు మార్పును సహజమైన తెలుగులో సూచిస్తుంది; సందర్భంలో δέ యొక్క స్వల్ప సంధాన-వ్యతిరేక భావం ప్రత్యేకంగా ‘అయితే’ అనకుండానే వ్యక్తమవుతుంది.
- source_word: τὸ ποιῆσαι
  choice: దాన్ని చేయడం
  rationale: ముందుగా ప్రతిపాదించిన కానుక సేకరణను కార్యరూపంలో పెట్టడాన్ని సూచించే నామీకృత క్రియాభావాన్ని నిలుపుతుంది.
- source_word: ἐπιτελέσατε
  choice: పూర్తి చేయండి
  rationale: మొదలుపెట్టిన పనిని ముగింపుకు తీసుకురావాలనే ἐπιτελέω భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: చేయాలని మీకు ఉన్న ఆసక్తి
  rationale: ప్రతిపాదిత కార్యాన్ని చేయాలనే సిద్ధమైన, ఉత్సాహపూర్వక సంకల్పాన్ని ఆధునిక సహజ తెలుగులో అందిస్తుంది.
- source_word: οὕτως καὶ τὸ ἐπιτελέσαι
  choice: దాన్ని పూర్తి చేయడం కూడా అంతే ఆసక్తితో జరుగుతుంది
  rationale: సంకల్పంలోని ఆసక్తికి కార్యసమాప్తి సరితూగాలనే καθάπερ ... οὕτως καὶ సమాంతరతను తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ἐκ τοῦ ἔχειν
  choice: మీకు ఉన్నదానిలోనుంచి
  rationale: ప్రస్తుతం అందుబాటులో ఉన్న వనరుల నుంచే పూర్తి చేయాలనే మూలం లేదా పరిమాణ భావాన్ని, సామర్థ్యానికి మించిన డిమాండుగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: అందుబాటులో ఉన్న వనరులకు అనుగుణంగా ఇవ్వడం
  choice: వారు ప్రస్తుతం కలిగివున్న దానిలోనుంచి వాగ్దానం చేసిన కానుకను పూర్తి చేయాలని వాక్యం ప్రోత్సహిస్తుంది.
  alternative: సామర్థ్యాన్ని పరిగణించకుండా ఏ మంచి ఉద్దేశాన్నైనా తప్పనిసరిగా పూర్తి చేయాలనే సాధారణ ఆజ్ఞ.
  rationale: తక్షణ సందర్భం కొరింథీయులు ముందుగా సంకల్పించిన కానుకకు సంబంధించినది; ἐκ τοῦ ἔχειν వారి దగ్గర ఉన్నదే కార్యసమాప్తికి ఆధారమని సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. సంకల్పం–కార్యసమాప్తి మధ్య గ్రీకు సమాంతరతను సహజంగా వ్యక్తం చేయడానికి ‘ఎంత ... అంతే’ నిర్మాణం ఉపయోగించబడింది; సందర్భానికి మించిన సిద్ధాంతార్థం చేర్చలేదు.
