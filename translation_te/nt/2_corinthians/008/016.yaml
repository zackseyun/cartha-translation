id: 2CO.8.16
reference: 2 Corinthians 8:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Χάρις δὲ τῷ θεῷ τῷ ⸀διδόντι τὴν αὐτὴν σπουδὴν ὑπὲρ ὑμῶν ἐν τῇ καρδίᾳ Τίτου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/016.yaml
  text: But thanks be to God[a], who puts the same earnestness for you into Titus's heart,
translation:
  language: te
  text: అయితే, మీ పట్ల అదే శ్రద్ధను తీతు హృదయంలో కలిగిస్తున్న దేవునికి కృతజ్ఞతలు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కలిగిస్తున్న’ అనే మాటకు ‘ఇస్తున్న’ అని కూడా అనువదించవచ్చు; ‘శ్రద్ధ’కు ‘ఆసక్తి’ అని కూడా చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: అయితే, దేవునికి కృతజ్ఞతలు
  rationale: ఇక్కడ χάρις దత్తివ విభక్తిలోని ‘దేవునికి’ అనే పదంతో కలిసి కృపను కాక దేవునికి కృతజ్ఞతను వ్యక్తం చేసే ప్రయోగంగా ఉంది. δέ స్వల్పమైన మలుపును సూచిస్తున్నందున ‘అయితే’ అని అనువదించబడింది.
- source_word: τῷ διδόντι
  choice: కలిగిస్తున్న
  rationale: δίδωμι ప్రాథమికంగా ‘ఇవ్వడం’ అయినా, హృదయంలో ఒక అంతరంగ వైఖరిని ఉంచడం అనే భావాన్ని ఆధునిక తెలుగులో ‘కలిగించడం’ సహజంగా తెలియజేస్తుంది. వర్తమాన కృదంతంలోని కొనసాగుతున్న కార్యభావం కూడా నిలిచింది.
- source_word: τὴν αὐτὴν σπουδήν
  choice: అదే శ్రద్ధను
  rationale: σπουδή ఇక్కడ కేవలం కష్టపడి పనిచేయడాన్ని కాక, హృదయపూర్వకమైన ఆసక్తి మరియు శ్రద్ధను సూచిస్తుంది. αὐτήν లోని పోలికను ‘అదే’ నిలుపుతుంది; అది ఎవరి శ్రద్ధతో సమానమో వచనంలో స్పష్టంగా చేర్చలేదు.
- source_word: ὑπὲρ ὑμῶν
  choice: మీ పట్ల
  rationale: కొరింథీయుల వైపు మళ్లిన శ్రద్ధను ‘మీ పట్ల’ సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: తీతు హృదయంలో
  rationale: ἐν యొక్క స్థానార్థాన్ని, అలాగే καρδία సూచించే అంతరంగ వైఖరి రూపకాన్ని ఈ పదబంధం నిలుపుతుంది.
theological_decisions:
- issue: ‘అదే శ్రద్ధ’ ఎవరి శ్రద్ధతో సమానం?
  choice: ‘అదే శ్రద్ధ’ అని మాత్రమే ఉంచడం
  alternative: ‘నాకున్న అదే శ్రద్ధ’ అని స్పష్టీకరించడం
  rationale: సందర్భం పౌలు చూపిన శ్రద్ధను సూచించవచ్చు; అయితే గ్రీకు వాక్యంలో ‘నా’ అనే పదం లేదు. అందువల్ల సాధ్యమైన సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో నిర్బంధంగా చేర్చకుండా పోలికలోని స్వల్ప అనిర్దిష్టతను నిలిపాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన కృతజ్ఞతా వాక్యంగా రూపొందించబడింది. ‘తీతు హృదయంలో’ అనే బైబిలు రూపకం అలాగే ఉంచబడింది; మూలంలో లేని ‘నాకున్న’ అనే వివరణ చేర్చబడలేదు.
