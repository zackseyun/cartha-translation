  terminology: ‘కృతజ్ఞతలు,’ ‘శ్రద్ధ,’ and ‘హృదయం’ are appropriate and consistent choices. The proper name ‘తీతు’ is correctly rendered. The footnote offers legitimate lexical alternatives without imposing an interpretive expansion.
