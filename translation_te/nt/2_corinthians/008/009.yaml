  to: 'ఎందుకంటే, మన ప్రభువైన యేసు క్రీస్తు[a] కృప మీకు తెలుసు: ఆయన ధనవంతుడై ఉండి కూడా, మీరు ఆయన పేదరికం ద్వారా ధనవంతులు కావడానికి మీ కోసం పేదవాడయ్యాడు.[b]'
