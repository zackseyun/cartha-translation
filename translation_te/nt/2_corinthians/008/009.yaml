id: 2CO.8.9
reference: 2 Corinthians 8:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: te
  text: 'ఎందుకంటే, మన ప్రభువైన యేసు క్రీస్తు[a] కృప మీకు తెలుసు: ఆయన ధనవంతుడై ఉండి కూడా, మీరు ఆయన పేదరికం ద్వారా ధనవంతులు కావడానికి మీ కోసం పేదవాడయ్యాడు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “యేసు మెస్సీయ.” గ్రీకు Χριστός (క్రిస్టోస్) ఒక బిరుదు; దాని అర్థం “మెస్సీయ,” అంటే “అభిషిక్తుడు.”
    reason: alternative_reading
  - marker: b
    text: “ధనవంతుడు,” “పేదవాడయ్యాడు” అనే మాటలు ఇక్కడ రూపకాలై ఉండవచ్చు. క్రీస్తు ముందున్న ధనిక స్థితికీ, ఇతరుల కోసం ఆయన తనను తాను తగ్గించుకోవడానికీ మధ్య ఇవి వ్యత్యాసం చూపుతాయి; అయితే ఈ రూపకాన్ని పౌలు ఇక్కడ నిర్దిష్టంగా వివరించలేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: మీకు తెలుసు
  rationale: వర్తమానకాల క్రియ; కొరింథీయులకు ఇప్పటికే తెలిసిన విషయాన్ని పౌలు గుర్తుచేస్తున్నాడు. ఆధునిక తెలుగులో ‘మీకు తెలుసు’ సహజంగా ఉంది.
- source_word: χάριν
  choice: కృప
  rationale: ఈ పదం కృపను, అనుగ్రహాన్ని, ఉదారమైన దయను సూచించగలదు. ‘కృప’ క్రీస్తు చేసిన దయాపూర్వక కార్యాన్నీ, సందర్భంలోని ఉదారతకు ఆయన ఆదర్శంగా ఉండటాన్నీ సూచించే విస్తృతిని నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: అధికారాన్నీ క్రీస్తుకు సంబంధించిన బిరుదు ప్రాముఖ్యతనూ నిలిపే ప్రామాణిక తెలుగు పదం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు క్రీస్తు
  rationale: తెలుగు క్రైస్తవ వాడుకలో సుపరిచితమైన రూపం. Χριστός బిరుదు ‘మెస్సీయ’ అనే అర్థం ఇస్తుందని ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- source_word: δι’ ὑμᾶς
  choice: మీ కోసం
  rationale: διά + ద్వితీయా విభక్తి ఇక్కడ ప్రయోజనార్థక భావాన్ని ఇస్తుంది; ‘మీ కోసం’ సాధారణ తెలుగులో దాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: πλούσιος ὤν
  choice: ధనవంతుడై ఉండి కూడా
  rationale: కృదంత నిర్మాణంలోని వ్యతిరేకార్థక భావాన్ని వ్యక్తం చేస్తూ, మూలంలోని ధనికుడు–పేదవాడు వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἐπτώχευσεν
  choice: పేదవాడయ్యాడు
  rationale: కర్తరి ప్రయోగంలోని మార్పును నేరుగా తెలుపుతుంది; అది ఏ విధమైన పేదరికమో వచనం చెప్పనందున మరింత నిర్దిష్టం చేయలేదు.
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: ఆయన పేదరికం ద్వారా
  rationale: దత్తివిభక్తిలోని సాధనార్థాన్ని ‘ద్వారా’ తెలియజేస్తుంది; ἐκείνου ను సహజంగా ‘ఆయన’ అని ఇచ్చాం.
- source_word: πλουτήσητε
  choice: ధనవంతులు కావాలని
  rationale: ἵνα తో వచ్చిన ఉద్దేశం లేదా ఫలిత భావాన్ని తెలియజేస్తూ, ‘పేదవాడయ్యాడు—ధనవంతులు కావాలి’ అనే ఉద్దేశపూర్వక వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: క్రీస్తు ‘ధనవంతుడు’ కావడం, విశ్వాసులు ‘ధనవంతులు’ కావడం అనే భావం
  choice: ఆర్థిక పదచిత్రాన్ని ప్రధాన పాఠ్యంలో యథాతథంగా ఉంచి, అది ఏ రకమైన సంపద లేదా పేదరికమో నిర్దిష్టంగా చెప్పలేదు.
  alternative: దీనిని ప్రత్యేకంగా క్రీస్తు అవతారానికి ముందున్న దైవిక మహిమగా, మెస్సీయ సంబంధమైన ఆధిక్యతగా, భౌతిక సంపదగా, లేదా విశ్వాసుల ఆత్మీయ రక్షణ దీవెనలుగా వివరించడం.
  rationale: గ్రీకు వాక్యం ధనికత–పేదరికం అనే రూపకాన్ని ఉపయోగించినా దాని పరిధిని స్పష్టంగా నిర్వచించదు. సందర్భం ఉదారతకు సంబంధించినదైనా, వచనంలోని క్రీస్తు స్వయంత్యాగం మరియు విశ్వాసులకు కలిగే సంపద మధ్య ఉన్న విశాలమైన ధార్మిక ఉద్వేగాన్ని అనవసరంగా సంకుచితం చేయకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే గంభీరమైన బైబిలు శైలి నిలుపబడింది. మూలంలోని γάρ కారణసంబంధాన్ని ‘ఎందుకంటే’తో, ὅτι తరువాతి వివరణను ద్విబిందువుతో వ్యక్తం చేశాం.
