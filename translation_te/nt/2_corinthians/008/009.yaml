    issue: Potential syntactic misattachment in the final clause
    rationale: In ‘మీరు ఆయన పేదరికం ద్వారా ధనవంతులు కావాలని మీ కోసం పేదవాడయ్యాడు,’ the phrase ‘మీ కోసం’ follows the purpose expression and may be read initially with the believers’ becoming rich. Placing it directly before ‘పేదవాడయ్యాడు’ clearly reflects δι’ ὑμᾶς modifying ἐπτώχευσεν.
