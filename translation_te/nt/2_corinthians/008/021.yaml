id: 2CO.8.21
reference: 2 Corinthians 8:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂προνοοῦμεν γὰρ⸃ καλὰ οὐ μόνον ἐνώπιον κυρίου ἀλλὰ καὶ ἐνώπιον ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: te
  text: ఎందుకంటే, ప్రభువు దృష్టిలో మాత్రమే కాక, మనుషుల దృష్టిలో కూడా మంచివాటి[a] విషయంలో మేము ముందుగానే జాగ్రత్త తీసుకుంటున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘గౌరవప్రదమైన వాటి’ లేదా ‘సరైన వాటి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: προνοοῦμεν
  choice: ముందుగానే శ్రద్ధ తీసుకుంటున్నాం
  rationale: προνοέωలో ముందుగా ఆలోచించడం, తగిన జాగ్రత్త తీసుకోవడం అనే భావాలు ఉన్నాయి. కానుకల నిర్వహణ సందర్భంలో ఉద్దేశపూర్వకమైన ముందుజాగ్రత్తను ఈ పదబంధం సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందున్న మాటకు కారణాన్ని వివరిస్తుంది; తెలుగులో ‘ఎందుకంటే’ ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా చూపిస్తుంది.
- source_word: καλὰ
  choice: మంచిదైనదాన్ని
  rationale: నపుంసక బహువచనమైన καλὰ నైతికంగా మంచివైన లేదా గౌరవప్రదమైన పనులను సూచించగలదు. ప్రధాన పాఠంలో విస్తృతమైన అర్థాన్ని ఉంచి, సందర్భానుసారమైన ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: మాత్రమే కాక ... కూడా
  rationale: ఈ జత నిర్మాణం రెండు పరిధులనూ సమతూకంగా నొక్కిచెబుతుంది; ఆధునిక తెలుగులో ఇది సహజమైన రూపం.
- source_word: ἐνώπιον
  choice: దృష్టిలో
  rationale: ἐνώπιον అంటే ‘ఎదుట’ లేదా ‘దృష్టిలో.’ నైతిక జవాబుదారీతనం అనే సందర్భంలో ‘దృష్టిలో’ స్పష్టంగా, సహజంగా ఉంటుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριοςకు గౌరవప్రదమైన, ప్రామాణిక తెలుగు సమానార్థకంగా ‘ప్రభువు’ వాడబడింది.
- source_word: ἀνθρώπων
  choice: మనుషుల
  rationale: ἄνθρωποι ఇక్కడ పురుషులను మాత్రమే కాక సాధారణంగా మానవ పరిశీలకులందరినీ సూచిస్తుంది; ‘మనుషులు’ ఆ విస్తృత అర్థాన్ని కాపాడుతుంది.
theological_decisions:
- issue: ఆర్థిక జవాబుదారీతనం సందర్భంలో καλὰ యొక్క నైతిక భావఛాయ
  choice: ప్రధాన పాఠంలో విస్తృతంగా ‘మంచిదైనదాన్ని’
  alternative: ‘గౌరవప్రదమైనదాన్ని’ లేదా ‘సరైనదాన్ని’
  rationale: ఈ వాక్యం దేవుని ఎదుట మాత్రమే కాక మానవ పరిశీలకుల ఎదుట కూడా మెచ్చుకోదగిన ప్రవర్తనను సూచిస్తుంది. గ్రీకు పదానికి విస్తృత నైతిక భావం మరియు ప్రజల దృష్టిలో గౌరవప్రదమైనదనే సందర్భార్థం రెండూ సాధ్యమైనందున, ప్రధాన పాఠం విస్తృతతను నిలుపుతూ ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘ముందుగానే శ్రద్ధ తీసుకుంటున్నాం’ అనే రూపం మూలంలోని వర్తమానకాలం మరియు ముందుచూపు రెండింటినీ నిలుపుతుంది.
