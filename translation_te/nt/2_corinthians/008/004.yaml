    text: లేదా, “పరిశుద్ధుల కొరకు చేసే సేవలో పాల్గొనే భాగ్యాన్ని తమకు ఇవ్వమని.”
    reason: χάριςకు ‘భాగ్యం/అనుగ్రహిత అవకాశం,’ κοινωνίαకు ‘పాల్గొనడం’ అనే సందర్భానుకూల ప్రత్యామ్నాయ భావాలను చూపుతుంది.
  revision_rationale: The revision retains the two coordinated Greek terms while expressing their shared connection to the service for the saints in idiomatic Telugu. It removes the ambiguous and redundant “కృపలోను భాగస్వామ్యంలోను పాలుపొందడం” construction and corrects the footnote’s participant reference.
