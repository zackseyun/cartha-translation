id: 2CO.8.4
reference: 2 Corinthians 8:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν, τὴν χάριν καὶ τὴν κοινωνίαν τῆς διακονίας τῆς εἰς τοὺς ἁγίους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/004.yaml
  text: begging us with much urging for the grace and the fellowship of this ministry to the saints—[a]
translation:
  language: te
  text: పరిశుద్ధుల కొరకు చేసే సేవలో పాలుపంచుకొనే కృపను, భాగస్వామ్యాన్ని తమకు ఇవ్వమని వారు ఎంతో వేడుకొని మమ్మల్ని బతిమాలారు—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధుల కొరకు చేసే సేవలో పాల్గొనే భాగ్యాన్ని తమకు ఇవ్వమని.”
    reason: χάριςకు ‘భాగ్యం/అనుగ్రహిత అవకాశం,’ κοινωνίαకు ‘పాల్గొనడం’ అనే సందర్భానుకూల ప్రత్యామ్నాయ భావాలను చూపుతుంది.
lexical_decisions:
- source_word: μετὰ πολλῆς παρακλήσεως
  choice: ఎంతో వేడుకోలుతో
  rationale: μετά + షష్ఠీ విభక్తి ఇక్కడ క్రియ జరిగే తీరును సూచిస్తుంది. సందర్భంలో παράκλησις ఓదార్పు కంటే తీవ్రమైన విన్నపం లేదా వేడుకోలు అనే భావాన్ని ఇస్తుంది.
- source_word: δεόμενοι ἡμῶν
  choice: మమ్మల్ని బతిమాలారు
  rationale: δέομαι బలమైన, వినయపూర్వకమైన అభ్యర్థనను సూచిస్తుంది; ἡμῶν ఆ అభ్యర్థన ఎవరిని ఉద్దేశించిందో తెలియజేస్తుంది.
- source_word: τὴν χάριν
  choice: కృపలో
  rationale: χάρις అనే పౌలు వాడే ముఖ్య పదాన్ని ‘కృప’గా నిలుపుతూ, ఈ సందర్భంలో సేవలో పాల్గొనే అనుగ్రహిత అవకాశం అనే ఛాయను కూడా అనుమతిస్తుంది.
- source_word: τὴν κοινωνίαν
  choice: భాగస్వామ్యంలో
  rationale: κοινωνία ఇక్కడ సహవాసంతో కూడిన పాలుపంచుకోవడం లేదా భాగస్వామ్యాన్ని సూచిస్తుంది. సహాయక సేవలో క్రియాశీలంగా పాల్గొనడం సందర్భానికి సరిపోతుంది.
- source_word: τῆς διακονίας
  choice: ఈ సేవలోని
  rationale: διακονία ఇక్కడ అవసరంలో ఉన్న విశ్వాసులకు అందించే ఆచరణాత్మక సేవను సూచిస్తుంది. తెలుగు వాక్యసహజత కోసం ‘ఈ’ సందర్భసూచకంగా చేర్చబడింది.
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: పరిశుద్ధుల కోసం జరిగే
  rationale: εἰς ఇక్కడ సేవ యొక్క లక్ష్యాన్ని లేదా లబ్ధిదారులను సూచిస్తుంది. ἅγιοι పౌలు వద్ద సాధారణంగా విశ్వాసులందరినీ సూచిస్తుంది.
theological_decisions:
- issue: ἅγιοι పదం అనువాదం
  choice: పరిశుద్ధులు
  alternative: దేవుని పరిశుద్ధ ప్రజలు
  rationale: పౌలు విశ్వాసులను సంబోధించే ముఖ్య పదానికి పదసంబంధ నిరంతరతను కాపాడుతుంది; ఇది ప్రత్యేకంగా గుర్తింపు పొందిన కొద్దిమందికే పరిమితం అనే భావాన్ని కలిగించదు.
- issue: χάρις మరియు κοινωνίαν మధ్య సంబంధం
  choice: కృపలోను భాగస్వామ్యంలోను పాలుపొందడం
  alternative: ఈ సేవలో పాల్గొనే భాగ్యాన్ని పొందడం
  rationale: గ్రీకులో καίతో అనుసంధానమైన రెండు నామవాచకాలనూ ప్రధాన పాఠ్యంలో నిలుపుతుంది; అయితే అవి ఒకే సమగ్ర అభ్యర్థనకు చెందినవని సహజ తెలుగు వాక్యనిర్మాణం తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కృప,’ ‘పరిశుద్ధులు’ వంటి పౌలు వాడే కీలక ధార్మిక పదాలను నిలిపి, గ్రీకు వాక్యంలోని భావ సంబంధాన్ని సహజమైన తెలుగు వాక్యక్రమంలో వ్యక్తం చేసింది.
