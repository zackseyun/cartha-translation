id: 2CO.8.18
reference: 2 Corinthians 8:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: te
  text: మేము అతనితో పాటు, సువార్త విషయంలో సంఘాలన్నిటా ప్రశంస పొందిన ఆ సహోదరుణ్ణి పంపాము—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సువార్త విషయంలో సంఘాలన్నిటి మధ్య ప్రశంస పొందిన.”
    reason: διά పదబంధాన్ని ‘అన్నిటా’ అనే విస్తృతి భావంతో గానీ, ‘అన్నిటి మధ్య’ అనే సమూహ సంబంధ భావంతో గానీ తెలుగులో వ్యక్తం చేయవచ్చు.
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: మేము … తో పాటు … పంపాము
  rationale: ఆరిస్టు సూచించే పూర్తయిన చర్యను ‘పంపాము’ తెలియజేస్తుంది; σύν భావాన్ని సహజమైన తెలుగులో ‘తో పాటు’ వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: వాక్య ప్రవాహంలో ప్రత్యేక పదంతో అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతను కాక కథనాన్ని ముందుకు నడిపే మృదువైన అనుసంధానాన్ని సూచిస్తుంది. తెలుగులో వాక్యక్రమమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది; ‘మరియు’ అని చేర్చడం కృత్రిమంగా ఉంటుంది.
- source_word: μετ’ αὐτοῦ
  choice: అతనితో పాటు
  rationale: μετά షష్ఠీ విభక్తితో సహవాసం లేదా తోడును సూచిస్తుంది; ‘అతనితో పాటు’ దాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: τὸν ἀδελφόν
  choice: ఆ సహోదరుణ్ణి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న ἀδελφός సందర్భంలో తెలిసిన ఒక పురుష క్రైస్తవ సహోదరుణ్ణి సూచిస్తుంది. ‘ఆ’ నిర్దిష్టతను తెలియజేస్తుంది; మూలంలో లేని ‘మన’ను చేర్చలేదు.
- source_word: οὗ ὁ ἔπαινος
  choice: ప్రశంస పొందిన
  rationale: గ్రీకులోని నామవాచక నిర్మాణాన్ని తెలుగులో సహజమైన సంబంధార్థక క్రియారూపంగా మార్చినా, ప్రశంస అనే ప్రధాన భావం నిలిచింది.
- source_word: ἔπαινος
  choice: ప్రశంస
  rationale: ἔπαινος కు నేరమైన, సాధారణ తెలుగు సమానార్థకం ‘ప్రశంస’; ‘పేరు’ లేదా ‘ఖ్యాతి’ అని అనువదించి భావాన్ని మార్చలేదు.
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: సువార్త విషయంలో
  rationale: ఈ పదబంధం అతని ప్రశంస సువార్తతో సంబంధమున్న రంగంలో ఉందని సూచిస్తుంది. బోధించడం, పరిచర్య చేయడం వంటి మూలంలో లేని నిర్దిష్ట సేవను ఇందులో చేర్చలేదు.
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: సంఘాలన్నిటా
  rationale: διά షష్ఠీ విభక్తితో సంఘాల సముదాయం అంతటా వ్యాపించిన గుర్తింపును సూచిస్తుంది. ‘సంఘాలన్నిటా’ ఆధునిక తెలుగులో సంక్షిప్తంగా, సహజంగా ఆ విస్తృతిని అందిస్తుంది.
- source_word: ἐκκλησιῶν
  choice: సంఘాలు
  rationale: పౌలు సందర్భంలో ἐκκλησία స్థానిక క్రైస్తవ విశ్వాసుల సంఘాలను సూచిస్తుంది; ‘సంఘాలు’ ప్రామాణికమైన, స్పష్టమైన తెలుగు పదం.
theological_decisions:
- issue: ἀδελφός సూచించే వ్యక్తి గుర్తింపు, లింగం
  choice: కొరింథీయులకు తెలిసిన ఒక నిర్దిష్ట పురుష క్రైస్తవ సహోదరునిగా ‘ఆ సహోదరుడు’ అని అనువదించబడింది.
  alternative: సాధారణ అర్థంలో ‘తోటి విశ్వాసి’
  rationale: నిర్దిష్ట ఉపపదంతో కూడిన పురుషలింగ ఏకవచనం, అలాగే ప్రయాణ సందర్భం, ఒక నిర్దిష్ట పురుష సహోద్యోగిని సూచిస్తున్నాయి. సాధారణీకరించడం వ్యక్తిగత సూచనను మసకబారుస్తుంది.
- issue: ἐν τῷ εὐαγγελίῳ యొక్క భావపరిధి
  choice: ‘సువార్త విషయంలో’ అని విస్తృత భావాన్ని నిలిపింది.
  alternative: ‘సువార్త ప్రకటించడంలో’ లేదా ‘సువార్త పరిచర్యలో’
  rationale: గ్రీకు పదబంధం అతని ప్రశంస సువార్తతో సంబంధమున్నదని చెబుతుంది గానీ, ప్రకటించడం లేదా ఏదైనా ప్రత్యేక పరిచర్య పదవిని స్పష్టంగా చెప్పదు. అందువల్ల మూలంలోని భావ విస్తృతిని సంకుచితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు వాక్యాంతంలోని కొనసాగింపును సూచించే దీర్ఘ విరామచిహ్నం నిలిపి, దాని తరువాత పాదసూచిక గుర్తు [a] ఉంచబడింది.
