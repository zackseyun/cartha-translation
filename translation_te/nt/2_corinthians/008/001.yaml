id: 2CO.8.1
reference: 2 Corinthians 8:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Γνωρίζομεν δὲ ὑμῖν, ἀδελφοί, τὴν χάριν τοῦ θεοῦ τὴν δεδομένην ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/001.yaml
  text: We make known to you[a], brothers, the grace of God that has been given among the churches of Macedonia[b],
translation:
  language: te
  text: సోదరులారా[a], మాసిదోనియలోని సంఘాలలో ప్రసాదించబడిన దేవుని కృపను[b] మీకు తెలియజేస్తున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సోదర సోదరీమణులారా”; గ్రీకులో “సోదరులారా” అని ఉంది. ఈ పుంలింగ రూపం తరచుగా సంఘమంతటినీ ఉద్దేశించి వాడబడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: “దేవుని కృప” అనేది దేవుని అనుగ్రహాన్నీ, ఆ అనుగ్రహం మాసిదోనియ సంఘాల్లో కలిగించిన కృపాపూర్వక ఉదారతనూ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζομεν
  choice: తెలియజేస్తున్నాం
  rationale: ‘తెలియజేయడం’ అనే క్రియార్థాన్ని, వర్తమాన కాలపు పత్రికా శైలిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘మీరు తెలుసుకోవాలని కోరుతున్నాం’ వంటి వివరణాత్మక విస్తరణను నివారిస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ ఇది బలమైన వ్యతిరేకతను కాక స్వల్ప విషయమార్పును సూచిస్తుంది. తెలుగులో వాక్యారంభ స్థానం, సందర్భ ప్రవాహం ఆ మార్పును సహజంగా తెలియజేస్తాయి; ‘కాని’ అంటే అవసరానికి మించిన వ్యతిరేక భావం వస్తుంది, ‘ఇప్పుడు’ అంటే మూలంలో లేని కాలార్థం వినిపించవచ్చు.
- source_word: ὑμῖν
  choice: మీకు
  rationale: γνωρίζομεν క్రియకు సంబంధించిన దత్తివాచక పరోక్ష కర్మను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పుంలింగ సంబోధన రూపాన్ని మూలానికి దగ్గరగా ఉంచుతుంది. పౌలు వాడుకలో ఇది సాధారణంగా సంఘమంతటినీ ఉద్దేశించగలదని పాదటీపులో తెలియజేస్తాం.
- source_word: χάριν
  choice: కృపను
  rationale: పౌలు రచనల్లో ప్రాముఖ్యమైన χάρις పదపు విస్తృత భావాన్ని నిలుపుతుంది. దీనిని ‘కానుక’ లేదా ‘ఉదారత’గా కుదించకుండా దేవుని అనుగ్రహాన్నీ, దాని ఫలమైన ఉదారతనూ సూచించే అవకాశాన్ని కాపాడుతుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: χάριν‌ను విశేషించే షష్ఠీ సంబంధాన్ని సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది; ‘దేవుని నుండి వచ్చిన’ అని సంబంధాన్ని అవసరానికి మించి స్పష్టం చేయదు.
- source_word: τὴν δεδομένην
  choice: ప్రసాదించబడిన
  rationale: పరిపూర్ణ కర్మణి భావాన్ని సంక్షిప్తంగా, గౌరవప్రదంగా తెలియజేస్తుంది; ఇచ్చిన కార్యం మరియు కొనసాగుతున్న ఫలితం రెండూ సందర్భంలో నిలుస్తాయి.
- source_word: ἐν
  choice: మధ్య
  rationale: ఆ కృప సంఘాలలో లేదా వాటి మధ్య కార్యరూపంలో ఉన్న పరిధిని సూచిస్తుంది; దానిని కేవలం సంఘాలకు ఇచ్చినదిగా నిర్దిష్టం చేయకుండా మూలంలోని కొంత విస్తృతిని కాపాడుతుంది.
- source_word: ἐκκλησίαις
  choice: సంఘాల
  rationale: పౌలు ఉద్దేశించిన స్థానిక క్రైస్తవ సమూహాలకు ఆధునిక ప్రామాణిక తెలుగులో స్థిరమైన సందర్భోచిత పదం.
- source_word: τῆς Μακεδονίας
  choice: మాసిదోనియలోని
  rationale: ఆ సంఘాల భౌగోళిక సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘దేవుని కృప’ అనే మాటకు ఈ సందర్భంలో ఉన్న అర్థవిస్తృతి
  choice: మాసిదోనియ సంఘాల మధ్య కార్యరూపంలో ఉన్న దేవుని కృప; వారి ఉదారత కూడా దాని ఫలంగా దృష్టిలో ఉంటుంది
  alternative: ఇది కేవలం ధనసహాయ కానుకనే సూచిస్తుంది; లేదా ఆ సంఘాలకు లభించిన దైవానుగ్రహాన్ని మాత్రమే సూచిస్తుంది
  rationale: మూలపదప్రయోగం దేవుని కృప అనే మూలాన్నీ, దాని ఆచరణాత్మక ఫలమైన ఉదార దానాన్నీ కలిపి సూచించగలదు. అందువల్ల ‘కృప’ను ‘కానుక’గా లేదా ‘ఉదారత’గా కుదించకుండా theological tensionను నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణంతో పాటు పత్రికా గంభీరతను నిలిపాం. ‘సోదరులారా’ అనే మూలాకార సంబోధనకు సమగ్ర ఉద్దేశాన్ని పాదటీపులో ఇచ్చాం. δὲను కాలార్థమున్న ‘ఇప్పుడు’గా గానీ, బలమైన వ్యతిరేకార్థమున్న ‘కాని’గా గానీ మలచకుండా తెలుగు సందర్భ ప్రవాహంలో ఉంచాం.
