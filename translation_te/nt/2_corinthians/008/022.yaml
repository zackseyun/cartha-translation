id: 2CO.8.22
reference: 2 Corinthians 8:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: te
  text: వారితో పాటు మన సహోదరుణ్ణి కూడా పంపాము. అతడు అనేక విషయాల్లో ఎన్నోసార్లు శ్రద్ధగలవాడని మేము పరీక్షించి తెలుసుకున్నాము; ఇప్పుడు మీపై అతనికున్న గొప్ప నమ్మకం వల్ల అతడు ఎంతో ఎక్కువ శ్రద్ధగలవాడిగా ఉన్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇప్పుడు మీపై అతనికున్న గొప్ప నమ్మకం ద్వారా అతడు ఎంతో ఎక్కువ శ్రద్ధగలవాడిగా ఉన్నాడు.” గ్రీకు దత్తి రూపం అతని పెరిగిన శ్రద్ధకు కారణాన్ని లేదా దానికి సంబంధించిన సాధనాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: వారితో పాటు ... పంపాము
  rationale: ఆరిస్ట్ క్రియ పూర్తయిన పంపే చర్యను సూచిస్తుంది; σύν- భావాన్ని ‘వారితో పాటు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀδελφὸν ἡμῶν
  choice: మన సహోదరుణ్ణి
  rationale: విశ్వాసుల కుటుంబసంబంధ భాషను, అలాగే పేరులేని పురుష సహోద్యోగిని సూచించే భావాన్ని నిలుపుతుంది.
- source_word: ἐδοκιμάσαμεν
  choice: మేము పరీక్షించి తెలుసుకున్నాము
  rationale: δοκιμάζωలోని పరీక్షించడం మరియు దాని ద్వారా గుణం నిరూపితమవడం అనే రెండు భావాలనూ తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: ἐν πολλοῖς πολλάκις
  choice: అనేక విషయాల్లో ఎన్నోసార్లు
  rationale: పరిస్థితుల విస్తృతినీ, పరీక్ష పునరావృతినీ రెండింటినీ కాపాడుతుంది.
- source_word: σπουδαῖον ὄντα
  choice: శ్రద్ధగలవాడని
  rationale: ఈ సందర్భంలో σπουδαῖος సూచించే శ్రద్ధ, ఆసక్తి, కార్యదీక్షలలో పరిపాలనా నమ్మకత్వానికి సరిపోయే ప్రధాన భావాన్ని ఇస్తుంది.
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: ఇప్పుడు ... మరింత శ్రద్ధగలవాడయ్యాడు
  rationale: πολύతో బలపరచబడిన తులనాత్మక రూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: మీపై అతనికున్న గొప్ప నమ్మకం వల్ల
  rationale: దత్తి విభక్తిని కారణార్థకంగా తీసుకొని, నమ్మకం కొరింథీయుల వైపు ఉందని స్పష్టం చేస్తుంది; ‘అతనికున్న’ అనేది సమీప కర్తయైన సహోదరునితో సహజంగా అనుసంధానిస్తుంది.
theological_decisions:
- issue: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς అనే పదబంధం ఎవరికి చెందిన నమ్మకాన్ని, ఏ సంబంధాన్ని సూచిస్తుంది?
  choice: ఆ సహోదరునికి కొరింథీయులపై ఉన్న గొప్ప నమ్మకమే అతని పెరిగిన శ్రద్ధకు కారణం
  alternative: ఇది పౌలుకు కొరింథీయులపై ఉన్న నమ్మకాన్ని సూచించవచ్చు; లేదా కారణం కంటే ‘నమ్మకంతో’ అనే సాధనార్థక భావం కావచ్చు
  rationale: సమీప వాక్యనిర్మాణం ఈ పదబంధాన్ని పేరులేని సహోదరుని పెరిగిన శ్రద్ధతో అనుసంధానించడం అత్యంత సహజం. అయితే దత్తి విభక్తిలోని కారణార్థక/సాధనార్థక స్వల్ప భేదాన్ని పాదటిప్పణిలో నిలిపాము; విస్తృతమైన సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాము. మూలంలోని పొడవైన వాక్యాన్ని పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించి, భావసంబంధాన్ని అర్ధవిరామంతో నిలిపాము. ‘సహోదరుడు’ అనే క్రైస్తవ కుటుంబసంబంధ పదాన్ని అనవసర వివరణ లేకుండా ఉంచాము.
