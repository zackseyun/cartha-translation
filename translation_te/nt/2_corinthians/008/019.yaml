language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: te
  text: అంతేకాక, సంఘాలు అతనిని ఈ కృపాకానుకతో కలిసి మాతో ప్రయాణించే సహచరునిగా[d] నియమించాయి[a]; ఈ కృపాకానుకను మేము ప్రభువు స్వయాన మహిమకోసమూ[c] మా ఉత్సాహాన్ని చూపడంకోసమూ నిర్వహిస్తున్నాము[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఎన్నుకున్నాయి.” సంఘాలు అతణ్ణి ఈ సేవకు ఎంపిక చేశాయనే భావం ఉంది; ఆధునిక పద్ధతిలో ఓటు వేశాయని తప్పనిసరిగా అర్థం కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఈ కృపతో.” ఇక్కడ “కృపాకానుక” అనేది సహాయార్థం సేకరించిన కానుక సందర్భంలో χάρις అనే పదాన్ని ప్రతిబింబిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: లేదా “అతని ప్రభువు మహిమకోసం”; గ్రీకు పదబంధాన్ని “ప్రభువు మహిమకోసం” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: d
    text: లేదా “ఈ కృపాకానుక విషయమై మాతో ప్రయాణించే సహచరునిగా.”
    reason: previous_rendering
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: నియమించాయి
  rationale: సంఘాలు అతణ్ణి ఈ బాధ్యతకు ఎంపిక చేసి నియమించాయని స్పష్టంగా తెలుపుతుంది; ఆధునిక ఓటింగ్ విధానాన్ని అనవసరంగా సూచించదు.
- source_word: ἐκκλησιῶν
  choice: సంఘాలు
  rationale: పౌలు వాడుకలో ఇది క్రైస్తవ విశ్వాసుల స్థానిక సంఘాలను సూచిస్తుంది; ఆధునిక ప్రామాణిక తెలుగులో సహజమైన పదం.
- source_word: συνέκδημος
  choice: మాతో ప్రయాణించే సహచరుడు
  rationale: కానుకకు సంబంధించిన ప్రయాణంలో పౌలు బృందంతో వెళ్లే వ్యక్తి అనే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: χάριτι
  choice: కృపాకానుక
  rationale: యెరూషలేము కోసం సేకరించిన కానుక అనే నిర్దిష్ట సందర్భాన్నీ, χάρις లోని కృప భావాన్నీ కలిపి నిలుపుతుంది.
- source_word: διακονουμένῃ
  choice: మేము నిర్వహిస్తున్న
  rationale: కానుకను బాధ్యతగా నిర్వహించడం అనే కార్యనిర్వాహక భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: πρὸς
  choice: కోసం
  rationale: ఇక్కడ కానుక నిర్వహణ యొక్క ఉద్దేశం లేదా లక్ష్యాన్ని సూచిస్తుంది.
- source_word: αὐτοῦ τοῦ κυρίου
  choice: ప్రభువు స్వయాన
  rationale: αὐτοῦ ను బలపరిచే ప్రయోగంగా తీసుకొని ప్రభువుపైనున్న ఉద్ఘాటనను నిలుపుతుంది; ఇతర సాధ్యమైన నిర్మాణాన్ని పాదసూచికలో ఉంచింది.
- source_word: δόξαν
  choice: మహిమ
  rationale: పౌలు రచనల్లోని దైవశాస్త్రీయ బరువును నిలిపే ప్రామాణిక తెలుగు పదం.
- source_word: προθυμίαν
  choice: ఉత్సాహం
  rationale: స్వచ్ఛందమైన ఆసక్తి, సంసిద్ధత అనే భావాన్ని అనవసర విస్తరణ లేకుండా తెలియజేస్తుంది.
theological_decisions:
- issue: πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν లో αὐτοῦ యొక్క సంబంధం, ఉద్ఘాటన
  choice: ప్రభువు స్వయాన మహిమ కోసం
  alternative: అతని ప్రభువు మహిమ కోసం; ప్రభువు మహిమ కోసం
  rationale: సందర్భంలో αὐτοῦ ను τοῦ κυρίου ను బలపరిచేదిగా గ్రహించడం సహజం. అయితే గ్రీకు నిర్మాణంలో ఉన్న నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
- issue: προθυμίαν ἡμῶν ను ఉద్దేశంతో అనుసంధానించడం
  choice: మా ఉత్సాహాన్ని వ్యక్తం చేయడం కోసం
  alternative: మా ఉత్సాహం కోసం; మా సంసిద్ధత కోసం
  rationale: గ్రీకులో πρὸς కింద δόξαν మరియు προθυμίαν సమాంతరంగా ఉన్నాయి. తెలుగులో అర్థవంతంగా ఉండేందుకు ‘వ్యక్తం చేయడం’ను సందర్భానుగుణంగా చేర్చినా, ప్రధాన నామవాచకాన్ని ‘ఉత్సాహం’గానే నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పత్రికా శైలికి తగిన గౌరవప్రదమైన ధోరణితో రూపొందించబడింది. గ్రీకు వాక్యంలోని దీర్ఘ నిర్మాణం మరియు తరువాతి వాక్యానికి కొనసాగే డాష్ నిలుపబడ్డాయి.
