id: 2CO.8.12
reference: 2 Corinthians 8:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: te
  text: ఎందుకంటే, ఇవ్వడానికి సిద్ధమనస్సు ఉంటే[a], ఎవరికైనా ఏది ఉంటే దాని ప్రకారం అది అంగీకారయోగ్యమవుతుంది[b]; లేనిదాని ప్రకారం కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇవ్వడానికి ఉత్సాహం’ లేదా ‘ఇవ్వడానికి సుముఖత.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘ఎవరికైనా ఏది ఉంటే దాని ప్రకారం … లేనిదాని ప్రకారం కాదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: ఇవ్వాలనే సిద్ధమనస్సు
  rationale: ఈ పదం ఇష్టపూర్వకమైన, ఉత్సాహభరితమైన సంసిద్ధతను సూచిస్తుంది. సందర్భం కానుక ఇవ్వడం గురించి ఉన్నందున, ‘ఇవ్వాలనే సిద్ధమనస్సు’ సహజంగా భావాన్ని స్పష్టం చేస్తుంది; కేవలం కార్యసిద్ధతగా పరిమితం చేయదు.
- source_word: πρόκειται
  choice: ఉంటే
  rationale: ఈ సందర్భంలోని ప్రయోగం ‘ఉనికిలో ఉండడం/సమకూరి ఉండడం’ అనే భావాన్ని ఇస్తుంది. తెలుగులో షరతు వాక్యంలో ‘ఉంటే’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: καθὸ ἐὰν ἔχῃ
  choice: ఒక వ్యక్తి తనకు ఉన్నదాని ప్రకారమే
  rationale: అందుబాటులో ఉన్న వనరులే కొలమానం అనే భావాన్ని నిలుపుతుంది. ‘ఒక వ్యక్తి’ గ్రీకు సాధారణ ఏకవచనాన్ని లింగనిరపేక్షంగా వ్యక్తం చేస్తుంది.
- source_word: εὐπρόσδεκτος
  choice: అంగీకారయోగ్యంగా ఉంటుంది
  rationale: ఇది ఆమోదించదగినది లేదా సంతోషంగా స్వీకరించదగినది అనే మూలభావాన్ని తెలియజేస్తుంది; ఎవరి ఎదుట అంగీకారయోగ్యమో వచనం చెప్పనందున దానిని చేర్చదు.
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: తనకు లేనిదాని ప్రకారం కాదు
  rationale: ఉన్నదాని ప్రకారం—లేనిదాని ప్రకారం కాదు అనే పౌలు ఉద్దేశించిన సమాంతర వ్యత్యాసాన్ని నేరుగా కాపాడుతుంది.
- source_word: εἰ γὰρ
  choice: ఎందుకంటే ... ఉంటే
  rationale: γὰρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో, εἰ యొక్క షరతు భావాన్ని ‘ఉంటే’తో నిలుపుతుంది.
theological_decisions:
- issue: అంగీకారయోగ్యతకు ఉద్దేశింపబడిన స్వీకర్త
  choice: ఎవరి ఎదుట అంగీకారయోగ్యమో పేర్కొనకుండా మూలపాఠంలోని విస్తృత భావాన్ని నిలుపడం
  alternative: దేవునికి అంగీకారయోగ్యం; సంఘానికి అంగీకారయోగ్యం
  rationale: εὐπρόσδεκτος ఆమోదం లేదా స్వీకారాన్ని సూచించినా, దానిని ఎవరు అంగీకరిస్తారో పాఠం స్పష్టంగా చెప్పదు. అందువల్ల అనువాదం ఆ దైవశాస్త్రీయ లేదా సామాజిక సూచనను నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. కానుకల సందర్భాన్ని సహజంగా తెలియజేయడానికి ‘ఇవ్వాలనే’ చేర్చబడింది; అంగీకారాన్ని ఎవరు ఇస్తారనే విషయాన్ని ఉద్దేశపూర్వకంగా నిర్దిష్టం చేయలేదు.
