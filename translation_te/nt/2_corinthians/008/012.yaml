review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the conditional-explanatory force of εἰ γὰρ, the presence of προθυμία, and the proportional contrast between what is possessed and what is not. ‘ఇవ్వాలనే’ is contextually warranted by the surrounding appeal concerning giving. A small revision better represents the indefinite ‘whatever one may have’ without the awkward added phrase ‘ఒక వ్యక్తి తనకు’.
  naturalness: ‘ఒక వ్యక్తి తనకు ఉన్నదాని ప్రకారమే’ is somewhat cumbersome in modern standard Telugu. ‘ఎవరికైనా ఏది ఉంటే దాని ప్రకారం’ is more idiomatic and retains the generic, indefinite construction. ‘ఇవ్వడానికి సిద్ధమనస్సు’ is also smoother than the contracted ‘ఇవ్వాలనే సిద్ధమనస్సు’ in this register.
  terminology: ‘సిద్ధమనస్సు’ suitably conveys προθυμία in context, while the footnote preserves ‘ఉత్సాహం’ and ‘సుముఖత’ as viable alternatives. ‘అంగీకారయోగ్యమవుతుంది’ appropriately leaves unspecified who accepts it, as does εὐπρόσδεκτος in this verse.
  issues:
  - severity: low
    issue: Awkward generic expression
    rationale: ‘ఒక వ్యక్తి తనకు ఉన్నదాని’ redundantly combines an explicit generic noun with a reflexive possessive. A generic conditional construction is more natural and closer to καθὸ ἐὰν ἔχῃ.
  - severity: low
    issue: Register of the expression for readiness
    rationale: ‘ఇవ్వడానికి సిద్ధమనస్సు’ is a more standard and fluent expression than ‘ఇవ్వాలనే సిద్ధమనస్సు’, while retaining the giving context and the willing disposition signaled by προθυμία.
  revised_text: ఎందుకంటే, ఇవ్వడానికి సిద్ధమనస్సు ఉంటే[a], ఎవరికైనా ఏది ఉంటే దాని ప్రకారం అది అంగీకారయోగ్యమవుతుంది[b]; లేనిదాని ప్రకారం కాదు.
