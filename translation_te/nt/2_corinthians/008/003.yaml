  source_fidelity: The translation accurately represents ὅτι as an explanatory ‘ఎందుకంటే,’ preserves the measured contrast of ‘κατὰ δύναμιν … καὶ παρὰ δύναμιν,’ retains Paul’s personal attestation in ‘నేను సాక్ష్యమిస్తున్నాను,’ and appropriately supplies the contextually implied giving action for αὐθαίρετοι without adding substantive content.
