  terminology: ‘సామర్థ్యం’ is a suitable general rendering of δύναμις here, and the footnote appropriately supplies the financial-means nuance (‘ఆర్థిక స్థోమత’). ‘స్వచ్ఛందంగా’ and ‘ఇష్టపూర్వకంగా’ are sound alternatives for αὐθαίρετοι.
