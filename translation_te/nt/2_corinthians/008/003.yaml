id: 2CO.8.3
reference: 2 Corinthians 8:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι κατὰ δύναμιν, μαρτυρῶ, καὶ ⸀παρὰ δύναμιν, αὐθαίρετοι
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/003.yaml
  text: For[a], I testify, they gave according to their ability, and beyond their ability, of their own accord[b],
translation:
  language: te
  text: ఎందుకంటే వారు తమ సామర్థ్యానికి తగినట్లుగా, అంతేకాక తమ సామర్థ్యానికి మించి[a], తమంతట తామే[b] ఇచ్చారని నేను సాక్ష్యమిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘తమ ఆర్థిక స్థోమత మేరకు, ఇంకా తమ స్థోమతకు మించి.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘స్వచ్ఛందంగా’ లేదా ‘ఇష్టపూర్వకంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: మునుపటి వచనంలోని మాటకు ఈ వాక్యం వివరణాత్మక ఆధారాన్ని ఇస్తోంది; అందువల్ల కారణసూచకమైన ‘ఎందుకంటే’ సహజంగా ఉంది.
- source_word: κατὰ δύναμιν
  choice: తమ సామర్థ్యానికి తగినట్లుగా
  rationale: κατά ఇక్కడ కొలత లేదా ప్రమాణాన్ని సూచిస్తుంది; ఈ పదబంధం వారు తమకు ఉన్న సామర్థ్యం మేరకు ఇచ్చారనే భావాన్ని నిలుపుతుంది.
- source_word: μαρτυρῶ
  choice: నేను సాక్ష్యమిస్తున్నాను
  rationale: వర్తమానకాలంలోని ఈ క్రియ పౌలు వ్యక్తిగతంగా ధృవీకరిస్తున్న విషయాన్ని నొక్కిచెబుతుంది.
- source_word: καὶ παρὰ δύναμιν
  choice: అంతేకాక తమ సామర్థ్యానికి మించి
  rationale: παρά ఇక్కడ పరిమితిని దాటి వెళ్లడాన్ని సూచిస్తుంది; ముందటి పదబంధంతో ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని ఈ అనువాదం కాపాడుతుంది.
- source_word: αὐθαίρετοι
  choice: తమంతట తామే
  rationale: బలవంతం వల్ల కాకుండా, సొంత చొరవతో వ్యవహరించడాన్ని ఈ విశేషణం సూచిస్తుంది; ‘తమంతట తామే’ ఆ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: αὐθαίρετοι వద్ద అంతర్లీనంగా ఉన్న క్రియ
  choice: సందర్భం ఆధారంగా ‘ఇచ్చారని’ చేర్చడం
  alternative: ‘స్వచ్ఛందులై’ లేదా ‘తమంతట తామే’ అని క్రియను చేర్చకుండా మరింత అక్షరార్థంగా అనువదించడం
  rationale: గ్రీకు వాక్యం సంక్షిప్తంగా ఉండి, ఇవ్వడమనే చర్యను 2–4 వచనాల సందర్భం నుంచి గ్రహింపజేస్తుంది. సంపూర్ణమైన, సహజమైన తెలుగు వాక్యం కోసం ‘ఇచ్చారని’ చేర్చడం స్పష్టతనిస్తుంది; సందర్భానికి మించిన భావాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతను, సాధారణ పాఠకులకు స్పష్టతను సమతుల్యం చేశాం. గ్రీకులోని ‘సామర్థ్యానికి తగినట్లుగా / సామర్థ్యానికి మించి’ అనే సమాంతర వ్యత్యాసాన్ని అలాగే ఉంచి, αὐθαίρετοι లోని స్వచ్ఛందతతో పాటు సొంత చొరవ భావాన్ని ‘తమంతట తామే’ ద్వారా వ్యక్తం చేశాం.
