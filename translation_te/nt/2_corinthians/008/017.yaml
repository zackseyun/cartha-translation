id: 2CO.8.17
reference: 2 Corinthians 8:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι τὴν μὲν παράκλησιν ἐδέξατο, σπουδαιότερος δὲ ὑπάρχων αὐθαίρετος ἐξῆλθεν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/017.yaml
  text: For he accepted the appeal[a], but being more earnest[d][c][b], he went to you of his own accord.
translation:
  language: te
  text: ఎందుకంటే అతడు ఆ విజ్ఞప్తిని అంగీకరించాడు; అయితే, మరింత ఉత్సాహంతో, తన స్వంత చొరవతో మీ దగ్గరికి బయలుదేరాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీ దగ్గరికి వెళ్లాడు.”
    reason: గ్రీకు క్రియను సందర్భానుసారం ‘బయలుదేరాడు’ లేదా ‘వెళ్లాడు’ అని అనువదించవచ్చు; ‘బయలుదేరాడు’ మూలక్రియలోని బయటకు/ప్రయాణానికి ప్రారంభమైన భావాన్ని మెరుగుగా నిలుపుతుంది.
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని కృతజ్ఞతకు కారణాన్ని లేదా వివరణను పరిచయం చేసే సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὴν παράκλησιν
  choice: మా విజ్ఞప్తిని
  rationale: ఈ సందర్భంలో పౌలు తీతుకు చేసిన అభ్యర్థన లేదా పురికొల్పును సూచిస్తుంది. తెలుగులో ‘విజ్ఞప్తి’ అప్పగించిన పనిని స్వీకరించడమనే భావానికి సరిపోతుంది; ‘మా’ అనేది సందర్భంలో విజ్ఞప్తి చేసిన పౌలును సూచిస్తూ సహజత కోసం స్పష్టీకరించబడింది.
- source_word: ἐδέξατο
  choice: అంగీకరించడమే కాక
  rationale: విజ్ఞప్తిని సానుకూలంగా స్వీకరించాడనే భావాన్ని ఇస్తుంది. గ్రీకులోని μὲν ... δὲ నిర్మాణాన్ని సహజ తెలుగులో ‘...డమే కాక’ అనే అనుసంధానంతో వ్యక్తం చేసింది.
- source_word: σπουδαιότερος
  choice: మరింత ఆసక్తితో
  rationale: తులనాత్మక రూపంలోని అధిక ఉత్సాహం, శ్రద్ధ అనే భావాన్ని నిలుపుతుంది; తీతు చర్యకు ప్రేరణను సహజంగా తెలియజేస్తుంది.
- source_word: αὐθαίρετος
  choice: తనంతట తానే
  rationale: బలవంతం వల్ల కాకుండా స్వచ్ఛందంగా, తన సొంత చొరవతో చేసిన చర్యను స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐξῆλθεν πρὸς ὑμᾶς
  choice: మీ దగ్గరికి బయలుదేరాడు
  rationale: ἐξῆλθεν లోని బయలుదేరడం అనే దిశాత్మక భావాన్ని, πρὸς ὑμᾶς లోని గమ్యాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. గ్రీకులోని తులనాత్మక ఉత్సాహం, స్వచ్ఛంద చొరవ, గమ్యం వైపు బయలుదేరడం అనే అంశాలు నిలుపబడ్డాయి.
