id: 2CO.8.15
reference: 2 Corinthians 8:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ὁ τὸ πολὺ οὐκ ἐπλεόνασεν, καὶ ὁ τὸ ὀλίγον οὐκ ἠλαττόνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: te
  text: 'లేఖనంలో ఇలా రాసి ఉంది: “ఎక్కువ ఉన్నవానికి మిగులు లేదు; కొద్దిగా ఉన్నవానికి కొరత లేదు.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, నిర్గమకాండము 16:18లోని సందర్భాన్ని స్పష్టంగా చూపిస్తూ: “ఎక్కువగా సేకరించినవానికి మిగులు లేదు; కొద్దిగా సేకరించినవానికి కొరత లేదు.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: లేఖనంలో ఇలా రాసి ఉంది
  rationale: ఇది లేఖనాన్ని పరిచయం చేసే ప్రామాణిక ఉల్లేఖన సూత్రం. గ్రీకు పరిపూర్ణ కాలం రాతపూర్వక సాక్ష్యం ఇప్పటికీ నిలిచి ఉందనే భావాన్ని ఇస్తుంది.
- source_word: Ὁ τὸ πολὺ
  choice: ఎక్కువగా ఉన్నవానికి
  rationale: 'నపుంసక విశేషణం నామవాచకార్థంలో వాడబడింది: ‘ఎక్కువ ఉన్నవాడు.’ పౌలు వాక్యంలో ‘సేకరించిన’ అనే క్రియ స్పష్టంగా లేకపోవడంతో దానిని ప్రధాన పాఠ్యంలో చేర్చలేదు.'
- source_word: ἐπλεόνασεν
  choice: మిగులు లేదు
  rationale: ఈ సందర్భంలో క్రియ అవసరానికి మించి ఉండడం లేదా అధికంగా మిగలడం అనే ఫలితాన్ని సూచిస్తుంది. సంక్షిప్తమైన ఈ పదబంధం పంపిణీ తర్వాత అదనం లేకపోవడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ τὸ ὀλίγον
  choice: కొద్దిగా ఉన్నవానికి
  rationale: ముందరి పదబంధానికి సమాంతరంగా, పౌలు వచనంలో లేని ‘సేకరించిన’ అనే భావాన్ని చేర్చకుండా పరిమాణ వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἠλαττόνησεν
  choice: కొరత లేదు
  rationale: ఈ క్రియ తక్కువపడడం లేదా లోటు కలగడం అనే అర్థాన్ని ఇస్తుంది. ‘కొరత లేదు’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం; ‘మిగులు లేదు’తో సమతుల్య విరుద్ధ సమాంతరతను కలిగిస్తుంది.
theological_decisions:
- issue: నిర్గమకాండము 16:18 ఉల్లేఖనాన్ని దాతృత్వం మరియు సమాన సమృద్ధి సందర్భంలో పౌలు ఉపయోగించడం
  choice: పౌలు ఉటంకించిన గ్రీకు వాక్యానికి అనుగుణంగా, సేకరణ చర్యను ప్రధాన పాఠ్యంలో చేర్చకుండా మిగులు-కొరతల ఫలితంగా అనువదించడం.
  alternative: “ఎక్కువగా సేకరించినవానికి మిగులు లేదు; కొద్దిగా సేకరించినవానికి కొరత లేదు.”
  rationale: నిర్గమకాండంలోని మూల సందర్భం మన్నా సేకరణ అయినప్పటికీ, పౌలు ఉటంకించిన రూపంలో సేకరించే క్రియ లేదు. దానిని చేర్చకుండా ఉండడం పౌలు దృష్టిలోని సముచిత సమకూర్పును నిలుపుతూ, మూలసందర్భాన్ని పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా, సామాన్య పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. ‘మిగులు—కొరత’ అనే జంట గ్రీకు వాక్యంలోని విరుద్ధ సమాంతరతను స్పష్టంగా నిలుపుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
