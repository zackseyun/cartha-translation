id: 2CO.8.7
reference: 2 Corinthians 8:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: te
  text: అయితే, మీరు ప్రతి విషయంలో—విశ్వాసంలో, మాటలో, జ్ఞానంలో, సంపూర్ణ శ్రద్ధలో, మా నుండి మీలో ఉన్న ప్రేమలో—సమృద్ధిగా ఉన్నట్లే, ఈ కృపలో కూడా సమృద్ధిగా ఉండేలా చూసుకోండి.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మాపట్ల మీ ప్రేమలో.” ఈ గ్రీకు వాక్యభాగం క్లిష్టమైనది; కొన్ని ప్రాచీన ప్రతుల్లో “మాలో ఉన్న మీ ప్రేమలో” అనే పాఠం ఉంది.
    reason: alternative_reading
  - marker: b
    text: అంటే, దాతృత్వంతో ఇచ్చే ఈ కృపాకార్యంలో.
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: సమృద్ధిగా ఉన్నట్లే / సమృద్ధిగా ఉండేలా
  rationale: రెండు చోట్లా సమృద్ధి అనే భావచిత్రాన్ని నిలిపి, కొరింథీయులలో ఇప్పటికే ఉన్న ఆత్మీయ సమృద్ధిని మరియు ఈ కృప విషయంలోనూ అలాగే ఉండాలన్న పౌలు ప్రోత్సాహాన్ని అనుసంధానిస్తుంది.
- source_word: ἐν παντί
  choice: ప్రతి విషయంలో
  rationale: తరువాత వచ్చే లక్షణాలన్నిటినీ సమగ్రంగా పరిచయం చేసే సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణ.
- source_word: πίστει
  choice: విశ్వాసంలో
  rationale: ఈ క్రైస్తవ లక్షణాల జాబితాలో πίστις యొక్క సాధారణ అర్థాన్ని నిలుపుతుంది; సందర్భం ‘విశ్వసనీయత’ అనే అర్థాన్ని తప్పనిసరి చేయదు.
- source_word: λόγῳ
  choice: మాటలో
  rationale: ఇక్కడ λόγος మాట్లాడే సామర్థ్యాన్ని లేదా వ్యక్తీకరణను సూచించే అవకాశం ఉంది. ‘మాటలో’ సాధారణ పాఠకులకు సహజంగా ఉండి, అర్థాన్ని అతిగా కుదించదు.
- source_word: γνώσει
  choice: జ్ఞానంలో
  rationale: మూలపదానికి నేరుగా సరిపోయే, ఈ లక్షణాల జాబితాకు అనుకూలమైన సాధారణ పదం.
- source_word: πάσῃ σπουδῇ
  choice: సంపూర్ణ శ్రద్ధలో
  rationale: σπουδή లోని ఆసక్తి, గంభీరత, కృషి భావాలను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: మీలో ఉన్న మా ప్రేమలో
  rationale: SBLGNT స్వీకరించిన పాఠంలోని ‘మా నుండి’ మరియు ‘మీలో’ అనే సంబంధాన్ని సహజమైన తెలుగులో సాధ్యమైనంతవరకు నిలుపుతుంది. వాక్యభాగంలోని పాఠాంతర, వాక్యనిర్మాణ అనిశ్చితిని పాదటిప్పణిలో తెలియజేస్తుంది.
- source_word: χάριτι
  choice: కృపలో
  rationale: ఈ సందర్భంలో పరిశుద్ధుల కొరకు ఇచ్చే దాతృత్వ కార్యాన్ని సూచించినప్పటికీ, పౌలు ఉపయోగించిన χάρις పదంలోని దైవకృప సంబంధమైన లోతును ప్రధాన పాఠంలో నిలుపుతుంది.
theological_decisions:
- issue: యెరూషలేము సహాయసేకరణ సందర్భంలో χάρις అర్థం
  choice: ప్రధాన పాఠంలో ‘కృప’ అని అనువదించి, అది దాతృత్వ కార్యాన్ని సూచిస్తుందని పాదటిప్పణిలో వివరించడం.
  alternative: కృపాకార్యం; దానం; ఉదార కార్యం
  rationale: ఇది కేవలం ఆర్థిక కానుకకు వాడిన పదం కాదు; పౌలు దాతృత్వాన్ని కృపతో అనుసంధానిస్తున్నాడు. ‘కృప’ ఆ ధార్మిక లోతును నిలుపుతుంది.
- issue: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ యొక్క వివరణ
  choice: ‘మీలో ఉన్న మా ప్రేమలో’ అని ప్రధాన పాఠంలో ఉంచడం.
  alternative: మాపట్ల మీ ప్రేమలో
  rationale: స్వీకరించిన గ్రీకు పాఠాన్ని అనుసరిస్తూనే, వాక్యభాగాన్ని ఒకే అర్థానికి అతిగా పరిమితం చేయకుండా పాఠాంతరాన్ని పాదటిప్పణిలో నమోదు చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి ఉపయోగించబడింది. జాబితా నిర్మాణాన్ని స్పష్టంగా చూపడానికి దీర్ఘవిరామాలు వాడబడ్డాయి; మూలంలోని సమృద్ధి భావచిత్రం రెండు చోట్లా నిలుపబడింది.
