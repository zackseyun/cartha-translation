revisions:
- from: అయితే, మీరు ప్రతి విషయంలో—విశ్వాసంలో, మాటలో, జ్ఞానంలో, సంపూర్ణ శ్రద్ధలో, మీలో ఉన్న మా ప్రేమలో—సమృద్ధిగా ఉన్నట్లే, ఈ కృపలో కూడా సమృద్ధిగా ఉండేలా చూసుకోండి.[a][b]
  to: అయితే, మీరు ప్రతి విషయంలో—విశ్వాసంలో, మాటలో, జ్ఞానంలో, సంపూర్ణ శ్రద్ధలో, మా నుండి మీలో ఉన్న ప్రేమలో—సమృద్ధిగా ఉన్నట్లే, ఈ కృపలో కూడా సమృద్ధిగా ఉండేలా చూసుకోండి.[a][b]
  rationale: The revision changes only the disputed love phrase, restoring the explicit ‘మా నుండి’ required by ἐξ ἡμῶν while retaining ‘మీలో’ for ἐν ὑμῖν. This preserves the Greek wording and its difficulty rather than selecting a smoother, more interpretive sense. The existing footnotes remain structurally valid and adequately document the alternative reading and the contextual sense of ‘కృప.’
