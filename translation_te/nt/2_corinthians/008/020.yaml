  yaml_path: translation/nt/2_corinthians/008/020.yaml
  text: taking this precaution, so that no one may blame us in regard to this generous gift being administered by us,
translation:
  language: te
  text: 'ఈ జాగ్రత్త తీసుకుంటున్నాం: మేము నిర్వహిస్తున్న ఈ ఉదారమైన కానుక[a] విషయంలో ఎవరూ మమ్మల్ని నిందించకుండా ఉండేలా.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఈ సమృద్ధి” లేదా “ఈ విస్తారమైన విరాళం.” గ్రీకు పదం ఉదారమైన లేదా సమృద్ధిగా సమకూరిన సహాయాన్ని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “మేము నిర్వహిస్తున్న ఈ ఉదారమైన కానుక విషయంలో ఎవరైనా మమ్మల్ని తప్పుపట్టకుండా ఉండేందుకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενοι τοῦτο
  choice: ఈ విషయంలో మేము ముందు జాగ్రత్త తీసుకుంటున్నాం
  rationale: మధ్యమ ప్రయోగంలోని στελλόμενοι ఇక్కడ సంభవించగల నిందను నివారించడానికి జాగ్రత్త చర్యలు తీసుకోవడాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ఈ నివారణ భావాన్ని ‘ముందు జాగ్రత్త తీసుకుంటున్నాం’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: ఎవరూ మమ్మల్ని నిందించకుండా ఉండాలని
  rationale: μή + సంభావనార్థక క్రియారూపం నివారణ ఉద్దేశాన్ని తెలియజేస్తుంది; μωμάομαι అంటే నిందించడం లేదా తప్పుపట్టడం. ఈ అనువాదం ఆర్థిక నిర్వహణలో జవాబుదారీతనాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἐν τῇ ἁδρότητι ταύτῃ
  choice: ఈ ఉదారమైన కానుక విషయంలో
  rationale: ἁδρότης సమృద్ధి, ఔదార్యం లేదా విస్తారమైన విరాళాన్ని సూచించగలదు. సేకరించిన సహాయధనం సందర్భంలో ‘ఉదారమైన కానుక’ దాని పరిమాణం, దాతృత్వ స్వభావం రెండింటినీ తెలియజేస్తుంది.
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: మేము నిర్వహిస్తున్న
  rationale: ఆర్థిక సహాయ సేకరణ సందర్భంలో διακονέω సేవగా బాధ్యత వహించి నిర్వహించడాన్ని సూచిస్తుంది. ‘నిర్వహిస్తున్న’ అనేది అసహజమైన మతపర పదజాలం లేకుండా కార్యనిర్వహణ భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: సహాయధన నిర్వహణలో పౌలు చూపిన శ్రద్ధ స్వభావం
  choice: ఆర్థిక సహాయాన్ని నిర్వహించే విషయంలో నిందకు తావులేకుండా ముందస్తు జాగ్రత్త తీసుకోవడాన్ని స్పష్టంగా చూపించడం
  alternative: దీనిని కేవలం ప్రయాణ ఏర్పాట్లకు సంబంధించిన సాధారణ జాగ్రత్తగా బలహీనంగా వ్యక్తం చేయడం
  rationale: గ్రీకు వాక్యం పౌలు మరియు అతని సహచరులు ఈ విస్తారమైన విరాళం విషయంలో తప్పుపట్టబడకుండా నివారించడంపైనే కేంద్రీకృతమై ఉంది. అందువల్ల అదనపు సిద్ధాంత భావాలను చేర్చకుండా ఆచరణాత్మక జవాబుదారీతనాన్ని నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ముందు జాగ్రత్త’, ‘నిర్వహిస్తున్న’ అనే సాధారణ పదాలు గ్రీకు వాక్యంలోని నివారణ మరియు బాధ్యతాయుత నిర్వహణ భావాలను స్పష్టంగా తెలియజేస్తాయి. ప్రధాన పాఠ్యంలో రెండు పాదసూచిక గుర్తులూ చేర్చబడ్డాయి.
