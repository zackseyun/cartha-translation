id: EPH.2.10
reference: Ephesians 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτοῦ γάρ ἐσμεν ποίημα, κτισθέντες ἐν Χριστῷ Ἰησοῦ ἐπὶ ἔργοις ἀγαθοῖς οἷς προητοίμασεν ὁ θεὸς ἵνα ἐν αὐτοῖς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/010.yaml
  text: For we are his workmanship[a], created in Messiah Jesus for good works[b], which God prepared beforehand so that we might walk in them.
translation:
  language: te
  text: ఎందుకంటే మనం ఆయన చేతిపని; మంచి కార్యాల కోసం మెస్సీయ యేసులో[a] సృష్టించబడ్డాం. మనం వాటిలో నడుచుకునేలా[b] దేవుడు వాటిని ముందుగానే సిద్ధం చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు Χριστός (క్రిస్టోస్) అనే బిరుదుకు ‘మెస్సీయ’ లేదా ‘అభిషిక్తుడు’ అని అర్థం. ఈ మాటను సంప్రదాయంగా ‘క్రీస్తు యేసులో’ అని కూడా అనువదిస్తారు.
    reason: alternative_reading
  - marker: b
    text: ‘వాటిలో నడుచుకోవడం’ అంటే ఆ మంచి కార్యాలను జీవన విధానంగా ఆచరిస్తూ ఉండడం.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοῦ … ποίημα
  choice: ఆయన చేతిపని
  rationale: ποίημα దేవుడు చేసిన సృష్టి లేదా పనిని సూచిస్తుంది. ‘చేతిపని’ అనే పదం దేవునిచేత రూపొందించబడినవారమనే స్పష్టమైన భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; αὐτοῦను ‘ఆయన’గా ఉంచడం ద్వారా ముందున్న సందర్భంలోని దేవుని సూచనను కాపాడుతుంది.
- source_word: κτισθέντες
  choice: సృష్టించబడ్డాం
  rationale: κτίζω యొక్క భూతకాల నిష్క్రియార్థక భాగరూపాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘ఆయన చేతిపని’ అనే ముందరి వాక్యభాగంతో సహజంగా అనుసంధానమవుతుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: Χριστός ఇక్కడ యేసు యొక్క బిరుదుగా ఉన్న భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది; ἐν యొక్క ఐక్యత లేదా సంబంధ పరిధిని ‘లో’ నేరుగా వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ ἔργοις ἀγαθοῖς
  choice: మంచి కార్యాల కోసం
  rationale: ἐπί + చతుర్థీ ఇక్కడ ఉద్దేశాన్ని సూచిస్తుంది. ‘మంచి కార్యాలు’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, నైతిక క్రియల భావాన్ని అతిగా సిద్ధాంతీకరించకుండా కాపాడుతుంది.
- source_word: προητοίμασεν
  choice: ముందుగానే సిద్ధం చేశాడు
  rationale: προ- ఉపసర్గలోని ముందస్తు కాలభావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἵνα ἐν αὐτοῖς περιπατήσωμεν
  choice: మనం వాటిలో నడుచుకునేలా
  rationale: ἵνα యొక్క ఉద్దేశార్థాన్ని ‘లా’ తెలియజేస్తుంది. περιπατέωలోని పౌలు వాడే ‘నడుచుకోవడం’ రూపకాన్ని నిలిపి, ‘వాటిలో’ అనే పదంతో మంచి కార్యాలను జీవన పరిధిగా చూపిస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యాలతో ఉన్న వివరణాత్మక సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Χριστῷను బిరుదుగా అనువదించాలా, సంప్రదాయ నామరూపంగా ఉంచాలా
  choice: మెస్సీయ యేసులో
  alternative: క్రీస్తు యేసులో
  rationale: Χριστός యొక్క ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు భావాన్ని అనువాదంలో ప్రత్యక్షంగా కాపాడుతుంది; సంప్రదాయ రూపాన్ని పాదసూచికలో అందిస్తుంది.
- issue: దేవుని ముందస్తు సిద్ధతకు విశ్వాసుల ప్రవర్తనకు మధ్య సంబంధం
  choice: దేవుడు వాటిని ముందుగానే సిద్ధం చేశాడు; మనం వాటిలో నడుచుకునేలా
  alternative: మనం వాటిని చేయాలని దేవుడు ముందుగానే సిద్ధం చేశాడు
  rationale: మూలపాఠంలోని దేవుని ముందస్తు చర్యనూ, మనుషులు ఆ కార్యాల్లో నడవాలనే ఉద్దేశాన్నీ రెండింటినీ నిలుపుతుంది; ముందస్తు నిర్ణయం లేదా మానవ సహకారం గురించిన విస్తృత సిద్ధాంత వివాదాన్ని పాఠంలోకి చేర్చదు.
- issue: περιπατέω రూపకాన్ని నిలపాలా, దాని భావాన్ని మాత్రమే చెప్పాలా
  choice: వాటిలో నడుచుకునేలా
  alternative: వాటిని ఆచరిస్తూ జీవించేలా
  rationale: పౌలు వాడే నడక-జీవితం రూపకాన్ని కాపాడుతూ, దాని నైతిక జీవనార్థాన్ని పాదసూచికలో స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా ‘మనం’, ‘చేతిపని’, ‘మంచి కార్యాలు’ వంటి పదాలు వాడబడ్డాయి. వాక్యానికి గౌరవప్రదమైన బైబిలు ధోరణి ఉండేలా చూసి, అతిగా సంస్కృతీకృతమైన ‘సత్క్రియలు’ వంటి పదాలను నివారించాం. మూలంలోని రూపకాన్ని ప్రధాన పాఠంలో ఉంచి పాదసూచికలో దాని భావాన్ని వివరించాం.
