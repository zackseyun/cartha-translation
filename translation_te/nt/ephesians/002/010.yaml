  source_fidelity: 'The Telugu accurately represents all major Greek elements: γάρ as an explanatory connector, αὐτοῦ ποίημα as “ఆయన చేతిపని,” the passive κτισθέντες, ἐν Χριστῷ Ἰησοῦ as “మెస్సీయ యేసులో,” purpose for good works, God’s prior preparation, and the purpose that believers “walk in” those works. The two Telugu sentences retain the Greek logical sequence and do not add doctrinal conclusions.'
