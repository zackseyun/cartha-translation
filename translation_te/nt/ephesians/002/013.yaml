source:
  edition: SBLGNT
  text: νυνὶ δὲ ἐν Χριστῷ Ἰησοῦ ὑμεῖς οἵ ποτε ὄντες μακρὰν ⸂ἐγενήθητε ἐγγὺς⸃ ἐν τῷ αἵματι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/013.yaml
  text: But now in Messiah Jesus[d][c][b][a], you who once were far away have become near by the blood of the Messiah.
translation:
  language: te
  text: కానీ ఇప్పుడు మెస్సీయ యేసులో[d], ఒకప్పుడు దూరంగా[a] ఉన్న మీరు మెస్సీయ రక్తం ద్వారా[c] దగ్గరయ్యారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దూరంలో.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా ‘దగ్గర అయ్యారు’; లేదా ‘దగ్గరకు తీసుకురాబడ్డారు.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘మెస్సీయ రక్తంలో.’
    reason: lexical_alternative
  - marker: d
    text: గ్రీకు పదం ‘క్రిస్టోస్’; అది ఇక్కడ బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: అయితే ఇప్పుడు
  rationale: δέ సూచించే వ్యతిరేక మలుపును, νυνί సూచించే ప్రస్తుతకాల ప్రాధాన్యాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: ἐν అనే పదాన్ని పౌలు వాడే ఐక్యత/పరిధి భావంతో ‘లో’గా నిలుపుతుంది; Χριστόςను ఇక్కడ బిరుదుగా ‘మెస్సీయ’ అని అనువదిస్తుంది.
- source_word: ὑμεῖς οἵ ποτε ὄντες
  choice: ఒకప్పుడు ... ఉన్న మీరు
  rationale: గత స్థితిని సూచించే ποτε మరియు ὄντες భావాన్ని తెలుగులో సహజమైన సంబంధ వాక్య నిర్మాణంతో అందిస్తుంది.
- source_word: μακρὰν
  choice: దూరంగా
  rationale: స్థానిక దూరంతో పాటు సందర్భంలోని సంబంధపరమైన, నిబంధనపరమైన దూరాన్నీ అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: ἐγενήθητε ἐγγὺς
  choice: దగ్గరయ్యారు
  rationale: γίνομαι యొక్క ‘అవడం/కావడం’ భావాన్ని నేరుగా వ్యక్తం చేస్తూ, మూలంలో స్పష్టంగా చెప్పని కార్యసాధకుణ్ణి చేర్చదు.
- source_word: ἐν τῷ αἵματι
  choice: రక్తం ద్వారా
  rationale: ἐνకు ఇక్కడ సాధనార్థక భావం ఉండే అవకాశాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘రక్తంలో’ అనే పరిధి భావం ప్రత్యామ్నాయంగా సాధ్యమే.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని అనువదిస్తుంది; తెలుగు విభక్తి నిర్మాణంలో ‘మెస్సీయ రక్తం’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: Χριστός పదాన్ని ఎలా అందించాలి
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός పేరు కంటే బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని బిరుదు భావాన్ని అనువదించడం సముచితం.
- issue: ἐγενήθητε ἐγγὺςలో క్రియ యొక్క భావం
  choice: దగ్గరయ్యారు
  alternative: దగ్గరకు తీసుకురాబడ్డారు
  rationale: మూలంలోని ‘దగ్గర కావడం’ అనే మార్పును నిలుపుతూ, వ్యాకరణంలో స్పష్టంగా పేర్కొనని దైవ కార్యసాధకత్వాన్ని తెలుగు అనువాదంలో బలవంతంగా చేర్చదు.
- issue: ἐν τῷ αἵματι τοῦ Χριστοῦ యొక్క బలం
  choice: మెస్సీయ రక్తం ద్వారా
  alternative: మెస్సీయ రక్తంలో
  rationale: సందర్భంలో ఇది దగ్గర కావడానికి సాధనాన్ని సూచించే అవకాశం బలంగా ఉంది. అయినా ‘రక్తంలో’ అనే పరిధి/స్థితి భావం వ్యాకరణపరంగా సాధ్యమని పాదసూచనలో నిలుపబడింది; ప్రత్యేక ప్రాయశ్చిత్త సిద్ధాంతాన్ని పాఠ్యంలోకి చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘మెస్సీయ యేసులో’ అనే నిర్మాణం పౌలు వాడే ‘లో’ భాషను నిలుపుతుంది. ‘దగ్గరయ్యారు’ సహజమైన తెలుగు రూపం; మూలంలోని ఫలిత స్థితిని, కార్యసాధకుడి విషయంలోని స్వల్ప అస్పష్టతను కాపాడుతుంది.
