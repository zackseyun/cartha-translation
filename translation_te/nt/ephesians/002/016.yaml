id: EPH.2.16
reference: Ephesians 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἀποκαταλλάξῃ τοὺς ἀμφοτέρους ἐν ἑνὶ σώματι τῷ θεῷ διὰ τοῦ σταυροῦ ἀποκτείνας τὴν ἔχθραν ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/016.yaml
  text: and might reconcile both to God in one body through the cross, having put the hostility to death by it.
translation:
  language: te
  text: సిలువ ద్వారా, దానిలో శత్రుత్వాన్ని చంపివేసి, ఇరువురినీ ఒకే శరీరంలో దేవునితో సమాధానపరచాలని.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκαταλλάξῃ
  choice: సమాధానపరచాలని
  rationale: దెబ్బతిన్న సంబంధాన్ని తిరిగి సరిచేసి దేవునితో సమాధానం కలిగించడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τοὺς ἀμφοτέρους
  choice: ఆ ఇద్దరినీ
  rationale: ముందటి సందర్భంలో పేర్కొన్న యూదులు, అన్యజనులు అనే రెండు వర్గాలను సూచించే గ్రీకు పదబంధాన్ని స్పష్టంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐν ἑνὶ σώματι
  choice: ఒకే శరీరంలో
  rationale: ఐక్యతను నొక్కిచెప్పే ἑνί భావాన్ని ‘ఒకే’గా, σώμα అనే రూపకాన్ని వ్యాఖ్యానించకుండా ‘శరీరం’గా నిలుపుతుంది.
- source_word: διὰ τοῦ σταυροῦ
  choice: సిలువ ద్వారా
  rationale: διά + genitive యొక్క సాధనార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ἀποκτείνας τὴν ἔχθραν
  choice: శత్రుత్వాన్ని చంపివేశాడు
  rationale: మూలంలోని బలమైన మరణ రూపకాన్ని మృదుపరచకుండా తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἐν αὐτῷ
  choice: దాని ద్వారానే
  rationale: αὐτῷను సమీప పూర్వపదమైన ‘సిలువ’కు అన్వయించి, శత్రుత్వం సిలువ ద్వారా చంపబడిందనే సాధనార్థ పఠనాన్ని వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ‘ఒకే శరీరం’ యొక్క అర్థం
  choice: రూపకాన్ని ‘ఒకే శరీరంలో’ అని యథాతథంగా నిలుపడం
  alternative: ‘ఒకే సమాజంగా’ లేదా ‘క్రీస్తు శరీరంలో’ అని వివరణాత్మకంగా అనువదించడం
  rationale: గ్రీకు వాక్యం ‘శరీరం’ అనే రూపకాన్నే ఇస్తుంది; అది క్రీస్తు శరీరమా, కొత్త మానవ సమూహమా అనే వివరణను అనువాదంలో ముందుగానే నిర్ణయించలేదు.
- issue: ἐν αὐτῷ యొక్క సూచన మరియు భావం
  choice: ‘దాని ద్వారానే’—సిలువను సూచించే సాధనార్థ పఠనం
  alternative: ‘దానిలో’ లేదా ‘తనలో’
  rationale: వ్యాకరణపరంగా సమీపంలోని σταυρός పురుషలింగ పదంతో αὐτῷ సరిపోతుంది; సందర్భం సిలువనే శత్రుత్వాన్ని అంతం చేసిన సాధనంగా చూపుతుంది. అయితే గ్రీకు ἐν రూపం స్థానార్థ/సంబంధార్థ ఛాయను కూడా అనుమతిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన వాక్యనిర్మాణం. ముందటి వాక్యంపై ఆధారపడే ఉద్దేశార్థ నిర్మాణాన్ని ‘సమాధానపరచాలని’ ద్వారా నిలిపి, మూలంలోని రూపకాలు మరియు ఉద్రేకాన్ని కాపాడింది.
