reference: Ephesians 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν αἷς ποτε περιεπατήσατε κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου, κατὰ τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος, τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος ἐν τοῖς υἱοῖς τῆς ἀπειθείας·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/002.yaml
  text: in which you once walked[a], according to the age of this world, according to the ruler of the authority of the air[c][b], the spirit now at work in the sons of disobedience.
translation:
  language: te
  text: వాటిలో మీరు ఒకప్పుడు నడుచుకున్నారు[a]; ఈ లోకపు యుగానికి[b] అనుగుణంగా, వాయుమండల అధికారాధిపతిని అనుసరించి[c] నడుచుకున్నారు—అంటే, ఇప్పుడు అవిధేయత కుమారులలో[d] పనిచేస్తున్న ఆత్మను అనుసరించి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ ‘నడుచుకున్నారు’ అంటే ‘అలా జీవించారు’ లేదా ‘ఆ విధంగా ప్రవర్తించారు’ అని అర్థం.
    reason: రూపకార్థ వివరణ
  - marker: b
    text: లేదా ‘ఈ లోకపు పోకడకు.’ గ్రీకులో ‘యుగం’ (αἰών) అనే పదం ఉంది; అది ప్రస్తుత లోకపు కాలాన్ని లేదా దాని ఆధిపత్య ధోరణిని సూచించగలదు.
    reason: పదార్థ ప్రత్యామ్నాయం
  - marker: c
    text: ‘వాయుమండలం’ అనేది శత్రుత్వ ఆత్మిక శక్తులతో సంబంధం ఉన్న ప్రదేశాన్ని సూచించే ప్రాచీన విశ్వదృక్పథ భాషను ప్రతిబింబిస్తుంది.
    reason: సాంస్కృతిక నేపథ్యం
  - marker: d
    text: ‘అవిధేయత కుమారులు’ అంటే అవిధేయత లక్షణంగా ఉన్న మనుషులు. ‘అవిధేయత పిల్లలు’ అని కూడా అనువదించవచ్చు.
    reason: సెమిటిక్ నుడికారం మరియు పదార్థ ప్రత్యామ్నాయం
lexical_decisions:
- source_word: ἐν αἷς
  choice: వాటిలో
  rationale: ఈ సంబంధవాచక రూపం మునుపటి వచనంలోని ‘అపరాధాలు, పాపాలు’ అనే స్త్రీలింగ బహువచన పదాలను తిరిగి సూచిస్తుంది.
- source_word: ποτε περιεπατήσατε
  choice: మీరు ఒకప్పుడు నడుచుకున్నారు
  rationale: ποτε గతకాల జీవనాన్ని సూచిస్తుంది; περιπατέωలోని పౌలు వాడే ‘జీవన విధానంగా నడవడం’ అనే రూపకాన్ని నిలుపుతుంది.
- source_word: κατὰ τὸν αἰῶνα τοῦ κόσμου τούτου
  choice: ఈ లోకపు యుగానికి అనుగుణంగా
  rationale: αἰώνను ‘యుగం’గా, κόσμοςను ‘లోకం’గా వేరుగా ఉంచి, κατά సూచించే అనుసరణ లేదా సరిపోలిక భావాన్ని ‘అనుగుణంగా’ తెలియజేస్తుంది.
- source_word: τὸν ἄρχοντα τῆς ἐξουσίας τοῦ ἀέρος
  choice: వాయుమండల అధికారానికి అధిపతి
  rationale: ἄρχωνను ఆధునికంగా ‘అధిపతి’ అని, ἐξουσίαను ‘అధికారం’ అని అనువదిస్తుంది. ἀήρకు ‘వాయుమండలం’ సహజమైన తెలుగు రూపం; ప్రాచీన విశ్వదృక్పథాన్ని ప్రధాన వాక్యంలో విపులీకరించకుండా ఉంచుతుంది.
- source_word: τοῦ πνεύματος τοῦ νῦν ἐνεργοῦντος
  choice: ఇప్పుడు పనిచేస్తున్న ఆత్మ
  rationale: వర్తమాన కర్తరి కృదంతం నిరంతర ప్రస్తుత క్రియను తెలియజేస్తుంది. సందర్భం పరిశుద్ధాత్మను కాక శత్రుత్వ ఆత్మిక ప్రభావాన్ని సూచిస్తున్నందున ‘ఆత్మ’ను సాధారణ రూపంలో ఉంచింది.
- source_word: ἐν τοῖς υἱοῖς τῆς ἀπειθείας
  choice: అవిధేయత కుమారులలో
  rationale: మూలంలోని సెమిటిక్ శైలిగల ‘అవిధేయత కుమారులు’ అనే వ్యక్తిత్వ-లక్షణ ప్రయోగాన్ని నిలుపుతుంది; దాని భావాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: ‘ఇప్పుడు పనిచేస్తున్న ఆత్మ’కు ‘వాయుమండల అధికారానికి అధిపతి’తో ఉన్న సంబంధం
  choice: డాష్ తరువాత ‘అంటే’తో వివరణాత్మక సమానాధికార సంబంధాన్ని సూచించడం
  alternative: దీనిని అధిపతికి భిన్నమైన, అతని కింద పనిచేసే ప్రత్యేక ఆత్మిక శక్తిగా స్పష్టంగా చూపడం
  rationale: గ్రీకు నిర్దిష్ట ఉపపదాలతో కూడిన షష్ఠీవిభక్తి పదబంధం వివరణాత్మక సంబంధాన్ని అనుమతిస్తుంది. ‘అంటే’ సంబంధాన్ని స్పష్టం చేసినా, ఆ ఆత్మ అధిపతియేనా లేక అతనితో ముడిపడిన శక్తినా అన్న అస్తిత్వ సంబంధమైన ప్రశ్నను తుదిగా పరిష్కరించదు.
- issue: υἱοῖς అనే పురుషలింగ రూపం
  choice: అవిధేయత కుమారులు
  alternative: అవిధేయత పిల్లలు; అవిధేయులైనవారు
  rationale: మూలంలోని పురుషలింగ, సెమిటిక్ శైలి పదబంధాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది అవిధేయత లక్షణంగల మనుషులను సూచిస్తుందని పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పౌలు వాడిన ‘నడవడం’ రూపకాన్ని నిలుపుతూ, దీర్ఘమైన గ్రీకు వాక్య నిర్మాణాన్ని తెలుగులో చదవడానికి అనువుగా రెండు వాక్యాలుగా విభజించింది. ‘అనుగుణంగా’ అనే పునరుక్తి మూలంలోని మూడు κατὰ/సంబంధిత నిర్మాణాల తార్కిక అనుసంధానాన్ని స్పష్టంగా ఉంచుతుంది.
