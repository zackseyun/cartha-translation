- from: వాటిలో మీరు ఒకప్పుడు నడుచుకున్నారు[a]. మీరు ఈ లోకపు యుగానికి[b] అనుగుణంగా, వాయుమండల అధికారానికి అధిపతికి[c] అనుగుణంగా నడుచుకున్నారు—అంటే, అవిధేయత కుమారులలో[d] ఇప్పుడు పనిచేస్తున్న ఆత్మకు అనుగుణంగా నడుచుకున్నారు.
  to: వాటిలో మీరు ఒకప్పుడు నడుచుకున్నారు[a]; ఈ లోకపు యుగానికి[b] అనుగుణంగా, వాయుమండల అధికారాధిపతిని అనుసరించి[c] నడుచుకున్నారు—అంటే, ఇప్పుడు అవిధేయత కుమారులలో[d] పనిచేస్తున్న ఆత్మను అనుసరించి.
  rationale: The revision removes the source-unwarranted third “according to” construction and recasts the final phrase as an explanatory restatement of the ruler phrase. This retains the Greek’s appositional connection while not deciding beyond the text whether “the spirit” is simply another designation for the ruler or a closely associated spiritual power. All existing footnote anchors remain present and correctly attached.
