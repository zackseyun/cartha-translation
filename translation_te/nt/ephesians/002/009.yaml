    text: 'లేదా, ‘క్రియల మూలంగా కాదు.’ గ్రీకు పదబంధం మూలాన్ని లేదా ఉద్భవాన్ని సూచిస్తుంది; కొందరు దానిలో సాధనార్థాన్ని కూడా గ్రహిస్తారు: ‘క్రియలచేత కాదు.’ అయితే అక్షరార్థానికి దగ్గరగా ‘క్రియల నుండి కాదు’ అని ఉంటుంది.'
