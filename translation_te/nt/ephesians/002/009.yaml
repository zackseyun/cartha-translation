lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: క్రియల నుండి కాదు
  rationale: ἐξ ప్రధానంగా మూలం లేదా ఉద్భవాన్ని సూచిస్తుంది; అందువల్ల ‘నుండి’ గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో నిలుపుతుంది. ἔργων ను సందర్భంలో లేని ‘ధర్మశాస్త్ర క్రియలు’ లేదా ‘మంచి పనులు’గా పరిమితం చేయకుండా ‘క్రియలు’గా ఉంచాం.
- source_word: ἵνα μή τις
  choice: అందువల్ల ఎవరూ ... కూడదు
  rationale: ఇది ప్రతికూల ఉద్దేశం లేదా ఫలితాన్ని తెలియజేస్తుంది. ‘అందువల్ల’ ముందున్న నిరాకరణతో సంబంధాన్ని సహజంగా చూపుతుంది; ‘ఎవరూ’ τις యొక్క అనిర్దిష్ట, లింగనిరపేక్ష భావాన్ని అందిస్తుంది.
- source_word: καυχήσηται
  choice: గొప్ప చెప్పుకోకూడదు
  rationale: καυχάομαι యొక్క boasting భావాన్ని సాధారణ ఆధునిక తెలుగులో నేరుగా వ్యక్తం చేస్తుంది; కేవలం ‘గర్వించు’ అని అనువదించడం కంటే తనకే ఘనత ఆపాదించుకునే భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ‘క్రియలు’ అనే పదబంధం యొక్క పరిధి
  choice: మూలంలో ఉన్న విస్తృతమైన ‘క్రియలు’ అనే పదాన్నే నిలుపడం
  alternative: ‘ధర్మశాస్త్ర క్రియలు,’ ‘మానవ ప్రయత్నం,’ లేదా ‘మంచి పనులు’ అని నిర్దిష్టీకరించడం
  rationale: గ్రీకు పాఠంలో ἔργων మాత్రమే ఉంది. దాని పరిధిని అనువాదంలోనే కుదించడం లేదా విస్తరించడం వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చుతుంది.
- issue: ἵνα ఉపవాక్యం ఉద్దేశమా లేక ఫలితమా
  choice: ‘అందువల్ల’ ద్వారా ఉద్దేశం/ఫలితం రెండింటికీ వీలున్న సంబంధాన్ని సహజంగా ఉంచడం
  alternative: ‘ఎవరూ గొప్ప చెప్పుకోకుండా ఉండటానికి’ అని ఖచ్చితంగా ఉద్దేశార్థంగా నిర్ధారించడం
  rationale: ἵνα సాధారణంగా ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. తెలుగు పాఠ్యం ఈ సూక్ష్మ అనిశ్చితిని అనవసరంగా పరిష్కరించకూడదు.
