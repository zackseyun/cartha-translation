id: EPH.2.4
reference: Ephesians 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πλούσιος ὢν ἐν ἐλέει, διὰ τὴν πολλὴν ἀγάπην αὐτοῦ ἣν ἠγάπησεν ἡμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/004.yaml
  text: But God[a], being rich in mercy, because of his great love with which he loved us,
translation:
  language: te
  text: అయితే దేవుడు కనికరం సమృద్ధిగా గలవాడై[a], మనలను ప్రేమించిన తన గొప్ప ప్రేమనుబట్టి,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “కనికరంలో ధనవంతుడై ఉండి.”
    reason: గ్రీకు πλούσιος ὢν ἐν ἐλέει అనే నుడికారపు అక్షరార్థ రూపాన్ని తెలియజేయడం.
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనాల్లోని మానవుల దుస్థితికి దేవుని కార్యాన్ని విరుద్ధంగా నిలబెట్టే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πλούσιος ὢν ἐν ἐλέει
  choice: కనికరం సమృద్ధిగా గలవాడై
  rationale: ‘కనికరంలో ధనవంతుడై ఉండి’ అనే గ్రీకు నుడికారంలోని సమృద్ధి భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: διὰ τὴν πολλὴν ἀγάπην αὐτοῦ
  choice: తన గొప్ప ప్రేమనుబట్టి
  rationale: διά + accusative సూచించే కారణ భావాన్ని ‘నుబట్టి’ స్పష్టంగా తెలియజేస్తుంది; πολλήν యొక్క తీవ్రతను ‘గొప్ప’ నిలుపుతుంది.
- source_word: ἣν ἠγάπησεν ἡμᾶς
  choice: మనలను ప్రేమించిన
  rationale: ἀγάπην ... ἠγάπησεν లోని ‘ప్రేమ ... ప్రేమించిన’ అనే ఒకే మూలపద పునరుక్తిని కాపాడుతుంది.
theological_decisions:
- issue: ‘ప్రేమ ... ప్రేమించిన’ అనే సమానమూల పదప్రయోగాన్ని నిలుపడం
  choice: మనలను ప్రేమించిన తన గొప్ప ప్రేమ
  alternative: మనపట్ల తనకున్న గొప్ప ప్రేమ
  rationale: గ్రీకు మూలంలోని ἀγάπην ... ἠγάπησεν అనే ఉద్దేశపూర్వక పునరుక్తిని నిలిపి, దాని ఉద్ఘాటనను వ్యాఖ్యానంతో సున్నితపరచకుండా ఉంచుతుంది.
- issue: కనికరం, ప్రేమల పరస్పర సంబంధం
  choice: కనికరం సమృద్ధిగా గలవాడై ... తన గొప్ప ప్రేమనుబట్టి
  alternative: తన కనికరపూర్వకమైన గొప్ప ప్రేమనుబట్టి
  rationale: మూలంలో కనికరం, ప్రేమ వేర్వేరు అయినా సంబంధిత భావాలుగా ఉన్నాయి; వాటిని ఒకే భావంగా కలపకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే పౌలు వాక్య నిర్మాణంలోని కొనసాగింపు మరియు గంభీరత నిలిచేలా అనువదించబడింది.
