id: EPH.2.19
reference: Ephesians 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐκέτι ἐστὲ ξένοι καὶ πάροικοι, ἀλλὰ ⸀ἐστὲ συμπολῖται τῶν ἁγίων καὶ οἰκεῖοι τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/019.yaml
  text: So then[a], you are no longer strangers and resident foreigners, but you are fellow citizens with the saints and members of God's household[c][b],
translation:
  language: te
  text: అందుచేత మీరు ఇక పరదేశులూ, పౌరహక్కులు లేని విదేశీ నివాసులూ[a] కాదు; మీరు పరిశుద్ధులతో[b] పాటు సహపౌరులు[c], దేవుని ఇంటివారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విదేశీ నివాసులు’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం ఒక ప్రాంతంలో నివసిస్తున్నా పూర్తి పౌర హోదా లేనివారిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘పరిశుద్ధులు’ అంటే దేవునికి ప్రత్యేకించబడిన పవిత్ర ప్రజలు; ప్రత్యేకంగా అధికారిక గుర్తింపు పొందిన కొందరిని మాత్రమే సూచించడం లేదు.
    reason: cultural_note
  - marker: c
    text: 'అక్షరార్థంగా ‘పరిశుద్ధుల సహపౌరులు.’ భావం: వారు దేవుని పవిత్ర ప్రజలతో ఒకే పౌరసత్వాన్ని పంచుకుంటున్నారు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: అందుచేత
  rationale: ముందటి వాదన నుంచి వచ్చే బలమైన ముగింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὐκέτι
  choice: ఇక … కాదు
  rationale: వారి స్థితిలో వచ్చిన మార్పును సూచించే కాలార్థక నిరాకరణను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ξένοι
  choice: పరదేశులు
  rationale: చెందనివారు లేదా బయటి దేశానికి చెందినవారు అనే భావాన్ని, తరువాతి పౌరసత్వం మరియు ఇంటివారి రూపకాలతో ఉన్న వ్యత్యాసాన్ని నిలుపుతూ అందిస్తుంది.
- source_word: πάροικοι
  choice: పౌరహక్కులు లేని విదేశీ నివాసులు
  rationale: ఒక ప్రాంతంలో నివసిస్తున్నా పూర్తి పౌర హోదా లేనివారనే సామాజిక-న్యాయ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: συμπολῖται
  choice: సహపౌరులు
  rationale: కలిసి ఒకే పౌరసత్వాన్ని పంచుకోవడం అనే సమాసపద భావాన్ని సంక్షిప్తంగా, సరిగ్గా అందిస్తుంది.
- source_word: τῶν ἁγίων
  choice: పరిశుద్ధులతో పాటు
  rationale: దేవునికి ప్రత్యేకించబడిన ప్రజలతో కలిసి పౌరసత్వాన్ని పంచుకోవడమనే సందర్భోచిత భావాన్ని అందిస్తూ, వారి పరిధిని ప్రధాన వాక్యంలో సంకుచితం చేయదు.
- source_word: οἰκεῖοι τοῦ θεοῦ
  choice: దేవుని ఇంటివారు
  rationale: దేవుని గృహానికి చెందిన సభ్యులు అనే కుటుంబ రూపకాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: τῶν ἁγίων (‘పరిశుద్ధులు’) ఎవరిని సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో విస్తృతమైన ‘పరిశుద్ధులు’ అనే పదాన్నే ఉంచడం
  alternative: దీనిని దేవదూతలు, యూద విశ్వాసులు మాత్రమే, లేదా విశ్వాసులందరూ అని స్పష్టీకరించడం
  rationale: సందర్భం అన్యజనులు దేవుని ప్రజల్లో చేర్చబడటాన్ని వివరిస్తున్నా, గ్రీకు పదబంధం సూచించే వర్గాన్ని ప్రధాన పాఠ్యంలో మరింత సంకుచితం చేయదు; అందువల్ల అసలు పాఠ్యంలోని వ్యాఖ్యాన విస్తృతిని నిలుపుతుంది.
- issue: συμπολῖται τῶν ἁγίων లోని షష్ఠీ విభక్తి సంబంధం
  choice: ‘పరిశుద్ధులతో పాటు సహపౌరులు’ అని సహవాస భావంతో అనువదించడం
  alternative: ‘పరిశుద్ధుల సహపౌరులు’ అని మరింత అక్షరార్థంగా అనువదించడం
  rationale: రెండూ ఒకే పౌరసమూహంలో భాగస్వామ్యాన్ని సూచించగలవు. ‘తో పాటు’ ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ నిర్మాణాన్ని పాదసూచికలో ఉంచడం ద్వారా వ్యాకరణ రూపాన్ని దాచదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి. పౌరసత్వం మరియు కుటుంబం అనే రెండు రూపకాలను స్పష్టంగా నిలిపింది. ‘పౌరహక్కులు లేని’ అనే వివరణ πάροικοι పదంలోని హోదా-లేమి భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
