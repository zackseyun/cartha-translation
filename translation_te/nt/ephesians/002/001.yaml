id: EPH.2.1
reference: Ephesians 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ ὑμᾶς ὄντας νεκροὺς τοῖς παραπτώμασιν καὶ ταῖς ἁμαρτίαις ⸀ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/001.yaml
  text: And you were dead in your trespasses and sins,
translation:
  language: te
  text: మీ అపరాధాలలోను పాపాలలోను చనిపోయి ఉన్న మిమ్మల్నీ—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραπτώμασιν
  choice: అపరాధాలవల్ల
  rationale: παράπτωμα ఉల్లంఘన లేదా తప్పిదం అనే భావాన్ని ఇక్కడ ‘అపరాధం’ సహజంగా వ్యక్తపరుస్తుంది; దత్తివిభక్తి సందర్భంలో మరణస్థితికి కారణం లేదా పరిధిని సూచించేందుకు ‘వల్ల’ వాడబడింది.
- source_word: ἁμαρτίαις
  choice: పాపాలవల్ల
  rationale: ἁμαρτίαకు సాధారణమైన, స్పష్టమైన తెలుగు సమానార్థకం ‘పాపం’; παράπτωμαతో ఉన్న భేదాన్ని కూడా ఇది నిలుపుతుంది.
- source_word: νεκρούς
  choice: చనిపోయినవారిగా
  rationale: శారీరక మరణం కాక ఆత్మీయ/నైతిక మరణస్థితిని సందర్భమే తెలియజేయనివ్వడానికి మూలంలోని బలమైన ‘మృతులు’ భావాన్ని రూపకంగా కానీ సహజమైన తెలుగులో అందిస్తుంది.
- source_word: ὄντας
  choice: ఉన్న
  rationale: గ్రీకు వర్తమాన కృదంతమైన ‘being’ భావాన్ని నిలుపుతూ, వాక్యాన్ని తరువాతి ప్రధాన క్రియతో అనుసంధానించే అసంపూర్ణ నిర్మాణాన్ని కాపాడుతుంది.
- source_word: ὑμᾶς
  choice: మిమ్మల్ని
  rationale: ఇది కర్మవిభక్తి రూపం; తరువాత వచ్చే ప్రధాన క్రియకు కర్మగా ఉండే గ్రీకు వాక్యనిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘మృతులు’ అనే రూపక స్వభావం
  choice: ‘చనిపోయినవారిగా ఉన్న’ అని నేరుగా అనువదించడం
  alternative: ‘ఆత్మీయంగా చనిపోయి ఉన్న’ అని వివరణను చేర్చడం
  rationale: మూలపాఠంలో ‘ఆత్మీయంగా’ అనే విశేషణం లేదు. రూపకానికి సంబంధించిన తాత్త్విక అర్థాన్ని అనువాదంలో ముందుగానే నిర్ణయించకుండా సందర్భానికి వదిలివేయబడింది.
- issue: ఈ వచనంలోని అసంపూర్ణ వాక్యనిర్మాణం
  choice: ‘మిమ్మల్ని కూడా—’ అని తరువాతి వాక్యభాగానికి తెరిచి ఉంచడం
  alternative: ‘మీరు ... చనిపోయి ఉన్నారు’ అని స్వతంత్ర వాక్యంగా మార్చడం
  rationale: గ్రీకులో ὑμᾶς కర్మవిభక్తిలో ఉండి, ὄντας కృదంతంగా ఉంది; ప్రధాన క్రియ తరువాత వస్తుంది. అందువల్ల మూలంలోని వ్యాకరణ సంబంధం మరియు ఉద్దేశపూర్వక నిరీక్షణ నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గంభీరంగా రూపొందించబడింది. ‘అపరాధాలు’ మరియు ‘పాపాలు’ అనే రెండు మూలపదాల సమాంతరత నిలుపబడింది. చివరి దీర్ఘవిరామం ఈ వచనం తరువాతి వాక్యంతో వ్యాకరణపరంగా కొనసాగుతుందని సూచిస్తుంది.
