revisions:
- from: ఎందుకంటే, ఆయన ద్వారా మన ఉభయులకూ ఒకే ఆత్మలో తండ్రి సన్నిధికి ప్రవేశం ఉంది.[a][b][c]
  to: ఎందుకంటే, ఆయన ద్వారా మనిద్దరికీ ఒకే ఆత్మలో తండ్రి దగ్గరకు ప్రవేశం ఉంది.[a][b][c]
  rationale: The revision makes only safe idiomatic adjustments. ‘మనిద్దరికీ’ replaces the marked expression ‘మన ఉభయులకూ,’ while the surrounding context retains the reference to the two formerly separated groups. ‘తండ్రి దగ్గరకు’ is a natural Telugu expression of movement/access to the Father. The revised footnote avoids a passive formulation that could over-specify προσαγωγή.
