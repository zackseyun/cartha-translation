source:
  edition: SBLGNT
  text: ὅτι δι’ αὐτοῦ ἔχομεν τὴν προσαγωγὴν οἱ ἀμφότεροι ἐν ἑνὶ πνεύματι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/018.yaml
  text: For through him we both have access in one Spirit to the Father[a][b][c].
translation:
  language: te
  text: ఎందుకంటే, ఆయన ద్వారా మనిద్దరికీ ఒకే ఆత్మలో తండ్రి దగ్గరకు ప్రవేశం ఉంది.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఎందుకంటే’ అనే మాటను ‘కారణం ఏమిటంటే’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రవేశం’ అనే పదాన్ని ‘సమీపించే అవకాశం’ లేదా ‘సమీపం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘ఒకే ఆత్మలో’ అని ఉన్న చోట ‘ఒకే ఆత్మ ద్వారా’ అని కూడా అనువదించవచ్చు. ‘లో’ అనే అనువాదం గ్రీకు పదప్రయోగాన్ని నిలుపుతుంది; అది సాధనాన్ని గానీ, భాగస్వామ్య పరిధిని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలో చెప్పిన సమాధానానికి, ఐక్యతకు ఈ వాక్యం కారణాన్ని లేదా వివరణను ఇస్తోంది. ఆధునిక తెలుగులో ‘ఎందుకంటే’ ఈ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δι’ αὐτοῦ
  choice: ఆయన ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనం లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది. సందర్భంలో ఇది క్రీస్తును సూచిస్తూ, ఆయన ద్వారా తండ్రి దగ్గరకు ప్రవేశం కలుగుతుందని తెలియజేస్తుంది.
- source_word: ἔχομεν
  choice: మన ఉభయులకూ … ఉంది
  rationale: గ్రీకు వర్తమానకాలంలోని ఉమ్మడి వాస్తవాన్ని తెలుగులో సహజమైన అస్తిత్వ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: τὴν προσαγωγὴν
  choice: సన్నిధికి ప్రవేశం
  rationale: προσαγωγή ఉన్నత వ్యక్తి సమక్షంలోకి ప్రవేశం లేదా సమీపించే సౌలభ్యాన్ని సూచించగలదు. ‘ప్రవేశం’ మూలపదంలోని భావాన్ని సంక్షిప్తంగా నిలుపుతుంది; ‘సన్నిధికి’ అనేది తండ్రి వ్యక్తిగత సమక్షం వైపు ఉన్న దిశను సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: οἱ ἀμφότεροι
  choice: మన ఉభయులకూ
  rationale: ఇది ముందు ప్రస్తావించిన యూదులు, యూదేతరులు అనే రెండు వర్గాలను సూచిస్తుంది. ‘మన ఉభయులకూ’ గ్రీకులోని ప్రథమ పురుష సమైక్యతను, రెండు పక్షాల భావాన్ని నిలుపుతుంది.
- source_word: ἐν ἑνὶ πνεύματι
  choice: ఒకే ఆత్మలో
  rationale: ‘ఒకే’ అనేది రెండు వర్గాల ఉమ్మడి భాగస్వామ్యాన్ని నొక్కి చెబుతుంది. ‘లో’ గ్రీకు ἐν ను నిలుపుతూ సాధనం లేదా పరిధి అనే రెండింటి మధ్యనున్న భావసంభావ్యతను పూర్తిగా మూసివేయదు. సందర్భానుసారం ‘ఆత్మ’ పరిశుద్ధాత్మను సూచిస్తుంది.
- source_word: πρὸς τὸν πατέρα
  choice: తండ్రి సన్నిధికి
  rationale: πρός + ద్వితీయా విభక్తి తండ్రి వైపు, ఆయన సమక్షంలోకి వెళ్లే దిశను సూచిస్తుంది. ‘సన్నిధికి’ తెలుగులో ఆ వ్యక్తిగత సమక్ష భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: ‘ఒకే ఆత్మ’ ఎవరిని సూచిస్తుంది?
  choice: పరిశుద్ధాత్మ
  alternative: రెండు వర్గాలవారిలోని ఒకే మనోభావం లేదా ఉమ్మడి మానవ ఆత్మ
  rationale: ‘ఆయన ద్వారా … ఒకే ఆత్మలో … తండ్రి సన్నిధికి’ అనే నిర్మాణం కుమారుడు, ఆత్మ, తండ్రి అనే త్రిత్వ సందర్భాన్ని బలంగా సూచిస్తుంది. అయినా మూలంలో ‘పరిశుద్ధ’ అనే విశేషణం లేదు కాబట్టి దాన్ని ప్రధాన వాక్యంలో చేర్చలేదు.
- issue: προσαγωγή యొక్క భావబలం
  choice: తండ్రి సన్నిధికి ఉమ్మడి ప్రవేశం
  alternative: తండ్రి సమక్షానికి అధికారికంగా పరిచయం చేయబడటం లేదా ఆయనను సమీపించడం
  rationale: ఈ పదానికి రాజసభ లేదా ఆరాధనా నేపథ్య ఛాయలు ఉండవచ్చు. ‘ప్రవేశం’ కొనసాగుతున్న అనుగ్రహాన్ని తెలియజేస్తూనే రూపకాన్ని అతిగా నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘మన ఉభయులకూ’ కొద్దిగా సాహిత్య ఛాయ కలిగినప్పటికీ, రెండు వర్గాలు మరియు పౌలు చూపే ఉమ్మడి భాగస్వామ్యాన్ని సంక్షిప్తంగా నిలుపుతుంది. దైవసూచక గౌరవార్థకంగా ‘ఆయన’ వాడబడింది; ‘ఆత్మ’ సందర్భంలో పరిశుద్ధాత్మను సూచించినా మూలంలో లేని ‘పరిశుద్ధ’ పదాన్ని ప్రధాన వాక్యంలో చేర్చలేదు.
