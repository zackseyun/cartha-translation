source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εὐηγγελίσατο εἰρήνην ὑμῖν τοῖς μακρὰν καὶ ⸀εἰρήνην τοῖς ἐγγύς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/017.yaml
  text: And he came and proclaimed peace to you who were far away[b][a], and peace to those who were near.
translation:
  language: te
  text: ఆయన వచ్చి, దూరంగా ఉన్న మీకు[a] శాంతిని ప్రకటించాడు[b]; దగ్గరగా ఉన్నవారికి మరియు శాంతిని ప్రకటించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అంటే, ఇంతకుముందు దూరంగా ఉన్నవారికీ దగ్గరగా ఉన్నవారికీ శాంతి ప్రకటించబడింది. సందర్భంలో వీరు వరుసగా అన్యజనులు, యూదులు (ఎఫెసీయులు 2:11–13 చూడండి).
    reason: cross_reference
  - marker: b
    text: లేదా, “శాంతి గురించిన శుభవార్తను ప్రకటించాడు.” గ్రీకు క్రియకు సాధారణంగా “శుభవార్తను ప్రకటించు” అనే భావం ఉంది; ఇక్కడ దాని కర్మ “శాంతి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: ఆయన వచ్చి
  rationale: అయోరిస్ట్ కృదంతాన్ని సహజమైన తెలుగు వరుసక్రియగా అనువదించడం ద్వారా ఆయన రావడం, ప్రకటించడం అనే క్రమం మరియు గమన భావం నిలుస్తాయి.
- source_word: εὐηγγελίσατο
  choice: సువార్తగా ప్రకటించాడు
  rationale: ఈ క్రియ శుభవార్తను ప్రకటించడం అనే భావాన్ని కలిగి ఉంది. కర్మగా ‘శాంతి’ ఉన్నందున, ‘శాంతిని సువార్తగా ప్రకటించాడు’ అనేది మూలంలోని సువార్తార్థాన్ని తెలుగులో సహజంగా ఉంచుతుంది.
- source_word: εἰρήνην
  choice: శాంతిని
  rationale: εἰρήνηకు నేరమైన సమానార్థకం. సందర్భంలో సమాధానం, సఖ్యత, సంపూర్ణ మేలు వంటి ప్రతిధ్వనులు ఉన్నా, వాటిని విస్తరించి చేర్చకుండా ‘శాంతి’ వాటిని మోయగలదు.
- source_word: ὑμῖν
  choice: మీకు
  rationale: దత్తివిభక్తి పరోక్ష కర్మను నేరుగా వ్యక్తపరుస్తూ, సందర్భంలోని పాఠకులను ఉద్దేశించిన సంబోధనను నిలుపుతుంది.
- source_word: τοῖς μακρὰν
  choice: దూరంగా ఉన్న మీకు
  rationale: మూలంలోని దూరం అనే రూపకాన్ని నిలుపుతూ, ὑμῖνతో దాని వ్యాకరణ సంబంధాన్ని స్పష్టంగా తెలుగులో వ్యక్తపరుస్తుంది; అన్యజనులు అని ప్రధాన వాక్యంలో చేర్చదు.
- source_word: τοῖς ἐγγύς
  choice: దగ్గరగా ఉన్నవారికి
  rationale: దూరంగా ఉన్నవారితో ఉన్న సమాంతర వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; యూదులు అనే సందర్భార్థాన్ని అనువాదంలో నేరుగా చేర్చదు.
- source_word: καὶ ... καὶ
  choice: …; … కూడా
  rationale: రెండు వర్గాలకూ ఒకే శాంతి ప్రకటన అందిందనే సమన్వయాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; గ్రీకులోని రెండవ καί భావాన్ని ‘కూడా’ స్పష్టంగా మోస్తుంది.
theological_decisions:
- issue: ‘దూరంగా ఉన్నవారు’, ‘దగ్గరగా ఉన్నవారు’ ఎవరు?
  choice: రూపకాలైన ‘దూరంగా’, ‘దగ్గరగా’ అనే పదాలనే ప్రధాన వాక్యంలో ఉంచడం.
  alternative: ‘దూరంగా ఉన్న అన్యజనులు’, ‘దగ్గరగా ఉన్న యూదులు’ అని స్పష్టీకరించడం.
  rationale: ఎఫెసీయులు 2:11–13 సందర్భం వరుసగా అన్యజనులు, యూదులను సూచించినా, ఈ వచనం స్వయంగా దూరం–దగ్గర అనే ప్రవచనాత్మక రూపకాన్ని వాడుతుంది. దానిని నిలుపడం పౌలు వాక్చాతుర్యాన్ని, వ్యాఖ్యాన విస్తృతిని కాపాడుతుంది.
- issue: εὐηγγελίσατο యొక్క సువార్తార్థం
  choice: ‘శాంతిని సువార్తగా ప్రకటించాడు’ అని అనువదించడం.
  alternative: కేవలం ‘శాంతిని ప్రకటించాడు’ అని అనువదించడం.
  rationale: ‘ప్రకటించాడు’ మాత్రమే వాడితే గ్రీకు క్రియలోని శుభవార్తను తెలియజేయడం అనే ప్రత్యేక భావం తగ్గిపోవచ్చు. ‘సువార్తగా’ అనేది క్రియలో అంతర్లీనమైన భావాన్ని వ్యక్తపరుస్తుంది; ప్రత్యేక సిద్ధాంతపరమైన నిర్వచనాన్ని మాత్రం చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘దూరంగా/దగ్గరగా’ అనే రూపకాన్ని నిలిపి, సందర్భంలోని అన్యజనులు–యూదులు అనే గుర్తింపును పాదసూచికలో ఉంచాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
