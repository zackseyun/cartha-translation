  verdict: revise
  source_fidelity: The draft accurately retains the aorist passive participial construction, the architectural metaphor, the broad genitive relation of ‘apostles and prophets,’ and the title ‘Messiah.’ However, ‘దానికి’ (‘for it/to it’) has no corresponding element in the Greek and shifts the referent of αὐτοῦ. The Greek emphatic pronoun refers to Christ Jesus himself.
  naturalness: The revised wording is natural modern standard Telugu and preserves the verse’s dependent, continuing-sentence form. ‘పునాదిమీద’ is the customary compound spelling, and ‘తానే’ supplies the required emphatic sense clearly.
  terminology: ‘మెస్సీయ యేసు’ appropriately renders Χριστὸς Ἰησοῦ as a title plus name, while ‘మూలరాయి’ is an apt rendering of ἀκρογωνιαῖος. The footnote retains the familiar alternative ‘క్రీస్తు యేసు.’
