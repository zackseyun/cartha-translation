translation:
  language: te
  text: అపొస్తలుల, ప్రవక్తల పునాదిమీద[a] కట్టబడినవారై, మెస్సీయ యేసు తానే[b] మూలరాయిగా ఉండగా,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అపొస్తలుల, ప్రవక్తల పునాది’ అంటే వారి సాక్ష్యంతో సంబంధమున్న పునాది, వారు వేసిన పునాది, లేదా వారే భాగమైన పునాది అని అర్థం కావచ్చు; గ్రీకు షష్ఠీ సంబంధం దీన్ని మరింత నిర్దిష్టంగా చెప్పదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘క్రీస్తు యేసు.’ ఇక్కడ గ్రీకు బిరుదైన Χριστός అర్థాన్ని నిలుపడానికి ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποικοδομηθέντες
  choice: కట్టబడినవారై
  rationale: భూతకాల నిష్క్రియార్థక అసమాపక క్రియను నిలుపుతూ, విశ్వాసులు దేవుని కట్టడంలో చేర్చబడినవారనే రూపకాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ τῷ θεμελίῳ
  choice: పునాది మీద
  rationale: దత్తివ విభక్తితో ఉన్న ἐπί ఇక్కడ ఆధారం లేదా స్థానం అనే భావాన్ని ఇస్తుంది; కట్టడం రూపకంలో ‘పునాది మీద’ సహజమైన సమానార్థకం.
- source_word: τῶν ἀποστόλων καὶ προφητῶν
  choice: అపొస్తలుల, ప్రవక్తల
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని మరింత నిర్దిష్టం చేయకుండా తెలుగులోనూ సంబంధరూపంగానే ఉంచుతుంది; వారు వేసిన పునాదా, వారి సాక్ష్యంతో సంబంధమున్న పునాదా, లేక వారే పునాదిలో భాగమా అనే విషయాన్ని అనువాదం తేల్చదు.
- source_word: ὄντος
  choice: ఉండగా
  rationale: Genitive absolute యొక్క నేపథ్య సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, ప్రధాన వాక్యంతో అసమాపక అనుసంధానాన్ని నిలుపుతుంది.
- source_word: ἀκρογωνιαίου
  choice: మూలరాయి
  rationale: కట్టడం రూపకంలో భవనానికి దిశను, కలయికను నిర్ణయించే cornerstone‌ను సూచించే సాధారణమైన, గౌరవప్రదమైన తెలుగు పదం; మూలంలో లేని ‘ప్రధాన’ అనే అదనపు విశేషణాన్ని చేర్చదు.
- source_word: αὐτοῦ Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసే దానికి
  rationale: ‘యేసే’ అనే ఉద్ఘాటన αὐτοῦ యొక్క emphatic భావాన్ని అందిస్తుంది; ‘దానికి’ అనే పదం మూలరాయికి కట్టడం/పునాదితో ఉన్న సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని కలిగి ఉన్నందున ‘మెస్సీయ’ అని అనువదించడం దాని అర్థాన్ని నిలుపుతుంది; సంప్రదాయ రూపాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: ‘అపొస్తలుల, ప్రవక్తల పునాది’ అనే షష్ఠీ సంబంధం
  choice: సంబంధాన్ని విస్తరించి వివరించకుండా ‘అపొస్తలుల, ప్రవక్తల పునాది’ అని ఉంచడం
  alternative: ‘అపొస్తలులూ ప్రవక్తలూ వేసిన పునాది’ లేదా ‘అపొస్తలులూ ప్రవక్తలే పునాది’
  rationale: గ్రీకు షష్ఠీ విభక్తి పునాది వారితో లేదా వారి సాక్ష్యంతో సంబంధమున్నదని సూచించగలదు; అయితే ఆ సంబంధ స్వభావాన్ని ఖచ్చితంగా నిర్ణయించదు. అందువల్ల వచనంలోని ఉద్దేశపూర్వక విస్తృతిని నిలిపాం.
- issue: Χριστός యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో అది బిరుదుగా స్పష్టంగా పనిచేస్తుంది; ‘మెస్సీయ’ మూల బిరుదు అర్థాన్ని నేరుగా తెలియజేస్తుంది. పాఠకులకు సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిలో ఉంది. చుట్టుపక్కల వాక్యంతో అనుసంధానమయ్యే అసమాపక నిర్మాణం మరియు చివరి విరామచిహ్నం నిలుపబడ్డాయి. ‘పునాది’ మరియు ‘మూలరాయి’ ద్వారా నిర్మాణ రూపకం ఏకరీతిగా కొనసాగుతుంది.
