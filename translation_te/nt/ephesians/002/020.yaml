    issue: The translation adds ‘దానికి’ in ‘మెస్సీయ యేసే దానికి మూలరాయిగా.’
    rationale: No Greek word means ‘to it/for it.’ αὐτοῦ is an emphatic pronoun modifying Χριστοῦ Ἰησοῦ (‘Christ Jesus himself’), not a pronoun referring to the foundation or building. Replacing it with ‘తానే’ restores the source meaning without interpretive addition.
