id: EPH.2.7
reference: Ephesians 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα ἐνδείξηται ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις ⸂τὸ ὑπερβάλλον πλοῦτος⸃ τῆς χάριτος αὐτοῦ ἐν χρηστότητι ἐφ’ ἡμᾶς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/007.yaml
  text: so that in the coming ages he might display the surpassing riches of his grace in kindness toward us in Messiah Jesus[a][b][c].
translation:
  language: te
  text: రాబోయే యుగాల్లో[a], మెస్సీయ యేసులో[c] మనపట్ల దయతో తన కృప యొక్క అపరిమితమైన ఐశ్వర్యాన్ని[b] ఆయన కనబరచడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాబోవు యుగాల్లో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన కృప యొక్క సాటిలేని ఐశ్వర్యాన్ని.”
    reason: lexical_alternative
  - marker: c
    text: “మెస్సీయ యేసులో” అనే గ్రీకు పదబంధాన్ని సంప్రదాయంగా “క్రీస్తు యేసులో” అని కూడా అనువదిస్తారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: కనబరచడానికి
  rationale: ముందున్న వాక్యంతో అనుసంధానమైన ఉద్దేశం లేదా ఫలితాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐνδείξηται
  choice: ఆయన కనబరచడానికి
  rationale: ἐνδείκνυμι లోని బహిరంగంగా చూపించడం లేదా వెల్లడించడం అనే భావాన్ని ‘కనబరచు’ స్పష్టంగా అందిస్తుంది.
- source_word: ἐν τοῖς αἰῶσιν τοῖς ἐπερχομένοις
  choice: రాబోయే యుగాల్లో
  rationale: αἰῶσιν యొక్క బహువచనాన్ని, ἐπερχομένοις యొక్క భవిష్యత్ దిశను రెండింటినీ నిలుపుతుంది.
- source_word: τὸ ὑπερβάλλον πλοῦτος
  choice: సాటిలేని ఐశ్వర్యాన్ని
  rationale: ὑπερβάλλον సూచించే హద్దులు మించిన, అసాధారణమైన పరిమాణాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τῆς χάριτος αὐτοῦ
  choice: తన కృప యొక్క
  rationale: పౌలు వాడుకలో χάριςకు ఉన్న దైవానుగ్రహ భావాన్ని ‘కృప’ నిలుపుతుంది; ‘తన’ అనేది వాక్యంలోని కర్త అయిన దేవునినే తిరిగి సూచిస్తుంది.
- source_word: ἐν χρηστότητι
  choice: దయ ద్వారా
  rationale: χρηστότηςలోని దయ, ఉపకారం, మేలు చేసే స్వభావాన్ని అందిస్తుంది. ఇక్కడ ἐνను ఆ కృప ప్రత్యక్షమయ్యే విధానం లేదా సాధనంగా సహజ తెలుగులో వ్యక్తం చేసింది.
- source_word: ἐφ’ ἡμᾶς
  choice: మనపట్ల
  rationale: ἐπίతో కూడిన దిశాత్మక, అనుకూల వైఖరిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: Χριστόςను ఇక్కడ బిరుదుగా తీసుకొని ‘మెస్సీయ’గా ఇచ్చింది; ἐνను ‘లో’గా ఉంచి మెస్సీయతో సంబంధం లేదా ఐక్యత అనే పౌలు భావాన్ని ముందే ఒకే అర్థానికి పరిమితం చేయలేదు.
theological_decisions:
- issue: Χριστῷ అనేది సజీవమైన బిరుదా, పేరులా స్థిరపడిన రూపమా
  choice: మెస్సీయ యేసులో
  alternative: క్రీస్తు యేసులో
  rationale: ఈ సూత్రబద్ధమైన పౌలు పదబంధంలో Χριστόςకు ‘మెస్సీయ’ అనే బిరుదు భావం ఇంకా ఉందని ప్రధాన పాఠం చూపుతుంది; తెలుగు సంప్రదాయ రూపమైన ‘క్రీస్తు యేసులో’ను పాదటిప్పణిలో ఉంచి ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
- issue: ἐν χρηστότητι యొక్క సంబంధం
  choice: దయ ద్వారా
  alternative: దయలో
  rationale: దయ అనేది కృపను కనబరచే విధానం లేదా సాధనం అనే పఠనాన్ని సహజ తెలుగులో ఇస్తుంది; గ్రీకు ἐν వల్ల ‘దయలో’ అనే పరిధి భావం కూడా సాధ్యమే కాబట్టి దానిని పాదటిప్పణిలో నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం. మూలంలోని ఉద్దేశార్థక వాక్యఖండ స్వభావాన్ని నిలిపింది. ‘మెస్సీయ’ బిరుదును అనువాద లిప్యంతరీకరణగా ఉంచి, విస్తృతంగా తెలిసిన ‘క్రీస్తు’ రూపాన్ని పాదటిప్పణిలో ఇచ్చింది.
