- from: రాబోయే యుగాల్లో[a], మెస్సీయ యేసులో[c] మనపట్ల చూపే దయ ద్వారా తన కృప యొక్క సాటిలేని ఐశ్వర్యాన్ని[b] ఆయన కనబరచడానికి.
