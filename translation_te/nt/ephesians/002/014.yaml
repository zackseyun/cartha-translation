  text: αὐτὸς γάρ ἐστιν ἡ εἰρήνη ἡμῶν, ὁ ποιήσας τὰ ἀμφότερα ἓν καὶ τὸ μεσότοιχον τοῦ φραγμοῦ λύσας, τὴν ἔχθραν ἐν τῇ σαρκὶ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/014.yaml
  text: For he himself is our peace[a], who made both one and broke down the dividing wall of the barrier—the hostility—in his flesh[d][c][b],
translation:
  language: te
  text: ఎందుకంటే ఆయనే మన శాంతి; ఆయన యూదులనూ యూదేతరులనూ ఒక్కటిగా చేసి, అడ్డంకిగా ఉన్న విభజన గోడను—అంటే శత్రుత్వాన్ని—తన మాంసంలో కూల్చివేశాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸς
  choice: ఆయనే
  rationale: బలాన్ని సూచించే సర్వనామాన్ని సహజమైన తెలుగులో నిలుపుతుంది; సమాధానం క్రీస్తే అని నొక్కి చెబుతుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యానికి కారణాన్ని తెలిపే అనుసంధానాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἡ εἰρήνη ἡμῶν
  choice: మన సమాధానం
  rationale: εἰρήνη యొక్క సంబంధపునరుద్ధరణ భావాన్ని సాధారణ, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὰ ἀμφότερα
  choice: యూదులు, యూదేతరులు అనే ఉభయులను
  rationale: తక్షణ సందర్భంలోని రెండు వర్గాలను స్పష్టం చేస్తుంది; మూలంలోని ‘ఉభయులు’ భావాన్ని కూడా నిలుపుతుంది.
- source_word: ἓν
  choice: ఒక్కటిగా
  rationale: రెండు వర్గాలను ఒకటిగా చేసిన ఫలితాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὸ μεσότοιχον τοῦ φραγμοῦ
  choice: అడ్డుగా ఉన్న విభజన గోడను
  rationale: గోడ మరియు అవరోధం అనే సంయుక్త రూపకాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా నిలుపుతుంది.
- source_word: λύσας
  choice: కూల్చివేశాడు
  rationale: గోడను తొలగించడం అనే సందర్భంలో సహజమైన క్రియ; అడ్డంకి నిర్మూలనను స్పష్టం చేస్తుంది.
- source_word: τὴν ἔχθραν
  choice: శత్రుత్వాన్ని
  rationale: వర్గాల మధ్య ఉన్న వైరసంబంధాన్ని స్పష్టంగా వ్యక్తం చేసే ఆధునిక ప్రామాణిక పదం.
- source_word: ἐν τῇ σαρκὶ αὐτοῦ
  choice: తన శరీరంలో
  rationale: ఇక్కడ σάρξ క్రీస్తు యొక్క దేహధారణతో కూడిన మరణాన్ని సూచిస్తుంది; తెలుగులో ‘తన శరీరంలో’ సహజంగా ఉండి పాప స్వభావమనే అపార్థాన్ని నివారిస్తుంది.
theological_decisions:
- issue: ‘ఉభయులు’ అనే పదం సూచించే వారు
  choice: యూదులు, యూదేతరులు అని వచనంలో స్పష్టం చేయడం
  alternative: ‘ఉభయులను’ అని మాత్రమే ఉంచడం
  rationale: ఎఫెసీయులు 2 యొక్క తక్షణ సందర్భం ఈ రెండు వర్గాలనే సూచిస్తుంది; స్పష్టీకరణ కొత్త భావాన్ని చేర్చదు.
- issue: τὴν ἔχθραν యొక్క వాక్య సంబంధం
  choice: విభజన గోడను వివరించే సమానాధికార పదంగా డాష్‌ల మధ్య ఉంచడం
  alternative: ‘తన శరీరంలోని శత్రుత్వం’గా కలిపి చదవడం లేదా తదుపరి వచనానికి జోడించడం
  rationale: శత్రుత్వం క్రీస్తు శరీరంలో ఉందనే అపార్థాన్ని నివారిస్తూ, గ్రీకు వాక్యంలోని నిజమైన నిర్మాణాత్మక సందిగ్ధతను పూర్తిగా చెరపకుండా ఉంచుతుంది.
- issue: ἐν τῇ σαρκὶ αὐτοῦ యొక్క భావం
  choice: ‘తన శరీరంలో’—క్రీస్తు దేహసంబంధ మరణం ద్వారా చేసిన కార్యం
  alternative: ‘తన మాంసంలో’ లేదా ‘తన శరీరంలోని శత్రుత్వం’
  rationale: క్రీస్తు మానవత్వం తొలగించబడిందని గాని ఆయనలో శత్రుత్వం ఉందని గాని సూచించకుండా, ఆయన దేహధారణతో కూడిన మరణాన్ని తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన ధోరణి. గ్రీకు వాక్యంలోని కొనసాగుతున్న ప్రవాహాన్ని చివరి విరామచిహ్నం కంటే వాక్య నిర్మాణంతో సహజీకరించాం; శత్రుత్వం యొక్క అనుసంధాన సందిగ్ధతను పాదటిప్పణిలో నిలిపాం.
