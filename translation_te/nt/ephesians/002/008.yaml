source:
  edition: SBLGNT
  text: τῇ γὰρ χάριτί ἐστε σεσῳσμένοι ⸀διὰ πίστεως· καὶ τοῦτο οὐκ ἐξ ὑμῶν, θεοῦ τὸ δῶρον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/008.yaml
  text: For by grace you have been saved through faith[a], and this is not from yourselves[b]; it is the gift of God.
translation:
  language: te
  text: ఎందుకంటే కృపవల్ల విశ్వాసం[a] ద్వారా మీరు రక్షించబడి ఉన్నారు. ఇది[b] మీ నుంచి వచ్చినది కాదు; అది దేవుని బహుమానం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విశ్వాసం’ అనే పదాన్ని ‘నమ్మకం’ అని కూడా అర్థం చేసుకోవచ్చు; గ్రీకు పదానికి కొన్ని సందర్భాల్లో ‘విశ్వాస్యత’ అనే అర్థం కూడా ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఇది’ అనే గ్రీకు నిర్దేశక సర్వనామం, ‘విశ్వాసం’ ఒక్కదానిని కాకుండా, ‘కృపవల్ల విశ్వాసం ద్వారా రక్షించబడటం’ అనే ముందున్న మొత్తం వాస్తవాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: alternative_reading
lexical_decisions:
- source_word: χάριτί
  choice: కృపవల్ల
  rationale: పౌలు వాడుకలో χάρις దేవుని అనుగ్రహపూర్వకమైన దయను సూచిస్తుంది. ‘కృప’ స్థిరమైన వేదాంతార్థాన్ని నిలుపుతుంది; ‘వల్ల’ ఇక్కడ సాధనాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐστε σεσῳσμένοι
  choice: మీరు రక్షించబడి ఉన్నారు
  rationale: వర్తమాన εἰμίతో కూడిన పరిపూర్ణ కృదంత రూపం, పూర్తయిన రక్షణ కార్యంతోపాటు కొనసాగుతున్న ఫలితస్థితిని సూచిస్తుంది. ‘రక్షించబడి ఉన్నారు’ ఈ రెండు కోణాలనూ నిలుపుతుంది.
- source_word: διὰ πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనం లేదా మార్గాన్ని సూచిస్తుంది. πίστιςకు ఇక్కడ ‘విశ్వాసం’ సహజమైన ప్రధాన ఎంపిక; ‘నమ్మకం’ అనే భావం కూడా సాధ్యమే.
- source_word: τοῦτο
  choice: ఇది
  rationale: నపుంసకలింగ నిర్దేశక సర్వనామం ముందున్న కృపవల్ల విశ్వాసం ద్వారా రక్షించబడే మొత్తం వాస్తవాన్ని సూచించే అవకాశం ఎక్కువ. ‘ఇది’ గ్రీకు వాక్యంలోని సంక్షిప్తతను, సూచనలోని కొంత అనిశ్చితిని నిలుపుతుంది.
- source_word: οὐκ ἐξ ὑμῶν
  choice: మీనుంచి వచ్చినది కాదు
  rationale: ἐκ మూలాన్ని లేదా ఉద్భవాన్ని సూచిస్తుంది. ఈ మాట రక్షణ వాస్తవం పాఠకులలోనే ఉద్భవించలేదని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: θεοῦ τὸ δῶρον
  choice: దేవుని బహుమానం
  rationale: ఈ పదబంధం ముందున్న వాస్తవాన్ని దేవుని బహుమానంగా గుర్తిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు వ్యక్తంగా ఉన్న క్రియ లేకుండానే నామవాచక విధేయాన్ని ఉంచాం.
theological_decisions:
- issue: τοῦτο (‘ఇది’) అనేది కృప, విశ్వాసం, రక్షణలలో దేనిని సూచిస్తుంది?
  choice: ‘ఇది’ ముందున్న ‘కృపవల్ల విశ్వాసం ద్వారా రక్షించబడటం’ అనే మొత్తం వాస్తవాన్ని సూచిస్తుంది.
  alternative: ‘ఇది’ ప్రత్యేకంగా విశ్వాసాన్నే దేవుని బహుమానంగా సూచిస్తుంది; లేదా ప్రత్యేకంగా కృపను సూచిస్తుంది.
  rationale: τοῦτο నపుంసకలింగంలో ఉంది; χάρις, πίστις రెండూ స్త్రీలింగ పదాలు. అందువల్ల అది ఒకే నామవాచకాన్ని కాక ముందున్న భావమంతటినీ సూచించడం వ్యాకరణపరంగా సహజం. అయినప్పటికీ అనువాదం నిర్దేశక సర్వనామాన్ని అలాగే ఉంచి, గ్రీకు వాక్యం చెప్పినదానికంటే ఎక్కువగా ఒక వేదాంత నిర్ణయాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘రక్షించబడి ఉన్నారు’ అనే రూపం కొద్దిగా ఘనమైనదైనా, పూర్తయిన కార్యం మరియు కొనసాగుతున్న స్థితి రెండింటినీ స్పష్టంగా నిలుపుతుంది. మూలంలోని γάρను ‘ఎందుకంటే’గా అనువదించి ముందరి సందర్భంతో ఉన్న వివరణాత్మక సంబంధాన్ని కాపాడాం.
