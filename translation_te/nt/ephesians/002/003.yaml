id: EPH.2.3
reference: Ephesians 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν οἷς καὶ ἡμεῖς πάντες ἀνεστράφημέν ποτε ἐν ταῖς ἐπιθυμίαις τῆς σαρκὸς ἡμῶν, ποιοῦντες τὰ θελήματα τῆς σαρκὸς καὶ τῶν διανοιῶν, καὶ ⸀ἤμεθα τέκνα φύσει ὀργῆς ὡς καὶ οἱ λοιποί·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/003.yaml
  text: among whom we all also once lived in the desires of our flesh[a], fulfilling the desires of the flesh and of the mind, and we were by nature children of wrath[e][d][c][b], just as the rest were.
translation:
  language: te
  text: వారిలో[a] మనమందరం కూడా ఒకప్పుడు మన శరీరపు[b] కోరికల ప్రకారం జీవిస్తూ, శరీరానికీ ఆలోచనలకీ చెందిన సంకల్పాలను నెరవేరుస్తూ[d], మిగిలినవారిలాగే[e] స్వభావరీత్యా కోపానికి పాత్రులమై[c] ఉన్నాము.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వాటిలో.” గ్రీకు పదం అవిధేయత అనే పరిధిని గానీ, అవిధేయతతో గుర్తింపబడిన ప్రజలను గానీ సూచించవచ్చు. సందర్భంలో “వారిలో” అనే వ్యక్తిగత సూచన తీసుకోబడింది.
    reason: alternative_reading
  - marker: b
    text: “శరీరం” అనే పదాన్ని ఇక్కడ “పాప స్వభావం” అని కూడా అనువదించవచ్చు. ప్రధాన పాఠ్యం పౌలు వాడిన పదాన్ని నిలిపి, దాని పూర్తి వేదాంతపరమైన భావాన్ని ముందుగానే నిర్ణయించదు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “కోపపు పిల్లలు.” ఇది గ్రీకు నుడికారం; తెలుగులో భావానువాదంగా “కోపానికి పాత్రులు” అని ఇచ్చాం.
    reason: lexical_alternative
  - marker: d
    text: మరింత అక్షరానువాదంగా, “శరీరానికీ ఆలోచనలకీ చెందిన సంకల్పాలను చేస్తూ.”
    reason: previous_rendering
  - marker: e
    text: లేదా, “మిగిలినవారు కూడా ఉన్నట్లే.” తెలుగులో సహజత కోసం ప్రధాన పాఠ్యంలో “మిగిలినవారిలాగే” అని ఇచ్చాం.
    reason: previous_rendering
lexical_decisions:
- source_word: ἐν οἷς
  choice: వారిలో
  rationale: సమీప సందర్భంలోని అవిధేయులైన ప్రజలను సూచించే వ్యక్తిగత భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; వ్యాకరణపరంగా సాధ్యమైన ‘వాటిలో’ అనే భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ἀνεστράφημέν
  choice: జీవిస్తూ
  rationale: ఇక్కడ క్రియ ఒకప్పటి జీవన విధానాన్ని సూచిస్తుంది. ‘ప్రవర్తిస్తూ’ కంటే ‘జీవిస్తూ’ సహజంగా ఉండి, నిరంతర జీవనశైలిని తెలియజేస్తుంది.
- source_word: ποτε
  choice: ఒకప్పుడు
  rationale: గత స్థితిని స్పష్టంగా, సహజంగా సూచిస్తుంది.
- source_word: ἐπιθυμίαις
  choice: కోరికల ప్రకారం
  rationale: లైంగిక భావానికే పరిమితం చేయకుండా, నైతికంగా దారితప్పిన విస్తృత కోరికలను సూచిస్తుంది; గ్రీకు ἐν యొక్క జీవన-పరిధి భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: σάρξ
  choice: శరీరం
  rationale: పౌలు వాడిన పదాన్ని ‘పాప స్వభావం’ అని ముందుగానే వ్యాఖ్యానించకుండా నిలుపుతుంది. సందర్భంలో దీనికి నైతిక భావం ఉన్నప్పటికీ, దాని పూర్తి మానవశాస్త్రీయ భావాన్ని తెరిచి ఉంచుతుంది.
- source_word: ποιοῦντες
  choice: నెరవేరుస్తూ
  rationale: కోరికలు లేదా సంకల్పాలు కోరినదాన్ని ఆచరణలో అమలు చేయడాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది; కేవలం ఒక్కసారి చేసిన పనికంటే అలవాటైన ప్రవర్తన భావానికి సరిపోతుంది.
- source_word: θελήματα
  choice: కోరిన వాటిని
  rationale: తెలుగులో అసహజమైన ‘సంకల్పాలను చేయడం’ అనే పదబంధాన్ని నివారిస్తూ, సంకల్పం లేదా అభిలాష ఆచరణలోకి రావడాన్ని వ్యక్తం చేస్తుంది.
- source_word: διανοιῶν
  choice: ఆలోచనలు
  rationale: బహువచనంలోని మానసిక ధోరణులు, ఆలోచనా ప్రవృత్తుల భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τέκνα ὀργῆς
  choice: కోపానికి పాత్రులు
  rationale: గ్రీకు సెమిటిక్ నుడికారాన్ని తెలుగులో అర్థవంతంగా అందిస్తుంది; ‘కోపపు పిల్లలు’ అనే అక్షరానువాదం తెలుగులో అపార్థకంగా ఉంటుంది. అక్షరార్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: φύσει
  choice: స్వభావరీత్యా
  rationale: ఈ స్థితి సహజంగా లేదా స్వభావం ప్రకారం ఉందనే భావాన్ని నిలుపుతుంది; దానిని కేవలం జన్మ లేదా జీవశాస్త్రానికి పరిమితం చేయదు.
- source_word: οἱ λοιποί
  choice: మిగిలినవారు
  rationale: క్రీస్తుకు వెలుపల ఉన్న ఇతరులందరితో చేసే పోలికను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నైతిక భావంతో వాడిన σάρξ అనువాదం
  choice: శరీరం
  alternative: పాప స్వభావం
  rationale: ‘పాప స్వభావం’ సందర్భానికి సాధ్యమైన వివరణ అయినప్పటికీ, అది పౌలు మానవ స్వభావాన్ని ఎలా అర్థం చేసుకున్నాడో ముందుగానే నిర్ణయిస్తుంది. ‘శరీరం’ మూలపదాన్ని, దానిలోని వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
- issue: τέκνα φύσει ὀργῆς యొక్క భావం
  choice: స్వభావరీత్యా కోపానికి పాత్రులమై
  alternative: స్వభావరీత్యా కోపపు పిల్లలమై
  rationale: తెలుగులో అక్షరానువాదం అసహజంగా, అస్పష్టంగా ఉంటుంది. ‘కోపానికి పాత్రులు’ అనే రూపం తీర్పుకు లోబడిన స్థితిని తెలియజేస్తుంది; కోపం ఎవరిది అని మూలంలో లేనిదాన్ని ప్రధాన పాఠ్యంలో చేర్చదు. ‘స్వభావరీత్యా’ అనే పదం సహజ స్థితి గురించిన వేదాంత చర్చను పరిష్కరించకుండా అలాగే ఉంచుతుంది.
- issue: ἐν οἷς యొక్క పూర్వపద సూచన
  choice: వారిలో
  alternative: వాటిలో
  rationale: సమీపంలోని ‘అవిధేయత కుమారులు’ అనే వ్యక్తులను సూచించడం సందర్భానికి బాగా సరిపోతుంది. అయినా అపరాధాలు లేదా అవిధేయత అనే పరిధిని సూచించే వ్యాకరణ అవకాశాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి వాడబడింది. పొడవైన గ్రీకు వాక్య నిర్మాణాన్ని నిలుపుతూ తెలుగు ప్రవాహం కోసం క్రియావిశేషణ రూపాలు ఉపయోగించబడ్డాయి. ‘శరీరం,’ ‘స్వభావరీత్యా,’ ‘కోపానికి పాత్రులు’ వంటి ఎంపికలు మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను అతిగా వ్యవస్థీకరించకుండా కాపాడుతాయి.
