revisions:
- from: వారిలో[a] మనమందరం కూడా ఒకప్పుడు మన శరీరపు[b] కోరికల ప్రకారం జీవిస్తూ, శరీరం మరియు ఆలోచనలు కోరిన వాటిని నెరవేరుస్తూ[d], మిగిలినవారిలాగే[e] స్వభావరీత్యా కోపానికి పాత్రులమై[c] ఉన్నాము.
  to: వారిలో[a] మనమందరం కూడా ఒకప్పుడు మన శరీరపు[b] కోరికల ప్రకారం జీవిస్తూ, శరీరానికీ ఆలోచనలకీ చెందిన సంకల్పాలను నెరవేరుస్తూ[d], మిగిలినవారిలాగే[e] స్వభావరీత్యా కోపానికి పాత్రులమై[c] ఉన్నాము.
  rationale: 'The revision corrects the only substantive source-fidelity issue: θελήματα is represented as ‘సంకల్పాలు’ (volitional aims), distinct from the preceding ἐπιθυμίαις, and the genitives ‘of the flesh and of the thoughts’ are retained. No theological interpretation is added or resolved.'
  reviewer_model: gpt-5.6-terra
