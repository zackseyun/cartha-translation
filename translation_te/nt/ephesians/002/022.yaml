id: EPH.2.22
reference: Ephesians 2:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς συνοικοδομεῖσθε εἰς κατοικητήριον τοῦ θεοῦ ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/022.yaml
  text: in whom you also are being built together into a dwelling place for God in the Spirit[a][b].
translation:
  language: te
  text: ఆయనలో[a] మీరు కూడా పరిశుద్ధాత్మలో[b] దేవునికి నివాసస్థలంగా కలిసి కట్టబడుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానిలో’; సంబంధ సర్వనామం నేరుగా క్రీస్తును కాక, మొత్తం కట్టడాన్ని సూచిస్తుందని అర్థం చేసుకుంటే ఇలా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘ఆత్మలో’ లేదా ‘ఆత్మ ద్వారా.’ ఈ పదబంధం దేవుని నివాసం ఏర్పడే పరిధిని గానీ, పరిశుద్ధాత్మ కార్యాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ఆయనలో
  rationale: సమీప సందర్భంలో క్రీస్తే ప్రధాన పూర్వపదంగా ఉన్నందున వ్యక్తిని సూచించే ‘ఆయనలో’ సహజమైన ఎంపిక. అయితే ఇది మొత్తం కట్టడాన్ని సూచించే అవకాశాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: καὶ ὑμεῖς
  choice: మీరు కూడా
  rationale: καί యొక్క చేర్పు భావాన్ని ‘కూడా’ తెలియజేస్తుంది; స్పష్టంగా ఉన్న బహువచన సర్వనామం ప్రత్యక్ష సంబోధనను నిలుపుతుంది.
- source_word: συνοικοδομεῖσθε
  choice: కలిసి కట్టబడుతున్నారు
  rationale: వర్తమానకాల కర్మణి రూపం కొనసాగుతున్న ప్రక్రియను సూచిస్తుంది; σύν భావాన్ని ‘కలిసి’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς κατοικητήριον
  choice: నివాసస్థలంగా
  rationale: εἰς ఇక్కడ ఫలితం లేదా లక్ష్యాన్ని సూచిస్తుంది. తెలుగులో ‘నివాసస్థలంగా’ అనేది ఆ ఫలితస్థితిని సహజంగా, ఆలయ-కట్టడం రూపకాన్ని కాపాడుతూ తెలియజేస్తుంది.
- source_word: τοῦ θεοῦ
  choice: దేవునికి
  rationale: ఈ సంబంధవిభక్తి దేవుడు నివసించే స్థలమనే భావాన్ని ఇస్తుంది; తెలుగులో ‘దేవునికి నివాసస్థలం’ సహజంగా ఉంటుంది.
- source_word: ἐν πνεύματι
  choice: ఆత్మలో
  rationale: ఎఫెసీయుల పత్రికలోని సందర్భం పరిశుద్ధాత్మను సూచించే అవకాశాన్ని బలపరుస్తుంది. ‘లో’ అనే రూపం పరిధి మరియు సాధన భావాల మధ్య ఉన్న మూలభాషా విస్తృతిని పూర్తిగా తొలగించదు.
theological_decisions:
- issue: ἐν ᾧ యొక్క పూర్వపదం
  choice: క్రీస్తును సూచించే ‘ఆయనలో’
  alternative: మొత్తం కట్టడాన్ని సూచించే ‘దానిలో’
  rationale: 20–21 వచనాల్లో కట్టడం క్రీస్తులో ఏకమై ఎదుగుతుందని చెప్పబడటం వల్ల క్రీస్తే అత్యంత సహజమైన పూర్వపదం. అయినా వ్యాకరణపరంగా కట్టడాన్ని సూచించే అవకాశం ఉన్నందున దానిని పాదటిప్పణిలో నిలిపాం.
- issue: ἐν πνεύματι యొక్క భావం
  choice: పరిశుద్ధాత్మను సూచించే ‘ఆత్మలో’
  alternative: ‘ఆత్మ సంబంధంగా’ లేదా ‘ఆత్మ ద్వారా’
  rationale: ఆలయం, దేవుని నివాసం అనే సందర్భం పరిశుద్ధాత్మ సన్నిధి లేదా కార్యాన్ని సూచిస్తుంది. ‘ఆత్మలో’ అనే అనువాదం దానిని కేవలం సాధనార్థకంగా పరిమితం చేయకుండా మూలంలోని భావవిస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘కలిసి కట్టబడుతున్నారు’ అనే రూపం కట్టడం అనే రూపకాన్నీ, కొనసాగుతున్న కర్మణి చర్యనూ నిలుపుతుంది. పాదటిప్పణి సూచికలు సంబంధిత పదబంధాల తరువాత ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
