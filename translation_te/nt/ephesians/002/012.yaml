id: EPH.2.12
reference: Ephesians 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ⸀ἦτε τῷ καιρῷ ἐκείνῳ χωρὶς Χριστοῦ, ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραὴλ καὶ ξένοι τῶν διαθηκῶν τῆς ἐπαγγελίας, ἐλπίδα μὴ ἔχοντες καὶ ἄθεοι ἐν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/012.yaml
  text: that at that time you were without Messiah[a], alienated from the commonwealth of Israel and strangers to the covenants of the promise[c][b], having no hope and without God in the world.
translation:
  language: te
  text: ఆ సమయంలో మీరు మెస్సీయ లేకుండా[a], ఇశ్రాయేలు పౌరసమాజం నుండి వేరుచేయబడినవారై, వాగ్దానపు నిబంధనలకు[b] పరాయివారై, నిరీక్షణ లేనివారై, లోకంలో దేవుడు లేనివారై[c] ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు లేకుండా.’ గ్రీకు Χριστός అనేది ‘అభిషిక్తుడు’ అనే అర్థమున్న బిరుదు; దాన్ని ‘క్రీస్తు’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: మరింత అక్షరార్థంగా, ‘వాగ్దానపు నిబంధనలకు.’ గ్రీకులో ‘నిబంధనలు’ బహువచనంలో, ‘వాగ్దానం’ ఏకవచనంలో ఉన్నాయి.
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘దైవభక్తి లేనివారై.’ ఇక్కడి మాట ఆధునిక భావంలోని తాత్త్విక నాస్తికత్వం కంటే నిజ దేవుడు లేని స్థితిని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς Χριστοῦ
  choice: మెస్సీయ లేకుండా
  rationale: Χριστός ఇక్కడ ఇశ్రాయేలు నిబంధనల నేపథ్యంలోని అభిషిక్తుని బిరుదుగా పనిచేస్తోంది; అందువల్ల ‘క్రీస్తు’ అనే రూపానికి బదులు బిరుదు అర్థాన్ని స్పష్టంగా తెలిపే ‘మెస్సీయ’ను ఎంచుకున్నాం.
- source_word: ἀπηλλοτριωμένοι τῆς πολιτείας τοῦ Ἰσραήλ
  choice: ఇశ్రాయేలు పౌరసమాజం నుండి వేరుచేయబడినవారిగా
  rationale: పరిపూర్ణ కర్మణి కృదంతం ఏర్పడిన వేరుపాటు స్థితిని సూచిస్తుంది. πολιτεία వ్యక్తిగత పౌరసత్వానికే పరిమితం కాకుండా ఇశ్రాయేలు ప్రజల సామూహిక పౌరవ్యవస్థను కూడా సూచించగలదు; ‘పౌరసమాజం’ ఆ విస్తృతిని నిలుపుతుంది.
- source_word: ξένοι
  choice: పరదేశులుగా
  rationale: నిబంధనల పరిధికి వెలుపల ఉన్నవారనే సామాజిక, నిబంధనాత్మక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: διαθηκῶν τῆς ἐπαγγελίας
  choice: వాగ్దానానికి సంబంధించిన నిబంధనలకు
  rationale: διαθηκῶν యొక్క బహువచనాన్ని, ἐπαγγελίας యొక్క ఏకవచనాన్ని రెండింటినీ నిలిపి, వాటి మధ్య సంబంధాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐλπίδα μὴ ἔχοντες
  choice: నిరీక్షణ లేనివారిగా
  rationale: వారి అప్పటి స్థితిని తెలిపే కృదంత భావాన్ని సంక్షిప్తంగా, సహజంగా కొనసాగిస్తుంది.
- source_word: ἄθεοι ἐν τῷ κόσμῳ
  choice: లోకంలో దేవుడు లేనివారిగా
  rationale: ఆధునిక తాత్త్విక నాస్తికత్వాన్ని అనవసరంగా దిగుమతి చేయకుండా, నిజ దేవునికి వెలుపల ఉన్న దుస్థితిని తెలిపే మూలపదంలోని deprivation భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇశ్రాయేలు పౌరసమాజం, నిబంధనలు, వాగ్దానం అనే సమీప సందర్భం యూద నిబంధనాత్మక నేపథ్యాన్ని ముందుకు తెస్తోంది; కాబట్టి బిరుదు భావాన్ని ‘మెస్సీయ’ స్పష్టంగా నిలుపుతుంది.
- issue: ἄθεοι యొక్క భావం
  choice: దేవుడు లేనివారిగా
  alternative: దైవభక్తి లేనివారిగా / నాస్తికులుగా
  rationale: ఈ సందర్భంలో పదం తాత్త్వికంగా దేవుని ఉనికిని నిరాకరించడం కంటే నిజ దేవునితో సంబంధం లేని దుస్థితిని సూచించవచ్చు. ప్రధాన పాఠం ఆ ఉద్రిక్తతను పూర్తిగా పరిష్కరించకుండా ఉంచుతుంది; ప్రత్యామ్నాయ భావాన్ని పాదసూచిక తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. వాక్యం ముందరి జ్ఞాపకపరచే ఆజ్ఞపై ఆధారపడుతున్నందున ὅτιని ‘అంటే’తో అనుసంధానించాం. వరుసగా వచ్చే స్థితివాచక పదబంధాలను ‘-వారిగా’ రూపాలతో సమాంతరంగా ఉంచాం.
