translation:
  language: te
  text: ఆయనలో భవనమంతా[a] చక్కగా కలపబడుతూ, ప్రభువులో పవిత్రమైన ఆలయంగా ఎదుగుతోంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రతి భవనం.” ఈ గ్రీకు పదబంధాన్ని విభాగార్థంలో “ప్రతి భవనం” అనీ, సమష్టి భావంలో “భవనమంతా” అనీ అర్థం చేసుకోవచ్చు. సందర్భంలోని ఏకీకృత ఆలయ రూపకాన్ని అనుసరించి ప్రధాన పాఠంలో “భవనమంతా” అని ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ఆయనలో
  rationale: సంబంధబోధక సర్వనామం ముందున్న క్రీస్తును సూచించడం సందర్భానికి సహజం; వ్యక్తిగత సూచనను తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: πᾶσα οἰκοδομὴ
  choice: భవనమంతా
  rationale: నిర్దేశక పదం లేని ఈ ఏకవచన గ్రీకు పదబంధం ‘భవనమంతా’ లేదా ‘ప్రతి భవనం’ అని అర్థమివ్వగలదు. యూదులు, అన్యజనులు కలిసి ఒకే ఆలయంగా నిర్మించబడుతున్న సందర్భానికి సమష్టి భావం సరిపోతుంది; ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: συναρμολογουμένη
  choice: ఒకదానితో ఒకటి చక్కగా అమర్చబడుతూ
  rationale: వర్తమానకాల కర్మణి కృదంతం, వేర్వేరు భాగాలు నిరంతరం సమన్వయంతో కలిపి అమర్చబడుతున్న నిర్మాణ చిత్రాన్ని వ్యక్తం చేస్తుంది.
- source_word: αὔξει
  choice: ఎదుగుతోంది
  rationale: వర్తమానకాల క్రియ కొనసాగుతున్న అభివృద్ధిని సూచిస్తుంది; భవనం సజీవంగా పెరుగుతున్న పౌలు రూపకాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: εἰς
  choice: ఆలయంగా
  rationale: ఇక్కడ εἰς గమ్యం లేదా ఫలితాన్ని సూచిస్తుంది; ‘ఆలయంగా ఎదుగుతోంది’ అనే రూపం ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ναὸν ἅγιον
  choice: పవిత్రమైన ఆలయం
  rationale: ναός విస్తృత ఆలయ ప్రాంగణం కంటే ఆలయ పవిత్రస్థానాన్ని సూచిస్తుంది. సాధారణ పాఠకులకు ‘పవిత్రమైన ఆలయం’ స్పష్టంగా ఉండి మూలార్థాన్ని కాపాడుతుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు వాడిన సంబంధం లేదా పరిధి యొక్క విస్తృత భావాన్ని అతిగా వివరించకుండా నిలుపుతుంది; κύριοςకు ‘ప్రభువు’ అనే ప్రామాణిక పదం వాడబడింది.
theological_decisions:
- issue: ᾧ అనే సర్వనామం వ్యక్తిగతంగా క్రీస్తును సూచిస్తుందా, లేక నిర్మాణ రూపకాన్ని సూచిస్తుందా
  choice: క్రీస్తును వ్యక్తిగతంగా సూచించే ‘ఆయనలో’
  alternative: నిర్మాణాన్ని సూచించే ‘దానిలో’
  rationale: ముందరి వచనంలో క్రీస్తు యేసే మూలరాయి అని చెప్పబడటం, అలాగే ఈ సందర్భంలో పౌలు పదేపదే వాడే ‘ఆయనలో’ భాష వ్యక్తిగత క్రీస్తు సూచనకు బలం ఇస్తాయి.
- issue: πᾶσα οἰκοδομὴ సమష్టిగా ‘భవనమంతా’ అనాలా, విభాగార్థంగా ‘ప్రతి భవనం’ అనాలా
  choice: సమష్టి భావంలోని ‘భవనమంతా’
  alternative: విభాగార్థంలోని ‘ప్రతి భవనం’
  rationale: ఎఫెసీయులు 2:14–22లో యూదులు, అన్యజనులు ఒకే కొత్త మానవ సమూహంగా, ఒకే ఆలయంగా కలిపి నిర్మించబడుతున్న ఐక్యత ప్రధానంగా ఉంది. అయినా గ్రీకు వ్యాకరణం ప్రత్యామ్నాయ పఠనాన్ని అనుమతిస్తుంది కాబట్టి దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. నిర్మాణ రూపకంలోని భాగాల పరస్పర అమరికను స్పష్టంగా చూపిస్తూ, ‘ఆయనలో’ మరియు ‘ప్రభువులో’ అనే రెండు సంబంధ పదబంధాల విస్తృత ధార్మిక భావాన్ని యథాతథంగా నిలుపుతుంది.
