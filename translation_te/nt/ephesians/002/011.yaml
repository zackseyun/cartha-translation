revisions:
- from: కాబట్టి, ఒకప్పుడు శరీరరీత్యా అన్యజనులైన మీరు[a]—శరీరంలో చేతులతో చేయబడిన “సున్నతి” అని పిలువబడేదాని చేత “సున్నతిలేనివారు” అని పిలువబడే మీరు[b][c]—
  to: కాబట్టి, ఒకప్పుడు శరీరరీత్యా అన్యజనులైన మీరు, శరీరంలో చేతులతో చేయబడిన “సున్నతి” అని పిలువబడేదాని చేత “సున్నతిలేనివారు” అని పిలువబడేవారని జ్ఞాపకం చేసుకోండి—
  rationale: The revision restores the omitted imperative μνημονεύετε as ‘జ్ఞాపకం చేసుకోండి’ and removes the unnecessary second ‘మీరు.’ It retains the draft's careful treatment of Gentile identity, the quoted labels, the rhetorical qualification ‘అని పిలువబడేది,’ and the physical/human-made description of circumcision. The dash is retained because the Greek sentence continues into verse 12.
