id: EPH.2.11
reference: Ephesians 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὸ μνημονεύετε ὅτι ⸂ποτὲ ὑμεῖς⸃ τὰ ἔθνη ἐν σαρκί, οἱ λεγόμενοι ἀκροβυστία ὑπὸ τῆς λεγομένης περιτομῆς ἐν σαρκὶ χειροποιήτου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/011.yaml
  text: Therefore remember that formerly you[a], the Gentiles in the flesh[d][c][b], who are called “uncircumcision” by what is called “circumcision,” made by hands in the flesh—
translation:
  language: te
  text: కాబట్టి, ఒకప్పుడు శరీరరీత్యా అన్యజనులైన మీరు, శరీరంలో చేతులతో చేయబడిన “సున్నతి” అని పిలువబడేదాని చేత “సున్నతిలేనివారు” అని పిలువబడేవారని జ్ఞాపకం చేసుకోండి—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణాత్మక సంధిని సహజమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: μνημονεύετε
  choice: జ్ఞాపకం చేసుకోండి
  rationale: బహువచన ఆజ్ఞారూపాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది; వాక్యం 12వ వచనంలో కొనసాగుతున్నందున ఈ క్రియకు సంబంధించిన భావం తరువాత పూర్తవుతుంది.
- source_word: ποτὲ ὑμεῖς
  choice: ఒకప్పుడు ... మీరు
  rationale: గతస్థితిని సూచించే కాలభేదాన్నీ, ὑμεῖς మీదున్న ఉద్ఘాటననూ నిలుపుతుంది.
- source_word: τὰ ἔθνη
  choice: అన్యజనులు
  rationale: ఈ యూదు–యూదేతర సందర్భంలో రాజకీయ ‘దేశాలు’ కంటే యూదులు కానివారిని సూచించే ప్రాచుర్యమైన తెలుగు పదం.
- source_word: ἐν σαρκί
  choice: శరీరరీత్యా
  rationale: ఇక్కడ σάρξ పాపస్వభావాన్ని కాదు, శారీరకంగా గుర్తించబడే జాతి–నిబంధన స్థితిని సూచిస్తుంది; తెలుగులో అర్థస్పష్టత కోసం సహజమైన రూపం వాడబడింది.
- source_word: οἱ λεγόμενοι ἀκροβυστία
  choice: “సున్నతిలేనివారు” అని పిలువబడే
  rationale: సామాజికంగా పెట్టబడిన సమూహపేరును సహజమైన తెలుగులో తెలియజేస్తూ, కర్తరి అర్థాన్ని చేర్చకుండా కర్మణి రూపాన్ని నిలుపుతుంది.
- source_word: ὑπὸ τῆς λεγομένης περιτομῆς
  choice: “సున్నతి” అని పిలువబడేదాని చేత
  rationale: రెండవ λεγομένης వల్ల కలిగే వాక్చాతుర్య దూరాన్ని, మొదటి ‘పిలువబడే’తో ఉన్న సమాంతరతను కాపాడుతుంది; దానిని నేరుగా ‘నిజమైన సున్నతి’గా నిర్ధారించదు.
- source_word: ἐν σαρκὶ χειροποιήτου
  choice: శరీరంలో చేతులతో చేయబడిన
  rationale: χειροποίητος యొక్క ‘చేతులతో చేయబడిన’ భావాన్నీ, ఇది బాహ్య శారీరక క్రియ అనే అంశాన్నీ స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: σάρξ యొక్క నైతికం కాని ప్రయోగం
  choice: శరీరరీత్యా / శరీరంలో
  alternative: శరీరం; దేహపరంగా; శరీరస్వభావంలో
  rationale: ఇక్కడ పదం పాపస్వభావాన్ని సూచించదు. మొదటి ప్రయోగం జాతి–సామాజిక శారీరక స్థితిని, రెండవది సున్నతి జరిగే శరీరాన్ని సూచిస్తుంది; రెండు చోట్ల సందర్భానుసారంగా భేదం స్పష్టమైంది.
- issue: λεγομένης περιτομῆς లోని విమర్శాత్మక దూరం
  choice: “సున్నతి” అని పిలువబడేది
  alternative: సున్నతి పొందినవారు; పేరుకు మాత్రమే సున్నతి
  rationale: ‘పేరుకు మాత్రమే’ అనడం మూలంలో ఉన్నదానికంటే విమర్శను బలపరుస్తుంది; కేవలం ‘సున్నతి పొందినవారు’ అనడం λεγομένης యొక్క దూరాన్ని తొలగిస్తుంది. ఎంచుకున్న రూపం ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
- issue: ‘సున్నతి/సున్నతిలేనితనం’ అనే నిబంధనాత్మక-జాతి సమూహపేర్లు
  choice: ఉద్ధరణ చిహ్నాలతో “సున్నతి” మరియు “సున్నతిలేనివారు”
  alternative: కేవలం శరీర నిర్మాణ వివరణగా అనువదించడం
  rationale: ఇవి ఈ సందర్భంలో శారీరక స్థితిని మాత్రమే కాక సమూహ గుర్తింపులను సూచిస్తున్నాయి; ఉద్ధరణ చిహ్నాలు ఆ పేర్లుగా వాడబడుతున్న భావాన్ని చూపుతాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి. మూలవాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘవిరామం ఉంచబడింది. ‘శరీరరీత్యా’ అర్థస్పష్టతను ఇస్తుంది; ‘చేతులతో చేయబడిన’ మూలంలోని ఉద్దేశపూర్వక బాహ్యతను నిలుపుతుంది.
