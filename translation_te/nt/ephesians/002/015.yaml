lexical_decisions:
- source_word: νόμον τῶν ἐντολῶν
  choice: ఆజ్ఞల ధర్మశాస్త్రం
  rationale: νόμος అనే నిబంధనాత్మక భావాన్ని ‘ధర్మశాస్త్రం’ స్పష్టంగా తెలియజేస్తుంది; ἐντολῶν అనే సంబంధవిభక్తి రూపాన్ని ‘ఆజ్ఞల’గా నిలుపుతుంది.
- source_word: ἐν δόγμασιν
  choice: విధుల్లో వ్యక్తమైన
  rationale: δόγμασινకు ‘విధులు/శాసనాలు’ అనే భావం ఉంది. ఇక్కడ ἐνతో దానికి ఆజ్ఞల ధర్మశాస్త్రంతో ఉన్న సంబంధం వ్యాకరణపరంగా కొంత అనిశ్చితమైనది; ‘విధుల్లో వ్యక్తమైన’ అనేది చదవడానికి సహజంగా ఉండి ఒక సాధ్యమైన సంబంధాన్ని చూపుతుంది, ప్రత్యామ్నాయాలను పాదసూచికలో ఉంచుతుంది.
- source_word: καταργήσας
  choice: రద్దుచేసి
  rationale: నిర్ణాయకంగా అమల్లో లేకుండా చేయడం లేదా రద్దుచేయడం అనే బలమైన సందర్భార్థాన్ని, పూర్వక్రియను సూచించే కృదంత నిర్మాణంతో తెలుగులో అందిస్తుంది.
- source_word: τοὺς δύο
  choice: ఆ ఇద్దరినీ
  rationale: యూదులు, అన్యజనులు అనే సమీప సందర్భంలోని రెండు వర్గాలను సూచించే స్పష్టమైన సంఖ్యను నిలుపుతుంది.
- source_word: κτίσῃ
  choice: సృష్టించి
  rationale: κτίζωలోని నూతన సృష్టి భావాన్ని ‘రూపొందించి’ కంటే ‘సృష్టించి’ మెరుగ్గా కాపాడుతుంది.
- source_word: ἐν αὑτῷ
  choice: తనలో
  rationale: అన్యోన్య సర్వనామ భావాన్ని సహజమైన తెలుగులో నిలుపుతూ, ఏకీకరణ క్రీస్తులోనే జరుగుతుందని వ్యక్తపరుస్తుంది.
- source_word: εἰς ἕνα καινὸν ἄνθρωπον
  choice: ఒక కొత్త మనిషిగా
  rationale: ఏకవచన సామూహిక రూపకాన్ని యథాశక్తి నిలుపుతుంది; ‘కొత్త మానవజాతిగా’ అనేది దాని సామూహిక అర్థాన్ని ముందుగానే వివరిస్తుంది.
- source_word: ποιῶν εἰρήνην
  choice: శాంతిని కలిగించి
  rationale: శాంతిని ఉత్పన్నం చేయడం అనే క్రియాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἵνα
  choice: కలిగించడానికి
  rationale: ἵνα సూచించే ఉద్దేశాన్ని తెలుగు క్రియార్థక రూపంతో తెలియజేస్తుంది.
theological_decisions:
- issue: ἄνθρωπον అనే ఏకవచన సామూహిక రూపకం
  choice: ఒక కొత్త మనిషి
  alternative: ఒక కొత్త మానవత్వం / కొత్త మానవ సమూహం
  rationale: సందర్భం యూదులు, అన్యజనులు కలిసి ఏర్పడే సామూహిక ఐక్యతను సూచించినా, మూలపాఠంలోని ఏకవచన ‘మనిషి’ రూపకాన్ని ప్రధాన పాఠంలో నిలిపి దాని సామూహిక భావాన్ని పాదసూచికలో వివరిస్తుంది.
- issue: καταργήσας వల్ల ధర్మశాస్త్రానికి కలిగిన పరిణామం
  choice: రద్దుచేసి
  alternative: నిష్ప్రభం చేసి / అమల్లో లేకుండా చేసి
  rationale: పౌలు ఉపయోగించిన బలమైన క్రియను తగ్గించకుండా అనువదిస్తుంది. అదే సమయంలో దాని కర్మను ‘విధుల్లో వ్యక్తమైన ఆజ్ఞల ధర్మశాస్త్రం’గా పరిమితం చేసి, వచనం చెప్పని విస్తృత సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
- issue: ἐν αὑτῷ ఏ క్రియాంశంతో ప్రధానంగా అనుసంధానమవుతుంది
  choice: ఆ ఇద్దరినీ తనలో ఒక కొత్త మనిషిగా సృష్టించి
  alternative: ఆ ఇద్దరినీ ఒక కొత్త మనిషిగా తనలో సృష్టించి
  rationale: గ్రీకు పదక్రమానికి దగ్గరగా ‘తనలో’ను κτίσῃ తరువాత ఉంచింది. అయితే అది సృష్టి జరిగే పరిధిని లేదా ఏర్పడిన కొత్త మనిషి క్రీస్తులో ఉండడాన్ని నొక్కవచ్చు; ప్రత్యామ్నాయ పదక్రమాన్ని పాదసూచికలో ఉంచి ఈ స్వల్ప అనిశ్చితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. మూలంలోని కొనసాగుతున్న వాక్యభాగ స్వభావాన్ని చివరి కామాతో నిలిపింది; ‘ధర్మశాస్త్రం,’ ‘ఆజ్ఞలు,’ ‘విధులు,’ ‘సృష్టించడం’ వంటి నిబంధనాత్మక మరియు నూతన-సృష్టి పదాలను ఉద్దేశపూర్వకంగా కాపాడింది.
