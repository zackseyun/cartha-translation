  terminology: ‘మెస్సీయ’ అనేది Χριστός బిరుదు అర్థాన్ని కాపాడే సరైన ఎంపిక; ప్రత్యామ్నాయ సంప్రదాయ రూపం ‘క్రీస్తు’ పాదసూచికలో ఇవ్వబడింది. ‘కృప,’ ‘రక్షించబడి ఉన్నారు,’ ‘అపరాధాలు’ వంటి పదాలు స్థిరపడినవి మరియు అర్థగ్రాహ్యమైనవి.
