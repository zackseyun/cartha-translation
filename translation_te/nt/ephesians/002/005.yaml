  source_fidelity: మూలంలోని concessive/temporal participial భావాన్ని ‘మృతులమై ఉన్నప్పటికీ’ తగిన విధంగా వ్యక్తపరుస్తుంది. ‘అపరాధాల్లో’ దత్తి విభక్తిలోని స్థితి/సంబంధ భావాన్ని కారణార్థంగా నిర్ధారించకుండా నిలుపుతుంది. συνεζωοποίησεν యొక్క ‘సజీవులుగా చేశాడు’ మరియు τῷ Χριστῷ యొక్క సహవాస భావం ‘మెస్సీయతోపాటు’లో ఉన్నాయి. ‘కృపచేత మీరు రక్షించబడి ఉన్నారు’ పరిభాషాత్మక పరిపూర్ణకాలంలోని కర్మణి ఫలితస్థితిని సముచితంగా తెలియజేస్తుంది.
