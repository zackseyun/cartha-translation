id: EPH.2.5
reference: Ephesians 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὄντας ἡμᾶς νεκροὺς τοῖς παραπτώμασιν συνεζωοποίησεν τῷ Χριστῷ— χάριτί ἐστε σεσῳσμένοι—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/005.yaml
  text: even when we were dead in our trespasses[a], he made us alive together with Messiah—by grace you have been saved—
translation:
  language: te
  text: మన అపరాధాల్లో మృతులమై ఉన్నప్పటికీ, ఆయన మనలను మెస్సీయతోపాటు[a] సజీవులుగా చేశాడు—కృపచేత మీరు రక్షించబడి ఉన్నారు—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తుతోపాటు.’ గ్రీకు Χριστός అనే బిరుదుకు ‘మెస్సీయ’ అని అర్థం; సంప్రదాయ తెలుగు అనువాదాల్లో సాధారణంగా ‘క్రీస్తు’ అని ఉంటుంది.
    reason: Χριστός అనే బిరుదుకు అర్థాన్ని తెలిపే అనువాదంతోపాటు సంప్రదాయ రూపాన్ని కూడా నమోదు చేయడం.
lexical_decisions:
- source_word: ὄντας ἡμᾶς νεκροὺς
  choice: మనము మృతులమై ఉన్నప్పటికీ
  rationale: ఈ కృదంత నిర్మాణంలో కాలార్థం, విరుద్ధార్థం రెండూ సందర్భంలో వినిపిస్తాయి. ‘ఉన్నప్పటికీ’ దేవుని చర్యకు ఎదురుగా ఉన్న మానవ స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τοῖς παραπτώμασιν
  choice: మన అపరాధాల్లో
  rationale: దత్తి విభక్తి ఇక్కడ అపరాధాల పరిధిలో లేదా వాటికి సంబంధించి మృతులై ఉండడాన్ని సూచిస్తుంది. కారణార్థాన్ని తప్పనిసరిగా నిర్ణయించకుండా ‘అపరాధాల్లో’ అనే రూపం మూలంలోని భావవిస్తృతిని నిలుపుతుంది; ‘మన’ అనేది మొదటి పురుష బహువచన సందర్భం నుంచి స్పష్టమవుతుంది.
- source_word: συνεζωοποίησεν
  choice: మనలను ... తోపాటు సజీవులుగా చేశాడు
  rationale: సంయుక్త క్రియలోని సజీవులుగా చేయడం, మరొకరితో కలిసి చేయడం అనే రెండు అంశాలనూ ఈ రూపం నిలుపుతుంది.
- source_word: τῷ Χριστῷ
  choice: మెస్సీయతోపాటు
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తోంది. ‘మెస్సీయ’ దాని అభిషిక్త రాజు భావాన్ని నిలుపుతుంది; ‘తోపాటు’ సహవాస దత్తి విభక్తిని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: χάριτί
  choice: కృపచేత
  rationale: దత్తి విభక్తి సాధనార్థాన్ని సూచిస్తుంది. ‘కృప’ స్థిరపడిన, అర్థవంతమైన తెలుగు దైవశాస్త్ర పదం.
- source_word: ἐστε σεσῳσμένοι
  choice: మీరు రక్షించబడి ఉన్నారు
  rationale: ఈ పరిభాషాత్మక పరిపూర్ణకాల రూపం పూర్తయిన కార్యం వల్ల కొనసాగుతున్న ప్రస్తుత స్థితిని, అలాగే కర్మణి ప్రయోగాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Χριστῷ పదపు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός బిరుదు భావాన్ని ఇంకా కలిగి ఉంది. ‘మెస్సీయ’ ఆ భావాన్ని ప్రత్యక్షంగా నిలుపుతుంది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఇస్తుంది.
- issue: χάριτί ἐστε σεσῳσμένοι అనే మధ్యప్రవేశ వాక్యభాగపు బలం
  choice: డాష్‌ల మధ్య ఆకస్మిక మధ్యప్రవేశంగా నిలుపుట
  alternative: వాక్యంలో విరామ ప్రాధాన్యం లేకుండా కలిపివేయుట
  rationale: పౌలు అకస్మాత్తుగా చేర్చిన ఈ మాట కృపపై ప్రత్యేక దృష్టి పెడుతూ 8–9 వచనాల్లోని వివరణను ముందుగానే సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సజీవులుగా చేశాడు,’ ‘రక్షించబడి ఉన్నారు’ అనే రూపాలు మూలంలోని క్రియాబలాన్ని, ఫలితస్థితిని నిలుపుతాయి. మొదటి పురుష బహువచనం నుంచి రెండవ పురుష బహువచనానికి జరిగే మార్పును మూలం ప్రకారమే ఉంచాం.
