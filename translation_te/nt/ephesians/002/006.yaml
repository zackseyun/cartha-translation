id: EPH.2.6
reference: Ephesians 2:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ συνήγειρεν καὶ συνεκάθισεν ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/002/006.yaml
  text: and raised us up with him and seated us with him in the heavenly places in Messiah Jesus[b][a],
translation:
  language: te
  text: మనలను ఆయనతో పాటు లేపి, పరలోక ప్రాంతాల్లో[b] మెస్సీయ యేసులో[a] ఆయనతో పాటు కూర్చోబెట్టాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు యేసులో.”
    reason: alternative_reading
  - marker: b
    text: లేదా, “పరలోక స్థలాల్లో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγειρεν
  choice: మనలను ఆయనతో పాటు లేపి
  rationale: συν- ఉపసర్గ సూచించే యేసుతో ఉమ్మడి భాగస్వామ్యాన్ని ‘ఆయనతో పాటు’ అని స్పష్టంగా వ్యక్తం చేసింది. ‘మనలను’ అనేది ముందటి వాక్య సందర్భం నుంచి వస్తుంది.
- source_word: συνεκάθισεν
  choice: ఆయనతో పాటు కూర్చోబెట్టాడు
  rationale: కలిసి కూర్చోబెట్టడం అనే క్రియార్థాన్ని సహజమైన తెలుగులో నిలుపుతుంది; ‘సింహాసనంపై కూర్చోబెట్టాడు’ అని అనువదించి మూలంలో స్పష్టంగా లేని భావాన్ని చేర్చలేదు.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: పరలోక ప్రాంతాల్లో
  rationale: ఈ విశేషణాత్మక బహువచన ప్రయోగం పరలోక పరిధి లేదా స్థలాలను సూచిస్తుంది. ‘ప్రాంతాల్లో’ అనేది ఆ పరిధి భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: Χριστός ఇక్కడ యేసుకు సంబంధించిన బిరుదు భావాన్ని కలిగి ఉంది; ‘మెస్సీయ’ ఆ అభిషిక్త రాజు భావాన్ని అనువదిస్తుంది.
- source_word: καὶ
  choice: మరియు భావాన్ని క్రియల వరుస ద్వారా వ్యక్తీకరించడం
  rationale: ఈ వచనం ముందటి వాక్యానికి కొనసాగింపు. తెలుగులో కృదంత క్రియ ‘లేపి’ ద్వారా అనుసంధానం సహజంగా వ్యక్తమవుతుంది; చివరి క్రియ వాక్యాన్ని పూర్తిచేస్తుంది.
theological_decisions:
- issue: συν- సంయుక్త క్రియల్లో యేసుతో ఐక్యత
  choice: రెండు క్రియలలోనూ ‘ఆయనతో పాటు’ అని స్పష్టంగా అనువదించడం
  alternative: ‘మనలను లేపి, కూర్చోబెట్టాడు’ అని సంబంధాన్ని సూచ్యంగా ఉంచడం
  rationale: συνήγειρεν, συνεκάθισεν అనే రెండు క్రియలూ క్రీస్తుతో కలిసి ఆ కార్యాల్లో పాలుపొందడాన్ని తెలియజేస్తాయి. ‘ఆయనతో పాటు’ మూలంలోని భావాన్ని మించి వెళ్లకుండా దాన్ని స్పష్టం చేస్తుంది.
- issue: Χριστῷ అనే పదాన్ని బిరుదుగా లేదా పేరులో భాగంలా అనువదించడం
  choice: మెస్సీయ యేసులో
  alternative: క్రీస్తు యేసులో
  rationale: ఇక్కడ Χριστός యొక్క ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు భావాన్ని పాఠకుడికి అందుబాటులో ఉంచుతుంది; విస్తృతంగా పరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: ἐν τοῖς ἐπουρανίοις యొక్క స్థల/పరిధి భావం
  choice: పరలోక ప్రాంతాల్లో
  alternative: పరలోక స్థలాల్లో
  rationale: గ్రీకు ప్రయోగం నామవాచకం లేకుండా ఉన్న విశేషణాత్మక బహువచనం. అందువల్ల ఖచ్చితమైన భౌతిక స్థలాలకే పరిమితం చేయకుండా పరలోక పరిధి భావాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ఇది ముందు వచనం నుంచి కొనసాగే వాక్యభాగం కావడంతో మొదటి క్రియను ‘లేపి’ అనే కృదంత రూపంలో ఉంచి, చివరి క్రియతో వాక్యాన్ని పూర్తిచేశాం. ‘ఆయన’ అనేది సందర్భంలోని మెస్సీయ యేసును సూచిస్తుంది.
