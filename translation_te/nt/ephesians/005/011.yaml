- issue: నిషేధ ఆజ్ఞకు, సానుకూల ఆజ్ఞకు మధ్య వ్యత్యాస బలం
  choice: పాలుపంచుకోకండి; దానికి బదులుగా ... కూడా చేయండి
  alternative: పాలుపంచుకోకండి; వాటిని గద్దించండి
  rationale: మూల వాక్యం దుష్క్రియలకు దూరంగా ఉండటంతో ఆగకుండా వాటికి క్రియాశీలంగా ఎదురునిలవాలని చెబుతుంది. అయితే దాన్ని ఒక నిర్దిష్ట కార్యవిధానంగా విస్తరించకుండా గ్రీకు వాక్యంలోని ఉద్రిక్తతను అలాగే ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ఆజ్ఞారూపాలు వాడబడ్డాయి. ‘ఫలించని’ ద్వారా మూలంలోని వ్యవసాయ రూపకం, ‘చీకటికి చెందిన’ మరియు ‘బట్టబయలు’ ద్వారా వెలుగు–చీకటి నేపథ్యం నిలుపబడ్డాయి. రెండు పాదటిప్పణి సూచికలూ ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
