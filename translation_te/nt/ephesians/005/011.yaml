lexical_decisions:
- source_word: συγκοινωνεῖτε
  choice: పాలుపంచుకోకండి
  rationale: ఈ క్రియ ఇతరులతో కలిసి దేనిలోనైనా భాగం వహించడం లేదా పాలుపంచుకోవడం అనే భావాన్ని ఇస్తుంది. ‘పాలుపంచుకోకండి’ ఆధునిక తెలుగులో సహజంగా ఉండి, క్రియాశీల భాగస్వామ్యాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἔργοις
  choice: క్రియల్లో
  rationale: ‘క్రియలు’ పౌలు వాడే నైతిక పదజాలంతో అనుసంధానాన్ని నిలుపుతుంది; ఇక్కడ విభక్తి ప్రకారం ‘క్రియల్లో’ అని అనువదించబడింది.
- source_word: ἀκάρποις
  choice: ఫలించని
  rationale: మూలంలోని ఫలసంబంధ రూపకాన్ని ‘ఫలించని’ సహజమైన తెలుగులో నిలుపుతుంది; పరిసర వచనాల్లోని ఫలవంతమైన జీవనానికి వ్యతిరేక భావాన్ని కూడా కాపాడుతుంది.
- source_word: σκότους
  choice: చీకటికి చెందిన
  rationale: ‘చీకటి యొక్క’ కంటే ఇది సహజమైన తెలుగు. క్రియలు చీకటి పరిధికి లేదా స్వభావానికి చెందినవనే సంబంధాన్ని చూపుతూ, ‘చీకటిలో చేసిన’ అని అతిగా నిర్దిష్టం చేయదు.
- source_word: μᾶλλον δὲ καὶ
  choice: దానికి బదులుగా ... కూడా
  rationale: 'ఈ పదబంధం వ్యత్యాసంతోపాటు అదనపు బలాన్ని ఇస్తుంది: వాటిలో పాలుపంచుకోకపోవడమే కాక వాటిని బట్టబయలు చేయాలి. తెలుగు వాక్యనిర్మాణంలో ‘దానికి బదులుగా ... కూడా’ ఈ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.'
- source_word: ἐλέγχετε
  choice: బట్టబయలు చేయండి
  rationale: ఈ సందర్భంలోని వెలుగు–చీకటి రూపకానికి అనుగుణంగా దుష్క్రియలను వెలుగులోకి తెచ్చి అవి ఏమిటో చూపించే భావాన్ని వ్యక్తం చేస్తుంది; అదే సమయంలో ఈ క్రియలోని గద్దింపు లేదా తప్పును నిరూపించే సాధ్యమైన భావాన్ని పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: దుష్క్రియలకు సంబంధించి ἐλέγχετε యొక్క భావం
  choice: వాటిని బట్టబయలు చేయండి
  alternative: వాటిని గద్దించండి; వాటి తప్పును ఎత్తిచూపండి
