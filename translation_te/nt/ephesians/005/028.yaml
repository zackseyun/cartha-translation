id: EPH.5.28
reference: Ephesians 5:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως ὀφείλουσιν ⸀καὶ οἱ ἄνδρες ἀγαπᾶν τὰς ἑαυτῶν γυναῖκας ὡς τὰ ἑαυτῶν σώματα· ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα ἑαυτὸν ἀγαπᾷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/028.yaml
  text: In the same way, husbands also ought to love their own wives as their own bodies. He who loves his own wife loves himself,
translation:
  language: te
  text: అదే విధంగా భర్తలు కూడా తమ సొంత శరీరాలను ప్రేమించినట్లుగా తమ సొంత భార్యలను ప్రేమించాలి. తన సొంత భార్యను ప్రేమించేవాడు తనను తానే ప్రేమిస్తాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: అదే విధంగా
  rationale: ముందటి ఉపమానానికీ ప్రస్తుత ఉపదేశానికీ ఉన్న సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὀφείλουσιν
  choice: ప్రేమించాలి
  rationale: నైతిక బాధ్యతను తెలుగులో సహజంగా వ్యక్తపరుస్తుంది; సందర్భంలో ఇది ఉపదేశాత్మక విధిని సూచిస్తుంది.
- source_word: καὶ οἱ ἄνδρες
  choice: భర్తలు కూడా
  rationale: καί యొక్క అదనపు భావాన్ని ‘కూడా’ నిలుపుతుంది; వివాహ సందర్భంలో ἄνδρες అంటే భర్తలు.
- source_word: τὰς ἑαυτῶν γυναῖκας
  choice: తమ భార్యలను
  rationale: వివాహ సంబంధ అర్థాన్ని స్పష్టంగా ఇస్తుంది; తెలుగు ‘తమ’లో reflexive స్వకీయ భావం సహజంగా ఉంది.
- source_word: ὡς τὰ ἑαυτῶν σώματα
  choice: తమ సొంత శరీరాలను ప్రేమించినట్లే
  rationale: ὡς తెలిపే పోలికను స్పష్టంగా నిలుపుతుంది; ‘సొంత’ పదం ἑαυτῶν యొక్క ఉద్ఘాటనను వ్యక్తపరుస్తుంది. తెలుగులో భావపూర్ణత కోసం ‘ప్రేమించిన’ను పోలికలో పునరుక్తం చేసింది.
- source_word: ὁ ἀγαπῶν τὴν ἑαυτοῦ γυναῖκα
  choice: తన భార్యను ప్రేమించేవాడు
  rationale: పురుష ఏకవచన సందర్భాన్ని సహజమైన తెలుగు సంబంధక్రియ నిర్మాణంలో నిలుపుతుంది; ‘తన’ reflexive సంబంధాన్ని తెలియజేస్తుంది.
- source_word: ἑαυτὸν ἀγαπᾷ
  choice: తనను తానే ప్రేమించుకుంటున్నాడు
  rationale: ἑαυτόν యొక్క reflexive ఉద్ఘాటనను ‘తనను తానే’ నిలుపుతుంది; మధ్యార్థక తెలుగు రూపం స్వయంపై ప్రేమను సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: గృహసంబంధ ఉపదేశంలోని లింగ నిర్దిష్ట భాష
  choice: οἱ ἄνδρες ను ‘భర్తలు’గా, ఏకవచన కర్తను ‘ప్రేమించేవాడు’గా అనువదించడం
  alternative: ‘పురుషులు’; లింగతటస్థమైన ‘ప్రేమించే వ్యక్తి’
  rationale: సందర్భం సాధారణ మానవుల గురించి కాకుండా భర్తలకు ఇచ్చే వివాహ ఉపదేశం గురించి మాట్లాడుతోంది; కాబట్టి మూలంలోని లింగ, సంబంధ నిర్దిష్టతను నిలిపింది.
- issue: భార్యను ప్రేమించడం, తన శరీరాన్ని ప్రేమించడం మధ్య పోలిక
  choice: పోలికను స్పష్టంగా ఉంచి, భార్యను ప్రేమించడం తనను ప్రేమించుకోవడమే అనే పౌలు వాక్యాన్ని యథాతథంగా నిలపడం
  alternative: దీనిని భార్యాభర్తల మధ్య తాత్త్విక లేదా అధిభౌతిక ఏకత్వ ప్రకటనగా విస్తరించడం
  rationale: మూల వాక్యం నైతిక-సంబంధ పోలికను చేస్తుంది; అనువాదం అదనపు సిద్ధాంత వివరణను చేర్చకుండా దాని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన ఉపదేశ శైలి. మూలంలోని ‘ప్రేమ’ పదపునరుక్తిని నిలిపింది. పాదటిప్పణులు అవసరం లేదు.
