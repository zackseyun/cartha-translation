  rationale: గ్రీకు వాక్యనిర్మాణం పిల్లలుగా ఉన్న గుర్తింపును లేదా ఆ గుర్తింపుకు తగిన రీతిని ఆజ్ఞతో కలుపుతుంది; అనుకరణ వల్ల ఆ గుర్తింపు లభిస్తుందని చెప్పదు.
