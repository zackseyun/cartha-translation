translation:
  language: te
  text: ఎందుకంటే వారు రహస్యంగా చేసే పనుల గురించి మాట్లాడటం కూడా సిగ్గుచేటు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారు రహస్యంగా చేసే వాటి గురించి.”
    reason: τὰ ... γινόμενα అనే నామవాచకార్థక కృదంతాన్ని ‘పనులు’ అని స్పష్టంగా లేదా ‘వాటి’ అని మరింత సాధారణంగా తెలుగులో వ్యక్తపరచవచ్చు; ὑπ’ αὐτῶν యొక్క కర్తృభావం రెండింటిలోనూ నిలుస్తుంది.
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి కారణాన్ని వివరించే అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: τὰ ... γινόμενα
  choice: చేసే వాటిని
  rationale: ఆర్టికల్‌తో కూడిన వర్తమాన కృదంతం క్రియలను లేదా కార్యాలను నామవాచకార్థంలో సూచిస్తోంది. సందర్భంలోని కర్తను కలిపి ‘వారు ... చేసే వాటిని’ అనడం తెలుగులో సహజంగా ఉండి మూల భావాన్ని కాపాడుతుంది.
- source_word: κρυφῇ
  choice: రహస్యంగా
  rationale: దాచిపెట్టి జరిగే విధానాన్ని సూచించే క్రియావిశేషణ భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: ὑπ’ αὐτῶν
  choice: వారు
  rationale: గ్రీకులోని కర్తృకారక భావాన్ని తెలుగు క్రియాశీల వాక్యనిర్మాణంలో కర్తగా మార్చడం సహజం; ‘వారు’ అనే సర్వనామాన్ని అలాగే ఉంచి దాని పూర్వపదాన్ని వివరణాత్మకంగా చేర్చలేదు.
- source_word: αἰσχρόν
  choice: సిగ్గుచేటు
  rationale: నైతికంగా అవమానకరమైనది, సిగ్గుకరమైనది అనే బలాన్ని సాధారణ ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: καὶ λέγειν
  choice: మాట్లాడడం కూడా
  rationale: καί యొక్క అధిక్యార్థక బలాన్ని ‘కూడా’ ద్వారా నిలుపుతుంది; ‘వాటిని గురించి మాట్లాడడం’ అనేది తెలుగులో సహజమైన వ్యక్తీకరణ.
theological_decisions:
- issue: ὑπ’ αὐτῶν లోని సర్వనామం ఎవరిని సూచిస్తుంది
  choice: వచనంలో ‘వారు’ అని మాత్రమే ఉంచడం
  alternative: ‘చీకటి క్రియలు చేసేవారు’ లేదా ‘అవిధేయులు’ అని స్పష్టీకరించడం
  rationale: సర్వనామానికి పూర్వపదం పరిసర సందర్భం నుంచి తెలుస్తుంది. దానిని వచనంలో విస్తరించడం మూల గ్రీకు చెప్పినదానికంటే ఎక్కువ వివరణను చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. గ్రీకు నిష్క్రియ నిర్మాణాన్ని తెలుగులో సహజమైన క్రియాశీల నిర్మాణంగా మార్చి, సర్వనామంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలిపాం.
