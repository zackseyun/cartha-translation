review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys γάρ, the concealed manner (κρυφῇ), agency (‘they’), the ethical force of αἰσχρόν, and the ascensive force of καί (‘even/also’). However, ‘చేసే వాటిని’ gives an ongoing/habitual sense that is not required, and the Telugu phrase ‘వాటిని గురించి’ is grammatically awkward/redundant. The verse should retain the substantive, impersonal reference to deeds while expressing the agent naturally.
  naturalness: ‘ఎందుకంటే’ is natural, but the opening comma is unnecessary. ‘వారు రహస్యంగా చేసే వాటిని గురించి మాట్లాడడం’ is less idiomatic than ‘వారు రహస్యంగా చేసే పనుల గురించి మాట్లాడడం’ or, more tightly, ‘వారు రహస్యంగా చేసే పనుల గురించి మాట్లాడటం కూడా’. ‘పనుల’ makes the implicit deeds clear without specifying the pronoun’s antecedent.
  terminology: ‘సిగ్గుచేటు’ is an appropriate modern-standard Telugu rendering of αἰσχρόν. ‘రహస్యంగా’ suitably renders κρυφῇ. Use ‘పనుల గురించి మాట్లాడటం కూడా’ for the marked infinitive καὶ λέγειν, with ‘కూడా’ preserving the ascensive force.
  issues:
  - severity: medium
    issue: Awkward object-plus-postposition construction
    rationale: ‘వాటిని గురించి’ combines the accusative-like form ‘వాటిని’ with ‘గురించి’; standard idiom is ‘వాటి గురించి’ or ‘ఆ విషయాల గురించి.’
  - severity: low
    issue: Footnote alternative is not a clear lexical alternative and repeats the same awkward construction
    rationale: The note’s ‘వారు రహస్యంగా చేసేవాటి గురించి’ neither clearly represents the impersonal alternative (‘రహస్యంగా జరిగే/చేయబడే పనులు’) nor is it fully parallel to the main text. A revised note should present the source’s substantive/passive-form alternative naturally.
  revised_text: ఎందుకంటే వారు రహస్యంగా చేసే పనుల గురించి మాట్లాడటం కూడా సిగ్గుచేటు.[a]
