id: EPH.5.15
reference: Ephesians 5:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Βλέπετε οὖν ⸂ἀκριβῶς πῶς⸃ περιπατεῖτε, μὴ ὡς ἄσοφοι ἀλλ’ ὡς σοφοί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/015.yaml
  text: Therefore[b][a], watch carefully how you walk—not as unwise but as wise—
translation:
  language: te
  text: కాబట్టి, మీరు ఎలా జీవిస్తున్నారో చాలా జాగ్రత్తగా గమనించండి—అవివేకుల్లా కాకుండా, వివేకుల్లా జీవించండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βλέπετε
  choice: చూసుకోండి
  rationale: వర్తమానకాల ఆజ్ఞార్థక బహువచనం; అప్రమత్తంగా శ్రద్ధ పెట్టాలనే నిరంతర ప్రబోధాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀκριβῶς πῶς
  choice: ఎలా ... జాగ్రత్తగా
  rationale: ἀκριβῶς సూచించే శ్రద్ధాపూర్వక ఖచ్చితత్వాన్ని, πῶς సూచించే జీవన విధానాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో కలిపి వ్యక్తం చేస్తుంది.
- source_word: περιπατεῖτε
  choice: జీవిస్తున్నారు ... జీవించండి
  rationale: అక్షరార్థం ‘నడుస్తున్నారు’; పౌలు వాడిన జీవన ప్రవర్తన రూపకాన్ని సాధారణ తెలుగు పాఠకుడికి వెంటనే అర్థమయ్యే ‘జీవించడం’గా భావానుగుణంగా అందిస్తుంది.
- source_word: μὴ ὡς ἄσοφοι
  choice: అవివేకుల్లా కాక
  rationale: ἄσοφοι యొక్క ‘జ్ఞానం/వివేకం లేని’ భావాన్ని ‘మూర్ఖులు’ అనే మరింత కఠిన పదం లేకుండా తెలియజేస్తుంది; గ్రీకు పుంలింగ బహువచనం ఇక్కడ సంఘమంతటినీ ప్రతినిధిగా సూచిస్తుంది కాబట్టి తెలుగులో ప్రత్యేకంగా ‘పురుషులు’ అని చేర్చలేదు.
- source_word: ἀλλ’ ὡς σοφοί
  choice: వివేకుల్లా
  rationale: మునుపటి పదబంధంతో సమాంతరమైన వ్యతిరేకతను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ἄσοφοι / σοφοί అనే పుంలింగ బహువచన విశేషణాల పరిధి
  choice: అవివేకుల్లా ... వివేకుల్లా
  alternative: అవివేకులైన పురుషుల్లా ... వివేకులైన పురుషుల్లా
  rationale: గ్రీకు పుంలింగ బహువచన రూపాలు ఇక్కడ ప్రతినిధి/సామాన్య ప్రయోగంలో ఉండి విశ్వాస సమాజమంతటికీ వర్తిస్తాయి. తెలుగులో ‘పురుషులు’ చేర్చడం మూలంలో లేని లింగ పరిమితిని సూచించవచ్చు; అందువల్ల భావపరిధిని కాపాడే సహజ రూపం ఎంచుకోబడింది.
- issue: περιπατεῖτε లోని ‘నడవడం’ రూపకం
  choice: ముఖ్య పాఠ్యంలో ‘జీవించడం’గా భావాన్ని స్పష్టం చేయడం
  alternative: ‘ఎలా నడుస్తున్నారో’ అని రూపకాన్ని అక్షరార్థంగా నిలుపడం
  rationale: తెలుగులో సందర్భం లేకుండా ‘నడవడం’ శారీరక నడకగా సులభంగా అర్థమవుతుంది. పౌలు ఉద్దేశించిన జీవన ప్రవర్తన భావాన్ని ప్రధాన పాఠ్యంలో స్పష్టంగా ఇవ్వడం సాధారణ పాఠకుడికి సహజం; ఇందులో సిద్ధాంతపరమైన ప్రత్యేక వ్యాఖ్యానం చేర్చబడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం. సంక్షిప్తమైన, ప్రబోధాత్మక స్వరం మరియు ‘అవివేకులు/వివేకులు’ అనే వ్యతిరేక సమాంతరత నిలుపబడ్డాయి.
