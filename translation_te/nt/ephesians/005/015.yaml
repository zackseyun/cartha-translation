review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the inferential οὖν, the imperative force of Βλέπετε, and the contrast between ἄσοφοι and σοφοί. Its rendering of περιπατεῖτε as ‘live’ communicates the established ethical-life metaphor clearly. A small adjustment makes the intensified ἀκριβῶς more explicit and improves the connection of the final contrast to the manner of life.
  naturalness: The present Telugu is understandable and modern. Replacing ‘చూసుకోండి’ with ‘గమనించండి’ gives a more direct exhortation to attentive observation, and ‘కాకుండా’ makes the contrast flow more naturally in Telugu.
  terminology: ‘అవివేకులు’ and ‘వివేకులు’ appropriately render ἄσοφοι / σοφοί without importing a male-only limitation or making the negative term unnecessarily harsh. No theological terminology requires adjustment.
  issues:
  - severity: low
    issue: The degree of care expressed by ἀκριβῶς is somewhat understated.
    rationale: ‘జాగ్రత్తగా’ is viable, but ‘చాలా జాగ్రత్తగా’ better represents the emphatic adverb ἀκριβῶς in this exhortation.
  - severity: low
    issue: ‘చూసుకోండి’ can carry a reflexive sense (‘take care of/see to it’) in Telugu.
    rationale: ‘గమనించండి’ more directly expresses Βλέπετε as an injunction to pay close attention.
  revised_text: కాబట్టి, మీరు ఎలా జీవిస్తున్నారో చాలా జాగ్రత్తగా గమనించండి—అవివేకుల్లా కాకుండా, వివేకుల్లా జీవించండి.
  revised_footnotes: []
  revision_rationale: The revision preserves the source’s logical connection, imperative exhortation, ethical-life sense of ‘walk,’ and balanced unwise/wise contrast. It uses idiomatic modern Telugu while representing the emphasis of ἀκριβῶς more fully. No footnote is necessary because the rendered life-conduct sense is clear in Telugu and no textual ambiguity is involved.
