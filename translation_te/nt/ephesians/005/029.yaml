id: EPH.5.29
reference: Ephesians 5:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ποτε τὴν ἑαυτοῦ σάρκα ἐμίσησεν, ἀλλὰ ἐκτρέφει καὶ θάλπει αὐτήν, καθὼς καὶ ὁ ⸀Χριστὸς τὴν ἐκκλησίαν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/029.yaml
  text: For no one ever hated his own flesh[a], but nourishes and cherishes it, just as the Messiah also does the church[c][b],
translation:
  language: te
  text: ఎందుకంటే, ఎవ్వరూ ఎప్పుడూ తన సొంత దేహాన్ని[a] ద్వేషించలేదు; బదులుగా దానిని పోషిస్తూ ప్రేమగా చూసుకుంటాడు. అలాగే మెస్సీయ[b] కూడా సంఘాన్ని పోషిస్తూ ప్రేమగా చూసుకుంటాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూల గ్రీకు పదానికి అక్షరార్థం ‘తన సొంత మాంసం’; ఇక్కడ అది వ్యక్తి యొక్క భౌతిక దేహాన్ని సూచిస్తుంది, ‘పాపస్వభావాన్ని’ కాదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘క్రీస్తు.’ ‘మెస్సీయ’ అంటే ‘అభిషిక్తుడు.’
    reason: title_explanation
lexical_decisions:
- source_word: οὐδεὶς γάρ ποτε
  choice: ఎందుకంటే, ఎవ్వరూ ఎప్పుడూ
  rationale: γάρ ముందున్న వాక్యానికి కారణాన్ని వివరిస్తుంది; οὐδεὶς ... ποτε కలిపి ‘ఎవ్వరూ ఎప్పుడూ’ అనే సార్వత్రిక నిరాకరణను ఇస్తాయి.
- source_word: τὴν ἑαυτοῦ σάρκα
  choice: తన సొంత శరీరాన్ని
  rationale: ఇక్కడ σάρξ పాపస్వభావాన్ని కాక, వ్యక్తి యొక్క భౌతిక దేహాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘శరీరం’ సహజంగా, స్పష్టంగా ఉంది; ‘సొంత’ ἑαυτοῦ లోని నొక్కిచెప్పడాన్ని నిలుపుతుంది.
- source_word: ἐμίσησεν
  choice: ద్వేషించలేదు
  rationale: μισέω యొక్క సాధారణ బలమైన అర్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ἐκτρέφει
  choice: పోషించి
  rationale: ఆహారం ఇచ్చి సంరక్షించడం అనే భావాన్ని ‘పోషించు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: θάλπει
  choice: ప్రేమగా చూసుకుంటారు
  rationale: ఈ సందర్భంలో కేవలం వెచ్చగా ఉంచడం కాక, ఆప్యాయంగా శ్రద్ధ తీసుకోవడం భావం ఉంది. ‘ప్రేమగా చూసుకోవడం’ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: καθὼς καὶ
  choice: అలాగే ... కూడా
  rationale: పోలికను, καί లోని అదనపు నొక్కును రెండింటినీ నిలుపుతుంది.
- source_word: ὁ Χριστὸς
  choice: క్రీస్తు
  rationale: Χριστόςకు తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన రూపం ‘క్రీస్తు’; దాని బిరుదు అర్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: τὴν ἐκκλησίαν
  choice: సంఘాన్ని
  rationale: ఇక్కడ ἐκκλησία విశ్వాసుల సమూహాన్ని సూచిస్తుంది; ‘సంఘం’ ఆధునిక ప్రామాణిక తెలుగు బైబిల్ వాడుకలో స్పష్టమైన సమానార్థకం.
theological_decisions:
- issue: Χριστόςను బిరుదుగా అనువదించడం
  choice: ప్రధాన పాఠ్యంలో ‘క్రీస్తు’, పాదసూచికలో ‘మెస్సీయ, అంటే అభిషిక్తుడు’
  alternative: మెస్సీయ
  rationale: ‘క్రీస్తు’ తెలుగు పాఠకులకు సుపరిచితమైన స్థిర రూపం. అయితే అది బిరుదు అనే విషయాన్ని, దాని అర్థాన్ని పాదసూచిక స్పష్టం చేస్తుంది; ఈ విధంగా పరిచితత్వం మరియు మూలార్థం రెండూ నిలుస్తాయి.
- issue: σάρξ యొక్క భావం
  choice: శరీరం
  alternative: దేహం; అక్షరార్థంగా ‘మాంసం’
  rationale: వివాహం–శరీరం పోలికలో ఇది వ్యక్తి యొక్క భౌతిక స్వరూపాన్ని సూచిస్తుంది; ‘పాపస్వభావం’ అనే వేదాంతార్థాన్ని ఇక్కడ చేర్చకూడదు.
- issue: చివరి ఉపవాక్యంలో క్రియల అధ్యాహారం
  choice: ‘పోషించి, ప్రేమగా చూసుకుంటాడు’ అని క్రియలను మళ్లీ స్పష్టంగా పేర్కొనడం
  alternative: ‘అలాగే క్రీస్తు కూడా సంఘాన్ని’ అని గ్రీకు అధ్యాహారాన్ని యథాతథంగా ఉంచడం
  rationale: గ్రీకులో ముందున్న క్రియలు చివరి భాగంలో అధ్యాహారంగా ఉన్నాయి. తెలుగులో వాటిని చెప్పకుండా వదిలితే వాక్యం అసంపూర్ణంగా అనిపిస్తుంది; పునరుక్తి మూల భావాన్ని మార్చకుండా సహజతను ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మొదటి వాక్యంలోని సార్వత్రిక ప్రకటనకు లింగనిరపేక్షంగా సహజమైన బహువచన క్రియారూపం వాడబడింది; క్రీస్తును సూచించే చివరి క్రియ ఏకవచనంలో ఉంది.
