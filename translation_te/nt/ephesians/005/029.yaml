  - severity: low
    issue: The finite plural “చూసుకుంటారు” following “ఎవ్వరూ” is less smooth in this formal aphoristic sentence.
    rationale: A singular form, with coordinated habitual verbs, better matches the negative-indefinite subject and reads more naturally.
