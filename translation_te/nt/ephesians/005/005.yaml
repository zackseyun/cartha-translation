id: EPH.5.5
reference: Ephesians 5:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο γὰρ ⸀ἴστε γινώσκοντες ὅτι πᾶς πόρνος ἢ ἀκάθαρτος ἢ πλεονέκτης, ⸀ὅ ἐστιν εἰδωλολάτρης, οὐκ ἔχει κληρονομίαν ἐν τῇ βασιλείᾳ τοῦ Χριστοῦ καὶ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/005.yaml
  text: For you know this[a], understanding that every sexually immoral or unclean or greedy person, who is an idolater[b], has no inheritance in the kingdom of Messiah and God.
translation:
  language: te
  text: 'ఎందుకంటే మీకు ఇది బాగా తెలుసు: లైంగిక దుర్నీతికి పాల్పడేవాడికైనా, అపవిత్రుడికైనా, దురాశపరుడికైనా—దురాశపరుడు విగ్రహారాధకుడే[a]—మెస్సీయ మరియు దేవుని రాజ్యంలో వారసత్వం లేదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “అది విగ్రహారాధన.” ఇది ముఖ్యంగా దురాశను సూచించే అవకాశం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἴστε γινώσκοντες
  choice: మీకు ఇది బాగా తెలుసు
  rationale: οἶδα క్రియతో γινώσκω యొక్క వర్తమాన కృదంతం కలసి నిశ్చితమైన, బలమైన జ్ఞానాన్ని వ్యక్తం చేస్తాయి. తెలుగులో సహజంగా ఉండేందుకు ‘బాగా తెలుసు’ అని ఇచ్చాం; వాక్యంలోని తరువాతి విషయమే వారు గ్రహించినదని నిర్మాణం తెలియజేస్తుంది.
- source_word: πόρνος
  choice: లైంగిక దుర్నీతికి పాల్పడేవాడు
  rationale: లైంగిక అనైతికతతో లక్షణీకరించబడిన వ్యక్తిని సూచిస్తుంది. ఈ రూపం ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంది; ఒకే రకమైన లైంగిక తప్పుకే అర్థాన్ని పరిమితం చేయదు.
- source_word: ἀκάθαρτος
  choice: అపవిత్రుడు
  rationale: పౌలు నైతిక దోషాల జాబితాల్లో ఇది విస్తృతమైన నైతిక అపవిత్రతను సూచించగలదు. ‘అపవిత్రుడు’ మూలపదంలోని శుద్ధి–అశుద్ధి రూపకాన్ని నిలుపుతుంది.
- source_word: πλεονέκτης
  choice: దురాశపరుడు
  rationale: మరింత సంపాదించాలనే స్వార్థపూరితమైన ఆశతో లక్షణీకరించబడిన వ్యక్తిని సూచిస్తుంది. ‘దురాశపరుడు’ సాధారణ ఆధునిక తెలుగులో సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: ὅ ἐστιν εἰδωλολάτρης
  choice: అతడు విగ్రహారాధకుడు
  rationale: సమీప సందర్భం మరియు కొలొస్సయులు 3:5లోని సమాంతర వాక్యం దురాశపరుడిని విగ్రహారాధకుడిగా వర్ణించే భావానికి మద్దతిస్తాయి. అయితే గ్రీకు నపుంసక సంబంధసర్వనామం వల్ల ‘అది విగ్రహారాధన’ అనే అర్థం కూడా సాధ్యమైనందున దాన్ని పాదసూచికలో ఉంచాం.
- source_word: κληρονομίαν
  choice: వారసత్వం
  rationale: నిబంధనాత్మక మరియు అంత్యకాలిక ప్రతిధ్వనులను నిలిపే పౌలు వాడే ప్రధాన భావపదం.
- source_word: βασιλείᾳ
  choice: రాజ్యం
  rationale: పాలనను, పాలిత పరిధిని రెండింటినీ కలిగి ఉండగల స్థిరమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός వ్యక్తిపేరుగా కాక బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని బిరుదు భావాన్ని స్పష్టంగా నిలిపేందుకు ‘మెస్సీయ’ అని అనువదించాం.
- source_word: τοῦ Χριστοῦ καὶ θεοῦ
  choice: మెస్సీయ మరియు దేవుని
  rationale: ఒకే ఉపపదంతో ఉన్న రెండు ఏకవచన సంబంధరూపాలను వ్యాఖ్యానపూర్వకంగా అతిగా నిర్ణయించకుండా గ్రీకు సమన్వయ నిర్మాణాన్ని సూటిగా నిలిపాం.
theological_decisions:
- issue: ὅ ἐστιν εἰδωλολάτρης దేనిని సూచిస్తుంది?
  choice: ముందు చెప్పిన వ్యక్తికి, ముఖ్యంగా దురాశపరుడికి వర్తింపజేసి ‘అతడు విగ్రహారాధకుడు’ అని ప్రధాన పాఠ్యంలో ఇచ్చాం.
  alternative: ‘అది విగ్రహారాధన’ అని తీసుకొని, ముఖ్యంగా దురాశనే విగ్రహారాధనగా పేర్కొనడం.
  rationale: నపుంసక సంబంధసర్వనామం వ్యాకరణపరమైన సందిగ్ధతను కలిగిస్తుంది. సందర్భం వ్యక్తిని వర్ణించడానికి మద్దతిచ్చినా, దురాశను విగ్రహారాధనగా గుర్తించే భావం కూడా నిజమైన ప్రత్యామ్నాయం; అందువల్ల దాన్ని పాదసూచికలో భద్రపరిచాం.
- issue: రాజ్యంలో వారసత్వం లేకపోవడం యొక్క కాలభావం
  choice: ‘వారసత్వం లేదు’ అనే వర్తమాన స్థితిగా అనువదించాం.
  alternative: ‘రాజ్యాన్ని స్వతంత్రించుకోడు’ అనే భవిష్యత్ ఫలితంగా అనువదించడం.
  rationale: గ్రీకులో οὐκ ἔχει వర్తమాన కాలంలో ఉంది. హెచ్చరిక తీవ్రతను తగ్గించకుండా దాని వర్తమాన స్థితి భావాన్ని నిలిపాం.
- issue: ‘మెస్సీయ మరియు దేవుని రాజ్యం’లోని సంబంధం
  choice: రెండు సంబంధరూపాలను సమన్వయంగా సూటిగా అనువదించాం.
  alternative: ఈ వ్యాకరణ నిర్మాణం నుండి ఒక నిర్దిష్ట క్రీస్తుతత్వ నిర్ణయాన్ని అనువాదంలోనే స్పష్టంగా చేర్చడం.
  rationale: గ్రీకు పదబంధంలోని సన్నిహిత ఏకత్వాన్ని నిరాకరించకుండా, అది స్పష్టంగా చెప్పినదానికంటే ఎక్కువైన వివాదాస్పద వ్యాకరణ నిర్ణయాన్ని పాఠ్యంలో రుద్దలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గంభీరమైన శైలి. దోషాల జాబితాలో వ్యక్తులను సూచించే సమాంతర రూపాలు వాడాం. గ్రీకు వాక్యంలోని బలమైన జ్ఞానభావాన్ని ‘బాగా తెలుసు’ ద్వారా వ్యక్తం చేశాం.
