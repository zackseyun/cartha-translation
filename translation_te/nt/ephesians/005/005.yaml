review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the vice list, the present-tense denial of inheritance, and the coordinate phrase “the kingdom of Messiah and God.” It also appropriately preserves the syntactic ambiguity of ὅ ἐστιν εἰδωλολάτρης in a footnote. However, the Telugu predicate “వారసత్వం లేదు” requires a dative/person-marked construction for the listed persons; as written, it is grammatically incomplete/unnatural.
  naturalness: “మీకు ఇది బాగా తెలుసు” is clear modern Telugu and adequately conveys emphatic knowing. The list is generally natural, but “అతడు విగ్రహారాధకుడు … వారసత్వం లేదు” shifts from a nominative predicate to an impersonal possession construction without marking the person as “అతనికి/వారికి,” producing a syntactic defect. Resolving the relative clause specifically with the final item also makes the Telugu sentence smoother while retaining the footnoted alternative.
  terminology: లైంగిక దుర్నీతికి పాల్పడేవాడు, అపవిత్రుడు, దురాశపరుడు, విగ్రహారాధకుడు, వారసత్వం, రాజ్యం, and మెస్సీయ are suitable modern-standard Telugu equivalents. “మెస్సీయ మరియు దేవుని రాజ్యం” faithfully retains the Greek coordination without forcing a disputed christological syntactical interpretation.
  issues:
  - severity: medium
    issue: The main clause lacks a grammatically appropriate dative/person reference for “has no inheritance.”
    rationale: In Telugu, “రాజ్యంలో వారసత్వం లేదు” needs a referent such as “ఎవరికీ” or “వారికి.” The current sequence ends with the nominative “అతడు విగ్రహారాధకుడు,” so the following possession clause is not syntactically well formed.
  - severity: low
    issue: The main-text relative clause is better attached explicitly to the final item, “the greedy person.”
    rationale: The Greek neuter relative pronoun is syntactically difficult, and its most likely contextual reference is greed/the greedy person. Telugu can make this natural as “దురాశపరుడు విగ్రహారాధకుడే,” while the footnote preserves the more literal abstract alternative, “that is idolatry.”
