reference: Ephesians 5:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι ἀνήρ ἐστιν κεφαλὴ τῆς γυναικὸς ὡς καὶ ὁ Χριστὸς κεφαλὴ τῆς ἐκκλησίας, ⸀αὐτὸς σωτὴρ τοῦ σώματος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/023.yaml
  text: For the husband is the head of the wife[a], as the Messiah also is the head of the church[d][c][b], himself the Savior of the body.
translation:
  language: te
  text: ఎందుకంటే భర్త భార్యకు శిరస్సుగా[a] ఉన్నాడు; అలాగే మెస్సీయ[b] కూడా సంఘానికి శిరస్సుగా ఉన్నాడు—ఆయనే శరీరానికి రక్షకుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శిరస్సు’ గ్రీకు రూపకాన్ని నిలుపుతుంది. ఇక్కడ అది అధికారం, ప్రాధాన్యం, లేదా మూలం అనే భావాల్లో ఏదిని సూచిస్తుందో వ్యాఖ్యాతలు భిన్నంగా అర్థం చేసుకుంటారు.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకు పదం ‘క్రీస్తు’; అది ‘అభిషిక్తుడు’, అంటే ‘మెస్సీయ’ అనే బిరుదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి ఉపదేశానికి కారణాన్ని లేదా వివరణను పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ఈ అనుసంధాన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνήρ
  choice: భర్త
  rationale: భార్యాభర్తలను ఉద్దేశించిన తక్షణ గృహసంబంధ సందర్భంలో సాధారణ ‘పురుషుడు’ కంటే వైవాహిక అర్థమే అవసరం.
- source_word: κεφαλή
  choice: శిరస్సు
  rationale: గ్రీకు రూపకాన్ని నిలుపుతుంది; దానిని ‘అధికారి’, ‘నాయకుడు’, లేదా ‘మూలం’ అని వివాదాస్పదంగా నిర్దిష్టీకరించదు.
- source_word: γυνή
  choice: భార్య
  rationale: ἀνήρతో జతగా ఉన్న ఈ సందర్భంలో వైవాహిక అర్థం స్పష్టంగా ఉద్దేశించబడింది.
- source_word: ὡς καὶ
  choice: అలాగే ... కూడా
  rationale: భర్త–భార్య సంబంధానికి, మెస్సీయ–సంఘ సంబంధానికి మధ్య ఉన్న పోలికను సహజంగా నిలుపుతుంది; రెండింటినీ పూర్తిగా సమానమని చెప్పదు.
- source_word: Χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ ఇది కేవలం పేరులా కాక అభిషిక్తుని బిరుదుగా పనిచేస్తున్నందున బిరుదు భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐκκλησία
  choice: సంఘం
  rationale: పౌలు వాడుకలోని విశ్వాసుల సమాజాన్ని సూచించే స్థిరమైన, సాధారణ తెలుగు సమానార్థకం.
- source_word: αὐτός
  choice: ఆయనే
  rationale: సర్వనామంలోని ఉద్ఘాటనను నిలిపి, రక్షకుని పాత్రను మెస్సీయకే ప్రత్యేకంగా అనుసంధానిస్తుంది.
- source_word: σωτήρ
  choice: రక్షకుడు
  rationale: విడుదల మరియు రక్షణ భావాలను రెండింటినీ మోసే సహజమైన క్రైస్తవ తెలుగు పదం.
- source_word: σῶμα
  choice: శరీరం
  rationale: సంఘాన్ని శరీరంగా చూపే పౌలు రూపకాన్ని నిలుపుతుంది; గ్రీకులో లేని ‘ఆయన శరీరం’ అనే స్వామ్యపదాన్ని చేర్చదు.
theological_decisions:
- issue: భర్త–భార్య, మెస్సీయ–సంఘ పోలికలో κεφαλή అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘శిరస్సు’ అనే రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: ‘మూలం’, ‘నాయకుడు’, లేదా ‘అధికారం గలవాడు’ అని స్పష్టీకరించడం
  rationale: పదార్థంపై గణనీయమైన వ్యాఖ్యాన భేదం ఉంది. ఒక వివాదాస్పద అర్థాన్ని పాఠ్యంలోనే నిర్ణయించకుండా మూలంలోని రూపకాన్నీ దైవశాస్త్రీయ ఉద్వేగాన్నీ నిలుపుతుంది.
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ అభిషిక్తుని బిరుదు భావం సజీవంగా ఉంది; ‘మెస్సీయ’ ఆ భావాన్ని ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- issue: αὐτὸς σωτὴρ τοῦ σώματος వాక్య నిర్మాణం
  choice: ‘ఆయనే శరీరానికి రక్షకుడు’ అనే ఉద్ఘాటక ఉపవాక్యం
  alternative: ‘ఆయన శరీరానికి రక్షకుడై ఉన్నాడు’
  rationale: αὐτόςలోని ఉద్ఘాటనను, గ్రీకు నామవాచక అన్వయ నిర్మాణంలోని సంక్షిప్త ప్రకటనను సహజమైన తెలుగులో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘శిరస్సు’ అనే సంప్రదాయమైనప్పటికీ సులభంగా గ్రహించగల రూపకపదాన్ని ఉద్దేశపూర్వకంగా నిలిపాం. సెమికోలన్ పోలికలోని రెండు భాగాలను స్పష్టంగా వేరు చేస్తుంది; డ్యాష్ చివరి ఉద్ఘాటక అన్వయ ప్రకటనను సూచిస్తుంది.
