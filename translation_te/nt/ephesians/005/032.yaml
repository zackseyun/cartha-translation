  rationale: The revision changes only the Telugu expression for Paul's referents, making the syntax clear and natural while retaining the source's open-ended explanatory force. It also restores a target-language footnote corresponding to the English audit trail's alternative that reflects the repeated Greek preposition, and refines the lexical alternative for μέγα.
