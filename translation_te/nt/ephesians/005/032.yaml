  text: τὸ μυστήριον τοῦτο μέγα ἐστίν, ἐγὼ δὲ λέγω εἰς Χριστὸν καὶ εἰς τὴν ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/032.yaml
  text: This mystery is great[c][b][a], but I am speaking with reference to Messiah and the church.
translation:
  language: te
  text: ఈ మర్మం గొప్పది[a]. అయితే నేను మెస్సీయను[b] మరియు సంఘాన్ని ఉద్దేశించి చెబుతున్నాను[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ మర్మం గంభీరమైనది.’ గ్రీకులో మరింత అక్షరార్థంగా ‘గొప్పది’ అని ఉంది; అది కేవలం లోతును మాత్రమే కాక గొప్పతనాన్ని లేదా ప్రాముఖ్యతను కూడా సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు: ‘క్రీస్తు’; ఇక్కడ ఆ పదం ‘అభిషిక్తుడు’ అనే బిరుదుగా వాడబడినందున ‘మెస్సీయ’ అని అనువదించబడింది.'
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘నేను మెస్సీయను గూర్చి, సంఘాన్ని గూర్చి చెబుతున్నాను.’ గ్రీకులో ఈ రెండు పదాల ముందు కూడా ‘కు సంబంధించి/గూర్చి’ అనే భావాన్ని ఇచ్చే పదం ఉంది.
    reason: previous_rendering
lexical_decisions:
- source_word: μυστήριον
  choice: మర్మం
  rationale: పౌలు వాడుకలో ఇది కేవలం అర్థంకాని విషయం కాదు; ఒకప్పుడు మరుగై ఉండి ఇప్పుడు వెల్లడైన దైవిక సత్యాన్ని సూచిస్తుంది. ‘మర్మం’ ఆ భావభారాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: μέγα
  choice: గొప్పది
  rationale: గ్రీకు పదంలోని ప్రత్యక్షమైన పరిమాణం లేదా ప్రాముఖ్యత భావాన్ని నిలుపుతుంది; ‘లోతైనది’ అని అనువదిస్తే మూలంలో స్పష్టంగా లేని వ్యాఖ్యాన ఛాయ చేరుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మర్మం గురించిన ప్రకటన నుంచి పౌలు ఇచ్చే వివరణకు జరిగే స్వల్ప వ్యత్యాసాన్ని, మార్పును సహజంగా తెలియజేస్తుంది.
- source_word: λέγω
  choice: మాట్లాడుతున్నాను
  rationale: వర్తమానకాల క్రియాబలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; ‘నా ఉద్దేశం’ అనే అనువాదం కంటే తక్కువ వ్యాఖ్యానాత్మకం.
- source_word: εἰς
  choice: సంబంధించి
  rationale: λέγω తరువాత ఇక్కడ గమనం కాక, దేనిని ఉద్దేశించి లేదా దేనికి సంబంధించి చెప్పబడుతున్నదో సూచిస్తుంది.
- source_word: Χριστόν
  choice: మెస్సీయ
  rationale: ఈ సందర్భంలో Χριστός వ్యక్తినామంలా కాక అభిషిక్తుడనే బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని ఇచ్చింది.
- source_word: ἐκκλησίαν
  choice: సంఘం
  rationale: ఇక్కడ పౌలు ఉద్దేశించేది సాధారణ పౌరసభ కాదు, దేవుని ప్రజల సమష్టి సమాజం; ‘సంఘం’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘ఈ మర్మం’ దేనిని సూచిస్తుందనే ప్రశ్న
  choice: ప్రధాన పాఠ్యంలో దాని నిర్దిష్ట సూచ్యాన్ని నిర్ణయించకుండా, తరువాతి వివరణతో ఉన్న సంబంధాన్ని మాత్రమే నిలుపడం
  alternative: దీనిని ప్రత్యేకంగా వివాహంలోని ఏకశరీర ఐక్యతగా, ఆదికాండము 2:24 వాక్యంగా, లేదా మెస్సీయ–సంఘ సంబంధాన్ని సూచించే వివాహ ప్రతిరూపంగా వివరించడం
  rationale: గ్రీకు వాక్యం ‘ఈ మర్మం గొప్పది’ అని చెప్పి, పౌలు మెస్సీయకు మరియు సంఘానికి సంబంధించి మాట్లాడుతున్నానని వివరిస్తుంది. ఏ ఒక్క వ్యాఖ్యానాన్ని పాఠ్యంలో బలవంతంగా స్థిరపరచకుండా మూలంలోని ఉద్దేశపూర్వక విస్తృతిని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘మర్మం’, ‘సంఘం’ వంటి స్థిరపడిన పౌలు-సంబంధ పదజాలాన్ని ఆధునిక రూపాలతో వాడింది; వాక్య నిర్మాణాన్ని సహజంగా ఉంచుతూ మూలంలోని వ్యాఖ్యాన అస్పష్టతను కాపాడింది.
