source:
  edition: SBLGNT
  text: πλὴν καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος τὴν ἑαυτοῦ γυναῖκα οὕτως ἀγαπάτω ὡς ἑαυτόν, ἡ δὲ γυνὴ ἵνα φοβῆται τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/033.yaml
  text: Nevertheless[a], you also—each one individually—must love his own wife as himself[b], and the wife must fear her husband.
translation:
  language: te
  text: ఏదేమైనా, మీరు కూడా, మీలో ప్రతి భర్త తన భార్యను తనను తాను ప్రేమించినట్లే ప్రేమించాలి; భార్య కూడా తన భర్తపట్ల భయభక్తులు[a] కలిగి ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “భయభక్తులు కలిగి ఉండాలి” అని అనువదించిన గ్రీకు పదానికి “భయపడాలి” అనే అర్థం ఉండవచ్చు; ఈ సందర్భంలో అది గౌరవపూర్వకమైన మర్యాదను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: ఏదేమైనా
  rationale: ముందటి విస్తృత వివరణను ఆచరణాత్మక ముగింపుగా సంక్షిప్తం చేసే సంధిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ ὑμεῖς οἱ καθ’ ἕνα ἕκαστος
  choice: మీలో ప్రతి భర్త
  rationale: καθ’ ἕνα ἕκαστος లోని వ్యక్తిగత పంపిణీ భావాన్ని ‘ప్రతి’ స్పష్టంగా నిలుపుతుంది; తరువాతి ‘తన భార్య’ వల్ల ఉద్దేశించబడిన భర్తలను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὴν ἑαυτοῦ γυναῖκα
  choice: తన భార్యను
  rationale: వివాహ సందర్భంలో γυνή అంటే భార్య; ἑαυτοῦ లోని స్వకీయ భావాన్ని ‘తన’ నిలుపుతుంది.
- source_word: οὕτως ἀγαπάτω ὡς ἑαυτόν
  choice: తననుతాను ప్రేమించుకున్నట్లు ప్రేమించాలి
  rationale: οὕτως మరియు ὡς ἑαυτόν తెలిపే విధం, పోలిక రెండింటినీ నిలుపుతూ మూడవ పురుష ఏకవచన ఆజ్ఞార్థక బలాన్ని ‘ప్రేమించాలి’ ద్వారా సహజంగా అందిస్తుంది.
- source_word: ἡ δὲ γυνὴ
  choice: భార్య కూడా
  rationale: జతగా ఉన్న రెండవ ఉపదేశాన్ని δέ సూచిస్తుంది; ‘కూడా’ తెలుగులో ఆ సమాంతర సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἵνα φοβῆται τὸν ἄνδρα
  choice: తన భర్తపట్ల భయభక్తులు కలిగి ఉండాలి
  rationale: φοβέομαι లోని ‘భయపడడం’ మరియు ‘గౌరవభరితమైన భక్తి/మర్యాద’ అర్థవిస్తృతిని పూర్తిగా ‘గౌరవించాలి’గా సన్నగించకుండా, ఈ వైవాహిక సందర్భంలో భయాందోళనను మాత్రమే సూచించనివిధంగా నిలుపుతుంది.
theological_decisions:
- issue: వైవాహిక ఉపదేశంలో φοβῆται అర్థం
  choice: భయభక్తులు కలిగి ఉండాలి
  alternative: భయపడాలి; గౌరవించాలి
  rationale: మూల క్రియలో నిజమైన ‘భయం’ భావంతో పాటు గౌరవపూర్వకమైన భక్తి భావమూ ఉండగలదు. ‘భయభక్తులు’ ఈ ఉద్దేశపూర్వక అర్థ ఉద్రిక్తతను నిలుపుతుంది; దానిని కేవలం భీతిగానో కేవలం మర్యాదగానో నిర్ణయించదు.
- issue: లింగనిర్దిష్ట ఏకవచన వైవాహిక ఉపదేశం
  choice: ప్రతి భర్త ... తన భార్య ... భార్య ... తన భర్త
  alternative: ప్రతి వ్యక్తి తన జీవిత భాగస్వామిని
  rationale: గ్రీకు పాఠంలోని భర్త-భార్య నిర్దిష్టతను లింగతటస్థంగా మార్చకుండా సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. గ్రీకు వాక్యంలోని వ్యక్తిగత వర్తింపును ‘మీలో ప్రతి భర్త’ ద్వారా స్పష్టంచేసి, φοβῆται లోని అర్థ ఉద్రిక్తతను ప్రధాన పాఠం మరియు పాదసూచికలో నిలిపింది.
