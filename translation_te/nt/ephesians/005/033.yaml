- from: ఏదేమైనా, మీలో ప్రతి భర్త తన భార్యను తననుతాను ప్రేమించుకున్నట్లు ప్రేమించాలి; భార్య కూడా తన భర్తపట్ల భయభక్తులు కలిగి ఉండాలి.[a]
  to: ఏదేమైనా, మీరు కూడా, మీలో ప్రతి భర్త తన భార్యను తనను తాను ప్రేమించినట్లే ప్రేమించాలి; భార్య కూడా తన భర్తపట్ల భయభక్తులు[a] కలిగి ఉండాలి.
