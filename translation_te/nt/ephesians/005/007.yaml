translation:
  language: te
  text: కాబట్టి, వారితో భాగస్థులుగా మారకండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారితో పాలుపంచుకొనేవారిగా మారకండి” లేదా “వారితో కలిసి భాగం వహించేవారిగా మారకండి.” సందర్భానుసారంగా, ఇది వారి పాపభరిత ప్రవర్తనలో గానీ దాని పరిణామాల్లో గానీ భాగం పంచుకోవడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: మారకండి
  rationale: నిషేధార్థక μὴ, γίνεσθεతో కలిసి ‘మారకండి’ అనే సహజమైన తెలుగు నిషేధ ఆజ్ఞగా వ్యక్తమవుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న 3–6 వచనాల హెచ్చరికనుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: γίνεσθε
  choice: మారకండి
  rationale: γίνομαι ఇక్కడ కేవలం ‘ఉండడం’ కాక, ఒక స్థితిలోకి రావడం లేదా అలా కావడం అనే భావాన్ని ఇస్తుంది; అందువల్ల ‘మారకండి’ తగినది.
- source_word: συμμέτοχοι
  choice: పాలుపంచుకునేవారిగా
  rationale: ఇతరులతో కలిసి దేనిలోనైనా భాగం వహించే వారిని సూచిస్తుంది. ‘పాలుపంచుకునేవారు’ ఆధునిక తెలుగులో సహజంగా ఉండి, మూలపదంలోని భాగస్వామ్య భావాన్ని నిలుపుతుంది.
- source_word: αὐτῶν
  choice: వారితో
  rationale: సర్వనామం వ్యక్తులను సూచిస్తోంది; συμμέτοχοιతో దాని సంబంధం తెలుగులో సహజంగా ‘వారితో’ అని వ్యక్తమవుతుంది. ‘వారి పనుల్లో’ అని విస్తరించడం మూలంలో స్పష్టంగా లేని అంశాన్ని చేర్చుతుంది.
theological_decisions:
- issue: συμμέτοχοι αὐτῶν సూచించే భాగస్వామ్య పరిధి
  choice: ‘వారితో పాలుపంచుకునేవారిగా’ అని వ్యక్తులను సూచించే మూలభాషా రూపాన్ని నిలుపుతూ, పాపపు ప్రవర్తనలో లేదా దాని పరిణామాల్లో భాగస్వామ్యం అనే సందర్భార్థాన్ని పాదసూచికలో తెలియజేయడం.
  alternative: ‘వారి పనుల్లో పాలుపంచుకోకండి’ లేదా ‘వీటిలో భాగస్థులు కాకండి.’
  rationale: తక్షణ సందర్భం అవిధేయుల పాపపు జీవన విధానాన్ని, దాని ఫలితాన్ని సూచించినా, గ్రీకు వాక్యంలో ‘వారు’ అనే వ్యక్తిసూచక సర్వనామమే ఉంది; ‘పనులు’ లేదా ‘విషయాలు’ అని మూలపాఠంలో లేదు. అందువల్ల సందర్భార్థాన్ని అతిగా నిర్దిష్టం చేయకుండా ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘భాగస్థులు’ కంటే సాధారణ పాఠకులకు సులభమైన ‘పాలుపంచుకునేవారు’ను ప్రధాన పాఠంలో ఎంచుకుని, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
