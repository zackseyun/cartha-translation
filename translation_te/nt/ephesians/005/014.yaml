    issue: The main text adds “అప్పుడు” before “మెస్సీయ.”
    rationale: The Greek has καὶ ἐπιφαύσει (“and [the Messiah] will shine on you”), not an explicit temporal adverb. “అప్పుడు” can suggest that the shining follows only after the commanded rising, a relationship not grammatically stated in the quotation.
