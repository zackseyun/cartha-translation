id: EPH.5.14
reference: Ephesians 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶν γὰρ τὸ φανερούμενον φῶς ἐστιν. διὸ λέγει· Ἔγειρε, ὁ καθεύδων, καὶ ἀνάστα ἐκ τῶν νεκρῶν, καὶ ἐπιφαύσει σοι ὁ Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/014.yaml
  text: For everything that is made visible is light[a]. Therefore it says, “Wake up, sleeper, and rise from the dead[c][b], and Messiah will shine on you.”
translation:
  language: te
  text: 'ఎందుకంటే, వెలుగులోకి తీసుకురాబడేదంతా వెలుగే[a]. అందుకే ఇలా చెప్పబడుతోంది[c]: “నిద్రించేవాడా, మేలుకో! మృతులలోనుండి లేచి నిలబడు! మెస్సీయ[b] నీపై ప్రకాశిస్తాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “బయటపెట్టబడేదంతా వెలుగే.” φανερούμενον అనే పదానికి “కనిపించేలా చేయబడేది,” “బయటపెట్టబడేది,” లేదా “వెల్లడించబడేది” అనే భావాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు: “క్రీస్తు”; ఇక్కడ Χριστός బిరుదుగా ఉన్నందున “మెస్సీయ” అని అనువదించబడింది.'
    reason: alternative_reading
  - marker: c
    text: ఈ ఉల్లేఖనం ఎక్కడి నుంచో ఖచ్చితంగా తెలియదు. ఇది లేఖనంలోని భావాలను—ప్రత్యేకంగా యెషయా 60:1ను—ప్రతిధ్వనించవచ్చు; లేదా తొలి క్రైస్తవ గీతం కావచ్చు.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν
  choice: అంతా
  rationale: నపుంసక ఏకవచన రూపం సాధారణంగా సమస్తాన్ని సూచిస్తుంది; వ్యక్తులకు మాత్రమే పరిమితం చేయదు.
- source_word: φανερούμενον
  choice: వెలుగులోకి తీసుకురాబడేది
  rationale: కర్మణి ప్రయోగంలోని ఈ అస్పష్టతను ‘కనిపించేలా చేయబడేది/బయటపడేది’ అనే భావాలతో నిలుపుతూ, ముందున్న వెలుగు సందర్భంతో సహజంగా అనుసంధానిస్తుంది.
- source_word: φῶς
  choice: వెలుగు
  rationale: మూలంలోని రూపకాన్ని వివరించి కుదించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: διὸ
  choice: అందుకే
  rationale: ముందటి వాక్యం నుంచి వచ్చే నిర్ధారణను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: λέγει
  choice: ఇలా చెప్పబడుతోంది
  rationale: గ్రీకులో కర్త నిర్దిష్టంగా లేదు; లేఖనం, దేవుడు లేదా గీతం అని అనువాదంలో నిర్ణయించకుండా ఉంచుతుంది.
- source_word: Ἔγειρε
  choice: మేలుకో
  rationale: నిద్ర రూపకాన్ని సహజమైన ఆజ్ఞారూపంలో నిలుపుతుంది.
- source_word: ὁ καθεύδων
  choice: నిద్రించేవాడా
  rationale: నామవాచకంగా వాడిన వర్తమాన కృదంతపు సంబోధన భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἀνάστα
  choice: లేచి నిలబడు
  rationale: ἀνίστημι లోని లేవడం/నిలబడడం భావాన్ని, ‘మృతులలోనుండి’ అనే సందర్భంలోని పునరుత్థాన ప్రతిధ్వనితో సహా నిలుపుతుంది.
- source_word: ἐκ τῶν νεκρῶν
  choice: మృతులలోనుండి
  rationale: మృతుల సమూహం మధ్యనుండి లేవడం అనే గ్రీకు భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐπιφαύσει
  choice: నీపై ప్రకాశిస్తాడు
  rationale: వెలుగు నీపై పడే చిత్రాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: ὁ Χριστός
  choice: మెస్సీయ
  rationale: నిర్దిష్ట ఉపపదంతో ఇక్కడ బిరుదుగా ఉన్న Χριστός అర్థాన్ని అనువదిస్తుంది; సంప్రదాయ ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: ఉల్లేఖనపు మూలం
  choice: కర్తను పేర్కొనకుండా ‘ఇలా చెప్పబడుతోంది’
  alternative: ‘లేఖనం చెబుతోంది’; ‘ఆయన చెబుతున్నాడు’; ‘ఒక గీతంలో ఇలా ఉంది’
  rationale: మూల గ్రీకు వక్తను లేదా ఉల్లేఖన మూలాన్ని పేర్కొనదు; యెషయా 60:1 ప్రతిధ్వని లేదా తొలి క్రైస్తవ గీతం వంటి అవకాశాల మధ్య అనువాదం తీర్పు ఇవ్వదు.
- issue: ὁ Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ పదం బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని తెలియజేసే రూపాన్ని ప్రధాన పాఠ్యంలో ఉంచి, పరిచిత సంప్రదాయ రూపాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- issue: πᾶν τὸ φανερούμενον φῶς ἐστιν యొక్క భావసంబంధం
  choice: ‘వెలుగులోకి తీసుకురాబడేదంతా వెలుగే’ అని రూపకపు ఉద్రిక్తతను నిలుపడం
  alternative: ‘బయటపడేదంతా కనిపిస్తుంది’ అని వివరణాత్మకంగా మార్చడం
  rationale: మూలంలో రెండవ విధేయ పదం స్పష్టంగా φῶς (‘వెలుగు’); కష్టమైన భావాన్ని సులభీకరించి వేరే వాక్యంగా మార్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఉల్లేఖనంలో కవితాత్మక ఆజ్ఞల లయ కోసం చిన్న వాక్యాలు వాడబడ్డాయి. ‘వెలుగులోకి తీసుకురాబడేది’ అనే రూపం మూలంలోని కర్మణి ప్రయోగాన్నీ వెలుగు రూపకాన్నీ కలిపి నిలుపుతుంది.
