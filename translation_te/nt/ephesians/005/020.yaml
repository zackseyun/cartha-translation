source:
  edition: SBLGNT
  text: εὐχαριστοῦντες πάντοτε ὑπὲρ πάντων ἐν ὀνόματι τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῷ θεῷ καὶ πατρί,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/020.yaml
  text: always giving thanks for everything to God the Father in the name of our Lord Jesus the Messiah[b][a],
translation:
  language: te
  text: ఎల్లప్పుడూ అన్నిటికోసం[b] మన ప్రభువైన యేసు మెస్సీయ[a] నామంలో తండ్రియైన దేవునికి కృతజ్ఞతలు చెల్లిస్తూ ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయంగా, “యేసు క్రీస్తు.”
    reason: alternative_reading
  - marker: b
    text: మరింత అక్షరార్థంగా, “అన్నిటి కోసం”; దీనిని కొందరు “అందరి కోసం” అని కూడా అర్థం చేసుకుంటారు. అయితే సందర్భం అన్ని పరిస్థితులు లేదా విషయాలు అనే సమగ్ర భావానికే ఎక్కువగా అనుకూలిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: కృతజ్ఞతలు చెల్లిస్తూ ఉండండి
  rationale: వర్తమాన కర్తరి కృదంతంలోని కొనసాగుతున్న క్రియాభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. ఇది ముందున్న ఆజ్ఞపై ఆధారపడే కృదంతమైనప్పటికీ, వచనం విడిగా చదివినప్పుడు అర్థవంతంగా ఉండేందుకు ‘ఉండండి’ వాడబడింది.
- source_word: πάντοτε
  choice: ఎల్లప్పుడూ
  rationale: కాలవ్యాప్తిని సంక్షిప్తంగా, సహజంగా తెలియజేసే సాధారణ తెలుగు పదం.
- source_word: ὑπὲρ πάντων
  choice: అన్నిటి విషయమై
  rationale: πάντων రూపం వస్తువులు/విషయాలు లేదా వ్యక్తులను సూచించగలదు. సందర్భంలో సమస్త పరిస్థితులు, విషయాలు అనే సమగ్ర భావం బలంగా ఉన్నందున ఈ అనువాదం ఎంచుకోబడింది; మూలంలోని విస్తృతిని నిలుపుతుంది.
- source_word: ἐν ὀνόματι
  choice: నామంలో
  rationale: ప్రాతినిధ్య లేదా మధ్యవర్తిత్వ భావాన్ని సందర్భానికి వదిలేస్తూ, సుపరిచితమైన బైబిలు నుడికారాన్ని నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριος అనే క్రీస్తుసంబంధ బిరుదుకు సహజమైన, స్థిరమైన తెలుగు అనువాదం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: మెస్సీయ యేసు
  rationale: Ἰησοῦను పేరుగా లిప్యంతరీకరించి, Χριστοῦను ఇక్కడ బిరుదుగా ‘మెస్సీయ’ అని అనువదిస్తుంది. తెలుగులో బిరుదును పేరుకు ముందు ఉంచడం సహజం.
- source_word: τῷ θεῷ καὶ πατρί
  choice: తండ్రియైన దేవునికి
  rationale: కృతజ్ఞతలు అందుకునే వ్యక్తిని సూచించే చతుర్థీ విభక్తిని స్పష్టంగా చూపుతుంది; ఒకే వ్యక్తిని ‘దేవుడు’ మరియు ‘తండ్రి’గా పేర్కొనే గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦలో Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός కేవలం పేరులో భాగంలా కాక బిరుదు భావాన్ని నిలుపుతుంది. అందువల్ల ప్రధాన పాఠ్యంలో అర్థానువాదమైన ‘మెస్సీయ’ను వాడి, సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఉంచాం.
- issue: ὑπὲρ πάντωνలో πάντων సూచన
  choice: అన్నిటి విషయమై
  alternative: అందరి విషయమై
  rationale: వ్యాకరణ రూపం నపుంసక లేదా పుంలింగ సూచనకు వీలు కల్పించినా, పరిసర ఉపదేశంలో ప్రతి పరిస్థితి లేదా విషయం పట్ల కృతజ్ఞత అనే సమగ్ర భావమే ఎక్కువ సంభావ్యమైనది. వ్యక్తులను సూచించే అవకాశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘నామంలో’, ‘ప్రభువు’, ‘కృతజ్ఞతలు’ వంటి సుపరిచిత బైబిలు పదజాలాన్ని ఉంచుతూ, అసహజమైన గ్రీకు పదక్రమాన్ని అనుకరించలేదు.
