- from: అందుచేత[a] అవివేకులుగా మారకండి; ప్రభువు చిత్తం ఏమిటో గ్రహించండి.
  to: అందుచేత[a] అవివేకులుగా మారకండి, కానీ ప్రభువు చిత్తం ఏమిటో గ్రహించండి.
  rationale: ‘కాని’ని చేర్చడం ద్వారా ἀλλά యొక్క స్పష్టమైన విరుద్ధతను నిలుపాం. మిగతా పదప్రయోగాలు మూల గ్రీకు అర్థం, ఆధునిక తెలుగు సహజత్వం, మరియు ‘ప్రభువు’ అనే అనిర్దిష్ట సూచనను కాపాడుతున్నాయి. అడుగుటిప్పణిని సంబంధిత గ్రీకు ప్రత్యామ్నాయాలను స్పష్టంగా తెలియజేసేలా సవరించాం.
