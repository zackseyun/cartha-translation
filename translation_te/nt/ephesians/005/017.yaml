  text: διὰ τοῦτο μὴ γίνεσθε ἄφρονες, ἀλλὰ ⸀συνίετε τί τὸ θέλημα τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/017.yaml
  text: For this reason[a], do not become foolish, but understand what the will of the Lord is.
translation:
  language: te
  text: అందుచేత[a] అవివేకులుగా మారకండి, కానీ ప్రభువు చిత్తం ఏమిటో గ్రహించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాబట్టి, అవివేకులుగా ఉండకండి.” గ్రీకు క్రియను ‘ఉండకండి’ అనే స్థితి భావంతో కూడా అనువదించవచ్చు; అయితే ‘మారకండి’ అనేది అలాంటి స్థితిలోకి రాకూడదనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
    reason: διὰ τοῦτοకు ‘కాబట్టి’ అనే ప్రత్యామ్నాయాన్ని, అలాగే μὴ γίνεσθεకు ప్రక్రియాత్మక ‘మారకండి’కి బదులుగా సాధ్యమైన స్థితి భావం ‘ఉండకండి’ అనే ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: అందుచేత
  rationale: ముందటి ఉపదేశం నుంచి వచ్చే కారణాత్మక/నిగమన సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: μὴ γίνεσθε
  choice: మారకండి
  rationale: γίνομαι లోని ఒక స్థితిలోకి రావడం అనే ప్రక్రియాత్మక భావాన్ని కేవలం ‘ఉండకండి’ అనకుండా నిలుపుతుంది.
- source_word: ἄφρονες
  choice: అవివేకులుగా
  rationale: అవగాహన, ఆచరణాత్మక వివేచన లేమిని సూచిస్తూ, తరువాతి ‘గ్రహించండి’ అనే ఆజ్ఞతో స్పష్టమైన వ్యత్యాసాన్ని ఏర్పరుస్తుంది.
- source_word: ἀλλὰ
  choice: ;
  rationale: తెలుగులో ప్రతికూల ఆజ్ఞ తరువాత వచ్చే సానుకూల విరుద్ధ ఆజ్ఞను విరామచిహ్నంతో సహజంగా వ్యక్తం చేశాం; భావంలో ‘కాని/బదులుగా’ అనే బలమైన వ్యత్యాసం నిలుస్తుంది.
- source_word: συνίετε
  choice: గ్రహించండి
  rationale: కేవలం సమాచారం తెలుసుకోవడం కాక, అర్థం చేసుకొని వివేచించే భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τί
  choice: ఏమిటో
  rationale: తెలుగు పరోక్ష ప్రశ్న నిర్మాణంలో విషయవస్తువును సహజంగా పరిచయం చేస్తుంది.
- source_word: τὸ θέλημα
  choice: చిత్తం
  rationale: θέλημα సూచించే సంకల్పం లేదా కోరబడిన కార్యం అనే భావానికి తెలుగు బైబిలు శైలిలో గౌరవప్రదమైన, సుపరిచితమైన సమానార్థకం.
- source_word: τοῦ κυρίου
  choice: ప్రభువు
  rationale: గ్రీకు పదంలో ఉన్న బిరుదును అలాగే ఉంచి, అది యేసునా లేక దేవుడా అని అనువాదంలో అదనంగా నిర్దిష్టపరచదు.
theological_decisions:
- issue: τοῦ κυρίου అనే పదబంధంలో ‘ప్రభువు’ ఎవరనే సూచన
  choice: ప్రధాన పాఠ్యంలో కేవలం ‘ప్రభువు’ అని ఉంచడం
  alternative: ‘ప్రభువైన యేసు’ లేదా ‘దేవుడు’
  rationale: సమీప సందర్భంలో ఇది యేసును సూచించే అవకాశం ఉన్నా, ఈ వచనం స్వయంగా κυρίου అని మాత్రమే చెబుతుంది; అందువల్ల మూలంలోని విపులీకరించని సూచనను నిలిపాం.
- issue: μὴ γίνεσθε నిషేధం యొక్క బలం
  choice: ‘అవివేకులుగా మారకండి’
  alternative: ‘అవివేకులుగా ఉండకండి’ లేదా ‘అవివేకులుగా ఉండడం మానండి’
  rationale: శ్రోతలు ఇప్పటికే పూర్తిగా అవివేకులేనని ముందుగా ఊహించకుండా, అలాంటి స్థితిలోకి రావద్దనే హెచ్చరికను γίνομαι ప్రక్రియాత్మక భావంతో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలితో రూపొందించబడింది. ‘చిత్తం’ కొంత సాంప్రదాయికమైనా ప్రస్తుత తెలుగు క్రైస్తవ వాడుకలో సులభంగా గ్రాహ్యం.
