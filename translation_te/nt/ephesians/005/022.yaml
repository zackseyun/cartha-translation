  text: Αἱ γυναῖκες τοῖς ἰδίοις ⸀ἀνδράσιν ὡς τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/022.yaml
  text: Wives[a], to your own husbands as to the Lord,
translation:
  language: te
  text: భార్యలు[a], తమ సొంత భర్తలకు ప్రభువుకు వలె—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అనేక అనువాదాలు 21వ వచనం నుంచి ‘లోబడండి’ అనే క్రియను ఇక్కడ చేర్చి, ‘భార్యలారా, మీ సొంత భర్తలకు ప్రభువుకు లోబడినట్లు లోబడండి’ అని అనువదిస్తాయి. అయితే 22వ వచనపు గ్రీకు పాఠ్యంలో క్రియ లేదు; ఈ వాక్యం ముందున్న వాక్యభాగంపై ఆధారపడుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκες
  choice: భార్యలు
  rationale: గృహసంబంధ ఉపదేశ సందర్భంలోను, ‘తమ సొంత భర్తలకు’ అనే జత పదబంధంతోను ఇది సాధారణంగా ‘స్త్రీలు’ అని కాక వివాహసంబంధంగా ‘భార్యలు’ అని అర్థమవుతుంది.
- source_word: ἰδίοις ἀνδράσιν
  choice: తమ సొంత భర్తలకు
  rationale: ἀνήρ అనే పదానికి ‘పురుషుడు’ లేదా ‘భర్త’ అనే అర్థాలు ఉండవచ్చు; ఇక్కడ ἰδίοις (‘సొంత’) మరియు పరిసర సందర్భం కారణంగా ‘భర్తలు’ సహజమైన అర్థం. మూలంలో ఉన్న ‘సొంత’ భావాన్ని కూడా నిలిపాం.
- source_word: ὡς
  choice: వలె
  rationale: పోలికను అతిగా వివరించకుండా గ్రీకు పదంలోని సరళమైన తులనార్థాన్ని నిలుపుతుంది.
- source_word: κυρίῳ
  choice: ప్రభువుకు
  rationale: ఇక్కడ κύριος పౌలు వాడుకలో ప్రభువైన యేసును సూచిస్తుంది; దత్తివిభక్తి భావాన్ని ‘ప్రభువుకు’ అని తెలిపాం.
- source_word: implicit verb from context
  choice: ప్రధాన పాఠ్యంలో క్రియను చేర్చలేదు
  rationale: ఈ వచనంలోని గ్రీకు పాఠ్యంలో స్పష్టమైన క్రియ లేదు; 21వ వచనంలోని ὑποτασσόμενοι (‘లోబడుతూ’) అనే పదంపై వాక్యం ఆధారపడుతుంది. అందువల్ల మూలంలోని అసంపూర్ణ నిర్మాణాన్ని నిలిపాం.
theological_decisions:
- issue: 22వ వచనంలో లేని ‘లోబడండి’ అనే క్రియను ప్రధాన పాఠ్యంలో చేర్చాలా?
  choice: క్రియను చేర్చకుండా, మూలంలోని అసంపూర్ణ వాక్య నిర్మాణాన్ని నిలిపి, దాని భావం 21వ వచనం నుంచి వస్తుందని పాదటిప్పణిలో వివరించడం.
  alternative: భార్యలారా, మీ సొంత భర్తలకు ప్రభువుకు లోబడినట్లు లోబడండి.
  rationale: సందర్భం వల్ల ‘లోబడడం’ అనే భావం స్పష్టంగా గ్రహించగలిగినా, ఆ క్రియ 22వ వచనపు గ్రీకు పాఠ్యంలో లేదు. దాన్ని ప్రధాన పాఠ్యంలో చేర్చడం చదవడానికి సులభం చేస్తుంది గాని, ఈ వచనంలో స్పష్టంగా ఉన్నదానికంటే ఎక్కువగా చెబుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. మూలంలోని ఉద్దేశపూర్వక అసంపూర్ణతను చూపడానికి చివర దీర్ఘవిరామ చిహ్నం ఉంచబడింది; పాదటిప్పణి లేకుండా క్రియను నిశ్శబ్దంగా చేర్చలేదు.
