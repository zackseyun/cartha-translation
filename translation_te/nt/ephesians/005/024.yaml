id: EPH.5.24
reference: Ephesians 5:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ⸀ὡς ἡ ἐκκλησία ὑποτάσσεται τῷ Χριστῷ, οὕτως καὶ αἱ γυναῖκες ⸀τοῖς ἀνδράσιν ἐν παντί.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/024.yaml
  text: But as the church submits to Messiah[a], so also wives to their husbands in everything.
translation:
  language: te
  text: కానీ సంఘం మెస్సీయకు[a] లోబడినట్లే, భార్యలు కూడా ప్రతి విషయంలో తమ భర్తలకు లోబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్రీస్తుకు.’ గ్రీకు Χριστός ఇక్కడ బిరుదుగా వాడబడినందున ప్రధాన పాఠ్యంలో ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయితే
  rationale: ముందటి వాక్యంతో ఉన్న వ్యత్యాసాన్ని, అలాగే ఆ ఆలోచన కొనసాగింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὡς ... οὕτως καὶ
  choice: లోబడినట్లే ... కూడా
  rationale: గ్రీకులోని ‘ఎలాగైతే ... అలాగే కూడా’ అనే తులనాత్మక నిర్మాణాన్ని సహజమైన తెలుగు వాక్యక్రమంలో నిలుపుతుంది.
- source_word: ἡ ἐκκλησία
  choice: సంఘం
  rationale: ఇక్కడ క్రైస్తవ విశ్వాసుల సమాజాన్ని సూచిస్తుంది; తెలుగు బైబిలు వాడుకలో ‘సంఘం’ స్పష్టమైన, స్థిరమైన పదం.
- source_word: ὑποτάσσεται
  choice: లోబడినట్లే
  rationale: క్రమబద్ధమైన స్వీయ లోబడుట అనే సంబంధాత్మక భావాన్ని తెలియజేస్తుంది; మూలపదంలో లేని బలవంతపు భావాన్ని చేర్చదు.
- source_word: τῷ Χριστῷ
  choice: మెస్సీయకు
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున దాని బిరుదు భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది.
- source_word: αἱ γυναῖκες
  choice: భార్యలు
  rationale: గృహసంబంధ సందర్భంలో, ἀνδράσιν‌తో జతగా ఉన్నందున సాధారణ ‘స్త్రీలు’ కంటే ‘భార్యలు’ అనే అర్థమే ఉద్దేశితం.
- source_word: τοῖς ἀνδράσιν
  choice: తమ భర్తలకు
  rationale: వివాహ సందర్భం ἀνήρ‌కు ‘భర్త’ అనే అర్థాన్ని నిర్దేశిస్తుంది; గ్రీకులో సూచితమైన వివాహ సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘తమ’ చేర్చబడింది.
- source_word: ἐν παντί
  choice: ప్రతి విషయంలో
  rationale: మూలంలోని విస్తృత పరిధిని తగ్గించకుండా, వివరణాత్మక పరిమితులు చేర్చకుండా నేరుగా వ్యక్తం చేస్తుంది.
- source_word: '[ellipsis in the second clause]'
  choice: లోబడాలి
  rationale: రెండవ ఉపవాక్యంలో గ్రీకు పునరుక్త క్రియను విడిచిపెట్టినా, తెలుగులో పూర్తి మరియు సహజమైన వాక్యం కోసం మొదటి ఉపవాక్యంలోని క్రియాభావాన్ని స్పష్టంగా పునరుద్ధరిస్తుంది.
theological_decisions:
- issue: Χριστός పదం అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ పోలికలో పదం బిరుదుగా పనిచేస్తుంది. అందువల్ల దాని బిరుదు భావాన్ని ప్రధాన పాఠ్యంలో అనువదించి, సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఉంచాం.
- issue: వివాహ సంబంధ లోబడుట యొక్క పరిధి
  choice: ‘ప్రతి విషయంలో’ అని ఎలాంటి అదనపు పరిమితి లేకుండా ఉంచడం
  alternative: ‘తగిన ప్రతి విషయంలో’ వంటి వివరణాత్మక విస్తరణ
  rationale: గ్రీకు పాఠ్యం ἐν παντί అని మాత్రమే చెబుతుంది. ఈ వచనంలో లేని పరిమితిని చేర్చకుండా దాని విస్తృతిని, దానివల్ల కలిగే వ్యాఖ్యాన ఉద్రిక్తతను నిలుపాం.
- issue: రెండవ ఉపవాక్యంలో విడిచిపెట్టబడిన క్రియ
  choice: తెలుగులో ‘లోబడాలి’ అని పూరించడం
  alternative: ‘భార్యలు కూడా ప్రతి విషయంలో తమ భర్తలకు’ అని క్రియ లేకుండా ఉంచడం
  rationale: గ్రీకులో క్రియ మొదటి ఉపవాక్యం నుండి అర్థమవుతుంది; తెలుగులో దానిని పూర్తిగా విడిచిపెడితే వాక్యం అసహజంగా, అసంపూర్ణంగా ఉంటుంది. పూరించిన క్రియ సందర్భంలోని భావాన్ని మాత్రమే వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన కానీ సహజమైన శైలి వాడబడింది. ‘లోబడు,’ ‘సంఘం,’ ‘భర్త’ వంటి సుపరిచిత పదాలతో మూలంలోని సంబంధాత్మక భావం మరియు తులనాత్మక నిర్మాణం నిలుపబడ్డాయి.
