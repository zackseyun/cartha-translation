revisions:
- from: సమయాన్ని సద్వినియోగం చేసుకుంటూ ఉండండి[a], ఎందుకంటే ఈ రోజులు చెడ్డవి.
  to: సమయాన్ని సద్వినియోగం చేసుకోండి[a], ఎందుకంటే ఈ రోజులు దుష్టమైనవి.
  rationale: The revision strengthens the rendering of πονηραί, improves the idiomatic Telugu exhortation, and clarifies the lexical footnote’s purchase metaphor. It does not add a salvific sense to ἐξαγοραζόμενοι and preserves the contextual ambiguity of καιρός as time/opportunity.
