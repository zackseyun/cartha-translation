    text: లేదా, “సమయాన్ని కొనుగోలు చేసుకుంటూ”; గ్రీకు ప్రయోగానికి “అవకాశాన్ని పూర్తిగా ఉపయోగించుకోవడం” అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
  revision_rationale: The revision strengthens the rendering of πονηραί, improves the idiomatic Telugu exhortation, and clarifies the lexical footnote’s purchase metaphor. It does not add a salvific sense to ἐξαγοραζόμενοι and preserves the contextual ambiguity of καιρός as time/opportunity.
