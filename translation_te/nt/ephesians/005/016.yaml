  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξαγοραζόμενοι τὸν καιρόν, ὅτι αἱ ἡμέραι πονηραί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/016.yaml
  text: making the most of the time[a], because the days are evil.
translation:
  language: te
  text: సమయాన్ని సద్వినియోగం చేసుకోండి[a], ఎందుకంటే ఈ రోజులు దుష్టమైనవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమయాన్ని కొనుగోలు చేసుకుంటూ”; గ్రీకు ప్రయోగానికి “అవకాశాన్ని పూర్తిగా ఉపయోగించుకోవడం” అనే అర్థం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαγοραζόμενοι
  choice: సద్వినియోగం చేసుకుంటూ ఉండండి
  rationale: ఈ కృదంతం అక్షరార్థంగా ‘కొనివేయడం/వెల చెల్లించి పొందడం’ అనే రూపకాన్ని కలిగి ఉన్నా, ఇక్కడ లభించిన సమయాన్ని లేదా అవకాశాన్ని పూర్తిగా ఉపయోగించుకోవాలనే ఆచరణాత్మక అర్థం ప్రధానమైనది. ఆధునిక తెలుగులో ‘సద్వినియోగం చేసుకోవడం’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది; రక్షణ సంబంధమైన భావాన్ని అనవసరంగా చేర్చదు.
- source_word: καιρόν
  choice: సమయాన్ని
  rationale: καιρός సాధారణ కాలం కంటే తగిన సమయం లేదా అవకాశాన్ని సూచించగలదు. ప్రధాన పాఠ్యంలో సహజమైన ‘సమయం’ ఉంచి, ‘అవకాశం’ అనే భావాన్ని పాదటిప్పణిలో భద్రపరిచాం.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న హితబోధకు కారణాన్ని పరిచయం చేస్తుంది; ఆధునిక తెలుగులో ఇది స్పష్టమైన సమానార్థకం.
- source_word: αἱ ἡμέραι
  choice: ఈ రోజులు
  rationale: గ్రీకులో అక్షరార్థంగా ‘రోజులు’. తెలుగు సందర్భంలో నిర్దిష్టతను సహజంగా వ్యక్తపరచడానికి ‘ఈ రోజులు’ అని ఇచ్చాం; ప్రస్తుత పరిస్థితులు లేదా కాలాన్ని సూచించే రూపకాన్ని విస్తరించలేదు.
- source_word: πονηραί
  choice: చెడ్డవి
  rationale: ఈ పదం రోజులను నైతికంగా దుష్టమైన లేదా విరోధకరమైనవిగా వర్ణిస్తుంది. ‘చెడ్డవి’ సాధారణ పాఠకులకు సహజంగా ఉండి నైతిక భావాన్ని నిలుపుతుంది; కేవలం ‘కష్టమైనవి’ అని అనువదిస్తే ఆ భావం బలహీనపడుతుంది.
theological_decisions:
- issue: ἐξαγοραζόμενοι అనే పదాన్ని రక్షణ లేదా విమోచన సంబంధమైన సాంకేతిక భాషగా అపార్థం చేసుకునే అవకాశం
  choice: సమయాన్ని లేదా అవకాశాన్ని జ్ఞానంతో పూర్తిగా ఉపయోగించుకోవాలనే ఆచరణాత్మక హితబోధ
  alternative: సమయాన్ని విమోచించుకుంటూ / కొనివేసుకుంటూ
  rationale: ఈ సందర్భంలో క్రియకు ఆచరణాత్మక, రూపకాలంకార అర్థమే సహజం; ప్రాయశ్చిత్తం లేదా రక్షణ సిద్ధాంతాన్ని పాఠ్యంలోకి చేర్చడం సముచితం కాదు. అయితే మూలంలోని కొనుగోలు రూపకాన్నీ ‘అవకాశం’ అనే భావాన్నీ పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ఈ వాక్యం మునుపటి వచనంలోని ఆజ్ఞాపూర్వక నిర్మాణంపై ఆధారపడిన కృదంతం కావడంతో తెలుగులో ‘ఉండండి’ చేర్చి హితబోధను స్పష్టం చేశాం.
