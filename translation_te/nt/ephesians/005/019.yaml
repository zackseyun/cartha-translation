source:
  edition: SBLGNT
  text: λαλοῦντες ⸀ἑαυτοῖς ψαλμοῖς καὶ ὕμνοις καὶ ᾠδαῖς πνευματικαῖς, ᾄδοντες καὶ ⸀ψάλλοντες τῇ καρδίᾳ ὑμῶν τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/019.yaml
  text: speaking to one another with psalms and hymns and spiritual songs[a], singing and making melody with your heart to the Lord[b],
translation:
  language: te
  text: కీర్తనలతో, స్తోత్రగీతాలతో, ఆధ్యాత్మిక గీతాలతో ఒకరినొకరు ఉద్దేశించి మాట్లాడుతూ[a], మీ హృదయాలలో ప్రభువుకు పాడుతూ, కీర్తన ఆలపిస్తూ ఉండండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “మీలో మీరు,” లేదా “మీకు మీరే.” ఇక్కడి గ్రీకు ఆత్మవాచక పదం బహువచన సందర్భంలో సాధారణంగా “ఒకరినొకరు” అనే పరస్పరార్థంలో అర్థం చేసుకోబడుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా “స్తుతిగానం చేస్తూ.” గ్రీకు పదం స్తుతిస్తూ పాడడం లేదా కీర్తన ఆలపించడం అని సూచించగలదు; వాద్యసహకారం ఉండాలని అది తప్పనిసరిగా చెప్పదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλοῦντες
  choice: మాట్లాడుకుంటూ
  rationale: వర్తమాన కృదంత భావాన్ని నిలుపుతూ, సమాజంలోని పరస్పర సంభాషణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἑαυτοῖς
  choice: ఒకరితో ఒకరు
  rationale: బహువచన సందర్భంలో ఆత్మవాచక సర్వనామానికి సాధారణంగా ఉండే పరస్పరార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ψαλμοῖς
  choice: కీర్తనలతో
  rationale: కానానికల్ కీర్తనలకే పరిమితం చేయకుండా, గ్రీకు పదంలోని కీర్తన లేదా కీర్తనసదృశ గానం అనే విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: ὕμνοις
  choice: స్తోత్రగీతాలతో
  rationale: దేవుని స్తుతించే గీతాల భావాన్ని సహజంగా తెలియజేస్తూ, ψαλμοῖς మరియు ᾠδαῖς నుండి మూడు పదాల క్రమంలోని భేదాన్ని కాపాడుతుంది.
- source_word: ᾠδαῖς πνευματικαῖς
  choice: ఆత్మసంబంధమైన పాటలతో
  rationale: πνευματικαῖς అనే విశేషణంలోని ఉద్దేశపూర్వక విస్తృతతను నిలుపుతూ, అవి తప్పనిసరిగా ప్రత్యక్షంగా ఆత్మ ప్రేరేపించినవని మూలపాఠం కంటే బలంగా చెప్పదు.
- source_word: ᾄδοντες
  choice: పాడుతూ
  rationale: సూటిగా కృదంత క్రియను తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ψάλλοντες
  choice: మధురగానం చేస్తూ
  rationale: పాడి స్తుతించడం లేదా స్వరమాధుర్యంతో గానం చేయడం అనే సంగీత భావాన్ని నిలుపుతూ, వాద్యసహకారం తప్పనిసరి అని సూచించదు.
- source_word: τῇ καρδίᾳ ὑμῶν
  choice: మీ హృదయంతో
  rationale: ఏకవచన καρδίᾳను నిలుపుతూ, దత్తివిభక్తిలోని సాధన లేదా విధాన భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τῷ κυρίῳ
  choice: ప్రభువుకు
  rationale: దత్తివిభక్తి సూచించే లక్ష్యాన్ని సహజంగా తెలియజేస్తూ, κύριοςను సంప్రదాయబద్ధమైన కానీ తటస్థమైన 'ప్రభువు'గా అనువదిస్తుంది.
theological_decisions:
- issue: ψάλλοντες అనే పదం సంగీత ఆచారానికి సంబంధించిన అర్థం
  choice: వాద్యసహకారాన్ని నిర్దేశించకుండా 'మధురగానం చేస్తూ' అని అనువదించడం
  alternative: '''స్తుతిగానం చేస్తూ'' లేదా ''వాయిస్తూ'' అని అనువదించడం'
  rationale: ఈ గ్రీకు పదానికి చారిత్రకంగా తీగలను మీటడం అనే భావం ఉన్నప్పటికీ, ఈ సందర్భంలో వాద్యాలు తప్పనిసరి అని అది నిర్ధారించదు. అనువాదం వాద్యసంగీతానికి అనుకూలమైనా వ్యతిరేకమైనా సంఘపరమైన సిద్ధాంతాన్ని చొప్పించదు.
- issue: '''ప్రభువు'' అనే పదం ఎవరిని సూచిస్తుంది'
  choice: మూలపాఠంలోని సాధారణ రూపాన్నే 'ప్రభువు'గా ఉంచడం
  alternative: స్పష్టంగా 'ప్రభువైన యేసుకు' అని గుర్తించడం
  rationale: ఎఫెసీయులకు పత్రిక సందర్భంలో ఇది క్రీస్తును సూచించే అవకాశం ఉన్నా, ఈ వచనం κύριος అని మాత్రమే చెబుతుంది. అందువల్ల పూర్తి గుర్తింపును సందర్భానికే వదిలివేస్తుంది.
- issue: πνευματικαῖς యొక్క భావం
  choice: '''ఆత్మసంబంధమైన'' అని ఉంచడం'
  alternative: '''ఆత్మ ప్రేరేపించిన'' అని అనువదించడం'
  rationale: విశేషణం దేవుని ఆత్మతో సంబంధాన్ని సూచించగలిగినా, ప్రత్యక్ష ప్రేరణ అనే బలమైన సిద్ధాంత వాదనను ఈ రూపం తప్పనిసరిగా చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘపరమైన పఠనానికి తగిన గౌరవప్రదమైన మరియు సులభగ్రాహ్యమైన శైలి. మూడు రకాల గీతాల వరుసను కాపాడి, అన్ని కృదంతాలను కొనసాగుతున్న పరస్పర కార్యాలుగా సహజంగా అమర్చాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో ఉంచబడింది.
