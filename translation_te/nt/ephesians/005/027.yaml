id: EPH.5.27
reference: Ephesians 5:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα παραστήσῃ ⸀αὐτὸς ἑαυτῷ ἔνδοξον τὴν ἐκκλησίαν, μὴ ἔχουσαν σπίλον ἢ ῥυτίδα ἤ τι τῶν τοιούτων, ἀλλ’ ἵνα ᾖ ἁγία καὶ ἄμωμος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/027.yaml
  text: so that he himself might present the church to himself in splendor[a], not having spot or wrinkle or anything like that[c][b], but so that she might be holy and blameless.
translation:
  language: te
  text: తానే సంఘాన్ని తనకు మహిమగలదానిగా[a] సమర్పించడానికి, దానికి మచ్చగానీ, ముడతగానీ, అలాంటిదేదీగానీ[b] లేకుండా, అది పవిత్రంగా, నిర్దోషంగా[c] ఉండేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మహిమాన్విత స్థితిలో’. గ్రీకు విశేషణం సంఘపు గుణాన్ని లేదా అది సమర్పించబడే మహిమాన్విత స్థితిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అటువంటిదేదీ’.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘లోపరహితంగా’ లేదా ‘కళంకరహితంగా’.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραστήσῃ
  choice: నిలబెట్టుకోవడానికి
  rationale: ἵναతో కూడిన భూతకాలార్థక సబ్జంక్టివ్ ఉద్దేశాన్ని సూచిస్తుంది. ఇక్కడ παρίστημι ఒకరి ఎదుట సమర్పించడం లేదా నిలబెట్టడం అనే భావం ఇస్తుంది; తెలుగు సందర్భంలో ‘తన ఎదుట ... నిలబెట్టుకోవడానికి’ అనేది వివాహ రూపకాన్ని, పరిశీలనాత్మక సమక్షతను సహజంగా నిలుపుతుంది.
- source_word: αὐτὸς
  choice: తానే
  rationale: స్పష్టంగా ఉన్న కర్తృ సర్వనామం ఉద్ఘాటన కలిగిస్తుంది; ‘తానే’ ఆ బలాన్ని కాపాడుతుంది.
- source_word: ἑαυτῷ
  choice: తన ఎదుట
  rationale: ప్రతిబింబ దత్తివు కర్తతో సంబంధాన్ని సూచిస్తుంది. ‘తన ఎదుట’ అనేది సమర్పణ భావాన్ని సహజ తెలుగులో తెలియజేస్తూ ప్రతిబింబతను కాపాడుతుంది; ‘తన కోసం’ అనే ప్రయోజనార్థాన్ని బలవంతంగా నిర్ణయించదు.
- source_word: ἔνδοξον
  choice: మహిమగలదానిగా
  rationale: విశేషణం సంఘం ఏ స్థితిలో నిలబెట్టబడుతుందో వివరిస్తుంది. ‘మహిమగలదానిగా’ గుణం లేదా మహిమాన్విత స్థితి రెండింటికీ తగిన సహజ తెలుగు రూపం.
- source_word: τὴν ἐκκλησίαν
  choice: సంఘాన్ని
  rationale: ఇక్కడ పదం దేవుని ప్రజల సమష్టిని సూచిస్తుంది. ఆధునిక తెలుగు క్రైస్తవ వాడుకలో ‘సంఘం’ స్థిరమైన, సందర్భోచితమైన పదం.
- source_word: μὴ ἔχουσαν
  choice: లేకుండా
  rationale: ఈ కృదంత పదబంధం సంఘం స్థితిని వివరిస్తుంది. తెలుగులో ‘లేకుండా’ సహజంగా ఉండి గ్రీకు నిషేధాత్మక వివరణను స్పష్టంగా అందిస్తుంది.
- source_word: σπίλον
  choice: మచ్చ
  rationale: ‘మచ్చ’ శుద్ధతకు సంబంధించిన దృశ్య రూపకాన్ని నిలుపుతుంది; ‘ముడత’తో సహజంగా జతకడుతుంది.
- source_word: ῥυτίδα
  choice: ముడత
  rationale: ఇది ప్రత్యక్షమైన తెలుగు సమానార్థకం; శరీర/వధువు రూపకాన్ని కాపాడుతుంది.
- source_word: ἤ τι τῶν τοιούτων
  choice: అలాంటిదేదీగానీ
  rationale: ముందు చెప్పిన రెండు ఉదాహరణలకు మించిన విస్తృత వర్గాన్ని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ నిర్దిష్టం కాని విస్తరణను సహజంగా తెలియజేస్తుంది.
- source_word: ἀλλ’ ἵνα ᾖ
  choice: అది ... ఉండేలా
  rationale: రెండవ ἵνα ఉపవాక్యం ప్రతికూల వివరణకు ఎదురుగా సానుకూల ఉద్దేశం లేదా ఫలితాన్ని తెలియజేస్తుంది. ‘అది’ అనే నపుంసక సర్వనామం తెలుగు ‘సంఘం’కు వ్యాకరణపరంగా సహజం; మూలంలోని స్త్రీలింగ రూపాన్ని తెలుగులో కృత్రిమంగా మోపదు.
- source_word: ἁγία
  choice: పవిత్రంగా
  rationale: ἅγιοςకు స్థిరమైన, గౌరవప్రదమైన తెలుగు సమానార్థకం; కేవలం ‘ప్రత్యేకపరచబడిన’ అని వివరణాత్మకంగా పరిమితం చేయదు.
- source_word: ἄμωμος
  choice: నిర్దోషంగా
  rationale: లోపం లేదా నింద లేకపోవడం అనే భావాన్ని అందిస్తుంది. ముందున్న ‘మచ్చ’ దేహసంబంధ రూపకాన్ని నిలుపుతుండగా, ‘నిర్దోషంగా’ నైతిక/మూల్యాంకన సంబంధ పరిమాణాన్నీ తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: క్రీస్తు సంఘాన్ని తానే తనకు సమర్పించుకునే ప్రతిబింబ రూపకం
  choice: ‘తానే తన ఎదుట ... నిలబెట్టుకోవడానికి’ అని ఉద్ఘాటనను, ప్రతిబింబ సంబంధాన్ని రెండింటినీ నిలిపాం.
  alternative: ‘సంఘాన్ని నిలబెట్టడానికి’ అని సరళీకరించడం; లేదా దేవుని ఎదుట అంత్యకాల సమర్పణగా స్పష్టంగా వ్యాఖ్యానించడం.
  rationale: గ్రీకులో αὐτός, ἑαυτῷ రెండూ స్పష్టంగా ఉన్నాయి. అనువాదం విస్తృతమైన తాత్త్విక అర్థాన్ని నిర్ణయించకుండా మూలంలోని సాహిత్య, తాత్త్విక ఉద్వేగాన్ని కాపాడుతుంది.
- issue: సంఘానికి సంబంధించిన శుద్ధత భాష
  choice: ‘మచ్చ...ముడత...పవిత్రంగా, నిర్దోషంగా’ అని అనువదించి దృశ్యమైన వధువు రూపకాన్నీ, నైతిక/ఆరాధనా శుద్ధత భావాన్నీ నిలిపాం.
  alternative: ‘కళంకం...ముడత...పవిత్రంగా, కళంకరహితంగా’ అని ఒకే లోపరహిత పదజాలాన్ని పునరావృతం చేయడం.
  rationale: వాక్యం స్పష్టమైన శరీర/వధువు చిత్రణను పవిత్రత, లోపరాహిత్య భాషతో కలుపుతుంది. ఒకే సిద్ధాంతాత్మక అర్థానికి కుదించకుండా రెండు పరిమాణాలూ కనిపించేలా చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘తానే’ ద్వారా మూలంలోని ఉద్ఘాటనను నిలిపాం. ‘సంఘం’కు సహజ తెలుగు సర్వనామమైన ‘అది’ వాడి, గ్రీకు వ్యాకరణ స్త్రీలింగాన్ని కృత్రిమంగా అనుకరించలేదు. ప్రధాన వాక్యంలోని డాష్‌లు ప్రతికూల, సానుకూల స్థితి వివరణలను స్పష్టంగా చూపుతాయి.
