revisions:
- from: తానే తన ఎదుట సంఘాన్ని మహిమగలదానిగా[a] నిలబెట్టుకోవడానికి—దానికి మచ్చగానీ, ముడతగానీ, అలాంటిదేదీగానీ[b] లేకుండా, అది పవిత్రంగా, నిర్దోషంగా ఉండేలా—ఇలా చేశాడు.
  to: తానే సంఘాన్ని తనకు మహిమగలదానిగా[a] సమర్పించడానికి, దానికి మచ్చగానీ, ముడతగానీ, అలాంటిదేదీగానీ[b] లేకుండా, అది పవిత్రంగా, నిర్దోషంగా[c] ఉండేలా.
  rationale: ‘సమర్పించడానికి’ παραστήσῃ యొక్క అధికారిక/వధువు-సంబంధ సమర్పణ భావాన్ని మరింత నేరుగా అందిస్తుంది. ‘తనకు’ ἑαυτῷ యొక్క ప్రతిబింబ దత్తివును కాపాడుతూ ‘ఎదుట’ అనే అదనపు స్థానార్థాన్ని నివారిస్తుంది. మూలంలోని పరస్పర సంబంధం గల రెండు ἵνα ఉద్దేశ ఉపవాక్యాలను నిలిపేందుకు, మూలంలో లేని ‘ఇలా చేశాడు’ తొలగించబడింది. ἄμωμος‌కు ఉన్న లోపరాహిత్య సూచనను పాదటిప్పణిలో అందించాం.
