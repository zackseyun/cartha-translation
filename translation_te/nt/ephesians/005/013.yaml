  verdict: revise
  source_fidelity: The draft accurately conveys the contrast (δέ), the comprehensive scope of τὰ πάντα, the agency of the light, and the disclosure/result expressed by ἐλεγχόμενα and φανεροῦται. The revision retains the Greek present participial sense without forcing a temporal "when" clause.
  naturalness: The draft's "బట్టబయలు చేయబడినప్పుడు కనిపించేలా అవుతాయి" is understandable but unnecessarily periphrastic and somewhat repetitive. "వెలుగు చేత బట్టబయలయ్యేవన్నీ ప్రత్యక్షమవుతాయి" is more natural modern standard Telugu while maintaining the passive disclosure imagery.
  terminology: '"వెలుగు" appropriately retains the contextually important metaphor without identifying it with a particular theological referent. "బట్టబయలు" and "ప్రత్యక్షమవుతాయి" clearly distinguish exposure from resulting visibility.'
  issues:
