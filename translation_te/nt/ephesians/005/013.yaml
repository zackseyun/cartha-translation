id: EPH.5.13
reference: Ephesians 5:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὰ δὲ πάντα ἐλεγχόμενα ὑπὸ τοῦ φωτὸς φανεροῦται,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/013.yaml
  text: But all things[a], when exposed by the light, are made visible,
translation:
  language: te
  text: కానీ వెలుగు చేత బట్టబయలయ్యేవన్నీ ప్రత్యక్షమవుతాయి,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ... πάντα
  choice: అన్నీ
  rationale: ఆర్టికల్‌తో ఉన్న నపుంసక బహువచనం విస్తృతమైన, సమగ్ర పరిధిని సూచిస్తుంది. ఆధునిక తెలుగులో “అన్నీ” సహజంగా ఉండి ఆ పరిధిని నిలుపుతుంది.
- source_word: δὲ
  choice: కాని
  rationale: ముందటి వాక్యంతో ఉన్న స్వల్ప వ్యతిరేకతను లేదా భావ మలుపును “కాని” స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐλεγχόμενα
  choice: బట్టబయలు చేయబడినప్పుడు
  rationale: ἐλέγχω అనే పదానికి తప్పు చూపడం, ఖండించడం, బట్టబయలు చేయడం వంటి అర్థాలు ఉన్నాయి. ఇక్కడ వెలుగు కర్తగా ఉండడం, తరువాత φανεροῦται రావడం వల్ల దాగి ఉన్నది వెలుగులో బయటపడడం ప్రధాన భావం. ఈ రూపం గ్రీకు కర్మణి అసమాపక క్రియ యొక్క కాలసంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ὑπὸ τοῦ φωτὸς
  choice: వెలుగు చేత
  rationale: జెనిటివ్‌తో ఉన్న ὑπό కర్తృత్వాన్ని సూచిస్తుంది. “చేత” కర్మణి నిర్మాణాన్ని నిలుపుతుంది; సందర్భంలో ముందే ప్రస్తావించబడిన వెలుగునే ఇది సూచిస్తుంది.
- source_word: φανεροῦται
  choice: కనిపించేలా అవుతాయి
  rationale: కర్మణి φανερόω కనిపించేటట్లు కావడం లేదా ప్రత్యక్షం కావడం అనే భావాన్ని ఇస్తుంది. “కనిపించేలా అవుతాయి” వెలుగు ప్రతీకకు తగిన సహజమైన తెలుగును ఇస్తూ ఫలిత స్థితిని తెలియజేస్తుంది.
theological_decisions:
- issue: సందర్భంలో “వెలుగు” దేనిని సూచిస్తుంది?
  choice: ఈ వచనంలో దాని నిర్దిష్ట సూచనను వివరించకుండా “వెలుగు”గానే అనువదించడం.
  alternative: క్రీస్తు; సువార్త; నైతిక సత్యం; విశ్వాసుల సమాజపు సాక్ష్యం.
  rationale: సమీప సందర్భం విశ్వాసులను ప్రభువులో వెలుగుగా పేర్కొని, చీకటి క్రియలను బట్టబయలు చేయమని చెబుతుంది. అయితే ఈ వచనం “వెలుగు”ను ఒకే నిర్దిష్ట సూచనకు పరిమితం చేయదు; అందువల్ల ప్రతీకలోని భావ విస్తృతిని అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకు కర్మణి భావాన్ని నిలుపుతూ వాక్యాన్ని సహజంగా రూపొందించాం. చివరి అల్పవిరామం తరువాతి వచనంతో వాక్య సంబంధం కొనసాగుతుందని సూచిస్తుంది.
