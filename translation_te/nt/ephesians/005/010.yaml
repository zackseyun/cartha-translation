  text: testing what is pleasing to the Lord;[a]
translation:
  language: te
  text: ప్రభువుకు ఏది ఇష్టమో పరీక్షించి తెలుసుకుంటూ;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువుకు ఏది ఇష్టమో వివేచిస్తూ” లేదా “కనుగొంటూ.”
    reason: δοκιμάζοντες అనే పదానికి పరీక్షించి నిర్ధారించడం, వివేచించడం, కనుగొనడం అనే సందర్భోచిత భావ ఛాయలు ఉన్నాయి.
lexical_decisions:
- source_word: δοκιμάζοντες
  choice: పరీక్షించి తెలుసుకుంటూ ఉండండి
  rationale: వర్తమాన కర్తరి కృదంతం సందర్భంలోని ప్రబోధాత్మక ప్రవాహాన్ని కొనసాగిస్తుంది. ఈ పదబంధం పరిశీలించడం, పరీక్షించడం, దాని ద్వారా గ్రహించడం అనే మూలపదంలోని క్రియాశీలమైన మూల్యాంకన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τί
  choice: ఏది
  rationale: ఇది పరోక్ష ప్రశ్నలో వాడిన ప్రశ్నార్థక రూపం; తెలుగులో “ఏది” సహజంగా సరిపోతుంది.
- source_word: ἐστιν
  choice: మో
  rationale: “ఏది ఇష్టమో” అనే తెలుగు పరోక్ష ప్రశ్న నిర్మాణంలో గ్రీకు సంధానక్రియ భావం సహజంగా అంతర్లీనమవుతుంది.
- source_word: εὐάρεστον
  choice: ఇష్టమో
  rationale: ప్రభువుకు సంతోషకరమైనది లేదా ఆమోదయోగ్యమైనది అనే భావాన్ని “ఇష్టం” సాధారణ ఆధునిక తెలుగులో స్పష్టంగా, సంబంధాత్మకంగా వ్యక్తపరుస్తుంది.
- source_word: τῷ κυρίῳ
  choice: ప్రభువుకు
  rationale: εὐάρεστον‌తో ఉన్న దత్తి విభక్తిని “ప్రభువుకు” అని సహజంగా అనువదించవచ్చు. κύριος అనే బిరుదును మూలపాఠంలాగే విస్తరించకుండా ఉంచుతుంది.
theological_decisions:
- issue: κύριος ఎవరిని సూచిస్తుంది?
  choice: ప్రభువు
  alternative: ప్రభువైన యేసు; దేవుడు
  rationale: గ్రీకు పాఠం κύριος అనే బిరుదునే ఉపయోగిస్తుంది; ఎవరిని సూచిస్తుందో స్పష్టంగా విస్తరించదు. సందర్భంలో క్రీస్తును సూచించే అవకాశం ఉన్నా, అనువాదం మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను, సాధ్యమైన ఉద్విగ్నతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన ధోరణిలో ఉంది. సందర్భంలోని కొనసాగుతున్న ప్రబోధ భావాన్ని “ఉండండి” ద్వారా వ్యక్తం చేసింది.
