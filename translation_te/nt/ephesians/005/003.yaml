id: EPH.5.3
reference: Ephesians 5:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πορνεία δὲ καὶ ⸂ἀκαθαρσία πᾶσα⸃ ἢ πλεονεξία μηδὲ ὀνομαζέσθω ἐν ὑμῖν, καθὼς πρέπει ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/003.yaml
  text: But sexual immorality and every impurity or greed must not even be named among you[a], as is proper for saints[c][b],
translation:
  language: te
  text: అయితే లైంగిక దుర్నీతి, ఏ విధమైన అపవిత్రత, లేదా దురాశ[b] మీ మధ్య కనీసం ప్రస్తావనకైనా రాకూడదు[a]—పరిశుద్ధులకు తగినట్లుగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీ మధ్య వాటి పేరు కూడా ఎత్తకూడదు.”
    reason: lexical_alternative
  - marker: b
    text: ‘దురాశ’కు బదులుగా “లోభం” లేదా “పరధనాపేక్ష” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορνεία
  choice: లైంగిక దుర్నీతి
  rationale: ఈ గ్రీకు పదం వివాహానికి ముందు లైంగిక సంబంధానికి మాత్రమే పరిమితం కాకుండా, నైతికంగా అక్రమమైన లైంగిక ప్రవర్తనను విస్తృతంగా సూచిస్తుంది. ‘లైంగిక దుర్నీతి’ ఆధునిక తెలుగులో ఆ విస్తృతిని స్పష్టంగా నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి ఉపదేశానికి స్వల్ప వ్యత్యాసంతో కూడిన కొనసాగింపును సూచిస్తుంది; ‘అయితే’ ఆ సంధాన భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀκαθαρσία πᾶσα
  choice: ఏ విధమైన అపవిత్రత
  rationale: πᾶσα తెలిపే సమగ్రతను ‘ఏ విధమైన’ స్పష్టంగా తెలియజేస్తుంది; ἀκαθαρσία యొక్క నైతిక అపవిత్రత భావాన్ని ‘అపవిత్రత’ నిలుపుతుంది.
- source_word: ἢ
  choice: లేదా
  rationale: ఇది మరో నిషిద్ధ దోషాన్ని వేరుగా కలిపే వికల్ప సంధాయకం.
- source_word: πλεονεξία
  choice: దురాశ
  rationale: మరింత సంపాదించాలనే స్వార్థపూరిత, పట్టుబట్టే ఆశను సూచించే విస్తృత నైతిక భావానికి ‘దురాశ’ సహజమైన ఆధునిక తెలుగు పదం; దీనిని కేవలం లైంగిక వాంఛకు పరిమితం చేయదు.
- source_word: μηδὲ ὀνομαζέσθω
  choice: కనీసం ప్రస్తావనకైనా రాకూడదు
  rationale: μηδέ లోని ‘కూడా కాదు’ అనే ఉద్ఘాటనను ‘కనీసం...కైనా’ నిలుపుతుంది. నిష్క్రియ ఆజ్ఞారూపాన్ని సహజమైన తెలుగు నిషేధ రూపంలో అందిస్తుంది; ‘పేరు ఎత్తబడకూడదు’ అనే అక్షరార్థం కంటే ఇది సాధారణ పాఠకులకు సహజం.
- source_word: ἐν ὑμῖν
  choice: మీ మధ్య
  rationale: వ్యక్తి అంతరంగాన్ని కాక విశ్వాసుల సమాజాన్ని ఉద్దేశించిన సామూహిక భావాన్ని తెలియజేస్తుంది.
- source_word: καθὼς πρέπει
  choice: తగినది ఇదే
  rationale: పౌలు పేర్కొనే నైతిక సముచితతను సంక్షిప్తమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἁγίοις
  choice: పరిశుద్ధులకు
  rationale: దేవునికి ప్రత్యేకపరచబడిన విశ్వాసులందరినీ సూచించే పౌలు వాడుకను నిలుపుతుంది; తరువాతి కాలపు అధికారిక సంతుల వర్గం అనే భావాన్ని అనువాదంలో చేర్చదు.
theological_decisions:
- issue: లైంగిక దోషాల మధ్య ఉన్న πλεονεξία యొక్క భావం
  choice: లైంగిక వాంఛకు పరిమితం చేయకుండా విస్తృతమైన ‘దురాశ’గా అనువదించబడింది.
  alternative: లోభం; పరధనాపేక్ష; లైంగిక దురాశ
  rationale: సందర్భంలో లైంగిక నీతి ఉన్నప్పటికీ, పౌలు వాడుకలో ఈ పదానికి విస్తృతమైన స్వార్థపూరిత ఆశ అనే భావం ఉంది. మూలపాఠం స్పష్టంగా విధించని లైంగిక పరిమితిని అనువాదం విధించకూడదు.
- issue: ἁγίοις ఎవరిని సూచిస్తుంది
  choice: దేవునికి ప్రత్యేకపరచబడిన విశ్వాసులందరినీ సూచించే ‘పరిశుద్ధులు’.
  alternative: పవిత్రులు; దేవుని పరిశుద్ధ ప్రజలు; తరువాత అధికారికంగా గుర్తించబడిన సంతులు
  rationale: ఇక్కడ పదం క్రైస్తవ సమాజమంతటినీ దాని దేవునికి చెందిన పరిశుద్ధ గుర్తింపులో సూచిస్తుంది; తరువాతి కాలపు ప్రత్యేక బిరుదును సూచించదు.
- issue: ‘ప్రస్తావనకైనా రాకూడదు’ అనే నిషేధపు పరిధి
  choice: సమాజంలో ఈ దోషాలకు చోటు లేదా పేరుప్రఖ్యాతి ఉండకూడదనే బలమైన నిషేధాన్ని, మాటల ప్రస్తావన భావంతో కూడిన మూలపాఠపు ఉద్రిక్తతను నిలుపుతూ అనువదించబడింది.
  alternative: వాటి గురించి ఏ సందర్భంలోనూ మాట్లాడకూడదు
  rationale: ὀνομάζω అక్షరార్థంగా పేరు పెట్టడం లేదా ప్రస్తావించడం కావచ్చు; అయితే ఈ వాక్యాన్ని బోధన, హెచ్చరిక వంటి ప్రతి ప్రస్తావనపైనా సంపూర్ణ నిషేధంగా నిర్బంధించడం సందర్భం కంటే ఎక్కువగా తీర్మానిస్తుంది. అందువల్ల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ఉపదేశ శైలి వాడబడింది. ‘లైంగిక దుర్నీతి’ విస్తృతమైనప్పటికీ స్పష్టమైన పదబంధం. ‘ప్రస్తావనకైనా రాకూడదు’ సహజ తెలుగు ప్రయోగం; మూలంలోని ‘పేరు పెట్టబడకూడదు’ అనే భావాన్ని పాదసూచికలో నిలిపాం. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల దగ్గర ప్రధాన పాఠ్యంలో ఉన్నాయి.
