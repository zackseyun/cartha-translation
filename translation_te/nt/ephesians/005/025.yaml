id: EPH.5.25
reference: Ephesians 5:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες, ἀγαπᾶτε τὰς ⸀γυναῖκας, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν τὴν ἐκκλησίαν καὶ ἑαυτὸν παρέδωκεν ὑπὲρ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/025.yaml
  text: Husbands[a], love your wives, just as Messiah also loved the church and gave himself up for her[b],
translation:
  language: te
  text: భర్తలారా, మెస్సీయ కూడా సంఘాన్ని ప్రేమించి, సంఘం కోసం తనను తాను అప్పగించినట్లే, మీరు మీ భార్యలను ప్రేమించండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: భర్తలారా
  rationale: గృహసంబంధ సందర్భంలో ἄνδρες అనేది సాధారణంగా ‘పురుషులు’ అని కాక, γυναῖκας‌తో జతగా ‘భర్తలు’ అని సూచిస్తుంది; సంబోధనను తెలుగులో సహజంగా వ్యక్తం చేశాం.
- source_word: ἀγαπᾶτε
  choice: ప్రేమించండి
  rationale: ఆజ్ఞార్థక రూపాన్ని గౌరవప్రదమైన బహువచన ఆజ్ఞగా అనువదించాం; అదే ధాతువుతో వచ్చిన ἠγάπησεν‌తో పదసంబంధాన్ని నిలిపాం.
- source_word: τὰς γυναῖκας
  choice: మీ భార్యలను
  rationale: వివాహ సందర్భంలో γυναῖκας అంటే ‘భార్యలు’; గ్రీకులో సంబంధం సందర్భసిద్ధంగా ఉన్నందున తెలుగులో సహజత కోసం ‘మీ’ చేర్చాం.
- source_word: καθὼς καὶ
  choice: కూడా ... నట్లే
  rationale: καθώς యొక్క పోలిక భావాన్నీ καί యొక్క అదనపు/ఉద్ఘాటన భావాన్నీ సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేశాం.
- source_word: ὁ Χριστὸς
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని నిలిపే ‘మెస్సీయ’ను వాడాం; ప్రాచుర్యంలో ఉన్న ‘క్రీస్తు’ను పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἠγάπησεν
  choice: ప్రేమించి
  rationale: ప్రధాన ఆజ్ఞతో సహజంగా కలిసే తెలుగు క్రియారూపాన్ని వాడుతూ, ἀγαπάω పదసంబంధాన్ని నిలిపాం.
- source_word: τὴν ἐκκλησίαν
  choice: సంఘాన్ని
  rationale: పౌలు వాడుకలో ఇక్కడ దేవుని ప్రజల సమష్టిని సూచించే స్థిరమైన, సాధారణ తెలుగు పదం ‘సంఘం’.
- source_word: ἑαυτὸν παρέδωκεν
  choice: తనను తాను అప్పగించుకున్నాడు
  rationale: ఈ పదబంధంలోని స్వచ్ఛంద స్వీయ-అప్పగింత భావాన్ని తెలుగులో సహజంగా నిలిపాం; మూలంలో స్పష్టంగా లేని ప్రాయశ్చిత్త వివరణను జోడించలేదు.
- source_word: ὑπὲρ αὐτῆς
  choice: దాని కోసం
  rationale: ὑπέρ + షష్ఠీ యొక్క ‘కోసం/పక్షంగా’ భావాన్ని సంక్షిప్తంగా వ్యక్తం చేశాం. αὐτῆς సంఘాన్ని సూచిస్తుంది; తెలుగులో ‘సంఘం’కు సహజంగా సరిపడే సర్వనామాన్ని వాడాం.
theological_decisions:
- issue: వివాహ-సంఘ ఉపమానంలో Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: గ్రీకు పదం ఇక్కడ బిరుదు భావంతో ఉన్నందున దాని అర్థాన్ని ప్రత్యక్షంగా నిలిపాం; ఏ సంప్రదాయానికీ ప్రత్యేకమైన వ్యాఖ్యానాన్ని చేర్చలేదు.
- issue: παρέδωκεν ὑπὲρ αὐτῆς లోని బలిదాన భావ పరిమితి
  choice: దాని కోసం తనను తాను అప్పగించుకున్నాడు
  alternative: దాని కోసం తనను తాను ఇచ్చుకున్నాడు
  rationale: సంఘం కోసం మెస్సీయ చేసిన స్వీయ-అప్పగింతను స్పష్టంగా ఉంచుతూ, ఈ ఉపవాక్యంలో లేని అదనపు ప్రాయశ్చిత్త పదజాలాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. గ్రీకు వాక్యంలోని పోలికను తెలుగులో సహజంగా ఉండేందుకు పునర్వ్యవస్థీకరించాం. ‘మెస్సీయ’కు పాదటిప్పణిలో విస్తృతంగా తెలిసిన ‘క్రీస్తు’ ప్రత్యామ్నాయం ఇచ్చాం.
