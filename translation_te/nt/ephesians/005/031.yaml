id: EPH.5.31
reference: Ephesians 5:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀντὶ τούτου καταλείψει ἄνθρωπος ⸀τὸν ⸀πατέρα καὶ ⸀τὴν μητέρα καὶ προσκολληθήσεται ⸂τῇ γυναικὶ⸃ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/031.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife[a], and the two will become one flesh.
translation:
  language: te
  text: ఈ కారణంగా[a] పురుషుడు తన తండ్రిని, తల్లిని విడిచిపెట్టి తన భార్యతో ఐక్యమవుతాడు; ఆ ఇద్దరూ ఒకే శరీరమవుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దీనివల్ల.” ఆదికాండం ఉల్లేఖనంలో గ్రీకు పదబంధం కారణాన్ని సూచించే అనుసంధానంగా పనిచేస్తోంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τούτου
  choice: ఈ కారణంగా
  rationale: ఈ ఆదికాండం ఉల్లేఖనంలో ఈ పదబంధం ప్రత్యామ్నాయాన్ని కాకుండా కారణాన్ని లేదా ఫలిత సంబంధాన్ని సూచిస్తోంది. ఆధునిక తెలుగులో ‘ఈ కారణంగా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: καταλείψει
  choice: విడిచిపెట్టి
  rationale: ఇక్కడ తల్లిదండ్రులను నిర్దయగా త్యజించడం కాదు, వివాహ బంధం కోసం వారి గృహాన్ని విడిచి వెళ్లడం ఉద్దేశం. ‘విడిచిపెట్టి’ ఆ భావాన్ని అతిశయోక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: ἄνθρωπος
  choice: పురుషుడు
  rationale: ἄνθρωπος సాధారణంగా ‘మనిషి’ అని అర్థమివ్వగలిగినా, ఇక్కడ ‘తన భార్య’తో జతగా ఉన్న పురుష భాగస్వామిని సూచిస్తోంది.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: తన తండ్రిని, తల్లిని
  rationale: గ్రీకు వాక్యంలో స్వత్వసూచక పదం ప్రత్యక్షంగా లేకపోయినా సందర్భం దానిని స్పష్టం చేస్తుంది; తెలుగులో సహజత కోసం ‘తన’ చేర్చబడింది.
- source_word: προσκολληθήσεται
  choice: ఐక్యమవుతాడు
  rationale: ఈ భవిష్యత్ నిష్క్రియారూపం భార్యతో దృఢంగా జతచేయబడడాన్ని సూచిస్తుంది. ‘ఐక్యమవుతాడు’ వివాహసంబంధమైన సన్నిహిత ఏకత్వాన్ని సహజంగా, గౌరవప్రదంగా తెలియజేస్తుంది.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: తన భార్యతో
  rationale: వివాహ సందర్భంలో γυνή అంటే ‘భార్య.’ తెలుగు క్రియాప్రయోగానికి అనుగుణంగా సంబంధం ‘తో’ విభక్తితో వ్యక్తమైంది.
- source_word: ἔσονται οἱ δύο
  choice: ఆ ఇద్దరూ ... అవుతారు
  rationale: గ్రీకులో అక్షరార్థంగా ‘ఇద్దరూ ఉంటారు’ అయినా, ఫలితంగా ఏర్పడే ఏకత్వాన్ని తెలుగులో ‘అవుతారు’ సహజంగా వ్యక్తం చేస్తుంది; οἱ δύο స్పష్టతను ‘ఆ ఇద్దరూ’ నిలుపుతుంది.
- source_word: εἰς σάρκα μίαν
  choice: ఒకే శరీరం
  rationale: ఇక్కడ σάρξ పాప స్వభావాన్ని కాకుండా ఆదికాండం నుండి వచ్చిన వివాహ ఏకత్వ భాషను సూచిస్తోంది. ‘ఒకే శరీరం’ స్థిరమైన బైబిలు భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: వివాహ ఉల్లేఖనంలోని లింగసూచక భాష
  choice: పురుషుడు ... తన భార్య
  alternative: వ్యక్తి ... జీవిత భాగస్వామి
  rationale: మూలపాఠం ఆదికాండం 2:24ను ఉల్లేఖిస్తూ పురుషుడు–భార్య అనే జంటను స్పష్టంగా చూపుతుంది; అందువల్ల లింగసూచనను తటస్థీకరించలేదు.
- issue: εἰς σάρκα μίανలో σάρξ అనువాదం
  choice: ఒకే శరీరం
  alternative: ఒకే దేహం
  rationale: ఇది పాప స్వభావానికి సంబంధించిన పౌలు వాడుక కాదు; ఆదికాండంలోని శారీరక, సంబంధపరమైన వివాహ ఏకత్వాన్ని సూచిస్తుంది. అందుచేత స్థిరమైన బైబిలు వ్యక్తీకరణను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ఉల్లేఖనపు గంభీరతను నిలుపుతూ పురాతన క్రియారూపాలను నివారించాం. పాదసూచిక గుర్తు దానికి సంబంధించిన ప్రారంభ కారణవాచక పదబంధం వెంట ఉంచబడింది.
