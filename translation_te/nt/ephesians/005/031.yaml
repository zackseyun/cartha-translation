  source_fidelity: The translation accurately represents the causal force of ἀντὶ τούτου, the future marital departure and union, the male–wife pairing, and the explicit ‘two.’ ‘ఒకే శరీరమవుతారు’ is the established natural Telugu biblical equivalent for the Genesis-derived idiom εἰς σάρκα μίαν; it should not be replaced with the overly concrete ‘మాంసం.’
  naturalness: The wording is clear, modern standard Telugu, and appropriately dignified for a Scripture quotation. The progression from leaving parents to marital union is natural. The semicolon suitably marks the second result clause.
  terminology: ‘పురుషుడు ... తన భార్య’ preserves the gendered wording of the source without interpretive expansion. ‘ఐక్యమవుతాడు’ is a natural, respectful rendering of the marital-union sense of προσκολληθήσεται. ‘ఒకే శరీరమవుతారు’ retains the conventional biblical expression for ‘one flesh.’ The footnote is correctly anchored and faithfully supplies the causal alternative.
