source:
  edition: SBLGNT
  text: καὶ μὴ μεθύσκεσθε οἴνῳ, ἐν ᾧ ἐστιν ἀσωτία, ἀλλὰ πληροῦσθε ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/018.yaml
  text: And do not get drunk with wine[a], in which there is debauchery, but be filled with the Spirit,
translation:
  language: te
  text: ద్రాక్షామద్యంతో మత్తులో పడకండి; దానిలో విచ్చలవిడితనం ఉంది. దానికి బదులుగా పరిశుద్ధాత్మతో[a] నింపబడుతూ ఉండండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరిశుద్ధాత్మలో”; కొందరు దీనిని మరింత సాధారణంగా “ఆత్మలో” అని అర్థం చేసుకుంటారు.
    reason: ἐν πνεύματι అనే పదబంధం పరిశుద్ధాత్మను సూచించడం ప్రధాన పఠనం; అయితే ἐν యొక్క భావం (‘తో,’ ‘లో,’ లేదా ‘ద్వారా’) మరియు πνεύματιకి సాధారణ ‘ఆత్మ’ అనే పఠనం కూడా సాధ్యమే.
lexical_decisions:
- source_word: μεθύσκεσθε
  choice: మత్తులవకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞారూపం నిషేధాన్ని తెలియజేస్తుంది. ‘మత్తులవకండి’ అనేది మత్తులోకి వెళ్లే ప్రక్రియను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἴνῳ
  choice: ద్రాక్షారసంతో
  rationale: కరణార్థక దత్తివిభక్తి మత్తుకు కారణమయ్యే పదార్థాన్ని సూచిస్తుంది; ‘ద్రాక్షారసంతో’ మూలపదానికి స్పష్టమైన, సహజమైన సమానం.
- source_word: ἐν ᾧ
  choice: దానిలో
  rationale: సంబంధసర్వనామ నిర్మాణం ముందున్న ద్రాక్షారసాన్ని, లేదా దానితో కలిగే మత్తును, వెనక్కి సూచించగలదు. ‘దానిలో’ ఆ సంబంధాన్ని అతిగా నిర్ధారించకుండా నిలుపుతుంది.
- source_word: ἀσωτία
  choice: విచ్చలవిడితనం
  rationale: నైతిక అదుపులేమి, వృథా మరియు బాధ్యతారహిత ప్రవర్తన అనే భావాలను సాధారణ పాఠకులకు అర్థమయ్యేలా వ్యక్తం చేస్తుంది.
- source_word: πληροῦσθε
  choice: నింపబడుతూ ఉండండి
  rationale: వర్తమాన కర్మణి ఆజ్ఞారూపంలోని కొనసాగుతున్న లేదా పునరావృత భావాన్ని తెలుగులో సహజంగా వెల్లడిస్తుంది; నింపేది ఎవరో మూలవాక్యంలాగే స్పష్టీకరించదు.
- source_word: ἐν πνεύματι
  choice: ఆత్మతో
  rationale: πληροῦσθε తరువాత ἐν + దత్తివిభక్తి నింపే సాధనం, విషయం లేదా పరిధిని సూచించవచ్చు. ‘ఆత్మతో’ ద్రాక్షారసంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతూ పరిశుద్ధాత్మను ప్రధాన పఠనంగా సూచిస్తుంది.
theological_decisions:
- issue: πνεύματι యొక్క సూచన
  choice: ఆత్మ (పరిశుద్ధాత్మ)
  alternative: ఆత్మలో; లేదా మానవ ఆత్మ/మనోభావంలో
  rationale: పౌలు వాడుక మరియు సమీప సందర్భం పరిశుద్ధాత్మను సూచించే పఠనానికి బలం ఇస్తాయి. అయితే గ్రీకులో నిర్దిష్ట ఉపపదం లేకపోవడం వల్ల మానవ ఆత్మ లేదా మనోభావం అనే పఠనాన్ని పూర్తిగా తొలగించలేం; అందుకే ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- issue: ἐν πνεύματι లో ἐν యొక్క భావం
  choice: ఆత్మతో
  alternative: ఆత్మలో; ఆత్మ ద్వారా
  rationale: ఈ విభక్తి నిర్మాణం విషయం, పరిధి లేదా సాధనం మధ్య కొంత సందిగ్ధతను కలిగి ఉంది. ప్రధాన పాఠం సహజమైన తెలుగు వ్యత్యాసాన్ని ఇస్తుంది; ఇతర సాధ్య భావాలను పాదసూచిక సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘నింపబడుతూ ఉండండి’ ద్వారా ఆజ్ఞ యొక్క కొనసాగుతున్న భావం నిలుపబడింది. ‘విచ్చలవిడితనం’ నైతిక అదుపులేమిని సహజంగా తెలియజేస్తుంది.
