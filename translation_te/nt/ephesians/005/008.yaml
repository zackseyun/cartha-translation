  yaml_path: translation/nt/ephesians/005/008.yaml
  text: For you were once darkness[a], but now you are light in the Lord. Walk as children of light,
translation:
  language: te
  text: ఎందుకంటే మీరు ఒకప్పుడు చీకటిగా ఉండేవారు; కానీ ఇప్పుడు ప్రభువులో వెలుగుగా ఉన్నారు. వెలుగు పిల్లలుగా నడుచుకోండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, భావాన్ని మరింత వివరిస్తూ, “వెలుగు పిల్లలుగా జీవించండి.” గ్రీకు మూలంలో “నడుచుకోండి” అని ఉంది; పౌలు దీన్ని ఒకరి జీవన విధానానికి సాధారణ రూపకంగా వాడుతాడు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε
  choice: ఉన్నారు
  rationale: εἰμί యొక్క అసంపూర్ణ భూతకాల రూపం గతంలో కొనసాగిన స్థితిని సూచిస్తుంది; కాలసూచకమైన ‘ఒకప్పుడు’తో కలిసి ‘ఉన్నారు’ సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందున్న ఉపదేశానికి కారణాత్మక వివరణను అనుసంధానిస్తుంది; తెలుగులో ‘ఎందుకంటే’ ఈ సంబంధాన్ని స్పష్టంగా, సహజంగా చూపిస్తుంది.
- source_word: ποτε
  choice: ఒకప్పుడు
  rationale: గత స్థితికి, ప్రస్తుత స్థితికి మధ్యనున్న వ్యత్యాసాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: σκότος
  choice: చీకటిగా
  rationale: మూలంలో ఇది ‘చీకటిలో’ అని కాక, విధేయ నామవాచకంగా వ్యక్తుల స్థితి/గుర్తింపును బలంగా చెబుతుంది. తెలుగులో ‘చీకటిగా ఉన్నారు’ ఆ గుర్తింపు రూపకాన్ని కాపాడుతుంది.
- source_word: νῦν δὲ
  choice: అయితే ఇప్పుడు
  rationale: గత స్థితి నుంచి ప్రస్తుత స్థితికి ఉన్న బలమైన వ్యత్యాసాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: φῶς
  choice: వెలుగుగా
  rationale: ‘వెలుగులో’ లేదా ‘వెలుగు పొందినవారు’ అని సడలించకుండా, మూలంలోని విధేయ నామవాచక రూపకాన్ని కాపాడుతుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: ప్రభువుతో సంబంధం లేదా ఐక్యతలో ఏర్పడిన కొత్త స్థితిని సూచించే పౌలు వాడుకను నేరుగా నిలుపుతుంది.
- source_word: ὡς
  choice: గా
  rationale: వారి గుర్తింపుకు తగిన ప్రవర్తనా విధానాన్ని సూచిస్తుంది; ‘వెలుగు పిల్లలుగా’ అనేది తెలుగులో సహజంగా ఉంది.
- source_word: τέκνα φωτός
  choice: వెలుగు పిల్లలు
  rationale: τέκνα లింగసమావేషకమైన ‘పిల్లలు’; ‘వెలుగు’తో ఉన్న సంబంధాన్ని తెలిపే జనిటివ్ రూపకాన్ని నిలుపుతుంది.
- source_word: περιπατεῖτε
  choice: నడుచుకోండి
  rationale: వర్తమాన ఆజ్ఞారూపంలోని పౌలు నైతిక ‘నడక’ రూపకాన్ని నిలుపుతూ, జీవన ప్రవర్తన అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘మీరు ఒకప్పుడు చీకటి, ఇప్పుడు వెలుగు’ అనే రూపకాల తీవ్రత
  choice: ‘చీకటిగా ఉన్నారు ... వెలుగుగా ఉన్నారు’
  alternative: ‘చీకటిలో ఉన్నారు ... వెలుగులో ఉన్నారు’
  rationale: గ్రీకు వాక్యంలో పూర్వప్రత్యయ పదబంధాలు కాకుండా విధేయ నామవాచకాలు ఉన్నాయి. అందువల్ల కేవలం పరిసర స్థితి కాక, మారిన నైతిక-ఆధ్యాత్మిక గుర్తింపును తెలిపే బలాన్ని నిలుపుతున్నాం.
- issue: κύριος యొక్క అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: కొత్త నిబంధనలోని దైవశాస్త్రీయ ప్రతిధ్వనిని, పౌలు సాధారణ వాడుకను అనవసరంగా సంకుచితం చేయకుండా ‘ప్రభువు’ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘చీకటిగా/వెలుగుగా’ అనే రూపాలు మూలంలోని గుర్తింపు రూపకాన్ని నిలుపుతాయి; ‘నడుచుకోండి’ పౌలు రూపకాన్ని సహజంగా కాపాడుతుంది.
