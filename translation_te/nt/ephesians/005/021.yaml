    reason: alternative_reading
lexical_decisions:
- source_word: ὑποτασσόμενοι
  choice: లోబడుతూ ఉండండి
  rationale: ఇది ὑποτάσσω అనే క్రియ యొక్క వర్తమాన మధ్య/కర్మణి కృదంత రూపం. ముందున్న ఆజ్ఞకు అనుసంధానమైన కొనసాగుతున్న క్రియను తెలుగులో సహజంగా తెలియజేయడానికి ‘లోబడుతూ ఉండండి’ అని అనువదించాం; పరస్పరతను ἀλλήλοις స్పష్టపరుస్తుంది కాబట్టి అనవసరంగా ఆత్మార్థక భావాన్ని చేర్చలేదు.
- source_word: ἀλλήλοις
  choice: ఒకరికొకరు
  rationale: దత్తివ విభక్తిలో ఉన్న పరస్పర సర్వనామం. ‘ఒకరికొకరు’ దాని పరస్పర భావాన్ని స్పష్టంగా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἐν
  choice: పట్ల భయంతో
  rationale: φόβῳతో కలిసిన ἐν ఇక్కడ స్థితి లేదా విధానాన్ని సూచిస్తుంది. తెలుగులో ‘భయంతో’ సహజంగా ఆ భావాన్ని అందిస్తుంది; భయం ఎవరిపట్లనో తెలిపేందుకు ‘పట్ల’ను Χριστοῦతో అనుసంధానించాం.
- source_word: φόβῳ
  choice: భయంతో
  rationale: φόβοςకు భయం, భక్తిపూర్వక గౌరవం, విస్మయం అనే భావాలు ఉండవచ్చు. మూలపదంలోని బలాన్ని, దైవశాస్త్ర సంబంధమైన ఉద్వేగాన్ని నిలుపుకోవడానికి ప్రధాన పాఠ్యంలో ‘భయం’ను ఉంచి, మృదువైన ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός యొక్క ఏకవచన షష్ఠీ రూపం. ఇక్కడ బిరుదు భావం చురుకుగా ఉన్నందున ‘క్రీస్తు’ అని లిప్యంతరీకరించకుండా ‘మెస్సీయ’ అని అనువదించాం; తెలుగు వాక్యనిర్మాణంలో సంబంధాన్ని ‘మెస్సీయ పట్ల’ అని వ్యక్తం చేశాం.
theological_decisions:
- issue: ‘మెస్సీయ పట్ల భయం’ అనే పదబంధ భావం
  choice: మెస్సీయ వైపు ఉద్దేశించిన భక్తిపూర్వక భయం
  alternative: మెస్సీయ కలిగించే భయం; మెస్సీయ పట్ల గౌరవభక్తి
  rationale: షష్ఠీని కర్మార్థకంగా గ్రహించడం సందర్భంలో అత్యంత నేరమైన పఠనం. అయితే ‘భయం’ను ‘గౌరవం’గా మాత్రమే మృదువుపరచకుండా ఉంచడం ద్వారా మూలంలోని బలాన్నీ, భక్తిపూర్వక భయమనే దైవశాస్త్ర ఉద్వేగాన్నీ కాపాడాం.
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός యేసు యొక్క బిరుదుగా పనిచేస్తున్నందున అర్థానువాదమైన ‘మెస్సీయ’ను ఎంచుకున్నాం. సంప్రదాయ లిప్యంతరీకరణ ‘క్రీస్తు’ను పాదసూచికలో తెలిపాం.
- issue: కృదంతానికి తెలుగులో ఆజ్ఞారూప సహాయక క్రియ
  choice: లోబడుతూ ఉండండి
  alternative: లోబడుతూ
  rationale: గ్రీకు కృదంతం ముందున్న ఆజ్ఞాత్మక సందర్భంపై ఆధారపడి ఉంది. వచనాన్ని ఒంటరిగా చదివినప్పటికీ సహజంగా అర్థమయ్యేలా ‘ఉండండి’ను చేర్చాం; ‘లోబడుతూ’ అనే రూపం ద్వారా కొనసాగింపు భావాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘లోబడుతూ ఉండండి’ కొనసాగుతున్న పరస్పర ప్రవర్తనను తెలియజేస్తుంది. పాదసూచిక సూచికలు రెండూ ప్రధాన పాఠ్యంలో సంబంధిత పదాల వెంట ఉన్నాయి.
