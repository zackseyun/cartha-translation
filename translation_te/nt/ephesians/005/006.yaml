id: EPH.5.6
reference: Ephesians 5:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μηδεὶς ὑμᾶς ἀπατάτω κενοῖς λόγοις, διὰ ταῦτα γὰρ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/006.yaml
  text: Let no one deceive you with empty words[a], for because of these things the wrath of God comes upon the sons of disobedience.
translation:
  language: te
  text: ఖాళీ మాటలతో ఎవరూ మిమ్మల్ని మోసగించనివ్వకండి; ఎందుకంటే ఈ సంగతుల కారణంగా అవిధేయతకు కుమారుల మీద దేవుని కోపం వస్తుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అవిధేయత పిల్లలు.’ ఈ నుడికారం అవిధేయత స్వభావం గలవారిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδεὶς … ἀπατάτω
  choice: ఎవరూ మిమ్మల్ని మోసగించనివ్వకండి
  rationale: గ్రీకు వర్తమాన ఆజ్ఞార్థక నిషేధ భావాన్ని సహజమైన ఆధునిక తెలుగులో హెచ్చరికగా వ్యక్తం చేస్తుంది.
- source_word: κενοῖς λόγοις
  choice: ఖాళీ మాటలతో
  rationale: ‘సారంలేని, వ్యర్థమైన’ అనే రూపక భావాన్ని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: διὰ ταῦτα
  choice: ఇలాంటి వాటి కారణంగానే
  rationale: διά + accusative తెలిపే కారణ భావాన్ని స్పష్టంగా చూపుతుంది; సందర్భంలో ముందుగా చెప్పిన పాపకార్యాలను సూచిస్తుంది.
- source_word: ἔρχεται
  choice: వస్తుంది
  rationale: గ్రీకు వర్తమాన కాలంలోని సాధారణ లేదా సమీప భావాన్ని కాలపరంగా అతిగా నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: దేవుని ఉగ్రత
  rationale: ὀργή యొక్క బలమైన దైవిక కోప భావాన్ని ‘తీర్పు’గా మృదువుచేయకుండా తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἐπὶ
  choice: మీద
  rationale: వ్యక్తులపైకి రావడం లేదా వారిమీద నిలవడం అనే దిశాత్మక భావాన్ని తెలుగులో సహజంగా తెలుపుతుంది.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: అవిధేయత కుమారులు
  rationale: గ్రీకులోని ‘అవిధేయతకు కుమారులు’ అనే సెమిటిక్ లక్షణవాచక నుడికారాన్ని రూపపరంగా నిలుపుతుంది; దాని భావాన్ని పాదసూచిక వివరిస్తుంది.
theological_decisions:
- issue: దైవిక ఉగ్రత భాషను అనువదించడం
  choice: దేవుని ఉగ్రత
  alternative: దేవుని తీర్పు
  rationale: మూలపాఠంలో సాధారణ ‘తీర్పు’ పదం కాకుండా ὀργή ఉంది; అందువల్ల దాని తీవ్రతను మృదువుచేయలేదు.
- issue: τοὺς υἱοὺς τῆς ἀπειθείας నుడికారం
  choice: అవిధేయత కుమారులు
  alternative: అవిధేయతగలవారు
  rationale: మూలంలోని పుంలింగ బహువచన రూపకాన్ని ప్రధాన పాఠంలో నిలుపుతూ, అది అవిధేయత స్వభావం గలవారిని సూచిస్తుందని పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన హెచ్చరిక ధోరణి. ‘ఖాళీ మాటలు,’ ‘దేవుని ఉగ్రత,’ ‘అవిధేయత కుమారులు’ అనే మూల రూపకాలు, ధార్మిక తీవ్రత నిలుపబడ్డాయి.
