revisions:
- from: ఖాళీ మాటలతో ఎవరూ మిమ్మల్ని మోసగించనివ్వకండి; ఎందుకంటే ఇలాంటి వాటి కారణంగానే అవిధేయత కుమారుల[a] మీద దేవుని ఉగ్రత వస్తుంది.
  to: ఖాళీ మాటలతో ఎవరూ మిమ్మల్ని మోసగించనివ్వకండి; ఎందుకంటే ఈ సంగతుల కారణంగా అవిధేయతకు కుమారుల మీద దేవుని కోపం వస్తుంది.[a]
  rationale: The revision restores the direct reference and unmarked causal force of διὰ ταῦτα, uses a direct Telugu equivalent for divine wrath, and improves the readability of the Greek idiomatic expression ‘sons of disobedience.’ The footnote remains anchored to the idiom and preserves the lexical alternative and its characterized-by sense.
