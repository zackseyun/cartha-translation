source:
  edition: SBLGNT
  text: καὶ αἰσχρότης καὶ μωρολογία ἢ εὐτραπελία, ⸂ἃ οὐκ ἀνῆκεν⸃, ἀλλὰ μᾶλλον εὐχαριστία.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/004.yaml
  text: And obscenity and foolish talk or crude joking[a], which are not fitting[b], but rather thanksgiving.
translation:
  language: te
  text: అశ్లీలమైన మాటలు, మూర్ఖపు మాటలు లేదా అసభ్యమైన హాస్యమాటలు[a]—ఇవేవీ తగినవి కావు[b]. వాటికి బదులుగా కృతజ్ఞతా మాటలు ఉండాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మోటైన పరిహాసపు మాటలు.’ గ్రీకు పదం సాధారణంగా చమత్కారాన్ని కూడా సూచించగలదు; అయితే ఇక్కడ తగని మాటలతో కలిపి వాడినందున దీనికి ప్రతికూల భావం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఇవేవీ మర్యాదకు తగవు’ లేదా ‘ఇవేవీ సముచితమైనవి కావు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχρότης
  choice: అశ్లీలమైన మాటలు
  rationale: ఈ పదం సిగ్గుచేటైన లేదా నీచమైన ప్రవర్తనను కూడా సూచించగలదు; అయితే ఇక్కడ మాటలకు సంబంధించిన పదాలతో కలిసి, కృతజ్ఞతాస్తుతులకు విరుద్ధంగా ఉన్నందున అశ్లీలమైన మాటలు అని సందర్భానుసారంగా అనువదించాం.
- source_word: μωρολογία
  choice: మూర్ఖపు మాటలు
  rationale: మూర్ఖమైన లేదా అర్థరహితమైన సంభాషణ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἢ
  choice: లేదా
  rationale: దోషాల జాబితాలో చివరి అంశాన్ని అనుసంధానించే సాధారణ ప్రత్యామ్నాయ సంధానాన్ని నిలుపుతుంది.
- source_word: εὐτραπελία
  choice: అసభ్యమైన హాస్యమాటలు
  rationale: ఈ పదం ఇతర సందర్భాల్లో చమత్కారాన్ని సూచించగలిగినా, ఇక్కడ తగనివాటిలో చేర్చబడినందున ప్రతికూల భావాన్ని స్పష్టంగా చూపే అనువాదం ఎంచుకున్నాం.
- source_word: ἃ οὐκ ἀνῆκεν
  choice: ఇవేవీ తగినవి కావు
  rationale: నపుంసక బహువచన సంబంధ సర్వనామం ముందున్న మూడు అంశాలను సమష్టిగా సూచిస్తుంది; తగనితనాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀλλὰ μᾶλλον
  choice: వాటికి బదులుగా
  rationale: నిషేధించిన మాటలకు విరుద్ధమైన సానుకూల ప్రత్యామ్నాయాన్ని తెలుగులో సహజంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: εὐχαριστία
  choice: కృతజ్ఞతాస్తుతులు
  rationale: కేవలం అంతరంగ కృతజ్ఞతకన్నా, నోటితో కృతజ్ఞత తెలియజేయడాన్ని సూచిస్తూ ముందున్న మాటలతో ఉన్న వ్యత్యాసాన్ని కాపాడుతుంది.
theological_decisions:
- issue: దోషాల జాబితా మాటలకు సంబంధించిన పరిధి
  choice: మూడు నామవాచకాలను ప్రధానంగా మాటలకు సంబంధించిన దోషాలుగా అనువదించడం
  alternative: αἰσχρότηςను సాధారణ నీచత్వం లేదా సిగ్గుచేటైన ప్రవర్తనగా విస్తృతంగా అనువదించడం
  rationale: μωρολογία, εὐτραπελία స్పష్టంగా మాటల వినియోగానికి సంబంధించినవి; εὐχαριστίαతో ఉన్న వ్యత్యాసం కూడా పలికే మాటల సందర్భాన్ని బలపరుస్తుంది. అయినప్పటికీ మూలపదానికి విస్తృత భావం ఉండగలదని నిర్ణయ గమనికలో గుర్తించాం.
- issue: εὐτραπελία యొక్క నైతిక విలువ
  choice: ప్రతికూల భావంలో ‘అసభ్యమైన హాస్యమాటలు’
  alternative: ‘చమత్కారం’ లేదా ‘చమత్కారమైన మాటలు’
  rationale: ఈ పదం సాధారణ గ్రీకు వాడుకలో చమత్కారాన్ని సూచించగలిగినా, ఇక్కడ దోషాల జాబితాలో ఉండటం మరియు ‘తగినవి కావు’ అనే వ్యాఖ్య దానికి ప్రతికూల భావాన్ని నిర్దేశిస్తున్నాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని నామవాచక జాబితాను సహజ తెలుగు కోసం మాటలు అనే రూపంలో స్పష్టం చేశాం; చివరి వ్యత్యాసాన్ని పూర్తి తెలుగు వాక్యంగా వ్యక్తం చేశాం.
