  to: అశ్లీలమైన మాటలు, మూర్ఖపు మాటలు లేదా అసభ్యమైన హాస్యమాటలు[a]—ఇవేవీ తగినవి కావు[b]. వాటికి బదులుగా కృతజ్ఞతా మాటలు ఉండాలి.
