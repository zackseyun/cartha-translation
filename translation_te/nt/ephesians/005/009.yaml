id: EPH.5.9
reference: Ephesians 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ καρπὸς τοῦ ⸀φωτὸς ἐν πάσῃ ἀγαθωσύνῃ καὶ δικαιοσύνῃ καὶ ἀληθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/009.yaml
  text: for the fruit of the light is in all goodness and righteousness and truth[c][b][a],
translation:
  language: te
  text: ఎందుకంటే వెలుగు ఫలం సమస్త మంచితనంలో, నీతిలో[a], సత్యంలో కనిపిస్తుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “న్యాయంలో” లేదా “న్యాయబద్ధతలో.”
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రతుల్లో “వెలుగు ఫలం”కు బదులు “ఆత్మ ఫలం” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని పిలుపుకు వివరణాత్మక కారణాన్ని పరిచయం చేస్తుంది.
- source_word: καρπὸς
  choice: ఫలం
  rationale: నైతిక, ఆత్మీయ గుణాలను ఉత్పత్తిగా చూపే పౌలు రూపకాన్ని నిలుపుతుంది.
- source_word: τοῦ φωτός
  choice: వెలుగు ఫలం
  rationale: 8వ వచనంలోని ‘వెలుగై ఉన్నారు’ అనే సందర్భాన్ని సహజమైన తెలుగు సంబంధ సమాసంతో కొనసాగిస్తుంది.
- source_word: ἐν
  choice: కనిపిస్తుంది
  rationale: ఈ గుణాల పరిధిలో వెలుగు ఫలం వ్యక్తమవుతుందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; అక్షరార్థ స్థాన భావాన్ని మోపదు.
- source_word: πάσῃ
  choice: సమస్త
  rationale: ఏ విధమైన మంచితనాన్నీ మినహాయించని సమగ్ర భావాన్ని సూచిస్తుంది.
- source_word: ἀγαθωσύνῃ
  choice: మంచితనం
  rationale: నైతిక మేలు మరియు మేలు చేసే స్వభావం రెండింటినీ విస్తృతంగా ఉంచుతుంది.
- source_word: δικαιοσύνῃ
  choice: నీతి
  rationale: వ్యక్తిగత సదాచారం, న్యాయబద్ధత రెండింటికీ స్థలం ఇచ్చే సాధారణ తెలుగు బైబిలు పదం.
- source_word: ἀληθείᾳ
  choice: సత్యం
  rationale: వాస్తవ సత్యం మరియు నిజాయితీ అనే విస్తృత అర్థపరిధిని నిలుపుతుంది.
theological_decisions:
- issue: τοῦ φωτός పాఠభేదం
  choice: వెలుగు ఫలం
  alternative: ఆత్మ ఫలం
  rationale: SBLGNTలో φωτός ఉంది; ఇది 8వ వచనంలోని వెలుగు సందర్భానికి నేరుగా సరిపోతుంది. πνεύματος అనే పాఠాన్ని పాఠభేద సూచనలో భద్రపరచాలి.
- issue: δικαιοσύνη అనువాదం
  choice: నీతి
  alternative: న్యాయం / న్యాయబద్ధత
  rationale: పౌలు వాడుకలో ఈ పదం నీతిమంతమైన ప్రవర్తనతో పాటు న్యాయ భావాన్నీ మోయగలదు; ప్రధాన పాఠంలో ‘నీతి’ని ఉంచి ప్రత్యామ్నాయాన్ని సూచనలో ఇస్తుంది.
- issue: ἐν యొక్క భావం
  choice: కనిపిస్తుంది
  alternative: ఉంటుంది / కలిగి ఉంటుంది
  rationale: ఇక్కడ జాబితాలోని గుణాలలో ఫలం వ్యక్తమవుతుందనే భావం సహజంగా వ్యక్తమవుతుంది; ‘కలిగి ఉంటుంది’ అనేది ఫలాన్ని గుణాల సమాహారంగా మరింత నిర్దిష్టంగా నిర్వచించే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఫలం’ అనే మూల రూపకాన్ని నిలిపి, ἐν భావాన్ని సహజంగా వ్యక్తం చేయడానికి ‘కనిపిస్తుంది’ వాడబడింది.
