    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: పవిత్రపరచడానికి
  rationale: ἵνα ఉద్దేశాన్ని సూచిస్తుంది. తెలుగులో క్రియార్థక రూపమైన ‘-డానికి’ సహజంగా ఉండి, ‘ఆమెను పవిత్రపరచడం’ అనే ఉద్దేశాన్ని నిలుపుతుంది.
- source_word: αὐτὴν
  choice: ఆమెను
  rationale: సందర్భంలో ఈ స్త్రీలింగ ఏకవచన సర్వనామం సంఘాన్ని సూచిస్తుంది; మూలంలోని స్త్రీలింగ రూపకాన్ని తెలుగులో నిలుపుతుంది.
- source_word: ἁγιάσῃ
  choice: పవిత్రపరచడానికి
  rationale: ἵνα కిందనున్న ఈ aorist subjunctive ఉద్దేశాన్ని వ్యక్తం చేస్తుంది. ‘పవిత్రపరచు’ అనే పదం పరిశుద్ధతకు సంబంధించిన భావాన్ని స్పష్టంగా, గౌరవప్రదంగా నిలుపుతుంది.
- source_word: καθαρίσας
  choice: శుద్ధిచేసి
  rationale: ఈ aorist participle ప్రధాన క్రియతో ముడిపడిన, సాధారణంగా ముందుగా జరిగిన చర్యను సూచిస్తుంది. ‘శుద్ధిచేసి’ తెలుగు వాక్యనిర్మాణంలో ఆ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τῷ λουτρῷ
  choice: కడుగుదల ద్వారా
  rationale: దత్తివిభక్తి ఇక్కడ సాధనార్థకంగా ఉండే అవకాశం ఉంది. λουτρόν అనే పదంలోని కడగడం/స్నానం భావాన్ని ‘కడుగుదల’ అతిగా ప్రత్యేకీకరించకుండా అందిస్తుంది.
- source_word: τοῦ ὕδατος
  choice: నీటి
  rationale: λουτρόνను విశేషించే genitive సంబంధాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἐν ῥήματι
  choice: వాక్యంతో
  rationale: ἐν + దత్తివిభక్తి సాధనం లేదా అనుబంధ పరిస్థితిని సూచించవచ్చు. ‘వాక్యంతో’ ఆ సంబంధాన్ని సిద్ధాంతపరంగా మరీ నిర్దిష్టం చేయకుండా ఉంచుతుంది.
- source_word: ῥήματι
  choice: వాక్యం
  rationale: ῥῆμαకు మాట, పలుకుబడి, సందేశం అనే భావాలు ఉండవచ్చు. ‘వాక్యం’ మూలపదంలోని విస్తృతిని, దైవిక వాక్యానికి ఉండగల ప్రతిధ్వనిని నిలుపుతూ ‘సందేశం’ అనే మరింత నిర్దిష్ట అర్థాన్ని బలవంతం చేయదు.
theological_decisions:
- issue: శుద్ధీకరణ, నీటి కడుగుదల, వాక్యం మధ్య సంబంధం మరియు సాధ్యమైన బాప్తిస్మ సంబంధిత సూచన
  choice: మూలంలోని నీటి కడుగుదల చిత్రణను ఉంచి, దానిని ఒక నిర్దిష్ట సాక్రమెంటు సిద్ధాంతంగా వివరించకుండా అనువదించడం.
  alternative: దీనిని స్పష్టంగా బాప్తిస్మ సాక్రమెంటుగా పేర్కొనడం; లేదా పూర్తిగా రూపకాలంకారంగా మాత్రమే చూపడం.
  rationale: ఈ భాష బాప్తిస్మాన్ని గుర్తుచేసే అవకాశం బలంగా ఉన్నా, గ్రీకు వాక్యం దాని సాక్రమెంటు స్వభావాన్ని ఎంత నిర్దిష్టంగా అర్థం చేసుకోవాలో తేల్చదు. కాబట్టి అనువాదం ఆ ఉద్రిక్తతను అలాగే ఉంచుతుంది.
- issue: ῥήματι అనే పదాన్ని ఎంత నిర్దిష్టంగా అనువదించాలి
  choice: ప్రధాన పాఠంలో ‘వాక్యం’ ఉపయోగించడం.
  alternative: ‘సందేశం,’ ‘పలికిన మాట,’ లేదా ‘సువార్త సందేశం.’
  rationale: సందర్భం ప్రకటించబడిన రక్షణ సందేశాన్ని సూచించవచ్చు; అయినా మూలపదం స్వయంగా అంత సంకుచితం కాదు. ‘వాక్యం’ భావాన్ని ముందుగానే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని ఉపయోగించాం. ఇది సందర్భంలోని దీర్ఘ వాక్యంలో ఉద్దేశాన్ని తెలిపే ఉపవాక్య భాగం కావడంతో, తెలుగు పాఠమూ అదే అసంపూర్ణ-సంబంధిత స్వరూపాన్ని నిలుపుతుంది. సంఘాన్ని సూచించే స్త్రీలింగ రూపకం ‘ఆమెను’ ద్వారా కాపాడబడింది.
