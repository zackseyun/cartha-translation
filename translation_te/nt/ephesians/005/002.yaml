- from: ప్రేమలో నడుచుకోండి. క్రీస్తు[a] కూడా మనలను ప్రేమించి, మనకొరకు[b] తనను తాను దేవునికి సువాసనగల అర్పణగాను బలిగాను[c] అప్పగించినట్లే మీరు కూడా నడుచుకోండి.
  to: ప్రేమలో నడుచుకోండి, మెస్సీయ[a] కూడా మనలను ప్రేమించి, మనకొరకు[b] తనను తాను దేవునికి సువాసనగల పరిమళం కోసం అర్పణగా, బలిగా[c] అప్పగించినట్లే.
