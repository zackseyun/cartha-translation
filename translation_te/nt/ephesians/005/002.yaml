reference: Ephesians 5:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ περιπατεῖτε ἐν ἀγάπῃ, καθὼς καὶ ὁ Χριστὸς ἠγάπησεν ⸀ἡμᾶς καὶ παρέδωκεν ἑαυτὸν ὑπὲρ ⸀ἡμῶν προσφορὰν καὶ θυσίαν τῷ θεῷ εἰς ὀσμὴν εὐωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/005/002.yaml
  text: and walk in love[a], just as the Messiah also loved us and gave himself up for us[c][b], an offering and sacrifice to God for a fragrant aroma.
translation:
  language: te
  text: ప్రేమలో నడుచుకోండి, మెస్సీయ[a] కూడా మనలను ప్రేమించి, మనకొరకు[b] తనను తాను దేవునికి సువాసనగల పరిమళం కోసం అర్పణగా, బలిగా[c] అప్పగించినట్లే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్రీస్తు.’ గ్రీకు బిరుదు Χριστόςకు అర్థం ‘అభిషిక్తుడు’; ఇక్కడ అది బిరుదుగా వాడబడింది.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘మన పక్షంగా.’ ‘మనకొరకు’ అని అనువదించిన గ్రీకు పదబంధం ఈ సందర్భంలో ప్రయోజనార్థక లేదా ప్రతినిధిత్వ భావాన్ని కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘సువాసనగల పరిమళం’ అనే మాటలు దేవునికి ఇంపైన అర్పణను సూచించే పాత నిబంధన బలిభాషను ప్రతిధ్వనిస్తాయి.
    reason: cross_reference
lexical_decisions:
- source_word: περιπατεῖτε
  choice: నడుచుకోండి
  rationale: పౌలు ఉపయోగించిన జీవన విధానానికి సంబంధించిన ‘నడక’ రూపకాన్ని నిలుపుతూ, ఆధునిక తెలుగులో సహజమైన ఆజ్ఞారూపాన్ని ఇస్తుంది.
- source_word: ἐν ἀγάπῃ
  choice: ప్రేమలో
  rationale: ప్రేమ జీవనానికి పరిధిగాను విధానంగాను ఉండే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ὁ Χριστός
  choice: క్రీస్తు
  rationale: తెలుగులో విస్తృతంగా గుర్తించబడే బిరుదు రూపం; గ్రీకు పదంలోని ‘అభిషిక్తుడు’ అనే బిరుదు భావాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: ἠγάπησεν ἡμᾶς
  choice: మనలను ప్రేమించి
  rationale: వాక్యంలోని ἀγάπηతో ఉన్న పదసంబంధాన్ని ‘ప్రేమ’ ధాతువు ద్వారా నిలుపుతుంది.
- source_word: παρέδωκεν ἑαυτὸν
  choice: తనను తాను ... అప్పగించిన
  rationale: స్వచ్ఛంద స్వీయసమర్పణ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; కేవలం ‘ఇచ్చాడు’ కంటే παρέδωκεν బలాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: ὑπὲρ ἡμῶν
  choice: మనకొరకు
  rationale: ప్రయోజనార్థక లేదా ప్రతినిధిత్వ భావాలకు చోటిస్తూ, మూలపదం కంటే సంకుచితమైన ప్రత్యామ్నాయ-స్థాన భావాన్ని బలవంతంగా చేర్చదు.
- source_word: προσφορὰν καὶ θυσίαν
  choice: అర్పణగాను బలిగాను
  rationale: రెండు బలిభాషా పదాలను కలిపివేయకుండా వేరువేరుగా నిలుపుతుంది.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: అర్పణ స్వీకర్త లేదా దిశను సహజంగా సూచిస్తుంది.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: సువాసనగల
  rationale: పాత నిబంధన బలిభాషను ప్రతిధ్వనించే స్పష్టమైన వాసన రూపకాన్ని నిలుపుతూ, తెలుగులో నామవాచకాలతో సహజంగా అనుసంధానిస్తుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: క్రీస్తు
  alternative: అభిషిక్తుడు; మెస్సీయ
  rationale: ‘క్రీస్తు’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజంగా గుర్తించబడుతుంది. అయితే ఇది ఇక్కడ బిరుదుగా పనిచేస్తున్నందున దాని అర్థాన్ని పాదసూచికలో తెలియజేసి బిరుదు భావాన్ని కాపాడాం.
- issue: బలి సందర్భంలో ὑπὲρ ἡμῶν యొక్క భావం
  choice: మనకొరకు
  alternative: మన పక్షంగా; మన స్థానంలో
  rationale: సందర్భం క్రీస్తు స్వీయసమర్పణను బలిగా చూపుతుంది; అయినా ὑπέρ పదాన్ని తప్పనిసరిగా ‘మన స్థానంలో’ అని సంకుచితం చేయకుండా, దాని ప్రయోజనార్థక మరియు ప్రతినిధిత్వ సాధ్యతలను తెరిచి ఉంచాం.
- issue: εἰς ὀσμὴν εὐωδίας బలిభాష
  choice: సువాసనగల
  alternative: ఇంపైన సువాసనగా
  rationale: ‘ఇంపైన’ అని చేర్చడం దేవునికి ఆమోదయోగ్యమైనదనే అంతర్లీన భావాన్ని బహిర్గతం చేస్తుంది; ప్రధాన పాఠం మాత్రం మూలంలోని వాసన రూపకాన్ని నేరుగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. మొదట ఆజ్ఞను చెప్పి, చివర ‘మీరు కూడా నడుచుకోండి’ అని పునరుద్ఘాటించడం ద్వారా పొడవైన గ్రీకు పోలికను తెలుగులో స్పష్టంగా పూర్తి చేశాం; కొత్త భావాన్ని చేర్చలేదు.
