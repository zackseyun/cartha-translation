lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే గ్రీకు సంధానపదంలోని కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μέλη
  choice: అవయవాలు
  rationale: శరీరాన్ని ఏర్పరచే భాగాలను సూచిస్తుంది. పౌలు ఉపయోగించిన శరీర రూపకాన్ని స్పష్టంగా నిలుపుతూ, సంఘానికి చెందినవారనే సమష్టి భావాన్ని కూడా మోయగల సహజమైన తెలుగు పదం.
- source_word: ἐσμὲν
  choice: మనం … అవయవాలం
  rationale: వర్తమానకాలంలోని ‘ఉన్నాము’ అనే భావాన్ని తెలుగులో సహజమైన నామవాచక విధేయ నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: τοῦ σώματος
  choice: శరీరంలోని
  rationale: క్రీస్తు శరీరానికి చెందిన భాగాలు అనే సంబంధాన్ని సహజంగా వ్యక్తం చేస్తూ, మూలంలోని శరీర రూపకాన్ని నేరుగా నిలుపుతుంది.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: సందర్భంలో సర్వనామం క్రీస్తును సూచిస్తుంది. గౌరవప్రదమైన ‘ఆయన’ ఆధునిక ప్రామాణిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: ‘ఆయన మాంసంలోనివారము, ఆయన ఎముకల్లోనివారము’ అనే దీర్ఘ పాఠాన్ని ప్రధాన వచనంలో చేర్చాలా?
  choice: SBLGNTలోని సంక్షిప్త పాఠాన్ని మాత్రమే ప్రధాన వచనంగా అనువదించడం.
  alternative: ఎందుకంటే మనం ఆయన శరీరంలోని అవయవాలం, ఆయన మాంసంలోనివారము, ఆయన ఎముకల్లోనివారము.
  rationale: అందించిన మూలపాఠంలో దీర్ఘ పదబంధం లేదు. కాబట్టి మూలభాషా పాఠానికి ప్రాధాన్యమిస్తూ దాన్ని ప్రధాన వచనంలో చేర్చకుండా, పాఠాంతరాన్ని పారదర్శకంగా పాదసూచికలో తెలిపాం.
translation_notes:
