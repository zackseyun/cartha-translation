id: EPH.4.4
reference: Ephesians 4:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἓν σῶμα καὶ ἓν πνεῦμα, καθὼς καὶ ἐκλήθητε ἐν μιᾷ ἐλπίδι τῆς κλήσεως ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/004.yaml
  text: There is one body and one Spirit[a], just as you also were called in one hope of your calling.
translation:
  language: te
  text: ఒకే శరీరం, ఒకే ఆత్మ[a] ఉన్నాయి; అలాగే మీ పిలుపుకు చెందిన ఒకే నిరీక్షణలో మీరు కూడా పిలవబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు పదానికి పెద్ద/చిన్న అక్షరాల భేదం లేదు. ఇక్కడ ‘ఆత్మ’ పరిశుద్ధాత్మను సూచించే అవకాశం ఎక్కువ; అయితే అది విశ్వాసుల ఉమ్మడి ఆత్మ లేదా ఆధ్యాత్మిక ధోరణిని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν
  choice: ఒకే
  rationale: పదేపదే వచ్చే ఏకత్వ ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: σῶμα
  choice: శరీరం
  rationale: మూల రూపకాన్ని వ్యాఖ్యానంతో విస్తరించకుండా యథాతథంగా నిలుపుతుంది; సందర్భంలో ఇది విశ్వాసుల సమష్టి శరీరాన్ని సూచిస్తుంది.
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: ఈ ఏకత్వ వరుసలో పరిశుద్ధాత్మనే సూచించే అవకాశం బలంగా ఉంది; అయితే గ్రీకులో పెద్ద, చిన్న అక్షరాల భేదం లేనందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: καθὼς καὶ
  choice: అలాగే
  rationale: ముందున్న ఏకత్వ ప్రకటనతో పాఠకుల పిలుపును సహజంగా పోల్చి అనుసంధానిస్తుంది.
- source_word: ἐκλήθητε
  choice: మీరు పిలవబడ్డారు
  rationale: కర్తను ప్రకటించని గ్రీకు కర్మణి రూపాన్ని నిలుపుతూ, దేవుడే పిలిచాడనే సందర్భార్థాన్ని అదనంగా చేర్చదు.
- source_word: ἐν μιᾷ ἐλπίδι
  choice: ఒకే నిరీక్షణలోకి
  rationale: ἐν యొక్క పరిధి లేదా స్థితి భావాన్ని, పిలుపుతో సహజంగా కలిసే తెలుగు ప్రయోగంలో అందిస్తుంది.
- source_word: τῆς κλήσεως ὑμῶν
  choice: మీ పిలుపుకు చెందిన
  rationale: ἐκλήθητε మరియు κλῆσις మధ్యనున్న పదబంధ సంబంధాన్ని ‘పిలవబడ్డారు/పిలుపు’గా కాపాడుతూ, షష్ఠీ సంబంధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πνεῦμα అనే పదం ఎవరిని లేదా దేనిని సూచిస్తుంది?
  choice: పరిశుద్ధాత్మను సూచించే ‘ఆత్మ’
  alternative: విశ్వాసులలోని ఒకే ఆత్మ లేదా ఉమ్మడి ఆధ్యాత్మిక ధోరణి
  rationale: ఎఫెసీయులకు 4:4–6లో ‘ఒకే శరీరం ... ఒకే ఆత్మ ... ఒకే ప్రభువు ... ఒకే దేవుడు, తండ్రి’ అనే వరుస పరిశుద్ధాత్మను సూచించడానికే బలమైన సందర్భాధారం ఇస్తుంది. అయినా గ్రీకు లిపిలో capitalization ద్వారా ఈ భేదం తెలియదు కాబట్టి ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గంభీరమైన వాక్య నిర్మాణం. ‘ఒకే’ అనే పునరుక్తితో మూలంలోని ఏకత్వ ఉద్ఘాటనను నిలిపాం. ‘నిరీక్షణ’ను క్రైస్తవ సందర్భంలో స్థిరమైన ఆశాభావాన్ని సూచించే సుపరిచిత పదంగా వాడాం.
