  text: making every effort to keep the unity of the Spirit in the bond of peace[a][b].
translation:
  language: te
  text: శాంతి బంధంలో ఆత్మ యొక్క ఐక్యతను కాపాడటానికి ఎంతో శ్రద్ధ వహించండి[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దానిని నిలుపుకోవడానికి శ్రద్ధ వహిస్తూ,’ లేదా ‘దానిని కాపాడటానికి పట్టుదలగా ప్రయత్నిస్తూ.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ఆత్మ’ అత్యంత సాధ్యంగా పరిశుద్ధాత్మను సూచిస్తుంది; అయితే కొందరు దీనిని విశ్వాసుల మధ్యనున్న ఉమ్మడి ఆత్మ లేదా మనోభావంగా అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδάζοντες
  choice: అన్ని విధాలా కృషి చేయండి
  rationale: ఈ వర్తమాన కర్తరి కృదంతం 1–2 వచనాల ఉపదేశ ప్రవాహాన్ని కొనసాగిస్తూ ఉత్సాహపూర్వకమైన, శ్రద్ధగల ప్రయత్నాన్ని సూచిస్తుంది. తెలుగులో స్వతంత్ర వచనంగా సహజంగా ఉండేందుకు ఆజ్ఞార్థక రూపం వాడబడింది.
- source_word: τηρεῖν
  choice: కాపాడుకోవడానికి
  rationale: ఇప్పటికే ఉన్నదాన్ని సృష్టించడం కాకుండా దానిని నిలుపుకోవడం, భద్రపరచడం అనే భావాన్ని తెలియజేస్తుంది.
- source_word: ἑνότητα
  choice: ఐక్యతను
  rationale: ἑνότηςకు సహజమైన ఆధునిక తెలుగు సమానార్థకం; ఒక్కటిగా ఉండే స్థితిని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τοῦ πνεύματος
  choice: ఆత్మ యొక్క
  rationale: సందర్భంలో ఇది అత్యంత సాధ్యంగా పరిశుద్ధాత్మను సూచిస్తుంది. అయితే గ్రీకు షష్ఠీ విభక్తి ఐక్యతకు ఆత్మతో ఉన్న సంబంధాన్ని మాత్రమే నేరుగా చెబుతుంది; ‘ఆత్మ కలిగించిన’ అని కారణార్థాన్ని పాఠ్యంలోనే ఖరారు చేయకుండా ‘ఆత్మ యొక్క’ అని ఉంచబడింది.
- source_word: ἐν
  choice: లో
  rationale: ఐక్యత కాపాడబడే పరిధి లేదా సాధనాన్ని సూచించే మూలభాష రూపకాన్ని నిలుపుతుంది.
- source_word: συνδέσμῳ
  choice: బంధంలో
  rationale: కలిపి ఉంచేదాన్ని సూచించే σύνδεσμος రూపకాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: τῆς εἰρήνης
  choice: శాంతి అనే
  rationale: శాంతియే కలిపి ఉంచే బంధమని గ్రహించడానికి సహాయపడుతుంది; ‘శాంతి యొక్క బంధం’ అనే కృత్రిమ పదబంధాన్ని నివారిస్తూ గ్రీకు షష్ఠీ సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: πνεύματος పదానికి సూచితమైనది
  choice: పరిశుద్ధాత్మ
  alternative: మానవ ఆత్మ లేదా విశ్వాసులలోని ఉమ్మడి భావం
  rationale: ఎఫెసీయులకు రాసిన పత్రికలోని సమీప సందర్భాలు, ముఖ్యంగా 4:4 మరియు 4:30, పరిశుద్ధాత్మనే బలంగా సూచిస్తున్నాయి. అయినా పాఠ్యంలో ‘పరిశుద్ధ’ అనే పదాన్ని చేర్చకుండా, ప్రత్యామ్నాయ అవగాహనను పాదసూచికలో నమోదు చేశారు.
- issue: ఐక్యత స్వభావం
  choice: ఇప్పటికే ఉన్నది; దాన్ని కాపాడాలి
  alternative: విశ్వాసులు కొత్తగా సృష్టించవలసిన ఐక్యత
  rationale: τηρεῖν అనేది ఉన్నదాన్ని నిలుపుకోవడం లేదా కాపాడడం అని సూచిస్తుంది; ఐక్యతను కొత్తగా తయారు చేయాలని మూలపాఠం చెప్పదు.
- issue: ‘ఆత్మ యొక్క’ అనే షష్ఠీ సంబంధం
  choice: సంబంధాన్ని పాఠ్యంలో తెరిచి ఉంచడం
  alternative: ‘ఆత్మ కలిగించిన’ లేదా ‘ఆత్మ ఇచ్చిన’ అని కారణార్థాన్ని స్పష్టీకరించడం
  rationale: ఆత్మ ఐక్యతకు మూలమనే భావం సందర్భానికి సరిపోతున్నా, τοῦ πνεύματος స్వయంగా ఆ కారణ సంబంధాన్ని పూర్తిగా నిర్దిష్టం చేయదు. అందువల్ల మూలంలోని సంక్షిప్తత, స్వల్ప అస్పష్టత నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువదించబడింది. ‘శాంతి అనే బంధం’ మూలంలోని బంధ రూపకాన్ని సహజంగా నిలుపుతుంది. వచనం ఒంటరిగా చదివినా సంపూర్ణ ఉపదేశంగా వినిపించేందుకు గ్రీకు కృదంతాన్ని తెలుగు ఆజ్ఞార్థకంగా వ్యక్తం చేశారు.
