source:
  edition: SBLGNT
  text: πρὸς τὸν καταρτισμὸν τῶν ἁγίων εἰς ἔργον διακονίας, εἰς οἰκοδομὴν τοῦ σώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/012.yaml
  text: for the equipping of the saints for the work of ministry[a], for the building up of the body of Messiah[c][b],
translation:
  language: te
  text: పరిశుద్ధులను సిద్ధపరచడానికి, పరిచర్య కార్యం కోసం[a], మెస్సీయ[b] శరీరాన్ని నిర్మించడానికి[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సేవా కార్యం కోసం.’ గ్రీకు διακονία అనే పదానికి ‘సేవ’ లేదా ‘పరిచర్య’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘క్రీస్తు.’ గ్రీకు Χριστός ఒక బిరుదుగా ‘అభిషిక్తుడు,’ అంటే ‘మెస్సీయ’ అని అర్థం.
    reason: alternative_reading
  - marker: c
    text: 'ఈ గ్రీకు వాక్యనిర్మాణాన్ని ప్రగతిశీలంగా కూడా అర్థం చేసుకోవచ్చు: ‘పరిశుద్ధులను పరిచర్య కార్యానికి, మెస్సీయ శరీరాన్ని నిర్మించడానికి సిద్ధపరచడం కోసం.’'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς τὸν καταρτισμὸν
  choice: సిద్ధపరచడానికి
  rationale: καταρτισμός అంటే తగినవారిగా చేయడం, సిద్ధం చేయడం, అవసరమైన సామర్థ్యాన్ని కలిగించడం. ఆధునిక తెలుగులో ‘సిద్ధపరచడానికి’ సహజంగా ఉండి ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τῶν ἁγίων
  choice: పరిశుద్ధులను
  rationale: ఇది దేవునికి ప్రత్యేకపరచబడిన విశ్వాసుల కోసం పౌలు సాధారణంగా వాడే పదం. ‘పరిశుద్ధులు’ అనే స్థిరమైన తెలుగు పదం తరువాతి కాలపు ప్రత్యేక హోదాను తప్పనిసరిగా సూచించదు.
- source_word: εἰς ἔργον διακονίας
  choice: పరిచర్య కార్యం కోసం
  rationale: ἔργον ఏకవచన భావాన్ని ‘కార్యం’ నిలుపుతుంది; διακονία సంఘ సందర్భంలో సేవ లేదా పరిచర్య అనే విస్తృత భావం కలిగి ఉంది. ‘పరిచర్య’ను మతాధికారుల పనికే పరిమితం చేయకుండా ఇక్కడ సాధారణ సేవా కార్యంగా గ్రహించవచ్చు.
- source_word: εἰς οἰκοδομὴν
  choice: నిర్మించడానికి
  rationale: οἰκοδομήలోని నిర్మాణ రూపకాన్ని నిలుపుతూ, సమాజాన్ని బలపరచడం మరియు అభివృద్ధి చేయడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τοῦ σώματος
  choice: శరీరాన్ని
  rationale: σῶμα అనే ‘శరీరం’ రూపకం మెస్సీయకు చెందిన విశ్వాసుల సమూహాన్ని సూచిస్తుంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉండి ‘అభిషిక్తుడు/మెస్సీయ’ అనే భావాన్ని కలిగి ఉంది. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: మూడు ఉద్దేశార్థక పదబంధాల వాక్యనిర్మాణ సంబంధం
  choice: మూడు పదబంధాలను వరుస ఉద్దేశాలుగా, గ్రీకు క్రమాన్ని అనుసరించి అనువదించడం
  alternative: ‘పరిశుద్ధులను పరిచర్య కార్యానికి, అంటే మెస్సీయ శరీరాన్ని నిర్మించే పనికి, సిద్ధపరచడానికి’ అని ప్రగతిశీల సంబంధంగా అర్థం చేసుకోవడం
  rationale: πρός ... εἰς ... εἰς నిర్మాణం మూడు సమాంతర లక్ష్యాలను సూచించవచ్చు; లేదా పరిశుద్ధులను సిద్ధపరచడం వల్ల వారు పరిచర్య చేసి, దానివల్ల శరీరం నిర్మించబడుతుందని ప్రగతిశీలంగా చదవవచ్చు. ప్రధాన పాఠం సంబంధాన్ని నిర్ణయాత్మకంగా పరిష్కరించకుండా గ్రీకు వరుసను నిలుపుతుంది; ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: మూలపదంలోని ‘అభిషిక్తుడు’ అనే బిరుదు భావాన్ని ‘మెస్సీయ’ స్పష్టంగా చూపుతుంది; తెలుగు క్రైస్తవ వాడుకలో స్థిరమైన ‘క్రీస్తు’ కూడా సాధ్యమైన రూపం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ఇది ముందున్న వాక్యభాగంపై ఆధారపడే ఉద్దేశార్థక ఖండం కాబట్టి చివర కామా నిలుపబడింది. ‘పరిశుద్ధులు,’ ‘పరిచర్య,’ ‘శరీరం’ వంటి పరిచిత పౌలీన పదజాలాన్ని ఉంచుతూ, ‘పరిపూర్ణులుగా చేయడం’ వంటి అపార్థానికి దారితీయగల సంప్రదాయ పదబంధాన్ని నివారించాం.
