revisions:
- from: “ఆయన పైకి ఎక్కాడు” అనే మాటకు, ఆయన భూమి దిగువ భాగాల్లోకి కూడా దిగాడనే అర్థం తప్ప మరేముంది?[a]
  to: “ఆయన పైకి ఎక్కాడు” అనే మాటకు అర్థం ఏమిటి? ఆయన భూమి యొక్క దిగువ ప్రాంతాలకు కూడా దిగాడు అనేది తప్ప మరేమిటి?[a]
  rationale: The revision preserves the Greek’s rhetorical construction, additive “also,” and directional movement. It uses a more idiomatic Telugu rendering for μέρη while avoiding a wording that could prematurely locate the descent beneath the earth. The footnote continues to preserve the disputed appositional and realm-of-the-dead readings without choosing either.
  reviewer_model: gpt-5.6-terra
