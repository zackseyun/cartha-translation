language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ δὲ Ἀνέβη τί ἐστιν εἰ μὴ ὅτι καὶ ⸀κατέβη εἰς τὰ κατώτερα μέρη τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/009.yaml
  text: What does “he ascended” mean except that he also descended into the lower parts of the earth?[a]
translation:
  language: te
  text: “ఆయన పైకి ఎక్కాడు” అనే మాటకు అర్థం ఏమిటి? ఆయన భూమి యొక్క దిగువ ప్రాంతాలకు కూడా దిగాడు అనేది తప్ప మరేమిటి?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దిగువ ప్రాంతాలకు, అంటే భూమికి.” ఈ పదబంధం భూమికి దిగివచ్చడాన్నే సూచించవచ్చు; లేదా మరింత నిర్దిష్టంగా మృతుల లోకానికి దిగడాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀνέβη
  choice: పైకి ఎక్కాడు
  rationale: ఉద్ధరించిన మాటలోని పైదిశ కదలికను, κατέβηతో ఉన్న వ్యతిరేక సమాంతరతను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: τί ἐστιν εἰ μὴ ὅτι
  choice: అనే అర్థం తప్ప మరేముంది?
  rationale: గ్రీకు వాక్యంలోని నిర్ధారణాత్మక ప్రశ్నను పదక్షర కాఠిన్యం లేకుండా, దాని వాదనాత్మక బలంతో తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καὶ κατέβη
  choice: కూడా దిగాడు
  rationale: καίలోని అదనపు భావాన్ని ‘కూడా’తో నిలిపి, ‘పైకి ఎక్కాడు’ అనే మాటతో దిశాత్మక వ్యతిరేకతను కాపాడుతుంది.
- source_word: εἰς
  choice: లోకి
  rationale: ఒక స్థలంలోనికి జరిగే కదలికను సూచించే εἰς దిశాత్మక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τὰ κατώτερα μέρη
  choice: దిగువ భాగాలు
  rationale: తులనాత్మకమైన κατώτεραను ‘దిగువ’గా, μέρηను ‘భాగాలు’గా అనువదించి, నిర్దిష్ట స్థలాన్ని ముందుగానే నిర్ణయించకుండా మూలంలోని తెరచిన భావాన్ని కాపాడుతుంది.
- source_word: τῆς γῆς
  choice: భూమి
  rationale: సందర్భంలోని పైకి ఎక్కడం–దిగడం అనే విశ్వవ్యాప్త వ్యత్యాసానికి ‘భూమి’ సహజంగా సరిపోతుంది; సంబంధార్థాన్ని తెలుగు సమాస నిర్మాణం ద్వారా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: εἰς τὰ κατώτερα μέρη τῆς γῆς అనే పదబంధపు వ్యాఖ్యానం
  choice: భూమి దిగువ భాగాల్లోకి
  alternative: దిగువ ప్రాంతాలకు, అంటే భూమికి; లేదా మృతుల లోకానికి
  rationale: గ్రీకు పదబంధం భూమినే పరలోకంతో పోల్చిన దిగువ ప్రదేశంగా సూచించవచ్చు; లేదా భూమి కిందనున్న సమాధి/మృతుల లోకాన్ని సూచించవచ్చు. ప్రధాన పాఠం ఏ ఒక్క సిద్ధాంతాత్మక వ్యాఖ్యానాన్నీ ఖరారు చేయకుండా ఈ సందిగ్ధతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం ఉపయోగించబడింది. ‘ఆరోహణమయ్యాడు/అవరోహణమయ్యాడు’ వంటి కృత్రిమంగా అనిపించే పదాల బదులు, మూలంలోని దిశాత్మక చిత్రాన్ని స్పష్టంగా చూపే ‘పైకి ఎక్కాడు/దిగాడు’ ఎంచుకోబడ్డాయి.
