  yaml_path: translation/nt/ephesians/004/018.yaml
  text: being darkened in their understanding[a], alienated from the life of God because of the ignorance that is in them, because of the hardness of their hearts[e][d][c][b],
translation:
  language: te
  text: తమ అవగాహనలో[a] చీకటిపడినవారై, తమలో ఉన్న అజ్ఞానం వల్ల, తమ హృదయాల[e] కఠినత్వం[d] వల్ల దేవుని జీవానికి[b] దూరమైనవారై[c] ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మనస్సులో’.
    reason: lexical_alternative
  - marker: b
    text: ‘దేవుని జీవం’ అంటే దేవునికి చెందిన జీవం కావచ్చు, లేదా దేవుని నుండి వచ్చే జీవం కావచ్చు.
