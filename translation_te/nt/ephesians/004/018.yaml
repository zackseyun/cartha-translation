  - marker: c
    text: లేదా ‘దేవుని జీవం నుండి వెలివేయబడినవారై’.
    reason: lexical_alternative
  - marker: d
    text: లేదా ‘మొద్దుబారిన స్థితి’.
    reason: lexical_alternative
  - marker: e
    text: గ్రీకులో ‘హృదయం’ ఏకవచనంలో ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκοτωμένοι
  choice: చీకటిపడినవారై
  rationale: పరిపూర్ణ కర్మణి కృదంతం సూచించే కొనసాగుతున్న ఫలితస్థితిని, కర్మణి భావాన్ని నిలుపుతూ తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῇ διανοίᾳ
  choice: తమ అవగాహనలో
  rationale: διάνοια ఇక్కడ మనస్సు, ఆలోచనాశక్తి, అవగాహన అనే భావాలను కలిగి ఉంది. ‘అవగాహనలో’ అనేది జ్ఞానసంబంధ సామర్థ్యాన్ని స్పష్టంగా తెలుపుతుంది.
- source_word: ἀπηλλοτριωμένοι
  choice: దూరమైనవారిగా
  rationale: పరిపూర్ణ కర్మణి రూపం సూచించే వేరుపడిన స్థితిని తెలుగులో సహజంగా తెలియజేస్తుంది; దీనిని కేవలం చట్టపరమైన వెలివేతగా పరిమితం చేయదు.
- source_word: τῆς ζωῆς τοῦ θεοῦ
  choice: దేవుని జీవానికి
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని సాధ్యమైనంత నేరుగా ఉంచి, దేవునికి చెందిన జీవమా లేక దేవుని నుండి వచ్చే జీవమా అనే నిజమైన భావసందిగ్ధతను పరిష్కరించకుండా నిలుపుతుంది.
- source_word: διὰ τὴν ἄγνοιαν τὴν οὖσαν ἐν αὐτοῖς
  choice: తమలో ఉన్న అజ్ఞానం వల్ల
  rationale: διά + ద్వితీయా విభక్తి కారణాన్ని సూచిస్తుంది; అంతర్గతంగా ఉన్న అజ్ఞానం అనే భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τὴν πώρωσιν τῆς καρδίας αὐτῶν
  choice: తమ హృదయాల కఠినత్వం వల్ల
  rationale: πώρωσις లోని గట్టిపడటం లేదా స్పందనలేమి అనే రూపకాన్ని ‘కఠినత్వం’ నిలుపుతుంది. బహువచన వ్యక్తులను సూచించే తెలుగు సహజ వాడుకకు అనుగుణంగా ‘హృదయాల’ అని ఇచ్చాం.
theological_decisions:
- issue: ‘దేవుని జీవం’ అనే పదబంధం అర్థం
  choice: ‘దేవుని జీవానికి’ అని సంబంధాన్ని తెరిచి ఉంచడం
  alternative: ‘దేవుని నుండి వచ్చే జీవానికి’ లేదా ‘దేవుని స్వంత జీవానికి’
  rationale: τοῦ θεοῦ అనే షష్ఠీ దేవునికి చెందిన జీవాన్నీ, దేవుని నుండి లభించే జీవాన్నీ సూచించగలదు. మూలపాఠంలోని భావసందిగ్ధతను వ్యాఖ్యానంతో ఏకపక్షంగా పరిష్కరించలేదు.
- issue: καρδίας ఏకవచనం, αὐτῶν బహువచన సంబంధం
  choice: తెలుగులో సహజమైన ‘తమ హృదయాల’
  alternative: రూపపరంగా దగ్గరైన ‘వారి హృదయం’
  rationale: గ్రీకులో ‘హృదయం’ ఏకవచనంలో ఉన్నప్పటికీ అది బహువచన సమూహంలోని వ్యక్తుల అంతరంగాన్ని సమష్టిగా సూచిస్తుంది. తెలుగులో ‘వారి హృదయం’ అసహజంగా లేదా ఒకే సామూహిక హృదయంగా వినిపించవచ్చు కాబట్టి బహువచనం వాడాం; భావాన్ని మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. వాక్యం సందర్భంలోని ముందు వాక్యంతో కొనసాగే కృదంత నిర్మాణాన్ని సాధ్యమైనంత వరకు నిలుపుకుంది; కారణసూచక రెండు పదబంధాలు మూలపాఠ క్రమానుసారంగా ఇవ్వబడ్డాయి.
