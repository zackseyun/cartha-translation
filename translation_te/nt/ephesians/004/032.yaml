id: EPH.4.32
reference: Ephesians 4:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀γίνεσθε εἰς ἀλλήλους χρηστοί, εὔσπλαγχνοι, χαριζόμενοι ἑαυτοῖς καθὼς καὶ ὁ θεὸς ἐν Χριστῷ ἐχαρίσατο ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/032.yaml
  text: And be kind to one another[a], tenderhearted, forgiving one another[b], just as God in Messiah forgave you.
translation:
  language: te
  text: ఒకరి పట్ల ఒకరు దయగలవారుగా, కనికరహృదయులుగా ఉండండి; దేవుడు మెస్సీయలో మిమ్మల్ని క్షమించినట్లే, మీరూ ఒకరినొకరు క్షమించండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతులలో ‘మిమ్మల్ని’ స్థానంలో ‘మనలను’ అని చదవబడుతుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: γίνεσθε
  choice: ఉండండి
  rationale: వర్తమాన ఆజ్ఞార్థక భావాన్ని, కొనసాగవలసిన స్వభావానికి సంబంధించిన సహజ తెలుగు ప్రబోధంగా తెలియజేస్తుంది; ‘అవ్వండి’ కంటే సందర్భంలో సుగమం.
- source_word: εἰς ἀλλήλους
  choice: ఒకరిపట్ల ఒకరు
  rationale: పరస్పర సంబంధంలో చూపవలసిన వైఖరిని, గ్రీకు పదబంధంలోని దిశాభావాన్ని సహజంగా నిలుపుతుంది.
- source_word: χρηστοί
  choice: దయగలవారుగా
  rationale: ఇతరులతో వ్యవహరించడంలో దయ, మేలు చేసే స్వభావం అనే సందర్భోచిత భావాన్ని ఇస్తుంది.
- source_word: εὔσπλαγχνοι
  choice: కనికర హృదయులుగా
  rationale: లోతైన అంతరంగ కనికరాన్ని తెలియజేస్తూ, χρηστοί అనే ముందరి విశేషణంతో భావభేదాన్ని నిలుపుతుంది.
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: మీరూ ఒకరినొకరు క్షమించుకోండి
  rationale: ఇక్కడ χαρίζομαι తరువాత దేవుని క్షమాపణతో పోల్చబడినందున ‘క్షమించు’ భావం సందర్భానికి సరిపోతుంది; బహువచన ἑαυτοῖς పరస్పరార్థకంగా ఉంది.
- source_word: καθὼς καὶ
  choice: క్షమించినట్లే, మీరూ
  rationale: ‘అలాగే/కూడా’ అనే అనురూపతను తెలుగులో సహజంగా రెండో భాగంలోని ‘మీరూ’ ద్వారా వ్యక్తం చేస్తుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: ἐν అనే సంబంధాన్ని ‘లో’తో నిలిపి, Χριστόςను ఇక్కడ బిరుదుగా ‘మెస్సీయ’ అని అనువదిస్తుంది.
- source_word: ἐχαρίσατο ὑμῖν
  choice: మిమ్మల్ని క్షమించిన
  rationale: దేవుని గత క్షమాపణ కార్యాన్ని సహజమైన తెలుగు క్రియారూపంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Χριστῷ అనే బిరుదు అనువాదం
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: Χριστός ఇక్కడ బిరుదు స్వరూపాన్ని కలిగి ఉన్నందున దాని అర్థాన్ని ‘మెస్సీయ’గా అందించాం; సంప్రదాయ లిప్యంతరీకరణ ‘క్రీస్తు’ను ప్రధాన పాఠ్యంలో పెట్టలేదు.
- issue: ἐν Χριστῷ యొక్క సంబంధార్థం
  choice: మెస్సీయలో
  alternative: మెస్సీయ ద్వారా
  rationale: గ్రీకు ἐνలోని ఉద్దేశపూర్వక విస్తృత సంబంధాన్ని కాపాడేందుకు ‘లో’ వాడాం; ‘ద్వారా’ అని అనడం సాధనార్థాన్ని మాత్రమే నిర్ణయించి అసలు పాఠ్యంలోని విస్తృతతను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గౌరవప్రదమైన ప్రబోధ శైలిలో రూపొందించబడింది. రెండు విశేషణాల భావభేదం, పరస్పర క్షమాపణ, ‘మెస్సీయలో’ అనే సంబంధపదబంధం నిలుపబడ్డాయి.
