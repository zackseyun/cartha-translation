revisions:
- from: ఒకరిపట్ల ఒకరు దయగలవారుగా, కనికర హృదయులుగా ఉండండి. దేవుడు మెస్సీయలో మిమ్మల్ని క్షమించినట్లే, మీరూ ఒకరినొకరు క్షమించుకోండి.[a]
  to: ఒకరి పట్ల ఒకరు దయగలవారుగా, కనికరహృదయులుగా ఉండండి; దేవుడు మెస్సీయలో మిమ్మల్ని క్షమించినట్లే, మీరూ ఒకరినొకరు క్షమించండి.[a]
  rationale: The revision makes only safe stylistic and orthographic improvements. It retains the source sequence and meaning, including the reciprocal exhortation, the distinct ethical qualities, and the deliberately broad ‘మెస్సీయలో’ for ἐν Χριστῷ. The variant note remains anchored to the clause containing ὑμῖν.
