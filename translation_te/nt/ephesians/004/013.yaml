revisions:
- from: 'మనమందరం విశ్వాసంలోను[a], దేవుని కుమారుని గురించిన జ్ఞానంలోను[b] ఐక్యతకు, పరిణతి చెందిన పురుషుని స్థాయికి[c], మెస్సీయ[d] సంపూర్ణతకు తగిన ఎదుగుదల కొలతకు[e] చేరేవరకు.


    [a] “విశ్వాసం” అనే మాట ఇక్కడ క్రైస్తవులు ఉమ్మడిగా అంగీకరించే విశ్వాస సత్యాలను లేదా విశ్వాసులు ఉంచే నమ్మకాన్ని సూచించవచ్చు.

    [b] “జ్ఞానం” అనే మాటకు “సంపూర్ణ జ్ఞానం” లేదా “లోతైన జ్ఞానం” అని కూడా అనువదించవచ్చు.

    [c] గ్రీకులో అక్షరార్థంగా “పరిణతి చెందిన పురుషునికి” అని ఉంది. సంఘమంతా కలసి పరిణతి చెందడాన్ని ఏకవచన పురుష రూపకంతో వర్ణిస్తోంది. “పరిణత పురుషత్వానికి” అని కూడా అనువదించవచ్చు.

    [d] గ్రీకు పదం “క్రీస్తు”; అది “అభిషిక్తుడు” అనే బిరుదును సూచిస్తున్నందున ఇక్కడ “మెస్సీయ” అని అనువదించబడింది.

    [e] “ఎదుగుదల”కు బదులుగా “పరిణతి” అని కూడా అనువదించవచ్చు.'
  to: మనమందరం విశ్వాసంలోను[a], దేవుని కుమారుని గురించిన జ్ఞానంలోను[b] ఐక్యతకు, పరిణతి చెందిన పురుషుని స్థితికి[c], మెస్సీయ సంపూర్ణతకు చెందిన ఎదుగుదల కొలతకు[e][d] చేరేవరకు.
  rationale: 'The revision clarifies the final Greek genitive chain without changing its metaphorical ambiguity: the intended goal is a measure of growth/stature belonging to Messiah''s fullness. It also corrects footnote [c]''s claim about a literal Telugu case-form and slightly improves the Telugu expression of the mature-man image. All footnote anchors remain present and correspond to their notes.'
