id: EPH.4.13
reference: Ephesians 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μέχρι καταντήσωμεν οἱ πάντες εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως τοῦ υἱοῦ τοῦ θεοῦ, εἰς ἄνδρα τέλειον, εἰς μέτρον ἡλικίας τοῦ πληρώματος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/013.yaml
  text: until we all attain to the unity of the faith and of the knowledge of the Son of God[a], to a mature man, to the measure of the stature of the fullness of Messiah[e][d][c][b],
translation:
  language: te
  text: మనమందరం విశ్వాసంలోను[a], దేవుని కుమారుని గురించిన జ్ఞానంలోను[b] ఐక్యతకు, పరిణతి చెందిన పురుషుని స్థితికి[c], మెస్సీయ సంపూర్ణతకు చెందిన ఎదుగుదల కొలతకు[e][d] చేరేవరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “విశ్వాసం” అనే మాట ఇక్కడ క్రైస్తవులు ఉమ్మడిగా అంగీకరించే విశ్వాస సత్యాలను లేదా విశ్వాసులు ఉంచే నమ్మకాన్ని సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: “జ్ఞానం” అనే మాటకు “సంపూర్ణ జ్ఞానం” లేదా “లోతైన జ్ఞానం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో అక్షరార్థంగా “పరిణతి చెందిన పురుషుని వైపు/స్థితికి” అనే పురుష ఏకవచన రూపకం ఉంది. సంఘమంతా కలసి పరిణతి చెందడాన్ని ఈ రూపకం వర్ణిస్తోంది. “పరిణత పురుషత్వానికి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: గ్రీకు పదం “క్రీస్తు”; అది “అభిషిక్తుడు” అనే బిరుదును సూచిస్తున్నందున ఇక్కడ “మెస్సీయ” అని అనువదించబడింది.
    reason: alternative_reading
  - marker: e
    text: “ఎదుగుదల”కు బదులుగా “పరిణతి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέχρι
  choice: చేరేవరకు
  rationale: మునుపటి వాక్యంలో చెప్పిన పరిచర్య లక్ష్యం నెరవేరే హద్దును సహజమైన తెలుగులో సూచిస్తుంది.
- source_word: καταντήσωμεν οἱ πάντες
  choice: మనమందరం … చేరేవరకు
  rationale: చేరుకోవడం అనే లక్ష్యార్థాన్ని, విశ్వాస సమాజమంతటినీ కలుపుకొనే οἱ πάντες భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: εἰς τὴν ἑνότητα τῆς πίστεως καὶ τῆς ἐπιγνώσεως
  choice: విశ్వాసంలోను, దేవుని కుమారుని గురించిన జ్ఞానంలోను ఐక్యతకు
  rationale: ఐక్యతకు సంబంధించిన రెండు సమాంతర జనిటివ్ పదబంధాలను సహజమైన తెలుగులో ఉంచుతుంది; πίστις, ἐπίγνωσις పదాల భావవిస్తృతిని పాదసూచికల్లో కాపాడుతుంది.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: దేవుని కుమారుని గురించిన
  rationale: జ్ఞానానికి దేవుని కుమారుడే విషయమని జనిటివ్ నిర్మాణానికి తగిన విధంగా తెలియజేస్తుంది.
- source_word: εἰς ἄνδρα τέλειον
  choice: పరిణతి చెందిన పురుషుని స్థాయికి
  rationale: τέλειοςకు ఈ ఎదుగుదల సందర్భంలో ‘పరిణతి చెందిన’ అని ఇవ్వడం సముచితం; ἀνήρలోని ఏకవచన పురుష రూపకాన్ని తొలగించకుండా, లక్ష్యస్థితిని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: εἰς μέτρον ἡλικίας
  choice: ఎదుగుదల కొలతకు
  rationale: μέτρονలోని కొలత రూపకాన్ని నిలుపుతూ, ἡλικίαకు ఈ శారీరక ఎదుగుదల రూపకంలో సహజమైన అర్థాన్ని ఇస్తుంది; ‘పరిణతి’ అనే ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: τοῦ πληρώματος τοῦ Χριστοῦ
  choice: మెస్సీయ సంపూర్ణతకు తగిన
  rationale: πλήρωμα యొక్క గంభీరమైన ‘సంపూర్ణత’ భావాన్ని నిలుపుతుంది; జనిటివ్ సంబంధాన్ని తెలుగులో సహజంగా తెలియజేయడానికి ‘తగిన’ వాడబడింది. Χριστόςను బిరుదు భావంతో ‘మెస్సీయ’గా ఇచ్చింది.
theological_decisions:
- issue: τῆς πίστεως యొక్క భావం
  choice: ఉమ్మడి విశ్వాసం ప్రధానంగా సూచించబడేలా ‘విశ్వాసంలో’
  alternative: విశ్వాసులు వ్యక్తిగతంగా ఉంచే నమ్మకం
  rationale: నిర్దిష్ట ఆర్టికల్ మరియు సంఘమంతటి ఐక్యత సందర్భం ఉమ్మడి విశ్వాసాన్ని బలపరుస్తాయి; అయితే తెలుగు ప్రధాన పాఠం రెండు భావాలనూ పూర్తిగా మూసివేయదు, పాదసూచిక సందిగ్ధతను వెల్లడిస్తుంది.
- issue: εἰς ἄνδρα τέλειον లోని సంఘసంబంధ రూపకం
  choice: పరిణతి చెందిన పురుషుని స్థాయికి
  alternative: పరిణత పురుషత్వానికి
  rationale: గ్రీకు ఏకవచన పురుష రూపకం సంఘమంతటి సమష్టి పరిణతిని సూచిస్తుంది. దాన్ని లింగతటస్థమైన సాధారణ పదంతో చెరపకుండా ప్రధాన పాఠంలో నిలిపింది.
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός దేవుని అభిషిక్తుని సూచించే క్రీస్తుశాస్త్ర బిరుదుగా పనిచేస్తుంది; అందువల్ల బిరుదు భావాన్ని ప్రత్యక్షంగా చూపే ‘మెస్సీయ’ ఎంచుకోబడింది.
- issue: ἡλικίας యొక్క భావం
  choice: ఎదుగుదల
  alternative: పరిణతి; ఎత్తు లేదా దేహస్థాయి
  rationale: సందర్భంలోని శరీర ఎదుగుదల రూపకాన్ని ‘ఎదుగుదల’ సహజంగా కొనసాగిస్తుంది; పదం ‘పరిణతి’ భావాన్నీ మోయగలదని పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకులో మూడుసార్లు వచ్చే εἰς లక్ష్యనిర్మాణాన్ని ‘ఐక్యతకు … స్థాయికి … కొలతకు’ అనే సమాంతర నిర్మాణంతో నిలిపింది. వాక్యం ముందరి వచనంపై ఆధారపడే ‘చేరేవరకు’ అనే అసంపూర్ణ ముగింపును మూలానికి అనుగుణంగా ఉంచింది.
