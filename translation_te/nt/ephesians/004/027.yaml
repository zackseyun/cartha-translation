translation:
  language: te
  text: మరియు అపవాదికి చోటు ఇవ్వకండి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చోటు’ అంటే ఇక్కడ అవకాశం లేదా వీలు. గ్రీకులో అక్షరార్థంగా, ‘మరియు అపవాదికి చోటు ఇవ్వకండి’ అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: అలాగే ... ఇవ్వకండి
  rationale: ఈ నిషేధం ముందున్న ఉపదేశాన్ని కొనసాగిస్తుంది. ‘అలాగే’ ఆ అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δίδοτε
  choice: ఇవ్వకండి
  rationale: δίδωμι యొక్క నిషేధాత్మక ఆజ్ఞారూప భావాన్ని గౌరవప్రదమైన బహువచన ఆజ్ఞగా నేరుగా వ్యక్తం చేస్తుంది.
- source_word: τόπον
  choice: చోటు
  rationale: మూలపదానికి అక్షరార్థంగా ‘చోటు’ అని అర్థం. తెలుగులో ‘చోటు ఇవ్వడం’ అనే నుడికారం కార్యానికి అవకాశం లేదా వీలు కల్పించడం అనే భావాన్ని కూడా సహజంగా అందిస్తుంది.
- source_word: τῷ διαβόλῳ
  choice: అపవాదికి
  rationale: διάβολος ఇక్కడ సాధారణంగా అపవాదు చేసే వ్యక్తిని కాక, వ్యక్తిగత దుష్ట ప్రత్యర్థియైన సాతానును సూచించే బిరుదు. ‘అపవాది’ మూలపదపు భావసంబంధాన్ని నిలుపుతూ తెలుగు క్రైస్తవ వాడుకలో ఆ వ్యక్తిగత సూచనను వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: διάβολος అనేది సాధారణ నామవాచకంగా ‘అపవాదు చేసేవాడు’ అని అర్థమా, లేక వ్యక్తిగత దుష్ట ప్రత్యర్థిని సూచిస్తుందా?
  choice: వ్యక్తిగత దుష్ట ప్రత్యర్థిని సూచించే ‘అపవాది’
  alternative: అపవాదు చేసేవాడు
  rationale: ఈ పౌలు ఉపదేశ సందర్భంలో సపద ఆ రూపం మానవ అపవాదిని కాక సాతానును సూచించడం అత్యంత సంభావ్యం. అయినా మూలంలోని బిరుదును విస్తరించి ‘సాతాను’గా మార్చకుండా ‘అపవాది’ అని ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన ఆజ్ఞారూపం వాడబడింది. ‘చోటు ఇవ్వడం’ అక్షరార్థాన్ని మరియు సందర్భానుసారమైన ‘అవకాశం కల్పించడం’ అనే నుడికార భావాన్ని రెండింటినీ నిలుపుతుంది.
