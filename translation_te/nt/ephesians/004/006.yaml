id: EPH.4.6
reference: Ephesians 4:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἷς θεὸς καὶ πατὴρ πάντων, ὁ ἐπὶ πάντων καὶ διὰ πάντων καὶ ἐν ⸀πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/006.yaml
  text: one God and Father of all[b][a], who is over all and through all and in all.
translation:
  language: te
  text: సమస్తానికి దేవుడూ తండ్రీ ఒక్కడే[a]; ఆయన సమస్తంపైనా, సమస్తం ద్వారానూ, సమస్తంలోనూ[b] ఉన్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అందరికీ’ / ‘అన్నిటికీ.’ ఈ వచనంలో పదేపదే వచ్చే ‘సమస్తం’ అనే భావానికి గ్రీకులో స్పష్టమైన నామవాచకం లేదు; అందువల్ల దాని పరిధి విశాలంగా ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అందరిలోనూ.’ కొన్ని ప్రాచీన ప్రతుల్లో ‘మీలో అందరిలోనూ’ అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: εἷς
  choice: ఒక్కడే
  rationale: చుట్టుపక్కల వచనాల్లోని ‘ఒకే’ అనే ఐక్యతా వరుసను నిలుపుతూ, వ్యక్తిని సూచించే దేవునితో సహజంగా సరిపోయే తెలుగు రూపం.
- source_word: θεὸς καὶ πατὴρ
  choice: దేవుడూ తండ్రీ
  rationale: θεός, πατήρ అనే రెండు దైవసంబంధ పదవులను విడదీయకుండా, సహజమైన తెలుగు సముచ్చయంతో అందిస్తుంది.
- source_word: πάντων
  choice: సమస్తానికి
  rationale: గ్రీకులో స్పష్టమైన నామవాచకం లేనందున ‘అందరికీ’ లేదా ‘అన్నిటికీ’ అని పరిధిని ముందే నిర్ణయించకుండా, వ్యక్తులనూ సమస్త సృష్టినీ సూచించగల విశాలతను ఉంచుతుంది.
- source_word: ὁ ἐπὶ πάντων
  choice: ఆయన సమస్తంపైనా
  rationale: ἐπί + షష్ఠీ విభక్తి తెలిపే ఆధిక్యత లేదా సార్వభౌమత్వాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: διὰ πάντων
  choice: సమస్తం ద్వారానూ
  rationale: διά + షష్ఠీ విభక్తి యొక్క సాధనం లేదా మాధ్యమ భావాన్ని, ‘పనిచేస్తున్నాడు’ వంటి వివరణాత్మక క్రియను చేర్చకుండా కాపాడుతుంది.
- source_word: ἐν πᾶσιν
  choice: సమస్తంలోనూ
  rationale: నామవాచకం లేని గ్రీకు పదబంధపు విశాలతను, మూడు సమాంతర పదబంధాల లయను నిలుపుతుంది.
theological_decisions:
- issue: πάντων / πᾶσιν పదాల పునరావృత పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘సమస్తం’ అనే విశాల పదాన్ని పునరావృతం చేయడం
  alternative: ‘అందరూ,’ ‘విశ్వాసులందరూ,’ లేదా ‘అన్నీ’ అని పరిధిని నిర్దిష్టం చేయడం
  rationale: తక్షణ సందర్భం సంఘ ఐక్యత గురించి ఉన్నప్పటికీ, గ్రీకు రూపాలకు స్పష్టమైన నామవాచకం లేదు. కాబట్టి పాఠ్యంలోని విశాలతను, భావపరమైన ఉద్రిక్తతను పరిష్కరించకుండా ఉంచాం.
- issue: ‘సమస్తం ద్వారానూ’లో దైవ కార్యం
  choice: మూలంలోని సంక్షిప్త పదబంధాన్నే ఉంచడం
  alternative: ‘సమస్తం ద్వారా పనిచేసేవాడు’ అని విస్తరించడం
  rationale: దైవ కార్యం భావంలో ఉండవచ్చుగాని, గ్రీకులో ‘పనిచేయు’ అనే క్రియ లేదు; అందువల్ల దానిని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘సమస్తం’ కొంత ఉద్ధృతమైన పదమైనప్పటికీ, వ్యక్తులు/వస్తువులు అనే గ్రీకు అస్పష్టతను తెలుగులో సాధ్యమైనంతవరకు నిలుపుతుంది; ‘పైనా—ద్వారానూ—లోనూ’ అనే సమాంతర నిర్మాణం మూలంలోని అలంకార క్రమాన్ని ప్రతిబింబిస్తుంది.
