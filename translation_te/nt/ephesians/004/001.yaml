id: EPH.4.1
reference: Ephesians 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς ἐγὼ ὁ δέσμιος ἐν κυρίῳ ἀξίως περιπατῆσαι τῆς κλήσεως ἧς ἐκλήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/001.yaml
  text: Therefore I[a], the prisoner in the Lord, urge you to walk worthily of the calling with which you were called[b],
translation:
  language: te
  text: కాబట్టి, ప్రభువులో ఖైదీగా ఉన్న నేను, మీరు పిలువబడిన పిలుపుకు తగిన విధంగా నడుచుకోవాలని మిమ్మల్ని కోరుతున్నాను.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రభువుకు చెందిన ఖైదీగా ఉన్న నేను”; లేదా “ప్రభువు కోసం ఖైదీగా ఉన్న నేను.”
    reason: alternative_reading
  - marker: b
    text: లేదా “మీరు పిలువబడిన పిలుపుకు తగినట్లుగా జీవించాలని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: బతిమాలుతున్నాను
  rationale: ఇక్కడ παρακαλέω అధికారిక ఆజ్ఞకన్నా బలమైన, వ్యక్తిగతమైన పాస్టరల్ విజ్ఞప్తిని తెలియజేస్తుంది. ‘బతిమాలుతున్నాను’ ఆ విజ్ఞప్తి బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: మునుపటి బోధన ఆధారంగా వచ్చే ఆచరణాత్మక నిర్ధారణను సూచించే తార్కిక సంబంధాన్ని నిలుపుతుంది.
- source_word: δέσμιος
  choice: ఖైదీనైన
  rationale: δέσμιος యొక్క సూటి అర్థం ‘ఖైదీ’; తెలుగు వాక్యంలో ἐγὼ ὁ δέσμιος అనే నిర్మాణాన్ని సహజంగా కలపడానికి విశేషణాత్మక రూపం వాడబడింది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: గ్రీకు విభక్తి ప్రయోగాన్ని ఉద్దేశం (‘ప్రభువు కోసం’) లేదా స్వామ్యం (‘ప్రభువు ఖైదీ’)గా పరిమితం చేయకుండా, పౌలు వాడే విస్తృతమైన సంబంధార్థక భాషను నిలుపుతుంది.
- source_word: ἀξίως
  choice: తగిన విధంగా
  rationale: పిలుపుకు అనుగుణమైన జీవన ప్రవర్తనను సూచిస్తుంది; ‘యోగ్యంగా’ కంటే సాధారణ ఆధునిక పాఠకులకు ఇది సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: περιπατῆσαι
  choice: నడుచుకోవాలని
  rationale: పౌలు ఉపయోగించిన ‘నడవడం’ అనే జీవనశైలి రూపకాన్ని తెలుగులో సహజమైన ‘నడుచుకోవడం’ ద్వారా నిలుపుతుంది.
- source_word: κλήσεως
  choice: పిలుపు
  rationale: దేవుని పిలుపును సూచించే κλῆσις‌కు స్పష్టమైన, స్థిరమైన తెలుగు సమానార్థకం.
- source_word: ἧς ἐκλήθητε
  choice: మీరు పిలువబడిన
  rationale: గ్రీకులోని పదపునరుక్తిని నిలుపుతూ, ‘పిలుపుకు’తో కలిసి తెలుగులో సహజంగా సంబంధాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ὁ δέσμιος ἐν κυρίῳ అనే పౌలు స్వీయవర్ణనలో ἐν యొక్క భావం
  choice: ప్రభువులో ఖైదీనైన నేను
  alternative: ప్రభువు ఖైదీనైన నేను; ప్రభువు కోసం ఖైదీనైన నేను
  rationale: ‘ప్రభువులో’ అనే అనువాదం గ్రీకు పదబంధపు ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది. అది స్వామ్యం లేదా కారణం/ఉద్దేశం అనే ఒక్క భావానికి వాక్యాన్ని పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ప్రభువులో’ అనే పౌలీయ ప్రయోగం మరియు ‘నడుచుకోవడం’ అనే జీవన రూపకం ప్రధాన పాఠ్యంలో నిలుపబడ్డాయి.
