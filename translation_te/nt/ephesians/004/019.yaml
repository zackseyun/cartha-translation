  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἵτινες ἀπηλγηκότες ἑαυτοὺς παρέδωκαν τῇ ἀσελγείᾳ εἰς ἐργασίαν ἀκαθαρσίας πάσης ἐν πλεονεξίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/019.yaml
  text: who[a], having become callous[c][b], gave themselves over to sensuality for the practice of every kind of impurity with greediness.
translation:
  language: te
  text: వారు మొద్దుబారి[a], అత్యాశతో[b] అన్నివిధాల అపవిత్రతను ఆచరించడానికి సిగ్గుమాలిన ప్రవర్తనకు[c] తమను తాము అప్పగించుకున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘స్పందనను పూర్తిగా కోల్పోయి’ లేదా ‘స్పందనలేనివారై.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దురాశతో’ లేదా ‘మరింత కావాలనే తీరని కోరికతో.’
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘విచ్చలవిడితనానికి’ లేదా ‘సిగ్గుమాలిన దురాచారానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: వారు
  rationale: ముందటి వచనంలో ప్రస్తావించిన అన్యజనులను తిరిగి సూచించే సంబంధార్థక సర్వనామం. తెలుగులో వాక్యప్రవాహానికి సహజంగా ‘వారు’ అని ఇచ్చాం.
- source_word: ἀπηλγηκότες
  choice: మొద్దుబారిన మనస్సాక్షి గలవారై
  rationale: పరిపూర్ణ కృదంతం నైతిక స్పందన కోల్పోయి కఠిన స్థితికి చేరడాన్ని సూచిస్తుంది. కేవలం భావోద్వేగరాహిత్యంగా అర్థం కాకుండా సందర్భంలోని నైతిక అస్పందనను ‘మనస్సాక్షి’తో స్పష్టం చేశాం.
- source_word: ἑαυτοὺς παρέδωκαν
  choice: తమను తాము అప్పగించుకున్నారు
  rationale: ఆ దురాచారానికి వారు స్వచ్ఛందంగా లోబడిన భావాన్ని ప్రతిబింబించే సహజమైన తెలుగు వ్యక్తీకరణ.
- source_word: τῇ ἀσελγείᾳ
  choice: సిగ్గులేని ప్రవర్తనకు
  rationale: ἀσέλγεια లైంగిక పాపానికే పరిమితం కాకుండా సిగ్గూ అదుపూ లేని ప్రవర్తనను సూచించగలదు; అందువల్ల దాని విస్తృతిని నిలిపాం.
- source_word: εἰς ἐργασίαν
  choice: ఆచరించడానికి
  rationale: ఇక్కడ ἐργασία పని లేదా వృత్తి కంటే నిరంతర ఆచరణను సూచిస్తుంది; ఉద్దేశం లేదా ఫలితాన్ని తెలుగులో సహజంగా తెలిపే రూపం.
- source_word: ἀκαθαρσίας πάσης
  choice: అన్నివిధాల అపవిత్రతను
  rationale: πάσης సూచించే సమగ్ర, విభాగాత్మక విస్తృతిని ‘అన్నివిధాల’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐν πλεονεξίᾳ
  choice: అత్యాశతో
  rationale: πλεονεξία మరింత కావాలనే తీరని, స్వార్థపూరిత ఆశను సూచిస్తుంది. ఇక్కడ అపవిత్రతను ఆచరించే విధానాన్ని తెలిపేలా ‘అత్యాశతో’ ఇచ్చాం.
theological_decisions:
- issue: ἀπηλγηκότες యొక్క నైతిక-మానసిక భావం
  choice: మొద్దుబారిన మనస్సాక్షి గలవారై
  alternative: స్పందన అంతా కోల్పోయి; భావశూన్యులై
  rationale: సందర్భం నైతిక పరాయీకరణను, అపవిత్రతకు స్వచ్ఛందంగా లోబడటాన్ని వివరిస్తోంది. అందువల్ల వైద్యపరమైన లేదా కేవలం భావోద్వేగపరమైన మొద్దుబారుదల కాకుండా నైతిక అస్పందనను వ్యక్తం చేశాం.
- issue: ἀσέλγεια యొక్క అర్థపరిధి
  choice: సిగ్గులేని ప్రవర్తన
  alternative: కాముకత్వం; లైంగిక దురాచారం; విచ్చలవిడితనం
  rationale: ఈ పదం తరచుగా లైంగిక సిగ్గుమాలినతను కలిగి ఉన్నా, అదుపులేని స్వైర ప్రవర్తనను మరింత విస్తృతంగా సూచించగలదు. దానిని లైంగిక పాపానికే పరిమితం చేయలేదు.
- issue: ἐν πλεονεξίᾳ యొక్క అనుసంధానం
  choice: అపవిత్రతను ఆచరించే విధానంగా ‘అత్యాశతో’
  alternative: అత్యాశలో; దురాశతో కూడిన అపవిత్రత
  rationale: ఈ పదబంధం క్రియాత్మక ఆచరణను విధానపూర్వకంగా విశేషిస్తుందని ప్రధాన పాఠ్యంలో చూపాం; అయినా గ్రీకు నిర్మాణం దానిని సమీపంలోని భావసముదాయంతో మరింత విస్తృతంగా అనుసంధానించడానికి అవకాశం ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గంభీరమైన శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని ఉద్దేశార్థక ప్రవాహాన్ని తెలుగులో సహజ క్రమానికి మార్చాం. ‘మనస్సాక్షి’ మూలపదంలో ప్రత్యక్ష నామవాచకం కాకపోయినా, సందర్భంలోని నైతిక అస్పందనను కేవలం శారీరక లేదా భావోద్వేగ మొద్దుబారుదలగా అపార్థం కాకుండా చెప్పేందుకు ఉపయోగించాం; ప్రత్యామ్నాయాన్ని పాదసూచనలో నిలిపాం.
