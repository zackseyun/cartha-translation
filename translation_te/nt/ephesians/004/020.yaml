translation:
  language: te
  text: అయితే మీరు మెస్సీయను ఈ విధంగా నేర్చుకోలేదు,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అయితే మీరు క్రీస్తును ఈ విధంగా నేర్చుకోలేదు.”
    reason: Χριστόςను ‘మెస్సీయ’ అనే బిరుదుగానో, సంప్రదాయంగా ‘క్రీస్తు’ అనో తెలుగులో ఇవ్వవచ్చు.
lexical_decisions:
- source_word: ὑμεῖς
  choice: మీరు
  rationale: ద్వితీయ పురుష బహువచన సర్వనామం స్పష్టంగా ఉండి, ముందున్నవారితో పాఠకుల వ్యత్యాసాన్ని నొక్కిచెబుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి అన్యజనుల జీవన విధానంతో పాఠకులను వ్యతిరేకంగా నిలిపే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὐχ οὕτως
  choice: ఈ విధంగా ... లేదు
  rationale: οὕτως సూచించే విధానార్థాన్ని నిలుపుతూ, ముందే వర్ణించిన జీవన విధానాన్ని సూచిస్తుంది.
- source_word: ἐμάθετε
  choice: నేర్చుకోలేదు
  rationale: μανθάνω యొక్క ప్రాథమిక అర్థమైన ‘నేర్చుకోవడం’ను నిలుపుతుంది; ‘బోధించబడలేదు’ అనే కర్మణి భావాన్ని ముందుగానే చేర్చదు.
- source_word: τὸν Χριστόν
  choice: మెస్సీయను
  rationale: Χριστός యొక్క అభిషిక్తుడు/మెస్సీయ అనే బిరుదు భావాన్ని నిలుపుతుంది. వ్యక్తిని ‘నేర్చుకోవడం’ అనే పౌలు ఉద్దేశపూర్వకంగా వాడిన అసాధారణ నిర్మాణాన్ని వివరణాత్మకంగా మార్చకుండా ఉంచుతుంది.
theological_decisions:
- issue: Χριστόνను బిరుదుగా లేదా పేరులాంటి రూపంగా అనువదించడం
  choice: మెస్సీయను
  alternative: క్రీస్తును
  rationale: ఈ సందర్భంలో సువార్తలో ప్రకటించబడిన వ్యక్తిని నేర్చుకోవడం గురించి పౌలు చెబుతున్నందున బిరుదు భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది. గ్రీకులో లేని ‘యేసు’ అనే పేరును చేర్చలేదు; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను ప్రత్యామ్నాయంగా పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి. ‘మెస్సీయను నేర్చుకోవడం’ అనే మూలంలోని అసాధారణమైన, వ్యక్తికేంద్రిత వ్యక్తీకరణను ఉద్దేశపూర్వకంగా నిలిపాం.
