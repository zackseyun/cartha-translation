source:
  edition: SBLGNT
  text: Ἑνὶ δὲ ἑκάστῳ ἡμῶν ἐδόθη ⸀ἡ χάρις κατὰ τὸ μέτρον τῆς δωρεᾶς τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/007.yaml
  text: But grace was given to each one of us according to the measure of Messiah’s gift[a].
translation:
  language: te
  text: అయితే మనలో ప్రతి ఒక్కరికీ మెస్సీయ యొక్క వరం యొక్క కొలత ప్రకారం కృప ఇవ్వబడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు యొక్క వరం.” గ్రీకు Χριστοῦ బిరుదును ఇక్కడ దాని అర్థాన్ని నిలుపుతూ “మెస్సీయ”గా అనువదించాం; “క్రీస్తు” అనేది సంప్రదాయ రూపం.
    reason: ప్రత్యామ్నాయ అనువాదం
lexical_decisions:
- source_word: Ἑνὶ ... ἑκάστῳ ἡμῶν
  choice: మనలో ప్రతి ఒక్కరికీ
  rationale: ἑνί మరియు ἑκάστῳ కలసి సమూహంలోని ఒక్కొక్కరికి విడివిడిగా అనుగ్రహించబడిందనే బలాన్ని ఇస్తాయి; ఈ తెలుగు రూపం ఆ పంపిణీ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వచనాల్లోని ఐక్యతనుంచి, ఇప్పుడు ఒక్కొక్కరికి భిన్నంగా ఇవ్వబడిన కృపవైపు ఉన్న స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: ἐδόθη
  choice: ఇవ్వబడింది
  rationale: గ్రీకు ఏఓరిస్ట్ కర్మణి రూపాన్ని సహజమైన తెలుగు భూతకాల కర్మణి రూపంతో వ్యక్తం చేస్తుంది.
- source_word: ἡ χάρις
  choice: కృప
  rationale: సందర్భంలో పరిచర్యకు అనుగ్రహించబడిన సామర్థ్యాన్ని సూచించినప్పటికీ, పౌలు వాడిన విస్తృతమైన దైవశాస్త్రీయ పదాన్ని సంకుచితం చేయకుండా నిలుపుతుంది.
- source_word: κατὰ τὸ μέτρον
  choice: కొలత ప్రకారం
  rationale: κατά ఇక్కడ ప్రమాణం లేదా అనుపాతాన్ని సూచిస్తుంది; ఈ రూపం ఆ భావాన్ని నేరుగా కాపాడుతుంది.
- source_word: τῆς δωρεᾶς
  choice: వరం
  rationale: δωρεά ఉచితంగా ఇచ్చిన బహుమానాన్ని సూచిస్తుంది; ఆధునిక బైబిలు తెలుగులో 'వరం' ఈ సందర్భానికి సహజంగా సరిపోతుంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ ఇచ్చిన
  rationale: Χριστός యొక్క బిరుదు భావాన్ని 'మెస్సీయ' నిలుపుతుంది. గ్రీకు సంబంధ విభక్తి వరం మెస్సీయకు చెందినదా లేదా ఆయన ఇచ్చినదా అనే పరిధిని అనుమతిస్తుంది; సందర్భానుసారంగా దాతృత్వ భావాన్ని ప్రధాన పాఠ్యంలో సహజంగా వ్యక్తం చేశాం.
theological_decisions:
- issue: సందర్భంలో 'కృప' యొక్క భావం
  choice: పరిచర్య కోసం ఒక్కొక్కరికి అనుగ్రహించబడిన కృప; ప్రధాన పాఠ్యంలో మాత్రం 'కృప' అనే విస్తృత పదమే
  alternative: సాధారణ దైవానుగ్రహం లేదా రక్షణ కృపకు మాత్రమే పరిమితమైన భావం
  rationale: 4:7–11 సందర్భం భిన్నమైన పరిచర్య వరాలవైపు సాగుతుంది. అయినా χάρις ను వివరణాత్మక పదబంధంగా మార్చకుండా ఉంచడం ద్వారా దాని దైవశాస్త్రీయ విస్తృతిని, ఉద్వేగాన్ని కాపాడాం.
- issue: τοῦ Χριστοῦ లోని సంబంధం
  choice: మెస్సీయ ఇచ్చిన వరం
  alternative: మెస్సీయకు చెందిన వరం
  rationale: ఈ సంబంధ విభక్తి మూలం/దాత లేదా స్వామ్య సంబంధాన్ని సూచించగలదు. సందర్భంలో మెస్సీయ వరాన్ని పంచే దాతగా కనిపిస్తున్నందున దాతృత్వ భావాన్ని ఎంచుకున్నాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి మూలంలోని సాధ్యమైన విస్తృతిని కాపాడాం.
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ బిరుదు భావం సజీవంగా ఉండటంతో Χριστός యొక్క అర్థాన్ని 'మెస్సీయ'గా వ్యక్తం చేశాం; తెలుగు సంప్రదాయ రూపమైన 'క్రీస్తు'ను పాదసూచికలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. 'ప్రతి ఒక్కరికీ' ద్వారా పంపిణీ బలం, 'కొలత ప్రకారం' ద్వారా మూలంలోని అనుపాత భావం నిలుపబడ్డాయి. పాదసూచిక సూచిక [a] ప్రధాన పాఠ్యంలో చేర్చబడింది.
