id: EPH.4.22
reference: Ephesians 4:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀποθέσθαι ὑμᾶς κατὰ τὴν προτέραν ἀναστροφὴν τὸν παλαιὸν ἄνθρωπον τὸν φθειρόμενον κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/022.yaml
  text: to put off[a], with respect to your former way of life, the old man, which is being corrupted according to deceitful desires[b],
translation:
  language: te
  text: మీ పూర్వ జీవన విధానానికి సంబంధించి, మోసపు కోరికల[b] ప్రకారం నాశనమవుతున్న పాత మనిషిని[a] తీసివేయాలని,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘పాత వ్యక్తిత్వాన్ని.’ అక్షరార్థంగా ‘పాత మనిషిని.’ గ్రీకులో ఇది మునుపటి మానవ జీవన విధానాన్ని సూచించే ప్రతినిధి ప్రయోగం.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా ‘మోసపు కోరికలు’; అంటే మోసంతో సంబంధం కలిగిన కోరికలు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθέσθαι
  choice: తీసివేయాలని
  rationale: దుస్తులను తీసివేసే రూపకాన్ని నిలుపుతూ, 24వ వచనంలోని ‘ధరించుకోవడం’ అనే వ్యతిరేక రూపకంతో సంబంధాన్ని కాపాడుతుంది. ‘-ాలని’ రూపం ఈ క్రియను ముందున్న బోధకు సంబంధించిన విషయంగా ఉంచుతుంది; దీనిని నేరుగా ఆజ్ఞగా మార్చదు.
- source_word: κατὰ τὴν προτέραν ἀναστροφὴν
  choice: మీ పూర్వ జీవన విధానానికి సంబంధించి
  rationale: ἀναστροφή ప్రవర్తన లేదా జీవించే విధానాన్ని సూచిస్తుంది. ఇక్కడ κατάను సంబంధం లేదా పరిధిని సూచించేదిగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: పాత మనిషిని
  rationale: గ్రీకు పదబంధంలోని మానవ ప్రతినిధి రూపాన్ని నిలుపుతుంది. ఇది వృద్ధుడిని సూచించకుండా, మునుపటి మానవ జీవన స్థితిని సూచిస్తుందని పాదసూచిక స్పష్టం చేస్తుంది.
- source_word: τὸν φθειρόμενον
  choice: చెడిపోతూ ఉన్న
  rationale: వర్తమాన కర్మణి కృదంతంలోని కొనసాగుతున్న నైతిక క్షయ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: κατὰ τὰς ἐπιθυμίας τῆς ἀπάτης
  choice: మోసపూరిత కోరికల ప్రకారం
  rationale: κατά సూచించే నియంత్రక ప్రభావం లేదా ప్రమాణాన్ని ‘ప్రకారం’ నిలుపుతుంది. τῆς ἀπάτηςను సహజమైన విశేషణ రూపంలో అందించినప్పటికీ, మూలంలోని సంబంధాన్ని పాదసూచికలో చూపిస్తుంది.
theological_decisions:
- issue: τὸν παλαιὸν ἄνθρωπον అనే పదబంధం
  choice: పాత మనిషి
  alternative: పాత స్వభావం / పాత వ్యక్తిత్వం
  rationale: ‘స్వభావం’ లేదా ‘వ్యక్తిత్వం’ అని అనువదిస్తే ἄνθρωπος యొక్క మానవ, ప్రతినిధి భావం కుదించబడుతుంది. ‘పాత మనిషి’ మూల రూపాన్ని నిలుపుతుంది; ఇది కేవలం పురుషులకు పరిమితమైనది కాదని పాదసూచిక వివరిస్తుంది.
- issue: ἀποθέσθαι అనే క్రియారూపం సందర్భంలో కలిగించే భావం
  choice: తీసివేయాలని
  alternative: తీసివేయండి / తీసివేసినవారై
  rationale: ఈ రూపం ముందటి వచనంలో చెప్పిన బోధ యొక్క విషయంగా అనంత క్రియ భావాన్ని నిలుపుతుంది. దానిని కేవలం ఆజ్ఞగా గానీ, ఇప్పటికే పూర్తయిన సంఘటనగా గానీ నిర్ణయించకుండా మూలంలోని భావ ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. వాక్యం ముందున్న సందర్భంపై ఆధారపడే నిర్మాణం కావడంతో చివర కామా ఉంచబడింది; మూలంలోని అనంత క్రియ సంబంధం అలాగే నిలిచింది.
