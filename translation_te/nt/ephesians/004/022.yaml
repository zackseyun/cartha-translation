revisions:
- from: మీ పూర్వ జీవన విధానానికి సంబంధించి, మోసపూరిత కోరికల[b] ప్రకారం చెడిపోతూ ఉన్న పాత మనిషిని[a] తీసివేయాలని,
  to: మీ పూర్వ జీవన విధానానికి సంబంధించి, మోసపు కోరికల[b] ప్రకారం నాశనమవుతున్న పాత మనిషిని[a] తీసివేయాలని,
  rationale: 'The revision makes two limited lexical adjustments: it renders the genitive construction with ‘మోసపు’ rather than an adjectival form that can alter the relation, and it uses ‘నాశనమవుతున్న’ for the ongoing ruin/corruption. The dependent-clause form, register, theological restraint, and footnote anchors are retained.'
  reviewer_model: gpt-5.6-terra
