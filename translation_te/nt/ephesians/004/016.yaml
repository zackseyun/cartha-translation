revisions:
- from: ఆయన నుంచే శరీరమంతా, ఆధారాన్ని అందించే ప్రతి కీలు[a] ద్వారా చక్కగా అమర్చబడి, కలిపి ఉంచబడుతుంది; ప్రతి భాగం తన కొలది పనిచేయడం వల్ల అది వృద్ధి చెంది[b], ప్రేమలో తనను తాను నిర్మించుకుంటుంది.
  to: ఆయన నుంచే శరీరమంతా, పోషణను అందించే ప్రతి సంధి[a] ద్వారా ఒకదానితో ఒకటి అమర్చబడి, కలిపి ఉంచబడి, ప్రతి ఒక్క భాగం తన కొలత మేరకు పనిచేసే విధానానికి అనుగుణంగా, ప్రేమలో తనను తాను నిర్మించుకోవడానికి శరీరపు వృద్ధిని కలిగిస్తుంది.[b]
  rationale: The revision restores the source text’s explicit statement that the body brings about its growth, rather than only saying that it grows. It removes the unsupported intensifier “చక్కగా,” uses “సంధి” for the bodily connective image, and preserves the measured activity of each part without adding an interpretive term such as “proper.” Footnote anchors remain valid and the lexical alternatives remain available.
