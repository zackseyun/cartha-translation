id: EPH.4.16
reference: Ephesians 4:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐξ οὗ πᾶν τὸ σῶμα συναρμολογούμενον καὶ συμβιβαζόμενον διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους τὴν αὔξησιν τοῦ σώματος ποιεῖται εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/016.yaml
  text: from whom the whole body[a], being joined together and held together through every supporting joint, according to the working in measure of each individual part[d][c][b], causes the growth of the body for building itself up in love.
translation:
  language: te
  text: ఆయన నుంచే శరీరమంతా, పోషణను అందించే ప్రతి సంధి[a] ద్వారా ఒకదానితో ఒకటి అమర్చబడి, కలిపి ఉంచబడి, ప్రతి ఒక్క భాగం తన కొలత మేరకు పనిచేసే విధానానికి అనుగుణంగా, ప్రేమలో తనను తాను నిర్మించుకోవడానికి శరీరపు వృద్ధిని కలిగిస్తుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘పోషణను అందించే ప్రతి సంధి’ అనే మాటను ‘సరఫరా చేసే ప్రతి సంధి,’ ‘ఆధారమిచ్చే ప్రతి బంధనం,’ లేదా ‘సరఫరా చేసే ప్రతి అనుసంధానం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: మూలభాషలో అక్షరార్థంగా, ‘శరీరం తన వృద్ధిని కలిగించుకుంటుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ οὗ
  choice: ఆయన నుంచే
  rationale: ముందటి వచనంలోని క్రీస్తే దీనికి పూర్వపదం. కాబట్టి వ్యక్తిని సూచించే భావాన్ని, ఆయన శరీరానికి మూలమనే దృష్టిని నిలుపుతుంది.
- source_word: πᾶν τὸ σῶμα
  choice: శరీరమంతా
  rationale: ఏకవచన సమష్టి భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: συναρμολογούμενον καὶ συμβιβαζόμενον
  choice: చక్కగా అమర్చబడి, కలిపి ఉంచబడుతుంది
  rationale: భాగాలు ఒక సమగ్ర శరీరంగా తగిన విధంగా అమర్చబడటం, పరస్పరం కలిసి నిలవటం అనే రెండు భావాలనూ, వాటి కర్మణి రూపాన్నీ కాపాడుతుంది.
- source_word: διὰ πάσης ἁφῆς τῆς ἐπιχορηγίας
  choice: ఆధారాన్ని అందించే ప్రతి కీలు ద్వారా
  rationale: ἁφήలోని శరీర సంబంధమైన ‘కీలు/సంధి’ రూపకాన్ని నిలుపుతూ, ἐπιχορηγίαలోని సరఫరా లేదా సహాయ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; గ్రీకు పదబంధంలోని విస్తృత అర్థావకాశాన్ని పాదసూచికలో చూపించింది.
- source_word: κατ’ ἐνέργειαν ἐν μέτρῳ ἑνὸς ἑκάστου μέρους
  choice: ప్రతి భాగం తన కొలది పనిచేయడం వల్ల
  rationale: ప్రతి భాగం తనకు సంబంధించిన పరిమాణం మేరకు క్రియాశీలంగా పనిచేస్తుందనే భావాన్ని, ‘తగిన’ వంటి అదనపు వ్యాఖ్యాన పదం చేర్చకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: τὴν αὔξησιν τοῦ σώματος ποιεῖται
  choice: అది వృద్ధి చెంది
  rationale: తెలుగులో సహజంగా శరీరమే ఎదుగుతుందనే భావాన్ని తెలుపుతుంది. గ్రీకులోని మరింత కారణార్థక నిర్మాణాన్ని పాదసూచికలో నిలిపింది.
- source_word: εἰς οἰκοδομὴν ἑαυτοῦ ἐν ἀγάπῃ
  choice: ప్రేమలో తనను తాను నిర్మించుకుంటుంది
  rationale: οἰκοδομήలోని నిర్మాణ రూపకాన్ని, ἑαυτοῦలోని ఆత్మనిర్దేశక భావాన్ని, ἐν ἀγάπῃలోని ‘ప్రేమలో’ అనే పరిధిని కాపాడుతుంది.
theological_decisions:
- issue: సంఘం అనే శరీరపు వృద్ధికి మూలం మరియు కార్యసాధకులు
  choice: శరీరం క్రీస్తు నుంచే ఉద్భవించి ఎదుగుతుంది; అదే సమయంలో ప్రతి భాగం తన కొలది పనిచేస్తుంది.
  alternative: వృద్ధిని పూర్తిగా భాగాల పనికే ఆపాదించడం, లేదా ‘దేని నుంచో’ అనే అవ్యక్త సూచనగా అనువదించడం.
  rationale: సందర్భం క్రీస్తును వ్యక్తిగత మూలంగా సూచిస్తుంది; వాక్యం ప్రతి భాగం చేసే కొలదైన పనిని కూడా వృద్ధికి సాధనంగా చూపిస్తుంది. అనువాదం ఈ రెండు అంశాలను కలిపి ఉంచుతుంది.
- issue: ἁφῆς τῆς ἐπιχορηγίαςలోని శరీర రూపకం
  choice: ‘ఆధారాన్ని అందించే ప్రతి కీలు’ అని శరీర రూపకాన్ని నిలపడం.
  alternative: ‘ప్రతి బంధనం,’ ‘సరఫరా చేసే ప్రతి సంబంధం,’ లేదా కేవలం ‘ప్రతి అనుసంధానం.’
  rationale: గ్రీకు పదబంధం కీలు, సంపర్క బిందువు, బంధనం లేదా సరఫరా చేసే అనుసంధానం వంటి భావాలకు అవకాశం ఇస్తుంది. ప్రధాన పాఠంలో స్పష్టమైన శరీర రూపకాన్ని ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలియజేయడం అనిశ్చితిని అతిగా పరిష్కరించకుండా ఉంటుంది.
- issue: శరీర వృద్ధిలో మధ్యమ వాచకపు భావం
  choice: సహజ తెలుగులో ‘అది వృద్ధి చెంది ... తనను తాను నిర్మించుకుంటుంది’ అని ఇవ్వడం.
  alternative: మరింత అక్షరార్థంగా ‘శరీరం తన వృద్ధిని కలిగించుకుంటుంది.’
  rationale: ποιεῖται కారణార్థక భావాన్ని కలిగించినా, తెలుగులో అక్షరార్థ రూపం అసహజంగా ఉంటుంది. ప్రధాన పాఠం శరీరపు క్రియాశీల వృద్ధిని స్పష్టంగా తెలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయినా గౌరవప్రదంగా ఉంచబడింది. ‘శరీరం,’ ‘కీలు,’ ‘నిర్మించుకుంటుంది’ అనే పదాలతో పౌలు ఉపయోగించిన శరీర-నిర్మాణ రూపకాలు నిలుపబడ్డాయి. వాక్య నిర్మాణం పొడవుగా ఉన్న గ్రీకు వాక్యాన్ని అర్థస్పష్టత కోసం అర్ధవిరామంతో విభజిస్తుంది.
