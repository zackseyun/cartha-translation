  text: εἴ γε αὐτὸν ἠκούσατε καὶ ἐν αὐτῷ ἐδιδάχθητε, καθώς ἐστιν ἀλήθεια ἐν τῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/021.yaml
  text: if indeed you heard him and were taught in him[a], just as truth is in Jesus[b],
translation:
  language: te
  text: మీరు నిజంగానే ఆయనను విని, ఆయనలో బోధ పొందినట్లయితే[a]—యేసులో సత్యం ఉన్న ప్రకారమే[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీరు ఆయన గురించి విన్నారు.’ గ్రీకు పాఠం మరింత అక్షరార్థంగా ‘మీరు ఆయనను విన్నారు’ అని చెబుతుంది. అపొస్తలుల సందేశంలో వారు నిజంగా క్రీస్తునే విన్నారనే భావం ఇందులో ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: ‘ఆయనలో,’ ‘యేసులో’ అనే మాటలు పరిధిని, ఐక్యతను లేదా సన్నిహిత సంబంధాన్ని సూచించవచ్చు. గ్రీకు ప్రయోగం ‘ఆయనచేత’ అనే సాధనార్థం కంటే విస్తృతమైన భావాన్ని తెరిచి ఉంచుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: నిజంగానే … అనుకుంటే
  rationale: షరతుతో పాటు వక్తకు ఉన్న సానుకూల నిరీక్షణను తెలుగులో సహజంగా తెలియజేస్తూ, దీనిని నేరుగా ‘ఎందుకంటే’ అనే కారణార్థంగా మార్చదు.
- source_word: αὐτὸν ἠκούσατε
  choice: ఆయనను విని
  rationale: గ్రీకులో αὐτόν నేర కర్మగా ఉంది; కాబట్టి ‘ఆయన గురించి విని’ అని సులభీకరించకుండా, ఉద్దేశపూర్వకంగా ఉన్న అసాధారణ ప్రయోగాన్ని నిలుపుతుంది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: ἐν అనే ఉపసర్గలోని పరిధి, ఐక్యత లేదా సన్నిహిత సంబంధ భావాలను తెరిచి ఉంచుతుంది; ‘ఆయనచేత’ అని కర్తృత్వానికి మాత్రమే పరిమితం చేయదు.
- source_word: ἐδιδάχθητε
  choice: బోధించబడ్డారు
  rationale: అఓరిస్ట్ కర్మణి రూపాన్ని నేరుగా నిలుపుతుంది.
- source_word: καθώς
  choice: ఉన్న ప్రకారమే
  rationale: వారు పొందిన బోధకూ యేసులో ఉన్న సత్యానికీ మధ్య గ్రీకు పాఠంలోని పోలికను తెలియజేస్తుంది.
- source_word: ἀλήθεια
  choice: సత్యం
  rationale: ఉపపదం లేని ἀλήθεια ను సహజంగా అనువదిస్తూ, దానిని ‘ఆ సత్యం’ అని అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: ἐν τῷ Ἰησοῦ
  choice: యేసులో
  rationale: వ్యక్తిగత నామమైన ‘యేసు’ను, అలాగే ἐν లోని విస్తృత సంబంధార్థాన్ని నిలుపుతుంది.
theological_decisions:
- issue: αὐτὸν ἠκούσατε ను ‘ఆయనను విన్నారు’గా లేదా ‘ఆయన గురించి విన్నారు’గా అనువదించాలా
  choice: ఆయనను విని
  alternative: ఆయన గురించి విని
  rationale: నేర కర్మ నిర్మాణానికి మొదటి అర్థమే దగ్గరగా ఉంది. అపొస్తలుల ప్రకటనలో క్రీస్తునే వినడం అనే సూచనను ఇది నిలుపుతుంది; అయితే ప్రత్యామ్నాయ వ్యావహారిక అర్థాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ἐν αὐτῷ మరియు ἐν τῷ Ἰησοῦ లోని ἐν ను ఎలా ప్రతిబింబించాలి
  choice: ఆయనలో / యేసులో
  alternative: ఆయనచేత / యేసుతో ఐక్యతలో
  rationale: ‘లో’ అనేది పరిధి, ఐక్యత, సన్నిహిత సంబంధం వంటి పౌలు ప్రయోగంలోని విస్తృత భావాలను నిలుపుతుంది; కేవలం సాధనార్థం లేదా ఒకే సిద్ధాంత వివరణగా కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం ముందున్న వాక్యాన్ని కొనసాగించే షరతు-ఆధారిత ఉపవాక్యం కావడంతో ముగింపులో దీర్ఘవిరామ చిహ్నాలు ఉపయోగించబడ్డాయి. ‘బోధించబడ్డారు’ కొంత అధికారికంగా ఉన్నా గ్రీకు కర్మణి రూపాన్ని స్పష్టంగా నిలుపుతుంది.
