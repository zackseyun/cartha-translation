id: EPH.4.11
reference: Ephesians 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἔδωκεν τοὺς μὲν ἀποστόλους, τοὺς δὲ προφήτας, τοὺς δὲ εὐαγγελιστάς, τοὺς δὲ ποιμένας καὶ διδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/011.yaml
  text: And he himself gave some as apostles[a], some as prophets, some as evangelists, and some as shepherds and teachers[b],
translation:
  language: te
  text: ఆయనే కొందరిని అపొస్తలులుగా, కొందరిని ప్రవక్తలుగా, కొందరిని సువార్తికులుగా, మరికొందరిని కాపరులుగా[a] మరియు బోధకులుగా[b] ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాస్టర్లుగా.” గ్రీకు పదానికి అక్షరార్థం “కాపరులు.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “కాపరులు” మరియు “బోధకులు” అనే పదాలకు ముందు కలిపి ఒకే నిర్దేశక పదం ఉంది. ఇది ఈ రెండు పాత్రల మధ్య ప్రత్యేకమైన దగ్గరి సంబంధాన్ని సూచించవచ్చు; అయినా అవి తప్పనిసరిగా ఒకే పదవి అని అర్థం చేసుకోవాల్సిన అవసరం లేదు.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: ఆయనే
  rationale: αὐτός ఇక్కడ నొక్కి చెప్పబడింది; ‘ఆయనే’ దాత స్వయంగా ఆయనే అనే ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది. καί ముందరి సందర్భంతో ఉన్న కొనసాగింపులో అంతర్భూతమై ఉంది; విడిగా ‘మరియు’ చేర్చడం తెలుగులో అసహజంగా ఉంటుంది.
- source_word: ἔδωκεν
  choice: ఇచ్చాడు
  rationale: δίδωμι క్రియ యొక్క సహజమైన అర్థాన్ని నిలుపుతుంది. ‘నియమించాడు’ అనడం మూలపాఠంలో ఉన్నదానికంటే అర్థాన్ని సంకుచితం చేస్తుంది.
- source_word: τοὺς μὲν ... τοὺς δὲ
  choice: కొందరిని ... కొందరిని ... మరికొందరిని
  rationale: μέν/δέతో పునరావృతమైన నిర్దేశక పదాలు వ్యక్తులను విభిన్న సేవా పాత్రల ప్రకారం పంచి చూపుతున్నాయి; ఈ తెలుగు నిర్మాణం ఆ పంపిణీ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀποστόλους
  choice: అపొస్తలులుగా
  rationale: కొత్త నిబంధనలో స్థిరపడిన, మూలపదానికి నేరుగా సరిపడే తెలుగు పదం; ‘-గా’ వారు ఏ పాత్రలో ఇవ్వబడ్డారో తెలియజేస్తుంది.
- source_word: προφήτας
  choice: ప్రవక్తలుగా
  rationale: προφήτηςకు ప్రామాణికమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: εὐαγγελιστάς
  choice: సువార్తికులుగా
  rationale: సువార్తను ప్రకటించే సేవకులను సూచించే సంక్షిప్తమైన, స్థిరపడిన తెలుగు పదం.
- source_word: ποιμένας
  choice: కాపరులుగా
  rationale: ποιμήνలోని కాపరి రూపకాన్ని నిలుపుతుంది; తరువాతి సంఘపదవిని నేరుగా పాఠంలోకి దిగుమతి చేయదు.
- source_word: καὶ διδασκάλους
  choice: బోధకులుగా
  rationale: διδάσκαλοςకు నేరుగా, సహజంగా సరిపడే అనువాదం. కాపరులతో ఉన్న వ్యాకరణ సంబంధాన్ని అనువాదంలో ఒకే పదవిగా నిర్ధారించకుండా ఉంచుతుంది.
theological_decisions:
- issue: ποιμέναςను రూపకార్థమైన ‘కాపరులు’గా అనువదించాలా, సంప్రదాయ సంఘపదవిగా అనువదించాలా
  choice: కాపరులు
  alternative: సంఘ కాపరులు (పాస్టర్లు)
  rationale: మూల గ్రీకు పదంలోని కాపరి రూపకాన్ని ప్రధాన పాఠంలో కాపాడుతుంది. సంఘపదవిని సూచించే సంప్రదాయ అర్థం సాధ్యమే కాబట్టి దానిని పాదటిప్పణిలో ఉంచింది.
- issue: ‘కాపరులు మరియు బోధకులు’ ఒకే సంయుక్త వర్గమా లేక దగ్గరి సంబంధమున్న రెండు పాత్రలా
  choice: రెండు నామాలను ఉంచి, సంబంధాన్ని తేల్చకుండా అనువదించడం
  alternative: కాపరి-బోధకులు అనే ఒకే సంయుక్త సేవావర్గం
  rationale: గ్రీకులో ఈ రెండు నామాలకు ముందు ఒకే నిర్దేశక పదం ఉండటం దగ్గరి సంబంధాన్ని సూచించవచ్చు; అయితే అవి తప్పనిసరిగా ఒకే సంఘపదవి అని వ్యాకరణం నిర్బంధించదు. అందువల్ల వివాదాన్ని ప్రధాన పాఠంలో పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. సేవా పాత్రల జాబితాలో సమాంతర నిర్మాణం నిలుపబడింది. ‘కాపరులు’ అనే బైబిలీయ రూపకం ప్రధాన పాఠంలో ఉంచబడగా, ఆధునిక సంఘపదవి పదం పాదటిప్పణిలో మాత్రమే ఇవ్వబడింది.
