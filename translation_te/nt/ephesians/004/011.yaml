revisions:
- from: ఆయనే కొందరిని అపొస్తలులుగా, కొందరిని ప్రవక్తలుగా, కొందరిని సువార్తికులుగా, మరికొందరిని కాపరులుగా[a], బోధకులుగా[b] ఇచ్చాడు.
  to: ఆయనే కొందరిని అపొస్తలులుగా, కొందరిని ప్రవక్తలుగా, కొందరిని సువార్తికులుగా, మరికొందరిని కాపరులుగా[a] మరియు బోధకులుగా[b] ఇచ్చాడు.
  rationale: The revision explicitly translates καί as ‘మరియు’ between ‘కాపరులు’ and ‘బోధకులు,’ preserving the source syntax and its close association without construing the terms as a single office. Footnote a is narrowed to the actual lexical/traditional alternative, avoiding an added ecclesial specification. Footnote b remains appropriately cautious about the disputed syntactical implication.
