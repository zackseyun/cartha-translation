- from: మరియు మీ మనస్సు యొక్క ఆత్మలో నూతనపరచబడాలి,[a]
  to: మరియు మీ మనస్సు స్వభావంలో నూతనపరచబడాలి,[a]
  rationale: The revision replaces an opaque literal genitive with the natural Telugu expression “మనస్సు స్వభావం,” which accurately conveys the likely anthropological sense of πνεύματι τοῦ νοὸς ὑμῶν. It retains passive renewal and preserves the alternate Spirit-related interpretation in a clear, non-dogmatic footnote.
