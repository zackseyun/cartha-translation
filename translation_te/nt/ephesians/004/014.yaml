id: EPH.4.14
reference: Ephesians 4:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα μηκέτι ὦμεν νήπιοι, κλυδωνιζόμενοι καὶ περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας ἐν τῇ κυβείᾳ τῶν ἀνθρώπων ἐν πανουργίᾳ πρὸς τὴν μεθοδείαν τῆς πλάνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/014.yaml
  text: so that we may no longer be children[a], tossed by waves and carried about by every wind of teaching, by human trickery, by craftiness in the scheming of error[c][b],
translation:
  language: te
  text: ఇకపై మనం చిన్నపిల్లలుగా ఉండకుండా, అలలచేత అటూ ఇటూ కొట్టబడుతూ, ప్రతి బోధన అనే గాలికి ఇటూ అటూ కొట్టుకుపోతూ, మనుషుల పాచికలలాంటి మోసం వల్ల, తప్పుదారి పట్టించే పన్నాగం కోసం చేసే కుయుక్తి వల్ల ఉండకూడదనే ఉద్దేశంతో—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα μηκέτι ὦμεν νήπιοι
  choice: ఇకమీదట మనం చిన్నపిల్లలుగా ఉండకూడదని
  rationale: ἵνα తెలిపే ఉద్దేశాన్ని ముందున్న వాక్యంతో అనుసంధానించే సహజ తెలుగు నిర్మాణంలో చూపిస్తుంది; μηκέτι యొక్క ‘ఇకపై కాదు’ భావాన్ని, νήπιοι యొక్క ఆత్మీయ అపరిపక్వత రూపకాన్ని నిలుపుతుంది.
- source_word: κλυδωνιζόμενοι
  choice: అలల చేత అటూ ఇటూ కొట్టబడుతూ
  rationale: అలల తాకిడికి నియంత్రణ లేకుండా ఊగిపోవడం అనే సముద్ర రూపకాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: περιφερόμενοι παντὶ ἀνέμῳ τῆς διδασκαλίας
  choice: ప్రతి బోధ అనే గాలికి ఇటూ అటూ మోసుకుపోబడుతూ
  rationale: περιφερόμενοι యొక్క కర్మణి భావాన్నీ, బోధను గాలితో పోల్చే రూపకాన్నీ సహజ తెలుగులో కాపాడుతుంది.
- source_word: ἐν τῇ κυβείᾳ τῶν ἀνθρώπων
  choice: మనుషుల మోసపు జూదంతో
  rationale: κυβεία యొక్క అక్షరార్థమైన పాచికల ఆట/జూదం చిత్రాన్ని, దానిలోని మోసం భావాన్ని రెండింటినీ నిలుపుతుంది.
- source_word: ἐν πανουργίᾳ
  choice: కుయుక్తితో
  rationale: నైతికంగా చెడ్డ తెలివి లేదా మోసపూరిత చాకచక్యం అనే ప్రతికూల భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: πρὸς τὴν μεθοδείαν τῆς πλάνης
  choice: తప్పుదారి పట్టించే పన్నాగానికి దారితీసే
  rationale: πρός యొక్క దిశ/లక్ష్య భావాన్ని ‘దారితీసే’ ద్వారా చూపిస్తూ, μεθοδεία యొక్క పద్ధతిగల పన్నాగాన్ని మరియు πλάνηలోని తప్పు–మోసం మధ్య భావవిస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: διδασκαλία అనువాదం
  choice: బోధ
  alternative: సిద్ధాంతం
  rationale: ఇక్కడ గ్రీకు పదం సాధారణంగా బోధ లేదా ఉపదేశాన్ని సూచిస్తుంది; ‘సిద్ధాంతం’ అనవసరంగా సాంకేతిక లేదా మతశాఖాపరమైన పరిమితిని కలిగించవచ్చు.
- issue: πλάνη అనువాదం
  choice: తప్పుదారి పట్టించే
  alternative: తప్పు / మోసం
  rationale: πλάνη తప్పిపోవడం, తప్పు, మోసం చేయడం అనే పరస్పర సంబంధిత భావాలను కలిగి ఉంది. క్రియాత్మక తెలుగు పదబంధం ఆ ఉద్దేశపూర్వక మోసాన్నీ దాని ఫలితమైన దారితప్పడాన్నీ సూచిస్తుంది; ఒక్క భావానికే పరిమితం చేయదు.
- issue: πρὸς τὴν μεθοδείαν సంబంధం
  choice: పన్నాగానికి దారితీసే కుయుక్తి
  alternative: పన్నాగంలో కుయుక్తి
  rationale: πρόςలోని దిశ లేదా లక్ష్య భావాన్ని పూర్తిగా చెరపకుండా ఉంచుతుంది. గ్రీకు వాక్యభాగం సంక్షిప్తంగా, కొంత అనిశ్చితంగా ఉన్నందున కుయుక్తి–పన్నాగం మధ్య సంబంధాన్ని అతిగా నిర్ధారించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ఈ పద్యం ముందున్న వాక్యంపై ఆధారపడే ఉద్దేశ వాక్యభాగం కావడంతో చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది. సముద్రం, గాలి, జూదం అనే మూల రూపకాలను సాధ్యమైనంత స్పష్టంగా నిలిపాం.
