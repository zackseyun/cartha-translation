source:
  edition: SBLGNT
  text: ὀργίζεσθε καὶ μὴ ἁμαρτάνετε· ὁ ἥλιος μὴ ἐπιδυέτω ⸀ἐπὶ παροργισμῷ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/026.yaml
  text: Be angry[a], and do not sin. Do not let the sun go down on your anger[c][b],
translation:
  language: te
  text: కోపపడండి[a], పాపం చేయకండి. మీ కోపం ఉండగానే సూర్యుడు అస్తమించనివ్వకండి[c][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీకు కోపం వచ్చినా, పాపం చేయకండి.’ గ్రీకులో ఇది రూపరీత్యా ఆజ్ఞ (‘కోపపడండి’); అయితే సందర్భంలో కొందరు దీనిని సడలింపు లేదా షరతు భావంతో అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: పౌలు బహుశా కీర్తన 4:4ను (గ్రీకు పాత నిబంధనలో 4:5) ప్రతిధ్వనింపజేస్తున్నాడు; అక్కడ కోపం పాపం చేయవద్దనే ఆజ్ఞతో ముడిపడి ఉంది.
    reason: cross_reference
  - marker: c
    text: లేదా, ‘మిమ్మల్ని రెచ్చగొట్టిన దాని కారణంగా’ లేదా ‘మీరు మనసులో చేదును ఉంచుకున్న స్థితిలో.’ గ్రీకు పదం కోపాన్ని, రెచ్చగొట్టడాన్ని, లేదా దానివల్ల కొనసాగుతున్న మనస్తాపాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργίζεσθε
  choice: కోపపడండి
  rationale: గ్రీకు వర్తమాన ఆజ్ఞార్థక రూపాన్ని ఆజ్ఞగానే నిలుపుతుంది; దాన్ని షరతుగా మార్చకుండా కీర్తన 4:4 (LXX 4:5) ప్రతిధ్వనిని కూడా కాపాడుతుంది.
- source_word: μὴ ἁμαρτάνετε
  choice: పాపం చేయకండి
  rationale: గ్రీకు నిషేధాత్మక ఆజ్ఞకు సహజమైన, నేరమైన తెలుగు రూపం. ముందు ఆజ్ఞతో ఉన్న ఉద్రిక్తతను ‘కానీ’ సహజంగా తెలియజేస్తుంది.
- source_word: ὁ ἥλιος
  choice: సూర్యుడు
  rationale: మూలపదానికి నేరమైన, సహజమైన అనువాదం.
- source_word: μὴ ἐπιδυέτω
  choice: అస్తమించనివ్వకండి
  rationale: మూడవ పురుష నిషేధాత్మక ఆజ్ఞను తెలుగులో సహజంగా వ్యక్తం చేస్తూ, ఆజ్ఞ బలాన్ని నిలుపుతుంది.
- source_word: ἐπὶ παροργισμῷ ὑμῶν
  choice: మీ కోపం మీద
  rationale: παροργισμός కోపం, రెచ్చగొట్టడం, లేదా మనసులో నిలిచిన చికాకును సూచించవచ్చు. సందర్భంలో ‘మీ కోపం’ స్పష్టమైనది, సహజమైనది; ὀργίζεσθεతో భావసంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ఆరంభ వాక్యభాగం కోపపడమనే ఆజ్ఞగా అనువదించాలా, లేక షరతుతో కూడిన అనుమతిగా అనువదించాలా
  choice: ఆజ్ఞార్థకంగా ‘కోపపడండి, కానీ పాపం చేయకండి’ అని అనువదించబడింది.
  alternative: ‘మీకు కోపం వచ్చినా, పాపం చేయకండి.’
  rationale: గ్రీకు రూపం ఆజ్ఞార్థకం. దానిని నిలుపుకోవడం మూలానికి అత్యంత సమీపం. తరువాతి పాపనిషేధం మరియు కాలపరిమితి కోపానికి అపరిమిత నైతిక ఆమోదాన్ని ఇవ్వవు; వచనంలోని నిజమైన ఉద్రిక్తతను అనువాదం అలాగే ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. భాష సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అదే సమయంలో గ్రీకు ఆజ్ఞార్థక బలం మరియు భావపరమైన ఉద్రిక్తత నిలిచేలా రూపొందించబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
