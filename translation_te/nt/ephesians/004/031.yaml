id: EPH.4.31
reference: Ephesians 4:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πᾶσα πικρία καὶ θυμὸς καὶ ὀργὴ καὶ κραυγὴ καὶ βλασφημία ἀρθήτω ἀφ’ ὑμῶν σὺν πάσῃ κακίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/031.yaml
  text: Let all bitterness and wrath and anger and clamor and slander be taken away from you[a], along with all malice.
translation:
  language: te
  text: చేదుతనం, ఆవేశం, కోపం, కేకలు, దూషణలు[a]—ఇవన్నీ ప్రతి విధమైన దుష్టభావంతో పాటు మీ నుండి తొలగించబడాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నిందాపూర్వకమైన మాటలు’; సాంప్రదాయంగా, ‘దేవదూషణలు.’ ఈ సందర్భంలో గ్రీకు పదం ఇతరులకు హాని కలిగించే మాటలను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα πικρία
  choice: చేదంతా
  rationale: అంతరంగంలో స్థిరపడిన చేదు మనోభావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, πᾶσα యొక్క సమగ్ర భావాన్ని ‘అంతా’ వ్యక్తం చేస్తుంది.
- source_word: θυμός
  choice: ఆవేశం
  rationale: ఉప్పొంగే, తీవ్రమైన కోపోద్రేకాన్ని సూచించి, తరువాతి ὀργή నుండి అర్థభేదాన్ని నిలుపుతుంది.
- source_word: ὀργή
  choice: కోపం
  rationale: కొనసాగే కోపభావానికి సాధారణమైన, స్పష్టమైన తెలుగు పదం; θυμόςతో ఉన్న భేదం సాధ్యమైనంతవరకు నిలుస్తుంది.
- source_word: κραυγή
  choice: కేకలు
  rationale: ఈ సందర్భంలో విరోధపూరితంగా బిగ్గరగా అరవడాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: βλασφημία
  choice: దూషణలు
  rationale: మానవ సంబంధాల సందర్భంలో ఇతరులను కించపరిచే లేదా హానిచేసే మాటలను విస్తృతంగా తెలియజేస్తుంది; దేవదూషణ అనే సంకుచిత భావాన్ని ప్రధాన పాఠ్యంలో బలవంతంగా మోపదు.
- source_word: ἀρθήτω ἀφ’ ὑμῶν
  choice: మీ నుండి తొలగించబడాలి
  rationale: అయిరిస్టు నిష్క్రియ ఆజ్ఞార్థక రూపంలోని తొలగింపు మరియు నిష్క్రియ భావాలను గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: σὺν πάσῃ κακίᾳ
  choice: సమస్త దురుద్దేశమూ
  rationale: κακίαను సాధారణ ‘చెడు’గా కాక, ఇతరులకు హాని చేయాలనే దుష్ట మనోభావంగా సందర్భానుగుణంగా తెలియజేస్తుంది; σύν యొక్క సహవర్తిత్వం జాబితా నిర్మాణంలో సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: βλασφημία యొక్క సందర్భార్థం
  choice: మనుషులపై దూషణలు
  alternative: దేవదూషణ; నిందాపూర్వకమైన మాటలు
  rationale: చుట్టూ ఉన్న పదాలు సమాజ సంబంధాలను పాడుచేసే వైఖరులు, మాటలను సూచిస్తున్నందున ‘దూషణలు’ సందర్భానికి అనుకూలం. అయినా గ్రీకు పదానికి దేవదూషణ అనే అర్థం కూడా ఉండగలదని పాదసూచికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. θυμός–ὀργή భేదాన్ని ‘ఆవేశం–కోపం’గా నిలిపి, వరుసలోని సమగ్రతను ‘అంతా/సమస్త’ రూపాలతో వ్యక్తం చేశాం.
