id: EPH.4.10
reference: Ephesians 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ καταβὰς αὐτός ἐστιν καὶ ὁ ἀναβὰς ὑπεράνω πάντων τῶν οὐρανῶν, ἵνα πληρώσῃ τὰ πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/010.yaml
  text: The one who descended is himself also the one who ascended far above all the heavens[b][a], so that he might fill all things.
translation:
  language: te
  text: దిగివచ్చినవాడే సమస్తాన్ని నింపడానికి అన్ని ఆకాశాలకంటే ఎంతో పైకి ఎక్కివెళ్లినవాడు కూడా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సమస్తాన్ని నెరవేర్చడానికి.’ ఇక్కడి గ్రీకు క్రియకు కొన్ని సందర్భాల్లో ‘నెరవేర్చు’ అనే అర్థం ఉండవచ్చు; అయితే ఈ సందర్భంలో ‘నింపు’ అనే అర్థం మరింత సహజంగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καταβὰς
  choice: దిగివచ్చినవాడే
  rationale: నామవాచకంగా వాడిన భూతకాల కృదంతాన్ని సహజమైన తెలుగు సంబంధార్థక రూపంలో ఇచ్చాం; ‘ఏ’ ప్రత్యయం αὐτός తెలిపే వ్యక్తి-ఏకత్వపు నొక్కిచెప్పడాన్ని కూడా సహజంగా మోస్తుంది.
- source_word: αὐτός ἐστιν καὶ
  choice: వాడే … వాడు కూడా
  rationale: దిగివచ్చినవాడూ ఎక్కివెళ్లినవాడూ ఒకే వ్యక్తి అనే గ్రీకు వాక్యంలోని ఉద్ఘాటనను తెలుగు నిర్మాణంలో స్పష్టంగా నిలిపాం.
- source_word: ὁ ἀναβὰς
  choice: ఎక్కివెళ్లినవాడు
  rationale: ὁ καταβὰς‌కు సమాంతరమైన నామవాచక కృదంతాన్ని సహజమైన ఆధునిక తెలుగు రూపంలో అనువదించాం.
- source_word: ὑπεράνω πάντων τῶν οὐρανῶν
  choice: ఆకాశాలన్నిటికంటే ఎంతో పైకి
  rationale: οὐρανῶν బహువచనాన్ని నిలిపి, ὑπεράνωలోని అత్యున్నత స్థానం లేదా మించిన భావాన్ని ‘ఎంతో పైకి’ సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἵνα
  choice: …డానికి
  rationale: ఇక్కడి ఉద్దేశార్థాన్ని ఆధునిక తెలుగులో సహజమైన ప్రయోజనార్థక క్రియారూపంతో తెలిపాం.
- source_word: πληρώσῃ
  choice: నింపడానికి
  rationale: తక్షణ సందర్భంలో πληρόωకు ‘నింపు’ ప్రధానార్థం సరిపోతుంది; ‘నెరవేర్చు’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: τὰ πάντα
  choice: సమస్తాన్ని
  rationale: గ్రీకు పదబంధపు విస్తృత, సమగ్ర పరిధిని ఏ ఒక్క వర్గానికీ పరిమితం చేయకుండా నిలుపుతుంది.
theological_decisions:
- issue: దిగివచ్చినవాడూ ఎక్కివెళ్లినవాడూ ఒకే వ్యక్తి కావడం
  choice: ‘దిగివచ్చినవాడే … ఎక్కివెళ్లినవాడు కూడా’ అని ఉద్ఘాటనను నిలిపాం.
  alternative: కేవలం దిగివచ్చి తరువాత ఎక్కివెళ్లాడని, వ్యక్తి-ఏకత్వాన్ని తక్కువగా నొక్కిచెప్పే రూపం.
  rationale: αὐτόςతో పాటు సమాంతరంగా పునరావృతమైన నామవాచక కృదంతాలు ఇద్దరూ ఒకే వ్యక్తి అని బలంగా సూచిస్తాయి; మూలంలో లేని అదనపు క్రీస్తుశాస్త్ర వివరణను చేర్చలేదు.
- issue: τὰ πάντα పరిధి
  choice: ‘సమస్తాన్ని’ అని విస్తృతంగానే ఉంచాం.
  alternative: ‘మనుషులందరినీ’ లేదా ‘విశ్వమంతటినీ’ అని పరిధిని ప్రత్యేకంగా నిర్ణయించడం.
  rationale: గ్రీకు పదబంధం ఉద్దేశపూర్వకంగా విస్తృతమైనది. దాని భావపరిధిని అనువాదంలో సంకుచితం చేయకుండా, వివరణాత్మకంగా విస్తరించకుండా ఉంచాం.
- issue: πληρώσῃ అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘నింపడానికి’.
  alternative: ‘నెరవేర్చడానికి’.
  rationale: సందర్భానికి ‘నింపు’ బాగా సరిపోతుంది; అయితే క్రియకు కొన్ని సందర్భాల్లో ‘నెరవేర్చు’ అనే అర్థం ఉండగలదనే నిజమైన పదార్థ ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘ఆకాశాలు’ అనే బహువచనం, వ్యక్తి-ఏకత్వపు ఉద్ఘాటన, ‘సమస్తం’ అనే విస్తృత పరిధి నిలుపబడ్డాయి. ప్రధాన పాఠ్యంలో ఉన్న [a] గుర్తు పాదసూచికకు సరిపోలుతుంది.
