source:
  edition: SBLGNT
  text: Τοῦτο οὖν λέγω καὶ μαρτύρομαι ἐν κυρίῳ, μηκέτι ὑμᾶς περιπατεῖν καθὼς καὶ ⸀τὰ ἔθνη περιπατεῖ ἐν ματαιότητι τοῦ νοὸς αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/017.yaml
  text: 'Therefore I say this and testify in the Lord: you must no longer walk as the Gentiles walk[a], in the futility of their minds,'
translation:
  language: te
  text: 'కాబట్టి నేను ఇది చెబుతున్నాను మరియు ప్రభువులో సాక్ష్యమిస్తున్నాను: అన్యజనులు[a] తమ మనస్సుల వ్యర్థతలో నడుచుతున్నట్లుగా మీరు ఇకపై నడుచుకోకూడదు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జాతులు’; కొందరు ఇక్కడ ἔθνη అనే పదాన్ని ‘అన్యమతస్థులు’ అని అనువదిస్తారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο οὖν
  choice: కాబట్టి నేను ఇది చెబుతూ
  rationale: οὖν ముందున్న బోధన నుంచి వచ్చే తార్కిక పరిణామాన్ని సూచిస్తుంది; ‘కాబట్టి’ ఆ సంబంధాన్ని నిలుపుతుంది. Τοῦτο ను సహజమైన తెలుగులో ‘ఇది’గా ఉంచాం.
- source_word: μαρτύρομαι
  choice: గంభీరంగా సాక్ష్యమిస్తున్నాను
  rationale: ఈ క్రియ వ్యక్తిగతమైన, గంభీరమైన ధృవీకరణను తెలియజేస్తుంది. ‘సాక్ష్యమిస్తున్నాను’ దాని సాక్ష్యార్థాన్ని నిలుపుతుంది; ‘గంభీరంగా’ సందర్భంలోని బలాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: మూలంలోని రూపాన్ని నిలుపుతూ, పౌలు మాట్లాడే సంబంధం లేదా అధికార పరిధిని అనవసరంగా ఒకే అర్థానికి పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: μηκέτι ὑμᾶς περιπατεῖν
  choice: మీరు ఇకపై నడుచుకోకూడదు
  rationale: μηκέτι గత జీవనరీతిని నిలిపివేయాలని సూచిస్తుంది. ఆధారిత infinitive లోని ఉపదేశాత్మక బలాన్ని సహజమైన తెలుగులో ‘కూడదు’ తెలియజేస్తుంది; ‘నడుచు’ అనే నైతిక రూపకాన్ని నిలిపాం.
- source_word: καθὼς καὶ τὰ ἔθνη
  choice: అన్యజనులు ... నడుచుకున్నట్లు
  rationale: Pauline సందర్భంలో ἔθνη సాధారణంగా యూదేతరులను సూచిస్తుంది. ‘అన్యజనులు’ ఆ జాతి-నిబంధన సంబంధిత వర్గాన్ని నిలుపుతుంది; ‘అన్యమతస్థులు’ అనే మరింత తీర్పుతో కూడిన భావాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: ἐν ματαιότητι
  choice: వ్యర్థతలో
  rationale: ματαιότης లోని శూన్యత, ఫలహీనత, ప్రయోజనరాహిత్య భావాలను ‘వ్యర్థత’ సంక్షిప్తంగా, గౌరవప్రదంగా అందిస్తుంది.
- source_word: τοῦ νοὸς αὐτῶν
  choice: తమ మనస్సుల
  rationale: νοῦς ను నేరుగా ‘మనస్సు’గా అనువదించడం, తరువాతి వచనంలోని διάνοια భావాన్ని ముందుగానే కలిపివేయకుండా కాపాడుతుంది. కర్తతో సహజ అన్వయం కోసం αὐτῶν ను ‘తమ’గా ఇచ్చాం.
theological_decisions:
- issue: ఎక్కువగా అన్యజనుల నేపథ్యం గల సంఘానికి చెప్పే నైతిక వ్యత్యాసంలో ἔθνη అనువాదం
  choice: అన్యజనులు
  alternative: జనాలు; అన్యమతస్థులు
  rationale: ‘అన్యజనులు’ పౌలు ఉపయోగించే యూదేతరుల వర్గాన్ని నిలుపుతుంది. ‘అన్యమతస్థులు’ మూల నామవాచకంలో స్పష్టంగా లేని మతపరమైన ప్రతికూల తీర్పును జోడించవచ్చు. ఇది ప్రతి యూదేతరుని గురించి సంపూర్ణ స్వభావ ప్రకటనగా కాక, పూర్వ జీవనరీతికి కొత్త ప్రభు-సంబంధ జీవనానికి మధ్య వ్యత్యాసంగా చదవబడాలి.
- issue: λέγω καὶ μαρτύρομαι తరువాత περιπατεῖν infinitive యొక్క ఉపదేశాత్మక బలం
  choice: మీరు ఇకపై నడుచుకోకూడదు
  alternative: మీరు ఇకపై నడుచుకోవద్దని
  rationale: తెలుగులో ‘కూడదు’ అపొస్తలీయ హెచ్చరికలోని నైతిక ఆవశ్యకతను సహజంగా తెలియజేస్తుంది; అదే సమయంలో మూలంలోని ‘నడుచుట’ రూపకాన్ని కాపాడుతుంది.
- issue: ἐν κυρίῳ యొక్క సంబంధం లేదా అధికార భావం
  choice: ప్రభువులో
  alternative: ప్రభువు ద్వారా; ప్రభువు సన్నిధిలో
  rationale: మూల పదబంధం పరిధి, ఐక్యత, అధికారం వంటి పరస్పరం సంబంధిత భావాలకు అవకాశం ఇస్తుంది. ‘ప్రభువులో’ ఆ ఉద్దేశపూర్వక విశాలతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని వాడాం. పౌలు పునరావృతం చేసే నైతిక ‘నడుచుట’ రూపకాన్ని ‘జీవించుట’గా సడలించకుండా నిలిపాం. ప్రధాన పాఠ్యంలో [a] గుర్తు సంబంధిత పదమైన ‘అన్యజనులు’ వెంట ఉంచాం.
