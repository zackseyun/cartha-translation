source:
  edition: SBLGNT
  text: καὶ μὴ λυπεῖτε τὸ πνεῦμα τὸ ἅγιον τοῦ θεοῦ, ἐν ᾧ ἐσφραγίσθητε εἰς ἡμέραν ἀπολυτρώσεως.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/030.yaml
  text: And do not grieve the Holy Spirit of God[a], in whom you were sealed for the day of redemption.
translation:
  language: te
  text: దేవుని పరిశుద్ధాత్మను దుఃఖపరచకండి; ఆయనలో మీరు విమోచన దినం కోసం ముద్రించబడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విమోచన దినం వరకు.” గ్రీకు పదబంధం అక్షరార్థంగా “విమోచన దినం కోసం” అని ఉంది; దానికి భవిష్యత్తు వైపు చూపే కాలపరమైన భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπεῖτε
  choice: దుఃఖపరచకండి
  rationale: μήతో కూడిన వర్తమాన ఆజ్ఞార్థక రూపం నిషేధాన్ని వ్యక్తం చేస్తుంది. ‘దుఃఖపరచకండి’ అనేది పరిశుద్ధాత్మతో వ్యక్తిగత సంబంధాన్ని సహజంగా నిలుపుతూ λυπέω యొక్క భావాన్ని అందిస్తుంది.
- source_word: πνεῦμα τὸ ἅγιον τοῦ θεοῦ
  choice: దేవుని పరిశుద్ధాత్మను
  rationale: గ్రీకులోని పూర్తి పదబంధాన్ని నిలుపుతూ, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజమైన ‘దేవుని పరిశుద్ధాత్మ’ను ఎంచుకున్నాం.
- source_word: ἐν ᾧ
  choice: ఆయనలోనే
  rationale: ἐν అనే ఉపసర్గకు ‘లో’ అనే భావాన్ని నిలుపుతూ, పరిశుద్ధాత్మను వ్యక్తిగా సూచించడానికి ‘ఆయన’ వాడాం. ‘నే’ వాక్యంలో ఆ సంబంధాన్ని స్పష్టంగా, సహజంగా కూర్చుతుంది; అయితే కార్యసాధక అర్థమైన ‘ఆయన ద్వారా’ను ప్రధాన పాఠ్యంలో రుద్దదు.
- source_word: ἐσφραγίσθητε
  choice: మీరు ముద్ర వేయబడ్డారు
  rationale: అన్యకర్తృక భూతకాల రూపాన్ని నిలుపుతూ, ధృవీకరణ, స్వామిత్వం లేదా భద్రతను సూచించగల ముద్ర రూపకాన్ని వివరణతో పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: εἰς ἡμέραν ἀπολυτρώσεως
  choice: విమోచన దినం కోసం
  rationale: εἰς యొక్క లక్ష్యోద్దేశ లేదా భవిష్యదభిముఖ భావాన్ని ‘కోసం’ సహజంగా వ్యక్తం చేస్తుంది. సందర్భంలో ἡμέραν నిర్దిష్టమైన భవిష్య విమోచన దినాన్ని సూచిస్తుంది.
theological_decisions:
- issue: పరిశుద్ధాత్మను సూచించే సంబంధవాచక పదం వ్యక్తిగతంగా ఉండాలా
  choice: ‘ఆయనలోనే’ అని వ్యక్తిగత సూచనతో అనువదించడం
  alternative: ‘దానిలో’ లేదా ‘దాని ద్వారా’
  rationale: గ్రీకు సంబంధవాచకం πνεῦμαతో వ్యాకరణపరంగా నపుంసక లింగంలో ఉన్నా, దుఃఖపరచబడగల పరిశుద్ధాత్మనే సూచిస్తోంది. తెలుగు భాషలో వ్యక్తిగత సూచన సహజంగా ఆ భావాన్ని నిలుపుతుంది.
- issue: ముద్ర వేయబడటం మరియు విమోచన దినం మధ్య సంబంధం
  choice: ‘విమోచన దినం కోసం’
  alternative: ‘విమోచన దినం వరకు’
  rationale: εἰς యొక్క లక్ష్య లేదా గమ్య భావాన్ని ప్రధాన పాఠ్యం నిలుపుతుంది. ‘వరకు’ అనే కాలపరమైన అర్థం సాధ్యమైనప్పటికీ, నిలకడ లేదా ఇతర సిద్ధాంతపరమైన నిర్ధారణను పాఠ్యంలోకి బలవంతంగా తీసుకురాకుండా దానిని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. వాక్య నిర్మాణం సహజంగా ఉండేలా స్వల్ప పునర్వ్యవస్థీకరణ చేసినప్పటికీ, గ్రీకు పదబంధంలోని వ్యక్తిగత, రూపకాత్మక, భవిష్యదభిముఖ అంశాలను నిలిపాం.
