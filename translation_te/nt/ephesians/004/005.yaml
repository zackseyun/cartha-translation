  text: εἷς κύριος, μία πίστις, ἓν βάπτισμα·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/005.yaml
  text: one Lord[a], one faith, one baptism;
translation:
  language: te
  text: ఒక్కడే ప్రభువు, ఒక్కటే విశ్వాసం[a], ఒక్కటే బాప్తిస్మం;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘విశ్వాసం’ (πίστις) అనే పదానికి సందర్భానుసారం ‘నమ్మకం’ లేదా ‘విశ్వసనీయత’ అనే అర్థాలు కూడా రావచ్చు; అయితే ఇక్కడ ఉమ్మడి ఐక్యతపై ఉన్న దృష్టికి ‘విశ్వాసం’ బాగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς / μία / ἓν
  choice: ఒక్కడే / ఒక్కటే
  rationale: మూడు రూపాలూ ‘ఒకటి/ఒక్కడు’ అనే సంఖ్యార్థాన్నే వ్యక్తం చేస్తాయి; తెలుగు లింగం, వాడుక ప్రకారం వ్యక్తిని సూచించే ప్రభువుతో ‘ఒక్కడే,’ విశ్వాసం మరియు బాప్తిస్మంతో ‘ఒక్కటే’ వాడి, మూలంలోని పునరుక్త ఐక్యతా బలాన్ని నిలిపాం.
- source_word: κύριος
  choice: ప్రభువు
  rationale: పౌలు సందర్భంలో ఇది కేవలం యజమాని అనే సాధారణ అర్థం కాక, క్రీస్తును సూచించే బిరుదుగా సహజంగా పనిచేస్తుంది; ‘ప్రభువు’ ఆధునిక ప్రామాణిక తెలుగు బైబిలు భాషలో స్పష్టమైన, గౌరవప్రదమైన రూపం.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఇక్కడ సంఘాన్ని ఏకం చేసే ఉమ్మడి విశ్వాసం లేదా నమ్మే స్పందన ప్రధాన భావంగా సరిపోతుంది. ‘నమ్మకం,’ ‘విశ్వసనీయత’ వంటి అర్థసాధ్యతలను పాదసూచికలో ఉంచాం.
- source_word: βάπτισμα
  choice: బాప్తిస్మం
  rationale: మూలంలోని నిర్దిష్ట ఆచారపదాన్ని పారాఫ్రేజ్ చేయకుండా, తెలుగు క్రైస్తవ వాడుకలో విస్తృతంగా అర్థమయ్యే ‘బాప్తిస్మం’గా ఉంచాం; విధానం లేదా ఫలితంపై ఏ ప్రత్యేక సిద్ధాంతాన్నీ చేర్చలేదు.
theological_decisions:
- issue: ‘ప్రభువు’ ఎవరిని సూచిస్తుంది
  choice: త్రిభాగ సందర్భంలో ‘ప్రభువు’ క్రీస్తును, అత్యంత సహజంగా యేసును, సూచించే బిరుదుగా ఉంచాం.
  alternative: దేవునికి సంబంధించిన మరింత సాధారణ సూచన.
  rationale: ఎఫెసీయులు 4:4–6లో ఒక ఆత్మ, ఒక ప్రభువు, అందరికీ ఒక దేవుడు మరియు తండ్రి అనే క్రమం ఉంది. అందువల్ల ఇది కుమారుని సూచించడం అత్యంత సహజం; అయితే అనువాదంలో వివరణాత్మక పేరును చేర్చకుండా మూలంలోని ‘ప్రభువు’నే నిలిపాం.
- issue: ‘ఒక్కటే బాప్తిస్మం’ యొక్క భావం
  choice: విధానం, కార్యసాధకత లేదా సాక్రమెంటు/ఆత్మీయ ప్రాధాన్యం ఏదో నిర్ధారించకుండా తటస్థంగా ‘ఒక్కటే బాప్తిస్మం’ అని అనువదించాం.
  alternative: ప్రత్యేకంగా సాక్రమెంటు భావం; లేదా ప్రధానంగా రూపకాలంకారమైన/ఆత్మీయ బాప్తిస్మ భావం.
  rationale: వచనం ఐక్యతను ప్రకటిస్తుంది గాని బాప్తిస్మంపై మతశాఖల మధ్య ఉన్న ప్రశ్నలను స్వయంగా పరిష్కరించదు. అందువల్ల మూలంలోని సిద్ధాంతపరమైన విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన వాక్యలయంతో మూలంలోని త్రిభాగ సమాంతర నిర్మాణాన్ని నిలిపాం. ‘ఒక్కడే/ఒక్కటే’లోని ‘-ఏ’ బలప్రత్యయం ప్రతి అంశం యొక్క ఏకత్వాన్ని సహజంగా నొక్కిచెబుతుంది.
