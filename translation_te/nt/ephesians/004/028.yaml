  rationale: గ్రహీతను సూచించే దత్తి పదబంధాన్ని ‘అవసరంలో ఉన్నవారికి పంచి ఇవ్వడానికి’గా సవరించాం. అలాగే భావాన్ని మార్చకుండా పునరుక్తిని తొలగించి, చేతిపనిలోని నిజాయితీగల శ్రమ మరియు ఉదారత కోసం వనరులు సంపాదించాలనే ఉద్దేశ్యాన్ని స్పష్టంగా ఉంచాం. పాదటిప్పణి τὸ ἀγαθόνకు తగిన ప్రత్యామ్నాయాన్ని కొనసాగిస్తుంది.
