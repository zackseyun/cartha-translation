id: EPH.4.28
reference: Ephesians 4:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ κλέπτων μηκέτι κλεπτέτω, μᾶλλον δὲ κοπιάτω ἐργαζόμενος ⸂ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν⸃, ἵνα ἔχῃ μεταδιδόναι τῷ χρείαν ἔχοντι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/028.yaml
  text: The one who steals must steal no longer[a], but rather must labor, doing good work with his own hands[b], so that he may have something to share with the one who has need.
translation:
  language: te
  text: దొంగతనం చేసేవాడు ఇక దొంగతనం చేయకూడదు. దానికి బదులుగా, అవసరంలో ఉన్నవారికి పంచి ఇవ్వడానికి తన దగ్గర ఏదైనా ఉండేలా, తన సొంత చేతులతో మంచిదైన పని చేస్తూ శ్రమించాలి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మంచిదాన్ని చేస్తూ’ లేదా ‘మంచిదానికోసం పనిచేస్తూ’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κλέπτων
  choice: దొంగతనం చేసేవాడు
  rationale: నామవాచకార్థంలో వాడిన వర్తమాన కృదంతం; వ్యక్తిని కేవలం ‘దొంగ’ అని ముద్ర వేయకుండా, దొంగతనం చేసే ప్రవర్తనగలవాడిగా సూచిస్తుంది.
- source_word: μηκέτι κλεπτέτω
  choice: ఇక దొంగతనం చేయకూడదు
  rationale: గతంలో కొనసాగిన అలవాటును నిలిపివేయాలనే కాలసూచనను, ఆజ్ఞార్థ బలాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μᾶλλον δὲ κοπιάτω
  choice: దానికి బదులుగా ... కష్టపడి పనిచేయాలి
  rationale: మునుపటి ప్రవర్తనకు బలమైన వ్యతిరేక ప్రత్యామ్నాయాన్ని చూపుతూ, κοπιάω లోని శ్రమతో కూడిన పని భావాన్ని నిలుపుతుంది.
- source_word: ἐργαζόμενος ταῖς ἰδίαις χερσὶν τὸ ἀγαθόν
  choice: తన సొంత చేతులతో మంచి పని చేస్తూ
  rationale: వ్యక్తిగతమైన నిజాయితీ శ్రమను, అలాగే τὸ ἀγαθόν లోని మంచి/ప్రయోజనకరమైన పని భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα ἔχῃ μεταδιδόναι
  choice: పంచుకోవడానికి తన దగ్గర ఏదైనా ఉండేలా
  rationale: ἵνα ఉద్దేశ్యాన్ని స్పష్టంగా తెలియజేస్తుంది; μεταδιδόναι తనకు ఉన్నదానిలోనుంచి ఇతరులకు పంచే భావాన్ని కలిగి ఉంది. ‘ఏదైనా’ అనేది తెలుగులో సహజత కోసం సందర్భానుగుణంగా సరఫరా చేయబడింది.
- source_word: τῷ χρείαν ἔχοντι
  choice: అవసరంలో ఉన్నవారితో
  rationale: అవసరం కలిగిన వ్యక్తిని సూచించే దత్తి కృదంత పదబంధాన్ని సహజమైన తెలుగులో అందిస్తుంది; ఏకవచన గ్రీకు రూపానికి తెలుగు గౌరవ/సామాన్య బహువచనం వాడబడింది.
theological_decisions:
- issue: శ్రమ యొక్క నైతిక ఉద్దేశ్యం
  choice: నిజాయితీతో కూడిన శ్రమ దొంగతనానికి ప్రత్యామ్నాయం మాత్రమే కాక, అవసరంలో ఉన్నవారితో పంచుకోవడానికి సాధనంగా చూపబడింది.
  alternative: ఈ వాక్యం ప్రధానంగా స్వయం సమృద్ధిని లేదా దొంగిలించినదానికి పరిహారం చెల్లించడాన్ని బోధిస్తుంది.
  rationale: ‘పంచుకోవడానికి ... ఉండేలా’ అనే స్పష్టమైన ఉద్దేశ్య ఉపవాక్యం శ్రమ లక్ష్యాన్ని స్వపోషణకు మించి దాతృత్వం వైపు నడిపిస్తుంది; పరిహారాన్ని వాక్యం నేరుగా పేర్కొనదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే ఆజ్ఞ యొక్క గంభీరతను నిలుపుతూ రూపొందించబడింది. వాక్య క్రమం తెలుగులో సహజంగా ఉండేందుకు ఉద్దేశ్య ఉపవాక్యాన్ని ప్రధాన ఆజ్ఞకు ముందు ఉంచాం. ‘చేతులతో’ అన్నది మూలంలోని స్పష్టమైన శారీరక శ్రమ చిత్రాన్ని నిలుపుతుంది.
