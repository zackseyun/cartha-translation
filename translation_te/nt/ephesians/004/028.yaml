revisions:
- from: దొంగతనం చేసేవాడు ఇక దొంగతనం చేయకూడదు. దానికి బదులుగా, అవసరంలో ఉన్నవారితో పంచుకోవడానికి తన దగ్గర ఏదైనా ఉండేలా, తన సొంత చేతులతో మంచి పని చేస్తూ కష్టపడి పనిచేయాలి.[a]
