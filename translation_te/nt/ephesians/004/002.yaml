  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μετὰ πάσης ταπεινοφροσύνης καὶ πραΰτητος, μετὰ μακροθυμίας, ἀνεχόμενοι ἀλλήλων ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/002.yaml
  text: with all humility and gentleness, with patience, bearing with one another in love,
translation:
  language: te
  text: సర్వవిధాలైన వినయంతోను సౌమ్యతతోను, సహనంతో, ప్రేమలో ఒకరినొకరు సహించుకుంటూ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ πάσης ταπεινοφροσύνης
  choice: పూర్ణ వినయంతో
  rationale: μετά + షష్ఠీ విభక్తి సహవాసం లేదా విధానాన్ని సూచిస్తుంది; πάσης వినయ లక్షణం సంపూర్ణంగా ఉండాలని బలపరుస్తుంది. ‘పూర్ణ వినయంతో’ ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని బలాన్ని నిలుపుతుంది.
- source_word: πραΰτητος
  choice: సౌమ్యతతో
  rationale: ఈ పదం బలహీనతను కాక, అదుపులో ఉన్న మృదుత్వాన్ని సూచిస్తుంది. ‘సౌమ్యత’ ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, స్పష్టంగా ఉంది.
- source_word: μετὰ μακροθυμίας
  choice: సహనంతో
  rationale: μακροθυμία ఇతరుల పట్ల ఓర్పుగా ఉండడం, త్వరగా కోపపడకపోవడం అనే భావాన్ని ఇస్తుంది. ‘సహనం’ సామాన్య పాఠకులకు సహజంగా అర్థమవుతుంది; ‘దీర్ఘశాంతం’ కంటే తక్కువ ప్రాచీనంగా ఉంటుంది.
- source_word: ἀνεχόμενοι
  choice: సహించుకుంటూ
  rationale: వర్తమాన మధ్యమ కృదంతం నిరంతరంగా పరస్పరం ఓర్చుకోవడాన్ని సూచిస్తుంది. ‘సహించుకుంటూ’ ఆ కొనసాగుతున్న, సంబంధాత్మక భావాన్ని నిలుపుతుంది.
- source_word: ἀλλήλων
  choice: ఒకరినొకరు
  rationale: పరస్పర సర్వనామానికి సహజమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: ἐν ἀγάπῃ
  choice: ప్రేమలో
  rationale: ἐν + చతుర్థీ విభక్తి ఇక్కడ పరస్పర సహనానికి పరిధి లేదా విధానాన్ని సూచించవచ్చు. ‘ప్రేమలో’ మూల నిర్మాణాన్ని, దాని స్వల్ప భావవిస్తృతిని రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: ἀγάπη పదానికి అనువాదం
  choice: ప్రేమ
  alternative: కారుణ్యం
  rationale: ‘ప్రేమ’ ἀγάπηకి ఆధునిక తెలుగులో నేరమైన, విస్తృతంగా అర్థమయ్యే పదం. ‘కారుణ్యం’ దాని అర్థాన్ని కేవలం దయ వైపు సంకుచితం చేయవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన శైలి. ఈ వాక్యభాగం ముందరి ఆజ్ఞపై ఆధారపడే కృదంత నిర్మాణం కావడంతో చివర కామా ఉంచబడింది.
