id: EPH.4.25
reference: Ephesians 4:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὸ ἀποθέμενοι τὸ ψεῦδος λαλεῖτε ἀλήθειαν ἕκαστος μετὰ τοῦ πλησίον αὐτοῦ, ὅτι ἐσμὲν ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/025.yaml
  text: Therefore[a], having put away falsehood, let each one speak truth with his neighbor, because we are members of one another.
translation:
  language: te
  text: కాబట్టి, అబద్ధాన్ని విడిచిపెట్టి[a], ప్రతి ఒక్కరూ తమ పొరుగువారితో సత్యం మాట్లాడాలి; ఎందుకంటే మనం ఒకరికొకరం అవయవాలం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆ అబద్ధాన్ని విడిచిపెట్టి.”
    reason: τὸ ψεῦδος లోని నిర్దిష్ట ఆర్టికల్‌ను మరింత రూపసమీపంగా ప్రతిబింబించే సాధ్యమైన ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: Διὸ
  choice: కాబట్టి
  rationale: ముందటి ఉపదేశం నుంచి వచ్చే నిర్ధారణను సూచించే సహజమైన ఆధునిక తెలుగు అనుసంధానం.
- source_word: ἀποθέμενοι
  choice: విడిచిపెట్టి
  rationale: ప్రధాన ఆజ్ఞకు ముందుగా ఉండవలసిన త్యజింపును చూపే భూతార్థక క్రియావిశేషణ రూపం; వస్త్రాన్ని తీసివేయడం వంటి మూల రూపకాన్నీ కొంతవరకు నిలుపుతుంది.
- source_word: τὸ ψεῦδος
  choice: అబద్ధాన్ని
  rationale: ఇక్కడ ఒక నిర్దిష్ట అబద్ధం కంటే అబద్ధపు ప్రవర్తన అనే విస్తృత నైతిక భావం సందర్భానికి సరిపోతుంది; ఆర్టికల్ వల్ల సాధ్యమైన ‘ఆ అబద్ధాన్ని’ పాదసూచికలో ఉంచబడింది.
- source_word: λαλεῖτε ἀλήθειαν
  choice: సత్యం మాట్లాడాలి
  rationale: వర్తమాన ఆజ్ఞ యొక్క నిరంతర నైతిక బాధ్యతను సహజమైన తెలుగు విధ్యర్థక రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἕκαστος
  choice: ప్రతి ఒక్కరూ
  rationale: సమూహంలోని ఒక్కొక్కరికి వర్తించే బాధ్యతను తెలుగులో సహజంగా, అందరినీ కలుపుకొనే విధంగా తెలియజేస్తుంది.
- source_word: μετὰ τοῦ πλησίον αὐτοῦ
  choice: తమ పొరుగువారితో
  rationale: μετά యొక్క సహవాసార్థాన్ని ‘తో’ నిలుపుతుంది; πλησίονకు నైతిక-సామాజిక అర్థంలో ‘పొరుగువారు’ సరైన సమానార్థకం. తెలుగు అన్వయానికి తగిన ప్రతిబింబ సర్వనామం ఉపయోగించబడింది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ఆజ్ఞకు కారణాన్ని స్పష్టంగా పరిచయం చేసే ఆధునిక తెలుగు causal conjunction.
- source_word: ἐσμὲν ἀλλήλων μέλη
  choice: మనం ఒకరికొకరం అవయవాలం
  rationale: సంఘం ఒక దేహమనే రూపకాన్ని ‘అవయవాలు’ ద్వారా నేరుగా నిలుపుతూ పరస్పర సంబంధాన్ని ‘ఒకరికొకరం’తో కాపాడుతుంది.
theological_decisions:
- issue: ἕκαστος ... αὐτοῦ లోని వ్యాకరణపరమైన పుంలింగ ఏకవచనం
  choice: ప్రతి ఒక్కరూ తమ పొరుగువారితో
  alternative: ప్రతి ఒక్క పురుషుడు తన పొరుగువానితో
  rationale: గ్రీకులోని పుంలింగ రూపం సంఘమంతటికీ వర్తించే సాధారణ ప్రతినిధి ప్రయోగం. తెలుగులో ‘ప్రతి ఒక్కరూ ... తమ’ ఆ సమగ్ర భావాన్ని సహజంగా తెలియజేస్తుంది; అనవసరంగా పురుషులకు మాత్రమే పరిమితం చేయదు.
- issue: τὸ ψεῦδος యొక్క పరిధి
  choice: అబద్ధాన్ని
  alternative: ఆ అబద్ధాన్ని
  rationale: సమీప నైతిక సందర్భంలో సాధారణమైన మోసపూరిత మాటలను విడిచిపెట్టడమే ప్రధాన భావం. అయితే ఆర్టికల్‌తో ఉన్న ఏకవచనం వల్ల ‘ఆ అబద్ధాన్ని’ అనే రూపసమీప అనువాదం సాధ్యమే; అందుకే దాన్ని పాదసూచికలో భద్రపరచాం.
- issue: ἀλλήλων μέλη లోని దేహ రూపకం
  choice: ఒకరికొకరం అవయవాలం
  alternative: ఒకరికొకరం చెందినవాళ్లం
  rationale: పరస్పర అనుబంధాన్ని మాత్రమే చెప్పకుండా, మూలంలోని ‘అవయవాలు’ అనే సంఘ-దేహ రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు స్పష్టంగా ఉంచబడింది. ‘అవయవాలం’ మూలంలోని దేహ రూపకాన్ని నిలుపుతుంది. పాదసూచిక గుర్తు సంబంధిత పదబంధం వెంట ప్రధాన పాఠ్యంలో ఉంచబడింది.
