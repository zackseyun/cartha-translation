source:
  edition: SBLGNT
  text: πᾶς λόγος σαπρὸς ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω, ἀλλὰ εἴ τις ἀγαθὸς πρὸς οἰκοδομὴν τῆς χρείας, ἵνα δῷ χάριν τοῖς ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/029.yaml
  text: Let no rotten word come out of your mouth[a], but only such as is good for building up according to the need[d][c][b], so that it may give grace to those who hear.
translation:
  language: te
  text: మీ నోటి నుండి కుళ్లిన మాట ఏదీ రానివ్వకండి[a]. దానికి బదులు, అవసరానికి తగిన విధంగా బలపరచడానికి ఉపయోగపడే మంచి మాట మాత్రమే పలకండి; అది వినేవారికి కృపను అందించేలా ఉండాలి[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘కుళ్లిన మాట’ అని గ్రీకు వాచ్యార్థం; సందర్భంలో ఇది చెడిపోయిన, హానికరమైన లేదా అనుచితమైన మాటను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘అవసరానికి అనుగుణంగా నిర్మించడానికి.’ ఇక్కడ ‘నిర్మించడం’ అనేది మనుషులను బలపరచడం అనే రూపకం.
    reason: metaphor_clarification
  - marker: c
    text: ‘కృపను అందించేలా’ అనే మాటకు ‘మేలు కలిగించేలా’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς λόγος σαπρὸς
  choice: కుళ్లిన మాట ఏదీ
  rationale: నిషేధ వాక్యంలో πᾶς యొక్క విభజనార్థాన్ని ‘ఏదీ’ తెలియజేస్తుంది. σαπρός లోని ‘కుళ్లిన’ అనే సజీవ రూపకాన్ని నిలుపుతూ, λόγος ను సందర్భానుసారంగా ‘మాట’గా ఇచ్చాం.
- source_word: ἐκ τοῦ στόματος ὑμῶν μὴ ἐκπορευέσθω
  choice: మీ నోటి నుండి ... రానివ్వకండి
  rationale: మాట నోటి నుండి వెలువడే గ్రీకు శరీరరూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; μήతో కూడిన ఆజ్ఞార్థక నిషేధాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀλλὰ εἴ τις ἀγαθὸς
  choice: దానికి బదులు ... ఉపయోగపడే మంచి మాటనే పలకండి
  rationale: గ్రీకులో విడిచిపెట్టబడిన క్రియను తెలుగులో సహజంగా పూరించి, చెడు మాటకు విరుద్ధంగా మంచి మాట మాత్రమే పలకాలనే భావాన్ని తెలియజేస్తుంది.
- source_word: πρὸς οἰκοδομὴν τῆς χρείας
  choice: అవసరానికి తగిన విధంగా వారిని బలపరచడానికి ఉపయోగపడే
  rationale: οἰκοδομή యొక్క రూపకార్థమైన వ్యక్తులను నిర్మించడం/బలపరచడం అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఇస్తుంది. τῆς χρείας లోని సంక్షిప్త సంబంధాన్ని ‘అవసరానికి తగిన విధంగా’గా ఉంచి సందర్భం కన్నా అవసరానికే ప్రాధాన్యం ఇచ్చాం.
- source_word: ἵνα δῷ χάριν τοῖς ἀκούουσιν
  choice: వినేవారికి కృప కలిగేలా
  rationale: χάρις లోని ‘కృప’ అనే పౌలు పదప్రయోగాన్ని నిలుపుతూ, తెలుగులో సహజంగా ఫలితం కలగడాన్ని సూచిస్తుంది; ‘వినేవారు’ వర్తమాన కృదంత భావాన్ని అందిస్తుంది.
theological_decisions:
- issue: నైతిక ఉపదేశ సందర్భంలో χάριν అనువాదం
  choice: కృప
  alternative: మేలు / ప్రయోజనం
  rationale: ఇక్కడ మాట వినేవారికి మేలు చేయడమే భావంలో ఉన్నప్పటికీ, ‘కృప’ అనే అనువాదం χάρις యొక్క సంబంధాత్మక, పౌలు రచనలకు ప్రత్యేకమైన ప్రతిధ్వనిని కాపాడుతుంది. దానిని కేవలం ప్రయోజనంగా పరిమితం చేయదు; అదే సమయంలో ప్రత్యేక సిద్ధాంతార్థాన్ని బలవంతంగా చేర్చదు.
- issue: οἰκοδομή రూపకాన్ని తెలుగులో వ్యక్తీకరించడం
  choice: వారిని బలపరచడానికి
  alternative: వారిని కట్టడానికి / క్షేమాభివృద్ధికి
  rationale: అక్షరార్థమైన ‘కట్టడం’ తెలుగులో వ్యక్తుల విషయంలో అసహజంగా లేదా అస్పష్టంగా ఉంటుంది. ‘బలపరచడం’ సమాజాన్ని నిర్మించే రూపక ఫలితాన్ని సహజంగా అందిస్తుంది; పాదసూచికలో నిర్మాణ రూపకాన్ని పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. ‘కుళ్లిన మాట’ మూలంలోని సజీవ రూపకాన్ని నిలుపుతుంది; ప్రధాన వాక్యంలో ‘బలపరచడం’ సహజ గ్రాహ్యతను ఇస్తూ, నిర్మాణ రూపకాన్ని పాదసూచికలో భద్రపరుస్తుంది. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
