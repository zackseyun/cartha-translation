source:
  edition: SBLGNT
  text: διὸ λέγει· Ἀναβὰς εἰς ὕψος ᾐχμαλώτευσεν αἰχμαλωσίαν, ⸀ἔδωκεν δόματα τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/004/008.yaml
  text: Therefore it says[a], “Having ascended on high[b], he led captivity captive and gave gifts to men.”
translation:
  language: te
  text: 'అందుకే ఇలా చెప్పబడింది: “ఆయన ఉన్నత స్థలానికి ఎక్కి, చెరను చెరపట్టాడు[a]; మనుషులకు[b] వరాలు ఇచ్చాడు.”


    [a] “చెరపట్టబడినవారిని చెరపట్టాడు” లేదా “చెరపట్టబడినవారి సమూహాన్ని పట్టుకొన్నాడు” అని కూడా అనువదించవచ్చు. గ్రీకులో ఒకే మూలానికి చెందిన పదాలతో ఏర్పడిన ఈ సజీవమైన ప్రయోగం కీర్తన 68:18ను ప్రతిధ్వనింపజేస్తుంది.


    [b] ఇక్కడ “మనుషులు” అంటే సాధారణంగా మానవులందరూ లేదా ప్రజలు అని అర్థం.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “చెరపట్టబడినవారిని చెరపట్టాడు” లేదా “చెరపట్టబడినవారి సమూహాన్ని పట్టుకొన్నాడు” అని కూడా అనువదించవచ్చు. గ్రీకులో ఒకే మూలానికి చెందిన పదాలతో ఏర్పడిన ఈ సజీవమైన ప్రయోగం కీర్తన 68:18ను ప్రతిధ్వనింపజేస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “మనుషులు” అంటే సాధారణంగా మానవులందరూ లేదా ప్రజలు అని అర్థం.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: అందుకే
  rationale: ముందటి వాక్యంలో ప్రతి ఒక్కరికీ అనుగ్రహం ఇవ్వబడిందనే భావానికి ఈ ఉల్లేఖనాన్ని తార్కికంగా అనుసంధానిస్తుంది.
- source_word: λέγει
  choice: ఇలా చెప్పబడుతోంది
  rationale: గ్రీకులో స్పష్టమైన కర్త లేదు. లేఖనాన్ని సూచించే ఉల్లేఖన సూత్రాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, కర్తను దేవుడు లేదా లేఖనం అని అనవసరంగా నిర్ధారించదు.
- source_word: Ἀναβὰς εἰς ὕψος
  choice: ఉన్నత స్థలానికి ఎక్కి
  rationale: ఎక్కడం మరియు ఉన్నత స్థలానికి చేరడం అనే భావాలను నిలుపుతూ, ‘పరలోకానికి’ అని వ్యాఖ్యానాత్మకంగా కుదించకుండా కీర్తనలోని ప్రతిధ్వనిని కాపాడుతుంది.
- source_word: ᾐχμαλώτευσεν αἰχμαλωσίαν
  choice: చెరను చెరపట్టాడు
  rationale: క్రియకు, కర్మకు ఒకే మూలానికి చెందిన పదాలను వాడిన గ్రీకు cognate expression యొక్క సజీవతను, ఉద్దేశపూర్వక అస్పష్టతను సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: ἔδωκεν δόματα
  choice: బహుమతులు ఇచ్చాడు
  rationale: ఇవ్వడం అనే సాధారణ క్రియను, ఇచ్చిన వరాలు లేదా కానుకలు అనే సందర్భోచిత భావాన్ని నేరుగా వ్యక్తం చేస్తుంది.
- source_word: τοῖς ἀνθρώποις
  choice: మనుషులకు
  rationale: ἄνθρωποι ఇక్కడ సాధారణంగా మానవులను సూచిస్తుంది. ‘మనుషులకు’ అనే తెలుగు పదం మూలపదానికి సమీపంగా ఉండి ఈ సమగ్ర భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: కీర్తన 68:18ను ప్రతిధ్వనింపజేసే చెర సంబంధిత సజాతి పదప్రయోగం
  choice: చెరను చెరపట్టాడు
  alternative: చెరపట్టబడినవారిని చెరపట్టాడు; చెరపట్టబడినవారి సమూహాన్ని పట్టుకొన్నాడు
  rationale: ప్రధాన పాఠ్యంలో మూలంలోని వాక్చాతుర్యాన్ని, వ్యాఖ్యానానికి తెరిచి ఉన్న చిత్రాన్ని నిలిపి, మరింత వివరణాత్మకమైన అర్థాలను పాదసూచికలో ఇస్తుంది.
- issue: τοῖς ἀνθρώποις యొక్క లింగం మరియు పరిధి
  choice: మనుషులకు
  alternative: ప్రజలకు; మానవులకు
  rationale: గ్రీకు బహువచనం ఈ సందర్భంలో పురుషులకు మాత్రమే పరిమితం కాకుండా సాధారణ మానవార్థాన్ని కలిగి ఉండగలదు. తెలుగు ‘మనుషులు’ ఆ సాధారణ పరిధిని సహజంగా కాపాడుతుంది.
- issue: λέγει లో వ్యక్తం కాని కర్త
  choice: ఇలా చెప్పబడుతోంది
  alternative: లేఖనం ఇలా చెబుతోంది; ఆయన ఇలా అంటున్నాడు
  rationale: కర్తను లేఖనం లేదా దేవుడు అని మూలపాఠం కంటే స్పష్టంగా నిర్ణయించకుండా ఉల్లేఖన సూత్రాన్ని అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. కీర్తన ఉల్లేఖనంలోని కవితాత్మక సాంద్రతను ‘చెరను చెరపట్టాడు’ ద్వారా ఉద్దేశపూర్వకంగా నిలిపాం; ప్రత్యామ్నాయ అర్థాలను పాదసూచికలో వివరించాం.
