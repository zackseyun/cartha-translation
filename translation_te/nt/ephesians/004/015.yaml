    text: లేదా ‘సత్యనిష్ఠగా ఉంటూ’ లేదా ‘సత్యాన్ని ఆచరిస్తూ’; గ్రీకు క్రియ సత్యమైన మాటలతో పాటు సత్యమైన ప్రవర్తనను కూడా సూచించగలదు.
