lexical_decisions:
- source_word: ἀληθεύοντες
  choice: సత్యం పలుకుతూ
  rationale: ఈ క్రియ సత్యం మాట్లాడడాన్నే కాక సత్యంగా ప్రవర్తించడాన్నీ సూచించగలదు. ముందున్న అబద్ధ బోధ, మోసం అనే సందర్భంలో ‘సత్యం పలుకుతూ’ సహజమైన ప్రధాన అనువాదం; విస్తృత భావాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: δὲ
  choice: కాని
  rationale: మునుపటి అస్థిరత, మోసానికి విరుద్ధమైన స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: ἐν ἀγάπῃ
  choice: ప్రేమతో
  rationale: ప్రేమను సత్యం పలికే విధానంగా సహజ తెలుగులో వ్యక్తపరుస్తుంది; ‘ప్రేమలో’ అనే పరిధి భావం కూడా సాధ్యమే.
- source_word: αὐξήσωμεν
  choice: మనం ఎదుగుదాం
  rationale: మొదటి పురుష బహువచన exhortative subjunctive యొక్క ప్రోత్సాహక భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: εἰς αὐτὸν
  choice: ఆయనలోకి
  rationale: εἰς యొక్క దిశాత్మక బలాన్ని, మెస్సీయ వైపు మరియు ఆయనతో ఏకత్వంలోకి ఎదిగే రూపకాన్ని కాపాడుతుంది.
- source_word: τὰ πάντα
  choice: అన్ని విషయాల్లో
  rationale: అక్షరార్థంలోని ‘అన్నిటిని’ అనే రూపం తెలుగులో అసహజంగా ఉండవచ్చు; ఎదుగుదల ప్రతి విషయంలోనూ జరగాలనే సమగ్ర భావాన్ని ఇస్తుంది, అదే సమయంలో ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరుస్తుంది.
- source_word: κεφαλή
  choice: శిరస్సు
  rationale: పౌలు ఉపయోగించిన శరీర రూపకాన్ని కాపాడుతూ, ‘మూలం’ లేదా ‘అధికారి’ వంటి వివాదాస్పద వ్యాఖ్యానాన్ని పాఠ్యంలో చేర్చదు.
- source_word: Χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ ‘శిరస్సు’ తరువాత వివరణాత్మకంగా నిలిచి బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించాం.
theological_decisions:
- issue: ἀληθεύοντες పదపు భావ పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘సత్యం పలుకుతూ’
  alternative: ‘సత్యంగా ఉంటూ’ లేదా ‘సత్యాన్ని ఆచరిస్తూ’
  rationale: తక్షణ సందర్భం అబద్ధ బోధన, మోసం గురించి మాట్లాడుతున్నందున వాక్కుకు సంబంధించిన భావం ప్రధానంగా సరిపోతుంది; అయితే గ్రీకు క్రియలోని విస్తృత నైతిక భావాన్ని పాదటిప్పణి ద్వారా భద్రపరచాం.
- issue: κεφαλή యొక్క వ్యాఖ్యానాత్మక బలం
  choice: ‘శిరస్సు’ అనే రూపకాన్నే ఉంచడం
  alternative: ‘మూలం’ లేదా ‘అధికారి’
  rationale: గ్రీకు పాఠ్యం ఇచ్చిన రూపకాన్ని అనువాదం కాపాడుతుంది; దాని వివాదాస్పద వేదాంతార్థాల్లో దేనినీ పాఠ్యంలో నిర్ణయించదు.
- issue: Χριστός పేరు వలెనా, బిరుదు వలెనా
  choice: ‘మెస్సీయ’ అనే బిరుదు
  alternative: ‘క్రీస్తు’
  rationale: ఇక్కడ ὅς ἐστιν ἡ κεφαλή తరువాత Χριστός వివరణాత్మకంగా వచ్చి బిరుదు భావాన్ని స్పష్టంగా మోస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన సామూహిక ప్రోత్సాహక శైలి. ‘శిరస్సు’ ద్వారా శరీర రూపకం నిలిపి ఉంచబడింది. ‘ఆయనలోకి—అంటే మెస్సీయలోకి—’ అనే నిర్మాణం గ్రీకు εἰς αὐτόν ... Χριστός లోని దిశాత్మకతను, apposition‌ను స్పష్టంగా వ్యక్తపరుస్తుంది.
