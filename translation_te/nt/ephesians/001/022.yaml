id: EPH.1.22
reference: Ephesians 1:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πάντα ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ, καὶ αὐτὸν ἔδωκεν κεφαλὴν ὑπὲρ πάντα τῇ ἐκκλησίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/022.yaml
  text: And he subjected all things under his feet[a], and gave him as head over all things to the church[b],
translation:
  language: te
  text: దేవుడు సమస్తాన్ని క్రీస్తు పాదాల కింద[a] అధీనపరచి, అన్నిటిమీద శిరస్సుగా ఆయనను సంఘానికి[b] ఇచ్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది కీర్తన 8:6ను ప్రతిధ్వనిస్తుంది; సమస్తం పాలకుని పాదాల కింద ఉంచబడిందనే లేఖన రూపకం.
    reason: cross_reference
  - marker: b
    text: లేదా, ‘సంఘం కోసం’; τῇ ἐκκλησίᾳ అనే చతుర్థీ రూపం స్వీకర్తను మాత్రమే కాక ప్రయోజనం పొందేవారిని కూడా సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: సమస్తాన్ని / సమస్తం
  rationale: నపుంసక బహువచన రూపం వ్యక్తులను మాత్రమే కాక సృష్టిలోని సమస్తాన్నీ సూచిస్తుంది; తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా మొదట కర్మరూపం, తరువాత సంబంధార్థక రూపం వాడబడ్డాయి.
- source_word: ὑπέταξεν
  choice: లోబరచి
  rationale: ὑποτάσσω దేనినైనా అధీన స్థితిలో ఉంచడాన్ని సూచిస్తుంది. ‘లోబరచి’ ఆ క్రియాశీల భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὑπὸ τοὺς πόδας αὐτοῦ
  choice: క్రీస్తు పాదాల కింద
  rationale: అధికారం, ఆధిపత్యాన్ని తెలిపే పాదాల కింద ఉంచే రూపకాన్ని యథాతథంగా కాపాడుతుంది. సందర్భంలో αὐτοῦ క్రీస్తును సూచిస్తున్నందున తెలుగులో సర్వనామ గందరగోళం రాకుండా పేరు స్పష్టం చేయబడింది.
- source_word: αὐτὸν ἔδωκεν
  choice: ఆయనను ... ఇచ్చాడు
  rationale: δίδωμι యొక్క ప్రాథమిక ‘ఇవ్వు’ భావాన్ని నిలుపుతూ, ‘నియమించాడు’ వంటి వివరణాత్మక పదంతో అర్థాన్ని ముందుగానే పరిమితం చేయలేదు.
- source_word: κεφαλὴν
  choice: శిరస్సుగా
  rationale: క్రీస్తు అధిక్యతను తెలిపే ‘శిరస్సు’ రూపకాన్ని భద్రపరుస్తుంది; కేవలం ‘అధిపతి’ అని మార్చి రూపకాన్ని తొలగించదు.
- source_word: ὑπὲρ πάντα
  choice: సమస్తం మీద
  rationale: ఇక్కడ ὑπέρ సమస్తంపై ఉన్న ఉన్నతాధికారాన్ని సూచిస్తుంది. ‘సమస్తం మీద’ ఆ విస్తృతిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῇ ἐκκλησίᾳ
  choice: సంఘానికి
  rationale: ἐκκλησίαకు పౌలు పత్రికల సందర్భంలో స్థిరమైన తెలుగు పదం ‘సంఘం’. చతుర్థీ విభక్తిని ‘సంఘానికి’గా అనువదించడం స్వీకర్త భావాన్ని నేరుగా నిలుపుతుంది; ప్రయోజనార్థక భావం పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: క్రీస్తు శిరస్సుగా ఉండడం సమస్తంతోను సంఘంతోను కలిగిన సంబంధం
  choice: సమస్తం మీద శిరస్సుగా ఉన్న క్రీస్తును దేవుడు సంఘానికి ఇచ్చాడు.
  alternative: దేవుడు సంఘం మేలు కోసం క్రీస్తును సమస్తం మీద శిరస్సుగా ఇచ్చాడు.
  rationale: వాక్యనిర్మాణం κεφαλὴνను ὑπὲρ πάνταతో కలిపి క్రీస్తు సార్వత్రిక ఆధిపత్యాన్ని చూపుతుంది; τῇ ἐκκλησίᾳ స్వీకర్తను లేదా ప్రయోజనం పొందేవారిని సూచించగలదు. ప్రధాన పాఠంలో స్వీకర్త భావాన్ని ఉంచి, ప్రయోజనార్థక అవకాశాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని ‘పాదాల కింద’ మరియు ‘శిరస్సు’ రూపకాలు నిలుపబడ్డాయి. సందర్భంలో క్రియకు కర్త దేవుడు, సర్వనామాలకు సూచ్యం క్రీస్తు కావడం తెలుగులో అస్పష్టంగా మారకుండా పేర్లు స్పష్టం చేయబడ్డాయి.
