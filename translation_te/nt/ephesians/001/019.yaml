  yaml_path: translation/nt/ephesians/001/019.yaml
  text: and what is the surpassing greatness of his power toward us who believe[a], according to the working of the might of his strength
translation:
  language: te
  text: విశ్వసిస్తున్న మన పట్ల ఆయన శక్తి యొక్క అతిశయమైన గొప్పతనం ఏమిటో[a]—ఆయన బలం యొక్క ప్రభావశీల కార్యానికి అనుగుణంగా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “విశ్వసిస్తున్న మనలో.” మూల గ్రీకులో “మన పట్ల” అని ఉంది; కొన్ని అనువాదాలు దేవుని శక్తి విశ్వాసులలో పనిచేస్తుందనే భావాన్ని మరింత వ్యాఖ్యానాత్మకంగా వ్యక్తం చేస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερβάλλον
  choice: అపారమైన
  rationale: హద్దులను మించే గొప్పతనాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘కొలవలేని’ అని మరీ నిర్దిష్టం చేయదు.
- source_word: μέγεθος
  choice: గొప్పతనం
  rationale: అమూర్త నామవాచక భావాన్ని సాధారణ పాఠకులకు సహజంగా అందిస్తుంది.
- source_word: δύναμις
  choice: శక్తి
  rationale: దేవుని సామర్థ్యవంతమైన శక్తికి సాధారణమైన పదం; తరువాతి సమీపార్థక పదాల నుండి భేదాన్ని ఉంచుతుంది.
- source_word: εἰς ἡμᾶς
  choice: మన పట్ల
  rationale: εἰς యొక్క దిశ లేదా అన్వయ భావాన్ని కాపాడుతుంది; శక్తి కేవలం మనలోనే పనిచేస్తుందని ముందే నిర్ణయించదు.
- source_word: τοὺς πιστεύοντας
  choice: విశ్వసించే మన
  rationale: వర్తమాన కృదంతంలోని క్రియాత్మక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: κατά
  choice: అనుగుణంగా
  rationale: ప్రమాణం లేదా అనురూపతను సూచించే κατά భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: ἐνέργεια
  choice: కార్యసాధకంగా పనిచేసే విధానం
  rationale: ఫలితాన్ని కలిగించే క్రియాశీల కార్యాన్ని తెలియజేస్తుంది; ఆధునిక ‘ఎనర్జీ’ భావాన్ని దిగుమతి చేయదు.
- source_word: κράτος
  choice: ప్రభావం
  rationale: ప్రదర్శితమైన లేదా అమలయ్యే బలాన్ని సూచిస్తూ ἰσχύς నుండి కొంత భేదాన్ని ఉంచుతుంది.
- source_word: ἰσχύς
  choice: బలం
  rationale: అంతర్గత శక్తి లేదా సామర్థ్య భావానికి సహజమైన తెలుగు పదం; పదసమూహంలోని అలంకారాత్మక సంచయాన్ని నిలుపుతుంది.
- source_word: καὶ τί
  choice: ఏమిటో
  rationale: మునుపటి వాక్యంలోని ‘మీరు తెలుసుకునేలా’ అనే నిర్మాణాన్ని అనుసరించే పరోక్ష ప్రశ్నగా తెలుగులో సహజంగా సరిపోతుంది.
theological_decisions:
- issue: δύναμις / ἐνέργεια / κράτος / ἰσχύς అనే శక్తి-పదాల సమూహం
  choice: ‘శక్తి ... కార్యసాధకంగా పనిచేసే విధానం ... బలప్రభావం’ అని సంబంధితమైనప్పటికీ వేర్వేరు భావాలతో నిలుపడం
  alternative: అన్నిటినీ ‘మహాశక్తి’ వంటి ఒకే సంక్షిప్త భావంగా మార్చడం
  rationale: పౌలు వరుసగా సమీపార్థక పదాలను పేర్చి దేవుని శక్తి పరిమాణాన్నీ కార్యసామర్థ్యాన్నీ నొక్కిచెబుతున్నాడు; వాటిని పూర్తిగా కలిపివేయకుండా తెలుగు సహజత్వంతో సంచయాన్ని కాపాడాలి.
- issue: εἰς ἡμᾶςలో దేవుని శక్తి దిశ
  choice: ‘మన పట్ల’
  alternative: ‘విశ్వసించే మనలో’ లేదా ‘మన కోసం’
  rationale: మూలంలో ἐν కాక εἰς ఉంది. ‘మన పట్ల’ దిశాత్మక భావాన్ని నిలుపుతూ, అంతర్గత కార్యమా బాహ్య అనుగ్రహమా అన్న విషయాన్ని అనవసరంగా తేల్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం 18వ వచనంలో మొదలైన ప్రార్థనా వాక్యాన్ని కొనసాగిస్తుందని ‘ఏమిటో’ అనే రూపం సూచిస్తుంది. ప్రధాన పాఠంలోని [a] గుర్తు పాదసూచికతో సరిపోలింది.
