source:
  edition: SBLGNT
  text: ἣν ⸀ἐνήργηκεν ἐν τῷ Χριστῷ ἐγείρας αὐτὸν ⸀ἐκ νεκρῶν, καὶ ⸀καθίσας ἐν δεξιᾷ αὐτοῦ ἐν τοῖς ἐπουρανίοις
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/020.yaml
  text: which he worked in the Messiah when he raised him from the dead and seated him at his right hand in the heavenly places[b][a],
translation:
  language: te
  text: 'ఆ శక్తిని ఆయన మెస్సీయలో[a] ప్రయోగించాడు: ఆయనను మృతులలోనుండి లేపి, పరలోక ప్రాంతాల్లో[b] తన కుడివైపున కూర్చోబెట్టాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తులో.”
    reason: Χριστός అనే బిరుదుకు తెలుగు సంప్రదాయ లిప్యంతరీకరణను ప్రత్యామ్నాయంగా నమోదు చేయడం.
  - marker: b
    text: లేదా, “పరలోక స్థలాల్లో.”
    reason: ἐν τοῖς ἐπουρανίοις పదబంధంలోని మరింత ప్రత్యక్షమైన స్థానార్థక అనువాదాన్ని నిలుపడం.
lexical_decisions:
- source_word: ἣν
  choice: ఆ శక్తిని
  rationale: స్త్రీలింగ సంబంధ సర్వనామం ముందు వచనంలోని ‘శక్తి’ని సూచిస్తుంది. తెలుగు వాక్యం స్వాభావికంగా ఉండేందుకు సూచిత నామవాచకాన్ని స్పష్టంగా పునరుక్తి చేశాం.
- source_word: ἐνήργηκεν
  choice: కార్యరూపంలో చూపించాడు
  rationale: దేవుని శక్తి ప్రభావవంతంగా పనిచేసిందనే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం ‘చేశాడు’ కంటే మూలంలోని కార్యశీలతను స్పష్టంగా ఉంచుతుంది.
- source_word: ἐν τῷ Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ అభిషిక్తుడనే బిరుదు భావాన్ని నిలుపుతుంది. ἐν అనే విభక్తి సంబంధాన్ని ‘లో’తో కాపాడాం.
- source_word: ἐγείρας αὐτὸν ἐκ νεκρῶν
  choice: ఆయనను మృతులలోనుండి లేపి
  rationale: పునరుత్థానానికి వాడే గ్రీకు ప్రయోగాన్ని నేరుగా, సహజంగా అందిస్తుంది; బహువచన νεκρῶν భావాన్ని ‘మృతులలోనుండి’ నిలుపుతుంది.
- source_word: καθίσας ἐν δεξιᾷ αὐτοῦ
  choice: తన కుడివైపున కూర్చోబెట్టాడు
  rationale: కూర్చునేలా చేసిన చర్యను, గౌరవం మరియు అధికార స్థానాన్ని సూచించే సాంప్రదాయ స్థానప్రయోగాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: పరలోక ప్రాంతాల్లో
  rationale: నామవాచకంలా వాడిన బహువచన విశేషణం సూచించే పరలోక పరిధిని స్పష్టంగా, ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Χριστῷ అనే పదం బిరుదా, స్థిరనామమా?
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: ఈ సందర్భంలో అభిషిక్త రాజును సూచించే బిరుదు భావం సజీవంగా ఉంది. అయితే తెలుగు క్రైస్తవ వాడుకలో ‘క్రీస్తు’ స్థిరమైన ప్రత్యామ్నాయం కాబట్టి పాదసూచికలో ఉంచాం.
- issue: ἐν τοῖς ἐπουρανίοις సూచించే పరిధి
  choice: పరలోక ప్రాంతాల్లో
  alternative: పరలోక స్థలాల్లో
  rationale: ఈ పదబంధం పరలోక పరిధి లేదా లోకాన్ని సూచిస్తుంది; ‘ప్రాంతాలు’ ఆ విస్తృత భావాన్ని సహజంగా తెలియజేస్తుంది. మరింత ప్రత్యక్షమైన స్థానార్థక అనువాదాన్ని పాదసూచికలో నిలిపాం.
- issue: అసంపూర్ణ సంబంధ వాక్యాన్ని తెలుగులో వ్యక్తం చేయడం
  choice: ఆ శక్తిని
  alternative: దానిని
  rationale: ἣν ముందు వచనంలోని శక్తిని సూచిస్తుంది. ‘ఆ శక్తిని’ అనడం సంబంధాన్ని స్పష్టం చేస్తుంది; కొత్త భావాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గంభీరతను కాపాడే శైలి. గ్రీకు కృదంతాలను ‘లేపి … కూర్చోబెట్టాడు’ అనే సహజ తెలుగు చర్యల క్రమంగా ఇచ్చాం. ‘తన’ అనే ఆత్మార్థక సర్వనామం కుడివైపు దేవునిదేనని సందిగ్ధత లేకుండా చేస్తుంది.
