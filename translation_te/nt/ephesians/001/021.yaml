translation:
  language: te
  text: ప్రతి పాలనకంటే, అధికారంకంటే, శక్తికంటే, ఆధిపత్యంకంటే, పేర్కొనబడే ప్రతి పేరుకంటే ఎంతో ఉన్నతంగా—ఈ యుగంలో మాత్రమే కాక రాబోయే యుగంలో కూడా.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రతి ప్రధానత్వంకంటే, అధికారంకంటే, శక్తికంటే, ప్రభుత్వాధికారంకంటే.’ ఈ గ్రీకు పదాలు ఆధ్యాత్మిక లేదా విశ్వసంబంధ శక్తులతో సహా అధికారపు స్థాయులను లేదా రంగాలను సూచించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘ఇవ్వబడే ప్రతి బిరుదుకంటే.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘ఈ యుగంలో మాత్రమే కాక రాబోయే దానిలో కూడా.’ రెండవ చోట ‘యుగం’ అనే పదం గ్రీకులో అంతర్గతంగా గ్రహించబడుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεράνω
  choice: ఎంతో ఉన్నతంగా
  rationale: కేవలం స్థానం కంటే మిన్నగా ఉన్న శ్రేష్ఠతను, హెచ్చింపును సూచించే ఈ పదం యొక్క బలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πάσης ἀρχῆς
  choice: ప్రతి పాలనకూ
  rationale: ఇక్కడ ἀρχή పాలించే అధికారం లేదా అధికార వ్యవస్థను సూచిస్తుంది. వ్యక్తిగత పాలకుడని పరిమితం చేయకుండా దాని వర్గార్థాన్ని నిలుపుతుంది.
- source_word: ἐξουσίας
  choice: అధికారానికీ
  rationale: అధికారం చెలాయించే హక్కు లేదా పరిధి అనే భావాన్ని ఇస్తూ, δύναμις నుండి భేదాన్ని నిలుపుతుంది.
- source_word: δυνάμεως
  choice: శక్తికీ
  rationale: బలం లేదా సామర్థ్యం అనే సాధారణ అర్థాన్ని సహజంగా తెలియజేస్తుంది; ‘అధికారం’తో కలిసిపోకుండా ఉంటుంది.
- source_word: κυριότητος
  choice: ఆధిపత్యానికీ
  rationale: ప్రభుత్వం లేదా ఏలుబడి అనే వర్గాన్ని సూచిస్తుంది; ‘ప్రభుత్వం’ అనే పదానికి ఆధునిక రాజకీయ అర్థం బలంగా ఉండటాన్ని నివారిస్తుంది.
- source_word: παντὸς ὀνόματος ὀνομαζομένου
  choice: పేరు పెట్టబడే ప్రతి పేరుకూ
  rationale: మూలంలోని ‘పేరు/పేరు పెట్టడం’ అనే ఉద్దేశపూర్వక పునరుక్తిని నిలుపుతూ, ఏ హోదా లేదా గుర్తింపునైనా ఆవరించే విస్తృతిని పరిమితం చేయదు.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: మాత్రమే కాక ... కూడా
  rationale: గ్రీకు సహసంబంధ నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో పునరుత్పత్తి చేస్తుంది.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: ఈ యుగంలో
  rationale: αἰών యొక్క కాలసంబంధ భావాన్ని నిలుపుతూ, దానిని ‘లోకం’గా మార్చకుండా రాబోయే యుగంతో ఉన్న వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐν τῷ μέλλοντι
  choice: రాబోయే యుగంలో
  rationale: గ్రీకులో ముందున్న αἰών అంతర్గతంగా గ్రహించబడుతుంది; తెలుగులో అర్థం సహజంగా ఉండేందుకు ‘యుగం’ను స్పష్టంగా పునరుక్తి చేసింది.
theological_decisions:
- issue: ἀρχή, ἐξουσία, δύναμις, κυριότης అనే జాబితాలోని అధికారాల స్వభావం
  choice: మానవ, ఆత్మసంబంధ లేదా విశ్వసంబంధ శక్తులని ప్రత్యేకంగా నిర్ధారించకుండా పాలన, అధికారం, శక్తి, ఆధిపత్యం అనే విస్తృత వర్గాలుగా అనువదించడం.
  alternative: వాటిని దేవదూతల స్థాయిలుగా లేదా విశ్వసంబంధ ఆత్మశక్తులుగా స్పష్టంగా పేర్కొనడం.
  rationale: సందర్భం ఆత్మసంబంధ లేదా విశ్వసంబంధ అధికారాలను కలిగి ఉండవచ్చు; అయితే గ్రీకు వాక్యం వాటి అస్తిత్వ స్వభావాన్ని స్పష్టంగా నిర్ధారించదు. అందువల్ల మూలంలోని విస్తృతిని, theological tensionను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలవాక్యం ముందు వచనంపై ఆధారపడే వాక్యభాగం కాబట్టి కొత్త కర్త లేదా క్రియను చేర్చలేదు. జాబితా యొక్క లయను కామాలతో, చివరి కాలవ్యత్యాసాన్ని దీర్ఘవిరామంతో స్పష్టం చేసింది.
