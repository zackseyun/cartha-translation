    issue: The name-title sequence is reversed in “మెస్సీయ యేసుకు.”
    rationale: The Greek reads Ἰησοῦ Χριστοῦ, “Jesus Messiah.” Telugu can naturally retain that sequence as “యేసు మెస్సీయకు,” better reflecting both the source order and the title’s relation to Jesus.
  - severity: low
    issue: The attachment of “పరలోక ప్రాంతాల్లో” is syntactically less clear in the current word order.
    rationale: In Greek, ἐν τοῖς ἐπουρανίοις directly qualifies the spiritual blessing phrase. “పరలోక ప్రాంతాల్లోని ప్రతి ఆత్మసంబంధమైన ఆశీర్వాదంతో” makes this connection clear in Telugu without over-specifying the phrase.
