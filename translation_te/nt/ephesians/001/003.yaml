source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ εὐλογήσας ἡμᾶς ἐν πάσῃ εὐλογίᾳ πνευματικῇ ἐν τοῖς ἐπουρανίοις ἐν Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who has blessed us with every spiritual blessing in the heavenly realms in Messiah[c][b],
translation:
  language: te
  text: మన ప్రభువైన యేసు మెస్సీయకు దేవుడూ తండ్రీ అయిన దేవుడు స్తుతింపబడుగాక! ఆయన మనలను మెస్సీయలో పరలోక ప్రాంతాల్లోని ప్రతి ఆత్మసంబంధమైన[a] ఆశీర్వాదంతో ఆశీర్వదించాడు.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవుని ఆత్మకు సంబంధించిన ప్రతి ఆశీర్వాదంతో.’ గ్రీకు విశేషణం విస్తృతంగా ‘ఆత్మసంబంధమైన’ అని గానీ, ప్రత్యేకంగా దేవుని ఆత్మకు సంబంధించినదని గానీ అర్థమివ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పరలోక స్థలాల్లో.’
    reason: lexical_alternative
  - marker: c
    text: 'సంప్రదాయ అనువాదం: ‘యేసు క్రీస్తు’ మరియు ‘క్రీస్తులో.’ ఇక్కడ గ్రీకు Χριστός అనే బిరుదు అర్థాన్ని నిలుపడానికి ‘మెస్సీయ’ అని అనువదించబడింది.'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: స్తుతింపబడుగాక
  rationale: దేవునికి ఉద్దేశించిన ఆశీర్వచనాత్మక స్తోత్రాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తపరుస్తుంది; కేవలం ‘ధన్యుడు’ అని చెప్పడం కంటే గ్రీకు ప్రశంసార్థక ప్రయోగాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: దేవుడూ తండ్రీ అయిన ఆయన
  rationale: ఒకే వ్యక్తిని ‘దేవుడు’ మరియు ‘తండ్రి’ అనే రెండు సంబంధిత విధాలుగా పేర్కొంటున్న గ్రీకు సమన్వయ నిర్మాణాన్ని నిలుపుతుంది.
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: మన ప్రభువైన మెస్సీయ యేసుకు
  rationale: κύριοςను ‘ప్రభువు’గా, Χριστόςను పేరులో భాగంలా కాక బిరుదుగా ‘మెస్సీయ’గా అందిస్తుంది; తెలుగు పదక్రమంలో ‘మెస్సీయ యేసు’ సహజంగా ఉంటుంది.
- source_word: ὁ εὐλογήσας ἡμᾶς
  choice: ఆయన మనలను ... ఆశీర్వదించాడు
  rationale: దేవుడు చేసిన సంపూర్ణ కార్యాన్ని సరళమైన భూతకాల క్రియతో తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐν πάσῃ εὐλογίᾳ πνευματικῇ
  choice: ప్రతి ఆత్మసంబంధమైన ఆశీర్వాదంతో
  rationale: ἐν యొక్క సాధనార్థక భావాన్ని ‘తో’ ద్వారా, πάσῃ యొక్క సమగ్రతను ‘ప్రతి’ ద్వారా నిలుపుతుంది. πνευματικῇలోని విస్తృత భావాన్ని ప్రధాన పాఠ్యంలో అతి నిర్దిష్టం చేయదు.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: పరలోక ప్రాంతాల్లో
  rationale: ఎఫెసీయులకు ప్రత్యేకమైన ఈ బహువచన నపుంసక విశేషణ ప్రయోగాన్ని పరలోక పరిధి లేదా రంగంగా చదవగల సహజ తెలుగు రూపంలో అందిస్తుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: పౌలు వాడే సంక్షిప్త ‘లో’ నిర్మాణాన్ని కాపాడుతూ Χριστός యొక్క బిరుదు భావాన్ని నిలుపుతుంది; ఆ సంబంధం లేదా ఐక్యతను వివరణాత్మకంగా విప్పి చెప్పదు.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: ‘మెస్సీయ’—‘మెస్సీయ యేసు’ మరియు ‘మెస్సీయలో’
  alternative: ‘క్రీస్తు’—‘యేసు క్రీస్తు’ మరియు ‘క్రీస్తులో’
  rationale: ఈ సందర్భంలో Χριστός బిరుదు భావాన్ని కలిగి ఉంది. ‘మెస్సీయ’ దాని అర్థసంబంధాన్ని స్పష్టంగా ఉంచుతుంది; సంప్రదాయ రూపాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: πνευματικῇ యొక్క భావం
  choice: ఆత్మసంబంధమైన
  alternative: దేవుని ఆత్మ ఇచ్చే / ఆత్మకు సంబంధించిన
  rationale: గ్రీకు విశేషణం సాధారణంగా ఆత్మసంబంధమైనదాన్ని లేదా ప్రత్యేకంగా దేవుని ఆత్మకు సంబంధించినదాన్ని సూచించవచ్చు. ప్రధాన పాఠ్యం ఈ ద్వంద్వసాధ్యతను సంకుచితం చేయదు.
- issue: ἐν τοῖς ἐπουρανίοις యొక్క పరిధి
  choice: పరలోక ప్రాంతాల్లో
  alternative: పరలోక స్థలాల్లో
  rationale: స్థలార్థం ఉన్నప్పటికీ, ఈ పదబంధం విస్తృతమైన పరలోక పరిధిని కూడా సూచించగలదు. ‘ప్రాంతాలు’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన స్తోత్ర శైలి వాడబడింది. గ్రీకు వాక్యపు భావసంబంధాలను నిలుపుతూ, తెలుగులో అతిగా భారమైన పదక్రమాన్ని నివారించాం. ‘ఆత్మసంబంధమైన’ కొద్దిగా సాంకేతికంగా ఉన్నా, πνευματικῇలోని ఉద్దేశపూర్వక విస్తృతతను ‘ఆత్మీయమైన’ కంటే స్పష్టంగా కాపాడుతుంది.
