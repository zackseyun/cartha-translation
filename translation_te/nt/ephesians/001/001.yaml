id: EPH.1.1
reference: Ephesians 1:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ τοῖς ἁγίοις τοῖς οὖσιν ⸂[ἐν Ἐφέσῳ]⸃ καὶ πιστοῖς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God[c][b], to the saints who are [in Ephesus] and faithful in Messiah Jesus:'
translation:
  language: te
  text: 'దేవుని చిత్తానుసారం మెస్సీయ యేసు యొక్క అపొస్తలుడైన పౌలు నుండి—[ఎఫెసులో][a] ఉన్న పరిశుద్ధులకూ, మెస్సీయ యేసులో నమ్మకమైనవారికీ[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘ఎఫెసులో’ అనే మాటలు లేవు. అందువల్ల ఈ ఉత్తరం ఎఫెసు సంఘానికే కాక మరింత విస్తృతంగా చదివేందుకు ఉద్దేశించబడి ఉండవచ్చని కొందరు భావిస్తారు.
    reason: textual_variant
  - marker: b
    text: లేదా ‘మెస్సీయ యేసులో విశ్వాసులైనవారికీ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόστολος
  choice: అపొస్తలుడు
  rationale: ఇక్కడ ఇది పౌలు అధికారపూర్వకంగా పంపబడిన సేవను సూచించే ఆది క్రైస్తవ బిరుదు; సాధారణమైన ‘దూత’ కంటే సాంకేతిక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: Χριστοῦ Ἰησοῦ / ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసు / మెస్సీయ యేసులో
  rationale: ఈ సందర్భంలో Χριστός బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ అని అనువదించబడింది; ἐν సూచించే సంబంధం లేదా ఐక్యతను ‘లో’ నిలుపుతుంది.
- source_word: διὰ θελήματος θεοῦ
  choice: దేవుని చిత్తం ప్రకారం
  rationale: διά + సంబంధ విభక్తి ఇక్కడ దేవుని చిత్తమే పౌలు నియామకానికి ఆధారం, అధికార మూలం అని తెలుపుతుంది; ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఉంది.
- source_word: ἁγίοις
  choice: పరిశుద్ధులు
  rationale: దేవునికి ప్రత్యేకించబడిన ఆయన ప్రజలను సూచించే పౌలు వాడుకను స్థిరమైన, గౌరవప్రదమైన తెలుగు పదంతో వ్యక్తం చేస్తుంది.
- source_word: '[ἐν Ἐφέσῳ]'
  choice: '[ఎఫెసులో]'
  rationale: మూలపాఠంలో ఈ పదాల ప్రామాణికతపై అనిశ్చితి ఉన్నందున వాటిని తొలగించకుండా చదరపు కుండలిలో ఉంచబడింది.
- source_word: πιστοῖς
  choice: నమ్మకమైనవారు
  rationale: πιστός అనే విశేషణంలోని ‘విశ్వాసంగా/నమ్మకంగా ఉన్న’ భావాన్ని నిలుపుతుంది; ‘విశ్వాసులు’ అనే అర్థం కూడా సాధ్యమేనని పాదసూచికలో ఇవ్వబడింది.
theological_decisions:
- issue: Χριστός అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: పౌలు పరిచయ వాక్యంలో ఇది యేసు బిరుదుగా స్పష్టంగా పనిచేస్తోంది; అందుచేత దాని అభిషిక్త రాజు అనే బిరుదు భావాన్ని ‘మెస్సీయ’ ప్రత్యక్షంగా నిలుపుతుంది.
- issue: ἐν Ἐφέσῳ పాఠాంతరం
  choice: ప్రధాన పాఠంలో చదరపు కుండలితో ఉంచడం
  alternative: ‘ఎఫెసులో’ అనే పదాలను వదలివేయడం
  rationale: కొన్ని ప్రాచీన ముఖ్య ప్రతుల్లో ఈ మాటలు లేవు. ఏ పాఠాన్ని తుది నిర్ణయంగా రుద్దకుండా మూలంలోని పాఠసందేహాన్ని కనిపించేలా ఉంచింది.
- issue: πιστοῖς భావం
  choice: నమ్మకమైనవారు
  alternative: విశ్వాసులు
  rationale: ఈ పదం విశ్వసించేవారినీ, నమ్మకంగా ఉండేవారినీ సూచించగలదు. ప్రధాన పాఠం విశేషణ భావాన్ని నిలుపుతూ ప్రత్యామ్నాయాన్ని పాదసూచికలో సంరక్షిస్తుంది.
- issue: ἁγίοις ... καὶ πιστοῖς నిర్మాణం
  choice: ‘పరిశుద్ధులకూ ... నమ్మకమైనవారికీ’ అని సమాంతరంగా ఉంచడం
  alternative: ‘నమ్మకమైన పరిశుద్ధులకు’ అని ఒకే వర్గంగా స్పష్టీకరించడం
  rationale: గ్రీకు వాక్యంలోని καί సమన్వయాన్ని నిలిపి, ఇవి ఒకే గ్రహీతవర్గానికి చెందిన రెండు వర్ణనలా లేక వ్యాకరణపరంగా వేరుగా వినిపించగలవా అన్న స్వల్ప అస్పష్టతను అనవసరంగా పరిష్కరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన పత్రికా-ఆరంభ శైలి వాడబడింది. ‘నుండి’ ద్వారా పంపినవాణ్ణి, దాతృవిభక్తి ద్వారా గ్రహీతలను స్పష్టపరిచాం. మూలంలోని పాఠసందేహానికి చదరపు కుండలిని అలాగే ఉంచాం.
