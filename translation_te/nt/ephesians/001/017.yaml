id: EPH.1.17
reference: Ephesians 1:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῆς δόξης, δώῃ ὑμῖν πνεῦμα σοφίας καὶ ἀποκαλύψεως ἐν ἐπιγνώσει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/017.yaml
  text: that the God of our Lord Jesus the Messiah[a], the Father of glory, may give you a spirit of wisdom and revelation in the knowledge of him[c][b],
translation:
  language: te
  text: మన ప్రభువైన యేసు మెస్సీయ[b] యొక్క దేవుడు, మహిమకు తండ్రియైన ఆయన[c], ఆయన గురించిన జ్ఞానంలో మీకు జ్ఞానానికీ ప్రకటనకూ సంబంధించిన ఆత్మను[a] అనుగ్రహించునుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జ్ఞానానికీ ప్రకటనకూ సంబంధించిన దేవుని ఆత్మను.” గ్రీకు πνεῦμα అనే పదం దేవుడు ఇచ్చే ఆత్మీయ స్వభావాన్ని గానీ, దేవుని ఆత్మను గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: 'సంప్రదాయ అనువాదం: “యేసు క్రీస్తు.” గ్రీకు బిరుదైన Χριστόςకు “మెస్సీయ” అని అర్థం.'
    reason: lexical_alternative
  - marker: c
    text: లేదా, “మహిమగల తండ్రి.” గ్రీకులో అక్షరార్థంగా “మహిమకు తండ్రి” అని ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: అనుగ్రహించాలని
  rationale: మునుపటి వచనంలో ప్రారంభమైన పౌలు ప్రార్థనలోని విన్నపాన్ని కొనసాగించే ఉద్దేశ్య/విషయ ఉపవాక్యంగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ θεὸς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: మన ప్రభువైన యేసు మెస్సీయ యొక్క దేవుడు
  rationale: గ్రీకు సంబంధవిభక్తి నిర్మాణాన్ని, ‘ప్రభువు’ అనే క్రీస్తు బిరుదును నిలుపుతుంది; Χριστός యొక్క బిరుదార్థాన్ని ‘మెస్సీయ’గా వ్యక్తం చేస్తుంది.
- source_word: ὁ πατὴρ τῆς δόξης
  choice: మహిమకు తండ్రి
  rationale: ‘మహిమగల తండ్రి’ అని విశేషణార్థంగా మాత్రమే నిర్ణయించకుండా, మూలంలోని సంబంధవిభక్తి నిర్మాణాన్నీ దాని విస్తృత భావసాధ్యతనూ కాపాడుతుంది.
- source_word: δώῃ
  choice: అనుగ్రహించాలని
  rationale: ప్రార్థనా సందర్భంలోని అర్థానికి ‘ఇవ్వాలని’ కంటే సహజమైన, గౌరవపూర్వకమైన తెలుగు; దానం దేవుని నుంచే వస్తుందనే భావాన్ని తెలియజేస్తుంది.
- source_word: πνεῦμα σοφίας καὶ ἀποκαλύψεως
  choice: జ్ఞానమూ ప్రత్యక్షతా గల ఆత్మను
  rationale: ‘ఆత్మ’ అనే పదాన్ని ఉంచి, అది దేవుడు ఇచ్చే అంతరంగ స్వభావమా లేక దేవుని ఆత్మనా అనే మూలంలోని సందిగ్ధతను వీలైనంతవరకు కాపాడుతుంది.
- source_word: ἐν ἐπιγνώσει αὐτοῦ
  choice: ఆయనను తెలుసుకోవడంలో
  rationale: ἐπίγνωσις సూచించే నిజమైన/లోతైన పరిజ్ఞాన భావాన్ని అతిశయంగా ‘పూర్తిగా’ అని చేర్చకుండా సహజమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: πνεῦμα అనేది దేవుడు ఇచ్చే ఆత్మీయ స్వభావాన్నా, లేక దేవుని ఆత్మనే సూచిస్తుందా?
  choice: జ్ఞానమూ ప్రత్యక్షతా గల ఆత్మను
  alternative: జ్ఞానమూ ప్రత్యక్షతా అనుగ్రహించే దేవుని ఆత్మను
  rationale: గ్రీకులో πνεῦμαకు నిర్దిష్ట ఉపపదం లేదు; రెండు అర్థాలూ సాధ్యమే. ప్రధాన పాఠం ఏ ఒక్క అర్థాన్నీ బలవంతంగా ఖరారు చేయకుండా ‘ఆత్మ’ను ఉంచుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలుపుతుంది.
- issue: Χριστόςను ఎలా అనువదించాలి?
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను ప్రధాన పాఠంలో ఉంచి, సంప్రదాయ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- issue: πατὴρ τῆς δόξηςలోని సంబంధవిభక్తిని ఎలా అర్థం చేసుకోవాలి?
  choice: మహిమకు తండ్రి
  alternative: మహిమగల తండ్రి
  rationale: మూలంలోని ‘మహిమ యొక్క తండ్రి’ అనే నిర్మాణం కేవలం విశేషణార్థానికే పరిమితం కాకపోవచ్చు; ప్రధాన పాఠం ఆ భావవిస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవపూర్వక ప్రార్థనా శైలిని వాడాం. ఈ వాక్యం 16వ వచనంలో మొదలైన ప్రార్థనను కొనసాగించే ఉపవాక్యం కనుక చివర ‘అనుగ్రహించాలని’ అనే ఆధారిత రూపాన్ని నిలిపాం. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠంలో ఉన్నాయి.
