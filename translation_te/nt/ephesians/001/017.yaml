revisions:
- from: మన ప్రభువైన యేసు మెస్సీయ[b] యొక్క దేవుడు, మహిమకు తండ్రి[c], ఆయనను తెలుసుకోవడంలో మీకు జ్ఞానమూ ప్రత్యక్షతా గల ఆత్మను[a] అనుగ్రహించాలని.
  to: మన ప్రభువైన యేసు మెస్సీయ[b] యొక్క దేవుడు, మహిమకు తండ్రియైన ఆయన[c], ఆయన గురించిన జ్ఞానంలో మీకు జ్ఞానానికీ ప్రకటనకూ సంబంధించిన ఆత్మను[a] అనుగ్రహించునుగాక.
  rationale: The revision corrects the rendering of ἀποκάλυψις, repairs the theological alternative in footnote a, and improves the Telugu apposition for “the Father of glory.” It keeps the source's ambiguity regarding πνεῦμα and does not impose an identification with the Holy Spirit in the main text. Footnote anchors remain attached to their corresponding expressions.
  reviewer_model: gpt-5.6-terra
