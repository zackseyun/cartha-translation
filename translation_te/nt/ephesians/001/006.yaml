id: EPH.1.6
reference: Ephesians 1:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς ἔπαινον δόξης τῆς χάριτος αὐτοῦ ⸀ἧς ἐχαρίτωσεν ἡμᾶς ἐν τῷ ἠγαπημένῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/006.yaml
  text: to the praise of the glory of his grace[a], with which he has favored us in the Beloved[b],
translation:
  language: te
  text: ఆయన తన ప్రియమైనవానిలో[a] మనకు అనుగ్రహించిన కృప మహిమకు స్తుతి కలిగేలా.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ప్రియమైనవాడు” ఇక్కడ కుమారుణ్ణి, అనగా మెస్సీయను, సూచిస్తుంది.
    reason: cross_reference
  - marker: b
    text: “అనుగ్రహించిన” అని అనువదించిన గ్రీకు క్రియకు “కృప” అనే పదంతో ఒకే మూలం ఉంది. దీన్ని “ఆ కృపతో మనలను కృపాపాత్రులుగా చేశాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἔπαινον
  choice: స్తుతి కలిగేలా
  rationale: εἰς ఇక్కడ ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. ‘స్తుతి కలిగేలా’ అనే ప్రయోగం ఆధునిక తెలుగులో సహజంగా ఉండి ఆ భావాన్ని నిలుపుతుంది.
- source_word: δόξης τῆς χάριτος αὐτοῦ
  choice: ఆయన ... కృప మహిమకు
  rationale: ‘ఆయన కృప యొక్క మహిమ’ కంటే ‘ఆయన కృప మహిమ’ సహజంగా ఉంది; δόξα–χάρις మధ్యనున్న సంబంధాన్ని ‘మహిమాన్వితమైన కృప’గా పూర్తిగా విశేషణీకరించకుండా నిలుపుతుంది.
- source_word: ἧς ἐχαρίτωσεν ἡμᾶς
  choice: మనకు అనుగ్రహించిన
  rationale: χαριτόω అనేది χάριςకు సమానమూల పదం; ‘అనుగ్రహించిన’ అనేది దేవుడు కృపాపూర్వకంగా ప్రసాదించాడనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది. గ్రీకులోని పదమూల సంబంధం తెలుగులో పూర్తిగా పునరుత్పత్తి చేయలేనందున పాదసూచికలో వివరించబడింది.
- source_word: ἐν τῷ ἠγαπημένῳ
  choice: తన ప్రియునిలో
  rationale: ἐν యొక్క మౌలికమైన ‘లో’ భావాన్ని నిలుపుతూ, substantival perfect passive participleను బిరుదులా ‘ప్రియుడు’ అని అనువదించాం. మూలంలో లేని ‘కుమారుడు’ అనే పదాన్ని ప్రధాన వాక్యంలో చేర్చలేదు.
theological_decisions:
- issue: χάρις మరియు χαριτόω మధ్య పదమూల సంబంధం
  choice: కృప ... అనుగ్రహించిన
  alternative: కృపతో మనలను కృపాపాత్రులుగా చేసిన
  rationale: ప్రత్యామ్నాయం పదమూల సంబంధాన్ని మరింత స్పష్టంగా చూపించినా తెలుగులో కొంత కృత్రిమంగా వినిపిస్తుంది. ఎంచుకున్న రూపం దేవుని కృపాపూర్వక కార్యాన్ని సహజంగా తెలియజేస్తుంది; సంబంధాన్ని పాదసూచిక వివరిస్తుంది.
- issue: τῷ ἠγαπημένῳ యొక్క క్రీస్తుసంబంధమైన సూచన
  choice: తన ప్రియునిలో
  alternative: తన ప్రియ కుమారునిలో
  rationale: సందర్భంలో ఇది మెస్సీయను సూచించినప్పటికీ ఈ వచనంలో ‘కుమారుడు’ అనే నామవాచకం లేదు. ‘ప్రియుడు’ అనే బిరుదుస్వరూపాన్ని నిలిపి, సూచనను పాదసూచికలో స్పష్టం చేశాం.
- issue: ἐν యొక్క సంబంధ భావం
  choice: లో
  alternative: ద్వారా
  rationale: ‘ద్వారా’ సాధనార్థాన్ని స్పష్టపరుస్తుంది; అయితే గ్రీకు ἐνలో పరిధి, ఐక్యత, సాధనం అనే భావసంభావ్యతలు ఉన్నాయి. ‘లో’ ఆ ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ఇది ఎఫెసీయులు 1:3–14లో కొనసాగుతున్న దీర్ఘ వాక్యంలోని ఉద్దేశ/ఫలిత భాగమని చూపేందుకు ‘కలిగేలా’ వాడాం. రెండు పాదసూచిక సూచికలూ ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
