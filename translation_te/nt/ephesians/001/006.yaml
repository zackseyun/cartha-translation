- from: ఆయన తన ప్రియునిలో[a] మనకు అనుగ్రహించిన కృప మహిమకు స్తుతి కలిగేలా.[b]
  to: ఆయన తన ప్రియమైనవానిలో[a] మనకు అనుగ్రహించిన కృప మహిమకు స్తుతి కలిగేలా.[b]
  rationale: 'The revision makes only a safe lexical and idiomatic correction: “ప్రియమైనవానిలో” accurately and naturally represents the title “the Beloved.” The sentence structure, purpose/result nuance, divine grace terminology, and deliberate breadth of ἐν (“లో”) are retained. Footnotes remain anchored to the title and the cognate grace verb respectively.'
