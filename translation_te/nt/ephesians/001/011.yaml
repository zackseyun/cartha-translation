revisions:
- from: ఆయనలో మనం కూడా దేవుని స్వాస్థ్యంగా నియమించబడ్డాం[a]. తన చిత్తంలోని నిర్ణయం ప్రకారం సమస్తాన్నీ కార్యరూపంలోకి తెచ్చే దేవుని ఉద్దేశం మేరకు మనం ముందుగానే నిర్ణయించబడ్డాం.
  to: ఆయనలో మనం కూడా దేవుని స్వాస్థ్యంగా కేటాయించబడ్డాం[a]; సమస్తాన్నీ కార్యసాధనం చేసే దేవుని ఉద్దేశం మేరకు, ఆయన చిత్తానుసారమైన సంకల్పం ప్రకారం మనం ముందుగానే నిర్ణయించబడ్డాం.
  rationale: The revision corrects the rendering of βουλὴ τοῦ θελήματος while maintaining the source's ambiguity concerning ἐκληρώθημεν. It also uses terminology that more directly represents the passive allotment sense selected in the main text, with the receiving-an-inheritance reading retained in the footnote.
  reviewer_model: gpt-5.6-terra
