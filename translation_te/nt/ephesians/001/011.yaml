id: EPH.1.11
reference: Ephesians 1:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ἐκληρώθημεν προορισθέντες κατὰ πρόθεσιν τοῦ τὰ πάντα ἐνεργοῦντος κατὰ τὴν βουλὴν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/011.yaml
  text: In him we also were made an inheritance[a], having been predestined according to the purpose of the one who works all things according to the counsel of his will,
translation:
  language: te
  text: ఆయనలో మనం కూడా దేవుని స్వాస్థ్యంగా కేటాయించబడ్డాం[a]; సమస్తాన్నీ కార్యసాధనం చేసే దేవుని ఉద్దేశం మేరకు, ఆయన చిత్తానుసారమైన సంకల్పం ప్రకారం మనం ముందుగానే నిర్ణయించబడ్డాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనం కూడా స్వాస్థ్యాన్ని పొందాం.” గ్రీకు క్రియకు స్వాస్థ్యాన్ని పొందడం అనే అర్థమూ, దేవునికి కేటాయించబడిన స్వాస్థ్యంగా చేయబడడం అనే అర్థమూ ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ఆయనలో
  rationale: సంబంధసర్వనామం ముందున్న మెస్సీయను సూచిస్తుంది. ‘ఆయనలో’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం; క్రీస్తుతో ఐక్యత భావాన్ని నిలుపుతుంది.
- source_word: ἐκληρώθημεν
  choice: దేవుని స్వాస్థ్యంగా నియమించబడ్డాం
  rationale: κληρόω యొక్క కర్మణి రూపం వాటాగా లేదా స్వాస్థ్యంగా నియమించబడటాన్ని సూచించగలదు. పాత నిబంధనలో దేవుని ప్రజలు ఆయన స్వాస్థ్యమనే నేపథ్యాన్ని ఈ అనువాదం ప్రతిబింబిస్తుంది; ‘స్వాస్థ్యాన్ని పొందాం’ అనే నిజమైన ప్రత్యామ్నాయ అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: προορισθέντες
  choice: ముందుగానే నిర్ణయించబడ్డాం
  rationale: ఈ కృదంతం ముందుగా నిర్ణయించడాన్ని స్పష్టంగా తెలియజేస్తుంది. ఈ పదబంధం మూలపద బలాన్ని నిలుపుతూ, దానికంటే విస్తృతమైన ఏ సిద్ధాంత వ్యవస్థనూ వాక్యంలోకి చేర్చదు.
- source_word: κατὰ πρόθεσιν
  choice: ఉద్దేశం మేరకు
  rationale: πρόθεσις ఉద్దేశపూర్వక సంకల్పాన్ని లేదా ప్రణాళికను సూచిస్తుంది. ‘ఉద్దేశం మేరకు’ సహజంగా ఉండి గ్రీకు భావానికి దగ్గరగా ఉంది.
- source_word: τοῦ τὰ πάντα ἐνεργοῦντος
  choice: సమస్తాన్నీ కార్యరూపంలోకి తెచ్చే దేవుని
  rationale: నామవాచకంగా పనిచేసే కృదంతానికి దేవుడే కర్త. ‘కార్యరూపంలోకి తెచ్చే’ అనేది ఆయన కార్యాన్ని స్పష్టంగా తెలుపుతుంది; ఆ కార్యం ఏ విధంగా జరుగుతుందో అనవసరంగా నిర్దిష్టపరచదు.
- source_word: τὰ πάντα
  choice: సమస్తాన్నీ
  rationale: ఈ ఎంపిక పౌలు వాక్యంలోని సమగ్ర పరిధిని నేరుగా నిలుపుతుంది.
- source_word: κατὰ τὴν βουλὴν
  choice: నిర్ణయం ప్రకారం
  rationale: βουλή ఆలోచించి చేసిన నిర్ణయాన్ని లేదా దృఢసంకల్పాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘నిర్ణయం’ దాని ఉద్దేశపూర్వక భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: తన చిత్తంలోని
  rationale: θέλημα దేవుని చిత్తాన్ని సూచిస్తుంది. ‘తన చిత్తంలోని నిర్ణయం’ అనే నిర్మాణం βουλήతో ఉన్న సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ἐκληρώθημεν అనే పదం యొక్క అర్థం
  choice: విశ్వాసులు దేవుని స్వాస్థ్యంగా, అంటే ఆయనకు కేటాయించబడిన ప్రజలుగా నియమించబడ్డారు.
  alternative: విశ్వాసులు ఒక స్వాస్థ్యాన్ని పొందారు.
  rationale: κληρόω అనే క్రియ కర్మణి రూపంలో ఉన్నందున ఈ రెండు అర్థాలకూ భాషాపరమైన అవకాశం ఉంది. దేవుని ప్రజలు ఆయన స్వాస్థ్యమనే పాత నిబంధన నేపథ్యం ప్రధాన పఠనానికి మద్దతిస్తుంది; అయినా ప్రత్యామ్నాయ పఠనం బలమైనదే కాబట్టి దాన్ని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని రెండు κατὰ పదబంధాల సంబంధాన్ని స్పష్టంగా ఉంచేందుకు తెలుగులో రెండు వాక్యాలుగా విభజించాం; భావ సంబంధం మాత్రం నిలిచింది. ‘ముందుగానే నిర్ణయించబడ్డాం’ అనే రూపం మూలంలోని కర్మణి భావాన్ని కాపాడుతుంది.
