source:
  edition: SBLGNT
  text: καθὼς ἐξελέξατο ἡμᾶς ἐν αὐτῷ πρὸ καταβολῆς κόσμου, εἶναι ἡμᾶς ἁγίους καὶ ἀμώμους κατενώπιον αὐτοῦ ἐν ἀγάπῃ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/004.yaml
  text: just as he chose us in him before the foundation of the world[a], to be holy and blameless before him in love[c][b],
translation:
  language: te
  text: అలాగే, లోకానికి పునాది వేయబడకముందే ఆయన మనలను ఆయనలో ఎంచుకున్నాడు; ఆయన సన్నిధిలో ప్రేమలో పవిత్రులుగా, నిర్దోషులుగా[a] ఉండటానికి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మచ్చలేనివారిగా.”
    reason: lexical_alternative
  - marker: b
    text: “ప్రేమలో” అనే మాటను తరువాతి వచనంతో కలిపి, “ప్రేమలో ఆయన మనలను ముందుగా నిర్ణయించాడు …” అని కూడా చదవవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: అలాగే
  rationale: ముందున్న ఆశీర్వాద ప్రకటనతో ఈ వాక్యానికి ఉన్న పోలిక/ఆధార సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐξελέξατο
  choice: ఎంచుకున్నాడు
  rationale: దేవుని ఎంపిక అనే స్పష్టమైన భావాన్ని తెలియజేస్తూనే, తరువాతి సిద్ధాంత వ్యవస్థల ప్రత్యేక పదజాలాన్ని అనవసరంగా దిగుమతి చేయదు.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: క్రీస్తుతో సంబంధాన్ని సూచించే పౌలు సంక్షిప్త ప్రయోగాన్ని విస్తరించి వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: πρὸ καταβολῆς κόσμου
  choice: లోకానికి పునాది వేయకముందే
  rationale: కాలసూచక భావాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తూ మూలంలోని ‘పునాది’ రూపకాన్ని కాపాడుతుంది.
- source_word: εἶναι ἡμᾶς
  choice: మనం … ఉండాలని
  rationale: ఎంపిక యొక్క ఉద్దేశం లేదా ఫలితాన్ని సహజమైన తెలుగు ఉపవాక్యంతో తెలియజేస్తుంది.
- source_word: ἁγίους
  choice: పవిత్రులుగా
  rationale: నైతిక పవిత్రతతో పాటు దేవునికోసం ప్రత్యేకపరచబడిన భావాన్ని కూడా నిలుపుతుంది.
- source_word: ἀμώμους
  choice: నిర్దోషులుగా
  rationale: నిందకు తావులేని స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది; బలి సంబంధమైన ‘మచ్చలేని’ భావాన్ని పాదసూచికలో ఉంచింది.
- source_word: κατενώπιον αὐτοῦ
  choice: ఆయన సన్నిధిలో
  rationale: దేవుని ఎదుట ఉండడం, ఆయన సమక్షంలో జీవించడం అనే సంబంధాత్మక భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: ἐν ἀγάπῃ
  choice: ప్రేమతో
  rationale: ప్రధాన పాఠ్యంలో ముందున్న పవిత్రత, నిర్దోషత్వంతో అనుసంధానిస్తుంది; తరువాతి వచనంతో అనుసంధానించే నిజమైన వాక్యనిర్మాణ సందిగ్ధతను పాదసూచికలో కాపాడుతుంది.
theological_decisions:
- issue: ἐξελέξατο అనే పదాన్ని పూర్వనిర్ణయ సంబంధ సిద్ధాంత పదంగా అతిగా చదివే అవకాశం
  choice: ఎంచుకున్నాడు
  alternative: ఎన్నుకున్నాడు / ఎన్నిక చేసుకున్నాడు
  rationale: మూలపాఠ్యం దేవుని ఎంపికను స్పష్టంగా చెబుతుంది; అయితే ప్రత్యేక మతశాఖ సిద్ధాంతాన్ని ముందుగానే నిర్ణయించే సాంకేతిక పదాన్ని ఉపయోగించకుండా సాధారణ క్రియను ఎంచుకుంది.
- issue: ἐν ἀγάπῃ ఏ భాగంతో అనుసంధానమవుతుందనే వాక్యనిర్మాణ సందిగ్ధత
  choice: 4వ వచనంలోని ముందరి భావంతో ‘ప్రేమతో’ అని అనుసంధానించడం
  alternative: 5వ వచనంతో ‘ప్రేమతో ఆయన మనలను ముందుగా నిర్ణయించాడు …’ అని అనుసంధానించడం
  rationale: గ్రీకు వాక్యంలో రెండు అనుసంధానాలకూ అవకాశం ఉంది. ప్రధాన పాఠ్యం ఒక సహజ పఠనాన్ని ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయినా గౌరవప్రదంగా ఉంది. పౌలు వాడిన ‘ఆయనలో’ అనే సంక్షిప్త క్రీస్తు-సంబంధ భాషను వ్యాఖ్యానాత్మకంగా విస్తరించలేదు.
