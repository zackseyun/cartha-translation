- from: ఆయనలో, ఆయన కృపాసంపదకు తగినట్లుగా, ఆయన రక్తం ద్వారా మనకు విమోచన ఉంది—అంటే, మన అపరాధాలకు క్షమాపణ.
  to: ఆయనలో మనకు ఆయన రక్తం ద్వారా విమోచన ఉంది—అంటే, అపరాధాల క్షమాపణ—ఆయన కృపాసంపదకు తగినట్లుగా.
  rationale: The revision retains all key lexical and theological expressions, preserves the appositional relation between redemption and forgiveness, removes an unnecessary possessive addition, and restores the final placement of the clause expressing grace as the measure of this redemption/forgiveness.
