id: EPH.1.7
reference: Ephesians 1:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν διὰ τοῦ αἵματος αὐτοῦ, τὴν ἄφεσιν τῶν παραπτωμάτων, κατὰ ⸂τὸ πλοῦτος⸃ τῆς χάριτος αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/007.yaml
  text: In him we have redemption through his blood[a], the forgiveness of trespasses[b], according to the riches of his grace
translation:
  language: te
  text: ఆయనలో మనకు ఆయన రక్తం ద్వారా విమోచన ఉంది—అంటే, అపరాధాల క్షమాపణ—ఆయన కృపాసంపదకు తగినట్లుగా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ఆయనలో
  rationale: సంబంధ సర్వనామం ముందటి వచనంలోని ప్రియునిని సూచిస్తుంది. ‘ఆయనలో’ అనే రూపం క్రీస్తుతో సంబంధం/ఐక్యత భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἔχομεν
  choice: మనకు ... ఉంది
  rationale: వర్తమాన సూచక క్రియ ప్రస్తుతం ఉన్న వాస్తవాన్ని లేదా స్వాధీనాన్ని తెలియజేస్తుంది; ‘మనకు ... ఉంది’ దీనిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπολύτρωσιν
  choice: విమోచన
  rationale: ఈ పదం మూల్యం చెల్లించడం లేదా గొప్ప వెల చెల్లించడం ద్వారా కలిగే విడుదల భావాన్ని మోస్తుంది. ‘విమోచన’ ఆ పదానికి ఉన్న పౌలు సంబంధమైన భావగాంభీర్యాన్ని నిలుపుతుంది.
- source_word: διὰ τοῦ αἵματος αὐτοῦ
  choice: ఆయన రక్తం ద్వారా
  rationale: షష్ఠీ విభక్తితో διά సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది. మూలంలోని స్పష్టమైన రక్తం అనే బలి/ఒడంబడిక చిత్రణను వ్యాఖ్యానాత్మకంగా ‘మరణం’గా మార్చకుండా ఉంచాం.
- source_word: ἄφεσιν
  choice: క్షమాపణ
  rationale: ఇక్కడ ఈ పదం అపరాధాలు తొలగించబడటం లేదా మన్నించబడటం అనే భావంతో విమోచనను వివరిస్తుంది; ‘క్షమాపణ’ ఆధునిక తెలుగులో స్పష్టమైన సమానార్థకం.
- source_word: παραπτωμάτων
  choice: అపరాధాలకు
  rationale: παράπτωμα నైతిక తప్పు, దోషం లేదా అతిక్రమాన్ని సూచిస్తుంది. ‘అపరాధాలు’ సాధారణ పాఠకులకు సహజంగా ఉండి నైతిక, సంబంధపరమైన దోషభావాన్ని నిలుపుతుంది.
- source_word: κατὰ τὸ πλοῦτος
  choice: కృపాసంపదకు తగినట్లుగా
  rationale: κατά ఇక్కడ కేవలం మూలాన్ని కాక ప్రమాణాన్ని లేదా పరిమాణాన్ని సూచిస్తుంది. ‘తగినట్లుగా’ దేవుని కృపాసంపదే క్షమాపణ పరిమాణానికి ప్రమాణమనే భావాన్ని తెలియజేస్తుంది.
- source_word: χάριτος
  choice: కృప
  rationale: పౌలు రచనల్లో χάρις దేవుని అనుగ్రహపూర్వక దయను సూచించే ప్రధాన పదం; ‘కృప’ దాని స్థిరమైన, భావపూర్ణ తెలుగు సమానార్థకం.
theological_decisions:
- issue: ‘విమోచన’కు ‘అపరాధాలకు క్షమాపణ’కు మధ్య సంబంధం
  choice: రెండవ నామవాచక పదబంధాన్ని మొదటిదానికి వివరణాత్మక సమానాధికారంగా ఉంచి, తెలుగులో స్పష్టత కోసం ‘అంటే’ వాడటం
  alternative: ‘విమోచన, మన అపరాధాలకు క్షమాపణ’ అని సంధానపదం లేకుండా గ్రీకు నిర్మాణాన్ని యథాతథంగా అనుసరించడం
  rationale: గ్రీకులో రెండవ ద్వితీయా విభక్తి పదబంధం మొదటి పదబంధాన్ని వివరిస్తుంది. తెలుగులో విరామచిహ్నాలు మాత్రమే వాడితే వాక్యం అసహజంగా లేదా జాబితాలా వినిపించే అవకాశం ఉంది; ‘అంటే’ కొత్త సిద్ధాంతార్థాన్ని జోడించకుండా ఆ సమానాధికార సంబంధాన్ని స్పష్టం చేస్తుంది.
- issue: ‘ఆయన రక్తం ద్వారా’ అనే ప్రాయశ్చిత్త భాష
  choice: ‘రక్తం’ అనే స్పష్టమైన మూలరూపాన్ని నిలుపడం
  alternative: ‘ఆయన మరణం ద్వారా’ లేదా ‘ఆయన బలిమరణం ద్వారా’
  rationale: మూలపాఠం నేరుగా ‘రక్తం’ అంటుంది. దానిని ‘మరణం’గా మార్చడం అనువాదం కంటే వ్యాఖ్యానం అవుతుంది; అలాగే బలి, ఒడంబడిక సంబంధమైన చిత్రణను తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని దీర్ఘ వాక్య సంబంధాన్ని నిలుపుతూ, తెలుగులో ప్రధాన భావం సహజంగా ప్రవహించేందుకు ‘ఆయన కృపాసంపదకు తగినట్లుగా’ అనే భాగాన్ని ముందుకు మార్చాం. అనవసర మతపరమైన ప్రత్యేక పదజాలం లేదా సంఘశాఖాపరమైన వ్యాఖ్యానం చేర్చలేదు.
