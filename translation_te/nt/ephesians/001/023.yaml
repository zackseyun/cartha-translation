translation:
  language: te
  text: అది ఆయన శరీరం—అన్నిటినీ అన్నిటిలో నింపుతున్నవాని సంపూర్ణత.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “అన్నిటిలో”ను “అందరిలో” లేదా సందర్భానుసారంగా “ప్రతి విధంగా” అని కూడా అనువదించవచ్చు.
    reason: ἐν πᾶσιν అనే పదబంధంలోని విస్తృతమైన, వివాదాస్పదమైన సూచనను ప్రధాన పాఠ్యంలో పరిమితం చేయకుండా ప్రత్యామ్నాయాలను తెలియజేయడానికి.
  - marker: b
    text: “నింపుతున్నవాని” అని అనువదించిన గ్రీకు రూపాన్ని “నింపబడుతున్నవాని” అని కూడా అర్థం చేసుకోవచ్చు; అయితే ఇక్కడ చాలామంది దాన్ని క్రియాశీల భావంలో గ్రహిస్తారు.
    reason: మధ్యమ/కర్మణి రూపంలో ఉన్న πληρουμένου యొక్క ప్రత్యామ్నాయ వ్యాకరణ పఠనాన్ని సంరక్షించడానికి.
lexical_decisions:
- source_word: ἥτις
  choice: అది
  rationale: ఈ సంబంధ సర్వనామం 22వ వచనంలోని సంఘాన్ని సూచిస్తుంది. తెలుగు వాక్యనిర్మాణంలో ‘అది’ సహజంగా ఉండి, దాని వివరణాత్మక స్వరాన్ని సందర్భమే తెలియజేస్తుంది.
- source_word: σῶμα
  choice: శరీరం
  rationale: సంఘానికి క్రీస్తుతో ఉన్న సంబంధాన్ని తెలిపే పౌలు వాడిన స్థిరమైన రూపకం; మూలపదానికి నేరమైన సమానార్థకం.
- source_word: πλήρωμα
  choice: సంపూర్ణత
  rationale: పదంలోని సమృద్ధమైన, వివాదాస్పద భావాన్ని వివరణతో కుదించకుండా నిలుపుతుంది; ‘నింపబడినది’ లేదా ‘పూర్తిచేసేది’ అని ఏకపక్షంగా నిర్ణయించదు.
- source_word: τοῦ ... πληρουμένου
  choice: నింపుతున్నవాని
  rationale: రూపం మధ్యమ/కర్మణి అయినప్పటికీ సందర్భంలో క్రియాశీల భావం సహజంగా ఉంది. సాధ్యమైన కర్మణి అర్థాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: τὰ πάντα
  choice: అన్నిటినీ
  rationale: నపుంసక బహువచన సమగ్ర వ్యక్తీకరణను సహజమైన తెలుగులో విస్తృతంగానే ఉంచుతుంది.
- source_word: ἐν πᾶσιν
  choice: అందరిలో
  rationale: గ్రీకు పదబంధంలోని ‘అందరిలో/అన్నిటిలో’ అనే సంక్షిప్తతను ‘ప్రతి విధంగా’ అని వివరణాత్మకంగా మార్చకుండా, తెలుగు వ్యాకరణానికి అనుగుణంగా వ్యక్తుల సూచనతో అనువదిస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
theological_decisions:
- issue: సంఘానికి, క్రీస్తుకు సంబంధించి πλήρωμα యొక్క భావం
  choice: సంఘాన్ని క్రీస్తు శరీరంగానూ, ఆయనకు సంబంధించిన ‘సంపూర్ణత’గానూ పేర్కొని, సంబంధం ఎలా పనిచేస్తుందో అనువాదంలో నిర్దిష్టంగా నిర్ణయించలేదు.
  alternative: క్రీస్తుచేత నింపబడేది; లేదా క్రీస్తును ఒక భావంలో పూర్తిచేసేది/పూరకమైనది.
  rationale: గ్రీకు వాక్యం దగ్గరగా సంబంధించిన అనేక అర్థనిర్మాణాలకు వీలు ఇస్తుంది. ‘సంపూర్ణత’ ఆ నిజమైన వేదాంత ఉద్రిక్తతను నిలుపుతుంది.
- issue: πληρουμένου యొక్క వాచ్యం/భావం
  choice: ‘నింపుతున్నవాడు’ అనే క్రియాశీల భావం.
  alternative: ‘నింపబడుతున్నవాడు.’
  rationale: రూపం మధ్యమ/కర్మణి అయినా, తక్షణ సందర్భం మరియు కొయినే వాడుక క్రియాశీల లేదా డిపోనెంట్-సదృశ భావానికి బలం ఇస్తాయి. అయినా వ్యాకరణపరంగా సాధ్యమైన కర్మణి పఠనాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించాం. గ్రీకు వాక్యంలోని θεologically dense ambiguityను ‘సంపూర్ణత’ ద్వారా నిలిపాం. ప్రధాన పాఠ్యంలో రెండు పాదటిప్పణి గుర్తులూ ఉన్నాయి.
