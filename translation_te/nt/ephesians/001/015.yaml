id: EPH.1.15
reference: Ephesians 1:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὰ τοῦτο κἀγώ, ἀκούσας τὴν καθ’ ὑμᾶς πίστιν ἐν τῷ κυρίῳ Ἰησοῦ καὶ τὴν ⸂ἀγάπην τὴν⸃ εἰς πάντας τοὺς ἁγίους,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/015.yaml
  text: For this reason[a], I also, having heard of your faith in the Lord Jesus and your love for all the saints[b],
translation:
  language: te
  text: ఈ కారణంగా, ప్రభువైన యేసులో మీకున్న విశ్వాసం[a] గురించీ, పరిశుద్ధులందరిపట్ల మీకున్న ప్రేమ[b] గురించీ విని, నేను కూడా
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువైన యేసులో మీకున్న నమ్మకం.” గ్రీకు నామవాచకానికి కొన్ని సందర్భాల్లో “విశ్వసనీయత” అనే భావం కూడా ఉంటుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పరిశుద్ధులందరి వైపు మీ ప్రేమ.” కొన్ని గ్రీకు ప్రతులలో “మీ ప్రేమ” అనే పదాలు లేవు.
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: ఈ కారణంగా
  rationale: ముందున్న ఆశీర్వాద వివరణను వెనక్కి సూచిస్తూ పౌలు స్పందించడానికి కారణాన్ని తెలియజేస్తుంది; తెలుగు వాక్యప్రవాహంలో సహజంగా ఉండేలా కారణార్థాన్ని నిలిపింది.
- source_word: κἀγώ
  choice: నేను కూడా
  rationale: καί + ἐγώ లోని చేర్పు భావాన్ని అతిగా నొక్కకుండా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀκούσας
  choice: విని
  rationale: పౌలును విశేషించే భూతకాల అసమాపక క్రియాభావాన్ని నిలిపి, తరువాతి వచనంలో వచ్చే ప్రధాన క్రియతో వాక్య సంబంధాన్ని కొనసాగిస్తుంది.
- source_word: τὴν καθ’ ὑμᾶς πίστιν
  choice: మీకున్న విశ్వాసం
  rationale: καθ’ ὑμᾶς అనే గ్రీకు ప్రయోగాన్ని సహజమైన తెలుగులో పాఠకులకు చెందిన విశ్వాసంగా తెలియజేస్తుంది.
- source_word: πίστιν
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో ప్రభువైన యేసుతో పాఠకుల నమ్మక సంబంధాన్ని సూచించే ప్రధాన అర్థం; ‘నమ్మకం’ అనే సమీప ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: ἐν τῷ κυρίῳ Ἰησοῦ
  choice: ప్రభువైన యేసులో
  rationale: పౌలు వాడిన ἐν (‘లో’) అనే సంబంధాన్ని నిలిపి, κύριος ను యేసు బిరుదుగా స్పష్టంగా తెలుగులో అందిస్తుంది.
- source_word: ἀγάπην
  choice: ప్రేమ
  rationale: ἀγάπη కి ఆధునిక, స్పష్టమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: పరిశుద్ధులందరిపట్ల
  rationale: εἰς సూచించే ప్రేమ యొక్క దిశను ‘పట్ల’ ద్వారా సహజంగా వ్యక్తం చేస్తూ, πάντας అనే సమగ్రతను ‘అందరి’తో నిలిపింది.
- source_word: ἁγίους
  choice: పరిశుద్ధులు
  rationale: పౌలు విశ్వాసుల సమూహానికి వాడే ‘పవిత్రులు/ప్రతిష్ఠితులు’ అనే గుర్తింపును సంప్రదాయబద్ధమైనప్పటికీ సాధారణంగా అర్థమయ్యే పదంతో నిలిపింది.
theological_decisions:
- issue: πίστις పదంలోని విశ్వాసం, నమ్మకం, విశ్వసనీయత అనే భావసాధ్యతలు
  choice: విశ్వాసం
  alternative: నమ్మకం; కొన్ని సందర్భాల్లో విశ్వసనీయత
  rationale: ఇక్కడ ἐν τῷ κυρίῳ Ἰησοῦ అనే పదబంధం పాఠకులు యేసుపై ఉంచిన నమ్మకాన్ని ప్రధానంగా సూచిస్తుంది. అయినా పదంలోని విస్తృత భావపరిధిని పాదసూచికలో భద్రపరిచింది.
- issue: κύριος అనే క్రీస్తు బిరుదు
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ఈ సందర్భంలో κύριος యేసుకు గౌరవభరితమైన, దైవశాస్త్రపరంగా ప్రాముఖ్యమైన బిరుదు; ‘ప్రభువు’ దానిని బలహీనపరచకుండా అందిస్తుంది.
- issue: ἅγιοι ద్వారా విశ్వాసుల గుర్తింపు
  choice: పరిశుద్ధులు
  alternative: పవిత్రులు
  rationale: ఈ పదం తరువాతి కాలంలోని ప్రత్యేక అధికారిక గుర్తింపు పొందిన కొందరినే కాక, దేవునికి చెందిన విశ్వాసులందరినీ సూచిస్తుంది; ఆ సమూహార్థాన్ని ప్రధాన పదం నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. గ్రీకు వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున ఈ వచనాన్ని పూర్తి వాక్యంగా మార్చకుండా ‘నేను కూడా’ వద్ద కొనసాగింపుగా ఉంచాం. ‘ప్రభువైన యేసు’ తెలుగు సహజత్వాన్ని కాపాడుతూ κύριος అనే బిరుదును స్పష్టంగా నిలుపుతుంది.
