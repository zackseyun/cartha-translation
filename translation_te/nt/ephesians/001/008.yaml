  text: which he lavished on us in all wisdom and insight[b][a],
translation:
  language: te
  text: ఆయన ఆ కృపను సమస్త జ్ఞానంతోను వివేకంతోను మనపై సమృద్ధిగా కుమ్మరించాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆయన ఆ కృపను మనవైపు సమృద్ధిగా ప్రవహించేలా చేశాడు.”
    reason: lexical_alternative
  - marker: b
    text: “సమస్త జ్ఞానంతోను వివేకంతోను” అనే పదబంధం దేవుడు తన కృపను కుమ్మరించిన విధానాన్ని సూచించవచ్చు; లేదా ఆయన విశ్వాసులకు ఇచ్చిన కృపతో ముడిపడిన జ్ఞానాన్నీ వివేకాన్నీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: ఆ కృపను
  rationale: స్త్రీలింగ ఏకవచన సంబంధ సర్వనామం 7వ వచనంలోని ‘ఆయన కృపాసంపద’ను తిరిగి సూచిస్తుంది. తెలుగు వాక్యం స్వతంత్రంగా స్పష్టంగా ఉండేందుకు సూచిత నామమైన ‘కృప’ను వ్యక్తపరిచాం.
- source_word: ἐπερίσσευσεν
  choice: సమృద్ధిగా కుమ్మరించాడు
  rationale: 'ఇక్కడ క్రియకు కారణార్థక/సకర్మక భావం ఉంది: దేవుడు తన కృపను విశ్వాసులపై పొంగిపొర్లేంత సమృద్ధిగా ప్రసాదించాడు. ‘కుమ్మరించాడు’ సమృద్ధి రూపకాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.'
- source_word: εἰς ἡμᾶς
  choice: మనపై
  rationale: εἰς గ్రహీతల వైపు దిశను సూచిస్తుంది; ‘కుమ్మరించాడు’తో ‘మనపై’ సహజంగా జతకట్టి కృప మనకు ఉద్దేశించబడినదనే భావాన్ని నిలుపుతుంది.
- source_word: ἐν πάσῃ σοφίᾳ καὶ φρονήσει
  choice: సమస్త జ్ఞానవివేకాలతో
  rationale: ἐνకు ఇక్కడ ‘లో’ లేదా ‘తో’ అనే భావాలు సాధ్యమైనా, తెలుగులో ‘జ్ఞానవివేకాలతో’ అనే రూపం దేవుడు కృపను అనుగ్రహించిన విధానానికైనా, ఆ కృపతో ముడిపడిన వరాలకైనా అన్వయించగలంత తెరచి ఉంటుంది.
- source_word: σοφίᾳ
  choice: జ్ఞానం
  rationale: σοφίαకు పారదర్శకమైన సాధారణ తెలుగు సమానం.
- source_word: φρονήσει
  choice: వివేకం
  rationale: φρόνησιςలోని ఆచరణాత్మక అవగాహన, విచక్షణ భావాన్ని ‘జ్ఞానం’తో భేదిస్తూ సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ‘సమస్త జ్ఞానవివేకాలతో’ అనే పదబంధం దేనిని వివరిస్తుంది?
  choice: ఇది దేవుడు కృపను సమృద్ధిగా కుమ్మరించిన విధానాన్ని సూచిస్తుందా, లేక విశ్వాసులకు ఇచ్చిన కృపతో కూడిన జ్ఞానవివేకాలను సూచిస్తుందా అన్నది ప్రధాన పాఠంలో నిర్ణయించకుండా ఉంచబడింది.
  alternative: దీనిని దేవుని జ్ఞానవివేకాలకు మాత్రమే లేదా విశ్వాసులకు ఇవ్వబడిన జ్ఞానవివేకాలకు మాత్రమే స్పష్టంగా అన్వయించడం.
  rationale: గ్రీకు వాక్యనిర్మాణం రెండు అన్వయాలకు అవకాశం ఇస్తుంది. కాబట్టి నిజమైన వ్యాఖ్యాన సందిగ్ధతను పాఠం మరియు పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ἐπερίσσευσενలోని పొంగిపొర్లే సమృద్ధిని ‘సమృద్ధిగా కుమ్మరించాడు’ ద్వారా నిలిపి, చివరి పదబంధంలోని వ్యాకరణ-ధార్మిక సందిగ్ధతను పాదసూచికతో సంరక్షించాం.
