  terminology: “ముందుగానే నిర్ణయించి,” προορίσας యొక్క బలాన్ని అనవసర సిద్ధాంత వివరణ లేకుండా నిలుపుతుంది. “కుమారులుగా దత్తత” υἱοθεσίαలోని కుమారుని హోదాను కాపాడుతుంది. Χριστοῦకు “మెస్సీయ” అనే బిరుదు-అనువాదం కొనసాగించబడింది. εἰς αὐτόνకు ప్రధాన పాఠంలో “తనకోసం,” ప్రత్యామ్నాయంగా దిశార్థం పాదసూచికలో ఉంచబడింది.
