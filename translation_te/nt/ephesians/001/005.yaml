  source_fidelity: ప్రస్తుత అనువాదం προορίσας యొక్క ముందస్తు నిర్ణయ భావాన్ని, διὰ యొక్క సాధనార్థాన్ని, మరియు εἰς αὐτόν లోని ఉద్దేశ/దిశ సాధ్యతను మొత్తంగా కాపాడుతుంది. అయితే “మనలను ... దత్తత స్వీకరించాలని” అనే ప్రయోగంలో దత్తత స్వీకరించేది ఎవరో అస్పష్టంగా ఉండి, దేవుడు మనలను దత్తత తీసుకొనడం అనే మూలవాక్య భావం బలహీనమవుతుంది. దానిని స్పష్టం చేశాం.
