id: EPH.1.5
reference: Ephesians 1:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: προορίσας ἡμᾶς εἰς υἱοθεσίαν διὰ Ἰησοῦ Χριστοῦ εἰς αὐτόν, κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/005.yaml
  text: having predestined us for adoption through Jesus the Messiah to himself[a], according to the good pleasure of his will[c][b],
translation:
  language: te
  text: తన చిత్తపు సంతోషకరమైన ఉద్దేశం ప్రకారం, యేసు మెస్సీయ ద్వారా మనలను తనకోసం[c] కుమారులుగా దత్తత తీసుకోవడానికి[a] ఆయన ముందుగానే నిర్ణయించి,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుమారుల హోదాకు దత్తత తీసుకోవడానికి.” గ్రీకు పదం కుమారునిగా ఉంచబడే న్యాయపరమైన హోదాను, ముఖ్యంగా వారసత్వాన్ని, సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ముందుగానే నియమించి.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “తనవైపుకు.” గ్రీకు పదబంధం ఆయనవైపు దిశను లేదా ఆయన కోసం అనే ఉద్దేశాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προορίσας
  choice: ముందుగానే నిర్ణయించి
  rationale: προορίζωలోని ‘ముందుగా’ అనే కాలభావాన్ని స్పష్టంగా నిలుపుతూ, తెలుగు పాఠకులకు సహజంగా అర్థమయ్యేలా అనువదించబడింది. అసమాపక క్రియారూపం సందర్భంలోని దీర్ఘ వాక్యంతో సంబంధాన్ని కాపాడుతుంది.
- source_word: εἰς υἱοθεσίαν
  choice: కుమారులుగా దత్తత స్వీకరించాలని
  rationale: υἱοθεσίαలోని దత్తత భావంతో పాటు కుమారుని న్యాయపరమైన హోదా, వారసత్వ సూచన కూడా నిలిచేలా ‘కుమారులుగా’ ఉంచబడింది.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ ద్వారా
  rationale: జనిటివ్‌తో ఉన్న διά సాధనాన్ని లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది. Χριστόςను పేరులో భాగంగా కాక బిరుదుగా భావించి ‘మెస్సీయ’ అని అనువదించబడింది.
- source_word: εἰς αὐτόν
  choice: తన కోసం
  rationale: εἰς αὐτόν దేవుడే దత్తత యొక్క లక్ష్యం లేదా ఉద్దేశం అని సూచించగలదు. సహజమైన తెలుగులో ఆ ఉద్దేశార్థాన్ని ‘తన కోసం’ తెలియజేస్తుంది; ‘తనవైపుకు’ అనే దిశార్థం కూడా సాధ్యమే.
- source_word: κατὰ τὴν εὐδοκίαν τοῦ θελήματος αὐτοῦ
  choice: తన చిత్తానికి ఇష్టమైనదాని ప్రకారం
  rationale: κατάలోని ‘అనుగుణంగా’ అనే భావాన్ని, εὐδοκίαలోని సంతోషకరమైన ఇష్టం లేదా అనుకూల సంకల్పాన్ని, θέλημαలోని చిత్తాన్ని అతివ్యాఖ్యానం చేయకుండా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రకటిత నిర్ణయం సందర్భంలో προορίσας అనువాదం
  choice: ముందుగానే నిర్ణయించి
  alternative: ముందుగానే నియమించి
  rationale: మూలపదంలోని ముందస్తు నిర్ణయ భావాన్ని తగ్గించకుండా ఉంచుతుంది; అయితే ఆ నిర్ణయం ఎలా పనిచేస్తుందనే ఏ ప్రత్యేక సిద్ధాంత వ్యవస్థనూ వాక్యంలోకి చేర్చదు.
- issue: υἱοθεσίαలోని లింగసూచక, న్యాయపరమైన భావం
  choice: కుమారులుగా దత్తత స్వీకరించాలని
  alternative: దత్తత స్వీకరించాలని
  rationale: గ్రీకు పదంలో ఉన్న కుమారుని హోదా, వారసత్వ భావాన్ని నిలుపుతుంది. ఇది వర్తింపును కేవలం పురుషులకు పరిమితం చేస్తుందని పాఠ్యం చెప్పదు.
- issue: Χριστοῦ అనే బిరుదు
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ అభిషిక్తుడైన మెస్సీయను సూచించే బిరుదు; అందువల్ల దాని అర్థాన్ని అనువదించడం సముచితం.
- issue: εἰς αὐτόν యొక్క దిశ లేదా ఉద్దేశ భావం
  choice: తన కోసం
  alternative: తనవైపుకు
  rationale: సందర్భంలో ఉద్దేశార్థం సహజంగా ఉన్నప్పటికీ, గ్రీకు పదబంధం దిశార్థాన్నీ అనుమతిస్తుంది; అందుకే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి అస్పష్టతను కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను కాపాడే శైలి. ఈ వచనం గ్రీకులో ముందున్న ప్రధాన వాక్యానికి అనుసంధానమైన అసమాపక క్రియారూపంతో ఉంది; అందుకే తెలుగులోనూ ‘నిర్ణయించి’ అని ముగించి వాక్యప్రవాహాన్ని నిలిపాం. ‘కుమారులుగా’ అనే పదం మూలంలోని హోదా-వారసత్వ భావాన్ని ఉద్దేశపూర్వకంగా కాపాడుతుంది.
