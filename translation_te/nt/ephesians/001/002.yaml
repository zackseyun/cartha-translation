id: EPH.1.2
reference: Ephesians 1:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: te
  text: మన తండ్రియైన దేవుని నుండి, ప్రభువైన యేసు మెస్సీయ[a][b] నుండి మీకు కృప, శాంతి కలుగుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: ‘యేసు క్రీస్తు.’ గ్రీకు Χριστός (క్రిస్టోస్) ‘మెస్సీయ’ అనే బిరుదుగానూ, కొన్ని సందర్భాల్లో పేరులాంటి ‘క్రీస్తు’ రూపంగానూ పనిచేయగలదు.'
    reason: alternative_reading
  - marker: b
    text: 'మునుపటి అనువాద రూపం: ‘ప్రభువైన యేసు క్రీస్తు.’'
    reason: previous_rendering
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పౌలు శుభాభివందనంలో ఈ పదానికి సాధారణ పలకరింపు భావంతోపాటు దేవుని అనుగ్రహం అనే బలమైన భావం ఉంది; ‘కృప’ రెండింటినీ సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ὑμῖν
  choice: మీకు
  rationale: దీవెన లేదా శుభాభివందనం అందుకునేవారిని సూచించే దత్తి విభక్తికి సహజమైన తెలుగు రూపం.
- source_word: εἰρήνη
  choice: శాంతి
  rationale: సాధారణ ప్రశాంతత భావాన్నీ, యూదుల ‘షాలోమ్’ నేపథ్యంలోని సంపూర్ణ క్షేమ భావాన్నీ తెరిచి ఉంచే ప్రామాణిక పదం.
- source_word: ἀπὸ
  choice: నుంచీ
  rationale: కృప, శాంతి ఎక్కడి నుంచి వస్తాయో సూచిస్తుంది; రెండు సమన్విత మూలాల దగ్గర పునరుక్తి చేయడం తెలుగులో సంబంధాన్ని స్పష్టం చేస్తుంది.
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: మన తండ్రియైన దేవుడు
  rationale: గ్రీకు పదబంధాన్ని ‘మన తండ్రి అయిన దేవుడు’ అనే అన్వయంగా తీసుకుంటుంది; గ్రీకులో లేని ‘మరియు’ను చేర్చి ‘మన దేవుడు మరియు తండ్రి’గా మార్చదు.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: యేసుకు వర్తించే గౌరవపూర్వక క్రీస్తు సంబంధ బిరుదు బలాన్ని నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Ἰησοῦను పేరుగా, Χριστοῦను అభిషిక్త రాజును సూచించే బిరుదుగా అందిస్తుంది; తెలుగులో ‘మెస్సీయ’ ఆ బిరుదు యొక్క యూద నేపథ్యాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦలో Χριστοῦను ఎలా అందించాలి
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: Χριστός ఇక్కడ పేరులాంటి రూపంగా వినిపించగలిగినా, ‘మెస్సీయ’ అని అనువదించడం దాని బిరుదు భావాన్ని పాఠకునికి తెలియజేస్తుంది. స్థిరపడిన ‘క్రీస్తు’ రూపాన్ని పాదటిప్పణిలో ఉంచి గ్రీకు పదంలోని నిజమైన ద్వంద్వ వినియోగాన్ని కాపాడుతుంది.
- issue: ఒకే ἀπὸ పదం దేవునికీ ప్రభువైన యేసుకీ సంబంధించిన విధానం
  choice: తెలుగులో రెండు చోట్ల ‘నుంచీ’ అని స్పష్టం చేయడం
  alternative: ‘మన తండ్రియైన దేవుని నుంచీ, ప్రభువైన యేసు మెస్సీయ నుంచీ’ అనే రెండో విభక్తి సూచన లేకుండా మరింత అక్షరానుసార నిర్మాణం
  rationale: గ్రీకులో ఒకే ἀπὸ రెండు సమన్విత నామపదబంధాలను పరిపాలిస్తుంది. తెలుగులో విభక్తి సూచనను పునరుక్తి చేయడం అర్థాన్ని మార్చకుండా మూల సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సంఘ పఠనానికి తగిన గౌరవపూర్వక దీవెన శైలిని ఉపయోగించాం. ‘కలుగుగాక’ శుభాభివందనంలోని అంతర్లీన ఆశీర్వాద భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; మూలంలో స్పష్టంగా లేని క్రియను అర్థపూరణ కోసం మాత్రమే అందిస్తుంది.
