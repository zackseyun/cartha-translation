id: EPH.1.10
reference: Ephesians 1:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς οἰκονομίαν τοῦ πληρώματος τῶν καιρῶν, ἀνακεφαλαιώσασθαι τὰ πάντα ἐν τῷ Χριστῷ, τὰ ἐπὶ τοῖς οὐρανοῖς καὶ τὰ ἐπὶ τῆς γῆς· ἐν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/010.yaml
  text: for the administration of the fullness of the times[a], to sum up all things in the Messiah—the things in the heavens and the things on the earth—in him,
translation:
  language: te
  text: కాలాలు పరిపూర్ణతకు చేరినప్పుడు అమలయ్యే నిర్వహణ కోసం, సమస్తాన్నీ మెస్సీయలో సమగ్రంగా సమకూర్చడానికి—పరలోకాలలో ఉన్నవాటినీ భూమిమీద ఉన్నవాటినీ—ఆయనలో,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἰκονομίαν
  choice: నిర్వహణ
  rationale: ఈ పదం నిర్వహణ, పరిపాలన, లేదా ఒక ఏర్పాటును అమలు చేయడాన్ని సూచించగలదు. ఇక్కడ దేవుని ఉద్దేశం క్రమబద్ధంగా అమలవుతుందనే భావాన్ని ‘నిర్వహణ’ సహజంగా నిలుపుతుంది.
- source_word: πληρώματος τῶν καιρῶν
  choice: కాలాలు పరిపూర్ణమైనప్పుడు
  rationale: పదబంధంలోని ‘కాలాల పరిపూర్ణత’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, నియమిత కాలాలు తమ నిండుదలకు చేరే అర్థాన్ని నిలుపుతుంది.
- source_word: ἀνακεφαλαιώσασθαι
  choice: సమగ్రంగా సమకూర్చడానికి
  rationale: క్రియలో ఉన్న సమస్తాన్ని ఒక సమగ్రతలో చేర్చడం లేదా ఒక శిరస్సు కిందకు తేవడం అనే భావవ్యాప్తిని ప్రధాన పాఠంలో అతిగా సిద్ధాంతీకరించకుండా అందిస్తుంది; శిరస్సు భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: τὰ πάντα
  choice: సమస్తాన్నీ
  rationale: సృష్టి అంతటినీ ఆవరించే సమగ్ర పరిధిని సంక్షిప్తంగా, గంభీరంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున ‘మెస్సీయ’ మూలార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τὰ ἐπὶ τοῖς οὐρανοῖς
  choice: పరలోకాలలో ఉన్నవాటినీ
  rationale: గ్రీకు బహువచనమైన οὐρανοῖςను, దాని స్థానార్థాన్ని నిలుపుతుంది.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: భూమిమీద ఉన్నవాటినీ
  rationale: పరలోకాలతో ఉన్న స్థానసంబంధ వ్యత్యాసాన్ని పారదర్శకంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν αὐτῷ
  choice: ఆయనలోనే
  rationale: సర్వనామం మెస్సీయను తిరిగి సూచిస్తుంది. తెలుగు వాక్యంలో చివరి పునరుక్తి తెచ్చే ఉద్ఘాటనను ‘నే’ నిలుపుతుంది; ఇది ‘ఆయనలో మాత్రమే’ అనే అదనపు నిరాకరణ భావాన్ని జోడించదు.
theological_decisions:
- issue: Χριστῷ పదాన్ని ఎలా అనువదించాలి
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: ఈ సందర్భంలో Χριστός వ్యక్తిపేరుకన్నా అభిషిక్తుడనే బిరుదుగా పనిచేస్తుంది; అందువల్ల ‘మెస్సీయ’ మూలపదంలోని బిరుదు భావాన్ని కాపాడుతుంది.
- issue: ἀνακεφαλαιώσασθαι క్రియ యొక్క భావం
  choice: సమస్తాన్నీ సమగ్రంగా సమకూర్చడానికి
  alternative: సమస్తాన్నీ మెస్సీయ అనే ఒకే శిరస్సు కింద సమకూర్చడానికి
  rationale: గ్రీకు క్రియ ‘సంక్షిప్తంగా సమగ్రపరచడం’ మరియు ‘ఒక శిరస్సు కింద సమకూర్చడం’ అనే రెండింటి వైపు సూచించగలదు. ప్రధాన పాఠం విస్తృత భావాన్ని నిలుపుతుంది; శిరస్సు-సంబంధిత భావాన్ని పాదసూచికలో సంరక్షిస్తుంది.
- issue: τοῦ πληρώματος τῶν καιρῶν నిర్మాణం
  choice: కాలాలు పరిపూర్ణమైనప్పుడు
  alternative: కాలాల పరిపూర్ణతకు సంబంధించిన
  rationale: కాలాలు తమ నియమిత నిండుదలకు చేరే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘ముగింపు’గా మాత్రమే కుదించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలిని వాడాం. ఇది గ్రీకు వాక్యంలోని కొనసాగుతున్న వాక్యనిర్మాణ భాగం కావడంతో చివర కామాను నిలిపాం. మధ్య గీతలు ఉద్దేశాన్ని మరియు దాని వివరణను స్పష్టంగా వేరు చేస్తాయి.
