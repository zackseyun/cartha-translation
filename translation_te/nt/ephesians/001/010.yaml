revisions:
- from: కాలాలు పరిపూర్ణమైనప్పుడు అమలయ్యే నిర్వహణ కోసం—పరలోకాలలో ఉన్నవాటినీ భూమిమీద ఉన్నవాటినీ, సమస్తాన్నీ మెస్సీయలో సమగ్రంగా సమకూర్చడానికి[a]—ఆయనలోనే,
  to: కాలాలు పరిపూర్ణతకు చేరినప్పుడు అమలయ్యే నిర్వహణ కోసం, సమస్తాన్నీ మెస్సీయలో సమగ్రంగా సమకూర్చడానికి—పరలోకాలలో ఉన్నవాటినీ భూమిమీద ఉన్నవాటినీ—ఆయనలో,
