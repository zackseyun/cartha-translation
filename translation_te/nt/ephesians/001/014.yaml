reference: Ephesians 1:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ὅ ἐστιν ἀρραβὼν τῆς κληρονομίας ἡμῶν, εἰς ἀπολύτρωσιν τῆς περιποιήσεως, εἰς ἔπαινον τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/014.yaml
  text: who is the down payment of our inheritance, toward the redemption of the possession, to the praise of his glory.
translation:
  language: te
  text: ఆయనే మన వారసత్వానికి ముందస్తు చెల్లింపుగా ఉన్నాడు; స్వాస్థ్యపు విమోచనం కోసం, ఆయన మహిమకు స్తుతి కలగడానికి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“స్వాస్థ్యం” (గ్రీకు: περιποίησις) ఇక్కడ దేవుని స్వంత ప్రజలను సూచించవచ్చు; అందువల్ల “దేవుడు తన సొంతంగా చేసుకున్న ప్రజల విమోచనం” అని కూడా అర్థం చేసుకోవచ్చు. దీనిని స్వాస్థ్యం/సొత్తు అనే అర్థంలోనూ తీసుకోవచ్చు.'
    reason: τῆς περιποιήσεως యొక్క సూచనలో ఉన్న నిజమైన అర్థసాధ్యతను నమోదు చేస్తూ, ప్రధాన పాఠంలోని సంక్షిప్త పదప్రయోగాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: ὅ
  choice: ఆయనే
  rationale: ముందటి వచనంలోని వాగ్దానం చేయబడిన పరిశుద్ధాత్మను సూచించే సంబంధ సర్వనామం; తెలుగులో సహజంగా వ్యక్తిగత సూచనను నిలుపుతుంది.
- source_word: ἀρραβών
  choice: ముందస్తు హామీ
  rationale: తరువాత పూర్తిగా లభించబోయేదానికి తొలి భాగంగానూ దాని నిశ్చయతకు పూచీగానూ ఉండే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: κληρονομία
  choice: వారసత్వం
  rationale: దేవుని ప్రజలకు వాగ్దానం చేయబడిన భవిష్యత్ స్వాస్థ్యాన్ని సూచించే పౌలు పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: ἀπολύτρωσις
  choice: సంపూర్ణ విమోచన
  rationale: విడిపించడం/విమోచించడం అనే మూలభావాన్ని ఇస్తూ, ఇక్కడ భవిష్యత్ పరిపూర్ణత వైపు ఉన్న దిశను సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: περιποίησις
  choice: దేవుడు తన సొత్తుగా చేసుకున్నవారు
  rationale: ఈ సందర్భంలో దేవునికి చెందిన ప్రజలు అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; అయితే గ్రీకు పదబంధంలో ఉన్న వ్యాకరణ సంబంధానికి మరో అర్థసాధ్యత ఉందని పాదటీపు తెలియజేస్తుంది.
- source_word: εἰς ἔπαινον τῆς δόξης αὐτοῦ
  choice: ఆయన మహిమకు స్తుతి కలిగేలా
  rationale: లక్ష్యం/ఫలితం అనే εἰς భావాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
theological_decisions:
- issue: τῆς περιποιήσεως యొక్క సూచన
  choice: దేవుడు తన సొత్తుగా చేసుకున్నవారు
  alternative: మనకు చెందిన స్వాస్థ్యం/సొత్తు
  rationale: పాత నిబంధన నేపథ్యం మరియు ఎఫెసీయుల పత్రికలో దేవుని ప్రజల భావానికి అనుగుణంగా ప్రధాన పాఠంలో ప్రజలను సూచించే అర్థాన్ని ఎంచుకున్నాం; నిజమైన పదార్థ అస్పష్టతను పాదటీపులో నిలిపాం.
- issue: మొదటి εἰς యొక్క సంబంధం
  choice: సంపూర్ణ విమోచన కలిగే వరకు
  alternative: సంపూర్ణ విమోచన వైపు/నిమిత్తం
  rationale: ఆత్మ వారసత్వపు హామీగా ఉండటం భవిష్యత్ విమోచన పరిపూర్ణత వైపు సాగుతుందనే భావాన్ని తెలుగులో సహజంగా తెలిపింది; లక్ష్యార్థాన్ని పూర్తిగా తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. దీర్ఘ గ్రీకు వాక్య సంబంధాన్ని స్పష్టంచేయడానికి చివరి భాగాన్ని సహజ తెలుగు ఉపవాక్యంగా విస్తరించాం.
