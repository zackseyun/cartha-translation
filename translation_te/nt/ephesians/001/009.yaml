id: EPH.1.9
reference: Ephesians 1:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: γνωρίσας ἡμῖν τὸ μυστήριον τοῦ θελήματος αὐτοῦ, κατὰ τὴν εὐδοκίαν αὐτοῦ ἣν προέθετο ἐν αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/009.yaml
  text: having made known to us the mystery of his will[a], according to his good pleasure, which he purposed in himself
translation:
  language: te
  text: తన చిత్తపు మర్మాన్ని మనకు తెలియజేసి, ఆయనలో[a] తాను ఉద్దేశించిన తన ఇష్టసంకల్పం ప్రకారం—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తులో’; కొందరు ‘ఆయనలో’ను ప్రతిబింబార్థకంగా, ‘తనలో తానే’ అని అర్థం చేసుకుంటారు.
    reason: ἐν αὐτῷ అనే పదబంధంలోని సర్వనామం ఎవరిని సూచిస్తుందో స్పష్టంగా లేకపోవడం.
lexical_decisions:
- source_word: γνωρίσας
  choice: తెలియజేసి
  rationale: భూతకాల క్రియావిశేషణ రూపాన్ని సహజమైన తెలుగులో నిలుపుతూ, చుట్టుపక్కల వాక్యంలోని దేవుణ్ణి సూచించే కర్తతో అనుసంధానిస్తుంది.
- source_word: ἡμῖν
  choice: మనకు
  rationale: γνωρίζω క్రియకు పరోక్ష కర్మను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μυστήριον
  choice: మర్మం
  rationale: ఒకప్పుడు మరుగై ఉండి ఇప్పుడు తెలియజేయబడిన దైవ సంకల్పం అనే పౌలు వాడుకలోని భావాన్ని ‘మర్మం’ నిలుపుతుంది; ‘రహస్యం’ కేవలం గోప్యతను ఎక్కువగా సూచించవచ్చు.
- source_word: θέλημα
  choice: చిత్తం
  rationale: దేవుని సంకల్పపూర్వకమైన ఇష్టాన్ని గౌరవప్రదమైన, స్థిరమైన తెలుగు బైబిలు పదంతో వ్యక్తం చేస్తుంది; తరువాతి προέθετο భావంతో కలిపివేయదు.
- source_word: κατὰ
  choice: ప్రకారం
  rationale: అనుగుణత లేదా ప్రమాణాన్ని సూచించే κατά + ద్వితీయా విభక్తి భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: εὐδοκίαν
  choice: సంతోషకరమైన సంకల్పం
  rationale: εὐδοκίαలోని ఇష్టం, ఆనందం, సంకల్పం అనే భావాలను సహజమైన తెలుగులో కలిపి వ్యక్తం చేస్తుంది; కేవలం ‘సంతోషం’ అని అనువదిస్తే ఉద్దేశపూర్వకత తగ్గిపోతుంది.
- source_word: προέθετο
  choice: ఉద్దేశించిన
  rationale: ఇక్కడ మధ్యమ రూపం తనలో ఉద్దేశించుకోవడం లేదా సంకల్పించుకోవడం అనే భావాన్ని ఇస్తుంది. ‘ముందుగా నిర్ణయించిన’ అనేది కాలపూర్వకతను అవసరానికి మించి స్పష్టీకరించవచ్చు.
- source_word: ἐν αὐτῷ
  choice: ఆయనలో
  rationale: గ్రీకు సర్వనామాన్ని పారదర్శకంగా నిలుపుతూ, అది క్రీస్తునా లేక దేవుణ్ణి ప్రతిబింబార్థకంగా సూచిస్తుందా అనే సందిగ్ధతను ప్రధాన పాఠంలో పరిష్కరించదు.
theological_decisions:
- issue: ἐν αὐτῷ సూచించే వ్యక్తి
  choice: ప్రధాన పాఠంలో ‘ఆయనలో’ అని సర్వనామాన్నే నిలుపడం
  alternative: ‘క్రీస్తులో’ లేదా ‘తనలో తానే’
  rationale: సమీప సందర్భం క్రీస్తును సూచించవచ్చు; అయితే కొందరు దీనిని దేవుణ్ణి సూచించే ప్రతిబింబార్థక ప్రయోగంగా గ్రహిస్తారు. మూలంలోని నిజమైన సందిగ్ధతను ప్రధాన పాఠంలో నిలిపి, ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. గ్రీకు వాక్యంలోని క్రియావిశేషణ సంబంధాన్ని ‘తెలియజేసి’తో నిలిపి, తెలుగు వాక్యం స్వతంత్రంగా చదవడానికి చివర ‘ఆయన ఇలా చేశాడు’ అని పూరించబడింది. ‘ఆయనలో’ కొంత అసాధారణంగా వినిపించినా, వ్యాఖ్యానపరమైన సందిగ్ధతను ఉద్దేశపూర్వకంగా నిలుపుతుంది.
