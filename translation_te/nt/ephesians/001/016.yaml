  yaml_path: translation/nt/ephesians/001/016.yaml
  text: I do not cease giving thanks for you[a], making mention of you in my prayers,
translation:
  language: te
  text: మీ కోసం కృతజ్ఞతలు చెల్లించడం మానకుండా, నా ప్రార్థనల్లో మిమ్మల్ని జ్ఞాపకం చేసుకుంటున్నాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ παύομαι
  choice: మానకుండా
  rationale: వర్తమాన కాలంలోని నిరంతర క్రియను తెలుగులో సహజంగా తెలియజేస్తుంది; ‘ఆపకుండా’ కంటే ఈ సందర్భంలో ‘మానకుండా’ గౌరవప్రదంగానూ సహజంగానూ ఉంది.
- source_word: εὐχαριστῶν
  choice: కృతజ్ఞతలు చెల్లించడం
  rationale: దేవునికి కృతజ్ఞత తెలియజేసే భావాన్ని స్పష్టంగా ఉంచుతుంది; ప్రధాన క్రియతో సమకాలీనంగా కొనసాగుతున్న చర్యను వ్యక్తం చేస్తుంది.
- source_word: ὑπὲρ ὑμῶν
  choice: మీ కోసం
  rationale: కృతజ్ఞత సందర్భంలో ὑπέρ + షష్ఠీ విభక్తి, ఎవరి నిమిత్తం కృతజ్ఞతలు చెల్లిస్తున్నాడో సూచిస్తుంది.
- source_word: μνείαν ποιούμενος
  choice: మిమ్మల్ని జ్ఞాపకం చేసుకుంటున్నాను
  rationale: గ్రీకు నుడికారం అక్షరార్థంగా ‘ప్రస్తావన చేయడం’ అయినప్పటికీ, ప్రార్థన సందర్భంలో ‘జ్ఞాపకం చేసుకోవడం’ ఆధునిక తెలుగులో సహజంగా దాని భావాన్ని అందిస్తుంది.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: నా ప్రార్థనల్లో
  rationale: ఆ జ్ఞాపకం జరిగే సందర్భం లేదా పరిధిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions: []
