id: EPH.1.13
reference: Ephesians 1:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ᾧ καὶ ὑμεῖς ἀκούσαντες τὸν λόγον τῆς ἀληθείας, τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν, ἐν ᾧ καὶ πιστεύσαντες ἐσφραγίσθητε τῷ πνεύματι τῆς ἐπαγγελίας τῷ ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/013.yaml
  text: In him[a], you also, after hearing the word of truth, the good news of your salvation, in him, and after believing, were sealed with the Holy Spirit of promise[d][c][b],
translation:
  language: te
  text: క్రీస్తులో[a] మీరు కూడా సత్య సందేశాన్ని—అంటే మీ రక్షణ గురించిన శుభవార్తను[b]—విని, ఆయనలో విశ్వసించిన తరువాత, వాగ్దానం చేయబడిన పరిశుద్ధాత్మతో[c] ముద్రించబడ్డారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎవరిలో.’ మూలంలోని సంబంధవాచక సర్వనామం ముందున్న క్రీస్తును సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘శుభవార్త’కు సంప్రదాయ పదం ‘సువార్త.’
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, ‘వాగ్దానపు పరిశుద్ధాత్మ’; అంటే దేవుడు వాగ్దానం చేసిన పరిశుద్ధాత్మ లేదా వాగ్దానంతో సంబంధమున్న పరిశుద్ధాత్మ.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐν ᾧ
  choice: క్రీస్తులోనే / ఆయనలో
  rationale: సంబంధవాచక సర్వనామం ముందున్న క్రీస్తును సూచిస్తుంది. మొదటి సందర్భంలో సూచిత నామాన్ని స్పష్టం చేసి, రెండవ సందర్భంలో ‘ఆయనలో’ అని అనువదించడం ద్వారా మూలంలోని పునరుక్తిని, క్రీస్తుతో ఐక్యత భావాన్ని నిలిపాం.
- source_word: καὶ ὑμεῖς
  choice: మీరు కూడా
  rationale: మునుపటి వచనాల్లోని ‘మేము’తో పాటు పాఠకులూ చేర్చబడ్డారనే అదనపు ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἀκούσαντες
  choice: విని
  rationale: ప్రధాన క్రియకు ముందు జరిగిన చర్యగా సహజమైన తెలుగు క్రియారూపం; తదుపరి ‘విశ్వసించిన తరువాత’తో కలిసి క్రమాన్ని తెలియజేస్తుంది, కానీ సిద్ధాంతపరమైన కాలక్రమాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: τὸν λόγον τῆς ἀληθείας
  choice: సత్య సందేశాన్ని
  rationale: λόγος ఇక్కడ ప్రకటించబడిన మాట లేదా సందేశాన్ని సూచిస్తుంది. ‘సత్య సందేశం’ ఆధునిక తెలుగులో సహజంగా, స్పష్టంగా ఉంది.
- source_word: τὸ εὐαγγέλιον τῆς σωτηρίας ὑμῶν
  choice: మీ రక్షణ గురించిన శుభవార్తను
  rationale: ముందున్న ‘సత్య సందేశం’కి వివరణగా ఉన్న అనుప్రయోగాన్ని డాష్‌లతో చూపించాం. జనిటివ్ రక్షణను గురించి తెలియజేసే లేదా రక్షణను అందించే శుభవార్త అనే విస్తృతిని అనవసరంగా కుదించదు.
- source_word: πιστεύσαντες
  choice: విశ్వసించిన తరువాత
  rationale: అయోరిస్ట్ కృదంతానికి ప్రధాన క్రియకు పూర్వకాలిక భావం సహజమైనది. ‘తరువాత’ క్రమాన్ని స్పష్టం చేస్తుంది; అయితే విశ్వాసం మరియు ముద్రింపుకు మధ్య వ్యవధి ఉందని చెప్పదు.
- source_word: ἐσφραγίσθητε
  choice: ముద్రించబడ్డారు
  rationale: దేవునిచేత గుర్తించబడటం, యాజమాన్యం లేదా ప్రామాణికత పొందటం అనే ముద్ర రూపకాన్ని యథాతథంగా నిలుపుతుంది; కర్మణి రూపాన్నీ కాపాడుతుంది.
- source_word: τῷ πνεύματι
  choice: పరిశుద్ధాత్మతో
  rationale: దత్తి విభక్తి సాధనార్థకంగా లేదా సహచర్యార్థకంగా ఉండవచ్చు. ‘తో’ ముద్ర రూపకానికి సహజంగా సరిపోతూ, ‘ద్వారా’ అనే ఒక్క విశ్లేషణకే పరిమితం చేయదు.
- source_word: τῆς ἐπαγγελίας τῷ ἁγίῳ
  choice: వాగ్దానం చేయబడిన పరిశుద్ధాత్మతో
  rationale: గ్రీకు పదక్రమంలోని సంక్షిప్త ‘వాగ్దానపు ఆత్మ, పరిశుద్ధుడు’ అనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది. దేవుడు వాగ్దానం చేసిన పరిశుద్ధాత్మ అనే ప్రధాన భావాన్ని ఇస్తూ, మూలంలోని జనిటివ్ నిర్మాణాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: వినడం, విశ్వసించడం, ముద్రించబడడం మధ్య సంబంధం
  choice: ‘విని, ఆయనలో విశ్వసించిన తరువాత ... ముద్రించబడ్డారు’
  alternative: ‘విన్నప్పుడు, ఆయనలో విశ్వసించినప్పుడు ... ముద్రించబడ్డారు’
  rationale: ప్రధాన క్రియకు ముందు ఉన్న అయోరిస్ట్ కృదంతాలు పూర్వ చర్యను సహజంగా సూచిస్తాయి. ఈ అనువాదం క్రమాన్ని నిలుపుతుంది గాని, ఆత్మ స్వీకరణ సమయంపై ఏ సంప్రదాయానికీ ప్రత్యేకమైన సిద్ధాంతాన్ని జోడించదు.
- issue: ‘వాగ్దానపు ఆత్మ’ అనే జనిటివ్ భావం
  choice: ‘వాగ్దానం చేయబడిన పరిశుద్ధాత్మ’
  alternative: ‘వాగ్దానపు పరిశుద్ధాత్మ’ లేదా ‘వాగ్దానంతో సంబంధమున్న పరిశుద్ధాత్మ’
  rationale: గ్రీకు నిర్మాణం సంక్షిప్తంగా ఉండి, వాగ్దానం చేయబడిన ఆత్మను లేదా వాగ్దానంతో ప్రత్యేక సంబంధమున్న ఆత్మను సూచించవచ్చు. ప్రధాన పాఠం అత్యంత సహజమైన భావాన్ని ఇస్తుంది; ప్రత్యామ్నాయం పాదసూచికలో నిలుపబడింది.
- issue: ἐν ᾧ రెండవ సందర్భపు అన్వయం
  choice: ‘ఆయనలో విశ్వసించిన తరువాత’
  alternative: ‘ఆయనలో ఉండి, విశ్వసించిన తరువాత’
  rationale: తెలుగులో ఈ పదబంధాన్ని ‘విశ్వసించడం’తో కలపడం సహజం, అలాగే క్రీస్తే విశ్వాసపు వ్యక్తి అని సందర్భం సూచిస్తుంది. అయినప్పటికీ మొదటి ‘క్రీస్తులోనే’ ద్వారా పౌలు చెప్పే క్రీస్తులోని స్థితి భావం కూడా నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. ‘సత్య సందేశం’, ‘శుభవార్త’ సాధారణ పాఠకులకు సులభంగా అర్థమవుతాయి; ‘ముద్రించబడ్డారు’ అనే మూల రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది. డాష్‌లు ‘శుభవార్త’ అనేది ‘సత్య సందేశం’కి వివరణ అని స్పష్టం చేస్తాయి.
