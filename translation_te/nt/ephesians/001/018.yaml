  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πεφωτισμένους τοὺς ὀφθαλμοὺς τῆς καρδίας ὑμῶν εἰς τὸ εἰδέναι ὑμᾶς τίς ἐστιν ἡ ἐλπὶς τῆς κλήσεως αὐτοῦ, ⸀τίς ὁ πλοῦτος τῆς δόξης τῆς κληρονομίας αὐτοῦ ἐν τοῖς ἁγίοις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/018.yaml
  text: having the eyes of your heart enlightened[a], so that you may know what is the hope of his calling, what is the wealth of the glory of his inheritance among the saints[b],
translation:
  language: te
  text: మీ హృదయపు కన్నులు వెలిగించబడి, ఆయన పిలుపు యొక్క నిరీక్షణ ఏమిటో, పరిశుద్ధుల మధ్య[a] ఆయన స్వాస్థ్య మహిమ యొక్క ఐశ్వర్యం ఎంతటిదో మీరు తెలుసుకొనుటకు,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరిశుద్ధులలో ఆయన స్వాస్థ్య మహిమ యొక్క ఐశ్వర్యం.” “ఆయన స్వాస్థ్యం” అనేది ఆయనకు చెందిన స్వాస్థ్యాన్ని లేదా ఆయన ఇచ్చే స్వాస్థ్యాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πεφωτισμένους
  choice: వెలుగొందినవిగా ఉండి
  rationale: పరిపూర్ణ కర్మణి కృదంతంలోని గతంలో జరిగిన కార్యం వల్ల కొనసాగుతున్న ఫలిత స్థితిని, అలాగే కర్మణి భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὀφθαλμοὺς τῆς καρδίας ὑμῶν
  choice: మీ హృదయ నేత్రాలు
  rationale: పౌలు ఉపయోగించిన రూపకాన్ని ‘మనస్సు’ లేదా ‘అవగాహన’గా సరళీకరించకుండా నిలుపుతుంది.
- source_word: εἰς τὸ εἰδέναι ὑμᾶς
  choice: మీరు తెలుసుకోవాలని
  rationale: గ్రీకు ఉద్దేశార్థక నిర్మాణాన్ని సహజమైన తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది; సందర్భంలోని ప్రార్థనా క్రియతో అనుసంధానిస్తుంది.
- source_word: ἐλπὶς
  choice: నిరీక్షణ
  rationale: నమ్మకంతో ఎదురుచూడటాన్ని సూచించే పౌలు వాడుకకు తగిన ప్రామాణిక బైబిలు పదం.
- source_word: κλήσεως αὐτοῦ
  choice: ఆయన పిలుపువల్ల కలిగే
  rationale: ‘ఆయన పిలుపు యొక్క నిరీక్షణ’ అనే అసహజ నిర్మాణాన్ని నివారిస్తూ, పిలుపుతో సంబంధమున్న నిరీక్షణ అనే భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: πλοῦτος
  choice: ఐశ్వర్యం
  rationale: సమృద్ధి, అపార విలువ అనే భావాలను గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: δόξης
  choice: మహిమ
  rationale: దైవిక వైభవం, ఘనత అనే వేదాంత ప్రతిధ్వనిని నిలిపే ప్రామాణిక అనువాదం.
- source_word: κληρονομίας αὐτοῦ
  choice: ఆయన స్వాస్థ్యం
  rationale: ఇది దేవునికి చెందిన స్వాస్థ్యమా లేక ఆయన ఇచ్చే స్వాస్థ్యమా అనే గ్రీకు షష్ఠీ విభక్తి సందిగ్ధతను సాధ్యమైనంతవరకు తెరిచి ఉంచుతుంది.
- source_word: ἐν τοῖς ἁγίοις
  choice: పరిశుద్ధుల మధ్య
  rationale: ἐν పదానికి సందర్భానుసారంగా సాధ్యమైన ‘మధ్య’ భావాన్ని సహజంగా అందిస్తుంది; ‘పరిశుద్ధులు’ అనే పౌలు పదజాలాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘పరిశుద్ధులలో/మధ్య ఆయన స్వాస్థ్యం’ అనేది దేవుడు తన ప్రజలను స్వాస్థ్యంగా పొందడాన్నా, లేక విశ్వాసులకు ఆయన ఇచ్చే స్వాస్థ్యాన్నా సూచిస్తుంది?
  choice: పరిశుద్ధుల మధ్య ఆయన స్వాస్థ్యం
  alternative: పరిశుద్ధులలో ఆయన స్వాస్థ్యం; పరిశుద్ధులకు ఆయన ఇచ్చే స్వాస్థ్యం
  rationale: గ్రీకు షష్ఠీ విభక్తి మరియు ἐν అనే విభక్త్యర్థక పదబంధం ఒకే వ్యాఖ్యానాన్ని బలవంతం చేయవు. ప్రధాన పాఠం సంబంధాన్ని నిర్దిష్టంగా తేల్చకుండా వేదాంత ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక, గౌరవప్రదమైన తెలుగు. ‘హృదయ నేత్రాలు’ అనే మూల రూపకాన్నీ, ‘పరిశుద్ధులు,’ ‘నిరీక్షణ,’ ‘మహిమ,’ ‘స్వాస్థ్యం’ వంటి పౌలు వేదాంత పదజాలాన్నీ నిలిపింది. ఈ భాగం ముందరి వాక్యంపై ఆధారపడిన కృదంత నిర్మాణం కావడంతో, తెలుగులో సంపూర్ణ వాక్యంగా చదవడానికి సందర్భంలోని ప్రార్థనా భావాన్ని ‘కోరుతున్నాను’ ద్వారా అనుసంధానించింది.
