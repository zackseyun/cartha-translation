  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς τὸ εἶναι ἡμᾶς εἰς ἔπαινον δόξης αὐτοῦ τοὺς προηλπικότας ἐν τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/001/012.yaml
  text: so that we who had already hoped in Messiah might be for the praise of his glory[a][b].
translation:
  language: te
  text: మెస్సీయలో ముందుగానే నిరీక్షించిన మనం ఆయన మహిమకు స్తుతిగా ఉండాలని[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెస్సీయలో మొట్టమొదట నిరీక్షించిన మనం ఆయన మహిమకు స్తుతిగా ఉండాలని.”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τὸ εἶναι
  choice: ఉండాలని
  rationale: ఉపపదంతో కూడిన infinitive ఉద్దేశాన్ని లేదా ఫలితాన్ని సూచిస్తుంది. తెలుగులో ‘ఉండాలని’ ఆ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἡμᾶς
  choice: మనం
  rationale: గ్రీకులో infinitive కర్తగా accusative రూపంలో ఉన్నప్పటికీ, తెలుగు వాక్య నిర్మాణంలో ‘మనం’ సహజమైన కర్తరూపం.
- source_word: εἰς ἔπαινον
  choice: స్తుతి కలిగించేవారిగా
  rationale: ఇది ఉద్దేశం/ఫలితాన్ని తెలిపే ఎఫెసీయుల పత్రికలో పునరావృతమయ్యే ప్రయోగం. ‘స్తుతి కలిగించేవారిగా’ సాధారణ తెలుగులో వాక్య సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: δόξης αὐτοῦ
  choice: ఆయన మహిమకు
  rationale: ‘మహిమ’ అనే ప్రధాన ధార్మిక పదాన్ని నిలుపుతూ, εἰς ἔπαινον‌తో సహజ తెలుగు సంబంధాన్ని కల్పిస్తుంది.
- source_word: τοὺς προηλπικότας
  choice: ముందుగానే నిరీక్షించిన
  rationale: προ- సూచించే పూర్వత్వాన్ని నిలుపుతుంది; అయితే ‘మొట్టమొదట నిరీక్షించినవారు’ అని చెప్పి ఒక నిర్దిష్ట సమూహ గుర్తింపును ప్రధాన పాఠ్యంలో బలవంతంగా నిర్ణయించదు.
- source_word: ἐν τῷ Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉపయోగించబడింది. ‘మెస్సీయ’ అభిషిక్తుడు అనే బిరుదు భావాన్ని నిలుపుతుంది; ‘లో’ పౌలు వాడే సంబంధ/ఐక్యత భాషలోని నిజమైన విస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: προηλπικότας అనేది ముందే నిరీక్షించిన వారిని సాధారణంగా సూచిస్తుందా, లేక మెస్సీయలో మొదట నిరీక్షించిన ప్రత్యేక సమూహాన్ని సూచిస్తుందా?
  choice: ప్రధాన పాఠ్యంలో ‘ముందుగానే నిరీక్షించిన’ అని జాగ్రత్తగా అనువదించడం
  alternative: ‘మెస్సీయలో మొట్టమొదట నిరీక్షించిన’
  rationale: προ- పూర్వత్వాన్ని స్పష్టంగా సూచించినా, అది కేవలం ముందస్తు నిరీక్షణనా లేక ఇతరులకంటే మొదటి సమూహమా అన్నది వివాదాస్పదం. ప్రధాన పాఠ్యం తక్కువ నిర్ణయాత్మక భావాన్ని ఉంచి, బలమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మెస్సీయ,’ ‘మహిమ,’ ‘స్తుతి,’ ‘నిరీక్షణ’ వంటి స్థిరమైన బైబిలు పదాలను నిలిపి, వాక్యాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా రూపొందించాం.
