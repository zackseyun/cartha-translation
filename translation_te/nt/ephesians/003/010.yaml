review_pass:
  verdict: revise
  source_fidelity: The draft preserves the purpose force of ἵνα, the passive sense of γνωρισθῇ, the temporal νῦν, the church as the means, and the broad designation of the rulers and authorities. However, “పరలోక సంబంధమైన లోకాలలో” overrenders the substantivized adjective ἐπουρανίοις by adding “worlds” and is less idiomatic than a direct locative expression.
  naturalness: “తెలియజేయబడాలనే ఉద్దేశంతో” is understandable but heavier than necessary in this continuing purpose clause. “తెలియజేయబడేలా” is natural modern Telugu and retains the purposive passive sense. “పరలోక స్థలాల్లో” is clearer and more idiomatic than “పరలోక సంబంధమైన లోకాలలో.”
  terminology: “సంఘం ద్వారా,” “పాలకులకు, అధికారులకు,” and “దేవుని ... జ్ఞానం” are appropriate. “బహువిధమైన” conveys the richly varied or multifaceted sense of πολυποίκιλος more naturally than “బహుముఖమైన,” without reducing it to merely several perspectives.
  issues:
  - severity: medium
    issue: “పరలోక సంబంధమైన లోకాలలో” adds “worlds” to ἐν τοῖς ἐπουρανίοις.
    rationale: The Greek refers to the heavenly sphere/places, not explicitly to multiple worlds. The current phrase is also stylistically cumbersome in Telugu.
  - severity: low
    issue: The purpose construction is unnecessarily periphrastic.
    rationale: “తెలియజేయబడేలా” directly and naturally renders ἵνα + aorist passive subjunctive while maintaining the verse’s dependence on the preceding context.
