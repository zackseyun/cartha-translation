  yaml_path: translation/nt/ephesians/003/010.yaml
  text: so that now[a], through the church, the manifold wisdom of God might be made known to the rulers and the authorities in the heavenly realms[c][b],
translation:
  language: te
  text: దేవుని బహువిధమైన[a] జ్ఞానం ఇప్పుడు సంఘం ద్వారా పరలోక స్థలాల్లో[b] ఉన్న పాలకులకు, అధికారులకు[c] తెలియజేయబడేలా,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బహువిధమైన’ అంటే అనేక రకాలుగా వ్యక్తమయ్యే, సమృద్ధమైన వైవిధ్యం గలదని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పరలోక ప్రదేశాల్లో.’
    reason: lexical_alternative
  - marker: c
    text: ‘పాలకులు, అధికారులు’ అనే మాటలు ఇక్కడ కేవలం మానవ అధికారులనే కాక, పరలోక పరిధిలోని ఆత్మసంబంధ లేదా విశ్వసంబంధ శక్తులను సూచిస్తున్నట్లు కనిపిస్తున్నాయి.
    reason: cultural_note
lexical_decisions:
- source_word: ἵνα
  choice: తెలియజేయబడాలనే ఉద్దేశంతో
  rationale: ἵνα సూచించే ఉద్దేశ భావాన్ని స్పష్టంగా ఉంచుతుంది; ఈ వాక్యం ముందున్న వాక్యభాగంతో కొనసాగుతున్నదని చివరి విరామచిహ్నం సూచిస్తుంది.
- source_word: γνωρισθῇ
  choice: తెలియజేయబడాలి
  rationale: కర్తరి ఎవరో పేర్కొనని గ్రీకు కర్మణి ప్రయోగాన్ని, ఉద్దేశార్థక భావంతో సహా నిలుపుతుంది.
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: ప్రస్తుత కాలాన్ని సూచించే సరళమైన, సహజమైన అనువాదం.
- source_word: ταῖς ἀρχαῖς καὶ ταῖς ἐξουσίαις
  choice: పాలకులకు, అధికారులకు
  rationale: రెండు వేర్వేరు గ్రీకు పదాలను సహజమైన ఆధునిక తెలుగులో వేరుగా నిలుపుతూ, అవి మానవులా ఆత్మసంబంధ శక్తులా అన్నది ప్రధాన పాఠ్యంలో అతిగా నిర్దేశించదు.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: పరలోక సంబంధమైన లోకాలలో
  rationale: ఎఫెసీయులకు పత్రికలోని ఈ విశేషణాత్మక బహువచన ప్రయోగం సూచించే పరలోక పరిధిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διὰ τῆς ἐκκλησίας
  choice: సంఘం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధనార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ἡ πολυποίκιλος σοφία
  choice: బహుముఖమైన జ్ఞానం
  rationale: πολυποίκιλος లోని అనేక కోణాలు, సమృద్ధమైన వైవిధ్యం అనే భావాన్ని సాధారణ పాఠకుడికి అర్థమయ్యే తెలుగులో అందిస్తుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: జ్ఞానం దేవునికి చెందినదని తెలిపే గ్రీకు షష్ఠీ విభక్తిని సహజంగా అనువదిస్తుంది.
theological_decisions:
- issue: ‘పాలకులు, అధికారులు’ ఎవరనే గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో విస్తృత పదాలను ఉంచి, పరలోక సందర్భం వల్ల ఆత్మసంబంధ లేదా విశ్వసంబంధ శక్తులు ఉద్దేశించబడ్డాయని పాదటిప్పణిలో తెలియజేయడం
  alternative: వారిని నేరుగా ‘ఆత్మసంబంధ పాలక శక్తులు’ లేదా ‘దూత సంబంధ శక్తులు’ అని అనువదించడం
  rationale: ἐν τοῖς ἐπουρανίοις అనే పదబంధం మానవ రాజకీయ అధికారులకన్నా మానవాతీత శక్తులను బలంగా సూచిస్తుంది. అయితే మూలపాఠ్యం వారిని ‘దూతలు’ అని ప్రత్యేకంగా పిలవదు; అందువల్ల ప్రధాన పాఠ్యం ఆ వివరాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనదిగానూ సాధారణ పాఠకులకు అర్థమయ్యేదిగానూ ఉంది. మూలంలోని ఉద్దేశార్థం, కర్మణి ప్రయోగం, సంఘం సాధనంగా ఉండటం, పాలకుల గుర్తింపులోని పరిమిత అస్పష్టత అన్నీ నిలుపబడ్డాయి.
