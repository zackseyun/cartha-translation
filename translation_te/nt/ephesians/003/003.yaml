  text: ⸀κατὰ ἀποκάλυψιν ⸀ἐγνωρίσθη μοι τὸ μυστήριον, καθὼς προέγραψα ἐν ὀλίγῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/003.yaml
  text: that the mystery was made known to me by revelation[a], as I wrote before briefly[c][b],
translation:
  language: te
  text: ప్రకటన ద్వారా ఆ మర్మం నాకు తెలియజేయబడింది[a], నేను ఇంతకుముందు క్లుప్తంగా రాసినట్లుగా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ప్రకటన ప్రకారం’ లేదా ‘ప్రకటన మూలంగా.’ గ్రీకు పదబంధం విధానం లేదా మాధ్యమం అనే భావాలను అనుమతిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కొద్ది మాటల్లో రాసినట్లుగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀποκάλυψιν
  choice: ప్రత్యక్షత ద్వారా
  rationale: κατά + accusative ఇక్కడ విధానం లేదా మాధ్యమాన్ని సూచిస్తుంది. ‘ప్రత్యక్షత ద్వారా’ అనేది దైవిక బయలుపరచడం ద్వారా విషయం తెలియజేయబడిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; కర్తను అనవసరంగా స్పష్టీకరించదు.
- source_word: ἐγνωρίσθη μοι
  choice: నాకు తెలియజేయబడింది
  rationale: γνωρίζω యొక్క aorist passive రూపాన్ని నిలుపుతూ, అంతర్లీన కర్తను పేర్కొనకుండా ‘was made known to me’ అనే భావాన్ని ఖచ్చితంగా అందిస్తుంది. సమీపంలోని ἀποκάλυψις వల్ల ‘నాకు ప్రత్యక్షపరచబడింది’ అని అనువదిస్తే వచ్చే పదపునరుక్తిని కూడా నివారిస్తుంది.
- source_word: τὸ μυστήριον
  choice: ఆ మర్మం
  rationale: పౌలు వాడుకలో μυστήριον అనేది ఒకప్పుడు దాచబడి ఇప్పుడు బయలుపరచబడిన దైవిక ఉద్దేశాన్ని సూచిస్తుంది. ‘మర్మం’ ఆ స్థిరమైన వేదాంతపరమైన భావాన్ని నిలుపుతుంది; ‘ఆ’ అనే నిర్దేశకం గ్రీకు definite articleను సందర్భానుగుణంగా ప్రతిబింబిస్తుంది.
- source_word: καθὼς
  choice: రాసినట్లుగా
  rationale: καθώς యొక్క తులనాత్మక సంబంధాన్ని తెలుగులో సహజంగా చూపడానికి క్రియతో కూడిన ‘-నట్లుగా’ నిర్మాణం వాడబడింది.
- source_word: προέγραψα
  choice: నేను ఇంతకుముందు ... రాసిన
  rationale: ఇక్కడ προγράφω ముందుగా, బహుశా ఈ పత్రికలోనే ముందు భాగంలో, రాయడాన్ని సూచిస్తుంది. ‘ఇంతకుముందు రాసిన’ కాలసంబంధ భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: ἐν ὀλίγῳ
  choice: క్లుప్తంగా
  rationale: ఈ పదబంధం సంక్షిప్తంగా లేదా కొద్ది మాటల్లో రాయడాన్ని సూచిస్తుంది. ‘క్లుప్తంగా’ గౌరవప్రదమైన ఆధునిక తెలుగులో సంక్షిప్తతను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పౌలు వాడుకలో μυστήριον యొక్క అర్థం
  choice: ‘మర్మం’ అనే పదాన్ని ఉంచి, ఈ వచనంలో దాని విషయాన్ని విస్తరించి చెప్పలేదు.
  alternative: ‘రహస్యం’ లేదా ‘దేవుని దాచబడిన ప్రణాళిక’
  rationale: ఈ వచనం ఆ భావనను పేర్కొంటుంది గాని దాని పూర్తి విషయాన్ని ఇంకా నిర్వచించదు. సందర్భంలోని తరువాతి వివరణను ముందుగానే చేర్చకుండా, పౌలు వాడిన వేదాంతపరమైన పదవర్గాన్ని మరియు దానిలోని ఉద్వేగాన్ని ‘మర్మం’ నిలుపుతుంది.
- issue: దైవిక ప్రత్యక్షతలో అంతర్లీన కర్త
  choice: ‘తెలియజేయబడింది’ అనే కర్మణి రూపంతో కర్తను పేర్కొనలేదు.
  alternative: ‘దేవుడు నాకు తెలియజేశాడు’
  rationale: సందర్భం దేవుని కార్యాన్ని సూచించినా, ఈ గ్రీకు వాక్యంలో కర్త ప్రత్యక్షంగా లేదు. అనువాదంలో దానిని చేర్చకుండా మూలంలోని కర్మణి నిర్మాణం మరియు ఉద్దేశపూర్వక అస్పష్టత నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రత్యక్షత,’ ‘మర్మం’ వంటి స్థిరమైన బైబిలు-వేదాంత పదాలను సాధారణ పాఠకునికి అర్థమయ్యే వాక్యనిర్మాణంలో ఉంచాం. ప్రధాన పాఠంలోని [a], [b] సూచికలు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
