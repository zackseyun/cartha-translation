- from: ప్రత్యక్షత ద్వారా ఆ మర్మం నాకు తెలియజేయబడింది[a]; దాని గురించి నేను ఇంతకుముందు క్లుప్తంగా రాసినట్లుగా[b].
  to: ప్రకటన ద్వారా ఆ మర్మం నాకు తెలియజేయబడింది[a], నేను ఇంతకుముందు క్లుప్తంగా రాసినట్లుగా[b].
