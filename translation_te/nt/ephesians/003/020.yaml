id: EPH.3.20
reference: Ephesians 3:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τῷ δὲ δυναμένῳ ὑπὲρ πάντα ποιῆσαι ὑπερεκπερισσοῦ ὧν αἰτούμεθα ἢ νοοῦμεν κατὰ τὴν δύναμιν τὴν ἐνεργουμένην ἐν ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/020.yaml
  text: To the one who is able to do far beyond all that we ask or think[a], according to the power at work in us[b],
translation:
  language: te
  text: మనలో పనిచేస్తున్న శక్తికి అనుగుణంగా, మనం అడిగే లేదా ఊహించే అన్నిటికంటే అపారంగా ఎక్కువగా[a] చేయగలవానికి,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అపారంగా ఎక్కువగా’ అనే చోట ‘సమృద్ధిగా మించి’ లేదా ‘కొలవలేనంతగా మించి’ అని కూడా అనువదించవచ్చు. గ్రీకు పదం మనం అడిగే లేదా ఊహించే అన్నిటిని మించి చేయడమనే భావాన్ని బలంగా నొక్కి చెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῷ ... δυναμένῳ
  choice: చేయగలవానికి
  rationale: ఉపపదంతో నామవాచకంగా వాడిన కృదంతానికి ఉన్న చతుర్థీ విభక్తి భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; 21వ వచనంలో కొనసాగే స్తోత్రవాక్యానికి ఇది గ్రహీతను సూచిస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతకన్నా స్తోత్ర ముగింపులోకి మార్పును సూచిస్తుంది. తెలుగులో వాక్య నిర్మాణమే ఆ మార్పును సహజంగా తెలియజేస్తుంది; ‘ఇప్పుడు’ అని చేరిస్తే మూలంలో లేని కాలార్థం కలగవచ్చు.
- source_word: ὑπὲρ πάντα ... ὑπερεκπερισσοῦ
  choice: అన్నిటికీ మించి అపారంగా
  rationale: ὑπὲρ πάντα లోని అధిగమన భావాన్నీ, బలంగా తీవ్రతను తెలిపే ὑπερεκπερισσοῦ భావాన్నీ కలిపి సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: ποιῆσαι
  choice: చేయ
  rationale: ποιέω యొక్క విస్తృతమైన, సరళమైన అర్థాన్ని కాపాడుతుంది; ‘సాధించు’ అనేది మూలం కంటే కొంత నిర్దిష్టంగా ఉంటుంది.
- source_word: ὧν αἰτούμεθα ἢ νοοῦμεν
  choice: మనం అడిగేవాటికంటే లేదా ఊహించేవాటికంటే
  rationale: అధిగమన వ్యక్తీకరణ తర్వాత వచ్చే సంబంధ సర్వనామ నిర్మాణాన్ని తెలుగులో సహజమైన తులనాత్మక రూపంలో అందిస్తుంది. νοέω ఇక్కడ మనస్సులో తలంచడం లేదా ఊహించగలగడం అనే భావం కలిగి ఉంది.
- source_word: κατὰ τὴν δύναμιν
  choice: శక్తికి అనుగుణంగా
  rationale: κατά ఇక్కడ కేవలం సాధనాన్ని కాక ప్రమాణం లేదా పరిమాణాన్ని సూచిస్తుంది; ‘ద్వారా’ కంటే ‘అనుగుణంగా’ ఆ సూక్ష్మభావాన్ని మెరుగ్గా కాపాడుతుంది.
- source_word: τὴν ἐνεργουμένην ἐν ἡμῖν
  choice: మనలో పనిచేస్తున్న
  rationale: శక్తి ప్రస్తుతం ప్రభావవంతంగా క్రియాశీలంగా ఉందనే కృదంత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ἐν ἡμῖν ను నేరుగా ‘మనలో’గా ఉంచుతుంది.
theological_decisions:
- issue: స్తోత్రాన్ని స్వీకరించే వ్యక్తి ఎవరు?
  choice: ‘చేయగలవానికి’ అని మాత్రమే అనువదించి, ఈ వచనంలో ‘దేవునికి’ అని చేర్చలేదు.
  alternative: ‘చేయగల దేవునికి’
  rationale: సందర్భం దేవుణ్ణి సూచించినప్పటికీ, ఈ వచనంలోని గ్రీకు పాఠ్యంలో θεός అనే నామవాచకం లేదు. అందువల్ల 21వ వచనంలో కొనసాగే నిర్మాణాన్నీ మూలంలోని పరోక్షతనూ కాపాడాం.
- issue: విశ్వాసుల్లో క్రియాశీలమైన శక్తి
  choice: ‘మనలో పనిచేస్తున్న శక్తి’
  alternative: ‘మన మధ్య పనిచేస్తున్న శక్తి’
  rationale: దైవశక్తి విశ్వాసుల్లో ప్రభావవంతంగా పనిచేస్తోందనే విస్తృతమైన వాక్యార్థాన్ని నిలుపుతూ, పరిశుద్ధీకరణ లేదా ఆత్మీయ వరాల గురించి ఏ ప్రత్యేక సంప్రదాయ వివరణనూ చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే స్తోత్రవాక్యానికి తగిన గౌరవప్రదమైన శైలి. ఈ వాక్యం 21వ వచనంలో కొనసాగుతుందనే కారణంగా చివర కామా ఉంచబడింది.
