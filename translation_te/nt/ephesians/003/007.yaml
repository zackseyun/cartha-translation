  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὗ ⸀ἐγενήθην διάκονος κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ ⸂τῆς δοθείσης⸃ μοι κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/007.yaml
  text: of which I became a servant according to the gift of God's grace given to me according to the working of his power—[a]
translation:
  language: te
  text: దానికి నేను, ఆయన శక్తి కార్యాచరణ ప్రకారం నాకు అనుగ్రహించబడిన దేవుని కృపావరం ప్రకారం, సేవకుడనయ్యాను.[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నేను పరిచారకునిగా చేయబడ్డాను.’
    reason: ἐγενήθηνకు సాధ్యమైన కర్మణి ఛాయను, διάκονοςకు సాధ్యమైన ప్రత్యామ్నాయ అనువాదాన్ని సూచించడానికి.
lexical_decisions:
- source_word: οὗ
  choice: దానికి
  rationale: సందర్భంలోని నపుంసకలింగ పదమైన εὐαγγέλιον (‘సువార్త’)ను సూచించే సంబంధ సర్వనామం; తెలుగులో ముందున్న సువార్తకు సహజంగా అనుసంధానిస్తుంది.
- source_word: ἐγενήθην
  choice: అయ్యాను
  rationale: γίνομαι యొక్క సాధారణ భావమైన ఒక స్థితి లేదా పాత్రలోకి రావడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; కర్తృత్వాన్ని అవసరానికి మించి నిర్దిష్టం చేయదు.
- source_word: διάκονος
  choice: సేవకుణ్ణి
  rationale: ఇక్కడ సువార్తకు సంబంధించిన సేవను సూచిస్తుంది; ‘పరిచారకుడు’ లేదా సంఘపదవిగా అర్థమయ్యే పదాలకన్నా సాధారణ కార్యాత్మక భావాన్ని కాపాడుతుంది.
- source_word: κατὰ τὴν δωρεὰν τῆς χάριτος τοῦ θεοῦ
  choice: దేవుని కృపావరం ప్రకారం
  rationale: δωρεά మరియు χάρις మధ్యనున్న సంబంధాన్ని ‘కృపావరం’ సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది; κατά సూచించే ప్రమాణం లేదా అనుగుణతను ‘ప్రకారం’ నిలుపుతుంది.
- source_word: τῆς δοθείσης μοι
  choice: నాకు అనుగ్రహించబడిన
  rationale: దైవిక వరప్రదాన భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ గ్రీకు కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: κατὰ τὴν ἐνέργειαν τῆς δυνάμεως αὐτοῦ
  choice: ఆయన శక్తి కార్యసాధకత ప్రకారం
  rationale: ἐνέργεια కేవలం పని చేయడమే కాక ప్రభావవంతంగా కార్యసాధన చేసే శక్తిని సూచిస్తుంది; ‘కార్యసాధకత’ ఆ భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: διάκονος సూచించే పౌలు పాత్ర
  choice: సేవకుడు
  alternative: పరిచారకుడు / డీకన్
  rationale: వాక్యం అధికారిక సంఘపదవిని స్పష్టంగా చెప్పకుండా సువార్తకు చేసిన సేవను వివరిస్తుంది; అందువల్ల తరువాతి సంస్థాగత భావాన్ని దిగుమతి చేయలేదు.
- issue: ἐγενήθην లో కర్తృత్వం
  choice: అయ్యాను
  alternative: చేయబడ్డాను / నియమించబడ్డాను
  rationale: గ్రీకు రూపంలో కర్మణి ఛాయ సాధ్యమైనా, ప్రధాన భావం పౌలు ఈ పాత్రలోకి వచ్చాడనేది. దేవుని కృప, శక్తి అనే తరువాతి పదాలు దైవిక మూలాన్ని తెలియజేస్తాయి; క్రియలో దానిని అదనంగా నిర్దిష్టం చేయలేదు.
- issue: రెండు κατά పదబంధాల సంబంధం
  choice: రెండింటినీ ‘ప్రకారం’గా నిలుపడం
  alternative: మొదటిదాన్ని ‘వల్ల’, రెండవదాన్ని ‘ద్వారా’గా కారణార్థంలో మార్చడం
  rationale: మూలంలోని సమాంతర నిర్మాణం, ప్రమాణం/అనుగుణత భావం నిలుస్తాయి; కృపావరం మరియు శక్తి కార్యసాధకత మధ్య ఉన్న సంబంధాన్ని అనువాదం ముందుగానే పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రద శైలి. ‘సేవకుడు’ కార్యాత్మక భావాన్ని ఇస్తుంది; ‘కృపావరం’ δωρεά–χάρις సంబంధాన్ని సంక్షిప్తంగా తెలియజేస్తుంది. మూలవాక్యం తరువాతి వచనానికి కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది.
