source:
  edition: SBLGNT
  text: ἵνα ⸀δῷ ὑμῖν κατὰ ⸂τὸ πλοῦτος⸃ τῆς δόξης αὐτοῦ δυνάμει κραταιωθῆναι διὰ τοῦ πνεύματος αὐτοῦ εἰς τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/016.yaml
  text: that he may grant you[a], according to the riches of his glory, to be strengthened with power through his Spirit in the inner man,
translation:
  language: te
  text: తన మహిమ ఐశ్వర్యానికి అనుగుణంగా, తన ఆత్మ ద్వారా మీ అంతరంగ స్వరూపంలో[a] మీరు శక్తితో బలపరచబడేలా ఆయన మీకు అనుగ్రహించాలని,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా “అంతరంగ మనిషిలో”; ఇది వ్యక్తి యొక్క లోపలి స్వరూపాన్ని సూచించే ప్రతినిధి ఏకవచన ప్రయోగం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: …అని / …లా
  rationale: ఇది పౌలు ప్రార్థనలోని అభ్యర్థనను, దాని ఉద్దేశాన్ని పరిచయం చేస్తుంది. ముందరి వాక్యంతో సహజంగా కలిసేలా తెలుగులో ‘…లా … అనుగ్రహించాలని’ అనే నిర్మాణం వాడబడింది.
- source_word: δῷ ὑμῖν
  choice: ఆయన మీకు అనుగ్రహించాలని
  rationale: ἵνα తరువాత ఉన్న aorist subjunctive యొక్క ప్రార్థనా భావాన్ని ‘అనుగ్రహించాలని’ సహజంగా వ్యక్తం చేస్తుంది; ‘మీకు’ ద్వారా ὑμῖν నిలుపబడింది.
- source_word: κατὰ τὸ πλοῦτος τῆς δόξης αὐτοῦ
  choice: తన మహిమా ఐశ్వర్యానికి తగినట్లుగా
  rationale: κατά ఇక్కడ ప్రమాణాన్ని లేదా పరిమాణాన్ని సూచిస్తుంది. ‘తగినట్లుగా’ అనేది కేవలం ఆ ఐశ్వర్యం నుండి కొంత భాగమనే భావం కాకుండా, దానికి అనుగుణంగా అనే భావాన్ని ఇస్తుంది.
- source_word: δυνάμει κραταιωθῆναι
  choice: శక్తితో బలపరచబడేలా
  rationale: δυνάμει యొక్క సాధనార్థక భావాన్ని ‘శక్తితో’ తెలియజేస్తుంది; κραταιωθῆναι లోని నిష్క్రియ రూపాన్ని ‘బలపరచబడేలా’ నిలుపుతుంది.
- source_word: διὰ τοῦ πνεύματος αὐτοῦ
  choice: తన ఆత్మ ద్వారా
  rationale: διά + genitive సూచించే సాధనం లేదా కార్యసాధకత్వాన్ని ‘ద్వారా’ స్పష్టంగా అందిస్తుంది. సందర్భంలో ఇది దేవుని ఆత్మను సూచిస్తుంది.
- source_word: εἰς τὸν ἔσω ἄνθρωπον
  choice: మీ అంతరంగంలో[a]
  rationale: ఈ ప్రతినిధి ఏకవచన గ్రీకు నుడికారం వ్యక్తి యొక్క లోపలి స్వరూపాన్ని సూచిస్తుంది. సహజమైన ఆధునిక తెలుగులో ‘మీ అంతరంగంలో’ అని ఇచ్చి, ‘అంతరంగ మనిషి’ అనే అక్షరార్థ రూపాన్ని పాదటిప్పణిలో భద్రపరచాం.
theological_decisions:
- issue: πνεῦμα యొక్క సూచన
  choice: దేవుని ఆత్మ—‘తన ఆత్మ’
  alternative: వ్యక్తిత్వం లేని దైవిక ప్రభావం లేదా సాధారణ ‘ఆత్మ’
  rationale: సందర్భంలో విశ్వాసులను బలపరిచే దైవిక కార్యసాధకుని గురించి ఉంది; పౌలు వాడుక కూడా దేవుని ఆత్మనే బలంగా సూచిస్తుంది. తెలుగు పదబంధం గ్రీకులో ఉన్న ‘తన ఆత్మ’ అనే సరళతను నిలుపుతుంది.
- issue: ἔσω ἄνθρωπον యొక్క అనువాదం
  choice: మీ అంతరంగంలో
  alternative: అంతరంగ మనిషిలో / అంతరంగ వ్యక్తిలో
  rationale: ἄνθρωπος ఇక్కడ పురుషులకు మాత్రమే పరిమితం కాకుండా ప్రతి వ్యక్తి లోపలి స్వరూపాన్ని సూచించే ప్రతినిధి ఏకవచనం. ప్రధాన పాఠంలో సహజమైన, సమగ్రార్థకమైన తెలుగు వాడి, మూలంలోని రూపకాన్ని పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, ప్రార్థనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని వాడాం. ఇది ముందరి వాక్యంపై ఆధారపడే ఉపవాక్యం కాబట్టి చివర కామా ఉంచబడింది. ‘మహిమా ఐశ్వర్యం’ సహజమైన సమాసరూపంగా, ‘బలపరచబడేలా’ మూలంలోని నిష్క్రియ భావాన్ని నిలిపేలా ఎంపికయ్యాయి.
