- from: తన మహిమా ఐశ్వర్యానికి తగినట్లుగా, తన ఆత్మ ద్వారా మీ అంతరంగంలో[a] మీరు శక్తితో బలపరచబడేలా ఆయన మీకు అనుగ్రహించాలని,
  to: తన మహిమ ఐశ్వర్యానికి అనుగుణంగా, తన ఆత్మ ద్వారా మీ అంతరంగ స్వరూపంలో[a] మీరు శక్తితో బలపరచబడేలా ఆయన మీకు అనుగ్రహించాలని,
  rationale: The revision improves idiomatic Telugu and makes the inward-self referent clearer, while preserving the Greek clause’s prayerful purpose, passive strengthening, instrumental agency, and representative singular expression. The footnote continues to document the literal Greek wording and its inclusive force.
