id: EPH.3.13
reference: Ephesians 3:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ αἰτοῦμαι μὴ ⸀ἐγκακεῖν ἐν ταῖς θλίψεσίν μου ὑπὲρ ὑμῶν, ἥτις ἐστὶν δόξα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/013.yaml
  text: Therefore I ask you not to lose heart because of my afflictions for your sake[b][a], which are your glory.
translation:
  language: te
  text: కాబట్టి, నా శ్రమలను బట్టి మీరు నిరుత్సాహపడవద్దని వేడుకుంటున్నాను; అవే మీ మహిమ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “అవే మీ గౌరవం.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణను సహజంగా, సంక్షిప్తంగా సూచిస్తుంది.
- source_word: αἰτοῦμαι
  choice: వేడుకుంటున్నాను
  rationale: పౌలు చేస్తున్న మనవిని గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; సందర్భం ద్వారా ఉద్దేశితులు ‘మీరు’ అని స్పష్టమవుతుంది.
- source_word: μὴ ἐγκακεῖν
  choice: మీరు నిరుత్సాహపడవద్దని
  rationale: ἐγκακέωలోని ధైర్యం కోల్పోవడం లేదా మనసు దిగులుపడడం అనే భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἐν ταῖς θλίψεσίν μου
  choice: నేను అనుభవిస్తున్న శ్రమలను బట్టి
  rationale: ἐν ఇక్కడ నిరుత్సాహానికి కారణం లేదా సందర్భాన్ని సూచిస్తుంది. ‘శ్రమలు’ θλῖψιςలోని బాధలు, ఇబ్బందులు అనే గంభీర భావాన్ని నిలుపుతుంది.
- source_word: ὑπὲρ ὑμῶν
  choice: మీ కోసం
  rationale: వారి మేలు నిమిత్తం లేదా వారి పక్షంగా పౌలు అనుభవిస్తున్న శ్రమల భావాన్ని సరళంగా తెలియజేస్తుంది.
- source_word: ἥτις ἐστὶν δόξα ὑμῶν
  choice: అవే మీ మహిమ
  rationale: సమీపంలోని బహువచన భావమైన పౌలు శ్రమలను తిరిగి సూచిస్తూ, గ్రీకులోని ఏకవచన సంబంధవాచకం ఆ శ్రమలను ఒక సమగ్ర భావంగా చూడడాన్ని సహజ తెలుగు నిర్మాణంలో వ్యక్తపరుస్తుంది. δόξα యొక్క బలమైన ధార్మిక, వాక్చాతుర్య భావాన్ని ‘మహిమ’ నిలుపుతుంది.
theological_decisions:
- issue: ἥτις ἐστὶν δόξα ὑμῶν అనే సంబంధవాక్యపు పూర్వపదం
  choice: ఈ వాక్యం పౌలు వారి కోసం అనుభవిస్తున్న శ్రమలను సమగ్రంగా సూచిస్తుంది.
  alternative: ఇది మరింత విస్తృతంగా వారి కోసం పౌలు చేసిన పరిచర్యతో కూడిన శ్రమను సూచించవచ్చు.
  rationale: సమీప పూర్వపదం ‘నా శ్రమలు’; అయినా సంబంధవాచకపు ఏకవచనం ముందటి మొత్తం భావాన్ని సూచించగలదు. ప్రధాన అనువాదం ఈ ఉద్దేశాన్ని నిలుపుతూ, అది ఎలా వారి మహిమ అవుతుందో సిద్ధాంతపరంగా విప్పి చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘శ్రమలు,’ ‘మహిమ’ పదాలు మూలంలోని గంభీరతను నిలుపుతాయి. ప్రధాన పాఠంలోని [a] సూచిక సంబంధిత ప్రత్యామ్నాయాన్ని మాత్రమే ఇస్తుంది; వివరణాత్మక సిద్ధాంతాన్ని చేర్చదు.
