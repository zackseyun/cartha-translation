revisions:
- from: కాబట్టి, మీ కోసం నేను అనుభవిస్తున్న శ్రమలను బట్టి మీరు నిరుత్సాహపడవద్దని వేడుకుంటున్నాను; అవే మీ మహిమ.[a]
  to: కాబట్టి, నా శ్రమలను బట్టి మీరు నిరుత్సాహపడవద్దని వేడుకుంటున్నాను; అవే మీ మహిమ.[a]
  rationale: The revision preserves the source's ambiguity about how the afflictions constitute the readers' glory and does not add theological explanation. It makes the possessive expression more source-close and corrects the footnote’s number agreement while retaining ‘గౌరవం’ as a legitimate lexical alternative for δόξα.
  reviewer_model: gpt-5.6-terra
