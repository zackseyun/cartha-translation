    reason: alternative_reading
  revision_rationale: The revision restores the purpose relation introduced by ἵνα and expresses ἐξισχύσητε with a natural Telugu sufficient-strength construction. It retains the source text’s open-ended sequence of dimensions and preserves the explanatory footnote at the point of ambiguity.
