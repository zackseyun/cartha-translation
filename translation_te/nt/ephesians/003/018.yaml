  yaml_path: translation/nt/ephesians/003/018.yaml
  text: so that you may be strong enough to comprehend[a], together with all the saints, what is the width and length and height and depth[b],
translation:
  language: te
  text: మీరు పరిశుద్ధులందరితో కలిసి వెడల్పు, పొడవు, ఎత్తు, లోతు ఏమిటో గ్రహించగలిగేంత బలాన్ని పొందునట్లు[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ నాలుగు పరిమాణాలు దేనిని వర్ణిస్తున్నాయో గ్రీకు పాఠ్యం స్పష్టంగా చెప్పదు. చాలామంది ఈ భావం తరువాతి వచనంలో క్రీస్తు ప్రేమతో పూర్తవుతుందని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: అని
  rationale: ముందటి ప్రార్థనతో అనుసంధానమైన ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐξισχύσητε
  choice: గ్రహించగలిగేంత బలపడాలని
  rationale: తరువాతి క్రియకు తగినంత శక్తి లేదా సామర్థ్యం కలగాలనే భావాన్ని నిలుపుతుంది.
- source_word: καταλαβέσθαι
  choice: గ్రహించగలిగేంత
  rationale: ఇక్కడ ఆధ్యాత్మిక వాస్తవాన్ని మనసుతో అవగాహన చేసుకోవడం అనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: σὺν πᾶσιν τοῖς ἁγίοις
  choice: పరిశుద్ధులందరితో కలిసి
  rationale: సమస్త విశ్వాసులతో పంచుకునే భాగస్వామ్యాన్ని చూపుతూ, పౌలు వాడే స్థిరమైన ‘పరిశుద్ధులు’ అనే పదాన్ని కాపాడుతుంది.
- source_word: τί
  choice: ఏమిటో
  rationale: నాలుగు పరిమాణాలను గ్రహించవలసిన విషయంగా పరిచయం చేస్తుంది; వాటి పరిమాణం ఎంత గొప్పదో అని వ్యాఖ్యానాత్మకంగా మార్చదు.
- source_word: τὸ πλάτος
  choice: వెడల్పు
  rationale: ఆధునిక తెలుగులో సహజమైన ప్రత్యక్ష పరిమాణ పదం.
- source_word: μῆκος
  choice: పొడవు
  rationale: మూలంలోని సాధారణ పరిమాణ పదానికి ప్రత్యక్ష సమానార్థకం.
- source_word: ὕψος
  choice: ఎత్తు
  rationale: మూలంలోని సాధారణ పరిమాణ పదానికి ప్రత్యక్ష సమానార్థకం.
- source_word: βάθος
  choice: లోతు
  rationale: మూలంలోని సాధారణ పరిమాణ పదానికి ప్రత్యక్ష సమానార్థకం.
theological_decisions:
- issue: నాలుగు పరిమాణాలు దేనిని వర్ణిస్తున్నాయనే ప్రశ్న
  choice: ప్రధాన పాఠ్యంలో వాటి సంబంధిత అంశాన్ని పేర్కొనకుండా వదిలివేయడం
  alternative: ‘క్రీస్తు ప్రేమ యొక్క వెడల్పు, పొడవు, ఎత్తు, లోతు’ అని స్పష్టంగా చేర్చడం
  rationale: ఈ వచనంలోని గ్రీకు పాఠ్యం ఆ పరిమాణాలు దేనికి సంబంధించినవో స్పష్టంగా చెప్పదు. ‘క్రీస్తు ప్రేమ’ అని చేరిస్తే తరువాతి వచనం ఆధారంగా భావాన్ని ముందుగానే నిర్ణయించినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనా సందర్భానికి తగిన గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలో ఉన్న అనిర్దిష్టతను ఉద్దేశపూర్వకంగా నిలిపింది.
