source:
  edition: SBLGNT
  text: γνῶναί τε τὴν ὑπερβάλλουσαν τῆς γνώσεως ἀγάπην τοῦ Χριστοῦ, ἵνα πληρωθῆτε εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/019.yaml
  text: and to know the love of Messiah that surpasses knowledge[b][a], so that you may be filled unto all the fullness of God.
translation:
  language: te
  text: మరియు జ్ఞానాన్ని మించిన మెస్సీయ ప్రేమను[a] తెలుసుకోవాలని, తద్వారా దేవుని సమస్త సంపూర్ణతవరకు మీరు నింపబడాలని.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సాంప్రదాయంగా, “క్రీస్తు ప్రేమ” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, “దేవుని సమస్త సంపూర్ణతతో మీరు నింపబడాలని.” గ్రీకు మూలంలో అక్షరార్థంగా “దేవుని సమస్త సంపూర్ణతవరకు నింపబడాలని” అని ఉంది. ఇది దేవుని సంపూర్ణత యొక్క పూర్తి కొలత వైపు సాగడాన్ని నొక్కిచెప్పే సంక్షిప్త అభివ్యక్తి కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶναί
  choice: తెలుసుకోవాలని
  rationale: γινώσκω అనే క్రియ యొక్క భావాన్ని నేరుగా, సహజంగా అందిస్తుంది; సందర్భంలో అనుభవపూర్వకంగా తెలుసుకోవడం అనే భావానికీ చోటిస్తుంది.
- source_word: τε
  choice: మరియు
  rationale: ముందున్న ప్రార్థనా అభ్యర్థనలతో ఈ క్రియను సున్నితంగా కలుపుతుంది.
- source_word: ὑπερβάλλουσαν τῆς γνώσεως
  choice: జ్ఞానాన్ని మించిన
  rationale: ప్రేమ మానవ జ్ఞానానికి అతీతమనే భావాన్నీ, జ్ఞానాన్ని మించినదాన్ని తెలుసుకోవాలనే ఉద్దేశపూర్వక విరోధాభాసాన్నీ నిలుపుతుంది.
- source_word: ἀγάπην τοῦ Χριστοῦ
  choice: మెస్సీయ ప్రేమను
  rationale: Χριστόςను బిరుదుగా ‘మెస్సీయ’ అని అనువదిస్తూ, గ్రీకు షష్ఠీ విభక్తి ప్రేమ ఎవరిది లేదా ఎవరిపట్లది అనే అంశాన్ని పూర్తిగా విడమరచకుండా ఉంచుతుంది.
- source_word: ἵνα
  choice: తద్వారా
  rationale: ప్రయోజనం లేదా ఫలితాన్ని పరిచయం చేసే భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: πληρωθῆτε
  choice: మీరు నింపబడాలని
  rationale: కర్మణి ప్రయోగాన్ని నిలుపుతూ గ్రీకు క్రియకు నేరమైన, స్పష్టమైన సమానార్థకాన్ని ఇస్తుంది.
- source_word: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ
  choice: దేవుని సంపూర్ణత అంతటివరకు
  rationale: εἰς సూచించే లక్ష్యదిశను ‘వరకు’ ద్వారా నిలుపుతుంది; దానిని కేవలం ‘సంపూర్ణతతో’ అని మార్చి పూర్వప్రత్యయ భావాన్ని చదును చేయదు.
theological_decisions:
- issue: Χριστοῦ యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός బిరుదు భావాన్ని కలిగి ఉంది; ‘మెస్సీయ’ ఆ అభిషిక్తుని బిరుదు అర్థాన్ని స్పష్టంగా అందిస్తుంది.
- issue: ἀγάπην τοῦ Χριστοῦ లోని షష్ఠీ విభక్తి
  choice: మెస్సీయ ప్రేమ
  alternative: మెస్సీయ మనపై చూపే ప్రేమ; మెస్సీయపట్ల ప్రేమ
  rationale: సందర్భం మెస్సీయ ప్రేమనే బలంగా సూచించినా, మూలంలోని నిర్మాణం కర్తృ లేదా కర్మ సంబంధాన్ని స్పష్టంగా విడదీయదు; అందువల్ల ప్రధాన పాఠ్యంలో ఆ ఉద్వేగాన్ని నిలిపింది.
- issue: εἰς πᾶν τὸ πλήρωμα τοῦ θεοῦ అనే సంక్షిప్త అభివ్యక్తి
  choice: దేవుని సంపూర్ణత అంతటివరకు మీరు నింపబడాలని
  alternative: దేవుని సంపూర్ణత అంతటితో మీరు నింపబడాలని
  rationale: ‘వరకు’ εἰς యొక్క దిశాత్మక, లక్ష్యసూచక భావాన్ని కాపాడుతుంది; దేవునితో తాత్త్విక సమానత్వాన్ని అనవసరంగా సూచించకుండా పౌలు వాడిన గంభీరమైన సంక్షిప్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ ప్రార్థనా సందర్భానికి తగిన గౌరవప్రదమైన శైలిని వాడింది. ‘జ్ఞానాన్ని మించిన ... తెలుసుకోవాలని’ అనే విరోధాభాసాన్ని ఉద్దేశపూర్వకంగా నిలిపింది. ‘అంతటివరకు’ కొంత అసాధారణంగా వినిపించినా, మూలంలోని εἰς దిశాత్మకతను మరియు వాక్యంలోని దైవశాస్త్ర సంబంధిత సంక్షిప్తతను కాపాడటానికి ఎంచుకుంది.
