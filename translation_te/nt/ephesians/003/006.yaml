- from: అన్యజనులు[a] సువార్త ద్వారా మెస్సీయ అయిన యేసులో తోటి వారసులుగా, ఒకే శరీరంలో తోటి అవయవాలుగా[c], వాగ్దానంలో తోటి భాగస్థులుగా ఉండడమే[b].
  to: అన్యజనులు[a] సువార్త ద్వారా మెస్సీయ అయిన యేసులోని వాగ్దానంలో తోటి వారసులుగా, ఒకే శరీరానికి చెందినవారుగా[c], తోటి భాగస్థులుగా ఉండడమే[b].
