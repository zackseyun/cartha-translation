  text: εἶναι τὰ ἔθνη συγκληρονόμα καὶ σύσσωμα καὶ συμμέτοχα τῆς ἐπαγγελίας ⸂ἐν Χριστῷ Ἰησοῦ⸃ διὰ τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/006.yaml
  text: that the Gentiles are fellow heirs[a], fellow members of the body, and fellow partakers of the promise in Messiah Jesus through the gospel[c][b],
translation:
  language: te
  text: అన్యజనులు[a] సువార్త ద్వారా మెస్సీయ అయిన యేసులోని వాగ్దానంలో తోటి వారసులుగా, ఒకే శరీరానికి చెందినవారుగా[c], తోటి భాగస్థులుగా ఉండడమే[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జనాలు.’ ఇక్కడ ఈ పదం ప్రత్యేకంగా, దేవుని రక్షణ వాగ్దానంలో ఇశ్రాయేలుతో పాటు చేర్చబడిన యూదులు కాని ప్రజలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: 'సాంప్రదాయ అనువాదం: ‘క్రీస్తు యేసులో.’ ఇక్కడ గ్రీకు బిరుదైన Χριστός పదంలోని బిరుదు భావాన్ని నిలుపుటకు ‘మెస్సీయ’ అని అనువదించబడింది.'
    reason: alternative_reading
  - marker: c
    text: లేదా ‘తోటి అవయవాలుగా.’
    reason: previous_rendering
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: అన్యజనులు
  rationale: ఈ సందర్భంలో ఇది భౌగోళిక దేశాలను కాక, యూదులు కాని ప్రజలను సూచిస్తుంది.
- source_word: συγκληρονόμα
  choice: తోటి వారసులుగా
  rationale: σύν- సమాసంలోని కలిసి పంచుకునే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: σύσσωμα
  choice: ఒకే శరీరంలో తోటి అవయవాలుగా
  rationale: ఒకే శరీరంలో చేర్చబడినవారనే అరుదైన గ్రీకు పదంలోని శరీర రూపకాన్ని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: συμμέτοχα
  choice: తోటి భాగస్థులుగా
  rationale: ఇతరులతో కలిసి దేనిలోనైనా పాలుపంచుకునే భావాన్ని, ముందున్న రెండు సమాంతర పదబంధాల లయను నిలుపుతుంది.
- source_word: τῆς ἐπαγγελίας
  choice: వాగ్దానంలో
  rationale: సమష్టిగా వాగ్దానంలో పాలుపంచుకోవడాన్ని తెలుగులో సహజంగా తెలియజేస్తూ గ్రీకులోని ఏకవచనాన్ని నిలుపుతుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ అయిన యేసులో
  rationale: Χριστός పదంలోని బిరుదు భావాన్ని కాపాడుతూ, తెలుగులో 'మెస్సీయ యేసు' కంటే స్పష్టంగా మరియు సహజంగా ఉంటుంది.
- source_word: διὰ τοῦ εὐαγγελίου
  choice: సువార్త ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధనార్థాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἶναι
  choice: ఉండడమే
  rationale: మునుపటి వచనంలో చెప్పిన మర్మం యొక్క విషయాన్ని వివరిస్తున్న గ్రీకు infinitive నిర్మాణాన్ని తెలుగు వాక్యసంబంధానికి తగిన విధంగా చూపుతుంది.
theological_decisions:
- issue: Χριστῷ అనే పదాన్ని బిరుదుగా లేదా పేరులో భాగంలా అనువదించడం
  choice: మెస్సీయ అయిన యేసు
  alternative: క్రీస్తు యేసు
  rationale: అన్యజనులు దేవుని రక్షణ వాగ్దానంలో చేర్చబడటాన్ని వివరించే ఈ సందర్భంలో Χριστός యొక్క మెస్సీయ బిరుదు భావం సజీవంగా ఉంది.
- issue: ἔθνη పదం సూచించే వర్గం
  choice: అన్యజనులు
  alternative: జనాలు / దేశాలు
  rationale: తక్షణ సందర్భం యూదులు కానివారు దేవుని ప్రజలతో సమానంగా పాలుపంచుకోవడం గురించి ఉంది; అందువల్ల 'అన్యజనులు' మరింత ఖచ్చితమైనది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూడు σύν- సమాసాల సమాంతరత్వాన్ని ‘తోటి’ అనే పునరావృతితో సాధ్యమైనంతవరకు నిలిపి, σύσσωμα లోని ఒకే శరీర రూపకాన్ని స్పష్టం చేశాం. ఈ వాక్యం 3:5లోని ‘మర్మం’ వివరణను కొనసాగిస్తున్నందున చివర ‘ఉండడమే’ అని ఇచ్చాం.
