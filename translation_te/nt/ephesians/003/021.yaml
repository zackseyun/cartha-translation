id: EPH.3.21
reference: Ephesians 3:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: αὐτῷ ἡ δόξα ἐν τῇ ἐκκλησίᾳ ⸀καὶ ἐν Χριστῷ Ἰησοῦ εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/021.yaml
  text: To him be glory in the church and in Messiah Jesus through all generations forever and ever[a]. Amen.
translation:
  language: te
  text: ఆయనకు సంఘంలోను మెస్సీయ అయిన యేసులోను అన్ని తరతరాలలో యుగయుగాలవరకు మహిమ కలుగుగాక. ఆమేన్.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτῷ ἡ δόξα
  choice: ఆయనకే ... మహిమ కలుగుగాక
  rationale: గ్రీకు వాక్యంలో క్రియ లేకపోయినా ఇది మహిమను ఆపాదించే స్తోత్రవాక్యం. తెలుగులో సహజమైన ఆశీర్వచన ధోరణిని వ్యక్తం చేయడానికి ‘కలుగుగాక’ను పూరించాం; ‘ఆయనకే’ అనే రూపం మహిమ ఆయనకే చెందుతుందనే ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἐν τῇ ἐκκλησίᾳ
  choice: సంఘంలోను
  rationale: ἐκκλησία ఇక్కడ దేవుని ప్రజల సమాజాన్ని సూచిస్తుంది. ‘సంఘం’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సహజంగా ఉండి, ἐν అనే సంబంధాన్ని ‘లో’ ద్వారా నిలుపుతుంది.
- source_word: καὶ ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ అయిన యేసులోను
  rationale: Χριστόςను అర్థవంతమైన బిరుదుగా ‘మెస్సీయ’ అని అనువదించాం. తెలుగులో బిరుదు-పేరు సంబంధం స్పష్టంగా, సహజంగా ఉండేందుకు ‘అయిన’ను చేర్చాం; ἐνను ‘లో’గా నిలిపి ముందరి పదబంధంతో సమాంతరతను కాపాడాం.
- source_word: εἰς πάσας τὰς γενεὰς
  choice: తరతరాలన్నిటిలో
  rationale: ఈ కాలసూచక ప్రయోగం అన్ని తరాల గుండా విస్తరించే కాలవ్యాప్తిని తెలియజేస్తుంది. ‘తరతరాలన్నిటిలో’ ఆ భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: τοῦ αἰῶνος τῶν αἰώνων
  choice: యుగయుగాల వరకు
  rationale: ఇది అంతంలేని కాలాన్ని తెలిపే గ్రీకు ఉద్ఘాటనాత్మక నుడికారం. పదక్షర అనువాదం తెలుగులో అస్పష్టంగా ఉండేందున, స్తోత్రభాషకు తగిన ‘యుగయుగాల వరకు’ను ఎంచుకున్నాం.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: ఆరాధనా సందర్భంలో విస్తృతంగా గుర్తించబడే సంప్రదాయ తెలుగు లిప్యంతరీకరణ.
theological_decisions:
- issue: Χριστῷ అనే పదాన్ని బిరుదుగా అనువదించాలా, పేరులో భాగంలా లిప్యంతరీకరించాలా
  choice: మెస్సీయ అయిన యేసు
  alternative: క్రీస్తు యేసు
  rationale: Χριστός యొక్క ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు భావాన్ని పాఠ్యంలో కనిపించేలా ఉంచాం. అయితే తెలుగు సంప్రదాయంలో సాధారణమైన ‘క్రీస్తు యేసు’ రూపాన్ని పాదసూచికలో ఇచ్చాం.
- issue: క్రియలేని αὐτῷ ἡ δόξα వాక్యానికి తెలుగులో క్రియను పూరించడం
  choice: మహిమ కలుగుగాక
  alternative: మహిమ ఆయనదే
  rationale: మూలంలో ఆపాదన, ఆకాంక్ష రెండింటికీ అనుకూలమైన స్తోత్రసూత్రం ఉంది. ‘కలుగుగాక’ దాని స్తోత్రాత్మక ఆశీర్వచన స్వరాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఇది మహిమ ఇప్పటివరకు లేదని సూచించే ఉద్దేశంతో కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన స్తోత్రశైలిని వాడాం. ‘సంఘంలోను ... యేసులోను’ అనే సమాంతర నిర్మాణాన్ని నిలిపి, కాలవ్యాప్తిని విరామచిహ్నంతో విడదీయకుండా ఒకే నిరంతర పదబంధంగా ఉంచాం.
