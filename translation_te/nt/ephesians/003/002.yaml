revisions:
- from: మీ కోసం నాకు అనుగ్రహించబడిన దేవుని కృపను నిర్వహించే బాధ్యత గురించి మీరు నిజంగా విని ఉంటారు[a][b].
  to: మీరు నిజంగానే విని ఉంటారు[a]—మీ కోసం నాకు ఇవ్వబడిన దేవుని కృపకు సంబంధించిన నిర్వహణ బాధ్యత[b] గురించి.
  rationale: The revision preserves the source's rhetorical assumption and keeps the verse's deliberately incomplete, forward-looking construction by using a dash. It clarifies that the entrusted responsibility concerns God's grace, retains the passive ‘నాకు ఇవ్వబడిన’ for τῆς δοθείσης μοι, and moves each footnote marker to the expression it documents.
