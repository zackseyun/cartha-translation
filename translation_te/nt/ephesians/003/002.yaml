  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴ γε ἠκούσατε τὴν οἰκονομίαν τῆς χάριτος τοῦ θεοῦ τῆς δοθείσης μοι εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/002.yaml
  text: assuming indeed that you have heard of the stewardship of God's grace that was given to me for you[b][a],
translation:
  language: te
  text: మీరు నిజంగానే విని ఉంటారు[a]—మీ కోసం నాకు ఇవ్వబడిన దేవుని కృపకు సంబంధించిన నిర్వహణ బాధ్యత[b] గురించి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీరు నిజంగా విని ఉంటే.” గ్రీకులో షరతు రూపం ఉంది; అయితే సందర్భంలో పౌలు ఇది నిజమేనని భావిస్తున్నట్లు కనిపిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: “నిర్వహణ బాధ్యత”కు “పరిపాలన” లేదా “అప్పగించబడిన పరిచర్య” అని కూడా అనువదించవచ్చు. గ్రీకు పదం అప్పగించబడిన దానిని నిర్వహించడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: నిజంగా విని ఉంటారు
  rationale: గ్రీకు పదబంధం షరతు రూపంలో ఉన్నప్పటికీ, సందర్భంలో పౌలు తన పాఠకులకు ఈ విషయం తెలిసే ఉంటుందని భావిస్తున్నాడు. తెలుగు వాక్యం ఆ అంచనా భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; షరతు రూపాన్ని పాదసూచికలో ఉంచింది.
- source_word: ἠκούσατε
  choice: విని ఉంటారు
  rationale: గతంలో విన్న విషయం ఇప్పటికీ వారికి తెలిసి ఉందనే సందర్భోచిత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οἰκονομίαν
  choice: నిర్వహించే బాధ్యత
  rationale: అప్పగించబడిన నిర్వహణ లేదా పరిపాలనా బాధ్యత అనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది; దీనిని కేవలం దేవుని రక్షణ ప్రణాళికగా పరిమితం చేయదు.
- source_word: χάριτος τοῦ θεοῦ
  choice: దేవుని కృప
  rationale: దేవుని నుండి వచ్చే అనుగ్రహాన్ని సూచించే పౌలు వాడుకను, అలాగే పరిచితమైన బైబిలు పదసంపదను నిలుపుతుంది.
- source_word: τῆς δοθείσης μοι
  choice: నాకు అనుగ్రహించబడిన
  rationale: సమీప పదమైన ‘కృప’ను విశేషించే స్త్రీలింగ కృదంత నిర్మాణాన్ని అనుసరిస్తూ, ఆ కృప దేవుని చేత ఇవ్వబడిందనే కర్మణి భావాన్ని నిలుపుతుంది.
- source_word: εἰς ὑμᾶς
  choice: మీ కోసం
  rationale: పౌలుకు అప్పగించబడిన కృపా పరిచర్య పాఠకుల మేలు కోసం, వారి వైపు ఉద్దేశించబడిందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘దేవుని కృపను నిర్వహించే బాధ్యత’ అనే పదబంధం దేనిని సూచిస్తుంది?
  choice: పాఠకుల కోసం దేవుని కృపకు సంబంధించిన పరిచర్యను నిర్వహించమని పౌలుకు అప్పగించబడిన బాధ్యత
  alternative: దేవుని రక్షణ ప్రణాళిక లేదా యుగపరమైన ఏర్పాటు
  rationale: తక్షణ సందర్భం అన్యజనుల పట్ల పౌలుకు అప్పగించబడిన పరిచర్యను ప్రధానంగా చూపుతుంది. ‘నిర్వహించే బాధ్యత’ వ్యక్తిగతంగా అప్పగించబడిన సేవను నిలుపుతూ, దాని వెనుక ఉన్న విశాలమైన దేవుని ప్రణాళికను నిరాకరించదు.
- issue: εἴ γε యొక్క భావబలం
  choice: నిజమని పౌలు ఆశించే అలంకారిక అంచనా
  alternative: ‘మీరు నిజంగా విని ఉంటే’ అనే యథార్థ షరతు
  rationale: పౌలు నిజంగా సందేహిస్తున్నట్టు కాకుండా, పాఠకులు ఈ విషయాన్ని విని ఉన్నారని భావిస్తూ మాట్లాడుతున్నాడు. ప్రధాన పాఠ్యం ఆ సంభాషణాత్మక భావాన్ని ఇస్తుంది; గ్రీకు షరతు రూపం పాదసూచికలో భద్రపరచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కృప’ అనే స్థిరమైన పౌలీయ పదాన్ని నిలిపి, అరుదైన ‘గృహనిర్వాహకత్వం’ వంటి కృత్రిమ పదానికి బదులుగా ‘నిర్వహించే బాధ్యత’ వాడబడింది. ప్రధాన పాఠ్యంలోని [a], [b] గుర్తులు సంబంధిత పాదసూచికలకు సరిపోతాయి.
