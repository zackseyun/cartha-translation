id: EPH.3.8
reference: Ephesians 3:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐμοὶ τῷ ἐλαχιστοτέρῳ πάντων ἁγίων ἐδόθη ἡ χάρις αὕτη— ⸀τοῖς ἔθνεσιν εὐαγγελίσασθαι ⸂τὸ ἀνεξιχνίαστον πλοῦτος⸃ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/008.yaml
  text: To me[a], the very least of all the saints, this grace was given—to proclaim to the Gentiles the unsearchable riches of Messiah[c][b],
translation:
  language: te
  text: పరిశుద్ధులందరిలోకెల్లా అత్యల్పుడనైన నాకు[c] ఈ కృప అనుగ్రహించబడింది—అన్యజనులకు[b] మెస్సీయ[a] యొక్క అంతుచిక్కని ఐశ్వర్యాన్ని సువార్తగా ప్రకటించడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు.’ గ్రీకు బిరుదైన Χριστόςను ‘మెస్సీయ’ లేదా ‘క్రీస్తు’ అని అనువదించవచ్చు; ఇక్కడ బిరుదు అర్థాన్ని తెలియజేయడానికి ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘జనాలకు.’ ఈ సందర్భంలో పౌలు ముఖ్యంగా యూదేతర ప్రజలను, అంటే అన్యజనులను ఉద్దేశిస్తున్నాడు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థానికి దగ్గరగా, ‘పరిశుద్ధులందరిలో అత్యల్పుడికంటే కూడా అల్పుడనైన నాకు.’ ఈ అసాధారణ రూపం పౌలు గాఢమైన వినయాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλαχιστοτέρῳ
  choice: అత్యల్పుడనైన
  rationale: అసాధారణమైన తులనాత్మక-అత్యుత్తమ రూపం పౌలు వ్యక్తం చేసిన గాఢమైన వినయాన్ని సూచిస్తుంది. ‘అత్యల్పుడనైన’ అనేది సహజమైన ఆధునిక తెలుగు; మూలంలోని అతిశయ బలాన్ని ‘అందరిలోకెల్లా’ మరింత స్పష్టం చేస్తుంది.
- source_word: ἁγίων
  choice: పరిశుద్ధులు
  rationale: పౌలు వాడుకలో ఇది దేవునికి ప్రత్యేకపరచబడిన విశ్వాసులను సూచిస్తుంది. ‘పరిశుద్ధులు’ సంక్షిప్తంగా ఉండి గ్రీకు పదానికి సన్నిహితంగా ఉంది.
- source_word: χάρις
  choice: కృప
  rationale: ఇక్కడ దేవుడు దయతో ఇచ్చిన అనుగ్రహాన్నీ, దానితో కూడిన పరిచర్య బాధ్యతనూ సూచిస్తుంది. ‘కృప’ ఈ రెండు కోణాలను నిలుపుతుంది.
- source_word: ἔθνεσιν
  choice: అన్యజనులకు
  rationale: ఈ సందర్భంలో భౌగోళిక దేశాలకన్నా యూదేతర ప్రజలే ఉద్దేశించబడ్డారు. ‘అన్యజనులు’ ఆ యూదు–యూదేతర వ్యత్యాసాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εὐαγγελίσασθαι
  choice: సువార్తగా ప్రకటించడానికి
  rationale: ఈ క్రియ శుభవార్తను ప్రకటించడాన్ని సూచిస్తుంది. తరువాత వచ్చే ప్రత్యక్ష కర్మతో సహజంగా కలిసేలా ‘సువార్తగా ప్రకటించడానికి’ అని అనువదించబడింది.
- source_word: ἀνεξιχνίαστον
  choice: అంతుబట్టని
  rationale: పూర్తిగా వెదికి గ్రహించలేనిదనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; పరిమాణం మాత్రమే కాక మానవ అవగాహనకు అందని గుణాన్నీ నిలుపుతుంది.
- source_word: πλοῦτος
  choice: ఐశ్వర్యం
  rationale: క్రీస్తులో ఉన్న రక్షణ సంబంధమైన సమృద్ధికి పౌలు ఉపయోగించే రూపకాన్ని ‘ఐశ్వర్యం’ నిలుపుతుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ యొక్క
  rationale: Χριστός ఇక్కడ అభిషిక్తుని బిరుదుగా ఉంది. అందువల్ల దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ వాడబడింది; షష్ఠీ విభక్తిలోని విస్తృత సంబంధాన్ని ముందుగానే కుదించకుండా ‘యొక్క’ ఉంచబడింది.
theological_decisions:
- issue: Χριστοῦ అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός నామంలా కాక అభిషిక్తుని బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని వెల్లడిస్తుంది; సుపరిచితమైన ‘క్రీస్తు’ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: τοῖς ἔθνεσιν యొక్క సందర్భార్థం
  choice: అన్యజనులకు
  alternative: జనాలకు / దేశాలకు
  rationale: ఎఫెసీయులకు 2–3 అధ్యాయాల్లోని యూదులు–అన్యజనులు అనే సందర్భం యూదేతర ప్రజలను సూచిస్తుంది. అయినా గ్రీకు పదానికి విస్తృతంగా ‘జనాలు’ అనే అర్థం ఉండటాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూల వాక్యంలోని ‘నాకు ... ఈ కృప అనుగ్రహించబడింది’ అనే కేంద్రీకరణను, తరువాతి ఉద్దేశార్థక నిర్మాణాన్ని డాష్‌తో నిలిపాం. ‘మెస్సీయ యొక్క’ కొద్దిగా ఔపచారికమైనప్పటికీ, గ్రీకు షష్ఠీ సంబంధాన్ని ‘మెస్సీయలోని’ లేదా ‘మెస్సీయకు చెందిన’ అని ఏకార్థం చేయకుండా కాపాడుతుంది.
