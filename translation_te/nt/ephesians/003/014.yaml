id: EPH.3.14
reference: Ephesians 3:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τούτου χάριν κάμπτω τὰ γόνατά μου πρὸς τὸν ⸀πατέρα,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/014.yaml
  text: For this reason I bend my knees to the Father,
translation:
  language: te
  text: ఈ కారణంగా నేను తండ్రి ఎదుట మోకాళ్లు వంచుతున్నాను,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τούτου χάριν
  choice: ఈ కారణంగా
  rationale: ఈ పదబంధం తరువాత చెప్పబోయే ప్రార్థనకు ముందున్న సందర్భమే కారణమని సూచిస్తుంది. ‘ఈ కారణంగా’ అనేది సహజమైన ఆధునిక తెలుగు ప్రయోగం; సందర్భ సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: κάμπτω
  choice: వంచుతున్నాను
  rationale: మూల క్రియకు అక్షరార్థంగా ‘వంచు’ అనే భావం ఉంది. ‘మోకాళ్లు’ అనే కర్మను ఉంచడంతో ప్రార్థనలోని శరీర భంగిమకు సంబంధించిన మూల చిత్రణ నిలుస్తుంది.
- source_word: τὰ γόνατά μου
  choice: మోకాళ్లు
  rationale: తెలుగులో కర్త ఇప్పటికే ‘నేను’గా ఉన్నందున ‘నా మోకాళ్లు’ అని చెప్పకపోయినా స్వామ్య భావం సహజంగా తెలుస్తుంది. శరీర భాగాన్ని తొలగించి కేవలం ‘మోకరిల్లుతున్నాను’ అని అనువదించకుండా మూలంలోని స్పష్టమైన చిత్రణను నిలిపింది.
- source_word: πρὸς
  choice: ఎదుట
  rationale: ఇక్కడ πρός ప్రార్థన ఎవరిని ఉద్దేశించి చేయబడుతుందో, ఆయన వైపు ఉన్న దిశాభిముఖతను సూచిస్తుంది. తెలుగులో మోకాళ్లు వంచే ప్రార్థనా భంగిమతో ‘తండ్రి ఎదుట’ సహజంగా ఉంటుంది; ఇది దేవుని సన్నిధిలోని భంగిమను అనవసరంగా విస్తరించదు.
- source_word: πατέρα
  choice: తండ్రి
  rationale: సందర్భంలో ఇది ప్రార్థన అందుకునే దేవుణ్ణి సూచిస్తుంది. తెలుగులో ‘తండ్రి’ అనే సంబోధనాత్మక దైవ బిరుదు సహజంగా ఈ అర్థాన్ని అందిస్తుంది.
theological_decisions:
- issue: πατέραను దైవ బిరుదుగా అనువదించాలా
  choice: తండ్రి
  alternative: ఒక తండ్రి / తండ్రిని ఉద్దేశించి
  rationale: పౌలు ఇక్కడ దేవునికి ప్రార్థిస్తున్నాడు; తరువాతి వచనం కూడా తండ్రిత్వ భాషను కొనసాగిస్తుంది. కాబట్టి నిర్దిష్ట దైవ సూచనగా ‘తండ్రి’ అనడం సందర్భానుగుణం; అయితే మూలంలో లేని అదనపు వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనదైనా సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. గ్రీకు వాక్యం తదుపరి వచనాల్లో కొనసాగుతున్నందున చివర కామాను ఉంచాం.
