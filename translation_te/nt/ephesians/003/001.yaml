source:
  edition: SBLGNT
  text: Τούτου χάριν ἐγὼ Παῦλος ὁ δέσμιος τοῦ Χριστοῦ Ἰησοῦ ὑπὲρ ὑμῶν τῶν ἐθνῶν—
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/001.yaml
  text: For this reason I[a], Paul[c][b], the prisoner of Messiah Jesus on behalf of you Gentiles—
translation:
  language: te
  text: ఈ కారణంగా, అన్యజనులైన మీ నిమిత్తం మెస్సీయ యేసు[a] ఖైదీనైన పౌలు అనే నేను—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “క్రీస్తు యేసు.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: Τούτου χάριν
  choice: ఈ కారణంగా
  rationale: ముందటి వాదనను ఆధారంగా చేసుకొని వచ్చే నిర్ధారణను సూచించే సహజమైన తెలుగు ప్రయోగం.
- source_word: ἐγὼ Παῦλος
  choice: పౌలు అనే నేను
  rationale: స్పష్టంగా ఉన్న ἐγώ ఇచ్చే ఉద్ఘాటనను, పౌలు అనే స్వపరిచయాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὁ δέσμιος
  choice: ఖైదీనైన
  rationale: నిర్బంధంలో ఉన్న వ్యక్తిని నేరుగా సూచిస్తుంది; మూలంలో లేని సంకెళ్ల భావాన్ని అదనంగా చేర్చదు.
- source_word: τοῦ Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστός ఇక్కడ యేసుకు సంబంధించిన బిరుదుగా ఉంది; అందువల్ల పేరులా లిప్యంతరీకరించకుండా బిరుదు భావాన్ని తెలియజేసే ‘మెస్సీయ’ను వాడింది. షష్ఠీ సంబంధంలోని విస్తృత భావాన్ని ‘ఖైదీ’తో సహజంగా అనుసంధానిస్తూ ఉద్దేశపూర్వకంగా తెరిచి ఉంచింది.
- source_word: ὑπὲρ ὑμῶν
  choice: మీ నిమిత్తం
  rationale: పౌలు ఖైదు అన్యజనుల ప్రయోజనంతో సంబంధమున్నదనే ప్రయోజనార్థక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘తరఫున’ అనే ప్రతినిధిత్వ భావానికే పరిమితం చేయదు.
- source_word: τῶν ἐθνῶν
  choice: అన్యజనులైన
  rationale: ఇక్కడ సంబోధించబడుతున్న యూదేతరులను సూచిస్తుంది; భౌగోళిక దేశాలు లేదా జనాంగాలు అనే అర్థం సందర్భానికి తగదు.
theological_decisions:
- issue: Χριστοῦను బిరుదుగా అనువదించాలా, సంప్రదాయ నామరూపంగా ఉంచాలా
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: మూలంలో Χριστός యేసుకు సంబంధించిన బిరుదు. ప్రధాన పాఠ్యంలో దాని బిరుదు స్వభావాన్ని స్పష్టంగా ఉంచి, సుపరిచితమైన సంప్రదాయ రూపాన్ని పాదసూచికలో ఇచ్చింది.
- issue: τοῦ Χριστοῦ Ἰησοῦ అనే షష్ఠీ సంబంధాన్ని ఎలా అర్థం చేయాలి
  choice: మెస్సీయ యేసు ఖైదీ
  alternative: మెస్సీయ యేసు కోసం ఖైదీ అయినవాడు
  rationale: షష్ఠీ రూపం పౌలు మెస్సీయకు చెందినవాడనే భావాన్నీ, ఆయన సేవ కారణంగా ఖైదీ అయ్యాడనే సందర్భార్థాన్నీ మోయగలదు. ప్రధాన పాఠ్యం ఒకే వివరణను బలవంతంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. వాక్యం తరువాతి వచనాల్లో కొనసాగకుండా మధ్యలో విరిగిన గ్రీకు వాక్యనిర్మాణాన్ని చివరి దీర్ఘవిరామంతో నిలిపింది.
