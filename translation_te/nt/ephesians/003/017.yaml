source:
  edition: SBLGNT
  text: κατοικῆσαι τὸν Χριστὸν διὰ τῆς πίστεως ἐν ταῖς καρδίαις ὑμῶν ἐν ἀγάπῃ· ἐρριζωμένοι καὶ τεθεμελιωμένοι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/017.yaml
  text: so that Messiah may dwell in your hearts through faith[a], being rooted and grounded in love[c][b],
translation:
  language: te
  text: విశ్వాసం[b] ద్వారా మెస్సీయ[a] మీ హృదయాల్లో నివసించేలా, మీరు ప్రేమలో[c] వేర్లు పాతబడి, పునాది వేసి స్థిరపరచబడినవారై ఉండేలా,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్రీస్తు.’ గ్రీకు Χριστός అంటే ‘అభిషిక్తుడు’ అనే బిరుదు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘నమ్మకం ద్వారా.’ ఇక్కడ గ్రీకు πίστις‌కు ‘విశ్వాసం’ అనే భావమే సందర్భానికి బాగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: c
    text: ‘ప్రేమలో’ అనే మాట సహజంగా ‘వేర్లు పాతబడి, పునాది వేసి స్థిరపరచబడినవారై’ అనే తరువాతి మాటలతో అనుసంధానమవుతుంది; కొందరు దాన్ని ‘మీ హృదయాల్లో నివసించేలా’ అనే ముందు భాగంతో కలుపుతారు.
    reason: alternative_reading
lexical_decisions:
- source_word: κατοικῆσαι
  choice: నివసించేలా
  rationale: ఈ క్రియ ముందున్న ప్రార్థనపై ఆధారపడిన aorist infinitive. ‘నివసించేలా’ అనేది ఉద్దేశం లేదా ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, స్థిరంగా నివాసం ఉండే భావాన్ని నిలుపుతుంది.
- source_word: τὸν Χριστόν
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ దాని బిరుదు స్వభావాన్ని నిలుపుతూ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో గుర్తించదగిన రూపం.
- source_word: διὰ τῆς πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: ఈ సందర్భంలో πίστις మెస్సీయ హృదయాల్లో నివసించడానికి సాధనాన్ని సూచిస్తుంది; అందువల్ల ‘విశ్వాసం’ అత్యంత సహజమైన ఎంపిక.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: మీ హృదయాల్లో
  rationale: ఇది కేవలం భావోద్వేగాలను కాక అంతరంగ వ్యక్తిని సూచించే ప్రామాణిక రూపకం; తెలుగు భాషలోనూ ‘హృదయాలు’ ఆ భావాన్ని సహజంగా మోస్తుంది.
- source_word: ἐν ἀγάπῃ
  choice: ప్రేమలో
  rationale: ఈ పదబంధాన్ని తరువాతి రెండు participles‌తో కలిపి, వారు వేరూని పునాది వేయబడిన స్థితి లేదా పరిధిని సూచించేలా అనువదించబడింది.
- source_word: ἐρριζωμένοι
  choice: వేరూని
  rationale: Perfect passive participle సూచించే, గతంలో ఏర్పడి ఇప్పుడు కొనసాగుతున్న స్థితిని సహజమైన వ్యవసాయ రూపకంతో వ్యక్తం చేస్తుంది.
- source_word: τεθεμελιωμένοι
  choice: పునాది వేయబడినవారై
  rationale: Perfect passive రూపాన్నీ నిర్మాణ రూపకాన్నీ స్పష్టంగా నిలుపుతుంది; ముందు ఉన్న వ్యవసాయ రూపకంతో ఉద్దేశపూర్వకమైన మిశ్రమ రూపకాన్ని మార్చదు.
theological_decisions:
- issue: Χριστός పదం యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ పదం వ్యక్తినామంలా కాక అభిషిక్త రాజు అనే బిరుదుగా గ్రహించవచ్చు. ‘మెస్సీయ’ ఆ బిరుదు స్వభావాన్ని స్పష్టంగా ఉంచుతుంది; సాధారణ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: διὰ τῆς πίστεως లో πίστις భావం
  choice: విశ్వాసం ద్వారా
  alternative: నమ్మకం ద్వారా
  rationale: ఈ వాక్యంలో విశ్వాసమే ప్రధాన సందర్భార్థం. ‘నమ్మకం’ సాధ్యమైనప్పటికీ, ‘విశ్వాసం’ సంబంధాత్మకమైన నమ్మకాన్ని మెరుగ్గా వ్యక్తం చేస్తుంది.
- issue: ἐν ἀγάπῃ పదబంధం దేనితో కలుస్తుంది
  choice: ‘వేరూని, పునాది వేయబడినవారై’ అనే తరువాతి పదాలతో
  alternative: ‘మీ హృదయాల్లో నివసించేలా’ అనే ముందు భాగంతో
  rationale: పదక్రమం మరియు వాక్యప్రవాహం ‘ప్రేమలో’ను తరువాతి participles‌తో కలపడానికి అనుకూలిస్తాయి; అయితే మరో వ్యాకరణ సంబంధం సాధ్యమని పాదసూచికలో నిలుపబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. మూలంలోని వ్యవసాయ, నిర్మాణ రూపకాలు రెండూ ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి. వాక్యం ముందున్న ప్రార్థనా వాక్యంపై ఆధారపడే భాగమని చివరి కామా సూచిస్తుంది.
