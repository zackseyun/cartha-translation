id: EPH.3.5
reference: Ephesians 3:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃ ἑτέραις γενεαῖς οὐκ ἐγνωρίσθη τοῖς υἱοῖς τῶν ἀνθρώπων ὡς νῦν ἀπεκαλύφθη τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις ἐν πνεύματι,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/005.yaml
  text: which was not made known to the sons of men in other generations as it has now been revealed to his holy apostles and prophets in the Spirit[b][a],
translation:
  language: te
  text: ఇతర తరాలలో మానవులకు[b], ఇప్పుడు ఆయన పరిశుద్ధ అపొస్తలులకు, ప్రవక్తలకు ఆత్మలో[a] బయలుపరచబడిన విధంగా ఆ రహస్యం తెలియజేయబడలేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆత్మ ద్వారా.” గ్రీకు పదబంధం పరిధిని గానీ సాధనాన్ని గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “మనుష్యుల కుమారులకు”; అంటే మానవులకు లేదా మానవజాతికి.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: ఆ రహస్యం
  rationale: నపుంసకలింగ సంబంధ సర్వనామం 4వ వచనంలోని ‘రహస్యం’ను సూచిస్తుంది. తెలుగులో ఒంటరి సంబంధ సర్వనామంతో వాక్యం అసహజంగా ఉండటంతో, పూర్వపదాన్ని స్పష్టంగా పునరుద్ధరించాం.
- source_word: ἑτέραις γενεαῖς
  choice: ఇతర తరాలవారికి
  rationale: γενεαῖς మరియు తరువాతి గ్రహీతల సూచన ఒకే దత్తివిభక్తి నిర్మాణంలో ఉన్నందున ‘ఇతర తరాలవారికి’ అని అనువదించాం; ఇది గత తరాల ప్రజలను సూచిస్తుంది.
- source_word: οὐκ ἐγνωρίσθη
  choice: తెలియజేయబడలేదు
  rationale: γνωρίζω యొక్క కర్మణి, కారణార్థక భావాన్ని—‘తెలిసియుండలేదు’ కాక ‘తెలియజేయబడలేదు’—కాపాడుతుంది.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: మానవులకు
  rationale: అక్షరార్థంగా ‘మనుష్యుల కుమారులకు’ అయిన ఈ సెమిటిక్ నుడికారం సమస్త మానవులను సూచిస్తుంది. ఆధునిక తెలుగులో సహజమైన సమగ్ర పదాన్ని ప్రధాన పాఠ్యంలో వాడి, మూలరూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ὡς νῦν
  choice: అయితే ఇప్పుడు ... బయలుపరచబడిన విధంగా అప్పుడు ... బయలుపరచబడలేదు
  rationale: ὡς లోని పోలికను స్పష్టంగా నిలుపుతూ, పూర్వకాలంలో అసలు ఎలాంటి జ్ఞానం లేదని అవసరానికి మించి తేల్చకుండా, అప్పటి మరియు ఇప్పటి ప్రకటన విధానం లేదా పరిమాణం మధ్య తేడాను వ్యక్తం చేస్తుంది.
- source_word: ἀπεκαλύφθη
  choice: బయలుపరచబడిన
  rationale: దాచబడినది వెల్లడికావడం అనే ప్రకటనార్థక భావాన్ని, కర్మణి రూపాన్ని నిలుపుతుంది.
- source_word: τοῖς ἁγίοις ἀποστόλοις αὐτοῦ καὶ προφήταις
  choice: దేవుని పరిశుద్ధ అపొస్తలులకు, ప్రవక్తలకు
  rationale: ἁγίοις రెండు సమన్విత నామవాచకాలకూ వర్తించేలా ‘పరిశుద్ధ’ను ఉంచాం. తెలుగు వాక్యంలో ‘ఆయన’కు పూర్వపదం ఈ వచనంలో లేకపోవడం వల్ల సందర్భానుసారంగా ‘దేవుని’ అని స్పష్టం చేశాం.
- source_word: ἐν πνεύματι
  choice: ఆత్మలో
  rationale: ἐν యొక్క ప్రాథమిక రూపాన్ని నిలుపుతూ, ప్రకటన జరిగే పరిధి అనే భావాన్ని వ్యక్తం చేస్తుంది; సాధనార్థకమైన ‘ఆత్మ ద్వారా’ కూడా సాధ్యమని పాదటిప్పణి తెలియజేస్తుంది.
theological_decisions:
- issue: πνεύματι యొక్క సూచన
  choice: దేవుని ఆత్మ / పరిశుద్ధాత్మ
  alternative: మానవ ఆత్మ లేదా ఆత్మసంబంధమైన స్థితి
  rationale: దైవిక ప్రకటనను అపొస్తలులు, ప్రవక్తలు పొందిన సందర్భం పరిశుద్ధాత్మను బలంగా సూచిస్తుంది; అయినా మూలంలో నిర్దిష్ట ఉపపదం లేకపోవడంతో ప్రధాన పాఠ్యంలో ‘ఆత్మ’ అని మాత్రమే ఉంచాం.
- issue: ὡς వల్ల పూర్వ ప్రకటన స్వరూపం
  choice: ఇప్పుడు బయలుపరచబడిన విధంగా గతంలో తెలియజేయబడలేదు
  alternative: గతంలో అసలు ఏమాత్రం తెలియజేయబడలేదు
  rationale: ὡς పోలిక విధానం లేదా పరిమాణాన్ని సూచించగలదు. అందువల్ల పాత నిబంధనలో పూర్వ సంకేతాలున్నాయా అనే ప్రశ్నను అనువాదం స్వయంగా తీర్చకుండా పోలికను నిలిపాం.
- issue: αὐτοῦ యొక్క సూచన
  choice: దేవుని
  alternative: క్రీస్తు యొక్క / ఆయన యొక్క
  rationale: విస్తృత సందర్భంలో తండ్రియైన దేవుడు ప్రకటనకు మూలంగా కనిపిస్తాడు; అయితే గ్రీకు సర్వనామం స్వయంగా నామాన్ని పునరుక్తి చేయదు. సహజమైన తెలుగుకోసం ‘దేవుని’ అని స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలిని అనుసరించాం. పొడవైన గ్రీకు సంబంధ వాక్యాన్ని తెలుగులో స్పష్టంగా చేయడానికి ‘ఆ రహస్యం’ను పునరుద్ధరించి, ὡς పోలికను ద్విభాగ నిర్మాణంతో వ్యక్తం చేశాం. అన్ని పాదటిప్పణి సూచికలు సంబంధిత పదాల వెంట ప్రధాన పాఠ్యంలో ఉన్నాయి.
