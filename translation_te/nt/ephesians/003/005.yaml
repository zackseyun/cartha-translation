revisions:
- from: ఆ రహస్యం ఇతర తరాలవారికి తెలియజేయబడలేదు; అయితే ఇప్పుడు అది దేవుని పరిశుద్ధ అపొస్తలులకు, ప్రవక్తలకు ఆత్మలో[a] బయలుపరచబడిన విధంగా అప్పుడు మానవులకు[b] బయలుపరచబడలేదు.
  to: ఇతర తరాలలో మానవులకు[b], ఇప్పుడు ఆయన పరిశుద్ధ అపొస్తలులకు, ప్రవక్తలకు ఆత్మలో[a] బయలుపరచబడిన విధంగా ఆ రహస్యం తెలియజేయబడలేదు.
