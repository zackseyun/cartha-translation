  text: పరలోకంలోను భూమిమీదను ఉన్న ప్రతి కుటుంబం ఆయన నుంచే పేరు పొందుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పరలోకంలోను భూమిమీదను ఉన్న మొత్తం కుటుంబం ఆయన నుంచే పేరు పొందుతుంది”; మరింత వ్యాఖ్యానాత్మకంగా, “పరలోకంలోను భూమిమీదను ఉన్న సమస్త పితృత్వం తన పేరును ఆయన నుంచే పొందుతుంది.”
    reason: πᾶσα πατριά అనే పదబంధానికి ‘ప్రతి కుటుంబం,’ ‘మొత్తం కుటుంబం,’ లేదా మునుపటి వచనంలోని ‘తండ్రి’తో పదచమత్కారాన్ని ముందుకు తెచ్చే వ్యాఖ్యానాత్మక ‘సమస్త పితృత్వం’ అనే అర్థసాధ్యతలు ఉన్నాయి.
lexical_decisions:
- source_word: ἐξ οὗ
  choice: ఆయన నుంచే
  rationale: ἐξ + సంబంధవాచక సర్వనామం మూలాన్ని సూచిస్తూ ‘ఎవరి నుండి’ అనే అర్థం ఇస్తుంది. తెలుగు వాక్యంలో ‘ఆయన నుంచే’ సహజంగా ఉండి, పేరుకు మూలం ఆయనే అనే భావాన్ని నిలుపుతుంది.
- source_word: πᾶσα
  choice: ప్రతి
  rationale: ఏకవచన నామవాచకంతో πᾶσα ఇక్కడ విభాజకార్థంలో ‘ప్రతి’ అని సహజంగా అర్థమవుతుంది. ‘మొత్తం’ అనే సామూహిక అర్థం సాధ్యమైనందున దాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: πατριὰ
  choice: కుటుంబం
  rationale: πατριά సాధారణంగా కుటుంబ సమూహం, వంశం లేదా కులగుంపును సూచిస్తుంది. ఆధునిక తెలుగులో ‘కుటుంబం’ స్పష్టమైన సమానార్థకం; ముందు వచనంలోని πατήρతో ఉన్న పదసంబంధాన్ని వ్యాఖ్యానాత్మకంగా ‘పితృత్వం’గా మార్చలేదు.
- source_word: ἐν οὐρανοῖς
  choice: పరలోకంలో
  rationale: గ్రీకులో బహువచనం ఉన్నప్పటికీ, పరలోక పరిధిని సూచించడానికి ఆధునిక తెలుగులో ‘పరలోకంలో’ సహజమైన ప్రయోగం.
- source_word: ἐπὶ γῆς
  choice: భూమిమీద
  rationale: స్థానార్థకమైన ఈ పదబంధానికి ‘భూమిమీద’ సహజమైన, నేరమైన తెలుగు రూపం.
- source_word: ὀνομάζεται
  choice: పేరు కలిగింది
  rationale: వర్తమాన కర్మణి రూపం నేరుగా ‘పేరు పెట్టబడుతుంది/పిలువబడుతుంది’ అని అర్థమవుతుంది. అయితే ἐξ οὗతో కలిసి పేరు మూలాన్ని తెలిపే భావం ఉన్నందున తెలుగులో ‘పేరు కలిగింది’ సహజంగా వ్యక్తమవుతుంది; మరింత వ్యాఖ్యానాత్మకమైన ‘పేరు ఉద్భవిస్తుంది’ను పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: మునుపటి వచనంలోని ‘తండ్రి’కి πᾶσα πατριὰకు ఉన్న సంబంధం
  choice: ప్రతి కుటుంబం
  alternative: పరలోకంలోను భూమిమీదను ఉన్న మొత్తం కుటుంబం; పరలోకంలోను భూమిమీదను ఉన్న సమస్త పితృత్వం
  rationale: πατήρ (‘తండ్రి’) మరియు πατριά (‘కుటుంబం/వంశం’) మధ్య పదచమత్కారం ఉండవచ్చు. ప్రధాన పాఠంలో సాధారణ నిఘంటు అర్థమైన ‘కుటుంబం’ను, πᾶσα యొక్క విభాజకార్థమైన ‘ప్రతి’ని ఉంచడం ద్వారా ఒకే విశ్వవ్యాప్త కుటుంబమా లేక ప్రతి కుటుంబ సమూహమా అనే సాధ్యమైన అర్థభేదాన్ని బలవంతంగా పరిష్కరించలేదు. ప్రత్యామ్నాయాలను పాదటిప్పణిలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు సులభంగా ఉండే నిర్మాణం. ‘పేరు పెట్టబడింది’కన్నా ‘పేరు కలిగింది’ మూలం/నామకరణ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో చేర్చబడింది.
