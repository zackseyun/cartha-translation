    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς ὃ … ἀναγινώσκοντες
  choice: దీన్ని చదివినప్పుడు
  rationale: πρὸς ὃ ముందుగా రాసిన విషయాన్ని సూచిస్తుంది; ἀναγινώσκοντες‌తో కలిపి, తెలుగు సహజ వాక్యనిర్మాణంలో ‘దీన్ని చదివినప్పుడు’ అని చెప్పడం ఆ పాఠ్యసంబంధాన్ని, చదవడం ద్వారా గ్రహించే భావాన్ని నిలుపుతుంది.
- source_word: δύνασθε
  choice: మీరు … గ్రహించగలరు
  rationale: సామర్థ్యాన్ని తెలిపే క్రియను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: νοῆσαι
  choice: గ్రహించగలరు
  rationale: మనసుతో అర్థం చేసుకోవడం లేదా పసిగట్టడం అనే భావాన్ని ‘గ్రహించు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὴν σύνεσίν μου
  choice: నాకున్న అవగాహనను
  rationale: పౌలుకు ఉన్న అవగాహన లేదా అంతర్దృష్టిని సూచిస్తుంది; νοῆσαιతో ఒకే తెలుగు పదాన్ని అనవసరంగా పునరావృతం చేయకుండా భావభేదాన్ని కాపాడుతుంది.
- source_word: ἐν τῷ μυστηρίῳ
  choice: మర్మం విషయంలో
  rationale: ἐν ఇక్కడ అవగాహనకు సంబంధించిన పరిధిని సూచిస్తుంది. ‘విషయంలో’ అనేది తెలుగు సహజ ప్రయోగం; ‘లో’ అనే కఠిన అనువాదం కలిగించే అస్పష్టతను నివారిస్తుంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది. అందువల్ల దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో వాడి, సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: τοῦ Χριστοῦ అనువాదం మరియు షష్ఠీ సంబంధం
  choice: మెస్సీయ మర్మం
  alternative: క్రీస్తు మర్మం; మెస్సీయను గురించిన మర్మం
  rationale: Χριστόςను బిరుదుగా ‘మెస్సీయ’ అని అనువదించాం. ‘మెస్సీయ మర్మం’ అనే నిర్మాణం మూలంలోని షష్ఠీ సంబంధాన్ని పూర్తిగా వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది; అది మెస్సీయకు సంబంధించిన మర్మమనే భావాన్ని సందర్భం తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని వాక్యసంబంధాన్ని ‘దీన్ని’ ద్వారా స్పష్టంగా ఉంచి, షష్ఠీ సంబంధాన్ని అతిగా వ్యాఖ్యానించలేదు.
