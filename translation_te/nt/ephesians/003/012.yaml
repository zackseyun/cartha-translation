id: EPH.3.12
reference: Ephesians 3:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ᾧ ἔχομεν τὴν παρρησίαν ⸀καὶ προσαγωγὴν ἐν πεποιθήσει διὰ τῆς πίστεως αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/003/012.yaml
  text: in whom we have boldness and access with confidence through faith in him[a].
translation:
  language: te
  text: ఆయనలో మనకు ధైర్యమూ, ఆయనపై విశ్వాసం ద్వారా నమ్మకంతో దేవుని సమీపించే అవకాశమూ ఉన్నాయి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన విశ్వసనీయత ద్వారా.’ గ్రీకు పదబంధం ఆయనపై ఉంచే విశ్వాసాన్ని గానీ, ఆయన సొంత విశ్వసనీయతను గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: ఆయనలో
  rationale: పుంలింగ ఏకవచన సంబంధ సర్వనామం మునుపటి సందర్భంలోని క్రీస్తును సూచిస్తుంది; ‘ఆయనలో’ అనే అనువాదం క్రీస్తుతో సంబంధం అనే భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: παρρησίαν
  choice: ధైర్యం
  rationale: ఈ పదం బహిరంగత, సంకోచంలేని మాట, ధైర్యం అనే భావాలను ఇస్తుంది. ఇక్కడ దేవుని సమీపించే సందర్భంలో ‘ధైర్యం’ సహజంగా ఉంది; తరువాతి πεποίθησις భావంతో పూర్తిగా కలిసిపోకుండా ఉంటుంది.
- source_word: προσαγωγὴν
  choice: దేవుని సమీపించే అవకాశం
  rationale: పౌలు వాడుకలో ఇది దేవుని సన్నిధిలోకి ప్రవేశం లేదా ఆయనను సమీపించే వీలును సూచిస్తుంది. తెలుగులో కేవలం ‘ప్రవేశం’ కంటే ఈ రూపం సందర్భార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐν πεποιθήσει
  choice: నమ్మకంతో
  rationale: తోడుగా ఉండే దృఢనిశ్చయాన్ని సూచించే ఈ పదబంధాన్ని ఆధునిక తెలుగులో ‘నమ్మకంతో’ అని సహజంగా వ్యక్తపరచవచ్చు; ఇది ‘ధైర్యం’తో సంబంధమున్నా దానిని పునరుక్తి చేయదు.
- source_word: διὰ τῆς πίστεως αὐτοῦ
  choice: ఆయనపై విశ్వాసం ద్వారా
  rationale: αὐτοῦను ఉద్దేశ్య షష్ఠీగా గ్రహిస్తే, విశ్వాసం క్రీస్తువైపు మళ్లినదని అర్థం. గ్రీకు పదబంధంలో ఉన్న ప్రత్యామ్నాయమైన ‘ఆయన విశ్వసనీయత ద్వారా’ అనే భావాన్ని పాదటిప్పణిలో నిలిపాం.
theological_decisions:
- issue: διὰ τῆς πίστεως αὐτοῦ యొక్క అర్థం
  choice: ఆయనపై విశ్వాసం ద్వారా
  alternative: ఆయన విశ్వసనీయత ద్వారా
  rationale: αὐτοῦను ఉద్దేశ్య షష్ఠీగా గానీ కర్తృ షష్ఠీగా గానీ అర్థం చేసుకోవచ్చు. విశ్వాసుల ప్రస్తుత సమీపించే అవకాశంపై వాక్యం దృష్టి పెట్టడం వల్ల ప్రధాన పాఠ్యంలో మొదటి అర్థాన్ని ఎంచుకున్నాం; నిజమైన వ్యాకరణ, దైవశాస్త్ర అనిశ్చితిని పాదటిప్పణిలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘దేవుని’ అనే పదాన్ని మూలంలో అంతర్లీనంగా ఉన్న సమీపింపబడే వ్యక్తిని తెలుగులో స్పష్టంచేయడానికి చేర్చాం; దీనివల్ల προσαγωγή యొక్క సందర్భార్థం సహజంగా వ్యక్తమవుతుంది.
