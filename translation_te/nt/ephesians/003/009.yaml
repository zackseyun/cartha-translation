translation:
  language: te
  text: మరియు, సమస్తాన్ని సృష్టించిన దేవునిలో యుగాల నుండి దాచబడి ఉన్న మర్మపు నిర్వహణ ఏమిటో అందరికీ వెలుగులోకి తేవడానికి,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωτίσαι
  choice: వెలుగులోకి తేవడానికి
  rationale: ఇది పౌలు తెలిపే ఉద్దేశాన్ని కొనసాగిస్తూ, మూలంలోని వెలుగు రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πάντας
  choice: అందరికీ
  rationale: ఇక్కడ వ్యక్తులందరినీ సూచించే విశ్వవ్యాప్త పరిధిని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τίς ἡ οἰκονομία
  choice: నిర్వహణ ఏమిటో
  rationale: οἰκονομίαలోని నిర్వహణ, బాధ్యత, అమలు అనే భావపరిధిని కాపాడుతుంది; దానిని కేవలం ‘ప్రణాళిక’గా పరిమితం చేయదు.
- source_word: μυστήριον
  choice: మర్మం
  rationale: మునుపు దాచబడి ఇప్పుడు బయలుపరచబడుతున్న దేవుని ఉద్దేశాన్ని సూచించే పౌలు వాడుకకు ‘మర్మం’ తగినది.
- source_word: ἀποκεκρυμμένου
  choice: దాచబడి ఉన్న
  rationale: గతంలో దాచబడిన చర్య ఫలితంగా కొనసాగిన స్థితిని గ్రీకు పరిపూర్ణ కర్మణి రూపానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: ἀπὸ τῶν αἰώνων
  choice: యుగాలనుండి
  rationale: మూలంలోని ‘యుగాలనుండి’ అనే కాలవ్యాప్తిని నిలుపుతూ, ‘నిత్యత్వంనుండి’ అనే మరింత వ్యాఖ్యానాత్మక భావాన్ని రుద్దదు.
- source_word: ἐν τῷ θεῷ
  choice: దేవునిలో
  rationale: ἐν యొక్క నేరమైన స్థానార్థాన్ని కాపాడి, మర్మం దేవునిలో దాచబడి ఉందనే వాక్యంలోని theological tensionను అలాగే ఉంచుతుంది.
- source_word: τῷ τὰ πάντα κτίσαντι
  choice: సమస్తాన్ని సృష్టించిన
  rationale: దేవుణ్ణి వర్ణించే గ్రీకు విశేషణాత్మక కృదంతాన్ని సహజమైన తెలుగు సంబంధార్థక నిర్మాణంగా అందిస్తుంది.
theological_decisions:
- issue: మర్మంతో οἰκονομίαకు ఉన్న సంబంధం
  choice: నిర్వహణ
  alternative: బాధ్యతాయుత నిర్వహణ; ప్రణాళిక
  rationale: మర్మం యొక్క అమలు లేదా నిర్వహణ భావాన్ని నిలుపుతుంది; తరువాతి కాలపు ప్రత్యేక సిద్ధాంత పదజాలాన్ని అనవసరంగా దిగుమతి చేయదు.
- issue: ἀπὸ τῶν αἰώνων యొక్క కాలార్థం
  choice: యుగాలనుండి
  alternative: యుగాలుగా; నిత్యత్వంనుండి
  rationale: గ్రీకు పాఠం స్పష్టంగా ‘యుగాలు’ అని చెప్పే మేరకే అనువదించి, అది తప్పనిసరిగా ‘నిత్యత్వం’ అని నిర్ణయించకుండా అసలు పాఠంలోని భావ ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘వెలుగులోకి తేవడం’ అనే రూపకం, ‘మర్మం,’ ‘దేవునిలో,’ ‘యుగాలనుండి’ వంటి మూలపాఠ లక్షణాలు ఉద్దేశపూర్వకంగా నిలుపబడ్డాయి. ఇది ముందరి వాక్యంతో కొనసాగే ఉద్దేశార్థక భాగం కావడంతో చివర కామా ఉంచబడింది.
