id: EPH.6.12
reference: Ephesians 6:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι οὐκ ἔστιν ἡμῖν ἡ πάλη πρὸς αἷμα καὶ σάρκα, ἀλλὰ πρὸς τὰς ἀρχάς, πρὸς τὰς ἐξουσίας, πρὸς τοὺς κοσμοκράτορας τοῦ ⸀σκότους τούτου, πρὸς τὰ πνευματικὰ τῆς πονηρίας ἐν τοῖς ἐπουρανίοις.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/012.yaml
  text: For our struggle is not against flesh and blood[a], but against the rulers, against the authorities, against the world-rulers of this darkness[c][b], against the spiritual forces of evil in the heavenly realms.
translation:
  language: te
  text: ఎందుకంటే మన పోరాటం రక్తమాంసాలతో[a] కాదు, కానీ పాలకులతో, అధికారులతో, ఈ చీకటికి చెందిన లోకాధిపతులతో[b], పరలోక ప్రాంతాల్లో[c] ఉన్న దుష్టత్వపు ఆత్మిక శక్తులతో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన పెనుగులాట రక్తమాంసాలతో కాదు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఈ ప్రస్తుత చీకటికి చెందిన లోకాధిపతులతో.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “పరలోక స్థలాల్లో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλη
  choice: పోరాటం
  rationale: ఈ పదం కుస్తీ లేదా దగ్గరి పెనుగులాటను సూచిస్తుంది. ‘పోరాటం’ ఆ సంఘర్షణ భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; మరింత అక్షరార్థమైన ‘పెనుగులాట’ను పాదసూచికలో ఉంచాం.
- source_word: πρὸς αἷμα καὶ σάρκα
  choice: రక్తమాంసాలతో
  rationale: గ్రీకులో క్రమం ‘రక్తం మరియు మాంసం’; ఇది మానవ ప్రత్యర్థులను సూచించే నుడికారం. తెలుగులో సహజంగా స్థిరపడిన ‘రక్తమాంసాలు’ అనే రూపం నుడికారాన్ని నిలుపుతుంది; నేరుగా ‘మనుషులతో’ అని వివరణాత్మకంగా మార్చలేదు.
- source_word: σάρκα
  choice: మాంసం
  rationale: ఇక్కడ σάρξ ‘రక్తమాంసాలు’ అనే నుడికారంలో శరీరధారులైన మనుషులను సూచిస్తుంది; ‘పాప స్వభావం’ అని కాదు.
- source_word: ἀρχάς
  choice: పాలకులు
  rationale: పౌలు వాడుకలో ఈ పదం పాలించే శక్తులను లేదా ప్రధాన పాలకులను సూచించగలదు. ‘పాలకులు’ స్పష్టమైన ఆధునిక తెలుగు.
- source_word: ἐξουσίας
  choice: అధికారులు
  rationale: ఇది అధికారాన్ని కలిగినవారిని లేదా అధికార శక్తులను సూచిస్తుంది. వ్యక్తీకృత ప్రత్యర్థుల వరుసలో ‘అధికారులు’ సహజంగా సరిపోతుంది; అమూర్తమైన ‘అధికారాలు’ కంటే ఉద్దేశిత సత్తాలను స్పష్టంగా తెలియజేస్తుంది.
- source_word: κοσμοκράτορας
  choice: లోకాధిపతులు
  rationale: అరుదైన ఈ సంయుక్త పదం లోకాన్ని లేదా విశ్వాన్ని పాలించేవారనే భావం ఇస్తుంది. ‘లోకాధిపతులు’ ఆ సంయుక్త పదబలాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τοῦ σκότους τούτου
  choice: ఈ చీకటికి చెందిన
  rationale: షష్ఠీ విభక్తి లోకాధిపతులు ఈ చీకటికి చెందినవారని లేదా దానిచేత లక్షణీకరించబడినవారని సూచిస్తుంది. మూలంలో స్పష్టంగా లేని ‘ప్రస్తుత’ అనే కాలభావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- source_word: τὰ πνευματικὰ τῆς πονηρίας
  choice: దుష్టత్వపు ఆత్మిక శక్తులు
  rationale: నపుంసక బహువచన విశేషణం ఇక్కడ ఆత్మిక సత్తాలు లేదా శక్తులను సూచించే నామవాచకంగా పనిచేస్తుంది. ‘ఆత్మిక శక్తులు’ భావాన్ని స్పష్టం చేస్తుంది; ‘దుష్టత్వపు’ అనే రూపం τῆς πονηρίας యొక్క గుణసంబంధాన్ని నిలుపుతుంది.
- source_word: ἐν τοῖς ἐπουρανίοις
  choice: పరలోక ప్రాంతాల్లో
  rationale: ఎఫెసీయుల పత్రికలో పునరావృతమయ్యే ఈ పదబంధం పరలోక పరిధిని సూచిస్తుంది. ‘పరలోక ప్రాంతాలు’ ఆధునిక తెలుగులో చదవడానికి సహజంగా ఉండి, కేవలం ఒక నిర్దిష్ట స్థలానికి భావాన్ని పరిమితం చేయదు.
theological_decisions:
- issue: ఈ వచనంలో పేర్కొన్న ప్రత్యర్థుల స్వభావం
  choice: ఈ వరుస ప్రధానంగా మానవాతీత ఆత్మిక శక్తులను సూచించేలా అనువదించబడింది.
  alternative: ఇవి ప్రధానంగా మానవ పాలకులు, సంస్థలు కావచ్చు; లేదా ఆత్మిక సత్తాలు మరియు వాటి భౌతిక వ్యక్తీకరణలు రెండూ ఉద్దేశించబడి ఉండవచ్చు.
  rationale: κοσμοκράτορας మరియు ముఖ్యంగా τὰ πνευματικὰ τῆς πονηρίας అనే పదాలు ఆత్మిక ప్రత్యర్థులను నేరుగా సూచిస్తాయి. అయినప్పటికీ వాటికి భూలోక వ్యక్తీకరణలు ఉండవచ్చనే అవకాశాన్ని అనువాదం నిరాకరించదు.
- issue: ఈ సందర్భంలో σάρξ అర్థం
  choice: ‘రక్తమాంసాలు’ అనే నుడికారంలో ‘మాంసం’గా ఉంచబడింది.
  alternative: ‘పాప స్వభావం’
  rationale: ఇక్కడ ఈ పదం పాపప్రవృత్తికి సాంకేతిక పదంగా కాకుండా, శరీరధారులైన మానవులను సూచించే నుడికారంలో ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. పాలకులు–అధికారులు–లోకాధిపతులు అనే పునరుక్త నిర్మాణం గ్రీకు వాక్యంలోని వరుస ఒత్తిడిని నిలుపుతుంది. ‘రక్తమాంసాలు’ వంటి పరిచిత నుడికారాన్ని ఉంచి, అది ‘పాప స్వభావం’గా తప్పుగా అర్థం కాకుండా నిర్ణయ వివరణలో స్పష్టం చేయబడింది.
