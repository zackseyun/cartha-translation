revisions:
- from: ప్రతి విధమైన ప్రార్థనతో, విజ్ఞాపనతో ప్రతి సమయంలో పరిశుద్ధాత్మలో[a] ప్రార్థిస్తూ ఉండండి. ఈ ఉద్దేశంతోనే పూర్తి పట్టుదలతో మెలకువగా ఉండి, పరిశుద్ధులందరి[b] కోసం విజ్ఞాపన చేస్తూ ఉండండి.
  to: సమస్త ప్రార్థనతోను విజ్ఞాపనతోను, ప్రతి సమయంలో పరిశుద్ధాత్మలో[a] ప్రార్థిస్తూ, ఈ ఉద్దేశం కోసమే సమస్త పట్టుదలతోను విజ్ఞాపనతోను మెలకువగా ఉండండి—పరిశుద్ధులందరి[b] కొరకు.
  rationale: The revision keeps the verse as a flowing continuation, with “ప్రార్థిస్తూ” and the final “మెలకువగా ఉండండి” reflecting the Greek participial sequence in natural Telugu. It also gives equal scope to prayer and petition, retains the probable Holy-Spirit reading without suppressing the grammatical alternative, and makes clear that petition is offered for all the saints.
