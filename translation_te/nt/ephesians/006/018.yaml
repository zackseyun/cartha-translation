id: EPH.6.18
reference: Ephesians 6:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ πάσης προσευχῆς καὶ δεήσεως, προσευχόμενοι ἐν παντὶ καιρῷ ἐν πνεύματι, καὶ εἰς ⸀αὐτὸ ἀγρυπνοῦντες ἐν πάσῃ προσκαρτερήσει καὶ δεήσει περὶ πάντων τῶν ἁγίων,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/018.yaml
  text: with every prayer and petition, praying at all times in the Spirit, and for this very thing staying alert with all perseverance in petition for all the saints,
translation:
  language: te
  text: సమస్త ప్రార్థనతోను విజ్ఞాపనతోను, ప్రతి సమయంలో పరిశుద్ధాత్మలో[a] ప్రార్థిస్తూ, ఈ ఉద్దేశం కోసమే సమస్త పట్టుదలతోను విజ్ఞాపనతోను మెలకువగా ఉండండి—పరిశుద్ధులందరి[b] కొరకు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆత్మలో.’ గ్రీకు పదాన్ని మరింత సాధారణ అర్థంలో చదవవచ్చు; అయితే సందర్భంలో అది పరిశుద్ధాత్మను సూచించే అవకాశం ఎక్కువ.
    reason: alternative_reading
  - marker: b
    text: ఇక్కడ ‘పరిశుద్ధులు’ అంటే దేవుని పరిశుద్ధ ప్రజలందరూ, అంటే విశ్వాసులందరూ.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πάσης προσευχῆς καὶ δεήσεως
  choice: ప్రతి విధమైన ప్రార్థనతో, విజ్ఞాపనతో
  rationale: διά + షష్ఠీ విభక్తి సాధనాన్ని సూచిస్తుంది; తెలుగులో ‘తో’ సహజంగా ఆ భావాన్ని ఇస్తుంది. προσευχή అనే సాధారణ ప్రార్థన పదానికి భిన్నంగా, δέησις‌ను నిర్దిష్ట విన్నపం అనే భావంలో ‘విజ్ఞాపన’గా ఇచ్చాం.
- source_word: ἐν παντὶ καιρῷ
  choice: ప్రతి సమయంలో
  rationale: παντί యొక్క సమగ్ర భావాన్ని, καιρός సూచించే ప్రతి సమయం లేదా సందర్భాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν πνεύματι
  choice: పరిశుద్ధాత్మలో
  rationale: 17వ వచనంలోని ‘ఆత్మ ఖడ్గం’ అనే సమీప సందర్భం, ఎఫెసీయుల పత్రికలోని వినియోగం పరిశుద్ధాత్మనే సూచించే అవకాశాన్ని బలపరుస్తాయి. అయితే గ్రీకులో పదానికి ఉపపదం లేకపోవడం వల్ల సాధారణ ‘ఆత్మలో’ అనే పఠనాన్ని పాదసూచికలో ఉంచాం.
- source_word: εἰς αὐτὸ
  choice: ఈ ఉద్దేశంతోనే
  rationale: ఈ గ్రీకు నుడికారం ఇప్పుడే చెప్పిన ప్రార్థనా లక్ష్యాన్ని సూచిస్తుంది; αὐτόలోని ఉద్ఘాటనను ‘నే’ నిలుపుతుంది.
- source_word: ἀγρυπνοῦντες
  choice: మెలకువగా ఉండి
  rationale: నిద్రమత్తు లేకుండా జాగరూకంగా కొనసాగడాన్ని సూచించే పదం; సందర్భంలోని అప్రమత్తత భావాన్ని సులభంగా తెలియజేస్తుంది.
- source_word: ἐν πάσῃ προσκαρτερήσει καὶ δεήσει
  choice: పూర్తి పట్టుదలతో ... విజ్ఞాపన చేస్తూ
  rationale: προσκαρτέρησις‌లోని నిరంతర పట్టుదలను, δέησις‌లోని విన్నపాన్ని రెండింటినీ నిలుపుతూ తెలుగులో సహజమైన క్రియారూపంగా అమర్చాం.
- source_word: περὶ πάντων τῶν ἁγίων
  choice: పరిశుద్ధులందరి కోసం
  rationale: ἅγιοι పౌలు వాడుకలో దేవునికి ప్రత్యేకపరచబడిన విశ్వాసుల సమాజమంతటినీ సూచిస్తుంది. స్థిరపడిన బైబిలు పదజాలాన్ని నిలుపుతూ అపార్థాన్ని పాదసూచికలో నివారించాం.
theological_decisions:
- issue: πνεύματι ఎవరిని లేదా దేనిని సూచిస్తుంది?
  choice: పరిశుద్ధాత్మలో
  alternative: ఆత్మలో; ఆత్మతో
  rationale: తక్షణ సందర్భం మరియు పౌలు వినియోగం పరిశుద్ధాత్మను సూచించే పఠనానికి బలం ఇస్తాయి. అయినా మూలపాఠంలోని వ్యాకరణ రూపం సాధారణ ‘ఆత్మ’ పఠనాన్ని పూర్తిగా తొలగించదు; అందుకే ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలిపాం.
- issue: ἅγιοι యొక్క పరిధి
  choice: పరిశుద్ధులందరు, అంటే దేవుని ప్రజలైన విశ్వాసులందరు
  alternative: తరువాతి సంఘ సంప్రదాయంలో ప్రత్యేకంగా గుర్తింపు పొందిన కొందరు పరిశుద్ధులు మాత్రమే
  rationale: పౌలు పత్రికల్లో ఈ బహువచన పదం విశ్వాసుల సమాజాన్ని మొత్తంగా సూచిస్తుంది; తరువాత ఏర్పడిన పరిమిత సాంకేతిక అర్థాన్ని ఇక్కడికి దిగుమతి చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. గ్రీకు కృదంతాల కొనసాగింపును తెలుగులో సహజంగా ఉండే ‘ప్రార్థిస్తూ ఉండండి’, ‘మెలకువగా ఉండి’, ‘విజ్ఞాపన చేస్తూ ఉండండి’ రూపాలతో వ్యక్తం చేశాం. వచనం ముందు ఆజ్ఞకు కొనసాగింపైనప్పటికీ, స్వతంత్రంగా చదివినప్పుడు కూడా స్పష్టంగా ఉండేలా క్రియారూపాలను పూర్తి చేశాం.
