  terminology: “బానిసలు,” “యజమానులు,” and “మెస్సీయ” are appropriate. “శరీరరీత్యా” faithfully preserves the deliberately qualified Greek idiom without importing a moralized sense; the explanatory footnote appropriately clarifies it.
