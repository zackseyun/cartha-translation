id: EPH.6.5
reference: Ephesians 6:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἱ δοῦλοι, ὑπακούετε τοῖς ⸂κατὰ σάρκα κυρίοις⸃ μετὰ φόβου καὶ τρόμου ἐν ἁπλότητι τῆς καρδίας ὑμῶν ὡς τῷ Χριστῷ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/005.yaml
  text: Servants[a], obey your masters according to the flesh with fear and trembling, in sincerity of your heart, as to Messiah[b],
translation:
  language: te
  text: బానిసలారా, శరీరరీత్యా మీ యజమానులైనవారికి[a] భయంతోను వణుకుతోను, మీ హృదయపు నిష్కపటతతో విధేయులై ఉండండి—మెస్సీయకు విధేయులైనట్లే.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “శరీరం ప్రకారం యజమానులైనవారు”; అంటే కేవలం ఈ లోకపు లేదా మానవ సంబంధంలో యజమానులు.
    reason: మూలంలోని κατὰ σάρκα నుడికారాన్ని వివరించి, దాని పరిధిని స్పష్టం చేయడం.
  - marker: b
    text: 'గ్రీకు: “క్రీస్తుకు”; Χριστός అనే బిరుదుకు అర్థం “మెస్సీయ” లేదా “అభిషిక్తుడు.”'
    reason: తెలుగులో సుపరిచితమైన ప్రత్యామ్నాయ రూపాన్ని తెలిపి, ప్రధాన పాఠ్యంలోని బిరుదు అనువాదాన్ని వివరించడం.
lexical_decisions:
- source_word: δοῦλοι
  choice: బానిసలారా
  rationale: ఇంటి యజమాని–బానిస సామాజిక సందర్భంలో ఈ పదం బంధిత దాస్యస్థితిలో ఉన్నవారిని సూచిస్తుంది. ‘సేవకులారా’ అని మృదువుగా అనువదిస్తే మూలంలోని సామాజిక వాస్తవం మరుగుపడుతుంది.
- source_word: ὑπακούετε
  choice: విధేయులై ఉండండి
  rationale: వర్తమాన ఆజ్ఞారూపం కొనసాగుతున్న విధేయతను కోరుతుంది. తెలుగులో ఇది సహజంగా, స్పష్టంగా ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: κατὰ σάρκα
  choice: శరీరరీత్యా
  rationale: గ్రీకు నుడికారాన్ని సంక్షిప్తంగా నిలుపుతూ, ఈ యజమానిత్వం శారీరకమైన లేదా ఈ లోకపు మానవ సంబంధానికి పరిమితమని సూచిస్తుంది; పాపస్వభావం అనే అర్థాన్ని ఇక్కడ చేర్చదు.
- source_word: κυρίοις
  choice: మీ యజమానులైనవారికి
  rationale: ఈ గృహసంబంధ సందర్భంలో κύριοις అనేది ప్రభువులనే ఆధ్యాత్మిక బిరుదును కాక బానిసలపై అధికారమున్న యజమానులను సూచిస్తుంది.
- source_word: μετὰ φόβου καὶ τρόμου
  choice: భయంతో, వణకుతో
  rationale: మూలంలోని జంట పదాల బలాన్ని, పౌలు వాడే స్థిరమైన అభివ్యక్తిని సాధ్యమైనంత సూటిగా నిలుపుతుంది.
- source_word: ἐν ἁπλότητι τῆς καρδίας ὑμῶν
  choice: మీ హృదయ నిష్కపటతతో
  rationale: ἁπλότης ఇక్కడ కపటంలేని, విభజనలేని అంతరంగ వైఖరిని సూచిస్తుంది. ‘హృదయ నిష్కపటత’ ఆధునిక తెలుగులో సహజంగా ఈ భావాన్ని అందిస్తుంది.
- source_word: ὡς τῷ Χριστῷ
  choice: మెస్సీయకు విధేయులైనట్లే
  rationale: ὡς యొక్క పోలికను నిలుపుతూ, ముందున్న ‘విధేయులై ఉండండి’ అనే క్రియను తెలుగులో సహజంగా పునరుద్ఘాటిస్తుంది. Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది.
theological_decisions:
- issue: Χριστῷ పదానికి అనువాదం
  choice: మెస్సీయకు
  alternative: క్రీస్తుకు
  rationale: Χριστός ఇక్కడ బిరుదు భావంతో పనిచేస్తుంది. అందువల్ల దాని అర్థాన్ని అనువదించే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో ఉంచి, సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో సూచించాం.
- issue: δοῦλοι పదానికి దాస్యసందర్భంలోని అనువాదం
  choice: బానిసలారా
  alternative: సేవకులారా
  rationale: యజమానుల కింద ఉన్న వ్యక్తులను నేరుగా సంబోధించే గృహనియమ సందర్భం కావడంతో బంధిత దాస్యస్థితిని దాచని ‘బానిసలు’ సరైనది.
- issue: κατὰ σάρκα యొక్క భావం
  choice: శరీరరీత్యా
  alternative: ఈ లోక సంబంధమైన
  rationale: మూలంలోని ఉద్దేశపూర్వక నుడికారాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది కేవలం మానవ లేదా ఈ లోక సంబంధాన్ని సూచిస్తుందని పాదటిప్పణి వివరిస్తుంది; దీనిని ‘పాపస్వభావం’గా తీర్మానించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. దాస్య వాస్తవాన్ని మృదువుచేయకుండా ‘బానిసలు’ అని ఉంచాం. ‘శరీరరీత్యా’ అనే మూలనుడికారాన్ని పాదటిప్పణితో వివరించాం. వాక్యాంతంలోని పోలిక తెలుగులో అస్పష్టంగా కాకుండా ఉండేందుకు ‘విధేయులైనట్లే’ అని క్రియను సహజంగా పునరుద్ఘాటించాం.
