revisions:
- from: 'నా కోసమూ ప్రార్థించండి: నేను నోరు తెరిచినప్పుడు నాకు చెప్పాల్సిన మాట[a] అనుగ్రహించబడాలని, సువార్త మర్మాన్ని ధైర్యంగా తెలియజేయాలని ప్రార్థించండి.'
  to: 'నా కోసమూ ప్రార్థించండి: నేను నోరు తెరిచినప్పుడు, ధైర్యంగా సువార్త మర్మాన్ని తెలియజేయడానికి నాకు మాట[a] ఇవ్వబడాలని.'
  rationale: The revision removes the added modal force in “చెప్పాల్సిన,” avoids repeating the supplied prayer imperative, and makes the Greek purpose relation clear while retaining the source’s concise structure and the inherited prayer context.
