id: EPH.6.19
reference: Ephesians 6:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ ἐμοῦ, ἵνα μοι δοθῇ λόγος ἐν ἀνοίξει τοῦ στόματός μου, ἐν παρρησίᾳ γνωρίσαι τὸ μυστήριον τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/019.yaml
  text: and for me[a], that words may be given to me in opening my mouth, to make known with boldness the mystery of the gospel[e][d][c][b],
translation:
  language: te
  text: 'నా కోసమూ ప్రార్థించండి: నేను నోరు తెరిచినప్పుడు, ధైర్యంగా సువార్త మర్మాన్ని తెలియజేయడానికి నాకు మాట[a] ఇవ్వబడాలని.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సందేశం”; లేదా, “మాటలు.”
    reason: λόγος ఇక్కడ మాట్లాడేందుకు ఇవ్వబడే మాట, మాటలు, లేదా సందేశం అనే భావాల్లో అర్థం కావచ్చు.
lexical_decisions:
- source_word: ὑπὲρ ἐμοῦ
  choice: నా కోసమూ
  rationale: ముందరి వాక్యంలోని ప్రార్థన సందర్భాన్ని కొనసాగిస్తూ, ὑπέρ + షష్ఠీ విభక్తి ఇక్కడ ‘నా కోసం/నా తరఫున’ అనే భావాన్ని ఇస్తుంది. ‘మూ’ గ్రీకు καί యొక్క కొనసాగింపు భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: δοθῇ λόγος
  choice: నాకు చెప్పాల్సిన మాట అనుగ్రహించబడాలని
  rationale: λόγος ఏదో సాంకేతిక బిరుదును కాక, మాట్లాడేందుకు దేవుడు ఇచ్చే మాట లేదా సందేశాన్ని సూచిస్తుంది. ఏకవచన భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉండేందుకు ‘చెప్పాల్సిన మాట’ అని అనువదించాం; దైవప్రదాన భావానికి ‘అనుగ్రహించబడాలని’ సరిపోతుంది.
- source_word: ἐν ἀνοίξει τοῦ στόματός μου
  choice: నేను నోరు తెరిచినప్పుడు
  rationale: అక్షరార్థ చిత్రాన్ని నిలుపుతూ, ‘మాట్లాడడం మొదలుపెట్టినప్పుడు’ అనే సందర్భార్థాన్ని సహజమైన తెలుగు రూపంలో వ్యక్తం చేస్తుంది.
- source_word: ἐν παρρησίᾳ
  choice: ధైర్యంగా
  rationale: παρρησίαలోని నిర్భయమైన, బహిరంగమైన మాటలాడే భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది; దీనిని కేవలం అంతర్గత ఆత్మవిశ్వాసంగా పరిమితం చేయదు.
- source_word: γνωρίσαι
  choice: తెలియజేయాలని
  rationale: ‘తెలిసేలా చేయడం’ అనే మూలార్థాన్ని నేరుగా తెలియజేస్తుంది; ‘ప్రకటించడం’ అనే మరింత ప్రత్యేక ప్రసంగ విధానాన్ని అనవసరంగా చేర్చదు.
- source_word: τὸ μυστήριον τοῦ εὐαγγελίου
  choice: సువార్త మర్మాన్ని
  rationale: μυστήριον ఇక్కడ పరిష్కరించలేని చిక్కు కాదు; ఒకప్పుడు మరుగై ఉండి ఇప్పుడు వెల్లడైన దేవుని ఉద్దేశాన్ని సూచిస్తుంది. ‘సువార్త మర్మం’ పౌలు వాడుకలోని భావసాంద్రతను నిలుపుతుంది.
theological_decisions:
- issue: λόγος యొక్క భావం
  choice: ‘చెప్పాల్సిన మాట’గా అనువదించడం
  alternative: ‘సందేశం’ లేదా ‘మాటలు’
  rationale: ఈ పదం దేవుడు ప్రసాదించే మాట్లాడే విషయాన్ని సూచించవచ్చు. ‘చెప్పాల్సిన మాట’ ఏకవచన రూపాన్ని, దైవప్రదాన భావాన్ని నిలుపుతుంది; అయితే ‘సందేశం’ అనే భావసాధ్యతను పాదసూచికలో ఉంచాం.
- issue: παρρησία యొక్క బలం
  choice: ‘ధైర్యంగా’
  alternative: ‘నిర్భయంగా’ లేదా ‘బహిరంగంగా’
  rationale: మూలపదంలో ధైర్యం, స్వేచ్ఛ, నిష్కపటమైన బహిరంగ ప్రకటన అనే పరస్పర సంబంధిత భావాలు ఉన్నాయి. ‘ధైర్యంగా’ సందర్భంలోని ప్రధాన బలాన్ని సహజంగా తెలియజేస్తూ, ఇతర భావాలను సిద్ధాంతపరంగా తొలగించదు.
- issue: వాక్యంలోని ప్రార్థన ఆజ్ఞ
  choice: ముందరి వాక్యం నుంచి గ్రహించబడే ‘ప్రార్థించండి’ని స్పష్టంగా చేర్చడం
  alternative: ‘నా కోసమూ’ అని మాత్రమే ఉంచడం
  rationale: గ్రీకు వాక్యం ముందరి వచనంలోని ప్రార్థన సూచనపై ఆధారపడుతుంది. విడిగా చదివే వచనంగా తెలుగులో అర్థసంపూర్ణత కోసం ఆ క్రియను స్పష్టం చేశాం; కొత్త సిద్ధాంతార్థం చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన శైలి. ‘నోరు తెరిచినప్పుడు’ అనే మూలరూపకాన్ని నిలిపి, అసహజమైన పదానువాదాన్ని నివారించాం. వచనాన్ని స్వతంత్రంగా చదవగలిగేలా ముందు సందర్భం నుంచి ‘ప్రార్థించండి’ని స్పష్టం చేశాం.
