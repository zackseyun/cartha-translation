lexical_decisions:
- source_word: τίμα
  choice: గౌరవించు
  rationale: τιμάω యొక్క ఆజ్ఞార్థక రూపం; కేవలం మనసులో ఆదరించడం కాక, క్రియాత్మకంగా గౌరవించడం అనే నైతిక బలాన్ని నిలుపుతుంది.
- source_word: τὸν πατέρα σου
  choice: నీ తండ్రిని
  rationale: ప్రత్యక్ష కుటుంబ సంబంధ పదబంధానికి సహజమైన, ఖచ్చితమైన ఆధునిక తెలుగు రూపం.
- source_word: τὴν μητέρα
  choice: నీ తల్లిని
  rationale: ప్రత్యక్ష కుటుంబ సంబంధ పదానికి సహజమైన, ఖచ్చితమైన ఆధునిక తెలుగు రూపం; గ్రీకులో రెండవ వ్యక్తి సర్వనామం పునరుక్తం కాకపోయినా తెలుగులో సమాంతరత కోసం ‘నీ’ చేర్చబడింది.
- source_word: ἥτις ἐστὶν
  choice: ఇదే
  rationale: ఉటంకించిన ఆజ్ఞను తిరిగి సూచించే సంబంధ సర్వనామాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, పౌలు చేసే వివరణాత్మక వ్యాఖ్యను స్పష్టం చేస్తుంది.
- source_word: ἐντολὴ
  choice: ఆజ్ఞ
  rationale: దశాజ్ఞల ప్రతిధ్వనిని నిలుపుతూనే ఆధునిక తెలుగులో సహజంగా, గంభీరంగా వినిపించే పదం.
- source_word: πρώτη
  choice: మొదటి
  rationale: ఇక్కడ క్రమసూచక అర్థాన్ని నేరుగా నిలుపుతుంది; ‘ప్రధానమైన’ అని అర్థాన్ని మార్చదు.
- source_word: ἐν ἐπαγγελίᾳ
  choice: వాగ్దానంతో కూడిన
  rationale: పదశః ‘వాగ్దానంలో’ అయినప్పటికీ, సందర్భంలో ఆ ఆజ్ఞకు వాగ్దానం జతగా ఉందనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; పదశః రూపం పాదటిప్పణిలో నిలుపబడింది.
theological_decisions:
- issue: ‘మొదటి ఆజ్ఞ’కు దశాజ్ఞల క్రమంతో ఉన్న సంబంధం
  choice: ‘వాగ్దానంతో కూడిన మొదటి ఆజ్ఞ’ అని అనువదించడం
  alternative: ‘వాగ్దానంలో మొదటి ఆజ్ఞ’; ‘రెండవ పలకలోని మొదటి ఆజ్ఞ’; ‘వాగ్దానంతో కూడిన ప్రధాన ఆజ్ఞ’
  rationale: ఈ రూపం πρώτη యొక్క ‘మొదటి’ అనే అర్థాన్ని, ἐν ἐπαγγελίᾳ యొక్క అసాధారణ నిర్మాణాన్ని రెండింటినీ సాధ్యమైనంతగా నిలుపుతుంది. ఇది ఏ ప్రత్యేక దశాజ్ఞల సంఖ్యా పద్ధతినీ లేదా ‘మొదటి’ అంటే ‘అత్యంత ప్రధానమైనది’ అనే వ్యాఖ్యానాన్నీ అనువాదంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే లేఖలోని ఆజ్ఞాత్మక గంభీరతను మరియు వివరణాత్మక విరామాన్ని నిలుపుతూ ఉల్లేఖన చిహ్నాలు, దీర్ఘ విరామ రేఖలు ఉపయోగించబడ్డాయి.
