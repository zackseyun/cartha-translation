  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. ‘శిరస్త్రాణం’, ‘ఖడ్గం’ పదాలు గంభీరమైన యుద్ధకవచ రూపకానికి తగినవిగా ఉండి సాధారణ పాఠకులకు అర్థమయ్యేలా ఉన్నాయి. ప్రధాన పాఠంలో రెండు పాదటిప్పణి సూచికలూ [a], [b] స్పష్టంగా ఉంచబడ్డాయి.
