lexical_decisions:
- source_word: δέξασθε
  choice: స్వీకరించండి
  rationale: రెండవ పురుష బహువచన ఆజ్ఞను గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది. సమకూర్చబడిన ఆయుధాన్ని అందుకోవడం అనే భావాన్ని నిలుపుతుంది; ‘తీసుకోండి’ కూడా సాధ్యమే.
- source_word: περικεφαλαίαν
  choice: శిరస్త్రాణం
  rationale: యుద్ధంలో తలను కాపాడే కవచానికి సహజమైన, గౌరవప్రదమైన తెలుగు పదం; ఆయుధసామగ్రి రూపకాన్ని నిలుపుతుంది.
- source_word: τοῦ σωτηρίου
  choice: రక్షణ అనే
  rationale: గ్రీకు విశేషణరూపపు షష్ఠీ సంబంధాన్ని తెలుగులో సహజంగా తెలియజేస్తూ, విమోచన/రక్షణ భావాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: μάχαιραν
  choice: ఖడ్గం
  rationale: బ్లేడ్ గల యుద్ధాయుధాన్ని సూచించే స్పష్టమైన తెలుగు సమానం; మూలపదం సూచించగల చిన్న ఖడ్గం అనే పరిమాణాన్ని ప్రధాన పాఠంలో అనవసరంగా నిర్దిష్టం చేయదు.
- source_word: τοῦ πνεύματος
  choice: ఆత్మ
  rationale: ఈ పౌలు సందర్భంలో పరిశుద్ధాత్మను సూచించడం అత్యంత సహజం. తెలుగులో ‘ఆత్మ ఖడ్గం’ అనే సంబంధ నిర్మాణం సంక్షిప్తంగా, సహజంగా ఉంటుంది.
- source_word: ὅ ἐστιν
  choice: వాక్యమే … ఖడ్గం
  rationale: ‘అదే/ఏదనగా’ అనే వివరణాత్మక గుర్తింపును తెలుగు వాక్యక్రమంలో సహజంగా వ్యక్తపరుస్తుంది; ఖడ్గం దేవుని వాక్యమని గుర్తిస్తుంది.
- source_word: ῥῆμα θεοῦ
  choice: దేవుని వాక్యం
  rationale: ῥῆμα పలికిన మాట, ప్రకటన లేదా సందేశాన్ని సూచించగలిగినా, ‘దేవుని వాక్యం’ సహజమైనదీ విస్తృత భావాన్ని కాపాడేదీ; ప్రత్యామ్నాయ నుడికారాన్ని పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: ‘ఆత్మ’ యొక్క సూచన
  choice: పరిశుద్ధాత్మ
  alternative: మానవ ఆత్మ లేదా సాధారణ ఆధ్యాత్మిక శక్తి
  rationale: దేవుని సమస్త కవచం అనే సందర్భంలోనూ, వెంటనే ‘దేవుని వాక్యం’తో ఖడ్గాన్ని గుర్తించడంలోనూ, ఇది పరిశుద్ధాత్మకు చెందిన లేదా ఆయన సమకూర్చే ఖడ్గమనే పఠనం అత్యంత సహజం. సంబంధం యొక్క ఖచ్చిత స్వరూపాన్ని మాత్రం మరింత నిర్దిష్టం చేయలేదు.
- issue: ‘రక్షణ’తో ‘శిరస్త్రాణం’కు ఉన్న సంబంధం
  choice: ‘రక్షణ అనే శిరస్త్రాణం’—రక్షణను రూపకంగా శిరస్త్రాణంతో గుర్తించడం
  alternative: రక్షణ కలిగించే శిరస్త్రాణం లేదా రక్షణకు చెందిన శిరస్త్రాణం
  rationale: గ్రీకు షష్ఠీ సంబంధం అనేక విధాల అర్థమవగలదు. తెలుగు ప్రధాన పాఠం రూపక గుర్తింపును సహజంగా తెలియజేస్తుంది గాని కారణార్థాన్ని జోడించదు.
