id: EPH.6.11
reference: Ephesians 6:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐνδύσασθε τὴν πανοπλίαν τοῦ θεοῦ πρὸς τὸ δύνασθαι ὑμᾶς στῆναι πρὸς τὰς μεθοδείας τοῦ διαβόλου·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/011.yaml
  text: Put on the full armor of God[b][a], so that you may be able to stand against the schemes of the devil.
translation:
  language: te
  text: మీరు అపవాది పన్నాగాలకు[b] ఎదురు నిలబడగలిగేలా దేవుని సంపూర్ణ యుద్ధసామగ్రిని[a] ధరించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని పూర్తి యుద్ధసామగ్రిని.” గ్రీకు పదం సైనికుని కవచంతో సహా అతని పూర్తి యుద్ధసన్నాహాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “పన్నాగాలు” అనే పదాన్ని “కుయుక్తులు” లేదా “మోసపూరిత వ్యూహాలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: ధరించండి
  rationale: రెండవ పురుష బహువచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; యుద్ధసామగ్రిని ఒంటికి ధరించడమనే రూపకాన్ని నిలుపుతుంది.
- source_word: πανοπλίαν
  choice: సంపూర్ణ యుద్ధసామగ్రి
  rationale: భారీ ఆయుధధారి సైనికుని కవచం మాత్రమే కాక అతని పూర్తి సామగ్రినంతటినీ సూచించే గ్రీకు పద విస్తృతిని తెలియజేస్తుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: గ్రీకు షష్ఠీ విభక్తిలోని సంబంధాన్ని విస్తృతంగానే ఉంచి, అది దేవునికి చెందినదా లేక ఆయన ఇచ్చేదా అన్న విషయాన్ని అనవసరంగా పరిమితం చేయదు.
- source_word: πρὸς τὸ δύνασθαι ὑμᾶς στῆναι
  choice: మీరు ... ఎదురు నిలబడగలిగేలా
  rationale: ఉద్దేశాన్ని సహజమైన తెలుగులో తెలుపుతూ, సామర్థ్య భావాన్నీ నిలుపుతుంది.
- source_word: στῆναι
  choice: ఎదురు నిలబడ
  rationale: ఈ సందర్భంలో ప్రతిఘటిస్తూ స్థానం విడువకుండా నిలబడే భావాన్ని, తరువాత వచ్చే πρὸς‌తో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: μεθοδείας
  choice: పన్నే కుయుక్తులు
  rationale: మోసపూరితమైన, చాకచక్యంగా రూపొందించిన పద్ధతులు లేదా పన్నాగాలు అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: τοῦ διαβόλου
  choice: అపవాది
  rationale: ఈ ఆత్మీయ పోరాట సందర్భంలో వ్యక్తిగత దుష్ట ప్రత్యర్థిని సూచించే స్థిరమైన బిరుదుగా అనువదిస్తుంది; పదంలోని నిందకుడు అనే నేపథ్య భావాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: διάβολος పదం సూచించే వ్యక్తి
  choice: వ్యక్తిగత దుష్ట ప్రత్యర్థిని సూచించే “అపవాది”
  alternative: సాధారణ అర్థంలో “నిందకుడు”
  rationale: ఎఫెసీయులు 6లోని ఆత్మీయ పోరాట సందర్భం సాధారణ మానవ నిందకునికంటే వ్యక్తిగతమైన అతీంద్రియ ప్రత్యర్థినే సూచిస్తుంది; అదనపు సిద్ధాంత వివరాలను చేర్చలేదు.
- issue: τοῦ θεοῦ అనే షష్ఠీ సంబంధం
  choice: “దేవుని” అని విస్తృతంగా ఉంచడం
  alternative: “దేవుడు ఇచ్చే” లేదా “దేవునికి చెందిన” అని స్పష్టీకరించడం
  rationale: మూలంలో యాజమాన్యం, మూలం/సరఫరా రెండింటికీ అవకాశం ఉండటంతో ఒక భావానికే పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపం వాడబడింది. సైనిక రూపకం స్పష్టంగా ఉండేందుకు “యుద్ధసామగ్రి” ఎంచుకోబడింది. ప్రధాన వాక్యంలో అన్ని పాదసూచిక గుర్తులు [a], [b] చేర్చబడ్డాయి.
