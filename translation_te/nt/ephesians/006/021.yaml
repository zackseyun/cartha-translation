id: EPH.6.21
reference: Ephesians 6:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἵνα δὲ ⸂εἰδῆτε καὶ ὑμεῖς⸃ τὰ κατ’ ἐμέ, τί πράσσω, πάντα ⸂γνωρίσει ὑμῖν⸃ Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/021.yaml
  text: So that you also may know the things concerning me[a], what I am doing, Tychicus, the beloved brother and faithful minister in the Lord[b], will make everything known to you.
translation:
  language: te
  text: అయితే, మీరు కూడా నా సంగతులను[a], నేను ఏమి చేస్తున్నానో తెలుసుకునేలా, ప్రియమైన సహోదరుడూ ప్రభువులో నమ్మకమైన పరిచారకుడూ[b] అయిన తుకికు మీకు అన్నిటినీ తెలియజేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘నా పరిస్థితులు’; గ్రీకు పదబంధానికి అక్షరార్థంగా ‘నన్నుగూర్చిన విషయాలు’ అని అర్థం.
    reason: lexical_alternative
  - marker: b
    text: ‘నమ్మకమైన సేవకుడు’ అని కూడా అనువదించవచ్చు. గ్రీకు διάκονος అనే పదానికి సందర్భాన్ని బట్టి ‘సేవకుడు’, ‘పరిచారకుడు’ లేదా ‘డీకన్’ అనే అర్థాలు ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἵνα δὲ
  choice: అయితే, ... తెలుసుకునేలా
  rationale: ἵνα ఉద్దేశాన్ని సూచిస్తుంది; δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని ‘అయితే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰδῆτε καὶ ὑμεῖς
  choice: మీరు కూడా తెలుసుకునేలా
  rationale: καί మరియు స్పష్టంగా ఉన్న ὑμεῖς కలిపి గ్రహీతలపై ఉన్న ‘కూడా’ అనే అదనపు ఉద్ఘాటనను నిలుపుతాయి.
- source_word: τὰ κατ’ ἐμέ
  choice: నా సంగతులు
  rationale: ఈ గ్రీకు ప్రయోగం పౌలుకు సంబంధించిన విషయాలు లేదా పరిస్థితులను సూచిస్తుంది; ‘నా సంగతులు’ దాని విస్తృతతను అనవసరంగా పరిమితం చేయదు.
- source_word: τί πράσσω
  choice: నేను ఏమి చేస్తున్నానో
  rationale: πράσσω ఇక్కడ పౌలు చేస్తున్న లేదా దేనిలో నిమగ్నమై ఉన్న కార్యాన్ని సూటిగా సూచిస్తుంది.
- source_word: πάντα γνωρίσει ὑμῖν
  choice: మీకు అంతా తెలియజేస్తాడు
  rationale: γνωρίζω యొక్క ‘తెలియజేయడం, సమాచారం ఇవ్వడం’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: Τυχικὸς
  choice: తుకికు
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: ప్రియ సహోదరుడు
  rationale: ἀγαπητός లోని ఆప్యాయతను, ἀδελφός లోని క్రైస్తవ కుటుంబ సంబంధాన్ని గౌరవప్రదమైన సహజ తెలుగులో నిలుపుతుంది.
- source_word: πιστὸς διάκονος
  choice: నమ్మకమైన పరిచారకుడు
  rationale: πιστός ఇక్కడ విశ్వసనీయతను సూచిస్తుంది; διάκονος యొక్క సేవా పాత్రను ‘పరిచారకుడు’ తెలియజేస్తూ, అది తప్పనిసరిగా సంఘపదవి అని నిర్ణయించదు.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు తరచుగా వాడే సంబంధం లేదా కార్యపరిధిని సూచించే పదబంధాన్ని సంక్షిప్తంగా, సాంప్రదాయబద్ధంగా నిలుపుతుంది.
theological_decisions:
- issue: తుకికును సూచించే διάκονος అనువాదం
  choice: పరిచారకుడు
  alternative: సేవకుడు; పరిచర్యకుడు; డీకన్
  rationale: ఈ సందర్భం తుకికును పౌలు విషయాలను తెలియజేసే విశ్వసనీయ సహచరునిగా వర్ణిస్తుంది; అధికారిక సంఘపదవి ఇక్కడ నిస్సందేహంగా ఉద్దేశించబడలేదు. ‘పరిచారకుడు’ కార్యాత్మక సేవాభావాన్ని నిలుపుతుంది.
- issue: ἀδελφός అనువాదం
  choice: సహోదరుడు
  alternative: సోదరుడు
  rationale: ఇది ఒక పురుష సహచరుని సూచిస్తుంది; అందువల్ల పుంలింగ ఏకవచనం సందర్భానికి ఖచ్చితంగా సరిపోతుంది.
- issue: κύριος అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ἐν κυρίῳ అనే పౌలు ప్రయోగంలో ఇది యేసుకు సంబంధించిన స్థిరమైన బిరుదు; ‘ప్రభువు’ ఆ భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం వాడబడింది. ‘నా సంగతులు’ మూలంలోని ఉద్దేశపూర్వక విస్తృతతను కాపాడుతుంది. ప్రధాన వాక్యంలో రెండు పాదసూచిక గుర్తులూ ఉంచబడ్డాయి; [b] వాక్యాంతంలో ఉంచి ‘పరిచారకుడు’కు సంబంధించిన ప్రత్యామ్నాయాన్ని సూచిస్తుంది.
