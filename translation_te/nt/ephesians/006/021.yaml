- from: అయితే, నా సంగతులు[a], నేను ఏమి చేస్తున్నానో మీరు కూడా తెలుసుకునేలా, ప్రభువులో ప్రియ సహోదరుడూ నమ్మకమైన పరిచారకుడూ అయిన తుకికు మీకు అంతా తెలియజేస్తాడు.[b]
  to: అయితే, మీరు కూడా నా సంగతులను[a], నేను ఏమి చేస్తున్నానో తెలుసుకునేలా, ప్రియమైన సహోదరుడూ ప్రభువులో నమ్మకమైన పరిచారకుడూ[b] అయిన తుకికు మీకు అన్నిటినీ తెలియజేస్తాడు.
