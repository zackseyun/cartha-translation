    rationale: SBLGNTలోని ἐν πᾶσιν కు సంబంధించి ప్రత్యామ్నాయ పఠనం ἐπὶ πᾶσιν అయితే దాని అర్థం “అన్నిటికీ మించి/అన్నిటి పైన”; “వీటన్నిటికి మించి” అనే మాట మూలపాఠంలో లేని నిర్దిష్ట సూచనను జోడిస్తుంది. పాఠాంతర గ్రీకు రూపాన్ని ఇవ్వడం స్పష్టతను పెంచుతుంది.
