id: EPH.6.16
reference: Ephesians 6:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἐν πᾶσιν ἀναλαβόντες τὸν θυρεὸν τῆς πίστεως, ἐν ᾧ δυνήσεσθε πάντα τὰ βέλη τοῦ ⸀πονηροῦ πεπυρωμένα σβέσαι·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/016.yaml
  text: In all circumstances[a], taking up the shield of faith[c][b], with which you will be able to extinguish all the flaming arrows of the evil one.
translation:
  language: te
  text: అన్ని పరిస్థితుల్లోనూ[a] విశ్వాసపు డాలును ఎత్తిపట్టుకొని, దానితో దుష్టుడి[b] మండుతున్న బాణాలన్నిటినీ[c] ఆర్పివేయగలుగుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'కొన్ని గ్రీకు ప్రతుల్లో, “అన్నిటికీ మించి” (గ్రీకు: ἐπὶ πᾶσιν) అని ఉంది.'
    reason: textual_variant
  - marker: b
    text: లేదా “చెడుకు చెందిన”; గ్రీకు పదాన్ని నైరూప్య భావంలో కూడా అర్థం చేసుకోవచ్చు, అయితే యుద్ధ సందర్భంలో వ్యక్తిగత భావం బాగా సరిపోతుంది.
    reason: alternative_reading
  - marker: c
    text: 'గ్రీకు పదానికి విసిరే ఆయుధాలు అనే విస్తృత అర్థం ఉంది; అందువల్ల “మండుతున్న అస్త్రాలు” అని కూడా అనువదించవచ్చు. సంప్రదాయ అనువాదం: “అగ్నిబాణాలు.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσιν
  choice: అన్ని పరిస్థితుల్లోనూ
  rationale: ఈ కవచాల జాబితాలో ఈ పదబంధం క్రియావిశేషణ భావంతో ప్రతి పరిస్థితిలోనూ అని సహజంగా అర్థమవుతుంది. గ్రీకు పాఠాంతరాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀναλαβόντες
  choice: ఎత్తిపట్టుకొని
  rationale: ముందటి వచనంలో మొదలైన ఆజ్ఞతో ముడిపడిన కృదంత భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: τὸν θυρεὸν τῆς πίστεως
  choice: విశ్వాసమనే డాలు
  rationale: θυρεός పెద్ద రక్షణ డాలును సూచిస్తుంది; సాధారణ పాఠకునికి ‘డాలు’ స్పష్టంగా ఉంటుంది. రూపకంలోని సమానత్వ భావాన్ని ‘విశ్వాసమనే’ సహజంగా తెలియజేస్తుంది.
- source_word: ἐν ᾧ
  choice: దానితో
  rationale: సంబంధ సర్వనామం డాలును సూచిస్తూ సాధనార్థకంగా ఉంది.
- source_word: δυνήσεσθε
  choice: ఆర్పివేయగలుగుతారు
  rationale: భవిష్యత్ సామర్థ్య భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: βέλη
  choice: బాణాలు
  rationale: ఈ పదం విసిరే ఆయుధాలకు సాధారణ పదమైనా, యుద్ధ రూపకంలో ‘బాణాలు’ స్పష్టంగా, సహజంగా ఉంది; విస్తృత అర్థాన్ని పాదసూచికలో తెలిపాం.
- source_word: τοῦ πονηροῦ
  choice: దుష్టుని
  rationale: నిర్దిష్ట ఉపపదంతో వచ్చిన ఏకవచనం, ఆధ్యాత్మిక యుద్ధ సందర్భంలో వ్యక్తిగత శత్రువును సూచించడం ఎక్కువ సంభావ్యం.
- source_word: πεπυρωμένα
  choice: మండుతున్న
  rationale: నిప్పంటించబడిన స్థితిని సూచించే పరిపూర్ణ కర్మణి కృదంత చిత్రాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σβέσαι
  choice: ఆర్పివేయగలుగుతారు
  rationale: మంటను ఆర్పే చిత్రాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: τοῦ πονηροῦ వ్యక్తిని సూచిస్తుందా, చెడును సూచిస్తుందా?
  choice: దుష్టుని
  alternative: చెడుకు చెందిన
  rationale: ఆధ్యాత్మిక యుద్ధం, శత్రువు ప్రయోగించే బాణాలు అనే సందర్భంలో వ్యక్తిగత భావమే బలంగా సరిపోతుంది; అయినా గ్రీకు రూపానికి సాధ్యమైన నైరూప్య భావాన్ని పాదసూచికలో నిలిపాం.
- issue: πίστις భావం
  choice: విశ్వాసం
  alternative: నమ్మకం
  rationale: ఇక్కడ దేవునిపై ఆధారపడే విశ్వాసం రక్షణ డాలుగా చిత్రించబడింది. ‘విశ్వాసం’ ప్రామాణికమైనదీ, సాధారణ పాఠకులకు అర్థమయ్యేదీ; ‘విశ్వసనీయత’ అనే భావం ఈ సందర్భంలో తక్కువ సంభావ్యం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతతో కూడిన, సులభంగా అర్థమయ్యే శైలి. ముందటి వచనంలోని ప్రధాన ఆజ్ఞతో వ్యాకరణ సంబంధాన్ని నిలుపడానికి ‘ఎత్తిపట్టుకొని’ అనే కృదంత రూపాన్ని వాడాం. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠ్యంలో ఉంది.
