review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the social referent of κύριοι as “యజమానులారా,” preserves the reciprocal but context-dependent τὰ αὐτὰ with “వారి పట్ల అలాగే చేయండి,” and correctly renders the prohibition of threatening, the shared heavenly Lord, and divine impartiality. However, εἰδότες is a participle expressing the grounds for the exhortation (“knowing/since you know”), not a further imperative. “తెలుసుకోండి” changes this into an additional command.
  naturalness: The Telugu is modern, clear, and appropriately formal. Recasting the final clause as a causal statement with “మీకు తెలుసు” is both more natural and closer to the Greek syntax and force.
  terminology: “యజమానులు” appropriately retains the ancient master–slave household setting without anachronistically substituting employers. “ప్రభువు” suitably distinguishes the heavenly κύριος from human masters, and “పక్షపాతం” is an accurate, natural rendering of προσωπολημψία. “పరలోకంలో” naturally conveys the idiomatic Greek plural ἐν οὐρανοῖς.
  issues:
  - severity: medium
    issue: “తెలుసుకోండి” renders εἰδότες as an imperative.
    rationale: The Greek participle supplies the reason or acknowledged basis for the preceding commands. An imperative adds a command not present in the source and weakens the causal connection.
