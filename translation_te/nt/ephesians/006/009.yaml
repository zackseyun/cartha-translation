source:
  edition: SBLGNT
  text: Καὶ οἱ κύριοι, τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς, ἀνιέντες τὴν ἀπειλήν, εἰδότες ὅτι καὶ ⸂αὐτῶν καὶ ὑμῶν⸃ ὁ κύριός ἐστιν ἐν οὐρανοῖς, καὶ προσωπολημψία οὐκ ἔστιν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/009.yaml
  text: And masters[a], do the same things toward them, giving up threatening, knowing that both their Master and yours is in heaven[c][b], and there is no partiality with him.
translation:
  language: te
  text: యజమానులారా, మీరు కూడా వారి పట్ల అలాగే చేయండి[a]; బెదిరించడం మానివేయండి[b]. వారికీ మీకూ ప్రభువు పరలోకంలో[c] ఉన్నాడనీ, ఆయన వద్ద పక్షపాతం లేదనీ మీకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘వారికి కూడా అదే చేయండి,’ ‘వారితో కూడా అదే విధంగా ప్రవర్తించండి.’ గ్రీకు మాటలు ముందటి ఉపదేశాన్ని దగ్గరగా ప్రతిధ్వనింపజేసి పరస్పర బాధ్యతను నొక్కిచెబుతాయి.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘మీ బెదిరింపులను ఆపండి.’ ఇక్కడి గ్రీకు పదానికి బెదిరించడాన్ని నిలిపివేయడం లేదా ఆ పద్ధతిని విడిచిపెట్టడం అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘పరలోకాలలో.’ ఈ గ్రీకు బహువచన ప్రయోగాన్ని సహజ తెలుగులో ‘పరలోకంలో’ అని అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριοι
  choice: యజమానులారా
  rationale: మునుపటి వచనాల్లోని దాసులు–యజమానులు అనే ప్రాచీన గృహసంబంధ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది; ఆధునిక ఉద్యోగ సంబంధాన్ని అనవసరంగా పాఠ్యంలోకి తీసుకురాదు.
- source_word: τὰ αὐτὰ ποιεῖτε πρὸς αὐτούς
  choice: మీరు కూడా వారి పట్ల అలాగే చేయండి
  rationale: ముందటి ఉపదేశంతో ఉన్న మాటల అనుసంధానాన్ని, యజమానులు కూడా తమ ఆధీనుల పట్ల తగిన విధంగా ప్రవర్తించాలనే పరస్పర బాధ్యతను నిలుపుతుంది; ‘అలాగే’ దేనిని సూచిస్తుందో పూర్వసందర్భమే నిర్ణయించేలా అసలులోని సంక్షిప్తతను కాపాడుతుంది.
- source_word: ἀνιέντες τὴν ἀπειλήν
  choice: బెదిరించడం మానివేయండి
  rationale: బెదిరించే అలవాటును విడిచిపెట్టడం లేదా నిలిపివేయడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εἰδότες
  choice: తెలుసుకోండి
  rationale: ఆజ్ఞలకు ఆధారమైన జ్ఞానాన్ని స్పష్టపరుస్తుంది. గ్రీకు కృదంతాన్ని తెలుగులో సహజమైన క్రియారూపంగా మార్చినా దాని కారణాత్మక సంబంధం సందర్భంలో నిలుస్తుంది.
- source_word: καὶ αὐτῶν καὶ ὑμῶν ὁ κύριος
  choice: వారికీ మీకూ ప్రభువు
  rationale: ఒకే పరలోక ప్రభువు దాసులకూ భూలోక యజమానులకూ అధిపతి అనే సమానత్వాన్ని కాపాడుతుంది. దైవిక κύριος‌కు సాధారణమైన ‘ప్రభువు’ అనే రూపాన్ని వాడుతుంది.
- source_word: ἐν οὐρανοῖς
  choice: పరలోకంలో
  rationale: గ్రీకులో బహువచనం ఉన్నప్పటికీ ఈ సందర్భంలోని సహజ తెలుగు దైవనివాస ప్రయోగం ‘పరలోకంలో’.
- source_word: προσωπολημψία
  choice: పక్షపాతం
  rationale: హోదా లేదా వ్యక్తి ముఖం చూసి అన్యాయంగా భేదం చూపడాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: παρ’ αὐτῷ
  choice: ఆయన వద్ద
  rationale: దేవుని సన్నిధిలో లేదా ఆయన స్వభావంలో పక్షపాతం లేదనే గ్రీకు ప్రయోగాన్ని దగ్గరగా, సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ఒకే వచనంలో మానవ మరియు దైవిక సూచనలతో వచ్చే κύριος పదం
  choice: మానవ κύριοι‌ను ‘యజమానులు’గా, దైవిక κύριος‌ను ‘ప్రభువు’గా అనువదించడం
  alternative: రెండింటినీ ‘యజమాని/యజమానులు’గా అనువదించడం
  rationale: గ్రీకులో ఒకే మూలపదం ఉండటం వల్ల ఏర్పడే వాక్చాతుర్య సంబంధం సందర్భంలో నిలిచినా, తెలుగులో దైవిక బిరుదును ‘ప్రభువు’గా ఇవ్వడం భూలోక సామాజిక పాత్రను పరలోక అధిపతితో గందరగోళపరచదు. భూలోక యజమానులు కూడా అదే పరలోక ప్రభువు ఆధీనంలో ఉన్నారనే ప్రధాన వ్యత్యాసం స్పష్టమవుతుంది.
- issue: τὰ αὐτὰ అనే మాట సూచించే పరస్పరత్వం
  choice: ‘వారి పట్ల అలాగే చేయండి’ అని సంక్షిప్తంగా ఉంచడం
  alternative: ‘వారిని కూడా అదే విధంగా గౌరవంగా చూడండి’ అని భావాన్ని విప్పి చెప్పడం
  rationale: విప్పి చెప్పే ప్రత్యామ్నాయం సాధ్యమైన నైతిక భావాన్ని స్పష్టం చేసినా, అసలు పాఠ్యంలో లేని నిర్దిష్ట చర్యను చేర్చుతుంది. సంక్షిప్త రూపం ముందటి ఉపదేశంతో సంబంధాన్ని, దానిలోని కొంత భావసందిగ్ధతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే లేఖనానికి తగిన గౌరవప్రదమైన శైలిలో ఉంది. ప్రాచీన దాసులు–యజమానులు అనే సామాజిక సందర్భాన్ని ఆధునిక ఉద్యోగ పదజాలంతో మార్చలేదు. ప్రధాన పాఠ్యంలో [a], [b], [c] గుర్తులన్నీ సంబంధిత స్థానాల్లో ఉంచబడ్డాయి.
