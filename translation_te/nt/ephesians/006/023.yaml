id: EPH.6.23
reference: Ephesians 6:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰρήνη τοῖς ἀδελφοῖς καὶ ἀγάπη μετὰ πίστεως ἀπὸ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/023.yaml
  text: Peace to the brothers[a], and love with faith[c][b], from God the Father and the Lord Jesus the Messiah.
translation:
  language: te
  text: సోదరులకు[a] శాంతి, విశ్వాసంతో కూడిన ప్రేమ[b]—తండ్రియైన దేవుని నుంచీ, ప్రభువైన యేసు మెస్సీయ[c] నుంచీ కలుగుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సోదర సోదరీమణులకు.’ గ్రీకులో ‘సోదరులు’ అనే పుంలింగ బహువచన రూపం ఉంది; అది విశ్వాసుల సమాజమంతటినీ ఉద్దేశించి ఉండవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా ‘విశ్వసనీయతతో కూడిన ప్రేమ’ లేదా ‘నమ్మకంతో కూడిన ప్రేమ.’ గ్రీకు పదానికి ఈ భావాలు కూడా ఉండవచ్చు; ఇక్కడ ‘విశ్వాసం’ ప్రాథమిక అనువాదం.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో ‘యేసు క్రీస్తు.’ ఇక్కడ Χριστός అనే బిరుదు అర్థాన్ని నిలుపడానికి ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰρήνη
  choice: శాంతి ... కలుగుగాక
  rationale: మూలంలో క్రియ లేకుండా ఉన్న ఆశీర్వాద వాక్యాన్ని తెలుగులో సహజంగా తెలియజేయడానికి చివరలో ‘కలుగుగాక’ చేర్చబడింది.
- source_word: τοῖς ἀδελφοῖς
  choice: సోదరులకు
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం; పౌలు వాడుకలో ఇది విశ్వాసుల సమాజమంతటినీ ఉద్దేశించవచ్చు.
- source_word: ἀγάπη μετὰ πίστεως
  choice: విశ్వాసంతో కూడిన ప్రేమ
  rationale: μετά + షష్ఠీ విభక్తి సహవాసార్థాన్ని ఇస్తుంది; πίστις‌కు ఇక్కడ ప్రాథమిక అర్థమైన ‘విశ్వాసం’ నిలుపబడింది.
- source_word: ἀπὸ
  choice: నుంచీ
  rationale: శాంతి, ప్రేమ దేవుని మరియు యేసు మెస్సీయను మూలంగా కలిగి ఉన్నాయని తెలిపే ఉద్భవార్థం.
- source_word: θεοῦ πατρὸς
  choice: తండ్రియైన దేవుడు
  rationale: గ్రీకులో ‘మన’ అనే సర్వనామం లేదు; అందువల్ల దాన్ని చేర్చలేదు.
- source_word: κυρίου Ἰησοῦ Χριστοῦ
  choice: ప్రభువైన యేసు మెస్సీయ
  rationale: κύριος‌ను ‘ప్రభువు’గా, Χριστός‌ను దాని బిరుదార్థాన్ని నిలుపుతూ ‘మెస్సీయ’గా అనువదించాం.
theological_decisions:
- issue: Χριστοῦ బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ యేసుకు సంబంధించిన మెస్సీయ బిరుదును మోస్తుంది; దాని అర్థాన్ని స్పష్టంగా నిలుపడానికి ‘మెస్సీయ’ ఎంచుకున్నాం.
- issue: ἀδελφοῖς‌లో లింగం మరియు సమూహార్థం
  choice: సోదరులు
  alternative: సోదర సోదరీమణులు
  rationale: ముఖ్య పాఠంలో మూలంలోని పుంలింగ బహువచన రూపాన్ని నిలిపి, మొత్తం విశ్వాస సమాజాన్ని సూచించే సాధ్యమైన సమగ్రార్థాన్ని పాదసూచికలో తెలిపాం.
- issue: πίστις అర్థం
  choice: విశ్వాసం
  alternative: విశ్వసనీయత లేదా నమ్మకం
  rationale: ఈ సందర్భంలో ‘విశ్వాసం’ సహజమైన ప్రాథమిక అర్థం; పదానికి ఉన్న ఇతర సాధ్యమైన భావాలను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే ఆశీర్వాద శైలి. మూలంలోని ఒకే ἀπό రెండు సమన్వయ నామబంధాలకు వర్తించినా, తెలుగులో స్పష్టత మరియు సహజత్వం కోసం ‘నుంచీ’ పునరుక్తి చేయబడింది.
