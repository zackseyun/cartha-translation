id: EPH.6.4
reference: Ephesians 6:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ οἱ πατέρες, μὴ παροργίζετε τὰ τέκνα ὑμῶν, ἀλλὰ ἐκτρέφετε αὐτὰ ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/004.yaml
  text: And fathers[a], do not provoke your children to anger[c][b], but bring them up in the discipline and instruction of the Lord.
translation:
  language: te
  text: తండ్రులారా, మీ పిల్లలకు కోపం పుట్టించకండి[a]. బదులుగా, ప్రభువు యొక్క[c] క్రమశిక్షణలోనూ ఉపదేశంలోనూ[b] వారిని పెంచండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మీ పిల్లలను విసిగించి ఆగ్రహానికి గురిచేయకండి.’ గ్రీకు క్రియ కోపాన్ని లేదా మనసులో ఆగ్రహాన్ని రేపడాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘శిక్షణలోనూ హెచ్చరికతో కూడిన బోధలోనూ.’
    reason: lexical_alternative
  - marker: c
    text: ‘ప్రభువు యొక్క’ అనేది ప్రభువు నుండి వచ్చే, ప్రభువుకు చెందిన, లేదా ప్రభువు నిర్దేశించిన క్రమశిక్షణను, ఉపదేశాన్ని సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: πατέρες
  choice: తండ్రులారా
  rationale: గ్రీకు పదం పురుష బహువచనంలో ప్రత్యేకంగా తండ్రులను సంబోధిస్తోంది; మూలపాఠాన్ని ‘తల్లిదండ్రులారా’ అని విస్తరించలేదు.
- source_word: παροργίζετε
  choice: కోపం పుట్టించకండి
  rationale: ఈ క్రియ కోపాన్ని రేపడం లేదా ఆగ్రహానికి పురికొల్పడం అనే కారణార్థక భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: τέκνα
  choice: పిల్లలకు
  rationale: కుటుంబ సందర్భంలో కుమారులు, కుమార్తెలు ఇద్దరినీ సహజంగా సూచించే ఆధునిక తెలుగు పదం.
- source_word: ἐκτρέφετε
  choice: పెంచండి
  rationale: పోషించడం అనే మూలభావం ఉన్నప్పటికీ, పిల్లల పెంపకం సందర్భంలో ‘పెంచండి’ సహజంగా, సమగ్రంగా అర్థాన్ని తెలియజేస్తుంది.
- source_word: παιδείᾳ
  choice: క్రమశిక్షణలోనూ
  rationale: పిల్లలను తీర్చిదిద్దే శిక్షణతోపాటు అవసరమైన దిద్దుబాటును కూడా ఈ పదం కలిగి ఉంది.
- source_word: νουθεσίᾳ
  choice: ఉపదేశంలోనూ
  rationale: మాటల ద్వారా ఇచ్చే నైతిక మార్గనిర్దేశం, హెచ్చరిక, దిద్దుబాటు అనే భావాలను అందుబాటులో ఉన్న ఆధునిక పదంతో తెలియజేస్తుంది.
- source_word: κυρίου
  choice: ప్రభువు యొక్క
  rationale: ఈ షష్ఠీ సంబంధం మూలం, స్వామ్యం, లక్షణం లేదా దిశను సూచించవచ్చు; ‘యొక్క’ ఆ సంబంధాన్ని మరీ సంకుచితంగా నిర్వచించకుండా ఉంచుతుంది.
theological_decisions:
- issue: πατέρες అనే సంబోధన పరిధి
  choice: తండ్రులారా
  alternative: తల్లిదండ్రులారా
  rationale: మూల గ్రీకు పాఠం ప్రత్యేకంగా తండ్రులను సంబోధిస్తోంది. అన్వయాన్ని విస్తరించకుండా పాఠంలోని నిర్దిష్ట సంబోధనను నిలిపాం.
- issue: ἐν παιδείᾳ καὶ νουθεσίᾳ κυρίου లో κυρίου సంబంధం
  choice: ప్రభువు యొక్క
  alternative: ప్రభువు నుండి వచ్చే; ప్రభువు గురించిన; ప్రభువు నిర్దేశించిన
  rationale: గ్రీకు షష్ఠీ విభక్తి ఈ క్రమశిక్షణ, ఉపదేశం ప్రభువు నుండి వచ్చేవని, ఆయనకు చెందినవని, ఆయనను లక్ష్యంగా చేసుకున్నవని లేదా ఆయన నిర్దేశించినవని సూచించవచ్చు. ప్రధాన పాఠం ఈ భావాలలో ఒక్కదానికే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. ‘బదులుగా’ ప్రతికూల ఆజ్ఞ నుండి సానుకూల ఆజ్ఞకు ఉన్న వ్యత్యాసాన్ని సహజంగా చూపుతుంది. ‘ప్రభువు యొక్క’ సాధారణ సంభాషణలో కొంత అధికారికంగా అనిపించినా, ఇక్కడ గ్రీకు షష్ఠీ సంబంధంలోని ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
