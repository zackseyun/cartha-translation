id: EPH.6.24
reference: Ephesians 6:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ χάρις μετὰ πάντων τῶν ἀγαπώντων τὸν κύριον ἡμῶν Ἰησοῦν Χριστὸν ἐν ⸀ἀφθαρσίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/024.yaml
  text: Grace be with all who love our Lord Jesus the Messiah with incorruptibility[a].
translation:
  language: te
  text: మన ప్రభువైన యేసు మెస్సీయను అక్షయత్వంతో ప్రేమించే వారందరికీ కృప తోడై ఉండుగాక.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అక్షయమైన ప్రేమతో’; మరో విధంగా, ‘నిష్కపటంగా’ లేదా ‘ఎన్నటికీ చావని ప్రేమతో.’ గ్రీకులోని ‘అక్షయత్వంతో’ అనే పదబంధం సంక్షిప్తమైనది, సందిగ్ధమైనది.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పౌలు పత్రికల ఆశీర్వాద ముగింపు శైలికి అనుగుణంగా, దేవుని అనుగ్రహాన్ని సూచించే స్థిరమైన సహజ పదం.
- source_word: μετὰ πάντων
  choice: వారందరికీ ... తోడై ఉండుగాక
  rationale: గ్రీకులో క్రియ లేకపోయినా, ఆశీర్వాద వాక్యంగా సహజమైన తెలుగులో ‘తోడై ఉండుగాక’ను పూరించాం; πάντων యొక్క సమగ్ర భావాన్ని ‘అందరికీ’ నిలుపుతుంది.
- source_word: τῶν ἀγαπώντων
  choice: ప్రేమించే వారు
  rationale: వర్తమాన కృదంతాన్ని నిరంతర లక్షణాన్ని తెలిపే సహజ తెలుగు సంబంధార్థక నిర్మాణంగా అనువదించాం.
- source_word: τὸν κύριον ἡμῶν
  choice: మన ప్రభువైన
  rationale: κύριος అనే క్రీస్తు బిరుదుకు ‘ప్రభువు’ను వాడి, తెలుగు వాక్యనిర్మాణానికి తగినట్లు ‘ప్రభువైన’గా ఇచ్చాం.
- source_word: Ἰησοῦν Χριστὸν
  choice: యేసు మెస్సీయ
  rationale: Χριστός యొక్క బిరుదార్థాన్ని ‘మెస్సీయ’గా స్పష్టంగా నిలిపాం; తెలుగులో ‘యేసు మెస్సీయ’ సహజమైన పేరు-బిరుదు నిర్మాణం.
- source_word: ἐν ἀφθαρσίᾳ
  choice: అక్షయత్వంలో
  rationale: గ్రీకు పదబంధం సంక్షిప్తమూ భావపరంగా సందిగ్ధమూ కావడంతో, ప్రేమ యొక్క అక్షయత్వమా, ఆశీర్వాదపు పరిధి/గుణమా అని తేల్చకుండా రూపపరంగా పారదర్శకమైన పదాన్ని ఉంచాం.
theological_decisions:
- issue: ἐν ἀφθαρσίᾳ యొక్క అన్వయం
  choice: ప్రధాన పాఠ్యంలో ‘అక్షయత్వంలో’ అని సందిగ్ధతను నిలుపడం
  alternative: ‘అక్షయమైన ప్రేమతో’, ‘నిష్కపటంగా’, లేదా ‘ఎన్నటికీ చావని ప్రేమతో’
  rationale: ἀφθαρσία ప్రేమను విశేషిస్తుందా, ఆశీర్వాదం ఉండే స్థితి లేదా గుణాన్ని సూచిస్తుందా అన్నది గ్రీకులో స్పష్టంగా నిర్ణయించబడలేదు. అందువల్ల ప్రధాన పాఠ్యం ఏకైక వ్యాఖ్యానాన్ని బలవంతంగా ఎంచుకోదు; సహజమైన వ్యాఖ్యాన అవకాశాలను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన పత్రికా-ఆశీర్వాద శైలిని వాడాం. ‘అక్షయత్వం’ కొంత సాహిత్యపరమైన పదమైనా, మూలంలోని ఉద్దేశపూర్వక సంక్షిప్తతను మరియు సందిగ్ధతను కాపాడుతుంది; పాదసూచిక సాధారణ పాఠకునికి సాధ్యమైన భావాలను వివరిస్తుంది.
