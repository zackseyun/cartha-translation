source:
  edition: SBLGNT
  text: Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν ὑμῶν ἐν κυρίῳ, τοῦτο γάρ ἐστιν δίκαιον·
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/001.yaml
  text: Children[a], obey your parents in the Lord, for this is right.
translation:
  language: te
  text: పిల్లలారా, ప్రభువులో మీ తల్లిదండ్రులకు విధేయులై ఉండండి[a]. ఎందుకంటే ఇది సరైనది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రభువుకు చెందినవారిగా’ లేదా ‘ప్రభువుతో ఐక్యమై’ అని కూడా భావించవచ్చు. ‘ప్రభువులో’ అనే మాట విధేయత జరిగే పరిధిని లేదా తీరును సూచించవచ్చు; అంతేకాక, అలాంటి విధేయతకు ప్రభువుపట్ల నిబద్ధత హద్దుగా ఉంటుందని కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα
  choice: పిల్లలారా
  rationale: సంబోధనార్థక బహువచనంగా కుటుంబంలోని పిల్లలను నేరుగా ఉద్దేశిస్తుంది. ‘పిల్లలారా’ సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ὑπακούετε
  choice: విధేయులై ఉండండి
  rationale: వర్తమానకాల ఆజ్ఞ నిరంతరంగా వినిపించుకొని అనుసరించే విధేయతను సూచిస్తుంది; కేవలం వినడాన్ని మించిన భావాన్ని ఈ రూపం తెలియజేస్తుంది.
- source_word: γονεῦσιν
  choice: తల్లిదండ్రులకు
  rationale: ఈ బహువచన నామవాచకం తల్లినీ తండ్రినీ సమష్టిగా సూచిస్తుంది; ‘తల్లిదండ్రులు’ తెలుగు నుడికారానికి తగిన ఖచ్చితమైన పదం.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు వాడే సంక్షిప్తమైన వేదాంతపరమైన వ్యక్తీకరణను అలాగే నిలుపుతుంది. ఇది ప్రభువుతో సంబంధమనే పరిధిని, విధేయత జరిగే తీరును, లేదా ప్రభువుపట్ల నిబద్ధతను సూచించగలదు.
- source_word: δίκαιον
  choice: న్యాయమైనది
  rationale: ఇక్కడ పదం నైతికంగా సరైనది, సముచితమైనది అనే భావాన్ని ఇస్తుంది. ‘న్యాయమైనది’ గ్రీకు పదంలోని న్యాయం/సరితనం భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ‘ప్రభువులో’ అనే పదబంధపు పరిధి
  choice: ‘ప్రభువులో మీ తల్లిదండ్రులకు విధేయులై ఉండండి’ అని ఆజ్ఞతో అనుసంధానించి, దాని భావవిస్తృతిని వ్యాఖ్యానంలో తెరిచి ఉంచడం.
  alternative: ‘ప్రభువులో ఉన్న పిల్లలు తమ తల్లిదండ్రులకు విధేయులై ఉండాలి’ లేదా ‘ప్రభువుకు తగిన విధంగా తల్లిదండ్రులకు విధేయులై ఉండండి.’
  rationale: గ్రీకులో ἐν κυρίῳ సహజంగా ఆజ్ఞతో అనుసంధానమవుతుంది; అయితే అది పిల్లల ప్రభువుతో ఐక్యతను, విధేయత యొక్క పరిధి/తీరును, లేదా ప్రభువుపట్ల నిబద్ధత విధించే హద్దును సూచిస్తుందా అనేది పూర్తిగా స్పష్టం కాదు. మూల పదబంధాన్ని నిలుపడం ఈ వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన గృహోపదేశ శైలి. ‘ప్రభువులో’ అనే పౌలు రచనలకు ప్రత్యేకమైన సంక్షిప్త పదబంధాన్ని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా ప్రధాన పాఠ్యంలో నిలిపాం.
