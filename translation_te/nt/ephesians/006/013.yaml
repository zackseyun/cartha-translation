id: EPH.6.13
reference: Ephesians 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἀναλάβετε τὴν πανοπλίαν τοῦ θεοῦ, ἵνα δυνηθῆτε ἀντιστῆναι ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ καὶ ἅπαντα κατεργασάμενοι στῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/013.yaml
  text: Therefore take up the full armor of God[a], so that you may be able to withstand in the evil day, and having done everything[d][c][b], to stand firm.
translation:
  language: te
  text: కాబట్టి దేవుని సంపూర్ణ యుద్ధసామగ్రిని[a] చేపట్టండి, తద్వారా మీరు ఆ దుష్ట దినంలో[b] ఎదిరించి నిలబడగలుగుతారు; అన్నిటినీ నెరవేర్చిన తరువాత[c] స్థిరంగా నిలబడగలుగుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని సర్వాంగ కవచాన్ని.’ గ్రీకు పదం సైనికుని పూర్తి యుద్ధసామగ్రిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆ దుష్ట దినం’ అనేది తప్పనిసరిగా ఒక నిర్దిష్ట అంత్యకాల దినాన్ని మాత్రమే సూచించకపోవచ్చు; దుష్టత లేదా పరీక్ష తీవ్రమయ్యే కాలాన్ని కూడా సూచించవచ్చు.
    reason: alternative_reading
  - marker: c
    text: లేదా, ‘అన్నిటినీ పూర్తిచేసిన తరువాత’ లేదా ‘అన్నీ చేసిన తరువాత.’ మూలపదానికి చేయడం, సాధించడం, నెరవేర్చడం అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: కాబట్టి
  rationale: ముందున్న ఉపదేశం నుంచి వచ్చే నిర్ధారణను సహజమైన, సంక్షిప్తమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀναλάβετε
  choice: చేపట్టండి
  rationale: సైనికుడు తన సామగ్రిని తీసుకొని సిద్ధపడే భావాన్ని ఇస్తుంది; కేవలం ‘ధరించండి’ అని అనువదించి క్రియ అర్థాన్ని సంకుచితం చేయదు.
- source_word: τὴν πανοπλίαν τοῦ θεοῦ
  choice: దేవుని సంపూర్ణ యుద్ధసామగ్రిని
  rationale: πανοπλία సైనికుని పూర్తి సామగ్రిని సూచిస్తుంది. ‘దేవుని’ అనే సంబంధరూపం అది దేవునికి చెందినదా, ఆయన ఇచ్చేదా అనే భేదాన్ని నిర్ణయించకుండా ఉంచుతుంది.
- source_word: ἵνα δυνηθῆτε ἀντιστῆναι
  choice: ఎదిరించి నిలబడగలుగుతారు
  rationale: ἵνα యొక్క ఉద్దేశ్య భావాన్నీ, δυνηθῆτε యొక్క సామర్థ్య భావాన్నీ, ἀντιστῆναι లోని ప్రతిఘటనతో నిలిచే సైనిక భావాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τῇ ἡμέρᾳ τῇ πονηρᾷ
  choice: ఆ దుష్ట దినంలో
  rationale: మూలంలోని నిర్దిష్ట రూపాన్ని, అలాగే అది తీవ్రమైన దుష్టత లేదా పరీక్ష కాలమా లేక అంత్యకాల దినమా అనే అర్థవిస్తృతిని నిలుపుతుంది.
- source_word: ἅπαντα κατεργασάμενοι
  choice: చేయవలసినదంతా చేసిన తరువాత
  rationale: κατεργάζομαι యొక్క ‘చేయడం/నెరవేర్చడం’ అనే విస్తృత భావాన్ని కాపాడుతుంది. తెలుగులో అస్పష్టంగా ఉండే ‘అంతా చేసిన తరువాత’ కంటే సందర్భంలోని బాధ్యతను సహజంగా తెలుపుతుంది; విజయాన్ని అనవసరంగా చేర్చదు.
- source_word: στῆναι
  choice: స్థిరంగా నిలబడగలుగుతారు
  rationale: సైనిక సందర్భంలో తన స్థానాన్ని విడువకుండా నిలిచే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ముందటి ἀντιστῆναι తో ఉన్న ‘నిలబడటం’ ప్రతిధ్వనినీ కాపాడుతుంది.
theological_decisions:
- issue: ‘దుష్ట దినం’ యొక్క సూచన
  choice: దుష్టత లేదా ఆత్మీయ సంఘర్షణ తీవ్రమయ్యే కాలంగా సాధారణంగానే ఉంచడం
  alternative: ఒక నిర్దిష్ట అంత్యకాల దినం; లేదా వ్యక్తిగత పరీక్ష దినం
  rationale: గ్రీకు పదబంధం వీటిలో ఒక్కదానికే అర్థాన్ని పరిమితం చేయదు; అనువాదం ఆ ఉద్దేశపూర్వక అర్థవిస్తృతిని నిలుపుతుంది.
- issue: ‘దేవుని యుద్ధసామగ్రి’లోని షష్ఠీ విభక్తి సంబంధం
  choice: ‘దేవుని’ అని విస్తృత సంబంధార్థంతో ఉంచడం
  alternative: దేవునికి చెందిన యుద్ధసామగ్రి; దేవుడు సమకూర్చే యుద్ధసామగ్రి
  rationale: τοῦ θεοῦ ఈ రెండు సంబంధిత భావాలను అనుమతిస్తుంది; వాటిలో ఒక్కదాన్ని మాత్రమే అనువాదంలో నిర్బంధించడం సముచితం కాదు.
- issue: ἅπαντα κατεργασάμενοι యొక్క ఫలిత భావం
  choice: ‘చేయవలసినదంతా చేసిన తరువాత’
  alternative: అన్నిటినీ జయించిన తరువాత; అన్నిటినీ నెరవేర్చిన తరువాత
  rationale: కృదంతం పూర్తి చర్యను సూచించినా, సంపూర్ణ విజయాన్ని తప్పనిసరిగా ప్రకటించదు. అందువల్ల విజయవాద అర్థాన్ని చేర్చకుండా విస్తృత భావాన్ని ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘యుద్ధసామగ్రి’ సంపూర్ణ సైనిక పరికరాల భావాన్ని స్పష్టంగా ఇస్తుంది; సంప్రదాయ ‘సర్వాంగ కవచం’ను పాదసూచికలో ఉంచాం. ప్రధాన వాక్యంలో ఉద్దేశ్య-ఫలిత సంబంధం తెలుగులో సహజంగా వినిపించేందుకు రెండు సమాంతర క్రియాఖండాలుగా అమర్చాం.
