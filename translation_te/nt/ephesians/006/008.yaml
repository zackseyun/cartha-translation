  text: εἰδότες ὅτι ⸂ἕκαστος, ὃ ἂν⸃ ποιήσῃ ἀγαθόν, τοῦτο ⸀κομίσεται ⸀παρὰ κυρίου, εἴτε δοῦλος εἴτε ἐλεύθερος.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/008.yaml
  text: knowing that each one[a], whatever good he does, this he will receive back from the Lord[b], whether servant or free.
translation:
  language: te
  text: ప్రతి ఒక్కరూ తాము ఏ మంచి చేసినా, ఆ మంచికి తగినదాన్ని ప్రభువు నుండి పొందుతారని మీకు తెలుసు—వారు బానిసలైనా స్వేచ్ఛగలవారైనా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారు తాము చేసిన ఆ మంచిని ప్రభువు నుండి తిరిగి పొందుతారు.’ గ్రీకు క్రియ, ఒకరి చర్యకు అనుగుణమైనదాన్ని తిరిగి పొందడం అనే భావాన్ని ఇవ్వగలదు; ‘బానిసలు … స్వేచ్ఛగలవారు’ అనే పదబంధం సామాజిక స్థితుల మధ్య ఉన్న వ్యత్యాసాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: మీకు తెలుసు
  rationale: ఇది ముందున్న ఉపదేశానికి ఆధారాన్ని తెలిపే వర్తమాన కృదంతం. తెలుగులో స్వతంత్ర వచనంగా సహజంగా ఉండేందుకు భావాన్ని సకర్మక వాక్యంగా వ్యక్తం చేశాం; సందర్భంలో ఉన్న కారణార్థ ఛాయను బలవంతంగా ‘ఎందుకంటే’ అని స్పష్టీకరించలేదు.
- source_word: ἕκαστος
  choice: ప్రతి ఒక్కరూ
  rationale: ప్రతి వ్యక్తిపై విడివిడిగా వర్తించే పంపిణీ భావాన్ని నిలుపుతుంది; ఆధునిక తెలుగులో లింగనిరపేక్షంగా సహజంగా ఉంటుంది.
- source_word: ὃ ἂν ποιήσῃ ἀγαθόν
  choice: తాము ఏ మంచి చేసినా
  rationale: ἄνతో కూడిన సంబంధ వాక్యంలోని అనిర్దిష్ట ‘ఏదైనా’ భావాన్ని ‘ఏ ... చేసినా’ సహజంగా వ్యక్తం చేస్తుంది; ἀγαθόν యొక్క నైతిక గుణాన్ని ‘మంచి’ నిలుపుతుంది.
- source_word: τοῦτο
  choice: దానిని
  rationale: చేసిన మంచినే తిరిగి సూచించే నిర్దేశక సర్వనామ భావాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: κομίσεται
  choice: తిరిగి పొందుతారని
  rationale: చర్యకు అనుగుణంగా తిరిగి పొందడం అనే క్రియ యొక్క పరస్పర ప్రతిఫల భావాన్ని నిలుపుతుంది; కేవలం వాణిజ్య చెల్లింపు భావాన్ని రుద్దదు.
- source_word: παρὰ κυρίου
  choice: ప్రభువు నుండి
  rationale: παρά + షష్ఠీ విభక్తి మూలాన్ని సూచిస్తుంది. κύριοςకు ‘ప్రభువు’ అని ఇవ్వడం దైవిక/క్రీస్తుసంబంధ సూచనను, మానవ యజమాని సందర్భంతో కలిపివేయకుండా, నిలుపుతుంది.
- source_word: δοῦλος
  choice: దాసులు
  rationale: ἐλεύθεροςతో ప్రత్యక్ష సామాజిక విరుద్ధత ఉన్నందున బంధిత స్థితిని మృదువుపరచకుండా ‘దాసులు’ అని అనువదించాం.
- source_word: ἐλεύθερος
  choice: స్వతంత్రులు
  rationale: దాస్యస్థితికి విరుద్ధమైన స్వేచ్ఛగల సామాజిక స్థితిని సంక్షిప్తంగా, గౌరవప్రదంగా తెలుపుతుంది.
theological_decisions:
- issue: గృహనియమాల సందర్భంలో δοῦλος అనువాదం
  choice: దాసులు
  alternative: సేవకులు
  rationale: ఈ వచనం δοῦλοςను ἐλεύθεροςతో నేరుగా విరుద్ధంగా ఉంచుతుంది. అందువల్ల చారిత్రక బంధిత సామాజిక స్థితిని మసకబార్చని ‘దాసులు’ సరైనది.
- issue: κυρίου యొక్క సూచన మరియు అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: తక్షణ సందర్భంలో మానవ యజమానులు ఉన్నప్పటికీ, ప్రతిఫలానికి మూలమైన దైవిక ప్రభువునే ఈ పదబంధం సూచిస్తుంది. ‘ప్రభువు’ సంభావ్య క్రీస్తుసంబంధ భావాన్ని నిలుపుతుంది.
- issue: కొలతకు తగిన ప్రతిఫలమా లేక చేసిన మంచినే తిరిగి పొందడమా
  choice: దానిని ... తిరిగి పొందుతారు
  alternative: దానికి ప్రభువు ప్రతిఫలం ఇస్తాడు
  rationale: τοῦτο మరియు κομίσεταιల రూపాన్ని దగ్గరగా అనుసరించి, చర్యకు అనుగుణమైన తిరిగి పొందే భావాన్ని ఉంచాం; ప్రతిఫల స్వరూపాన్ని అనవసరంగా నిర్దిష్టం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రతి ఒక్కరూ ... తాము’ నిర్మాణం లింగనిరపేక్షంగా వ్యక్తిగత బాధ్యతను చూపుతుంది. గ్రీకు కృదంతాన్ని తెలుగులో స్వతంత్ర వచనంగా పఠనయోగ్యంగా చేయడానికి ‘మీకు తెలుసు’గా ఇచ్చినా, కారణార్థాన్ని ‘ఎందుకంటే’తో అతిగా నిర్ణయించలేదు.
