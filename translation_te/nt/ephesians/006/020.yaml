source:
  edition: SBLGNT
  text: ὑπὲρ οὗ πρεσβεύω ἐν ἁλύσει, ἵνα ἐν αὐτῷ παρρησιάσωμαι ὡς δεῖ με λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/020.yaml
  text: for which I am an ambassador in chains[a], so that in it I may speak boldly[c][b], as I ought to speak.
translation:
  language: te
  text: దాని నిమిత్తమే[a] నేను సంకెలలో[b] ఉన్న రాయబారిని; దానిలో[c] నేను మాట్లాడవలసిన విధంగా ధైర్యంగా మాట్లాడేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంబంధాన్ని వ్యక్తిగతంగా అర్థం చేసుకుంటే, ‘ఎవరి కోసం’. అయితే ఇక్కడి గ్రీకు రూపం నపుంసక లింగంలో ఉంది; ఇది ముందటి వచనంలోని ‘సువార్త మర్మం’ను సూచించే అవకాశం ఎక్కువ.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా ‘ఒక సంకెలలో’; నిర్బంధాన్ని తెలుగులో సహజంగా ‘సంకెలలో’ అని వ్యక్తం చేశాం.
    reason: lexical_alternative
  - marker: c
    text: కొన్ని వ్యాఖ్యానాల్లో ‘ఆయనలో’ అని అర్థం చేసుకుంటారు. అయితే ఇక్కడి సర్వనామం వ్యాకరణపరంగా నపుంసక లింగంలో ఉంది; అది సువార్తను లేదా దాని మర్మాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ οὗ
  choice: దాని నిమిత్తమే
  rationale: οὗ నపుంసక ఏకవచన రూపం; ఇది ముందున్న ‘సువార్త మర్మం’ను సహజంగా సూచిస్తుంది. ὑπέρ ఇక్కడ ‘దాని కోసం/దాని నిమిత్తం’ అనే భావాన్ని ఇస్తుంది.
- source_word: πρεσβεύω
  choice: రాయబారిని
  rationale: ఈ క్రియ అధికారిక ప్రతినిధిగా, రాయబారిగా పనిచేయడాన్ని సూచిస్తుంది; సాధారణమైన ‘ప్రతినిధి’ కంటే ‘రాయబారి’ మూలంలోని అధికారిక భావాన్ని నిలుపుతుంది.
- source_word: ἐν ἁλύσει
  choice: సంకెలలో ఉన్న
  rationale: గ్రీకులో ఏకవచనంగా ‘ఒక సంకెలలో’ ఉన్నా, తెలుగులో నిర్బంధాన్ని సహజంగా ‘సంకెలలో’ అని చెప్పడం ద్వారా బంధన చిత్రాన్ని నిలుపుతుంది.
- source_word: ἵνα
  choice: మాట్లాడేలా
  rationale: ప్రయోజనాన్ని సూచించే ἵνα భావాన్ని సహజమైన ఆధునిక తెలుగులో ‘-ేలా’ నిర్మాణం తెలియజేస్తుంది.
- source_word: ἐν αὐτῷ
  choice: దాని గురించి
  rationale: αὐτῷ ఇక్కడ నపుంసక ఏకవచనం; కాబట్టి వ్యక్తిని సూచించే ‘ఆయనలో’ కంటే ముందున్న సువార్త లేదా దాని మర్మాన్ని సూచించే ‘దాని గురించి’ వ్యాకరణపరంగా సహజం.
- source_word: παρρησιάσωμαι
  choice: ధైర్యంగా మాట్లాడేలా
  rationale: ఈ క్రియలో బహిరంగత, నిర్భయత, ధైర్యంతో పలకడం అనే భావాలు ఉన్నాయి. తరువాతి λαλῆσαιతో ఉన్న మాటల సందర్భాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ὡς δεῖ με λαλῆσαι
  choice: నేను మాట్లాడవలసిన విధంగా
  rationale: δεῖ తెలిపే అవసరం లేదా బాధ్యత భావాన్ని ‘మాట్లాడవలసిన’ సహజంగా, గౌరవప్రదంగా అందిస్తుంది.
theological_decisions:
- issue: సంబంధ సర్వనామం మరియు తరువాతి సర్వనామం దేనిని సూచిస్తున్నాయి?
  choice: రెండూ ముందటి వచనంలోని సువార్త లేదా ‘సువార్త మర్మం’ను సూచించే నపుంసక రూపాలుగా అనువదించబడ్డాయి.
  alternative: సంబంధ సర్వనామాన్ని సువార్త ప్రకటనను విస్తృతంగా సూచించేదిగా తీసుకోవచ్చు; కొందరు ἐν αὐτῷను వ్యక్తిగతంగా ‘ఆయనలో’ అని అర్థం చేసుకుంటారు.
  rationale: οὗ, αὐτῷ రూపాలు ఈ పాఠంలో నపుంసక ఏకవచనాలు; అందువల్ల వ్యాకరణం సువార్త లేదా దాని మర్మాన్నే సూచించే పఠనానికి బలంగా మద్దతిస్తుంది. వ్యక్తిగత క్రీస్తు-సూచనను పాఠంలోకి చేర్చకుండా అసలు రూపంలోని ఉద్రిక్తతను గమనికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యం 19వ వచనంలోని ప్రార్థనా అభ్యర్థనపై ఆధారపడుతున్నందున, తెలుగులో పూర్తి వాక్యంగా సహజంగా ఉండేందుకు చివర ‘ప్రార్థించండి’ అని సందర్భంలో అంతర్లీనంగా ఉన్న క్రియను స్పష్టం చేశాం.
