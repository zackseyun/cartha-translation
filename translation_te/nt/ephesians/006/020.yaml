  source_fidelity: ముసాయిదా ὑπὲρ οὗ, πρεσβεύω, ἐν ἁλύσει, మరియు δεῖ భావాలను మొత్తంగా సరిగానే అందిస్తుంది. అయితే ἵνα-ఉద్దేశ వాక్యభాగాన్ని పూర్తి చేయడానికి చివర చేర్చిన “ప్రార్థించండి” ఈ వచనం గ్రీకు పాఠంలో లేదు; అది ముందటి వచనం నుండి ఊహించబడినప్పటికీ, ఈ వచన అనువాదంలో ప్రత్యక్షంగా చేర్చకూడదు. ἐν αὐτῷకు “దాని గురించి” కన్నా “దానిలో” అనేది మూలంలోని ἐν (‘లో/సంబంధంలో’)ను మరింత నేరుగా నిలుపుతుంది.
  naturalness: “సంకెలలో ఉన్న రాయబారిని” ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది. ఈ వచనం ముందటి వచనంలోని ప్రార్థనా అభ్యర్థనకు వ్యాకరణపరంగా అనుసంధానమైన ఉద్దేశ భాగం కాబట్టి, “మాట్లాడేలా”తో ముగియడం ఉద్దేశపూర్వకంగా ఆ అనుసంధానాన్ని కాపాడుతుంది; దానిని ఆజ్ఞారూపమైన “ప్రార్థించండి”గా మార్చరాదు.
