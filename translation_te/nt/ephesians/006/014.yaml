review_pass:
  verdict: revise
  source_fidelity: The draft accurately reflects the imperative στῆτε, the inferential οὖν, both attendant aorist-middle participles, the explicit ‘waist,’ and the armor image. ‘సత్యంతో’ suitably preserves the open instrumental/spherical force of ἐν ἀληθείᾳ without forcing either ‘truth’ or ‘truthfulness.’ ‘నీతి’ is an appropriate primary rendering of δικαιοσύνη, with ‘న్యాయం’ retained as a legitimate alternative.
  naturalness: The clause order is natural Telugu and the participial forms work well with the final imperative. However, ‘మీ నడుము బిగించుకొని’ lacks the expected accusative marking for the object; ‘మీ నడుమును’ is clearer and more idiomatic. ‘నీతి అనే వక్షకవచం’ is understandable, but ‘నీతియనే వక్షకవచం’ more naturally presents the metaphorical apposition without suggesting an extraneous formal label.
  terminology: ‘వక్షకవచం’ clearly communicates θώραξ in a dignified modern register. ‘నడుము పట్టీ’ in the footnote is more contemporary and immediately understandable than ‘దట్టీ.’ The footnotes preserve the lexical and metaphorical alternatives without importing doctrinal conclusions.
  issues:
  - severity: low
    issue: Object case in the first participial phrase
    rationale: ‘మీ నడుము బిగించుకొని’ is understandable, but the waist is the direct object of the girding action. ‘మీ నడుమును బిగించుకొని’ is grammatically clearer and more natural.
  - severity: low
    issue: Wording of the righteousness metaphor
    rationale: ‘నీతి అనే వక్షకవచం’ can sound as though the breastplate is merely being assigned a name. ‘నీతియనే వక్షకవచం’ better expresses the appositional/metaphorical force of τὸν θώρακα τῆς δικαιοσύνης.
  - severity: low
    issue: Footnote uses a less current term for belt
    rationale: Replacing ‘దట్టీ’ with ‘నడుము పట్టీ’ improves accessibility in modern standard Telugu while retaining the military imagery.
  revised_text: కాబట్టి సత్యంతో మీ నడుమును బిగించుకొని[a], నీతియనే వక్షకవచాన్ని ధరించుకొని నిలబడండి.
