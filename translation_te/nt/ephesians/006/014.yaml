id: EPH.6.14
reference: Ephesians 6:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: στῆτε οὖν περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ, καὶ ἐνδυσάμενοι τὸν θώρακα τῆς δικαιοσύνης,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/014.yaml
  text: Stand[a], therefore, having fastened your waist with truth and having put on the breastplate of righteousness[b],
translation:
  language: te
  text: కాబట్టి సత్యంతో మీ నడుమును బిగించుకొని[a], నీతియనే వక్షకవచాన్ని ధరించుకొని నిలబడండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సత్యమనే నడుము పట్టీని మీ నడుముకు కట్టుకొని.’ గ్రీకు వాక్యంలో ‘నడుము పట్టీ’ అనే నామవాచకం ప్రత్యక్షంగా లేదు; అయితే నడుము బిగించుకునే సైనిక రూపకం దాన్ని సూచిస్తుంది.
    reason: metaphorical_alternative
lexical_decisions:
- source_word: στῆτε
  choice: నిలబడండి
  rationale: ఇది నిర్ణయాత్మకంగా నిలబడమని చెప్పే బహువచన ఆజ్ఞ. మూలపదంలో లేని ‘స్థిరంగా’ అనే భావాన్ని ప్రధాన పాఠ్యంలో అదనంగా చేర్చలేదు.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న ఉపదేశం నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: περιζωσάμενοι τὴν ὀσφὺν ὑμῶν ἐν ἀληθείᾳ
  choice: సత్యంతో మీ నడుము బిగించుకొని
  rationale: ‘మీ నడుము’ అనే స్పష్టమైన కర్మను నిలిపి, ἐν ἀληθείᾳలోని సాధనం లేదా పరిధి అనే రెండు సంభావ్య ఛాయలను అతిగా విడమరచకుండా ‘సత్యంతో’ అని ఇచ్చింది. దట్టీ రూపకం గ్రీకులో నామవాచకంగా స్పష్టంగా లేకపోవడం వల్ల ప్రధాన పాఠ్యంలో దాన్ని చేర్చలేదు.
- source_word: ἐνδυσάμενοι
  choice: ధరించుకొని
  rationale: దుస్తులు లేదా కవచం వేసుకోవడాన్ని తెలిపే సహజమైన తెలుగు రూపం; ప్రధాన ఆజ్ఞతో అనుసంధానమైన క్రియను అసమాపక రూపంలో ఉంచుతుంది.
- source_word: θώρακα
  choice: వక్షకవచం
  rationale: ఛాతీని కాపాడే సైనిక కవచాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో సూచిస్తుంది.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: పౌలు వాడుకలోని righteousness భావానికి ‘నీతి’ సహజమైన ప్రధాన ఎంపిక. ‘న్యాయం’ అనే నిజమైన ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపింది.
theological_decisions:
- issue: δικαιοσύνη అనే పదం నీతినా, న్యాయమా
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ కవచ రూపకంలో ‘నీతి’ సాధారణ పౌలు వాడుకకు సరిపోతుంది; అయినా పదంలో ఉన్న సామాజిక న్యాయ భావాన్ని తొలగించకుండా ప్రత్యామ్నాయంగా పాదసూచికలో ఇచ్చింది.
- issue: ἐν ἀληθείᾳలో సత్యం వస్తుగత సత్యమా, వ్యక్తిగత సత్యనిష్ఠనా
  choice: సత్యంతో
  alternative: సత్యనిష్ఠతో
  rationale: ‘సత్యంతో’ అనే రూపం వస్తుగత సత్యం, నిజాయితీతో కూడిన జీవితం అనే రెండు భావాలకు చోటిస్తుంది; ప్రధాన పాఠ్యం ఒకదానికే పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా వినిపించే, అయితే సైనిక రూపకపు గంభీరతను నిలిపే శైలి వాడబడింది. గ్రీకు వాక్యంలో ప్రధాన ఆజ్ఞ చివరికి రావడం తెలుగులో సహజంగా ఉండటంతో ‘నిలబడండి’ చివర ఉంచబడింది; రెండు అసమాపక క్రియలు దానికి విధానపూర్వకంగా అనుసంధానించబడ్డాయి.
