id: EPH.6.7
reference: Ephesians 6:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μετ’ εὐνοίας δουλεύοντες, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/007.yaml
  text: serving with goodwill[a], as to the Lord and not to men,
translation:
  language: te
  text: మంచి మనసుతో సేవ చేయండి; మనుషులకు కాదు, ప్రభువుకే సేవ చేస్తున్నట్లుగా చేయండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετ’ εὐνοίας
  choice: మంచి మనసుతో
  rationale: μετά + షష్ఠీ విభక్తి ఇక్కడ సేవ చేసే తీరును లేదా దానితో కూడిన అంతరంగ వైఖరిని సూచిస్తుంది. εὔνοιαలో సద్భావం, ఇష్టపూర్వకత అనే భావాలు ఉన్నాయి; ‘మంచి మనసుతో’ సహజమైన ఆధునిక తెలుగులో ఆ భావాన్ని తెలియజేస్తుంది.
- source_word: δουλεύοντες
  choice: సేవ చేయండి
  rationale: δουλεύωకు దాసునిగా సేవ చేయడం అనే బలమైన నేపథ్యార్థం ఉంది. అయితే 6:5లో సంబోధితులు దాసులని సందర్భం ఇప్పటికే స్పష్టం చేస్తుంది; ఇక్కడ కృదంతం ప్రధానంగా వారు సేవ చేసే విధానాన్ని వివరిస్తుంది. తెలుగు వాక్య నిర్మాణానికి అనుగుణంగా విధ్యర్థక క్రియగా మార్చబడింది.
- source_word: ὡς
  choice: చేసినట్లు
  rationale: ὡς పోలికను లేదా సేవను ఏ దృష్టితో చేయాలో సూచిస్తుంది. ‘చేసినట్లు’ మూలంలోని పోలికను అదనపు వ్యాఖ్యానం లేకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τῷ κυρίῳ
  choice: ప్రభువుకు
  rationale: κύριος ఇక్కడ భూలోక యజమానులకు భిన్నంగా దైవిక ప్రభువును, సందర్భానుసారం ప్రభువైన యేసును, సూచిస్తుంది. ‘ప్రభువు’ క్రీస్తు సంబంధమైన బిరుదును నిలుపుతుంది.
- source_word: ἀνθρώποις
  choice: మనుషులకు
  rationale: ἄνθρωποι ఇక్కడ లింగాన్ని ప్రత్యేకంగా నొక్కకుండా మానవులను ప్రభువుతో వ్యత్యాసపరుస్తుంది. ‘మనుషులకు’ ఆ సాధారణ మానవార్థాన్ని తెలుగులో కచ్చితంగా ఇస్తుంది.
theological_decisions:
- issue: κύριοςను మానవ యజమానులకు వ్యత్యాసంగా ఎలా అనువదించాలి
  choice: ప్రభువు
  alternative: యజమాని
  rationale: ‘ప్రభువు’ దైవికమైన, క్రీస్తు సంబంధమైన బిరుదును కాపాడుతూ భూలోక యజమానులతో గందరగోళం రాకుండా చేస్తుంది.
- issue: δουλεύοντεςలోని దాస్య భావాన్ని ఎంత స్పష్టంగా వ్యక్తపరచాలి
  choice: సేవ చేయండి
  alternative: దాసులుగా సేవ చేయండి
  rationale: మునుపటి సందర్భంలో సంబోధితులు దాసులని ఇప్పటికే స్పష్టంగా ఉంది. ఇక్కడ ‘దాసులుగా’ మళ్లీ చేర్చడం మూలంలో లేని పునరుక్తిని కలిగించవచ్చు; ‘సేవ చేయండి’ కృదంతపు క్రియాభావాన్ని సహజంగా అందిస్తుంది.
- issue: ὡς... καὶ οὐκ నిర్మాణంలోని వ్యత్యాసం
  choice: మనుషులకు చేసినట్లు కాక, ప్రభువుకు చేసినట్లు
  alternative: ప్రభువుకు సేవ చేస్తున్నవారిలా, మనుషులకు కాదు
  rationale: తెలుగులో వ్యత్యాస భాగాన్ని ముందుకు తేవడం సహజంగా ఉండి, సేవ అంతిమంగా ప్రభువుకే అనే మూలపాఠపు బలాన్ని నిలుపుతుంది. ఇది ‘as if’ అనే అవాస్తవ భావాన్ని జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. సందర్భంలోని దాస్య వాస్తవాన్ని చెరపకుండా, ఈ వాక్యంలో అనవసరంగా పునరుక్తి చేయలేదు. మూలంలోని ఆజ్ఞార్థ భావాన్ని తెలుగులో స్వతంత్ర వాక్యంగా సహజంగా వ్యక్తపరచడానికి కృదంతాన్ని విధ్యర్థక క్రియగా మార్చాం.
