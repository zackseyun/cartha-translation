revisions:
- from: మంచి మనసుతో సేవ చేయండి; మనుషులకు చేసినట్లు కాక, ప్రభువుకు చేసినట్లు చేయండి.
  to: మంచి మనసుతో సేవ చేయండి; మనుషులకు కాదు, ప్రభువుకే సేవ చేస్తున్నట్లుగా చేయండి.
  rationale: The revision retains the source’s goodwill, service, and Lord-versus-human contrast while making the Telugu comparison clearly refer to service. The imperative remains a natural contextual rendering of the participle in this exhortation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:03:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately conveys εὔνοια as willing goodwill, retains the service sense of δουλεύοντες, and preserves the contrast between the Lord and human beings. Its imperative form is appropriate in Telugu because the participle continues the exhortation of the surrounding context. However, “మనుషులకు చేసినట్లు కాక, ప్రభువుకు చేసినట్లు చేయండి” is less precise and idiomatic: చేసినట్లు can suggest a completed act and the repeated చేయండి obscures that the comparison concerns the manner and orientation of serving.'
  naturalness: “మంచి మనసుతో” is natural modern Telugu. Recasting the final clause with “సేవ చేస్తున్నట్లుగా” makes the comparison clearly modify service and gives a more fluent Telugu sentence.
  terminology: “ప్రభువు” appropriately preserves κύριος as the divine Lord rather than an earthly master. “మనుషులు” accurately represents the generic ἀνθρώποις; no gender-specific rendering is warranted. No footnote is necessary in Telugu, since the generic human sense is clear from the Lord/humans contrast.
  issues:
  - severity: low
    issue: The comparison is expressed with “చేసినట్లు … చేయండి.”
    rationale: This construction is somewhat awkward and can imply that something has already been done. The Greek ὡς τῷ κυρίῳ concerns serving in the manner/orientation of serving the Lord; explicitly retaining సేవ in the comparison better represents it.
  revised_text: మంచి మనసుతో సేవ చేయండి; మనుషులకు కాదు, ప్రభువుకే సేవ చేస్తున్నట్లుగా చేయండి.
  revised_footnotes: []
  revision_rationale: The revision retains the source’s goodwill, service, and Lord-versus-human contrast while making the Telugu comparison clearly refer to service. The imperative remains a natural contextual rendering of the participle in this exhortation.
