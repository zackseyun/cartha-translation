  text: so that it may go well with you and you may live long on the earth[a].
translation:
  language: te
  text: తద్వారా నీకు మేలు కలుగుతుంది మరియు నీవు భూమిమీద[a] దీర్ఘకాలం జీవిస్తావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేశంలో.” ఇది నిర్గమకాండము 20:12, ద్వితీయోపదేశకాండము 5:16లలోని ఐదవ ఆజ్ఞ పదప్రయోగాన్ని ప్రతిధ్వనింపజేస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: అప్పుడు
  rationale: ముందటి వచనంలోని ఆజ్ఞకు జతచేయబడిన వాగ్దాన ఫలితాన్ని సహజమైన తెలుగులో సూచిస్తుంది; సందర్భంలో ఉద్దేశం/ఫలితం రెండింటి ఛాయనూ మితంగా నిలుపుతుంది.
- source_word: εὖ σοι γένηται
  choice: నీకు మేలు కలుగుతుంది
  rationale: ‘నీ విషయంలో మంచిగా జరుగుట’ అనే గ్రీకు నుడికారాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καὶ
  choice: ;
  rationale: రెండు సమన్వయ వాగ్దానాలను తెలుగులో స్పష్టంగా కలుపుతుంది; విరామచిహ్నం గ్రీకు καὶ యొక్క అనుసంధాన భావాన్ని సందర్భానుగుణంగా మోస్తుంది.
- source_word: ἔσῃ μακροχρόνιος
  choice: నీవు దీర్ఘకాలం జీవిస్తావు
  rationale: అక్షరార్థంగా ‘నీవు దీర్ఘాయుష్మంతుడవై ఉంటావు’; ఆధునిక తెలుగులో అర్థాన్ని స్పష్టంగా చెప్పే సహజ రూపం.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిమీద
  rationale: గ్రీకు పదబంధాన్ని దాని విస్తృత సాధారణ అర్థంలో నేరుగా ప్రతిబింబిస్తుంది; ‘దేశంలో’ అనే దశాజ్ఞల నేపథ్య ప్రతిధ్వనిని పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: ఐదవ ఆజ్ఞ వాగ్దానంతో సంబంధంలో ἐπὶ τῆς γῆς యొక్క పరిధి
  choice: భూమిమీద
  alternative: దేశంలో
  rationale: ఇక్కడి గ్రీకు పాఠం నిర్దిష్ట నిబంధన దేశాన్ని సూచించే స్వామ్యపదాన్ని చేర్చదు. కాబట్టి మూలపాఠంలోని విస్తృత పదప్రయోగాన్ని ప్రధాన వచనంలో ఉంచి, నిర్గమకాండము 20:12 మరియు ద్వితీయోపదేశకాండము 5:16ల ప్రతిధ్వనిని ప్రత్యామ్నాయంగా పాదటిప్పణిలో సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సులభంగా అర్థమయ్యేలా, అయినా వాగ్దానపు గంభీరత నిలిచేలా రూపొందించబడింది. ‘దీర్ఘకాలం జీవిస్తావు’ లింగసమావేశకంగా, సహజంగా ఉంది.
