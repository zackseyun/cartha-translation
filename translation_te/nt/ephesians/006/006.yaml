revisions:
- from: మనుష్యులను మెప్పించేవారిలా, ఇతరులు చూస్తున్నప్పుడు మాత్రమే పని చేయకుండా[a], మెస్సీయ దాసులుగా[b] దేవుని చిత్తాన్ని మనస్ఫూర్తిగా[c] నెరవేర్చండి.
  to: మనుష్యులను మెప్పించేవారిలా కంటికి కనిపించే సేవ మాత్రమే చేయకుండా[a], మెస్సీయకు దాసులుగా[b] దేవుని చిత్తాన్ని మనస్ఫూర్తిగా[c] నెరవేర్చండి.
  rationale: The revision preserves the source’s syntax and contrast while replacing a narrowly observational paraphrase with a natural Telugu expression for appearance-oriented service. It also clarifies allegiance to the Messiah and refines the ψυχή note while retaining the draft’s intended ambiguity and modern standard register.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:03:18Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast between performative service under observation and wholehearted obedience to God. A small revision better represents κατ’ ὀφθαλμοδουλίαν as service done for outward appearance, without narrowing it to occasions when ‘others’ happen to be watching. ‘మెస్సీయకు దాసులుగా’ makes the genitive relationship in δοῦλοι Χριστοῦ explicit and natural in Telugu.
  naturalness: The proposed wording is modern, clear, and retains the exhortative register inherited from the preceding verse. ‘కంటికి కనిపించే సేవ మాత్రమే’ is more idiomatic than ‘ఇతరులు చూస్తున్నప్పుడు మాత్రమే పని’ while preserving the metaphor’s function.
  terminology: ‘మెస్సీయ,’ ‘దాసులు,’ and ‘దేవుని చిత్తం’ are suitable and retain the title, allegiance/bonded-service force, and ethical-theological vocabulary of the Greek. ‘మనస్ఫూర్తిగా’ is a natural contextual rendering of ἐκ ψυχῆς; its literal wording is retained in a footnote without imposing a theory of ψυχή.
  issues:
  - severity: low
    issue: The phrase ‘ఇతరులు చూస్తున్నప్పుడు మాత్రమే పని చేయకుండా’ is somewhat narrower than ὀφθαλμοδουλίαν.
    rationale: The Greek denotes outward, appearance-oriented service (‘eye-service’), not specifically service only when unspecified ‘others’ are watching. ‘కంటికి కనిపించే సేవ మాత్రమే’ preserves the rhetorical metaphor and scope more closely.
  - severity: low
    issue: ‘మెస్సీయ దాసులుగా’ can sound compressed in Telugu.
    rationale: The Greek genitive expresses belonging/allegiance. ‘మెస్సీయకు దాసులుగా’ states this relationship naturally without changing its force.
  - severity: low
    issue: Footnote c offers ‘ఆత్మ నుంచి’ as though it were a straightforward literal equivalent.
    rationale: ψυχή is literally ‘soul,’ but in this idiom denotes the inner self/whole person. Giving ‘ప్రాణం నుండి’ as the literal-form note and ‘పూర్ణహృదయంతో’ as an idiomatic alternative avoids unnecessarily suggesting a fixed anthropological sense.
  revised_text: మనుష్యులను మెప్పించేవారిలా కంటికి కనిపించే సేవ మాత్రమే చేయకుండా[a], మెస్సీయకు దాసులుగా[b] దేవుని చిత్తాన్ని మనస్ఫూర్తిగా[c] నెరవేర్చండి.
