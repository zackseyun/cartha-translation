translation:
  language: te
  text: మనుష్యులను మెప్పించేవారిలా కంటికి కనిపించే సేవ మాత్రమే చేయకుండా[a], మెస్సీయకు దాసులుగా[b] దేవుని చిత్తాన్ని మనస్ఫూర్తిగా[c] నెరవేర్చండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా ‘కంటి-సేవ’; అంటే కనిపించడం కోసం, పర్యవేక్షణలో ఉన్నప్పుడు మాత్రమే చేసే సేవ.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘క్రీస్తుకు దాసులుగా’; గ్రీకు ‘క్రిస్టోస్’ అంటే ‘అభిషిక్తుడు,’ అంటే ‘మెస్సీయ.’
    reason: alternative_reading
  - marker: c
    text: లేదా ‘పూర్ణహృదయంతో’; అక్షరార్థంగా ‘ప్రాణం నుండి’ లేదా ‘ఆత్మ నుండి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοδουλίαν
  choice: ఇతరులు చూస్తున్నప్పుడు మాత్రమే పని చేయడం
  rationale: అరుదైన ఈ గ్రీకు సమాసానికి అక్షరార్థం ‘కంటి-సేవ’. పర్యవేక్షణ ఉన్నప్పుడు మాత్రమే కనిపించేలా పని చేయడమనే ప్రతికూల భావాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది; అక్షరార్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: ἀνθρωπάρεσκοι
  choice: మనుష్యులను మెప్పించేవారు
  rationale: మనుష్యుల ఆమోదం కోసం వారిని సంతోషపరచాలని చూసేవారిని సూచిస్తుంది. ఈ రూపం ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని ప్రతికూల నైతిక భావాన్ని నిలుపుతుంది.
- source_word: δοῦλοι
  choice: దాసులు
  rationale: తక్షణ సందర్భం నిజమైన బానిసలను ఉద్దేశించినప్పటికీ, ఇక్కడ క్రీస్తుకు చెందినవారనే బంధిత స్థితి ప్రధానంగా ఉంది. ‘దాసులు’ ఆ అధీనతను తెలుగులో గంభీరంగా తెలియజేస్తుంది; ‘సేవకులు’ కంటే మూలపద బలాన్ని ఎక్కువగా కాపాడుతుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός యొక్క ‘అభిషిక్తుడు’ అనే బిరుదు భావాన్ని నిలుపుతుంది. ‘క్రీస్తు’ అనే సుపరిచిత ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ποιοῦντες
  choice: నెరవేర్చండి
  rationale: చుట్టుపక్కల వాక్యాల నుంచి కొనసాగుతున్న ఆజ్ఞను తెలుగులో స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది. ‘దేవుని చిత్తం చేయడం’ అనే భావానికి ‘నెరవేర్చడం’ సులభంగా అర్థమవుతుంది.
- source_word: θέλημα
  choice: చిత్తం
  rationale: దేవుడు కోరేది లేదా సంకల్పించేది అనే భావంలో తెలుగు బైబిలు మరియు సాధారణ ఆధ్యాత్మిక వాడుకలో స్థిరమైన, గంభీరమైన పదం.
- source_word: ἐκ ψυχῆς
  choice: మనస్ఫూర్తిగా
  rationale: అక్షరార్థం ‘ప్రాణం/ఆత్మ నుంచి’. ఇక్కడ అంతరంగపూర్వకమైన, సంపూర్ణ నిబద్ధతతో చేసే కార్యాన్ని సహజ తెలుగులో ‘మనస్ఫూర్తిగా’ వ్యక్తం చేస్తుంది; మూలంలోని శరీరాంగ-మానవశాస్త్ర పదప్రయోగాన్ని పాదసూచికలో నమోదు చేశాం.
theological_decisions:
- issue: గృహనియమాల సందర్భంలో δοῦλοι అనువాదం
  choice: మెస్సీయ దాసులు
  alternative: మెస్సీయ సేవకులు; మెస్సీయ బానిసలు
  rationale: ఈ భాగం నిజమైన బానిసలను ఉద్దేశించి, వారి అంతిమ అధీనతను మెస్సీయతో మళ్లీ నిర్వచిస్తుంది. ‘బానిసలు’ చారిత్రక స్థితిని అత్యంత నేరుగా తెలిపినా తెలుగులో ఇక్కడ అనవసరంగా కఠినంగా వినిపించవచ్చు; ‘సేవకులు’ అధీనత బలాన్ని తగ్గిస్తుంది. ‘దాసులు’ రెండింటి మధ్య మూలంలోని బంధితత్వాన్ని గంభీరంగా నిలుపుతుంది.
- issue: Χριστοῦను బిరుదుగా లేదా పేరులాంటి రూపంగా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ అభిషిక్త పాలకునికి చెందిన దాసులనే విధేయత భావం ప్రధానంగా ఉంది; అందువల్ల బిరుదు అర్థాన్ని ‘మెస్సీయ’గా నిలిపాం. సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇచ్చి ప్రత్యామ్నాయాన్ని తెరిచి ఉంచాం.
- issue: ἐκ ψυχῆςలోని మానవశాస్త్ర భాష
  choice: మనస్ఫూర్తిగా
  alternative: ప్రాణం నుంచి; ఆత్మాంతరంగం నుంచి; పూర్ణహృదయంతో
  rationale: ψυχήను ఇక్కడ ప్రత్యేకమైన ఆత్మ-శరీర సిద్ధాంతంగా నిర్ణయించకుండా, అంతరంగపూర్వకతను సూచించే సహజ తెలుగు పదబంధాన్ని వాడాం. అక్షరార్థాన్ని పాదసూచికలో ఉంచడం ద్వారా మూలంలోని ఉద్వేగాన్ని కూడా కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ఆజ్ఞారూపం వాడబడింది. అరుదైన ‘కంటి-సేవ’ సమాసాన్ని ప్రధాన పాఠ్యంలో కృత్రిమంగా ఉంచకుండా అర్థాన్ని విప్పి చెప్పి, దాని అక్షరరూపాన్ని పాదసూచికలో కాపాడాం. ‘మెస్సీయ,’ ‘దాసులు,’ ‘చిత్తం’ వంటి పదాలు మూలంలోని విధేయత మరియు అధీనత బలాన్ని నిలుపుతాయి.
