source:
  edition: SBLGNT
  text: ⸂Τοῦ λοιποῦ⸃ ἐνδυναμοῦσθε ἐν κυρίῳ καὶ ἐν τῷ κράτει τῆς ἰσχύος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/010.yaml
  text: Finally[a], be strengthened in the Lord and in the strength of his might.
translation:
  language: te
  text: చివరిగా, ప్రభువులోనూ ఆయన బలశక్తిలోనూ బలం పొందండి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ప్రభువులో బలంగా ఉండండి.’ గ్రీకు క్రియను ఇలా కూడా సహజంగా అనువదించవచ్చు; అయితే ‘బలం పొందండి’ అనేది దానిలోని నిష్క్రియ భావాన్ని మరింత స్పష్టంగా నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: చివరిగా
  rationale: లేఖలోని ముగింపు ఉపదేశ విభాగాన్ని పరిచయం చేసే సంధాన పదబంధంగా సహజమైన ఆధునిక తెలుగులో అనువదించబడింది. ‘ఇకమీదట’ అనే అర్థసంభావ్యత ఉన్నప్పటికీ, ఇక్కడ ప్రసంగ మార్పును సూచించే ‘చివరిగా’ సందర్భానికి బాగా సరిపోతుంది.
- source_word: ἐνδυναμοῦσθε
  choice: బలం పొందండి
  rationale: 'వర్తమాన ఆజ్ఞార్థకంలోని నిష్క్రియ/మధ్యమ స్వరాన్ని సహజమైన తెలుగులో నిలుపుతుంది: పాఠకులు తమలో తామే బలాన్ని కలిగించుకోవాలని కాక, బలం పొందాలని పిలుపు అందుకుంటున్నారు.'
- source_word: ἐν κυρίῳ
  choice: ప్రభువులోనూ
  rationale: ἐν అనే విభక్తి సూచించే సంబంధపూర్వక పరిధిని ‘లో’ ద్వారా నిలుపుతుంది. ‘ప్రభువు చేత’ అని అనువదిస్తే సాధనార్థాన్ని అవసరానికి మించి నిర్దిష్టం చేసినట్లవుతుంది.
- source_word: κράτει τῆς ἰσχύος αὐτοῦ
  choice: ఆయన బలప్రభావంలోనూ
  rationale: κράτος లోని కార్యరూపంలో వ్యక్తమయ్యే ప్రభావశక్తిని ‘ప్రభావం’తో, ἰσχύς లోని అంతర్గత బలాన్ని ‘బలం’తో కలిపి చూపుతుంది. గ్రీకులోని రెండు బలసూచక పదాల గాఢతను నిలుపుతూ, తెలుగులో అతిగా కృత్రిమమైన పునరుక్తిని నివారిస్తుంది.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: ఈ సర్వనామం సహజంగా ముందున్న ‘ప్రభువు’ను సూచిస్తుంది; తెలుగులో గౌరవార్థక ఏకవచన రూపం వాడబడింది.
theological_decisions:
- issue: ἐνδυναμοῦσθε లోని వాచ్యం మరియు బలానికి మూలం
  choice: విశ్వాసులు ప్రభువుతో ఉన్న సంబంధంలో బలం పొందాలనే స్వీకారాత్మక ఆజ్ఞ
  alternative: ‘ప్రభువులో బలంగా ఉండండి’ అనే క్రియాశీల భావవ్యక్తీకరణ
  rationale: నిష్క్రియ/మధ్యమ రూపంలోని భావాన్ని ‘బలం పొందండి’ స్పష్టంగా నిలుపుతుంది; వ్యక్తిగత సంకల్పబలాన్ని మాత్రమే సూచించకుండా ప్రభువుపై ఆధారపడటాన్ని తెలియజేస్తుంది, అయితే బలపరచే విధానాన్ని వచనం చెప్పినదానికంటే ఎక్కువగా నిర్దిష్టం చేయదు.
- issue: κύριος పదానికి అనువాదం
  choice: ప్రభువు
  alternative: యజమాని
  rationale: పౌలు సందర్భంలో κύριος సహజంగా మహిమపరచబడిన యేసును సూచిస్తుంది. ‘ప్రభువు’ సాధారణమైన, గౌరవభరితమైన సమానార్థకం; అనువాదంలో అదనపు వివరణ అవసరం లేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సంక్షిప్తమైన, గౌరవభరితమైన ఆజ్ఞారూపం వాడబడింది. ‘బలప్రభావం’ అనే సమాసం గ్రీకులో వరుసగా వచ్చిన రెండు బలసూచక పదాల గాఢతను సాధ్యమైనంత సహజంగా నిలుపుతుంది.
