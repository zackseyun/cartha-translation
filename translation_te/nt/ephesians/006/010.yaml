  rationale: Only the rendering of κράτει τῆς ἰσχύος αὐτοῦ is revised. ‘బలశక్తి’ avoids the extraneous ‘influence/effect’ implication of ‘బలప్రభావం’ while naturally preserving the Greek phrase’s concentrated emphasis on the Lord’s strength and might. The footnote anchor and content remain valid.
