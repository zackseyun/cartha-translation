id: EPH.6.22
reference: Ephesians 6:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/ephesians/006/022.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: te
  text: 'ఈ సంగతికోసమే నేను అతణ్ణి మీ దగ్గరికి పంపాను: మీరు మా సంగతి తెలుసుకోవాలని[a], అతడు మీ హృదయాలను ప్రోత్సహించాలని.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మా పరిస్థితి తెలుసుకోవాలని”; లేదా, “మాకు సంబంధించిన విషయాలు తెలుసుకోవాలని.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: అతణ్ణి
  rationale: మునుపటి వచనంలోని తుకికును సూచించే పుంలింగ ఏకవచన సంబంధ సర్వనామం; తెలుగులో సహజమైన అనుసంధానానికి ‘అతణ్ణి’ వాడబడింది.
- source_word: ἔπεμψα
  choice: నేను ... పంపాను
  rationale: అయోరిస్ట్ సూచనార్థక క్రియను సందర్భానుగుణంగా సహజమైన భూతకాలంగా అనువదించాం.
- source_word: πρὸς ὑμᾶς
  choice: మీ దగ్గరికి
  rationale: పంపడం అనే క్రియతో πρός + ద్వితీయా విభక్తి వ్యక్తులవైపు గమనాన్ని సూచిస్తుంది.
- source_word: εἰς αὐτὸ τοῦτο
  choice: ఈ సంగతికోసమే
  rationale: αὐτὸ τοῦτο లోని ఉద్ఘాటనను ‘-ఏ’ నిలుపుతుంది; ఇది తెలుగులో సహజమైన ప్రయోజన సూచన.
- source_word: ἵνα
  choice: '... తెలుసుకోవాలని ... ప్రోత్సహించాలని'
  rationale: తెలుగులో ఉద్దేశార్థాన్ని సహజంగా తెలిపే ‘-ాలని’ నిర్మాణంతో రెండు సమన్విత ప్రయోజనాలను వ్యక్తం చేశాం.
- source_word: γνῶτε τὰ περὶ ἡμῶν
  choice: మీరు మా సంగతి తెలుసుకోవాలని
  rationale: τὰ περὶ ἡμῶν అనేది మా గురించి ఉన్న విషయాలు, మా పరిస్థితి రెండింటినీ సూచించగలదు; ‘మా సంగతి’ ఆ విస్తృతిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: παρακαλέσῃ
  choice: ప్రోత్సహించాలని
  rationale: παρακαλέωకు ఓదార్చడం, ప్రోత్సహించడం, బలపరచడం అనే భావాలు ఉండవచ్చు; హృదయాల సందర్భంలో ‘ప్రోత్సహించు’ విస్తృతమైన పాస్టరల్ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τὰς καρδίας ὑμῶν
  choice: మీ హృదయాలను
  rationale: మూలంలోని బైబిలీయ మానవ అంతరంగ చిత్రణను సహజంగా, ప్రత్యక్షంగా నిలుపుతుంది.
theological_decisions:
- issue: τὰ περὶ ἡμῶν యొక్క భావ పరిధి
  choice: ‘మా సంగతి’ అని అనువదించాం.
  alternative: ‘మా పరిస్థితి’ లేదా ‘మాకు సంబంధించిన విషయాలు’
  rationale: గ్రీకు పదబంధం వ్యక్తిగత క్షేమాన్నీ పరిసర పరిస్థితులనూ కలుపుకొని ఉండగలదు. ‘మా సంగతి’ దానిని బాహ్య పరిస్థితులకే పరిమితం చేయకుండా అస్పష్టతను నిలుపుతుంది.
- issue: παρακαλέσῃ యొక్క సందర్భార్థం
  choice: ‘ప్రోత్సహించాలని’ అని అనువదించాం.
  alternative: ‘ఓదార్చాలని’ లేదా ‘బలపరచాలని’
  rationale: ఈ క్రియకు సందర్భాన్ని బట్టి ఓదార్పు, ప్రోత్సాహం, బలపరచడం అనే భావాలు ఉన్నాయి. ఇక్కడ ఒక్క భావానికే అతిగా పరిమితం చేయకుండా సాధారణమైన ‘ప్రోత్సహించు’ ఎంచుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘హృదయాలు’ అనే మూల రూపకాన్ని నిలిపి, ‘మా సంగతి’ ద్వారా మూలంలోని భావ విస్తృతిని కాపాడాం.
