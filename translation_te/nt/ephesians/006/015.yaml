  yaml_path: translation/nt/ephesians/006/015.yaml
  text: and having shod your feet with the readiness of the gospel of peace,[a]
translation:
  language: te
  text: సమాధాన సువార్తకు సంబంధించిన సిద్ధతతో మీ పాదాలకు పాదరక్షలు తొడుక్కొని,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సంసిద్ధతతో’; దీనిని ‘సమాధాన సువార్తను ప్రకటించడానికి సిద్ధతతో’ అని, లేదా ‘సమాధాన సువార్త ఇచ్చే స్థిరమైన పాదస్థిరతతో’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδησάμενοι
  choice: పాదరక్షలుగా ధరించి ... సిద్ధం చేసుకోండి
  rationale: ఈ క్రియకు పాదరక్షలు తొడుక్కోవడం అనే అర్థం ఉంది. తెలుగు వాక్యంలో పాదరక్షల రూపకాన్ని స్పష్టంగా ఉంచుతూ, మధ్యమ ప్రయోగంలోని స్వీయ సిద్ధత భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοὺς πόδας
  choice: మీ పాదాలను
  rationale: మూలంలో ప్రత్యక్షంగా ‘పాదాలు’ ఉన్నందున శరీర రూపకాన్ని అలాగే నిలుపుతుంది.
- source_word: ἐν
  choice: -వల్ల కలిగే ... పాదరక్షలుగా
  rationale: ఇక్కడ ἐν సాధనం లేదా సన్నద్ధపరిచే ఉపకరణాన్ని సూచిస్తుంది. తెలుగులో రూపకాన్ని సహజంగా తెలియజేయడానికి ఈ నిర్మాణం వాడబడింది.
- source_word: ἑτοιμασίᾳ
  choice: సిద్ధత
  rationale: ἑτοιμασία యొక్క ప్రాథమిక భావమైన సిద్ధత లేదా సంసిద్ధతను నేరుగా తెలియజేస్తుంది; ప్రకటించడానికి సిద్ధత అనో, స్థిరమైన ఆధారం అనో ప్రధాన పాఠంలో నిర్ణయించదు.
- source_word: εὐαγγελίου
  choice: సువార్త
  rationale: పౌలు రచనల్లో స్థిరపడిన, ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సులభంగా అర్థమయ్యే పదం.
- source_word: τῆς εἰρήνης
  choice: సమాధాన
  rationale: ‘సువార్త’ను విశేషించే షష్ఠీ సంబంధాన్ని సహజమైన తెలుగు సమాస నిర్మాణంలో చూపుతుంది; సమాధానాన్ని గురించిన లేదా సమాధానాన్ని కలిగించే సువార్త అనే భావ విస్తృతిని నిలుపుతుంది.
theological_decisions:
- issue: ἐν ἑτοιμασίᾳ τοῦ εὐαγγελίου τῆς εἰρήνης అనే సంక్షిప్త పదబంధం యొక్క భావం
  choice: సమాధాన సువార్తవల్ల కలిగే సిద్ధతతో విశ్వాసి పాదాలు సన్నద్ధంగా ఉండాలి
  alternative: సమాధాన సువార్తను ప్రకటించడానికి సిద్ధంగా ఉండాలి; లేదా సమాధాన సువార్త ఇచ్చే స్థిరమైన ఆధారంపై నిలవాలి
  rationale: గ్రీకు పదబంధం సిద్ధతకు సువార్తతో ఉన్న సంబంధాన్ని పూర్తిగా నిర్దిష్టం చేయదు. అందువల్ల ప్రధాన పాఠం ఒకే వ్యాఖ్యానాన్ని బలవంతంగా ఎంచుకోకుండా, సాధారణ ‘సిద్ధత’ భావాన్ని ఉంచుతుంది; ప్రత్యామ్నాయాలను పాదసూచికలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; యుద్ధసామగ్రి సందర్భంలోని పాదరక్షల రూపకాన్ని స్పష్టంగా ఉంచుతూ, మూలంలోని భాగధాతు నిర్మాణాన్ని తెలుగులో సహజమైన ఆజ్ఞారూపంతో అనుసంధానించింది.
