source:
  edition: SBLGNT
  text: ἕκαστος ἡμῶν τῷ πλησίον ἀρεσκέτω εἰς τὸ ἀγαθὸν πρὸς οἰκοδομήν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: te
  text: మనలో ప్రతి ఒక్కరూ తన పొరుగువారిని వారి మేలు కోసం[a], వారిని బలపరచడానికి[b] సంతోషపరచాలి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మంచి దాని కోసం” లేదా “మేలు కలిగించడానికి.” ఈ గ్రీకు పదబంధం కేవలం వారికి నచ్చడాన్ని కాదు, వారికి ప్రయోజనకరమైన దానినే లక్ష్యంగా చూపుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నిర్మాణం కోసం” లేదా “అభివృద్ధి కోసం.” గ్రీకులోని పదం అక్షరార్థంగా కట్టడాన్ని సూచిస్తుంది; ఇక్కడ అది ఒకరిని దృఢపరచడం లేదా అభివృద్ధి చేయడాన్ని రూపకంగా సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: మనలో ప్రతి ఒక్కరూ
  rationale: విభాజక ఏకవచన భావాన్ని, సమూహంలోని ప్రతి వ్యక్తికీ వర్తించే ప్రబోధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τῷ πλησίον
  choice: తన పొరుగువానికి
  rationale: నైతిక సందర్భంలో ఒకరి తోటి వ్యక్తిని సూచిస్తుంది; ఏకవచన నిర్మాణాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: ἀρεσκέτω
  choice: అతనికి ఇష్టమైనది చేయాలి
  rationale: కేవలం మెప్పుకోసం ప్రవర్తించడం అనే భావం రాకుండా, తదనంతర ప్రయోజన సూచకాలచే పరిమితమైన ‘సంతోషపరచాలి/ఇష్టపడే విధంగా చేయాలి’ అనే ఆజ్ఞార్థక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: εἰς τὸ ἀγαθὸν
  choice: మేలు కలిగేలా
  rationale: పొరుగువాని ప్రయోజనమే లక్ష్యమని తెలుపుతుంది; ముఖస్తుతి లేదా విచక్షణలేని అనుకూలత అనే భావాన్ని నివారిస్తుంది.
- source_word: πρὸς οἰκοδομήν
  choice: బలపరచడానికి
  rationale: οἰκοδομή అనే ‘కట్టడం’ రూపకానికి ఇక్కడ ఉన్న వ్యక్తిని అభివృద్ధి చేసి దృఢపరచే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: పొరుగువానిని సంతోషపరచాలనే ఆజ్ఞ యొక్క పరిధి
  choice: అతనికి మేలు కలిగి, అతన్ని బలపరిచే దానికే పరిమితమైన ప్రవర్తన
  alternative: ఇతరులకు నచ్చే ప్రతిదానినీ విచక్షణ లేకుండా చేయడం
  rationale: εἰς τὸ ἀγαθὸν మరియు πρὸς οἰκοδομήν అనే రెండు లక్ష్యపదబంధాలు ἀρεσκέτω భావాన్ని స్పష్టంగా పరిమితం చేస్తున్నాయి; కాబట్టి ఈ నైతిక ఉద్వేగాన్ని అనువాదంలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘బలపరచడం’ ద్వారా రూపకార్థం స్పష్టమవుతుంది; ప్రత్యక్ష ‘కట్టడం’ రూపాన్ని పాదటిప్పణిలో భద్రపరిచాం.
