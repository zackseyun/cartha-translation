- from: మనలో ప్రతి ఒక్కరూ తన పొరుగువానికి మేలు కలిగేలా[a], అతన్ని బలపరచడానికి[b] అతనికి ఇష్టమైనది చేయాలి.
  to: మనలో ప్రతి ఒక్కరూ తన పొరుగువారిని వారి మేలు కోసం[a], వారిని బలపరచడానికి[b] సంతోషపరచాలి.
  rationale: 'The revision renders ἀρεσκέτω directly as “సంతోషపరచాలి,” while retaining both source purpose phrases: the neighbor’s good and building up. It uses natural gender-inclusive generic reference and replaces the misleading footnote alternative for οἰκοδομή with an idiomatic lexical alternative that preserves the building metaphor.'
