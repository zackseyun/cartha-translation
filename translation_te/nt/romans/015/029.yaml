id: ROM.15.29
reference: Romans 15:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: te
  text: నేను మీ దగ్గరికి వచ్చినప్పుడు, మెస్సీయ[a] యొక్క దీవెన సమృద్ధితో వస్తానని నాకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు దీవెన.’
    reason: Χριστός అనే బిరుదుకు తెలుగులో వాడుకలో ఉన్న ప్రత్యామ్నాయ రూపం.
lexical_decisions:
- source_word: οἶδα
  choice: నాకు తెలుసు
  rationale: పౌలు వ్యక్తం చేస్తున్న నిశ్చయాన్ని నేరుగా, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప అనుసంధానంగా ఉంది; తెలుగులో వాక్యప్రవాహమే ఆ సంబంధాన్ని సహజంగా చూపుతుంది. ‘కాని’ అని పెడితే మూలంలో ఉన్నదానికంటే ఎక్కువ వ్యతిరేక భావం వస్తుంది.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: నేను మీ దగ్గరికి వచ్చినప్పుడు
  rationale: భవిష్యత్ ప్రధాన క్రియకు సంబంధించి ఈ వర్తమాన కృదంతం కాలార్థకంగా పనిచేస్తోంది; ఈ రూపం తెలుగులో సహజంగా ఆ సంబంధాన్ని నిలుపుతుంది.
- source_word: ἐλεύσομαι
  choice: వస్తానని
  rationale: ἔρχομαι యొక్క భవిష్యత్ భావాన్ని నేరుగా తెలియజేస్తుంది; అదే ‘రావడం’ క్రియను పునరుక్తి చేయడం మూలవాక్య నిర్మాణాన్నీ ప్రతిబింబిస్తుంది.
- source_word: ἐν πληρώματι
  choice: పరిపూర్ణతతో
  rationale: ἐν ఇక్కడ తోడైన పరిస్థితి లేదా విధానాన్ని సూచిస్తుంది; πλήρωμα లోని నిండుదల, సంపూర్ణత భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: εὐλογίας
  choice: దీవెన
  rationale: ఈ ఏకవచన నామవాచకం ఆశీర్వాదం లేదా మేలును సమష్టిగా సూచిస్తుంది; ‘దీవెన’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా గ్రహించబడింది; ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని నిలుపుతుంది. సాంప్రదాయ ‘క్రీస్తు’ రూపాన్ని పాదసూచికలో ఇచ్చాం.
theological_decisions:
- issue: Χριστοῦ అనే బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός యొక్క అభిషిక్తుడు/మెస్సీయ అనే బిరుదు స్వభావాన్ని ప్రధాన పాఠ్యంలో వెల్లడిస్తూ, తెలుగు క్రైస్తవ వాడుకలో సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో ఉంచాం.
- issue: ‘మెస్సీయ దీవెన’లోని సంబంధం
  choice: సంబంధాన్ని విప్పకుండా నామవాచక సమాసంగా ఉంచడం
  alternative: మెస్సీయ అనుగ్రహించే దీవెన
  rationale: Χριστοῦ అనే షష్ఠీ విభక్తి మూలం, స్వామ్యం లేదా లక్షణాన్ని సూచించగలదు. ‘అనుగ్రహించే’ అని విప్పితే మూలంలో ఉన్న స్వల్ప అస్పష్టత ఒకే అర్థానికి పరిమితమవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని ‘రావడం’ క్రియ పునరుక్తిని నిలిపి, Χριστοῦ అనే షష్ఠీ సంబంధాన్ని అతిగా వివరణ చేయకుండా ఉంచాం.
