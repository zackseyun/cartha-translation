id: ROM.15.28
reference: Romans 15:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: te
  text: కాబట్టి, నేను ఈ పనిని పూర్తి చేసి, ఈ ఫలాన్ని వారికి ముద్రవేసి అప్పగించిన తర్వాత[a][b], మీ వద్దుగా స్పెయిన్‌కు వెళ్తాను.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ముద్రవేసి అప్పగించిన’ అంటే ‘ఈ ఫలాన్ని వారికి భద్రంగా అందించిన’ అని కూడా అనువదించవచ్చు. ఇక్కడ ‘ముద్రవేయడం’ కానుకను దాని గ్రహీతలకు అధికారికంగా లేదా భద్రంగా అప్పగించడాన్ని సూచించే అవకాశం ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఈ ఫలం’ అనేది అన్యజన విశ్వాసులు యెరూషలేములోని పరిశుద్ధుల కోసం సమకూర్చిన ఆర్థిక కానుకను సూచిస్తుంది.
    reason: cultural_note
  - marker: c
    text: అక్షరార్థంగా, ‘మీ ద్వారా’ లేదా ‘మీ మధ్యగా’. పౌలు స్పెయిన్‌కు వెళ్లేటప్పుడు రోము మీదుగా ప్రయాణించాలని ఉద్దేశించినట్లు కనిపిస్తుంది; వారి సహాయం కూడా భావంలో ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ఈ పనిని
  rationale: ముందటి వచనాల్లో చెప్పిన యెరూషలేము విశ్వాసులకు కానుకను చేర్చే పనిని సూచిస్తుంది; తెలుగులో సూచన స్పష్టంగా ఉండేందుకు ‘పని’ చేర్చబడింది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి చర్చనుంచి వచ్చే తార్కిక కొనసాగింపును సహజంగా తెలియజేస్తుంది.
- source_word: ἐπιτελέσας
  choice: పూర్తి చేసి
  rationale: ప్రధాన భవిష్యత్ క్రియకు ముందు ఈ పని ముగుస్తుందని తెలిపే పూర్వకాలిక భాగధాతు భావాన్ని నిలుపుతుంది.
- source_word: σφραγισάμενος
  choice: ముద్రవేసి అప్పగించిన
  rationale: σφραγίζω అనే క్రియలోని ‘ముద్రవేయు’ రూపకాన్ని నిలుపుతూ, ఈ సందర్భంలో కానుకను భద్రంగా, అధికారికంగా గ్రహీతలకు అందించడం అనే భావాన్ని సహజ తెలుగులో సూచిస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: యెరూషలేములోని పరిశుద్ధులను, అంటే కానుక గ్రహీతలను సూచించే దత్తివాచక సర్వనామం.
- source_word: τὸν καρπὸν τοῦτον
  choice: ఈ ఫలాన్ని
  rationale: అన్యజన విశ్వాసుల ఉదారతవల్ల వచ్చిన ఆర్థిక కానుకను సూచించే పౌలు రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: ἀπελεύσομαι
  choice: వెళ్తాను
  rationale: తదుపరి గమ్యస్థానానికి పౌలు వెళ్లబోతున్నాడనే భవిష్యత్ ప్రయాణాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: δι’ ὑμῶν
  choice: మీ దగ్గరగా ప్రయాణించి
  rationale: διά + షష్ఠీ విభక్తి ఇక్కడ రోము మీదుగా ప్రయాణించడాన్ని సూచిస్తుంది; ‘మీ ద్వారా’ సహాయార్థానికే పరిమితమయ్యే అవకాశం ఉన్నందున ప్రయాణ భావం స్పష్టపరచబడింది.
- source_word: εἰς Σπανίαν
  choice: స్పెయిన్‌కు
  rationale: గమ్యస్థానాన్ని సూచించే సహజ ఆధునిక తెలుగు రూపం.
theological_decisions:
- issue: ‘ఈ ఫలాన్ని వారికి ముద్రవేసి’ అనే రూపకం యెరూషలేము కానుకకు ఎలా వర్తిస్తుంది
  choice: మూలంలోని ‘ముద్రవేయడం’ రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, సహజత కోసం ‘అప్పగించిన’ అని జోడించడం
  alternative: ఈ కానుకను వారికి భద్రంగా అందించిన తర్వాత
  rationale: ‘ముద్రవేయు’ అనే మూలపద చిత్రాన్ని పూర్తిగా వ్యాఖ్యానాత్మకంగా మార్చకుండా కాపాడుతుంది; అదే సమయంలో తెలుగులో దీని సందర్భార్థమైన అధికారిక లేదా భద్రమైన అప్పగింతను గ్రహించేందుకు సహాయపడుతుంది.
- issue: δι’ ὑμῶν లో ప్రయాణ మార్గమా లేక వారి సహాయమా
  choice: రోము విశ్వాసుల దగ్గరగా/వారి ప్రాంతం మీదుగా ప్రయాణించడం అనే ప్రధాన భావం
  alternative: మీ ద్వారా లేదా మీ సహాయంతో
  rationale: διά + షష్ఠీ విభక్తి మార్గాన్ని సూచించగలదు; సందర్భం స్పెయిన్‌కు వెళ్లే ప్రయాణం. అయితే వారి సహాయం కూడా అంతర్లీనంగా ఉండవచ్చనే అవకాశాన్ని పాదటిప్పణి నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఫలం’ మరియు ‘ముద్రవేయడం’ అనే పౌలు రూపకాలను నిలుపుతూ, వాక్య సహజత కోసం పరిమిత స్పష్టీకరణ ఇచ్చాం.
