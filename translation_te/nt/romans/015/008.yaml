id: ROM.15.8
reference: Romans 15:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: te
  text: ఎందుకంటే, దేవుని సత్యం నిమిత్తం[a], పితరులకు చేసిన వాగ్దానాలను స్థిరపరచడానికి మెస్సీయ సున్నతి పొందినవారికి సేవకుడయ్యాడని నేను చెబుతున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని సత్యనిష్ఠ నిమిత్తం”; అంటే, తన నిబంధన వాగ్దానాలను నిలబెట్టుకోవడంలో దేవుని నమ్మకత్వాన్ని ఇది నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ
  choice: ఎందుకంటే ... నేను చెబుతున్నాను
  rationale: γάρ ముందటి వాదనకు వివరణాత్మక సంబంధాన్ని చూపుతుంది; λέγω యొక్క ప్రత్యక్ష భావాన్ని సహజమైన తెలుగు వాక్యక్రమంలో నిలిపింది.
- source_word: Χριστόν
  choice: మెస్సీయ
  rationale: ఇశ్రాయేలు, సున్నతి, పితరుల వాగ్దానాల సందర్భంలో Χριστός బిరుదుగా పనిచేస్తోంది.
- source_word: διάκονον γεγενῆσθαι
  choice: సేవకుడయ్యాడని
  rationale: διάκονος ఇక్కడ సంఘపదవిని కాక సేవ చేసే పాత్రను సూచిస్తుంది; పరిపూర్ణ infinitive ఫలితస్థితిని తెలుగు క్రియలో సహజంగా వ్యక్తం చేసింది.
- source_word: περιτομῆς
  choice: సున్నతి పొందినవారికి
  rationale: ఈ genitive సున్నతి పొందిన ప్రజలను, అంటే యూదులను, సూచిస్తుంది; 'వారికి' అనేది సేవ యొక్క సంబంధాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: దేవుని సత్యం నిమిత్తం
  rationale: ὑπέρ యొక్క నిమిత్తార్థాన్ని నిలిపి, ἀλήθεια అనే పదంలోని 'సత్యం/సత్యనిష్ఠ' అర్థవిస్తృతిని ప్రధాన పాఠం మరియు పాదసూచిక ద్వారా సంరక్షించింది.
- source_word: εἰς τὸ βεβαιῶσαι
  choice: స్థిరపరచడానికి
  rationale: ఉద్దేశాన్ని సూచించే నిర్మాణాన్నీ, βεβαιόωలోని దృఢపరచడం లేదా నిర్ధారించడం అనే భావాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τὰς ἐπαγγελίας τῶν πατέρων
  choice: పితరులకు చేసిన వాగ్దానాలను
  rationale: genitiveను వాగ్దానాల గ్రహీతలుగా అర్థం చేసుకుని తెలుగులో అవసరమైన 'చేసిన'ను చేర్చింది; 'పితరులు' ఇశ్రాయేలు పూర్వపితామహుల చారిత్రక ప్రత్యేకతను నిలుపుతుంది.
theological_decisions:
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ రక్షణ-చారిత్రక సందర్భంలో పదం పేరులా కాక అభిషిక్తుని బిరుదుగా ప్రధానంగా పనిచేస్తుంది.
- issue: ἀλήθεια θεοῦ యొక్క భావం
  choice: దేవుని సత్యం
  alternative: దేవుని సత్యనిష్ఠ
  rationale: మూలపదంలోని విస్తృతమైన 'సత్యం' భావాన్ని ప్రధాన పాఠంలో ఉంచి, వాగ్దానాలను నెరవేర్చే దేవుని నమ్మకత్వ భావాన్ని పాదసూచికలో సంరక్షించింది.
- issue: περιτομῆς సూచించే వర్గం
  choice: సున్నతి పొందినవారు
  alternative: సున్నతి
  rationale: ఇక్కడ సున్నతి అనే ఆచారంకన్నా ఆ గుర్తు కలిగిన ఇశ్రాయేలు ప్రజలే ఉద్దేశించబడ్డారు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని వివరణాత్మక సంబంధం, ఉద్దేశ వాక్యం, నిబంధన-వాగ్దాన సందర్భం నిలుపబడ్డాయి; [a] గుర్తు ప్రధాన పాఠంలో చేర్చబడింది.
