id: ROM.15.23
reference: Romans 15:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νυνὶ δὲ μηκέτι τόπον ἔχων ἐν τοῖς κλίμασι τούτοις, ἐπιποθίαν δὲ ἔχων τοῦ ἐλθεῖν πρὸς ὑμᾶς ἀπὸ ⸀ἱκανῶν ἐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/023.yaml
  text: But now[a], no longer having any place in these regions, but having had a longing for many years to come to you,
translation:
  language: te
  text: కాని ఇప్పుడు, ఈ ప్రాంతాల్లో ఇక నాకు చోటు లేక, అనేక సంవత్సరాలుగా మీ దగ్గరికి రావాలనే ఎంతో కోరిక కలిగి ఉండి,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: కాని ఇప్పుడు
  rationale: δέ సూచించే సందర్భ మార్పును, νυνί తెలిపే ప్రస్తుత కాలస్థితిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: μηκέτι
  choice: ఇక ... లేకపోవడంతో
  rationale: మునుపటి పరిస్థితి ఇప్పుడు కొనసాగడం లేదనే కాలార్థక నిరాకరణను తెలియజేస్తుంది.
- source_word: τόπον ἔχων
  choice: నాకు చోటు
  rationale: ‘చోటు’ అనే మూల రూపకాన్ని నిలుపుతూ, పరిచర్యకు మిగిలిన కార్యక్షేత్రం లేదా అవకాశం అనే సందర్భార్థాన్ని పాదసూచికలో వివరిస్తుంది.
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: ఈ ప్రాంతాల్లో
  rationale: κλίματα సూచించే విస్తృత భౌగోళిక ప్రాంతాలను ఆధునిక, స్పష్టమైన తెలుగులో అందిస్తుంది.
- source_word: ἐπιποθίαν ... ἔχων
  choice: నాకు ఎంతో కోరికగా ఉండడంతో
  rationale: బలమైన ఆకాంక్షను తెలియజేసే ἐπιποθία భావాన్ని, కొనసాగుతున్న వాక్యంలోని కారణాత్మక భాగంతో సహజంగా కలుపుతుంది.
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: మీ దగ్గరికి రావాలని
  rationale: గ్రీకు క్రియార్థక నిర్మాణంలోని కోరిక విషయాన్ని అదనపు భావం చేర్చకుండా నేరుగా తెలుపుతుంది.
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: ఎన్నో సంవత్సరాలుగా
  rationale: గతంలో మొదలై ఇప్పటివరకు కొనసాగిన కాలవ్యవధిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
