translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఈ వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర కామాను ఉంచి, గ్రీకులోని అసంపూర్ణ వాక్య నిర్మాణాన్ని నిలిపాం.
