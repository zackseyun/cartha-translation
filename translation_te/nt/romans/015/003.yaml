id: ROM.15.3
reference: Romans 15:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: te
  text: 'ఎందుకంటే మెస్సీయా[a] కూడా తనను తాను సంతోషపరచుకోలేదు; కానీ, ఇలా వ్రాయబడి ఉంది: “నిన్ను నిందించినవారి నిందలు నాపై పడ్డాయి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.”
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: ఎందుకంటే ... కూడా
  rationale: ముందటి ఉపదేశానికి కారణాన్ని అనుసంధానిస్తూ, అభిషిక్తుని ఉదాహరణను నొక్కిచెప్పే inferential మరియు emphatic భావాలు రెండింటినీ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὁ Χριστός
  choice: అభిషిక్తుడు
  rationale: ఇక్కడ Χριστός వ్యక్తిపేరులా కాక బిరుదుగా పనిచేస్తోంది; దాని మూలార్థాన్ని తెలుగులో స్పష్టంగా తెలిపే బిరుదు రూపం ఇది.
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: తనను తాను సంతోషపరచుకోలేదు
  rationale: ἤρεσεν అనే ‘సంతోషపరచడం/మెప్పించడం’ భావాన్ని, ἑαυτῷ అనే ఆత్మవాచక సూచనను దగ్గరగా నిలుపుతుంది; ‘తన ఇష్టానుసారం జీవించలేదు’ వంటి విస్తృత వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: అయితే ... అని రాసి ఉన్నట్లే జరిగింది
  rationale: ముందటి నిరాకరణకు వ్యతిరేకతను చూపుతూ, స్థిరమైన లేఖన ఉద్ధరణ సూత్రాన్ని సహజ తెలుగులో తెలియజేస్తుంది. ‘జరిగింది’ అనేది వాక్యాన్ని తెలుగులో సంపూర్ణం చేస్తుంది.
- source_word: ὀνειδισμοί
  choice: నిందలు
  rationale: అవమానకరమైన దూషణలు లేదా అపనిందలు అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో, లేఖనోచిత గాంభీర్యంతో అందిస్తుంది.
- source_word: τῶν ὀνειδιζόντων σε
  choice: నిన్ను నిందించినవారి
  rationale: గ్రీకులోని participial construction‌ను సహజమైన సంబంధార్థక తెలుగు రూపంలో ఇస్తూ, ὀνειδισμοίతో ఉన్న ఒకే మూలపద పునరుక్తిని ‘నిందించినవారి—నిందలు’గా కాపాడుతుంది.
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: నాపై పడ్డాయి
  rationale: గ్రీకు aorist‌ను సాధారణ భూతకాలంగా, ‘పై పడడం’ అనే రూపకాన్ని నేరుగా నిలుపుతూ అనువదిస్తుంది.
theological_decisions:
- issue: Χριστός పదం అనువాదం
  choice: అభిషిక్తుడు
  alternative: క్రీస్తు
  rationale: ఉపపదంతో ఉన్న ὁ Χριστός ఇక్కడ బిరుదు భావాన్ని ముందుకు తెస్తోంది. ‘అభిషిక్తుడు’ మూల గ్రీకు బిరుదు అర్థాన్ని వెల్లడిస్తుంది; పాఠకులకు సుపరిచితమైన ‘క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఉంచాం.
- issue: లేఖన ఉద్ధరణలో మాట్లాడుతున్న వ్యక్తి గుర్తింపు
  choice: ‘నాపై’ అనే మూల ఉద్ధరణను వివరణ లేకుండా నిలుపడం
  alternative: ‘నాపై’ అనేది అభిషిక్తుడిని సూచిస్తుందని ప్రధాన పాఠ్యంలో స్పష్టం చేయడం
  rationale: పౌలు ఈ కీర్తన వాక్యాన్ని అభిషిక్తునికి వర్తింపజేస్తున్నా, ఉద్ధరణ స్వయంగా చెప్పేదానికంటే ఎక్కువగా వక్తను గుర్తించడం theological tension‌ను ముందుగానే పరిష్కరిస్తుంది. కాబట్టి మూలంలోని అస్పష్టతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘నిందించినవారి నిందలు’ అనే పునరుక్తి గ్రీకు మూలంలోని cognate repetition‌ను ఉద్దేశపూర్వకంగా కాపాడుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
