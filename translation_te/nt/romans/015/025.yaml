id: ROM.15.25
reference: Romans 15:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: te
  text: కానీ ఇప్పుడు నేను పరిశుద్ధులకు సేవ చేయడానికి యెరూషలేముకు వెళ్తున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరిశుద్ధులకు సేవ చేస్తూ.” ఇక్కడ “సేవ చేయడం” అనేది బహుశా యెరూషలేములోని విశ్వాసుల కోసం సేకరించిన సహాయాన్ని వారికి అందించడాన్ని సూచిస్తుంది (రోమా 15:26 చూడండి).
    reason: διακονῶν అనే క్రియావిశేషణ రూపం ఉద్దేశాన్ని లేదా సమకాలీన పరిస్థితిని సూచించవచ్చు; సందర్భం ఆచరణాత్మక సహాయాన్ని సూచిస్తోంది.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: కానీ ఇప్పుడు
  rationale: νυνί ప్రస్తుత కాలాన్ని నొక్కి చెబుతుంది; δέ సందర్భంలో స్వల్ప వ్యత్యాసాన్ని సూచిస్తుంది. ‘కానీ ఇప్పుడు’ ఈ రెండింటినీ సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: πορεύομαι
  choice: నేను ... వెళ్తున్నాను
  rationale: ఈ వర్తమానకాల క్రియ ప్రస్తుత ప్రయాణాన్ని లేదా సమీప ప్రయాణ ఉద్దేశాన్ని సూచిస్తుంది. ‘వెళ్తున్నాను’ మూలంలోని గమన భావాన్ని అదనపు వివరణ లేకుండా అందిస్తుంది.
- source_word: εἰς Ἰερουσαλὴμ
  choice: యెరూషలేముకు
  rationale: εἰς ఇక్కడ గమ్యస్థానాన్ని సూచిస్తుంది; తెలుగు దత్తివిభక్తి ప్రత్యయం ‘-కు’ సహజంగా అదే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: διακονῶν
  choice: సేవ చేయడానికి
  rationale: ఈ వర్తమాన క్రియావిశేషణ రూపం పౌలు ప్రయాణానికి సంబంధించిన ఉద్దేశం లేదా సందర్భాన్ని తెలియజేస్తుంది. తరువాతి వచనం ప్రకారం ఇది ఆచరణాత్మక సహాయాన్ని అందించడాన్ని సూచించే అవకాశం ఉన్నా, ‘సేవ చేయడానికి’ మూలంలోని విస్తృత సేవాభావాన్ని నిలుపుతుంది.
- source_word: τοῖς ἁγίοις
  choice: పరిశుద్ధులకు
  rationale: పౌలు వాడుకలో ఈ పదబంధం విశ్వాసులను సూచిస్తుంది. ‘పరిశుద్ధులు’ మూలపదానికి సన్నిహితమైన, తెలుగు బైబిలు భాషలో పరిచితమైన పదం; ‘దేవుని ప్రజలు’ కంటే తక్కువ వ్యాఖ్యానాత్మకం.
theological_decisions:
- issue: ‘పరిశుద్ధులు’ ఎవరిని సూచిస్తున్నారు?
  choice: ప్రధాన పాఠ్యంలో ‘పరిశుద్ధులకు’ అని మూలంలోని సాధారణ పదప్రయోగాన్ని నిలుపడం
  alternative: యెరూషలేములోని విశ్వాసులకు, ముఖ్యంగా వారిలోని పేదలకు అని స్పష్టంగా అనువదించడం
  rationale: తక్షణ సందర్భం (రోమా 15:26) యెరూషలేములోని విశ్వాసుల కోసం సేకరించిన సహాయాన్ని సూచిస్తుంది. అయినా ఈ వచనంలోని τοῖς ἁγίοις స్వయంగా ‘పరిశుద్ధులకు’ అనే విస్తృత రూపంలోనే ఉంది; అందువల్ల సందర్భార్థాన్ని ప్రధాన పాఠ్యంలో కలపకుండా మూలంలోని పదాన్ని నిలిపాం.
- issue: διακονῶν సూచించే సేవ స్వరూపం
  choice: ‘సేవ చేయడానికి’ అనే విస్తృత అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘సహాయం తీసుకెళ్లడానికి’ అని నిర్దిష్టంగా చెప్పడం
  rationale: తరువాతి వచనం ధనసహాయం సేకరణను స్పష్టం చేసినప్పటికీ, διακονῶν అనే పదం స్వతహాగా విస్తృతమైన సేవను సూచించగలదు. అనిశ్చితిని తొలగించకుండా సందర్భసూచనను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘పరిశుద్ధులు’ అనే పరిచిత బైబిలు పదాన్ని నిలిపి, ‘పరిచర్య’ వంటి సంస్థాగత లేదా మతపదవి భావం కలిగించగల పదానికి బదులుగా సాధారణమైన ‘సేవ’ను ఎంచుకున్నాం. పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో ఉంది.
