id: ROM.15.7
reference: Romans 15:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: te
  text: కాబట్టి, మెస్సీయ కూడా మిమ్మల్ని స్వీకరించినట్లే మీరు ఒకరినొకరు స్వీకరించండి, దేవుని మహిమ కొరకు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “కాబట్టి, దేవుని మహిమ కొరకు మీరు ఒకరినొకరు స్వీకరించండి, మెస్సీయ కూడా మిమ్మల్ని స్వీకరించినట్లే.”'
    reason: “దేవుని మహిమ కొరకు” అనే పదబంధం మెస్సీయ స్వీకరించిన కార్యానికో, లేదా పరస్పరం స్వీకరించాలనే మొత్తం ఉపదేశానికో సంబంధించవచ్చనే వాక్యనిర్మాణ అవకాశాన్ని సూచిస్తుంది.
lexical_decisions:
- source_word: Διὸ
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: προσλαμβάνεσθε
  choice: చేర్చుకోండి
  rationale: సమాజంలో ఒకరిని ఆహ్వానపూర్వకంగా అంగీకరించి తమవారిగా స్వీకరించడాన్ని తెలియజేస్తుంది; కేవలం అభిప్రాయ సమ్మతికంటే సంబంధపూర్వక భావాన్ని నిలుపుతుంది.
- source_word: ἀλλήλους
  choice: ఒకరినొకరు
  rationale: పరస్పర చర్యను సహజమైన తెలుగు రూపంలో కాపాడుతుంది.
- source_word: καθὼς καὶ
  choice: '...ట్లే ... కూడా'
  rationale: పోలికను, καί యొక్క అదనపు బలాన్ని రెండింటినీ తెలుగు వాక్యనిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ὁ Χριστὸς
  choice: మెస్సీయ
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న Χριστός ఇక్కడ బిరుదుగా పనిచేస్తున్నందున దాని మెస్సీయ సంబంధిత అర్థాన్ని నిలుపుతుంది.
- source_word: προσελάβετο
  choice: చేర్చుకున్నాడు
  rationale: ప్రధాన ఆజ్ఞలోని అదే గ్రీకు క్రియకు సమానమైన తెలుగు క్రియను వాడి పౌలు ఉద్దేశించిన పోలికను నిలుపుతుంది.
- source_word: ὑμᾶς
  choice: మిమ్మల్ని
  rationale: బహువచన ద్వితీయ పురుష ప్రత్యక్ష కర్మను సహజంగా తెలియజేస్తుంది.
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: దేవునికి మహిమ కలిగేలా
  rationale: εἰς సూచించగల లక్ష్యం లేదా ఫలితాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, దానిని అతిగా నిర్దిష్టం చేయదు.
theological_decisions:
- issue: Χριστός పదం అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ ఈ పదం బిరుదుగా కనిపిస్తుంది. ‘మెస్సీయ’ మూలపదంలోని అభిషిక్తుడనే బిరుదు భావాన్ని స్పష్టంగా ఉంచుతుంది; వ్యక్తి గుర్తింపును లేదా క్రీస్తు సంబంధిత బోధను మార్చదు.
- issue: προσλαμβάνομαι యొక్క సంఘసంబంధ భావం
  choice: చేర్చుకోండి
  alternative: అంగీకరించండి / స్వీకరించండి
  rationale: రోమా 14–15 సందర్భంలో విభిన్న విశ్వాసులను సమాజంలో తమవారిగా ఆదరించి స్వీకరించే భావం ఉంది. ‘చేర్చుకోండి’ ఆ సంబంధపూర్వక నైతిక బలాన్ని సహజంగా అందిస్తుంది.
- issue: εἰς δόξαν τοῦ θεοῦ యొక్క సంబంధం
  choice: దేవునికి మహిమ కలిగేలా
  alternative: దేవుని మహిమ కొరకు
  rationale: ఈ పదబంధం మెస్సీయ చేర్చుకున్న చర్యకే గాని పరస్పరం చేర్చుకోవాలనే మొత్తం ఆజ్ఞకే గాని లక్ష్యం/ఫలితాన్ని సూచించవచ్చు. తెలుగు వాక్యక్రమం మొత్తం ఉపదేశానికి వర్తించేలా సహజంగా ఉంచినా, పాదటిప్పణి ప్రత్యామ్నాయ అనుసంధానాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘చేర్చుకోండి’ అనే పదాన్ని రెండుసార్లు ఉపయోగించి గ్రీకులోని క్రియాపునరుక్తి మరియు నైతిక నమూనాను నిలిపాం. మూలంలో లేని సంబోధనలు లేదా సంఘపరమైన ప్రత్యేక పదజాలం చేర్చలేదు.
