id: ROM.15.13
reference: Romans 15:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: te
  text: నిరీక్షణ దేవుడు, మీరు విశ్వసించడంలో సమస్త ఆనందంతోను సమాధానంతోను మిమ్మల్ని నింపుగాక; పరిశుద్ధాత్మ శక్తి ద్వారా మీరు నిరీక్షణలో సమృద్ధిగా ఉండునట్లు చేయుగాక.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: నిరీక్షణకు మూలమైన దేవుడు
  rationale: δὲ యొక్క స్వల్ప అనుసంధాన భావాన్ని తెలుగులో ప్రత్యేక పదంతో బలవంతంగా చూపలేదు. τῆς ἐλπίδος దేవుణ్ణి నిరీక్షణతో సంబంధింపజేస్తుంది; సహజ తెలుగులో ఆయన నిరీక్షణకు మూలమని వ్యక్తం చేస్తూ ‘నిరీక్షణకు మూలమైన దేవుడు’ అని అనువదించాం.
- source_word: πληρώσαι
  choice: నింపుగాక
  rationale: ఆశీర్వాదపూర్వక కోరికను తెలిపే aorist optative భావాన్ని గౌరవప్రదమైన తెలుగు కోరికరూపం ‘నింపుగాక’ సహజంగా నిలుపుతుంది.
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: సమస్త ఆనందంతో, సమాధానంతో
  rationale: πληρόω తరువాతి content genitives నింపబడే విషయాన్ని సూచిస్తాయి. πάσης యొక్క సమగ్రతను ‘సమస్త’ నిలుపుతుంది.
- source_word: ἐν τῷ πιστεύειν
  choice: మీరు నమ్మడంలో
  rationale: ἐν + articular infinitive విశ్వసించే క్రియ లేదా పరిధిని సూచిస్తుంది. నామవాచకమైన ‘విశ్వాసంలో’ కంటే ‘మీరు నమ్మడంలో’ πιστεύειν అనే క్రియారూపాన్ని మరింత నేరుగా ప్రతిబింబిస్తుంది.
- source_word: εἰς τὸ περισσεύειν ὑμᾶς
  choice: తద్వారా ... మీరు ... సమృద్ధిగా ఉండగలరు
  rationale: εἰς τὸ + infinitive ఇక్కడ ఉద్దేశిత ఫలితాన్ని సూచించగలదు. ‘తద్వారా’ ఉద్దేశం-ఫలితం మధ్య ఉన్న గ్రీకు సౌలభ్యాన్ని అతిగా కుదించకుండా తెలుపుతుంది.
- source_word: ἐν τῇ ἐλπίδι
  choice: నిరీక్షణలో
  rationale: ముందటి ἐλπίδος తో ఉన్న పదసంబంధాన్ని ‘నిరీక్షణ’ అనే ఒకే పదంతో నిలిపి, ἐν భావాన్ని ‘లో’ ద్వారా చూపిస్తుంది.
- source_word: ἐν δυνάμει
  choice: శక్తి చేత
  rationale: ఇక్కడ ἐν సాధనార్థక భావాన్ని కలిగి ఉంది; నిరీక్షణలో సమృద్ధి పరిశుద్ధాత్మ శక్తి ద్వారా కలుగుతుందని ‘శక్తి చేత’ స్పష్టంగా తెలుపుతుంది.
- source_word: πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మ
  rationale: పౌలు వాడుకలో ఇది దేవుని పరిశుద్ధాత్మను సూచిస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ‘పరిశుద్ధాత్మ’ సహజమైన, గౌరవప్రదమైన రూపం.
theological_decisions:
- issue: πνεύματος ἁγίου యొక్క సూచన
  choice: పరిశుద్ధాత్మ
  alternative: పరిశుద్ధమైన ఆత్మ
  rationale: ఈ పౌలు సందర్భంలో ఈ పదబంధం దేవుని పరిశుద్ధాత్మను సూచిస్తుంది. ‘పరిశుద్ధాత్మ’ అని రాయడం వ్యక్తిగత దైవిక సూచనను నిలుపుతుంది; వచనం చెప్పనిదాన్ని అదనంగా చేర్చదు.
- issue: τῆς ἐλπίδος అనే genitive సంబంధం
  choice: నిరీక్షణకు మూలమైన దేవుడు
  alternative: నిరీక్షణయొక్క దేవుడు
  rationale: గ్రీకు పదబంధం దేవుడు నిరీక్షణకు మూలమా లేక దాని లక్ష్యమా అనే సంబంధాన్ని సంక్షిప్తంగా ఉంచుతుంది. తెలుగు సహజత్వం కోసం ప్రధాన సందర్భార్థమైన మూల భావాన్ని వ్యక్తం చేశాం; దేవుణ్ణి కేవలం ఒక గుణంతో పరిమితం చేసే సిద్ధాంతార్థాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; ప్రార్థనాత్మక ఆశీర్వాదానికి తగిన గౌరవప్రదమైన ‘నింపుగాక’ రూపం వాడబడింది. ‘నిరీక్షణ’ పదాన్ని రెండుసార్లు ఉంచి మూలంలోని lexical repetition నిలుపబడింది. వాక్యాన్ని తెలుగు పఠనసౌలభ్యం కోసం రెండు వాక్యాలుగా విభజించినా, కారణ-ఫలిత సంబంధాన్ని ‘తద్వారా’తో కాపాడాం.
