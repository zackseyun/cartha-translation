id: ROM.15.26
reference: Romans 15:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: te
  text: ఎందుకంటే మాసిదోనియా, అకయా ప్రాంతాలవారు యెరూషలేములోని పరిశుద్ధులలో పేదవారికి కొంత విరాళం ఇవ్వడానికి ఇష్టపడ్డారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొంత పంచుకోవడానికి.” ఈ గ్రీకు పదబంధం భౌతిక సహాయం ద్వారా వ్యక్తమయ్యే భాగస్వామ్యాన్ని లేదా సహవాసాన్ని నొక్కిచెబుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: సంతోషంగా నిర్ణయించుకున్నారు
  rationale: ఈ క్రియలో అనుకూలమైన ఇష్టంతో తీసుకున్న నిర్ణయం అనే రెండు భావాలూ ఉన్నాయి. ఈ తెలుగు ప్రయోగం స్వచ్ఛందతను, సానుకూల మనోభావాన్ని రెండింటినీ తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: మాసిదోనియా, అకయ ప్రాంతాలవారు
  rationale: గ్రీకులో ప్రాంతాల పేర్లు అక్కడి విశ్వాస సమాజాలకు సూచకంగా వాడబడ్డాయి. తెలుగులో అర్థం సహజంగా ఉండేందుకు ‘ప్రాంతాలవారు’ అని చెప్పబడింది; ‘సంఘాలు’ లేదా ‘విశ్వాసులు’ అని మూలంలో లేని నిర్దిష్టతను చేర్చలేదు.
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: కొంత సహాయం అందించాలని
  rationale: ఈ సందర్భంలో κοινωνία భౌతిక అవసరాన్ని తీర్చే భాగస్వామ్యాన్ని, సహాయాన్ని సూచిస్తుంది. ‘సహాయం’ ఆచరణాత్మక భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; ‘కొంత’ τινά లోని అనిర్దిష్టతను నిలుపుతుంది. భాగస్వామ్య భావాన్ని పాదటిప్పణి వివరిస్తుంది.
- source_word: εἰς τοὺς πτωχοὺς
  choice: పేదవారికి
  rationale: εἰς ఇక్కడ సహాయం పొందేవారిని లేదా వారి ప్రయోజనాన్ని సూచిస్తుంది; ‘పేదవారికి’ సంక్షిప్తమైన సహజ తెలుగు.
- source_word: τῶν ἁγίων
  choice: పరిశుద్ధులలో ఉన్న
  rationale: ఈ షష్ఠీ విభక్తి సంబంధం పేదవారు పరిశుద్ధుల సమూహంలోనివారని సూచిస్తుంది. ‘పరిశుద్ధులలో ఉన్న’ ఆ సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: యెరూషలేములోని
  rationale: ఈ పదబంధం పరిశుద్ధులు ఉన్న స్థలాన్ని నేరుగా, సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: పౌలు వాడే ἅγιοι పదానికి అనువాదం
  choice: పరిశుద్ధులు
  alternative: దేవుని పవిత్ర ప్రజలు
  rationale: ‘పరిశుద్ధులు’ పౌలు విశ్వాసులందరినీ సంబోధించడానికి వాడే ముఖ్య పదాన్ని నిలుపుతుంది; దీనిని ప్రత్యేకంగా ఘనపరచబడిన కొందరికి మాత్రమే పరిమితం చేయదు.
- issue: κοινωνία లోని సహవాసం మరియు భౌతిక సహాయం మధ్య భావసంబంధం
  choice: ముఖ్య పాఠంలో ‘సహాయం’; పాదటిప్పణిలో భాగస్వామ్య భావం
  alternative: భాగస్వామ్యంగా కొంత ఇవ్వడం
  rationale: సందర్భం పేదల కోసం సేకరించిన భౌతిక సహాయాన్ని సూచిస్తున్నా, κοινωνία కేవలం విరాళం కంటే లోతైన పంచుకోవడం/భాగస్వామ్యాన్ని కూడా వ్యక్తం చేస్తుంది. ప్రధాన పాఠం సహజంగా ఉండేలా చేసి, మూలంలోని విస్తృత భావాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ప్రాంతాల పేర్లను మూలంలోని అలంకార ప్రయోగానికి దగ్గరగా ఉంచుతూ, తెలుగులో సహజత కోసం ‘ప్రాంతాలవారు’ చేర్చబడింది. పాదటిప్పణి సూచిక [a] ప్రధాన పాఠంలో ఉంది.
