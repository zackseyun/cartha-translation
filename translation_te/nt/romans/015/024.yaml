    rationale: The Greek presents a contingent condition, not a temporal assertion. Rendering it as “ఒకవేళ ... పొందగలిగితే” preserves both the conditional force and the future-oriented possibility.
  - severity: medium
    issue: γάρ is left unrepresented.
    rationale: The conjunction explains the preceding intention in the larger sentence. “ఎందుకంటే” appropriately retains this explanatory relation.
