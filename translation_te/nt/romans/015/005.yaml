id: ROM.15.5
reference: Romans 15:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: te
  text: ఓర్పునూ ప్రోత్సాహాన్నీ ఇచ్చే దేవుడు, మెస్సీయ యేసుకు[b] అనుగుణంగా మీరు ఒకరి పట్ల ఒకరు ఒకే మనసు కలిగి ఉండేలా[a] మీకు అనుగ్రహించుగాక.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మీ మధ్య ఒకే విధంగా ఆలోచించేలా’ లేదా ‘ఒకే మనోభావం కలిగి ఉండేలా.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘క్రీస్తు యేసు’; క్రీస్తు (Χριστός) అనే బిరుదు భావాన్ని నిలిపేందుకు ‘మెస్సీయ యేసు’గా అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: దేవుడు
  rationale: δέ ఇక్కడ స్వల్ప అనుసంధానాన్ని సూచిస్తుంది; తెలుగులో ప్రత్యేక విరోధార్థక పదం చేర్చకుండా వాక్యప్రవాహంలో సహజంగా ఉంచాం.
- source_word: τῆς ὑπομονῆς
  choice: ఓర్పుకు మూలమైన
  rationale: ὑπομονή ఒత్తిడి మధ్య నిలకడగా సహించడాన్ని సూచిస్తుంది. సాధారణ పాఠకులకు సహజమైన ‘ఓర్పు’ను ఎంచుకుని, ఈ షష్ఠీ విభక్తి దేవుణ్ణి దాని మూలంగా చూపుతుందనే భావాన్ని వ్యక్తం చేశాం.
- source_word: τῆς παρακλήσεως
  choice: ప్రోత్సాహానికి మూలమైన
  rationale: παράκλησιςకు ఆదరణ, ప్రోత్సాహం, ప్రబోధం అనే భావాలు ఉన్నాయి. 15:4 సందర్భంలో బలపరిచే విస్తృత భావాన్ని ‘ప్రోత్సాహం’ సహజంగా అందిస్తుంది.
- source_word: δῴη
  choice: అనుగ్రహించుగాక
  rationale: δίδωμι యొక్క ఆశీర్వచనాత్మక ఆప్టేటివ్ రూపంలోని ప్రార్థనా-ఆకాంక్ష భావాన్ని గౌరవప్రదమైన ఆధునిక తెలుగు రూపం నిలుపుతుంది.
- source_word: τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις
  choice: ఒకరి పట్ల ఒకరు ఒకే మనసు కలిగి ఉండేలా
  rationale: φρονέω మనోవైఖరి లేదా ఆలోచనా ధోరణిని సూచిస్తుంది. ఈ రూపం పరస్పర సామరస్యాన్ని తెలుపుతుంది; ప్రతి విషయంలో సంపూర్ణ అభిప్రాయ ఏకరూపతను బలవంతంగా సూచించదు.
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: మెస్సీయ అయిన యేసుకు అనుగుణంగా
  rationale: κατά ఇక్కడ ప్రమాణానికి లేదా నమూనాకు అనుగుణతను సూచిస్తుంది. Χριστόςలోని బిరుదు భావాన్ని ‘మెస్సీయ’గా అనువదించి, తెలుగులో సంబంధాన్ని స్పష్టంగా చేయడానికి ‘అయిన’ వాడాం.
theological_decisions:
- issue: Χριστός బిరుదు అనువాదం
  choice: మెస్సీయ అయిన యేసు
  alternative: క్రీస్తు యేసు
  rationale: Χριστόςను కేవలం పేరులో భాగంలా లిప్యంతరీకరించకుండా, దాని ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు భావాన్ని నిలిపాం.
- issue: τὸ αὐτὸ φρονεῖν భావం
  choice: ఒకే మనసు కలిగి ఉండడం
  alternative: ప్రతి విషయంలో ఒకే అభిప్రాయం కలిగి ఉండడం
  rationale: మూలపాఠం సమాజంలోని పంచుకున్న మనోవైఖరిని కోరుతుంది; అన్ని విషయాల్లో సంపూర్ణ అభిప్రాయ ఏకరూపత అనే మరింత బలమైన అర్థాన్ని దానిపై మోపలేదు.
- issue: κατά యొక్క సంబంధం
  choice: యేసుకు అనుగుణంగా
  alternative: యేసు మాదిరిగా లేదా యేసు బోధ ప్రకారం
  rationale: మూలంలోని సంక్షిప్తత, విస్తృతత నిలిచేలా ‘అనుగుణంగా’ వాడాం; అది యేసు మాదిరికేనా, ఆయన చిత్తం లేదా బోధకేనా అని అనవసరంగా పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రార్థనా శైలిని వాడాం. పాత రూపాలైన ‘కర్తయగు’, ‘దయచేయును గాక’ వంటి వాటిని నివారించాం. వాక్యాంత విరామాన్ని స్వతంత్ర వచనంగా సహజంగా చేశాం.
