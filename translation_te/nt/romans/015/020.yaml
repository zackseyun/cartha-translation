id: ROM.15.20
reference: Romans 15:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: te
  text: ఈ విధంగా, మెస్సీయ[a] పేరు ఇప్పటికే ప్రకటించబడిన చోట్ల కాకుండా సువార్త ప్రకటించడాన్నే నా ఆశయంగా చేసుకుంటాను, ఇతరుల పునాది మీద నేను కట్టకుండా ఉండాలనే ఉద్దేశంతో.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘క్రీస్తు.’ గ్రీకు Χριστός ఇక్కడ బిరుదుగా వాడబడినందున ప్రధాన పాఠ్యంలో ‘మెస్సీయ’ అని అనువదించబడింది.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా, ‘మరొకరికి చెందిన పునాది మీద.’ ఇది ఇతరులు ముందుగా చేసిన అపొస్తల పరిచర్యను నిర్మాణ రూపకంతో సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως δὲ
  choice: ఈ విధంగా
  rationale: ముందటి వచనాల్లో పౌలు వివరించిన పరిచర్య విధానంతో ఈ మాటను అనుసంధానిస్తుంది; δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక స్వల్ప కొనసాగింపును సూచిస్తుంది.
- source_word: φιλοτιμούμενον
  choice: నా లక్ష్యంగా పెట్టుకున్నాను
  rationale: ఆసక్తితో కూడిన వ్యక్తిగత ఆశయం, కృషి అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: εὐαγγελίζεσθαι
  choice: సువార్త ప్రకటించడం
  rationale: శుభవార్తను బహిరంగంగా తెలియజేయడం అనే క్రియాత్మక భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οὐχ ὅπου ὠνομάσθη Χριστός
  choice: మెస్సీయ పేరు అప్పటికే ప్రకటించబడిన చోట్ల కాకుండా
  rationale: ὠνομάσθη అనే కర్మణి రూపాన్ని, పౌలు అప్పటివరకు సువార్త చేరని ప్రాంతాల్లో సేవ చేయాలనే సందర్భాన్ని నిలుపుతుంది. ‘అప్పటికే’ అనేది గ్రీకులో ప్రత్యక్ష పదం కాకపోయినా సందర్భంలో ఉన్న ముందస్తు పరిచయ భావాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: Χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ యేసును ప్రకటించబడే బిరుదుగల వ్యక్తిగా సూచిస్తున్నందున Χριστός యొక్క బిరుదు భావాన్ని ‘మెస్సీయ’గా అందిస్తుంది.
- source_word: ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ
  choice: అలా నేను మరొకరి పునాది మీద కట్టకుండా ఉండాలని కోరుకున్నాను
  rationale: ἵνα μή యొక్క ఉద్దేశ్య భావాన్ని, ఇతరుల ముందస్తు అపొస్తల పరిచర్యను సూచించే నిర్మాణ రూపకాన్ని నిలుపుతుంది; గ్రీకులో లేని లింగ సూచనను చేర్చదు.
theological_decisions:
- issue: Χριστός పదం అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో పదం పేరులా కాక బిరుదుగా పనిచేస్తోంది; అందువల్ల బిరుదు భావాన్ని స్పష్టంగా ఉంచాం, అయితే సంప్రదాయ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- issue: పౌలు చెప్పిన పరిచర్య సూత్రం యొక్క పరిధి
  choice: పౌలు తన వ్యక్తిగత పరిచర్య లక్ష్యాన్ని చెబుతున్నట్లుగా అనువదించడం
  alternative: ఇప్పటికే సువార్త ప్రకటించబడిన ప్రాంతాల్లో ఎవరూ సేవ చేయకూడదనే సార్వత్రిక నిషేధంగా అనువదించడం
  rationale: φιλοτιμούμενον పౌలు వ్యక్తిగత ఆశయాన్ని సూచిస్తుంది; వాక్యం అందరికీ వర్తించే ఆజ్ఞగా చెప్పదు. అనువాదం దీనిని విస్తరించకుండా అలాగే ఉంచుతుంది.
- issue: ἵνα μή యొక్క సంబంధం
  choice: ఇతరుల పునాది మీద కట్టకూడదనే పౌలు ఉద్దేశ్యంగా చూపించడం
  alternative: అది అనుకోకుండా కలిగే ఫలితమని చూపించడం
  rationale: ἵνα μή సాధారణంగా ఉద్దేశ్యాన్ని సూచిస్తుంది; అందువల్ల పౌలు ఎంచుకున్న సేవా విధానానికి కారణమైన లక్ష్యంగా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘సువార్త,’ ‘మెస్సీయ,’ ‘పునాది’ వంటి సుపరిచిత బైబిలు పదాలను ఉంచుతూ, వాక్య నిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా చేశాం. గ్రీకు వాక్యంలోని వ్యక్తిగత ఆశయం మరియు నిర్మాణ రూపకం రెండూ నిలుపబడ్డాయి.
