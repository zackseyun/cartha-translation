id: ROM.15.9
reference: Romans 15:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὰ δὲ ἔθνη ὑπὲρ ἐλέους δοξάσαι τὸν θεόν· καθὼς γέγραπται· Διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσι, καὶ τῷ ὀνόματί σου ψαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: te
  text: 'అన్యజనులు దేవుని కనికరాన్ని బట్టి ఆయనను మహిమపరచునట్లు[a], వ్రాయబడి ఉన్నట్లుగా:


    “కాబట్టి అన్యజనుల మధ్య నేను నిన్ను స్తుతిస్తాను;

    నీ నామానికి స్తుతిగానం చేస్తాను.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అన్యజనులు’ మరియు ‘అన్యజనుల మధ్య’ అనే రెండు చోట్లా ‘జాతులు’ లేదా ‘దేశాల మధ్య’ అని కూడా అనువదించవచ్చు. పౌలు ఈ ఉల్లేఖనాన్ని ప్రత్యేకంగా అన్యజనులకు వర్తింపజేస్తున్నాడు; అయితే మూల ఉల్లేఖనంలో ‘జాతులు/దేశాలు’ అనే విస్తృత భావం కూడా ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη / ἔθνεσι
  choice: అన్యజనులు / అన్యజనుల మధ్య
  rationale: రోమా పత్రిక సందర్భంలో యూదులు కాని ప్రజలను సూచించడానికి ‘అన్యజనులు’ సహజమైన, స్థిరమైన పదం. అయితే ఉదాహరించిన వాక్యంలోని పదానికి ‘దేశాలు/జాతులు’ అనే విస్తృత అర్థం కూడా ఉంది; దాన్ని పాదటిప్పణిలో ఉంచాం.
- source_word: ὑπὲρ ἐλέους
  choice: దేవుని కనికరాన్ని బట్టి
  rationale: ὑπέρ + షష్ఠీ విభక్తి ఇక్కడ కారణం లేదా ఆధారాన్ని సూచిస్తుంది. ‘దేవుని’ అనేది సందర్భం ద్వారా స్పష్టమైన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δοξάσαι
  choice: మహిమపరచాలి
  rationale: ఈ క్రియారూపం 8వ వచనం నుంచి కొనసాగే వాక్య నిర్మాణంపై ఆధారపడి, ఉద్దేశం లేదా ఫలితాన్ని సూచిస్తుంది. ‘మహిమపరచాలి’ తెలుగులో ఆ అనుసంధానాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: καθὼς γέγραπται
  choice: ఇందుకు అనుగుణంగా ఇలా వ్రాయబడి ఉంది
  rationale: ఇది లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే సూత్రప్రయోగం. ‘ఇందుకు అనుగుణంగా’ పౌలు వాదనకూ ఉల్లేఖనానికీ ఉన్న సంబంధాన్ని సహజంగా చూపుతుంది.
- source_word: ἐξομολογήσομαί
  choice: స్తుతిస్తాను
  rationale: ఈ ఆరాధనా సందర్భంలో ఈ పదం పాపాన్ని ఒప్పుకోవడం కంటే బహిరంగంగా స్తుతించడం లేదా కృతజ్ఞత చెప్పడం అనే భావాన్ని ఇస్తుంది.
- source_word: ψαλῶ
  choice: కీర్తిస్తూ పాడుతాను
  rationale: ψάλλω ఇక్కడ సంగీతంతో స్తుతించడం అనే భావాన్ని వ్యక్తం చేస్తుంది. ‘కీర్తిస్తూ పాడుతాను’ ప్రత్యేకంగా కీర్తన గ్రంథంలోని పాటలకే పరిమితం చేయదు.
- source_word: τῷ ὀνόματί σου
  choice: నీ నామాన్ని
  rationale: తెలుగులో ‘నీ నామాన్ని కీర్తిస్తూ పాడుతాను’ సహజంగా ఉండి, దేవుని నామాన్ని స్తుతించే బైబిలు నుడికారాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ప్రారంభంలోని క్రియార్థక రూపం 8వ వచనంతో ఉన్న సంబంధం
  choice: క్రీస్తు పరిచర్య ఫలితంగా అన్యజనులు దేవుని కనికరాన్ని బట్టి ఆయనను మహిమపరచాలనే భావంతో, ముందరి వచనం నుంచి కొనసాగే వాక్యంగా అనువదించాం.
  alternative: ‘అన్యజనులు కనికరాన్ని బట్టి దేవుణ్ణి మహిమపరచడానికి’ అనే అసంపూర్ణమైన, మరింత పదానుసార రూపం.
  rationale: గ్రీకు వాక్యం వ్యాకరణపరంగా 8వ వచనంపై ఆధారపడుతుంది. తెలుగులో ‘మహిమపరచాలి’ అని ఇవ్వడం వాక్య సంబంధాన్ని అర్థవంతం చేస్తుంది; అదనపు సిద్ధాంత నిర్ణయాన్ని చేర్చదు.
- issue: ἔθνη పదంలోని నిర్దిష్ట, విస్తృత భావాలు
  choice: పౌలు వాదనలో యూదులు కానివారిని సూచించే ‘అన్యజనులు’ అనే అర్థాన్ని ప్రధాన పాఠ్యంలో ఉంచాం.
  alternative: ఉల్లేఖనపు విస్తృత భావాన్ని ముందుకు తెచ్చే ‘దేశాలు’ లేదా ‘జాతులు’.
  rationale: రోమా 15 సందర్భం అన్యజనుల చేర్చబడటాన్ని ప్రత్యేకంగా ప్రస్తావిస్తుంది. అదే సమయంలో మూల ఉల్లేఖనంలో ‘జాతులు/దేశాలు’ అనే విస్తృత భావం నిజమైన ప్రత్యామ్నాయం కాబట్టి పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘మహిమపరచు,’ ‘కనికరం,’ ‘నామం’ వంటి స్థిరమైన బైబిలు పదాలను ఉంచి, వాక్య నిర్మాణాన్ని సహజంగా తీర్చిదిద్దాం.
