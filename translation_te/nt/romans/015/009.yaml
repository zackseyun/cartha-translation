  to: 'అన్యజనులు దేవుని కనికరాన్ని బట్టి ఆయనను మహిమపరచునట్లు[a], వ్రాయబడి ఉన్నట్లుగా:


    “కాబట్టి అన్యజనుల మధ్య నేను నిన్ను స్తుతిస్తాను;

    నీ నామానికి స్తుతిగానం చేస్తాను.”'
