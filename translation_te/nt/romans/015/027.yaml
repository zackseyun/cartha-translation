id: ROM.15.27
reference: Romans 15:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: te
  text: ఎందుకంటే, వారు అలా చేయడానికి సంతోషంగా అంగీకరించారు; వారు వారిపట్ల రుణపడి కూడా ఉన్నారు. ఎందుకంటే యూదేతరులు[a] వారి ఆధ్యాత్మికమైన వాటిలో[b] పాలుపంచుకున్నట్లయితే, భౌతికమైన విషయాలలో[c] వారికి సేవ చేయడం కూడా వారి బాధ్యతే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘జాతులు.’ ఇక్కడ భావం యూదులు కానివారు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వారి ఆధ్యాత్మికమైన ఆశీర్వాదాలలో.’ గ్రీకు మూలంలో అక్షరార్థంగా ‘వారి ఆధ్యాత్మికమైన వాటిలో’ అని ఉంది.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా ‘శరీరసంబంధమైన విషయాలలో’; ఇక్కడ ఆధ్యాత్మికమైన వాటికి భిన్నంగా ధనం, శారీరక అవసరాలు వంటి భౌతిక సహాయం ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: అలా చేయడానికి ఇష్టపడ్డారు
  rationale: ఈ క్రియ సంతోషపూర్వకమైన సమ్మతిని, స్వచ్ఛంద అంగీకారాన్ని సూచిస్తుంది. ముందటి వచనంలో చెప్పిన సహాయాన్ని సందర్భం ద్వారా సూచిస్తూ, మూలంలో లేని వస్తువును అతిగా చేర్చకుండా ఈ రూపం భావాన్ని తెలియజేస్తుంది.
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: వారు వారికి రుణపడి ఉన్నారు
  rationale: నైతిక బాధ్యత లేదా బాకీ ఉన్న స్థితిని నేరుగా, సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τὰ ἔθνη
  choice: యూదేతరులు
  rationale: ఇక్కడ పౌలు యూదులు కాని విశ్వాసులను యూదు విశ్వాసులతో పోల్చుతున్నందున, సాధారణంగా ‘జనాలు’ అనడం కంటే ‘యూదేతరులు’ సందర్భాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: వారి ఆత్మసంబంధమైన వాటిలో
  rationale: πνευματικός ఇక్కడ నామవాచకంగా వాడబడింది. ‘ఆశీర్వాదాలు’ అనే మూలంలో లేని నామవాచకాన్ని చేర్చకుండా గ్రీకు పదబంధంలోని విస్తృతతను నిలుపుతుంది.
- source_word: ἐκοινώνησαν
  choice: పాలుపంచుకున్నట్లయితే
  rationale: కలిసి భాగం పొందడం లేదా భాగస్వాములు కావడం అనే κοινωνέω భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν τοῖς σαρκικοῖς
  choice: భౌతికమైన వాటితో
  rationale: ఈ సందర్భంలో σαρκικός పాపసంబంధమైనదని కాకుండా శరీర అవసరాలు, ధనం, భౌతిక సహాయం వంటి వాటిని సూచిస్తుంది; ముందటి ‘ఆత్మసంబంధమైన వాటికి’ ఉద్దేశపూర్వక వ్యత్యాసంగా ఉంది.
- source_word: λειτουργῆσαι
  choice: సేవ చేయడం
  rationale: λειτουργέωలోని గౌరవప్రదమైన సేవ భావాన్ని నిలుపుతూ, దానిని మతాధికారుల సేవకే పరిమితం చేయని సాధారణ తెలుగు రూపం.
theological_decisions:
- issue: σαρκικοῖς అనే పదానికి πνευματικοῖς‌తో ఉన్న వ్యత్యాసంలో అర్థం
  choice: భౌతికమైన వాటితో
  alternative: శరీరసంబంధమైన వాటిలో
  rationale: యెరూషలేములోని పరిశుద్ధుల కోసం సేకరించిన ఆర్థిక సహాయం తక్షణ సందర్భం. కాబట్టి ఇది పాపస్వభావాన్ని కాక భౌతిక లేదా శారీరక అవసరాలకు చేసే సహాయాన్ని సూచిస్తుంది.
- issue: αὐτῶν / αὐτοῖς అనే సర్వనామాల సూచన
  choice: సర్వనామాలను ‘వారి/వారికి’గానే ఉంచడం
  alternative: యెరూషలేములోని యూదు విశ్వాసులు అని స్పష్టీకరించడం
  rationale: రోమా 15:25–26 సందర్భంలో ఇవి ప్రధానంగా యెరూషలేము పరిశుద్ధులను సూచిస్తాయి; అయినా ఇశ్రాయేలు లేదా యూదుల ద్వారా అందిన ఆత్మసంబంధమైన మేలుల విస్తృత నేపథ్యం కూడా పౌలు వాదనలో ఉంది. అందువల్ల మూలంలోని సర్వనామ రూపం ఆ భావపరమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ఆత్మసంబంధమైన వాటిలో’ అనే కొద్దిగా రూపబద్ధమైన పదబంధం మూలంలోని ఉద్దేశపూర్వక విస్తృతతను కాపాడుతుంది; ‘భౌతికమైన వాటితో’ సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది. మూలంలోని సర్వనామాలను స్పష్టమైన నామవాచకాలతో భర్తీ చేయకుండా ఉంచడం ద్వారా వాటి సూచనలోని నిజమైన విస్తృతత నిలుపబడింది.
