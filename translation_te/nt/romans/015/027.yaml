revisions:
- from: వారు అలా చేయడానికి ఇష్టపడ్డారు; నిజానికి, వారు వారికి రుణపడి ఉన్నారు. ఎందుకంటే యూదేతరులు[a] వారి ఆత్మసంబంధమైన వాటిలో[b] పాలుపంచుకున్నట్లయితే, భౌతికమైన వాటితో[c] వారికి సేవ చేయడం కూడా వారి బాధ్యతే.
  to: ఎందుకంటే, వారు అలా చేయడానికి సంతోషంగా అంగీకరించారు; వారు వారిపట్ల రుణపడి కూడా ఉన్నారు. ఎందుకంటే యూదేతరులు[a] వారి ఆధ్యాత్మికమైన వాటిలో[b] పాలుపంచుకున్నట్లయితే, భౌతికమైన విషయాలలో[c] వారికి సేవ చేయడం కూడా వారి బాధ్యతే.
  rationale: సవరణలు అర్థాన్ని మార్చకుండా కారణసంబంధమైన γάρను స్పష్టపరుస్తాయి, εὐδόκησανలోని స్వచ్ఛంద సంతోష సమ్మతిని సహజంగా తెలియజేస్తాయి, మరియు సర్వనామాల మూలసందిగ్ధతను విప్పకుండా తెలుగు ప్రవాహాన్ని మెరుగుపరుస్తాయి. పాదటిప్పణి గుర్తులు వచనంలోని సంబంధిత పదబంధాలకు సరిగ్గా అమర్చబడ్డాయి.
