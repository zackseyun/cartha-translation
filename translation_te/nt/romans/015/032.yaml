id: ROM.15.32
reference: Romans 15:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα ἐν χαρᾷ ⸀ἐλθὼν πρὸς ὑμᾶς διὰ θελήματος ⸀θεοῦ συναναπαύσωμαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/032.yaml
  text: so that by God's will I may come to you with joy and be refreshed together with you[a].
translation:
  language: te
  text: దేవుని చిత్తం ద్వారా నేను ఆనందంతో మీ వద్దకు వచ్చి, మీతో కలిసి సేదతీరాలని[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మీతో కలిసి నూతనోత్సాహం పొందాలని” లేదా “మీతో కలిసి విశ్రాంతి పొందాలని.” గ్రీకు క్రియ కలిసి పంచుకునే విశ్రాంతి లేదా నూతనోత్సాహం అనే భావాన్ని తెలియజేస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: -ేలా
  rationale: ముందటి వచనంలోని ప్రార్థన విజ్ఞప్తికి ఉద్దేశాన్ని తెలిపే ἵνα భావాన్ని తెలుగులో సహజమైన ఉద్దేశార్థక రూపంతో వ్యక్తం చేస్తుంది.
- source_word: ἐν χαρᾷ
  choice: ఆనందంతో
  rationale: తోడుగా ఉండే భావస్థితి లేదా విధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, ‘ఆనందం’ అనే నామవాచక భావాన్ని నిలుపుతుంది.
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: నేను ... మీ దగ్గరికి వచ్చి
  rationale: ప్రధాన క్రియకు అధీనమైన ఏరిస్ట్ పార్టిసిపిల్‌ను తెలుగులో సహజమైన పూర్వకాలిక సంయుక్త క్రియగా అందిస్తుంది.
- source_word: διὰ θελήματος θεοῦ
  choice: దేవుని చిత్తం వల్ల
  rationale: διά + షష్ఠీ విభక్తి ఇక్కడ దేవుని చిత్తం ద్వారా లేదా దాని ప్రకారం రాక సాధ్యమవుతుందనే భావాన్ని ఇస్తుంది; ‘వల్ల’ ఆ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: συναναπαύσωμαι
  choice: మీతో కలిసి సేదదీరేలా
  rationale: συν- ఉపసర్గలోని కలిసి పంచుకునే భావాన్నీ, ἀναπαύομαι లోని విశ్రాంతి లేదా సేదతీరడం అనే భావాన్నీ రెండింటినీ నిలుపుతుంది.
theological_decisions:
- issue: రోమా విశ్వాసులతో పౌలు ఆశించిన సహవాసంలోని పరస్పర భాగస్వామ్యం
  choice: మీతో కలిసి సేదదీరేలా
  alternative: మీతో సేదదీరేలా
  rationale: పౌలు వారికి మాత్రమే సేవ చేయడం కాక, వారితో కలిసి విశ్రాంతి లేదా నూతనోత్సాహాన్ని పొందాలని ఆశిస్తున్నాడనే συναναπαύσωμαι లోని సంయుక్త భావాన్ని అనవసరంగా విస్తరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖా శైలికి తగిన గౌరవగంభీరతతో రూపొందించబడింది. ἵνα ముందటి ప్రార్థన విజ్ఞప్తిపై ఆధారపడుతుంది కాబట్టి, తెలుగులో వాక్యం సంపూర్ణంగా వినిపించేందుకు ‘ప్రార్థించండి’ని సందర్భానుసారంగా సరఫరా చేశాం.
