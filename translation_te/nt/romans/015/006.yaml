  terminology: ‘ప్రభువు,’ ‘మహిమపరచు,’ and ‘మెస్సీయ’ appropriately render κύριος, δοξάζω, and Χριστός. ‘యేసు మెస్సీయ’ is idiomatic Telugu title usage and need not reproduce an English definite article.
