id: ROM.15.6
reference: Romans 15:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: te
  text: మీరు ఏకమనస్సుతోను ఒకే నోటితోను మన ప్రభువైన యేసు మెస్సీయ యొక్క దేవుణ్ణి, తండ్రిని మహిమపరచేలా.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: అప్పుడు ... మహిమపరుస్తారు
  rationale: ముందటి వాక్యంలోని ప్రార్థన/ఆశీర్వాదం నుండి కలిగే ఉద్దేశిత ఫలితాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; గ్రీకు ἵνα యొక్క ప్రయోజన-ఫలిత భావాన్ని నిలుపుతుంది.
- source_word: ὁμοθυμαδόν
  choice: ఏకమనస్సుతో
  rationale: ఒకే ఉద్దేశం, మనోభావంతో కూడిన సమైక్యతను సూచిస్తుంది; తరువాతి ‘ఒకే నోటితో’ అనే మాటల ఐక్యతతో భేదాన్ని కూడా నిలుపుతుంది.
- source_word: ἐν ἑνὶ στόματι
  choice: ఒకే నోటితో
  rationale: గ్రీకులోని స్పష్టమైన శరీర రూపకాన్ని యథాతథంగా కాపాడుతుంది; సమైక్య స్తుతిని సూచిస్తుంది.
- source_word: δοξάζητε
  choice: మహిమపరుస్తారు
  rationale: దేవునికి మహిమ చెల్లించడాన్ని తెలిపే గంభీరమైన, విస్తృతంగా అర్థమయ్యే తెలుగు పదం.
- source_word: τὸν θεὸν καὶ πατέρα
  choice: దేవుణ్ణి, తండ్రిని
  rationale: ఒకే వ్యక్తిని ‘దేవుడు’ మరియు ‘తండ్రి’గా గుర్తించే దగ్గరి అన్వయాన్ని తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τοῦ κυρίου ἡμῶν
  choice: మన ప్రభువైన
  rationale: κύριος యొక్క బిరుదు భావాన్ని ‘ప్రభువు’గా, ἡμῶνను ‘మన’గా స్పష్టంగా నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Ἰησοῦను పేరుగా లిప్యంతరీకరిస్తూ, Χριστοῦను ‘అభిషిక్తుడు’ అనే మెస్సీయ బిరుదుగా అర్థానువాదం చేస్తుంది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦలో Χριστοῦను ఎలా అనువదించాలి
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: Χριστός ఇక్కడ యేసుకు సంబంధించిన మెస్సీయ బిరుదును సూచిస్తుంది. సంప్రదాయ లిప్యంతరీకరణకన్నా బిరుదు అర్థాన్ని ప్రత్యక్షంగా తెలియజేసే ‘మెస్సీయ’ను ఎంచుకున్నాం.
- issue: τὸν θεὸν καὶ πατέρα యొక్క సంబంధం
  choice: ఒకే వ్యక్తిని ‘దేవుడు’ మరియు ‘తండ్రి’గా సూచించడం
  alternative: దేవుడు మరియు వేరొక తండ్రి అని వినిపించే అనువాదం
  rationale: ఒకే గ్రీకు నిర్దిష్ట ఉపపదం రెండు నామవాచకాలను కలిపి నిర్వహిస్తుంది; అందువల్ల వాటిని ఒకే వ్యక్తికి చెందిన సమన్విత వర్ణనగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘ఏకమనస్సుతో’ అంతరంగ ఐక్యతను, ‘ఒకే నోటితో’ సమైక్యమైన స్తుతిని వేరువేరుగా నిలుపుతాయి.
