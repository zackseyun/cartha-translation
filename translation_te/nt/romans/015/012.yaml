id: ROM.15.12
reference: Romans 15:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: te
  text: 'మరల యెషయా ఇలా చెబుతున్నాడు: “యెష్షయి వేరు ఉంటుంది, అన్యజనులను పరిపాలించడానికి లేచేవాడు; ఆయనలో అన్యజనులు ఆశ ఉంచుతారు.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: యెష్షయి వేరు
  rationale: ‘Root of Jesse’ అనే రూపకాన్ని మూలానికి దగ్గరగా ఉంచుతూ, మెస్సీయకు సంబంధించిన వంశపరమైన సూచనను అలాగే నిలిపింది.
- source_word: ἔσται
  choice: ఉంటుంది
  rationale: గ్రీకు క్రియ యొక్క సాధారణ భవిష్యత్ అర్థమైన ‘will be’ను ప్రతిబింబిస్తుంది; ‘వస్తుంది’ అని అర్థాన్ని విస్తరించలేదు.
- source_word: ὁ ἀνιστάμενος
  choice: లేచేవాడు
  rationale: ‘లేవడం/ఎదగడం’ అనే మూల రూపకాన్ని నిలిపి, సందర్భంలో అధికారంతో ముందుకు వచ్చే వ్యక్తిని సూచిస్తుంది.
- source_word: ἄρχειν ἐθνῶν
  choice: జనాలపై పరిపాలించడానికి
  rationale: ἄρχειν యొక్క పాలనా భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేసింది; ἐθνῶνను యూదేతరులకే పరిమితం చేయకుండా ‘జనాలు’గా ఉంచింది.
- source_word: ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν
  choice: ఆయనపై జనాలు నిరీక్షణ ఉంచుతారు
  rationale: ἐπί + dative లోని ఆధారపడే భావాన్ని ‘ఆయనపై’గా, ἐλπίζωను ‘నిరీక్షణ ఉంచడం’గా సహజంగా తెలిపింది.
theological_decisions:
- issue: ἔσται మరియు ὁ ἀνιστάμενος మధ్య సంబంధం
  choice: ‘ఉంటుంది; ... లేచేవాడు ఆయనే’ అని రెండు సమాంతర వాక్యభాగాలుగా అనువదించడం
  alternative: ‘పరిపాలించడానికి లేచే యెష్షయి వేరు వస్తుంది’
  rationale: గ్రీకు వాక్యంలో καίతో నిలిచిన నిర్మాణాన్ని కాపాడుతుంది; ‘will come’ అనే భావాన్ని ἔσταιలోకి చేర్చకుండా, రెండు వర్ణనలూ ఒకే వ్యక్తిని సూచిస్తున్నాయని సహజ తెలుగులో తెలియజేస్తుంది.
- issue: ἐθνῶν యొక్క పరిధి
  choice: జనాలు
  alternative: అన్యజనులు
  rationale: ఈ పదం సందర్భంలో యూదేతర జనాలను సూచించినప్పటికీ, గ్రీకు పదంలోని విస్తృత ‘nations/peoples’ భావాన్ని నిలిపేందుకు ‘జనాలు’ ఎంచుకుంది; పౌలు ఉద్దేశించిన సమూహాన్ని సిద్ధాంతపరంగా అధికంగా కుదించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని రూపకాన్ని, భవిష్యత్ కాలాన్ని, సమాంతర నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలిపింది.
