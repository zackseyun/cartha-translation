source:
  edition: SBLGNT
  text: καὶ πάλιν λέγει· Εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/010.yaml
  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: te
  text: 'మళ్లీ ఆయన ఇలా అంటున్నాడు: “యూదేతరులారా,[a] ఆయన ప్రజలతో కలిసి ఆనందించండి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జాతులారా, ఆయన ప్రజలతో కలిసి ఆనందించండి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: మళ్లీ
  rationale: మరొక లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే సహజమైన ఆధునిక తెలుగు పదం.
- source_word: λέγει
  choice: ఆయన ఇలా అంటున్నాడు
  rationale: గ్రీకు వర్తమాన కాలాన్ని నిలుపుతూ, లేఖనం ప్రస్తుతం మాట్లాడుతున్నదనే ఉల్లేఖన సూత్ర భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; కర్త గ్రీకులో అంతర్లీనంగా ఉంది.
- source_word: Εὐφράνθητε
  choice: ఆనందించండి
  rationale: ఆజ్ఞార్థక బలాన్ని, సంతోషించమనే భావాన్ని స్పష్టమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἔθνη
  choice: యూదేతరులారా
  rationale: రోమా 15 సందర్భంలో యూదులతోపాటు దేవుణ్ణి స్తుతించే యూదేతర ప్రజలను సూచించే పౌలు ఉద్దేశాన్ని స్పష్టంగా తెలియజేస్తుంది; ‘జాతులారా’ అనే విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: ఆయన ప్రజలతో కలిసి
  rationale: μετά అనే సహవాస భావాన్ని ‘తో కలిసి’ సహజంగా తెలియజేస్తూ, ‘ఆయన ప్రజలు’ అనే నిబంధనాత్మక సూచనను వివరణతో విస్తరించకుండా నిలుపుతుంది.
theological_decisions:
- issue: యూదులు–యూదేతరుల ఐక్యతను ఉద్దేశించిన ఉల్లేఖనంలో ἔθνη అనువాదం
  choice: యూదేతరులారా
  alternative: జాతులారా
  rationale: తక్షణ సందర్భం యూదేతరులు దేవుని ప్రజలతో కలిసి ఆనందించడాన్ని నొక్కిచెబుతుంది. అయితే మూలపదానికి ‘జాతులు’ అనే విస్తృత అర్థం కూడా ఉన్నందున దాన్ని పాదసూచికలో సంరక్షించాం.
- issue: λέγει యొక్క అంతర్లీన కర్త
  choice: ఆయన ఇలా అంటున్నాడు
  alternative: లేఖనం ఇలా చెబుతోంది
  rationale: గ్రీకు వాక్యంలో కర్త స్పష్టంగా పేర్కొనబడలేదు. ‘ఆయన’ అనేది దేవుడు పలుకుతున్నాడనే ఉల్లేఖన భావానికి సరిపోతుంది; దానిని మరింత నిర్దిష్టంగా గుర్తించకుండా అసలు వాక్యంలోని సంక్షిప్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, లేఖన ఉల్లేఖనానికి తగిన గౌరవభరిత స్వరం నిలుపబడింది.
