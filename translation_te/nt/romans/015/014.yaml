  to: 'నా సహోదరులారా,[a] మీ గురించి నేను స్వయంగా నమ్మకంతో ఉన్నాను: మీరే కూడా మంచితనంతో నిండినవారై, సమస్త జ్ఞానంతో పరిపూర్ణులై, ఒకరికొకరు ఉపదేశించగలవారు.[b]'
  rationale: The revision restores the emphatic and additive sense of καὶ αὐτοὶ with ‘మీరే కూడా.’ It also makes the perfect-state force of Πέπεισμαι more explicit with ‘నమ్మకంతో ఉన్నాను.’ The footnote b is conformed to the revised finite predicate while retaining the lexical alternatives for νουθετεῖν.
