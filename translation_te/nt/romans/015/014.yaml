id: ROM.15.14
reference: Romans 15:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: te
  text: 'నా సహోదరులారా,[a] మీ గురించి నేను స్వయంగా నమ్మకంతో ఉన్నాను: మీరే కూడా మంచితనంతో నిండినవారై, సమస్త జ్ఞానంతో పరిపూర్ణులై, ఒకరికొకరు ఉపదేశించగలవారు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరులు’ అని అనువదించిన గ్రీకు పదం adelphoi. ఇది స్త్రీపురుష విశ్వాసులందరినీ కలిపి సంబోధించగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “ఒకరినొకరు బుద్ధిచెప్పగలవారు” లేదా “ఒకరినొకరు హెచ్చరించగలవారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: నమ్ముతున్నాను
  rationale: పూర్ణకాల రూపం గతంలో ఏర్పడి ప్రస్తుతం కొనసాగుతున్న స్థిర నమ్మకాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ‘నమ్ముతున్నాను’ సహజంగా ఆ స్థితిని తెలియజేస్తుంది.
- source_word: δέ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ బలమైన వ్యతిరేకతకన్నా స్వల్ప విషయమార్పును సూచిస్తుంది; తెలుగులో వాక్యప్రవాహమే దానిని సహజంగా తెలియజేస్తుంది.
- source_word: ἀδελφοί μου
  choice: నా సహోదరులారా
  rationale: సంబోధనను, μου అనే ఆత్మీయ సంబంధ సూచనను నిలుపుతుంది. సంఘమంతటినీ—స్త్రీపురుషులను—ఉద్దేశించగల విస్తృత ప్రయోగాన్ని పాదసూచికలో స్పష్టం చేశాం.
- source_word: καὶ αὐτὸς ἐγὼ
  choice: నేను స్వయంగా
  rationale: పౌలు వ్యక్తిగతంగా కలిగిన దృఢ నమ్మకంపై ఉన్న ఉద్ఘాటనను సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: περὶ ὑμῶν
  choice: మీ గురించి
  rationale: περί + షష్ఠీ విభక్తి భావానికి నేరమైన, సహజమైన తెలుగు రూపం.
- source_word: καὶ αὐτοὶ
  choice: మీరు
  rationale: αὐτοί లోని ఉద్ఘాటనను తెలుగు వాక్యనిర్మాణంలో కర్తను స్పష్టంగా ఉంచడం ద్వారా తెలిపాం; అదనపు ‘మీరే’ ఈ సందర్భంలో అనవసరమైన విరుద్ధభావాన్ని కలిగించవచ్చు.
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: మంచితనంతో నిండినవారు
  rationale: μεστός యొక్క ‘నిండియుండడం’ భావాన్నీ, ἀγαθωσύνη యొక్క నైతిక మంచితనం/సద్గుణ భావాన్నీ సరళంగా నిలుపుతుంది.
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: సమస్త జ్ఞానంతో పరిపూర్ణులు
  rationale: పూర్ణకాల కృదంతం సూచించే ప్రస్తుత పరిపూర్ణ స్థితిని, πάσης యొక్క విస్తృత పరిమాణాన్ని దగ్గరగా ప్రతిబింబిస్తుంది.
- source_word: δυνάμενοι
  choice: ఉపదేశించగలవారు
  rationale: ముందు చెప్పిన లక్షణాలనుండి వచ్చే సామర్థ్యాన్ని ‘గలవారు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀλλήλους
  choice: ఒకరికొకరు
  rationale: పరస్పర చర్యను తెలిపే సహజమైన తెలుగు సమానార్థకం.
- source_word: νουθετεῖν
  choice: ఉపదేశించుట
  rationale: జ్ఞాపకం చేయడం, సరిదిద్దే బోధ చేయడం, హెచ్చరించడం వంటి భావపరిధి గల క్రియకు ‘ఉపదేశించుట’ నిర్మాణాత్మక భావాన్ని ఇస్తుంది; దిద్దుబాటు/హెచ్చరిక ఛాయలను పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: మిశ్రమ సంఘాన్ని ఉద్దేశించిన ἀδελφοί అనే పుంలింగ బహువచన సంబోధన
  choice: నా సహోదరులారా
  alternative: నా సహోదర సహోదరీలారా
  rationale: మూలపద రూపానికి దగ్గరగా ‘సహోదరులు’ ఉంచి, అది ఈ సందర్భంలో స్త్రీపురుష విశ్వాసులందరినీ సమూహంగా ఉద్దేశించగలదని పాదసూచికలో వివరించడం ద్వారా రూపాన్నీ విస్తృత సూచననూ కాపాడాం.
- issue: νουθετεῖν యొక్క నిర్మాణాత్మక మరియు దిద్దుబాటు భావాలు
  choice: ఒకరికొకరు ఉపదేశించగలవారు
  alternative: ఒకరినొకరు హెచ్చరించగలవారు / బుద్ధిచెప్పగలవారు
  rationale: ప్రశంసాపూర్వక సందర్భంలో ‘ఉపదేశించు’ విస్తృతంగా, సహజంగా ఉంటుంది; అయినా మూలక్రియలోని సరిదిద్దే లేదా హెచ్చరించే తీవ్రతను పాదసూచికలో చూపి భావసందిగ్ధతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని ప్రశంస, ఉద్ఘాటన, సమాంతర లక్షణాలను సహజ తెలుగు వాక్యక్రమంలో నిలిపాం; νουθετεῖν భావవిస్తృతిని పాదసూచికతో సంరక్షించాం.
