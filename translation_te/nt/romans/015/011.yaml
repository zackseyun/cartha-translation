id: ROM.15.11
reference: Romans 15:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: te
  text: 'మరల ఇలా ఉంది: “అన్ని జనములారా, ప్రభువును[b] స్తుతించండి;[a] అన్ని ప్రజలూ ఆయనను కొనియాడుగాక.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “యూదేతరులారా.” గ్రీకు ἔθνη అనే పదానికి “జనములు” లేదా “యూదేతరులు” అనే అర్థాలు ఉండవచ్చు. ఈ ఉల్లేఖనం సార్వత్రిక భావాన్ని కలిగి ఉండడమే కాక, యూదేతరుల గురించి పౌలు చేస్తున్న వాదనకూ సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: హెబ్రీ మూలాన్ని ప్రతిబింబిస్తూ, “ప్రభువు”కు బదులుగా “యెహోవా” అని అనువదించవచ్చు; అక్కడ ఉన్న దైవనామానికి గ్రీకు పాఠంలో κύριος (“ప్రభువు”) వాడబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ πάλιν
  choice: మరల ఇలా ఉంది
  rationale: ముందున్న లేఖన ఉల్లేఖనాల వరుసలో మరో ఉల్లేఖనాన్ని పరిచయం చేస్తుంది; సహజమైన ఆధునిక తెలుగులో అనుసంధానాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Αἰνεῖτε
  choice: స్తుతించండి
  rationale: బహువచన ఆజ్ఞార్థక రూపాన్ని గౌరవప్రదమైన, సహజమైన తెలుగు ఆజ్ఞగా అందిస్తుంది.
- source_word: πάντα τὰ ἔθνη
  choice: సమస్త జనములారా
  rationale: ἔθνη అనే పదంలోని విస్తృతమైన ‘జనములు/దేశజనాలు’ భావాన్ని నిలుపుతుంది; పౌలు సందర్భంలో ‘యూదేతరులు’ అనే భావసాధ్యతను పాదటీపులో ఉంచుతుంది.
- source_word: τὸν κύριον
  choice: ప్రభువును
  rationale: గ్రీకు κύριοςకు నూతన నిబంధన సందర్భంలో సహజమైన తెలుగు సమానార్థకం; హెబ్రీ మూలంలోని దైవనామ సూచనను పాదటీపులో తెలియజేస్తుంది.
- source_word: ἐπαινεσάτωσαν
  choice: కొనియాడాలి
  rationale: మూడవ పురుష బహువచన ఆజ్ఞార్థక బలాన్ని తెలుగులో సహజమైన ప్రేరణాత్మక రూపంతో వ్యక్తం చేస్తుంది; మొదటి క్రియతో ఉన్న స్వల్ప పదభేదాన్ని కూడా నిలుపుతుంది.
- source_word: πάντες οἱ λαοί
  choice: సమస్త ప్రజలు
  rationale: ἔθνη మరియు λαοί మధ్యనున్న పదభేదాన్ని ‘జనములు’ మరియు ‘ప్రజలు’తో సాధ్యమైనంతవరకు కాపాడుతుంది.
theological_decisions:
- issue: పాత నిబంధన ఉల్లేఖనంలో ఇశ్రాయేలు దేవుణ్ణి సూచించే κύριος అనువాదం
  choice: ప్రభువు
  alternative: యెహోవా
  rationale: ప్రధాన పాఠం గ్రీకు κύριοςను నేరుగా అనుసరిస్తుంది. అయితే ఈ ఉల్లేఖనపు హెబ్రీ మూలంలో దైవనామం ఉన్నందున ‘యెహోవా’ అనే ప్రత్యామ్నాయాన్ని పాదటీపులో భద్రపరుస్తుంది.
- issue: రోమా 15లో ἔθνη యొక్క భావం
  choice: జనములు
  alternative: యూదేతరులు
  rationale: ఉల్లేఖనంలో సార్వత్రిక స్తుతి పిలుపును ‘జనములు’ బాగా నిలుపుతుంది; పౌలు యూదేతరుల చేర్పు గురించి చేస్తున్న వాదన వల్ల ‘యూదేతరులు’ అనే సందర్భోచిత భావాన్ని పాదటీపులో సూచిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా ఉండే శైలి. కవితాత్మక సమాంతరతను ‘స్తుతించండి/కొనియాడాలి’ మరియు ‘జనములు/ప్రజలు’ అనే భేదాలతో నిలుపుకుంది. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటీపులతో సరిపోలుతున్నాయి.
