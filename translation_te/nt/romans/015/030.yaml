id: ROM.15.30
reference: Romans 15:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: te
  text: సోదరులారా[b], మన ప్రభువైన యేసు మెస్సీయను బట్టి, ఆత్మయొక్క ప్రేమను బట్టి, నా కొరకు దేవునికి చేసే ప్రార్థనలలో నాతో కలిసి తీవ్రంగా కృషి చేయమని మిమ్మల్ని వేడుకుంటున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: గ్రీకులో ‘సోదరులు’ అనే పదం వ్యాకరణపరంగా పుంలింగంలో ఉంది; అయితే ఇది సోదరులు, సోదరీమణులు అనే మొత్తం విశ్వాసుల సమాజాన్ని ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: మిమ్మల్ని వేడుకుంటున్నాను
  rationale: ఇక్కడ క్రియ సాధారణ అభ్యర్థనకన్నా హృదయపూర్వకమైన, బలమైన విజ్ఞప్తిని తెలియజేస్తుంది. ‘వేడుకుంటున్నాను’ ఆ తీవ్రతను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక ప్రసంగంలోని మార్పును సూచిస్తుంది. తెలుగులో వాక్యప్రవాహమే ఆ మార్పును స్పష్టంచేస్తుంది; ‘ఇప్పుడు’ అని చేరిస్తే మూలంలో లేని కాలార్థం కలగవచ్చు.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకులోని పుంలింగ సంబోధన రూపాన్ని నిలుపుతూ, గౌరవప్రదమైన సహజ తెలుగు సంబోధనను వాడాం. ఇది విశ్వాసుల సమాజమంతటినీ ఉద్దేశించి ఉండవచ్చని పాదటీకలో తెలిపాం.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: మన ప్రభువైన యేసు మెస్సీయ ద్వారా
  rationale: διά + షష్ఠీ విభక్తి విజ్ఞప్తికి ఆధారాన్ని లేదా మాధ్యమాన్ని సూచిస్తుంది. ‘ద్వారా’ ఆ సంబంధాన్ని నిలుపుతుంది; Χριστόςను పేరులా కాక ‘మెస్సీయ’ అనే బిరుదుగా అనువదించాం.
- source_word: τῆς ἀγάπης τοῦ πνεύματος
  choice: ఆత్మ ప్రేమ
  rationale: గ్రీకు షష్ఠీ సంబంధంలోని సందిగ్ధతను—ఆత్మ చూపే ప్రేమ లేదా ఆత్మ కలిగించే ప్రేమ—ఏదో ఒక విధంగా నిర్ణయించకుండా సంక్షిప్తంగా నిలిపాం.
- source_word: συναγωνίσασθαί μοι
  choice: నాతో కలిసి పోరాడాలని
  rationale: συν- ఉపసర్గలోని ‘కలిసి’ అనే భావాన్నీ, ἀγωνίζομαιలోని తీవ్రమైన శ్రమ లేదా పోరాట భావాన్నీ రెండింటినీ వ్యక్తం చేస్తుంది.
- source_word: ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν
  choice: నా కోసం దేవునికి చేసే ప్రార్థనల్లో
  rationale: ప్రార్థనల దిశ దేవునివైపు ఉండటాన్ని, అవి పౌలు కోసం చేయబడటాన్ని సహజమైన తెలుగు పదక్రమంలో తెలియజేస్తుంది; మూలంలోని బహువచన ‘ప్రార్థనలు’ కూడా నిలిచింది.
theological_decisions:
- issue: ‘ఆత్మ’ ఎవరిని సూచిస్తుంది?
  choice: పరిశుద్ధాత్మను సూచించే ‘ఆత్మ’
  alternative: మానవ ఆత్మ లేదా వ్యక్తిత్వరహిత ఆధ్యాత్మిక శక్తి
  rationale: పౌలు వాడుకలో ఈ నిర్మాణం అత్యంత సహజంగా పరిశుద్ధాత్మను సూచిస్తుంది. అయితే ‘ఆత్మ ప్రేమ’లోని షష్ఠీ సంబంధం ఏ విధమైనదో ప్రధాన పాఠ్యంలో నిర్ణయించలేదు.
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός యేసుకు సంబంధించిన బిరుదుగా పనిచేస్తుంది. అందువల్ల దాని అర్థాన్ని తెలిపే ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో ఉంచి, సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటీకలో ఇచ్చాం.
- issue: ἀδελφοί సంబోధన పరిధి
  choice: సోదరులారా
  alternative: సోదర సోదరీమణులారా
  rationale: మూలంలోని వ్యాకరణపరమైన పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపాం; అది మొత్తం విశ్వాసుల సమాజాన్ని, స్త్రీలను కూడా, ఉద్దేశించి ఉండవచ్చనే భావాన్ని పాదటీకలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘నాతో కలిసి పోరాడాలని’ అనే పదబంధం ప్రార్థనను తీవ్రమైన ఉమ్మడి శ్రమగా చూపే మూలరూపకాన్ని నిలుపుతుంది. ప్రధాన పాఠ్యంలో ఉన్న ప్రతి పాదటీక సూచిక దానికి సంబంధించిన పదబంధం వెంట ఉంచబడింది.
