id: ROM.15.31
reference: Romans 15:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: te
  text: యూదయలో అవిధేయులైనవారి నుండి నేను రక్షించబడాలనీ[a], యెరూషలేముకు ఉద్దేశించిన నా సేవ పరిశుద్ధులకు ఆమోదయోగ్యమవ్వాలనీ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదయలో విశ్వసించనివారి నుండి.’ గ్రీకు పదం విశ్వసించడానికి నిరాకరించడం, అందువల్ల అవిధేయులుగా ఉండడం అనే భావాలను సూచించగలదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: …అనీ …అనీ
  rationale: ప్రార్థన చేయమన్న పౌలు అభ్యర్థనలోని రెండు సమన్విత ఉద్దేశాలను సహజమైన తెలుగులో కలుపుతుంది.
- source_word: ῥυσθῶ
  choice: నేను రక్షించబడాలి
  rationale: ప్రమాదం నుండి విడిపించబడడం అనే కర్మణి భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: అవిధేయులైనవారి నుండి
  rationale: ఈ పదంలో అవిశ్వాసం లేదా నమ్మడానికి నిరాకరించడం వల్ల కలిగే అవిధేయత భావం ఉంది; ప్రధాన పాఠ్యంలో విస్తృతమైన అర్థాన్ని ఉంచి, ‘విశ్వసించనివారు’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: యూదయలో
  rationale: స్థలసూచక పదబంధానికి ప్రామాణికమైన తెలుగు రూపం.
- source_word: διακονία
  choice: సేవ
  rationale: యెరూషలేముకు కానుకను తీసుకువెళ్లే పౌలు ఆచరణాత్మక పరిచర్యను సూచిస్తూనే, మూలపదంలోని విస్తృత సేవాభావాన్ని నిలుపుతుంది.
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: యెరూషలేము కోసం
  rationale: సేవ ఎవరిని లేదా ఏ ప్రదేశాన్ని ఉద్దేశించిందో సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εὐπρόσδεκτος
  choice: ఆమోదయోగ్యము
  rationale: అనుకూలంగా స్వీకరించదగినది అనే మూలభావాన్ని నిలుపుతుంది.
- source_word: τοῖς ἁγίοις
  choice: పరిశుద్ధులకు
  rationale: విశ్వాసుల కోసం పౌలు తరచుగా వాడే సంఘపరమైన పదాన్ని సంక్షిప్తంగా, సంప్రదాయబద్ధంగా నిలుపుతుంది.
- source_word: γένηται
  choice: ఆమోదయోగ్యమవ్వాలి
  rationale: కేవలం స్థితిని కాక, అలా కావడం లేదా అలా స్వీకరించబడడం అనే γίνομαι క్రియాభావాన్ని ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: యూదయలోని పౌలు ప్రత్యర్థులకు సంబంధించి ἀπειθούντων అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘అవిధేయులైనవారు’
  alternative: ‘విశ్వసించనివారు’
  rationale: ఈ గ్రీకు అసమాపక క్రియ విశ్వసించడానికి నిరాకరించడం, దాని ఫలితమైన అవిధేయత—రెండింటినీ సూచించగలదు. ప్రధాన పాఠ్యం విస్తృత భావాన్ని నిలుపుతుంది; సందర్భానుకూలమైన మరో అర్థాన్ని పాదటిప్పణి సంరక్షిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. వచనం ముందరి వాక్యంతో వ్యాకరణపరంగా కొనసాగుతున్నందున చివర కామా ఉంచబడింది; ‘పరిశుద్ధులు’ అనే పౌలు వాడుకలోని స్థిర పదం నిలుపబడింది.
