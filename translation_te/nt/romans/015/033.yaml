  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/033.yaml
  text: May the God of peace be with all of you. Amen.
translation:
  language: te
  text: శాంతిని ప్రసాదించే దేవుడు మీ అందరితో ఉండుగాక. ఆమేన్.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ స్వల్ప అనుసంధానాన్ని లేదా ముగింపు వైపు మార్పును సూచిస్తుంది; తెలుగులో ముందుగా ఒక కాలసూచక లేదా విరోధార్థక పదాన్ని చేర్చకుండా ఆశీర్వచనాన్ని నేరుగా పలకడం సహజంగా ఉంటుంది.
- source_word: θεὸς τῆς εἰρήνης
  choice: సమాధానానికి మూలమైన దేవుడు
  rationale: గ్రీకు షష్ఠీ విభక్తి పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, దేవుడు సమాధానంతో ప్రత్యేకంగా సంబంధం కలిగినవాడనే పౌలు వాడిన బిరుదు భావాన్ని నిలుపుతుంది.
- source_word: εἰρήνης
  choice: సమాధానం
  rationale: εἰρήνη సూచించే శాంతి, సఖ్యత, సంపూర్ణ క్షేమం వంటి విస్తృత భావానికి బైబిలు సందర్భంలో సహజమైన తెలుగు పదం.
- source_word: μετὰ πάντων ὑμῶν
  choice: మీ అందరితో ఉండుగాక
  rationale: గ్రీకులో క్రియ లేకపోయినా ఇది ఆశీర్వచన సూత్రం; తెలుగులో ‘ఉండుగాక’ను చేర్చడం ఆ కోరిక-ప్రార్థన స్వరాన్ని స్పష్టంగా తెలియజేస్తుంది. ‘మీ అందరితో’ πάντων యొక్క సమగ్రతను కాపాడుతుంది.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: ఆరాధనా ముగింపుగా స్థిరపడిన రూపాన్ని లిప్యంతరీకరించి, గంభీరమైన సమ్మతి భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: క్రియలేని వాక్యాన్ని వాస్తవ ప్రకటనగా అనువదించాలా, ఆశీర్వచన కోరికగా అనువదించాలా
  choice: ‘ఉండుగాక’తో ఆశీర్వచనంగా అనువదించబడింది.
  alternative: ‘సమాధానానికి మూలమైన దేవుడు మీ అందరితో ఉన్నాడు.’
  rationale: పత్రిక ముగింపు సూత్రాలలో ఈ గ్రీకు నిర్మాణం సహజంగా కోరిక-ప్రార్థన లేదా ఆశీర్వచనంగా పనిచేస్తుంది. మూలంలో స్పష్టమైన క్రియ లేకున్నా, తెలుగులో ‘ఉండుగాక’ దాని వాక్యప్రయోగ ఉద్దేశాన్ని సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గంభీరమైన ఆశీర్వచన శైలి. మూలంలోని δέ కోసం అసహజమైన ప్రారంభ అనుసంధాన పదం చేర్చలేదు.
