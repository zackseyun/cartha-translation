- from: అన్యజనుల కోసం[a] మెస్సీయ యేసు పరిచారకుడిగా ఉండి, దేవుని సువార్త విషయంలో యాజకసేవ చేస్తూ[b], అన్యజనుల అర్పణ[c] పవిత్రాత్మ ద్వారా[d] పరిశుద్ధపరచబడి దేవునికి అంగీకారయోగ్యమయ్యేలా చేయడానికి.
  to: అన్యజనులకు[a] మెస్సీయ యేసు పరిచారకుడిగా ఉండి, దేవుని సువార్త పరిచర్యను యాజకసేవగా నిర్వహిస్తూ[b], అన్యజనుల అర్పణ[c] పవిత్రాత్మ ద్వారా[d] పరిశుద్ధపరచబడినదై దేవునికి అంగీకారయోగ్యమవడానికి.
