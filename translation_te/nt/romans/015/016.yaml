id: ROM.15.16
reference: Romans 15:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: te
  text: అన్యజనులకు[a] మెస్సీయ యేసు పరిచారకుడిగా ఉండి, దేవుని సువార్త పరిచర్యను యాజకసేవగా నిర్వహిస్తూ[b], అన్యజనుల అర్పణ[c] పవిత్రాత్మ ద్వారా[d] పరిశుద్ధపరచబడినదై దేవునికి అంగీకారయోగ్యమవడానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జనాంగాలకు.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, “యాజకుని విధంగా సేవ చేస్తూ” లేదా “యాజక సంబంధమైన సేవ నిర్వహిస్తూ.”
    reason: lexical_alternative
  - marker: c
    text: బహుశా అన్యజనులే దేవునికి అర్పణగా సమర్పించబడుతున్నారని భావం; మరో విధంగా, “అన్యజనులు చేసే అర్పణ” అని అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
  - marker: d
    text: లేదా, “పవిత్రాత్మలో.”
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: పరిచారకుడు
  rationale: ఈ సందర్భంలో ఈ పదం ప్రజా లేదా పవిత్ర సేవ చేసే వ్యక్తిని సూచిస్తుంది. ‘పరిచారకుడు’ సేవాభావాన్ని నిలుపుతూ, తరువాత వచ్చే యాజక రూపకాన్ని అతిగా అధికారిక పదవిగా మార్చదు.
- source_word: Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని ‘మెస్సీయ’ అనే భావాన్ని స్పష్టంగా నిలిపాం.
- source_word: εἰς τὰ ἔθνη
  choice: అన్యజనుల కోసం
  rationale: రోమీయులకు పత్రికలో యూదులు కానివారిని సూచించే సందర్భంలో ἔθνηకు ‘అన్యజనులు’ సహజమైన, స్పష్టమైన అనువాదం. ‘జనాలు’ అనే విస్తృత ప్రత్యామ్నాయం పాదసూచికలో ఉంది.
- source_word: ἱερουργοῦντα
  choice: యాజకసేవ చేస్తూ
  rationale: ఈ క్రియ సాధారణ సేవను కాక యాజక సంబంధమైన పవిత్ర సేవను సూచిస్తుంది. మూలంలోని బలమైన యాజక రూపకాన్ని ఈ పదబంధం నిలుపుతుంది.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: దేవుని సువార్త
  rationale: ఇది పౌలు వాడే భావాన్ని సంక్షిప్తంగా, పరిచితమైన క్రైస్తవ పదజాలంలో తెలియజేస్తుంది.
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: అన్యజనుల అర్పణ
  rationale: గ్రీకు షష్ఠీ విభక్తి అన్యజనులే అర్పణ కావడాన్నీ, వారు చేసే అర్పణనూ వ్యాకరణపరంగా అనుమతిస్తుంది. ప్రధాన పాఠం ఆ అస్పష్టతను నిలుపుతుంది; సందర్భానికి ఎక్కువగా సరిపోయే వివరణ పాదసూచికలో ఇవ్వబడింది.
- source_word: εὐπρόσδεκτος
  choice: దేవునికి అంగీకారయోగ్యమైన
  rationale: అర్పణను దేవుడు అనుకూలంగా స్వీకరించడాన్ని బలిపరమైన సందర్భంలో సహజంగా తెలియజేస్తుంది; ‘దేవునికి’ అనేది సందర్భం ద్వారా స్పష్టమైన భావాన్ని తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡγιασμένη
  choice: పరిశుద్ధపరచబడి
  rationale: పరిశుద్ధం చేసే చర్య ఫలితంగా ఏర్పడిన స్థితిని గ్రీకు సంపూర్ణ కర్మణి కృదంతానికి అనుగుణంగా తెలియజేస్తుంది.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: పవిత్రాత్మ ద్వారా
  rationale: ἐνను ఇక్కడ పరిశుద్ధపరిచే సాధనం లేదా కార్యనిర్వాహకత్వంగా అర్థం చేసుకున్నాం. ‘పవిత్రాత్మలో’ అనే పరిధి సంబంధమైన అర్థం కూడా సాధ్యమే కనుక దాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: పౌలు తన సేవను యాజక రూపకంలో వర్ణించడం
  choice: అన్యజనుల మధ్య తన అపొస్తల సేవను పౌలు యాజకసేవగా రూపకాత్మకంగా వర్ణిస్తున్నాడనే భావాన్ని నిలిపాం.
  alternative: దీనిని అధికారిక యాజక పదవిగా చదవడం; లేదా యాజక భావాన్ని పూర్తిగా తొలగించి సాధారణ సేవగా మాత్రమే అనువదించడం.
  rationale: λειτουργός, ἱερουργέω, προσφορά అనే పదాలు కలిసి స్పష్టమైన యాజక రూపకాన్ని నిర్మిస్తున్నాయి. అయితే ఇక్కడ ప్రాయశ్చిత్త బలి గురించి కాక, సువార్త సేవ ఫలితంగా అన్యజనులను దేవునికి అర్పణగా సమర్పించడం గురించి ఉంది.
- issue: ‘అన్యజనుల అర్పణ’ దేనిని సూచిస్తుంది
  choice: సందర్భానుసారం అన్యజనులే దేవునికి సమర్పించబడే అర్పణ కావడం ప్రధాన సంభావ్య భావం; అయినా ప్రధాన పాఠంలో గ్రీకు నిర్మాణంలోని అస్పష్టతను నిలిపాం.
  alternative: అన్యజనులు దేవునికి చేసే అర్పణ.
  rationale: యాజక రూపకం, పౌలు అన్యజనుల మధ్య చేసే సేవ అనే తక్షణ సందర్భం—అన్యజనులే అర్పణ అనే అర్థానికి బలం ఇస్తాయి. అయినప్పటికీ షష్ఠీ నిర్మాణం మరొక అర్థాన్ని పూర్తిగా తొలగించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘పరిచారకుడు,’ ‘యాజకసేవ,’ ‘అర్పణ,’ ‘పరిశుద్ధపరచబడి’ వంటి పదాలు మూలంలోని సేవా, ఆరాధనా రూపకాలను నిలుపుతాయి. వాక్యం ముందు వచనంలోని ఉద్దేశ్య నిర్మాణాన్ని కొనసాగించేలా ముగుస్తుంది.
