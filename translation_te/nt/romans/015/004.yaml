id: ROM.15.4
reference: Romans 15:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: te
  text: ఎందుకంటే, ముందుగా వ్రాయబడినవన్నీ మన బోధన కొరకు వ్రాయబడ్డాయి; తద్వారా మనం సహనం ద్వారానూ, లేఖనాల ప్రోత్సాహం[a] ద్వారానూ నిరీక్షణ కలిగి ఉండేలా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘లేఖనాల ఆదరణ’; παράκλησις అనే పదానికి ప్రోత్సాహం, ఆదరణ, లేదా ప్రబోధం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మనం నిరీక్షణ కలిగి ఉండవచ్చు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: వ్రాయబడినవన్నీ
  rationale: నపుంసక బహువచన సంబంధ సర్వనామంలోని సమగ్ర భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: προεγράφη
  choice: ముందుగా వ్రాయబడినవి
  rationale: προ- ఉపసర్గలోని పూర్వకాల భావాన్ని నిలుపుతూ, ఇది ఇంతకు ముందు వ్రాయబడిన లేఖనాలను సూచిస్తుందని స్పష్టం చేస్తుంది.
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: మనకు ఉపదేశం ఇవ్వడానికి
  rationale: εἰς యొక్క ఉద్దేశ భావాన్నీ, διδασκαλία యొక్క బోధనాత్మక భావాన్నీ సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ‘మన ఉపదేశం’ అని చెప్పడం వల్ల కలిగే సందిగ్ధతను నివారిస్తుంది.
- source_word: ἐγράφη
  choice: వ్రాయబడ్డాయి
  rationale: సాధారణ కర్మణి రూపాన్ని అనుసరిస్తూ, గ్రీకులోని ‘వ్రాయబడింది’ అనే పునరుక్తి ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἵνα
  choice: తద్వారా … ఉండేలా
  rationale: ఉద్దేశం లేదా లక్ష్య ఫలితాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τῆς ὑπομονῆς
  choice: సహనం ద్వారా
  rationale: కష్టాల మధ్య నిలకడగా కొనసాగడాన్ని సూచించే ὑπομονή భావాన్ని ‘సహనం’ సంక్షిప్తంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: లేఖనాల ప్రోత్సాహం ద్వారా
  rationale: παράκλησις లోని బలపరిచే భావానికి సందర్భానుగుణంగా ‘ప్రోత్సాహం’ సరిపోతుంది; ‘ఆదరణ’ అనే సాధ్యమైన అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: τῶν γραφῶν
  choice: లేఖనాలు
  rationale: పౌలు వాడుకలోని పరిశుద్ధ గ్రంథరచనల సూచనను తెలుగు బైబిలు పరిభాషలో సహజంగా అందిస్తుంది.
- source_word: τὴν ἐλπίδα
  choice: నిరీక్షణ
  rationale: దేవునిపై భవిష్యత్ విశ్వాసంతో ఎదురుచూసే ἐλπίς భావాన్ని సాధారణ తెలుగు క్రైస్తవ పరిభాషలో తెలియజేస్తుంది.
- source_word: ἔχωμεν
  choice: మనం … కలిగి ఉండేలా
  rationale: ἵνα తరువాతి వర్తమాన సంభావనార్థక రూపంలోని ఉద్దేశ భావాన్ని, అనవసరమైన అనిశ్చితిని చేర్చకుండా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: నిరీక్షణ కలగడంలో లేఖనాల పాత్ర
  choice: ‘లేఖనాల’ అనే సంబంధాన్ని నేరుగా ‘ప్రోత్సాహం’తో ఉంచి, సహనం మరియు లేఖనాల ప్రోత్సాహం ద్వారా నిరీక్షణ కలుగుతుందని అనువదించాం.
  alternative: సహనం, ప్రోత్సాహం రెండూ లేఖనాల నుంచే వస్తాయని మరింత స్పష్టంగా చెప్పవచ్చు; లేదా అవి లేఖనాల్లో ఉదాహరించబడిన లక్షణాలని భావించవచ్చు.
  rationale: గ్రీకు పదక్రమంలో τῶν γραφῶν నేరుగా παρακλήσεωςతో సంబంధించింది. అది సహనంతోనూ విస్తృతంగా సంబంధించవచ్చనే భావాన్ని అనువాదం సిద్ధాంతపరంగా ఖరారు చేయకుండా విడిచిపెడుతుంది.
- issue: ἵνα … ἔχωμεν లోని ఉద్దేశం మరియు సంభావన
  choice: ‘నిరీక్షణ కలిగి ఉండేలా’ అని ఉద్దేశాన్ని వ్యక్తం చేశాం.
  alternative: ‘నిరీక్షణ కలిగి ఉండవచ్చు’ అని అనువదించవచ్చు.
  rationale: సంభావనార్థక క్రియను కేవలం అనిశ్చితిగా కాక, ἵνα సూచించే ఉద్దేశం లేదా లక్ష్య ఫలితంగా గ్రహించడం సందర్భానికి సరిపోతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖన పఠనానికి తగిన గంభీరతతో రూపొందించబడింది. గ్రీకు వాక్యంలోని ‘వ్రాయబడింది’ పునరుక్తిని నిలుపుటకు రెండో వాక్యంలో ‘అవి వ్రాయబడ్డాయి’ అని మళ్లీ పేర్కొన్నాం.
