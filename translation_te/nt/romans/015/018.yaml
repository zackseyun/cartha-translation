id: ROM.15.18
reference: Romans 15:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ τολμήσω ⸂τι λαλεῖν⸃ ὧν οὐ κατειργάσατο Χριστὸς δι’ ἐμοῦ εἰς ὑπακοὴν ἐθνῶν, λόγῳ καὶ ἔργῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: te
  text: ఎందుకంటే, అన్యజనుల[a] విధేయత కోసం మెస్సీయ నా ద్వారా మాటతోనూ క్రియతోనూ సాధించిన వాటిని తప్ప మరేదాని గురించీ నేను మాట్లాడడానికి సాహసించను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జనాలు” లేదా “దేశాలు.”
    reason: lexical_alternative
  - marker: b
    text: 'వాక్యంలోని మొదటి భాగాన్ని ఇలా కూడా క్రమపరచవచ్చు: “మెస్సీయ నా ద్వారా సాధించిన వాటిని తప్ప మరేదాని గురించీ నేను మాట్లాడడానికి సాహసించను.”'
    reason: alternative_reading
lexical_decisions:
- source_word: τολμήσω
  choice: నేను సాహసించను
  rationale: భవిష్యత్ సూచక క్రియతో కూడిన పౌలు స్వీయనిగ్రహ ప్రకటనను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; ‘తెగించను’ కంటే ఇది గౌరవప్రదమైన శైలికి సరిపోతుంది.
- source_word: τι λαλεῖν … ὧν οὐ
  choice: … సాధించిన వాటిని తప్ప మరేదాని గురించీ మాట్లాడడానికి
  rationale: గ్రీకు నిర్మాణంలోని నిర్బంధ భావాన్ని తెలుగులో ‘తప్ప మరేదాని గురించీ’ అని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: κατειργάσατο
  choice: సాధించిన
  rationale: ఈ సందర్భంలో క్రీస్తు ప్రభావవంతంగా నెరవేర్చిన లేదా కలుగజేసిన కార్యాన్ని సూచిస్తుంది.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ పదాన్ని అభిషిక్తుడనే బిరుదు భావంతో అనువదించి, వ్యక్తినామంలా మాత్రమే చూపకుండా ఉంచుతుంది.
- source_word: δι’ ἐμοῦ
  choice: నా ద్వారా
  rationale: మెస్సీయే ప్రధానంగా కార్యం చేసేవాడని, పౌలు సాధనంగా ఉన్నాడని διά + షష్ఠీ విభక్తి భావాన్ని కాపాడుతుంది.
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: అన్యజనుల విధేయత కోసం
  rationale: లక్ష్యం లేదా ఫలితాన్ని సూచించే εἰς భావాన్ని కాపాడుతూ, రోమీయులకు పత్రికలో ἔθνη సాధారణంగా యూదేతరులను సూచించే సందర్భార్థాన్ని అందిస్తుంది.
- source_word: λόγῳ καὶ ἔργῳ
  choice: మాటతోనూ క్రియతోనూ
  rationale: సాధనార్థక దత్తి విభక్తులను ప్రతిబింబిస్తూ, ప్రకటించిన మాట మరియు చేసిన కార్యం అనే జోడీని సంక్షిప్తంగా ఉంచుతుంది.
theological_decisions:
- issue: Χριστός పదం బిరుదా లేక పేరులాంటి ప్రయోగమా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ వాక్యంలో పౌలు ద్వారా కార్యం చేసే అభిషిక్తుని పాత్ర ముందుకు వస్తుంది; అందువల్ల బిరుదు భావాన్ని స్పష్టంగా ఉంచాం.
- issue: ἐθνῶν యొక్క సందర్భార్థం
  choice: అన్యజనులు
  alternative: జనాలు / దేశాలు
  rationale: రోమీయులకు పత్రికలోని యూదులు–యూదేతరులు అనే సందర్భంలో ‘అన్యజనులు’ ప్రధాన భావాన్ని మరింత స్పష్టంగా తెలియజేస్తుంది; విస్తృతమైన ‘జనాలు’ అనే అర్థాన్ని పాదసూచికలో ఉంచాం.
- issue: εἰς ὑπακοὴν సంబంధం
  choice: అన్యజనుల విధేయత కోసం
  alternative: అన్యజనులను విధేయులుగా చేయడానికి
  rationale: గ్రీకు నామవాచక నిర్మాణాన్ని నిలిపి, విధేయత లక్ష్యమా ఫలితమా అనే స్వల్ప భావవిస్తృతిని ముందే నిర్ణయించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘మాటతోనూ క్రియతోనూ’ అనే సమతుల్య జోడీ మూలంలోని సంక్షిప్తతను నిలుపుతుంది; ‘అన్యజనుల విధేయత కోసం’ అనే రూపం మూలంలోని ఉద్దేశ్యం/ఫలితం మధ్య ఉన్న భావవిస్తృతిని కాపాడుతుంది.
