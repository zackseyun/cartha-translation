id: ROM.15.21
reference: Romans 15:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· ⸂Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ ὄψονται⸃, καὶ οἳ οὐκ ἀκηκόασιν συνήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/021.yaml
  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: te
  text: 'కాని లేఖనంలో ఇలా వ్రాయబడి ఉంది:

    “ఆయన గురించి ఎవరికి ప్రకటించబడలేదో వారు చూస్తారు,[a][b]

    ఎవరు వినలేదో వారు అర్థం చేసుకుంటారు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: పౌలు ఇక్కడ యెషయా 52:15ను ఉల్లేఖిస్తున్నాడు. యెషయా సందర్భంలో ‘ఆయన’ అనే సర్వనామం సేవకుని సూచిస్తుంది; పౌలు దాన్ని ఇక్కడ తన సువార్త ప్రకటనకు అన్వయిస్తున్నాడు.
    reason: cross_reference
  - marker: b
    text: లేదా, “ఆయన గురించి ఏమీ తెలియజేయబడని వారు చూస్తారు; వినని వారు అర్థం చేసుకుంటారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: కాని
  rationale: ముందటి వాక్యంలో పౌలు చెప్పిన పరిచర్య లక్ష్యంతో ఈ లేఖన ఉల్లేఖనాన్ని అనుసంధానిస్తూ వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: καθὼς γέγραπται
  choice: లేఖనంలో ఇలా వ్రాయబడి ఉంది
  rationale: గ్రీకు పరిపూర్ణ కర్మణి రూపంలోని ప్రామాణిక లేఖన ఉల్లేఖన సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: ఆయన గురించి ఎవరికి ప్రకటించబడలేదో
  rationale: దత్తివ సంబంధ సర్వనామాన్ని అలాగే ప్రతిబింబిస్తూ, ἀναγγέλλω యొక్క ‘ప్రకటించు/తెలియజేయు’ భావాన్ని మరియు περὶ αὐτοῦ యొక్క వ్యక్తిగత సూచనను నిలుపుతుంది.
- source_word: ὄψονται
  choice: వారు చూస్తారు
  rationale: ὁράω యొక్క భవిష్యత్ రూపాన్ని వ్యాఖ్యానాత్మకంగా ‘గ్రహిస్తారు’ అని మార్చకుండా నేరుగా అనువదిస్తుంది.
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: ఎవరు వినలేదో
  rationale: ఇంతవరకు వినని స్థితిని సహజమైన తెలుగులో తెలియజేస్తుంది; గ్రీకు పరిపూర్ణ రూపపు ఫలితస్థితిని సందర్భానుసారంగా నిలుపుతుంది.
- source_word: συνήσουσιν
  choice: వారు అర్థం చేసుకుంటారు
  rationale: συνίημι యొక్క అవగాహన భావాన్ని స్పష్టమైన సాధారణ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: యెషయా ఉల్లేఖనంలో ‘ఆయన’ అనే సర్వనామం ఎవరిని సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘ఆయన’ అనే సర్వనామాన్నే ఉంచడం
  alternative: ‘మెస్సీయ గురించి’ లేదా ‘క్రీస్తు గురించి’ అని విస్తరించడం
  rationale: గ్రీకు పాఠ్యం αὐτοῦ అనే సర్వనామాన్నే ఉపయోగిస్తుంది. యెషయా సందర్భంలో అది సేవకుని సూచిస్తూ, ఇక్కడ పౌలు సువార్త ప్రకటనకు అన్వయిస్తాడు; ప్రధాన పాఠ్యంలో సూచ్యాన్ని విస్తరించడం మూలంలో లేని వ్యాఖ్యానాన్ని చేర్చుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ఉల్లేఖన కవితాత్మక సమాంతరతను రెండు పంక్తుల్లో నిలిపి, ‘చూస్తారు/అర్థం చేసుకుంటారు’ అనే మూలపాఠ్య ఉద్రిక్తతను వ్యాఖ్యానంతో సమతలపరచలేదు.
