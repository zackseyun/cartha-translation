source:
  edition: SBLGNT
  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: te
  text: బలమైనవారమైన మనం బలహీనుల బలహీనతలను[a] మోయాలి; మనల్ని మనం సంతోషపరచుకోకూడదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘బలహీనుల లోపాలను.’ గ్రీకు పదం బలహీనతలు, పరిమితులు లేదా లోపాలను సూచించగలదు. ఇక్కడ అది మునుపటి అధ్యాయంలో చర్చించిన మనస్సాక్షి సంకోచాలు లేదా పరిమితులను సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: మోయాలి … ప్రయత్నించకూడదు
  rationale: ఈ సూచనలోని నైతిక బాధ్యతను సహజమైన ఆధునిక తెలుగులో ‘ఆలి/కూడదు’ రూపాలతో వ్యక్తం చేస్తుంది; మూలంలోని సూచనాత్మక క్రియారూపాన్ని అతిగా కఠినమైన ఆజ్ఞగా మార్చదు.
- source_word: δὲ
  choice: ప్రత్యేక పదంతో అనువదించలేదు
  rationale: ఇది ముందరి చర్చను కొనసాగించే స్వల్ప సంధాయకం. తెలుగులో వాక్యక్రమమే ఆ కొనసాగింపును సహజంగా తెలియజేస్తుంది; ‘అయితే’ అని పెడితే మూలంలో ఉన్నదానికంటే బలమైన వ్యతిరేకత కలగవచ్చు.
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: బలమైనవారమైన మనం
  rationale: నొక్కి చెప్పబడిన ‘మనం’ను, రోమా 14–15లోని మనస్సాక్షి సంబంధమైన బలాన్ని వ్యక్తం చేస్తుంది. ‘బలవంతులు’ అనే పదం సామాజిక అధికారం లేదా బలప్రయోగం అనే అనవసర భావాన్ని కలిగించవచ్చు.
- source_word: τὰ ἀσθενήματα
  choice: బలహీనతలను
  rationale: శారీరక రోగాలకే లేదా నైతిక పాపాలకే పరిమితం చేయకుండా, మనస్సాక్షి పరిమితులు మరియు సంకోచాలను కలుపుకునే విస్తృత పదం.
- source_word: τῶν ἀδυνάτων
  choice: బలహీనుల
  rationale: సమీప సందర్భంలోని బలమైనవారు–బలహీనులు అనే వ్యత్యాసాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: βαστάζειν
  choice: మోయాలి
  rationale: ఇతరుల భారాన్ని తనపై వేసుకొని సహకరించాలనే రూపకాన్ని నిలుపుతుంది; కేవలం సహించడమనే కనిష్ఠ భావానికి తగ్గించదు.
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: మనల్ని మనం సంతోషపరచుకోవడానికి ప్రయత్నించకూడదు
  rationale: ఇతరుల బలహీనతలను మోయడానికి విరుద్ధంగా, స్వప్రయోజనాన్నే లేదా స్వసంతృప్తినే వెదకకూడదనే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ‘బలమైనవారు’, ‘బలహీనులు’ అనే పదాల అర్థం
  choice: రోమా 14లో ఆహారం, ప్రత్యేక దినాలు మొదలైన విషయాలపై వేర్వేరు మనస్సాక్షి పరిమితులు గల విశ్వాసులను ప్రధానంగా సూచించేలా అనువదించడం
  alternative: సామాజికంగా శక్తిగలవారు–శక్తిలేనివారు లేదా శారీరకంగా బలమైనవారు–బలహీనులు
  rationale: తక్షణ సాహిత్య సందర్భం మనస్సాక్షి, ఆహారం, దినాల గురించిన భేదాభిప్రాయాలను చర్చిస్తుంది. అయినా అనువాదంలో వివరణను చేర్చి పదాల విస్తృతిని మూసివేయకుండా ‘బలమైనవారు/బలహీనులు’ అనే మూల వ్యత్యాసాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన శైలి. ‘మోయాలి’ అనే పదం మూలంలోని భారాన్ని మోయడం అనే రూపకాన్ని నిలుపుతుంది. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో [a]గా ఉంచబడింది.
