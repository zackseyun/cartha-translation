id: ROM.15.17
reference: Romans 15:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἔχω οὖν ⸀τὴν καύχησιν ἐν Χριστῷ Ἰησοῦ τὰ πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: te
  text: కాబట్టి, దేవునికి సంబంధించిన విషయాల్లో మెస్సీయ యేసులో అతిశయించడానికి నాకు ఆధారం ఉంది[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతిశయించడానికి నాకు కారణం ఉంది’; లేదా ‘అతిశయించడానికి నాకు తగిన ఆధారం ఉంది.’
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు: ‘క్రీస్తు యేసులో.’ Χριστός ఇక్కడ ‘మెస్సీయ’ అనే బిరుదు.'
    reason: alternative_reading
  - marker: c
    text: లేదా ‘దేవుని గురించిన విషయాల్లో’; లేదా ‘దేవునితో సంబంధమున్న వ్యవహారాల్లో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω
  choice: నాకు ... ఉంది
  rationale: ప్రథమ పురుష ఏకవచన వర్తమాన రూపాన్ని తెలుగులో సహజంగా, నేరుగా వ్యక్తం చేస్తుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణాత్మక సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: καύχησιν
  choice: అతిశయించడానికి ... ఆధారం
  rationale: ఈ నామవాచకం ‘అతిశయం’ లేదా ‘అతిశయించడానికి ఆధారం’ అనే భావాలను కలిగి ఉంటుంది. సందర్భంలో పౌలు తనకు ఆధారం ఉందని చెప్పే భావాన్ని సహజ తెలుగులో తెలియజేస్తూనే, అతని వాదనను కేవలం వ్యక్తిగత గర్వంగా మార్చకుండా ఉంటుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: ἐν సూచించే పరిధి లేదా ఐక్యత భావాన్ని ‘లో’ నిలుపుతుంది; Χριστός ఇక్కడ బిరుదుగా ఉన్నందున దాని అర్థాన్ని ‘మెస్సీయ’గా అందించింది.
- source_word: τὰ πρὸς τὸν θεόν
  choice: దేవునికి సంబంధించిన విషయాల్లో
  rationale: దేవునితో సంబంధమున్న విషయాలు లేదా సేవా వ్యవహారాలు అనే విస్తృత భావాన్ని అనవసరంగా యాజక సేవకే పరిమితం చేయకుండా సహజంగా అందిస్తుంది.
- source_word: θεόν
  choice: దేవుడు
  rationale: ఈ సందర్భంలో θεόςకు ప్రామాణిక తెలుగు అనువాదం.
theological_decisions:
- issue: Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός వ్యక్తి పేరులో కలిసిపోయిన రూపంగా మాత్రమే కాక బిరుదుగా అర్థవంతంగా ఉంది; అందువల్ల బిరుదు భావాన్ని అనువదించడం సముచితం.
- issue: పౌలు చెప్పే καύχησις స్వభావం
  choice: మెస్సీయ యేసులో, దేవునికి సంబంధించిన విషయాల్లో అతిశయించడానికి ఆధారం
  alternative: సాధారణ వ్యక్తిగత గర్వం లేదా ఆత్మవిశ్వాసం
  rationale: ‘మెస్సీయ యేసులో’ మరియు ‘దేవునికి సంబంధించిన విషయాల్లో’ అనే రెండు పరిమితులను వాక్యంలో నిలిపి, పౌలు మాటలోని న్యాయమైన అతిశయాన్నీ దానిలో ఉండే ఉద్రిక్తతనూ పరిష్కరించకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘గర్వించు’ అనే పదం కలిగించే ప్రధానంగా ప్రతికూల భావాన్ని నివారిస్తూ, పౌలు రచనల్లోని καύχησις పదబంధ సంబంధాన్ని నిలుపడానికి ‘అతిశయించు’ వాడబడింది. వాక్యక్రమం తెలుగు సహజత్వం కోసం మార్చినా మూలంలోని అన్ని భావాంశాలు నిలుపబడ్డాయి.
