    text: లేదా “ఎన్నోసార్లు” లేదా “పదేపదే”; గ్రీకు τὰ πολλὰ అనే నుడికారం తరచుగా పునరావృతమయ్యే విషయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
