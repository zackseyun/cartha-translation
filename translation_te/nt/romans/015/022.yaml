  text: Διὸ καὶ ἐνεκοπτόμην τὰ πολλὰ τοῦ ἐλθεῖν πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/022.yaml
  text: Therefore I also was often hindered from coming to you[a].
translation:
  language: te
  text: ఈ కారణంగానే నేను కూడా మీ దగ్గరకు రావడంలో తరచుగా అడ్డుకోబడ్డాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఎన్నోసార్లు” లేదా “పదేపదే”; గ్రీకు τὰ πολλὰ అనే నుడికారం తరచుగా పునరావృతమయ్యే విషయాన్ని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: అందువల్లనే
  rationale: ముందటి వాక్యాలలో పౌలు వివరించిన సేవా లక్ష్యంవల్ల కలిగిన పరిణామాన్ని సూచిస్తుంది; ‘అందువల్లనే’ తార్కిక సంబంధాన్ని సహజంగా నిలుపుతుంది.
- source_word: καὶ
  choice: -నే
  rationale: గ్రీకు καὶ లోని అనుబంధ/ఉద్ఘాటన భావాన్ని తెలుగులో ప్రత్యేకంగా ‘కూడా’ చేర్చడం కంటే ‘అందువల్లనే’లోని ‘నే’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐνεκοπτόμην
  choice: ఆటంకపరచబడ్డాను
  rationale: అసంపూర్ణ భూతకాల రూపం గతంలో పదేపదే ఎదురైన ఆటంకాన్ని సూచిస్తుంది; కర్త ఎవరో నిర్దిష్టం చేయకుండా గ్రీకు క్రియలోని కర్మణి భావాన్ని కాపాడుతుంది.
- source_word: τὰ πολλὰ
  choice: చాలాసార్లు
  rationale: ఈ క్రియావిశేషణీయ నుడికారం సందర్భంలో పునరావృతిని, అనేక సందర్భాలను సూచిస్తుంది; ‘చాలాసార్లు’ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: τοῦ ἐλθεῖν
  choice: రాకుండా
  rationale: ఆటంకాన్ని తెలిపే క్రియ తరువాతి ఆర్టిక్యులర్ ఇన్ఫినిటివ్, అడ్డుకోబడిన కార్యాన్ని సూచిస్తుంది; తెలుగులో ‘రాకుండా ... ఆటంకపరచబడ్డాను’ సహజ నిర్మాణం.
- source_word: πρὸς ὑμᾶς
  choice: మీ దగ్గరికి
  rationale: πρός తో ద్వితీయా విభక్తి ఇక్కడ రోమా విశ్వాసుల వైపు గమనాన్ని సూచిస్తుంది; ‘మీ దగ్గరికి’ ఆ దిశాభావాన్ని సహజంగా అందిస్తుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. ఆటంకం కలిగించిన కర్తను మూలపాఠం పేర్కొననందున అనువాదంలోనూ పేర్కొనలేదు; అసంపూర్ణ భూతకాలంలోని పునరావృతి భావాన్ని ‘చాలాసార్లు’ స్పష్టం చేస్తుంది.
