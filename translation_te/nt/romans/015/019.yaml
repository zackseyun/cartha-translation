revisions:
- from: సూచక క్రియలూ అద్భుతాలూ ప్రదర్శించే శక్తిచేత, ఆత్మ శక్తిచేత[a], నేను యెరూషలేము మొదలుకొని చుట్టుపక్కల ప్రాంతాల మీదుగా ఇల్లూరికం వరకు మెస్సీయ సువార్తను పూర్తిగా ప్రకటించాను[b].
  to: సూచక కార్యాలు మరియు అద్భుతాల శక్తిచేత, ఆత్మయొక్క శక్తిచేత[a], దాని ఫలితంగా నేను యెరూషలేము నుండి చుట్టుపక్కల ప్రాంతాలన్నిటిలో ఇల్లూరికం వరకు మెస్సీయ సువార్తను పూర్తిగా ప్రకటించాను[b].
  rationale: 'A safe revision is required because footnote a misidentifies an interpretive rendering as a manuscript reading. The text is adjusted for closer formal fidelity and natural modern Telugu: the signs-and-wonders phrase is retained without added verbal action, ὥστε is expressed as a result, and the geographical phrase preserves both the Jerusalem starting point and the surrounding regions extending to Illyricum. The lexical alternative for πεπληρωκέναι remains in a concise footnote without imposing a single disputed nuance.'
