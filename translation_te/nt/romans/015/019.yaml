id: ROM.15.19
reference: Romans 15:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: te
  text: సూచక కార్యాలు మరియు అద్భుతాల శక్తిచేత, ఆత్మయొక్క శక్తిచేత[a], దాని ఫలితంగా నేను యెరూషలేము నుండి చుట్టుపక్కల ప్రాంతాలన్నిటిలో ఇల్లూరికం వరకు మెస్సీయ సువార్తను పూర్తిగా ప్రకటించాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పరిశుద్ధ ఆత్మ శక్తిచేత.’
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘మెస్సీయ సువార్తను సంపూర్ణంగా నెరవేర్చాను.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δυνάμει
  choice: శక్తిచేత
  rationale: ఈ పదబంధం సాధనాన్ని లేదా కార్యసాధక శక్తిని సూచిస్తుంది. పునరుక్తిని నిలిపి, తెలుగులో సహజంగా ఉండేలా రెండుసార్లూ ‘శక్తిచేత’ అని అనువదించాం.
- source_word: σημείων καὶ τεράτων
  choice: సూచక క్రియలూ అద్భుతాలూ
  rationale: σημεῖον కేవలం ఆశ్చర్యకరమైన కార్యం కాక, దేవుని కార్యాన్ని సూచించే క్రియ అనే భావాన్ని కలిగి ఉంది; τέρας ఆశ్చర్యాన్ని కలిగించే అద్భుతాన్ని సూచిస్తుంది.
- source_word: πνεύματος
  choice: ఆత్మ
  rationale: ఈ పౌలు సందర్భంలో ఇది దేవుని ఆత్మను సూచించడం అత్యంత సహజం. అయితే గ్రీకులో ‘పరిశుద్ధ’ అనే విశేషణం లేనందున ప్రధాన పాఠ్యంలో దానిని చేర్చలేదు.
- source_word: ὥστε με
  choice: నేను … ప్రకటించాను
  rationale: ὥστε తో కూడిన accusative-infinitive నిర్మాణం ముందున్న దైవశక్తితో జరిగిన పరిచర్య ఫలితాన్ని తెలియజేస్తుంది. తెలుగులో ప్రత్యేక ఫలితసూచక పదం లేకుండానే వాక్యక్రమం ఈ సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ
  choice: యెరూషలేము మొదలుకొని చుట్టుపక్కల ప్రాంతాల మీదుగా
  rationale: κύκλῳ ఇక్కడ పరిసర ప్రాంతాల గుండా విస్తరించిన భౌగోళిక పరిధిని సూచిస్తుంది; ‘చుట్టుపక్కల ప్రాంతాల మీదుగా’ దాని విస్తృత భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: μέχρι τοῦ Ἰλλυρικοῦ
  choice: ఇల్లూరికం వరకు
  rationale: μέχρι పరిచర్య విస్తరించిన భౌగోళిక అంచును సూచిస్తుంది.
- source_word: πεπληρωκέναι
  choice: పూర్తిగా ప్రకటించాను
  rationale: πληρόω యొక్క పరిపూర్ణ కాలరూపం ఇక్కడ ఆ ప్రాంతమంతటా సువార్త ప్రకటనను సంపూర్ణంగా నిర్వహించిన భావాన్ని ఇస్తుంది. ‘పూర్తిగా ప్రకటించాను’ సందర్భానుగుణంగా సహజంగా ఉండి, సంపూర్ణతను నిలుపుతుంది.
- source_word: τὸ εὐαγγέλιον
  choice: సువార్త
  rationale: పౌలు రచనల్లోని ‘శుభవార్త’ భావానికి ‘సువార్త’ ఆధునిక తెలుగు క్రైస్తవ వాడుకలో సంక్షిప్తంగా, స్పష్టంగా ఉంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయ సువార్త
  rationale: Χριστός ఇక్కడ సువార్తకు సంబంధించిన బిరుదుగా అర్థవంతంగా ఉంది; ‘మెస్సీయ’ దాని అభిషిక్త రాజు అనే బిరుదు స్వభావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: πνεύματος యొక్క సూచిత వ్యక్తి
  choice: ఆత్మ—సందర్భంలో దేవుని పరిశుద్ధ ఆత్మ
  alternative: పరిశుద్ధ ఆత్మ; లేదా సాధారణ అర్థంలో ఆత్మ
  rationale: సూచక క్రియలు, అద్భుతాలు, అపొస్తలిక పరిచర్యకు శక్తినిచ్చే దైవిక కార్యం అనే సమీప సందర్భం పరిశుద్ధ ఆత్మను సూచిస్తుంది. అయినా మూలపాఠ్యంలో ἁγίου లేకపోవడం వల్ల ప్రధాన పాఠ్యం ‘ఆత్మ’ అనే రూపాన్నే ఉంచుతుంది.
- issue: πεπληρωκέναι τὸ εὐαγγέλιον యొక్క భావం
  choice: మెస్సీయ సువార్తను పూర్తిగా ప్రకటించాను
  alternative: మెస్సీయ సువార్తను సంపూర్ణంగా నెరవేర్చాను
  rationale: క్రియ యొక్క మౌలిక భావం ‘నింపడం/సంపూర్ణం చేయడం’; ఈ సందర్భంలో సువార్తను విస్తృత ప్రాంతంలో పూర్తిగా ప్రకటించడాన్ని సూచిస్తుంది. ప్రధాన పాఠ్యం సహజ తెలుగు అర్థాన్ని ఇస్తూ, మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సూచక క్రియలు’ ద్వారా σημεῖα యొక్క సంకేతాత్మక భావాన్ని, ‘అద్భుతాలు’ ద్వారా τέρατα యొక్క ఆశ్చర్యకర స్వభావాన్ని వేరు చేసి నిలిపాం. భౌగోళిక ప్రవాహం సహజంగా ఉండేందుకు ‘చుట్టుపక్కల ప్రాంతాల మీదుగా’ వాడాం.
