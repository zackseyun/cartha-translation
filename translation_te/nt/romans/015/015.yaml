source:
  edition: SBLGNT
  text: ⸀τολμηρότερον δὲ ἔγραψα ⸀ὑμῖν ἀπὸ μέρους, ὡς ἐπαναμιμνῄσκων ὑμᾶς, διὰ τὴν χάριν τὴν δοθεῖσάν μοι ⸀ὑπὸ τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/015.yaml
  text: But I have written to you rather boldly in part, as reminding you again, because of the grace given to me by God,
translation:
  language: te
  text: అయితే, దేవుడు నాకు అనుగ్రహించిన కృపను బట్టి[b], మీకు మళ్లీ జ్ఞాపకం చేస్తూ కొన్ని విషయాల్లో మరింత ధైర్యంగా రాశాను[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కొంతవరకు మీకు మరింత ధైర్యంగా రాశాను.” ఈ మాటలు పౌలు మరింత ధైర్యంతో రాశాడని గానీ, కొన్ని విషయాల గురించి ధైర్యంగా రాశాడని గానీ అర్థమివ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “దేవుడు నాకు అనుగ్రహించిన కృప” అనేది సాధారణ అర్థంలోని కృపను మాత్రమే కాక, పౌలు పరిచర్య కోసం దేవుడు అతనికి ఇచ్చిన నియామకాన్ని, సామర్థ్యాన్ని సూచిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: τολμηρότερον
  choice: కాస్త ఎక్కువ ధైర్యంగా
  rationale: తులనాత్మక క్రియావిశేషణంలోని ‘మరింత ధైర్యంగా’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి ప్రశంసల తర్వాత వచ్చే స్వల్ప వ్యత్యాసాన్ని, విషయ మలుపును సహజంగా సూచిస్తుంది.
- source_word: ἔγραψα
  choice: రాశాను
  rationale: పత్ర రచనా సందర్భంలోని గ్రీకు ఏరిస్టుకు సహజమైన తెలుగు భూతకాల రూపం.
- source_word: ἀπὸ μέρους
  choice: కొన్ని విషయాల్లో
  rationale: ఈ నుడికారానికి ‘కొంతవరకు’ లేదా ‘కొన్ని విషయాలకు సంబంధించి’ అనే రెండు సాధ్యమైన పరిధులు ఉన్నాయి; సందర్భంలో సహజంగా ఉండే రెండవ భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: మీకు మళ్లీ జ్ఞాపకం చేస్తూ
  rationale: కృదంతం రచన యొక్క ధోరణి లేదా ఉద్దేశాన్ని వివరిస్తుంది; సంయుక్త క్రియలోని పునఃజ్ఞాపన భావాన్ని ‘మళ్లీ’ ద్వారా నిలుపుతుంది.
- source_word: διὰ τὴν χάριν
  choice: కృపనుబట్టి
  rationale: διά + ద్వితీయా విభక్తి కారణాన్ని లేదా ఆధారాన్ని సూచిస్తుంది; χάριςకు పౌలు వాడుకలో స్థిరమైన ‘కృప’ అనే పదాన్ని నిలుపుతుంది.
- source_word: τὴν δοθεῖσάν μοι ὑπὸ τοῦ θεοῦ
  choice: దేవుడు నాకు అనుగ్రహించిన
  rationale: దేవుడే కృపను ఇచ్చిన కర్త అని స్పష్టంగా ఉంచుతూ, తెలుగులో గౌరవప్రదంగా, సహజంగా వినిపించే క్రియను వాడుతుంది.
theological_decisions:
- issue: ఈ సందర్భంలో χάρις భావం
  choice: ప్రధాన పాఠ్యంలో విస్తృతమైన ‘కృప’ అనే పదాన్ని నిలుపుతూ, పాదసూచికలో పౌలు పరిచర్యకు దేవుడు ఇచ్చిన నియామకం, సామర్థ్యం అనే సందర్భార్థాన్ని తెలియజేయడం
  alternative: ‘పరిచర్య బాధ్యత’ లేదా ‘దైవ నియామకం’ అని ప్రధాన పాఠ్యంలోనే నిర్దిష్టంగా అనువదించడం
  rationale: 15–16 వచనాల సందర్భంలో ఈ కృప పౌలు అన్యజనుల పరిచర్యతో ముడిపడి ఉంది. అయినా మూలపదంలోని విస్తృత దైవానుగ్రహ భావాన్ని సంకుచితం చేయకుండా ప్రధాన పాఠ్యంలో ‘కృప’ను ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పత్రికా శైలికి తగిన గౌరవప్రదమైన స్వరంతో రూపొందించబడింది. గ్రీకు వాక్యంలోని కారణ సంబంధాన్ని ముందుకు తెచ్చి తెలుగు వాక్య ప్రవాహాన్ని సహజం చేశాం; అర్థపరమైన అస్పష్టతను పాదసూచికలో నిలిపాం.
