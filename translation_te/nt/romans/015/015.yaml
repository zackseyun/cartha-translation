  rationale: 'Two small wording corrections improve precision and modern Telugu readability: the unqualified comparative “మరింత ధైర్యంగా” replaces the potentially minimizing “కాస్త ఎక్కువ ధైర్యంగా,” and “కృపను బట్టి” is spaced conventionally. The scope ambiguity of ἀπὸ μέρους remains represented by the main text and footnote a; the ministry nuance of χάρις remains explanatory only in footnote b.'
