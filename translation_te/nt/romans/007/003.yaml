  verdict: revise
  source_fidelity: భర్త సజీవంగా ఉన్నప్పుడు స్త్రీ మరొక పురుషునికి భార్య అయితే ఆమెను వ్యభిచారిణిగా పిలుస్తారని, భర్త మరణిస్తే ఆ చట్టబంధం నుండి ఆమె స్వతంత్రురాలై, మరొక పురుషునికి భార్య అయినా వ్యభిచారిణి కాదని గ్రీకు వాక్యం చెబుతుంది. ముసాయిదాలోని ‘చెందినదైతే/చెందినా’ సంబంధ భావాన్ని కొంతవరకు తెలియజేసినా, తెలుగులో అది స్వామిత్వ భావాన్ని కలిగించి వివాహసందర్భాన్ని తగినంత స్పష్టంగా వ్యక్తం చేయదు. ‘భార్య అయితే/భార్య అయినా’ ఈ సందర్భంలోని γίνομαι + dative ప్రయోగాన్ని సహజంగా, ఖచ్చితంగా తెలియజేస్తుంది.
  naturalness: ‘మరొక పురుషునికి చెందినది’ ఆధునిక తెలుగులో స్త్రీని ఒకరి ఆస్తిగా సూచించినట్టు వినిపించే అవకాశం ఉంది. ‘మరొక పురుషునికి భార్య అయితే’ స్పష్టమైన, సహజమైన, సందర్భోచితమైన ప్రయోగం. ‘స్వతంత్రురాలు’ చట్టబంధం నుండి విడుదలైన భావాన్ని ‘విముక్తురాలు’ కంటే మరింత సరళంగా అందిస్తుంది.
  terminology: ‘వ్యభిచారిణి’ μοιχαλίς కు సరైన, స్థిరమైన పదం. νόμος ను ప్రధాన పాఠ్యంలో ‘ఆ చట్టం’గానే ఉంచి, వివాహబంధాన్ని నియంత్రించే చట్టపరమైన నియమమే తక్షణ సూచన అని పాదసూచికలో వివరించడం తగినది. γένηται/γενομένην ను రెండు చోట్లా ‘భార్య’ అనే వివాహసంబంధ పదంతో సమానంగా అనువదించాం.
  issues:
  - severity: medium
    issue: ‘మరొక పురుషునికి చెందినదైతే/చెందినా’ అనే ప్రధాన పాఠ్య ప్రయోగం
    rationale: ఈ పదబంధం తెలుగులో వివాహసంబంధం కంటే స్వామిత్వం లేదా ఆధీనతను సూచించవచ్చు. గ్రీకు ప్రయోగం ఈ సందర్భంలో మరొక పురుషునితో వివాహసంబంధంలోకి రావడాన్ని సూచిస్తుంది; అందువల్ల ‘మరొక పురుషునికి భార్య అయితే/అయినా’ మరింత ఖచ్చితమైనది, సహజమైనది.
