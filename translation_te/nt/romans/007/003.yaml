id: ROM.7.3
reference: Romans 7:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: te
  text: కాబట్టి, భర్త బతికి ఉండగా ఆమె మరొక పురుషునికి భార్య అయితే[a], ఆమెను వ్యభిచారిణి అని పిలుస్తారు. అయితే భర్త చనిపోతే, ఆమె ఆ చట్టం నుంచి స్వతంత్రురాలు[b]. అందువల్ల ఆమె మరొక పురుషునికి భార్య అయినా వ్యభిచారిణి కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మరొక పురుషునికి చెందినదైతే’ లేదా ‘మరొక పురుషునితో జతకడితే.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ఆ చట్టం’ అనేది తక్షణ సందర్భంలో వివాహబంధాన్ని నియంత్రించే చట్టపరమైన బంధాన్ని సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: కాబట్టి
  rationale: ముందటి వాక్యాల నుంచి తీసుకున్న ముగింపును సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: ζῶντος τοῦ ἀνδρός
  choice: భర్త బతికి ఉండగా
  rationale: ఈ సందర్భంలో ἀνήρ భర్తను సూచిస్తుంది; genitive absolute తెలిపే సమకాలిక పరిస్థితిని ‘ఉండగా’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μοιχαλὶς
  choice: వ్యభిచారిణి
  rationale: వ్యభిచారం చేసిన స్త్రీని నిర్దిష్టంగా సూచించే గ్రీకు నామవాచకానికి ఇది నేరుగా సరిపోతుంది.
- source_word: χρηματίσει
  choice: ఆమెను … అంటారు
  rationale: ఈ సందర్భంలో ‘అని పిలవబడుతుంది/పేరు పొందుతుంది’ అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ / γενομένην ἀνδρὶ ἑτέρῳ
  choice: మరొక పురుషునికి చెందినదైతే / చెందినా
  rationale: γίνομαιతో కూడిన dative తెలిపే కొత్త సంబంధాన్ని ప్రతిబింబిస్తూ, మూలంలో స్పష్టంగా లేని ‘భార్య’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా ఉంచుతుంది. వివాహ సందర్భం సమీప వాక్యాల వల్ల స్పష్టమవుతుంది.
- source_word: ἐλευθέρα ἐστὶν
  choice: విముక్తురాలు
  rationale: బంధించే హక్కు లేదా బాధ్యత నుంచి విడుదలైన స్థితిని సంక్షిప్తంగా, గౌరవప్రదంగా తెలుపుతుంది.
- source_word: ἀπὸ τοῦ νόμου
  choice: ఆ చట్టం నుంచి
  rationale: νόμος అనే పదాన్ని చట్టంగా నిలుపుతూ, నిర్దేశక రూపమైన ‘ఆ’ ద్వారా తక్షణ సందర్భంలోని వివాహబంధాన్ని నియంత్రించే చట్టాన్ని సూచిస్తుంది; దానిని ప్రధాన పాఠ్యంలో మరీ నిర్దిష్టం చేయదు.
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: అందువల్ల … వ్యభిచారిణి కాదు
  rationale: articular infinitive తెలిపే ఫలిత సంబంధాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో కాపాడుతుంది.
theological_decisions:
- issue: νόμος యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘ఆ చట్టం’ అని అనువదించి, తక్షణ సూచన వివాహబంధాన్ని నియంత్రించే చట్టమని పాదసూచికలో వివరించడం
  alternative: ‘వివాహ చట్టం’ లేదా విస్తృత పౌలు భావంలో ‘ధర్మశాస్త్రం’
  rationale: సందర్భం భర్త జీవించి ఉన్నప్పుడు లేదా మరణించినప్పుడు వివాహిత స్త్రీకి ఉండే చట్టపరమైన స్థితి. ‘ఆ చట్టం’ మూలపదాన్ని కాపాడుతూ, మోషే ధర్మశాస్త్రమంతటికీ వర్తించే విస్తృత సిద్ధాంత ప్రకటనగా ముందుగానే నిర్ణయించదు.
- issue: γένηται ἀνδρὶ ἑτέρῳ లోని సంబంధ స్వరూపం
  choice: ‘మరొక పురుషునికి చెందినదైతే’
  alternative: ‘మరొక పురుషునికి భార్య అయితే’ లేదా ‘మరొక పురుషునితో జతకడితే’
  rationale: వివాహపరమైన సందర్భాన్ని గౌరవిస్తూనే, గ్రీకు వాక్యంలోని సంక్షిప్తమైన సంబంధ సూచనను ప్రధాన పాఠ్యంలో మరీ స్పష్టీకరించకుండా దాని సహజ అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘వ్యభిచారిణి,’ ‘విముక్తురాలు’ వంటి పదాలు భావ ఖచ్చితత్వాన్ని కాపాడుతాయి; వాక్య నిర్మాణం మాత్రం సరళంగా ఉంచబడింది.
