  to: కాబట్టి, భర్త బతికి ఉండగా ఆమె మరొక పురుషునికి భార్య అయితే[a], ఆమెను వ్యభిచారిణి అని పిలుస్తారు. అయితే భర్త చనిపోతే, ఆమె ఆ చట్టం నుంచి స్వతంత్రురాలు[b]. అందువల్ల ఆమె మరొక పురుషునికి భార్య అయినా వ్యభిచారిణి కాదు.
  rationale: వివాహానికి సంబంధించిన గ్రీకు సంబంధప్రయోగాన్ని తెలుగులో స్వామిత్వ భావం రాకుండా స్పష్టంగా, సహజంగా అనువదించడానికి ‘చెందినది’ స్థానంలో ‘భార్య’ను ఉపయోగించాం. ఇది సందర్భం సూచించే అర్థాన్ని మాత్రమే వ్యక్తం చేస్తుంది; νόμος యొక్క విస్తృత పరిధి గురించి ఏ సిద్ధాంతపరమైన నిర్ణయమూ ప్రధాన పాఠ్యంలో చేర్చదు. రెండు చోట్లా ఒకే పదబంధాన్ని ఉంచి మూలంలోని పునరుక్తిని కాపాడాం.
