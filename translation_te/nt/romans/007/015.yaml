id: ROM.7.15
reference: Romans 7:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: te
  text: నేను చేస్తున్నది ఏమిటో నాకు అర్థం కాదు; ఎందుకంటే, నేను కోరేదాన్ని ఆచరించను; బదులుగా, నేను ద్వేషించేదానినే చేస్తాను.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: చేస్తున్నది
  rationale: క్రియ యొక్క ‘చేయడం/కార్యరూపంలో పెట్టడం’ అనే విస్తృత భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: οὐ γινώσκω
  choice: నాకే అర్థం కావడం లేదు
  rationale: ఇక్కడ γινώσκω కేవలం వాస్తవాన్ని తెలియకపోవడం కంటే తన ప్రవర్తనను గ్రహించలేకపోవడాన్ని సూచిస్తుంది; ‘నాకే’ అనేది తెలుగు వాక్యంలో ఆ అంతర్గత విరోధాన్ని సహజంగా ఉద్ఘాటిస్తుంది.
- source_word: θέλω
  choice: కోరుకున్నదాన్ని
  rationale: ‘ఇష్టపడడం/కోరడం/సంకల్పించడం’ అనే భావపరిధిలో, సందర్భానికి సరిపోయే సాధారణ పదాన్ని ఎంచుకుని సంకల్పం ఎంత బలమైనదో అవసరానికి మించి నిర్ధారించలేదు.
- source_word: πράσσω
  choice: ఆచరించడం
  rationale: కొనసాగించే ప్రవర్తన లేదా ఆచరణ భావాన్ని తెలియజేస్తూ, తరువాతి ποιῶకు వాడిన ‘చేస్తున్నాను’తో మూలంలోని పదభేదాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: ποιῶ
  choice: చేస్తున్నాను
  rationale: సాధారణ ‘చేయడం’ అనే అర్థాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: μισῶ
  choice: ద్వేషించేదానినే
  rationale: మూలంలోని బలమైన ‘ద్వేషించడం’ భావాన్ని తగ్గించకుండా, τοῦτο ఇచ్చే ఉద్ఘాటనను ‘-నే’ ద్వారా నిలుపుతుంది.
theological_decisions:
- issue: వక్త తన చర్యను ‘తెలియదు’ అని చెప్పడంలోని భావం
  choice: ‘నాకే అర్థం కావడం లేదు’ అని అనువదించి, తన ప్రవర్తన పట్ల ఉన్న అంతర్గత అయోమయాన్ని వ్యక్తపరచడం
  alternative: ‘నేను చేస్తున్నదాన్ని నేను గుర్తించను/అంగీకరించను’
  rationale: γινώσκωకు విస్తృత భావపరిధి ఉన్నప్పటికీ, సందర్భంలోని కోరేది–చేసేది మధ్య విరోధాన్ని ‘అర్థం కావడం లేదు’ సహజంగా తెలియజేస్తుంది; వక్త బాధ్యతను నిరాకరిస్తున్నాడని లేదా తన చర్యను ఆమోదించడం లేదని అదనంగా నిర్ణయించదు.
- issue: రోమా 7లోని ‘నేను’ ఎవరో నిర్ధారించడం
  choice: వచనాన్ని ప్రథమ పురుష వర్తమాన రూపంలో యథాతథంగా ఉంచడం
  alternative: మారుమనస్సు పొందిన విశ్వాసి లేదా మారుమనస్సుకు ముందున్న వ్యక్తి అని వివరణాత్మకంగా గుర్తించడం
  rationale: ఈ వచనం ఒక్కటే వక్త స్థితిపై ఉన్న వ్యాఖ్యాన భేదాన్ని తేల్చదు; అనువాదం ఏ సిద్ధాంతపరమైన గుర్తింపునూ చొప్పించదు.
- issue: రెండవ γάρ యొక్క సంబంధం
  choice: మొదటి వాక్యాన్ని తరువాతి విరుద్ధ ప్రవర్తన వివరిస్తున్నట్లు సహజమైన వాక్యక్రమంతో చూపడం
  alternative: రెండవ γάρను స్పష్టంగా ‘ఎందుకంటే’ అని మళ్లీ అనువదించడం
  rationale: తెలుగులో అదే కారణసూచక పదాన్ని వెంటనే పునరావృతం చేయడం భారంగా ఉంటుంది; విరామచిహ్నం మరియు వాక్యసంబంధం ద్వారా కారణాత్మక వివరణ నిలుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే అంతర్గత సంఘర్షణ యొక్క గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘ఆచరించడం’ మరియు ‘చేయడం’ ద్వారా πράσσω/ποιῶ పదభేదం కొంతవరకు సంరక్షించబడింది.
