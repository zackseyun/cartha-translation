id: ROM.7.7
reference: Romans 7:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: te
  text: అయితే మనం ఏమని చెప్పాలి? ధర్మశాస్త్రం పాపమా? ఎంతమాత్రమూ కాదు! కానీ ధర్మశాస్త్రం ద్వారా తప్ప పాపం గురించి నాకు తెలిసేది కాదు. ఎందుకంటే, “నీవు దురాశపడకూడదు” అని ధర్మశాస్త్రం చెప్పి ఉండకపోతే, దురాశ గురించి నాకు తెలిసేది కాదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: అయితే మనం ఏమని చెప్పాలి?
  rationale: పౌలు వాదనలో ఉపయోగించే అలంకారిక ప్రశ్నా సంధిని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὁ νόμος
  choice: ధర్మశాస్త్రం
  rationale: సందర్భంలో మోషే ధర్మశాస్త్రాన్ని సూచించే పౌలు వాడుకకు స్థిరమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: ἁμαρτία
  choice: పాపం
  rationale: మూలంలోని నామవాచక రూపాన్నీ, ధర్మశాస్త్రాన్ని పాపంతో సమానపరుస్తున్న ప్రశ్న తీవ్రతనూ కాపాడుతుంది.
- source_word: μὴ γένοιτο
  choice: ఎంతమాత్రమూ కాదు!
  rationale: సాధారణ నిరాకరణకన్నా బలమైన పౌలు తిరస్కారాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀλλὰ
  choice: దానికి విరుద్ధంగా
  rationale: ముందటి భావాన్ని కేవలం వ్యతిరేకించడమే కాక సరిదిద్దే బలమైన వాదనాత్మక మలుపును చూపుతుంది.
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: ధర్మశాస్త్రం ద్వారానే తప్ప పాపమంటే ఏమిటో నాకు తెలిసేది కాదు
  rationale: εἰ μὴ యొక్క మినహాయింపు భావాన్నీ, సందర్భంలోని ప్రతికల్పన భావాన్నీ సహజంగా తెలియజేస్తుంది; ‘పాపమంటే ఏమిటో’ అనేది తెలుగులో జ్ఞానార్థాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐπιθυμίαν
  choice: దురాశ
  rationale: వెంటనే ఉటంకించిన ఆజ్ఞ సందర్భంలో నిషిద్ధమైన ఆశ లేదా పరులదాన్ని ఆశించే భావాన్ని సూచిస్తుంది; విస్తృతమైన ‘కోరిక’ కంటే ఇక్కడ ప్రత్యేకార్థం అనుకూలం.
- source_word: οὐκ ᾔδειν
  choice: నాకు తెలిసేది కాదు
  rationale: ముందటి జ్ఞాన క్రియతో తెలుగు సమాంతరతను నిలుపుతూ, గ్రీకులోని భావాన్ని సహజంగా అందిస్తుంది.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: నీవు ఆశించకూడదు
  rationale: రెండవ పురుష ఏకవచన నిషేధాజ్ఞను గౌరవప్రదమైన, ప్రస్తుత ప్రామాణిక తెలుగులో నేరుగా అందిస్తుంది.
theological_decisions:
- issue: ధర్మశాస్త్రం మరియు పాపం మధ్య సంబంధం
  choice: ధర్మశాస్త్రమే పాపమా? ఎంతమాత్రమూ కాదు!
  alternative: ధర్మశాస్త్రం పాపపూరితమైనదా?
  rationale: గ్రీకు విధేయ నామవాచకం ధర్మశాస్త్రాన్ని పాపంతో గుర్తించవచ్చా అని అడుగుతుంది; దానికి కేవలం పాపగుణం ఉందా అని కాదు. అందువల్ల మూలంలోని పదునైన వేదాంత ఉద్వేగం నిలుస్తుంది.
- issue: ἐπιθυμία యొక్క పరిధి
  choice: దురాశ
  alternative: కోరిక
  rationale: ఈ పదానికి విస్తృతంగా ‘కోరిక’ అనే అర్థం ఉండగలిగినా, వెంటనే వచ్చే దశాజ్ఞల ఉటంకణ నిషిద్ధమైన ఆశను సూచిస్తుంది. ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచి మూలార్థ విస్తృతిని కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; పౌలు వాదనలోని ప్రశ్న, బలమైన నిరాకరణ, వ్యతిరేక మలుపు స్పష్టంగా వినిపించేలా గౌరవప్రదమైన సాధారణ భాషను ఉపయోగించాం. ఉటంకించిన ఆజ్ఞకు న్యాయపరమైన నిషేధ బలం నిలిపాం.
