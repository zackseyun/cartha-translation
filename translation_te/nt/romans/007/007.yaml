revisions:
- from: అయితే మనం ఏమని చెప్పాలి? ధర్మశాస్త్రమే పాపమా? ఎంతమాత్రమూ కాదు! దానికి విరుద్ధంగా, ధర్మశాస్త్రం ద్వారానే తప్ప పాపమంటే ఏమిటో నాకు తెలిసేది కాదు. ఎందుకంటే, “నీవు ఆశించకూడదు” అని ధర్మశాస్త్రం చెప్పి ఉండకపోతే, దురాశ[a] అంటే ఏమిటో నాకు తెలిసేది కాదు.
  to: అయితే మనం ఏమని చెప్పాలి? ధర్మశాస్త్రం పాపమా? ఎంతమాత్రమూ కాదు! కానీ ధర్మశాస్త్రం ద్వారా తప్ప పాపం గురించి నాకు తెలిసేది కాదు. ఎందుకంటే, “నీవు దురాశపడకూడదు” అని ధర్మశాస్త్రం చెప్పి ఉండకపోతే, దురాశ గురించి నాకు తెలిసేది కాదు.
  rationale: The revision uses a direct Telugu corrective conjunction for ἀλλά, smooths the exclusive phrase governed by εἰ μὴ, and makes the noun “దురాశ” correspond to the verb in the quoted command. It retains the source's rhetorical questions, emphatic denial, counterfactual presentation, and the lexical-alternative footnote.
