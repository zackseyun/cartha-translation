  rationale: ప్రధాన వచనంలో రెండవ వ్యతిరేక ఉపవాక్యానికి ‘చేస్తోంది’ను చేర్చడం ద్వారా ఆధునిక తెలుగులో వాక్యం పూర్తి, సహజంగా ఉంటుంది. ఇది మూలంలోని ‘నేను కాదు ... నాలో నివసిస్తున్న పాపం’ అనే పదునైన భేదాన్ని, పాపం వ్యక్తీకరణను, మరియు సందర్భం ద్వారా అర్థమయ్యే కార్యాన్ని యథాతథంగా ఉంచుతుంది. పాదటిప్పణి కూడా మూలంలోని కర్త-ఉద్ఘాటనను కాపాడేలా సవరించబడింది.
