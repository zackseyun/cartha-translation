id: ROM.7.17
reference: Romans 7:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: te
  text: కానీ ఇప్పుడు దాన్ని చేసేది ఇక నేను కాదు; నాలో నివసిస్తున్న పాపమే చేస్తోంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: కాని ఇప్పుడు
  rationale: ముందటి వాదనతో ఉన్న తార్కిక వ్యత్యాసాన్ని, ప్రస్తుత నిర్ధారణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὐκέτι
  choice: ఇక ... కాదు
  rationale: మునుపటి స్థితి నుంచి విరమణ లేదా వేరుచేయడాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐγὼ
  choice: నేను
  rationale: గ్రీకులోని స్పష్టమైన, ఉద్ఘాటనగల సర్వనామాన్ని నిలుపుతుంది; 'చేసేది ... నేను కాదు' అనే తెలుగు నిర్మాణం ఆ ఉద్ఘాటనను సహజంగా అందిస్తుంది.
- source_word: κατεργάζομαι
  choice: చేసేది
  rationale: సందర్భంలో ప్రస్తావించిన కార్యాన్ని చేయడం అనే భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: αὐτὸ
  choice: దాన్ని
  rationale: ముందటి సందర్భంలో ప్రస్తావించిన కార్యాన్ని వెనక్కి సూచిస్తుంది.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: నాలో నివసిస్తున్న పాపమే
  rationale: పాపాన్ని వ్యక్తీకరించే పౌలు వాడిన సజీవ రూపకాన్ని, అలాగే గ్రీకు వాక్యంలోని కర్తపై ఉన్న ఉద్ఘాటనను నిలుపుతుంది.
- source_word: οἰκοῦσα
  choice: నివసిస్తున్న
  rationale: '''ఉండడం'' కంటే గ్రీకులోని నివాస రూపకాన్ని స్పష్టంగా, గంభీరంగా కాపాడుతుంది.'
theological_decisions:
- issue: '''నేను'' మరియు ''నాలో నివసిస్తున్న పాపం'' మధ్య పౌలు చేసే భేదం బాధ్యతను తప్పించుకోవడంగా అపార్థం కావచ్చు.'
  choice: వచనంలోని కఠినమైన భేదాన్ని వివరణాత్మక సవరణ లేకుండా నిలుపడం.
  alternative: అంతర్గత సంఘర్షణను వివరించేలా విస్తరించడం లేదా వ్యక్తిగత బాధ్యతను స్పష్టీకరించే పదాలను చేర్చడం.
  rationale: మూల వచనం ఈ భేదాన్ని ఉద్దేశపూర్వకంగా పదునుగా ఉంచుతుంది. దానిలోని ధార్మిక ఉద్రిక్తతను అనువాదం పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు సహజంగా ఉండేలా, అయితే 'నివసిస్తున్న' అనే రూపకాత్మక పదంతో మూలంలోని గంభీరతను నిలిపింది. 'పాపమే'లోని ఉద్ఘాటన గ్రీకు కర్త వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
