revisions:
- from: ఎందుకంటే, మనం శరీర స్వభావంలో ఉన్నప్పుడు[a], ధర్మశాస్త్రం ద్వారా కలిగిన పాపపు వాంఛలు[b] మన అవయవాల్లో[c] పనిచేస్తూ, మరణానికి ఫలాన్ని పండించాయి.
  to: ఎందుకంటే, మనం శరీరంలో ఉన్నప్పుడు[a], ధర్మశాస్త్రం ద్వారా కలిగిన పాపపు వాంఛలు[b] మన అవయవాల్లో[c] పనిచేస్తూ, మరణానికి ఫలాన్ని పండించడానికి ఉండేవి.
