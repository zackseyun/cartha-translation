id: ROM.7.5
reference: Romans 7:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: te
  text: ఎందుకంటే, మనం శరీరంలో ఉన్నప్పుడు[a], ధర్మశాస్త్రం ద్వారా కలిగిన పాపపు వాంఛలు[b] మన అవయవాల్లో[c] పనిచేస్తూ, మరణానికి ఫలాన్ని పండించడానికి ఉండేవి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “శరీరంలో.” సందర్భాన్ని బట్టి ఇది పాపప్రభావిత పాత మానవ స్థితిని కూడా సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “పాపాల వాంఛలు.”
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ “అవయవాలు” అనేది క్రియకు సాధనాలుగా పనిచేసే శరీర భాగాలు లేదా సామర్థ్యాలను సూచిస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ σαρκί
  choice: శరీర స్వభావంలో
  rationale: తెలుగులో కేవలం ‘శరీరంలో’ అంటే భౌతిక దేహంలో ఉన్నామని అపార్థమయ్యే అవకాశం ఉంది. ‘శరీర స్వభావంలో’ అనేది పౌలు ఉద్దేశించిన పాత, పాపప్రభావిత మానవ స్థితిని సూచిస్తూ, ‘శరీరం’ అనే రూపకాన్ని నిలుపుతుంది; ప్రత్యామ్నాయ వివరణను పాదటిప్పణిలో ఇచ్చాం.
- source_word: τὰ παθήματα τῶν ἁμαρτιῶν
  choice: పాపపు వాంఛలు
  rationale: ఇక్కడ παθήματα బాధలను కాక, పాపంతో లక్షణీకరించబడిన కోరికలు లేదా ప్రేరణలను సూచిస్తుంది. ‘పాపపు వాంఛలు’ సహజమైన తెలుగు; గ్రీకు పదబంధపు అక్షరార్థాన్ని పాదటిప్పణిలో నిలిపాం.
- source_word: τὰ διὰ τοῦ νόμου
  choice: ధర్మశాస్త్రం ద్వారా కలిగిన
  rationale: διά యొక్క మాధ్యమ/కారణ సంబంధాన్ని తెలియజేస్తుంది. ‘రెచ్చగొట్టబడిన’ అని చెప్పడం సందర్భానుగుణంగా సాధ్యమైనా, మూలంలో లేని క్రియాభావాన్ని బలంగా చేర్చకుండా ‘కలిగిన’ అని అనువదించాం.
- source_word: ἐνηργεῖτο
  choice: పనిచేస్తూ
  rationale: అసంపూర్ణ భూతకాలంలోని కొనసాగుతున్న క్రియను సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τοῖς μέλεσιν ἡμῶν
  choice: మన అవయవాల్లో
  rationale: μέλη అనే శరీర-రూపకాన్ని నిలుపుతుంది; ఇవి క్రియకు సాధనాలైన శరీర భాగాలు లేదా సామర్థ్యాలని పాదటిప్పణి వివరిస్తుంది.
- source_word: εἰς τὸ καρποφορῆσαι τῷ θανάτῳ
  choice: మరణానికి ఫలాన్ని పండించాయి
  rationale: కార్యఫల రూపకాన్నీ, మరణం వైపు దారితీసే ఫలితాన్నీ నిలుపుతుంది. ప్రధాన క్రియకు సహజమైన తెలుగు వాక్యనిర్మాణం కోసం ‘పండించాయి’ వాడాం.
- source_word: νόμος
  choice: ధర్మశాస్త్రం
  rationale: రోమీయులకు పత్రిక సందర్భంలో νόμοςకు సాధారణంగా వాడే, మోషే ధర్మశాస్త్రాన్ని సూచించగల ప్రామాణిక తెలుగు పదం.
theological_decisions:
- issue: ἐν τῇ σαρκί అనే పదబంధం భౌతిక శరీరాన్నా, పాపప్రభావిత మానవ స్థితినైనా సూచిస్తుందా?
  choice: శరీర స్వభావంలో
  alternative: శరీరంలో; పాప స్వభావంలో; పతనమైన మానవ స్థితిలో
  rationale: ‘శరీరంలో’ అనే అక్షరానువాదం తెలుగులో భౌతిక ఉనికిగా సులభంగా అపార్థమవుతుంది; ‘పాప స్వభావంలో’ అనేది భావాన్ని అతిగా నిర్ణయిస్తుంది. ‘శరీర స్వభావంలో’ పౌలు రూపకాన్నీ దాని నైతిక-మానవస్థితి ఉద్వేగాన్నీ రెండింటినీ సాధ్యమైనంతవరకు కాపాడుతుంది.
- issue: διὰ τοῦ νόμου ధర్మశాస్త్రం పాపపు వాంఛలను సృష్టించిందా, రెచ్చగొట్టిందా, లేక అవి దాని ద్వారా పనిచేశాయా?
  choice: ధర్మశాస్త్రం ద్వారా కలిగిన
  alternative: ధర్మశాస్త్రం ద్వారా రెచ్చగొట్టబడిన; ధర్మశాస్త్రం ద్వారా పనిచేసిన
  rationale: గ్రీకు సంబంధం వాంఛలకు ధర్మశాస్త్రంతో మాధ్యమ/కారణ సంబంధాన్ని చూపుతుంది, కానీ ఖచ్చితమైన ప్రక్రియను స్పష్టంగా నిర్వచించదు. అందువల్ల మరింత నిర్దిష్టమైన ‘రెచ్చగొట్టబడిన’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ధర్మశాస్త్రం,’ ‘అవయవాలు,’ ‘ఫలాన్ని పండించాయి’ అనే పదాలు పౌలు న్యాయశాస్త్ర మరియు శరీర/ఫల రూపకాలను నిలుపుతాయి. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
