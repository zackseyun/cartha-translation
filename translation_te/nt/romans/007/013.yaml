id: ROM.7.13
reference: Romans 7:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: te
  text: అయితే, మంచిదైనదే నాకు మరణంగా మారిందా? ఎంతమాత్రమూ కాదు! కానీ పాపమే, అది పాపమని వెల్లడయ్యేలా, మంచిదైన దాని ద్వారా నాకు మరణాన్ని కలిగించింది; ఆజ్ఞ ద్వారా పాపం మితిమీరి పాపమయమైనదిగా కావడానికి ఇలా జరిగింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: మంచిదైనది
  rationale: నపుంసకలింగ నామవాచకార్థ విశేషణాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తూ, నిర్దిష్టంగా ‘ఆజ్ఞ’ అని ముందుగానే పరిమితం చేయకుండా మూలంలోని సాధారణ భావాన్ని నిలుపుతుంది.
- source_word: ἐμοὶ ἐγένετο θάνατος
  choice: నాకు మరణంగా మారిందా
  rationale: వ్యక్తిగత సంబంధాన్ని సూచించే దత్తి విభక్తినీ, γίνομαι యొక్క ‘మారు/అవు’ భావాన్నీ నిలుపుతుంది.
- source_word: μὴ γένοιτο
  choice: ఎంతమాత్రమూ కాదు!
  rationale: పౌలు ఉపయోగించిన బలమైన నిరాకరణను ఆధునిక, సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ ἁμαρτία
  choice: పాపమే
  rationale: ἀλλά తరువాత ఉన్న వ్యత్యాసాన్నీ, మరణాన్ని కలిగించే కర్త పాపమే అన్న బలాన్నీ ‘ఏ’ నిశ్చయార్థకంతో స్పష్టం చేస్తుంది; పాపం యొక్క వ్యక్తీకరణను కూడా నిలుపుతుంది.
- source_word: ἵνα φανῇ ἁμαρτία
  choice: అది పాపమని వెల్లడయ్యేలా
  rationale: పునరుక్త నామవాచకంలోని విధేయ భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తపరుస్తూ, పాపం నిజ స్వరూపం బయటపడటాన్ని సూచిస్తుంది.
- source_word: διὰ τοῦ ἀγαθοῦ
  choice: మంచిదైన దాని ద్వారా
  rationale: మొదటి పదబంధంతో పదసంబంధాన్ని నిలుపుతూ διά యొక్క సాధనార్థక భావాన్ని తెలియజేస్తుంది.
- source_word: μοι κατεργαζομένη θάνατον
  choice: నాలో మరణాన్ని కలిగించింది
  rationale: κατεργάζομαι యొక్క ఫలితాన్ని ఉత్పత్తి చేయడం అనే భావాన్ని సహజ తెలుగులో ఇస్తుంది; μοι ఇక్కడ వ్యక్తిలో సంభవించిన ఫలితంగా గ్రహించబడింది.
- source_word: καθ’ ὑπερβολὴν ἁμαρτωλὸς
  choice: మితిమీరి పాపమయమైనదిగా
  rationale: పౌలు ఉద్దేశపూర్వకంగా చేసిన ‘పాపం—పాపమయమైనది’ అనే తీవ్ర పునరుక్తిని చెరపకుండా, అధికతను సూచించే నుడికారాన్ని నిలుపుతుంది.
- source_word: διὰ τῆς ἐντολῆς
  choice: ఆజ్ఞ ద్వారా
  rationale: ἐντολήని సందర్భానుగుణంగా ‘ఆజ్ఞ’గా అనువదించి, διά యొక్క సాధనార్థక నిర్మాణాన్ని నిలుపుతుంది.
theological_decisions:
- issue: మంచిదైన ఆజ్ఞకూ మరణానికీ మధ్య సంబంధం
  choice: మరణాన్ని కలిగించే క్రియాశీల కర్తగా పాపాన్నే చూపించి, అది మంచిదైన దాని ద్వారా పనిచేసిందని అనువదించబడింది.
  alternative: ఆజ్ఞే నైతికంగా మరణానికి కారణమైనట్లు వినిపించే విధంగా వాక్యాన్ని సడలించి అనువదించడం.
  rationale: μὴ γένοιτο తరువాతి ἀλλὰ ἡ ἁμαρτία అనే వ్యత్యాసం బాధ్యతను మంచిదైన దానిపై కాక పాపంపై ఉంచుతుంది; అయితే పాపం ఆ మంచిదైన దాని ద్వారా మరణాన్ని కలిగించిందనే ఉద్రిక్తతను అనువాదం అలాగే ఉంచుతుంది.
- issue: రెండు ἵνα ఉపవాక్యాల ఉద్దేశ్య/ఫలిత భావం
  choice: ‘వెల్లడయ్యేలా’ మరియు ‘అయ్యేలా’ అని రెండింటినీ ఉద్దేశ్య-ఫలితానికి తెరచి ఉండే రీతిలో అనువదించబడింది.
  alternative: రెండింటినీ కేవలం దేవుని ముందస్తు ఉద్దేశ్యంగా లేదా కేవలం సంభవించిన ఫలితంగా ఖచ్చితంగా నిర్ణయించడం.
  rationale: గ్రీకు ἵνα ఈ సందర్భంలో ఉద్దేశ్యం మరియు ఫలితం మధ్య సన్నిహిత భావాన్ని మోయగలదు; తెలుగు నిర్మాణం ఆ భావసూక్ష్మతను అనవసరంగా పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని ప్రశ్న, బలమైన నిరాకరణ, పాపం యొక్క వ్యక్తీకరణ, ఉద్దేశపూర్వక పునరుక్తి నిలుపబడ్డాయి. ‘పాపమయమైనది’ కొద్దిగా సాహిత్య ధోరణి కలిగినప్పటికీ καθ’ ὑπερβολὴν ἁμαρτωλὸς యొక్క తీవ్రతను సంక్షిప్తంగా మోస్తుంది.
