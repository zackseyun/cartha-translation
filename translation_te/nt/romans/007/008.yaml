id: ROM.7.8
reference: Romans 7:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: te
  text: అయితే పాపం ఆ ఆజ్ఞ ద్వారా అవకాశాన్ని చేజిక్కించుకొని[a], నాలో అన్నిరకాల దురాశలను[b] పుట్టించింది. ఎందుకంటే ధర్మశాస్త్రం లేకుండా పాపం మృతమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అవకాశాన్ని తీసుకొని.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అన్నిరకాల కోరికలను”; ఈ సందర్భంలో ప్రత్యేకంగా దురాశలను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμήν ... λαβοῦσα
  choice: అవకాశాన్ని చేజిక్కించుకొని
  rationale: ἀφορμήν అనే పదంలోని అనుకూల సందర్భం లేదా ఆరంభ స్థానం అనే భావాన్ని, λαβοῦσα సూచించే చురుకైన స్వాధీనపరచుకోవడంతో కలిపి సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἡ ἁμαρτία
  choice: పాపం
  rationale: గ్రీకు వాక్యంలో పాపం క్రియాశీల శక్తిగా వ్యక్తీకరించబడింది; దానిని వ్యాకరణ కర్తగా ఉంచడం ఆ రూపకాన్ని నిలుపుతుంది.
- source_word: διὰ τῆς ἐντολῆς
  choice: ఆ ఆజ్ఞ ద్వారా
  rationale: ఏకవచన ἐντολῆς ముందటి సందర్భంలో ప్రస్తావించిన నిర్దిష్ట ఆజ్ఞను సూచిస్తుంది; ‘ఆ’ అనేది ఆ సందర్భసంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: κατειργάσατο
  choice: పుట్టించింది
  rationale: ఈ క్రియ ఒక ఫలితాన్ని కలిగించడం లేదా ఉత్పన్నం చేయడం సూచిస్తుంది; ‘పుట్టించింది’ ఆధునిక తెలుగులో సహజంగా, బలంగా ఉంది.
- source_word: πᾶσαν ἐπιθυμίαν
  choice: అన్నిరకాల దురాశలను
  rationale: తక్షణ సందర్భం ఆశించవద్దనే ఆజ్ఞకు సంబంధించినది కాబట్టి ἐπιθυμίαకు ఇక్కడ ‘దురాశ’ సందర్భోచితం; πᾶσαν యొక్క విస్తృతిని ‘అన్నిరకాల’ తెలియజేస్తుంది.
- source_word: χωρὶς ... νόμου
  choice: ధర్మశాస్త్రం లేకుండా
  rationale: నియమానికి వేరుగా లేదా అది లేని స్థితి అనే గ్రీకు భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: νεκρά
  choice: మృతమే
  rationale: ‘నిష్క్రియ’ అని వివరణాత్మకంగా మార్చకుండా, మూలంలోని బలమైన ‘మృతం’ అనే రూపకాన్ని కాపాడుతుంది.
theological_decisions:
- issue: పాపాన్ని వ్యక్తీకరించిన విధానం మరియు ‘మృతం’ అనే రూపకం
  choice: పాపాన్నే చర్య చేసే కర్తగా ఉంచి, νεκράను ‘మృతమే’ అని అనువదించడం
  alternative: పాపాన్ని అమూర్త భావంగా మార్చడం లేదా ‘నిష్క్రియంగా ఉంటుంది’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: గ్రీకు పాఠం పాపాన్ని ఆజ్ఞను ఉపయోగించుకునే క్రియాశీల శక్తిగా చిత్రించి, చివరలో అది ‘మృతం’ అని చెబుతుంది. ఈ ఉద్రిక్తమైన రూపకాన్ని వివరించి పరిష్కరించకుండా యథాతథంగా నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. పౌలు ఉపయోగించిన పాపపు వ్యక్తీకరణను నిలిపి, ‘ఆజ్ఞ’ మరియు ‘ధర్మశాస్త్రం’ మధ్య ఉన్న ఏకవచన/విస్తృత సందర్భభేదాన్ని కాపాడింది. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
