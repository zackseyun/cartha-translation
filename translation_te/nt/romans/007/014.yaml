id: ROM.7.14
reference: Romans 7:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: te
  text: ఎందుకంటే ధర్మశాస్త్రం ఆత్మసంబంధమైనదని మనకు తెలుసు; కాని నేను శరీరసంబంధిని[a], పాపానికి అమ్మబడినవాడిని[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శరీరానికి చెందినవాడిని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘పాపం కింద బానిసగా అమ్మబడినవాడిని,’ అంటే పాపపు అధికారానికి లోబడినవాడిని.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: మనకు తెలుసు
  rationale: పౌలు మరియు పాఠకులు పంచుకునే స్థిరమైన జ్ఞానాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ νόμος
  choice: ధర్మశాస్త్రం
  rationale: రోమీయులకు పత్రిక సందర్భంలో మోషే ధర్మశాస్త్రాన్ని సూచించే సహజమైన తెలుగు బైబిలు పదం; గ్రీకు పదాన్ని అనవసరంగా విస్తరించదు.
- source_word: πνευματικός
  choice: ఆత్మసంబంధమైనది
  rationale: ధర్మశాస్త్రం ఆత్మకు సంబంధించినది లేదా ఆత్మ స్వభావానికి అనుగుణమైనది అనే భావాన్ని ఉంచుతూ, కేవలం ‘ఆధ్యాత్మికమైనది’ అనే అస్పష్టతను తగ్గిస్తుంది.
- source_word: σάρκινός
  choice: శరీరసంబంధిని
  rationale: πνευματικόςతో ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని కాపాడుతుంది; ‘పాపస్వభావం గలవాడిని’ వంటి అధిక వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: πεπραμένος
  choice: అమ్మబడినవాడిని
  rationale: పూర్త భూతకర్మక క్రియారూపం సూచించే, అమ్మబడిన ఫలితస్థితిని నిలుపుతుంది; బానిసత్వ సూచనను పాదసూచికలో స్పష్టం చేస్తుంది.
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: పాపానికి
  rationale: తెలుగులో సహజంగా అమ్మబడిన అధీనస్థితిని తెలియజేస్తుంది; ‘పాపపు అధికారానికి’ అని ప్రధాన వాక్యంలోనే వ్యాఖ్యానించి భావాన్ని పరిమితం చేయదు.
theological_decisions:
- issue: పౌలు ఉపయోగించిన ‘శరీరం’ సంబంధిత భాషను ఎంతవరకు వ్యాఖ్యానించాలి
  choice: ప్రధాన పాఠ్యంలో ‘శరీరసంబంధిని’ అని ఉంచడం
  alternative: పాపస్వభావం గలవాడిని; ఆత్మసంబంధం లేనివాడిని
  rationale: గ్రీకు σάρκινος పదాన్ని, πνευματικόςతో దాని వ్యత్యాసాన్ని కాపాడి, పౌలు మానవ స్వభావం గురించి చెప్పిన మాటను తరువాతి సిద్ధాంత సూత్రీకరణతో నిశ్శబ్దంగా సమానం చేయదు.
- issue: పాపానికి అమ్మబడడం అనే రూపకాన్ని వివరించే స్థాయి
  choice: రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, బానిసత్వం మరియు పాపాధీనతను పాదసూచికలో వివరించడం
  alternative: పాపపు అధికారానికి బానిసగా అమ్మబడినవాడిని
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తతనూ బలమైన రూపకాన్నీ కాపాడుతూ, దాని భావాన్ని పాఠకునికి అందుబాటులో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఆత్మసంబంధమైనది—శరీరసంబంధిని’ అనే మూలపాఠ్య వ్యత్యాసాన్ని స్పష్టంగా నిలిపి, పాపాధీనతను అతిగా వివరణాత్మకం చేయకుండా అనువదించబడింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
