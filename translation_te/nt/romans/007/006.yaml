id: ROM.7.6
reference: Romans 7:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: te
  text: కానీ ఇప్పుడు మనలను బంధించి ఉంచిన దానికి చనిపోయి[a], ధర్మశాస్త్రం నుండి విడుదల పొందాము. అందువల్ల మనం అక్షరపు పాత విధానంలో కాక, ఆత్మ నూతన విధానంలో[b] సేవ చేయగలుగుతాము.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనలను దేనిలో బంధించి ఉంచారో దానిలో చనిపోయి” లేదా “మనలను దేనిచేత బంధించారో దానిచేత చనిపోయి.”
    reason: గ్రీకు ἐν ᾧ κατειχόμεθα నిర్మాణంలో ‘దానిలో’ మరియు సందర్భానుసారంగా ‘దానిచేత’ అనే భావాలు సాధ్యమైనవి.
  - marker: b
    text: లేదా, “ఆత్మ యొక్క నూతన విధానంలో” లేదా “కొత్త ఆత్మతో.”
    reason: πνεύματος పరిశుద్ధాత్మను సూచించవచ్చు; వ్యాకరణపరంగా మానవ ఆత్మ లేదా అంతరంగ స్వభావాన్ని సూచించే అవకాశం కూడా ఉంది.
  - marker: c
    text: “అక్షరపు పాత విధానం”ను “లిఖిత నియమావళి యొక్క పాత విధానం” అని కూడా అనువదించవచ్చు.
    reason: γράμμαకు నేరమైన అర్థం ‘అక్షరం’; ఈ సందర్భంలో అది లిఖిత నియమావళిని సూచించవచ్చు.
lexical_decisions:
- source_word: κατηργήθημεν ἀπὸ τοῦ νόμου
  choice: ధర్మశాస్త్రం నుండి విడుదల పొందాము
  rationale: ఇక్కడ నిష్క్రియారూప క్రియ ధర్మశాస్త్రమే లేకుండా పోయిందని కాక, దాని బంధించే అధికారంతో మనకున్న సంబంధం నుండి విడుదల పొందామని సూచిస్తుంది.
- source_word: ἀποθανόντες ἐν ᾧ κατειχόμεθα
  choice: మనలను బంధించి ఉంచిన దానికి చనిపోయి
  rationale: అసలు వాక్యంలోని కర్త ‘మనం’; చనిపోయింది ధర్మశాస్త్రం కాదు. κατέχω లోని పట్టుకొని ఉంచడం లేదా బంధించడం అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δουλεύειν
  choice: సేవ చేస్తున్నాము
  rationale: క్రియలో దాస్యసేవ భావం ఉన్నప్పటికీ, ఈ వాక్యంలో ప్రధానంగా సేవ చేసే విధానం గురించిన వ్యత్యాసం ఉంది; ‘సేవ చేస్తున్నాము’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: καινότητι πνεύματος
  choice: ఆత్మ యొక్క నూతన విధానంలో
  rationale: తెలుగులో కేవలం ‘నూతనతలో’ అనడం అసహజంగా ఉండవచ్చు; ‘నూతన విధానంలో’ భావాన్ని స్పష్టంగా తెలుపుతూ καινότης–παλαιότης వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: παλαιότητι γράμματος
  choice: అక్షరం యొక్క పాత విధానంలో
  rationale: γράμμα ను నేరుగా ‘అక్షరం’గా ఉంచి, దానికి సంబంధించిన పాత స్థితి లేదా విధానాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: νόμου
  choice: ధర్మశాస్త్రం
  rationale: సందర్భంలో మోషే ధర్మశాస్త్రం ఉద్దేశించబడింది; ఆధునిక తెలుగు బైబిలు వాడుకలో ‘ధర్మశాస్త్రం’ స్పష్టమైన, స్థిరమైన పదం.
theological_decisions:
- issue: చనిపోయింది ధర్మశాస్త్రమా, విశ్వాసులా?
  choice: ‘మనలను బంధించి ఉంచిన దానికి చనిపోయి’—చనిపోయినవారు ‘మనం’.
  alternative: ధర్మశాస్త్రమే మన విషయంలో చనిపోయింది.
  rationale: ἀποθανόντες అనే నామవిభక్తి బహువచన కృదంతం అంతర్లీన కర్త అయిన ‘మనం’ను సూచిస్తుంది. అందువల్ల ధర్మశాస్త్రం చనిపోయిందనే భావాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: πνεύματος పరిశుద్ధాత్మను సూచిస్తుందా, మానవ ఆత్మను సూచిస్తుందా?
  choice: ప్రధాన పాఠ్యంలో ‘ఆత్మ’ను పరిశుద్ధాత్మకు సూచనగా గ్రహించాం.
  alternative: ‘ఆత్మ’ అంటే అంతరంగ స్వభావం లేదా మానవ ఆత్మ కావచ్చు.
  rationale: పౌలు రచనల్లో ‘ఆత్మ–అక్షరం’ వ్యత్యాసం మరియు కొత్త నిబంధన నేపథ్యం పరిశుద్ధాత్మ సూచనకు బలం ఇస్తాయి; అయితే గ్రీకు రూపంలో ఉన్న నిజమైన సందిగ్ధతను పాదసూచికలో నిలిపాం.
- issue: γράμμα ను ‘అక్షరం’గా తీసుకోవాలా, ‘లిఖిత నియమావళి’గా వివరించాలా?
  choice: ‘అక్షరం’
  alternative: ‘లిఖిత నియమావళి’
  rationale: ‘అక్షరం’ అసలు రూపానికి దగ్గరగా ఉండి పౌలు ఉద్దేశపూర్వకంగా వాడిన విరుద్ధ జంటను కాపాడుతుంది; వివరణాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి. ‘నూతనత/పాతత’ అనే కృత్రిమ నామరూపాల బదులు ‘నూతన విధానం/పాత విధానం’ వాడి గ్రీకు సమాంతర వ్యత్యాసాన్ని చదవదగిన రీతిలో నిలిపాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
