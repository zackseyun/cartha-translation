id: ROM.7.21
reference: Romans 7:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: te
  text: కాబట్టి, మేలు చేయాలని కోరుకునే నాకు చెడు నా చెంతనే ఉందనే ఈ నియమాన్ని[a] నేను కనుగొంటున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నియమం’ అని అనువదించిన మూలపదానికి ‘ధర్మశాస్త్రం’ అనే అర్థం కూడా ఉంది; ఈ సందర్భంలో దీనిని ‘సూత్రం’ లేదా ‘విధానం’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: νόμος పదంలో ఉన్న ధర్మశాస్త్రం అనే భావాన్నీ, సందర్భంలో సాధ్యమైన నియంత్రించే సూత్రం లేదా విధానం అనే భావాన్నీ వ్యాఖ్యానాన్ని నిర్ణయించకుండా నిలుపుతుంది.
lexical_decisions:
- source_word: Εὑρίσκω
  choice: నేను … గ్రహిస్తున్నాను
  rationale: వర్తమాన కాలంలోని నిరంతర గుర్తింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘కనుగొంటున్నాను’ కంటే సందర్భానికి అనుగుణంగా ఉంటుంది.
- source_word: ἄρα
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి తీసుకున్న నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: νόμον
  choice: నియమాన్ని
  rationale: νόμος అనే పదం ఇక్కడ ధర్మశాస్త్రాన్ని లేదా పనిచేస్తున్న ఒక సూత్రాన్ని సూచించగల ఉద్రిక్తతను పూర్తిగా తొలగించకుండా, తెలుగు సందర్భంలో సహజంగా ‘నియమం’ అని అనువదించబడింది.
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: మేలు చేయాలని నేను కోరుకున్నప్పుడు
  rationale: గ్రీకు దత్తి నిర్మాణాన్ని తెలుగులో సహజమైన కాలార్థక వాక్యంగా వ్యక్తం చేస్తూ, θέλω లోని సంకల్ప భావాన్ని నిలుపుతుంది.
- source_word: τὸ καλὸν
  choice: మేలు
  rationale: Substantival adjective భావాన్ని సాధారణ పాఠకునికి సహజంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: τὸ κακὸν
  choice: చెడు
  rationale: Substantival adjective ను నైతిక చెడుగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: παράκειται
  choice: నా చెంతనే ఉంది
  rationale: చెడు పక్కనే, తక్షణమే అందుబాటులో ఉన్నట్లు παράκειται సూచించే సమీపత్వ భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: νόμον అనేది మోషే ధర్మశాస్త్రాన్నా, లేక పనిచేస్తున్న నియమం/సూత్రాన్నా సూచిస్తుంది?
  choice: ప్రధాన పాఠ్యంలో ‘నియమం’ అని ఉంచి, మూలపదంలోని ‘ధర్మశాస్త్రం’ భావసాధ్యతను పాదసూచికలో నిలిపాము.
  alternative: ధర్మశాస్త్రం; సూత్రం; క్రమం
  rationale: ఈ సందర్భంలో పౌలు ఒక పనిచేస్తున్న క్రమం లేదా సూత్రాన్ని ఉద్దేశించి ఉండవచ్చు; అయినా νόμος పదానికి ఉన్న ధర్మశాస్త్ర సంబంధ ప్రతిధ్వనిని పూర్తిగా తొలగించకుండా పాదసూచికలో చూపించడం వ్యాఖ్యానాన్ని అతిగా నిర్ణయించకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. గ్రీకు వాక్యంలోని నిర్ధారణ, మేలు చేయాలనే సంకల్పం, చెడు సమీపంలో ఉండటం అనే మూడు అంశాలు స్పష్టంగా నిలిపబడ్డాయి.
