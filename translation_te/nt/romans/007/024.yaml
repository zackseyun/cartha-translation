  - marker: b
    text: లేదా, ‘రక్షిస్తారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: దయనీయమైన
  rationale: తీవ్రమైన దుఃఖం, నిస్సహాయ స్థితిని తెలియజేసే సహజమైన ఆధునిక తెలుగు పదం; పౌలు ఆవేదనతో పలికిన మాటల తీవ్రతను నిలుపుతుంది.
- source_word: ἄνθρωπος
  choice: మనిషిని
  rationale: ఇక్కడ పౌలు తనను తాను సూచిస్తున్నాడు; ‘మనిషి’ మూలపదంలోని మానవ వ్యక్తి భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: τίς
  choice: ఎవరు
  rationale: విడిపించే వ్యక్తిని గురించి అడిగే ప్రశ్న కాబట్టి ‘ఎవరు’ సరళమైన, ఖచ్చితమైన అనువాదం.
- source_word: ῥύσεται
  choice: విడిపిస్తారు
  rationale: ప్రమాదం లేదా బంధిత స్థితి నుంచి బయటకు తేవడం అనే భావాన్ని సందర్భానుగుణంగా వ్యక్తపరుస్తుంది; ‘రక్షిస్తారు’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: ἐκ
  choice: నుండి
  rationale: వేరుచేయడం లేదా ఒక స్థితి నుంచి బయటకు తేవడం అనే భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: σώματος
  choice: శరీరం
  rationale: మూలంలోని స్పష్టమైన శరీర రూపకాన్ని వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: τοῦ θανάτου τούτου
  choice: ఈ మరణపు
  rationale: గ్రీకు పదబంధంలోని మరణంతో శరీరానికి ఉన్న సంబంధాన్నీ, demonstrative భావాన్నీ సంక్షిప్తంగా నిలుపుతుంది; అక్షరార్థ నిర్మాణాన్ని పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: చివరి పదబంధాన్ని అక్షరార్థ నిర్మాణంతో అనువదించాలా, సహజమైన తెలుగు నిర్మాణంతో అనువదించాలా
  choice: ఈ మరణపు శరీరం
  alternative: ఈ మరణానికి చెందిన శరీరం
  rationale: ఎంచుకున్న రూపం పౌలు ఉపయోగించిన శరీరం–మరణం రూపకాన్నీ ఆవేదనభరితమైన ప్రశ్ననూ సహజమైన తెలుగులో నిలుపుతుంది. శరీరం, మరణం మధ్య సంబంధం ఏ విధమైనదో సిద్ధాంతపరంగా మరింత నిర్దిష్టం చేయదు; గ్రీకు నిర్మాణానికి దగ్గరైన రూపాన్ని పాదసూచికలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పౌలు ఆవేదనతో పలికిన ఉద్గారానికి తగిన గంభీరతతో అనువదించబడింది. ‘అయ్యో’ మూలంలోని భావోద్వేగ ఉద్గారాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; పాదసూచిక సూచికలు ప్రధాన వాక్యంలో రెండూ చేర్చబడ్డాయి.
