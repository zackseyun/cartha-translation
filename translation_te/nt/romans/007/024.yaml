  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: te
  text: అయ్యో, నేనెంత దయనీయమైన మనిషిని! ఈ మరణపు శరీరం నుండి నన్నెవరు విడిపిస్తారు?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ మరణానికి చెందిన శరీరం.’
