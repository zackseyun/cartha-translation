source:
  edition: SBLGNT
  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: te
  text: దేవునికి కృతజ్ఞతలు—మన ప్రభువైన యేసు మెస్సీయ ద్వారా! కాబట్టి, నేనే నా మనసుతో దేవుని ధర్మశాస్త్రానికి సేవ చేస్తున్నాను; కాని నా శరీరంతో పాపపు ధర్మశాస్త్రానికి సేవ చేస్తున్నాను.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “శరీరం” అనే మాటను సందర్భానుసారంగా “పాపస్వభావం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “పాపపు ధర్మశాస్త్రం” అనే మాటకు “పాపం పనిచేసే నియమం” అని కూడా అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: దేవునికి కృతజ్ఞతలు
  rationale: దత్తివ విభక్తిలోని ‘దేవునికి’ అనే పదంతో కూడిన ఈ ఆశ్చర్యార్థక ప్రయోగంలో χάρις దైవకృప అనే భావం కంటే కృతజ్ఞత ప్రకటనే సూచిస్తుంది.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: మన ప్రభువైన మెస్సీయ యేసు ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనమార్గాన్ని సూచిస్తుంది కాబట్టి ‘ద్వారా’ అని అనువదించాం. Χριστόςను ఇక్కడ బిరుదుగా ‘మెస్సీయ’ అని ఉంచి, తెలుగులో సహజమైన పదక్రమం కోసం ‘మెస్సీయ యేసు’ అని అమర్చాం.
- source_word: Ἄρα οὖν
  choice: కాబట్టి
  rationale: ఈ రెండు నిర్ధారణాత్మక అవ్యయాలు ముందటి వాదనను సంక్షిప్తంగా ముగించి ఫలితాన్ని సూచిస్తాయి; ఆధునిక తెలుగులో ‘కాబట్టి’ ఆ భావాన్ని సహజంగా అందిస్తుంది.
- source_word: αὐτὸς ἐγώ
  choice: నేనే
  rationale: గ్రీకు పదబంధంలోని వ్యక్తిగత ఉద్ఘాటనను తెలుగు ఉద్ఘాటక ప్రత్యయం ‘ఏ’ స్పష్టంగా, సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: νοῒ
  choice: మనసుతో
  rationale: ఇక్కడ νοῦς దేవుని ధర్మశాస్త్రంతో ఏకీభవించే అంతరంగ అవగాహనా సామర్థ్యాన్ని సూచిస్తుంది; ‘మనసు’ సాధారణ పాఠకులకు సహజమైన సమానార్థకం.
- source_word: δουλεύω
  choice: దాసుడిగా ఉన్నాను
  rationale: ఈ క్రియలో దాసత్వం లేదా లోబాటు అనే బలమైన భావం ఉంది. కేవలం ‘సేవిస్తున్నాను’ కంటే ‘దాసుడిగా ఉన్నాను’ ఆ భావాన్ని, రెండు ధర్మశాస్త్రాలకు సంబంధించిన సమాంతర నిర్మాణాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: νόμῳ θεοῦ
  choice: దేవుని ధర్మశాస్త్రానికి
  rationale: రోమా 7 అంతటా νόμοςకు ఉన్న వాదనాత్మక కొనసాగింపును కాపాడేందుకు ‘ధర్మశాస్త్రం’ వాడాం.
- source_word: σαρκὶ
  choice: శరీరంతో
  rationale: σάρξను ‘పాపస్వభావం’గా వివరణాత్మకంగా మార్చకుండా, మనసు–శరీరం మధ్య పౌలు ఉంచిన ఉద్రిక్తతను కాపాడుతుంది.
- source_word: νόμῳ ἁμαρτίας
  choice: పాపపు ధర్మశాస్త్రానికి
  rationale: νόμος అనే పదాన్ని ముందు భాగంలోలాగే ‘ధర్మశాస్త్రం’గా ఉంచడం ద్వారా ‘దేవుని ధర్మశాస్త్రం’తో ఉద్దేశపూర్వక సమాంతరతను నిలిపాం.
theological_decisions:
- issue: నైతిక భావభారం ఉన్న పౌలు వాడుకలో σάρξ అనువాదం
  choice: శరీరం
  alternative: పాపస్వభావం
  rationale: గ్రీకులో పాపప్రవృత్తిని స్పష్టంగా పేరుపెట్టే పదం కాక σάρξ ఉంది. ‘శరీరం’ మూలపదాన్ని, మనసుతో దాని ఉద్రిక్త సంబంధాన్ని కాపాడుతుంది; ‘పాపస్వభావం’ ప్రధాన పాఠ్యంలోనే ఒక వ్యాఖ్యానాన్ని ఖరారు చేస్తుంది.
- issue: Χριστόςను పేరు భాగంగా లేదా బిరుదుగా చూపడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ Χριστός యొక్క బిరుదు భావాన్ని పాఠకునికి స్పష్టంగా ఉంచేందుకు ‘మెస్సీయ’ ఎంచుకున్నాం; ‘క్రీస్తు’ సంప్రదాయ రూపమైనప్పటికీ ఆధునిక వాడుకలో రెండవ పేరులా అర్థమయ్యే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నేనే’ ద్వారా ఉద్ఘాటనను, పునరుక్తమైన ‘దాసుడిగా ఉన్నాను’ ద్వారా గ్రీకు వాక్యంలోని సమాంతర విరుద్ధతను స్పష్టంగా ఉంచాం. అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉన్నాయి.
