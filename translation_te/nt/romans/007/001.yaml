id: ROM.7.1
reference: Romans 7:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: te
  text: లేదా, సహోదరులారా[a]—ఎందుకంటే నేను ధర్మశాస్త్రం తెలిసినవారితో మాట్లాడుతున్నాను—ఒక వ్యక్తి జీవించి ఉన్నంతకాలం ధర్మశాస్త్రం ఆ వ్యక్తిపై అధికారం చెలాయిస్తుందని[b] మీకు తెలియదా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సహోదరులారా’ అనేది గ్రీకులోని పుంలింగ బహువచన పదమైన ἀδελφοί (అదెల్ఫోయ్)కు అనువాదం; ఈ సందర్భంలో పౌలు ఉద్దేశించినవారిలో స్త్రీలు కూడా ఉన్నారు.
    reason: cultural_note
  - marker: b
    text: లేదా, ‘ఏలుతుందని.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: లేదా
  rationale: ముందటి వాదనతో పౌలు చేస్తున్న అనుసంధానాన్ని ప్రశ్నారూపంలో సహజంగా నిలుపుతుంది.
- source_word: ἀγνοεῖτε
  choice: మీకు తెలియదా?
  rationale: పంచుకున్న జ్ఞానాన్ని గుర్తుచేసే అలంకారిక ప్రశ్న భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: మూలంలోని పుంలింగ బహువచన సంబోధనను నిలుపుతూ, సందర్భంలోని సమగ్ర ప్రయోగాన్ని పాదటిప్పణిలో వివరిస్తుంది.
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: ధర్మశాస్త్రం తెలిసినవారితోనే నేను మాట్లాడుతున్నాను
  rationale: γάρ ఇచ్చే వివరణాత్మక, కుండలీకరణ భావాన్ని స్పష్టంగా ఉంచుతుంది; ‘నే’ సందర్భానుసారంగా ఎవరిని ఉద్దేశిస్తున్నాడో నొక్కిచెబుతుంది.
- source_word: νόμον / ὁ νόμος
  choice: ధర్మశాస్త్రం
  rationale: పౌలు వాడిన νόμος పదాన్ని రెండు చోట్ల ఒకే విధంగా అనువదిస్తుంది. సమీప సందర్భంలో మోషే ధర్మశాస్త్రం ప్రధానంగా దృష్టిలో ఉన్నప్పటికీ, వాక్యాన్ని ‘మోషే ధర్మశాస్త్రం’ అని మరింత నిర్దిష్టం చేయదు.
- source_word: κυριεύει
  choice: అధికారం చెలాయిస్తుంది
  rationale: ఏలుబడి లేదా ఆధిపత్యం కలిగి ఉండే భావాన్ని గౌరవప్రదమైన, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τοῦ ἀνθρώπου
  choice: ఒక వ్యక్తి … అతనిపై
  rationale: ἄνθρωπος ఇక్కడ పురుషునికి మాత్రమే పరిమితం కాకుండా సాధారణ మానవ వ్యక్తిని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణం కోసం ఏకవచన సర్వనామం కొనసాగించబడింది.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: జీవించి ఉన్నంతకాలం
  rationale: కాల పరిమితిని తెలిపే గ్రీకు నుడికారాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: νόμος యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘ధర్మశాస్త్రం’ అని మాత్రమే అనువదించడం
  alternative: ‘మోషే ధర్మశాస్త్రం’ అని నిర్దిష్టంగా చెప్పడం; లేదా సాధారణంగా ‘చట్టం’ అని అనువదించడం
  rationale: సమీప వాదనలో మోషే ధర్మశాస్త్రం దృష్టిలో ఉన్నప్పటికీ, గ్రీకు పదప్రయోగం న్యాయాధికారానికి సంబంధించిన సాధారణ సూత్రాన్ని కూడా వినిపిస్తుంది. అందువల్ల అనువాదం ఆ పరిధిని సిద్ధాంతపరంగా మరింత కుదించదు.
- issue: κυριεύει లోని ఆధిపత్య భావం
  choice: ‘అధికారం చెలాయిస్తుంది’
  alternative: ‘ఏలుతుంది’
  rationale: రెండు అనువాదాలూ సాధ్యమే. ప్రధాన పాఠ్యం న్యాయపరమైన అధికార భావాన్ని సహజంగా తెలుపుతుంది; ప్రత్యామ్నాయంలోని బలమైన ఏలుబడి భావాన్ని పాదటిప్పణి నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. వివరణాత్మక మధ్యవాక్యాన్ని దీర్ఘ గీతలతో వేరు చేసి పౌలు వాదన ప్రవాహాన్ని నిలుపుకుంది.
