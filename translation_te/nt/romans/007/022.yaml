    reason: lexical_alternative
lexical_decisions:
- source_word: συνήδομαι
  choice: ఆనందిస్తున్నాను
  rationale: ఈ క్రియ కేవలం మేధాపరమైన సమ్మతిని కాక, సంతోషంతో కూడిన అంగీకారాన్ని సూచిస్తుంది. ‘ఆనందిస్తున్నాను’ ఆ భావోద్వేగ బలాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τῷ νόμῳ τοῦ θεοῦ
  choice: దేవుని ధర్మశాస్త్రంలో
  rationale: దత్తి విభక్తితో ఉన్న క్రియకు తెలుగులో ‘లో ఆనందించు’ సహజంగా సరిపోతుంది. νόμος అనే పౌలు వాడుకలోని బలమైన భావాన్ని ‘ధర్మశాస్త్రం’ నిలుపుతుంది.
- source_word: κατὰ τὸν ἔσω ἄνθρωπον
  choice: నా అంతరంగ మనిషిని బట్టి
  rationale: κατά యొక్క ‘ప్రకారం/దృష్ట్యా’ భావాన్ని ‘బట్టి’ వ్యక్తం చేస్తుంది; ‘అంతరంగ మనిషి’ పౌలు ఉపయోగించిన రూపకాన్ని నిలుపుతుంది. గ్రీకులో ‘నా’ ప్రత్యక్షంగా లేకపోయినా, మొదటి పురుష సందర్భంలో అది తెలుగులో సంబంధాన్ని సహజంగా స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ‘అంతరంగ మనిషి’ అనే మానవశాస్త్ర సంబంధమైన రూపకం
  choice: నా అంతరంగ మనిషిని బట్టి
  alternative: నా అంతరంగ స్వరూపాన్ని బట్టి; నా అంతరంగ అస్తిత్వాన్ని బట్టి
  rationale: మూలంలోని రూపకాన్ని ప్రధాన పాఠ్యంలో నిలిపి, దానిని ఆత్మ, మనస్సు లేదా ఒక నిర్దిష్ట మానవ నిర్మాణ సిద్ధాంతంగా పరిమితం చేయలేదు. అర్థస్పష్టత కోసం ప్రత్యామ్నాయాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా అనువదించబడింది. ‘ధర్మశాస్త్రం’ రోమీయులకు పత్రికలో νόμος పదానికి ఉన్న స్థిరమైన పౌలు సంబంధిత బరువును నిలుపుతుంది; ‘అంతరంగ మనిషి’ మూల రూపకాన్ని ఉద్దేశపూర్వకంగా కాపాడుతుంది.
