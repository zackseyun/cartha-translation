id: ROM.7.18
reference: Romans 7:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: te
  text: ఎందుకంటే నాలో, అంటే నా శరీరంలో[a], మంచిదేదీ నివసించదని నాకు తెలుసు. మంచిని చేయాలనే సంకల్పం నాకు ఉంది, కానీ మంచిని చేయడం మాత్రం లేదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నా పాప స్వభావంలో.”
    reason: σάρξకు సందర్భానుసారంగా ఇచ్చే వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాన్ని సూచిస్తుంది; ప్రధాన పాఠంలో మూలపదానికి సమీపమైన ‘శరీరం’ను నిలుపుతుంది.
lexical_decisions:
- source_word: οἶδα
  choice: నాకు తెలుసు
  rationale: పరిపూర్ణ రూపంలో ఉన్నప్పటికీ ఇక్కడ వర్తమానార్థం ఉంది; సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: οἰκεῖ
  choice: నివసించదు
  rationale: పౌలు వాడిన అంతర్నివాస రూపకాన్ని నిలుపుతుంది.
- source_word: ἀγαθόν
  choice: మంచిదేదీ
  rationale: οὐκ తో కూడిన విశేషణాత్మక నామప్రయోగాన్ని తెలుగులో సహజంగా సంపూర్ణ నిరాకరణగా వ్యక్తపరుస్తుంది.
- source_word: σάρξ
  choice: శరీర స్వభావం
  rationale: కేవలం భౌతిక శరీరం అనే అపార్థాన్ని తగ్గిస్తూ, పౌలు వాడిన σάρξ పదంలోని శరీర సంబంధ రూపకాన్నీ నైతిక ఉద్వేగాన్నీ నిలుపుతుంది; వ్యాఖ్యానాత్మక ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: θέλειν
  choice: చేయాలనే సంకల్పం
  rationale: ఆర్టికల్‌తో ఉన్న infinitive యొక్క నామవాచక భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: παράκειταί μοι
  choice: నాలో ఉంది
  rationale: సంకల్పం తనకు అందుబాటులో లేదా సమీపంలో ఉందనే భావాన్ని సంక్షిప్త సహజ తెలుగులో ఇస్తుంది.
- source_word: κατεργάζεσθαι
  choice: దాన్ని చేయడం
  rationale: ముందున్న ‘సంకల్పం’తో క్రియాత్మక వ్యత్యాసాన్ని స్పష్టంగా ఉంచి, గ్రీకు నామవాచక infinitive భావాన్ని కాపాడుతుంది.
- source_word: τὸ καλόν
  choice: మంచి
  rationale: నైతికంగా మంచిదైనదాన్ని సూచించే substantival adjective‌కు సహజ సమానం.
- source_word: οὔ
  choice: లేదు
  rationale: గ్రీకులోని సంక్షిప్త ellipsis‌ను తెలుగులో అవసరమైన కనిష్ఠ పూరణతో నిలుపుతుంది.
theological_decisions:
- issue: నైతిక సందర్భంలో σάρξ అనువాదం
  choice: శరీర స్వభావం
  alternative: పాప స్వభావం
  rationale: ‘పాప స్వభావం’ అని మూలపాఠంలో లేని ‘పాప’ భావాన్ని నేరుగా చేర్చి వ్యాఖ్యానాన్ని ఖరారు చేయకుండా, σάρξ యొక్క శరీర సంబంధ పదచిత్రాన్నీ పౌలు ఉద్దేశించిన నైతిక ఉద్వేగాన్నీ సాధ్యమైనంతవరకు నిలుపుతుంది.
- issue: ‘నాలో’ మరియు ‘నా σάρξలో’ మధ్య వివరణాత్మక సంబంధం
  choice: నాలో, అంటే నా శరీర స్వభావంలో
  alternative: నాలో—అనగా నా పాప స్వభావంలో
  rationale: τοῦτ’ ἔστιν అనే స్పష్టీకరణను యథాతథంగా ఉంచి, ‘నేను’ మొత్తాన్ని నిర్బంధం లేకుండా ‘శరీర స్వభావం’తో సమానీకరించకుండా పౌలు పెట్టిన పరిమితిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. ‘నివసించదు’ ద్వారా అంతర్నివాస రూపకం నిలుపబడింది; రెండో వాక్యంలో తెలుగు సహజత్వం కోసం ‘మంచి చేయాలనే సంకల్పం’ మరియు ‘దాన్ని చేయడం’ అనే సమాంతర నిర్మాణం వాడబడింది.
