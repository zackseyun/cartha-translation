id: ROM.7.19
reference: Romans 7:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν, ἀλλὰ ὃ οὐ θέλω κακὸν τοῦτο πράσσω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: te
  text: ఎందుకంటే, నేను కోరుకునే మంచిని చేయను[a]; కానీ నేను కోరుకోని ఆ చెడునే ఆచరిస్తాను[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘చేయను’కు బదులుగా ‘నెరవేర్చను’ అని కూడా అనువదించవచ్చు. గ్రీకులో ఇక్కడ ποιῶ అనే క్రియను, వాక్యం చివర వేరొక క్రియను వాడారు.
    reason: lexical_alternative
  - marker: b
    text: ‘ఆచరిస్తాను’కు బదులుగా ‘చేస్తాను’ అని కూడా అనువదించవచ్చు. గ్రీకులోని πράσσω, ποιῶ క్రియల అర్థాలు చాలావరకు కలిసివుంటాయి.
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: కోరుకునే / కోరుకోని
  rationale: సందర్భంలోని సంకల్పం లేదా కోరికను ఆధునిక సహజ తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ‘ఇష్టపడే’ కంటే నైతిక సంకల్పభావాన్ని మెరుగ్గా నిలుపుతుంది.
- source_word: ποιῶ
  choice: చేయడం
  rationale: సాధారణమైన, విస్తృతార్థకమైన తెలుగు క్రియ; తరువాతి πράσσωతో స్వల్ప పదభేదాన్ని ఉంచుతుంది.
- source_word: ἀγαθόν
  choice: మంచిని
  rationale: κακόνతో ఉన్న ప్రత్యక్ష నైతిక విరుద్ధతను సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: κακὸν
  choice: చెడును
  rationale: ‘మంచి’కి సమాంతరమైన బలమైన నైతిక వర్గాన్ని కాపాడుతుంది; కేవలం తప్పు లేదా అననుకూలమైన పని అనే స్థాయికి భావాన్ని తగ్గించదు.
- source_word: πράσσω
  choice: ఆచరిస్తున్నాను
  rationale: ποιῶకు భిన్నమైన తెలుగు పదాన్ని వాడుతూ, కార్యరూపంలో చేయడం అనే భావాన్ని అందిస్తుంది; మూలంలోని రెండు క్రియల అర్థపరిధులు కొంత కలిసివున్నాయని పాదసూచన తెలియజేస్తుంది.
- source_word: τοῦτο
  choice: -నే
  rationale: తెలుగులో ‘చెడునే’ అనే ఉద్ఘాటక రూపం τοῦτο యొక్క ‘దీనినే’ అనే బలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ γὰρ
  choice: ఎందుకంటే ... లేదు
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో నిలుపుతూ, οὐను సహజ తెలుగు నిరాకరణగా అందిస్తుంది.
theological_decisions:
- issue: పౌలు చెప్పిన నైతిక విరుద్ధతను మృదువైన భాషలోకి మార్చాలా?
  choice: ‘మంచి’ / ‘చెడు’ అనే ప్రత్యక్ష నైతిక వర్గాలను నిలుపడం.
  alternative: ‘సరైనది’ / ‘తప్పైనది’ లేదా ‘మంచి పని’ / ‘చెడ్డ పని’.
  rationale: ἀγαθόν మరియు κακόν ఇక్కడ బలమైన నైతిక విరుద్ధతను సూచిస్తాయి. పౌలు అంతరంగ సంకల్పానికి, కార్యాచరణకు మధ్య ఉంచిన ఉద్రిక్తతను బలహీనపరచకుండా అనువదించాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘మంచిని/చెడును’ అనే సమాంతర పదాలతో మూలంలోని నైతిక విరుద్ధతను, ‘చెడునే’ అనే ఉద్ఘాటనతో τοῦτο బలాన్ని నిలిపింది. రెండు గ్రీకు క్రియల మధ్య ఉన్న పరిమిత భేదాన్ని ప్రధాన పాఠ్యంలో చూపించి, పాదసూచనల్లో అతిశయింపకుండా వివరించింది.
