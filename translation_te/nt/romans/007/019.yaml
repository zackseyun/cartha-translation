- from: ఎందుకంటే, నేను కోరుకునే మంచిని చేయడం లేదు[a]; కానీ నేను కోరుకోని చెడునే ఆచరిస్తున్నాను[b].
  to: ఎందుకంటే, నేను కోరుకునే మంచిని చేయను[a]; కానీ నేను కోరుకోని ఆ చెడునే ఆచరిస్తాను[b].
  rationale: General/habitual Telugu present forms better reflect the Greek present in context. Adding ‘ఆ’ with -నే represents the demonstrative and emphatic force of τοῦτο naturally, while preserving the draft’s lexical distinction and moral contrast.
