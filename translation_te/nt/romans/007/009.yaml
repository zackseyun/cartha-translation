id: ROM.7.9
reference: Romans 7:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: te
  text: నేను ఒకప్పుడు ధర్మశాస్త్రం లేకుండా సజీవంగా ఉన్నాను; అయితే ఆజ్ఞ వచ్చినప్పుడు పాపం జీవం పొందింది[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాపం మళ్లీ జీవించింది.”
    reason: ἀνέζησεν అనే పదానికి ‘జీవం పొందింది’తో పాటు ‘మళ్లీ జీవించింది’ అనే భావం కూడా సాధ్యమని చూపే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: ἔζων
  choice: సజీవంగా ఉన్నాను
  rationale: తర్వాతి వచనాల్లో వచ్చే జీవం–మరణం వ్యత్యాసాన్ని నిలుపుతూ, కేవలం ‘జీవించాను’ అన్నదానికంటే స్థితిని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: χωρὶς νόμου
  choice: ధర్మశాస్త్రానికి వేరుగా
  rationale: χωρίς లోని వేరుపాటు భావాన్ని నిలుపుతుంది; νόμος ఇక్కడ పౌలు వాడుకలో ధర్మశాస్త్రాన్ని సూచించే అవకాశం ఉన్నప్పటికీ, దాని పరిధిని మరింతగా వ్యాఖ్యానించదు.
- source_word: ποτέ
  choice: ఒకప్పుడు
  rationale: గతంలోని ఒక కాలాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: ఆజ్ఞ వచ్చినప్పుడు
  rationale: గ్రీకు genitive absolute నిర్మాణాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా మార్చి, ఆజ్ఞ రావడాన్ని ఒక సంఘటనగా నిలుపుతుంది.
- source_word: ἐντολῆς
  choice: ఆజ్ఞ
  rationale: νόμοςతో సంబంధాన్ని నిలుపుతూ, బైబిలు సందర్భానికి తగిన స్పష్టమైన పదం.
- source_word: ἁμαρτία
  choice: పాపం
  rationale: ఏకవచనాన్ని, పాపాన్ని వ్యక్తీకరించి చెప్పే పౌలు ప్రయోగాన్ని నిలుపుతుంది.
- source_word: ἀνέζησεν
  choice: జీవం పొందింది
  rationale: వ్యక్తీకరించబడిన పాపం జీవంలోకి వచ్చినట్లు చూపే రూపకాన్ని సహజంగా అందిస్తుంది; ‘మళ్లీ జీవించింది’ అనే అర్థం కూడా సాధ్యమే.
theological_decisions:
- issue: పౌలు మాటను స్వీయచరిత్రగా, ప్రతినిధి అనుభవంగా, లేదా రక్షణచరిత్రగా స్పష్టీకరించాలా?
  choice: మొదటి పురుష ఏకవచనాన్ని ఎలాంటి వివరణాత్మక విస్తరణ లేకుండా నిలుపడం.
  alternative: దీనిని పౌలు వ్యక్తిగత అనుభవంగా మాత్రమే లేదా ఇశ్రాయేలు/మానవాళి ప్రతినిధి అనుభవంగా స్పష్టంగా పేర్కొనడం.
  rationale: ఈ ఒక్క వచనంలోని గ్రీకు వాక్యం విస్తృత వ్యాఖ్యాన సమస్యను తేల్చదు; అందువల్ల అనువాదం ఆ ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. ‘సజీవంగా ఉన్నాను’ మరియు ‘జీవం పొందింది’ అనే జత ద్వారా మూలంలోని జీవం–మరణం వ్యత్యాసం, పాపం యొక్క వ్యక్తీకరణ నిలుపబడ్డాయి. గ్రీకు వాక్యం తదుపరి భాగానికి కొనసాగుతున్నందున చివర కామా ఉంచబడింది; పాదసూచిక గుర్తు అది వివరిస్తున్న ‘జీవం పొందింది’ తర్వాత ఉంచబడింది.
