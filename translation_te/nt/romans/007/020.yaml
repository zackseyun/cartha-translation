id: ROM.7.20
reference: Romans 7:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: te
  text: అయితే నేను కోరనిదాన్ని చేస్తే, దాన్ని చేసేది ఇక నేను కాదు; నాలో నివసిస్తున్న పాపమే దాన్ని చేసేది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: అయితే
  rationale: మునుపటి వాదనను షరతుతో కొనసాగిస్తూ స్వల్ప వ్యత్యాసాన్ని సూచించే సహజమైన తెలుగు అనుసంధానం.
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: నేను కోరనిదాన్ని చేస్తే
  rationale: గ్రీకులోని ‘నేను కోరనిదాన్ని—దానినే చేస్తున్నాను’ అనే సంబంధాన్ని ఆధునిక తెలుగులో సహజంగా, సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτό
  choice: దాన్ని చేసేది ఇక నేను కాదు
  rationale: οὐκέτι యొక్క ‘ఇక కాదు’ భావాన్ని, ప్రత్యేకంగా ఉంచిన ἐγώ యొక్క వ్యక్తిగత ఉద్ఘాటనను నిలుపుతుంది. κατεργάζομαι ను సందర్భానుసారంగా సహజమైన ‘చేసేది’ అని అనువదించింది.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: నాలో నివసిస్తున్న పాపమే
  rationale: ‘నివసిస్తున్న’ అనే రూపం οἰκοῦσα యొక్క కొనసాగుతున్న అంతర్నివాస భావాన్ని నిలుపుతుంది; ‘పాపమే’ అనే ఉద్ఘాటన ‘నేను కాదు—పాపం’ అనే వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ‘నేను’ మరియు ‘నాలో నివసిస్తున్న పాపం’ మధ్య పౌలు చేసిన భేదం వ్యక్తిగత బాధ్యతను తగ్గించేలా వివరించాలా?
  choice: మూలంలోని ఉద్వేగభరితమైన భేదాన్ని వివరణ జోడించకుండా యథాతథంగా నిలుపడం.
  alternative: దీనిని ‘నా పాపస్వభావం’ అని మార్చడం లేదా వ్యక్తిగత బాధ్యత గురించి వ్యాఖ్యానాన్ని వాక్యంలో చేర్చడం.
  rationale: గ్రీకు పాఠం నేరుగా ἁμαρτία (‘పాపం’) అని చెబుతుంది; σάρξ (‘శరీరం/మాంసం’) లేదా ‘పాపస్వభావం’ అని కాదు. కాబట్టి పౌలు మాటలలోని ధార్మిక ఉద్రిక్తతను అనువాదం పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైనప్పటికీ గంభీరమైన శైలి. విరామచిహ్నంలోని అర్ధవిరామం ‘నేను కాదు’ మరియు ‘పాపమే’ మధ్య ఉన్న ప్రధాన వ్యత్యాసాన్ని చూపిస్తుంది.
