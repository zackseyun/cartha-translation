id: ROM.7.2
reference: Romans 7:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: te
  text: ఎందుకంటే, వివాహిత స్త్రీ తన భర్త బ్రతికి ఉన్నంతకాలం చట్టం ప్రకారం అతనికి బద్ధురాలై ఉంటుంది; అయితే భర్త చనిపోతే, ఆమె భర్తకు సంబంధించిన చట్టం నుంచి విడుదలైంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తన భర్త యొక్క చట్టం నుంచి విముక్తురాలైంది.” గ్రీకు పదబంధం అక్షరార్థంగా ‘భర్త యొక్క చట్టం’ అని ఉంది; సందర్భంలో అది ఆమెను భర్తతో కట్టిపెట్టిన చట్టబంధాన్ని సూచించే అవకాశం ఎక్కువ.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: వివాహిత స్త్రీ
  rationale: ఈ పదబంధం వివాహబంధంలో ఉన్న స్త్రీని సూచిస్తుంది. ‘వివాహిత స్త్రీ’ ఆధునిక తెలుగులో సహజంగా ఉండి, న్యాయపరమైన వివాహబంధ భావాన్ని నిలుపుతుంది.
- source_word: τῷ ζῶντι ἀνδρί
  choice: తన భర్త బ్రతికి ఉన్నంతకాలం అతనికి
  rationale: భర్త జీవించి ఉన్న కాలమంతా బంధం కొనసాగుతుందనే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; సందర్భంలో అంతర్లీనంగా ఉన్న సంబంధాన్ని ‘తన’ స్పష్టం చేస్తుంది.
- source_word: δέδεται
  choice: బద్ధురాలై ఉంటుంది
  rationale: గ్రీకు పరిపూర్ణ కర్మణి రూపం, గతంలో ఏర్పడిన బంధం ప్రస్తుతం కొనసాగుతున్న స్థితిని సూచిస్తుంది. ఈ తెలుగు రూపం ఆ కొనసాగుతున్న స్థితిని తెలియజేస్తుంది.
- source_word: νόμῳ
  choice: చట్టం ప్రకారం
  rationale: ఇక్కడ అనిర్దిష్టంగా ఉన్న νόμῳ సాధారణ న్యాయసూత్రాన్ని లేదా వివాహానికి సంబంధించిన చట్టబద్ధతను సూచిస్తుంది; ప్రత్యేకంగా మోషే ధర్మశాస్త్రమనే భావాన్ని అనవసరంగా చేర్చదు.
- source_word: κατήργηται
  choice: విడుదల పొందుతుంది
  rationale: ఈ సందర్భంలో చట్టబద్ధమైన అధికారం లేదా బాధ్యత నుంచి విడిపోవడాన్ని సూచిస్తుంది; ‘రద్దు చేయబడుతుంది’ కంటే వ్యక్తికి వర్తించే విడుదల భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: భర్తకు సంబంధించిన చట్టం నుంచి
  rationale: సంక్షిప్తమైన గ్రీకు షష్ఠీ విభక్తి నిర్మాణాన్ని, భర్తే చట్టం చేసినవాడని సూచించకుండా, అతనితో ఆమెను బంధించిన చట్టపరమైన సంబంధంగా తెలియజేస్తుంది.
theological_decisions:
- issue: νόμῳ / τοῦ νόμου అనేది ప్రత్యేకంగా మోషే ధర్మశాస్త్రాన్నా, లేక వివాహానికి సంబంధించిన సాధారణ చట్టబంధాన్నా సూచిస్తుంది?
  choice: వివాహానికి సంబంధించిన సాధారణ చట్టబంధం
  alternative: వివాహానికి వర్తించే మోషే ధర్మశాస్త్రం
  rationale: తక్షణ సందర్భం వివాహబంధాన్ని ఉదాహరణగా ఉపయోగిస్తుంది; మొదటి νόμῳకు ఉపపదం లేకపోవడం కూడా సాధారణ న్యాయసూత్ర భావానికి అనుకూలంగా ఉంది. అందువల్ల ‘చట్టం’ అని అనువదించడం, నిర్దిష్టంగా మోషే ధర్మశాస్త్రాన్ని ప్రవేశపెట్టకుండా సందర్భంలోని ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ధర్మశాస్త్రం’కు బదులు ‘చట్టం’ ఎంచుకోవడం ద్వారా ఈ వాక్యంలో సాధారణ వివాహ చట్టబంధ భావాన్ని కాపాడాం; ‘బద్ధురాలై ఉంటుంది’ అనే రూపం కొనసాగుతున్న బంధస్థితిని స్పష్టం చేస్తుంది.
