id: ROM.7.12
reference: Romans 7:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε ὁ μὲν νόμος ἅγιος, καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: te
  text: కాబట్టి ధర్మశాస్త్రం పవిత్రమైనది; ఆజ్ఞ కూడా పవిత్రమైనది, నీతియుక్తమైనది, మంచిది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి వాదననుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: νόμος
  choice: ధర్మశాస్త్రం
  rationale: రోమీయులకు పత్రిక సందర్భంలో మోషే ధర్మశాస్త్రాన్ని సూచించే స్థిరమైన తెలుగు బైబిలు పదం; అయితే వాక్యంలో లేనంత వివరణను జోడించదు.
- source_word: ἅγιος / ἁγία
  choice: పవిత్రమైనది
  rationale: ప్రత్యేకపరచబడిన స్థితినీ నైతిక పవిత్రతనూ సహజంగా మోసే ప్రామాణిక తెలుగు పదం.
- source_word: ἐντολή
  choice: ఆ ఆజ్ఞ
  rationale: ధర్మశాస్త్రంలోని నిర్దిష్ట ఆజ్ఞను సూచించే గ్రీకు నిర్దిష్ట ఉపపదాన్ని ‘ఆ’ ద్వారా నిలుపుతుంది.
- source_word: δικαία
  choice: నీతియుక్తమైనది
  rationale: ఆజ్ఞ న్యాయమైనదీ నైతికంగా సరైనదీ అనే భావాన్ని వ్యక్తపరుస్తుంది; పౌలు వాడే నీతి సంబంధ పదజాలంతో అనుబంధాన్ని కాపాడుతుంది.
- source_word: ἀγαθή
  choice: మంచిది
  rationale: నైతిక మంచితనంతో పాటు మేలు చేసే స్వభావానికీ అవకాశం ఉంచే సరళమైన అనువాదం.
- source_word: μὲν
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ తరువాత ప్రత్యక్ష δέ విరోధం లేదు; వాక్య నిర్మాణం మరియు ‘కూడా’ ద్వారా స్వల్ప ఉద్ఘాటన సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: νόμος అనే పదం యొక్క సూచన
  choice: ధర్మశాస్త్రం
  alternative: మోషే ధర్మశాస్త్రం
  rationale: సందర్భం మోషే ధర్మశాస్త్రాన్ని సూచించినప్పటికీ, మూల వాక్యంలో ఉన్నదానికంటే అధికంగా నిర్దిష్టీకరించకుండా పౌలు మాటను కాపాడుతుంది.
- issue: δικαία యొక్క నైతిక-న్యాయ భావ పరిధి
  choice: నీతియుక్తమైనది
  alternative: న్యాయమైనది
  rationale: ఆజ్ఞ యొక్క నైతిక సద్రూపతను ముందుంచుతూ, దాని న్యాయసమ్మత భావాన్ని పూర్తిగా నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగా, అయితే బైబిలు వచనానికి తగిన గౌరవప్రదమైన శైలిలో రూపొందించబడింది. మూడు విశేషణాల సమాంతర నిర్మాణం నిలుపబడింది.
