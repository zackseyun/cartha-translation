id: ROM.7.10
reference: Romans 7:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπέθανον, καὶ εὑρέθη μοι ἡ ἐντολὴ ἡ εἰς ζωὴν αὕτη εἰς θάνατον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: te
  text: నేను చనిపోయాను; జీవానికి ఉద్దేశించబడిన ఈ ఆజ్ఞే నాకు మరణానికి దారితీసేదిగా తేలింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέθανον
  choice: నేను చనిపోయాను
  rationale: ప్రథమ పురుష ఏకవచన ఏరిస్ట్ క్రియను, ప్రక్రియగా కాక జరిగిన ఫలితంగా, సరళమైన భూతకాలంలో అందిస్తుంది.
- source_word: εὑρέθη μοι
  choice: నాకు ... దారితీసేదిగా తేలింది
  rationale: గ్రీకు కర్మణి రూపం మరియు μοι అనే దత్తివిభక్తి కలిగించే అనుభవపూర్వకంగా తెలిసిన భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐντολή
  choice: ఆజ్ఞ
  rationale: ఏకవచన నామవాచకాన్ని నేరుగా అందిస్తూ, మూలంలో లేని ‘ధర్మశాస్త్రపు’ వంటి అదనపు పదాన్ని చేర్చదు.
- source_word: ἡ εἰς ζωὴν
  choice: జీవానికి ఉద్దేశించబడిన
  rationale: εἰς ζωὴνలోని దిశ లేదా ఉద్దేశిత ఫలిత భావాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది; ఆజ్ఞ స్వయంగా జీవాన్ని కలిగించిందని అతిగా నిర్ధారించదు.
- source_word: αὕτη
  choice: ఆ ... ఆజ్ఞే
  rationale: సూచనార్థకమైన αὕτη పదంలోని నొక్కిచెప్పే భావాన్ని తెలుగు ‘ఆజ్ఞే’ సహజంగా నిలుపుతుంది.
- source_word: εἰς θάνατον
  choice: మరణానికి దారితీసేదిగా
  rationale: రెండవ εἰς పదబంధంలోని ఫలిత దిశను సహజంగా తెలియజేస్తూ, ‘జీవానికి—మరణానికి’ అనే వ్యతిరేకతను నిలుపుతుంది.
theological_decisions:
- issue: ఆజ్ఞ మరణాన్ని ‘కలిగించింది’ అని కారణ సంబంధాన్ని మరింత స్పష్టంగా చెప్పాలా?
  choice: నాకు మరణానికి దారితీసేదిగా తేలింది
  alternative: నాకు మరణాన్ని తెచ్చింది
  rationale: మూలపాఠం పౌలు అనుభవంలో వెల్లడైన ఫలితాన్ని చెబుతుంది; ఆజ్ఞే నేరుగా మరణానికి కారణమని పాఠంలో ఉన్నదానికంటే ఎక్కువగా వివరించకుండా వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, గంభీరతను మరియు జీవం–మరణం మధ్య మూలపాఠంలోని సమాంతర వ్యతిరేకతను సాధ్యమైనంతగా నిలిపిన రూపం.
