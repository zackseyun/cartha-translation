source:
  edition: SBLGNT
  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: te
  text: అయితే నా అవయవాలలో వేరొక నియమం[a] ఉన్నట్లు నేను చూస్తున్నాను. అది నా మనస్సుకు చెందిన నియమానికి వ్యతిరేకంగా యుద్ధం చేస్తూ, నా అవయవాలలో ఉన్న పాపపు నియమానికి నన్ను బందీగా చేస్తోంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ మళ్లీ మళ్లీ వచ్చిన గ్రీకు νόμος పదాన్ని సందర్భానుసారంగా “సూత్రం” లేదా “శక్తి” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “పాపపు నియమంలో నన్ను బందీగా చేస్తోంది.” “పాపపు నియమానికి ... బందీగా” అనే అనువాదం దాని ఆధీనంలోకి తీసుకెళ్లబడే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
    reason: lexical_alternative
