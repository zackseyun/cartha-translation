- source_word: ἁμαρτίας
  choice: పాప
  rationale: స్పష్టమైన, ప్రామాణిక తెలుగు సమానార్థకం.
theological_decisions:
- issue: ఈ వాక్యంలో νόμος‌ను ‘ధర్మశాస్త్రం’, ‘నియమం’, ‘సూత్రం’ లేదా ‘శక్తి’గా అనువదించాలా?
  choice: మూడు సందర్భాల్లోనూ ‘నియమం’
  alternative: ‘సూత్రం’ లేదా ‘శక్తి’; లేక ‘ధర్మశాస్త్రం’
  rationale: ఒకే గ్రీకు పదం పునరావృతమయ్యే వాక్చాతుర్యాన్ని నిలుపుతూ, ప్రతి సందర్భాన్నీ మోషే ధర్మశాస్త్రంగా ముందే నిర్ణయించదు; అదే సమయంలో దానిని కేవలం అమూర్తమైన సూత్రం లేదా శక్తిగా కూడా పరిష్కరించదు.
- issue: τοῦ νοός μου సంబంధాన్ని తెలుగులో ఎలా వ్యక్తం చేయాలి?
  choice: ‘నా మనస్సు అంగీకరించే నియమం’
  alternative: ‘నా మనస్సు యొక్క నియమం’
  rationale: అక్షరార్థపు ప్రత్యామ్నాయం తెలుగులో అస్పష్టంగా, అసహజంగా ఉంటుంది. ఎంచుకున్న రూపం రోమా 7 సమీప సందర్భంలో మనస్సు దేవుని నియమాన్ని సమ్మతించే భావాన్ని ప్రతిబింబిస్తుంది; అయితే ఆ నియమం స్వరూపంపై అదనపు సిద్ధాంత నిర్ణయాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే నిర్మాణం. νόμος పునరావృతాన్ని ‘నియమం’తో నిలిపి, ‘అవయవాలు’ మరియు యుద్ధం/బందీతనం రూపకాలను సంరక్షించాం.
