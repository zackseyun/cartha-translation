id: ROM.7.4
reference: Romans 7:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: te
  text: కాబట్టి, నా సహోదరులారా[a], మీరు కూడా మెస్సీయ[c] శరీరం ద్వారా ధర్మశాస్త్రానికి మరణింపజేయబడ్డారు; తద్వారా మీరు మృతులలోనుండి లేపబడిన మరొకరికి చెందేలా, మనం దేవుని కొరకు ఫలించేలా అయ్యారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా ‘నా సహోదరులారా’; ఈ పదం స్త్రీపురుషులు కలిసిన సమూహాన్ని కూడా సంబోధించగలదు.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘మీరు మరొకరివారు కావాలని’; ఈ మాట ముందున్న వివాహ ఉపమానాన్ని కొనసాగిస్తుంది.
    reason: cultural_note
  - marker: c
    text: 'గ్రీకు ‘Χριστοῦ’; ఇక్కడ బిరుదు అర్థాన్ని తెలియజేయడానికి ‘మెస్సీయ’ అని అనువదించాం. మరో అనువాదం: ‘క్రీస్తు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: కాబట్టి
  rationale: ముందున్న వివాహ ఉపమానం నుంచి తీసుకున్న నిర్ధారణను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀδελφοί μου
  choice: నా సహోదరులారా
  rationale: గ్రీకు పురుష బహువచన సంబోధనను నిలుపుతుంది; మిశ్రమ సమూహాన్ని కూడా సూచించగల వినియోగాన్ని పాదసూచికలో తెలిపాం.
- source_word: ἐθανατώθητε τῷ νόμῳ
  choice: ధర్మశాస్త్రానికి చంపబడ్డారు
  rationale: అనిర్దిష్ట భూతకాల కర్మణి రూపాన్ని, అలాగే ధర్మశాస్త్రంతో ఉన్న పూర్వ బంధం మరణం ద్వారా ముగిసిందనే చిత్రాన్ని సాధ్యమైనంత నేరుగా నిలుపుతుంది.
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: మెస్సీయ శరీరం ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధన/మధ్యవర్తిత్వ భావాన్ని కాపాడుతుంది; Χριστόςను ఇక్కడ బిరుదుగా గ్రహించి 'మెస్సీయ'గా అనువదించాం.
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: మరొకరికి మీరు చెందాలని
  rationale: ముందటి వివాహ ఉపమానాన్ని కొనసాగిస్తూ సంబంధ బదిలీని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: మృతులలోనుండి లేపబడిన మరొకరికి
  rationale: కర్మణి పునరుత్థాన ప్రయోగాన్ని, అలాగే గ్రీకులోని 'మృతులలోనుండి' అనే రూపాన్ని నిలుపుతుంది.
- source_word: ἵνα καρποφορήσωμεν τῷ θεῷ
  choice: తద్వారా మనం దేవుని కోసం ఫలించాలనే ఉద్దేశంతో
  rationale: ἵνα యొక్క ఉద్దేశార్థాన్ని, 'మీరు' నుంచి 'మనం'కు జరిగే వ్యక్తి మార్పును, ఫలించే రూపకాన్ని నిలుపుతుంది.
theological_decisions:
- issue: Χριστοῦ అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ అభిషిక్తుడనే బిరుదు భావం ప్రాధాన్యంగా ఉంది; అందువల్ల అర్థాన్ని తెలియజేసే 'మెస్సీయ'ను ఎంచుకున్నాం.
- issue: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ లోని వివాహ/సంబంధ రూపకం
  choice: మరొకరికి మీరు చెందాలని
  alternative: మీరు మరొకరివారు కావాలని
  rationale: వివాహ బంధం ముగిసి మరొకరితో సంబంధం ఏర్పడే సందర్భానుగత భావాన్ని స్పష్టంగా ఉంచుతూ, గ్రీకు వాక్యంలోని సంబంధాత్మక ఉద్రిక్తతను అతిగా వివరించదు.
- issue: ἐθανατώθητε యొక్క కర్మణి భావం
  choice: చంపబడ్డారు
  alternative: చనిపోయారు
  rationale: కర్తపై చర్య జరిగినట్లు ఉన్న గ్రీకు కర్మణి రూపాన్ని నిలుపుతుంది; ఎవరు చర్య చేశారో పాఠ్యంలో లేనందున చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని కర్మణి నిర్మాణం, వివాహ రూపకం, ‘మీరు’ నుంచి ‘మనం’కు మార్పు నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
