    issue: ‘ధర్మశాస్త్రానికి చంపబడ్డారు’ అనే పదప్రయోగం
    rationale: గ్రీకు కర్మణి రూపం నిలిచినా, తెలుగు ‘చంపబడ్డారు’ భౌతిక హత్య భావాన్ని అనవసరంగా బలపరుస్తుంది. ‘మరణింపజేయబడ్డారు’ రూపకం మరియు కర్మణి భావం రెండింటినీ మెరుగ్గా నిలుపుతుంది.
