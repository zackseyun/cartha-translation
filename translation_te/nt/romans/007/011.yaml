id: ROM.7.11
reference: Romans 7:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: te
  text: ఎందుకంటే పాపం ఆ ఆజ్ఞ ద్వారా అవకాశాన్ని ఉపయోగించుకొని నన్ను మోసగించి, దాని ద్వారా నన్ను చంపింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యానికి ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ ἁμαρτία
  choice: పాపం
  rationale: ఇక్కడ పాపమే చర్యలు చేసే వ్యాకరణ కర్త; ఈ పదం దాని వ్యక్తీకృత క్రియాశీలతను కాపాడుతుంది.
- source_word: ἀφορμὴν λαβοῦσα
  choice: అవకాశం దొరకబుచ్చుకొని
  rationale: లభించిన సందర్భాన్ని తన ప్రయోజనానికి ఉపయోగించుకోవడం అనే భావాన్ని సహజంగా, క్రియాశీలంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τῆς ἐντολῆς
  choice: ఆ ఆజ్ఞ ద్వారా
  rationale: διὰ యొక్క సాధనార్థక భావాన్ని, ఏకవచనంలోని ‘ఆజ్ఞ’ను నిలుపుతుంది.
- source_word: ἐξηπάτησέν με
  choice: నన్ను మోసగించి
  rationale: తీవ్రతను అనవసరంగా పెంచకుండా మోసపుచ్చడం అనే మూలభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δι’ αὐτῆς
  choice: దాని ద్వారానే
  rationale: స్త్రీలింగ ఏకవచన సర్వనామం వెనుక ఉన్న ‘ఆజ్ఞ’ను సూచిస్తుంది; ‘ద్వారానే’ సాధనార్థంతో పాటు వాక్యంలోని బలాన్ని సహజంగా అందిస్తుంది.
- source_word: ἀπέκτεινεν
  choice: నన్ను చంపింది
  rationale: ఆధునిక తెలుగులో ప్రత్యక్షమైన, సహజమైన సమానార్థకం; గ్రీకు వాక్యంలోని ప్రాణాంతక ఫలితాన్ని నిలుపుతుంది.
theological_decisions:
- issue: పాపాన్ని వ్యక్తిలా క్రియాశీల కర్తగా చిత్రించడం
  choice: పాపమే అవకాశం దొరకబుచ్చుకొని, మోసగించి, చంపిన కర్తగా అనువదించడం
  alternative: పాపాన్ని కేవలం అమూర్త ప్రభావంగా చూపే మృదువైన పదప్రయోగం
  rationale: గ్రీకులో పాపమే వరుస క్రియలకు వ్యాకరణ కర్త. అదనపు వ్యాఖ్యానం లేకుండా పౌలు ఉంచిన వ్యక్తీకరణను, ధార్మిక ఉద్వేగాన్ని అనువాదం నిలుపుతుంది.
- issue: δι’ αὐτῆς లోని సర్వనామ సూచన
  choice: ‘దాని’ అనేది ‘ఆ ఆజ్ఞ’ను సూచించేలా ఉంచడం
  alternative: ప్రధాన వాక్యంలో ‘ఆ ఆజ్ఞ ద్వారానే’ అని మళ్లీ స్పష్టంగా చెప్పడం
  rationale: గ్రీకు సర్వనామ నిర్మాణాన్ని కాపాడుతూ, సందిగ్ధత రాకుండా పాదటిప్పణిలో సూచనను వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘పాపం’ అనే అమూర్త నామానికి తెలుగు వ్యాకరణానుసారం నపుంసక ఏకవచన క్రియారూపం వాడబడింది; అయినా మూలంలోని క్రియాశీల వ్యక్తీకరణ పూర్తిగా నిలుపబడింది.
