id: ROM.8.27
reference: Romans 8:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: te
  text: హృదయాలను పరిశోధించేవాడు ఆత్మ యొక్క మనోభావం ఏమిటో ఎరుగుతాడు, ఎందుకంటే ఆత్మ దేవునికి అనుగుణంగా[a] పరిశుద్ధుల కొరకు విజ్ఞాపన చేస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని చిత్తానికి అనుగుణంగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐραυνῶν
  choice: పరిశోధించే
  rationale: హృదయాల అంతర్భాగాన్ని చురుకుగా వెదికి తెలిసికొనే భావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καρδίας
  choice: హృదయాలను
  rationale: మూలంలోని మానవ అంతరంగాన్ని సూచించే రూపకాన్ని నిలుపుతుంది; అనవసరంగా ‘మనస్సులు’ అని విస్తరించదు.
- source_word: τί τὸ φρόνημα
  choice: ఆలోచన ఏమిటో
  rationale: φρόνημα ఇక్కడ కేవలం బుద్ధిని కాక ఆత్మ యొక్క అంతర ఉద్దేశం లేదా దృక్పథాన్ని సూచిస్తుంది. ‘ఆలోచన’ ఆధునిక తెలుగులో సహజంగా ఉండి సందర్భార్థాన్ని నిలుపుతుంది.
- source_word: τοῦ πνεύματος
  choice: ఆత్మ
  rationale: రోమా 8 సమీప సందర్భంలో పరిశుద్ధాత్మను సూచిస్తుంది.
- source_word: ἐντυγχάνει
  choice: విజ్ఞాపన చేస్తుంది
  rationale: మునుపటి వచనంలోని ప్రార్థనా సందర్భంలో మరొకరి పక్షంగా దేవుని ఎదుట విన్నవించే భావాన్ని తెలియజేస్తుంది.
- source_word: ὑπὲρ ἁγίων
  choice: పరిశుద్ధుల పక్షంగా
  rationale: ὑπέρ + షష్ఠీ యొక్క ప్రతినిధిత్వ భావాన్ని స్పష్టంగా చూపుతూ, పౌలు వాడే ‘పరిశుద్ధులు’ అనే పదాన్ని నిలుపుతుంది.
- source_word: κατὰ θεὸν
  choice: దేవునికి అనుగుణంగా
  rationale: మూలంలోని సంక్షిప్త ‘దేవుని ప్రకారం’ భావాన్ని తెలుగులో అర్థవంతంగా అందిస్తూ, మూలంలో లేని ‘చిత్తం’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: κατὰ θεὸν అనే మాటను ‘దేవుని చిత్తం ప్రకారం’ అని స్పష్టీకరించాలా
  choice: దేవునికి అనుగుణంగా
  alternative: దేవుని చిత్తానికి అనుగుణంగా
  rationale: సందర్భార్థం దేవుని చిత్తానికి అనుగుణతను సూచించే అవకాశం ఉన్నా, గ్రీకు పాఠ్యంలో ‘చిత్తం’ అనే పదం ప్రత్యక్షంగా లేదు. ప్రధాన పాఠ్యం ఆ సంక్షిప్తతను నిలుపుతుంది; సాధారణ వ్యాఖ్యానాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బైబిలు శైలి. ‘ఎరుగును’ అనే రూపం వాక్య గాంభీర్యాన్ని నిలుపుతుంది; మిగతా నిర్మాణం సాధారణ పాఠకునికి స్పష్టంగా ఉండేలా ఉంచబడింది.
