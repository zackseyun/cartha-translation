revisions:
- from: హృదయాలను పరిశోధించే ఆయన ఆత్మ ఆలోచన ఏమిటో ఎరుగును; ఎందుకంటే ఆత్మ దేవునికి అనుగుణంగా[a] పరిశుద్ధుల పక్షంగా విజ్ఞాపన చేస్తుంది.
  to: హృదయాలను పరిశోధించేవాడు ఆత్మ యొక్క మనోభావం ఏమిటో ఎరుగుతాడు, ఎందుకంటే ఆత్మ దేవునికి అనుగుణంగా[a] పరిశుద్ధుల కొరకు విజ్ఞాపన చేస్తుంది.
  rationale: The revision clarifies the syntax, uses a more natural modern-standard verbal form, and renders φρόνημα as ‘మనోభావం’ to retain its sense of mindset or disposition. It preserves the source text’s distinction between God, who searches hearts, and the Spirit, who intercedes, without making the implicit reference in κατὰ θεόν more explicit in the main text.
