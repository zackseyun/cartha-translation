review_pass:
  verdict: revise
  source_fidelity: The draft correctly distinguishes the one who searches hearts from the Spirit, and accurately renders the Spirit's intercession for the saints. ‘దేవునికి అనుగుణంగా’ appropriately preserves the compact force of κατὰ θεόν without adding ‘will’ to the main text.
  naturalness: The sentence is understandable, but ‘పరిశోధించే ఆయన’ followed by ‘ఆత్మ ఆలోచన’ can momentarily obscure the clause structure. A more explicit relative-subject construction improves readability. ‘మనోభావం’ expresses φρόνημα (mindset/disposition) more fully than the narrower ‘ఆలోచన.’
  terminology: ‘హృదయాలు,’ ‘ఆత్మ,’ and ‘పరిశుద్ధులు’ are appropriate biblical terminology. ‘పరిశుద్ధుల కొరకు’ is more idiomatic modern Telugu than ‘పరిశుద్ధుల పక్షంగా’ while retaining the sense of ὑπὲρ. The footnote remains properly anchored and preserves the interpretive alternative.
  issues:
  - severity: low
    issue: Clause structure and register are slightly uneven.
    rationale: ‘హృదయాలను పరిశోధించే ఆయన ... ఎరుగును’ is grammatical, but ‘హృదయాలను పరిశోధించేవాడు’ makes the participial subject clearer; ‘ఎరుగుతాడు’ is a more regular modern-standard verbal form.
  - severity: low
    issue: ‘ఆలోచన’ is somewhat narrower than φρόνημα.
    rationale: In this context φρόνημα denotes the Spirit’s mind, disposition, or orientation, not merely a single thought. ‘మనోభావం’ better carries this range in natural Telugu.
  revised_text: హృదయాలను పరిశోధించేవాడు ఆత్మ యొక్క మనోభావం ఏమిటో ఎరుగుతాడు, ఎందుకంటే ఆత్మ దేవునికి అనుగుణంగా[a] పరిశుద్ధుల కొరకు విజ్ఞాపన చేస్తుంది.
