id: ROM.8.21
reference: Romans 8:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: te
  text: ఎందుకంటే సృష్టి తానే కూడా క్షయం అనే దాసత్వం నుండి దేవుని పిల్లల మహిమతో కూడిన స్వేచ్ఛలోకి విడుదల చేయబడుతుంది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “దేవుని పిల్లల మహిమ యొక్క స్వేచ్ఛలోకి.”'
    reason: గ్రీకులోని τῆς δόξης అనే షష్ఠీ విభక్తి నిర్మాణాన్ని ప్రధాన పాఠంలోని విశేషణార్థక అనువాదానికి ప్రత్యామ్నాయంగా చూపిస్తుంది.
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని నిరీక్షణకు కారణాన్ని వివరిస్తున్న కారణార్థక ప్రయోగాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: సృష్టి కూడా తానే
  rationale: καὶ యొక్క సమ్మిళిత భావాన్ని ‘కూడా’, αὐτή యొక్క ఉద్ఘాటనను ‘తానే’ ద్వారా నిలుపుతూ, κτίσιςను సమస్త సృష్టిగా వ్యక్తం చేస్తుంది.
- source_word: ἐλευθερωθήσεται
  choice: విడుదల పొంది ... ప్రవేశిస్తుంది
  rationale: భవిష్యత్ కర్మణి భావమైన విడుదల చేయబడడాన్ని నిలుపుతుంది; εἰς సూచించే కొత్త స్థితిలోకి మార్పును తెలుగులో సహజమైన వాక్యనిర్మాణంతో కలుపుతుంది.
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: క్షయదాసత్వం నుండి
  rationale: φθοράను సృష్టి సందర్భంలో క్షయం లేదా నశ్వరతగా, δουλεία యొక్క బలమైన దాసత్వ రూపకంతో కలిపి సంక్షిప్తంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς τὴν ἐλευθερίαν
  choice: స్వేచ్ఛలోకి
  rationale: εἰς సూచించే ఒక కొత్త స్థితిలోకి ప్రవేశించే గమనాన్ని నిలుపుతుంది.
- source_word: τῆς δόξης
  choice: మహిమగల
  rationale: తెలుగులో సహజంగా ఉండే విశేషణ రూపం; ఈ స్వేచ్ఛ మహిమచేత లక్షణీకరించబడిందనే భావాన్ని ఇస్తుంది. గ్రీకు షష్ఠీ విభక్తి శ్రేణి మరింత అక్షరార్థంగా పాదసూచికలో ఇవ్వబడింది.
- source_word: τῶν τέκνων τοῦ θεοῦ
  choice: దేవుని పిల్లల
  rationale: τέκνα యొక్క కుటుంబసంబంధమైన, లింగసమావేషక భావాన్ని ‘పిల్లలు’ ద్వారా కాపాడుతుంది.
theological_decisions:
- issue: τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ అనే షష్ఠీ విభక్తి శ్రేణిని ఎలా అనువదించాలి
  choice: దేవుని పిల్లల మహిమగల స్వేచ్ఛ
  alternative: దేవుని పిల్లల మహిమ యొక్క స్వేచ్ఛ
  rationale: ప్రధాన పాఠంలో సహజమైన ఆధునిక తెలుగు కోసం δόξηςను విశేషణార్థకంగా ఇచ్చాం; అయితే మహిమ పిల్లలకు సంబంధించినదా, స్వేచ్ఛను లక్షణీకరిస్తుందా అనే గ్రీకు నిర్మాణంలోని సాంద్రతను పూర్తిగా పరిష్కరించకుండా మరింత అక్షరార్థ రూపాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘క్షయదాసత్వం’ బలమైన మూల రూపకాన్ని నిలుపుతుంది; ‘విడుదల పొంది ... ప్రవేశిస్తుంది’ విడుదల నుండి కొత్త స్వేచ్ఛా స్థితిలోకి మార్పును సహజంగా వ్యక్తం చేస్తుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో చేర్చబడింది.
