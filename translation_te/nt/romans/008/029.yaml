id: ROM.8.29
reference: Romans 8:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: te
  text: ఎందుకంటే ఆయన ముందుగానే ఎరిగినవారిని[a] తన కుమారుని స్వరూపానికి అనురూపులుగా ఉండేలా ముందుగానే నిర్ణయించాడు. తద్వారా ఆయన కుమారుడు అనేకమంది సహోదరుల[b] మధ్య జ్యేష్ఠుడై ఉండేలా చేశాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముందుగానే తెలిసినవారిని.” ఇక్కడ “ఎరిగాడు” అనే మాటను కొందరు సంబంధపూర్వక అర్థంలో—అంటే, “ముందుగానే వారిపై తన దృష్టిని ఉంచాడు” అని—అర్థం చేసుకుంటారు.
    reason: alternative_reading
  - marker: b
    text: “సహోదరులు” అనే గ్రీకు పదం వ్యాకరణపరంగా పుంలింగంలో ఉంది; ఇక్కడ దేవుని కుటుంబంలోని పురుషులు, స్త్రీలు ఇద్దరూ ఉద్దేశింపబడి ఉండవచ్చు.
    reason: cultural_note
lexical_decisions:
- source_word: προέγνω
  choice: ముందుగా ఎరిగినవారిని
  rationale: ‘ముందుగా తెలుసుకున్న’ అనే ప్రాథమిక అర్థాన్ని నిలుపుతూ, కేవలం ముందస్తు సమాచార జ్ఞానమా లేక సంబంధపూర్వక ఎరుగుదలా అన్న theological tension‌ను పరిష్కరించకుండా ఉంచుతుంది.
- source_word: προώρισεν
  choice: ముందుగానే నిర్ణయించాడు
  rationale: προ- అనే ముందస్తు భావాన్ని, ὁρίζω యొక్క నిర్ణయాత్మక భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: συμμόρφους
  choice: అనురూపులుగా ఉండాలని
  rationale: ఒకే రూపానికి సరిపోలేలా కావడం అనే భావాన్ని తెలిపి, తరువాతి ‘స్వరూపానికి’తో సహజంగా అనుసంధానమవుతుంది.
- source_word: εἰκόνος
  choice: స్వరూపానికి
  rationale: ‘ప్రతిరూపం/రూపం’ అనే భావంతోపాటు బైబిలు సంబంధిత గంభీరతను కలిగిన సహజ తెలుగు పదం.
- source_word: υἱοῦ
  choice: కుమారుని
  rationale: మూలంలోని స్పష్టమైన పుత్ర సంబంధ బిరుదును నేరుగా నిలుపుతుంది.
- source_word: εἰς τὸ εἶναι
  choice: తద్వారా ... ఉండాలి
  rationale: ఈ నిర్మాణంలోని ఉద్దేశం లేదా ఫలితం అనే రెండింటికీ తావిస్తూ, తెలుగులో సహజంగా ఉంటుంది.
- source_word: πρωτότοκον
  choice: జ్యేష్ఠుడిగా
  rationale: ‘మొదట పుట్టినవాడు’ అనే రూపకాన్ని సంక్షిప్తంగా నిలుపుతూ, ప్రాధాన్యత భావాన్నీ మోసే సాంప్రదాయిక తెలుగు పదం.
- source_word: ἀδελφοῖς
  choice: సహోదరుల
  rationale: వ్యాకరణపరంగా పుంలింగ బహువచనాన్ని ప్రతిబింబిస్తుంది; దేవుని కుటుంబంలోని స్త్రీపురుషులిద్దరినీ సూచించే అవకాశం పాదటిప్పణిలో తెలియజేయబడింది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: మునుపటి వాక్యానికి వివరణాత్మక ఆధారాన్ని పరిచయం చేసే సంధానాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: προέγνω అనే పదం ముందస్తు జ్ఞానాన్ని సూచిస్తుందా, సంబంధపూర్వక ఎంపికను సూచిస్తుందా?
  choice: ‘ముందుగా ఎరిగినవారిని’ అని అనువదించి అర్థసాంద్రతను నిలుపడం.
  alternative: ‘ముందుగానే తన దృష్టిని వారిపై ఉంచినవారిని’ లేదా కేవలం ‘ముందుగా తెలుసుకున్నవారిని’.
  rationale: మూలపదం ఈ వాదాన్ని స్వయంగా పూర్తిగా పరిష్కరించదు; అందువల్ల ఏ ప్రత్యేక సిద్ధాంతాన్నీ అనువాదంలోకి చొప్పించలేదు.
- issue: εἰς τὸ εἶναι ఉద్దేశాన్నా ఫలితాన్నా ప్రధానంగా సూచిస్తుంది?
  choice: ‘తద్వారా ... ఉండాలి’ అని రెండు ఛాయలకూ తావిచ్చే నిర్మాణం.
  alternative: ‘... ఉండేలా’ లేదా ‘దాని ఫలితంగా ... అయ్యాడు’.
  rationale: గ్రీకు నిర్మాణం ఉద్దేశం/ఫలితం మధ్య సన్నిహిత సంబంధాన్ని అనుమతిస్తుంది; ఖచ్చితంగా ఒక్కదానికే పరిమితం చేయకుండా అనువదించబడింది.
- issue: ἀδελφοῖς‌ను ప్రధాన పాఠ్యంలో లింగసమావేషకంగా విస్తరించాలా?
  choice: ‘సహోదరుల’ అని వ్యాకరణ రూపాన్ని నిలిపి, సమావేషక సూచనను పాదటిప్పణిలో ఇవ్వడం.
  alternative: ‘సహోదర సహోదరీల’ లేదా ‘తోబుట్టువుల’.
  rationale: గ్రీకు రూపం పుంలింగ బహువచనం; అయితే సందర్భంలో దేవుని కుటుంబంలోని స్త్రీపురుషులిద్దరూ ఉద్దేశింపబడవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. ‘ఎరిగినవారు,’ ‘స్వరూపం,’ ‘జ్యేష్ఠుడు’ వంటి పదాలు వాక్యంలోని theological density మరియు బైబిలు ప్రతిధ్వనిని నిలుపుతాయి; పాదటిప్పణి సూచికలు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
