revisions:
- from: తన సొంత కుమారుణ్ణి సైతం కాపాడుకోకుండా, మనందరి కోసం[c] ఆయనను అప్పగించిన[a] దేవుడు, ఆయనతో పాటు సమస్తాన్నీ మనకు కృపతో ఇవ్వకుండా[b] ఎలా ఉంటాడు?
  to: తన సొంత కుమారుణ్ణి కూడా విడిచిపెట్టకుండా, మనందరి కోసం[c] ఆయనను అప్పగించిన[a] దేవుడు, ఆయనతో పాటు సమస్తాన్నీ మనకు కృపగా అనుగ్రహించకపోతాడా?
