id: ROM.8.32
reference: Romans 8:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: te
  text: తన సొంత కుమారుణ్ణి కూడా విడిచిపెట్టకుండా, మనందరి కోసం[c] ఆయనను అప్పగించిన[a] దేవుడు, ఆయనతో పాటు సమస్తాన్నీ మనకు కృపగా అనుగ్రహించకపోతాడా?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనను చేతికి అప్పగించాడు.’
    reason: lexical_alternative
  - marker: c
    text: ‘మనందరి కోసం’ అనే మాటను ‘మనందరి పక్షంగా’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅς γε
  choice: దేవుడు
  rationale: ముందటి సందర్భంలోని దేవుణ్ణే సూచించే సంబంధసర్వనామాన్ని తెలుగులో సహజమైన వాక్య నిర్మాణం కోసం చివరి ప్రధాన కర్తగా స్పష్టంగా పేర్కొన్నాం; γε ఇచ్చే నొక్కిచెప్పే భావం ‘సైతం’ ఉన్న ఉపవాక్యంలో ప్రతిఫలిస్తుంది.
- source_word: τοῦ ἰδίου υἱοῦ
  choice: తన సొంత కుమారుణ్ణి
  rationale: ἴδιος సూచించే సన్నిహితమైన స్వకీయ సంబంధాన్నీ, υἱός యొక్క నిర్దిష్ట సూచననూ నిలుపుతుంది.
- source_word: οὐκ ἐφείσατο
  choice: కాపాడుకోకుండా
  rationale: φείδομαι ఇక్కడ కుమారుణ్ణి బాధ లేదా మరణం నుండి తప్పించడం అనే భావాన్ని ఇస్తుంది. తెలుగు ప్రతికూల కృదంత నిర్మాణం తరువాతి ప్రధాన ప్రశ్నతో సహజంగా కలుస్తుంది.
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: మనందరి కోసం
  rationale: ὑπέρ యొక్క ప్రయోజనార్థక లేదా పక్షార్థక విస్తృతిని సాంకేతిక ప్రాయశ్చిత్త పదజాలంతో కుదించకుండా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: παρέδωκεν αὐτόν
  choice: ఆయనను అప్పగించిన
  rationale: παραδίδωμι సూచించే బాధకు లేదా మరణానికి చేతికి ఇవ్వబడడంలోని గంభీరతను ‘అప్పగించిన’ నిలుపుతుంది.
- source_word: πῶς οὐχὶ καὶ
  choice: ఎలా ఉంటాడు?
  rationale: గ్రీకు అలంకార ప్రశ్న ఆశించే బలమైన సానుకూల జవాబును తెలుగు ప్రతికూల కృదంతంతో కూడిన సహజ ప్రశ్నారూపంలో నిలుపుతుంది.
- source_word: σὺν αὐτῷ
  choice: ఆయనతో పాటు
  rationale: సύν యొక్క సహవాస భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: τὰ πάντα
  choice: సమస్తాన్నీ
  rationale: పౌలు వాడిన విస్తృతమైన ‘అన్నీ’ అనే భావాన్ని దాని సందర్భ పరిమితిని ముందే నిర్ణయించకుండా నిలుపుతుంది.
- source_word: ἡμῖν χαρίσεται
  choice: మనకు కృపతో ఇవ్వకుండా
  rationale: భవిష్యదర్థాన్ని ప్రధాన క్రియలో నిలుపుతూ, χαρίζομαι లోని ఉచితమైన కృపాదాన భావాన్ని ‘కృపతో ఇవ్వు’ ద్వారా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ὑπὲρ ἡμῶν πάντων ను నిర్దిష్టమైన ప్రతిస్థాపన సిద్ధాంత పదజాలంతో అనువదించాలా?
  choice: మనందరి కోసం
  alternative: మనందరి పక్షంగా
  rationale: గ్రీకు ప్రయోజనం లేదా పక్షంగా చేసిన కార్యాన్ని స్పష్టంగా చెబుతుంది; అయితే ఈ పదబంధం ఒక్కటే సూచించేదానికంటే మరింత సాంకేతికమైన ప్రాయశ్చిత్త సూత్రాన్ని అనువాదంలో చేర్చదు.
- issue: τὰ πάντα యొక్క పరిధిని భౌతిక లేదా ఆధ్యాత్మిక ఆశీర్వాదాలకు మాత్రమే పరిమితం చేయాలా?
  choice: సమస్తాన్నీ
  alternative: అన్నిటినీ
  rationale: మూలంలోని విస్తృత వ్యక్తీకరణను అలాగే ఉంచి, దాని పరిధిని రోమా 8 అధ్యాయ సందర్భమే నిర్దేశించనిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి సులభమైన శైలి. గ్రీకు వాక్యంలోని దీర్ఘ అలంకార ప్రశ్నను తెలుగులో సహజంగా ఉంచేందుకు కర్త అయిన ‘దేవుడు’ను ప్రధాన ఉపవాక్యానికి దగ్గరగా ఉంచాం. ‘కుమారుడు’ మరియు ఆయనను సూచించే సర్వనామానికి గౌరవ రూపం వాడాం.
