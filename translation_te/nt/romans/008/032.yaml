  - marker: b
    text: లేదా, ‘మనకు సమస్తాన్నీ ఉచితంగా ఇస్తాడు.’
    reason: lexical_alternative
  - marker: c
    text: ‘మనందరి కోసం’ అనే మాటను ‘మనందరి పక్షంగా’ అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
