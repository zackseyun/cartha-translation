- from: అయితే, మనలను ప్రేమించినవాని ద్వారా వీటన్నిటిలో మనం ఘనవిజయం సాధిస్తున్నాం[a][b].
  to: కాని వీటన్నిటిలో మనం మనలను ప్రేమించినవాని[b] ద్వారా ఘనంగా జయిస్తున్నాం[a].
  rationale: The revision sharpens the adversative, renders the intensified Greek verb with a natural Telugu verb phrase, and relocates both footnote anchors to their proper textual referents. It retains the source text’s unstated identity for the one who loved us and preserves the contextual observation in a non-dogmatic footnote.
