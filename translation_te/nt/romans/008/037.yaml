  edition: SBLGNT
  text: ἀλλ’ ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/037.yaml
  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: te
  text: కాని వీటన్నిటిలో మనం మనలను ప్రేమించినవాని[b] ద్వారా ఘనంగా జయిస్తున్నాం[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనం జయించేవారికంటే మిన్నవారమై ఉన్నాం.”
    reason: lexical_alternative
  - marker: b
    text: అంటే, సమీప సందర్భాన్ని బట్టి బహుశా క్రీస్తు.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: అయితే
  rationale: ముందటి వచనంలో పేర్కొన్న శ్రమలు ఓటమికి దారితీయవనే బలమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν τούτοις πᾶσιν
  choice: వీటన్నిటిలో
  rationale: మునుపటి వచనంలో జాబితా చేసిన కష్టాలన్నిటి మధ్యనే ఈ విజయం కలుగుతుందనే భావాన్ని, గ్రీకు పదబంధ నిర్మాణానికి దగ్గరగా ఉంచుతుంది.
- source_word: ὑπερνικῶμεν
  choice: మనం ఘనవిజయం సాధిస్తున్నాం
  rationale: νικάω అనే ‘జయించు’ క్రియను ὑπέρ- తీవ్రతరం చేస్తుంది. ‘ఘనవిజయం సాధిస్తున్నాం’ అనేది నిర్ణాయకమైన, మించిన విజయాన్ని సహజ తెలుగులో క్రియారూపంగానే వ్యక్తం చేస్తుంది.
- source_word: διὰ
  choice: ద్వారా
  rationale: 'షష్ఠీ విభక్తితో వచ్చిన ఈ సందర్భంలో సాధనం లేదా కార్యసాధకుని భావాన్ని తెలియజేస్తుంది: విజయం మనలను ప్రేమించినవాని ద్వారానే కలుగుతుంది.'
- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: మనలను ప్రేమించినవాని
  rationale: నామవాచకంగా పనిచేసే భూతకాల కృదంతాన్ని సహజంగా అనువదిస్తూ, ఆ వ్యక్తి పేరును మూలంలో లేనట్లే ప్రధాన పాఠ్యంలో చేర్చకుండా ఉంచుతుంది.
theological_decisions:
- issue: ‘మనలను ప్రేమించినవాని’ గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో వ్యక్తి పేరును పేర్కొనకుండా ‘మనలను ప్రేమించినవాని’ అని అనువదించడం
  alternative: తక్షణ సందర్భాన్ని బట్టి ‘క్రీస్తు ద్వారా’ అని స్పష్టీకరించడం
  rationale: రోమా 8:35 సమీప సందర్భం క్రీస్తును బలంగా సూచించినా, ఈ వచనంలోని గ్రీకు పాఠ్యం పేరును స్పష్టంగా చెప్పదు. అందువల్ల ప్రధాన పాఠ్యం ఆ అనిశ్చితిని కాపాడుతుంది; సాధ్యమైన గుర్తింపును పాదసూచికలో తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు సులభంగా అర్థమయ్యేలా, అయితే గౌరవప్రదమైన శైలిలో అనువదించబడింది. ‘ఘనవిజయం’ ὑπερνικῶμεν యొక్క తీవ్రతను సంక్షిప్తంగా తెలియజేస్తుంది; పాదసూచిక మరింత రూపపరమైన ప్రత్యామ్నాయాన్ని అందిస్తుంది.
