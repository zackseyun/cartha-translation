source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: te
  text: ఎందుకంటే, సృష్టి యావత్తూ ఇప్పటివరకు కలిసి మూలుగుతూ, కలిసి ప్రసవవేదనలు పడుతోందని మనకు తెలుసు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సృష్టి అంతా’; ‘సృష్టించబడిన ప్రతిదీ’ అని కూడా అనువదించవచ్చు. అయితే ఇక్కడ విశాలమైన విశ్వసృష్టి భావమే ఎక్కువ సంభావ్యమైనది.
    reason: lexical_alternative
  - marker: b
    text: ‘ప్రసవవేదనలు పడుతోంది’ అనే మాట ప్రసవ నొప్పులను గుర్తుచేస్తుంది; కాబట్టి ఇది బాధను మాత్రమే కాక, కొత్త జీవానికి దారితీసే బాధను కూడా సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: మనకు తెలుసు
  rationale: రూపంలో పరిపూర్ణకాలమైనప్పటికీ οἶδα సాధారణంగా వర్తమాన స్థితిని సూచిస్తుంది; ఇక్కడ అందరికీ తెలిసిన స్థిరమైన అవగాహనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వచనంలోని వాదనకు ఈ మాట వివరణను జోడిస్తుందనే అనుసంధాన భావాన్ని నిలుపుతుంది.
- source_word: πᾶσα ἡ κτίσις
  choice: సృష్టి యావత్తూ
  rationale: సపదమైన πᾶσα సమష్టి భావాన్ని ఇస్తుంది. సందర్భంలోని విశ్వవ్యాప్త పరిధిని ఉంచుతూ, దాన్ని విడివిడిగా ఉన్న ప్రతి జీవికి పరిమితం చేయదు.
- source_word: συστενάζει
  choice: కలిసి మూలుగుతూ
  rationale: మూలుగుదలతోపాటు συν- ఉపసర్గలోని సామూహిక భావాన్ని కూడా స్పష్టంగా ఉంచుతుంది.
- source_word: συνωδίνει
  choice: కలిసి ప్రసవవేదనలు పడుతోంది
  rationale: సాధారణ బాధగా కాక ప్రసవవేదనల ప్రత్యేక చిత్రాన్ని, అలాగే συν- ఉపసర్గలోని ‘కలిసి’ అనే భావాన్ని కాపాడుతుంది.
- source_word: ἄχρι τοῦ νῦν
  choice: ఇప్పటివరకు
  rationale: గతం నుండి ప్రస్తుత క్షణం వరకు కొనసాగుతున్న స్థితిని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: κτίσις అనే పదాన్ని ‘సృష్టి’గా తీసుకోవాలా, ‘సృష్టించబడిన ప్రతి జీవి/వస్తువు’గా తీసుకోవాలా?
  choice: సృష్టి యావత్తూ
  alternative: సృష్టించబడిన ప్రతిదీ
  rationale: రోమా 8:19–23లో మానవేతర సృష్టి వ్యర్థతకు లోబడి విముక్తి కోసం ఎదురుచూస్తున్న సమష్టిగా వ్యక్తీకరించబడింది. ‘సృష్టి యావత్తూ’ ఆ విశాల పరిధిని నిలుపుతుంది; అయితే ప్రత్యామ్నాయ పంపిణీ భావాన్ని పాదసూచికలో ఉంచుతుంది.
- issue: ప్రసవవేదనల రూపకం బాధను మాత్రమే సూచిస్తుందా, లేక రాబోయే నూతన జీవాన్ని కూడా సూచిస్తుందా?
  choice: ప్రసవవేదనలు అనే రూపకాన్ని యథాతథంగా నిలుపడం
  alternative: తీవ్రంగా బాధపడుతోంది
  rationale: మూలపదం ప్రసవవేదనలను ప్రత్యేకంగా సూచిస్తుంది. దాని సాధ్యమైన ఆశాభావాన్ని వివరణాత్మకంగా ప్రధాన వాక్యంలో చేర్చకుండా, రూపకంలో ఉన్న ఉద్రిక్తతను కాపాడి పాదసూచికలో సంకేతాన్ని వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘సృష్టి యావత్తూ’ విశ్వవ్యాప్త సమష్టి భావాన్ని, ‘కలిసి’ అనే పదం రెండు συν- క్రియల సామూహికతను, ‘ప్రసవవేదనలు’ మూలంలోని జనన రూపకాన్ని నిలుపుతున్నాయి.
