id: ROM.8.7
reference: Romans 8:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: te
  text: ఎందుకంటే శరీరానుసారమైన మనస్తత్వం[a] దేవునిపట్ల శత్రుత్వమే[b]; అది దేవుని ధర్మశాస్త్రానికి లోబడదు; నిజానికి, లోబడగలిగేది కూడా కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాప స్వభావానికి అనుగుణమైన మనస్తత్వం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవునికి విరోధమే.”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: ఎందుకంటే
  rationale: ముందటి ప్రకటనకు కారణాన్ని పరిచయం చేసే పదం; గ్రీకు పదంలోని కారణార్థాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: φρόνημα
  choice: మనస్తత్వం
  rationale: కేవలం బుద్ధిని కాకుండా మనస్సు మొగ్గు, దృక్పథం, స్థిరమైన ఆలోచనా ధోరణిని సూచిస్తుంది.
- source_word: σάρξ
  choice: శరీర సంబంధమైన
  rationale: పౌలు వాడిన ‘శరీరం’ అనే మూల రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతూ, ఇది కేవలం భౌతిక దేహాన్ని సూచిస్తోందనే అపార్థాన్ని తగ్గిస్తుంది; వ్యాఖ్యానాత్మక ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంది.
- source_word: ἔχθρα
  choice: శత్రుత్వమే
  rationale: ఇది కేవలం ‘శత్రువైన’ అనే విశేషణం కాకుండా శత్రుత్వం లేదా విరోధం అనే నామవాచక ప్రకటన; ‘మే’ గ్రీకు వాక్యంలోని బలమైన సమీకరణను సహజంగా తెలియజేస్తుంది.
- source_word: εἰς θεόν
  choice: దేవునిపట్ల
  rationale: శత్రుత్వం ఎవరిని ఉద్దేశించి ఉందో తెలిపే దిశా భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὑποτάσσεται
  choice: లోబడదు
  rationale: దేవుని ధర్మశాస్త్ర అధికారానికి తనను లోపరచుకోవడం లేదా దానికి విధేయంగా ఉండడం అనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: νόμῳ τοῦ θεοῦ
  choice: దేవుని ధర్మశాస్త్రానికి
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని, అలాగే νόμος పదానికి ఉన్న ధార్మిక బరువును నిలుపుతుంది.
- source_word: οὐδὲ γὰρ δύναται
  choice: లోబడగలదు కూడా కాదు
  rationale: కేవలం లోబడకపోవడమే కాక, లోబడే సామర్థ్యం కూడా లేదని οὐδέ మరియు δύναται తెలిపే తీవ్రతను నిలుపుతుంది.
theological_decisions:
- issue: σάρξ పదాన్ని ‘శరీరం’ అనే మూల రూపకంతో అనువదించాలా, ‘పాప స్వభావం’ అని వ్యాఖ్యానాత్మకంగా అనువదించాలా
  choice: ప్రధాన పాఠ్యంలో ‘శరీర సంబంధమైన’ అని ఉంచడం
  alternative: ‘పాప స్వభావపు’
  rationale: సందర్భంలో ఇది దేవునికి విరోధమైన మానవ ధోరణిని సూచించినా, మూలంలోని రూపకాన్ని పూర్తిగా వ్యాఖ్యానంగా మార్చకుండా నిలుపుతుంది; సాధ్యమైన భావవ్యాఖ్యను పాదటిప్పణిలో ఇస్తుంది.
- issue: చివరి మాటను కేవలం ఇష్టపడకపోవడంగా చూపాలా, లేక అసమర్థతగా ఉంచాలా
  choice: ‘లోబడగలదు కూడా కాదు’ అని స్పష్టమైన అసమర్థతను నిలుపడం
  alternative: ‘లోబడడానికి ఇష్టపడదు’
  rationale: δύναται సామర్థ్యాన్ని నేరుగా సూచిస్తుంది. వాక్యంలో ఉన్న ధార్మిక ఉద్రిక్తతను మెత్తబరచకుండా, దానిపై విస్తృత సిద్ధాంత వ్యవస్థను రుద్దకుండా అనువదించబడింది.
- issue: ἔχθρα ను విశేషణంగా ‘విరోధంగా ఉంది’ అని మార్చాలా, నామవాచక రూపాన్ని నిలుపాలా
  choice: ‘శత్రుత్వమే’ అనే నామవాచక ప్రకటన
  alternative: ‘దేవునికి విరోధంగా ఉంది’
  rationale: గ్రీకులో ἔχθρα నామవాచకం. నామవాచక రూపం శరీర సంబంధమైన మనస్తత్వం స్వయంగా దేవునిపట్ల శత్రుత్వమని వాక్యం చేసే బలమైన ప్రకటనను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యంలోని గంభీరతను నిలుపుతూ రూపొందించబడింది. ‘మనస్తత్వం,’ ‘శత్రుత్వం,’ ‘ధర్మశాస్త్రం,’ ‘లోబడడం’ వంటి పదాలు మూలంలోని భావసాంద్రతను సహజంగా మోస్తాయి. రెండు పాదటిప్పణి సూచికలూ సంబంధిత పదబంధాల వెంట ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
