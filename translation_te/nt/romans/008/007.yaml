revisions:
- from: ఎందుకంటే శరీర సంబంధమైన మనస్తత్వం[a] దేవునిపట్ల శత్రుత్వమే[b]; అది దేవుని ధర్మశాస్త్రానికి లోబడదు; లోబడగలదు కూడా కాదు.
  to: ఎందుకంటే శరీరానుసారమైన మనస్తత్వం[a] దేవునిపట్ల శత్రుత్వమే[b]; అది దేవుని ధర్మశాస్త్రానికి లోబడదు; నిజానికి, లోబడగలిగేది కూడా కాదు.
  rationale: The revision replaces a potentially body-focused expression with “శరీరానుసారమైన,” which naturally represents the Pauline metaphor of flesh-governed orientation. It also refines the final clause for idiomatic Telugu while preserving the source's emphatic statement that this mindset is unable to submit. Footnote a is phrased as a natural Telugu interpretive alternative, and footnote b remains correctly anchored to “శత్రుత్వమే.”
