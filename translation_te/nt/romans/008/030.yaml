id: ROM.8.30
reference: Romans 8:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: te
  text: ఆయన ముందుగా నిర్ణయించినవారిని[a] కూడా పిలిచాడు; ఆయన పిలిచినవారిని కూడా నీతిమంతులుగా తీర్చాడు; ఆయన నీతిమంతులుగా తీర్చినవారిని కూడా మహిమపరిచాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ముందుగానే నియమించినవారిని.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “మహిమపరిచాడు” అని భూతకాల రూపం ఉంది. కొందరు దీనిని, భవిష్యత్తులో కలిగే మహిమ ఎంతో నిశ్చయమైనది కాబట్టి అది ఇప్పటికే నెరవేరినట్లుగా చెప్పబడిందని అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: ముందుగా నిర్ణయించాడు
  rationale: ఈ క్రియ ముందుగానే నిర్ణయించడం లేదా నియమించడం అనే భావాన్ని ఇస్తుంది. ఈ అనువాదం గ్రీకు భావాన్ని స్పష్టంగా ఉంచుతూ, ఏ ప్రత్యేక మతశాఖ సిద్ధాంతాన్నీ అదనంగా చేర్చదు.
- source_word: ἐκάλεσεν
  choice: పిలిచాడు
  rationale: καλέωకు సహజమైన, స్థిరమైన తెలుగు సమానార్థకం; పౌలు పేర్కొన్న వరుసలోని సంబంధాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: ἐδικαίωσεν
  choice: నీతిమంతులుగా తీర్చాడు
  rationale: పౌలు వాడుకలోని న్యాయపరమైన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది. ‘నీతిమంతులని ప్రకటించాడు’ అనేది వివరణాత్మక ప్రత్యామ్నాయం.
- source_word: ἐδόξασεν
  choice: మహిమపరిచాడు
  rationale: గ్రీకులో ఇది ఏఓరిస్ట్ సూచనార్థక రూపం. అందువల్ల భూతకాల రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, భవిష్యత్తు మహిమను ముందుగానే నెరవేరినదిగా చెప్పే అవగాహనను పాదసూచికలో ఉంచాం.
- source_word: οὓς ... τούτους
  choice: తాను ... వారిని
  rationale: ప్రతి దశలోనూ అదే సమూహాన్ని సూచించే గ్రీకు సహసంబంధ నిర్మాణాన్ని సహజమైన తెలుగు పునరుక్తితో నిలుపుతుంది.
- source_word: καὶ
  choice: అంతర్లీనమైన ‘కూడా’ భావం
  rationale: గ్రీకు καί ప్రతి దశను ముందటి దశకు జోడిస్తుంది. తెలుగులో ప్రతిసారి ‘కూడా’ అని పెట్టడం భారంగా ఉండేందున, సమాంతర నిర్మాణం ద్వారా ఆ కూడిక భావాన్ని సహజంగా వ్యక్తం చేశాం.
- source_word: δὲ
  choice: వాక్యప్రవాహంలో అంతర్లీనం
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతను కాక స్వల్ప అనుసంధానాన్ని సూచిస్తుంది; తెలుగు వాక్యప్రవాహంలో ప్రత్యేక పదం లేకుండానే అది సహజంగా వ్యక్తమవుతుంది.
theological_decisions:
- issue: προώρισενను మతశాఖాపరమైన భావాలు రాకుండా మృదువుగా అనువదించాలా?
  choice: ముందుగా నిర్ణయించాడు
  alternative: ముందుగానే నియమించాడు
  rationale: గ్రీకు పాఠ్యం ముందస్తు నిర్ణయాన్ని స్పష్టంగా చెబుతుంది. అయితే ఆ నిర్ణయం ఎలా పనిచేస్తుందో ఈ వచనం చెప్పని అంశాలను అనువాదం జోడించదు.
- issue: ἐδόξασενను భూతకాలంగా అనువదించాలా, భవిష్యత్ కాలంగా అనువదించాలా?
  choice: మహిమపరిచాడు
  alternative: మహిమపరుస్తాడు
  rationale: మూల గ్రీకులో భూతకాల ఏఓరిస్ట్ రూపం ఉన్నందున దానినే ప్రధాన పాఠ్యంలో నిలిపాం. ఇది నిశ్చయమైన భవిష్యత్ మహిమను ఇప్పటికే జరిగినట్లుగా చెబుతోందనే అవగాహనను పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని వరుసను పునరుక్తి ద్వారా నిలిపి, తెలుగు సహజత్వం కోసం ‘కూడా’ను ప్రతిసారి బలవంతంగా చేర్చలేదు.
