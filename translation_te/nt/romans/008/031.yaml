id: ROM.8.31
reference: Romans 8:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ’ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/031.yaml
  text: What then shall we say to these things? If God is for us[b][a], who is against us?
translation:
  language: te
  text: అయితే, ఈ సంగతుల గురించి మనం ఏమని చెప్పాలి?[a] దేవుడు మన పక్షాన ఉంటే,[b] మనకు విరోధంగా ఎవరు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఈ సంగతులకు ప్రతిగా మనం ఏమని చెప్పాలి?’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవుడు మన పక్షాన ఉన్నాడు కాబట్టి, మనకు విరోధంగా ఎవరు?’
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: అయితే ... మనం ఏమని చెప్పాలి?
  rationale: οὖν ముందున్న వాదన నుంచి వచ్చే ముగింపును సూచిస్తుంది; భవిష్యత్ రూపమైన ἐροῦμεν ఇక్కడ ఆలోచనాత్మక-అలంకార ప్రశ్నగా ఉంది. ఆధునిక తెలుగులో ఈ రూపం సహజంగా ఆ భావాన్ని అందిస్తుంది.
- source_word: πρὸς ταῦτα
  choice: వీటిని గురించి
  rationale: ముందు వివరించిన సంగతులను ఉద్దేశించి ఏమి చెప్పాలనే భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది; ‘వీటికి ప్రతిగా’ అనేది సాధ్యమైన మరింత అక్షరార్థ ప్రత్యామ్నాయం.
- source_word: εἰ
  choice: ఉంటే
  rationale: గ్రీకు షరతు రూపాన్ని నిలుపుతూ, సందర్భంలో అది సందేహాన్ని కాక దేవుడు మన పక్షాన ఉన్నాడనే అంగీకరించిన సత్యంపై ఆధారపడిన అలంకార ప్రశ్న అని పాఠకుడు గ్రహించేలా చేస్తుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: నామవాచక కర్తకు నేరమైన, ప్రామాణిక తెలుగు సమానం.
- source_word: ὑπὲρ ἡμῶν
  choice: మన పక్షాన
  rationale: ఈ సందర్భంలో ὑπέρ సూచించే అనుకూలత, మద్దతు అనే భావాన్ని ‘మన పక్షాన’ సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: τίς καθ’ ἡμῶν
  choice: మనకు విరోధంగా ఎవరు నిలబడగలరు?
  rationale: κατά విరోధాన్ని సూచిస్తుంది. ప్రశ్నలో అంతర్లీనంగా ఉన్న ఫలించని ప్రతిఘటన అనే అలంకార బలాన్ని సహజ తెలుగులో ‘నిలబడగలరు’ తెలియజేస్తుంది; మరింత అక్షరార్థంగా ‘మనకు విరోధంగా ఎవరు?’ అని కూడా అనువదించవచ్చు.
theological_decisions:
- issue: εἰ ὁ θεὸς ὑπὲρ ἡμῶν అనే వాక్యభాగంలోని షరతు భావం
  choice: ప్రధాన పాఠంలో ‘దేవుడు మన పక్షాన ఉంటే’
  alternative: ‘దేవుడు మన పక్షాన ఉన్నాడు కాబట్టి’
  rationale: εἰ అనే గ్రీకు రూపాన్ని ప్రధాన పాఠంలో నిలిపి, పౌలు అడిగిన విజయోత్సాహపూరిత అలంకార ప్రశ్న నిర్మాణాన్ని కాపాడింది. సందర్భంలో ఇది దేవుని అనుకూలతపై సందేహం వ్యక్తం చేయడం కాదు; అంగీకరించిన సత్యాన్ని బలంగా ముందుంచడం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే అలంకార ప్రశ్న శైలిని ఉపయోగించాం. ప్రధాన పాఠం గ్రీకు షరతు నిర్మాణాన్ని నిలుపుతుంది; పాదటిప్పణి సందర్భంలో అంతర్లీనంగా ఉన్న నిశ్చయార్థాన్ని తెలియజేస్తుంది.
