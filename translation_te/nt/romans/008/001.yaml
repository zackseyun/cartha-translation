id: ROM.8.1
reference: Romans 8:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐδὲν ἄρα νῦν κατάκριμα τοῖς ἐν Χριστῷ ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/001.yaml
  text: Therefore[b][a], there is now no condemnation for those in Messiah Jesus.
translation:
  language: te
  text: కాబట్టి, మెస్సీయ యేసులో[b] ఉన్నవారికి ఇప్పుడు ఎలాంటి శిక్షావిధీ లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని తరువాతి చేతివ్రాత ప్రతులు, “శరీరానుసారంగా నడుచుకోని” అని చేర్చాయి. అత్యంత ప్రాచీన గ్రీకు సాక్ష్యాలు ఇక్కడి సంక్షిప్త పాఠానికి మద్దతిస్తున్నాయి.
    reason: textual_variant
  - marker: b
    text: లేదా, “క్రీస్తు యేసు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: ఎలాంటి ... లేదు
  rationale: గ్రీకు వాక్యంలోని సంపూర్ణ నిరాకరణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: ἄρα
  choice: కాబట్టి
  rationale: ముందటి వాదన నుండి పౌలు తీసే నిర్ధారణను సూచించే సహజమైన తార్కిక అనుసంధానం.
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: మెస్సీయలో దేవుడు చేసిన కార్యం వల్ల ఏర్పడిన ప్రస్తుత వాస్తవాన్ని గ్రీకు మూలంలాగే స్పష్టంగా నిలుపుతుంది.
- source_word: κατάκριμα
  choice: శిక్షావిధి
  rationale: ఇది కేవలం అపరాధభావాన్ని కాక, ప్రతికూల న్యాయతీర్పును సూచిస్తుంది; ‘శిక్షావిధి’ ఆ న్యాయపరమైన భావాన్ని సహజంగా అందిస్తుంది.
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో ఉన్నవారికి
  rationale: దత్తివ విభక్తిని తెలుగులో ‘వారికి’గా సహజంగా వ్యక్తం చేస్తూనే, పౌలు ఉపయోగించిన ‘లో’ అనే భాగస్వామ్య/ఐక్యత భాషను వివరణాత్మకంగా కుదించకుండా నిలుపుతుంది.
- source_word: Χριστῷ
  choice: మెస్సీయ
  rationale: Χριστός అనే బిరుదు యొక్క అర్థాన్ని అనువదించి, ఈ సందర్భంలో దాని మెస్సీయ సంబంధమైన భావాన్ని నిలుపుతుంది.
- source_word: Ἰησοῦ
  choice: యేసు
  rationale: Ἰησοῦς అనే వ్యక్తినామానికి తెలుగులో ప్రామాణిక రూపం.
theological_decisions:
- issue: ‘మెస్సీయ యేసులో’ అనే పదబంధం యొక్క అర్థం
  choice: మెస్సీయ యేసుకు చెందినవారిని, ఆయనతో భాగస్వామ్యం లేదా ఐక్యతలో ఉన్నవారిని గుర్తించే పదబంధంగా ‘లో’ను యథాతథంగా నిలుపడం.
  alternative: ‘మెస్సీయ యేసు కారణంగా’ వంటి విస్తృత కారణార్థక అనువాదం.
  rationale: ఇక్కడ ἐν అనే పదాన్ని కారణార్థక వివరణగా పరిమితం చేయకుండా, పౌలు ఉద్దేశించిన భాగస్వామ్యం/ఐక్యతకు సంబంధించిన సమృద్ధమైన భావాన్నీ దైవశాస్త్ర సంబంధమైన ఉద్వేగాన్నీ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే న్యాయపరమైన గంభీరతను కాపాడే రీతిలో అనువదించబడింది. ‘మెస్సీయ యేసులో’ అనే నిర్మాణం మూలంలోని భావసాంద్రతను ఉద్దేశపూర్వకంగా నిలుపుతుంది.
