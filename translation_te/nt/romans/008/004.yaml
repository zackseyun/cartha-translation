  source_fidelity: The draft accurately represents the purpose clause (ἵνα), the passive fulfillment (πληρωθῇ), the locative force of ἐν ἡμῖν ('మనలో'), and the paired ethical contrast κατὰ σάρκα ... κατὰ πνεῦμα. The relative participial phrase is also retained without adding a claim that fulfillment occurs 'by us.'
