  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: te
  text: శరీరానుసారంగా కాక,[b] ఆత్మానుసారంగా[c] నడుచుకునే మనలో ధర్మశాస్త్రపు నీతియుక్తమైన ఆవశ్యకత[a] నెరవేరేలా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ధర్మశాస్త్రపు ఆవశ్యకత.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘శరీరం’ అంటే కేవలం భౌతిక దేహం కాదు; దేవునికి విరుద్ధంగా మళ్లిన మానవ జీవన ధోరణిని సూచిస్తుంది. కొందరు దీన్ని ‘పాపస్వభావం’ అని అనువదిస్తారు.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘ఆత్మ’ పరిశుద్ధాత్మను సూచిస్తుందని సందర్భంలో ఎక్కువ సంభావ్యం; ప్రత్యామ్నాయంగా దీనిని మానవ ఆత్మగా కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: నెరవేరేలా
  rationale: ఉద్దేశం లేదా ఫలితాన్ని సూచించే ἵνα భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ δικαίωμα τοῦ νόμου
  choice: ధర్మశాస్త్రపు నీతియుక్తమైన ఆవశ్యకత
  rationale: δικαίωμα లోని న్యాయమైనది/నీతియుక్తమైనది అనే భావాన్నీ, ధర్మశాస్త్రం కోరే దానినీ కలిపి నిలుపుతుంది.
- source_word: πληρωθῇ
  choice: నెరవేరేలా
  rationale: కర్మణి ప్రయోగ భావాన్ని కాపాడుతూ, ἵνα తో కూడిన ఉద్దేశం లేదా ఆశించిన ఫలితాన్ని తెలుపుతుంది.
- source_word: ἐν ἡμῖν
  choice: మనలో
  rationale: ἐν ను నేరుగా అనువదించి, ‘మనచేత’ అనే బలమైన మానవ కార్యసాధక భావాన్ని చేర్చకుండా ఉంటుంది.
- source_word: περιπατοῦσιν
  choice: నడుచుకునే
  rationale: జీవన విధానాన్ని సూచించే పౌలు రూపకాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: σάρξ
  choice: శరీరం
  rationale: మూలపదపు రూపకాన్ని ప్రధాన పాఠ్యంలో నిలుపుతుంది; ఇక్కడి సందర్భార్థాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: రోమా 8 సందర్భంలో పరిశుద్ధాత్మను సూచించే అవకాశమే బలమైనది; తెలుగులో అక్షరరూపం ద్వారా ఈ భేదం స్పష్టంగా కనిపించదు కాబట్టి పాదసూచికలో సందిగ్ధతను నమోదు చేస్తుంది.
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: శరీరానుసారంగా ... ఆత్మానుసారంగా
  rationale: κατά సూచించే ప్రమాణం లేదా దిశను పారదర్శకంగా, సమాంతర నిర్మాణంతో తెలియజేస్తుంది.
theological_decisions:
- issue: πνεῦμα మానవ ఆత్మను సూచిస్తుందా లేక పరిశుద్ధాత్మను సూచిస్తుందా
  choice: ఆత్మ; సందర్భంలో పరిశుద్ధాత్మగా గ్రహించడం ఎక్కువ సంభావ్యం
  alternative: మానవ ఆత్మ లేదా ఆత్మీయ స్వభావం
  rationale: రోమా 8లో పరిశుద్ధాత్మ కార్యం ప్రధానంగా ఉన్నప్పటికీ, గ్రీకు పదరూపం ఒక్కటే ఈ గుర్తింపును పూర్తిగా నిర్బంధించదు; అందువల్ల ప్రధాన పాఠ్యం సంక్షిప్తంగా ఉండగా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: ἐν ἡμῖν అనేది ‘మనలో’నా, ‘మనచేత’నా
  choice: మనలో
  alternative: మన మధ్య; మనచేత
  rationale: ἐν యొక్క ప్రత్యక్ష భావాన్ని నిలుపుతూ, వాక్యం స్పష్టంగా చెప్పని మానవ కార్యసాధకత్వాన్ని చేర్చదు.
- issue: δικαίωμα కేవలం ‘ఆవశ్యకత’నా లేక ‘నీతియుక్తమైన ఆవశ్యకత’నా
  choice: నీతియుక్తమైన ఆవశ్యకత
  alternative: ఆవశ్యకత; నీతిన్యాయం; న్యాయవిధి
  rationale: ధర్మశాస్త్రం కోరే న్యాయమైన లేదా నీతిసంబంధమైన విషయమనే ద్వంద్వ భావాన్ని సాధ్యమైనంతవరకు నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘నడుచుకునే’ అనే బైబిలీయ రూపకాన్ని నిలిపి, ‘అనుసారంగా’ ద్వారా పౌలు వాడిన సమాంతర వ్యత్యాసాన్ని కాపాడాం.
