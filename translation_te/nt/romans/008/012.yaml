source:
  edition: SBLGNT
  text: Ἄρα οὖν, ἀδελφοί, ὀφειλέται ἐσμέν, οὐ τῇ σαρκὶ τοῦ κατὰ σάρκα ζῆν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/012.yaml
  text: So then[a], brothers, we are debtors—not to the flesh[b], to live according to the flesh.
translation:
  language: te
  text: కాబట్టి, సహోదరులారా[a], మనం ఋణస్థులమే—శరీరానుసారంగా జీవించడానికి శరీరానికి[b] ఋణస్థులము కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో అక్షరార్థంగా “సహోదరులారా”; ఇక్కడ ఈ సంబోధన విశ్వాసులైన స్త్రీపురుషులందరినీ ఉద్దేశించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: “శరీరం” ఇక్కడ కేవలం భౌతిక దేహాన్ని కాదు, దేవునికి విరోధంగా ఉండే మానవ స్థితి లేదా ధోరణిని సూచిస్తుంది; “పాప స్వభావం” అనేది వ్యాఖ్యానాత్మక ప్రత్యామ్నాయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: కాబట్టి
  rationale: ఈ జంట అనుమానార్థక అవ్యయాలు ముందటి వాదన నుంచి వచ్చే నిర్ధారణను సూచిస్తాయి; ఆధునిక తెలుగులో ‘కాబట్టి’ ఆ తార్కిక సంధిని సహజంగా తెలియజేస్తుంది.
- source_word: ἀδελφοί
  choice: సహోదరులారా
  rationale: గ్రీకు పదం వ్యాకరణపరంగా పుంలింగ బహువచనం; విశ్వాసుల సమాజమంతటినీ ఉద్దేశించిన సంబోధన కావచ్చని పాదసూచికలో స్పష్టం చేయబడింది.
- source_word: ὀφειλέται ἐσμέν
  choice: మనం ఋణస్థులమే
  rationale: ‘ఋణస్థులు’ అనే రూపం ὀφειλέται లోని ఋణ రూపకాన్ని నిలుపుతుంది; ఇక్కడ ఆర్థిక అప్పు కాక నైతిక బాధ్యత భావం సందర్భం ద్వారా తెలుస్తుంది.
- source_word: σάρξ / σαρκί
  choice: శరీర స్వభావం
  rationale: కేవలం భౌతిక దేహం అనే అపార్థాన్ని తగ్గిస్తూ, పౌలు ఉద్దేశించిన దేవునికి విరోధంగా మొగ్గుచూపే మానవ స్వభావాన్ని తెలియజేస్తుంది; అయినా ‘పాప స్వభావం’ అని పూర్తిగా వ్యాఖ్యానించి ఉద్రిక్తతను తొలగించదు.
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: శరీర స్వభావానికి లోబడి జీవించడానికి
  rationale: κατὰ σάρκα అనే ప్రమాణం లేదా నియంత్రణ భావాన్ని సహజ తెలుగులో తెలియజేస్తూ, ఆ విధంగా జీవించాల్సిన బాధ్యత లేదనే వాక్య సంబంధాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: పౌలు వాడిన σάρξ ను ఈ విరుద్ధతలో ఎలా అనువదించాలి
  choice: శరీర స్వభావం
  alternative: శరీరం; పాప స్వభావం
  rationale: ‘శరీరం’ మాత్రమే అంటే భౌతిక దేహమని అపార్థం కావచ్చు; ‘పాప స్వభావం’ మూలంలోని బహుఅర్థతను పూర్తిగా వ్యాఖ్యానిస్తుంది. ‘శరీర స్వభావం’ సందర్భార్థాన్ని అందిస్తూ పౌలు పదంలోని ఉద్రిక్తతను కొంత నిలుపుతుంది.
- issue: ὀφειλέται లోని ఋణ రూపకాన్ని నిలుపాలా
  choice: ఋణస్థులమే
  alternative: బాధ్యతగలవారమే
  rationale: మూలపదంలోని ఋణ రూపకాన్ని నిలుపుతూ, తరువాతి నిరాకరణతో మన బాధ్యత శరీర స్వభావానికి కాదని బలంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘ఋణస్థులు’ ద్వారా మూలంలోని రూపకం నిలుపబడింది; పునరుక్తి భారాన్ని తగ్గించడానికి రెండవ భాగంలో ‘దానికి’ వాడినా, శరీర స్వభావానికి ఋణం లేదనే వ్యాకరణ సంబంధం స్పష్టంగా ఉంచబడింది.
