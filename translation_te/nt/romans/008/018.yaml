id: ROM.8.18
reference: Romans 8:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: te
  text: ఎందుకంటే, ప్రస్తుత కాలపు బాధలు మనకు[a] బయలుపరచబడబోయే మహిమతో పోలిస్తే సరితూగవని నేను భావిస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనలో.”
    reason: εἰς ἡμᾶς అనే గ్రీకు పదబంధానికి సాధ్యమైన ప్రత్యామ్నాయ భావాన్ని భద్రపరచడం.
lexical_decisions:
- source_word: Λογίζομαι
  choice: నేను భావిస్తున్నాను
  rationale: ఇది కేవలం భావోద్వేగాన్ని కాక, ఆలోచించి చేసిన నిర్ణయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను కలిపే సంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οὐκ ἄξια … πρὸς
  choice: పోల్చదగినవి కావు
  rationale: ప్రస్తుత బాధలకు రాబోయే మహిమకు మధ్య ఉన్న అపారమైన అసమానతను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὰ παθήματα τοῦ νῦν καιροῦ
  choice: ప్రస్తుత కాలపు బాధలు
  rationale: πάθημα అనే పదంలోని అనుభవించే బాధల భావాన్ని, νῦν καιρός అనే ప్రస్తుత సమయ సూచనను సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι
  choice: బయలుపరచబడబోయే మహిమ
  rationale: మహిమ భవిష్యత్తులో ప్రత్యక్షం కానున్నదనే μέλλουσαν భావాన్నీ, అది బయలుపరచబడుతుందనే ἀποκαλυφθῆναι భావాన్నీ సహజమైన తెలుగు క్రియారూపంలో కలిపి తెలియజేస్తుంది.
- source_word: εἰς ἡμᾶς
  choice: మనకు
  rationale: మహిమ విశ్వాసులకు బయలుపరచబడుతుందనే భావానికి ఇది సహజమైన ప్రధాన అనువాదం; ‘మనలో’ అనే భాగస్వామ్య భావసాధ్యతను పాదసూచికలో నిలిపింది.
theological_decisions:
- issue: εἰς ἡμᾶς అనే పదబంధంలో మహిమ బయలుపరచబడే సంబంధం
  choice: మనకు
  alternative: మనలో
  rationale: εἰς ἡμᾶς అనేది మనకు బయలుపరచబడడం లేదా మనలో బయలుపరచబడడం అనే దగ్గరి భావాలను అనుమతిస్తుంది. ప్రధాన పాఠంలో సహజమైన ‘మనకు’ను ఉంచి, వ్యాఖ్యానపరంగా ప్రాముఖ్యమైన ‘మనలో’ను పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. మూలంలోని తార్కిక అనుసంధానం, ప్రస్తుత బాధలు–భవిష్యత్ మహిమ మధ్య పోలిక, εἰς ἡμᾶς లోని నిజమైన అస్పష్టత నిలుపబడ్డాయి.
