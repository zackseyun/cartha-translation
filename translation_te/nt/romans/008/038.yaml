  terminology: దేవదూతలు, ప్రస్తుతం ఉన్నవి, రాబోయేవి, and శక్తులు are suitable. అధికారులు is a viable broad rendering of ἀρχαὶ; the footnote appropriately signals the possible sense of cosmic/spiritual authorities without making that interpretation mandatory.
