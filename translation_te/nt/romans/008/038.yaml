source:
  edition: SBLGNT
  text: πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ⸂ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις⸃
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/038.yaml
  text: For I am convinced that neither death nor life[a], nor angels nor rulers, nor things present nor things to come, nor powers,
translation:
  language: te
  text: 'ఎందుకంటే, నాకు గట్టి నమ్మకం ఉంది: మరణమైనా, జీవమైనా, దేవదూతలైనా, అధికారులైనా,[a] ప్రస్తుతం ఉన్నవైనా, రాబోయేవైనా, శక్తులైనా—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అధికారులు’ అనే పదానికి ‘అధిపతులు’ అని కూడా అనువదించవచ్చు; ఇది విశ్వాతీత లేదా ఆధ్యాత్మిక అధికారాలను సూచిస్తూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: నాకు గట్టి నమ్మకం ఉంది
  rationale: పరిపూర్ణ కాలరూపం గతంలో ఏర్పడి ప్రస్తుతం కొనసాగుతున్న స్థిరమైన నిశ్చయాన్ని సూచిస్తుంది; ఆధునిక తెలుగులో ఈ భావాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి వివరణ లేదా ఆధారాన్ని పరిచయం చేసే అనుసంధాన భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οὔτε ... οὔτε
  choice: '...అయినా, ...అయినా'
  rationale: గ్రీకు నిరాకరణ జాబితా 39వ వచనంలో పూర్తవుతుంది; తెలుగులో పునరావృతమయ్యే ‘అయినా’ నిర్మాణం దాని లయను సహజంగా కొనసాగిస్తుంది.
- source_word: θάνατος
  choice: మరణం
  rationale: ప్రత్యక్షమైన, ప్రామాణిక సమానార్థకం.
- source_word: ζωή
  choice: జీవం
  rationale: ‘మరణం’తో ఉన్న వ్యతిరేక జోడీని నేరుగా నిలుపుతుంది.
- source_word: ἄγγελοι
  choice: దేవదూతలు
  rationale: చుట్టూ ఉన్న విశ్వాతీత శక్తుల జాబితా దృష్ట్యా సాధారణ ‘దూతలు’ కంటే దేవదూతలే ఉద్దేశమని సందర్భం సూచిస్తుంది.
- source_word: ἀρχαὶ
  choice: అధికారులు
  rationale: పాలించే వ్యక్తులు లేదా విశ్వాతీత ఆధ్యాత్మిక అధికారాలు అనే విస్తృత భావాన్ని నిలుపుతూ, సాంకేతిక సిద్ధాంత పదాన్ని ప్రధాన పాఠ్యంలో రుద్దదు.
- source_word: ἐνεστῶτα
  choice: ప్రస్తుతం ఉన్నవి
  rationale: వర్తమాన వాస్తవాలను సూచించే నామవాచకార్థక కృదంతాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: μέλλοντα
  choice: రాబోయేవి
  rationale: భవిష్యత్తులో ఉండబోయే వాస్తవాలను సూచిస్తూ ‘ప్రస్తుతం ఉన్నవి’తో సమాంతరతను నిలుపుతుంది.
- source_word: δυνάμεις
  choice: శక్తులు
  rationale: వ్యక్తిగత లేదా ఆధ్యాత్మిక శక్తులకూ, అవ్యక్త శక్తులకూ వర్తించగల గ్రీకు పదంలోని ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: ἀρχαὶ మరియు δυνάμεις పదాలను ఆధ్యాత్మిక జీవులకు సాంకేతిక పేర్లుగా అనువదించాలా
  choice: ప్రధాన పాఠ్యంలో ‘అధికారులు’, ‘శక్తులు’ అనే విస్తృత పదాలు వాడబడ్డాయి.
  alternative: ‘అధిపత్యాలు’, ‘మహాశక్తులు’ వంటి సాంకేతికంగా వినిపించే పదాలు
  rationale: సందర్భం విశ్వాతీత లేదా ఆధ్యాత్మిక అధికారాలను సూచించే అవకాశం ఉన్నా, గ్రీకు పదాలు విస్తృతార్థాన్ని అనుమతిస్తాయి. ఒక నిర్దిష్ట సిద్ధాంత వ్యవస్థకు పరిమితం చేయకుండా ఆ ఉద్విగ్నతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ఈ వచనం 39వ వచనంలో కొనసాగే ఒకే వాక్యభాగం కాబట్టి చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది. ‘నాకు గట్టి నమ్మకం ఉంది’ అనే ప్రధాన క్రియ గ్రీకు క్రమంలో మొదట ఉన్నప్పటికీ, ఇచ్చిన పాఠ్యంలో అది తప్పక ఉండాలి; అయితే జాబితా సహజ ప్రవాహం కోసం ‘ఎందుకంటే’ తరువాత ఉంచాల్సిన పూర్తి నిర్మాణం ఆదర్శంగా ‘ఎందుకంటే, ... అని నాకు గట్టి నమ్మకం ఉంది’ అవుతుంది, దీని ముగింపు 39వ వచనంతోనే పూర్తవుతుంది.
