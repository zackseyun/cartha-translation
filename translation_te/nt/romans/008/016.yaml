  yaml_path: translation/nt/romans/008/016.yaml
  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: te
  text: ఆత్మే మన ఆత్మతో కలిసి మనం దేవుని పిల్లలమని సాక్ష్యమిస్తున్నాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆత్మే మన ఆత్మకు మనం దేవుని పిల్లలమని సాక్ష్యమిస్తున్నాడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: ఆ ఆత్మే
  rationale: αὐτό ఇచ్చే ఉద్ఘాటనను ‘ఆత్మే’ సహజంగా నిలుపుతుంది; సందర్భంలో ఇది పరిశుద్ధాత్మను సూచిస్తుంది.
- source_word: συμμαρτυρεῖ
  choice: కలిసి సాక్ష్యమిస్తున్నాడు
  rationale: συν- ఉపసర్గ సూచించే సహ లేదా సమాంతర సాక్ష్యాన్ని ‘కలిసి’ స్పష్టంగా వ్యక్తం చేస్తుంది; వర్తమానకాల భావాన్ని ‘సాక్ష్యమిస్తున్నాడు’ నిలుపుతుంది.
- source_word: τῷ πνεύματι ἡμῶν
  choice: మన ఆత్మతో
  rationale: దత్తివిభక్తిని సహచర్యార్థకంగా తీసుకొని, దేవుని ఆత్మ మన ఆత్మతో కలిసి సాక్ష్యమిస్తాడనే నిర్మాణాన్ని నిలుపుతుంది.
- source_word: ὅτι ἐσμὲν
  choice: మనం ... అని
  rationale: ὅτι పరిచయం చేసే విషయవాచక ఉపవాక్యాన్ని సహజమైన తెలుగు పరోక్ష వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: τέκνα θεοῦ
  choice: దేవుని పిల్లలం
  rationale: τέκνα లింగనిరపేక్షంగా ‘పిల్లలు’ అని అర్థం; ‘కుమారులు’ అని పరిమితం చేయకుండా కుటుంబ సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: πνεῦμα యొక్క వ్యక్తిగత క్రియాశీలత
  choice: సాక్ష్యమిస్తున్నాడు
  alternative: సాక్ష్యమిస్తున్నది
  rationale: గ్రీకులో πνεῦμα వ్యాకరణపరంగా నపుంసకలింగమైనా, సందర్భంలో పరిశుద్ధాత్మ వ్యక్తిగత కర్తగా క్రియ చేస్తున్నాడు. తెలుగు సహజ ప్రయోగంలో వ్యక్తిగత గౌరవ ఏకవచనాన్ని వాడటం సూచ్యార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
- issue: సాక్ష్యం ఎవరికి లేదా ఎవరితో అన్న సంబంధం
  choice: మన ఆత్మతో కలిసి
  alternative: మన ఆత్మకు
  rationale: συμμαρτυρεῖ లోని συν- భావం మరియు τῷ πνεύματι ἡμῶν దత్తివిభక్తి కలిసి సహసాక్ష్య భావానికి బలమిస్తాయి; అయినప్పటికీ ‘మన ఆత్మకు’ అనే గ్రహింపు సాధ్యమని పాదటీపులో నమోదు చేయబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘దేవుని పిల్లలు’ అనే పదబంధం τέκνα యొక్క లింగనిరపేక్ష కుటుంబార్థాన్ని నిలుపుతుంది. గ్రీకు పదక్రమంలోని ఉద్ఘాటనను తెలుగులో ‘ఆత్మే’ ద్వారా తెలిపాం.
