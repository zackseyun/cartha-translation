id: ROM.8.35
reference: Romans 8:35
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: te
  text: క్రీస్తు ప్రేమ నుండి మనలను ఎవరు వేరుచేయగలరు? శ్రమా, సంకటమా, హింసించబడటమా, కరవా, వస్త్రహీనతా, ఆపదా, ఖడ్గమా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తుపట్ల మన ప్రేమ నుండి.” గ్రీకు షష్ఠీ విభక్తిని ఈ విధంగానూ అర్థం చేసుకోవచ్చు; అయితే సందర్భం “క్రీస్తు మనపట్ల చూపే ప్రేమ” అనే భావానికే ఎక్కువగా అనుకూలిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: ఎవరు
  rationale: వ్యక్తిని సూచించే ప్రశ్నార్థక సర్వనామాన్ని సహజంగా అనువదించి, పౌలు వేసిన అలంకారిక ప్రశ్నను నిలుపుతుంది.
- source_word: χωρίσει
  choice: వేరుచేస్తారు
  rationale: భవిష్యత్ క్రియ సూచించే వేరుపరచే చర్యను నేరుగా, సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἀγάπης
  choice: ప్రేమ
  rationale: ἀγάπηకు సాధారణమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: τοῦ Χριστοῦ
  choice: క్రీస్తు
  rationale: తెలుగు బైబిలు వాడుకలో Χριστός అనే బిరుదుకు సుపరిచితమైన రూపం; షష్ఠీ విభక్తి సంబంధాన్ని ‘క్రీస్తు ప్రేమ’గా నిలుపుతుంది.
- source_word: θλῖψις
  choice: శ్రమ
  rationale: బాధ, ఒత్తిడి, కష్ట పరిస్థితి అనే విస్తృత భావాన్ని గౌరవప్రదమైన సాధారణ తెలుగులో అందిస్తుంది.
- source_word: στενοχωρία
  choice: ఇబ్బంది
  rationale: ఇరుకు లేదా ఒత్తిడికి గురైన దుస్థితి అనే భావాన్ని ఆధునిక పాఠకులకు సహజంగా తెలియజేస్తుంది; θλῖψιςతో పూర్తిగా కలిసిపోకుండా భేదాన్ని ఉంచుతుంది.
- source_word: διωγμός
  choice: హింస
  rationale: విశ్వాసం కారణంగా వెంటాడటం, పీడించడం అనే సందర్భార్థానికి తెలుగులో స్థిరమైన బైబిలు పదం.
- source_word: λιμός
  choice: కరవు
  rationale: వ్యక్తిగత ఆకలి కంటే తీవ్రమైన ఆహార కొరతను సూచించే మూలపద భావాన్ని ఖచ్చితంగా అందిస్తుంది.
- source_word: γυμνότης
  choice: వస్త్రహీనత
  rationale: బట్టలు లేకపోవడం మరియు దానితో కూడిన నిరుపేద స్థితిని మర్యాదపూర్వకంగా, నేరుగా వ్యక్తపరుస్తుంది.
- source_word: κίνδυνος
  choice: ప్రమాదం
  rationale: సమకాలీన తెలుగులో సహజంగా అర్థమయ్యే ప్రత్యక్ష సమానార్థకం.
- source_word: μάχαιρα
  choice: ఖడ్గం
  rationale: మూలంలోని ఆయుధ చిత్రాన్ని, ప్రాణాంతక హింస ముప్పును వ్యాఖ్యానాత్మకంగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: τοῦ Χριστοῦలోని షష్ఠీ విభక్తి భావం
  choice: క్రీస్తు మనపట్ల చూపే ప్రేమ
  alternative: క్రీస్తుపట్ల మన ప్రేమ
  rationale: గ్రీకు షష్ఠీ విభక్తి రెండు విధాలుగా అర్థం కావచ్చు. రోమా 8:31–39 సందర్భం క్రీస్తు విశ్వాసులపట్ల చూపే ప్రేమను బలంగా సూచిస్తుంది; అయినా ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో ఉంచి అసలులోని వ్యాకరణ సందిగ్ధతను కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అదే సమయంలో గంభీరమైన లేఖా శైలిని కాపాడింది. రెండో ప్రశ్నలో గ్రీకు మూలంలోని నామవాచకాల సంక్షిప్త వరుసను ‘-ఆ’ ప్రశ్నార్థక రూపాలతో నిలిపింది.
