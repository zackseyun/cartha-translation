  to: క్రీస్తు ప్రేమ నుండి మనలను ఎవరు వేరుచేయగలరు? శ్రమా, సంకటమా, హింసించబడటమా, కరవా, వస్త్రహీనతా, ఆపదా, ఖడ్గమా?[a]
  rationale: The revision sharpens three list items for source-level semantic precision while retaining the draft’s structure, register, and genitive-ambiguity footnote. ‘ఎవరు వేరుచేయగలరు?’ naturally expresses the Greek future rhetorical question in Telugu.
