id: ROM.8.34
reference: Romans 8:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: te
  text: దోషిగా తీర్పు తీర్చేవాడు ఎవరు? మరణించినవాడు మెస్సీయే[a]—అంతకంటే ఎక్కువగా, లేపబడినవాడు ఆయనే; దేవుని కుడిపార్శ్వంలో[b] కూడా ఉన్నవాడు, మనకొరకు విజ్ఞాపన చేస్తున్నవాడు కూడా ఆయనే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.”
    reason: lexical_alternative
  - marker: b
    text: “దేవుని కుడిపార్శ్వంలో” అనేది అత్యున్నత గౌరవం మరియు అధికార స్థానాన్ని సూచించే బైబిలు నుడికారం.
    reason: cultural_note
lexical_decisions:
- source_word: κατακρινῶν
  choice: దోషిగా తీర్పు చెప్పేవారు
  rationale: న్యాయస్థాన సంబంధమైన ‘condemn’ భావాన్ని స్పష్టంగా తెలియజేస్తూ, నామవాచకంగా వాడిన వర్తమాన కృదంతాన్ని సహజమైన తెలుగు వ్యక్తీకరణగా అందిస్తుంది.
- source_word: Χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ పదాన్ని అర్థవంతమైన బిరుదుగా గ్రహించి, కేవలం పేరులా లిప్యంతరీకరించకుండా దాని బిరుదు స్వభావాన్ని నిలుపుతుంది.
- source_word: ἀποθανών
  choice: చనిపోయినవాడు
  rationale: ఒకసారి జరిగిన చారిత్రక కార్యాన్ని సులభమైన భూతార్థక కృదంత రూపంలో సహజంగా తెలియజేస్తుంది.
- source_word: μᾶλλον δὲ
  choice: అంతకంటే మించి
  rationale: మరణం నుంచి పునరుత్థానం వైపు వాక్యంలో ఉన్న భావతీవ్రతను, ఉన్నతికి తీసుకెళ్లే మలుపును నిలుపుతుంది.
- source_word: ἐγερθείς
  choice: లేపబడినవాడు
  rationale: గ్రీకు కర్మణి ప్రయోగాన్ని అలాగే నిలుపుతూ, ‘తానే లేచాడు’ అనే కర్తరి అర్థాన్ని అనువాదంలో చేర్చదు.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: దేవుని కుడివైపున
  rationale: గౌరవం, అధికారంతో కూడిన స్థానాన్ని సూచించే బైబిలు నుడికారాన్ని సమీపంగా, సహజంగా అందిస్తుంది.
- source_word: ἐντυγχάνει ὑπὲρ ἡμῶν
  choice: మన పక్షంగా విజ్ఞాపన చేస్తున్నవాడు
  rationale: దేవుని ఎదుట ఇతరుల మేలు కోసం ప్రాతినిధ్యం వహించి వేడుకొనే భావాన్ని వర్తమాన కొనసాగింపు సహా స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: Χριστός అనే బిరుదు యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός రక్షణ వాదనలో అర్థవంతమైన బిరుదుగా పనిచేస్తుంది; అందువల్ల దాని బిరుదు భావాన్ని ప్రధాన పాఠ్యంలో వ్యక్తం చేసి, సంప్రదాయ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ἐγερθείς యొక్క వాచ్యం
  choice: లేపబడినవాడు
  alternative: లేచినవాడు
  rationale: మూలంలోని కర్మణి రూపాన్ని కాపాడి, మెస్సీయను లేపిన కార్యం ఆయనకు చేయబడినదిగా వాక్యం చూపించే విధానాన్ని మార్చకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే న్యాయస్థాన, మధ్యవర్తిత్వ పదజాలం వాడబడింది. గ్రీకు వాక్యంలోని అలంకార ప్రశ్నను, మరణం నుంచి లేపబడటానికి వెళ్లే భావతీవ్రతను, వరుసగా వచ్చే ὅς నిర్మాణాల ఉద్ఘాటనను సహజమైన తెలుగు పునరుక్తితో నిలిపాం.
