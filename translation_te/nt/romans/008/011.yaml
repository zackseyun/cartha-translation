id: ROM.8.11
reference: Romans 8:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: te
  text: మృతులలోనుండి యేసును లేపినవాని ఆత్మ మీలో నివసిస్తే, మృతులలోనుండి మెస్సీయ యేసును[a] లేపినవాడు మీలో నివసించే తన ఆత్మ కారణంగా[b] మీ మర్త్య శరీరాలకు కూడా జీవం ఇస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో “క్రీస్తు యేసు”; “క్రీస్తు” అంటే “మెస్సీయ,” అంటే అభిషిక్తుడు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీలో నివసించే తన ఆత్మ ద్వారా.” కొన్ని గ్రీకు ప్రతుల్లో ఇక్కడ సాధనార్థాన్ని సూచించే జనిటివ్ పాఠం ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: పౌలు వాదనలో ఇక్కడ పరిశుద్ధాత్మ ఉద్దేశించబడ్డాడు; రెండు చోట్లా ఒకే పదాన్ని వాడడం మూలపాఠంలోని అనుసంధానాన్ని నిలుపుతుంది.
- source_word: ἐγείραντος / ἐγείρας
  choice: లేపిన
  rationale: మృతులలోనుండి శరీర పునరుత్థానాన్ని తెలుగులో సహజంగా, స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: మృతుల మధ్యనుండి లేపబడిన భావాన్ని మూలానికి దగ్గరగా ఉంచుతుంది.
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: నివసిస్తే / నివసించే
  rationale: రెండు రూపాల మధ్య ఉన్న పదసంబంధాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: Χριστὸν Ἰησοῦν
  choice: మెస్సీయ యేసును
  rationale: Χριστόςను కేవలం పేరులో భాగంగా కాక, అభిషిక్తుడైన మెస్సీయ అనే బిరుదుగా వ్యక్తపరుస్తుంది.
- source_word: ζῳοποιήσει
  choice: జీవం ఇస్తాడు
  rationale: భవిష్యత్తులో దేవుడు చేసే జీవపరిచే కార్యాన్ని సరళంగా, సహజంగా తెలియజేస్తుంది.
- source_word: θνητὰ σώματα
  choice: మర్త్య శరీరాలకు
  rationale: శరీరాల వాస్తవికతనూ అవి మరణానికి లోబడినవనే భావాన్నీ నేరుగా నిలుపుతుంది.
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: మీలో నివసించే తన ఆత్మ కారణంగా
  rationale: SBLGNTలో διά తరువాత ఉన్న accusative నిర్మాణానికి సహజమైన కారణార్థాన్ని ప్రధాన పాఠంలో అనుసరిస్తుంది.
theological_decisions:
- issue: చివరి పదబంధంలోని διά నిర్మాణం కారణాన్నా, సాధనాన్నా సూచిస్తుంది?
  choice: మీలో నివసించే తన ఆత్మ కారణంగా
  alternative: మీలో నివసించే తన ఆత్మ ద్వారా
  rationale: అందించిన SBLGNT పాఠంలోని accusative నిర్మాణం కారణార్థానికి మద్దతిస్తుంది. సుపరిచితమైన సాధనార్థాన్ని ప్రధాన పాఠంలోకి మౌనంగా చేర్చకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: Χριστόςను పేరుగా చూపాలా, బిరుదుగా చూపాలా?
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఈ సందర్భంలో Χριστόςకు బిరుదు బలం ఉన్నందున దాని అర్థాన్ని ప్రధాన పాఠంలో స్పష్టంగా ఉంచాం; సంప్రదాయ రూపాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. ‘మృతులలోనుండి,’ ‘నివసించే,’ ‘మర్త్య శరీరాలు’ వంటి పదాలు మూలంలోని శరీర పునరుత్థానం, ఆత్మ నివాసం, మరణశీలత అనే భావాలను స్పష్టంగా నిలుపుతాయి.
