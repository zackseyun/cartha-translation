source:
  edition: SBLGNT
  text: ἡ γὰρ ἀποκαραδοκία τῆς κτίσεως τὴν ἀποκάλυψιν τῶν υἱῶν τοῦ θεοῦ ἀπεκδέχεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/019.yaml
  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: te
  text: ఎందుకంటే, సృష్టి దేవుని కుమారులు బయలుపరచబడడం కోసం ఎంతో ఆత్రుతతో ఎదురుచూస్తోంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని పిల్లలు.” గ్రీకులో “కుమారులు” అని ఉంది; అది పుత్రస్థానాన్ని, వారసత్వ హోదాను కూడా నొక్కిచెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంతో ఉన్న వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ἀποκαραδοκία
  choice: ఎంతో ఆత్రుతతో
  rationale: తీవ్రమైన, ముందుచూసే నిరీక్షణను తెలుగులో సహజంగా తెలిపేందుకు క్రియావిశేషణ పదబంధంగా అనువదించబడింది.
- source_word: κτίσεως
  choice: సృష్టి
  rationale: సందర్భంలోని విశ్వవ్యాప్త భావానికి తగినట్లుగా సృష్టించబడిన సమస్త వ్యవస్థను సమష్టిగా సూచిస్తుంది.
- source_word: ἀποκάλυψιν
  choice: బయలుపరచబడడం
  rationale: ఇప్పటివరకు మరుగై ఉన్న దేవుని కుమారుల స్థితి భవిష్యత్తులో ప్రత్యక్షమవడాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: υἱῶν
  choice: కుమారులు
  rationale: గ్రీకు మూలంలోని పుంలింగ బహువచనాన్ని నిలుపుతూ, పౌలు వాదనలోని పుత్రస్థానం మరియు వారసత్వ భావసూచనను కూడా కాపాడుతుంది.
- source_word: θεοῦ
  choice: దేవుని
  rationale: సంబంధాన్ని తెలిపే గ్రీకు షష్ఠీ విభక్తిని సహజమైన తెలుగు సంబంధరూపంతో వ్యక్తం చేస్తుంది.
- source_word: ἀπεκδέχεται
  choice: ఎదురుచూస్తోంది
  rationale: రాబోయేదాని కోసం నిరీక్షించడాన్ని తెలుపుతుంది; దాని తీవ్రతను ఇప్పటికే ‘ఎంతో ఆత్రుతతో’ తెలియజేస్తున్నందున అనవసర పునరుక్తి నివారించబడింది.
theological_decisions:
- issue: υἱῶν θεοῦ అనే పదబంధాన్ని లింగసమావేషకంగా ‘దేవుని పిల్లలు’ అని అనువదించాలా, లేక మూలంలోని పుంలింగాన్ని ‘దేవుని కుమారులు’గా నిలుపాలా?
  choice: దేవుని కుమారులు
  alternative: దేవుని పిల్లలు
  rationale: గ్రీకు పదం స్పష్టంగా పుంలింగ బహువచనంలో ఉంది. ‘కుమారులు’ అనే రూపం పౌలు సందర్భంలోని పుత్రస్థానం, వారసత్వ హోదా వంటి భావసూచనలను కూడా నిలుపుతుంది; ఇక్కడ అది పురుషులకు మాత్రమే పరిమితమని తప్పనిసరిగా సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ఎంతో ఆత్రుతతో ఎదురుచూస్తోంది’ అనే నిర్మాణం గ్రీకు నామవాచక-క్రియా కలయిక బలాన్ని పాఠకులకు సులభంగా అర్థమయ్యే రీతిలో అందిస్తుంది.
