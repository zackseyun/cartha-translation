source:
  edition: SBLGNT
  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: te
  text: ఎందుకంటే సృష్టి వ్యర్థతకు[a] లోబరచబడింది—తన ఇష్టంతో కాదు, దానిని లోబరచినవాని వల్ల[b]—నిరీక్షణతో[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘వ్యర్థత’కు బదులుగా ‘నిష్ఫలత,’ ‘నిరర్థకత’ లేదా ‘వైఫల్య స్థితి’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘దానిని లోబరచినవాడు’ ఎవరో గ్రీకు పాఠ్యం స్పష్టంగా చెప్పదు.
    reason: alternative_reading
  - marker: c
    text: లేదా ‘నిరీక్షణలో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: వ్యర్థతకు
  rationale: ఇక్కడ ఈ పదం నైతిక చెడును కాకుండా, సృష్టి తన ఉద్దేశిత గమ్యాన్ని చేరలేని నిష్ఫల స్థితిని సూచిస్తుంది. ‘వ్యర్థత’ ఆ భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: κτίσις
  choice: సృష్టి
  rationale: రోమా 8:19–22 సందర్భంలో ఇది ఒక ప్రాణిని కాకుండా సమష్టిగా సృష్టిలోకాన్ని సూచిస్తుంది; ‘సృష్టి’ సహజమైన విస్తృత పదం.
- source_word: ὑπετάγη
  choice: లోబరచబడింది
  rationale: గ్రీకు కర్మణి రూపం సృష్టిపై ఈ స్థితి విధించబడిందని సూచిస్తుంది; తెలుగు కర్మణి రూపం ఆ భావాన్ని నిలుపుతుంది.
- source_word: οὐχ ἑκοῦσα
  choice: తన ఇష్టంతో కాదు
  rationale: సృష్టి స్వచ్ఛందంగా దీనిని ఎంచుకోలేదనే భావాన్ని సాధారణ ఆధునిక తెలుగులో స్పష్టంగా తెలుపుతుంది.
- source_word: διὰ τὸν ὑποτάξαντα
  choice: దానిని లోబరచినవాని కారణంగా
  rationale: διά + accusative యొక్క కారణార్థాన్ని నిలుపుతూ, లోబరచినవాని గుర్తింపును వాక్యంలో నిర్ధారించకుండా ఉంచుతుంది.
- source_word: ἐφ’ ἑλπίδι
  choice: నిరీక్షణతో
  rationale: ముందున్న విమోచన వైపు చూసే భావాన్ని సంక్షిప్తంగా అందిస్తుంది; ‘నిరీక్షణలో’ అనే ప్రత్యామ్నాయ భావ ఛాయను పాదటిప్పణిలో ఉంచాం.
theological_decisions:
- issue: సృష్టిని లోబరచినవాని గుర్తింపు
  choice: ప్రధాన పాఠ్యంలో ‘దానిని లోబరచినవాని’ అని మాత్రమే ఉంచడం
  alternative: దేవుడు అని స్పష్టీకరించడం; ఆదాము పతనాన్ని కారణకర్తగా పేర్కొనడం; సాతాను అని అర్థం చేసుకోవడం
  rationale: గ్రీకు వాక్యం ఆ వ్యక్తిని ప్రత్యక్షంగా గుర్తించదు. కాబట్టి వ్యాఖ్యానంతో ఉద్రిక్తతను పరిష్కరించకుండా మూలంలోని అనిశ్చితిని నిలుపుతున్నాం.
- issue: ἐφ’ ἑλπίδι యొక్క అనుసంధానం
  choice: ‘నిరీక్షణతో’ అని చివర ఉంచి లోబరచడంలో నిరీక్షణ ఉన్న భావాన్ని నిలుపడం
  alternative: ‘నిరీక్షణలో’ అని అనువదించడం లేదా తదుపరి వాక్యంతో బలంగా అనుసంధానించడం
  rationale: గ్రీకు పదబంధం సంక్షిప్తంగా ఉండి దాని అనుసంధానంలో కొంత భావసౌలభ్యం ఉంది; తెలుగు పాఠ్యం దానిని అతిగా విప్పకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని కర్మణి ప్రయోగం, కారణార్థం, మరియు లోబరచినవాని గుర్తింపుపై ఉన్న అనిశ్చితి నిలుపబడ్డాయి.
