revisions:
- from: ఎందుకంటే, మిమ్మల్ని మళ్లీ భయానికి నడిపించే బానిసత్వపు ఆత్మను మీరు పొందలేదు; దానికి బదులుగా, కుమారులుగా దత్తత పొందే ఆత్మను పొందారు.[a] ఆ ఆత్మలోనే[b] మనం, “అబ్బా! తండ్రీ!” అని కేక వేస్తాం.
  to: ఎందుకంటే, మిమ్మల్ని మళ్లీ భయానికి నడిపించే బానిసత్వపు ఆత్మను మీరు పొందలేదు; దానికి బదులుగా, కుమారులుగా దత్తత పొందించే ఆత్మను పొందారు.[a] ఆ ఆత్మలో[b] మనం, “అబ్బా! తండ్రీ!” అని కేక వేస్తాం.
  rationale: A necessary semantic correction changes “పొందే” (“receiving”) to “పొందించే” (“bringing about/granting”), so that the Telugu reflects the genitive relation in πνεῦμα υἱοθεσίας rather than reversing it. The unrepresented emphatic “నే” is also removed. The footnote anchors and their order remain valid and unchanged.
