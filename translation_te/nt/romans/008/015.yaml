id: ROM.8.15
reference: Romans 8:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: te
  text: ఎందుకంటే, మిమ్మల్ని మళ్లీ భయానికి నడిపించే బానిసత్వపు ఆత్మను మీరు పొందలేదు; దానికి బదులుగా, కుమారులుగా దత్తత పొందించే ఆత్మను పొందారు.[a] ఆ ఆత్మలో[b] మనం, “అబ్బా! తండ్రీ!” అని కేక వేస్తాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుమారులుగా దత్తతనిచ్చే పరిశుద్ధాత్మను పొందారు.” సందర్భం పరిశుద్ధాత్మను సూచిస్తుంది; అయితే గ్రీకు వాక్య నిర్మాణం ముందున్న “బానిసత్వపు ఆత్మ”తో సమాంతరంగా ఉంది.
    reason: alternative_reading
  - marker: b
    text: మరింత అక్షరార్థంగా, “ఆయనలో” లేదా “దానిలో.” గ్రీకులోని సంబంధ సర్వనామం ‘ఆత్మ’ అనే నపుంసకలింగ పదానికి అనుగుణంగా ఉంది; సందర్భంలో అది పరిశుద్ధాత్మను సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: బానిసత్వపు ఆత్మ
  rationale: δουλείαలోని బానిసత్వ భావాన్ని స్పష్టంగా ఉంచుతూ, తరువాతి πνεῦμα υἱοθεσίαςతో ఉన్న సమాంతర నిర్మాణాన్ని కాపాడుతుంది.
- source_word: πάλιν εἰς φόβον
  choice: మిమ్మల్ని మళ్లీ భయానికి నడిపించే
  rationale: πάλινలోని ‘మళ్లీ’ భావాన్నీ, εἰς φόβονలోని భయం వైపు/భయంలోకి తీసుకెళ్లే దిశాత్మక భావాన్నీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: πνεῦμα υἱοθεσίας
  choice: కుమారులుగా దత్తత పొందే ఆత్మ
  rationale: υἱοθεσίαలోని చట్టపరమైన కుమార హోదా మరియు వారసత్వ సూచనను నిలుపుతూ, πνεῦμα వ్యక్తిగత పరిశుద్ధాత్మనా లేక ప్రసాదించబడిన స్థితి/స్వభావమా అన్న వ్యాకరణాత్మక ఉద్రిక్తతను పూర్తిగా పరిష్కరించదు.
- source_word: ἐν ᾧ
  choice: ఆ ఆత్మలోనే
  rationale: గ్రీకు ἐν ᾧను రూపపరంగా దగ్గరగా అనుసరిస్తూ ‘ఆయన ద్వారా’ అని వ్యక్తిగత అర్థాన్ని ముందుగానే నిర్బంధించకుండా ఉంటుంది.
- source_word: κράζομεν
  choice: కేక వేస్తాం
  rationale: క్రియలోని బలమైన, ఆర్తితో కూడిన పిలుపు భావాన్ని సాధారణ ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: Αββα ὁ πατήρ
  choice: అబ్బా! తండ్రీ!
  rationale: అరామీయ సంబోధనను లిప్యంతరీకరించి, గ్రీకు వివరణాత్మక సంబోధనను తెలుగులో సహజంగా అందిస్తుంది.
theological_decisions:
- issue: πνεῦμα υἱοθεσίας పరిశుద్ధాత్మను నేరుగా సూచిస్తుందా, లేక దత్తతకు సంబంధించిన ‘ఆత్మ/స్థితి’ని సూచిస్తుందా?
  choice: ప్రధాన పాఠ్యంలో ‘కుమారులుగా దత్తత పొందే ఆత్మ’ అని ఉంచి, ‘ఆ ఆత్మలోనే’ అని అనువదించడం
  alternative: ‘కుమారులుగా దత్తతనిచ్చే పరిశుద్ధాత్మను పొందారు; ఆయన ద్వారా మనం…’
  rationale: రోమా 8 సందర్భం పరిశుద్ధాత్మను బలంగా సూచించినప్పటికీ, అనర్తిక πνεῦμα మరియు ‘బానిసత్వపు ఆత్మ’తో సమాంతరత కొంత నిజమైన సందిగ్ధతను మిగులుస్తాయి. అందువల్ల ప్రధాన పాఠ్యం దానిని అనవసరంగా పూర్తిగా పరిష్కరించదు.
- issue: υἱοθεσίαలోని లింగ-నిర్దిష్ట కుమార హోదా
  choice: ‘కుమారులుగా దత్తత’
  alternative: ‘దత్తత’ లేదా ‘దేవుని పిల్లలుగా స్వీకారం’
  rationale: పౌలు కాలపు చట్టపరమైన కుమార హోదా మరియు వారసత్వ భావాన్ని నిలుపుతుంది; ఇది ప్రయోజనం పురుషులకు మాత్రమే పరిమితమని సూచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు సహజంగా ఉండే శైలి. ‘అబ్బా’ను లిప్యంతరీకరించి, ‘తండ్రీ’ను ప్రత్యక్ష సంబోధనగా ఉంచాం. ‘కేక వేస్తాం’ κράζομενలోని తీవ్రతను నిలుపుతుంది.
