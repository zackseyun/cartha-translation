id: ROM.8.24
reference: Romans 8:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: te
  text: ఎందుకంటే, మనం నిరీక్షణలో రక్షించబడ్డాం.[a] అయితే కనిపించే నిరీక్షణ నిరీక్షణ కాదు.[b] ఎందుకంటే, ఎవరు చూసేదాని కోసం నిరీక్షిస్తారు?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిరీక్షణ ద్వారా మనం రక్షించబడ్డాం.”
    reason: alternative_reading
  - marker: b
    text: అంటే, నిరీక్షణ ఇంకా కంటికి కనిపించనిదానికి సంబంధించినది.
    reason: cross_reference
lexical_decisions:
- source_word: τῇ ἐλπίδι
  choice: నిరీక్షణలోనే
  rationale: 'ఈ దత్తి విభక్తి ఇక్కడ స్థితి లేదా విధానాన్ని సూచిస్తున్నదిగా తీసుకోవడం సందర్భానికి సరిపోతుంది: రక్షణ నిజంగా లభించినదే అయినా, దాని సంపూర్ణత ఇంకా కంటికి కనిపించలేదు. ‘లోనే’ అనే రూపం ఈ భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది; సాధనార్థక భావాన్ని మాత్రమే నిర్బంధంగా విధించదు.'
- source_word: ἐσώθημεν
  choice: మనం రక్షించబడ్డాం
  rationale: అనిర్దిష్ట భూతకాల కర్మణి రూపాన్ని తెలుగులో సహజమైన భూతకాల కర్మణి రూపంతో ఇచ్చి, రక్షణను మనుషులు తమకు తామే సాధించుకున్నట్లు కాకుండా మూలంలోని కర్మణి భావాన్ని నిలిపాం.
- source_word: ἐλπὶς ... βλεπομένη
  choice: కనిపించే నిరీక్షణ
  rationale: కృదంతాన్ని సహజమైన విశేషణ రూపంలో ఇచ్చి, నిరీక్షణకూ చూడడానికీ మధ్య పౌలు ఉంచిన ప్రత్యక్ష విరోధాన్ని కాపాడాం.
- source_word: οὐκ ἔστιν ἐλπίς
  choice: నిరీక్షణే కాదు
  rationale: గ్రీకు వాక్యంలోని గుణాత్మక నిరాకరణను తెలుగులో స్పష్టంగా, బలంగా వ్యక్తం చేస్తుంది.
- source_word: ὃ ... βλέπει
  choice: తాను చూసేదాని
  rationale: నపుంసక సంబంధ సర్వనామాన్ని తెలుగులో వస్తువును సూచించే ‘దాని’తో ఇచ్చాం. ‘తాను’ సాధారణ మానవ వ్యక్తిని సూచిస్తుంది; పురుష లింగాన్ని అనవసరంగా చేర్చదు.
- source_word: τίς ἐλπίζει
  choice: ఎవరు నిరీక్షిస్తారు?
  rationale: ప్రశ్నార్థకమైన, సామెతసదృశ సాధారణ ప్రకటనను వర్తమాన భావంతో సహజమైన తెలుగులో నిలిపాం.
theological_decisions:
- issue: τῇ ἐλπίδι ἐσώθημεν లో రక్షణకూ నిరీక్షణకూ ఉన్న సంబంధం
  choice: ప్రధాన పాఠంలో ‘నిరీక్షణలోనే మనం రక్షించబడ్డాం’ అని ఇచ్చాం.
  alternative: ‘నిరీక్షణ ద్వారా మనం రక్షించబడ్డాం’
  rationale: రోమా 8 సందర్భంలో రక్షణ ఇప్పటికే నిజమైనదే అయినా దాని సంపూర్ణ ప్రత్యక్షత ఇంకా రాబోతోంది. ‘నిరీక్షణలోనే’ అనే అనువాదం ఈ ఇప్పటికే/ఇంకా కాదు అనే ఉద్వేగాన్ని నిలుపుతుంది; నిరీక్షణనే రక్షణకు కార్యసాధక కారణంగా నిర్ణయించదు.
- issue: ‘కనిపించే నిరీక్షణ’ అనే మాటలోని ఉద్దేశపూర్వక విరోధాభాసం
  choice: మూలంలోని ‘కనిపించే నిరీక్షణ’ అనే నిర్మాణాన్ని ప్రధాన పాఠంలో నిలిపాం.
  alternative: ‘ఇప్పటికే కనిపిస్తున్న దాని గురించి నిరీక్షణ ఉండదు’ అని వివరణాత్మకంగా మార్చడం
  rationale: వివరణాత్మక ప్రత్యామ్నాయం భావాన్ని సులభం చేసినా, పౌలు వాడిన సంక్షిప్తమైన వాక్చాతుర్యాన్ని తొలగిస్తుంది. అర్థాన్ని పాదసూచికలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడాం. ‘నిరీక్షణ’ అనే పదం సందర్భంలోని భవిష్యత్ నిరీక్షణను, ఆధ్యాత్మిక గంభీరతను రెండింటినీ సహజంగా మోస్తుంది. ప్రతి పాదసూచిక గుర్తును ప్రధాన పాఠంలో చేర్చాం.
