id: ROM.8.5
reference: Romans 8:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: te
  text: ఎందుకంటే, శరీరం ప్రకారం జీవించేవారు శరీరానికి సంబంధించిన వాటిపై మనసు పెడతారు; అయితే ఆత్మ ప్రకారం జీవించేవారు ఆత్మకు సంబంధించిన వాటిపై మనసు పెడతారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σάρκα / τὰ τῆς σαρκὸς
  choice: శరీరం ప్రకారం / శరీరానికి సంబంధించినవి
  rationale: σάρξ అనే పదానికి ఉన్న ‘శరీరం/మాంసం’ రూపకాన్ని నిలుపుతూ, దానిని నేరుగా ‘పాప స్వభావం’గా వ్యాఖ్యానించి మూలంలోని విస్తృత భావాన్ని కుదించలేదు.
- source_word: φρονοῦσιν
  choice: మనసు పెడతారు
  rationale: ఈ క్రియ కేవలం ఆలోచించడమే కాక, మనస్సు యొక్క దిశ, ఆసక్తి, అభిముఖతను సూచిస్తుంది; ఆధునిక తెలుగులో ‘మనసు పెడతారు’ ఈ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κατὰ πνεῦμα / τὰ τοῦ πνεύματος
  choice: ఆత్మ ప్రకారం / ఆత్మకు సంబంధించినవి
  rationale: సమీప సందర్భంలో πνεῦμα దేవుని ఆత్మను సూచించినప్పటికీ, మూలపాఠంలోని సంక్షిప్తతను కాపాడుతూ వివరణాత్మక పదాలను చేర్చలేదు.
- source_word: οἱ ... ὄντες
  choice: జీవించేవారు
  rationale: అక్షరార్థంగా ‘ఉన్నవారు’ అయినా, κατὰ σάρκα అనే జీవనాభిముఖతను సహజ తెలుగులో వ్యక్తం చేయడానికి ‘జీవించేవారు’ ఉపయోగించబడింది.
theological_decisions:
- issue: σάρξ ను ‘పాప స్వభావం’గా స్పష్టీకరించాలా?
  choice: శరీరం
  alternative: పాప స్వభావం
  rationale: ‘పాప స్వభావం’ అనేది సాధ్యమైన వ్యాఖ్యానం అయినా, అది σάρξ యొక్క రూపక విస్తృతిని ఒక నిర్దిష్ట సిద్ధాంత పదబంధానికి పరిమితం చేస్తుంది. అందువల్ల మూలంలోని ఉద్రిక్తతను నిలిపాము.
- issue: πνεῦμα ను ‘దేవుని ఆత్మ’గా విస్తరించాలా?
  choice: ఆత్మ
  alternative: దేవుని ఆత్మ
  rationale: రోమా 8 సందర్భం పరిశుద్ధాత్మను బలంగా సూచిస్తుంది; అయినా ఈ వాక్యంలో లేని ‘దేవుని’ అనే పదాన్ని చేర్చకుండా మూల నిర్మాణాన్ని కాపాడాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. మూలంలోని శరీరం—ఆత్మ సమాంతర వ్యత్యాసాన్ని స్పష్టంగా నిలిపి, రెండవ భాగంలో కూడా తెలుగులో సహజ పఠనార్థం ‘మనసు పెడతారు’ అనే క్రియను పునరుక్తం చేశాము.
