- from: ఎందుకంటే, శరీరం ప్రకారం జీవించేవారు శరీరానికి సంబంధించిన వాటిపైనే మనసు పెడతారు; అయితే ఆత్మ ప్రకారం జీవించేవారు ఆత్మకు సంబంధించిన వాటిపైనే మనసు పెడతారు.
  to: ఎందుకంటే, శరీరం ప్రకారం జీవించేవారు శరీరానికి సంబంధించిన వాటిపై మనసు పెడతారు; అయితే ఆత్మ ప్రకారం జీవించేవారు ఆత్మకు సంబంధించిన వాటిపై మనసు పెడతారు.
