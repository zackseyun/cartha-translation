id: ROM.8.17
reference: Romans 8:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: te
  text: మనం పిల్లలమైతే, వారసులం కూడా—దేవుని వారసులం, మెస్సీయాతో సహవారసులం—నిజంగానే మనం ఆయనతో కలిసి బాధలు అనుభవిస్తుంటే, మనమూ ఆయనతో కలిసి మహిమపరచబడేందుకు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: పిల్లలు
  rationale: లింగాన్ని నిర్దేశించని బహువచనం; దేవుని కుటుంబంలో సంతానస్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: κληρονόμοι
  choice: వారసులు
  rationale: స్వాస్థ్యాన్ని పొందేవారిని సూచించే ప్రామాణిక న్యాయ-కుటుంబ పదం.
- source_word: θεοῦ
  choice: దేవుని
  rationale: సంబంధాన్ని తెలిపే గ్రీకు షష్ఠీ విభక్తిని నేరుగా, సహజంగా ప్రతిబింబిస్తుంది.
- source_word: συγκληρονόμοι
  choice: సహవారసులు
  rationale: συν- ఉపసర్గలోని కలిసి స్వాస్థ్యం పొందే భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: Χριστοῦ
  choice: క్రీస్తుతో
  rationale: Χριστός అనే బిరుదుకు తెలుగులో స్థిరపడిన రూపం; సహవారసత్వ సంబంధాన్ని ‘తో’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἴπερ
  choice: నిజంగానే … అయితే
  rationale: నిజమైన షరతుతో పాటు వక్త ఆశించే వాస్తవాన్ని సూచించే బలాన్ని కాపాడుతుంది.
- source_word: συμπάσχομεν
  choice: ఆయనతో కలిసి బాధలు అనుభవిస్తున్నాం
  rationale: వర్తమానకాల భావాన్నీ, συν-లోని క్రీస్తుతో పాలుపంచుకునే భావాన్నీ స్పష్టంగా ఉంచుతుంది.
- source_word: ἵνα
  choice: మహిమపరచబడేందుకు
  rationale: ఉద్దేశం లేదా ఫలితాన్ని ముందుగానే ఒక్కదానిగా నిర్ణయించకుండా తెలుగు ప్రయోజనార్థక నిర్మాణంతో వ్యక్తం చేస్తుంది.
- source_word: συνδοξασθῶμεν
  choice: ఆయనతో కలిసి మనం కూడా మహిమపరచబడడం
  rationale: కర్మణి భావాన్నీ, క్రీస్తుతో కలిసి మహిమలో పాలుపంచుకోవడాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: εἴπερ συμπάσχομενలోని బాధానుభవం ప్రతిఫలాన్ని సంపాదించే అర్హతా, లేక క్రీస్తుతో ఐక్యతలో భాగస్వామ్యపు షరతా?
  choice: ‘నిజంగానే ఆయనతో కలిసి బాధలు అనుభవిస్తున్నామైతే’ అని నిజమైన షరతుగా అనువదించాం; అది మహిమను సంపాదిస్తుందని చెప్పలేదు.
  alternative: ‘ఆయనతో కలిసి బాధలు అనుభవిస్తున్నాం కాబట్టి’ అని నిశ్చయార్థకంగా చేయడం, లేదా బాధలు మహిమను సంపాదిస్తాయని సూచించడం.
  rationale: εἴπερలో షరతు నిజంగా ఉంది; సందర్భం మాత్రం క్రీస్తుతో కలిసి బాధపడటం, మహిమ పొందటం అనే భాగస్వామ్యాన్ని చెబుతుంది. అందువల్ల వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా ఉంచాం.
- issue: ἵνα ఉద్దేశాన్నా ఫలితాన్నా సూచిస్తుంది?
  choice: ‘మహిమపరచబడేందుకు’ అనే నిర్మాణంతో రెండు అవకాశాలకు తగిన విస్తృతి ఉంచాం.
  alternative: కేవలం ‘దాని ఫలితంగా మహిమపరచబడతాం’ లేదా ‘మహిమను సంపాదించడానికి’ అని నిర్ణయాత్మకంగా అనువదించడం.
  rationale: ఈ సందర్భంలో ఉద్దేశం-ఫలితం మధ్య భావసామీప్యం ఉంది; మూలపాఠం కంటే ఎక్కువగా నిర్ణయించడం నివారించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పిల్లలు,’ ‘వారసులు,’ ‘సహవారసులు’ అనే కుటుంబ-స్వాస్థ్య పదబంధాన్ని కొనసాగించాం. మూలంలోని దీర్ఘ షరతు నిర్మాణాన్ని డాష్‌లతో పఠనయోగ్యంగా చేశాం. అందించిన ఆంగ్ల [a] గమనిక ‘children’ వద్ద ఉన్నప్పటికీ దాని పాఠ్యం Χριστοῦ అనువాద ప్రత్యామ్నాయానికి సంబంధించినదిగా అసంబద్ధంగా ఉంది; మూలపాఠంలో ప్రత్యామ్నాయ పఠనం లేకపోవడంతో దాన్ని తెలుగు ముసాయిదాలో చేర్చలేదు.
