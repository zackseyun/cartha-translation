revisions:
- from: ఎందుకంటే, దేవుని ఆత్మ చేత నడిపించబడేవారందరూ దేవుని కుమారులు.[a]
  to: ఎందుకంటే, దేవుని ఆత్మచేత నడిపించబడే వారందరూ దేవుని కుమారులే.[a]
  rationale: The revision retains the source’s explanatory connection, ongoing passive guidance by God’s Spirit, and masculine plural “sons,” while “కుమారులే” supplies a natural Telugu equivalent for the emphatic demonstrative identification in οὗτοι. The alternative-reading footnote remains appropriate and is lightly polished for style.
