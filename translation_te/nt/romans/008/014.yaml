id: ROM.8.14
reference: Romans 8:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι ⸂υἱοί εἰσιν θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/014.yaml
  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: te
  text: ఎందుకంటే, దేవుని ఆత్మచేత నడిపించబడే వారందరూ దేవుని కుమారులే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని పిల్లలు.” “కుమారులు” అనే పదం గ్రీకు పదప్రయోగాన్ని, అలాగే ఈ సందర్భంలోని దత్తత మరియు వారసత్వ భావాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: నడిపించబడేవారందరూ
  rationale: గ్రీకు సహసంబంధ బహువచన నిర్మాణంలోని సమగ్ర వర్గ భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనతో ఈ వాక్యాన్ని కలిపే వివరణాత్మక సంబంధాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: πνεύματι θεοῦ
  choice: దేవుని ఆత్మ చేత
  rationale: ἄγονταιతో ఉన్న సాధనార్థక దత్తివును తెలియజేస్తూ, ‘దేవుని ఆత్మ’ అనే పౌలు పదప్రయోగాన్ని నిలుపుతుంది.
- source_word: ἄγονται
  choice: నడిపించబడేవారు
  rationale: వర్తమానకాల కర్మణి భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; వారు ఆత్మ నడిపింపులో ఉన్నారనే కొనసాగుతున్న స్థితిని అతిగా విస్తరించకుండా నిలుపుతుంది.
- source_word: οὗτοι
  choice: వారందరూ
  rationale: తెలుగులో అనవసర పునరుక్తి లేకుండా గ్రీకు నిర్దేశక ఉద్ఘాటనను సమగ్రత సూచించే ‘అందరూ’ ద్వారా అందిస్తుంది.
- source_word: υἱοί
  choice: కుమారులు
  rationale: గ్రీకు పదంలోని స్పష్టమైన పుంలింగ బహువచనాన్ని, అలాగే రోమా 8లోని దత్తత మరియు వారసత్వ భావసూచనను కాపాడుతుంది.
- source_word: θεοῦ
  choice: దేవుని
  rationale: రెండు చోట్లా ఉన్న సంబంధవిభక్తి భావాన్ని నేరుగా, సహజమైన తెలుగు రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: υἱοί θεοῦను ‘దేవుని కుమారులు’గా అనువదించాలా, లేక సమగ్ర లింగార్థాన్ని ముందుకు తెచ్చే పదబంధాన్ని వాడాలా?
  choice: దేవుని కుమారులు
  alternative: దేవుని పిల్లలు
  rationale: మూలపాఠం υἱοί అనే పుంలింగ బహువచనాన్ని ఉపయోగిస్తుంది. సందర్భంలో ఇది దత్తత, వారసత్వ హక్కు అనే భావాలతో ముడిపడి ఉంది. ప్రధాన పాఠంలో ‘కుమారులు’ ఉంచి, ఇక్కడ స్త్రీలను మినహాయించడం ఉద్దేశం కాదని పాదటిప్పణిలో ప్రత్యామ్నాయాన్ని తెలియజేయడం మూలానికి నిబద్ధతను, ఆధునిక పాఠకునికి స్పష్టతను రెండింటినీ కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదమైన ధోరణితో. ‘చేత’ కర్మణి నడిపింపును స్పష్టపరుస్తుంది; వాక్య నిర్మాణం మూలంలోని వివరణాత్మక సంబంధం మరియు సమగ్ర ఉద్ఘాటనను కాపాడుతుంది.
