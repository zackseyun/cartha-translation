  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: te
  text: ఎత్తు గానీ, లోతు గానీ, మరే సృష్టించబడినదీ గానీ మనలను మన ప్రభువైన మెస్సీయ యేసులోనున్న దేవుని ప్రేమ నుండి వేరుచేయలేవు.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సృష్టిలోని మరేదైనా’ లేదా ‘మరే సృష్టిజీవైనా.’
    reason: lexical_alternative
  - marker: b
    text: ‘మెస్సీయ యేసు’ను సంప్రదాయంగా ‘క్రీస్తు యేసు’ అని అనువదిస్తారు.
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘దేవుని ప్రేమ’ అంటే దేవుడు మనపై చూపే ప్రేమ అని అర్థం కావడం అత్యంత సంభావ్యం.
    reason: alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: ఎత్తు
  rationale: βάθοςతో జతగా ఉన్నందున స్థల పరిమాణాన్ని సూచించే సహజమైన అర్థం; ‘ఎత్తు’ వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: βάθος
  choice: లోతు
  rationale: ὕψωμαకు వ్యతిరేక జతగా ఉండి, అత్యంత పరిమాణాలన్నిటినీ సూచించే అలంకారాన్ని నిలుపుతుంది.
- source_word: κτίσις ἑτέρα
  choice: సృష్టించబడిన మరేదైనా
  rationale: κτίσιςకు ‘సృష్టి’ లేదా ‘సృష్టించబడినది’ అనే అర్థాలు ఉండవచ్చు. ఇక్కడ సృష్టి క్రమంలో మరేదీ వేరుచేయలేదనే భావాన్ని సహజంగా తెలియజేస్తుంది; ἑτέραను ‘మరేదైనా’ ప్రతిబింబిస్తుంది.
- source_word: δυνήσεται
  choice: వేరుచేయలేవు అనే సామర్థ్య భావం
  rationale: భవిష్యత్ సామర్థ్యాన్ని తెలుగులో సహజంగా నిషేధ క్రియతో వ్యక్తం చేసింది.
- source_word: χωρίσαι
  choice: వేరుచేయడం
  rationale: ఒక సంబంధం నుండి విడదీయడం లేదా దూరం చేయడం అనే సందర్భోచిత భావాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: ἀγάπης τοῦ θεοῦ
  choice: దేవుని ప్రేమ
  rationale: గ్రీకు షష్ఠీ విభక్తి నిర్మాణాన్ని నిలుపుతూ, అది దేవుడు మనపై చూపే ప్రేమనా లేక దేవునిపట్ల ప్రేమనా అనే వ్యాకరణ రూపంలోని స్వల్ప విస్తృతిని ప్రధాన పాఠ్యంలో మూసివేయదు.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: Χριστός ఇక్కడ బిరుదు; దాని అభిషిక్త రాజు భావాన్ని ‘మెస్సీయ’గా తెలియజేస్తూ ἐνను ‘లో’గా నిలిపింది.
- source_word: κυρίῳ
  choice: ప్రభువు
  rationale: κύριοςకు స్థిరమైన, గౌరవప్రదమైన మరియు సందర్భానికి తగిన తెలుగు పదం.
theological_decisions:
- issue: ‘దేవుని ప్రేమ’లోని షష్ఠీ విభక్తి అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘దేవుని ప్రేమ’గా రూపాన్ని నిలుపడం; పాదసూచికలో దేవుడు మనపై చూపే ప్రేమ అనే సందర్భోచిత అర్థాన్ని సూచించడం
  alternative: దేవునిపట్ల మన ప్రేమ; లేదా రెండు భావాలనూ ఉద్దేశపూర్వకంగా కలిగిన విస్తృత ప్రయోగం
  rationale: రోమా 8:31–39లో దేవుడు తన ప్రజల కొరకు చేసిన కార్యమే ప్రధానంగా ఉండటంతో దేవుడు మనపై చూపే ప్రేమ అనే అర్థం బలంగా ఉంది. అయినా మూలంలోని షష్ఠీ విభక్తి రూపాన్ని ప్రధాన పాఠ్యంలో వ్యాఖ్యానాత్మకంగా మార్చలేదు.
- issue: Χριστόςను బిరుదుగా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός యొక్క బిరుదు స్వభావాన్ని, అభిషిక్తుడనే భావాన్ని పాఠకునికి తెలియజేస్తుంది; సంప్రదాయ రూపాన్ని పాదసూచికలో అందించింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని వరుస నిషేధాల బలాన్ని ‘ఎత్తయినా, లోతయినా...’ నిర్మాణంతో నిలిపింది. తెలుగు సహజ వచనానికి అనుగుణంగా సంయుక్త కర్తకు బహువచన నిషేధ క్రియను వాడింది.
