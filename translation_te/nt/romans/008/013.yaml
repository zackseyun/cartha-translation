id: ROM.8.13
reference: Romans 8:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: te
  text: ఎందుకంటే, మీరు శరీర స్వభావం ప్రకారం జీవిస్తే చనిపోబోతున్నారు; అయితే ఆత్మచేత శరీరపు కార్యాలను మరణానికి గురిచేస్తే, జీవిస్తారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: మునుపటి వాదనకు ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: κατὰ σάρκα
  choice: శరీర స్వభావం ప్రకారం
  rationale: σάρξ అనే పదానికి ఉన్న శరీర సంబంధ రూపకాన్ని నిలుపుతూ, ఇది కేవలం భౌతిక మాంసాన్ని సూచిస్తుందనే అపార్థాన్ని తగ్గిస్తుంది; పౌలు ఉద్దేశించిన నైతిక జీవనదిశను సందర్భం తెలియజేస్తుంది.
- source_word: ζῆτε
  choice: జీవిస్తే
  rationale: షరతును తెలిపే వాక్యంలో గ్రీకు వర్తమాన క్రియను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μέλλετε ἀποθνῄσκειν
  choice: చనిపోబోతున్నారు
  rationale: μέλλωతో కూడిన క్రియారూపం సూచించే సమీప లేదా ఎదురుచూస్తున్న ఫలితాన్ని, విధివాదాన్ని అధికంగా చొప్పించకుండా తెలుపుతుంది.
- source_word: πνεύματι
  choice: ఆత్మ ద్వారా
  rationale: దత్తివును సాధనార్థకంగా తీసుకుంటుంది; రోమా 8 సందర్భంలో దేవుని పరిశుద్ధాత్మ ప్రధాన సూచ్యార్థం.
- source_word: τὰς πράξεις τοῦ σώματος
  choice: శరీర క్రియలను
  rationale: πράξεις యొక్క నైతికంగా ప్రాముఖ్యమైన కార్యాలు అనే భావాన్ని, σώματοςతో ఉన్న సంబంధాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: θανατοῦτε
  choice: చంపివేస్తే
  rationale: పాపసంబంధమైన క్రియలను నిర్ణయాత్మకంగా అంతం చేయడమనే బలమైన రూపకాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ζήσεσθε
  choice: జీవిస్తారు
  rationale: గ్రీకు భవిష్యత్ రూపాన్ని సరళమైన తెలుగు భవిష్యత్ క్రియతో తెలుపుతుంది.
theological_decisions:
- issue: πνεύματι పరిశుద్ధాత్మను సూచిస్తుందా, మానవ ఆత్మను సూచిస్తుందా
  choice: దేవుని పరిశుద్ధాత్మను సూచించే విధంగా ‘ఆత్మ ద్వారా’
  alternative: మానవ ఆత్మ ద్వారా; లేదా ఉద్దేశపూర్వకంగా అస్పష్టమైన ‘ఆత్మచేత’
  rationale: రోమా 8లో పదేపదే కనిపించే ‘ఆత్మ’ సూచనలూ, శరీర స్వభావంతో ఉన్న వ్యత్యాసమూ పరిశుద్ధాత్మను బలంగా సూచిస్తాయి. తెలుగు ప్రధాన పాఠంలో ‘ఆత్మ’ అనే రూపం మూలంలోని సంక్షిప్తతను కూడా నిలుపుతుంది.
- issue: σάρξను ‘పాప స్వభావం’గా స్పష్టీకరించాలా, ‘శరీరం/మాంసం’ అనే రూపకాన్ని నిలుపాలా
  choice: ‘శరీర స్వభావం’గా అనువదించడం
  alternative: ‘పాప స్వభావం’; ‘మాంసం’
  rationale: ‘పాప స్వభావం’ నైతిక భావాన్ని స్పష్టంచేసినా మూలపదంలోని శరీర రూపకాన్ని పూర్తిగా వ్యాఖ్యానించి స్థిరపరుస్తుంది; ‘మాంసం’ సాధారణ తెలుగులో భౌతిక కండమాంసంగా అపార్థమవవచ్చు. ‘శరీర స్వభావం’ రెండు అంశాలనూ సమతుల్యం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పౌలు వాడిన శరీరం–ఆత్మ వ్యత్యాసం మరియు వాక్యంలోని గంభీర హెచ్చరిక నిలిచేలా రూపొందించబడింది.
