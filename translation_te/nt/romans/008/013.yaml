revisions:
- from: ఎందుకంటే, మీరు శరీర స్వభావం ప్రకారం జీవిస్తే చనిపోబోతున్నారు; అయితే ఆత్మ ద్వారా శరీర క్రియలను చంపివేస్తే, జీవిస్తారు.
  to: ఎందుకంటే, మీరు శరీర స్వభావం ప్రకారం జీవిస్తే చనిపోబోతున్నారు; అయితే ఆత్మచేత శరీరపు కార్యాలను మరణానికి గురిచేస్తే, జీవిస్తారు.
  rationale: The revision maintains the draft’s contextual treatment of σάρξ and the contextually warranted reference of πνεύματι, while making the ethical sense of πράξεις and the death metaphor of θανατοῦτε more faithful and idiomatic. No footnote is needed because the Telugu wording does not introduce a non-obvious lexical alternative requiring explanation.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:08:55Z'
review_pass:
  verdict: revise
  source_fidelity: The translation preserves the conditional contrast, the explanatory force of γάρ, the future consequences, and the instrumental sense of πνεύματι. However, ‘శరీర క్రియలను’ can suggest morally neutral bodily actions and does not adequately convey πράξεις as practices/deeds in this ethical context. ‘చంపివేస్తే’ is understandable but is slightly abrupt and can sound like killing an external object; ‘మరణానికి గురిచేస్తే’ better retains Paul’s deliberate metaphor of putting such practices to death.
  naturalness: The sentence is generally clear modern Telugu. ‘ఆత్మ ద్వారా’ is acceptable, but ‘ఆత్మచేత’ is more idiomatic for instrumental agency in this elevated register. ‘శరీర స్వభావం ప్రకారం’ is a viable contextual rendering, though it introduces ‘nature’; it remains a safe attempt to prevent a merely physical sense without imposing a specific denominational formulation.
  terminology: Retain ‘శరీర స్వభావం’ for σάρξ and ‘ఆత్మ’ for πνεύματι, with the latter left lexically concise while context supports the Holy Spirit. Revise ‘శరీర క్రియలు’ to ‘శరీరపు కార్యాలు’ and use ‘మరణానికి గురిచేయడం’ for θανατόω.
  issues:
  - severity: medium
    issue: ‘శరీర క్రియలను’ is too broad for τὰς πράξεις τοῦ σώματος.
    rationale: The Greek refers to ethically charged practices/deeds associated with the body, not simply bodily functions or actions. ‘శరీరపు కార్యాలు’ better communicates the intended moral-practical sense while retaining the explicit genitive.
  - severity: low
    issue: ‘చంపివేస్తే’ is less natural for the moral metaphor in this context.
    rationale: It can be read as literal killing. ‘మరణానికి గురిచేస్తే’ is established, clear Telugu for decisively putting practices to death and preserves the metaphor’s force.
  - severity: low
    issue: ‘ఆత్మ ద్వారా’ is somewhat less idiomatic than an instrumental construction.
    rationale: ‘ఆత్మచేత’ naturally expresses the Greek instrumental dative and fits modern standard Telugu biblical register.
  revised_text: ఎందుకంటే, మీరు శరీర స్వభావం ప్రకారం జీవిస్తే చనిపోబోతున్నారు; అయితే ఆత్మచేత శరీరపు కార్యాలను మరణానికి గురిచేస్తే, జీవిస్తారు.
  revised_footnotes: []
  revision_rationale: The revision maintains the draft’s contextual treatment of σάρξ and the contextually warranted reference of πνεύματι, while making the ethical sense of πράξεις and the death metaphor of θανατοῦτε more faithful and idiomatic. No footnote is needed because the Telugu wording does not introduce a non-obvious lexical alternative requiring explanation.
