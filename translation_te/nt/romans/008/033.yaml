  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: te
  text: దేవుడు ఎన్నుకున్నవారిమీద ఎవరు నేరం మోపుతారు? నీతిమంతులుగా ప్రకటించేవాడు దేవుడే.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«నీతిమంతులుగా ప్రకటించేవాడు» అనే మాటకు న్యాయస్థాన సంబంధమైన భావం ఉంది: దేవుడు వారిని నీతిమంతులుగా తీర్పు ప్రకటించేవాడు.'
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: ఎవరు
  rationale: అలంకారిక ప్రశ్నను నేరుగా, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐγκαλέσει
  choice: నేరం మోపగలరు
  rationale: న్యాయస్థాన సంబంధమైన ఆరోపణ భావాన్ని నిలుపుతూ, సందర్భంలోని అలంకారిక ప్రశ్న బలాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: κατὰ
  choice: మీద
  rationale: ఆరోపణకు లక్ష్యమైనవారిని తెలుగులో సహజంగా సూచిస్తుంది.
- source_word: ἐκλεκτῶν θεοῦ
  choice: దేవుడు ఎన్నుకున్నవారు
  rationale: సంబంధార్థక నిర్మాణాన్ని సహజ తెలుగులో క్రియాత్మకంగా మార్చి, తరువాతి సిద్ధాంతపరమైన సాంకేతిక పదజాలాన్ని అనవసరంగా దిగుమతి చేయకుండా ఎంపిక భావాన్ని కాపాడుతుంది.
- source_word: θεὸς ὁ δικαιῶν
  choice: వారిని నీతిమంతులుగా తీర్పు తీర్చేవాడు దేవుడే
  rationale: దేవునిపై ఉన్న ఉద్ఘాటనను ‘దేవుడే’ ద్వారా నిలిపి, δικαιόω యొక్క న్యాయస్థాన సంబంధమైన ప్రకటనా భావాన్ని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: ἐκλεκτῶν అనే పదాన్ని తరువాతి సిద్ధాంత వ్యవస్థలతో ముందుగానే నిర్వచించకుండా అనువదించడం
  choice: దేవుడు ఎన్నుకున్నవారు
  alternative: దేవుని ఏర్పరచబడినవారు; దేవుని ఎన్నికైనవారు
  rationale: గ్రీకు పదంలోని దేవుని ఎంపిక భావాన్ని పారదర్శకంగా ఉంచుతూ, తెలుగులో సాంకేతిక సిద్ధాంత పదంగా వినిపించే రూపాన్ని నివారిస్తుంది.
- issue: θεὸς ὁ δικαιῶν లోని సంక్షిప్తత మరియు ఉద్ఘాటన
  choice: వారిని నీతిమంతులుగా తీర్పు తీర్చేవాడు దేవుడే
  alternative: నీతిమంతులుగా ప్రకటించేది దేవుడే; దేవుడే నీతిమంతులుగా తీర్చేవాడు
  rationale: ఈ గ్రీకు వాక్యభాగాన్ని వాక్య ప్రకటనగా తీసుకొని దేవుడే న్యాయనిర్ణేత అనే ఉద్ఘాటనను నిలుపుతుంది; అదే సమయంలో ‘నీతిమంతులుగా చేయడం’ అనే నైతిక పరివర్తన భావానికే పరిమితం చేయకుండా న్యాయస్థాన ప్రకటన భావాన్ని వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనదిగా, సాధారణ పాఠకులకు సులభంగా ఉండేలా న్యాయస్థాన రూపకాన్ని స్పష్టంగా నిలిపింది. మూలంలోని రెండు సంక్షిప్త వాక్యభాగాల ఉద్ఘాటనను ప్రశ్న మరియు ‘దేవుడే’ ద్వారా కాపాడింది.
