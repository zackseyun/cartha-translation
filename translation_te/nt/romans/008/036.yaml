    reason: lexical_alternative
  revision_rationale: The revision corrects the principal lexical error by rendering ἐλογίσθημεν as “పరిగణించబడ్డాం,” preserving the passive sense of being regarded or reckoned as sheep destined for slaughter. The footnote supplies “లెక్కించబడ్డాం” as a close lexical alternative. The citation formula is adjusted for more natural modern Telugu while retaining the scriptural-reference force.
