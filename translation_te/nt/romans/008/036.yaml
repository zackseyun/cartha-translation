id: ROM.8.36
reference: Romans 8:36
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: te
  text: 'వ్రాయబడి ఉన్న ప్రకారం:


    “నీ నిమిత్తం రోజంతా మేము చంపబడుతున్నాం;


    వధకు ఉద్దేశించిన గొర్రెలుగా మేము పరిగణించబడ్డాం[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వధకు ఉద్దేశించిన గొర్రెలుగా మేము లెక్కించబడ్డాం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: ఉన్నట్టుగా
  rationale: ముందున్న సందర్భంతో పోలికను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: γέγραπται
  choice: వ్రాయబడి
  rationale: లేఖన ఉద్ధరణను పరిచయం చేసే సంప్రదాయ సూత్రాన్ని, గ్రీకు పరిపూర్ణ కర్మణి భావాన్ని నిలుపుతూ అందిస్తుంది.
- source_word: Ἕνεκεν σοῦ
  choice: నీ నిమిత్తం
  rationale: దేవునికి చేసిన ప్రత్యక్ష సంబోధనను, ‘నీ కారణంగా/నీ కొరకు’ అనే భావాన్ని గౌరవప్రదంగా నిలుపుతుంది.
- source_word: θανατούμεθα
  choice: మేము చంపబడుతున్నాం
  rationale: వర్తమాన కర్మణి రూపంలోని కొనసాగుతున్న ప్రాణహరణ భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὅλην τὴν ἡμέραν
  choice: రోజంతా
  rationale: కాలవ్యాప్తిని తెలిపే గ్రీకు పదబంధానికి సహజమైన తెలుగు సమానం.
- source_word: ἐλογίσθημεν
  choice: మేము ఎంచబడ్డాం
  rationale: ఇక్కడ ‘లెక్కించబడ్డాం/పరిగణించబడ్డాం’ అనే కర్మణి భావాన్ని సందర్భానుగుణంగా సహజంగా వ్యక్తం చేస్తుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
- source_word: ὡς
  choice: గా
  rationale: పోలికను సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: πρόβατα σφαγῆς
  choice: వధకు ఉద్దేశించిన గొర్రెలు
  rationale: వధ కోసం ఉన్న గొర్రెల చిత్రాన్ని స్పష్టంగా నిలుపుతూ, బలికి మాత్రమే పరిమితం చేసే అదనపు అర్థాన్ని చేర్చదు.
theological_decisions:
- issue: బాధ సందర్భంలో కీర్తన 44:22 ఉద్ధరణ
  choice: సమూహపరమైన, కొనసాగుతున్న బాధను మరియు మరణానికి గురిచేయబడే ప్రజల చిత్రాన్ని యథాతథంగా నిలుపడం
  alternative: దీనిని ప్రత్యేకంగా హతసాక్షిత్వాన్ని సూచించేలా అనువదించడం
  rationale: గ్రీకు పాఠ్యం విలాపాన్ని వివరణ లేకుండా ఉటంకిస్తుంది; కాబట్టి ఒక నిర్దిష్ట సిద్ధాంత అన్వయానికి కుదించకుండా దాని ఉద్రిక్తతను నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖన ఉద్ధరణకు తగిన గంభీరతతో రూపొందించబడింది. ప్రధాన పాఠంలోని [a] సూచిక పాదసూచికతో సరిపోతుంది.
