source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: te
  text: ఎందుకంటే క్రీస్తు యేసులోని జీవాన్నిచ్చే ఆత్మ యొక్క నియమం పాపం మరియు మరణం యొక్క నియమం నుండి నిన్ను విడుదల చేసింది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నియమం’కు బదులు ‘సూత్రం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో ‘నిన్ను’కు బదులు ‘నన్ను’ అని ఉంది. ‘క్రీస్తు యేసులోని’ అనే మాటలను ‘విడుదల చేసింది’తో కలిపి, ‘క్రీస్తు యేసులో నిన్ను విడుదల చేసింది’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: textual_variant_and_syntactic_ambiguity
lexical_decisions:
- source_word: νόμος
  choice: నియమం
  rationale: రెండు చోట్లా ఒకే పదాన్ని వాడి పౌలు చేసిన పునరుక్తినీ, ‘చట్టం/సూత్రం/పనిచేసే శక్తి’ మధ్య ఉన్న రూపకాల ఉద్రిక్తతనూ నిలిపింది.
- source_word: πνεύματος τῆς ζωῆς
  choice: జీవాన్ని ఇచ్చే ఆత్మ
  rationale: గ్రీకు షష్ఠీ నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తూ, సందర్భంలో జీవప్రదాతయైన పరిశుద్ధాత్మను సూచిస్తుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: క్రీస్తు యేసులో
  rationale: Χριστός అనే బిరుదుకు తెలుగులో స్థిరపడిన ‘క్రీస్తు’ను వాడి, ἐν లోని ఐక్యత/పరిధి భావాన్ని ‘లో’తో నిలిపింది.
- source_word: ἠλευθέρωσέν
  choice: విడుదల చేసింది
  rationale: పూర్తయిన విమోచన కార్యాన్ని సహజంగా తెలియజేస్తుంది; దాని ఫలితం కొనసాగుతుందనే భావానికీ అనుకూలంగా ఉంది.
- source_word: σε
  choice: నిన్ను
  rationale: SBLGNT ముద్రిత పాఠంలోని ద్వితీయ పురుష ఏకవచనాన్ని అనుసరించింది; ‘నన్ను’ అనే పాఠాంతరాన్ని పాదసూచికలో ఇచ్చింది.
- source_word: ἁμαρτίας καὶ τοῦ θανάτου
  choice: పాపమరణాల
  rationale: తెలుగులో సహజమైన సమాసరూపంతో పాపం మరియు మరణం అనే రెండు అనుసంధానిత శక్తులను సంక్షిప్తంగా ఉంచింది.
theological_decisions:
- issue: πνεύματος పరిశుద్ధాత్మను సూచిస్తుందా, మానవ ఆత్మను లేదా ఆధ్యాత్మిక సూత్రాన్ని సూచిస్తుందా
  choice: పరిశుద్ధాత్మను సూచించే ‘ఆత్మ’
  alternative: మానవ ఆత్మ లేదా నిర్జీవమైన ఆధ్యాత్మిక సూత్రం
  rationale: రోమీయులు 8లో శరీరం, పాపం, మరణానికి ఎదురుగా జీవమిచ్చే దేవుని ఆత్మ ప్రధానంగా ఉండటం వల్ల పరిశుద్ధాత్మ అనే పఠనం బలంగా ఉంది.
- issue: ἐν Χριστῷ Ἰησοῦ దేనితో వ్యాకరణపరంగా అనుసంధానమవుతుంది
  choice: ‘జీవాన్ని ఇచ్చే ఆత్మ నియమం’తో అనుసంధానాన్ని ప్రధాన పాఠంలోని పదక్రమం సూచించేలా ఉంచింది
  alternative: '‘విడుదల చేసింది’తో అనుసంధానం: ‘క్రీస్తు యేసులో నిన్ను విడుదల చేసింది’'
  rationale: గ్రీకు పదక్రమం మొదటి అనుసంధానానికి అనుకూలమైనా, రెండవది కూడా సాధ్యమే; పాదసూచికలో నిజమైన సందిగ్ధతను తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా రూపొందించబడింది. ‘ధర్మశాస్త్రం’ అని అనువదిస్తే మోషే ధర్మశాస్త్రమనే భావం అనవసరంగా ముందుకు వచ్చే అవకాశం ఉన్నందున, ఇక్కడ రెండు νόμος పదాలకు ‘నియమం’ వాడబడింది. ‘క్రీస్తు’ తెలుగులో బిరుదుగా స్థిరపడిన రూపం; మూలంలోని Χριστός భావాన్ని నిలుపుతుంది.
