source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: te
  text: అది మాత్రమే కాదు, ఆత్మ యొక్క ప్రథమఫలాన్ని[a] కలిగివున్న మనం కూడా, మనమే, మనలో మూలుగుతూ, కుమారులుగా దత్తత పొందడాన్ని[b]—అంటే మన శరీరాల[c] విమోచనను—ఆతురతతో ఎదురుచూస్తున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, బహుశా, “ప్రథమఫలంగా ఆత్మను.”
    reason: alternative_reading
  - marker: b
    text: లేదా, కేవలం “దత్తత పొందడాన్ని.” గ్రీకు పదంలో అక్షరార్థంగా కుమారత్వ భావం కూడా ఉంది.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో “మన శరీరం” అని ఏకవచనంలో ఉంది; అది ఇక్కడ ప్రతి ఒక్కరి శరీరాన్ని సూచించే పంపిణీ ఏకవచనం.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: అంతేకాదు
  rationale: మునుపటి వాక్యంలోని సృష్టి మూలుగును కొనసాగిస్తూ, విశ్వాసులు కూడా మూలుగుతున్నారనే పౌలు వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: మనం కూడా—మనమే
  rationale: గ్రీకులోని పునరుక్త నొక్కిచెప్పడాన్ని తెలుగులో అసహజంగా మారకుండా నిలుపుతుంది.
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: ఆత్మ యొక్క ప్రథమఫలాన్ని
  rationale: ἀπαρχή అనే ‘మొదటి భాగం/ప్రథమఫలం’ భావాన్ని కాపాడుతూ, τοῦ πνεύματος అనేది ఆత్మనుండి వచ్చిన ప్రథమఫలమా లేక ఆత్మయే ప్రథమఫలమా అనే సాధ్యమైన అర్థభేదాన్ని ప్రధాన పాఠంలో పరిష్కరించకుండా ఉంచుతుంది.
- source_word: ἔχοντες
  choice: కలిగివున్న
  rationale: గ్రీకు వర్తమాన కృదంత భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἐν ἑαυτοῖς
  choice: మనలో
  rationale: మూలుగు అంతర్గతమైనదని స్పష్టంగా తెలియజేస్తుంది; అనవసర వివరణను జోడించదు.
- source_word: στενάζομεν
  choice: మూలుగుతూ
  rationale: సమీప సందర్భంలో సృష్టి మూలుగుతో ఉన్న పదసంబంధాన్ని నిలుపుతుంది.
- source_word: υἱοθεσίαν
  choice: కుమారులుగా దత్తత పొందడాన్ని
  rationale: గ్రీకు పదంలోని కుమారత్వం మరియు వారసత్వ హోదా భావాన్ని నిలుపుతూ, ఆధునిక తెలుగు పాఠకులకు సహజంగా ఉంటుంది.
- source_word: ἀπεκδεχόμενοι
  choice: ఆతురతతో ఎదురుచూస్తున్నాం
  rationale: తీవ్రమైన నిరీక్షణతో ఎదురుచూడటం అనే గ్రీకు పదబలాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὴν ἀπολύτρωσιν
  choice: విమోచనను
  rationale: పౌలు వాడే విమోచన సంబంధమైన ధార్మిక పదజాలాన్ని, దాని భవిష్యత్ నెరవేర్పు బరువును నిలుపుతుంది.
- source_word: τοῦ σώματος ἡμῶν
  choice: మన శరీరాల
  rationale: గ్రీకులో ఏకవచనం పంపిణీ అర్థంలో వాడబడినందున, తెలుగులో సహజమైన బహువచనం ప్రతి విశ్వాసి శరీరాన్ని స్పష్టంగా సూచిస్తుంది.
theological_decisions:
- issue: υἱοθεσίαν లోని కుమారత్వ-వారసత్వ చిత్రణను స్త్రీలను సూచన పరిధి నుంచి తొలగించకుండా ఎలా అందించాలి
  choice: కుమారులుగా దత్తత పొందడం
  alternative: దత్తత పొందడం
  rationale: గ్రీకు పదంలో కుమారత్వ భావం స్పష్టంగా ఉంది; పౌలు కాలంలోని చట్టపరమైన వారసత్వ హోదాను ప్రధాన పాఠం నిలుపుతుంది. సందర్భంలో ఇది స్త్రీపురుషులైన విశ్వాసులందరికీ వర్తిస్తుంది.
- issue: ‘ఆత్మ యొక్క ప్రథమఫలం’ అనేది ఆత్మ ఇచ్చిన మొదటి భాగమా, లేక ఆత్మయే ప్రథమఫలమా
  choice: ఆత్మ యొక్క ప్రథమఫలం
  alternative: ప్రథమఫలంగా ఆత్మ
  rationale: గ్రీకు షష్ఠీ విభక్తి నిర్మాణం రెండవ అర్థానికీ అవకాశం ఇస్తుంది. ప్రధాన పాఠం ఆ సందిగ్ధతను సాధ్యమైనంతవరకు నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచిక స్పష్టం చేస్తుంది.
- issue: ఇప్పటికే ఆత్మను పొందినవారు భవిష్యత్తులో దత్తత కోసం ఎదురుచూడటం
  choice: భవిష్యత్తులో దత్తత పొందడాన్ని ఎదురుచూస్తున్నాం
  alternative: దత్తత సంపూర్ణత కోసం ఎదురుచూస్తున్నాం
  rationale: ‘సంపూర్ణత’ అని జోడిస్తే పాఠంలోని కాలసంబంధ ధార్మిక ఉద్వేగాన్ని వివరణ ద్వారా పరిష్కరించినట్లవుతుంది. అందువల్ల గ్రీకు వాక్యంలోని భవిష్యత్ నిరీక్షణను యథాతథంగా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రథమఫలం,’ ‘విమోచనం’ వంటి సందర్భానికి అవసరమైన బైబిలీయ పదాలను ఉంచి, మిగతా వాక్యనిర్మాణాన్ని సాధారణ పాఠకులకు సులభంగా రూపొందించాం. గ్రీకులోని నొక్కిచెప్పే పునరుక్తిని ‘మనం కూడా—మనమే’ ద్వారా నిలిపాం; విరామచిహ్నాలు వాక్యంలోని వివరణాత్మక సంబంధాన్ని స్పష్టం చేస్తాయి.
