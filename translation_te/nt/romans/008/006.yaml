id: ROM.8.6
reference: Romans 8:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/006.yaml
  text: For the mindset of the flesh is death[b][a], but the mindset of the Spirit is life and peace.
translation:
  language: te
  text: ఎందుకంటే శరీరానుసారమైన[a] మనోభావం మరణమే; అయితే ఆత్మానుసారమైన[b] మనోభావం జీవం మరియు శాంతి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘శరీరము’ అనే పదం ఇక్కడ కేవలం భౌతిక దేహాన్ని మాత్రమే కాక, దేవునికి విరోధంగా మొగ్గుచూపే మానవ స్థితిని సూచించవచ్చు; లేదా ‘పాప స్వభావం.’
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ ‘ఆత్మ’ పరిశుద్ధాత్మను సూచించే అవకాశం బలంగా ఉంది; లేదా ‘మానవ ఆత్మ’ అని అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యంలోని ఆలోచనకు ఈ వాక్యం వివరణ ఇస్తున్న సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: φρόνημα
  choice: మనోభావం
  rationale: కేవలం బుద్ధిని కాకుండా, స్థిరమైన అంతరంగ దృక్పథం లేదా మొగ్గును సూచిస్తుంది; రెండు సందర్భాల్లోనూ ఒకే పదాన్ని ఉంచడం ద్వారా వ్యతిరేక సమాంతరత నిలుస్తుంది.
- source_word: σάρξ
  choice: శరీరం
  rationale: పౌలు ఉపయోగించిన కీలక పదానికి దగ్గరగా ఉండి, దాని ఉద్దేశపూర్వక భావ విస్తృతిని కాపాడుతుంది; ‘పాప స్వభావం’ అనే వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాన్ని పాదటీపులో ఇస్తుంది.
- source_word: θάνατος
  choice: మరణం
  rationale: గ్రీకు పదానికి ప్రత్యక్షమైన సమానార్థకం; దాని శారీరక, ఆధ్యాత్మిక భావభారాన్ని సంకుచితం చేయదు.
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: రోమీయులు 8 సందర్భంలో పరిశుద్ధాత్మను సూచించే అవకాశమే బలంగా ఉంది; అయితే తెలుగులో అక్షరరూపం ద్వారా దైవిక ఆత్మ/మానవ ఆత్మ భేదం స్పష్టపడదు కాబట్టి అసలులోని సాధ్యమైన సందిగ్ధతను పాదటీపులో నమోదు చేస్తుంది.
- source_word: ζωή
  choice: జీవం
  rationale: ‘మరణం’తో ఉన్న సంక్షిప్త వ్యతిరేకతను, విస్తృతమైన ధార్మిక భావాన్ని కాపాడుతుంది.
- source_word: εἰρήνη
  choice: శాంతి
  rationale: సహజమైన ప్రామాణిక తెలుగు పదం; దేవునితోనూ అంతరంగంలోనూ ఉండే శాంతి అనే భావ విస్తృతిని తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: πνεῦμα పరిశుద్ధాత్మను సూచిస్తుందా, మానవ ఆత్మను సూచిస్తుందా?
  choice: ప్రధాన పాఠ్యంలో ‘ఆత్మ’ అని ఉంచి, సందర్భానుసారం పరిశుద్ధాత్మ అనే పఠనాన్ని ప్రధానంగా స్వీకరించడం
  alternative: మానవ ఆత్మ లేదా సాధారణ అర్థంలో ఆత్మ
  rationale: రోమీయులు 8లో సమీప సందర్భం జీవమిచ్చే దైవిక ఆత్మను పదేపదే ప్రస్తావిస్తుంది. అయినా గ్రీకు పదరూపమే ఒంటరిగా ఈ నిర్ణయాన్ని బలవంతం చేయదు; తెలుగులోనూ అక్షరరూపం ఆ భేదాన్ని చూపదు. అందువల్ల ప్రత్యామ్నాయాన్ని పాదటీపులో కాపాడాం.
- issue: σάρξను అక్షరార్థంగా ఉంచాలా, వ్యాఖ్యానాత్మకంగా ‘పాప స్వభావం’ అని అనువదించాలా?
  choice: శరీరం
  alternative: పాప స్వభావం
  rationale: ‘శరీరం’ పౌలు వాడిన పదబంధాన్ని, దాని ధార్మిక ఉద్వేగాన్ని నిలుపుతుంది. ‘పాప స్వభావం’ ఈ సందర్భంలో సాధ్యమైన వివరణ అయినా, అది పదార్థాన్ని ముందుగానే ఒకే వ్యాఖ్యానానికి పరిమితం చేయవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని సమాంతర నిర్మాణాన్ని ‘శరీర సంబంధమైన మనోభావం / ఆత్మ సంబంధమైన మనోభావం’ ద్వారా నిలిపాం. ప్రతి పాదటీపు గుర్తు ప్రధాన పాఠ్యంలో ఉంది.
