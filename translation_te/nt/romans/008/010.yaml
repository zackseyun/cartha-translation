id: ROM.8.10
reference: Romans 8:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: te
  text: అయితే మెస్సీయ మీలో ఉంటే, పాపం కారణంగా శరీరం మృతమే[a]; కానీ నీతి[b] కారణంగా ఆత్మ[c] జీవమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘శరీరం మరణాధీనమైనది’ లేదా ‘శరీరం మర్త్యమైనది.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘న్యాయం.’
    reason: lexical_alternative
  - marker: c
    text: ఇక్కడ ‘ఆత్మ’ అనే పదం దేవుడు జీవింపజేసిన మానవ ఆత్మను గానీ, పరిశుద్ధాత్మను గానీ సూచించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదు భావాన్ని కలిగి ఉంది; ‘మెస్సీయ’ ఆ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: σῶμα
  choice: శరీరం
  rationale: σῶμαకు సహజమైన అర్థం ‘శరీరం’; ఇది σάρξ (‘శరీర స్వభావం/మాంసం’) కాదు, అలాగే πνεῦμαతో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: νεκρὸν
  choice: మృతమే
  rationale: గ్రీకు విశేషణం నేరుగా ‘మృతమైనది’ అని అర్థమిస్తుంది. పౌలు ఉద్దేశంలో మరణాధీనత లేదా మర్త్యత్వం ఉండవచ్చుగానీ, ప్రధాన పాఠం మూలంలోని బలమైన రూపాన్ని నిలుపుతుంది.
- source_word: διὰ ἁμαρτίαν
  choice: పాపం కారణంగా
  rationale: Accusativeతో వచ్చిన διά ఇక్కడ కారణాన్ని సూచిస్తుంది; ఈ తెలుగు రూపం పౌలు చెప్పిన కారణ సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: ఇది మానవ ఆత్మను లేదా పరిశుద్ధాత్మను సూచించవచ్చు. తెలుగు లిపిలో పెద్ద/చిన్న అక్షర భేదం లేకపోవడం వల్ల ప్రధాన పాఠం సహజంగానే ఈ సందిగ్ధతను నిలుపుతుంది.
- source_word: ζωὴ
  choice: జీవమే
  rationale: ζωή నామవాచకం; ‘సజీవంగా ఉంది’ లేదా ‘జీవాన్ని ఇస్తుంది’ అని విప్పకుండా, పౌలు వాడిన సంక్షిప్త ‘జీవం’ విధేయార్థాన్ని నిలుపుతుంది.
- source_word: διὰ δικαιοσύνην
  choice: నీతి కారణంగా
  rationale: δικαιοσύνηకి పౌలు రచనల్లో ‘నీతి’ సరైన సాధారణ సమానం; διά యొక్క కారణార్థం కూడా నిలిచింది.
theological_decisions:
- issue: πνεῦμα ఎవరిని సూచిస్తుంది?
  choice: ఆత్మ
  alternative: పరిశుద్ధాత్మ
  rationale: ఈ వాక్యం విశ్వాసి శరీరానికి విశ్వాసి ఆత్మను వ్యతిరేకంగా ఉంచవచ్చు; అదే సమయంలో పరిసర సందర్భం దేవుని ఆత్మను సూచిస్తుంది. ప్రధాన పాఠం ఏ ఒక్క అర్థాన్నీ బలవంతంగా ఖరారు చేయదు.
- issue: σῶμα νεκρὸν యొక్క భావబలం
  choice: శరీరం మృతమే
  alternative: శరీరం మరణాధీనమైనది / మర్త్యమైనది
  rationale: పాపం వల్ల శరీరం మరణానికి లోబడి ఉందని పౌలు భావించి ఉండవచ్చు; అయినా మూలంలో ఉన్న νεκρόν అనే బలమైన పదాన్ని ప్రధాన పాఠంలో యథాతథంగా నిలిపి, భావవిస్తరణను పాదటిప్పణిలో ఇస్తున్నాం.
- issue: δικαιοσύνη యొక్క భావపరిధి
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ పౌలు సంబంధ సందర్భంలో ‘నీతి’ ప్రధాన ఎంపిక; అయినా గ్రీకు పదానికి ‘న్యాయం’ అనే భావపరిధి కూడా ఉండగలదని పాదటిప్పణి తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా, సంక్షిప్తంగా రూపొందించబడింది. ‘మృతమే—జీవమే’ అనే సమాంతర నిర్మాణం మూలంలోని పదునైన శరీరం–ఆత్మ వ్యత్యాసాన్ని నిలుపుతుంది; పాదటిప్పణులు నిజమైన పదార్థ, వ్యాఖ్యాన సందిగ్ధతలను మాత్రమే వివరిస్తాయి.
