  to: అయితే మనం చూడనిదాని కోసం ఆశిస్తే, సహనంతో దానికోసం ఎదురుచూస్తాం.[a]
  rationale: The sole revision changes నిరీక్షిస్తే to ఆశిస్తే so that ἐλπίζομεν is translated as ‘hope’ rather than ‘wait.’ This maintains the source’s lexical and rhetorical distinction from ἀπεκδεχόμεθα, while retaining the draft’s natural wording, restrained reference to the unseen object, and lexical footnote.
