source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ βλέπομεν ἐλπίζομεν, δι’ ὑπομονῆς ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: te
  text: అయితే మనం చూడనిదాని కోసం ఆశిస్తే, సహనంతో దానికోసం ఎదురుచూస్తాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పట్టుదలతో.” “ఎదురుచూస్తాం” అనే క్రియకు “ఆతురంగా ఎదురుచూస్తాం” అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: అయితే
  rationale: షరతును, మునుపటి వాక్యంతో ఉన్న స్వల్ప వ్యత్యాసభరిత కొనసాగింపును సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ὃ οὐ βλέπομεν
  choice: మనం చూడనిదాని కోసం
  rationale: గ్రీకు నపుంసక సంబంధవాచకాన్ని సహజంగా వ్యక్తం చేస్తూ, βλέπομεν లోని సాధారణ వర్తమానార్థాన్ని ‘చూడని’ అని నిలుపుతుంది; ‘చూడలేని’ అనే అదనపు భావాన్ని చేర్చదు.
- source_word: ἐλπίζομεν
  choice: నిరీక్షిస్తే
  rationale: భవిష్యత్తులో నెరవేరబోయేదానిపై ఆశతో ఎదురుచూడటం అనే భావాన్ని ఆధునిక ప్రామాణిక తెలుగులో సహజంగా అందిస్తుంది.
- source_word: δι’ ὑπομονῆς
  choice: సహనంతో
  rationale: ఆలస్యం లేదా కష్టంలో స్థిరంగా నిలిచే ὑπομονή భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది; ‘పట్టుదలతో’ అనే భావసూక్ష్మతను పాదటిప్పణిలో సూచిస్తుంది.
- source_word: ἀπεκδεχόμεθα
  choice: దానికోసం ఎదురుచూస్తాం
  rationale: ఆశతో ఎదురుచూడటం అనే క్రియార్థాన్ని స్పష్టంగా తెలియజేస్తుంది; మూలంలో అంతర్లీనంగా ఉండగల ఆతురతను ప్రధాన పాఠ్యంలో అతిశయింపదు.
theological_decisions:
- issue: కనిపించని భవిష్యత్ నెరవేర్పుతో క్రైస్తవ నిరీక్షణకు ఉన్న సంబంధం
  choice: గ్రీకు సంబంధవాచక ప్రయోగం వలెనే నిరీక్షణ విషయాన్ని ‘మనం చూడనిది’ అని మాత్రమే ఉంచాం.
  alternative: సందర్భం ఆధారంగా దానిని రక్షణ, విమోచన లేదా పునరుత్థానం అని విస్తరించడం.
  rationale: సమీప సందర్భం దాని సూచనను వివరిస్తున్నప్పటికీ, ఈ వచనం స్వయంగా నిర్దిష్ట సిద్ధాంతపర పదాన్ని ఇవ్వదు; అందువల్ల మూలంలోని నియంత్రిత అస్పష్టతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవభరితంగా రూపొందించబడింది. ‘నిరీక్షిస్తే/ఎదురుచూస్తాం’ ద్వారా ἐλπίζομεν మరియు ἀπεκδεχόμεθα మధ్య ఉన్న ఆశ–వేచియుండుట భేదాన్ని నిలిపాం.
