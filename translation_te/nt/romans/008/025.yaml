review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the conditional contrast, the unseen object, and the instrumental sense of δι’ ὑπομονῆς. However, rendering ἐλπίζομεν as నిరీక్షిస్తే substantially overlaps with the following ἀπεκδεχόμεθα (‘wait/await’), weakening Paul’s deliberate distinction between hoping and awaiting.
  naturalness: 'The sentence is otherwise fluent modern standard Telugu. Replacing నిరీక్షిస్తే with ఆశిస్తే makes the progression both more idiomatic and more semantically distinct: hope for what is unseen, then await it with endurance.'
  terminology: ఆశిస్తే appropriately renders ἐλπίζομεν, while ఎదురుచూస్తాం renders ἀπεκδεχόμεθα. సహనంతో is a clear, natural rendering of ὑπομονῆς; the footnote preserves the ‘perseverance’ alternative and the expectancy nuance of the final verb.
  issues:
  - severity: medium
    issue: ἐλπίζομεν is rendered నిరీక్షిస్తే.
    rationale: నిరీక్షించు means ‘wait/await’ and thus duplicates the semantic domain of ἀπεκδεχόμεθα, which the draft subsequently renders ఎదురుచూస్తాం. The Greek intentionally uses hope first and expectant waiting second; ఆశిస్తే preserves that distinction.
  revised_text: అయితే మనం చూడనిదాని కోసం ఆశిస్తే, సహనంతో దానికోసం ఎదురుచూస్తాం.[a]
