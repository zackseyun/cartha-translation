id: ROM.8.9
reference: Romans 8:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: te
  text: అయితే మీరు శరీరంలో[a] లేరు, ఆత్మలో ఉన్నారు—దేవుని ఆత్మ నిజంగా మీలో నివసిస్తే. ఎవరికైనా మెస్సీయ యొక్క ఆత్మ[b] లేకపోతే, అతడు ఆయనకు చెందినవాడు కాదు.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘పాప స్వభావంలో.’ గ్రీకు పదశః: ‘శరీరంలో.’'
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘క్రీస్తు ఆత్మ.’
    reason: lexical_alternative
  - marker: c
    text: 'పదశః: ‘అతడు ఆయనవాడు కాదు.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  choice: శరీరం
  rationale: పౌలు ఉపయోగించిన కీలక పదాన్ని వ్యాఖ్యానాత్మకంగా ‘పాప స్వభావం’ అని మార్చకుండా నిలుపుతుంది; ఇక్కడ ఇది కేవలం భౌతిక దేహం కాక, ఒక జీవన పరిధిని సూచిస్తుంది.
- source_word: πνεῦμα
  choice: ఆత్మ
  rationale: సమీప సందర్భంలో ‘దేవుని ఆత్మ’, ‘మెస్సీయ ఆత్మ’ అని గుర్తించబడినందున పరిశుద్ధాత్మను సూచిస్తుంది.
- source_word: οἰκεῖ
  choice: నివసిస్తే
  rationale: తాత్కాలిక ఉనికికన్నా స్థిరంగా లోపల నివసించే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా వాడబడింది; ‘మెస్సీయ’ మూలార్థాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: ఆయనకు చెందినవాడు కాదు
  rationale: గ్రీకు స్వామ్యసంబంధ నుడికారాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; ‘ఆయన’ అనే సర్వనామాన్ని ఉంచి దాని సూచనను అతిగా నిర్దిష్టం చేయదు.
- source_word: εἴπερ
  choice: నిజంగా ... ఉంటే
  rationale: షరతు రూపాన్నీ, అది నిజమేనని భావిస్తూ చెప్పే వాక్చాతుర్య బలాన్నీ రెండింటినీ నిలుపుతుంది.
- source_word: Ὑμεῖς
  choice: మీరు
  rationale: గ్రీకులోని స్పష్టమైన, నొక్కిచెప్పబడిన బహువచన సర్వనామాన్ని ఉంచి ముందున్న విషయంతో వ్యత్యాసాన్ని ‘అయితే’ ద్వారా చూపిస్తుంది.
- source_word: οὗτος
  choice: అతడు
  rationale: గ్రీకు వ్యాకరణపరమైన పుంలింగ ఏకవచన ప్రతినిధి రూపాన్ని ప్రతిబింబిస్తుంది; సందర్భంలో సాధారణంగా ఏ వ్యక్తినైనా సూచిస్తుంది.
theological_decisions:
- issue: ‘శరీరంలో’ మరియు ‘ఆత్మలో’ అనే పౌలు వ్యత్యాసం
  choice: పరిశుద్ధాత్మ నివాసంతో ముడిపడిన జీవన పరిధి/అస్తిత్వ భాషగా ఉంచడం
  alternative: ‘పాప స్వభావంలో’ మరియు ‘ఆత్మ ఆధీన జీవితం’ అని వ్యాఖ్యానాత్మకంగా చెప్పడం
  rationale: మూలంలోని పౌలు పదజాలాన్నీ దాని సిద్ధాంతపరమైన ఉద్రిక్తతనూ కాపాడుతుంది; మానసిక ప్రవృత్తులకే భావాన్ని పరిమితం చేయదు.
- issue: ‘ఆయనకు’లోని సర్వనామ సూచన
  choice: సర్వనామాన్ని అలాగే ఉంచడం; సమీప వ్యాకరణ సంబంధం ప్రకారం అది మెస్సీయను సూచిస్తుంది
  alternative: విస్తృత సందర్భాన్ని బట్టి ‘దేవునికి’ అని స్పష్టీకరించడం
  rationale: మూలపాఠం నిర్దిష్ట నామాన్ని పునరుక్తి చేయదు; అందువల్ల అనువాదం కూడా అవసరానికి మించి నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘శరీరం/ఆత్మ’ అనే పౌలు కీలక పదజాలాన్ని నిలుపుతూ, ‘నివసించు’ అనే సాధారణ బైబిలు వాడుకను ఉపయోగించింది. ప్రధాన పాఠంలోని అన్ని పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
