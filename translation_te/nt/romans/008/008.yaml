  yaml_path: translation/nt/romans/008/008.yaml
  text: Those who are in the flesh cannot please God[a].
translation:
  language: te
  text: శరీర స్వభావానికి లోబడినవారు దేవుణ్ణి మెప్పించలేరు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పాప స్వభావానికి లోబడినవారు.’ గ్రీకులో ‘శరీరంలో’ అని ఉంది; ఈ సందర్భంలో ఇది పౌలు ఉపయోగించిన కీలక పదం.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: ఉన్నవారు
  rationale: నిర్దేశకంతో కూడిన వర్తమాన కృదంతం ఒక వర్గానికి చెందినవారిని, వారి ప్రస్తుత స్థితిని సూచిస్తుంది; ‘ఉన్నవారు’ సహజమైన తెలుగు రూపం.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇది ముందటి వాక్యంతో కొనసాగింపు లేదా వ్యత్యాసాన్ని సూచిస్తుంది. అయితే ఈ చిన్న వాక్యంలో తెలుగు సహజత్వం కోసం ప్రత్యేక సంధానపదం అవసరం లేదు; సందర్భమే వ్యత్యాసాన్ని స్పష్టం చేస్తుంది.
- source_word: ἐν σαρκὶ
  choice: శరీరంలో
  rationale: రోమా 8లో σάρξ పౌలు వాడే భావభారితమైన కీలక పదం. దానిని ‘పాప స్వభావం’ అని వ్యాఖ్యానాత్మకంగా నిర్ణయించకుండా, మూలంలోని రూపకాన్ని మరియు సందర్భ సంబంధాన్ని నిలుపుతుంది.
- source_word: θεῷ ἀρέσαι
  choice: దేవుణ్ణి సంతోషపరచ
  rationale: తెలుగులో ‘దేవుణ్ణి సంతోషపరచడం’ అనేది ἀρέσκω యొక్క సహజమైన, స్పష్టమైన సమానార్థక ప్రయోగం.
- source_word: οὐ δύνανται
  choice: సంతోషపరచలేరు
  rationale: నిరాకరించబడిన సామర్థ్యాన్ని తెలుగులో సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పౌలు రచనల్లో వివాదాస్పదమైన σάρξ పదాన్ని అనువదించడం
  choice: శరీరంలో
  alternative: పాప స్వభావంలో
  rationale: మూలంలోని ‘శరీరం’ అనే కీలక పదాన్ని ప్రధాన పాఠ్యంలో ఉంచడం ద్వారా దాని భావపరమైన ఉద్రిక్తతను, రోమా 8లోని పదసంబంధాన్ని కాపాడాం. వ్యాఖ్యానాత్మక ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే మూలంలోని పౌలు పదప్రయోగాన్ని నిలుపుతూ గౌరవప్రదమైన శైలి ఉపయోగించబడింది.
