- from: అలాగే, ఆత్మ కూడా మన బలహీనతలో మనకు సహాయం చేస్తాడు. ఎందుకంటే మనం తగిన విధంగా దేని కోసం ప్రార్థించాలో మనకు తెలియదు. అయితే ఆత్మ తానే[a] మాటల్లో వ్యక్తం చేయలేని మూలుగులతో[b] మన పక్షంగా విజ్ఞాపన చేస్తాడు.
  to: అలాగే, ఆత్మ కూడా మన బలహీనతలో మనకు సహాయం చేస్తాడు. ఎందుకంటే మనం తగిన విధంగా దేని కోసం ప్రార్థించాలో మనకు తెలియదు. అయితే ఆత్మ తానే[a] మాటల్లో వ్యక్తం చేయలేని మూలుగులతో[b] మన పక్షంగా మధ్యవర్తిత్వం చేస్తాడు.
  rationale: The revision replaces the more general ‘విజ్ఞాపన చేస్తాడు’ with ‘మధ్యవర్తిత్వం చేస్తాడు’ to represent the intercessory force of ὑπερεντυγχάνει more accurately. Footnote a is tightened to explain the emphatic wording without importing a doctrinal conclusion from grammatical gender. All other wording is retained because it is faithful to the Greek and natural in modern standard Telugu.
