id: ROM.8.26
reference: Romans 8:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: te
  text: అలాగే, ఆత్మ కూడా మన బలహీనతలో మనకు సహాయం చేస్తాడు. ఎందుకంటే మనం తగిన విధంగా దేని కోసం ప్రార్థించాలో మనకు తెలియదు. అయితే ఆత్మ తానే[a] మాటల్లో వ్యక్తం చేయలేని మూలుగులతో[b] మన పక్షంగా మధ్యవర్తిత్వం చేస్తాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘ఆత్మ’ అనే నామవాచకం వ్యాకరణపరంగా నపుంసకలింగంలో ఉంది. ఇక్కడ ‘తానే’ అనే పదం ఆత్మ స్వయంగా చేసే కార్యాన్ని అవధారిస్తుంది.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘మాటలులేని మూలుగులతో’ లేదా ‘పలకలేని మూలుగులతో.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡσαύτως
  choice: అలాగే
  rationale: ముందటి సందర్భంతో పౌలు చేస్తున్న అనుసంధానాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: συναντιλαμβάνεται
  choice: మనకు సహాయం చేస్తాడు
  rationale: కలిసి భారాన్ని మోయడం లేదా తోడుగా వచ్చి ఆదుకోవడం అనే బలమైన భావం క్రియలో ఉంది; ఆధునిక తెలుగులో ‘సహాయం చేస్తాడు’ సహజంగా ఉండగా, ‘మన బలహీనతలో’ అనే సందర్భం ఆ సహాయం స్వభావాన్ని నిలుపుతుంది.
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: మన బలహీనతలో
  rationale: ఏకవచనాన్ని నిలుపుతూ, శారీరక లేదా ఆత్మీయ పరిమితి అని భావాన్ని అనవసరంగా కుదించదు.
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ
  choice: మనం తగిన విధంగా దేని కోసం ప్రార్థించాలో
  rationale: τί ఇక్కడ ప్రార్థనకు సంబంధించిన విషయాన్ని సూచిస్తుంది; καθὸ δεῖ ప్రార్థించవలసిన తగిన విధానాన్ని తెలియజేస్తుంది. తెలుగు వాక్యనిర్మాణంలో రెండింటినీ స్పష్టంగా, సహజంగా ఉంచింది.
- source_word: οὐκ οἴδαμεν
  choice: మనకు తెలియదు
  rationale: జ్ఞానం లేకపోవడాన్ని నేరుగా, సాధారణ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: αὐτὸ τὸ πνεῦμα
  choice: ఆత్మ తానే
  rationale: అవధారణను నిలుపుతూ, సహాయం చేసి విజ్ఞాపన చేసే ఆత్మ యొక్క స్వీయ కార్యాన్ని తెలియజేస్తుంది.
- source_word: ὑπερεντυγχάνει
  choice: మన పక్షంగా విజ్ఞాపన చేస్తాడు
  rationale: అత్యంత అరుదైన ఈ సమాసక్రియలో ఇతరుల పక్షంగా విన్నవించడం అనే భావం ఉంది; ‘మన పక్షంగా’ సందర్భసిద్ధమైన సంబంధాన్ని తెలుగులో స్పష్టం చేస్తుంది.
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: మాటల్లో వ్యక్తం చేయలేని మూలుగులతో
  rationale: మాటల ద్వారా పలకలేని లేదా వ్యక్తం చేయలేని మూలుగులు అనే భావాన్ని గంభీరమైన, సహజమైన తెలుగులో అందిస్తుంది; అది కేవలం వినిపించని మూలుగులు అని పరిమితం చేయదు.
theological_decisions:
- issue: πνεῦμα వ్యాకరణపరంగా నపుంసకలింగ నామవాచకమైనప్పటికీ, వాక్యంలో ఆత్మ వ్యక్తిగతంగా సహాయం చేసి విజ్ఞాపన చేస్తున్నట్లు చెప్పడం
  choice: ఆత్మ తానే … విజ్ఞాపన చేస్తాడు
  alternative: ఆత్మ స్వయంగా … విజ్ఞాపన చేస్తుంది
  rationale: మూలంలోని αὐτό అనే అవధారణతో పాటు ఆత్మ చేస్తున్న వ్యక్తిగత కార్యాన్ని తెలుగు సహజంగా ప్రతిబింబించేందుకు ‘తానే’ మరియు వ్యక్తిని సూచించే క్రియారూపం వాడబడ్డాయి. ఇది కేవలం గ్రీకు వ్యాకరణ లింగాన్ని యాంత్రికంగా అనుసరించకుండా సందర్భంలోని వ్యక్తిగత కార్యాన్ని నిలుపుతుంది.
- issue: στεναγμοῖς ἀλαλήτοις అనేది పలకలేని మూలుగులా లేక మాటలులేని మూలుగులా అన్న భావ ఛాయ
  choice: మాటల్లో వ్యక్తం చేయలేని మూలుగులతో
  alternative: మాటలులేని మూలుగులతో
  rationale: ἀλάλητος పలకలేనిది లేదా మాటలతో వ్యక్తం కానిది అనే భావాలను అనుమతిస్తుంది. ప్రధాన పాఠం వ్యక్తీకరించలేని భావాన్ని ఇస్తూ, ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచి అసలు పదంలోని భావ పరిధిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పత్రికా శైలికి తగిన గౌరవప్రదమైన భాషను వాడాం. ‘విజ్ఞాపన’ ధార్మిక సందర్భంలో సహజమైనప్పటికీ అతి ప్రాచీనంగా లేదు. గ్రీకు వాక్యంలోని భావ సంబంధాలను స్పష్టంగా ఉంచేందుకు తెలుగులో రెండు వాక్యాలుగా విభజించాం.
