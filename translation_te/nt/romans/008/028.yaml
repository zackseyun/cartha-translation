id: ROM.8.28
reference: Romans 8:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσι τὸν θεὸν πάντα ⸀συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/028.yaml
  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: te
  text: ఇక, దేవుణ్ణి ప్రేమించేవారికి అన్నీ కలిసి మేలు కలిగేలా పనిచేస్తాయని[a] మనకు తెలుసు—సంకల్పం ప్రకారం[b] పిలువబడినవారికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'కొన్ని ప్రతుల్లో: “దేవుడు అన్నిటినీ మేలు కోసం కలిసి పనిచేయిస్తాడు.”'
    reason: textual_variant
  - marker: b
    text: లేదా, “ఆయన సంకల్పం ప్రకారం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: మనకు తెలుసు
  rationale: వర్తమానంలో స్థిరంగా ఉన్న జ్ఞానాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: ఇక
  rationale: బలమైన వ్యతిరేకతను సూచించకుండా, వాదనను ముందుకు తీసుకెళ్లే మృదువైన అనుసంధానంగా వాడబడింది.
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: దేవుణ్ణి ప్రేమించేవారికి
  rationale: దత్తివిభక్తి భావాన్ని తెలుగులోని ‘వారికి’ సహజంగా మోస్తుంది; సమూహ నిర్దేశాన్ని అలాగే ఉంచుతుంది.
- source_word: πάντα
  choice: అన్నీ
  rationale: నపుంసక బహువచనంలోని విస్తృతిని సంక్షిప్తంగా, స్పష్టంగా నిలుపుతుంది.
- source_word: συνεργεῖ
  choice: కలిసి … పనిచేస్తాయి
  rationale: ప్రధాన పాఠంలో దేవుణ్ణి స్పష్టమైన కర్తగా చేర్చకుండా, సమస్తం పరస్పరం కలిసి పనిచేస్తుందనే మూలపాఠ నిర్మాణాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: εἰς ἀγαθόν
  choice: మేలు కలిగేలా
  rationale: ఫలితం లేదా దిశ అనే భావాన్ని సహజంగా తెలియజేస్తుంది; ‘మేలు’కు అనవసరమైన నిర్దిష్టతను జోడించదు.
- source_word: τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν
  choice: సంకల్పం ప్రకారం పిలువబడినవారికి
  rationale: పిలువబడినవారి వర్ణనను నిలుపుతూ, గ్రీకులో లేని స్వామ్యసూచక సర్వనామాన్ని ప్రధాన పాఠంలో చేర్చదు.
- source_word: πρόθεσιν
  choice: సంకల్పం
  rationale: ఈ సందర్భంలోని ఉద్దేశపూర్వక ప్రణాళిక లేదా ఉద్దేశం అనే భావాన్ని గౌరవప్రదమైన, సాధారణ తెలుగులో తెలియజేస్తుంది.
- source_word: κλητοῖς
  choice: పిలువబడినవారు
  rationale: పౌలు వాడే ‘పిలుపు’ భావానికి అనుగుణంగా ఉండి, ఆ పిలుపు ఎలా కార్యరూపం దాల్చుతుందో అదనంగా వ్యాఖ్యానించదు.
theological_decisions:
- issue: συνεργεῖ అనే క్రియకు అంతర్లీన కర్త ఎవరు?
  choice: ప్రధాన పాఠంలో ‘అన్నీ కలిసి … పనిచేస్తాయి’ అని అనువదించడం
  alternative: ‘దేవుడు అన్నిటినీ కలిపి మేలు కలిగిస్తాడు’ అనే పాఠాంతరం
  rationale: ఇచ్చిన SBLGNT పాఠంలో θεός స్పష్టమైన కర్తగా లేదు. అందువల్ల ప్రధాన పాఠం ఆ అస్పష్టతను నిలుపుతుంది; దేవుణ్ణి కర్తగా పేర్కొనే ప్రతుల పాఠాన్ని పాదసూచికలో ఇస్తుంది.
- issue: κατὰ πρόθεσινలో స్వామ్యసూచక పదాన్ని చేర్చాలా?
  choice: ‘సంకల్పం ప్రకారం’ అని మాత్రమే ఉంచడం
  alternative: ‘ఆయన సంకల్పం ప్రకారం’
  rationale: సందర్భం దేవుని సంకల్పాన్ని సూచించినప్పటికీ, ఇచ్చిన గ్రీకు పదబంధంలో ‘ఆయన’ అనే స్వామ్యసూచకం లేదు. కాబట్టి దానిని ప్రధాన పాఠంలో చేర్చకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని పాటించింది. వాక్యాంతంలోని వివరణాత్మక సమూహాన్ని దీర్ఘ విరామచిహ్నంతో అనుసంధానించి, ‘దేవుణ్ణి ప్రేమించేవారు’ మరియు ‘పిలువబడినవారు’ ఒకే సమూహమని స్పష్టం చేసింది. మూలపాఠంలో లేని ‘దేవుడు’ లేదా ‘ఆయన’ను ప్రధాన వాక్యంలో చేర్చలేదు.
