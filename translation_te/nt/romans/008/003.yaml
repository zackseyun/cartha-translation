id: ROM.8.3
reference: Romans 8:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: te
  text: ధర్మశాస్త్రం చేయలేనిదాన్ని[a] దేవుడు చేశాడు; ఎందుకంటే శరీరం ద్వారా అది బలహీనమైంది. ఆయన తన సొంత కుమారుణ్ణి పాపమయమైన శరీర సాదృశ్యంలోను[d], పాపం నిమిత్తమును[c] పంపి, శరీరంలో పాపాన్ని ఖండించాడు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “ధర్మశాస్త్రపు అసమర్థతను.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “శరీరం” అనేది పతనమైన మానవ స్థితిలోని బలహీనతను సూచించవచ్చు. కొన్ని అనువాదాలు కొన్ని సందర్భాల్లో దీనిని మరింత వ్యాఖ్యానాత్మకంగా “పాపస్వభావం” అని అనువదిస్తాయి.
    reason: lexical_alternative
  - marker: c
    text: “పాపం నిమిత్తం” అనే గ్రీకు పదబంధానికి బలిసంబంధమైన భావంలో “పాపపరిహార బలిగా” అనే అర్థం కూడా ఉండవచ్చు.
    reason: alternative_reading
  - marker: d
    text: “పాపమయమైన శరీర సాదృశ్యంలో” అనే మాట కుమారుని నిజమైన మానవత్వాన్ని ధృవీకరిస్తూనే, ఆయనను పాపంతో సమానపరచకుండా జాగ్రత్తగా వేరుచేస్తుంది.
    reason: cultural_note
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: ధర్మశాస్త్రం చేయలేనిదాన్ని
  rationale: గ్రీకు నపుంసక ఏకవచన ప్రయోగం ధర్మశాస్త్రపు అసమర్థతను సూచిస్తుంది. తెలుగులో సహజంగా ఉండేందుకు క్రియాత్మకంగా అనువదించబడింది; మరింత అక్షరార్థ రూపం పాదసూచికలో ఉంది.
- source_word: νόμος
  choice: ధర్మశాస్త్రం
  rationale: ఈ సందర్భంలో మోషే ధర్మశాస్త్రాన్ని సూచించే సాధారణ, స్పష్టమైన తెలుగు పదం.
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: శరీరం మూలంగా అది బలహీనంగా ఉండడమే ఇందుకు కారణం
  rationale: ధర్మశాస్త్రంలోనే లోపముందని కాకుండా, శరీరం ద్వారా అది బలహీనపడిన విధాన్ని వివరిస్తున్న గ్రీకు ఉపవాక్య భావాన్ని సహజమైన తెలుగులో చూపుతుంది.
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: తన సొంత కుమారుణ్ణి
  rationale: ἑαυτοῦ లోని ఉద్ఘాటనను ‘సొంత’ అనే పదం నిలుపుతుంది.
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: పాపశరీర సాదృశ్యంలో
  rationale: కుమారుని నిజమైన మానవత్వాన్నీ, ఆయనకు పాపాన్ని ఆపాదించకూడదనే గ్రీకు వాక్యంలోని జాగ్రత్తనూ నిలుపుతుంది.
- source_word: περὶ ἁμαρτίας
  choice: పాపం నిమిత్తం
  rationale: ప్రధాన పాఠంలో గ్రీకు పదబంధంలోని విస్తృతమైన భావాన్ని నిలుపుతుంది; బలిసంబంధమైన ‘పాపపరిహార బలిగా’ అనే సాధ్యార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: పాపానికి శిక్ష తీర్చాడు
  rationale: κατακρίνω లోని న్యాయనిర్ణయ, దండన భావాన్ని ‘ఖండించాడు’ కంటే స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἐν τῇ σαρκί
  choice: శరీరంలోనే
  rationale: గ్రీకులో సర్వనామం లేకపోవడం వల్ల ఎవరి శరీరమో ప్రధాన పాఠంలో అతిగా నిర్దిష్టపరచకుండా, వాక్యంలోని ఉద్ఘాటనను ‘నే’ ద్వారా చూపుతుంది.
theological_decisions:
- issue: ఈ వచనంలో σάρξ భావం
  choice: రెండు చోట్లా ‘శరీరం’ అనే పదాన్ని నిలిపాం.
  alternative: ‘పాపస్వభావం’ అని వ్యాఖ్యానాత్మకంగా అనువదించడం.
  rationale: పౌలు ఉపయోగించిన శారీరక మానవ బలహీనత, అవతార సంబంధిత భావాల మధ్య ఉన్న పొరలను ‘శరీరం’ నిలుపుతుంది; ‘పాపస్వభావం’ అని మార్చడం భావాన్ని ముందుగానే పరిమితం చేస్తుంది.
- issue: περὶ ἁμαρτίας భావం
  choice: ప్రధాన పాఠంలో ‘పాపం నిమిత్తం’.
  alternative: ‘పాపపరిహార బలిగా’.
  rationale: సెప్టుయజింటు బలి వాడుక వల్ల బలిసంబంధమైన అర్థం సాధ్యమైనప్పటికీ, గ్రీకు పదబంధం ‘పాపం కోసం/పాపం విషయమై’ అనే విస్తృత భావాన్నీ అనుమతిస్తుంది. అందువల్ల వ్యాఖ్యానాన్ని ప్రధాన పాఠంలో ఖరారు చేయకుండా ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- issue: ‘పాపశరీర సాదృశ్యంలో’ అనే క్రీస్తుసంబంధ భావం
  choice: ‘సాదృశ్యం’ అనే జాగ్రత్తగల పదాన్ని నిలిపాం.
  alternative: కుమారుని పాపరాహిత్యాన్ని లేదా మానవత్వాన్ని వివరణాత్మక పదాలతో ప్రధాన పాఠంలో విస్తరించడం.
  rationale: వాక్యం కుమారుని నిజమైన శరీరధారణను సూచిస్తూనే ఆయనను పాపంతో సమానపరచదు. మూలంలోని ఈ ఉద్రిక్తతను అనువాదం కూడా నిలుపాలి.
- issue: ἐν τῇ σαρκί లో సూచిత శరీరం
  choice: ‘శరీరంలోనే’ అని, సర్వనామం చేర్చకుండా అనువదించాం.
  alternative: ‘ఆయన శరీరంలో’ లేదా ‘కుమారుని శరీరంలో’.
  rationale: సందర్భం కుమారుని శరీరాన్ని బలంగా సూచించినా, గ్రీకులో ‘ఆయన’ అనే సర్వనామం లేదు. అందువల్ల మూలంలోని సంక్షిప్తత, స్వల్ప అస్పష్టత నిలుపబడ్డాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని దీర్ఘ నిర్మాణాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించాం. ‘ధర్మశాస్త్రం’, ‘శరీరం’, ‘సాదృశ్యం’, ‘శిక్ష తీర్చాడు’ వంటి పదాలు పౌలు వాదనలోని న్యాయ, అవతార, మానవ బలహీనత భావాలను వ్యాఖ్యానాత్మకంగా అతిగా పరిష్కరించకుండా నిలుపుతాయి.
