id: ROM.11.34
reference: Romans 11:34
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τίς γὰρ ἔγνω νοῦν κυρίου; ἢ τίς σύμβουλος αὐτοῦ ἐγένετο;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: te
  text: ఎందుకంటే, ప్రభువు మనసును ఎవరు తెలుసుకున్నారు? లేదా ఆయనకు సలహాదారుగా ఎవరు అయ్యారు?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ పౌలు యెషయా 40:13ను ప్రతిధ్వనింపజేస్తున్నాడు. అక్కడి గ్రీకు పాఠం కూడా ప్రభువు మనసును ఎవరు తెలుసుకున్నారో, ఆయనకు సలహాదారుగా ఎవరు అయ్యారో ప్రశ్నిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: ఎవరు
  rationale: అలంకారిక ప్రశ్నను ప్రారంభించే ప్రశ్నార్థక సర్వనామం; ఆధునిక తెలుగులో సహజంగా ఉండి మూలంలోని ప్రశ్న బలాన్ని నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న వాక్యానికి కారణం లేదా వివరణను కలిపే అనుసంధాన పదం; పౌలు వాదనలోని వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: ἔγνω
  choice: తెలుసుకున్నారు
  rationale: γινώσκω అనే క్రియకు నేరమైన సమానార్థకం. లేఖన ఉల్లేఖనంలోని సాధారణ, కాలాతీత అలంకారిక ప్రశ్నకు తెలుగులో సహజంగా సరిపోతుంది.
- source_word: νοῦν
  choice: మనసును
  rationale: ఇక్కడ దేవుని ఆలోచన, ఉద్దేశం, అవగాహన అనే భావపరిధిని సూచిస్తుంది; ‘మనసు’ మూలానికి దగ్గరగా ఉండి తెలుగులో స్పష్టంగా ఉంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: κύριοςకు సాధారణ తెలుగు సమానార్థకం. యెషయా నేపథ్యాన్ని గౌరవిస్తూ, ప్రధాన పాఠంలో దాని సూచనను మరింత సంకుచితం చేయదు.
- source_word: ἢ
  choice: లేదా
  rationale: సమాంతరమైన రెండవ అలంకారిక ప్రశ్నను మొదటిదానితో కలిపే విభాజక సంధిని యథాతథంగా నిలుపుతుంది.
- source_word: σύμβουλος
  choice: సలహాదారు
  rationale: సలహా ఇచ్చే వ్యక్తిని నేరుగా సూచించే ఆధునిక, గౌరవప్రదమైన పదం.
- source_word: αὐτοῦ
  choice: ఆయనకు
  rationale: తెలుగు వాక్య నిర్మాణంలో ‘ఆయనకు సలహాదారుగా’ అనేది గ్రీకు సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐγένετο
  choice: అయ్యారు
  rationale: ‘అవడం/అయ్యడం’ అనే గ్రీకు భావాన్ని నిలుపుతుంది; ఎవ్వరూ దేవునికి సలహాదారు స్థానంలోకి రాలేదనే అలంకారిక ప్రశ్నను వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: యెషయా నుండి తీసుకున్న ప్రశ్నలో ‘ప్రభువు’ అనే పదం ఎవరిని సూచిస్తుంది
  choice: మూల గ్రీకు κυρίου ప్రకారం ‘ప్రభువు’ అని అనువదించి, ప్రధాన పాఠంలో సూచనను అంతకంటే సంకుచితం చేయలేదు.
  alternative: యెషయా నేపథ్యంలోని దైవనామాన్ని స్పష్టంగా చూపే విధంగా ‘యెహోవా’ అని అనువదించడం.
  rationale: పౌలు గ్రీకు పాఠంలో κυρίου వాడుతున్నాడు. ఇది సందర్భంలో దేవుణ్ణి సూచించి ఆయన జ్ఞానం అగాధమైనదనే స్తుతిని బలపరుస్తుంది; అయినా అనువాదం కొత్త నామరూపాన్ని ప్రధాన పాఠంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ లేఖన ఉల్లేఖనానికి తగిన గంభీరతను నిలిపే శైలి. రెండు అలంకారిక ప్రశ్నల నిర్మాణం, ‘లేదా’ అనే అనుసంధానం, ‘అయ్యారు’లోని becoming భావం కాపాడబడ్డాయి.
