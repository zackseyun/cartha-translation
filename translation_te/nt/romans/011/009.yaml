id: ROM.11.9
reference: Romans 11:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ Δαυὶδ λέγει· Γενηθήτω ἡ τράπεζα αὐτῶν εἰς παγίδα καὶ εἰς θήραν καὶ εἰς σκάνδαλον καὶ εἰς ἀνταπόδομα αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: te
  text: 'దావీదు ఇలా అంటున్నాడు: “వారి భోజనబల్ల వారికి ఉరిగాను, వలగాను, తడబడటానికి కారణంగాను, ప్రతిఫలంగాను మారుగాక.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δαυὶδ
  choice: దావీదు
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: λέγει
  choice: ఇలా అంటున్నాడు
  rationale: ఉద్ధరణను పరిచయం చేసే గ్రీకు వర్తమాన కాలాన్ని సహజమైన తెలుగు సాహిత్య వర్తమానంగా నిలిపింది.
- source_word: Γενηθήτω
  choice: మారుగాక
  rationale: ఆజ్ఞార్థక రూపంలోని ఆకాంక్షాత్మక, శాపోక్తి బలాన్ని భవిష్యద్వాక్యంగా మార్చకుండా నిలిపే సహజ తెలుగు రూపం.
- source_word: τράπεζα
  choice: భోజనబల్ల
  rationale: మూలంలోని స్పష్టమైన బల్ల రూపకాన్ని నిలుపుతూ, ఇక్కడ ఆహారం లేదా విందు సందర్భమని సాధారణ పాఠకునికి తెలియజేస్తుంది.
- source_word: παγίδα
  choice: ఉరి
  rationale: పట్టుకునే ఉచ్చు అనే భావాన్ని ఇస్తూ తరువాతి θήραν నుంచి పదభేదాన్ని నిలుపుతుంది.
- source_word: θήραν
  choice: వల
  rationale: వేటలో పట్టుకునే సాధన భావాన్ని సహజంగా తెలియజేసి, παγίδαతో ఉన్న సమీపార్థక జతను కాపాడుతుంది.
- source_word: σκάνδαλον
  choice: తడబడే అడ్డు
  rationale: పడిపోవడానికి కారణమయ్యే అడ్డంకి అనే రూపకాన్ని, కేవలం మనస్తాపం అనే భావానికి పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: ἀνταπόδομα
  choice: ప్రతిఫలం
  rationale: తిరిగి ఇచ్చే ఫలితం లేదా తగిన ప్రతిచర్య అనే విస్తృత భావాన్ని నిలుపుతుంది; సందర్భం దాని శిక్షాత్మక స్వభావాన్ని తెలియజేస్తుంది.
- source_word: αὐτοῖς
  choice: వారికి
  rationale: ప్రతిఫలం ఎవరికో సూచించే దత్తివును సహజ తెలుగులో వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: కీర్తన 69:22 నుంచి వచ్చిన శాపోక్తి ఉద్ధరణ
  choice: “మారుగాక” అనే ప్రత్యక్ష ఆకాంక్షాత్మక ఆజ్ఞార్థక రూపాన్ని నిలిపింది.
  alternative: “మారుతుంది” లేదా “మారవచ్చు”
  rationale: గ్రీకు ఆజ్ఞార్థక రూపంలోని తీవ్రతను కేవలం అంచనా లేదా మృదువైన అవకాశంగా మార్చకుండా కాపాడుతుంది.
- issue: ἀνταπόδομα యొక్క శిక్షాత్మక భావం
  choice: ప్రతిఫలం
  alternative: ప్రతీకారం / శిక్షాత్మక ప్రతిఫలం
  rationale: పరస్పర ప్రతిచర్య లేదా తగిన ఫలితం అనే పదార్థ విస్తృతిని నిలిపి, శిక్షాత్మక భావాన్ని సందర్భానికే వదిలింది.
translation_notes:
  register: ఆధునిక ప్రమాణ తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని వరుసగా వచ్చే నాలుగు దుష్ఫల రూపకాలను సంక్షిప్తంగా నిలిపింది.
