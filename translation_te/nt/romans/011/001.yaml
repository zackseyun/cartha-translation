id: ROM.11.1
reference: Romans 11:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: te
  text: 'కాబట్టి నేను అడుగుతున్నాను: దేవుడు తన ప్రజలను తిరస్కరించాడా?[a] ఎంతమాత్రమూ కాదు![b] ఎందుకంటే నేను కూడా ఇశ్రాయేలీయుణ్ణే—అబ్రాహాము సంతానంలో పుట్టినవాణ్ణి, బెన్యామీను గోత్రానికి చెందినవాణ్ణి.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తోసివేశాడా?”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ఇది బలమైన నిరాకరణను తెలిపే మాట; “అసలే కాదు!” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: అక్షరార్థంగా, “అబ్రాహాము విత్తనం నుండి.” అంటే, అబ్రాహాము వంశస్థుణ్ణి.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: కాబట్టి నేను అడుగుతున్నాను
  rationale: λέγω ఇక్కడ అలంకారప్రశ్నను ప్రవేశపెడుతుంది; οὖν యొక్క నిర్ధారణాత్మక సంబంధాన్ని ‘కాబట్టి’ నిలుపుతుంది.
- source_word: μὴ ἀπώσατο
  choice: తిరస్కరించాడా
  rationale: ἀπωθέομαιలోని తోసివేయడం/విసర్జించడం అనే భావాన్ని సందర్భానుసారంగా సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; μή ఆశించే ప్రతికూల జవాబును ప్రశ్న నిర్మాణమే సూచిస్తుంది.
- source_word: τὸν λαὸν αὐτοῦ
  choice: తన ప్రజలను
  rationale: దేవునికి చెందిన ప్రజలు అనే స్వామ్య, నిబంధన సంబంధ భావాన్ని అదనపు వివరణ లేకుండా నిలుపుతుంది.
- source_word: μὴ γένοιτο
  choice: ఎంతమాత్రమూ కాదు!
  rationale: సాధారణ ‘కాదు’ కంటే బలమైన పౌలు నిరాకరణను సహజమైన, గంభీరమైన తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ γὰρ ἐγὼ
  choice: ఎందుకంటే నేను కూడా
  rationale: γάρ కారణాన్ని చూపుతుంది; καὶ ἐγώ పౌలు తననే సాక్ష్యంగా చూపే ఉద్ఘాటనను ‘నేను కూడా’గా తెలియజేస్తుంది.
- source_word: Ἰσραηλίτης
  choice: ఇశ్రాయేలీయుణ్ణే
  rationale: జాతి మరియు నిబంధన గుర్తింపును తెలిపే సహజ తెలుగు రూపం; ‘-నే’ వక్తపై ఉన్న ఉద్ఘాటనను నిలుపుతుంది.
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: అబ్రాహాము సంతానానికి చెందినవాణ్ణి
  rationale: σπέρμα యొక్క వంశసంబంధ భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; అక్షరార్థమైన ‘విత్తనం’ను పాదసూచికలో ఇస్తుంది.
- source_word: φυλῆς Βενιαμίν
  choice: బెన్యామీను గోత్రానికి చెందినవాణ్ణి
  rationale: φυλήకు ప్రామాణికమైన ‘గోత్రం’ను ఉపయోగించి వంశ గుర్తింపును స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ప్రశ్న ఇశ్రాయేలు ప్రజల సంపూర్ణమైన లేదా శాశ్వతమైన తిరస్కరణను సూచిస్తుందా
  choice: ‘దేవుడు తన ప్రజలను తిరస్కరించాడా?’ అని మాత్రమే అనువదించడం
  alternative: ‘దేవుడు తన ప్రజలను పూర్తిగా/శాశ్వతంగా తిరస్కరించాడా?’
  rationale: గ్రీకు వచనంలో ‘పూర్తిగా’ లేదా ‘శాశ్వతంగా’ అనే క్రియావిశేషణం లేదు. ప్రశ్న పరిధిని తరువాతి సందర్భమే వివరించేలా ఉంచడం మూలంలోని theological tensionను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి. పౌలు ప్రశ్నలోని అలంకార స్వభావం, బలమైన నిరాకరణ, తన వంశపారంపర్యాన్ని సాక్ష్యంగా చూపే ఉద్ఘాటన నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
