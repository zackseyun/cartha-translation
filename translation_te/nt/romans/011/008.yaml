id: ROM.11.8
reference: Romans 11:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: te
  text: 'వ్రాయబడి ఉన్న ప్రకారం: “దేవుడు వారికి మొద్దుబార్చే ఆత్మను[a], చూడకుండా ఉండే కళ్లను, వినకుండా ఉండే చెవులను ఈ నాటి వరకు ఇచ్చాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “గాఢనిద్ర కలిగించే ఆత్మను.” ఈ పదబంధం యెషయా 29:10ను ప్రతిధ్వనిస్తుంది; అయితే ఇక్కడి గ్రీకు పదం మొద్దుబారుదల లేదా మత్తువంటి స్పందనలేని స్థితిని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: వ్రాయబడి ఉన్నట్టుగా
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే సూత్రప్రాయమైన పదబంధం; καθώς లోని పోలిక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: దేవుడు వారికి ... ఇచ్చాడు
  rationale: గ్రీకులో దేవుడే ప్రత్యక్ష కర్త; ఆఒరిస్ట్ క్రియను సాధారణ భూతకాలంగా అనువదించాం.
- source_word: πνεῦμα κατανύξεως
  choice: మత్తు కలిగించే ఆత్మను
  rationale: κατάνυξις సూచించే మొద్దుబారిన, స్పందనలేని మానసిక స్థితిని సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తుంది; యెషయా నేపథ్యంలోని ‘గాఢనిద్ర’ భావాన్ని పాదసూచికలో ఉంచాం.
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: చూడలేని కళ్లను
  rationale: τοῦ μή + ధాతురూపంలోని ఉద్దేశం/ఫలితం మధ్యనున్న భావసందిగ్ధతను అతిగా నిర్ణయించకుండా సహజ తెలుగులో సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: వినలేని చెవులను
  rationale: ముందరి సమాంతర నిర్మాణాన్ని నిలుపుతూ ἀκούω యొక్క ప్రాథమిక ‘వినడం’ భావాన్ని అందిస్తుంది.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: ఈ రోజు వరకు
  rationale: లేఖన ఉల్లేఖనం నుండి పౌలు వర్తమాన కాలం వరకు కొనసాగుతున్న స్థితిని తెలిపే గ్రీకు నుడికారానికి సహజమైన తెలుగు రూపం.
theological_decisions:
- issue: కఠినపరచడం లేదా స్పందనలేమిలో దేవుని క్రియాశీలత
  choice: “దేవుడు వారికి ... ఇచ్చాడు” అనే ప్రత్యక్ష వాక్యాన్ని నిలిపాం.
  alternative: “దేవుడు వారికి ... ఉండనిచ్చాడు”
  rationale: Ἔδωκεν అనే క్రియకు ὁ θεός ప్రత్యక్ష కర్త. దీనిని కేవలం అనుమతిగా మార్చడం మూలపాఠంలోని దైవ తీర్పు–మానవ బాధ్యత ఉద్రిక్తతను అనవసరంగా తగ్గిస్తుంది.
- issue: τοῦ μὴ + infinitive లో ఉద్దేశం లేదా ఫలితం
  choice: “చూడలేని ... వినలేని”
  alternative: “చూడకుండా ఉండేందుకు ... వినకుండా ఉండేందుకు”
  rationale: గ్రీకు నిర్మాణం ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. తెలుగు అనువాదం వాటిలో ఒకదానిని మాత్రమే ఖచ్చితపరచకుండా అస్పష్టతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన లేఖనోచిత శైలిని, సమాంతర వాక్య నిర్మాణాన్ని నిలిపాం. ‘మత్తు కలిగించే’ అన్నది మద్యపాన మత్తును మాత్రమే సూచించకుండా సందర్భంలో మానసిక/ఆధ్యాత్మిక స్పందనలేమిని తెలియజేస్తుంది; ప్రత్యామ్నాయమైన ‘గాఢనిద్ర’ను పాదసూచికలో ఇచ్చాం.
