  terminology: ‘ఒలీవ చెట్టు,’ ‘అంటుకట్టడం,’ ‘స్వభావరీత్యా,’ ‘ప్రకృతికి విరుద్ధంగా,’ మరియు ‘సాగుచేయబడిన’ పదాలు ఆధునిక ప్రామాణిక తెలుగులో సాంకేతికంగాను, అర్థవంతంగాను ఉన్నాయి. ‘కొమ్మలు’ మూలంలో ప్రత్యక్షంగా లేనప్పటికీ సమీప రూపకసందర్భం ఆధారంగా చేర్చబడింది; పాదసూచికలో ఇది స్పష్టంగా ఉంది.
