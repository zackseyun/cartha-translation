  source_fidelity: మూల గ్రీకులోని షరతు నిర్మాణం, అడవి/సాగుచేయబడిన ఒలీవ చెట్ల వ్యత్యాసం, παρὰ φύσιν మరియు κατὰ φύσιν మధ్య వ్యతిరేకత, అలాగే ‘తమ సొంత ఒలీవ చెట్టు’ అనే భావం సరిగా ప్రతిఫలించాలి. ‘నరకబడి’ మాత్రమే చెట్టును నరికివేయడమనే భావాన్ని కలిగించవచ్చు; ἐξεκόπης‌కు తగినట్లుగా కొమ్మను చెట్టు నుండి నరికి వేరు చేయడం స్పష్టంచేయబడింది. చివరి వాక్యం ప్రశ్నరూపంలో ఉంచబడింది.
