id: ROM.11.24
reference: Romans 11:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: te
  text: ఎందుకంటే, నీవు స్వభావరీత్యా అడవి ఒలీవ చెట్టు నుండి నరికి వేరు చేయబడి, ప్రకృతికి విరుద్ధంగా సాగుచేయబడిన ఒలీవ చెట్టులోకి అంటుకట్టబడినట్లయితే, స్వభావరీత్యా చెందిన ఈ కొమ్మలు[a] తమ సొంత ఒలీవ చెట్టులోకి ఎంత ఎక్కువగా అంటుకట్టబడతారు?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకు మూలంలో ఇక్కడ ‘కొమ్మలు’ అనే పదం లేదు; అక్షరార్థంగా, ‘స్వభావరీత్యా ఉన్న వీరు’ అని ఉంది. చుట్టుపక్కల ఉన్న ఒలీవ చెట్టు రూపకాన్ని బట్టి ‘కొమ్మలు’ చేర్చబడింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తమ సొంత ఒలీవ చెట్టులోకి తిరిగి అంటుకట్టబడతారు.” తిరిగి చేర్చబడటం సందర్భంలో సూచించబడుతుంది; అయితే ‘తిరిగి’ అనే పదం గ్రీకు క్రియలో ప్రత్యక్షంగా లేదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: నరకబడి
  rationale: ἐκκόπτω అనే క్రియలోని ‘నరికి వేరుచేయడం’ అనే ఉద్యానవన సంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తుంది; సమీప సందర్భాన్ని బట్టి ‘విరిచివేయబడి’ అని మార్చలేదు.
- source_word: ἀγριελαίου
  choice: అడవి ఒలీవ చెట్టు
  rationale: సాగుచేయబడని అడవి ఒలీవ చెట్టును సూచించే నామవాచకానికి సహజమైన, స్పష్టమైన తెలుగు రూపం.
- source_word: παρὰ φύσιν
  choice: ప్రకృతికి విరుద్ధంగా
  rationale: κατὰ φύσινతో ఉన్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని నిలుపుతూ గ్రీకు పదబంధంలోని ‘సహజ క్రమానికి విరుద్ధంగా’ అనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ἐνεκεντρίσθης / ἐγκεντρισθήσονται
  choice: అంటుకట్టబడితే / అంటుకట్టబడతారు
  rationale: ఒక చెట్టు కొమ్మను మరొక చెట్టులో ప్రవేశపెట్టి పెంచే ఉద్యానవన ప్రక్రియకు ప్రస్తుత ప్రామాణిక తెలుగులో ‘అంటుకట్టు’ సహజమైన సాంకేతిక పదం; గ్రీకులోని కర్మణి రూపాన్ని కూడా నిలుపుతుంది.
- source_word: καλλιέλαιον
  choice: సాగుచేసిన ఒలీవ చెట్టు
  rationale: అడవి ఒలీవ చెట్టుకు వ్యతిరేకంగా, మానవ సంరక్షణలో పెంచిన ఒలీవ చెట్టును సూచిస్తుంది; ‘మంచి ఒలీవ చెట్టు’ అనే విలువ నిర్ణయాన్ని జోడించదు.
- source_word: πόσῳ μᾶλλον
  choice: ఇంకెంతగా
  rationale: తక్కువ సంభావ్యమైనది జరిగితే ఎక్కువ సంభావ్యమైనది మరింత నిశ్చయంగా జరుగుతుందనే వాదనను సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: స్వభావరీత్యా దానికి చెందిన వీరు—ఈ కొమ్మలు
  rationale: గ్రీకులో ‘కొమ్మలు’ అనే పదం ప్రత్యక్షంగా లేకపోయినా, చుట్టుపక్కల ఉన్న ఒలీవ చెట్టు రూపకం దానిని బలంగా సూచిస్తుంది. ‘వీరు’ అనే వ్యక్తి సూచనను, ‘కొమ్మలు’ అనే రూపకాన్ని రెండింటినీ నిలిపింది.
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: తమ సొంత ఒలీవ చెట్టులో
  rationale: ἰδίᾳలోని సొంత సంబంధాన్ని, అంటుకట్టే రూపకానికి తగిన ‘చెట్టులో’ అనే గమ్యార్థాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘వీరు’ ఎవరన్నది ఇశ్రాయేలీయులు లేదా యూదులు అని ప్రత్యక్షంగా చెప్పాలా?
  choice: మూలంలోని సూచనాత్మక రూపాన్ని ‘వీరు—ఈ కొమ్మలు’గా ఉంచడం
  alternative: ‘ఈ యూదులు’ లేదా ‘ఈ ఇశ్రాయేలీయులు’ అని స్పష్టీకరించడం
  rationale: రోమా 11 సందర్భం వీరు జాతిపరమైన ఇశ్రాయేలీయులని తెలియజేస్తుంది; అయితే ఈ వచనంలో పౌలు జాతి పేరును ఉపయోగించకుండా ఒలీవ చెట్టు రూపకంలోనే మాట్లాడుతున్నాడు. అందువల్ల మూలంలోని సూచనను, వేదాంతపరమైన ఉద్రిక్తతను నిలిపాం.
- issue: గ్రీకులో ప్రత్యక్షంగా లేని ‘కొమ్మలు’ అనే పదాన్ని చేర్చాలా?
  choice: ప్రధాన వాక్యంలో వివరణాత్మకంగా ‘ఈ కొమ్మలు’ చేర్చడం
  alternative: ‘స్వభావరీత్యా దానికి చెందిన వీరు’ అని మాత్రమే ఉంచడం
  rationale: ముందటి వచనాల్లో విరిచివేయబడిన, అంటుకట్టబడిన కొమ్మలే చర్చలో ఉన్నాయి. తెలుగులో రూపకం వెంటనే అర్థమయ్యేందుకు ఈ సందర్భోచిత పదపూరణ అవసరం; దానిని పాదసూచికలో వెల్లడించాం.
- issue: చివరి క్రియలో తిరిగి అంటుకట్టబడటం అనే భావాన్ని ప్రత్యక్షం చేయాలా?
  choice: ప్రధాన పాఠంలో ‘తిరిగి’ చేర్చకుండా ‘అంటుకట్టబడతారు’ అని ఉంచడం
  alternative: ‘తిరిగి అంటుకట్టబడతారు’
  rationale: తిరిగి చేర్చబడటం అనే భావం సందర్భంలో బలంగా సూచించబడినా, ἐγκεντρισθήσονται అనే క్రియలో ‘తిరిగి’ అనే ఉపసర్గ లేదా పదం ప్రత్యక్షంగా లేదు. మూలానికి సమీపంగా ఉండేందుకు దానిని పాదసూచికలో మాత్రమే పేర్కొన్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఒలీవ’ మరియు ‘అంటుకట్టు’ ద్వారా ఉద్యానవన రూపకాన్ని స్పష్టంగా నిలిపాం. ‘స్వభావరీత్యా / ప్రకృతికి విరుద్ధంగా’ అనే జంటతో κατὰ φύσιν / παρὰ φύσιν మధ్యనున్న ఉద్దేశపూర్వక వ్యత్యాసాన్ని కాపాడాం.
