id: ROM.11.3
reference: Romans 11:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: te
  text: “ప్రభువా, వారు నీ ప్రవక్తలను చంపారు, నీ బలిపీఠాలను కూల్చివేశారు; నేనొక్కడినే మిగిలాను, వారు నా ప్రాణం తీయడానికి ప్రయత్నిస్తున్నారు[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మరింత అక్షరార్థంగా, “వారు నా ప్రాణాన్ని వెదుకుతున్నారు”; అంటే నన్ను చంపాలని చూస్తున్నారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: ప్రభువా
  rationale: దేవుణ్ణి నేరుగా సంబోధించే κύριος సంబోధనారూపానికి సహజమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: ἀπέκτειναν
  choice: చంపారు
  rationale: క్రియలో లేని అదనపు నైతిక భావాన్ని చేర్చకుండా, జరిగిన హత్యాకార్యాన్ని సరళంగా తెలుపుతుంది.
- source_word: θυσιαστήριά
  choice: బలిపీఠాలను
  rationale: బలి అర్పించే పీఠాలను సూచించే θυσιαστήριονకు స్థిరమైన, స్పష్టమైన తెలుగు సమానం.
- source_word: κατέσκαψαν
  choice: కూల్చివేశారు
  rationale: బలిపీఠాలను నేలమట్టం చేయడం లేదా పడగొట్టడం అనే నిర్దిష్ట విధ్వంస భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: κἀγὼ ὑπελείφθην μόνος
  choice: నేనొక్కడినే మిగిలాను
  rationale: καὶ ἐγώలోని అనుసంధానాన్ని వాక్య నిర్మాణంలో నిలుపుతూ, μόνοςలోని సంఖ్యాపరమైన ఏకాకిత్వ ఉద్ఘాటనను ‘ఒక్కడినే’ స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: వారు నా ప్రాణం తీయాలని వెదుకుతున్నారు
  rationale: ψυχή ఇక్కడ జీవితం/ప్రాణాన్ని సూచిస్తుంది. తెలుగులో ‘నా ప్రాణాన్ని వెదుకుతున్నారు’ అసహజంగా ఉండటంతో, ప్రాణహాని ఉద్దేశాన్ని తెలిపే సహజమైన పదబంధాన్ని ఉపయోగించింది; ‘వెదుకుతున్నారు’ ద్వారా ζητοῦσιν రూపకాన్ని కూడా కొంత నిలిపింది.
theological_decisions:
- issue: బెదిరింపు సందర్భంలో ψυχή అర్థం
  choice: నా ప్రాణం
  alternative: నా ఆత్మ
  rationale: ఈ సందర్భంలో ప్రవక్త యొక్క జీవాన్ని తీయడానికి ప్రయత్నించడమే భావం; శరీరానికి భిన్నమైన ఆత్మ గురించి వేదాంత ప్రకటన చేయడం కాదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, బహిరంగ పఠనానికి అనువైన గౌరవప్రదమైన శైలి. ‘నేనొక్కడినే’ ద్వారా ఎలీయా చెప్పిన సంఖ్యాపరమైన ఏకాకిత్వ భావం నిలుపబడింది; ప్రధాన పాఠంలో సహజమైన తెలుగు కోసం గ్రీకు బెదిరింపు నుడికారాన్ని స్వల్పంగా విప్పి చెప్పి, అక్షరార్థ రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
