revisions:
- from: ఎందుకంటే, మీరు ఒకప్పుడు దేవునికి అవిధేయులుగా ఉన్నట్లే, ఇప్పుడు వీరి అవిధేయత కారణంగా కనికరం పొందారు[a].
  to: ఎందుకంటే మీరు ఒకప్పుడు దేవునికి అవిధేయత చూపినట్లే, కానీ ఇప్పుడు వీరి అవిధేయత వల్ల కరుణ పొందారు[a].
  rationale: The revision preserves the source's comparative and adversative flow while rendering the first verb actively, maintaining the shared disobedience terminology, and using a more idiomatic theological equivalent for mercy. No added identification of 'వీరి' is made, since the referent is supplied by the context rather than the verse itself.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:14:58Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the explanatory-comparative γάρ/ὥσπερ construction, the past-to-present contrast, and the causal/instrumental force of τῇ τούτων ἀπειθείᾳ. A revision is warranted because ἠπειθήσατε is an active aorist ('disobeyed' / 'acted disobediently'), whereas 'అవిధేయులుగా ఉన్నారు' recasts it as a stative description. The passive ἠλεήθητε is better represented by 'కరుణ పొందారు' than 'కనికరం పొందారు,' which can suggest pity rather than the Pauline mercy term.
  naturalness: The revised wording is natural modern standard Telugu. 'అవిధేయత చూపినట్లే' expresses the active verbal sense and retains the unfinished comparison appropriate to the surrounding sentence. 'కానీ ఇప్పుడు' clearly renders νῦν δέ.
  terminology: '''అవిధేయత'' consistently renders both ἀπειθέω and ἀπείθεια without reducing the terms to intellectual unbelief. ''కరుణ'' is a more suitable Telugu equivalent for mercy here. The footnote retains ''విశ్వసించలేదు/అవిశ్వాసం'' as a legitimate contextual lexical alternative.'
  issues:
  - severity: medium
    issue: The first occurrence of ἀπειθέω is rendered as a state ('అవిధేయులుగా ఉన్నారు') rather than an active aorist action.
    rationale: The Greek ἠπειθήσατε is active and is more faithfully rendered 'అవిధేయత చూపారు' (or equivalent). This also improves the parallel with the following noun ἀπείθεια.
  - severity: low
    issue: '''కనికరం'' is less precise than ''కరుణ'' for ἠλεήθητε.'
    rationale: In contemporary Telugu, 'కనికరం' can carry the sense of pity. 'కరుణ పొందారు' more naturally conveys receiving mercy while preserving the passive/resultative sense.
