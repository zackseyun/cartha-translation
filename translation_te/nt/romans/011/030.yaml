id: ROM.11.30
reference: Romans 11:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ ὑμεῖς ποτε ἠπειθήσατε τῷ θεῷ, νῦν δὲ ἠλεήθητε τῇ τούτων ἀπειθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: te
  text: ఎందుకంటే మీరు ఒకప్పుడు దేవునికి అవిధేయత చూపినట్లే, కానీ ఇప్పుడు వీరి అవిధేయత వల్ల కరుణ పొందారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అవిధేయత చూపారు,’ ‘అవిధేయత’ అనే రెండు చోట్లా వరుసగా ‘విశ్వసించలేదు,’ ‘అవిశ్వాసం’ అని కూడా అనువదించవచ్చు; ఈ సందర్భంలో గ్రీకు పదాలు రెండు భావాలనూ కలిగి ఉండగలవు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ఎందుకంటే, ... ఉన్నట్లే
  rationale: γάρ యొక్క వివరణాత్మక భావాన్ని ‘ఎందుకంటే’తో, ὥσπερ యొక్క పోలికను ‘ఉన్నట్లే’తో సహజమైన తెలుగులో నిలుపుతుంది; పోలిక తరువాతి వాక్యంలో కొనసాగుతుంది.
- source_word: ὑμεῖς
  choice: మీరు
  rationale: ఇది ద్వితీయ పురుష బహువచనం. సందర్భంలోని అన్యజనులను సూచించినా, మూలంలో లేని ‘అన్యజనులైన’ అనే వివరణను వచనంలో చేర్చలేదు.
- source_word: ποτε
  choice: ఒకప్పుడు
  rationale: గత స్థితిని νῦν (‘ఇప్పుడు’)తో స్పష్టంగా వ్యత్యాసపరుస్తుంది.
- source_word: ἠπειθήσατε
  choice: అవిధేయులుగా ఉన్నారు
  rationale: ἀπειθέωలో అవిధేయత, అవిశ్వాసం అనే పరస్పర సంబంధిత భావాలు ఉన్నాయి. ఇక్కడి ἀπείθεια అనే నామవాచకంతో పదబంధ సంబంధాన్ని నిలుపుతూ నైతిక-సంబంధ భావాన్ని కాపాడుతుంది.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: ἀπειθέωతో వచ్చే దత్తి విభక్తి పూరకాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: νῦν δὲ
  choice: ఇప్పుడు
  rationale: ముందున్న ‘ఒకప్పుడు’తో వ్యత్యాసం తెలుగులో స్పష్టంగా ఉంది; ‘ఎందుకంటే’తో మొదలైన కొనసాగుతున్న పోలికలో అదనపు ‘అయితే’ లేకుండానే వాక్యం సహజంగా ఉంటుంది.
- source_word: ἠλεήθητε
  choice: కనికరం పొందారు
  rationale: ἐλεάω యొక్క కర్మణి భావాన్ని సహజంగా వ్యక్తం చేసి, సంబోధితులు పొందిన దేవుని కనికరంపై దృష్టి ఉంచుతుంది.
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: వీరి అవిధేయత కారణంగా
  rationale: దత్తి విభక్తిలోని సాధనార్థక లేదా కారణార్థక భావాన్ని ‘కారణంగా’ స్పష్టంగా తెలియజేస్తుంది. τούτωνకు సమీప సూచనార్థాన్ని నిలుపుతూ ‘వీరి’ అని అనువదించింది.
theological_decisions:
- issue: ἀπειθέω / ἀπείθεια పదాల భావం
  choice: అవిధేయత
  alternative: అవిశ్వాసం
  rationale: ఈ పదాలు అవిశ్వాసం, అవిధేయత రెండింటినీ సూచించగలవు. ప్రధాన పాఠంలో ‘అవిధేయత’ను ఉంచడం క్రియ-నామవాచకాల అనుసంధానాన్ని కాపాడి, భావాన్ని కేవలం మానసిక నమ్మకలేమిగా కుదించదు; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నమోదు చేసింది.
- issue: τῇ τούτων ἀπειθείᾳ యొక్క సంబంధం
  choice: వీరి అవిధేయత కారణంగా
  alternative: వీరి అవిధేయత ద్వారా
  rationale: దత్తి విభక్తి కారణార్థకంగా లేదా సాధనార్థకంగా అర్థమవవచ్చు. ‘కారణంగా’ సందర్భంలోని రక్షణ-చరిత్ర సంబంధాన్ని స్పష్టంగా తెలుపుతుంది; ఖచ్చితమైన యాంత్రిక విధానాన్ని నిర్దేశించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. వచనం తరువాతి వాక్యంలో పూర్తయ్యే పోలికలో భాగమని ప్రతిబింబించేలా ‘ఉన్నట్లే’ను నిలిపింది. ‘వీరి’ అనే రూపం τούτων యొక్క సమీప సూచనను కాపాడుతుంది.
