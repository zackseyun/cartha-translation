id: ROM.11.4
reference: Romans 11:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: te
  text: అయితే దేవుని జవాబు అతనికి ఏమని చెబుతోంది?[a] “నా కోసం ఏడు వేల మంది పురుషులను మిగిల్చి ఉంచాను;[b] వారు బయలుకు మోకాలు వంచలేదు.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవుని నుండి వచ్చిన జవాబు” లేదా “దైవవాక్కు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “నా కోసం ప్రత్యేకంగా ఉంచుకున్నాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: దేవుని జవాబు
  rationale: ఈ సందర్భంలో ఇది ఏలీయాకు దేవుడు ఇచ్చిన అధికారపూర్వక జవాబును సూచిస్తుంది. ‘దేవుని జవాబు’ ఆధునిక తెలుగులో సహజంగా ఉండి, జవాబు దేవుని నుండి వచ్చిందనే భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: Κατέλιπον
  choice: మిగిల్చి ఉంచాను
  rationale: ఈ క్రియ దేవుడు తన కోసం ఒక శేషాన్ని ఉంచిన పూర్తయిన చర్యను, దాని కొనసాగుతున్న ఫలితాన్ని తెలియజేస్తుంది. ‘మిగిల్చి ఉంచాను’ మూలంలోని భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐμαυτῷ
  choice: నా కోసం
  rationale: ఆత్మార్థక చతుర్థీ విభక్తి దేవుడు ఈ శేషాన్ని తన కోసమే ఉంచాడని సూచిస్తుంది. ‘నా కోసం’ దీనికి సూటిగా, సహజంగా సరిపోతుంది.
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: ఏడు వేల మంది పురుషులను
  rationale: మూలపాఠంలో సాధారణంగా ప్రజలను సూచించే పదం కాకుండా, పురుషులను స్పష్టంగా సూచించే ἄνδρας ఉంది; అందువల్ల లింగసూచనను నిలుపుకున్నాం.
- source_word: οἵτινες
  choice: వారు
  rationale: ఈ సంబంధసర్వనామం ఆ ఏడు వేల మందిని నిర్వచించే వివరణను ప్రవేశపెడుతుంది. తెలుగు వాక్యనిర్మాణంలో ‘వారు’ సహజంగా ఆ సంబంధాన్ని తెలియజేస్తుంది.
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: మోకాలు వంచలేదు
  rationale: ఆరాధనతో కూడిన లోబడుటను సూచించే రూపకచిత్రాన్ని మూలపాఠం ప్రకారమే నిలుపుతూ, తెలుగులో అర్థమయ్యే విధంగా అనువదించాం.
- source_word: τῇ Βάαλ
  choice: బయలుకు
  rationale: Βάαλ అనే దేవతా నామాన్ని తెలుగులో సాధారణంగా వాడే ‘బయలు’ రూపంలో లిప్యంతరీకరించి, దిశను తెలిపే ‘కు’ విభక్తిని జతచేశాం.
theological_decisions:
- issue: ఉద్ధరణలో మాట్లాడుతున్నది దేవుడని స్పష్టపరచాలా
  choice: χρηματισμός ను ‘దేవుని జవాబు’ అని అనువదించి, ఉద్ధరణలో ప్రథమ పురుష దైవవాక్యాన్ని నిలిపాం.
  alternative: దైవ మూలాన్ని స్పష్టంగా చెప్పకుండా కేవలం ‘జవాబు’ అని అనువదించడం.
  rationale: సందర్భం మరియు 1 రాజులు 19లోని మూలవృత్తాంతం ఇది ఏలీయాకు దేవుడు ఇచ్చిన జవాబని స్పష్టం చేస్తాయి. ‘దేవుని జవాబు’ అనేది అదనపు సిద్ధాంతాన్ని చేర్చకుండా χρηματισμός భావాన్ని తెలియజేస్తుంది.
- issue: ἄνδρας లోని లింగసూచన
  choice: పురుషులను
  alternative: ప్రజలను
  rationale: గ్రీకు మూలపాఠం ప్రత్యేకంగా పురుషులను సూచించే పదాన్ని వాడింది. అందువల్ల దానిని లింగతటస్థ పదంగా మార్చకుండా మూలంలోని సూచనను నిలుపుకున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘మోకాలు వంచలేదు’ అనే మూలరూపకాన్ని నిలిపి, ‘బయలు’ అనే పరిచిత నామరూపాన్ని ఉపయోగించాం.
