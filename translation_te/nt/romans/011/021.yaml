id: ROM.11.21
reference: Romans 11:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ θεὸς τῶν κατὰ φύσιν κλάδων οὐκ ἐφείσατο, ⸀οὐδὲ σοῦ φείσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: te
  text: ఎందుకంటే, దేవుడు సహజమైన కొమ్మలను[a] కనికరించకపోతే, నిన్ను కూడా కనికరించడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘ప్రకృతి ప్రకారమైన కొమ్మలు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ఎందుకంటే, ...పోతే
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని ‘ఎందుకంటే’తో, εἰ యొక్క షరతును ‘పోతే’తో సహజమైన తెలుగు వాక్యనిర్మాణంలో నిలుపుతుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: వాక్యంలోని కర్తగా θεόςకు ప్రామాణిక తెలుగు అనువాదం.
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: సహజమైన కొమ్మలను
  rationale: κατὰ φύσιν అనే ‘ప్రకృతి ప్రకారం/సహజమైన’ భావాన్ని సంక్షిప్తంగా ఉంచుతూ, పౌలు ఉపయోగించిన ఒలీవ చెట్టు రూపకాన్ని అలాగే నిలుపుతుంది.
- source_word: οὐκ ἐφείσατο
  choice: విడిచిపెట్టకపోతే
  rationale: φείδομαι యొక్క ‘హాని చేయకుండా వదలడం, కాపాడడం, spare’ అనే భావాన్ని ఈ చెట్టు-కొమ్మల సందర్భంలో సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘నరికివేయకపోతే’ అని రూపకంలోని చర్యను అనువాదంలో అదనంగా చేర్చదు.
- source_word: οὐδὲ σοῦ φείσεται
  choice: నిన్ను కూడా విడిచిపెట్టడు
  rationale: οὐδέ యొక్క ప్రతికూల కొనసాగింపును ‘కూడా ...డు’తో తెలుగులో సహజంగా చూపుతుంది. σοῦ ఏకవచన సంబోధనను ‘నిన్ను’గా స్పష్టంగా నిలుపుతుంది; భవిష్యత్ భావం తెలుగు క్రియారూపంలో వ్యక్తమవుతుంది.
theological_decisions:
- issue: ‘సహజమైన కొమ్మలు’ అనే రూపకానికి సూచితులు
  choice: ప్రధాన పాఠ్యంలో రూపకాన్ని వ్యాఖ్యానించకుండా అలాగే ఉంచడం
  alternative: దీనిని ఇశ్రాయేలు ప్రజలని పాఠ్యంలోనే స్పష్టీకరించడం
  rationale: సందర్భం ఇశ్రాయేలును సూచించినా, ఈ వచనంలో పౌలు రూపక భాషనే వాడుతున్నాడు. అనువాదం ఆ రూపకాన్ని దాటి వ్యాఖ్యానాన్ని చేర్చకూడదు.
- issue: ‘నిన్ను’ ఉద్దేశించిన హెచ్చరిక యొక్క సిద్ధాంతపరమైన పరిధి
  choice: ఏకవచన ప్రత్యక్ష హెచ్చరికగా అనువదించడం
  alternative: దీనిని వ్యక్తిగత లేదా సమూహపరమైన రక్షణ సిద్ధాంతంలో స్పష్టంగా నిర్ధారించడం
  rationale: గ్రీకు పాఠ్యం σοῦ అనే ఏకవచనాన్ని ఉపయోగించి నిజమైన హెచ్చరికను ఇస్తుంది; అయితే పట్టుదల, మతభ్రష్టత్వం, వ్యక్తిగత లేదా సమూహ ఎన్నిక వంటి వివాదాలను ఈ ఒక్క వచనం పేరిట అనువాదంలో పరిష్కరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైనదిగానూ, హెచ్చరిక యొక్క గంభీరతను నిలుపుకునేలా గౌరవప్రదంగానూ రూపొందించబడింది. [a] గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
