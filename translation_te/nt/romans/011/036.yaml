  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: te
  text: ఎందుకంటే సమస్తమూ ఆయన నుంచే, ఆయన ద్వారానే, ఆయనకే ఉన్నాయి.[a] ఆయనకే మహిమ నిరంతరం కలుగుగాక.[b] ఆమేన్.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సమస్తమూ ఆయన నుంచే, ఆయన ద్వారానే, ఆయన కోసమే ఉన్నాయి.”
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, “యుగాల వరకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న స్తుతికి కారణాన్ని లేదా ఆధారాన్ని పరిచయం చేసే సంబంధాన్ని సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ἐξ αὐτοῦ
  choice: ఆయన నుంచే
  rationale: సమస్తానికి దేవుడే మూలమనే ἐκ/ἐξ యొక్క మూలార్థాన్ని తెలుపుతుంది; ‘-ఏ’ గ్రీకు త్రిభాగ వాక్య నిర్మాణంలోని గంభీరతను బలపరుస్తుంది.
- source_word: δι’ αὐτοῦ
  choice: ఆయన ద్వారానే
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధనం లేదా మధ్యవర్తిత్వ భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: εἰς αὐτὸν
  choice: ఆయన కోసమే
  rationale: εἰς తెలిపే గమ్యం లేదా లక్ష్య భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘ఆయన వైపుకే’ అనే దిశార్థం కూడా సాధ్యమని పాదటిప్పణిలో నిలుపబడింది.
- source_word: τὰ πάντα
  choice: సమస్తమూ
  rationale: సృష్టి అంతటినీ ఆవరించే విస్తృత భావాన్ని గంభీరంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτῷ ἡ δόξα
  choice: మహిమ ఆయనకే కలుగుగాక
  rationale: క్రియలేని గ్రీకు స్తుతి వాక్యానికి తెలుగులో ప్రార్థనాత్మక, ఆరాధనాత్మక బలాన్ని సహజంగా అందిస్తుంది.
- source_word: εἰς τοὺς αἰῶνας
  choice: నిరంతరం
  rationale: అక్షరార్థంగా ‘యుగాల వరకు’ అనే అనంతకాల సూచక నానుడిని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: తెలుగు క్రైస్తవ ఆరాధనా వాడుకలో స్థిరపడిన లిప్యంతరీకరణను నిలుపుతుంది.
theological_decisions:
- issue: αὐτοῦ/αὐτὸν/αὐτῷ అనే సర్వనామాల సూచిత వ్యక్తి
  choice: సందర్భానుసారం దేవుడే సూచితుడు; అయినా మూలంలోని సర్వనామాలను ‘ఆయన’గానే ఉంచడం
  alternative: ప్రతి చోటా ‘దేవుడు’ అని స్పష్టీకరించడం
  rationale: రోమా 11:33–35 సందర్భం దేవుణ్ణే సూచిస్తుంది. అయితే పేరును చేర్చకుండా సర్వనామాలను నిలపడం మూలంలోని వాక్చాతుర్యాన్ని, సందర్భాధారితత్వాన్ని కాపాడుతుంది.
- issue: εἰς αὐτόν లోని లక్ష్య లేదా దిశ భావం
  choice: ఆయన కోసమే
  alternative: ఆయన వైపుకే / ఆయనకే
  rationale: సమస్తానికి దేవుడే అంతిమ లక్ష్యమనే భావాన్ని సహజమైన తెలుగులో అందిస్తుంది; గ్రీకు పదబంధంలోని దిశార్థాన్ని పూర్తిగా మూసివేయకుండా పాదటిప్పణిలో ప్రత్యామ్నాయం ఇస్తుంది.
- issue: αὐτῷ ἡ δόξα అనే క్రియలేని స్తుతి వాక్యం
  choice: మహిమ నిరంతరం ఆయనకే కలుగుగాక
  alternative: మహిమ నిరంతరం ఆయనకే చెందుతుంది
  rationale: గ్రీకు వాక్యం స్తుతి సమర్పణగా కూడా, మహిమ ఆయనదేననే ప్రకటనగా కూడా అర్థమవగలదు. ప్రధాన పాఠం ఆరాధనాత్మక సందర్భానికి తగిన ఆశీర్వచన రూపాన్ని వాడుతుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గంభీరమైన స్తుతి శైలిని వాడాం. మూలంలోని ‘ఆయన నుంచి—ఆయన ద్వారా—ఆయనకు/కోసం’ అనే సమాంతర నిర్మాణాన్ని ‘-ఏ’తో ప్రతిధ్వనింపజేశాం; మతశాఖాపరమైన ప్రత్యేక పదజాలాన్ని నివారించాం.
