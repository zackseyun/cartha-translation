source:
  edition: SBLGNT
  text: Ὑμῖν ⸀δὲ λέγω τοῖς ἔθνεσιν. ἐφ’ ὅσον μὲν ⸀οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/013.yaml
  text: I am speaking to you Gentiles[a]. Inasmuch, then, as I am an apostle to the Gentiles, I magnify my ministry[b],
translation:
  language: te
  text: అయితే అన్యజనులైన మీతో నేను మాట్లాడుతున్నాను.[a] నేను అన్యజనులకు అపొస్తలుడిగా ఉన్నందున, నా పరిచర్యను ఘనపరుస్తున్నాను.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ἔθνη అనే పదాన్ని ఇక్కడ, అలాగే ఈ వచనంలోని రెండవ సందర్భంలోనూ, “జనాలు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నా పరిచర్యను మహిమపరుస్తున్నాను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: అయితే అన్యజనులైన మీతో నేను చెబుతున్నాను
  rationale: δὲ సూచించే స్వల్ప విషయమార్పును ‘అయితే’ తెలియజేస్తుంది. Ὑμῖν మరియు τοῖς ἔθνεσινలను సహజమైన తెలుగు సంబోధనగా కలిపి, సందర్భంలోని యూదేతర ప్రజలను ‘అన్యజనులు’గా అనువదించాం.
- source_word: ἐφ’ ὅσον μὲν οὖν
  choice: ఉన్నంతవరకు
  rationale: ఈ పదబంధం పౌలు తన అన్యజన అపొస్తలత్వపు హోదా లేదా పరిధి ఆధారంగా చెప్పే మాటను సూచిస్తుంది; మూలంలోని పరిమాణ/పరిధి భావాన్ని నిలుపుతుంది.
- source_word: ἐθνῶν ἀπόστολος
  choice: అన్యజనులకు అపొస్తలుడు
  rationale: γενitive ఇక్కడ పౌలు అపొస్తల సేవ ఎవరిని లక్ష్యంగా చేసిందో సూచిస్తుంది. ‘అపొస్తలుడు’ పౌలు ప్రత్యేక నియామకాన్ని నిలుపుతుంది.
- source_word: τὴν διακονίαν μου
  choice: నా పరిచర్యను
  rationale: διακονία ఇక్కడ పౌలుకు అప్పగించబడిన అపొస్తల సేవను సూచిస్తుంది; ‘పరిచర్య’ ఆధునిక ప్రామాణిక తెలుగులో సందర్భోచితంగా ఉంది.
- source_word: δοξάζω
  choice: ఘనపరుస్తున్నాను
  rationale: ఇక్కడ తనను తాను మహిమపరచుకోవడం కాక, తన పరిచర్యకు ఘనతనిచ్చి దాని ప్రాముఖ్యాన్ని ఎత్తిచూపడం భావం. ‘ఘనపరుస్తున్నాను’ δοξάζω యొక్క గౌరవం/మహిమ భావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పౌలు తన పరిచర్యను δοξάζω చేయడం
  choice: నా పరిచర్యను ఘనపరుస్తున్నాను
  alternative: నా పరిచర్యను మహిమపరుస్తున్నాను
  rationale: కర్మ ‘నా పరిచర్య’; పౌలు తనను తాను గొప్ప చేసుకుంటున్నాడని వాక్యంలో చేర్చకుండా, తనకు అప్పగించబడిన సేవకు ఘనతనిస్తున్న భావాన్ని అనువాదం నిలుపుతుంది.
- issue: ἔθνη / ἐθνῶν యొక్క సూచన
  choice: అన్యజనులు / అన్యజనులకు
  alternative: జనాలు / జనాలకు
  rationale: రోమా 9–11లో ఇశ్రాయేలుకు భిన్నమైన యూదేతర ప్రజలే ప్రధాన సూచన. అయినప్పటికీ మూలపదానికి ‘జనాలు’ అనే విస్తృత అర్థం ఉండగలదని పాదసూచనలో తెలియజేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన కానీ సాధారణ పాఠకునికి సులభమైన శైలి. ‘అన్యజనులు,’ ‘అపొస్తలుడు,’ ‘పరిచర్య’ అనే పరిచిత బైబిలు పదాలను సందర్భ స్పష్టత కోసం ఉంచాం. ప్రతి పాదసూచన గుర్తు ప్రధాన పాఠ్యంలో ఇచ్చాం.
