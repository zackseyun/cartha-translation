- from: 'ఈ విధంగా ఇశ్రాయేలంతా రక్షించబడుతుంది[a]. ఇలా రాసి ఉంది: “విమోచకుడు సీయోనులో నుండి వస్తాడు; యాకోబులో నుండి భక్తిహీనతలను తొలగిస్తాడు.”[b]'
