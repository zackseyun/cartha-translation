id: ROM.11.26
reference: Romans 11:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται· καθὼς γέγραπται· Ἥξει ἐκ Σιὼν ὁ ⸀ῥυόμενος, ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: te
  text: 'మరియు ఈ విధంగా ఇశ్రాయేలంతా రక్షించబడుతుంది[a]; వ్రాయబడియున్న ప్రకారం: “విమోచకుడు సీయోను నుండి వస్తాడు[b]; ఆయన యాకోబు నుండి భక్తిహీనతలను తొలగిస్తాడు.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అలా ఇశ్రాయేలంతా రక్షించబడుతుంది.” గ్రీకు οὕτωςను “అలా/ఆ విధంగా” అని కూడా అనువదించవచ్చు. ఇక్కడ అది ముందు వివరించిన విధానాన్ని సూచించే అవకాశం ఎక్కువ. “ఇశ్రాయేలంతా” ఎవరిని సూచిస్తుందనే విషయంలో భిన్న వ్యాఖ్యానాలు ఉన్నాయి; అనువాదం వాటిలో దేనినీ నిర్ణయించదు.
    reason: lexical_alternative_and_alternative_reading
  - marker: b
    text: “సీయోను నుండి” అనే మాటను “సీయోను లోనుండి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “తొలగిస్తాడు” అనే చోట మరింత పదశఃగా “తిప్పివేస్తాడు” అని చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ఈ విధంగా
  rationale: ముందు వివరించిన ప్రక్రియ లేదా పద్ధతిని సూచించే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; కేవలం ఫలితాన్ని సూచించేలా అనవసరంగా పరిమితం చేయదు.
- source_word: πᾶς Ἰσραήλ
  choice: ఇశ్రాయేలంతా
  rationale: గ్రీకు పదబంధంలోని సంపూర్ణతను సహజంగా వ్యక్తం చేస్తూ, అది జాతిపరమైన ఇశ్రాయేలా, విశ్వసించే శేషమా, లేక దేవుని సంపూర్ణ ప్రజలా అనే వివాదాన్ని అనువాదంలో తీర్చదు.
- source_word: σωθήσεται
  choice: రక్షించబడుతుంది
  rationale: భవిష్యత్ కర్మణి రూపాన్నీ, పౌలు వాడుకలోని రక్షణశాస్త్ర సంబంధమైన బరువునీ నిలుపుతుంది.
- source_word: καθὼς γέγραπται
  choice: ఇలా రాసి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే సహజమైన, గౌరవప్రదమైన తెలుగు సూత్రవాక్యం.
- source_word: Ἥξει
  choice: వస్తాడు
  rationale: ప్రవచన ఉల్లేఖనానికి సహజమైన భవిష్యత్ క్రియ.
- source_word: ἐκ Σιὼν
  choice: సీయోనులో నుండి
  rationale: ἐκ యొక్క మూలం లేదా బయలుదేరే స్థాన భావాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ὁ ῥυόμενος
  choice: విమోచకుడు
  rationale: వ్యక్తిని సూచించే substantival participle‌కు గంభీరమైన బిరుదు రూపం; విడిపించేవాడు అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: ἀποστρέψει
  choice: తొలగిస్తాడు
  rationale: యాకోబు నుండి భక్తిహీనతలను దూరం చేయడం అనే causative భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἀσεβείας
  choice: భక్తిహీనతలను
  rationale: బహువచన రూపాన్ని నిలుపుతూ, దేవునిపట్ల అవిధేయతతో కూడిన మత-నైతిక భావాన్ని అందిస్తుంది.
- source_word: ἀπὸ Ἰακώβ
  choice: యాకోబులో నుండి
  rationale: లేఖన ఉల్లేఖనంలోని ‘యాకోబు’ పేరును మార్చకుండా ఉంచి, ἀπό సూచించే వేరుచేయడం లేదా తొలగించడం భావాన్ని తెలుపుతుంది.
theological_decisions:
- issue: ‘ఇశ్రాయేలంతా’ అనే పదబంధం ఎవరిని సూచిస్తుంది?
  choice: వ్యాఖ్యాన విస్తరణ లేకుండా ‘ఇశ్రాయేలంతా’ అని ఉంచబడింది.
  alternative: మొత్తం జాతిపరమైన ఇశ్రాయేలు; ఇశ్రాయేలులోని ఎన్నికైన శేషం; అన్యజనులతో సహా దేవుని సంపూర్ణ ప్రజలు.
  rationale: గ్రీకు పదబంధం ఈ వ్యాఖ్యాన అవకాశాల మధ్య స్వయంగా తీర్పు ఇవ్వదు; అందువల్ల దాని నిజమైన ధార్మిక ఉద్వేగాన్ని అనువాదం నిలుపుతుంది.
- issue: ‘విమోచకుడు’ యొక్క మెస్సీయ సంబంధిత గుర్తింపు
  choice: బిరుదుల పెద్ద అక్షర భేదం తెలుగులో లేకపోవడంతో, గంభీరమైన ఏకవచన బిరుదుగా ‘విమోచకుడు’ వాడబడింది.
  alternative: విడిపించేవాడు; రక్షించేవాడు.
  rationale: పౌలు సందర్భంలో ఉల్లేఖనం మెస్సీయ సంబంధంగా పనిచేస్తుంది; అయితే మూలంలో లేని పేరును లేదా మరింత స్పష్టమైన క్రీస్తు గుర్తింపును చేర్చలేదు.
- issue: ἀποστρέψει యొక్క భావం
  choice: ‘భక్తిహీనతలను తొలగిస్తాడు’ అని అనువదించబడింది.
  alternative: భక్తిహీనతలను తిప్పివేస్తాడు; యాకోబును భక్తిహీనత నుండి మళ్లిస్తాడు.
  rationale: గ్రీకు వాక్య నిర్మాణంలో ‘భక్తిహీనతలు’ ప్రత్యక్ష కర్మగా ఉన్నాయి. అనువాదం వాటిని యాకోబు నుండి దూరం చేసే భావాన్ని నిలుపుతూ, యాకోబే తిరుగుతాడని పాఠ్యంలో లేని నిర్మాణాన్ని ప్రవేశపెట్టదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన లేఖన శైలి, అయితే సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్య నిర్మాణం. ‘ఇశ్రాయేలంతా’ అనే సంక్షిప్త రూపం సహజత్వాన్ని, మూలంలోని వ్యాఖ్యాన విస్తృతిని రెండింటినీ నిలుపుతుంది. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
