id: ROM.11.12
reference: Romans 11:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: te
  text: ఒకవేళ వారి అపరాధం లోకానికి సమృద్ధియూ, వారి నష్టం[a] యూదేతరులకు సమృద్ధియూ అయితే, వారి సంపూర్ణత[b] ఇంకెంత ఎక్కువ సమృద్ధిని కలిగిస్తుంది!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నష్టం’ అనే మాటకు ‘ఓటమి’ లేదా ‘తగ్గుదల’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘సంపూర్ణత’ అనే మాటకు ‘వారి పూర్తి సంఖ్య’ లేదా ‘వారందరూ పూర్తిగా చేర్చబడడం’ అని కూడా అర్థం కావచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: παράπτωμα
  choice: అపరాధం
  rationale: ఈ పదంలో తప్పటడుగు లేదా వైఫల్యంతో పాటు నైతిక అతిక్రమణ భావం ఉంది. ‘అపరాధం’ ఆ నైతిక భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: πλοῦτος
  choice: ఐశ్వర్యం
  rationale: ఇక్కడ ఇది ధనాన్ని అక్షరార్థంగా కాక దేవుని ఆశీర్వాదాల సమృద్ధిని రూపకంగా సూచిస్తుంది. ‘ఐశ్వర్యం’ ఆ రూపకాన్ని నిలుపుతుంది.
- source_word: κόσμου
  choice: లోకానికి
  rationale: ఇశ్రాయేలుకు వెలుపల విస్తృతంగా ప్రయోజనం పొందిన లోకాన్ని సూచించే సాధారణమైన, విస్తృతమైన పదప్రయోగం.
- source_word: ἥττημα
  choice: నష్టం
  rationale: అరుదైన ఈ గ్రీకు పదం నష్టం, ఓటమి లేదా తగ్గుదల అనే భావాలను ఇవ్వగలదు. ‘నష్టం’ ఏ ఒక్క భావాన్నీ అతిగా నిర్దిష్టం చేయకుండా సందర్భానికి సరిపోతుంది; ఇతర భావాలు పాదసూచికలో ఉన్నాయి.
- source_word: ἐθνῶν
  choice: యూదేతరులకు
  rationale: రోమీయులకు రాసిన పత్రికలో ఇది ఇశ్రాయేలు లేదా యూదులకు భిన్నమైన జనులను సూచిస్తుంది. ఆధునిక తెలుగు పాఠకులకు ‘యూదేతరులు’ ఆ వ్యత్యాసాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: πόσῳ μᾶλλον
  choice: ఇంకెంత ఎక్కువ
  rationale: తక్కువ స్థితి నుంచి మరింత గొప్ప ఫలితాన్ని వాదించే గ్రీకు తులనాత్మక నుడికారానికి సహజమైన తెలుగు సమానార్థకం.
- source_word: πλήρωμα
  choice: సంపూర్ణత
  rationale: ఈ పదం సంపూర్ణత, పూర్తి సంఖ్య, పూర్తి స్థాయి లేదా పూర్తిగా చేర్చబడడం వంటి భావాలను కలిగి ఉండగలదు. ‘సంపూర్ణత’ మూలంలోని ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
theological_decisions:
- issue: τὸ πλήρωμα αὐτῶν (‘వారి సంపూర్ణత’) యొక్క నిర్దిష్ట భావం
  choice: ఇశ్రాయేలు వారి ‘సంపూర్ణత’ అని విస్తృతంగానే అనువదించడం
  alternative: వారి పూర్తి సంఖ్య; వారందరూ పూర్తిగా చేర్చబడడం; వారి పునరుద్ధరణ లేదా పరిపూర్ణ స్థితి
  rationale: పౌలు వాడిన పదబంధం సంక్షిప్తంగా ఉండి సంఖ్యాపరమైన, సమగ్ర చేర్పుకు సంబంధించిన, పునరుద్ధరణకు సంబంధించిన భావాలకు అవకాశం ఇస్తుంది. ప్రధాన వాక్యంలో వాటిలో ఒక్కదానిని నిర్ణయించడం మూలపాఠంలోని ధార్మిక ఉద్వేగాన్ని తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని షరతుతో కూడిన సమాంతర నిర్మాణాన్ని నిలిపి, గ్రీకులో చివరి భాగంలో సూచితంగా ఉన్న ‘ఐశ్వర్యం’ భావాన్ని తెలుగులో సహజత కోసం స్పష్టంగా పునరుక్తి చేశాం. పాదసూచిక గుర్తులు అవి వివరిస్తున్న ‘నష్టం’, ‘సంపూర్ణత’ పదాల వెంట ఉంచబడ్డాయి.
