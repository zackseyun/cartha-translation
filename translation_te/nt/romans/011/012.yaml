  to: ఒకవేళ వారి అపరాధం లోకానికి సమృద్ధియూ, వారి నష్టం[a] యూదేతరులకు సమృద్ధియూ అయితే, వారి సంపూర్ణత[b] ఇంకెంత ఎక్కువ సమృద్ధిని కలిగిస్తుంది!
