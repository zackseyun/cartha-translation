id: ROM.11.33
reference: Romans 11:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: te
  text: ఆహా, దేవుని సంపద, జ్ఞానం, పరిజ్ఞానం ఎంత లోతైనవో![a] ఆయన తీర్పులు ఎంత పరిశోధించలేనివో! ఆయన మార్గాలు ఎంత జాడ పట్టలేనివో![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని జ్ఞానం, పరిజ్ఞానం అనే సంపద ఎంత లోతైనదో!” గ్రీకు వాక్యనిర్మాణం ‘సంపద’ను తరువాతి రెండు పదాలతో మరింత సన్నిహితంగా కలిపి చదవడానికి వీలు కల్పిస్తుంది. ప్రధాన పాఠం మాత్రం సంపద, జ్ఞానం, పరిజ్ఞానం అనే మూడింటినీ దేవునికి చెందినవిగా తీసుకుంటుంది.
    reason: alternative_reading
  - marker: b
    text: “జాడ పట్టలేనివి” అనే మాట, అడుగుజాడలను అనుసరించి చివరివరకు కనుగొనలేనివి అనే భావాన్ని ఇస్తుంది. ఇది “పరిశోధించలేనివి” అనే ముందటి పదంతో ఉన్న సూక్ష్మ భేదాన్ని నిలుపుతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: ఆహా!
  rationale: దైవ కార్యాల పట్ల ఆశ్చర్యానందాన్ని వ్యక్తం చేసే ఉద్గారాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: βάθος
  choice: ఎంత అగాధమైనవి
  rationale: అక్షరార్థమైన ‘లోతు’ భావాన్ని రూపకాలంకార సహితంగా, సహజమైన తెలుగు ఉద్గార వాక్యంగా వ్యక్తం చేస్తుంది.
- source_word: πλούτου
  choice: సంపద
  rationale: దేవునికి చెందిన సమృద్ధి అనే విస్తృత పౌలు భావాన్ని నిలుపుతుంది; కేవలం ధనసంపత్తి అనే అర్థానికి పరిమితం చేయదు.
- source_word: σοφίας
  choice: జ్ఞానం
  rationale: తెలుగులో వివేకంతో కూడిన దైవజ్ఞతను సహజంగా సూచిస్తుంది; తరువాతి γνώσεως నుండి వేరుగా ఉంచబడింది.
- source_word: γνώσεως
  choice: పరిజ్ఞానం
  rationale: తెలిసియుండటం, సంపూర్ణ అవగాహన అనే భావాన్ని తెలియజేస్తూ σοφίαకు ఉపయోగించిన ‘జ్ఞానం’తో పదభేదాన్ని కాపాడుతుంది.
- source_word: θεοῦ
  choice: దేవుని
  rationale: ముఖ్య పఠనంలో సంపద, జ్ఞానం, పరిజ్ఞానం అనే మూడింటికీ దేవునితో సంబంధాన్ని సహజమైన తెలుగు షష్ఠీ రూపంలో తెలియజేస్తుంది.
- source_word: ὡς
  choice: ఎంత
  rationale: గ్రీకు ఉద్గార బలాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἀνεξεραύνητα
  choice: పరిశోధించలేనివి
  rationale: పూర్తిగా వెదికి తెలుసుకోలేనివి అనే భావాన్ని స్పష్టంగా ఇస్తుంది.
- source_word: κρίματα
  choice: తీర్పులు
  rationale: దేవుని నిర్ణయాలు, న్యాయనిర్ణయాలు అనే పదం యొక్క విస్తృతిని కాపాడుతుంది.
- source_word: ἀνεξιχνίαστοι
  choice: జాడ పట్టలేనివి
  rationale: అడుగుజాడలను అనుసరించి అంతం వరకు కనుగొనలేమనే రూపకాన్ని నిలుపుతూ ἀνεξεραύνηταకు భిన్నమైన పదప్రయోగాన్ని ఇస్తుంది.
- source_word: ὁδοὶ
  choice: మార్గాలు
  rationale: దేవుని కార్యవిధానాలు లేదా ఆయన నడిపించే కార్యప్రవాహాలను సూచించే మూలపాఠంలోని రూపకాన్ని నిలుపుతుంది.
- source_word: αὐτοῦ
  choice: ఆయన
  rationale: గౌరవప్రదమైన ఆధునిక తెలుగు సర్వనామంతో దేవునిని సూచిస్తుంది; గ్రీకులోని పునరుక్తిని రెండు వాక్యాల్లోనూ నిలుపుతుంది.
theological_decisions:
- issue: θεοῦ అనే షష్ఠీ పదానికి ‘సంపద, జ్ఞానం, పరిజ్ఞానం’తో ఉన్న సంబంధం
  choice: ‘దేవుని’ అనేది సంపద, జ్ఞానం, పరిజ్ఞానం అనే మూడింటినీ విశేషిస్తుందని ప్రధాన పాఠంలో చూపించడం.
  alternative: ‘దేవుని జ్ఞానం, పరిజ్ఞానం అనే సంపద ఎంత అగాధమైనది!’ అని ‘సంపద’ను తరువాతి రెండు పదాలతో మరింత సన్నిహితంగా కలపడం.
  rationale: గ్రీకు పదక్రమం రెండు నిర్మాణాలకు అవకాశం ఇస్తుంది. సందర్భంలో మూడు దైవ లక్షణాల సముచ్చయంగా చదవడం సహజమైనది; అయినా ప్రత్యామ్నాయ వ్యాకరణ సంబంధాన్ని పాదసూచికలో భద్రపరచాం.
- issue: ἀνεξεραύνητα మరియు ἀνεξιχνίαστοι మధ్య పదభేదం
  choice: మొదటిదానికి ‘పరిశోధించలేనివి,’ రెండవదానికి ‘జాడ పట్టలేనివి’ అని వేర్వేరుగా అనువదించడం.
  alternative: రెండింటినీ ‘తెలుసుకోలేనివి’ లేదా సమీపార్థకమైన ఒకే పదంతో అనువదించడం.
  rationale: మూలపాఠం వెదికి తెలుసుకోవడం, జాడను అనుసరించడం అనే సంబంధితమైనా భిన్నమైన రెండు చిత్రాలను ఉపయోగిస్తుంది. అనువాదం ఆ అలంకార వైవిధ్యాన్ని అతిశయోక్తి లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ స్తోత్రోద్గారానికి తగిన గౌరవప్రదమైన శైలిని ఉపయోగించాం. వరుసగా వచ్చిన రెండు ‘ఎంత’ ఉద్గారాలను విడి వాక్యాలుగా ఉంచి గ్రీకు వాక్యంలోని లయను, ఆశ్చర్యభావాన్ని స్పష్టంగా చేశాం.
