revisions:
- from: ఏ విధంగానైనా నా సొంత రక్తసంబంధులను అసూయకు ప్రేరేపించి, వారిలో కొందరిని రక్షించగలనేమో అని.
  to: ఏదో విధంగా నా స్వజనులకు[a] అసూయ కలిగించి, వారిలో కొందరినైనా రక్షించగలనేమో.
  rationale: The revision removes an ungoverned Telugu complement marker, refines the tentative idiom, and uses the natural contextual term స్వజనులు. It adds a concise footnote to preserve the Greek’s literal ‘flesh’ expression and its intended ethnic-kinship reference, without imposing a doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
