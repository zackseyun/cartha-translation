id: ROM.11.14
reference: Romans 11:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἴ πως παραζηλώσω μου τὴν σάρκα καὶ σώσω τινὰς ἐξ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/014.yaml
  text: if somehow I may provoke my own people to jealousy and save some of them[a].
translation:
  language: te
  text: ఏదో విధంగా నా స్వజనులకు[a] అసూయ కలిగించి, వారిలో కొందరినైనా రక్షించగలనేమో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, ‘నా మాంసం’; అంటే నా జాతి బంధువులు.
    reason: μου τὴν σάρκα అనే పదబంధంలోని అక్షరార్థ ‘flesh’ను, సందర్భానుసారమైన బంధుత్వ/జాతిపరమైన సూచనను నిలుపుతూ వివరిస్తుంది.
lexical_decisions:
- source_word: εἴ πως
  choice: ఏ విధంగానైనా … గలనేమో అని
  rationale: ఈ పదబంధం పౌలు ఆశిస్తున్న లక్ష్యాన్ని సూచిస్తుంది; దాని అనిశ్చిత స్వరాన్ని ‘గలనేమో’ సహజంగా నిలుపుతుంది.
- source_word: παραζηλώσω
  choice: అసూయకు ప్రేరేపించి
  rationale: అన్యజనుల చేర్చబడటాన్ని చూసి ఇశ్రాయేలు అసూయపడేలా చేయడం అనే పరిసర సందర్భంలోని భావాన్ని, క్రియ యొక్క బలాన్ని నిలుపుతుంది.
- source_word: μου τὴν σάρκα
  choice: నా సొంత రక్తసంబంధులను
  rationale: అక్షరార్థంగా ‘నా శరీరాన్ని/మాంసాన్ని’ అయినా, ఇక్కడ σάρξ పౌలు యొక్క సహజ, జాతిపరమైన బంధువులను సూచిస్తుంది. ‘రక్తసంబంధులు’ మూలంలోని శరీరాధారిత బంధుత్వ రూపకాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: σώσω
  choice: రక్షించగలనేమో
  rationale: పౌలు వాడుకలోని రక్షణశాస్త్ర సంబంధమైన బరువును ‘రక్షించు’ నిలుపుతుంది; εἴ πως లోని ఆశాభావ అనిశ్చితి ‘గలనేమో’లో వ్యక్తమవుతుంది.
- source_word: τινὰς ἐξ αὐτῶν
  choice: వారిలో కొందరిని
  rationale: ముందు పేర్కొన్న సమూహం నుంచి ఒక భాగాన్ని స్పష్టంగా, సహజమైన తెలుగులో సూచిస్తుంది.
theological_decisions:
- issue: పౌలు తన జాతివారిని సూచించడానికి వాడిన σάρξ అర్థం
  choice: నా సొంత రక్తసంబంధులను
  alternative: నా సొంత శరీరాన్ని; నా సొంత ప్రజలను; నా తోటి యూదులను
  rationale: ఇక్కడ σάρξ ‘పాప స్వభావం’ కాదు; పౌలు యొక్క సహజ/జాతిపరమైన బంధుత్వాన్ని సూచిస్తుంది. తెలుగు ప్రధాన పాఠ్యంలో ‘మాంసం’ అనడం అస్పష్టంగా, అసహజంగా ఉండవచ్చు; ‘రక్తసంబంధులు’ మూల రూపకంలోని బంధుత్వ భావాన్ని అనవసరంగా సిద్ధాంతీకరించకుండా అందిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలో ఇది ముందున్న మాటపై ఆధారపడే ఉద్దేశ్య ఉపవాక్యం కావడంతో చివర ‘అని’ ఉంచబడింది.
