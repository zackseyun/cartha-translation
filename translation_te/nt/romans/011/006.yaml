id: ROM.11.6
reference: Romans 11:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται ⸀χάρις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: te
  text: అది కృపవల్ల అయితే, ఇక క్రియలవల్ల కాదు; లేకపోతే కృప ఇక కృపగా ఉండదు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι
  choice: కృపవల్ల
  rationale: దైవానుగ్రహాన్ని సూచించే χάρις భావాన్ని, కారణం లేదా ఆధారాన్ని తెలిపే దత్తివిభక్తి ప్రయోగంతో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξ ἔργων
  choice: క్రియలవల్ల
  rationale: ἔργα అనే బహువచనాన్ని సంక్షిప్తంగా నిలుపుతూ, ‘కార్యాల ఆధారంగా’ అనే మూలభావాన్ని తెలియజేస్తుంది.
- source_word: γίνεται χάρις
  choice: కృపగా ఉండదు
  rationale: γίνομαι ఇక్కడ ఏదిగా ఉండటం/నిలవటం అనే భావంలో ఉంది; అక్షరార్థమైన ‘అవదు’ కంటే ఆధునిక తెలుగులో సహజంగా, తార్కిక విరోధాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: కృప మరియు క్రియల మధ్య పౌలు చూపిన విరోధం
  choice: ‘కృపవల్ల అయితే, ఇక క్రియలవల్ల కాదు’ అని పరస్పర విరోధాన్ని యథాతథంగా ఉంచడం
  alternative: ‘రక్షణ కృపవల్ల అయితే, మంచి పనులవల్ల కాదు’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: మూలవచనంలో ‘రక్షణ’ లేదా ‘మంచి’ అనే పదాలు లేవు; సందర్భానికి మించిన సిద్ధాంత వివరణను చేర్చకుండా పాఠ్య సంక్షిప్తతను కాపాడుతుంది.
- issue: γίνεται యొక్క భావం
  choice: ‘కృపగా ఉండదు’
  alternative: ‘కృపగా అవదు’ లేదా ‘కృప ఇక కృపగా మారదు’
  rationale: ‘becomes’ అనే రూపాన్ని యాంత్రికంగా అనుసరించకుండా, మూలంలోని తార్కిక భావాన్ని సహజమైన తెలుగులో ఇస్తుంది; కృప స్వరూపాన్ని క్రియల ఆధారం రద్దు చేస్తుందనే ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గంభీరమైన వాక్యనిర్మాణం. ‘కృప’, ‘క్రియలు’ అనే స్థిరమైన బైబిలు పదజాలాన్ని ఉంచి, సాధారణ పాఠకుడికి అర్థమయ్యే విభక్తి నిర్మాణం వాడబడింది.
