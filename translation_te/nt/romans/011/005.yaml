  text: οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ λεῖμμα κατ’ ἐκλογὴν χάριτος γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: te
  text: కాబట్టి, ప్రస్తుత కాలంలో కూడా, కృప ఆధారమైన ఎంపిక ప్రకారం ఒక శేషం ఏర్పడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కృపగల ఎంపిక ప్రకారం” లేదా “కృపచేత జరిగిన ఎంపిక ప్రకారం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: అలాగే ... కూడా
  rationale: ముందున్న ఏలీయా ఉదాహరణనుంచి తీసుకున్న నిర్ధారణను, అప్పటి పరిస్థితికి ఇప్పటి పరిస్థితితో ఉన్న సమాంతరాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν τῷ νῦν καιρῷ
  choice: ప్రస్తుత కాలంలో
  rationale: καιρός సూచించే ప్రస్తుత కాలదశను స్పష్టంగా ఉంచుతుంది.
- source_word: λεῖμμα
  choice: శేషం
  rationale: దేవునిచేత కాపాడబడిన మిగిలిన కొద్దిమందిని సూచించే బైబిలు సంబంధ పదంగా సందర్భానికి సరిపోతుంది.
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: కృపనుబట్టి ఏర్పడిన ఎంపిక ప్రకారం
  rationale: ἐκλογήను ‘ఎంపిక’గా, χάριςను ‘కృప’గా నిలుపుతూ, ఎంపికకు కృపతో ఉన్న సంబంధాన్ని పూర్తిగా ఒకే విధంగా నిర్వచించకుండా ఉంచుతుంది.
- source_word: γέγονεν
  choice: ఉనికిలోకి వచ్చింది
  rationale: ముందు సంభవించిన దాని ఫలితంగా ఇప్పుడు కొనసాగుతున్న స్థితిని సూచించే పరిపూర్ణకాల క్రియాబలాన్ని సాధ్యమైనంతగా నిలుపుతుంది.
theological_decisions:
- issue: పౌలు వాడిన ἐκλογή పదాన్ని సిద్ధాంతపరంగా వివాదాస్పదమైన సందర్భంలో అనువదించడం
  choice: ఎంపిక
  alternative: ఎన్నిక; ఎన్నుకోబడిన స్థితి
  rationale: ‘ఎంపిక’ మూలపదార్థాన్ని స్పష్టంగా తెలియజేస్తూ, ఏ ప్రత్యేక మతశాఖ సిద్ధాంతవ్యవస్థనూ వాక్యంలోకి చేర్చదు.
- issue: κατ’ ἐκλογὴν χάριτοςలో కృపకు ఎంపికతో ఉన్న సంబంధం
  choice: కృపనుబట్టి ఏర్పడిన ఎంపిక ప్రకారం
  alternative: కృపగల ఎంపిక ప్రకారం; కృపచేత జరిగిన ఎంపిక ప్రకారం
  rationale: కృప ఆధారం, మూలం లేదా లక్షణం అనే భావసాధ్యతలను అతిగా కుదించకుండా గ్రీకు షష్ఠీవిభక్తి సంబంధంలోని భావసాంద్రతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యే రీతిలో ఉంది. ‘శేషం,’ ‘కృప,’ ‘ఎంపిక’ వంటి సందర్భపరంగా ముఖ్యమైన పదాలను నిలుపుతూ, గ్రీకు వాక్యంలోని సిద్ధాంతపరమైన అస్పష్టతను అతిగా పరిష్కరించలేదు.
