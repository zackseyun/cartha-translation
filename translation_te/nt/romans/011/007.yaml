id: ROM.11.7
reference: Romans 11:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: te
  text: అయితే ఏమిటి? ఇశ్రాయేలు తాను వెదుకుతున్నదాన్ని పొందలేదు; కానీ ఎన్నుకోబడినవారు[a] దాన్ని పొందారు, మిగిలినవారు కఠినపరచబడ్డారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఎంపిక దాన్ని పొందింది.’ గ్రీకు పదానికి అక్షరార్థం ‘ఎంపిక’ లేదా ‘ఎన్నిక’; ఇక్కడ అది ఎన్నుకోబడిన ప్రజలను సూచిస్తున్నట్లు కనిపిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘మొద్దుబార్చబడ్డారు.’ ఈ క్రియ కఠినపరచబడటం లేదా ఆధ్యాత్మికంగా స్పందించలేని స్థితికి చేర్చబడటం అనే భావాన్ని ఇవ్వగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν
  choice: అయితే ఏమిటి?
  rationale: పౌలు ముందటి వాదన నుంచి ఫలితాన్ని ప్రశ్నారూపంలో పరిచయం చేసే సాధారణ అలంకారిక ప్రయోగం; ఆధునిక తెలుగులో సహజంగా ఉండేలా దాని ప్రశ్నాత్మక బలాన్ని నిలుపుతుంది.
- source_word: ὃ ἐπιζητεῖ
  choice: తాను వెదుకుతున్నదాన్ని
  rationale: వర్తమానకాల క్రియలోని కొనసాగుతున్న అన్వేషణ భావాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; కర్త అయిన ఇశ్రాయేలుతో సంబంధాన్ని ‘తాను’ స్పష్టం చేస్తుంది.
- source_word: Ἰσραήλ
  choice: ఇశ్రాయేలు
  rationale: ఇక్కడ వ్యక్తిగత పితామహుని కంటే సమష్టిగా జాతి ఇశ్రాయేలును సూచించే పేరును సాంప్రదాయ తెలుగు రూపంలో ఉంచింది.
- source_word: τοῦτο οὐκ ἐπέτυχεν
  choice: పొందలేదు
  rationale: వెదుకుతున్న దానిని సాధించడం లేదా పొందడం అనే అర్థాన్ని సహజంగా తెలియజేస్తుంది; తరువాతి ἐπέτυχενతో పదపునరుక్తిని నిలుపుతుంది.
- source_word: ἡ δὲ ἐκλογὴ
  choice: ఎన్నుకోబడినవారు
  rationale: ἐκλογή అక్షరార్థంగా ‘ఎన్నిక/ఎంపిక’ అయినప్పటికీ, ‘మిగిలినవారు’ అనే వ్యక్తుల సమూహంతో ఉన్న వ్యత్యాసం వల్ల ఇక్కడ ఎంపిక చేయబడిన ప్రజలను సూచించే లక్షణార్థక ప్రయోగంగా గ్రహించబడింది.
- source_word: ἐπέτυχεν
  choice: దాన్ని పొందారు
  rationale: ముందటి క్రియతో సమానమైన ‘పొందు’ అనే పదాన్ని పునరావృతం చేసి పౌలు ఉద్దేశించిన వ్యత్యాసాన్ని నిలుపుతుంది; ‘దాన్ని’ ముందటి విషయాన్ని సూచిస్తుంది.
- source_word: οἱ δὲ λοιποὶ
  choice: మిగిలినవారు
  rationale: ఎన్నుకోబడినవారికి భిన్నంగా మిగిలి ఉన్న వ్యక్తులను సంక్షిప్తంగా, సహజంగా సూచిస్తుంది.
- source_word: ἐπωρώθησαν
  choice: కఠినపరచబడ్డారు
  rationale: ఆధ్యాత్మిక స్పందనలేమిని సూచించే గట్టిపడటం/కఠినత్వం అనే రూపకాన్ని నిలుపుతుంది; గ్రీకు కర్మణి రూపంలో పేర్కొనని కర్తను తెలుగులోనూ పేర్కొనదు.
theological_decisions:
- issue: ἡ ἐκλογὴ యొక్క సందర్భానుసార భావం
  choice: ‘ఎన్నుకోబడినవారు’ అని వ్యక్తుల సమూహంగా అనువదించడం
  alternative: ‘ఎంపిక’ లేదా ‘ఎన్నిక’ అనే అమూర్త నామవాచకంగా అనువదించడం
  rationale: ‘మిగిలినవారు’ అనే వ్యక్తుల సమూహంతో వ్యత్యాసం ఇక్కడ దేవుని ఎంపికకు చెందిన ప్రజలు ఉద్దేశించబడ్డారని సూచిస్తుంది. అయినా గ్రీకు పదపు అక్షరార్థ ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- issue: ἐπωρώθησανలో కర్త మరియు కార్యసాధకత్వం
  choice: కర్మణి రూపంలో ‘కఠినపరచబడ్డారు’ అని ఉంచి కర్తను పేర్కొనకపోవడం
  alternative: ‘దేవుడు వారిని కఠినపరిచాడు’ లేదా ‘వారు తమను తాము కఠినపరచుకున్నారు’
  rationale: ఈ వాక్యంలో గ్రీకు కర్మణి క్రియ కార్యసాధకుణ్ణి స్పష్టంగా చెప్పదు. అందుచేత దైవిక చర్య, మానవ బాధ్యత, లేదా రెండింటి సంబంధాన్ని అనువాదం ముందుగానే నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యనిర్మాణం వాడబడింది. ‘ఇశ్రాయేలు’ సమష్టి కర్త అయినప్పటికీ తరువాతి వ్యత్యాసం వ్యక్తుల సమూహాల మధ్య ఉన్నందున ‘ఎన్నుకోబడినవారు/మిగిలినవారు’ అనే బహువచన రూపాలు వాడబడ్డాయి. గ్రీకు పాఠంలోని రెండు కర్మణి/లక్షణార్థ సంబంధిత సందిగ్ధతలు పాదటిప్పణులతో భద్రపరచబడ్డాయి.
