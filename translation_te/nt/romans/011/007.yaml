  naturalness: The Telugu is generally clear and modern. Replacing the second “అయితే” with “కాని” better expresses the Greek contrast (δέ) and avoids an unnecessary repetition immediately after the opening rhetorical formula.
  terminology: “ఎన్నుకోబడినవారు” appropriately renders the group denoted by ἐκλογή without imposing a doctrinal system. “కఠినపరచబడ్డారు” retains the hardening metaphor and passive form without supplying an agent. The footnotes preserve the lexical alternatives adequately.
