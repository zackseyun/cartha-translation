review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the approving response, the causal force of unbelief, the olive-branch image of being broken off, the contrast with faith, and the warning against pride. However, ‘విశ్వాసం ద్వారానే’ adds an exclusive ‘alone/only’ emphasis not expressed by τῇ πίστει.
  naturalness: The Telugu is clear, modern, and suitably dignified. ‘నిలిచి ఉన్నావు,’ ‘గర్వంగా ఆలోచించకు,’ and ‘భయపడుతూ ఉండు’ are natural in this register.
  terminology: ‘అవిశ్వాసం’ and ‘విశ్వాసం’ preserve the Greek contrast well. The explanatory note on fear appropriately clarifies reverent caution without replacing the main-text command.
  issues:
  - severity: medium
    issue: ‘ద్వారానే’ introduces exclusivity.
    rationale: The Greek dative τῇ πίστει expresses means/basis (‘by/through faith’), but does not contain a particle equivalent to ‘only.’ ‘విశ్వాసం ద్వారా’ preserves the intended contrast without adding that restriction.
