id: ROM.11.20
reference: Romans 11:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καλῶς· τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ⸂ὑψηλὰ φρόνει⸃, ἀλλὰ φοβοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: te
  text: అది నిజమే. వారు అవిశ్వాసం కారణంగా విరిచివేయబడ్డారు; నీవైతే విశ్వాసం ద్వారా నిలిచి ఉన్నావు.[a] గర్వంగా ఆలోచించకు; భయపడుతూ ఉండు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమ్మకం ద్వారా నిలిచి ఉన్నావు.”
    reason: alternative_reading
  - marker: b
    text: అంటే, అహంకారపూరితమైన ధీమాతో కాకుండా, దేవుని ఎదుట వినయంతో, భక్తిపూర్వకమైన భయంతో, జాగ్రత్తగా ఉండు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: అది నిజమే
  rationale: ముందటి వాదనను అంగీకరించే సమాధానంగా ఉన్న గ్రీకు పదబలాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τῇ ἀπιστίᾳ
  choice: అవిశ్వాసం కారణంగా
  rationale: సందర్భంలో దత్తివిభక్తికి కారణార్థం ఉంది; తదుపరి ‘విశ్వాసం’తో ఉన్న వ్యత్యాసాన్ని కూడా కాపాడుతుంది.
- source_word: ἐξεκλάσθησαν
  choice: విరిచివేయబడ్డారు
  rationale: చుట్టుపక్కల వచనాల్లోని ఒలీవ చెట్టు, కొమ్మల రూపకాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: τῇ πίστει
  choice: విశ్వాసం ద్వారానే
  rationale: దత్తివిభక్తి సాధనం లేదా ఆధారాన్ని సూచిస్తుంది; ‘అవిశ్వాసం’తో వ్యత్యాసాన్ని ‘విశ్వాసం’ సహజంగా వ్యక్తం చేస్తుంది. ‘ద్వారానే’ వ్యత్యాసంలో ఉన్న ఉద్ఘాటనను తెలుగులో తెలియజేస్తుంది.
- source_word: ἕστηκας
  choice: నిలిచి ఉన్నావు
  rationale: పూర్ణకాల క్రియ సూచించే, గతంలో ఏర్పడి ప్రస్తుతం కొనసాగుతున్న స్థితిని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑψηλὰ φρόνει
  choice: గర్వంగా ఆలోచించకు
  rationale: అక్షరార్థంలోని ‘ఉన్నతమైన వాటిని ఆలోచించడం’ అనే రూపాన్ని కృత్రిమంగా కాకుండా, తన గురించి గొప్పగా భావించే అహంకార భావంలో అందిస్తుంది.
- source_word: φοβοῦ
  choice: భయపడుతూ ఉండు
  rationale: వర్తమాన ఆజ్ఞారూపంలోని కొనసాగుతున్న హెచ్చరికను కాపాడుతూ, ‘భయపడు’ అనే పదునైన పదాన్ని మృదువుచేయదు.
theological_decisions:
- issue: ἀπιστίαకు వ్యతిరేకంగా πίστις యొక్క భావం
  choice: విశ్వాసం
  alternative: నమ్మకం / విశ్వసించడం
  rationale: ఇక్కడ అవిశ్వాసంతో నేరుగా ఉన్న వ్యత్యాసం మానవుని విశ్వాస స్పందనను సూచిస్తుంది. అయినప్పటికీ ‘నమ్మకం’ అనే భావసాధ్యతను పాదసూచికలో ఉంచాం.
- issue: φοβοῦ యొక్క బలం
  choice: భయపడుతూ ఉండు
  alternative: భక్తిపూర్వకమైన భయంతో ఉండు / జాగ్రత్తగా ఉండు
  rationale: దేవుని ఎదుట వినయంతో కూడిన భయం, జాగ్రత్త సందర్భంలో అంతర్భాగాలైనా, మూలంలోని నేరుగా ఉన్న ‘భయపడు’ అనే హెచ్చరికను ప్రధాన పాఠ్యంలో కాపాడటం వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సులభంగా అర్థమయ్యే శైలి. ఏకవచన సంబోధనను ‘నీవు’తో నిలిపాం. చెట్టు-కొమ్మల రూపకాన్ని ‘విరిచివేయబడ్డారు’తో కాపాడాం; చివరి ఆజ్ఞలోని తీవ్రతను తగ్గించకుండా ‘భయపడుతూ ఉండు’ అని అనువదించాం.
