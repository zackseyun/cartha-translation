id: ROM.11.28
reference: Romans 11:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: te
  text: సువార్త విషయానికొస్తే,[a] మీ నిమిత్తం వారు శత్రువులు; అయితే ఎన్నిక విషయానికొస్తే, పితరుల[b] నిమిత్తం వారు ప్రియులు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “సువార్త పరంగా, మీ కారణంగా వారు శత్రువులు; అయితే ఎన్నిక పరంగా, పితరుల కారణంగా వారు ప్రియులు.”'
    reason: κατά మరియు διά పదబంధాల సాధ్యమైన ప్రత్యామ్నాయ వ్యక్తీకరణలను చూపడం.
  - marker: b
    text: “పితరులు” అంటే ఇశ్రాయేలు మూలపితరులు, ముఖ్యంగా అబ్రాహాము, ఇస్సాకు, యాకోబు.
    reason: సందర్భంలోని నిబంధనాత్మక సూచనను వివరించడం.
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: సువార్త విషయానికొస్తే
  rationale: κατά + accusative ఇక్కడ పరిశీలనా పరిధిని సూచిస్తుంది; μέν...δέ వ్యత్యాసాన్ని ఆధునిక, సహజమైన తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ἐχθροὶ
  choice: శత్రువులు
  rationale: ఇది విధేయ విశేషణంగా వాడబడినా నామవాచక బలం కలిగి ఉంది. ‘విరోధులు’ కంటే ‘శత్రువులు’ మూలంలోని తీవ్రతను, తరువాతి ‘ప్రియులు’తో ఉన్న ఉద్రిక్తతను కాపాడుతుంది.
- source_word: δι’ ὑμᾶς
  choice: మీ నిమిత్తం
  rationale: διά + accusative కారణం లేదా ప్రయోజనాన్ని సూచించగలదు. ‘మీ నిమిత్తం’ ఈ రెండు భావాల మధ్య ఉన్న మూలభాషా విస్తృతిని అతిగా నిర్ణయించకుండా ఉంచుతుంది.
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: అయితే ఎన్నిక విషయానికొస్తే
  rationale: మొదటి κατὰ పదబంధంతో సమాంతర నిర్మాణాన్ని నిలుపుతూ, δέ యొక్క వ్యత్యాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐκλογὴν
  choice: ఎన్నిక
  rationale: ἐκλογή దేవుని ఎన్నుకునే కార్యం లేదా ఉద్దేశాన్ని సూచించే స్థిరమైన పౌలీయ పదం. ‘ఎంపిక’ సాధారణ భావానికి జారవచ్చు; ‘దేవుని ఎన్నిక’ అనడం మూలంలో లేని స్పష్టీకరణను ప్రధాన పాఠ్యంలో చేర్చుతుంది.
- source_word: ἀγαπητοὶ
  choice: ప్రియులు
  rationale: ‘ప్రియులు’ ప్రేమింపబడుతున్నవారు అనే విధేయ భావాన్ని, నిబంధనాత్మక గంభీరతను సహజ తెలుగులో నిలుపుతుంది.
- source_word: διὰ τοὺς πατέρας
  choice: పితరుల నిమిత్తం
  rationale: διά + accusative కారణం లేదా నిమిత్తాన్ని సూచిస్తుంది. ‘పితరులు’ అనే పౌలీయ నిబంధనాత్మక సంక్షిప్త పదాన్ని ప్రధాన పాఠ్యంలో వ్యాఖ్యానించకుండా నిలుపుతుంది.
theological_decisions:
- issue: ‘వారు’ అనే సర్వనామం ఎవరిని సూచిస్తుంది?
  choice: రోమా 9–11 వాదనలో ఇశ్రాయేలు ప్రజలను సమష్టిగా సూచించేలా అనువాదం ఉంచబడింది.
  alternative: పౌలు కాలంలోని అవిశ్వాస యూదులకు మాత్రమే పరిమితం చేయడం.
  rationale: తక్షణ సందర్భంలో చాలామంది అవిశ్వాసంలో ఉన్నప్పటికీ, చర్చ సమష్టిగా ఇశ్రాయేలు గురించినది. మూలంలోని సర్వనామాన్ని అనువాదం మరింత సంకుచితం చేయదు.
- issue: ‘శత్రువులు’ అనే పదం భావం
  choice: సువార్తకు సంబంధించిన పరిధిలో వారి శత్రుత్వ స్థితిని సూచిస్తుంది; అదే సమయంలో వారు ‘ప్రియులు’ అనే రెండవ ప్రకటనను యథాతథంగా నిలుపుతుంది.
  alternative: దేవుడు వారిని సంపూర్ణంగా ద్వేషిస్తున్నాడని లేదా వారు కేవలం సామాజిక విరోధులని అర్థం చేయడం.
  rationale: వాక్యమే ‘శత్రువులు’ మరియు ‘ప్రియులు’ అనే రెండు ధ్రువాలను కలిపి ఉంచుతుంది. అనువాదం ఈ వేదాంత ఉద్రిక్తతను పరిష్కరించకుండా కాపాడాలి.
- issue: ‘పితరులు’ ఎవరిని సూచిస్తుంది?
  choice: ప్రధానంగా అబ్రాహాము, ఇస్సాకు, యాకోబు వంటి ఇశ్రాయేలు మూలపితరులను సూచించే నిబంధనాత్మక పదంగా నిలుపబడింది.
  alternative: సాధారణంగా అన్ని పూర్వీకులు అని మాత్రమే అర్థం చేయడం.
  rationale: రోమా 9–11లో ‘పితరులు’ దేవుని వాగ్దానాలు పొందిన మూలపితరులను సహజంగా గుర్తుచేస్తుంది; అయితే ప్రధాన పాఠ్యం మూలంలోని సంక్షిప్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనా గౌరవప్రదమైన శైలి. μέν...δέ సమాంతర వ్యత్యాసం ‘విషయానికొస్తే... అయితే... విషయానికొస్తే’ ద్వారా నిలుపబడింది. ‘శత్రువులు/ప్రియులు’ అనే ఉద్దేశపూర్వక వేదాంత ఉద్రిక్తత సడలించబడలేదు. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో చేర్చబడింది.
