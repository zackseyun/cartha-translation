id: ROM.11.25
reference: Romans 11:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: te
  text: 'సోదరులారా,[a] మీరు మీ సొంత దృష్టిలో మీరే జ్ఞానులని భావించకుండా ఉండేందుకు, ఈ మర్మం మీకు తెలియకుండా ఉండడం నాకు ఇష్టం లేదు: అన్యజనుల సంపూర్ణత ప్రవేశించేవరకు[b] ఇశ్రాయేలుకు కొంతవరకు కఠినత్వం కలిగింది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘సోదర సోదరీమణులారా’; గ్రీకులో ‘సోదరులు’ అని ఉంది, అది స్త్రీపురుషులు కలిసిన సమూహాన్ని ఉద్దేశించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘అన్యజనుల పూర్తి సంఖ్య ప్రవేశించేవరకు.’
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: తెలియకుండా ఉండడం
  rationale: పౌలు వాడే సాంప్రదాయిక వాక్యరూపాన్ని సహజమైన ఆధునిక తెలుగులో తెలియకపోవడం/అవగాహన లేకపోవడం అనే తటస్థ భావంతో వ్యక్తం చేస్తుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: గ్రీకు పురుష బహువచన సంబోధన రూపాన్ని నిలుపుతుంది; మిశ్రమ సమూహాన్ని కూడా ఉద్దేశించగలదనే అంశాన్ని పాదసూచికలో తెలిపాం.
- source_word: μυστήριον
  choice: మర్మం
  rationale: ఇంతకు ముందు దాగి ఉండి ఇప్పుడు వెల్లడైన దేవుని ఉద్దేశం అనే పౌలు భావానికి తగిన గంభీరమైన, సహజ తెలుగు పదం.
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: మీ దృష్టిలో మీరే జ్ఞానులమని అనుకోకుండా ఉండేందుకు
  rationale: స్వీయ అంచనాలో జ్ఞానులమని భావించే అహంభావంపై ఉన్న హెచ్చరికను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πώρωσις
  choice: కఠినత్వం
  rationale: ఆత్మీయ స్పందనలేమి లేదా హృదయ కఠినత అనే భావాన్ని మతపరమైన అదనపు వ్యాఖ్యానం లేకుండా అందిస్తుంది.
- source_word: ἀπὸ μέρους
  choice: కొంతవరకు
  rationale: కఠినత్వం ఇశ్రాయేలు మొత్తాన్ని సంపూర్ణంగా ఆవరించలేదనే పరిమాణ సంబంధ భావాన్ని నిలుపుతుంది; దాని వ్యవధిగా అనవసరంగా అర్థం చేయదు.
- source_word: τῷ Ἰσραήλ ... γέγονεν
  choice: ఇశ్రాయేలుకు ... కలిగింది
  rationale: గ్రీకు దత్తివిభక్తిని, పరిపూర్ణ కాలం సూచించే ప్రస్తుతం కొనసాగుతున్న ఫలితస్థితిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: πλήρωμα
  choice: సంపూర్ణత
  rationale: ‘పూర్తి సంఖ్య’, ‘పూర్తి చేరిక’, లేదా ‘పరిపూర్ణ స్థితి’లో ఏదో ఒకదానిని నిర్ణయించకుండా మూలపదంలోని ఉద్దేశపూర్వక విస్తృతిని కాపాడుతుంది.
- source_word: τῶν ἐθνῶν
  choice: అన్యజనుల
  rationale: ఇక్కడ ఇశ్రాయేలుతో వ్యత్యాసంగా యూదేతరులను సూచించే పౌలు ప్రయోగాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: εἰσέλθῃ
  choice: లోపలికి ప్రవేశించేవరకు
  rationale: ἄχρι οὗతో వచ్చే పరిమితి బిందువును చూపిస్తూ, దేనిలోకి ప్రవేశిస్తారో మూలంలో చెప్పని అస్పష్టతను అలాగే ఉంచుతుంది.
theological_decisions:
- issue: ‘అన్యజనుల సంపూర్ణత’ యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘అన్యజనుల సంపూర్ణత’ అని ఉంచాం.
  alternative: ‘అన్యజనుల పూర్తి సంఖ్య’ లేదా ‘అన్యజనుల సంపూర్ణ చేరిక’.
  rationale: πλήρωμα సంఖ్యనో, పూర్తి చేరికనో, అంత్యకాల పరిపూర్తినో సూచించవచ్చు. వివాదాస్పదమైన ఈ భావాన్ని ప్రధాన పాఠ్యం పరిష్కరించకుండా ఉంచి, సాధ్యమైన అర్థాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ‘సోదరులు’ అనే సంబోధన పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘సోదరులారా’ అని మూలంలోని పురుష బహువచన రూపాన్ని నిలిపాం.
  alternative: ‘సోదర సోదరీమణులారా’.
  rationale: ἀδελφοί వ్యాకరణపరంగా పురుష బహువచనమైనా, మిశ్రమ విశ్వాసుల సమూహాన్ని ఉద్దేశించగలదు. రూపాన్ని ప్రధాన పాఠ్యంలో, సమగ్ర పరిధిని పాదసూచికలో కాపాడాం.
- issue: ఇశ్రాయేలు కఠినత్వం యొక్క పరిధి
  choice: ‘కొంతవరకు’ అని అనువదించాం.
  alternative: ‘ఇశ్రాయేలులో కొంత భాగానికి’ అని మరింత నిర్దిష్టంగా అనువదించడం.
  rationale: ἀπὸ μέρους కఠినత్వం పాక్షికమని చెబుతుంది; అది ప్రజలలో ఒక భాగాన్నా, కఠినత్వపు స్థాయినేనా సూచిస్తుందో ప్రధాన పాఠ్యంలో అతిగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మర్మం’, ‘సంపూర్ణత’, ‘కఠినత్వం’ వంటి పదాలు పౌలు వాదనలోని ధార్మిక బరువును నిలుపుతాయి; వివాదాస్పద అంశాలను వివరణాత్మకంగా పరిష్కరించకుండా మూలంలోని అస్పష్టతను కాపాడాయి.
