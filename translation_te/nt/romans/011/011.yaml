review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the rhetorical negative question, the distinct imagery of stumbling and falling, the emphatic repudiation, the instrumental force of τῷ ... παραπτώματι, salvation for the Gentiles, and the purpose expressed by εἰς τὸ + infinitive. A small adjustment removes the added emphatic force of ‘-కే’ (‘precisely/only for’) in ‘పడిపోవడానికే,’ which is not explicit in the Greek.
  naturalness: The revised wording is natural modern standard Telugu. ‘రక్షణ ... వచ్చింది’ is more idiomatic than ‘రక్షణ కలిగింది’ for salvation coming to a group, and ‘వారికి అసూయ కలిగించడానికి’ expresses the object of παραζηλῶσαι more directly than ‘వారిలో అసూయ పుట్టించడానికి.’
  terminology: ‘అపరాధం’ is retained as an appropriate rendering of παράπτωμα, with ‘అతిక్రమం’ supplied as an alternative. ‘యూదేతరులు’ clearly conveys the contextual meaning of τοῖς ἔθνεσιν without obscuring the literal ‘nations’ in the note. ‘రక్షణ’ appropriately retains σωτηρία’s theological sense.
  issues:
  - severity: low
    issue: The main text has ‘పడిపోవడానికే.’
    rationale: The enclitic ‘-కే’ can add an exclusive or heightened force (‘precisely/only in order to fall’) not stated by ἵνα πέσωσιν. ‘పడిపోవడానికి’ preserves the purpose/result relation without this addition.
  - severity: low
    issue: ‘రక్షణ కలిగింది’ is less direct and idiomatic here.
    rationale: The Greek states that salvation came ‘to the Gentiles.’ Telugu ‘యూదేతరులకు రక్షణ వచ్చింది’ follows that construction more naturally and closely.
