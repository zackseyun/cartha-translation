id: ROM.11.11
reference: Romans 11:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: te
  text: 'కాబట్టి నేను అడుగుతున్నాను: వారు పడిపోవడానికి తొట్రుపడ్డారా?[a] ఎంతమాత్రమూ కాదు! బదులుగా, వారి అపరాధం ద్వారా యూదేతరులకు రక్షణ వచ్చింది[b][c]—వారికి అసూయ కలిగించడానికి.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: గ్రీకులో ‘తొట్రుపడడం,’ ‘పడిపోవడం’ వేర్వేరు పదాలు. ఈ ప్రశ్నకు ‘కాదు’ అనే సమాధానం ఆశించబడుతుంది. ‘వారు పడిపోవడానికి తొట్రుపడ్డారా?’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వారి అతిక్రమం ద్వారా.’
    reason: lexical_alternative
  - marker: c
    text: గ్రీకు పదానికి అక్షరార్థం ‘జనాలు’; ఈ సందర్భంలో అది యూదులు కాని ప్రజలను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: d
    text: లేదా, ‘వారిని అసూయకు పురికొల్పడానికి’; అదే రక్షణను కోరేలా వారిని ప్రేరేపించడం కూడా ఈ భావంలో ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: కాబట్టి నేను అడుగుతున్నాను
  rationale: λέγω వాక్యార్థంగా ‘చెబుతున్నాను’ అయినా, ఇక్కడ పౌలు అలంకారప్రశ్నను ప్రవేశపెడుతున్నాడు; ‘అడుగుతున్నాను’ ఆధునిక తెలుగులో సహజంగా ఉండి οὖν యొక్క అనుమానార్థక అనుసంధానాన్ని ‘కాబట్టి’తో నిలుపుతుంది.
- source_word: μὴ ἔπταισαν
  choice: వారు ... తొట్రుపడ్డారా?
  rationale: μήతో వచ్చిన ఈ ప్రశ్నకు ‘కాదు’ అనే సమాధానం ఆశించబడుతుంది. వెంటనే వచ్చే ‘ఎంతమాత్రమూ కాదు!’ ఆ భావాన్ని స్పష్టం చేస్తుంది; πταίωను ‘తొట్రుపడు’గా అనువదించి πίπτωతో ఉన్న భేదాన్ని కాపాడాం.
- source_word: ἵνα πέσωσιν
  choice: పడిపోవడానికే
  rationale: ἵνα + subjunctive ఉద్దేశం లేదా ఫలితాన్ని సూచించగలదు. ‘పడిపోవడానికే’ ఆ ఉద్దేశ/ఫలిత భావాన్ని సహజంగా తెలియజేస్తూ, ‘పూర్తిగా’ లేదా ‘తిరిగి లేవలేనంతగా’ వంటి వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: μὴ γένοιτο
  choice: ఎంతమాత్రమూ కాదు!
  rationale: పౌలు వాడే బలమైన నిరాకరణను ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా వ్యక్తపరుస్తుంది.
- source_word: τῷ αὐτῶν παραπτώματι
  choice: వారి అపరాధం ద్వారా
  rationale: παράπτωμα నైతిక తప్పిదం లేదా అతిక్రమాన్ని సూచిస్తుంది. ‘అపరాధం’ స్పష్టమైన సాధారణ పదం; దత్తివును సాధనార్థకంగా ‘ద్వారా’ అని ఇచ్చాం.
- source_word: ἡ σωτηρία
  choice: రక్షణ
  rationale: రోమీయులకు పత్రికలో σωτηρίαకు ఉన్న రక్షణశాస్త్ర సంబంధమైన బరువును నిలుపుతున్న ప్రామాణిక తెలుగు పదం.
- source_word: τοῖς ἔθνεσιν
  choice: యూదేతరులకు
  rationale: రోమా 9–11లో ἔθνη యూదులకు భిన్నమైన ప్రజలను సూచిస్తుంది. ‘యూదేతరులు’ సాధారణ పాఠకునికి ‘అన్యజనులు’ కంటే నేరుగా అర్థమవుతుంది; మూలంలోని అక్షరార్థమైన ‘జనాలు’ను పాదటిప్పణిలో ఉంచాం.
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: వారిలో అసూయ పుట్టించడానికి
  rationale: εἰς τό + infinitive ఉద్దేశం/ఫలితాన్ని సూచిస్తుంది. παραζηλόωలో అసూయ రేపడం మరియు అదే ఆశీర్వాదాన్ని కోరేలా ప్రేరేపించడం రెండింటి ఛాయలు ఉండవచ్చు; ప్రధాన పాఠం మొదటి భావాన్ని నిలుపుతూ రెండవదాన్ని పాదటిప్పణిలో ఉంచుతుంది.
theological_decisions:
- issue: ఇశ్రాయేలు తొట్రుపాటు అంతిమమైన, తిరుగులేని పతనమా?
  choice: వారు పడిపోవడానికే తొట్రుపడ్డారనే భావాన్ని వాక్యం తిరస్కరిస్తుంది.
  alternative: ఇది తక్షణ పతనాన్ని మాత్రమే తిరస్కరిస్తుందని లేదా సంపూర్ణమైనా తాత్కాలిక పతనాన్ని సూచిస్తుందని కొందరు అర్థం చేసుకోవచ్చు.
  rationale: πταίω (‘తొట్రుపడు’) మరియు πίπτω (‘పడిపోవు’) అనే వేర్వేరు క్రియలను వేర్వేరుగానే ఉంచాం. ‘శాశ్వతంగా’ లేదా ‘తిరిగి లేవలేనంతగా’ అని చేర్చి మూలంలోని ఉద్రిక్తతను పరిష్కరించలేదు.
- issue: రక్షణ చరిత్రలో అసూయ భాష యొక్క భావం
  choice: యూదేతరులు రక్షణ పొందడం వారిలో అసూయ పుట్టించే ఉద్దేశం/ఫలితంతో చెప్పబడింది.
  alternative: ఇది కేవలం ప్రతికూలమైన ఈర్ష్య కావచ్చు; లేదా అదే రక్షణను కోరే అనుకరణాత్మక ఆకాంక్షను రేపడం కావచ్చు.
  rationale: παραζηλόω రెండు ఛాయలనూ అనుమతిస్తుంది. ప్రధాన పాఠం సాధారణ ‘అసూయ’ భాషను ఉంచి, సానుకూల ప్రేరణ సంభావ్యతను పాదటిప్పణిలో వెల్లడిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి వాడబడింది. ‘తొట్రుపడు/పడిపోవు’ పదజంటతో మూలంలోని రూపక భేదం నిలుపబడింది. ‘యూదేతరులు’ సాధారణ పాఠకులకు స్పష్టతనిస్తుంది; సంప్రదాయ ‘అన్యజనులు’ కంటే ప్రస్తుత వాడుకకు అనుకూలం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠంలో ఉన్నాయి.
