id: ROM.11.22
reference: Romans 11:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: te
  text: 'కాబట్టి దేవుని దయను[a], కఠినతను గమనించు: పడిపోయినవారి పట్ల కఠినత; నీ పట్ల మాత్రం దేవుని దయ—నీవు ఆ దయలో కొనసాగితే. లేకపోతే నీవు కూడా నరికివేయబడతావు.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘మంచితనం.’ గ్రీకు χρηστότης అనే పదం దయ, మంచితనం లేదా మేలు చేసే స్వభావాన్ని సూచించగలదు. ఇక్కడ ‘కఠినత’తో ఉన్న సంబంధాత్మక వ్యత్యాసాన్ని నిలుపడానికి ‘దయ’ అని అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘కొమ్మలా విరిచివేయబడతావు.’ గ్రీకు క్రియకు అక్షరార్థంగా ‘నరికివేయబడతావు’ అని అర్థం; చుట్టుపక్కల ఉన్న ఒలీవ చెట్టు రూపకం కారణంగా ‘విరిచివేయబడతావు’ అనేది సందర్భానుసారమైన ప్రత్యామ్నాయం.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: గమనించు
  rationale: ఇది ఏకవచన ఆజ్ఞారూపంలో శ్రద్ధగా పరిశీలించమనే పిలుపు. ఆధునిక తెలుగులో ‘గమనించు’ సహజంగా ఉండి, ఆలోచనతో చూడాలనే భావాన్ని తెలియజేస్తుంది.
- source_word: χρηστότητα / χρηστότης
  choice: దయ
  rationale: ఇక్కడ ఈ పదం దేవుని దయాపూర్వకమైన మేలును సూచిస్తుంది. ‘దయ’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, ‘కఠినత’తో ఉన్న సంబంధాత్మక వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἀποτομίαν / ἀποτομία
  choice: కఠినత
  rationale: తీర్పులోని కఠినమైన, రాజీలేని చర్యను ఈ పదం సూచిస్తుంది. ‘కఠినత’ మూలంలోని బలాన్ని అతిశయింపకుండా సహజంగా అందిస్తుంది.
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: పడిపోయినవారి పట్ల
  rationale: ἐπί పదబంధంలోని దిశ లేదా సంబంధాన్ని ‘పట్ల’ సహజంగా తెలియజేస్తుంది; substantival participle‌ను ‘పడిపోయినవారు’గా వ్యక్తపరుస్తుంది.
- source_word: ἐπὶ δὲ σὲ
  choice: నీ పట్ల మాత్రం
  rationale: ముందటి ‘పడిపోయినవారి పట్ల’ అనే నిర్మాణంతో సమాంతరతను కాపాడుతూ, δέ సూచించే వ్యత్యాసాన్ని ‘మాత్రం’ స్పష్టపరుస్తుంది.
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: నీవు ఆ దయలో కొనసాగితేనే
  rationale: ἐπιμένω యొక్క కొనసాగడం లేదా నిలకడగా ఉండడం అనే భావాన్ని ‘కొనసాగు’ తెలియజేస్తుంది. గ్రీకులోని నిర్దిష్ట article‌ను ‘ఆ’గా చూపించి, వెంటనే ముందు ప్రస్తావించిన దేవుని దయనే సూచిస్తుంది; ‘అయితేనే’ షరతు బలాన్ని నిలుపుతుంది.
- source_word: ἐπεὶ
  choice: లేకపోతే
  rationale: ఈ సందర్భంలో షరతు నెరవేరనప్పుడు కలిగే ప్రతికూల ఫలితాన్ని పరిచయం చేస్తుంది. ‘లేకపోతే’ తెలుగు హెచ్చరికలో సహజమైన సమానార్థకం.
- source_word: ἐκκοπήσῃ
  choice: నరికివేయబడతావు
  rationale: ἐκκόπτω యొక్క భవిష్యత్ కర్మణి రూపాన్ని నేరుగా ప్రతిబింబిస్తుంది. చుట్టూ ఉన్న ఒలీవ చెట్టు రూపకానికీ ఇది సరిపోతుంది.
theological_decisions:
- issue: దేవుని దయలో కొనసాగడానికీ నరికివేయబడే హెచ్చరికకూ మధ్య ఉన్న షరతు
  choice: ‘నీవు ఆ దయలో కొనసాగితేనే; లేకపోతే నీవు కూడా నరికివేయబడతావు’ అని ప్రత్యక్ష షరతు మరియు హెచ్చరికను నిలిపాం.
  alternative: దీనిని కేవలం ఊహాత్మక హెచ్చరికగా మృదువుపరచడం, లేదా ఇది వ్యక్తిగతమా సమూహపరమా అని అనువాదంలోనే నిర్ణయించడం.
  rationale: గ్రీకు పాఠం నిజమైన షరతుతో కూడిన ప్రబోధనను, హెచ్చరికను ఇస్తుంది; అయితే నిలకడ, విశ్వాసభ్రంశం, వ్యక్తిగత లేదా సమూహ అన్వయం గురించిన తరువాతి సిద్ధాంత వివాదాలను తానే పరిష్కరించదు. అందువల్ల ఆ ఉద్రిక్తతను అనువాదం అలాగే నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని ఏకవచన సంబోధనను ‘నీవు’తో నిలిపాం. రెండు భాగాల వ్యత్యాసాన్ని స్పష్టంగా చూపేందుకు ద్విబిందువు, అర్ధవిరామం, దీర్ఘవిరామం ఉపయోగించాం.
