  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: te
  text: 'అయితే నీవు ఇలా అంటావు: “నేను అంటుకట్టబడటానికి కొమ్మలు విరిచివేయబడ్డాయి.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: నీవు … అంటావు
  rationale: λέγω క్రియ యొక్క భవిష్యత్ కాల, కర్తరి ప్రయోగ, ఏకవచన ద్వితీయ పురుష రూపం. పౌలు ఊహాత్మక సంభాషణకర్తను నేరుగా ఉద్దేశిస్తున్న శైలిని ఇది నిలుపుతుంది.
- source_word: οὖν
  choice: అప్పుడు
  rationale: వాదనలో ముందున్న విషయంనుంచి వచ్చే నిర్ధారణను సూచించే అనుసంధాన పదం; ఆధునిక తెలుగులో ‘అప్పుడు’ సహజంగా ఉంది.
- source_word: Ἐξεκλάσθησαν
  choice: విరిచివేయబడ్డాయి
  rationale: ἐκκλάω క్రియ యొక్క భూతకాల నిష్క్రియ రూపం. ఒలీవ చెట్టు రూపకంలోని కొమ్మలను విరిచివేయడం అనే చిత్రాన్ని నిలుపుతుంది.
- source_word: κλάδοι
  choice: కొన్ని కొమ్మలు
  rationale: κλάδοι అనిర్దిష్ట బహువచనం. తెలుగులో సహజమైన అనిర్దిష్ట భావాన్ని తెలియజేయడానికి ‘కొన్ని’ చేర్చబడింది; ఇది అన్ని కొమ్మలు అనే భావాన్ని నివారిస్తుంది.
- source_word: ἵνα
  choice: …టానికే
  rationale: ఉద్దేశం లేదా ఫలితాన్ని తెలిపే ఉపవాక్యాన్ని సూచిస్తుంది. ఊహాత్మక సంభాషణకర్త తనకు అనుకూలంగా చెప్పే కారణాన్ని ‘టానికే’ సహజంగా, స్వల్ప ఉద్ఘాటనతో వ్యక్తపరుస్తుంది.
- source_word: ἐγὼ
  choice: నేను
  rationale: గ్రీకులో సర్వనామం స్పష్టంగా ఉండి ఉద్ఘాటన కలిగిస్తుంది; తెలుగులో ‘నేను’ని వెల్లడిగా ఉంచడం ఆ ప్రాధాన్యాన్ని నిలుపుతుంది.
- source_word: ἐγκεντρισθῶ
  choice: అంటుకట్టబడటానికి
  rationale: ἐγκεντρίζω క్రియ యొక్క నిష్క్రియ సంభావనార్థక రూపం. చెట్టుకు కొమ్మను graft చేయడం అనే ఉద్యానవన రూపకానికి ‘అంటుకట్టడం’ సాధారణ ఆధునిక తెలుగు పదప్రయోగం; నిష్క్రియ భావం కూడా నిలిచింది.
theological_decisions:
- issue: మాట్లాడేవాడు పౌలు ఊహించిన సంభాషణకర్త అని ప్రధాన పాఠ్యంలో స్పష్టం చేయాలా
  choice: ‘నీవు … అంటావు’ అనే ప్రత్యక్ష ద్వితీయ పురుష సంబోధనను అలాగే ఉంచడం
  alternative: ‘అప్పుడు ఎవరైనా ఇలా అనవచ్చు’
  rationale: గ్రీకు పాఠ్యం నేరుగా ‘నీవు అంటావు’ అని చెబుతుంది. ‘ఎవరైనా’ అని చేర్చడం సంభాషణ శైలిని వివరిస్తుంది గాని మూలపాఠ్యానికి మించిన వ్యాఖ్యానం అవుతుంది.
- issue: ἵνα ఉపవాక్యాన్ని దేవుని ఉద్దేశంపై పౌలు సమర్థించిన సిద్ధాంత ప్రకటనగా బలపరచాలా
  choice: ఊహాత్మక వ్యక్తి చెప్పే వాదనగానే ‘నేను అంటుకట్టబడటానికే’ అని అనువదించడం
  alternative: ‘దేవుడు నన్ను అంటుకట్టడానికి వాటిని విరిచివేశాడు’
  rationale: మూలపాఠ్యంలో దేవుడు కర్తగా పేర్కొనబడలేదు; ఇది అన్యజన సంభాషణకర్త చేసే నిర్ధారణ. అందువల్ల దైవిక ఉద్దేశాన్ని అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ఒలీవ చెట్టు రూపకాన్ని ‘కొమ్మలు,’ ‘విరిచివేయబడ్డాయి,’ ‘అంటుకట్టబడటం’ అనే వ్యవసాయ/ఉద్యాన పదాలతో నిలిపాం. పాఠ్యంలో పాదసూచికలు అవసరం లేదు.
