source:
  edition: SBLGNT
  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: te
  text: వారు చూడకుండా ఉండేలా వారి కళ్లు చీకటిపడనివ్వు[a]; వారి వీపులను నిరంతరం వంగదీయి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘వారి కళ్లు గుడ్డివైపోనివ్వు.’ గ్రీకు పదం అక్షరార్థంగా ‘చీకటిగా చేయబడడం’ అని చెబుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఎల్లప్పుడూ.’ ఈ పదబంధం ఎడతెగని లేదా స్థిరమైన కాలవ్యాప్తిని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: చీకటిపడనివ్వు
  rationale: మూడవ పురుష బహువచన కర్మణి ఆజ్ఞార్థక రూపంలోని శాపప్రార్థన భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తూ, మూలంలోని చీకటి దృశ్యరూపాన్ని నిలుపుతుంది.
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: వారి కళ్లు
  rationale: శరీర సంబంధ దృశ్యరూపానికి కేంద్రంగా ఉన్న సాధారణ స్వామ్య నామపదబంధాన్ని నేరుగా నిలుపుతుంది.
- source_word: τοῦ μὴ βλέπειν
  choice: వారు చూడకుండా ఉండేలా
  rationale: μήతో కూడిన నామీకృత క్రియారూపం సూచించే ఉద్దేశం లేదా ఫలితం మధ్య ఉన్న నిజమైన సందిగ్ధతను అతిగా నిర్ణయించకుండా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τὸν νῶτον αὐτῶν
  choice: వారి వీపులను
  rationale: గ్రీకులో ఏకవచన సమష్టి ప్రయోగం ఉన్నా, అనేక వ్యక్తుల గురించి తెలుగులో ‘వీపులను’ అనడం సహజంగా ఉండి ప్రతి ఒక్కరి వీపును సూచిస్తుంది.
- source_word: διὰ παντός
  choice: ఎల్లప్పుడూ
  rationale: నిరంతరమైన లేదా స్థిరమైన కాలవ్యాప్తిని తెలియజేస్తుంది; తప్పనిసరిగా అంతులేని నిత్యత్వాన్ని చేర్చదు.
- source_word: σύγκαμψον
  choice: వంగదీయి
  rationale: దేవునికి ఉద్దేశించిన ఏకవచన ఆజ్ఞార్థక బలాన్ని, అలాగే వీపును వంగేలా చేయడమనే ప్రత్యక్ష శారీరక దృశ్యరూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: శాపప్రార్థనాత్మక ఉదాహరణ మరియు దైవ కార్యసాధకత్వం
  choice: ‘చీకటిపడనివ్వు ... వంగదీయి’ అనే ఆజ్ఞార్థక/ప్రార్థనాత్మక బలాన్ని నిలుపడం
  alternative: దీనిని ‘వారి కళ్లు చీకటిపడతాయి’ అనే కేవలం భవిష్యద్వాక్యంగా లేదా కార్యసాధకుడు లేని పర్యవసానంగా అనువదించడం
  rationale: పౌలు ఉటంకించిన వాక్యం తీర్పును కోరే ప్రార్థనాత్మక ఆజ్ఞారూపాన్ని కలిగి ఉంది. దాని తీవ్రతను తగ్గించకుండానే, పాఠ్యంలో లేని అదనపు సిద్ధాంత వివరణను చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ వాక్యంలోని గంభీరమైన, తీర్పుసంబంధ స్వరాన్ని నిలిపాం. మూలంలోని రెండు ఆజ్ఞార్థక రూపాలు, చీకటి మరియు వంగిన వీపు అనే దృశ్యరూపాలు పరిరక్షించబడ్డాయి.
