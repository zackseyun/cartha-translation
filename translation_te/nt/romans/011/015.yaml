id: ROM.11.15
reference: Romans 11:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: te
  text: ఎందుకంటే, వారు తిరస్కరించబడటం లోకానికి సయోధ్య కలగడమైతే, వారు స్వీకరించబడటం[a] మృతులలోనుండి జీవం[b] కాక ఇంకేమవుతుంది?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తిరిగి స్వీకరించబడటం.’ గ్రీకు పదం ‘తిరస్కరించబడటం’కు వ్యతిరేకంగా ఉంది; అది తిరిగి స్వీకరించడం లేదా అంగీకరించడం అనే భావాన్ని ఇవ్వవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘మృతులలోనుండి జీవం’ అనేది అసాధారణమైన ఆత్మీయ పునరుజ్జీవనాన్ని రూపకంగా సూచించవచ్చు; లేదా మరింత నిర్దిష్టంగా పునరుత్థానాన్ని సూచించవచ్చు. పౌలు ఈ మాటను సంక్షిప్తంగాను భావగర్భితంగాను ఉంచాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: తిరస్కరించబడడం
  rationale: ఇక్కడ ఇశ్రాయేలు పక్కన పెట్టబడిన సంబంధపరమైన భావాన్ని తెలియజేస్తుంది; ‘నష్టం’ కంటే స్పష్టంగా ఉండి, గ్రీకు పదంలోని క్రియాత్మక భావాన్ని సహజమైన తెలుగులో అందిస్తుంది.
- source_word: καταλλαγὴ
  choice: సమాధానం
  rationale: విరిగిన సంబంధం తిరిగి సరిచేయబడడాన్ని సూచించే పౌలు వాడుకకు సరిపోయే, తెలుగు బైబిలు భాషలో పరిచితమైన పదం.
- source_word: κόσμου
  choice: లోకానికి
  rationale: సందర్భంలో అన్యజనులు ఉన్నప్పటికీ, గ్రీకు κόσμος‌ను ‘అన్యజనుల లోకం’గా కుదించకుండా దాని విస్తృత రూపాన్నే ఉంచుతుంది.
- source_word: πρόσλημψις
  choice: అంగీకరించబడడం
  rationale: ἀποβολήతో ఉన్న స్పష్టమైన వ్యతిరేకతను నిలుపుతూ, తిరిగి స్వీకరించబడే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ζωὴ ἐκ νεκρῶν
  choice: మృతులలోనుండి జీవం కలగడం
  rationale: ఆత్మీయ పునరుజ్జీవమా లేక మృతుల పునరుత్థానమా అనే అర్థాన్ని నిర్ణయించకుండా, గ్రీకు పదబంధంలోని సంక్షిప్తమైన, ప్రభావవంతమైన భావాన్ని నిలుపుతుంది.
- source_word: εἰ μὴ
  choice: కాక మరేమవుతుంది?
  rationale: అలంకారిక ప్రశ్నలో ఆశించబడే బలమైన సమాధానాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనతో ఈ వాక్యానికి ఉన్న కారణాత్మక సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ‘మృతులలోనుండి జీవం’ అనే మాట యొక్క అర్థం
  choice: ఆ మాటను స్పష్టంగా నిర్వచించకుండా, ఆత్మీయ పునరుజ్జీవం లేదా పునరుత్థానం అనే రెండు అవకాశాలకూ తెరిచి ఉంచడం.
  alternative: దీనిని గొప్ప ఆత్మీయ పునరుజ్జీవంగా మాత్రమే లేదా అంతిమ పునరుత్థానంగా మాత్రమే అనువదించడం.
  rationale: పౌలు వాడిన ζωὴ ἐκ νεκρῶν సంక్షిప్తంగా, బహుళార్థసాధ్యంగా ఉంది. అనువాదం గ్రీకు పాఠం పరిష్కరించని వేదాంతపరమైన ఉద్వేగాన్ని అలాగే నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘తిరస్కరించబడడం/అంగీకరించబడడం’ అనే సమాంతర నిర్మాణం గ్రీకు వ్యతిరేకతను నిలుపుతుంది; ‘మృతులలోనుండి జీవం’ అనే భావాన్ని వివరణతో కుదించలేదు.
