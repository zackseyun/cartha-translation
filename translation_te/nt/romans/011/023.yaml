id: ROM.11.23
reference: Romans 11:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κἀκεῖνοι δέ, ἐὰν μὴ ⸀ἐπιμένωσι τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ⸂ἐστιν ὁ θεὸς⸃ πάλιν ἐγκεντρίσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: te
  text: వారు కూడా[a] తమ అవిశ్వాసంలో నిలిచి ఉండకపోతే, అంటుకట్టబడతారు; ఎందుకంటే దేవుడు వారిని మళ్లీ అంటుకట్టగలడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘తమ అవిశ్వసనీయతలో నిలిచి ఉండకపోతే’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘వారిని తిరిగి అంటుకట్టగలడు’ అని కూడా అనువదించవచ్చు. గ్రీకులో ‘మళ్లీ’ అనే పదం రెండో ఉపవాక్యంలో స్పష్టంగా ఉంది.
    reason: alternative_reading
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: వారు కూడా
  rationale: καί యొక్క చేర్పు భావాన్నీ, ἐκεῖνοι సూచించే మునుపు ప్రస్తావించిన అవిశ్వాసులైన కొమ్మల భావాన్నీ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐὰν μὴ ἐπιμένωσι
  choice: కొనసాగకుండా ఉంటే
  rationale: వర్తమాన సుబ్జంక్టివ్‌లోని కొనసాగే లేదా పట్టుదలగా నిలిచే స్థితిని, షరతు భావంతో సహజంగా నిలుపుతుంది.
- source_word: τῇ ἀπιστίᾳ
  choice: తమ అవిశ్వాసంలో
  rationale: ἐπιμένωతో వచ్చిన దత్తివిభక్తిని ‘లో’తో అందిస్తుంది; రోమా 11లోని విశ్వాసం–అవిశ్వాసం వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ἐγκεντρισθήσονται
  choice: అంటుకట్టబడతారు
  rationale: ఒలీవ చెట్టు రూపకంలోని భవిష్యత్ కర్మణి రూపాన్ని నేరుగా, అర్థమయ్యే తెలుగులో వ్యక్తం చేస్తుంది; ఈ మొదటి క్రియలో లేని ‘మళ్లీ’ భావాన్ని ముందుగానే చేర్చదు.
- source_word: δυνατὸς γάρ ἐστιν ὁ θεὸς
  choice: ఎందుకంటే దేవుడు ... గలడు
  rationale: γάρ ఇచ్చే కారణ సంబంధాన్నీ, δυνατός తెలిపే దేవుని సామర్థ్యాన్నీ సహజమైన తెలుగు వాక్య నిర్మాణంలో నిలుపుతుంది.
- source_word: πάλιν ἐγκεντρίσαι αὐτούς
  choice: వారిని మళ్లీ అంటుకట్టగలడు
  rationale: πάλιν‌లో స్పష్టంగా ఉన్న పునరుద్ధరణ భావాన్ని ‘మళ్లీ’తో రెండో ఉపవాక్యంలోనే ఉంచి, అంటుకట్టే రూపకాన్ని కొనసాగిస్తుంది.
theological_decisions:
- issue: ἀπιστία యొక్క భావం
  choice: అవిశ్వాసం
  alternative: నమ్మకద్రోహం / విశ్వసనీయత లేకపోవడం
  rationale: రోమా 11లో విశ్వాసం, అవిశ్వాసం ద్వారా చెట్టులో నిలిచి ఉండడం లేదా తొలగించబడడం పరస్పరం వ్యతిరేకించబడ్డాయి. అయినప్పటికీ పదానికి ఉండగల ‘విశ్వసనీయత లేకపోవడం’ అనే ప్రత్యామ్నాయ ఛాయను పాదటిప్పణిలో నిలిపాం.
- issue: మొదటి అంటుకట్టే క్రియలో పునరుద్ధరణను స్పష్టంచేయాలా
  choice: మొదటి క్రియను కేవలం ‘అంటుకట్టబడతారు’గా ఉంచి, రెండో ఉపవాక్యంలో ‘మళ్లీ’ అని చెప్పడం
  alternative: మొదటి క్రియనే ‘తిరిగి అంటుకట్టబడతారు’గా అనువదించడం
  rationale: గ్రీకులో πάλιν రెండో ఉపవాక్యంలో మాత్రమే స్పష్టంగా ఉంది. అందువల్ల మూలపాఠంలోని పదస్థాన భేదాన్ని కాపాడుతూ, పునరుద్ధరణ భావాన్ని రెండో ఉపవాక్యంలో వ్యక్తం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. తోటపని రూపకానికి ‘అంటుకట్టు’ అనే సాధారణ పదాన్ని ఉపయోగించాం; వాక్యంలోని షరతు, కర్మణి రూపం, పునరుద్ధరణ భావాల స్థానాన్ని సాధ్యమైనంతవరకు నిలిపాం.
