id: ROM.11.32
reference: Romans 11:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν ἵνα τοὺς πάντας ἐλεήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: te
  text: ఎందుకంటే దేవుడు అందరినీ అవిధేయతలో బంధించాడు[a][b][c], అందరిమీద కనికరం చూపునట్లు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘బంధించాడు’ అనే మాటను ‘నిర్బంధించాడు,’ ‘అప్పగించాడు,’ లేదా ‘ఒకే స్థితిలో ఉంచాడు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అవిధేయత’ అనే పదానికి కొన్ని సందర్భాల్లో ‘అవిశ్వాసం’ అనే భావం కూడా ఉండవచ్చు; ఇక్కడ లోబడడానికి నిరాకరించడం అనే విస్తృత భావమే ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: c
    text: మూలవచనంలో ‘అందరు’ అనే పదం రెండుసార్లు వస్తుంది. దాని పరిధిని అనువాదంలో ముందుగానే కుదించకుండా అలాగే ఉంచాం; సందర్భంలో పౌలు యూదులు, యూదేతరులు ఇద్దరి గురించీ మాట్లాడుతున్నాడు.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: బంధించాడు
  rationale: συγκλείω అనే క్రియలో చుట్టుముట్టి నిర్బంధించడం లేదా ఒక స్థితిలో బంధించడం అనే రూపకం ఉంది. ‘బంధించాడు’ ఆ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది; దీనిని కేవలం శిక్షగా మాత్రమే నిర్ధారించదు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: γάρ ముందున్న వాదనకు వివరణను పరిచయం చేస్తుంది. ‘ఎందుకంటే’ తెలుగులో ఆ తార్కిక సంబంధాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τοὺς πάντας
  choice: అందరినీ / అందరిపట్లా
  rationale: గ్రీకులో ఒకే పదబంధం రెండుసార్లు వచ్చి విస్తృతమైన సమాంతరతను సృష్టిస్తుంది. తెలుగు విభక్తులకు అనుగుణంగా రూపం మారినా, రెండు చోట్లా ‘అందరు’ అనే అదే విస్తృత పదాన్ని ఉంచడం ద్వారా యూదులు–యూదేతరులు అనే సందర్భాన్ని అనవసరంగా సంకుచితం చేయలేదు.
- source_word: εἰς ἀπείθειαν
  choice: అవిధేయతలో
  rationale: ἀπείθεια అనేది నమ్మకపోవడం అనే భావాన్ని కలిగి ఉండగలిగినా, ప్రధానంగా లోబడకపోవడం లేదా విధేయత చూపకపోవడం అనే విస్తృత భావం కలది. ‘అవిధేయతలో’ εἰς సూచించే స్థితిలోకి/స్థితిలో నిర్బంధించబడిన భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἵνα
  choice: చూపడానికి
  rationale: ἵνα ఉద్దేశాన్ని లేదా ఫలితాన్ని సూచిస్తుంది. ‘చూపడానికి’ అనే ప్రయోజనార్థక నిర్మాణం తెలుగులో సహజంగా ఉండి, దైవ కార్యపు ఉద్దేశాన్ని తెలియజేస్తుంది.
- source_word: ἐλεήσῃ
  choice: కనికరం చూపడానికి
  rationale: ἐλεάω అంటే కనికరం లేదా కరుణ చూపడం. ‘కనికరం చూపు’ సాధారణ ఆధునిక తెలుగులో స్పష్టంగా ఉండి క్రియాత్మక భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: రెండు భాగాల్లోని ‘అందరు’ అనే పదం యొక్క పరిధి
  choice: రెండు చోట్లా ‘అందరు’ అనే విస్తృత పదాన్నే నిలుపడం.
  alternative: ‘యూదులు, యూదేతరులు అందరూ’ అని సందర్భాన్ని వచనంలోనే స్పష్టీకరించడం; లేదా పరిధిని ఇతర విధంగా పరిమితం చేయడం.
  rationale: τοὺς πάντας అనే పదబంధాన్ని పౌలు రెండు భాగాల్లోనూ పునరావృతం చేశాడు. సందర్భంలో యూదులు, యూదేతరులు కలిసి దృష్టిలో ఉన్నప్పటికీ, మూలవచనంలోని విస్తృతతను అనువాదం ముందుగానే సంకుచితం చేయకూడదు; సార్వత్రిక రక్షణ తదితర వేదాంత వివాదాలను కూడా అనువాదమే పరిష్కరించకూడదు.
- issue: దేవుడు అవిధేయతలో బంధించడం మరియు కనికరం చూపడం మధ్య సంబంధం
  choice: ἵνα యొక్క ఉద్దేశార్థాన్ని ‘కనికరం చూపడానికి’ అని నిలుపడం.
  alternative: కేవలం ఫలితార్థంగా ‘దాని ఫలితంగా కనికరం చూపాడు’ అని అనువదించడం.
  rationale: ἵνα సాధారణంగా ఉద్దేశం లేదా ఉద్దేశంతో కూడిన ఫలితాన్ని సూచిస్తుంది. ఇక్కడ ఉద్దేశార్థాన్ని ఉంచడం గ్రీకు నిర్మాణానికి దగ్గరగా ఉంటుంది; అదే సమయంలో దాని వేదాంతపరమైన ఒత్తిడిని మృదువుగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘బంధించాడు’ అనే స్పష్టమైన రూపకాన్ని నిలిపి, ‘అందరు’ అనే పునరుక్తిలోని వేదాంతపరమైన విస్తృతతను కాపాడాం. తెలుగు వాక్యప్రవాహం కోసం రెండో భాగంలో ‘ఆయన ఇలా చేశాడు’ చేర్చబడింది; ఇది కొత్త భావాన్ని జోడించకుండా ముందటి దైవకార్యాన్ని తిరిగి సూచిస్తుంది.
