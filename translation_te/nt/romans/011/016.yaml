source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: te
  text: మొదట అర్పించే భాగం పవిత్రమైతే, పిండిముద్ద అంతా కూడా పవిత్రమే; వేరు పవిత్రమైతే, కొమ్మలు కూడా పవిత్రమే.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: మొదట అర్పించే భాగం
  rationale: దేవునికి అర్పించే మొదటి భాగం అనే ఆరాధనాపరమైన భావాన్ని నిలుపుతూ, వెంట వచ్చే పిండి రూపకంతో సంబంధాన్ని ఆధునిక తెలుగు పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἁγία
  choice: పవిత్రం / పవిత్రమే
  rationale: రెండు సమాంతర వాక్యాల్లోని బైబిలు భావవర్గాన్ని యథాతథంగా ఉంచుతుంది; అది ఒడంబడికపరమైనదా, ప్రతినిధిత్వపరమైనదా, రక్షణపరమైనదా అని అనువాదంలో నిర్ణయించదు.
- source_word: φύραμα
  choice: పిండిముద్ద అంతా
  rationale: కలిపిన పిండి మొత్తాన్ని సూచించే గ్రీకు పదానికి సహజమైన, స్పష్టమైన తెలుగు రూపం; మొదట అర్పించే భాగానికి మిగిలిన మొత్తం పిండికి మధ్యనున్న పోలికను నిలుపుతుంది.
- source_word: ῥίζα
  choice: వేరు
  rationale: వృక్ష సంబంధమైన రూపకానికి సహజమైన తెలుగు పదం; తరువాతి ఒలీవ చెట్టు రూపకానికి అనుగుణంగా ఉంది.
- source_word: κλάδοι
  choice: కొమ్మలు
  rationale: వృక్ష రూపకంలో సాధారణంగా అర్థమయ్యే ఖచ్చితమైన తెలుగు పదం.
- source_word: εἰ δὲ ... καὶ ...; καὶ εἰ ... καὶ ...
  choice: …మైతే, …కూడా పవిత్రమే; …మైతే, …కూడా పవిత్రమే
  rationale: గ్రీకులో రెండో భాగాల్లో విడిచిపెట్టిన క్రియను తెలుగులో సహజంగా పూరిస్తూ, సంక్షిప్తమైన తార్కిక సమాంతరతను స్పష్టం చేస్తుంది. δέకు ప్రత్యేక కాలార్థం లేకపోవడంతో ‘ఇప్పుడు’ వంటి పదాన్ని చేర్చలేదు.
theological_decisions:
- issue: మొదటి అర్పణ భాగం/వేరు నుంచి పిండిముద్ద/కొమ్మలకు సంబంధించిన పవిత్రత స్వభావం
  choice: ‘పవిత్రం’ అనే పదాన్నే ఉంచి, ఆ పవిత్రత ఏ విధమైనదో నిర్దిష్టంగా చెప్పలేదు.
  alternative: దీనిని ఒడంబడికలో ప్రత్యేకపరచబడటం, ప్రతినిధిత్వ పవిత్రత, లేదా రక్షణ కలిగించే పవిత్రతగా స్పష్టీకరించడం.
  rationale: ఈ వాక్యం మొదటి భాగానికి మొత్తానికి, వేరుకు కొమ్మలకు మధ్య ఉత్పన్న సంబంధాన్ని చూపుతుంది; అయితే ఆ పవిత్రత యొక్క ఖచ్చిత స్వభావాన్ని నిర్వచించదు. కాబట్టి మూలంలోని theological tension‌ను పరిష్కరించకుండా నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘ప్రథమఫలం’ అనే సాంకేతిక పదానికి బదులు ‘మొదట అర్పించే భాగం’ అని అనువదించి ఆరాధనాపరమైన భావాన్నీ పిండి రూపకంతో సంబంధాన్నీ రెండింటినీ స్పష్టంగా ఉంచింది.
