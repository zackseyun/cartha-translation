id: ROM.11.2
reference: Romans 11:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: te
  text: దేవుడు తాను ముందుగా ఎరిగిన[a] తన ప్రజలను తిరస్కరించలేదు. లేదా, ఏలీయా గురించిన లేఖనభాగంలో[b] అతడు ఇశ్రాయేలుకు వ్యతిరేకంగా దేవునికి ఎలా మొరపెడుతున్నాడో లేఖనం ఏమి చెబుతుందో మీకు తెలియదా?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ముందుగా ఎరిగిన’ అనే మాటను ‘ముందుగానే తెలిసిన’ అని కూడా అనువదించవచ్చు. కొందరు దీనిని ముందస్తు ఎంపికను సూచించే బలమైన భావంలో అర్థం చేసుకుంటారు; అయితే ప్రధాన పాఠ్యం గ్రీకు పదంలోని వేదాంతపరమైన అనిశ్చితతను అలాగే ఉంచుతుంది.
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా ‘ఏలీయాలో’; ఇది ‘ఏలీయా గురించిన లేఖనభాగంలో’ అనే అర్థమిచ్చే నుడికారం.
    reason: lexical_alternative
  - marker: c
    text: ‘మొరపెడుతున్నాడో’ అనే మాటను ‘దేవునికి విన్నవిస్తున్నాడో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: తిరస్కరించలేదు
  rationale: ఇక్కడ ἀπωθέομαι అంటే ‘తిరస్కరించు’ లేదా ‘తోసివేయు.’ దేవుడు తన ప్రజలను విడిచిపెట్టాడనే భావాన్ని పౌలు ఖండిస్తున్న సందర్భంలో ‘తిరస్కరించలేదు’ అనేది స్పష్టమైన ఆధునిక తెలుగు.
- source_word: λαὸν αὐτοῦ
  choice: తన ప్రజలను
  rationale: λαός ఇక్కడ దేవునికి చెందిన నిబంధన ప్రజలను సూచిస్తుంది. ఈ మొదటి వాక్యంలో మూలంలో లేని ‘ఇశ్రాయేలు’ అనే పేరును చేర్చకుండా సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: προέγνω
  choice: ముందుగా ఎరిగిన
  rationale: ఈ క్రియ యొక్క ప్రాథమిక భావం ‘ముందుగానే తెలుసుకున్న.’ ‘ముందుగా ఎరిగిన’ అనే రూపం ముందస్తు ఎంపిక అనే బలమైన వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా గ్రీకు పదంలోని వేదాంత ఉద్విగ్నతను నిలుపుతుంది.
- source_word: ἢ οὐκ οἴδατε
  choice: లేదా ... మీకు తెలియదా?
  rationale: పౌలు వేసే అలంకారిక ప్రశ్నను సహజమైన, గౌరవప్రదమైన తెలుగు ప్రశ్నారూపంలో నిలిపింది.
- source_word: ἐν Ἠλίᾳ
  choice: ఏలీయా గురించిన లేఖనభాగంలో
  rationale: అక్షరార్థంగా ‘ఏలీయాలో’ ఉన్న ఈ గ్రీకు ప్రయోగం, ఏలీయా గురించి చెప్పే లేఖన విభాగాన్ని సూచిస్తుంది. భావాన్ని అనువదించడం తెలుగులో అపార్థాన్ని నివారిస్తుంది.
- source_word: ἡ γραφή
  choice: లేఖనం
  rationale: పౌలు వాడుకలో γραφή పవిత్ర లేఖనాన్ని సూచిస్తుంది. ‘లేఖనం’ సంక్షిప్తమైన, స్థిరమైన బైబిలు తెలుగు పదం.
- source_word: ὡς ἐντυγχάνει τῷ θεῷ
  choice: దేవునికి ఎలా మొరపెడుతున్నాడో
  rationale: ἐντυγχάνω అంటే విన్నవించు, మొరపెట్టు, విజ్ఞాపన చేయు. తరువాత వచ్చే ‘ఇశ్రాయేలుకు వ్యతిరేకంగా’ అనే మాటల దృష్ట్యా, అనుకూలమైన మధ్యవర్తిత్వాన్ని సూచించగల పదం కంటే ‘మొరపెడుతున్నాడో’ సందర్భానికి సరిపోతుంది.
- source_word: κατὰ τοῦ Ἰσραήλ
  choice: ఇశ్రాయేలుకు వ్యతిరేకంగా
  rationale: κατά షష్ఠీ విభక్తితో ఇక్కడ ప్రతికూల భావంలో ‘వ్యతిరేకంగా’ అని అర్థం. ‘ఇశ్రాయేలు’ అనే ప్రత్యేక నామాన్ని యథాతథంగా ఉంచింది.
theological_decisions:
- issue: προέγνω అనే పదానికి దైవిక ఎన్నికతో ఉన్న సంబంధం
  choice: ముందుగా ఎరిగిన
  alternative: ముందుగానే తెలిసిన; ముందుగానే ప్రేమించిన; ముందుగానే ఎన్నుకున్న
  rationale: ఈ వాక్యం పౌలు చెప్పే ఎన్నిక అంశంతో సంబంధం కలిగి ఉన్నప్పటికీ, గ్రీకు పదమే నిర్దిష్టంగా పరిష్కరించని వేదాంత చర్చను అనువాదం పరిష్కరించకూడదు. ‘ముందుగా ఎరిగిన’ అనేది ముందస్తు జ్ఞాన భావాన్ని నిలుపుతూ ‘ముందుగానే ఎన్నుకున్న’ అనే బలమైన సిద్ధాంత వ్యాఖ్యానాన్ని పాఠ్యంలోకి దిగుమతి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన బైబిలు శైలిని ఉపయోగించాం. గ్రీకు వాక్యంలోని ఒకే అలంకారిక ప్రశ్నను తెలుగులోనూ ఒకే ప్రశ్నగా నిలిపాం. ‘ఏలీయాలో’ అనే అపారదర్శక అక్షరానువాదానికి బదులు నుడికార భావాన్ని ప్రధాన పాఠ్యంలో ఇచ్చి, అక్షరరూపాన్ని పాదటిప్పణిలో నమోదు చేశాం.
