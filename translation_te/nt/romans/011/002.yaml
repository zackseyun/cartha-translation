revisions:
- from: దేవుడు తాను ముందుగా ఎరిగిన తన ప్రజలను తిరస్కరించలేదు.[a] లేదా, ఏలీయా గురించిన లేఖనభాగంలో[b] అతడు ఇశ్రాయేలుకు వ్యతిరేకంగా దేవునికి ఎలా మొరపెడుతున్నాడో లేఖనం చెప్పేది మీకు తెలియదా?[c]
  to: దేవుడు తాను ముందుగా ఎరిగిన[a] తన ప్రజలను తిరస్కరించలేదు. లేదా, ఏలీయా గురించిన లేఖనభాగంలో[b] అతడు ఇశ్రాయేలుకు వ్యతిరేకంగా దేవునికి ఎలా మొరపెడుతున్నాడో లేఖనం ఏమి చెబుతుందో మీకు తెలియదా?[c]
  rationale: సవరణలు అర్థాన్ని మార్చవు. అవి గ్రీకు ప్రశ్నార్థక నిర్మాణాన్ని తెలుగులో పూర్తి, సహజమైన రూపంలో చూపిస్తాయి మరియు పాదటిప్పణి aను అది వివరించే προέγνω అనువాదం పక్కన ఉంచుతాయి. ‘ముందుగా ఎరిగిన’ను నిలుపుకోవడం ద్వారా ఎన్నికకు సంబంధించిన ఏ ఒక్క వేదాంత వ్యాఖ్యానాన్నీ ప్రధాన పాఠ్యం నిర్బంధించదు.
