id: ROM.11.31
reference: Romans 11:31
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὕτως καὶ οὗτοι νῦν ἠπείθησαν τῷ ὑμετέρῳ ἐλέει ἵνα καὶ αὐτοὶ ⸀νῦν ἐλεηθῶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: te
  text: అలాగే, మీకు చూపబడిన కరుణ ద్వారా వీరూ ఇప్పుడు కరుణ పొందేలా, వారు ఇప్పుడు అవిధేయత చూపారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “మీ కరుణ ద్వారా.” గ్రీకు పదబంధాన్ని మరింత అక్షరార్థంగా అలా అనువదించవచ్చు; అయితే సందర్భంలో ఇది దేవుడు మీకు చూపిన కరుణను సూచించే అవకాశమే ఎక్కువ.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ οὗτοι
  choice: అలాగే ... వీరు కూడా
  rationale: ముందటి వచనంతో ఉన్న పోలికను, ఇశ్రాయేలును సూచించే ప్రదర్శక సర్వనామ బలాన్ని నిలుపుతుంది.
- source_word: νῦν ἠπείθησαν
  choice: ఇప్పుడు అవిధేయులయ్యారు
  rationale: νῦν తెలిపే ప్రస్తుత రక్షణచరిత్ర దశను నిలుపుతూ, ἀπειθέωలోని అవిశ్వాసం–అవిధేయతల విస్తృత భావాన్ని కేవలం మేధోపరమైన అపనమ్మకంగా కుదించకుండా వ్యక్తం చేస్తుంది.
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: మీకు చూపబడిన కరుణ ద్వారా
  rationale: సంక్షిప్తమైన గ్రీకు దత్తి పదబంధాన్ని సందర్భానుసారంగా విప్పి, అన్యజన విశ్వాసులు చూపే కరుణకన్నా దేవుడు వారికి చూపిన కరుణనే ప్రధానంగా సూచిస్తుంది.
- source_word: ἵνα
  choice: పొందేలా
  rationale: ఉద్దేశం లేదా ఫలితాన్ని సూచించే ఉపవాక్య సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: καὶ αὐτοὶ νῦν ἐλεηθῶσιν
  choice: వీరు కూడా ఇప్పుడు కరుణ పొందేలా
  rationale: αὐτοίలోని చేర్పు ఉద్ఘాటనను, రెండవ νῦν యొక్క కాల సూచనను, దేవుని చేత లభించే కరుణను తెలిపే కర్మణి భావాన్ని నిలుపుతుంది.
theological_decisions:
- issue: “మీ కరుణ” అనేది అన్యజన విశ్వాసులు చూపే కరుణనా, లేక దేవుడు వారికి చూపిన కరుణనా?
  choice: మీకు చూపబడిన కరుణ ద్వారా
  alternative: మీ కరుణ ద్వారా
  rationale: రోమా 11:30–32లో రెండు వర్గాల అవిధేయత, వారు దేవుని కరుణ పొందడం పరస్పరం పోల్చబడ్డాయి. అందువల్ల దేవుడు అన్యజనులకు చూపిన కరుణనే ఇక్కడ ఉద్దేశించినట్లు సందర్భం బలంగా సూచిస్తుంది; అయినా గ్రీకు పదబంధంలోని మరింత అక్షరార్థ పఠనాన్ని పాదసూచికలో నిలిపాం.
- issue: ἵνα అవిధేయతకు దైవిక ఉద్దేశాన్ని సూచిస్తుందా, లేక ఫలితాన్ని సూచిస్తుందా?
  choice: కరుణ పొందేలా
  alternative: దాని ఫలితంగా ... కరుణ పొందవచ్చు
  rationale: గ్రీకు వాక్యంలోని ఉద్దేశం–ఫలితం మధ్య ఉన్న ఉద్రిక్తతను పూర్తిగా ఒక వైపుకు తీర్చకుండా, సహజమైన తెలుగు నిర్మాణంలో ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైనప్పటికీ గౌరవప్రదమైన శైలి వాడబడింది. గ్రీకు వాక్యక్రమాన్ని యాంత్రికంగా అనుసరించకుండా, ἵνα ఉపవాక్య సంబంధం మరియు రెండు νῦν పదాల ఉద్ఘాటన స్పష్టంగా ఉండేలా సహజ తెలుగు క్రమం ఎంచుకోబడింది.
