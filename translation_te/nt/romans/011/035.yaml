  edition: SBLGNT
  text: ἢ τίς προέδωκεν αὐτῷ, καὶ ἀνταποδοθήσεται αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/035.yaml
  text: Or who has first given to him[b][a], and it will be repaid to him?
translation:
  language: te
  text: లేదా, ఆయనకు ముందుగా ఇచ్చినవాడు ఎవరు, అతనికి తిరిగి చెల్లించబడుతుంది?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: లేదా
  rationale: ముందున్న వాక్యంలోని అలంకారిక ప్రశ్నల వరుసలో మరో ప్రశ్నను ప్రవేశపెడుతుంది.
- source_word: τίς
  choice: ఎవరు
  rationale: వ్యక్తిని సూచించే ప్రశ్నార్థక సర్వనామానికి సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: προέδωκεν
  choice: ముందుగా ఇచ్చినవాడు
  rationale: ఎవరైనా దేవునికంటే ముందుగా ఇచ్చి, ఆయనను బాకీదారునిగా చేయగలరా అనే భావంలో క్రియలోని పూర్వత్వాన్ని ‘ముందుగా’ నిలుపుతుంది.
- source_word: αὐτῷ
  choice: ఆయనకు
  rationale: సందర్భంలో దేవుణ్ణి సూచించే గ్రీకు సర్వనామాన్ని నామవాచకంగా మార్చకుండా గౌరవార్థక తెలుగు సర్వనామంతో అనువదించింది.
- source_word: καὶ
  choice: —
  rationale: రెండు భాగాల మధ్యనున్న గ్రీకు అనుసంధానాన్ని తెలుగులో ప్రశ్న యొక్క కొనసాగింపుగా విరామచిహ్నం, వాక్య నిర్మాణం ద్వారా సహజంగా వ్యక్తం చేసింది.
- source_word: ἀνταποδοθήσεται
  choice: తిరిగి చెల్లించబడడానికి
  rationale: ప్రతిగా తిరిగి ఇవ్వడం లేదా చెల్లించడం అనే భావాన్ని, కర్తను చేర్చకుండా కర్మణి రూపంలో నిలుపుతుంది; తెలుగు అలంకారిక ప్రశ్నలో సహజత్వం కోసం క్రియార్థక రూపం వాడింది.
- source_word: αὐτῷ
  choice: అతనికి
  rationale: ముందుగా ఇచ్చాడని ఊహించబడిన వ్యక్తిని సూచించే రెండవ సర్వనామాన్ని స్పష్టమైన తెలుగు రూపంలో నిలుపుతుంది.
theological_decisions:
- issue: αὐτῷ అనే మొదటి సర్వనామం ఎవరిని సూచిస్తుంది
  choice: ‘ఆయనకు’ అని ఉంచి, సందర్భానుసారం దేవుణ్ణి సూచించేలా అనువదించడం
  alternative: స్పష్టత కోసం ‘దేవునికి’ అని నేరుగా పేర్కొనడం
  rationale: గ్రీకు మూలంలో ‘దేవుడు’ అనే నామవాచకం కాక సర్వనామమే ఉంది; సందర్భంలో సూచన స్పష్టంగా ఉండటంతో మూలరూపాన్ని నిలిపింది.
- issue: προέδωκεν లోని పూర్వత్వం మరియు దేవుడు ఋణపడి ఉంటాడనే అంతర్భావం
  choice: ‘ముందుగా ఇచ్చినవాడు’ అని పూర్వత్వాన్ని ప్రధాన పాఠ్యంలో నిలపడం
  alternative: ‘ఇచ్చినవాడు’ అని మాత్రమే అనువదించడం
  rationale: ఎవరూ దేవునికంటే ముందుగా ఇచ్చి ఆయనపై తిరిగి చెల్లించే బాధ్యత మోపలేరనే అలంకారిక ప్రశ్న యొక్క బలాన్ని ఇది కాపాడుతుంది; ఆ అంతర్భావాన్ని ప్రధాన పాఠ్యంలో మరింత విస్తరించకుండా వివరణను పాదసూచికలో ఇచ్చింది.
- issue: ἀνταποδοθήσεται యొక్క భవిష్యత్ కర్మణి భావం
  choice: ‘అతనికి అది తిరిగి చెల్లించబడడానికి’ అని కర్మణి భావాన్ని నిలపడం
  alternative: ‘దేవుడు అతనికి తిరిగి చెల్లించవలసి రావడానికి’ అని బాధ్యతను స్పష్టంగా చెప్పడం
  rationale: మూలంలో చెల్లించే కర్తను స్పష్టంగా పేర్కొనలేదు. అందువల్ల కర్తను చేర్చకుండా, దేవుని బాధ్యత అనే సందర్భార్థాన్ని పాదసూచికకు పరిమితం చేసింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన ‘ఆయన’ రూపాన్ని వాడింది. అలంకారిక ప్రశ్నను సహజంగా ఉంచుతూ, మూలంలోని ‘ముందుగా’ అనే కీలక భావాన్నీ కర్మణి నిర్మాణాన్నీ సాధ్యమైనంతవరకు నిలిపింది.
