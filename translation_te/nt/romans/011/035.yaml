    reason: cross_reference
  revision_rationale: The revision replaces the nonfinite ‘చెల్లించబడడానికి’ with the finite future passive ‘చెల్లించబడుతుంది,’ retaining the source's impersonal passive construction and rhetorical-question form. The first pronoun remains reverential (‘ఆయనకు’) for God; the second remains non-reverential (‘అతనికి’) for the hypothetical person who gave first. Footnote a is retained as a lexical alternative but made more focused on the alternate temporal wording.
