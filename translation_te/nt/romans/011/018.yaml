id: ROM.11.18
reference: Romans 11:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: te
  text: ఆ కొమ్మలపై గొప్పలు చెప్పుకోకు[a]. ఒకవేళ నీవు గొప్పలు చెప్పుకుంటే, వేరును మోసేది నీవు కాదు; వేరు నిన్ను మోస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఆ కొమ్మలకు వ్యతిరేకంగా గొప్పలు చెప్పుకోకు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘వేరును నీవు మోయడం లేదు; వేరు నిన్ను మోస్తుంది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: గొప్పలు చెప్పుకోకు / గొప్పలు చెప్పుకుంటే
  rationale: ఈ క్రియ ఇతరులపై లేదా ఇతరులకు వ్యతిరేకంగా తన ఆధిక్యాన్ని గర్వంగా ప్రకటించడాన్ని సూచిస్తుంది. ‘గొప్పలు చెప్పుకోవడం’ ఆధునిక తెలుగులో సహజంగా ఉండి, రెండు ప్రయోగాల్లోనూ ఒకే భావాన్ని నిలుపుతుంది; ‘పై’ అనేది κατά సూచించే సంబంధాన్ని కాపాడుతుంది.
- source_word: τῶν κλάδων
  choice: ఆ కొమ్మలపై
  rationale: సందర్భంలోని ఒలీవ చెట్టు రూపకంలో ఇప్పటికే ప్రస్తావితమైన నిర్దిష్ట కొమ్మలనే సూచించేందుకు ‘ఆ’ వాడబడింది.
- source_word: ῥίζαν / ῥίζα
  choice: వేరు / వేరే
  rationale: రెండు చోట్లా ‘వేరు’ అనే పదాన్ని నిలిపి, మూలం మరియు ఆధారం అనే చెట్టు రూపకాన్ని యథాతథంగా ఉంచింది. రెండో చోట ‘వేరే’ అనేది కర్తపై ఉన్న గ్రీకు ఉద్ఘాటనను తెలియజేస్తుంది.
- source_word: βαστάζεις
  choice: మోస్తున్నది / మోస్తోంది
  rationale: ‘మోయడం’ అనే పదం గ్రీకు క్రియలోని భరించడం, ఆధారమివ్వడం అనే భావాలను చెట్టు రూపకంతో సహా నిలుపుతుంది. ఒకే క్రియను రెండు భాగాల్లో వాడడం ద్వారా ఆధారపడే సంబంధం తారుమారై ఉందనే ఉద్ఘాటన స్పష్టమవుతుంది.
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: వేరును మోస్తున్నది నీవు కాదు; వేరే నిన్ను మోస్తోంది
  rationale: ‘నీవు’ మరియు ‘వేరు’ మధ్య గ్రీకులోని ఉద్ఘాటిత వ్యత్యాసాన్ని, అలాగే ఆధారం ఎవరు ఎవరికి ఇస్తున్నారనే తిరుగుముఖాన్ని ఈ నిర్మాణం కాపాడుతుంది.
- source_word: μὴ
  choice: గొప్పలు చెప్పుకోకు
  rationale: వర్తమాన ఆజ్ఞార్థకంతో వచ్చిన నిషేధాన్ని తెలుగులో సహజమైన ప్రత్యక్ష నిషేధంగా అందిస్తుంది; క్రియాంశం గురించి అవసరానికి మించిన భావాన్ని చేర్చదు.
theological_decisions:
- issue: పౌలు ఉపయోగించిన వేరు–కొమ్మల ఒలీవ చెట్టు రూపకంలోని భావం
  choice: వేరు లేదా కొమ్మలు ఎవరిని సూచిస్తాయో అనువాదంలో వివరించకుండా రూపకాన్ని యథాతథంగా ఉంచడం
  alternative: వేరును పితరులు, అబ్రాహాము లేదా నిబంధన వాగ్దానాలుగా అనువాదంలోనే స్పష్టంగా గుర్తించడం
  rationale: గ్రీకు వాక్యం రూపకాన్ని మాత్రమే చెబుతుంది; వేరు లేదా కొమ్మల నిర్దిష్ట గుర్తింపును ఈ వచనంలో ప్రకటించదు. అనువాదంలో దానిని నిర్ణయించడం వ్యాఖ్యానాన్ని పాఠ్యంలోకి చేర్చి, సందర్భం ఉంచిన వ్యాఖ్యాన విస్తృతిని తగ్గిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా ఉండే శైలి వాడబడింది. ‘గొప్పలు చెప్పుకోవడం’ సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; ‘మోయడం’ మూలపాఠంలోని చెట్టు రూపకాన్నీ, రెండు భాగాల సమాంతరతనూ నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
