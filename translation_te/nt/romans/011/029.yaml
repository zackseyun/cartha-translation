  edition: SBLGNT
  text: ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/029.yaml
  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: te
  text: ఎందుకంటే దేవుని కృపావరాలను, పిలుపును ఆయన వెనక్కి తీసుకోడు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుడు విచారించనివి”; లేదా, “రద్దు చేయనివి.”
    reason: ἀμεταμέλητα అంటే ‘విచారించనిది/విచారించనివి’ లేదా సందర్భానుసారంగా ‘వెనక్కి తీసుకోనిది, రద్దు చేయనిది’ అనే భావం. ప్రధాన పాఠ్యం దేవుని వరాలు, పిలుపు ఉపసంహరించబడవని స్పష్టంగా తెలియజేస్తుంది.
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: వెనక్కి తీసుకోబడవు
  rationale: ఈ విశేషణం ‘పశ్చాత్తాపానికి లేదా విచారానికి గురికానివి’ అనే భావంతో పాటు ‘ఉపసంహరించబడనివి’ అనే భావాన్నీ ఇస్తుంది. దేవుని వరాలు, పిలుపు అనే సందర్భంలో ‘వెనక్కి తీసుకోబడవు’ అనేది సహజమైన ఆధునిక తెలుగులో భావాన్ని స్పష్టంగా తెలియజేస్తుంది; దేవుడు వాటిని మార్చలేడు అనే అతిశయార్థాన్ని కలిగించదు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని లేదా వివరణను పరిచయం చేసే అనుసంధానాన్ని నిలుపుతుంది.
- source_word: τὰ χαρίσματα
  choice: కృపావరాలు
  rationale: χάρισμα అనే పదంలోని కృపతో అనుగ్రహించబడిన వరం అనే భావాన్ని సంక్షిప్తంగా నిలుపుతూ, బహువచనాన్ని కాపాడుతుంది.
- source_word: ἡ κλῆσις
  choice: పిలుపు
  rationale: దేవుని పిలుపు అనే పౌలు వాడుకలోని గంభీరమైన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τοῦ θεοῦ
  choice: దేవుని … ఆయన
  rationale: గ్రీకు షష్ఠీ విభక్తి దేవుణ్ణి కృపావరాలు, పిలుపు రెండింటికీ మూలంగా లేదా సంబంధితునిగా సూచించగలదు. తెలుగులో రెండవ నామవాచకానికి ‘ఆయన’ను చేర్చడం సహజతను ఇస్తూ ఆ సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘దేవుని కృపావరాలు, ఆయన పిలుపు’ అనే మాటల పరిధి
  choice: ఇవి ఇశ్రాయేలుకు మాత్రమే సంబంధించినవా లేక దేవుని కృపాపూర్వకమైన వరాలు, పిలుపు గురించిన విస్తృత సూత్రమా అని అనువాదంలో నిర్దిష్టం చేయకుండా మూలంలోని సాధారణ పదబంధాన్ని నిలుపడం.
  alternative: రోమా 9–11 సందర్భాన్ని బట్టి ఇశ్రాయేలు ఒడంబడిక ఆధిక్యతలు, పిలుపు అని స్పష్టంగా పేర్కొనడం.
  rationale: సమీప సందర్భం ఇశ్రాయేలు గురించి బలంగా మాట్లాడుతున్నప్పటికీ, ఈ వాక్యంలోని గ్రీకు పదబంధం దాని కర్మను ప్రత్యేకంగా మళ్లీ పేర్కొనదు. అందువల్ల అనువాదం వేదాంతపరమైన పరిధిని ముందుగానే నిర్ణయించకూడదు.
- issue: ἀμεταμέλητα యొక్క భావ ఛాయ
  choice: ప్రధాన పాఠ్యంలో ‘వెనక్కి తీసుకోబడవు’ అని, ప్రత్యామ్నాయమైన ‘విచారించడు’ అనే భావాన్ని పాదసూచికలో ఉంచడం.
  alternative: ‘మార్పులేనివి’ లేదా ‘పశ్చాత్తాపం లేనివి’ అని అనువదించడం.
  rationale: ‘మార్పులేనివి’ అనేది మూలపద భావపరిధిని మించి చెప్పవచ్చు; ‘పశ్చాత్తాపం లేనివి’ ఆధునిక తెలుగులో అస్పష్టంగా లేదా తప్పుదోవ పట్టించేలా ఉంటుంది. పాదసూచిక మూలపదంలోని నిజమైన ద్వంద్వ భావసాధ్యతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘కృపావరాలు’ పౌలు వాడే χάρισμα పదంలోని కృపాభావాన్ని నిలుపుతుంది. నిష్క్రియ రూపమైన ‘వెనక్కి తీసుకోబడవు’ మూలంలోని విశేషణాత్మక వాక్యాన్ని సహజంగా వ్యక్తపరుస్తుంది.
