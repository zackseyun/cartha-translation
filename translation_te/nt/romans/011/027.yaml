id: ROM.11.27
reference: Romans 11:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ αὕτη αὐτοῖς ἡ παρ’ ἐμοῦ διαθήκη, ὅταν ἀφέλωμαι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: te
  text: '“నేను వారి పాపాలను తొలగించినప్పుడు,

    వారితో నా నిబంధన ఇదే.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκη
  choice: నిబంధన
  rationale: పౌలు ఉటంకిస్తున్న ప్రవచన సందర్భంలో ఇది వీలునామా అనే అర్థంలో కాక, దేవుని బంధక వాగ్దానాన్ని సూచించే ఒడంబడిక సంబంధ పదం. ఆధునిక తెలుగు బైబిలు వాడుకలో ‘నిబంధన’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: నేను చేసే నిబంధన
  rationale: παρ’ ἐμοῦ నిబంధన దేవుని నుండి ఉద్భవిస్తుందని సూచిస్తుంది. ‘నా నిబంధన’ కూడా సాధ్యమే; అయితే ‘నేను చేసే నిబంధన’ తెలుగు భాషలో మూలాన్ని మరియు సంబంధ చర్యను సహజంగా తెలియజేస్తుంది.
- source_word: αὐτοῖς
  choice: వారితో
  rationale: రూపపరంగా ఇది ‘వారికి’ అనే దత్తివార్థాన్ని అనుమతించినా, నిబంధన సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తపరచడానికి ‘వారితో’ అనుకూలం.
- source_word: ὅταν
  choice: 'అప్పుడు/అప్పుడు అనే కాలసంబంధం: ‘తొలగించినప్పుడు’'
  rationale: ఇక్కడ పదం పునరావృతంగా జరిగే ప్రతిసందర్భాన్ని కాక, వాగ్దానం నెరవేరే కాలాన్ని సూచిస్తుంది. తెలుగు ‘-ినప్పుడు’ నిర్మాణం దానిని సహజంగా తెలియజేస్తుంది.
- source_word: ἀφέλωμαι
  choice: తొలగించినప్పుడు
  rationale: మధ్యప్రయోగ ఏఓరిస్ట్ సబ్జంక్టివ్ రూపం ఇక్కడ దేవుడు పాపాలను తీసివేసే కార్యాన్ని సూచిస్తుంది. ‘తొలగించు’ స్పష్టమైన, సహజమైన ఆధునిక తెలుగు సమానం.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: వారి పాపాలను
  rationale: బహువచనాన్ని మరియు నైతిక-దైవశాస్త్రీయ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: καὶ αὕτη
  choice: ఇదే
  rationale: గ్రీకులో క్రియ లుప్తంగా ఉంది. తెలుగు వాక్యంలో ‘ఇదే’ సహజంగా విధేయ భావాన్ని పూర్తిచేస్తుంది; ప్రవచన సందర్భంలోని భవిష్య భావం ‘తొలగించినప్పుడు’ అనే ఉపవాక్యంతో స్పష్టమవుతుంది.
theological_decisions:
- issue: ప్రవచన వాగ్దాన సందర్భంలో διαθήκη స్వభావం
  choice: నిబంధన
  alternative: వీలునామా; ఒప్పందం
  rationale: ఈ వాక్యం దేవుని విమోచన వాగ్దానానికి సంబంధించిన పాత నిబంధన నేపథ్యాన్ని ప్రతిధ్వనిస్తుంది. ‘నిబంధన’ ఆ అంతర్వచన మరియు దైవశాస్త్రీయ బరువును కాపాడుతుంది; ‘వీలునామా’ ఇక్కడ అనుచితం, ‘ఒప్పందం’ పరస్పర వాణిజ్య ఒప్పుకోలును అధికంగా సూచించవచ్చు.
- issue: ὅταν ἀφέλωμαι యొక్క కాలార్థం
  choice: నేను వారి పాపాలను తొలగించినప్పుడు
  alternative: నేను వారి పాపాలను తొలగించినప్పుడల్లా
  rationale: సందర్భం పునరావృత సాధారణ నియమాన్ని కాక, రక్షణ చరిత్రలో నెరవేరే ప్రవచన వాగ్దానాన్ని సూచిస్తుంది. అనువాదం ఖచ్చితమైన కాలాన్ని అదనంగా నిర్ణయించకుండా ఆ కాలసంబంధాన్ని నిలుపుతుంది.
- issue: παρ’ ἐμοῦ మరియు αὐτοῖς మధ్య సంబంధం
  choice: వారితో నేను చేసే నిబంధన
  alternative: నా నుండి వారికి వచ్చే నిబంధన
  rationale: ఎంచుకున్న రూపం దేవుని ఆరంభకత్వాన్ని మరియు నిబంధన సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది. ప్రత్యామ్నాయం మూలానికి మరింత రూపసామ్యంగా ఉన్నా తెలుగులో అసహజంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే ప్రవచన ఉటంకణకు తగిన గౌరవప్రద శైలి. గ్రీకు పదక్రమానికి దగ్గరగా ఉండేందుకు పాపాల తొలగింపు ఉపవాక్యాన్ని ముందుంచాం; తెలుగు కవితాత్మక/ఉటంకణ శైలిలో ఇది సహజం. ప్రచురణ సందర్భంలో ముందున్న 26వ వచనపు ఉటంకణ ప్రవాహంతో విరామచిహ్నాలను సమన్వయించవచ్చు.
