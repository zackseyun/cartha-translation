id: ROM.11.17
reference: Romans 11:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: te
  text: అయితే, కొమ్మల్లో కొన్ని విరిచివేయబడి, అడవి ఒలీవ చెట్టువైన నీవు వాటి మధ్య అంటుకట్టబడి[a], ఒలీవ చెట్టు సారసమృద్ధిగల వేరులో వాటితో కలిసి సహభాగివయ్యావు[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అడవి ఒలీవ కొమ్మవైన నీవు ఆ కొమ్మల మధ్య అంటుకట్టబడి.”
    reason: ἀγριέλαιοςను సందర్భంలో ‘అడవి ఒలీవ కొమ్మ’గా వ్యక్తపరచవచ్చు; ἐν αὐτοῖς సూచించే కొమ్మలను స్పష్టం చేస్తుంది, అయితే ‘మిగిలి ఉన్న’ అనే అదనపు వివరణను చేర్చదు.
  - marker: b
    text: లేదా, “ఒలీవ చెట్టు వేరు, దాని సారసమృద్ధి రెండింటిలోనూ వాటితో కలిసి సహభాగివయ్యావు.” సంప్రదాయ అనువాదాల్లో ‘సారసమృద్ధి’ స్థానంలో అక్షరార్థానికి దగ్గరగా ‘కొవ్వు’ అని ఉంటుంది.
    reason: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας అనే సాంద్రమైన షష్ఠీ పదబంధం ‘ఒలీవ చెట్టు సారసమృద్ధిగల వేరు’ అనే సంబంధానికీ, ‘వేరు మరియు సారసమృద్ధి’ అనే సంబంధానికీ అవకాశం ఇస్తుంది. πιότης యొక్క సాంప్రదాయ అక్షరార్థాన్ని కూడా నమోదు చేస్తుంది.
lexical_decisions:
- source_word: Εἰ δέ
  choice: అయితే
  rationale: షరతును, స్వల్ప వ్యత్యాసాన్ని ఒకేసారి సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: τινες τῶν κλάδων
  choice: కొమ్మల్లో కొన్ని
  rationale: τινες అనే అనిర్దిష్ట భావాన్నీ, τῶν κλάδων అనే భాగసూచక సంబంధాన్నీ కాపాడుతుంది.
- source_word: ἐξεκλάσθησαν
  choice: విరిచివేయబడి
  rationale: చెట్టు కొమ్మలను తొలగించే రూపకానికి ‘నరికివేయబడి’ కంటే ఇది మరింత దగ్గరగా ఉంది; గ్రీకు కర్మణి రూపాన్ని కూడా నిలుపుతుంది.
- source_word: ἀγριέλαιος ὢν
  choice: అడవి ఒలీవ చెట్టువైన
  rationale: అన్యజనుడు అని వివరణాత్మకంగా మార్చకుండా పౌలు వాడిన ఉద్యాన రూపకాన్నే నిలుపుతుంది. సందర్భానుసారంగా ‘అడవి ఒలీవ కొమ్మ’ అనే భావం సాధ్యమని పాదటిప్పణిలో సూచించబడింది.
- source_word: ἐνεκεντρίσθης ἐν αὐτοῖς
  choice: వాటి మధ్య అంటుకట్టబడి
  rationale: ἐγκεντρίζω అనే ఉద్యానవన సాంకేతిక పదానికి సహజమైన తెలుగు సమానం ‘అంటుకట్టు’; ἐν αὐτοῖς మిగిలి ఉన్న కొమ్మల మధ్య చేర్చబడటాన్ని సూచిస్తుంది.
- source_word: συγκοινωνὸς
  choice: వాటితో కలిసి పాలుపంచుకునేవాడివయ్యావు
  rationale: ఇతరులతో ఉమ్మడిగా భాగం పొందే భావాన్ని స్పష్టంగా తెలియజేస్తూ ἐγένου సూచించే కొత్త స్థితిలోకి రావడాన్ని కూడా వ్యక్తం చేస్తుంది.
- source_word: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας
  choice: ఒలీవ చెట్టు వేరులో, దాని సారసమృద్ధిలో
  rationale: వరుసగా వచ్చిన గ్రీకు షష్ఠీ విభక్తి పదాల సాంద్రతను పూర్తిగా ఒకే విశేషణ పదబంధంగా మార్చకుండా, వేరు మరియు పోషక సమృద్ధి మధ్యనున్న సంబంధాన్ని ఉద్దేశపూర్వకంగా తెరిచి ఉంచుతుంది.
theological_decisions:
- issue: ἀγριέλαιος రూపకంలోని వ్యక్తి గుర్తింపు
  choice: ‘అడవి ఒలీవ చెట్టు’ అనే రూపకాన్నే ఉంచడం
  alternative: ‘అన్యజనుడు’ అని నేరుగా అర్థవివరణ చేయడం; లేదా ‘అడవి ఒలీవ కొమ్మ’ అని సందర్భానుసారంగా స్పష్టం చేయడం
  rationale: పౌలు ఇశ్రాయేలు మరియు జనాంగాల సంబంధాన్ని ఒలీవ చెట్టు రూపకం ద్వారా వివరిస్తున్నాడు. అనువాదం ఆ రూపకాన్ని సిద్ధాంతపరమైన వివరణతో భర్తీ చేయకూడదు.
- issue: వేరు మరియు సారసమృద్ధి మధ్య వ్యాకరణ సంబంధం
  choice: ‘వేరులో, దాని సారసమృద్ధిలో’ అని రెండు భావాలనూ దగ్గరగా ఉంచి సంబంధాన్ని పూర్తిగా నిర్ధారించకుండా అనువదించడం
  alternative: ‘ఒలీవ చెట్టు యొక్క సారవంతమైన వేరులో’; లేదా ‘వేరులోను సారసమృద్ధిలోను’
  rationale: గ్రీకులోని వరుస షష్ఠీ రూపాలు ‘సారవంతమైన వేరు’ అనే భావానికీ, ‘వేరు మరియు సారసమృద్ధి’ అనే సమన్వయ భావానికీ అవకాశం ఇస్తాయి. ప్రధాన పాఠం ఈ ఉద్రిక్తతను నిలుపుతుంది; ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ఒలీవ,’ ‘అంటుకట్టు,’ ‘సారసమృద్ధి’ అనే పదాలు ఉద్యాన రూపకాన్ని స్పష్టంగా ఉంచుతాయి. గ్రీకు వాక్యం తరువాతి వచనంలో కొనసాగుతున్నందున చివర దీర్ఘ విరామచిహ్నం ఉంచబడింది.
