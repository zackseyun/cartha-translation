id: ROM.13.4
reference: Romans 13:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: te
  text: ఎందుకంటే ఆ అధికారం నీ మేలు కోసం దేవుని సేవకునిగా పనిచేస్తుంది. అయితే నీవు చెడు చేస్తే భయపడు; అది ఖడ్గాన్ని ఊరికే ధరించదు[a]. ఎందుకంటే అది దేవుని సేవకునిగా, చెడు చేసేవానిపై ఆగ్రహాన్ని తెచ్చే ప్రతీకారం తీర్చేవానిగా పనిచేస్తుంది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఖడ్గాన్ని వ్యర్థంగా ధరించదు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “చెడు చేసేవానిపై ఆగ్రహాన్ని అమలు చేసేవానిగా.”
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονός
  choice: సేవకుడు
  rationale: దేవుని ఆదేశాన్ని అమలు చేసే ప్రతినిధి అనే భావాన్ని నిలుపుతుంది; సంఘపరమైన ప్రత్యేక పదవిని సూచించే పదాన్ని నివారిస్తుంది.
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: నీ మేలు కోసం
  rationale: దత్తివాచకమైన σοὶ మరియు ప్రయోజనాన్ని తెలిపే εἰς τὸ ἀγαθόν రెండింటినీ సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ κακὸν ποιῇς
  choice: నీవు చెడు చేస్తే
  rationale: నైతికంగా చెడ్డ కార్యాన్ని సూచించే గ్రీకు భావాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది.
- source_word: φοβοῦ
  choice: భయపడు
  rationale: హెచ్చరిక రూపంలోని ఆజ్ఞార్థక బలాన్ని నేరుగా నిలుపుతుంది.
- source_word: εἰκῇ
  choice: ఊరికే
  rationale: ‘వ్యర్థంగా’ లేదా ‘ఏ ప్రయోజనమూ లేకుండా’ అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μάχαιραν φορεῖ
  choice: ఖడ్గాన్ని ... ధరించదు
  rationale: ఖడ్గం అనే స్పష్టమైన రూపకాన్ని, దాన్ని అధికార సూచకంగా మోసే భావాన్ని కాపాడుతుంది.
- source_word: ἔκδικος
  choice: ప్రతీకారం తీర్చేవాడు
  rationale: న్యాయపరమైన ప్రతిఫలం లేదా శిక్షను అమలు చేసే వ్యక్తి అనే పునఃప్రతికార భావాన్ని నిలుపుతుంది.
- source_word: εἰς ὀργὴν
  choice: ఆగ్రహంతో
  rationale: ఆగ్రహానికి సంబంధించిన శిక్షాత్మక కార్యాన్ని తెలిపినా, అది స్పష్టంగా ఎవరి ఆగ్రహమో వాక్యంలో చేర్చదు.
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: చెడు చేసేవానిపై
  rationale: చెడు ప్రవర్తనలో నిమగ్నమైన వ్యక్తిపై చర్య దిశను సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: అధికారం అమలు చేసే శిక్షకు దేవుని ఆగ్రహంతో ఉన్న సంబంధం
  choice: ‘చెడు చేసేవానిపై ఆగ్రహంతో ప్రతీకారం తీర్చేవాడు’ అని అనువదించడం
  alternative: ‘చెడు చేసేవానిపై ఆగ్రహాన్ని అమలు చేసేవాడు’
  rationale: గ్రీకులో ‘దేవుని ఆగ్రహం’ అని స్పష్టంగా లేకపోవడంతో ఆ మాటను ప్రధాన పాఠ్యంలో చేర్చలేదు. అదే సమయంలో అధికారం దేవుని సేవకుడిగా శిక్షాత్మక పాత్ర పోషిస్తుందనే సందర్భ సంబంధాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకుడికి అర్థమయ్యే శైలి. ‘ఖడ్గం’ అనే మూల రూపకాన్ని అలాగే ఉంచి, ‘ఊరికే’ ద్వారా εἰκῇని సహజంగా వ్యక్తం చేశాం. ‘అది ... సేవకుడు’లో తెలుగు వ్యాకరణ లింగ అసమతుల్యత స్వల్పంగా ఉన్నా, మునుపటి వచనంలోని పాలక అధికారాన్ని సూచించే ‘అది’తో అనుసంధానాన్ని మరియు διάκονος యొక్క వ్యక్తి/ప్రతినిధి రూపకాన్ని కాపాడేందుకు ఈ నిర్మాణం ఎంచుకున్నాం.
