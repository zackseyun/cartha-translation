id: ROM.13.8
reference: Romans 13:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: te
  text: ఒకరినొకరు ప్రేమించాలనే బాధ్యత తప్ప, ఎవరికీ ఏమీ బాకీ ఉండకండి; ఎందుకంటే ఇతరుణ్ణి[a] ప్రేమించేవాడు ధర్మశాస్త్రాన్ని నెరవేర్చాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మరొక వ్యక్తిని.” గ్రీకులో, “ఇతరుణ్ణి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: ఎవరికీ ఏమీ బాకీ ఉండకండి
  rationale: జంట నిషేధ పదాల సమగ్ర భావాన్ని నిలుపుతూ, ὀφείλετε లోని బాకీ/బాధ్యత రూపకాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν
  choice: అయితే ఒకరినొకరు ప్రేమించవలసిన బాకీ మాత్రం ఉండనే ఉంటుంది
  rationale: εἰ μὴ తెలిపే ఏకైక మినహాయింపును స్పష్టంగా ఉంచి, substantival infinitive సూచించే నిరంతర ప్రేమబాధ్యతను ముందు వాక్యంలోని బాకీ రూపకంతో అనుసంధానిస్తుంది.
- source_word: ἀγαπᾶν / ἀγαπῶν
  choice: ప్రేమించవలసిన / ప్రేమించేవాడు
  rationale: ἀγαπάω యొక్క సాధారణమైన, వేదాంతపరంగా ప్రతిధ్వనించే అర్థాన్ని స్థిరంగా నిలుపుతుంది.
- source_word: τὸν ἕτερον
  choice: ఇతరుణ్ణి
  rationale: గ్రీకు పదబంధంలోని ‘the other’ భావాన్ని నేరుగా నిలుపుతుంది; మూలంలో లేని ‘పొరుగువాడు’ అనే పదాన్ని చేర్చదు.
- source_word: νόμον
  choice: ధర్మశాస్త్రాన్ని
  rationale: ఈ పౌలు సందర్భంలో మోషే ధర్మశాస్త్రాన్ని సూచించే స్థిర తెలుగు బైబిల్ పదప్రయోగం; సాధారణ ‘చట్టం’ కంటే ఉద్దేశిత సూచనను మెరుగ్గా తెలియజేస్తుంది.
- source_word: πεπλήρωκεν
  choice: నెరవేర్చాడు
  rationale: పరిపూర్ణ కాలంలోని పూర్తయి ఫలితం నిలిచియున్న భావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: బాకీపై పౌలు చేసిన నిషేధం యొక్క పరిధి
  choice: బాకీ ఉండవద్దనే మాటను నేరుగా అనువదిస్తూ, ప్రేమను మాత్రం నిరంతర బాకీగా ఉంచడం
  alternative: అన్ని రకాల అప్పు తీసుకోవడంపై సంపూర్ణ నిషేధంగా చేయడం; లేదా కేవలం నైతిక బాధ్యతకు రూపకంగా పరిమితం చేయడం
  rationale: గ్రీకు వాక్యం బాకీని స్పష్టంగా ప్రస్తావించి ప్రేమను మినహాయింపుగా ఉంచుతుంది; అనువాదం అప్పులు లేదా రుణాలపై విస్తృత నైతిక వివాదాన్ని తానే పరిష్కరించకూడదు.
- issue: τὸν ἕτερον యొక్క పరిధి
  choice: ఇతరుణ్ణి
  alternative: మరొక వ్యక్తిని; పొరుగువాణ్ణి
  rationale: మూలంలోని స్వల్ప అస్పష్టతను కాపాడుతుంది; తరువాతి సందర్భం ఆధారంగా ‘పొరుగువాడు’ అని ముందుగానే నిర్దిష్టం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. ‘బాకీ’ అనే పదాన్ని పునరుక్తి చేసి మూలంలోని ఆర్థిక/బాధ్యత రూపకాన్ని నిలిపాం. పాదసూచిక గుర్తును సంబంధిత ‘ఇతరుణ్ణి’ పదానికి బదులుగా వాక్యాంతంలో ఉంచడం వల్ల అది ఏ పదాన్ని వివరిస్తుందో కొంత అస్పష్టమవుతుంది; ప్రచురణ పాఠ్యంలో గుర్తు ‘ఇతరుణ్ణి[a]’ వెంట ఉండటం ఉత్తమం.
