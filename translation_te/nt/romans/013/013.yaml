id: ROM.13.13
reference: Romans 13:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: te
  text: పగటిపూటలాగా మనం మర్యాదగా[a] నడుచుకుందాం. అల్లరి విందుల్లోను మద్యమత్తులోను కాదు; లైంగిక దుర్నడతలోను విచ్చలవిడితనంలోను కాదు; కలహంలోను అసూయలోను[b] కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “గౌరవప్రదంగా” లేదా “తగిన విధంగా.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ఈర్ష్యలోను.” ఈ సందర్భంలో గ్రీకు పదానికి ప్రతికూలమైన అసూయ లేదా ఈర్ష్య అనే భావం ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: పగటిపూట ఉన్నట్టుగా
  rationale: చుట్టుపక్కల వచనాల్లోని రాత్రి–పగలు రూపకాన్ని నిలుపుతూ, వెలుగులో ఉన్నవారికి తగిన ప్రవర్తన అనే భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εὐσχημόνως
  choice: మర్యాదగా
  rationale: గౌరవప్రదంగా, తగిన రీతిలో ప్రవర్తించడం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: περιπατήσωμεν
  choice: మనం ... నడుచుకుందాం
  rationale: జీవన విధానానికి సూచనగా పౌలు వాడే ‘నడవడం’ రూపకాన్ని, అలాగే ప్రథమ పురుష బహువచన ప్రోత్సాహక భావాన్ని నిలుపుతుంది.
- source_word: κώμοις
  choice: అల్లరి విందుల్లోను
  rationale: మద్యపానం తరచుగా తోడయ్యే అదుపులేని సామూహిక విందు వినోదాలను సూచిస్తుంది; ఆధునిక పాఠకుడు దీనిని కేవలం లైంగిక అర్థంలో గ్రహించకుండా విస్తృత భావాన్ని కాపాడుతుంది.
- source_word: μέθαις
  choice: మద్యమత్తులోను
  rationale: మద్యం వల్ల కలిగే మత్తు లేదా మత్తులో మునిగే అలవాటును స్పష్టంగా, సంక్షిప్తంగా తెలుపుతుంది.
- source_word: κοίταις
  choice: లైంగిక దుర్నడతలోను
  rationale: అక్షరార్థం ‘పడకలు’ అయినా, ఇక్కడ అక్రమమైన లైంగిక ప్రవర్తనను సూచించే ప్రయోగం; అక్షరానువాదం తెలుగులో భావాన్ని మరుగుపరుస్తుంది.
- source_word: ἀσελγείαις
  choice: విచ్చలవిడితనంలోను
  rationale: సిగ్గులేని, అదుపులేని ప్రవర్తన అనే విస్తృత ప్రతికూల భావాన్ని నిలుపుతుంది; దానిని కేవలం లైంగిక పాపానికే పరిమితం చేయదు.
- source_word: ἔριδι
  choice: కలహంలోను
  rationale: వివాదం, పోటీతో కూడిన విభేదం అనే భావాన్ని నీతి-దోషాల జాబితాకు సరిపోయే సంక్షిప్త పదంతో తెలియజేస్తుంది.
- source_word: ζήλῳ
  choice: అసూయలోను
  rationale: ఈ దోషాల జాబితాలో పదానికి ప్రతికూల భావం ఉంది; ‘అసూయ’ కలహంతో సహజంగా జతకట్టి jealousy/envy రెండింటి పరిధినీ కొంతవరకు అందిస్తుంది.
theological_decisions:
- issue: పగలు–రాత్రి నైతిక రూపకం
  choice: ‘పగటిపూట ఉన్నట్టుగా’ అని రూపకాన్ని నేరుగా నిలిపాం.
  alternative: ‘వెలుగులో జీవించేవారిలా’ అని వివరణాత్మకంగా అనువదించడం.
  rationale: మూలవచనం పగలు అనే చిత్రాన్ని ఇస్తుంది; దానికి మించిన ఆధ్యాత్మిక వివరణను అనువాదంలో చేర్చకుండా, సందర్భంలోని నైతిక ఉద్రిక్తతను పాఠకుడికి వదిలివేస్తుంది.
- issue: κοίταις లోని లైంగిక సూచన
  choice: అక్షరార్థమైన ‘పడకలు’కు బదులుగా ‘లైంగిక దుర్నడత’ అని భావానువాదం చేశాం.
  alternative: ‘పడకల్లో’ లేదా ‘అక్రమ సంబంధాల్లో’ అని అనువదించడం.
  rationale: తెలుగులో ‘పడకలు’ మాత్రమే అంటే గ్రీకు జాతీయ ప్రయోగంలోని నైతిక, లైంగిక భావం అస్పష్టమవుతుంది; ‘అక్రమ సంబంధాలు’ అనడం మాత్రం పరిధిని సంబంధాలకు మాత్రమే అనవసరంగా కుదించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని వాడాం. గ్రీకులోని మూడు ‘కాదు’ జతలను అర్ధవిరామాలతో సమాంతరంగా ఉంచి దోషాల జాబితా లయను కాపాడాం; ‘నడుచుకుందాం’ ద్వారా పౌలు వాడిన జీవన-నడక రూపకాన్ని నిలిపాం.
