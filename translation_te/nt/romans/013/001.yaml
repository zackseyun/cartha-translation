id: ROM.13.1
reference: Romans 13:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: te
  text: ప్రతి వ్యక్తి పరిపాలించే అధికారాలకు[a] లోబడి ఉండాలి. ఎందుకంటే దేవుని నుండి కాకుండా ఏ అధికారమూ లేదు; ఉన్న అధికారాలు దేవునిచేత నియమించబడి ఉన్నాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘ఉన్నత అధికారాలకు,’ ‘పై అధికారాలకు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘దేవునిచేత ఏర్పాటు చేయబడి ఉన్నాయి,’ ‘దేవునిచేత క్రమపరచబడి ఉన్నాయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: ప్రతి వ్యక్తి
  rationale: అక్షరార్థంగా ‘ప్రతి ప్రాణం’ అయినప్పటికీ, కొయినే గ్రీకులో ఇది సహజంగా ప్రతి మనిషిని సూచిస్తుంది. ‘ప్రతి వ్యక్తి’ అనేది పంపిణీ భావాన్ని నిలుపుతూ ఆధునిక తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: పరిపాలించే అధికారాలకు
  rationale: ἐξουσίαις అనేది అధికార స్థానాలను సూచిస్తుంది; ὑπερεχούσαις అక్షరార్థంగా ‘పైన ఉన్న’ అనే భావమున్నా, ఇక్కడ పౌర పరిపాలనా సందర్భంలో వాటి పాలనా పాత్రను సూచిస్తుంది. ‘పరిపాలించే అధికారాలు’ సహజంగా, స్పష్టంగా ఉంది.
- source_word: ὑποτασσέσθω
  choice: లోబడి ఉండాలి
  rationale: వర్తమాన ఆజ్ఞారూపం క్రమబద్ధమైన ఆధీనతను కోరుతుంది. ‘లోబడి ఉండాలి’ అనేది గ్రీకు క్రియలోని భావాన్ని అతిశయింపకుండా సహజ తెలుగులో అందిస్తుంది.
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: ఎందుకంటే దేవుని నుండి కాకుండా ఏ అధికారమూ లేదు
  rationale: ఈ నిర్మాణంలో ὑπὸ θεοῦ అధికారానికి అంతిమ మూలం దేవుడని తెలుపుతుంది. ‘దేవుని నుండి’ మూలం అనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αἱ δὲ οὖσαι
  choice: ప్రస్తుతం ఉన్న అధికారాలు
  rationale: స్త్రీలింగ బహువచన కృదంతం ముందున్న ‘అధికారాలు’ అనే పదాన్నే తిరిగి సూచిస్తుంది. ‘ప్రస్తుతం ఉన్న’ అనేది ఉనికిలో ఉన్న వాస్తవ అధికార వ్యవస్థలను స్పష్టంగా సూచిస్తుంది.
- source_word: τεταγμέναι
  choice: నియమించబడి ఉన్నాయి
  rationale: τάσσω యొక్క పరిపూర్ణ కర్మణి రూపం దేవుని ఏర్పాటు వల్ల ఏర్పడిన కొనసాగుతున్న స్థితిని సూచిస్తుంది. ‘నియమించబడి ఉన్నాయి’ నియామకం/క్రమపరచడం అనే భావాన్ని నిలుపుతుంది; ‘స్థాపించబడ్డాయి’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
theological_decisions:
- issue: పౌర అధికారాలు మరియు దేవుని మధ్య సంబంధం గురించి పౌలు చెప్పిన మాటల పరిధి
  choice: పరిపాలనా అధికారానికి మూలం దేవుడని, ప్రస్తుతం ఉన్న అధికారాలు దేవునిచేత నియమించబడిన స్థితిలో ఉన్నాయని వాక్యం చెప్పేంతవరకే అనువదించడం
  alternative: ప్రతి పాలక వ్యవస్థనూ, దాని ప్రతి చర్యనూ దేవుడు నైతికంగా ఆమోదిస్తున్నాడని విస్తరించడం; లేదా వాస్తవ అధికారులను కాక అధికారమనే సూత్రాన్ని మాత్రమే ఉద్దేశించిందని పరిమితం చేయడం
  rationale: గ్రీకు వాక్యం వాస్తవంగా ఉన్న అధికారాలను సూచించి అవి దేవునిచేత τεταγμέναι అని చెబుతుంది. అనువాదం ఈ దైవిక క్రమనియామకాన్ని నిలుపుతుంది; అయితే ప్రతి ప్రభుత్వ చర్యకు దైవిక నైతిక ఆమోదం ఉందనే అదనపు నిర్ణయాన్ని చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘పరిపాలించే అధికారాలు’ పౌర సందర్భాన్ని స్పష్టం చేస్తుంది. గ్రీకు పరిపూర్ణ కర్మణి భావాన్ని ‘నియమించబడి ఉన్నాయి’ ద్వారా కొనసాగుతున్న స్థితిగా చూపించాం. ప్రధాన పాఠంలోని [a], [b] గుర్తులు సంబంధిత పాదటిప్పణులతో సరిపోలుతున్నాయి.
