id: ROM.13.11
reference: Romans 13:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: te
  text: 'అంతేకాక, మీరు కాలాన్ని తెలుసుకొని ఇలా చేయండి: ఇప్పటికే మీరు[a] నిద్రనుండి మేల్కొనవలసిన సమయం అయింది. ఎందుకంటే మనం విశ్వసించినప్పటి కంటే[b] ఇప్పుడు మన రక్షణ మరింత సమీపంగా ఉంది.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో ‘మీరు’కు బదులుగా ‘మనం’ అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా, ‘మనం మొదట విశ్వసించినప్పటి కంటే.’ గ్రీకులో కేవలం ‘మనం విశ్వసించినప్పుడు’ అని మాత్రమే ఉంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: అంతేకాక ... ఇలా చేయండి
  rationale: τοῦτο ముందున్న నైతిక ఉపదేశాలను సూచిస్తుంది. తెలుగులో కేవలం ‘ఇదియు’ అనడం అసహజంగా ఉండేందున, సందర్భంలో అంతర్లీనంగా ఉన్న ఆజ్ఞార్థాన్ని ‘ఇలా చేయండి’ అని స్పష్టం చేసింది.
- source_word: εἰδότες τὸν καιρόν
  choice: మీరు ఈ కాలాన్ని ఎరిగి
  rationale: εἰδότες అనే కృదంత నిర్మాణాన్ని నిలుపుతూ, καιρός సూచించే నిర్ణాయకమైన ప్రస్తుత కాలభావాన్ని ‘ఈ కాలం’ తెలియజేస్తుంది.
- source_word: ὅτι ὥρα ἤδη ὑμᾶς
  choice: మీరు ... వలసిన ఘడియ ఇప్పటికే వచ్చింది
  rationale: ὥρα యొక్క గంభీరమైన అత్యవసర భావాన్ని ‘ఘడియ’తో, ἤδη యొక్క వర్తమాన ఆవశ్యకతను ‘ఇప్పటికే’తో వ్యక్తం చేసింది. ప్రధాన పాఠంలోని బహువచన ద్వితీయ పురుషమైన ὑμᾶςను ‘మీరు’గా అనువదించింది.
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: నిద్రనుండి మేలుకోవలసిన
  rationale: నైతిక-ఆత్మీయ మేల్కొలుపు రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలిపింది; కర్మణి భావాన్ని అనవసరంగా బలపరచలేదు.
- source_word: νῦν γὰρ ἐγγύτερον
  choice: ఎందుకంటే ... ఇప్పుడు ... మరింత సమీపంగా ఉంది
  rationale: γάρ ఇచ్చే కారణ సంబంధాన్ని ‘ఎందుకంటే’తో స్పష్టం చేసి, νῦν మరియు తులనాత్మకమైన ἐγγύτερον రెండింటినీ నిలిపింది.
- source_word: ἡ σωτηρία
  choice: మన రక్షణ
  rationale: సందర్భం ద్వారా లభించే ‘మన’ అనే సంబంధాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, ఇంకా సమీపిస్తున్న రక్షణ అనే పౌలు భావంలోని ఉద్రిక్తతను వివరణతో కుదించలేదు.
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: మనం విశ్వసించినప్పటికంటే
  rationale: గ్రీకు పాఠంలో ‘మొదట’ లేదు కాబట్టి దానిని ప్రధాన వాక్యంలో చేర్చకుండా, ἐπιστεύσαμεν యొక్క సరళ క్రియార్థాన్ని నిలిపింది.
theological_decisions:
- issue: విశ్వసించిన సమయంకంటే ఇప్పుడు ‘రక్షణ’ సమీపంగా ఉండటం
  choice: ‘మన రక్షణ’ అని మాత్రమే ఉంచి, దాని భావాన్ని ఒక నిర్దిష్ట సిద్ధాంత దశకు పరిమితం చేయలేదు.
  alternative: ‘మన అంతిమ రక్షణ’ లేదా ‘ప్రభువు రాకడలో కలిగే విమోచన’
  rationale: పాఠం రక్షణను విశ్వాసులకు ఇప్పటికే చెందినదిగా (‘మన’) కూడా, ఇంకా సమీపిస్తున్నదిగా కూడా చెబుతుంది. ఈ ఇప్పటికే/ఇంకా కాదు అనే ఉద్రిక్తతను అనువాదం కాపాడాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన ఉపదేశ శైలిని అనుసరించింది. ‘ఘడియ’, ‘మేలుకోవడం’, ‘రక్షణ’ అనే పదాలు మూలంలోని అత్యవసరత, రూపకం, భవిష్యదభిముఖ ఉద్రిక్తతలను నిలుపుతాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠంలో చేర్చబడ్డాయి.
