id: ROM.13.9
reference: Romans 13:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: te
  text: ఎందుకంటే, “వ్యభిచారం చేయకూడదు; హత్య చేయకూడదు; దొంగతనం చేయకూడదు; దురాశపడకూడదు” అనే ఆజ్ఞలూ, ఇంకా ఏ ఇతర ఆజ్ఞ ఉన్నా, అవన్నీ “నిన్ను నీవు ప్రేమించుకున్నట్లే నీ పొరుగువానిని ప్రేమించాలి” అనే ఈ మాటలో[a] సంగ్రహించబడ్డాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఈ వాక్యంలో.” ఇక్కడి గ్రీకు పదానికి సందర్భానుసారంగా ‘మాట,’ ‘వాక్యం,’ లేదా ‘సూక్తి’ అనే అర్థాలు రావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: ఎందుకంటే
  rationale: γάρ యొక్క వివరణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపిస్తుంది; τὸ తరువాత వచ్చే ఆజ్ఞల విషయాన్ని సూచిస్తుంది.
- source_word: μοιχεύσεις
  choice: వ్యభిచారం చేయకూడదు
  rationale: దశాజ్ఞల ఉల్లేఖనంలోని భవిష్యత్ సూచక రూపం ఆజ్ఞార్థకంగా పనిచేస్తుంది; తెలుగు నిషేధ ఆజ్ఞకు సహజమైన రూపం.
- source_word: φονεύσεις
  choice: హత్య చేయకూడదు
  rationale: φονεύω సాధారణంగా ప్రాణం తీయడమంతటినీ కాక, హత్యను సూచిస్తుంది; అందువల్ల ‘చంపకూడదు’ కంటే ఇది కచ్చితమైనది.
- source_word: κλέψεις
  choice: దొంగతనం చేయకూడదు
  rationale: దశాజ్ఞల నిషేధ ఆజ్ఞను స్పష్టమైన, సాధారణ తెలుగులో అందిస్తుంది.
- source_word: ἐπιθυμήσεις
  choice: ఇతరులదానిని ఆశించకూడదు
  rationale: దశాజ్ఞల సందర్భంలో ἐπιθυμέω ఇతరులకు చెందినదాన్ని స్వంతం చేసుకోవాలనే దురాశను సూచిస్తుంది; కేవలం ‘కోరకూడదు’ అనడం కంటే ఈ భావం స్పష్టంగా ఉంటుంది.
- source_word: εἴ τις ἑτέρα ἐντολή
  choice: ఇంకా వేరే ఏ ఆజ్ఞ ఉన్నా
  rationale: τις యొక్క అనిర్దిష్టతను, ἑτέρα యొక్క ‘వేరే’ భావాన్ని సహజంగా నిలుపుతుంది.
- source_word: ἀνακεφαλαιοῦται
  choice: అవన్నీ సంక్షిప్తంగా ఇమిడి ఉన్నాయి
  rationale: ఆజ్ఞలను ఒకే ప్రధాన వాక్యంలో సమగ్రంగా చేర్చడం అనే క్రియ భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: ఈ మాటలో
  rationale: λόγος ఇక్కడ ఒక పదాన్ని మాత్రమే కాక, తరువాత వచ్చే వాక్యాన్ని సూచిస్తుంది; ‘మాట’ మూలపద విస్తృతిని నిలుపుతుంది.
- source_word: Ἀγαπήσεις
  choice: ప్రేమించాలి
  rationale: లేవీయకాండపు ఉల్లేఖనంలోని ఆజ్ఞార్థక శక్తిని ఆధునిక తెలుగు విధ్యర్థక రూపంలో సహజంగా తెలియజేస్తుంది.
- source_word: πλησίον
  choice: పొరుగువానిని
  rationale: లేవీయకాండంతో ఉన్న అంతర్‌పాఠ్య సంబంధాన్ని నిలుపుతూ πλησίονకు సంప్రదాయబద్ధమైన, అర్థవంతమైన సమానార్థకం.
- source_word: ὡς σεαυτόν
  choice: నిన్ను నీవు ప్రేమించుకున్నట్లే
  rationale: గ్రీకులో సంక్షిప్తంగా ఉన్న పోలికను తెలుగులో అపార్థం లేకుండా సహజంగా వ్యక్తం చేయడానికి క్రియను సందర్భానుసారంగా పూరిస్తుంది.
theological_decisions:
- issue: దశాజ్ఞల నిషేధాల రూపం
  choice: ‘చేయకూడదు’ అనే తెలుగు నిషేధ ఆజ్ఞారూపం
  alternative: ‘చేయవద్దు’ అనే ప్రత్యక్ష ఆజ్ఞారూపం
  rationale: గ్రీకు భవిష్యత్ సూచక రూపం ఇక్కడ ఆజ్ఞార్థకంగా ఉంది. ‘చేయకూడదు’ శాస్త్రోక్త ఆజ్ఞ స్వరాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- issue: λόγος యొక్క పరిధి
  choice: ‘మాట’—సంగ్రహించే వాక్యం లేదా సూక్తి
  alternative: ‘వాక్యం’ లేదా ‘ప్రకటన’
  rationale: పౌలు ఒకే పదాన్ని కాక తరువాతి శాస్త్రవాక్య సూత్రాన్ని సూచిస్తున్నాడు. ప్రధాన పాఠంలో ‘మాట’ మూలంలోని విస్తృతిని నిలుపుతుంది; పాదసూచిక ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
- issue: ἀνακεφαλαιοῦται యొక్క భావం
  choice: ఇతర ఆజ్ఞలన్నీ ప్రేమ ఆజ్ఞలో సంక్షిప్తంగా ఇమిడి ఉన్నాయని చెప్పడం
  alternative: ఇతర ఆజ్ఞలు ప్రేమ ఆజ్ఞ చేత రద్దయ్యాయని అర్థం వచ్చే రూపం
  rationale: క్రియ సమగ్రంగా కూడదీయడం లేదా ఒక శీర్షిక కింద సంగ్రహించడం అనే భావాన్ని ఇస్తుంది; ఆజ్ఞలు రద్దయ్యాయని మూలపాఠం చెప్పదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే శైలి. దశాజ్ఞలు మరియు లేవీయకాండపు ఉల్లేఖనాల ఆజ్ఞ స్వరం నిలుపబడింది. ‘హత్య’ ద్వారా అక్రమంగా ప్రాణం తీయడం అనే కచ్చితమైన భావం వ్యక్తమైంది.
