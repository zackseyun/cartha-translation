id: ROM.13.3
reference: Romans 13:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: te
  text: ఎందుకంటే పాలకులు మంచి పనికి భయకారణం కారు, చెడు పనికే భయకారణం. అధికారానికి భయపడకుండా ఉండాలని కోరుకుంటున్నావా?[a] మంచిది చేయి; అప్పుడు దాని నుండి నీకు ప్రశంస లభిస్తుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అధికారానికి భయపడకూడదని కోరుతున్నావా?”
    reason: గ్రీకు ప్రశ్నలో θέλεις + μήతో కూడిన క్రియారూపాన్ని తెలుగులో మరో విధంగా వ్యక్తం చేయవచ్చు.
  - marker: b
    text: అంటే, ఆ పరిపాలనా అధికారం నుండి.
    reason: “దాని” అనే సర్వనామం అధికారాన్ని సూచిస్తుందని స్పష్టం చేస్తుంది.
lexical_decisions:
- source_word: ἄρχοντες
  choice: పాలకులు
  rationale: పరిపాలించే పదవిలో ఉన్నవారిని సూచించే సాధారణమైన, సహజమైన రాజకీయ పదం.
- source_word: φόβος
  choice: భయకారణం
  rationale: పాలకులు భయానికి కారణమయ్యే లేదా భయపడవలసిన వారనే విధేయార్థాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῷ ἀγαθῷ ἔργῳ
  choice: మంచి పనికి
  rationale: ఏకవచన రూపాన్ని నిలుపుతూ, సాధారణ నైతిక ప్రవర్తనను సూచించే గ్రీకు ప్రయోగాన్ని ప్రతిబింబిస్తుంది.
- source_word: τῷ κακῷ
  choice: చెడు పనికే
  rationale: ముందున్న ἔργῳ భావాన్ని తెలుగులో స్పష్టంగా పూరిస్తూ మంచి–చెడు వ్యత్యాసాన్ని నిలుపుతుంది; ‘కే’ వ్యతిరేకతను తెలియజేస్తుంది.
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: భయపడకుండా ఉండాలని కోరుకుంటున్నావా?
  rationale: θέλεις మరియు నిషేధార్థక infinitive నిర్మాణాన్ని షరతుగా మార్చకుండా అలంకారిక ప్రశ్నగా సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὴν ἐξουσίαν
  choice: అధికారానికి
  rationale: నిర్దిష్టమైన పరిపాలనా అధికారాన్ని సంస్థాగత భావంలో సూచిస్తుంది; తెలుగు విభక్తి ‘భయపడు’తో సహజంగా సరిపోతుంది.
- source_word: τὸ ἀγαθὸν ποίει
  choice: మంచిది చేయి
  rationale: నామవాచకంగా వాడిన ‘మంచి’ అనే విస్తృత నైతిక వర్గాన్ని, విడివిడి సత్కార్యాలకు మాత్రమే పరిమితం చేయకుండా ఉంచుతుంది.
- source_word: ἕξεις ἔπαινον
  choice: నీకు ప్రశంస లభిస్తుంది
  rationale: పదశః ‘ప్రశంస కలిగి ఉంటావు’ కంటే సహజమైన ఆధునిక తెలుగు; భవిష్యత్ ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐξ αὐτῆς
  choice: దాని నుండి
  rationale: స్త్రీలింగ సర్వనామం ἐξουσίαను సూచిస్తుంది; తెలుగులో నిర్జీవ సంస్థకు ‘దాని’ సహజంగా ఉంటుంది.
theological_decisions:
- issue: పాలకులు మంచి పనిని ప్రశంసిస్తారనే వాక్యపు పరిధి
  choice: పరిపాలనా అధికారపు సాధారణ లేదా ఉద్దేశిత కార్యాన్ని వచనం చెప్పినట్లుగానే అనువదించడం
  alternative: ప్రతి పాలకుడు అన్ని సందర్భాల్లోనూ మంచిని ప్రశంసిస్తాడనే మినహాయింపులేని సార్వత్రిక సిద్ధాంతంగా విస్తరించడం; లేదా వ్యంగ్యార్థాన్ని చేర్చడం
  rationale: మూలపాఠం సూటిగా చెప్పిన వాక్యాన్ని నిలుపుతూ, అది లేవనెత్తే చారిత్రక-దైవశాస్త్రీయ ఉద్రిక్తతను అనువాదంలో పరిష్కరించలేదు; సంపూర్ణ సమర్థనగానీ వ్యంగ్యంగానీ అదనంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. మూలంలోని అలంకారిక ప్రశ్నను నిలిపి, మంచి పని–చెడు పని అనే నైతిక వ్యత్యాసాన్ని సమాంతరంగా వ్యక్తం చేసింది.
