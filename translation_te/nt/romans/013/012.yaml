id: ROM.13.12
reference: Romans 13:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: te
  text: రాత్రి చాలావరకు గడిచిపోయింది[a]; పగలు సమీపించింది. కాబట్టి చీకటి కార్యాలను విసర్జిద్దాం, వెలుగు కవచాన్ని[b] ధరించుకుందాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “రాత్రి ముందుకు సాగింది.” గ్రీకు క్రియ రాత్రి ముందుకు సాగినట్లు చిత్రిస్తుంది; అంటే అది చాలావరకు గడిచిపోయింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “వెలుగు ఆయుధాలను.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ νὺξ
  choice: రాత్రి
  rationale: పగలుతో ఉన్న కాలసంబంధమైన రూపక వ్యత్యాసాన్ని యథాతథంగా ఉంచుతుంది; దాని నైతిక భావాన్ని ముందుగానే వివరణగా మార్చదు.
- source_word: προέκοψεν
  choice: చాలావరకు గడిచిపోయింది
  rationale: క్రియ యొక్క మౌలిక భావం ‘ముందుకు సాగింది’; రాత్రి సందర్భంలో అది బాగా గడిచిపోయిందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἡ ἡμέρα
  choice: పగలు
  rationale: ‘రాత్రి’కి సహజమైన తెలుగు వ్యతిరేక పదంగా ఉండి, మూలంలోని కాల మరియు నైతిక రూపకాన్ని కాపాడుతుంది.
- source_word: ἤγγικεν
  choice: సమీపించింది
  rationale: దగ్గరకు వచ్చి ఇప్పుడు సమీపంలో ఉందనే పరిపూర్ణ కాల భావాన్ని సంక్షిప్తంగా ప్రతిబింబిస్తుంది.
- source_word: ἀποβαλώμεθα
  choice: విసర్జించి
  rationale: తీసివేసి పారవేయడం అనే బలమైన భావాన్ని ఇస్తూ, తరువాతి ‘ధరించుకుందాం’ అనే వస్త్ర రూపకంతో జతపడుతుంది.
- source_word: τὰ ἔργα
  choice: క్రియలను
  rationale: నైతిక కార్యాలను సూచించే పౌలు వాడుకకు తగిన, ప్రస్తుత ప్రామాణిక తెలుగులో సహజమైన పదం.
- source_word: τοῦ σκότους
  choice: చీకటి
  rationale: ‘వెలుగు’తో మూలంలోని రూపక వ్యత్యాసాన్ని నిలుపుతుంది; నేరుగా ‘చెడు’ అని వ్యాఖ్యానించదు.
- source_word: ἐνδυσώμεθα
  choice: ధరించుకుందాం
  rationale: ప్రథమ పురుష బహువచన ప్రేరణార్థక భావాన్ని, అలాగే ధరించే వస్త్ర/సైనిక సామగ్రి రూపకాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὰ ὅπλα
  choice: కవచాన్ని
  rationale: ‘ధరించు’ అనే క్రియతో కవచం సహజంగా సరిపోతుంది; అయితే గ్రీకు పదానికి ‘ఆయుధాలు’ అనే అర్థం కూడా ఉండటం వల్ల దానిని పాదసూచికలో ఉంచాం.
- source_word: τοῦ φωτός
  choice: వెలుగు
  rationale: చీకటికి వ్యతిరేకమైన మూల రూపకాన్ని దాని నైతిక, అంత్యకాల సంబంధిత విస్తృతితో సహా కాపాడుతుంది.
theological_decisions:
- issue: రాత్రి–పగలు అనే అంత్యకాల రూపకం
  choice: ‘రాత్రి’, ‘పగలు’ అనే కాల రూపకాలను నేరుగా నిలుపుతూ, వాటి నైతిక మరియు రక్షణచరిత్ర సంబంధిత భావాన్ని అంతర్లీనంగానే ఉంచాం.
  alternative: ‘ఈ చీకటి యుగం దాదాపు ముగిసింది; కొత్త యుగం దగ్గరలో ఉంది’ వంటి వివరణాత్మక అనువాదం.
  rationale: మూలంలోని రూపకం కాలసంబంధమైనదీ నైతికమైనదీ; దానిని విప్పి చెప్పడం అసలైన భావ ఉద్రిక్తతను ఒకే వ్యాఖ్యానంగా పరిమితం చేస్తుంది.
- issue: ὅπλα τοῦ φωτός యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘వెలుగు కవచం’.
  alternative: ‘వెలుగు ఆయుధాలు’.
  rationale: ‘ధరించుకుందాం’ అనే సమీప క్రియ ధరించగల సైనిక సామగ్రిని సూచించే ‘కవచం’కు అనుకూలంగా ఉంది. అయినా ὅπλα సాధారణంగా ‘ఆయుధాలు’ అని కూడా అర్థమవుతుంది కాబట్టి ఆ నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘విసర్జించి—ధరించుకుందాం’ అనే జోడీ మూలంలోని తీసివేయడం/ధరించడం రూపకాన్ని నిలుపుతుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
