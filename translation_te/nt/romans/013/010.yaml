  text: ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: te
  text: ప్రేమ పొరుగువానికి కీడు చేయదు[a]. కాబట్టి ప్రేమ ధర్మశాస్త్రపు నెరవేర్పు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రేమ పొరుగువానికి చెడు చేయదు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “ప్రేమ ధర్మశాస్త్రపు పరిపూర్ణత.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: ప్రేమ
  rationale: ఆధునిక తెలుగులో సహజమైన, విస్తృతమైన సమానార్థకం; వచనంలో రెండుసార్లు వచ్చిన పదబంధ సంబంధాన్ని అలాగే నిలుపుతుంది.
- source_word: τῷ πλησίον
  choice: పొరుగువానికి
  rationale: దత్తివిభక్తి వల్ల క్రియ ప్రభావం పొందే వ్యక్తిని సూచిస్తుంది. ఇక్కడ ‘పొరుగువాడు’ భౌగోళికంగా పక్కింటివాడికే పరిమితం కాక, తోటి మనిషిని సూచించే సాధారణ నైతిక అర్థంలో ఉంది.
- source_word: κακὸν οὐκ ἐργάζεται
  choice: కీడు చేయదు
  rationale: κακόν మరియు ἐργάζεται కలయికను సహజమైన తెలుగులో ‘కీడు చేయదు’ అని అందించడం ద్వారా హాని లేదా తప్పు కలిగించకపోవడం అనే భావం స్పష్టమవుతుంది.
- source_word: πλήρωμα
  choice: నెరవేర్పు
  rationale: ధర్మశాస్త్రాన్ని దాని ఉద్దేశిత సంపూర్ణతకు తీసుకువచ్చేది అనే భావాన్ని తెలిపే సహజమైన పదం; నామవాచక నిర్మాణాన్ని కూడా కాపాడుతుంది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాక్యం నుంచి వచ్చే నిర్ధారణను ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: νόμου
  choice: ధర్మశాస్త్రపు
  rationale: సందర్భంలో పౌలు సూచిస్తున్న మోషే ధర్మశాస్త్రాన్ని గుర్తించదగిన రీతిలో తెలుపుతుంది; షష్ఠీవిభక్తి సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ప్రేమకు ధర్మశాస్త్రంతో ఉన్న సంబంధం
  choice: ప్రేమ ధర్మశాస్త్రపు నెరవేర్పు
  alternative: ప్రేమ ధర్మశాస్త్రపు పరిపూర్ణత; ప్రేమ ధర్మశాస్త్రాన్ని నెరవేరుస్తుంది
  rationale: గ్రీకు పాఠంలో ఇది నామవాచక ప్రధాన వాక్యం. ‘నెరవేర్పు’ అనే రూపం ఆ వాక్యనిర్మాణాన్ని, పౌలు చేసిన దైవశాస్త్రీయ ప్రకటనను కాపాడుతుంది; దానిని క్రియారూపంగా మార్చి భావాన్ని అనవసరంగా విస్తరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన శైలి. ‘పొరుగువాడు’ అనే బైబిలీయ పదాన్ని ఉంచుతూ, వాక్యాన్ని సాధారణ పాఠకుడికి సహజంగా ఉండేలా సంక్షిప్తంగా నిర్మించాం.
