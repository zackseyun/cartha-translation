id: ROM.13.2
reference: Romans 13:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: te
  text: కాబట్టి అధికారాన్ని ఎదిరించేవాడు దేవుని ఏర్పాటునే[a] ఎదిరించి నిలిచాడు. అలా ఎదిరించినవారు తమపైకి తీర్పు[b] తెచ్చుకుంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవుని నియామకాన్నే’ లేదా ‘దేవుడు క్రమపరచిన దానినే.’
    reason: lexical_alternative
  - marker: b
    text: ‘తీర్పు’ అనే గ్రీకు పదాన్ని ‘ఖండన’ లేదా ‘శిక్షావిధి’ అని కూడా అనువదించవచ్చు; అయితే ఇక్కడ అది తప్పనిసరిగా అంతిమ ఖండనను సూచించదు.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: కాబట్టి
  rationale: ముందటి వచనంలో చెప్పిన దాని నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὁ ἀντιτασσόμενος
  choice: ఎదిరించేవాడు
  rationale: వర్తమాన మధ్యమ కృదంతం ఒక వ్యక్తిని సాధారణంగా సూచిస్తుంది; నిరంతరంగా లేదా స్వభావరీత్యా వ్యతిరేకంగా నిలబడే భావాన్ని సంక్షిప్తంగా ఇస్తుంది.
- source_word: τῇ ἐξουσίᾳ
  choice: అధికారాన్ని
  rationale: ఇది 13:1లోని పాలక అధికారాన్ని తిరిగి సూచిస్తుంది. మూలంలోని ఏకవచనాన్ని, సందర్భంపై ఆధారపడే భావాన్ని నిలుపుతుంది.
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: దేవుని ఏర్పాటునే
  rationale: διαταγή దేవుడు క్రమపరచిన ఏర్పాటు లేదా నియామకాన్ని సూచించగలదు. ‘ఏర్పాటు’ సహజంగా ఉండి, ‘శాసనం’ లేదా ‘ఆజ్ఞ’ కంటే అనవసరమైన చట్టపరమైన కాఠిన్యాన్ని జోడించదు.
- source_word: ἀνθέστηκεν
  choice: ఎదిరించి నిలిచాడు
  rationale: పరిపూర్ణ కాలంలోని, ఇప్పటికే తీసుకున్న వైఖరికి ప్రస్తుతం కొనసాగుతున్న ప్రాసంగికతను ఈ రూపం వ్యక్తం చేస్తుంది; ముందు వచ్చిన ‘ఎదిరించేవాడు’తో ఉన్న పదసంబంధాన్ని కూడా కాపాడుతుంది.
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: అలా ఎదిరించినవారు
  rationale: ముందటి క్రియను తిరిగి సూచిస్తూ, ఆ విధంగా వ్యతిరేకంగా నిలిచిన వారిని సమూహంగా తెలియజేస్తుంది.
- source_word: ἑαυτοῖς
  choice: తమపైకి
  rationale: ఆ పరిణామం ఎదిరించిన వారికే తిరిగి వస్తుందనే ఆత్మార్థక దత్తివు భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κρίμα
  choice: తీర్పు
  rationale: ఈ పదం తీర్పు, శిక్షావిధి లేదా ఖండనను సూచించగలదు. ‘తీర్పు’ విస్తృత భావాన్ని నిలిపి, నిత్య ఖండన అనే బలమైన అర్థాన్ని వచనంలోకి ముందుగానే తేవదు.
- source_word: λήμψονται
  choice: తెచ్చుకుంటారు
  rationale: ‘తమపైకి’తో కలిపి, వారు ఆ పరిణామాన్ని తమకే కలిగించుకుంటారనే భవిష్యత్ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: κρίμα యొక్క పరిధి
  choice: తీర్పు
  alternative: ఖండన; శిక్షావిధి
  rationale: వ్యతిరేకించేవారు తీర్పుకు లోనవుతారని వచనం హెచ్చరిస్తుంది; అయితే అది తప్పనిసరిగా అంతిమ లేదా నిత్య ఖండనే అని స్పష్టంగా చెప్పదు. అందువల్ల విస్తృతమైన పదాన్ని ఉంచాం.
- issue: ἐξουσία దేనిని సూచిస్తుంది
  choice: సందర్భంలోని పాలక అధికారం; పాఠ్యంలో సంక్షిప్తంగా ‘అధికారం’
  alternative: విస్తృతమైన భావంలో ఏ అధికారం అయినా
  rationale: రోమా 13:1లోని తక్షణ సందర్భం పాలక అధికారాల గురించిది. అయినా మూలంలోని సాధారణ ఏకవచన రూపాన్ని అతిగా విపులీకరించకుండా పాఠ్యంలో నిలిపాం.
- issue: దేవుని διαταγή స్వరూపం
  choice: దేవుని ఏర్పాటు
  alternative: దేవుని నియామకం; దేవుని ఆదేశం
  rationale: ఇక్కడ భావం అధికారానికి సంబంధించిన దేవుని క్రమపరచడం. ‘ఏర్పాటు’ ఆ భావాన్ని నిలుపుతూ, ఇది ఒక ప్రత్యేక లిఖిత ఆజ్ఞ లేదా చట్టశాసనం అని నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘ఎదిరించేవాడు—ఎదిరించి నిలిచాడు—ఎదిరించినవారు’ అనే పునరుక్తి మూలంలోని పదబంధ సంబంధాన్ని ఉద్దేశపూర్వకంగా కాపాడుతుంది.
