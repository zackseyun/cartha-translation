id: ROM.13.5
reference: Romans 13:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: te
  text: కాబట్టి, ఉగ్రత కారణంగా మాత్రమే కాక, మనస్సాక్షి కారణంగా కూడా లోబడటం[b] అవసరం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘శిక్ష కారణంగా’; గ్రీకులో ‘ఉగ్రత కారణంగా’ అని ఉంది. ఇది పాలకుని శిక్షాత్మక చర్యను గానీ, పౌరాధికారం ద్వారా కార్యరూపం దాల్చే దేవుని ఉగ్రతను మరింత విస్తృతంగా గానీ సూచించవచ్చు.
    reason: alternative_reading
  - marker: b
    text: లేదా, ‘అధీనంలో ఉండటం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: కాబట్టి
  rationale: ముందటి వాదన నుండి తీసుకున్న నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀνάγκη
  choice: అవసరం
  rationale: వ్యక్తినిరపేక్షంగా వ్యక్తమైన ఆవశ్యకతను అతిగా వ్యాఖ్యానించకుండా నిలుపుతుంది.
- source_word: ὑποτάσσεσθαι
  choice: లోబడి ఉండడం
  rationale: పాలక అధికారాల పట్ల ఉండవలసిన వైఖరిని సహజమైన తెలుగులో తెలియజేస్తుంది; సంపూర్ణ విధేయత అనే అదనపు భావాన్ని చేర్చదు.
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: కారణంగా మాత్రమే కాక … కారణంగా కూడా
  rationale: గ్రీకు సహసంబంధ నిర్మాణంలోని వ్యత్యాసం మరియు అదనాన్ని తెలుగు వాక్యనిర్మాణంలో సహజంగా నిలుపుతుంది.
- source_word: διὰ τὴν ὀργὴν
  choice: ఉగ్రత కారణంగా
  rationale: διά తో కూడిన కారణార్థాన్ని చూపుతూ, ὀργή అనే పదాన్ని ‘శిక్ష’గా వ్యాఖ్యానించి పరిమితం చేయకుండా దాని అస్పష్టతను కాపాడుతుంది.
- source_word: διὰ τὴν συνείδησιν
  choice: మనస్సాక్షి కారణంగా
  rationale: అంతర్గత నైతిక అవగాహన కూడా లోబడడానికి కారణమని నేరుగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ὀργή (‘ఉగ్రత’) ఎవరిని లేదా దేనిని సూచిస్తుంది?
  choice: ‘ఉగ్రత’ అని మాత్రమే అనువదించి సూచిత వ్యక్తిని నిర్దిష్టం చేయలేదు.
  alternative: దేవుని ఉగ్రత; పాలకుని శిక్షాత్మక చర్య
  rationale: సమీప సందర్భంలో దేవుడు అధికారాలను ఏర్పాటు చేయడం, పాలకుడు ఖడ్గం ధరించడం రెండూ ఉన్నాయి. ఈ వాక్యంలో గ్రీకు పాఠం ఉగ్రత ఎవరిదో స్పష్టంగా చెప్పదు; అందువల్ల ఆ భావసందిగ్ధతను నిలిపాం.
- issue: ὑποτάσσεσθαι యొక్క భావబలం
  choice: లోబడి ఉండడం
  alternative: అధీనంలో ఉండడం; తనను తాను లోపరచుకోవడం
  rationale: అధికారాల పట్ల కోరబడిన వైఖరిని తెలియజేస్తూనే, వాక్యం చెప్పని సంపూర్ణ విధేయత సిద్ధాంతాన్ని చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. తెలుగు సహజ పదక్రమం కోసం ‘ఉగ్రత’ మరియు ‘మనస్సాక్షి’ కారణాలను ముందుంచి, ప్రధాన క్రియాభావాన్ని చివర ఉంచాం.
