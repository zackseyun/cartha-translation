id: ROM.13.6
reference: Romans 13:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: te
  text: అందుకే మీరు పన్నులు కూడా చెల్లిస్తున్నారు. ఎందుకంటే అధికారులు దేవుని సేవకులు; వారు ఈ పనికే నిరంతరం అంకితమై ఉన్నారు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: పన్నులు చెల్లిస్తున్నారు
  rationale: φόρος పాలక అధికారానికి చెల్లించే పన్నును సూచిస్తుంది; τελεῖτε ఇక్కడ చెల్లించడం అనే సాధారణ అర్థంలో ఉంది.
- source_word: λειτουργοὶ θεοῦ
  choice: దేవుని సేవకులు
  rationale: λειτουργός అధికారిక ప్రజాసేవను సూచించగలిగినా, దేవునితో వారి సంబంధాన్ని తెలిపే సహజమైన మరియు గౌరవప్రదమైన తెలుగు రూపం ‘దేవుని సేవకులు’.
- source_word: προσκαρτεροῦντες
  choice: నిరంతరం అంకితమై ఉన్నారు
  rationale: కేవలం పని చేయడం కాక, దానిలో పట్టుదలగా కొనసాగడం అనే భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పౌర అధికారులను ‘దేవుని సేవకులు’గా పేర్కొనడం
  choice: మూలంలోని నేరమైన వర్ణనను యథాతథంగా ఉంచడం
  alternative: ‘దేవుని తరఫున ప్రజాసేవ చేసేవారు’
  rationale: ప్రత్యామ్నాయం వివరణాత్మకమైనదైనా, మూలంలోని θεοῦ అనే సంబంధాన్ని మరియు θεολογిక ఉద్రిక్తతను తగ్గిస్తుంది. ఈ వాక్యం వారి ప్రతి చర్యను సమర్థిస్తుందని అదనంగా చెప్పలేదు.
- issue: εἰς αὐτὸ τοῦτο యొక్క సూచన
  choice: ‘ఈ పనికే’ అని ఉద్దేశపూర్వకంగా విస్తృతంగా ఉంచడం
  alternative: ‘పన్నులు వసూలు చేసే పనికే’
  rationale: గ్రీకు పదబంధం తక్షణ సందర్భంలోని పరిపాలనా సేవను సూచిస్తుంది; దానిని పన్నుల వసూలుకే పరిమితం చేయడం మూలంలో ఉన్న స్వల్ప అస్పష్టతను అనవసరంగా తొలగిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. ‘అధికారులు’ అనే కర్తను ముందరి సందర్భం నుంచి స్పష్టత కోసం వ్యక్తం చేశాం; ఇది గ్రీకు εἰσιν లో అంతర్భూతమైన బహువచన కర్తను సూచిస్తుంది.
