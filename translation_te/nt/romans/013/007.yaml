id: ROM.13.7
reference: Romans 13:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: te
  text: 'అందరికీ వారికి రావలసినవి చెల్లించండి: పన్ను పొందవలసినవారికి పన్ను, సుంకం పొందవలసినవారికి సుంకం, భయపడవలసినవారికి భయం, గౌరవించవలసినవారికి గౌరవం.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: చెల్లించండి
  rationale: ఇవ్వవలసినదాన్ని తిరిగి ఇవ్వడం లేదా బాకీ తీర్చడం అనే భావాన్ని, పన్నులు మరియు ఇతర బాధ్యతల సందర్భంలో సహజంగా తెలియజేస్తుంది.
- source_word: φόρον
  choice: పన్ను
  rationale: ప్రత్యక్షంగా విధించే పన్నును సూచించే సాధారణ ఆధునిక తెలుగు పదం.
- source_word: τέλος
  choice: సుంకం
  rationale: φόροςతో ఉన్న భేదాన్ని నిలుపుతూ, పరోక్ష పన్ను, కస్టమ్స్ లేదా విధించబడిన రుసుము అనే పరిధిని సూచిస్తుంది.
- source_word: φόβον
  choice: భయం
  rationale: గ్రీకు పదంలోని బలమైన అర్థాన్ని ‘గౌరవం’గా సున్నితం చేయకుండా యథాతథంగా నిలుపుతుంది; సందర్భంలో అది అధికారంపట్ల భయభక్తి లేదా జాగ్రత్తతో కూడిన భయాన్ని సూచించవచ్చు.
- source_word: τιμήν
  choice: గౌరవం
  rationale: వ్యక్తికి తగిన మర్యాద, ఘనత అనే అర్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: φόβος అనే పదాన్ని పౌర అధికారాల సందర్భంలో ఎలా అనువదించాలి
  choice: భయం
  alternative: భయభక్తి / మర్యాద
  rationale: మూలపాఠంలోని ‘భయం’ అనే అసౌకర్యకరమైన బలాన్ని కాపాడి, దానిని కేవలం మర్యాదగా వ్యాఖ్యానించి theological tension‌ను తొలగించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. గ్రీకు వాక్యంలోని వరుస పునరుక్తిని సాధ్యమైనంతవరకు నిలిపి, తెలుగులో క్రియను చివర మళ్లీ ఉంచి వాక్యాన్ని సహజంగా పూర్తి చేశాం.
