id: ROM.13.14
reference: Romans 13:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: te
  text: కాని ప్రభువైన యేసు మెస్సీయను ధరించుకోండి; శరీర కోరికల కోసం ఏ ఏర్పాటూ చేయకండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: ధరించుకోండి
  rationale: మధ్యమ ప్రయోగంలోని ఆజ్ఞారూపం వస్త్రధారణ రూపకాన్ని వాడుతుంది. ‘ధరించుకోండి’ ఆ రూపకాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: κύριον
  choice: ప్రభువైన
  rationale: ఇక్కడ κύριος యేసుకు గౌరవభరితమైన దైవశాస్త్రీయ బిరుదు. తెలుగు వాక్యనిర్మాణంలో ‘ప్రభువైన’ సహజంగా ఉంటుంది.
- source_word: Χριστόν
  choice: మెస్సీయను
  rationale: ఇక్కడ Χριστός ఇంటిపేరులా కాక బిరుదుగా పనిచేస్తోంది; అందువల్ల దాని అభిషిక్త రాజు భావాన్ని నిలిపే ‘మెస్సీయ’ వాడబడింది.
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: ఏ ఏర్పాటూ చేసుకోకండి
  rationale: ఈ పదబంధం ముందుగానే ఆలోచించి అవసరమైనది సమకూర్చడం లేదా ఏర్పాటు చేయడం అనే భావాన్ని ఇస్తుంది. తెలుగు నిషేధ వాక్యంలో ‘ఏ ఏర్పాటూ చేసుకోకండి’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: σάρξ
  choice: శరీరం
  rationale: పౌలు వాడిన ‘శరీరం’ అనే రూపక పదాన్ని ప్రధాన పాఠంలో నిలిపి, దాన్ని ‘పాప స్వభావం’గా నేరుగా నిర్వచించడం వల్ల కలిగే అర్థసంకోచాన్ని నివారించాం.
- source_word: εἰς ἐπιθυμίας
  choice: దాని కోరికల కోసం
  rationale: εἰς పదబంధంలోని ఉద్దేశం లేదా దిశ భావాన్ని అతిగా వివరించకుండా, ‘శరీరం’తో కోరికల సంబంధాన్ని తెలుగులో స్పష్టంగా చూపుతుంది.
theological_decisions:
- issue: నైతిక సందర్భంలో σάρξ అర్థం
  choice: శరీరం
  alternative: పాప స్వభావం
  rationale: ఈ సందర్భంలో పతిత మానవ ప్రేరణలు ఉద్దేశించబడి ఉండవచ్చు; అయినా ‘పాప స్వభావం’ అని ప్రధాన పాఠంలో పెట్టడం పౌలు రూపకాన్ని ఒక నిర్దిష్ట మానవశాస్త్ర వ్యాఖ్యానానికి పరిమితం చేస్తుంది. అందుకే అసలు పదంలోని దైవశాస్త్రీయ ఉద్రిక్తతను నిలిపాం.
- issue: Χριστόςను బిరుదుగా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ పేరు-బిరుదు వరుసలో Χριστόςను దాని బిరుదు భావంతో చూపడానికి ‘మెస్సీయ’ ఎంచుకున్నాం; తెలుగులో నిర్దిష్ట ఉపపదం లేకుండానే ఈ బిరుదు సహజంగా పనిచేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవభరితమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. వస్త్రధారణ రూపకం, ‘శరీరం’ అనే పౌలు పదప్రయోగం, చివరి పదబంధంలోని సంక్షిప్తత నిలుపబడ్డాయి.
