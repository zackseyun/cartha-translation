id: ROM.9.33
reference: Romans 9:33
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: te
  text: 'లేఖనంలో ఇలా వ్రాయబడి ఉంది: “ఇదిగో, నేను సీయోనులో తడబడేలా చేసే రాయిని, పడిపోయేలా చేసే బండను ఉంచుతున్నాను.[a] ఆయనపై[b] విశ్వాసముంచేవాడు అవమానానికి గురికాడు.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇక్కడ పౌలు యెషయా 8:14 మరియు 28:16లోని మాటలను కలిపి ఉల్లేఖిస్తున్నాడు.
    reason: cross_reference
  - marker: b
    text: లేదా “దానిపై.” గ్రీకు పదానికి ఇక్కడ వ్యక్తిని లేదా రాయి రూపకాన్ని సూచించే విధంగా అర్థం వచ్చే అవకాశం ఉంది; పౌలు సందర్భం ఈ రూపకాన్ని మెస్సీయకు వర్తింపజేస్తుంది.
    reason: alternative_reading
  - marker: c
    text: లేదా “నిరాశ చెందడు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: లేఖనంలో ఇలా వ్రాయబడి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే సాంప్రదాయ సూత్రాన్ని ఆధునిక, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἰδοὺ
  choice: ఇదిగో
  rationale: దృష్టిని ఆకర్షించే మూలపద బలాన్ని నిలుపుతూ, సాధారణ ఆధునిక తెలుగులో సహజంగా ఉంటుంది.
- source_word: τίθημι
  choice: ఉంచుతున్నాను
  rationale: మూలంలోని వర్తమాన కాలాన్ని నిలుపుతుంది; నిర్మాణంలో రాయిని అమర్చే భావానికీ సరిపోతుంది.
- source_word: ἐν Σιὼν
  choice: సీయోనులో
  rationale: ἐν యొక్క స్థానార్థాన్ని నేరుగా తెలియజేస్తుంది.
- source_word: λίθον προσκόμματος
  choice: తడబడేలా చేసే రాయి
  rationale: ప్రసκόμμα అనే తడబడటానికి కారణమయ్యే భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: πέτραν σκανδάλου
  choice: పడిపోయేలా చేసే బండ
  rationale: ముందటి ‘తడబడటం’తో సంబంధాన్ని ఉంచుతూనే, σκάνδαλον సూచించే పతనకారణ భావాన్ని మరింత బలంగా వ్యక్తం చేస్తుంది.
- source_word: ὁ πιστεύων
  choice: విశ్వాసముంచేవాడు
  rationale: నామవాచకంగా వాడిన వర్తమాన కృదంతం యొక్క సాధారణ ఏకవచన భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἐπ’ αὐτῷ
  choice: ఆయనపై
  rationale: ἐπί యొక్క ‘పై’ భావాన్ని నిలుపుతూ, పౌలు సందర్భంలో రాయి రూపకం మెస్సీయకు వర్తించడాన్ని వ్యక్తిగత సర్వనామంతో తెలియజేస్తుంది; వ్యాకరణపరమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: οὐ καταισχυνθήσεται
  choice: అవమానానికి గురికాడు
  rationale: భవిష్యత్ కర్మణి భావాన్నీ, గౌరవం–అవమానం ఛాయనూ సహజ తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: ἐπ’ αὐτῷ లోని αὐτῷ యొక్క సూచిత వ్యక్తి/వస్తువు
  choice: ‘ఆయనపై’ అని వ్యక్తిగతంగా అనువదించబడింది.
  alternative: రాయి/బండను వస్తువుగా సూచిస్తూ ‘దానిపై’ అని అనువదించవచ్చు.
  rationale: గ్రీకు రూపం పురుషలింగం లేదా నపుంసకలింగం కావచ్చు. అయితే రోమా 9:32–33; 10:11 సందర్భంలో పౌలు ఈ రాయి రూపకాన్ని మెస్సీయకు వర్తింపజేస్తాడు. అందువల్ల ప్రధాన పాఠంలో వ్యక్తిగత అనువాదాన్ని ఉంచి, నిజమైన వ్యాకరణ సందిగ్ధతను పాదసూచికలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరతను నిలుపుతూ సాధారణ పాఠకులకు అర్థమయ్యే పదజాలం వాడబడింది. ‘రాయి/బండ’ మరియు ‘తడబడటం/పడిపోవడం’ అనే జంటల ద్వారా మూలంలోని సమాంతరతతో పాటు స్వల్ప భేదం కూడా నిలుపబడింది.
