id: ROM.9.20
reference: Romans 9:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: te
  text: కానీ, ఓ మనిషీ, దేవునికి ఎదురు జవాబిచ్చే నీవెవరు? రూపింపబడినది దానిని రూపించినవానితో, “నన్ను ఇలా ఎందుకు చేశావు?” అని అంటుందా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ గ్రీకు ప్రశ్నకు ఆశించబడే జవాబు ‘లేదు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: అయితే
  rationale: ముందటి అభ్యంతరాన్ని సరిదిద్దుతూ బలమైన ప్రతివాద మలుపును సూచిస్తుంది; ఆధునిక తెలుగులో ‘అయితే’ సహజంగా ఆ భావాన్ని మోస్తుంది.
- source_word: ὦ ἄνθρωπε
  choice: ఓ మనిషీ
  rationale: ప్రత్యక్ష సంబోధనను, మానవజాతిని ప్రతినిధిగా సూచించే ఏకవచన భావాన్ని నిలుపుతుంది.
- source_word: σὺ τίς εἶ
  choice: నీవెవరివి
  rationale: కేవలం వ్యక్తి గుర్తింపును అడగకుండా, అతని స్థాయిని ప్రశ్నించే గద్దింపు ధోరణిని సహజ తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: దేవునికి ఎదురు జవాబు చెప్పడానికి
  rationale: ἀνταποκρίνομαι లోని సాధారణ సమాధానం కాకుండా ప్రతివాదంగా ఎదురు చెప్పే భావాన్ని కాపాడుతుంది.
- source_word: τὸ πλάσμα
  choice: రూపించబడినది
  rationale: రూపుదిద్దబడిన వస్తువు అనే భావాన్ని, తదుపరి క్రియతో ఉన్న పదబంధ సంబంధాన్ని నిలుపుతుంది.
- source_word: τῷ πλάσαντι
  choice: తనను రూపించినవానితో
  rationale: రూపించబడినది–రూపించినవాడు అనే మూలపాఠంలోని ఉద్దేశపూర్వక వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: Τί με ἐποίησας οὕτως;
  choice: నన్ను ఇలా ఎందుకు చేశావు?
  rationale: ‘నన్ను ఈ విధంగా ఎందుకు చేశావు?’ అనే అక్షరార్థాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ἄνθρωπε పదంలోని ప్రతినిధి మానవార్థం
  choice: ‘ఓ మనిషీ’ అని అనువదించి, ఒక పురుషునికే పరిమితం కాని మానవ సంబోధనగా ఉంచడం
  alternative: ‘ఓ మానవుడా’
  rationale: సందర్భంలో ఒక వ్యక్తిని మానవునిగా ప్రతినిధిత్వంగా సంబోధిస్తున్నారు; ‘ఓ మనిషీ’ సహజంగా ఉండి మూలంలోని ఏకవచన గద్దింపును నిలుపుతుంది.
- issue: దేవునికి ఎదురు చెప్పడంలోని గద్దింపు
  choice: ‘ఎదురు జవాబు చెప్పడానికి’
  alternative: ‘సమాధానం చెప్పడానికి’
  rationale: మూల క్రియ తటస్థమైన ప్రతిస్పందనకన్నా విరోధిస్తూ తిరిగి జవాబిచ్చే భావాన్ని కలిగి ఉంది; సృష్టికర్త–సృష్టి మధ్య ఉద్రిక్తతను మృదువుచేయలేదు.
- issue: μή తో వచ్చిన అలంకార ప్రశ్న
  choice: తెలుగులో సానుకూల రూపంలోని ప్రశ్నగా ఉంచి, సందర్భం ద్వారా ‘లేదు’ అనే ఆశిత జవాబును తెలియజేయడం
  alternative: ‘అలా అనదు కదా?’
  rationale: గ్రీకు ప్రశ్న ప్రతికూల జవాబును ఆశిస్తుంది. ప్రధాన పాఠంలో ‘అంటుందా?’ సహజంగా అదే అలంకార బలాన్ని ఇస్తుంది; వ్యాకరణ లక్షణాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు స్పష్టమైన వాక్య నిర్మాణం. ‘రూపించబడినది/రూపించినవాడు’ అనే పదబంధ ప్రతిధ్వనిని ఉద్దేశపూర్వకంగా నిలిపి, పౌలు గద్దింపులోని పదును తగ్గించలేదు.
