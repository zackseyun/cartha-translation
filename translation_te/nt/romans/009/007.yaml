id: ROM.9.7
reference: Romans 9:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐδ’ ὅτι εἰσὶν σπέρμα Ἀβραάμ, πάντες τέκνα, ἀλλ’· Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: te
  text: అంతేగాక, వారు అబ్రాహాము సంతానం[a] అయినంత మాత్రాన వారందరూ పిల్లలు కారు. కానీ, “ఇస్సాకువలన నీకు సంతానం అని పిలువబడుతుంది.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “విత్తనం.” గ్రీకు పదం ఏకవచనంలో ఉన్నప్పటికీ, సమూహార్థంలో సంతానం లేదా వారసులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “ఇస్సాకువలన నీకు సంతానం అని పిలువబడుతుంది” అనేది ఆదికాండము 21:12ను ప్రతిధ్వనిస్తుంది. “పిలువబడుతుంది” అనే మాటను సందర్భంలో “గుర్తించబడుతుంది” లేదా “లెక్కించబడుతుంది” అనే భావంలోనూ అర్థం చేసుకోవచ్చు.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: అలాగే ... అయినంత మాత్రాన ... కారు
  rationale: οὐδέ ముందటి వాదనకు మరో నిరాకరణను జోడిస్తుంది; ὅτιతో వచ్చే కారణ భావాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేయడానికి ‘అయినంత మాత్రాన’ వాడబడింది.
- source_word: σπέρμα Ἀβραάμ
  choice: అబ్రాహాము సంతానం
  rationale: σπέρμα ఏకవచన సమూహార్థంలో సంతతి లేదా వారసులను సూచిస్తుంది. ‘సంతానం’ సహజంగా ఉండి ఆ సమూహార్థాన్ని నిలుపుతుంది.
- source_word: πάντες τέκνα
  choice: వారందరూ పిల్లలు
  rationale: τέκνα లింగభేదం లేని ‘పిల్లలు’; గ్రీకులో అంతర్లీనంగా ఉన్న క్రియను తెలుగులో స్పష్టంగా చేర్చాం.
- source_word: ἀλλ’
  choice: దానికి బదులుగా
  rationale: ముందటి భావాన్ని సరిదిద్దే బలమైన వ్యత్యాసాన్ని సూచిస్తుంది.
- source_word: Ἐν Ἰσαὰκ
  choice: ఇస్సాకులో
  rationale: ἐν యొక్క మూల రూపాన్ని, ఆదికాండము 21:12 ఉల్లేఖన ధ్వనిని దగ్గరగా నిలుపుతుంది; వంశపరమైన భావాన్ని సందర్భం తెలియజేస్తుంది.
- source_word: κληθήσεταί
  choice: పిలువబడుతుంది
  rationale: καλέω భవిష్యత్ కర్మణి రూపానికి సన్నిహితమైన అనువాదం; ‘లెక్కించబడుతుంది’ వంటి వివరణాత్మక భావాన్ని వచనంలోకి ముందుగానే తేవదు.
- source_word: σοι σπέρμα
  choice: నీ సంతానం
  rationale: దత్తివాచకమైన σοιని తెలుగులో సహజమైన స్వామ్య రూపంగా ఇచ్చి, σπέρμαకు వచనమంతటా ఒకే పదాన్ని నిలిపాం.
theological_decisions:
- issue: శారీరక వంశానికీ పిల్లలుగా గుర్తింపబడటానికీ ఉన్న సంబంధం
  choice: అబ్రాహాము శారీరక సంతానమై ఉండటం ఒక్కటే అందరూ పిల్లలు కావడానికి సరిపోదని వచనం చెబుతున్నట్టుగా అనువదించాం.
  alternative: తరువాతి వాదనలోని ఎన్నిక సిద్ధాంతాన్ని ఇక్కడే పూర్తిగా వివరించడం, లేదా దీనిని కేవలం జాతిపరమైన తేడాగా పరిమితం చేయడం.
  rationale: ఈ వచనం శారీరక వంశానికీ వాగ్దానంలో గుర్తించబడిన వంశరేఖకూ మధ్య తేడాను ఉంచుతుంది; ఆ తేడా ఎలా కార్యరూపం దాల్చుతుందో ఇక్కడ అదనంగా నిర్ణయించదు.
- issue: ఆదికాండము ఉల్లేఖనంలోని ‘పిలువబడుతుంది’ అనే పదబంధం
  choice: ‘ఇస్సాకులో నీ సంతానం పిలువబడుతుంది’ అని మూలానికి దగ్గరగా ఉంచాం.
  alternative: ‘ఇస్సాకు ద్వారా నీ సంతానం లెక్కించబడుతుంది’ లేదా ‘ఇస్సాకు ద్వారా నీకు వారసులు కలుగుతారు.’
  rationale: మూలంలోని ἐν మరియు καλέω పదాలను వివరణాత్మకంగా పరిష్కరించకుండా, నామకరణం/పిలుపు/గుర్తింపు మధ్య ఉన్న భావ విస్తృతిని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గ్రంథోచిత గౌరవభావంతో. ‘అయినంత మాత్రాన’ తార్కిక సంబంధాన్ని సహజంగా చూపుతుంది. ఉల్లేఖనంలో మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను కాపాడటానికి ‘ఇస్సాకులో’ మరియు ‘పిలువబడుతుంది’ ఉంచబడ్డాయి.
