review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the contrast between Abrahamic physical descent and being designated as children. However, the quotation's Telugu locative, “ఇస్సాకులో,” is not idiomatic for the lineal force of ἐν Ἰσαὰκ and can sound as though the calling occurs inside Isaac. “ఇస్సాకువలన” naturally expresses the citation's descent/line-of-identification sense while retaining the passive ‘will be called.’
  naturalness: “అలాగే” does not clearly carry οὐδέ’s additional negation in this argument, and “దానికి బదులుగా” is unnecessarily cumbersome before a corrective quotation. “అంతేగాక” and “కానీ” are modern, clear Telugu. The quoted wording is made idiomatic by using “నీకు సంతానం అని పిలువబడుతుంది.”
  terminology: “అబ్రాహాము సంతానం” consistently renders the collective singular σπέρμα. “పిల్లలు” appropriately renders the gender-inclusive τέκνα without adding an explicit theological referent not stated in this verse. “పిలువబడుతుంది” retains the lexical and theological openness of κληθήσεται; the footnote notes, rather than imposes, the contextual sense of recognition or reckoning.
  issues:
  - severity: medium
    issue: “ఇస్సాకులో నీ సంతానం పిలువబడుతుంది” is semantically awkward in modern Telugu.
    rationale: Although formally reflecting ἐν, Telugu “-లో” normally has a locative sense. In this genealogical quotation it obscures the intended lineal relationship. “ఇస్సాకువలన” is idiomatic and reflects the citation's sense without resolving ‘called’ into a doctrinal interpretation.
  - severity: low
    issue: The connectors “అలాగే” and “దానికి బదులుగా” do not best express the Greek argumentative contrast.
    rationale: οὐδέ adds a further negated point, and ἀλλά introduces the corrective scriptural citation. “అంతేగాక” and “కానీ” communicate these relations more directly and naturally.
  revised_text: అంతేగాక, వారు అబ్రాహాము సంతానం[a] అయినంత మాత్రాన వారందరూ పిల్లలు కారు. కానీ, “ఇస్సాకువలన నీకు సంతానం అని పిలువబడుతుంది.”[b]
