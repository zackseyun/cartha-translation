revisions:
- from: అలాగే, వారు అబ్రాహాము సంతానం[a] అయినంత మాత్రాన వారందరూ పిల్లలు కారు. దానికి బదులుగా, “ఇస్సాకులో నీ సంతానం పిలువబడుతుంది.”[b]
  to: అంతేగాక, వారు అబ్రాహాము సంతానం[a] అయినంత మాత్రాన వారందరూ పిల్లలు కారు. కానీ, “ఇస్సాకువలన నీకు సంతానం అని పిలువబడుతుంది.”[b]
  rationale: 'The revision retains the verse''s distinction between descent and covenantal designation without importing a theological system. It improves the Telugu handling of the Genesis citation: “ఇస్సాకువలన” expresses the lineal sense naturally, while “నీకు సంతానం అని పిలువబడుతుంది” preserves the Greek passive ‘will be called’ and its deliberate interpretive openness. Footnote anchors remain valid and the footnotes support, rather than replace, the text''s ambiguity.'
