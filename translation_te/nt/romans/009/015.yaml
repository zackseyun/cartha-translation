id: ROM.9.15
reference: Romans 9:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: te
  text: 'ఎందుకంటే ఆయన మోషేతో ఇలా అంటున్నాడు: “నేను ఎవరిని కనికరిస్తానో వారిని కనికరిస్తాను; ఎవరిపై కరుణ చూపుతానో వారిపై కరుణ చూపుతాను.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: నిర్గమకాండ 33:19 నుండి ఉల్లేఖనం.
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: మోషేతో
  rationale: λέγειతో ఉన్న దత్తివిభక్తి సంబోధిత వ్యక్తిని సూచిస్తుంది. ఆధునిక తెలుగులో ‘మోషేతో అంటున్నాడు’ సహజంగా ఉంటుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు కారణం లేదా వివరణను కలుపుతున్న సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: λέγει
  choice: ఆయన ... అంటున్నాడు
  rationale: గ్రీకులోని వర్తమానకాల ఉల్లేఖన సూత్రాన్ని నిలుపుతుంది; నిర్గమకాండ సందర్భంలో అంతర్లీన కర్త దేవుడు.
- source_word: Ἐλεήσω ... ἐλεῶ
  choice: నేను ఎవరిని కనికరిస్తానో వారిని కనికరిస్తాను
  rationale: ఒకే గ్రీకు క్రియ పునరుక్తిని ఒకే తెలుగు క్రియతో నిలిపి, దైవ కనికరానికి సంబంధించిన గట్టి పునరుక్తి మరియు వ్యాఖ్యాన ఉద్రిక్తతను కాపాడుతుంది.
- source_word: οἰκτιρήσω ... οἰκτίρω
  choice: ఎవరిపై జాలి చూపుతానో వారిపై జాలి చూపుతాను
  rationale: ἐλεέωతో ఉన్న పదభేదాన్ని తెలుగులోనూ నిలుపుతూ, సహజమైన సమాంతర నిర్మాణాన్ని ఇస్తుంది. ‘జాలి చూపు’ ఇక్కడ దయతో కూడిన కరుణార్థంలో వాడబడింది.
- source_word: ὃν ἂν
  choice: ఎవరిని ... వారిని / ఎవరిపై ... వారిపై
  rationale: అనిర్దిష్ట సంబంధార్థాన్ని సహజమైన తెలుగు సంబంధ-సూచక నిర్మాణంతో వ్యక్తం చేస్తుంది; మూలంలో లేని ‘ఎంచుకుంటాను’ అనే భావాన్ని చేర్చదు.
theological_decisions:
- issue: ఉల్లేఖన సూత్రంలోని కర్త గుర్తింపు
  choice: ‘ఆయన ... అంటున్నాడు’ అని వ్యక్తిగత కర్తతో అనువదించడం
  alternative: ‘లేఖనం మోషేతో అంటోంది’ అని నిర్జీవ కర్తతో అనువదించడం
  rationale: గ్రీకులో కర్త స్పష్టంగా లేకపోయినా, నిర్గమకాండ 33:19లో నేరుగా మాట్లాడుతున్నది దేవుడే. ‘ఆయన’ మూలసందర్భాన్ని ప్రతిబింబిస్తుంది; దేవుడు అనే నామాన్ని మూలపాఠంలో లేనందున నేరుగా చేర్చదు.
- issue: కనికరం చూపడంలో దేవుని స్వాతంత్ర్యం
  choice: మూలంలోని పునరుక్తిని వివరణాత్మక విస్తరణ లేకుండా నిలుపడం
  alternative: ‘నేను ఎవరిని ఎంచుకుంటానో వారిని కనికరిస్తాను’ అని విస్తరించడం
  rationale: ‘ఎంచుకుంటాను’ అనే పదం గ్రీకులో లేదు; దాన్ని చేర్చడం ఎన్నిక మరియు కనికరం గురించిన వివాదాన్ని ముందుగానే ఒక దిశలో పరిష్కరిస్తుంది. మూలంలోని ఉద్దేశపూర్వక ఉద్రిక్తతను అలాగే ఉంచాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా వాక్య గంభీరతను మరియు మూలంలోని సమాంతర పునరుక్తిని నిలిపే శైలి. ‘కనికరించు’ మరియు ‘జాలి చూపు’ ద్వారా ἐλεέω, οἰκτίρω మధ్య పదభేదం కాపాడబడింది.
