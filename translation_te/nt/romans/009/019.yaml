  rationale: The sole substantive correction replaces 'తప్పుపడుతున్నాడు,' which can mean 'is making a mistake,' with 'నిందిస్తున్నాడు,' which faithfully represents μέμφεται, 'find fault with/blame.' 'చెబుతావు' is also a slightly more direct rendering of Ἐρεῖς ('you will say') while retaining the rhetorical future. No theological interpretation has been added.
