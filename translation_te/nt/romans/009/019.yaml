id: ROM.9.19
reference: Romans 9:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἐρεῖς ⸂μοι οὖν⸃· Τί ⸀οὖν ἔτι μέμφεται; τῷ γὰρ βουλήματι αὐτοῦ τίς ἀνθέστηκεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: te
  text: 'అయితే నీవు నాతో ఇలా చెబుతావు: “అలాగైతే ఆయన ఇంకా ఎందుకు నిందిస్తున్నాడు? ఎందుకంటే, ఆయన సంకల్పాన్ని[a] ఎవరు ఎదిరించారు?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “చిత్తాన్ని” లేదా “ఉద్దేశాన్ని.” గ్రీకు βούλημα అనే పదానికి సంకల్పం, చిత్తం, ఉద్దేశం అనే అర్థాలు ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: నీవు ... అంటావు
  rationale: భవిష్యత్ సూచక క్రియ ఇక్కడ పౌలు ముందుగానే ఊహిస్తున్న అభ్యంతరాన్ని పరిచయం చేస్తుంది; తెలుగులో ‘అంటావు’ సహజంగా ఆ వాక్చాతుర్య ప్రయోగాన్ని నిలుపుతుంది.
- source_word: μοι
  choice: నాతో
  rationale: దత్తి విభక్తిలోని పరోక్ష కర్మను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: οὖν ... οὖν
  choice: అయితే ... అలాగైతే
  rationale: రెండు οὖν పదాలూ వాదనలోని అనుమానాత్మక-నిగమన పురోగతిని సూచిస్తాయి; పునరుక్తి కఠినంగా వినిపించకుండా తెలుగులో సమానార్థక అనుసంధానాలతో రెండింటినీ నిలిపాం.
- source_word: Τί οὖν ἔτι μέμφεται
  choice: అలాగైతే ఆయన ఇంకా ఎందుకు తప్పుపడుతున్నాడు?
  rationale: τί ఇక్కడ నిందించడానికి కారణమేమిటని అడిగే ‘ఎందుకు’ అనే భావంలో ఉంది; ἔτι ను ‘ఇంకా’ అని, μέμφεται ను నింద లేదా తప్పు మోపడం అనే భావాన్ని మృదువుచేయకుండా ‘తప్పుపడుతున్నాడు’ అని అనువదించాం.
- source_word: τῷ ... βουλήματι αὐτοῦ
  choice: ఆయన సంకల్పాన్ని
  rationale: βούλημα నిర్ణయించబడిన ఉద్దేశం, సంకల్పం లేదా చిత్తాన్ని సూచించగలదు. ‘సంకల్పం’ దైవ ఉద్దేశ భావాన్ని అందిస్తూనే ఒక నిర్దిష్ట సిద్ధాంత వ్యాఖ్యానాన్ని బలవంతంగా చేర్చదు.
- source_word: τίς ἀνθέστηκεν
  choice: ఎవరు ఎదిరించారు?
  rationale: τίς లోని ప్రశ్నార్థకతను, ἀνθέστηκεν లోని సంపూర్ణ కాలపు ప్రతిఘటన భావాన్ని సరళంగా నిలుపుతుంది; ‘ఎదిరించగలిగారు’ అని సామర్థ్య భావాన్ని అదనంగా చేర్చలేదు.
theological_decisions:
- issue: దైవ సార్వభౌమత్వం–మానవ బాధ్యత సందర్భంలో βούλημα అనువాదం
  choice: ఆయన సంకల్పం
  alternative: ఆయన చిత్తం / ఆయన ఉద్దేశం
  rationale: ఈ వచనం దేవుని నిర్ణయానికీ మానవ బాధ్యతకీ మధ్య ఉన్న ఉద్రిక్తతను అభ్యంతర రూపంలో ఉంచుతుంది. ‘సంకల్పం’ గ్రీకు పదంలోని నిర్ణీత ఉద్దేశ భావాన్ని తెలియజేస్తుంది; అయితే ఆ ఉద్రిక్తతను ఏ ప్రత్యేక మతసిద్ధాంతానికి అనుకూలంగా పరిష్కరించదు.
translation_notes:
  register: సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ప్రామాణిక తెలుగు వాడబడింది. పౌలు ఊహిస్తున్న అభ్యంతర స్వరం, రెండు οὖν పదాల వాదనాత్మక పురోగతి, ప్రశ్నల తీవ్రత నిలుపబడ్డాయి.
