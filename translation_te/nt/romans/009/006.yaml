source:
  edition: SBLGNT
  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: te
  text: అయితే దేవుని వాక్యం విఫలమైనట్లు కాదు. ఎందుకంటే ఇశ్రాయేలు నుండి వచ్చినవారందరూ[a] ఇశ్రాయేలు[b] కారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఇశ్రాయేలు వంశంలో పుట్టినవారందరూ.’ గ్రీకు పదబంధం మూలాన్ని లేదా వంశాన్ని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ రెండవసారి వచ్చిన ‘ఇశ్రాయేలు’ అనే పేరు, ‘ఇశ్రాయేలు నుండి వచ్చినవారు’ అనే మొదటి ప్రస్తావనతో సమానమైన అర్థంలో ఉపయోగించబడలేదు. ఈ భేదం యొక్క ఖచ్చిత పరిధిని ఈ వాక్యం ఇక్కడ వివరించదు.
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: అయితే ... అయినట్లు కాదు
  rationale: ముందటి సందర్భం వల్ల కలగగల అపోహను సరిదిద్దే గ్రీకు నిషేధ వాక్యరూపాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐκπέπτωκεν
  choice: విఫలమైనట్లు
  rationale: సంభవించిన చర్య ఫలితంగా కొనసాగుతున్న స్థితిని సూచించే పరిపూర్ణ కాలరూపాన్ని సందర్భానుసారంగా తెలియజేస్తుంది; దేవుని వాక్యం నెరవేరకుండా పోయిందనే భావాన్ని నిరాకరిస్తుంది.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: దేవుని వాక్యం
  rationale: λόγος అనే విస్తృత పదాన్ని ‘వాగ్దానం’గా కుదించకుండా, మూలంలోని రూపాన్నీ భావపరిధినీ నిలుపుతుంది.
- source_word: οὐ γὰρ πάντες
  choice: ఎందుకంటే ... అందరూ ... కారు
  rationale: γάρ ముందటి నిరాకరణకు కారణాన్ని వివరిస్తుంది; తెలుగు వాక్యనిర్మాణంలో సహజంగా ఉండేలా నిషేధాన్ని వాక్యాంతంలో ఉంచింది.
- source_word: οἱ ἐξ Ἰσραήλ
  choice: ఇశ్రాయేలు నుండి వచ్చినవారు
  rationale: ἐξ సూచించే మూలం లేదా వంశోత్పత్తి భావాన్ని అతి వ్యాఖ్యానం చేయకుండా నిలుపుతుంది.
- source_word: οὗτοι Ἰσραήλ
  choice: ఇశ్రాయేలు కారు
  rationale: గ్రీకులోని సంక్షిప్త సమానార్థక నిర్మాణాన్ని తెలుగులో సహజంగా పూర్తి చేస్తూ, ‘ఇశ్రాయేలు’ అనే పేరుకు పౌలు చేస్తున్న కఠినమైన భేదాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ‘ఇశ్రాయేలు’ అనే రెండవ ప్రస్తావన యొక్క అర్థం
  choice: మొదటి ప్రస్తావనకంటే సంకుచితమైన నిబంధనసంబంధమైన లేదా దైవశాస్త్ర సంబంధమైన భావాన్ని సూచిస్తున్నట్లు పాఠ్యాన్ని తెరవుగా ఉంచడం
  alternative: జాతిపరమైన ఇశ్రాయేలులో ఎన్నికైనవారు మాత్రమే; లేదా మరింత విస్తృతంగా దేవుని నిజమైన ప్రజలు
  rationale: పౌలు ఇక్కడ శారీరక వంశం ఒక్కటే దేవుని రక్షణ ఉద్దేశంలోని ‘ఇశ్రాయేలు’ భావాన్ని పూర్తిగా నిర్ణయించదని చెబుతున్నాడు. అయితే దాని ఖచ్చిత పరిధిని ప్రధాన పాఠ్యంలో నిర్ణయించకుండా మూలంలోని దైవశాస్త్ర ఉద్రిక్తతను నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే సహజమైన, గౌరవప్రదమైన శైలి. ‘దేవుని వాక్యం’ అనే సాంప్రదాయబద్ధమైన కానీ ఇప్పటికీ సులభంగా అర్థమయ్యే రూపం నిలుపబడింది. రెండు పాదసూచిక గుర్తులూ ప్రధాన పాఠ్యంలో సంబంధిత పదాల వెంట ఉన్నాయి.
