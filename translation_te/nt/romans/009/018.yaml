    rationale: The latter is standard natural Telugu for extending mercy and accurately renders ἐλεεῖ.
  - severity: low
    issue: The footnote marker for the hardening note is separated from its referent.
    rationale: Marker b should immediately follow “కఠినపరుస్తాడు,” the word explained by the note.
