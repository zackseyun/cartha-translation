  to: కాబట్టి[a], ఆయన ఎవరిపై కనికరం చూపాలని కోరుకుంటాడో వారిపై కనికరం చూపుతాడు; ఎవరిని కఠినపరచాలని కోరుకుంటాడో వారిని కఠినపరుస్తాడు.[b]
