  text: ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: te
  text: కాబట్టి[a], ఆయన ఎవరిపై కనికరం చూపాలని కోరుకుంటాడో వారిపై కనికరం చూపుతాడు; ఎవరిని కఠినపరచాలని కోరుకుంటాడో వారిని కఠినపరుస్తాడు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘అందుచేత’ లేదా ‘అలా అయితే’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘కఠినపరుస్తాడు’ అనే మాటను ‘మొండిగా చేస్తాడు’ లేదా ‘మొండితనంలో నిలిపేస్తాడు’ అని కూడా అనువదించవచ్చు. గ్రీకులో క్రియ క్రియాశీల రూపంలో ఉంది; కాబట్టి దాన్ని కేవలం ‘కఠినపడనిస్తాడు’ అని మృదువుగా అనువదించకూడదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: అందుచేత
  rationale: ఈ రెండు అనుమానార్థక అవ్యయాలు ముందున్న వాదననుంచి పౌలు తీసే నిర్ధారణను బలపరుస్తాయి. ‘అందుచేత’ ఆధునిక తెలుగులో సహజంగా ఉండి ఆ నిర్ధారణ భావాన్ని నిలుపుతుంది.
- source_word: ὃν θέλει
  choice: ఎవరిని … అనుకుంటాడో వారిని
  rationale: θέλειలోని సంకల్ప భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేయడానికి ‘ఎవరిని … అనుకుంటాడో వారిని’ అనే నిర్మాణం వాడబడింది. రెండు వాక్యభాగాల్లో దీన్ని పునరావృతం చేయడం గ్రీకు సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: ἐλεεῖ
  choice: కనికరిస్తాడు
  rationale: ఈ క్రియ కనికరం లేదా దయ చూపడాన్ని సూచిస్తుంది. ‘కనికరిస్తాడు’ సంక్షిప్తంగా, సహజంగా క్రియాశీల భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: ὃν δὲ θέλει
  choice: ఎవరిని … అనుకుంటాడో వారిని
  rationale: δέ రెండు చర్యల మధ్య వ్యత్యాసాన్ని సూచిస్తుంది. తెలుగులో అర్ధవిరామంతో రెండవ సమాంతర వాక్యభాగాన్ని ఉంచడం ద్వారా ఆ వ్యత్యాసం సహజంగా స్పష్టమవుతుంది.
- source_word: σκληρύνει
  choice: కఠినపరుస్తాడు
  rationale: గ్రీకు క్రియ క్రియాశీల రూపంలో ఉండి ‘కఠినంగా చేస్తాడు’ లేదా ‘మొండిగా చేస్తాడు’ అనే భావం ఇస్తుంది. ‘కఠినపరుస్తాడు’ ఫరో కథనాలతో ఉన్న అంతర్గ్రంథ ప్రతిధ్వనిని, వాక్యంలోని ధార్మిక ఉద్రిక్తతను నిలుపుతుంది.
theological_decisions:
- issue: θέλειలో దైవ సంకల్పం
  choice: ఆయన కోరిన చర్యనే నేరుగా తెలిపే ‘…అనుకుంటాడో’ అనే రూపాన్ని ఉంచడం
  alternative: దీన్ని కేవలం అనుమతిగా లేదా నిష్క్రియ సమ్మతిగా వివరణాత్మకంగా మార్చడం
  rationale: గ్రీకు పాఠం రెండు వాక్యభాగాల్లోనూ ఆయన సంకల్పాన్ని నేరుగా చెబుతుంది. ముందస్తు నిర్ణయం, మానవ బాధ్యతల మధ్య ఉన్న చర్చను అనువాదం పరిష్కరించకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: σκληρύνειలో కర్తృత్వం
  choice: క్రియాశీలంగా ‘ఆయన … కఠినపరుస్తాడు’ అని అనువదించడం
  alternative: ‘కఠినపడనిస్తాడు’ లేదా ‘కఠినత్వానికి అప్పగిస్తాడు’
  rationale: మూలంలోని క్రియ క్రియాశీల రూపంలో ఉండి ఆ చర్యను నేరుగా కర్తకు ఆపాదిస్తుంది. కేవలం అనుమతిగా మృదువుచేయడం మూలపాఠాన్ని మించి వివరణ చేర్చినట్లవుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన శైలి వాడబడింది. ‘ఆయన’ అనే సర్వనామం సందర్భంలోని దేవుణ్ణి సూచిస్తుంది. రెండు వాక్యభాగాల సమాంతరతను, క్రియాశీల కర్తృత్వాన్ని, మూలంలోని ధార్మిక ఉద్రిక్తతను కాపాడాం.
