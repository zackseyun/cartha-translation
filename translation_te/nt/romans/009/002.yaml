  source_fidelity: 'The Telugu accurately conveys ὅτι as the content clause continuation from the preceding verse, and preserves the two coordinated expressions: μεγάλη λύπη (''గొప్ప దుఃఖం'') and ἀδιάλειπτος ὀδύνη (''ఎడతెగని వేదన''). ''నా హృదయంలో'' is a natural Telugu rendering of the Greek dative heart idiom without losing the biblical heart metaphor.'
  naturalness: The wording is natural modern standard Telugu with an appropriately solemn register. The paired emphatic coordination 'దుఃఖమూ ... వేదనా' reads smoothly, and the clause-final 'ఉన్నాయని' suitably reflects the verse's dependence on the preceding assertion.
  terminology: '''దుఃఖం'' and ''వేదన'' distinguish the two Greek terms well without overinterpreting either. ''హృదయం'' is an appropriate established biblical term and retains the source imagery.'
