id: ROM.9.2
reference: Romans 9:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅτι λύπη μοί ἐστιν μεγάλη καὶ ἀδιάλειπτος ὀδύνη τῇ καρδίᾳ μου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/002.yaml
  text: that I have great sorrow and unceasing pain in my heart[a][b][c].
translation:
  language: te
  text: నాకు గొప్ప దుఃఖమూ, నా హృదయంలో ఎడతెగని వేదనా ఉన్నాయని[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దుఃఖం’కు బదులు ‘శోకం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘వేదన’కు బదులు ‘మనోవేదన’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో అక్షరార్థంగా ‘నా హృదయానికి’ అని ఉంది; ఆ నుడికారాన్ని తెలుగులో సహజంగా ‘నా హృదయంలో’ అని అనువదించారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: అని
  rationale: మునుపటి వచనంలోని పౌలు చేసిన గంభీర ప్రకటనలోని విషయాన్ని పరిచయం చేస్తుంది. తెలుగులో వాక్యాంతంలోని ‘అని’ ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: λύπη
  choice: దుఃఖం
  rationale: లోతైన విచారాన్ని సూచించే సాధారణమైన, గంభీరమైన ఆధునిక తెలుగు పదం.
- source_word: μοί ἐστιν
  choice: నాకు ... ఉన్నాయి
  rationale: దత్తివ విభక్తి సర్వనామంతో εἰμί కలిసిన గ్రీకు ప్రయోగాన్ని, వ్యక్తి అనుభవిస్తున్న స్థితిగా తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: μεγάλη
  choice: గొప్ప
  rationale: దుఃఖం యొక్క తీవ్రతను నేరుగా వ్యక్తం చేస్తూ గ్రీకు విశేషణ బలాన్ని నిలుపుతుంది.
- source_word: καὶ
  choice: -మూ ... -నా
  rationale: రెండు సమాంతరమైన దుఃఖ వ్యక్తీకరణలను తెలుగు సముచ్చయ నిర్మాణంతో కలుపుతుంది.
- source_word: ἀδιάλειπτος
  choice: ఎడతెగని
  rationale: ఆగకుండా కొనసాగుతున్నదనే భావాన్ని సహజమైన తెలుగులో బలంగా తెలియజేస్తుంది.
- source_word: ὀδύνη
  choice: వేదన
  rationale: తీవ్రమైన అంతరంగ బాధను సూచిస్తుంది; శారీరక బాధకే పరిమితం కాకుండా సందర్భంలోని భావోద్వేగ తీవ్రతను నిలుపుతుంది.
- source_word: τῇ καρδίᾳ μου
  choice: నా హృదయంలో
  rationale: గ్రీకులో అక్షరార్థంగా ‘నా హృదయానికి’ ఉన్నప్పటికీ, అంతరంగ అనుభవాన్ని తెలుగులో సహజంగా చెప్పడానికి ‘నా హృదయంలో’ అని అనువదించబడింది; ‘హృదయం’ అనే బైబిలు రూపకం అలాగే ఉంచబడింది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి వాడబడింది. ఇది ముందరి వచనంలోని ప్రకటనను కొనసాగించే అసంపూర్ణ వాక్యభాగం కావడంతో, ὅτιని వాక్యాంత ‘అని’తో ప్రతిబింబించాం. ‘హృదయం’ అనే మూల రూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా నిలిపాం.
