id: ROM.9.1
reference: Romans 9:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: te
  text: నేను మెస్సీయలో[a] సత్యం చెబుతున్నాను; అబద్ధం చెప్పడం లేదు. పరిశుద్ధాత్మలో[c] నా మనస్సాక్షి నాతో కలిసి సాక్ష్యమిస్తుండగా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘క్రీస్తులో.’ గ్రీకు Χριστός అనే బిరుదు ‘మెస్సీయ’ అనే బిరుదుగానూ, ‘క్రీస్తు’ అనే పేరువంటి రూపంగానూ పనిచేయగలదు; ఇక్కడ దాన్ని బిరుదుగా అనువదించాం.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘నా మనస్సాక్షి నాతోపాటు సాక్ష్యమిస్తుండగా.’
    reason: lexical_alternative
  - marker: c
    text: ‘ఒక పవిత్రమైన ఆత్మలో’ అని కూడా అర్థం చేసుకునే అవకాశం ఉంది; అయితే పౌలు వాడుకలో ఇది పరిశుద్ధాత్మను సూచిస్తుందని గ్రహించడం అత్యంత సహజం.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: నేను సత్యం చెబుతున్నాను
  rationale: ἀλήθειαν λέγω అనే గ్రీకు నుడికారం ‘సత్యంగా మాట్లాడుతున్నాను’ అనే అర్థం ఇస్తుంది; ఈ తెలుగు రూపం గంభీరమైన ప్రకటనను సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: Χριστός అభిషిక్తుని సూచించే బిరుదుగా పనిచేయగలదు; ఇక్కడ దాని బిరుదు భావాన్ని ‘మెస్సీయ’ నిలుపుతుంది. ἐν ను ‘లో’గా ఉంచడం మూలంలోని సంబంధార్థక అస్పష్టతను కాపాడుతుంది.
- source_word: οὐ ψεύδομαι
  choice: అబద్ధం చెప్పడం లేదు
  rationale: వర్తమానకాలంలోని ప్రత్యక్ష నిరాకరణను ఆధునిక తెలుగులో సహజంగా, బలంగా తెలియజేస్తుంది.
- source_word: συμμαρτυρούσης
  choice: కూడా నాతోపాటు సాక్ష్యమిస్తోంది
  rationale: సమ్మేళన క్రియలోని συμ- (‘తోడుగా/కలిసి’) భావాన్ని నిలుపుతూ, genitive absolute నిర్మాణాన్ని తెలుగులో సహజమైన అనుబంధ వాక్యంగా అందిస్తుంది.
- source_word: τῆς συνειδήσεώς μου
  choice: నా మనస్సాక్షి
  rationale: పౌలు వాడుకలో συνείδησις కు ప్రామాణికమైన, సాధారణ పాఠకులకు స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: పరిశుద్ధాత్మలో
  rationale: పౌలు వాడుకలో ఇది పరిశుద్ధాత్మను సూచించడం అత్యంత సహజం. ‘లో’ అనే రూపం ἐν ను నిలుపుతుంది; దానిని సాధనార్థకమైన ‘ద్వారా’గా అతిగా నిర్ధారించదు.
theological_decisions:
- issue: πνεύματι ἁγίῳ యొక్క సూచిత వ్యక్తి
  choice: దైవిక పరిశుద్ధాత్మకు సూచన
  alternative: పవిత్రమైన మానవ ఆత్మ లేదా పవిత్ర స్వభావం
  rationale: పౌలు రచనల సందర్భంలో ‘పరిశుద్ధాత్మ’ అనే దైవిక సూచనే అత్యంత సహజం; అయితే గ్రీకులో article లేకపోవడం వల్ల సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచాం.
- issue: Χριστός యొక్క బిరుదు లేదా పేరువంటి వాడుక
  choice: బిరుదు భావంతో ‘మెస్సీయ’
  alternative: పేరువంటి సాంప్రదాయ రూపం ‘క్రీస్తు’
  rationale: ఇక్కడ Χριστός అభిషిక్తుని బిరుదుగా అర్థమయ్యేలా ఉంది; అయినా పౌలు వాడుకలో అది పేరువలె కూడా పనిచేయగల నిజమైన భాషాత్మక అవకాశాన్ని పాదటిప్పణి తెలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరతను నిలిపే శైలి. ‘మెస్సీయలో,’ ‘పరిశుద్ధాత్మలో’ అనే రూపాలు మూలంలోని ἐν ను కాపాడుతున్నాయి. వాక్యాంతంలోని గ్రీకు కామాను తెలుగులో పూర్తి వాక్యంగా ముగించాం; 9:2తో భావసంబంధం సందర్భంలో కొనసాగుతుంది.
