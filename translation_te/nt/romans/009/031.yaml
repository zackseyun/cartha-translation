  text: Ἰσραὴλ δὲ διώκων νόμον δικαιοσύνης εἰς ⸀νόμον οὐκ ἔφθασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/031.yaml
  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: te
  text: అయితే, నీతి[a]కి సంబంధించిన ధర్మశాస్త్రాన్ని వెంబడిస్తూ ఉన్న ఇశ్రాయేలు ఆ ధర్మశాస్త్రాన్ని చేరుకోలేదు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “న్యాయం”: “న్యాయానికి సంబంధించిన ధర్మశాస్త్రం.”'
    reason: δικαιοσύνη అనే గ్రీకు పదానికి ‘నీతి’తో పాటు ‘న్యాయం’ అనే భావం కూడా ఉండవచ్చు.
  - marker: b
    text: లేదా “దానిని అందుకోలేదు,” లేక “ధర్మశాస్త్రం వరకు చేరుకోలేదు.” గ్రీకు పదబంధం సంక్షిప్తంగా ఉండి, దాని నిర్మాణం క్లిష్టంగా ఉంది.
    reason: εἰς νόμον οὐκ ἔφθασεν అనే గ్రీకు వాక్యభాగం పునరుక్త νόμον‌తో సంక్షిప్తంగా ఉంది; ‘చేరడం’ మరియు ‘సాధించడం’ రెండింటి ఛాయలు సాధ్యమే.
lexical_decisions:
- source_word: Ἰσραήλ
  choice: ఇశ్రాయేలు
  rationale: తెలుగులో స్థిరపడిన బైబిలు సంబంధిత నామరూపం; పౌలు వాదనలో ఇక్కడ జాతిపరమైన ఇశ్రాయేలును సూచిస్తుంది.
- source_word: δέ
  choice: అయితే
  rationale: ముందటి వచనంలో అన్యజనుల గురించి చెప్పినదానికి ఇక్కడ ఉన్న వ్యత్యాసాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: διώκων
  choice: వెంబడించిన
  rationale: లక్ష్యాన్ని చురుకుగా అనుసరించడం అనే క్రియార్థాన్ని నిలుపుతుంది; గ్రీకులో స్పష్టంగా లేని concessive భావాన్ని ‘అయినప్పటికీ’ అని చేర్చదు.
- source_word: νόμον δικαιοσύνης
  choice: నీతికి సంబంధించిన ధర్మశాస్త్రం
  rationale: δικαιοσύνης అనే సంబంధవిభక్తి పదబంధంలోని ఉద్దేశపూర్వక అస్పష్టతను సాధ్యమైనంతవరకు కాపాడుతుంది; ‘నీతి కలిగించే ధర్మశాస్త్రం’ అని ఫలితార్థాన్ని జోడించదు. νόμος‌కు పౌలు సందర్భానికి తగిన ‘ధర్మశాస్త్రం’ వాడబడింది.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: పౌలు రచనల్లో దేవుని ఎదుట సరైన స్థితి మరియు న్యాయసంబంధ భావ పరిధిని కలిగిన ప్రామాణిక తెలుగు పదం; ‘న్యాయం’ అనే సాధ్యమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: εἰς νόμον
  choice: ఆ ధర్మశాస్త్రాన్ని
  rationale: ముందు పేర్కొన్న νόμον‌ను తిరిగి సూచించే భావాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘ధర్మశాస్త్ర లక్ష్యాన్ని’ వంటి వివరణాత్మక విస్తరణను నివారిస్తుంది.
- source_word: οὐκ ἔφθασεν
  choice: చేరుకోలేదు
  rationale: ఉద్దేశించిన గమ్యాన్ని లేదా లక్ష్యాన్ని అందుకోలేకపోవడాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘సంపాదించలేదు’ కంటే గ్రీకు చేరుకునే రూపకాన్ని మెరుగ్గా నిలుపుతుంది.
theological_decisions:
- issue: పౌలు సందర్భంలో δικαιοσύνη అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ సందర్భంలో పౌలు వాదన దేవుని ఎదుట సరైన స్థితితో ప్రధానంగా ముడిపడి ఉన్నందున ‘నీతి’ సరిపోతుంది; అయినా పదానికి ఉన్న ‘న్యాయం’ భావాన్ని పాదసూచికలో భద్రపరచడం ద్వారా భావపరిధిని కుదించలేదు.
- issue: νόμον δικαιοσύνης లోని సంబంధం
  choice: నీతికి సంబంధించిన ధర్మశాస్త్రం
  alternative: నీతి కలిగించే ధర్మశాస్త్రం; నీతియుక్తమైన ధర్మశాస్త్రం
  rationale: గ్రీకు సంబంధవిభక్తి ధర్మశాస్త్రం నీతికి ఎలా సంబంధించినదో పూర్తిగా నిర్దేశించదు. అందువల్ల కారణం, ఫలితం లేదా గుణం అనే ఒకే వ్యాఖ్యానాన్ని మూలపాఠ్యంలో ఖరారు చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు, గౌరవప్రదమైన సాధారణ బైబిలు శైలి. ‘ధర్మశాస్త్రం’ పౌలు సందర్భంలో νόμος‌కు సుపరిచితమైన పదం. మూలంలోని వ్యత్యాసాన్ని ‘అయితే’తో చూపించి, గ్రీకులో స్పష్టంగా లేని ‘అయినప్పటికీ’ అనే concessive భావాన్ని చేర్చలేదు. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉంచబడ్డాయి.
