lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: అంటే మనలనే
  rationale: οὓς అనే సంబంధ సర్వనామం ముందటి వచనంలోని ‘కరుణాపాత్రలు’ను సూచిస్తుండగా, ἡμᾶς వాటిని ‘మనమే’ అని స్పష్టం చేస్తుంది. సహజమైన తెలుగులో ఈ సంబంధాన్ని, ఉద్ఘాటనను ‘అంటే మనలనే’ తెలియజేస్తుంది.
- source_word: καὶ ἐκάλεσεν
  choice: ఆయన పిలిచాడు
  rationale: καλέωకు పౌలు రచనల్లో ఉన్న ప్రాముఖ్యమైన ‘పిలుచుట’ భావాన్ని నిలుపుతుంది. గ్రీకులోని καίకు ఉన్న అదనపు/ఉద్ఘాటన భావం మొత్తం వాక్య నిర్మాణంలో వ్యక్తమవుతుంది; విడిగా ‘కూడా’ చేరిస్తే తెలుగులో తరువాతి ‘కూడా’తో అనవసర పునరుక్తి కలుగుతుంది.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: మాత్రమే కాదు ... కూడా
  rationale: రెండు సమూహాలను సమతూకంగా కలిపే గ్రీకు సహసంబంధ నిర్మాణానికి సహజమైన తెలుగు సమానం.
- source_word: ἐξ Ἰουδαίων
  choice: యూదులలో నుంచి
  rationale: ἐξ ఇక్కడ ఒక సమూహం నుంచి ఎంపిక/మూలాన్ని సూచిస్తుంది. ‘యూదులలో నుంచి’ అనే రూపం ప్రజాసమూహాన్ని స్పష్టంగా సూచిస్తుంది.
- source_word: ἐξ ἐθνῶν
  choice: అన్యజనులలో నుంచి
  rationale: యూదులకు విరుద్ధంగా ἔθνη ఇక్కడ యూదేతర ప్రజలను సూచిస్తుంది. ‘అన్యజనులు’ ఈ సందర్భంలోని యూదు–యూదేతర వ్యత్యాసాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: మునుపటి వచనంలోని కరుణాపాత్రలతో సంబంధాన్ని నిలుపుట
  choice: అంటే మనలనే ఆయన పిలిచాడు
  alternative: ఆయన పిలిచినవారిని, అంటే మనలను
  rationale: వాక్యం మునుపటి వచనంపై వ్యాకరణపరంగా ఆధారపడుతుందని తెలియజేస్తూనే, ‘మనలను’ కరుణాపాత్రలుగా గుర్తించే పౌలు ఉద్ఘాటనను నిలుపుతుంది; ఎన్నిక గురించిన చర్చలను వాక్యం చెప్పినదానికంటే ఎక్కువగా పరిష్కరించదు.
- issue: ἐθνῶνను రక్షణ-చరిత్రలోని యూదు/యూదేతర వ్యత్యాసంలో అనువదించడం
  choice: అన్యజనులు
  alternative: జనాలు / దేశాలు
  rationale: వెంటనే ఉన్న Ἰουδαίωνతో వ్యత్యాసం కారణంగా ఇది సాధారణ దేశాలను కాక యూదేతర ప్రజలను సూచిస్తుంది. ‘అన్యజనులు’ ఆ చారిత్రక-జాతిపరమైన వ్యత్యాసాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని మునుపటి వచనంతో కొనసాగే అసంపూర్ణ వాక్య ప్రవాహాన్ని చివరి దీర్ఘ విరామచిహ్నంతో నిలిపి ఉంచింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
