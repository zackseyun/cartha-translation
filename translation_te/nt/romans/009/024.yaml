  rationale: ‘ఆయన పిలిచినవారమైన మనలను కూడా’ οὓς καὶ ἐκάλεσεν ἡμᾶς యొక్క సంబంధాన్ని, ‘మనలను’ అనే స్పష్టీకరణను, మరియు καί యొక్క అనుసంధాన/చేర్పు భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది. ‘మనలనే’ వల్ల కలిగే ప్రత్యేకత భావాన్ని తొలగించబడింది. రెండు పాదసూచిక గుర్తులు పాఠ్యంలో ఉంచబడ్డాయి; చివరి డాష్ మూలంలోని మునుపటి, తరువాతి ప్రవాహంతో ఉన్న అనుసంధానాన్ని సూచిస్తుంది.
