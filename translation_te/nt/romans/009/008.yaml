id: ROM.9.8
reference: Romans 9:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: te
  text: అంటే, శరీరసంబంధమైన పిల్లలు[a] దేవుని పిల్లలు కారు; వాగ్దానపు పిల్లలే సంతానంగా పరిగణించబడతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సహజ వంశం ద్వారా పుట్టిన పిల్లలు.’ గ్రీకులో అక్షరార్థంగా, ‘శరీరపు పిల్లలు.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘వంశసంతానంగా లెక్కించబడతారు.’ ఇక్కడ ‘సంతానం’ అని అనువదించిన గ్రీకు పదం స్పెర్మా; ఈ సందర్భంలో అది వారసులను లేదా వంశస్థులను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: అంటే
  rationale: ముందటి మాటకు పౌలు ఇస్తున్న వివరణను సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: τὰ τέκνα τῆς σαρκὸς
  choice: శరీరసంబంధమైన పిల్లలు
  rationale: శారీరక లేదా సహజ వంశపరంపరను సూచించే పౌలు మాటను నిలుపుతూ, తెలుగులో అర్థమయ్యేలా ఉంది.
- source_word: τέκνα τοῦ θεοῦ
  choice: దేవుని పిల్లలు
  rationale: τέκνα యొక్క లింగ సమావేషక అర్థాన్ని, దేవునితో సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τὰ τέκνα τῆς ἐπαγγελίας
  choice: వాగ్దానానికి సంబంధించిన పిల్లలు
  rationale: వీరు కేవలం ‘వాగ్దానం చేయబడిన పిల్లలు’ అనే భావం కాకుండా, దేవుని వాగ్దానం ద్వారా నిర్వచించబడిన పిల్లలు అనే గ్రీకు సంబంధాన్ని కాపాడుతుంది.
- source_word: λογίζεται εἰς σπέρμα
  choice: సంతానంగా పరిగణించబడతారు
  rationale: λογίζεται యొక్క లెక్కింపబడటం/గుర్తింపబడటం అనే భావాన్ని, σπέρμα యొక్క వంశసంతతి అర్థాన్ని స్పష్టమైన తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: సహజ వంశసంతతికీ వాగ్దానం ద్వారా గుర్తించబడే సంతానానికీ మధ్య పౌలు చూపే భేదం
  choice: మూలపాఠంలోని భేదాన్ని మాత్రమే అనువదించి, ‘వాగ్దానానికి సంబంధించిన పిల్లలు’ దేవుని సంతానంగా పరిగణించబడతారని తెలిపింది.
  alternative: దీనిని కేవలం సమూహ-చారిత్రక భావంగా గానీ, వ్యక్తిగత ముందస్తు నిర్ణయ సిద్ధాంతంగా గానీ అనువాదంలో స్పష్టీకరించడం.
  rationale: గ్రీకు వాక్యం విస్తృత సిద్ధాంత వివాదాన్ని స్వయంగా పరిష్కరించదు; అందువల్ల దాని సహజమైన ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. ‘శరీరసంబంధమైన’ అనే పదం పౌలు వాడిన రూపకాన్ని నిలుపుతూ వంశపరమైన భావాన్ని సూచిస్తుంది. అన్ని పాదసూచిక గుర్తులు ప్రధాన వచనంలో చేర్చబడ్డాయి.
