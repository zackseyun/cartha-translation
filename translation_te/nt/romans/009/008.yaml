  terminology: “శరీరసంబంధమైన పిల్లలు,” “దేవుని పిల్లలు,” and “సంతానంగా పరిగణించబడతారు” are suitable renderings. The revised wording uses “వాగ్దానపు పిల్లలు” for τέκνα τῆς ἐπαγγελίας, preserving the established Pauline contrast without over-explaining it.
