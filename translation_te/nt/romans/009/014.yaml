  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; μὴ ἀδικία παρὰ τῷ θεῷ; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/014.yaml
  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: te
  text: అయితే మనం ఏమి చెప్పాలి? దేవుని పక్షాన అన్యాయం ఉందా?[a] ఎంతమాత్రమూ లేదు![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘అధర్మం.’
    reason: lexical_alternative
  - marker: b
    text: 'గ్రీకు భావం: ‘అది ఎన్నటికీ జరగకూడదు!’ ఇది అత్యంత బలమైన తిరస్కారం; ‘ఎట్టి పరిస్థితుల్లోనూ కాదు!’ అని కూడా అనువదించవచ్చు.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: అయితే మనం ఏమనాలి?
  rationale: పౌలు ఒక నిర్ధారణను లేదా అభ్యంతరాన్ని ప్రవేశపెట్టడానికి వాడే సాధారణ సంధికాల వాక్యాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; ἐροῦμεν లోని ఆలోచనాత్మక భావాన్ని కాపాడుతుంది.
- source_word: μὴ
  choice: ఉందా?
  rationale: ప్రతికూల సమాధానాన్ని ఆశించే గ్రీకు ప్రశ్నార్థక కణాన్ని తెలుగులో సహజమైన అలంకారప్రశ్నగా వ్యక్తం చేస్తుంది.
- source_word: ἀδικία
  choice: అన్యాయం
  rationale: ఈ సందర్భంలో దేవుని వ్యవహారాల్లో న్యాయవిరుద్ధత ఉందనే అభ్యంతరమే ప్రధాన భావం; ‘అన్యాయం’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి నైతిక-న్యాయ భావాన్ని నిలుపుతుంది.
- source_word: παρὰ τῷ θεῷ
  choice: దేవునిలో
  rationale: దేవుని వద్ద లేదా దేవుని పక్షాన అన్యాయం ఉందా అనే భావాన్ని సంక్షిప్తంగా తెలుగులో తెలియజేస్తుంది; దేవుడే అన్యాయస్థుడని వివరణాత్మకంగా మార్చకుండా మూలంలోని నామవాచక నిర్మాణాన్ని నిలుపుతుంది.
- source_word: μὴ γένοιτο
  choice: ఎంతమాత్రమూ లేదు!
  rationale: గ్రీకులోని బలమైన తిరస్కారాన్ని సహజమైన, ప్రస్తుత తెలుగు వాడుకలో గట్టిగా వ్యక్తం చేస్తుంది; పదక్షరార్థమైన ఆశీర్వచన రూపాన్ని కృత్రిమంగా అనుకరించదు.
theological_decisions:
- issue: రోమా 9 సందర్భంలో దేవుని న్యాయం గురించిన అభ్యంతరాన్ని ఏదైనా నిర్దిష్ట సిద్ధాంత వ్యవస్థ ప్రకారం విస్తరించాలా?
  choice: దేవునిలో అన్యాయం ఉందా అనే అలంకారప్రశ్నను, దానికి పౌలు ఇచ్చే బలమైన తిరస్కారాన్ని మాత్రమే అనువదించడం.
  alternative: ‘దేవుడు అన్యాయస్థుడా?’ అని మరింత వ్యాఖ్యానాత్మకంగా చెప్పడం, లేదా ఎన్నిక, తిరస్కరణ, దైవ న్యాయం గురించి వివరణను చేర్చడం.
  rationale: గ్రీకు వాక్యం అభ్యంతరాన్నీ దాని తిరస్కారాన్నీ క్లుప్తంగా ఉంచుతుంది. అదనపు సిద్ధాంత వివరణ లేకుండా అదే ఉద్వేగాన్నీ భావసాంద్రతనూ నిలుపడం సముచితం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గౌరవప్రదమైన బైబిలు శైలిలో. మూలంలోని రెండు అలంకారప్రశ్న/తిరస్కార ఘట్టాల క్లుప్తతను కాపాడింది.
