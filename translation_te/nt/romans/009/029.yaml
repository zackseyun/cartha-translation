- from: యెషయా ఇంతకుముందే చెప్పినట్లుగా, “సైన్యాలకు అధిపతియైన ప్రభువు[a] మనకు సంతానాన్ని[b] మిగిల్చి ఉండకపోతే, మనం సొదొమలా అయిపోయేవాళ్లం, గొమొర్రాలా చేయబడేవాళ్లం.”[c]
