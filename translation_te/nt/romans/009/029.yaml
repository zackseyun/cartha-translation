  - severity: low
    issue: The second result clause is stylistically awkward.
    rationale: '''గొమొర్రాలా చేయబడేవాళ్లం'' is understandable but less idiomatic. Adding ''అయి'' makes the passive-comparative sense explicit and readable.'
