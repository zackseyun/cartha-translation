id: ROM.9.29
reference: Romans 9:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: te
  text: మరియు యెషయా ఇంతకుముందే చెప్పినట్లుగా, “సైన్యాల ప్రభువు[a] మనకు సంతానాన్ని[b] మిగిల్చి ఉండకపోతే, మనం సొదొమలా అయిపోయేవాళ్లం, గొమొర్రాలా అయి చేయబడేవాళ్లం.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ప్రభువు సబయోతు.” గ్రీకు Σαβαώθ అనేది సాధారణంగా “సైన్యాల ప్రభువు” లేదా “సైన్యాల అధిపతి” అని అనువదించే హెబ్రీ దైవ బిరుదు యొక్క లిప్యంతరీకరణ.
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా “విత్తనం.” ఇక్కడ జీవించి మిగిలిన సంతానం లేదా వారసులను సూచిస్తుంది.
    reason: lexical_alternative
  - marker: c
    text: యెషయా 1:9 నుండి ఉల్లేఖనం.
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς
  choice: చెప్పినట్లుగా
  rationale: ముందున్న వాక్యంతో పోలికను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: προείρηκεν
  choice: ఇంతకుముందే చెప్పిన
  rationale: ముందుగా పలికిన మాట ఇప్పటికీ ప్రాసంగికమనే పరిపూర్ణకాల భావాన్ని, ప్రవచించాడని అతిగా నిర్ధారించకుండా తెలియజేస్తుంది.
- source_word: κύριος Σαβαὼθ
  choice: సైన్యాలకు అధిపతియైన ప్రభువు
  rationale: Σαβαώθ వెనుకనున్న దైవ బిరుదు అర్థాన్ని తెలుగులో స్పష్టంగా అందిస్తూ κύριοςను ‘ప్రభువు’గా ఉంచుతుంది.
- source_word: ἐγκατέλιπεν
  choice: మిగిల్చి ఉండకపోతే
  rationale: వెనుక మిగిల్చడం లేదా నిలిచి ఉండేలా చేయడం అనే సందర్భార్థాన్ని షరతు నిర్మాణంలో సహజంగా అందిస్తుంది.
- source_word: σπέρμα
  choice: సంతానం
  rationale: అక్షరార్థం ‘విత్తనం’; ఇక్కడ జీవించి మిగిలిన వారసులు లేదా సంతతిని సూచిస్తుంది. ‘శేషం’ అని అనువదించడం మూలపదం కంటే వ్యాఖ్యానాన్ని ముందుకు తెస్తుంది.
- source_word: ἂν ἐγενήθημεν
  choice: అయిపోయేవాళ్లం
  rationale: జరగని గత షరతు ఫలితాన్ని, γίνομαιలోని ‘అవడం’ భావాన్ని సహజ తెలుగులో నిలుపుతుంది.
- source_word: ἂν ὡμοιώθημεν
  choice: చేయబడేవాళ్లం
  rationale: ὁμοιόω యొక్క కర్మణి భావాన్ని మొదటి క్రియతో కలిపివేయకుండా ప్రత్యేకంగా నిలుపుతుంది.
theological_decisions:
- issue: పాత నిబంధన ఉల్లేఖనంలోని κύριος Σαβαώθ దైవ బిరుదు
  choice: సైన్యాలకు అధిపతియైన ప్రభువు
  alternative: ప్రభువు సబయోతు; సైన్యాల ప్రభువు
  rationale: గ్రీకు పాఠంలో హెబ్రీ బిరుదు లిప్యంతరీకరించబడింది. దాని అర్థాన్ని అనువదించడం దైవ యోధ-రాజు బిరుదును స్పష్టంగా ఉంచుతుంది; అదే సమయంలో κύριοςకు ‘ప్రభువు’ వాడబడింది.
- issue: σπέρμαను ‘శేషం’గా అనువదించాలా
  choice: సంతానం
  alternative: విత్తనం; వారసులు; శేషం
  rationale: విస్తృత సందర్భంలో శేషజనుల భావం ఉన్నా, ఇక్కడి పదం σπέρμα. ‘సంతానం’ మూలపదానికి దగ్గరగా ఉండి, ప్రత్యేక సిద్ధాంత పదాన్ని పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవభరితమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే వాక్యనిర్మాణం. మూలంలోని రెండు వేర్వేరు ఫలిత క్రియలను ‘అయిపోయేవాళ్లం’ మరియు ‘చేయబడేవాళ్లం’గా వేరు చేసి నిలిపింది.
