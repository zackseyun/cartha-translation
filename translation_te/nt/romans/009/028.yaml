revisions:
- from: ఎందుకంటే ప్రభువు భూమిమీద[a] తన మాటను[b] నెరవేరుస్తాడు—దాన్ని పూర్తిచేసి, కుదించి ముగిస్తాడు[c].
  to: ఎందుకంటే ప్రభువు భూమిమీద[a] తన మాటను[b] పూర్తి చేసి, కుదించి నెరవేర్చుతాడు[c].
  rationale: The revision retains the explanatory γάρ (‘ఎందుకంటే’), the Lord’s carrying out of his spoken word, and the earth/land distinction. It separates ‘complete’ (συντελῶν) from ‘cut short’ (συντέμνων), without resolving the phrase into a narrower judicial or doctrinal interpretation.
