  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: te
  text: ఎందుకంటే ప్రభువు భూమిమీద[a] తన మాటను[b] పూర్తి చేసి, కుదించి నెరవేర్చుతాడు[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘భూమిమీద’ అనే మాటను కొందరు ‘దేశంలో’ అని అనువదిస్తారు; అది యెషయా గ్రంథంలోని మూల సందర్భాన్ని ప్రతిబింబిస్తుంది. అయితే రోమీయులకు పత్రికలోని గ్రీకు పాఠం ఇక్కడ ‘భూమిమీద’ అని ఉంది.
    reason: cross_reference
  - marker: b
    text: లేదా ‘ఆ విషయాన్ని’ లేదా ‘ఆ తీర్పును.’
    reason: lexical_alternative
  - marker: c
    text: ‘కుదించి’ అనే మాటకు ‘సంక్షిప్తం చేసి’ లేదా సందర్భార్థంగా ‘త్వరగా అమలు చేసి’ అనే భావం కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: తన మాటను
  rationale: ఇది ποιήσει అనే క్రియకు కర్మగా ఉండి, ప్రభువు పలికినదాన్ని ఆయన కార్యరూపంలో నెరవేర్చుతాడనే భావాన్ని ఇస్తుంది. ‘మాట’ అనేది పలుకబడిన ప్రకటన అనే భావాన్ని నిలుపుతుంది; ‘తన’ అనేది κύριος అనే కర్తనుబట్టి తెలుగులో సహజంగా సరఫరా చేయబడింది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే పౌలు వాదనా ప్రవాహాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: συντελῶν
  choice: దాన్ని పూర్తిచేసి
  rationale: ఏదైనా దాని ఉద్దేశిత ముగింపుకు తీసుకురావడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: καὶ συντέμνων
  choice: కుదించి ముగిస్తాడు
  rationale: సంక్షిప్తం చేయడం లేదా మధ్యలోనే ముగింపుకు తేవడం అనే పదంలోని బలమైన చిత్రాన్ని నిలుపుతుంది. ‘త్వరగా అమలు చేస్తాడు’ అని మాత్రమే అనువదించి వేగం అనే సందర్భార్థాన్ని మూలార్థం స్థానంలో పెట్టడం నివారించబడింది.
- source_word: ποιήσει
  choice: నెరవేరుస్తాడు
  rationale: λόγονతో కలిసి, ప్రభువు తాను పలికినదాన్ని కార్యరూపంలో అమలు చేస్తాడనే భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: ఉద్ధరణలో దేవుణ్ణి సూచించే సాధారణమైన, గౌరవప్రదమైన తెలుగు రూపం.
- source_word: ἐπὶ τῆς γῆς
  choice: భూమిమీద
  rationale: రోమీయులకు పత్రికలో ఉన్న గ్రీకు పదబంధం సాధారణంగా ‘భూమిమీద’ అనే విస్తృత భావాన్ని ఇస్తుంది; యెషయా మూల సందర్భాన్ని బట్టి దాన్ని ‘దేశంలో’ అని పరిమితం చేయలేదు.
theological_decisions:
- issue: యెషయా ఉద్ధరణలో దేవుని చర్య స్వభావం
  choice: ప్రభువు తాను పలికిన మాటను చరిత్రలో లేదా తీర్పులో నిర్ణయాత్మకంగా పూర్తిచేసి నెరవేరుస్తాడనే విస్తృత భావాన్ని నిలుపడం
  alternative: ప్రభువు న్యాయతీర్పును వేగంగా అమలు చేస్తాడు; లేదా తన రక్షణ/తీర్పు కార్యాన్ని పూర్తిచేసి సంక్షిప్తం చేస్తాడు
  rationale: జతగా ఉన్న రెండు అసమాపక క్రియలకు న్యాయతీర్పు ఛాయలు ఉండవచ్చు. అయినా గ్రీకు పాఠం స్పష్టంగా చెప్పనంత ప్రత్యేకమైన సిద్ధాంత పథకాన్ని అనువాదంలో చేర్చకుండా, ‘పూర్తిచేసి, కుదించి ముగిస్తాడు’ అనే ఉద్వేగాన్ని నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సాధారణ పాఠకులకు అర్థమయ్యేలా, గౌరవప్రదమైన శైలిని ఉపయోగించాం. మూలంలోని ‘పూర్తిచేయడం’ మరియు ‘కుదించడం’ మధ్య ఉన్న ఉద్దేశపూర్వక ఉద్వేగాన్ని పూర్తిగా సులభీకరించకుండా నిలిపాం.
