id: ROM.9.23
reference: Romans 9:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: te
  text: మరియు తన మహిమ యొక్క సంపదను, మహిమ కొరకు ఆయన ముందుగానే సిద్ధం చేసిన కరుణ పాత్రలపై, తెలియజేయడానికీ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: తన మహిమా సంపదను
  rationale: గ్రీకు వాక్యంలోని ‘ఆయన మహిమ యొక్క సంపద’ అనే భావాన్ని సహజమైన ఆధునిక తెలుగు సమాసంతో వ్యక్తం చేస్తుంది.
- source_word: ἐπὶ σκεύη ἐλέους
  choice: కరుణాపాత్రల మీద
  rationale: ἐπί యొక్క ‘మీద/పై’ భావాన్ని నిలుపుతూ, σκεύη అనే రూపకాన్ని ‘పాత్రలు’గా సంరక్షిస్తుంది.
- source_word: προητοίμασεν
  choice: ముందుగానే సిద్ధం చేశాడు
  rationale: προ- ఉపసర్గలోని పూర్వసిద్ధత భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: εἰς δόξαν
  choice: మహిమ కోసం
  rationale: εἰς సూచించే లక్ష్యం లేదా గమ్యాన్ని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Romans 9:22తో వాక్యనిర్మాణ సంబంధం
  choice: ‘కూడా ఆయన ఇలా చేశాడు’ అని అనువదించి, ముందటి వాక్యంతో సంబంధాన్ని సూచించడం
  alternative: ‘మరియు ... తెలియజేయడానికి’ అని అసంపూర్ణంగా కొనసాగించడం
  rationale: గ్రీకు καὶ ἵνα ముందటి సందర్భంపై ఆధారపడుతుంది. స్వతంత్ర వచనంగా చదవడానికి వీలుగా సంబంధాన్ని సూచించాం; దేవుని చర్య యొక్క ఖచ్చిత స్వరూపాన్ని అదనంగా నిర్వచించలేదు.
- issue: కరుణాపాత్రలను ఎవరు ముందుగా సిద్ధం చేశారు?
  choice: ‘ఆ పాత్రలను ఆయన ... సిద్ధం చేశాడు’
  alternative: కర్తను అస్పష్టంగా ఉంచడం
  rationale: ἃ προητοίμασεν లోని ఏకవచన కర్త సందర్భానుసారంగా దేవుడినే సూచిస్తుంది; ఈ వ్యాకరణ సంబంధాన్ని తెలుగులో స్పష్టం చేశాం.
- issue: ‘మహిమ’ యొక్క అర్థం
  choice: మహిమ
  alternative: మహిమలో భాగస్వామ్యం / రక్షణ
  rationale: δόξα యొక్క విస్తృతమైన ధార్మిక భావాన్ని అలాగే ఉంచి, దానిని ఒక నిర్దిష్ట సిద్ధాంతార్థానికి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘పాత్రలు’ అనే పౌలు రూపకాన్ని నిలిపాం. ఈ వచనం 9:22 వాక్యనిర్మాణానికి అనుసంధానమై ఉన్నందున ‘ఇలా చేశాడు’ అనే కనిష్ఠ సందర్భపూరణ వాడబడింది.
