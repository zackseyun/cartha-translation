  text: ὡς καὶ ἐν τῷ Ὡσηὲ λέγει· Καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: te
  text: 'ఆయన హోషేయ గ్రంథంలో కూడా ఇలా అంటున్నాడు: “నా ప్రజలు కానివారిని ‘నా ప్రజలు’ అని, ప్రేమించబడని ఆమెను ‘ప్రేమించబడినది’ అని పిలుస్తాను.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఇది హోషేయ 2:23 నుండి తీసుకున్న ఉల్లేఖనం. కొన్ని సంప్రదాయాల్లో వచన సంఖ్య భిన్నంగా ఉంటుంది. గ్రీకులో మొదటి పదబంధం వ్యాకరణపరంగా ఏకవచనంలో ఉన్నా, ‘ప్రజలు’ అనే పదం సమూహాన్ని సూచిస్తుంది. చివరి పదాన్ని ‘ప్రియమైనది’ అని కూడా అనువదించవచ్చు.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: కూడా ఇలా
  rationale: ముందున్న వాదనకు మద్దతుగా మరో లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే తులనాత్మక, అనుబంధ భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν τῷ Ὡσηὲ
  choice: హోషేయ గ్రంథంలో
  rationale: ఇది హోషేయ రచనలోని ఉల్లేఖనమని స్పష్టంగా చెబుతుంది; గ్రీకు citation formula భావాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: λέγει
  choice: ఆయన ... అంటున్నాడు
  rationale: గ్రీకులోని వ్యక్తిగత ఏకవచన క్రియను నిలుపుతూ, లేఖనంలో మాట్లాడుతున్న దేవుణ్ణి సూచిస్తుంది.
- source_word: Καλέσω
  choice: పిలుస్తాను
  rationale: καλέω యొక్క ప్రత్యక్ష అర్థాన్ని, అలాగే పేరు పెట్టడం లేదా తన ప్రజలుగా గుర్తించడం అనే నిబంధనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: τὸν οὐ λαόν μου
  choice: నా ప్రజలు కానివారిని
  rationale: గ్రీకు రూపం ఏకవచనమైనప్పటికీ λαός సమూహార్థకం; తెలుగులో బహువచన రూపం సహజంగా ఉండి పౌలు చెప్పే ప్రజాసమూహ భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: λαόν μου
  choice: నా ప్రజలు
  rationale: దేవునితో నిబంధన సంబంధాన్ని తెలిపే స్థిరమైన బైబిలీయ పదబంధాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: τὴν οὐκ ἠγαπημένην
  choice: ప్రేమించబడని ఆమెను
  rationale: హోషేయ నేపథ్యంలోని స్త్రీలింగ ఏకవచన సూచనను, అలాగే passive verbal భావాన్ని కాపాడుతుంది.
- source_word: ἠγαπημένην
  choice: ప్రేమించబడినది
  rationale: అదే ప్రేమ-పద కుటుంబాన్ని పునరావృతం చేస్తూ perfect passive participle భావాన్ని స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: హోషేయ ఉల్లేఖనంలో సమూహార్థం మరియు వ్యక్తిగత రూపం
  choice: మొదటి పదబంధాన్ని సహజమైన సమూహార్థంలో ‘నా ప్రజలు కానివారిని’ అని, రెండవదాన్ని స్త్రీలింగ ఏకవచనంగా ‘ప్రేమించబడని ఆమెను’ అని అనువదించడం.
  alternative: రెండు పదబంధాలనూ కఠిన ఏకవచనంలో అనువదించడం, లేదా ‘లో-అమ్మీ/లో-రుహామా’ వంటి పేర్లుగా చూపించడం.
  rationale: λαός స్వభావతః సమూహాన్ని సూచిస్తుంది; అదే సమయంలో రెండవ పదబంధంలోని స్త్రీలింగ రూపం హోషేయ నేపథ్యానికి ముఖ్యమైనది. ఈ అనువాదం రెండింటినీ కలిపివేయకుండా నిలుపుతుంది.
- issue: λέγει లో అంతర్భూత కర్త
  choice: ‘ఆయన ... అంటున్నాడు’ అని దేవుణ్ణి కర్తగా ఉంచడం.
  alternative: ‘అది ... చెబుతోంది’ అని లేఖనాన్ని అవ్యక్త కర్తగా చూపించడం.
  rationale: గ్రీకు క్రియ ఏకవచన వ్యక్తిగత citation style లో ఉంది; పౌలు లేఖనంలో దేవుడే మాట్లాడుతున్నాడనే రూపాన్ని ఇది సహజంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘ప్రేమించబడని/ప్రేమించబడినది’ అనే సమాంతర నిర్మాణం మూలంలోని పదప్రయోగ పునరావృతాన్ని కాపాడుతుంది. ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
