id: ROM.9.30
reference: Romans 9:30
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: te
  text: అయితే మనం ఏమని చెప్పాలి? నీతిని అనుసరించని అన్యజనులు[b] నీతిని పొందారు—అంటే, విశ్వాసం నుండి వచ్చే నీతినే.[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీతి’ అనే పదానికి ఇక్కడ, అలాగే ఈ వచనంలో అది వచ్చిన ఇతర చోట్ల, ‘న్యాయం’ అని కూడా అనువదించవచ్చు. δικαιοσύνη అనే గ్రీకు పదం నైతిక లేదా న్యాయపరమైన సరైనతతోపాటు నిబంధన సంబంధమైన న్యాయం అనే భావాన్నీ కలిగి ఉండవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘అన్యజనులు’కు బదులుగా ‘జాతులు’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: ‘విశ్వాసం నుండి వచ్చే నీతి’ని ‘విశ్వాసం ద్వారా వచ్చే నీతి’ అని కూడా అనువదించవచ్చు; ఈ సందర్భంలో తక్కువ సంభావ్యతతో, ‘విశ్వసనీయత నుండి వచ్చే నీతి’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: అయితే మనం ఏమని చెప్పాలి?
  rationale: పౌలు వాదనలో వచ్చే ఆలోచనాత్మక సంధి ప్రశ్నను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἔθνη
  choice: అన్యజనులు
  rationale: ఇక్కడ ఇశ్రాయేలుకు భిన్నమైన యూదేతర ప్రజలను సూచిస్తున్నందున, తెలుగు బైబిల్ వాడుకలో స్పష్టమైన పదం.
- source_word: τὰ μὴ διώκοντα
  choice: అనుసరించని
  rationale: διώκω యొక్క లక్ష్యాన్ని చురుకుగా వెంబడించే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది; గ్రీకు వర్తమాన అసమాపక క్రియలోని లక్షణాత్మక ధోరణిని సందర్భం మోస్తుంది.
- source_word: δικαιοσύνην
  choice: నీతి
  rationale: పౌలు వాడే δικαιοσύνη యొక్క నైతిక, న్యాయపరమైన, దేవునితో సరైన సంబంధానికి సంబంధించిన విస్తృతిని ఒకే సిద్ధాంత వివరణకు కుదించకుండా నిలుపుతుంది.
- source_word: κατέλαβεν
  choice: పొందారు
  rationale: వెంబడించని దానిని స్వాధీనం చేసుకోవడం లేదా చేరుకోవడం అనే సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: అది విశ్వాసం నుండి వచ్చే నీతి
  rationale: పునరుక్త నామవాచక పదబంధం పొందిన నీతి ఏ విధమైనదో నిర్దిష్టం చేస్తుంది. δέ ను తప్పనిసరిగా విరోధార్థక ‘కాని’గా కాక, వివరణాత్మక మలుపుగా వ్యక్తం చేసింది.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: πίστις కు సాధారణమైన అర్థాన్ని నిలుపుతూ, ‘విశ్వాసమాత్రమే’ వంటి మూలంలో లేని సిద్ధాంత విస్తరణను నివారిస్తుంది.
theological_decisions:
- issue: పౌలు వాదనలో δικαιοσύνη యొక్క అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘నీతి’
  alternative: న్యాయం; దేవుని ఎదుట సరైన స్థితి; నిబంధన సంబంధమైన సరైనత
  rationale: వచనం సిద్ధాంతపరమైన ప్రక్రియను పూర్తిగా వివరించదు. ‘నీతి’ అనే పదం దాని విస్తృతిని నిలుపుతూ, ఒక నిర్దిష్ట మతసంప్రదాయ వ్యాఖ్యకు కుదించదు.
- issue: ἐκ πίστεως యొక్క భావం
  choice: విశ్వాసం నుండి వచ్చే
  alternative: విశ్వాసం ద్వారా వచ్చే; విశ్వసనీయత నుండి వచ్చే
  rationale: ἐκ యొక్క మూలం/ఆధారం భావాన్ని నిలుపుతుంది; ‘విశ్వాసమాత్రం ద్వారా’ వంటి మూలపాఠ్యంలో లేని విస్తరణను చేర్చదు. ‘విశ్వసనీయత’ వ్యాకరణపరంగా సాధ్యమైనా ఈ సందర్భంలో తక్కువ సంభావ్యమైనది.
- issue: δικαιοσύνην δὲ τὴν ἐκ πίστεως లో δέ యొక్క పని
  choice: డాష్ తరువాత ‘అది’తో వివరణాత్మక నిర్దిష్టీకరణ
  alternative: ‘కాని విశ్వాసం నుండి వచ్చే నీతి’
  rationale: రెండవ ‘నీతి’ మొదటిదానికి భిన్నమైన ఫలితాన్ని చెప్పడం కంటే, పొందిన నీతి ఏదో నిర్దిష్టం చేస్తోంది. అయినా δέ లోని స్వల్ప మలుపును డాష్ నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘అన్యజనులు,’ ‘నీతి,’ ‘విశ్వాసం’ వంటి స్థిరమైన బైబిల్ పదాలను వాడినా వాక్య నిర్మాణాన్ని సహజంగా ఉంచింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
