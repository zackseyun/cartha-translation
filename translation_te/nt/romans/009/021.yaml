id: ROM.9.21
reference: Romans 9:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: te
  text: లేదా, కుమ్మరికి మట్టిపై[a] అధికారం లేదా—అదే మట్టి ముద్ద నుండి[b] ఒక పాత్రను గౌరవం కోసం, మరొక పాత్రను అగౌరవం కోసం[c] చేయడానికి?[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కుమ్మరికి మట్టిపై హక్కు లేదా?”
    reason: lexical_alternative
  - marker: b
    text: “అదే మట్టి ముద్ద నుండి” అనే మాటను “అదే మట్టి రాశి నుండి” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఒక పాత్రను గౌరవప్రదమైన ఉపయోగం కోసం, మరొక పాత్రను సాధారణ ఉపయోగం కోసం.”
    reason: alternative_reading
  - marker: d
    text: ఈ రూపకం యెషయా 29:16; 45:9; యిర్మీయా 18:1–6లోని కుమ్మరి–మట్టి రూపకాలను ప్రతిధ్వనింపజేస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: లేదా
  rationale: పౌలు వాదనలో తదుపరి అలంకారప్రశ్నను పరిచయం చేస్తుంది; అదనపు నొక్కి చెప్పడం లేకుండా అనుసంధానాన్ని నిలుపుతుంది.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: అధికారం లేదా?
  rationale: ఇది కేవలం సామర్థ్యాన్ని కాకుండా, న్యాయమైన అధికారాన్ని లేదా హక్కును సూచిస్తుంది.
- source_word: ὁ κεραμεὺς
  choice: కుమ్మరి
  rationale: మట్టితో పాత్రలు చేసే వృత్తిదారునికి సహజమైన ప్రామాణిక తెలుగు పదం; ప్రవక్తల గ్రంథాల్లోని కుమ్మరి–మట్టి రూపకాన్ని కూడా నిలుపుతుంది.
- source_word: τοῦ πηλοῦ
  choice: మట్టిపై
  rationale: ἐξουσίαతో ఉన్న సంబంధాన్ని సహజ తెలుగులో ‘మట్టిపై అధికారం’గా వ్యక్తం చేస్తుంది.
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: ఒకే మట్టి ముద్దలోనుంచి
  rationale: φύραμα కలిపి ఏర్పరచిన ముద్ద లేదా ద్రవ్యరాశిని సూచిస్తుంది; సందర్భంలోని మట్టిని స్పష్టంగా ఉంచుతూ ‘ముద్ద’ అనే రూపకాన్ని కాపాడుతుంది.
- source_word: ποιῆσαι
  choice: చేయడానికి
  rationale: సాధారణమైన ‘చేయు’ భావాన్ని నేరుగా, సహజంగా అందిస్తుంది.
- source_word: ὃ μὲν ... ὃ δὲ
  choice: ఒక పాత్రను ... మరొక పాత్రను
  rationale: రెండు విరుద్ధ ఫలితాల మధ్య గ్రీకు సహసంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: εἰς τιμὴν
  choice: ఘనత కోసం
  rationale: τιμήలోని గౌరవం/ఘనత భావాన్ని కార్యోపయోగంగా ముందే పరిమితం చేయకుండా నిలుపుతుంది.
- source_word: σκεῦος
  choice: పాత్ర
  rationale: కుమ్మరి రూపకంలో సహజమైన తెలుగు సమానార్థకం.
- source_word: εἰς ἀτιμίαν
  choice: అవమానం కోసం
  rationale: ἀτιμίαను τιμήకు నేర విరుద్ధమైన అవమానం/అగౌరవం భావంతో అనువదించి, ‘సాధారణ ఉపయోగం’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
theological_decisions:
- issue: కుమ్మరి యొక్క ἐξουσίαను ‘అధికారం’గా లేదా ‘హక్కు’గా అనువదించాలా
  choice: అధికారం
  alternative: హక్కు; శక్తి
  rationale: ‘అధికారం’ న్యాయమైన అధికార పరిధిని సూచిస్తుంది; దైవ సార్వభౌమాధికారం, మానవ బాధ్యతలపై విస్తృత సిద్ధాంత నిర్ణయాన్ని వాక్యంలోకి దిగుమతి చేయకుండా పాఠ్యంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: εἰς τιμὴν / εἰς ἀτιμίανను ఉపయోగాలుగా వివరించాలా లేక గౌరవ–అవమాన భాషను నిలుపాలా
  choice: ఘనత కోసం ... అవమానం కోసం
  alternative: గౌరవప్రదమైన ఉపయోగం కోసం ... సాధారణ ఉపయోగం కోసం
  rationale: గ్రీకు నేరుగా గౌరవ–అవమాన పదజాలాన్ని ఉపయోగిస్తుంది. దానిని నిలుపడం వల్ల రూపకాన్ని గృహోపయోగ పాత్రల విధులకు మాత్రమే పరిమితం చేయకుండా అసలు వాక్యంలోని విస్తృతత కాపాడబడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన ప్రశ్నారూపం. ‘కుమ్మరి,’ ‘మట్టి ముద్ద,’ ‘పాత్ర’ అనే పదాలు రూపకాన్ని సాధారణ పాఠకుడికి స్పష్టంగా ఉంచుతాయి. ప్రధాన పాఠ్యంలో గౌరవ–అవమాన వ్యత్యాసాన్ని వ్యాఖ్యానాత్మకంగా సంకుచితం చేయలేదు.
