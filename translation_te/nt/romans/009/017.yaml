id: ROM.9.17
reference: Romans 9:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: te
  text: 'ఎందుకంటే లేఖనం ఫరోతో ఇలా చెబుతోంది: “ఈ ఉద్దేశంతోనే నేను నిన్ను నిలబెట్టాను[a]—నీలో నా శక్తిని కనపరచడానికి, భూమి అంతటా నా పేరు[b] ప్రకటించబడడానికి.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నిన్ను పైకి లేపాను,” “నిన్ను నిలిచి ఉండేలా చేశాను,” లేదా “నిన్ను కాపాడి ఉంచాను.” నిర్గమకాండంలోని ఉల్లేఖన సందర్భంలో ఈ క్రియకు ఇలాంటి విస్తృత భావపరిధి ఉంది.
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “నా పేరు” అంటే కేవలం పలికే పేరు కాదు; దేవుడు వెల్లడిచేసిన కీర్తి, ఖ్యాతి కూడా.
    reason: cultural_note
lexical_decisions:
- source_word: ἡ γραφή
  choice: లేఖనం
  rationale: నిర్దిష్ట ఏకవచన రూపాన్ని నిలుపుతూ, వ్రాయబడిన లేఖనమే మాట్లాడుతున్నట్లు పౌలు చేసిన వ్యక్తీకరణను కాపాడుతుంది.
- source_word: λέγει ... τῷ Φαραώ
  choice: ఫరోతో ఇలా చెబుతోంది
  rationale: గ్రీకు వర్తమాన కాలాన్ని నిలుపుతూ, లేఖనం ఇప్పటికీ మాట్లాడుతున్నదనే ఉల్లేఖన శైలిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని స్పష్టంగా చూపుతుంది.
- source_word: Εἰς αὐτὸ τοῦτο
  choice: ఈ ఉద్దేశంతోనే
  rationale: ప్రయోజన భావాన్నీ, αὐτὸ ఇచ్చే నొక్కిచెప్పే బలాన్నీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐξήγειρά σε
  choice: నేను నిన్ను నిలబెట్టాను
  rationale: ఫరోను ఈ పాత్రలో నిలిపి ఉంచడం లేదా ముందుకు తీసుకురావడం అనే విస్తృత భావాన్ని కాపాడుతుంది; అతని సృష్టి, నియామకం లేదా కేవలం ప్రాణరక్షణ అనే ఏ ఒక్క అర్థానికీ పదాన్ని పరిమితం చేయదు.
- source_word: ὅπως ἐνδείξωμαι
  choice: కనపరచడానికి
  rationale: ఉద్దేశాన్ని సూచిస్తూ, దేవుని శక్తి బహిరంగంగా ప్రత్యక్షమవడం అనే భావాన్ని సరళంగా తెలియజేస్తుంది.
- source_word: ἐν σοὶ
  choice: నీలో
  rationale: ἐν అనే ఉపసర్గను దగ్గరగా నిలుపుతుంది; ‘నీ ద్వారా’ అని మార్చి సాధనార్థాన్ని మాత్రమే ముందుకు తేవదు.
- source_word: τὴν δύναμίν μου
  choice: నా శక్తిని
  rationale: δύναμις‌కు సాధారణమైన, స్పష్టమైన ఆధునిక తెలుగు సమానార్థకం.
- source_word: καὶ ὅπως διαγγελῇ
  choice: ప్రకటించబడడానికి
  rationale: విస్తృతమైన బహిరంగ ప్రకటన భావాన్ని సహజమైన తెలుగు కర్మణి నిర్మాణంలో అందిస్తుంది.
- source_word: τὸ ὄνομά μου
  choice: నా పేరు
  rationale: మూలంలోని రూపకాన్ని యథాతథంగా ఉంచుతుంది; ఇక్కడ ‘పేరు’ దేవుని వెల్లడైన కీర్తి, ఖ్యాతిని కూడా సూచిస్తుంది.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: భూమి అంతటా
  rationale: సందర్భంలోని విశ్వవ్యాప్త పరిధిని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; దానిని ఒక నిర్దిష్ట దేశానికి పరిమితం చేయదు.
theological_decisions:
- issue: ఫరోకు సంబంధించి ἐξήγειρά σε భావం మరియు దేవుని సార్వభౌమాధికారం
  choice: ‘నేను నిన్ను నిలబెట్టాను’ అని విస్తృత భావంతో అనువదించబడింది.
  alternative: ‘నేను నిన్ను పైకి లేపాను’; ‘నేను నిన్ను నిలిచి ఉండేలా చేశాను’; ‘నేను నిన్ను కాపాడి ఉంచాను’
  rationale: ఈ మాట దేవుడు ఫరోను తన ఉద్దేశం కోసం ముందుకు తీసుకురావడం లేదా నిలిపి ఉంచడం అనే భావాన్ని మోయగలదు. అనువాదం దేవుని కార్యాన్ని స్పష్టంగా ఉంచుతూనే, అది ఫరో సృష్టిని, నియామకాన్ని లేదా కేవలం ప్రాణరక్షణను మాత్రమే సూచిస్తుందని నిర్ణయించదు; దేవుని సార్వభౌమాధికారానికీ మానవ బాధ్యతకీ మధ్యనున్న ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘లేఖనం’ అనే ఏకవచనం పౌలు చేసిన వ్యక్తీకరణను నిలుపుతుంది. ఉద్దేశాన్ని తెలిపే రెండు సమాంతర భాగాలు కాపాడబడ్డాయి; డాష్ ఉల్లేఖనంలోని ఉద్దేశ వివరణను స్పష్టంగా చూపుతుంది.
