revisions:
- from: 'ఎందుకంటే వాగ్దాన వాక్యం ఇదే: “ఈ సమయానికి నేను వస్తాను[a]; అప్పుడు శారాకు ఒక కుమారుడు ఉంటాడు.”'
  to: 'ఎందుకంటే వాగ్దాన వాక్యం ఇదే: “ఈ సమయాన నేను వస్తాను[a]; అప్పుడు శారాకు ఒక కుమారుడు ఉంటాడు.”'
  rationale: The sole revision replaces a modern Telugu expression that may imply ‘by this time’ with one that more unambiguously expresses the temporal sense of the Greek. The source’s wording ‘I will come’ remains in the text, and the Genesis-background alternative ‘I will return’ remains properly anchored in the footnote.
