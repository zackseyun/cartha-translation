id: ROM.9.9
reference: Romans 9:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: te
  text: 'ఎందుకంటే వాగ్దాన వాక్యం ఇదే: “ఈ సమయాన నేను వస్తాను[a]; అప్పుడు శారాకు ఒక కుమారుడు ఉంటాడు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నేను తిరిగి వస్తాను.” ఇక్కడి గ్రీకు పాఠంలో “నేను వస్తాను” అని ఉంది; అయితే ఆదికాండంలోని నేపథ్య వాక్యాన్ని ప్రతిబింబిస్తూ కొన్ని అనువాదాలు “తిరిగి వస్తాను” అని ఇస్తాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: వాగ్దాన
  rationale: λόγοςను విశేషించే సంబంధవిభక్తి రూపాన్ని తెలుగులో సహజమైన సమాసంగా ‘వాగ్దాన వాక్యం’ అని ఇచ్చాం; దైవ వాగ్దానంపై పౌలు ఉంచిన ప్రాధాన్యాన్ని ఇది నిలుపుతుంది.
- source_word: λόγος
  choice: వాక్యం
  rationale: ఇక్కడ ఇది ఉటంకించబడుతున్న పలుకును సూచిస్తుంది. ‘వాక్యం’ సంక్షిప్తంగా, గౌరవప్రదంగా ఉండి ‘సందేశం’ అనే విస్తృత భావాన్ని అనవసరంగా చేర్చదు.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: మునుపటి వాదనకు కారణం లేదా వివరణను పరిచయం చేసే అనుసంధానాన్ని ఆధునిక తెలుగులో స్పష్టంగా చూపుతుంది.
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: ఈ సమయానికి
  rationale: నిర్దిష్టమైన భవిష్యత్ సమయాన్ని సూచించే వాగ్దాన సూత్రాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది; ‘నియమిత సమయానికి’ అని మూలంలో లేని వివరణను చేర్చలేదు.
- source_word: ἐλεύσομαι
  choice: నేను వస్తాను
  rationale: గ్రీకు క్రియకు నేరమైన అర్థం ‘వస్తాను.’ ఆదికాండ నేపథ్యాన్ని అనుసరించి ‘తిరిగి వస్తాను’ అనడం సాధ్యమైనా, రోమీయులకు వ్రాసిన పత్రికలోని గ్రీకు పదానికి ప్రాధాన్యం ఇచ్చాం.
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: శారాకు ఒక కుమారుడు ఉంటాడు
  rationale: అక్షరార్థంగా ‘శారాకు కుమారుడు ఉంటాడు’ అనే స్వామ్యార్థక గ్రీకు నిర్మాణాన్ని సహజమైన తెలుగులో నిలిపాం. ‘కుమారుడు’ అనే నిర్దిష్ట లింగార్థాన్ని కాపాడాం.
- source_word: Σάρρᾳ
  choice: శారా
  rationale: వ్యక్తి పేరుకు ప్రామాణిక తెలుగు లిప్యంతరీకరణను వాడాం.
- source_word: υἱός
  choice: కుమారుడు
  rationale: ఈ నామవాచకం ప్రత్యేకంగా కుమారుణ్ణి సూచిస్తుంది; అబ్రాహాము–శారా వాగ్దాన సందర్భంలో ఆ నిర్దిష్టతను నిలిపాం.
theological_decisions:
- issue: అబ్రాహాముకు చేసిన వాగ్దానపు ఉటంకింపు మరియు దైవ కార్యసాధకత్వం
  choice: వాగ్దానాన్ని దేవుని ప్రత్యక్ష పలుకుగా, అదనపు వ్యాఖ్యానం లేకుండా అందించడం
  alternative: ఆదికాండంలోని కొన్ని అనువాద సంప్రదాయాలకు మరింత స్పష్టంగా సరిపడేలా ‘నేను తిరిగి వస్తాను’ అని అనువదించడం
  rationale: ఇస్సాకు జననానికి ఆధారం దైవ వాగ్దానమే అన్నది పౌలు వాదన. అందువల్ల ఆ వాగ్దాన బలాన్ని నిలుపుతూ, రోమా 9:9లో వాస్తవంగా ఉన్న ἐλεύσομαιకు ప్రాధాన్యం ఇచ్చాం; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలిని వాడాం. ‘వాగ్దాన వాక్యం’ బైబిలు సందర్భానికి తగిన పదబంధమే అయినా సాధారణ పాఠకునికి అర్థమయ్యేలా ఉంది. గ్రీకు మూలంలోని ‘వస్తాను’ను ప్రధాన పాఠంలో ఉంచి, ఆదికాండ అనువాద సంప్రదాయంలోని ‘తిరిగి వస్తాను’ను పాదసూచికలో సంరక్షించాం.
