id: ROM.9.10
reference: Romans 9:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ Ῥεβέκκα ἐξ ἑνὸς κοίτην ἔχουσα, Ἰσαὰκ τοῦ πατρὸς ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/010.yaml
  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: te
  text: అంతేకాదు, రిబ్కా కూడా మన పితరుడైన ఇస్సాకు అనే ఒక్క పురుషుని ద్వారా గర్భం ధరించింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: మూలంలో అక్షరార్థంగా, “మన పితరుడైన ఇస్సాకు అనే ఒక్కడి నుండి శయనం/సహవాసం కలిగి” అని ఉంది. ఇది ఒకే పురుషుని ద్వారా గర్భం ధరించడాన్ని సూచించే నుడికారం.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: అంతేకాదు, ... కూడా
  rationale: పౌలు ముందటి ఉదాహరణకు మరో ఉదాహరణను జోడిస్తున్న సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ῥεβέκκα
  choice: రిబ్కా
  rationale: బైబిలు పేరుకు మూలభాషా రూపాన్ని అనుసరించే సుపరిచిత తెలుగు లిప్యంతరీకరణ.
- source_word: ἐξ ἑνός
  choice: ఒక్క పురుషుని ద్వారా
  rationale: ‘ఒక్కడి నుండి’ అనే భావంలో సూచితమైన పురుషుణ్ణి స్పష్టం చేస్తుంది; ఒకే తండ్రి అనే వాదనాంశాన్ని తెలియజేస్తుంది.
- source_word: κοίτην ἔχουσα
  choice: గర్భం ధరించింది
  rationale: శయనాన్ని/లైంగిక సంయోగాన్ని సూచించే గ్రీకు నుడికారానికి సందర్భానుగుణమైన, గౌరవప్రదమైన సహజ తెలుగు రూపం.
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: మన పితరుడైన ఇస్సాకు ద్వారా
  rationale: Ἰσαὰκ ను ἐξ ἑνός లోని ‘ఒక్కడు’తో అన్వయిస్తూ, పూర్వికుడనే భావాన్ని ‘పితరుడు’తో నిలుపుతుంది.
theological_decisions:
- issue: రిబ్కా గర్భధారణను సూచించే నుడికారాన్ని ఎంత స్పష్టంగా అనువదించాలి
  choice: ఒక్క పురుషుని ద్వారా—మన పితరుడైన ఇస్సాకు ద్వారా—గర్భం ధరించింది
  alternative: మన పితరుడైన ఇస్సాకు అనే ఒక్కడి నుండి శయనం కలిగిన రిబ్కా
  rationale: అక్షరార్థ రూపం తెలుగులో అసహజంగా, అస్పష్టంగా ఉంటుంది. ఎంచుకున్న రూపం ఒకే తండ్రి ద్వారా గర్భధారణ అనే సందర్భార్థాన్ని స్పష్టం చేస్తుంది; పిల్లలు లేదా కవలలు అనే పదాలను ఈ వాక్యంలో చేర్చదు.
- issue: Ἰσαὰκ τοῦ πατρὸς ἡμῶν యొక్క వాక్యసంబంధం
  choice: ‘ఒక్క పురుషుడు’ ఎవరో తెలిపే వివరణగా ఇస్సాకును ఉంచడం
  alternative: ‘మన పితరుడైన ఇస్సాకు’ను వాక్యాంతంలో విరామం లేకుండా ఉంచడం
  rationale: గ్రీకులోని విభక్తి నిర్మాణం ఇస్సాకును ‘ఒక్కడి నుండి’ అనే పదబంధంతో అనుసంధానిస్తుంది. డాష్‌లు ఈ సంబంధాన్ని తెలుగులో స్పష్టంగా ఉంచుతాయి; కొత్త సిద్ధాంతార్థాన్ని చేర్చవు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. ‘పితరుడు’ వంశపూర్విక భావాన్ని నిలుపుతుంది; ‘గర్భం ధరించింది’ మూల నుడికారాన్ని మర్యాదగా, స్పష్టంగా అందిస్తుంది.
