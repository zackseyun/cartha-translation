revisions:
- from: అంతేకాదు, రిబ్కా కూడా ఒక్క పురుషుని ద్వారా—మన పితరుడైన ఇస్సాకు ద్వారా—గర్భం ధరించింది.[a]
  to: అంతేకాదు, రిబ్కా కూడా మన పితరుడైన ఇస్సాకు అనే ఒక్క పురుషుని ద్వారా గర్భం ధరించింది.[a]
  rationale: Isaac is recast as the appositional identification of “one man,” preserving the syntax and argument while removing Telugu redundancy. The footnote is revised to give a comprehensible literal range for κοίτη (“bed/cohabitation”) and to explain its idiomatic contextual sense without adding children or twins.
