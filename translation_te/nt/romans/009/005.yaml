revisions:
- from: పితరులు వారివారే; శరీరం ప్రకారం[a] మెస్సీయ వారిలోనుంచే వచ్చాడు. ఆయనే అందరిపై ఉన్నవాడు, యుగయుగాలూ స్తుతింపదగిన దేవుడు[b]. ఆమేన్.
  to: పితరులు కూడా వారివే; వారినుండి శరీరానుసారంగా[a] మెస్సీయ ఉద్భవించాడు. ఆయన సమస్తముపై ఉన్నవాడు, యుగయుగముల వరకు స్తుతింపబడిన దేవుడు[b]. ఆమేన్.
