id: ROM.9.5
reference: Romans 9:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: te
  text: పితరులు కూడా వారివే; వారినుండి శరీరానుసారంగా[a] మెస్సీయ ఉద్భవించాడు. ఆయన సమస్తముపై ఉన్నవాడు, యుగయుగముల వరకు స్తుతింపబడిన దేవుడు[b]. ఆమేన్.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మానవ వంశం పరంగా.’ అక్షరార్థంగా, ‘శరీరానుసారంగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, చివరి భాగాన్ని ప్రత్యేక స్తోత్రవాక్యంగా తీసుకొని, ‘సమస్తముపై ఉన్న దేవుడు యుగయుగముల వరకు స్తుతింపబడును గాక. ఆమేన్’ అని చదవవచ్చు; అప్పుడు అది మెస్సీయను వర్ణించే మాటగా ఉండదు.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες
  choice: పితరులు
  rationale: ఇశ్రాయేలు ప్రజల గౌరవనీయ పూర్వపితరులను సూచించే పౌలు వాడిన ఒడంబడిక-చారిత్రక భాషను దగ్గరగా నిలుపుతుంది; ‘మూలపురుషులు’ అనే పదం కొంత సంకుచితంగా లేదా వివరణాత్మకంగా ఉండవచ్చు.
- source_word: ἐξ ὧν
  choice: వారిలోనుంచే
  rationale: సంబంధసర్వనామం ఇశ్రాయేలీయులను తిరిగి సూచిస్తుంది. ‘వారిలోనుంచే’ అనేది తెలుగు వాక్యప్రవాహంలో సహజంగా ఉండి, వారి వంశంలో జన్మించాడనే భావాన్ని తెలియజేస్తుంది.
- source_word: ὁ χριστός
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός వ్యక్తినామంలా కాక ఇశ్రాయేలుతో ముడిపడిన బిరుదుగా పనిచేస్తోంది; అందువల్ల ‘మెస్సీయ’ అని అనువదించబడింది.
- source_word: τὸ κατὰ σάρκα
  choice: శరీరం ప్రకారం
  rationale: పౌలు ఉపయోగించిన రూపాన్ని నిలుపుతూ భౌతిక లేదా మానవ వంశసంబంధాన్ని సూచిస్తుంది. స్పష్టీకరణను పాదటిప్పణిలో ఇచ్చాం.
- source_word: σάρκα
  choice: శరీరం
  rationale: ఈ సందర్భంలో σάρξ పాపస్వభావాన్ని కాక భౌతిక వంశాన్ని సూచిస్తుంది. ‘శరీరం’ మూలపదానికి దగ్గరగా ఉండి తెలుగు పాఠకుడికి అర్థమయ్యే ఎంపిక.
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: ఆయనే అందరిపై ఉన్నవాడు
  rationale: ఆర్టికల్‌తో కూడిన కృదంతం సహజంగా మెస్సీయను గురించిన వర్ణనను కొనసాగిస్తుంది. ‘అందరిపై’ అనే రూపం ఆయన సార్వభౌమ ఆధిక్యాన్ని మూలంలోని విస్తృతితోనే ఉంచుతుంది.
- source_word: θεὸς εὐλογητὸς
  choice: స్తుతింపదగిన దేవుడు
  rationale: తెలుగులో సహజమైన స్తోత్రభాషను ఉపయోగిస్తూ θεός మరియు εὐλογητός రెండింటినీ స్పష్టంగా వ్యక్తం చేస్తుంది. ప్రధాన పాఠంలో ఇది ముందున్న మెస్సీయ వర్ణనకు అన్వయించబడింది.
- source_word: εἰς τοὺς αἰῶνας
  choice: యుగయుగాలూ
  rationale: గ్రీకు స్తోత్రప్రయోగంలోని నిరంతర కాలభావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగు నుడికారంలో తెలియజేస్తుంది.
- source_word: ἀμήν
  choice: ఆమేన్
  rationale: తెలుగు క్రైస్తవ వాడుకలో స్థిరపడిన లిప్యంతరీకరణను నిలుపుతుంది.
theological_decisions:
- issue: ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας అనే చివరి భాగం మెస్సీయను వర్ణిస్తుందా, లేక దేవునికి ఉద్దేశించిన ప్రత్యేక స్తోత్రవాక్యమా?
  choice: 'ప్రధాన పాఠంలో ఈ భాగం మెస్సీయను వర్ణించేదిగా తీసుకున్నాం: ‘ఆయనే అందరిపై ఉన్నవాడు, యుగయుగాలూ స్తుతింపదగిన దేవుడు.’'
  alternative: దీనిని ప్రత్యేక స్తోత్రవాక్యంగా విరామచిహ్నాలు పెట్టి, ‘అందరిపై ఉన్న దేవుడు యుగయుగాలూ స్తుతింపబడుగాక’ అని చదవవచ్చు.
  rationale: గ్రీకులోని ఆర్టికల్‌తో కూడిన ὁ ὢν ముందున్న ὁ χριστός‌కు వివరణగా కొనసాగడం వాక్యనిర్మాణపరంగా సహజం. అయితే ప్రాచీన ప్రతుల్లో ఆధునిక విరామచిహ్నాలు లేకపోవడం వల్ల ప్రత్యేక స్తోత్రవాక్యంగా చదివే అవకాశాన్ని పాదటిప్పణిలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన శైలిని పాటించాం. ‘పితరులు,’ ‘మెస్సీయ,’ ‘యుగయుగాలూ,’ ‘ఆమేన్’ వంటి స్థిరమైన బైబిలు పదాలను నిలిపి, క్లిష్టమైన గ్రీకు వాక్యనిర్మాణాన్ని చిన్న, స్పష్టమైన తెలుగు వాక్యాలుగా అందించాం. మూలంలోని క్రీస్తుసంబంధ ప్రధాన పఠనాన్ని పాఠ్యంలో ఉంచి, నిజమైన విరామచిహ్న/అన్వయ సందిగ్ధతను పాదటిప్పణిలో సంరక్షించాం.
