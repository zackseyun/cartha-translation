  source_fidelity: The translation accurately represents the inferential force of ἄρα οὖν, preserves the Greek ellipsis with a neutral “అది,” and appropriately supplies “ఆధారపడి ఉంటుంది” without specifying salvation, election, or another doctrinally narrower referent. The paired negated human participles and the contrasting participial description of God are retained. “పరుగెత్తేవానిపైనా” properly preserves the literal running imagery.
  naturalness: The Telugu is clear, idiomatic, and suitably formal for modern standard Telugu. The parallel phrasing “కోరుకునేవానిపైనా, పరుగెత్తేవానిపైనా” followed by the contrastive “దేవునిపైనే” reads naturally. The semicolon effectively marks the strong contrast.
  terminology: “కోరుకునేవాని” is an acceptable accessible rendering of θέλων in this context, while “కరుణ చూపే దేవుడు” faithfully retains the active participial force of ἐλεῶντος. No doctrinal terminology has been inserted into the elliptical statement. Footnote terminology is understandable and appropriately distinguishes literal running from its likely figurative implication.
