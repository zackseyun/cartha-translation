id: ROM.9.16
reference: Romans 9:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος ἀλλὰ τοῦ ἐλεῶντος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/016.yaml
  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: te
  text: కాబట్టి[a], అది కోరుకునేవానిపైనా, పరుగెత్తేవానిపైనా[b] ఆధారపడి ఉండదు; కరుణ చూపే దేవునిపైనే ఆధారపడి ఉంటుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరింత అక్షరార్థంగా: “కాబట్టి, కోరుకునేవానిది కాదు, పరుగెత్తేవానిది కూడా కాదు; కరుణ చూపే దేవునిదే.” గ్రీకు వాక్యం అధ్యాహారంగా ఉంది; చెప్పకుండా వదిలిన అంశాన్ని దేవుని ఉద్దేశం, కరుణ గురించి ఉన్న సందర్భం ద్వారా గ్రహించాలి.'
    reason: lexical_alternative
  - marker: b
    text: “పరుగెత్తడం” ఇక్కడ మానవ ప్రయత్నానికి లేదా తీవ్రంగా కృషి చేయడానికి రూపకంగా ఉండవచ్చు; అయితే గ్రీకు క్రియకు అక్షరార్థం “పరుగెత్తడం.”
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: కాబట్టి
  rationale: ఈ రెండు అనుమానార్థక అవ్యయాలు ముందటి వాదననుంచి పౌలు తీసే బలమైన నిర్ధారణను సూచిస్తాయి. ‘కాబట్టి’ ఆధునిక తెలుగులో ఆ తార్కిక సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: τοῦ θέλοντος
  choice: కోరుకునేవాని
  rationale: ఉపపదంతో ఉన్న వర్తమాన కృదంతం ఒక వ్యక్తిని సూచిస్తుంది. ఈ ఎంపిక θέλω లోని సంకల్పం లేదా ఇచ్ఛ అనే భావాన్ని నిలుపుతూ సాధారణ పాఠకులకు సహజంగా ఉంటుంది.
- source_word: οὐδὲ τοῦ τρέχοντος
  choice: పరుగెత్తేవానిపైనా
  rationale: τρέχω అనే క్రియకు అక్షరార్థం ‘పరుగెత్తు.’ సందర్భంలో అది మానవ ప్రయత్నానికి రూపకంగా ఉండవచ్చు; అయినా పౌలు వాడిన స్పష్టమైన చిత్రాన్ని ప్రధాన పాఠంలో నిలిపాము.
- source_word: ἀλλὰ
  choice: కరుణ చూపే దేవునిపైనే
  rationale: ἀλλά బలమైన వ్యతిరేకతను సూచిస్తుంది; తెలుగులో ‘-నే’ అనే నిశ్చయార్థక ప్రత్యయం ఆ వ్యతిరేకతను సహజంగా బలపరుస్తుంది.
- source_word: τοῦ ἐλεῶντος θεοῦ
  choice: కరుణ చూపే దేవుడు
  rationale: ఈ సమాసం దేవుణ్ణి ఆయన కరుణాపూర్వక క్రియ ద్వారా గుర్తిస్తుంది. ‘కరుణ చూపే’ అనే క్రియాత్మక రూపం గ్రీకు కృదంత భావాన్ని నిలుపుతుంది.
- source_word: implied predicate/expression
  choice: అది … ఆధారపడి ఉండదు; … ఆధారపడి ఉంటుంది
  rationale: గ్రీకు వాక్యంలో కర్త లేదా నియంత్రక క్రియ స్పష్టంగా లేదు. ‘అది’ అని సాధారణంగా ఉంచి, ‘ఆధారపడి ఉంటుంది’ అని పూరించడం తెలుగులో అర్థాన్ని స్పష్టం చేస్తూనే రక్షణ, ఎన్నిక లేదా దేవుని నిర్ణయం అని పరిధిని అనవసరంగా కుదించదు.
theological_decisions:
- issue: అధ్యాహారంగా ఉన్న కర్త మరియు ఆధారపడే అంశపు పరిధి
  choice: ‘అది … ఆధారపడి ఉండదు’ అనే సాధారణ నిర్మాణాన్ని వాడి, ప్రధాన పాఠంలో రక్షణ, ఎన్నిక లేదా దేవుని ఎంపిక అని ప్రత్యేకంగా పేర్కొనలేదు.
  alternative: ‘రక్షణ మానవ కోరికపైనా ప్రయత్నంపైనా ఆధారపడదు’ లేదా ‘దేవుని ఎంపిక మానవ సంకల్పంపైనా ప్రయత్నంపైనా ఆధారపడదు.’
  rationale: తక్షణ సందర్భం దేవుని ఉద్దేశం, ఎన్నిక, కరుణలను ప్రస్తావించినా, గ్రీకు వాక్యం అధ్యాహారంగా ఉంది. ఒక నిర్దిష్ట సిద్ధాంత వ్యాఖ్యానాన్ని పాఠంలో చేర్చకుండా ఆ భావ ఉద్రిక్తతను సందర్భమే నింపేలా ఉంచాము.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని అధ్యాహార స్వభావాన్ని పూర్తిగా తొలగించకుండా ‘అది’ అనే సాధారణ సూచనను ఉంచాం. ‘పరుగెత్తడం’ అనే మూల చిత్రాన్ని ప్రధాన పాఠంలో కాపాడి, దాని రూపకార్థాన్ని పాదటీపులో వివరించాం.
