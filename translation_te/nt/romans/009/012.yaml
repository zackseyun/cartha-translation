    rationale: The Greek says only “the one who calls” (τοῦ καλοῦντος). Although the referent is clear from context, explicitly naming God adds wording absent from the verse and narrows the formal expression.
  - severity: low
    issue: “ఆమెతో ఇలా చెప్పబడింది” uses a comitative expression.
    rationale: αὐτῇ means “to her”; “ఆమెకు ఇలా చెప్పబడింది” is both more exact and more idiomatic for a passive citation formula.
