  yaml_path: translation/nt/romans/009/012.yaml
  text: not from works but from the One who calls[a], it was said to her[c][b], “The older will serve the younger.”
translation:
  language: te
  text: 'పనులవల్ల కాదు, పిలిచేవానివల్లనే[a] ఆమెకు ఇలా చెప్పబడింది: “పెద్దవాడు చిన్నవానికి సేవ చేస్తాడు.”[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పనుల ఆధారంగా కాదు, పిలిచేవాని ఆధారంగానే.”
    reason: lexical_alternative
  - marker: b
    text: ఆదికాండము 25:23 నుండి ఉల్లేఖనం.
    reason: cross_reference
  - marker: c
    text: లేదా, “గొప్పవాడు తక్కువవానికి సేవ చేస్తాడు.” యాకోబు, ఏశావుల సందర్భాన్ని బట్టి ప్రధాన పాఠంలో “పెద్దవాడు/చిన్నవాడు” అని అనువదించబడింది.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: పనుల మూలంగా కాక
  rationale: ἐκ + షష్ఠీ విభక్తి ఇక్కడ మూలం లేదా ఆధారాన్ని సూచిస్తుంది. ‘మూలంగా’ అనే పదం పౌలు ఉంచిన సంక్షిప్త వ్యత్యాసాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: పిలిచే దేవుని మూలంగానే
  rationale: τοῦ καλοῦντος అనేది నామవాచకంగా పనిచేసే వర్తమాన కృదంతం. గ్రీకులో దేవుడు అనే నామం స్పష్టంగా లేకపోయినా సందర్భంలో పిలిచేవాడు దేవుడే; తెలుగులో సహజత, స్పష్టత కోసం ‘దేవుని’ అని వ్యక్తం చేయబడింది. ‘పిలిచే’ వర్తమాన భావాన్ని నిలుపుతుంది.
- source_word: ἐρρέθη αὐτῇ
  choice: ఆమెతో ఇలా చెప్పబడింది
  rationale: అనిర్దిష్ట కర్తతో ఉన్న భూతకాల కర్మణి రూపాన్ని నిలుపుతూ, మూలంలో లేని స్పష్టమైన కర్తను చేర్చకుండా ఉల్లేఖన సూత్రాన్ని సహజంగా అందిస్తుంది.
- source_word: ὅτι
  choice: 'ఇలా … : “ ”'
  rationale: ὅτι ఇక్కడ ప్రత్యక్ష వాక్యాన్ని ప్రవేశపెడుతుంది. తెలుగులో ‘ఇలా’తో పాటు ఉల్లేఖన చిహ్నాలు దాని పనిని సహజంగా తెలియజేస్తాయి.
- source_word: Ὁ μείζων
  choice: పెద్దవాడు
  rationale: మీజోన్‌కు ‘గొప్పవాడు/పెద్దవాడు’ అనే విస్తృత అర్థం ఉన్నా, యాకోబు–ఏశావు సందర్భంలో వయసులో పెద్దవాడనే భావం ఉద్దేశించబడింది. ‘పెద్దవాడు’ ఆ సందర్భార్థాన్ని సహజంగా వ్యక్తం చేస్తూ మూలంలోని కొంత విస్తృతతను కూడా కలిగి ఉంటుంది.
- source_word: δουλεύσει
  choice: సేవ చేస్తాడు
  rationale: δουλεύω దాసునిగా సేవ చేయడాన్ని సూచించగలదు; అయితే ఇక్కడ సహోదరులు/జనాల మధ్య అధీన సంబంధాన్ని ‘సేవ చేస్తాడు’ అతిగా నిర్దిష్టం చేయకుండా అందిస్తుంది.
- source_word: τῷ ἐλάσσονι
  choice: చిన్నవానికి
  rationale: ἐλάσσων పరిమాణం లేదా స్థాయిలో తక్కువవాడని కూడా అర్థం కావచ్చు; ఆదికాండ సందర్భంలో చిన్న సహోదరుడు ఉద్దేశించబడ్డాడు. ‘చిన్నవానికి’ ఈ జంటను తెలుగులో సహజంగా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: ‘పనుల మూలంగా కాక, పిలిచే దేవుని మూలంగా’ అనే వ్యత్యాసాన్ని షరతులులేని ఎన్నిక అనే సిద్ధాంతంగా విస్తరించాలా
  choice: సంక్షిప్త వ్యత్యాసాన్ని వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపడం
  alternative: పనుల కారణంగా కాక, పిలిచే దేవుని నిర్ణయం కారణంగా
  rationale: వచనం పనులను దేవుని పిలుపుతో స్పష్టంగా వ్యతిరేకిస్తుంది; అయితే విస్తృత సిద్ధాంత నిర్ణయాలు పరిసర వాక్యభాగం నుంచి వస్తాయి. ఈ ఒక్క వచనంలో వాటిని చేర్చకుండా పౌలు వాదనలోని ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని సంక్షిప్త కారణ–మూల వ్యత్యాసం, కర్మణి ఉల్లేఖన సూత్రం, మరియు μείζων/ἐλάσσων పదజంటలోని సందర్భానుగుణ అస్పష్టతను సాధ్యమైనంతవరకు నిలుపుతూ, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇచ్చింది.
