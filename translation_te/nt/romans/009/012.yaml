  verdict: revise
  source_fidelity: The draft accurately preserves the works/calling contrast and the future relationship in the quotation. However, it explicitly supplies “దేవుని” (“God”), whereas τοῦ καλοῦντος is an articular participle, “the one who calls,” without an expressed noun. The contextual referent may be understood, but it should not be inserted in the translated text. Also, αὐτῇ is more precisely rendered “ఆమెకు” (“to her”) than “ఆమెతో” (“with her”).
  naturalness: The revised wording is idiomatic modern standard Telugu and retains the compact, citation-formula character of the Greek. “పనులవల్ల కాదు, పిలిచేవానివల్లనే” is more natural than repeating “మూలంగా,” while retaining the intended basis/source contrast.
  terminology: “పిలిచేవాడు” appropriately represents the substantival present participle without adding an explicit divine title. “పెద్దవాడు/చిన్నవాడు” is natural in the Jacob–Esau setting; the footnote properly records the possible comparative-status rendering. “సేవ చేస్తాడు” is suitable here for δουλεύσει and does not over-specify the manner of subordination.
