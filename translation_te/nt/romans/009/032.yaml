id: ROM.9.32
reference: Romans 9:32
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: te
  text: ఎందుకు? ఎందుకంటే వారు దానిని విశ్వాసం ఆధారంగా కాదు[a], క్రియల ఆధారంగా అన్నట్టుగా[b] వెంబడించారు. వారు తడబాటుకు కారణమైన రాయికి[d][c] తగిలారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విశ్వాసం ద్వారా కాదు,’ ‘విశ్వాసం ఆధారంగా కాదు.’ గ్రీకు మూలపాఠంలో అక్షరార్థంగా ‘విశ్వాసం నుండి కాదు’ అని ఉంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘క్రియల ఆధారంగా అన్నట్టుగా.’ ఈ మాటల్లో ‘అన్నట్టుగా/as if’ అనే భావం ఉంది.
    reason: lexical_alternative
  - marker: c
    text: ఇది యెషయా 8:14ను సూచిస్తుంది; తరువాతి వచనంలోని యెషయా 28:16తో కూడా పోల్చండి.
    reason: cross_reference
  - marker: d
    text: లేదా, ‘అభ్యంతరం కలిగించే రాయి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί
  choice: ఎందుకు?
  rationale: పౌలు అడిగే సంక్షిప్త అలంకారప్రశ్న యొక్క బలాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ὅτι
  choice: ఎందుకంటే
  rationale: ముందున్న ప్రశ్నకు కారణాన్ని తెలిపే సంధానపదంగా సహజంగా సరిపోతుంది.
- source_word: οὐκ ἐκ πίστεως
  choice: విశ్వాసం నుండి కాదు
  rationale: ἐκ అనే మూలం/ఆధారం సూచించే విభక్తి భావాన్ని నిలుపుతూ, πίστης‌ను సాధారణ పౌలీయ పదప్రయోగానికి అనుగుణంగా ‘విశ్వాసం’గా అనువదిస్తుంది.
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: క్రియల నుండి వచ్చినట్టుగా
  rationale: ὡς లోని ‘అన్నట్టుగా/అయినట్టుగా’ అనే సూక్ష్మభావాన్ని తొలగించకుండా, క్రియలే ఆధారమన్న భావనను సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἔργων
  choice: క్రియలు
  rationale: రోమీయుల పత్రికలోని విశ్వాసం–క్రియలు వ్యత్యాసానికి పరిచితమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: προσέκοψαν
  choice: తగిలి తడబడ్డారు
  rationale: అడ్డంకికి తగిలి తూలిపోవడం అనే προσκόπτω యొక్క స్పష్టమైన రూపకాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: తడబడేలా చేసే రాయి
  rationale: ‘తడబడటానికి కారణమైన రాయి’ అనే జనిటివ్ సంబంధాన్ని స్పష్టంగా తెలిపి, క్రియతో ఉన్న పదబంధ సంబంధాన్ని నిలుపుతుంది.
theological_decisions:
- issue: విశ్వాసం–క్రియలు వ్యత్యాసంలో πίστις భావం
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఇక్కడ నీతిని వెంబడించే ఆధారం విశ్వాసమా, క్రియలా అన్న వ్యత్యాసం ఉంది. ‘విశ్వాసం’ పౌలు వాడే వర్గాన్ని అనవసరంగా మరింత నిర్దిష్టం చేయకుండా నిలుపుతుంది.
- issue: ὡς వల్ల క్రియల విషయంగా వచ్చే పరిమిత భావం
  choice: క్రియల నుండి వచ్చినట్టుగా
  alternative: క్రియల నుండి; క్రియల ద్వారా
  rationale: ὡς‌ను వదిలేస్తే పౌలు వాక్యంలో ఉన్న ‘అన్నట్టుగా/as if’ అనే సూక్ష్మత పోతుంది; అందువల్ల దానిని స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని సంక్షిప్త ప్రశ్న, విశ్వాసం–క్రియల వ్యత్యాసం, ὡς యొక్క అనిశ్చిత/ఉపమాన సూక్ష్మత, రాయికి తగిలి తడబడే రూపకం నిలుపబడ్డాయి. వాక్యంలో అంతర్లీనంగా ఉన్న ‘వెంబడించారు’ అనే క్రియను ముందరి వచన సందర్భం ఆధారంగా తెలుగులో పూరించాం.
