  to: ఎందుకు? ఎందుకంటే వారు దానిని విశ్వాసం ఆధారంగా కాదు[a], క్రియల ఆధారంగా అన్నట్టుగా[b] వెంబడించారు. వారు తడబాటుకు కారణమైన రాయికి[d][c] తగిలారు.
  rationale: సవరించిన పాఠం ἐκ πίστεως మరియు ὡς ἐξ ἔργων మధ్య వ్యత్యాసాన్ని ‘ఆధారంగా’ ద్వారా స్పష్టంగా ఇస్తుంది; ὡς యొక్క ‘అన్నట్టుగా’ అనే సూక్ష్మతను నిలుపుతుంది. ముందరి సందర్భం నుండి అంతర్లీనంగా ఉన్న కర్తను (‘వారు’) మరియు కర్మను (‘దానిని’) మాత్రమే పూరించింది. ‘తగిలారు’ అనేది προσέκοψαν యొక్క అడ్డంకి-రాయి రూపకాన్ని నేరుగా వ్యక్తపరుస్తుంది; ‘తడబాటుకు కారణమైన రాయి’ τοῦ προσκόμματος‌ను సహజంగా వివరిస్తుంది.
