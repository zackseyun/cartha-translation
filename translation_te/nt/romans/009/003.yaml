id: ROM.9.3
reference: Romans 9:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: te
  text: ఎందుకంటే, నా సహోదరుల[b] కోసం—అంటే, శరీర సంబంధంగా[c] నా బంధువుల కోసం—నేనే శాపగ్రస్తుడిగా మెస్సీయ నుండి వేరుపడి ఉండాలని[a] కోరుకోగలిగేవాడిని.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మెస్సీయ నుండి శాపగ్రస్తుడై ఉండాలని,” లేదా “శాపానికి లోనై మెస్సీయ నుండి వేరుపడి ఉండాలని.” గ్రీకు ప్రయోగంలో శాపానికి లోనవడం, మెస్సీయ నుండి వేరుపడడం అనే రెండు భావాలూ కలిసి ఉన్నాయి.
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా “నా సహోదరులు.” సందర్భంలో పౌలు తన తోటి ఇశ్రాయేలీయులను, అంటే తన జాతివారిని సూచిస్తున్నాడు.
    reason: cultural_note
  - marker: c
    text: ఇక్కడ “శరీర సంబంధంగా” అంటే భౌతిక వంశం లేదా జాతి పరంపర ప్రకారం అని అర్థం; “పాప స్వభావం ప్రకారం” అని కాదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐχόμην
  choice: కోరుకోగలిగేవాణ్ణి
  rationale: అసంపూర్ణ భూతకాల మధ్యమ రూపం ఇక్కడ సాధారణ గత చర్యకన్నా ఊహాత్మకమైన, నెరవేరడం అసాధ్యంగా కనిపించే తీవ్రమైన కోరికను వ్యక్తం చేస్తుంది. ఈ తెలుగు రూపం ఆ సంభావ్య భావాన్ని నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి ఇచ్చే వివరణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో చూపుతుంది.
- source_word: ἀνάθεμα
  choice: శాపగ్రస్తుడనై
  rationale: దైవిక శాపానికి లోనై నాశనానికి అప్పగించబడిన స్థితిని సూచించే పదబలాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: αὐτὸς ἐγὼ
  choice: నేనే
  rationale: పౌలు తనను తాను ప్రత్యేకంగా నొక్కిచెప్పే గ్రీకు ప్రయోగాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: మెస్సీయ నుండి వేరైపోవాలని
  rationale: ἀπό సూచించే వేరుపాటు భావాన్ని స్పష్టం చేస్తూ, Χριστός‌ను ఇక్కడ బిరుదుగా ‘మెస్సీయ’ అని అనువదిస్తుంది.
- source_word: ὑπὲρ
  choice: కోసం
  rationale: ఈ సందర్భంలోని పరహిత లేదా ప్రతినిధిత్వ భావాన్ని సాధారణ పాఠకునికి సహజంగా తెలియజేస్తుంది.
- source_word: τῶν ἀδελφῶν μου
  choice: నా సహోదరుల
  rationale: గ్రీకు పురుష బహువచన రూపాన్ని నిలుపుతూ, సందర్భంలో పౌలు తోటి ఇశ్రాయేలీయులను సూచిస్తున్నాడని పాదసూచిక వివరిస్తుంది.
- source_word: τῶν συγγενῶν μου
  choice: నా బంధువులైన
  rationale: జాతి, వంశ సంబంధమైన బంధుత్వాన్ని తెలిపి, ‘సహోదరులు’ ఎవరన్నదాన్ని సహజంగా విశదీకరిస్తుంది.
- source_word: κατὰ σάρκα
  choice: శరీర సంబంధంగా
  rationale: పౌలు వాడే ‘శరీరం’ పదాన్ని నిలుపుతూ, ఇక్కడ భావం భౌతిక వంశం లేదా జాతి సంబంధమని సందర్భానుసారంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పౌలు నిజంగా చేసిన ప్రార్థనను చెబుతున్నాడా, లేక ఊహాత్మకమైన కోరికను వ్యక్తం చేస్తున్నాడా
  choice: ‘కోరుకోగలిగేవాణ్ణి’ అని ఊహాత్మక లేదా సంభావ్య కోరికగా అనువదించడం
  alternative: ‘కోరుకుంటూ ఉండేవాణ్ణి’ లేదా ‘ప్రార్థించాను’
  rationale: పౌలు నిజంగానే మెస్సీయ నుండి వేరుచేయబడాలని ప్రార్థించాడని అతిగా నిర్ధారించకుండా, అతని మాటలోని తీవ్రమైన త్యాగభావాన్ని కాపాడుతుంది.
- issue: Χριστός ఇక్కడ బిరుదా, పేరులాంటి ప్రయోగమా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో అభిషిక్త రాజు అనే బిరుదు భావం సముచితంగా ఉండడంతో ‘మెస్సీయ’ దానిని పారదర్శకంగా నిలుపుతుంది.
- issue: κατὰ σάρκα లో σάρξ యొక్క భావం
  choice: శారీరక లేదా జాతి వంశసంబంధ భావం
  alternative: పాప స్వభావం
  rationale: పౌలు ఇక్కడ తన జాతి బంధుత్వాన్ని గుర్తిస్తున్నాడు; నైతికమైన ‘పాప స్వభావం’ గురించి మాట్లాడడం లేదు.
- issue: ἀνάθεμα మరియు ἀπὸ τοῦ Χριστοῦ మధ్య సంబంధం
  choice: శాపగ్రస్త స్థితి మరియు మెస్సీయ నుండి వేరుపడడం పరస్పర సంబంధిత భావాలుగా ప్రవాహవంతంగా వ్యక్తీకరించడం
  alternative: ‘మెస్సీయ నుండి వచ్చిన శాపం’ లేదా కేవలం ‘మెస్సీయ నుండి శాపగ్రస్తుడు’
  rationale: గ్రీకు నిర్మాణంలో ఉన్న శాపం-వేరుపాటు ఉద్రిక్తతను నిలుపుతూ, మూలంలో లేని నిర్దిష్ట కారణసంబంధాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలి వాడబడింది. ‘నేనే’ మూలంలోని వ్యక్తిగత ఉద్ఘాటనను నిలుపుతుంది; ‘శరీర సంబంధంగా’ పౌలు పదప్రయోగాన్ని కాపాడగా పాదసూచిక దాని సందర్భార్థాన్ని స్పష్టం చేస్తుంది.
