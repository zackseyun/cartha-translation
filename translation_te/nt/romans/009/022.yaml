id: ROM.9.22
reference: Romans 9:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: te
  text: కాని ఒకవేళ[a] దేవుడు తన ఉగ్రతను ప్రదర్శించాలని, తన శక్తిని[b] తెలియజేయాలని కోరుతూ, నాశనానికి సిద్ధపరచబడిన[c] ఉగ్రత పాత్రలను ఎంతో సహనంతో భరించి ఉంటే—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “కాని ఒకవేళ ఇలా అయితే.” గ్రీకులో ఇక్కడ మొదలయ్యే అలంకారిక షరతు వాక్యం తదుపరి వచనంలో కొనసాగుతుంది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “తన బలాన్ని.” గ్రీకు పదబంధం అక్షరార్థంగా ఆయనకు శక్తిగలదానిని లేదా సాధ్యమైనదానిని సూచిస్తుంది; ఇక్కడ భావం దేవుని శక్తి.
    reason: lexical_alternative
  - marker: c
    text: “సిద్ధపరచబడిన” అనే కర్మణి రూపం ఈ పాత్రలను ఎవరు సిద్ధపరిచారో చెప్పదు. ఇది దేవుని చర్యను, వారి స్వీయ కఠినతను, లేదా తీర్పుకు సిద్ధంగా ఉన్న స్థితిని సూచిస్తుందా అనే విషయంలో వ్యాఖ్యాతల అభిప్రాయాలు భిన్నంగా ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: కాని ఒకవేళ
  rationale: తదుపరి వచనంలో కొనసాగుతున్న అలంకారిక షరతును స్పష్టంగా ఉంచుతుంది; ఈ వచనంలోనే వాక్యాన్ని పూర్తిచేయదు.
- source_word: θέλων
  choice: కోరుతూ
  rationale: ప్రధాన క్రియతో ముడిపడిన దేవుని ఉద్దేశాన్ని సూచించే వర్తమాన కృదంత భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐνδείξασθαι τὴν ὀργὴν
  choice: తన ఉగ్రతను ప్రదర్శించాలని
  rationale: ఉగ్రతను ఉద్దేశపూర్వకంగా కనబరచే భావాన్ని ఇస్తుంది; ‘ఉగ్రత’ న్యాయతీర్పుతో కూడిన దైవిక కోపాన్ని సూచిస్తుంది.
- source_word: γνωρίσαι τὸ δυνατὸν αὐτοῦ
  choice: తన శక్తిని తెలియజేయాలని
  rationale: τὸ δυνατὸν అనే నామవాచక విశేషణ ప్రయోగాన్ని సందర్భానుసారంగా సహజమైన ‘శక్తి’ అని అనువదిస్తుంది.
- source_word: ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ
  choice: ఎంతో సహనంతో భరించి ఉంటే
  rationale: షరతుతో కూడిన ప్రధాన క్రియను నిలుపుతూ, μακροθυμία సూచించే దీర్ఘకాల ఓర్పును ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: σκεύη ὀργῆς
  choice: ఉగ్రత పాత్రలను
  rationale: ముందున్న కుమ్మరి–మట్టి సందర్భంలోని పాత్ర రూపకాన్ని, అలాగే గ్రీకు షష్ఠీ విభక్తి పదబంధంలోని సంక్షిప్తతను అధిక వివరణ లేకుండా కాపాడుతుంది.
- source_word: κατηρτισμένα εἰς ἀπώλειαν
  choice: నాశనానికి సిద్ధపరచబడిన
  rationale: పరిపూర్ణ కర్మణి కృదంతంలోని సిద్ధస్థితిని తెలియజేస్తూ, ఎవరు సిద్ధపరిచారో పేర్కొనకుండా గ్రీకు వాక్యంలోని అస్పష్టతను నిలుపుతుంది.
theological_decisions:
- issue: κατηρτισμένα అనే కర్మణి కృదంతంలో కార్యనిర్వాహకుడు ఎవరు?
  choice: ‘సిద్ధపరచబడిన’ అని అనువదించి, ఎవరు సిద్ధపరిచారో చెప్పలేదు.
  alternative: దేవుడు నాశనానికి సిద్ధపరిచినవి; తమను తాము నాశనానికి సిద్ధం చేసుకున్నవి; నాశనానికి సిద్ధంగా ఉన్నవి.
  rationale: గ్రీకు పాఠం కార్యనిర్వాహకుణ్ణి స్పష్టంగా పేర్కొనదు. అందువల్ల వివాదాస్పదమైన దైవిక చర్య, స్వీయ కఠినత, లేదా తీర్పుకు సిద్ధస్థితి అనే అర్థాలలో దేనినీ అనువాదం నిర్ణయించదు.
- issue: εἰ తో మొదలై 23వ వచనంలో కొనసాగే అసంపూర్ణ షరతు వాక్యం
  choice: ‘కాని ఒకవేళ … భరించి ఉంటే—’ అని తెరిచి ఉంచబడింది.
  alternative: దీనిని ఈ వచనంలోనే పూర్తయిన ప్రత్యక్ష ప్రకటనగా మార్చడం.
  rationale: పౌలు వాక్య నిర్మాణం తదుపరి వచనంలో కొనసాగుతుంది. దీర్ఘ విరామ చిహ్నం ఆ కొనసాగింపును తెలుగులో గ్రాహ్యంగా చూపిస్తూ, గ్రీకు కంటే బలమైన నిర్ణయాత్మక ప్రకటనను చేర్చకుండా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. ‘పాత్రలు’ అనే పదం సందర్భంలోని కుమ్మరి రూపకాన్ని నిలుపుతుంది. వాక్యం 23వ వచనంలో కొనసాగుతుందని చూపడానికి చివర దీర్ఘ విరామ చిహ్నం ఉంచబడింది; ప్రధాన పాఠంలోని [a], [b], [c] గుర్తులు సంబంధిత స్థానాల్లో ఉన్నాయి.
