id: ROM.9.27
reference: Romans 9:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: te
  text: 'అయితే ఇశ్రాయేలు గురించి యెషయా ఇలా బిగ్గరగా ప్రకటిస్తున్నాడు: “ఇశ్రాయేలు కుమారుల సంఖ్య సముద్రపు ఇసుకలా ఉన్నప్పటికీ[a], శేషం మాత్రమే రక్షించబడుతుంది.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఇశ్రాయేలు కుమారుల సంఖ్య సముద్రపు ఇసుకలా ఉంటే.” గ్రీకు వాక్యం షరతు రూపంలో ఉంది; ఈ సందర్భంలో అది “ఉన్నప్పటికీ” అనే భావాన్ని ఇస్తుంది.
    reason: alternative_reading
  - marker: b
    text: “రక్షించబడుతుంది” అనే మాటకు “విడిపించబడుతుంది” అనే భావం కూడా ఉండవచ్చు. ఇది యెషయా ప్రవచనంలోని మిగిలి ఉన్న శేషాన్ని ప్రతిధ్వనిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వాదనతో ఉన్న స్వల్ప వ్యత్యాసాన్ని, వాక్యప్రవాహాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: κράζει
  choice: బిగ్గరగా ప్రకటిస్తున్నాడు
  rationale: క్రియలోని బలమైన, బహిరంగ ప్రకటన భావాన్నీ వర్తమానకాల సజీవతనూ నిలుపుతుంది.
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: ఇశ్రాయేలు గురించి
  rationale: ప్రవక్త ఉల్లేఖన సందర్భంలో ὑπέρ అంటే ‘పక్షంగా’ కంటే ‘గురించి’ అనే అర్థం సహజం.
- source_word: Ἐὰν ᾖ
  choice: ఉన్నప్పటికీ
  rationale: పెద్ద సంఖ్యకూ రక్షించబడే శేషానికీ మధ్య ఉన్న వ్యత్యాసాన్ని తెలిపే concessive భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; అక్షరార్థమైన షరతు రూపాన్ని పాదసూచికలో ఉంచుతుంది.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: ఇశ్రాయేలు కుమారులు
  rationale: నిబంధనసంబంధమైన సంప్రదాయ సమూహపదబంధంలోని ‘కుమారులు’ అనే రూపాన్ని నిలుపుతుంది.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: సముద్రపు ఇసుకలా
  rationale: లేఖనాల్లో పరిచితమైన ఉపమానాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τὸ ὑπόλειμμα
  choice: శేషం
  rationale: మిగిలి ఉంచబడిన సమూహాన్ని సూచించే ప్రవచనాత్మక, వేదాంతపరమైన భావానికి స్థిరమైన తెలుగు పదం.
- source_word: σωθήσεται
  choice: రక్షించబడుతుంది
  rationale: పౌలు సందర్భంలోని రక్షణ భావాన్ని నిలుపుతూ, యెషయా నేపథ్యంలోని విడిపింపు భావానికి కూడా తావిస్తుంది.
theological_decisions:
- issue: Ἐὰν ᾖ అనే షరతు వాక్యభాగం యొక్క భావం
  choice: ‘ఉన్నప్పటికీ’ అనే వ్యత్యాససూచక భావం
  alternative: ‘ఉంటే’ లేదా ‘ఒకవేళ ... ఉన్నా’
  rationale: ఇశ్రాయేలు సంఖ్య విస్తారమైనా శేషమే రక్షించబడుతుందనే ఉల్లేఖనంలోని వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా చూపుతుంది; మూలంలోని షరతు రూపాన్ని పాదసూచికలో కాపాడుతుంది.
- issue: σωθήσεται యొక్క అర్థం
  choice: ‘రక్షించబడుతుంది’
  alternative: ‘విడిపించబడుతుంది’ లేదా ‘కాపాడబడుతుంది’
  rationale: రోమీయులకు 9–11 సందర్భంలోని రక్షణసంబంధమైన గంభీరతను నిలుపుతుంది; ప్రవచన నేపథ్యంలోని భౌతిక లేదా చారిత్రక విడిపింపు భావాన్ని పూర్తిగా మూసివేయదు.
- issue: τὸ ὑπόλειμμα లోని ఏకవచన సమూహరూపం
  choice: ‘శేషం మాత్రమే’
  alternative: ‘మిగిలినవారు మాత్రమే’
  rationale: మూలంలోని ఏకవచన సమూహనామాన్ని, ప్రవచనాత్మక పదప్రయోగాన్ని నిలుపుతుంది; శేషం ఎంతమంది అన్నది లేదా దాని ఖచ్చిత వేదాంత నిర్వచనం ఏమిటన్నది జోడించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభమైన శైలి. ‘ఇశ్రాయేలు కుమారులు,’ ‘శేషం,’ ‘రక్షించబడుతుంది’ వంటి మూలపాఠానికి ముఖ్యమైన పదాలను నిలుపుతూ, వాక్యాన్ని సహజమైన తెలుగు క్రమంలో అమర్చాం.
