- source_word: ἵνα
  choice: … కొనసాగేందుకు
  rationale: గ్రీకు ఉద్దేశార్థక నిర్మాణాన్ని తెలుగులో ప్రయోజనార్థక క్రియారూపంతో చూపుతుంది; దానిని కేవలం ఫలితార్థంగా బలహీనపరచదు.
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ
  choice: ఎంపిక ప్రకారమైన దేవుని ఉద్దేశం
  rationale: ‘ఎంపిక ప్రకారం’ అనే గ్రీకు సంబంధాన్ని కనిపించేలా ఉంచుతుంది; నిర్దిష్ట సిద్ధాంత వ్యాఖ్యానాన్ని అనువాదంలోకి చొప్పించదు.
