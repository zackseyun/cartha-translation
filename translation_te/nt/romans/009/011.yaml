  rationale: μένω యొక్క ‘ఉండిపోవడం/కొనసాగడం’ అనే ప్రాథమిక భావాన్ని సందర్భానుకూలంగా, సహజ తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ముందస్తు నిర్ణయ సందర్భంలో ἵνα యొక్క బలం
  choice: ఉద్దేశార్థకంగా ‘… కొనసాగేందుకు’
  alternative: ఫలితార్థకంగా ‘దాని ఫలితంగా … కొనసాగింది’
  rationale: వాక్యనిర్మాణం సహజంగా ఉద్దేశాన్ని సూచిస్తుంది. అయితే విస్తృతమైన ముందస్తు నిర్ణయం–మానవ ప్రతిస్పందన వివాదాన్ని అనువాదమే పరిష్కరించకుండా ఉంచుతుంది.
- issue: ἐκλογή పదానికి అనువాదం
  choice: ఎంపిక
  alternative: ఎన్నిక
  rationale: ‘ఎంపిక’ ఆధునిక తెలుగులో సహజంగా అర్థమవుతుంది; రాజకీయ ఎన్నికల భావాన్ని రేకెత్తించే అవకాశాన్ని తగ్గిస్తూనే దేవుని ఎంపిక అనే సందర్భార్థాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం తరువాతి వచనంలో పూర్తయ్యే వాక్యభాగం కావడంతో చివర కామాను ఉంచాం. ‘ఉద్దేశం,’ ‘ఎంపిక’ వంటి పదాలు మూలంలోని భావసంబంధాన్ని స్పష్టంగా ఉంచుతూ మతశాఖాపరమైన విస్తరణను నివారిస్తాయి.
