source:
  edition: SBLGNT
  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: te
  text: ఎందుకంటే, వారు ఇంకా పుట్టకముందే, మంచి గానీ చెడు గానీ ఏదీ చేయకముందే[a], ఎంపిక ప్రకారం దేవుని ఉద్దేశం[b] కొనసాగేందుకు[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మంచి గానీ దుష్టమైనది గానీ.’ గ్రీకు పదం చెడ్డది, నీచమైనది, లేదా నైతికంగా దుష్టమైనది అనే భావాలను ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవుని ఎంపిక ఉద్దేశం’; అక్షరార్థంగా, ‘ఎంపిక ప్రకారం దేవుని ఉద్దేశం.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘స్థిరంగా నిలిచేందుకు.’ గ్రీకు క్రియకు ‘ఉండిపోవడం’ లేదా ‘కొనసాగడం’ అనే అర్థం ఉంది; ఇక్కడ స్థిరంగా నిలవడం అనే భావమూ ఉండవచ్చు.
    reason: lexical_alternative
