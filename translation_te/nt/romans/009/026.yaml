id: ROM.9.26
reference: Romans 9:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ ἔσται ἐν τῷ τόπῳ οὗ ἐρρέθη ⸀αὐτοῖς· Οὐ λαός μου ὑμεῖς, ἐκεῖ κληθήσονται υἱοὶ θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: te
  text: మరియు, “మీరు నా ప్రజలు కారు” అని వారికి చెప్పబడిన చోటే,[a] వారు సజీవుడైన దేవుని కుమారులు[b] అని పిలువబడతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: హోషేయ 1:10ను చూడండి (సెప్టుయజింట్‌లో 2:1); ఇది నిబంధన సంబంధ పునరుద్ధరణ భాషను ఉపయోగిస్తుంది.
    reason: cross_reference
  - marker: b
    text: లేదా, “సజీవుడైన దేవుని పిల్లలు.” గ్రీకు మూలంలో “కుమారులు” అని ఉంది; పుత్రత్వం, వారసత్వం అనే భావప్రతిధ్వనులను నిలుపడానికి ప్రధాన వచనంలో అదే ఉంచబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ τόπῳ οὗ ... ἐκεῖ
  choice: చెప్పబడిన చోటే ...
  rationale: ఒకే స్థలంలో జరిగే తిరుగుముఖాన్ని గ్రీకు వాక్యం బలంగా చూపిస్తుంది. తెలుగు ‘చోటే’ ఆ స్థానసామ్యాన్నీ ఉద్ఘాటననూ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐρρέθη αὐτοῖς
  choice: వారికి చెప్పబడిన
  rationale: కర్తను పేర్కొనని గ్రీకు కర్మణి ప్రయోగాన్ని అలాగే నిలుపుతుంది.
- source_word: Οὐ λαός μου ὑμεῖς
  choice: మీరు నా ప్రజలు కారు
  rationale: హోషేయలోని నిబంధనాత్మక ‘నా ప్రజలు’ అనే భాషను స్పష్టంగా, సహజమైన తెలుగు పదక్రమంలో నిలుపుతుంది.
- source_word: κληθήσονται
  choice: పిలువబడతారు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, అంతర్లీనంగా ఉన్న దైవిక కర్తను వచనంలో అదనంగా చేర్చదు.
- source_word: υἱοὶ
  choice: కుమారులు
  rationale: గ్రీకులోని పుంలింగ బహువచనాన్ని, దానితో ముడిపడగల పుత్రత్వం మరియు వారసత్వ భావప్రతిధ్వనులను నిలుపుతుంది.
- source_word: θεοῦ ζῶντος
  choice: సజీవుడైన దేవుని
  rationale: ‘జీవముగల దేవుడు’ అనే భావాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో వ్యక్తం చేసి, నిర్జీవ విగ్రహాలతో ఉండే బైబిలీయ వ్యత్యాసాన్ని నిలుపుతుంది.
theological_decisions:
- issue: υἱοὶ అనే ప్రతినిధి బహువచన పదం అనువాదం
  choice: కుమారులు
  alternative: పిల్లలు / కుమారులు, కుమార్తెలు
  rationale: మూలంలో τέκνα కాక υἱοὶ ఉంది. ‘కుమారులు’ అనే రూపం మూలపదాన్నీ పుత్రత్వం/వారసత్వ ప్రతిధ్వనులనూ నిలుపుతుంది; అయితే ఉద్దేశిత సమూహంలో స్త్రీలు కూడా ఉన్నందున సమగ్ర అర్థాన్ని పాదటిప్పణిలో తెలియజేస్తుంది.
- issue: λαός μου లోని నిబంధనాత్మక గుర్తింపు
  choice: నా ప్రజలు
  alternative: నా సొంత ప్రజలు
  rationale: హోషేయ నేపథ్యంలోని స్థిరమైన నిబంధన సూత్రాన్ని వ్యాఖ్యాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన బైబిలీయ శైలి. గ్రీకు వాక్యంలోని స్థల ఉద్ఘాటనను ‘చోటే’తో సహజంగా సంక్షిప్తం చేసింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన వచనంలో ఉన్నాయి.
