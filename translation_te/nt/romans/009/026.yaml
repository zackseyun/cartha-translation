  source_fidelity: 'ముసాయిదా ప్రధానంగా గ్రీకు భావాన్ని విశ్వసనీయంగా ఇస్తుంది: ‘నా ప్రజలు,’ అదే స్థలంలో జరిగే తిరుగుముఖం, భవిష్యత్ కర్మణి ‘పిలువబడతారు,’ మరియు ‘సజీవుడైన దేవుని కుమారులు’ అన్నీ సరిగ్గా ఉన్నాయి. అయితే ప్రారంభంలోని καὶ (‘మరియు/మరల’) అనుసంధానకాన్ని వదిలివేసింది. ἔσται యొక్క భవిష్యత్-సంభవ భావం తెలుగులో ‘పిలువబడతారు’ ద్వారా వాక్యస్థాయిలో తగినంతగా వ్యక్తమవుతుంది.'
