id: ROM.9.13
reference: Romans 9:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Τὸν Ἰακὼβ ἠγάπησα, τὸν δὲ Ἠσαῦ ἐμίσησα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/013.yaml
  text: 'as it is written: “Jacob I loved[b][a], but Esau I hated.”'
translation:
  language: te
  text: 'లేఖనంలో ఇలా వ్రాయబడి ఉంది: “నేను యాకోబును ప్రేమించాను; కాని ఏశావును ద్వేషించాను.”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ ఉల్లేఖనం మలాకీ 1:2–3 నుండి తీసుకోబడింది.
    reason: cross_reference
  - marker: b
    text: లేదా “తిరస్కరించాను,” లేక “తక్కువగా ప్రేమించాను.” ఇక్కడ “ద్వేషించాను” అనేది భావోద్వేగపూరితమైన శత్రుత్వాన్ని కాక, ఒడంబడికలో తిరస్కరించడాన్ని లేదా తులనాత్మక ప్రాధాన్యతను సూచిస్తుందని కొందరు అర్థం చేసుకుంటారు.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: లేఖనంలో ఇలా వ్రాయబడి ఉంది
  rationale: లేఖన ఉల్లేఖనాన్ని పరిచయం చేసే స్థిరమైన గ్రీకు సూత్రాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది; perfect passive భావాన్ని ‘వ్రాయబడి ఉంది’ నిలుపుతుంది.
- source_word: Ἰακώβ
  choice: యాకోబు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితమైన వ్యక్తినామ రూపం.
- source_word: ἠγάπησα
  choice: ప్రేమించాను
  rationale: ἀγαπάω క్రియ యొక్క ప్రత్యక్ష అర్థాన్ని, ఇక్కడి aorist రూపాన్ని సహజమైన భూతకాలంలో అందిస్తుంది.
- source_word: δὲ
  choice: మాత్రం
  rationale: యాకోబు–ఏశావు మధ్య ఉన్న స్పష్టమైన వ్యతిరేకతను తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: Ἠσαῦ
  choice: ఏశావు
  rationale: తెలుగు బైబిలు సంప్రదాయంలో సుపరిచితమైన వ్యక్తినామ రూపం.
- source_word: ἐμίσησα
  choice: ద్వేషించాను
  rationale: μισέω యొక్క ప్రత్యక్షమైన బలమైన అర్థాన్ని మృదువుపరచకుండా నిలుపుతుంది; ఇతర సందర్భార్థాలను పాదసూచికలో ఉంచుతుంది.
theological_decisions:
- issue: దైవిక ఎన్నికకు, సెమిటిక్ ప్రయోగానికి సంబంధించిన చర్చల దృష్ట్యా ‘ద్వేషించాను’ అనే మాటను మృదువుగా అనువదించాలా?
  choice: ప్రధాన పాఠ్యంలో ‘ద్వేషించాను’ అని ప్రత్యక్షంగా ఉంచడం
  alternative: ‘తిరస్కరించాను’ లేదా ‘తక్కువగా ప్రేమించాను’
  rationale: గ్రీకు పాఠ్యంలో సాధారణంగా ‘ద్వేషించు’ అనే అర్థమిచ్చే μισέω ఉంది. దాన్ని మృదువుపరచడం ఒక నిర్దిష్ట వ్యాఖ్యానాన్ని పాఠ్యంలోకి తెస్తుంది; అందువల్ల మూలంలోని వేదాంతపరమైన ఉద్రిక్తతను ప్రధాన పాఠ్యంలో నిలిపి, సాధ్యమైన సందర్భార్థాలను పాదసూచికలో తెలియజేస్తున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గంభీరమైన లేఖన శైలి. ‘ద్వేషించాను’ అనే బలమైన పదాన్ని మూలానికి నిబద్ధంగా నిలిపి, వ్యాఖ్యాన ప్రత్యామ్నాయాలను పాదసూచికకు పరిమితం చేశాం.
