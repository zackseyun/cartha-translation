id: ROM.9.4
reference: Romans 9:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/004.yaml
  text: who are Israelites[a], to whom belong the adoption, the glory, the covenants, the giving of the law, the worship, and the promises[d][c][b],
translation:
  language: te
  text: వారు ఇశ్రాయేలీయులు; దత్తపుత్రత్వం[c], మహిమ[b], నిబంధనలు, ధర్మశాస్త్ర ప్రదానం, ఆరాధన[d], వాగ్దానాలు—ఇవన్నీ వారికి చెందినవి.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారివి దత్తపుత్రత్వం, మహిమ, నిబంధనలు, ధర్మశాస్త్ర ప్రదానం, ఆరాధన, వాగ్దానాలు.”
    reason: స్వామ్యార్థక సంబంధవాచక నిర్మాణాన్ని మరింత రూపానుగుణంగా అనువదించే ప్రత్యామ్నాయం.
  - marker: b
    text: “మహిమ” అనేది ఇశ్రాయేలు మధ్య ప్రత్యక్షమైన దేవుని సన్నిధిని సూచించే అవకాశం ఉంది.
    reason: మూలపదంలోని సంభావ్య రక్షణ-చారిత్రక సూచనను వివరించడానికి.
  - marker: c
    text: లేదా, “దత్తపుత్రులుగా స్వీకరించబడడం” లేదా “పుత్రస్థానం.”
    reason: υἱοθεσία పదానికి సాధ్యమైన ప్రత్యామ్నాయాలను తెలియజేయడానికి.
  - marker: d
    text: అంటే, దేవుని ఎదుట ఇశ్రాయేలు నిర్వహించిన నిబంధనాపరమైన ఆరాధన మరియు సేవ.
    reason: λατρεία పదంలోని ఆరాధన-సేవ భావాన్ని సాంస్కృతికంగా స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: వారు ఇశ్రాయేలీయులు
  rationale: మునుపటి వచనంలో చెప్పబడిన పౌలు స్వజనులను వివరించే సంబంధవాచక నిర్మాణాన్ని సహజమైన ఆధునిక తెలుగులో అందిస్తుంది; మూలంలో లేని అదనపు ఉద్ఘాటనను చేర్చదు.
- source_word: ὧν
  choice: వారికే చెందినవి
  rationale: ఈ సంబంధవాచక సర్వనామంలోని స్వామ్యార్థాన్ని తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది. జాబితా తర్వాత ఉంచడం తెలుగు వాక్యనిర్మాణానికి అనుకూలం.
- source_word: υἱοθεσία
  choice: దత్తపుత్రులుగా స్వీకరించబడడం
  rationale: పుత్రస్థానంలో ఉంచడం లేదా దత్తత తీసుకోవడం అనే పౌలు వాడుకలోని భావాన్ని కాపాడుతుంది; కేవలం వ్యక్తిగత రక్షణానుభవంగా పరిమితం చేయకుండా ఇశ్రాయేలు ప్రజల నిబంధనాసంబంధ స్థితిని సూచిస్తుంది.
- source_word: δόξα
  choice: మహిమ
  rationale: గ్రీకు పదంలోని సంక్షిప్తతను, వేదాంతపరమైన గాఢతను కాపాడుతుంది; దేవుని ప్రత్యక్ష సన్నిధి అనే సంభావ్య సూచనను ప్రధాన పాఠ్యంలో విస్తరించి నిర్ధారించదు.
- source_word: διαθῆκαι
  choice: నిబంధనలు
  rationale: గ్రీకులోని బహువచనాన్ని నిలుపుతూ దేవుడు ఇశ్రాయేలుతో చేసిన నిబంధనలను సహజంగా సూచిస్తుంది.
- source_word: νομοθεσία
  choice: ధర్మశాస్త్రం ఇవ్వబడడం
  rationale: ఇది కేవలం ధర్మశాస్త్రాన్నే కాక దాని ప్రదానాన్ని సూచిస్తున్నందున క్రియాత్మక భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: λατρεία
  choice: ఆరాధనసేవ
  rationale: దేవునికి అర్పించే నిబంధనాపరమైన ఆరాధన మరియు సేవ అనే రెండు అనుసంధానిత భావాలను తెలియజేస్తుంది; ఆలయసేవకు మాత్రమే అనవసరంగా పరిమితం చేయదు.
- source_word: ἐπαγγελίαι
  choice: వాగ్దానాలు
  rationale: మూలంలోని బహువచనాన్ని నిలుపుతూ దేవుడు ఇశ్రాయేలుకు ఇచ్చిన వాగ్దానాలను స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: ఇశ్రాయేలుకు సంబంధించి υἱοθεσία భావం
  choice: దత్తపుత్రులుగా స్వీకరించబడడం
  alternative: దత్తపుత్రత్వం; పుత్రస్థానం
  rationale: ఈ సందర్భం ఇశ్రాయేలు ప్రజలకు చారిత్రకంగా లభించిన నిబంధనా ఆధిక్యతలను జాబితా చేస్తుంది. అందువల్ల దత్తత రూపకాన్ని కాపాడుతూ, దాన్ని తర్వాతి వ్యక్తిగత రక్షణశాస్త్ర భావాలకు మాత్రమే పరిమితం చేయలేదు.
- issue: ἡ δόξα దేనిని సూచిస్తుంది
  choice: ప్రధాన పాఠ్యంలో ‘మహిమ’ అని మాత్రమే ఉంచడం
  alternative: దైవమహిమ; దేవుని ప్రత్యక్ష సన్నిధి మహిమ
  rationale: ఇది ఇశ్రాయేలు మధ్య ప్రత్యక్షమైన దేవుని మహిమను సూచించే అవకాశం బలంగా ఉన్నా, గ్రీకు పాఠ్యం కేవలం ‘మహిమ’ అని చెబుతుంది. కాబట్టి ప్రధాన పాఠ్యంలో అస్పష్టతను నిలిపి, వివరణను పాదసూచికలో ఇచ్చాం.
- issue: λατρεία పరిధి
  choice: ఆరాధనసేవ
  alternative: ఆరాధన; ఆలయసేవ; యాజకసేవ
  rationale: ఇశ్రాయేలుకు నియమించబడిన దేవారాధన మరియు సేవను సూచిస్తుంది. ‘ఆలయసేవ’ లేదా ‘యాజకసేవ’ అని మాత్రమే అనడం మూలపద పరిధిని అతిగా కుదించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. జాబితా స్పష్టత కోసం అర్ధవిరామం మరియు దీర్ఘవిరామం వాడబడ్డాయి. ‘నిబంధనలు’ అనే బహువచనం, ‘ధర్మశాస్త్రం ఇవ్వబడడం’ అనే ప్రదాన భావం, ‘మహిమ’లోని ఉద్దేశపూర్వక సంక్షిప్తత అన్నీ మూలానికి అనుగుణంగా నిలుపబడ్డాయి.
