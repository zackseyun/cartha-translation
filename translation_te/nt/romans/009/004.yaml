revisions:
- from: వారు ఇశ్రాయేలీయులు; దత్తపుత్రులుగా స్వీకరించబడడం[c], మహిమ[b], నిబంధనలు, ధర్మశాస్త్రం ఇవ్వబడడం, ఆరాధనసేవ[d], వాగ్దానాలు—ఇవన్నీ వారికే చెందినవి.[a]
  to: వారు ఇశ్రాయేలీయులు; దత్తపుత్రత్వం[c], మహిమ[b], నిబంధనలు, ధర్మశాస్త్ర ప్రదానం, ఆరాధన[d], వాగ్దానాలు—ఇవన్నీ వారికి చెందినవి.[a]
  rationale: ‘వారికే’లోని మూలంలో లేని ప్రత్యేకత సూచనను తొలగించి, ὧν యొక్క స్వామ్యార్థాన్ని ‘వారికి చెందినవి’తో కాపాడాం. υἱοθεσίαని ‘దత్తపుత్రత్వం’గా మార్చి జాబితా సమాంతరతను, తెలుగు సహజత్వాన్ని మెరుగుపరిచాం. λατρείαకి ప్రధాన పాఠ్యంలో ‘ఆరాధన’ను ఉంచి, దాని సేవ/ఆచారసంబంధ పరిమాణాన్ని పాదసూచికలో నిలిపాం.
