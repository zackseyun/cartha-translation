id: ROM.6.16
reference: Romans 6:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: te
  text: మీరు విధేయత చూపడానికి ఎవరికి మిమ్మల్ని మీరు బానిసలుగా అప్పగించుకుంటారో, మీరు విధేయత చూపే వారికే బానిసలని మీకు తెలియదా? మరణానికి దారితీసే పాపానికైనా, నీతికి[a] దారితీసే విధేయతకైనా మీరు బానిసలే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, న్యాయానికి.
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε
  choice: మిమ్మల్ని మీరు ... అప్పగించుకుంటారో
  rationale: తమను మరొకరి అధీనానికి ఉంచుకోవడం అనే మూలభావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δούλους / δοῦλοί
  choice: బానిసలుగా / బానిసలు
  rationale: పౌలు వాడిన యజమాని-బానిస రూపకంలో అధీనతను బలంగా నిలుపుతుంది; ‘సేవకులు’ అనే పదం ఆ భావాన్ని బలహీనపరచవచ్చు.
- source_word: εἰς ὑπακοήν
  choice: విధేయత చూపడానికి
  rationale: εἰς యొక్క ఉద్దేశార్థాన్ని సహజంగా తెలియజేస్తుంది; ὑπακοή యొక్క విధేయత భావాన్ని కాపాడుతుంది.
- source_word: ᾧ ὑπακούετε
  choice: మీరు విధేయత చూపే వారికే
  rationale: సందర్భంలోని యజమాని సంబంధాన్ని తెలుగులో స్పష్టంగా, అదనపు ‘యజమాని’ అనే నామవాచకాన్ని చేర్చకుండా వ్యక్తం చేస్తుంది.
- source_word: ἁμαρτίας
  choice: పాపానికి
  rationale: పాపాన్ని వ్యక్తీకరించిన శక్తిగా సందర్భం సూచించినప్పటికీ, గ్రీకు పాఠంలోని సరళమైన పదాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: εἰς θάνατον
  choice: మరణానికి దారితీసే
  rationale: εἰς లోని ఫలిత లేదా దిశ భావాన్ని సులభంగా తెలియజేస్తుంది.
- source_word: ὑπακοῆς
  choice: విధేయతకు
  rationale: పాపానికి ప్రతిగా ఉన్న అమూర్త నామవాచక రూపాన్ని నిలుపుతూ వాక్య సమాంతరతను కాపాడుతుంది.
- source_word: δικαιοσύνην
  choice: నీతి
  rationale: పౌలు రచనలలోని నైతిక-దైవశాస్త్రీయ విస్తృతిని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘న్యాయం’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: పౌలు చూపిన వ్యత్యాసంలో δικαιοσύνη అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఇక్కడ పాపం-మరణం అనే సంబంధానికి ప్రతిగా విధేయత-δικαιοσύνη అనే నైతిక, ఆధ్యాత్మిక సంబంధం ఉంది. ‘నీతి’ ఆ విస్తృత భావాన్ని కాపాడుతుంది; ‘న్యాయం’ కూడా పదార్థపరంగా సాధ్యమైనందున పాదసూచికలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ప్రశ్నారూపం, బానిసత్వ రూపకం, పాపం–విధేయత మధ్య సమాంతర వ్యత్యాసం నిలుపబడ్డాయి.
