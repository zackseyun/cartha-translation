id: ROM.6.4
reference: Romans 6:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: te
  text: 'కాబట్టి, బాప్తిస్మం ద్వారా మనం మరణంలోకి ఆయనతో కలిసి పాతిపెట్టబడ్డాం, తద్వారా తండ్రి మహిమ ద్వారా మెస్సీయ[a] మృతులలోనుండి లేపబడినట్లే, మనమూ నూతన జీవనంలో నడుచుకొనునట్లు.


    [a] లేదా, “క్రీస్తు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “క్రీస్తు.”
    reason: Χριστόςకు సుపరిచితమైన ప్రత్యామ్నాయ అనువాదం.
lexical_decisions:
- source_word: συνετάφημεν
  choice: ఆయనతో కలిసి పాతిపెట్టబడ్డాం
  rationale: సυν-లోని ‘కలిసి/తో’ భావాన్ని సహజమైన తెలుగులో స్పష్టంగా తెలిపి, భూతకాల నిష్క్రియ రూపాన్ని నిలిపింది.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదననుండి వచ్చే నిర్ధారణను సూచిస్తుంది.
- source_word: διὰ τοῦ βαπτίσματος
  choice: బాప్తిస్మం ద్వారా
  rationale: διά + షష్ఠీ విభక్తిలోని సాధనార్థక భావాన్ని ఉంచుతూ, నిర్దిష్టమైన సాక్రమెంటల్ సిద్ధాంతాన్ని అనువాదంలో చొప్పించదు.
- source_word: εἰς τὸν θάνατον
  choice: మరణంలోకి ప్రవేశించి
  rationale: εἰς యొక్క దిశాత్మక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘ప్రవేశించి’ అనేది అర్థస్పష్టత కోసం సందర్భానుగుణంగా చేర్చబడింది.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: Χριστός యొక్క బిరుదు భావాన్ని తెలుగులో నిలుపుతుంది; సాధారణ ప్రత్యామ్నాయం ‘క్రీస్తు’ను పాదటిప్పణిలో ఇచ్చాం.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: మృతుల మధ్యనుండి లేపబడటం అనే మూలపాఠ భావాన్ని సూటిగా నిలుపుతుంది.
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: తండ్రి మహిమ ద్వారా
  rationale: διά యొక్క సాధనార్థక భావాన్నీ, δόξα యొక్క ‘మహిమ’ అనే విస్తృత భావాన్నీ కాపాడుతుంది.
- source_word: ἐν καινότητι ζωῆς περιπατήσωμεν
  choice: నూతన జీవనంలో నడుచుకోవడానికి
  rationale: ‘నడుచుకోవడం’ అనే పౌలు రూపకాన్ని నిలుపుతూ, καινότης ζωῆςను ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: బాప్తిస్మం మరియు క్రీస్తుతో ఐక్యత మధ్య సంబంధాన్ని ఎలా వ్యక్తం చేయాలి
  choice: బాప్తిస్మం ద్వారా
  alternative: బాప్తిస్మం చేత
  rationale: మూలంలోని సాధనార్థక సంబంధాన్ని నిలిపినా, అది ఎలా కార్యసాధకం అవుతుందనే విషయంలో ఏ సంప్రదాయానికి ప్రత్యేకమైన సిద్ధాంతాన్నీ నిర్ణయించదు.
- issue: Χριστόςను బిరుదుగా లేదా పేరుగా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఇక్కడ బిరుదు భావాన్ని ప్రధాన పాఠంలో ఉంచి, తెలుగు క్రైస్తవ వాడుకలో సుపరిచితమైన రూపాన్ని పాదటిప్పణిలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని ఉద్దేశార్థాన్ని తెలుగులో స్పష్టంగా చూపడానికి ఉపవాక్య క్రమాన్ని మార్చాం; ‘నడుచుకోవడం’ అనే మూల రూపకాన్ని మాత్రం నిలిపాం.
