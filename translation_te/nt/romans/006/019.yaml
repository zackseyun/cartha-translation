id: ROM.6.19
reference: Romans 6:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: te
  text: మీ శరీరపు బలహీనతను బట్టి నేను మానవుల మాటతీరులో మాట్లాడుతున్నాను. మీరు మీ అవయవాలను అపవిత్రతకూ అక్రమానికీ బానిసలుగా, అక్రమానికి దారితీసేలా సమర్పించినట్లే, ఇప్పుడు మీ అవయవాలను నీతికి[a] బానిసలుగా, పరిశుద్ధీకరణకు దారితీసేలా సమర్పించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: నేను మానవ రీతిలో మాట్లాడుతున్నాను
  rationale: సాధారణ మానవ అవగాహనకు అనుగుణంగా మాట్లాడుతున్నాననే గ్రీకు నుడికార భావాన్ని, దానిని కేవలం ‘ఉపమానం’గా పరిమితం చేయకుండా సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀσθένειαν τῆς σαρκὸς ὑμῶν
  choice: మీ శరీర సంబంధమైన బలహీనత
  rationale: σάρξ యొక్క విస్తృతిని ‘పాప స్వభావం’గా సంకుచితం చేయకుండా, తెలుగులో కేవలం శారీరక బలహీనతగానే అపార్థం కాకుండా ‘శరీర సంబంధమైన’ అని ఇచ్చింది.
- source_word: παρεστήσατε / παραστήσατε
  choice: అప్పగించి / అప్పగించి
  rationale: గత సమర్పణకూ ప్రస్తుత ఆజ్ఞకూ మధ్య ఉన్న ఒకే క్రియాపద సంబంధాన్ని నిలుపుతూ, బానిసత్వ రూపకంలో సహజంగా వినిపిస్తుంది.
- source_word: τὰ μέλη
  choice: మీ అవయవాలను
  rationale: శరీర భాగాలు, వాటి సామర్థ్యాలు అనే పౌలు వాడుకను స్పష్టమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: δοῦλα
  choice: బానిసలుగా
  rationale: రోమా 6లోని అధీనత, యజమానిత్వం అనే బలమైన బానిసత్వ రూపకాన్ని ‘సేవకులు’ కంటే నేరుగా కాపాడుతుంది.
- source_word: ἀκαθαρσίᾳ
  choice: అపవిత్రతకు
  rationale: నైతిక అపరిశుద్ధత భావాన్ని సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: అక్రమానికి / అక్రమానికి
  rationale: రెండు ప్రయోగాల్లోనూ ఒకే పదాన్ని ఉంచి మూలంలోని పునరుక్తి, పెరుగుదల భావాన్ని కాపాడుతుంది.
- source_word: εἰς τὴν ἀνομίαν
  choice: మరింత అక్రమానికి దారితీసినట్లే
  rationale: εἰς సూచించే దిశ లేదా ఫలితాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, అక్రమం మరింత అక్రమానికి తీసుకెళ్లే పురోగతిని స్పష్టం చేస్తుంది.
- source_word: δικαιοσύνῃ
  choice: నీతికి
  rationale: అపవిత్రత, అక్రమాలకు ఎదురుగా ఉన్న నైతిక సరితనాన్ని తెలియజేస్తుంది; ‘న్యాయం’ అనే సాధ్యమైన అర్థాన్ని పాదటిప్పణిలో నిలుపుతుంది.
- source_word: εἰς ἁγιασμόν
  choice: పరిశుద్ధీకరణకు దారితీయండి
  rationale: దిశ లేదా ఫలిత భావాన్ని, పరిశుద్ధ స్థితివైపు సాగే ప్రక్రియను రెండింటినీ కాపాడుతుంది.
theological_decisions:
- issue: ‘మీ శరీర బలహీనత’లో σάρξ అర్థం
  choice: శరీర సంబంధమైన
  alternative: పాప స్వభావం
  rationale: ఇక్కడ మానవుని శరీరధారియైన పరిమిత స్థితి, పాపానికి లోనయ్యే బలహీనత రెండూ సూచితమవవచ్చు. ‘పాప స్వభావం’ అని అనువదిస్తే గ్రీకు పదంలోని విస్తృతి అనవసరంగా సంకుచితమవుతుంది.
- issue: పౌలు వాడుకలో δικαιοσύνη అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ వాక్యంలో అపవిత్రత, అక్రమాలకు ఉన్న నైతిక వ్యతిరేకత దృష్ట్యా ‘నీతి’ ప్రధాన పాఠ్యంలో సరిపోతుంది; ‘న్యాయం’ అనే నిజమైన ప్రత్యామ్నాయాన్ని పాదటిప్పణి కాపాడుతుంది.
- issue: ἁγιασμός యొక్క ఫలిత/ప్రక్రియ భావం
  choice: పరిశుద్ధీకరణ
  alternative: పరిశుద్ధత
  rationale: εἰς తో కలిసి ఇది పరిశుద్ధత వైపు నడిపే ప్రక్రియ లేదా ఫలితాన్ని సూచిస్తుంది. ‘పరిశుద్ధీకరణ’ ఆ చలన భావాన్ని బలంగా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని బానిసత్వ రూపకం, అక్రమం అనే పద పునరుక్తి, గత ప్రవర్తన–ప్రస్తుత ఆజ్ఞ మధ్య సమాంతర నిర్మాణం సాధ్యమైనంతవరకు నిలుపబడ్డాయి. ప్రధాన పాఠ్యంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
