id: ROM.6.15
reference: Romans 6:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τί οὖν; ⸀ἁμαρτήσωμεν ὅτι οὐκ ἐσμὲν ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: te
  text: అయితే ఏమిటి? మనం ధర్మశాస్త్రం కింద కాక కృప కింద ఉన్నాం కాబట్టి పాపం చేద్దామా?[a] ఎంతమాత్రమూ కాదు![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనం పాపం చేయాలా?”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అలా ఎన్నటికీ జరగకూడదు!”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: అయితే ఏమిటి?
  rationale: పౌలు వాదనలోని తదుపరి నిర్ధారణాత్మక ప్రశ్నను, మూలంలో లేని పదాలను చేర్చకుండా, సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἁμαρτήσωμεν
  choice: పాపం చేద్దామా?
  rationale: మొదటి పురుష బహువచన అయోరిస్టు సబ్జంక్టివ్ ఇక్కడ ఆలోచనార్థక ప్రశ్నగా ఉంది. ‘చేద్దామా?’ ఆ ప్రతిపాదనాత్మక, అలంకారిక భావాన్ని సహజంగా అందిస్తుంది.
- source_word: ὅτι
  choice: కాబట్టి
  rationale: ధర్మశాస్త్రం కింద కాక కృప కింద ఉండటాన్ని పాపం చేయడానికి ప్రతిపాదిత కారణంగా చూపే సంబంధాన్ని తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑπὸ νόμον
  choice: ధర్మశాస్త్రం కింద
  rationale: νόμοςకు పౌలు రచనలలో స్థిరమైన తెలుగు సమానార్థకంగా ‘ధర్మశాస్త్రం’ను ఉంచుతూ, ‘కింద’ ద్వారా ὑπό యొక్క అధికార లేదా పరిధి భావాన్ని కాపాడుతుంది; ‘మోషే ధర్మశాస్త్రం’ అని పరిధిని అనవసరంగా కుదించదు.
- source_word: ὑπὸ χάριν
  choice: కృప కింద
  rationale: χάριςకు స్థిరమైన వేదాంతపరమైన తెలుగు పదం ‘కృప’; సమాంతర నిర్మాణాన్ని నిలబెట్టి ధర్మశాస్త్రంతో ఉన్న వ్యత్యాసాన్ని సంరక్షిస్తుంది.
- source_word: μὴ γένοιτο
  choice: ఎంతమాత్రమూ వద్దు!
  rationale: ఆ ప్రతిపాదనను పౌలు తీవ్రంగా తిరస్కరించే భావాన్ని గౌరవప్రదమైన, సులభంగా అర్థమయ్యే ఆధునిక తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: νόμος యొక్క పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘ధర్మశాస్త్రం’ అని అనువదించడం
  alternative: ‘మోషే ధర్మశాస్త్రం’ లేదా సాధారణంగా ‘నియమం’
  rationale: మూల గ్రీకులో ఆర్టికల్ లేదు. ‘మోషే ధర్మశాస్త్రం’ అని చేర్చడం భావాన్ని ముందుగానే కుదిస్తుంది; ‘ధర్మశాస్త్రం’ పౌలు ఉద్దేశించిన పరిధిని సందర్భం నిర్ణయించనిస్తూ వేదాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
- issue: ἁμαρτήσωμεν యొక్క ఆలోచనార్థక బలం
  choice: ‘పాపం చేద్దామా?’
  alternative: ‘పాపం చేయాలా?’
  rationale: ‘చేద్దామా?’ మొదటి పురుష బహువచన ప్రతిపాదనను నేరుగా నిలుపుతుంది; ఇది అనుమతి గురించిన ప్రశ్నగా మాత్రమే భావాన్ని మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. ‘ధర్మశాస్త్రం’, ‘కృప’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచి, ప్రశ్నోత్తరంలోని వాదనాత్మక తీవ్రతను స్పష్టంగా కాపాడింది.
