  text: And having been freed from sin[b][a], you were enslaved to righteousness.
translation:
  language: te
  text: అయితే, పాపం నుండి విడుదల పొందిన మీరు నీతికి[a] బానిసలుగా చేయబడ్డారు.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “న్యాయానికి.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “మీరు నీతికి దాసులుగా చేయబడ్డారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: విడుదల పొందిన
  rationale: అయోరిస్ట్ కర్మణి కృదంతం కావడంతో, సంబోధితులు పొందిన పూర్తయిన చర్యను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: పౌలు వాదనను కొనసాగిస్తూ స్వల్ప వ్యత్యాసాన్ని సూచించే అనుసంధాన పదంగా ఇక్కడ సహజంగా సరిపోతుంది.
- source_word: ἁμαρτίας
  choice: పాపం
  rationale: ఏకవచన రూపాన్ని నిలుపుతూ, పాపాన్ని పాలించే శక్తిగా భావించగల పౌలు ప్రయోగంలోని అర్థఛాయను కూడా కాపాడుతుంది.
- source_word: ἐδουλώθητε
  choice: బానిసలుగా చేయబడ్డారు
  rationale: కర్మణి రూపాన్ని, అలాగే యజమానిత్వ బదిలీని సూచించే బలమైన బానిసత్వ రూపకాన్ని మృదువుపరచకుండా నిలుపుతుంది.
- source_word: δικαιοσύνῃ
  choice: నీతికి
  rationale: నైతిక సదాచారంతో పాటు న్యాయసంబంధమైన అర్థఛాయలను కలిగి ఉండగల విస్తృతమైన పౌలు ప్రయోగానికి 'నీతి' సహజమైన ప్రధాన సమానార్థకం.
theological_decisions:
- issue: δουλόω అనే బానిసత్వ రూపకాన్ని అనువదించడం
  choice: బానిసలుగా చేయబడ్డారు
  alternative: నీతికి దాసులయ్యారు
  rationale: రోమీయులు 6లోని బానిసత్వ రూపకం పౌలు వాదనకు కేంద్రమైనది. ఈ అనువాదం దాని కఠినతను, కర్మణి భావాన్ని నిలుపుతూ, పాపం ఆధిపత్యం నుండి నీతి ఆధిపత్యానికి జరిగిన మార్పును మృదువుపరచదు.
- issue: δικαιοσύνη యొక్క అర్థ పరిధి
  choice: నీతి
  alternative: న్యాయం
  rationale: సందర్భంలో 'నీతి' ప్రధానంగా సరిపోతుంది; అయితే మూలపదానికి 'న్యాయం' అనే అర్థం కూడా సాధ్యమైనందున దాన్ని పాదటిప్పణిలో నిలుపుతున్నాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్య నిర్మాణం. మూలంలోని కర్మణి రూపం, పాపం మరియు నీతి మధ్య యజమానిత్వ మార్పును సూచించే బానిసత్వ రూపకం రెండూ నిలుపబడ్డాయి.
