id: ROM.6.14
reference: Romans 6:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει, οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: te
  text: ఎందుకంటే పాపం మీపై ఏలదు; మీరు ధర్మశాస్త్రానికి లోబడి కాక, కృపకు లోబడి ఉన్నారు కాబట్టి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁμαρτία
  choice: పాపం
  rationale: పౌలు వాడే భావానికి సహజమైన ప్రామాణిక పదం. ఇక్కడ పాపం ఏలే శక్తిగా వ్యక్తీకరించబడినప్పటికీ, అనువాదంలో అదనపు వివరణను చేర్చలేదు.
- source_word: κυριεύσει
  choice: ఏలదు
  rationale: యజమానిగా అధికారం చెలాయించడం అనే క్రియాభావాన్ని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; పాపం పాలకశక్తిగా చిత్రించబడటాన్ని నిలుపుతుంది.
- source_word: ὑπὸ νόμον
  choice: ధర్మశాస్త్రానికి లోబడి
  rationale: పదశః ‘ధర్మశాస్త్రం కింద’ అనే భావాన్ని ఆధునిక తెలుగులో దాని అధికారం లేదా పరిపాలనకు లోబడి ఉండడంగా సహజంగా తెలియజేస్తుంది.
- source_word: χάριν
  choice: కృపకు లోబడి
  rationale: పౌలు రచనల్లో νόμοςతో ఉన్న వ్యత్యాసాన్ని నిలిపే స్థిరమైన వేదాంతపర పదం ‘కృప’; సమాంతర వాక్యనిర్మాణం కోసం ‘లోబడి’ని పునరావృతం చేశాం.
- source_word: γὰρ … γάρ
  choice: ఎందుకంటే … ;
  rationale: మొదటి γάρ ముందరి సందర్భానికి కారణసంబంధాన్ని చూపుతుంది. రెండవ γάρ మొదటి వాక్యానికి కారణాన్ని పరిచయం చేస్తుంది; తెలుగులో ఒకే వాక్యంలోని నిర్మాణం మరియు అర్ధవిరామం ఆ వివరణాత్మక సంబంధాన్ని సహజంగా తెలియజేస్తాయి.
theological_decisions:
- issue: పాపాన్ని పాలకశక్తిగా వ్యక్తీకరించడం
  choice: ‘పాపం మీ మీద ఏలదు’ అని అనువదించడం
  alternative: ‘పాపం మీ మీద ఆధిపత్యం చెలాయించదు’
  rationale: మూలంలోని వ్యక్తీకరణను కాపాడుతూ, పాపాన్ని ప్రత్యేక నామంలా లేదా మరింత నిర్దిష్ట సిద్ధాంతపర శక్తిలా చూపకుండా ఉంచుతుంది.
- issue: ὑπὸ νόμον మరియు ὑπὸ χάριν మధ్య వ్యత్యాసం
  choice: రెండింటినీ ‘...కు లోబడి’ అనే సమాంతర నిర్మాణంతో అనువదించడం
  alternative: ‘ధర్మశాస్త్రం కింద కాక, కృప కింద’
  rationale: అధికారం లేదా పరిపాలనా పరిధి అనే రూపకాన్ని అర్థవంతమైన ఆధునిక తెలుగులో చూపుతుంది; ధర్మశాస్త్రం లేదా కృప యొక్క స్వభావాన్ని అదనంగా నిర్వచించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా ఉండేలా, అయితే గంభీరమైన శైలిని కాపాడుతూ సంక్షిప్తంగా రూపొందించబడింది. ‘ధర్మశాస్త్రం,’ ‘కృప’ అనే స్థిరమైన బైబిలు పదజాలం నిలుపబడింది.
