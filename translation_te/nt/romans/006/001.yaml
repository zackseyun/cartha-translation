id: ROM.6.1
reference: Romans 6:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ⸀ἐπιμένωμεν τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/001.yaml
  text: What then shall we say? Should we continue in sin so that grace may increase?[a][b]
translation:
  language: te
  text: అయితే, మనం ఏమని చెప్పాలి? కృప మరింత పెరగడానికి మనం పాపంలో కొనసాగాలా?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘మనం పాపంలో పట్టుదలగా కొనసాగాలా?’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘కృప సమృద్ధిగా పెరగడానికి.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: అయితే
  rationale: పౌలు ముందటి వాదన నుంచి తీసుకొస్తున్న నిర్ధారణాత్మక మలుపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐροῦμεν
  choice: మనం ఏమని చెప్పాలి?
  rationale: భవిష్యత్ రూపంలో ఉన్న ఆలోచనాత్మక ప్రశ్నను తెలుగు వాక్యరీతికి సహజంగా, వాక్చాతుర్యంతో అందిస్తుంది.
- source_word: ἐπιμένωμεν
  choice: మనం ... కొనసాగాలా?
  rationale: కొనసాగుతున్న ప్రవర్తనను గురించి అడిగే వర్తమాన సుబ్జంక్టివ్ భావాన్ని నిలుపుతుంది; ఇది అనుమతిని ప్రకటించకుండా ప్రతిపాదిత నడవడిపై ప్రశ్నగా ఉంచుతుంది.
- source_word: τῇ ἁμαρτίᾳ
  choice: పాపంలోనే
  rationale: పాపం అనే పరిధిలో లేదా ఆచరణలో నిలిచి ఉండటాన్ని సూచిస్తుంది; ‘నే’ కొనసాగింపుపై ఉన్న వాక్యబలాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἵνα
  choice: విస్తరించేలా
  rationale: ప్రశ్నలో ప్రతిపాదించిన ఉద్దేశం లేదా ఫలితాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἡ χάρις
  choice: కృప
  rationale: ఇక్కడ దేవుని అనుగ్రహపూర్వక దయను సూచించే స్థిరమైన, సందర్భోచిత తెలుగు పదం.
- source_word: πλεονάσῃ
  choice: మరింత విస్తరించే
  rationale: పరిమాణం లేదా వ్యాప్తి పెరగడాన్ని ఆధునిక పాఠకులకు సహజంగా తెలియజేస్తుంది; ‘సమృద్ధిగా పెరుగు’ అనే ప్రత్యామ్నాయ భావాన్ని పాదటిప్పణిలో ఉంచింది.
theological_decisions:
- issue: పౌలు ప్రశ్నను అనుమతి, బాధ్యత, లేదా కేవలం భవిష్యత్ అంచనాగా చూపాలా
  choice: ప్రతిపాదిత నైతిక ప్రవర్తనను ప్రశ్నించే విధంగా ‘మనం పాపంలోనే కొనసాగాలా?’
  alternative: ‘మనం పాపంలోనే కొనసాగుదామా?’
  rationale: గ్రీకు సుబ్జంక్టివ్ ఒక ఆలోచనాత్మక వాక్చాతుర్య ప్రశ్నను వేస్తుంది. తెలుగు ‘కొనసాగాలా?’ దాని నైతిక బలాన్ని తెలియజేస్తూ, సమాధానాన్ని ఈ వచనంలోనే ముందుగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. పౌలు వాక్చాతుర్య ప్రశ్నలోని ఉద్దేశ-ఫలిత ఉద్రిక్తతను పరిష్కరించకుండా నిలిపింది; అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
