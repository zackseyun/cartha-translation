id: ROM.6.21
reference: Romans 6:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: te
  text: అయితే, ఇప్పుడు మీరు సిగ్గుపడుతున్న వాటివల్ల అప్పుడు మీకు ఏ ఫలం కలిగింది? ఎందుకంటే వాటి అంతం[a] మరణమే.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పర్యవసానం.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: ఏ
  rationale: ఫలితం ఏమిటని ప్రశ్నించే అలంకారిక ప్రశ్నను సహజమైన తెలుగులో నేరుగా వ్యక్తం చేస్తుంది.
- source_word: καρπὸν
  choice: ఫలం
  rationale: పౌలు ఉపయోగించిన ఫలాన్ని ఉత్పత్తితో పోల్చే రూపకాన్ని నిలుపుతుంది; దానిని కేవలం ‘ప్రయోజనం’ లేదా ‘ఫలితం’గా సరళీకరించదు.
- source_word: εἴχετε
  choice: మీకు … కలిగింది
  rationale: గతంలోని స్థితి లేదా పొందిన ఫలాన్ని ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τότε
  choice: అప్పుడు
  rationale: తరువాత వచ్చే ‘ఇప్పుడు’తో ఉన్న కాల వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ἐφ’ οἷς
  choice: వాటివల్ల
  rationale: వారు గతంలో చేసిన లేదా అనుసరించిన వాటి నుంచి వచ్చిన ఫలాన్ని సూచించే సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: ‘అప్పుడు’తో పౌలు ఉద్దేశించిన స్పష్టమైన కాల వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: ἐπαισχύνεσθε
  choice: మీరు సిగ్గుపడుతున్న
  rationale: నైతిక భారమున్న సిగ్గును నేరుగా తెలియజేస్తుంది; బలహీనమైన ‘ఇబ్బందిపడుతున్న’ వంటి పదాన్ని నివారిస్తుంది.
- source_word: τέλος
  choice: అంతం
  rationale: చివరి గమ్యం, పర్యవసానం అనే రెండు భావసంభావ్యతలను నిలుపుతుంది; ‘ఫలితం’ అని మాత్రమే అనువదించి అర్థాన్ని ముందుగానే పరిమితం చేయదు.
- source_word: ἐκείνων
  choice: వాటి
  rationale: ముందు ప్రస్తావించిన, ఇప్పుడు వారు సిగ్గుపడుతున్న విషయాలను స్పష్టంగా సూచిస్తుంది.
- source_word: θάνατος
  choice: మరణం
  rationale: మూలపదంలోని సాధారణమైనదీ, వేదాంతపరంగా గంభీరమైనదీ అయిన భావాన్ని యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: τέλος అనే పదాన్ని ‘అంతం’గా అనువదించాలా, ‘ఫలితం/పర్యవసానం’గా అనువదించాలా
  choice: అంతం
  alternative: పర్యవసానం
  rationale: ‘అంతం’ వారి పూర్వ జీవన విధానపు చివరి గమ్యాన్నీ దాని పర్యవసానాన్నీ సూచించగలదు. అందువల్ల మూలంలోని భావ విస్తృతిని నిలుపుతూ ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గంభీరతను మరియు పౌలు ఉపయోగించిన ‘ఫలం’ రూపకాన్ని నిలుపుతూ అనువదించబడింది.
