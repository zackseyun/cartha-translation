id: ROM.6.22
reference: Romans 6:22
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: te
  text: ఇప్పుడు మాత్రం, మీరు పాపం నుండి విముక్తులై, దేవునికి బానిసలుగా చేయబడి[b], మీకు పవిత్రీకరణకు దారితీసే[a] ఫలం ఉంది; దాని అంతం[c] నిత్యజీవం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పవిత్రతకు దారితీసే.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘దేవునికి దాసులుగా చేయబడి.’
    reason: lexical_alternative
  - marker: c
    text: లేదా, ‘దాని అంతిమ ఫలితం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δέ
  choice: అయితే ఇప్పుడు
  rationale: మునుపటి పాపదాస్య స్థితితో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: పాపం నుండి విముక్తులై
  rationale: కర్తలు తాము సాధించని, వారిపై జరిగిన పూర్తయిన విముక్తి అనే భూతకాల కర్మణి భావాన్ని నిలుపుతుంది; ఏకవచనంలోని ‘పాపం’ను ఒక ఆధిపత్య శక్తి లేదా పరిధిగా అలాగే ఉంచుతుంది.
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: దేవునికి దాసులుగా చేయబడి
  rationale: కర్మణి రూపాన్నీ, పాపానికి దాసత్వం—దేవునికి దాసత్వం అనే పౌలు ఉద్దేశించిన బలమైన రూపకాన్నీ మెత్తబరచకుండా నిలుపుతుంది.
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: ఫలం మీకు ఉంది
  rationale: καρπός అనే వ్యవసాయ రూపకాన్ని ‘ప్రయోజనం’గా వివరణాత్మకంగా మార్చకుండా, ἔχετε యొక్క కలిగియుండుట భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς ἁγιασμόν
  choice: పవిత్రీకరణకు దారితీసే
  rationale: εἰς సూచించే దిశ లేదా ఫలితాన్ని వ్యక్తం చేస్తూ, ἁγιασμόςలోని ప్రక్రియ/స్థితి భావాన్ని ‘పవిత్రీకరణ’ ద్వారా నిలుపుతుంది.
- source_word: τὸ δὲ τέλος
  choice: దాని అంతం
  rationale: τέλοςకు దగ్గరైన పదాన్ని ఉంచి, అది ముగింపా లేక అంతిమ ఫలితమా అనే సందర్భసిద్ధమైన భావవ్యాప్తిని ప్రధాన పాఠ్యంలో అతిగా పరిష్కరించదు.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవం
  rationale: మూలంలోని కాలాతీత జీవ భావాన్నీ, తెలుగులో స్థిరమైన మరియు స్పష్టమైన బైబిలు పదప్రయోగాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: దేవునితో సంబంధంలో దాసత్వ రూపకం
  choice: దేవునికి దాసులుగా చేయబడి
  alternative: దేవునికి బానిసలుగా చేయబడి
  rationale: రోమా 6లో పాపదాస్యానికి ప్రతిగా దేవుని దాసత్వం ఉద్దేశపూర్వకమైన బలమైన రూపకం. ‘సేవకులై’ అని మెత్తబరచకుండా, కర్మణి భావాన్ని కూడా కాపాడింది.
- issue: ἁγιασμός యొక్క భావం
  choice: పవిత్రీకరణ
  alternative: పవిత్రత
  rationale: ఈ సందర్భంలో ప్రక్రియతో పాటు దాని ఫలితాన్నీ సూచించే అవకాశం ఉంది. ప్రధాన పాఠ్యంలో ‘పవిత్రీకరణ’ను ఉంచి, స్థితిని సూచించే ‘పవిత్రత’ను పాదటిప్పణిలో భద్రపరచింది.
- issue: τέλος యొక్క సందర్భార్థం
  choice: అంతం
  alternative: అంతిమ ఫలితం
  rationale: మూలానికి సన్నిహితమైన ‘అంతం’ను ప్రధాన పాఠ్యంలో ఉంచడం ద్వారా ముగింపు మరియు తుది పరిణామం మధ్యనున్న భావవ్యాప్తిని నిలుపుతుంది; సందర్భానికి స్పష్టతనిచ్చే ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘దాసులు,’ ‘పవిత్రీకరణ,’ ‘నిత్యజీవం’ వంటి స్థిరమైన బైబిలు పదాలను ఉపయోగిస్తూ, వాక్యనిర్మాణాన్ని సహజంగా ఉంచింది. ప్రతి పాదటిప్పణి గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఇవ్వబడింది.
