revisions:
- from: అయితే ఇప్పుడు, మీరు పాపం నుండి విముక్తులై, దేవునికి దాసులుగా చేయబడి[b], పవిత్రీకరణకు[a] దారితీసే ఫలం మీకు ఉంది; దాని అంతం[c] నిత్యజీవం.
  to: ఇప్పుడు మాత్రం, మీరు పాపం నుండి విముక్తులై, దేవునికి బానిసలుగా చేయబడి[b], మీకు పవిత్రీకరణకు దారితీసే[a] ఫలం ఉంది; దాని అంతం[c] నిత్యజీవం.
  rationale: The revision changes only the rendering of δουλωθέντες and its corresponding alternative note. This preserves the Greek passive slave-language and Paul’s intentional contrast between former bondage to sin and present bondage to God, while retaining the draft’s wording for the remaining source expressions and its ambiguity-preserving treatment of τέλος.
