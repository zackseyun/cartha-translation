translation:
  language: te
  text: ఎందుకంటే, మరణించినవాడు పాపం నుండి నిర్దోషిగా తీర్చబడ్డాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాపం నుండి నీతిమంతుడిగా తీర్చబడ్డాడు”; సందర్భానుసారంగా, “పాపం నుండి విడుదల పొందాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: చనిపోయిన వ్యక్తి
  rationale: నిర్దిష్ట ఉపపదంతో ఉన్న భూతకాల క్రియావిశేషణం నామవాచకంగా పనిచేస్తుంది. ఈ ఎంపిక లింగాన్ని అనవసరంగా నిర్దిష్టం చేయకుండా ‘చనిపోయినవాడు/వ్యక్తి’ అనే భావాన్ని సహజ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణం లేదా వివరణను పరిచయం చేసే అనుసంధాన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: δεδικαίωται
  choice: నిర్దోషిగా తీర్పు పొందాడు
  rationale: δικαιόω పదంలోని న్యాయస్థాన సంబంధమైన ‘నీతిమంతుడని/నిర్దోషిగా ప్రకటించడం’ అనే బలాన్ని కాపాడుతుంది. అదే సమయంలో పాపపు హక్కు లేదా ఆరోపణ నుండి విడుదల అనే సందర్భార్థానికీ సరిపోతుంది.
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: పాపం నుండి
  rationale: ἀπό సూచించే వేరుపాటు లేదా విడుదల భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; పాపాన్ని కేవలం అపరాధభారంగా గానీ కేవలం అధికారంగా గానీ పరిమితం చేయదు.
theological_decisions:
- issue: δικαιόωను ఇక్కడ న్యాయస్థాన భావంలో అనువదించాలా, లేక విముక్తి భావంలో అనువదించాలా?
  choice: నిర్దోషిగా తీర్పు పొందాడు
  alternative: నీతిమంతుడిగా తీర్పు పొందాడు; పాపం నుండి విడుదల పొందాడు
  rationale: రోమా 6 సందర్భం పాపపు ఆధిపత్యం నుండి విడుదలను నొక్కిచెప్పినా, మూలపాఠం సాధారణ విముక్తి క్రియకు బదులు δικαιόωను ఉపయోగిస్తుంది. ప్రధాన పాఠంలోని న్యాయపరమైన పదబంధం ఆ బలాన్ని నిలుపుతుంది; పాదసూచిక ప్రత్యామ్నాయాల ద్వారా నీతినిర్ణయ మరియు విముక్తి భావాల మధ్య ఉన్న నిజమైన ఉద్రిక్తతను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నిర్దోషిగా తీర్పు పొందాడు’ న్యాయపరమైన భావాన్ని సాధారణ పాఠకుడికి అర్థమయ్యేలా ఉంచుతుంది. పాదసూచిక గుర్తు [a] ప్రధాన పాఠంలో చేర్చబడింది.
