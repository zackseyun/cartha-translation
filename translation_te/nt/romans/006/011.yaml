lexical_decisions:
- source_word: οὕτως καὶ
  choice: అలాగే మీరు కూడా
  rationale: ముందరి వాదనతో ఉన్న నిర్ధారణాత్మక సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: λογίζεσθε
  choice: పరిగణించుకోండి
  rationale: ఏదో ఒక విషయాన్ని నిజమైనదిగా భావించి, దాని ప్రకారం తమను తాము చూడాలనే అర్థాన్ని ఇస్తుంది; కేవలం ఊహించుకోవడం అనే భావాన్ని నివారిస్తుంది.
- source_word: ἑαυτοὺς
  choice: మిమ్మల్ని మీరు
  rationale: గ్రీకులో స్పష్టంగా ఉన్న ఆత్మార్థక సర్వనామాన్ని తెలుగులోనూ స్పష్టంగా నిలుపుతుంది.
- source_word: εἶναι
  choice: -లుగా
  rationale: తెలుగులో ‘మృతులుగా/సజీవులుగా పరిగణించుకోండి’ అనే నిర్మాణమే ‘అలా ఉన్నారని పరిగణించండి’ అనే గ్రీకు భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: పాపం విషయంలో మృతులుగా
  rationale: దత్తివు సూచించే సంబంధాన్ని ‘విషయంలో’ అని స్పష్టపరుస్తూ, తరువాతి వ్యతిరేక సమాంతర వాక్యభాగంతో జతచేస్తుంది.
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: దేవుని విషయంలో సజీవులుగా
  rationale: ‘మృతులుగా’ అనే పదానికి సమాంతరమైన వ్యతిరేకతను సహజంగా నిలుపుతూ, ζῶντας యొక్క జీవించి ఉండే భావాన్ని తెలియజేస్తుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: ἐν ను ‘లో’ అని నిలిపి, పౌలు వాడే సంబంధం లేదా పరిధి భావాన్ని అతిగా వివరించకుండా కాపాడుతుంది; Χριστός ను ఇక్కడ బిరుదుగా అనువదిస్తుంది.
theological_decisions:
- issue: Χριστῷ ను బిరుదుగా అనువదించాలా, పేరులా లిప్యంతరీకరించాలా
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός కు బిరుదు భావం సజీవంగా ఉంది; అందువల్ల దాని అర్థాన్ని ‘మెస్సీయ’గా వ్యక్తం చేశాం.
- issue: ἐν Χριστῷ Ἰησοῦ యొక్క సంబంధం
  choice: మెస్సీయ యేసులో
  alternative: మెస్సీయ యేసు ద్వారా / మెస్సీయ యేసు కారణంగా
  rationale: ‘ద్వారా’ లేదా ‘కారణంగా’ అని సంబంధాన్ని ముందుగానే నిర్ణయించకుండా, మూలంలోని ἐν యొక్క సంబంధం/పరిధి భావాన్నీ దాని వేదాంతపరమైన ఉద్రిక్తతనూ నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ అనువదించబడింది. ‘పాపం విషయంలో / దేవుని విషయంలో’ అనే సమాంతర నిర్మాణం μέν…δέ వ్యతిరేకతను స్పష్టంగా చూపుతుంది.
