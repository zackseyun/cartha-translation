id: ROM.6.20
reference: Romans 6:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: te
  text: ఎందుకంటే మీరు పాపానికి బానిసలుగా ఉన్నప్పుడు, నీతి[b] విషయంలో[a] స్వేచ్ఛగా ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీతి సంబంధంగా.”
    reason: lexical_alternative
  - marker: b
    text: “నీతి” అనే పదాన్ని “న్యాయం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: బానిసలు
  rationale: రోమా 6లో పౌలు పరస్పర విరుద్ధమైన రెండు బానిసత్వాలను చూపిస్తున్నందున, బంధిత స్థితిని స్పష్టంగా తెలిపే ‘బానిసలు’ సరైనది.
- source_word: ἁμαρτίας
  choice: పాపానికి
  rationale: గ్రీకు సంబంధ విభక్తి ఇక్కడ పాపం యజమానిగా లేదా ఆధిపత్య శక్తిగా ఉన్న సంబంధాన్ని సూచిస్తుంది; తెలుగులో ‘పాపానికి బానిసలు’ సహజంగా ఆ భావాన్ని ఇస్తుంది.
- source_word: ἐλεύθεροι
  choice: స్వతంత్రులు
  rationale: పాపానికి బానిసలుగా ఉన్నవారు నీతి సంబంధంగా స్వేచ్ఛగా ఉన్నారనే పౌలు ఉద్దేశపూర్వకంగా ఉంచిన పదునైన వ్యత్యాసాన్ని ఇది నిలుపుతుంది.
- source_word: τῇ δικαιοσύνῃ
  choice: నీతి విషయంలో
  rationale: ఈ దత్తి విభక్తిని సంబంధార్థకంగా గ్రహించడం గ్రీకు వాక్యంలోని అస్పష్టతను కాపాడుతుంది; నీతి నుండి విముక్తి పొందినట్లు ప్రతికూల భావాన్ని బలవంతంగా రుద్దదు.
- source_word: δικαιοσύνῃ
  choice: నీతి
  rationale: పౌలు వాడుకలో δικαιοσύνηకి ‘నీతి’ సహజమైన, విస్తృతమైన తెలుగు సమానార్థకం; ‘న్యాయం’ అనే సాధ్యమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న వాదనకు ఈ వాక్యం ఇచ్చే వివరణాత్మక సంబంధాన్ని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: నీతి పట్ల ఉన్న సంబంధాన్ని ఎలా వ్యక్తపరచాలి
  choice: నీతి విషయంలో స్వతంత్రులు
  alternative: నీతి నుండి స్వతంత్రులు; నీతితో మీకు సంబంధం లేదు
  rationale: ‘నీతి నుండి’ అనడం నీతిని ఒక అణచివేసే శక్తిగా వినిపించవచ్చు; ‘సంబంధం లేదు’ అనడం భావాన్ని అతిగా వివరిస్తుంది. ‘నీతి విషయంలో’ అనేది గ్రీకు దత్తి విభక్తిలోని సంబంధార్థాన్ని, పౌలు వ్యంగ్యభరితమైన నైతిక ఉద్రిక్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. పౌలు చూపే బానిసత్వం–స్వాతంత్ర్యం వ్యత్యాసాన్ని స్పష్టంగా ఉంచుతూ, గ్రీకు దత్తి విభక్తిలోని సంబంధార్థక అస్పష్టతను పాదసూచికతో కాపాడింది.
