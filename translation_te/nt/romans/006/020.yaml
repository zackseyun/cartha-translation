- from: ఎందుకంటే, మీరు పాపానికి బానిసలుగా ఉన్నప్పుడు, నీతి విషయంలో[a] స్వతంత్రులుగా ఉన్నారు.[b]
  to: ఎందుకంటే మీరు పాపానికి బానిసలుగా ఉన్నప్పుడు, నీతి[b] విషయంలో[a] స్వేచ్ఛగా ఉన్నారు.
  rationale: 'The revision makes only small stylistic and anchoring corrections. It preserves the Greek rhetorical contrast: while enslaved to sin, the addressees were ‘free’ with reference to righteousness. It neither resolves the dative as an unequivocal ‘from righteousness’ nor adds interpretive explanation.'
