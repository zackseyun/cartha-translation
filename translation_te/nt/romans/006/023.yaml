id: ROM.6.23
reference: Romans 6:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: te
  text: ఎందుకంటే పాపం ఇచ్చే జీతం మరణం; అయితే దేవుని కృపావరం[a] మన ప్రభువైన మెస్సీయ యేసులో[b] నిత్యజీవం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘దేవుడు ఉచితంగా ఇచ్చే వరం.’
    reason: χάρισμα అనే పదంలో కృపచేత ఉచితంగా ఇచ్చే వరం అనే భావం ఉంది.
  - marker: b
    text: ‘మెస్సీయ యేసులో’ అనే మాట ఆయనతో ఐక్యతను లేదా ఆయనలో ఉన్న జీవన పరిధిని సూచించవచ్చు; కొందరు దీనిని ‘మెస్సీయ యేసు ద్వారా’ అని అనువదిస్తారు.
    reason: ἐν అనే విభక్త్యర్థక పదంలోని భావ విస్తృతిని, వేదాంతపరమైన ఉద్వేగాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: ὀψώνια
  choice: జీతం
  rationale: సంపాదించిన దానికి లభించే ప్రతిఫలం అనే రూపకాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తూ, తరువాతి ‘కృపావరం’తో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది. గ్రీకులో బహువచనం ఉన్నా, ఈ భావంలో తెలుగులో ఏకవచనమైన ‘జీతం’ సహజం.
- source_word: ἁμαρτίας
  choice: పాపం ఇచ్చే
  rationale: జనిటివ్ సంబంధాన్ని పాపానికి చెందిన లేదా పాపం చెల్లించే జీతంగా సహజంగా వ్యక్తం చేస్తుంది; ‘పాపం వల్ల వచ్చే’ అనే కారణార్థానికే పరిమితం చేయదు.
- source_word: θάνατος
  choice: మరణం
  rationale: మరణం ఏ విధమైనదో అనువాదంలో అదనంగా నిర్వచించకుండా మూలపదపు ప్రత్యక్షమైన, వేదాంతపరమైన బరువును నిలుపుతుంది.
- source_word: χάρισμα
  choice: కృపావరం
  rationale: ఇది సంపాదించిన జీతం కాదని, కృపచేత ఇచ్చే వరమని స్పష్టంగా తెలియజేస్తూ తెలుగులోని బైబిలు సంబంధిత గంభీర శైలికి సరిపోతుంది.
- source_word: ζωὴ αἰώνιος
  choice: నిత్యజీవం
  rationale: కాలవ్యాప్తినీ వేదాంతపరమైన భావాన్నీ సంక్షిప్తంగా, స్థిరంగా వ్యక్తం చేసే సహజ తెలుగు పదబంధం.
- source_word: ἐν
  choice: లో
  rationale: పౌలు వాడే మెస్సీయతో ఐక్యత లేదా ఆయనలోని జీవన పరిధి అనే భావాన్ని తెరిచి ఉంచుతుంది; కేవలం సాధనార్థమైన ‘ద్వారా’గా కుదించదు.
- source_word: Χριστῷ
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్నందున దాని అర్థాన్ని ‘మెస్సీయ’గా తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κυρίῳ
  choice: ప్రభువు
  rationale: ప్రారంభ క్రైస్తవ విశ్వాస ప్రకటనలోని గౌరవాన్నీ వేదాంతపరమైన బరువునీ నిలుపుతుంది.
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ యొక్క భావబలం
  choice: ‘మెస్సీయ యేసులో’
  alternative: ‘మెస్సీయ యేసు ద్వారా’
  rationale: గ్రీకు పదబంధం కేవలం సాధనాన్ని కాక పరిధిని లేదా ఐక్యతను సూచించగలదు. ‘లో’ అని ఉంచడం పౌలు వాడుకలోని వేదాంతపరమైన విస్తృతిని కాపాడుతుంది.
- issue: పాపపు జీతం మరియు దేవుని వరం మధ్య వ్యత్యాసం
  choice: ‘పాపం ఇచ్చే జీతం’ మరియు ‘దేవుని కృపావరం’
  alternative: ‘పాపం వల్ల వచ్చే ప్రతిఫలం’ మరియు ‘దేవుని బహుమతి’
  rationale: ఒకవైపు సంపాదించిన ప్రతిఫలం, మరోవైపు కృపచేత లభించే వరం అనే మూలవాక్యపు ఉద్దేశపూర్వక వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. ‘పాపం’, ‘మరణం’, ‘నిత్యజీవం’, ‘ప్రభువు’ వంటి సాధారణంగా అర్థమయ్యే పదాలు ఎంచుకోబడ్డాయి. గ్రీకు వాక్యంలోని జీతం–కృపావరం వ్యత్యాసం స్పష్టంగా ఉండేలా వాక్య నిర్మాణం చేయబడింది.
