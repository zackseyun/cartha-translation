review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the passive, antecedent resurrection participle (ἐγερθείς), resurrection from among the dead (ἐκ νεκρῶν), and death's personified dominion (κυριεύει). However, the first coordinated reported clause uses “మరణించడనీ,” which does not reliably express the Greek negation οὐκέτι ἀποθνῄσκει. It needs the explicit negative form “మరణించడని.”
  naturalness: The revised sentence is natural modern standard Telugu. Keeping the two finite negative clauses before “మనకు తెలుసు” makes their shared relation to εἰδότες clear while preserving the Greek participle's non-over-specified connection to the wider context.
  terminology: “మెస్సీయ” appropriately conveys Χριστός as a title here, and the footnote offering “క్రీస్తు” is accurate. “ఏలదు” naturally and adequately communicates death's ruling/mastering force without importing additional theological interpretation.
  issues:
  - severity: medium
    issue: The wording “ఇక మరణించడనీ” lacks an unambiguous negative complement form.
    rationale: The source explicitly says οὐκέτι ἀποθνῄσκει, “no longer dies.” In this Telugu construction, “మరణించడని” is required to state “that he no longer dies”; “మరణించడనీ” can be read without the needed negation and is not a safe rendering of the source.
  revised_text: మృతులలోనుండి లేపబడిన మెస్సీయ[a] ఇక మరణించడని, మరణం ఇక ఆయనపై ఏలదని మనకు తెలుసు.
  revised_footnotes:
  - marker: a
    text: లేదా “క్రీస్తు.”
    reason: lexical_alternative
  revision_rationale: Corrected the first reported clause from “మరణించడనీ” to “మరణించడని” so that the explicit Greek negation is clearly represented. All other wording and the lexical-alternative footnote are retained.
