id: ROM.6.9
reference: Romans 6:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: te
  text: మృతులలోనుండి లేపబడిన మెస్సీయ[a] ఇక మరణించడని, మరణం ఇక ఆయనపై ఏలదని మనకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “క్రీస్తు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: మనకు తెలుసు
  rationale: ఈ బహువచన కృదంతం సందర్భంలోని విశ్వాసులు కలిసి ఎరిగిన సత్యాన్ని సూచిస్తుంది. తెలుగులో సహజమైన సంపూర్ణ వాక్యంగా ఉండేందుకు ‘మనకు తెలుసు’ అని అనువదించాం; కారణార్థాన్ని ప్రత్యేకంగా జోడించలేదు.
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: ఇక్కడ Χριστός అభిషిక్తుడనే బిరుదు భావాన్ని కలిగి ఉంది. అందువల్ల సాధారణ నామంలా కాక బిరుదు అర్థాన్ని తెలియజేసే ‘మెస్సీయ’ను ఎంచుకున్నాం; ‘క్రీస్తు’ను పాదసూచికలో ఉంచాం.
- source_word: ἐγερθεὶς
  choice: లేపబడిన
  rationale: అయోరిస్టు కర్మణి కృదంతంలోని కర్మణి భావాన్నీ, ఇక మరణించకపోవడానికి ముందే జరిగిన కార్యాన్నీ ఈ రూపం నిలుపుతుంది.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: మరణించినవారి మధ్యనుండి పునరుత్థానం పొందిన భావాన్ని మూలంలోని ἐκ నిర్మాణానికి దగ్గరగా, తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: οὐκέτι
  choice: ఇక
  rationale: రెండు చోట్లా గత స్థితి ముగిసిపోయిందనే తుది భావాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ἀποθνῄσκει
  choice: మరణించడు
  rationale: వర్తమాన కాలం తెలిపే నిరంతర వాస్తవాన్ని తెలుగు సాధారణ వర్తమాన రూపం స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: θάνατος
  choice: మరణం
  rationale: మూలంలోని నామవాచకాన్ని నేరుగా అనువదించి, దానిని ఏలే శక్తిగా వ్యక్తీకరించిన పౌలు అలంకారాన్ని నిలుపుతుంది.
- source_word: κυριεύει
  choice: ఏలదు
  rationale: అధికారం చెలాయించడం లేదా ప్రభువుగా ఉండడం అనే భావాన్ని గంభీరమైన, సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: పౌలు వాడిన Χριστός అనే పదాన్ని బిరుదుగా అనువదించడం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో ఈ పదం కేవలం పేరులో భాగంగా కాక, దేవుని అభిషిక్తుడనే అర్థవంతమైన బిరుదుగా పనిచేస్తుంది. అయినా సంప్రదాయ రూపమైన ‘క్రీస్తు’ కూడా సాధ్యమైన అనువాదమని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని రెండు సమాంతర వాక్యభాగాలను ‘-డనీ … -దనీ’ నిర్మాణంతో ‘మనకు తెలుసు’ అనే భావానికి అనుసంధానించాం; మరణాన్ని ఏలే శక్తిగా చూపే వ్యక్తీకరణను నిలిపాం.
