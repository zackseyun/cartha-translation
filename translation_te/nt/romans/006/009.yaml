revisions:
- from: మృతులలోనుండి లేపబడిన మెస్సీయ[a] ఇక మరణించడనీ, మరణం ఇక ఆయనపై ఏలదనీ మనకు తెలుసు.
  to: మృతులలోనుండి లేపబడిన మెస్సీయ[a] ఇక మరణించడని, మరణం ఇక ఆయనపై ఏలదని మనకు తెలుసు.
  rationale: Corrected the first reported clause from “మరణించడనీ” to “మరణించడని” so that the explicit Greek negation is clearly represented. All other wording and the lexical-alternative footnote are retained.
