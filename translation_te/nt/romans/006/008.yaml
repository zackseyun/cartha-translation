id: ROM.6.8
reference: Romans 6:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ δὲ ἀπεθάνομεν σὺν Χριστῷ, πιστεύομεν ὅτι καὶ συζήσομεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: te
  text: మనం మెస్సీయతో[a] కలిసి చనిపోయి ఉంటే, ఆయనతో కలిసి కూడా జీవిస్తామని నమ్ముతున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా “క్రీస్తు”: గ్రీకు “Χριστῷ” (క్రిస్టోయ్).'
    reason: Χριστῷకు ‘క్రీస్తు’ అనే స్థిరమైన తెలుగు ప్రత్యామ్నాయాన్ని సూచిస్తూ, పాఠ్యంలో ‘మెస్సీయ’ అనే బిరుదు-భావ అనువాదాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: εἰ δὲ
  choice: చనిపోయినట్లయితే
  rationale: εἰ షరతును సూచిస్తుంది. δέ మునుపటి వాదనను కొనసాగించినా, తెలుగులో ప్రత్యేక అనుసంధాన పదం లేకుండానే సందర్భసహజంగా ఆ భావం వ్యక్తమవుతుంది.
- source_word: ἀπεθάνομεν
  choice: మనం ... చనిపోయిన
  rationale: అయోరిస్ట్ సూచించే గత సంఘటనను సహజమైన తెలుగు భూతకాల రూపంతో అందించింది.
- source_word: σὺν Χριστῷ
  choice: మెస్సీయతో కలిసి
  rationale: σύν సహవాసం లేదా ఐక్యతను సూచిస్తుంది; Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించింది.
- source_word: πιστεύομεν
  choice: నమ్ముతున్నాం
  rationale: πιστεύω యొక్క ప్రత్యక్షమైన, సహజమైన తెలుగు సమానార్థకం.
- source_word: ὅτι
  choice: అని
  rationale: నమ్మకంలోని విషయాన్ని పరిచయం చేసే ὅτιని తెలుగు పరోక్ష వాక్య నిర్మాణంలో ‘అని’ ద్వారా తెలిపింది.
- source_word: καὶ
  choice: కూడా
  rationale: మరణంతో పాటు దానికి అనురూపమైన భవిష్య జీవాన్ని జతచేసే భావాన్ని నిలుపుతుంది.
- source_word: συζήσομεν αὐτῷ
  choice: ఆయనతో కలిసి జీవిస్తామని
  rationale: συζάω మరియు αὐτῷ కలిపి ఆయనతో కలిసి జీవించే భావాన్ని ఇస్తాయి; భవిష్యార్థం ‘జీవిస్తాం’ రూపంలో నిలిచింది.
theological_decisions:
- issue: Χριστῷ యొక్క అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός బిరుదుగా పనిచేస్తోంది; అందువల్ల దాని బిరుదు భావాన్ని స్పష్టంగా ఉంచేందుకు ‘మెస్సీయ’ ఎంచుకుంది.
- issue: συζήσομεν αὐτῷ సూచించే భవిష్య జీవ స్వభావం
  choice: ఆయనతో కలిసి జీవిస్తాం
  alternative: ఆయనతో కలిసి పునరుత్థాన జీవితం పొందుతాం
  rationale: గ్రీకు వాక్యం చెప్పిన సహజీవన భావాన్ని మాత్రమే నిలిపి, అది జరిగే నిర్దిష్ట విధానాన్ని అనువాదంలో అదనంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘మనం’ సమగ్రతను, ‘ఆయన’ గౌరవప్రయోగాన్ని ఇస్తాయి. పాఠ్యంలో పాదసూచిక అవసరం లేదు; ‘క్రీస్తు’ అనే ప్రత్యామ్నాయం నిర్ణయ గమనికలో నమోదు చేయబడింది.
