- from: మనం మెస్సీయతో కలిసి చనిపోయినట్లయితే, ఆయనతో కలిసి జీవిస్తామని కూడా నమ్ముతున్నాం.
  to: మనం మెస్సీయతో[a] కలిసి చనిపోయి ఉంటే, ఆయనతో కలిసి కూడా జీవిస్తామని నమ్ముతున్నాం.
  rationale: 'The revision retains every element of the Greek: the conditional εἰ δέ, past co-death with Messiah, present πιστεύομεν, and the corresponding future shared life. It makes the Telugu conditional and the scope of కూడా smoother, while restoring the audit-trail lexical-alternative footnote without adding doctrinal interpretation.'
