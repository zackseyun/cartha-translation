id: ROM.6.6
reference: Romans 6:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: te
  text: 'ఇది మనకు తెలుసు: పాప శరీరం నిర్వీర్యం కావడానికి[b], తద్వారా ఇకపై మనం పాపానికి బానిసలుగా ఉండకుండా[c], మన పాత మనిషి[a] ఆయనతోపాటు సిలువ వేయబడ్డాడు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన పాత స్వరూపం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “పనిచేయకుండా చేయబడటానికి”; “రద్దు చేయబడటానికి.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ఇకపై మనం పాపానికి సేవ చేయకుండా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γινώσκοντες
  choice: మనకు ఇది తెలుసు
  rationale: వర్తమాన కృదంతమైన γινώσκοντες మునుపటి సందర్భంతో అనుసంధానమై ఉంది. తెలుగులో సహజంగా ఉండేందుకు దాని భావాన్ని ప్రధాన వాక్యంగా వ్యక్తం చేశాం; కారణార్థాన్ని అదనంగా చేర్చలేదు.
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: మన పాత మనిషి
  rationale: పౌలు ఉపయోగించిన మానవశాస్త్ర సంబంధమైన ‘పాత మనిషి’ అనే రూపకాన్ని నిలిపి ఉంచుతుంది. ‘పాత స్వభావం’ అని అనువదిస్తే ἄνθρωπος అనే వ్యక్తి-రూపకం మరుగునపడుతుంది.
- source_word: συνεσταυρώθη
  choice: ఆయనతోపాటు సిలువ వేయబడ్డాడు
  rationale: συν- ఉపసర్గలోని ‘తోపాటు’ భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది. గ్రీకులో ప్రత్యేక సర్వనామం లేకపోయినా, సందర్భానుసారం ‘ఆయన’ క్రీస్తును సూచిస్తుంది.
- source_word: καταργηθῇ
  choice: నిర్వీర్యం చేయబడటానికి
  rationale: క్రియాశక్తిని తొలగించడం లేదా పనిచేయకుండా చేయడం అనే భావాన్ని తెలియజేస్తుంది; పూర్తిగా నాశనం చేయబడిందనే బలమైన అర్థాన్ని అనవసరంగా మోపదు.
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: పాప శరీరం
  rationale: గ్రీకు షష్ఠీ సంబంధాన్ని సంక్షిప్తంగా నిలిపి ఉంచి, అది ‘పాపంతో నిండిన శరీరమా’ లేక ‘పాప ఆధీనంలోని శరీరమా’ అనే విషయాన్ని ముందుగానే పరిష్కరించదు.
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: ఇకపై మనం పాపానికి బానిసలుగా ఉండకుండా
  rationale: δουλεύω లోని బానిసత్వం/యజమానికి లోబడిన సేవ భావాన్ని సందర్భానుకూలంగా బలంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ὁ παλαιὸς ἡμῶν ἄνθρωπος అనే మానవశాస్త్ర సంబంధమైన నుడికారం
  choice: మన పాత మనిషి
  alternative: మన పాత స్వరూపం
  rationale: మూలంలోని వ్యక్తి-రూపకాన్ని, ఏకవచన రూపాన్ని నిలిపి ఉంచుతుంది; ఇది పురుషులకు మాత్రమే వర్తిస్తుందనే భావం ఉద్దేశించబడలేదు.
- issue: καταργηθῇ వల్ల పాప శరీరానికి కలిగే ఫలితం
  choice: నిర్వీర్యం చేయబడటానికి
  alternative: రద్దు చేయబడటానికి; పూర్తిగా తొలగించబడటానికి
  rationale: పాపపు కార్యసామర్థ్యం, ఆధిపత్యం భగ్నమవుతాయనే భావాన్ని ఇస్తుంది; శరీరం ఉనికే నాశనమవుతుందనే తాత్త్విక నిర్ణయాన్ని వాక్యంలోకి తీసుకురాదు.
- issue: సహ-సిలువలో పేర్కొనని సహచరుడు
  choice: ఆయనతోపాటు
  alternative: తోపాటు సిలువ వేయబడ్డాడు
  rationale: συνεσταυρώθη లో సహ-సిలువ భావం ఉంది; సమీప సందర్భం అది క్రీస్తుతోనని స్పష్టం చేస్తుంది. తెలుగులో అసంపూర్ణంగా వినిపించకుండా ‘ఆయన’ను సందర్భపూరకంగా చేర్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన వాక్యక్రమాన్ని వాడుతూ, ‘పాత మనిషి,’ ‘పాప శరీరం’ అనే పౌలు మూలరూపకాలను ఉద్దేశపూర్వకంగా నిలిపి ఉంచాం. భాష గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా ఉంది.
