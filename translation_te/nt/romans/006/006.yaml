revisions:
- from: 'మనకు ఇది తెలుసు: ఇకపై మనం పాపానికి బానిసలుగా ఉండకుండా[c], పాప శరీరం నిర్వీర్యం చేయబడటానికి[b] మన పాత మనిషి[a] ఆయనతోపాటు సిలువ వేయబడ్డాడు.'
