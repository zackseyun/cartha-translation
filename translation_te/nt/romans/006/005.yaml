id: ROM.6.5
reference: Romans 6:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: te
  text: ఎందుకంటే, ఆయన మరణ సాదృశ్యంలో మనం ఆయనతో ఏకమై ఉన్నవారమైతే,[a] అలాగే ఆయన పునరుత్థాన సాదృశ్యంలో కూడా మనం ఆయనతో ఏకమై ఉంటాం.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయనతో కలిసి పెరిగినవారమైతే.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా, ‘పునరుత్థానానికి చెందినవారిగా కూడా ఉంటాం’; మొదటి భాగంలోని ‘ఆయనతో ఏకమై’ మరియు ‘సాదృశ్యంలో’ అనే భావాలు ఇక్కడ అధ్యాహారంగా ఉన్నాయి.
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: ఆయనతో ఏకమై
  rationale: ఈ పదం సహజంగా కలిసి పెరగడం లేదా ఒకే జీవసంబంధంలో భాగస్వాములు కావడం అనే భావాన్ని కలిగిస్తుంది. ఆధునిక తెలుగులో ‘ఆయనతో ఏకమై’ అనేది ఆ సంబంధపూర్వక భావాన్ని సహజంగా తెలియజేస్తూ, దాని స్వరూపాన్ని అతిగా నిర్దిష్టం చేయదు.
- source_word: γεγόναμεν
  choice: ఉన్నట్లయితే
  rationale: గ్రీకు పరిపూర్ణ కాలం గతంలో ఏర్పడి ప్రస్తుతం కొనసాగుతున్న స్థితిని సూచిస్తుంది. తెలుగు షరతు వాక్యంలో ‘ఏకమై ఉన్నట్లయితే’ ఆ కొనసాగుతున్న ఫలితాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τῷ ὁμοιώματι
  choice: సాదృశ్యంలో
  rationale: దత్తి విభక్తి ఇక్కడ సంబంధం లేదా పరిధిని సూచించవచ్చు. ‘సాదృశ్యంలో’ అనే రూపం ఆ విస్తృతిని నిలుపుతూ, మరణంతో పూర్తి అభేదాన్ని సూచించకుండా గ్రీకు పదప్రయోగాన్ని కాపాడుతుంది.
- source_word: τοῦ θανάτου αὐτοῦ
  choice: ఆయన మరణ
  rationale: ఇది నేరుగా ‘ఆయన మరణం’ను సూచించే సంబంధ విభక్తి నిర్మాణం; తెలుగులో సమాసరూపం సహజంగా ఉంటుంది.
- source_word: ἀλλὰ καὶ
  choice: కూడా
  rationale: రెండవ భాగాన్ని మొదటి భాగానికి బలంగా జోడించే ఆరోహణాత్మక భావం సందర్భంలోనే స్పష్టమవుతుంది. తెలుగులో ‘కూడా’ సహజంగా ఆ సమాంతర బలాన్ని మోస్తుంది; ‘నిశ్చయంగా’ అని చేరిస్తే మూలంలో లేని నిర్ధారణ పదం అధికంగా స్పష్టీకరించబడే అవకాశం ఉంది.
- source_word: τῆς ἀναστάσεως
  choice: ఆయన పునరుత్థాన సాదృశ్యంలో
  rationale: గ్రీకులో ‘ఆయన’ మరియు ‘సాదృశ్యం’ రెండవసారి వ్యక్తంగా లేవు; అయితే మొదటి భాగంలోని సమాంతర నిర్మాణం వాటిని అర్థపూర్వకంగా కొనసాగిస్తుంది. తెలుగులో స్పష్టత కోసం వాటిని పునరుద్ధరించాం.
- source_word: ἐσόμεθα
  choice: మనం ఆయనతో ఏకమై ఉంటాం
  rationale: మూలంలో అక్షరార్థంగా ‘మనం ఉంటాం’ మాత్రమే ఉన్నప్పటికీ, మొదటి భాగంలోని σύμφυτοι అనే విధేయ భావం ఇక్కడ అధ్యాహారంగా ఉంది. తెలుగులో సంపూర్ణ వాక్యం కోసం దానిని పునరుద్ధరించాం.
theological_decisions:
- issue: క్రీస్తుతో ఏకత్వాన్ని సంస్కారాత్మకంగా, మర్మాత్మకంగా లేదా కేవలం రూపకాలంకారంగా నిర్దిష్టం చేయాలా
  choice: ‘ఆయన మరణ సాదృశ్యంలో ... ఆయనతో ఏకమై’ మరియు ‘ఆయన పునరుత్థాన సాదృశ్యంలో ... ఆయనతో ఏకమై’ అని ఉంచడం
  alternative: ‘ఆయన మరణ నమూనాతో జతచేయబడి’ లేదా ‘ఆయనతో కలిసి పెరిగి’ అని అనువదించడం
  rationale: వాక్యం క్రీస్తులో నిజమైన భాగస్వామ్యాన్ని ప్రకటిస్తూనే ‘సాదృశ్యం’ అనే అర్హతను ఉంచుతుంది. అనువాదం ఆ ఉద్రిక్తతను కాపాడి, ఏకత్వం ఎలా కార్యరూపం దాల్చుతుందో ఒక ప్రత్యేక సిద్ధాంతంతో నిర్ణయించదు.
- issue: భవిష్య పునరుత్థానాన్ని ‘నిశ్చయంగా’ అనే అదనపు పదంతో బలపరచాలా
  choice: భవిష్య రూపమైన ‘ఉంటాం’తో పాటు ‘కూడా’ అనే అనుసంధానాన్ని ఉంచడం
  alternative: ‘నిశ్చయంగా ... ఉంటాం’ అని విస్తరించడం
  rationale: ἀλλὰ καὶ బలమైన అనుసంధానాన్ని ఇస్తుంది, కాని ప్రత్యేకంగా ‘నిశ్చయంగా’ అనే క్రియావిశేషణం లేదు. మూలంలోని ధృఢతను వాక్య నిర్మాణమే మోయనిచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని ఉపయోగించాం. ‘సాదృశ్యం,’ ‘పునరుత్థానం’ వంటి స్థిరమైన బైబిలు పదాలను నిలుపుతూ వాక్య నిర్మాణాన్ని సహజంగా చేశాం. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో పొందుపరచబడ్డాయి.
