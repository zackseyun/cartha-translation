- from: మీ శరీర అవయవాలను అనీతికి ఆయుధాలుగా[a] పాపానికి సమర్పించకండి. బదులుగా, మృతులలోనుండి సజీవులైనవారిగా మిమ్మల్ని మీరు దేవునికి సమర్పించుకోండి; మీ శరీర అవయవాలను నీతికి[b] ఆయుధాలుగా దేవునికి సమర్పించండి.
