id: ROM.6.13
reference: Romans 6:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: te
  text: మీ శరీర అవయవాలను అనీతికి ఆయుధాలుగా[a] పాపానికి సమర్పించకండి. బదులుగా, మృతులలోనుండి సజీవులైనవారిగా మిమ్మల్ని మీరు దేవునికి సమర్పించండి; మీ శరీర అవయవాలను నీతికి[b] ఆయుధాలుగా దేవునికి సమర్పించండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సాధనాలుగా.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “న్యాయానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: సమర్పించకండి / సమర్పించుకోండి / సమర్పించండి
  rationale: ఒకరి అధీనానికి లేదా వినియోగానికి తనను లేదా తన అవయవాలను ఉంచే భావాన్ని ‘సమర్పించు’ సహజంగా తెలియజేస్తుంది; రెండు భాగాల్లోనూ మూలపద పునరావృతిని నిలుపుతుంది.
- source_word: μέλη
  choice: శరీర అవయవాలు
  rationale: తెలుగులో ‘అవయవాలు’ మాత్రమే అంటే సంస్థ సభ్యులు అనే అర్థం కూడా రావచ్చు; ‘శరీర అవయవాలు’ సందర్భార్థాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: ὅπλα
  choice: ఆయుధాలు
  rationale: ఈ పదంలోని పోరాట రూపకాన్ని ‘ఆయుధాలు’ స్పష్టంగా నిలుపుతుంది; విస్తృతార్థమైన ‘సాధనాలు’ను పాదసూచికలో ఇస్తున్నాం.
- source_word: ἀδικίας
  choice: అనీతి
  rationale: ఇది నైతిక-దైవశాస్త్ర భావాన్ని కాపాడుతూ, తరువాతి δικαιοσύνηςకు ఎంచుకున్న ‘నీతి’తో స్పష్టమైన వ్యతిరేక జోడీగా ఉంటుంది.
- source_word: ἁμαρτίᾳ
  choice: పాపానికి
  rationale: మూలంలోని దత్తివిభక్తి సంబంధాన్ని నేరుగా నిలుపుతుంది; పాపాన్ని వ్యక్తీకరించిన పౌలు భావాన్ని ‘పాపశక్తికి’ అని విస్తరించకుండా పాఠకుడు గ్రహించేందుకు వీలు కల్పిస్తుంది.
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: మృతులలోనుండి సజీవులైనవారిగా
  rationale: ὡσεὶలోని పోలిక భావాన్నీ, మరణం నుండి జీవానికి వచ్చిన పునరుత్థానాకార వ్యత్యాసాన్నీ అధిక వ్యాఖ్యానం లేకుండా నిలుపుతుంది.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: పౌలు వాడుకలోని విస్తృత నైతిక-దైవశాస్త్ర భావానికి ‘నీతి’ సరిపోతుంది; ‘న్యాయం’ అనే సాధ్యమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో కాపాడుతున్నాం.
theological_decisions:
- issue: పాపం మరియు దేవుడు ప్రత్యర్థి యజమానులుగా కనిపించే పౌలు వ్యత్యాసం
  choice: ‘పాపానికి’, ‘దేవునికి’ అనే నేర దత్తివిభక్తి సంబంధాలను నిలుపడం
  alternative: ‘పాపసేవకు’, ‘దేవుని సేవకు’ అని వివరణాత్మకంగా విస్తరించడం
  rationale: గ్రీకు పాఠంలో విధేయత, అధీనత అనే భావాలు అంతర్లీనంగా ఉన్నాయి; అదనపు వ్యాఖ్యాన పదాలను చేర్చకుండా ఆ దైవశాస్త్ర ఉద్రిక్తతను అనువాదం నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘అనీతి/నీతి’, ‘పాపానికి/దేవునికి’ అనే సమాంతర వ్యత్యాసాలను, అలాగే ‘సమర్పించు’ అనే క్రియ పునరావృతిని ఉద్దేశపూర్వకంగా కాపాడాం. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో సంబంధిత పదం వెంట ఉంచబడింది.
