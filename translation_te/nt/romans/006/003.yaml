id: ROM.6.3
reference: Romans 6:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ ἀγνοεῖτε ὅτι ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: te
  text: లేక, మెస్సీయ యేసులోనికి బాప్తిస్మం పొందిన మనమందరం ఆయన మరణంలోనికి బాప్తిస్మం పొందామని మీకు తెలియదా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా, ‘క్రీస్తు యేసు.’ గ్రీకు: ‘క్రిస్టోస్ ఈయేసూస్.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: లేక
  rationale: ముందటి వాదనతో ఈ ప్రశ్నను అనుసంధానిస్తూ పౌలు ఉపయోగించిన వాదనాత్మక మలుపును సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἀγνοεῖτε
  choice: మీకు తెలియదా
  rationale: వర్తమానకాలంలోని అలంకారిక ప్రశ్నను సహజంగా వ్యక్తపరుస్తూ, పాఠకులకు ఇప్పటికే తెలిసి ఉండవలసిన విషయాన్ని గుర్తుచేసే స్వల్ప మందలింపు ధోరణిని నిలుపుతుంది.
- source_word: ὅσοι ... ἐβαπτίσθημεν
  choice: బాప్తిస్మం పొందిన మనమందరం
  rationale: మొదటి పురుష బహువచనంతో కూడిన ὅσοι యొక్క సమగ్ర పరిధిని స్పష్టంగా, సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐβαπτίσθημεν
  choice: బాప్తిస్మం పొందిన / బాప్తిస్మం పొందామని
  rationale: అఒరిస్ట్ పాసివ్ రూపాన్ని సంఘటనాత్మకంగా అనువదిస్తూ, బాప్తిస్మం గురించి ఏ ప్రత్యేక మతశాఖ వివరణనూ చేర్చదు.
- source_word: εἰς
  choice: లోనికి
  rationale: రెండు సందర్భాల్లోనూ దిశ, ప్రవేశం లేదా సమీకరణ భావాన్ని నిలుపుతుంది; దాని ఖచ్చితమైన ధార్మిక ప్రక్రియను ముందుగానే నిర్ణయించదు.
- source_word: Χριστὸν Ἰησοῦν
  choice: మెస్సీయ యేసు
  rationale: Χριστός యొక్క అభిషిక్త రాజు అనే బిరుదు భావాన్ని తెలుగులో గుర్తించదగిన ‘మెస్సీయ’ ద్వారా నిలుపుతుంది.
- source_word: τὸν θάνατον αὐτοῦ
  choice: ఆయన మరణం
  rationale: మూలంలోని స్వామ్య సంబంధాన్ని నేరుగా, గౌరవప్రదమైన తెలుగు ప్రయోగంతో అందిస్తుంది.
theological_decisions:
- issue: బాప్తిస్మంతో వాడిన εἰς అనేది సంస్కార ప్రభావాన్నా, సంకేతాత్మక గుర్తింపునా, లేక ఐక్యతనూ సూచిస్తుందా?
  choice: రెండు చోట్లా ‘లోనికి’ అని అనువదించబడింది.
  alternative: ‘సంబంధంగా’ లేదా ‘ఐక్యతలోనికి’
  rationale: ‘లోనికి’ అనే రూపం క్రీస్తుతోను ఆయన మరణంతోను సమీకరణకు సంబంధించిన బలమైన మూలభాషా చిత్రాన్ని నిలుపుతూ, దాని ధార్మిక విధానాన్ని ఏ ఒక్క మతశాఖ దృక్కోణానికి పరిమితం చేయదు.
- issue: Χριστόςను పేరులా ‘క్రీస్తు’గా ఇవ్వాలా, బిరుదుగా ‘మెస్సీయ’గా ఇవ్వాలా?
  choice: ‘మెస్సీయ యేసు’
  alternative: ‘క్రీస్తు యేసు’
  rationale: ఈ పాఠ్యంలో బిరుదు భావాన్ని స్పష్టంగా ఉంచేందుకు ‘మెస్సీయ’ను ప్రధాన పాఠ్యంలో వాడి, తెలుగు క్రైస్తవ వాడుకలో సుపరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గౌరవప్రదమైన ప్రశ్నారూపాన్ని ఉపయోగించాం. ‘బాప్తిస్మం’ అనే విస్తృతంగా గుర్తించబడే బైబిలు పదాన్ని నిలిపి, εἰς యొక్క పునరుక్తిని ‘లోనికి’ ద్వారా కాపాడాం.
