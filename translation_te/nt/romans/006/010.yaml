source:
  edition: SBLGNT
  text: ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: te
  text: ఎందుకంటే, ఆయన మరణించినది పాపానికి ఒక్కసారే మరణించినది; అయితే ఆయన జీవిస్తున్నది దేవునికే జీవిస్తున్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ γὰρ ἀπέθανεν
  choice: ఎందుకంటే, ఆయన పొందిన మరణం విషయానికొస్తే
  rationale: నపుంసకలింగ సంబంధసర్వనామం ὃ పునరుక్త క్రియతో కలిసి ఆయన మరణించిన సంఘటనను సూచిస్తుంది. తెలుగు సహజత్వం కోసం ‘ఆయన పొందిన మరణం విషయానికొస్తే’ అని ఇచ్చి, గ్రీకు వాక్యంలోని ఉద్ఘాటనను నిలిపింది; γάρ మునుపటి వాక్యానికి వివరణను కలుపుతుంది.
- source_word: τῇ ἁμαρτίᾳ
  choice: పాపం విషయంలో
  rationale: ఈ చతుర్థీ విభక్తి పాపంతో గల సంబంధాన్ని సూచిస్తుంది. ‘పాపం విషయంలో’ అనేది క్రీస్తుకు వ్యక్తిగత పాపం ఉందని భావింపజేయకుండా మూలంలోని సంబంధార్థక అస్పష్టతను కాపాడుతుంది.
- source_word: ἐφάπαξ
  choice: ఒక్కసారే శాశ్వతంగా
  rationale: ఒకే ఒక్కసారి జరిగిన, పునరావృతం కాని కార్యం మరియు దాని నిలిచే ప్రాముఖ్యత రెండింటినీ ఈ పదబంధం తెలియజేస్తుంది.
- source_word: ὃ δὲ ζῇ
  choice: అయితే ఆయన జీవిస్తున్న జీవితం విషయానికొస్తే
  rationale: మొదటి భాగంలోని మరణం–సంబంధ నిర్మాణానికి సమాంతరంగా జీవితం–సంబంధ నిర్మాణాన్ని నిలుపుతుంది; δέ వ్యక్తపరచే వ్యత్యాసాన్ని ‘అయితే’ తెలియజేస్తుంది.
- source_word: τῷ θεῷ
  choice: దేవుని కోసం
  rationale: ఇక్కడి చతుర్థీ విభక్తి జీవితం దేవునివైపు మళ్లి, దేవునికే అంకితమైనదనే దిశను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: τῇ ἁμαρτίᾳ అనే మాటను క్రీస్తుకు వ్యక్తిగత పాపం ఉన్నట్లు సూచించకుండా, దాని సంబంధార్థక విస్తృతిని ఎలా నిలపాలి?
  choice: పాపం విషయంలో
  alternative: పాపం కోసం; పాపానికి
  rationale: ‘పాపం విషయంలో’ అనేది పాపంతో క్రీస్తు మరణానికి ఉన్న సంబంధాన్ని తెలియజేస్తూ, అది పాపానికి బలిగా మరణించడమా లేక పాపపు అధికారానికి సంబంధించి మరణించడమా అనే భావాన్ని ప్రధాన పాఠ్యంలో అనవసరంగా తేల్చదు. ప్రత్యామ్నాయ భావాలను పాదటిప్పణిలో ఉంచుతుంది.
- issue: τῷ θεῷ ను τῇ ἁμαρτίᾳ తో ఖచ్చితంగా ఒకే తెలుగు విభక్తితో సమాంతరంగా ఇవ్వాలా?
  choice: దేవుని కోసం
  alternative: దేవుని విషయంలో; దేవునికి
  rationale: గ్రీకులో రెండు చతుర్థీ రూపాలు సమాంతరంగా ఉన్నా, తెలుగులో ‘దేవుని విషయంలో జీవిస్తున్నాడు’ అసహజంగా ఉంటుంది. ‘దేవుని కోసం’ జీవితం దేవునివైపు ఉద్దేశించబడిందనే భావాన్ని సహజంగా అందిస్తుంది; వాక్యంలోని మరణం–జీవితం వ్యత్యాసం కొనసాగుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు సమాంతర నిర్మాణాన్ని సాధ్యమైనంతవరకు నిలుపుతూ, తెలుగులో అసహజమైన పదానువాదాన్ని నివారించాం.
