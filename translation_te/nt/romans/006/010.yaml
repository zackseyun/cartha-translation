revisions:
- from: ఎందుకంటే, ఆయన పొందిన మరణం[a] విషయానికొస్తే, పాపం విషయంలో ఒక్కసారే శాశ్వతంగా మరణించాడు; అయితే ఆయన జీవిస్తున్న జీవితం విషయానికొస్తే, దేవుని కోసం జీవిస్తున్నాడు.
  to: ఎందుకంటే, ఆయన మరణించినది పాపానికి ఒక్కసారే మరణించినది; అయితే ఆయన జీవిస్తున్నది దేవునికే జీవిస్తున్నాడు.
  rationale: The revision removes the misleading idiom “పొందిన మరణం,” retains the Greek’s emphatic parallel nominal clauses (“ఆయన మరణించినది ... / ఆయన జీవిస్తున్నది ...”), renders ἐφάπαξ naturally as “ఒక్కసారే,” and uses “దేవునికే” for a direct, natural equivalent of τῷ θεῷ. The footnote now documents the material ambiguity in τῇ ἁμαρτίᾳ without imposing a doctrinal interpretation.
  reviewer_model: gpt-5.6-terra
