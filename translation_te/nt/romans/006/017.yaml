- from: అయితే దేవునికి కృతజ్ఞతలు! మీరు పాపానికి బానిసలుగా ఉండేవారు గాని, మీకు అప్పగించబడిన బోధా నమూనాకు[a] హృదయపూర్వకంగా విధేయులయ్యారు.
  to: కానీ దేవునికి కృతజ్ఞతలు! మీరు పాపానికి బానిసలుగా ఉండేవారైనా, మీరు అప్పగించబడిన ఆ బోధా నమూనాకు[a] హృదయపూర్వకంగా విధేయులయ్యారు.
  rationale: 'The revision restores the syntactic direction and passive voice of παρεδόθητε without producing unnatural Telugu: the readers, not the teaching, are «అప్పగించబడిన» వారు. The contrast introduced by ἦτε … δέ is rendered by «ఉండేవారైనా … విధేయులయ్యారు», and all other key terms retain the draft''s faithful choices.'
