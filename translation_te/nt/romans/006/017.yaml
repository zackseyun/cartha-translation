id: ROM.6.17
reference: Romans 6:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were servants of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: te
  text: కానీ దేవునికి కృతజ్ఞతలు! మీరు పాపానికి బానిసలుగా ఉండేవారైనా, మీరు అప్పగించబడిన ఆ బోధా నమూనాకు[a] హృదయపూర్వకంగా విధేయులయ్యారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీరు ఏ బోధా నమూనాలోనికి అప్పగించబడ్డారో, ఆ నమూనాకు.” ‘బోధా నమూనా’ను “బోధా రూపం” లేదా “బోధా ప్రమాణం” అని కూడా అనువదించవచ్చు.
    reason: εἰς ὃν … παρεδόθητεలో విశ్వాసులే బోధా నమూనాకు/లోనికి అప్పగించబడ్డారనే కర్మణి చిత్రణను, అలాగే τύπος పదానికి ఉన్న ప్రత్యామ్నాయ అర్థాలను స్పష్టం చేయడానికి.
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: అయితే దేవునికి కృతజ్ఞతలు!
  rationale: ఈ ప్రయోగంలో χάρις అనేది ‘కృప’ అనే భావం కంటే దేవునికి కృతజ్ఞత చెల్లించడాన్ని సూచిస్తుంది. ఆశ్చర్యార్థక వాక్యం పౌలు పలికిన స్తుతిపూర్వక స్వరాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: పాపానికి బానిసలు
  rationale: రోమా 6లోని యాజమాన్యం, ఆధిపత్యం, బంధనం అనే రూపకాన్ని ‘బానిసలు’ స్పష్టంగా నిలుపుతుంది; ‘సేవకులు’ అనడం ఆ తీవ్రతను తగ్గిస్తుంది.
- source_word: ὑπηκούσατε
  choice: విధేయులయ్యారు
  rationale: ఇది కేవలం వినడాన్ని కాక, చెప్పినదానికి లోబడడాన్ని సూచిస్తుంది. తెలుగు వాక్య నిర్మాణంలో ‘బోధా నమూనాకు విధేయులయ్యారు’ సహజంగా ఉంటుంది.
- source_word: ἐκ καρδίας
  choice: హృదయపూర్వకంగా
  rationale: అంతరంగం నుంచి వచ్చిన నిజమైన, సంపూర్ణ విధేయతను ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τύπον διδαχῆς
  choice: బోధా నమూనా
  rationale: τύπος లోని నమూనా, రూపం, ప్రమాణం అనే భావపరిధిని ‘నమూనా’ నిలుపుతుంది; διδαχήకు ‘బోధ’ సూటిగా సరిపోతుంది.
- source_word: παρεδόθητε
  choice: మీకు అప్పగించబడిన
  rationale: గ్రీకు కర్మణి రూపంలోని ‘అప్పగించబడటం’ అనే భావాన్ని నిలుపుతూ, తెలుగులో అర్థమయ్యే నిర్మాణాన్ని ఇస్తుంది. అయితే గ్రీకులో విశ్వాసులే బోధా నమూనాకు అప్పగించబడ్డారనే మరింత అసాధారణమైన చిత్రణ ఉండవచ్చని పాదసూచికలో తెలియజేయబడింది.
- source_word: εἰς ὃν
  choice: బోధా నమూనాకు
  rationale: εἰς సూచించే దిశను తెలుగులో ‘కు’ ద్వారా సహజంగా వ్యక్తం చేయవచ్చు; దాని మరింత అక్షరార్థమైన ‘లోనికి’ భావాన్ని పాదసూచికలో భద్రపరిచాం.
theological_decisions:
- issue: δοῦλοι అనే పదాన్ని ‘సేవకులు’గా మృదువుగా అనువదించాలా, ‘బానిసలు’గా ఇవ్వాలా
  choice: పాపానికి బానిసలు
  alternative: పాపానికి సేవకులు
  rationale: ఈ అధ్యాయంలో పాపం మనుషులపై అధికారం చెలాయించే యజమానిగా చిత్రించబడింది. ‘బానిసలు’ ఆ బంధిత స్థితినీ, తరువాత వచ్చే నీతికి బానిసలనే వ్యత్యాసాన్నీ నిలుపుతుంది.
- issue: παρεδόθητε పదబంధంలో విశ్వాసులు బోధకు అప్పగించబడ్డారా, లేక బోధ వారికి అప్పగించబడిందా
  choice: ప్రధాన పాఠ్యంలో సహజమైన తెలుగు కోసం ‘మీకు అప్పగించబడిన బోధా నమూనా’; మూలంలోని అసాధారణ కర్మణి చిత్రణను పాదసూచికలో స్పష్టం చేయడం
  alternative: మీరు ఏ బోధా నమూనాలోనికి అప్పగించబడ్డారో దానికి
  rationale: గ్రీకు వాక్యనిర్మాణం విశ్వాసులే బోధా నమూనాలోనికి లేదా దానికి అప్పగించబడ్డారని బలంగా సూచిస్తుంది. ప్రధాన వాక్యంలోని తెలుగు సహజత్వాన్ని కాపాడుతూ, ఆ నిజమైన నిర్మాణాత్మక ఉద్రిక్తతను పాదసూచికలో దాచకుండా ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనా సాధారణ పాఠకులకు స్పష్టంగా ఉండే శైలి. ‘బానిసలు’ అనే పదం ఉద్దేశపూర్వకంగా బలమైన బంధన రూపకాన్ని నిలుపుతుంది. ‘హృదయపూర్వకంగా’ సహజమైన ప్రస్తుత తెలుగు ప్రయోగం.
