id: ROM.6.12
reference: Romans 6:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: te
  text: కాబట్టి, మీ మరణశీలమైన శరీరంలో పాపం రాజ్యమేలకుండా చూడండి, తద్వారా మీరు మీ శరీరపు కోరికలకు[a] లోబడరు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సందర్భానుసారంగా, ‘పాపపు కోరికలకు.’
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణను స్పష్టంగా సూచిస్తుంది.
- source_word: βασιλευέτω
  choice: రాజ్యమేలనివ్వకండి
  rationale: నిషేధ ఆజ్ఞను, అలాగే పాపాన్ని పాలించే శక్తిగా చిత్రించే రాజరిక రూపకాన్ని నిలుపుతుంది.
- source_word: ἁμαρτία
  choice: పాపం
  rationale: సాధారణమైన ప్రత్యక్ష సమానార్థకం; ‘రాజ్యమేలు’ అనే క్రియతో పౌలు చేసిన వ్యక్తీకరణ కూడా నిలుస్తుంది.
- source_word: θνητῷ
  choice: మరణశీలమైన
  rationale: మరణానికి లోబడిన ప్రస్తుత శరీర స్థితిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: σώματι
  choice: శరీరంలో
  rationale: మూలంలోని ఏకవచన నామవాచకాన్ని అదనపు వ్యాఖ్యానం లేకుండా నేరుగా అనువదిస్తుంది.
- source_word: εἰς τὸ ὑπακούειν
  choice: లోబడేలా
  rationale: పాపం రాజ్యమేలడం వల్ల కలిగే ఉద్దేశిత లేదా ఫలిత సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐπιθυμίαις
  choice: కోరికలకు
  rationale: గ్రీకు పదంలోని విస్తృత భావాన్ని నిలుపుతూ, దానిని కేవలం లైంగిక వాంఛలకు పరిమితం చేయదు.
- source_word: αὐτοῦ
  choice: దాని
  rationale: తెలుగులో ఈ సర్వనామం ‘శరీరం’నూ ‘పాపం’నూ సూచించగలదు; అందువల్ల మూలపాఠంలోని సూచనాసందిగ్ధతను సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: పాపం కేవలం చర్యలుగా చూపబడిందా, లేక పాలించే శక్తిగా చూపబడిందా
  choice: ‘పాపం ... రాజ్యమేలనివ్వకండి’ అని వ్యక్తీకరణను నిలిపాం.
  alternative: పాపపు ప్రవర్తన మిమ్మల్ని అదుపు చేయనివ్వకండి.
  rationale: మూలంలోని రాజరిక రూపకం పాపాన్ని పాలించే శక్తిగా చిత్రిస్తుంది; దాన్ని వివరణాత్మక పదాలతో బలహీనపరచకుండా నిలుపడం సముచితం.
- issue: αὐτοῦ (‘దాని’) అనే సర్వనామం దేనిని సూచిస్తుంది
  choice: ప్రధాన పాఠంలో ‘దాని’ అని ఉంచి సూచనాసందిగ్ధతను నిలిపాం; గ్రీకు వ్యాకరణం ప్రకారం అది ‘శరీరం’తో సహజంగా సరిపోతుంది.
  alternative: దాన్ని సందర్భానుసారంగా ‘పాపపు కోరికలు’ అని అర్థం చేసుకోవచ్చు.
  rationale: గ్రీకులో సర్వనామం పుంలింగం/నపుంసకలింగం ఏకవచన రూపంలో ఉండి, నపుంసకలింగమైన ‘శరీరం’తో వ్యాకరణపరంగా సరిపోతుంది; అయినా సందర్భంలో దాన్ని పాపంతో భావసంబంధంగా కలిపి చదివే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. వాక్య క్రమాన్ని తెలుగు సహజత్వానికి అనుగుణంగా మార్చి, మూలంలోని ఆజ్ఞ, కారణ-ఫలిత సంబంధం, రాజరిక రూపకం, సర్వనామ సందిగ్ధతలను నిలిపాం.
