revisions:
- from: కాబట్టి, మీరు దాని[a] కోరికలకు లోబడేలా పాపం మీ మరణశీలమైన శరీరంలో రాజ్యమేలనివ్వకండి.
  to: కాబట్టి, మీ మరణశీలమైన శరీరంలో పాపం రాజ్యమేలకుండా చూడండి, తద్వారా మీరు మీ శరీరపు కోరికలకు[a] లోబడరు.
  rationale: The revision makes the primary grammatical sense of αὐτοῦ explicit as referring to the mortal body, while retaining the contextual alternative in a footnote. It also improves modern Telugu word order. ‘రాజ్యమేలకుండా చూడండి’ idiomatically conveys the prohibition ‘do not let sin reign,’ and ‘తద్వారా’ clearly marks the purpose/result relation of εἰς τὸ ὑπακούειν.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:08:36Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the inferential force of οὖν, the imperative prohibition, sin’s royal personification, ‘mortal body,’ and the purpose/result clause. However, placing ‘దాని’ before its intended antecedent makes the Telugu reference needlessly unclear. The Greek pronoun most naturally agrees with σώματι (‘body’); the contextual alternative relating the desires to sin should remain in a footnote rather than be made opaque in the main text.
  naturalness: The draft is broadly understandable, but ‘మీరు దాని కోరికలకు లోబడేలా పాపం మీ ... శరీరంలో’ is awkwardly ordered and uses a cataphoric pronoun that does not read naturally in modern standard Telugu. Reordering the sentence and stating ‘శరీరపు కోరికలు’ makes the command clear and fluent.
  terminology: ‘కాబట్టి,’ ‘పాపం,’ ‘మరణశీలమైన శరీరం,’ ‘కోరికలు,’ and the royal image in ‘రాజ్యమేల’ are appropriate. The revised wording retains the non-denominational, formal-but-accessible register.
  issues:
  - severity: medium
    issue: The pronoun ‘దాని’ precedes its intended antecedent and is syntactically ambiguous in Telugu.
    rationale: Although αὐτοῦ most naturally refers grammatically to the neuter ‘body,’ Telugu ‘దాని’ can readily be heard as referring to ‘పాపం’ in this word order. The main text should express the primary reading clearly; the alternative can be footnoted.
  - severity: low
    issue: The placement of the purpose clause before the subject/location of sin’s reign is less idiomatic.
    rationale: Moving ‘మీ మరణశీలమైన శరీరంలో’ before the purpose clause gives a clearer and more natural Telugu sentence without changing the Greek sense.
  revised_text: కాబట్టి, మీ మరణశీలమైన శరీరంలో పాపం రాజ్యమేలకుండా చూడండి, తద్వారా మీరు మీ శరీరపు కోరికలకు[a] లోబడరు.
  revised_footnotes:
  - marker: a
    text: లేదా, సందర్భానుసారంగా, ‘పాపపు కోరికలకు.’
    reason: alternative_reading
  revision_rationale: The revision makes the primary grammatical sense of αὐτοῦ explicit as referring to the mortal body, while retaining the contextual alternative in a footnote. It also improves modern Telugu word order. ‘రాజ్యమేలకుండా చూడండి’ idiomatically conveys the prohibition ‘do not let sin reign,’ and ‘తద్వారా’ clearly marks the purpose/result relation of εἰς τὸ ὑπακούειν.
