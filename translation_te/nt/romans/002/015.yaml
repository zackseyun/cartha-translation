id: ROM.2.15
reference: Romans 2:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: te
  text: ధర్మశాస్త్రపు కార్యం తమ హృదయాల్లో వ్రాయబడి ఉందని వారు చూపిస్తున్నారు.[a] వారి మనస్సాక్షి కూడా సాక్ష్యమిస్తుండగా, వారి ఆలోచనలు పరస్పరం వారిని నిందించడమో లేదా వారిని సమర్థించడమో కూడా చేస్తుండగా ఇలా జరుగుతుంది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ధర్మశాస్త్రం కోరేది” లేదా “ధర్మశాస్త్రపు ఆదేశాలు.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో “పరస్పరం” అనే భావం మరింత స్పష్టంగా ఉంది; అక్షరార్థంగా, “ఒకదానితో ఒకటి.” ఈ వాక్యనిర్మాణం సంక్షిప్తంగా ఉంది; దీనిని “వారి పరస్పర విరుద్ధమైన ఆలోచనలు” అని కూడా అర్థం చేసుకోవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: చూపిస్తున్నారు
  rationale: క్రియలోని సాక్ష్యపూర్వక భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ‘నిరూపిస్తున్నారు’ అన్నంత బలమైన భావాన్ని రుద్దదు.
- source_word: τὸ ἔργον τοῦ νόμου
  choice: ధర్మశాస్త్రపు కార్యం
  rationale: గ్రీకులోని ఏకవచన ‘కార్యం’ను నిలుపుతూ, ‘ధర్మశాస్త్రం కోరేవి’ అనే వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలోకి చేర్చకుండా అసలు వ్యక్తీకరణను పారదర్శకంగా ఉంచుతుంది.
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: తమ హృదయాల్లో వ్రాయబడి ఉంది
  rationale: అంతరంగంలో లిఖించబడినదనే రూపకాన్ని సహజమైన తెలుగు ప్రయోగంతో నిలుపుతుంది.
- source_word: συμμαρτυρούσης ... τῆς συνειδήσεως
  choice: వారి మనస్సాక్షి కూడా దానికి సాక్ష్యమిస్తోంది
  rationale: సమ్మిళిత క్రియలోని సహసాక్ష్య భావాన్ని ‘దానికి’ ద్వారా స్పష్టంగా, కానీ అతివ్యాఖ్యానం లేకుండా వ్యక్తం చేస్తుంది.
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: వారి ఆలోచనలు ఒకదానితో ఒకటి
  rationale: సంక్షిప్తమైన గ్రీకు నిర్మాణంలోని పరస్పర భావాన్ని ప్రధాన పాఠ్యంలో కనిపించేలా ఉంచుతుంది.
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: వారిని నిందిస్తున్నాయి, లేదా సమర్థిస్తున్నాయి కూడా
  rationale: ἀπολογέομαι యొక్క ‘సమర్థించడం/పక్షంగా వాదించడం’ భావాన్ని నిలుపుతుంది; καὶ ఇచ్చే ఉద్ఘాటనను ‘కూడా’ తెలియజేస్తుంది. కర్మగా వ్యక్తులనే సూచించడం తాజా పాఠ్య నిర్ణయానికి అనుగుణం.
theological_decisions:
- issue: పౌలు సాధారణ అంతరంగ నైతిక అవగాహనను సూచిస్తున్నాడా, లేక ధర్మశాస్త్రం కోరే విషయాలను ప్రత్యేకంగా సూచిస్తున్నాడా?
  choice: ప్రధాన పాఠ్యంలో ‘ధర్మశాస్త్రపు కార్యం’ అనే తక్కువ వ్యాఖ్యానాత్మక రూపాన్ని నిలిపాం.
  alternative: ‘ధర్మశాస్త్రం కోరేది’ లేదా ‘ధర్మశాస్త్రపు ఆదేశాలు’
  rationale: గ్రీకు పదబంధం సంక్షిప్తంగా, వ్యాఖ్యానానికి తెరిచి ఉంది. దాని వేదాంతపరమైన ఉద్వేగాన్ని పరిష్కరించకుండా ప్రధాన పాఠ్యంలో నిలిపి, సాధారణ వ్యాఖ్యానాన్ని పాదటిప్పణిలో ఇస్తుంది.
- issue: ఆలోచనలు ఒకదానినొకటి నిందిస్తున్నాయా/సమర్థిస్తున్నాయా, లేక సంబంధిత వ్యక్తులను నిందిస్తున్నాయా/సమర్థిస్తున్నాయా?
  choice: పరస్పర భావాన్ని ఆలోచనల మధ్య సంబంధంగా ఉంచి, నింద/సమర్థనకు కర్మగా ‘వారిని’ వాడాం.
  alternative: ‘వారి ఆలోచనలు ఒకదానినొకటి నిందిస్తున్నాయి లేదా సమర్థిస్తున్నాయి’
  rationale: μεταξὺ ἀλλήλων ఆలోచనల పరస్పర అంతఃక్రియను సూచిస్తుండగా, నిందించడం లేదా సమర్థించడం వ్యక్తుల నైతిక స్థితిని లక్ష్యంగా చేసుకోవచ్చనే వాక్యనిర్మాణాన్ని ఈ రూపం కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘ధర్మశాస్త్రం,’ ‘మనస్సాక్షి,’ ‘సాక్ష్యమిస్తోంది’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని సహజ వాక్యనిర్మాణంతో వాడాం. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో చేర్చబడ్డాయి.
