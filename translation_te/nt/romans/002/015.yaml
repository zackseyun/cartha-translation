  rationale: The revision removes an unnecessary supplied object from the conscience clause and recasts the final clause for natural modern Telugu. It retains “ధర్మశాస్త్రపు కార్యం,” the singular source expression, preserves the emphatic “కూడా” with the defending alternative, and keeps the reciprocal ambiguity visible both in the main text and footnote.
