revisions:
- from: ధర్మశాస్త్రపు కార్యం తమ హృదయాల్లో వ్రాయబడి ఉందని వారు చూపిస్తున్నారు.[a] వారి మనస్సాక్షి కూడా దానికి సాక్ష్యమిస్తోంది; వారి ఆలోచనలు ఒకదానితో ఒకటి[b] వారిని నిందిస్తున్నాయి, లేదా సమర్థిస్తున్నాయి కూడా.
