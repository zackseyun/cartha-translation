id: ROM.2.3
reference: Romans 2:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: te
  text: కానీ, ఓ మనిషీ, అలాంటి పనులు చేసేవారికి తీర్పు తీర్చుతూ, నీవు కూడా అవే పనులు చేస్తున్న నీవు, దేవుని తీర్పు నుండి తప్పించుకుంటావని అనుకుంటున్నావా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογίζῃ
  choice: అనుకుంటున్నావా
  rationale: మనసులో లెక్కించుకోవడం లేదా భావించడాన్ని సూచించే క్రియను, ఇక్కడి అలంకారిక ప్రశ్నకు సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: ἄνθρωπε
  choice: ఓ మనిషీ
  rationale: ఏకవచనంలో నేరుగా సంబోధించే పౌలు వాదనా శైలిని, ప్రతినిధి మానవుణ్ణి ఉద్దేశించే భావాన్ని నిలుపుతుంది.
- source_word: κρίνων
  choice: తీర్పు చెబుతూ
  rationale: నైతికంగా ఇతరులపై తీర్పు చేయడాన్ని నేరుగా తెలియజేస్తుంది; ‘ఖండిస్తూ’ అని అనువదించి మూలపదం కంటే భావాన్ని బలపరచదు.
- source_word: πράσσοντας
  choice: ఆచరించేవారు
  rationale: కొనసాగుతున్న ప్రవర్తనను సూచిస్తూ, తరువాతి ποιῶν‌కు వాడిన ‘చేస్తున్న’ అనే పదం నుంచి పౌలు పదవైవిధ్యాన్ని కొంతవరకు నిలుపుతుంది.
- source_word: ποιῶν αὐτά
  choice: నీవే అవే పనులు చేస్తున్న
  rationale: అదే క్రియలను సంబోధితుడు కూడా చేస్తున్నాడనే సందర్భోచిత నొక్కును ‘నీవే అవే’ ద్వారా సహజంగా వ్యక్తపరుస్తుంది.
- source_word: ἐκφεύξῃ
  choice: తప్పించుకుంటావు
  rationale: రాబోయే దైవిక తీర్పు నుంచి తప్పించుకోవడం అనే భావాన్ని స్పష్టంగా, సహజంగా అందిస్తుంది.
- source_word: κρίμα τοῦ θεοῦ
  choice: దేవుని తీర్పు
  rationale: ఇది కేవలం శిక్ష లేదా తీర్పు ప్రకటన మాత్రమేనని కుదించకుండా, దేవుని న్యాయపరమైన నిర్ణయాన్ని విస్తృతంగా నిలుపుతుంది.
