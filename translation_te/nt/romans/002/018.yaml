  to: ధర్మశాస్త్రం నుండి ఉపదేశం పొందుతూ, ఆయన చిత్తాన్ని[a] తెలుసుకొని, ఏవి శ్రేష్ఠమైనవో పరీక్షించి గుర్తిస్తున్నావు[b],
