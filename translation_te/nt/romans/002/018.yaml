  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ γινώσκεις τὸ θέλημα καὶ δοκιμάζεις τὰ διαφέροντα κατηχούμενος ἐκ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/018.yaml
  text: and know his will and approve the things that differ[a], being instructed from the law[b],
translation:
  language: te
  text: ధర్మశాస్త్రం నుండి ఉపదేశం పొందుతూ, ఆయన చిత్తాన్ని[a] తెలుసుకొని, ఏవి శ్రేష్ఠమైనవో పరీక్షించి గుర్తిస్తున్నావు[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చిత్తాన్ని.” గ్రీకులో “ఆయన” అని స్పష్టంగా లేదు; సందర్భంలో దేవుడే సూచితుడు.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “భిన్నమైనవాటిని పరీక్షించి గుర్తిస్తున్నావు.”
    reason: alternative_reading
lexical_decisions:
- source_word: γινώσκεις
  choice: తెలుసుకొని
  rationale: వర్తమానకాల క్రియకు సహజమైన తెలుగు సమానార్థకం; ముందున్న షరతుల పరంపరతో అనుసంధానించేందుకు అసమాపక రూపం వాడబడింది.
- source_word: τὸ θέλημα
  choice: ఆయన చిత్తాన్ని
  rationale: గ్రీకులో స్వామ్యసూచక పదం స్పష్టంగా లేకపోయినా, సందర్భంలో దేవుడే సూచితుడు; తెలుగులో సహజంగా ఉండేందుకు ‘ఆయన’ చేర్చబడింది.
- source_word: δοκιμάζεις
  choice: వివేచిస్తున్నావు
  rationale: పరీక్షించి విలువను గుర్తించడం అనే భావాన్ని తెలుపుతుంది; ‘ఆమోదిస్తున్నావు’ కంటే τὰ διαφέροντα యొక్క అర్థసందిగ్ధతను తెలుగులో మెరుగుగా నిలుపుతుంది.
- source_word: τὰ διαφέροντα
  choice: శ్రేష్ఠమైనవాటిని
  rationale: ఈ సందర్భంలో నైతికంగా మెరుగైన లేదా ప్రాముఖ్యమైన వాటిని గుర్తించడం అనే సంభావ్య ప్రయోగార్థాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; మరింత అక్షరార్థ ప్రత్యామ్నాయం పాదసూచికలో ఇవ్వబడింది.
- source_word: κατηχούμενος
  choice: ఉపదేశం పొందుతూ
  rationale: నిష్క్రియ వర్తమాన అసమాపక క్రియ భావాన్ని నిలుపుతూ, బోధించబడటం అనే అర్థాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: ἐκ τοῦ νόμου
  choice: ధర్మశాస్త్రం నుండి
  rationale: ἐκ సూచించే మూలం లేదా ఆధార భావాన్ని నేరుగా నిలుపుతుంది; νόμος ఇక్కడ మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది.
theological_decisions:
- issue: τὸ θέλημα లో స్వామ్యసూచక పదం లేకపోవడం
  choice: ఆయన చిత్తాన్ని
  alternative: చిత్తాన్ని
  rationale: సందర్భంలో దేవుడు సూచితుడని స్పష్టం చేయడానికి ‘ఆయన’ వాడబడింది; ఇది కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: τὰ διαφέροντα యొక్క అర్థసందిగ్ధత
  choice: శ్రేష్ఠమైనవాటిని
  alternative: భిన్నమైనవాటిని
  rationale: ఈ పదబంధం ‘భిన్నమైనవి’ అని అక్షరార్థంగా లేదా ‘శ్రేష్ఠమైనవి/ముఖ్యమైనవి’ అని ప్రయోగార్థంగా అర్థమవుతుంది. ప్రధాన పాఠ్యంలో సందర్భోచిత భావం, పాదసూచికలో అక్షరార్థ ప్రత్యామ్నాయం ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. రోమా 2:17లో మొదలయ్యే షరతుల వాక్యపరంపరతో అనుసంధానం నిలుపుటకు అసమాపక క్రియారూపాలు ఉపయోగించబడ్డాయి.
