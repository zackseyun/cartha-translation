revisions:
- from: కాని అంతరంగంలో యూదుడిగా ఉన్నవాడే నిజమైన యూదుడు[a]; సున్నతి హృదయానికి సంబంధించినది—అక్షరం వల్ల కాదు, ఆత్మ వల్ల కలిగేది. అలాంటి వ్యక్తికి ప్రశంస మనుషుల నుంచి కాదు, దేవుని నుంచి వస్తుంది.
  to: కాని అంతరంగంలో యూదుడైనవాడే యూదుడు; హృదయ సున్నతి ఆత్మలో[a], అక్షరంలో కాదు. అతనికి కలిగే ప్రశంస మనుషుల నుంచి కాదు, దేవుని నుంచి వస్తుంది.
  rationale: The revision removes the added word “నిజమైన,” restores the direct metaphor “హృదయ సున్నతి,” and keeps the Spirit/letter expression closer to the Greek without imposing one theological interpretation. The final clause is expressed naturally in Telugu while retaining that the inward Jew’s praise comes from God rather than people.
