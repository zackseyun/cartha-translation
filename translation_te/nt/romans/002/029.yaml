id: ROM.2.29
reference: Romans 2:29
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: te
  text: కాని అంతరంగంలో యూదుడైనవాడే యూదుడు; హృదయ సున్నతి ఆత్మలో[a], అక్షరంలో కాదు. అతనికి కలిగే ప్రశంస మనుషుల నుంచి కాదు, దేవుని నుంచి వస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “ఆత్మ ద్వారా.” “ఆత్మలో” అనే మాట పరిశుద్ధాత్మను, మానవ ఆత్మను, లేదా బాహ్య అక్షరానికి భిన్నమైన ఆధ్యాత్మిక అంతరంగ వాస్తవాన్ని సూచించవచ్చు.'
    reason: ἐν πνεύματι యొక్క వ్యాకరణపరమైన మరియు వ్యాఖ్యానపరమైన అస్పష్టతను కాపాడేందుకు.
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: అంతరంగంలో
  rationale: బాహ్యంగా కనిపించేదానికి విరుద్ధంగా, దాగి ఉన్న అంతరంగ వాస్తవాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: Ἰουδαῖος
  choice: యూదుడు
  rationale: ఈ సందర్భంలోని నిబంధనాపరమైన, మతపరమైన భావానికి సాధారణ తెలుగు పదం సరిపోతుంది.
- source_word: περιτομὴ καρδίας
  choice: సున్నతి హృదయానికి సంబంధించినది
  rationale: హృదయస్థాయిలో జరిగే సున్నతి అనే రూపకాన్ని నిలుపుతూ తెలుగులో స్పష్టంగా ఉంటుంది.
- source_word: ἐν πνεύματι
  choice: ఆత్మ వల్ల
  rationale: ἐν ఇక్కడ సాధనార్థకంగా ఉండవచ్చు; పౌలు చెప్పే ఆత్మ–అక్షరం వ్యత్యాసంలో దేవుని ఆత్మ కార్యాన్ని సూచించే సాధ్యత బలంగా ఉంది.
- source_word: οὐ γράμματι
  choice: అక్షరం వల్ల కాదు
  rationale: γράμμα యొక్క మూల రూపకాన్ని నిలుపుతూ, వ్రాత నియమం లేదా బాహ్య లిఖిత నియమపాలన అనే భావాన్ని సందర్భంలో అందిస్తుంది.
- source_word: οὗ ὁ ἔπαινος
  choice: అలాంటి వ్యక్తికి ప్రశంస
  rationale: సంబంధ సర్వనామం ఎవరిని సూచిస్తుందో తెలుగులో సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐξ ἀνθρώπων
  choice: మనుషుల నుంచి
  rationale: లింగభేదం లేకుండా మానవ మూలాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐκ τοῦ θεοῦ
  choice: దేవుని నుంచి
  rationale: మూలంలోని సరళమైన భావాన్ని విస్తరించకుండా ప్రతిబింబిస్తుంది.
theological_decisions:
- issue: πνεύματι పరిశుద్ధాత్మను సూచిస్తుందా, లేక మానవ అంతరాత్మను లేదా ఆధ్యాత్మిక అంతరంగ వాస్తవాన్ని సూచిస్తుందా?
  choice: ప్రధాన పాఠ్యంలో ‘ఆత్మ వల్ల’ అని ఉంచి, దేవుని ఆత్మ కార్యం అనే ప్రధాన భావాన్ని అనుమతించడం
  alternative: ‘ఆత్మలో’ లేదా ‘అంతరాత్మలో’
  rationale: పౌలు వాడే ఆత్మ–అక్షరం వ్యత్యాసం పరిశుద్ధాత్మ కార్యాన్ని సూచించే అవకాశం బలంగా ఉన్నా, గ్రీకు పదబంధం పూర్తిగా నిర్ద్వంద్వం కాదు. అందువల్ల తెలుగు పదంలో అతిగా వివరణ చేర్చకుండా, ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో భద్రపరచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సున్నతి,’ ‘హృదయం,’ ‘అక్షరం,’ ‘ఆత్మ’ అనే పౌలు రూపకాలు నిలుపబడ్డాయి; చివరి సంబంధ వాక్యం తెలుగులో స్పష్టత కోసం ‘అలాంటి వ్యక్తికి’గా వ్యక్తీకరించబడింది.
