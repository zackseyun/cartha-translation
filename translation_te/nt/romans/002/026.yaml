id: ROM.2.26
reference: Romans 2:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: te
  text: కాబట్టి, సున్నతి పొందని వ్యక్తి ధర్మశాస్త్రపు విధులను పాటిస్తే, అతని సున్నతిలేని స్థితి సున్నతిగా లెక్కింపబడదా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'అక్షరార్థంగా: “సున్నతిలేని స్థితి ధర్మశాస్త్రపు విధులను పాటిస్తే, అతని సున్నతిలేని స్థితి సున్నతిగా లెక్కింపబడదా?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: సున్నతి పొందని వ్యక్తి / అతని సున్నతిలేని స్థితి
  rationale: ఈ పదం అక్షరార్థంగా ‘సున్నతిలేని స్థితి’ని సూచించినా, మొదటి ప్రయోగంలో వ్యక్తిని ఉద్దేశిస్తున్నది; αὐτοῦ (‘అతని’) వల్ల రెండవ ప్రయోగంలో ఆ వ్యక్తి సున్నతిలేని స్థితి స్పష్టమవుతుంది. తెలుగులో సహజతతో పాటు మూలంలోని పదపునరుక్తిని సాధ్యమైనంతగా నిలుపుతుంది.
- source_word: δικαιώματα
  choice: విధులు
  rationale: ధర్మశాస్త్రం కోరే ఆచరణీయ నియమాలు లేదా నిర్దేశాలను ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది; మూలంలో లేని అదనపు ‘నీతి’ భావాన్ని చేర్చదు.
- source_word: νόμου
  choice: ధర్మశాస్త్రపు
  rationale: పౌలు చర్చిస్తున్న మోషే ధర్మశాస్త్రాన్ని తెలుగు బైబిలు సందర్భంలో సహజంగా సూచిస్తుంది.
- source_word: φυλάσσῃ
  choice: పాటిస్తే
  rationale: ఆజ్ఞలు లేదా విధులను విధేయతతో ఆచరించడాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: λογισθήσεται
  choice: ఎంచబడదా
  rationale: లెక్కలో చేర్చడం లేదా ఒక స్థితిగా పరిగణించడం అనే పౌలు ఉపయోగించిన గణనాత్మక భావాన్ని నిలుపుతుంది.
- source_word: εἰς περιτομήν
  choice: సున్నతిగా
  rationale: సున్నతి అనే స్థితి లేదా వర్గంలో పరిగణించబడటం అనే ఫలితార్థాన్ని తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: οὐχ
  choice: ఎంచబడదా?
  rationale: సానుకూల సమాధానాన్ని ఆశించే గ్రీకు అలంకారప్రశ్నను తెలుగు ప్రతికూల ప్రశ్నారూపంలో నిలుపుతుంది.
theological_decisions:
- issue: సున్నతి పొందని వ్యక్తి ధర్మశాస్త్రపు విధులను పాటించడం మరియు అతని స్థితి సున్నతిగా ఎంచబడడం మధ్య సంబంధం
  choice: మూలంలోని షరతు మరియు అలంకారప్రశ్నను యథాతథంగా ఉంచడం
  alternative: ఈ వాక్యం ఊహాత్మకమా, వాస్తవ అన్యజన విధేయతను సూచిస్తుందా, లేదా రక్షణ సిద్ధాంతాన్ని ఎలా వివరిస్తుందా అని అనువాదంలోనే నిర్ధారించడం
  rationale: గ్రీకు వాక్యం ఆ వ్యాఖ్యాన ప్రశ్నలను ఇక్కడ పరిష్కరించదు. అందువల్ల పౌలు వాదనలోని ఉద్రిక్తతను అనువాదం మౌనంగా తొలగించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సున్నతి పొందని వ్యక్తి’ వ్యక్తిగత సూచనను సహజంగా తెలియజేస్తుంది; పాదటిప్పణి మూలంలోని అమూర్త నామవాచక పునరుక్తిని చూపిస్తుంది.
