id: ROM.2.11
reference: Romans 2:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/011.yaml
  text: For there is no partiality with God[a].
translation:
  language: te
  text: ఎందుకంటే, దేవుని దగ్గర పక్షపాతం లేదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ముఖపక్షం.”
    reason: ‘ముఖపక్షం’ మూలపదంలోని వ్యక్తి ముఖం లేదా హోదాను బట్టి మొగ్గు చూపే భావాన్ని మరింత పదశః ప్రతిబింబించే ప్రత్యామ్నాయం; ప్రధాన పాఠంలోని ‘పక్షపాతం’ ఆధునిక తెలుగులో మరింత సహజం.
lexical_decisions:
- source_word: γάρ
  choice: ఎందుకంటే
  rationale: ముందటి వాక్యానికి కారణాన్ని తెలియజేసే వివరణాత్మక అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: προσωπολημψία
  choice: పక్షపాతం
  rationale: హోదా, వ్యక్తి స్థితి లేదా పైకి కనిపించే అంశాల ఆధారంగా ఒకరి పట్ల మొగ్గు చూపడాన్ని సూచించే ఈ పదానికి ‘పక్షపాతం’ సహజమైన, ఖచ్చితమైన న్యాయ-నైతిక పదం.
- source_word: παρὰ τῷ θεῷ
  choice: దేవుని దగ్గర
  rationale: παρά దత్తివ విభక్తితో ఇక్కడ దేవుని సన్నిధి లేదా ఆయనకు సంబంధించిన పరిధిని సూచిస్తుంది; ‘దేవుని దగ్గర’ గ్రీకు రూపాన్ని అనుసరిస్తూనే సాధారణ తెలుగులో సహజంగా ఉంటుంది.
- source_word: οὐ γάρ ἐστιν ... παρὰ τῷ θεῷ
  choice: ఎందుకంటే, దేవుని దగ్గర పక్షపాతం లేదు.
  rationale: గ్రీకులోని అస్తిత్వ నిర్మాణాన్ని క్రియాశీలమైన ‘దేవుడు పక్షపాతం చూపడు’ అనే వివరణగా మార్చకుండా నిలుపుతుంది.
theological_decisions:
- issue: దేవుని నిష్పక్షపాత స్వభావాన్ని వ్యక్తపరచడం
  choice: ‘దేవుని దగ్గర పక్షపాతం లేదు’ అని సాధారణ సత్య ప్రకటనగా అనువదించడం.
  alternative: ‘దేవుడు పక్షపాతం చూపడు.’
  rationale: రెండూ భావపరంగా సమీపమైనవే; అయితే ఎంచుకున్న రూపం గ్రీకు అస్తిత్వ వాక్యనిర్మాణాన్ని కాపాడి, మూలంలో స్పష్టంగా లేని క్రియాత్మక చర్యను చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు స్పష్టంగా ఉండే గౌరవప్రదమైన శైలి. గ్రీకు అస్తిత్వ నిర్మాణం మరియు ముందటి వాక్యంతో కారణసంబంధం నిలుపబడ్డాయి.
