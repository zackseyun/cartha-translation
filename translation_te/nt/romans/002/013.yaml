id: ROM.2.13
reference: Romans 2:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: te
  text: ఎందుకంటే, దేవుని ఎదుట ధర్మశాస్త్రాన్ని వినేవారు నీతిమంతులు కారు; ధర్మశాస్త్రాన్ని ఆచరించేవారే నీతిమంతులుగా తీర్చబడతారు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నీతిమంతులుగా ప్రకటించబడతారు’; మరో విధంగా, ‘న్యాయమైనవారిగా నిరూపించబడతారు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: వినేవారు
  rationale: కేవలం ధర్మశాస్త్రాన్ని వినడం, దాన్ని ఆచరించడం మధ్య పౌలు ఉంచిన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: νόμου
  choice: ధర్మశాస్త్రాన్ని
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం లేకపోయినా, సందర్భంలో చర్చలో ఉన్న ధర్మశాస్త్రాన్ని సూచిస్తుంది; తెలుగులో కర్మవిభక్తితో సహజంగా ఉంటుంది.
- source_word: δίκαιοι
  choice: నీతిమంతులు
  rationale: దేవుని తీర్పులో సరైనవారిగా ఉండే స్థితిని తెలిపే, రోమీయులకు పత్రికలోని సంబంధిత పదజాలంతో అనుసంధానం నిలిపే ప్రామాణిక తెలుగు పదం.
- source_word: παρὰ τῷ θεῷ
  choice: దేవుని ఎదుట
  rationale: దేవుని దృష్టిలో లేదా ఆయన తీర్పు సమక్షంలో ఉన్న స్థితిని సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ποιηταὶ
  choice: ఆచరించేవారు
  rationale: తెలుగులో ‘చేసేవారు’ కంటే ధర్మశాస్త్రానికి అనుగుణంగా కార్యరూపంలో పెట్టడాన్ని స్పష్టంగా తెలియజేస్తూ, వినేవారితో వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: δικαιωθήσονται
  choice: నీతిమంతులుగా తీర్చబడతారు
  rationale: భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతూ, δικαιόω యొక్క న్యాయతీర్పు భావాన్ని తెలుగులో అర్థవంతంగా వ్యక్తం చేస్తుంది; అది ఎలా జరుగుతుందనే విస్తృత theological ప్రశ్నను ఈ అనువాదం ముందుగానే పరిష్కరించదు.
theological_decisions:
- issue: δικαιωθήσονται అనే క్రియలోని పౌలు ఉపయోగించే న్యాయతీర్పు సంబంధిత భావాన్ని కాపాడటం
  choice: నీతిమంతులుగా తీర్చబడతారు
  alternative: నీతిమంతులని ప్రకటించబడతారు; నిర్దోషులుగా నిరూపించబడతారు
  rationale: ఎంచుకున్న రూపం దేవుని అనుకూల తీర్పు భావాన్ని, భవిష్యత్ కర్మణి రూపాన్ని నిలుపుతుంది. ప్రత్యామ్నాయాలు వరుసగా ప్రకటన లేదా సమర్థన భావాలను మరింత స్పష్టంచేస్తాయి గాని, ప్రధాన పాఠ్యంలో వాటిలో ఒక్కదానికే భావాన్ని పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన వాక్యనిర్మాణం, అయితే ‘ధర్మశాస్త్రం,’ ‘నీతిమంతులు’ వంటి పౌలు సంబంధిత ముఖ్య పదజాలం నిలుపబడింది. ప్రధాన వాక్యంలోని [a] గుర్తు సంబంధిత పాదటిప్పణితో సరిపోలుతుంది.
