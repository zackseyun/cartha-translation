id: ROM.2.7
reference: Romans 2:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῖς μὲν καθ’ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/007.yaml
  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: te
  text: మంచి చేయడంలో పట్టుదలతో మహిమను, గౌరవాన్ని, అక్షయత్వాన్ని వెదికేవారికి నిత్యజీవాన్ని ఇస్తాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: మంచి చేయడంలో పట్టుదలతో కొనసాగుతూ
  rationale: ὑπομονήలోని సహనంతో నిలకడగా కొనసాగడం అనే భావాన్ని, ἔργου ἀγαθοῦలోని మంచి కార్యాచరణను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δόξαν καὶ τιμὴν
  choice: మహిమను, ఘనతను
  rationale: δόξαకు ‘మహిమ’, τιμήకు గౌరవం మరియు విలువను సూచించే ‘ఘనత’ వాడి రెండింటి భేదాన్ని నిలిపింది.
- source_word: ἀφθαρσίαν
  choice: నాశనరహితత్వాన్ని
  rationale: క్షయం లేదా నాశనానికి లోనుకాని స్థితిని సూచించే మూలపద భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: ζωὴν αἰώνιον
  choice: నిత్యజీవాన్ని
  rationale: తెలుగు బైబిలు భాషలో స్థిరపడిన, సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే సమానార్థక ప్రయోగం.
theological_decisions:
- issue: నిత్యజీవం మరియు మంచి చేయడంలో పట్టుదల మధ్య సంబంధం
  choice: వాక్యంలో ఉన్న సంబంధాన్ని యథాతథంగా ఉంచి, దాన్ని సంపాదనగా గానీ కేవలం సాక్ష్యంగా గానీ వివరించలేదు.
  alternative: ‘మంచి పనుల ద్వారా నిత్యజీవాన్ని సంపాదించేవారు’ లేదా ‘విశ్వాసానికి రుజువుగా మంచి చేసేవారు’ అని వ్యాఖ్యానాత్మకంగా విస్తరించడం.
  rationale: గ్రీకు వాక్యం నిత్యజీవం ఎవరికి ఇవ్వబడుతుందో చెబుతుంది; ఆ సంబంధానికి అదనపు సిద్ధాంత వివరణను ఈ వచనంలో చేర్చదు.
- issue: వాక్యంలోని పరోక్ష కర్త
  choice: మునుపటి సందర్భంలోని దేవుణ్ణి సూచిస్తూ ‘ఇస్తాడు’ అని సహజ తెలుగులో పూరించింది.
  alternative: క్రియలేని పదబంధంగా ‘...వారికి నిత్యజీవం’ అని ఉంచడం.
  rationale: ఈ వచనం రోమా 2:6లోని ప్రధాన క్రియపై ఆధారపడుతుంది. తెలుగులో స్వతంత్ర వచనంగా చదవడానికి క్రియ అవసరం; కర్తను పేరుతో విస్తరించకుండా సందర్భ సంబంధాన్ని నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని జాబితా క్రమం మరియు సిద్ధాంతపరమైన ఉద్వేగం నిలుపబడ్డాయి.
