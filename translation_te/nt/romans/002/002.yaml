id: ROM.2.2
reference: Romans 2:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: te
  text: ఇలాంటి పనులు చేస్తూ ఉండేవారికి వ్యతిరేకంగా దేవుని తీర్పు సత్యానికి అనుగుణంగా ఉంటుందని మనకు తెలుసు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘సత్యం ప్రకారం’; అంటే దేవుని తీర్పు నిజమైన వాస్తవానికి సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: మనకు తెలుసు
  rationale: οἶδα పరిపూర్ణ రూపంలో ఉన్నా వర్తమాన అర్థాన్ని ఇస్తుంది; సమూహాన్ని సూచించే ‘మనకు తెలుసు’ సహజమైన, నేరుగా ఉన్న అనువాదం.
- source_word: δέ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: δέ ఇక్కడ బలమైన వ్యతిరేకతకన్నా ప్రసంగ కొనసాగింపును సూచిస్తుంది; తెలుగులో వాక్యసందర్భమే ఆ అనుసంధానాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: κρίμα
  choice: తీర్పు
  rationale: ఇది దేవుని న్యాయపరమైన నిర్ణయాన్ని సూచిస్తుంది; ‘శిక్షావిధి’ అని ఫలితానికే పరిమితం చేయకుండా విస్తృత అర్థాన్ని నిలుపుతుంది.
- source_word: κατὰ ἀλήθειαν
  choice: సత్యానికి అనుగుణంగా
  rationale: దేవుని తీర్పు సత్యం లేదా వాస్తవానికి సరిపోతుందని తెలిపే మూలపదబంధాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ἐπὶ
  choice: వ్యతిరేకంగా
  rationale: ప్రతికూల తీర్పుకు లోనయ్యే వ్యక్తులతో వాడిన ἐπί యొక్క న్యాయపరమైన దిశను స్పష్టంగా తెలియజేస్తుంది.
- source_word: τὰ τοιαῦτα
  choice: ఇలాంటి పనులు
  rationale: ముందటి సందర్భంలో చెప్పబడిన ప్రవర్తనలను సూచించే నపుంసక బహువచన పదబంధానికి సహజమైన తెలుగు సమానం.
- source_word: πράσσοντας
  choice: చేస్తూ ఉండేవారు
  rationale: వర్తమాన కృదంతం సూచించే కొనసాగుతున్న లేదా అలవాటైన ప్రవర్తనను ‘చేసేవారు’ కంటే కొంత స్పష్టంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: κατὰ ἀλήθειαν ను కేవలం ‘న్యాయంగా’ అని భావానువాదం చేయాలా, లేక సత్యంతో ఉన్న సంబంధాన్ని స్పష్టంగా ఉంచాలా?
  choice: సత్యానికి అనుగుణంగా
  alternative: న్యాయంగా
  rationale: మూలంలోని ἀλήθεια భావాన్ని ప్రత్యక్షంగా నిలిపి, దేవుని తీర్పు నిజమైన వాస్తవానికి సరిపోతుందనే భావాన్ని సంకుచితం చేయకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. న్యాయపరమైన భావాన్ని నిలుపుతూ, సాధారణ పాఠకులకు అర్థమయ్యే పదాలను ఉపయోగించాం.
