  source_fidelity: 'The draft accurately conveys every major element of the Greek: the present-sense οἴδαμεν (''మనకు తెలుసు''), God''s κρίμα (''దేవుని తీర్పు''), κατὰ ἀλήθειαν (''సత్యానికి అనుగుణంగా''), the adverse direction of ἐπί (''వ్యతిరేకంగా''), and the characteristic conduct indicated by πράσσοντας (''చేస్తూ ఉండేవారు''). The implicit treatment of δέ is acceptable in idiomatic Telugu, where the discourse continuation is naturally carried by context.'
