id: ROM.2.19
reference: Romans 2:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πέποιθάς τε σεαυτὸν ὁδηγὸν εἶναι τυφλῶν, φῶς τῶν ἐν σκότει,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/019.yaml
  text: And you are convinced that you yourself are a guide to the blind, a light to those in darkness,
translation:
  language: te
  text: అలాగే, నీవు నిన్ను గుడ్డివారికి మార్గదర్శినని, చీకటిలో ఉన్నవారికి వెలుగునని నిశ్చయంగా నమ్ముతున్నావు;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθάς
  choice: నిశ్చయంగా నమ్ముతున్నావు
  rationale: పరిపూర్ణ కాలరూపం స్థిరపడిన నమ్మకస్థితిని సూచిస్తుంది. సందర్భంలోని ఆత్మవిశ్వాసాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: τε
  choice: అంతేకాక
  rationale: ముందటి వచనంలోని వరుస వాదనలకు ఈ మాటను అనుసంధానిస్తుంది; ఇక్కడ కొనసాగింపుతో పాటు మరొక స్వీయవాదాన్ని చేర్చే భావం ఉంది.
- source_word: σεαυτὸν
  choice: నీవే
  rationale: ఆత్మవాచక సర్వనామంలోని నొక్కిచెప్పే భావాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
- source_word: ὁδηγὸν
  choice: మార్గదర్శి
  rationale: ఇతరులకు దారి చూపే వ్యక్తి అనే రూపకార్థాన్ని స్పష్టంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: τυφλῶν
  choice: గుడ్డివారికి
  rationale: ὁδηγόν‌తో ఉన్న సంబంధాన్ని తెలుగులో సహజమైన చతుర్థీ విభక్తితో వ్యక్తపరుస్తుంది; మూలంలోని ప్రతినిధి వర్గార్థాన్ని నిలుపుతుంది.
- source_word: φῶς
  choice: వెలుగు
  rationale: దారి చూపడం లేదా జ్ఞానోదయం కలిగించడం అనే రూపకాన్ని సహజంగా నిలుపుతుంది.
- source_word: τῶν ἐν σκότει
  choice: చీకటిలో ఉన్నవారికి
  rationale: వ్యక్తులను సూచించే గ్రీకు పదబంధాన్ని స్పష్టంగా వ్యక్తపరుస్తూ చీకటి అనే రూపకాన్ని యథాతథంగా ఉంచుతుంది.
theological_decisions:
- issue: ఈ స్వీయవర్ణన నిజమని ధృవీకరించబడుతోందా లేక వ్యంగ్యంగా ప్రశ్నించబడుతోందా
  choice: వాక్యాన్ని సంబోధిత వ్యక్తి యొక్క స్థిరమైన స్వీయనమ్మకంగా అనువదించడం
  alternative: పౌలు దానిని నేరుగా నిజమని సమర్థిస్తున్నట్లు అనువదించడం
  rationale: πέποιθας మరియు σεαυτόν ప్రధానంగా ఆ వ్యక్తి తన గురించి నమ్ముతున్నదాన్ని తెలియజేస్తాయి. విస్తృత సందర్భంలో విమర్శాత్మక ఉద్రిక్తత ఉన్నా, ఈ అర్ధవాక్యంలోనే దానిని స్పష్టమైన వ్యంగ్యంగా మార్చకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సహజమైనప్పటికీ గౌరవప్రదమైన శైలి. గ్రీకు వాక్యం తదుపరి వచనంలో కొనసాగుతున్నందున చివరలో అర్ధవిరామం ఉంచబడింది. ఎలాంటి పాదటిప్పణి సూచికలు అవసరం లేదు.
