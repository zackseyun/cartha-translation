review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the settled self-confidence of πέποιθάς and retains both metaphors. However, నీవే can imply an exclusive sense (“you alone”) beyond the reflexive σεαυτόν, and the repeated nీవు structure is less direct than the Greek construction.
  naturalness: The wording is understandable modern Telugu, but using నిన్ను with the two complementary predicates is more idiomatic and makes the reflexive relationship explicit. అలాగే provides a natural, restrained continuation for τε.
  terminology: మార్గదర్శి, గుడ్డివారు, వెలుగు, and చీకటిలో ఉన్నవారు are suitable modern-standard Telugu renderings and preserve the metaphors without interpretive expansion.
  issues:
  - severity: medium
    issue: నీవే may introduce exclusivity.
    rationale: σεαυτόν is reflexive and emphatic in context (“yourself”), but it does not inherently mean “you alone.” Rendering it with నిన్ను preserves the reflexive force without adding exclusivity.
  - severity: low
    issue: అంతేకాక is somewhat stronger than τε.
    rationale: The particle is a simple connective in this clause. అలాగే maintains the continuation without suggesting a stronger additional inference.
  revised_text: అలాగే, నీవు నిన్ను గుడ్డివారికి మార్గదర్శినని, చీకటిలో ఉన్నవారికి వెలుగునని నిశ్చయంగా నమ్ముతున్నావు;
  revised_footnotes: []
