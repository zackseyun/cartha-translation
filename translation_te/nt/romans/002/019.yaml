revisions:
- from: అంతేకాక, నీవే గుడ్డివారికి మార్గదర్శివని, చీకటిలో ఉన్నవారికి వెలుగువని నీవు నిశ్చయంగా నమ్ముతున్నావు;
  to: అలాగే, నీవు నిన్ను గుడ్డివారికి మార్గదర్శినని, చీకటిలో ఉన్నవారికి వెలుగునని నిశ్చయంగా నమ్ముతున్నావు;
  rationale: The revision explicitly represents the reflexive σεαυτόν with నిన్ను, avoids the potentially exclusive nuance of నీవే, and uses a lighter connective for τε. The semicolon is retained because the Greek sentence continues into the following verse.
  reviewer_model: gpt-5.6-terra
