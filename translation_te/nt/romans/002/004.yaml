    text: ‘దయ’ అని వచ్చిన రెండు చోట్లా ‘మంచితనం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  revision_rationale: The revision makes ‘riches’ apply jointly to God's kindness, forbearance, and patience, retains the lexical consistency of ‘దయ,’ uses modern ‘దీర్ఘసహనం,’ and expresses ἀγνοῶν as a dependent ‘not knowing’ clause. The footnote remains anchored at the first occurrence and explicitly covers both occurrences.
