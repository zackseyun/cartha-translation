id: ROM.2.4
reference: Romans 2:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: te
  text: లేదా ఆయన దయ, సహనం, దీర్ఘసహనం అనే సంపదను నీవు తృణీకరిస్తున్నావా?[a] దేవుని దయ నిన్ను పశ్చాత్తాపానికి నడిపిస్తోందని తెలియకుండానే?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘దయ’ అని వచ్చిన రెండు చోట్లా ‘మంచితనం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πλούτου
  choice: దయాసంపదను
  rationale: ‘సంపద’ మూలంలోని సమృద్ధి రూపకాన్ని నిలుపుతుంది; తెలుగులో సహజత్వం కోసం ‘దయ’తో సమాసంగా వాడబడింది.
- source_word: χρηστότητος / τὸ χρηστόν
  choice: దయ / దేవుని దయ
  rationale: ఈ సందర్భంలోని అనుగ్రహపూర్వక, సంబంధాత్మక మేలును ‘దయ’ సహజంగా తెలియజేస్తుంది; రెండు ప్రయోగాల్లోనూ పదసామ్యాన్ని నిలుపుతుంది.
- source_word: ἀνοχῆς
  choice: సహనం
  rationale: తీర్పును వెంటనే అమలు చేయకుండా ఓర్చుకోవడాన్ని స్పష్టంగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: μακροθυμίας
  choice: దీర్ఘశాంతం
  rationale: ἀνοχήతో ఉన్న భేదాన్ని కాపాడుతూ, చాలాకాలం కోపాన్ని అదుపులో ఉంచే ఓర్పును సూచిస్తుంది.
- source_word: καταφρονεῖς
  choice: తృణీకరిస్తున్నావా
  rationale: కేవలం నిర్లక్ష్యం చేయడం కాక, తక్కువగా ఎంచి అలక్ష్యం చేసే క్రియ యొక్క గట్టి మందలింపు భావాన్ని నిలుపుతుంది.
- source_word: ἀγνοῶν
  choice: నీకు తెలియదా
  rationale: గ్రీకు వర్తమాన కృదంతంలోని ‘తెలియక’ అనే భావాన్ని తెలుగులో సహజమైన ప్రశ్నగా వ్యక్తం చేస్తుంది; ఉద్దేశపూర్వక విస్మరణను అనవసరంగా చేర్చదు.
- source_word: εἰς μετάνοιάν
  choice: పశ్చాత్తాపం వైపు
  rationale: εἰς యొక్క దిశాసూచక భావాన్ని కాపాడుతూ, μετάνοιαను స్థిరమైన తెలుగు బైబిలు-నైతిక పదమైన ‘పశ్చాత్తాపం’గా అందిస్తుంది.
- source_word: ἄγει
  choice: నడిపిస్తోంది
  rationale: వర్తమానకాలంలో కొనసాగుతున్న దేవుని కార్యాన్ని, బలవంతపు ఫలితంగా కాక దిశగా నడిపించే చర్యగా చూపుతుంది.
theological_decisions:
- issue: χρηστότης / χρηστόνను ‘దయ’గా లేదా విస్తృతమైన ‘మంచితనం’గా అనువదించడం
  choice: రెండు చోట్లా ‘దయ’
  alternative: రెండు చోట్లా ‘మంచితనం’
  rationale: పాపి పట్ల దేవుడు తీర్పును వాయిదా వేసి అనుగ్రహపూర్వకంగా వ్యవహరించే సంబంధాత్మక భావం సందర్భంలో ప్రధానంగా ఉంది; అయితే విస్తృతమైన ‘మంచితనం’ అర్థం కూడా సాధ్యమే కాబట్టి పాదసూచికలో ఉంచబడింది.
- issue: εἰς μετάνοιάνతో ἄγει దేవుని కార్యం తప్పనిసరిగా పశ్చాత్తాప ఫలితాన్ని కలిగిస్తుందా
  choice: ‘పశ్చాత్తాపం వైపు నడిపిస్తోంది’ అని దిశను తెలిపే విధంగా అనువదించబడింది
  alternative: ‘పశ్చాత్తాపానికి తీసుకువస్తోంది’
  rationale: εἰς దిశను, ἄγει నడిపించే చర్యను తెలియజేస్తాయి; వాక్యం ఫలితం తప్పనిసరిగా సంభవిస్తుందని స్పష్టంగా చెప్పదు. అందువల్ల ఆ ఉద్రిక్తతను పరిష్కరించకుండా ఉంచబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, నేరుగా మందలించే శైలి వాడబడింది. ‘సహనం’ మరియు ‘దీర్ఘశాంతం’ ద్వారా ἀνοχή, μακροθυμία మధ్యనున్న భావభేదం సాధ్యమైనంతవరకు నిలుపబడింది. పాదసూచిక సూచికను సంబంధిత వాక్యాంతంలో ఉంచాం.
