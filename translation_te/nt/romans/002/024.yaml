  rationale: The revision makes the Greek Scripture-introduction formula καθὼς γέγραπται explicit as ‘వ్రాయబడి ఉన్నట్లుగా,’ while retaining the source order and the draft’s accurate renderings of the key terms. Footnote anchors remain present and correctly attached; the lexical and cross-reference notes are retained with minor wording improvements.
