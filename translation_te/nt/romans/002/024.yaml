review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the causal force of γάρ, the causal διά with the accusative, the present passive βλασφημεῖται, and ἔθνη as ‘అన్యజనులు’ in this context. However, ‘అని రాసి ఉంది’ does not explicitly convey καθώς (‘as/just as’), and its placement after a fully quoted clause can make the sentence read primarily as a statement about what has been written rather than preserving the Greek comparison formula.
  naturalness: The language is generally modern and clear. Recasting the Scripture formula as ‘వ్రాయబడి ఉన్నట్లుగా’ is both idiomatic in a biblical register and makes the syntactic relationship explicit. ‘ప్రతిధ్వనిస్తున్నాడు’ is more natural than the causative ‘ప్రతిధ్వనింపజేస్తున్నాడు’ in the cross-reference note.
  terminology: ‘దేవుని పేరు,’ ‘అన్యజనుల మధ్య,’ and ‘దూషించబడుతోంది’ are appropriate, accurate modern-standard Telugu renderings. The lexical alternative is better stated as ‘దేశాల మధ్య,’ which directly reflects the alternative ‘among the nations.’
  issues:
  - severity: medium
    issue: The comparative force of καθώς is not explicit.
    rationale: The Greek concludes καθὼς γέγραπται, ‘just/as it is written.’ The draft’s ‘అని రాసి ఉంది’ represents γέγραπται but leaves out the ‘as/just as’ relationship. The revision restores it without over-specifying the cited Scripture.
  - severity: low
    issue: Cross-reference footnote wording is slightly unnatural.
    rationale: ‘పౌలు లేఖనాన్ని ప్రతిధ్వనింపజేస్తున్నాడు’ is causative in form; ‘పౌలు లేఖనాన్ని ప్రతిధ్వనిస్తున్నాడు’ naturally expresses that Paul is echoing Scripture.
