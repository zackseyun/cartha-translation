id: ROM.2.24
reference: Romans 2:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τὸ γὰρ ὄνομα τοῦ θεοῦ δι’ ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: te
  text: ఎందుకంటే, వ్రాయబడి ఉన్నట్లుగా, మీ కారణంగా దేవుని పేరు అన్యజనుల మధ్య దూషించబడుతోంది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “దేశాల మధ్య.”'
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ పౌలు లేఖనాన్ని ప్రతిధ్వనిస్తున్నాడు; ముఖ్యంగా యెషయా 52:5ను చూడండి. యెహెజ్కేలు 36:20–23లో కూడా ఇదే ఇతివృత్తం కనిపిస్తుంది.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందున్న గద్దింపుకు కారణాన్ని వివరిస్తున్న అనుసంధానాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: దేవుని పేరు
  rationale: గ్రీకు పదబంధాన్ని నేరుగా నిలుపుతుంది; ‘పేరు’లో కీర్తి లేదా ప్రతిష్ఠ భావం ఉండగలిగినా దానిని వివరణాత్మకంగా మార్చలేదు.
- source_word: δι’ ὑμᾶς
  choice: మీ కారణంగా
  rationale: accusativeతో వచ్చిన διά ఇక్కడ కారణాన్ని సూచిస్తుంది; పౌలు చేస్తున్న నిందను స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: βλασφημεῖται
  choice: దూషించబడుతోంది
  rationale: వర్తమానకాల కర్మణి రూపాన్ని నిలుపుతూ, దేవుని గురించి అవమానకరంగా మాట్లాడే బలమైన భావాన్ని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: అన్యజనుల మధ్య
  rationale: రోమీయులకు రాసిన పత్రికలోని యూదులు–అన్యజనుల సందర్భంలో ἔθνη ప్రధానంగా యూదేతర ప్రజలను సూచిస్తుంది.
- source_word: καθὼς γέγραπται
  choice: అని రాసి ఉంది
  rationale: లేఖన ఉదాహరణను పరిచయం చేసే సూత్రవాక్యాన్ని సహజమైన తెలుగులో అందిస్తుంది; καθώςలోని అనురూప భావం ఉల్లేఖన నిర్మాణంలో వ్యక్తమవుతుంది.
theological_decisions:
- issue: ἔθνη యొక్క సందర్భార్థం
  choice: అన్యజనులు
  alternative: జనాలు / దేశాలు
  rationale: ఈ సందర్భంలో యూదులకు భిన్నమైన ప్రజలనే పౌలు ఉద్దేశిస్తున్నట్లు బలంగా కనిపిస్తుంది; అయినా మూలపదానికి ‘జనాలు/దేశాలు’ అనే విస్తృత అర్థం సాధ్యమని పాదటిప్పణిలో నిలిపాం.
- issue: పాత నిబంధన ప్రతిధ్వని యొక్క పరిధి
  choice: యెషయా 52:5ను ప్రధాన ప్రతిధ్వనిగా, యెహెజ్కేలు 36:20–23ను సంబంధిత ఇతివృత్తంగా సూచించడం
  alternative: ఇది యెషయా 52:5కు మాత్రమే ఖచ్చితమైన ప్రత్యక్ష ఉల్లేఖనం అని చెప్పడం
  rationale: పదబంధం యెషయా 52:5తో ప్రత్యేకంగా దగ్గరగా ఉన్నప్పటికీ, దేవుని పేరు జనాల మధ్య అపవిత్రపరచబడే అంశం యెహెజ్కేలు 36లోనూ ప్రతిధ్వనిస్తుంది; మూలాన్ని అతిగా సంకుచితం చేయకుండా ఈ సంబంధాన్ని సూచించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలిని ఉపయోగించాం. మూలంలోని లేఖన-ఉల్లేఖన స్వరూపాన్ని చూపేందుకు ఉద్ధరణ చిహ్నాలు వాడాం; రెండు పాదటిప్పణి సూచికలూ ప్రధాన వచనంలో చేర్చాం.
