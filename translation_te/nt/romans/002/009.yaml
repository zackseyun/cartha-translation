id: ROM.2.9
reference: Romans 2:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: te
  text: చెడు చేసేవాడైన ప్రతి మనిషి ప్రాణంపై శ్రమా సంకటమూ కలుగుతాయి—మొదట యూదునికి, అలాగే గ్రీకువానికి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλῖψις
  choice: శ్రమ
  rationale: తీవ్రమైన కష్టం లేదా బాధ అనే భావాన్ని సహజమైన, గంభీరమైన తెలుగులో తెలియజేస్తుంది; στενοχωρίαకు వేరే పదం వాడి జంటలోని భావతేడాను నిలుపుతుంది.
- source_word: στενοχωρία
  choice: వేదన
  rationale: ఇరుకులో చిక్కుకున్నట్లున్న అంతరంగ బాధను సూచిస్తూ, θλῖψιςతో సహజంగా జతకడుతుంది.
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: ప్రతి మనిషి ప్రాణం మీద
  rationale: ψυχή యొక్క స్పష్టమైన ‘ప్రాణం’ రూపకాన్ని నిలుపుతూ, ἀνθρώπουను సమస్త మానవులకు వర్తించేలా ‘మనిషి’గా అందిస్తుంది.
- source_word: τοῦ κατεργαζομένου τὸ κακόν
  choice: చెడు చేసే
  rationale: కర్తృవాచక వర్తమాన కృదంతాన్ని సంక్షిప్తంగా, సహజంగా అందిస్తుంది; నిరంతర అలవాటు అనే భావాన్ని అనవసరంగా బలపరచదు.
- source_word: Ἰουδαίου
  choice: యూదునికి
  rationale: రోమీయుల పత్రికలోని జాతి-మత సంబంధమైన యూదు/గ్రీకు వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: Ἕλληνος
  choice: గ్రీకువానికి
  rationale: ‘అన్యజనుడు’ అని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా పౌలు వాడిన యూదు/గ్రీకు జంటను యథాతథంగా నిలుపుతుంది.
- source_word: πρῶτον
  choice: మొదట
  rationale: ప్రాధాన్యత లేదా క్రమాన్ని అదనపు వివరణ లేకుండా నేరుగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: గ్రీకు మూలంలో క్రియ స్పష్టంగా లేకపోవడం
  choice: కలుగుతాయి
  alternative: క్రియను చేర్చకుండా ‘శ్రమ, వేదన ... మీద’ అని ఉంచడం
  rationale: తెలుగులో వాక్యం సంపూర్ణంగా, సహజంగా ఉండేందుకు తీర్పు సందర్భానికి తగిన భవిష్యదర్థక విధేయాన్ని సరఫరా చేస్తుంది; కొత్త సిద్ధాంతార్థాన్ని చేర్చదు.
- issue: ψυχήను రూపక సహితంగా అనువదించాలా, వ్యక్తి అని భావానువాదం చేయాలా
  choice: ప్రాణం
  alternative: వ్యక్తి / మనిషి
  rationale: మూలంలోని ‘ప్రతి మనిషి ప్రాణం’ అనే గంభీరమైన నిర్మాణాన్ని నిలుపుతుంది; సందర్భంలో ఇది సంపూర్ణ వ్యక్తిని సూచించగలదనే భావాన్ని నిరాకరించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన కానీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని సంక్షిప్త తీర్పు ప్రకటనను, యూదు/గ్రీకు జంటను, ‘ప్రాణం’ అనే రూపకాన్ని నిలుపుకుంది.
