revisions:
- from: చెడు చేసే ప్రతి మనిషి ప్రాణం మీద శ్రమ, వేదన కలుగుతాయి—మొదట యూదునికి, అలాగే గ్రీకువానికి[a].
  to: చెడు చేసేవాడైన ప్రతి మనిషి ప్రాణంపై శ్రమా సంకటమూ కలుగుతాయి—మొదట యూదునికి, అలాగే గ్రీకువానికి.
  rationale: The revision keeps the source order and scope while improving the semantic distinction in the θλῖψις/στενοχωρία pair and smoothing the Telugu. It retains the contextual future sense without treating it as an explicit Greek verb, and it preserves the Jew/Greek terminology without denominational or interpretive expansion.
  reviewer_model: gpt-5.6-terra
