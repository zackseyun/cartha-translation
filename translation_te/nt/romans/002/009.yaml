review_pass:
  verdict: revise
  source_fidelity: The draft preserves the judgment consequence, the comprehensive scope ('every human soul'), the evil-doing participle, and the Jew/Greek ordering. The supplied future predicate is appropriate in Telugu given the immediate context. However, στενοχωρία is better represented by 'సంకటం' than by the broader 'వేదన,' retaining the pressure/constriction nuance and distinction from θλῖψις.
  naturalness: '''ప్రాణం మీద'' is understandable but less idiomatic in this solemn construction than ''ప్రాణంపై.'' The paired expression ''శ్రమా సంకటమూ'' is natural, concise, and suitably elevated in modern standard Telugu.'
  terminology: '''యూదునికి'' and ''గ్రీకువానికి'' accurately retain the ethnic-religious contrast without interpretively replacing Greek with ''Gentile.'' ''ప్రాణం'' appropriately maintains the ψυχή imagery without importing a technical doctrinal sense. The explanatory footnote about Greek/non-Jew is not needed in the Telugu text and its tentative wording (''అర్థం కావచ్చు'') is weaker than the contextual lexical sense.'
  issues:
  - severity: low
    issue: The rendering 'వేదన' for στενοχωρία weakens the specific sense of distress/anguish under constriction and overlaps substantially with 'శ్రమ.'
    rationale: Using 'సంకటం' better conveys the second member of the Greek pair while retaining a clear distinction from θλῖψις.
  - severity: low
    issue: The phrase 'ప్రాణం మీద' is somewhat less formal and idiomatic here.
    rationale: '''ప్రాణంపై'' is the standard compact literary form and suits the verse''s solemn register.'
  - severity: low
    issue: The footnote is unnecessary and uses tentative language for a contextual explanation that the translation itself does not require.
    rationale: The text faithfully renders Ἕλληνος as 'గ్రీకువానికి'; removing the note avoids adding an interpretive gloss.
  revised_text: చెడు చేసేవాడైన ప్రతి మనిషి ప్రాణంపై శ్రమా సంకటమూ కలుగుతాయి—మొదట యూదునికి, అలాగే గ్రీకువానికి.
  revised_footnotes: []
  revision_rationale: The revision keeps the source order and scope while improving the semantic distinction in the θλῖψις/στενοχωρία pair and smoothing the Telugu. It retains the contextual future sense without treating it as an explicit Greek verb, and it preserves the Jew/Greek terminology without denominational or interpretive expansion.
