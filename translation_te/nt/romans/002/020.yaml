id: ROM.2.20
reference: Romans 2:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: παιδευτὴν ἀφρόνων, διδάσκαλον νηπίων, ἔχοντα τὴν μόρφωσιν τῆς γνώσεως καὶ τῆς ἀληθείας ἐν τῷ νόμῳ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: te
  text: బుద్ధిహీనులకు శిక్షకుడవని, పసిపిల్లలకు బోధకుడవని, ధర్మశాస్త్రంలో జ్ఞానానికీ సత్యానికీ రూపాన్ని కలిగియున్నవాడవని నమ్ముకొని ఉన్న నీవు—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδευτὴν
  choice: శిక్షకుడు
  rationale: బోధించడం, శిక్షణ ఇవ్వడం అనే భావాలను కలిగిన παιδευτήςను ఇది సహజంగా వ్యక్తపరుస్తుంది; శిక్ష విధించే అర్థాన్ని అనవసరంగా ముందుకు తేవదు.
- source_word: ἀφρόνων
  choice: బుద్ధిహీనులు
  rationale: వివేకం లేనివారు అనే మూలభావాన్నీ, వక్త మాటల్లోని తక్కువచూపు ధోరణినీ నిలుపుతుంది.
- source_word: διδάσκαλον
  choice: బోధకుడు
  rationale: διδάσκαλος అనే సాధారణ ‘teacher’ భావానికి స్పష్టమైన, ప్రస్తుత తెలుగు పదం.
- source_word: νηπίων
  choice: పసిపిల్లలు
  rationale: νήπιος యొక్క అక్షరార్థమైన చిన్నపిల్లల రూపకాన్ని, దానిలోని అల్పపరిపక్వత సూచనను నిలుపుతుంది.
- source_word: ἔχοντα
  choice: నీకు ఉందని భావిస్తున్న
  rationale: ἔχοντα అక్షరార్థంగా ‘కలిగియున్న’ అయినప్పటికీ, 17వ వచనం నుంచి సాగుతున్న స్వీయదావాల వాక్యనిర్మాణాన్ని తెలుగులో సహజంగా అనుసంధానించేందుకు ‘నీకు ఉందని భావిస్తున్న’ అని ఇచ్చాం; ‘భావిస్తున్న’ అనేది సందర్భసూచితమైనది.
- source_word: μόρφωσιν
  choice: స్వరూపం
  rationale: μόρφωσιςలోని రూపం, మూర్తీకరణ, నిర్దిష్ట వ్యక్తీకరణ అనే అర్థవ్యాప్తిని ‘స్వరూపం’ సహజంగా నిలుపుతుంది; ‘సారాంశం’ వంటి అర్థనిర్ణయాన్ని జోడించదు.
- source_word: γνώσεως καὶ τῆς ἀληθείας
  choice: జ్ఞానసత్యాల
  rationale: రెండు సమానాంతర నామాలను సంక్షిప్తమైన తెలుగు సమాసంతో వ్యక్తపరుస్తుంది; జ్ఞానం మరియు సత్యం రెండింటినీ ప్రత్యేక భావాలుగానే నిలుపుతుంది.
- source_word: ἐν τῷ νόμῳ
  choice: ధర్మశాస్త్రంలో
  rationale: ఇక్కడ νόμος యూదుల ధర్మశాస్త్రాన్ని సూచిస్తుంది; ‘లో’ అనే స్థానార్థక సంబంధాన్ని కాపాడుతుంది.
theological_decisions:
- issue: μόρφωσις అనేది నిజమైన మూర్తీకరణనా, బాహ్యరూపం మాత్రమేనా
  choice: స్వరూపం
  alternative: రూపం / మూర్తీకరణ
  rationale: పదం రెండువైపుల అర్థసంభావ్యతను కలిగి ఉంది. ఈ వచనంలో వ్యంగ్యమో కేవలం బాహ్యరూపమో అని ముందే తీర్మానించకుండా ‘స్వరూపం’ ఆ ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనా సాధారణ పాఠకులకు సులభమైన శైలి. ఈ భాగం ముందరి వచనాల నుంచి కొనసాగే ద్వితీయ పురుష ఏకవచన ఆరోపణల జాబితా కాబట్టి ‘నీవు’ సంబంధం స్పష్టంగా ఉంచబడింది. చివరి దీర్ఘ విరామ చిహ్నం తదుపరి వచనంతో వాక్యం కొనసాగుతుందని సూచిస్తుంది.
