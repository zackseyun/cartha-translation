id: ROM.2.17
reference: Romans 2:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Εἰ δὲ⸃ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ ⸀νόμῳ καὶ καυχᾶσαι ἐν θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: te
  text: అయితే నీవు నిన్ను యూదుడని పిలుచుకుంటూ,[a] ధర్మశాస్త్రంపై ఆధారపడుతూ,[b] దేవునిలో అతిశయిస్తూ ఉంటే—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘యూదుడనే పేరు కలిగి ఉంటూ’ లేదా ‘యూదుడని పిలువబడుతూ.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ధర్మశాస్త్రంపై విశ్రమిస్తూ.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: అయితే … ఉంటే
  rationale: δέ యొక్క స్వల్పమైన వ్యతిరేక/కొనసాగింపు భావాన్ని ‘అయితే’ తెలియజేస్తుంది; εἰ యొక్క షరతు భావాన్ని వాక్యాంతంలోని ‘ఉంటే’ సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: Ἰουδαῖος
  choice: యూదుడు
  rationale: రోమీయులకు రాసిన పత్రికలో ఇది ప్రధానంగా భౌగోళిక గుర్తింపు కంటే జాతి-మత గుర్తింపును సూచిస్తుంది.
- source_word: ἐπονομάζῃ
  choice: నిన్ను యూదుడని పిలుచుకుంటూ
  rationale: మధ్యమ వాచ్యంలోని స్వీయ designation/claim భావాన్ని సహజంగా, పౌలు వాదనలోని సూటి తీవ్రతతో వ్యక్తం చేస్తుంది.
- source_word: ἐπαναπαύῃ
  choice: ధర్మశాస్త్రంపై ఆధారపడుతూ
  rationale: భౌతికంగా విశ్రాంతి తీసుకోవడం కాక, ధర్మశాస్త్రంపై నమ్మకం లేదా భరోసా ఉంచడాన్ని సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: νόμῳ
  choice: ధర్మశాస్త్రం
  rationale: ఇక్కడ పౌలు మోషే ధర్మశాస్త్రాన్ని గుర్తింపుపొందిన నిబంధనా వ్యవస్థగా ఉద్దేశిస్తున్నందున ఆధునిక తెలుగు బైబిలు వాడుకలో స్పష్టమైన పదాన్ని ఎంచుకున్నాం.
- source_word: καυχᾶσαι
  choice: అతిశయిస్తూ
  rationale: పౌలు వాడే గర్వించడం/ఘనత చెప్పుకోవడం అనే నైతిక తీవ్రతను నిలుపుతూ, ‘ἐν θεῷ’తో సహజంగా కలుస్తుంది.
- source_word: ἐν θεῷ
  choice: దేవునిలో
  rationale: ἐν అనే విభక్తి సంబంధాన్ని నేరుగా నిలుపుతుంది; ‘దేవుని గురించి’ అని మార్చి సంబంధంలోని ఉద్దేశపూర్వక అస్పష్టతను తొలగించదు.
theological_decisions:
- issue: ‘దేవునిలో అతిశయించడం’ సానుకూలమా, వ్యంగ్యంగా విమర్శించబడుతున్నదా?
  choice: దేవునిలో అతిశయిస్తూ
  alternative: దేవుని గురించి గొప్పగా చెప్పుకుంటూ
  rationale: మూలంలోని ἐν θεῷ సంబంధాన్ని, అలాగే సందర్భంలో అది నిజమైన విశ్వాసమా లేక ప్రత్యేక హోదాపై గర్వమా అనే ఉద్రిక్తతను ముందుగానే పరిష్కరించకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం తరువాతి వాక్యభాగాలపై ఆధారపడే షరతు ఉపవాక్యం కావడంతో చివర దీర్ఘవిరామం ఉంచబడింది. పాదసూచిక గుర్తులు వాటికి సంబంధించిన పదబంధాల వెంటనే అమర్చబడ్డాయి.
