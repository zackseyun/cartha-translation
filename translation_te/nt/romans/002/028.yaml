id: ROM.2.28
reference: Romans 2:28
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν, οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: te
  text: ఎందుకంటే, బాహ్యంగా కనిపించే యూదుడే యూదుడు కాదు[a]; శరీరంలో బాహ్యంగా కనిపించే సున్నతే సున్నతి కాదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “బాహ్యంగా/కనిపించేదానిలో.” ఇది బయటికి కనిపించే గుర్తింపు లేదా స్థితిని సూచిస్తుంది.
    reason: lexical_alternative
  - marker: b
    text: “శరీరంలో” అనేది ఇక్కడ భౌతిక సున్నతిని సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: యూదుడు
  rationale: ఇక్కడ భౌగోళికంగా యూదయ ప్రాంతానికి చెందినవాడనే భావం కంటే, ఇశ్రాయేలు నిబంధన సమాజానికి చెందిన గుర్తింపే సందర్భానికి సరిపోతుంది.
- source_word: ἐν τῷ φανερῷ
  choice: పైకి కనిపించే
  rationale: తరువాతి వచనంలోని అంతరంగ వాస్తవానికి విరుద్ధంగా, బాహ్యంగా కనిపించే స్థితిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: περιτομή
  choice: సున్నతి
  rationale: చర్చలో ఉన్న నిబంధన సూచకమైన circumcisionకు ఇది ప్రామాణికమైన, సాధారణంగా అర్థమయ్యే తెలుగు పదం.
- source_word: ἐν σαρκί
  choice: శరీరంలో
  rationale: ఇక్కడ σάρξ రూపకాలంకారంగా కాక భౌతిక శరీరాన్ని సూచిస్తుంది; 'శరీరంలో' అనేది ఆ అర్థాన్ని సహజంగా, స్పష్టంగా ఇస్తుంది.
- source_word: οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή
  choice: శరీరంలో పైకి కనిపించే సున్నతి కూడా సున్నతి కాదు
  rationale: గ్రీకులోని సంక్షిప్తమైన వాక్యనిర్మాణాన్ని తెలుగులో అవసరమైనంత మాత్రమే పూరిస్తూ, కేవలం బాహ్యమైన శారీరక సున్నతి నిజమైన సున్నతిని పూర్తిగా నిర్వచించదనే నిరాకరణను నిలుపుతుంది.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ముందటి వాదనకు ఈ వచనం ఇచ్చే వివరణాత్మక సంబంధాన్ని సహజమైన తెలుగులో చూపుతుంది.
theological_decisions:
- issue: ‘యూదుడు’, ‘సున్నతి’ అనే నిబంధన గుర్తింపుల భావం
  choice: కేవలం బయట కనిపించే గుర్తులు మాత్రమే నిజమైన నిబంధన గుర్తింపును నిర్వచించవని వాక్యం చెబుతున్నట్లుగా అనువదించడం
  alternative: యూదుల గుర్తింపునే పూర్తిగా నిరాకరించడం లేదా దాని స్థానంలో పూర్తిగా ఆత్మసంబంధమైన కొత్త వర్గాన్ని పెట్టడం
  rationale: ఈ వచనం బాహ్యమైనదానికీ అంతరంగమైనదానికీ మధ్య వ్యత్యాసాన్ని ఉంచుతుంది; యూదుల గుర్తింపనే వర్గాన్ని రద్దు చేస్తున్నట్లు అనువాదం నిర్ణయించకూడదు. 29వ వచనంలో కొనసాగే ఉద్రిక్తతను అలాగే నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. ‘బాహ్యంగా’ కంటే ‘పైకి కనిపించే’ అనే పదబంధం మూలంలోని దృశ్య/బాహ్య భావాన్ని సహజంగా వ్యక్తం చేస్తుంది. రెండో భాగంలో గ్రీకు వాక్యంలోని అంతర్లీన విధేయాన్ని తెలుగులో ‘సున్నతి కాదు’ అని పూరించడం ద్వారా అర్థస్పష్టతను కలిగించి, మూలంలోని వ్యతిరేక సమాంతర నిర్మాణాన్ని నిలిపింది.
