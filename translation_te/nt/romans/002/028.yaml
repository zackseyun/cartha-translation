- from: ఎందుకంటే, పైకి కనిపించేవాడు యూదుడు కాదు[a]; శరీరంలో పైకి కనిపించే సున్నతి కూడా సున్నతి కాదు[b].
  to: ఎందుకంటే, బాహ్యంగా కనిపించే యూదుడే యూదుడు కాదు[a]; శరీరంలో బాహ్యంగా కనిపించే సున్నతే సున్నతి కాదు[b].
  rationale: The correction attaches the external/visible qualifier explicitly to “యూదుడు,” avoiding an unintended claim about a merely visible person. The repeated “...యూదుడే యూదుడు కాదు / ...సున్నతే సున్నతి కాదు” reproduces the Greek’s compact contrast without specifying more than the verse states about the inward counterpart.
