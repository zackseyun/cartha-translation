id: ROM.2.5
reference: Romans 2:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: te
  text: అయితే నీ కాఠిన్యాన్ని, పశ్చాత్తాపపడని హృదయాన్ని బట్టి, ఉగ్రతకూ దేవుని నీతియుక్తమైన తీర్పు వెల్లడికీ దినమైన రోజున నీ కోసం నీవే ఉగ్రతను పోగుచేసుకుంటున్నావు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ δὲ
  choice: అయితే ... బట్టి
  rationale: δέ యొక్క స్వల్ప వ్యతిరేక భావాన్ని ‘అయితే’ తెలియజేస్తుంది; κατά ఇక్కడ వ్యక్తి స్థితికి అనుగుణమైన కారణాన్ని సూచిస్తున్నందున ‘బట్టి’ సహజంగా ఉంటుంది.
- source_word: σκληρότης
  choice: కాఠిన్యం
  rationale: నైతిక స్పందనలేమిని సూచించే ‘గట్టితనం’ అనే మూల రూపకాన్ని నిలుపుతూ, గౌరవప్రదమైన ఆధునిక తెలుగు పదాన్ని ఎంచుకున్నాం.
- source_word: ἀμετανόητον καρδίαν
  choice: పశ్చాత్తాపపడని నీ హృదయం
  rationale: గ్రీకులోని హృదయ భాషను నిలుపుతూ, సాధారణ పాఠకులకు స్పష్టమైన క్రియాత్మక రూపాన్ని వాడాం.
- source_word: θησαυρίζεις
  choice: పోగుచేసుకుంటున్నావు
  rationale: క్రమంగా నిల్వ చేసుకోవడం లేదా కూడబెట్టుకోవడం అనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; సందర్భంలోని ప్రతికూల ఫలితాన్ని కూడా స్పష్టంగా ఉంచుతుంది.
- source_word: σεαυτῷ
  choice: నీ కోసం నీవే
  rationale: ఫలితం ఆ వ్యక్తికే తిరిగి వస్తుందనే reflexive బలాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: ὀργή
  choice: ఉగ్రత
  rationale: సాధారణ కోపం కంటే దైవిక తీర్పు సందర్భంలోని గంభీరమైన, న్యాయనిర్ణయ సంబంధమైన ఆగ్రహాన్ని తెలియజేస్తుంది.
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: ఉగ్రత దినాన, ... బయలుపడే దినాన
  rationale: ἐν ἡμέρᾳ యొక్క కాలార్థాన్ని ‘దినాన’గా అందిస్తూ, ఉగ్రతకూ తీర్పు బయలుపాటుకూ ఉన్న సమన్వయాన్ని పాఠకుడికి స్పష్టంగా ఉంచుతుంది.
- source_word: δικαιοκρισία
  choice: నీతియుక్తమైన తీర్పు
  rationale: దేవుని తీర్పు సరైనది, న్యాయసమ్మతమైనది అనే సమాసపద భావాన్ని నిలుపుతుంది; ‘న్యాయమైన తీర్పు’ను పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చాం.
- source_word: τοῦ θεοῦ
  choice: దేవుని
  rationale: ఆ తీర్పు దేవునిదని స్పష్టంగా తెలిపే సహజమైన తెలుగు సంబంధ రూపం.
theological_decisions:
- issue: కాలవాచక పదబంధాన్ని పూర్తిగా వ్యాఖ్యానాత్మక వాక్యంగా మార్చాలా, లేక గ్రీకు నామవాచక నిర్మాణానికి దగ్గరగా ఉంచాలా?
  choice: ‘ఉగ్రత దినాన, దేవుని నీతియుక్తమైన తీర్పు బయలుపడే దినాన’
  alternative: ‘దేవుని నీతియుక్తమైన తీర్పు బయలుపడే ఉగ్రత దినాన’
  rationale: ప్రత్యామ్నాయం రెండింటినీ ఒకే దినానికి మరింత బిగిగా అనుసంధానిస్తుంది. ఎంచుకున్న రూపం మూలంలోని సమన్వయ నామవాచక నిర్మాణాన్ని సాధ్యమైనంతవరకు ప్రతిబింబిస్తూ తెలుగులో అర్థవంతంగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘కాఠిన్యం,’ ‘ఉగ్రత,’ ‘తీర్పు’ వంటి బైబిలు సందర్భానికి తగిన పదాలను సహజ వాక్యనిర్మాణంతో కలిపాం.
