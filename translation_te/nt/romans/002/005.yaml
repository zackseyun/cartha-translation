revisions:
- from: అయితే నీ కాఠిన్యాన్ని, పశ్చాత్తాపపడని నీ హృదయాన్ని బట్టి, ఉగ్రత దినాన, దేవుని నీతియుక్తమైన తీర్పు[a] బయలుపడే దినాన, నీ కోసం నీవే ఉగ్రతను పోగుచేసుకుంటున్నావు.
  to: అయితే నీ కాఠిన్యాన్ని, పశ్చాత్తాపపడని హృదయాన్ని బట్టి, ఉగ్రతకూ దేవుని నీతియుక్తమైన తీర్పు వెల్లడికీ దినమైన రోజున నీ కోసం నీవే ఉగ్రతను పోగుచేసుకుంటున్నావు.
  rationale: The revision retains the draft’s established lexical choices while recasting the final temporal expression as one day characterized by both wrath and the revelation of God’s righteous judgment. This better reflects the Greek syntax, preserves its nominal form, and avoids implying two separate days.
  reviewer_model: gpt-5.6-terra
