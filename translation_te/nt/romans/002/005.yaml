review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the causal force of κατὰ, the moral metaphor in σκληρότης, the reflexive force of σεαυτῷ, and the judicial sense of ὀργή. However, it renders the single Greek phrase ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ as two separately marked ‘days’ and turns ‘revelation’ into an explicit verbal clause. This unnecessarily obscures the coordinated nominal structure and may suggest two distinct days.
  naturalness: The wording is generally readable modern standard Telugu. ‘నీ కోసం నీవే’ is slightly emphatic but acceptable. A compact construction referring to one day of both wrath and revelation is more natural and more faithful.
  terminology: ‘కాఠిన్యం,’ ‘పశ్చాత్తాపపడని హృదయం,’ ‘ఉగ్రత,’ and ‘నీతియుక్తమైన తీర్పు’ are suitable in this register. ‘వెల్లడి’ appropriately preserves the nominal sense of ἀποκάλυψις without imposing an interpretive finite clause.
  issues:
  - severity: medium
    issue: The temporal phrase is split into two ‘days.’
    rationale: 'The Greek has one ἡμέρᾳ governed by ἐν, followed by coordinated genitives: ‘of wrath and revelation of God’s righteous judgment.’ The draft’s ‘ఉగ్రత దినాన, ... బయలుపడే దినాన’ repeats ‘day’ and can imply two occasions.'
  - severity: medium
    issue: ἀποκαλύψεως is rendered as an interpretive verbal clause.
    rationale: ‘దేవుని ... తీర్పు బయలుపడే’ is contextually reasonable, but the source uses the noun ‘revelation.’ ‘వెల్లడి’ retains the nominal structure and avoids adding an explicit verbal formulation.
  revised_text: అయితే నీ కాఠిన్యాన్ని, పశ్చాత్తాపపడని హృదయాన్ని బట్టి, ఉగ్రతకూ దేవుని నీతియుక్తమైన తీర్పు వెల్లడికీ దినమైన రోజున నీ కోసం నీవే ఉగ్రతను పోగుచేసుకుంటున్నావు.
  revised_footnotes:
