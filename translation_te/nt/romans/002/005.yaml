    text: 'లేదా: ‘దేవుని న్యాయమైన తీర్పు.’'
    reason: δικαιοκρισίαకు ‘నీతియుక్తమైన తీర్పు,’ ‘న్యాయమైన తీర్పు’ రెండూ సముచితమైన అర్థవ్యక్తీకరణలు.
  revision_rationale: The revision retains the draft’s established lexical choices while recasting the final temporal expression as one day characterized by both wrath and the revelation of God’s righteous judgment. This better reflects the Greek syntax, preserves its nominal form, and avoids implying two separate days.
