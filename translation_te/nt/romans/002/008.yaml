id: ROM.2.8
reference: Romans 2:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: te
  text: అయితే స్వార్థపూరిత ఆశయంతో నడుచుకుంటూ[a], సత్యానికి అవిధేయులై, అనీతికి[b] కానీ లోబడేవారికి—ఆగ్రహం, ఉగ్రకోపం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “స్వప్రయోజనం కోరుతూ.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “అన్యాయానికి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: స్వార్థపూరిత ఆశయంతో నడుచుకుంటూ
  rationale: ἐξ అనే మూలం లేదా ప్రేరణ భావాన్ని, ἐριθείαలోని స్వప్రయోజనపూరిత ఆశయాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: సత్యానికి అవిధేయులై
  rationale: ἀπειθέωను కేవలం నమ్మకపోవడంగా కాక, సత్యానికి విధేయత చూపకపోవడంగా ఉన్న నైతిక-సంకల్ప భావంతో అందిస్తుంది.
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: అనీతికి మాత్రం లోబడేవారికి
  rationale: ముందున్న ‘సత్యానికి అవిధేయులై’ అనే మాటకు సమాంతరమైన వ్యతిరేక విధేయతను ‘మాత్రం’ స్పష్టంగా చూపిస్తుంది.
- source_word: ἀδικίᾳ
  choice: అనీతి
  rationale: పౌలు వాడే నైతిక, దేవుని ఎదుటి తప్పుదశ అనే విస్తృత భావాన్ని నిలుపుతుంది; ‘అన్యాయం’ అనే సామాజిక-న్యాయ భావం కూడా సాధ్యమే.
- source_word: ὀργὴ
  choice: ఆగ్రహం
  rationale: ఈ తీర్పు సందర్భంలోని గంభీరమైన కోప భావాన్ని సాధారణ పాఠకునికి స్పష్టంగా తెలియజేస్తుంది.
- source_word: θυμός
  choice: ఉగ్రకోపం
  rationale: ὀργήతో జతగా వచ్చి కోప తీవ్రతను పెంచే పదంగా సహజమైన తెలుగులో భేదాన్ని నిలుపుతుంది.
- source_word: implicit verbal ellipsis
  choice: డాష్ తరువాత క్రియలేని ‘ఆగ్రహం, ఉగ్రకోపం’
  rationale: గ్రీకులో ఫలిత భాగానికి స్పష్టమైన క్రియ లేదు; అదనపు క్రియను చేర్చకుండా దాని సంక్షిప్త గంభీరతను నిలుపుతుంది.
theological_decisions:
- issue: దైవిక తీర్పు సందర్భంలో ἀδικία అనువాదం
  choice: అనీతి
  alternative: అన్యాయం
  rationale: ‘అనీతి’ సత్యానికి వ్యతిరేకమైన నైతిక స్థితి మరియు ప్రవర్తన అనే పౌలు పదప్రయోగంలోని విస్తృత భావాన్ని నిలుపుతుంది; ‘అన్యాయం’ సాధ్యమైనప్పటికీ కొంత సంకుచితంగా వినిపించవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకునికి సులభంగా అర్థమయ్యే శైలి. ‘మాత్రం’ సత్యానికి అవిధేయత మరియు అనీతికి విధేయత మధ్యనున్న వ్యతిరేకతను సహజంగా సూచిస్తుంది; డాష్ గ్రీకు వాక్యంలోని క్రియలేని తీర్పు ప్రకటనను నిలుపుతుంది.
