    issue: “మాత్రం” for δέ
    rationale: “మాత్రం” can imply exclusivity or restriction, which is not expressed by the Greek. The conjunction δέ contrasts allegiance to unrighteousness with disobedience to truth; “కానీ” conveys this directly.
