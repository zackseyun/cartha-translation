id: ROM.2.27
reference: Romans 2:27
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: te
  text: సహజంగా సున్నతి లేనివాడు ధర్మశాస్త్రాన్ని పాటిస్తే, లిఖిత ధర్మశాస్త్రం మరియు సున్నతి కలిగి ఉండి ధర్మశాస్త్రాన్ని అతిక్రమించే నీకు తీర్పు తీరుస్తాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκροβυστία
  choice: సున్నతి లేనివాడు
  rationale: ఈ నామవాచకానికి అక్షరార్థంగా ‘సున్నతి లేకపోవడం’ అని అర్థమైనా, ఇక్కడ అది సున్నతి లేని వ్యక్తిని సూచించే లక్షణార్థక ప్రయోగం. ‘అన్యజనుడు’ అని విస్తరించకుండా వ్యక్తిగత సూచనను నిలుపుతుంది.
- source_word: ἐκ φύσεως
  choice: సహజంగా
  rationale: సున్నతి లేని సహజ స్థితిని సంక్షిప్తంగా, ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘పుట్టుకతో’ అనేది సాధ్యమైనప్పటికీ మూలపాఠంలోని విస్తృత భావాన్ని కొంత కుదిస్తుంది.
- source_word: τελοῦσα
  choice: పాటిస్తే
  rationale: సందర్భంలో ఈ వర్తమాన కృదంతం షరతు భావంతో ధర్మశాస్త్రాన్ని కార్యరూపంలో నెరవేర్చడాన్ని సూచిస్తుంది. ‘పాటిస్తే’ సాధారణ పాఠకునికి స్పష్టంగా ఉంటుంది.
- source_word: νόμον
  choice: ధర్మశాస్త్రం
  rationale: ఈ సందర్భంలో మోషే ధర్మశాస్త్రం అనే నిర్దిష్ట భావాన్ని తెలుగులో స్థిరమైన బైబిలు పదంతో తెలియజేస్తుంది.
- source_word: διὰ γράμματος
  choice: లిఖిత నియమం ఉన్నప్పటికీ
  rationale: γράμμα ధర్మశాస్త్రపు లిఖిత రూపాన్ని సూచిస్తుంది. διὰ ఇక్కడ ఆధారంగా లేదా సాధనంగా కలిగియుండడాన్ని సూచించినా, తెలుగులో నిందకు కారణమైన ప్రయోజనాలు ఉన్నప్పటికీ అతిక్రమిస్తున్న విరోధాభాసాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: περιτομῆς
  choice: సున్నతి
  rationale: నిబంధన గుర్తును నేరుగా, స్థిరంగా సూచించే సాధారణ తెలుగు పదం.
- source_word: παραβάτην νόμου
  choice: ధర్మశాస్త్రాన్ని అతిక్రమించే
  rationale: మూలంలోని νόμος‌తో ఉన్న స్పష్టమైన సంబంధాన్ని నిలుపుతూ, తెలుగులో సహజమైన క్రియాత్మక నిర్మాణాన్ని ఇస్తుంది.
theological_decisions:
- issue: ἀκροβυστίαను జాతిపరంగా ‘అన్యజనుడు’ అని స్పష్టీకరించాలా
  choice: ప్రధాన పాఠంలో ‘సున్నతి లేనివాడు’ అని ఉంచడం
  alternative: అన్యజనుడు
  rationale: విస్తృత సందర్భం యూదులు–అన్యజనుల వ్యత్యాసాన్ని కలిగివున్నా, ఈ వచనం ప్రత్యేకంగా సున్నతి–సున్నతి లేకపోవడం అనే వ్యత్యాసాన్నే చెబుతుంది. అందువల్ల మూలపాఠం చెప్పని జాతిపరమైన పదాన్ని చేర్చలేదు.
- issue: τελοῦσα కృదంతాన్ని కాలార్థకంగా లేదా షరతు భావంతో అనువదించాలా
  choice: ‘పాటిస్తే’ అనే షరతు భావం
  alternative: ధర్మశాస్త్రాన్ని పాటిస్తూ
  rationale: పౌలు వాదనలో ధర్మశాస్త్రాన్ని ఆచరించే సున్నతి లేని వ్యక్తి అనే ఊహాత్మక/షరతు సంబంధం సహజంగా కనిపిస్తుంది; అయినా కృదంతం స్వతహాగా ఈ సంబంధాన్ని పూర్తిగా నిర్దిష్టం చేయదు.
- issue: διὰ γράμματος καὶ περιτομῆς యొక్క సంబంధాన్ని ఎలా వ్యక్తం చేయాలి
  choice: ‘లిఖిత నియమం మరియు సున్నతి ఉన్నప్పటికీ’
  alternative: లిఖిత అక్షరం మరియు సున్నతి ద్వారా
  rationale: διά యొక్క మూల నిర్మాణాన్ని యథాతథంగా ఉంచితే తెలుగులో ధర్మశాస్త్ర అతిక్రమణ లిఖిత నియమం, సున్నతి వల్ల జరిగిందనే అపార్థం కలగవచ్చు. ఈ అనువాదం అవి కలిగిన ప్రయోజనాల మధ్యనే అతిక్రమణ జరుగుతున్న విరోధాభాసాన్ని తెలియజేస్తుంది; ప్రత్యామ్నాయాన్ని పాదటిప్పణిలో ఉంచింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ధర్మశాస్త్రం’, ‘సున్నతి’ వంటి స్థిరమైన బైబిలు పదాలను నిలిపి, గ్రీకు వాక్యంలోని వ్యక్తిగత సంబోధనను ‘నీకు’ ద్వారా కాపాడాం.
