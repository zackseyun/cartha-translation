  source_fidelity: ప్రధాన వాక్యంలోని ‘ఉన్నప్పటికీ’ గ్రీకు διὰ (‘ద్వారా/తో’)ను విరోధార్థక సంధిగా నిర్దిష్టపరుస్తుంది. మూలంలోని వ్యాకరణ సంబంధాన్ని మరింత దగ్గరగా, కానీ సహజంగా, ‘కలిగి ఉండి’తో వ్యక్తం చేయాలి. τελοῦσαకు ‘పాటిస్తే’ సందర్భానుగుణమైన షరతు భావాన్ని సముచితంగా ఇస్తుంది; ἀκροβυστίαను వ్యక్తిని సూచించే ‘సున్నతి లేనివాడు’గా అనువదించడం కూడా సరైనది.
