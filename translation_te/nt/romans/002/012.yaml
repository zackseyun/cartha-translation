id: ROM.2.12
reference: Romans 2:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: te
  text: ఎందుకంటే, ధర్మశాస్త్రం లేకుండా పాపం చేసిన వారందరూ ధర్మశాస్త్రం లేకుండా నశిస్తారు[a]; ధర్మశాస్త్ర పరిధిలో పాపం చేసిన వారందరూ ధర్మశాస్త్రం ద్వారా తీర్పు పొందుతారు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ధర్మశాస్త్రం లేకుండా’ అనే రెండు ప్రయోగాలకు ‘ధర్మశాస్త్రం వెలుపల’ లేదా ‘ధర్మవిరుద్ధంగా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘ధర్మశాస్త్రం ద్వారా’కు ‘ధర్మశాస్త్రం చేత’ అని కూడా అనువదించవచ్చు; ‘ధర్మశాస్త్ర పరిధిలో’కు అక్షరార్థంగా ‘ధర్మశాస్త్రంలో’ అని చెప్పవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: ధర్మశాస్త్రం లేకుండా
  rationale: ఇది కేవలం ‘అధర్మంగా’ ప్రవర్తించడాన్ని కాక, మోషే ధర్మశాస్త్రం లేని స్థితిని సూచిస్తూ ἐν νόμῳతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: ἥμαρτον
  choice: పాపం చేసిన
  rationale: అయోరిస్ట్ క్రియను అతిగా వ్యాఖ్యానించకుండా సహజమైన భూతకాల భావంతో అందిస్తుంది.
- source_word: ἀπολοῦνται
  choice: నశిస్తారు
  rationale: భవిష్యత్ ఫలితాన్ని సహజంగా తెలియజేస్తూ, నాశన స్వరూపం గురించి వాక్యం చెప్పనిదాన్ని సిద్ధాంతపరంగా చేర్చదు.
- source_word: ἐν νόμῳ
  choice: ధర్మశాస్త్ర పరిధిలో
  rationale: అక్షరార్థమైన ‘ధర్మశాస్త్రంలో’ కంటే, ధర్మశాస్త్ర అధికార లేదా న్యాయ పరిధిలో ఉన్న స్థితిని ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: διὰ νόμου
  choice: ధర్మశాస్త్రం ద్వారా
  rationale: διά సూచించే సాధనం లేదా మాధ్యమ భావాన్ని నిలిపి, ἐν νόμῳతో ఉన్న పదప్రయోగ భేదాన్ని కాపాడుతుంది.
- source_word: κριθήσονται
  choice: తీర్పు పొందుతారు
  rationale: ‘దోషులుగా తీర్చబడతారు’ అని ముందే నిర్ణయించకుండా, న్యాయపరమైన తీర్పు భావాన్ని తటస్థంగా ఉంచుతుంది.
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: వారందరూ ... వారందరూ
  rationale: రెండు సమూహాలనూ సమాంతరంగా, సమగ్రంగా సూచించే సహజ తెలుగు నిర్మాణం.
- source_word: γὰρ
  choice: ఎందుకంటే
  rationale: ఈ వాక్యం ముందటి వాదనకు ఆధారాన్ని ఇస్తున్న అనుసంధానాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: νόμος దేనిని సూచిస్తుంది?
  choice: ప్రధానంగా మోషే ధర్మశాస్త్రం; అనువాదంలో ‘ధర్మశాస్త్రం’
  alternative: సాధారణ నైతిక నియమం లేదా చట్టం
  rationale: రోమా 2లో యూదులు–యూదేతరుల మధ్య వ్యత్యాసం మోషే ధర్మశాస్త్రం ఉన్నవారు, లేనివారు అనే సందర్భంలో ఉంది. వివరణాత్మక పదాలను ప్రధాన పాఠ్యంలో చేర్చకుండా ‘ధర్మశాస్త్రం’ ఆ సూచనను నిలుపుతుంది.
- issue: ἀπολοῦνταιలోని నాశన స్వరూపం
  choice: ‘నశిస్తారు’ అని మాత్రమే పేర్కొనడం
  alternative: ‘దోషులుగా తీర్చబడతారు’ లేదా ‘పూర్తిగా నిర్మూలించబడతారు’
  rationale: మూల వాక్యం అంతిమ ఫలితాన్ని చెబుతుంది గాని దాని విధానాన్ని నిర్వచించదు; అందువల్ల శాశ్వత శిక్ష లేదా సంపూర్ణ నిర్మూలన అనే నిర్దిష్ట సిద్ధాంతాన్ని అనువాదంలో చేర్చలేదు.
- issue: κριθήσονται తీర్పా లేక ఖండనా?
  choice: ‘తీర్పు పొందుతారు’
  alternative: ‘దోషులుగా తీర్చబడతారు’
  rationale: κρίνω ఇక్కడ న్యాయపరమైన పరిశీలన లేదా తీర్పును సూచిస్తుంది; ఖండన అంతర్భావమా అన్నది విస్తృత సందర్భానికి వదిలి, పదాన్ని తటస్థంగా అనువదించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనా సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ధర్మశాస్త్ర పరిధిలో’ న్యాయాధికార భావాన్ని సహజంగా తెలియజేస్తుంది. సమాంతర వాక్య నిర్మాణం మూలంలోని వ్యత్యాసాన్ని కాపాడుతుంది; పాదటిప్పణి గుర్తులన్నీ ప్రధాన పాఠ్యంలో ఉన్నాయి.
