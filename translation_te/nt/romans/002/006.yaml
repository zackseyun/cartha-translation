id: ROM.2.6
reference: Romans 2:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ἀποδώσει ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/006.yaml
  text: who will repay each one according to his works[a][b].
translation:
  language: te
  text: ఆయన ప్రతి ఒక్కరికీ వారి వారి క్రియల ప్రకారం ప్రతిదానం చేస్తాడు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “చేతలు.”
    reason: ‘క్రియలు’కు ప్రత్యామ్నాయమైన సహజమైన పదం; గ్రీకు ἔργα యొక్క అర్థాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: ὃς
  choice: ఆయన
  rationale: ఇది ముందరి సందర్భంలోని దేవుణ్ణి సూచించే సంబంధవాచకం. తెలుగు స్వతంత్ర వాక్యభాగంలో సహజంగా ఉండేందుకు గౌరవార్థక సర్వనామం వాడబడింది.
- source_word: ἀποδώσει
  choice: ప్రతిఫలమిస్తాడు
  rationale: న్యాయతీర్పు సందర్భంలో చేసినదానికి తగినదాన్ని తిరిగి ఇవ్వడం లేదా చెల్లించడం అనే భావాన్ని ఇది సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; కేవలం అనుకూలమైన బహుమతి అనే అర్థానికి పరిమితం కాదు.
- source_word: ἑκάστῳ
  choice: ప్రతి ఒక్కరికీ
  rationale: గ్రీకు ఏకవచన దత్తి విభక్తిలోని వ్యక్తిగత, పంపిణీయ భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: κατὰ
  choice: ప్రకారం
  rationale: కొలమానం లేదా ప్రమాణాన్ని సూచించే గ్రీకు ప్రయోగానికి నేరుగా సరిపోతుంది.
- source_word: τὰ ἔργα
  choice: క్రియలు
  rationale: ἔργα కు సాంప్రదాయికంగానూ సహజంగానూ సరిపోయే పదం; పౌలు రచనలలోని పదబంధ అనుసంధానాన్ని నిలుపుతుంది. ఇక్కడ వ్యక్తి చేసిన పనులు/చేతలు అనే భావం.
- source_word: αὐτοῦ
  choice: వారి వారి
  rationale: గ్రీకులో పురుష ఏకవచనం ప్రతినిధి సాధారణార్థంలో ఉంది. ఆధునిక తెలుగులో ‘ప్రతి ఒక్కరికీ వారి వారి’ అనడం లింగభేదం లేకుండా వ్యక్తిగత అన్వయాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: క్రియల ప్రకారం తీర్పు
  choice: ‘క్రియల ప్రకారం ప్రతిఫలమిస్తాడు’ అనే న్యాయపరమైన ప్రతిఫల భావాన్ని యథాతథంగా ఉంచడం
  alternative: ‘వ్యవహరిస్తాడు’ వంటి సాధారణ పదంతో మృదువుగా చెప్పడం లేదా కేవలం ‘బహుమతి ఇస్తాడు’ అని అనుకూల ఫలితానికే పరిమితం చేయడం
  rationale: వచనం ప్రతి వ్యక్తికి వారి క్రియల ప్రకారం తిరిగి ఇవ్వడాన్ని స్పష్టంగా చెబుతుంది. పౌలు చెప్పే నీతిమంతులుగా తీర్చబడడం గురించిన ఇతర భాగాలతో దీనిని అనువాదంలోనే సమన్వయపరచకుండా, అసలు వాక్యంలోని ధార్మిక ఉద్వేగాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరమైన లేఖన శైలి నిలుపబడింది. గ్రీకు ప్రతినిధి పురుష ఏకవచనాన్ని తెలుగులో సహజమైన లింగనిరపేక్ష ‘వారి వారి’గా వ్యక్తపరచినందున దానికి ప్రత్యేక పాదటిప్పణి అవసరం లేదు.
