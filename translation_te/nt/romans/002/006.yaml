- from: ఆయన ప్రతి ఒక్కరికీ వారి వారి క్రియల ప్రకారం ప్రతిఫలమిస్తాడు.[a]
  to: ఆయన ప్రతి ఒక్కరికీ వారి వారి క్రియల ప్రకారం ప్రతిదానం చేస్తాడు.[a]
  rationale: The revision replaces a potentially favorable-only term with ‘ప్రతిదానం చేస్తాడు,’ preserving the source’s unqualified judicial-recompense force. The lexical footnote is simplified to a genuine alternative for ἔργα. The Greek masculine singular αὐτοῦ has representative force; Telugu ‘వారి వారి’ naturally conveys this, so no separate gender footnote is needed.
