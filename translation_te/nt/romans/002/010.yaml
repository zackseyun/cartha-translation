id: ROM.2.10
reference: Romans 2:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: te
  text: అయితే, మేలు చేసేవారందరికీ[a]—మొదట యూదునికి, అలాగే గ్రీకువానికి[b]—మహిమ, ఘనత, సమాధానం కలుగుతాయి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మంచిదాన్ని చేసేవారందరికీ.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “గ్రీకువాడు” అనే పదం విస్తృతంగా యూదేతరుణ్ణి, అంటే అన్యజనుణ్ణి సూచించే అవకాశం ఉంది.
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: మహిమ
  rationale: బహుమానంతో కూడిన ఘనస్థితిని, అంత్యకాల ప్రతిఫల భావాన్ని నిలుపుకునే సహజమైన బైబిలు తెలుగు పదం.
- source_word: τιμή
  choice: ఘనత
  rationale: δόξαతో కలిసి వచ్చే గౌరవార్థక భావాన్ని సహజంగా వ్యక్తం చేస్తుంది; ‘మహిమ’తో అనవసర పునరుక్తిని నివారిస్తుంది.
- source_word: εἰρήνη
  choice: సమాధానం
  rationale: అంతరంగ ప్రశాంతతకే పరిమితం చేయకుండా, సంపూర్ణ క్షేమాన్ని సూచించే విస్తృత బైబిలు భావాన్ని నిలుపుతుంది.
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: చేసేవారందరికీ
  rationale: క్రియలో నిమగ్నమై ఉండే వ్యక్తి లక్షణాన్ని తెలిపే వర్తమాన కృదంత భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ ἀγαθόν
  choice: మేలు
  rationale: ‘మంచిది/మంచిదానిని’ అనే మూలార్థాన్ని ‘చేయు’తో సహజంగా కలిపి, నైతిక మేలును స్పష్టంగా తెలియజేస్తుంది.
- source_word: Ἰουδαίῳ
  choice: యూదునికి
  rationale: మూలంలోని ఏకవచన ప్రతినిధి ప్రయోగాన్ని నేరుగా, సహజంగా నిలుపుతుంది.
- source_word: πρῶτον
  choice: మొదట
  rationale: పౌలు పేర్కొన్న క్రమాన్ని వివరణ జోడించకుండా సంక్షిప్తంగా కాపాడుతుంది.
- source_word: Ἕλληνι
  choice: గ్రీకువానికి
  rationale: ‘యూదుడు–గ్రీకువాడు’ అనే మూలభాష జంటను ప్రధాన పాఠ్యంలో నిలుపుతుంది; విస్తృతమైన యూదేతర భావాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: మునుపటి వచనంలోని ఉగ్రత, వేదనలకు దీనిలోని అనుకూల ప్రతిఫలాన్ని వ్యతిరేకంగా చూపే సంధిని సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: పౌలు వాడిన యూదుడు–గ్రీకువాడు అనే వ్యత్యాసంలో Ἕλληνι అర్థం
  choice: ప్రధాన పాఠ్యంలో ‘గ్రీకువానికి’ అని ఉంచి, విస్తృతమైన ‘యూదేతరుడు’ అనే భావాన్ని పాదసూచికలో తెలిపాం.
  alternative: యూదేతరునికి
  rationale: గ్రీకు పదం అక్షరార్థంగా ‘గ్రీకువాడు’; అయితే రోమీయులకు రాసిన పత్రికలో ఈ జంట సాధారణంగా యూదులు–యూదేతరులు అనే విస్తృత విభజనను సూచిస్తుంది. మూలపదాన్ని నిలుపుతూ దాని భావవ్యాప్తిని పాదసూచికలో ఇవ్వడం అసలైన ఉద్వేగాన్ని కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సామాన్య పాఠకులకు అర్థమయ్యేలా, అదే సమయంలో గంభీరతను నిలుపుతూ అనువదించబడింది. మూలంలోని ప్రతినిధి ఏకవచనాలు ‘యూదునికి’, ‘గ్రీకువానికి’గా ఉంచబడ్డాయి; వాక్యంలోని ప్రతిఫల పదాలకు చివర ‘కలుగుతాయి’ చేర్చి తెలుగు వాక్యనిర్మాణాన్ని సహజం చేశాం.
