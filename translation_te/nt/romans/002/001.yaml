id: ROM.2.1
reference: Romans 2:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: te
  text: కాబట్టి తీర్పు తీర్చే ప్రతి మనిషీ[a], నీకు సాకు లేదు. ఎందుకంటే, నీవు మరొకరిని తీర్పు తీర్చడం ద్వారా నిన్ను నీవే దోషిగా నిర్ధారించుకుంటున్నావు; తీర్పు తీర్చే నీవు కూడా అవే పనులు చేస్తున్నావు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “తీర్పు తీర్చే ప్రతి వ్యక్తీ.” గ్రీకు పదం పురుష ఏకవచనంలో ఉన్నప్పటికీ, ఇక్కడ ప్రతినిధ్యార్థకంగా సమస్త మనుషులకు వర్తిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి వచ్చే నిర్ధారణను సహజమైన ఆధునిక తెలుగులో స్పష్టంగా సూచిస్తుంది.
- source_word: ἀναπολόγητος
  choice: నీకు సాకు లేదు
  rationale: చెల్లుబాటు అయ్యే సమర్థన లేదా ప్రతివాదం లేని న్యాయసంబంధ భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా అందిస్తుంది.
- source_word: ὦ ἄνθρωπε πᾶς ὁ κρίνων
  choice: తీర్పు తీర్చే ప్రతి మనిషీ
  rationale: ఏకవచన ప్రత్యక్ష సంబోధనను, అలాగే πᾶς ద్వారా వ్యక్తమయ్యే సార్వత్రిక వర్తింపును నిలుపుతుంది. ‘మనిషి’ ఇక్కడ ప్రతినిధ్యార్థకంగా ఉంది.
- source_word: ἐν ᾧ κρίνεις τὸν ἕτερον
  choice: నీవు మరొకరికి తీర్పు తీర్చడం ద్వారా
  rationale: ἐν ᾧ లోని సాధనార్థక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; తీర్పు తీర్చే చర్యే స్వదోషనిర్ణయానికి మార్గమవుతుందనే భావాన్ని నిలుపుతుంది.
- source_word: κατακρίνεις
  choice: నిన్ను నీవే దోషిగా తీర్చుకుంటున్నావు
  rationale: సాధారణంగా తీర్పు తీర్చడం కంటే బలమైన, దోషిగా నిర్ధారించే న్యాయపరమైన భావాన్ని తెలియజేస్తుంది.
- source_word: τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων
  choice: తీర్పు తీర్చే నీవు కూడా అవే పనులు చేస్తున్నావు
  rationale: వర్తమానకాలంలోని కొనసాగుతున్న ఆచరణ భావాన్ని ‘చేస్తున్నావు’ ద్వారా అందిస్తూ, సంబోధితునిపై ఉన్న వ్యంగ్యభరిత నిందను నిలుపుతుంది.
theological_decisions:
- issue: పౌలు గద్దింపులో ప్రతినిధ్యార్థక పురుష సంబోధన
  choice: ప్రధాన పాఠ్యంలో ‘ప్రతి మనిషీ’ అని ఉంచడం
  alternative: తీర్పు తీర్చే ప్రతి వ్యక్తీ
  rationale: ἄνθρωπε వ్యాకరణపరంగా పురుష ఏకవచన సంబోధన అయినా సందర్భంలో సమస్త మానవులకు ప్రతినిధ్యార్థకంగా వర్తిస్తుంది. తెలుగు ‘మనిషీ’ మూలంలోని వ్యక్తిగత, గంభీర సంబోధనను నిలుపుతూ విస్తృత వర్తింపును కూడా సహజంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రత్యక్ష గద్దింపు శైలిని ఉపయోగించాం. κρίνεις మరియు κατακρίνεις మధ్య తీవ్రతా భేదాన్ని వరుసగా ‘తీర్పు తీర్చడం’ మరియు ‘దోషిగా తీర్చుకోవడం’తో సూచించాం.
