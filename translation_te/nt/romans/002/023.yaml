id: ROM.2.23
reference: Romans 2:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: te
  text: ధర్మశాస్త్రంలో అతిశయించే నీవు, ధర్మశాస్త్రాన్ని అతిక్రమించడం ద్వారా దేవుణ్ణి అవమానిస్తున్నావా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: ధర్మశాస్త్రంలో
  rationale: గ్రీకు భాషలోని స్థానార్థక నిర్మాణాన్ని నిలుపుతూ, ఈ సందర్భంలో యూదుల ధర్మశాస్త్రాన్ని సహజంగా సూచిస్తుంది.
- source_word: καυχᾶσαι
  choice: అతిశయించే
  rationale: పౌలు వేస్తున్న విమర్శాత్మక ప్రశ్నలోని గర్వం లేదా గొప్పచెప్పుకోవడం అనే భావాన్ని సంక్షిప్తంగా, గంభీరంగా వ్యక్తం చేస్తుంది.
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: ధర్మశాస్త్రాన్ని అతిక్రమించడం ద్వారా
  rationale: παράβασις అనే నామవాచకంలోని హద్దు మీరడం/ఉల్లంఘించడం అనే భావాన్ని ఉంచుతూ, ఆధునిక తెలుగులో సహజంగా ఉంటుంది; రెండవ పురుష ఏకవచన క్రియ వల్ల ఇది సంబోధితుని అతిక్రమణ అని స్పష్టమే.
- source_word: τὸν θεὸν
  choice: దేవుణ్ణి
  rationale: నిర్దిష్టమైన దేవుని సూచనను తెలుగులో సహజమైన కర్మరూపంతో అందిస్తుంది.
- source_word: ἀτιμάζεις
  choice: అవమానిస్తున్నావా
  rationale: గౌరవాన్ని తగ్గించడం అనే గ్రీకు పదార్థాన్ని నిలుపుతూ, అతిశయించడానికి వ్యతిరేకమైన పౌలు ప్రశ్న యొక్క పదును కాపాడుతుంది.
theological_decisions:
- issue: νόμος అనే పదం పౌలు వాదనలో దేనిని సూచిస్తుంది
  choice: ధర్మశాస్త్రం
  alternative: మోషే ధర్మశాస్త్రం
  rationale: సందర్భం యూదుల ధర్మశాస్త్రాన్ని సూచించినా, మూలంలో లేని ‘మోషే’ అనే వివరణను వచనంలో చేర్చకుండా సందర్భానికే స్పష్టతను వదిలివేస్తుంది.
- issue: ప్రశ్న యొక్క నిందారోపణాత్మక స్వరం
  choice: అవమానిస్తున్నావా?
  alternative: అవమానిస్తున్నావు!
  rationale: గ్రీకు ప్రశ్నార్థక రూపాన్ని యథాతథంగా ఉంచి, దానిలో అంతర్లీనంగా ఉన్న నిందారోపణను ప్రకటనగా మార్చకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైన, సులభంగా అర్థమయ్యే శైలి. ‘ధర్మశాస్త్రం’ అనే స్థిరమైన బైబిలు పదాన్ని వాడినా వాక్య నిర్మాణాన్ని సహజంగా ఉంచాం. మూలవచనానికి సంబంధం లేని ఇంగ్లీషు పాదటిప్పణి ఉన్నందున తెలుగు ముసాయిదాలో పాదటిప్పణి చేర్చలేదు.
