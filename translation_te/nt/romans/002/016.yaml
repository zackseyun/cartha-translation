id: ROM.2.16
reference: Romans 2:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: te
  text: నా సువార్త ప్రకారం, దేవుడు మెస్సీయ యేసు[a] ద్వారా మనుషుల రహస్య సంగతులపై తీర్పు తీర్చే రోజున.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “క్రీస్తు యేసు.”'
    reason: Χριστός అనే గ్రీకు బిరుదుకు సంప్రదాయ తెలుగు రూపాంతరాన్ని ప్రత్యామ్నాయంగా అందిస్తుంది.
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: తీర్పుతీర్చే రోజున
  rationale: నిర్దిష్టమైన తీర్పు దినాన్ని సూచించే గ్రీకు కాలనిర్మాణాన్ని సహజమైన తెలుగు సంబంధవాచక నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: κρίνει
  choice: తీర్పుతీర్చే
  rationale: గ్రీకులో వర్తమానకాల రూపం ఉన్నా, అంత్యకాలానికి సంబంధించిన భావాన్ని తెలుగు సందర్భంలో ‘రోజున’తో కలిపిన సంబంధవాచక రూపం సహజంగా తెలియజేస్తుంది.
- source_word: τὰ κρυπτὰ τῶν ἀνθρώπων
  choice: మనుషుల రహస్య విషయాలకు
  rationale: మనుషులకు సంబంధించిన దాచబడిన విషయాలు అనే భావాన్ని, పురుషులకు మాత్రమే పరిమితం చేయకుండా, సహజమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: నా సువార్త ప్రకారం
  rationale: పౌలు ఉపయోగించిన వ్యక్తిగత స్వామ్యాన్ని, అలాగే ప్రమాణం లేదా అనుగుణతను సూచించే κατὰ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: మెస్సీయ యేసు ద్వారా
  rationale: సంబంధ విభక్తితో ఉన్న διά ఇక్కడ మధ్యవర్తిత్వం లేదా కార్యసాధకత్వాన్ని సూచిస్తుంది; Χριστόςను బిరుదుగా ‘మెస్సీయ’ అని అనువదించాం.
theological_decisions:
- issue: Χριστοῦను బిరుదుగా అనువదించాలా, పేరులో భాగంలా లిప్యంతరీకరించాలా
  choice: మెస్సీయ యేసు
  alternative: క్రీస్తు యేసు
  rationale: ఈ సందర్భంలో Χριστόςకు అభిషిక్తుడైన వాగ్దాన రాజు అనే బిరుదు భావం నిలిచి ఉంది; అయితే సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఉంచాం.
- issue: దేవుడు తీర్పు తీర్చడం మరియు యేసు ద్వారా తీర్పు జరగడం మధ్య సంబంధం
  choice: దేవుడు మెస్సీయ యేసు ద్వారా ... తీర్పుతీర్చే
  alternative: మెస్సీయ యేసు ... తీర్పుతీర్చే
  rationale: వాక్యానికి కర్త దేవుడే; διὰ Χριστοῦ Ἰησοῦ యేసును దేవుని తీర్పు జరిగే సాధనంగా లేదా మధ్యవర్తిగా చూపుతుంది. ఈ వ్యాకరణ సంబంధాన్ని మార్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం ముందరి వాక్యంతో వ్యాకరణపరంగా అనుసంధానమై ఉన్నందున, తెలుగులో ఒంటరిగా చదివినప్పటికీ సంబంధం స్పష్టంగా ఉండేందుకు ‘ఇది జరుగుతుంది’ అని చేర్చాం; అది కొత్త సంఘటనను జోడించదు, 2:15లోని సాక్ష్యమిచ్చే కార్యం తీర్పు దినాన వెల్లడవుతుందనే వాక్యసంబంధాన్ని వ్యక్తపరుస్తుంది.
