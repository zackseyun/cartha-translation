  edition: SBLGNT
  text: ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: te
  text: “వ్యభిచారం చేయకూడదు” అని చెప్పే నీవు, వ్యభిచారం చేస్తావా? విగ్రహాలను ఏవగించే నీవు, దేవాలయాలను దోచుకుంటావా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, విస్తృత అర్థంలో, “పవిత్రమైన వాటిపట్ల అపచారం చేస్తావా?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: అని చెప్పే నువ్వే
  rationale: నామవాచకార్థక వర్తమాన కృదంతాన్ని పౌలు నేరుగా సంబోధించే ప్రశ్నగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ‘నువ్వే’ ప్రశ్నలోని ఎదురు నిలిపే బలాన్ని నిలుపుతుంది.
- source_word: μὴ μοιχεύειν
  choice: వ్యభిచారం చేయకూడదు
  rationale: μήతో కూడిన క్రియావాచకం పలికిన నిషేధపు విషయాన్ని సూచిస్తుంది. ఇది ఆధునిక తెలుగులో స్పష్టమైన, సాధారణ నిషేధ రూపం.
- source_word: μοιχεύεις
  choice: వ్యభిచారం చేస్తావా
  rationale: వర్తమాన సూచక క్రియను సాధారణ ఆరోపణాత్మక అలవాటును ప్రశ్నించే రూపంలో అందిస్తుంది.
- source_word: ὁ βδελυσσόμενος
  choice: అసహ్యించుకునే నువ్వే
  rationale: βδελύσσομαιలోని తీవ్రమైన ఏవగింపును సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: τὰ εἴδωλα
  choice: విగ్రహాలను
  rationale: ఈ ఆరాధనా సందర్భంలో εἴδωλα దేవతా ప్రతిమలను, అంటే విగ్రహాలను, సూచిస్తుంది.
- source_word: ἱεροσυλεῖς
  choice: దేవాలయాలను దోచుకుంటావా
  rationale: క్రియ యొక్క నిర్దిష్టమైన ప్రాథమిక భావం దేవాలయాలను లేదా వాటి ఆస్తిని దోచుకోవడం. విగ్రహాల ప్రస్తావనతో ఉన్న వ్యంగ్య విరుద్ధతను ఇది నిలుపుతుంది; విస్తృత భావాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: ἱεροσυλεῖς యొక్క నిర్దిష్ట లేదా విస్తృత భావం
  choice: దేవాలయాలను దోచుకుంటావా
  alternative: పవిత్రమైన వాటిని అపవిత్రపరుస్తావా
  rationale: మూలపదం దేవాలయ దోపిడిని నిర్దిష్టంగా సూచించగలదు, అలాగే పవిత్రతకు భంగం కలిగించడాన్ని విస్తృతంగా సూచించగలదు. సందర్భంలోని విగ్రహాల ప్రస్తావన కారణంగా నిర్దిష్ట భావాన్ని ప్రధాన పాఠ్యంలో ఉంచి, నిజమైన పదార్థ సందిగ్ధతను పాదసూచికలో కాపాడాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో నేరుగా సంబోధించే పౌలు వాదనా శైలిని నిలిపాం. ‘నువ్వే’ అనే రూపం రెండు ప్రశ్నలలోనూ మాటకు, చేతకు మధ్య ఉన్న వైరుధ్యాన్ని సహజంగా బలపరుస్తుంది.
