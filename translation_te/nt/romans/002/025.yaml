  source_fidelity: 'The Telugu accurately represents the conditional structure and all key Greek terms: Περιτομή as “సున్నతి,” νόμον πράσσῃς as “ధర్మశాస్త్రాన్ని ఆచరిస్తే,” παραβάτης νόμου as “ధర్మశాస్త్రాన్ని అతిక్రమించేవాడివైతే,” and the strong perfect-result expression γέγονεν as “మారింది.” The final rhetorical reversal, “నీ సున్నతి సున్నతిలేనితనంగా మారింది,” preserves the concrete covenantal contrast without reducing it to mere loss of status.'
