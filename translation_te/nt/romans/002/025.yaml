id: ROM.2.25
reference: Romans 2:25
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: te
  text: నీవు ధర్మశాస్త్రాన్ని ఆచరిస్తే సున్నతి నిజంగా ప్రయోజనకరమే[a]. కాని నీవు ధర్మశాస్త్రాన్ని అతిక్రమించేవాడివైతే, నీ సున్నతి సున్నతిలేనితనంగా మారింది[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘విలువగలదే.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘నీ సున్నతి సున్నతిలేనితనంగా మారింది’; అంటే, ధర్మశాస్త్రాన్ని అతిక్రమించినప్పుడు నిబంధనకు గుర్తైన సున్నతి తన ప్రయోజనాన్ని కోల్పోతుంది.
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: సున్నతి
  rationale: పౌలు ఉపయోగించిన నిబంధన సంబంధమైన వర్గాన్ని, అలాగే ἀκροβυστίαతో ఉన్న స్పష్టమైన వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: μὲν γὰρ
  choice: నిజంగా
  rationale: తరువాత వచ్చే వ్యత్యాసానికి ముందు ఉన్న అంగీకారపూర్వక ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ὠφελεῖ
  choice: ప్రయోజనకరమే
  rationale: సున్నతికి షరతుతో కూడిన నిజమైన ప్రయోజనం లేదా విలువ ఉందనే భావాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἐὰν νόμον πράσσῃς
  choice: నీవు ధర్మశాస్త్రాన్ని ఆచరిస్తే
  rationale: πράσσωలోని ‘చేయడం/ఆచరించడం’ అనే భావాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంది.
- source_word: παραβάτης νόμου
  choice: ధర్మశాస్త్రాన్ని అతిక్రమించేవాడివైతే
  rationale: νόμοςతో ఉన్న సంబంధాన్ని స్పష్టంగా ఉంచి, παράβατης యొక్క అతిక్రమణ భావాన్ని ప్రత్యక్షంగా తెలియజేస్తుంది.
- source_word: ἡ περιτομή σου
  choice: నీ సున్నతి
  rationale: మూలంలోని ప్రత్యక్ష సంబోధనను, స్వామ్యరూపాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: ἀκροβυστία
  choice: సున్నతిలేనితనం
  rationale: ఇక్కడ శరీరభాగాన్ని కాక సున్నతికి నిబంధన సంబంధమైన వ్యతిరేక స్థితిని సూచిస్తుంది; అందువల్ల ఈ రూపం సమాంతరతను కాపాడుతుంది.
- source_word: γέγονεν
  choice: మారింది
  rationale: పరిపూర్ణ కాలంలోని మార్పు మరియు దాని ఫలితంగా ఏర్పడిన ప్రస్తుత స్థితి రెండింటినీ సందర్భంలో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: చివరి వాక్యభాగం భౌతిక స్థితినే సూచిస్తుందా, లేక నిబంధన సంబంధమైన స్థితిని సూచిస్తుందా?
  choice: ‘నీ సున్నతి సున్నతిలేనితనంగా మారింది’ అనే పౌలు వాడిన స్పష్టమైన వ్యతిరేకతను ప్రధాన పాఠ్యంలో నిలుపడం.
  alternative: ‘నీ సున్నతి సున్నతిలేనితనంగా ఎంచబడుతుంది’ లేదా ‘నీ సున్నతికి విలువ ఉండదు.’
  rationale: γέγονεν కేవలం పరిగణించబడటాన్ని కాక బలమైన అలంకారిక స్థితి-మార్పును వ్యక్తం చేస్తుంది. వివరణాత్మక ప్రత్యామ్నాయాలు భావాన్ని కొంత స్పష్టం చేసినా, గ్రీకు వాక్యంలోని తీవ్రతను తగ్గిస్తాయి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని ఉపయోగించాం. ‘ధర్మశాస్త్రం,’ ‘సున్నతి,’ ‘సున్నతిలేనితనం’ అనే పదాలు పౌలు వాదనలోని నిబంధన సంబంధమైన మరియు అలంకారిక వ్యత్యాసాన్ని నిలుపుతాయి. ప్రతి పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో చేర్చబడింది.
