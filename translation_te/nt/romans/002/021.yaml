id: ROM.2.21
reference: Romans 2:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: te
  text: కాబట్టి, మరొకరికి బోధించే నీవు నిన్ను నీవు బోధించవా? “దొంగతనం చేయవద్దు” అని ప్రకటించే నీవు దొంగతనం చేస్తావా?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందున్న వాదన నుంచి వచ్చే నిర్ధారణాత్మక కొనసాగింపును సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: διδάσκων
  choice: బోధించే
  rationale: కర్తార్థక వర్తమాన కృదంత భావాన్ని సహజమైన సంబంధవాచక నిర్మాణంగా చూపి, వ్యక్తి లక్షణంగా జరుగుతున్న క్రియను నిలుపుతుంది.
- source_word: ἕτερον
  choice: మరొకరికి
  rationale: గ్రీకు ఏకవచనాన్ని నిలుపుతూ, బోధించబడే వ్యక్తిని తెలుగులో సహజంగా చతుర్థీ విభక్తితో వ్యక్తం చేస్తుంది.
- source_word: σεαυτὸν
  choice: నీకు నీవు
  rationale: ఇతరునికి బోధించడం మరియు తనకు తాను బోధించుకోకపోవడం మధ్యనున్న పదునైన వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: οὐ διδάσκεις;
  choice: బోధించుకోవా?
  rationale: నిందార్థక అలంకార ప్రశ్నను ప్రశ్న రూపంలోనే ఉంచుతుంది; ఆత్మనేపద భావాన్ని తెలుగు సహజ ప్రయోగం ద్వారా తెలియజేస్తుంది.
- source_word: κηρύσσων
  choice: ప్రకటించే
  rationale: బహిరంగంగా చాటిచెప్పే భావాన్ని ఇస్తుంది; ఆధునిక వాడుకలో మతసభకు మాత్రమే పరిమితమైన అర్థాన్ని అనవసరంగా రుద్దదు.
- source_word: μὴ κλέπτειν
  choice: “దొంగతనం చేయవద్దు”
  rationale: ప్రకటించబడిన నిషేధాన్ని తెలుగులో సహజమైన ప్రత్యక్ష ఆజ్ఞగా అందిస్తుంది.
- source_word: κλέπτεις;
  choice: దొంగతనం చేస్తావా?
  rationale: పౌలు ఉపయోగించిన సూటి, నిందార్థక వర్తమాన ప్రశ్నను యథాతథంగా నిలుపుతుంది.
theological_decisions: []
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ నేరుగా సంబోధించే శైలి. గ్రీకులోని ఏకవచన ద్వితీయ పురుష సంబోధనను ‘నువ్వు’తో నిలిపి, రెండు సమాంతర అలంకార ప్రశ్నల పదునును కాపాడింది.
