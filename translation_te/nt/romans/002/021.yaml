review_pass:
  verdict: revise
  source_fidelity: The two parallel rhetorical questions, the singular ‘another,’ the reflexive contrast, and the present-tense accusation are retained. A small adjustment makes the reflexive object explicit and avoids reading the first question as merely ‘do you learn for yourself?’
  naturalness: The draft is generally clear modern Telugu. ‘నిన్ను నీవు బోధించవా?’ is more idiomatic and directly mirrors the Greek active construction than ‘నీకు నీవు బోధించుకోవా?’
  terminology: ‘బోధించే,’ ‘ప్రకటించే,’ and ‘దొంగతనం చేయవద్దు’ are accurate, neutral, and appropriate. No theological terminology is at issue.
  issues:
  - severity: low
    issue: The reflexive expression ‘నీకు నీవు బోధించుకోవా?’ can suggest learning/doing something for oneself rather than directly teaching oneself.
    rationale: σεαυτόν is the direct object of διδάσκεις. ‘నిన్ను నీవు బోధించవా?’ explicitly represents that object and preserves the rhetorical rebuke without adding meaning.
  revised_text: కాబట్టి, మరొకరికి బోధించే నీవు నిన్ను నీవు బోధించవా? “దొంగతనం చేయవద్దు” అని ప్రకటించే నీవు దొంగతనం చేస్తావా?
