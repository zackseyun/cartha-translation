id: ROM.2.14
reference: Romans 2:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: te
  text: ఎందుకంటే, ధర్మశాస్త్రం లేని అన్యజనులు[a] స్వభావరీత్యా[b] ధర్మశాస్త్రానికి సంబంధించిన వాటిని[c] చేసినప్పుడల్లా, ధర్మశాస్త్రం లేకపోయినా వారు తమకు తామే ధర్మశాస్త్రంగా ఉంటారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “జాతులు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “సహజ ప్రేరణతో.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “ధర్మశాస్త్రం కోరినదాన్ని చేసినప్పుడల్లా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: అన్యజనులు
  rationale: ఈ సందర్భంలో యూదులకు, మోషే ధర్మశాస్త్రానికి భిన్నంగా ఉన్న ప్రజలను సూచించే పౌలు వాడుకను ఇది స్పష్టంగా తెలియజేస్తుంది; ‘జాతులు’ అనే విస్తృత అర్థాన్ని పాదసూచికలో ఉంచాం.
- source_word: νόμον / νόμου / νόμος
  choice: ధర్మశాస్త్రం
  rationale: సందర్భంలోని మోషే ధర్మశాస్త్ర సూచననూ, చివరి వాక్యభాగంలోని రూపకాలంకార ప్రయోగాన్నీ ఒకే పదంతో నిలిపి, గ్రీకు వాక్యంలోని పదపునరుక్తిని కాపాడుతుంది.
- source_word: φύσει
  choice: స్వభావరీత్యా
  rationale: ఈ పదం సహజ స్వభావం, సహజ స్థితి లేదా అంతర్గత ప్రేరణలో ఏదిని నిర్దిష్టంగా సూచిస్తుందో ముందుగానే తేల్చకుండా గ్రీకు పదంలోని వ్యాఖ్యాన విస్తృతిని నిలుపుతుంది.
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: ధర్మశాస్త్రానికి సంబంధించిన వాటిని చేస్తారు
  rationale: ‘ధర్మశాస్త్రం కోరినదాన్ని చేస్తారు’ అని భావాన్ని పూర్తిగా విప్పకుండా, మూలంలోని ‘ధర్మశాస్త్రానికి చెందినవి’ అనే నిర్మాణాన్ని సహజమైన తెలుగులో సాధ్యమైనంతవరకు నిలుపుతుంది.
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: వారు తమకు తామే ధర్మశాస్త్రంగా ఉంటారు
  rationale: వారు స్వయంగా కొత్త నియమాలను చేసుకుంటారని బలంగా సూచించకుండా, గ్రీకులోని రూపకాలంకార భావాన్నీ దత్తివాచక సంబంధాన్నీ నిలుపుతుంది.
theological_decisions:
- issue: φύσει అనే పదం నైతిక జ్ఞానం, మనస్సాక్షి లేదా సహజ ప్రవర్తనతో ఎలా సంబంధించిందో
  choice: ప్రధాన పాఠ్యంలో ‘స్వభావరీత్యా’ అని విస్తృతంగా ఉంచడం
  alternative: ‘సహజ ప్రేరణతో’ అని మరింత వ్యాఖ్యానాత్మకంగా అనువదించడం
  rationale: ఈ ఒక్క పదం సహజ నైతిక అవగాహన, అలవాటు లేదా సహజ స్థితి అనే వివరణల్లో దేనినీ తప్పనిసరిగా నిర్ధారించదు; అందువల్ల పౌలు వాదనలోని వ్యాఖ్యాన ఉద్వేగాన్ని పరిష్కరించకుండా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలిని వాడాం. ‘ధర్మశాస్త్రం’ అనే పదాన్ని మూడుసార్లూ నిలిపి మూలంలోని పదపునరుక్తి, భావసంబంధం కాపాడాం; వాక్యప్రవాహం కోసం ὅταν నిర్మాణాన్ని ‘చేసినప్పుడల్లా’గా వ్యక్తం చేశాం.
