id: ROM.4.18
reference: Romans 4:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: te
  text: నిరీక్షణకు విరుద్ధంగా[a] ఉన్నప్పటికీ, అతడు నిరీక్షణతో విశ్వసించాడు, తద్వారా అతడు అనేక జనాంగాలకు తండ్రి అయ్యేలా—“నీ సంతానం[b] ఇలాగే ఉంటుంది” అని చెప్పబడిన ప్రకారం.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నిరీక్షణకు అతీతంగా” లేదా “నిరీక్షణకు వ్యతిరేకంగా” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: లేదా “నీ విత్తనం”; ఇది గ్రీకులోని ఏకవచన సమష్టి రూపకాన్ని అక్షరార్థంగా నిలుపుతుంది.
    reason: lexical_alternative
  - marker: c
    text: ఆదికాండము 15:5 నుండి ఉల్లేఖనం; ఆదికాండము 17:5తో పోల్చండి.
    reason: cross_reference
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: నిరీక్షణకు విరుద్ధంగా
  rationale: παρά + accusative సాధారణంగా ఆశించగల పరిస్థితికి విరుద్ధమైన భావాన్ని ఇక్కడ వ్యక్తం చేస్తుంది. ఈ పదబంధం మూలంలోని విరోధాభాసాన్ని నిలుపుతుంది.
- source_word: ἐπ’ ἐλπίδι
  choice: నిరీక్షణతో
  rationale: ముందున్న ‘నిరీక్షణకు విరుద్ధంగా’ అనే మాటతో అలంకారిక వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: ἐπίστευσεν
  choice: విశ్వసించాడు
  rationale: πιστεύω క్రియకు నేరమైన, పౌలు వాడుకతో సరిపడే అనువాదం; అనవసరమైన వ్యాఖ్యానాన్ని చేర్చదు.
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: అతడు ... అయ్యేలా జరిగింది
  rationale: εἰς τό + infinitiveలో ఉన్న ప్రయోజన/ఫలిత ఛాయలను పూర్తిగా ఒక వైపుకు పరిమితం చేయకుండా, విశ్వాసానికి వాగ్దాన ఫలితంతో ఉన్న సంబంధాన్ని తెలుగులో తెలియజేస్తుంది.
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: అనేక జనాలకు తండ్రి
  rationale: ἔθνηను ‘అన్యజనులు’ అని పరిమితం చేయకుండా ఆదికాండంలోని వాగ్దాన నేపథ్యానికి తగిన ‘జనాలు’గా అనువదించింది.
- source_word: κατὰ τὸ εἰρημένον
  choice: చెప్పబడిన ప్రకారం
  rationale: ముందుగా పలికిన, ఇంకా ప్రామాణికంగా నిలిచే వాక్యాన్ని సూచించే perfect passive participle భావాన్ని గంభీరంగా, సహజంగా అందిస్తుంది.
- source_word: Οὕτως ἔσται
  choice: ఇలాగే ఉంటుంది
  rationale: ఉల్లేఖనంలోని భవిష్యత్ వాగ్దానాన్ని ఆధునిక, గౌరవప్రదమైన తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: τὸ σπέρμα σου
  choice: నీ సంతానం
  rationale: σπέρμαలోని ఏకవచన సమష్టి భావాన్ని ‘వారసులు’ కంటే మెరుగ్గా నిలుపుతూ, ‘విత్తనం’ కంటే సందర్భంలో సహజంగా ఉంటుంది.
theological_decisions:
- issue: అబ్రాహాము అనేక ἔθνηలకు తండ్రి అనే వాగ్దాన పరిధి
  choice: ‘అనేక జనాలు’ అని అనువదించడం
  alternative: ‘అనేక అన్యజనులు’ లేదా ‘అనేక ప్రజలు’
  rationale: ఇక్కడ పౌలు ఆదికాండంలోని అబ్రాహాము వాగ్దానాన్ని ప్రతిధ్వనిస్తున్నాడు. ‘అన్యజనులు’ అని అనువదిస్తే యూదులు–అన్యజనులు అనే తరువాతి వ్యత్యాసాన్ని ఈ వాక్యంలో అవసరానికి మించి ప్రవేశపెట్టినట్లవుతుంది.
- issue: εἰς τὸ γενέσθαιలో ప్రయోజనమా ఫలితమా అనే సంబంధం
  choice: ‘అయ్యేలా జరిగింది’ అని, వాగ్దాన ఫలితాన్ని ప్రధానంగా ఉంచడం
  alternative: ‘కావడానికి’ అని ప్రయోజన ఛాయతో అనువదించడం
  rationale: గ్రీకు నిర్మాణం ప్రయోజనం లేదా ఫలితం రెండింటినీ సూచించగలదు. అబ్రాహాము వ్యక్తిగత లక్ష్యమే అతని విశ్వాసానికి కారణమని అనిపించకుండా, వాగ్దానంతో నెరవేరిన ఫలిత సంబంధాన్ని చూపిస్తూ మూలంలోని కొంత విస్తృతిని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని ఉపయోగించింది. ‘నిరీక్షణకు విరుద్ధంగా ... నిరీక్షణతో’ అనే పునరుక్తిని తొలగించకుండా, గ్రీకు వాక్యంలోని ఉద్దేశపూర్వక విరోధాభాసాన్ని నిలిపింది. ఉల్లేఖనానికి స్వల్ప గ్రంథోచిత గంభీరతను ఇచ్చినా ప్రాచీన లేదా అసహజ పదప్రయోగాన్ని నివారించింది.
