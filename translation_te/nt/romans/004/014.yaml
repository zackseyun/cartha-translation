  to: ఎందుకంటే ధర్మశాస్త్రానికి చెందినవారు[a] వారసులైతే, విశ్వాసం శూన్యమైపోయింది[b], వాగ్దానం నిర్వీర్యమైపోయింది[c].
  rationale: The sole main-text revision removes the emphatic suffix -ఏ from the conditional subject, since it can imply exclusivity not present in οἱ ἐκ νόμου. The wording otherwise faithfully preserves Paul’s compact designation of people defined in relation to the law, the inheritance image, and the perfect-result force of κεκένωται and κατήργηται. Footnote a is adjusted to remove the same unwarranted emphasis.
