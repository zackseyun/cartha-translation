source:
  edition: SBLGNT
  text: εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: te
  text: ఎందుకంటే ధర్మశాస్త్రానికి చెందినవారు[a] వారసులైతే, విశ్వాసం శూన్యమైపోయింది[b], వాగ్దానం నిర్వీర్యమైపోయింది[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ధర్మశాస్త్ర సంబంధులు.’
    reason: lexical_alternative
  - marker: b
    text: అక్షరార్థంగా, ‘విశ్వాసం ఖాళీ అయిపోయింది.’
    reason: source_metaphor
  - marker: c
    text: లేదా, ‘వాగ్దానం చెల్లకుండా పోయింది’ లేదా ‘ఫలించకుండా చేయబడింది.’
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: ధర్మశాస్త్రానికి చెందినవారు
  rationale: ἐκ νόμου అనే సంక్షిప్త పౌలు ప్రయోగాన్ని అతిగా ‘ధర్మశాస్త్రాన్ని పాటించేవారు’ అని వివరణాత్మకంగా మార్చకుండా, ధర్మశాస్త్రంతో వారికున్న నిర్వచనాత్మక సంబంధాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: κληρονόμοι
  choice: వారసులు
  rationale: వాగ్దానం, స్వాస్థ్యం అనే సందర్భంలో సహజంగా వినిపించే ప్రామాణిక తెలుగు పదం.
- source_word: κεκένωται
  choice: శూన్యమైపోయింది
  rationale: ‘ఖాళీ చేయబడింది’ అనే మూల రూపకాన్ని సహజమైన తెలుగులో నిలుపుతూ, perfect రూపంలోని కొనసాగుతున్న ఫలితాన్ని ‘-మైపోయింది’ ద్వారా సూచిస్తుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: రోమా 4లో ధర్మశాస్త్రం ద్వారా లభించే వారసత్వానికి విరుద్ధంగా ఉంచబడిన భావాన్ని స్పష్టంగా, స్థిరంగా అందిస్తుంది; ‘నమ్మకం’ కూడా సాధ్యమైనా ఇక్కడ ‘విశ్వాసం’ సందర్భోచితం.
- source_word: κατήργηται
  choice: నిర్వీర్యమైపోయింది
  rationale: వాగ్దానం నాశనమైందని కాక, దాని ప్రభావం లేకుండా చేయబడిందనే భావాన్ని వ్యక్తం చేస్తుంది; perfect రూపం కలిగిన ఫలితస్థితినీ చూపిస్తుంది.
- source_word: ἡ ἐπαγγελία
  choice: వాగ్దానం
  rationale: ముందటి సందర్భంలో చర్చలో ఉన్న నిర్దిష్టమైన వాగ్దానాన్ని సహజంగా సూచిస్తుంది.
theological_decisions:
- issue: ధర్మశాస్త్రంతో సంబంధాన్ని సూచించే οἱ ἐκ νόμου
  choice: ధర్మశాస్త్రానికి చెందినవారు
  alternative: ధర్మశాస్త్రంపై ఆధారపడేవారు; ధర్మశాస్త్రాన్ని పాటించేవారు
  rationale: ఈ పదబంధం ధర్మశాస్త్రంతో నిర్వచించబడిన ప్రజలను సూచిస్తుంది. ప్రధాన పాఠ్యంలో వారి సంబంధాన్ని ‘ఆధారపడటం’ లేదా ‘పాటించడం’గా మాత్రమే నిర్ధారించకుండా మూలంలోని విస్తృతతను నిలిపింది.
- issue: ధర్మశాస్త్రంతో వ్యత్యాసంలో πίστις
  choice: విశ్వాసం
  alternative: నమ్మకం; విశ్వసనీయత
  rationale: ఈ సందర్భంలో వారసత్వం ధర్మశాస్త్రం ద్వారా వస్తుందా, విశ్వాసం ద్వారా వస్తుందా అన్నది పౌలు వాదన. అందువల్ల ‘విశ్వాసం’ సరైన ప్రధాన పాఠ్య ఎంపిక; ‘విశ్వసనీయత’ ఇక్కడ తక్కువ సంభావ్యమైనది.
- issue: κατήργηται యొక్క ప్రభావార్థం
  choice: నిర్వీర్యమైపోయింది
  alternative: చెల్లకుండా పోయింది; ఫలించకుండా చేయబడింది
  rationale: వాగ్దానం పూర్తిగా రద్దయిందని అతిగా చెప్పకుండా, అది ప్రభావరహితమైందనే మూల భావాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరతతో కూడిన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘ధర్మశాస్త్రం,’ ‘విశ్వాసం,’ ‘వాగ్దానం,’ ‘వారసులు’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని ఉంచి, కృత్రిమమైన అక్షరానువాదాన్ని నివారించింది. గ్రీకు వాక్యంలోని కారణసూచక నిర్మాణం, షరతు, రెండు perfect ఫలితస్థితులు నిలుపబడ్డాయి.
