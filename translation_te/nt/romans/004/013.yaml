id: ROM.4.13
reference: Romans 4:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: te
  text: ఎందుకంటే, అబ్రాహాముకుగాని అతని సంతానానికిగాని[a] లోకానికి వారసుడు కావాలనే వాగ్దానం ధర్మశాస్త్రం ద్వారా కలగలేదు; విశ్వాసపు నీతి[b][c][d] ద్వారా కలిగింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘సంతానం’ అనే గ్రీకు పదం ఏకవచనంలో ఉంది; అయితే అది సమష్టిగా ‘వంశస్థులు’ అనే అర్థాన్ని కూడా ఇవ్వగలదు.
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘విశ్వాసం ద్వారా కలిగే నీతి ద్వారా,’ లేదా ‘విశ్వాసం ఆధారమైన నీతి ద్వారా.’
    reason: alternative_reading
  - marker: c
    text: ‘నీతి’ని సందర్భానుసారం ‘న్యాయం’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: d
    text: ‘విశ్వాసం’ అనే పదానికి సందర్భానుసారం ‘నమ్మకం’ లేదా ‘విశ్వసనీయత’ అనే అర్థాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: వాగ్దానం
  rationale: దేవుడు చేసిన వాగ్దానం అనే పౌలు వాడుకలోని భావాన్ని సహజంగా, స్పష్టంగా తెలియజేస్తుంది.
- source_word: σπέρματι
  choice: సంతానం
  rationale: గ్రీకులో ఏకవచన రూపంలో ఉండి సమష్టి అర్థాన్ని కూడా ఇవ్వగల పదానికి తెలుగు ‘సంతానం’ అదే సౌలభ్యాన్ని కలిగిస్తుంది.
- source_word: κληρονόμον ... κόσμου
  choice: లోకానికి వారసుడు
  rationale: వారసత్వ భాషను స్పష్టంగా ఉంచుతూ κόσμος యొక్క విస్తృత పరిధిని కుదించదు.
- source_word: διὰ νόμου
  choice: ధర్మశాస్త్రం ద్వారా
  rationale: పౌలు వాదనలో మోషే ధర్మశాస్త్రాన్ని సహజంగా సూచిస్తుంది; ‘ద్వారా’ సాధనార్థక సంబంధాన్ని నిలుపుతుంది.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: పౌలు రచనల్లో న్యాయస్థాన, సంబంధ, నిబంధన నేపథ్యాలను మోయగల సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో ధర్మశాస్త్రానికి విరుద్ధంగా ఉంచబడిన ప్రధాన భావాన్ని తెలిపే ప్రామాణిక అనువాదం; నమ్మకం లేదా విశ్వసనీయత అనే భావసాధ్యతలను పాదసూచికలో ఉంచాం.
- source_word: διὰ δικαιοσύνης πίστεως
  choice: విశ్వాసానికి సంబంధించిన నీతి ద్వారా
  rationale: గ్రీకు షష్ఠీవిభక్తి సంబంధాన్ని ఒకే విధంగా సిద్ధాంతీకరించకుండా, తెలుగులో అర్థమయ్యేంత స్పష్టతతో దాని సంక్షిప్తతను కాపాడుతుంది.
theological_decisions:
- issue: δικαιοσύνης πίστεως లోని సంబంధం
  choice: విశ్వాసానికి సంబంధించిన నీతి
  alternative: విశ్వాసం ద్వారా కలిగే నీతి; విశ్వాసంపై ఆధారపడిన నీతి
  rationale: గ్రీకు పదబంధం నీతి మరియు విశ్వాసం మధ్య ఖచ్చితమైన సంబంధాన్ని విప్పి చెప్పదు. అందువల్ల దానిని ఒక నిర్దిష్ట సిద్ధాంతార్థానికి పరిమితం చేయకుండా సంబంధాన్ని తెరిచి ఉంచాం.
- issue: వాగ్దానంలోని ఏకవచన కర్త
  choice: అబ్రాహాము లేదా అతని సంతానం ... వారసుడవుతాడు
  alternative: అబ్రాహాము, అతని సంతానం ... వారసులవుతారు
  rationale: మూలంలోని αὐτόν మరియు κληρονόμον ఏకవచనాన్ని నిలుపుతూ, సమష్టి అర్థం కలిగిన ‘సంతానం’తో ఉన్న ఉద్దేశపూర్వక ఉద్వేగాన్ని సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. మూలంలోని ‘గాని ... గాని’ భావాన్ని తెలుగులో సహజమైన ‘లేదా’తో తెలిపాం. ప్రధాన వాక్యంలో గ్రీకు షష్ఠీవిభక్తి సంబంధాన్ని అతిగా పరిష్కరించకుండా ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికల్లో ఇచ్చాం. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
