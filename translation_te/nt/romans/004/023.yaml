  text: It was not written for his sake alone that it was credited to him,[a]
translation:
  language: te
  text: “అది అతనికి లెక్కించబడింది” అని వ్రాయబడింది కేవలం అతని కోసమే కాదు,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరిగణించబడింది,” “జమగా లెక్కించబడింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγράφη
  choice: వ్రాయబడింది
  rationale: మూలంలోని aorist passive రూపాన్ని సహజమైన తెలుగు కర్మణి ప్రయోగంతో అందిస్తూ, వ్రాతపూర్వక లేఖనంతో ఉన్న సంబంధాన్ని నిలుపుతుంది.
- source_word: δὲ
  choice: ప్రత్యేక పదంగా అనువదించలేదు
  rationale: ఇక్కడ δέ వాదనలో ముందుకు సాగే స్వల్ప అనుసంధానాన్ని సూచిస్తుంది. తెలుగు వాక్యప్రవాహంలో ప్రత్యేకంగా ‘అయితే’ చేరిస్తే మూలంలో లేని బలమైన వ్యతిరేక భావం రావచ్చు.
- source_word: δι’ αὐτὸν μόνον
  choice: అతని నిమిత్తం మాత్రమే
  rationale: διά + accusative ఇక్కడ అబ్రాహాము దృష్ట్యా లేదా అతని ప్రయోజనార్థం అనే భావాన్ని ఇస్తుంది; ‘నిమిత్తం’ ఆ విస్తృతిని ఉంచుతుంది.
- source_word: ὅτι
  choice: అని
  rationale: వ్రాయబడిన విషయాన్ని పరిచయం చేసే సహజమైన తెలుగు ఉద్ధరణ సూచకం.
- source_word: ἐλογίσθη
  choice: లెక్కించబడింది
  rationale: λογίζομαι యొక్క లెక్కింపు/ఖాతాలో పరిగణింపు భావాన్ని నిలుపుతూ, నిర్దిష్ట సిద్ధాంత వివరణను అదనంగా చేర్చదు.
- source_word: αὐτῷ
  choice: అతనికి
  rationale: దత్తివిభక్తి భావాన్ని తెలుగు ‘కి’ విభక్తితో నేరుగా, సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: పౌలు నీతీకరణ వాదనలో λογίζομαι అనువాదం
  choice: లెక్కించబడింది
  alternative: జమచేయబడింది; ఎంచబడింది; పరిగణించబడింది
  rationale: ‘లెక్కించబడింది’ లెక్కింపు రూపకాన్ని, కర్మణి నిర్మాణాన్ని కాపాడుతుంది. ‘జమచేయబడింది’ ఖాతా రూపకాన్ని మరింత స్పష్టంగా చేసినా, మూలంలోని విస్తృత అర్థాన్ని అనవసరంగా సంకుచితం చేయవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ముందున్న సందర్భంలోని ‘అది’ దేనిని సూచిస్తుందో ఈ వాక్యం ఉద్దేశపూర్వకంగా వివరించదు; మూలంలోని సందర్భాధీనత అలాగే ఉంచబడింది. తెలుగు సహజ క్రమం కోసం ὅτι-విషయవాక్యాన్ని ప్రధాన క్రియకు ముందు ఉంచాం.
