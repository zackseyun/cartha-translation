source:
  edition: SBLGNT
  text: καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: te
  text: అలాగే, క్రియలతో సంబంధం లేకుండా దేవుడు ఎవరికైతే నీతిని లెక్కిస్తాడో, ఆ మనిషి ధన్యత గురించి దావీదు కూడా చెబుతున్నాడు:[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఆ వ్యక్తి”; గ్రీకులో “ఆ మనిషి” అని ఉన్నా, ఇక్కడ అది ప్రతినిధ్యార్థంలో వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: “లెక్కిస్తాడు” అనే మాటకు “ఖాతాలో జమచేస్తాడు” లేదా “గణిస్తాడు” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: c
    text: “నీతి”కి బదులుగా “న్యాయం” అని కూడా అనువదించవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: καθάπερ
  choice: అలాగే
  rationale: ముందటి వాదనతో దావీదు మాటను పోల్చుతూ అనుసంధానించే భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καὶ
  choice: కూడా
  rationale: దావీదును అదనపు సాక్షిగా చేర్చే సంకలనార్థాన్ని నిలుపుతుంది.
- source_word: λέγει
  choice: చెబుతున్నాడు
  rationale: ఉల్లేఖన సూత్రంలోని వర్తమాన కాలాన్ని నిలుపుతూ, ‘ధన్యతను గురించి’ అనే నిర్మాణంతో సహజంగా సరిపోతుంది.
- source_word: μακαρισμὸν
  choice: ధన్యతను
  rationale: ఆశీర్వదించబడిన స్థితి లేదా అలా ప్రకటించబడటాన్ని సూచించే నామవాచక భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἀνθρώπου
  choice: ఆ మనిషి
  rationale: గ్రీకు ఏకవచన పుంలింగ రూపాన్ని నిలుపుతుంది; సందర్భంలో ఇది ప్రతినిధ్యార్థకంగా ఉంది.
- source_word: λογίζεται
  choice: లెక్కిస్తాడో
  rationale: లెక్కకు చేర్చడం లేదా ఒకరి ఖాతాలో గణించడం అనే రూపకాన్ని సాధారణ తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: δικαιοσύνην
  choice: నీతిని
  rationale: పౌలు వాడుకలోని నైతిక-న్యాయపరమైన విస్తృత భావాన్ని తెలుగులో స్థిరంగా, సహజంగా అందిస్తుంది.
- source_word: χωρὶς ἔργων
  choice: క్రియలు లేకుండానే
  rationale: దేవుని లెక్కింపుకు క్రియలు ఆధారం కావనే వ్యత్యాసాన్ని స్పష్టంగా నిలుపుతుంది.
theological_decisions:
- issue: ἀνθρώπου లోని ప్రతినిధ్య పుంలింగ భాష
  choice: ఆ మనిషి
  alternative: ఆ వ్యక్తి
  rationale: మూలంలోని ఏకవచన పుంలింగ రూపాన్ని ప్రధాన పాఠ్యంలో నిలిపి, అది పురుషులకు మాత్రమే పరిమితం కాదనే ప్రతినిధ్య భావాన్ని పాదటిప్పణిలో స్పష్టం చేశాం.
- issue: పౌలు వాడిన δικαιοσύνη
  choice: నీతి
  alternative: న్యాయం
  rationale: ఈ సందర్భంలో దేవుడు ఒకరికి లెక్కించే స్థితిని ‘నీతి’ సహజంగా తెలియజేస్తుంది; ‘న్యాయం’ అనే అర్థపరిధిని పాదటిప్పణిలో ఉంచి మూలంలోని భావవిస్తృతిని కాపాడాం.
- issue: λογίζεται యొక్క లెక్కింపు రూపకం
  choice: లెక్కిస్తాడు
  alternative: ఖాతాలో జమచేస్తాడు; ఎంచుతాడు
  rationale: ఒకరి విషయంగా నీతిని గణించే భావాన్ని నిలుపుతూ, నిర్దిష్ట సిద్ధాంతపరమైన వివరణను పాఠ్యంలోకి దిగుమతి చేయకుండా ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని పోలిక, దావీదు అదనపు సాక్షిగా రావడం, లెక్కింపు రూపకం, క్రియలకు వేరుగా నీతి లెక్కించబడే ఉద్వేగం అన్నీ నిలుపబడ్డాయి.
