  text: ὃς παρεδόθη διὰ τὰ παραπτώματα ἡμῶν καὶ ἠγέρθη διὰ τὴν δικαίωσιν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/025.yaml
  text: who was handed over because of our trespasses and was raised for our justification[a][b].
translation:
  language: te
  text: ఆయన మన అతిక్రమాల కారణంగా అప్పగించబడ్డాడు; మనం నీతిమంతులమని తీర్పు పొందడానికి లేపబడ్డాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మనం నీతిమంతులమని తీర్పు పొందడం కారణంగా.”
    reason: alternative_reading
  - marker: b
    text: “మనం నీతిమంతులమని తీర్పు పొందడం” అనే మాటను “మనం నిర్దోషులమని తీర్పు పొందడం” లేదా “మనం నీతిమంతులమని ప్రకటించబడడం” అని కూడా వ్యక్తం చేయవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: అప్పగించబడ్డాడు
  rationale: గ్రీకు కర్మణి రూపాన్ని నిలుపుతూ, దేవుడే ఆయనను అప్పగించాడనే సూచనను స్పష్టంగా చేర్చకుండా సహజమైన ఆధునిక తెలుగు వ్యక్తీకరణను ఇస్తుంది.
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: మన అతిక్రమాల కారణంగా
  rationale: διά + ద్వితీయా విభక్తి ఇక్కడ సహజంగా కారణార్థకమైనది; ‘కారణంగా’ ఆ సంబంధాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: παραπτώματα
  choice: అతిక్రమాలు
  rationale: παράπτωμα సూచించే నైతిక హద్దుమీరడం లేదా తప్పిద భావాన్ని ‘పాపాలు’ అనే విస్తృత పదంలో కలిపివేయకుండా తెలియజేస్తుంది.
- source_word: ἠγέρθη
  choice: లేపబడ్డాడు
  rationale: గ్రీకు కర్మణి రూపాన్ని సంక్షిప్తంగా నిలుపుతుంది; సందర్భంలో ఇది మృతులలోనుండి లేపబడటాన్ని సూచిస్తుంది.
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: మనం నీతిమంతులుగా తీర్పు పొందడానికి
  rationale: ప్రధాన పాఠంలో διάను ఉద్దేశం/ఫలితార్థకంగా అనువదించి, పునరుత్థానం విశ్వాసుల నీతినిర్ణయంతో సంబంధించిందనే భావాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది; కారణార్థక అవకాశం పాదసూచికలో నిలుపబడింది.
- source_word: δικαίωσιν
  choice: నీతిమంతులుగా తీర్పు పొందడం
  rationale: δικαίωσις యొక్క న్యాయస్థాన సంబంధమైన భావాన్ని సాధారణ పాఠకులకు అర్థమయ్యేలా తెలియజేస్తూ, కేవలం నైతికంగా మంచివారిగా మారడం అనే భావాన్ని నివారిస్తుంది.
theological_decisions:
- issue: διὰ τὴν δικαίωσιν ἡμῶν అనేది ఉద్దేశం/ఫలితాన్ని (‘మన నీతినిర్ణయం కోసం’) సూచిస్తుందా, లేక కారణాన్ని (‘మన నీతినిర్ణయం కారణంగా’) సూచిస్తుందా?
  choice: మనం నీతిమంతులుగా తీర్పు పొందడానికి
  alternative: మనం నీతిమంతులుగా తీర్పు పొందడం కారణంగా
  rationale: ప్రధాన పాఠం సాధారణంగా స్వీకరించబడిన ఉద్దేశం/ఫలితార్థక అవగాహనను అనుసరిస్తుంది. అయితే గ్రీకు వ్యాకరణంలో కారణార్థక పఠనం సాధ్యమే కాబట్టి దానిని పాదసూచికలో భద్రపరుస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి. ‘అప్పగించబడ్డాడు’, ‘లేపబడ్డాడు’ అనే కర్మణి రూపాలు మూలంలోని ఉద్దేశపూర్వక అస్పష్టతను నిలుపుతాయి. ‘నీతిమంతులుగా తీర్పు పొందడం’ న్యాయస్థాన సంబంధ భావాన్ని సాధారణ పాఠకులకు వివరిస్తుంది.
