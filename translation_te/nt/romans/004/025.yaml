revisions:
- from: ఆయన మన అతిక్రమాల కారణంగా అప్పగించబడ్డాడు; మనం నీతిమంతులుగా తీర్పు పొందడానికి లేపబడ్డాడు.[a][b]
  to: ఆయన మన అతిక్రమాల కారణంగా అప్పగించబడ్డాడు; మనం నీతిమంతులమని తీర్పు పొందడానికి లేపబడ్డాడు.[a][b]
