id: ROM.4.10
reference: Romans 4:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: te
  text: అయితే, అది ఎలా లెక్కించబడింది[a]? అతడు సున్నతి పొందినవాడిగా ఉన్నప్పుడా, లేక సున్నతి పొందనివాడిగా ఉన్నప్పుడా? సున్నతి పొందినవాడిగా ఉన్నప్పుడు కాదు, సున్నతి పొందనివాడిగా ఉన్నప్పుడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “జమచేయబడింది” లేదా “పరిగణించబడింది.”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: అయితే, ... ఎలా
  rationale: πῶς అనే ప్రశ్నార్థక క్రియావిశేషణాన్ని ‘ఎలా’ అని నేరుగా నిలిపి, οὖν యొక్క తార్కిక కొనసాగింపును సహజమైన ‘అయితే’తో వ్యక్తం చేసింది.
- source_word: ἐλογίσθη
  choice: లెక్కించబడింది
  rationale: ఇది λογίζομαι యొక్క కర్మణి రూపం. రోమీయులకు 4లో అబ్రాహాము విశ్వాసం అతనికి నీతిగా లెక్కించబడిందనే సందర్భాన్ని స్పష్టంగా కొనసాగిస్తుంది; అతిగా ఆర్థిక భావాన్ని చేర్చదు.
- source_word: ἐν περιτομῇ ὄντι
  choice: అతడు సున్నతి పొందినప్పుడు
  rationale: గ్రీకులోని ‘సున్నతి స్థితిలో ఉండగా’ అనే భావాన్ని ఆధునిక తెలుగులో సహజమైన కాలసూచక నిర్మాణంతో తెలిపింది.
- source_word: ἐν ἀκροβυστίᾳ
  choice: సున్నతి పొందకముందు
  rationale: ఈ సందర్భంలో అబ్రాహాము ఇంకా సున్నతి పొందని స్థితిని సూచిస్తుంది. ‘సున్నతి లేని స్థితిలో’ అనే పదశః రూపం కంటే ఇది సహజంగా ఉండి, వాదనలోని కాలక్రమాన్ని స్పష్టం చేస్తుంది.
- source_word: οὐκ ... ἀλλ’
  choice: కాదు, ... ఏ
  rationale: గ్రీకు విరుద్ధ నిర్మాణంలోని బలాన్ని తెలుగులో ‘కాదు ... ముందే’ అనే సహజమైన నొక్కిచెప్పే రూపంతో నిలిపింది.
theological_decisions:
- issue: సున్నతి పొందని స్థితిని కాలపరంగా వ్యక్తం చేయడం
  choice: సున్నతి పొందకముందు
  alternative: సున్నతి లేని స్థితిలో
  rationale: అబ్రాహాము సున్నతి పొందడానికి ముందు అతని విశ్వాసం లెక్కించబడిందనే పౌలు వాదనను ఇది సహజంగా తెలియజేస్తుంది. ఇది కొత్త సిద్ధాంతార్థాన్ని చేర్చకుండా సందర్భంలో అంతర్లీనంగా ఉన్న కాల సంబంధాన్ని వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన ప్రశ్నోత్తర శైలిని ఉపయోగించింది. పౌలు వాడిన అలంకారిక ప్రశ్న మరియు ‘కాదు ... ముందే’ అనే బలమైన వ్యత్యాసం నిలిపివేయబడ్డాయి.
