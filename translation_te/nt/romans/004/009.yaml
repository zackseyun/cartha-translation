revisions:
- from: అయితే ఈ ధన్యత సున్నతి పొందినవారికేనా, లేక సున్నతి పొందనివారికి కూడా వర్తిస్తుందా? ఎందుకంటే, “అబ్రాహాము విశ్వాసం అతనికి నీతిగా ఎంచబడింది[a]” అని మనం చెబుతున్నాం.
  to: అయితే ఈ ధన్యస్థితి సున్నతి పొందినవారికేనా, లేక సున్నతి పొందనివారికి కూడా వర్తిస్తుందా? ఎందుకంటే, “అబ్రాహాము విశ్వాసం అతనికి నీతిగా లెక్కించబడింది[a]” అని మనం చెబుతున్నాం.
  rationale: “ఎంచబడింది”ను “లెక్కించబడింది”గా మార్చి ἐλογίσθη యొక్క ‘లెక్కలో చేర్చుట/పరిగణించుట’ భావాన్ని కాపాడాం. “ధన్యస్థితి” ద్వారా μακαρισμός సూచించే ప్రకటించబడిన ధన్యతను స్పష్టపరిచాం. పాదసూచికలోని ప్రత్యామ్నాయాన్ని ‘న్యాయం’గా సరిచేసి, మూల నామవాచకానికి తగిన పదార్థ ప్రత్యామ్నాయాన్ని ఇచ్చాం.
