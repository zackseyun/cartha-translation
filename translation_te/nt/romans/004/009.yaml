id: ROM.4.9
reference: Romans 4:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: te
  text: అయితే ఈ ధన్యస్థితి సున్నతి పొందినవారికేనా, లేక సున్నతి పొందనివారికి కూడా వర్తిస్తుందా? ఎందుకంటే, “అబ్రాహాము విశ్వాసం అతనికి నీతిగా లెక్కించబడింది[a]” అని మనం చెబుతున్నాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయం.”
    reason: δικαιοσύνηకి సందర్భానుసారంగా ‘న్యాయం’ అనే అర్థం కూడా సాధ్యమని సూచించే పదార్థ ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: μακαρισμός
  choice: ధన్యత
  rationale: రోమా 4:6–8లో ప్రకటించిన ధన్యస్థితిని సూచిస్తుంది; ‘ధన్యత’ సహజమైన, గౌరవప్రదమైన తెలుగు పదం.
- source_word: περιτομή
  choice: సున్నతి పొందినవారు
  rationale: గ్రీకు నామవాచకం ఇక్కడ సున్నతి గుర్తుగల ప్రజలను సూచించే లక్షణార్థక ప్రయోగం; వ్యక్తులను స్పష్టంగా తెలిపే రూపం ఎంచుకోబడింది.
- source_word: ἀκροβυστία
  choice: సున్నతి పొందనివారు
  rationale: ఇది కూడా ఒక ప్రజాసమూహాన్ని లక్షణార్థకంగా సూచిస్తుంది; ఎదురుపోలికను తెలుగులో స్పష్టంగా ఉంచుతుంది.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: అబ్రాహాము దేవుణ్ణి నమ్మిన విషయాన్ని తెలిపే సందర్భంలో సాధారణమైన, స్థిరమైన తెలుగు సమానార్థకం.
- source_word: ἐλογίσθη
  choice: ఎంచబడింది
  rationale: λογίζομαιలోని లెక్కించడం లేదా ఖాతాలో చేర్చడం అనే భావాన్ని, అదనపు సిద్ధాంత వివరణ లేకుండా వ్యక్తం చేస్తుంది.
- source_word: δικαιοσύνη
  choice: నీతి
  rationale: పౌలు వాదనలో దేవుని ఎదుట సరైన స్థితిని సూచించడానికి సహజమైన బైబిలు తెలుగు పదం; ‘న్యాయం’ అనే సాధ్యార్థం పాదసూచికలో ఇవ్వబడింది.
- source_word: εἰς δικαιοσύνην
  choice: నీతిగా
  rationale: అబ్రాహాము విశ్వాసం నీతిగా పరిగణించబడిందనే సంబంధాన్ని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: అబ్రాహాము విశ్వాసం మరియు నీతి గురించి పౌలు వాడిన మాటలు
  choice: “అబ్రాహాము విశ్వాసం అతనికి నీతిగా ఎంచబడింది”
  alternative: “అబ్రాహాము విశ్వాసం అతనికి నీతి కోసం జమచేయబడింది”
  rationale: మూలవాక్యంలోని లెక్కింపు భావాన్ని నిలిపి, అది ఎలా పనిచేస్తుందనే విస్తృత సిద్ధాంత వ్యవస్థను వాక్యంలోకి చేర్చకుండా theological tensionను కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలి వాడబడింది. మూలంలోని ప్రశ్నారూపం, ‘కూడా’ అనే విస్తరణ భావం, ఉద్ధరణలోని లెక్కింపు రూపకం నిలుపబడ్డాయి.
