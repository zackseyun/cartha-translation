id: ROM.4.5
reference: Romans 4:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: te
  text: అయితే, పని చేయకుండా భక్తిహీనుణ్ణి నీతిమంతునిగా తీర్చేవానిని నమ్మేవానికి అతని విశ్వాసం నీతిగా లెక్కించబడుతుంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: పని చేయకుండా ... వ్యక్తి
  rationale: గ్రీకు నామవాచకార్థక వర్తమాన కృదంతాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తిని సూచించే నిర్మాణంగా అందిస్తుంది; విశ్వాసంతో ఉన్న వ్యత్యాసాన్ని నిలుపుతుంది, అయితే సమస్త పనినీ ఖండిస్తున్నట్టు అతిగా చెప్పదు.
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: దేవుణ్ణి నమ్మే
  rationale: πιστεύω–πίστις పదబంధ సంబంధాన్ని ‘నమ్మే/విశ్వాసం’ ద్వారా సాధ్యమైనంతవరకు నిలుపుతూ, ἐπί సూచించే ఆధారపడే భావాన్ని సహజ తెలుగులో తెలియజేస్తుంది.
- source_word: τὸν δικαιοῦντα
  choice: నీతిమంతునిగా తీర్చే
  rationale: పౌలు వాదనలోని న్యాయపరమైన, వేదాంతపరమైన బలాన్ని కాపాడుతుంది; δικαιοσύνηతో ఉన్న పదార్థ సంబంధాన్ని కూడా కనిపించేలా ఉంచుతుంది.
- source_word: τὸν ἀσεβῆ
  choice: భక్తిహీనుణ్ణి
  rationale: దేవునిపట్ల భక్తి లేని వ్యక్తిని సూచించే ἀσεβής భావాన్ని సంక్షిప్తంగా, గౌరవప్రదమైన ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: λογίζεται
  choice: ఎంచబడుతుంది
  rationale: ఈ సందర్భంలోని లెక్కింపు లేదా ఖాతాలో చేర్చే రూపకాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది; ‘జమచేయబడుతుంది’ కంటే తక్కువ ఆర్థిక పరిమితి కలిగిన పదం.
- source_word: ἡ πίστις αὐτοῦ
  choice: ఆ వ్యక్తి విశ్వాసం
  rationale: αὐτοῦ యొక్క పురుషలింగ ఏకవచన సూచనను తెలుగులో అపార్థం లేకుండా వ్యక్తం చేస్తూ, πίστιςకు ప్రధాన పదంగా ‘విశ్వాసం’ను నిలుపుతుంది.
- source_word: εἰς δικαιοσύνην
  choice: నీతిగా
  rationale: λογίζομαι ... εἰς అనే నిర్మాణంలో ‘దేనిగా ఎంచబడుతుంది’ అనే ఫలితార్థాన్ని సంక్షిప్తంగా, స్పష్టంగా అందిస్తుంది.
theological_decisions:
- issue: δικαιοῦντα అనే వేదాంతపరంగా ప్రాధాన్యమున్న పదం అనువాదం
  choice: నీతిమంతునిగా తీర్చే
  alternative: నీతిమంతుడని ప్రకటించే
  rationale: దేవుడు భక్తిహీనుణ్ణి నీతిమంతునిగా తీర్చుతాడనే పౌలు ఉద్దేశించిన ఉద్రిక్తతను పరిష్కరించకుండా నిలుపుతుంది. ప్రత్యామ్నాయంలోని ప్రకటనార్థాన్ని పాదసూచికలో ఉంచడం ద్వారా ఏకైక సిద్ధాంతవ్యాఖ్యను ప్రధాన పాఠ్యంలో రుద్దదు.
- issue: πίστις/πιστεύω పదసమూహం అనువాదం
  choice: విశ్వాసం / నమ్మే
  alternative: నమ్మకం / నమ్మకం ఉంచే
  rationale: క్రియ మరియు నామవాచకం మధ్య భావసంబంధాన్ని సహజ తెలుగులో చూపుతుంది. ఈ వచనంలో పని చేయడానికీ నమ్మడానికీ ఉన్న వ్యత్యాసం ‘విశ్వాసం’ను సమర్థిస్తుంది; ‘విశ్వసనీయత’ ఇక్కడ తక్కువ సంభావ్యమైనది.
- issue: λογίζεται మరియు δικαιοσύνη మధ్య సంబంధం
  choice: నీతిగా ఎంచబడుతుంది
  alternative: నీతి ఖాతాలో జమచేయబడుతుంది / న్యాయంగా ఎంచబడుతుంది
  rationale: లెక్కింపు భావాన్ని, నీతి అనే కీలక పౌలు పదాన్ని కాపాడుతూ, నిర్దిష్టమైన ఆరోపణ లేదా ప్రసాదిత నీతి సిద్ధాంతాన్ని పాఠ్యంలో అదనంగా చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పౌలు వాదనకు తగిన గంభీరతతో రూపొందించబడింది. ‘అయితే’ మరియు ‘పని చేయకుండా’ ద్వారా ముందున్న వేతనం–పని వ్యత్యాసంతో అనుసంధానం నిలుపబడింది. మూలంలో ‘దేవుడు’ అనే నామవాచకం ప్రత్యక్షంగా లేకపోయినా, ‘నీతిమంతునిగా తీర్చే వానిని’ అన్న సూచన తెలుగులో అసహజంగా లేదా అస్పష్టంగా ఉండకుండా దాని సూచిత కర్తను ‘దేవుడు’గా వ్యక్తం చేసింది.
