    reason: lexical_alternative
  - marker: b
    text: లేదా, “నీతిమంతుడని ప్రకటించేవానిని.”
    reason: lexical_alternative
  - marker: c
    text: లేదా, “జమ చేయబడుతుంది” లేదా “ఖాతాలో నమోదు చేయబడుతుంది.”
    reason: lexical_alternative
