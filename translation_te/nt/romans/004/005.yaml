revisions:
- from: అయితే, పని చేయకుండా, భక్తిహీనుణ్ణి నీతిమంతునిగా తీర్చే[b] దేవుణ్ణి నమ్మే[a] వ్యక్తి విశ్వాసం నీతిగా[d] ఎంచబడుతుంది[c].
  to: అయితే, పని చేయకుండా భక్తిహీనుణ్ణి నీతిమంతునిగా తీర్చేవానిని నమ్మేవానికి అతని విశ్వాసం నీతిగా లెక్కించబడుతుంది.
  rationale: 'The revision removes the unnecessary explicit naming of God while retaining the Greek referential ambiguity, replaces the weak “ఎంచబడుతుంది” with the accounting expression “లెక్కించబడుతుంది,” and uses a more idiomatic Telugu construction for the two coordinated participles. Footnote d is corrected so that its stated lexical alternative corresponds grammatically to the noun δικαιοσύνη. Footnote anchors should be placed as follows in typesetting: తీర్చేవానిని[b], నమ్మేవానికి[a], నీతిగా[d], లెక్కించబడుతుంది[c].'
