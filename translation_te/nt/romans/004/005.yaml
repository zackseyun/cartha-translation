review_pass:
  verdict: revise
  source_fidelity: The draft communicates the central contrast between not working and believing, and it preserves the accounting/result sense of λογίζεται ... εἰς δικαιοσύνην. However, it explicitly supplies “దేవుణ్ణి,” although the Greek reads “the one who justifies the ungodly” without stating the referent in this verse. The supplied noun is a plausible contextual inference but is not needed in Telugu. “ఎంచబడుతుంది” is also weaker and less exact than the accounting sense of λογίζεται.
  naturalness: 'The proposed sentence is understandable, but “పని చేయకుండా ... వ్యక్తి” is somewhat stiff and the word “వ్యక్తి” is unnecessary. A participial Telugu construction can naturally retain the single referent of both Greek participles: “పని చేయకుండా ... నమ్మేవానికి.”'
  terminology: “భక్తిహీనుడు,” “విశ్వాసం,” and “నీతి” are appropriate. “నీతి” should be retained consistently for δικαιοσύνη. The current note d incorrectly gives the alternative as the adjectival “న్యాయంగా”; the alternative for the noun δικαιοσύνη is “న్యాయం.” “లెక్కించబడుతుంది” better preserves λογίζεται than “ఎంచబడుతుంది.”
  issues:
  - severity: medium
    issue: The main text adds “దేవుణ్ణి.”
    rationale: τὸν δικαιοῦντα τὸν ἀσεβῆ is formally “the one who justifies the ungodly.” Although God is the contextual referent, the source does not name God here; Telugu can remain natural without adding the noun.
  - severity: medium
    issue: “ఎంచబడుతుంది” does not adequately represent λογίζεται.
    rationale: In this context λογίζομαι has a reckoning/counting/crediting sense. “లెక్కించబడుతుంది” preserves that accounting metaphor and the connection with the cited scriptural wording.
  - severity: low
    issue: Footnote d gives “న్యాయంగా” as an alternative for δικαιοσύνη.
    rationale: δικαιοσύνη is a noun. Where “justice” is noted as an alternative, Telugu should use the noun “న్యాయం,” not the adverbial/adjectival form “న్యాయంగా.”
  - severity: low
    issue: “వ్యక్తి” is an unnecessary expansion.
    rationale: The Greek substantival participles refer to one person; Telugu “నమ్మేవానికి” expresses this directly and more idiomatically.
  revised_text: అయితే, పని చేయకుండా భక్తిహీనుణ్ణి నీతిమంతునిగా తీర్చేవానిని నమ్మేవానికి అతని విశ్వాసం నీతిగా లెక్కించబడుతుంది.
