id: ROM.4.3
reference: Romans 4:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: te
  text: ఎందుకంటే లేఖనం ఏమి చెబుతోంది? “అబ్రాహాము దేవుణ్ణి నమ్మాడు; అది అతనికి నీతిగా[b] లెక్కించబడింది[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా ‘అతనికి నీతిగా పరిగణించబడింది’ లేదా ‘అతనికి నీతిగా జమ చేయబడింది.’
    reason: lexical_alternative
  - marker: b
    text: లేదా ‘న్యాయంగా.’
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: లేఖనం
  rationale: పౌలు వాడుకలో ఇది సాధారణ రచనను కాక పవిత్ర లేఖనాన్ని సూచిస్తుంది. ‘లేఖనం’ సంక్షిప్తంగా, సహజంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: Ἐπίστευσεν
  choice: నమ్మాడు
  rationale: πιστεύω అనే క్రియకు ఇక్కడ నేరమైన, సహజమైన సమానార్థకం. సందర్భంలో లేని అదనపు వివరణను చేర్చదు.
- source_word: τῷ θεῷ
  choice: దేవుణ్ణి
  rationale: πιστεύωతో వచ్చిన దత్తివిభక్తి ఇక్కడ దేవుడు చెప్పిన మాటను అబ్రాహాము నమ్మాడనే భావాన్ని ఇస్తుంది. అందువల్ల ‘దేవునిలో విశ్వాసముంచాడు’ కంటే ‘దేవుణ్ణి నమ్మాడు’ మూల నిర్మాణానికి మరింత సమీపం.
- source_word: ἐλογίσθη
  choice: లెక్కించబడింది
  rationale: క్రియలోని కర్మణి ప్రయోగాన్ని నిలుపుతూ, λογίζομαι యొక్క లెక్కలో చేర్చడం లేదా ఒక స్థితిగా పరిగణించడం అనే భావాన్ని ఆధునిక తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: εἰς δικαιοσύνην
  choice: నీతిగా
  rationale: ఈ పౌలు సందర్భంలో δικαιοσύνη యొక్క నీతి, దేవుని ఎదుట సరైన స్థితి అనే విస్తృత భావాన్ని ‘నీతిగా’ సహజంగా నిలుపుతుంది. ‘న్యాయంగా’ అనే నిఘంటు ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
theological_decisions:
- issue: పౌలు సమర్థింపు సందర్భంలో δικαιοσύνη అనువాదం
  choice: నీతి
  alternative: న్యాయం
  rationale: ‘నీతి’ అనే పదం ఈ సందర్భంలోని నైతిక, సంబంధపరమైన, దేవుని తీర్పుకు సంబంధించిన భావసాంద్రతను అనవసరంగా ఒకే దిశలో పరిమితం చేయకుండా నిలుపుతుంది. ‘న్యాయం’ సాధ్యమైన నిఘంటు అర్థమే అయినా, ఇక్కడ ప్రధాన పాఠ్యంలో అది భావాన్ని న్యాయపరమైన కోణానికే కుదించే అవకాశం ఉంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలి వాడబడింది. ఉద్ధరణలోని δέ తెలుగులో ప్రత్యేక విరోధార్థకం అవసరం లేని సందర్భసంధాన పదంగా భావించి, సహజ ప్రవాహం కోసం విరామచిహ్నంతో వ్యక్తం చేయబడింది. పాదసూచిక గుర్తులు సంబంధిత పదబంధాల వెంట ఉంచబడ్డాయి.
