id: ROM.4.12
reference: Romans 4:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: te
  text: సున్నతి పొందినవారికి కూడా తండ్రిగా ఉండేలా—కేవలం సున్నతి పొందినవారికే కాక, మన తండ్రి అబ్రాహాము సున్నతి పొందని స్థితిలో కలిగిన విశ్వాసపు అడుగుజాడల్లో నడిచేవారికి కూడా తండ్రిగా ఉండేలా.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సున్నతికి తండ్రిగా—సున్నతికి చెందినవారికి మాత్రమే కాక, ... అడుగుజాడల్లో నడిచేవారికి కూడా.”
    reason: మూలంలోని సంక్షిప్త నిర్మాణాన్నీ, ‘సున్నతికి తండ్రి’ అనే అక్షరార్థ రూపాన్నీ చూపించడానికి.
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: సున్నతివారికి తండ్రి
  rationale: అక్షరార్థంగా ‘సున్నతికి తండ్రి’ అని ఉన్నా, సందర్భంలో ఆ ఆచారానికే తండ్రి అని కాక సున్నతి పొందిన ప్రజలకు తండ్రి అని భావం. ఆధునిక తెలుగులో ఈ రూపం సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: కేవలం సున్నతి పొందినవారికి మాత్రమే కాక
  rationale: ‘సున్నతికి చెందినవారు మాత్రమే కాదు’ అనే మూల నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తపరుస్తూ, బాహ్య సున్నతి ఒక్కటే సరిపోదన్న వ్యత్యాసాన్ని నిలుపుతుంది.
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: అడుగుజాడల్లో నడిచేవారు
  rationale: క్రమంగా అడుగులు వేస్తూ అనుసరించడం అనే στοιχέω భావాన్నీ, ἴχνηలోని అడుగుజాడల రూపకాన్నీ కలిపి నిలుపుతుంది.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో అబ్రాహాము దేవుని నమ్మిన ప్రతిస్పందనను సూచిస్తుంది; ‘విశ్వసనీయత’ కంటే ‘విశ్వాసం’ పౌలు వాదనకు సరిపోతుంది.
- source_word: ἐν ἀκροβυστίᾳ
  choice: సున్నతి పొందకముందు
  rationale: అబ్రాహాము సున్నతి లేని స్థితిలో విశ్వసించిన కాలాన్ని సహజమైన కాలసూచక తెలుగులో తెలియజేస్తుంది.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: మన తండ్రి అబ్రాహాము
  rationale: పౌలు ఉపయోగించిన సమూహ సంబంధ సంబోధనను నేరుగా నిలుపుతుంది.
theological_decisions:
- issue: అబ్రాహాము సున్నతి పొందిన వారందరికీ నిర్బంధం లేకుండా తండ్రా, లేక అతని విశ్వాసపు అడుగుజాడల్లో నడిచే సున్నతివారికే తండ్రా?
  choice: కేవలం సున్నతి పొందడమే కాక అబ్రాహాము విశ్వాసాన్ని అనుసరించే సున్నతివారికి అతడు తండ్రి.
  alternative: సున్నతి పొందిన వారందరికీ అబ్రాహాము ఎటువంటి అర్హత లేకుండా తండ్రి.
  rationale: οὐκ...μόνον ἀλλὰ καί నిర్మాణం సున్నతివారి సమూహాన్ని విశ్వాసపు అడుగుజాడల్లో నడవడం ద్వారా విశేషిస్తుంది. అనువాదం ఈ పరిమితిని వివరణాత్మక సిద్ధాంతభాష చేర్చకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని దీర్ఘ దత్తివ విస్తరణను స్పష్టత కోసం ‘అంటే’తో విప్పినా, సున్నతి మరియు విశ్వాసం మధ్యనున్న వాదనాత్మక ఉద్రిక్తతను అలాగే ఉంచింది.
