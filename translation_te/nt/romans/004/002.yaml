  text: εἰ γὰρ Ἀβραὰμ ἐξ ἔργων ἐδικαιώθη, ἔχει καύχημα· ἀλλ’ οὐ ⸀πρὸς θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/002.yaml
  text: For if Abraham was justified by works[b][a], he has a boast—but not before God.
translation:
  language: te
  text: ఎందుకంటే అబ్రాహాము క్రియల ఆధారంగా నీతిమంతుడిగా తీర్చబడ్డాడైతే[a], అతనికి గర్వించడానికి కారణం ఉంది[b]—కాని దేవుని ఎదుట కాదు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “నీతిమంతుడిగా ప్రకటించబడ్డాడైతే.”'
    reason: lexical_alternative
  - marker: b
    text: 'లేదా: “అతనికి గొప్పగా చెప్పుకోవడానికి ఏదో ఉంది.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ఎందుకంటే, ... అంటే
  rationale: γάρ ముందున్న వాదనతో సంబంధాన్ని ‘ఎందుకంటే’ ద్వారా చూపుతుంది; εἰ యొక్క షరతును సహజమైన ఆధునిక తెలుగు ‘అంటే’ నిర్మాణం నిలుపుతుంది.
- source_word: Ἀβραὰμ
  choice: అబ్రాహాము
  rationale: తెలుగు బైబిలు వాడుకలో స్థిరపడిన వ్యక్తినామ రూపం.
- source_word: ἐξ ἔργων
  choice: క్రియల ఆధారంగా
  rationale: ἐκ సూచించే ఆధారం లేదా ప్రాతిపదికను స్పష్టంగా తెలియజేస్తుంది; ‘క్రియల వల్ల’ అనేది కారణార్థాన్ని అతిగా సూచించే అవకాశం ఉన్నందున దీనిని ఎంచుకోలేదు.
- source_word: ἐδικαιώθη
  choice: నీతిమంతుడిగా తీర్చబడ్డాడు
  rationale: న్యాయస్థాన సంబంధమైన passive భావాన్ని, అలాగే ‘నీతిమంతుడిగా ప్రకటించబడ్డాడు’ అనే భావపరిధిని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἔχει καύχημα
  choice: అతనికి గొప్ప చెప్పుకోవడానికి ఆధారం ఉంది
  rationale: καύχημα అనే నామవాచకం సందర్భంలో ‘గర్వకారణం/గొప్ప చెప్పుకునే ఆధారం’ అనే భావాన్ని ఇస్తుంది; సహజమైన తెలుగులో దాని భావాన్ని స్పష్టంగా వ్యక్తపరుస్తుంది.
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: కాని దేవుని ఎదుట కాదు
  rationale: πρὸς θεόν యొక్క సంబంధాత్మక భావాన్ని సహజంగా తెలుపుతూ, మానవుల సమక్షానికీ దేవుని సమక్షానికీ మధ్యనున్న సూచిత వ్యత్యాసాన్ని అనవసరంగా విస్తరించదు.
theological_decisions:
- issue: షరతు నిజమైనదిగా తీసుకోవాలా, ఊహాత్మకమైనదిగా తీసుకోవాలా
  choice: ‘అబ్రాహాము ... తీర్చబడ్డాడంటే’ అని నేరుగా షరతుగా అనువదించబడింది.
  alternative: ‘అబ్రాహాము ... తీర్చబడి ఉంటే’
  rationale: గ్రీకు వాక్యం షరతును ప్రతిపాదిస్తుంది; పౌలు తరువాతి వాదన ఆధారంగా దానిని ముందుగానే అసత్య ఊహగా స్పష్టీకరించడం లేదు. అందువల్ల అసలు వాక్యంలోని వాదనాత్మక ఉద్వేగం నిలుపబడింది.
- issue: δικαιόω ను అంతర్గత నైతిక మార్పుగా లేదా న్యాయపరమైన తీర్పుగా వ్యక్తపరచాలా
  choice: ‘నీతిమంతుడిగా తీర్చబడ్డాడు’
  alternative: ‘నీతిమంతుడిగా చేయబడ్డాడు’
  rationale: passive క్రియలోని తీర్పు/ప్రకటన భావాన్ని నిలుపుతూ, నిర్దిష్ట సంప్రదాయ సిద్ధాంతాన్ని వాక్యంలోకి చొప్పించకుండా ఉంది; వివరణాత్మక ప్రత్యామ్నాయం పాదటిప్పణిలో ఇవ్వబడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. పౌలు వాదనలోని సంక్షిప్తతను సాధ్యమైనంతగా నిలుపుతూ, ‘క్రియల ఆధారంగా’ వంటి స్పష్టమైన పదబంధం ఉపయోగించబడింది. అన్ని పాదటిప్పణి గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
