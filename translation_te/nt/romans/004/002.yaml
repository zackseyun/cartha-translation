review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the conditional argument (εἰ γάρ), Abraham’s justification on the basis of works, and the limiting contrast ‘but not before God.’ ‘క్రియల ఆధారంగా’ appropriately conveys ἐξ ἔργων without overstating causation. The legal-verdict sense of ἐδικαιώθη is retained.
  naturalness: The phrase ‘గొప్ప చెప్పుకోవడానికి’ is not fully idiomatic in modern standard Telugu; ‘తన గురించి గొప్పగా చెప్పుకోవడానికి’ is natural but unnecessarily expansive. ‘గర్వించడానికి కారణం ఉంది’ is concise, idiomatic, and communicates καύχημα in context. Using ‘అయితే’ gives the conditional a clearer, more standard form than the colloquial-ambiguous ‘అంటే.’
  terminology: ‘అబ్రాహాము,’ ‘క్రియలు,’ ‘నీతిమంతుడిగా తీర్చబడ్డాడు,’ and ‘దేవుని ఎదుట’ are suitable and theologically non-sectarian. The justification footnote preserves the valid declarative alternative. The boast footnote should be a genuine lexical alternative rather than merely a slightly altered expansion of the main wording.
  issues:
  - severity: low
    issue: Idiomatic expression for καύχημα
    rationale: ‘గొప్ప చెప్పుకోవడానికి ఆధారం’ is understandable, but ‘గొప్ప చెప్పుకోవడానికి’ is less natural without ‘గా’ or an object. ‘గర్వించడానికి కారణం’ is natural modern Telugu and fits Paul’s compact statement.
  - severity: low
    issue: Conditional connective
    rationale: ‘తీర్చబడ్డాడంటే’ can convey the condition, but ‘తీర్చబడ్డాడైతే’ more clearly and smoothly represents εἰ in formal modern Telugu.
