id: ROM.4.8
reference: Romans 4:8
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μακάριος ἀνὴρ ⸀οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/008.yaml
  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: te
  text: “ఎవరి పాపాన్ని ప్రభువు ఎన్నటికీ లెక్కలోకి తీసుకోడో, ఆ మనిషి ధన్యుడు[a][b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ఆ వ్యక్తి ధన్యుడు’ అని కూడా అనువదించవచ్చు. ఇక్కడ ‘మనిషి’ అనే మాట పురుషుడిని మాత్రమే కాక, ఎవరినైనా సూచించే ప్రాతినిధ్యార్థంలో వాడబడింది.
    reason: lexical_alternative
  - marker: b
    text: ‘ఎవరి పాపాన్ని ప్రభువు ఎంతమాత్రమూ లెక్కలోకి తీసుకోడో’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: ధన్యుడు
  rationale: దేవుని అనుగ్రహం పొందిన స్థితిని సూచించే బైబిలు ఆశీర్వాద భాషను నిలుపుతుంది; కేవలం భావోద్వేగపరమైన ‘సంతోషవంతుడు’ కంటే ఇది మూలపద భావానికి తగినది.
- source_word: ἀνήρ
  choice: మనిషి
  rationale: గ్రీకు పురుషలింగ ఏకవచన రూపాన్ని నిలుపుతూ, ఇక్కడ అది పురుషులకు మాత్రమే పరిమితం కాని ప్రాతినిధ్యార్థంలో ఉందని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: οὗ
  choice: ఎవరి ... ఆ మనిషి
  rationale: సంబంధవాచక షష్ఠీ రూపాన్ని తెలుగులో సహజమైన ‘ఎవరి... ఆ...’ నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: οὐ μὴ
  choice: ఎన్నటికీ ... తీసుకోడు
  rationale: οὐ μή అనే బలమైన నిరాకరణను ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: λογίσηται
  choice: లెక్కలోకి తీసుకోడు
  rationale: రోమా 4 సందర్భంలో కీలకమైన గణన లేదా ఖాతాలో చేర్చడం అనే రూపకాన్ని సాంకేతిక సిద్ధాంత పదజాలం లేకుండా నిలుపుతుంది.
- source_word: κύριος
  choice: ప్రభువు
  rationale: లేఖన ఉల్లేఖన సందర్భానికి, κύριοςకు సాధారణ బైబిలు తెలుగు ప్రయోగానికి సరిపోతుంది.
- source_word: ἁμαρτίαν
  choice: పాపాన్ని
  rationale: గ్రీకులోని ఏకవచనాన్ని నిలుపుతూ, పాపాన్ని ఒక వర్గార్థక భావంగా సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: ప్రాతినిధ్య పురుషలింగ భాష
  choice: ప్రధాన పాఠ్యంలో ‘మనిషి’ అని ఉంచడం
  alternative: ‘వ్యక్తి’ లేదా ‘ఎవరైతే’
  rationale: ἀνήρ వ్యాకరణపరంగా పురుషలింగ ఏకవచనమైనా, ఈ సందర్భంలో భావం పురుషులకు మాత్రమే పరిమితం కాదు. ‘మనిషి’ మూలరూపాన్ని, దాని సాధారణ ప్రాతినిధ్య భావాన్ని రెండింటినీ నిలుపుతుంది.
- issue: బలమైన నిరాకరణ యొక్క కాలభావం
  choice: ‘ఎన్నటికీ ... తీసుకోడు’
  alternative: ‘ఎంతమాత్రమూ లెక్కలోకి తీసుకోడు’ లేదా ‘తప్పకుండా లెక్కించడు’
  rationale: οὐ μή + subjunctiveలోని దృఢమైన నిరాకరణను ‘ఎన్నటికీ’ స్పష్టంగా తెలియజేస్తుంది; దేవుడు పాపాన్ని ఏ పరిస్థితిలోనూ ఖాతాలో చేర్చడనే వాక్య బలాన్ని తగ్గించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. ‘లెక్కలోకి తీసుకోవడం’ అనే సహజ ప్రయోగం ద్వారా రోమా 4లోని గణన రూపకం నిలుపబడింది; ఉల్లేఖన స్వరూపాన్ని సూచించేందుకు కొటేషన్ గుర్తులు వాడబడ్డాయి.
