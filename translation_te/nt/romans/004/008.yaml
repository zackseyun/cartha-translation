  source_fidelity: 'The Telugu faithfully represents the Greek clause structure: μακάριος is conveyed by “ధన్యుడు”; ἀνήρ by the representative singular “మనిషి”; οὗ through the natural correlative “ఎవరి … ఆ మనిషి”; κύριος by “ప్రభువు”; and ἁμαρτίαν by singular, category-level “పాపాన్ని.” “ఎన్నటికీ” adequately conveys the emphatic οὐ μή, while “లెక్కలోకి తీసుకోడు” preserves the accounting/reckoning sense of λογίσηται in intelligible Telugu. No unwarranted theological interpretation has been added.'
