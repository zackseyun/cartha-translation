translation:
  language: te
  text: ఆయన తాను వాగ్దానం చేసినదాన్ని నెరవేర్చడానికీ సమర్థుడని పూర్తిగా నిశ్చయించుకున్నాడు.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘పూర్తిగా నమ్మకం కలిగాడు,’ ‘పూర్తిగా ఒప్పించబడ్డాడు.’
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో ‘సమర్థుడై ఉన్నాడు’; ఇది గత సంఘటనకు మాత్రమే పరిమితం కాని ఆయన సామర్థ్యాన్ని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: పూర్తిగా నిశ్చయించుకున్నాడు
  rationale: ఈ కృదంతం సంపూర్ణమైన దృఢనిశ్చయాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో సహజంగా ఉండేలా, గ్రీకు పదంలోని బలాన్ని నిలుపుతుంది.
- source_word: ὅτι
  choice: అని
  rationale: అబ్రాహాము దృఢనిశ్చయానికి సంబంధించిన విషయాన్ని సహజమైన తెలుగు పరోక్ష వాక్య నిర్మాణంలో పరిచయం చేస్తుంది.
- source_word: ὃ
  choice: చేసినదాన్ని
  rationale: సంబంధ సర్వనామాన్ని ‘తాను వాగ్దానం చేసినదాన్ని’ అనే సహజమైన తెలుగు నిర్మాణంలో వ్యక్తం చేస్తుంది.
- source_word: ἐπήγγελται
  choice: వాగ్దానం చేసిన
  rationale: గ్రీకు పరిపూర్ణ కాలం పూర్తయిన వాగ్దానానికి కొనసాగుతున్న ప్రాముఖ్యత ఉందని సూచిస్తుంది; తెలుగు సందర్భంలో ‘చేసిన’ దీనిని సహజంగా తెలియజేస్తుంది.
- source_word: δυνατός ἐστιν
  choice: సమర్థుడని
  rationale: గ్రీకులో వర్తమాన భావం ఉన్నందున గతకాల కథనానికి అనుగుణంగా ‘సమర్థుడై ఉన్నాడని’ అని మార్చకుండా, నిలకడైన సామర్థ్యాన్ని తెలిపే ‘సమర్థుడని’ వాడబడింది.
- source_word: καὶ
  choice: కూడా
  rationale: వాగ్దానం చేయడమే కాక దాన్ని నెరవేర్చగల సామర్థ్యం కూడా ఆయనకు ఉందనే బలాన్ని తెలుపుతుంది.
- source_word: ποιῆσαι
  choice: నెరవేర్చడానికి
  rationale: పదశః ‘చేయడానికి’; ఇక్కడ వాగ్దానం చేసినదాన్ని చేయడం అనే సందర్భంలో ‘నెరవేర్చడానికి’ ఆధునిక తెలుగులో స్పష్టంగా, సహజంగా ఉంటుంది.
theological_decisions:
- issue: వాగ్దానం చేసినవాడు, దాన్ని చేయగలవాడు ఎవరు?
  choice: ప్రధాన పాఠ్యంలో ‘ఆయన’ అనే సర్వనామాన్ని ఉంచడం
  alternative: ‘దేవుడు’ అని స్పష్టంగా చేర్చడం
  rationale: చుట్టుపక్కల సందర్భం ఆ వ్యక్తి దేవుడని స్పష్టం చేసినా, ఈ వచనంలోని గ్రీకు పాఠ్యం ఆయన పేరును ప్రత్యక్షంగా చేర్చదు. అందువల్ల సర్వనామాన్ని ఉంచడం మూలానికి దగ్గరగా ఉంటుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘నెరవేర్చడానికి’ సందర్భానుగుణంగా స్పష్టత ఇస్తుంది; ‘ఆయన’ ద్వారా మూలంలోని అంతర్లీన కర్తను పేరుపెట్టి విపులీకరించకుండా ఉంచింది. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
