source:
  edition: SBLGNT
  text: Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: te
  text: '“ఎవరి అక్రమాలు క్షమించబడ్డాయో[a],


    ఎవరి పాపాలు కప్పబడ్డాయో,


    వారు ధన్యులు.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “అధర్మాలు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: ధన్యులు
  rationale: దేవుని అనుగ్రహానికి పాత్రులైన స్థితిని ప్రకటించే భావాన్ని నిలుపుతుంది; కేవలం భావోద్వేగపరమైన ‘సంతోషవంతులు’ కంటే సందర్భానికి తగినది.
- source_word: ἀφέθησαν
  choice: క్షమించబడ్డాయో
  rationale: ἀφίημι యొక్క క్షమాపణ లేదా అపరాధ విమోచన భావాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; గ్రీకు నిష్క్రియ రూపాన్ని కూడా నిలుపుతుంది.
- source_word: ἀνομίαι
  choice: ధర్మవిరోధ క్రియలు
  rationale: సాధారణ దుష్కార్యాలకన్నా నియమం లేదా ధర్మానికి విరుద్ధంగా చేసిన క్రియలనే ἀνομία సూచిస్తుంది; ‘అక్రమాలు’ అనే పదంలో కలగగల కేవలం చట్టపరమైన భావాన్ని నివారిస్తూ మూలంలోని ప్రత్యేకతను నిలుపుతుంది.
- source_word: ἐπεκαλύφθησαν
  choice: కప్పబడ్డాయో
  rationale: కీర్తన ఉల్లేఖనంలోని ‘కప్పడం’ అనే రూపకాన్ని వ్యాఖ్యానించి తొలగించకుండా యథాతథంగా నిలుపుతుంది.
- source_word: ἁμαρτίαι
  choice: పాపాలు
  rationale: ἁμαρτίαιకి ప్రామాణికమైన, స్పష్టమైన తెలుగు సమానార్థకం; అనవసర విస్తరణ అవసరం లేదు.
theological_decisions:
- issue: ‘ధర్మవిరోధ క్రియలు’ మరియు ‘పాపాలు’ మధ్య సంబంధం
  choice: రెండు గ్రీకు పదాలకు తెలుగులో వేర్వేరు పదబంధాలను ఉపయోగించడం
  alternative: రెండింటినీ ‘పాపాలు’ అని అనువదించడం
  rationale: పౌలు కీర్తనలోని కవితాత్మక సమాంతరతను ఉంచుతూనే పరస్పర సంబంధమున్న కానీ ఒకేలా కాని రెండు పదాలను వాడాడు. వాటిని వేరు చేయడం మూలభాషను ప్రతిబింబిస్తుంది; అయితే వాటి మధ్య అతిగా కఠినమైన సిద్ధాంతపరమైన భేదాన్ని రుద్దదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యేలా, అయితే వాక్యంలోని దీవెన ప్రకటనకు తగిన గౌరవభరిత శైలి. గ్రీకు వాక్యక్రమాన్ని తెలుగులో సహజంగా ఉండే విధంగా మార్చి, పునరుక్త సమాంతర నిర్మాణాన్ని నిలిపాం.
