id: ROM.4.24
reference: Romans 4:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ δι’ ἡμᾶς οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/024.yaml
  text: but also for us[a], to whom it will be credited—to us who believe in the one who raised Jesus our Lord from the dead[b],
translation:
  language: te
  text: కానీ మన కోసం కూడా—మన ప్రభువైన యేసును మృతులలోనుండి లేపినవానిని విశ్వసించే మనకు అది లెక్కించబడబోతోంది.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నమ్మకం ఉంచే.”
    reason: lexical_alternative
  - marker: b
    text: “లెక్కించబడబోతోంది” అనే మాటను “జమ చేయబడబోతోంది” లేదా “లెక్కలో చేర్చబడబోతోంది” అని కూడా అనువదించవచ్చు. ఇక్కడ దేనిని లెక్కిస్తారో గ్రీకు పాఠ్యం మళ్లీ స్పష్టంగా చెప్పదు; ముందరి సందర్భంలో నీతి ఉద్దేశించబడింది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ δι’ ἡμᾶς
  choice: మన కోసం కూడా
  rationale: ముందరి వాక్యంలోని వ్యతిరేకతను, దానికి తోడు ఇప్పుడు విశ్వాసులకూ వర్తించే భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది. διά + accusative ఇక్కడ ‘మనలను దృష్టిలో ఉంచుకొని/మన కోసం’ అనే భావాన్ని ఇస్తుంది.
- source_word: οἷς μέλλει λογίζεσθαι
  choice: అది ఎవరి లెక్కలో చేర్చబడనుందో వారి కోసం
  rationale: μέλλει యొక్క భవిష్యదర్థాన్ని ‘చేర్చబడనుంది’ తెలియజేస్తుంది; λογίζεσθαιలోని లెక్కల రూపకాన్ని ‘లెక్కలో చేర్చబడడం’ నిలుపుతుంది. సంబంధవాచక నిర్మాణాన్ని కూడా సాధ్యమైనంతవరకు కాపాడుతుంది.
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: విశ్వసించే
  rationale: ἐπίతో వచ్చిన πιστεύω ఒక వ్యక్తిపై ఉంచిన విశ్వాసం లేదా నమ్మకాన్ని సూచిస్తుంది. ‘విశ్వసించే’ ఆధునిక ప్రామాణిక తెలుగులో సహజంగా ఉంది; ‘నమ్మకం ఉంచే’ అనే భావసూక్ష్మతను పాదసూచికలో ఉంచాం.
- source_word: τὸν ἐγείραντα
  choice: లేపినవానిని
  rationale: దేవుణ్ణి ఆయన చేసిన కార్యం ద్వారా సూచించే substantival participle బలాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: మన ప్రభువైన యేసును
  rationale: κύριοςను ప్రాజెక్టు పద్ధతి ప్రకారం ‘ప్రభువు’గా అనువదించి, తెలుగు పదక్రమంలో సహజంగా అమర్చింది.
- source_word: ἐκ νεκρῶν
  choice: మృతులలోనుండి
  rationale: పునరుత్థాన భాషలోని ‘మృతుల మధ్యనుండి’ అనే మూలభావాన్ని సహజమైన, గౌరవప్రదమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: λογίζεσθαιకు గ్రీకులో స్పష్టంగా చెప్పని కర్త/విషయాన్ని తెలుగులో ఎలా చూపాలి
  choice: ‘అది’ అని ఉంచడం
  alternative: ‘నీతి’ అని స్పష్టంగా చేర్చడం
  rationale: ముందరి సందర్భంలో ‘నీతి’ ఉద్దేశించబడినా, ఈ వచనం దానిని తిరిగి పేరుపెట్టి చెప్పదు. ‘అది’ అనడం తెలుగు వాక్యానికి అవసరమైన స్పష్టతనిస్తూ, మూలంలోని ఉద్దేశపూర్వక అపూర్ణతను కాపాడుతుంది.
- issue: πιστεύω ἐπίలో విశ్వాసం మరియు నమ్మకం మధ్య భావసూక్ష్మత
  choice: ప్రధాన పాఠ్యంలో ‘విశ్వసించే’
  alternative: ‘నమ్మకం ఉంచే’
  rationale: రెండూ మూలభావ పరిధిలో ఉన్నాయి. ప్రధాన పాఠ్యంలో సాధారణ బైబిలు-తెలుగు పదాన్ని ఉంచి, వ్యక్తిపై ఆధారపడే నమ్మక భావాన్ని పాదసూచికలో తెలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే గంభీరతను నిలుపుతూ రాయబడింది. గ్రీకు వాక్యం ముందరి వచనంతో వ్యాకరణపరంగా అనుసంధానమై ఉన్నందున దీర్ఘ విరామచిహ్నంతో ఆ అనుసంధానాన్ని చూపించాం. పాదసూచిక గుర్తులు రెండూ ప్రధాన పాఠ్యంలో ఉన్నాయి.
