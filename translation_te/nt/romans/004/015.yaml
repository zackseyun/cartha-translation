id: ROM.4.15
reference: Romans 4:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος ὀργὴν κατεργάζεται, οὗ ⸀δὲ οὐκ ἔστιν νόμος, οὐδὲ παράβασις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: te
  text: ఎందుకంటే ధర్మశాస్త్రం ఆగ్రహాన్ని కలిగిస్తుంది[a]. అయితే ధర్మశాస్త్రం లేని చోట అతిక్రమణం కూడా ఉండదు[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ధర్మశాస్త్రం’ను మోషే ధర్మశాస్త్రం అనే నిర్దిష్ట అర్థంలో కూడా తీసుకోవచ్చు.
    reason: νόμος యొక్క పరిధికి సంబంధించిన సందర్భానుసారమైన ప్రత్యామ్నాయ అవగాహన; మూలపాఠంలో ‘మోషే’ అని స్పష్టంగా లేదు.
  - marker: b
    text: లేదా, “ఉల్లంఘన కూడా ఉండదు.”
    reason: παράβασις కు సాధ్యమైన నిఘంటు ప్రత్యామ్నాయం.
lexical_decisions:
- source_word: νόμος
  choice: ధర్మశాస్త్రం
  rationale: పౌలు వాడిన పదంలోని ధార్మిక-న్యాయ భావాన్ని సహజమైన తెలుగు బైబిలు పరిభాషలో నిలుపుతుంది; ప్రధాన పాఠంలో దీనిని మోషే ధర్మశాస్త్రానికే పరిమితం చేయకుండా సాధారణ సూత్రాన్నీ వినిపిస్తుంది.
- source_word: ὀργή
  choice: ఉగ్రత
  rationale: సాధారణ మానవ కోపం కంటే న్యాయతీర్పుతో కూడిన దైవిక ఆగ్రహ భావాన్ని సూచించడానికి ఈ పదం ఎంచుకోబడింది.
- source_word: κατεργάζεται
  choice: కలిగిస్తుంది
  rationale: కారణాత్మక భావాన్ని ఆధునిక, సహజమైన తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: οὗ δὲ
  choice: అయితే ... లేని చోట
  rationale: δέ లోని స్వల్ప వ్యతిరేకతను, οὗ లోని స్థానార్థక సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
- source_word: παράβασις
  choice: అతిక్రమం
  rationale: తెలిసిన హద్దు లేదా ఆజ్ఞను దాటడం అనే నిర్దిష్ట భావాన్ని కాపాడుతుంది.
theological_decisions:
- issue: పౌలు వాదనలో νόμος పరిధి
  choice: ధర్మశాస్త్రం
  alternative: మోషే ధర్మశాస్త్రం
  rationale: వచనం ఆజ్ఞ మరియు అతిక్రమం మధ్యనున్న విస్తృత సూత్రాన్ని చెబుతోంది. ప్రధాన పాఠంలో ‘మోషే’ అని చేర్చకపోవడం ద్వారా పదం పరిధిని ముందుగానే సంకుచితం చేయలేదు.
- issue: ὀργή యొక్క సూచిత కర్త లేదా స్వరూపం
  choice: ఉగ్రత
  alternative: దేవుని ఉగ్రత
  rationale: గ్రీకు పాఠంలో ‘దేవుని’ అనే పదం స్పష్టంగా లేదు. సందర్భంలో దైవిక ఉగ్రత భావం ఉండవచ్చునప్పటికీ, ప్రధాన పాఠం ఆ సూచనను వివరణగా జోడించకుండా మూలంలోని సంక్షిప్తతను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. రెండు చిన్న వాక్యాలుగా విభజించి గ్రీకు వాక్యంలోని కారణం-వ్యతిరేకత సంబంధాన్ని స్పష్టంగా ఉంచాం; మూలంలోని భావసందిగ్ధతను ప్రధాన పాఠంలో అనవసరంగా పరిష్కరించలేదు.
