  naturalness: “అతడు విశ్వసించిన దేవుని సన్నిధిలో, అంటే … దేవుని సన్నిధిలో” అనే పునరుక్తి తొలగించబడింది. సవరించిన వాక్యం ఆధునిక ప్రామాణిక తెలుగులో సహజంగా చదవబడుతుంది; సందర్భానుసారంగా ఇది కొనసాగుతున్న వాక్యభాగమే అన్న లక్షణాన్ని డాష్ కాపాడుతుంది.
