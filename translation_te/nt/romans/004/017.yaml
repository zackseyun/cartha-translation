id: ROM.4.17
reference: Romans 4:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: te
  text: “నేను నిన్ను అనేక జనాలకు[a] తండ్రిగా చేశాను” అని వ్రాయబడి ఉన్నట్లుగా—అతడు విశ్వసించిన, చనిపోయినవారిని బ్రతికించే మరియు లేనివాటిని ఉన్నవాటిగా పిలిచే[b] దేవుని సమక్షంలో.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “జనాలు” అనే మాటను కొన్ని సందర్భాల్లో “యూదేతరులు” అని కూడా అర్థం చేసుకోవచ్చు. అయితే ఇక్కడ ఉల్లేఖించిన ఆదికాండం సందర్భంలో విస్తృతమైన “జనాలు” అనే అర్థమే ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
  - marker: b
    text: 'మరింత వ్యాఖ్యానాత్మకంగా: “ఉనికిలో లేనివాటిని ఉనికిలోకి పిలిచే.”'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: వ్రాయబడి ఉన్నట్లుగా
  rationale: లేఖన ఉల్లేఖనానికి సహజమైన తెలుగు రూపం; గ్రీకు perfect passive సూచించే వ్రాయబడి నిలిచివున్న భావాన్ని కాపాడుతుంది.
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: అనేక జనాలకు తండ్రిగా
  rationale: ఆదికాండంలోని వాగ్దాన సందర్భంలో ἐθνῶν అనేక ప్రజాసమూహాలు లేదా జనాలను సూచిస్తుంది; యూదేతరులు అనే పరిమిత అర్థాన్ని ప్రధాన పాఠ్యంలో రుద్దదు.
- source_word: τέθεικά σε
  choice: నేను నిన్ను ... చేశాను
  rationale: τέθεικα యొక్క perfect భావానికి సహజమైన తెలుగు; దేవుడు ఇచ్చిన స్థిరమైన నియామకం లేదా స్థితిని తెలియజేస్తుంది.
- source_word: κατέναντι
  choice: సన్నిధిలో
  rationale: దేవుని ఎదుట లేదా ఆయన సమక్షంలో అనే సంబంధార్థాన్ని గంభీరమైన, సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οὗ ἐπίστευσεν
  choice: అతడు విశ్వసించిన
  rationale: అబ్రాహాము విశ్వాసం దేవునిపై కేంద్రీకృతమై ఉందని తెలుగులో సహజంగా తెలియజేస్తుంది.
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: చనిపోయినవారికి జీవం ఇచ్చే
  rationale: దేవుని జీవింపజేసే శక్తిని స్పష్టంగా, ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: καλοῦντος τὰ μὴ ὄντα ὡς ὄντα
  choice: లేనివాటిని ఉన్నట్లే పిలిచే
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తతను, భావసందిగ్ధతను కాపాడుతుంది; దీన్ని ప్రధాన పాఠ్యంలో నేరుగా ‘ఉనికిలోకి తెచ్చే’ అని విస్తరించదు.
theological_decisions:
- issue: చివరి పదబంధాన్ని సృష్టి లేనిదానిలోనుండి జరిగిందనే ప్రత్యక్ష ప్రకటనగా విస్తరించాలా, లేక గ్రీకు పదాలకు దగ్గరగా ఉంచాలా?
  choice: లేనివాటిని ఉన్నట్లే పిలిచే
  alternative: ఉనికిలో లేనివాటిని ఉనికిలోకి పిలిచే
  rationale: ఈ మాటలు దేవుని సృజనాత్మక శక్తిని సూచించగలిగినా, గ్రీకు నిర్మాణం సంక్షిప్తంగా ఉండి విస్తృత భావావకాశాన్ని కలిగి ఉంది. అందువల్ల ప్రధాన పాఠ్యం ఆ ఉద్వేగాన్ని నిలుపుతుంది; స్పష్టీకరించిన వ్యాఖ్యానాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ముందు వచనంతో కొనసాగుతున్న గ్రీకు వాక్య నిర్మాణాన్ని అనవసరంగా కొత్త ప్రధాన క్రియను చేర్చి పరిష్కరించకుండా, డాష్ మరియు ‘అంటే’ ద్వారా సహజంగా అనుసంధానించాం.
