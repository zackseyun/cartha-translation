id: ROM.4.19
reference: Romans 4:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ μὴ ἀσθενήσας τῇ ⸀πίστει κατενόησεν τὸ ἑαυτοῦ ⸀σῶμα νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: te
  text: అతడు విశ్వాసంలో బలహీనపడకుండా, దాదాపు నూరేళ్ల వయసున్నవాడై ఉండి, మృతప్రాయమైన తన శరీరాన్ని పరిగణనలోకి తీసుకున్నాడు[a]; అలాగే శారా గర్భాశయం యొక్క మృతస్థితిని[b] కూడా పరిగణనలోకి తీసుకున్నాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక పాఠ సంప్రదాయం ప్రకారం: “మృతప్రాయమైన తన శరీరాన్ని అతడు పరిగణనలోకి తీసుకోలేదు.”'
    reason: textual_variant
  - marker: b
    text: “మృతస్థితి”కి బదులుగా “సంతానరాహిత్యం” అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας
  choice: బలహీనపడకుండా
  rationale: క్రియారూప భావాన్ని సహజమైన తెలుగులో నిలుపుతూ, విశ్వాసబలం తగ్గిపోకపోవడాన్ని సూచిస్తుంది.
- source_word: πίστει
  choice: విశ్వాసంలో
  rationale: ఇక్కడ అబ్రాహాము దేవుని వాగ్దానంపై ఉంచిన నమ్మకాన్ని సూచించే సాధారణమైన, సందర్భోచితమైన పదం.
- source_word: κατενόησεν
  choice: పరిగణనలోకి తీసుకున్నాడు
  rationale: వాస్తవ పరిస్థితిని ఉద్దేశపూర్వకంగా గమనించి లెక్కలోకి తీసుకోవడం అనే భావాన్ని అందిస్తుంది.
- source_word: νενεκρωμένον
  choice: మృతప్రాయమైన
  rationale: అక్షరార్థ శారీరక మరణాన్ని కాక, సంతానోత్పత్తి విషయంలో దాదాపు నిర్జీవమైన స్థితిని సహజంగా తెలియజేస్తుంది.
- source_word: ἑκατονταετής που ὑπάρχων
  choice: దాదాపు నూరేళ్ల వాడై ఉన్నందున
  rationale: πού తెలిపే సుమారు అనే భావాన్నీ, శరీరం మృతప్రాయంగా ఉండడానికి వయస్సు కారణమనే వాక్యసంబంధాన్నీ స్పష్టంగా ఉంచుతుంది.
- source_word: νέκρωσιν
  choice: మృతస్థితిలో ఉండడాన్ని
  rationale: ముందటి νενεκρωμένονతో ఉన్న మరణ-చిత్రణ సంబంధాన్ని నిలుపుతూ తెలుగులో సహజంగా ఉంటుంది.
- source_word: μήτρας Σάρρας
  choice: శారా గర్భం
  rationale: గ్రీకు భాషలోని స్పష్టమైన శారీరక చిత్రాన్ని సరళమైన ఆధునిక తెలుగులో నిలుపుతుంది.
theological_decisions:
- issue: అబ్రాహాము శరీరం, శారా గర్భం గురించి ఉన్న మరణ-చిత్రణను మృదువుగా ‘సంతానరాహిత్యం’గా మార్చాలా?
  choice: ప్రధాన పాఠ్యంలో ‘మృతప్రాయమైన’, ‘మృతస్థితి’ అనే మరణ-చిత్రణను నిలుపడం
  alternative: ‘సంతానోత్పత్తికి అసమర్థమైన’, ‘సంతానరాహిత్యం’ అని అనువదించడం
  rationale: పౌలు రెండు భాగాల్లోనూ సంబంధిత మరణ పదాలను ఉపయోగించి దేవుని వాగ్దానం మానవరీత్యా అసాధ్యమైన పరిస్థితిని అధిగమించిందని నొక్కిచెబుతున్నాడు; ఆ ఉద్రిక్తతను వివరణాత్మక పదాలతో తొలగించకూడదు.
- issue: κατενόησεν ముందు నిరాకరణ ఉన్న పాఠాంతరాన్ని ప్రధాన పాఠ్యంలో స్వీకరించాలా?
  choice: SBLGNT ప్రధాన పాఠం ప్రకారం ‘పరిగణనలోకి తీసుకున్నాడు’ అని అనువదించడం
  alternative: పాఠాంతరం ప్రకారం ‘పరిగణనలోకి తీసుకోలేదు’ అని అనువదించడం
  rationale: ఇచ్చిన మూలపాఠాన్ని ప్రధానంగా అనుసరిస్తూ, అర్థాన్ని గణనీయంగా మార్చే పాఠాంతరాన్ని పాదసూచికలో పారదర్శకంగా తెలియజేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని దీర్ఘ నిర్మాణాన్ని స్పష్టత కోసం రెండు సమాంతర క్రియాభాగాలుగా అమర్చినా, రెండు అంశాలనూ అబ్రాహాము పరిగణించినట్టు మూలార్థాన్ని నిలిపింది.
