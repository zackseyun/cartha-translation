id: ROM.4.1
reference: Romans 4:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν ⸀εὑρηκέναι Ἀβραὰμ τὸν ⸀προπάτορα ⸀ἡμῶν κατὰ σάρκα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: te
  text: అయితే, శరీర సంబంధంగా మన పూర్వికుడైన అబ్రాహాము[a] ఏమి కనుగొన్నాడని మనం చెప్పాలి?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా మరింత భావసహజంగా, “మన భౌతిక పూర్వికుడైన అబ్రాహాము.”
    reason: lexical_alternative
  - marker: b
    text: '“శరీర సంబంధంగా” అనే మాటలను “కనుగొన్నాడు” అనే క్రియతో కలిపి కూడా అర్థం చేసుకోవచ్చు. అప్పుడు భావం: “అబ్రాహాము మానవ ప్రయత్నం ద్వారా లేదా కేవలం మానవ దృష్టిలో ఏమి కనుగొన్నాడు?”'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: అయితే … మనం చెప్పాలి?
  rationale: పౌలు ముందటి చర్చనుంచి కొనసాగిస్తూ వేసే ఆలోచనాత్మక ప్రశ్నను సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εὑρηκέναι
  choice: పొందాడని
  rationale: పరిపూర్ణకాల క్రియారూపంలోని, అబ్రాహాము ఒక ఫలితాన్ని లేదా లాభాన్ని పొందాడనే భావాన్ని సందర్భానుగుణంగా తెలియజేస్తుంది; ‘కనుగొన్నాడని’ అనడం సాధ్యమే గాని తెలుగులో అది కొత్త విషయాన్ని కనిపెట్టాడనే భావాన్ని ఎక్కువగా కలిగించవచ్చు.
- source_word: προπάτορα
  choice: పూర్వికుడైన
  rationale: అబ్రాహామును ముందున్న పురుష వంశపితగా సూచించే గ్రీకు పదానికి సహజమైన, గౌరవప్రదమైన తెలుగు సమానం.
- source_word: ἡμῶν
  choice: మన
  rationale: అబ్రాహాముతో పౌలు మరియు అతని సంభాషణలో ఉన్నవారికి గల ఉమ్మడి వంశసంబంధాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: κατὰ σάρκα
  choice: శరీర సంబంధంగా
  rationale: ఇక్కడ σάρξ పాపస్వభావాన్ని కాక భౌతిక వంశసంబంధాన్ని సూచిస్తుంది. పౌలు వాడే ‘శరీరం’ అనే పదాన్ని నిలుపుతూనే తెలుగులో అర్థమయ్యేలా అనువదించబడింది.
theological_decisions:
- issue: κατὰ σάρκα ఏ పదబంధాన్ని విశేషిస్తుంది?
  choice: ‘శరీర సంబంధంగా మన పూర్వికుడైన’ అని అబ్రాహాముతో అనుసంధానించి, భౌతిక వంశసంబంధాన్ని సూచించేదిగా ప్రధాన పాఠ్యంలో ఇచ్చాం.
  alternative: దీనిని ‘పొందాడని’ అనే క్రియతో అనుసంధానించి, అబ్రాహాము మానవ ప్రయత్నం ద్వారా లేదా కేవలం మానవ దృష్టిలో ఏమి పొందాడని అర్థం చేసుకోవచ్చు.
  rationale: పదక్రమం మరియు ‘అబ్రాహాము, మన పూర్వికుడు’ అనే అనుబంధ నిర్మాణం ప్రధాన ఎంపికకు అనుకూలంగా ఉన్నాయి; అయినా గ్రీకు వాక్యనిర్మాణంలో రెండవ అనుసంధానం నిజమైన సాధ్యత కావడంతో దానిని పాదసూచికలో భద్రపరిచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన ప్రశ్నారూపాన్ని వాడుతూ, పౌలు వాదనలోని గౌరవప్రదమైన శైలిని నిలిపాం. ప్రధాన పాఠ్యం సులభంగా చదవదగినదిగా ఉంది; గ్రీకు వాక్యనిర్మాణంలోని నిజమైన అనిశ్చితిని పాదసూచికలో స్పష్టంగా ఉంచాం.
