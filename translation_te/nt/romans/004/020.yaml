    reason: lexical_alternative
  - marker: b
    text: లేదా, “విశ్వాసం ద్వారా బలపరచబడి.”
    reason: lexical_alternative
  revision_rationale: The revision removes the misleading and redundant participial phrase “సందేహిస్తూ ఊగిసలాడలేదు” and replaces it with the natural modern Telugu expression “అవిశ్వాసం వల్ల తటపటాయించలేదు,” which conveys διακρίνω as wavering/hesitation without reducing it solely to intellectual doubt. It also renders δοὺς δόξαν with an accompanying participial expression. Footnotes preserve the viable lexical alternatives and their anchors.
