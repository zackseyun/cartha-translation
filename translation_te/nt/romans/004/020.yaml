  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: te
  text: అయితే దేవుని వాగ్దానం విషయంలో అతడు అవిశ్వాసం వల్ల తటపటాయించలేదు; బదులుగా విశ్వాసంలో బలపరచబడి, దేవునికి మహిమ చెల్లిస్తూ ఉన్నాడు.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: అయితే దేవుని వాగ్దానం విషయంలో
  rationale: εἰς ఇక్కడ దిశను కాక విషయసంబంధ అర్థాన్ని ఇస్తుంది; δέ మృదువైన వ్యతిరేకతను సూచిస్తుంది. ఈ తెలుగు రూపం రెండింటినీ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: οὐ διεκρίθη
  choice: సందేహిస్తూ ఊగిసలాడలేదు
  rationale: διακρίνω ఇక్కడ కేవలం మేధోపరమైన సందేహం కంటే అంతరంగంలో రెండుగా చీలి స్థిరత్వం కోల్పోవడాన్ని సూచిస్తుంది. ‘ఊగిసలాడలేదు’ ప్రధాన భావాన్ని అందిస్తుండగా, ‘సందేహిస్తూ’ సందర్భాన్ని స్పష్టం చేస్తుంది.
- source_word: τῇ ἀπιστίᾳ
  choice: అవిశ్వాసంతో
  rationale: దత్తివిభక్తి సాధనం లేదా అనుబంధ పరిస్థితిని సూచించగలదు. ‘అవిశ్వాసంతో’ మూలంలోని సంబంధాన్ని సహజమైన తెలుగులో ఉంచుతుంది.
- source_word: ἐνεδυναμώθη
  choice: బలపరచబడి
  rationale: కర్మణి రూపాన్ని నిలుపుతూ, బలానికి మూలం ఎవరో వాక్యంలో స్పష్టంగా చెప్పనందున దానిని అదనంగా నిర్ధారించదు.
- source_word: τῇ πίστει
  choice: విశ్వాసంలో
  rationale: దత్తివిభక్తిని విశ్వాసపు పరిధి లేదా స్థితిగా చూపిస్తుంది; ‘విశ్వాసం ద్వారా’ అనే సాధనార్థం కూడా సాధ్యమైనందున దానిని పాదసూచికలో ఉంచాం.
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: దేవునికి మహిమ చెల్లించాడు
  rationale: తెలుగులో ‘మహిమ చెల్లించడం’ సహజమైన, గౌరవప్రదమైన ప్రయోగం. గ్రీకు కృదంతం ప్రధాన క్రియతో అనుబంధ చర్యను సూచించినా, తెలుగు ప్రవాహం కోసం సమాపక క్రియగా అనువదించబడింది.
theological_decisions:
- issue: అబ్రాహాము స్పందనను కేవలం మేధోపరమైన సందేహంగా చూపాలా, లేక అవిశ్వాసం వల్ల కలిగే విస్తృతమైన అంతరంగ అస్థిరతగా చూపాలా
  choice: అవిశ్వాసంతో సందేహిస్తూ ఊగిసలాడలేదు
  alternative: అవిశ్వాసం వల్ల సందేహించలేదు
  rationale: ఈ సందర్భంలో διεκρίθη విశ్వాసంలో స్థిరంగా ఉండటానికి వ్యతిరేకమైన అంతరంగ ఊగిసలాటను సూచిస్తుంది. ఎంపిక చేసిన రూపం దానిని కేవలం బౌద్ధిక సందేహానికి పరిమితం చేయదు.
- issue: అబ్రాహాము విశ్వాసంలో బలపడాడా లేక విశ్వాసం ద్వారా బలపరచబడ్డాడా
  choice: విశ్వాసంలో బలపరచబడి
  alternative: విశ్వాసం ద్వారా బలపరచబడి
  rationale: τῇ πίστει స్థితి/పరిధి లేదా సాధనం అనే రెండురకాలుగా అర్థమవచ్చు. ప్రధాన పాఠం సమాంతర భావాన్ని నిలుపుతుంది; ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే లేఖనానికి తగిన గౌరవప్రదమైన శైలి. ‘వాగ్దానం,’ ‘విశ్వాసం,’ ‘అవిశ్వాసం,’ ‘మహిమ’ వంటి స్థిరమైన బైబిలు పదజాలాన్ని సహజ వాక్యనిర్మాణంతో ఉపయోగించాం.
