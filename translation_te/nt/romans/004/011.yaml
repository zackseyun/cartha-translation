id: ROM.4.11
reference: Romans 4:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: te
  text: అతడు సున్నతి అనే సూచనను పొందాడు; అది తాను సున్నతి పొందని స్థితిలో కలిగిన విశ్వాసం ద్వారా వచ్చిన నీతికి ముద్రగా ఉంది.[a] అతడు సున్నతి లేని స్థితిలో విశ్వసించే వారందరికీ తండ్రి కావడానికి, వారికీ కూడా నీతి లెక్కించబడడానికి[b] ఇలా జరిగింది.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “సున్నతిలేని స్థితిలో ఉన్న విశ్వాసపు నీతికి.”
    reason: గ్రీకు జనిటివ్ శ్రేణి మరియు సున్నతిలేని స్థితిని సూచించే పదబంధం యొక్క మరింత అక్షరార్థ రూపాన్ని భద్రపరచడం.
  - marker: b
    text: “లెక్కించబడడానికి” అనే పదాన్ని “ఆపాదించబడడానికి,” “జమ చేయబడడానికి,” లేదా “పరిగణించబడడానికి” అని కూడా అనువదించవచ్చు.
    reason: λογίζομαι అనే లెక్కల రూపకానికి ఉన్న సముచిత తెలుగు ప్రత్యామ్నాయాలను చూపడం.
  - marker: c
    text: “సున్నతి లేని స్థితిలో” అనే భావం అక్షరార్థంగా “సున్నతిలేని స్థితి ద్వారా” అని ఉంటుంది; ఇక్కడ అది సాధనాన్ని కాక, వారు విశ్వసించే స్థితిని సూచిస్తుంది.
    reason: δι’ ἀκροβυστίας యొక్క అక్షర రూపం అపార్థంగా సాధనార్థాన్ని సూచించవచ్చని వివరిస్తూ, సందర్భార్థాన్ని భద్రపరచడం.
lexical_decisions:
- source_word: σημεῖον
  choice: సూచన
  rationale: సున్నతి అంతర్గత నీతికి బాహ్య సూచనగా ఉందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: περιτομή
  choice: సున్నతి
  rationale: యూదుల ఆచారాన్ని సూచించే స్థిరమైన, స్పష్టమైన తెలుగు పదం.
- source_word: σφραγίς
  choice: ముద్ర
  rationale: ధృవీకరణ లేదా ప్రామాణికతను సూచించే గ్రీకు రూపకాన్ని యథాతథంగా నిలుపుతుంది.
- source_word: δικαιοσύνη
  choice: నీతి
  rationale: పౌలు వాదనలో దేవుని ఎదుట సరైన స్థితిని సూచించగల సాధారణ బైబిలు తెలుగు పదం; భావాన్ని కేవలం నైతిక ప్రవర్తనగా పరిమితం చేయదు.
- source_word: πίστις
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో అబ్రాహాము దేవుణ్ణి నమ్మడాన్ని సూచించే సహజమైన ప్రధాన అనువాదం.
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: తాను సున్నతి పొందకముందే
  rationale: అక్షరార్థమైన ‘సున్నతిలేని స్థితిలో’ కంటే కాల-స్థితి భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా తెలియజేస్తుంది.
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: విశ్వసించే వారందరికీ తండ్రి
  rationale: పౌలు చెప్పే ప్రతినిధిత్వ సంబంధాన్ని సహజంగా, వ్యాఖ్యానాత్మక విస్తరణ లేకుండా నిలుపుతుంది.
- source_word: δι’ ἀκροβυστίας
  choice: సున్నతి పొందకుండానే
  rationale: ఇక్కడ διά సాధనాన్ని కాక, వారు విశ్వసించే సున్నతిలేని స్థితిని సూచిస్తుందని సందర్భం తెలియజేస్తుంది.
- source_word: λογισθῆναι
  choice: లెక్కించబడడానికి
  rationale: లెక్కలో చేర్చడం/ఆపాదించడం అనే పౌలు ఉపయోగించే లెక్కల రూపకాన్ని నిలుపుతుంది; ‘పరిగణించబడడం’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: καί
  choice: కూడా
  rationale: సున్నతి లేని విశ్వాసులకు సైతం నీతి లెక్కించబడుతుందనే చేర్పు భావాన్ని వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: సున్నతికి నీతితో ఉన్న సంబంధం
  choice: సున్నతి, అబ్రాహాము సున్నతి పొందకముందే విశ్వాసం వల్ల వచ్చిన నీతికి సూచన మరియు ముద్రగా చూపబడింది.
  alternative: సున్నతి నీతిని కలిగించే సాధనమని వినిపించేలా వాక్యాన్ని రూపొందించడం.
  rationale: గ్రీకు వాక్యం సున్నతిని ముందే ఉన్న విశ్వాస-సంబంధ నీతికి తరువాత వచ్చిన ధృవీకరణగా ఉంచుతుంది; తరువాతి మతశాస్త్ర వ్యవస్థలను ఇందులోకి చొప్పించకుండా ఈ క్రమాన్ని అనువాదం కాపాడుతుంది.
- issue: τῆς δικαιοσύνης τῆς πίστεως లోని సంబంధం
  choice: ‘విశ్వాసం వల్ల వచ్చిన నీతి’ అని అనువదించడం.
  alternative: ‘విశ్వాసానికి చెందిన నీతి’ లేదా ‘విశ్వాసమనే నీతి’.
  rationale: జనిటివ్ నిర్మాణంలో కొంత సంక్షిప్తత ఉన్నప్పటికీ, తక్షణ సందర్భం విశ్వాసం ద్వారా లెక్కించబడిన నీతిని ముందుకు తెస్తుంది. ‘వల్ల వచ్చిన’ అనేది ఈ సంబంధాన్ని సహజ తెలుగులో తెలియజేస్తుంది; విశ్వాసాన్నే నీతితో సమానం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదంగా, సాధారణ పాఠకులకు అర్థమయ్యేలా రెండు వాక్యాలుగా విభజించబడింది. ‘సూచన’, ‘ముద్ర’, ‘నీతి’, ‘విశ్వాసం’, ‘లెక్కించబడడం’ అనే పౌలు వాదనలోని ప్రధాన రూపకాలు మరియు పదాలు నిలుపబడ్డాయి. అన్ని పాదసూచిక గుర్తులు ప్రధాన పాఠ్యంలో ఉన్నాయి.
