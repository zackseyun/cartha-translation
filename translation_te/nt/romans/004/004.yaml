  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: te
  text: అయితే, పని చేసేవానికి జీతం కృపగా[a] లెక్కించబడదు; చెల్లించవలసినదిగా[b] లెక్కించబడుతుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఉచిత బహుమతిగా” లేదా “కృప ప్రకారం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “బాకీగా” లేదా “ఋణంగా.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: పని చేసేవానికి
  rationale: నిర్దిష్ట వ్యక్తిని కాక, పని చేసే ఎవరినైనా సూచించే substantival present participle యొక్క సాధారణ భావాన్ని సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: μισθὸς
  choice: జీతం
  rationale: పనికి ప్రతిఫలంగా రావలసిన చెల్లింపును ‘జీతం’ స్పష్టంగా తెలియజేస్తుంది; సాధారణమైన ‘ప్రతిఫలం’ కంటే ఈ శ్రమ–చెల్లింపు సందర్భానికి ఇది తగినది.
- source_word: λογίζεται
  choice: లెక్కించబడుతుంది
  rationale: ఖాతాలో గణించడం లేదా ఒక నిర్దిష్ట హోదాలో పరిగణించడం అనే పౌలు ఉపయోగించిన లెక్కల రూపకాన్ని నిలుపుతుంది.
- source_word: κατὰ χάριν
  choice: కృపగా
  rationale: χάρις అనే ముఖ్య పదాన్ని ‘కృప’గా నిలుపుతూ, ఇక్కడ జీతానికి విరుద్ధమైన ఉచిత అనుగ్రహ భావాన్ని ‘-గా’ నిర్మాణం ద్వారా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὀφείλημα
  choice: చెల్లించవలసిన బాకీగా
  rationale: పని చేసినందువల్ల తప్పక ఇవ్వాల్సినదనే భావాన్ని ‘బాకీ’ నిలుపుతుంది; ‘చెల్లించవలసిన’ అనే పదం సందర్భంలోని బాధ్యతను స్పష్టం చేస్తుంది.
- source_word: δὲ
  choice: అయితే
  rationale: ముందటి వాక్యంతో ఉన్న తార్కిక మార్పు లేదా స్వల్ప వ్యత్యాసాన్ని అతిగా బలపరచకుండా సూచిస్తుంది.
theological_decisions:
- issue: శ్రమ–చెల్లింపు వ్యత్యాసంలో χάρις అనువాదం
  choice: కృపగా
  alternative: ఉచిత బహుమతిగా / కృప ప్రకారం
  rationale: మూలంలోని θεologically significant χάρις పదాన్ని దాచకుండా నిలుపుతుంది; అదే సమయంలో పాదటిప్పణిలో ఈ సందర్భంలోని ఉచిత బహుమతి భావాన్ని తెలియజేస్తుంది.
- issue: ὀφείλημα యొక్క ఋణ/బాధ్యత భావం
  choice: చెల్లించవలసిన బాకీగా
  alternative: బాధ్యతగా / రావలసినదిగా
  rationale: యజమాని పని చేసినవానికి ఇవ్వాల్సిన ఋణసదృశ బాధ్యతను స్పష్టంగా ఉంచుతుంది; దానిని సాధారణ నైతిక బాధ్యతగా మాత్రమే మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే పౌలు ఉపయోగించిన లెక్కలు మరియు ఋణం అనే రూపకాలను గౌరవంగా నిలుపుతూ రూపొందించబడింది. మూలంలోని రెండు κατὰ పదబంధాల సమాంతర వ్యత్యాసం ‘కృపగా … బాకీగా’ రూపంలో ప్రతిఫలించింది.
