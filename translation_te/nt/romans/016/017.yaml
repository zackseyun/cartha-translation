id: ROM.16.17
reference: Romans 16:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: te
  text: 'సోదరులారా[a], మిమ్మల్ని వేడుకుంటున్నాను: మీరు నేర్చుకున్న బోధకు విరుద్ధంగా విభేదాలను, తొట్రుపాటుకు కారణాలను కలిగించేవారిని జాగ్రత్తగా గమనించండి; వారికి దూరంగా ఉండండి.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “సోదర సోదరీమణులారా”; గ్రీకు మూలంలో “సోదరులారా” అని ఉంది; అయితే ఇది సంఘమంతటినీ ఉద్దేశించి ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: మిమ్మల్ని వేడుకుంటున్నాను
  rationale: బలమైనప్పటికీ ఆప్యాయమైన పౌలు విజ్ఞప్తిని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἀδελφοί
  choice: సోదరులారా
  rationale: మూలంలోని పుంలింగ బహువచన సంబోధనను నిలుపుతుంది; ఇది సంఘమంతటినీ ఉద్దేశించి ఉండే అవకాశాన్ని పాదసూచిక వివరిస్తుంది.
- source_word: σκοπεῖν
  choice: జాగ్రత్తగా గమనించండి
  rationale: కేవలం చూడడం కాకుండా అప్రమత్తంగా గుర్తించాలనే భావాన్ని వ్యక్తం చేస్తుంది.
- source_word: διχοστασίας
  choice: విభేదాలను
  rationale: సమాజంలో చీలికలు, వర్గవిభజనలు కలిగించే భావాన్ని స్పష్టంగా, సహజంగా తెలియజేస్తుంది.
- source_word: σκάνδαλα
  choice: తొట్రుపాటుకు కారణాలను
  rationale: ఇతరులు తొట్రుపడేలా చేసే కారణాలు అనే మూల రూపకాన్ని కాపాడుతుంది.
- source_word: παρὰ τὴν διδαχὴν
  choice: బోధకు విరుద్ధంగా
  rationale: పొందిన బోధ అనే ప్రమాణం నుండి వ్యతిరేక దిశలో వెళ్లడాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἐμάθετε
  choice: మీరు నేర్చుకున్న
  rationale: విశ్వాసులు గతంలో స్వీకరించి నేర్చుకున్న బోధను నేరుగా సూచిస్తుంది.
- source_word: ποιοῦντας
  choice: కలిగించేవారిని
  rationale: విభేదాలు, తొట్రుపాటు కారణాలు పుట్టేలా చేసే వ్యక్తులను సహజ తెలుగు సంబంధార్థక నిర్మాణంలో సూచిస్తుంది.
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: వారికి దూరంగా ఉండండి
  rationale: వారి నుండి తప్పుకొని సంబంధాన్ని నివారించాలనే ఆజ్ఞను సహజమైన తెలుగులో తెలియజేస్తుంది; దిశాత్మక భావం కూడా నిలుస్తుంది.
theological_decisions:
- issue: రోమా సంఘాన్ని ఉద్దేశించిన ἀδελφοί అనే సంబోధన పరిధి
  choice: ప్రధాన పాఠ్యంలో ‘సోదరులారా’ అని ఉంచి, సంఘంలోని స్త్రీలను కూడా ఉద్దేశించి ఉండవచ్చని పాదసూచికలో తెలియజేయడం.
  alternative: ప్రధాన పాఠ్యంలోనే ‘సోదర సోదరీమణులారా’ అని అనువదించడం.
  rationale: మూలంలోని పుంలింగ బహువచన రూపాన్ని ప్రధాన పాఠ్యంలో కాపాడుతూ, పౌలు వాడుకలో అది మొత్తం సంఘాన్ని సూచించే సంభావ్యతను దాచకుండా పాదసూచికలో వివరిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. హెచ్చరిక యొక్క గంభీరతను నిలుపుతూ పాతకాలపు లేదా మతశాఖాపరమైన పదజాలాన్ని నివారించాం.
