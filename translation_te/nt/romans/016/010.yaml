revisions:
- from: మెస్సీయలో యోగ్యుడని రుజువైన అపెల్లెకు శుభాకాంక్షలు చెప్పండి.[a] అరిస్తోబులు ఇంటివారికి శుభాకాంక్షలు చెప్పండి.
  to: మెస్సీయలో యోగ్యుడని రుజువైన అపెల్లెకు వందనాలు తెలియజేయండి.[a] అరిస్తోబులు ఇంటివారికి వందనాలు తెలియజేయండి.
  rationale: The revision changes only the repeated greeting verb phrase to distinguish greetings from congratulatory or well-wishing language. The wording for Apelles, Messiah, and Aristobulus’ household remains faithful to the Greek and natural in modern standard Telugu.
