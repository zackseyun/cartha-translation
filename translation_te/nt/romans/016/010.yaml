source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: te
  text: మెస్సీయలో యోగ్యుడని రుజువైన అపెల్లెకు వందనాలు తెలియజేయండి.[a] అరిస్తోబులు ఇంటివారికి వందనాలు తెలియజేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయంగా, “క్రీస్తులో.”
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: శుభాకాంక్షలు చెప్పండి
  rationale: బహువచన ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; రోమా 16లో పునరావృతమయ్యే పలకరింపు శైలిని నిలుపుతుంది.
- source_word: Ἀπελλῆν
  choice: అపెల్లె
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించింది.
- source_word: τὸν δόκιμον
  choice: యోగ్యుడని రుజువైన
  rationale: పరీక్షకు నిలిచి ఆమోదయోగ్యుడిగా తేలిన వ్యక్తి అనే δόκιμος భావాన్ని సహజంగా వ్యక్తపరుస్తుంది; కేవలం ‘ఆమోదించబడిన’ అని చెప్పడం వల్ల కలిగే పరిపాలనా ధ్వనిని నివారిస్తుంది.
- source_word: ἐν Χριστῷ
  choice: మెస్సీయలో
  rationale: పౌలు వాడే సంబంధం/పరిధిని సూచించే ‘లో’ అనే రూపాన్ని నిలుపుతూ, Χριστός యొక్క బిరుదు భావాన్ని ‘మెస్సీయ’గా అనువదిస్తుంది.
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: అరిస్తోబులు ఇంటివారికి
  rationale: అరిస్తోబులు స్వయంగా కాక, అతని గృహానికి లేదా పరివారానికి చెందినవారిని సూచించే సంక్షిప్త గ్రీకు ప్రయోగాన్ని స్పష్టమైన తెలుగు నుడికారంలో అందిస్తుంది.
theological_decisions:
- issue: పౌలు వాడిన ἐν Χριστῷలో Χριστῷ అనువాదం
  choice: మెస్సీయలో
  alternative: క్రీస్తులో
  rationale: Χριστόςలోని బిరుదు భావాన్ని ముందుంచుతూ, పౌలు ఉద్దేశించిన సంబంధం లేదా ఆధ్యాత్మిక పరిధి విషయంలోని సంక్షిప్తతను ‘లో’ ద్వారా యథాతథంగా ఉంచింది. సంప్రదాయ రూపాన్ని పాదటిప్పణిలో ఇచ్చింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘యోగ్యుడని రుజువైన’ అనే రూపం మూలంలోని ప్రశంసాత్మక భావాన్ని సహజంగా తెలియజేస్తుంది; ‘ఇంటివారు’ గృహం/పరివారం అనే భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
