id: ROM.16.26
reference: Romans 16:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: robinson-pierpont-2005-byzantine
  text: φανερωθέντος δὲ νῦν, διά τε γραφῶν προφητικῶν, κατ' ἐπιταγὴν τοῦ αἰωνίου θεοῦ, εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/026.yaml
  text: but[a] has now been revealed, and through the prophetic Scriptures made known to all nations, according to the command of the eternal God, to bring about the obedience of faith,
translation:
  language: te
  text: కానీ ఇప్పుడు బయలుపరచబడి, ప్రవచనాత్మక లేఖనాల ద్వారా నిత్య దేవుని ఆజ్ఞ ప్రకారం విశ్వాసపు విధేయత కోసం సమస్త జనాలకు తెలియజేయబడింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం రోమా 16:25–27లోని ముగింపు స్తోత్రవాక్యానికి కొనసాగింపు. దీని స్థానం, ప్రాచీన ప్రతుల ఆధారాల గురించి రోమా 16:25లోని గమనిక చూడండి.
    reason: textual_critical
lexical_decisions:
- source_word: φανερωθέντος
  choice: బయలుపరచబడి
  rationale: 25వ వచనంలోని ‘మర్మం’తో వ్యాకరణపరంగా అనుసంధానమైన ఈ కృదంతం, ఇంతకు ముందు రహస్యంగా ఉన్నది ఇప్పుడు వెల్లడైందనే భావాన్ని నిలుపుతుంది.
- source_word: γραϕῶν προφητικῶν
  choice: ప్రవచనాత్మక లేఖనాల
  rationale: ‘లేఖనాలు’ పవిత్ర గ్రంథాలను సూచిస్తుంది; ‘ప్రవచనాత్మక’ అనే విశేషణం మూలంలోని προφητικῶνను నేరుగా ప్రతిబింబిస్తుంది.
- source_word: ἐπιταγὴν
  choice: ఆజ్ఞ
  rationale: దేవుని అధికారపూర్వక నిర్దేశాన్ని సహజమైన ఆధునిక తెలుగులో స్పష్టంగా తెలియజేస్తుంది.
- source_word: ὑπακοὴν πίστεως
  choice: విశ్వాస విధేయత
  rationale: πίστεως అనే షష్ఠీ విభక్తి ఉద్దేశపూర్వకంగా కలిగించే సంబంధ-అస్పష్టతను కొంతవరకు నిలుపుతూ, రోమా 1:5తో ఉన్న పదబంధ సంబంధాన్ని కాపాడుతుంది.
- source_word: πάντα τὰ ἔθνη
  choice: సమస్త జనాలకు
  rationale: యూదేతరులను మాత్రమే అని సంకుచితం చేయకుండా, ప్రకటన యొక్క సార్వత్రిక పరిధిని తెలిపే సహజ తెలుగు ప్రయోగం.
theological_decisions:
- issue: ὑπακοὴ πίστεως అనే పదబంధంలో విశ్వాసం–విధేయత సంబంధం
  choice: విశ్వాస విధేయత
  alternative: విశ్వాసం వల్ల కలిగే విధేయత / విశ్వాసానికి విధేయత
  rationale: మూలంలోని షష్ఠీ సంబంధం కారణం, స్వభావం లేదా లక్ష్యం అనే అర్థాలకు అవకాశం ఇస్తుంది. వాటిలో ఒక్కదానిని వ్యాఖ్యానాత్మకంగా ఖరారు చేయకుండా సంక్షిప్త సంయుక్త పదబంధాన్ని ఎంచుకున్నాం.
- issue: క్రియల కర్త మరియు 25వ వచనంతో అనుసంధానం
  choice: కర్తను ఈ వచనంలో పునరుక్తి చేయకుండా కర్మణి నిర్మాణాన్ని కొనసాగించడం
  alternative: ఆ మర్మం ఇప్పుడు బయలుపరచబడింది
  rationale: గ్రీకు వాక్యం 25–27 వచనాల దీర్ఘ స్తోత్రవాక్యంలో భాగం; φανερωθέντος, γνωρισθέντος పదాలు ముందున్న ‘మర్మం’ను సూచిస్తాయి. మూల నిర్మాణాన్ని, కొనసాగింపును కాపాడేందుకు ఈ వచనంలో నామవాచకాన్ని చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. మూలంలోని దీర్ఘ వాక్య కొనసాగింపును చూపేందుకు ఆరంభంలో ‘అయితే’ను ఉంచి, కృదంత-కర్మణి నిర్మాణాన్ని నిలిపాం. పాదసూచిక గుర్తును ప్రధాన పాఠ్యంలో చేర్చాం.
