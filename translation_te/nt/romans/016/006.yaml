  text: Greet Mary[a], who has worked very hard for you.
translation:
  language: te
  text: మరియకు అభివందనాలు తెలియజేయండి; ఆమె మీ కోసం ఎంతో కష్టపడి పనిచేసింది.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో “మీ కోసం” బదులుగా “మా కోసం” లేదా “మీ మధ్య” అని ఉంది.
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: అభివందనాలు చెప్పండి
  rationale: పత్రికా సందర్భంలో పలకరింపులు తెలియజేయమనే బహువచన ఆజ్ఞను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Μαριάμ
  choice: మరియ
  rationale: బైబిలు తెలుగులో విస్తృతంగా గుర్తించబడే, గ్రీకు Μαριάμ పేరుకు స్థిరపడిన రూపం.
- source_word: ἥτις
  choice: …చేసిన
  rationale: మరియను గురించి వివరించే సంబంధవాచక ఉపవాక్యాన్ని తెలుగులో సహజంగా కృదంత నిర్మాణంతో అందిస్తుంది; స్వల్ప గుణవిశేష భావాన్ని అనవసరంగా విస్తరించదు.
- source_word: πολλὰ
  choice: ఎంతో కష్టపడి
  rationale: క్రియావిశేషణంగా వచ్చి శ్రమ పరిమాణాన్ని తీవ్రపరుస్తుంది; ఆధునిక తెలుగులో శ్రమ తీవ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: ἐκοπίασεν
  choice: పనిచేసిన
  rationale: κοπιάωలోని కఠిన శ్రమ భావాన్ని ‘కష్టపడి పనిచేసిన’ అనే సమగ్ర పదబంధం స్పష్టంగా అందిస్తుంది; గ్రీకు ఏకకాల గతక్రియను తెలుగు కృదంతం సహజంగా ప్రతిబింబిస్తుంది.
- source_word: εἰς ὑμᾶς
  choice: మీ కోసం
  rationale: SBLGNT పాఠంలోని దిశ లేదా ప్రయోజన భావాన్ని ఇక్కడ అత్యంత సహజంగా తెలియజేస్తుంది; ప్రత్యామ్నాయ పాఠాలను ప్రధాన వాక్యంలో కలపదు.
theological_decisions:
- issue: చివరి పదబంధంలోని పాఠాంతరం
  choice: మీ కోసం
  alternative: మా కోసం; మీ మధ్య
  rationale: అందించిన SBLGNT పాఠం εἰς ὑμᾶς (‘మీ కోసం’) అని ఉంది. εἰς ἡμᾶς (‘మా కోసం’), ἐν ὑμῖν (‘మీ మధ్య’) అనే పాఠాంతరాలను పాదసూచికలో భద్రపరచి, ప్రధాన పాఠంలో మూల సంచికను అనుసరించాం.
translation_notes:
  register: సాధారణ పాఠకులకు అర్థమయ్యే ఆధునిక ప్రామాణిక తెలుగు; పత్రికా అభివందన సందర్భానికి తగిన గౌరవప్రదమైన, సంక్షిప్త శైలి. పాదసూచిక గుర్తు వ్యక్తిపేరు తరువాత ఉంచి ఆంగ్ల సంప్రదింపు పాఠంతో సరిపోల్చాం; సూచికలో వివరించేది వాక్యాంత పాఠాంతరమే.
