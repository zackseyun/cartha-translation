  text: Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/025.yaml
  text: '[A] to him who is able to strengthen you according to my gospel and the preaching of Jesus the Messiah, according to the revelation of the mystery kept secret for long ages,'
translation:
  language: te
  text: '[a] నా సువార్తను బట్టి, యేసు మెస్సీయ యొక్క ప్రకటనా సందేశాన్ని[b] బట్టి, మిమ్మల్ని బలపరచగలవానికి, యుగయుగాలుగా మౌనంగా ఉంచబడిన మర్మపు బయలుపాటు ప్రకారం—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 25–27 వచనాల ముగింపు స్తోత్రవాక్యం ప్రాచీన ప్రతుల్లో వేర్వేరు చోట్ల కనిపిస్తుంది. బైజాంటైన్ అధికసంఖ్యాక ప్రతుల సంప్రదాయంలో ఇది 14వ అధ్యాయం చివర ఉంది; ఇప్పటివరకు లభించిన అత్యంత ప్రాచీన పపైరస్ ప్రతిలో 15వ అధ్యాయం తరువాత ఉంది; ముఖ్యమైన నాలుగో శతాబ్దపు ప్రతుల్లోను లాటిన్ సంప్రదాయంలోను ఇక్కడ, 16వ అధ్యాయం చివర ఉంది. కొన్ని ప్రతుల్లో ఇది ఒకటి కంటే ఎక్కువ చోట్ల ఉండగా, మరికొన్నింటిలో పూర్తిగా లేదు. ఆధునిక అనువాదాల్లో చాలావరకు దీనిని పౌలు పత్రిక ముగింపుగా ఇక్కడే ఉంచుతాయి.
    reason: textual_critical
  - marker: b
    text: “యేసు మెస్సీయ యొక్క ప్రకటనా సందేశం” అనే మాటకు యేసు మెస్సీయను గురించిన సందేశం అనే అర్థమూ, యేసు మెస్సీయ ప్రకటించిన సందేశం అనే అర్థమూ ఉండవచ్చు.
