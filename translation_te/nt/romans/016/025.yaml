lexical_decisions:
- source_word: στηρίξαι
  choice: స్థిరపరచగల
  rationale: విశ్వాసులను దృఢంగా నిలబెట్టడం, బలపరచడం అనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: τὸ κήρυγμα Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయను గురించిన ప్రకటన
  rationale: κήρυγμα అనేది ప్రకటించబడే సందేశాన్ని సూచిస్తుంది. గ్రీకు షష్ఠీ విభక్తి కర్తృ లేదా కర్మ సంబంధంగా అర్థమవగలదు; సందర్భానికి సహజమైన కర్మసంబంధ భావాన్ని పాఠ్యంలో ఇచ్చి, ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
- source_word: μυστηρίου
  choice: మర్మం
  rationale: మానవులకు ముందుగా దాచబడి, దేవుని బయలుపరచడం ద్వారా తెలిసే సత్యం అనే పౌలు వాడుకను 'మర్మం' సముచితంగా తెలియజేస్తుంది.
- source_word: σεσιγημένου
  choice: మౌనంగా ఉంచబడిన
  rationale: పరిపూర్ణ కర్మణి కృదంతంలోని 'చెప్పబడకుండా ఉంచబడింది' అనే రూపకాన్ని కాపాడుతుంది; కేవలం 'రహస్యంగా ఉంచబడిన' అని భావాన్ని ముందే పరిష్కరించదు.
- source_word: χρόνοις αἰωνίοις
  choice: యుగయుగాలుగా
  rationale: అతి దీర్ఘమైన గతకాల వ్యవధిని సహజమైన తెలుగులో తెలియజేస్తుంది; ఇక్కడ అక్షరార్థమైన 'నిత్య కాలాలు' అసహజంగా ఉంటుంది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ లో Χριστός అనువాదం
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: Χριστόςను కేవలం పేరుగా కాక అభిషిక్త రాజు అనే బిరుదుగా చూపేందుకు 'మెస్సీయ' వాడాం.
- issue: τὸ κήρυγμα Ἰησοῦ Χριστοῦ లో షష్ఠీ విభక్తి సంబంధం
  choice: యేసు మెస్సీయను గురించిన ప్రకటన
  alternative: యేసు మెస్సీయ చేసిన ప్రకటన
  rationale: గ్రీకు వాక్యభాగం రెండింటినీ అనుమతిస్తుంది. పౌలు సువార్త ప్రకటనా సందర్భంలో యేసు మెస్సీయ విషయమైన సందేశం ప్రధాన సంభావ్యత; నిజమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
