  register: ఆధునిక ప్రామాణిక తెలుగు; స్తోత్రవాక్యపు దీర్ఘ నిర్మాణం తదుపరి వచనాల్లో పూర్తవుతుందనే విషయాన్ని చూపేందుకు డ్యాష్‌తో అసంపూర్ణ వాక్యప్రవాహాన్ని నిలిపాం. అయితే [b] గుర్తు ప్రధాన పాఠ్యంలో తప్పనిసరిగా ఉండాలి.
