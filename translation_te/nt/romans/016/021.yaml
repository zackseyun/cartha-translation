id: ROM.16.21
reference: Romans 16:21
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: te
  text: నా తోటి సేవకుడైన తిమోతి మీకు అభివందనాలు చెబుతున్నాడు. అలాగే నా బంధువులైన[a] లూకియ, యాసోను, సోసిపత్రు కూడా మీకు అభివందనాలు చెబుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “నా రక్తసంబంధీకులు”; లేదా “నా తోటి యూదులు.” గ్రీకు పదం కుటుంబ బంధాన్ని గానీ, విస్తృత వంశీయ లేదా జాతిపరమైన అనుబంధాన్ని గానీ సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται ὑμᾶς
  choice: మీకు అభివందనాలు చెబుతున్నాడు
  rationale: పత్రికా సందర్భంలో ἀσπάζομαι అంటే అభివందనాలు తెలియజేయడం. తెలుగు వాక్యనిర్మాణంలో ఇది సహజంగా ఉండి, క్రియ ఏకవచనంగా తిమోతికి సంబంధించినదనే విషయాన్ని నిలుపుతుంది.
- source_word: συνεργός
  choice: తోటి సేవకుడు
  rationale: సహకారంతో చేసే పరిచర్య పనిని సూచిస్తుంది. ‘తోటి సేవకుడు’ సంఘసంబంధ సందర్భంలో సహజంగా ఉండి, ఆధునిక వృత్తిపరమైన పదజాలాన్ని నివారిస్తుంది.
- source_word: Λούκιος
  choice: లూకియ
  rationale: గ్రీకు పేరును తెలుగు బైబిలు నామరూప సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: Ἰάσων
  choice: యాసోను
  rationale: గ్రీకు ఉచ్చారణను, తెలుగు బైబిలు నామరూప సంప్రదాయాన్ని దృష్టిలో ఉంచిన రూపం.
- source_word: Σωσίπατρος
  choice: సోసిపత్రు
  rationale: ఈ వచనంలోని పూర్తి గ్రీకు రూపాన్నే అనుసరిస్తుంది; వేరొకచోట కనిపించే సంక్షిప్త రూపాన్ని ఇక్కడికి దిగుమతి చేయదు.
- source_word: συγγενεῖς μου
  choice: నా బంధువులు
  rationale: ‘బంధువులు’ అనే పదం కుటుంబ సంబంధాన్ని సూచించగలదే గాక, విస్తృత వంశీయ లేదా జాతిపరమైన అనుబంధాన్నీ సందర్భానుసారం సూచించగలదు. ప్రత్యామ్నాయ భావాలను పాదసూచికలో ఉంచి మూలంలోని అస్పష్టతను కాపాడింది.
theological_decisions:
- issue: సుగ్గెనేస్ మూ (συγγενεῖς μου) అనే పదబంధం యొక్క పరిధి
  choice: నా బంధువులు
  alternative: నా రక్తసంబంధీకులు; నా తోటి యూదులు
  rationale: గ్రీకు పదం సన్నిహిత కుటుంబ బంధాన్ని లేదా విస్తృత వంశీయ/జాతిపరమైన అనుబంధాన్ని సూచించవచ్చు. ఈ వచనం ఏ భావమో ఖచ్చితంగా తేల్చదు కాబట్టి ప్రధాన పాఠ్యంలో విస్తృతమైన పదాన్ని ఉంచి, ప్రత్యామ్నాయాలను పాదసూచికలో తెలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. మొదటి గ్రీకు క్రియ ఏకవచనంగా ఉన్నందున తిమోతిని ప్రత్యేక వాక్యంలో ఉంచి, మిగిలిన ముగ్గురి అభివందనాలను రెండవ వాక్యంలో సహజంగా వ్యక్తం చేసింది.
