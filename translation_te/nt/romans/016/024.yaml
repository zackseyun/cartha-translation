id: ROM.16.24
reference: Romans 16:24
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν.⸃ ⸀Ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/024.yaml
  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: te
  text: మన ప్రభువైన యేసు మెస్సీయ[a] కృప మీ అందరితో ఉండుగాక.[b] ఆమేన్.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'లేదా: “యేసు క్రీస్తు.” గ్రీకు Χριστός అంటే “అభిషిక్తుడు”; దానిని సంప్రదాయంగా “క్రీస్తు” అని కూడా లిప్యంతరీకరిస్తారు.'
    reason: alternative_reading
  - marker: b
    text: కొన్ని ప్రాచీన ప్రతుల్లో ఈ వచనం ఉంది; మరికొన్నిటిలో లేదు. అందువల్ల అనేక ఆధునిక గ్రీకు పాఠసంచికలు రోమా పత్రిక ముగింపులో దీనిని పాఠాంతరంగా గుర్తిస్తాయి.
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: కృప
  rationale: పౌలు ఆశీర్వచనాలలో వాడే ఈ పదం దేవుని అనుగ్రహపూర్వక దయను, వరాన్ని సూచిస్తుంది; ‘కృప’ దాని స్థిరమైన వేదాంతార్థాన్ని, సహజమైన తెలుగు ప్రయోగాన్ని నిలుపుతుంది.
- source_word: κυρίου
  choice: ప్రభువు
  rationale: యేసు అధికారాన్ని, ప్రభుత్వాన్ని తెలిపే క్రీస్తుసంబంధ బిరుదుగా κύριοςకు ‘ప్రభువు’ సహజమైన, స్థిరమైన తెలుగు రూపం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Ἰησοῦ వ్యక్తినామాన్ని ‘యేసు’గా లిప్యంతరీకరించి, Χριστοῦను ‘అభిషిక్తుడు’ అనే బిరుదు భావాన్ని నిలిపే ‘మెస్సీయ’గా ఇచ్చాం. తెలుగులో సుపరిచితమైన ‘యేసు క్రీస్తు’ను పాదసూచికలో ప్రత్యామ్నాయంగా చూపించాం.
- source_word: μετὰ πάντων ὑμῶν
  choice: మీ అందరితో
  rationale: μετάతో కూడిన ఈ పదబంధం సమస్త పాఠకులను చేర్చే ‘మీ అందరితో’ అనే అర్థాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Ἀμήν
  choice: ఆమేన్
  rationale: ఆరాధనా, ప్రార్థనా సందర్భాల్లో స్థిరపడిన తెలుగు లిప్యంతరీకరణను ఉంచడం వల్ల ముగింపు ధృవీకరణ భావం స్పష్టంగా ఉంటుంది.
theological_decisions:
- issue: Ἰησοῦ Χριστοῦలో Χριστός పదాన్ని ఎలా ఇవ్వాలి
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός వ్యక్తినామంలా మాత్రమే కాక యేసు యొక్క అభిషిక్త బిరుదుగానూ పనిచేస్తుంది. అందువల్ల మూలార్థాన్ని పారదర్శకంగా నిలిపేందుకు ‘మెస్సీయ’ను ప్రధాన పాఠంలో ఉంచి, సంప్రదాయ లిప్యంతరీకరణ ‘క్రీస్తు’ను పాదసూచికలో ఇచ్చాం.
- issue: ఆశీర్వచన వాక్యంలోని క్రియాభావం
  choice: ఉండుగాక
  alternative: ఉంది
  rationale: గ్రీకు నామవాక్యంలో క్రియ ప్రత్యక్షంగా లేకపోయినా, పౌలు ముగింపు ఆశీర్వచనపు సహజమైన అభిలాషార్థాన్ని ‘ఉండుగాక’ వ్యక్తం చేస్తుంది; దానిని వివరణాత్మక ప్రకటనగా మార్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు స్పష్టమైన ఆశీర్వచన శైలి వాడబడింది. ‘మన ప్రభువైన’ అనే నిర్మాణం τοῦ κυρίου ἡμῶν సంబంధాన్ని సహజంగా తెలుపుతుంది; ‘మీ అందరితో’ సమూహమంతటినీ చేర్చే భావాన్ని నిలుపుతుంది.
