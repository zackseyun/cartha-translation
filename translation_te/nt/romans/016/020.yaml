id: ROM.16.20
reference: Romans 16:20
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: te
  text: శాంతి దేవుడు త్వరలోనే సాతానును మీ పాదాల కింద నలిపివేస్తాడు. మన ప్రభువైన యేసు క్రీస్తు కృప మీతో ఉండుగాక.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: శాంతికి మూలమైన దేవుడు
  rationale: గ్రీకు షష్ఠీ విభక్తి పదబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తూ, దేవుడు శాంతికి మూలమనే భావాన్ని తెలియజేస్తుంది; ‘శాంతి దేవుడు’ అనే అసహజ లేదా అపార్థసాధ్య రూపాన్ని నివారిస్తుంది.
- source_word: συντρίψει
  choice: నలిపివేస్తాడు
  rationale: భవిష్యత్ కాలంలోని నిర్ణీత చర్యను నిలుపుతూ, ‘పాదాల కింద’ అనే జయసూచక రూపకంతో సహజంగా సరిపోతుంది.
- source_word: τὸν Σατανᾶν
  choice: సాతానును
  rationale: గ్రీకులో వ్యక్తినామంగా ఉన్న పదాన్ని ప్రామాణిక తెలుగు బైబిలు వాడుకకు అనుగుణంగా లిప్యంతరీకరించింది.
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: మీ పాదాల కింద
  rationale: జయం, లోబరచడం అనే రూపకాన్ని నిలుపుతుంది. ‘మీ’ సమూహ సంబోధనను తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν τάχει
  choice: త్వరలోనే
  rationale: చర్య జరిగే వేగం కంటే కాలసమీపతను ప్రధానంగా సూచించే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἡ χάρις
  choice: కృప
  rationale: పౌలు రచనల్లోని ప్రధాన ధార్మిక పదాన్ని పారిభాషికంగా, సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τοῦ κυρίου ἡμῶν
  choice: మన ప్రభువైన
  rationale: సంబంధార్థాన్ని తెలుగు ఆశీర్వాద వాక్య నిర్మాణంలో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు క్రీస్తు
  rationale: Χριστός ఇక్కడ ఆశీర్వాద సూత్రంలో యేసు పేరుతో స్థిరంగా కలిసిన పేరు-సదృశ వాడుకగా కనిపిస్తుంది; తెలుగులో స్థిరపడిన ‘క్రీస్తు’ రూపం సహజమైనది, అర్థపారదర్శకతను కూడా నిలుపుతుంది.
- source_word: μεθ’ ὑμῶν
  choice: మీకు తోడుగా ఉండుగాక
  rationale: గ్రీకులో అధ్యాహారంగా ఉన్న క్రియను తెలుగు ఆశీర్వాద శైలికి తగిన విధంగా పూరించి, ‘మీతో’ అనే సంబంధాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: చివరి ఆశీర్వాదంలో Χριστοῦ అనువాదం
  choice: క్రీస్తు
  alternative: మెస్సీయ
  rationale: ఈ స్థిర ఆశీర్వాద సూత్రంలో Χριστός యేసు పేరుతో పేరు-సదృశంగా కలిసివుంది. అందువల్ల ఆధునిక ప్రామాణిక తెలుగులో సుపరిచితమైన ‘యేసు క్రీస్తు’ను వాడడం సహజం; ‘మెస్సీయ’ అని మార్చడం ఇక్కడి పేరు-సదృశ ప్రయోగాన్ని అనవసరంగా బిరుదుగా ముందుకు తెస్తుంది.
- issue: దేవుడు సాతానును విశ్వాసుల పాదాల కింద నలిపివేయడం
  choice: దైవిక కార్యం మరియు సమూహ విజయ రూపకం రెండింటినీ యథాతథంగా నిలుపడం
  alternative: దేవుడు సాతానును స్వయంగా తన పాదాల కింద నలిపివేస్తాడు
  rationale: వాక్యం కార్యసాధకుడిగా దేవుణ్ణి, జయస్థానంగా పాఠకుల పాదాలను ఉంచుతుంది. ఈ ధార్మిక ఉద్వేగాన్ని వివరణాత్మకంగా పరిష్కరించకుండా మూలంలోని విధంగానే నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యే, గౌరవప్రదమైన ఆశీర్వాద శైలి. మూలంలోని భవిష్యత్ నిశ్చయార్థం, సమూహ సంబోధన, జయ రూపకం నిలుపబడ్డాయి.
