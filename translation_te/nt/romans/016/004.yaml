review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys that Prisca and Aquila exposed themselves to mortal danger for Paul’s life, and it correctly identifies the wider Gentile churches. However, the Telugu contrast clause is syntactically incomplete and does not clearly retain the sense that Paul is not the only one giving thanks. The Greek has singular τράχηλον (‘neck’) in this idiom; Telugu can preserve this naturally with collective singular ‘తమ మెడను.’
  naturalness: ‘వారికి నేనే కాదు, ... సంఘాలన్నీ కూడా కృతజ్ఞతలు తెలుపుతున్నాయి’ is awkward because ‘నేనే కాదు’ lacks the necessary predicate/contrast structure. Recasting it as ‘కృతజ్ఞతలు తెలిపేది నేనొక్కడినే కాదు’ is clear, natural modern Telugu, and retains Paul’s emphasis.
  terminology: ‘ప్రాణం,’ ‘అన్యజనుల,’ and ‘సంఘాలు’ are appropriate modern standard Telugu renderings in this context. ‘మెడను పణంగా పెట్టారు’ is idiomatic while retaining the source image.
  issues:
  - severity: medium
    issue: The ‘not only I ... but also’ construction is incomplete/unclear in Telugu.
    rationale: The Greek explicitly states that Paul is not the sole person giving thanks. The draft’s ‘వారికి నేనే కాదు’ does not naturally express ‘I am not the only one who gives thanks.’
  - severity: low
    issue: The translation and footnote use plural ‘మెడలను,’ whereas the Greek idiom has singular τράχηλον.
    rationale: A plural can be idiomatic in Telugu for two people, but collective singular ‘తమ మెడను’ more closely preserves the source wording without sacrificing naturalness.
  revised_text: వీరు నా ప్రాణం కోసం తమ మెడను పణంగా పెట్టారు[a]. వారికి కృతజ్ఞతలు తెలిపేది నేనొక్కడినే కాదు, అన్యజనుల[b] సంఘాలన్నీ కూడా.
