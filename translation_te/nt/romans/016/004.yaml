revisions:
- from: వీరు నా ప్రాణం కోసం తమ మెడలను పణంగా పెట్టారు[a]. వారికి నేనే కాదు, అన్యజనుల[b] సంఘాలన్నీ కూడా కృతజ్ఞతలు తెలుపుతున్నాయి.
  to: వీరు నా ప్రాణం కోసం తమ మెడను పణంగా పెట్టారు[a]. వారికి కృతజ్ఞతలు తెలిపేది నేనొక్కడినే కాదు, అన్యజనుల[b] సంఘాలన్నీ కూడా.
  rationale: The revision repairs the Telugu correlative contrast so that Paul, rather than the churches, is explicitly included as one among those giving thanks. It also preserves the Greek singular ‘neck’ in a natural Telugu idiom. Footnote anchors remain attached to the corresponding expressions, and the footnotes are conformed to the revised singular wording.
