id: ROM.16.4
reference: Romans 16:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν, οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ πᾶσαι αἱ ἐκκλησίαι τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/004.yaml
  text: who laid down their own necks for my life[a], to whom not only I give thanks, but also all the churches of the Gentiles[b],
translation:
  language: te
  text: వీరు నా ప్రాణం కోసం తమ మెడను పణంగా పెట్టారు[a]. వారికి కృతజ్ఞతలు తెలిపేది నేనొక్కడినే కాదు, అన్యజనుల[b] సంఘాలన్నీ కూడా.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “తమ మెడను కింద ఉంచారు”; అంటే, ప్రాణాంతక ప్రమాదానికి తమను తాము గురిచేసుకున్నారు.
    reason: గ్రీకు నానుడిలోని ఏకవచన ‘మెడ’ రూపకాన్ని, దాని భావాన్ని వివరిస్తుంది.
  - marker: b
    text: లేదా “జనాల.”
    reason: τῶν ἐθνῶν అనే గ్రీకు పదబంధానికి మరింత అక్షరార్థమైన ప్రత్యామ్నాయాన్ని తెలియజేస్తుంది.
lexical_decisions:
- source_word: οἵτινες
  choice: వీరు
  rationale: ముందటి వచనంలో ప్రస్తావించిన ప్రిస్కిల్ల, అకులలను సూచించే వివరణాత్మక సంబంధవాచకాన్ని తెలుగులో సహజంగా కొనసాగిస్తుంది.
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: నా ప్రాణం కోసం
  rationale: ఇక్కడ ψυχή అమూర్తమైన ఆత్మను కాక, పౌలు భౌతిక ప్రాణాన్ని లేదా జీవితాన్ని సూచిస్తుంది.
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: తమ మెడలను పణంగా పెట్టారు
  rationale: ప్రాణాంతక ప్రమాదానికి తమను తాము గురిచేసుకున్నారనే గ్రీకు నానుడి భావాన్ని, దానిలోని స్పష్టమైన ‘మెడ’ రూపకాన్ని నిలుపుతూ సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ
  choice: వారికి నేనే కాదు ... కూడా కృతజ్ఞతలు తెలుపుతున్నాయి
  rationale: పౌలు ఒక్కడే కాక మరికొందరూ వారికి కృతజ్ఞులనే నొక్కిచెప్పే గ్రీకు వ్యతిరేక సమాంతర నిర్మాణాన్ని నిలుపుతుంది.
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: సంఘాలన్నీ
  rationale: తెలుగు క్రైస్తవ వాడుకలో ἐκκλησίαι అనే స్థానిక విశ్వాసుల సమూహాలకు ‘సంఘాలు’ సహజమైన, విస్తృతంగా అర్థమయ్యే పదం.
- source_word: τῶν ἐθνῶν
  choice: అన్యజనుల
  rationale: పౌలు సందర్భంలో ἔθνη సాధారణంగా యూదేతర ప్రజలను సూచిస్తుంది; ‘అన్యజనులు’ ఆ యూదు–యూదేతర భేదాన్ని స్పష్టంగా ఉంచుతుంది.
theological_decisions:
- issue: ψυχή యొక్క సందర్భార్థం
  choice: ప్రాణం
  alternative: ఆత్మ
  rationale: సందర్భం ప్రాణాంతక ప్రమాదాన్ని, పౌలు ప్రాణరక్షణను సూచిస్తోంది; కాబట్టి ఇక్కడ మానవుని అమూర్త భాగమనే ప్రత్యేక అర్థం ఉద్దేశించబడలేదు.
- issue: ἐθνῶν యొక్క సూచన
  choice: అన్యజనులు
  alternative: దేశాలు / జనాలు
  rationale: రోమీయులకు రాసిన పత్రికలోని యూదు–యూదేతర సందర్భంలో ఇది యూదేతర విశ్వాసుల సంఘాలను అత్యంత సహజంగా సూచిస్తుంది; ‘జనాలు’ అనే అక్షరార్థ ప్రత్యామ్నాయం కూడా సాధ్యమే.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘మెడలను పణంగా పెట్టారు’ అనే సహజ నానుడి ద్వారా మూలంలోని సజీవ రూపకం నిలుపబడింది; సిద్ధాంతపరమైన అదనపు వ్యాఖ్యానం చేర్చలేదు.
