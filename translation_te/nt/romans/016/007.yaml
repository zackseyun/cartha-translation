revisions:
- from: నా బంధువులూ నాతోటి ఖైదీలూ అయిన అంద్రొనీకుకు, యూనియాకు[a] వందనాలు చెప్పండి. వారు అపొస్తలులలో ప్రముఖులు[b]; వారు నాకంటే ముందే మెస్సీయలో ఉన్నారు.
  to: నా బంధువులూ నా సహఖైదీలూ అయిన అంద్రోనికుకూ యూనియాకూ[a] వందనాలు చెప్పండి. వారు అపొస్తలులలో ప్రముఖులు[b]; వారు నాకంటే ముందే మెస్సీయలో ఉన్నారు.
  rationale: 'The revision corrects the transliteration of Andronicus and makes the coordinated dative names idiomatic Telugu. ‘నా సహఖైదీలు’ is a concise, natural equivalent of Paul’s ‘my fellow prisoners.’ No interpretive change has been made: the footnotes continue to preserve both the historically discussed masculine-name alternative and the debated sense of the phrase concerning the apostles.'
