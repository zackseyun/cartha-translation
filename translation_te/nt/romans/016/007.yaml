id: ROM.16.7
reference: Romans 16:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: te
  text: నా బంధువులూ నా సహఖైదీలూ అయిన అంద్రోనికుకూ యూనియాకూ[a] వందనాలు చెప్పండి. వారు అపొస్తలులలో ప్రముఖులు[b]; వారు నాకంటే ముందే మెస్సీయలో ఉన్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘యూనియా’కు బదులుగా ‘యూనియాస్’ అనే పురుషనామంగా కూడా కొందరు అర్థం చేసుకున్నారు; అయితే గ్రీకు రూపం, చారిత్రక నామవాడుక స్త్రీనామమైన ‘యూనియా’కే ఎక్కువ మద్దతు ఇస్తాయి.
    reason: alternative_reading
  - marker: b
    text: ‘అపొస్తలులలో విశిష్టులు’ అని కూడా అనువదించవచ్చు. ఈ పదబంధాన్ని ‘అపొస్తలులకు సుపరిచితులు’ లేదా ‘అపొస్తలుల దృష్టిలో ప్రముఖులు’ అని కూడా అర్థం చేసుకోవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: వందనాలు చెప్పండి
  rationale: పత్రికా సందర్భంలోని ప్రత్యక్ష ఆజ్ఞను సహజమైన ఆధునిక తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: Ἀνδρόνικον
  choice: అంద్రొనీకుకు
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించి, క్రియకు తగిన చతుర్థీ విభక్తి చేర్చబడింది.
- source_word: Ἰουνίαν
  choice: యూనియాకు
  rationale: గ్రీకు రూపం మరియు ప్రాచీన నామవాడుక స్త్రీనామమైన యూనియాను బలపరుస్తాయి; చారిత్రకంగా ప్రభావవంతమైన పురుషనామ ప్రత్యామ్నాయం పాదటిప్పణిలో ఉంచబడింది.
- source_word: συγγενεῖς μου
  choice: నా బంధువులు
  rationale: ఈ పదం రక్తసంబంధులను లేదా ఒకే జాతికి చెందినవారిని సూచించవచ్చు. ‘బంధువులు’ ఆ విస్తృతిని కొంతవరకు నిలుపుతూ సహజంగా ఉంటుంది.
- source_word: συναιχμαλώτους μου
  choice: నాతోటి ఖైదీలు
  rationale: పౌలుతో కలిసి చెర లేదా కారాగార అనుభవం పొందినవారనే స్పష్టమైన అర్థాన్ని ఇస్తుంది.
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: అపొస్తలులలో ప్రముఖులు
  rationale: ἐπίσημοι యొక్క ‘గుర్తింపు పొందిన/ప్రముఖమైన’ భావాన్ని, ἐν యొక్క సహజమైన ‘లో/మధ్య’ అర్థాన్ని దగ్గరగా నిలుపుతుంది; వేరొక సాధ్యమైన వాక్యనిర్మాణ అర్థం పాదటిప్పణిలో ఇవ్వబడింది.
- source_word: πρὸ ἐμοῦ γέγοναν ἐν Χριστῷ
  choice: వారు నాకంటే ముందే మెస్సీయలో ఉన్నారు
  rationale: కాలపూర్వత్వాన్నీ ‘మెస్సీయలో’ అనే పౌలు ప్రయోగాన్నీ వ్యాఖ్యానాత్మకంగా విప్పకుండా కాపాడుతుంది; perfect రూపంలోని కొనసాగుతున్న స్థితిని ‘ఉన్నారు’ తెలియజేస్తుంది.
theological_decisions:
- issue: Ἰουνίαν అనే పేరు యొక్క లింగం
  choice: స్త్రీనామంగా ‘యూనియా’
  alternative: పురుషనామంగా ‘యూనియాస్’
  rationale: గ్రీకు రూపం మరియు చారిత్రక నామవాడుక స్త్రీనామానికే ఎక్కువ ఆధారం ఇస్తాయి; అయినా వ్యాఖ్యాన చరిత్రలోని ప్రత్యామ్నాయం పారదర్శకత కోసం పాదటిప్పణిలో నిలుపబడింది.
- issue: ἐπίσημοι ἐν τοῖς ἀποστόλοις యొక్క భావం
  choice: ‘అపొస్తలులలో ప్రముఖులు’—వారిని అపొస్తలుల వర్గంలో ప్రముఖులుగా చదివే సహజ అర్థం
  alternative: ‘అపొస్తలులకు సుపరిచితులు/వారి దృష్టిలో ప్రముఖులు’—వారిని అపొస్తలుల వర్గంలో చేర్చకుండా చదివే అర్థం
  rationale: గ్రీకు పదబంధం వర్గంలో అంతర్భాగాన్ని సూచించే అర్థానికి సహజంగా సరిపోతుంది; అయితే బాహ్య సంబంధార్థక పఠనం కూడా చర్చనీయమైనందున దాన్ని పాదటిప్పణిలో ఉంచి నిజమైన వ్యాఖ్యాన ఉద్రిక్తతను నిలుపబడింది.
- issue: ἐν Χριστῷ అనువాదం
  choice: ‘మెస్సీయలో’
  alternative: ‘క్రీస్తులో’ లేదా ‘మెస్సీయను విశ్వసించినవారిగా’
  rationale: Χριστός అనే బిరుదు యొక్క మెస్సీయ భావాన్ని, అలాగే ‘లో’ అనే పౌలు సంబంధపదాన్ని వ్యాఖ్యానాత్మక మార్పు లేకుండా కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పత్రికా శైలి. ‘వందనాలు చెప్పండి’ ప్రత్యక్ష ఆజ్ఞను స్పష్టంగా ఉంచుతుంది. ‘అపొస్తలులు’, ‘మెస్సీయలో’ వంటి పదాలు మూలంలోని సంఘసంబంధ, ధార్మిక పదజాలాన్ని నిలుపుతాయి; వివాదాస్పద అంశాలు ప్రధాన పాఠ్యంలో అతిగా పరిష్కరించకుండా పాదటిప్పణుల్లో పారదర్శకంగా చూపబడ్డాయి.
