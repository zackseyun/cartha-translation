source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἡρῳδίωνα τὸν ⸀συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: te
  text: నా స్వజనుడైన[a] హెరోదియోనుకు వందనాలు చెప్పండి. నార్కిస్సుకు చెందినవారిలో[b] ప్రభువులో ఉన్నవారికి వందనాలు చెప్పండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నా బంధువు’ లేదా ‘నా తోటి యూదుడు’ అని కూడా అర్థం కావచ్చు; గ్రీకు పదం రక్తసంబంధిని లేదా పౌలు ప్రజలలోని వ్యక్తిని సూచించగలదు.
    reason: lexical_alternative
  - marker: b
    text: బహుశా ప్రభువును విశ్వసించిన నార్కిస్సు ఇంటివారిని లేదా అతని ఆస్తి వ్యవహారాలతో అనుబంధమున్నవారిని సూచిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: వందనాలు చెప్పండి
  rationale: పత్రికా సందర్భంలోని బహువచన ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా వ్యక్తం చేస్తుంది.
- source_word: Ἡρῳδίωνα
  choice: హెరోదియోను
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగు ధ్వని సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం; విభక్తితో ‘హెరోదియోనుకు’ అయింది.
- source_word: συγγενῆ μου
  choice: నా స్వజనుడు
  rationale: ‘స్వజనుడు’ అనే పదం రక్తసంబంధి లేదా తన ప్రజలకు చెందిన సహజాతి అనే రెండు సాధ్య భావాలనూ కొంతవరకు నిలుపుతుంది; ఏ ఒక్క భావాన్నీ ప్రధాన పాఠ్యంలో నిర్బంధించదు.
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: నార్కిస్సుకు చెందినవారిలో
  rationale: నార్కిస్సుతో వారి అనుబంధాన్ని తెలుపుతుంది; మూలంలో స్పష్టంగా లేని ‘ఇంటివారు’ లేదా ‘గృహస్థులు’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: ప్రభువులో ఉన్నవారు
  rationale: పౌలు వాడే ‘ప్రభువులో’ అనే ముఖ్యమైన భావవ్యక్తీకరణను వివరణాత్మకంగా మార్చకుండా నిలుపుతుంది.
- source_word: κυρίῳ
  choice: ప్రభువు
  rationale: ఈ పౌలు సంబంధిత క్రైస్తవ సందర్భంలో κύριοςకు సహజమైన, స్థిరమైన తెలుగు సమానార్థకం.
theological_decisions:
- issue: συγγενής అనే పదం సూచించే సంబంధం
  choice: ‘నా స్వజనుడు’ అని విస్తృతంగా అనువదించాం.
  alternative: ‘నా బంధువు’ లేదా ‘నా తోటి యూదుడు’
  rationale: ఈ గ్రీకు పదం రక్తసంబంధిని లేదా పౌలు ప్రజలకు చెందిన తోటి యూదుణ్ణి సూచించవచ్చు. వాక్యం ఏ భావాన్నీ ఖచ్చితంగా నిర్ణయించనందున అస్పష్టతను నిలిపాం.
- issue: నార్కిస్సుతో అనుబంధమున్నవారి పరిధి
  choice: ‘నార్కిస్సుకు చెందినవారు’ అని మాత్రమే పేర్కొన్నాం.
  alternative: ‘నార్కిస్సు ఇంటివారు’ లేదా ‘నార్కిస్సు గృహానికి చెందినవారు’
  rationale: గ్రీకు వాక్యబంధం నార్కిస్సుతో అనుబంధాన్ని సూచిస్తుంది గానీ ‘ఇల్లు/గృహం’ అనే నామవాచకాన్ని స్పష్టంగా ఉపయోగించదు. అందుచేత సాధ్యమైన గృహార్థాన్ని పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సరళమైన, గౌరవప్రదమైన పత్రికా శైలి వాడాం. ‘ప్రభువులో’ అనే పౌలు ప్రత్యేక పదబంధాన్ని యథాతథ భావంతో నిలిపాం; మూలంలో ఉన్న సంబంధసూచక అస్పష్టతలను పాదటిప్పణులతో సంరక్షించాం.
