translation:
  language: te
  text: ఏకైక జ్ఞానవంతుడైన దేవునికి, యేసు మెస్సీయ ద్వారా, ఆయనకు యుగయుగాలూ మహిమ కలుగుగాక. ఆమేన్.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ఈ వచనం రోమా 16:25–27లోని ముగింపు స్తుతివాక్యాన్ని పూర్తి చేస్తుంది. రోమా 16:25లో సూచించినట్లుగా, ప్రాచీన ప్రతులలో ఈ స్తుతివాక్యం ఉన్న స్థానం, అది చేర్చబడిందా లేదా అన్న విషయం గణనీయంగా మారుతూ ఉంటుంది; అయితే ఇక్కడ అనుసరించిన బైజాంటైన్ మెజారిటీ పాఠసంప్రదాయంలో ఇది ఈ స్థానంలో ఉంది.
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ σοφῷ θεῷ
  choice: ఏకైక జ్ఞానవంతుడైన దేవునికి
  rationale: దేవుడే పరమ జ్ఞానానికి ఏకైక అధికారి అనే భావాన్ని, గ్రీకు దత్తివిభక్తి నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ ద్వారా
  rationale: διά + షష్ఠీ విభక్తి సాధనాన్ని లేదా మధ్యవర్తిత్వాన్ని సూచిస్తుంది; Χριστόςను వ్యక్తిపేరుగా కాక ‘మెస్సీయ’ అనే బిరుదుగా అనువదించాం.
- source_word: ᾧ ἡ δόξα
  choice: మహిమ కలుగుగాక
  rationale: శబ్దార్థంగా ‘ఎవరికి మహిమ’ అయిన ఈ స్తుతివాక్యాన్ని తెలుగులో సహజమైన ఆశీర్వచన రూపంలో అందిస్తుంది; సంబంధసర్వనామ సూచనలోని అస్పష్టతను ప్రధాన వాక్యంలో బలవంతంగా పరిష్కరించకుండా ఉంచుతుంది.
- source_word: εἰς τοὺς αἰῶνας
  choice: యుగయుగాలూ
  rationale: ‘యుగాల వరకు’ అనే గ్రీకు నుడికారంలోని నిరంతర కాలార్థాన్ని గౌరవప్రదమైన, సుపరిచితమైన తెలుగు బైబిలు శైలిలో వ్యక్తం చేస్తుంది.
- source_word: Ἀμήν
  choice: ఆమేన్
  rationale: సమాజ ఆమోదం మరియు ధృవీకరణను తెలిపే సంప్రదాయ రూపాన్ని నిలుపుతుంది.
theological_decisions:
- issue: ᾧ అనే సంబంధసర్వనామానికి పూర్వపదం
  choice: ప్రధాన పాఠ్యంలో ‘ఎవరికి’ అని స్పష్టంగా చేర్చకుండా స్తుతివాక్య నిర్మాణంతో అస్పష్టతను నిలుపుట
  alternative: ‘ఆ దేవునికే’ లేదా ‘యేసు మెస్సీయకే’ అని నిర్దిష్టీకరించడం
  rationale: గ్రీకులో ᾧ అనేది ‘దేవుడు’ లేదా సమీపంలోని ‘యేసు క్రీస్తు’ను సూచించగల స్వల్ప వ్యాకరణ అస్పష్టతను కలిగిస్తుంది; అనువాదం దానిని సిద్ధాంతపరంగా పరిష్కరించకూడదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయితే స్తుతివాక్యానికి తగిన గౌరవప్రదమైన ధోరణితో. [a] గుర్తును వచనాంతంలో ఉంచి మొత్తం ముగింపు స్తుతివాక్యానికి సంబంధించిన పాఠాంతర గమనికతో అనుసంధానించాం.
