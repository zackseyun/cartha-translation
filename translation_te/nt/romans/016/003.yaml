  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: te
  text: మెస్సీయ యేసులో నా తోటి పనివారైన ప్రిస్కాను[a], అకులాను పలకరించండి[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ప్రిస్కా అనేది మూలపాఠంలోని పేరురూపం; ఇతర చోట్ల ఇదే వ్యక్తిని మరింత సుపరిచితమైన ‘ప్రిస్కిల్లా’ అనే పేరుతో పేర్కొన్నారు.
    reason: alternative_reading
  - marker: b
    text: '‘మెస్సీయ యేసులో’ అనే మాటలకు సంప్రదాయ అనువాదం: ‘క్రీస్తు యేసులో.’'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: పలకరించండి
  rationale: ఇది పత్రికా సందర్భంలో శుభాభినందనలు తెలియజేయమనే రెండవ పురుష బహువచన ఆజ్ఞ. ఆధునిక తెలుగులో ‘పలకరించండి’ సహజంగా, సంక్షిప్తంగా ఆ భావాన్ని వ్యక్తపరుస్తుంది.
- source_word: Πρίσκαν
  choice: ప్రిస్కా
  rationale: మూలపాఠంలో ఉన్న Πρίσκα అనే పేరురూపాన్నే లిప్యంతరీకరించింది; ఇతర చోట్ల కనిపించే ‘ప్రిస్కిల్లా’ రూపంతో దీనిని మార్చలేదు.
- source_word: Ἀκύλαν
  choice: అకులా
  rationale: Ἀκύλας అనే వ్యక్తినామానికి గ్రీకు ఉచ్చారణను అనుసరించిన తెలుగు లిప్యంతరీకరణ.
- source_word: τοὺς συνεργούς μου
  choice: నా తోటి పనివారైన
  rationale: వారు పౌలుతో కలిసి ఒకే సేవాకార్యంలో పనిచేసినవారనే సహకార భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ యేసులో
  rationale: ἐν అనే పదం సంబంధం లేదా కార్యం జరిగే ఆధ్యాత్మిక పరిధిని సూచిస్తుంది. Χριστός ఇక్కడ యేసు యొక్క అభిషిక్త రాజు అనే బిరుదు భావాన్ని కలిగి ఉండడంతో ‘మెస్సీయ’ అని అనువదించబడింది.
theological_decisions:
- issue: పౌలు ఉపయోగించిన ἐν Χριστῷ Ἰησοῦ అనే సూత్రప్రాయ పదబంధంలో Χριστῷ అనువాదం
  choice: మెస్సీయ యేసులో
  alternative: క్రీస్తు యేసులో
  rationale: Χριστός యొక్క ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదు భావాన్ని ప్రధాన పాఠంలో స్పష్టంగా ఉంచింది. తెలుగులో సుపరిచితమైన ‘క్రీస్తు యేసులో’ అనే రూపాన్ని పాదసూచికలో ప్రత్యామ్నాయంగా ఇచ్చింది; పదబంధంలోని సంబంధం లేదా ఐక్యత భావాన్ని మరింత నిర్దిష్టంగా వివరించి పరిమితం చేయలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకు వాక్యంలోని ప్రధాన పదక్రమాన్ని యథాతథంగా అనుకరించకుండా, తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా క్రియను చివర ఉంచింది. పాదసూచిక గుర్తులు రెండూ ప్రధాన పాఠంలో ఉన్నాయి.
