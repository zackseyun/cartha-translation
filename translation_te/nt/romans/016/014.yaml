id: ROM.16.14
reference: Romans 16:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, ⸂Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν⸃ καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: te
  text: అసుంక్రితును, ఫ్లెగోనును, హెర్మేసును, పత్రొబాసును, హెర్మాసును, వారితో ఉన్న సోదరులను పలకరించండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: పలకరించండి
  rationale: పౌలు ముగింపు అభివందనాల సందర్భంలో ఉన్న బహువచన ఆజ్ఞను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సంక్షిప్తంగా వ్యక్తపరుస్తుంది.
- source_word: Ἀσύγκριτον
  choice: అసుంక్రితు
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం; విభక్తి కోసం ప్రధాన పాఠంలో ‘అసుంక్రితును’ అని ఇచ్చాం.
- source_word: Φλέγοντα
  choice: ఫ్లెగోను
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగు ధ్వన్యనుసారంగా లిప్యంతరీకరించాం; ప్రధాన పాఠంలో కర్మవిభక్తి రూపం వాడాం.
- source_word: Ἑρμῆν
  choice: హెర్మేసు
  rationale: ఇక్కడ ఇది వ్యక్తినామం; తరువాత వచ్చే Ἑρμᾶν నుండి తేడా స్పష్టంగా ఉండేలా ‘హెర్మేసు’ అని లిప్యంతరీకరించాం.
- source_word: Πατροβᾶν
  choice: పత్రొబాసు
  rationale: మూల గ్రీకు ఉచ్చారణకు దగ్గరగా ఉండే తెలుగు లిప్యంతరీకరణ; ప్రధాన పాఠంలో కర్మవిభక్తి రూపం వాడాం.
- source_word: Ἑρμᾶν
  choice: హెర్మాసు
  rationale: ముందున్న Ἑρμῆν (‘హెర్మేసు’)తో కలవకుండా ప్రత్యేక వ్యక్తినామంగా లిప్యంతరీకరించాం.
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: వారితో ఉన్న సోదరులను
  rationale: σὺν αὐτοῖς అనే సహవాస భావాన్ని ‘వారితో ఉన్న’ అని నేరుగా తెలిపి, వ్యాకరణపరంగా పుంలింగ బహువచనమైన ἀδελφούςను ‘సోదరులు’గా నిలిపాం.
theological_decisions:
- issue: సమూహ అభివందనంలో ἀδελφούς అనువాదం
  choice: సోదరులు
  alternative: సోదర సోదరీమణులు; తోటి విశ్వాసులు
  rationale: గ్రీకు పదం స్పష్టంగా పుంలింగ బహువచనంలో ఉంది. ఈ సందర్భం మిశ్రలింగ సమూహాన్ని తప్పనిసరిగా సూచించనందున మూలరూపాన్ని ‘సోదరులు’గా నిలిపాం; అయితే పౌలు వాడుకలో ఇది తోటి విశ్వాసులను సూచించగలదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ముగింపు అభివందన శైలి. పేర్లను గ్రీకు రూపాల ఆధారంగా లిప్యంతరీకరించి, హెర్మేసు/హెర్మాసు మధ్య తేడాను కాపాడాం. పాఠంలో పాదసూచిక అవసరం లేదు; అందువల్ల గుర్తులు చేర్చలేదు.
