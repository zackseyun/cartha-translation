source:
  edition: SBLGNT
  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: te
  text: ఒకరినొకరు పవిత్రమైన ముద్దుతో పలకరించుకోండి.[a] మెస్సీయకు చెందిన సంఘాలన్నీ మీకు అభివాదాలు తెలుపుతున్నాయి.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “పవిత్రమైన ముద్దు” అనేది విశ్వాసుల మధ్య పవిత్రమైన ఆప్యాయతను, సహవాసాన్ని వ్యక్తం చేసే, ఆ సంస్కృతిలో గుర్తింపు పొందిన పలకరింపు.
    reason: cultural_note
  - marker: b
    text: లేదా, “క్రీస్తుకు చెందిన సంఘాలన్నీ మీకు అభివాదాలు తెలుపుతున్నాయి.”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: ఒకరినొకరు అభివాదం చేసుకోండి
  rationale: ἀσπάσασθε అనేది పలకరించమనే ఆజ్ఞ; ἀλλήλους పరస్పరార్థాన్ని తెలియజేస్తుంది. ఆధునిక ప్రామాణిక తెలుగులో ఈ రూపం సహజంగాను స్పష్టంగాను ఉంది.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: పవిత్రమైన ముద్దుతో
  rationale: ἐν ఇక్కడ సాధనార్థకంగా ఉంది; φίλημα అంటే ‘ముద్దు,’ ἁγίῳ దాని పవిత్రమైన, పరిశుద్ధ సహవాస సంబంధ స్వభావాన్ని తెలియజేస్తుంది.
- source_word: Ἀσπάζονται ὑμᾶς
  choice: మీకు అభివాదాలు తెలుపుతున్నారు
  rationale: లేఖా సందర్భంలో ἀσπάζονται అనేది అభివాదాలు పంపడం లేదా తెలపడం అనే భావాన్ని ఇస్తుంది; ὑμᾶς బహువచన సంబోధనను ‘మీకు’ సహజంగా వ్యక్తం చేస్తుంది.
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: సంఘాలన్నీ
  rationale: నిర్దిష్ట సమూహంలోని సంఘాలన్నిటినీ సూచించే గ్రీకు నిర్మాణంలోని సమగ్ర బలాన్ని ఈ రూపం నిలుపుతుంది.
- source_word: τοῦ Χριστοῦ
  choice: మెస్సీయకు చెందిన
  rationale: Χριστός ఇక్కడ బిరుదుగా గ్రహించదగినది; ‘మెస్సీయ’ దాని అభిషిక్తుడనే భావాన్ని నిలుపుతుంది. సంబంధార్థక షష్ఠీని సహజ తెలుగులో ‘చెందిన’గా వ్యక్తం చేశాం.
theological_decisions:
- issue: Χριστοῦ పదాన్ని ఎలా అనువదించాలి
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός బిరుదు భావాన్ని కలిగి ఉండగలదు కాబట్టి ప్రధాన పాఠ్యంలో ‘మెస్సీయ’ను ఉంచాం. తెలుగు క్రైస్తవ వాడుకలో సుపరిచితమైన ‘క్రీస్తు’ రూపాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో ఇచ్చి, భావాన్ని ఏకపక్షంగా నిర్ణయించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన లేఖా శైలిని వాడాం. ‘అభివాదం చేసుకోండి’ పరస్పర ఆజ్ఞను, ‘అభివాదాలు తెలుపుతున్నారు’ లేఖా పలకరింపును స్పష్టంగా వేరు చేస్తాయి. అన్ని పాదసూచిక సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
