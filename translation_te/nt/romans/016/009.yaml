id: ROM.16.9
reference: Romans 16:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: te
  text: క్రీస్తులో మా సహోద్యోగియైన ఉర్బానుస్‌కు, నాకు ప్రియమైన స్తాకిస్‌కు వందనాలు చెప్పండి.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: వందనాలు చెప్పండి
  rationale: ఈ వందనాల జాబితాలోని బహువచన ఆజ్ఞను ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: Οὐρβανὸν
  choice: ఉర్బాను
  rationale: గ్రీకు రూపంలోని వ్యక్తిపేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం; విభక్తితో ‘ఉర్బానుకు’ అయింది.
- source_word: συνεργὸν ἡμῶν
  choice: మాతో కలిసి పనిచేసే
  rationale: సహకారంతో పని చేసే వ్యక్తి అనే συνεργός భావాన్ని సహజమైన తెలుగులో తెలియజేస్తూ, ἡμῶν సూచించే పౌలు మరియు అతని సహచరులతోని భాగస్వామ్యాన్ని నిలుపుతుంది.
- source_word: ἐν Χριστῷ
  choice: క్రీస్తులో
  rationale: ἐν అనే సంబంధాన్ని ‘లో’తో నేరుగా నిలుపుతూ, Χριστόςకు తెలుగులో స్థిరపడిన బిరుదు రూపమైన ‘క్రీస్తు’ను వాడాం.
- source_word: Στάχυν
  choice: స్తాకు
  rationale: గ్రీకు వ్యక్తిపేరును తెలుగు ఉచ్చారణకు అనుగుణంగా లిప్యంతరీకరించాం; విభక్తితో ‘స్తాకుకు’ అయింది.
- source_word: ἀγαπητόν μου
  choice: నాకు ప్రియమైన
  rationale: పౌలుకు వ్యక్తిగతంగా ప్రియమైనవాడు అనే ఆప్యాయ భావాన్ని సహజంగా తెలియజేస్తుంది; మూలంలోని పుంలింగ సూచన తెలుగులో పేరు, సందర్భం ద్వారా గ్రహించబడుతుంది.
theological_decisions:
- issue: ἐν Χριστῷలో Χριστός పదానికి అనువాదం
  choice: క్రీస్తులో
  alternative: మెస్సీయలో
  rationale: Χριστός మూలార్థంగా ‘అభిషిక్తుడు/మెస్సీయ’ అయినప్పటికీ, ‘క్రీస్తులో’ అనే పదబంధం తెలుగులో సహజంగా స్థిరపడింది మరియు ఇక్కడ వ్యక్తి/బిరుదు మధ్య ఉన్న భావాన్ని అనవసరంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సంక్షిప్తమైన, గౌరవప్రదమైన వందన శైలి. ‘సహపనివాడు’ వంటి కృత్రిమ సమాసానికి బదులుగా ‘మాతో కలిసి పనిచేసే’ అనే సహజ నిర్మాణం వాడబడింది.
