    text: ఈ గ్రీకు పేరును ‘అంప్లియాస్’ అని కూడా లిప్యంతరీకరించవచ్చు; ఇక్కడి SBLGNT పాఠం ‘అంప్లియాతు’ రూపానికి మద్దతిస్తుంది.
