lexical_decisions:
- source_word: ἀσπάσασθε
  choice: శుభాకాంక్షలు చెప్పండి
  rationale: ఇది పత్రికలో పలకరింపులు తెలియజేయమని బహువచనంలో ఇచ్చిన ఆజ్ఞ. ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, సంక్షిప్తంగా ఈ భావాన్ని తెలియజేస్తుంది.
- source_word: Ἀμπλιᾶτον
  choice: అంప్లియాతు
  rationale: SBLGNTలోని Ἀμπλιᾶτον అనే ద్వితీయా విభక్తి రూపాన్ని వ్యక్తినామపు సాధారణ రూపంగా లిప్యంతరీకరించాం; తెలుగులో ‘-కు’ విభక్తి చేర్చబడింది.
- source_word: ἀγαπητόν μου
  choice: నాకు ప్రియుడైన
  rationale: గ్రీకు పదబంధంలోని వ్యక్తిగత ఆప్యాయతను కాపాడుతూ, ఆధునిక తెలుగులో సహజమైన బంధవాచక రూపాన్ని ఉపయోగిస్తుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు తరచుగా ఉపయోగించే ఈ పదబంధాన్ని సంక్షిప్తంగా యథాతథంగా ఉంచి, ప్రభువుతో సంబంధం లేదా క్రైస్తవ సహవాసపు పరిధి అనే భావాన్ని అనవసరంగా విప్పి చెప్పకుండా కాపాడుతుంది.
theological_decisions:
- issue: పౌలు వ్యక్తం చేసిన ప్రేమకు ἐν κυρίῳతో ఉన్న సంబంధం
  choice: ‘ప్రభువులో నాకు ప్రియుడైన’ అని అంప్లియాతును వర్ణించడం
  alternative: ‘ప్రభువులో’ అనే పదబంధాన్ని పలకరించే చర్యతో అనుసంధానించడం లేదా దీనిని కేవలం వ్యక్తిగత స్నేహంగా చెప్పడం
  rationale: గ్రీకు పదక్రమం ప్రకారం τὸν ἀγαπητόν μου ἐν κυρίῳ మొత్తం అంప్లియాతును వర్ణించడం అత్యంత సహజం. ఈ అనువాదం వ్యక్తిగత ఆప్యాయతతో పాటు ప్రభువులోని క్రైస్తవ సంబంధాన్ని కూడా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం. వ్యక్తినామం మూలపాఠానికి దగ్గరగా లిప్యంతరీకరించబడింది.
