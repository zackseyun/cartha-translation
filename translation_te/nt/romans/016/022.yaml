source:
  edition: SBLGNT
  text: ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: te
  text: ఈ లేఖను వ్రాసిన నేను, తెర్తియుస్, ప్రభువులో మీకు వందనాలు తెలియజేస్తున్నాను.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'మరొక విధంగా, అయితే తక్కువ సంభావ్యంగా: “ప్రభువులో ఈ లేఖను వ్రాసిన నేను, తెర్తియుస్, మీకు వందనాలు తెలియజేస్తున్నాను.” గ్రీకులో “ప్రభువులో” అనే పదబంధం “వ్రాసిన” అనే పదంతో అనుసంధానించవచ్చు; అయితే అది వందనాలు తెలియజేయడాన్ని విశేషించడం మరింత సహజం.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: వందనాలు చెబుతున్నాను
  rationale: పత్రిక ముగింపు సందర్భంలో పలకరించడం లేదా వందనాలు తెలియజేయడం అనే భావాన్ని ఆధునిక తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ὑμᾶς
  choice: మీకు
  rationale: ద్వితీయ పురుష బహువచన కర్మను తెలుగు వాక్యనిర్మాణానికి తగిన విధంగా ‘మీకు’ అని ఇచ్చాం.
- source_word: ἐγὼ Τέρτιος
  choice: తెర్తియు అనే నేను
  rationale: వ్యక్తనామంతో పాటు ఉన్న స్పష్టమైన ‘నేను’ అనే సర్వనామాన్ని నిలుపుతూ, మాట్లాడుతున్న వ్యక్తి స్వీయపరిచయాన్ని తెలుగులో సహజంగా చూపిస్తుంది.
- source_word: ὁ γράψας
  choice: రాసిన
  rationale: ఈ పత్రికను భౌతికంగా లిఖించిన వ్యక్తిగా తెర్తియును గుర్తించే భూతకాల కృదంత భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: τὴν ἐπιστολήν
  choice: ఈ పత్రికను
  rationale: గ్రీకులో నిర్దిష్ట ఉపపదం మాత్రమే ఉన్నప్పటికీ, రచయిత ప్రస్తుతం రాస్తున్న పత్రికనే సూచిస్తున్నందున తెలుగులో ‘ఈ పత్రిక’ సహజంగా, స్పష్టంగా ఉంటుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు పత్రికల్లో సాధారణమైన సంబంధం లేదా సహవాస పరిధిని సూచించే పదబంధాన్ని అక్షరార్థానికి దగ్గరగా నిలుపుతుంది; κύριοςను ‘ప్రభువు’గా అనువదించాం.
theological_decisions:
- issue: ἐν κυρίῳ (‘ప్రభువులో’) దేనిని విశేషిస్తుంది?
  choice: 'ప్రధాన క్రియ అయిన వందనాలు చెప్పడాన్ని విశేషించేలా ఉంచాం: తెర్తియు ప్రభువులో వారికి వందనాలు చెబుతున్నాడు.'
  alternative: ‘ప్రభువులో ఈ పత్రికను రాసిన తెర్తియు’ అని, పత్రిక రాయడాన్ని విశేషించవచ్చు.
  rationale: పత్రికా ముగింపు సందర్భంలో ఈ పదబంధం వందనంతో అనుసంధానమవడం మరింత సహజం. అయితే గ్రీకు పదక్రమం రెండవ అనుసంధానానికీ అవకాశం ఇస్తుంది కాబట్టి దానిని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పత్రికా శైలిని ఉపయోగించాం. ‘వందనాలు చెబుతున్నాను’ సాధారణ పాఠకులకు స్పష్టంగా ఉండి, మూలంలోని సంక్షిప్త అభివాద భావాన్ని నిలుపుతుంది.
