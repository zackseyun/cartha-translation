id: ROM.16.19
reference: Romans 16:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: te
  text: ఎందుకంటే, మీ విధేయత సంగతి అందరికీ తెలిసింది.[a] కాబట్టి మీ విషయమై నేను సంతోషిస్తున్నాను.[b] అయితే మీరు మంచి విషయంలో జ్ఞానులుగానూ, చెడు విషయంలో కల్మషం లేనివారుగానూ ఉండాలని కోరుతున్నాను.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “మీ విధేయత అందరి వరకు చేరింది.” అంటే దాని సంగతి విస్తృతంగా తెలిసింది.
    reason: lexical_alternative
  - marker: b
    text: లేదా, “మీ కారణంగా నేను సంతోషిస్తున్నాను.”
    reason: lexical_alternative
  - marker: c
    text: “కల్మషం లేనివారు” అనే మాటకు “స్వచ్ఛమైనవారు,” “కల్తీలేనివారు” లేదా “మోసంలేనివారు” అనే భావాలు కూడా ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακοή
  choice: విధేయత
  rationale: పౌలు వాడుకలో ఇది కేవలం వినడాన్ని కాక, విధేయతతో స్పందించడాన్ని సూచిస్తుంది.
- source_word: εἰς πάντας ἀφίκετο
  choice: సంగతి అందరికీ తెలిసింది
  rationale: గ్రీకు వాక్యం అక్షరార్థంగా ‘అందరి వరకు చేరింది’ అంటుంది; విధేయత అనే కర్తతో తెలుగులో దాని ఖ్యాతి విస్తృతంగా తెలిసిందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐφ’ ὑμῖν ... χαίρω
  choice: మీ విషయమై నేను సంతోషిస్తున్నాను
  rationale: ἐπί + దత్తివిభక్తి ఇక్కడ సంతోషానికి సందర్భం లేదా కారణాన్ని సూచించవచ్చు; ఈ అనువాదం ఆ విస్తృత భావాన్ని నిలుపుతుంది.
- source_word: σοφοὺς ... εἰς τὸ ἀγαθόν
  choice: మంచి విషయంలో జ్ఞానులుగా
  rationale: మంచికి సంబంధించి ఆచరణాత్మక వివేకం కలిగి ఉండాలనే భావాన్ని, గ్రీకు సమాంతర నిర్మాణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἀκεραίους ... εἰς τὸ κακόν
  choice: చెడు విషయంలో కల్మషం లేనివారుగా
  rationale: ἀκέραιος కు కల్తీలేని, స్వచ్ఛమైన, అమాయకమైన అనే భావాలు ఉన్నాయి; చెడుతో కలుషితం కాకపోవడాన్ని ‘కల్మషం లేని’ స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: πάντας యొక్క పరిధి
  choice: ‘అందరికీ’ అని అలంకారిక విస్తృతార్థంతో ఉంచడం
  alternative: ‘అన్ని సంఘాలవారికీ’ అని పరిమితం చేయడం
  rationale: మూలపాఠం నిర్దిష్ట వర్గాన్ని పేర్కొనదు; పౌలు ప్రశంసాపూర్వకంగా వారి విధేయత విస్తృతంగా ప్రసిద్ధమైందని చెబుతున్నాడు.
- issue: σοφοὺς మరియు ἀκεραίους మధ్య నైతిక వ్యత్యాసం
  choice: మంచి విషయంలో జ్ఞానం, చెడు విషయంలో కల్మషరాహిత్యం
  alternative: మంచిని చేయడంలో నైపుణ్యం, చెడు గురించి అజ్ఞానం
  rationale: వాక్యం పరిపక్వ వివేకాన్ని, చెడుతో కలుషితం కాని స్థితిని కలిపి చెబుతుంది; చెడు గురించి ఏమీ తెలియకూడదనే అదనపు భావాన్ని మోపదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. ‘మంచి విషయంలో… చెడు విషయంలో…’ అనే సమాంతర నిర్మాణం మూలంలోని నైతిక వ్యత్యాసాన్ని నిలుపుతుంది.
