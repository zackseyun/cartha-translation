id: ROM.16.12
reference: Romans 16:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: te
  text: ప్రభువులో ప్రయాసపడిన త్రుఫైనా, త్రుఫోసాలకు[a] వందనాలు తెలియజేయండి. ప్రభువులో ఎంతో ప్రయాసపడిన ప్రియమైన[b] పెర్సిసుకు వందనాలు తెలియజేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ప్రభువులో కష్టపడి పనిచేసిన త్రుఫైనా, త్రుఫోసాలకు.”
    reason: కొపియావ్ (κοπιάω) అనే క్రియకు ‘ప్రయాసపడు,’ ‘కష్టపడి పని చేయు,’ ‘శ్రమించు’ అనే సమీపార్థాలు ఉన్నాయి.
  - marker: b
    text: కొన్ని అనువాదాల్లో “నాకు ప్రియమైన పెర్సిసు” అని ఉంటుంది; గ్రీకులో ‘నా’ అనే పదం స్పష్టంగా లేదు.
    reason: మూలపాఠ్యంలో లేని స్వామ్య సూచనను ప్రధాన పాఠ్యంలో చేర్చకుండా, ప్రాచుర్యంలో ఉన్న ప్రత్యామ్నాయాన్ని వివరిస్తుంది.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: అభివందనాలు చెప్పండి
  rationale: పత్రిక ముగింపులో పలువురికి వందనాలు తెలియజేయమనే బహువచన ఆజ్ఞను సహజమైన, గౌరవప్రదమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: త్రుఫైనాకు, త్రుఫోసాకు
  rationale: వ్యక్తుల పేర్లను గ్రీకు ఉచ్చారణకు దగ్గరగా లిప్యంతరీకరించాం; విభక్తి ప్రత్యయాలు తెలుగు వాక్యనిర్మాణానికి అనుగుణంగా చేర్చాం.
- source_word: τὰς κοπιώσας / ἐκοπίασεν
  choice: ప్రయాసపడిన / ప్రయాసపడిన
  rationale: κοπιάωలోని కష్టపడి పనిచేయడం, శ్రమించడం అనే భావాన్ని ‘ప్రయాసపడు’ సహజంగా తెలియజేస్తుంది; రెండు రూపాల్లోనూ ఒకే మూలపదపు పునరుక్తిని నిలిపాం.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: పౌలు వాడే సంబంధం/పరిధి భావాన్ని సంకుచితం చేయకుండా నేరుగా నిలుపుతుంది; ‘ప్రభువు కోసం’ అని ప్రయోజనార్థకంగా మాత్రమే మార్చలేదు.
- source_word: Περσίδα
  choice: పెర్సిసుకు
  rationale: వ్యక్తి పేరును లిప్యంతరీకరించి, తెలుగు దత్తివిభక్తిని చేర్చాం.
- source_word: τὴν ἀγαπητήν
  choice: ప్రియురాలైన
  rationale: స్త్రీలింగ విశేషణాన్ని సహజ తెలుగులో వ్యక్తం చేస్తూ, గ్రీకులో లేని ‘నా’ అనే స్వామ్య సూచనను చేర్చలేదు.
- source_word: πολλὰ
  choice: ఎంతో
  rationale: ఆమె ప్రయాస పరిమాణాన్ని నొక్కిచెప్పే క్రియావిశేషణ భావాన్ని సహజంగా అందిస్తుంది.
theological_decisions:
- issue: పౌలు వాడే ἐν κυρίῳ పరిచర్య సూత్రం
  choice: ప్రభువులో
  alternative: ప్రభువు కోసం / ప్రభువు సేవలో
  rationale: ఈ పదబంధం ప్రభువుతో సంబంధం మరియు ఆయనలోని జీవన పరిధి రెండింటినీ సూచించగలదు. ‘ప్రభువులో’ ఆ సమృద్ధమైన, కొంత తెరచి ఉన్న భావాన్ని నిలుపుతుంది.
- issue: ἀγαπητήνతో స్వామ్య సూచనను చేర్చాలా?
  choice: ప్రియురాలైన
  alternative: నాకు ప్రియురాలైన / నా ప్రియమైన
  rationale: గ్రీకు పాఠ్యంలో μου (‘నా’) లేదు. అందువల్ల పౌలుతో ప్రత్యేక స్వామ్య లేదా వ్యక్తిగత సంబంధాన్ని అనవసరంగా చేర్చలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైన పత్రికా శైలి. ‘ప్రయాసపడిన’ అనే పదాన్ని రెండుసార్లు ఉంచి గ్రీకులోని κοπιάω పదపునరుక్తిని కాపాడాం. స్త్రీలను సూచించే పేర్లు, ‘ప్రియురాలైన’ రూపం ద్వారా లింగసూచన సహజంగా కనిపిస్తుంది.
