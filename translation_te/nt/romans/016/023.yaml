id: ROM.16.23
reference: Romans 16:23
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: te
  text: నాకూ, సంఘమంతటికీ ఆతిథ్యమిచ్చే గాయియు మీకు వందనాలు చెబుతున్నాడు. నగర కోశాధికారి[a] ఎరాస్తు, సహోదరుడు క్వర్తు కూడా మీకు వందనాలు చెబుతున్నారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘నగర నిర్వాహకుడు.’ గ్రీకు పదం నగర పరిపాలనలో విస్తృతమైన బాధ్యతలు గల అధికారిని సూచించవచ్చు; అయితే ఇక్కడ ‘కోశాధికారి’ అనే అర్థం సందర్భానికి ఎక్కువగా సరిపోతుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: వందనాలు చెబుతున్నాడు / చెబుతున్నారు
  rationale: పౌలు పత్రికల ముగింపులో ఈ క్రియ ఇతరులకు అభివందనాలు తెలియజేయడాన్ని సూచిస్తుంది. ఆధునిక తెలుగులో ‘వందనాలు చెబుతున్నారు’ సహజంగా, గౌరవప్రదంగా ఉంటుంది.
- source_word: ξένος
  choice: ఆతిథ్యమిస్తున్న
  rationale: ఇక్కడ గాయియు పౌలుకూ సంఘమంతటికీ ఆతిథ్యం ఇచ్చేవాడని సందర్భం సూచిస్తుంది; ‘అపరిచితుడు’ లేదా ‘అతిథి’ అనే ఇతర అర్థాలు సందర్భానికి సరిపోవు.
- source_word: ὅλης τῆς ἐκκλησίας
  choice: సంఘమంతటికీ
  rationale: ἐκκλησία ఇక్కడ క్రైస్తవ విశ్వాసుల సమాజాన్ని సూచిస్తుంది. ὅλης భావాన్ని ‘అంతటికీ’ స్పష్టంగా నిలుపుతుంది.
- source_word: οἰκονόμος τῆς πόλεως
  choice: నగర కోశాధికారి
  rationale: పౌరపాలనా సందర్భంలో οἰκονόμος ఆర్థిక వ్యవహారాలు చూసే అధికారిని సూచించగలదు. పదానికి విస్తృతమైన ‘నిర్వాహకుడు’ అనే అర్థం కూడా ఉన్నందున ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
- source_word: ἀδελφός
  choice: సహోదరుడు
  rationale: ఇది పురుష ఏకవచన పదం; ఇక్కడ క్వర్తును తోటి విశ్వాసిగా పేర్కొంటుంది. మూలంలో లేని ‘మన’ అనే స్వామ్యార్థాన్ని చేర్చలేదు.
theological_decisions:
- issue: ἐκκλησία అనే పదాన్ని ఈ అభివందన సందర్భంలో ఎలా అనువదించాలి
  choice: సంఘం
  alternative: సభ / విశ్వాసుల సమాజం
  rationale: పౌలు వాడుకలో ఈ పదం సాధారణంగా స్థానిక క్రైస్తవ సమాజాన్ని సూచిస్తుంది. ‘సంఘం’ తెలుగులో సహజమైనదీ, అనవసరమైన సంఘవ్యవస్థాపర భావాన్ని చేర్చనిదీ.
- issue: ἀδελφός అనే కుటుంబసంబంధ పదం
  choice: సహోదరుడు
  alternative: తోటి విశ్వాసి
  rationale: మూలంలోని పురుష ఏకవచన రూపాన్ని నిలుపుతూ, క్రైస్తవ సహవాస సంబంధాన్ని సహజంగా వ్యక్తం చేస్తుంది; లింగాన్ని తటస్థీకరించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. వ్యక్తుల పేర్లకు తెలుగు బైబిలు వాడుకలో పరిచితమైన రూపాలు—గాయియు, ఎరాస్తు, క్వర్తు—ఉపయోగించబడ్డాయి. పాదసూచిక సూచికను అది వివరిస్తున్న ‘నగర కోశాధికారి’ వద్ద ఉంచాం.
