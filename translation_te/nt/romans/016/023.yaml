revisions:
- from: నాకూ సంఘమంతటికీ ఆతిథ్యమిస్తున్న గాయియు మీకు వందనాలు చెబుతున్నాడు. నగర కోశాధికారి[a] ఎరాస్తు, సహోదరుడు క్వర్తు కూడా మీకు వందనాలు చెబుతున్నారు.
  to: నాకూ, సంఘమంతటికీ ఆతిథ్యమిచ్చే గాయియు మీకు వందనాలు చెబుతున్నాడు. నగర కోశాధికారి[a] ఎరాస్తు, సహోదరుడు క్వర్తు కూడా మీకు వందనాలు చెబుతున్నారు.
