id: ROM.16.2
reference: Romans 16:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: te
  text: మీరు ఆమెను ప్రభువులో, పరిశుద్ధులకు తగిన విధంగా[a] స్వాగతించండి. ఆమెకు మీ తోడ్పాటు అవసరమయ్యే ఏ విషయంలోనైనా ఆమెకు అండగా నిలవండి. ఎందుకంటే ఆమె అనేకమందికి పోషకురాలిగా నిలిచింది; నాకు కూడా పోషకురాలిగా నిలిచింది.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని పవిత్ర ప్రజలకు తగిన విధంగా.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘ఉపకారిణిగా,’ ‘మేలుచేసినదిగా,’ లేదా ‘అండగా నిలిచినదిగా.’ గ్రీకు పదం ఇతరులకు సామాజికంగా లేదా ఆచరణాత్మకంగా తోడ్పాటు అందించిన స్త్రీని సూచించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: స్వాగతించండి
  rationale: సంఘంలో ఫీబేను అనుకూలంగా, ఆతిథ్యంతో చేర్చుకోవాలనే భావాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: క్రీస్తుతో సంబంధం మరియు విశ్వాసుల సహవాస పరిధి అనే పౌలు వాడుకలోని భావాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: ἀξίως τῶν ἁγίων
  choice: పరిశుద్ధులకు తగిన విధంగా
  rationale: ἀξίως యొక్క విధానార్థాన్ని, ἅγιοι అనే పౌలు విశ్వాసులకోసం వాడే పదాన్ని కాపాడుతుంది.
- source_word: παραστῆτε αὐτῇ
  choice: ఆమెకు తోడుగా నిలవండి
  rationale: కేవలం సాధారణ సహాయం కంటే, అవసరంలో ఆమె పక్షాన నిలిచి సహకరించాలనే παρίστημι భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: ఆమెకు మీ సహాయం అవసరమయ్యే ఏ విషయంలోనైనా
  rationale: πρᾶγμα యొక్క విస్తృతమైన ‘విషయం/కార్యం’ అర్థాన్ని నిలుపుతూ, χρῄζῃ ὑμῶν భావాన్ని తెలుగులో స్పష్టంగా అందిస్తుంది.
- source_word: προστάτις
  choice: పోషకురాలు
  rationale: ఇతరులకు సామాజికంగా, ఆర్థికంగా లేదా ప్రాయోగికంగా అండనిచ్చిన స్త్రీని సూచించే బలమైన పదం; ‘సహాయకురాలు’ కంటే మూలపదంలోని స్థాయి మరియు క్రియాశీల పాత్రను మెరుగ్గా నిలుపుతుంది.
- source_word: ἐμοῦ αὐτοῦ
  choice: నాకు కూడా అలాగే
  rationale: καί యొక్క అదనపు భావాన్ని, αὐτοῦ ఇచ్చే వ్యక్తిగత ఉద్ఘాటనను సహజమైన తెలుగులో తెలియజేస్తుంది.
theological_decisions:
- issue: ఫీబేను προστάτις అని పేర్కొనడం
  choice: పోషకురాలు
  alternative: సహాయకురాలు; ఉపకారిణి; అండగా నిలిచినది
  rationale: ఈ పదం సాధారణ సహాయాన్ని మించిన, ఇతరులకు వనరులు లేదా రక్షణతో అండనిచ్చే గుర్తింపుగల సామాజిక పాత్రను సూచించవచ్చు. ‘పోషకురాలు’ ఫీబే పాత్ర యొక్క ప్రాముఖ్యతను తగ్గించకుండా ఉంచుతుంది; అదే సమయంలో తరువాతి కాలపు నిర్దిష్ట సంఘ పదవిని పాఠ్యంలోకి చేర్చదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన బహువచన ఆజ్ఞారూపాలు వాడబడ్డాయి. వాక్యం చదవడానికి సహజంగా ఉండేలా మూడు వాక్యాలుగా విభజించబడింది; మూలంలోని కారణసూచక καὶ γάρ భావం ‘ఎందుకంటే’తో నిలుపబడింది.
