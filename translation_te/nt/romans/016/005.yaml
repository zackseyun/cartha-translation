id: ROM.16.5
reference: Romans 16:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: te
  text: వారి ఇంటిలోని సంఘానికి కూడా వందనాలు చెప్పండి.[a] నాకు ప్రియమైన ఎపైనేతుకు వందనాలు చెప్పండి. అతడు మెస్సీయ కొరకు ఆసియ యొక్క ప్రథమఫలం.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “వారి ఇంటిలో సమావేశమయ్యే సంఘానికి.”
    reason: lexical_alternative
  - marker: b
    text: ఇక్కడ “ఆసియ” అంటే ఆధునిక ఆసియా ఖండం కాదు; రోమా సామ్రాజ్యంలోని ఆసియ అనే పరిపాలనా ప్రాంతం.
    reason: cultural_note
  - marker: c
    text: అంటే, “ఆసియలో మెస్సీయను విశ్వసించిన మొదటి వ్యక్తి అతడే.”
    reason: alternative_reading
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: వారి ఇంటిలో ఉన్న సంఘం
  rationale: గ్రీకు పదబంధం వారి ఇంటితో సంబంధమున్న, అక్కడ సమావేశమయ్యే సంఘాన్ని సూచిస్తుంది. ఈ అనువాదం మూలానికి దగ్గరగా ఉండి తెలుగులో సహజంగా ఉంది; సమావేశమయ్యే భావాన్ని ప్రత్యామ్నాయంగా పాదసూచికలో ఉంచాం.
- source_word: ἀσπάσασθε
  choice: వందనాలు చెప్పండి
  rationale: పత్రికలోని పలకరింపుల జాబితా సందర్భంలో ఇది సహజమైన, గౌరవప్రదమైన తెలుగు ప్రయోగం.
- source_word: Ἐπαίνετον
  choice: ఎపైనేతు
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగు ధ్వని పద్ధతికి అనుగుణంగా లిప్యంతరీకరించాం.
- source_word: ἀγαπητόν μου
  choice: నాకు ప్రియమైన
  rationale: పౌలు వ్యక్తం చేస్తున్న ఆప్యాయతను ఆధునిక తెలుగులో సహజంగా, మూలార్థానికి దగ్గరగా తెలియజేస్తుంది.
- source_word: ἀπαρχὴ
  choice: ప్రథమఫలం
  rationale: ‘మొదటి ఫలం/ప్రథమఫలం’ అనే పౌలు రూపకాన్ని ‘మొదట విశ్వసించినవాడు’ అని పూర్తిగా విప్పి చెప్పకుండా నిలుపుతుంది.
- source_word: τῆς Ἀσίας
  choice: ఆసియ యొక్క
  rationale: షష్ఠీ విభక్తి సంబంధాన్ని దగ్గరగా నిలుపుతుంది. ఇది ఆధునిక ఆసియా ఖండం కాక రోమా పాలిత ప్రాంతమని పాదసూచిక వివరిస్తుంది.
- source_word: εἰς Χριστόν
  choice: మెస్సీయకు
  rationale: εἰς తెలిపే దిశ లేదా సంబంధాన్ని సంక్షిప్తంగా నిలుపుతూ, Χριστόςను ఈ సందర్భంలో బిరుదైన ‘మెస్సీయ’గా అనువదిస్తుంది.
theological_decisions:
- issue: Χριστόν అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో Χριστός బిరుదుగా పనిచేస్తుంది; ‘మెస్సీయ’ దాని అర్థాన్ని స్పష్టంగా నిలుపుతుంది, అదనపు సిద్ధాంత భావాన్ని చేర్చదు.
- issue: ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν భావం
  choice: అతడు మెస్సీయకు ఆసియ యొక్క ప్రథమఫలం
  alternative: ఆసియలో మెస్సీయను విశ్వసించిన మొదటి వ్యక్తి అతడే
  rationale: ప్రధాన పాఠం పౌలు ఉపయోగించిన ‘ప్రథమఫలం’ రూపకాన్ని, అలాగే εἰς యొక్క సంబంధ/దిశ భావాన్ని పరిష్కరించకుండా నిలుపుతుంది. సందర్భానుసార వివరణను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. ‘ప్రథమఫలం’ అనే మూల రూపకం ఉద్దేశపూర్వకంగా నిలుపబడింది; దాని సందర్భార్థం పాదసూచికలో వివరించబడింది.
