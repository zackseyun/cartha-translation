review_pass:
  verdict: revise
  source_fidelity: The draft conveys both imperatives, Epaenetus’s affectionate designation, and the firstfruits metaphor. However, “వారి ఇంటిలో ఉన్న సంఘం” can mean merely a church presently located in their house, whereas κατ’ οἶκον more naturally denotes the congregation associated with/meeting in the house. “మెస్సీయకు” is also less suitable for εἰς Χριστόν here than “మెస్సీయ కొరకు,” which better retains the phrase’s relational/goal sense without resolving the metaphor.
  naturalness: “వారి ఇంటిలోని సంఘం” is more idiomatic and suitably close in modern standard Telugu. “ఆసియ యొక్క ప్రథమఫలం” is understandable but somewhat wooden; it is retained to preserve the genitive relationship and Pauline image, while the surrounding wording is made smoother.
  terminology: “సంఘం,” “ఎపైనేతు,” “ప్రియమైన,” “ప్రథమఫలం,” and “మెస్సీయ” are appropriate. The cultural note correctly identifies Roman Asia, and the alternative-reading note appropriately explains the idiomatic expression without replacing it in the main text.
  issues:
  - severity: medium
    issue: “వారి ఇంటిలో ఉన్న సంఘం” is slightly imprecise for κατ’ οἶκον αὐτῶν.
    rationale: “ఉన్న” can be read as simple physical presence. “వారి ఇంటిలోని సంఘం” more directly expresses the assembly connected with their household, while the footnote preserves the explicit ‘meeting’ alternative.
  - severity: medium
    issue: “మెస్సీయకు” insufficiently represents εἰς Χριστόν in this idiom.
    rationale: In the expression ἀπαρχὴ ... εἰς Χριστόν, the relation is better conveyed in Telugu by “మెస్సీయ కొరకు.” This avoids suggesting that Epaenetus is directed toward the Messiah while preserving the source’s compressed metaphor.
  revised_text: వారి ఇంటిలోని సంఘానికి కూడా వందనాలు చెప్పండి.[a] నాకు ప్రియమైన ఎపైనేతుకు వందనాలు చెప్పండి. అతడు మెస్సీయ కొరకు ఆసియ యొక్క ప్రథమఫలం.[b][c]
