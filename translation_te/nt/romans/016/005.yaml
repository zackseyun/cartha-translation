revisions:
- from: వారి ఇంటిలో ఉన్న సంఘానికి కూడా వందనాలు చెప్పండి.[a] నాకు ప్రియమైన ఎపైనేతుకు వందనాలు చెప్పండి. అతడు మెస్సీయకు ఆసియ యొక్క ప్రథమఫలం.[b][c]
  to: వారి ఇంటిలోని సంఘానికి కూడా వందనాలు చెప్పండి.[a] నాకు ప్రియమైన ఎపైనేతుకు వందనాలు చెప్పండి. అతడు మెస్సీయ కొరకు ఆసియ యొక్క ప్రథమఫలం.[b][c]
  rationale: The revision improves the house-church expression and renders εἰς Χριστόν more faithfully and naturally as “మెస్సీయ కొరకు.” It retains the Greek metaphor “ప్రథమఫలం,” the title “మెస్సీయ,” and the explanatory footnotes, without forcing a single interpretation of the idiomatic final clause.
