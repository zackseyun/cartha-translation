id: ROM.16.18
reference: Romans 16:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: te
  text: ఎందుకంటే అలాంటివారు మన ప్రభువైన మెస్సీయకు[a] సేవ చేయరు; తమ సొంత కడుపుకే[b] సేవ చేస్తారు. వారు మృదువైన మాటలతో, పొగడ్తలతో నిష్కపటుల[c] హృదయాలను మోసగిస్తారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “మన ప్రభువైన క్రీస్తుకు.”
    reason: alternative_reading
  - marker: b
    text: అక్షరార్థంగా, “తమ సొంత కడుపుకే”; ఇది స్వార్థపూరితమైన సుఖాసక్తిని సూచించే సజీవ రూపకం.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “అమాయకుల,” “ఏ కపటమూ ఎరుగనివారి,” లేదా “అనుమానించనివారి.”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι
  choice: అలాంటివారు
  rationale: మునుపటి వచనంలో చెప్పిన విభేదాలు కలిగించేవారిని సూచించే సహజమైన ఆధునిక తెలుగు ప్రయోగం.
- source_word: κυρίῳ ἡμῶν Χριστῷ
  choice: మన ప్రభువైన మెస్సీయకు
  rationale: κύριος ను ‘ప్రభువు’గా, Χριστός ను వ్యక్తిపేరులా కాక బిరుదుగా ‘మెస్సీయ’గా అనువదించింది; గ్రీకులో లేని ‘యేసు’ను చేర్చలేదు.
- source_word: δουλεύουσιν
  choice: సేవ చేయరు / సేవ చేస్తారు
  rationale: దాసునిగా సేవ చేయడం అనే మూలభావాన్ని సందర్భానికి సహజమైన ‘సేవ చేయడం’తో తెలిపింది; ప్రభువుకు సేవ చేయడం, కడుపుకు సేవ చేయడం అనే వ్యత్యాసాన్ని నిలిపింది.
- source_word: κοιλίᾳ
  choice: కడుపుకే
  rationale: స్వార్థపూరిత కోరికలను సూచించే పౌలు వాడిన స్పష్టమైన రూపకాన్ని వ్యాఖ్యానించి మార్చకుండా నిలిపింది; ‘కే’ వ్యత్యాసాన్ని ఉద్ఘాటిస్తుంది.
- source_word: χρηστολογίας
  choice: మృదువైన మాటలతో
  rationale: వినడానికి ఆహ్లాదకరంగా, నమ్మించేలా ఉండే మాటల భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: εὐλογίας
  choice: పొగడ్తలతో
  rationale: ఈ మోసపూరిత సందర్భంలో నిజమైన ఆశీర్వాదం కంటే మెప్పించేందుకు చేసే ప్రశంస అనే భావం ఉద్దేశించబడింది.
- source_word: ἐξαπατῶσι
  choice: మోసగిస్తారు
  rationale: తీవ్రమైన మోసాన్ని సూచించే సమాసక్రియను స్పష్టమైన సాధారణ తెలుగు పదంతో తెలిపింది.
- source_word: καρδίας
  choice: హృదయాలను
  rationale: కేవలం బుద్ధిని కాక అంతరంగ వ్యక్తిని సూచించే బైబిలు రూపకాన్ని నిలిపింది.
- source_word: ἀκάκων
  choice: ఏ కపటమూ ఎరుగనివారి
  rationale: ‘నిర్దోషులు,’ ‘నిష్కపటులు,’ ‘అనుమానించనివారు’ అనే భావపరిధిలో, మోసానికి సులభంగా గురయ్యే నిష్కపట స్వభావాన్ని సహజంగా తెలియజేస్తుంది.
theological_decisions:
- issue: పౌలు వాడిన Χριστός బిరుదు అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ను స్థిరమైన వ్యక్తిపేరుగా కాక ‘అభిషిక్తుడు’ అనే బిరుదుగా ప్రతిబింబించేందుకు ప్రధాన పాఠ్యంలో ‘మెస్సీయ’ను వాడింది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదటిప్పణిలో ఉంచింది.
- issue: τῇ ἑαυτῶν κοιλίᾳ రూపకార్థం
  choice: తమ సొంత కడుపుకే సేవ చేస్తారు
  alternative: తమ స్వార్థ కోరికలకే సేవ చేస్తారు
  rationale: స్వార్థసుఖాసక్తిని సూచించే రూపకాన్ని పాఠ్యంలోనే వివరణాత్మకంగా మార్చకుండా, పౌలు ఉంచిన దృశ్యాత్మకమైన ఉద్రిక్తతను నిలిపింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సామాన్య పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని ప్రభువు–కడుపు వ్యత్యాసాన్ని స్పష్టత కోసం రెండు తెలుగు వాక్యాలుగా విభజించినా, భావసంబంధాన్ని కాపాడింది. అన్ని పాదటిప్పణి సూచికలు ప్రధాన పాఠ్యంలో ఉన్నాయి.
