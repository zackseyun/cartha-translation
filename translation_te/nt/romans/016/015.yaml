id: ROM.16.15
reference: Romans 16:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: te
  text: ఫిలోలోగుకూ యూలియాకూ[a], నేరేయుకూ అతని సోదరికీ, ఒలింపాకూ వారితో ఉన్న పరిశుద్ధులందరికీ శుభాకాంక్షలు తెలియజేయండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ఈ పేరును పురుషనామంగా తీసుకుంటే ‘యూలియాస్’ కావచ్చు; అయితే గ్రీకు రూపాన్ని సాధారణంగా స్త్రీనామమైన ‘యూలియా’గానే అర్థం చేసుకుంటారు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: శుభాకాంక్షలు చెప్పండి
  rationale: లేఖలో పలకరింపులు తెలియజేయమనే బహువచన ఆజ్ఞను ఆధునిక తెలుగులో సహజంగా, గౌరవప్రదంగా వ్యక్తపరుస్తుంది.
- source_word: Φιλόλογον
  choice: ఫిలోలోగు
  rationale: గ్రీకు వ్యక్తినామాన్ని తెలుగు ధ్వనులకు అనుగుణంగా లిప్యంతరీకరించి, విభక్తి కోసం ‘కు’ చేర్చబడింది.
- source_word: Ἰουλίαν
  choice: యూలియ
  rationale: ఈ రూపం సహజంగా స్త్రీనామమైన ‘యూలియ’ను సూచిస్తుంది; పురుషనామంగా తీసుకునే తక్కువ సంభావ్యమైన ప్రత్యామ్నాయం పాదసూచికలో ఉంచబడింది.
- source_word: Νηρέα
  choice: నేరేయు
  rationale: గ్రీకు వ్యక్తినామానికి తెలుగు లిప్యంతరీకరణ; వాక్యంలో ‘నేరేయుకు’గా దత్తివిభక్తితో వచ్చింది.
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: అతని సహోదరికి
  rationale: ἀδελφή అంటే సోదరి; αὐτοῦ సమీపంలోని నేరేయును సూచించడం సహజం. ‘సహోదరి’ గౌరవప్రదమైన ప్రామాణిక తెలుగు.
- source_word: Ὀλυμπᾶν
  choice: ఒలుంపా
  rationale: గ్రీకు వ్యక్తినామాన్ని మూల ఉచ్చారణకు దగ్గరగా తెలుగు లిపిలో అందించింది.
- source_word: τοὺς σὺν αὐτοῖς
  choice: వారితో ఉన్న
  rationale: σύν తెలిపే సహవాసం లేదా అనుబంధాన్ని సహజమైన తెలుగు సంబంధవాచక నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: πάντας ἁγίους
  choice: పరిశుద్ధులందరికీ
  rationale: పౌలు తోటి విశ్వాసులను సూచించడానికి వాడే ἅγιοι అనే పదానికి స్థిరమైన తెలుగు సమానార్థకం ‘పరిశుద్ధులు’; πάντας భావం ‘అందరికీ’లో నిలిచింది.
theological_decisions:
- issue: పౌలు పలకరింపుల జాబితాలో ἅγιοι అనువాదం
  choice: పరిశుద్ధులు
  alternative: పవిత్రులు / దేవుని పరిశుద్ధ ప్రజలు
  rationale: ఇది పేర్లు చెప్పబడినవారితో ఉన్న తోటి విశ్వాసులను సూచిస్తుంది. ‘పరిశుద్ధులు’ పౌలు వాడుకలోని సంఘపరమైన అర్థాన్ని నిలుపుతుంది; తరువాతి కాలపు అధికారిక సాధుత్వ హోదాను ఉద్దేశించినట్లు అదనంగా చెప్పదు.
- issue: Ἰουλίαν అనే పేరులో లింగం
  choice: యూలియ
  alternative: యూలియాస్ అనే పురుషనామం
  rationale: గ్రీకు రూపం సాధారణంగా స్త్రీనామమైన యూలియగా అర్థమవుతుంది. అనువాద సంప్రదాయంలో పురుషనామ ప్రతిపాదన ఉన్నందున దానిని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన లేఖా శైలి. పేర్లన్నిటినీ గ్రీకు మూలానికి దగ్గరగా లిప్యంతరీకరించాం. ‘శుభాకాంక్షలు చెప్పండి’ అనే రూపం బహువచన ఆజ్ఞను స్పష్టంగా తెలియజేస్తుంది; పాదసూచిక గుర్తు [a] ప్రధాన పాఠ్యంలో సంబంధిత పేరు వెంట ఉంచబడింది.
