  text: ἀσπάσασθε Ῥοῦφον τὸν ἐκλεκτὸν ἐν κυρίῳ καὶ τὴν μητέρα αὐτοῦ καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/013.yaml
  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: te
  text: ప్రభువులో ఎన్నుకోబడినవాడైన రూఫుకు[a], అతని తల్లికీ—నాకూ తల్లియైన ఆమెకూ—వందనాలు చెప్పండి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ప్రభువులో శ్రేష్ఠుడైనవాడు’ లేదా ‘ప్రభువులో ప్రత్యేకమైనవాడు’ అని కూడా అర్థం కావచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: వందనాలు చెప్పండి
  rationale: బహువచన ఆజ్ఞారూపంలోని పలకరింపు భావాన్ని ఆధునిక, సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: Ῥοῦφον
  choice: రూఫు
  rationale: వ్యక్తి పేరును తెలుగు ధ్వని-లిపి సంప్రదాయానికి అనుగుణంగా లిప్యంతరీకరించాం; విభక్తితో ‘రూఫుకు’ అయింది.
- source_word: ἐκλεκτὸν
  choice: ఎన్నుకోబడినవాడు
  rationale: ‘ఎన్నుకోబడిన, ఎన్నికైన’ అనే ప్రధాన భావాన్ని సాధారణ పాఠకులకు స్పష్టంగా ఉంచుతుంది; ‘శ్రేష్ఠుడు/ప్రత్యేకమైనవాడు’ అనే సాధ్యమైన గౌరవార్థాన్ని పాదసూచికలో నిలిపాం.
- source_word: ἐν κυρίῳ
  choice: ప్రభువులో
  rationale: ప్రభువుతో సంబంధం లేదా ఆయనలోని పరిధిని సూచించే గ్రీకు పదబంధపు సంక్షిప్తతను కాపాడుతుంది.
- source_word: μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: అతని తల్లికి—నాకూ తల్లి అయిన ఆమెకు
  rationale: ఒకే స్త్రీని రూఫు తల్లిగానూ పౌలు తన తల్లిగానూ ఆప్యాయంగా పేర్కొన్న గ్రీకు సంక్షిప్త నిర్మాణాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; ఆ బంధం జీవసంబంధమా, ఆప్యాయ సంబంధమా అని అనవసరంగా వివరణ చేర్చదు.
theological_decisions:
- issue: ἐκλεκτὸν ἐν κυρίῳ యొక్క భావం
  choice: ప్రభువులో ఎన్నుకోబడినవాడు
  alternative: ప్రభువులో శ్రేష్ఠుడు లేదా ప్రత్యేకమైనవాడు
  rationale: దేవుని ఎంపిక అనే భావాన్నీ, క్రైస్తవ సమాజంలో విశిష్టుడనే గౌరవార్థాన్నీ ఈ పదబంధం అనుమతిస్తుంది. ప్రధాన పాఠం మొదటి భావాన్ని నేరుగా ఉంచగా, పాదసూచిక మరొక సాధ్యమైన భావాన్ని తెలియజేసి సిద్ధాంతపరమైన ఉద్రిక్తతను నిలుపుతుంది.
- issue: ‘అతని తల్లి, నా తల్లి’ అనే మాట యొక్క సంబంధార్థం
  choice: అతని తల్లికి—నాకూ తల్లి అయిన ఆమెకు
  alternative: రూఫు తల్లి పౌలుకు తల్లివలె ఆదరించిన స్త్రీ
  rationale: మూలపాఠంలోని కుటుంబ సంబంధ పదజాలాన్ని నిలిపి, అది అక్షరార్థ జీవసంబంధమని గానీ కేవలం రూపకమని గానీ అనువాదంలోనే నిర్ణయించకుండా ఉంచుతుంది; సందర్భం ఆప్యాయ సంబంధాన్ని సూచించనిస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సులభంగా అర్థమయ్యే శైలిని వాడాం. పౌలు పలకరింపుల సంక్షిప్తతను కాపాడుతూ, రెండో వాక్యంలో విరామరేఖ ద్వారా ఆప్యాయ వ్యక్తిగత వ్యాఖ్యను సహజంగా చూపించాం.
