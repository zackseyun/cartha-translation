id: ROM.16.1
reference: Romans 16:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν ⸀καὶ διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: te
  text: ఇక, కెంక్రయలోని సంఘపు పరిచారకురాలు[a] కూడా అయిన మన సహోదరి ఫీబేను మీకు సిఫారసు చేస్తున్నాను.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “సేవకురాలు,” “పరిచర్యకురాలు.” గ్రీకు పదం సంఘంలో గుర్తింపు పొందిన పరిచర్య పాత్రను గానీ, సాధారణంగా సేవ చేసే వ్యక్తిని గానీ సూచించవచ్చు.
    reason: διάκονος అనే పదంలో ఉన్న పాత్రసంబంధమైన మరియు సాధారణ సేవాసంబంధమైన రెండు సాధ్యార్థాలను నిలుపుటకు.
lexical_decisions:
- source_word: Συνίστημι
  choice: సిఫారసు చేస్తున్నాను
  rationale: పత్రికా సందర్భంలో ఈ క్రియ ఒక వ్యక్తిని స్వీకర్తలకు అనుకూలంగా పరిచయం చేసి, ఆమెను ఆదరించాలని సిఫారసు చేసే భావాన్ని ఇస్తుంది.
- source_word: δὲ
  choice: ఇక
  rationale: ఇక్కడ బలమైన వ్యతిరేకత కాకుండా విషయమార్పును సూచించే మృదువైన అనుసంధాన పదం; ‘ఇక’ ఆ కార్యాన్ని సహజమైన తెలుగులో వ్యక్తపరుస్తుంది.
- source_word: Φοίβην
  choice: ఫీబేను
  rationale: వ్యక్తి పేరును తెలుగు ధ్వన్యనుసారం లిప్యంతరీకరించి, వాక్యంలో కర్మ విభక్తితో ఇచ్చాం.
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: మన సహోదరి
  rationale: పౌలు సంఘసంబంధమైన కుటుంబ భాషలో తోటి విశ్వాసిని సూచిస్తున్నాడు; మూలంలోని రూపకాన్ని వివరణ జోడించకుండా నిలిపాం.
- source_word: οὖσαν καὶ
  choice: కూడా అయిన
  rationale: ఫీబే గురించి అదనపు గుర్తింపు సమాచారాన్ని తెలిపే కృదంత నిర్మాణాన్ని, καί యొక్క సముచ్చయ భావంతో సహజంగా అందిస్తుంది.
- source_word: διάκονον
  choice: పరిచారకురాలు
  rationale: ఈ పదం సాధారణంగా సేవ చేసే వ్యక్తినీ, సంఘంలో గుర్తింపు పొందిన పరిచర్య పాత్రనూ సూచించగలదు. ‘పరిచారకురాలు’ సంఘసంబంధ సందర్భాన్ని నిలుపుతూ, తరువాతి కాలపు నిర్దిష్ట denominational పదవీ నిర్మాణాన్ని బలవంతంగా మోపదు; ఇతర సాధ్యార్థాలను పాదటిప్పణిలో ఉంచాం.
- source_word: τῆς ἐκκλησίας
  choice: సంఘానికి
  rationale: పౌలు పత్రికలలో ἐκκλησία సాధారణంగా స్థానిక క్రైస్తవ విశ్వాసుల సమాజాన్ని సూచిస్తుంది; ‘సంఘం’ ఆధునిక తెలుగు బైబిలు వాడుకలో స్పష్టమైన పదం.
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: కెంక్రేయలోని
  rationale: స్థలనామాన్ని తెలుగు ధ్వన్యనుసారం లిప్యంతరీకరించి, ἐν సూచించే స్థానిక సంబంధాన్ని సహజంగా వ్యక్తపరుస్తుంది.
theological_decisions:
- issue: διάκονον సాధారణ సేవను సూచిస్తుందా, లేక గుర్తింపు పొందిన సంఘ పరిచర్య పాత్రను సూచిస్తుందా?
  choice: పరిచారకురాలు
  alternative: సేవకురాలు; పరిచర్యకురాలు; డీకన్
  rationale: ‘కెంక్రేయలోని సంఘానికి’ అనే సంబంధం ఒక స్థానిక సంఘంతో గుర్తించదగిన పరిచర్య బంధాన్ని సూచించవచ్చు. అయితే మూలపదమే అధికారిక పదవిని తప్పనిసరిగా నిర్ధారించదు. అందువల్ల ప్రధాన పాఠ్యంలో రెండు అవకాశాలకూ తావిచ్చే పదాన్ని ఎంచుకుని, వివాదాన్ని పాదటిప్పణిలో స్పష్టంగా నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన పత్రికా శైలిని వాడాం. ‘సహోదరి’ ద్వారా సంఘంలోని కుటుంబసంబంధ భాషను నిలిపాం. ‘పరిచారకురాలు’ స్త్రీలింగాన్ని స్పష్టంగా తెలియజేస్తూ, నిర్దిష్ట సంఘపరంపర పదవీ నిర్వచనాన్ని పాఠ్యంలోకి దిగుమతి చేయకుండా ఉంచుతుంది.
