  to: అంతేకాదు, మన ప్రభువైన యేసు మెస్సీయ[a] ద్వారా దేవునిలో మనం అతిశయిస్తున్నాం[b]; ఆయన ద్వారా ఇప్పుడు ఆ సయోధ్యను పొందాము[c].
