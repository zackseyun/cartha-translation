id: ROM.5.11
reference: Romans 5:11
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: te
  text: అంతేకాదు, మన ప్రభువైన యేసు మెస్సీయ[a] ద్వారా దేవునిలో మనం అతిశయిస్తున్నాం[b]; ఆయన ద్వారా ఇప్పుడు ఆ సయోధ్యను పొందాము[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'గ్రీకు: క్రిస్టోస్; సంప్రదాయంగా ‘క్రీస్తు’.'
    reason: alternative_reading
  - marker: b
    text: లేదా ‘దేవుణ్ణిబట్టి ఆనందిస్తున్నాం’ లేదా ‘దేవునిలో ఉప్పొంగుతున్నాం’.
    reason: lexical_alternative
  - marker: c
    text: లేదా ‘సయోధ్యను పొందాము’.
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμενοι
  choice: అతిశయిస్తున్నాం
  rationale: ఈ క్రియ దేవుణ్ణిబట్టి కలిగే ఆనందభరితమైన గర్వాన్ని లేదా ఉప్పొంగడాన్ని సూచిస్తుంది. ‘అతిశయిస్తున్నాం’ మూలపదంలోని ‘boast’ భావాన్ని నేరుగా నిలుపుతుంది; ఇది స్వీయగర్వం కాదని ‘దేవునిలో’ అనే పదబంధం స్పష్టం చేస్తుంది.
- source_word: ἐν τῷ θεῷ
  choice: దేవునిలో
  rationale: ἐν తో వచ్చిన దత్తి విభక్తి అతిశయానికి ఆధారం లేదా పరిధి దేవుడే అని తెలియజేస్తుంది. మూలంలోని రూపకాన్ని నిలుపుతూ సహజమైన తెలుగు ప్రయోగాన్ని వాడింది.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: మన ప్రభువైన యేసు మెస్సీయ ద్వారా
  rationale: διά తో షష్ఠీ విభక్తి మధ్యవర్తిత్వాన్ని సూచిస్తుంది. κύριος ను ‘ప్రభువు’గా, Χριστός అనే బిరుదును దాని అర్థం స్పష్టమయ్యేలా ‘మెస్సీయ’గా అనువదించింది.
- source_word: τὴν καταλλαγὴν
  choice: ఆ సయోధ్యను
  rationale: καταλλαγή విరోధం తొలగి సంబంధం పునరుద్ధరించబడటాన్ని సూచిస్తుంది. ‘సయోధ్య’ ఈ భావాన్ని సంక్షిప్తంగా అందిస్తుంది; నిర్దిష్ట ఉపపదం τὴν మరియు ముందటి వచనాల సందర్భాన్ని ‘ఆ’ సూచిస్తుంది.
- source_word: νῦν ... ἐλάβομεν
  choice: ఇప్పుడు ... పొందాము
  rationale: νῦν ను స్పష్టంగా ‘ఇప్పుడు’గా ఉంచి, aorist ἐλάβομεν ను పూర్తయిన స్వీకరణగా ‘పొందాము’ అని అనువదించింది.
theological_decisions:
- issue: Χριστοῦ అనే క్రీస్తుశాస్త్ర సంబంధమైన బిరుదు
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: Χριστός ఇక్కడ యేసుకు ఉన్న అభిషిక్త రాజు అనే బిరుదును సూచిస్తుంది. ‘మెస్సీయ’ ఆ బిరుదు భావాన్ని పారదర్శకంగా తెలియజేస్తుంది; సంప్రదాయ రూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఇచ్చింది.
- issue: καταλλαγή సూచించే సంబంధ పునరుద్ధరణ
  choice: సయోధ్య
  alternative: సమాధానం / సమాధానపరచబడటం
  rationale: పౌలు దేవునితో విరోధం తొలగి సంబంధం పునరుద్ధరించబడిన వాస్తవాన్ని సూచిస్తున్నాడు. ‘సయోధ్య’ దానిని కేవలం అంతరంగ శాంతిగా పరిమితం చేయకుండా నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడింది. మూలంలోని ‘దేవునిలో అతిశయించడం’ అనే బలమైన రూపకాన్ని సులభీకరించకుండా నిలిపింది. పొడవైన గ్రీకు నిర్మాణాన్ని తెలుగులో రెండు వాక్యాలుగా విభజించినా, యేసు మెస్సీయ ద్వారా అనే మధ్యవర్తిత్వ సంబంధాన్ని రెండింటిలోనూ స్పష్టంగా కాపాడింది.
