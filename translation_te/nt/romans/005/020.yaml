source:
  edition: SBLGNT
  text: νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/020.yaml
  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: te
  text: అపరాధం మరింత పెరగడానికి ధర్మశాస్త్రం అదనంగా ప్రవేశించింది[a]; అయితే పాపం పెరిగిన చోట కృప మరింత సమృద్ధిగా విస్తరించింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తోడుగా ప్రవేశించింది,’ ‘వచ్చింది.’ గ్రీకు పదం మరొక దానితోపాటు లేదా అదనంగా ప్రవేశించడాన్ని సూచించగలదు.
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: ధర్మశాస్త్రం
  rationale: నిర్దిష్ట ఉపపదంతోను పౌలు సందర్భంతోను ఇది మోషే ధర్మశాస్త్రాన్ని సూచిస్తుంది; ఆధునిక తెలుగు బైబిలు వాడుకలో ‘ధర్మశాస్త్రం’ స్పష్టమైన, గౌరవప్రదమైన పదం.
- source_word: παρεισῆλθεν
  choice: మధ్యలో ప్రవేశించింది
  rationale: కేవలం ‘ప్రవేశించింది’ అనకుండా, మరొక దానితోపాటు లేదా అదనంగా ప్రవేశించిందనే παρά- భావాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: ἵνα πλεονάσῃ
  choice: అధికమయ్యేలా
  rationale: ἵνα తో కూడిన సంభావ్యార్థక క్రియలోని ఉద్దేశ్య బలాన్ని నిలుపుతుంది; దాన్ని కేవలం ఫలితంగా మార్చి వేదాంతపరమైన ఉద్రిక్తతను తొలగించదు.
- source_word: τὸ παράπτωμα
  choice: అపరాధం
  rationale: ఆదాము చేసిన నిర్దిష్ట ఉల్లంఘనతో సందర్భ సంబంధాన్ని నిలుపుతూ, సాధారణ ఆధునిక పాఠకులకు అర్థమయ్యే పదం.
- source_word: οὗ
  choice: ఎక్కడ ... అక్కడ
  rationale: గ్రీకు సంబంధ అవ్యయాన్ని సహజమైన తెలుగు పరస్పర నిర్మాణంతో వ్యక్తపరుస్తుంది.
- source_word: ἁμαρτία
  choice: పాపం
  rationale: పౌలు రచనల్లో ἁμαρτίαకు ప్రామాణికమైన, స్పష్టమైన తెలుగు సమానార్థకం.
- source_word: ὑπερεπερίσσευσεν
  choice: అంతకంతగా పొంగిపొర్లింది
  rationale: సాధారణంగా అధికమవడం కంటే మితిమీరిన సమృద్ధిని సూచించే బలమైన సంయుక్త క్రియార్థాన్ని సహజంగా అందిస్తుంది.
- source_word: ἡ χάρις
  choice: కృప
  rationale: χάριςకు స్థిరపడిన, స్పష్టమైన వేదాంతపరమైన తెలుగు పదం.
theological_decisions:
- issue: ధర్మశాస్త్రం ప్రవేశించడానికీ అపరాధం అధికమవడానికీ మధ్య ἵνα సూచించే సంబంధాన్ని ఉద్దేశ్యంగా ఉంచాలా, కేవలం ఫలితంగా మృదువుచేయాలా?
  choice: ‘అపరాధం అధికమయ్యేలా’ అని ఉద్దేశ్య బలాన్ని నిలిపాము.
  alternative: ‘దాని ఫలితంగా అపరాధం అధికమైంది’
  rationale: గ్రీకు పాఠంలో ἵνα మరియు సంభావ్యార్థక క్రియ స్పష్టంగా ఉన్నాయి. పాపాన్ని దేవుడు నైతికంగా ఆమోదించాడనే భావాన్ని చేర్చకుండానే, పౌలు వాక్యంలోని వేదాంతపరమైన ఉద్రిక్తతను అనువాదం నిలుపాలి.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు సులభమైన శైలి. ‘అయితే’ δέ యొక్క వ్యతిరేక సంబంధాన్ని తెలియజేస్తుంది; ప్రారంభ δέకు ‘కూడా’ ద్వారా స్వల్ప అనుబంధ భావం ఇచ్చాం. ప్రధాన పాఠ్యంలో ప్రతి పాదటిప్పణి గుర్తు చేర్చబడింది.
