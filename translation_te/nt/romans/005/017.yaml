id: ROM.5.17
reference: Romans 5:17
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: te
  text: ఎందుకంటే, ఒక్కడి అపరాధం వల్ల ఆ ఒక్కడి ద్వారా మరణం ఏలితే, కృప సమృద్ధిని, నీతి అనే వరాన్ని[a] పొందేవారు ఆ ఒక్కరైన యేసు మెస్సీయ[b] ద్వారా జీవంలో అంతకంటే ఎంతో ఎక్కువగా ఏలుతారు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “న్యాయం అనే వరాన్ని.”
    reason: δικαιοσύνηςకు సందర్భానుసారంగా సాధ్యమైన న్యాయం అనే అర్థాన్ని నిలుపుతుంది.
  - marker: b
    text: లేదా, “యేసు క్రీస్తు.”
    reason: మెస్సీయకు తెలుగులో స్థిరపడిన నామసదృశ ప్రత్యామ్నాయ రూపాన్ని ఇస్తుంది.
lexical_decisions:
- source_word: παραπτώματι
  choice: అపరాధం
  rationale: తప్పిపడటం లేదా హద్దు మీరటం అనే మూలభావాన్ని సందర్భానుసారంగా తెలియజేస్తూ, ఆదాము–మెస్సీయ వ్యత్యాసంలో సహజంగా సరిపోతుంది.
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: ఏలితే / ఏలుతారు
  rationale: మరణం ఏలడం, విశ్వాసులు జీవంలో ఏలడం అనే రాజరిక రూపకాన్ని రెండు చోట్లా నిలుపుతుంది.
- source_word: περισσείαν τῆς χάριτος
  choice: సమృద్ధియైన కృపను
  rationale: కృప యొక్క విస్తార సమృద్ధిని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: δωρεᾶς τῆς δικαιοσύνης
  choice: నీతి అనే వరాన్ని
  rationale: వరమూ నీతీ మధ్య ఉన్న గ్రీకు షష్ఠీ సంబంధాన్ని అతిగా సిద్ధాంతీకరించకుండా, నీతినే ప్రసాదించబడే వరంగా సహజంగా వ్యక్తం చేస్తుంది.
- source_word: λαμβάνοντες
  choice: పొందేవారు
  rationale: ఈ ప్రజలను పొందడం అనే లక్షణం ద్వారా గుర్తించే వర్తమాన కృదంత భావాన్ని తెలుగులో సహజంగా అందిస్తుంది.
- source_word: ἐν ζωῇ
  choice: జీవంలో
  rationale: మరణం ఏలడానికీ జీవంలో ఏలడానికీ మధ్యనున్న సంక్షిప్త వ్యత్యాసాన్ని కాపాడుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός యొక్క అభిషిక్త రాజు అనే బిరుదు భావాన్ని స్పష్టంగా ఉంచుతుంది; సంప్రదాయ నామరూపమైన ‘క్రీస్తు’ను పాదసూచికలో ఇస్తుంది.
theological_decisions:
- issue: δικαιοσύνης పదానికి పౌలు సందర్భంలోని అర్థం
  choice: నీతి అనే వరం
  alternative: న్యాయం అనే వరం
  rationale: రోమీయులకు 5లోని నీతిమంతులుగా తీర్చబడటం అనే సమీప సందర్భానికి ‘నీతి’ సరిపోతుంది; అయినా న్యాయం/సరైన క్రమం అనే విస్తృత భావాన్ని పాదసూచికలో నిలుపుతుంది.
- issue: Ἰησοῦ Χριστοῦలో Χριστός అనువాదం
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: ఇక్కడ వ్యక్తినామంతో కలిసివున్నప్పటికీ Χριστόςలోని బిరుదు భావాన్ని పాఠ్యంలో కనిపించేలా చేస్తుంది; తెలుగులో స్థిరపడిన నామసదృశ రూపాన్ని పాదసూచికలో భద్రపరుస్తుంది.
- issue: πολλῷ μᾶλλον యొక్క తార్కిక బలం
  choice: అంతకంటే ఎంతో ఎక్కువగా
  alternative: మరి ఎంత నిశ్చయంగా
  rationale: పౌలు చేస్తున్న ‘ఒక్కడి అపరాధం’ నుండి ‘ఒక్కడైన యేసు మెస్సీయ’ ద్వారా కలిగే మరింత గొప్ప ఫలితానికి సంబంధించిన తులనను నేరుగా నిలుపుతుంది; దానిని కేవలం నిశ్చయార్థంగా పరిమితం చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సామాన్య పాఠకులకు అర్థమయ్యే గంభీర శైలి. ‘ఏలడం’ అనే రాజరిక రూపకం, ‘మరణం/జీవం’ వ్యత్యాసం, ‘ఒక్కడు’ అనే ఉద్దేశపూర్వక పునరుక్తి నిలుపబడ్డాయి. ప్రతి పాదసూచిక సూచిక ప్రధాన పాఠ్యంలో సంబంధిత పదబంధం వెంట ఉంచబడింది.
