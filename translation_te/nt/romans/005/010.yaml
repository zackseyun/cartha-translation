  to: ఎందుకంటే, మనం శత్రువులుగా ఉన్నప్పుడు ఆయన కుమారుని మరణం ద్వారా దేవునితో సమాధానపరచబడ్డామంటే, సమాధానపరచబడిన మనం ఆయన జీవం ద్వారా[a] మరెంతో ఎక్కువగా రక్షించబడతాం.
  rationale: The revision retains the conditional argument introduced by εἰ γάρ, the aorist-passive reconciliation preceding future salvation, and the death/life contrast. It removes added emphasis from ‘అప్పుడే’ and added certainty from ‘నిశ్చయంగా,’ rendering Paul’s πολλῷ μᾶλλον more directly as ‘మరెంతో ఎక్కువగా.’
