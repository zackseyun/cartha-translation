id: ROM.5.10
reference: Romans 5:10
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: te
  text: ఎందుకంటే, మనం శత్రువులుగా ఉన్నప్పుడు ఆయన కుమారుని మరణం ద్వారా దేవునితో సమాధానపరచబడ్డామంటే, సమాధానపరచబడిన మనం ఆయన జీవం ద్వారా[a] మరెంతో ఎక్కువగా రక్షించబడతాం.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘ఆయన జీవంలో రక్షించబడతాం.’
    reason: ἐν τῇ ζωῇ αὐτοῦ అనే పదబంధానికి సాధనార్థకమైన ‘ఆయన జీవం ద్వారా’ అనే అనువాదంతో పాటు, స్థానార్థక లేదా సహవాసార్థకమైన ప్రత్యామ్నాయాన్ని నిలుపుతుంది.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: ఎందుకంటే ... సమాధానపరచబడ్డామంటే
  rationale: γάρ సూచించే మునుపటి వాదనతో సంబంధాన్ని ‘ఎందుకంటే’ తెలియజేస్తుంది; εἰ యొక్క షరతు రూపాన్ని ‘అంటే’ నిలుపుతుంది. సందర్భంలో ఈ షరతు నిజమని భావించిన వాదన అయినప్పటికీ దాన్ని నేరుగా కారణవాక్యంగా మార్చలేదు.
- source_word: ἐχθροὶ ὄντες
  choice: మనం శత్రువులుగా ఉన్నప్పుడే
  rationale: ὄντες యొక్క కాలసంబంధ భావాన్ని, ἐχθροί సూచించే దేవునితో విరోధ సంబంధాన్ని సహజమైన ఆధునిక తెలుగులో వ్యక్తం చేస్తుంది; ‘అప్పుడే’ తరువాతి ‘మరెంతో’ వాదనకు బలం ఇస్తుంది.
- source_word: κατηλλάγημεν
  choice: సమాధానపరచబడ్డాం
  rationale: క్రియలోని aorist passive భావాన్ని నిలుపుతూ, విరోధం తొలగి సంబంధం పునరుద్ధరించబడిందనే καταλλάσσω భావాన్ని తెలియజేస్తుంది.
- source_word: τῷ θεῷ
  choice: దేవునితో
  rationale: καταλλάσσω తరువాత వచ్చే దత్తివును తెలుగులో సంబంధ పునరుద్ధరణకు సహజంగా వినిపించే ‘దేవునితో’గా ఇచ్చింది; దేవుడే క్రియను జరిగించే వాడని అదనంగా చేర్చలేదు.
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: ఆయన కుమారుని మరణం ద్వారా
  rationale: διά + genitive తెలిపే సాధన భావాన్ని ‘ద్వారా’ స్పష్టంగా నిలుపుతుంది; ‘ఆయన కుమారుడు’ అనే సంబంధపూర్వక క్రీస్తు బిరుదును విస్తరించదు.
- source_word: πολλῷ μᾶλλον
  choice: మరెంతో నిశ్చయంగా
  rationale: ఇది పౌలు ఉపయోగించిన lesser-to-greater వాదన బలాన్ని సహజ తెలుగులో తెలియజేస్తుంది. ‘నిశ్చయంగా’ సందర్భంలోని తార్కిక బలాన్ని వ్యక్తం చేస్తుంది; పరిమాణాన్ని ‘మరెంతో’ నిలుపుతుంది.
- source_word: καταλλαγέντες
  choice: సమాధానపరచబడిన మనం
  rationale: భవిష్యత్ రక్షణకు ముందే సమాధానపరచడం జరిగినదని aorist passive participle సూచించే క్రమాన్ని సంక్షిప్తంగా నిలుపుతుంది.
- source_word: σωθησόμεθα
  choice: రక్షించబడతాం
  rationale: భవిష్యత్ passive రూపాన్ని, పౌలు చెప్పే భవిష్యద్ముఖ రక్షణ భావాన్ని నేరుగా నిలుపుతుంది.
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: ఆయన జీవం ద్వారా
  rationale: ముందున్న ‘ఆయన కుమారుని మరణం ద్వారా’ అనే వాక్యభాగంతో మరణం–జీవం సమాంతరాన్ని నిలుపుతూ ἐνను సాధనార్థకంగా గ్రహిస్తుంది. మూలంలోని స్థానార్థక/సహవాసార్థక అవకాశాన్ని పాదసూచికలో నిలిపింది.
theological_decisions:
- issue: ἐν τῇ ζωῇ αὐτοῦ యొక్క భావం
  choice: 'సాధనార్థకం: ‘ఆయన జీవం ద్వారా’'
  alternative: 'స్థానార్థకం లేదా సహవాసార్థకం: ‘ఆయన జీవంలో’'
  rationale: ‘ఆయన కుమారుని మరణం ద్వారా’ అనే సమీప వాక్యభాగంతో ఉన్న వ్యత్యాసం, సమాధానపరచడం ఆయన మరణం ద్వారా జరిగితే అంతిమ రక్షణ ఆయన జీవం ద్వారా కలుగుతుందనే భావాన్ని బలపరుస్తుంది. అయితే ἐν యొక్క నిజమైన స్థానార్థక/సహవాసార్థక సాధ్యతను పాదసూచికలో ఉంచి theological tensionను తొలగించలేదు.
- issue: εἰ యొక్క వాదనాత్మక బలం
  choice: షరతు రూపాన్ని ‘సమాధానపరచబడ్డామంటే’గా నిలుపడం
  alternative: నిజమైన కారణంగా ‘సమాధానపరచబడ్డాం కాబట్టి’
  rationale: సందర్భంలో పౌలు premiseను నిజమైనదిగా స్వీకరిస్తున్నప్పటికీ, గ్రీకు εἰ యొక్క రూపాన్ని పూర్తిగా కారణార్థకంగా మార్చకుండా అతని వాదనా నిర్మాణాన్ని కాపాడింది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలి. ‘సమాధానపరచబడ్డాం’ అనే పదం కొంత అధికారికమైనదైనా, విరోధుల స్థితి నుంచి సంబంధ పునరుద్ధరణకు మారడాన్ని ఖచ్చితంగా తెలియజేస్తుంది. వాక్యంలోని షరతు, గత సమాధానపరచడం, భవిష్యత్ రక్షణ అనే క్రమం స్పష్టంగా ఉంచబడింది.
