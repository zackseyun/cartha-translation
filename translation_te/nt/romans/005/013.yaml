id: ROM.5.13
reference: Romans 5:13
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: te
  text: ఎందుకంటే, ధర్మశాస్త్రం వచ్చేంతవరకు పాపం లోకంలో ఉండేది; అయితే ధర్మశాస్త్రం లేనప్పుడు పాపం లెక్కించబడదు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “ఒకరి ఖాతాలో వేయబడదు,” లేదా “ఆపాదించబడదు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι
  choice: వచ్చేంతవరకు
  rationale: ధర్మశాస్త్రం ఇవ్వబడటానికి ముందున్న కాలాన్ని సూచించే సహజమైన తెలుగు ప్రయోగం; కాలపరమైన ‘వరకు’ అనే భావాన్ని నిలుపుతుంది.
- source_word: νόμου
  choice: ధర్మశాస్త్రం
  rationale: రోమా 5లో ఆదాము నుండి మోషే వరకు ఉన్న కాలం ప్రస్తావనలో ఉన్నందున, ఇక్కడ మోషే ధర్మశాస్త్రం సహజంగా సూచించబడుతుంది; అయితే వచనంలో ‘మోషే’ అని అదనంగా చేర్చలేదు.
- source_word: ἁμαρτία
  choice: పాపం
  rationale: పౌలు వాడిన ఏకవచన భావనను, అలాగే దానికి ఉండగల వ్యక్తీకృత బలాన్ని అతిగా వివరించకుండా నిలుపుతుంది.
- source_word: ἐν κόσμῳ
  choice: లోకంలో
  rationale: మానవ లోకంలో పాపం ఉన్నదనే సాధారణ, సహజమైన అర్థాన్ని ఇస్తుంది.
- source_word: ἐλλογεῖται
  choice: లెక్కించబడదు
  rationale: ఖాతా లేదా బాధ్యతకు చేర్చడం అనే భావాన్ని సులభమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; ప్రధాన పాఠ్యంలో భారమైన సిద్ధాంత పరిభాషను నివారిస్తుంది.
- source_word: μὴ ὄντος νόμου
  choice: ధర్మశాస్త్రం లేనప్పుడు
  rationale: ధర్మశాస్త్రం లేకపోవడాన్ని ఈ వాక్యానికి వర్తించే పరిస్థితిగా సహజమైన తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘ధర్మశాస్త్రం’ దేనిని సూచిస్తుంది?
  choice: సందర్భం ద్వారా మోషే ధర్మశాస్త్రం సూచితమయ్యేలా ‘ధర్మశాస్త్రం’ అని అనువదించడం
  alternative: ఏ ప్రత్యేక ధర్మశాస్త్రాన్నీ సూచించకుండా సాధారణంగా ‘చట్టం’ అని అనువదించడం
  rationale: రోమా 5 సందర్భం ఆదాము నుండి మోషే వరకు ఉన్న కాలాన్ని పోల్చుతుంది; కాబట్టి మోషే ధర్మశాస్త్రం ప్రధాన సూచన. అయినా గ్రీకు పాఠ్యంలో లేని ‘మోషే’ అనే పదాన్ని అనువాదంలో చేర్చలేదు.
- issue: ἐλλογεῖται పదంలోని లెక్క/ఆపాదన భావం
  choice: ప్రధాన పాఠ్యంలో ‘లెక్కించబడదు’
  alternative: ‘ఒకరి ఖాతాలో వేయబడదు’ లేదా ‘ఆపాదించబడదు’
  rationale: ఈ పదానికి ఖాతాపరమైన లేదా నిందను ఆపాదించే బలం ఉంది. ‘లెక్కించబడదు’ ఆ భావాన్ని స్పష్టంగా ఉంచుతూ, ఒక నిర్దిష్ట సిద్ధాంత వ్యాఖ్యానాన్ని బలవంతంగా రుద్దదు; ప్రత్యామ్నాయాలను పాదటిప్పణిలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గంభీరమైన శైలి. γάρ‌కు ‘ఎందుకంటే’ను ఉంచి వాదనాత్మక అనుసంధానాన్ని నిలిపాం. పాదటిప్పణి గుర్తును అది వివరిస్తున్న ‘లెక్కించబడదు’ అనే పదం తరువాత ఉంచాం.
