  source_fidelity: గ్రీకు మూలంలోని కాలసూచకమైన ἄχρι ... νόμουను “ధర్మశాస్త్రం వచ్చేంతవరకు” అని సందర్భానుగుణంగా, సహజంగా ఇచ్చారు. ἁμαρτία ἦν ἐν κόσμῳ యొక్క అసంపూర్ణ భూతకాల భావం “పాపం లోకంలో ఉండేది”లో నిలిచింది. ἐλλογεῖται యొక్క వర్తమాన, ఖాతాపరమైన భావాన్ని “లెక్కించబడదు” సరిగ్గా వ్యక్తం చేస్తుంది; μὴ ὄντος νόμου షరతును “ధర్మశాస్త్రం లేనప్పుడు” స్పష్టంగా ఇస్తుంది.
