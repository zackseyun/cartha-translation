theological_decisions:
- issue: పౌలు రచనలో Χριστός అనువాదం
  choice: మెస్సీయ
  alternative: క్రీస్తు
  rationale: ఈ సందర్భంలో పదం కేవలం పేరులా కాక మెస్సీయ బిరుదుగా పనిచేస్తుంది. ‘మెస్సీయ’ మూలపదంలోని బిరుదు భావాన్ని వెల్లడిస్తుంది; సాంప్రదాయ రూపాన్ని పాదసూచికలో ఇస్తుంది.
- issue: ὑπὲρ ἡμῶν యొక్క భావపరిధి
  choice: మన కోసం
  alternative: మన పక్షంగా; మన స్థానంలో
  rationale: ఈ వాక్యం మెస్సీయ మరణం మన ప్రయోజనార్థమని స్పష్టంగా చెబుతుంది; అయితే ‘మన స్థానంలో’ అని ప్రధాన పాఠంలో పెట్టడం మూలంలోని విస్తృత భావాన్ని ఒక ప్రత్యేక ప్రాయశ్చిత్త వివరణకు పరిమితం చేయవచ్చు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే శైలి. మూలంలోని వర్తమానకాల ‘కనపరుస్తున్నాడు,’ ‘తన సొంత’ అనే ఉద్ఘాటన, ‘ఇంకా పాపులుగా ఉన్నప్పుడే’ అనే కాల-వ్యతిరేక భావం నిలుపబడ్డాయి. సహజమైన తెలుగు వాక్యప్రవాహం కోసం వివరణాత్మక ὅτι ఉపవాక్యాన్ని ‘ఇలా:’ తర్వాత ఉంచాం.
