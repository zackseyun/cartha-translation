  text: 'కానీ దేవుడు మనపట్ల[a] తన సొంత ప్రేమను ఇలా కనపరుస్తున్నాడు: మనం ఇంకా పాపులుగా ఉన్నప్పుడే మెస్సీయ[b] మన కోసం[c] చనిపోయాడు.'
