  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: te
  text: ఈ విధంగా, పాపం మరణంలో ఏలినట్లే, కృప కూడా నీతి ద్వారా నిత్యజీవానికి మన ప్రభువైన యేసు మెస్సీయ ద్వారా ఏలునట్లు.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘నీతి ద్వారా’ అనే మాటకు ‘న్యాయం ద్వారా’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: అందువల్ల … నడిపించాలి
  rationale: ἵνα ఇక్కడ ముందున్న వాక్యప్రవాహానికి ఉద్దేశం లేదా ఫలితాన్ని కలుపుతుంది. తెలుగులో సహజంగా ఉండేలా ‘అందువల్ల’తో సంబంధాన్ని చూపి, subjunctive భావాన్ని ‘ఏలుతూ … నడిపించాలి’తో వ్యక్తం చేశాం.
- source_word: ἐβασίλευσεν
  choice: ఏలినట్లే
  rationale: పౌలు ఉపయోగించిన రాజరిక రూపకాన్ని కాపాడుతూ, aorist indicative యొక్క గతకాల భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἐν τῷ θανάτῳ
  choice: మరణంలో
  rationale: ἐν సూచించే పరిధి లేదా క్షేత్ర భావాన్ని సంక్షిప్తంగా కాపాడుతుంది; ‘మరణం ద్వారా’ అని కారణార్థాన్ని అనవసరంగా నిర్ణయించదు.
- source_word: ἡ χάρις
  choice: కృప
  rationale: పాపానికి విరుద్ధంగా వ్యక్తీకరించబడిన పౌలు భావాన్ని నిలుపుకునే ప్రామాణిక, సుపరిచిత తెలుగు పదం.
- source_word: βασιλεύσῃ
  choice: ఏలుతూ
  rationale: ἵνα ఆధీనంలోని subjunctive భావాన్ని మొత్తం తెలుగు నిర్మాణంలో సహజంగా వ్యక్తం చేస్తూ రాజరిక రూపకాన్ని నిలుపుతుంది.
- source_word: διὰ δικαιοσύνης
  choice: నీతి ద్వారా
  rationale: διά + genitive యొక్క సాధనార్థాన్ని ‘ద్వారా’ తెలియజేస్తుంది; δικαιοσύνη యొక్క నీతి/న్యాయం అర్థపరిధిలో ప్రధాన పాఠానికి ‘నీతి’ సహజమైన ఎంపిక.
- source_word: εἰς ζωὴν αἰώνιον
  choice: నిత్యజీవానికి నడిపించాలి
  rationale: εἰς యొక్క గమ్యదిశను తెలుగులో స్పష్టంగా చేస్తుంది. ‘నిత్యజీవానికి’ మాత్రమే ఉంచితే వాక్యం అసహజంగా ఉండటంతో, అంతర్లీన గమ్యభావాన్ని ‘నడిపించాలి’తో వ్యక్తం చేశాం.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός యొక్క బిరుదు భావాన్ని ‘మెస్సీయ’గా పారదర్శకంగా నిలుపుతుంది; తెలుగులో వ్యక్తినామం తరువాత బిరుదును సహజంగా ఉంచింది.
- source_word: τοῦ κυρίου ἡμῶν
  choice: మన ప్రభువైన
  rationale: κύριοςను ‘ప్రభువు’గా, possessiveను ‘మన’గా సహజమైన తెలుగు విశేషణ నిర్మాణంలో అందిస్తుంది.
theological_decisions:
- issue: δικαιοσύνη యొక్క నీతి/న్యాయం అర్థపరిధి
  choice: నీతి ద్వారా
  alternative: న్యాయం ద్వారా
  rationale: పౌలు వాడుకలో దేవునితో సరైన సంబంధం, సద్వర్తన, న్యాయం వంటి భావాలు కలిసివుండవచ్చు. ప్రధాన పాఠంలో సుపరిచితమైన ‘నీతి’ని ఉంచి, ‘న్యాయం’ను పాదటిప్పణిలో కాపాడాం.
- issue: Χριστόςను బిరుదుగా లేదా పేరులో భాగంలా అనువదించడం
  choice: యేసు మెస్సీయ
  alternative: యేసు క్రీస్తు
  rationale: ఈ వాక్యాంతంలో Χριστός యొక్క అభిషిక్తుడనే బిరుదు భావం స్పష్టంగా నిలవగలదు; అందువల్ల ‘మెస్సీయ’ను ఎంచుకున్నాం, అయితే సంప్రదాయ పేరురూపమైన ‘క్రీస్తు’ కూడా సాధ్యమే.
- issue: ἵνα + subjunctiveలో ఉద్దేశం లేదా ఫలితం
  choice: అందువల్ల … నడిపించాలి
  alternative: అలా … ఏలేలా
  rationale: గ్రీకు నిర్మాణం ఉద్దేశం మరియు ఫలితం మధ్య కొంత తెరచి ఉంది. తెలుగు పాఠం ఖచ్చితంగా ఒక్కదానికే పరిమితం కాకుండా సందర్భఫలితాన్ని, లక్ష్యదిశను కలిపి వ్యక్తం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గంభీరమైనప్పటికీ సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘పాపం’ మరియు ‘కృప’ ఏలుతున్నాయనే మూలంలోని వ్యక్తీకరణను నిలిపాం. ప్రధాన పాఠంలోని [a] గుర్తు పాదటిప్పణితో సరిపోలుతుంది.
