id: ROM.5.3
reference: Romans 5:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ ⸀καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: te
  text: అంతేకాదు, శ్రమల్లో[b] కూడా మనం ఆనందిస్తున్నాం[a]. ఎందుకంటే శ్రమ ఓర్పును[c] కలిగిస్తుందని మనకు తెలుసు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “అతిశయిస్తున్నాం” లేదా “ఉల్లసిస్తున్నాం.”
    reason: lexical_alternative
  - marker: b
    text: లేదా “బాధల్లో” లేదా “కష్టాల్లో.”
    reason: lexical_alternative
  - marker: c
    text: లేదా “సహనం” లేదా “నిలకడ.”
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμεθα
  choice: ఆనందిస్తున్నాం
  rationale: ఇక్కడ దేవుడు శ్రమల ద్వారా కార్యం చేస్తాడనే నమ్మకంతో కలిగే సానుకూలమైన ఉల్లాసం భావం ఉంది. ఆధునిక తెలుగులో ‘ఆనందిస్తున్నాం’ సహజంగా ఉంది; ‘గర్విస్తున్నాం’ అనే పదానికి రావచ్చే స్వీయగర్వ భావాన్ని ఇది నివారిస్తుంది. ‘అతిశయిస్తున్నాం’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: θλίψεσιν / θλῖψις
  choice: శ్రమల్లో / శ్రమ
  rationale: ఒత్తిడి, బాధ, కష్టానుభవం అనే భావాలను ‘శ్రమ’ సహజంగా తెలియజేస్తుంది. మొదటి సందర్భంలోని బహువచనాన్ని, తరువాత సాధారణ సూత్రాన్ని తెలిపే ఏకవచనాన్ని నిలిపాం.
- source_word: ὑπομονήν
  choice: ఓర్పు
  rationale: కష్టాల మధ్య నిలకడగా సహిస్తూ కొనసాగడాన్ని ఆధునిక సాధారణ తెలుగులో ‘ఓర్పు’ స్పష్టంగా తెలియజేస్తుంది.
- source_word: κατεργάζεται
  choice: కలిగిస్తుంది
  rationale: శ్రమ ఫలితంగా ఓర్పు ఉత్పన్నమవుతుందనే కారణ-ఫలిత భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: εἰδότες
  choice: మనకు తెలుసు
  rationale: గ్రీకు కృదంతంలోని జ్ఞానాధారిత సంబంధాన్ని సహజమైన తెలుగు వాక్య నిర్మాణంలో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ఆధ్యాత్మిక సందర్భంలో καυχώμεθα భావం
  choice: దేవుని కార్యంపై నమ్మకంతో ఆనందించడం
  alternative: గర్వించడం లేదా అతిశయించడం
  rationale: పౌలు స్వీయగర్వాన్ని కాకుండా, శ్రమల ద్వారా కలిగే ఫలితాన్ని తెలిసిన విశ్వాసపూర్వక ఉల్లాసాన్ని చెబుతున్నాడు. ప్రధాన పాఠ్యంలో సహజమైన ‘ఆనందిస్తున్నాం’ వాడి, మూలపదంలోని అతిశయ భావాన్ని పాదసూచికలో నిలిపాం.
- issue: శ్రమ ఓర్పును కలిగిస్తుందనే వాక్యంలోని కారణ సంబంధం
  choice: ‘ఎందుకంటే ... మనకు తెలుసు’ అనే సహజ తెలుగు నిర్మాణం
  alternative: ‘తెలుసుకొని’ అనే కృదంత నిర్మాణం
  rationale: εἰδότες ప్రధాన క్రియకు ఆధారాన్ని తెలియజేస్తుంది. కారణార్థాన్ని స్పష్టంగా చూపడం సందర్భానికి తగినదే; శ్రమ యాంత్రికంగా తప్పనిసరిగా ఓర్పును కలిగిస్తుందని మించి వివరణ జోడించలేదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సామాన్య పాఠకులకు సులభంగా అర్థమయ్యే గౌరవప్రదమైన శైలి. మూలంలోని బహువచనం ‘శ్రమల్లో’ నుంచి సాధారణ సూత్రాన్ని తెలిపే ఏకవచనం ‘శ్రమ’కు మార్పును నిలిపాం. పాదసూచిక గుర్తులన్నీ సంబంధిత పదాల వెంట ప్రధాన పాఠ్యంలో ఉంచాం.
