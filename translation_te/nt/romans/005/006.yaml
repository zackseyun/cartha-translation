id: ROM.5.6
reference: Romans 5:6
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: te
  text: ఎందుకంటే, మనం ఇంకా బలహీనులుగా ఉన్నప్పుడు, తగిన సమయంలో మెస్సీయ దేవభక్తిలేనివారి కోసం[a] మరణించాడు.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “దేవభక్తిలేనివారి తరఫున.”
    reason: ὑπέρ అనే గ్రీకు విభక్త్యర్థక పదం ‘కోసం’తో పాటు ‘తరఫున’ అనే భావాన్ని కూడా మోయగలదు.
lexical_decisions:
- source_word: Χριστὸς
  choice: మెస్సీయ
  rationale: Χριστός ఇక్కడ బిరుదుగా పనిచేస్తోంది; అందువల్ల సంప్రదాయ లిప్యంతరీకరణకు బదులుగా దాని బిరుదు భావాన్ని తెలిపే “మెస్సీయ”ను వాడాం.
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: మనం ఇంకా బలహీనులుగా ఉన్నప్పుడే
  rationale: జెనిటివ్ అబ్సల్యూట్ నిర్మాణాన్ని సహజమైన తెలుగు కాలవాచక ఉపవాక్యంగా ఇచ్చాం. “బలహీనులు” మానవ అశక్తత అనే విస్తృత భావాన్ని అనవసరంగా కుదించదు.
- source_word: ἔτι
  choice: ఇంకా
  rationale: కొనసాగుతున్న స్థితిని సహజంగా తెలియజేస్తుంది; గ్రీకు పాఠంలోని భావాన్ని తెలుగులో అనవసర పునరుక్తి లేకుండా వ్యక్తం చేస్తుంది.
- source_word: κατὰ καιρὸν
  choice: తగిన సమయంలో
  rationale: సరైన లేదా అనుకూలమైన సమయమనే భావాన్ని కాపాడుతుంది; అది దైవ నియామకమేనని అనువాదంలో అదనంగా నిర్ధారించదు.
- source_word: ὑπὲρ
  choice: కోసం
  rationale: ప్రయోజనం, ప్రాతినిధ్యం లేదా ప్రత్యామ్నాయత వైపు సూచించగల గ్రీకు పదబంధాన్ని సహజమైన తెలుగులో విస్తృతంగానే ఉంచుతుంది.
- source_word: ἀσεβῶν
  choice: దేవభక్తిలేనివారి
  rationale: దేవునిపట్ల భక్తి లేదా గౌరవం లేనివారనే నైతిక-మతపరమైన భావాన్ని స్పష్టంగా తెలియజేస్తుంది.
- source_word: ἀπέθανεν
  choice: చనిపోయాడు
  rationale: క్రియ యొక్క సాధారణ అర్థాన్ని నేరుగా, ఆధునిక తెలుగులో తెలిపే రూపం; మూలంలో లేని విస్తరణను జోడించదు.
theological_decisions:
- issue: ὑπὲρ ἀσεβῶνలో మెస్సీయ మరణం యొక్క సంబంధం
  choice: దేవభక్తిలేనివారి కోసం
  alternative: దేవభక్తిలేనివారి తరఫున
  rationale: “కోసం” అనే రూపం ఆ మరణం దేవభక్తిలేనివారి ప్రయోజనార్థమని స్పష్టం చేస్తూనే, ప్రాతినిధ్యం లేదా ప్రత్యామ్నాయత యొక్క ఖచ్చిత స్వరూపాన్ని అనువాదమే సిద్ధాంతపరంగా నిర్ణయించకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన వాక్యనిర్మాణం వాడబడింది. అనుసంధానార్థక γάρను “ఎందుకంటే”గా నిలిపాం. పాదసూచిక గుర్తును దానికి సంబంధించిన “కోసం” పదబంధం వద్ద ఉంచాం.
