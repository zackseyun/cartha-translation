- from: ఎందుకంటే, మనం ఇంకా బలహీనులుగా ఉన్నప్పుడే, తగిన సమయంలో మెస్సీయ దేవభక్తిలేనివారి కోసం[a] చనిపోయాడు.
  to: ఎందుకంటే, మనం ఇంకా బలహీనులుగా ఉన్నప్పుడు, తగిన సమయంలో మెస్సీయ దేవభక్తిలేనివారి కోసం[a] మరణించాడు.
  rationale: The revision removes an unwarranted emphatic nuance from the temporal clause and uses a more suitable respectful verb, while retaining the draft’s source-faithful rendering of Χριστός, κατὰ καιρόν, ὑπέρ, and ἀσεβῶν. The existing footnote remains correctly placed and preserves the alternative nuance without doctrinal over-specification.
