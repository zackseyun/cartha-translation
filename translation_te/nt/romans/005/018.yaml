  revision_rationale: The revision explicitly marks the second half of Paul’s comparison and clarifies the judicial meaning of δικαίωσις. It retains the same unqualified ‘మనుషులందరికీ’ in both clauses, preserving the Greek wording and its unresolved theological tension. The footnote remains anchored to ‘నీతియుక్త కార్యం’ and supplies a more literal alternative for the two key expressions.
