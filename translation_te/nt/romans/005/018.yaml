id: ROM.5.18
reference: Romans 5:18
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: te
  text: కాబట్టి, ఒక అపరాధం ద్వారా మనుషులందరికీ శిక్షావిధి వచ్చినట్లే, అలాగే ఒక నీతియుక్త కార్యం ద్వారా మనుషులందరికీ జీవాన్ని కలిగించే నీతిమంతులుగా తీర్చడం వచ్చింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదన నుండి తీసుకున్న నిర్ధారణను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: παραπτώματος
  choice: అపరాధం
  rationale: ఒక నిర్దిష్టమైన తప్పిద క్రియను సూచిస్తూ, సాధారణమైన ‘పాపం’ అనే విస్తృత పదం కంటే గ్రీకు పదానికి దగ్గరగా ఉంటుంది.
- source_word: κατάκριμα
  choice: శిక్షావిధి
  rationale: దోషిగా తీర్చే న్యాయపరమైన తీర్పు భావాన్ని స్పష్టంగా నిలుపుతుంది.
- source_word: δικαιώματος
  choice: నీతికార్యం
  rationale: ఏకవచనంలో ఉన్న నిర్ణాయకమైన నీతియుక్త క్రియను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: δικαίωσιν ζωῆς
  choice: జీవాన్ని కలిగించే నీతినిర్ణయం
  rationale: న్యాయపరమైన నీతినిర్ణయ భావాన్నీ, దాని ఫలితమైన జీవాన్నీ రెండింటినీ నిలుపుతుంది; గ్రీకు షష్ఠీ సంబంధాన్ని అర్థవంతంగా వ్యక్తం చేస్తుంది.
- source_word: πάντας ἀνθρώπους
  choice: మనుషులందరికీ
  rationale: రెండు భాగాల్లోనూ ఒకే పదబంధాన్ని సమానంగా అనువదిస్తూ, దాని సమగ్ర మానవ పరిధిని నిలుపుతుంది.
theological_decisions:
- issue: రెండవ ‘మనుషులందరికీ’ అనే పదబంధం విశ్వవ్యాప్త భావాన్ని పరిమితం చేయాలా?
  choice: ప్రధాన పాఠ్యంలో ఎలాంటి వ్యాఖ్యానాత్మక పరిమితి లేకుండా ‘మనుషులందరికీ’ అని ఉంచడం.
  alternative: ‘విశ్వసించే వారందరికీ’ లేదా ‘నీతిమంతులుగా తీర్చబడిన వారందరికీ’ అని అనువదించడం.
  rationale: గ్రీకు పాఠ్యం పోలికలోని రెండు భాగాల్లోనూ πάντας ἀνθρώπους అనే ఒకే పదబంధాన్ని పునరావృతం చేస్తుంది. దానిని రెండవ భాగంలో మాత్రమే పరిమితం చేయడం పాఠ్యం ఉంచిన వేదాంతపరమైన ఉద్రిక్తతను అనువాదంలోనే పరిష్కరించినట్లవుతుంది.
- issue: δικαίωσιν ζωῆς లో ζωῆς అనే షష్ఠీ విభక్తి సంబంధం
  choice: ఫలితార్థకంగా ‘జీవాన్ని కలిగించే నీతినిర్ణయం’ అని అనువదించడం.
  alternative: మరింత అక్షరార్థంగా ‘జీవపు నీతినిర్ణయం’ అని అనువదించడం.
  rationale: గ్రీకు నిర్మాణం సంక్షిప్తంగా, కొంత అనిశ్చితంగా ఉన్నప్పటికీ, ఈ రూపం న్యాయపరమైన నీతినిర్ణయాన్నీ జీవంతో దాని సంబంధాన్నీ సహజ తెలుగులో కాపాడుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలో స్పష్టంగా లేని క్రియను తెలుగులో వాక్యపూర్ణత కోసం ‘కలిగింది’గా సరఫరా చేశాం. ఆదాము–క్రీస్తు మధ్య సమాంతరాన్ని నిలుపుటకు రెండు భాగాల నిర్మాణాన్ని సాధ్యమైనంత సమంగా ఉంచాం.
