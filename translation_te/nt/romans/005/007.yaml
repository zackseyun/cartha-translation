revisions:
- from: నీతిమంతుడి కోసం ఎవరైనా చనిపోవడం అరుదు[a]; అయితే మంచి వ్యక్తి కోసం ఎవరైనా చనిపోవడానికి సాహసించవచ్చు.
  to: ఎవరైనా నీతిమంతుడి కోసం చనిపోవడం అరుదు[a]; అయితే మంచి వ్యక్తి కోసం ఎవరైనా బహుశా చనిపోవడానికి కూడా సాహసించవచ్చు.
  rationale: The revision retains the draft’s sound distinction between the two moral descriptors while explicitly translating τάχα as “బహుశా” and ascensive καί as “కూడా.” The footnote anchor remains correctly attached to “నీతిమంతుడి,” introducing the note on the contrast with “మంచి వ్యక్తి.”
