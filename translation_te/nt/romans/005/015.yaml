id: ROM.5.15
reference: Romans 5:15
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: te
  text: కాని వరం అపరాధంలాంటిది కాదు. ఆ ఒక్క మనిషి అపరాధం ద్వారా ఆ అనేకులు చనిపోయారంటే, దేవుని కృప, ఒక్క మనిషియైన యేసు మెస్సీయ కృప ద్వారా వచ్చిన వరం, అనేకులపై మరెంతో సమృద్ధిగా పొంగిపొర్లింది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράπτωμα
  choice: అపరాధం
  rationale: తప్పుదారి పట్టిన కార్యం, నైతిక అతిక్రమం అనే భావాలను సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది; అతి సాంకేతిక న్యాయపదాన్ని ఉపయోగించదు.
- source_word: χάρισμα
  choice: వరం
  rationale: ఆదాము అపరాధానికి ఎదురుగా దేవుడు ఇచ్చేదాన్ని సంక్షిప్తంగా, సహజంగా చూపిస్తుంది; దాని కృపాస్వభావం తరువాతి χάρις పదబంధంలో స్పష్టమవుతుంది.
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: అనేకులు / అనేకుల కోసం
  rationale: ఒక్కడు–అనేకులు అనే పౌలు నిర్మించిన వ్యత్యాసాన్ని నిలుపుతుంది. దీనిని ‘అందరూ’ అని మార్చి భావపరిధిని ముందుగానే తేల్చదు.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: దేవుని కృప
  rationale: గ్రీకు సంబంధ నిర్మాణాన్ని సహజమైన తెలుగు రూపంలో స్పష్టంగా అందిస్తుంది.
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: కృపలో లభించిన వరం
  rationale: ἐν χάριτι లోని సంబంధం/సాధనార్థక భావాన్ని పూర్తిగా ఒకే విధంగా నిర్ణయించకుండా, వరం కృపలోనే లభిస్తుందనే భావాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: ఒక్క మనిషియైన
  rationale: ఒక్కడు–అనేకులు అనే ప్రతినిధిత్వ వ్యత్యాసాన్ని తెలుగులో స్పష్టంగా నిలుపుతుంది.
- source_word: Ἰησοῦ Χριστοῦ
  choice: యేసు మెస్సీయ
  rationale: Χριστός ను ఇంటిపేరులా కాక ‘అభిషిక్తుడు/మెస్సీయ’ అనే బిరుదుగా వినిపిస్తుంది; తెలుగు వాక్యంలో బిరుదును సహజంగా పేరుతో కలుపుతుంది.
- source_word: ἐπερίσσευσεν
  choice: మరెంత సమృద్ధిగా పొంగిపొర్లాయి
  rationale: πολλῷ μᾶλλον తో కూడిన మితిమీరిన సమృద్ధి భావాన్ని సజీవమైన, అర్థమయ్యే తెలుగులో అందిస్తుంది.
theological_decisions:
- issue: ఆదాము–మెస్సీయ పోలికలో ‘అనేకులు’ అనే పదం సూచించే పరిధి
  choice: ‘అనేకులు’ అని నిలుపుట
  alternative: ‘అందరూ’ అని అనువదించుట
  rationale: మూలపాఠం ‘ఒక్కడు/అనేకులు’ అనే ఉద్దేశపూర్వక నిర్మాణాన్ని వాడుతుంది. ‘అందరూ’ అని మార్చడం ఈ ఒక్క వచనంలో ఉన్న భావ ఉద్రిక్తతను ముందుగానే పరిష్కరిస్తుంది.
- issue: ἐν χάριτι యొక్క సంబంధం
  choice: ‘కృపలో లభించిన వరం’
  alternative: ‘కృప ద్వారా వచ్చిన వరం’
  rationale: ἐν ఇక్కడ సాధనం, పరిధి లేదా అనుబంధాన్ని సూచించవచ్చు. ప్రధాన పాఠం ఆ అనుబంధాన్ని ఉంచి, ప్రత్యామ్నాయాన్ని పాదసూచికలో తెలియజేస్తుంది.
- issue: Χριστός బిరుదు లేదా స్థిర నామరూపం
  choice: ‘మెస్సీయ’
  alternative: ‘క్రీస్తు’
  rationale: ఈ ఆదాము–యేసు వ్యత్యాసంలో అభిషిక్త రాజు అనే బిరుదు భావం ఇంకా వినిపిస్తుంది; అయితే సుపరిచితమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకునికి అర్థమయ్యే శైలి వాడబడింది. ‘పొంగిపొర్లాయి’ సమృద్ధి భావాన్ని సజీవంగా అందిస్తుంది. సంయుక్త కర్తలు (‘కృప’, ‘వరం’) ఉన్నందున తెలుగులో బహువచన క్రియ సహజంగా వాడబడింది; గ్రీకు ఏకవచన క్రియ ఈ రెండింటినీ సమగ్ర దైవానుగ్రహంగా చూడవచ్చు.
