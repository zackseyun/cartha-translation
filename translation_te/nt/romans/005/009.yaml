id: ROM.5.9
reference: Romans 5:9
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι’ αὐτοῦ ἀπὸ τῆς ὀργῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: te
  text: కాబట్టి, ఇప్పుడు ఆయన రక్తం ద్వారా నీతిమంతులమని తీర్చబడిన మనం, మరి ఎంతో ఎక్కువగా ఆయన ద్వారా ఆ ఉగ్రత నుండి రక్షించబడతాం.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: సందర్భం ప్రకారం, ‘ఆ ఉగ్రత’ అంటే దేవుని ఉగ్రత.
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: కాబట్టి ... మరి ఎంతో నిశ్చయంగా
  rationale: οὖν సూచించే తార్కిక అనుసంధానాన్ని ‘కాబట్టి’ నిలుపుతుంది; πολλῷ ... μᾶλλον వ్యక్తపరచే బలమైన ‘ఇంకెంత ఎక్కువగా’ భావాన్ని సందర్భానుగుణమైన సహజ తెలుగు వాక్యనిర్మాణంలో ‘మరి ఎంతో నిశ్చయంగా’ తెలియజేస్తుంది.
- source_word: δικαιωθέντες
  choice: నీతిమంతులుగా తీర్చబడిన
  rationale: భూతకాల నిష్క్రియాత్మక కృదంతం ప్రధాన భవిష్యత్ క్రియకు ముందే పూర్తయిన కార్యాన్ని సూచిస్తుంది. ఈ పదబంధం పౌలు వాడే న్యాయపరమైన భావాన్ని నిలుపుతూ, సాధారణ తెలుగు పాఠకునికీ స్పష్టంగా ఉంటుంది.
- source_word: νῦν
  choice: ఇప్పుడు
  rationale: నీతిమంతులుగా తీర్చబడిన ప్రస్తుత స్థితిని సూచించే కాలవాచక క్రియావిశేషణానికి నేరమైన అనువాదం.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: ఆయన రక్తం ద్వారా
  rationale: ἐν ఇక్కడ సాధనం లేదా ఆధారాన్ని సూచిస్తుంది. ‘ద్వారా’ సహజమైన తెలుగులో ఆ సాధనార్థాన్ని తెలియజేస్తూ, రక్తం అనే మూలపాఠ రూపకాన్ని యథాతథంగా ఉంచుతుంది.
- source_word: σωθησόμεθα
  choice: రక్షించబడతాం
  rationale: భవిష్యత్ నిష్క్రియాత్మక క్రియను స్పష్టంగా నిలుపుతుంది; ఇక్కడ ఇంకా భవిష్యత్తులో నెరవేరబోయే రక్షణ భావాన్ని కాపాడుతుంది.
- source_word: δι’ αὐτοῦ
  choice: ఆయన ద్వారానే
  rationale: διά + షష్ఠీ విభక్తి సూచించే మధ్యవర్తిత్వం లేదా సాధనాన్ని ‘ద్వారా’ తెలియజేస్తుంది; ‘నే’ మూలంలోని αὐτοῦపై సందర్భానుగుణ దృష్టిని సహజంగా ప్రతిబింబిస్తుంది.
- source_word: ἀπὸ τῆς ὀργῆς
  choice: ఆ ఉగ్రత నుండి
  rationale: నిర్దిష్ట ఉపపదాన్ని ‘ఆ’ ద్వారా సూచిస్తూ, మూలంలో లేని ‘దేవుని’ అనే పదాన్ని ప్రధాన పాఠ్యంలో చేర్చకుండా ὀργή యొక్క తీర్పుతో కూడిన కోపభావాన్ని ‘ఉగ్రత’గా నిలుపుతుంది.
theological_decisions:
- issue: δικαιωθέντεςలోని నీతితీర్పు భాష స్వభావం
  choice: ‘నీతిమంతులుగా తీర్చబడిన’ అని ప్రధాన పాఠ్యంలో ఉంచడం
  alternative: ‘నీతిమంతులుగా ప్రకటించబడిన’
  rationale: ‘తీర్చబడిన’ అనేది న్యాయపరమైన భావాన్ని, నిష్క్రియాత్మక రూపాన్ని నిలుపుతుంది; అయితే ప్రక్రియ ఎలా పనిచేస్తుందో అనే మతశాఖాపరమైన వివరణను పాఠ్యంలోకి తీసుకురాదు.
- issue: ἡ ὀργή యొక్క కర్త లేదా మూలం
  choice: ‘ఆ ఉగ్రత’ అని మాత్రమే అనువదించడం
  alternative: ‘దేవుని ఉగ్రత’
  rationale: సందర్భం దైవిక ఉగ్రతను సూచించినా, గ్రీకు పాఠ్యంలో ‘దేవుని’ అని స్పష్టంగా లేదు. అందువల్ల ప్రధాన పాఠ్యం ఆ అదనపు పదాన్ని చేర్చదు; వివరణను పాదసూచికలో ఇస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని తార్కిక క్రమాన్ని తెలుగులో సహజంగా మార్చినా, కారణం—ప్రస్తుత నీతితీర్పు—భవిష్యత్ రక్షణ అనే నిర్మాణం మరియు నిష్క్రియాత్మక క్రియారూపాలు నిలుపబడ్డాయి. పాదసూచిక గుర్తు ప్రధాన పాఠ్యంలో [a]గా ఇవ్వబడింది.
