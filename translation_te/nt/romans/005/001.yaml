id: ROM.5.1
reference: Romans 5:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ⸀ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: te
  text: కాబట్టి, విశ్వాసం ద్వారా[b] మనం నీతిమంతులుగా తీర్చబడ్డాం గనుక, మన ప్రభువైన యేసు మెస్సీయ[c] ద్వారా దేవునితో మనకు సమాధానం ఉంది[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: కొన్ని ప్రతుల్లో, “దేవునితో సమాధానం కలిగి ఉందాం” అని ఉంది.
    reason: textual_variant
  - marker: b
    text: లేదా, “విశ్వాసం ఆధారంగా.”
    reason: lexical_alternative
  - marker: c
    text: గ్రీకులో క్రిస్టోస్, అంటే ‘మెస్సీయ’; సంప్రదాయంగా ‘క్రీస్తు.’
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: మనం నీతిమంతులుగా తీర్చబడ్డాం గనుక
  rationale: δικαιόω అనే క్రియ యొక్క భూతకాల కర్మణి అసమాపక రూపాన్ని సహజమైన తెలుగులో కారణార్థక ఉపవాక్యంగా వ్యక్తం చేస్తుంది. దేవుని న్యాయనిర్ణయ చర్యను నిలుపుతూ, ‘నీతిమంతులుగా చేయబడ్డాం’ లేదా ‘నిర్దోషులుగా ప్రకటించబడ్డాం’ అనే ఒకే వ్యాఖ్యానానికి భావాన్ని పరిమితం చేయదు.
- source_word: οὖν
  choice: కాబట్టి
  rationale: ముందటి వాదన నుంచి తీసుకున్న నిర్ధారణను స్పష్టంగా సూచించే సహజమైన తెలుగు అనుసంధాన పదం.
- source_word: ἐκ πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: ἐκ యొక్క మూలార్థం ‘నుండి’ అయినప్పటికీ, ఈ పౌలు ప్రయోగంలో సాధనాన్ని లేదా ఆధారాన్ని తెలిపే సహజమైన తెలుగు రూపం ఇది. ‘విశ్వాసం ఆధారంగా’ అనే ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచాం.
- source_word: εἰρήνην
  choice: సమాధానం
  rationale: దేవునితో ఉన్న సంబంధంలో శాంతిని తెలిపే విస్తృతమైన బైబిలీయ తెలుగు పదం. ‘సమాధానపడటం’ అని వ్యాఖ్యానాత్మకంగా కుదించకుండా, గ్రీకు నామవాచకపు విస్తృతిని నిలుపుతుంది.
- source_word: ἔχομεν
  choice: మనకు ... ఉంది
  rationale: SBLGNT పాఠంలోని సూచనార్థక ἔχομενను అనుసరిస్తుంది. ఆహ్వానార్థక పాఠాంతరాన్ని పాదసూచికలో తెలిపాం.
- source_word: πρὸς τὸν θεὸν
  choice: దేవునితో
  rationale: εἰρήνηతో కలిసి ఉన్న πρὸς ఇక్కడ దేవునితో సంబంధపరమైన సమాధానాన్ని సహజంగా వ్యక్తం చేస్తుంది.
- source_word: κυρίου
  choice: ప్రభువైన
  rationale: κύριοςకు గౌరవార్థకమైన, స్థిరపడిన తెలుగు సమానార్థకం; యేసుతో అన్వయాన్ని సహజంగా చూపేందుకు ‘ప్రభువైన’ అని వాడాం.
- source_word: Χριστοῦ
  choice: మెస్సీయ
  rationale: Χριστόςను కేవలం వ్యక్తినామంలా కాక, ‘అభిషిక్తుడు’ అనే బిరుదు భావాన్ని మోసే ‘మెస్సీయ’గా అనువదించాం.
theological_decisions:
- issue: పౌలు వాడిన δικαιωθέντες భావం
  choice: ‘నీతిమంతులుగా తీర్చబడ్డాం’ అని సంక్షిప్తంగా అనువదించడం
  alternative: ‘నీతిమంతులమని ప్రకటించబడ్డాం’ లేదా ‘నీతిమంతులుగా చేయబడ్డాం’
  rationale: ఈ వాక్యం దేవుని నీతితీర్పు చర్య ఫలితాన్ని చెబుతుంది; దాని పూర్తి విధానాన్ని నిర్వచించదు. ఎటువంటి ప్రత్యేక సంప్రదాయ వివరణనూ పాఠ్యంలో చేర్చకుండా మూలంలోని ఉద్రిక్తతను నిలుపుతుంది.
- issue: ‘దేవునితో సమాధానం’ యొక్క స్వభావం
  choice: దేవునితో సంబంధపరమైన సమాధానాన్ని సరళంగా పేర్కొనడం
  alternative: అంతరంగ మనశ్శాంతి లేదా స్పష్టంగా ‘దేవునితో సమాధానపడటం’
  rationale: సందర్భం ప్రధానంగా దేవునితో పునరుద్ధరించబడిన సంబంధాన్ని సూచించినప్పటికీ, మూలపదం ‘సమాధానం/శాంతి’; అందువల్ల మరింత సంకుచితమైన వ్యాఖ్యానాన్ని ప్రధాన పాఠ్యంలో చేర్చలేదు.
- issue: ἔχομεν / ἔχωμεν పాఠాంతరం
  choice: SBLGNTలోని సూచనార్థక పాఠం ప్రకారం ‘మనకు ... ఉంది’
  alternative: ‘దేవునితో సమాధానంగా ఉందాం’ అనే ఆహ్వానార్థక పాఠం
  rationale: అందించిన విమర్శాత్మక గ్రీకు పాఠాన్ని ప్రధానంగా అనుసరిస్తూ, ప్రాముఖ్యమైన పాఠాంతరాన్ని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన బైబిలీయ శైలిని వాడాం. గ్రీకు అసమాపక నిర్మాణాన్ని తెలుగులో సహజమైన ‘గనుక’ ఉపవాక్యంగా మార్చాం. ‘సమాధానం’ అనే పదం సందర్భంలోని సంబంధపరమైన శాంతిని నిలుపుతుంది.
