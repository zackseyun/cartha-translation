id: ROM.5.12
reference: Romans 5:12
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: te
  text: కాబట్టి, ఒక మనిషి ద్వారా పాపం లోకంలోకి ప్రవేశించినట్లే, పాపం ద్వారా మరణం కూడా వచ్చింది; అలాగే మరణం మనుషులందరికీ వ్యాపించింది—ఎందుకంటే అందరూ పాపం చేశారు[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, సంప్రదాయ పఠనం ప్రకారం, “ఆయనలో అందరూ పాపం చేశారు.”
    reason: ἐφ’ ᾧ అనే గ్రీకు పదబంధానికి ఉన్న ప్రాతినిధ్య/సమైక్య ప్రత్యామ్నాయ పఠనాన్ని సంరక్షించడానికి.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: కాబట్టి
  rationale: ముందటి వాదన నుండి వచ్చే నిర్ధారణను సహజమైన, సంక్షిప్తమైన తెలుగులో సూచిస్తుంది.
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: ఒక మనిషి ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే మాధ్యమ భావాన్ని నిలుపుతుంది; సందర్భంలో ఆదాము అనే పురుష ప్రతినిధిని సూచించే ఏకవచన రూపాన్ని కూడా కాపాడుతుంది.
- source_word: ἡ ἁμαρτία
  choice: పాపం
  rationale: పౌలు వాడే భావానికి అనుగుణమైన సాధారణ తెలుగు పదం; మూలంలో లేని వివరణను జోడించదు.
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: లోకంలోకి ప్రవేశించి
  rationale: εἰς లోని దిశాభావాన్ని నిలుపుతూ ఆధునిక తెలుగులో సహజంగా ఉంది.
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: పాపం ద్వారా మరణం వచ్చి
  rationale: పాపం ఒక మనిషి ద్వారా రావడం, మరణం పాపం ద్వారా రావడం అనే సమాంతర కారణ క్రమాన్ని స్పష్టంగా ఉంచుతుంది; గ్రీకులో భావితమైన క్రియను తెలుగులో సహజత కోసం వ్యక్తం చేస్తుంది.
- source_word: οὕτως
  choice: అలాగే
  rationale: ముందు చెప్పిన క్రమానికి అనుగుణంగా వచ్చిన ఫలితాన్ని సూచిస్తుంది; తెలుగు వాక్య నిర్మాణంలో ‘వచ్చినట్లే’ రూపంతో సహజంగా వ్యక్తమైంది.
- source_word: εἰς πάντας ἀνθρώπους
  choice: మనుషులందరికీ
  rationale: ఇది పురుషులకు మాత్రమే కాక సమస్త మానవాళికి వర్తిస్తుందనే సమగ్ర భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ὁ θάνατος διῆλθεν
  choice: మరణం ... వ్యాపించింది
  rationale: మరణం మానవులందరినీ చేరిన విస్తృతిని διέρχομαι ఇక్కడ తెలిపే భావానికి అనుగుణంగా వ్యక్తం చేస్తుంది.
- source_word: ἐφ’ ᾧ
  choice: చేసినందువల్ల
  rationale: సందర్భంలో కారణార్థక పఠనాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది; వివాదాస్పదమైన ప్రత్యామ్నాయ పఠనాన్ని పాదసూచికలో నిలుపుతుంది.
- source_word: πάντες ἥμαρτον
  choice: అందరూ పాపం చేశారు
  rationale: గ్రీకు అనిర్దిష్ట భూతకాల క్రియను అదనపు కాలభావం చేర్చకుండా సాధారణ భూతకాలంలో అందిస్తుంది.
theological_decisions:
- issue: ἐφ’ ᾧ πάντες ἥμαρτον అనే పదబంధం యొక్క భావం
  choice: 'కారణార్థకం: “అందరూ పాపం చేసినందువల్ల”'
  alternative: 'ప్రాతినిధ్య/సమైక్య భావం: “ఆయనలో అందరూ పాపం చేశారు”'
  rationale: ఈ సందర్భంలో గ్రీకు పదబంధం కారణార్థకంగా అర్థం కావడం సహజం; అయితే ఆదాము మరియు మానవాళి సంబంధంపై దీనికి ఉన్న ప్రధాన వేదాంత ప్రాముఖ్యత దృష్ట్యా సంప్రదాయ ప్రత్యామ్నాయాన్ని తొలగించకుండా పాదసూచికలో ఉంచాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా సహజంగా, అయితే గౌరవప్రదంగా రూపొందించబడింది. గ్రీకు వాక్యం తదుపరి వివరణ వైపు సాగుతూ ఇక్కడ అసంపూర్ణంగా ఆగిన నిర్మాణాన్ని చివరి దీర్ఘ డాష్‌తో నిలుపుకుంది.
