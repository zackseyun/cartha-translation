  to: కాబట్టి, ఒక మనిషి ద్వారా పాపం లోకంలోకి ప్రవేశించినట్లే, పాపం ద్వారా మరణం కూడా వచ్చింది; అలాగే మరణం మనుషులందరికీ వ్యాపించింది—ఎందుకంటే అందరూ పాపం చేశారు[a].
