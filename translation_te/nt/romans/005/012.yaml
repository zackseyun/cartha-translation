review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the causal reading of ἐφ’ ᾧ πάντες ἥμαρτον and preserves the traditional alternative in a footnote. However, its comparative construction makes “death came through sin” sound as though it is itself the direct comparison introduced by “వచ్చినట్లే,” rather than part of the preceding sequence that leads to death’s spread.
  naturalness: The current sentence is understandable, but the placement of “వచ్చినట్లే” is syntactically awkward in modern Telugu. Recasting the parallel explicitly makes the sequence and comparison natural while retaining the source’s unfinished, forward-leading dash.
  terminology: “పాపం,” “మరణం,” “లోకం,” and “ఒక మనిషి ద్వారా” are appropriate, clear, and theologically non-sectarian. “మనుషులందరికీ” naturally includes all humanity in this context.
  issues:
  - severity: medium
    issue: Comparative syntax around “పాపం ద్వారా మరణం వచ్చినట్లే”
    rationale: The Greek ὥσπερ governs the preceding entry of sin and death, with οὕτως introducing death’s spread. In Telugu, the existing wording can imply that death’s coming through sin is merely being compared to something unstated. An explicit parallel better represents the Greek sequence.
  revised_text: కాబట్టి, ఒక మనిషి ద్వారా పాపం లోకంలోకి ప్రవేశించినట్లే, పాపం ద్వారా మరణం కూడా వచ్చింది; అలాగే మరణం మనుషులందరికీ వ్యాపించింది—ఎందుకంటే అందరూ పాపం చేశారు[a].
