id: ROM.5.4
reference: Romans 5:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: te
  text: సహనం పరీక్షలో రుజువైన స్వభావాన్ని[a] కలుగజేస్తుంది; పరీక్షలో రుజువైన స్వభావం నిరీక్షణను కలుగజేస్తుంది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా “పరీక్షించబడిన స్వభావం,” లేదా “ఆమోదం.”
    reason: δοκιμή అనే పదానికి సందర్భంలో సాధ్యమైన ఇతర భావాలను నమోదు చేయడానికి.
lexical_decisions:
- source_word: ὑπομονή
  choice: సహనం
  rationale: శ్రమల మధ్య ఓర్పుతో నిలిచి కొనసాగడాన్ని సూచించే సహజమైన ఆధునిక తెలుగు పదం; సందర్భంలోని క్రమానికి సరిపోతుంది.
- source_word: δοκιμή
  choice: పరీక్షలో రుజువైన గుణం
  rationale: కేవలం సాధారణ నైతిక గుణం కాకుండా, పరీక్షను ఎదుర్కొని నిజమైనదిగా తేలిన గుణాన్ని ఈ పదబంధం తెలియజేస్తుంది.
- source_word: ἐλπίς
  choice: నిరీక్షణ
  rationale: దేవునిపై ఆధారపడిన ఎదురుచూపును తెలిపే, పౌలు వాడుకకు తగిన ప్రామాణిక తెలుగు పదం.
- source_word: δὲ
  choice: క్రమబద్ధమైన అనుసంధానం (తెలుగులో విరామచిహ్నంతో వ్యక్తీకరించబడింది)
  rationale: ఇక్కడ బలమైన వ్యతిరేకత కాకుండా వరుసలోని దశలను కలుపుతుంది; తెలుగులో పునరుక్త సంధిపదం లేకుండా అర్థం సహజంగా స్పష్టమవుతుంది.
- source_word: ellipsis of κατεργάζεται
  choice: కలిగిస్తుంది
  rationale: ముందటి వచనం నుండి గ్రహించాల్సిన క్రియను తెలుగులో రెండు ఉపవాక్యాల్లో స్పష్టంగా ఉంచడం సహజంగా ఉండి, కారణ-ఫలిత క్రమాన్ని కాపాడుతుంది.
theological_decisions:
- issue: పరిశుద్ధీకరణ క్రమంలో δοκιμή భావం
  choice: పరీక్షలో నిజమైనదిగా రుజువైన గుణం
  alternative: పరీక్షించే ప్రక్రియ; ఆమోదం
  rationale: ఈ క్రమంలో δοκιμή అనేది పరీక్షించే సంఘటనకన్నా సహనం వల్ల కలిగే ఫలితంగా కనిపిస్తుంది. ఈ అనువాదం అదనపు సిద్ధాంత భావాన్ని చేర్చకుండా దాని ఫలితార్థాన్ని నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన శైలి. గ్రీకులో మానివేయబడిన క్రియను తెలుగులో పునరుక్తం చేసి భావక్రమాన్ని స్పష్టం చేశాం; δοκιμή యొక్క పరీక్షించి రుజువైన ఫలితార్థాన్ని ప్రధాన పాఠ్యంలోను, ఇతర సాధ్యార్థాలను పాదసూచికలోను నిలిపాం.
