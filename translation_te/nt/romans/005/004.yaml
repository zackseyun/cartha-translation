revisions:
- from: సహనం పరీక్షలో రుజువైన గుణాన్ని[a] కలిగిస్తుంది; పరీక్షలో రుజువైన గుణం నిరీక్షణను కలిగిస్తుంది.
  to: సహనం పరీక్షలో రుజువైన స్వభావాన్ని[a] కలుగజేస్తుంది; పరీక్షలో రుజువైన స్వభావం నిరీక్షణను కలుగజేస్తుంది.
  rationale: 'The revision makes two limited stylistic-semantic improvements: it uses “స్వభావం” for the demonstrated-character sense of δοκιμή and “కలుగజేస్తుంది” for the causal sequence. The source’s compact progression, the supplied verbal sense, and the lexical ambiguity documented in the footnote are retained.'
  reviewer_model: gpt-5.6-terra
