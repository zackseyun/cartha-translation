id: ROM.5.19
reference: Romans 5:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: te
  text: ఎందుకంటే, ఎలాగైతే ఆ ఒక్క మనిషి అవిధేయత ద్వారా అనేకులు పాపులుగా చేయబడ్డారో[a], ఆలాగే ఆ ఒక్క మనిషి విధేయత ద్వారా అనేకులు నీతిమంతులుగా చేయబడతారు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాపులుగా ఉంచబడ్డారు.”
    reason: lexical_alternative
  - marker: b
    text: గ్రీకులో రెండవసారి అక్షరార్థంగా “ఆ ఒక్కరి”; స్పష్టమైన సమాంతరత కోసం “మనిషి” చేర్చబడింది.
    reason: lexical_alternative
  - marker: c
    text: లేదా, “నీతిమంతులుగా ఉంచబడతారు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: అవిధేయత
  rationale: ఆజ్ఞకు లోబడకపోవడం అనే భావాన్ని నేరుగా తెలియజేస్తూ, ὑπακοήతో ఉన్న వ్యతిరేక సమాంతరాన్ని కాపాడుతుంది.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: ఆ ఒక్క మనిషి
  rationale: నిర్దిష్టమైన ఒక్క వ్యక్తిని సూచించే గ్రీకు నిర్మాణాన్ని ప్రతిబింబిస్తూ, సందర్భంలో ఆదామును సూచించే గుర్తింపు భావాన్ని నిలుపుతుంది.
- source_word: ἁμαρτωλοὶ
  choice: పాపులు
  rationale: ఇక్కడ విశేషణం నామవాచకార్థంలో వాడబడింది; ఆధునిక తెలుగులో ఇది స్పష్టమైన, సహజమైన రూపం.
- source_word: κατεστάθησαν
  choice: చేయబడ్డారు
  rationale: ఒక స్థితిలో ఉంచబడటం లేదా ఆ స్థితిని పొందేలా చేయబడటం అనే భావాన్ని సహజ తెలుగులో వ్యక్తపరుస్తుంది; మరింత సాంకేతికమైన అర్థాన్ని పాఠ్యంలో బలవంతంగా రుద్దదు.
- source_word: οἱ πολλοί
  choice: అనేకులు
  rationale: గ్రీకులోని ‘the many’ భావాన్ని ‘అందరూ’ అని వ్యాఖ్యానాత్మకంగా విస్తరించకుండా నిలుపుతుంది; తెలుగులో ప్రత్యేక నిర్దేశక పదాన్ని జోడించడం అసహజంగా ఉంటుంది.
- source_word: ὑπακοῆς
  choice: విధేయత
  rationale: παρακοήకు సహజమైన వ్యతిరేక పదంగా ఉండి, ఆదాము–క్రీస్తు సమాంతరాన్ని స్పష్టంగా ఉంచుతుంది.
- source_word: τοῦ ἑνὸς
  choice: ఆ ఒక్క మనిషి
  rationale: రెండవ ఉపవాక్యంలో గ్రీకు ‘ఆ ఒక్కని’ అని మాత్రమే ఉన్నా, మొదటి ఉపవాక్యం నుంచి ‘మనిషి’ అర్థం స్పష్టంగా గ్రహించబడుతుంది; తెలుగులో సమాంతరత కోసం దానిని పునరుక్తి చేయడం సహజం.
- source_word: δίκαιοι
  choice: నీతిమంతులు
  rationale: పౌలు వాడే δικ- పదసమూహంతో సంబంధాన్ని కాపాడే స్పష్టమైన, సుపరిచితమైన తెలుగు సమానం.
- source_word: κατασταθήσονται
  choice: చేయబడతారు
  rationale: మొదటి భాగంలోని κατεστάθησανతో ఉన్న కాలాత్మక, వ్యాకరణ సమాంతరాన్ని నిలుపుతుంది; ‘నీతిమంతులుగా ప్రకటించబడతారు’ అనే మరింత నిర్దిష్ట న్యాయస్థానార్థాన్ని చేర్చదు.
theological_decisions:
- issue: οἱ πολλοί యొక్క పరిధిని ‘అనేకులు’గా ఉంచాలా, ‘అందరూ’గా వ్యాఖ్యానించాలా
  choice: అనేకులు
  alternative: అందరూ; అనేక మంది
  rationale: మూలంలోని οἱ πολλοί పదబంధాన్నే అనుసరించి, దాని పరిధికి సంబంధించిన వేదాంత ఉద్రిక్తతను అనువాదం ద్వారా పరిష్కరించకుండా ఉంచుతుంది.
- issue: κατασταθήσονται δίκαιοιని స్థితి భాషలో అనువదించాలా, న్యాయస్థాన ప్రకటనగా వివరించాలా
  choice: నీతిమంతులుగా చేయబడతారు
  alternative: నీతిమంతులుగా ప్రకటించబడతారు; నీతిమంతులుగా స్థాపించబడతారు
  rationale: ఇక్కడ మూలంలో δικαιόω కాకుండా καθίστημι ఉంది. అందువల్ల ‘చేయబడతారు’ మూల పదప్రయోగానికి దగ్గరగా ఉండి, దాని వేదాంతార్థాన్ని ముందుగానే ఒకే విధంగా నిర్ణయించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజంగా, గౌరవప్రదంగా రూపొందించబడింది. ‘ఆ ఒక్క మనిషి’ రెండు భాగాల ప్రతినిధిత్వ సమాంతరాన్ని స్పష్టం చేస్తుంది. ‘అనేకులు’ మూలంలోని పరిధిని వ్యాఖ్యానాత్మకంగా ‘అందరూ’గా మార్చదు; ‘చేయబడ్డారు/చేయబడతారు’ అనే జంట గ్రీకు క్రియల సమాంతరాన్ని కాపాడుతుంది.
