id: ROM.5.5
reference: Romans 5:5
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: te
  text: 'ఆ నిరీక్షణ మనలను సిగ్గుపాలు చేయదు[a]. ఎందుకంటే మనకు ఇవ్వబడిన పరిశుద్ధాత్మ ద్వారా దేవుని ప్రేమ[b] మన హృదయాల్లో కుమ్మరించబడింది.


    [a] లేదా, “నిరాశపరచదు.”

    [b] “దేవుని ప్రేమ” అంటే దేవుడు మనపై చూపే ప్రేమ; తక్కువ సంభావ్యతతో, మనకు దేవునిపై ఉన్న ప్రేమ అని కూడా అర్థం కావచ్చు.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నిరాశపరచదు.”
    reason: καταισχύνει అనే పదానికి సందర్భంలో సాధ్యమైన సహజ తెలుగు ప్రత్యామ్నాయం.
  - marker: b
    text: “దేవుని ప్రేమ” అంటే దేవుడు మనపై చూపే ప్రేమ; తక్కువ సంభావ్యతతో, మనకు దేవునిపై ఉన్న ప్రేమ అని కూడా అర్థం కావచ్చు.
    reason: τοῦ θεοῦ అనే షష్ఠీ సంబంధంలో ఉన్న నిజమైన వ్యాకరణపరమైన అస్పష్టతను సంరక్షిస్తుంది.
lexical_decisions:
- source_word: ἐλπίς
  choice: నిరీక్షణ
  rationale: క్రైస్తవ సందర్భంలో భవిష్యత్తుపట్ల నమ్మకంతో కూడిన ఆశను తెలిపే సహజమైన ప్రామాణిక తెలుగు పదం.
- source_word: δέ
  choice: ఆ
  rationale: ముందటి వాక్యప్రవాహంతో ఉన్న తేలికపాటి అనుసంధానాన్ని చూపుతుంది; గ్రీకులో లేని బలమైన వ్యతిరేకతను చేర్చదు.
- source_word: καταισχύνει
  choice: మనలను సిగ్గుపాలు చేయదు
  rationale: గ్రీకు పదంలోని సిగ్గు–గౌరవ భావాన్ని నిలుపుతూ, తెలుగులో అవసరమైన కర్మను సందర్భానుసారంగా స్పష్టం చేస్తుంది.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: దేవుని ప్రేమ
  rationale: గ్రీకు షష్ఠీ సంబంధంలోని రూపాత్మక అస్పష్టతను తెలుగులోనూ కొంతవరకు నిలుపుతుంది; సందర్భంలో ప్రధానంగా దేవుడు మనపై చూపే ప్రేమను సూచిస్తుంది.
- source_word: ἐκκέχυται
  choice: కుమ్మరించబడింది
  rationale: సమృద్ధిగా పోయబడిన కార్యాన్ని తెలియజేస్తుంది; గ్రీకు సంపూర్ణకాలంలోని గత కార్యం మరియు కొనసాగుతున్న ఫలితాన్ని తెలుగు సందర్భం మోస్తుంది.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: మన హృదయాల్లో
  rationale: నేరుగా, సహజంగా, అంతరంగ అనుభవాన్ని తెలిపే అనువాదం.
- source_word: διὰ πνεύματος ἁγίου
  choice: పరిశుద్ధాత్మ ద్వారా
  rationale: διά + షష్ఠీ విభక్తి తెలిపే సాధన లేదా మధ్యవర్తిత్వ భావాన్ని స్పష్టంగా అందిస్తుంది.
- source_word: τοῦ δοθέντος ἡμῖν
  choice: మనకు ఇవ్వబడిన
  rationale: కృదంతం పరిశుద్ధాత్మను విశేషిస్తున్న నిర్మాణాన్ని సంక్షిప్తంగా, సహజంగా నిలుపుతుంది.
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ లోని షష్ఠీ సంబంధం
  choice: ప్రధాన పాఠ్యంలో “దేవుని ప్రేమ”; సందర్భానుసారంగా దేవుడు మనపై చూపే ప్రేమ
  alternative: మనకు దేవునిపై ఉన్న ప్రేమ
  rationale: పరిశుద్ధాత్మ ద్వారా ఈ ప్రేమ మన హృదయాల్లో కుమ్మరించబడిందనే కారణవాక్యం దేవుని ప్రేమను ఆయన మనపై చూపే ప్రేమగా గ్రహించడానికి బలమిస్తుంది. అయినా వ్యాకరణపరమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు అర్థమయ్యేలా, అయినా గౌరవప్రదమైన బైబిలు శైలి. “సిగ్గుపాలు చేయదు” ద్వారా మూలంలోని shame భావాన్ని కాపాడి, “నిరాశపరచదు” అనే సందర్భానుకూల ప్రత్యామ్నాయాన్ని పాదసూచికలో ఇచ్చాం.
