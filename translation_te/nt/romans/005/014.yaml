- from: అయినా, ఆదాము మొదలుకొని మోషే వరకు మరణం రాజ్యమేలింది. ఆదాము చేసిన అతిక్రమాన్ని పోలిన విధంగా పాపం చేయనివారి మీద కూడా అది రాజ్యమేలింది. ఆ ఆదాము, రాబోయే వ్యక్తికి ఒక ముంగుర్తుగా ఉన్నాడు.[a][b]
  to: అయితే ఆదాము నుండి మోషే వరకు మరణం రాజ్యమేలింది; ఆదాము అతిక్రమించిన విధానంలో పాపం చేయనివారిమీద కూడా అది రాజ్యమేలింది. ఆదాము రాబోయేవానికి[b] ఒక మాదిరి[a].
  rationale: 'The revision retains the Greek syntax and ambiguity: Adam is called a type/pattern in relation to ‘the coming one,’ while Christ is not inserted into the main text. It replaces an unnatural key term, improves idiom, and relocates each footnote marker to its proper referent.'
