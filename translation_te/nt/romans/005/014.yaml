id: ROM.5.14
reference: Romans 5:14
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: te
  text: అయితే ఆదాము నుండి మోషే వరకు మరణం రాజ్యమేలింది; ఆదాము అతిక్రమించిన విధానంలో పాపం చేయనివారిమీద కూడా అది రాజ్యమేలింది. ఆదాము రాబోయేవానికి[b] ఒక మాదిరి[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘మాదిరి’కి బదులుగా ‘నమూనా’ లేదా ‘ముందస్తు సూచన’ అని కూడా అనువదించవచ్చు.
    reason: lexical_alternative
  - marker: b
    text: ‘రాబోయేవాడు’ అంటే ఈ సందర్భంలో క్రీస్తు.
    reason: referent_clarification
lexical_decisions:
- source_word: ἀλλὰ
  choice: అయినా
  rationale: ముందటి వాక్యంతో ఉన్న బలమైన వ్యత్యాసాన్ని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: మరణం రాజ్యమేలింది
  rationale: మరణాన్ని పాలకునిగా వ్యక్తీకరించే పౌలు రూపకాన్ని నిలుపుతుంది.
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: ఆదాము మొదలుకొని మోషే వరకు
  rationale: కాలవ్యాప్తిని స్పష్టంగా, సహజంగా వ్యక్తం చేస్తుంది.
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: పాపం చేయనివారి మీద కూడా
  rationale: మరణపు పాలన వారికీ విస్తరించిందనే ఆశ్చర్యకర అంశాన్ని ‘కూడా’ తెలియజేస్తుంది.
- source_word: ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
  choice: ఆదాము చేసిన అతిక్రమాన్ని పోలిన విధంగా
  rationale: పోలికను నిలుపుతూ, ఆదాము అతిక్రమించిన అదే రీతిలో వారు పాపం చేయలేదనే భావాన్ని సహజ తెలుగులో అందిస్తుంది.
- source_word: παράβασις
  choice: అతిక్రమం
  rationale: నిర్దేశిత హద్దు లేదా ఆజ్ఞను దాటడమనే భావాన్ని కాపాడే సుస్పష్టమైన పదం.
- source_word: τύπος
  choice: ముంగుర్తు
  rationale: తరువాత రాబోయే వ్యక్తిని ముందుగానే సూచించే నమూనా అనే సందర్భార్థాన్ని సాధారణ పాఠకునికి అర్థమయ్యేలా అందిస్తుంది; ప్రత్యామ్నాయాలను పాదసూచికలో ఇస్తుంది.
- source_word: τοῦ μέλλοντος
  choice: రాబోయే వ్యక్తి
  rationale: క్రీస్తు అనే పేరును మూలపాఠ్యంలోకి చేర్చకుండా, substantival participle సూచించే రాబోయే వ్యక్తిని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: ‘రాబోయే వ్యక్తి’ ఎవరనే సూచన
  choice: ప్రధాన పాఠ్యంలో ‘రాబోయే వ్యక్తి’ అని మాత్రమే ఉంచి, సందర్భంలో అది క్రీస్తును సూచిస్తుందని పాదసూచికలో తెలిపింది.
  alternative: ప్రధాన పాఠ్యంలో నేరుగా ‘క్రీస్తు’ అని అనువదించడం.
  rationale: రోమా 5:12–21 సందర్భం క్రీస్తునే సూచించినా, గ్రీకు పాఠ్యంలో పేరు ప్రత్యక్షంగా లేదు; అందువల్ల పాఠ్యంలోని సంక్షిప్తతను, సూచనాత్మకతను కాపాడింది.
- issue: ఆదాము మరియు పాపం చేయనివారి మధ్య పోలిక
  choice: వారు ఆదాము అతిక్రమాన్ని పోలిన విధంగా పాపం చేయలేదని అనువదించింది.
  alternative: వారికి వ్యక్తిగత పాపమే లేదని భావించేలా అనువదించడం.
  rationale: μὴ ἁμαρτήσαντας అనేది తరువాతి పోలికా పదబంధంతో కలిసివుంది; వాక్యం వారి పాపరాహిత్యాన్ని కాక, ఆదాము అతిక్రమపు విధానంతో ఉన్న భేదాన్ని చెబుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘మరణం రాజ్యమేలింది’ అనే రాజపాలనా రూపకాన్ని నిలిపి, పొడవైన గ్రీకు వాక్యాన్ని తెలుగులో స్పష్టత కోసం మూడు వాక్యాలుగా విభజించింది. రెండు పాదసూచిక గుర్తులూ సంబంధిత ప్రధాన పాఠ్య వాక్యాంతంలో ఉంచబడ్డాయి.
