revisions:
- from: ఆయన ద్వారానే మనం విశ్వాసం ద్వారా ఇప్పుడు నిలిచి ఉన్న ఈ కృపలోకి ప్రవేశం పొందాము. అంతేకాక, దేవుని మహిమ గురించిన నిరీక్షణలో అతిశయపడుతున్నాము[a].
  to: ఆయన ద్వారా మనకు కూడా విశ్వాసం ద్వారా మనం నిలిచి ఉన్న ఈ కృపలోకి ప్రవేశం లభించింది. అంతేకాక, దేవుని మహిమ గురించిన నిరీక్షణలో అతిశయపడుతున్నాము[a].
  rationale: The only necessary correction removes the unsupported exclusivity introduced by ‘ద్వారానే’ and represents the Greek καὶ with ‘కూడా.’ The footnote anchor remains directly after the rendering of καυχώμεθα, and no theological interpretation is added.
