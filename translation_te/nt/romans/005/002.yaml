id: ROM.5.2
reference: Romans 5:2
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: te
  text: ఆయన ద్వారా మనకు కూడా విశ్వాసం ద్వారా మనం నిలిచి ఉన్న ఈ కృపలోకి ప్రవేశం లభించింది. అంతేకాక, దేవుని మహిమ గురించిన నిరీక్షణలో అతిశయపడుతున్నాము[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “ఆనందిస్తున్నాము” లేదా “ఉప్పొంగుతున్నాము.”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγωγή
  choice: ప్రవేశం
  rationale: దేవుని కృప అనే స్థితిలోకి చేర్చబడటాన్ని ‘ప్రవేశం’ సహజంగా, స్పష్టంగా తెలియజేస్తుంది; ‘సమీపించే అవకాశం’ అనే భావం సాధ్యమైనా ఇక్కడి εἰς నిర్మాణానికి ‘ప్రవేశం’ మరింత నేరుగా సరిపోతుంది.
- source_word: πίστει
  choice: విశ్వాసం ద్వారా
  rationale: దత్తివు ఇక్కడ సాధనార్థకంగా ఉంది; విశ్వాసమే ఈ ప్రవేశానికి సాధనమని సహజమైన ఆధునిక తెలుగులో తెలియజేస్తుంది.
- source_word: χάριν
  choice: కృప
  rationale: పౌలు వాడుకలో దేవుడు అనుగ్రహించిన దయాపూర్వక స్థితిని సూచించే స్థిరమైన, సందర్భోచిత పదం.
- source_word: ἑστήκαμεν
  choice: ఇప్పుడు నిలిచి ఉన్న
  rationale: గ్రీకు పరిపూర్ణ కాలం గతంలో ఏర్పడి ప్రస్తుతం కొనసాగుతున్న స్థితిని సూచిస్తుంది; ‘ఇప్పుడు నిలిచి ఉన్న’ ఆ ప్రస్తుత ఫలితాన్ని స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: καυχώμεθα
  choice: అతిశయపడుతున్నాము
  rationale: సాధారణ గర్వాన్ని మాత్రమే కాక, నిరీక్షణపై ఆధారపడిన ధైర్యపూర్వక అతిశయాన్ని సూచించే పౌలు ఉద్దేశంలోని ఉద్దేశపూర్వక ఉద్వేగాన్ని నిలుపుతుంది.
- source_word: ἐπ’ ἐλπίδι
  choice: నిరీక్షణలో
  rationale: అతిశయానికి ఆధారంగా లేదా పరిధిగా ఉన్న నిరీక్షణను సంక్షిప్తంగా, సహజంగా వ్యక్తం చేస్తుంది; ఆధారం అనే ఛాయను సందర్భం అందిస్తుంది.
- source_word: δόξης τοῦ θεοῦ
  choice: దేవుని మహిమ
  rationale: గ్రీకు షష్ఠీ విభక్తి నిర్మాణాన్ని పారదర్శకంగా ఉంచి, దాని గంభీర స్వరాన్ని కాపాడుతుంది.
theological_decisions:
- issue: καυχώμεθα లోని పౌలు ఉద్దేశించిన భావ ఉద్వేగాన్ని నిలుపడం
  choice: అతిశయపడుతున్నాము
  alternative: ఆనందిస్తున్నాము / ఉప్పొంగుతున్నాము
  rationale: ‘ఆనందిస్తున్నాము’ తెలుగులో సులభంగా ఉన్నా గ్రీకు క్రియలోని ధైర్యపూర్వకంగా అతిశయించే భావాన్ని మృదువుచేస్తుంది. ప్రధాన పాఠంలో ఆ ఉద్వేగాన్ని నిలిపి, సానుకూల సందర్భార్థాలను పాదసూచికలో ఇచ్చాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైనప్పటికీ గంభీరమైన శైలి వాడబడింది. ‘ఆయన ద్వారా’ మరియు ‘విశ్వాసం ద్వారా’ అనే దగ్గరదగ్గర పునరుక్తిని తగ్గించేందుకు δι’ οὗ ను ‘ఆయన ద్వారానే’గా ఇచ్చి, గ్రీకులోని ప్రాధాన్యాన్ని కూడా నిలిపాం. పాదసూచిక గుర్తు దాని నిజమైన పదమైన καυχώμεθα అనువాదం తర్వాత ఉంచబడింది.
