id: ROM.5.16
reference: Romans 5:16
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: te
  text: పాపం చేసిన ఆ ఒక్కరి ద్వారా వచ్చినదానిలా ఈ వరమూ లేదు.[a] ఎందుకంటే, ఒక అపరాధం వల్ల వచ్చిన తీర్పు దోషనిర్ధారణకు దారితీసింది; అయితే అనేక అపరాధాల వల్ల వచ్చిన కృపావరం నీతిమంతులుగా ప్రకటించే తీర్పుకు[b] దారితీసింది.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “పాపం చేసిన ఒక మనిషి ద్వారా వచ్చినదానిలా ఈ వరమూ లేదు.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “నిర్దోషులుగా ప్రకటించే తీర్పుకు” లేదా “నిర్దోష తీర్పుకు.”
    reason: lexical_alternative
lexical_decisions:
- source_word: δώρημα
  choice: వరం
  rationale: ఇది ఇచ్చిన బహుమతిని సూచిస్తుంది. ‘వరం’ సహజమైన, గౌరవప్రదమైన తెలుగు పదం; మూలంలో లేని అదనపు భావాన్ని చేర్చదు.
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: పాపం చేసిన ఆ ఒక్కని ద్వారా వచ్చినది
  rationale: గ్రీకు వాక్యంలోని సంక్షిప్తమైన పోలికను నిలుపుతూ, పాపం చేసిన వ్యక్తిని సూచిస్తుంది; ‘మనిషి’ అని మూలంలో స్పష్టంగా లేని పదాన్ని ప్రధాన పాఠ్యంలో చేర్చదు.
- source_word: κρίμα
  choice: తీర్పు
  rationale: న్యాయపరమైన నిర్ణయాన్ని సూచించే సహజమైన తెలుగు పదం; κατάκριμαతో ఉన్న సంబంధాన్ని నిలుపుతుంది.
- source_word: ἐξ ἑνὸς
  choice: ఒక అపరాధం నుండి
  rationale: తరువాతి ‘అనేక అపరాధాలు’ అనే వ్యతిరేక సమాంతర నిర్మాణం దృష్ట్యా, ఇక్కడ ἑνός ఒక అపరాధాన్ని సూచించే అవకాశం బలంగా ఉంది.
- source_word: κατάκριμα
  choice: శిక్షావిధి
  rationale: దోషిగా నిర్ధారించి శిక్షకు పాత్రుడని ఇచ్చే న్యాయపరమైన ప్రతికూల తీర్పును స్పష్టంగా తెలియజేస్తుంది.
- source_word: χάρισμα
  choice: కృపావరం
  rationale: χάριςతో ఉన్న పదసంబంధాన్ని, కృపచేత ఇచ్చే వరం అనే భావాన్ని తెలుగులో సంక్షిప్తంగా నిలుపుతుంది; మొదటి δώρημα నుండి పదభేదాన్ని కూడా చూపిస్తుంది.
- source_word: παραπτωμάτων
  choice: అపరాధాలు
  rationale: నైతికంగానూ న్యాయపరంగానూ తప్పిదాలు లేదా అతిక్రమాలను సూచించే సులభమైన ఆధునిక తెలుగు పదం.
- source_word: δικαίωμα
  choice: నీతిమంతులుగా తీర్చే తీర్పు
  rationale: κατάκριμαకు వ్యతిరేకంగా ఉన్న న్యాయస్థాన సంబంధిత ఫలితాన్ని వ్యక్తం చేస్తూ, ‘నీతీకరణ’ అనే సాంకేతిక పదం కంటే సాధారణ పాఠకులకు స్పష్టంగా ఉంటుంది; అయితే ‘నిర్దోష తీర్పు’ అనే భావసంభావ్యతను పాదటిప్పణిలో నిలుపుతుంది.
theological_decisions:
- issue: κατάκριμαకు వ్యతిరేకంగా δικαίωμα యొక్క న్యాయపరమైన భావం
  choice: నీతిమంతులుగా తీర్చే తీర్పు
  alternative: నిర్దోషులుగా ప్రకటించే తీర్పు; నిర్దోష తీర్పు
  rationale: వాక్య నిర్మాణం తీర్పు/శిక్షావిధి మరియు కృపావరం/δικαίωμα మధ్య న్యాయపరమైన వ్యతిరేకతను చూపుతుంది. ప్రధాన అనువాదం దేవుని అనుకూల తీర్పు భావాన్ని తెలియజేస్తుంది; అది కేవలం గత అపరాధాల నుంచి విముక్తి అనే భావానికే పరిమితం కాకుండా మూలంలోని ‘నీతిసంబంధ’ ఛాయను నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యే గౌరవప్రదమైన శైలిని వాడాం. గ్రీకు మూలంలోని సంక్షిప్త పోలికను సాధ్యమైనంతవరకు నిలిపి, న్యాయస్థాన సంబంధిత వ్యతిరేకతను స్పష్టంగా చేశాం. ప్రతి పాదటిప్పణి సూచిక ప్రధాన పాఠ్యంలో ఉంది.
