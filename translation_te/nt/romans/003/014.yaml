translation:
  language: te
  text: వారి నోరు శాపాలతో, చేదుతనంతో నిండి ఉంది.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: వారి
  rationale: ముందటి సందర్భంలో పేర్కొన్నవారిని సూచించే సంబంధ సర్వనామాన్ని తెలుగులో సహజంగా స్వామ్యార్థకమైన ‘వారి’తో వ్యక్తపరచడం జరిగింది.
- source_word: τὸ στόμα
  choice: నోరు
  rationale: ఏకవచన రూపాన్ని నిలుపుతూ, మాటలను సూచించే సహజమైన తెలుగు రూపం.
- source_word: ἀρᾶς
  choice: శాపాలతో
  rationale: హాని కలగాలని పలికే శాపవాక్కులను సూచిస్తుంది; γέμειతో ఉన్న నిర్మాణంలో తెలుగు బహువచన రూపం సహజంగా ఉంటుంది.
- source_word: πικρίας
  choice: చేదుతనంతో
  rationale: మూలపదంలోని చేదు స్వభావం మరియు దాని నైతిక భావబలాన్ని నిలుపుతుంది; దానిని కేవలం కఠినమైన మాటలకే పరిమితం చేయదు.
- source_word: γέμει
  choice: నిండి ఉంది
  rationale: వర్తమాన స్థితిని తెలిపే మూల క్రియకు సహజమైన తెలుగు సమానార్థకం.
