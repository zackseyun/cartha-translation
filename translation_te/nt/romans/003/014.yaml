  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గంభీరమైన వాక్యం. మూలంలోని ఏకవచన ‘నోరు’ను సామూహిక ప్రయోగంగా నిలిపి, శాపం మరియు చేదుతనం అనే రెండు భావాలను స్పష్టంగా ఉంచింది.
