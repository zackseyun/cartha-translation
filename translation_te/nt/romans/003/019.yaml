  to: ధర్మశాస్త్రం ఏది చెప్పినా, అది ధర్మశాస్త్రానికి లోబడినవారితో[a] మాట్లాడుతుందని మనకు తెలుసు; ప్రతి నోరూ మూయబడేలా, లోకమంతా దేవునికి జవాబుదారీ అయ్యేలా[b].
