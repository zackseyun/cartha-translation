id: ROM.3.19
reference: Romans 3:19
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: te
  text: ధర్మశాస్త్రం ఏది చెప్పినా, అది ధర్మశాస్త్రానికి లోబడినవారితో[a] మాట్లాడుతుందని మనకు తెలుసు; ప్రతి నోరూ మూయబడేలా, లోకమంతా దేవునికి జవాబుదారీ అయ్యేలా[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: అక్షరార్థంగా, “ధర్మశాస్త్రంలో ఉన్నవారితో.”
    reason: lexical_alternative
  - marker: b
    text: లేదా, “దేవుని ఎదుట జవాబు చెప్పవలసిన స్థితికి రావాలి”; “దేవుని తీర్పుకు పాత్రం కావాలి” అనే భావమూ ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: మనకు తెలుసు
  rationale: Οἴδαμεν అనే వర్తమానకాల సమిష్టి జ్ఞాన ప్రకటనను సహజమైన తెలుగులో వ్యక్తం చేస్తుంది. δέ యొక్క స్వల్ప అనుసంధాన భావాన్ని సందర్భమే తెలియజేస్తుంది; మూలంలో లేని కాలసూచక పదాన్ని చేర్చలేదు.
- source_word: ὁ νόμος
  choice: ధర్మశాస్త్రం
  rationale: పౌలు సూచిస్తున్న గుర్తింపుపొందిన నిబంధనాత్మక శాస్త్రాన్ని తెలుగులో సాధారణంగా, గౌరవప్రదంగా సూచించే పదం.
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: ధర్మశాస్త్రానికి లోబడినవారితోనే
  rationale: అక్షరార్థంగా ‘ధర్మశాస్త్రంలో ఉన్నవారు’ అయినా, దాని అధికార పరిధిలో ఉన్నవారనే భావాన్ని సహజమైన తెలుగులో తెలియజేస్తుంది. గ్రీకు రూపానికి దగ్గరైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
- source_word: λαλεῖ
  choice: మాట్లాడుతుంది
  rationale: ముందున్న λέγει (‘చెబుతుంది’)తో గ్రీకులోని క్రియాభేదాన్ని తెలుగులోనూ నిలుపుతుంది.
- source_word: ἵνα
  choice: దీనివల్ల … కావాలి
  rationale: ధర్మశాస్త్రపు మాట ఫలితంగా లేదా లక్ష్యంగా నోళ్ల మూయబడటాన్ని, లోకం జవాబుదారీ కావడాన్ని సహజ తెలుగులో కలుపుతుంది; ఉద్దేశం-ఫలితం మధ్య గ్రీకులో ఉన్న సున్నితత్వాన్ని అతిగా నిర్ణయించదు.
- source_word: πᾶν στόμα φραγῇ
  choice: ప్రతి నోరూ మూయబడాలి
  rationale: తనను తాను సమర్థించుకునే మాట లేకపోవడాన్ని తెలిపే స్పష్టమైన న్యాయస్థాన రూపకాన్ని అలాగే ఉంచుతుంది.
- source_word: ὑπόδικος γένηται
  choice: జవాబుదారీ కావాలి
  rationale: γένηται లోని స్థితిలోకి రావడం అనే భావాన్ని ‘కావాలి’ నిలుపుతుంది; ὑπόδικος యొక్క న్యాయపరమైన బలాన్ని ‘దోషిగా తీర్పుపొందాలి’ అని మరీ బలపరచకుండా వ్యక్తం చేస్తుంది.
- source_word: πᾶς ὁ κόσμος
  choice: లోకమంతా
  rationale: దేవుని ఎదుట సమస్త మానవాళిని ఆవరించే సమగ్ర పరిధిని సంక్షిప్తంగా, సహజంగా తెలియజేస్తుంది.
- source_word: τῷ θεῷ
  choice: దేవునికి
  rationale: ὑπόδικος తో ఉన్న దత్తి విభక్తి సంబంధాన్ని నేరుగా ప్రతిబింబిస్తూ, జవాబుదారీతనం దేవునికి చెందుతుందని తెలియజేస్తుంది.
theological_decisions:
- issue: ὑπόδικος పదంలో దైవిక న్యాయతీర్పుకు సంబంధించిన న్యాయపరమైన బలం
  choice: లోకమంతా దేవునికి జవాబుదారీ కావాలి
  alternative: లోకమంతా దేవుని ఎదుట దోషిగా నిలవాలి / దేవుని తీర్పుకు పాత్రం కావాలి
  rationale: ఈ పదం దేవుని న్యాయస్థానం ఎదుట లోకం సమాధానం చెప్పవలసిన స్థితిని సూచిస్తుంది. ‘జవాబుదారీ’ ఆ న్యాయపరమైన భావాన్ని నిలుపుతూ, ఈ విశేషణం తప్పనిసరిగా చెప్పేదానికంటే ముందుకు వెళ్లి తుది దోషనిర్ణయాన్ని ప్రకటించదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన శైలిని వాడింది. ‘ధర్మశాస్త్రం’ అనే స్థిరమైన బైబిలు పదాన్ని నిలుపుతూ, వాక్య నిర్మాణాన్ని సహజంగా చేసింది. న్యాయస్థాన రూపకాన్నీ ὑπόδικος లోని ఉద్దేశపూర్వక భావవిస్తృతినీ కాపాడింది.
