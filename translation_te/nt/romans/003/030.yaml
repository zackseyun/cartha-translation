  text: ⸀εἴπερ εἷς ὁ θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/030.yaml
  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: te
  text: దేవుడు ఒక్కడే కాబట్టి[a], ఆయన విశ్వాసం ఆధారంగా సున్నతి పొందినవారిని, విశ్వాసం ద్వారా సున్నతి పొందనివారిని నీతిమంతులని ప్రకటిస్తాడు[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుడు నిజంగా ఒక్కడే అయితే.’
    reason: alternative_reading
  - marker: b
    text: గ్రీకులో అక్షరార్థంగా ‘సున్నతి’ మరియు ‘సున్నతి లేమి’; ఇవి సున్నతి పొందినవారిని, పొందనివారిని సూచిస్తున్నాయి.
    reason: cultural_note
  - marker: c
    text: పౌలు ‘విశ్వాసం ఆధారంగా’, ‘విశ్వాసం ద్వారా’ అనే రెండు భిన్న ప్రయోగాలు వాడాడు; ఈ తేడా కచ్చితమైన భావభేదం కాకుండా శైలీపరమైనదై ఉండవచ్చు.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: కాబట్టి
  rationale: ఇక్కడ పౌలు అనిశ్చితిని వ్యక్తం చేయడం కంటే, అందరూ అంగీకరించే ఏకదైవ విశ్వాసం ఆధారంగా తార్కిక నిర్ధారణ చేస్తున్నాడు. అయితే షరతుతో కూడిన భావసాధ్యతను పాదసూచికలో ఉంచాం.
- source_word: εἷς ὁ θεός
  choice: దేవుడు ఒక్కడే
  rationale: గ్రీకు వాక్యంలోని ఏకదైవ ప్రకటనకు ఉన్న ఉద్ఘాటనను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: δικαιώσει
  choice: నీతిమంతులుగా తీర్పుతీరుస్తాడు
  rationale: δικαιόω యొక్క న్యాయస్థాన సంబంధ భావాన్ని స్పష్టంగా తెలియజేస్తూ, భవిష్యత్ కాలాన్ని కూడా నిలుపుతుంది.
- source_word: περιτομήν
  choice: సున్నతి పొందినవారిని
  rationale: మూలంలోని భావవాచక నామం ఇక్కడ సున్నతి పొందిన ప్రజలను సూచించే లక్షణార్థక ప్రయోగం; జాతిపరంగా ‘యూదులు’ అని అతిగా వివరించదు.
- source_word: ἐκ πίστεως
  choice: విశ్వాసం ఆధారంగా
  rationale: ἐκ సూచించగల ఆధారం లేదా ప్రాతిపదిక భావాన్ని సహజమైన తెలుగులో వ్యక్తం చేస్తుంది; తరువాతి διάతో ఉన్న తేడాను నిలుపుతుంది.
- source_word: ἀκροβυστίαν
  choice: సున్నతి పొందనివారిని
  rationale: ఇది సున్నతి లేని ప్రజలను సూచించే లక్షణార్థక ప్రయోగం; ‘యూదేతరులు’ అని వ్యాఖ్యానాత్మకంగా మార్చకుండా మూలరూపకాన్ని నిలుపుతుంది.
- source_word: διὰ τῆς πίστεως
  choice: విశ్వాసం ద్వారా
  rationale: διά యొక్క సాధనార్థక భావాన్ని నిలుపుతూ, ἐκ πίστεως‌కు ఎంచుకున్న ‘ఆధారంగా’ అనే పదబంధం నుంచి భేదాన్ని కాపాడుతుంది.
- source_word: πίστεως
  choice: విశ్వాసం
  rationale: ఈ సందర్భంలో πίστις‌కు సహజమైన, స్థిరమైన తెలుగు సమానార్థకం; ‘విశ్వసనీయత’ అనే భావం ఇక్కడ సందర్భపరంగా అవసరం లేదు.
theological_decisions:
- issue: ἐκ πίστεως మరియు διὰ τῆς πίστεως మధ్య పౌలు ఉద్దేశించిన భేదం
  choice: ‘విశ్వాసం ఆధారంగా’, ‘విశ్వాసం ద్వారా’ అని రెండు భిన్న ప్రయోగాలను నిలిపాం; వాటి మధ్య నిర్దిష్ట సిద్ధాంత భేదాన్ని ప్రకటించలేదు.
  alternative: రెండింటినీ ‘విశ్వాసం ద్వారా’ అని ఒకే విధంగా అనువదించడం, లేదా ప్రాతిపదిక-సాధనం మధ్య కఠినమైన సిద్ధాంత భేదాన్ని ప్రతిపాదించడం.
  rationale: గ్రీకులో వేర్వేరు విభక్త్యర్థక అవ్యయాలు ఉన్నాయి. వాటిని అనువాదంలో కనిపించేలా చేయడం సముచితం; అయితే సందర్భం వాటి మధ్య కఠినమైన సిద్ధాంత విభజనను తప్పనిసరి చేయదు.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ‘సున్నతి’, ‘విశ్వాసం’, ‘నీతిమంతులుగా తీర్పుతీర్చడం’ వంటి బైబిలు భావపదాలను స్పష్టతతో వాడి, గ్రీకు వాక్యంలోని లక్షణార్థక ప్రయోగం మరియు రెండు విశ్వాస పదబంధాల మధ్య ఉద్రిక్తతను నిలిపాం.
