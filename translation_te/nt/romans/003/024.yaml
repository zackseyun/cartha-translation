source:
  edition: SBLGNT
  text: δικαιούμενοι δωρεὰν τῇ αὐτοῦ χάριτι διὰ τῆς ἀπολυτρώσεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/024.yaml
  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: te
  text: ఆయన కృపచేత ఉచితంగా, మెస్సీయ అయిన యేసులోని విమోచనం ద్వారా నీతిమంతులుగా తీర్చబడుతున్నారు[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “నీతిమంతులుగా ప్రకటించబడుతున్నారు.”
    reason: lexical_alternative
  - marker: b
    text: 'సాంప్రదాయ అనువాదం: “క్రీస్తు యేసు.”'
    reason: alternative_rendering
lexical_decisions:
- source_word: δικαιούμενοι
  choice: నీతిమంతులుగా తీర్చబడుతున్నారు
  rationale: వర్తమానకాల కర్మణి భావాన్ని, ముందున్న వాక్యంతో కొనసాగుతున్న సంబంధాన్ని సాధ్యమైనంతగా నిలుపుతుంది. పౌలు వాడే న్యాయస్థాన సంబంధిత భావాన్ని కాపాడుతూ, దానిని కేవలం నైతిక మార్పుగా పరిమితం చేయదు.
- source_word: δωρεὰν
  choice: ఉచితంగా
  rationale: సంపాదించుకున్న ప్రతిఫలంగా కాక, ధర చెల్లించకుండా వరంగా లభిస్తుందనే భావాన్ని సహజమైన ఆధునిక తెలుగులో సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: τῇ αὐτοῦ χάριτι
  choice: ఆయన కృపచేత
  rationale: దేవుని అనుగ్రహపూర్వక కార్యాన్ని సూచించే పౌలు పరిభాషను నిలుపుతుంది; సాధనార్థక భావాన్ని తెలుగులో స్పష్టంగా వ్యక్తం చేస్తుంది.
- source_word: ἀπολυτρώσεως
  choice: విమోచనం
  rationale: విడుదల మరియు విమోచన మూల్యం అనే పదంలోని భావపరిధిని మితంగా నిలుపుతూ, తెలుగు బైబిలు పరిభాషలో అర్థమయ్యే పదాన్ని ఉపయోగిస్తుంది.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: మెస్సీయ అయిన యేసులో ఉన్న
  rationale: Χριστός ఇక్కడ బిరుదుగా ఉన్నందున ‘మెస్సీయ’ అని అనువదించబడింది. ἐν అనే సంబంధాన్ని ‘యేసులో ఉన్న’ అని ఉంచి, అది ‘విమోచనం’ను విశేషిస్తుందని స్పష్టం చేస్తుంది.
theological_decisions:
- issue: పౌలు వాడిన నీతీకరణ భాష
  choice: నీతిమంతులుగా తీర్చబడుతున్నారు
  alternative: నీతిమంతులని ప్రకటించబడుతున్నారు
  rationale: δικαιόω యొక్క న్యాయస్థాన సంబంధిత బలాన్ని ప్రధాన పాఠంలో సంక్షిప్తంగా నిలుపుతుంది. ‘ప్రకటించబడుతున్నారు’ అనేది సముచిత వివరణాత్మక ప్రత్యామ్నాయం అయినా, పదంలోని పూర్తి భావాన్ని ఒకే వివరణకు పరిమితం చేయకుండా పాదటిప్పణిలో ఉంచబడింది.
- issue: Χριστός అనే బిరుదు
  choice: మెస్సీయ అయిన యేసు
  alternative: క్రీస్తు యేసు
  rationale: గ్రీకు పదంలోని అభిషిక్త రాజు/మెస్సీయ అనే బిరుదు భావాన్ని అనువదిస్తుంది; సాంప్రదాయ తెలుగు రూపాన్ని ప్రత్యామ్నాయంగా పాదటిప్పణిలో నిలుపుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. ఈ వచనం 3:23తో వ్యాకరణపరంగా కొనసాగుతుందని సూచించేందుకు కర్మణి బహువచన రూపం నిలుపబడింది. ‘మెస్సీయ అయిన యేసు’ అనే రూపం బిరుదు భావాన్ని సహజ తెలుగులో స్పష్టం చేస్తుంది.
