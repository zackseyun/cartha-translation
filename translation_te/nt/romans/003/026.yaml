id: ROM.3.26
reference: Romans 3:26
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς ⸀τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: te
  text: దేవుని సహనంలో, ప్రస్తుత కాలంలో తన నీతిని[a] ప్రదర్శించడానికి, తాను నీతిమంతుడై ఉండి యేసుపై విశ్వాసం కలిగినవాణ్ణి[c] నీతిమంతుడని తీర్చేవాడుగా[b] ఉండటానికి.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘తన న్యాయాన్ని.’
    reason: lexical_alternative
  - marker: b
    text: లేదా, ‘నీతిమంతుడని ప్రకటించేవాడుగా.’
    reason: lexical_alternative
  - marker: c
    text: ‘యేసుపై విశ్వాసం కలిగినవాణ్ణి’ అనే పదబంధానికి, ‘యేసు విశ్వాసానికి చెందినవాణ్ణి’ లేదా ‘యేసు విశ్వసనీయత ద్వారా జీవించేవాణ్ణి’ అనే అర్థం కూడా ఉండవచ్చు.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνοχῇ
  choice: సహనం
  rationale: దేవుడు వెంటనే తీర్పు తీర్చకుండా ఉద్దేశపూర్వకంగా నిగ్రహించుకోవడాన్ని సందర్భానుసారంగా సహజమైన తెలుగులో తెలియజేస్తుంది.
- source_word: ἔνδειξιν
  choice: ప్రదర్శించడానికి
  rationale: దేవుని నీతి బహిరంగంగా వెల్లడై నిరూపితమవుతుందనే భావాన్ని సాధారణ ఆధునిక తెలుగులో అందిస్తుంది.
- source_word: δικαιοσύνης
  choice: నీతి
  rationale: పౌలు వాడిన పదంలోని నైతిక, న్యాయపరమైన భావాలను రెండింటినీ మోయగల ప్రామాణిక తెలుగు పదం; ‘న్యాయం’ అనే భావఛాయను పాదసూచికలో ఉంచాం.
- source_word: νῦν καιρῷ
  choice: ప్రస్తుత కాలంలో
  rationale: νῦν మరియు καιρός కలిగిన కాలసంబంధమైన ప్రాధాన్యాన్ని సహజంగా నిలుపుతుంది.
- source_word: δίκαιον
  choice: నీతిమంతుడు
  rationale: దేవుడు న్యాయసమ్మతుడని తెలిపే న్యాయస్థాన భావాన్ని నిలుపుతూ, తదుపరి δικαιοῦντα పదంతో ఉన్న మూలపద సంబంధాన్ని తెలుగులో సాధ్యమైనంతగా ప్రతిధ్వనింపజేస్తుంది.
- source_word: δικαιοῦντα
  choice: నీతిమంతుడిగా తీర్చేవాడు
  rationale: వర్తమాన క్రియాత్మక అసమాపక క్రియను వ్యక్తిని సూచించే రూపంలో అందించి, దేవుడు ఒకరిని నీతిమంతుడిగా ప్రకటిస్తాడనే న్యాయపరమైన భావాన్ని కాపాడుతుంది.
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: యేసుపై విశ్వాసముంచినవాణ్ణి
  rationale: ప్రధాన పాఠ్యంలో వివాదాస్పద షష్ఠీ విభక్తి నిర్మాణాన్ని యేసును విశ్వాసానికి విషయంగా తీసుకునే సుపరిచిత భావంలో సహజంగా అనువదించాం; ప్రత్యామ్నాయ భావాన్ని పాదసూచికలో నిలిపాం.
theological_decisions:
- issue: ἐκ πίστεως Ἰησοῦ అనే పదబంధం యొక్క అర్థం
  choice: యేసుపై విశ్వాసముంచినవాడు
  alternative: యేసు విశ్వసనీయతపై ఆధారపడినవాడు / యేసు విశ్వాసానికి చెందినవాడు
  rationale: షష్ఠీ విభక్తిని objective genitive గానీ subjective genitive గానీ అర్థం చేసుకునే అవకాశం ఉంది. ప్రధాన పాఠ్యం సుపరిచితమైన objective అర్థాన్ని తీసుకుంటుంది; నిజమైన వ్యాఖ్యాన సందిగ్ధతను పాదసూచికలో స్పష్టంగా కాపాడుతుంది.
- issue: δίκαιον మరియు δικαιοῦντα మధ్య పదప్రయోగ సంబంధం
  choice: నీతిమంతుడు … నీతిమంతుడిగా తీర్చేవాడు
  alternative: న్యాయవంతుడు … నిర్దోషిగా ప్రకటించేవాడు
  rationale: దేవుని స్వభావం మరియు ఆయన నీతిమంతుడిగా తీర్చే కార్యం మధ్య పౌలు ఉద్దేశించిన పదసంబంధాన్ని వీలైనంతగా నిలుపుతూ, న్యాయపరమైన భావాన్ని చెరపకుండా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి వాడబడింది. గ్రీకు వాక్యం ముందు వచనం నుంచి కొనసాగుతున్నందున, తెలుగులో అర్థసంపూర్ణత కోసం చివర ‘ఆయన ఇలా చేశాడు’ అని సందర్భసిద్ధంగా పూరించబడింది; దీనిని [c] పాదసూచికకు ముందు ఉంచడం ద్వారా పాఠ్య ప్రవాహం సహజంగా చేయబడింది.
