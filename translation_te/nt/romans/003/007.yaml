id: ROM.3.7
reference: Romans 3:7
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: te
  text: అయితే నా అబద్ధం ద్వారా దేవుని సత్యసంధత[a] ఆయన మహిమ కొరకు మరింతగా సమృద్ధిగా వ్యక్తమై ఉంటే, నేను ఇంకా పాపినిగా ఎందుకు తీర్పు పొందుతున్నాను?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, ‘దేవుని సత్యం.’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια τοῦ θεοῦ
  choice: దేవుని సత్యసంధత
  rationale: 3:4–7 సందర్భంలో దేవుడు సత్యవంతుడు కావడం మానవుని అబద్ధంతో విరుద్ధంగా ఉంచబడింది. అందువల్ల ‘సత్యసంధత’ నైతిక, వ్యక్తిగత భావాన్ని సహజమైన తెలుగులో స్పష్టం చేస్తుంది.
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: నా అబద్ధం ద్వారా
  rationale: ἐν ఇక్కడ సాధనం లేదా మాధ్యమాన్ని సూచిస్తుంది; ‘ద్వారా’ ఆ భావాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: ἐπερίσσευσεν
  choice: మరింతగా వెల్లడి అయితే
  rationale: క్రియలోని విస్తరించడం లేదా సమృద్ధి చెందడం అనే భావాన్ని సందర్భానుసారంగా తెలియజేస్తుంది; దేవుని సత్యసంధత స్వయంగా పెరిగిందని తప్పుగా సూచించకుండా, అది మరింత స్పష్టంగా వ్యక్తమైందనే భావాన్ని అందిస్తుంది.
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: ఆయన మహిమకు
  rationale: εἰς యొక్క ఫలితం లేదా దిశ భావాన్ని సంక్షిప్తంగా కాపాడుతుంది.
- source_word: τί ἔτι κἀγὼ
  choice: నేను ఇంకా ... ఎందుకు
  rationale: ἔτι లోని కొనసాగింపు భావాన్ని ‘ఇంకా’ కాపాడుతుంది. κἀγώ లోని అదనపు ఛాయ తెలుగులో సందర్భం ద్వారా సహజంగా వ్యక్తమవుతుంది.
- source_word: ὡς ἁμαρτωλὸς κρίνομαι
  choice: పాపినిగా ... తీర్పు పొందుతున్నాను
  rationale: ప్రస్తుతకాల కర్మణి రూపంలోని కొనసాగుతున్న తీర్పు భావాన్ని కాపాడుతుంది; ‘దోషిగా ఖండించబడటం’ అని మరీ సంకుచితం చేయదు.
theological_decisions:
- issue: ἀλήθεια τοῦ θεοῦ అనేది ‘దేవుని సత్యం’నా, లేక ‘దేవుని సత్యసంధత’నా?
  choice: దేవుని సత్యసంధత
  alternative: దేవుని సత్యం
  rationale: రోమా 3:4–7లో దేవుడు సత్యవంతుడు, మనుషులు అబద్ధికులు అనే వ్యత్యాసం ప్రధానంగా ఉంది. ‘సత్యసంధత’ ఈ వ్యక్తిగత-నైతిక భావాన్ని వ్యక్తం చేస్తుంది; అయినప్పటికీ ‘దేవుని సత్యం’ అనే విస్తృత అర్థం మూలంలో సాధ్యమే.
- issue: ἐπερίσσευσεν ను దేవుని సత్యసంధత పరిమాణపరంగా పెరిగిందని అనువదించాలా?
  choice: మరింతగా వెల్లడి అయితే
  alternative: విస్తరించి ఉంటే / సమృద్ధిగా పెరిగి ఉంటే
  rationale: పౌలు ఉంచిన వాదనలో మానవ అబద్ధం ద్వారా దేవుని సత్యసంధత ఆయన మహిమకు అధికంగా ప్రత్యక్షమవుతుందనే భావం ఉంది. ఈ ఎంపిక దేవుని స్వభావం నిజంగా పెరుగుతుందనే అవసరం లేని భావాన్ని నివారిస్తూనే క్రియలోని అధికతను ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; గౌరవప్రదమైనప్పటికీ సాధారణ పాఠకులకు సులభంగా అర్థమయ్యే వాక్యనిర్మాణం. అలంకార ప్రశ్న స్వరూపం, ‘ఇంకా’ అనే కొనసాగింపు భావం, తీర్పు అనే విస్తృత న్యాయార్థం నిలుపబడ్డాయి.
