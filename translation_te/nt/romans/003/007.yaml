revisions:
- from: అయితే నా అబద్ధం ద్వారా దేవుని సత్యసంధత ఆయన మహిమకు మరింతగా వెల్లడి అయితే, నేను ఇంకా పాపినిగా ఎందుకు తీర్పు పొందుతున్నాను?
  to: అయితే నా అబద్ధం ద్వారా దేవుని సత్యసంధత[a] ఆయన మహిమ కొరకు మరింతగా సమృద్ధిగా వ్యక్తమై ఉంటే, నేను ఇంకా పాపినిగా ఎందుకు తీర్పు పొందుతున్నాను?
  rationale: The revision replaces ‘మరింతగా వెల్లడి అయితే’ with ‘మరింతగా సమృద్ధిగా వ్యక్తమై ఉంటే’ to preserve the abundance denoted by ἐπερίσσευσεν without implying that God’s intrinsic truthfulness itself increases. It also gives the conditional clause a natural completed form in Telugu. A footnote preserves the lexical breadth of ἀλήθεια τοῦ θεοῦ.
