  yaml_path: translation/nt/romans/003/006.yaml
  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: te
  text: ఎట్టి పరిస్థితుల్లోనూ కాదు! అలా అయితే, దేవుడు లోకాన్ని ఎలా తీర్పు తీరుస్తాడు?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: ఎట్టి పరిస్థితుల్లోనూ కాదు!
  rationale: ఇది అక్షరార్థమైన కోరికకన్నా, ముందున్న భావనను బలంగా తిరస్కరించే పౌలు వాడే నానుడి. ఆధునిక తెలుగులో దాని తీవ్రతను సహజంగా తెలియజేస్తుంది.
- source_word: ἐπεὶ
  choice: అలా అయితే
  rationale: తిరస్కరించబడిన ప్రతిపాదన నిజమైతే కలిగే తార్కిక పరిణామాన్ని ఇక్కడ పరిచయం చేస్తుంది; పౌలు వాదన ప్రవాహాన్ని సహజంగా నిలుపుతుంది.
- source_word: κρινεῖ
  choice: తీర్పు తీరుస్తాడు
  rationale: భవిష్యత్ సూచక క్రియ యొక్క నేర అర్థాన్ని నిలుపుతూ, దేవుడు న్యాయాధిపతిగా తీర్పు ఇవ్వడాన్ని సహజ తెలుగులో వ్యక్తం చేస్తుంది.
- source_word: ὁ θεὸς
  choice: దేవుడు
  rationale: నిర్దిష్ట కర్తను సాధారణ, గౌరవప్రదమైన తెలుగు బైబిలు పదంతో అందిస్తుంది.
- source_word: τὸν κόσμον
  choice: లోకానికి
  rationale: κόσμος ఇక్కడ దైవిక తీర్పుకు లోబడే విశాలమైన మానవ లోకాన్ని సూచిస్తుంది. తెలుగు వాడుకలో ‘లోకానికి తీర్పు తీర్చడం’ సహజమైన నిర్మాణం.
theological_decisions:
- issue: μὴ γένοιτο అనే తిరస్కార సూత్రం యొక్క బలం
  choice: ముందటి నిర్ధారణను బలంగా ఖండించే నానుడిగా ‘ఎట్టి పరిస్థితుల్లోనూ కాదు!’
  alternative: ‘అలా ఎన్నటికీ జరగకూడదు!’ వంటి మరింత రూపానుగుణ అనువాదం
  rationale: గ్రీకు రూపం కోరికవాచకంగా ఉన్నప్పటికీ, పౌలు రచనలో ఇది స్థిరమైన తీవ్రమైన తిరస్కార సూత్రం. నానుడి బలాన్ని కాపాడుతూ అదనపు సిద్ధాంతార్థాన్ని చేర్చలేదు.
- issue: ἐπεὶ యొక్క తార్కిక సంబంధం
  choice: తిరస్కరించిన ప్రతిపాదన ఫలితాన్ని సూచిస్తూ ‘అలా అయితే’
  alternative: కారణార్థకంగా ‘ఎందుకంటే’ లేదా ‘నిజానికి’
  rationale: తదుపరి అలంకారిక ప్రశ్న, ముందటి ప్రతిపాదన నిజమని ఊహిస్తే కలిగే అసంభవ పరిణామాన్ని చూపిస్తుంది; కారణార్థక పఠనాన్ని బలవంతంగా స్థిరపరచకుండా వాదనను స్పష్టంగా ఉంచుతుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగు; సాధారణ పాఠకులకు స్పష్టంగా, గౌరవప్రదంగా, వాదనాత్మక ఉద్ధృతిని నిలుపుతూ అనువదించబడింది. మూలంలో లేని పాదసూచిక గుర్తు చేర్చలేదు; అందించిన ఆంగ్ల పాదసూచికలో గుర్తు-విషయం అసంగతంగా ఉంది.
