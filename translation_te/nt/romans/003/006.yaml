revisions:
- from: ఎట్టి పరిస్థితుల్లోనూ కాదు! అలా అయితే, దేవుడు లోకానికి ఎలా తీర్పు తీరుస్తాడు?
  to: ఎట్టి పరిస్థితుల్లోనూ కాదు! అలా అయితే, దేవుడు లోకాన్ని ఎలా తీర్పు తీరుస్తాడు?
  rationale: The revision changes only ‘లోకానికి’ to the accusative-marked ‘లోకాన్ని,’ preserving the Greek syntactic relationship and improving precision without altering the rhetorical force, tense, or register.
