id: ROM.3.4
reference: Romans 3:4
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: te
  text: 'అలా ఎన్నటికీ జరగకూడదు! అందుకు బదులుగా, మనుష్యులందరూ అబద్ధికులైనా దేవుడు సత్యవంతుడని తేలాలి. ఇలా వ్రాయబడి ఉంది:


    “నీ మాటలలో నీవు సరైనవాడివని నిరూపించబడేలా,

    నీవు తీర్పు పొందేటప్పుడు పైచేయి సాధించేలా.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “నీవు తీర్పు పొందేటప్పుడు” అనే గ్రీకు మాటను “నీవు తీర్పు తీర్చేటప్పుడు” అని కూడా అనువదించవచ్చు. ఈ రెండవ అనువాదం కీర్తన 51:4లోని హీబ్రూ వాక్యాన్ని మరింత నేరుగా ప్రతిబింబిస్తుంది.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: అలా ఎన్నటికీ జరగకూడదు!
  rationale: పౌలు వ్యక్తం చేసిన తీవ్రమైన నిరాకరణను, గ్రీకు ఆశార్థక ప్రయోగపు ఛాయను సహజమైన ఆధునిక తెలుగులో నిలుపుతుంది.
- source_word: γινέσθω ... ὁ θεὸς ἀληθής
  choice: దేవుడు సత్యవంతుడని తేలాలి
  rationale: γινέσθω యొక్క ఆజ్ఞార్థక బలాన్ని ఉంచుతూ, దేవుడు సత్యవంతుడిగా నిరూపితమవడం అనే సందర్భార్థాన్ని సహజంగా తెలియజేస్తుంది.
- source_word: πᾶς ... ἄνθρωπος
  choice: ప్రతి మనిషీ
  rationale: ἄνθρωπος ఇక్కడ లింగనిర్దిష్టం కాని సాధారణ మానవ సూచన; πᾶς యొక్క పంపిణీ భావాన్ని నిలుపుతుంది.
- source_word: ψεύστης
  choice: అబద్ధికుడు
  rationale: సత్యవంతుడు అనే పదానికి నేరుగా వ్యతిరేకంగా నిలిచే నామవాచక రూపాన్ని కాపాడుతుంది.
- source_word: καθὼς γέγραπται
  choice: ఇలా రాయబడి ఉంది
  rationale: లేఖన ఉల్లేఖనానికి వాడే సూత్రప్రాయమైన మాటను సహజ తెలుగులో అందిస్తుంది.
- source_word: δικαιωθῇς
  choice: నీతిమంతుడని తీర్పు పొందేలా
  rationale: దేవుడు నీతిమంతుడిగా మారడం కాదని, ఆయన న్యాయస్థాన సంబంధమైన రీతిలో సరైనవాడని నిర్ధారించబడటం అనే భావాన్ని స్పష్టం చేస్తుంది.
- source_word: λόγοις
  choice: మాటల్లో
  rationale: గ్రీకు బహువచనానికి సరళమైన, సందర్భోచితమైన సమానార్థకం.
- source_word: νικήσεις
  choice: జయించేలా
  rationale: తీర్పు సందర్భంలో విజయం పొందడం లేదా పైచేయి సాధించడం అనే భావాన్ని సంక్షిప్తంగా తెలియజేస్తుంది.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: నీవు తీర్పు పొందేటప్పుడు
  rationale: రోమా పత్రికలోని గ్రీకు క్రియారూపానికి సహజమైన కర్మణి అర్థాన్ని అనుసరిస్తుంది; కీర్తన హీబ్రూ ఆధారమైన ప్రత్యామ్నాయాన్ని పాదసూచికలో ఉంచింది.
theological_decisions:
- issue: దేవుని గురించి δικαιωθῇς యొక్క న్యాయస్థాన సంబంధమైన భావం
  choice: నీతిమంతుడని తీర్పు పొందేలా
  alternative: నీవు సరైనవాడివని తేలేలా; నీవు నిర్దోషివని నిరూపించబడేలా
  rationale: ఈ వాక్యం దేవుడు నీతిమంతుడిగా మారుతాడని చెప్పదు; మానవ అసత్యానికి ఎదురుగా ఆయన సత్యం, న్యాయం ధృవీకరించబడతాయని చెబుతుంది.
- issue: ἐν τῷ κρίνεσθαί σε లో కర్తరి లేదా కర్మణి భావం
  choice: నీవు తీర్పు పొందేటప్పుడు
  alternative: నీవు తీర్పు తీర్చేటప్పుడు
  rationale: రోమా 3:4లోని గ్రీకు రూపం సహజంగా కర్మణి అర్థాన్ని ఇస్తుంది; అయితే కీర్తన 51:4 హీబ్రూ వాక్యం కర్తరి పఠనానికి ఆధారం కావడంతో దానిని పాదసూచికలో సంరక్షించాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో గౌరవప్రదమైన, సాధారణ పాఠకులకు అర్థమయ్యే శైలి. గ్రీకు వాక్యంలోని తీవ్రమైన నిరాకరణ, సత్యం–అబద్ధం మధ్య వ్యత్యాసం, న్యాయస్థాన సంబంధమైన భాష నిలుపబడ్డాయి.
