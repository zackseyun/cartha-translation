id: ROM.3.1
reference: Romans 3:1
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου, ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: te
  text: అయితే యూదునికి ఉన్న ప్రత్యేక ప్రయోజనం ఏమిటి? లేక సున్నతి వల్ల కలిగే ప్రయోజనం ఏమిటి?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేక, “సున్నతికి విలువ ఏమిటి?”
    reason: lexical_alternative
  - marker: b
    text: “యూదుడు” అనే ఏకవచనం ఇక్కడ యూదులను ఒక వర్గంగా సూచించే ప్రతినిధి ప్రయోగం.
    reason: cultural_note
lexical_decisions:
- source_word: Τί οὖν
  choice: అయితే … ఏమిటి?
  rationale: పౌలు ముందటి వాదన నుంచి తీసుకొస్తున్న నిర్ధారణాత్మక మలుపును, అలంకారప్రశ్న రూపాన్ని సహజమైన తెలుగులో నిలుపుతుంది.
- source_word: τὸ περισσὸν
  choice: ఆధిక్యం
  rationale: ఇక్కడ ఈ పదం ‘మిగులు’ అనే అక్షరార్థంలో కాక, యూదునికి ప్రత్యేకంగా ఉన్న అనుకూలత లేదా విశిష్ట ప్రయోజనాన్ని సూచిస్తుంది. ‘ఆధిక్యం’ జాతిపరమైన ఉన్నతత్వాన్ని తప్పనిసరిగా సూచించకుండా ఆ భావాన్ని సంక్షిప్తంగా అందిస్తుంది.
- source_word: τοῦ Ἰουδαίου
  choice: యూదునికి
  rationale: గ్రీకు ఏకవచనం ఒక వర్గానికి ప్రతినిధిగా ఉపయోగించబడింది. తెలుగులో ఏకవచనాన్ని ఉంచడం పౌలు ప్రశ్న నిర్మాణానికి దగ్గరగా ఉంటుంది.
- source_word: ἢ τίς
  choice: లేక … ఏమిటి?
  rationale: రెండవ సమాంతర అలంకారప్రశ్నను స్పష్టంగా కలుపుతుంది.
- source_word: ἡ ὠφέλεια
  choice: ప్రయోజనం
  rationale: ఉపయోగం, లాభం అనే భావాన్ని సాధారణ ఆధునిక తెలుగులో సహజంగా తెలియజేస్తుంది; మొదటి ప్రశ్నలోని ‘ఆధిక్యం’తో ఉన్న స్వల్ప పదభేదాన్నీ కాపాడుతుంది.
- source_word: τῆς περιτομῆς
  choice: సున్నతి వల్ల కలిగే
  rationale: సున్నతి అనే ఆచారాన్ని నేరుగా పేర్కొంటూ, దాని ప్రయోజనాన్ని ప్రశ్నిస్తున్న సంబంధాన్ని తెలుగులో సహజంగా వ్యక్తం చేస్తుంది.
theological_decisions:
- issue: Ἰουδαίου అనే ఏకవచనాన్ని వ్యక్తిగతంగా తీసుకోవాలా, వర్గాన్ని సూచించే ప్రతినిధి ఏకవచనంగా తీసుకోవాలా
  choice: వర్గాన్ని సూచించే ‘యూదునికి’ అనే ప్రతినిధి ఏకవచనం
  alternative: ‘యూదులకు’ లేదా ‘యూదుడైన వ్యక్తికి’
  rationale: మూలపాఠంలో నిర్దిష్ట ఉపపదంతో ఉన్న ఏకవచనం సాధారణ వర్గాన్ని సూచిస్తోంది. దాన్ని బహువచనంగా మార్చకుండా ఉంచడం పౌలు అలంకారశైలిని కాపాడుతుంది; అదే సమయంలో పాదసూచిక దాని వర్గార్థాన్ని స్పష్టం చేస్తుంది.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో, సాధారణ పాఠకులకు అర్థమయ్యేలా గౌరవప్రదమైన ప్రశ్నాశైలిని ఉపయోగించాం. రెండు గ్రీకు పదాలైన περισσόν, ὠφέλεια మధ్యనున్న భావసామీప్యంతో పాటు స్వల్ప వ్యత్యాసాన్ని ‘ఆధిక్యం’, ‘ప్రయోజనం’ ద్వారా నిలిపాం.
