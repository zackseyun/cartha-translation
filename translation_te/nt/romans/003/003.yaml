id: ROM.3.3
reference: Romans 3:3
language:
  code: te
  name: Telugu
  native_name: తెలుగు
  variant: modern standard Telugu
source:
  edition: SBLGNT
  text: τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: te
  text: అయితే ఏమిటి? కొందరు నమ్మకంగా లేకపోయినా, వారి అవిశ్వసనీయత దేవుని విశ్వసనీయతను రద్దు చేస్తుందా?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: లేదా, “దేవుని విశ్వాసాన్ని రద్దు చేస్తుందా?” గ్రీకు పదబంధం అక్షరార్థంగా “దేవుని విశ్వాసం”; ఇక్కడ అది బహుశా దేవుని విశ్వసనీయతను సూచిస్తుంది.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: అయితే ఏమిటి?
  rationale: పౌలు వాదనలో అభ్యంతరాన్ని లేదా తదుపరి నిర్ధారణను ప్రవేశపెట్టే సంక్షిప్త ప్రశ్నగా సహజమైన ఆధునిక తెలుగు రూపం.
- source_word: ἠπίστησάν
  choice: నమ్మకంగా ఉండకపోతే
  rationale: ‘నమ్మలేదు’ అనే అర్థం సాధ్యమైనా, వెంటనే వచ్చే ἀπιστία మరియు దేవుని πίστις మధ్య వ్యతిరేక సమాంతరత ఇక్కడ నమ్మకత్వం/అపనమ్మకత్వం భావాన్ని బలపరుస్తుంది.
- source_word: τινες
  choice: కొందరు
  rationale: నిర్దిష్టంగా పేరుచెప్పని బహువచన సమూహాన్ని సహజంగా సూచిస్తుంది.
- source_word: ἀπιστία
  choice: అపనమ్మకత్వం
  rationale: ἠπίστησάνతో పదసంబంధాన్ని, దేవుని నమ్మకత్వంతో ఉన్న వ్యతిరేకతను నిలుపుతుంది; ‘అవిశ్వాసం’ కూడా సాధ్యమైన ప్రత్యామ్నాయం.
- source_word: πίστιν τοῦ θεοῦ
  choice: దేవుని నమ్మకత్వం
  rationale: గ్రీకు పదబంధం అక్షరార్థంగా ‘దేవుని విశ్వాసం’; అయితే మానవ అపనమ్మకత్వానికి వ్యతిరేకంగా ఇక్కడ దేవుని విశ్వసనీయత లేదా నమ్మకత్వం సహజ సందర్భార్థం.
- source_word: καταργήσει
  choice: నిర్వీర్యం చేస్తుందా?
  rationale: ఏదైనా ప్రభావం లేకుండా లేదా చెల్లకుండా చేయడం అనే క్రియాభావాన్ని స్పష్టంగా తెలియజేస్తుంది.
theological_decisions:
- issue: πίστιν τοῦ θεοῦ అనే వివాదాస్పద పౌలు పదబంధం
  choice: దేవుని నమ్మకత్వం
  alternative: దేవుని విశ్వాసం
  rationale: మానవ ἀπιστίαకు దేవుని πίστιςను వ్యతిరేకంగా ఉంచడం వల్ల ‘నమ్మకత్వం’ సందర్భానికి అత్యంత సహజం. అయినప్పటికీ గ్రీకు నిర్మాణంలోని నిజమైన అస్పష్టతను పాదసూచికలో నిలిపాం.
translation_notes:
  register: ఆధునిక ప్రామాణిక తెలుగులో సహజమైన, గౌరవప్రదమైన ప్రశ్నారూపం. ‘నమ్మకంగా ఉండకపోతే—అపనమ్మకత్వం—నమ్మకత్వం’ అనే పదసంబంధం ద్వారా మూలంలోని వాక్చాతుర్య సమాంతరతను సాధ్యమైనంతవరకు కాపాడింది.
